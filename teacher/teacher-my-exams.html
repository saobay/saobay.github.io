<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đề thi của tôi - SAOBAY</title>
<style>
body{font-family:system-ui;margin:0;padding:16px;background:#f3f4f6}
h1{font-size:20px}
.card{background:#fff;border-radius:8px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
button{padding:10px 20px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:15px;margin-right:8px}
button.active{background:#1e40af}
ul{list-style:none;padding:0}
li{padding:10px;border-bottom:1px solid #eee}
small{color:#888}
.filter{margin-bottom:12px}
</style>
</head>
<body>
<h1>📝 Đề thi đã tải lên</h1>
<div class="card">
<div class="filter">
<button onclick="load('all')" id="f-all" class="active">Tất cả đề</button>
<button onclick="load('word')" id="f-word">Từ Word</button>
<button onclick="load('ai')" id="f-ai">Từ AI</button>
<button onclick="load('bank')" id="f-bank">Từ Bank</button>
</div>
<div id="list"><p style="color:#666">Bấm nút để tải.</p></div>
</div>
<p><a href="teacher-hub.html">← Về Teacher Hub</a></p>
<script>
var allFiles=[];
async function load(type){
  document.querySelectorAll('.filter button').forEach(function(b){b.classList.remove('active');});
  document.getElementById('f-'+type).classList.add('active');
  var l=document.getElementById('list');
  if(!allFiles.length){
    l.innerHTML='<p>⏳ Đang tải...</p>';
    try{
      var r=await fetch('https://api.github.com/repos/saobay/saobay.github.io/git/trees/main?recursive=1');
      var d=await r.json();
      // Đề thi: file HTML không phải lý thuyết/bài tập, hoặc có _gv, hoặc trong thư mục kiểm tra
      allFiles=d.tree.filter(function(i){
        if(i.type!=='blob'||!i.path.endsWith('.html'))return false;
        if(i.path.indexOf('data/')!==0)return false;
        var n=i.path.toLowerCase();
        if(n.indexOf('data/bank')===0||n.indexOf('data/scores')===0)return false;
        // Loại lý thuyết/bài tập có tên chuẩn
        if(n.indexOf('_bai_tap_')>=0||n.indexOf('_ly_thuyet_')>=0)return false;
        if(n.indexOf('bai_tap_none')>=0||n.indexOf('ly_thuyet_none')>=0)return false;
        return true;
      });
    }catch(e){l.innerHTML='<p style="color:red">Lỗi: '+e.message+'</p>';return;}
  }
  var f=allFiles;
  // Lọc theo loại (dựa vào tên file hoặc metadata - tạm thời hiện tất cả)
  if(!f.length){l.innerHTML='<p>Chưa có đề thi nào. Đề thi tải lên qua Word/AI/Bank sẽ hiện ở đây.</p>';return;}
  var h='<p><b>'+f.length+'</b> đề:</p><ul>';
  f.forEach(function(x){
    var n=x.path.split('/').pop().replace('.html','');
    h+='<li>📝 <b>'+n+'</b><br><small>'+x.path+'</small> ';
    h+='<a href="https://saobay.github.io/'+x.path+'" target="_blank" style="color:#2563eb">Mở</a></li>';
  });
  l.innerHTML=h+'</ul>';
}
</script>
</body>
</html>
