<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bảng Điểm - SAOBAY</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
body{font-family:system-ui,-apple-system,sans-serif}
.exam-item.active{background:#eef2ff;border-color:#6366f1}
</style>
</head>
<body class="bg-slate-50 min-h-screen">
<div class="max-w-6xl mx-auto px-3 py-4">
    <div class="flex flex-wrap items-center gap-2 mb-4">
        <h1 class="text-xl font-black text-slate-900"><i class="fa-solid fa-chart-column text-emerald-600 mr-2"></i>Bảng Điểm Học Sinh</h1>
        <span id="user-badge" class="text-xs text-slate-500"></span>
        <a href="teacher-hub.html" class="ml-auto text-xs font-bold text-indigo-700 hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i>Teacher Hub</a>
    </div>

    <div id="login-warn" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-4 text-sm text-amber-900 mb-4">
        Bạn chưa đăng nhập. <a href="../used/used.html" class="font-bold underline">Đăng nhập tại đây</a> để xem bảng điểm theo phân công của mình.
    </div>

    <div id="assign-info" class="bg-white border border-slate-200 rounded-xl p-3 mb-4 text-xs text-slate-600"></div>

    <div class="grid md:grid-cols-3 gap-4">
        <div class="md:col-span-1">
            <h2 class="text-sm font-black text-slate-700 mb-2">Danh sách đề thi có bài nộp</h2>
            <div id="exam-list" class="space-y-2 max-h-[70vh] overflow-y-auto pr-1">
                <p class="text-xs text-slate-400 italic">Đang tải...</p>
            </div>
        </div>
        <div class="md:col-span-2">
            <div class="flex flex-wrap items-center gap-2 mb-2">
                <h2 id="result-title" class="text-sm font-black text-slate-700">Chọn một đề thi để xem bảng điểm</h2>
                <select id="class-filter" class="hidden ml-auto text-xs border rounded-lg px-2 py-1.5 font-semibold">
                    <option value="">Tất cả các lớp</option>
                </select>
                <select id="pv-class-filter" class="hidden text-xs border border-violet-300 rounded-lg px-2 py-1.5 font-semibold text-violet-800">
                    <option value="">Lớp học thêm: tất cả</option>
                </select>
                <button id="csv-btn" onclick="exportCsv()" class="hidden text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg">
                    <i class="fa-solid fa-file-csv mr-1"></i>Xuất CSV
                </button>
                <button id="del-all-btn" onclick="deleteAllScores()" class="hidden text-xs font-bold bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-lg" title="Xóa TẤT CẢ bài nộp của đề này (reset thống kê)">
                    <i class="fa-solid fa-trash mr-1"></i>Xóa tất cả
                </button>
            </div>
            <div id="result-body" class="bg-white border border-slate-200 rounded-xl overflow-hidden">
                <p class="text-xs text-slate-400 italic p-4">Chưa chọn đề thi.</p>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    'use strict';
    const OWNER = 'saobay', REPO = 'saobay.github.io', BRANCH = 'main';
    const SCORES_DIR = 'data/scores';
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxXntnyiuk4NaQgSfjMu3eZSum-nHIOh4oPM8XMcthn55ExTAnq1AUXk3GLzVFE2Kq7/exec';
    // Xoa bai nop qua GAS proxy (khong can token ca nhan).
    // GAS proxy chi ho tro PUSH_TO_GITHUB (khong co DELETE) nen "xoa" = ghi de
    // file thanh "null". rawJson() parse ra null -> bi filter(Boolean) loai bo
    // -> dong bien mat khoi bang diem.
    async function gasClearScore(filePath, commitMessage){
        let author = (sessionUser && (sessionUser.name || sessionUser.id)) || 'Admin';
        for (let attempt = 0; attempt < 3; attempt++){
            let res = await fetch(GAS_URL, {
                method: 'POST',
                headers: {'Content-Type': 'text/plain;charset=utf-8'},
                body: JSON.stringify({ type: 'PUSH_TO_GITHUB', filePath: filePath, content: 'null', commitMessage: commitMessage, title: commitMessage, author: author })
            });
            let j = await res.json();
            if (j && j.status === 'success') return true;
            let msg = String((j && j.message) || '');
            if (msg.indexOf('409') < 0) throw new Error(msg || 'Xóa thất bại.');
            await new Promise(function(r){ setTimeout(r, 1200); });
        }
        throw new Error('Không xóa được, vui lòng thử lại.');
    }
    let sessionUser = null, mySubjects = [], exams = [], curResults = [], curExamId = '';
    let pvClasses = [];
    loadPvClasses();
    async function loadPvClasses(){
        try {
            let r = await fetch('https://raw.githubusercontent.com/saobay/saobay.github.io/main/data/private/classes.json?t=' + Date.now());
            if (r.ok){ let j = await r.json(); pvClasses = j.classes || []; }
        } catch(e){}
    }
    function pvMyClasses(){
        let me = null;
        try { me = JSON.parse(localStorage.getItem('saobay_user') || 'null'); } catch(e){}
        if (!me) return [];
        if (me.role === 'bgh') return []; // BGH khong xem lop hoc them
        if (me.role === 'admin') return pvClasses;
        return pvClasses.filter(function(c){ return c.teacher_id === me.id; });
    }

    function norm(s){
        return String(s == null ? '' : s).toLowerCase().normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').trim();
    }
    function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function token(){ try { return localStorage.getItem('saobay_github_token') || ''; } catch(e){ return ''; } }
    function encPath(p){ return p.split('/').map(function(x){ return encodeURIComponent(x); }).join('/'); }

    async function apiListDir(path){
        let url = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + encPath(path) + '?ref=' + BRANCH;
        let headers = { 'Accept': 'application/vnd.github+json' };
        let tk = token(); if (tk) headers['Authorization'] = 'Bearer ' + tk;
        let res = await fetch(url, { headers: headers });
        if (res.status === 404) return [];
        if (!res.ok) throw new Error('GitHub API ' + res.status);
        return res.json();
    }
    async function rawJson(path){
        let url = 'https://raw.githubusercontent.com/' + OWNER + '/' + REPO + '/' + BRANCH + '/' + encPath(path) + '?t=' + Date.now();
        let res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
    }
    function fmtTime(iso){
        try { return new Date(iso).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' }); }
        catch(e){ return iso || ''; }
    }
    function seenKey(id){ return 'saobay_seen_' + id; }
    function getSeen(id){ try { return localStorage.getItem(seenKey(id)) || ''; } catch(e){ return ''; } }
    function setSeen(id, ts){ try { localStorage.setItem(seenKey(id), ts); } catch(e){} }
    // timestamp trong tên file: 20261008153000_Ten.json
    function tsFromName(name){
        let m = String(name).match(/^(\d{14})_/);
        return m ? m[1] : '';
    }

    async function init(){
        try { sessionUser = JSON.parse(localStorage.getItem('saobay_user') || 'null'); } catch(e){}
        if (!sessionUser){
            document.getElementById('login-warn').classList.remove('hidden');
        } else {
            document.getElementById('user-badge').textContent = '• ' + (sessionUser.name || '') + ' (' + (sessionUser.role || '') + ')';
        }
        // 1. nạp phân công + lớp riêng
        let assigns = [], customClasses = [];
        try {
            let used = await rawJson('used/used.is');
            assigns = Array.isArray(used.assignments) ? used.assignments : [];
            let customs = Array.isArray(used.custom_classes) ? used.custom_classes : [];
            let me = sessionUser ? String(sessionUser.id) : '';
            if (sessionUser && sessionUser.role === 'admin') customClasses = customs;
            else customClasses = customs.filter(function(c){ return String(c.created_by) === me; });
        } catch(e){
            document.getElementById('assign-info').innerHTML = '<span class="text-rose-600">Không tải được phân công chuyên môn.</span>';
        }
        if (sessionUser && sessionUser.role !== 'admin' && sessionUser.role !== 'bgh'){
            let uname = norm(sessionUser.name), uid = String(sessionUser.id || '');
            assigns = assigns.filter(function(a){
                let t = String(a.teachers || '');
                return (uname && norm(t.replace(/\(.*?\)/g, '')).indexOf(uname) >= 0) || (uid && t.indexOf(uid) >= 0);
            });
        }
        mySubjects = assigns;
        let info = document.getElementById('assign-info');
        let isPriv = sessionUser && (sessionUser.role === 'admin' || sessionUser.role === 'bgh');
        if (isPriv){
            // Admin/BGH: an han dong phan cong roi mat, chi hien che do xem
            info.innerHTML = '<i class="fa-solid fa-circle-info mr-1"></i>Chế độ ' + (sessionUser.role === 'bgh' ? 'Ban Giám Hiệu' : 'admin') + ': xem tất cả các đề thi.';
            info.style.display = '';
        } else if (!assigns.length){
            info.innerHTML = '<i class="fa-solid fa-circle-info mr-1"></i>Bạn chưa được phân công môn nào (liên hệ admin).';
            info.style.display = '';
        } else {
            let uniq = {};
            assigns.forEach(function(a){ uniq[a.subject + ' (lớp ' + a.class + ')'] = 1; });
            let parts = Object.keys(uniq);
            // Gioi han hien thi toi da 10 muc, con lai gon vao "..."
            let shown = parts.slice(0, 10);
            let more = parts.length - shown.length;
            customClasses.forEach(function(c){ shown.push('Lớp riêng: ' + c.name); });
            info.innerHTML = '<i class="fa-solid fa-clipboard-check text-indigo-600 mr-1"></i><b>Phân công của bạn:</b> '
                + esc(shown.join(' • ')) + (more > 0 ? ' <span class="text-slate-400">• ... (+' + more + ')</span>' : '');
            info.style.display = '';
        }
        // 2. liệt kê đề thi có bài nộp
        await loadExams();
    }

    function examSubjectGrade(examId){
        let m = String(examId).match(/^([A-Z]+)_(\d{1,2})/);
        return m ? { subject: norm(m[1]), grade: parseInt(m[2], 10) } : { subject: '', grade: 0 };
    }
    function myExamFilter(exam){
        if (!sessionUser || sessionUser.role === 'admin' || sessionUser.role === 'bgh') return true; // BGH xem tat ca cac mon
        if (!mySubjects.length) return false;
        let sg = (exam && (exam.subject || exam.grade))
            ? { subject: norm(exam.subject), grade: parseInt(exam.grade, 10) || 0 }
            : examSubjectGrade(exam.id || exam);
        return mySubjects.some(function(a){
            let sOk = norm(a.subject) === sg.subject;
            let gOk = !sg.grade || String(a.class || '').indexOf(String(sg.grade)) === 0;
            return sOk && gOk;
        });
    }

    async function loadExams(){
        let listEl = document.getElementById('exam-list');
        try {
            let dirs = await apiListDir(SCORES_DIR);
            dirs = dirs.filter(function(d){ return d.type === 'dir'; });
            exams = [];
            for (let d of dirs){
                let files = [];
                try { files = (await apiListDir(SCORES_DIR + '/' + d.name)).filter(function(f){ return f.type === 'file' && /\.json$/i.test(f.name); }); }
                catch(e){}
                files.sort(function(a, b){ return a.name < b.name ? 1 : -1; });
                // doc 1 bai mau de lay ten de / mon / khoi that (khong phu thuoc ten thu muc)
                let sample = null;
                if (files.length){
                    try { sample = await rawJson(SCORES_DIR + '/' + d.name + '/' + files[0].name); } catch(eS){}
                }
                let exam = { id: d.name, count: files.length,
                    title: (sample && sample.exam_title) || d.name.replace(/_/g, ' '),
                    subject: sample ? sample.subject : '', grade: sample ? sample.grade : 0,
                    latestTs: files.length ? tsFromName(files[0].name) : '',
                    files: files };
                exam.isNew = !!(exam.latestTs && exam.latestTs > getSeen(d.name));
                if (!myExamFilter(exam)) continue;
                exams.push(exam);
            }
            exams.sort(function(a, b){ return (b.latestTs || '') < (a.latestTs || '') ? -1 : 1; });
            if (!exams.length){
                listEl.innerHTML = '<p class="text-xs text-slate-400 italic">Chưa có bài nộp nào cho phân công của bạn.</p>';
                return;
            }
            listEl.innerHTML = exams.map(function(x){
                return '<button onclick="selectExam(\'' + x.id.replace(/'/g, "\\'") + '\')" data-exam="' + esc(x.id) + '"'
                    + ' class="exam-item w-full text-left bg-white border border-slate-200 rounded-xl px-3 py-2.5 hover:border-indigo-300 transition">'
                    + '<p class="text-xs font-bold text-slate-800 leading-snug">' + esc(x.title) + '</p>'
                    + '<p class="text-[11px] text-slate-500 mt-0.5">' + x.count + ' bài nộp'
                    + (x.isNew ? ' <span class="ml-1 bg-rose-600 text-white font-bold px-1.5 py-0.5 rounded-full text-[10px]">MỚI</span>' : '')
                    + '</p></button>';
            }).join('');
        } catch(e){
            listEl.innerHTML = '<p class="text-xs text-rose-600">Lỗi tải danh sách: ' + esc(e.message || e) + '</p>';
        }
    }

    window.selectExam = async function(examId){
        curExamId = examId;
        document.querySelectorAll('.exam-item').forEach(function(el){
            el.classList.toggle('active', el.getAttribute('data-exam') === examId);
        });
        let body = document.getElementById('result-body');
        let title = document.getElementById('result-title');
        title.textContent = 'Đang tải bảng điểm...';
        body.innerHTML = '<p class="text-xs text-slate-400 italic p-4"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Đang tải...</p>';
        try {
            let exam = exams.find(function(x){ return x.id === examId; });
            let files = exam ? exam.files : [];
            let results = await Promise.all(files.map(function(f){
                return rawJson(SCORES_DIR + '/' + examId + '/' + f.name).then(function(j){ if (j) j._fileName = f.name; return j; }).catch(function(){ return null; });
            }));
            curResults = results.filter(Boolean).sort(function(a, b){
                return String(b.submitted_at || '') < String(a.submitted_at || '') ? -1 : 1;
            });
            if (exam && exam.latestTs) setSeen(examId, exam.latestTs);
            renderTable();
            loadExams(); // refresh badge MỚI
        } catch(e){
            body.innerHTML = '<p class="text-xs text-rose-600 p-4">Lỗi: ' + esc(e.message || e) + '</p>';
        }
    };

    function renderTable(){
        let body = document.getElementById('result-body');
        let title = document.getElementById('result-title');
        let cf = document.getElementById('class-filter');
        let csvBtn = document.getElementById('csv-btn');
        let delAllBtn = document.getElementById('del-all-btn');
        if (delAllBtn) delAllBtn.classList.toggle('hidden', !(sessionUser && (sessionUser.role === 'admin' || sessionUser.role === 'teacher' || sessionUser.role === 'bgh') && curResults.length));
        let curExam = exams.find(function(x){ return x.id === curExamId; });
        title.textContent = (curExam && curExam.title ? curExam.title : curExamId.replace(/_/g, ' ')) + ' (' + curResults.length + ' bài)';
        if (!curResults.length){
            body.innerHTML = '<p class="text-xs text-slate-400 italic p-4">Chưa có bài nộp.</p>';
            cf.classList.add('hidden'); csvBtn.classList.add('hidden');
            return;
        }
        let classes = {};
        curResults.forEach(function(r){ if (r.student_class) classes[r.student_class] = 1; });
        let cls = Object.keys(classes).sort();
        cf.innerHTML = '<option value="">Tất cả các lớp (' + cls.length + ')</option>'
            + cls.map(function(c){ return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
        cf.classList.remove('hidden'); csvBtn.classList.remove('hidden');
        cf.onchange = renderTable;
        // Dropdown lop hoc them
        let pvcf = document.getElementById('pv-class-filter');
        let mine = pvMyClasses();
        if (mine.length){
            pvcf.innerHTML = '<option value="">Lớp học thêm: tất cả</option>'
                + mine.map(function(c){ return '<option value="' + c.id + '">' + esc(c.name) + ' (' + (c.students||[]).length + ' HS)</option>'; }).join('');
            pvcf.classList.remove('hidden');
            pvcf.onchange = renderTable;
        } else pvcf.classList.add('hidden');
        let f = cf.value;
        let pvf = pvcf.value;
        let rows = curResults.filter(function(r){ return !f || r.student_class === f; });
        if (pvf){
            let cls = pvClasses.find(function(c){ return c.id === pvf; });
            let names = {};
            (cls && cls.students || []).forEach(function(st){ names[norm(st.name)] = 1; });
            rows = rows.filter(function(r){ return names[norm(r.student_name)]; });
        }
        let h = '<div class="overflow-x-auto"><table class="w-full text-xs"><thead><tr class="bg-slate-100 text-slate-600">'
            + '<th class="px-2 py-2 text-left">STT</th><th class="px-2 py-2 text-left">Họ tên</th><th class="px-2 py-2 text-left">Lớp</th>'
            + '<th class="px-2 py-2 text-right">Điểm</th><th class="px-2 py-2 text-right">Đúng</th><th class="px-2 py-2 text-left">Nộp lúc</th>'
            + '<th class="px-2 py-2 text-center">Xem</th>'
            + ((sessionUser && (sessionUser.role === 'admin' || sessionUser.role === 'teacher' || sessionUser.role === 'bgh')) ? '<th class="px-2 py-2 text-center">Xóa</th>' : '')
            + '</tr></thead><tbody>';
        rows.forEach(function(r, i){
            let pct = (r.max_score > 0) ? Math.round(r.score / r.max_score * 100) : 0;
            let color = pct >= 80 ? 'text-emerald-700' : (pct >= 50 ? 'text-amber-700' : 'text-rose-700');
            h += '<tr class="border-t hover:bg-slate-50">'
                + '<td class="px-2 py-2 text-slate-400">' + (i+1) + '</td>'
                + '<td class="px-2 py-2 font-semibold">' + esc(r.student_name) + '</td>'
                + '<td class="px-2 py-2">' + esc(r.student_class) + '</td>'
                + '<td class="px-2 py-2 text-right font-black ' + color + '">' + esc(r.score) + '/' + esc(r.max_score) + '</td>'
                + '<td class="px-2 py-2 text-right text-slate-500">' + esc(r.correct) + '/' + esc(r.total) + '</td>'
                + '<td class="px-2 py-2 text-slate-500 whitespace-nowrap">' + esc(fmtTime(r.submitted_at)) + '</td>'
                + '<td class="px-2 py-2 text-center"><button onclick="viewScoreDetail(' + i + ')" title="Xem bài làm chi tiết" class="text-blue-600 hover:text-blue-800 hover:bg-blue-50 px-2 py-1 rounded"><i class="fa-solid fa-eye"></i></button></td>'
                + ((sessionUser && (sessionUser.role === 'admin' || sessionUser.role === 'teacher' || sessionUser.role === 'bgh')) ? '<td class="px-2 py-2 text-center"><button onclick="deleteScore(\'' + esc(r._fileName || '') + '\', \'' + esc(r.student_name || '') + '\')" title="Xóa bài nộp này" class="text-rose-600 hover:text-rose-800 hover:bg-rose-50 px-2 py-1 rounded"><i class="fa-solid fa-trash"></i></button></td>' : '')
                + '</tr>';
        });
        body.innerHTML = h + '</tbody></table></div>';
    }

    // Xem chi tiết bài làm của HS (2026-10-10)
    window.viewScoreDetail = function(idx){
        var r = curResults[idx];
        if (!r) return;
        var h = '<div class="p-4 max-h-[70vh] overflow-y-auto">';
        h += '<h3 class="font-bold text-lg mb-1">' + esc(r.student_name || '') + ' <span class="text-sm font-normal text-slate-500">' + esc(r.student_class || '') + '</span></h3>';
        h += '<p class="text-sm text-slate-600 mb-3">Điểm: <b class="text-emerald-700">' + esc(r.score) + '/' + esc(r.max_score) + '</b> • Đúng ' + esc(r.correct) + '/' + esc(r.total) + ' câu • Nộp lúc ' + esc(fmtTime(r.submitted_at)) + '</p>';
        var ans = r.answers || r.details || [];
        if (Array.isArray(ans) && ans.length){
            h += '<table class="w-full text-xs border"><thead><tr class="bg-slate-100"><th class="px-2 py-1 text-left">Câu</th><th class="px-2 py-1 text-left">HS chọn</th><th class="px-2 py-1 text-left">Đáp án đúng</th><th class="px-2 py-1 text-center">KQ</th></tr></thead><tbody>';
            ans.forEach(function(a, j){
                var sa = (a.student_answer !== undefined) ? a.student_answer : (a.answer || '');
                var ca = a.correct_answer || '';
                var ok = (a.correct === true) || (String(sa) === String(ca) && sa !== '');
                h += '<tr class="border-t"><td class="px-2 py-1">' + (j+1) + '</td>'
                    + '<td class="px-2 py-1 font-semibold">' + esc(String(sa)) + '</td>'
                    + '<td class="px-2 py-1 text-emerald-700">' + esc(String(ca)) + '</td>'
                    + '<td class="px-2 py-1 text-center">' + (ok ? '<span class="text-emerald-600 font-bold">✓</span>' : '<span class="text-rose-600 font-bold">✗</span>') + '</td></tr>';
            });
            h += '</tbody></table>';
        } else {
            h += '<p class="text-xs text-slate-400 italic">Không có chi tiết từng câu trong file điểm này.</p>';
            h += '<pre class="text-[10px] bg-slate-50 border rounded p-2 mt-2 overflow-x-auto">' + esc(JSON.stringify(r, null, 1).substring(0, 2000)) + '</pre>';
        }
        h += '</div>';
        var m = document.getElementById('score-detail-modal');
        if (!m){
            m = document.createElement('div');
            m.id = 'score-detail-modal';
            m.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4';
            m.innerHTML = '<div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full"><div class="flex justify-end p-2"><button onclick="document.getElementById(\'score-detail-modal\').remove()" class="text-slate-400 hover:text-slate-700 text-xl px-2">×</button></div><div id="score-detail-body"></div></div>';
            m.addEventListener('click', function(e){ if (e.target === m) m.remove(); });
            document.body.appendChild(m);
        }
        document.getElementById('score-detail-body').innerHTML = h;
    };


    window.deleteScore = async function(fileName, studentName){
        if (!fileName) { alert('Không xác định được file điểm.'); return; }
        if (!confirm('Xóa bài nộp của "' + studentName + '"?\nFile: ' + fileName + '\n\nHành động này không thể hoàn tác!')) return;
        try {
            let path = SCORES_DIR + '/' + curExamId + '/' + fileName;
            await gasClearScore(path, 'Admin xóa bài nộp: ' + studentName + ' (' + fileName + ')');
            // Xoa ngay tren du lieu local (khong tai lai tu CDN vi raw.githubusercontent.com cache manh)
            curResults = curResults.filter(function(r){ return r._fileName !== fileName; });
            renderTable();
            alert('Đã xóa bài nộp của "' + studentName + '".');
        } catch(e){ alert('Lỗi xóa: ' + (e.message || e)); }
    };

    window.deleteAllScores = async function(){
        if (!curResults.length) return;
        let n = curResults.length;
        if (!confirm('Xóa TẤT CẢ ' + n + ' bài nộp của đề này?\n\nThống kê sẽ về 0. Hành động không thể hoàn tác!')) return;
        if (!confirm('Xác nhận lần cuối: XÓA HẾT ' + n + ' bài nộp?')) return;
        let ok = 0, fail = 0;
        let deletedFiles = [];
        for (let r of curResults) {
            if (!r._fileName) { fail++; continue; }
            try {
                let path = SCORES_DIR + '/' + curExamId + '/' + r._fileName;
                await gasClearScore(path, 'Admin reset thống kê: xóa ' + r._fileName);
                deletedFiles.push(r._fileName);
                ok++;
            } catch(e){ fail++; }
        }
        // Xoa ngay tren du lieu local (khong tai lai tu CDN vi cache manh)
        if (deletedFiles.length){
            let delSet = {};
            deletedFiles.forEach(function(f){ delSet[f] = 1; });
            curResults = curResults.filter(function(r){ return !delSet[r._fileName]; });
            renderTable();
        }
        alert('Đã xóa ' + ok + '/' + n + ' bài nộp.' + (fail ? ' Thất bại: ' + fail : ''));
    };

    window.exportCsv = function(){
        if (!curResults.length) return;
        let rows = [['STT','Ho ten','Lop','Diem','Diem toi da','Cau dung','Tong cau','Nop luc','De thi']];
        curResults.forEach(function(r, i){
            rows.push([i+1, r.student_name, r.student_class, r.score, r.max_score, r.correct, r.total, r.submitted_at, r.exam_title]);
        });
        let csv = '﻿' + rows.map(function(row){
            return row.map(function(c){ return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(',');
        }).join('\n');
        let blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'bang-diem-' + curExamId + '.csv';
        document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    };

    init();
})();
</script>
<script src="../js/admin-toolbar.js"></script>
</body>
</html>
