{"sets": [{"name": "Đề 2", "questions": [{"type": "mcq", "level": "VDC", "q": "Cho các dữ kiện nhiệt hóa học (hiệu ứng nhiệt đo ở điều kiện đẳng áp): (1) $12{,}0\\,g$ Ca cháy hoàn toàn tỏa ra $45{,}57\\,kcal$; (2) $6{,}2\\,g$ P cháy hoàn toàn tỏa ra $37{,}00\\,kcal$; (3) $168{,}0\\,g$ CaO tác dụng với $142{,}0\\,g$ $P_2O_5$ tỏa ra $160{,}50\\,kcal$. Enthalpy tạo thành chuẩn của $Ca_3(PO_4)_2$ (kcal/mol) xấp xỉ", "options": ["A. $-986{,}2$", "B. $-654{,}3$", "C. $-826{,}1$", "D. $-1146{,}7$"], "answer": "A", "explain": "Áp dụng định luật Hess cho phản ứng tạo thành: $3Ca(s) + 2P(s) + 4O_2(g) \\rightarrow Ca_3(PO_4)_2(s)$. Từ (1): $12\\,g\\,Ca = 0{,}3\\,mol$ nên $\\Delta H_1 = -45{,}57/0{,}3 = -151{,}9\\,kcal/mol$ cho $Ca + \\frac{1}{2}O_2 \\rightarrow CaO$. Từ (2): $6{,}2\\,g\\,P = 0{,}2\\,mol$ nên $\\Delta H_2 = -37{,}00/0{,}2 = -185{,}0\\,kcal/mol$ cho $P + \\frac{5}{4}O_2 \\rightarrow \\frac{1}{2}P_2O_5$. Từ (3): $168\\,g\\,CaO = 3\\,mol$, $142\\,g\\,P_2O_5 = 1\\,mol$ nên $\\Delta H_3 = -160{,}5\\,kcal$ cho $3CaO + P_2O_5 \\rightarrow Ca_3(PO_4)_2$. Cộng: $3 \\times \\Delta H_1 + 2 \\times \\Delta H_2 + \\Delta H_3 = 3(-151{,}9) + 2(-185{,}0) + (-160{,}5) = -986{,}2\\,kcal/mol$. Bẫy thường gặp: quên nhân hệ số tỉ lượng 3 và 2; nhầm khối lượng mol của CaO ($56$) và $P_2O_5$ ($142$).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Biết enthalpy thăng hoa của carbon graphite thành $C(g)$ là $717\\,kJ/mol$; năng lượng liên kết $E_{H-H} = 436\\,kJ/mol$, $E_{C-H} = 413\\,kJ/mol$. Enthalpy tạo thành của $CH_4(g)$ tính theo năng lượng liên kết xấp xỉ", "options": ["A. $-63\\,kJ/mol$", "B. $-1652\\,kJ/mol$", "C. $+63\\,kJ/mol$", "D. $-75\\,kJ/mol$"], "answer": "A", "explain": "Viết chu trình: $C(graphite) \\rightarrow C(g)$ ($+717\\,kJ$), $2H_2(g) \\rightarrow 4H(g)$ ($2 \\times 436 = 872\\,kJ$), rồi $C(g) + 4H(g) \\rightarrow CH_4(g)$ tạo 4 liên kết C-H tỏa $4 \\times 413 = 1652\\,kJ$. Suy ra $\\Delta H_{tt} = 717 + 872 - 1652 = -63\\,kJ/mol$. Đây là giá trị ước tính (thực nghiệm $-74{,}8\\,kJ/mol$); sai số do năng lượng liên kết trung bình không phản ánh đúng từng liên kết cụ thể. Bẫy thường gặp: quên cộng enthalpy thăng hoa của carbon (đáp án B); nhầm dấu (đáp án C).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phản ứng phân hủy $A \\rightarrow$ sản phẩm tuân theo động học bậc 1 với hằng số tốc độ $k = 2{,}5 \\times 10^{-3}\\,s^{-1}$. Thời gian cần thiết để $90\\%$ lượng A ban đầu bị phân hủy là", "options": ["A. $921\\,s$", "B. $277\\,s$", "C. $460\\,s$", "D. $1386\\,s$"], "answer": "A", "explain": "Với phản ứng bậc 1: $\\ln\\frac{[A]_0}{[A]} = kt$. Khi $90\\%$ đã phản ứng thì còn lại $10\\%$, tức $[A]/[A]_0 = 0{,}1$. Suy ra $t = \\frac{1}{k}\\ln\\frac{1}{0{,}1} = \\frac{\\ln 10}{2{,}5 \\times 10^{-3}} = \\frac{2{,}303}{2{,}5 \\times 10^{-3}} \\approx 921\\,s$ (khoảng $15{,}4$ phút). Bẫy thường gặp: đáp án B ($277\\,s$) chính là chu kỳ bán hủy $t_{1/2} = \\ln 2/k$ chứ không phải thời gian phân hủy $90\\%$; đáp án D là thời gian phân hủy $97\\%$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hằng số tốc độ của một phản ứng tăng gấp đôi khi nhiệt độ tăng từ $300\\,K$ lên $310\\,K$. Năng lượng hoạt hóa của phản ứng xấp xỉ (lấy $R = 8{,}314\\,J/(mol \\cdot K)$)", "options": ["A. $53{,}6\\,kJ/mol$", "B. $26{,}8\\,kJ/mol$", "C. $107{,}2\\,kJ/mol$", "D. $5{,}36\\,kJ/mol$"], "answer": "A", "explain": "Áp dụng phương trình Arrhenius dạng tích phân: $\\ln\\frac{k_2}{k_1} = \\frac{E_a}{R}\\left(\\frac{1}{T_1} - \\frac{1}{T_2}\\right)$. Thay số: $\\ln 2 = \\frac{E_a}{8{,}314}\\left(\\frac{1}{300} - \\frac{1}{310}\\right) = \\frac{E_a}{8{,}314} \\times \\frac{10}{93000}$. Suy ra $E_a = \\frac{0{,}693 \\times 8{,}314 \\times 93000}{10} \\approx 53590\\,J/mol \\approx 53{,}6\\,kJ/mol$. Bẫy thường gặp: quên đổi $E_a$ ra kJ (đáp án D); tính $\\frac{1}{T_1} - \\frac{1}{T_2}$ sai do không quy đồng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ở một nhiệt độ xác định, phản ứng $N_2(g) + 3H_2(g) \\rightleftharpoons 2NH_3(g)$ có $K_c = 0{,}5$. Một bình kín dung tích $2\\,L$ chứa $1\\,mol$ $N_2$, $3\\,mol$ $H_2$ và $1\\,mol$ $NH_3$. Nhận định đúng về chiều diễn biến của phản ứng là", "options": ["A. Phản ứng diễn ra theo chiều thuận", "B. Phản ứng diễn ra theo chiều nghịch", "C. Hệ đã đạt trạng thái cân bằng", "D. Không đủ dữ kiện kết luận"], "answer": "A", "explain": "Tính nồng độ: $[N_2] = 0{,}5\\,M$, $[H_2] = 1{,}5\\,M$, $[NH_3] = 0{,}5\\,M$. Thương số phản ứng $Q_c = \\frac{[NH_3]^2}{[N_2][H_2]^3} = \\frac{0{,}5^2}{0{,}5 \\times 1{,}5^3} = \\frac{0{,}25}{1{,}6875} \\approx 0{,}148$. Vì $Q_c \\lt K_c$ ($0{,}148 \\lt 0{,}5$) nên phản ứng diễn ra theo chiều thuận để tạo thêm $NH_3$. Bẫy thường gặp: dùng số mol thay cho nồng độ khi tính $Q_c$ (với $\\Delta n \\ne 0$ sẽ cho kết quả sai); nhầm chiều so sánh $Q$ với $K$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một phản ứng có $\\Delta H = -120\\,kJ/mol$ và $\\Delta S = -150\\,J/(mol \\cdot K)$ (coi không đổi theo nhiệt độ). Phản ứng tự diễn biến ($\\Delta G \\lt 0$) khi", "options": ["A. $T \\lt 800\\,K$", "B. $T \\gt 800\\,K$", "C. Ở mọi nhiệt độ", "D. Không ở nhiệt độ nào"], "answer": "A", "explain": "Tiêu chuẩn tự diễn biến ở điều kiện đẳng nhiệt đẳng áp: $\\Delta G = \\Delta H - T\\Delta S \\lt 0$. Thay số (chú ý đổi đơn vị): $-120000 - T \\times (-150) \\lt 0$, tức $-120000 + 150T \\lt 0$. Suy ra $T \\lt \\frac{120000}{150} = 800\\,K$. Ý nghĩa: phản ứng tỏa nhiệt nhưng giảm độ hỗn loạn (vd. tổng hợp từ các chất khí) chỉ tự diễn biến ở nhiệt độ đủ thấp, khi số hạng entropy $-T\\Delta S$ chưa lấn át $\\Delta H$. Bẫy thường gặp: quên đổi kJ sang J; đảo chiều bất đẳng thức khi chia cho số âm.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về nhiệt động hóa học:", "statements": ["a) Phản ứng có $\\Delta H \\lt 0$ luôn tự diễn biến ở mọi nhiệt độ.", "b) Với phản ứng tỏa nhiệt đang ở trạng thái cân bằng, tăng nhiệt độ làm cân bằng chuyển dịch theo chiều nghịch.", "c) Chất xúc tác làm tăng hằng số cân bằng K của phản ứng.", "d) $\\Delta S \\gt 0$ đối với phản ứng phân hủy $CaCO_3(r) \\rightarrow CaO(r) + CO_2(k)$."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: tính tự diễn biến do $\\Delta G = \\Delta H - T\\Delta S$ quyết định; nếu $\\Delta S \\lt 0$ đủ lớn về trị tuyệt đối, ở nhiệt độ cao $\\Delta G$ vẫn dương. b) Đúng: theo nguyên lý Le Chatelier, tăng nhiệt độ (cung cấp nhiệt) làm cân bằng của phản ứng tỏa nhiệt chuyển dịch theo chiều thu nhiệt, tức chiều nghịch. c) Sai: chất xúc tác chỉ làm tăng tốc độ đạt cân bằng (giảm năng lượng hoạt hóa cả hai chiều như nhau), không làm thay đổi hằng số cân bằng K. d) Đúng: phản ứng sinh ra chất khí từ chất rắn làm tăng độ hỗn loạn của hệ nên $\\Delta S \\gt 0$.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về động hóa học:", "statements": ["a) Bậc của phản ứng luôn bằng tổng các hệ số tỉ lượng trong phương trình hóa học.", "b) Với phản ứng bậc 1, chu kỳ bán hủy không phụ thuộc vào nồng độ ban đầu.", "c) Ở cùng nhiệt độ, phản ứng có năng lượng hoạt hóa càng lớn thì tốc độ càng nhanh.", "d) Theo quy tắc Van't Hoff, khi tăng nhiệt độ thêm $10^\\circ C$, tốc độ phản ứng thường tăng 2-4 lần."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: bậc phản ứng là đại lượng thực nghiệm, chỉ trùng với tổng hệ số tỉ lượng đối với phản ứng đơn giản (một giai đoạn). Với phản ứng phức tạp nhiều giai đoạn, bậc do giai đoạn quyết định tốc độ (chậm nhất) quyết định. b) Đúng: $t_{1/2} = \\ln 2/k$, chỉ phụ thuộc hằng số tốc độ, không phụ thuộc $[A]_0$. c) Sai: năng lượng hoạt hóa càng lớn thì hàng rào năng lượng càng cao, phân tử đủ năng lượng vượt rào càng ít nên tốc độ càng chậm (theo $k = Ae^{-E_a/RT}$). d) Đúng: đây là quy tắc kinh nghiệm Van't Hoff về hệ số nhiệt độ $\\gamma = 2$–$4$.", "points": 1}, {"type": "short", "level": "VDC", "q": "Chu kỳ bán hủy của $^{210}$Po là $138$ ngày. Một mẫu chứa $1{,}00\\,g$ $^{210}$Po nguyên chất. Sau $1$ năm ($365$ ngày), khối lượng $^{210}$Po còn lại là bao nhiêu gam? Viết đáp số làm tròn đến 3 chữ số thập phân.", "answer": "0.160", "explain": "Áp dụng định luật phân rã: $m = m_0 \\times \\left(\\frac{1}{2}\\right)^{t/t_{1/2}}$. Số chu kỳ bán hủy đã trôi qua: $365/138 \\approx 2{,}6449$. Suy ra $m = 1{,}00 \\times (1/2)^{2{,}6449} = 1{,}00 \\times e^{-2{,}6449 \\times \\ln 2} \\approx 1{,}00 \\times e^{-1{,}8333} \\approx 0{,}160\\,g$. Bẫy thường gặp: tính tuyến tính $1 - 365/138$ (cho số âm vô lý); nhầm $t_{1/2}$ với thời gian sống trung bình.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ở $700\\,K$, phản ứng $H_2(g) + I_2(g) \\rightleftharpoons 2HI(g)$ có $K_c = 54{,}3$. Một bình kín $1\\,L$ ban đầu chứa $0{,}5\\,mol$ $H_2$ và $0{,}5\\,mol$ $I_2$. Tính nồng độ $HI$ (M) lúc đạt cân bằng. Viết đáp số làm tròn đến 3 chữ số thập phân.", "answer": "0.787", "explain": "Gọi $x$ là nồng độ $H_2$ đã phản ứng: lúc cân bằng $[H_2] = [I_2] = 0{,}5 - x$, $[HI] = 2x$. $K_c = \\frac{(2x)^2}{(0{,}5 - x)^2} = 54{,}3$, suy ra $\\frac{2x}{0{,}5 - x} = \\sqrt{54{,}3} \\approx 7{,}369$. Giải ra $2x = 3{,}6845 - 7{,}369x$, tức $9{,}369x = 3{,}6845$, được $x \\approx 0{,}3933$. Vậy $[HI] = 2x \\approx 0{,}787\\,M$. Kiểm tra: $[H_2] = 0{,}1067\\,M \\gt 0$ hợp lệ; thay lại $K_c = (0{,}7866/0{,}1067)^2 \\approx 54{,}3$ khớp.", "points": 0.5}]}]}
