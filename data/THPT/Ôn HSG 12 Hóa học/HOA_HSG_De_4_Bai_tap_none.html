<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 4", "questions": [{"type": "mcq", "level": "VDC", "q": "Trong các đồng phân cấu tạo của $C_4H_9Br$, có bao nhiêu chất có tính quang hoạt (làm quay mặt phẳng ánh sáng phân cực)?", "options": ["A. 1", "B. 2", "C. 3", "D. 4"], "answer": "A", "explain": "$C_4H_9Br$ có 4 đồng phân cấu tạo: $CH_3CH_2CH_2CH_2Br$ (1-bromobutane), $CH_3CH_2CHBrCH_3$ (2-bromobutane), $(CH_3)_2CHCH_2Br$ (1-bromo-2-methylpropane), $(CH_3)_3CBr$ (2-bromo-2-methylpropane). Chất có tính quang hoạt phải có carbon bất đối (gắn 4 nhóm thế khác nhau). Chỉ $CH_3CH_2CHBrCH_3$ thỏa mãn: C số 2 gắn $H$, $Br$, $CH_3$, $CH_2CH_3$ — tồn tại một cặp enantiomer. Ba chất còn lại đều có mặt phẳng đối xứng (achiral). Bẫy thường gặp: cho rằng mọi đồng phân đều có tính quang hoạt; nhầm $(CH_3)_2CHCH_2Br$ có carbon bất đối.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sắp xếp các acid sau theo chiều tính acid tăng dần: (1) $CH_3COOH$, (2) $CH_2ClCOOH$, (3) $CHCl_2COOH$, (4) $CCl_3COOH$.", "options": ["A. (1), (2), (3), (4) theo chiều tăng dần", "B. (4), (3), (2), (1) theo chiều tăng dần", "C. (1), (4), (3), (2) theo chiều tăng dần", "D. (2), (1), (3), (4) theo chiều tăng dần"], "answer": "A", "explain": "Nhóm $Cl$ có hiệu ứng $-I$ (hút electron), làm giảm mật độ electron trên nguyên tử O của nhóm $OH$ và bền hóa anion carboxylate $RCOO^-$ (phân tán điện tích âm), khiến cân bằng $RCOOH \\rightleftharpoons RCOO^- + H^+$ chuyển dịch theo chiều phân li. Số nguyên tử $Cl$ càng nhiều, hiệu ứng $-I$ càng mạnh, acid càng mạnh: thứ tự tăng dần là $CH_3COOH$, $CH_2ClCOOH$, $CHCl_2COOH$, $CCl_3COOH$. Số liệu $pK_a$: $CH_3COOH$ ($4{,}76$), $CH_2ClCOOH$ ($2{,}86$), $CHCl_2COOH$ ($1{,}35$), $CCl_3COOH$ ($0{,}65$). Bẫy thường gặp: đảo ngược thứ tự do nhầm $-I$ với $+I$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sắp xếp các chất sau theo chiều tính base tăng dần trong dung dịch nước: (1) $C_6H_5NH_2$ (aniline), (2) $NH_3$, (3) $CH_3NH_2$, (4) $(CH_3)_2NH$.", "options": ["A. (1), (2), (3), (4) theo chiều tăng dần", "B. (4), (3), (2), (1) theo chiều tăng dần", "C. (2), (1), (3), (4) theo chiều tăng dần", "D. (1), (3), (2), (4) theo chiều tăng dần"], "answer": "A", "explain": "Aniline yếu nhất: cặp electron đơn trên N liên hợp với hệ $\\pi$ của vòng benzene (hiệu ứng $-C$) nên khả năng nhận $H^+$ rất kém ($pK_b \\approx 9{,}4$). $NH_3$ ($pK_b \\approx 4{,}75$) yếu hơn các amine mạch hở nhờ hiệu ứng $+I$ của nhóm alkyl đẩy electron về N làm tăng mật độ electron. Trong nước, $(CH_3)_2NH$ ($pK_b \\approx 3{,}27$) mạnh hơn $CH_3NH_2$ ($pK_b \\approx 3{,}36$) do hiệu ứng $+I$ của hai nhóm methyl cộng với sự solvat hóa cation $R_2NH_2^+$ thuận lợi. Thứ tự tăng dần: aniline, $NH_3$, $CH_3NH_2$, $(CH_3)_2NH$. Bẫy thường gặp: cho rằng càng nhiều nhóm alkyl thì base càng mạnh trong mọi môi trường (trong pha khí thứ tự khác do không có solvat hóa); xếp aniline mạnh hơn $NH_3$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phản ứng nào sau đây diễn ra theo cơ chế $S_N1$?", "options": ["A. $CH_3Br + OH^- \\rightarrow CH_3OH + Br^-$ (trong dung dịch)", "B. $(CH_3)_3CBr + OH^- \\rightarrow (CH_3)OH_3COH + Br^-$ (trong dung dịch)", "C. $CH_3CH_2Br + CN^- \\rightarrow CH_3CH_2CN + Br^-$", "D. $CH_3Br + CH_3O^- \\rightarrow CH_3OCH_3 + Br^-$"], "answer": "B", "explain": "Cơ chế $S_N1$ (thế nucleophile đơn phân tử) gồm hai giai đoạn: ion hóa tạo carbocation (giai đoạn chậm, quyết định tốc độ), rồi nucleophile tấn công carbocation. Điều kiện thuận lợi: cơ chất tạo được carbocation bền. $(CH_3)_3CBr$ tạo carbocation bậc 3 $(CH_3)_3C^+$ rất bền nhờ hiệu ứng siêu liên hợp của 9 liên kết C-H và hiệu ứng $+I$ của ba nhóm methyl, nên phản ứng theo $S_N1$ (tốc độ chỉ phụ thuộc $[(CH_3)_3CBr]$). Các đáp án còn lại đều là halide bậc 1 ($CH_3Br$, $CH_3CH_2Br$): carbocation bậc 1 quá kém bền nên phản ứng theo cơ chế $S_N2$ đồng thời. Bẫy thường gặp: chọn A vì $CH_3Br$ phản ứng nhanh (nhanh nhưng theo $S_N2$, không phải $S_N1$).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hợp chất hữu cơ X có công thức phân tử $C_3H_8O_2$, tác dụng với Na giải phóng $H_2$ và hòa tan được $Cu(OH)_2$ tạo dung dịch màu xanh lam. Công thức cấu tạo của X là", "options": ["A. $CH_3-CH(OH)-CH_2OH$", "B. $HOCH_2-CH_2-CH_2OH$", "C. $CH_3-CH_2-O-CH_2OH$", "D. $CH_3-O-CH_2-CH_2OH$"], "answer": "A", "explain": "X tác dụng với Na sinh $H_2$ chứng tỏ có nhóm $OH$ (hoặc $COOH$). Dấu hiệu hòa tan $Cu(OH)_2$ tạo phức màu xanh lam là đặc trưng của hợp chất có hai nhóm $OH$ kề nhau (1,2-diol) hoặc polyol: $2C_3H_8O_2 + Cu(OH)_2 \\rightarrow$ phức $[Cu(C_3H_7O_2)_2] + 2H_2O$. Đáp án A ($CH_3-CH(OH)-CH_2OH$, propane-1,2-diol) có hai nhóm $OH$ kề nhau nên thỏa mãn. Đáp án B là 1,3-diol: hai nhóm $OH$ cách nhau một carbon nên không tạo phức bền màu xanh. C và D là hydroxy-ether chỉ có một nhóm $OH$ nên không hòa tan $Cu(OH)_2$. Bẫy thường gặp: chọn B vì cũng có 2 nhóm $OH$ (quên điều kiện kề nhau của phản ứng tạo phức).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho sơ đồ chuyển hóa: $C_2H_4 \\xrightarrow{+H_2O,\\,H^+} X \\xrightarrow{+O_2,\\,men\\ giấm} Y$. Biết Y là acid carboxylic. X và Y lần lượt là", "options": ["A. $C_2H_5OH$ và $CH_3COOH$", "B. $CH_3CHO$ và $CH_3COOH$", "C. $C_2H_5OH$ và $C_2H_5OH$", "D. $CH_3OH$ và $HCOOH$"], "answer": "A", "explain": "Giai đoạn 1: $C_2H_4 + H_2O \\xrightarrow{H^+} C_2H_5OH$ (phản ứng cộng nước vào alkene theo quy tắc Markovnikov) nên X là ethanol. Giai đoạn 2: lên men giấm oxi hóa ethanol: $C_2H_5OH + O_2 \\xrightarrow{men\\ giấm} CH_3COOH + H_2O$ nên Y là acetic acid. Đáp án B sai ở X vì $CH_3CHO$ không tạo thành trực tiếp từ $C_2H_4 + H_2O$. Bẫy thường gặp: nhầm điều kiện $H^+$ với $Hg^{2+}$ (cộng nước vào alkyne mới cho aldehyde/ketone).", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về hiệu ứng cấu trúc trong hóa hữu cơ:", "statements": ["a) Nhóm $-NO_2$ là nhóm hút electron (hiệu ứng $-I$ và $-C$).", "b) Tính acid của phenol ($C_6H_5OH$) mạnh hơn ethanol ($C_2H_5OH$).", "c) Aniline ($C_6H_5NH_2$) có tính base mạnh hơn methylamine ($CH_3NH_2$).", "d) Nhóm $-CH_3$ đẩy electron (hiệu ứng $+I$) làm tăng mật độ electron trên vòng benzene của toluene."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $N$ mang điện tích dương hình thức trong $-NO_2$ nên hút electron mạnh theo cả hiệu ứng cảm ứng ($-I$) và hiệu ứng liên hợp ($-C$). b) Đúng: anion phenoxide $C_6H_5O^-$ được bền hóa nhờ sự phân tán điện tích âm vào vòng benzene (liên hợp $p$-$\\pi$), trong khi $C_2H_5O^-$ không có hiệu ứng này; $pK_a$(phenol) $\\approx 10$ so với $pK_a$(ethanol) $\\approx 16$. c) Sai: cặp electron đơn trên N của aniline đã tham gia liên hợp với vòng benzene nên khả năng nhận proton kém xa methylamine (có nhóm $CH_3$ đẩy electron $+I$). d) Đúng: nhóm alkyl gắn trực tiếp vào vòng benzene thể hiện hiệu ứng $+I$ (và siêu liên hợp), làm tăng mật độ electron của vòng, vì vậy toluene dễ tham gia phản ứng thế electrophile hơn benzene.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về cơ chế phản ứng hữu cơ:", "statements": ["a) Cộng $HBr$ vào $CH_2=CH-CH_3$ theo quy tắc Markovnikov cho sản phẩm chính là $CH_3-CHBr-CH_3$.", "b) Carbocation bậc 3 bền hơn carbocation bậc 1.", "c) Phản ứng thủy phân ester trong môi trường acid là phản ứng một chiều.", "d) Aldehyde vừa thể hiện tính khử vừa thể hiện tính oxi hóa."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $H^+$ cộng vào carbon bậc 1 (ít thế hơn) tạo carbocation bậc 2 $CH_3-C^+H-CH_3$ bền hơn, rồi $Br^-$ tấn công cho sản phẩm chính 2-bromopropane. b) Đúng: carbocation bậc 3 được bền hóa bởi hiệu ứng siêu liên hợp của nhiều liên kết C-H kề và hiệu ứng $+I$ của các nhóm alkyl. c) Sai: thủy phân ester trong môi trường acid là phản ứng thuận nghịch (ngược với este hóa); chỉ thủy phân trong môi trường base mới một chiều (tạo muối carboxylate bền). d) Đúng: aldehyde bị oxi hóa thành acid (tính khử: tráng bạc, $Cu(OH)_2/t^\\circ$) và bị khử thành ancol bậc 1 (tính oxi hóa: $+H_2$, xúc tác Ni).", "points": 1}, {"type": "short", "level": "VDC", "q": "Đốt cháy hoàn toàn $0{,}1\\,mol$ ester X (đơn chức, mạch hở) thu được $0{,}4\\,mol$ $CO_2$ và $0{,}4\\,mol$ $H_2O$. Xác định khối lượng mol (g/mol) của X.", "answer": "88", "explain": "Số nguyên tử C trong X: $0{,}4/0{,}1 = 4$; số nguyên tử H: $2 \\times 0{,}4/0{,}1 = 8$. Ester đơn chức mạch hở có công thức tổng quát $C_nH_{2n}O_2$, với $n = 4$ suy ra $C_4H_8O_2$. Khối lượng mol: $M = 4 \\times 12 + 8 \\times 1 + 2 \\times 16 = 88\\,g/mol$. Bẫy thường gặp: quên ester đơn chức luôn có 2 nguyên tử O nên tính sai $M$; nhầm số mol $H_2O$ với số nguyên tử H (quên nhân 2).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đun nóng hỗn hợp gồm $0{,}2\\,mol$ $CH_3COOH$ và $0{,}1\\,mol$ $C_2H_5OH$ với $H_2SO_4$ đặc làm xúc tác. Giả thiết hiệu suất phản ứng este hóa đạt $80\\%$ (tính theo chất hết trước). Tính khối lượng (g) ester thu được, làm tròn đến 2 chữ số thập phân.", "answer": "7.04", "explain": "Phản ứng: $CH_3COOH + C_2H_5OH \\rightleftharpoons CH_3COOC_2H_5 + H_2O$. $C_2H_5OH$ ($0{,}1\\,mol$) là chất hết trước (tỉ lệ 1:1). Số mol ester lý thuyết $= 0{,}1\\,mol$; thực tế $= 0{,}1 \\times 80\\% = 0{,}08\\,mol$. $M_{CH_3COOC_2H_5} = 88\\,g/mol$, suy ra $m = 0{,}08 \\times 88 = 7{,}04\\,g$. Bẫy thường gặp: tính hiệu suất theo $CH_3COOH$ (chất dư) cho $0{,}16\\,mol$ ester; quên $H_2SO_4$ đặc vừa là xúc tác vừa hút nước để chuyển dịch cân bằng theo chiều thuận.", "points": 0.5}]}]}
