{"sets": [{"name": "Đề 5", "questions": [{"type": "mcq", "level": "VDC", "q": "Cho sơ đồ biến hóa (các chữ cái là các chất vô cơ khác nhau): $S + (A) \\rightarrow (X)$; $S + (B) \\rightarrow (Y)$; $(Y) + (A) \\rightarrow (X) + (E)$. Xác định các chất X, Y phù hợp với sơ đồ.", "options": ["A. X: $SO_2$, Y: $H_2S$", "B. X: $SO_3$, Y: $SO_2$", "C. X: $H_2S$, Y: $SO_2$", "D. X: $CS_2$, Y: $H_2S$"], "answer": "A", "explain": "Lập luận: (A) và (B) là hai chất khác nhau cùng tác dụng với S. Chọn $(A) = O_2$: $S + O_2 \\rightarrow SO_2$ (X). Chọn $(B) = H_2$: $S + H_2 \\rightarrow H_2S$ (Y). Kiểm tra phương trình thứ ba: $H_2S + O_2 \\rightarrow SO_2 + H_2O$ (cân bằng: $2H_2S + 3O_2 \\rightarrow 2SO_2 + 2H_2O$), cho $(X) = SO_2$ và $(E) = H_2O$: khớp. Đáp án B sai vì $S + O_2$ không trực tiếp cho $SO_3$ (cần xúc tác $V_2O_5$ từ $SO_2$); đáp án C đảo ngược vai trò X, Y. Bẫy thường gặp: không kiểm tra tính nhất quán của cả ba phương trình với cùng một bộ (A), (B).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho kim loại A tác dụng với dung dịch nước của muối B. Hiện tượng quan sát được: có bọt khí thoát ra, đồng thời xuất hiện kết tủa màu trắng lẫn kết tủa màu xanh. Cặp kim loại A và muối B nào sau đây thỏa mãn?", "options": ["A. Ba và $CuSO_4$", "B. Na và $FeCl_3$", "C. K và $CuSO_4$", "D. Zn và $AgNO_3$"], "answer": "A", "explain": "Phân tích hiện tượng: bọt khí chứng tỏ kim loại A phản ứng mãnh liệt với nước (kim loại kiềm/kiềm thổ mạnh); hai loại kết tủa chứng tỏ có hai phản ứng tạo kết tủa. Với A = Ba, B = $CuSO_4$: $Ba + 2H_2O \\rightarrow Ba(OH)_2 + H_2$ (bọt khí); $Ba(OH)_2 + CuSO_4 \\rightarrow BaSO_4$ (trắng) $+ Cu(OH)_2$ (xanh): khớp cả ba hiện tượng. Đáp án B: $Na + H_2O$ cho khí, $Fe(OH)_3$ kết tủa nâu đỏ (không có kết tủa trắng, không có xanh). Đáp án C: chỉ có kết tủa xanh $Cu(OH)_2$ và khí, thiếu kết tủa trắng. Đáp án D: Zn đẩy $Ag$ ra (kim loại mới bám lên), không có bọt khí. Bẫy thường gặp: chọn C vì thấy kết tủa xanh của đồng mà quên mất còn kết tủa trắng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Thủy phân hoàn toàn $1\\,mol$ peptide X (mạch hở) thu được $2\\,mol$ glycine (Gly), $1\\,mol$ alanine (Ala) và $1\\,mol$ valine (Val). Số đồng phân cấu tạo có thể có của X là", "options": ["A. 12", "B. 24", "C. 6", "D. 4"], "answer": "A", "explain": "X là tetrapeptide gồm 4 gốc amino acid, trong đó có 2 gốc Gly giống nhau, 1 gốc Ala và 1 gốc Val. Số cách sắp xếp 4 vị trí với 2 vị trí trùng nhau: $\\frac{4!}{2!} = 12$ đồng phân (vd. Gly-Gly-Ala-Val, Gly-Ala-Gly-Val, ...). Nếu cả 4 gốc đều khác nhau sẽ có $4! = 24$ đồng phân (đáp án B là bẫy quên chia cho số hoán vị của các gốc Gly giống nhau). Bẫy thường gặp: đáp án B (quên Gly lặp lại 2 lần); đáp án C (nhầm với số cách chọn vị trí).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Amino acid X chứa một nhóm $-NH_2$ và hai nhóm $-COOH$ trong phân tử. $0{,}1\\,mol$ X tác dụng vừa đủ với $0{,}2\\,mol$ $NaOH$ trong dung dịch. X là", "options": ["A. Glutamic acid", "B. Lysine", "C. Glycine", "D. Alanine"], "answer": "A", "explain": "$0{,}1\\,mol$ X cần $0{,}2\\,mol$ $NaOH$, tức tỉ lệ $1:2$: mỗi phân tử X có 2 nhóm $-COOH$ tham gia trung hòa (nhóm $-NH_2$ không phản ứng với $NaOH$). Kết hợp giả thiết một $-NH_2$ + hai $-COOH$, X là glutamic acid: $HOOC-CH_2-CH_2-CH(NH_2)-COOH$. Lysine có 2 nhóm $-NH_2$ và 1 nhóm $-COOH$ (đảo ngược, tỉ lệ với $NaOH$ là $1:1$). Glycine và alanine chỉ có 1 nhóm $-COOH$ (tỉ lệ $1:1$). Bẫy thường gặp: chọn lysine vì cùng là amino acid có 3 nhóm chức mà không đối chiếu số lượng từng loại.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trùng hợp buta-1,3-diene ($CH_2=CH-CH=CH_2$) với xúc tác Na thu được cao su buna. Nếu hệ số polymer hóa trung bình là $1500$, khối lượng mol trung bình của polymer xấp xỉ", "options": ["A. $81000$", "B. $54000$", "C. $8100$", "D. $162000$"], "answer": "A", "explain": "Trùng hợp cộng (addition polymerization): khối lượng mắt xích bằng khối lượng monomer, không tách phân tử nhỏ. ^{3+}$ mới sinh thành $Fe^{2+}$: $Fe + 2Fe(NO_3)_3 \\rightarrow 3Fe(NO_3)_2$, nên muối thu được là $Fe(NO_3)_2$. c) Đúng: muối hydrocarbonate kém bền với nhiệt: $Ca(HCO_3)_2 \\xrightarrow{t^\\circ} CaCO_3 + CO_2 + H_2O$, rồi $CaCO_3$ tiếp tục phân hủy thành $CaO + CO_2$ ở nhiệt độ cao hơn. d) Đúng: $Al_2O_3$ là oxide lưỡng tính: $Al_2O_3 + 6HCl \\rightarrow 2AlCl_3 + 3H_2O$; $Al_2O_3 + 2NaOH \\rightarrow 2NaAlO_2 + H_2O$.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về đại cương hóa hữu cơ:", "statements": ["a) Mọi hợp chất hữu cơ đều chứa carbon và hydrogen trong phân tử.", "b) Các chất đồng phân là các chất có cùng công thức phân tử nhưng công thức cấu tạo khác nhau.", "c) Liên kết C-H trong phân tử $CH_4$ là liên kết cộng hóa trị phân cực.", "d) Trùng hợp và trùng ngưng đều tạo ra polymer, nhưng trùng ngưng kèm theo sự tách ra phân tử nhỏ."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: có hợp chất hữu cơ không chứa hydrogen, vd. $CCl_4$ (carbon tetrachloride), $CS_2$; định nghĩa hợp chất hữu cơ dựa trên khung carbon chứ không bắt buộc có H. b) Đúng: đây là định nghĩa đồng phân (gồm đồng phân cấu tạo và đồng phân lập thể). c) Sai: độ âm điện của C ($2{,}55$) và H ($2{,}20$) chênh lệch $0{,}35 \\lt 0{,}4$ nên liên kết C-H coi là không phân cực; hơn nữa phân tử $CH_4$ đối xứng tứ diện triệt tiêu momen lưỡng cực. d) Đúng: trùng hợp cộng giữ nguyên khối lượng monomer; trùng ngưng (vd. tạo nylon-6,6, tơ lapsan) tách ra các phân tử nhỏ như $H_2O$.", "points": 1}, {"type": "short", "level": "VDC", "q": "Đốt cháy hoàn toàn $4{,}4\\,g$ hợp chất hữu cơ X thu được $8{,}8\\,g$ $CO_2$ và $3{,}6\\,g$ $H_2O$. Tỉ khối hơi của X so với $H_2$ là $22$. Xác định công thức phân tử của X.", "answer": "C2H4O", "explain": "$n_C = 8{,}8/44 = 0{,}2\\,mol$; $n_H = 2 \\times 3{,}6/18 = 0{,}4\\,mol$. Khối lượng C + H: $0{,}2 \\times 12 + 0{,}4 \\times 1 = 2{,}8\\,g \\lt 4{,}4\\,g$ nên X còn chứa O: $m_O = 4{,}4 - 2{,}8 = 1{,}6\\,g$, $n_O = 0{,}1\\,mol$. Tỉ lệ $n_C : n_H : n_O = 0{,}2 : 0{,}4 : 0{,}1 = 2:4:1$, công thức đơn giản nhất $C_2H_4O$. $M_X = 22 \\times 2 = 44 = M_{C_2H_4O}$ nên công thức phân tử là $C_2H_4O$. Bẫy thường gặp: kết luận X chỉ gồm C, H (bỏ qua kiểm tra khối lượng); quên nhân 2 khi tính $n_H$ từ $H_2O$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho $11{,}5\\,g$ Na tác dụng hết với $100\\,g$ dung dịch gồm $C_2H_5OH$ $46\\%$ và $H_2O$. Tính thể tích khí $H_2$ (L, ở điều kiện chuẩn $25^\\circ C$, $1\\,bar$) thoát ra, làm tròn đến 2 chữ số thập phân.", "answer": "6.20", "explain": "$n_{Na} = 11{,}5/23 = 0{,}5\\,mol$; $n_{C_2H_5OH} = 46/46 = 1{,}0\\,mol$; $n_{H_2O} = 54/18 = 3{,}0\\,mol$. Na phản ứng với cả ancol và nước: $2Na + 2ROH \\rightarrow 2RONa + H_2$. Tổng số mol nhóm $OH$ linh động $= 1{,}0 + 3{,}0 = 4{,}0\\,mol \\gt 0{,}5\\,mol$ nên Na hết trước. $n_{H_2} = n_{Na}/2 = 0{,}25\\,mol$. Ở đkc ($V_m = 24{,}79\\,L/mol$): $V = 0{,}25 \\times 24{,}79 = 6{,}1975 \\approx 6{,}20\\,L$. Bẫy thường gặp: chỉ tính Na với nước mà quên ancol cũng phản ứng; dùng $22{,}4\\,L/mol$ (đktc cũ) thay vì $24{,}79\\,L/mol$ (đkc mới).", "points": 0.5}]}]}
