{"sets": [{"name": "Đề 3", "questions": [{"type": "mcq", "level": "VDC", "q": "Thêm $10\\,mL$ dung dịch $HCl$ $0{,}1\\,M$ vào $1\\,L$ dung dịch đệm chứa $CH_3COOH$ $0{,}01\\,M$ và $CH_3COONa$ $0{,}01\\,M$ (bỏ qua sự thay đổi thể tích). Biết $K_a(CH_3COOH) = 1{,}8 \\times 10^{-5}$. pH của dung dịch thu được xấp xỉ", "options": ["A. $4{,}66$", "B. $4{,}74$", "C. $2{,}00$", "D. $4{,}57$"], "answer": "A", "explain": "$H^+$ thêm vào: $0{,}01\\,L \\times 0{,}1\\,M = 0{,}001\\,mol$. Phản ứng trong đệm: $H^+ + CH_3COO^- \\rightarrow CH_3COOH$. Sau phản ứng: $n_{CH_3COOH} = 0{,}01 + 0{,}001 = 0{,}011\\,mol$, $n_{CH_3COO^-} = 0{,}01 - 0{,}001 = 0{,}009\\,mol$. Theo Henderson–Hasselbalch: $pH = pK_a + \\lg\\frac{[base]}{[acid]} = -\\lg(1{,}8 \\times 10^{-5}) + \\lg\\frac{0{,}009}{0{,}011} \\approx 4{,}7447 - 0{,}0872 \\approx 4{,}66$. Nhận xét: pH chỉ giảm $0{,}08$ đơn vị dù thêm acid mạnh — đúng vai trò chống biến đổi pH của dung dịch đệm. Bẫy thường gặp: đáp án B là pH của đệm ban đầu (quên $H^+$ đã phản ứng); đáp án C là bẫy tính pH của $HCl$ riêng rẽ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tính pH của dung dịch $Na_2CO_3$ $0{,}1\\,M$ ở $25^\\circ C$. Biết $K_{a1}(H_2CO_3) = 4{,}3 \\times 10^{-7}$, $K_{a2}(H_2CO_3) = 5{,}6 \\times 10^{-11}$; bỏ qua sự thủy phân nấc 2.", "options": ["A. $11{,}63$", "B. $12{,}00$", "C. $8{,}37$", "D. $9{,}26$"], "answer": "A", "explain": "$CO_3^{2-}$ thủy phân nấc 1: $CO_3^{2-} + H_2O \\rightleftharpoons HCO_3^- + OH^-$ với $K_{b1} = K_w/K_{a2} = 10^{-14}/(5{,}6 \\times 10^{-11}) \\approx 1{,}786 \\times 10^{-4}$. Nấc 2 có $K_{b2} = K_w/K_{a1} \\approx 2{,}3 \\times 10^{-8} \\ll K_{b1}$ nên bỏ qua. Đặt $[OH^-] = x$: $x^2/(0{,}1 - x) = K_{b1}$, gần đúng $x \\approx \\sqrt{1{,}786 \\times 10^{-4} \\times 0{,}1} \\approx 4{,}23 \\times 10^{-3}\\,M$ (thỏa $x \\ll 0{,}1$). $pOH \\approx 2{,}37$, suy ra $pH \\approx 11{,}63$. Bẫy thường gặp: dùng $K_{a1}$ thay vì $K_{a2}$ để tính $K_{b1}$ (đáp án C); coi $Na_2CO_3$ là base mạnh (đáp án B).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Xét điện cực $Pt\\,|\\,MnO_4^-(0{,}20\\,M),\\,Mn^{2+}(0{,}02\\,M)$ trong môi trường $H_2SO_4$ $1\\,M$ (coi $H_2SO_4$ phân li hoàn toàn, $pH = 0$). Biết $E^0_{MnO_4^-/Mn^{2+}} = 1{,}51\\,V$. Thế điện cực của cặp oxi hóa – khử này ở $25^\\circ C$ xấp xỉ", "options": ["A. $1{,}52\\,V$", "B. $1{,}51\\,V$", "C. $1{,}49\\,V$", "D. $1{,}63\\,V$"], "answer": "A", "explain": "Bán phản ứng: $MnO_4^- + 8H^+ + 5e \\rightleftharpoons Mn^{2+} + 4H_2O$. Phương trình Nernst: $E = E^0 - \\frac{0{,}0592}{5}\\lg\\frac{[Mn^{2+}]}{[MnO_4^-][H^+]^8}$. Với $[H^+] = 1\\,M$: $E = 1{,}51 - 0{,}01184 \\times \\lg\\frac{0{,}02}{0{,}20 \\times 1^8} = 1{,}51 - 0{,}01184 \\times \\lg(0{,}1) = 1{,}51 + 0{,}01184 \\approx 1{,}52\\,V$. Nhận xét: $[MnO_4^-] \\gt [Mn^{2+}]$ làm thế tăng; vai trò của $[H^+]^8$ rất nhạy — nếu pH tăng 1 đơn vị, thế giảm tới $8 \\times 0{,}0592/5 \\approx 0{,}095\\,V$. Bẫy thường gặp: quên số mũ 8 của $[H^+]$; nhầm dấu trong phương trình Nernst.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điện phân dung dịch $CuSO_4$ bằng điện cực trơ với cường độ dòng điện $2\\,A$ trong $30$ phút, hiệu suất quá trình cathode đạt $80\\%$. Khối lượng đồng bám trên cathode là", "options": ["A. $0{,}95\\,g$", "B. $1{,}18\\,g$", "C. $1{,}90\\,g$", "D. $0{,}48\\,g$"], "answer": "A", "explain": "Theo định luật Faraday: $m_{lý\\ thuyết} = \\frac{A \\cdot I \\cdot t}{n \\cdot F} = \\frac{63{,}5 \\times 2 \\times 1800}{2 \\times 96485} \\approx 1{,}185\\,g$. Với hiệu suất $80\\%$: $m_{thực\\ tế} = 1{,}185 \\times 0{,}8 \\approx 0{,}95\\,g$. Ở anode (điện cực trơ): $2H_2O \\rightarrow O_2 + 4H^+ + 4e$, không ảnh hưởng khối lượng cathode. Bẫy thường gặp: đáp án B là bẫy quên nhân hiệu suất; đáp án C nhầm số electron trao đổi $n = 1$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Biết tích số tan của $Mg(OH)_2$ là $K_{sp} = 1{,}8 \\times 10^{-11}$ ở $25^\\circ C$. pH mà tại đó bắt đầu xuất hiện kết tủa $Mg(OH)_2$ trong dung dịch $Mg^{2+}$ $0{,}01\\,M$ xấp xỉ", "options": ["A. $9{,}63$", "B. $10{,}63$", "C. $8{,}63$", "D. $7{,}00$"], "answer": "A", "explain": "Kết tủa bắt đầu xuất hiện khi tích số ion đạt $K_{sp}$: $[Mg^{2+}][OH^-]^2 = K_{sp}$. Suy ra $[OH^-] = \\sqrt{K_{sp}/[Mg^{2+}]} = \\sqrt{1{,}8 \\times 10^{-11}/0{,}01} = \\sqrt{1{,}8 \\times 10^{-9}} \\approx 4{,}24 \\times 10^{-5}\\,M$. $pOH = -\\lg(4{,}24 \\times 10^{-5}) \\approx 4{,}37$, vậy $pH \\approx 14 - 4{,}37 = 9{,}63$. Ý nghĩa: muốn kết tủa hoàn toàn $Mg^{2+}$ phải nâng pH cao hơn giá trị này; đây là cơ sở của phương pháp tách ion bằng kết tủa phân đoạn. Bẫy thường gặp: quên căn bậc hai (đáp án B); quên bình phương $[OH^-]$ trong biểu thức $K_{sp}$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Chuẩn độ $25\\,mL$ dung dịch $CH_3COOH$ $0{,}1\\,M$ bằng dung dịch $NaOH$ $0{,}1\\,M$. Biết $K_a(CH_3COOH) = 1{,}8 \\times 10^{-5}$. pH của dung dịch tại điểm tương đương xấp xỉ", "options": ["A. $8{,}72$", "B. $7{,}00$", "C. $5{,}28$", "D. $9{,}72$"], "answer": "A", "explain": "Tại điểm tương đương, toàn bộ acid đã chuyển thành muối $CH_3COONa$. Thể tích sau chuẩn độ $50\\,mL$ nên $[CH_3COO^-] = 0{,}05\\,M$. Anion $CH_3COO^-$ thủy phân: $K_b = K_w/K_a = 10^{-14}/(1{,}8 \\times 10^{-5}) \\approx 5{,}56 \\times 10^{-10}$. $[OH^-] = \\sqrt{K_b \\cdot C} = \\sqrt{5{,}56 \\times 10^{-10} \\times 0{,}05} \\approx 5{,}27 \\times 10^{-6}\\,M$. $pOH \\approx 5{,}28$, suy ra $pH \\approx 8{,}72 \\gt 7$. Vì vậy phải chọn chỉ thị có khoảng đổi màu trong môi trường base yếu như phenolphthalein ($8{,}2$–$10{,}0$), không dùng methyl orange. Bẫy thường gặp: đáp án B (cho rằng điểm tương đương luôn pH = 7 — chỉ đúng với acid mạnh + base mạnh).", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về cân bằng trong dung dịch:", "statements": ["a) Thêm tinh thể $NaCl$ vào dung dịch bão hòa $AgCl$ làm tăng độ tan của $AgCl$.", "b) Dung dịch đệm gồm $NH_3$ và $NH_4Cl$ có $pH \\gt 7$.", "c) Khi chuẩn độ dung dịch $HCl$ bằng dung dịch $NaOH$, tại điểm tương đương $pH = 7$.", "d) Sục khí $CO_2$ dư vào dung dịch $Ca(OH)_2$ luôn thu được kết tủa $CaCO_3$."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: theo hiệu ứng ion chung, thêm $Cl^-$ làm cân bằng $AgCl(s) \\rightleftharpoons Ag^+ + Cl^-$ chuyển dịch theo chiều nghịch, độ tan của $AgCl$ giảm. b) Đúng: đây là hệ đệm base yếu – muối của nó; $NH_3$ thủy phân cho môi trường base nên $pH \\gt 7$ ($pH = 14 - pK_b + \\lg\\frac{[base]}{[acid]}$, với $pK_b = 4{,}75$). c) Đúng: $HCl$ là acid mạnh, $NaOH$ là base mạnh; tại điểm tương đương dung dịch chỉ chứa $NaCl$ trung tính nên $pH = 7$ (ở $25^\\circ C$). d) Sai: ban đầu tạo kết tủa $CaCO_3$ nhưng $CO_2$ dư sẽ hòa tan kết tủa theo $CaCO_3 + CO_2 + H_2O \\rightarrow Ca(HCO_3)_2$ (tan).", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về điện hóa học:", "statements": ["a) Khi điện phân dung dịch $NaCl$ (điện cực trơ, có màng ngăn), khí $Cl_2$ thoát ra ở cathode.", "b) Pin nhiên liệu $H_2$–$O_2$ biến đổi trực tiếp hóa năng thành điện năng.", "c) Kim loại có thế điện cực chuẩn càng âm thì càng dễ bị oxi hóa.", "d) Ăn mòn điện hóa xảy ra khi hai kim loại khác nhau tiếp xúc với nhau trong môi trường chất điện li."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: ở cathode (cực âm) xảy ra quá trình khử ($2H_2O + 2e \\rightarrow H_2 + 2OH^-$); $Cl_2$ sinh ra do quá trình oxi hóa $2Cl^- \\rightarrow Cl_2 + 2e$ nên thoát ra ở anode (cực dương). b) Đúng: pin nhiên liệu thực hiện phản ứng oxi hóa – khử một cách có kiểm soát để sinh dòng điện, không qua giai đoạn nhiệt năng. c) Đúng: $E^0$ càng âm thì dạng khử càng dễ nhường electron (dạng oxi hóa càng khó nhận electron). d) Đúng: đó chính là điều kiện của pin ăn mòn (pin galvanic tự phát): hai điện cực khác nhau + môi trường điện li, kim loại có $E^0$ âm hơn bị ăn mòn.", "points": 1}, {"type": "short", "level": "VDC", "q": "Ở $25^\\circ C$, dung dịch $CH_3COOH$ $0{,}1\\,M$ có $pH = 2{,}87$. Tính độ điện li $\\alpha$ của $CH_3COOH$ trong dung dịch này, viết đáp số theo phần trăm làm tròn đến 2 chữ số thập phân.", "answer": "1.35%", "explain": "$[H^+] = 10^{-pH} = 10^{-2{,}87} \\approx 1{,}349 \\times 10^{-3}\\,M$. Với acid yếu một nấc: $\\alpha = \\frac{[H^+]}{C_0} = \\frac{1{,}349 \\times 10^{-3}}{0{,}1} \\approx 0{,}01349 \\approx 1{,}35\\%$. Giá trị nhỏ ($\\alpha \\ll 1$) phù hợp với bản chất acid yếu; cũng có thể kiểm tra lại $K_a = C_0\\alpha^2 \\approx 0{,}1 \\times (0{,}01349)^2 \\approx 1{,}82 \\times 10^{-5}$ khớp với lý thuyết. Bẫy thường gặp: nhầm $\\alpha = [H^+]$ mà quên chia cho $C_0$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điện phân nóng chảy $Al_2O_3$ (với cryolite) bằng dòng điện $50000\\,A$ trong $24$ giờ, hiệu suất thu hồi nhôm đạt $95\\%$. Khối lượng nhôm (kg) thu được ở cathode là bao nhiêu? Viết đáp số làm tròn đến hàng đơn vị.", "answer": "383", "explain": "Bán phản ứng cathode: $Al^{3+} + 3e \\rightarrow Al$. Theo định luật Faraday: $m_{lý\\ thuyết} = \\frac{A \\cdot I \\cdot t}{n \\cdot F} = \\frac{27 \\times 50000 \\times 86400}{3 \\times 96485} \\approx 402997\\,g \\approx 403{,}0\\,kg$. Với hiệu suất $95\\%$: $m_{thực\\ tế} = 403{,}0 \\times 0{,}95 \\approx 382{,}8\\,kg \\approx 383\\,kg$. Bẫy thường gặp: quên đổi giây ($24\\,h = 86400\\,s$); nhầm $n = 2$; quên nhân hiệu suất.", "points": 0.5}]}]}
