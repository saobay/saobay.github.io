ill receive (12) ___ certificate.\n\nBlank (11):","options":["A. last","B. lend","C. leave","D. lose"],"answer":"A","explain":"'last two hours' = kéo dài hai giờ mỗi buổi.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following leaflet and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nBE READY TO SAVE A LIFE!\nA free first aid course (7) ___ next month at the Youth Centre. You will learn how to treat cuts, burns, and (8) ___. The course also teaches CPR, a skill that can (9) ___ lives in emergencies. No medical background is (10) ___. Classes are held on Saturday mornings and (11) ___ two hours each. Everyone who completes the course will receive (12) ___ certificate.\n\nBlank (12):","options":["A. the","B. no article","C. a","D. an"],"answer":"C","explain":"'a certificate' = một chứng chỉ. 'certificate' đếm được, chưa xác định.","points":0.25},{"type":"mcq","level":"NB","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Good morning, doctor. I have a sore throat.\nb. How long have you had it?\nc. For about three days.\nd. Let me take a look... You should take this medicine twice a day.\ne. Thank you, doctor.","options":["A. a-b-c-d-e","B. d-e-a-b-c","C. b-a-d-c-e","D. a-c-b-e-d"],"answer":"A","explain":"Khám bệnh: nêu triệu chứng (a) - hỏi thời gian (b) - trả lời (c) - kê đơn (d) - cảm ơn (e).","points":0.25},{"type":"mcq","level":"TH","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Our school can become greener with small actions.\nb. First, we should sort waste into different bins.\nc. Second, we can plant more trees in the schoolyard.\nd. Finally, we should save electricity by turning off lights.\ne. Together, we can make a big difference.","options":["A. e-a-b-c-d","B. b-c-d-e-a","C. a-b-c-d-e","D. a-c-b-e-d"],"answer":"C","explain":"Câu chủ đề (a) - First (b) - Second (c) - Finally (d) - kết luận Together (e).","points":0.25},{"type":"mcq","level":"TH","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. You are invited to\nb. Hoa's 18th birthday party\nc. on Saturday, June 15th at 7 p.m.\nd. at 12 Tran Phu Street.\ne. We hope to see you there!","options":["A. a-b-c-d-e","B. e-d-c-b-a","C. a-c-b-d-e","D. b-a-d-c-e"],"answer":"A","explain":"Thiệp mời: lời mời (a) - sự kiện (b) - thời gian (c) - địa điểm (d) - kết (e).","points":0.25},{"type":"mcq","level":"VD","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Excuse me, have you seen a black smartphone around here?\nb. When did you lose it?\nc. About an hour ago, near the cafeteria.\nd. Let me ask at the information desk for you.\ne. That's very kind of you. Thank you!","options":["A. a-c-b-d-e","B. c-a-b-d-e","C. a-b-c-d-e","D. b-a-c-e-d"],"answer":"C","explain":"Tìm điện thoại: hỏi (a) - hỏi thời điểm (b) - trả lời (c) - đề nghị giúp (d) - cảm ơn (e).","points":0.25},{"type":"mcq","level":"VD","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Homework plays an important role in learning.\nb. It helps students review what they learned in class.\nc. It also teaches them to work independently.\nd. However, too much homework can cause stress.\ne. Therefore, teachers should assign a reasonable amount.","options":["A. a-b-c-d-e","B. a-b-d-c-e","C. b-a-c-d-e","D. e-d-c-b-a"],"answer":"A","explain":"Câu chủ đề (a) - lợi ích 1 (b) - also thêm lợi ích (c) - However mặt trái (d) - Therefore (e).","points":0.25},{"type":"mcq","level":"TH","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nLearning to manage money is an essential life skill. (18) ___. Many teens receive pocket money from their parents each month. (19) ___. For example, dividing money into 'spend', 'save', and 'share' jars works well. (20) ___. Saving even a small amount regularly builds a useful habit. (21) ___. Before buying something, ask yourself if you really need it. (22) ___.\n\nBlank (18):","options":["A. Sadly, few schools teach students about personal finance","B. Money grows on trees","C. Finance is a difficult word","D. Schools teach many subjects"],"answer":"A","explain":"Câu sau nói teen nhận tiền tiêu vặt - câu trước nêu thực trạng: ít trường dạy quản lý tài chính.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nLearning to manage money is an essential life skill. (18) ___. Many teens receive pocket money from their parents each month. (19) ___. For example, dividing money into 'spend', 'save', and 'share' jars works well. (20) ___. Saving even a small amount regularly builds a useful habit. (21) ___. Before buying something, ask yourself if you really need it. (22) ___.\n\nBlank (19):","options":["A. Parents give money every day","B. Receiving money is always fun","C. The first rule is to spend less than you receive","D. Rules should never be followed"],"answer":"C","explain":"Câu sau cho ví dụ chia tiền thành các lọ - nguyên tắc đầu tiên: tiêu ít hơn thu.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nLearning to manage money is an essential life skill. (18) ___. Many teens receive pocket money from their parents each month. (19) ___. For example, dividing money into 'spend', 'save', and 'share' jars works well. (20) ___. Saving even a small amount regularly builds a useful habit. (21) ___. Before buying something, ask yourself if you really need it. (22) ___.\n\nBlank (20):","options":["A. It also teaches patience and planning for the future","B. Habits are hard to change","C. Future plans are useless","D. Patience is unnecessary"],"answer":"A","explain":"'It' chỉ việc tiết kiệm đều đặn - còn dạy kiên nhẫn và lập kế hoạch tương lai.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nLearning to manage money is an essential life skill. (18) ___. Many teens receive pocket money from their parents each month. (19) ___. For example, dividing money into 'spend', 'save', and 'share' jars works well. (20) ___. Saving even a small amount regularly builds a useful habit. (21) ___. Before buying something, ask yourself if you really need it. (22) ___.\n\nBlank (21):","options":["A. Purchases make people happy","B. Questions are difficult to answer","C. Simple things are boring","D. This simple question can stop many wasteful purchases"],"answer":"D","explain":"'This simple question' chỉ câu hỏi 'có thực sự cần không' ở câu trước.","points":0.25},{"type":"mcq","level":"VDC","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nLearning to manage money is an essential life skill. (18) ___. Many teens receive pocket money from their parents each month. (19) ___. For example, dividing money into 'spend', 'save', and 'share' jars works well. (20) ___. Saving even a small amount regularly builds a useful habit. (21) ___. Before buying something, ask yourself if you really need it. (22) ___.\n\nBlank (22):","options":["A. Tomorrow never comes","B. Short conclusions are best","C. Freedom is expensive","D. In short, smart money habits today mean financial freedom tomorrow"],"answer":"D","explain":"'In short' kết luận: thói quen tiền bạc thông minh hôm nay nghĩa là tự do tài chính mai sau.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following passage and mark the letter A, B, C, or D to indicate the best answer to each question.\n\nMusic is a universal language that everyone can understand. Whether it is a lively pop song or a gentle lullaby, music has the power to change our mood. Scientists have found that listening to music we love releases chemicals in the brain that make us feel happy.\n\nMusic also helps us learn. Many teachers use songs to help students remember vocabulary and grammar. A catchy melody can make new words stick in our memory much longer than silent reading. This is why children learn the alphabet through the ABC song.\n\nPlaying an instrument brings even more benefits. Studies show that children who learn music often do better in maths and reading. Playing in a band or orchestra also teaches teamwork and discipline, as everyone must practise regularly and listen to each other.\n\nIn hospitals, music is used to help patients feel calmer and recover faster. Elderly people with memory problems often remember old songs even when they forget other things.\n\nFrom classrooms to hospitals, music proves its value every day. As the famous saying goes, 'Where words fail, music speaks.'\n\nWhat is the main idea of the passage?","options":["A. Why pop songs are popular","B. The benefits of music in life","C. How to play the piano","D. The history of lullabies"],"answer":"B","explain":"Cả bài nói về lợi ích của âm nhạc: tâm trạng, học tập, sức khỏe.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following passage and mark the letter A, B, C, or D to indicate the best answer to each question.\n\nMusic is a universal language that everyone can understand. Whether it is a lively pop song or a gentle lullaby, music has the power to change our mood. Scientists have found that listening to music we love releases chemicals in the brain that make us feel happy.\n\nMusic also helps us learn. Many teachers use songs to help students remember vocabulary and grammar. A c r A, B, C, or D to indicate the best answer to each question.\n\nIn busy cities full of concrete and traffic, parks are like green lungs. They give residents fresh air, shade, and a peaceful place to relax. Children play there, elderly people exercise there, and families have picnics on weekends.\n\nParks also help the environment. Trees in parks absorb carbon dioxide and release oxygen. They lower the temperature of surrounding areas, fighting the 'heat island' effect that makes cities hotter than the countryside. During heavy rain, park soil absorbs water and reduces flooding.\n\nMoreover, parks bring people together. Free concerts, outdoor yoga classes, and weekend markets often take place in parks. Neighbors who might never talk otherwise become friends through these activities.\n\nSadly, many cities lack enough parks. As land prices rise, green spaces are replaced by shopping malls and offices. Experts warn that cities need at least 9 square meters of green space per person, but many fall far short.\n\nProtecting existing parks and creating new ones should be a priority. A city with more parks is not only more beautiful but also healthier and happier.\n\nWhat is the main idea of the passage?","options":["A. The history of picnics","B. Why shopping malls are popular","C. The importance of parks in cities","D. How to plant trees"],"answer":"C","explain":"Cả bài nói về vai trò của công viên: sức khỏe, môi trường, cộng đồng.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following passage and mark the letter A, B, C, or D to indicate the best answer to each question.\n\nIn busy cities full of concrete and traffic, parks are like green lungs. They give residents fresh air, shade, and a peaceful place to relax. Children play there, elderly people exercise there, and families have picnics on weekends.\n\nParks also help the environment. Trees in parks absorb carbon dioxide and release oxygen. They lower the temperature of surrounding areas, fighting the 'hea
