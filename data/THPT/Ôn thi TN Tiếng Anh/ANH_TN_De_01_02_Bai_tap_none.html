<script type="application/json" class="saobay-exam10-data">{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Read the following notice and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nSCHOOL ART FESTIVAL\nOur school will (1) ___ the annual Art Festival on Saturday, March 15th. The event will (2) ___ place in the schoolyard from 8 a.m. to 4 p.m. All students are invited to (3) ___ part in painting, singing, and drama contests. Artworks must be (4) ___ to the organizers before March 10th. The (5) ___ creative works will receive special prizes. Do not miss this chance to (6) ___ your talent with friends!\n\nBlank (1):","options":["A. invent","B. host","C. cancel","D. visit"],"answer":"B","explain":"'host an event' = đăng cai, tổ chức sự kiện. 'visit/invent/cancel' không hợp nghĩa.","points":0.25},{"type":"mcq","level":"NB","q":"Read the following notice and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nSCHOOL ART FESTIVAL\nOur school will (1) ___ the annual Art Festival on Saturday, March 15th. The event will (2) ___ place in the schoolyard from 8 a.m. to 4 p.m. All students are invited to (3) ___ part in painting, singing, and drama contests. Artworks must be (4) ___ to the organizers before March 10th. The (5) ___ creative works will receive special prizes. Do not miss this chance to (6) ___ your talent with friends!\n\nBlank (2):","options":["A. make","B. have","C. take","D. do"],"answer":"C","explain":"Collocation cố định: 'take place' = diễn ra.","points":0.25},{"type":"mcq","level":"NB","q":"Read the following notice and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nSCHOOL ART FESTIVAL\nOur school will (1) ___ the annual Art Festival on Saturday, March 15th. The event will (2) ___ place in the schoolyard from 8 a.m. to 4 p.m. All students are invited to (3) ___ part in painting, singing, and drama contests. Artworks must be (4) ___ to the organizers before March 10th. The (5) ___ creative works will receive special prizes. Do not miss this chance to (6) ___ your talent with friends!\n\nBlank (3):","options":["A. join","B. enter","C. take","D. play"],"answer":"C","explain":"Collocation: 'take part in' = tham gia. 'join' đi trực tiếp với tân ngữ, không có 'part'.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following notice and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nSCHOOL ART FESTIVAL\nOur school will (1) ___ the annual Art Festival on Saturday, March 15th. The event will (2) ___ place in the schoolyard from 8 a.m. to 4 p.m. All students are invited to (3) ___ part in painting, singing, and drama contests. Artworks must be (4) ___ to the organizers before March 10th. The (5) ___ creative works will receive special prizes. Do not miss this chance to (6) ___ your talent with friends!\n\nBlank (4):","options":["A. submit","B. submitted","C. submitting","D. submission"],"answer":"B","explain":"Câu bị động: 'must be + V3/ed'. 'Artworks must be submitted' = các tác phẩm phải được nộp.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following notice and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nSCHOOL ART FESTIVAL\nOur school will (1) ___ the annual Art Festival on Saturday, March 15th. The event will (2) ___ place in the schoolyard from 8 a.m. to 4 p.m. All students are invited to (3) ___ part in painting, singing, and drama contests. Artworks must be (4) ___ to the organizers before March 10th. The (5) ___ creative works will receive special prizes. Do not miss this chance to (6) ___ your talent with friends!\n\nBlank (5):","options":["A. more","B. many","C. most","D. much"],"answer":"C","explain":"So sánh nhất: 'the most creative' = sáng tạo nhất. Trước tính từ dài dùng 'the most'.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following notice and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nSCHOOL ART FESTIVAL\nOur school will (1) ___ the annual Art Festival on Saturday, March 15th. The event will (2) ___ place in the schoolyard from 8 a.m. to 4 p.m. All students are invited to (3) ___ part in painting, singing, and drama contests. Artworks must be (4) ___ to the organizers before March 10th. The (5) ___ creative works will receive special prizes. Do not miss this chance to (6) ___ your talent with friends!\n\nBlank (6):","options":["A. share","B. lose","C. hide","D. sell"],"answer":"A","explain":"'share your talent' = chia sẻ tài năng. Ngữ cảnh lễ hội tích cực nên loại các từ nghĩa tiêu cực.","points":0.25},{"type":"mcq","level":"NB","q":"Read the following leaflet and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nBOOK FAIR AT CITY LIBRARY\nThe City Library is organizing a Book Fair from June 1st to June 7th. Visitors can (7) ___ thousands of books at half price. The fair is a great chance for book (8) ___ to find rare titles. There will also be storytelling sessions (9) ___ children every afternoon. Entry is free, but visitors (10) ___ register online in advance. The library hopes the event will (11) ___ a love of reading among young people. For more information, please (12) ___ the library office.\n\nBlank (7):","options":["A. buy","B. sell","C. borrow","D. write"],"answer":"A","explain":"'buy books at half price' = mua sách giảm nửa giá. Người đi hội sách là người mua.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following leaflet and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nBOOK FAIR AT CITY LIBRARY\nThe City Library is organizing a Book Fair from June 1st to June 7th. Visitors can (7) ___ thousands of books at half price. The fair is a great chance for book (8) ___ to find rare titles. There will also be storytelling sessions (9) ___ children every afternoon. Entry is free, but visitors (10) ___ register online in advance. The library hopes the event will (11) ___ a love of reading among young people. For more information, please (12) ___ the library office.\n\nBlank (8):","options":["A. sellers","B. writers","C. lovers","D. makers"],"answer":"C","explain":"Collocation: 'book lovers' = người yêu sách.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following leaflet and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nBOOK FAIR AT CITY LIBRARY\nThe City Library is organizing a Book Fair from June 1st to June 7th. Visitors can (7) ___ thousands of books at half price. The fair is a great chance for book (8) ___ to find rare titles. There will also be storytelling sessions (9) ___ children every afternoon. Entry is free, but visitors (10) ___ register online in advance. The library hopes the event will (11) ___ a love of reading among young people. For more information, please (12) ___ the library office.\n\nBlank (9):","options":["A. with","B. to","C. for","D. by"],"answer":"C","explain":"'sessions for children' = buổi kể chuyện dành cho trẻ em. Giới từ 'for' chỉ đối tượng hưởng.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following leaflet and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nBOOK FAIR AT CITY LIBRARY\nThe City Library is organizing a Book Fair from June 1st to June 7th. Visitors can (7) ___ thousands of books at half price. The fair is a great chance for book (8) ___ to find rare titles. There will also be storytelling sessions (9) ___ children every afternoon. Entry is free, but visitors (10) ___ register online in advance. The library hopes the event will (11) ___ a love of reading among young people. For more information, please (12) ___ the library office.\n\nBlank (10):","options":["A. must","B. mustn't","C. shouldn't","D. can't"],"answer":"A","explain":"'must register in advance' = bắt buộc đăng ký trước. Các đáp án phủ định làm sai nghĩa câu.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following leaflet and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nBOOK FAIR AT CITY LIBRARY\nThe City Library is organizing a Book Fair from June 1st to June 7th. Visitors can (7) ___ thousands of books at half price. The fair is a great chance for book (8) ___ to find rare titles. There will also be storytelling sessions (9) ___ children every afternoon. Entry is free, but visitors (10) ___ register online in advance. The library hopes the event will (11) ___ a love of reading among young people. For more information, please (12) ___ the library office.\n\nBlank (11):","options":["A. reduce","B. encourage","C. discourage","D. prevent"],"answer":"B","explain":"'encourage a love of reading' = khuyến khích tình yêu đọc sách. Ba đáp án còn lại nghĩa ngược.","points":0.25},{"type":"mcq","level":"NB","q":"Read the following leaflet and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nBOOK FAIR AT CITY LIBRARY\nThe City Library is organizing a Book Fair from June 1st to June 7th. Visitors can (7) ___ thousands of books at half price. The fair is a great chance for book (8) ___ to find rare titles. There will also be storytelling sessions (9) ___ children every afternoon. Entry is free, but visitors (10) ___ register online in advance. The library hopes the event will (11) ___ a love of reading among young people. For more information, please (12) ___ the library office.\n\nBlank (12):","options":["A. forget","B. contact","C. avoid","D. leave"],"answer":"B","explain":"'contact the office' = liên hệ văn phòng. Ngữ cảnh cần thêm thông tin nên chỉ 'contact' hợp lý.","points":0.25},{"type":"mcq","level":"TH","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Good morning! Can I help you find something?\nb. Good morning! I am looking for a book about Vietnamese history.\nc. Sure. History books are on the third shelf over there.\nd. Thank you so much!\ne. You are welcome. Enjoy your reading!","options":["A. a-b-c-d-e","B. a-c-b-d-e","C. c-a-b-d-e","D. b-a-c-e-d"],"answer":"A","explain":"Hội thoại quầy lễ tân: chào hỏi (a) - nêu nhu cầu (b) - hướng dẫn (c) - cảm ơn (d) - đáp lời (e).","points":0.25},{"type":"mcq","level":"NB","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Dear Mai,\nb. I am writing to invite you to my birthday party this Saturday.\nc. The party will start at 7 p.m. at my house.\nd. I hope you can come and have fun with us.\ne. Best wishes, Lan","options":["A. a-b-c-d-e","B. a-c-b-e-d","C. b-a-d-c-e","D. e-d-c-b-a"],"answer":"A","explain":"Thư mời: chào (a) - mục đích viết thư (b) - thông tin chi tiết (c) - mong đợi (d) - kết thư (e).","points":0.25},{"type":"mcq","level":"TH","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Regular exercise brings many benefits to our health.\nb. First, it helps us stay fit and control our weight.\nc. Second, it reduces stress and improves our mood.\nd. Finally, it strengthens our heart and muscles.\ne. Therefore, everyone should exercise at least 30 minutes a day.","options":["A. a-c-b-e-d","B. e-a-b-c-d","C. b-c-d-e-a","D. a-b-c-d-e"],"answer":"D","explain":"Đoạn văn: câu chủ đề (a) - First (b) - Second (c) - Finally (d) - kết luận Therefore (e).","points":0.25},{"type":"mcq","level":"TH","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Hello, this is Minh speaking. May I speak to Ms. Hoa?\nb. Hello, Minh. This is Hoa. How can I help you?\nc. I am calling to ask about tomorrow's field trip.\nd. Of course. We will meet at the school gate at 6:30 a.m.\ne. Thank you, Ms. Hoa. See you tomorrow!","options":["A. a-b-c-d-e","B. e-d-c-b-a","C. a-c-b-e-d","D. b-a-d-c-e"],"answer":"A","explain":"Điện thoại: người gọi xưng danh (a) - người nghe đáp (b) - nêu lý do gọi (c) - trả lời (d) - cảm ơn, chào (e).","points":0.25},{"type":"mcq","level":"VD","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Plastic pollution is one of the biggest threats to our oceans.\nb. Every year, millions of tons of plastic end up in the sea.\nc. Sea animals often mistake plastic for food and get hurt.\nd. To solve this problem, we should reduce single-use plastics.\ne. Small actions like using cloth bags can make a big difference.","options":["A. a-b-d-c-e","B. a-c-b-e-d","C. b-a-d-c-e","D. a-b-c-d-e"],"answer":"D","explain":"Nêu vấn đề (a) - số liệu (b) - hậu quả (c) - giải pháp (d) - lời kêu gọi (e).","points":0.25},{"type":"mcq","level":"TH","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nLiving a healthy life is not difficult if we build good habits. (18) ___. Experts suggest drinking at least two liters of water every day. (19) ___. For example, walking to school instead of taking the bus is a simple choice. (20) ___. Teenagers need about eight hours of sleep each night to stay focused at school. (21) ___. Finally, spending less time on phones helps us feel more relaxed. (22) ___.\n\nBlank (18):","options":["A. A glass of water costs very little","B. Water is found in rivers and lakes","C. People should avoid drinking water at night","D. First, start your day with a glass of water"],"answer":"D","explain":"Câu sau nói về uống nước mỗi ngày nên câu mở đầu phải giới thiệu thói quen uống nước.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nLiving a healthy life is not difficult if we build good habits. (18) ___. Experts suggest drinking at least two liters of water every day. (19) ___. For example, walking to school instead of taking the bus is a simple choice. (20) ___. Teenagers need about eight hours of sleep each night to stay focused at school. (21) ___. Finally, spending less time on phones helps us feel more relaxed. (22) ___.\n\nBlank (19):","options":["A. Exercise is only for professional athletes","B. Buses are convenient for long distances","C. Second, try to move your body for at least 30 minutes daily","D. Many students enjoy sitting in class"],"answer":"C","explain":"Câu sau cho ví dụ 'walking to school' nên câu trước phải nói về vận động hằng ngày.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nLiving a healthy life is not difficult if we build good habits. (18) ___. Experts suggest drinking at least two liters of water every day. (19) ___. For example, walking to school instead of taking the bus is a simple choice. (20) ___. Teenagers need about eight hours of sleep each night to stay focused at school. (21) ___. Finally, spending less time on phones helps us feel more relaxed. (22) ___.\n\nBlank (20):","options":["A. Sleep has nothing to do with health","B. Getting enough sleep is equally important","C. Schools should start classes at midnight","D. Teenagers love staying up late to chat"],"answer":"B","explain":"Câu sau nói về giấc ngủ của teen nên cần câu chuyển ý sang chủ đề giấc ngủ.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nLiving a healthy life is not difficult if we build good habits. (18) ___. Experts suggest drinking at least two liters of water every day. (19) ___. For example, walking to school instead of taking the bus is a simple choice. (20) ___. Teenagers need about eight hours of sleep each night to stay focused at school. (21) ___. Finally, spending less time on phones helps us feel more relaxed. (22) ___.\n\nBlank (21):","options":["A. Screens were invented a hundred years ago","B. Everyone should buy the latest smartphone","C. Phones are the most expensive devices today","D. Taking short breaks from screens can reduce stress"],"answer":"D","explain":"Câu sau nói 'spending less time on phones' nên câu trước phải liên quan đến màn hình và thư giãn.","points":0.25},{"type":"mcq","level":"VDC","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nLiving a healthy life is not difficult if we build good habits. (18) ___. Experts suggest drinking at least two liters of water every day. (19) ___. For example, walking to school instead of taking the bus is a simple choice. (20) ___. Teenagers need about eight hours of sleep each night to stay focused at school. (21) ___. Finally, spending less time on phones helps us feel more relaxed. (22) ___.\n\nBlank (22):","options":["A. Life was simpler without modern habits","B. Healthy habits are impossible for busy people","C. Happiness depends only on good luck","D. In short, small daily habits can lead to a healthier and happier life"],"answer":"D","explain":"Câu kết bài phải tóm tắt ý chính: thói quen nhỏ hằng ngày tạo cuộc sống khỏe mạnh.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following passage and mark the letter A, B, C, or D to indicate the best answer to each question.\n\nLast summer, 16-year-old Linh decided to spend her holiday differently. Instead of staying at home playing video games, she joined a volunteer group that teaches English to children in a mountain village. At first, Linh felt nervous because she had never taught anyone before. However, the children's bright smiles quickly melted her worries away.\n\nEvery morning, Linh and her friends prepared simple lessons with songs and games. The children, aged 6 to 10, were eager to learn although they had few books. In the afternoons, the volunteers helped repair the small village school and planted trees around it.\n\nAfter one month, Linh returned home with unforgettable memories. She realized that volunteering had taught her as much as she had taught the children. She learned to be patient, confident, and grateful for what she has. 'I used to think holidays were for resting,' Linh said, 'but now I know they can also be for giving.'\n\nLinh's story shows that young people can make a real difference. You do not need to be rich or famous to help others - you just need a kind heart and a little time.\n\nWhat is the main idea of the passage?","options":["A. Why video games are bad for teenagers","B. How to teach English to mountain children","C. Why Linh felt nervous at first","D. How Linh spent her summer holiday volunteering"],"answer":"D","explain":"Cả bài kể về kỳ nghỉ đi tình nguyện dạy tiếng Anh của Linh và bài học rút ra.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following passage and mark the letter A, B, C, or D to indicate the best answer to each question.\n\nLast summer, 16-year-old Linh decided to spend her holiday differently. Instead of staying at home playing video games, she joined a volunteer group that teaches English to children in a mountain village. At first, Linh felt nervous because she had never taught anyone before. However, the children's bright smiles quickly melted her worries away.\n\nEvery morning, Linh and her friends prepared simple lessons with songs and games. The children, aged 6 to 10, were eager to learn although they had few books. In the afternoons, the volunteers helped repair the small village school and planted trees around it.\n\nAfter one month, Linh returned home with unforgettable memories. She realized that volunteering had taught her as much as she had taught the children. She learned to be patient, confident, and grateful for what she has. 'I used to think holidays were for resting,' Linh said, 'but now I know they can also be for giving.'\n\nLinh's story shows that young people can make a real difference. You do not need to be rich or famous to help others - you just need a kind heart and a little time.\n\nThe word 'melted' in paragraph 1 is closest in meaning to ___.","options":["A. heated","B. froze","C. removed","D. broke"],"answer":"C","explain":"'melted her worries away' = xua tan nỗi lo, gần nghĩa 'removed' = loại bỏ.","points":0.25},{"type":"mcq","level":"NB","q":"Read the following passage and mark the letter A, B, C, or D to indicate the best answer to each question.\n\nLast summer, 16-year-old Linh decided to spend her holiday differently. Instead of staying at home playing video games, she joined a volunteer group that teaches English to children in a mountain village. At first, Linh felt nervous because she had never taught anyone before. However, the children's bright smiles quickly melted her worries away.\n\nEvery morning, Linh and her friends prepared simple lessons with songs and games. The children, aged 6 to 10, were eager to learn although they had few books. In the afternoons, the volunteers helped repair the small village school and planted trees around it.\n\nAfter one month, Linh returned home with unforgettable memories. She realized that volunteering had taught her as much as she had taught the children. She learned to be patient, confident, and grateful for what she has. 'I used to think holidays were for resting,' Linh said, 'but now I know they can also be for giving.'\n\nLinh's story shows that young people can make a real difference. You do not need to be rich or famous to help others - you just need a kind heart and a little time.\n\nAccording to paragraph 2, what did the volunteers do in the afternoons?", ions":["A. To explain how to teach English","B. To compare holidays in the past and now","C. To encourage young people to volunteer","D. To describe a mountain village school"],"answer":"C","explain":"Câu kết kêu gọi người trẻ giúp đỡ người khác - mục đích khuyến khích tình nguyện.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following passage and mark the letter A, B, C, or D to indicate the best answer to each question.\n\nArtificial intelligence (AI) is changing the way students learn around the world. In many schools, AI-powered apps now help students practise English, solve maths problems, and even write essays. Supporters say that AI makes learning more personal because it can adjust lessons to each student's level. A student who is weak in grammar, for instance, will receive more grammar exercises, while a stronger student moves on to harder tasks.\n\nHowever, not everyone welcomes this change. Some teachers worry that students may depend too much on technology and stop thinking for themselves. If an AI app always gives the correct answer, students might not learn how to solve problems on their own. There are also concerns about fairness: not all schools can afford modern devices, so students in poor areas could fall further behind.\n\nDespite these worries, most experts agree that AI will not replace teachers. A machine can check grammar, but it cannot understand a student's feelings or inspire a love of learning. The best approach, they suggest, is to combine AI tools with human teaching. Teachers can use AI to save time on marking, then spend more time talking with and encouraging their students.\n\nIn short, AI is a powerful tool, but it is only a tool. How well it works in education depends on how wisely people use it.\n\nWhat is the passage mainly about?","options":["A. Why teachers dislike technology","B. How to build AI-powered apps","C. The role of AI in modern education","D. The history of artificial intelligence"],"answer":"C","explain" n":"'the winner of each event' = người thắng mỗi nội dung. Người thắng mới nhận huy chương vàng.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following notice and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nSCHOOL SPORTS DAY\nOur school is going to (1) ___ Sports Day on Friday, April 18th. The opening ceremony will (2) ___ at 7 a.m. sharp. Students can (3) ___ in running, long jump, and football matches. Competitors must (4) ___ their names with the PE teacher before April 10th. The (5) ___ of each event will receive gold medals. Spectators are welcome, (6) ___ everyone must follow the safety rules.\n\nBlank (6):","options":["A. because","B. but","C. so","D. and"],"answer":"B","explain":"Hai vế tương phản: chào đón khán giả NHƯNG mọi người phải tuân thủ nội quy - dùng 'but'.","points":0.25},{"type":"mcq","level":"NB","q":"Read the following leaflet and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nJOIN OUR ENGLISH SPEAKING CLUB!\nDo you want to (7) ___ your English speaking skills? Our club meets every Saturday morning at the Youth Centre. Members practise (8) ___ in pairs and small groups. You will also take part in fun games, debates, and role-plays. The club is (9) ___ to all students from grades 10 to 12. (10) ___ experience is needed - beginners are welcome! The monthly fee is only 50,000 VND, (11) ___ includes all learning materials. Come and (12) ___ new friends who share your passion for English!\n\nBlank (7):","options":["A. improve","B. ignore","C. forget","D. worsen"],"answer":"A","explain":"'improve skills' = cải thiện kỹ năng. Ngữ cảnh tích cực nên loại các từ nghĩa xấu.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following leaflet and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nJOIN OUR ENGLISH SPEAKING CLUB!\nDo you want to (7) ___ your English speaking skills? Our club meets every Saturday morning at the Youth Centre. Members practise (8) ___ in pairs and small groups. You will also take part in fun games, debates, and role-plays. The club is (9) ___ to all students from grades 10 to 12. (10) ___ experience is needed - beginners are welcome! The monthly fee is only 50,000 VND, (11) ___ includes all learning materials. Come and (12) ___ new friends who share your passion for English!\n\nBlank (8):","options":["A. speak","B. to speak","C. speaking","D. spoken"],"answer":"C","explain":"Sau 'practise' dùng danh động từ: 'practise speaking' = luyện nói.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following leaflet and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nJOIN OUR ENGLISH SPEAKING CLUB!\nDo you want to (7) ___ your English speaking skills? Our club meets every Saturday morning at the Youth Centre. Members practise (8) ___ in pairs and small groups. You will also take part in fun games, debates, and role-plays. The club is (9) ___ to all students from grades 10 to 12. (10) ___ experience is needed - beginners are welcome! The monthly fee is only 50,000 VND, (11) ___ includes all learning materials. Come and (12) ___ new friends who share your passion for English!\n\nBlank (9):","options":["A. full","B. open","C. late","D. closed"],"answer":"B","explain":"'be open to' = mở cửa chào đón. CLB mở cho mọi học sinh khối 10-12.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following leaflet and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nJOIN OUR ENGLISH SPEAKING CLUB!\nDo you want to (7) ___ your English speaking skills? Our club meets every Saturday morning at the Youth Centre. Members practise (8) ___ in pairs and small groups. You will also take part in fun games, debates, and role-plays. The club is (9) ___ to all students from grades 10 to 12. (10) ___ experience is needed - beginners are welcome! The monthly fee is only 50,000 VND, (11) ___ includes all learning materials. Come and (12) ___ new friends who share your passion for English!\n\nBlank (10):","options":["A. No","B. Any","C. Some","D. Much"],"answer":"A","explain":"'No experience is needed' = không cần kinh nghiệm. Vế sau 'beginners are welcome' xác nhận.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following leaflet and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nJOIN OUR ENGLISH SPEAKING CLUB!\nDo you want to (7) ___ your English speaking skills? Our club meets every Saturday morning at the Youth Centre. Members practise (8) ___ in pairs and small groups. You will also take part in fun games, debates, and role-plays. The club is (9) ___ to all students from grades 10 to 12. (10) ___ experience is needed - beginners are welcome! The monthly fee is only 50,000 VND, (11) ___ includes all learning materials. Come and (12) ___ new friends who share your passion for English!\n\nBlank (11):","options":["A. whose","B. which","C. who","D. where"],"answer":"B","explain":"Mệnh đề quan hệ thay cho '50,000 VND' (vật) - dùng 'which'.","points":0.25},{"type":"mcq","level":"NB","q":"Read the following leaflet and mark the letter A, B, C, or D to indicate the correct option that best fits each numbered blank.\n\nJOIN OUR ENGLISH SPEAKING CLUB!\nDo you want to (7) ___ your English speaking skills? Our club meets every Saturday morning at the Youth Centre. Members practise (8) ___ in pairs and small groups. You will also take part in fun games, debates, and role-plays. The club is (9) ___ to all students from grades 10 to 12. (10) ___ experience is needed - beginners are welcome! The monthly fee is only 50,000 VND, (11) ___ includes all learning materials. Come and (12) ___ new friends who share your passion for English!\n\nBlank (12):","options":["A. meet","B. lose","C. leave","D. miss"],"answer":"A","explain":"'meet new friends' = gặp gỡ bạn mới. Hợp với ý 'share your passion'.","points":0.25},{"type":"mcq","level":"NB","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Excuse me, how much is a ticket to the concert?\nb. It is 100,000 VND for students.\nc. Great! I would like two tickets, please.\nd. Here you are. Enjoy the show!\ne. Thank you!","options":["A. d-e-a-b-c","B. b-a-d-c-e","C. a-b-c-d-e","D. a-c-b-d-e"],"answer":"C","explain":"Mua vé: hỏi giá (a) - báo giá (b) - đặt mua (c) - đưa vé (d) - cảm ơn (e).","points":0.25},{"type":"mcq","level":"TH","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Dear Mr. Brown,\nb. Thank you very much for your wonderful gift.\nc. I really love the English dictionary you sent me.\nd. It will help me a lot with my studies.\ne. Yours sincerely, Nam","options":["A. e-d-c-b-a","B. a-c-b-e-d","C. b-a-d-c-e","D. a-b-c-d-e"],"answer":"D","explain":"Thư cảm ơn: chào (a) - cảm ơn chung (b) - nói rõ món quà (c) - ý nghĩa (d) - kết thư (e).","points":0.25},{"type":"mcq","level":"TH","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Reading books regularly offers great benefits.\nb. Firstly, it expands our vocabulary and knowledge.\nc. Secondly, it improves our focus and imagination.\nd. Moreover, it is an excellent way to relax.\ne. In conclusion, reading is a habit worth developing.","options":["A. b-c-d-e-a","B. e-a-b-c-d","C. a-c-b-d-e","D. a-b-c-d-e"],"answer":"D","explain":"Câu chủ đề (a) - Firstly (b) - Secondly (c) - Moreover (d) - In conclusion (e).","points":0.25},{"type":"mcq","level":"VD","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Excuse me, I think I left my bag in this classroom.\nb. What does your bag look like?\nc. It is a small blue backpack with a keychain.\nd. Let me check under the desks... Here it is!\ne. Oh, thank you so much! You are very kind.","options":["A. a-c-b-d-e","B. b-a-d-c-e","C. c-a-b-e-d","D. a-b-c-d-e"],"answer":"D","explain":"Tìm đồ thất lạc: trình bày (a) - hỏi đặc điểm (b) - mô tả (c) - tìm thấy (d) - cảm ơn (e).","points":0.25},{"type":"mcq","level":"VD","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Saving water is essential for our future.\nb. We can start by turning off taps while brushing our teeth.\nc. Taking shorter showers also saves a lot of water.\nd. In addition, we should fix leaking pipes immediately.\ne. If everyone saves a little, the result will be huge.","options":["A. b-a-c-d-e","B. e-d-c-b-a","C. a-b-c-d-e","D. a-b-d-c-e"],"answer":"C","explain":"Câu chủ đề (a) - ví dụ 1 (b) - also (c) - In addition (d) - kết luận điều kiện (e).","points":0.25},{"type":"mcq","level":"TH","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nSleep is essential for teenagers, but many do not get enough of it. (18) ___. While we sleep, our brain stores what we learned during the day. (19) ___. For instance, students who sleep well usually get better marks. (20) ___. Unfortunately, homework and phones often keep teens awake late. (21) ___. A simple solution is to turn off all screens 30 minutes before bed. (22) ___.\n\nBlank (18):","options":["A. Adults never need to sleep at all","B. Sleep is a waste of valuable time","C. In fact, teens need eight to ten hours of sleep each night","D. Dreams are always easy to remember"],"answer":"C","explain":"Câu sau nói não bộ lưu trữ kiến thức khi ngủ nên câu trước phải nêu nhu cầu giấc ngủ của teen.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nSleep is essential for teenagers, but many do not get enough of it. (18) ___. While we sleep, our brain stores what we learned during the day. (19) ___. For instance, students who sleep well usually get better marks. (20) ___. Unfortunately, homework and phones often keep teens awake late. (21) ___. A simple solution is to turn off all screens 30 minutes before bed. (22) ___.\n\nBlank (19):","options":["A. Daytime is better than nighttime","B. Learning has nothing to do with sleep","C. Brains are located inside our heads","D. This is why a good night's sleep improves memory"],"answer":"D","explain":"'This' thay thế cho ý câu trước (não lưu trữ khi ngủ) - giải thích vì sao ngủ ngon cải thiện trí nhớ.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nSleep is essential for teenagers, but many do not get enough of it. (18) ___. While we sleep, our brain stores what we learned during the day. (19) ___. For instance, students who sleep well usually get better marks. (20) ___. Unfortunately, homework and phones often keep teens awake late. (21) ___. A simple solution is to turn off all screens 30 minutes before bed. (22) ___.\n\nBlank (20):","options":["A. Marks are given by teachers every term","B. Better marks require expensive courses","C. As a result, tired students find it hard to concentrate in class","D. Sleeping well makes students feel hungry"],"answer":"C","explain":"'As a result' nối hệ quả: ngủ không đủ - mệt mỏi - khó tập trung trong lớp.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nSleep is essential for teenagers, but many do not get enough of it. (18) ___. While we sleep, our brain stores what we learned during the day. (19) ___. For instance, students who sleep well usually get better marks. (20) ___. Unfortunately, homework and phones often keep teens awake late. (21) ___. A simple solution is to turn off all screens 30 minutes before bed. (22) ___.\n\nBlank (21):","options":["A. Phones are useful for many purposes","B. Late nights are good for health","C. Homework is the easiest part of school","D. These habits steal precious sleeping time"],"answer":"D","explain":"'These habits' chỉ bài tập và điện thoại thức khuya ở câu trước - chúng 'đánh cắp' giờ ngủ.","points":0.25},{"type":"mcq","level":"VDC","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nSleep is essential for teenagers, but many do not get enough of it. (18) ___. While we sleep, our brain stores what we learned during the day. (19) ___. For instance, students who sleep well usually get better marks. (20) ___. Unfortunately, homework and phones often keep teens awake late. (21) ___. A simple solution is to turn off all screens 30 minutes before bed. (22) ___.\n\nBlank (22):","options":["A. In short, protecting our sleep means protecting our health","B. Screens should be used all night long","C. Health is not important for young people","D. Bedtime routines are a waste of time"],"answer":"A","explain":"Câu kết tóm tắt: bảo vệ giấc ngủ chính là bảo vệ sức khỏe.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following passage and mark the letter A, B, C, or D to indicate the best answer to each question.\n\nEvery year, the world uses about 500 billion plastic bags. Most of them are used for just a few minutes, yet they can last for hundreds of years in the environment. In Vietnam, plastic bags from markets and shops end up in rivers and finally in the sea, harming fish and other sea creatures.\n\nThe good news is that change is possible. Many young people have started bringing cloth bags when they go shopping. Some shops now offer paper bags or charge extra for plastic ones. These small steps are making a big difference.\n\nMai, a 17-year-old student in Hanoi, started a campaign called 'Green Bag Day' at her school. Every Friday, students and teachers bring reusable bags and refuse single-use plastics. 'At first, some friends forgot,' Mai says, 'but now it has become a habit for most of us.'\n\nExperts say that if everyone replaces just one plastic bag a day with a reusable one, millions of bags would be saved each year. Protecting the environment does not require big actions - it starts with the bag in your hand.\n\nWhat is the main idea of the passage?","options":["A. Why paper bags are expensive","B. Plastic pollution and small actions to reduce it","C. The history of plastic bags","D. How Mai became famous"],"answer":"B","explain":"Bài nêu tác hại túi ni-lông và các hành động nhỏ giảm thiểu (túi vải, Green Bag Day).","points":0.25},{"type":"mcq","level":"TH","q":"Read the following passage and mark the letter A, B, C, or D to indicate the best answer to each question.\n\nEvery year, the world uses about 500 billion plastic bags. Most of them are used for just a few minutes, yet they can last for hundreds of years in the environment. In Vietnam, plastic bags from markets and shops end up in rivers and finally in the sea, harming fish and other sea creatures.\n\nThe good news is that change is possible. Many young people have started bringing cloth bags when they go shopping. Some shops now offer paper bags or charge extra for plastic ones. These small steps are making a big difference.\n\nMai, a 17-year-old student in Hanoi, started a campaign called 'Green Bag Day' at her school. Every Friday, students and teachers bring reusable bags and refuse single-use plastics. 'At first, some friends forgot,' Mai says, 'but now it has become a habit for most of us.'\n\nExperts say that if everyone replaces just one plastic bag a day with a reusable one, millions of bags would be saved each year. Protecting the environment does not require big actions - it starts with the bag in your hand.\n\nThe word 'last' in paragraph 1 is closest in meaning to ___.","options":["A. continue to exist","B. disappear fast","C. fall down","D. become clean"],"answer":"A","explain":"'last for hundreds of years' = tồn tại hàng trăm năm, gần nghĩa 'continue to exist'.","points":0.25},{"type":"mcq","level":"NB","q":"Read the following passage and mark the letter A, B, C, or D to indicate the best answer to each question.\n\nEvery year, the world uses about 500 billion plastic bags. Most of them are used for just a few minutes, yet they can last for hundreds of years in the environment. In Vietnam, plastic bags from markets and shops end up in rivers and finally in the sea, harming fish and other sea creatures.\n\nThe good news is that change is possible. Many young people have started bringing cloth bags when they go shopping. Some shops now offer paper bags or charge extra for plastic ones. These small steps are making a big difference.\n\nMai, a 17-year-old student in Hanoi, started a campaign called 'Green Bag Day' at her school. Every Friday, students and teachers bring reusable bags and refuse single-use plastics. 'At first, some friends forgot,' Mai says, 'but now it has become a habit for most of us.'\n\nExperts say that if everyone replaces just one plastic bag a day with a reusable one, millions of bags would be saved each year. Protecting the environment does not require big actions - it starts with the bag in your hand.\n\nAccording to paragraph 1, plastic bags ___.","options":["A. are used for many hours each time","B. are good for fish","C. can remain in the environment for hundreds of years","D. never reach the sea"],"answer":"C","explain":"Thông tin trực tiếp: 'they can last for hundreds of years in the environment'.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following passage and mark the letter A, B, C, or D to indicate the best answer to each question.\n\nEvery year, the world uses about 500 billion plastic bags. Most of them are used for just a few minutes, yet they can last for hundreds of years in the environment. In Vietnam, plastic bags from markets and shops end up in rivers and finally in the sea, harming fish and other sea creatures.\n\nThe good news is that change is possible. Many young people have started bringing cloth bags when they go shopping. Some shops now offer paper bags or charge extra for plastic ones. These small steps are making a big difference.\n\nMai, a 17-year-old student in Hanoi, started a campaign called 'Green Bag Day' at her school. Every Friday, students and teachers bring reusable bags and refuse single-use plastics. 'At first, some friends forgot,' Mai says, 'but now it has become a habit for most of us.'\n\nExperts say that if everyone replaces just one plastic bag a day with a reusable one, millions of bags would be saved each year. Protecting the environment does not require big actions - it starts with the bag in your hand.\n\nThe word 'them' in paragraph 1 ('Most of them are used') refers to ___.","options":["A. plastic bags","B. fish","C. rivers","D. shops"],"answer":"A","explain":"'them' thay thế cho 'plastic bags' ở câu trước.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following passage and mark the letter A, B, C, or D to indicate the best answer to each question.\n\nEvery year, the world uses about 500 billion plastic bags. Most of them are used for just a few minutes, yet they can last for hundreds of years in the environment. In Vietnam, plastic bags from markets and shops end up in rivers and finally in the sea, harming fish and other sea creatures.\n\nThe good news is that change is possible. Many young people have started bringing cloth bags when they go shopping. Some shops now offer paper bags or charge extra for plastic ones. These small steps are making a big difference.\n\nMai, a 17-year-old student in Hanoi, started a campaign called 'Green Bag Day' at her school. Every Friday, students and teachers bring r
