minutes, look 20 feet away for 20 seconds.\nc. Second, avoid reading in dim light.\nd. Finally, get your eyes checked regularly.\ne. With these habits, your eyes will stay healthy.","options":["A. a-b-c-d-e","B. b-c-d-e-a","C. a-c-b-e-d","D. e-a-b-c-d"],"answer":"A","explain":"Câu chủ đề (a) - First (b) - Second (c) - Finally (d) - kết quả (e).","points":0.25},{"type":"mcq","level":"TH","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Hi team,\nb. Just a reminder about our meeting tomorrow.\nc. We will meet at 9 a.m. in Room C102.\nd. Please bring your project reports.\ne. See you then!","options":["A. e-d-c-b-a","B. a-c-b-d-e","C. b-a-d-c-e","D. a-b-c-d-e"],"answer":"D","explain":"Nhắc họp: chào (a) - nhắc việc (b) - thời gian địa điểm (c) - dặn mang báo cáo (d) - chào (e).","points":0.25},{"type":"mcq","level":"VD","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Hello, I'd like to order two pizzas for delivery.\nb. Sure. What's your address, please?\nc. 25 Le Loi Street, District 1.\nd. Your order will arrive in about 30 minutes.\ne. Thank you. I'll wait for it.","options":["A. b-a-c-d-e","B. a-c-b-e-d","C. a-b-c-d-e","D. c-a-b-d-e"],"answer":"C","explain":"Đặt đồ ăn: gọi món (a) - hỏi địa chỉ (b) - cho địa chỉ (c) - báo giờ giao (d) - cảm ơn (e).","points":0.25},{"type":"mcq","level":"VD","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Dengue fever is a dangerous disease spread by mosquitoes.\nb. To prevent it, we should remove standing water around our homes.\nc. We should also sleep under mosquito nets.\nd. In addition, keep the house clean and airy.\ne. These simple actions can protect our families effectively.","options":["A. a-b-c-d-e","B. b-a-c-d-e","C. a-b-d-c-e","D. e-d-c-b-a"],"answer":"A","explain":"Vấn đề (a) - biện pháp 1 (b) - also thêm (c) - In addition (d) - kết luận (e).","points":0.25},{"type":"mcq","level":"TH","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nSetting goals is the first step to success. (18) ___. A clear goal gives you direction and motivation. (19) ___. For example, instead of saying 'I want good marks', say 'I want 8 points in English'. (20) ___. Writing your goals down makes them feel more real. (21) ___. Big goals should be divided into small weekly steps. (22) ___.\n\nBlank (18):","options":["A. Without a goal, it is easy to waste time on unimportant things","B. First steps are always painful","C. Success comes to everyone easily","D. Goals are difficult to understand"],"answer":"A","explain":"Câu sau nói mục tiêu rõ ràng cho định hướng - câu trước nêu hậu quả khi không có mục tiêu.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nSetting goals is the first step to success. (18) ___. A clear goal gives you direction and motivation. (19) ___. For example, instead of saying 'I want good marks', say 'I want 8 points in English'. (20) ___. Writing your goals down makes them feel more real. (21) ___. Big goals should be divided into small weekly steps. (22) ___.\n\nBlank (19):","options":["A. Direction signs are found on roads","B. Good goals should be specific and realistic","C. Specific things are always boring","D. Motivation is unnecessary for success"],"answer":"B","explain":"Câu sau cho ví dụ mục tiêu cụ thể - rút ra: mục tiêu tốt phải cụ thể và thực tế.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nSetting goals is the first step to success. (18) ___. A clear goal gives you direction and motivation. (19) ___. For example, instead of saying 'I want good marks', say 'I want 8 points in English'. (20) ___. Writing your goals down makes them feel more real. (21) ___. Big goals should be divided into small weekly steps. (22) ___.\n\nBlank (20):","options":["A. Real things cannot be written","B. Daily life needs no goals","C. You can also stick your goals on the wall to see them daily","D. Walls are usually painted white"],"answer":"C","explain":"'also' thêm một mẹo: dán mục tiêu lên tường để nhìn thấy hằng ngày.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nSetting goals is the first step to success. (18) ___. A clear goal gives you direction and motivation. (19) ___. For example, instead of saying 'I want good marks', say 'I want 8 points in English'. (20) ___. Writing your goals down makes them feel more real. (21) ___. Big goals should be divided into small weekly steps. (22) ___.\n\nBlank (21):","options":["A. Progress should never be checked","B. Months have thirty days","C. Adjusting things is impossible","D. Then, check your progress every month and adjust if needed"],"answer":"D","explain":"'Then' chỉ bước tiếp theo: kiểm tra tiến độ hằng tháng và điều chỉnh.","points":0.25},{"type":"mcq","level":"VDC","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nSetting goals is the first step to success. (18) ___. A clear goal gives you direction and motivation. (19) ___. For example, instead of saying 'I want good marks', say 'I want 8 points in English'. (20) ___. Writing your goals down makes them feel more real. (21) ___. Big goals should be divided into small weekly steps. (22) ___.\n\nBlank (22):","options":["A. Every day is the same","B. Achievements come without effort","C. In the end, small steps every day lead to big achievements","D. Big steps are dangerous"],"answer":"C","explain":"'In the end' kết luận: bước nhỏ mỗi ngày dẫn đến thành tựu lớn.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following passage and mark the letter A, B, C, or D to indicate the best answer to each question.\n\nBees play a vital role in nature. They carry pollen from flower to flower, helping plants produce fruits and seeds. Without bees, many of the foods we love - apples, strawberries, and coffee - would disappear.\n\nSadly, bee numbers are falling around the world. Scientists believe several factors are responsible. Pesticides used on farms can poison bees. Climate change disrupts the timing of flowering, leaving bees without food. Diseases spread quickly among bee colonies kept close together.\n\nThe decline of bees affects humans directly. Farmers may produce less food, and prices could rise. Some regions already hire people to pollinate fruit trees by hand - a slow and costly job that bees once did for free.\n\nFortunately, we can help. Planting flowers that bloom in different seasons gives bees food all year. Avoiding pesticides in gardens protects them. In cities, rooftop gardens and parks can become safe homes for bees.\n\nProtecting bees means protecting our own future. These tiny insects do a giant job for the planet.\n\nWhat is the main idea of the passage?","options":["A. Why coffee is expensive","B. The importance of bees and threats they face","C. How to keep bees at home","D. The history of farming"],"answer":"B","explain":"Cả bài nói vai trò của ong, nguyên nhân suy giảm và cách bảo vệ.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following passage and mark the letter A, B, C, or D to indicate the best answer to each question.\n\nBees play a vital role in nature. They carry pollen from flower to flower, helping plants produce fruits and seeds. Without bees, many of the foods we love - apples, strawberries, and coffee - would disappear.\n\nSadly, bee numbers are falling around the world. Scientis
