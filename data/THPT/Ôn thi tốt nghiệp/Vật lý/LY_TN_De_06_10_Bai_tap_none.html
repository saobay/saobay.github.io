 "C. $0,4$ mm.", "D. $0,2$ mm."], "answer": "C", "explain": "$x_{t} = (k + 0,5)i$; vân tối thứ nhất ($k = 0$): $x = 0,5 \\times 0,8 = 0,4$ mm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điều kiện để xảy ra hiện tượng quang điện đối với một kim loại có giới hạn quang điện $\\lambda_0$ là", "options": ["A. bước sóng của ánh sáng kích thích $\\lambda \\le \\lambda_0$.", "B. bước sóng của ánh sáng kích thích $\\lambda \\gt \\lambda_0$.", "C. tần số của ánh sáng kích thích nhỏ hơn tần số giới hạn.", "D. cường độ của chùm sáng kích thích đủ lớn."], "answer": "A", "explain": "Định luật quang điện thứ nhất: hiện tượng quang điện chỉ xảy ra khi $\\lambda \\le \\lambda_0$ (không phụ thuộc cường độ sáng).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một chất phóng xạ có chu kì bán rã $T$. Sau thời gian $2T$, tỉ lệ khối lượng chất phóng xạ còn lại so với khối lượng ban đầu là", "options": ["A. $50\\%$.", "B. $75\\%$.", "C. $12,5\\%$.", "D. $25\\%$."], "answer": "D", "explain": "$m = m_0 \\times 2^{-t/T} = m_0 \\times 2^{-2} = 25\\%\\, m_0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một lượng khí lí tưởng biến đổi đẳng tích làm nhiệt độ tuyệt đối tăng $2$ lần. Áp suất của khí sẽ", "options": ["A. giảm $2$ lần.", "B. tăng $2$ lần.", "C. không thay đổi.", "D. tăng $4$ lần."], "answer": "B", "explain": "Đẳng tích: $p \\propto T$ nên $T$ tăng $2$ lần thì $p$ tăng $2$ lần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sóng cơ lan truyền với tốc độ $300$ m/s, tần số $100$ Hz. Bước sóng của sóng này là", "options": ["A. $30000$ m.", "B. $0,33$ m.", "C. $3$ m.", "D. $30$ m."], "answer": "C", "explain": "$\\lambda = v/f = 300/100 = 3$ m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Mạch dao động LC lí tưởng có độ tự cảm $L = 0,5$ H, cường độ dòng điện cực đại trong mạch $I_0 = 0,2$ A. Năng lượng điện từ của mạch là", "options": ["A. $0,01$ J.", "B. $0,02$ J.", "C. $0,005$ J.", "D. $0,05$ J."], "answer": "A", "explain": "$W = \\fr  không gây cảm ứng. d) Đúng: $N_2 \\gt N_1$ thì $U_2 \\gt U_1$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Chiếu một chùm sáng qua máy quang phổ lăng kính để phân tích.", "statements": ["a) Máy quang phổ dùng để phân tích chùm sáng phức tạp thành các thành phần đơn sắc.", "b) Quang phổ của ánh sáng do đèn dây tóc nóng sáng phát ra là quang phổ liên tục.", "c) Mỗi nguyên tố hóa học có một quang phổ vạch phát xạ đặc trưng riêng.", "d) Quang phổ vạch hấp thụ gồm các vạch màu sáng trên một nền tối."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quang phổ vạch hấp thụ là các vạch tối trên nền quang phổ liên tục.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Trong thí nghiệm giao thoa sóng trên mặt nước với hai nguồn kết hợp cùng pha, cùng biên độ.", "statements": ["a) Những điểm có hiệu đường đi bằng số nguyên lần bước sóng dao động với biên độ cực đại.", "b) Những điểm có hiệu đường đi bằng số bán nguyên lần bước sóng dao động với biên độ cực tiểu.", "c) Biên độ dao động tại điểm cực đại bằng tổng biên độ của hai sóng thành phần.", "d) Trung điểm của đoạn thẳng nối hai nguồn luôn là điểm dao động với biên độ cực tiểu."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng theo điều kiện cực đại, cực tiểu. c) Đúng: hai sóng cùng pha nên biên độ cộng. d) Sai: trung điểm có hiệu đường đi bằng $0$ nên là cực đại.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Xét các quá trình chuyển thể của các chất.", "statements": ["a) Nóng chảy là quá trình chất rắn chuyển thành chất lỏng.", "b) Đông đặc là quá trình chất lỏng chuyển thành chất rắn.", "c) Hóa hơi là quá trình chất lỏng chuyển thành hơi.", "d) Ngưng tụ là quá trình chất khí chuyển thẳng thành chất rắn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo định nghĩa. d) Sai: ngưng tụ là hơi chuyển thành chất lỏng.", "points": 1}, {"type": "short", "level": "TH", "q": "Trong thí nghiệm Young về giao thoa ánh sáng: khoảng cách hai khe $a = 2$ mm, khoảng cách từ hai khe đến màn $D = 1$ m, khoảng vân đo được $i = 0,3$ mm. Bước sóng của ánh sáng dùng trong thí nghiệm bằng bao nhiêu $\\mu$m?", "answer": "0,6", "explain": "$\\lambda = ia/D = 0,3 \\times 10^{-3} \\times 2 \\times 10^{-3}/1 = 0,6 \\times 10^{-6}$ m $= 0,6\\ \\mu$m.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Một hệ nhiệt động nhận công $100$ J từ bên ngoài và tỏa ra môi trường nhiệt lượng $40$ J. Độ biến thiên nội năng của hệ bằng bao nhiêu J?", "answer": "60", "explain": "Hệ nhận công nên $A = 100$ J; hệ tỏa nhiệt nên $Q = -40$ J; $\\Delta U = A + Q = 60$ J.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Vật dao động điều hòa với biên độ $10$ cm, tần số góc $5$ rad/s. Gia tốc cực đại của vật bằng bao nhiêu m/s$^2$?", "answer": "2,5", "explain": "$a_{\\max} = \\omega^2A = 25 \\times 0,1 = 2,5$ m/s$^2$.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Độ hụt khối của một hạt nhân là $0,01$ u. Năng lượng liên kết của hạt nhân đó bằng bao nhiêu MeV? (Cho $1$ u $= 931,5$ MeV/$c^2$)", "answer": "9,315", "explain": "$W_{lk} = 0,01 \\times 931,5 = 9,315$ MeV.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cường độ âm tại một điểm là $10^{-4}$ W/m$^2$. Biết cường độ âm chuẩn $I_0 = 10^{-12}$ W/m$^2$. Mức cường độ âm tại điểm đó bằng bao nhiêu dB?", "answer": "80", "explain": "$L = 10\\log(I/I_0) = 10\\log(10^8) = 80$ dB.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đoạn mạch điện xoay chiều RLC nối tiếp đang xảy ra cộng hưởng điện: điện áp hiệu dụng hai đầu mạch $U = 60$ V, điện trở $R = 20\\ \\Omega$. Cường độ dòng điện hiệu dụng trong mạch bằng bao nhiêu A?", "answer": "3", "explain": "Cộng hưởng: $Z_{\\min} = R$, suy ra $I_{\\max} = U/R = 60/20 = 3$ A.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Ứng dụng nào sau đây là ứng dụng của tia X?", "options": ["A. Sấy khô và sưởi ấm nông sản.", "B. Diệt khuẩn trong y tế.", "C. Chụp X-quang kiểm tra hành lí, chẩn đoán hình ảnh gãy xương.", "D. Kích thích sự phát quang của màn hình."], "answer": "C", "explain": "Tia X có khả năng đâm xuyên mạnh nên dùng để chụp X-quang, kiểm tra hành lí, phát hiện khuyết tật vật liệu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo mẫu nguyên tử Bohr, các electron chuyển động quanh hạt nhân", "options": ["A. trên các quỹ đạo dừng có bán kính hoàn toàn xác định.", "B. trên các quỹ đạo có bán kính bất kì.", "C. theo đường thẳng hướng vào hạt nhân.", "D. theo quỹ đạo xoắn ốc dần vào hạt nhân."], "answer": "A", "explain": "Tiên đề Bohr: electron chỉ chuyển động trên các quỹ đạo dừng có bán kính $r_n = n^2r_0$ mà không bức xạ năng lượng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phản ứng phân hạch là phản ứng hạt nhân trong đó", "options": ["A. hai hạt nhân nhẹ kết hợp thành một hạt nhân nặng hơn.", "B. một hạt nhân tự phân rã thành hạt nhân khác.", "C. hạt nhân hấp thụ một photon năng lượng cao.", "D. một hạt nhân nặng vỡ thành hai hạt nhân có số khối trung bình, kèm theo vài neutron và tỏa nhiều năng lượng."], "answer": "D", "explain": "Phân hạch: hạt nhân nặng (như $^{235}U$) vỡ thành hai mảnh trung bình + neutron + năng lượng lớn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Động năng trung bình của một phân tử khí lí tưởng tỉ lệ thuận với", "options": ["A. áp suất của khối khí.", "B. nhiệt độ tuyệt đối của khối khí.", "C. thể tích của khối khí.", "D. khối lượng mol của chất khí."], "answer": "B", "explain": "Thuyết động học phân tử: động năng tịnh tiến trung bình của một phân tử $\\bar{W}_đ = \\frac{3}{2}kT \\propto T$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đơn vị của cảm ứng từ trong hệ SI là", "options": ["A. V/m.", "B. Wb.", "C. tesla (T).", "D. A/m."], "answer": "C", "explain": "Cảm ứng từ $B$ có đơn vị tesla (T); từ thông $\\Phi$ có đơn vị vêbe (Wb).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Con lắc đơn dao động điều hòa với góc lệch nhỏ có chu kì được tính bởi", "options": ["A. $T = 2\\pi\\sqrt{l/g}$.", "B. $T = 2\\pi\\sqrt{g/l}$.", "C. $T = 2\\pi\\sqrt{m/k}$.", "D. $T = 2\\pi\\sqrt{k/m}$."], "answer": "A", "explain": "Con lắc đơn: $T = 2\\pi\\sqrt{l/g}$ ($l$ là chiều dài dây, $g$ là gia tốc trọng trường).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Độ to của âm phụ thuộc vào", "options": ["A. tần số của âm.", "B. bước sóng của âm.", "C. tốc độ truyền âm.", "D. biên độ (mức cường độ) của âm."], "answer": "D", "explain": "Độ to gắn với biên độ/mức cường độ âm; độ cao gắn với tần số; âm sắc gắn với đồ thị dao động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Điện áp hiệu dụng giữa hai đầu một đoạn mạch điện xoay chiều được đo bằng", "options": ["A. ampe kế xoay chiều.", "B. vôn kế xoay chiều.", "C. oát kế.", "D. tần số kế."], "answer": "B", "explain": "Vôn kế xoay chiều (mắc song song) đo điện áp hiệu dụng; ampe kế (mắc nối tiếp) đo cường độ hiệu dụng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong thí nghiệm Young về giao thoa ánh sáng, khoảng vân đo được là $i = 1$ mm. Vị trí vân tối thứ hai (ứng với $k = 1$) cách vân sáng trung tâm", "options": ["A. $1$ mm.", "B. $2$ mm.", "C. $1,5$ mm.", "D. $2,5$ mm."], "answer": "C", "explain": "$x_t = (k + 0,5)i$; vân tối thứ hai ($k = 1$): $x = 1,5 \\times 1 = 1,5$ mm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo mẫu Bohr, bán kính quỹ đạo dừng của electron trong nguyên tử hydro là $r_n = n^2r_0$ với $r_0 = 5,3 \\times 10^{-11}$ m. Bán kính quỹ đạo dừng thứ hai là", "options": ["A. $2,12 \times 10^{-10}$ m.", "B. $1,06 \times 10^{-10}$ m.", "C. $4,77 \times 10^{-10}$ m.", "D. $5,3 \times 10^{-11}$ m."], "answer": "A", "explain": "$r_2 = 2^2 \\times r_0 = 4 \\times 5,3 \\times 10^{-11} = 2,12 \\times 10^{-10}$ m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho phản ứng hạt nhân: $^{235}_{92}U + ^{1}_{0}n \\\\to ^{94}_{38}Sr + ^{140}_{54}Xe + x\\,^{1}_{0}n$. Giá trị của $x$ là", "options": ["A. $1$.", "B. $3$.", "C. $4$.", "D. $2$."], "answer": "D", "explain": "Bảo toàn số khối: $235 + 1 = 94 + 140 + x$, suy ra $x = 2$ (bảo toàn điện tích cũng thỏa: $92 = 38 + 54$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nội năng của một lượng khí lí tưởng phụ thuộc vào", "options": ["A. áp suất và thể tích của khí.", "B. nhiệt độ của khối khí.", "C. khối lượng mol của chất khí.", "D. bản chất hóa học của chất khí."], "answer": "B", "explain": "Nội năng của khí lí tưởng chỉ phụ thuộc vào nhiệt độ: $U = \\frac{i}{2}nRT$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một ống dây dài có $1000$ vòng dây trên mỗi mét chiều dài, dòng điện chạy qua ống dây là $2$ A. Cảm ứng từ trong lòng ống dây có độ lớn", "options": ["A. $8\\pi \times 10^{-4}$ T.", "B. $4\\pi \times 10^{-7}$ T.", "C. xấp xỉ $2,5 \times 10^{-3}$ T.", "D. $2,5 \times 10^{-7}$ T."], "answer": "C", "explain": "$B = 4\\pi \\times 10^{-7}nI = 4\\pi \\times 10^{-7} \\times 1000 \\times 2 = 8\\pi \\times 10^{-4} \\approx 2,51 \\times 10^{-3}$ T.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sợi dây dài $1,2$ m, hai đầu cố định, đang có sóng dừng. Bước sóng lan truyền trên dây là $0,4$ m. Số bụng sóng trên dây là", "options": ["A. $6$.", "B. $3$.", "C. $5$.", "D. $12$."], "answer": "A", "explain": "Hai đầu cố định: $l = k\\lambda/2$, suy ra $k = 2l/\\lambda = 2 \\times 1,2/0,4 = 6$ bụng sóng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong thí nghiệm Young về giao thoa ánh sáng: khoảng cách hai khe $a = 1$ mm, khoảng cách từ hai khe đến màn $D = 2$ m, bước sóng $\\lambda = 0,6\\ \\mu$m. Trên màn quan sát rộng $12$ mm đối xứng qua vân trung tâm, số vân sáng quan sát được là", "options": ["A. $9$.", "B. $21$.", "C. $10$.", "D. $11$."], "answer": "D", "explain": "$i = \\lambda D/a = 1,2$ mm; $|x| \\le 6$ mm nên $|k| \\le 6/1,2 = 5$; $k = -5, \\dots, 5$: có $11$ vân sáng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Các electron quang điện có động năng ban đầu cực đại là $2$ eV. Biết $1$ eV $= 1,6 \\times 10^{-19}$ J, khối lượng electron $m_e = 9,1 \\times 10^{-31}$ kg. Tốc độ ban đầu cực đại của electron là", "options": ["A. $5,93 \times 10^5$ m/s.", "B. xấp xỉ $8,4 \times 10^5$ m/s.", "C. $1,68 \times 10^6$ m/s.", "D. $4,2 \times 10^5$ m/s."], "answer": "B", "explain": "$v_{\\max} = \\sqrt{2W_{đ\\max}/m_e} = \\sqrt{2 \\times 3,2 \\times 10^{-19}/(9,1 \\times 10^{-31})} = \\sqrt{7,03 \\times 10^{11}} \\approx 8,38 \\times 10^5$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Con lắc đơn có chiều dài $2,5$ m, dao động nhỏ tại nơi có gia tốc trọng trường $g = 10$ m/s$^2$. Chu kì dao động của con lắc là", "options": ["A. $2$ s.", "B. $5$ s.", "C. $\\pi$ s (xấp xỉ $3,14$ s).", "D. $2\\pi$ s."], "answer": "C", "explain": "$T = 2\\pi\\sqrt{l/g} = 2\\pi\\sqrt{2,5/10} = 2\\pi \\times 0,5 = \\pi$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đoạn mạch điện xoay chiều RLC nối tiếp có $R = 30\\ \\Omega$, $Z_C = 40\\ \\Omega$, điện áp hiệu dụng hai đầu mạch $U = 100$ V, cường độ dòng điện hiệu dụng $I = 2$ A. Điện áp hiệu dụng giữa hai đầu điện trở thuần là", "options": ["A. $60$ V.", "B. $80$ V.", "C. $100$ V.", "D. $50$ V."], "answer": "A", "explain": "$U_R = IR = 2 \\times 30 = 60$ V (điện áp trên $R$ luôn cùng pha với dòng điện).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét điện từ trường và sóng điện từ.", "statements": ["a) Điện trường biến thiên theo thời gian sinh ra từ trường biến thiên.", "b) Sóng điện từ là sóng ngang.", "c) Sóng điện từ truyền được trong chân không.", "d) Tốc độ truyền sóng điện từ trong chân không nhỏ hơn tốc độ ánh sáng trong chân không."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: đó là luận điểm của Maxwell. b) Đúng: $\\vec{E}$, $\\vec{B}$ vuông góc phương truyền. c) Đúng. d) Sai: sóng điện từ trong chân không chính là ánh sáng, tốc độ bằng $c$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Chiếu ánh sáng có bước sóng $\\lambda$ vào một kim loại có giới hạn quang điện $\\lambda_0$ và gây ra được hiện tượng quang điện.", "statements": ["a) Điều kiện để xảy ra hiện tượng quang điện là $\\lambda \\le \\lambda_0$.", "b) Động năng ban đầu cực đại của electron quang điện không phụ thuộc vào cường độ của chùm sáng kích thích.", "c) Tăng cường độ của chùm sáng kích thích làm tăng số electron bật ra khỏi kim loại trong một giây.", "d) Tăng bước sóng của ánh sáng kích thích (vẫn nhỏ hơn $\\lambda_0$) làm tăng động năng ban đầu cực đại của electron."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: $W_{đ\\max} = hc/\\lambda - A$ chỉ phụ thuộc $\\lambda$. c) Đúng: cường độ tỉ lệ với số photon. d) Sai: $\\lambda$ tăng thì $W_{đ\\max}$ giảm.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét hạt nhân $^{12}_{6}C$ và các phản ứng hạt nhân tỏa năng lượng.", "statements": ["a) Hạt nhân $^{12}_{6}C$ có $6$ proton và $6$ neutron.", "b) Năng lượng liên kết riêng càng lớn thì hạt nhân càng bền vững.", "c) Phản ứng nhiệt hạch là phản ứng kết hợp hai hạt nhân nhẹ thành một hạt nhân nặng hơn và tỏa năng lượng.", "d) Phản ứng phân hạch chỉ có thể xảy ra với các hạt nhân nhẹ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $Z = 6$, $N = 12 - 6 = 6$. b) Đúng. c) Đúng. d) Sai: phân hạch xảy ra với các hạt nhân nặng (như $^{235}U$).", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Xét dao động của con lắc lò xo nằm ngang (bỏ qua mọi ma sát).", "statements": ["a) Chu kì dao động của con lắc là $T = 2\\pi\\sqrt{m/k}$.", "b) Tần số góc của dao động không phụ thuộc vào biên độ dao động.", "c) Cơ năng của con lắc tỉ lệ với bình phương của biên độ dao động.", "d) Tại vị trí biên, động năng của vật nặng đạt cực đại."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tại vị trí biên vận tốc bằng $0$ nên động năng cực tiểu, thế năng cực đại.", "points": 1}, {"type": "short", "level": "TH", "q": "Photon ứng với bức xạ có bước sóng $0,55\\ \\mu$m có năng lượng bằng bao nhiêu eV? (Cho $hc = 1240$ eV.nm; làm tròn đến 2 chữ số thập phân)", "answer": "2,25", "explain": "$\\varepsilon = hc/\\lambda = 1240/550 = 2,2545$ eV $\\approx 2,25$ eV.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Sóng âm truyền trong không khí với tốc độ $340$ m/s có bước sóng $1,7$ m. Tần số của sóng âm này bằng bao nhiêu Hz?", "answer": "200", "explain": "$f = v/\\lambda = 340/1,7 = 200$ Hz.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Đoạn mạch điện xoay chiều RLC nối tiếp có $R = 20\\ \\Omega$, $Z_L = 30\\ \\Omega$, $Z_C = 10\\ \\Omega$. Tổng trở của đoạn mạch bằng bao nhiêu $\\Omega$? (làm tròn đến 2 chữ số thập phân)", "answer": "28,28", "explain": "$Z = \\sqrt{R^2 + (Z_L - Z_C)^2} = \\sqrt{20^2 + 20^2} = 20\\sqrt{2} \\approx 28,28\\ \\Omega$.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Cung cấp nhiệt lượng $84000$ J để làm tăng nhiệt độ của một khối nước thêm $20^\\circ$C. Biết nhiệt dung riêng của nước là $4200$ J/(kg.K). Khối lượng của khối nước bằng bao nhiêu kg?", "answer": "1", "explain": "$Q = mc\\Delta t$, suy ra $m = Q/(c\\Delta t) = 84000/(4200 \\times 20) = 1$ kg.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vật dao động điều hòa với biên độ $10$ cm, tần số góc $\\pi$ rad/s. Độ lớn vận tốc của vật khi vật có li độ $6$ cm bằng bao nhiêu cm/s? (làm tròn đến 1 chữ số thập phân)", "answer": "25,1", "explain": "$|v| = \\omega\\sqrt{A^2 - x^2} = \\pi\\sqrt{100 - 36} = 8\\pi \\approx 25,13$ cm/s $\\approx 25,1$ cm/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đoạn dây dẫn dài $0,6$ m mang dòng điện $5$ A đặt trong từ trường đều có cảm ứng từ $0,4$ T; dây dẫn hợp với vectơ cảm ứng từ một góc $30^\\circ$. Lực từ tác dụng lên đoạn dây bằng bao nhiêu N?", "answer": "0,6", "explain": "$F = BIl\\sin\\alpha = 0,4 \\times 5 \\times 0,6 \\times \\sin30^\\circ = 0,6$ N.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Tia laze có đặc điểm nổi bật là", "options": ["A. tính đơn sắc cao, tính định hướng cao, cường độ chùm sáng lớn.", "B. có bước sóng lớn hơn tia hồng ngoại.", "C. có khả năng đâm xuyên mạnh hơn tia X.", "D. là dòng các hạt mang điện."], "answer": "A", "explain": "Laze: ánh sáng kết hợp có tính đơn sắc rất cao, định hướng cao (song song), cường độ lớn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phản ứng nhiệt hạch là phản ứng hạt nhân trong đó", "options": ["A. một hạt nhân nặng vỡ thành hai hạt nhân trung bình.", "B. một hạt nhân tự phân rã thành hạt nhân khác.", "C. hạt nhân hấp thụ một neutron rồi vỡ ra.", "D. hai hạt nhân nhẹ kết hợp thành một hạt nhân nặng hơn và tỏa nhiều năng lượng."], "answer": "D", "explain": "Nhiệt hạch: tổng hợp hạt nhân nhẹ (như phản ứng trong lòng Mặt Trời) thành hạt nhân nặng hơn + năng lượng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo nguyên lí II của nhiệt động lực học,", "options": ["A. nhiệt có thể tự truyền từ vật lạnh sang vật nóng mà không cần tác động bên ngoài.", "B. nhiệt không thể tự truyền từ một vật sang vật nóng hơn nếu không có tác động từ bên ngoài.", "C. nội năng của hệ luôn được bảo toàn trong mọi quá trình.", "D. công có thể biến hoàn toàn thành nhiệt, còn nhiệt không thể biến thành công."], "answer": "B", "explain": "Nguyên lí II (Clausius): nhiệt không tự truyền từ vật lạnh sang vật nóng hơn; động cơ nhiệt không thể biến hoàn toàn nhiệt thành công.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vòng dây tròn bán kính $R$ có dòng điện cường độ $I$ chạy qua. Cảm ứng từ tại tâm của vòng dây có độ lớn", "options": ["A. $B = 2 \times 10^{-7}I/R$.", "B. $B = 4\\pi \times 10^{-7}I/R$.", "C. $B = 2\\pi \times 10^{-7}I/R$.", "D. $B = 2\\pi \times 10^{-7}IR$."], "answer": "C", "explain": "$B = 2\\pi \\times 10^{-7}I/R$ tại tâm vòng dây (với $N$ vòng: nhân thêm $N$).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một vật dao động điều hòa. Vận tốc của vật", "options": ["A. biến thiên điều hòa cùng tần số với li độ và sớm pha $\\pi/2$ so với li độ.", "B. luôn cùng pha với li độ.", "C. luôn ngược pha với li độ.", "D. không đổi theo thời gian."], "answer": "A", "explain": "$v = -\\omega A\\sin(\\omega t + \\varphi)$: biến thiên điều hòa cùng tần số với $x$, sớm pha $\\pi/2$ so với $x$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sóng âm là", "options": ["A. sóng điện từ lan truyền trong không khí.", "B. sóng ngang chỉ truyền được trong chất rắn.", "C. sóng dừng trên các sợi dây đàn hồi.", "D. sóng cơ lan truyền trong các môi trường rắn, lỏng, khí."], "answer": "D", "explain": "Sóng âm là sóng cơ (cần môi trường vật chất); trong chất khí và lỏng là sóng dọc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dòng điện xoay chiều là dòng điện", "options": ["A. có chiều không đổi theo thời gian.", "B. có chiều và cường độ biến thiên điều hòa theo thời gian.", "C. có cường độ không đổi theo thời gian.", "D. chỉ đổi chiều mà cường độ không thay đổi."], "answer": "B", "explain": "Dòng điện xoay chiều: $i = I_0\\cos(\\omega t + \\varphi)$, chiều và cường độ biến thiên điều hòa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mạch dao động LC lí tưởng gồm", "options": ["A. một điện trở thuần và một tụ điện.", "B. một cuộn cảm và một nguồn điện một chiều.", "C. một cuộn cảm và một tụ điện.", "D. hai tụ điện mắc nối tiếp."], "answer": "C", "explain": "Mạch LC gồm cuộn cảm $L$ và tụ điện $C$ mắc thành mạch kín; lí tưởng là bỏ qua điện trở.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo mẫu Bohr, năng lượng của electron trên quỹ đạo dừng thứ $n$ của nguyên tử hydro là $E_n = -13,6/n^2$ (eV). Năng lượng của electron trên quỹ đạo dừng thứ ba là", "options": ["A. $-1,51$ eV.", "B. $-3,4$ eV.", "C. $-13,6$ eV.", "D. $-0,85$ eV."], "answer": "A", "explain": "$E_3 = -13,6/3^2 = -13,6/9 \\approx -1,51$ eV.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tia $\\beta^-$ là dòng", "options": ["A. các proton.", "B. các neutron.", "C. các positron.", "D. các electron."], "answer": "D", "explain": "Tia $\\beta^-$ là dòng electron ($^{0}_{-1}e$) phát ra khi neutron trong hạt nhân biến thành proton.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhiệt hóa hơi riêng của nước là $2,3 \\times 10^6$ J/kg. Nhiệt lượng cần cung cấp để làm hóa hơi hoàn toàn $0,2$ kg nước đang ở $100^\\circ$C là", "options": ["A. $1,15 \times 10^6$ J.", "B. $4,6 \times 10^5$ J.", "C. $2,3 \times 10^6$ J.", "D. $9,2 \times 10^5$ J."], "answer": "B", "explain": "$Q = Lm = 2,3 \\times 10^6 \\times 0,2 = 4,6 \\times 10^5$ J.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ thông qua một khung dây dẫn kín đạt cực đại khi", "options": ["A. mặt phẳng khung song song với các đường sức từ.", "B. mặt phẳng khung hợp với đường sức từ một góc $45^\\circ$.", "C. mặt phẳng khung vuông góc với các đường sức từ.", "D. khung dây chuyển động tịnh tiến trong từ trường đều."], "answer": "C", "explain": "$\\Phi = NBS\\cos\\alpha$ cực đại khi $\\cos\\alpha = 1$, tức vectơ pháp tuyến cùng hướng $\\vec{B}$: mặt khung vuông góc đường sức.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đồ thị li độ theo thời gian của một vật dao động điều hòa cho thấy biên độ $4$ cm và chu kì $0,5$ s. Tần số góc của dao động là", "options": ["A. $4\\pi$ rad/s.", "B. $2\\pi$ rad/s.", "C. $\\pi$ rad/s.", "D. $0,5\\pi$ rad/s."], "answer": "A", "explain": "$\\omega = 2\\pi/T = 2\\pi/0,5 = 4\\pi$ rad/s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sợi dây dài $50$ cm, hai đầu cố định, đang có sóng dừng với bước sóng $25$ cm. Số nút sóng trên dây là", "options": ["A. $4$.", "B. $6$.", "C. $3$.", "D. $5$."], "answer": "D", "explain": "$l = k\\lambda/2$, suy ra $k = 2l/\\lambda = 4$ bó sóng; số nút $= k + 1 = 5$ (kể cả hai đầu).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Electron trong nguyên tử hydro chuyển từ quỹ đạo dừng $n = 3$ về quỹ đạo dừng $n = 2$ và phát ra một photon. Bước sóng của photon này là bao nhiêu? (Cho $hc = 1240$ eV.nm)", "options": ["A. $121,6$ nm.", "B. $656$ nm.", "C. $102,6$ nm.", "D. $1875$ nm."], "answer": "B", "explain": "$\\Delta E = 13,6(1/2^2 - 1/3^2) = 13,6 \\times 5/36 \\approx 1,89$ eV; $\\lambda = hc/\\Delta E = 1240/1,89 \\approx 656$ nm (vạch đỏ $H_\\alpha$).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ban đầu có $16$ g một chất phóng xạ có chu kì bán rã $4$ ngày. Sau $12$ ngày, khối lượng chất phóng xạ còn lại là", "options": ["A. $8$ g.", "B. $4$ g.", "C. $2$ g.", "D. $1$ g."], "answer": "C", "explain": "$m = m_0 \\times 2^{-t/T} = 16 \\times 2^{-3} = 2$ g.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vật dao động điều hòa với biên độ $5$ cm, chu kì $1$ s. Tốc độ trung bình của vật trong một chu kì dao động là", "options": ["A. $20$ cm/s.", "B. $10$ cm/s.", "C. $5$ cm/s.", "D. $40$ cm/s."], "answer": "A", "explain": "Trong một chu kì vật đi quãng đường $s = 4A = 20$ cm; $v_{tb} = s/T = 20$ cm/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong thí nghiệm giao thoa sóng trên mặt nước, hai nguồn kết hợp cùng pha đặt cách nhau $12$ cm, sóng có bước sóng $3$ cm. Số điểm dao động với biên độ cực đại trên đoạn thẳng nối hai nguồn là", "options": ["A. $9$ điểm.", "B. $5$ điểm.", "C. $8$ điểm.", "D. $7$ điểm."], "answer": "D", "explain": "Cực đại: $|d_2 - d_1| = k\\lambda \\lt 12$ cm, suy ra $|k| \\lt 4$; $k = -3, \\dots, 3$: có $7$ điểm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét ánh sáng và các hiện tượng liên quan đến ánh sáng.", "statements": ["a) Ánh sáng trắng là hỗn hợp của nhiều ánh sáng đơn sắc có màu khác nhau.", "b) Mỗi ánh sáng đơn sắc có một bước sóng xác định trong chân không.", "c) Hiện tượng giao thoa ánh sáng chứng tỏ ánh sáng có tính chất sóng.", "d) Hiện tượng quang điện chứng tỏ ánh sáng có tính chất sóng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: hiện tượng quang điện chứng tỏ ánh sáng có tính chất hạt (photon).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một chất phóng xạ có chu kì bán rã $T = 8$ ngày, khối lượng ban đầu $m_0 = 24$ g.", "statements": ["a) Sau $8$ ngày, khối lượng chất phóng xạ còn lại là $12$ g.", "b) Sau $16$ ngày, khối lượng chất phóng xạ còn lại là $6$ g.", "c) Sau $24$ ngày, khối lượng chất phóng xạ còn lại là $3$ g.", "d) Hằng số phóng xạ của chất này là $\\lambda = T/\\ln2$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: còn $1/2$. b) Đúng: còn $1/4$. c) Đúng: còn $1/8$. d) Sai: $\\lambda = \\ln2/T$.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Một khối khí lí tưởng thực hiện chu trình gồm hai quá trình đẳng tích và hai quá trình đẳng áp (đồ thị $p$-$V$ là hình chữ nhật): $p_1 = 10^5$ Pa, $p_2 = 3 \\times 10^5$ Pa, $V_1 = 1$ L, $V_2 = 4$ L.", "statements": ["a) Công mà khối khí sinh ra trong cả chu trình bằng $600$ J.", "b) Trong quá trình đẳng áp giãn nở, khối khí nhận nhiệt lượng từ bên ngoài.", "c) Trong quá trình đẳng tích làm lạnh, nội năng của khối khí tăng lên.", "d) Chu trình này biến một phần nhiệt lượng thành công (nguyên tắc động cơ nhiệt)."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $|A| =$ diện tích hình chữ nhật $= (3-1) \\times 10^5 \\times 3 \\times 10^{-3} = 600$ J. b) Đúng: $T$ tăng nên $Q \\gt 0$. c) Sai: làm lạnh đẳng tích thì $T$ giảm, $\\Delta U \\lt 0$. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Xét sóng cơ và sóng âm.", "statements": ["a) Sóng cơ không truyền được trong chân không.", "b) Sóng âm truyền trong chất khí là sóng dọc.", "c) Tần số của sóng bằng tần số dao động của nguồn sóng.", "d) Khi sóng truyền từ môi trường này sang môi trường khác thì tần số của sóng thay đổi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tần số sóng không đổi khi đổi môi trường (bước sóng và tốc độ thay đổi).", "points": 1}, {"type": "short", "level": "TH", "q": "Ban đầu có $12 \\times 10^{20}$ hạt nhân của một chất phóng xạ. Sau thời gian bằng $2$ chu kì bán rã, số hạt nhân còn lại chưa bị phân rã bằng bao nhiêu? (viết đáp án dưới dạng $a$eb, ví dụ $3 \\times 10^{20}$ viết là 3e20)", "answer": "3e20", "explain": "$N = N_0 \\times 2^{-2} = 12 \\times 10^{20}/4 = 3 \\times 10^{20}$ hạt nhân.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Đoạn mạch điện xoay chiều có điện áp hiệu dụng $U = 200$ V, cường độ dòng điện hiệu dụng $I = 3$ A, hệ số công suất $\\cos\\varphi = 0,8$. Công suất tiêu thụ của mạch bằng bao nhiêu W?", "answer": "480", "explain": "$P = UI\\cos\\varphi = 200 \\times 3 \\times 0,8 = 480$ W.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Mạch dao động LC lí tưởng có điện dung $C = 50\\ \\mu$F, năng lượng điện từ của mạch là $0,01$ J. Điện tích cực đại trên một bản tụ bằng bao nhiêu C?", "answer": "0,001", "explain": "$W = q_0^2/(2C)$, suy ra $q_0 = \\sqrt{2WC} = \\sqrt{2 \\times 0,01 \\times 50 \\times 10^{-6}} = 10^{-3}$ C.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Con lắc lò xo dao động điều hòa với chu kì $0,628$ s; vật nặng có khối lượng $0,5$ kg. Độ cứng của lò xo bằng bao nhiêu N/m? (lấy $\\pi = 3,14$)", "answer": "50", "explain": "$T = 2\\pi\\sqrt{m/k}$, suy ra $k = m(2\\pi/T)^2 = 0,5 \\times (6,28/0,628)^2 = 0,5 \\times 100 = 50$ N/m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trộn $2$ kg nước ở $90^\\circ$C với $3$ kg nước ở $10^\\circ$C trong một bình cách nhiệt lí tưởng. Nhiệt độ của nước khi có cân bằng nhiệt bằng bao nhiêu $^\\circ$C?", "answer": "42", "explain": "Phương trình cân bằng nhiệt: $2 \\times (90 - t) = 3 \\times (t - 10)$, suy ra $t = 42^\\circ$C.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong thí nghiệm Young về giao thoa ánh sáng, khoảng vân đo được là $i = 1,5$ mm. Tại vị trí cách vân sáng trung tâm $4,5$ mm, ta quan sát được vân sáng bậc mấy?", "answer": "3", "explain": "$k = x/i = 4,5/1,5 = 3$: vân sáng bậc $3$.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Đơn vị khối lượng nguyên tử u được định nghĩa bằng", "options": ["A. khối lượng của một proton.", "B. khối lượng của một neutron.", "C. khối lượng của nguyên tử hydro.", "D. $1/12$ khối lượng của nguyên tử đồng vị $^{12}C$."], "answer": "D", "explain": "$1$ u $= 1,6605 \\times 10^{-27}$ kg $= 931,5$ MeV/$c^2$, bằng $1/12$ khối lượng nguyên tử $^{12}C$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thang nhiệt độ tuyệt đối (kelvin) có đặc điểm", "options": ["A. $0$ K là nhiệt độ thấp nhất có thể đạt được về mặt lí thuyết.", "B. $0$ K ứng với nhiệt độ của nước đá đang tan.", "C. nhiệt độ $0^\\circ$C nhỏ hơn nhiệt độ $0$ K.", "D. độ chia $1$ K lớn gấp $273$ lần độ chia $1^\\circ$C."], "answer": "A", "explain": "Không độ tuyệt đối $0$ K $= -273^\\circ$C là giới hạn thấp nhất của nhiệt độ; độ chia $1$ K bằng $1^\\circ$C.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đường sức từ là", "options": ["A. những đường thẳng song song với nhau.", "B. những đường cong hở xuất phát từ cực Bắc.", "C. những đường cong được vẽ trong từ trường sao cho tiếp tuyến tại mỗi điểm trùng với hướng của vectơ cảm ứng từ tại điểm đó.", "D. những đường sức điện của các điện tích."], "answer": "C", "explain": "Định nghĩa đường sức từ; đường sức từ là những đường cong kín (ngoài nam châm đi từ cực Bắc đến cực Nam).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tần số dao động của một vật dao động điều hòa", "options": ["A. là số dao động toàn phần vật thực hiện được trong một chu kì.", "B. là số dao động toàn phần mà vật thực hiện được trong một giây.", "C. bằng thời gian để vật thực hiện một dao động toàn phần.", "D. tỉ lệ thuận với chu kì dao động."], "answer": "B", "explain": "Tần số $f$ (Hz) là số dao động toàn phần trong một giây; $f = 1/T$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sóng cơ lan truyền được trong", "options": ["A. chân không.", "B. chất rắn và chất lỏng.", "C. chỉ trong chất rắn.", "D. môi trường vật chất (rắn, lỏng, khí) và không truyền được trong chân không."], "answer": "D", "explain": "Sóng cơ cần môi trường vật chất đàn hồi để lan truyền; không truyền được trong chân không.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong đoạn mạch điện xoay chiều chỉ có điện trở thuần, điện áp và cường độ dòng điện", "options": ["A. cùng pha với nhau.", "B. vuông pha với nhau.", "C. ngược pha với nhau.", "D. lệch pha nhau $\\pi/4$."], "answer": "A", "explain": "Mạch chỉ có $R$: $u$ và $i$ cùng pha ($\\varphi = 0$), $I = U/R$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sóng điện từ có tần số càng lớn thì", "options": ["A. bước sóng trong chân không càng lớn.", "B. năng lượng của photon tương ứng càng nhỏ.", "C. bước sóng trong chân không càng nhỏ.", "D. tốc độ truyền trong chân không càng lớn."], "answer": "C", "explain": "$\\lambda = c/f$: $f$ càng lớn thì $\\lambda$ càng nhỏ; tốc độ truyền trong chân không luôn bằng $c$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiện tượng giao thoa ánh sáng chứng tỏ", "options": ["A. ánh sáng có tính chất hạt.", "B. ánh sáng có tính chất sóng.", "C. ánh sáng luôn truyền theo đường thẳng.", "D. ánh sáng mang năng lượng tỉ lệ với tần số."], "answer": "B", "explain": "Giao thoa là hiện tượng đặc trưng của sóng; hiện tượng quang điện chứng tỏ tính chất hạt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hạt nhân $^{4}_{2}He$ có năng lượng liên kết là $28,3$ MeV. Năng lượng liên kết riêng của hạt nhân này là", "options": ["A. $7,075$ MeV.", "B. $113,2$ MeV.", "C. $28,3$ MeV.", "D. $7,075$ MeV/nuclon."], "answer": "D", "explain": "$W_{lkr} = W_{lk}/A = 28,3/4 = 7,075$ MeV/nuclon.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một thanh kim loại dài $2$ m ở $20^\\circ$C. Biết hệ số nở dài của kim loại là $\\alpha = 1,2 \\times 10^{-5}$ K$^{-1}$. Khi nhiệt độ của thanh tăng lên $70^\\circ$C, độ tăng chiều dài của thanh là", "options": ["A. $1,2 \times 10^{-3}$ m.", "B. $2,4 \times 10^{-3}$ m.", "C. $1,2 \times 10^{-4}$ m.", "D. $6 \times 10^{-4}$ m."], "answer": "A", "explain": "$\\Delta l = \\alpha l_0\\Delta t = 1,2 \\times 10^{-5} \\times 2 \\times 50 = 1,2 \\times 10^{-3}$ m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dùng quy tắc bàn tay trái để xác định chiều của lực từ: đặt bàn tay trái sao cho các đường sức từ hướng vào lòng bàn tay, chiều từ cổ tay đến ngón tay giữa chỉ chiều dòng điện thì", "options": ["A. ngón cái chỉ chiều của đường sức từ.", "B. ngón trỏ chỉ chiều của lực từ.", "C. ngón cái choãi ra $90^\\circ$ chỉ chiều của lực từ.", "D. ngón út chỉ chiều của dòng điện."], "answer": "C", "explain": "Quy tắc bàn tay trái: ngón cái choãi ra $90^\\circ$ chỉ chiều của lực từ $\\vec{F}$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vật dao động điều hòa theo phương trình $x = 5\\cos(\\pi t + \\pi/6)$ (cm). Tại thời điểm $t = 1$ s, li độ của vật là", "options": ["A. $2,5$ cm.", "B. $-5\\sqrt{3}/2$ cm (xấp xỉ $-4,33$ cm).", "C. $5$ cm.", "D. $0$ cm."], "answer": "B", "explain": "Pha tại $t = 1$ s là $\\pi + \\pi/6 = 7\\pi/6$; $x = 5\\cos(7\\pi/6) = 5 \\times (-\\sqrt{3}/2) = -5\\sqrt{3}/2$ cm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên phương truyền sóng, khoảng cách giữa hai điểm gần nhau nhất dao động ngược pha nhau là", "options": ["A. một bước sóng.", "B. một phần tư bước sóng.", "C. ba phần tư bước sóng.", "D. nửa bước sóng."], "answer": "D", "explain": "Độ lệch pha $\\Delta\\varphi = 2\\pi d/\\lambda = \\pi$ khi $d = \\lambda/2$: hai điểm gần nhất ngược pha cách nhau nửa bước sóng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đặt điện áp $u = 200\\sqrt{2}\\cos(100\\pi t)$ (V) vào hai đầu điện trở thuần $R = 50\\ \\Omega$. Biểu thức cường độ dòng điện qua điện trở là", "options": ["A. $i = 4\\sqrt{2}\\cos(100\\pi t)$ (A).", "B. $i = 4\\cos(100\\pi t + \\pi/2)$ (A).", "C. $i = 2\\sqrt{2}\\cos(100\\pi t)$ (A).", "D. $i = 4\\sqrt{2}\\cos(100\\pi t + \\pi/2)$ (A)."], "answer": "A", "explain": "$I = U/R = 200/50 = 4$ A; mạch chỉ có $R$ nên $i$ cùng pha với $u$: $i = 4\\sqrt{2}\\cos(100\\pi t)$ (A).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một chất phóng xạ có chu kì bán rã $T$. Sau $24$ ngày, khối lượng chất phóng xạ còn lại bằng $1/8$ khối lượng ban đầu. Chu kì bán rã của chất này là", "options": ["A. $6$ ngày.", "B. $12$ ngày.", "C. $8$ ngày.", "D. $3$ ngày."], "answer": "C", "explain": "$2^{-t/T} = 1/8 = 2^{-3}$, suy ra $t = 3T$; $T = 24/3 = 8$ ngày.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một lượng khí lí tưởng biến đổi đẳng tích: lúc đầu áp suất $3$ atm, nhiệt độ $300$ K. Khi nhiệt độ tăng lên $360$ K thì áp suất của khí là", "options": ["A. $2,5$ atm.", "B. $3,6$ atm.", "C. $3$ atm.", "D. $4$ atm."], "answer": "B", "explain": "Đẳng tích: $p_1/T_1 = p_2/T_2$, suy ra $p_2 = 3 \\times 360/300 = 3,6$ atm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vật dao động điều hòa với biên độ $8$ cm. Vị trí mà tại đó động năng của vật bằng thế năng là", "options": ["A. $x = \\pm 4$ cm.", "B. $x = \\pm 2\\sqrt{2}$ cm.", "C. $x = 0$.", "D. $x = \\pm 4\\sqrt{2}$ cm."], "answer": "D", "explain": "$W_đ = W_t = W/2$, suy ra $\\frac{1}{2}kx^2 = \\frac{1}{4}kA^2$, do đó $|x| = A/\\sqrt{2} = 4\\sqrt{2}$ cm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Mạch dao động LC lí tưởng có độ tự cảm $L = 4$ mH, điện dung $C = 250$ pF. Bước sóng của sóng điện từ mà mạch này có thể thu được là", "options": ["A. xấp xỉ $1885$ m.", "B. $188,5$ m.", "C. $18850$ m.", "D. $18,85$ m."], "answer": "A", "explain": "$f_0 = 1/(2\\pi\\sqrt{LC}) = 1/(2\\pi\\sqrt{4 \\times 10^{-3} \\times 250 \\times 10^{-12}}) = 1/(2\\pi \\times 10^{-6}) \\approx 159155$ Hz; $\\lambda = c/f_0 \\approx 1885$ m.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét photon và thuyết lượng tử ánh sáng.", "statements": ["a) Mỗi photon mang một năng lượng $\u000barepsilon = hf$.", "b) Photon chỉ tồn tại trong trạng thái chuyển động, không có photon đứng yên.", "c) Trong chân không, mọi photon đều truyền đi với tốc độ $c = 3 \times 10^8$ m/s.", "d) Photon là hạt mang điện tích âm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo thuyết lượng tử. d) Sai: photon không mang điện, không có khối lượng nghỉ.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét nội năng và các cách làm thay đổi nội năng của một vật.", "statements": ["a) Nội năng của vật phụ thuộc vào nhiệt độ và thể tích của vật.", "b) Thực hiện công lên vật là một cách làm thay đổi nội năng của vật.", "c) Truyền nhiệt cho vật là một cách làm thay đổi nội năng của vật.", "d) Nhiệt lượng là số đo độ biến thiên nội năng của vật trong quá trình thực hiện công."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: nội năng phụ thuộc $T$ và $V$. b), c) Đúng: hai cách làm thay đổi nội năng. d) Sai: nhiệt lượng là số đo độ biến thiên nội năng trong quá trình truyền nhiệt.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Một khung dây dẫn kín hình chữ nhật đặt trong từ trường đều; cho khung quay đều quanh một trục đối xứng của khung.", "statements": ["a) Từ thông qua khung dây biến thiên điều hòa theo thời gian.", "b) Trong khung dây xuất hiện suất điện động cảm ứng xoay chiều.", "c) Suất điện động cực đại trong khung tỉ lệ với tốc độ góc quay của khung.", "d) Khung quay càng nhanh thì từ thông cực đại qua khung càng lớn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $\\Phi = NBS\\cos(\\omega t)$. b) Đúng: $e_c = -\\Delta\\Phi/\\Delta t$ biến thiên điều hòa. c) Đúng: $E_0 = \\omega NBS$. d) Sai: $\\Phi_{\\max} = NBS$ không phụ thuộc tốc độ quay.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Xét cấu tạo của hạt nhân nguyên tử.", "statements": ["a) Hạt nhân nguyên tử gồm các proton và neutron (gọi chung là nuclon).", "b) Số proton trong hạt nhân bằng số hiệu nguyên tử $Z$.", "c) Các hạt nhân đồng vị có cùng số neutron.", "d) Khối lượng của hạt nhân luôn nhỏ hơn tổng khối lượng của các nuclon tạo thành nó."], "answer": ["T", "T", "F", "T"], "explain": "a), b) Đúng. c) Sai: đồng vị có cùng $Z$ nhưng khác số neutron. d) Đúng: phần hụt đi là độ hụt khối $\\Delta m$.", "points": 1}, {"type": "short", "level": "TH", "q": "Một lượng khí lí tưởng có áp suất $1,5 \\times 10^5$ Pa, thể tích $0,02$ m$^3$, số mol là $2$ mol. Nhiệt độ của khối khí bằng bao nhiêu K? (Cho $R = 8,31$ J/(mol.K); làm tròn đến 1 chữ số thập phân)", "answer": "180,5", "explain": "$T = pV/(nR) = 1,5 \\times 10^5 \\times 0,02/(2 \\times 8,31) = 3000/16,62 \\approx 180,5$ K.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Dòng điện có cường độ $10$ A chạy trong dây dẫn thẳng dài. Cảm ứng từ tại điểm cách dây dẫn $0,2$ m có độ lớn bằng bao nhiêu T? (viết đáp án dưới dạng $a$eb, ví dụ $2 \\times 10^{-5}$ viết là 2e-5)", "answer": "1e-5", "explain": "$B = 2 \\times 10^{-7}I/r = 2 \\times 10^{-7} \\times 10/0,2 = 10^{-5}$ T.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Vật dao động điều hòa theo phương trình $x = 0,03\\cos(5\\pi t)$ ($x$ tính bằng m, $t$ tính bằng s). Gia tốc cực đại của vật bằng bao nhiêu m/s$^2$? (lấy $\\pi^2 = 10$)", "answer": "7,5", "explain": "$a_{\\max} = \\omega^2A = (5\\pi)^2 \\times 0,03 = 25\\pi^2 \\times 0,03 = 250 \\times 0,03 = 7,5$ m/s$^2$.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Đoạn mạch điện xoay chiều RLC nối tiếp có điện trở thuần $R = 30\\ \\Omega$, tổng trở của mạch $Z = 50\\ \\Omega$. Hệ số công suất của mạch bằng bao nhiêu?", "answer": "0,6", "explain": "$\\cos\\varphi = R/Z = 30/50 = 0,6$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sóng âm truyền trong nước với tốc độ $1500$ m/s, tần số $500$ Hz. Bước sóng của sóng âm này bằng bao nhiêu m?", "answer": "3", "explain": "$\\lambda = v/f = 1500/500 = 3$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ban đầu có $20$ g một chất phóng xạ có chu kì bán rã $6$ giờ. Sau $18$ giờ, khối lượng chất phóng xạ còn lại bằng bao nhiêu g?", "answer": "2,5", "explain": "$m = m_0 \\times 2^{-t/T} = 20 \\times 2^{-3} = 2,5$ g.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Sự đông đặc là quá trình", "options": ["A. chất rắn chuyển thành chất lỏng.", "B. chất lỏng chuyển thành chất rắn.", "C. chất lỏng chuyển thành hơi.", "D. hơi ngưng tụ thành chất lỏng."], "answer": "B", "explain": "Đông đặc: chất lỏng tỏa nhiệt để chuyển thành chất rắn (xảy ra ở nhiệt độ đông đặc).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ thông $\\Phi$ qua một khung dây dẫn có $N$ vòng, diện tích mỗi vòng $S$, đặt trong từ trường đều $B$ được tính bởi", "options": ["A. $\\Phi = BS/t$.", "B. $\\Phi = BSl$.", "C. $\\Phi = NBS\\cos\u0007lpha$.", "D. $\\Phi = NB/S$."], "answer": "C", "explain": "$\\Phi = NBS\\cos\\alpha$, trong đó $\\alpha$ là góc giữa $\\vec{B}$ và pháp tuyến của mặt khung.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một vật dao động điều hòa. Vận tốc của vật đạt giá trị cực đại khi vật", "options": ["A. đi qua vị trí cân bằng.", "B. ở vị trí biên dương.", "C. ở vị trí biên âm.", "D. ở vị trí có li độ bằng nửa biên độ."], "answer": "A", "explain": "$|v|_{\\max} = A\\omega$ tại vị trí cân bằng ($x = 0$); tại vị trí biên vận tốc bằng $0$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cường độ âm được đo bằng đơn vị", "options": ["A. đêxiben (dB).", "B. héc (Hz).", "C. ben (B).", "D. oát trên mét vuông (W/m$^2$)."], "answer": "D", "explain": "Cường độ âm $I$ (W/m$^2$) là năng lượng sóng âm truyền qua một đơn vị diện tích trong một đơn vị thời gian.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cảm kháng của một cuộn cảm thuần tỉ lệ thuận với", "options": ["A. nghịch đảo của tần số dòng điện.", "B. tần số của dòng điện xoay chiều.", "C. nghịch đảo của tần số góc.", "D. điện dung của mạch."], "answer": "B", "explain": "$Z_L = \\omega L = 2\\pi fL$: tần số càng lớn, cảm kháng càng lớn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Năng lượng điện từ trong mạch dao động LC lí tưởng", "options": ["A. chỉ gồm năng lượng điện trường trên tụ điện.", "B. chỉ gồm năng lượng từ trường trong cuộn cảm.", "C. là tổng của năng lượng điện trường và năng lượng từ trường trong mạch.", "D. luôn bằng không."], "answer": "C", "explain": "$W = W_C + W_L = \\frac{q^2}{2C} + \\frac{Li^2}{2}$; trong mạch lí tưởng $W$ bảo toàn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Máy quang phổ lăng kính dùng để", "options": ["A. phân tích một chùm sáng phức tạp thành các thành phần đơn sắc.", "B. đo chính xác bước sóng của ánh sáng.", "C. tạo ra chùm sáng đơn sắc từ nguồn sáng trắng.", "D. đo cường độ của chùm sáng."], "answer": "A", "explain": "Máy quang phổ phân tích chùm sáng thành quang phổ (các thành phần đơn sắc) nhờ hiện tượng tán sắc qua lăng kính.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiệu suất lượng tử là", "options": ["A. tỉ số giữa công thoát và năng lượng của photon.", "B. số photon chiếu tới kim loại trong một giây.", "C. năng lượng của chùm sáng kích thích.", "D. tỉ số giữa số electron quang điện bật ra và số photon chiếu tới kim loại trong cùng một khoảng thời gian."], "answer": "D", "explain": "Hiệu suất lượng tử $H = n_e/n_{photon}$: thường rất nhỏ (dưới $1\\%$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhiệt dung riêng của một chất là", "options": ["A. nhiệt lượng cần cung cấp để làm nóng chảy $1$ kg chất đó.", "B. nhiệt lượng cần cung cấp để làm cho $1$ kg chất đó tăng thêm $1^\\circ$C (1 K).", "C. nhiệt lượng tỏa ra khi đốt cháy hoàn toàn $1$ kg chất đó.", "D. nhiệt độ của $1$ kg chất đó ở trạng thái cân bằng."], "answer": "B", "explain": "Định nghĩa nhiệt dung riêng $c$: $Q = mc\\Delta t$; đơn vị J/(kg.K).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Suất điện động cảm ứng xuất hiện trong một khung dây dẫn kín tỉ lệ với", "options": ["A. từ thông qua khung dây.", "B. diện tích của khung dây.", "C. tốc độ biến thiên của từ thông qua khung dây.", "D. cảm ứng từ của từ trường."], "answer": "C", "explain": "Định luật Faraday: $|e_c| = |\\Delta\\Phi/\\Delta t|$: từ thông biến thiên càng nhanh, suất điện động càng lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vật dao động điều hòa theo phương trình $x = 8\\cos(2\\pi t - \\pi/3)$ (cm). Pha ban đầu của dao động là", "options": ["A. $-\\pi/3$.", "B. $\\pi/3$.", "C. $2\\pi t - \\pi/3$.", "D. $\\pi/6$."], "answer": "A", "explain": "Phương trình $x = A\\cos(\\omega t + \\varphi)$: pha ban đầu $\\varphi = -\\pi/3$ rad.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Độ cao của âm phụ thuộc vào", "options": ["A. biên độ của âm.", "B. cường độ của âm.", "C. mức cường độ của âm.", "D. tần số của âm."], "answer": "D", "explain": "Độ cao (âm trầm/bổng) gắn với tần số; biên độ gắn với độ to; dạng đồ thị gắn với âm sắc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tụ điện có điện dung $C = 100/\\pi\\ \\mu$F mắc vào mạch điện xoay chiều có tần số $50$ Hz. Dung kháng của tụ điện là", "options": ["A. $50\\ \\Omega$.", "B. $100\\ \\Omega$.", "C. $200\\ \\Omega$.", "D. $314\\ \\Omega$."], "answer": "B", "explain": "$Z_C = 1/(\\omega C) = 1/(100\\pi \\times 100 \\times 10^{-6}/\\pi) = 1/0,01 = 100\\ \\Omega$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mạch dao động LC lí tưởng có độ tự cảm $L = 1$ mH, điện dung $C = 100$ pF. Tần số dao động riêng của mạch là", "options": ["A. $50,3$ kHz.", "B. $5,03$ MHz.", "C. xấp xỉ $503$ kHz.", "D. $5,03$ kHz."], "answer": "C", "explain": "$f = 1/(2\\pi\\sqrt{LC}) = 1/(2\\pi\\sqrt{10^{-3} \\times 10^{-10}}) = 1/(2\\pi \\times 3,162 \\times 10^{-7}) \\approx 503292$ Hz.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong thí nghiệm Young về giao thoa ánh sáng: khoảng cách hai khe $a = 0,5$ mm, khoảng cách từ hai khe đến màn $D = 1$ m, bước sóng $\\lambda = 0,6\\ \\mu$m. Vị trí vân tối thứ ba (ứng với $k = 2$) cách vân sáng trung tâm", "options": ["A. $3$ mm.", "B. $2,4$ mm.", "C. $1,8$ mm.", "D. $4,2$ mm."], "answer": "A", "explain": "$i = \\lambda D/a = 1,2$ mm; $x_{t3} = (2 + 0,5)i = 2,5 \\times 1,2 = 3$ mm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một kim loại có công thoát của electron là $A = 4,14 \\times 10^{-19}$ J. Giới hạn quang điện của kim loại này là bao nhiêu? (Cho $h = 6,625 \\times 10^{-34}$ J.s, $c = 3 \\times 10^8$ m/s)", "options": ["A. $0,3\\ \\mu$m.", "B. $0,6\\ \\mu$m.", "C. $0,36\\ \\mu$m.", "D. $0,48\\ \\mu$m."], "answer": "D", "explain": "$\\lambda_0 = hc/A = 1,9875 \\times 10^{-25}/(4,14 \\times 10^{-19}) = 4,8 \\times 10^{-7}$ m $= 0,48\\ \\mu$m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đồ thị $p$-$V$ của một lượng khí lí tưởng (đơn nguyên tử) là đoạn thẳng song song với trục $p$ (quá trình đẳng tích): áp suất tăng từ $10^5$ Pa lên $2 \\times 10^5$ Pa, thể tích không đổi bằng $3$ L. Độ biến thiên nội năng của khối khí là", "options": ["A. $300$ J.", "B. $450$ J.", "C. $150$ J.", "D. $600$ J."], "answer": "B", "explain": "Đẳng tích: $A = 0$; khí đơn nguyên tử $\\Delta U = \\frac{3}{2}nR\\Delta T = \\frac{3}{2}V\\Delta p = 1,5 \\times 3 \\times 10^{-3} \\times 10^5 = 450$ J.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai dây dẫn thẳng dài, song song, cách nhau $5$ cm; dòng điện chạy qua mỗi dây là $10$ A và cùng chiều. Lực từ tương tác lên mỗi mét chiều dài của mỗi dây có độ lớn", "options": ["A. $2 \times 10^{-4}$ N/m.", "B. $8 \times 10^{-4}$ N/m.", "C. $4 \times 10^{-4}$ N/m.", "D. $10^{-4}$ N/m."], "answer": "C", "explain": "$F/l = 2 \\times 10^{-7}I_1I_2/r = 2 \\times 10^{-7} \\times 10 \\times 10/0,05 = 4 \\times 10^{-4}$ N/m (hai dây hút nhau).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét các khái niệm cơ bản trong Vật lí nhiệt.", "statements": ["a) Nội năng của vật là tổng động năng và thế năng của các phân tử cấu tạo nên vật.", "b) Nhiệt lượng là số đo độ biến thiên nội năng của vật trong quá trình truyền nhiệt.", "c) Quá trình đẳng nhiệt là quá trình có nhiệt độ của khối khí không đổi.", "d) Trong quá trình đẳng áp, thể tích của khối khí không đổi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo định nghĩa. d) Sai: đẳng áp thì áp suất không đổi, thể tích thay đổi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai dây dẫn thẳng dài, song song, mang dòng điện $I_1$ và $I_2$.", "statements": ["a) Hai dòng điện cùng chiều thì hai dây dẫn hút nhau.", "b) Hai dòng điện ngược chiều thì hai dây dẫn đẩy nhau.", "c) Lực tương tác trên mỗi đơn vị chiều dài dây là $F/l = 2 \times 10^{-7}I_1I_2/r$.", "d) Lực tương tác giữa hai dây không phụ thuộc vào khoảng cách giữa chúng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: lực tỉ lệ nghịch với khoảng cách $r$.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Đoạn mạch điện xoay chiều RLC nối tiếp có $R = 30\\ \\Omega$, $L = 0,4/\\pi$ H, $C = 10^{-3}/(3\\pi)$ F; dòng điện trong mạch có tần số $f = 50$ Hz.", "statements": ["a) Cảm kháng của cuộn cảm là $Z_L = 40\\ \\Omega$.", "b) Dung kháng của tụ điện là $Z_C = 30\\ \\Omega$.", "c) Tổng trở của đoạn mạch là $50\\ \\Omega$.", "d) Điện áp hai đầu mạch và cường độ dòng điện lệch pha nhau với $\tan\u000barphi = 1/3$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $Z_L = \\omega L = 100\\pi \\times 0,4/\\pi = 40\\ \\Omega$. b) Đúng: $Z_C = 1/(\\omega C) = 30\\ \\Omega$. c) Sai: $Z = \\sqrt{30^2 + 10^2} = \\sqrt{1000} \\approx 31,6\\ \\Omega$. d) Đúng: $\\tan\\varphi = (Z_L - Z_C)/R = 10/30 = 1/3$.", "points": 1}, {"type": "truefalse", "level": "NB", "q": "Xét sóng điện từ.", "statements": ["a) Sóng điện từ là sóng ngang.", "b) Sóng điện từ truyền được trong chân không.", "c) Trong chân không, mọi sóng điện từ đều truyền với tốc độ $c = 3 \times 10^8$ m/s.", "d) Sóng điện từ không thể bị phản xạ hay khúc xạ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: sóng điện từ tuân theo các định luật phản xạ, khúc xạ như ánh sáng.", "points": 1}, {"type": "short", "level": "TH", "q": "Đun nóng $1$ kg đồng từ $20^\\circ$C lên $120^\\circ$C. Biết nhiệt dung riêng của đồng là $380$ J/(kg.K). Nhiệt lượng cần cung cấp cho khối đồng bằng bao nhiêu J?", "answer": "38000", "explain": "$Q = mc\\Delta t = 1 \\times 380 \\times 100 = 38000$ J.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Khung dây có $100$ vòng, diện tích mỗi vòng $0,02$ m$^2$, đặt trong từ trường đều $B = 0,1$ T; vectơ cảm ứng từ hợp với vectơ pháp tuyến của mặt khung một góc $60^\\circ$. Từ thông qua khung dây bằng bao nhiêu Wb?", "answer": "0,1", "explain": "$\\Phi = NBS\\cos\\alpha = 100 \\times 0,1 \\times 0,02 \\times \\cos60^\\circ = 0,1$ Wb.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Đoạn mạch điện xoay chiều RLC nối tiếp có điện trở thuần $R = 30\\ \\Omega$, cường độ dòng điện hiệu dụng $I = 5$ A. Công suất tiêu thụ của mạch bằng bao nhiêu W?", "answer": "750", "explain": "$P = I^2R = 25 \\times 30 = 750$ W.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Vật dao động điều hòa với biên độ $6$ cm, tần số góc $4\\pi$ rad/s. Tốc độ cực đại của vật bằng bao nhiêu cm/s? (lấy $\\pi = 3,14$)", "answer": "75,36", "explain": "$v_{\\max} = A\\omega = 6 \\times 4\\pi = 24\\pi \\approx 75,36$ cm/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một khối khí lí tưởng đơn nguyên tử thực hiện quá trình đẳng tích: áp suất tăng thêm $2 \\times 10^5$ Pa, thể tích không đổi bằng $5$ L. Độ biến thiên nội năng của khối khí bằng bao nhiêu J?", "answer": "1500", "explain": "$\\Delta U = \\frac{3}{2}nR\\Delta T = \\frac{3}{2}V\\Delta p = 1,5 \\times 5 \\times 10^{-3} \\times 2 \\times 10^5 = 1500$ J.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một khung dây dẫn kín có điện trở $2\\ \\Omega$; từ thông qua khung biến thiên với tốc độ $0,5$ Wb/s. Cường độ dòng điện cảm ứng trong khung bằng bao nhiêu A?", "answer": "0,25", "explain": "$|e_c| = |\\Delta\\Phi/\\Delta t| = 0,5$ V; $I_c = |e_c|/R = 0,5/2 = 0,25$ A.", "points": 0.5}]}]}
