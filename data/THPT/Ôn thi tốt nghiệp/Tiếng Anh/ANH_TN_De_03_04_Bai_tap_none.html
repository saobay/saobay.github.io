u giờ học - ý 'việc khó làm khi đầu óc tỉnh táo'.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nMany students feel they never have enough time, but the problem is often poor time management. (18) ___. A simple to-do list can help you see what needs to be done first. (19) ___. For example, doing homework right after school leaves the evening free. (20) ___. Short breaks between study sessions actually improve concentration. (21) ___. Many teens waste hours scrolling through social media without noticing. (22) ___.\n\nBlank (20):","options":["A. However, studying for hours without rest is not effective","B. Effective students never take breaks","C. Rest is unnecessary for young people","D. Hours pass quickly during holidays"],"answer":"A","explain":"'However' chuyển ý: học liền nhiều giờ không nghỉ thì không hiệu quả.","points":0.25},{"type":"mcq","level":"TH","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nMany students feel they never have enough time, but the problem is often poor time management. (18) ___. A simple to-do list can help you see what needs to be done first. (19) ___. For example, doing homework right after school leaves the evening free. (20) ___. Short breaks between study sessions actually improve concentration. (21) ___. Many teens waste hours scrolling through social media without noticing. (22) ___.\n\nBlank (21):","options":["A. Noticing things takes a lot of time","B. Social media was invented long ago","C. Therefore, setting a daily limit for phone use is a smart idea","D. Scrolling is the best form of exercise"],"answer":"C","explain":"'Therefore' rút ra giải pháp cho việc lướt điện thoại lãng phí ở câu trước.","points":0.25},{"type":"mcq","level":"VDC","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option  (d) - kết quả Over time (e).","points":0.25},{"type":"mcq","level":"TH","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Dear students,\nb. We are pleased to invite you to a workshop on public speaking.\nc. The workshop will take place this Friday afternoon in Room B201.\nd. Please reply to this email before Thursday if you wish to join.\ne. We look forward to seeing you there. Best regards","options":["A. b-a-d-c-e","B. e-d-c-b-a","C. a-b-c-d-e","D. a-c-b-d-e"],"answer":"C","explain":"Thư mời: chào (a) - lời mời (b) - thông tin chi tiết (c) - yêu cầu phản hồi (d) - kết thư (e).","points":0.25},{"type":"mcq","level":"VD","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Hi, my phone screen is broken. Can you fix it?\nb. Sure. Let me take a look at it.\nc. It will take about two hours and cost 300,000 VND.\nd. That sounds fine. I will come back later.\ne. OK, here is your receipt. See you soon!","options":["A. a-c-b-e-d","B. b-a-c-d-e","C. a-b-c-d-e","D. c-a-b-d-e"],"answer":"C","explain":"Sửa điện thoại: nêu vấn đề (a) - xem máy (b) - báo giá (c) - đồng ý (d) - đưa biên nhận (e).","points":0.25},{"type":"mcq","level":"VD","q":"Mark the letter A, B, C, or D to indicate the best arrangement of utterances or sentences to make a meaningful exchange or text.\n\na. Teamwork is essential for success in most jobs.\nb. When people work together, they can share ideas and solve problems faster.\nc. However, good teamwork requires communication and respect.\nd. Team members should listen to each other and divide tasks fairly.\ne. In short, a strong team can achieve more than individuals working alone.","options":["A. b-a-c-e-d","B. a-b-c-d-e","C. e-d-c-b-a","D. a-b-d-c-e"],"answer":"B","explain":"Câu chủ đề (a) - lợi ích (b) - However chuyển ý (c) - cách làm (d) - kết luận In short (e).","points":0.25},{"type":"mcq","level":"TH","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nReading is one of the best habits a student can develop. (18) ___. Books open the door to new worlds and ideas. (19) ___. For example, reading stories improves vocabulary naturally. (20) ___. Even 20 minutes of reading a day can make a big difference. (21) ___. Many students say they have no time, but they spend hours on their phones. (22) ___.\n\nBlank (18):","options":["A. Libraries open early in the morning","B. Teenagers enjoy many activities","C. Sadly, many teenagers rarely pick up a book today","D. Books are printed on paper"],"answer":"C","explain":"Câu chủ đề khen đọc sách, câu tiếp theo cần ý tương phản: đáng tiếc nhiều teen ít đọc sách.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nReading is one of the best habits a student can develop. (18) ___. Books open the door to new worlds and ideas. (19) ___. For example, reading stories improves vocabulary naturally. (20) ___. Even 20 minutes of reading a day can make a big difference. (21) ___. Many students say they have no time, but they spend hours on their phones. (22) ___.\n\nBlank (19):","options":["A. Doors should be kept open","B. It also helps us think more deeply and creatively","C. New worlds are far away","D. Ideas are difficult to understand"],"answer":"B","explain":"'It' chỉ việc đọc sách; câu cần nêu thêm lợi ích: giúp tư duy sâu sắc và sáng tạo.","points":0.25},{"type":"mcq","level":"VD","q":"Read the following passage and mark the letter A, B, C, or D to indicate the option that best fits each numbered blank.\n\nReading is one of the best habits a student can develop. (18) ___. Books open the door to new worlds and ideas. (19) ___. For example, reading stories improves vocabulary naturally. (20) ___. Even 20 minutes
