":0.25},{"type":"mcq","level":"VD","q":"Read the following passage and mark the letter A, B, C, or D to indicate the best answer to each question.\n\nOnline learning has grown rapidly in recent years. With just a smartphone and internet connection, students can now attend classes, watch lectures, and submit homework from home. During the pandemic, millions of Vietnamese students studied online for months, proving that learning does not always require a classroom.\n\nOnline learning offers clear advantages. Students can study at their own pace, replaying difficult lessons as many times as they need. It also saves time and money on travel. For students in remote areas, online courses provide access to good teachers they could never meet otherwise.\n\nHowever, learning online has drawbacks. Without classmates nearby, some students feel isolated and lose motivation. It is also harder for teachers to check whether students are truly paying attention. Technical problems, such as weak internet signals, can interrupt lessons at important moments.\n\nTo succeed in online learning, students need self-discipline. Experts recommend creating a quiet study corner, following a fixed schedule, and taking regular breaks. Parents can help by encouraging their children and limiting distractions.\n\nLooking ahead, education will likely mix online and traditional methods. This blended approach combines the flexibility of technology with the warmth of human interaction, giving students the best of both worlds.\n\nWhat is the passage mainly about?","options":["A. The advantages and challenges of online learning","B. How to buy a smartphone","C. The history of the pandemic","D. Why classrooms are useless"],"answer":"A","explain":"Bài trình bày ưu điểm, hạn chế của học trực tuyến và hướng kết hợp.","points":0.25},{"type":"mcq","level":"NB","q":"Read the following passage and mark the letter A, B, C, or D to indicate the best answer to each question.\n\nOnline learning has grown rapidly in r
