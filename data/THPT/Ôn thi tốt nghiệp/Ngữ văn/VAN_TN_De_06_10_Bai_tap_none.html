hư một bức tranh. Tôi chợt hiểu: mảnh vườn của ông Tư không chỉ trồng rau, mà còn trồng cả niềm tin về lòng tử tế giữa cuộc đời.\n\nCâu 5. Từ câu chuyện ông Tư, em rút ra bài học gì cho bản thân trong học tập và cuộc sống? (Trả lời ngắn gọn)", "answer": "Sống trung thực, có lương tâm và trách nhiệm trong mọi việc làm", "explain": "Đáp án chấp nhận các cách diễn đạt tương đương: làm việc gì cũng phải có lương tâm; không vì lợi ích mà làm điều sai trái; trung thực là nền tảng của thành công bền vững. Yêu cầu: bài học tích cực, gắn với nhân vật.", "points": 1.0}, {"type": "essay", "level": "VD", "q": "VIẾT (6,0 điểm)\nCâu 6 (2,0 điểm). Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý thức bảo vệ môi trường từ những việc làm nhỏ hằng ngày.", "explain": "DÀN Ý:\n1. Mở đoạn: bảo vệ môi trường là trách nhiệm chung, bắt đầu từ những việc nhỏ nhất.\n2. Thân đoạn: (a) Những việc nhỏ: không xả rác bừa bãi, tiết kiệm điện nước, trồng cây xanh, hạn chế túi ni lông; (b) Ý nghĩa: mỗi hành động nhỏ góp phần tạo nên sự thay đổi lớn; (c) Phê phán: thói quen xả rác, phá hoại cây xanh, thờ ơ với môi trường.\n3. Kết đoạn: hãy hành động ngay từ hôm nay vì một môi trường xanh sạch đẹp.\n\nBÀI MẪU:\nBảo vệ môi trường không phải là việc của riêng ai, cũng không cần những hành động lớn lao; nó bắt đầu từ chính những việc làm nhỏ bé hằng ngày của mỗi chúng ta. Đó là thói quen bỏ rác đúng nơi quy định thay vì vứt bừa bãi ra đường; là tắt điện khi ra khỏi phòng, tiết kiệm từng giọt nước sạch; là mang theo túi vải khi đi chợ để hạn chế túi ni lông; là trồng thêm một cây xanh quanh nhà. Mỗi hành động nhỏ ấy, khi được hàng triệu người cùng thực hiện, sẽ tạo nên sự thay đổi to lớn cho môi trường sống. Thế nhưng, đáng buồn là hiện nay vẫn còn nhiều người xả rác bừa bãi, chặt phá cây xanh, thờ ơ trước tình trạng ô nhiễm ngày càng nghiêm trọng. Đó là những hành vi cần bị phê phán. Môi trường chính là ngôi nhà chung của nhân loại, và tương lai của nó nằm trong tay chúng ta. Vì vậy, mỗi người hãy hành động ngay từ hôm nay, từ những việc nhỏ nhất, để giữ cho đất nước ta mãi xanh, sạch, đẹp.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7 (4,0 điểm). Viết bài văn nghị luận văn học khoảng 600 chữ phân tích nhân vật ông Tư trong truyện ngắn Mảnh vườn của ông Tư.", "explain": "DÀN Ý:\nI. Mở bài: giới thiệu truyện ngắn và nhân vật ông Tư — người nông dân giàu lương tâm.\nII. Thân bài:\n1. Con người lao động cần cù: ra vườn từ tinh mơ, bắt sâu nhổ cỏ bằng tay — gắn bó với đất đai.\n2. Phẩm chất cao đẹp:\n   a. Có lương tâm nghề nghiệp: không dùng thuốc trừ sâu, từ chối lời xui của thương lái.\n   b. Quan niệm sống đúng đắn: tiền hại người thì cầm cũng run tay.\n   c. Tận tâm với cộng đồng: vui vẻ giảng giải cho học sinh về nông nghiệp sạch.\n3. Nghệ thuật xây dựng nhân vật: khắc họa qua hành động, lời nói; chi tiết giàu sức gợi; giọng văn trân trọng.\nIII. Kết bài: ông Tư là biểu tượng của lòng tử tế; bài học về lương tâm nghề nghiệp.\n\nBÀI MẪU:\nTruyện ngắn Mảnh vườn của ông Tư đã khắc họa thành công hình tượng ông Tư — một người nông dân bình dị mà cao đẹp, để lại bài học sâu sắc về lương tâm nghề nghiệp và lòng tử tế giữa cuộc đời.\nTrước hết, ông Tư hiện lên là con người lao động cần cù, gắn bó máu thịt với đất đai. Mỗi sáng, ông ra vườn từ tinh mơ, bắt sâu, nhổ cỏ, tưới nước bằng gáo dừa. Mồ hôi ướt đẫm lưng áo mà ông vẫn vui. Hình ảnh ông cặm cụi dưới nắng, nắng xiên qua kẽ lá rọi lên mái tóc bạc đẹp như một bức tranh đã khắc họa vẻ đẹp của người lao động chân chính.\nĐiều làm nên sức hấp dẫn của nhân vật chính là phẩm chất đạo đức cao đẹp. Ông Tư không bao giờ dùng thuốc trừ sâu vì quan niệm: Trồng rau cho người ăn, mình phải có lương tâm. Khi thương lái xui phun thuốc để rau đẹp mã bán được giá, ông lắc đầu quầy quậy: Tôi không làm thế được. Người ta ăn rau của tôi mà đau ốm thì tôi ân hận cả đời. Câu nói Tiền kiếm được bằng cách hại người thì cầm cũng run tay đã trở thành tuyên ngôn sống của ông — một tuyên ngôn giản dị mà thấm thía về đạo đức nghề nghiệp.\nKhông chỉ giữ mình trong sạch, ông Tư còn tận tâm với cộng đồng. Ông vui vẻ đón học sinh đến vườn học về nông nghiệp sạch, vừa làm vừa giảng giải cho lũ trẻ nghe về đất, về nước, về cái tâm của người trồng rau. Mảnh vườn của ông vì thế không chỉ trồng rau mà còn trồng cả niềm tin về lòng tử tế.\nVề nghệ thuật, tác giả khắc họa nhân vật chủ yếu qua hành động và lời nói, để nhân vật tự bộc lộ phẩm chất; các chi tiết như gáo dừa tưới nước, mái tóc bạc dưới nắng đều giàu sức gợi; giọng văn trân trọng, ấm áp.\nHình tượng ông Tư gợi cho mỗi chúng ta bài học quý giá: dù làm nghề gì, ở vị trí nào, cũng cần có lương tâm và trách nhiệm. Chính những con người tử tế như ông Tư đã làm cho cuộc đời này đáng sống hơn.", "points": 0}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nGỬI BIỂN\n\nBiển ơi, ta gửi về nơi sóng vỗ,\nGửi cánh buồm căng gió giữa trùng khơi.\nGửi những đêm trăng treo trên mặt nước,\nGửi bình minh rực rỡ phía chân trời.\n\nBiển quê ta đẹp như câu hát mẹ,\nLúc hiền hòa, lúc dữ dội, mênh mông.\nÔm vào lòng bao con tàu ra khơi,\nNuôi lớn những ước mơ của ngư dân.\n\nNhưng biển cũng là nơi đầu sóng ngọn gió,\nNơi bao người lính ngày đêm canh giữ.\nHọ đứng đó, giữa biển trời Tổ quốc,\nGiữ bình yên cho đất nước, quê nhà.\n\nBiển ơi biển, ta yêu người tha thiết,\nYêu vị mặn mòi trên bờ môi ngư dân.\nDẫu mai này ta có đi xa mãi,\nVẫn nhớ về biển cả của quê hương.\n\nCâu 1. Bài thơ Gửi biển được viết theo thể thơ nào?", "options": ["A. Thơ lục bát", "B. Thơ năm chữ", "C. Thơ tự do", "D. Thơ thất ngôn tứ tuyệt"], "answer": "B", "explain": "Mỗi dòng thơ có năm chữ, được chia thành các khổ bốn dòng — đó là thể thơ năm chữ, một thể thơ quen thuộc của thơ hiện đại Việt Nam.", "points": 0.5}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nGỬI BIỂN\n\nBiển ơi, ta gửi về nơi sóng vỗ,\nGửi cánh buồm căng gió giữa trùng khơi.\nGửi những đêm trăng treo trên mặt nước,\nGửi bình minh rực rỡ phía chân trời.\n\nBiển quê ta đẹp như câu hát mẹ,\nLúc hiền hòa, lúc dữ dội, mênh mông.\nÔm vào lòng bao con tàu ra khơi,\nNuôi lớn những ước mơ của ngư dân.\n\nNhưng biển cũng là nơi đầu sóng ngọn gió,\nNơi bao người lính ngày đêm canh giữ.\nHọ đứng đó, giữa biển trời Tổ quốc,\nGiữ bình yên cho đất nước, quê nhà.\n\nBiển ơi biển, ta yêu người tha thiết,\nYêu vị mặn mòi trên bờ môi ngư dân.\nDẫu mai này ta có đi xa mãi,\nVẫn nhớ về biển cả của quê hương.\n\nCâu 2. Đối tượng trữ tình chính của bài thơ là ai?", "options": ["A. Người mẹ", "B. Biển quê hương", "C. Người lính đảo", "D. Người ngư dân"], "answer": "B", "explain": "Nhan đề \"Gửi biển\" và đại từ \"người\" trong câu \"ta yêu người tha thiết\" cho thấy đối tượng trữ tình chính là biển quê hương — được nhân hóa như một con người.", "points": 0.75}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nGỬI BIỂN\n\nBiển ơi, ta gửi về nơi sóng vỗ,\nGửi cánh buồm căng gió giữa trùng khơi.\nGửi những đêm trăng treo trên mặt nước,\nGửi bình minh rực rỡ phía chân trời.\n\nBiển quê ta đẹp như câu hát mẹ,\nLúc hiền hòa, lúc dữ dội, mênh mông.\nÔm vào lòng bao con tàu ra khơi,\nNuôi lớn những ước mơ của ngư dân.\n\nNhưng biển cũng là nơi đầu sóng ngọn gió,\nNơi bao người lính ngày đêm canh giữ.\nHọ đứng đó, giữa biển trời Tổ quốc,\nGiữ bình yên cho đất nước, quê nhà.\n\nBiển ơi biển, ta yêu người tha thiết,\nYêu vị mặn mòi trên bờ môi ngư dân.\nDẫu mai này ta có đi xa mãi,\nVẫn nhớ về biển cả của quê hương.\n\nCâu 3. Biện pháp tu từ nào được sử dụng trong câu thơ \"Biển quê ta đẹp như câu hát mẹ\"?", "options": ["A. Nhân hóa", "B. So sánh", "C. Ẩn dụ", "D. Hoán dụ"], "answer": "B", "explain": "Câu thơ dùng từ \"như\" để đối chiếu vẻ đẹp của biển với câu hát mẹ — đó là phép so sánh, vừa gợi vẻ đẹp vừa gợi tình cảm gắn bó, thân thương.", "points": 0.75}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nGỬI BIỂN\n\nBiển ơi, ta gửi về nơi sóng vỗ,\nGửi cánh buồm căng gió giữa trùng khơi.\nGửi những đêm trăng treo trên mặt nước,\nGửi bình minh rực rỡ phía chân trời.\n\nBiển quê ta đẹp như câu hát mẹ,\nLúc hiền hòa, lúc dữ dội, mênh mông.\nÔm vào lòng bao con tàu ra khơi,\nNuôi lớn những ước mơ của ngư dân.\n\nNhưng biển cũng là nơi đầu sóng ngọn gió,\nNơi bao người lính ngày đêm canh giữ.\nHọ đứng đó, giữa biển trời Tổ quốc,\nGiữ bình yên cho đất nước, quê nhà.\n\nBiển ơi biển, ta yêu người tha thiết,\nYêu vị mặn mòi trên bờ môi ngư dân.\nDẫu mai này ta có đi xa mãi,\nVẫn nhớ về biển cả của quê hương.\n\nCâu 4. Khổ thơ thứ ba thể hiện nội dung gì?", "options": ["A. Vẻ đẹp thơ mộng của biển lúc bình minh", "B. Cuộc sống lao động của ngư dân", "C. Sự hy sinh thầm lặng của những người lính đang canh giữ biển trời Tổ quốc", "D. Nỗi nhớ quê hương của người đi xa"], "answer": "C", "explain": "Khổ thơ nhắc đến nơi đầu sóng ngọn gió, những người lính ngày đêm canh giữ, giữ bình yên cho đất nước — đó là sự tri ân đối với sự hy sinh thầm lặng của người lính biển.", "points": 1.0}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nGỬI BIỂN\n\nBiển ơi, ta gửi về nơi sóng vỗ,\nGửi cánh buồm căng gió giữa trùng khơi.\nGửi những đêm trăng treo trên mặt nước,\nGửi bình minh rực rỡ phía chân trời.\n\nBiển quê ta đẹp như câu hát mẹ,\nLúc hiền hòa, lúc dữ dội, mênh mông.\nÔm vào lòng bao con tàu ra khơi,\nNuôi lớn những ước mơ của ngư dân.\n\nNhưng biển cũng là nơi đầu sóng ngọn gió,\nNơi bao người lính ngày đêm canh giữ.\nHọ đứng đó, giữa biển trời Tổ quốc,\nGiữ bình yên cho đất nước, quê nhà.\n\nBiển ơi biển, ta yêu người tha thiết,\nYêu vị mặn mòi trên bờ môi ngư dân.\nDẫu mai này ta có đi xa mãi,\nVẫn nhớ về biển cả của quê hương.\n\nCâu 5. Là học sinh, em sẽ làm gì để thể hiện tình yêu và trách nhiệm đối với biển đảo quê hương? (Trả lời ngắn gọn)", "answer": "Học tập tốt, tuyên truyền bảo vệ biển đảo, giữ gìn môi trường biển", "explain": "Đáp án chấp nhận các việc làm cụ thể, hợp lý: học tập tốt để sau này góp sức xây dựng đất nước; tìm hiểu kiến thức về biển đảo; tuyên truyền bạn bè bảo vệ chủ quyền; không xả rác xuống biển, bảo vệ môi trường biển; tham gia các hoạt động hướng về biển đảo.", "points": 1.0}, {"type": "essay", "level": "VD", "q": "VIẾT (6,0 điểm)\nCâu 6 (2,0 điểm). Viết đoạn văn nghị luận xã hội khoảng 200 chữ về trách nhiệm của thế hệ trẻ đối với chủ quyền biển đảo của Tổ quốc.", "explain": "DÀN Ý:\n1. Mở đoạn: biển đảo là một phần máu thịt thiêng liêng của Tổ quốc.\n2. Thân đoạn: (a) Trách nhiệm của tuổi trẻ: học tập tốt, tìm hiểu kiến thức về biển đảo, tuyên truyền nâng cao nhận thức; (b) Sống có lý tưởng, sẵn sàng cống hiến khi Tổ quốc cần; tri ân những người lính đang canh giữ biển trời; (c) Phê phán thái độ thờ ơ, vô cảm trước vận mệnh đất nước.\n3. Kết đoạn: tuổi trẻ hôm nay là chủ nhân tương lai, phải xứng đáng với sự hy sinh của cha anh.\n\nBÀI MẪU:\nBiển đảo là một phần máu thịt thiêng liêng không thể tách rời của Tổ quốc Việt Nam, và thế hệ trẻ hôm nay có trách nhiệm lớn lao trong việc gìn giữ chủ quyền ấy. Trách nhiệm trước hết thể hiện ở việc học tập tốt, trang bị tri thức để mai này góp sức xây dựng và bảo vệ đất nước. Mỗi người trẻ cần chủ động tìm hiểu về biển đảo quê hương, về những hy sinh thầm lặng của các chiến sĩ đang ngày đêm canh giữ nơi đầu sóng ngọn gió, từ đó nuôi dưỡng lòng yêu nước và ý thức trách nhiệm. Tuổi trẻ cũng cần tích cực tuyên truyền, lan tỏa nhận thức đúng đắn về chủ quyền biển đảo đến cộng đồng, kiên quyết đấu tranh với những thông tin sai lệch. Đáng phê phán là thái độ thờ ơ, vô cảm của một bộ phận người trẻ trước vận mệnh của đất nước, chỉ biết sống cho riêng mình. Cha anh ta đã đổ bao xương máu để giữ từng tấc đất, thước biển; thế hệ hôm nay phải sống xứng đáng với sự hy sinh ấy bằng học tập, rèn luyện và cống hiến hết mình cho Tổ quốc.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7 (4,0 điểm). Viết bài văn nghị luận văn học khoảng 600 chữ phân tích tình cảm của tác giả dành cho biển quê hương trong bài thơ Gửi biển.", "explain": "DÀN Ý:\nI. Mở bài: giới thiệu bài thơ, tình yêu biển quê hương tha thiết.\nII. Thân bài:\n1. Tình yêu trước vẻ đẹp của biển: sóng vỗ, cánh buồm, trăng trên mặt nước, bình minh rực rỡ — biển đẹp như câu hát mẹ, vừa hiền hòa vừa dữ dội.\n2. Tình yêu gắn với con người lao động: ôm tàu ra khơi, nuôi ước mơ ngư dân, vị mặn mòi trên bờ môi — biển là nguồn sống.\n3. Tình yêu gắn với trách nhiệm Tổ quốc: tri ân người lính canh giữ biển trời — yêu biển là yêu nước.\n4. Nỗi nhớ da diết: dù đi xa vẫn nhớ về biển cả quê hương — tình cảm thủy chung.\n5. Nghệ thuật: thể thơ năm chữ, nhân hóa, so sánh, điệp từ gửi, giọng thơ tha thiết.\nIII. Kết bài: tình yêu biển là tình yêu quê hương đất nước; gợi trách nhiệm giữ gìn.\n\nBÀI MẪU:\nBài thơ Gửi biển là khúc tâm tình tha thiết của tác giả dành cho biển quê hương — nơi hội tụ vẻ đẹp thiên nhiên, tình người lao động và trách nhiệm thiêng liêng với Tổ quốc.\nTrước hết, đó là tình yêu trước vẻ đẹp của biển. Tác giả gửi về nơi sóng vỗ cánh buồm căng gió giữa trùng khơi, những đêm trăng treo trên mặt nước, bình minh rực rỡ phía chân trời. Biển hiện lên vừa hiền hòa vừa dữ dội, mênh mông, đẹp như câu hát mẹ — một so sánh vừa gợi vẻ đẹp vừa gợi tình cảm gắn bó ruột thịt. Tình yêu biển ở đây là tình yêu với vẻ đẹp vĩnh hằng của thiên nhiên quê hương.\nTình yêu ấy gắn bó máu thịt với con người lao động. Biển ôm vào lòng bao con tàu ra khơi, nuôi lớn những ước mơ của ngư dân; vị mặn mòi trên bờ môi ngư dân đã trở thành một phần không thể thiếu của đời sống. Biển không chỉ là cảnh đẹp để ngắm mà là nguồn sống, là nơi gửi gắm bao ước mơ, khát vọng của con người.\nCảm động hơn, tình yêu biển được nâng lên thành tình yêu Tổ quốc. Khổ thơ thứ ba nhắc đến nơi đầu sóng ngọn gió, nơi bao người lính ngày đêm canh giữ, giữ bình yên cho đất nước quê nhà. Yêu biển vì thế không chỉ là yêu cảnh mà còn là tri ân những hy sinh thầm lặng, là ý thức trách nhiệm với chủ quyền thiêng liêng.\nXuyên suốt bài thơ là nỗi nhớ da diết: Dẫu mai này ta có đi xa mãi, / Vẫn nhớ về biển cả của quê hương. Đó là tình cảm thủy chung, son sắt — đi đâu cũng không quên cội nguồn.\nVề nghệ thuật, thể thơ năm chữ tạo nhịp điệu êm ái; phép nhân hóa biến biển thành người bạn tâm tình; điệp từ gửi ở khổ đầu tạo âm hưởng dồn dập của cảm xúc; giọng thơ tha thiết, chân thành.\nBài thơ Gửi biển khép lại nhưng tình yêu biển vẫn lan tỏa. Yêu biển chính là yêu quê hương, yêu đất nước. Từ đó, bài thơ nhắc nhở mỗi chúng ta, nhất là thế hệ trẻ, hãy biến tình yêu biển đảo thành hành động cụ thể: học tập tốt, sống có trách nhiệm, góp phần giữ gìn chủ quyền thiêng liêng của Tổ quốc.", "points": 0}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNHỮNG ĐỨA TRẺ VÙNG CAO ĐẾN TRƯỜNG\n\nCon đường đến trường của những đứa trẻ bản Mông dài gần mười cây số, quanh co qua bao dốc núi. Mùa khô, bụi đỏ mù mịt; mùa mưa, đường trơn như đổ mỡ. Thế mà mỗi sáng, khi sương còn giăng trắng thung lũng, đã thấy những bóng nhỏ liêu xiêu gùi sách vở lên đường.\n\nEm Giàng Thị Súa, học sinh lớp 9, phải dậy từ bốn giờ sáng để kịp đến trường lúc bảy giờ. Nhà Súa nghèo, bố mẹ đi làm nương xa, em vừa đi học vừa trông hai đứa em nhỏ. Có hôm mưa to, đường sạt lở, Súa phải vòng qua con suối cạn, nước ngập đến đầu gối. Ướt hết quần áo, em vẫn cười: \"Đi học vui lắm, ở nhà buồn.\"\n\nCô giáo chủ nhiệm kể, lớp có ba mươi hai em thì hai mươi tám em thuộc hộ nghèo. Nhiều em đi học với cái bụng đói, trưa chỉ ăn củ sắn mang theo. Vậy mà chưa bao giờ các em bỏ học. Có em nhà cách trường hơn chục cây số, tối phải ở lại lán của trường, cuối tuần mới về nhà một lần.\n\nĐiều khiến tôi xúc động nhất là ánh mắt của các em trong giờ học. Ánh mắt trong veo, chăm chú, như muốn hút lấy từng con chữ. Khi được hỏi ước mơ sau này, em nào cũng giơ tay: làm thầy giáo, làm bác sĩ, làm kỹ sư... để về xây dựng bản làng. Những ước mơ giản dị mà lớn lao, nảy mầm từ những con đường núi gập ghềnh.\n\nChia tay bản Mông lúc chiều muộn, tôi ngoái nhìn những mái nhà sàn ẩn hiện trong sương. Trong lòng vang lên một câu hỏi: chúng ta, những người có điều kiện học tập thuận lợi hơn, đã thực sự trân trọng và nỗ lực hết mình hay chưa?\n\nCâu 1. Văn bản trên thuộc thể loại nào?", "options": ["A. Truyện ngắn", "B. Ký", "C. Tùy bút", "D. Thơ"], "answer": "B", "explain": "Văn bản ghi lại những điều mắt thấy tai nghe có thật về cuộc sống của trẻ em vùng cao, có nhân vật, sự việc cụ thể gắn với thời gian, không gian xác thực — đó là đặc trưng của ký.", "points": 0.5}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNHỮNG ĐỨA TRẺ VÙNG CAO ĐẾN TRƯỜNG\n\nCon đường đến trường của những đứa trẻ bản Mông dài gần mười cây số, quanh co qua bao dốc núi. Mùa khô, bụi đỏ mù mịt; mùa mưa, đường trơn như đổ mỡ. Thế mà mỗi sáng, khi sương còn giăng trắng thung lũng, đã thấy những bóng nhỏ liêu xiêu gùi sách vở lên đường.\n\nEm Giàng Thị Súa, học sinh lớp 9, phải dậy từ bốn giờ sáng để kịp đến trường lúc bảy giờ. Nhà Súa nghèo, bố mẹ đi làm nương xa, em vừa đi học vừa trông hai đứa em nhỏ. Có hôm mưa to, đường sạt lở, Súa phải vòng qua con suối cạn, nước ngập đến đầu gối. Ướt hết quần áo, em vẫn cười: \"Đi học vui lắm, ở nhà buồn.\"\n\nCô giáo chủ nhiệm kể, lớp có ba mươi hai em thì hai mươi tám em thuộc hộ nghèo. Nhiều em đi học với cái bụng đói, trưa chỉ ăn củ sắn mang theo. Vậy mà chưa bao giờ các em bỏ học. Có em nhà cách trường hơn chục cây số, tối phải ở lại lán của trường, cuối tuần mới về nhà một lần.\n\nĐiều khiến tôi xúc động nhất là ánh mắt của các em trong giờ học. Ánh mắt trong veo, chăm chú, như muốn hút lấy từng con chữ. Khi được hỏi ước mơ sau này, em nào cũng giơ tay: làm thầy giáo, làm bác sĩ, làm kỹ sư... để về xây dựng bản làng. Những ước mơ giản dị mà lớn lao, nảy mầm từ những con đường núi gập ghềnh.\n\nChia tay bản Mông lúc chiều muộn, tôi ngoái nhìn những mái nhà sàn ẩn hiện trong sương. Trong lòng vang lên một câu hỏi: chúng ta, những người có điều kiện học tập thuận lợi hơn, đã thực sự trân trọng và nỗ lực hết mình hay chưa?\n\nCâu 2. Nhân vật nào được nhắc đến cụ thể trong văn bản?", "options": ["A. Em Giàng Thị Súa", "B. Em Hoàng Văn Minh", "C. Cô giáo Lan", "D. Em Lò Thị Hoa"], "answer": "A", "explain": "Văn bản nhắc cụ thể đến em Giàng Thị Súa, học sinh lớp 9, với hoàn cảnh: dậy từ bốn giờ sáng, nhà nghèo, vừa học vừa trông em, vượt suối đến trường.", "points": 0.75}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNHỮNG ĐỨA TRẺ VÙNG CAO ĐẾN TRƯỜNG\n\nCon đường đến trường của những đứa trẻ bản Mông dài gần mười cây số, quanh co qua bao dốc núi. Mùa khô, bụi đỏ mù mịt; mùa mưa, đường trơn như đổ mỡ. Thế mà mỗi sáng, khi sương còn giăng trắng thung lũng, đã thấy những bóng nhỏ liêu xiêu gùi sách vở lên đường.\n\nEm Giàng Thị Súa, học sinh lớp 9, phải dậy từ bốn giờ sáng để kịp đến trường lúc bảy giờ. Nhà Súa nghèo, bố mẹ đi làm nương xa, em vừa đi học vừa trông hai đứa em nhỏ. Có hôm mưa to, đường sạt lở, Súa phải vòng qua con suối cạn, nước ngập đến đầu gối. Ướt hết quần áo, em vẫn cười: \"Đi học vui lắm, ở nhà buồn.\"\n\nCô giáo chủ nhiệm kể, lớp có ba mươi hai em thì hai mươi tám em thuộc hộ nghèo. Nhiều em đi học với cái bụng đói, trưa chỉ ăn củ sắn mang theo. Vậy mà chưa bao giờ các em bỏ học. Có em nhà cách trường hơn chục cây số, tối phải ở lại lán của trường, cuối tuần mới về nhà một lần.\n\nĐiều khiến tôi xúc động nhất là ánh mắt của các em trong giờ học. Ánh mắt trong veo, chăm chú, như muốn hút lấy từng con chữ. Khi được hỏi ước mơ sau này, em nào cũng giơ tay: làm thầy giáo, làm bác sĩ, làm kỹ sư... để về xây dựng bản làng. Những ước mơ giản dị mà lớn lao, nảy mầm từ những con đường núi gập ghềnh.\n\nChia tay bản Mông lúc chiều muộn, tôi ngoái nhìn những mái nhà sàn ẩn hiện trong sương. Trong lòng vang lên một câu hỏi: chúng ta, những người có điều kiện học tập thuận lợi hơn, đã thực sự trân trọng và nỗ lực hết mình hay chưa?\n\nCâu 3. Chi tiết nào thể hiện rõ nhất nghị lực vượt khó của những đứa trẻ vùng cao?", "options": ["A. Các em thích chơi đùa trên đường đến trường", "B. Các em vượt mười cây số đường núi, dậy từ bốn giờ sáng, ướt hết quần áo vẫn cười nói đi học vui", "C. Các em được thầy cô dẫn đi tham quan", "D. Các em thích ăn củ sắn"], "answer": "B", "explain": "Những chi tiết: đường dài mười cây số, dậy từ bốn giờ sáng, lội suối ngập đến đầu gối, ướt hết quần áo mà vẫn cười — tất cả khắc họa nghị lực phi thường, tinh thần ham học của các em.", "points": 0.75}, {"type": "short", "level": "TH", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nNHỮNG ĐỨA TRẺ VÙNG CAO ĐẾN TRƯỜNG\n\nCon đường đến trường của những đứa trẻ bản Mông dài gần mười cây số, quanh co qua bao dốc núi. Mùa khô, bụi đỏ mù mịt; mùa mưa, đường trơn như đổ mỡ. Thế mà mỗi sáng, khi sương còn giăng trắng thung lũng, đã thấy những bóng nhỏ liêu xiêu gùi sách vở lên đường.\n\nEm Giàng Thị Súa, học sinh lớp 9, phải dậy từ bốn giờ sáng để kịp đến trường lúc bảy giờ. Nhà Súa nghèo, bố mẹ đi làm nương xa, em vừa đi học vừa trông hai đứa em nhỏ. Có hôm mưa to, đường sạt lở, Súa phải vòng qua con suối cạn, nước ngập đến đầu gối. Ướt hết quần áo, em vẫn cười: \"Đi học vui lắm, ở nhà buồn.\"\n\nCô giáo chủ nhiệm kể, lớp có ba mươi hai em thì hai mươi tám em thuộc hộ nghèo. Nhiều em đi học với cái bụng đói, trưa chỉ ăn củ sắn mang theo. Vậy mà chưa bao giờ các em bỏ học. Có em nhà cách trường hơn chục cây số, tối phải ở lại lán của trường, cuối tuần mới về nhà một lần.\n\nĐiều khiến tôi xúc động nhất là ánh mắt của các em trong giờ học. Ánh mắt trong veo, chăm chú, như muốn hút lấy từng con chữ. Khi  làm bác sĩ, làm kỹ sư... để về xây dựng bản làng. Những ước mơ giản dị mà lớn lao, nảy mầm từ những con đường núi gập ghềnh.\n\nChia tay bản Mông lúc chiều muộn, tôi ngoái nhìn những mái nhà sàn ẩn hiện trong sương. Trong lòng vang lên một câu hỏi: chúng ta, những người có điều kiện học tập thuận lợi hơn, đã thực sự trân trọng và nỗ lực hết mình hay chưa?\n\nCâu 5. Từ văn bản, em rút ra bài học gì cho bản thân trong học tập? (Trả lời ngắn gọn)", "answer": "Trân trọng điều kiện học tập và nỗ lực hết mình", "explain": "Đáp án chấp nhận các cách diễn đạt tương đương: biết ơn và tận dụng điều kiện học tập thuận lợi; học tập chăm chỉ, không nản chí trước khó khăn; noi gương nghị lực của các bạn vùng cao. Yêu cầu: bài học tích cực, chân thành.", "points": 1.0}, {"type": "essay", "level": "VD", "q": "VIẾT (6,0 điểm)\nCâu 6 (2,0 điểm). Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý chí, nghị lực vượt qua khó khăn trong cuộc sống.", "explain": "DÀN Ý:\n1. Mở đoạn: khó khăn là điều không thể tránh khỏi; ý chí nghị lực là chìa khóa vượt qua.\n2. Thân đoạn: (a) Biểu hiện: kiên trì trước thất bại, không nản chí, dám đối mặt thử thách; (b) Ý nghĩa: nghị lực giúp con người trưởng thành, biến khó khăn thành cơ hội, chạm tới thành công; dẫn chứng: những tấm gương vượt khó; (c) Phê phán: lối sống nản chí, bỏ cuộc, đổ lỗi cho hoàn cảnh.\n3. Kết đoạn: hãy rèn luyện nghị lực mỗi ngày.\n\nBÀI MẪU:\nTrong cuộc sống, khó khăn thử thách là điều không ai tránh khỏi, và ý chí nghị lực chính là chìa khóa giúp con người vượt qua tất cả. Nghị lực thể hiện ở sự kiên trì trước thất bại, ở thái độ không nản chí khi gặp trở ngại, ở bản lĩnh dám đối mặt với thử thách thay vì trốn tránh. Nhờ có nghị lực, con người mới có thể biến khó khăn thành cơ hội, biến ước mơ thành hiện thực. Thực tế đã chứng minh: những đứa trẻ vùng cao vượt mười cây số đường núi đến trường, những vận động viên khuyết tật vươn tới đỉnh cao, những nhà khoa học kiên trì hàng chục năm trong phòng thí nghiệm — tất cả đều thành công nhờ ý chí thép. Ngược lại, những kẻ thiếu nghị lực thường nản chí, bỏ cuộc giữa chừng, đổ lỗi cho hoàn cảnh và mãi dậm chân tại chỗ. Đó là điều đáng phê phán. Vì vậy, mỗi chúng ta, nhất là tuổi trẻ, hãy rèn luyện ý chí nghị lực ngay từ hôm nay, từ những việc nhỏ nhất, để vững vàng bước qua mọi giông bão của cuộc đời.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7 (4,0 điểm). Viết bài văn nghị luận văn học khoảng 600 chữ phân tích vẻ đẹp tâm hồn của những đứa trẻ vùng cao trong văn bản Những đứa trẻ vùng cao đến trường.", "explain": "DÀN Ý:\nI. Mở bài: giới thiệu văn bản, vẻ đẹp tâm hồn trẻ thơ vùng cao.\nII. Thân bài:\n1. Nghị lực vượt khó phi thường: đường mười cây số, dậy từ bốn giờ sáng, lội suối, ướt áo vẫn cười — ham học, kiên cường.\n2. Tâm hồn trong sáng, lạc quan: ánh mắt trong veo chăm chú; câu nói đi học vui lắm — yêu đời, yêu học.\n3. Ước mơ cao đẹp: làm thầy giáo, bác sĩ, kỹ sư để về xây dựng bản làng — sống có lý tưởng, biết cống hiến.\n4. Nghệ thuật: ký chân thực, chi tiết cụ thể, giàu cảm xúc; giọng văn trân trọng, xót xa mà khâm phục.\nIII. Kết bài: vẻ đẹp đáng trân trọng; bài học cho người có điều kiện thuận lợi.\n\nBÀI MẪU:\nVăn bản Những đứa trẻ vùng cao đến trường đã khắc họa vẻ đẹp tâm hồn của những đứa trẻ bản Mông — vẻ đẹp của nghị lực, của sự trong sáng và những ước mơ cao đẹp, khiến người đọc không khỏi xúc động và khâm phục.\nTrước hết, đó là nghị lực vượt khó phi thường. Con đường đến trường dài gần mười cây số, quanh co qua bao dốc núi; mùa khô bụi đỏ mù mịt, mùa mưa đường trơn như đổ mỡ. Em Giàng Thị Súa phải dậy từ bốn giờ sáng, vừa đi học vừa trông hai đứa em nhỏ. Có hôm mưa to, đường sạt lở, em phải lội qua con suối cạn nước ngập đến đầu gối. Ướt hết quần áo mà em vẫn cười: Đi học vui lắm, ở nhà buồn. Nụ cười hồn nhiên giữa gian khó ấy có sức lay động mạnh mẽ hơn mọi lời hùng biện về nghị lực.\nẨn sau sự gian khó là một tâm hồn trong sáng, lạc quan. Tác giả xúc động trước ánh mắt của các em trong giờ học: ánh mắt trong veo, chăm chú, như muốn hút lấy từng con chữ. Dù đi học với cái bụng đói, trưa chỉ ăn củ sắn mang theo, các em chưa bao giờ bỏ học. Tình yêu với con chữ, với trường lớp đã trở thành nguồn sức mạnh giúp các em vượt qua mọi thiếu thốn.\nCao đẹp hơn, những đứa trẻ ấy mang trong mình những ước mơ lớn lao: làm thầy giáo, làm bác sĩ, làm kỹ sư... để về xây dựng bản làng. Ước mơ giản dị mà thấm đẫm tinh thần cống hiến — học không phải để thoát ly quê hương mà để trở về dựng xây. Đó là vẻ đẹp của những tâm hồn biết sống vì cộng đồng.\nVề nghệ thuật, văn bản thuộc thể ký với những chi tiết chân thực, cụ thể; cách kể chuyện giàu cảm xúc; giọng văn vừa xót xa vừa trân trọng, khâm phục.\nHình ảnh những đứa trẻ vùng cao khép lại văn bản bằng một câu hỏi day dứt: chúng ta, những người có điều kiện học tập thuận lợi hơn, đã thực sự trân trọng và nỗ lực hết mình hay chưa? Đó cũng chính là bài học sâu sắc mà văn bản gửi gắm đến mỗi người đọc, nhất là thế hệ trẻ hôm nay.", "points": 0}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nSỨC SỐNG CỦA VĂN CHƯƠNG\n\nCó người cho rằng trong thời đại công nghệ số, văn chương đã lỗi thời. Sách in nhường chỗ cho màn hình điện thoại, những trang văn thấm đẫm cảm xúc bị lấn át bởi những video ngắn vài chục giây. Nhưng sự thật có phải như vậy không?\n\nVăn chương ra đời từ nhu cầu thấu hiểu con người. Một tác phẩm văn học chân chính không chỉ kể một câu chuyện mà còn mở ra một thế giới tâm hồn. Khi đọc những trang văn hay, ta được sống thêm nhiều cuộc đời, được khóc cười cùng nhân vật, được soi mình vào số phận của người khác để hiểu mình hơn. Không một video ngắn nào có thể thay thế được chiều sâu ấy.\n\nHơn nữa, văn chương có sức mạnh cảm hóa con người. Một câu thơ hay có thể an ủi một tâm hồn đang tuyệt vọng; một trang truyện cảm động có thể đánh thức lòng trắc ẩn đã ngủ quên. Trong lịch sử, biết bao tác phẩm đã góp phần thay đổi nhận thức của cả một thời đại, khơi dậy khát vọng tự do, công lý và tình yêu thương.\n\nVăn chương cũng là nơi lưu giữ ký ức của dân tộc. Mỗi tác phẩm là một lát cắt của thời đại, ghi lại nếp sống, tâm tư của cha ông để con cháu mai sau tìm về. Nếu không có văn chương, chúng ta sẽ đánh mất một phần quan trọng của cội nguồn.\n\nDĩ nhiên, văn chương muốn sống mãi phải biết đổi mới để đến gần hơn với bạn đọc trẻ. Nhưng dù hình thức có thay đổi thế nào — sách in, sách điện tử hay sách nói — thì nhu cầu được đồng cảm, được thấu hiểu của con người vẫn còn đó, và văn chương vẫn còn sức sống. Vấn đề không phải là văn chương có lỗi thời hay không, mà là mỗi chúng ta có còn dành thời gian cho những trang văn hay không.\n\nCâu 1. Văn bản trên thuộc kiểu văn bản nào?", "options": ["A. Văn bản nghị luận", "B. Văn bản tự sự", "C. Văn bản thuyết minh", "D. Văn bản miêu tả"], "answer": "A", "explain": "Văn bản trình bày hệ thống luận điểm, lý lẽ để bàn về sức sống của văn chương trong thời đại số — đó là văn bản nghị luận.", "points": 0.5}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nSỨC SỐNG CỦA VĂN CHƯƠNG\n\nCó người cho rằng trong thời đại công nghệ số, văn chương đã lỗi thời. Sách in nhường chỗ cho màn hình điện thoại, những trang văn thấm đẫm cảm xúc bị lấn át bởi những video ngắn vài chục giây. Nhưng sự thật có phải như vậy không?\n\nVăn chương ra đời từ nhu cầu thấu hiểu con người. Một tác phẩm văn học chân chính không chỉ kể một câu chuyện mà còn mở ra một thế giới tâm hồn. Khi đọc những trang văn hay, ta được sống thêm nhiều cuộc đời, được khóc cười cùng nhân vật, được soi mình vào số phận của người khác để hiểu mình hơn. Không một video ngắn nào có thể thay thế được chiều sâu ấy.\n\nHơn nữa, văn chương có sức mạnh cảm hóa con người. Một câu thơ hay có thể an ủi một tâm hồn đang tuyệt vọng; một trang truyện cảm động có thể đánh thức lòng trắc ẩn đã ngủ quên. Trong lịch sử, biết bao tác phẩm đã góp phần thay đổi nhận thức của cả một thời đại, khơi dậy khát vọng tự do, công lý và tình yêu thương.\n\nVăn chương cũng là nơi lưu giữ ký ức của dân tộc. Mỗi tác phẩm là một lát cắt của thời đại, ghi lại nếp sống, tâm tư của cha ông để con cháu mai sau tìm về. Nếu không có văn chương, chúng ta sẽ đánh mất một phần quan trọng của cội nguồn.\n\nDĩ nhiên, văn chương muốn sống mãi phải biết đổi mới để đến gần hơn với bạn đọc trẻ. Nhưng dù hình thức có thay đổi thế nào — sách in, sách điện tử hay sách nói — thì nhu cầu được đồng cảm, được thấu hiểu của con người vẫn còn đó, và văn chương vẫn còn sức sống. Vấn đề không phải là văn chương có lỗi thời hay không, mà là mỗi chúng ta có còn dành thời gian cho những trang văn hay không.\n\nCâu 2. Luận điểm chính của văn bản là gì?", "options": ["A. Văn chương đã lỗi thời trong thời đại số", "B. Văn chương vẫn còn sức sống mạnh mẽ vì đáp ứng nhu cầu thấu hiểu, đồng cảm của con người", "C. Chỉ nên đọc sách in, không nên đọc sách điện tử", "D. Video ngắn hay hơn văn chương"], "answer": "B", "explain": "Toàn bộ văn bản lập luận để khẳng định văn chương không lỗi thời mà vẫn có sức sống, vì nó đáp ứng nhu cầu thấu hiểu con người, cảm hóa tâm hồn và lưu giữ ký ức dân tộc.", "points": 0.75}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nSỨC SỐNG CỦA VĂN CHƯƠNG\n\nCó người cho rằng trong thời đại công nghệ số, văn chương đã lỗi thời. Sách in nhường chỗ cho màn hình điện thoại, những trang văn thấm đẫm cảm xúc bị lấn át bởi những video ngắn vài chục giây. Nhưng sự thật có phải như vậy không?\n\nVăn chương ra đời từ nhu cầu thấu hiểu con người. Một tác phẩm văn học chân chính không chỉ kể một câu chuyện mà còn mở ra một thế giới tâm hồn. Khi đọc những trang văn hay, ta được sống thêm nhiều cuộc đời, được khóc cười cùng nhân vật, được soi mình vào số phận của người khác để hiểu mình hơn. Không một video ngắn nào có thể thay thế được chiều sâu ấy.\n\nHơn nữa, văn chương có sức mạnh cảm hóa con người. Một câu thơ hay có thể an ủi một tâm hồn đang tuyệt vọng; một trang truyện cảm động có thể đánh thức lòng trắc ẩn đã ngủ quên. Trong lịch sử, biết bao tác phẩm đã góp phần thay đổi nhận thức của cả một thời đại, khơi dậy khát vọng tự do, công lý và tình yêu thương.\n\nVăn chương cũng là nơi lưu giữ ký ức của dân tộc. Mỗi tác phẩm là một lát cắt của thời đại, ghi lại nếp sống, tâm tư của cha ông để con cháu mai sau tìm về. Nếu không có văn chương, chúng ta sẽ đánh mất một phần quan trọng của cội nguồn.\n\nDĩ nhiên, văn chương muốn sống mãi phải biết đổi mới để đến gần hơn với bạn đọc trẻ. Nhưng dù hình thức có thay đổi thế nào — sách in, sách điện tử hay sách nói — thì nhu cầu được đồng cảm, được thấu hiểu của con người vẫn còn đó, và văn chương vẫn còn sức sống. Vấn đề không phải là văn chương có lỗi thời hay không, mà là mỗi chúng ta có còn dành thời gian cho những trang văn hay không.\n\nCâu 3. Theo tác giả, vì sao không một video ngắn nào thay thế được văn chương?", "options": ["A. Vì video ngắn quá đắt tiền", "B. Vì văn chương mang lại chiều sâu tâm hồn: cho ta sống thêm nhiều cuộc đời, thấu hiểu mình và người", "C. Vì video ngắn không có hình ảnh đẹp", "D. Vì văn chương dễ đọc hơn video"], "answer": "B", "explain": "Tác giả viết: \"Khi đọc những trang văn hay, ta được sống thêm nhiều cuộc đời... để hiểu mình hơn. Không một video ngắn nào có thể thay thế được chiều sâu ấy.\"", "points": 0.75}, {"type": "short", "level": "TH", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nSỨC SỐNG CỦA VĂN CHƯƠNG\n\nCó người cho rằng trong thời đại công nghệ số, văn chương đã lỗi thời. Sách in nhường chỗ cho màn hình điện thoại, những trang văn thấm đẫm cảm xúc bị lấn át bởi những video ngắn vài chục giây. Nhưng sự thật có phải như vậy không?\n\nVăn chương ra đời từ nhu cầu thấu hiểu con người. Một tác phẩm văn học chân chính không chỉ kể một câu chuyện mà còn mở ra một thế giới tâm hồn. Khi đọc những trang văn hay, ta được sống thêm nhiều cuộc đời, được khóc cười cùng nhân vật, được soi mình vào số phận của người khác để hiểu mình hơn. Không một video ngắn nào có thể thay thế được chiều sâu ấy.\n\nHơn nữa, văn chương có sức mạnh cảm hóa con người. Một câu thơ hay có thể an ủi một tâm hồn đang tuyệt vọng; một trang truyện cảm động có thể đánh thức lòng trắc ẩn đã ngủ quên. Trong lịch sử, biết bao tác phẩm đã góp phần thay đổi nhận thức của cả một thời đại, khơi dậy khát vọng tự do, công lý và tình yêu thương.\n\nVăn chương cũng là nơi lưu giữ ký ức của dân tộc. Mỗi tác phẩm là một lát cắt của thời đại, ghi lại nếp sống, tâm tư của cha ông để con cháu mai sau tìm về. Nếu không có văn chương, chúng ta sẽ đánh mất một phần quan trọng của cội nguồn.\n\nDĩ nhiên, văn chương muốn sống mãi phải biết đổi mới để đến gần hơn với bạn đọc trẻ. Nhưng dù hình thức có thay đổi thế nào — sách in, sách điện tử hay sách nói — thì nhu cầu được đồng cảm, được thấu hiểu của con người vẫn còn đó, và văn chương vẫn còn sức sống. Vấn đề không phải là văn chương có lỗi thời hay không, mà là mỗi chúng ta có còn dành thời gian cho những trang văn hay không.\n\nCâu 4. Tác giả đã nêu những vai trò nào của văn chương đối với con người và dân tộc? (Trả lời ngắn gọn)", "answer": "Thấu hiểu con người, cảm hóa tâm hồn, lưu giữ ký ức dân tộc", "explain": "Đáp án chấp nhận liệt kê đủ ba vai trò: (1) giúp thấu hiểu con người — sống thêm nhiều cuộc đời; (2) cảm hóa con người — an ủi, đánh thức lòng trắc ẩn; (3) lưu giữ ký ức dân tộc — ghi lại nếp sống, tâm tư cha ông.", "points": 1.0}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nSỨC SỐNG CỦA VĂN CHƯƠNG\n\nCó người cho rằng trong thời đại công nghệ số, văn chương đã lỗi thời. Sách in nhường chỗ cho màn hình điện thoại, những trang văn thấm đẫm cảm xúc bị lấn át bởi những video ngắn vài chục giây. Nhưng sự thật có phải như vậy không?\n\nVăn chương ra đời từ nhu cầu thấu hiểu con người. Một tác phẩm văn học chân chính không chỉ kể một câu chuyện mà còn mở ra một thế giới tâm hồn. Khi đọc những trang văn hay, ta được sống thêm nhiều cuộc đời, được khóc cười cùng nhân vật, được soi mình vào số phận của người khác để hiểu mình hơn. Không một video ngắn nào có thể thay thế được chiều sâu ấy.\n\nHơn nữa, văn chương có sức mạnh cảm hóa con người. Một câu thơ hay có thể an ủi một tâm hồn đang tuyệt vọng; một trang truyện cảm động có thể đánh thức lòng trắc ẩn đã ngủ quên. Trong lịch sử, biết bao tác phẩm đã góp phần thay đổi nhận thức của cả một thời đại, khơi dậy khát vọng tự do, công lý và tình yêu thương.\n\nVăn chương cũng là nơi lưu giữ ký ức của dân tộc. Mỗi tác phẩm là một lát cắt của thời đại, ghi lại nếp sống, tâm tư của cha ông để con cháu mai sau tìm về. Nếu không có văn chương, chúng ta sẽ đánh mất một phần quan trọng của cội nguồn.\n\nDĩ nhiên, văn chương muốn sống mãi phải biết đổi mới để đến gần hơn với bạn đọc trẻ. Nhưng dù hình thức có thay đổi thế nào — sách in, sách điện tử hay sách nói — thì nhu cầu được đồng cảm, được thấu hiểu của con người vẫn còn đó, và văn chương vẫn còn sức sống. Vấn đề không phải là văn chương có lỗi thời hay không, mà là mỗi chúng ta có còn dành thời gian cho những trang văn hay không.\n\nCâu 5. Em có đồng tình rằng văn chương vẫn còn sức sống trong thời đại số không? Vì sao? (Trả lời ngắn gọn)", "answer": "Đồng tình, vì nhu cầu đồng cảm và thấu hiểu của con người là vĩnh cửu", "explain": "Đáp án mở, chấp nhận đồng tình hoặc không đồng tình, miễn là có lý do hợp lý. Ví dụ đồng tình: công nghệ thay đổi hình thức đọc nhưng không thay thế được chiều sâu tâm hồn mà văn chương mang lại. Ví dụ chưa hoàn toàn đồng tình: văn chương cần đổi mới mạnh mẽ hơn nữa mới giữ được bạn đọc trẻ. Yêu cầu: chính kiến rõ, lập luận thuyết phục.", "points": 1.0}, {"type": "essay", "level": "VD", "q": "VIẾT (6,0 điểm)\nCâu 6 (2,0 điểm). Viết đoạn văn nghị luận xã hội khoảng 200 chữ về vai trò của việc đọc sách đối với học sinh.", "explain": "DÀN Ý:\n1. Mở đoạn: đọc sách là thói quen quý báu, nhất là với học sinh.\n2. Thân đoạn: (a) Sách mở rộng tri thức, bồi đắp tâm hồn, rèn tư duy và ngôn ngữ; (b) Đọc sách giúp thư giãn lành mạnh, tránh xa những nội dung độc hại trên mạng; (c) Phê phán: văn hóa đọc đang mai một, nhiều bạn trẻ lười đọc, chỉ xem nội dung ngắn, hời hợt.\n3. Kết đoạn: hãy hình thành thói quen đọc sách mỗi ngày.\n\nBÀI MẪU:\nĐọc sách là một thói quen vô cùng quý báu, nhất là đối với lứa tuổi học sinh. Sách là kho tàng tri thức của nhân loại, mở ra trước mắt ta những chân trời mới mẻ. Đọc sách không chỉ giúp ta mở rộng hiểu biết mà còn bồi đắp tâm hồn, rèn luyện tư duy và khả năng diễn đạt. Một cuốn sách hay có thể thay đổi cách ta nhìn cuộc đời, giúp ta sống nhân ái và sâu sắc hơn. Trong thời đại bùng nổ thông tin, đọc sách còn là cách thư giãn lành mạnh, giúp ta tránh xa những nội dung độc hại, hời hợt trên mạng xã hội. Đáng buồn là hiện nay văn hóa đọc đang dần mai một: nhiều bạn trẻ lười đọc sách, chỉ quen với những video ngắn vài chục giây, khiến tư duy trở nên nông cạn, ngôn ngữ nghèo nàn. Đó là điều đáng báo động. Vì vậy, mỗi học sinh hãy tự hình thành cho mình thói quen đọc sách mỗi ngày, dù chỉ vài trang, bởi mỗi trang sách hôm nay chính là một bậc thang đưa ta tới tương lai.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7 (4,0 điểm). Viết bài văn nghị luận văn học khoảng 600 chữ cảm nhận về bài thơ sau:\n\nMẸ VÀ QUÊ HƯƠNG\n\nCon đi xa, mẹ ngồi trông ngóng,\nMắt nhìn theo hút nẻo đường xa.\nQuê hương ơi, sao mà thương thế,\nThương dáng mẹ còng bên hiên nhà.\n\nDù bão giông hay nắng lửa mưa dầm,\nMẹ vẫn là bến đỗ bình yên nhất.\nQuê hương là nơi con tìm về,\nSau những ngày bon chen mệt mỏi.", "explain": "DÀN Ý:\nI. Mở bài: giới thiệu bài thơ Mẹ và quê hương — tình mẫu tử gắn với tình yêu quê hương.\nII. Thân bài:\n1. Hình ảnh người mẹ ngóng trông: ngồi trông ngóng, mắt nhìn theo hút nẻo đường xa — tình mẹ bao la, nỗi nhớ con da diết.\n2. Mẹ là bến đỗ bình yên: dù bão giông hay nắng lửa mưa dầm, mẹ vẫn là chỗ dựa vững chắc — sự hy sinh, chở che.\n3. Quê hương là nơi tìm về: thương dáng mẹ còng bên hiên nhà; quê hương gắn liền với hình bóng mẹ — tình yêu quê hương bắt nguồn từ tình mẫu tử.\n4. Nghệ thuật: thể thơ tự do giàu nhạc điệu, hình ảnh bình dị giàu sức gợi, điệp ý, giọng thơ tha thiết.\nIII. Kết bài: bài thơ ca ngợi tình mẹ và tình quê; gợi bài học hiếu thảo, trân trọng quê hương.\n\nBÀI MẪU:\nBài thơ Mẹ và quê hương là khúc tâm tình ngọt ngào, nơi tình mẫu tử thiêng liêng hòa quyện cùng tình yêu quê hương sâu nặng, để lại nhiều xúc cảm trong lòng người đọc.\nMở đầu bài thơ là hình ảnh người mẹ ngóng trông con đi xa: Con đi xa, mẹ ngồi trông ngóng, / Mắt nhìn theo hút nẻo đường xa. Dáng mẹ ngồi trông, ánh mắt dõi theo hút nẻo đường đã khắc họa nỗi nhớ con da diết của người mẹ. Con đi càng xa, lòng mẹ càng đầy vơi thương nhớ. Hình ảnh ấy khiến ta nhớ đến bao bà mẹ Việt Nam tần tảo, cả đời chỉ biết lo cho con.\nSâu lắng hơn, mẹ hiện lên như bến đỗ bình yên nhất của đời con: Dù bão giông hay nắng lửa mưa dầm, / Mẹ vẫn là bến đỗ bình yên nhất. Dù cuộc đời có bao giông tố, vòng tay mẹ vẫn luôn rộng mở chở che. Mẹ là nơi con tìm về sau những ngày bon chen mệt mỏi, là điểm tựa tinh thần vững chắc nhất. Hình ảnh thơ giản dị mà thấm thía, gợi lên sự hy sinh thầm lặng và tình yêu vô điều kiện của mẹ.\nĐặc biệt, trong bài thơ, tình yêu quê hương gắn liền với hình bóng người mẹ: Quê hương ơi, sao mà thương thế, / Thương dáng mẹ còng bên hiên nhà. Quê hương không phải là khái niệm trừu tượng xa xôi mà hiện hữu cụ thể qua dáng mẹ còng bên hiên nhà. Tình yêu quê hương vì thế bắt nguồn từ những gì gần gũi, thân thương nhất — từ người mẹ, từ mái nhà. Đó là một phát hiện tinh tế và sâu sắc.\nVề nghệ thuật, bài thơ sử dụng thể thơ tự do với nhịp điệu êm ái như lời thủ thỉ; hình ảnh thơ bình dị mà giàu sức gợi; giọng thơ tha thiết, chân thành.\nBài thơ Mẹ và quê hương khép lại nhưng dư âm còn mãi. Tình mẹ và tình quê — hai tình cảm thiêng liêng nhất đời người — đã hòa quyện làm một. Từ đó, bài thơ nhắc nhở mỗi chúng ta: hãy hiếu thảo với mẹ cha và trân trọng quê hương, bởi đó chính là cội nguồn nuôi dưỡng tâm hồn ta.", "points": 0}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nRÁC THẢI NHỰA — HIỂM HỌA CỦA ĐẠI DƯƠNG\n\nMỗi năm, hàng triệu tấn rác thải nhựa đổ ra các đại dương trên thế giới. Những chiếc túi ni lông, chai nhựa, hộp xốp mà chúng ta vứt bỏ hằng ngày đang từng giờ từng phút đầu độc môi trường biển. Theo ước tính của các nhà khoa học, đến giữa thế kỷ này, lượng nhựa trong đại dương có thể nhiều hơn lượng cá nếu con người không thay đổi thói quen.\n\nRác thải nhựa gây hại cho sinh vật biển theo nhiều cách. Rùa biển nhầm túi ni lông là sứa — thức ăn ưa thích của chúng — và chết vì tắc ruột. Chim biển ăn phải mảnh nhựa, chim non chết đói vì dạ dày đầy nhựa mà không có thức ăn. Các rạn san hô bị rác nhựa bao phủ sẽ mắc bệnh cao hơn nhiều lần. Không chỉ vậy, nhựa phân rã thành hạt vi nhựa, đi vào chuỗi thức ăn và cuối cùng quay trở lại bàn ăn của chính con người.\n\nViệt Nam là một trong những quốc gia có lượng rác thải nhựa ra biển lớn, do thói quen sử dụng túi ni lông, đồ nhựa dùng một lần còn phổ biến và hệ thống thu gom, xử lý rác chưa hoàn thiện. Nhiều bãi biển đẹp đang bị rác nhựa làm xấu đi, ảnh hưởng đến du lịch và sinh kế của ngư dân.\n\nTrước thực trạng đó, nhiều giải pháp đã được đưa ra: hạn chế đồ nhựa dùng một lần, phân loại rác tại nguồn, tái chế nhựa, tổ chức các chiến dịch làm sạch bãi biển. Nhiều bạn trẻ đã tiên phong với lối sống ít rác thải: mang túi vải đi chợ, dùng bình nước cá nhân, từ chối ống hút nhựa. Mỗi hành động nhỏ, khi được lan tỏa, sẽ tạo nên sự thay đổi lớn.\n\nBảo vệ đại dương khỏi rác thải nhựa không phải là việc của riêng ai. Đó là trách nhiệm của mỗi chúng ta — vì biển xanh, vì sự sống của muôn loài và vì chính tương lai của con người.\n\nCâu 1. Văn bản trên thuộc kiểu văn bản nào?", "options": ["A. Văn bản thông tin", "B. Văn bản nghị luận", "C. Văn bản tự sự", "D. Văn bản biểu cảm"], "answer": "A", "explain": "Văn bản cung cấp những tri thức khách quan, có số liệu về thực trạng rác thải nhựa ở đại dương và các giải pháp — đó là văn bản thông tin.", "points": 0.5}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nRÁC THẢI NHỰA — HIỂM HỌA CỦA ĐẠI DƯƠNG\n\nMỗi năm, hàng triệu tấn rác thải nhựa đổ ra các đại dương trên thế giới. Những chiếc túi ni lông, chai nhựa, hộp xốp mà chúng ta vứt bỏ hằng ngày đang từng giờ từng phút đầu độc môi trường biển. Theo ước tính của các nhà khoa học, đến giữa thế kỷ này, lượng nhựa trong đại dương có thể nhiều hơn lượng cá nếu con người không thay đổi thói quen.\n\nRác thải nhựa gây hại cho sinh vật biển theo nhiều cách. Rùa biển nhầm túi ni lông là sứa — thức ăn ưa thích của chúng — và chết vì tắc ruột. Chim biển ăn phải mảnh nhựa, chim non chết đói vì dạ dày đầy nhựa mà không có thức ăn. Các rạn san hô bị rác nhựa bao phủ sẽ mắc bệnh cao hơn nhiều lần. Không chỉ vậy, nhựa phân rã thành hạt vi nhựa, đi vào chuỗi thức ăn và cuối cùng quay trở lại bàn ăn của chính con người.\n\nViệt Nam là một trong những quốc gia có lượng rác thải nhựa ra biển lớn, do thói quen sử dụng túi ni lông, đồ nhựa dùng một lần còn phổ biến và hệ thống thu gom, xử lý rác chưa hoàn thiện. Nhiều bãi biển đẹp đang bị rác nhựa làm xấu đi, ảnh hưởng đến du lịch và sinh kế của ngư dân.\n\nTrước thực trạng đó, nhiều giải pháp đã được đưa ra: hạn chế đồ nhựa dùng một lần, phân loại rác tại nguồn, tái chế nhựa, tổ chức các chiến dịch làm sạch bãi biển. Nhiều bạn trẻ đã tiên phong với lối sống ít rác thải: mang túi vải đi chợ, dùng bình nước cá nhân, từ chối ống hút nhựa. Mỗi hành động nhỏ, khi được lan tỏa, sẽ tạo nên sự thay đổi lớn.\n\nBảo vệ đại dương khỏi rác thải nhựa không phải là việc của riêng ai. Đó là trách nhiệm của mỗi chúng ta — vì biển xanh, vì sự sống của muôn loài và vì chính tương lai của con người.\n\nCâu 2. Theo văn bản, rác thải nhựa gây hại cho sinh vật biển như thế nào?", "options": ["A. Làm nước biển mặn hơn", "B. Rùa biển chết vì ăn nhầm túi ni lông, chim biển chết vì ăn phải mảnh nhựa, san hô mắc bệnh khi bị rác bao phủ", "C. Làm cá biển bơi nhanh hơn", "D. Giúp sinh vật biển phát triển tốt hơn"], "answer": "B", "explain": "Văn bản nêu cụ thể: rùa biển nhầm túi ni lông là sứa mà chết; chim biển ăn mảnh nhựa, chim non chết đói; rạn san hô bị rác bao phủ thì mắc bệnh cao hơn nhiều lần.", "points": 0.75}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nRÁC THẢI NHỰA — HIỂM HỌA CỦA ĐẠI DƯƠNG\n\nMỗi năm, hàng triệu tấn rác thải nhựa đổ ra các đại dương trên thế giới. Những chiếc túi ni lông, chai nhựa, hộp xốp mà chúng ta vứt bỏ hằng ngày đang từng giờ từng phút đầu độc môi trường biển. Theo ước tính của các nhà khoa học, đến giữa thế kỷ này, lượng nhựa trong đại dương có thể nhiều hơn lượng cá nếu con người không thay đổi thói quen.\n\nRác thải nhựa gây hại cho sinh vật biển theo nhiều cách. Rùa biển nhầm túi ni lông là sứa — thức ăn ưa thích của chúng — và chết vì tắc ruột. Chim biển ăn phải mảnh nhựa, chim non chết đói vì dạ dày đầy nhựa mà không có thức ăn. Các rạn san hô bị rác nhựa bao phủ sẽ mắc bệnh cao hơn nhiều lần. Không chỉ vậy, nhựa phân rã thành hạt vi nhựa, đi vào chuỗi thức ăn và cuối cùng quay trở lại bàn ăn của chính con người.\n\nViệt Nam là một trong những quốc gia có lượng rác thải nhựa ra biển lớn, do thói quen sử dụng túi ni lông, đồ nhựa dùng một lần còn phổ biến và hệ thống thu gom, xử lý rác chưa hoàn thiện. Nhiều bãi biển đẹp đang bị rác nhựa làm xấu đi, ảnh hưởng đến du lịch và sinh kế của ngư dân.\n\nTrước thực trạng đó, nhiều giải pháp đã được đưa ra: hạn chế đồ nhựa dùng một lần, phân loại rác tại nguồn, tái chế nhựa, tổ chức các chiến dịch làm sạch bãi biển. Nhiều bạn trẻ đã tiên phong với lối sống ít rác thải: mang túi vải đi chợ, dùng bình nước cá nhân, từ chối ống hút nhựa. Mỗi hành động nhỏ, khi được lan tỏa, sẽ tạo nên sự thay đổi lớn.\n\nBảo vệ đại dương khỏi rác thải nhựa không phải là việc của riêng ai. Đó là trách nhiệm của mỗi chúng ta — vì biển xanh, vì sự sống của muôn loài và vì chính tương lai của con người.\n\nCâu 3. Vì sao Việt Nam có lượng rác thải nhựa ra biển lớn?", "options": ["A. Vì Việt Nam không có biển", "B. Vì thói quen dùng túi ni lông, đồ nhựa một lần còn phổ biến và hệ thống thu gom, xử lý rác chưa hoàn thiện", "C. Vì ngư dân cố tình vứt rác xuống biển", "D. Vì Việt Nam không có nhà máy tái chế nào"], "answer": "B", "explain": "Văn bản chỉ rõ hai nguyên nhân: thói quen sử dụng túi ni lông, đồ nhựa dùng một lần còn phổ biến; hệ thống thu gom, xử lý rác chưa hoàn thiện.", "points": 0.75}, {"type": "short", "level": "TH", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nRÁC THẢI NHỰA — HIỂM HỌA CỦA ĐẠI DƯƠNG\n\nMỗi năm, hàng triệu tấn rác thải nhựa đổ ra các đại dương trên thế giới. Những chiếc túi ni lông, chai nhựa, hộp xốp mà chúng ta vứt bỏ hằng ngày đang từng giờ từng phút đầu độc môi trường biển. Theo ước tính của các nhà khoa học, đến giữa thế kỷ này, lượng nhựa trong đại dương có thể nhiều hơn lượng cá nếu con người không thay đổi thói quen.\n\nRác thải nhựa gây hại cho sinh vật biển theo nhiều cách. Rùa biển nhầm túi ni lông là sứa — thức ăn ưa thích của chúng — và chết vì tắc ruột. Chim biển ăn phải mảnh nhựa, chim non chết đói vì dạ dày đầy nhựa mà không có thức ăn. Các rạn san hô bị rác nhựa bao phủ sẽ mắc bệnh cao hơn nhiều lần. Không chỉ vậy, nhựa phân rã thành hạt vi nhựa, đi vào chuỗi thức ăn và cuối cùng quay trở lại bàn ăn của chính con người.\n\nViệt Nam là một trong những quốc gia có lượng rác thải nhựa ra biển lớn, do thói quen sử dụng túi ni lông, đồ nhựa dùng một lần còn phổ biến và hệ thống thu gom, xử lý rác chưa hoàn thiện. Nhiều bãi biển đẹp đang bị rác nhựa làm xấu đi, ảnh hưởng đến du lịch và sinh kế của ngư dân.\n\nTrước thực trạng đó, nhiều giải pháp đã được đưa ra: hạn chế đồ nhựa dùng một lần, phân loại rác tại nguồn, tái chế nhựa, tổ chức các chiến dịch làm sạch bãi biển. Nhiều bạn trẻ đã tiên phong với lối sống ít rác thải: mang túi vải đi chợ, dùng bình nước cá nhân, từ chối ống hút nhựa. Mỗi hành động nhỏ, khi được lan tỏa, sẽ tạo nên sự thay đổi lớn.\n\nBảo vệ đại dương khỏi rác thải nhựa không phải là việc của riêng ai. Đó là trách nhiệm của mỗi chúng ta — vì biển xanh, vì sự sống của muôn loài và vì chính tương lai của con người.\n\nCâu 4. Văn bản đã đề xuất những giải pháp nào để giảm rác thải nhựa? (Trả lời ngắn gọn)", "answer": "Hạn chế đồ nhựa dùng một lần, phân loại rác tại nguồn, tái chế, làm sạch bãi biển, sống ít rác thải", "explain": "Đáp án chấp nhận liệt kê đúng các giải pháp trong văn bản: hạn chế đồ nhựa dùng một lần; phân loại rác tại nguồn; tái chế nhựa; chiến dịch làm sạch bãi biển; lối sống ít rác thải của giới trẻ (túi vải, bình nước cá nhân, từ chối ống hút nhựa).", "points": 1.0}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nRÁC THẢI NHỰA — HIỂM HỌA CỦA ĐẠI DƯƠNG\n\nMỗi năm, hàng triệu tấn rác thải nhựa đổ ra các đại dương trên thế giới. Những chiếc túi ni lông, chai nhựa, hộp xốp mà chúng ta vứt bỏ hằng ngày đang từng giờ từng phút đầu độc môi trường biển. Theo ước tính của các nhà khoa học, đến giữa thế kỷ này, lượng nhựa trong đại dương có thể nhiều hơn lượng cá nếu con người không thay đổi thói quen.\n\nRác thải nhựa gây hại cho sinh vật biển theo nhiều cách. Rùa biển nhầm túi ni lông là sứa — thức ăn ưa thích của chúng — và chết vì tắc ruột. Chim biển ăn phải mảnh nhựa, chim non chết đói vì dạ dày đầy nhựa mà không có thức ăn. Các rạn san hô bị rác nhựa bao phủ sẽ mắc bệnh cao hơn nhiều lần. Không chỉ vậy, nhựa phân rã thành hạt vi nhựa, đi vào chuỗi thức ăn và cuối cùng quay trở lại bàn ăn của chính con người.\n\nViệt Nam là một trong những quốc gia có lượng rác thải nhựa ra biển lớn, do thói quen sử dụng túi ni lông, đồ nhựa dùng một lần còn phổ biến và hệ thống thu gom, xử lý rác chưa hoàn thiện. Nhiều bãi biển đẹp đang bị rác nhựa làm xấu đi, ảnh hưởng đến du lịch và sinh kế của ngư dân.\n\nTrước thực trạng đó, nhiều giải pháp đã được đưa ra: hạn chế đồ nhựa dùng một lần, phân loại rác tại nguồn, tái chế nhựa, tổ chức các chiến dịch làm sạch bãi biển. Nhiều bạn trẻ đã tiên phong với lối sống ít rác thải: mang túi vải đi chợ, dùng bình nước cá nhân, từ chối ống hút nhựa. Mỗi hành động nhỏ, khi được lan tỏa, sẽ tạo nên sự thay đổi lớn.\n\nBảo vệ đại dương khỏi rác thải nhựa không phải là việc của riêng ai. Đó là trách nhiệm của mỗi chúng ta — vì biển xanh, vì sự sống của muôn loài và vì chính tương lai của con người.\n\nCâu 5. Em hãy đề xuất hai việc làm cụ thể của bản thân để góp phần giảm rác thải nhựa. (Trả lời ngắn gọn)", "answer": "Mang túi vải đi chợ và dùng bình nước cá nhân thay chai nhựa", "explain": "Đáp án mở, chấp nhận mọi việc làm cụ thể, khả thi, liên quan đến giảm rác thải nhựa: mang túi vải, dùng bình nước cá nhân, từ chối ống hút nhựa, phân loại rác, tái sử dụng chai lọ, tham gia nhặt rác bãi biển... Yêu cầu: ít nhất hai việc làm cụ thể.", "points": 1.0}, {"type": "essay", "level": "VD", "q": "VIẾT (6,0 điểm)\nCâu 6 (2,0 điểm). Viết đoạn văn nghị luận xã hội khoảng 200 chữ về trách nhiệm của học sinh trong việc bảo vệ môi trường biển.", "explain": "DÀN Ý:\n1. Mở đoạn: biển là tài sản quý giá của đất nước, đang bị đe dọa bởi rác thải nhựa.\n2. Thân đoạn: (a) Trách nhiệm của học sinh: không xả rác bừa bãi, hạn chế đồ nhựa dùng một lần, phân loại rác, tuyên truyền cho mọi người; (b) Ý nghĩa: mỗi hành động nhỏ góp phần giữ biển xanh sạch; (c) Phê phán: thói quen xả rác, thờ ơ của một bộ phận người dân.\n3. Kết đoạn: hãy hành động ngay từ hôm nay vì biển quê hương.\n\nBÀI MẪU:\nBiển là tài sản vô giá của đất nước, là nguồn sống của hàng triệu người dân, nhưng hiện nay biển đang từng ngày bị đe dọa bởi rác thải nhựa. Là học sinh, chúng ta có trách nhiệm góp phần bảo vệ môi trường biển bằng những việc làm cụ thể. Trước hết, hãy tập thói quen không xả rác bừa bãi, nhất là khi đi biển; hạn chế sử dụng túi ni lông, chai nhựa, ống hút nhựa dùng một lần; thay vào đó là túi vải, bình nước cá nhân. Bên cạnh đó, cần phân loại rác tại nguồn và tích cực tham gia các chiến dịch làm sạch bãi biển, đồng thời tuyên truyền để người thân, bạn bè cùng chung tay. Mỗi hành động nhỏ của chúng ta hôm nay sẽ góp phần giữ cho biển mãi xanh, để các loài sinh vật biển được sống an lành và để thế hệ mai sau vẫn được ngắm nhìn những bãi biển đẹp của quê hương. Đáng phê phán là thói quen xả rác bừa bãi, sự thờ ơ của không ít người trước hiểm họa ô nhiễm. Bảo vệ biển chính là bảo vệ tương lai của chúng ta — hãy hành động ngay từ hôm nay.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7 (4,0 điểm). Viết bài văn nghị luận văn học khoảng 600 chữ cảm nhận về bài thơ sau:\n\nDÒNG SÔNG QUÊ\n\nSông quê tôi nước trong văn vắt,\nUốn lượn quanh co giữa cánh đồng.\nTrưa hè nóng, lũ trẻ tắm mát,\nTiếng cười vang vọng cả dòng sông.\n\nSông chở che bao mùa lũ lụt,\nTưới mát đồng xanh lúa trĩu bông.\nSông là mẹ hiền nuôi khôn lớn,\nBao thế hệ cháu con quê tôi.\n\nDẫu đi xa, lòng tôi vẫn nhớ,\nNhớ dòng sông xanh biếc quê nhà.\nSông ơi, xin giữ dòng trong mãi,\nĐể mai sau con cháu ngắm nhìn.", "explain": "DÀN Ý:\nI. Mở bài: giới thiệu bài thơ Dòng sông quê — tình yêu quê hương qua hình ảnh dòng sông.\nII. Thân bài:\n1. Vẻ đẹp của dòng sông: nước trong văn vắt, uốn lượn quanh co — thanh bình, nên thơ; gắn với kỷ niệm tuổi thơ tắm mát, tiếng cười vang vọng.\n2. Vai trò của dòng sông: chở che mùa lũ, tưới mát đồng xanh — nguồn sống của quê hương; được ví như mẹ hiền nuôi khôn lớn bao thế hệ.\n3. Tình cảm của tác giả: nỗi nhớ da diết khi đi xa; lời nhắn gửi xin giữ dòng trong mãi — tình yêu gắn với ý thức bảo vệ môi trường.\n4. Nghệ thuật: thể thơ lục bát biến thể giàu nhạc điệu, hình ảnh chân thực giàu sức gợi, so sánh, giọng thơ tha thiết.\nIII. Kết bài: dòng sông là biểu tượng quê hương; gợi trách nhiệm giữ gìn sông nước sạch đẹp.\n\nBÀI MẪU:\nBài thơ Dòng sông quê là khúc tâm tình mộc mạc mà tha thiết về dòng sông quê hương — nơi gắn bó bao kỷ niệm tuổi thơ và nuôi dưỡng tâm hồn mỗi con người.\nMở đầu bài thơ là vẻ đẹp thanh bình của dòng sông: Sông quê tôi nước trong văn vắt, / Uốn lượn quanh co giữa cánh đồng. Dòng sông hiện lên với vẻ đẹp trong trẻo, hiền hòa, uốn lượn như dải lụa mềm giữa cánh đồng xanh. Gắn với dòng sông là kỷ niệm tuổi thơ tươi đẹp: Trưa hè nóng, lũ trẻ tắm mát, / Tiếng cười vang vọng cả dòng sông. Tiếng cười trẻ thơ vang vọng đã làm cho dòng sông không chỉ là cảnh vật mà trở thành một phần ký ức không thể quên.\nSâu hơn, dòng sông hiện lên với vai trò to lớn đối với quê hương: Sông chở che bao mùa lũ lụt, / Tưới mát đồng xanh lúa trĩu bông. Dòng sông vừa là người bạn đồng hành vừa là nguồn sống, mang phù sa bồi đắp cho đồng ruộng. Tác giả ví sông như mẹ hiền nuôi khôn lớn bao thế hệ cháu con — một so sánh vừa gợi sự chở che vừa gợi lòng biết ơn sâu nặng. Dòng sông vì thế đã vượt lên trên một cảnh vật tự nhiên để trở thành biểu tượng của quê hương, của cội nguồn.\nXuyên suốt bài thơ là tình cảm nhớ thương da diết của người đi xa: Dẫu đi xa, lòng tôi vẫn nhớ, / Nhớ dòng sông xanh biếc quê nhà. Nỗi nhớ ấy lắng lại thành lời nhắn gửi tha thiết: Sông ơi, xin giữ dòng trong mãi, / Để mai sau con cháu ngắm nhìn. Tình yêu quê hương ở đây gắn liền với ý thức bảo vệ môi trường — một thông điệp rất thời sự và nhân văn.\nVề nghệ thuật, bài thơ sử dụng thể thơ giàu nhạc điệu, gần gũi với ca dao; hình ảnh thơ chân thực, giàu sức gợi; phép so sánh sông như mẹ hiền vừa quen thuộc vừa thấm thía; giọng thơ tha thiết, chân thành.\nBài thơ Dòng sông quê khép lại nhưng tình yêu quê hương vẫn lan tỏa. Dòng sông quê không chỉ đẹp ở cảnh sắc mà còn đẹp ở vai trò nuôi dưỡng và ở tình người gắn bó. Từ đó, bài thơ nhắc nhở mỗi chúng ta hãy biết giữ gìn những dòng sông quê mãi trong xanh, bởi đó chính là giữ gìn cội nguồn của mình.", "points": 0}]}]}
