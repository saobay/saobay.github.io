ới lúc bốn giờ, mà đồng hồ đã chỉ bốn giờ hai mươi.\n\nÔng Sáu chạy xe ôm ở bến này đã gần chục năm. Quanh năm, ông chở khách đi khắp thành phố, dành dụm từng đồng gửi về quê nuôi con ăn học. Con gái ông, bé Thảo, năm nay là sinh viên năm thứ hai. Mỗi lần con về, ông đều ra bến đón, dù phòng trọ của hai cha con cách bến chỉ mười lăm phút đi bộ.\n\n\"Ba!\" Tiếng gọi trong trẻo vang lên giữa ồn ào. Thảo chạy ào tới, ba lô nặng trĩu trên vai. Ông Sáu cười, nụ cười làm những nếp nhăn nơi khóe mắt xô lại: \"Về rồi hả con. Đưa ba lô đây ba cầm cho.\"\n\nTrên đường về, Thảo líu lo kể chuyện trường lớp, chuyện bạn bè. Ông Sáu chỉ ừ hử, thỉnh thoảng gật đầu. Đi được nửa đường, trời đổ mưa. Ông Sáu dừng xe, cởi chiếc áo mưa duy nhất khoác lên vai con: \"Con mặc vào kẻo ướt, cảm lạnh.\"\n\n\"Thế ba thì sao?\" Thảo lo lắng hỏi.\n\n\"Ba quen rồi, mưa này ăn thua gì.\" Ông cười, rồi rồ ga đi tiếp. Mưa quất vào mặt rát buốt, nhưng lưng ông bỗng thấy ấm lạ. Thì ra Thảo đã vòng tay ôm chặt lấy ba từ phía sau, đầu tựa vào lưng ông.\n\nVề đến phòng trọ, ông Sáu vội đi nấu nước cho con tắm. Thảo nhìn theo dáng ba lom khom trong gian bếp chật, bỗng thấy sống mũi cay cay. Bao năm qua, ba vẫn thế: ít nói, chỉ biết làm. Những đồng tiền ba gửi về quê, những lần ba ra bến đón con giữa dòng người đông đúc... tất cả đều là tình thương không lời.\n\nTối đó, Thảo lấy trong ba lô ra một chiếc khăn len: \"Con đan tặng ba nè. Ba quàng vào cho ấm.\"\n\nÔng Sáu cầm chiếc khăn, tay run run. Ông quàng lên cổ, cười hiền: \"Ấm quá. Con gái ba khéo tay ghê.\"\n\nNgoài hiên, mưa vẫn rơi. Nhưng trong căn phòng trọ nhỏ, Tết đã về thật rồi — ấm áp như chính chiếc khăn len trên cổ người cha.\n\nCâu 5. Qua văn bản, em rút ra được bài học gì về tình cảm gia đình? (Trả lời ngắn gọn)", "answer": "Trân trọng và hiếu thảo với cha mẹ", "explain": "Đáp án chấp nhận các cách diễn đạt tương đương: biết ơn sự hy sinh thầm lặng của cha mẹ; yêu thương, quan tâm, phụng dưỡng cha mẹ; đừng để đến khi mất đi mới hối tiếc. Cốt lõi: tình cảm gia đình là thiêng liêng, cần được trân trọng bằng hành động cụ thể hằng ngày.", "points": 1.0}, {"type": "essay", "level": "VD", "q": "VIẾT (6,0 điểm)\nCâu 6 (2,0 điểm). Viết đoạn văn nghị luận xã hội khoảng 200 chữ về sự hy sinh thầm lặng của cha mẹ dành cho con cái.", "explain": "DÀN Ý:\n1. Mở đoạn: giới thiệu vấn đề — cha mẹ là người hy sinh thầm lặng nhất đời mỗi con người.\n2. Thân đoạn: (a) Biểu hiện: thức khuya dậy sớm mưu sinh, nhịn ăn nhịn mặc cho con đủ đầy, lo lắng từng bước con đi; (b) Tính chất thầm lặng: không kể công, không đòi hỏi đền đáp; (c) Ý nghĩa: là điểm tựa, là động lực để con trưởng thành; (d) Phê phán lối sống vô tâm, coi sự hy sinh của cha mẹ là hiển nhiên.\n3. Kết đoạn: bài học — biết ơn và hiếu thảo bằng hành động cụ thể.\n\nBÀI MẪU:\nTrong cuộc đời mỗi con người, cha mẹ là những người hy sinh thầm lặng nhiều nhất mà ít khi kể công. Từ miếng cơm manh áo đến con chữ, từ giấc ngủ đến tương lai của con, tất cả đều được đánh đổi bằng mồ hôi, nước mắt và cả tuổi xuân của đấng sinh thành. Sự hy sinh ấy thầm lặng ở chỗ cha mẹ chưa bao giờ đòi hỏi con phải trả ơn; họ chỉ mong con khôn lớn, nên người. Có người cha chạy xe ôm dưới mưa để dành tiền cho con ăn học, có người mẹ nhịn phần ngon nhường con, thức trắng đêm khi con ốm. Tất cả những điều bình dị ấy dệt nên điểm tựa vững chắc để mỗi chúng ta bước vào đời. Thế nhưng, không ít người trẻ hôm nay coi sự chăm lo của cha mẹ là điều hiển nhiên, thậm chí vô tâm, cãi lời, khiến cha mẹ buồn lòng. Đó là điều đáng phê phán. Bởi vậy, bài học lớn nhất là phải biết trân trọng và hiếu thảo với cha mẹ ngay từ hôm nay: một lời hỏi han, một việc làm đỡ đần, một sự cố gắng học tập cũng đủ làm cha mẹ ấm lòng. Đừng để đến khi cha mẹ không còn nữa mới hối tiếc vì những yêu thương chưa kịp nói.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7 (4,0 điểm). Viết bài văn nghị luận văn học khoảng 600 chữ cảm nhận về nhân vật ông Sáu trong truyện ngắn Chuyến xe cuối năm.", "explain": "DÀN Ý:\nI. Mở bài: giới thiệu truyện ngắn và nhân vật ông Sáu — người cha nghèo giàu tình thương.\nII. Thân bài:\n1. Hoàn cảnh: xe ôm ở bến xe gần chục năm, dành dụm nuôi con ăn học — hiện thân của người lao động nghèo lam lũ.\n2. Tính cách, phẩm chất:\n   a. Yêu thương con vô bờ: ra bến đón dù đường gần; cởi áo mưa duy nhất cho con; nấu nước cho con tắm.\n   b. Ít nói, hành động nhiều hơn lời: chỉ ừ hử, cười hiền — tình cảm thể hiện bằng việc làm.\n   c. Giản dị, nhân hậu: nụ cười, cái gật đầu, niềm vui bình dị trước chiếc khăn len của con.\n3. Nghệ thuật xây dựng nhân vật: ngôi kể thứ ba, chi tiết đời thường giàu sức gợi, đối thoại ngắn mà chân thành, kết truyện ấm áp.\nIII. Kết bài: ông Sáu là hình ảnh đẹp của người cha Việt Nam; gợi bài học trân trọng cha mẹ.\n\nBÀI MẪU:\nTrong dòng chảy của văn học viết về tình cảm gia đình, truyện ngắn Chuyến xe cuối năm đã khắc họa thành công hình tượng ông Sáu — một người cha nghèo nhưng giàu tình thương, để lại trong lòng người đọc nhiều xúc động.\nTrước hết, ông Sáu hiện lên với hoàn cảnh đời thường lam lũ. Gần chục năm chạy xe ôm ở bến xe, ông dành dụm từng đồng gửi về quê nuôi con ăn học. Đằng sau dáng vẻ khắc khổ ấy là một trái tim người cha ấm nóng. Mỗi lần con về, dù phòng trọ cách bến chỉ mười lăm phút đi bộ, ông vẫn ra đón. Chi tiết nhỏ mà thấm thía: với ông, được nhìn thấy con bước ra khỏi cổng bến xe là niềm hạnh phúc không gì thay thế được.\nTình yêu thương con của ông Sáu được thể hiện bằng những hành động cụ thể, giản dị. Giữa đường mưa đổ, ông dừng xe cởi chiếc áo mưa duy nhất khoác lên vai con, còn mình thì nói gọn: Ba quen rồi. Về đến phòng trọ, ông vội đi nấu nước cho con tắm. Ông ít nói, chỉ ừ hử, gật đầu khi nghe con kể chuyện trường lớp, nhưng từng việc ông làm đều thấm đẫm yêu thương. Đó là kiểu thương con rất Việt Nam: không phô trương, không lời hoa mỹ, chỉ lặng lẽ hy sinh.\nNghệ thuật xây dựng nhân vật cũng góp phần làm nên sức hấp dẫn. Tác giả chọn ngôi kể thứ ba, để người đọc quan sát ông Sáu một cách khách quan mà vẫn đầy cảm thông. Những chi tiết đời thường như nụ cười làm nếp nhăn xô lại, bàn tay run run cầm chiếc khăn len, dáng lom khom trong gian bếp chật đều giàu sức gợi. Đối thoại ngắn, mộc mạc mà chân thành. Kết truyện khép lại trong không khí ấm áp: Tết đã về trong căn phòng trọ nhỏ, ấm áp như chiếc khăn len trên cổ người cha.\nHình tượng ông Sáu gợi cho mỗi chúng ta bài học sâu sắc: hãy trân trọng những yêu thương thầm lặng của cha mẹ khi còn có thể. Bởi đôi khi, hạnh phúc không ở đâu xa mà ở ngay trong những điều bình dị nhất của cuộc sống hằng ngày.", "points": 0}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMÙA THU QUA PHỐ\n\nThu về trên những mái nhà rêu cũ,\nGió heo may se lạnh buổi tan tầm.\nHàng sấu già nghiêng mình soi bóng nước,\nLá vàng rơi lả tả trước hiên thềm.\n\nPhố cổ ơi, bao mùa thu vẫn thế,\nTiếng rao đêm vang vọng ngõ sâu hun hút.\nBà cụ già ngồi hong tay bên bếp lửa,\nKể chuyện xưa cho lũ trẻ quây quần.\n\nTôi yêu sao mùi hoa sữa nồng nàn,\nYêu gánh hàng rong thơm mùi cốm mới.\nYêu cả những chiều mưa bay lất phất,\nƯớt vai ai trên phố vắng không người.\n\nThu đi qua, để lại trong tôi nhớ,\nNhớ mái đình cong, nhớ giếng nước trong.\nDẫu mai này có đi xa muôn nẻo,\nVẫn mang theo cả một trời thu trong lòng.\n\nCâu 1. Bài thơ trên được viết theo thể thơ nào?", "options": ["A. Thơ lục bát", "B. Thơ thất ngôn bát cú", "C. Thơ tự do", "D. Thơ song thất lục bát"], "answer": "C", "explain": "Bài thơ có số chữ trong mỗi dòng không đều nhau, không gieo vần theo luật cố định của các thể thơ truyền thống — đó là thơ tự do, thể thơ phổ biến của thơ hiện đại.", "points": 0.5}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMÙA THU QUA PHỐ\n\nThu về trên những mái nhà rêu cũ,\nGió heo may se lạnh buổi tan tầm.\nHàng sấu già nghiêng mình soi bóng nước,\nLá vàng rơi lả tả trước hiên thềm.\n\nPhố cổ ơi, bao mùa thu vẫn thế,\nTiếng rao đêm vang vọng ngõ sâu hun hút.\nBà cụ già ngồi hong tay bên bếp lửa,\nKể chuyện xưa cho lũ trẻ quây quần.\n\nTôi yêu sao mùi hoa sữa nồng nàn,\nYêu gánh hàng rong thơm mùi cốm mới.\nYêu cả những chiều mưa bay lất phất,\nƯớt vai ai trên phố vắng không người.\n\nThu đi qua, để lại trong tôi nhớ,\nNhớ mái đình cong, nhớ giếng nước trong.\nDẫu mai này có đi xa muôn nẻo,\nVẫn mang theo cả một trời thu trong lòng.\n\nCâu 2. Phương thức biểu đạt chính của bài thơ là gì?", "options": ["A. Tự sự", "B. Miêu tả", "C. Biểu cảm", "D. Thuyết minh"], "answer": "C", "explain": "Bài thơ bộc lộ trực tiếp tình cảm, cảm xúc của nhân vật trữ tình trước mùa thu của phố cổ (nỗi nhớ, niềm yêu) — đó là phương thức biểu cảm, đặc trưng của thơ trữ tình.", "points": 0.75}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMÙA THU QUA PHỐ\n\nThu về trên những mái nhà rêu cũ,\nGió heo may se lạnh buổi tan tầm.\nHàng sấu già nghiêng mình soi bóng nước,\nLá vàng rơi lả tả trước hiên thềm.\n\nPhố cổ ơi, bao mùa thu vẫn thế,\nTiếng rao đêm vang vọng ngõ sâu hun hút.\nBà cụ già ngồi hong tay bên bếp lửa,\nKể chuyện xưa cho lũ trẻ quây quần.\n\nTôi yêu sao mùi hoa sữa nồng nàn,\nYêu gánh hàng rong thơm mùi cốm mới.\nYêu cả những chiều mưa bay lất phất,\nƯớt vai ai trên phố vắng không người.\n\nThu đi qua, để lại trong tôi nhớ,\nNhớ mái đình cong, nhớ giếng nước trong.\nDẫu mai này có đi xa muôn nẻo,\nVẫn mang theo cả một trời thu trong lòng.\n\nCâu 3. Biện pháp tu từ nào được sử dụng trong hai câu thơ: \"Hàng sấu già nghiêng mình soi bóng nước, / Lá vàng rơi lả tả trước hiên thềm\"?", "options": ["A. Nhân hóa", "B. So sánh", "C. Ẩn dụ", "D. Hoán dụ"], "answer": "A", "explain": "Cụm từ \"nghiêng mình soi bóng nước\" gán cho hàng sấu hành động của con người — đó là phép nhân hóa, làm cho cảnh vật trở nên có hồn, gần gũi.", "points": 0.75}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMÙA THU QUA PHỐ\n\nThu về trên những mái nhà rêu cũ,\nGió heo may se lạnh buổi tan tầm.\nHàng sấu già nghiêng mình soi bóng nước,\nLá vàng rơi lả tả trước hiên thềm.\n\nPhố cổ ơi, bao mùa thu vẫn thế,\nTiếng rao đêm vang vọng ngõ sâu hun hút.\nBà cụ già ngồi hong tay bên bếp lửa,\nKể chuyện xưa cho lũ trẻ quây quần.\n\nTôi yêu sao mùi hoa sữa nồng nàn,\nYêu gánh hàng rong thơm mùi cốm mới.\nYêu cả những chiều mưa bay lất phất,\nƯớt vai ai trên phố vắng không người.\n\nThu đi qua, để lại trong tôi nhớ,\nNhớ mái đình cong, nhớ giếng nước trong.\nDẫu mai này có đi xa muôn nẻo,\nVẫn mang theo cả một trời thu trong lòng.\n\nCâu 4. Hình ảnh trung tâm xuyên suốt bài thơ là gì?", "options": ["A. Người mẹ quê", "B. Mùa thu của phố cổ với những nét đẹp bình dị", "C. Dòng sông quê hương", "D. Người chiến sĩ nơi biên cương"], "answer": "B", "explain": "Từ mái nhà rêu cũ, hàng sấu già, tiếng rao đêm, mùi hoa sữa, gánh cốm... tất cả đều là những nét đẹp bình dị của mùa thu phố cổ — hình ảnh trung tâm thể hiện tình yêu quê hương của tác giả.", "points": 1.0}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nMÙA THU QUA PHỐ\n\nThu về trên những mái nhà rêu cũ,\nGió heo may se lạnh buổi tan tầm.\nHàng sấu già nghiêng mình soi bóng nước,\nLá vàng rơi lả tả trước hiên thềm.\n\nPhố cổ ơi, bao mùa thu vẫn thế,\nTiếng rao đêm vang vọng ngõ sâu hun hút.\nBà cụ già ngồi hong tay bên bếp lửa,\nKể chuyện xưa cho lũ trẻ quây quần.\n\nTôi yêu sao mùi hoa sữa nồng nàn,\nYêu gánh hàng rong thơm mùi cốm mới.\nYêu cả những chiều mưa bay lất phất,\nƯớt vai ai trên phố vắng không người.\n\nThu đi qua, để lại trong tôi nhớ,\nNhớ mái đình cong, nhớ giếng nước trong.\nDẫu mai này có đi xa muôn nẻo,\nVẫn mang theo cả một trời thu trong lòng.\n\nCâu 5. Qua bài thơ, em có suy nghĩ gì về trách nhiệm của thế hệ trẻ trong việc giữ gìn vẻ đẹp của quê hương? (Trả lời ngắn gọn)", "answer": "Giữ gìn và phát huy vẻ đẹp quê hương", "explain": "Đáp án chấp nhận các cách diễn đạt tương đương: có ý thức bảo vệ cảnh quan, giữ gìn bản sắc văn hóa; sống có trách nhiệm với quê hương; kế thừa và phát huy những giá trị tốt đẹp của cha ông. Cốt lõi: tình yêu quê hương phải đi đôi với hành động giữ gìn cụ thể.", "points": 1.0}, {"type": "essay", "level": "VD", "q": "VIẾT (6,0 điểm)\nCâu 6 (2,0 điểm). Viết đoạn văn nghị luận xã hội khoảng 200 chữ về tình yêu quê hương của thế hệ trẻ hôm nay.", "explain": "DÀN Ý:\n1. Mở đoạn: tình yêu quê hương là tình cảm thiêng liêng, là nguồn cội của mỗi con người.\n2. Thân đoạn: (a) Biểu hiện ở người trẻ: tự hào về đất nước, giữ gìn bản sắc văn hóa, học tập để xây dựng quê hương; (b) Mở rộng: yêu quê hương không chỉ là cảm xúc mà còn là hành động — bảo vệ môi trường, giữ gìn di sản; (c) Phê phán: lối sống vô cảm, sính ngoại, quay lưng với quê hương.\n3. Kết đoạn: khẳng định vai trò của tuổi trẻ trong việc viết tiếp trang sử quê hương.\n\nBÀI MẪU:\nTình yêu quê hương là tình cảm thiêng liêng, là mạch nguồn nuôi dưỡng tâm hồn mỗi con người Việt Nam. Với thế hệ trẻ hôm nay, tình yêu ấy không chỉ là niềm tự hào khi nhắc đến hai tiếng quê hương, mà còn phải được thể hiện bằng những hành động cụ thể. Yêu quê hương là biết giữ gìn từng con phố, dòng sông sạch đẹp; là trân trọng những giá trị văn hóa cha ông để lại từ mái đình, tiếng rao đêm đến mùi hoa sữa đầu thu. Yêu quê hương còn là ra sức học tập, rèn luyện để mai này góp phần xây dựng đất nước giàu mạnh. Đáng buồn là vẫn còn một bộ phận người trẻ sống vô cảm, sính ngoại, thờ ơ với những gì thuộc về quê hương, thậm chí có hành vi phá hoại cảnh quan, di sản. Đó là điều cần phê phán. Mỗi người trẻ hãy biến tình yêu quê hương thành động lực sống đẹp, sống có ích, bởi quê hương có giàu đẹp hay không phụ thuộc rất nhiều vào chính thế hệ chúng ta hôm nay.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7 (4,0 điểm). Viết bài văn nghị luận văn học khoảng 600 chữ phân tích vẻ đẹp của mùa thu phố cổ trong bài thơ Mùa thu qua phố.", "explain": "DÀN Ý:\nI. Mở bài: giới thiệu bài thơ, cảm hứng về mùa thu phố cổ.\nII. Thân bài:\n1. Vẻ đẹp thiên nhiên mùa thu: mái nhà rêu cũ, gió heo may, hàng sấu soi bóng, lá vàng, mùi hoa sữa, mưa bay lất phất — vừa cổ kính vừa nên thơ.\n2. Vẻ đẹp đời sống con người: tiếng rao đêm, bà cụ bên bếp lửa kể chuyện xưa, gánh hàng rong mùi cốm mới — bình dị, ấm áp tình người.\n3. Tình cảm của nhân vật trữ tình: yêu, nhớ, gắn bó; dù đi xa vẫn mang theo cả một trời thu — tình yêu quê hương sâu nặng.\n4. Nghệ thuật: thể thơ tự do, hình ảnh giàu sức gợi, nhân hóa, điệp từ yêu, giọng thơ tha thiết.\nIII. Kết bài: bài thơ là khúc ca đẹp về quê hương; gợi nhắc trách nhiệm giữ gìn.\n\nBÀI MẪU:\nMùa thu từ lâu đã là nguồn cảm hứng bất tận của thi ca. Với bài thơ Mùa thu qua phố, tác giả đã vẽ nên một bức tranh thu phố cổ vừa cổ kính, vừa đằm thắm tình người, để lại nhiều dư vị trong lòng người đọc.\nTrước hết, đó là vẻ đẹp của thiên nhiên mùa thu. Thu về trên những mái nhà rêu cũ, cùng làn gió heo may se lạnh buổi tan tầm. Hàng sấu già nghiêng mình soi bóng nước, lá vàng rơi lả tả trước hiên thềm. Mùi hoa sữa nồng nàn, những chiều mưa bay lất phất ướt vai người qua phố... Bằng những hình ảnh giàu sức gợi, tác giả đã tái hiện một mùa thu rất riêng của phố cổ: không rực rỡ, ồn ào mà trầm lắng, dịu dàng, thấm đẫm chất thơ.\nGắn với thiên nhiên ấy là vẻ đẹp bình dị của đời sống con người. Tiếng rao đêm vang vọng ngõ sâu hun hút, bà cụ già ngồi hong tay bên bếp lửa kể chuyện xưa cho lũ trẻ quây quần, gánh hàng rong thơm mùi cốm mới... Tất cả tạo nên một không gian ấm áp tình người, nơi quá khứ và hiện tại giao hòa. Phố cổ không chỉ là cảnh vật mà còn là nơi lưu giữ ký ức, nếp sống của bao thế hệ.\nXuyên suốt bài thơ là tình cảm tha thiết của nhân vật trữ tình. Điệp từ yêu được lặp lại dồn dập: yêu mùi hoa sữa, yêu gánh hàng rong, yêu cả những chiều mưa bay. Tình yêu ấy lắng lại thành nỗi nhớ da diết ở khổ cuối: nhớ mái đình cong, nhớ giếng nước trong, và lời khẳng định dẫu đi xa muôn nẻo vẫn mang theo cả một trời thu trong lòng. Đó chính là tình yêu quê hương sâu nặng, thủy chung.\nVề nghệ thuật, thể thơ tự do giúp cảm xúc tuôn chảy tự nhiên; phép nhân hóa làm cảnh vật có hồn; hình ảnh thơ vừa cụ thể vừa giàu tính biểu tượng. Giọng thơ tha thiết, trầm lắng như một lời thủ thỉ.\nBài thơ khép lại nhưng dư âm còn mãi. Mùa thu phố cổ hiện lên không chỉ đẹp ở cảnh sắc mà đẹp ở tình người, ở nỗi nhớ quê hương tha thiết. Từ đó, bài thơ nhắc nhở mỗi chúng ta, nhất là thế hệ trẻ, hãy biết giữ gìn những vẻ đẹp bình dị mà thiêng liêng của quê hương mình.", "points": 0}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nKHÓI BẾP QUÊ NHÀ\n\nTôi nhớ những buổi chiều quê, khi nắng vừa tắt sau rặng tre, từng làn khói bếp bắt đầu bay lên từ những mái nhà. Khói quyện vào nhau, bảng lảng trên những ngọn cau, rồi tan dần vào khoảng trời chạng vạng. Với lũ trẻ chúng tôi ngày ấy, khói bếp là tín hiệu của bữa cơm chiều sum họp, là mùi thơm của nồi canh cua mẹ nấu, của niêu cá kho thơm phức.\n\nBếp nhà tôi là bếp củi. Mỗi chiều, mẹ ngồi nhóm lửa, tay quạt nan phành phạch. Khói cay xè mắt, mẹ vừa dụi mắt vừa cười: \"Khói bếp quê mình nó thế, cay mà thương.\" Tôi ngồi co ro bên mẹ, nghe tiếng củi nổ lách tách, thấy lòng ấm lạ. Bữa cơm quê đạm bạc mà ngon đến lạ, có lẽ vì được nấu bằng cả tình thương của mẹ.\n\nLớn lên, tôi xa quê đi học, đi làm. Những bữa cơm thành phố đầy đủ sơn hào hải vị mà sao vẫn thấy thiếu một thứ gì đó. Mỗi lần về quê, việc đầu tiên tôi làm là ra sau nhà, ngồi bên bếp củi của mẹ. Nhìn làn khói bay lên, tôi như thấy lại cả tuổi thơ mình: những trưa hè chăn trâu, những chiều mưa nghịch nước, tiếng mẹ gọi về ăn cơm vang khắp xóm.\n\nGiờ đây, nhiều nhà trong làng đã dùng bếp ga, bếp điện. Làn khói bếp thưa dần, có khi cả xóm chẳng còn mấy nhà nổi lửa bằng củi. Tôi bỗng thấy tiếc nuối một điều gì đó rất đỗi thân thương đang dần xa. Khói bếp không chỉ là khói, đó là hồn quê, là ký ức, là nơi để người đi xa tìm về.\n\nChiều nay, đứng trên ban công tầng mười của khu chung cư, nhìn xuống phố xá ồn ào, tôi chợt thèm được nhìn thấy một làn khói bếp quê nhà bay lên trong hoàng hôn...\n\nCâu 1. Văn bản trên thuộc thể loại nào?", "options": ["A. Truyện ngắn", "B. Tùy bút", "C. Thơ", "D. Ký sự"], "answer": "B", "explain": "Văn bản ghi lại cảm xúc, suy nghĩ của tác giả trước hình ảnh khói bếp quê nhà, giọng văn tự do, giàu chất trữ tình — đó là đặc trưng của tùy bút.", "points": 0.5}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nKHÓI BẾP QUÊ NHÀ\n\nTôi nhớ những buổi chiều quê, khi nắng vừa tắt sau rặng tre, từng làn khói bếp bắt đầu bay lên từ những mái nhà. Khói quyện vào nhau, bảng lảng trên những ngọn cau, rồi tan dần vào khoảng trời chạng vạng. Với lũ trẻ chúng tôi ngày ấy, khói bếp là tín hiệu của bữa cơm chiều sum họp, là mùi thơm của nồi canh cua mẹ nấu, của niêu cá kho thơm phức.\n\nBếp nhà tôi là bếp củi. Mỗi chiều, mẹ ngồi nhóm lửa, tay quạt nan phành phạch. Khói cay xè mắt, mẹ vừa dụi mắt vừa cười: \"Khói bếp quê mình nó thế, cay mà thương.\" Tôi ngồi co ro bên mẹ, nghe tiếng củi nổ lách tách, thấy lòng ấm lạ. Bữa cơm quê đạm bạc mà ngon đến lạ, có lẽ vì được nấu bằng cả tình thương của mẹ.\n\nLớn lên, tôi xa quê đi học, đi làm. Những bữa cơm thành phố đầy đủ sơn hào hải vị mà sao vẫn thấy thiếu một thứ gì đó. Mỗi lần về quê, việc đầu tiên tôi làm là ra sau nhà, ngồi bên bếp củi của mẹ. Nhìn làn khói bay lên, tôi như thấy lại cả tuổi thơ mình: những trưa hè chăn trâu, những chiều mưa nghịch nước, tiếng mẹ gọi về ăn cơm vang khắp xóm.\n\nGiờ đây, nhiều nhà trong làng đã dùng bếp ga, bếp điện. Làn khói bếp thưa dần, có khi cả xóm chẳng còn mấy nhà nổi lửa bằng củi. Tôi bỗng thấy tiếc nuối một điều gì đó rất đỗi thân thương đang dần xa. Khói bếp không chỉ là khói, đó là hồn quê, là ký ức, là nơi để người đi xa tìm về.\n\nChiều nay, đứng trên ban công tầng mười của khu chung cư, nhìn xuống phố xá ồn ào, tôi chợt thèm được nhìn thấy một làn khói bếp quê nhà bay lên trong hoàng hôn...\n\nCâu 2. Hình ảnh trung tâm của văn bản là gì?", "options": ["A. Rặng tre làng", "B. Làn khói bếp quê nhà", "C. Nồi canh cua của mẹ", "D. Khu chung cư nơi tác giả sống"], "answer": "B", "explain": "Làn khói bếp xuất hiện xuyên suốt văn bản, gắn với ký ức tuổi thơ, bữa cơm gia đình và nỗi nhớ quê — đó là hình ảnh trung tâm, mang ý nghĩa biểu tượng.", "points": 0.75}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nKHÓI BẾP QUÊ NHÀ\n\nTôi nhớ những buổi chiều quê, khi nắng vừa tắt sau rặng tre, từng làn khói bếp bắt đầu bay lên từ những mái nhà. Khói quyện vào nhau, bảng lảng trên những ngọn cau, rồi tan dần vào khoảng trời chạng vạng. Với lũ trẻ chúng tôi ngày ấy, khói bếp là tín hiệu của bữa cơm chiều sum họp, là mùi thơm của nồi canh cua mẹ nấu, của niêu cá kho thơm phức.\n\nBếp nhà tôi là bếp củi. Mỗi chiều, mẹ ngồi nhóm lửa, tay quạt nan phành phạch. Khói cay xè mắt, mẹ vừa dụi mắt vừa cười: \"Khói bếp quê mình nó thế, cay mà thương.\" Tôi ngồi co ro bên mẹ, nghe tiếng củi nổ lách tách, thấy lòng ấm lạ. Bữa cơm quê đạm bạc mà ngon đến lạ, có lẽ vì được nấu bằng cả tình thương của mẹ.\n\nLớn lên, tôi xa quê đi học, đi làm. Những bữa cơm thành phố đầy đủ sơn hào hải vị mà sao vẫn thấy thiếu một thứ gì đó. Mỗi lần về quê, việc đầu tiên tôi làm là ra sau nhà, ngồi bên bếp củi của mẹ. Nhìn làn khói bay lên, tôi như thấy lại cả tuổi thơ mình: những trưa hè chăn trâu, những chiều mưa nghịch nước, tiếng mẹ gọi về ăn cơm vang khắp xóm.\n\nGiờ đây, nhiều nhà trong làng đã dùng bếp ga, bếp điện. Làn khói bếp thưa dần, có khi cả xóm chẳng còn mấy nhà nổi lửa bằng củi. Tôi bỗng thấy tiếc nuối một điều gì đó rất đỗi thân thương đang dần xa. Khói bếp không chỉ là khói, đó là hồn quê, là ký ức, là nơi để người đi xa tìm về.\n\nChiều nay, đứng trên ban công tầng mười của khu chung cư, nhìn xuống phố xá ồn ào, tôi chợt thèm được nhìn thấy một làn khói bếp quê nhà bay lên trong hoàng hôn...\n\nCâu 3. Câu nói của mẹ \"Khói bếp quê mình nó thế, cay mà thương\" thể hiện điều gì?", "options": ["A. Sự vất vả của người nông dân khi nấu ăn bằng củi", "B. Tình yêu quê hương bình dị, gắn bó máu thịt với những gì thuộc về quê nhà", "C. Nỗi buồn vì cuộc sống quê nghèo khó", "D. Mong muốn đổi sang dùng bếp ga cho đỡ cay mắt"], "answer": "B", "explain": "Câu nói mộc mạc thể hiện thái độ yêu thương, gắn bó với quê hương: dù khói cay mắt vẫn thấy thương — đó là tình cảm bình dị mà sâu nặng của người mẹ quê.", "points": 0.75}, {"type": "short", "level": "TH", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nKHÓI BẾP QUÊ NHÀ\n\nTôi nhớ những buổi chiều quê, khi nắng vừa tắt sau rặng tre, từng làn khói bếp bắt đầu bay lên từ những mái nhà. Khói quyện vào nhau, bảng lảng trên những ngọn cau, rồi tan dần vào khoảng trời chạng vạng. Với lũ trẻ chúng tôi ngày ấy, khói bếp là tín hiệu của bữa cơm chiều sum họp, là mùi thơm của nồi canh cua mẹ nấu, của niêu cá kho thơm phức.\n\nBếp nhà tôi là bếp củi. Mỗi chiều, mẹ ngồi nhóm lửa, tay quạt nan phành phạch. Khói cay xè mắt, mẹ vừa dụi mắt vừa cười: \"Khói bếp quê mình nó thế, cay mà thương.\" Tôi ngồi co ro bên mẹ, nghe tiếng củi nổ lách tách, thấy lòng ấm lạ. Bữa cơm quê đạm bạc mà ngon đến lạ, có lẽ vì được nấu bằng cả tình thương của mẹ.\n\nLớn lên, tôi xa quê đi học, đi làm. Những bữa cơm thành phố đầy đủ sơn hào hải vị mà sao vẫn thấy thiếu một thứ gì đó. Mỗi lần về quê, việc đầu tiên tôi làm là ra sau nhà, ngồi bên bếp củi của mẹ. Nhìn làn khói bay lên, tôi như thấy lại cả tuổi thơ mình: những trưa hè chăn trâu, những chiều mưa nghịch nước, tiếng mẹ gọi về ăn cơm vang khắp xóm.\n\nGiờ đây, nhiều nhà trong làng đã dùng bếp ga, bếp điện. Làn khói bếp thưa dần, có khi cả xóm chẳng còn mấy nhà nổi lửa bằng củi. Tôi bỗng thấy tiếc nuối một điều gì đó rất đỗi thân thương đang dần xa. Khói bếp không chỉ là khói, đó là hồn quê, là ký ức, là nơi để người đi xa tìm về.\n\nChiều nay, đứng trên ban công tầng mười của khu chung cư, nhìn xuống phố xá ồn ào, tôi chợt thèm được nhìn thấy một làn khói bếp quê nhà bay lên trong hoàng hôn...\n\nCâu 4. Theo tác giả, vì sao bữa cơm quê đạm bạc mà ngon đến lạ? (Trả lời ngắn gọn)", "answer": "Vì được nấu bằng tình thương của mẹ", "explain": "Đáp án chấp nhận các cách diễn đạt tương đương: vì có tình thương của mẹ trong đó; vì là cơm của mẹ nấu; vì gắn với tình cảm gia đình. Văn bản viết: có lẽ vì được nấu bằng cả tình thương của mẹ.", "points": 1.0}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nKHÓI BẾP QUÊ NHÀ\n\nTôi nhớ những buổi chiều quê, khi nắng vừa tắt sau rặng tre, từng làn khói bếp bắt đầu bay lên từ những mái nhà. Khói quyện vào nhau, bảng lảng trên những ngọn cau, rồi tan dần vào khoảng trời chạng vạng. Với lũ trẻ chúng tôi ngày ấy, khói bếp là tín hiệu của bữa cơm chiều sum họp, là mùi thơm của nồi canh cua mẹ nấu, của niêu cá kho thơm phức.\n\nBếp nhà tôi là bếp củi. Mỗi chiều, mẹ ngồi nhóm lửa, tay quạt nan phành phạch. Khói cay xè mắt, mẹ vừa dụi mắt vừa cười: \"Khói bếp quê mình nó thế, cay mà thương.\" Tôi ngồi co ro bên mẹ, nghe tiếng củi nổ lách tách, thấy lòng ấm lạ. Bữa cơm quê đạm bạc mà ngon đến lạ, có lẽ vì được nấu bằng cả tình thương của mẹ.\n\nLớn lên, tôi xa quê đi học, đi làm. Những bữa cơm thành phố đầy đủ sơn hào hải vị mà sao vẫn thấy thiếu một thứ gì đó. Mỗi lần về quê, việc đầu tiên tôi làm là ra sau nhà, ngồi bên bếp củi của mẹ. Nhìn làn khói bay lên, tôi như thấy lại cả tuổi thơ mình: những trưa hè chăn trâu, những chiều mưa nghịch nước, tiếng mẹ gọi về ăn cơm vang khắp xóm.\n\nGiờ đây, nhiều nhà trong làng đã dùng bếp ga, bếp điện. Làn khói bếp thưa dần, có khi cả xóm chẳng còn mấy nhà nổi lửa bằng củi. Tôi bỗng thấy tiếc nuối một điều gì đó rất đỗi thân thương đang dần xa. Khói bếp không chỉ là khói, đó là hồn quê, là ký ức, là nơi để người đi xa tìm về.\n\nChiều nay, đứng trên ban công tầng mười của khu chung cư, nhìn xuống phố xá ồn ào, tôi chợt thèm được nhìn thấy một làn khói bếp quê nhà bay lên trong hoàng hôn...\n\nCâu 5. Từ văn bản, em hãy nêu một việc làm cụ thể của thế hệ trẻ để giữ gìn những giá trị văn hóa của quê hương. (Trả lời ngắn gọn)", "answer": "Tìm hiểu, trân trọng và lan tỏa giá trị văn hóa quê hương", "explain": "Đáp án chấp nhận các việc làm cụ thể, hợp lý: ghi chép, chụp ảnh, quay phim về nếp sống quê; tham gia lễ hội truyền thống; không phá hoại di tích; kể cho bạn bè nghe về quê hương; về quê thường xuyên... Miễn là việc làm cụ thể, tích cực, thể hiện ý thức giữ gìn.", "points": 1.0}, {"type": "essay", "level": "VD", "q": "VIẾT (6,0 điểm)\nCâu 6 (2,0 điểm). Viết đoạn văn nghị luận xã hội khoảng 200 chữ về giá trị của ký ức tuổi thơ đối với mỗi con người.", "explain": "DÀN Ý:\n1. Mở đoạn: ký ức tuổi thơ là tài sản tinh thần quý giá của mỗi người.\n2. Thân đoạn: (a) Ký ức tuổi thơ là nơi lưu giữ những gì trong trẻo, hồn nhiên nhất; là điểm tựa tinh thần khi ta mệt mỏi; (b) Gắn con người với quê hương, gia đình, cội nguồn; (c) Mở rộng: trong cuộc sống hiện đại xô bồ, ký ức tuổi thơ giúp ta giữ được sự bình yên trong tâm hồn; (d) Phê phán lối sống lãng quên quá khứ, vô cảm với cội nguồn.\n3. Kết đoạn: hãy trân trọng và giữ gìn ký ức tuổi thơ.\n\nBÀI MẪU:\nKý ức tuổi thơ là tài sản tinh thần vô giá mà mỗi con người mang theo suốt cuộc đời. Đó là những buổi trưa hè chăn trâu cắt cỏ, là làn khói bếp bay lên trong hoàng hôn, là tiếng mẹ gọi về ăn cơm vang khắp xóm nhỏ. Những ký ức trong trẻo ấy không chỉ là niềm vui để nhớ về, mà còn là điểm tựa tinh thần vững chắc mỗi khi ta mệt mỏi giữa dòng đời xô bồ. Ký ức tuổi thơ gắn ta với quê hương, với gia đình, với cội nguồn — nhắc ta nhớ mình là ai, từ đâu đến. Trong xã hội hiện đại đầy áp lực, chính những miền ký ức bình yên ấy giúp tâm hồn ta được vỗ về, được tiếp thêm sức mạnh để bước tiếp. Đáng tiếc, có những người vì mải mê chạy theo vật chất mà lãng quên quá khứ, thờ ơ với quê hương, với cha mẹ. Đó là điều đáng trách. Vì vậy, mỗi chúng ta hãy biết trân trọng ký ức tuổi thơ, bởi đó chính là một phần làm nên con người ta hôm nay.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7 (4,0 điểm). Viết bài văn nghị luận văn học khoảng 600 chữ phân tích hình ảnh làn khói bếp quê nhà trong văn bản Khói bếp quê nhà.", "explain": "DÀN Ý:\nI. Mở bài: giới thiệu văn bản, hình ảnh khói bếp — biểu tượng của hồn quê.\nII. Thân bài:\n1. Khói bếp gắn với ký ức tuổi thơ: tín hiệu bữa cơm sum họp, bếp củi của mẹ, tiếng củi nổ lách tách — bình dị mà ấm áp.\n2. Khói bếp là biểu tượng của tình mẫu tử, của tình yêu quê hương: câu nói cay mà thương của mẹ; bữa cơm ngon vì nấu bằng tình thương.\n3. Khói bếp trong nỗi tiếc nuối trước sự đổi thay: bếp ga, bếp điện thay bếp củi; khói bếp thưa dần — nỗi lo về những giá trị truyền thống đang mai một.\n4. Nghệ thuật: giọng văn trữ tình, hình ảnh giàu sức gợi, chi tiết đời thường, kết cấu hồi tưởng đan xen hiện tại.\nIII. Kết bài: khói bếp là hồn quê; gợi ý thức giữ gìn giá trị truyền thống.\n\nBÀI MẪU:\nTrong văn bản Khói bếp quê nhà, hình ảnh làn khói bếp hiện lên thật bình dị mà giàu sức ám ảnh, trở thành biểu tượng đẹp của hồn quê, của ký ức và tình yêu quê hương.\nTrước hết, khói bếp gắn liền với ký ức tuổi thơ êm đềm của tác giả. Đó là những buổi chiều quê khi nắng vừa tắt sau rặng tre, từng làn khói bay lên từ những mái nhà, bảng lảng trên những ngọn cau. Với lũ trẻ ngày ấy, khói bếp là tín hiệu của bữa cơm chiều sum họp, là mùi thơm của nồi canh cua mẹ nấu. Hình ảnh mẹ ngồi nhóm lửa, tay quạt nan phành phạch, tiếng củi nổ lách tách bên hiên nhà... tất cả hiện lên sống động như một thước phim quay chậm, đong đầy yêu thương.\nSâu hơn, khói bếp trở thành biểu tượng của tình mẫu tử và tình yêu quê hương. Câu nói mộc mạc của mẹ: Khói bếp quê mình nó thế, cay mà thương đã nói hộ tấm lòng gắn bó máu thịt với quê nhà. Bữa cơm quê đạm bạc mà ngon đến lạ, có lẽ vì được nấu bằng cả tình thương của mẹ. Khói bếp vì thế không chỉ là khói, mà là hơi ấm của gia đình, là nơi neo đậu tâm hồn người đi xa.\nCảm động hơn, hình ảnh khói bếp còn chất chứa nỗi tiếc nuối trước sự đổi thay của thời đại. Nhiều nhà trong làng đã dùng bếp ga, bếp điện; làn khói bếp thưa dần. Tác giả bỗng thấy tiếc nuối một điều gì đó rất đỗi thân thương đang dần xa. Đằng sau nỗi tiếc ấy là nỗi lo về những giá trị truyền thống đang mai một giữa nhịp sống hiện đại.\nVề nghệ thuật, tác giả sử dụng giọng văn trữ tình, thủ thỉ như lời tâm sự; hình ảnh khói bếp được miêu tả bằng những chi tiết giàu sức gợi; kết cấu hồi tưởng đan xen hiện tại tạo nên chiều sâu cảm xúc. Khổ kết với hình ảnh tác giả đứng trên ban công tầng mười thèm được nhìn thấy một làn khói bếp quê nhà đã khép lại văn bản bằng một nốt trầm đầy ám ảnh.\nKhói bếp quê nhà, suy cho cùng, chính là hồn quê, là ký ức, là cội nguồn. Văn bản nhắc nhở mỗi chúng ta, nhất là người trẻ, hãy biết trân trọng và giữ gìn những giá trị bình dị mà thiêng liêng ấy, đừng để đến khi mất đi mới ngậm ngùi tiếc nuối.", "points": 0}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nSỐNG CHẬM GIỮA THỜI ĐẠI VỘI VÃ\n\nChúng ta đang sống trong một thời đại mà mọi thứ đều được đo bằng tốc độ. Ăn nhanh, đi nhanh, đọc nhanh, thậm chí yêu cũng nhanh. Chiếc điện thoại thông minh khiến cả thế giới nằm gọn trong lòng bàn tay, nhưng cũng khiến con người ta lúc nào cũng vội vàng, cũng như đang chạy đua với một đối thủ vô hình là thời gian.\n\nVội vã mang lại hiệu quả, điều đó không ai phủ nhận. Nhưng khi sự vội vã trở thành thói quen, thành lối sống, nó bắt đầu lấy đi của chúng ta những điều quý giá. Ta lướt qua bữa cơm gia đình mà không cảm nhận được vị ngon của món mẹ nấu. Ta đi qua con phố quen mà không nhận ra hàng cây đã thay lá. Ta nói chuyện với bạn bè mà mắt vẫn dán vào màn hình điện thoại. Cuộc sống cứ thế trôi qua kẽ tay, để lại một khoảng trống khó gọi tên.\n\nSống chậm không có nghĩa là lười biếng hay tụt hậu. Sống chậm là biết dừng lại đúng lúc để cảm nhận, để suy ngẫm, để thực sự sống chứ không chỉ tồn tại. Đó là khi ta dành trọn vẹn một buổi chiều để trò chuyện với cha mẹ, khi ta đọc một cuốn sách mà không vội lật đến trang cuối, khi ta ngắm hoàng hôn mà không cần phải chụp ảnh khoe lên mạng xã hội.\n\nNhiều nghiên cứu đã chỉ ra rằng những người biết cân bằng nhịp sống, dành thời gian cho bản thân và gia đình thường hạnh phúc hơn, sáng tạo hơn. Bởi hạnh phúc không nằm ở đích đến mà nằm trên từng chặng đường ta đi qua. Một tâm hồn biết chậm lại mới có thể cảm nhận được vẻ đẹp của cuộc sống.\n\nTất nhiên, sống chậm không dễ giữa một xã hội luôn hối thúc. Nó đòi hỏi bản lĩnh để nói không với những cuộc vui vô bổ, để tắt điện thoại trong bữa cơm gia đình, để dám sống theo nhịp điệu của riêng mình. Nhưng đó là sự lựa chọn xứng đáng, bởi cuối cùng, điều ta mang theo khi rời khỏi cuộc đời này không phải là những thành tích vội vã, mà là những khoảnh khắc ta đã thực sự sống hết mình.\n\nCâu 1. Văn bản trên thuộc kiểu văn bản nào?", "options": ["A. Văn bản nghị luận", "B. Văn bản tự sự", "C. Văn bản miêu tả", "D. Văn bản thuyết minh"], "answer": "A", "explain": "Văn bản trình bày quan điểm, dùng lý lẽ và dẫn chứng để bàn về lối sống chậm trong thời đại vội vã — đó là văn bản nghị luận xã hội.", "points": 0.5}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nSỐNG CHẬM GIỮA THỜI ĐẠI VỘI VÃ\n\nChúng ta đang sống trong một thời đại mà mọi thứ đều được đo bằng tốc độ. Ăn nhanh, đi nhanh, đọc nhanh, thậm chí yêu cũng nhanh. Chiếc điện thoại thông minh khiến cả thế giới nằm gọn trong lòng bàn tay, nhưng cũng khiến con người ta lúc nào cũng vội vàng, cũng như đang chạy đua với một đối thủ v  phấn đấu", "B. Sống tụt hậu, tách khỏi xã hội hiện đại", "C. Biết dừng lại đúng lúc để cảm nhận, suy ngẫm và thực sự sống", "D. Sống không cần quan tâm đến thời gian"], "answer": "C", "explain": "Tác giả khẳng định: \"Sống chậm không có nghĩa là lười biếng hay tụt hậu. Sống chậm là biết dừng lại đúng lúc để cảm nhận, để suy ngẫm, để thực sự sống chứ không chỉ tồn tại.\"", "points": 0.75}, {"type": "short", "level": "TH", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nSỐNG CHẬM GIỮA THỜI ĐẠI VỘI VÃ\n\nChúng ta đang sống trong một thời đại mà mọi thứ đều được đo bằng tốc độ. Ăn nhanh, đi nhanh, đọc nhanh, thậm chí yêu cũng nhanh. Chiếc điện thoại thông minh khiến cả thế giới nằm gọn trong lòng bàn tay, nhưng cũng khiến con người ta lúc nào cũng vội vàng, cũng như đang chạy đua với một đối thủ vô hình là thời gian.\n\nVội vã mang lại hiệu quả, điều đó không ai phủ nhận. Nhưng khi sự vội vã trở thành thói quen, thành lối sống, nó bắt đầu lấy đi của chúng ta những điều quý giá. Ta lướt qua bữa cơm gia đình mà không cảm nhận được vị ngon của món mẹ nấu. Ta đi qua con phố quen mà không nhận ra hàng cây đã thay lá. Ta nói chuyện với bạn bè mà mắt vẫn dán vào màn hình điện thoại. Cuộc sống cứ thế trôi qua kẽ tay, để lại một khoảng trống khó gọi tên.\n\nSống chậm không có nghĩa là lười biếng hay tụt hậu. Sống chậm là biết dừng lại đúng lúc để cảm nhận, để suy ngẫm, để thực sự sống chứ không chỉ tồn tại. Đó là khi ta dành trọn vẹn một buổi chiều để trò chuyện với cha mẹ, khi ta đọc một cuốn sách mà không vội lật đến trang cuối, khi ta ngắm hoàng hôn mà không cần phải chụp ảnh khoe lên mạng xã hội.\n\nNhiều nghiên cứu đã chỉ ra rằng những người biết cân bằng nhịp sống, dành thời gian cho bản thân và gia đình thường hạnh phúc hơn, sáng tạo hơn. Bởi hạnh phúc không nằm ở đích đến mà nằm trên từng chặng đường ta đi qua. Một tâm hồn biết chậm lại mới có thể cảm nhận được vẻ đẹp của cuộc sống.\n\nTất nhiên, sống chậm không dễ giữa một xã hội luôn hối thúc. Nó đòi hỏi bản lĩnh để nói không với những cuộc vui vô bổ, để tắt điện thoại trong bữa cơm gia đình, để dám sống theo nhịp điệu của riêng mình. Nhưng đó là sự lựa chọn xứng đáng, bởi cuối cùng, điều ta mang theo khi rời khỏi cuộc đời này không phải là những thành tích vội vã, mà là những khoảnh khắc ta đã thực sự sống hết mình.\n\nCâu 4. Tác giả đã dùng những dẫn chứng nào để chứng minh sự vội vã lấy đi của con người những điều quý giá? (Trả lời ngắn gọn)", "answer": "Lướt qua bữa cơm gia đình, đi qua phố quen không nhận ra cây thay lá, nói chuyện mà mắt dán vào điện thoại", "explain": "Đáp án chấp nhận liệt kê đúng các dẫn chứng trong văn bản: ăn cơm mà không cảm nhận vị ngon của món mẹ nấu; đi qua phố quen không nhận ra hàng cây thay lá; nói chuyện với bạn mà mắt dán vào màn hình điện thoại.", "points": 1.0}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nSỐNG CHẬM GIỮA THỜI ĐẠI VỘI VÃ\n\nChúng ta đang sống trong một thời đại mà mọi thứ đều được đo bằng tốc độ. Ăn nhanh, đi nhanh, đọc nhanh, thậm chí yêu cũng nhanh. Chiếc điện thoại thông minh khiến cả thế giới nằm gọn trong lòng bàn tay, nhưng cũng khiến con người ta lúc nào cũng vội vàng, cũng như đang chạy đua với một đối thủ vô hình là thời gian.\n\nVội vã mang lại hiệu quả, điều đó không ai phủ nhận. Nhưng khi sự vội vã trở thành thói quen, thành lối sống, nó bắt đầu lấy đi của chúng ta những điều quý giá. Ta lướt qua bữa cơm gia đình mà không cảm nhận được vị ngon của món mẹ nấu. Ta đi qua con phố quen mà không nhận ra hàng cây đã thay lá. Ta nói chuyện với bạn bè mà mắt vẫn dán vào màn hình điện thoại. Cuộc sống cứ thế trôi qua kẽ tay, để lại một khoảng trống khó gọi tên.\n\nSống chậm không có nghĩa là lười biếng hay tụt hậu. Sống chậm là biết dừng lại đúng lúc để cảm nhận, để suy ngẫm, để thực sự sống chứ không chỉ tồn tại. Đó là khi ta dành trọn vẹn một buổi chiều để trò chuyện với cha mẹ, khi ta đọc một cuốn sách mà không vội lật đến trang cuối, khi ta ngắm hoàng hôn mà không cần phải chụp ảnh khoe lên mạng xã hội.\n\nNhiều nghiên cứu đã chỉ ra rằng những người biết cân bằng nhịp sống, dành thời gian cho bản thân và gia đình thường hạnh phúc hơn, sáng tạo hơn. Bởi hạnh phúc không nằm ở đích đến mà nằm trên từng chặng đường ta đi qua. Một tâm hồn biết chậm lại mới có thể cảm nhận được vẻ đẹp của cuộc sống.\n\nTất nhiên, sống chậm không dễ giữa một xã hội luôn hối thúc. Nó đòi hỏi bản lĩnh để nói không với những cuộc vui vô bổ, để tắt điện thoại trong bữa cơm gia đình, để dám sống theo nhịp điệu của riêng mình. Nhưng đó là sự lựa chọn xứng đáng, bởi cuối cùng, điều ta mang theo khi rời khỏi cuộc đời này không phải là những thành tích vội vã, mà là những khoảnh khắc ta đã thực sự sống hết mình.\n\nCâu 5. Em có đồng tình với quan điểm sống chậm của tác giả không? Vì sao? (Trả lời ngắn gọn)", "answer": "Đồng tình, vì sống chậm giúp cân bằng, hạnh phúc và cảm nhận trọn vẹn cuộc sống", "explain": "Đáp án mở, chấp nhận cả đồng tình hoặc không đồng tình, miễn là có lý do hợp lý, rõ ràng. Ví dụ đồng tình: sống chậm giúp giảm áp lực, gắn kết gia đình, sống ý nghĩa hơn. Ví dụ không hoàn toàn đồng tình: tuổi trẻ cần tốc độ để nắm bắt cơ hội, quan trọng là cân bằng. Yêu cầu: chính kiến rõ ràng, lập luận thuyết phục.", "points": 1.0}, {"type": "essay", "level": "VD", "q": "VIẾT (6,0 điểm)\nCâu 6 (2,0 điểm). Viết đoạn văn nghị luận xã hội khoảng 200 chữ về ý nghĩa của việc cân bằng giữa học tập và nghỉ ngơi đối với học sinh.", "explain": "DÀN Ý:\n1. Mở đoạn: học tập là nhiệm vụ quan trọng nhưng nghỉ ngơi hợp lý cũng cần thiết không kém.\n2. Thân đoạn: (a) Học quá sức gây căng thẳng, giảm hiệu quả, ảnh hưởng sức khỏe; (b) Nghỉ ngơi hợp lý giúp tái tạo năng lượng, tăng khả năng tiếp thu, nuôi dưỡng cảm xúc; (c) Cân bằng là biểu hiện của lối sống khoa học; (d) Phê phán lối học nhồi nhét hoặc lối chơi bời lêu lổng.\n3. Kết đoạn: học sinh cần sắp xếp thời gian hợp lý để vừa học tốt vừa sống khỏe.\n\nBÀI MẪU:\nĐối với học sinh, học tập là nhiệm vụ hàng đầu, nhưng biết cân bằng giữa học tập và nghỉ ngơi cũng quan trọng không kém. Học tập quá sức, thức khuya triền miên không chỉ làm suy giảm sức khỏe mà còn khiến đầu óc căng thẳng, khả năng tiếp thu giảm sút, thậm chí dẫn đến chán nản, mất động lực. Ngược lại, nghỉ ngơi hợp lý — một giấc ngủ đủ, một buổi chiều chơi thể thao, những phút giây quây quần bên gia đình — chính là cách để tái tạo năng lượng, giúp tinh thần sảng khoái và học tập hiệu quả hơn. Cân bằng giữa học và nghỉ còn là biểu hiện của lối sống khoa học, của người biết yêu quý bản thân. Đáng phê phán là hai thái cực: một bên học nhồi nhét đến kiệt sức, một bên lại lêu lổng, lãng phí thời gian. Vì vậy, mỗi học sinh hãy học cách sắp xếp thời gian hợp lý, để vừa đạt kết quả tốt trong học tập, vừa có một đời sống tinh thần khỏe mạnh, ý nghĩa.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7 (4,0 điểm). Viết bài văn nghị luận văn học khoảng 600 chữ phân tích bài thơ sau:\n\nCHIỀU QUÊ\n\nChiều buông xuống cánh đồng vàng rực rỡ,\nLũy tre làng in bóng xuống mặt ao.\nTiếng sáo diều vi vu trong gió nhẹ,\nĐàn trâu về lững thững bước qua cầu.\n\nMẹ gánh lúa về khi trời vừa tối,\nMồ hôi còn ướt đẫm cả vành khăn.\nCon chạy ra đón mẹ nơi đầu ngõ,\nThương mẹ nhiều, con chẳng nói nên câu.", "explain": "DÀN Ý:\nI. Mở bài: giới thiệu bài thơ Chiều quê — bức tranh quê bình dị và tình mẫu tử.\nII. Thân bài:\n1. Bức tranh chiều quê yên bình: cánh đồng vàng, lũy tre in bóng, sáo diều, đàn trâu qua cầu — vẻ đẹp thanh bình của làng quê Việt Nam.\n2. Hình ảnh người mẹ tần tảo: gánh lúa về khi trời tối, mồ hôi ướt đẫm vành khăn — vẻ đẹp của người phụ nữ nông thôn chịu thương chịu khó.\n3. Tình cảm của người con: chạy ra đón mẹ, thương mẹ chẳng nói nên câu — tình mẫu tử sâu nặng, kín đáo.\n4. Nghệ thuật: thể thơ tám chữ, hình ảnh chân thực giàu sức gợi, ngôn ngữ mộc mạc, giọng thơ tha thiết.\nIII. Kết bài: bài thơ ca ngợi vẻ đẹp quê hương và tình mẫu tử; gợi bài học trân trọng.\n\nBÀI MẪU:\nBài thơ Chiều quê là một bức tranh quê bình dị mà đằm thắm, nơi vẻ đẹp của làng quê hòa quyện cùng tình mẫu tử thiêng liêng, để lại trong lòng người đọc nhiều xúc cảm.\nMở đầu bài thơ là bức tranh chiều quê yên bình, nên thơ. Cánh đồng vàng rực rỡ trong nắng chiều, lũy tre làng in bóng xuống mặt ao phẳng lặng, tiếng sáo diều vi vu trong gió nhẹ, đàn trâu lững thững bước qua cầu sau một ngày đồng áng. Chỉ với bốn câu thơ, tác giả đã vẽ nên một không gian làng quê Việt Nam thật thanh bình, với những hình ảnh thân thuộc đã đi vào tâm thức bao thế hệ. Nhịp thơ chậm rãi, êm đềm như chính nhịp sống của làng quê.\nTrên nền cảnh ấy, hình ảnh người mẹ hiện lên thật cảm động. Mẹ gánh lúa về khi trời vừa tối, mồ hôi còn ướt đẫm cả vành khăn. Chi tiết mồ hôi ướt đẫm vành khăn tuy giản dị mà có sức ám ảnh lớn, khắc họa sự tần tảo, chịu thương chịu khó của người phụ nữ nông thôn. Mẹ không quản nắng mưa, sớm tối, tất cả vì chồng con, vì gia đình. Hình ảnh ấy khiến ta nhớ đến bao bà mẹ Việt Nam lam lũ mà kiên cường.\nCảm động nhất là tình cảm của người con dành cho mẹ. Con chạy ra đón mẹ nơi đầu ngõ — một hành động nhỏ mà chứa chan yêu thương. Và câu thơ kết: Thương mẹ nhiều, con chẳng nói nên câu thật đắt giá. Tình thương lớn đến mức không thể diễn tả thành lời, chỉ có thể lặng im mà cảm nhận. Đó là thứ tình cảm rất Việt Nam: kín đáo, sâu nặng, thể hiện bằng hành động hơn là lời nói.\nVề nghệ thuật, bài thơ sử dụng thể thơ tám chữ với nhịp điệu êm ái; hình ảnh thơ chân thực, giàu sức gợi; ngôn ngữ mộc mạc, gần gũi với lời ăn tiếng nói hằng ngày; giọng thơ tha thiết, chân thành.\nBài thơ Chiều quê khép lại nhưng dư âm còn mãi. Đó không chỉ là khúc ca về vẻ đẹp làng quê mà còn là bài ca về tình mẫu tử thiêng liêng. Từ đó, bài thơ nhắc nhở mỗi chúng ta hãy biết trân trọng những điều bình dị quanh mình và hiếu thảo với cha mẹ khi còn có thể.", "points": 0}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTRÍ TUỆ NHÂN TẠO — BẠN ĐỒNG HÀNH HAY THÁCH THỨC?\n\nTrí tuệ nhân tạo (AI) đang thay đổi thế giới với tốc độ chưa từng có. Từ trợ lý ảo trên điện thoại, xe tự lái, đến những hệ thống chẩn đoán bệnh bằng hình ảnh y khoa, AI đã len lỏi vào hầu hết các lĩnh vực của đời sống. Theo nhiều báo cáo, thị trường AI toàn cầu được dự báo sẽ tiếp tục tăng trưởng mạnh trong những năm tới, trở thành một trong những động lực quan trọng của nền kinh tế số.\n\nTrong giáo dục, AI mở ra nhiều cơ hội mới. Học sinh có thể học tập theo lộ trình cá nhân hóa, được giải đáp thắc mắc mọi lúc mọi nơi, được tiếp cận kho tri thức khổng lồ của nhân loại. Giáo viên cũng được hỗ trợ trong việc soạn bài, chấm bài và theo dõi tiến bộ của từng học sinh. Nhiều trường học đã ứng dụng AI để tạo ra những giờ học sinh động, hấp dẫn hơn.\n\nTuy nhiên, bên cạnh những lợi ích to lớn, AI cũng đặt ra không ít thách thức. Lo ngại lớn nhất là tình trạng lạm dụng: học sinh dùng AI để làm bài tập hộ, viết văn hộ, dần mất đi khả năng tư duy độc lập. Nhiều chuyên gia cảnh báo, nếu phụ thuộc quá mức vào AI, con người sẽ đánh mất kỹ năng quan trọng nhất là kỹ năng suy nghĩ. Bên cạnh đó là những vấn đề về bảo mật thông tin cá nhân, về tin giả do AI tạo ra ngày càng tinh vi, khó phân biệt.\n\nVậy AI là bạn đồng hành hay thách thức? Câu trả lời phụ thuộc vào cách con người sử dụng nó. AI chỉ là công cụ, tốt hay xấu tùy thuộc vào người cầm công cụ ấy. Điều quan trọng là mỗi chúng ta, nhất là thế hệ trẻ, cần trang bị cho mình tư duy phản biện, đạo đức số và khả năng làm chủ công nghệ, để AI thực sự trở thành người bạn đồng hành đáng tin cậy trên con đường phát triển.\n\nCâu 1. Văn bản trên thuộc kiểu văn bản nào?", "options": ["A. Văn bản thông tin", "B. Văn bản nghị luận", "C. Văn bản tự sự", "D. Văn bản miêu tả"], "answer": "A", "explain": "Văn bản cung cấp tri thức khách quan về trí tuệ nhân tạo: khái niệm, ứng dụng, lợi ích và thách thức — đó là văn bản thông tin.", "points": 0.5}, {"type": "mcq", "level": "NB", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTRÍ TUỆ NHÂN TẠO — BẠN ĐỒNG HÀNH HAY THÁCH THỨC?\n\nTrí tuệ nhân tạo (AI) đang thay đổi thế giới với tốc độ chưa từng có. Từ trợ lý ảo trên điện thoại, xe tự lái, đến những hệ thống chẩn đoán bệnh bằng hình ảnh y khoa, AI đã len lỏi vào hầu hết các lĩnh vực của đời sống. Theo nhiều báo cáo, thị trường AI toàn cầu được dự báo sẽ tiếp tục tăng trưởng mạnh trong những năm tới, trở thành một trong những động lực quan trọng của nền kinh tế số.\n\nTrong giáo dục, AI mở ra nhiều cơ hội mới. Học sinh có thể học tập theo lộ trình cá nhân hóa, được giải đáp thắc mắc mọi lúc mọi nơi, được tiếp cận kho tri thức khổng lồ của nhân loại. Giáo viên cũng được hỗ trợ trong việc soạn bài, chấm bài và theo dõi tiến bộ của từng học sinh. Nhiều trường học đã ứng dụng AI để tạo ra những giờ học sinh động, hấp dẫn hơn.\n\nTuy nhiên, bên cạnh những lợi ích to lớn, AI cũng đặt ra không ít thách thức. Lo ngại lớn nhất là tình trạng lạm dụng: học sinh dùng AI để làm bài tập hộ, viết văn hộ, dần mất đi khả năng tư duy độc lập. Nhiều chuyên gia cảnh báo, nếu phụ thuộc quá mức vào AI, con người sẽ đánh mất kỹ năng quan trọng nhất là kỹ năng suy nghĩ. Bên cạnh đó là những vấn đề về bảo mật thông tin cá nhân, về tin giả do AI tạo ra ngày càng tinh vi, khó phân biệt.\n\nVậy AI là bạn đồng hành hay thách thức? Câu trả lời phụ thuộc vào cách con người sử dụng nó. AI chỉ là công cụ, tốt hay xấu tùy thuộc vào người cầm công cụ ấy. Điều quan trọng là mỗi chúng ta, nhất là thế hệ trẻ, cần trang bị cho mình tư duy phản biện, đạo đức số và khả năng làm chủ công nghệ, để AI thực sự trở thành người bạn đồng hành đáng tin cậy trên con đường phát triển.\n\nCâu 2. Theo văn bản, AI đã được ứng dụng trong những lĩnh vực nào?", "options": ["A. Chỉ trong lĩnh vực giải trí", "B. Trợ lý ảo, xe tự lái, chẩn đoán y khoa, giáo dục", "C. Chỉ trong lĩnh vực quân sự", "D. Chỉ trong lĩnh vực tài chính ngân hàng"], "answer": "B", "explain": "Văn bản nêu rõ AI len lỏi vào hầu hết các lĩnh vực: trợ lý ảo trên điện thoại, xe tự lái, chẩn đoán bệnh bằng hình ảnh y khoa và đặc biệt là giáo dục.", "points": 0.75}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTRÍ TUỆ NHÂN TẠO — BẠN ĐỒNG HÀNH HAY THÁCH THỨC?\n\nTrí tuệ nhân tạo (AI) đang thay đổi thế giới với tốc độ chưa từng có. Từ trợ lý ảo trên điện thoại, xe tự lái, đến những hệ thống chẩn đoán bệnh bằng hình ảnh y khoa, AI đã len lỏi vào hầu hết các lĩnh vực của đời sống. Theo nhiều báo cáo, thị trường AI toàn cầu được dự báo sẽ tiếp tục tăng trưởng mạnh trong những năm tới, trở thành một trong những động lực quan trọng của nền kinh tế số.\n\nTrong giáo dục, AI mở ra nhiều cơ hội mới. Học sinh có thể học tập theo lộ trình cá nhân hóa, được giải đáp thắc mắc mọi lúc mọi nơi, được tiếp cận kho tri thức khổng lồ của nhân loại. Giáo viên cũng được hỗ trợ trong việc soạn bài, chấm bài và theo dõi tiến bộ của từng học sinh. Nhiều trường học đã ứng dụng AI để tạo ra những giờ học sinh động, hấp dẫn hơn.\n\nTuy nhiên, bên cạnh những lợi ích to lớn, AI cũng đặt ra không ít thách thức. Lo ngại lớn nhất là tình trạng lạm dụng: học sinh dùng AI để làm bài tập hộ, viết văn hộ, dần mất đi khả năng tư duy độc lập. Nhiều chuyên gia cảnh báo, nếu phụ thuộc quá mức vào AI, con người sẽ đánh mất kỹ năng quan trọng nhất là kỹ năng suy nghĩ. Bên cạnh đó là những vấn đề về bảo mật thông tin cá nhân, về tin giả do AI tạo ra ngày càng tinh vi, khó phân biệt.\n\nVậy AI là bạn đồng hành hay thách thức? Câu trả lời phụ thuộc vào cách con người sử dụng nó. AI chỉ là công cụ, tốt hay xấu tùy thuộc vào người cầm công cụ ấy. Điều quan trọng là mỗi chúng ta, nhất là thế hệ trẻ, cần trang bị cho mình tư duy phản biện, đạo đức số và khả năng làm chủ công nghệ, để AI thực sự trở thành người bạn đồng hành đáng tin cậy trên con đường phát triển.\n\nCâu 3. Thách thức lớn nhất của AI đối với học sinh theo văn bản là gì?", "options": ["A. AI quá đắt tiền, học sinh không mua nổi", "B. Học sinh lạm dụng AI làm bài hộ, dần mất khả năng tư duy độc lập", "C. AI không hỗ trợ được môn Ngữ văn", "D. AI khiến giáo viên mất việc làm"], "answer": "B", "explain": "Văn bản cảnh báo: \"học sinh dùng AI để làm bài tập hộ, viết văn hộ, dần mất đi khả năng tư duy độc lập\" và \"nếu phụ thuộc quá mức vào AI, con người sẽ đánh mất kỹ năng quan trọng nhất là kỹ năng suy nghĩ\".", "points": 0.75}, {"type": "mcq", "level": "TH", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTRÍ TUỆ NHÂN TẠO — BẠN ĐỒNG HÀNH HAY THÁCH THỨC?\n\nTrí tuệ nhân tạo (AI) đang thay đổi thế giới với tốc độ chưa từng có. Từ trợ lý ảo trên điện thoại, xe tự lái, đến những hệ thống chẩn đoán bệnh bằng hình ảnh y khoa, AI đã len lỏi vào hầu hết các lĩnh vực của đời sống. Theo nhiều báo cáo, thị trường AI toàn cầu được dự báo sẽ tiếp tục tăng trưởng mạnh trong những năm tới, trở thành một trong những động lực quan trọng của nền kinh tế số.\n\nTrong giáo dục, AI mở ra nhiều cơ hội mới. Học sinh có thể học tập theo lộ trình cá nhân hóa, được giải đáp thắc mắc mọi lúc mọi nơi, được tiếp cận kho tri thức khổng lồ của nhân loại. Giáo viên cũng được hỗ trợ trong việc soạn bài, chấm bài và theo dõi tiến bộ của từng học sinh. Nhiều trường học đã ứng dụng AI để tạo ra những giờ học sinh động, hấp dẫn hơn.\n\nTuy nhiên, bên cạnh những lợi ích to lớn, AI cũng đặt ra không ít thách thức. Lo ngại lớn nhất là tình trạng lạm dụng: học sinh dùng AI để làm bài tập hộ, viết văn hộ, dần mất đi khả năng tư duy độc lập. Nhiều chuyên gia cảnh báo, nếu phụ thuộc quá mức vào AI, con người sẽ đánh mất kỹ năng quan trọng nhất là kỹ năng suy nghĩ. Bên cạnh đó là những vấn đề về bảo mật thông tin cá nhân, về tin giả do AI tạo ra ngày càng tinh vi, khó phân biệt.\n\nVậy AI là bạn đồng hành hay thách thức? Câu trả lời phụ thuộc vào cách con người sử dụng nó. AI chỉ là công cụ, tốt hay xấu tùy thuộc vào người cầm công cụ ấy. Điều quan trọng là mỗi chúng ta, nhất là thế hệ trẻ, cần trang bị cho mình tư duy phản biện, đạo đức số và khả năng làm chủ công nghệ, để AI thực sự trở thành người bạn đồng hành đáng tin cậy trên con đường phát triển.\n\nCâu 4. Quan điểm của tác giả về AI được thể hiện qua câu nào?", "options": ["A. AI hoàn toàn có hại và cần bị cấm", "B. AI chỉ là công cụ, tốt hay xấu tùy thuộc vào cách con người sử dụng", "C. AI sẽ thay thế hoàn toàn con người trong tương lai", "D. Học sinh không nên sử dụng AI trong học tập"], "answer": "B", "explain": "Tác giả khẳng định: \"AI chỉ là công cụ, tốt hay xấu tùy thuộc vào người cầm công cụ ấy\" — một quan điểm cân bằng, khách quan, không cực đoan.", "points": 1.0}, {"type": "short", "level": "VD", "q": "ĐỌC HIỂU (4,0 điểm)\nĐọc văn bản sau và trả lời các câu hỏi từ Câu 1 đến Câu 5:\n\nTRÍ TUỆ NHÂN TẠO — BẠN ĐỒNG HÀNH HAY THÁCH THỨC?\n\nTrí tuệ nhân tạo (AI) đang thay đổi thế giới với tốc độ chưa từng có. Từ trợ lý ảo trên điện thoại, xe tự lái, đến những hệ thống chẩn đoán bệnh bằng hình ảnh y khoa, AI đã len lỏi vào hầu hết các lĩnh vực của đời sống. Theo nhiều báo cáo, thị trường AI toàn cầu được dự báo sẽ tiếp tục tăng trưởng mạnh trong những năm tới, trở thành một trong những động lực quan trọng của nền kinh tế số.\n\nTrong giáo dục, AI mở ra nhiều cơ hội mới. Học sinh có thể học tập theo lộ trình cá nhân hóa, được giải đáp thắc mắc mọi lúc mọi nơi, được tiếp cận kho tri thức khổng lồ của nhân loại. Giáo viên cũng được hỗ trợ trong việc soạn bài, chấm bài và theo dõi tiến bộ của từng học sinh. Nhiều trường học đã ứng dụng AI để tạo ra những giờ học sinh động, hấp dẫn hơn.\n\nTuy nhiên, bên cạnh những lợi ích to lớn, AI cũng đặt ra không ít thách thức. Lo ngại lớn nhất là tình trạng lạm dụng: học sinh dùng AI để làm bài tập hộ, viết văn hộ, dần mất đi khả năng tư duy độc lập. Nhiều chuyên gia cảnh báo, nếu phụ thuộc quá mức vào AI, con người sẽ đánh mất kỹ năng quan trọng nhất là kỹ năng suy nghĩ. Bên cạnh đó là những vấn đề về bảo mật thông tin cá nhân, về tin giả do AI tạo ra ngày càng tinh vi, khó phân biệt.\n\nVậy AI là bạn đồng hành hay thách thức? Câu trả lời phụ thuộc vào cách con người sử dụng nó. AI chỉ là công cụ, tốt hay xấu tùy thuộc vào người cầm công cụ ấy. Điều quan trọng là mỗi chúng ta, nhất là thế hệ trẻ, cần trang bị cho mình tư duy phản biện, đạo đức số và khả năng làm chủ công nghệ, để AI thực sự trở thành người bạn đồng hành đáng tin cậy trên con đường phát triển.\n\nCâu 5. Theo em, học sinh nên sử dụng AI trong học tập như thế nào cho đúng đắn? (Trả lời ngắn gọn)", "answer": "Dùng AI để hỗ trợ tìm hiểu, gợi ý, không lạm dụng làm thay, luôn tư duy độc lập và kiểm chứng thông tin", "explain": "Đáp án chấp nhận các cách diễn đạt tương đương, thể hiện được ba ý: (1) dùng AI như công cụ hỗ trợ học tập; (2) không để AI làm thay, giữ tư duy độc lập; (3) kiểm chứng thông tin, sử dụng có đạo đức.", "points": 1.0}, {"type": "essay", "level": "VD", "q": "VIẾT (6,0 điểm)\nCâu 6 (2,0 điểm). Viết đoạn văn nghị luận xã hội khoảng 200 chữ về trách nhiệm của thế hệ trẻ trong việc sử dụng công nghệ số một cách văn minh.", "explain": "DÀN Ý:\n1. Mở đoạn: công nghệ số là thành tựu vĩ đại nhưng cần được sử dụng văn minh, có trách nhiệm.\n2. Thân đoạn: (a) Biểu hiện sử dụng văn minh: dùng công nghệ để học tập, sáng tạo, lan tỏa điều tốt đẹp; bảo vệ thông tin cá nhân; (b) Trách nhiệm: không phát tán tin giả, không bắt nạt trên mạng, tôn trọng bản quyền; (c) Phê phán: nghiện mạng xã hội, sống ảo, vô cảm trên không gian mạng.\n3. Kết đoạn: người trẻ làm chủ công nghệ để xây dựng xã hội số tốt đẹp.\n\nBÀI MẪU:\nCông nghệ số đã trở thành một phần không thể thiếu của cuộc sống hiện đại, và thế hệ trẻ — những công dân số — có trách nhiệm sử dụng nó một cách văn minh. Sử dụng văn minh trước hết là biến công nghệ thành công cụ học tập, sáng tạo và lan tỏa những điều tốt đẹp, thay vì sa đà vào những trò tiêu khiển vô bổ. Đó còn là ý thức bảo vệ thông tin cá nhân của mình và tôn trọng quyền riêng tư của người khác; là nói không với tin giả, không tham gia bắt nạt trên mạng, không xâm phạm bản quyền. Đáng buồn là hiện nay vẫn còn không ít bạn trẻ nghiện mạng xã hội, sống ảo, phát ngôn thiếu văn hóa, vô cảm trước nỗi đau của người khác trên không gian mạng. Những hành vi ấy không chỉ làm xấu đi môi trường số mà còn bào mòn nhân cách của chính người trẻ. Vì vậy, mỗi chúng ta hãy trang bị cho mình đạo đức số, tư duy phản biện để làm chủ công nghệ, góp phần xây dựng một xã hội số văn minh, nhân văn.", "points": 0}, {"type": "essay", "level": "VD", "q": "Câu 7 (4,0 điểm). Viết bài văn nghị luận văn học khoảng 600 chữ cảm nhận về bài thơ sau:\n\nLỜI RU CỦA MẸ\n\nÀ ơi, con ngủ cho ngoan,\nMẹ còn gánh nặng lo toan chợ đời.\nÀ ơi, gió thoảng mây trôi,\nRu con bằng cả một đời mẹ yêu.\n\nMai này con lớn khôn nhiều,\nNhớ lời mẹ dặn những điều thảo ngay.\nDù đi khắp bốn phương trời,\nLòng con vẫn nhớ những lời mẹ ru.", "explain": "DÀN Ý:\nI. Mở bài: giới thiệu bài thơ Lời ru của mẹ — khúc hát về tình mẫu tử.\nII. Thân bài:\n1. Hình ảnh người mẹ tần tảo: gánh nặng lo toan chợ đời — hy sinh thầm lặng vì con.\n2. Lời ru chứa chan yêu thương: ru con bằng cả một đời mẹ yêu — tình mẫu tử là tài sản quý nhất mẹ dành cho con.\n3. Lời dặn dò tha thiết: nhớ những điều thảo ngay, dù đi bốn phương trời vẫn nhớ lời mẹ ru — mong con nên người, không quên cội nguồn.\n4. Nghệ thuật: thể lục bát mượt mà, điệp từ à ơi gợi điệu ru, hình ảnh bình dị, giọng thơ tha thiết.\nIII. Kết bài: bài thơ là khúc ca đẹp về tình mẹ; gợi bài học hiếu thảo.\n\nBÀI MẪU:\nBài thơ Lời ru của mẹ là một khúc hát ngọt ngào về tình mẫu tử thiêng liêng, nơi mỗi câu chữ đều thấm đẫm yêu thương của người mẹ dành cho con.\nMở đầu bài thơ là hình ảnh người mẹ tần tảo trong lời ru: À ơi, con ngủ cho ngoan, / Mẹ còn gánh nặng lo toan chợ đời. Gánh nặng chợ đời — chỉ bốn chữ mà gói trọn bao nhọc nhằn mưu sinh của mẹ. Mẹ ru con ngủ nhưng lòng mẹ vẫn canh cánh nỗi lo cơm áo. Hình ảnh ấy khiến ta xúc động: tình mẹ không chỉ là lời ru êm ái mà còn là những hy sinh thầm lặng không tên.\nSâu lắng hơn, lời ru của mẹ là kết tinh của cả một đời yêu thương: À ơi, gió thoảng mây trôi, / Ru con bằng cả một đời mẹ yêu. Mẹ không có vàng bạc để dành cho con, mẹ chỉ có tình yêu — nhưng đó là tài sản quý giá nhất. Lời ru ấy nuôi dưỡng tâm hồn con từ thuở lọt lòng, gieo vào lòng con những hạt mầm của yêu thương.\nKhổ thơ cuối là lời dặn dò tha thiết của mẹ: Mai này con lớn khôn nhiều, / Nhớ lời mẹ dặn những điều thảo ngay. Mẹ mong con khôn lớn nên người, sống thảo hiền, có hiếu. Và lời nhắn nhủ Dù đi khắp bốn phương trời, / Lòng con vẫn nhớ những lời mẹ ru như một sợi dây vô hình níu giữ con với cội nguồn, với quê hương, để dù đi đâu con cũng không quên mình là ai.\nVề nghệ thuật, bài thơ sử dụng thể lục bát truyền thống với nhịp điệu mượt mà như lời ru; điệp từ à ơi gợi âm điệu ru con quen thuộc; hình ảnh thơ bình dị, gần gũi; giọng thơ tha thiết, chân thành.\nLời ru của mẹ khép lại nhưng dư âm còn vang mãi. Bài thơ không chỉ ca ngợi tình mẫu tử thiêng liêng mà còn nhắc nhở mỗi chúng ta: hãy sống xứng đáng với tình yêu và sự hy sinh của mẹ, hãy hiếu thảo khi còn có thể, đừng để lời ru năm xưa chỉ còn là tiếc nuối.", "points": 0}]}]}
