{"sets":[{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Hai quần đảo xa bờ có ý nghĩa chiến lược về kinh tế và quốc phòng của nước ta là","options":["A. Cát Bà và Phú Quốc.","B. Hoàng Sa và Trường Sa.","C. Côn Đảo và Phú Quý.","D. Lý Sơn và Thổ Chu."],"answer":"B","explain":"Hoàng Sa (Đà Nẵng) và Trường Sa (Khánh Hòa) có vị trí chiến lược trên biển Đông.","points":0.25},{"type":"mcq","level":"TH","q":"Vùng thềm lục địa nước ta có ý nghĩa kinh tế lớn nhất về","options":["A. trồng rừng ngập mặn.","B. phát triển du lịch.","C. khai thác dầu khí và hải sản.","D. nuôi trồng thủy sản nước ngọt."],"answer":"C","explain":"Thềm lục địa giàu dầu khí (phía Nam) và là ngư trường khai thác hải sản.","points":0.25},{"type":"mcq","level":"NB","q":"Địa hình bán bình nguyên với các bậc thềm phù sa cổ phân bố chủ yếu ở","options":["A. Tây Bắc.","B. Trường Sơn Bắc.","C. Việt Bắc.","D. Đông Nam Bộ."],"answer":"D","explain":"ĐNB có địa hình bán bình nguyên thoải, bậc thềm phù sa cổ, đất xám bạc màu.","points":0.25},{"type":"mcq","level":"TH","q":"Đặc điểm chung của các đồng bằng ven biển miền Trung là","options":["A. hẹp ngang, bị chia cắt bởi các dãy núi đâm ra biển.","B. rộng lớn, bằng phẳng.","C. được bồi đắp phù sa rất dày.","D. không bị ảnh hưởng của bão."],"answer":"A","explain":"Đồng bằng ven biển miền Trung nhỏ hẹp, phân mảnh do các nhánh núi Trường Sơn đâm ra biển.","points":0.25},{"type":"mcq","level":"NB","q":"Nhiệt độ trung bình năm ở nước ta có xu hướng nào sau đây?","options":["A. Giảm dần từ Bắc vào Nam","B. Tăng dần từ Bắc vào Nam","C. Cao nhất ở miền Bắc","D. Đồng đều khắp cả nước"],"answer":"B","explain":"Càng gần xích đạo, góc nhập xạ càng lớn nên nhiệt độ trung bình năm tăng dần từ Bắc vào Nam.","points":0.25},{"type":"mcq","level":"TH","q":"Nơi khô hạn nhất nước ta là khu vực nào sau đây?","options":["A. Đồng bằng sông Hồng","B. Tây Nguyên","C. Cực Nam Trung Bộ (Ninh Thuận, Bình Thuận)","D. Đông Bắc"],"answer":"C","explain":"Cực Nam Trung Bộ lượng mưa dưới 800 mm/năm, khô hạn nhất cả nước.","points":0.25},{"type":"mcq","level":"NB","q":"Sông nào sau đây có giá trị lớn nhất về thủy điện ở nước ta?","options":["A. Sông Hồng","B. Sông Mê Kông","C. Sông Đồng Nai","D. Sông Đà"],"answer":"D","explain":"Sông Đà có tiềm năng thủy điện lớn nhất với các nhà máy Sơn La, Hòa Bình, Lai Châu.","points":0.25},{"type":"mcq","level":"TH","q":"Hàm lượng phù sa của sông ngòi nước ta lớn chủ yếu do","options":["A. mưa nhiều, tập trung theo mùa trên địa hình dốc.","B. sông ngòi chảy qua vùng đá vôi.","C. thủy triều mạnh.","D. băng tan vào mùa hạ."],"answer":"A","explain":"Mưa lớn tập trung gây xói mòn mạnh, sông ngòi giàu phù sa (sông Hồng nặng phù sa nhất).","points":0.25},{"type":"mcq","level":"NB","q":"Ngư trường trọng điểm nào sau đây nằm ở vùng biển phía Nam?","options":["A. Hải Phòng – Quảng Ninh","B. Cà Mau – Kiên Giang","C. Thanh Hóa – Nghệ An","D. Quảng Bình – Quảng Trị"],"answer":"B","explain":"4 ngư trường lớn: Hải Phòng-Quảng Ninh; Hoàng Sa-Trường Sa; Ninh Thuận-BR-VT; Cà Mau-Kiên Giang.","points":0.25},{"type":"mcq","level":"TH","q":"Hoạt động du lịch biển đảo ở nước ta phát triển mạnh nhất vào mùa nào sau đây?","options":["A. Mùa mưa bão","B. Mùa đông lạnh","C. Mùa khô (mùa hạ)","D. Quanh năm đều như nhau"],"answer":"C","explain":"Mùa khô biển êm, nắng đẹp thuận lợi cho du lịch biển; mùa mưa bão hạn chế.","points":0.25},{"type":"mcq","level":"NB","q":"Vùng có mật độ dân số thấp nhất nước ta là","options":["A. Đồng bằng sông Hồng.","B. Đông Nam Bộ.","C. Đồng bằng sông Cửu Long.","D. Tây Bắc."],"answer":"D","explain":"Tây Bắc địa hình hiểm trở, mật độ chỉ vài chục người/km², thấp nhất cả nước.","points":0.25},{"type":"mcq","level":"TH","q":"Dân số đông và tăng nhanh gây sức ép lớn nhất lên vấn đề nào sau đây ở nước ta?","options":["A. Việc làm, nhà ở và môi trường","B. Diện tích rừng tự nhiên","C. Sản lượng dầu khí","D. Diện tích mặt nước nuôi trồng"],"answer":"A","explain":"Dân số đông tạo sức ép về việc làm, nhà ở đô thị, ô nhiễm môi trường.","points":0.25},{"type":"mcq","level":"NB","q":"Vùng chuyên canh cây công nghiệp cận nhiệt (chè) lớn nhất nước ta là","options":["A. Tây Nguyên.","B. Trung du và miền núi Bắc Bộ.","C. Đông Nam Bộ.","D. Duyên hải Nam Trung Bộ."],"answer":"B","explain":"Chè là cây cận nhiệt, trồng nhiều ở Thái Nguyên, Phú Thọ, Yên Bái, Sơn La.","points":0.25},{"type":"mcq","level":"TH","q":"Mô hình sản xuất nào sau đây mang lại hiệu quả kinh tế cao ở Đồng bằng sông Cửu Long?","options":["A. Độc canh cây lúa quanh năm","B. Chăn nuôi trâu bò quy mô lớn","C. Lúa – tôm, lúa – cá kết hợp","D. Trồng rừng phòng hộ ven biển"],"answer":"C","explain":"Mô hình lúa – tôm, vườn – ao – chuồng thích ứng với xâm nhập mặn, tăng thu nhập.","points":0.25},{"type":"mcq","level":"NB","q":"Ngành công nghiệp nào sau đây được coi là ngành công nghiệp mũi nhọn của Đông Nam Bộ?","options":["A. Khai thác than","B. Luyện kim","C. Đóng tàu","D. Khai thác dầu khí"],"answer":"D","explain":"Dầu khí là ngành mũi nhọn của ĐNB, gắn với trung tâm Vũng Tàu.","points":0.25},{"type":"mcq","level":"TH","q":"Sự phân bố công nghiệp ở nước ta hiện nay có đặc điểm nào sau đây?","options":["A. Tập trung chủ yếu ở Đông Nam Bộ và Đồng bằng sông Hồng.","B. Phân bố đều khắp các vùng.","C. Tập trung ở miền núi.","D. Chỉ phát triển ở ven biển."],"answer":"A","explain":"Công nghiệp tập trung ở hai cực: Đông Nam Bộ và Đồng bằng sông Hồng nhờ vị trí, lao động, hạ tầng.","points":0.25},{"type":"mcq","level":"NB","q":"Cảng biển nước sâu lớn nhất nước ta hiện nay là","options":["A. Hải Phòng.","B. Cái Mép – Thị Vải.","C. Đà Nẵng.","D. Quy Nhơn."],"answer":"B","explain":"Cảng Cái Mép – Thị Vải (Bà Rịa – Vũng Tàu) là cảng nước sâu, đón tàu trọng tải lớn.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu (minh họa) về số lượt khách quốc tế đến Việt Nam (triệu lượt): năm 2019 là 18,0; năm 2023 là 12,6. Nhận xét nào sau đây đúng?","options":["A. Khách quốc tế tăng liên tục qua các năm.","B. Năm 2023 khách quốc tế đã vượt mức năm 2019.","C. Du lịch quốc tế đang trên đà phục hồi sau đại dịch.","D. Du lịch Việt Nam không còn thu hút khách quốc tế."],"answer":"C","explain":"Năm 2023 đạt 12,6 triệu lượt, phục hồi mạnh so với giai đoạn dịch bệnh, hướng tới vượt mức 2019.","points":0.25},{"type":"truefalse","level":"TH","q":"Về địa hình đồi núi nước ta, xét tính đúng, sai của các nhận định sau:","statements":["a) Đồi núi chiếm 3/4 diện tích lãnh thổ.","b) Núi cao trên 2.000 m chỉ phân bố ở Tây Bắc.","c) Địa hình núi bị xâm thực mạnh do mưa nhiều.","d) Đồng bằng chiếm 1/4 diện tích, chủ yếu ở ven biển."],"answer":["T","F","T","T"],"explain":"a, c, d đúng. b sai: núi cao trên 2.000 m còn có ở Trường Sơn (Ngọc Linh 2.598 m).","points":1},{"type":"truefalse","level":"VD","q":"Về cây cà phê ở Tây Nguyên, xét tính đúng, sai của các nhận định sau:","statements":["a) Tây Nguyên chiếm trên 90% diện tích và sản lượng cà phê cả nước.","b) Đắk Lắk là tỉnh trồng cà phê lớn nhất.","c) Cà phê Việt Nam chủ yếu là cà phê chè (arabica).","d) Cà phê là mặt hàng xuất khẩu chủ lực của Việt Nam, đứng thứ hai thế giới."],"answer":["T","T","F","T"],"explain":"Đúng a,b,d; sai c: Việt Nam chủ yếu trồng cà phê vối (robusta).","points":1},{"type":"truefalse","level":"TH","q":"Về công nghiệp điện ở nước ta, xét tính đúng, sai của các nhận định sau:","statements":["a) Thủy điện chiếm tỉ trọng lớn trong cơ cấu sản lượng điện.","b) Nhiệt điện than tập trung ở Đồng bằng sông Hồng và Đông Nam Bộ.","c) Điện gió, điện mặt trời phát triển mạnh ở Nam Trung Bộ và Tây Nguyên.","d) Nước ta đã hoàn toàn tự chủ về điện, không cần nhập khẩu."],"answer":["T","T","T","F"],"explain":"Đúng a,b,c; sai d: vẫn phải nhập khẩu điện giờ cao điểm.","points":1},{"type":"truefalse","level":"VDC","q":"Cho bảng số liệu (minh họa) về tỉ trọng các nhóm hàng xuất khẩu năm 2023 (%): Điện thoại và linh kiện 16,2; Máy vi tính, sản phẩm điện tử 16,1; Dệt may 9,4; Giày dép 5,7; Thủy sản 2,5; Cà phê 1,2. Xét tính đúng, sai của các nhận định sau:","statements":["a) Điện thoại và điện tử là hai nhóm hàng xuất khẩu lớn nhất.","b) Hàng công nghiệp chế biến chiếm ưu thế trong xuất khẩu.","c) Nông, thủy sản vẫn giữ tỉ trọng cao trong xuất khẩu.","d) Cơ cấu hàng xuất khẩu chuyển dịch theo hướng tăng tỉ trọng hàng chế biến."],"answer":["T","T","F","T"],"explain":"Đúng a,b,d; sai c: tỉ trọng nông thủy sản ngày càng giảm.","points":1},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Tỉ trọng các nhóm hàng xuất khẩu năm 2023 (%): điện thoại và linh kiện 16,2; máy vi tính, sản phẩm điện tử 16,1; dệt may 9,4; giày dép 5,7. Tổng tỉ trọng của hai nhóm hàng điện thoại và điện tử là bao nhiêu %?","answer":"32,3","explain":"16,2 + 16,1 = 32,3%.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Số lượt khách quốc tế đến Việt Nam (triệu lượt): năm 2019 là 18,0; năm 2023 là 12,6. Năm 2023, lượng khách quốc tế bằng bao nhiêu % so với năm 2019 (làm tròn đến hàng đơn vị)?","answer":"70","explain":"12,6 ÷ 18,0 × 100 = 70%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Diện tích cà phê năm 2023 (nghìn ha): Tây Nguyên 640; cả nước 709. Tỉ trọng diện tích cà phê của Tây Nguyên chiếm bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"90,3","explain":"Tỉ trọng = 640 ÷ 709 × 100 ≈ 90,3%.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Giá trị sản xuất công nghiệp (nghìn tỉ đồng): năm 2015 là 6.710; năm 2023 là 14.950. Tốc độ tăng trưởng giai đoạn 2015 – 2023 là bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"122,8","explain":"Tốc độ tăng = (14.950 − 6.710) ÷ 6.710 × 100 = 8.240 ÷ 6.710 × 100 ≈ 122,8%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Diện tích rừng trồng (triệu ha): năm 2010 là 3,1; năm 2023 là 4,6. Tốc độ tăng diện tích rừng trồng giai đoạn 2010 – 2023 là bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"48,4","explain":"Tốc độ tăng = (4,6 − 3,1) ÷ 3,1 × 100 = 1,5 ÷ 3,1 × 100 ≈ 48,4%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Sản lượng điện năm 2023 (tỉ kWh): thủy điện 100; tổng sản lượng 280,6. Tỉ trọng sản lượng thủy điện chiếm bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"35,6","explain":"Tỉ trọng = 100 ÷ 280,6 × 100 ≈ 35,6%.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Tỉnh nào sau đây vừa có đường biên giới trên đất liền vừa giáp biển?","options":["A. Lào Cai","B. Sơn La","C. Quảng Ninh","D. Điện Biên"],"answer":"C","explain":"Quảng Ninh giáp Trung Quốc trên đất liền và giáp vịnh Bắc Bộ.","points":0.25},{"type":"mcq","level":"TH","q":"Việc Việt Nam gia nhập ASEAN và các hiệp định thương mại tự do có ý nghĩa lớn nhất là","options":["A. chỉ để giao lưu văn hóa.","B. làm giảm vai trò của nông nghiệp.","C. hạn chế phát triển công nghiệp.","D. mở rộng thị trường xuất nhập khẩu và thu hút đầu tư."],"answer":"D","explain":"Hội nhập mở ra thị trường rộng lớn, thu hút FDI, thúc đẩy chuyển dịch cơ cấu kinh tế.","points":0.25},{"type":"mcq","level":"NB","q":"Dãy núi nào sau đây chạy dọc theo biên giới Việt – Lào ở Bắc Trung Bộ?","options":["A. Trường Sơn Bắc","B. Hoàng Liên Sơn","C. Đông Triều","D. Ngân Sơn"],"answer":"A","explain":"Trường Sơn Bắc chạy dọc biên giới Việt – Lào từ Nghệ An đến Thừa Thiên Huế.","points":0.25},{"type":"mcq","level":"TH","q":"Thế mạnh tự nhiên lớn nhất của Bắc Trung Bộ để phát triển kinh tế là","options":["A. đất phù sa màu mỡ rộng lớn.","B. tài nguyên rừng, khoáng sản và du lịch biển.","C. khí hậu lạnh quanh năm.","D. diện tích đồng bằng rộng."],"answer":"B","explain":"Bắc Trung Bộ hẹp ngang, có rừng, khoáng sản (sắt, crôm, thiếc), bờ biển dài với du lịch.","points":0.25},{"type":"mcq","level":"NB","q":"Gió phơn Tây Nam (gió Lào) gây thời tiết nào sau đây cho vùng Bắc Trung Bộ vào mùa hạ?","options":["A. Lạnh, ẩm","B. Mưa nhiều","C. Nóng, khô","D. Ẩm ướt"],"answer":"C","explain":"Hiệu ứng phơn làm không khí nóng lên, khô đi khi vượt Trường Sơn xuống đồng bằng ven biển.","points":0.25},{"type":"mcq","level":"TH","q":"Vào mùa đông, miền Bắc nước ta thường xuất hiện hiện tượng thời tiết nào sau đây?","options":["A. Nắng nóng kéo dài","B. Bão nhiệt đới","C. Hạn hán gay gắt","D. Rét đậm, rét hại kèm mưa phùn"],"answer":"D","explain":"Gió mùa Đông Bắc gây rét đậm, rét hại; mưa phùn đặc trưng của mùa đông miền Bắc.","points":0.25},{"type":"mcq","level":"NB","q":"Hồ nào sau đây là hồ tự nhiên lớn nhất ở Tây Nguyên, có giá trị về du lịch và thủy điện?","options":["A. Hồ Lắk","B. Hồ Ba Bể","C. Hồ Thác Bà","D. Hồ Dầu Tiếng"],"answer":"A","explain":"Hồ Lắk (Đắk Lắk) là hồ tự nhiên lớn ở Tây Nguyên; Ba Bể ở Bắc Kạn, Thác Bà ở Yên Bái.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị kinh tế lớn nhất của sông ngòi nước ta là","options":["A. chỉ để phát triển du lịch.","B. thủy điện, thủy lợi, giao thông và nuôi trồng thủy sản.","C. chỉ để đánh bắt cá tự nhiên.","D. chỉ để vận chuyển gỗ."],"answer":"B","explain":"Sông ngòi đa giá trị: thủy điện, tưới tiêu, giao thông, thủy sản, du lịch.","points":0.25},{"type":"mcq","level":"NB","q":"Đảo lớn nhất của nước ta là","options":["A. Cát Bà.","B. Côn Đảo.","C. Phú Quốc.","D. Lý Sơn."],"answer":"C","explain":"Phú Quốc (Kiên Giang) diện tích khoảng 589 km², là đảo lớn nhất Việt Nam.","points":0.25},{"type":"mcq","level":"TH","q":"Để phát triển bền vững kinh tế biển, nước ta cần thực hiện giải pháp nào sau đây?","options":["A. Khai thác tối đa mọi nguồn lợi.","B. Chỉ phát triển du lịch biển.","C. Hạn chế đánh bắt xa bờ.","D. Khai thác hợp lí đi đôi với bảo vệ môi trường biển."],"answer":"D","explain":"Phát triển bền vững đòi hỏi khai thác hợp lí, bảo vệ hệ sinh thái và chủ quyền biển đảo.","points":0.25},{"type":"mcq","level":"NB","q":"Vùng có tỉ lệ gia tăng dân số tự nhiên cao nhất nước ta là","options":["A. Trung du và miền núi Bắc Bộ.","B. Đồng bằng sông Hồng.","C. Đông Nam Bộ.","D. Đồng bằng sông Cửu Long."],"answer":"A","explain":"Vùng núi phía Bắc có mức sinh còn cao, tỉ lệ tăng tự nhiên cao nhất cả nước.","points":0.25},{"type":"mcq","level":"TH","q":"Dân số đông của nước ta tạo thuận lợi lớn nhất cho phát triển kinh tế là","options":["A. giảm áp lực về việc làm.","B. nguồn lao động dồi dào và thị trường tiêu thụ rộng lớn.","C. giảm nhu cầu về nhà ở.","D. bảo vệ môi trường tốt hơn."],"answer":"B","explain":"Hơn 100 triệu dân là nguồn lao động và thị trường nội địa rộng lớn.","points":0.25},{"type":"mcq","level":"NB","q":"Vùng trồng chè lớn thứ hai sau Trung du và miền núi Bắc Bộ là","options":["A. Đồng bằng sông Hồng.","B. Đông Nam Bộ.","C. Tây Nguyên.","D. Duyên hải Nam Trung Bộ."],"answer":"C","explain":"Tây Nguyên (Lâm Đồng, Gia Lai) là vùng chè lớn thứ hai với chè búp chất lượng cao.","points":0.25},{"type":"mcq","level":"TH","q":"Xu hướng phát triển nông nghiệp hiện nay ở nước ta là","options":["A. duy trì nông nghiệp tự cấp, tự túc.","B. thu hẹp diện tích cây công nghiệp.","C. giảm sản xuất lương thực.","D. phát triển nông nghiệp hàng hóa, ứng dụng công nghệ cao."],"answer":"D","explain":"Nông nghiệp chuyển sang sản xuất hàng hóa quy mô lớn, công nghệ cao, liên kết chuỗi.","points":0.25},{"type":"mcq","level":"NB","q":"Nhà máy nhiệt điện chạy bằng khí lớn nhất nước ta nằm ở tỉnh nào sau đây?","options":["A. Bà Rịa – Vũng Tàu","B. Quảng Ninh","C. Hải Dương","D. Nghệ An"],"answer":"A","explain":"Cụm nhiệt điện Phú Mỹ (Bà Rịa – Vũng Tàu) chạy bằng khí tự nhiên, công suất lớn nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Ngành công nghiệp nào sau đây phát triển dựa trên lợi thế về nguồn lao động dồi dào, giá rẻ?","options":["A. Luyện kim","B. Dệt – may, da giày, lắp ráp điện tử","C. Khai thác dầu khí","D. Hóa chất cơ bản"],"answer":"B","explain":"Dệt may, da giày, điện tử là các ngành thâm dụng lao động, thu hút FDI lớn.","points":0.25},{"type":"mcq","level":"NB","q":"Di sản văn hóa thế giới nào sau đây thuộc Duyên hải Nam Trung Bộ?","options":["A. Cố đô Huế","B. Hoàng thành Thăng Long","C. Phố cổ Hội An","D. Tràng An"],"answer":"C","explain":"Phố cổ Hội An và Thánh địa Mỹ Sơn (Quảng Nam) là di sản thế giới ở DHNTB.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu (minh họa) về diện tích gieo trồng lúa (triệu ha): năm 2010 là 7,5; năm 2023 là 7,1. Sản lượng lúa năm 2023 đạt 43,6 triệu tấn. Nhận xét nào sau đây đúng?","options":["A. Diện tích lúa tăng nhanh.","B. Sản lượng lúa giảm mạnh.","C. Năng suất lúa dưới 4 tấn/ha.","D. Năng suất lúa bình quân đạt trên 6 tấn/ha."],"answer":"D","explain":"43,6/7,1 đạt khoảng 6,14 tấn/ha; diện tích giảm nhưng năng suất tăng nên sản lượng vẫn cao.","points":0.25},{"type":"truefalse","level":"TH","q":"Về vùng Bắc Trung Bộ, xét tính đúng, sai của các nhận định sau:","statements":["a) Lãnh thổ hẹp ngang, kéo dài theo chiều bắc – nam.","b) Có dãy Trường Sơn Bắc chạy dọc phía tây.","c) Thường chịu ảnh hưởng của gió Tây khô nóng và bão.","d) Là vùng có diện tích trồng lúa lớn nhất cả nước."],"answer":["T","T","T","F"],"explain":"a, b, c đúng: BTB hẹp ngang, có Trường Sơn, chịu gió Lào và bão. d sai: vựa lúa lớn nhất là ĐBSCL.","points":1},{"type":"truefalse","level":"VD","q":"Về ngành lâm nghiệp ở nước ta, xét tính đúng, sai của các nhận định sau:","statements":["a) Diện tích rừng trồng tăng nhanh nhờ chính sách giao đất, giao rừng.","b) Tây Nguyên và Trung du miền núi Bắc Bộ là hai vùng có diện tích rừng lớn nhất.","c) Khai thác gỗ gắn với chế biến tạo việc làm và thu nhập.","d) Rừng phòng hộ ven biển có vai trò chắn sóng, chắn gió bão."],"answer":["T","T","T","T"],"explain":"Cả 4 ý đúng: rừng trồng tăng nhanh; Tây Nguyên và TDMNBB nhiều rừng nhất; rừng phòng hộ chắn sóng, chắn bão.","points":1},{"type":"truefalse","level":"TH","q":"Về thương mại ở nước ta, xét tính đúng, sai của các nhận định sau:","statements":["a) Ngoại thương phát triển nhanh, kim ngạch xuất nhập khẩu tăng liên tục.","b) Trung Quốc là thị trường nhập khẩu lớn nhất của Việt Nam.","c) Hoa Kỳ là thị trường xuất khẩu lớn nhất của Việt Nam.","d) Việt Nam luôn trong tình trạng nhập siêu lớn."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: những năm gần đây Việt Nam thường xuất siêu.","points":1},{"type":"truefalse","level":"VDC","q":"Cho bảng số liệu (minh họa) về cơ cấu lao động theo ngành năm 2023 (%): Nông, lâm nghiệp và thủy sản 26,9; Công nghiệp và xây dựng 33,5; Dịch vụ 39,6. Xét tính đúng, sai của các nhận định sau:","statements":["a) Lao động dịch vụ chiếm tỉ trọng cao nhất.","b) Lao động nông nghiệp vẫn chiếm trên 1/4 tổng số lao động.","c) Cơ cấu lao động chuyển dịch phù hợp với cơ cấu kinh tế.","d) Lao động công nghiệp và xây dựng đã vượt 50%."],"answer":["T","T","T","F"],"explain":"a, b đúng theo số liệu. c đúng: lao động chuyển dần sang công nghiệp – dịch vụ. d sai: mới đạt 33,5%.","points":1},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Năng suất lúa bình quân (tấn/ha): năm 2010 là 5,3; năm 2023 là 6,14. Tốc độ tăng năng suất lúa giai đoạn 2010 – 2023 là bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"15,8","explain":"Tốc độ tăng = (6,14 − 5,3) ÷ 5,3 × 100 = 0,84 ÷ 5,3 × 100 ≈ 15,8%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Tỉ trọng lao động nông, lâm nghiệp và thủy sản: năm 2010 là 48,7%; năm 2023 là 26,9%. Tỉ trọng lao động nông nghiệp đã giảm đi bao nhiêu điểm phần trăm?","answer":"21,8","explain":"48,7 − 26,9 = 21,8 điểm phần trăm.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Giá trị xuất khẩu (tỉ USD): năm 2015 là 162,1; năm 2023 là 354,7. Giá trị xuất khẩu năm 2023 gấp khoảng bao nhiêu lần năm 2015 (làm tròn đến 1 chữ số thập phân)?","answer":"2,2","explain":"354,7 ÷ 162,1 ≈ 2,19, làm tròn thành 2,2 lần.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Tổng mức bán lẻ hàng hóa và doanh thu dịch vụ (nghìn tỉ đồng): năm 2015 là 3.247; năm 2023 là 6.231. Tốc độ tăng trưởng giai đoạn 2015 – 2023 là bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"91,9","explain":"Tốc độ tăng = (6.231 − 3.247) ÷ 3.247 × 100 = 2.984 ÷ 3.247 × 100 ≈ 91,9%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Năm 2023, giá trị nhập khẩu của Việt Nam từ Trung Quốc là 111,6 tỉ USD, tổng giá trị nhập khẩu cả nước là 326,4 tỉ USD. Tỉ trọng nhập khẩu từ Trung Quốc chiếm bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"34,2","explain":"Tỉ trọng = 111,6 ÷ 326,4 × 100 ≈ 34,2%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Diện tích rừng trồng (triệu ha): năm 2010 là 3,1; năm 2023 là 4,6. Diện tích rừng trồng đã tăng thêm bao nhiêu triệu ha?","answer":"1,5","explain":"4,6 − 3,1 = 1,5 triệu ha.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Phần đất liền nước ta kéo dài theo chiều bắc – nam khoảng","options":["A. 3.260 km.","B. 4.550 km.","C. 2.300 km.","D. 1.650 km."],"answer":"D","explain":"Lãnh thổ đất liền kéo dài 1.650 km từ Lũng Cú đến mũi Đất, tạo sự phân hóa thiên nhiên Bắc – Nam.","points":0.25},{"type":"mcq","level":"TH","q":"Lãnh thổ kéo dài theo chiều bắc – nam làm cho thiên nhiên nước ta có đặc điểm nào sau đây?","options":["A. Phân hóa rõ rệt giữa miền Bắc và miền Nam.","B. Đồng nhất trên toàn lãnh thổ.","C. Chỉ có một mùa trong năm.","D. Không chịu ảnh hưởng của gió mùa."],"answer":"A","explain":"Lãnh thổ trải dài 15 vĩ độ tạo nên sự phân hóa khí hậu, sinh vật giữa hai miền.","points":0.25},{"type":"mcq","level":"NB","q":"Cánh cung nào sau đây lớn nhất trong bốn cánh cung của vùng núi Đông Bắc?","options":["A. Ngân Sơn","B. Sông Gâm","C. Bắc Sơn","D. Đông Triều"],"answer":"B","explain":"Bốn cánh cung: Sông Gâm, Ngân Sơn, Bắc Sơn, Đông Triều; cánh cung Sông Gâm lớn nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Hang động đẹp nổi tiếng ở Quảng Bình được hình thành trong điều kiện địa hình nào sau đây?","options":["A. Địa hình đồi núi badan","B. Địa hình đồng bằng phù sa","C. Địa hình cacxtơ trên đá vôi","D. Địa hình cao nguyên đá"],"answer":"C","explain":"Đá vôi bị nước hòa tan tạo hang động (Phong Nha, Thiên Đường) — địa hình cacxtơ.","points":0.25},{"type":"mcq","level":"NB","q":"Loại thiên tai nào sau đây thường xảy ra ở Đồng bằng sông Cửu Long vào mùa khô?","options":["A. Lũ quét","B. Sạt lở đất đồi núi","C. Rét đậm","D. Hạn hán và xâm nhập mặn"],"answer":"D","explain":"Mùa khô, nước biển dâng xâm nhập sâu vào nội đồng gây mặn hóa, thiếu nước ngọt.","points":0.25},{"type":"mcq","level":"TH","q":"Biện pháp nào sau đây thích ứng hiệu quả với xâm nhập mặn ở Đồng bằng sông Cửu Long?","options":["A. Chuyển đổi cơ cấu cây trồng, vật nuôi (lúa – tôm).","B. Mở rộng diện tích trồng lúa 3 vụ.","C. Ngăn hoàn toàn nước biển bằng đê.","D. Bơm nước mặn vào đồng ruộng."],"answer":"A","explain":"Mô hình lúa – tôm, chuyển sang nuôi trồng thủy sản là hướng thích ứng bền vững với biến đổi khí hậu.","points":0.25},{"type":"mcq","level":"NB","q":"Đất xám trên phù sa cổ phân bố chủ yếu ở vùng nào sau đây?","options":["A. Đồng bằng sông Hồng","B. Đông Nam Bộ","C. Tây Nguyên","D. Bắc Trung Bộ"],"answer":"B","explain":"Đất xám bạc màu trên phù sa cổ phân bố ở ĐNB, thích hợp cây công nghiệp lâu năm.","points":0.25},{"type":"mcq","level":"TH","q":"Sự phân hóa theo độ cao của thiên nhiên nước ta thể hiện rõ nhất ở","options":["A. đồng bằng ven biển.","B. các đảo xa bờ.","C. vùng núi Tây Bắc với 3 đai cao.","D. vùng thềm lục địa."],"answer":"C","explain":"Vùng núi cao Tây Bắc có đủ 3 đai: nhiệt đới, cận nhiệt, ôn đới núi cao (trên 2.600 m).","points":0.25},{"type":"mcq","level":"NB","q":"Vùng biển đảo nào sau đây có tiềm năng lớn nhất về khai thác dầu khí?","options":["A. Vịnh Bắc Bộ","B. Vịnh Thái Lan","C. Ven bờ Bắc Trung Bộ","D. Thềm lục địa phía Nam"],"answer":"D","explain":"Các bể trầm tích Cửu Long, Nam Côn Sơn, Malay – Thổ Chu ở thềm lục địa phía Nam giàu dầu khí.","points":0.25},{"type":"mcq","level":"TH","q":"Hoạt động kinh tế nào sau đây sử dụng hợp lí nhất tài nguyên đảo và quần đảo?","options":["A. Phát triển tổng hợp: du lịch, hải sản, giao thông biển.","B. Chỉ khai thác khoáng sản.","C. Chỉ đánh bắt hải sản ven bờ.","D. Di dân ra đảo ồ ạt."],"answer":"A","explain":"Kinh tế đảo phát triển tổng hợp gắn với bảo vệ môi trường và quốc phòng.","points":0.25},{"type":"mcq","level":"NB","q":"Chính sách dân số nào sau đây đang được nước ta thực hiện?","options":["A. Hạn chế tối đa việc sinh con","B. Mỗi cặp vợ chồng nên có hai con","C. Khuyến khích sinh thật nhiều con","D. Không can thiệp vào việc sinh đẻ"],"answer":"B","explain":"Chính sách dân số hiện nay vận động mỗi gia đình có hai con, nâng cao chất lượng dân số.","points":0.25},{"type":"mcq","level":"TH","q":"Chất lượng nguồn lao động nước ta ngày càng được nâng cao thể hiện ở","options":["A. số lượng lao động giảm nhanh.","B. lao động chỉ tập trung ở nông thôn.","C. tỉ lệ lao động qua đào tạo tăng, năng suất lao động tăng.","D. tỉ lệ thất nghiệp tăng cao."],"answer":"C","explain":"Tỉ lệ lao động qua đào tạo đạt khoảng 27% (2023), năng suất lao động cải thiện.","points":0.25},{"type":"mcq","level":"NB","q":"Đối tượng nuôi trồng thủy sản cho giá trị xuất khẩu lớn nhất ở Đồng bằng sông Cửu Long là","options":["A. cá rô phi.","B. ốc hương.","C. cua biển.","D. tôm và cá tra."],"answer":"D","explain":"Tôm sú, tôm thẻ chân trắng và cá tra là hai mặt hàng thủy sản xuất khẩu chủ lực.","points":0.25},{"type":"mcq","level":"TH","q":"Nghề làm muối ở nước ta phát triển mạnh nhất ở vùng nào sau đây?","options":["A. Duyên hải Nam Trung Bộ","B. Đồng bằng sông Hồng","C. Đông Nam Bộ","D. Tây Nguyên"],"answer":"A","explain":"DHNTB nắng nhiều, ít mưa (Ninh Thuận, Bình Thuận) thuận lợi cho nghề muối, nổi tiếng là muối Cà Ná.","points":0.25},{"type":"mcq","level":"NB","q":"Mỏ sắt lớn nhất nước ta nằm ở tỉnh nào sau đây?","options":["A. Quảng Ninh","B. Hà Tĩnh","C. Lào Cai","D. Thái Nguyên"],"answer":"B","explain":"Mỏ sắt Thạch Khê (Hà Tĩnh) có trữ lượng khoảng 544 triệu tấn, lớn nhất cả nước.","points":0.25},{"type":"mcq","level":"TH","q":"Công nghiệp sản xuất hàng tiêu dùng ở nước ta phát triển mạnh chủ yếu dựa vào","options":["A. nguồn vốn đầu tư nước ngoài duy nhất.","B. tài nguyên khoáng sản phong phú.","C. nguồn lao động dồi dào và thị trường tiêu thụ rộng.","D. chính sách cấm nhập khẩu."],"answer":"C","explain":"Hàng tiêu dùng (dệt may, da giày, nhựa...) thâm dụng lao động, phục vụ thị trường 100 triệu dân.","points":0.25},{"type":"mcq","level":"NB","q":"Tuyến đường bộ huyết mạch chạy dọc đất nước, nối Cà Mau với Lạng Sơn là","options":["A. Đường Hồ Chí Minh.","B. Quốc lộ 5.","C. Quốc lộ 51.","D. Quốc lộ 1."],"answer":"D","explain":"Quốc lộ 1 dài 2.301 km từ Lạng Sơn đến Cà Mau, là tuyến giao thông quan trọng nhất.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu (minh họa) về sản lượng cá tra (nghìn tấn): năm 2015 là 1.120, năm 2023 là 1.560. Nhận xét nào sau đây đúng?","options":["A. Sản lượng cá tra tăng khoảng 39% sau 8 năm.","B. Sản lượng cá tra giảm dần.","C. Năm 2023 sản lượng cá tra chưa đạt 1,2 triệu tấn.","D. Nghề nuôi cá tra đang bị thu hẹp."],"answer":"A","explain":"(1.560 – 1.120)/1.120 đạt khoảng 39,3%; cá tra ĐBSCL vẫn là mặt hàng xuất khẩu chủ lực.","points":0.25},{"type":"truefalse","level":"TH","q":"Về sự phân hóa thiên nhiên theo chiều đông – tây ở nước ta, xét tính đúng, sai của các nhận định sau:","statements":["a) Vùng biển và thềm lục địa có thiên nhiên khác vùng đất liền.","b) Từ đông sang tây gồm: vùng biển, đồng bằng, đồi núi.","c) Thiên nhiên vùng đồi núi phía tây khác vùng đồng bằng phía đông.","d) Sự phân hóa đông – tây chỉ thể hiện ở miền Bắc."],"answer":["T","T","T","F"],"explain":"a, b, c đúng: phân hóa đông – tây rõ rệt. d sai: thể hiện trên cả nước, rõ nhất ở Bắc Trung Bộ và Nam Bộ.","points":1},{"type":"truefalse","level":"VD","q":"Về cây cao su ở Đông Nam Bộ, xét tính đúng, sai của các nhận định sau:","statements":["a) Đông Nam Bộ là vùng trồng cao su lớn nhất cả nước.","b) Bình Phước là tỉnh trồng cao su lớn nhất vùng.","c) Cao su là cây công nghiệp lâu năm ưa khí hậu nóng ẩm.","d) Sản phẩm cao su chủ yếu phục vụ tiêu dùng trong nước."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: cao su là mặt hàng xuất khẩu quan trọng.","points":1},{"type":"truefalse","level":"TH","q":"Về các vùng kinh tế trọng điểm ở nước ta, xét tính đúng, sai của các nhận định sau:","statements":["a) Cả nước có 4 vùng kinh tế trọng điểm.","b) Vùng kinh tế trọng điểm phía Nam có quy mô lớn nhất.","c) Vùng kinh tế trọng điểm Bắc Bộ lấy Hà Nội làm trung tâm.","d) Vùng kinh tế trọng điểm miền Trung có trung tâm là thành phố Cần Thơ."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: trung tâm vùng KTTĐ miền Trung là Đà Nẵng – Huế; Cần Thơ là trung tâm vùng KTTĐ ĐBSCL.","points":1},{"type":"truefalse","level":"VDC","q":"Cho bảng số liệu (minh họa) về kim ngạch xuất nhập khẩu (tỉ USD): Xuất khẩu 2015 là 162,1; 2023 là 354,7. Nhập khẩu 2015 là 165,6; 2023 là 326,4. Xét tính đúng, sai của các nhận định sau:","statements":["a) Năm 2015, cán cân thương mại nhập siêu 3,5 tỉ USD.","b) Năm 2023, cán cân thương mại xuất siêu 28,3 tỉ USD.","c) Ngoại thương chuyển từ nhập siêu sang xuất siêu.","d) Kim ngạch nhập khẩu luôn lớn hơn kim ngạch xuất khẩu."],"answer":["T","T","T","F"],"explain":"a đúng: 165,6 – 162,1 = 3,5. b đúng: 354,7 – 326,4 = 28,3. c đúng. d sai: từ 2016 đến nay thường xuất siêu.","points":1},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Sản lượng cá tra (nghìn tấn): năm 2015 là 1.120; năm 2023 là 1.560. Tốc độ tăng sản lượng cá tra giai đoạn 2015 – 2023 là bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"39,3","explain":"Tốc độ tăng = (1.560 − 1.120) ÷ 1.120 × 100 = 440 ÷ 1.120 × 100 ≈ 39,3%.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Diện tích cao su năm 2023 (nghìn ha): Đông Nam Bộ 320; cả nước 910. Tỉ trọng diện tích cao su của Đông Nam Bộ chiếm bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"35,2","explain":"Tỉ trọng = 320 ÷ 910 × 100 ≈ 35,2%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Kim ngạch xuất nhập khẩu của Việt Nam năm 2015 (tỉ USD): xuất khẩu 162,1; nhập khẩu 165,6. Năm 2015, cán cân thương mại nhập siêu bao nhiêu tỉ USD?","answer":"3,5","explain":"165,6 − 162,1 = 3,5 tỉ USD.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Tỉ lệ đô thị hóa của Việt Nam: năm 2010 là 30,5%; năm 2023 là 42,7%. Tỉ lệ đô thị hóa năm 2023 gấp khoảng bao nhiêu lần năm 2010 (làm tròn đến 1 chữ số thập phân)?","answer":"1,4","explain":"42,7 ÷ 30,5 ≈ 1,4 lần.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Diện tích cây ăn quả (triệu ha): năm 2010 là 0,78; năm 2023 là 1,22. Tốc độ tăng diện tích giai đoạn 2010 – 2023 là bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"56,4","explain":"Tốc độ tăng = (1,22 − 0,78) ÷ 0,78 × 100 = 0,44 ÷ 0,78 × 100 ≈ 56,4%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Năm 2023, Đồng bằng sông Cửu Long sản xuất 24,8 triệu tấn lúa với dân số 17,5 triệu người. Bình quân lương thực đầu người của vùng là bao nhiêu kg/người (làm tròn đến hàng đơn vị)?","answer":"1417","explain":"24,8 ÷ 17,5 ≈ 1,417 tấn/người, đổi ra kg được 1.417 kg/người.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Việt Nam nằm ở phía nào của bán đảo Đông Dương?","options":["A. Phía đông","B. Phía tây","C. Phía nam","D. Phía bắc"],"answer":"A","explain":"Việt Nam nằm ở rìa phía đông bán đảo Đông Dương, gần trung tâm Đông Nam Á.","points":0.25},{"type":"mcq","level":"TH","q":"Vị trí nằm trong khu vực Đông Nam Á có ý nghĩa quan trọng nhất đối với Việt Nam là","options":["A. chỉ thuận lợi phát triển nông nghiệp.","B. thuận lợi giao lưu kinh tế, văn hóa với các nước trong khu vực và thế giới.","C. hạn chế thiên tai.","D. tách biệt với thế giới."],"answer":"B","explain":"Vị trí trung tâm Đông Nam Á, trên các tuyến giao thông quốc tế tạo điều kiện hội nhập.","points":0.25},{"type":"mcq","level":"NB","q":"Đồng bằng nào sau đây được hình thành do phù sa sông và biển bồi đắp?","options":["A. Đồng bằng Thanh – Nghệ – Tĩnh","B. Đồng bằng Tuy Hòa","C. Đồng bằng sông Hồng và Đồng bằng sông Cửu Long","D. Đồng bằng Phan Rang"],"answer":"C","explain":"Hai đồng bằng châu thổ lớn do phù sa sông bồi đắp, có đê bao và hệ thống thủy lợi.","points":0.25},{"type":"mcq","level":"TH","q":"Địa hình đồi núi nước ta bị xâm thực mạnh chủ yếu do","options":["A. động đất thường xuyên.","B. núi lửa hoạt động.","C. băng hà bao phủ.","D. mưa nhiều, tập trung theo mùa trên sườn dốc, lớp phủ thực vật bị suy giảm."],"answer":"D","explain":"Mưa lớn tập trung + địa hình dốc + mất rừng gây xói mòn, rửa trôi, sạt lở.","points":0.25},{"type":"mcq","level":"NB","q":"Hiện tượng nào sau đây là biểu hiện của biến đổi khí hậu ở Đồng bằng sông Cửu Long?","options":["A. Nước biển dâng, xâm nhập mặn sâu vào nội đồng","B. Nhiệt độ giảm mạnh","C. Mưa đá thường xuyên","D. Tuyết rơi vào mùa đông"],"answer":"A","explain":"Biến đổi khí hậu làm nước biển dâng, mặn xâm nhập sâu, đe dọa vựa lúa ĐBSCL.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên nhân chủ yếu gây ra lũ lụt ở Đồng bằng sông Hồng là","options":["A. động đất dưới đáy biển.","B. mưa lớn tập trung kết hợp với đê bao và lũ từ thượng nguồn đổ về.","C. triều cường mạnh.","D. vỡ hồ thủy điện duy nhất."],"answer":"B","explain":"Mùa mưa bão, nước sông Hồng dâng cao; hệ thống đê bao vừa chống lũ vừa gây úng khi vỡ đê.","points":0.25},{"type":"mcq","level":"NB","q":"Loại rừng nào sau đây chiếm diện tích lớn nhất ở nước ta hiện nay?","options":["A. Rừng ngập mặn","B. Rừng tre nứa","C. Rừng trồng","D. Rừng phòng hộ đầu nguồn"],"answer":"C","explain":"Rừng trồng (keo, bạch đàn, thông...) tăng nhanh, chiếm tỉ trọng lớn trong tổng diện tích rừng.","points":0.25},{"type":"mcq","level":"TH","q":"Vai trò quan trọng nhất của rừng đầu nguồn là","options":["A. cung cấp gỗ xuất khẩu.","B. phát triển du lịch.","C. mở rộng đất nông nghiệp.","D. điều hòa nguồn nước, hạn chế lũ lụt và xói mòn."],"answer":"D","explain":"Rừng đầu nguồn giữ nước, chống xói mòn, điều tiết dòng chảy cho hạ lưu.","points":0.25},{"type":"mcq","level":"NB","q":"Hoạt động nào sau đây góp phần bảo vệ tài nguyên đất ở vùng đồi núi?","options":["A. Trồng rừng, canh tác nông – lâm kết hợp","B. Đốt rừng làm nương rẫy","C. Canh tác độc canh dài ngày","D. Bỏ hoang đất trống"],"answer":"A","explain":"Nông – lâm kết hợp, phủ xanh đất trống đồi trọc bảo vệ đất, tăng thu nhập.","points":0.25},{"type":"mcq","level":"TH","q":"Việc phát triển các đô thị vệ tinh quanh Hà Nội và TP. Hồ Chí Minh nhằm mục đích nào sau đây?","options":["A. Tăng dân số cho đô thị trung tâm.","B. Giảm sức ép dân số và hạ tầng cho đô thị trung tâm.","C. Hạn chế giao thông liên vùng.","D. Thu hẹp không gian đô thị."],"answer":"B","explain":"Đô thị vệ tinh giãn dân, giảm ùn tắc, ô nhiễm cho đô thị hạt nhân.","points":0.25},{"type":"mcq","level":"NB","q":"Khu vực kinh tế nào sau đây thu hút nhiều lao động nhất ở nước ta hiện nay?","options":["A. Khu vực nhà nước","B. Khu vực có vốn đầu tư nước ngoài","C. Khu vực ngoài nhà nước","D. Khu vực kinh tế tập thể"],"answer":"C","explain":"Khu vực ngoài nhà nước (tư nhân, hộ gia đình) thu hút phần lớn lao động.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu (minh họa) về tỉ lệ thất nghiệp thành thị (%): năm 2020 là 3,89; năm 2023 là 2,76. Nhận xét nào sau đây đúng?","options":["A. Thất nghiệp thành thị tăng nhanh.","B. Năm 2023 thất nghiệp thành thị vượt 4%.","C. Thị trường lao động không phục hồi.","D. Tỉ lệ thất nghiệp thành thị có xu hướng giảm."],"answer":"D","explain":"Tỉ lệ thất nghiệp giảm từ 3,89% xuống 2,76%, phản ánh thị trường lao động phục hồi.","points":0.25},{"type":"mcq","level":"NB","q":"Tỉnh nào sau đây dẫn đầu cả nước về sản lượng lương thực?","options":["A. Kiên Giang","B. Thái Bình","C. Hải Dương","D. Nghệ An"],"answer":"A","explain":"Kiên Giang (ĐBSCL) là tỉnh sản xuất lúa lớn nhất cả nước.","points":0.25},{"type":"mcq","level":"TH","q":"Việc đẩy mạnh thâm canh trong sản xuất lúa ở Đồng bằng sông Hồng nhằm mục đích nào sau đây?","options":["A. Mở rộng diện tích đất trồng lúa.","B. Tăng năng suất và sản lượng trên diện tích đất hạn chế.","C. Giảm chất lượng gạo.","D. Chuyển sang trồng cây công nghiệp."],"answer":"B","explain":"ĐBSH đất chật người đông nên thâm canh tăng vụ, tăng năng suất là hướng chính.","points":0.25},{"type":"mcq","level":"NB","q":"Trung tâm công nghiệp nào sau đây thuộc Duyên hải Nam Trung Bộ?","options":["A. Hải Phòng","B. Cần Thơ","C. Đà Nẵng","D. Biên Hòa"],"answer":"C","explain":"Đà Nẵng là trung tâm công nghiệp lớn nhất DHNTB; Hải Phòng thuộc ĐBSH, Cần Thơ thuộc ĐBSCL.","points":0.25},{"type":"mcq","level":"TH","q":"Ngành công nghiệp nào sau đây có điều kiện phát triển mạnh ở Bắc Trung Bộ?","options":["A. Luyện kim màu","B. Đóng tàu biển","C. Điện tử","D. Sản xuất vật liệu xây dựng (xi măng)"],"answer":"D","explain":"BTB giàu đá vôi, đất sét nên công nghiệp xi măng phát triển (Hoàng Mai, Bỉm Sơn).","points":0.25},{"type":"mcq","level":"NB","q":"Mặt hàng xuất khẩu nào sau đây thuộc nhóm hàng nông, lâm, thủy sản?","options":["A. Gạo","B. Điện thoại","C. Giày dép","D. Máy vi tính"],"answer":"A","explain":"Gạo là nông sản xuất khẩu chủ lực; các mặt hàng còn lại thuộc công nghiệp chế biến.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu (minh họa) về diện tích cà phê (nghìn ha): năm 2010 là 548, năm 2023 là 709. Nhận xét nào sau đây đúng?","options":["A. Diện tích cà phê giảm dần.","B. Diện tích cà phê tăng khoảng 29% sau 13 năm.","C. Năm 2023 diện tích cà phê chưa đạt 600 nghìn ha.","D. Cây cà phê không còn là cây xuất khẩu chủ lực."],"answer":"B","explain":"(709 – 548)/548 đạt khoảng 29,4%; cà phê vẫn là cây công nghiệp xuất khẩu quan trọng.","points":0.25},{"type":"truefalse","level":"TH","q":"Về Đồng bằng sông Hồng, xét tính đúng, sai của các nhận định sau:","statements":["a) Là đồng bằng châu thổ lớn thứ hai cả nước.","b) Đất phù sa màu mỡ, thâm canh lúa cao.","c) Mật độ dân số cao nhất cả nước.","d) Diện tích tự nhiên lớn nhất trong các vùng."],"answer":["T","T","T","F"],"explain":"Đúng a,b,c; sai d: diện tích lớn nhất là TDMNBB.","points":1},{"type":"truefalse","level":"VD","q":"Về phát triển cây ăn quả ở Đồng bằng sông Cửu Long, xét tính đúng, sai của các nhận định sau:","statements":["a) Là vùng trồng cây ăn quả lớn nhất cả nước.","b) Các loại quả chủ lực: xoài, nhãn, chôm chôm, sầu riêng.","c) Cây ăn quả mang lại giá trị kinh tế cao hơn trồng lúa.","d) Sản phẩm cây ăn quả chỉ tiêu thụ trong nước."],"answer":["T","T","T","F"],"explain":"Đúng a,b,c; sai d: nhiều loại quả xuất khẩu mạnh.","points":1},{"type":"truefalse","level":"TH","q":"Về khu công nghiệp ở nước ta, xét tính đúng, sai của các nhận định sau:","statements":["a) Tập trung nhiều nhất ở Đông Nam Bộ.","b) Thu hút vốn đầu tư trong và ngoài nước.","c) Gắn với các đô thị và đầu mối giao thông.","d) Chỉ phát triển ở vùng đồng bằng."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: khu công nghiệp còn phát triển ở trung du, miền núi (ví dụ ở Bắc Giang, Phú Thọ).","points":1},{"type":"truefalse","level":"VDC","q":"Cho bảng số liệu (minh họa): Tổng mức bán lẻ hàng hóa và doanh thu dịch vụ (nghìn tỉ đồng): năm 2015 là 3.247, năm 2023 là 6.231. Xét tính đúng, sai của các nhận định sau:","statements":["a) Quy mô thị trường nội địa tăng gần gấp đôi sau 8 năm.","b) Sức mua của dân cư ngày càng tăng.","c) Thương mại nội địa phát triển nhanh cùng với đời sống nâng cao.","d) Thị trường nội địa không còn vai trò quan trọng."],"answer":["T","T","T","F"],"explain":"a đúng: 6.231/3.247 đạt khoảng 1,92 lần. b, c đúng. d sai: thị trường 100 triệu dân là động lực tăng trưởng quan trọng.","points":1},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Tỉ lệ thất nghiệp thành thị của Việt Nam (%): năm 2020 là 3,89; năm 2023 là 2,76. Tỉ lệ thất nghiệp thành thị đã giảm đi bao nhiêu điểm phần trăm?","answer":"1,13","explain":"3,89 − 2,76 = 1,13 điểm phần trăm.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Diện tích cà phê (nghìn ha): năm 2010 là 548; năm 2023 là 709. Tốc độ tăng diện tích cà phê giai đoạn 2010 – 2023 là bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"29,4","explain":"Tốc độ tăng = (709 − 548) ÷ 548 × 100 = 161 ÷ 548 × 100 ≈ 29,4%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Tổng mức bán lẻ hàng hóa và doanh thu dịch vụ (nghìn tỉ đồng): năm 2015 là 3.247; năm 2023 là 6.231. Quy mô thị trường năm 2023 gấp khoảng bao nhiêu lần năm 2015 (làm tròn đến 1 chữ số thập phân)?","answer":"1,9","explain":"6.231 ÷ 3.247 ≈ 1,92, làm tròn thành 1,9 lần.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Diện tích rừng năm 2023 (triệu ha): tổng diện tích 14,9; rừng trồng 4,6. Diện tích rừng tự nhiên còn lại là bao nhiêu triệu ha?","answer":"10,3","explain":"14,9 − 4,6 = 10,3 triệu ha.","points":0.5},{"type":"short","level":"VD","q":"Năm 2023, diện tích rừng của Việt Nam là 14,9 triệu ha, dân số là 100,3 triệu người. Bình quân diện tích rừng đầu người là bao nhiêu ha/người (làm tròn đến 2 chữ số thập phân)?","answer":"0,15","explain":"14,9 ÷ 100,3 ≈ 0,15 ha/người.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Giá trị xuất khẩu nông sản năm 2023 (tỉ USD): gạo 4,7; tổng nông sản 25. Tỉ trọng xuất khẩu gạo trong tổng giá trị nông sản là bao nhiêu %?","answer":"18,8","explain":"4,7 ÷ 25 × 100 = 18,8%.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Nước ta có đường biên giới trên đất liền với Trung Quốc dài khoảng","options":["A. 3.260 km.","B. 1.450 km.","C. 2.300 km.","D. 1.650 km."],"answer":"B","explain":"Biên giới Việt – Trung dài khoảng 1.450 km qua 7 tỉnh phía Bắc.","points":0.25},{"type":"mcq","level":"TH","q":"Vấn đề chủ quyền biển đảo của nước ta hiện nay cần được giải quyết trên cơ sở nào sau đây?","options":["A. Sức mạnh quân sự đơn thuần.","B. Thỏa thuận song phương duy nhất.","C. Luật pháp quốc tế, nhất là Công ước Luật Biển 1982.","D. Phớt lờ tranh chấp."],"answer":"C","explain":"Việt Nam kiên trì giải quyết tranh chấp bằng biện pháp hòa bình, phù hợp luật pháp quốc tế.","points":0.25},{"type":"mcq","level":"NB","q":"Địa hình núi cao trên 2.000 m ở nước ta phân bố chủ yếu ở","options":["A. Đồng bằng sông Hồng.","B. Đông Nam Bộ.","C. Duyên hải Nam Trung Bộ.","D. Tây Bắc và Trường Sơn Nam."],"answer":"D","explain":"Núi cao tập trung ở Hoàng Liên Sơn (Tây Bắc) và Ngọc Linh (Trường Sơn Nam).","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác biệt lớn nhất về địa hình giữa Tây Nguyên và Đông Nam Bộ là","options":["A. Tây Nguyên là cao nguyên badan xếp tầng, Đông Nam Bộ là bán bình nguyên.","B. Tây Nguyên thấp hơn Đông Nam Bộ.","C. Đông Nam Bộ có núi cao hơn.","D. Cả hai đều là đồng bằng."],"answer":"A","explain":"Tây Nguyên gồm các cao nguyên badan (Kon Tum, Pleiku, Đắk Lắk, Mơ Nông, Di Linh, Lâm Viên); ĐNB là bán bình nguyên thoải.","points":0.25},{"type":"mcq","level":"NB","q":"Loại gió nào sau đây gây mưa lớn cho Nam Bộ và Tây Nguyên vào mùa hạ?","options":["A. Gió mùa Đông Bắc","B. Gió mùa Tây Nam","C. Gió phơn","D. Gió đất – biển"],"answer":"B","explain":"Gió mùa Tây Nam từ Ấn Độ Dương mang ẩm gây mưa lớn cho Nam Bộ, Tây Nguyên từ tháng 5 đến tháng 10.","points":0.25},{"type":"mcq","level":"TH","q":"Sự phân hóa khí hậu giữa Đông và Tây của vùng Bắc Trung Bộ chủ yếu do","options":["A. vĩ độ địa lí.","B. ảnh hưởng của biển Đông duy nhất.","C. địa hình Trường Sơn kết hợp với hướng gió.","D. hoạt động của con người."],"answer":"C","explain":"Sườn đông đón gió biển ẩm, sườn tây khuất gió khô nóng (gió Lào) — phân hóa đông – tây rõ rệt.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bảng số liệu (minh họa) về lượng mưa trung bình năm (mm): Hà Nội 1.680, Huế 2.890, TP. Hồ Chí Minh 1.930. Nhận định nào sau đây đúng?","options":["A. Hà Nội có lượng mưa lớn nhất.","B. TP. Hồ Chí Minh khô hạn nhất.","C. Lượng mưa đồng đều khắp cả nước.","D. Huế có lượng mưa lớn nhất do sườn đón gió và bão."],"answer":"D","explain":"Huế mưa nhiều nhất (trên 2.800 mm) nhờ sườn đông Trường Sơn đón Tín phong và bão thu đông.","points":0.25},{"type":"mcq","level":"NB","q":"Vườn quốc gia Cát Tiên nổi tiếng với hệ sinh thái nào sau đây?","options":["A. Rừng nhiệt đới ẩm thường xanh","B. Rừng ngập mặn","C. Rừng tre nứa","D. Thảo nguyên"],"answer":"A","explain":"Cát Tiên (Đồng Nai, Lâm Đồng) bảo tồn rừng nhiệt đới ẩm Nam Bộ với nhiều loài quý hiếm.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên nhân chủ yếu làm suy giảm diện tích rừng tự nhiên ở nước ta là","options":["A. trồng rừng thay thế.","B. khai thác quá mức, cháy rừng và chuyển đổi mục đích sử dụng đất.","C. khí hậu quá lạnh.","D. thiếu chính sách bảo vệ."],"answer":"B","explain":"Khai thác trái phép, cháy rừng mùa khô và chuyển đất rừng sang mục đích khác là nguyên nhân chính.","points":0.25},{"type":"mcq","level":"NB","q":"Giải pháp quan trọng nhất để ứng phó với biến đổi khí hậu ở Đồng bằng sông Cửu Long là","options":["A. đắp đê bao kín toàn vùng.","B. di dân khỏi đồng bằng.","C. chuyển đổi cơ cấu sản xuất thích ứng với mặn và ngập.","D. ngừng sản xuất nông nghiệp."],"answer":"C","explain":"Sống chung với lũ, thích ứng với mặn – ngập qua chuyển đổi cây trồng, vật nuôi là hướng bền vững.","points":0.25},{"type":"mcq","level":"NB","q":"Tỉ lệ dân thành thị của nước ta năm 2023 khoảng","options":["A. 30,5%.","B. 55,0%.","C. 68,0%.","D. 42,7%."],"answer":"D","explain":"Tỉ lệ đô thị hóa năm 2023 đạt khoảng 42,7%, tăng nhanh so với 30,5% năm 2010.","points":0.25},{"type":"mcq","level":"TH","q":"Quá trình đô thị hóa ở nước ta gắn liền với quá trình nào sau đây?","options":["A. Công nghiệp hóa, hiện đại hóa","B. Nông nghiệp hóa","C. Di dân ra nước ngoài","D. Giảm tỉ trọng dịch vụ"],"answer":"A","explain":"Công nghiệp hóa thu hút lao động về đô thị, thúc đẩy đô thị hóa.","points":0.25},{"type":"mcq","level":"NB","q":"Vùng chăn nuôi bò sữa lớn nhất nước ta là","options":["A. Tây Bắc.","B. ven các thành phố lớn (Hà Nội, TP. Hồ Chí Minh).","C. Tây Nguyên.","D. Duyên hải Nam Trung Bộ."],"answer":"B","explain":"Bò sữa nuôi tập trung ven đô thị lớn để cung ứng sữa tươi (Mộc Châu, Ba Vì, Củ Chi...).","points":0.25},{"type":"mcq","level":"TH","q":"Điều kiện nào sau đây thuận lợi nhất cho chăn nuôi gia súc lớn ở Bắc Trung Bộ?","options":["A. Khí hậu lạnh quanh năm.","B. Diện tích đồng bằng rộng.","C. Đồng cỏ tự nhiên trên các đồi núi thấp.","D. Nguồn thức ăn công nghiệp dồi dào."],"answer":"C","explain":"BTB có đồng cỏ trên gò đồi, thích hợp chăn nuôi bò đàn (Nghệ An, Hà Tĩnh).","points":0.25},{"type":"mcq","level":"NB","q":"Tỉnh nào sau đây là trung tâm khai thác bô xít lớn nhất nước ta?","options":["A. Quảng Ninh","B. Lào Cai","C. Hà Tĩnh","D. Đắk Nông"],"answer":"D","explain":"Tây Nguyên (Đắk Nông, Lâm Đồng) có trữ lượng bô xít lớn nhất, đang khai thác ở Nhân Cơ, Tân Rai.","points":0.25},{"type":"mcq","level":"TH","q":"Công nghiệp khai khoáng ở nước ta hiện nay có xu hướng nào sau đây?","options":["A. Giảm tỉ trọng trong cơ cấu công nghiệp, tăng chế biến sâu.","B. Tăng nhanh tỉ trọng khai thác thô.","C. Ngừng khai thác khoáng sản.","D. Chỉ khai thác phục vụ xuất khẩu thô."],"answer":"A","explain":"Hạn chế xuất thô, tăng chế biến sâu để nâng cao giá trị (bô xít – alumin, titan...).","points":0.25},{"type":"mcq","level":"NB","q":"Loại hình du lịch nào sau đây phát triển mạnh nhất ở Tây Nguyên?","options":["A. Du lịch biển đảo","B. Du lịch sinh thái và văn hóa cồng chiêng","C. Du lịch mua sắm","D. Du lịch tâm linh biển"],"answer":"B","explain":"Tây Nguyên hút khách bằng sinh thái (thác, hồ, rừng) và văn hóa cồng chiêng.","points":0.25},{"type":"mcq","level":"VD","q":"Cho bảng số liệu (minh họa) về sản lượng than (triệu tấn): năm 2015 là 41,7; năm 2023 là 48,4. Nhận xét nào sau đây đúng?","options":["A. Sản lượng than giảm một nửa.","B. Năm 2023 sản lượng than chưa đạt 40 triệu tấn.","C. Sản lượng than tăng khoảng 16% sau 8 năm.","D. Ngành than đã ngừng khai thác."],"answer":"C","explain":"(48,4 – 41,7)/41,7 đạt khoảng 16,1%; than vẫn là nguồn năng lượng quan trọng.","points":0.25},{"type":"truefalse","level":"TH","q":"Về Tây Nguyên, xét tính đúng, sai của các nhận định sau:","statements":["a) Gồm các cao nguyên badan xếp tầng với độ cao trung bình 500 – 800 m.","b) Đất badan màu mỡ thích hợp trồng cây công nghiệp lâu năm.","c) Có hai mùa mưa – khô rõ rệt.","d) Là vùng dẫn đầu cả nước về sản lượng thủy sản."],"answer":["T","T","T","F"],"explain":"a, b, c đúng: cao nguyên badan, khí hậu phân 2 mùa. d sai: thủy sản dẫn đầu là ĐBSCL.","points":1},{"type":"truefalse","level":"VD","q":"Về phát triển kinh tế ở Trung du và miền núi Bắc Bộ, xét tính đúng, sai của các nhận định sau:","statements":["a) Giàu tài nguyên khoáng sản nhất cả nước.","b) Có tiềm năng thủy điện lớn nhất cả nước.","c) Phát triển cây công nghiệp cận nhiệt (chè) và chăn nuôi trâu.","d) Là vùng có trình độ phát triển kinh tế cao nhất cả nước."],"answer":["T","T","T","F"],"explain":"Đúng a,b,c; sai d: đây là vùng kinh tế còn khó khăn.","points":1},{"type":"truefalse","level":"TH","q":"Về bưu chính – viễn thông ở nước ta, xét tính đúng, sai của các nhận định sau:","statements":["a) Phát triển nhanh, phủ sóng rộng khắp cả nước.","b) Mạng di động và internet phổ cập đến vùng sâu, vùng xa.","c) Đóng vai trò quan trọng trong chuyển đổi số.","d) Chỉ phát triển ở các thành phố lớn."],"answer":["T","T","T","F"],"explain":"a, b, c đúng: viễn thông phát triển vượt bậc, hỗ trợ chuyển đổi số. d sai: đã phủ khắp nông thôn, miền núi.","points":1},{"type":"truefalse","level":"VDC","q":"Cho bảng số liệu (minh họa) về giá trị sản xuất công nghiệp (nghìn tỉ đồng, giá hiện hành): năm 2015 là 6.710, năm 2023 là 14.950. Xét tính đúng, sai của các nhận định sau:","statements":["a) Giá trị sản xuất công nghiệp tăng hơn 2 lần sau 8 năm.","b) Công nghiệp chế biến, chế tạo chiếm tỉ trọng ngày càng lớn.","c) Công nghiệp là ngành có tốc độ tăng trưởng cao trong nền kinh tế.","d) Công nghiệp khai khoáng vẫn chiếm trên 50% giá trị sản xuất công nghiệp."],"answer":["T","T","T","F"],"explain":"a đúng: 14.950/6.710 đạt khoảng 2,23 lần. b, c đúng. d sai: khai khoáng chỉ chiếm tỉ trọng nhỏ và giảm dần.","points":1},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Sản lượng than (triệu tấn): năm 2015 là 41,7; năm 2023 là 48,4. Tốc độ tăng sản lượng than giai đoạn 2015 – 2023 là bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"16,1","explain":"Tốc độ tăng = (48,4 − 41,7) ÷ 41,7 × 100 = 6,7 ÷ 41,7 × 100 ≈ 16,1%.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Trữ lượng một số khoáng sản (triệu tấn): bô xít 5.500; sắt 544. Trữ lượng bô xít gấp khoảng bao nhiêu lần trữ lượng sắt (làm tròn đến 1 chữ số thập phân)?","answer":"10,1","explain":"5.500 ÷ 544 ≈ 10,11, làm tròn thành 10,1 lần.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Giá trị xuất khẩu năm 2023 (tỉ USD): hàng công nghiệp chế biến 301,5; tổng xuất khẩu 354,7. Tỉ trọng hàng công nghiệp chế biến chiếm bao nhiêu % (làm tròn đến hàng đơn vị)?","answer":"85","explain":"301,5 ÷ 354,7 × 100 ≈ 85%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Năm 2023, cả nước có 154 triệu thuê bao di động trên tổng dân số 100,3 triệu người. Bình quân cứ 100 dân có bao nhiêu thuê bao di động (làm tròn đến 1 chữ số thập phân)?","answer":"153,5","explain":"154 ÷ 100,3 × 100 ≈ 153,5 thuê bao/100 dân.","points":0.5},{"type":"short","level":"VD","q":"Cho bảng số liệu (minh họa): Giá trị sản xuất công nghiệp năm 2023 (nghìn tỉ đồng): công nghiệp khai khoáng 800; tổng giá trị 14.950. Tỉ trọng công nghiệp khai khoáng chiếm bao nhiêu % (làm tròn đến 1 chữ số thập phân)?","answer":"5,4","explain":"Tỉ trọng = 800 ÷ 14.950 × 100 ≈ 5,4%.","points":0.5},{"type":"short","level":"TH","q":"Cho bảng số liệu (minh họa): Năm 2023, sản lượng điện cả nước là 280,6 tỉ kWh, dân số là 100,3 triệu người. Bình quân sản lượng điện đầu người là bao nhiêu kWh/người (làm tròn đến hàng đơn vị)?","answer":"2798","explain":"280,6 tỉ ÷ 100,3 triệu = 280.600 ÷ 100,3 ≈ 2.798 kWh/người.","points":0.5}]}]}
