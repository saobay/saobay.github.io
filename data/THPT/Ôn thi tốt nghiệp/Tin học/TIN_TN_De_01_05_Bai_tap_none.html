<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Đơn vị nhỏ nhất dùng để đo lượng thông tin lưu trữ là gì?","options":["A. Byte","B. Kilobyte","C. Bit","D. Megabyte"],"answer":"C","explain":"Bit là đơn vị nhỏ nhất, chỉ nhận một trong hai giá trị 0 hoặc 1. 8 bit ghép lại thành 1 byte.","points":0.25},{"type":"mcq","level":"NB","q":"1 KB bằng bao nhiêu byte?","options":["A. 1024 byte","B. 1000 byte","C. 1024 bit","D. 8 byte"],"answer":"A","explain":"Trong tin học, 1 KB = 1024 byte; 1 MB = 1024 KB; 1 GB = 1024 MB.","points":0.25},{"type":"mcq","level":"NB","q":"Thiết bị nào sau đây là thiết bị thông minh?","options":["A. Máy tính cầm tay dùng trong kỳ thi tốt nghiệp","B. Bàn phím cơ thông thường","C. Đĩa CD trắng","D. Robot hút bụi tự động"],"answer":"D","explain":"Thiết bị thông minh có khả năng thu nhận, xử lý thông tin và tự động thực hiện nhiệm vụ như robot hút bụi.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào sau đây đúng về lưu trữ đám mây?","options":["A. Chỉ dùng được khi không có kết nối Internet","B. Dữ liệu lưu trên đám mây không bao giờ bị mất","C. Cho phép truy cập dữ liệu mọi lúc, mọi nơi khi có Internet","D. Luôn miễn phí với dung lượng không giới hạn"],"answer":"C","explain":"Lưu trữ đám mây giữ dữ liệu trên máy chủ qua Internet nên truy cập được mọi lúc mọi nơi có mạng; vẫn có giới hạn dung lượng và rủi ro mất mát.","points":0.25},{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây đúng về mối quan hệ giữa thông tin và dữ liệu?","options":["A. Thông tin và dữ liệu là một","B. Dữ liệu là biểu diễn của thông tin dưới dạng phù hợp để lưu trữ và xử lý","C. Dữ liệu luôn đúng còn thông tin có thể sai","D. Thông tin không thể chuyển thành dữ liệu"],"answer":"B","explain":"Thông tin là nội dung cần truyền đạt; dữ liệu là cách biểu diễn thông tin bằng kí hiệu, số, chữ để máy tính lưu trữ và xử lý.","points":0.25},{"type":"mcq","level":"VD","q":"Một video bài giảng có dung lượng 1,6 GB. Cần ít nhất bao nhiêu đĩa CD dung lượng 700 MB để lưu video đó?","options":["A. 3 đĩa","B. 2 đĩa","C. 4 đĩa","D. 5 đĩa"],"answer":"A","explain":"1,6 GB = 1,6 x 1024 = 1638,4 MB. 1638,4 chia 700 được 2,34 nên cần ít nhất 3 đĩa CD.","points":0.25},{"type":"mcq","level":"NB","q":"Phạm vi của mạng Internet là gì?","options":["A. Một tòa nhà","B. Một thành phố","C. Toàn cầu","D. Một quốc gia"],"answer":"C","explain":"Internet là mạng máy tính toàn cầu, kết nối hàng tỉ thiết bị trên khắp thế giới.","points":0.25},{"type":"mcq","level":"NB","q":"Hệ thống nào sau đây thể hiện rõ nhất Internet vạn vật (IoT)?","options":["A. Hệ thống chấm bài thi trắc nghiệm","B. Hệ thống nhà thông minh tự điều chỉnh đèn và điều hòa","C. Hệ thống lưu trữ hồ sơ học sinh","D. Máy tính để bàn trong phòng học"],"answer":"B","explain":"IoT là mạng lưới các thiết bị thông minh kết nối Internet, thu thập và trao đổi dữ liệu như trong nhà thông minh.","points":0.25},{"type":"mcq","level":"NB","q":"Để kết nối các máy tính trong một phòng máy thành mạng LAN có dây, thiết bị nào sau đây phù hợp nhất?","options":["A. Switch","B. Modem","C. Máy in","D. Loa"],"answer":"A","explain":"Switch là thiết bị dùng để kết nối các máy tính và thiết bị trong mạng cục bộ (LAN) với nhau.","points":0.25},{"type":"mcq","level":"NB","q":"Điện toán đám mây là gì?","options":["A. Một loại virus máy tính","B. Việc lưu trữ và xử lý dữ liệu trên các máy chủ thông qua Internet","C. Phần mềm diệt virus","D. Thiết bị lưu trữ gắn ngoài"],"answer":"B","explain":"Điện toán đám mây cung cấp tài nguyên tính toán và lưu trữ qua Internet thay vì lưu trên máy cá nhân.","points":0.25},{"type":"mcq","level":"NB","q":"Để tìm kiếm thông tin chính xác về một cụm từ, cách nào sau đây hiệu quả nhất?","options":["A. Gõ thật nhiều từ khóa rời rạc","B. Chỉ tìm kiếm bằng hình ảnh","C. Gõ cả đoạn văn dài vào ô tìm kiếm","D. Gõ cụm từ trong dấu ngoặc kép"],"answer":"D","explain":"Đặt cụm từ trong dấu ngoặc kép giúp công cụ tìm kiếm trả về kết quả chứa đúng cụm từ đó.","points":0.25},{"type":"mcq","level":"VD","q":"Một trường học có 3 phòng máy, mỗi phòng 40 máy tính. Trường đã có một đường truyền Internet với modem tích hợp router. Để mỗi phòng có mạng LAN riêng và cả 3 phòng đều truy cập được Internet, giải pháp hợp lý nhất là gì?","options":["A. Nối trực tiếp cả 120 máy vào modem","B. Mỗi phòng lắp một đường truyền Internet riêng","C. Mỗi phòng dùng một switch nối vào router, các máy trong phòng nối vào switch của phòng mình","D. Chỉ dùng sóng wifi của modem cho cả 120 máy"],"answer":"C","explain":"Mỗi phòng dùng switch tạo mạng LAN riêng rồi nối các switch vào router để chia sẻ đường Internet; cách này ổn định và dễ quản lý.","points":0.25},{"type":"mcq","level":"NB","q":"Hành vi nào sau đây vi phạm pháp luật về sở hữu trí tuệ trên không gian mạng?","options":["A. Tải phần mềm nguồn mở về sử dụng","B. Đọc báo điện tử","C. Gửi email cho bạn bè","D. Sao chép và bán phần mềm thương mại không có bản quyền"],"answer":"D","explain":"Phần mềm thương mại được bảo hộ bản quyền; sao chép và bán khi chưa được phép là vi phạm pháp luật.","points":0.25},{"type":"mcq","level":"NB","q":"Hành vi nào sau đây là bắt nạt trên không gian mạng?","options":["A. Gửi email trao đổi bài tập","B. Nhắn tin hỏi bài bạn","C. Đăng thông tin hăm dọa người khác lên mạng xã hội","D. Chia sẻ tài liệu học tập"],"answer":"C","explain":"Bắt nạt trên không gian mạng là dùng mạng để đe dọa, xúc phạm, làm tổn thương người khác.","points":0.25},{"type":"mcq","level":"NB","q":"Mật khẩu nào sau đây an toàn nhất?","options":["A. SaoBay@2026_hs","B. 12345678","C. Ngày sinh của mình","D. Tên mình viết liền không dấu"],"answer":"A","explain":"Mật khẩu mạnh nên dài từ 8 kí tự trở lên, gồm chữ hoa, chữ thường, số và kí tự đặc biệt, không đoán được từ thông tin cá nhân.","points":0.25},{"type":"mcq","level":"NB","q":"Khi nhận được email lạ yêu cầu bấm vào đường link để nhận thưởng, em nên làm gì?","options":["A. Bấm ngay vào link để nhận thưởng","B. Không bấm vào link, xóa email và báo cho người lớn","C. Chuyển tiếp email cho bạn bè cùng nhận","D. Trả lời email để hỏi thêm thông tin"],"answer":"B","explain":"Đây là thủ đoạn lừa đảo phổ biến; tuyệt đối không bấm link lạ, nên xóa và báo cho người lớn hoặc nhà cung cấp dịch vụ.","points":0.25},{"type":"mcq","level":"NB","q":"Tự ý đăng ảnh của người khác lên mạng xã hội khi chưa được đồng ý vi phạm quyền nào?","options":["A. Quyền tự do ngôn luận","B. Quyền học tập","C. Quyền sở hữu tài sản","D. Quyền riêng tư"],"answer":"D","explain":"Hình ảnh cá nhân thuộc quyền riêng tư; đăng tải khi chưa được đồng ý là xâm phạm quyền riêng tư.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn A thấy một tin giật gân trên mạng xã hội và định chia sẻ ngay cho cả lớp. Theo văn hóa ứng xử trong môi trường số, việc làm đúng nhất của A là gì?","options":["A. Chia sẻ ngay để mọi người cùng biết","B. Thêm bình luận gay gắt rồi chia sẻ","C. Xóa tài khoản mạng xã hội của mình","D. Kiểm chứng thông tin từ nguồn tin cậy trước khi chia sẻ"],"answer":"D","explain":"Người dùng có văn hóa số cần kiểm chứng thông tin từ nguồn tin cậy trước khi chia sẻ để không lan truyền tin giả.","points":0.25},{"type":"mcq","level":"NB","q":"Phần mềm nào sau đây là phần mềm ứng dụng?","options":["A. Microsoft Word","B. Microsoft Windows","C. Hệ điều hành Android","D. Trình điều khiển máy in"],"answer":"A","explain":"Phần mềm ứng dụng phục vụ nhu cầu cụ thể của người dùng như soạn thảo văn bản; Windows và Android là hệ điều hành.","points":0.25},{"type":"mcq","level":"NB","q":"Ứng dụng nào sau đây sử dụng trí tuệ nhân tạo?","options":["A. Máy tính cầm tay","B. Trợ lý ảo nhận diện giọng nói","C. Đèn bàn","D. Quạt điện"],"answer":"B","explain":"Trợ lý ảo nhận diện giọng nói, nhận diện khuôn mặt, xe tự lái là các ứng dụng điển hình của trí tuệ nhân tạo.","points":0.25},{"type":"mcq","level":"NB","q":"Công việc nào sau đây thuộc nhóm nghề quản trị mạng?","options":["A. Bảo đảm hệ thống mạng hoạt động an toàn, ổn định","B. Thiết kế trò chơi trực tuyến","C. Viết tiểu thuyết","D. Chụp ảnh sự kiện"],"answer":"A","explain":"Người quản trị mạng chịu trách nhiệm lắp đặt, cấu hình và bảo đảm hệ thống mạng hoạt động an toàn, ổn định.","points":0.25},{"type":"mcq","level":"NB","q":"Công việc nào sau đây thuộc nhóm nghề sửa chữa và bảo trì máy tính?","options":["A. Thiết kế và xây dựng hệ điều hành","B. Phát triển phần mềm di động","C. Cài đặt và gỡ bỏ hệ điều hành","D. Xây dựng các ứng dụng mạng"],"answer":"C","explain":"Nhóm nghề sửa chữa và bảo trì thực hiện cài đặt, sửa chữa, thay thế linh kiện và khắc phục sự cố máy tính.","points":0.25},{"type":"mcq","level":"NB","q":"Phần mềm mô phỏng được dùng để làm gì?","options":["A. Nghe nhạc","B. Mô phỏng các thí nghiệm, hiện tượng khó thực hiện trong thực tế","C. Soạn thảo văn bản","D. Chỉnh sửa ảnh"],"answer":"B","explain":"Phần mềm mô phỏng tái hiện các thí nghiệm nguy hiểm, tốn kém hoặc trừu tượng giúp học tập trực quan.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn B thích tìm hiểu phần cứng, hay tháo lắp máy tính và muốn giúp mọi người khắc phục sự cố máy tính. Nhóm nghề nào trong lĩnh vực công nghệ thông tin phù hợp nhất với B?","options":["A. Quản trị mạng","B. Phát triển phần mềm","C. Thiết kế đồ họa","D. Sửa chữa và bảo trì máy tính"],"answer":"D","explain":"Sở thích tìm hiểu phần cứng và khắc phục sự cố máy tính phù hợp với nhóm nghề sửa chữa và bảo trì máy tính.","points":0.25},{"type":"truefalse","level":"TH","q":"Một trường học lắp mạng LAN cho phòng máy gồm 40 máy tính. Một số bạn đưa ra ý kiến sau:","statements":["a) Nên dùng switch để kết nối các máy tính trong phòng.","b) Mỗi máy tính cần có card mạng để kết nối vào mạng.","c) Các máy trong mạng LAN không thể dùng chung một máy in.","d) Muốn truy cập Internet, mạng LAN cần được nối qua router tới nhà cung cấp dịch vụ."],"answer":["T","T","F","T"],"explain":"a) Đúng: switch là thiết bị kết nối các máy trong mạng LAN. b) Đúng: card mạng là thành phần giúp máy tính giao tiếp qua mạng. c) Sai: các máy trong LAN có thể dùng chung máy in qua mạng. d) Đúng: router kết nối mạng LAN với nhà cung cấp dịch vụ Internet.","points":1},{"type":"truefalse","level":"TH","q":"Để quản lý việc mượn sách, thư viện trường xây dựng cơ sở dữ liệu quan hệ gồm bảng SACH(MaSach, TenSach, TacGia) và bảng MUON(MaMuon, MaSach, NgayMuon).","statements":["a) MaSach có thể làm khóa chính của bảng SACH vì mỗi cuốn sách có mã duy nhất.","b) Trường MaSach trong bảng MUON lưu họ tên của người mượn sách.","c) Có thể lưu nhiều tên sách khác nhau trong cùng một ô của bảng.","d) Hệ quản trị cơ sở dữ liệu giúp tìm kiếm, thống kê sách được mượn nhanh chóng."],"answer":["T","F","F","T"],"explain":"a) Đúng: khóa chính là trường có giá trị duy nhất cho mỗi bản ghi. b) Sai: MaSach ở bảng MUON là mã sách để liên kết với bảng SACH, không lưu họ tên người mượn. c) Sai: mỗi ô trong bảng quan hệ chỉ chứa một giá trị. d) Đúng: đó là lợi ích của hệ quản trị cơ sở dữ liệu.","points":1},{"type":"truefalse","level":"VD","q":"Xét đoạn chương trình Python sau: tong = 0; for i in range(1, 11): nếu i là số lẻ thì cộng i vào tong; in tong ra màn hình.","statements":["a) Vòng lặp thực hiện 10 lần, biến i nhận giá trị từ 1 đến 10.","b) Điều kiện kiểm tra i chia 2 dư 1 sẽ chọn ra các số chẵn.","c) Chương trình tính tổng các số chẵn từ 1 đến 10.","d) Kết quả in ra màn hình là 25."],"answer":["T","F","F","T"],"explain":"a) Đúng: range(1, 11) tạo dãy 1 đến 10. b) Sai: i chia 2 dư 1 là các số lẻ. c) Sai: điều kiện chọn số lẻ nên chương trình tính tổng các số lẻ. d) Đúng: 1 + 3 + 5 + 7 + 9 = 25.","points":1},{"type":"truefalse","level":"TH","q":"Khi tạo trang web bằng HTML và CSS, một số bạn phát biểu:","statements":["a) Thẻ p dùng để chèn hình ảnh lên trang web.","b) Thuộc tính src của thẻ img dùng để chỉ đường dẫn tới tệp ảnh.","c) Muốn đoạn văn có màu đỏ, trong CSS ta viết: p { color: red; }.","d) Một trang web bắt buộc phải dùng JavaScript mới hiển thị được."],"answer":["F","T","T","T"],"explain":"a) Sai: thẻ p tạo đoạn văn bản; muốn chèn ảnh phải dùng thẻ img. b) Đúng: src chỉ nguồn ảnh. c) Đúng: color là thuộc tính màu chữ trong CSS. d) Sai: trang web tĩnh chỉ cần HTML và CSS vẫn hiển thị được.","points":1},{"type":"truefalse","level":"TH","q":"Nhóm bạn thiết kế website giới thiệu trường học của mình:","statements":["a) Nên dồn tất cả nội dung vào một khối duy nhất, không cần phân chia các phần.","b) Nên dùng cỡ chữ thật nhỏ và màu chữ trùng màu nền cho đẹp.","c) Có thể chèn ảnh, video và liên kết để trang web sinh động.","d) Chỉ cần kiểm tra trang web trên máy tính, không cần kiểm tra trên điện thoại."],"answer":["F","T","T","F"],"explain":"a) Sai: nên chia trang thành đầu trang, nội dung chính, chân trang để dễ theo dõi. b) Sai: chữ phải đủ lớn và tương phản với nền để dễ đọc. c) Đúng: đa phương tiện làm trang web sinh động. d) Sai: cần kiểm tra hiển thị tốt trên cả máy tính và điện thoại.","points":1},{"type":"truefalse","level":"VD","q":"Bạn C làm video giới thiệu 20 năm thành lập trường:","statements":["a) Nên dùng phần mềm chỉnh sửa video để cắt ghép các đoạn phim.","b) Thêm nhạc nền có bản quyền mà không xin phép là vi phạm bản quyền.","c) Độ phân giải video càng thấp thì video càng sắc nét.","d) Nên xuất video ở định dạng thật lạ, ít người dùng để tăng tính bảo mật."],"answer":["T","T","F","F"],"explain":"a) Đúng: phần mềm chỉnh sửa video dùng để cắt ghép, thêm hiệu ứng. b) Đúng: dùng tác phẩm có bản quyền khi chưa được phép là vi phạm. c) Sai: độ phân giải càng cao video càng sắc nét. d) Sai: nên xuất ở định dạng phổ biến để dễ chia sẻ và phát trên nhiều thiết bị.","points":1}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"1 byte bằng bao nhiêu bit?","options":["A. 8 bit","B. 2 bit","C. 4 bit","D. 10 bit"],"answer":"A","explain":"1 byte = 8 bit. Đây là đơn vị cơ bản để đo dung lượng bộ nhớ và tệp tin.","points":0.25},{"type":"mcq","level":"NB","q":"Đẳng thức nào sau đây đúng về đơn vị lưu trữ thông tin?","options":["A. 1 GB = 1024 KB","B. 1 MB = 1024 byte","C. 1 TB = 1024 GB","D. 1 byte = 1024 bit"],"answer":"C","explain":"Thứ tự đơn vị: bit, byte, KB, MB, GB, TB; mỗi đơn vị lớn gấp 1024 lần đơn vị liền trước (trừ bit sang byte là 8 lần).","points":0.25},{"type":"mcq","level":"NB","q":"Thiết bị nào sau đây dùng để lưu trữ dữ liệu và có thể mang theo người?","options":["A. Máy in","B. Màn hình","C. Loa","D. USB"],"answer":"D","explain":"USB là thiết bị lưu trữ ngoài nhỏ gọn, dễ mang theo; máy in, màn hình, loa là thiết bị ngoại vi.","points":0.25},{"type":"mcq","level":"NB","q":"Vì sao cần sao lưu dữ liệu quan trọng?","options":["A. Để máy tính chạy nhanh hơn","B. Để tăng dung lượng ổ cứng","C. Để chia sẻ dữ liệu lên mạng xã hội","D. Để khôi phục dữ liệu khi bản gốc bị mất hoặc hỏng"],"answer":"D","explain":"Sao lưu tạo bản copy dự phòng; khi bản gốc mất, hỏng hoặc bị virus mã hóa, ta khôi phục từ bản sao lưu.","points":0.25},{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây đúng về tệp tin?","options":["A. Mọi tệp tin đều có dung lượng bằng nhau","B. Tệp tin là đơn vị cơ bản để lưu trữ dữ liệu trên thiết bị số","C. Tệp tin không có tên","D. Tệp tin chỉ lưu được chữ, không lưu được ảnh"],"answer":"B","explain":"Tệp tin là đơn vị lưu trữ cơ bản, mỗi tệp có tên, định dạng và dung lượng riêng, lưu được nhiều dạng dữ liệu.","points":0.25},{"type":"mcq","level":"VD","q":"Ổ cứng của bạn D còn trống 500 MB. Bạn muốn copy một thư mục chứa 3 tệp video, mỗi tệp 200 MB. Kết luận nào sau đây đúng?","options":["A. Copy được cả 3 tệp vì 200 x 3 = 600 MB nhỏ hơn 500 MB","B. Copy được vì video tự nén nhỏ lại","C. Chỉ cần xóa 1 tệp là copy được cả 3","D. Không copy được cả 3 tệp vì tổng 600 MB vượt quá 500 MB trống"],"answer":"D","explain":"Tổng dung lượng 3 tệp là 600 MB, lớn hơn 500 MB còn trống nên không thể copy cả 3 tệp cùng lúc.","points":0.25},{"type":"mcq","level":"NB","q":"Mạng LAN là mạng có đặc điểm nào sau đây?","options":["A. Phạm vi toàn cầu","B. Phạm vi một quốc gia","C. Phạm vi một tòa nhà, một trường học","D. Phạm vi liên lục địa"],"answer":"C","explain":"LAN (mạng cục bộ) kết nối các thiết bị trong phạm vi hẹp như một phòng, một tòa nhà, một trường học.","points":0.25},{"type":"mcq","level":"NB","q":"So với mạng LAN, mạng WAN có đặc điểm nào sau đây?","options":["A. Tốc độ luôn nhanh hơn LAN","B. Chỉ dùng trong một phòng học","C. Không cần thiết bị kết nối","D. Phạm vi rộng hơn, có thể bao phủ nhiều tỉnh, quốc gia"],"answer":"D","explain":"WAN (mạng diện rộng) bao phủ phạm vi lớn như Internet; tốc độ thường chậm hơn LAN và cần nhiều thiết bị.","points":0.25},{"type":"mcq","level":"NB","q":"Dịch vụ nào sau đây của Internet dùng để gửi và nhận thư điện tử?","options":["A. Game online","B. Email","C. Xem phim","D. Nghe nhạc"],"answer":"B","explain":"Email là dịch vụ thư điện tử trên Internet, cho phép gửi nhận thư kèm tệp đính kèm.","points":0.25},{"type":"mcq","level":"NB","q":"Phát biểu nào sau đây đúng về wifi?","options":["A. Wifi là công nghệ kết nối mạng không dây","B. Wifi chỉ dùng được cho điện thoại","C. Dùng wifi không cần mật khẩu vẫn luôn an toàn","D. Wifi không thể truy cập Internet"],"answer":"A","explain":"Wifi cho phép thiết bị kết nối mạng không dây; nên đặt mật khẩu để bảo mật và hoàn toàn có thể truy cập Internet.","points":0.25},{"type":"mcq","level":"TH","q":"Khi mua hàng trực tuyến, em nên làm gì để an toàn?","options":["A. Mua ở website lạ có giá rẻ bất thường","B. Chọn website uy tín, kiểm tra đánh giá và không cung cấp mã OTP cho người lạ","C. Chuyển tiền trước cho người bán không rõ danh tính","D. Cung cấp mật khẩu ngân hàng cho người bán"],"answer":"B","explain":"Mua sắm trực tuyến an toàn cần chọn nơi uy tín, kiểm tra đánh giá và tuyệt đối không tiết lộ mã OTP, mật khẩu.","points":0.25},{"type":"mcq","level":"VD","q":"Phòng thực hành của trường có 40 máy tính kết nối mạng để học sinh thực hành. Mạng này thuộc loại nào?","options":["A. Mạng LAN","B. Mạng WAN","C. Mạng Internet","D. Mạng MAN"],"answer":"A","explain":"40 máy trong một phòng học thuộc phạm vi hẹp nên là mạng LAN (mạng cục bộ).","points":0.25},{"type":"mcq","level":"NB","q":"Phần mềm độc hại (malware) là gì?","options":["A. Phần mềm gây hại cho máy tính và dữ liệu","B. Phần mềm soạn thảo văn bản","C. Phần mềm nghe nhạc","D. Phần mềm học trực tuyến"],"answer":"A","explain":"Malware gồm virus, worm, trojan... gây hại cho hệ thống và đánh cắp dữ liệu.","points":0.25},{"type":"mcq","level":"NB","q":"Để phòng tránh virus máy tính, biện pháp nào sau đây hiệu quả?","options":["A. Mở mọi tệp đính kèm trong email lạ","B. Tải phần mềm từ mọi website","C. Cài phần mềm diệt virus có bản quyền và cập nhật thường xuyên","D. Cắm USB lạ vào máy mà không quét"],"answer":"C","explain":"Phần mềm diệt virus cập nhật thường xuyên giúp phát hiện và ngăn chặn mã độc; không mở tệp lạ, không dùng USB không rõ nguồn gốc.","points":0.25},{"type":"mcq","level":"TH","q":"Nguồn học liệu mở trên Internet có đặc điểm nào sau đây?","options":["A. Luôn phải trả phí rất cao","B. Không được phép chia sẻ lại","C. Chỉ dùng được một lần","D. Được tự do sử dụng, chỉnh sửa và chia sẻ"],"answer":"D","explain":"Học liệu mở được cấp phép để mọi người tự do sử dụng, chỉnh sửa và chia sẻ, thường miễn phí.","points":0.25},{"type":"mcq","level":"TH","q":"Khi bị người lạ quấy rối, đe dọa trên mạng xã hội, em nên làm gì?","options":["A. Chửi lại cho hả giận","B. Giữ bằng chứng, chặn tài khoản đó và báo cho cha mẹ, thầy cô","C. Gặp mặt trực tiếp để giải quyết","D. Xóa hết bằng chứng rồi im lặng chịu đựng"],"answer":"B","explain":"Cần giữ bằng chứng, chặn liên lạc và báo cho người lớn; không nên đối đầu trực tiếp với kẻ quấy rối.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn E dùng chung máy tính ở quán Internet và đăng nhập tài khoản mạng xã hội nhưng quên đăng xuất. Nguy cơ nào sau đây có thể xảy ra?","options":["A. Máy tính chạy nhanh hơn","B. Tài khoản tự bảo mật tuyệt đối","C. Không có nguy cơ gì","D. Người khác có thể truy cập vào tài khoản của E"],"answer":"D","explain":"Quên đăng xuất trên máy dùng chung khiến người khác dễ dàng truy cập tài khoản; cần đăng xuất và đổi mật khẩu ngay.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào sau đây đúng về tin giả (fake news)?","options":["A. Mọi tin trên mạng đều là tin thật","B. Tin giả là thông tin sai sự thật được lan truyền như tin thật","C. Tin giả không gây hại gì","D. Không thể nhận biết được tin giả"],"answer":"B","explain":"Tin giả gây hoang mang, thiệt hại; cần kiểm chứng từ nguồn tin cậy và không chia sẻ khi chưa xác minh.","points":0.25},{"type":"mcq","level":"NB","q":"Hệ điều hành là gì?","options":["A. Phần mềm chơi game","B. Phần mềm điều khiển mọi hoạt động của máy tính","C. Phần mềm vẽ tranh","D. Phần mềm gõ văn bản"],"answer":"B","explain":"Hệ điều hành quản lý phần cứng và phần mềm, làm cầu nối giữa người dùng và máy tính, ví dụ Windows.","points":0.25},{"type":"mcq","level":"NB","q":"Phần mềm nguồn mở có đặc điểm nào sau đây?","options":["A. Không ai được phép sử dụng","B. Luôn phải trả phí bản quyền cao","C. Được công bố mã nguồn để mọi người tự do sử dụng và cải tiến","D. Không thể chỉnh sửa"],"answer":"C","explain":"Phần mềm nguồn mở công khai mã nguồn, cho phép dùng miễn phí và cải tiến, ví dụ LibreOffice.","points":0.25},{"type":"mcq","level":"NB","q":"Công việc nào sau đây thuộc nhóm nghề phát triển phần mềm?","options":["A. Sửa chữa máy in","B. Lắp đặt đường dây điện","C. Viết chương trình, ứng dụng đáp ứng nhu cầu người dùng","D. Trồng cây cảnh"],"answer":"C","explain":"Nhóm nghề phát triển phần mềm phân tích, thiết kế và viết chương trình, ứng dụng.","points":0.25},{"type":"mcq","level":"NB","q":"Trí tuệ nhân tạo hỗ trợ học tập như thế nào?","options":["A. Gợi ý bài tập phù hợp, chấm bài và giải đáp thắc mắc","B. Làm thay toàn bộ bài kiểm tra của học sinh","C. Thay thế hoàn toàn thầy cô","D. Không có ứng dụng gì trong học tập"],"answer":"A","explain":"AI hỗ trợ học tập qua gợi ý cá nhân hóa, chấm chữa bài; học sinh vẫn phải tự tư duy, không ỷ lại.","points":0.25},{"type":"mcq","level":"VD","q":"Công ty của chú F cần người quản lý hệ thống máy chủ và bảo đảm dữ liệu an toàn. Vị trí nào sau đây phù hợp nhất?","options":["A. Quản trị hệ thống mạng","B. Nhân viên bán hàng","C. Kế toán","D. Lái xe"],"answer":"A","explain":"Quản trị hệ thống mạng chịu trách nhiệm vận hành máy chủ, bảo mật và an toàn dữ liệu của tổ chức.","points":0.25},{"type":"mcq","level":"TH","q":"Lí do chủ yếu khiến nhu cầu tuyển dụng nhân lực công nghệ thông tin ngày càng tăng là gì?","options":["A. Mọi người đều bỏ dùng máy tính","B. Phần mềm không còn phát triển","C. Máy tính và công nghệ số được ứng dụng rộng rãi trong mọi lĩnh vực","D. Internet ngừng hoạt động"],"answer":"C","explain":"Chuyển đổi số diễn ra trong mọi lĩnh vực nên nhu cầu nhân lực công nghệ thông tin tăng mạnh.","points":0.25},{"type":"truefalse","level":"TH","q":"Lớp 12A muốn chia sẻ tài liệu ôn tập qua mạng wifi của trường. Một số bạn đưa ra ý kiến:","statements":["a) Các thiết bị kết nối wifi có thể trao đổi dữ liệu với nhau mà không cần dây cáp.","b) Nên để wifi không đặt mật khẩu để ai cũng có thể dùng chung.","c) Chia sẻ tài liệu qua mạng LAN của lớp nhanh và không tốn dung lượng Internet.","d) Mạng wifi công cộng không có mật khẩu luôn an toàn tuyệt đối."],"answer":["T","F","T","F"],"explain":"a) Đúng: wifi là kết nối không dây. b) Sai: cần đặt mật khẩu để ngăn người lạ truy cập trái phép. c) Đúng: trao đổi trong mạng nội bộ không tốn lưu lượng Internet. d) Sai: wifi công cộng không mật khẩu dễ bị nghe lén, đánh cắp thông tin.","points":1},{"type":"truefalse","level":"TH","q":"Bảng DIEM(MaHS, HoTen, DiemToan, DiemTin) lưu điểm của học sinh. Một số bạn phát biểu:","statements":["a) Mỗi cột của bảng là một bản ghi, lưu thông tin điểm của một học sinh.","b) MaHS nên chọn làm khóa chính vì mỗi học sinh có mã duy nhất.","c) Có thể thêm cột DiemVan vào bảng khi cần lưu thêm điểm môn Văn.","d) Muốn biết học sinh nào có điểm Tin cao nhất, ta sắp xếp bảng theo cột DiemTin giảm dần."],"answer":["F","T","T","T"],"explain":"a) Sai: mỗi hàng mới là một bản ghi; mỗi cột là một trường. b) Đúng: mã học sinh duy nhất nên làm khóa chính. c) Đúng: có thể bổ sung trường mới cho bảng. d) Đúng: sắp xếp giảm dần theo DiemTin đưa học sinh điểm cao nhất lên đầu.","points":1},{"type":"truefalse","level":"VD","q":"Xét đoạn chương trình Python so sánh hai số a = 7 và b = 5: nếu a lớn hơn b thì in ra 'a lớn hơn', ngược lại in ra 'b lớn hơn hoặc bằng'.","statements":["a) Điều kiện so sánh có giá trị đúng vì 7 lớn hơn 5.","b) Chương trình sẽ in ra 'a lớn hơn'.","c) Nếu đổi a = 3 thì chương trình vẫn in ra 'a lớn hơn'.","d) Khi điều kiện đúng, chương trình thực hiện câu lệnh sau if."],"answer":["T","T","F","T"],"explain":"a) Đúng: 7 lớn hơn 5. b) Đúng: điều kiện đúng nên thực hiện nhánh đầu tiên. c) Sai: khi a = 3, điều kiện sai nên in ra 'b lớn hơn hoặc bằng'. d) Đúng: điều kiện đúng thì câu lệnh sau if được thực hiện.","points":1},{"type":"truefalse","level":"TH","q":"Khi tạo bảng trong trang web bằng HTML, một số bạn phát biểu:","statements":["a) Thẻ table dùng để tạo biểu mẫu đăng nhập trên trang web.","b) Thẻ tr tạo một hàng, thẻ td tạo một ô trong bảng.","c) Muốn tạo liên kết sang trang khác, dùng thẻ img với thuộc tính src.","d) Bảng trong HTML chỉ tạo được tối đa 2 hàng."],"answer":["F","T","F","T"],"explain":"a) Sai: thẻ table tạo bảng; biểu mẫu dùng thẻ form. b) Đúng: tr là hàng, td là ô dữ liệu. c) Sai: tạo liên kết dùng thẻ a với thuộc tính href. d) Sai: bảng tạo được bao nhiêu hàng tùy ý.","points":1},{"type":"truefalse","level":"TH","q":"Trường tổ chức khảo sát ý kiến học sinh bằng biểu mẫu trên website:","statements":["a) Biểu mẫu trên web giúp thu thập và tổng hợp ý kiến nhanh chóng.","b) Nên chỉ hỏi những thông tin cần thiết, tránh thu thập thông tin cá nhân nhạy cảm.","c) Có thể dùng ô nhập văn bản, nút chọn và danh sách thả xuống trong biểu mẫu.","d) Mọi biểu mẫu trên mạng đều an toàn nên cứ điền thoải mái."],"answer":["T","T","T","F"],"explain":"a) Đúng: biểu mẫu web tự động tổng hợp kết quả. b) Đúng: hạn chế thu thập thông tin nhạy cảm để bảo vệ riêng tư. c) Đúng: đó là các thành phần phổ biến của biểu mẫu. d) Sai: cần kiểm tra độ tin cậy của website trước khi điền thông tin.","points":1},{"type":"truefalse","level":"VD","q":"Bạn G chỉnh sửa ảnh kỷ yếu của lớp bằng phần mềm chỉnh sửa ảnh:","statements":["a) Có thể cắt ảnh, xoay ảnh và thay đổi kích thước ảnh.","b) Không thể điều chỉnh độ sáng hay màu sắc của ảnh bằng phần mềm.","c) Lưu ảnh ở định dạng phổ biến giúp dễ chia sẻ và xem trên nhiều thiết bị.","d) Tự ý chỉnh sửa ảnh của người khác rồi đăng lên mạng là việc nên làm."],"answer":["T","F","T","F"],"explain":"a) Đúng: đó là các thao tác chỉnh sửa ảnh cơ bản. b) Sai: phần mềm chỉnh sửa ảnh cho phép điều chỉnh độ sáng, màu sắc. c) Đúng: định dạng phổ biến tương thích rộng. d) Sai: cần được sự đồng ý của người trong ảnh trước khi đăng tải.","points":1}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Thông tin là gì?","options":["A. Những hiểu biết của con người về thế giới xung quanh","B. Thiết bị điện tử","C. Phần mềm máy tính","D. Đường truyền Internet"],"answer":"A","explain":"Thông tin là những hiểu biết của con người về các sự vật, hiện tượng trong thế giới xung quanh.","points":0.25},{"type":"mcq","level":"TH","q":"Ví dụ nào sau đây thể hiện dữ liệu là biểu diễn của thông tin?","options":["A. Chiếc bàn học","B. Nhiệt độ 38 độ được ghi thành con số 38 trong sổ theo dõi sức khỏe","C. Cơn mưa rào","D. Tiếng chim hót"],"answer":"B","explain":"Cảm nhận nóng sốt là thông tin; con số 38 ghi trong sổ là dữ liệu biểu diễn thông tin đó.","points":0.25},{"type":"mcq","level":"NB","q":"1 MB bằng bao nhiêu KB?","options":["A. 1024 KB","B. 1000 KB","C. 8 KB","D. 1024 byte"],"answer":"A","explain":"1 MB = 1024 KB; 1 GB = 1024 MB.","points":0.25},{"type":"mcq","level":"TH","q":"Thiết bị nào sau đây vừa là thiết bị vào vừa là thiết bị ra?","options":["A. Máy in","B. Loa","C. Máy chiếu","D. Màn hình cảm ứng"],"answer":"D","explain":"Màn hình cảm ứng vừa hiển thị (ra) vừa nhận thao tác chạm của người dùng (vào).","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của việc lưu trữ thông tin trên thiết bị số so với giấy là gì?","options":["A. Không bao giờ bị hỏng","B. Không tốn chi phí","C. Lưu trữ được lượng dữ liệu lớn và dễ tìm kiếm, chia sẻ","D. Không cần thiết bị để đọc"],"answer":"C","explain":"Lưu trữ số cho phép lưu lượng lớn, tìm kiếm nhanh và chia sẻ dễ dàng; vẫn có thể hỏng và cần thiết bị để đọc.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn H quay video thí nghiệm dài 5 phút, mỗi phút video chiếm khoảng 60 MB. Thẻ nhớ 512 MB có đủ lưu video không?","options":["A. Đủ vì 5 x 60 = 300 MB nhỏ hơn 512 MB","B. Không đủ vì 5 x 60 = 300 GB","C. Không đủ vì video luôn lớn hơn thẻ nhớ","D. Đủ vì thẻ nhớ tự nén video"],"answer":"A","explain":"Video chiếm khoảng 300 MB, nhỏ hơn 512 MB của thẻ nhớ nên lưu vừa.","points":0.25},{"type":"mcq","level":"NB","q":"Thiết bị nào sau đây dùng để phát sóng wifi trong gia đình?","options":["A. Máy in","B. Access Point","C. Loa","D. Webcam"],"answer":"B","explain":"Access Point (điểm truy cập) phát sóng wifi cho các thiết bị kết nối không dây.","points":0.25},{"type":"mcq","level":"TH","q":"Ví dụ nào sau đây là ứng dụng của IoT trong nông nghiệp?","options":["A. Cảm biến tự động tưới nước khi đất khô","B. Cày ruộng bằng trâu","C. Gieo hạt bằng tay","D. Phơi thóc dưới nắng"],"answer":"A","explain":"IoT ứng dụng cảm biến và thiết bị thông minh để tự động hóa như tưới tiêu thông minh.","points":0.25},{"type":"mcq","level":"NB","q":"Trình duyệt web dùng để làm gì?","options":["A. Soạn thảo văn bản","B. Chỉnh sửa ảnh","C. Diệt virus","D. Truy cập và xem các trang web trên Internet"],"answer":"D","explain":"Trình duyệt là phần mềm giúp truy cập, hiển thị các trang web trên Internet.","points":0.25},{"type":"mcq","level":"TH","q":"Khi cần tìm hình ảnh minh họa cho bài thuyết trình, em nên làm gì?","options":["A. Lấy ảnh có dấu bản quyền rồi xóa dấu đi","B. Chụp lại ảnh trong sách mà không ghi nguồn","C. Dùng ảnh của người khác mà không xin phép","D. Dùng công cụ tìm kiếm hình ảnh và ưu tiên ảnh có giấy phép dùng lại"],"answer":"D","explain":"Nên dùng ảnh được cấp phép dùng lại và ghi rõ nguồn để tôn trọng bản quyền.","points":0.25},{"type":"mcq","level":"TH","q":"Điện toán đám mây giúp ích gì cho học sinh?","options":["A. Làm bài kiểm tra hộ","B. Lưu bài tập trực tuyến, truy cập và chia sẻ dễ dàng","C. Tự động học thay học sinh","D. Không cần học bài nữa"],"answer":"B","explain":"Đám mây giúp lưu trữ, đồng bộ và chia sẻ tài liệu học tập mọi lúc mọi nơi.","points":0.25},{"type":"mcq","level":"VD","q":"Gia đình bạn K ở nông thôn muốn lắp Internet. Nhà cung cấp lắp một modem tích hợp router và access point. Để các thiết bị trong nhà dùng được wifi, việc cần làm là gì?","options":["A. Mua thêm 10 modem nữa","B. Bật wifi trên modem, đặt tên mạng và mật khẩu rồi kết nối các thiết bị","C. Không cần làm gì, tự có mạng","D. Chỉ dùng được khi có dây cáp tới từng thiết bị"],"answer":"B","explain":"Modem tích hợp access point đã phát được wifi; chỉ cần cấu hình tên mạng, mật khẩu rồi kết nối thiết bị.","points":0.25},{"type":"mcq","level":"NB","q":"Hành vi nào sau đây vi phạm đạo đức trong môi trường số?","options":["A. Trao đổi bài tập với bạn","B. Hỏi thầy cô khi chưa hiểu bài","C. Chép bài của bạn rồi nộp như bài của mình","D. Đọc sách tham khảo"],"answer":"C","explain":"Chép bài của người khác và nhận là của mình là gian lận, vi phạm đạo đức học tập.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao không nên dùng wifi công cộng không có mật khẩu để giao dịch ngân hàng?","options":["A. Vì wifi công cộng luôn nhanh hơn","B. Vì ngân hàng không cho phép","C. Vì điện thoại sẽ hết pin","D. Vì dễ bị kẻ xấu nghe lén, đánh cắp thông tin tài khoản"],"answer":"D","explain":"Mạng không mật khẩu không mã hóa, kẻ xấu có thể chặn bắt thông tin nhạy cảm như tài khoản ngân hàng.","points":0.25},{"type":"mcq","level":"TH","q":"Học liệu mở có đặc điểm nào sau đây?","options":["A. Miễn phí và được tự do chỉnh sửa, chia sẻ","B. Phải trả phí rất đắt","C. Cấm chia sẻ cho người khác","D. Chỉ xem được một lần"],"answer":"A","explain":"Học liệu mở được cấp phép mở, cho phép dùng miễn phí, chỉnh sửa và chia sẻ lại.","points":0.25},{"type":"mcq","level":"NB","q":"Việc làm nào sau đây thể hiện văn hóa ứng xử tốt trên mạng xã hội?","options":["A. Chửi bới khi bất đồng quan điểm","B. Đăng tin bịa đặt","C. Bình luận lịch sự, tôn trọng người khác","D. Quấy rối người khác"],"answer":"C","explain":"Ứng xử có văn hóa số là giao tiếp lịch sự, tôn trọng và có trách nhiệm trên không gian mạng.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn M nhận được tin nhắn từ người lạ tự xưng là công an, yêu cầu chuyển tiền để giải quyết vụ việc. M nên làm gì?","options":["A. Chuyển tiền ngay cho nhanh","B. Cung cấp mã OTP để chứng minh trong sạch","C. Không chuyển tiền, báo cho cha mẹ và cơ quan công an nơi gần nhất","D. Rủ bạn cùng chuyển tiền"],"answer":"C","explain":"Đây là thủ đoạn giả danh công an để lừa đảo; tuyệt đối không chuyển tiền hay cung cấp OTP, cần báo người lớn và cơ quan chức năng.","points":0.25},{"type":"mcq","level":"TH","q":"Khi phát hiện bạn cùng lớp bị bắt nạt trên mạng, em nên làm gì?","options":["A. Cười theo cho vui","B. Lưu bằng chứng và báo cho thầy cô, cha mẹ","C. Chia sẻ tiếp để nhiều người biết","D. Mặc kệ vì không liên quan"],"answer":"B","explain":"Cần can thiệp đúng cách: lưu bằng chứng, động viên nạn nhân và báo cho người lớn có trách nhiệm.","points":0.25},{"type":"mcq","level":"NB","q":"Phần mềm nào sau đây là hệ điều hành cho điện thoại?","options":["A. Android","B. Microsoft Word","C. Zalo","D. Photoshop"],"answer":"A","explain":"Android là hệ điều hành cho điện thoại; Word, Zalo, Photoshop là phần mềm ứng dụng.","points":0.25},{"type":"mcq","level":"TH","q":"Phần mềm dạy học trực tuyến giúp ích gì?","options":["A. Thay thế hoàn toàn việc đến trường","B. Tự động làm bài tập cho học sinh","C. Học sinh học từ xa, trao đổi với thầy cô và bạn bè qua mạng","D. Không cần thầy cô nữa"],"answer":"C","explain":"Phần mềm dạy học trực tuyến hỗ trợ học từ xa nhưng không thay thế hoàn toàn việc học tập trung và vai trò thầy cô.","points":0.25},{"type":"mcq","level":"TH","q":"Nhóm nghề an toàn thông tin làm công việc gì?","options":["A. Sửa xe máy","B. Nấu ăn","C. Trồng rau","D. Bảo vệ hệ thống và dữ liệu khỏi các cuộc tấn công mạng"],"answer":"D","explain":"Chuyên gia an toàn thông tin phòng chống tấn công mạng, bảo vệ dữ liệu của tổ chức.","points":0.25},{"type":"mcq","level":"NB","q":"Robot trong nhà máy thường được dùng để làm gì?","options":["A. Nấu cơm cho công nhân","B. Trông trẻ","C. Dạy học","D. Thực hiện các công việc lặp đi lặp lại với độ chính xác cao"],"answer":"D","explain":"Robot công nghiệp thực hiện công việc lặp lại chính xác như lắp ráp, hàn, sơn trong nhà máy.","points":0.25},{"type":"mcq","level":"VD","q":"Trường muốn số hóa toàn bộ hồ sơ học sinh để tra cứu nhanh. Công việc này cần những nhóm nghề nào phối hợp?","options":["A. Chỉ cần thợ sửa ống nước","B. Chỉ cần đầu bếp","C. Phát triển phần mềm, quản trị cơ sở dữ liệu và quản trị mạng","D. Không cần nghề công nghệ thông tin nào"],"answer":"C","explain":"Số hóa hồ sơ cần phần mềm quản lý, cơ sở dữ liệu lưu trữ và hệ thống mạng để truy cập, đòi hỏi nhiều nhóm nghề CNTT phối hợp.","points":0.25},{"type":"mcq","level":"TH","q":"Kĩ năng nào sau đây cần thiết cho người làm nghề công nghệ thông tin?","options":["A. Không cần học gì thêm sau khi ra trường","B. Tư duy logic, ham học hỏi và cập nhật công nghệ mới","C. Chỉ cần khéo tay","D. Chỉ cần ngoại hình đẹp"],"answer":"B","explain":"Công nghệ thay đổi nhanh nên người làm CNTT cần tư duy logic và tinh thần tự học suốt đời.","points":0.25},{"type":"truefalse","level":"TH","q":"Trong giờ học, cô giáo yêu cầu các nhóm tìm hiểu về các loại mạng máy tính. Một nhóm đưa ra ý kiến:","statements":["a) Mạng LAN có phạm vi bao phủ toàn cầu.","b) Internet là mạng máy tính toàn cầu, cũng là một dạng mạng WAN.","c) Các máy tính muốn trao đổi dữ liệu qua mạng cần tuân theo các quy tắc chung.","d) Chỉ máy tính để bàn mới kết nối được vào mạng, điện thoại thì không."],"answer":["F","T","T","T"],"explain":"a) Sai: LAN là mạng cục bộ phạm vi hẹp; mạng toàn cầu là Internet. b) Đúng: Internet bao phủ toàn cầu. c) Đúng: các quy tắc chung gọi là giao thức mạng. d) Sai: điện thoại, máy tính bảng đều kết nối mạng được.","points":1},{"type":"truefalse","level":"TH","q":"Bảng HOCSINH(MaHS, HoTen, NgaySinh, Lop) lưu thông tin học sinh toàn trường:","statements":["a) Trường HoTen lưu họ tên, trường Lop lưu lớp của học sinh.","b) Không thể có hai học sinh khác nhau cùng một mã MaHS.","c) Không thể tìm học sinh theo lớp vì bảng không lưu thông tin lớp.","d) Xóa một hàng trong bảng chỉ làm mất thông tin của một học sinh."],"answer":["T","T","F","T"],"explain":"a) Đúng: mỗi trường lưu một thuộc tính. b) Đúng: khóa chính không trùng lặp. c) Sai: lọc theo trường Lop sẽ cho ra danh sách học sinh lớp 12A1. d) Đúng: xóa một hàng chỉ mất một bản ghi.","points":1},{"type":"truefalse","level":"VD","q":"Xét đoạn chương trình Python tính tiền điện: 100 kWh đầu giá 2000 đồng một kWh, từ kWh thứ 101 trở đi giá 3000 đồng một kWh.","statements":["a) Bài toán cần rẽ nhánh theo mức tiêu thụ điện.","b) Với 80 kWh, tiền điện là 80 x 3000 = 240000 đồng.","c) Với 150 kWh, tiền điện là 450000 đồng.","d) Cần rẽ nhánh tính riêng từng mức giá rồi cộng lại."],"answer":["T","F","F","T"],"explain":"a) Đúng: mức giá khác nhau theo lượng tiêu thụ nên cần rẽ nhánh. b) Sai: 80 kWh nằm trong 100 kWh đầu nên 80 x 2000 = 160000. c) Sai: 100 x 2000 + 50 x 3000 = 350000 đồng. d) Đúng: mỗi mức tiêu thụ có đơn giá khác nhau.","points":1},{"type":"truefalse","level":"TH","q":"Bạn N tạo trang web giới thiệu các danh lam thắng cảnh của quê hương:","statements":["a) Thẻ h1 dùng để tạo tiêu đề chính của trang web.","b) Không nên dùng danh sách để liệt kê các địa danh trên trang web.","c) Thuộc tính alt của thẻ img giúp hiển thị văn bản thay thế khi ảnh không tải được.","d) Trang web càng nhiều chữ nhấp nháy, màu sắc lòe loẹt càng chuyên nghiệp."],"answer":["T","F","T","T"],"explain":"a) Đúng: h1 là tiêu đề mức 1, quan trọng nhất trang. b) Sai: thẻ ul tạo danh sách dấu đầu dòng rất hợp để liệt kê. c) Đúng: alt hỗ trợ người dùng và công cụ tìm kiếm. d) Sai: trang web chuyên nghiệp cần bố cục hài hòa, dễ đọc.","points":1},{"type":"truefalse","level":"TH","q":"Nhóm bạn làm bài thuyết trình về an toàn giao thông có chèn video và âm thanh:","statements":["a) Nên chọn video, âm thanh có nội dung phù hợp với chủ đề bài thuyết trình.","b) Có thể cắt bớt đoạn video dài để vừa với thời lượng thuyết trình.","c) Nên kiểm tra âm thanh, hình ảnh trước khi thuyết trình chính thức.","d) Cứ lấy video của người khác về dùng mà không cần ghi nguồn."],"answer":["T","T","T","F"],"explain":"a) Đúng: đa phương tiện phải phục vụ nội dung. b) Đúng: cắt ghép giúp vừa thời lượng. c) Đúng: kiểm tra trước tránh sự cố kĩ thuật. d) Sai: cần tôn trọng bản quyền và ghi rõ nguồn.","points":1},{"type":"truefalse","level":"VD","q":"Bạn P soạn thảo báo cáo tổng kết năm học bằng phần mềm soạn thảo văn bản:","statements":["a) Không nên tạo mục lục vì sẽ làm văn bản rối hơn.","b) Có thể chèn bảng biểu, hình ảnh minh họa vào báo cáo.","c) Nên thống nhất phông chữ, cỡ chữ trong toàn bộ văn bản.","d) Muốn in đẹp thì phải in thử ra giấy màu đắt tiền."],"answer":["F","T","T","F"],"explain":"a) Sai: mục lục tự động giúp di chuyển nhanh giữa các phần của văn bản. b) Đúng: bảng và ảnh làm báo cáo sinh động. c) Đúng: thống nhất định dạng tạo văn bản chuyên nghiệp. d) Sai: in đẹp phụ thuộc định dạng văn bản, không phụ thuộc giấy đắt tiền.","points":1}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Quá trình chuyển thông tin thành dạng số để máy tính lưu trữ gọi là gì?","options":["A. In ấn","B. Chụp ảnh","C. Số hóa","D. Ghi âm"],"answer":"C","explain":"Số hóa là chuyển thông tin dạng tương tự (âm thanh, hình ảnh) thành dạng số để máy tính lưu trữ và xử lý.","points":0.25},{"type":"mcq","level":"TH","q":"Thiết bị nào sau đây là thiết bị vào?","options":["A. Máy quét","B. Máy in","C. Loa","D. Màn hình"],"answer":"A","explain":"Máy quét đưa hình ảnh, văn bản từ bên ngoài vào máy tính nên là thiết bị vào; máy in, loa, màn hình là thiết bị ra.","points":0.25},{"type":"mcq","level":"NB","q":"Bộ nhớ nào sau đây mất dữ liệu khi tắt máy tính?","options":["A. Ổ cứng","B. USB","C. Đĩa CD","D. RAM"],"answer":"D","explain":"RAM là bộ nhớ tạm, mất dữ liệu khi mất điện; ổ cứng, USB, đĩa CD lưu trữ lâu dài.","points":0.25},{"type":"mcq","level":"TH","q":"CPU được ví như bộ phận nào của máy tính?","options":["A. Nơi lưu trữ lâu dài","B. Màn hình hiển thị","C. Bàn phím nhập liệu","D. Bộ não điều khiển mọi hoạt động tính toán và xử lý"],"answer":"D","explain":"CPU (bộ xử lý trung tâm) thực hiện các phép tính và điều khiển hoạt động của máy tính như bộ não.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nên nén tệp tin trước khi gửi qua email?","options":["A. Để tăng dung lượng tệp","B. Để giảm dung lượng, gửi nhanh và đỡ tốn lưu lượng","C. Để đổi tên tệp","D. Để tệp không mở được"],"answer":"B","explain":"Nén giúp giảm dung lượng tệp nên gửi nhanh hơn, đồng thời gom nhiều tệp thành một gói gọn gàng.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn T cần gửi 10 ảnh, mỗi ảnh 8 MB qua email giới hạn 25 MB một thư. Cách làm hợp lý nhất là gì?","options":["A. Nén các ảnh hoặc chia thành nhiều thư để gửi","B. Cố gửi cả 10 ảnh trong một thư","C. Xóa bớt ảnh rồi gửi","D. Không gửi nữa"],"answer":"A","explain":"10 ảnh là 80 MB vượt giới hạn 25 MB; nên nén giảm dung lượng hoặc chia nhỏ thành nhiều thư.","points":0.25},{"type":"mcq","level":"NB","q":"Mạng xã hội là gì?","options":["A. Một loại virus","B. Nền tảng trực tuyến giúp mọi người kết nối, chia sẻ thông tin","C. Thiết bị mạng","D. Phần mềm diệt virus"],"answer":"B","explain":"Mạng xã hội là dịch vụ trực tuyến để kết nối, giao lưu và chia sẻ thông tin như Zalo, Facebook.","points":0.25},{"type":"mcq","level":"TH","q":"Khi gửi email cho nhiều người mà không muốn họ thấy địa chỉ của nhau, em nên làm gì?","options":["A. Gửi từng email riêng cho từng người","B. Đăng địa chỉ mọi người lên mạng","C. Không gửi email nữa","D. Dùng chế độ gửi ẩn danh cho người nhận"],"answer":"D","explain":"Chế độ gửi ẩn giúp bảo vệ địa chỉ email của người nhận, tránh bị thu thập để gửi thư rác.","points":0.25},{"type":"mcq","level":"TH","q":"Để đánh dấu một trang web hay dùng để truy cập nhanh lần sau, em nên làm gì?","options":["A. Ghi ra giấy rồi vứt đi","B. Học thuộc địa chỉ dài","C. Lưu vào dấu trang (bookmark) của trình duyệt","D. Tải cả trang web về"],"answer":"C","explain":"Dấu trang giúp lưu địa chỉ web yêu thích để truy cập nhanh trong những lần sau.","points":0.25},{"type":"mcq","level":"NB","q":"Học trực tuyến là hình thức học tập như thế nào?","options":["A. Học dưới nước","B. Học qua mạng Internet, không cần đến lớp trực tiếp","C. Học không cần thầy cô và bạn bè","D. Học không cần thiết bị"],"answer":"B","explain":"Học trực tuyến diễn ra qua Internet với sự hỗ trợ của phần mềm, vẫn có thầy cô và bạn học tương tác.","points":0.25},{"type":"mcq","level":"TH","q":"Khi tìm kiếm thông tin cho bài tập, vì sao nên đối chiếu nhiều nguồn?","options":["A. Để tốn thời gian","B. Để copy được nhiều hơn","C. Để kiểm chứng độ tin cậy, tránh dùng phải thông tin sai lệch","D. Vì một nguồn luôn đúng"],"answer":"C","explain":"Đối chiếu nhiều nguồn giúp đánh giá độ tin cậy vì không phải thông tin nào trên mạng cũng chính xác.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn L cần tìm tài liệu về lịch sử trường mình. Truy vấn tìm kiếm nào sau đây hiệu quả nhất?","options":["A. Một chữ cái duy nhất","B. Cả đoạn văn miêu tả dài","C. Từ khóa hoàn toàn không liên quan","D. Tên trường kèm từ khóa lịch sử trong dấu ngoặc kép"],"answer":"D","explain":"Kết hợp tên riêng và từ khóa chính xác trong ngoặc kép giúp thu hẹp kết quả đúng chủ đề cần tìm.","points":0.25},{"type":"mcq","level":"NB","q":"Giấy phép phần mềm là gì?","options":["A. Tờ giấy gói phần mềm","B. Hóa đơn mua máy tính","C. Quy định về quyền sử dụng phần mềm của người dùng","D. Thẻ bảo hành"],"answer":"C","explain":"Giấy phép phần mềm quy định người dùng được và không được làm gì với phần mềm, ví dụ có được sao chép không.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nên cập nhật phần mềm thường xuyên?","options":["A. Để máy tính chậm đi","B. Để tốn dung lượng","C. Để mất dữ liệu","D. Để vá lỗi bảo mật và cải thiện tính năng"],"answer":"D","explain":"Bản cập nhật thường vá các lỗ hổng bảo mật và sửa lỗi, giúp phần mềm an toàn và ổn định hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Dấu hiệu nào sau đây cho thấy email có thể là lừa đảo?","options":["A. Email từ thầy cô thông báo lịch học","B. Yêu cầu cung cấp mật khẩu, mã OTP và có đường link lạ","C. Email từ bạn bè hỏi bài","D. Thư cảm ơn từ nhà trường"],"answer":"B","explain":"Tổ chức uy tín không bao giờ yêu cầu mật khẩu hay mã OTP qua email; đó là dấu hiệu lừa đảo điển hình.","points":0.25},{"type":"mcq","level":"TH","q":"Quyền tác giả bảo vệ đối tượng nào sau đây?","options":["A. Tác phẩm văn học, nghệ thuật, phần mềm do tác giả sáng tạo","B. Ý tưởng chưa thể hiện ra","C. Tin tức thời sự đơn thuần","D. Văn bản pháp luật"],"answer":"A","explain":"Quyền tác giả bảo hộ các tác phẩm sáng tạo đã được thể hiện như sách, nhạc, phần mềm.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn N tải một bộ phim về máy rồi đăng lại lên kênh của mình để kiếm tiền mà không xin phép. Hành vi này như thế nào?","options":["A. Hoàn toàn hợp pháp","B. Vi phạm bản quyền vì khai thác tác phẩm của người khác khi chưa được phép","C. Được khuyến khích","D. Không ai quan tâm"],"answer":"B","explain":"Đăng lại tác phẩm để kiếm tiền khi chưa được chủ sở hữu cho phép là xâm phạm quyền tác giả.","points":0.25},{"type":"mcq","level":"TH","q":"Khi thấy nội dung xấu, độc hại trên mạng, em nên làm gì?","options":["A. Chia sẻ cho nhiều người cùng xem","B. Bình luận cổ vũ","C. Báo cáo nội dung đó cho nền tảng và không chia sẻ tiếp","D. Tải về lưu trữ"],"answer":"C","explain":"Người dùng có trách nhiệm báo cáo nội dung xấu để nền tảng xử lý, góp phần làm sạch không gian mạng.","points":0.25},{"type":"mcq","level":"NB","q":"Nhóm nghề phân tích dữ liệu làm công việc gì?","options":["A. Sửa chữa bàn ghế","B. Lái xe tải","C. Thu thập và phân tích dữ liệu để hỗ trợ ra quyết định","D. Nấu ăn"],"answer":"C","explain":"Chuyên gia phân tích dữ liệu xử lý các tập dữ liệu lớn để tìm ra xu hướng, hỗ trợ quyết định kinh doanh.","points":0.25},{"type":"mcq","level":"TH","q":"Công việc kiểm thử phần mềm là gì?","options":["A. Viết quảng cáo cho phần mềm","B. Tìm lỗi của phần mềm trước khi đưa tới người dùng","C. Bán phần mềm","D. Xóa phần mềm"],"answer":"B","explain":"Kiểm thử giúp phát hiện lỗi để sửa trước khi phát hành, đảm bảo phần mềm chạy đúng và ổn định.","points":0.25},{"type":"mcq","level":"TH","q":"Ứng dụng nào sau đây của AI trong y tế?","options":["A. Hỗ trợ đọc kết quả chẩn đoán hình ảnh","B. Thay thế hoàn toàn bác sĩ","C. Tự kê đơn thuốc cho bệnh nhân","D. Không có ứng dụng nào"],"answer":"A","explain":"AI hỗ trợ bác sĩ đọc phim chụp, phát hiện sớm bệnh; bác sĩ vẫn là người quyết định chẩn đoán và điều trị.","points":0.25},{"type":"mcq","level":"NB","q":"Công nghệ hỗ trợ người khuyết tật thể hiện ở thiết bị nào sau đây?","options":["A. Xe lăn điều khiển bằng giọng nói","B. Bàn phím hỏng","C. Màn hình vỡ","D. Chuột hết pin"],"answer":"A","explain":"Công nghệ hỗ trợ giúp người khuyết tật hòa nhập như xe lăn thông minh, phần mềm đọc màn hình cho người khiếm thị.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn Q giỏi vẽ và thích thiết kế giao diện đẹp cho ứng dụng. Nhóm nghề nào phù hợp nhất với Q?","options":["A. Thiết kế giao diện và trải nghiệm người dùng","B. Sửa chữa phần cứng","C. Lắp đặt mạng","D. Kế toán"],"answer":"A","explain":"Thiết kế giao diện và trải nghiệm người dùng cần óc thẩm mỹ và sự am hiểu người dùng, phù hợp với người giỏi vẽ.","points":0.25},{"type":"mcq","level":"TH","q":"Khởi nghiệp trong lĩnh vực công nghệ cần yếu tố nào quan trọng nhất?","options":["A. Chỉ cần nhiều tiền","B. Chỉ cần may mắn","C. Không cần kiến thức gì","D. Ý tưởng sáng tạo giải quyết vấn đề thực tế và kiến thức công nghệ"],"answer":"D","explain":"Khởi nghiệp công nghệ thành công nhờ ý tưởng giải quyết vấn đề thật cùng năng lực công nghệ và kiên trì.","points":0.25},{"type":"truefalse","level":"TH","q":"Trong phòng máy, các máy tính được nối với nhau và dùng chung đường Internet. Một số bạn phát biểu:","statements":["a) Muốn chép dữ liệu giữa các máy trong phòng máy bắt buộc phải dùng USB.","b) Một máy in nối mạng có thể phục vụ in ấn cho nhiều máy tính.","c) Khi một máy bị nhiễm virus, các máy khác trong mạng không bao giờ bị ảnh hưởng.","d) Mọi người dùng đều có quyền xóa mọi tài liệu lưu trên mạng."],"answer":["F","T","T","F"],"explain":"a) Sai: mạng cho phép chia sẻ dữ liệu trực tiếp không cần USB. b) Đúng: dùng chung máy in qua mạng tiết kiệm chi phí. c) Sai: virus có thể lây lan qua mạng sang máy khác. d) Sai: quản trị viên phân quyền để bảo vệ tài liệu, không phải ai cũng được xóa.","points":1},{"type":"truefalse","level":"TH","q":"Bảng LUONG(MaNV, HoTen, PhongBan, Luong) lưu lương nhân viên công ty:","statements":["a) Có thể tính tổng lương của từng phòng ban từ bảng này.","b) Có thể tìm nhân viên có mức lương cao nhất bằng cách sắp xếp.","c) Trường PhongBan cho biết nhân viên thuộc phòng nào.","d) Muốn lưu thêm số điện thoại, bắt buộc phải tạo bảng mới hoàn toàn."],"answer":["T","T","T","F"],"explain":"a) Đúng: dùng chức năng thống kê theo nhóm. b) Đúng: sắp xếp giảm dần theo Luong. c) Đúng: đó là ý nghĩa của trường PhongBan. d) Sai: chỉ cần thêm một trường mới vào bảng hiện có.","points":1},{"type":"truefalse","level":"VD","q":"Xét đoạn chương trình Python: cho danh sách diem = [7, 8, 5, 9]; tính tổng bằng vòng lặp rồi chia cho số phần tử để được điểm trung bình.","statements":["a) Danh sách diem có 4 phần tử.","b) Tổng các phần tử của danh sách là 30.","c) Điểm trung bình tính được là 7.25.","d) Muốn thêm điểm 10 vào danh sách, ta không thể thay đổi danh sách đã tạo."],"answer":["T","F","T","F"],"explain":"a) Đúng: danh sách có 4 số. b) Sai: 7 + 8 + 5 + 9 = 29. c) Đúng: 29 chia 4 = 7.25. d) Sai: danh sách trong Python có thể thêm, bớt phần tử.","points":1},{"type":"truefalse","level":"TH","q":"Khi định dạng trang web bằng CSS, một số bạn phát biểu:","statements":["a) Thuộc tính text-align giúp căn lề văn bản như căn giữa.","b) Có thể đặt màu nền cho trang web bằng thuộc tính background-color.","c) Muốn chữ to hơn, ta giảm giá trị của thuộc tính font-size.","d) CSS chỉ dùng để tạo bảng, không định dạng được chữ."],"answer":["T","T","F","F"],"explain":"a) Đúng: text-align căn lề văn bản. b) Đúng: background-color đặt màu nền. c) Sai: tăng font-size thì chữ mới to hơn. d) Sai: CSS định dạng được hầu hết mọi yếu tố hiển thị.","points":1},{"type":"truefalse","level":"TH","q":"Trường tạo biểu mẫu đăng ký tham gia câu lạc bộ trên website:","statements":["a) Biểu mẫu trên web không lưu trữ được thông tin người đăng ký.","b) Nên có ô để học sinh chọn câu lạc bộ mình muốn tham gia.","c) Không cần thông báo mục đích sử dụng thông tin đã thu thập.","d) Nên yêu cầu học sinh cung cấp mật khẩu tài khoản ngân hàng để xác minh."],"answer":["F","T","F","T"],"explain":"a) Sai: biểu mẫu web tự động lưu trữ thông tin đăng ký. b) Đúng: ô chọn giúp phân loại nguyện vọng. c) Sai: cần minh bạch mục đích sử dụng để bảo vệ quyền riêng tư. d) Sai: tuyệt đối không thu thập thông tin nhạy cảm như mật khẩu ngân hàng.","points":1},{"type":"truefalse","level":"VD","q":"Nhóm bạn dựng video phóng sự về chợ nổi quê hương:","statements":["a) Nên viết kịch bản trước để xác định nội dung từng cảnh quay.","b) Video phóng sự không được phép lồng tiếng thuyết minh.","c) Không cần thêm phụ đề vì mọi người đều nghe được.","d) Quay xong là đăng ngay, không cần xem lại và chỉnh sửa."],"answer":["T","F","F","T"],"explain":"a) Đúng: kịch bản giúp quay phim có định hướng. b) Sai: lồng tiếng thuyết minh giúp giải thích rõ nội dung video. c) Sai: phụ đề giúp người khiếm thính và người xem ở nơi ồn ào theo dõi được. d) Sai: cần xem lại, cắt ghép và chỉnh sửa trước khi công bố.","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Ảnh số được tạo thành từ các đơn vị nhỏ nào?","options":["A. Hạt cát","B. Điểm ảnh","C. Giọt nước","D. Sợi chỉ"],"answer":"B","explain":"Ảnh số gồm hàng triệu điểm ảnh (pixel); càng nhiều điểm ảnh, ảnh càng sắc nét.","points":0.25},{"type":"mcq","level":"TH","q":"Âm thanh được lưu dưới dạng số nhờ quá trình nào?","options":["A. Lấy mẫu và mã hóa tín hiệu âm thanh thành dãy số","B. Vẽ lại bằng tay","C. Chụp ảnh sóng âm","D. Ghi chép bằng chữ"],"answer":"A","explain":"Âm thanh số được tạo bằng cách lấy mẫu tín hiệu liên tục rồi mã hóa thành dãy số để lưu trữ.","points":0.25},{"type":"mcq","level":"NB","q":"Đồng hồ thông minh (smartwatch) có thể làm gì?","options":["A. Đo nhịp tim, đếm bước chân và nhận thông báo","B. Nấu cơm","C. Giặt quần áo","D. Tự lái xe"],"answer":"A","explain":"Smartwatch là thiết bị thông minh đeo tay, tích hợp cảm biến sức khỏe và kết nối điện thoại.","points":0.25},{"type":"mcq","level":"TH","q":"Đồng bộ dữ liệu giữa điện thoại và máy tính có lợi ích gì?","options":["A. Làm mất dữ liệu","B. Dữ liệu được cập nhật giống nhau trên mọi thiết bị","C. Tốn pin mà không có ích","D. Làm chậm thiết bị"],"answer":"B","explain":"Đồng bộ giúp cùng một dữ liệu luôn mới nhất trên mọi thiết bị, tiện làm việc và học tập.","points":0.25},{"type":"mcq","level":"TH","q":"Khi bộ nhớ điện thoại đầy, cách xử lý nào sau đây hợp lý?","options":["A. Mua điện thoại mới ngay","B. Xóa tệp không cần thiết, chuyển ảnh lên đám mây rồi xóa bản trên máy","C. Xóa hết mọi thứ kể cả dữ liệu quan trọng","D. Không làm gì cả"],"answer":"B","explain":"Dọn tệp rác và chuyển dữ liệu ít dùng lên đám mây là cách giải phóng bộ nhớ hiệu quả, tiết kiệm.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn V quay 20 ảnh, mỗi ảnh 5 MB và muốn lưu vào USB 128 MB. Kết luận nào đúng?","options":["A. Không lưu vừa vì ảnh quá nhiều","B. USB không lưu được ảnh","C. Phải mua USB mới","D. Không đủ vì 20 x 5 = 100 MB nhỏ hơn 128 MB nên lưu vừa"],"answer":"D","explain":"Tổng 100 MB nhỏ hơn 128 MB nên USB đủ chỗ lưu cả 20 ảnh.","points":0.25},{"type":"mcq","level":"NB","q":"Ví dụ nào sau đây là ứng dụng IoT trong giao thông?","options":["A. Hệ thống thu phí tự động không dừng","B. Xe đạp thông thường","C. Đi bộ","D. Thuyền nan"],"answer":"A","explain":"Thu phí tự động dùng cảm biến và kết nối mạng để nhận diện xe, là ứng dụng điển hình của IoT.","points":0.25},{"type":"mcq","level":"TH","q":"Chia sẻ tài liệu qua đám mây có ưu điểm gì so với gửi USB?","options":["A. Nhiều người cùng truy cập, chỉnh sửa mà không cần gặp trực tiếp","B. Chậm hơn","C. Tốn tiền hơn","D. Không ai dùng được"],"answer":"A","explain":"Tài liệu đám mây cho phép cộng tác trực tuyến theo thời gian thực, tiện cho học nhóm.","points":0.25},{"type":"mcq","level":"TH","q":"Khi mở nhiều trang web cùng lúc, trình duyệt sắp xếp chúng như thế nào?","options":["A. Trộn lẫn thành một trang","B. Mỗi trang một thẻ (tab) riêng để dễ chuyển đổi","C. Tự đóng bớt","D. Không mở được nhiều trang"],"answer":"B","explain":"Trình duyệt dùng thẻ (tab) để quản lý nhiều trang web cùng lúc, chuyển đổi nhanh giữa các thẻ.","points":0.25},{"type":"mcq","level":"TH","q":"Trước khi mở tệp đính kèm trong email, em nên làm gì?","options":["A. Mở ngay không cần kiểm tra","B. Chuyển tiếp cho bạn mở hộ","C. Kiểm tra người gửi có tin cậy không và quét virus cho tệp","D. Xóa email luôn"],"answer":"C","explain":"Tệp đính kèm có thể chứa mã độc; cần xác minh người gửi và quét virus trước khi mở.","points":0.25},{"type":"mcq","level":"NB","q":"Thư rác (spam) là gì?","options":["A. Thư của thầy cô","B. Thư của bạn bè","C. Thư quảng cáo, lừa đảo được gửi hàng loạt khi chưa được đồng ý","D. Thư cảm ơn"],"answer":"C","explain":"Thư rác gây phiền phức và có thể chứa lừa đảo; nên đánh dấu spam và không bấm link trong thư.","points":0.25},{"type":"mcq","level":"VD","q":"Lớp 12B cần họp trực tuyến với trường kết nghĩa ở tỉnh khác. Giải pháp nào phù hợp nhất?","options":["A. Gửi thư tay","B. Dùng phần mềm họp trực tuyến có chia sẻ màn hình và thảo luận nhóm","C. Đi bộ tới trường bạn","D. Không họp nữa"],"answer":"B","explain":"Phần mềm họp trực tuyến hỗ trợ hình ảnh, âm thanh và chia sẻ tài liệu, phù hợp họp từ xa.","points":0.25},{"type":"mcq","level":"NB","q":"Đạo văn trong học tập là hành vi nào?","options":["A. Tự làm bài tập","B. Sao chép bài của người khác rồi nhận là của mình","C. Trao đổi ý tưởng với bạn","D. Đọc thêm tài liệu"],"answer":"B","explain":"Đạo văn là gian lận học thuật; khi tham khảo cần ghi rõ nguồn.","points":0.25},{"type":"mcq","level":"TH","q":"Dấu hiệu nào giúp nhận biết tin giả?","options":["A. Tin được đăng trên báo chính thống","B. Tin có nhiều nguồn kiểm chứng","C. Tin do thầy cô chia sẻ","D. Tiêu đề giật gân, không rõ nguồn, nội dung mâu thuẫn với nguồn tin cậy"],"answer":"D","explain":"Tin giả thường giật gân, thiếu nguồn rõ ràng; cần đối chiếu với báo chí và nguồn tin cậy.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao trẻ em cần được bảo vệ đặc biệt trên không gian mạng?","options":["A. Vì trẻ dễ bị dụ dỗ, tiếp cận nội dung xấu và bị xâm hại","B. Vì trẻ không được dùng Internet","C. Vì trẻ không biết chữ","D. Vì trẻ không thích công nghệ"],"answer":"A","explain":"Trẻ em dễ bị kẻ xấu dụ dỗ và ảnh hưởng bởi nội dung độc hại nên cần sự hướng dẫn, giám sát của người lớn.","points":0.25},{"type":"mcq","level":"TH","q":"Khi bình luận trên mạng, em cần lưu ý điều gì?","options":["A. Nói gì cũng được vì ẩn danh","B. Chửi bới cho thỏa thích","C. Dùng lời lẽ lịch sự, chịu trách nhiệm với phát ngôn của mình","D. Bịa đặt thoải mái"],"answer":"C","explain":"Phát ngôn trên mạng vẫn chịu trách nhiệm pháp lý; cần lịch sự và trung thực.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn X thấy một video bạo lực được chia sẻ trong nhóm lớp. Việc làm đúng nhất của X là gì?","options":["A. Chia sẻ tiếp cho vui","B. Tải về xem nhiều lần","C. Bình luận khen ngợi","D. Báo cáo video, nhắc các bạn không chia sẻ và báo thầy cô"],"answer":"D","explain":"Nội dung bạo lực cần được báo cáo và ngăn lan truyền; báo thầy cô để có hướng xử lý phù hợp.","points":0.25},{"type":"mcq","level":"TH","q":"Lời khuyên nào sau đây giúp sử dụng mạng xã hội lành mạnh?","options":["A. Dùng cả ngày không nghỉ","B. Kết bạn với mọi người lạ","C. Giới hạn thời gian, chọn lọc nội dung bổ ích và giữ thông tin cá nhân","D. Đăng mọi thông tin cá nhân"],"answer":"C","explain":"Dùng mạng xã hội điều độ, chọn nội dung tích cực và bảo vệ thông tin cá nhân giúp tránh nghiện mạng và rủi ro.","points":0.25},{"type":"mcq","level":"NB","q":"Nhóm nghề thiết kế web làm công việc gì?","options":["A. Sửa xe","B. Xây nhà","C. Trồng lúa","D. Thiết kế giao diện và xây dựng các trang web"],"answer":"D","explain":"Thiết kế web tạo ra các trang web đẹp, dễ dùng cho cá nhân và doanh nghiệp.","points":0.25},{"type":"mcq","level":"TH","q":"Người quản trị cơ sở dữ liệu chịu trách nhiệm gì?","options":["A. Dọn dẹp văn phòng","B. Pha cà phê","C. Trông xe","D. Đảm bảo dữ liệu được lưu trữ an toàn và truy xuất hiệu quả"],"answer":"D","explain":"Quản trị cơ sở dữ liệu vận hành hệ thống lưu trữ, phân quyền và sao lưu dữ liệu.","points":0.25},{"type":"mcq","level":"TH","q":"AI ứng dụng trong nông nghiệp như thế nào?","options":["A. Dự báo thời tiết, phát hiện sâu bệnh qua ảnh chụp","B. Thay nông dân trồng lúa hoàn toàn","C. Không có ứng dụng","D. Chỉ để chơi game"],"answer":"A","explain":"AI hỗ trợ nông nghiệp thông minh qua dự báo, giám sát cây trồng bằng thiết bị bay và cảm biến.","points":0.25},{"type":"mcq","level":"NB","q":"Công nghệ giúp bảo vệ môi trường thể hiện ở đâu?","options":["A. Xả rác bừa bãi","B. Chặt phá rừng","C. Hệ thống quan trắc chất lượng không khí tự động","D. Xả thải trực tiếp"],"answer":"C","explain":"Công nghệ quan trắc môi trường giúp phát hiện sớm ô nhiễm để xử lý kịp thời.","points":0.25},{"type":"mcq","level":"VD","q":"Một cửa hàng muốn bán hàng trực tuyến. Việc đầu tiên cần làm về mặt công nghệ là gì?","options":["A. Đóng cửa hàng","B. Ngừng bán hàng","C. Chỉ bán cho người quen","D. Xây dựng website hoặc gian hàng trên sàn thương mại điện tử uy tín"],"answer":"D","explain":"Bán hàng trực tuyến cần kênh bán trên mạng như website hoặc sàn thương mại điện tử để tiếp cận khách hàng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các công ty công nghệ coi dữ liệu là tài sản quan trọng?","options":["A. Vì dữ liệu để trang trí","B. Vì dữ liệu không có giá trị","C. Vì dữ liệu giúp hiểu khách hàng và ra quyết định kinh doanh đúng đắn","D. Vì luật bắt buộc"],"answer":"C","explain":"Phân tích dữ liệu giúp doanh nghiệp hiểu nhu cầu khách hàng, tối ưu sản phẩm và dịch vụ.","points":0.25},{"type":"truefalse","level":"TH","q":"Hai phòng máy của trường được nối mạng với nhau. Một số bạn phát biểu:","statements":["a) Kết nối không dây luôn ổn định hơn kết nối có dây.","b) Các máy trong hai phòng có thể chia sẻ tài liệu cho nhau qua mạng.","c) Muốn vào mạng, thiết bị nào cũng cần có địa chỉ để phân biệt.","d) Ngắt kết nối mạng là cách duy nhất để bảo vệ máy tính khỏi virus."],"answer":["F","T","T","T"],"explain":"a) Sai: mạng có dây ít nhiễu nên ổn định hơn wifi. b) Đúng: mạng nội bộ cho phép chia sẻ tài nguyên. c) Đúng: mỗi thiết bị có địa chỉ riêng để nhận diện. d) Sai: còn nhiều biện pháp như phần mềm diệt virus, tường lửa, cập nhật bản vá.","points":1},{"type":"truefalse","level":"TH","q":"Bảng KETQUA(MaHS, HoTen, DiemTB) lưu điểm trung bình học kỳ:","statements":["a) Có thể lọc ra các học sinh có điểm trung bình từ 8.0 trở lên để khen thưởng.","b) Có thể đếm số học sinh của từng mức xếp loại từ bảng này.","c) Sắp xếp theo DiemTB tăng dần sẽ đưa học sinh điểm cao nhất lên đầu.","d) Mỗi học sinh chỉ xuất hiện một lần trong bảng."],"answer":["T","T","F","T"],"explain":"a) Đúng: dùng điều kiện lọc DiemTB từ 8.0 trở lên. b) Đúng: dùng chức năng thống kê, đếm theo nhóm. c) Sai: tăng dần nghĩa là giá trị nhỏ lên trước, điểm cao nhất xuống cuối. d) Đúng: khóa chính MaHS đảm bảo mỗi học sinh một bản ghi duy nhất.","points":1},{"type":"truefalse","level":"VD","q":"Đoạn chương trình Python định nghĩa hàm tinh_tong(a, b) trả về tổng hai số, rồi gọi hàm với a = 12, b = 8.","statements":["a) Hàm giúp tái sử dụng đoạn mã tính tổng nhiều lần.","b) Khi gọi hàm với 12 và 8, kết quả trả về là 4.","c) Có thể gọi lại hàm với các số khác mà không cần viết lại.","d) Biến a, b trong hàm có thể dùng được ở mọi nơi trong chương trình."],"answer":["T","F","T","T"],"explain":"a) Đúng: hàm đóng gói công việc để dùng lại. b) Sai: 12 + 8 = 20. c) Đúng: chỉ cần gọi hàm với đối số mới. d) Sai: biến bên trong hàm là biến cục bộ, chỉ dùng được trong hàm.","points":1},{"type":"truefalse","level":"TH","q":"Để trang web của lớp có cùng kiểu chữ và màu sắc trên mọi trang, bạn T tách CSS ra tệp riêng:","statements":["a) Tách CSS ra tệp riêng thì các trang web không dùng được định dạng đó.","b) Trang HTML liên kết tới tệp CSS bằng thẻ link.","c) Sửa tệp CSS thì phải sửa lại từng trang web một.","d) Tách CSS riêng làm trang web không hiển thị được."],"answer":["F","T","F","T"],"explain":"a) Sai: một tệp CSS có thể dùng chung cho nhiều trang. b) Đúng: thẻ link liên kết tệp CSS ngoài. c) Sai: sửa một chỗ trong tệp CSS sẽ cập nhật cho tất cả các trang dùng nó. d) Sai: trang vẫn hiển thị bình thường khi liên kết đúng.","points":1},{"type":"truefalse","level":"TH","q":"Nhóm bạn thiết kế poster tuyên truyền tiết kiệm điện:","statements":["a) Nên chọn hình ảnh minh họa rõ ràng, phù hợp chủ đề.","b) Tiêu đề nên thật dài dòng để cung cấp nhiều thông tin.","c) Nên dùng ít màu sắc và thống nhất phông chữ cho dễ nhìn.","d) Cần kiểm tra lỗi chính tả trước khi in và dán poster."],"answer":["T","F","F","T"],"explain":"a) Đúng: hình ảnh phù hợp truyền tải thông điệp. b) Sai: tiêu đề cần ngắn gọn, nổi bật mới thu hút người xem. c) Đúng: ít màu sắc và thống nhất phông chữ giúp poster dễ nhìn. d) Đúng: lỗi chính tả làm giảm uy tín poster.","points":1},{"type":"truefalse","level":"VD","q":"Bạn S dùng bảng tính để theo dõi chi tiêu tháng của gia đình:","statements":["a) Có thể dùng hàm tính tổng để cộng nhanh các khoản chi.","b) Có thể vẽ biểu đồ từ số liệu để thấy khoản nào chi nhiều nhất.","c) Sắp xếp các khoản chi từ lớn đến nhỏ giúp dễ quan sát.","d) Bảng tính chỉ nhập được chữ, không tính toán được với số."],"answer":["T","T","T","F"],"explain":"a) Đúng: hàm tính tổng tự động cộng dãy số. b) Đúng: biểu đồ trực quan hóa số liệu. c) Đúng: sắp xếp giúp phân tích nhanh. d) Sai: bảng tính chuyên xử lý và tính toán với số.","points":1}]}]}
