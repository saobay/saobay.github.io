<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Công nghệ là gì?","options":["A. Chỉ là máy móc","B. Chỉ là phần mềm","C. Giải pháp, quy trình, kĩ thuật và phương tiện do con người tạo ra nhằm giải quyết vấn đề","D. Tài nguyên thiên nhiên"],"answer":"C","explain":"Công nghệ bao gồm tri thức, quy trình, kĩ thuật và phương tiện mà con người tạo ra để phục vụ đời sống và sản xuất.","points":0.25},{"type":"mcq","level":"NB","q":"Cuộc Cách mạng công nghiệp lần thứ nhất gắn liền với thành tựu nào?","options":["A. Động cơ hơi nước","B. Động cơ đốt trong","C. Điện và dây chuyền sản xuất","D. Công nghệ số"],"answer":"A","explain":"Cách mạng công nghiệp lần thứ nhất (cuối thế kỷ 18) gắn với động cơ hơi nước và cơ giới hóa.","points":0.25},{"type":"mcq","level":"TH","q":"Đặc trưng nổi bật của Cách mạng công nghiệp lần thứ tư là gì?","options":["A. Động cơ hơi nước","B. Dây chuyền sản xuất hàng loạt","C. Máy tính điện tử đơn thuần","D. Công nghệ số, sản xuất thông minh, kết nối vạn vật và trí tuệ nhân tạo"],"answer":"D","explain":"Cách mạng công nghiệp lần thứ tư dựa trên số hóa, IoT, AI và sản xuất thông minh.","points":0.25},{"type":"mcq","level":"TH","q":"Khi đánh giá một sản phẩm công nghệ, cần xem xét tiêu chí nào?","options":["A. Chỉ cần giá rẻ","B. Chỉ cần mẫu mã đẹp","C. Tính hữu ích, an toàn, hiệu quả kinh tế và thân thiện môi trường","D. Chỉ cần quảng cáo hay"],"answer":"C","explain":"Đánh giá công nghệ cần toàn diện: đáp ứng nhu cầu, an toàn cho người dùng, hiệu quả kinh tế và bảo vệ môi trường.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu vuông góc của một vật thể là gì?","options":["A. Hình vẽ tự do theo cảm hứng","B. Hình biểu diễn vật thể trên mặt phẳng chiếu theo hướng vuông góc với mặt phẳng đó","C. Hình chụp bằng máy ảnh","D. Hình vẽ phối cảnh"],"answer":"B","explain":"Hình chiếu vuông góc thu được khi chiếu vật thể lên mặt phẳng theo hướng vuông góc, là cơ sở của bản vẽ kĩ thuật.","points":0.25},{"type":"mcq","level":"NB","q":"Có bao nhiêu hình chiếu vuông góc cơ bản thường dùng trong bản vẽ kĩ thuật?","options":["A. 3 hình chiếu: đứng, bằng và cạnh","B. 1 hình chiếu","C. 2 hình chiếu","D. 6 hình chiếu"],"answer":"A","explain":"Ba hình chiếu cơ bản là hình chiếu đứng, hình chiếu bằng và hình chiếu cạnh, đủ để mô tả vật thể.","points":0.25},{"type":"mcq","level":"TH","q":"Hình cắt dùng để làm gì trong bản vẽ kĩ thuật?","options":["A. Trang trí bản vẽ","B. Ghi kích thước","C. Biểu diễn cấu tạo bên trong của vật thể","D. Vẽ khung tên"],"answer":"C","explain":"Hình cắt tưởng tượng cắt vật thể để lộ cấu tạo bên trong, giúp đọc hiểu các chi tiết ẩn.","points":0.25},{"type":"mcq","level":"NB","q":"Bản vẽ chi tiết dùng để làm gì?","options":["A. Quảng cáo sản phẩm","B. Chế tạo và kiểm tra chi tiết máy","C. Trang trí","D. Viết hướng dẫn sử dụng"],"answer":"B","explain":"Bản vẽ chi tiết thể hiện đầy đủ hình dạng, kích thước, vật liệu để chế tạo và kiểm tra chi tiết.","points":0.25},{"type":"mcq","level":"VD","q":"Để biểu diễn một chi tiết máy có nhiều lỗ và rãnh bên trong, cách thể hiện nào sau đây rõ ràng nhất?","options":["A. Dùng hình cắt trên các hình chiếu vuông góc","B. Chỉ vẽ hình chiếu đứng","C. Vẽ hình minh họa tự do","D. Không cần vẽ"],"answer":"A","explain":"Hình cắt làm lộ các chi tiết bên trong như lỗ, rãnh nên thể hiện rõ ràng nhất cấu tạo phức tạp.","points":0.25},{"type":"mcq","level":"NB","q":"Vật liệu nào sau đây thuộc nhóm kim loại đen?","options":["A. Đồng và nhôm","B. Thép và gang","C. Nhựa và cao su","D. Gỗ và tre"],"answer":"B","explain":"Kim loại đen chủ yếu là sắt và hợp kim của sắt như thép, gang; đồng, nhôm là kim loại màu.","points":0.25},{"type":"mcq","level":"TH","q":"Công nghệ đúc kim loại là gì?","options":["A. Dùng búa đập kim loại","B. Cắt kim loại bằng dao","C. Nối các chi tiết bằng bu lông","D. Nấu chảy kim loại rồi rót vào khuôn để tạo hình sản phẩm"],"answer":"D","explain":"Đúc là rót kim loại lỏng vào khuôn, chờ đông đặc để được chi tiết có hình dạng phức tạp.","points":0.25},{"type":"mcq","level":"TH","q":"Phương pháp gia công nào dùng ngoại lực làm kim loại biến dạng để tạo hình?","options":["A. Đúc","B. Cắt gọt","C. Gia công áp lực như rèn, dập","D. Hàn"],"answer":"C","explain":"Gia công áp lực (rèn, dập, cán, kéo) dùng lực ép làm kim loại biến dạng dẻo thành hình dạng mong muốn.","points":0.25},{"type":"mcq","level":"VD","q":"Cần chế tạo một trục máy đòi hỏi độ chính xác cao và bề mặt nhẵn bóng. Nên chọn công nghệ nào?","options":["A. Đúc trong khuôn cát","B. Rèn tự do","C. Hàn hồ quang","D. Cắt gọt kim loại như tiện, mài"],"answer":"D","explain":"Cắt gọt kim loại (tiện, phay, mài) cho độ chính xác và độ bóng bề mặt cao, phù hợp chi tiết máy chính xác.","points":0.25},{"type":"mcq","level":"NB","q":"Nguồn năng lượng nào sau đây là năng lượng tái tạo?","options":["A. Than đá","B. Dầu mỏ","C. Năng lượng mặt trời và năng lượng gió","D. Khí đốt"],"answer":"C","explain":"Mặt trời, gió, thủy triều là năng lượng tái tạo, không cạn kiệt; than đá, dầu mỏ là nhiên liệu hóa thạch.","points":0.25},{"type":"mcq","level":"TH","q":"Để giảm hao phí điện năng khi truyền tải đi xa, biện pháp hiệu quả nhất là gì?","options":["A. Tăng điện áp truyền tải bằng máy biến áp tăng áp","B. Giảm điện áp truyền tải","C. Dùng dây dẫn thật nhỏ","D. Truyền tải vào ban đêm"],"answer":"A","explain":"Tăng điện áp làm giảm dòng điện trên đường dây, từ đó giảm hao phí tỏa nhiệt khi truyền tải xa.","points":0.25},{"type":"mcq","level":"NB","q":"Đồ dùng điện nào sau đây thuộc nhóm điện – quang?","options":["A. Bàn là và ấm điện","B. Đèn LED và đèn huỳnh quang","C. Quạt điện và máy bơm nước","D. Máy sấy tóc"],"answer":"B","explain":"Nhóm điện – quang biến điện năng thành quang năng như các loại đèn; bàn là thuộc điện – nhiệt; quạt thuộc điện – cơ.","points":0.25},{"type":"mcq","level":"NB","q":"Đồ dùng điện – nhiệt biến đổi điện năng thành dạng năng lượng nào?","options":["A. Quang năng","B. Cơ năng","C. Hóa năng","D. Nhiệt năng"],"answer":"D","explain":"Đồ dùng điện – nhiệt như bàn là, ấm điện, nồi cơm điện biến điện năng thành nhiệt năng để đun nấu, là ủi.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao dây dẫn điện trong nhà thường làm bằng đồng?","options":["A. Vì đồng rất rẻ","B. Vì đồng cách điện tốt","C. Vì đồng nhẹ nhất","D. Vì đồng dẫn điện tốt và dễ kéo thành sợi"],"answer":"D","explain":"Đồng có độ dẫn điện cao, dẻo dễ kéo sợi nên được dùng phổ biến làm dây dẫn điện.","points":0.25},{"type":"mcq","level":"NB","q":"Thiết bị nào sau đây dùng để đóng, cắt mạch điện?","options":["A. Cầu dao, công tắc và aptomat","B. Bóng đèn","C. Ổ cắm","D. Dây dẫn"],"answer":"A","explain":"Cầu dao, công tắc, aptomat là thiết bị đóng cắt; bóng đèn là thiết bị tiêu thụ điện.","points":0.25},{"type":"mcq","level":"VD","q":"Gia đình bạn H thường dùng nhiều thiết bị điện cùng lúc vào giờ cao điểm. Biện pháp nào sau đây vừa tiết kiệm điện vừa an toàn?","options":["A. Cứ dùng thoải mái, không cần quan tâm","B. Dùng thiết bị tiết kiệm điện, tắt thiết bị không cần thiết và tránh dùng dồn vào giờ cao điểm","C. Tự ý câu điện trực tiếp","D. Dùng dây dẫn nhỏ cho rẻ"],"answer":"B","explain":"Tiết kiệm điện bằng thiết bị hiệu suất cao, tắt khi không dùng và tránh giờ cao điểm; tuyệt đối không câu điện trái phép.","points":0.25},{"type":"mcq","level":"NB","q":"Linh kiện nào sau đây thuộc nhóm linh kiện thụ động?","options":["A. Điện trở, tụ điện và cuộn cảm","B. Diode và transistor","C. Mạch tích hợp","D. Cảm biến"],"answer":"A","explain":"Linh kiện thụ động không khuếch đại tín hiệu gồm điện trở, tụ điện, cuộn cảm; diode, transistor là linh kiện tích cực.","points":0.25},{"type":"mcq","level":"NB","q":"Diode bán dẫn có chức năng gì?","options":["A. Cho dòng điện đi qua mọi chiều","B. Cản trở hoàn toàn dòng điện","C. Chỉ cho dòng điện đi qua theo một chiều nhất định","D. Tích trữ điện năng"],"answer":"C","explain":"Diode chỉ dẫn điện theo một chiều từ anot sang catot, dùng để chỉnh lưu, bảo vệ mạch.","points":0.25},{"type":"mcq","level":"TH","q":"Transistor có thể được dùng để làm gì trong mạch điện tử?","options":["A. Phát sáng","B. Khuếch đại tín hiệu và đóng cắt dòng điện","C. Tích trữ điện tích lớn","D. Tạo ra điện áp cao"],"answer":"B","explain":"Transistor là linh kiện tích cực, dùng khuếch đại tín hiệu yếu và làm khóa điện tử đóng cắt mạch.","points":0.25},{"type":"mcq","level":"VD","q":"Trong hệ thống báo động, khi cảm biến phát hiện chuyển động thì chuông tự động kêu. Đây là ví dụ về gì?","options":["A. Điều khiển bằng tay","B. Mạch điện bị chập","C. Thiết bị hỏng","D. Điều khiển tự động theo tín hiệu từ cảm biến"],"answer":"D","explain":"Hệ thống tự động nhận tín hiệu cảm biến và thực hiện hành động mà không cần con người can thiệp là điều khiển tự động.","points":0.25},{"type":"truefalse","level":"TH","q":"Một nhóm học sinh tìm hiểu về công nghệ in 3D và đưa ra ý kiến:","statements":["a) In 3D tạo ra sản phẩm bằng cách bồi đắp các lớp vật liệu chồng lên nhau.","b) In 3D chỉ in được duy nhất vật liệu nhựa.","c) In 3D giúp tạo mẫu nhanh trong thiết kế và chế tạo.","d) Công nghệ in 3D không có ứng dụng nào trong y tế."],"answer":["T","F","T","F"],"explain":"a) Đúng: in 3D bồi đắp từng lớp vật liệu theo mô hình số. b) Sai: in 3D in được nhựa, kim loại, gốm và cả vật liệu sinh học. c) Đúng: tạo mẫu nhanh là ứng dụng phổ biến của in 3D. d) Sai: in 3D được dùng để tạo mô hình giải phẫu, chân tay giả trong y tế.","points":1},{"type":"truefalse","level":"TH","q":"Để sử dụng điện tiết kiệm và hiệu quả trong gia đình, một số bạn đề xuất:","statements":["a) Dùng đèn LED thay cho đèn sợi đốt.","b) Tắt các thiết bị điện khi không sử dụng.","c) Chọn thiết bị có công suất càng lớn càng tiết kiệm điện.","d) Nên tập trung dùng nhiều thiết bị vào giờ cao điểm."],"answer":["T","T","F","F"],"explain":"a) Đúng: đèn LED tiêu thụ ít điện hơn nhiều so với đèn sợi đốt. b) Đúng: tắt thiết bị không dùng tránh lãng phí. c) Sai: nên chọn công suất phù hợp nhu cầu, công suất lớn tốn điện hơn. d) Sai: nên tránh giờ cao điểm để giảm tải cho lưới điện.","points":1},{"type":"truefalse","level":"VD","q":"Quan sát một vật thể dạng hộp có lỗ tròn xuyên suốt, một số bạn nhận xét:","statements":["a) Vẽ hình cắt không cần thiết vì hình chiếu đã thể hiện hết cấu tạo bên trong.","b) Phần vật thể bị mặt phẳng cắt qua được kẻ gạch chéo.","c) Trên bản vẽ phải ghi kích thước đường kính của lỗ.","d) Ba hình chiếu vuông góc giúp mô tả đầy đủ vật thể."],"answer":["F","T","T","T"],"explain":"a) Sai: hình chiếu không thể hiện lỗ bên trong, cần dùng hình cắt. b) Đúng: quy ước kẻ gạch chéo phần bị mặt phẳng cắt qua. c) Đúng: kích thước lỗ là thông tin bắt buộc để chế tạo. d) Đúng: ba hình chiếu đứng, bằng, cạnh mô tả đầy đủ vật thể.","points":1},{"type":"truefalse","level":"VD","q":"Mạch đèn cầu thang bật và tắt được ở cả hai đầu cầu thang. Một số bạn phát biểu:","statements":["a) Mạch này dùng hai công tắc ba cực.","b) Mạch điện này hoạt động mà không cần nguồn điện.","c) Có thể thay bằng cảm biến chuyển động để thành điều khiển tự động.","d) Đây là ví dụ về điều khiển bằng tay."],"answer":["T","F","T","T"],"explain":"a) Đúng: mạch đèn cầu thang dùng hai công tắc ba cực. b) Sai: mọi mạch điện đều cần nguồn điện mới hoạt động. c) Đúng: cảm biến giúp tự động bật tắt khi có người. d) Đúng: con người trực tiếp bật tắt là điều khiển bằng tay.","points":1}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Hệ thống kĩ thuật gồm các phần nào?","options":["A. Đầu vào, quá trình xử lý và đầu ra","B. Chỉ có đầu vào","C. Chỉ có đầu ra","D. Không có phần nào"],"answer":"A","explain":"Mọi hệ thống kĩ thuật đều có đầu vào (năng lượng, vật liệu, thông tin), quá trình xử lý và đầu ra (sản phẩm).","points":0.25},{"type":"mcq","level":"TH","q":"Một chiếc xe đạp điện được đánh giá tốt khi nào?","options":["A. Khi giá thật rẻ dù nhanh hỏng","B. Khi mẫu mã đẹp dù không an toàn","C. Khi di chuyển thuận tiện, tiết kiệm, an toàn và thân thiện môi trường","D. Khi quảng cáo hay"],"answer":"C","explain":"Đánh giá sản phẩm công nghệ dựa trên tính hữu ích, an toàn, hiệu quả kinh tế và môi trường.","points":0.25},{"type":"mcq","level":"NB","q":"Cách mạng công nghiệp lần thứ hai gắn với thành tựu nào?","options":["A. Động cơ hơi nước","B. Internet","C. Trí tuệ nhân tạo","D. Điện năng và dây chuyền sản xuất hàng loạt"],"answer":"D","explain":"Cách mạng công nghiệp lần thứ hai (cuối thế kỷ 19) gắn với điện năng và sản xuất hàng loạt.","points":0.25},{"type":"mcq","level":"TH","q":"Nghề kĩ sư cơ khí làm công việc gì?","options":["A. Dạy học văn","B. Bán hàng","C. Trồng cây","D. Thiết kế, chế tạo và vận hành các máy móc, thiết bị cơ khí"],"answer":"D","explain":"Kĩ sư cơ khí thiết kế, chế tạo, lắp đặt và bảo trì hệ thống máy móc trong công nghiệp.","points":0.25},{"type":"mcq","level":"TH","q":"Mặt cắt và hình cắt khác nhau ở điểm nào?","options":["A. Hai loại hoàn toàn giống nhau","B. Mặt cắt chỉ vẽ phần vật thể bị cắt qua; hình cắt vẽ cả phần bị cắt và phần còn lại","C. Mặt cắt vẽ toàn bộ vật thể","D. Hình cắt không vẽ phần bị cắt"],"answer":"B","explain":"Mặt cắt chỉ thể hiện tiết diện nơi bị cắt; hình cắt thể hiện cả tiết diện và phần vật thể phía sau mặt cắt.","points":0.25},{"type":"mcq","level":"NB","q":"Bản vẽ lắp dùng để làm gì?","options":["A. Chế tạo từng chi tiết","B. Quảng cáo","C. Trang trí","D. Thể hiện vị trí tương quan giữa các chi tiết để lắp ráp sản phẩm"],"answer":"D","explain":"Bản vẽ lắp cho biết cách lắp các chi tiết thành sản phẩm hoàn chỉnh, kèm bảng kê chi tiết.","points":0.25},{"type":"mcq","level":"NB","q":"Khung tên trên bản vẽ kĩ thuật cho biết thông tin gì?","options":["A. Giá bán sản phẩm","B. Quảng cáo","C. Tên sản phẩm, vật liệu, tỉ lệ, người vẽ và ngày vẽ","D. Hướng dẫn sử dụng"],"answer":"C","explain":"Khung tên ghi các thông tin quản lý bản vẽ: tên gọi, vật liệu, tỉ lệ, người thiết kế, ngày tháng.","points":0.25},{"type":"mcq","level":"NB","q":"Tỉ lệ 1:2 trên bản vẽ kĩ thuật có nghĩa là gì?","options":["A. Kích thước vẽ gấp đôi kích thước thật","B. Kích thước vẽ bằng kích thước thật","C. Không có ý nghĩa","D. Kích thước vẽ nhỏ bằng một nửa kích thước thật"],"answer":"D","explain":"Tỉ lệ 1:2 là tỉ lệ thu nhỏ, hình vẽ bằng một nửa vật thật; 2:1 là phóng to gấp đôi.","points":0.25},{"type":"mcq","level":"VD","q":"Cần vẽ một chi tiết dài 200 mm vào khổ giấy nhỏ. Nên chọn tỉ lệ nào?","options":["A. 2:1 để phóng to","B. 1:2 hoặc nhỏ hơn để hình vẽ vừa khổ giấy","C. 1:1 dù không vừa giấy","D. Vẽ tùy ý không theo tỉ lệ"],"answer":"B","explain":"Chi tiết lớn hơn khổ giấy phải vẽ theo tỉ lệ thu nhỏ như 1:2, 1:5 để vừa giấy và đúng quy định.","points":0.25},{"type":"mcq","level":"NB","q":"Vật liệu nào sau đây là vật liệu phi kim loại?","options":["A. Nhựa và cao su","B. Thép và gang","C. Đồng và nhôm","D. Vàng và bạc"],"answer":"A","explain":"Nhựa, cao su, gốm, gỗ là vật liệu phi kim loại; thép, gang, đồng, nhôm là kim loại.","points":0.25},{"type":"mcq","level":"NB","q":"Công nghệ hàn là gì?","options":["A. Cắt kim loại","B. Nối các chi tiết kim loại bằng cách nung nóng chảy mép hàn","C. Đập kim loại cho dẹt","D. Rót kim loại vào khuôn"],"answer":"B","explain":"Hàn dùng nhiệt nung chảy mép các chi tiết để nối chúng thành một khối vững chắc.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của phương pháp rèn so với đúc là gì?","options":["A. Chi tiết rèn có độ bền cơ học cao hơn","B. Rèn tạo được hình dạng phức tạp hơn đúc","C. Rèn rẻ hơn đúc","D. Rèn không cần nung nóng"],"answer":"A","explain":"Rèn làm hạt kim loại mịn, thớ kim loại liên tục nên chi tiết bền hơn; đúc tạo hình phức tạp hơn.","points":0.25},{"type":"mcq","level":"VD","q":"Cần chế tạo một chiếc đe thợ rèn chịu lực va đập lớn. Nên chọn công nghệ nào?","options":["A. Rèn từ phôi thép","B. Đúc bằng nhựa","C. Cắt bằng giấy","D. Dán bằng keo"],"answer":"A","explain":"Đe chịu va đập mạnh cần độ bền cao nên rèn từ thép là phù hợp nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Nhà máy thủy điện biến đổi dạng năng lượng nào thành điện năng?","options":["A. Hóa năng thành điện năng","B. Nhiệt năng thành điện năng","C. Thế năng của nước thành điện năng","D. Quang năng thành điện năng"],"answer":"C","explain":"Thủy điện dùng sức nước làm quay tuabin, biến cơ năng của dòng nước thành điện năng.","points":0.25},{"type":"mcq","level":"TH","q":"Hiện tượng sụt áp trên đường dây tải điện là gì?","options":["A. Điện áp tăng lên","B. Mất điện hoàn toàn","C. Dây bị đứt","D. Điện áp cuối đường dây thấp hơn đầu đường dây do hao phí"],"answer":"D","explain":"Dòng điện qua dây dẫn gây hao phí làm điện áp cuối đường dây thấp hơn đầu đường dây, gọi là sụt áp.","points":0.25},{"type":"mcq","level":"NB","q":"Aptomat có chức năng gì trong mạch điện gia đình?","options":["A. Tăng điện áp","B. Tự động ngắt mạch khi quá tải hoặc ngắn mạch","C. Giảm tiền điện","D. Phát sáng"],"answer":"B","explain":"Aptomat tự động cắt điện khi quá tải hay chập mạch, bảo vệ an toàn hơn cầu chì phải thay dây.","points":0.25},{"type":"mcq","level":"TH","q":"Cầu chì bảo vệ mạch điện như thế nào?","options":["A. Phát ra tiếng kêu","B. Tăng điện áp","C. Không có tác dụng","D. Dây chì nóng chảy và đứt khi dòng điện quá lớn, ngắt mạch"],"answer":"D","explain":"Khi quá tải, dây chì chảy đứt để ngắt mạch; sau đó phải thay dây chì mới.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao không được chạm tay ướt vào thiết bị điện?","options":["A. Vì làm bẩn thiết bị","B. Vì nước dẫn điện nên dễ bị điện giật","C. Vì thiết bị nhanh hỏng","D. Không có lý do"],"answer":"B","explain":"Tay ướt làm giảm điện trở cơ thể, dòng điện dễ truyền qua người gây nguy hiểm.","points":0.25},{"type":"mcq","level":"NB","q":"Dòng điện xoay chiều khác dòng điện một chiều ở điểm nào?","options":["A. Hai loại giống hệt nhau","B. Chiều dòng điện xoay chiều thay đổi liên tục theo thời gian","C. Dòng một chiều thay đổi chiều","D. Dòng xoay chiều không đổi"],"answer":"B","explain":"Dòng xoay chiều đổi chiều liên tục; dòng một chiều có chiều không đổi như từ pin, acquy.","points":0.25},{"type":"mcq","level":"VD","q":"Ổ cắm trong nhà bị tóe lửa khi cắm phích. Nguyên nhân có thể là gì và cần làm gì?","options":["A. Hiện tượng bình thường, cứ dùng tiếp","B. Do điện quá yếu","C. Tiếp xúc lỏng gây tóe lửa; cần ngắt điện và gọi thợ sửa chữa","D. Tự sửa khi đang có điện"],"answer":"C","explain":"Tóe lửa do tiếp xúc kém, dễ gây cháy; cần ngắt nguồn và nhờ thợ có chuyên môn kiểm tra, tuyệt đối không tự sửa khi có điện.","points":0.25},{"type":"mcq","level":"NB","q":"Tụ điện có chức năng gì?","options":["A. Khuếch đại tín hiệu","B. Phát sáng","C. Tích trữ và phóng điện tích","D. Cản trở hoàn toàn dòng điện"],"answer":"C","explain":"Tụ điện tích trữ điện tích khi nạp và phóng ra khi cần, dùng lọc nguồn, coupling tín hiệu.","points":0.25},{"type":"mcq","level":"NB","q":"Mạch tích hợp (IC) là gì?","options":["A. Nhiều linh kiện điện tử thu nhỏ trên một miếng bán dẫn","B. Một loại dây dẫn","C. Một loại pin","D. Công tắc cơ"],"answer":"A","explain":"IC tích hợp hàng nghìn đến hàng tỉ transistor trên chip nhỏ, là nền tảng của thiết bị số hiện nay.","points":0.25},{"type":"mcq","level":"TH","q":"Cảm biến trong hệ thống điều khiển có nhiệm vụ gì?","options":["A. Thu nhận tín hiệu từ môi trường như nhiệt độ, ánh sáng, chuyển động","B. Phát ra điện năng","C. Cắt mạch điện","D. Trang trí"],"answer":"A","explain":"Cảm biến biến đổi các đại lượng vật lý thành tín hiệu điện để hệ thống điều khiển xử lý.","points":0.25},{"type":"mcq","level":"VD","q":"Điều hòa tự động giữ nhiệt độ phòng ở 26 độ. Khi phòng nóng hơn, máy chạy mạnh hơn. Đây là ví dụ về gì?","options":["A. Điều khiển bằng tay","B. Máy bị hỏng","C. Điều khiển tự động theo tín hiệu phản hồi từ cảm biến nhiệt độ","D. Ngẫu nhiên"],"answer":"C","explain":"Cảm biến đo nhiệt độ, bộ điều khiển so sánh với giá trị đặt và điều chỉnh máy — đó là điều khiển tự động có phản hồi.","points":0.25},{"type":"truefalse","level":"TH","q":"Một nhóm học sinh tìm hiểu về robot công nghiệp và đưa ra ý kiến:","statements":["a) Robot công nghiệp thực hiện các công việc lặp đi lặp lại với độ chính xác cao.","b) Robot chỉ xuất hiện trong phim ảnh, không có trong thực tế.","c) Robot giúp tăng năng suất và giảm công việc nặng nhọc cho con người.","d) Mọi loại robot đều có hình dạng giống con người."],"answer":["T","F","T","F"],"explain":"a) Đúng: robot làm việc lặp lại chính xác như hàn, lắp ráp, sơn. b) Sai: robot được dùng rộng rãi trong nhà máy. c) Đúng: robot tăng năng suất, thay con người làm việc nặng nhọc, độc hại. d) Sai: robot công nghiệp thường là cánh tay máy, xe tự hành, không giống người.","points":1},{"type":"truefalse","level":"TH","q":"Trong giờ thực hành về an toàn điện, các bạn đưa ra ý kiến:","statements":["a) Không chạm tay ướt vào thiết bị điện.","b) Khi sửa chữa điện phải ngắt nguồn điện trước.","c) Dây điện bị hở vỏ vẫn dùng được bình thường.","d) Nên đứng trên ghế kim loại khi sửa điện cho vững."],"answer":["T","T","F","F"],"explain":"a) Đúng: tay ướt dễ bị điện giật. b) Đúng: ngắt nguồn là nguyên tắc an toàn đầu tiên. c) Sai: dây hở vỏ rất nguy hiểm, cần bọc lại hoặc thay mới. d) Sai: kim loại dẫn điện nên tuyệt đối không đứng trên ghế kim loại khi sửa điện.","points":1},{"type":"truefalse","level":"VD","q":"Khi đọc một bản vẽ lắp của sản phẩm, một số bạn phát biểu:","statements":["a) Bản vẽ lắp không cần bảng kê các chi tiết.","b) Bản vẽ lắp thể hiện vị trí tương quan giữa các chi tiết.","c) Bản vẽ lắp dùng để hướng dẫn lắp ráp sản phẩm.","d) Trên bản vẽ lắp không cần đánh số thứ tự các chi tiết."],"answer":["F","T","T","F"],"explain":"a) Sai: bản vẽ lắp luôn kèm bảng kê ghi tên, số lượng chi tiết. b) Đúng: bản vẽ lắp cho thấy các chi tiết lắp với nhau ra sao. c) Đúng: đó là mục đích chính của bản vẽ lắp. d) Sai: đánh số giúp tra cứu trong bảng kê.","points":1},{"type":"truefalse","level":"VD","q":"Xét mạch chỉnh lưu dùng diode biến dòng xoay chiều thành dòng một chiều:","statements":["a) Diode chỉ cho dòng điện đi qua theo một chiều.","b) Diode có thể khuếch đại tín hiệu như transistor.","c) Mọi loại diode đều phát sáng được.","d) Mạch chỉnh lưu dùng tính chất một chiều của diode."],"answer":["T","F","F","T"],"explain":"a) Đúng: tính chất cơ bản của diode. b) Sai: khuếch đại là chức năng của transistor, không phải diode. c) Sai: chỉ đèn LED mới phát sáng, diode thường không phát sáng. d) Đúng: chỉnh lưu dựa vào việc diode chỉ dẫn một chiều.","points":1}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Cách mạng công nghiệp lần thứ ba gắn với thành tựu nào?","options":["A. Máy tính điện tử và tự động hóa","B. Động cơ hơi nước","C. Động cơ đốt trong","D. Trí tuệ nhân tạo"],"answer":"A","explain":"Cách mạng công nghiệp lần thứ ba (cuối thế kỷ 20) gắn với điện tử, máy tính và tự động hóa.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói công nghệ có tính hai mặt?","options":["A. Vì công nghệ luôn tốt","B. Vì công nghệ vừa mang lại lợi ích vừa có thể gây tác hại nếu dùng sai cách","C. Vì công nghệ luôn xấu","D. Vì công nghệ có hai màu"],"answer":"B","explain":"Công nghệ giúp đời sống tốt hơn nhưng cũng gây ô nhiễm, thất nghiệp nếu không quản lý tốt.","points":0.25},{"type":"mcq","level":"TH","q":"Đánh giá công nghệ in 3D, ưu điểm nổi bật nhất là gì?","options":["A. Tạo được chi tiết phức tạp mà công nghệ truyền thống khó làm","B. Giá thành luôn rẻ nhất","C. Tốc độ nhanh nhất mọi trường hợp","D. Không cần thiết kế"],"answer":"A","explain":"In 3D bồi đắp từng lớp nên tạo được hình dạng phức tạp, rỗng bên trong mà đúc hay cắt gọt khó thực hiện.","points":0.25},{"type":"mcq","level":"NB","q":"Người làm nghề thiết kế cơ khí cần phẩm chất nào?","options":["A. Chỉ cần khỏe mạnh","B. Không cần học","C. Chỉ cần khéo tay","D. Sáng tạo, cẩn thận và nắm vững kiến thức kĩ thuật"],"answer":"D","explain":"Thiết kế cơ khí đòi hỏi sáng tạo, tính chính xác và nền tảng kiến thức kĩ thuật vững.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu cạnh của vật thể được vẽ nhìn từ hướng nào?","options":["A. Nhìn từ phía trước","B. Nhìn từ phía trên","C. Nhìn từ bên trái hoặc bên phải của vật thể","D. Nhìn từ phía dưới"],"answer":"C","explain":"Hình chiếu cạnh nhìn từ bên trái (hoặc phải); hình chiếu đứng nhìn từ trước; hình chiếu bằng nhìn từ trên.","points":0.25},{"type":"mcq","level":"TH","q":"Khi nào nên dùng mặt cắt thay vì hình cắt?","options":["A. Khi chỉ cần thể hiện tiết diện nơi bị cắt mà không cần phần còn lại","B. Khi muốn vẽ toàn bộ vật thể","C. Khi không có vật thể","D. Hai loại dùng như nhau"],"answer":"A","explain":"Mặt cắt gọn hơn, chỉ vẽ phần bị mặt phẳng cắt qua, phù hợp khi không cần thể hiện phần còn lại.","points":0.25},{"type":"mcq","level":"NB","q":"Đọc bản vẽ chi tiết, thông tin nào cho biết vật liệu chế tạo?","options":["A. Hình chiếu đứng","B. Thông tin trong khung tên và yêu cầu kĩ thuật","C. Đường bao","D. Khung vẽ"],"answer":"B","explain":"Vật liệu được ghi trong khung tên và phần yêu cầu kĩ thuật của bản vẽ chi tiết.","points":0.25},{"type":"mcq","level":"NB","q":"Đường nét liền đậm trên bản vẽ kĩ thuật dùng để vẽ gì?","options":["A. Đường bao thấy của vật thể","B. Đường bị khuất","C. Đường trục","D. Đường ghi kích thước"],"answer":"A","explain":"Nét liền đậm vẽ đường bao thấy; nét đứt vẽ đường khuất; nét chấm gạch vẽ trục; nét mảnh vẽ kích thước.","points":0.25},{"type":"mcq","level":"VD","q":"Trên bản vẽ, một lỗ tròn bị che khuất được thể hiện bằng nét gì?","options":["A. Nét liền đậm","B. Nét chấm gạch","C. Không vẽ","D. Nét đứt mảnh"],"answer":"D","explain":"Các đường bị khuất không nhìn thấy được vẽ bằng nét đứt mảnh theo quy ước bản vẽ kĩ thuật.","points":0.25},{"type":"mcq","level":"NB","q":"Gang khác thép ở điểm nào?","options":["A. Gang mềm hơn thép","B. Hai loại giống hệt nhau","C. Gang không phải kim loại","D. Gang có hàm lượng cacbon cao hơn thép nên cứng nhưng giòn hơn"],"answer":"D","explain":"Gang chứa nhiều cacbon hơn thép nên cứng, chịu mài mòn tốt nhưng giòn, khó rèn.","points":0.25},{"type":"mcq","level":"NB","q":"Phôi là gì trong công nghệ chế tạo cơ khí?","options":["A. Sản phẩm hoàn chỉnh","B. Chi tiết ở dạng ban đầu trước khi gia công thành sản phẩm","C. Dụng cụ cắt","D. Máy móc"],"answer":"B","explain":"Phôi là dạng ban đầu của chi tiết (phôi đúc, phôi rèn, phôi thanh) rồi gia công tiếp thành sản phẩm.","points":0.25},{"type":"mcq","level":"TH","q":"So với đúc, công nghệ rèn có nhược điểm gì?","options":["A. Chi tiết kém bền hơn","B. Khó tạo hình dạng phức tạp","C. Tốn nhiều vật liệu hơn","D. Không nung nóng được"],"answer":"B","explain":"Rèn cho chi tiết bền nhưng khó tạo hình phức tạp, rỗng; đúc tạo hình phức tạp dễ hơn.","points":0.25},{"type":"mcq","level":"VD","q":"Cần chế tạo hàng loạt nắp chai có hình dạng phức tạp, số lượng lớn. Nên chọn công nghệ nào?","options":["A. Rèn thủ công từng chiếc","B. Tiện từng chiếc","C. Đúc áp lực hoặc dập để tạo hình nhanh hàng loạt","D. Hàn từng chiếc"],"answer":"C","explain":"Chi tiết nhỏ, phức tạp, số lượng lớn nên đúc áp lực hoặc dập cho năng suất cao, giá thành thấp.","points":0.25},{"type":"mcq","level":"NB","q":"Máy biến áp dùng để làm gì?","options":["A. Biến dòng một chiều thành xoay chiều","B. Tích trữ điện","C. Phát điện","D. Tăng hoặc giảm điện áp của dòng xoay chiều"],"answer":"D","explain":"Máy biến áp thay đổi điện áp xoay chiều: tăng áp để truyền tải xa, hạ áp để sử dụng an toàn.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao điện áp truyền tải thường rất cao còn điện áp sử dụng lại thấp?","options":["A. Truyền tải áp cao giảm hao phí; sử dụng áp thấp để an toàn","B. Để tốn điện hơn","C. Không có lý do","D. Để khó sử dụng"],"answer":"A","explain":"Áp cao giảm dòng điện nên giảm hao phí đường dây; áp sử dụng thấp (220V) đảm bảo an toàn cho người dùng.","points":0.25},{"type":"mcq","level":"NB","q":"Đồ dùng điện nào sau đây thuộc nhóm điện – cơ?","options":["A. Đèn LED","B. Bàn là","C. Quạt điện và máy bơm nước","D. Ấm điện"],"answer":"C","explain":"Nhóm điện – cơ biến điện năng thành cơ năng như quạt, máy bơm, máy xay.","points":0.25},{"type":"mcq","level":"NB","q":"Công tơ điện trong gia đình dùng để làm gì?","options":["A. Tăng điện áp","B. Ngắt mạch điện","C. Đo lượng điện năng tiêu thụ","D. Phát điện"],"answer":"C","explain":"Công tơ điện đo điện năng tiêu thụ tính bằng kWh, làm căn cứ tính tiền điện.","points":0.25},{"type":"mcq","level":"TH","q":"Dây dẫn điện có vỏ bọc cách điện để làm gì?","options":["A. Trang trí cho đẹp","B. Ngăn dòng điện rò ra ngoài gây nguy hiểm","C. Tăng điện áp","D. Giảm tiền điện"],"answer":"B","explain":"Vỏ cách điện ngăn tiếp xúc trực tiếp với lõi dẫn điện, đảm bảo an toàn.","points":0.25},{"type":"mcq","level":"NB","q":"Khi phát hiện người bị điện giật, việc đầu tiên cần làm là gì?","options":["A. Nhanh chóng ngắt nguồn điện","B. Dùng tay kéo nạn nhân ra","C. Dội nước vào nạn nhân","D. Bỏ chạy"],"answer":"A","explain":"Ngắt nguồn điện trước rồi mới cứu người; tuyệt đối không chạm tay trực tiếp vào nạn nhân đang có điện.","points":0.25},{"type":"mcq","level":"VD","q":"Ổ cắm điện trong nhà đã cũ, vỏ nứt vỡ. Cách xử lý đúng nhất là gì?","options":["A. Dùng băng dính quấn lại rồi dùng tiếp","B. Cứ dùng bình thường","C. Ngắt điện và thay ổ cắm mới đạt chuẩn","D. Tự đấu nối khi đang có điện"],"answer":"C","explain":"Ổ cắm nứt vỡ dễ gây rò điện, chập cháy; cần ngắt nguồn và thay mới, không tự sửa khi có điện.","points":0.25},{"type":"mcq","level":"NB","q":"Cuộn cảm có đặc tính gì?","options":["A. Chỉ cho dòng một chiều đi qua","B. Phát sáng","C. Khuếch đại tín hiệu","D. Chống lại sự thay đổi đột ngột của dòng điện"],"answer":"D","explain":"Cuộn cảm tạo từ trường chống lại biến thiên dòng điện, dùng trong mạch lọc, biến áp.","points":0.25},{"type":"mcq","level":"TH","q":"Mạch khuếch đại dùng để làm gì?","options":["A. Làm tín hiệu yếu đi","B. Cắt tín hiệu","C. Tích trữ điện","D. Làm tín hiệu điện yếu trở nên mạnh hơn"],"answer":"D","explain":"Mạch khuếch đại dùng transistor để tăng biên độ tín hiệu yếu như trong loa, micro.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của mạch tích hợp so với mạch lắp linh kiện rời là gì?","options":["A. Dễ sửa chữa hơn","B. Giá luôn đắt hơn","C. Nhỏ gọn, tin cậy và tiêu thụ ít điện năng","D. To hơn"],"answer":"C","explain":"IC tích hợp hàng nghìn linh kiện trên chip nhỏ nên gọn, bền và tiết kiệm điện.","points":0.25},{"type":"mcq","level":"VD","q":"Chiếc loa bluetooth tự ngắt khi hết pin. Bộ phận nào giúp phát hiện pin yếu để tự ngắt?","options":["A. Loa","B. Mạch cảm biến và điều khiển điện tử","C. Vỏ nhựa","D. Nút bấm"],"answer":"B","explain":"Mạch điện tử đo điện áp pin, khi pin yếu sẽ tự ngắt để bảo vệ pin — ví dụ về điều khiển tự động đơn giản.","points":0.25},{"type":"truefalse","level":"VD","q":"Tìm hiểu về Cách mạng công nghiệp 4.0, một số bạn đưa ra ý kiến:","statements":["a) Cách mạng công nghiệp 4.0 gắn với công nghệ số và sản xuất thông minh.","b) Internet vạn vật giúp các máy móc trong nhà máy kết nối và trao đổi dữ liệu.","c) Trí tuệ nhân tạo là một trong những công nghệ nền tảng của cách mạng 4.0.","d) Cách mạng công nghiệp 4.0 chỉ diễn ra trong lĩnh vực nông nghiệp."],"answer":["T","T","T","F"],"explain":"a) Đúng: số hóa và sản xuất thông minh là đặc trưng của 4.0. b) Đúng: IoT kết nối máy móc trong nhà máy thông minh. c) Đúng: AI là công nghệ trụ cột của 4.0. d) Sai: 4.0 diễn ra trong mọi lĩnh vực công nghiệp và đời sống.","points":1},{"type":"truefalse","level":"TH","q":"Trạm biến áp gần khu dân cư có nhiệm vụ hạ áp để cấp điện sinh hoạt. Một số bạn phát biểu:","statements":["a) Có thể dùng trực tiếp điện cao thế cho sinh hoạt để khỏi cần trạm biến áp.","b) Máy biến áp trong trạm giúp hạ điện áp cao xuống 220V để dùng an toàn.","c) Truyền tải điện ở điện áp cao giúp giảm hao phí trên đường dây.","d) Trạm biến áp cần được bảo vệ, không cho người lạ tới gần."],"answer":["F","T","T","T"],"explain":"a) Sai: điện cao thế cực kỳ nguy hiểm, không dùng trực tiếp được. b) Đúng: hạ áp xuống mức an toàn cho sinh hoạt. c) Đúng: áp cao giảm dòng điện nên giảm hao phí. d) Đúng: trạm biến áp là nơi nguy hiểm, cần rào chắn bảo vệ.","points":1},{"type":"truefalse","level":"TH","q":"Một chi tiết máy có rãnh then bên trong. Khi vẽ hình cắt, một số bạn nhận xét:","statements":["a) Hình cắt giúp nhìn thấy rõ rãnh then bên trong chi tiết.","b) Hình cắt và mặt cắt là một, không có gì khác nhau.","c) Trên hình cắt không cần ghi kích thước.","d) Phần vật thể bị mặt phẳng cắt qua được kẻ gạch chéo."],"answer":["T","F","F","T"],"explain":"a) Đúng: hình cắt làm lộ cấu tạo bên trong. b) Sai: mặt cắt chỉ vẽ tiết diện, hình cắt vẽ cả phần còn lại của vật thể. c) Sai: bản vẽ kĩ thuật luôn cần đầy đủ kích thước. d) Đúng: quy ước kẻ gạch chéo phần bị cắt qua.","points":1},{"type":"truefalse","level":"VD","q":"Xét một mạch điện tử đơn giản dùng transistor làm khóa điện tử:","statements":["a) Transistor chỉ dùng để khuếch đại, không thể đóng cắt.","b) Transistor có thể đóng cắt dòng điện như một công tắc điện tử.","c) Mạch tích hợp không chứa transistor.","d) Khi transistor dẫn, dòng điện đi qua được mạch."],"answer":["F","T","F","T"],"explain":"a) Sai: transistor vừa khuếch đại vừa đóng cắt được. b) Đúng: transistor làm khóa điện tử đóng cắt nhanh. c) Sai: IC chứa hàng nghìn đến hàng tỉ transistor. d) Đúng: transistor dẫn cho dòng đi qua.","points":1}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Robot trong nhà máy thường được dùng để làm gì?","options":["A. Nấu ăn cho công nhân","B. Trông trẻ","C. Thực hiện công việc lặp đi lặp lại với độ chính xác cao","D. Dạy học"],"answer":"C","explain":"Robot công nghiệp làm các việc lặp lại như hàn, lắp ráp, sơn với độ chính xác cao.","points":0.25},{"type":"mcq","level":"TH","q":"Trí tuệ nhân tạo ứng dụng trong công nghiệp như thế nào?","options":["A. Kiểm tra chất lượng sản phẩm tự động qua hình ảnh","B. Thay thế hoàn toàn con người","C. Không có ứng dụng","D. Chỉ để chơi game"],"answer":"A","explain":"AI kiểm tra lỗi sản phẩm bằng thị giác máy, dự báo hỏng hóc máy móc, tối ưu sản xuất.","points":0.25},{"type":"mcq","level":"TH","q":"Công nghệ giúp bảo vệ môi trường bằng cách nào?","options":["A. Xả thải trực tiếp","B. Chặt phá rừng","C. Tăng khí thải","D. Xử lý chất thải, tiết kiệm năng lượng và dùng vật liệu sạch"],"answer":"D","explain":"Công nghệ xanh xử lý ô nhiễm, tiết kiệm tài nguyên và giảm phát thải.","points":0.25},{"type":"mcq","level":"NB","q":"Khởi nghiệp trong lĩnh vực công nghệ cần yếu tố nào?","options":["A. Chỉ cần nhiều tiền","B. Chỉ cần may mắn","C. Không cần kiến thức","D. Ý tưởng sáng tạo giải quyết vấn đề thực tế"],"answer":"D","explain":"Khởi nghiệp công nghệ thành công nhờ ý tưởng giải quyết vấn đề thật và năng lực thực hiện.","points":0.25},{"type":"mcq","level":"NB","q":"Kích thước trên bản vẽ kĩ thuật được ghi như thế nào?","options":["A. Ghi tùy ý","B. Ghi con số kích thước thật kèm đường gióng và đường kích thước","C. Không cần ghi","D. Chỉ ghi bằng chữ"],"answer":"B","explain":"Kích thước ghi con số thật (đơn vị mm) với đường gióng, đường kích thước theo quy ước.","points":0.25},{"type":"mcq","level":"TH","q":"Dung sai kích thước cho biết điều gì?","options":["A. Phạm vi cho phép sai lệch của kích thước khi chế tạo","B. Kích thước chính xác tuyệt đối","C. Không được sai lệch","D. Kích thước bản vẽ"],"answer":"A","explain":"Dung sai là phạm vi sai lệch cho phép; chế tạo thực tế không thể chính xác tuyệt đối.","points":0.25},{"type":"mcq","level":"TH","q":"Độ nhám bề mặt ảnh hưởng gì tới chi tiết máy?","options":["A. Không ảnh hưởng gì","B. Bề mặt càng nhẵn thì ma sát càng ít, chi tiết bền hơn","C. Bề mặt nhám tốt hơn","D. Chỉ để đẹp"],"answer":"B","explain":"Bề mặt nhẵn giảm ma sát, mài mòn, tăng tuổi thọ chi tiết máy.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu của khối hộp chữ nhật là hình gì?","options":["A. Hình tròn","B. Hình tam giác","C. Hình thang","D. Hình chữ nhật"],"answer":"D","explain":"Khối hộp chữ nhật chiếu vuông góc cho hình chữ nhật; khối trụ cho hình tròn ở một hướng.","points":0.25},{"type":"mcq","level":"VD","q":"Muốn kiểm tra một chi tiết trục có đạt kích thước 20 mm với dung sai cho phép 0,1 mm không, ta làm gì?","options":["A. Nhìn bằng mắt thường","B. Cân lên","C. Dùng thước cặp đo và so sánh với khoảng từ 19,9 đến 20,1 mm","D. Không cần kiểm tra"],"answer":"C","explain":"Dung sai 0,1 mm nghĩa là kích thước hợp lệ từ 19,9 đến 20,1 mm; dùng thước cặp để đo kiểm.","points":0.25},{"type":"mcq","level":"NB","q":"Hợp kim là gì?","options":["A. Kim loại nguyên chất","B. Vật liệu tạo thành từ hai hay nhiều nguyên tố kim loại","C. Nhựa","D. Gỗ"],"answer":"B","explain":"Hợp kim như thép (sắt và cacbon), đồng thau (đồng và kẽm) có tính chất ưu việt hơn kim loại nguyên chất.","points":0.25},{"type":"mcq","level":"NB","q":"Ăn mòn kim loại là hiện tượng gì?","options":["A. Kim loại sáng bóng hơn","B. Kim loại cứng hơn","C. Kim loại bị phá hủy dần do tác dụng hóa học với môi trường","D. Kim loại nhẹ hơn"],"answer":"C","explain":"Ăn mòn là kim loại bị oxi hóa, gỉ sét do ẩm, hóa chất; cần sơn phủ, mạ để chống gỉ.","points":0.25},{"type":"mcq","level":"NB","q":"Tôi thép là phương pháp gì?","options":["A. Nấu chảy thép","B. Sơn thép","C. Cắt thép","D. Nung nóng thép rồi làm nguội nhanh để tăng độ cứng"],"answer":"D","explain":"Tôi thép nung nóng rồi làm nguội đột ngột làm thép cứng hơn, dùng cho dao, dụng cụ cắt.","points":0.25},{"type":"mcq","level":"VD","q":"Chi tiết máy làm việc ngoài trời mưa nắng cần vật liệu nào?","options":["A. Thép thường không bảo vệ","B. Gỗ","C. Thép không gỉ hoặc thép được sơn chống gỉ","D. Giấy"],"answer":"C","explain":"Ngoài trời ẩm ướt dễ gỉ nên dùng thép không gỉ hoặc sơn chống gỉ để tăng tuổi thọ.","points":0.25},{"type":"mcq","level":"NB","q":"Giờ cao điểm dùng điện là khoảng thời gian nào?","options":["A. Lúc nửa đêm","B. Lúc không ai dùng điện","C. Cả ngày như nhau","D. Khi nhiều người cùng dùng điện, thường buổi tối"],"answer":"D","explain":"Giờ cao điểm (thường 18-22 giờ) nhiều hộ cùng dùng điện, dễ quá tải; nên tránh dùng thiết bị lớn lúc này.","points":0.25},{"type":"mcq","level":"TH","q":"Nối đất trong hệ thống điện gia đình có tác dụng gì?","options":["A. Tăng điện áp","B. Dẫn dòng điện rò xuống đất để bảo vệ người","C. Giảm tiền điện","D. Trang trí"],"answer":"B","explain":"Dây nối đất đưa dòng rò xuống đất thay vì qua người khi thiết bị bị rò điện.","points":0.25},{"type":"mcq","level":"TH","q":"Tấm pin mặt trời trên mái nhà biến đổi năng lượng nào thành điện năng?","options":["A. Quang năng thành điện năng","B. Nhiệt năng thành điện năng","C. Cơ năng thành điện năng","D. Hóa năng thành điện năng"],"answer":"A","explain":"Pin mặt trời biến quang năng thành điện năng một chiều, qua bộ đổi điện để sử dụng.","points":0.25},{"type":"mcq","level":"NB","q":"Hiện tượng quá tải điện xảy ra khi nào?","options":["A. Khi không dùng điện","B. Khi tổng công suất thiết bị vượt quá khả năng của đường dây","C. Khi trời mưa","D. Khi cúp điện"],"answer":"B","explain":"Quá tải làm dây nóng, dễ chập cháy; aptomat sẽ ngắt để bảo vệ.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao dây dẫn cho thiết bị công suất lớn phải có tiết diện lớn?","options":["A. Để đẹp","B. Để rẻ tiền","C. Để chịu được dòng điện lớn mà không bị nóng chảy","D. Để nhẹ"],"answer":"C","explain":"Dòng điện lớn qua dây nhỏ gây nóng, chảy vỏ cách điện; dây to chịu tải tốt hơn.","points":0.25},{"type":"mcq","level":"TH","q":"So với đèn sợi đốt, đèn LED có ưu điểm gì?","options":["A. Sáng yếu hơn","B. Tốn điện hơn","C. Tiết kiệm điện hơn nhiều và tuổi thọ cao hơn","D. Nhanh hỏng hơn"],"answer":"C","explain":"Đèn LED tiêu thụ ít điện, tuổi thọ cao, ít tỏa nhiệt nên được khuyến khích dùng.","points":0.25},{"type":"mcq","level":"VD","q":"Hóa đơn tiền điện nhà bạn K tăng đột biến. Việc nên làm đầu tiên là gì?","options":["A. Không trả tiền điện","B. Kiểm tra các thiết bị có bị rò điện hay dùng lãng phí không","C. Tự ý can thiệp công tơ","D. Mặc kệ"],"answer":"B","explain":"Tiền điện tăng đột biến có thể do rò điện hoặc thiết bị hỏng; cần kiểm tra trước khi khiếu nại.","points":0.25},{"type":"mcq","level":"NB","q":"Điện trở dùng để làm gì trong mạch điện?","options":["A. Hạn chế dòng điện qua mạch","B. Tích trữ điện","C. Phát sáng","D. Khuếch đại"],"answer":"A","explain":"Điện trở cản trở dòng điện, dùng phân áp, hạn chế dòng cho linh kiện.","points":0.25},{"type":"mcq","level":"NB","q":"Cổng logic AND cho đầu ra như thế nào?","options":["A. Đầu ra là 1 chỉ khi tất cả các đầu vào đều là 1","B. Đầu ra luôn là 1","C. Đầu ra luôn là 0","D. Đầu ra ngẫu nhiên"],"answer":"A","explain":"Cổng AND thực hiện phép nhân logic: ra 1 khi mọi đầu vào đều 1.","points":0.25},{"type":"mcq","level":"NB","q":"Cổng logic OR cho đầu ra như thế nào?","options":["A. Đầu ra là 1 khi ít nhất một đầu vào là 1","B. Đầu ra luôn là 0","C. Đầu ra luôn là 1","D. Đầu ra ngẫu nhiên"],"answer":"A","explain":"Cổng OR thực hiện phép cộng logic: ra 1 khi có ít nhất một đầu vào là 1.","points":0.25},{"type":"mcq","level":"VD","q":"Đèn giao thông tự động chuyển xanh, vàng, đỏ theo chu kỳ. Bộ phận nào điều khiển việc này?","options":["A. Người đứng bật tắt","B. Ngẫu nhiên","C. Không cần điều khiển","D. Mạch điều khiển số dùng các cổng logic và bộ định thời"],"answer":"D","explain":"Đèn giao thông dùng mạch số với bộ định thời và cổng logic để chuyển trạng thái theo chu kỳ.","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá một chiếc xe đạp, các bạn đưa ra ý kiến:","statements":["a) Xe đạp chạy được mà không cần người đạp nhờ động cơ vĩnh cửu.","b) Xe đạp giúp rèn luyện sức khỏe và bảo vệ môi trường.","c) Xe đạp điện di chuyển được nhờ động cơ điện.","d) Xe đạp không cần bảo dưỡng vẫn dùng tốt mãi."],"answer":["F","T","T","F"],"explain":"a) Sai: xe đạp thường cần người đạp, xe đạp điện cần động cơ và pin. b) Đúng: xe đạp không khí thải, tốt cho sức khỏe. c) Đúng: xe đạp điện dùng động cơ điện hỗ trợ. d) Sai: xe đạp cần bảo dưỡng xích, phanh, lốp định kỳ.","points":1},{"type":"truefalse","level":"VD","q":"Đọc chỉ số công tơ điện hằng tháng, một số bạn phát biểu:","statements":["a) Công tơ điện đo lượng điện năng tiêu thụ tính bằng kWh.","b) Có thể tự ý can thiệp để công tơ chạy chậm lại.","c) Nên theo dõi công tơ để phát hiện bất thường về điện.","d) Số điện càng ít thì tiền điện càng cao."],"answer":["T","F","T","F"],"explain":"a) Đúng: công tơ đo điện năng tiêu thụ. b) Sai: can thiệp công tơ là vi phạm pháp luật. c) Đúng: theo dõi giúp phát hiện rò rỉ, thiết bị hỏng. d) Sai: tiền điện tính theo số kWh đã dùng, dùng càng nhiều trả càng nhiều.","points":1},{"type":"truefalse","level":"VD","q":"Cho bản vẽ một chi tiết đơn giản, các bạn tập đọc bản vẽ:","statements":["a) Đọc bản vẽ cần xem hình dạng, kích thước và vật liệu của chi tiết.","b) Khung tên cho biết tỉ lệ của bản vẽ.","c) Nét đứt trên bản vẽ thể hiện đường bao thấy.","d) Con số kích thước ghi trên bản vẽ là kích thước thật của chi tiết."],"answer":["T","T","F","T"],"explain":"a) Đúng: đó là ba thông tin cơ bản khi đọc bản vẽ. b) Đúng: tỉ lệ ghi trong khung tên. c) Sai: nét đứt thể hiện đường bị khuất; đường bao thấy vẽ nét liền đậm. d) Đúng: con số kích thước luôn là kích thước thật.","points":1},{"type":"truefalse","level":"TH","q":"Tìm hiểu về cổng logic trong kĩ thuật số, một số bạn phát biểu:","statements":["a) Cổng AND cho đầu ra là 1 khi tất cả đầu vào đều là 1.","b) Cổng logic chỉ được dùng trong máy tính.","c) Cổng OR cho đầu ra là 1 khi tất cả đầu vào đều là 0.","d) Mạch số dùng các cổng logic để xử lý tín hiệu."],"answer":["T","F","F","T"],"explain":"a) Đúng: đặc tính của cổng AND. b) Sai: cổng logic dùng trong nhiều thiết bị số như điều khiển, viễn thông. c) Sai: cổng OR cho đầu ra 1 khi ít nhất một đầu vào là 1. d) Đúng: mạch số được xây dựng từ các cổng logic.","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Kĩ sư điện làm công việc gì?","options":["A. Dạy toán","B. Thiết kế, lắp đặt và vận hành hệ thống điện","C. Bán quần áo","D. Lái xe"],"answer":"B","explain":"Kĩ sư điện thiết kế, thi công và quản lý hệ thống điện trong công nghiệp và dân dụng.","points":0.25},{"type":"mcq","level":"NB","q":"Thợ điện dân dụng cần tuân thủ nguyên tắc an toàn nào?","options":["A. Ngắt nguồn trước khi sửa chữa và dùng dụng cụ cách điện","B. Sửa khi đang có điện cho nhanh","C. Không cần dụng cụ bảo hộ","D. Làm một mình nơi vắng vẻ"],"answer":"A","explain":"An toàn điện yêu cầu ngắt nguồn, dùng dụng cụ cách điện và đồ bảo hộ khi làm việc.","points":0.25},{"type":"mcq","level":"TH","q":"Công nghệ tự động hóa ảnh hưởng tới việc làm như thế nào?","options":["A. Thay thế công việc đơn giản, đồng thời tạo ra nghề mới về vận hành, bảo trì","B. Làm mất hết việc làm","C. Không ảnh hưởng gì","D. Chỉ có lợi"],"answer":"A","explain":"Tự động hóa thay thế lao động giản đơn nhưng tạo nhu cầu nhân lực kĩ thuật cao mới.","points":0.25},{"type":"mcq","level":"NB","q":"Đạo đức nghề nghiệp của người làm kĩ thuật thể hiện ở đâu?","options":["A. Làm ẩu cho nhanh","B. Làm việc trung thực, đảm bảo chất lượng và an toàn","C. Cắt xén vật liệu","D. Giấu lỗi sản phẩm"],"answer":"B","explain":"Người làm kĩ thuật phải trung thực, đặt chất lượng và an toàn lên hàng đầu.","points":0.25},{"type":"mcq","level":"TH","q":"Bản vẽ xây dựng khác bản vẽ cơ khí ở điểm nào?","options":["A. Hai loại giống hệt nhau","B. Bản vẽ xây dựng thể hiện công trình như nhà cửa với tỉ lệ nhỏ hơn nhiều","C. Bản vẽ cơ khí vẽ nhà cửa","D. Bản vẽ xây dựng vẽ chi tiết máy"],"answer":"B","explain":"Bản vẽ xây dựng thể hiện nhà, cầu đường với tỉ lệ rất nhỏ; bản vẽ cơ khí thể hiện chi tiết máy.","points":0.25},{"type":"mcq","level":"NB","q":"Kí hiệu vật liệu trên mặt cắt của kim loại là gì?","options":["A. Màu đỏ","B. Chấm tròn","C. Không kí hiệu","D. Các đường gạch chéo song song"],"answer":"D","explain":"Quy ước: phần kim loại bị cắt được kẻ gạch chéo song song; vật liệu khác có kí hiệu riêng.","points":0.25},{"type":"mcq","level":"TH","q":"Lắp ráp sản phẩm từ bản vẽ cần chú ý gì?","options":["A. Đúng thứ tự, đúng vị trí các chi tiết theo bản vẽ lắp","B. Lắp tùy ý","C. Thừa thiếu chi tiết cũng được","D. Không cần bản vẽ"],"answer":"A","explain":"Lắp ráp phải theo đúng thứ tự và vị trí trong bản vẽ lắp để sản phẩm hoạt động đúng.","points":0.25},{"type":"mcq","level":"NB","q":"Kiểm tra chất lượng sản phẩm cơ khí bằng cách nào?","options":["A. Đo kích thước, kiểm tra hình dạng và thử hoạt động","B. Nhìn qua loa","C. Không cần kiểm tra","D. Đoán mò"],"answer":"A","explain":"Kiểm tra gồm đo kích thước bằng dụng cụ, quan sát khuyết tật và chạy thử sản phẩm.","points":0.25},{"type":"mcq","level":"VD","q":"Lắp một chiếc quạt điện theo bản vẽ nhưng quạt không quay. Nguyên nhân có thể là gì?","options":["A. Quạt quá mới","B. Lắp sai vị trí chi tiết hoặc đấu sai dây điện","C. Trời nóng","D. Không có nguyên nhân"],"answer":"B","explain":"Lắp sai hoặc đấu sai mạch khiến quạt không hoạt động; cần kiểm tra lại theo bản vẽ.","points":0.25},{"type":"mcq","level":"NB","q":"Vì sao nên tái chế kim loại phế liệu?","options":["A. Để tốn kém hơn","B. Không có lợi ích","C. Tiết kiệm tài nguyên và giảm ô nhiễm môi trường","D. Để tăng rác thải"],"answer":"C","explain":"Tái chế kim loại tiết kiệm quặng, năng lượng và giảm chất thải ra môi trường.","points":0.25},{"type":"mcq","level":"TH","q":"Chọn vật liệu làm dao thái cần xét tính chất nào?","options":["A. Mềm dẻo","B. Dễ gỉ","C. Độ cứng cao và chống gỉ tốt","D. Nhẹ nhất"],"answer":"C","explain":"Dao cần cứng để sắc bén và chống gỉ để an toàn thực phẩm, thường dùng thép không gỉ.","points":0.25},{"type":"mcq","level":"NB","q":"Vật liệu composite là gì?","options":["A. Kim loại nguyên chất","B. Vật liệu tạo từ hai hay nhiều vật liệu khác nhau kết hợp ưu điểm","C. Nhựa thường","D. Gỗ tự nhiên"],"answer":"B","explain":"Composite như sợi thủy tinh kết hợp độ bền của sợi và độ dẻo của nhựa, nhẹ mà bền.","points":0.25},{"type":"mcq","level":"VD","q":"Làm vỏ xuồng cần vật liệu nhẹ, bền, không thấm nước. Nên chọn vật liệu nào?","options":["A. Giấy","B. Composite sợi thủy tinh","C. Thép dày nặng","D. Đất sét"],"answer":"B","explain":"Composite sợi thủy tinh nhẹ, bền, chống thấm nước, phù hợp làm vỏ xuồng, tàu.","points":0.25},{"type":"mcq","level":"NB","q":"Tuabin gió biến đổi năng lượng nào thành điện năng?","options":["A. Nhiệt năng thành điện năng","B. Hóa năng thành điện năng","C. Quang năng thành điện năng","D. Động năng của gió thành điện năng"],"answer":"D","explain":"Gió làm quay cánh quạt tuabin, máy phát biến cơ năng thành điện năng.","points":0.25},{"type":"mcq","level":"NB","q":"Acquy trong hệ thống điện mặt trời có nhiệm vụ gì?","options":["A. Tích trữ điện để dùng khi không có nắng","B. Phát điện","C. Tăng điện áp","D. Trang trí"],"answer":"A","explain":"Acquy trữ điện ban ngày để dùng ban đêm hoặc khi trời râm.","points":0.25},{"type":"mcq","level":"NB","q":"Máy phát điện dự phòng dùng khi nào?","options":["A. Khi điện quá mạnh","B. Hằng ngày thay điện lưới","C. Khi mất điện lưới","D. Không bao giờ dùng"],"answer":"C","explain":"Máy phát điện dự phòng chạy bằng xăng, dầu để cấp điện tạm thời khi mất điện lưới.","points":0.25},{"type":"mcq","level":"TH","q":"Ổn áp có tác dụng gì?","options":["A. Tăng tiền điện","B. Phát điện","C. Ngắt điện","D. Giữ điện áp ổn định khi điện lưới chập chờn"],"answer":"D","explain":"Ổn áp giữ điện áp ra ổn định, bảo vệ thiết bị khi điện lưới lúc cao lúc thấp.","points":0.25},{"type":"mcq","level":"TH","q":"Dấu hiệu nào cho thấy thiết bị bị rò điện?","options":["A. Thiết bị chạy êm","B. Đèn sáng bình thường","C. Chạm vào vỏ kim loại thấy tê tê","D. Không có dấu hiệu"],"answer":"C","explain":"Tê khi chạm vỏ kim loại là dấu hiệu rò điện; cần ngắt nguồn và kiểm tra ngay.","points":0.25},{"type":"mcq","level":"NB","q":"Biện pháp nào giúp trường học tiết kiệm điện?","options":["A. Bật tất cả thiết bị cả ngày","B. Mở điều hòa cửa mở","C. Không cần tiết kiệm","D. Tắt đèn, quạt khi ra khỏi phòng và dùng thiết bị tiết kiệm điện"],"answer":"D","explain":"Tắt thiết bị không dùng và chọn thiết bị hiệu suất cao là cách tiết kiệm đơn giản, hiệu quả.","points":0.25},{"type":"mcq","level":"VD","q":"Phòng học bật 10 bóng đèn cả ngày dù đủ ánh sáng tự nhiên. Đây là hiện tượng gì và nên làm gì?","options":["A. Bình thường","B. Tiết kiệm điện","C. Nên bật thêm","D. Lãng phí điện; nên tận dụng ánh sáng tự nhiên và tắt bớt đèn"],"answer":"D","explain":"Dùng điện khi không cần thiết là lãng phí; tận dụng ánh sáng tự nhiên giúp tiết kiệm đáng kể.","points":0.25},{"type":"mcq","level":"NB","q":"Vi điều khiển là gì?","options":["A. Chip nhỏ có thể lập trình để điều khiển thiết bị tự động","B. Công tắc cơ","C. Dây điện","D. Bóng đèn"],"answer":"A","explain":"Vi điều khiển như Arduino là máy tính thu nhỏ, lập trình được để điều khiển robot, nhà thông minh.","points":0.25},{"type":"mcq","level":"TH","q":"Nhà thông minh điều khiển đèn tự động như thế nào?","options":["A. Phải có người bật tắt","B. Ngẫu nhiên","C. Cảm biến phát hiện người rồi bật đèn, không có người thì tắt","D. Luôn bật"],"answer":"C","explain":"Cảm biến chuyển động kết hợp vi điều khiển giúp đèn tự bật tắt, tiết kiệm điện.","points":0.25},{"type":"mcq","level":"TH","q":"Cảm biến ánh sáng trong đèn đường có tác dụng gì?","options":["A. Làm đèn sáng hơn","B. Tốn điện hơn","C. Không có tác dụng","D. Tự bật đèn khi trời tối và tắt khi trời sáng"],"answer":"D","explain":"Cảm biến ánh sáng giúp đèn đường tự động theo điều kiện trời, tiết kiệm điện và công vận hành.","points":0.25},{"type":"mcq","level":"VD","q":"Vườn rau được tưới tự động khi đất khô. Hệ thống này gồm những bộ phận nào?","options":["A. Chỉ cần vòi nước","B. Chỉ cần xô nước","C. Cảm biến độ ẩm, bộ điều khiển và máy bơm","D. Không cần gì"],"answer":"C","explain":"Cảm biến đo độ ẩm đất, bộ điều khiển so sánh và bật máy bơm khi cần — ví dụ điều khiển tự động trong nông nghiệp.","points":0.25},{"type":"truefalse","level":"VD","q":"Tìm hiểu về công nghệ xanh, một số bạn đưa ra ý kiến:","statements":["a) Công nghệ xanh giúp giảm tác động xấu tới môi trường.","b) Công nghệ xanh luôn đắt đỏ nên không nên sử dụng.","c) Năng lượng tái tạo như mặt trời, gió là một phần của công nghệ xanh.","d) Tái chế vật liệu góp phần bảo vệ môi trường."],"answer":["T","F","T","T"],"explain":"a) Đúng: công nghệ xanh thân thiện môi trường. b) Sai: công nghệ xanh ngày càng rẻ và mang lại lợi ích lâu dài. c) Đúng: năng lượng tái tạo sạch, bền vững. d) Đúng: tái chế tiết kiệm tài nguyên, giảm rác thải.","points":1},{"type":"truefalse","level":"TH","q":"Về việc nối đất bảo vệ trong hệ thống điện, một số bạn phát biểu:","statements":["a) Dây nối đất giúp dòng điện rò truyền xuống đất thay vì qua người.","b) Thiết bị có vỏ kim loại nên được nối đất để an toàn.","c) Nối đất làm tăng nguy cơ bị điện giật.","d) Dây nối đất bị đứt vẫn đảm bảo an toàn bình thường."],"answer":["T","T","F","F"],"explain":"a) Đúng: nối đất tạo đường thoát an toàn cho dòng rò. b) Đúng: vỏ kim loại rò điện rất nguy hiểm nếu không nối đất. c) Sai: nối đất giảm nguy cơ điện giật. d) Sai: dây nối đất hỏng phải sửa ngay để đảm bảo an toàn.","points":1},{"type":"truefalse","level":"VD","q":"Chọn vật liệu làm khung xe đạp cho học sinh, các bạn thảo luận:","statements":["a) Vật liệu nào cũng dùng được cho mọi chi tiết.","b) Chọn vật liệu cần xét độ bền, giá thành và điều kiện sử dụng.","c) Khung xe dùng ngoài trời cần chống gỉ tốt.","d) Tái chế kim loại giúp tiết kiệm tài nguyên."],"answer":["F","T","T","T"],"explain":"a) Sai: mỗi chi tiết cần vật liệu phù hợp yêu cầu. b) Đúng: chọn vật liệu phải cân nhắc nhiều yếu tố. c) Đúng: ngoài trời ẩm ướt cần chống gỉ. d) Đúng: tái chế tiết kiệm quặng và năng lượng.","points":1},{"type":"truefalse","level":"TH","q":"Hệ thống tưới cây tự động trong trường học, một số bạn phát biểu:","statements":["a) Hệ thống tự bật máy bơm khi cảm biến báo đất khô.","b) Cảm biến độ ẩm giúp nhận biết đất khô hay ướt.","c) Điều khiển tự động không cần cảm biến cũng hoạt động được.","d) Tưới tự động giúp tiết kiệm nước và công sức."],"answer":["T","T","F","T"],"explain":"a) Đúng: bộ điều khiển bật bơm theo tín hiệu cảm biến. b) Đúng: đó là nhiệm vụ của cảm biến độ ẩm. c) Sai: cảm biến là mắt xích không thể thiếu của điều khiển tự động. d) Đúng: tưới đúng lúc, đúng lượng tiết kiệm nước.","points":1}]}]}
