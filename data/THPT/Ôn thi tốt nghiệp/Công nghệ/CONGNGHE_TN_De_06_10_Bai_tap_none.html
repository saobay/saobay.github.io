{"sets":[{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Sản xuất thông minh là gì?","options":["A. Nhà máy không có công nhân","B. Nhà máy làm việc thủ công","C. Nhà máy không dùng điện","D. Nhà máy dùng máy móc tự động, kết nối dữ liệu để sản xuất linh hoạt"],"answer":"D","explain":"Sản xuất thông minh kết hợp tự động hóa, IoT và dữ liệu để sản xuất hiệu quả, linh hoạt.","points":0.25},{"type":"mcq","level":"TH","q":"Ứng dụng công nghệ trong đời sống thể hiện ở đâu?","options":["A. Chỉ trong nhà máy","B. Máy giặt, điều hòa, điện thoại thông minh trong gia đình","C. Không có ứng dụng","D. Chỉ trong phim"],"answer":"B","explain":"Công nghệ hiện diện khắp đời sống: đồ gia dụng thông minh, giao thông, y tế, giáo dục.","points":0.25},{"type":"mcq","level":"TH","q":"An toàn lao động trong xưởng cơ khí yêu cầu gì?","options":["A. Không cần bảo hộ","B. Làm nhanh cho xong","C. Đeo đồ bảo hộ, vận hành đúng quy trình và giữ nơi làm việc gọn gàng","D. Đùa giỡn khi vận hành máy"],"answer":"C","explain":"An toàn lao động gồm bảo hộ cá nhân, tuân thủ quy trình và môi trường làm việc ngăn nắp.","points":0.25},{"type":"mcq","level":"NB","q":"Kinh tế số là gì?","options":["A. Kinh tế không dùng tiền","B. Hoạt động kinh tế dựa trên công nghệ số và dữ liệu","C. Kinh tế chỉ bán hàng rong","D. Kinh tế thời bao cấp"],"answer":"B","explain":"Kinh tế số là các hoạt động kinh tế ứng dụng công nghệ số như thương mại điện tử, thanh toán trực tuyến.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu của khối trụ tròn nhìn từ trên xuống là hình gì?","options":["A. Hình tròn","B. Hình chữ nhật","C. Hình tam giác","D. Hình vuông"],"answer":"A","explain":"Khối trụ nhìn dọc trục cho hình tròn; nhìn ngang cho hình chữ nhật.","points":0.25},{"type":"mcq","level":"TH","q":"Vẽ phác thảo trong thiết kế có tác dụng gì?","options":["A. Thay thế bản vẽ kĩ thuật","B. Ghi nhanh ý tưởng thiết kế ban đầu trước khi vẽ chính thức","C. Để trang trí","D. Không có tác dụng"],"answer":"B","explain":"Phác thảo giúp ghi lại ý tưởng nhanh; bản vẽ kĩ thuật chính thức vẫn cần theo tiêu chuẩn.","points":0.25},{"type":"mcq","level":"NB","q":"Ghi chú kĩ thuật trên bản vẽ dùng để làm gì?","options":["A. Viết văn","B. Vẽ tranh","C. Ghi các yêu cầu về vật liệu, xử lý bề mặt, dung sai","D. Quảng cáo"],"answer":"C","explain":"Ghi chú kĩ thuật bổ sung yêu cầu không thể hiện bằng hình vẽ như nhiệt luyện, độ nhám.","points":0.25},{"type":"mcq","level":"NB","q":"Sai số cho phép khi chế tạo có nghĩa là gì?","options":["A. Làm sai tùy ý","B. Không được sai","C. Kích thước được phép lệch trong phạm vi quy định","D. Sai số của bản vẽ"],"answer":"C","explain":"Sai số cho phép (dung sai) là phạm vi lệch chuẩn được chấp nhận khi chế tạo.","points":0.25},{"type":"mcq","level":"VD","q":"Một chi tiết yêu cầu đường kính 30 mm, dung sai cộng trừ 0,2 mm. Kích thước nào sau đây đạt?","options":["A. 30,1 mm","B. 29,5 mm","C. 30,5 mm","D. 29,0 mm"],"answer":"A","explain":"Dung sai cộng trừ 0,2 mm nghĩa là từ 29,8 đến 30,2 mm; chỉ 30,1 mm nằm trong khoảng.","points":0.25},{"type":"mcq","level":"NB","q":"Gang thường được dùng để làm gì?","options":["A. Dây điện","B. Quần áo","C. Thân máy, vỏ hộp số, chảo, nồi","D. Giấy"],"answer":"C","explain":"Gang cứng, chịu mài mòn, đúc tốt nên dùng làm thân máy, vỏ hộp số, đồ gia dụng.","points":0.25},{"type":"mcq","level":"TH","q":"Thép hợp kim khác thép cacbon ở điểm nào?","options":["A. Hai loại giống nhau","B. Thép hợp kim mềm hơn","C. Thép hợp kim có thêm nguyên tố như crom, niken nên tính chất ưu việt hơn","D. Thép hợp kim rẻ hơn"],"answer":"C","explain":"Thép hợp kim thêm crom, niken, vonfram cho độ cứng, chống gỉ, chịu nhiệt tốt hơn.","points":0.25},{"type":"mcq","level":"NB","q":"Đồng và hợp kim của đồng được dùng nhiều trong lĩnh vực nào?","options":["A. Điện và điện tử nhờ dẫn điện tốt","B. Xây dựng nhà","C. May mặc","D. Nông nghiệp"],"answer":"A","explain":"Đồng dẫn điện tốt chỉ sau bạc nên dùng làm dây dẫn, chi tiết điện, điện tử.","points":0.25},{"type":"mcq","level":"VD","q":"Cần vật liệu nhẹ, bền, không gỉ để làm khung cửa sổ. Nên chọn vật liệu nào?","options":["A. Thép thường không sơn","B. Gang","C. Gỗ mục","D. Nhôm hợp kim"],"answer":"D","explain":"Nhôm hợp kim nhẹ, bền, chống gỉ tốt, phù hợp làm khung cửa.","points":0.25},{"type":"mcq","level":"NB","q":"Đường dây tải điện cao thế thường dùng dây gì?","options":["A. Dây đồng nhỏ","B. Dây nhôm lõi thép","C. Dây nhựa","D. Dây vải"],"answer":"B","explain":"Dây nhôm lõi thép nhẹ, rẻ, đủ bền cho đường dây cao thế dài.","points":0.25},{"type":"mcq","level":"NB","q":"Sứ cách điện trên cột điện có tác dụng gì?","options":["A. Trang trí cột điện","B. Tăng điện áp","C. Giảm tiền điện","D. Cách điện giữa dây dẫn và cột, chống rò điện"],"answer":"D","explain":"Sứ cách điện ngăn dòng điện truyền từ dây xuống cột, đảm bảo an toàn.","points":0.25},{"type":"mcq","level":"TH","q":"Khi mưa bão, cần lưu ý gì về an toàn điện?","options":["A. Ra xem dây điện đứt","B. Chạm vào dây đứt","C. Không cần lưu ý","D. Tránh xa cột điện, dây điện đứt rơi xuống đất"],"answer":"D","explain":"Dây điện đứt sau bão rất nguy hiểm; phải tránh xa và báo cho ngành điện.","points":0.25},{"type":"mcq","level":"NB","q":"Thay bóng đèn trong nhà cần làm gì để an toàn?","options":["A. Thay khi đang bật điện","B. Tay ướt thay cho nhanh","C. Đứng trên ghế kim loại","D. Ngắt công tắc điện trước khi thay"],"answer":"D","explain":"Ngắt điện trước khi thay bóng đèn là nguyên tắc an toàn cơ bản.","points":0.25},{"type":"mcq","level":"TH","q":"Tủ lạnh tiết kiệm điện nhờ đặc điểm nào?","options":["A. Mở cửa thường xuyên","B. Gioăng cửa kín và công nghệ biến tần","C. Để thức ăn nóng vào","D. Đặt cạnh bếp"],"answer":"B","explain":"Gioăng kín giữ lạnh, công nghệ biến tần điều chỉnh công suất giúp tủ lạnh tiết kiệm điện.","points":0.25},{"type":"mcq","level":"TH","q":"Công suất của thiết bị điện cho biết điều gì?","options":["A. Giá tiền thiết bị","B. Kích thước thiết bị","C. Màu sắc thiết bị","D. Lượng điện năng tiêu thụ trong một đơn vị thời gian"],"answer":"D","explain":"Công suất tính bằng oát cho biết mức tiêu thụ điện; công suất càng lớn càng tốn điện.","points":0.25},{"type":"mcq","level":"VD","q":"Một ấm điện 1000W đun sôi nước trong 10 phút. Điện năng tiêu thụ khoảng bao nhiêu?","options":["A. Khoảng 0,17 kWh","B. Khoảng 10 kWh","C. Khoảng 100 kWh","D. Khoảng 1 kWh"],"answer":"A","explain":"Điện năng bằng công suất nhân thời gian: 1000W nhân 1/6 giờ bằng khoảng 167 Wh, tức 0,17 kWh.","points":0.25},{"type":"mcq","level":"NB","q":"Đèn LED hoạt động dựa trên linh kiện nào?","options":["A. Điện trở","B. Tụ điện","C. Diode phát quang","D. Cuộn cảm"],"answer":"C","explain":"LED là diode phát quang, biến điện năng thành quang năng hiệu suất cao.","points":0.25},{"type":"mcq","level":"NB","q":"Quang trở là linh kiện có đặc điểm gì?","options":["A. Điện trở thay đổi theo ánh sáng chiếu vào","B. Điện trở không đổi","C. Phát sáng","D. Tích điện"],"answer":"A","explain":"Quang trở thay đổi điện trở theo cường độ sáng, dùng trong cảm biến ánh sáng, đèn tự động.","points":0.25},{"type":"mcq","level":"TH","q":"Rơ le điện từ dùng để làm gì?","options":["A. Dùng dòng điện nhỏ để đóng cắt mạch điện lớn","B. Phát điện","C. Tích điện","D. Đo điện áp"],"answer":"A","explain":"Rơ le dùng nam châm điện để đóng cắt tiếp điểm, điều khiển mạch công suất lớn bằng tín hiệu nhỏ.","points":0.25},{"type":"mcq","level":"VD","q":"Muốn đèn sân tự bật khi trời tối và tắt khi trời sáng, nên dùng linh kiện nào?","options":["A. Công tắc thường","B. Quang trở kết hợp mạch điều khiển","C. Cầu chì","D. Dây điện"],"answer":"B","explain":"Quang trở cảm nhận ánh sáng, mạch điều khiển tự động bật tắt đèn theo trời tối sáng.","points":0.25},{"type":"truefalse","level":"VD","q":"Ứng dụng in 3D trong y tế, một số bạn đưa ra ý kiến:","statements":["a) In 3D tạo được mô hình xương để bác sĩ luyện tập phẫu thuật.","b) In 3D chỉ dùng trong công nghiệp nặng, không dùng trong y tế.","c) Chân tay giả in 3D giúp người khuyết tật sinh hoạt thuận tiện hơn.","d) In 3D trong y tế quá đắt nên không ai sử dụng."],"answer":["T","F","T","F"],"explain":"a) Đúng: mô hình in 3D giúp lập kế hoạch phẫu thuật chính xác. b) Sai: y tế là lĩnh vực ứng dụng quan trọng của in 3D. c) Đúng: chân tay giả in 3D nhẹ, vừa vặn, giá hợp lý. d) Sai: in 3D ngày càng phổ biến và giảm giá thành.","points":1},{"type":"truefalse","level":"TH","q":"Về aptomat trong tủ điện gia đình, một số bạn phát biểu:","statements":["a) Aptomat tự động ngắt mạch khi quá tải hoặc ngắn mạch.","b) Sau khi aptomat ngắt, cần tìm nguyên nhân trước khi bật lại.","c) Aptomat an toàn và tiện lợi hơn cầu chì dây chì.","d) Có thể dùng dây đồng to thay cho aptomat bị hỏng."],"answer":["T","T","T","F"],"explain":"a) Đúng: aptomat bảo vệ quá tải, ngắn mạch. b) Đúng: bật lại khi chưa rõ nguyên nhân rất nguy hiểm. c) Đúng: aptomat bật lại được, không cần thay dây chì. d) Sai: thay bằng dây đồng mất chức năng bảo vệ, dễ gây cháy.","points":1},{"type":"truefalse","level":"TH","q":"Xét hình chiếu của một khối trụ tròn, một số bạn nhận xét:","statements":["a) Mọi hướng nhìn khối trụ đều cho hình tròn.","b) Nhìn từ trên xuống theo trục, khối trụ cho hình tròn.","c) Nhìn ngang từ phía trước, khối trụ cho hình chữ nhật.","d) Trên bản vẽ không cần ghi đường kính của khối trụ."],"answer":["F","T","T","F"],"explain":"a) Sai: chỉ nhìn dọc trục mới thấy hình tròn. b) Đúng: nhìn dọc trục thấy mặt tròn. c) Đúng: nhìn ngang thấy hình chữ nhật. d) Sai: cần ghi đường kính để chế tạo.","points":1},{"type":"truefalse","level":"VD","q":"Tìm hiểu về tụ điện, một số bạn phát biểu:","statements":["a) Mọi loại tụ điện đều phân cực, lắp ngược sẽ hỏng.","b) Tụ điện có chức năng tích trữ và phóng điện tích.","c) Tụ điện có thể lọc nhiễu trong mạch nguồn.","d) Tụ hóa là loại tụ có phân cực cần lắp đúng chiều."],"answer":["F","T","T","T"],"explain":"a) Sai: chỉ tụ hóa mới phân cực; tụ gốm, tụ giấy không phân cực. b) Đúng: đó là chức năng cơ bản của tụ điện. c) Đúng: tụ lọc làm phẳng điện áp nguồn. d) Đúng: tụ hóa lắp ngược cực dễ bị hỏng.","points":1}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Chuyển đổi số trong doanh nghiệp là gì?","options":["A. Đổi tiền giấy sang tiền xu","B. Ứng dụng công nghệ số vào mọi hoạt động của doanh nghiệp","C. Chuyển văn phòng","D. Đổi tên công ty"],"answer":"B","explain":"Chuyển đổi số là đưa công nghệ số vào quản lý, sản xuất, kinh doanh để tăng hiệu quả.","points":0.25},{"type":"mcq","level":"TH","q":"Thương mại điện tử giúp doanh nghiệp công nghiệp như thế nào?","options":["A. Không có lợi ích","B. Chỉ tốn tiền","C. Bán sản phẩm trực tuyến, tiếp cận khách hàng rộng hơn","D. Làm giảm khách hàng"],"answer":"C","explain":"Thương mại điện tử mở rộng thị trường, giảm chi phí mặt bằng cho doanh nghiệp.","points":0.25},{"type":"mcq","level":"TH","q":"Bảo trì dự báo trong nhà máy thông minh là gì?","options":["A. Sửa khi máy đã hỏng","B. Dự đoán hỏng hóc từ dữ liệu cảm biến để sửa trước khi máy hỏng","C. Không bảo trì","D. Đoán mò"],"answer":"B","explain":"Cảm biến thu thập dữ liệu, AI dự báo hỏng hóc giúp bảo trì chủ động, tránh dừng máy đột ngột.","points":0.25},{"type":"mcq","level":"NB","q":"Logistics là gì?","options":["A. Nấu ăn","B. Hoạt động vận chuyển, kho bãi và phân phối hàng hóa","C. Trồng cây","D. Dạy học"],"answer":"B","explain":"Logistics là chuỗi vận chuyển, lưu kho, phân phối đưa sản phẩm từ nơi sản xuất tới tay khách hàng.","points":0.25},{"type":"mcq","level":"NB","q":"Mối ghép bu lông thuộc loại mối ghép nào?","options":["A. Mối ghép không tháo được","B. Mối hàn","C. Mối ghép tháo được","D. Mối dán"],"answer":"C","explain":"Mối ghép bu lông, vít tháo lắp được nhiều lần; mối hàn, đinh tán là mối ghép cố định.","points":0.25},{"type":"mcq","level":"NB","q":"Ren trên bu lông có tác dụng gì?","options":["A. Tạo lực siết chặt khi vặn đai ốc","B. Trang trí","C. Làm nhẹ bu lông","D. Không có tác dụng"],"answer":"A","explain":"Ren biến chuyển động xoay thành lực siết, giữ chặt các chi tiết với nhau.","points":0.25},{"type":"mcq","level":"TH","q":"Khi lắp ráp, vì sao phải siết bu lông theo lực quy định?","options":["A. Siết càng chặt càng tốt","B. Không cần quan tâm","C. Siết quá chặt gây hỏng ren, siết lỏng gây lỏng mối ghép","D. Siết lỏng cho dễ tháo"],"answer":"C","explain":"Lực siết phải đúng quy định để mối ghép chắc mà không hỏng chi tiết.","points":0.25},{"type":"mcq","level":"NB","q":"Bảng kê trên bản vẽ lắp cho biết gì?","options":["A. Tên, số lượng và vật liệu của từng chi tiết","B. Giá bán","C. Quảng cáo","D. Hướng dẫn sử dụng"],"answer":"A","explain":"Bảng kê liệt kê các chi tiết kèm số lượng, vật liệu để chuẩn bị khi lắp ráp.","points":0.25},{"type":"mcq","level":"VD","q":"Lắp một bộ bàn ghế theo bản vẽ nhưng thừa ốc vít. Có thể kết luận gì?","options":["A. Thừa ốc là bình thường","B. Vứt ốc thừa đi","C. Bàn ghế vẫn chắc chắn","D. Có thể đã lắp thiếu chi tiết hoặc sai vị trí, cần kiểm tra lại"],"answer":"D","explain":"Thừa chi tiết sau lắp ráp thường do lắp thiếu hoặc sai; cần đối chiếu bản vẽ kiểm tra lại.","points":0.25},{"type":"mcq","level":"NB","q":"Gia công tinh là gì?","options":["A. Gia công thô","B. Không gia công","C. Gia công nhanh","D. Gia công lần cuối để đạt độ chính xác và độ bóng yêu cầu"],"answer":"D","explain":"Gia công tinh (mài, đánh bóng) là bước cuối cho độ chính xác cao sau gia công thô.","points":0.25},{"type":"mcq","level":"NB","q":"Mạ điện dùng để làm gì?","options":["A. Phủ lớp kim loại lên bề mặt để chống gỉ và trang trí","B. Cắt kim loại","C. Nấu chảy kim loại","D. Uốn kim loại"],"answer":"A","explain":"Mạ điện phủ lớp kẽm, crom, niken lên bề mặt giúp chống ăn mòn và đẹp hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của in 3D kim loại là gì?","options":["A. Luôn rẻ nhất","B. Nhanh nhất mọi trường hợp","C. Không cần thiết kế","D. Tạo chi tiết phức tạp, giảm phế liệu so với cắt gọt"],"answer":"D","explain":"In 3D kim loại bồi đắp vật liệu nên ít phế liệu và tạo hình phức tạp mà cắt gọt khó làm.","points":0.25},{"type":"mcq","level":"VD","q":"Cần 1000 chi tiết đơn giản giống hệt nhau. Nên chọn công nghệ nào?","options":["A. Tiện thủ công từng chiếc","B. In 3D từng chiếc","C. Dập hoặc đúc hàng loạt cho năng suất cao","D. Rèn tay từng chiếc"],"answer":"C","explain":"Số lượng lớn, chi tiết đơn giản nên dập hoặc đúc hàng loạt cho nhanh và rẻ.","points":0.25},{"type":"mcq","level":"NB","q":"Để tiết kiệm điện cho trường học, việc nào nên làm?","options":["A. Tắt đèn, quạt khi ra khỏi phòng học","B. Bật tất cả thiết bị cả ngày","C. Mở điều hòa và mở cửa","D. Dùng đèn sợi đốt"],"answer":"A","explain":"Tắt thiết bị không dùng là cách tiết kiệm đơn giản nhất trong trường học.","points":0.25},{"type":"mcq","level":"TH","q":"Dùng điều hòa tiết kiệm điện như thế nào?","options":["A. Đặt 16 độ và mở cửa","B. Bật tắt liên tục","C. Không vệ sinh","D. Đặt nhiệt độ 26-27 độ, đóng kín cửa và vệ sinh lưới lọc định kỳ"],"answer":"D","explain":"Nhiệt độ hợp lý, phòng kín và máy sạch giúp điều hòa chạy hiệu quả, đỡ tốn điện.","points":0.25},{"type":"mcq","level":"TH","q":"Chiếu sáng công cộng tiết kiệm điện bằng cách nào?","options":["A. Dùng đèn LED và tự động bật tắt theo trời tối sáng","B. Dùng đèn sợi đốt","C. Bật cả ngày","D. Không cần chiếu sáng"],"answer":"A","explain":"Đèn LED kết hợp cảm biến ánh sáng giúp chiếu sáng công cộng hiệu quả, tiết kiệm.","points":0.25},{"type":"mcq","level":"NB","q":"Bình nước nóng dùng điện thuộc nhóm đồ dùng điện nào?","options":["A. Điện – quang","B. Điện – cơ","C. Điện – nhiệt","D. Điện – từ"],"answer":"C","explain":"Bình nước nóng biến điện năng thành nhiệt năng nên thuộc nhóm điện – nhiệt.","points":0.25},{"type":"mcq","level":"TH","q":"Bếp điện từ tiết kiệm điện hơn bếp điện trở vì sao?","options":["A. Công suất lớn hơn","B. Truyền nhiệt trực tiếp vào đáy nồi, ít thất thoát","C. Giá đắt hơn","D. Nặng hơn"],"answer":"B","explain":"Bếp từ sinh nhiệt trực tiếp ở đáy nồi nên hiệu suất cao, ít tỏa nhiệt ra ngoài.","points":0.25},{"type":"mcq","level":"NB","q":"Quạt điện thuộc nhóm điện – cơ vì sao?","options":["A. Vì tạo ra nhiệt","B. Vì phát sáng","C. Vì tích điện","D. Vì biến điện năng thành cơ năng làm quay cánh quạt"],"answer":"D","explain":"Quạt dùng động cơ điện biến điện năng thành cơ năng quay cánh quạt tạo gió.","points":0.25},{"type":"mcq","level":"VD","q":"Phòng học có 8 bóng đèn huỳnh quang cũ. Muốn tiết kiệm điện nên làm gì?","options":["A. Bật thêm đèn","B. Giữ nguyên","C. Tắt hết đèn","D. Thay bằng đèn LED có độ sáng tương đương"],"answer":"D","explain":"Đèn LED sáng tương đương mà tiêu thụ ít điện hơn nhiều so với huỳnh quang cũ.","points":0.25},{"type":"mcq","level":"NB","q":"Cảm biến nhiệt độ dùng để làm gì?","options":["A. Đo cân nặng","B. Đo nhiệt độ môi trường để điều khiển thiết bị","C. Đo chiều dài","D. Phát sáng"],"answer":"B","explain":"Cảm biến nhiệt độ biến nhiệt độ thành tín hiệu điện cho hệ thống điều khiển.","points":0.25},{"type":"mcq","level":"TH","q":"Băng chuyền tự động trong nhà máy hoạt động nhờ gì?","options":["A. Sức người đẩy","B. Động cơ điện và hệ thống điều khiển","C. Gió thổi","D. Ngẫu nhiên"],"answer":"B","explain":"Băng chuyền dùng động cơ điện kéo, điều khiển tự động tốc độ và dừng theo chương trình.","points":0.25},{"type":"mcq","level":"NB","q":"Máy CNC là gì?","options":["A. Máy chạy bằng tay","B. Máy không cần điện","C. Máy công cụ điều khiển bằng chương trình số","D. Máy đồ chơi"],"answer":"C","explain":"Máy CNC chạy theo chương trình lập sẵn, gia công chính xác và tự động.","points":0.25},{"type":"mcq","level":"VD","q":"Dây chuyền đóng gói tự động dừng khi thiếu nguyên liệu. Bộ phận nào phát hiện thiếu nguyên liệu?","options":["A. Cảm biến","B. Băng chuyền","C. Thùng carton","D. Công nhân"],"answer":"A","explain":"Cảm biến phát hiện hết nguyên liệu, báo cho bộ điều khiển dừng dây chuyền.","points":0.25},{"type":"truefalse","level":"TH","q":"Tìm hiểu về Internet vạn vật trong công nghiệp, một số bạn phát biểu:","statements":["a) Cảm biến giúp theo dõi tình trạng máy móc từ xa.","b) IoT trong công nghiệp giúp thu thập dữ liệu sản xuất liên tục.","c) Dữ liệu từ cảm biến giúp dự báo hỏng hóc máy móc.","d) IoT không có ứng dụng nào trong nhà máy."],"answer":["T","T","T","F"],"explain":"a) Đúng: cảm biến giám sát máy móc theo thời gian thực. b) Đúng: đó là lợi ích cốt lõi của IoT công nghiệp. c) Đúng: phân tích dữ liệu dự báo bảo trì. d) Sai: IoT được ứng dụng rộng rãi trong nhà máy thông minh.","points":1},{"type":"truefalse","level":"TH","q":"Tiết kiệm điện trong trường học, các bạn đề xuất:","statements":["a) Tận dụng ánh sáng tự nhiên, tắt bớt đèn ban ngày.","b) Tắt quạt, điều hòa khi ra khỏi phòng.","c) Bật điều hòa và mở cửa sổ cho thoáng.","d) Thay đèn cũ bằng đèn LED tiết kiệm điện."],"answer":["T","T","F","T"],"explain":"a) Đúng: ánh sáng tự nhiên miễn phí và tốt cho mắt. b) Đúng: tắt thiết bị không dùng tránh lãng phí. c) Sai: mở cửa khi bật điều hòa làm thất thoát hơi lạnh, tốn điện. d) Đúng: đèn LED tiết kiệm hơn nhiều so với đèn cũ.","points":1},{"type":"truefalse","level":"VD","q":"Đọc bản vẽ chi tiết của một trục máy, một số bạn phát biểu:","statements":["a) Bản vẽ chi tiết thể hiện một chi tiết duy nhất là trục máy.","b) Bản vẽ chi tiết không cần ghi kích thước.","c) Khung tên không chứa thông tin vật liệu.","d) Yêu cầu kĩ thuật ghi cách xử lý bề mặt của trục."],"answer":["T","F","F","T"],"explain":"a) Đúng: bản vẽ chi tiết vẽ một chi tiết. b) Sai: kích thước là thông tin bắt buộc. c) Sai: vật liệu ghi trong khung tên. d) Đúng: yêu cầu kĩ thuật ghi nhiệt luyện, độ nhám.","points":1},{"type":"truefalse","level":"VD","q":"Xét mạch khuếch đại âm thanh trong loa, một số bạn phát biểu:","statements":["a) Mạch khuếch đại làm tín hiệu âm thanh yếu đi.","b) Mạch khuếch đại làm tín hiệu âm thanh mạnh hơn.","c) Mạch khuếch đại không cần nguồn nuôi vẫn hoạt động.","d) Transistor là linh kiện chính trong mạch khuếch đại."],"answer":["F","T","F","T"],"explain":"a) Sai: khuếch đại làm tín hiệu mạnh lên. b) Đúng: khuếch đại tăng biên độ tín hiệu. c) Sai: mạch khuếch đại cần nguồn nuôi mới hoạt động. d) Đúng: transistor là linh kiện khuếch đại chủ yếu.","points":1}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Vật liệu mới như graphene nổi bật với đặc tính nào?","options":["A. Mềm như bông","B. Không dẫn điện","C. Rất nặng","D. Rất cứng, nhẹ và dẫn điện tốt"],"answer":"D","explain":"Graphene là vật liệu mới cứng hơn thép, nhẹ và dẫn điện tốt, hứa hẹn nhiều ứng dụng.","points":0.25},{"type":"mcq","level":"NB","q":"Công nghệ nano là gì?","options":["A. Công nghệ làm đồ to","B. Công nghệ chế tạo và điều khiển vật liệu ở kích thước siêu nhỏ","C. Công nghệ trồng cây","D. Công nghệ nấu ăn"],"answer":"B","explain":"Công nghệ nano làm việc ở kích thước nanomet, tạo vật liệu có tính chất đặc biệt.","points":0.25},{"type":"mcq","level":"TH","q":"Năng lượng hydrogen được xem là năng lượng của tương lai vì sao?","options":["A. Khi cháy chỉ tạo ra nước, không gây ô nhiễm","B. Rất rẻ tiền","C. Dễ khai thác","D. Không cần công nghệ"],"answer":"A","explain":"Hydrogen cháy tạo ra nước sạch, là nguồn năng lượng sạch tiềm năng.","points":0.25},{"type":"mcq","level":"NB","q":"Kinh tế tuần hoàn là gì?","options":["A. Tái sử dụng, tái chế tài nguyên để giảm rác thải","B. Kinh tế một chiều","C. Chỉ sản xuất không tái chế","D. Vứt bỏ sau khi dùng"],"answer":"A","explain":"Kinh tế tuần hoàn kéo dài vòng đời sản phẩm qua tái sử dụng, tái chế, giảm khai thác tài nguyên.","points":0.25},{"type":"mcq","level":"TH","q":"Hình cắt một nửa dùng khi nào?","options":["A. Khi vật thể không đối xứng","B. Luôn dùng","C. Không bao giờ dùng","D. Khi vật thể đối xứng, một nửa vẽ hình chiếu, một nửa vẽ hình cắt"],"answer":"D","explain":"Vật thể đối xứng có thể vẽ nửa hình chiếu, nửa hình cắt trên cùng một hình để gọn bản vẽ.","points":0.25},{"type":"mcq","level":"TH","q":"Hình cắt riêng phần dùng để làm gì?","options":["A. Cắt toàn bộ vật thể","B. Không cắt gì","C. Chỉ cắt một phần nhỏ của vật thể để thể hiện chi tiết cục bộ","D. Vẽ thêm chi tiết"],"answer":"C","explain":"Hình cắt riêng phần chỉ cắt một vùng nhỏ cần thể hiện, giới hạn bằng nét lượn sóng.","points":0.25},{"type":"mcq","level":"NB","q":"Quy ước vẽ nào sau đây đúng khi vẽ hình cắt?","options":["A. Không kẻ gì","B. Tô đen toàn bộ","C. Vẽ thêm hình","D. Phần bị cắt qua được kẻ gạch chéo"],"answer":"D","explain":"Quy ước bản vẽ: phần vật thể bị mặt phẳng cắt qua được kẻ gạch chéo mảnh.","points":0.25},{"type":"mcq","level":"TH","q":"Kiểm tra bản vẽ kĩ thuật cần xem những gì?","options":["A. Hình dạng, kích thước, kí hiệu và tính hợp lý của bản vẽ","B. Chỉ xem màu sắc","C. Chỉ xem khung tên","D. Không cần kiểm tra"],"answer":"A","explain":"Kiểm tra bản vẽ gồm hình biểu diễn, kích thước đầy đủ, kí hiệu đúng quy ước.","points":0.25},{"type":"mcq","level":"VD","q":"Phát hiện bản vẽ thiếu kích thước của một lỗ quan trọng. Cần làm gì?","options":["A. Đoán kích thước để làm","B. Bỏ qua lỗ đó","C. Bổ sung kích thước còn thiếu trước khi chế tạo","D. Chế tạo tùy ý"],"answer":"C","explain":"Thiếu kích thước không thể chế tạo chính xác; phải bổ sung đầy đủ trước khi sản xuất.","points":0.25},{"type":"mcq","level":"NB","q":"Cán thép là công nghệ gì?","options":["A. Nấu chảy thép","B. Cắt thép","C. Hàn thép","D. Ép phôi thép qua khe hở giữa các trục cán để tạo hình"],"answer":"D","explain":"Cán dùng trục quay ép phôi thành tấm, thanh, ray có tiết diện đều.","points":0.25},{"type":"mcq","level":"NB","q":"Kéo sợi kim loại dùng để làm gì?","options":["A. Đập kim loại","B. Kéo phôi qua khuôn để tạo dây, ống có tiết diện nhỏ","C. Nấu chảy","D. Sơn phủ"],"answer":"B","explain":"Kéo sợi cho dây điện, dây cáp có đường kính nhỏ, dài và đều.","points":0.25},{"type":"mcq","level":"NB","q":"Ép đùn dùng để chế tạo sản phẩm nào?","options":["A. Chi tiết đúc","B. Ống nhựa, thanh nhôm định hình","C. Bánh răng","D. Trục máy"],"answer":"B","explain":"Ép đùn đẩy vật liệu qua khuôn tạo sản phẩm dài có tiết diện không đổi như ống, thanh.","points":0.25},{"type":"mcq","level":"VD","q":"Cần làm 500 mét ống nhựa dẫn nước. Nên chọn công nghệ nào?","options":["A. Tiện từng đoạn","B. Hàn từng đoạn","C. Ép đùn nhựa","D. Rèn"],"answer":"C","explain":"Ống nhựa dài, tiết diện đều nên ép đùn là công nghệ phù hợp nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Trước khi sửa chữa điện, việc đầu tiên phải làm là gì?","options":["A. Sửa ngay cho nhanh","B. Gọi điện thoại","C. Ngắt nguồn điện","D. Uống nước"],"answer":"C","explain":"Ngắt nguồn là nguyên tắc an toàn đầu tiên và quan trọng nhất khi sửa điện.","points":0.25},{"type":"mcq","level":"NB","q":"Bút thử điện dùng để làm gì?","options":["A. Sửa điện","B. Cắt dây điện","C. Đo điện áp chính xác","D. Kiểm tra dây hoặc thiết bị có điện hay không"],"answer":"D","explain":"Bút thử điện phát sáng khi chạm vào nơi có điện, giúp kiểm tra nhanh an toàn.","points":0.25},{"type":"mcq","level":"NB","q":"Găng tay cách điện có tác dụng gì?","options":["A. Bảo vệ tay khỏi bị điện giật khi làm việc với điện","B. Giữ ấm tay","C. Trang trí","D. Cầm nắm chắc hơn"],"answer":"A","explain":"Găng tay cách điện ngăn dòng điện truyền qua tay, là đồ bảo hộ bắt buộc của thợ điện.","points":0.25},{"type":"mcq","level":"NB","q":"Thảm cách điện dùng để làm gì?","options":["A. Trải sàn cho đẹp","B. Đứng lên khi sửa điện để cách điện với đất","C. Lau chân","D. Che máy"],"answer":"B","explain":"Thảm cách điện ngăn dòng điện qua người xuống đất khi thao tác với thiết bị điện.","points":0.25},{"type":"mcq","level":"TH","q":"Khoảng cách an toàn với đường dây cao thế là gì?","options":["A. Khoảng cách tối thiểu phải giữ để không bị phóng điện","B. Đứng sát cột điện","C. Trèo lên cột điện","D. Không cần khoảng cách"],"answer":"A","explain":"Điện cao thế có thể phóng điện qua không khí nên phải giữ khoảng cách an toàn, không tới gần.","points":0.25},{"type":"mcq","level":"TH","q":"Khi dây điện đứt rơi xuống đường sau bão, cần làm gì?","options":["A. Tránh xa, rào chắn và báo cho ngành điện","B. Nhặt dây lên","C. Bước qua dây","D. Chụp ảnh gần dây"],"answer":"A","explain":"Dây đứt có thể còn điện rất nguy hiểm; tuyệt đối tránh xa và báo cơ quan điện lực.","points":0.25},{"type":"mcq","level":"VD","q":"Mái tôn nhà bạn H chạm vào dây điện. Cách xử lý đúng là gì?","options":["A. Tự gỡ dây điện ra","B. Không chạm vào mái tôn, ngắt điện và gọi thợ điện xử lý","C. Chạm thử xem có điện không","D. Mặc kệ"],"answer":"B","explain":"Mái tôn chạm dây điện có thể nhiễm điện toàn bộ; phải ngắt nguồn và nhờ thợ chuyên môn.","points":0.25},{"type":"mcq","level":"NB","q":"Rơ le điện từ hoạt động dựa trên hiện tượng nào?","options":["A. Nung nóng","B. Làm lạnh","C. Nam châm điện hút tiếp điểm khi có dòng điện","D. Ngẫu nhiên"],"answer":"C","explain":"Dòng điện qua cuộn dây tạo nam châm điện hút tiếp điểm để đóng cắt mạch.","points":0.25},{"type":"mcq","level":"TH","q":"Khởi động từ (công tắc tơ) dùng để làm gì?","options":["A. Phát điện","B. Tích điện","C. Đóng cắt mạch điện động cơ công suất lớn","D. Đo dòng điện"],"answer":"C","explain":"Khởi động từ điều khiển động cơ lớn bằng tín hiệu nhỏ, bảo vệ quá tải.","points":0.25},{"type":"mcq","level":"TH","q":"Bảo vệ quá tải cho động cơ thực hiện như thế nào?","options":["A. Để động cơ chạy thoải mái","B. Dùng rơ le nhiệt tự ngắt khi dòng điện quá lớn lâu","C. Tăng điện áp","D. Không cần bảo vệ"],"answer":"B","explain":"Rơ le nhiệt phát hiện quá tải kéo dài và ngắt mạch bảo vệ động cơ khỏi cháy.","points":0.25},{"type":"mcq","level":"VD","q":"Động cơ máy bơm nước chạy yếu và nóng bất thường. Nguyên nhân có thể là gì?","options":["A. Nước quá sạch","B. Trời mát","C. Không có nguyên nhân","D. Điện áp thấp hoặc quá tải"],"answer":"D","explain":"Điện áp thấp hoặc tải nặng khiến động cơ quá dòng, nóng lên; cần kiểm tra điện áp và tải.","points":0.25},{"type":"truefalse","level":"TH","q":"Tìm hiểu về vật liệu mới, một số bạn đưa ra ý kiến:","statements":["a) Vật liệu mới giúp sản phẩm nhẹ hơn và bền hơn.","b) Graphene là vật liệu rất cứng và dẫn điện tốt.","c) Vật liệu mới không có ứng dụng gì trong thực tế.","d) Nghiên cứu vật liệu mới tốn kém nên không cần thiết."],"answer":["T","T","F","F"],"explain":"a) Đúng: vật liệu mới cải thiện tính chất sản phẩm. b) Đúng: graphene cứng, nhẹ, dẫn điện tốt. c) Sai: vật liệu mới ứng dụng trong điện tử, y tế, hàng không. d) Sai: nghiên cứu vật liệu mới mang lại lợi ích lâu dài.","points":1},{"type":"truefalse","level":"VD","q":"Thực hành an toàn khi sửa chữa điện, các bạn thống nhất:","statements":["a) Tay ướt sửa điện sẽ thao tác dễ dàng hơn.","b) Dùng bút thử điện để kiểm tra thiết bị còn điện hay không.","c) Đi găng tay cách điện khi làm việc với điện.","d) Đứng trên thảm cách điện khi sửa chữa điện."],"answer":["F","T","T","T"],"explain":"a) Sai: tay ướt rất dễ bị điện giật, tuyệt đối tránh. b) Đúng: bút thử điện kiểm tra nhanh có điện hay không. c) Đúng: găng tay cách điện bảo vệ tay. d) Đúng: thảm cách điện ngăn dòng điện qua người xuống đất.","points":1},{"type":"truefalse","level":"TH","q":"Về mặt cắt trong bản vẽ kĩ thuật, một số bạn phát biểu:","statements":["a) Mặt cắt chỉ vẽ phần vật thể bị mặt phẳng cắt qua.","b) Mặt cắt đặt ngay trên hình chiếu được gọi là mặt cắt rời.","c) Mặt cắt giúp thấy rõ hình dạng tiết diện của vật thể.","d) Trên mặt cắt không cần kẻ gạch chéo."],"answer":["T","F","T","F"],"explain":"a) Đúng: đó là định nghĩa mặt cắt. b) Sai: đặt trên hình chiếu là mặt cắt chập; đặt ngoài là mặt cắt rời. c) Đúng: mặt cắt thể hiện tiết diện. d) Sai: phần bị cắt phải kẻ gạch chéo theo quy ước.","points":1},{"type":"truefalse","level":"VD","q":"Dây chuyền hàn tự động dùng robot, một số bạn nhận xét:","statements":["a) Robot hàn làm việc chính xác và nhanh hơn con người.","b) Robot hàn không cần lập trình vẫn làm được.","c) Robot hàn có thể thay thế hoàn toàn kĩ sư thiết kế.","d) Dùng robot hàn giúp mối hàn đều và đẹp hơn."],"answer":["T","F","F","T"],"explain":"a) Đúng: robot làm việc ổn định, chính xác. b) Sai: robot phải được lập trình quỹ đạo hàn. c) Sai: con người vẫn cần thiết kế, lập trình và giám sát robot. d) Đúng: robot cho mối hàn đồng đều, chất lượng cao.","points":1}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Mở xưởng cơ khí nhỏ cần chuẩn bị gì?","options":["A. Chỉ cần ý tưởng","B. Không cần gì","C. Chỉ cần may mắn","D. Vốn, mặt bằng, máy móc và tay nghề"],"answer":"D","explain":"Mở xưởng cần vốn đầu tư, mặt bằng, thiết bị và thợ có tay nghề.","points":0.25},{"type":"mcq","level":"TH","q":"Trước khi mở xưởng, vì sao cần tìm hiểu nhu cầu thị trường?","options":["A. Để biết khách hàng cần gì, tránh sản xuất thứ không ai mua","B. Để tốn thời gian","C. Không cần thiết","D. Để khoe kiến thức"],"answer":"A","explain":"Tìm hiểu thị trường giúp chọn sản phẩm phù hợp, tăng cơ hội thành công.","points":0.25},{"type":"mcq","level":"NB","q":"Bằng sáng chế bảo hộ cho ai?","options":["A. Người mua sản phẩm","B. Người bán hàng","C. Mọi người","D. Người sáng tạo ra giải pháp kĩ thuật mới"],"answer":"D","explain":"Bằng sáng chế bảo hộ quyền của tác giả sáng chế, ngăn người khác sao chép.","points":0.25},{"type":"mcq","level":"NB","q":"Hợp tác giữa trường học và doanh nghiệp mang lại lợi ích gì?","options":["A. Không có lợi ích","B. Chỉ tốn tiền","C. Học sinh được thực hành thực tế, doanh nghiệp có nhân lực tốt","D. Mất thời gian"],"answer":"C","explain":"Hợp tác giúp đào tạo gắn với thực tế, học sinh ra trường làm được việc ngay.","points":0.25},{"type":"mcq","level":"NB","q":"Hiệu chỉnh máy sau khi lắp ráp là gì?","options":["A. Sơn máy","B. Điều chỉnh để máy hoạt động đúng thông số kĩ thuật","C. Lau máy","D. Bán máy"],"answer":"B","explain":"Hiệu chỉnh căn chỉnh các bộ phận để máy chạy đúng, ổn định.","points":0.25},{"type":"mcq","level":"TH","q":"Chạy thử máy sau lắp ráp nhằm mục đích gì?","options":["A. Phát hiện lỗi để sửa trước khi đưa vào sử dụng","B. Tốn điện","C. Khoe máy mới","D. Không cần thiết"],"answer":"A","explain":"Chạy thử giúp phát hiện và khắc phục lỗi, đảm bảo máy an toàn khi vận hành.","points":0.25},{"type":"mcq","level":"TH","q":"Bảo dưỡng máy móc định kỳ có tác dụng gì?","options":["A. Kéo dài tuổi thọ máy và phòng hỏng hóc đột ngột","B. Tốn tiền","C. Mất thời gian","D. Không cần thiết"],"answer":"A","explain":"Bảo dưỡng gồm vệ sinh, tra dầu, kiểm tra giúp máy bền và chạy ổn định.","points":0.25},{"type":"mcq","level":"NB","q":"Sửa chữa máy khi hỏng cần làm gì đầu tiên?","options":["A. Tháo tung máy ra","B. Mua máy mới ngay","C. Bỏ mặc","D. Xác định nguyên nhân hỏng hóc"],"answer":"D","explain":"Chẩn đoán đúng nguyên nhân mới sửa hiệu quả, tránh thay thế linh kiện không cần thiết.","points":0.25},{"type":"mcq","level":"VD","q":"Máy tiện kêu to bất thường khi chạy. Cần xử lý thế nào?","options":["A. Cứ chạy tiếp","B. Tăng tốc độ","C. Dừng máy, kiểm tra dầu mỡ, độ rơ và chi tiết lỏng","D. Đổ thêm dầu khi máy đang chạy"],"answer":"C","explain":"Tiếng kêu bất thường báo hiệu sự cố; phải dừng máy kiểm tra an toàn, không sửa khi máy chạy.","points":0.25},{"type":"mcq","level":"NB","q":"Phôi thanh là gì?","options":["A. Phôi dạng bột","B. Phôi dạng lỏng","C. Sản phẩm hoàn chỉnh","D. Phôi dạng thanh dài dùng để tiện, phay thành chi tiết"],"answer":"D","explain":"Phôi thanh là thép cây dài, cắt ra từng đoạn rồi gia công thành trục, bu lông.","points":0.25},{"type":"mcq","level":"NB","q":"Lượng dư gia công là gì?","options":["A. Vật liệu thừa vứt đi","B. Sản phẩm lỗi","C. Lượng vật liệu để lại trên phôi cho các bước gia công tiếp theo","D. Dụng cụ cắt"],"answer":"C","explain":"Phôi được làm lớn hơn chi tiết một lượng dư để cắt gọt dần tới kích thước yêu cầu.","points":0.25},{"type":"mcq","level":"NB","q":"Gá đặt chi tiết khi gia công có tác dụng gì?","options":["A. Trang trí","B. Giữ chặt chi tiết đúng vị trí để gia công chính xác","C. Làm nóng chi tiết","D. Không cần thiết"],"answer":"B","explain":"Gá kẹp chặt chi tiết, chống rung lắc giúp gia công đúng kích thước.","points":0.25},{"type":"mcq","level":"VD","q":"Tiện một trục dài mà trục bị rung, bề mặt xấu. Khắc phục bằng cách nào?","options":["A. Tăng tốc độ tối đa","B. Dùng chống tâm đỡ đầu trục và giảm tốc độ cắt","C. Tháo chống tâm ra","D. Cứ tiện tiếp"],"answer":"B","explain":"Trục dài dễ rung; chống tâm đỡ và tốc độ hợp lý giúp bề mặt đẹp, chính xác.","points":0.25},{"type":"mcq","level":"NB","q":"Tấm pin mặt trời nên lắp hướng nào ở Việt Nam?","options":["A. Hướng Bắc","B. Hướng nào cũng như nhau","C. Hướng Nam để hứng nắng nhiều nhất trong ngày","D. Úp xuống đất"],"answer":"C","explain":"Ở bán cầu Bắc, hướng Nam nhận được nhiều nắng nhất, cho hiệu suất cao nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Inverter trong hệ thống điện mặt trời có nhiệm vụ gì?","options":["A. Biến điện một chiều từ pin thành điện xoay chiều để sử dụng","B. Tích trữ điện","C. Phát điện","D. Che nắng"],"answer":"A","explain":"Pin mặt trời cho dòng một chiều; inverter đổi thành xoay chiều 220V dùng cho thiết bị gia đình.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao cần vệ sinh tấm pin mặt trời định kỳ?","options":["A. Để đẹp","B. Không cần thiết","C. Để tốn nước","D. Bụi bẩn che phủ làm giảm hiệu suất phát điện"],"answer":"D","explain":"Lớp bụi làm giảm ánh sáng tới pin; vệ sinh định kỳ giữ hiệu suất ổn định.","points":0.25},{"type":"mcq","level":"NB","q":"Hòa lưới điện mặt trời là gì?","options":["A. Tách khỏi lưới điện","B. Không dùng điện lưới","C. Đấu nối hệ thống điện mặt trời với lưới điện quốc gia","D. Cắt điện lưới"],"answer":"C","explain":"Hòa lưới cho phép dùng điện mặt trời, thừa bán lại cho ngành điện, thiếu lấy từ lưới.","points":0.25},{"type":"mcq","level":"TH","q":"Bóng che lên tấm pin mặt trời gây hại gì?","options":["A. Làm giảm mạnh sản lượng điện của cả hệ thống","B. Không ảnh hưởng","C. Làm tăng sản lượng","D. Làm mát pin"],"answer":"A","explain":"Bóng che làm giảm hiệu suất, lâu dài có thể gây nóng cục bộ hỏng pin.","points":0.25},{"type":"mcq","level":"NB","q":"Tuổi thọ tấm pin mặt trời khoảng bao lâu?","options":["A. 1 năm","B. Khoảng 25 đến 30 năm","C. 5 năm","D. Vĩnh viễn"],"answer":"B","explain":"Tấm pin chất lượng tốt dùng được 25-30 năm, hiệu suất giảm dần theo thời gian.","points":0.25},{"type":"mcq","level":"VD","q":"Hóa đơn tiền điện giảm sau khi lắp điện mặt trời áp mái. Vì sao?","options":["A. Vì công tơ hỏng","B. Vì không dùng điện nữa","C. Ngẫu nhiên","D. Vì tự sản xuất điện dùng ban ngày, giảm lượng điện mua từ lưới"],"answer":"D","explain":"Điện mặt trời đáp ứng nhu cầu ban ngày nên giảm điện mua từ lưới, tiền điện giảm.","points":0.25},{"type":"mcq","level":"NB","q":"Nhà máy thông minh là gì?","options":["A. Nhà máy không có máy móc","B. Nhà máy tự động hóa cao, kết nối dữ liệu trong sản xuất","C. Nhà máy thủ công","D. Nhà máy bỏ hoang"],"answer":"B","explain":"Nhà máy thông minh dùng robot, IoT, AI để sản xuất linh hoạt, hiệu quả.","points":0.25},{"type":"mcq","level":"TH","q":"Dữ liệu lớn (big data) giúp nhà máy như thế nào?","options":["A. Không có ích","B. Phân tích để tối ưu sản xuất và dự báo nhu cầu","C. Chỉ tốn bộ nhớ","D. Làm chậm sản xuất"],"answer":"B","explain":"Phân tích dữ liệu lớn giúp phát hiện lãng phí, dự báo hỏng hóc và nhu cầu thị trường.","points":0.25},{"type":"mcq","level":"TH","q":"Mạng 5G ứng dụng trong công nghiệp ra sao?","options":["A. Truyền dữ liệu siêu nhanh cho robot và điều khiển từ xa","B. Chỉ để xem phim","C. Không có ứng dụng","D. Chỉ dùng cho điện thoại"],"answer":"A","explain":"5G tốc độ cao, độ trễ thấp cho phép điều khiển robot, xe tự hành trong nhà máy theo thời gian thực.","points":0.25},{"type":"mcq","level":"VD","q":"Một công ty muốn biết máy nào sắp hỏng để bảo trì trước. Nên ứng dụng công nghệ nào?","options":["A. Đoán mò","B. Chờ máy hỏng mới sửa","C. Cảm biến kết hợp phân tích dữ liệu lớn và AI","D. Thay máy mới hằng năm"],"answer":"C","explain":"Bảo trì dự báo dùng cảm biến và AI phân tích, giúp sửa trước khi hỏng, tiết kiệm chi phí.","points":0.25},{"type":"truefalse","level":"VD","q":"Bạn A muốn mở xưởng cơ khí nhỏ sau khi ra trường, các bạn góp ý:","statements":["a) Mở xưởng không cần đăng ký kinh doanh hay giấy phép gì.","b) Cần chuẩn bị vốn, mặt bằng, máy móc và tay nghề.","c) Cần tìm hiểu nhu cầu thị trường trước khi đầu tư.","d) Mở xưởng thành công chỉ nhờ may mắn, không cần kiến thức."],"answer":["F","T","T","F"],"explain":"a) Sai: kinh doanh phải đăng ký và tuân thủ pháp luật. b) Đúng: đó là các điều kiện cơ bản để mở xưởng. c) Đúng: hiểu thị trường giúp chọn sản phẩm đúng. d) Sai: cần kiến thức kĩ thuật, quản lý và chất lượng sản phẩm.","points":1},{"type":"truefalse","level":"TH","q":"Về hệ thống điện mặt trời áp mái, một số bạn phát biểu:","statements":["a) Tấm pin nên lắp hướng Nam để hứng được nhiều nắng nhất.","b) Cần vệ sinh tấm pin định kỳ để giữ hiệu suất.","c) Bóng cây che lên tấm pin không ảnh hưởng gì.","d) Inverter biến điện một chiều thành điện xoay chiều để sử dụng."],"answer":["T","T","F","T"],"explain":"a) Đúng: hướng Nam tối ưu ở Việt Nam. b) Đúng: bụi bẩn làm giảm sản lượng điện. c) Sai: bóng che làm giảm mạnh hiệu suất hệ thống. d) Đúng: đó là nhiệm vụ của inverter.","points":1},{"type":"truefalse","level":"TH","q":"Lắp ráp một chiếc xe đồ chơi theo hướng dẫn, các bạn rút ra:","statements":["a) Cần lắp đúng thứ tự các bước theo hướng dẫn.","b) Siết ốc càng chặt càng tốt, không sợ hỏng.","c) Sau khi lắp xong nên kiểm tra xe chạy thử.","d) Nên tra dầu vào các chi tiết chuyển động."],"answer":["T","F","T","T"],"explain":"a) Đúng: đúng thứ tự giúp lắp ráp thuận lợi. b) Sai: siết quá chặt gây tuột ren, nứt chi tiết nhựa. c) Đúng: chạy thử phát hiện lỗi lắp. d) Đúng: bôi trơn giúp chuyển động êm.","points":1},{"type":"truefalse","level":"VD","q":"Tìm hiểu về mạch tích hợp, một số bạn phát biểu:","statements":["a) Mạch tích hợp chứa nhiều linh kiện điện tử thu nhỏ.","b) Mạch tích hợp không bao giờ bị hỏng.","c) IC chỉ dùng trong máy tính, không dùng trong thiết bị khác.","d) Điện thoại thông minh hiện nay dùng rất nhiều IC."],"answer":["T","F","F","T"],"explain":"a) Đúng: IC tích hợp hàng nghìn linh kiện trên chip. b) Sai: IC vẫn có thể hỏng do quá áp, quá nhiệt. c) Sai: IC có mặt trong hầu hết thiết bị điện tử hiện nay. d) Đúng: điện thoại là tập hợp của rất nhiều IC.","points":1}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Vai trò của công nghệ đối với đời sống là gì?","options":["A. Không có vai trò","B. Chỉ gây hại","C. Nâng cao năng suất, chất lượng cuộc sống","D. Chỉ để giải trí"],"answer":"C","explain":"Công nghệ giúp sản xuất hiệu quả, đời sống tiện nghi và xã hội phát triển.","points":0.25},{"type":"mcq","level":"TH","q":"Phát triển bền vững trong công nghiệp nghĩa là gì?","options":["A. Chỉ tăng trưởng kinh tế","B. Phát triển kinh tế gắn với bảo vệ môi trường và xã hội","C. Khai thác cạn tài nguyên","D. Gây ô nhiễm"],"answer":"B","explain":"Phát triển bền vững đáp ứng nhu cầu hiện tại mà không tổn hại thế hệ tương lai.","points":0.25},{"type":"mcq","level":"TH","q":"Trách nhiệm xã hội của doanh nghiệp công nghiệp là gì?","options":["A. Chỉ kiếm lợi nhuận","B. Xả thải bừa bãi","C. Trốn thuế","D. Sản xuất an toàn, bảo vệ môi trường và đóng góp cộng đồng"],"answer":"D","explain":"Doanh nghiệp có trách nhiệm với môi trường, người lao động và cộng đồng.","points":0.25},{"type":"mcq","level":"NB","q":"Nghề kĩ thuật trong tương lai cần người lao động như thế nào?","options":["A. Chỉ cần khỏe mạnh","B. Không cần học","C. Sợ công nghệ","D. Có tay nghề cao, biết công nghệ số và học tập suốt đời"],"answer":"D","explain":"Cách mạng 4.0 đòi hỏi lao động kĩ thuật cao, thành thạo công nghệ và luôn cập nhật.","points":0.25},{"type":"mcq","level":"NB","q":"Hình chiếu vuông góc gồm những hình nào?","options":["A. Chỉ hình chiếu đứng","B. Hình chiếu đứng, hình chiếu bằng và hình chiếu cạnh","C. Hình chụp","D. Hình vẽ tay"],"answer":"B","explain":"Ba hình chiếu vuông góc cơ bản mô tả đầy đủ vật thể trong bản vẽ kĩ thuật.","points":0.25},{"type":"mcq","level":"TH","q":"Khi nào dùng hình cắt toàn phần?","options":["A. Khi vật thể đơn giản","B. Khi không cần thể hiện bên trong","C. Khi cần thể hiện toàn bộ cấu tạo bên trong của vật thể","D. Luôn dùng"],"answer":"C","explain":"Hình cắt toàn phần cắt suốt vật thể, phù hợp khi cần thấy hết cấu tạo bên trong.","points":0.25},{"type":"mcq","level":"NB","q":"Đọc bản vẽ lắp cần chú ý thông tin nào nhất?","options":["A. Màu sắc bản vẽ","B. Chữ ký","C. Giá tiền","D. Vị trí lắp ghép các chi tiết và bảng kê"],"answer":"D","explain":"Bản vẽ lắp quan trọng nhất là vị trí tương quan chi tiết và bảng kê để lắp đúng.","points":0.25},{"type":"mcq","level":"NB","q":"Tiêu chuẩn bản vẽ kĩ thuật có tác dụng gì?","options":["A. Làm khó người vẽ","B. Thống nhất cách vẽ để mọi người đều đọc hiểu được","C. Không cần thiết","D. Chỉ để trang trí"],"answer":"B","explain":"Tiêu chuẩn thống nhất nét vẽ, kí hiệu, khung tên giúp bản vẽ được hiểu đúng ở mọi nơi.","points":0.25},{"type":"mcq","level":"VD","q":"Hai người ở hai công ty khác nhau cùng đọc một bản vẽ và hiểu giống nhau. Vì sao?","options":["A. Vì hai người quen nhau","B. Ngẫu nhiên","C. Vì bản vẽ tuân theo tiêu chuẩn thống nhất","D. Vì bản vẽ đẹp"],"answer":"C","explain":"Tiêu chuẩn bản vẽ là ngôn ngữ kĩ thuật chung, ai cũng đọc hiểu giống nhau.","points":0.25},{"type":"mcq","level":"NB","q":"Chọn vật liệu cho chi tiết máy cần dựa vào đâu?","options":["A. Sở thích","B. Yêu cầu về độ bền, điều kiện làm việc và giá thành","C. Màu sắc","D. Ngẫu nhiên"],"answer":"B","explain":"Chọn vật liệu cân nhắc cơ tính, môi trường làm việc và hiệu quả kinh tế.","points":0.25},{"type":"mcq","level":"TH","q":"Chi tiết chịu mài mòn cao nên chọn vật liệu và công nghệ nào?","options":["A. Thép cứng, nhiệt luyện và mài tinh bề mặt","B. Nhựa mềm","C. Gỗ","D. Giấy"],"answer":"A","explain":"Bề mặt chịu mài mòn cần vật liệu cứng, tôi luyện và gia công tinh.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu tiên chọn công nghệ chế tạo dựa trên yếu tố nào?","options":["A. Hình dạng, số lượng chi tiết và yêu cầu kĩ thuật","B. Sở thích người thợ","C. Ngẫu nhiên","D. Công nghệ đắt nhất"],"answer":"A","explain":"Chọn công nghệ phù hợp hình dạng, sản lượng và độ chính xác để hiệu quả nhất.","points":0.25},{"type":"mcq","level":"VD","q":"Cần 5 chi tiết mẫu để thử nghiệm, hình dạng phức tạp. Nên chọn công nghệ nào?","options":["A. Đúc hàng loạt","B. In 3D vì nhanh và không cần khuôn","C. Dập hàng loạt","D. Rèn hàng loạt"],"answer":"B","explain":"Số lượng ít, cần nhanh, hình phức tạp nên in 3D; đúc, dập cần làm khuôn tốn kém.","points":0.25},{"type":"mcq","level":"NB","q":"Khi ngửi thấy mùi khét từ ổ điện, cần làm gì?","options":["A. Ngắt aptomat ngay và kiểm tra","B. Tiếp tục dùng","C. Dùng nước dập","D. Bỏ đi chơi"],"answer":"A","explain":"Mùi khét báo hiệu chập cháy; ngắt điện ngay, tuyệt đối không dùng nước với điện.","points":0.25},{"type":"mcq","level":"NB","q":"Cháy do điện cần dập bằng gì?","options":["A. Nước","B. Quạt cho tắt","C. Chờ cháy hết","D. Bình chữa cháy chuyên dụng, tuyệt đối không dùng nước"],"answer":"D","explain":"Nước dẫn điện nguy hiểm khi cháy điện; dùng bình chữa cháy khô hoặc cát, ngắt nguồn trước.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao không nên cắm nhiều thiết bị vào một ổ cắm?","options":["A. Dễ gây quá tải, nóng dây và chập cháy","B. Để gọn","C. Tiết kiệm ổ cắm","D. Không sao cả"],"answer":"A","explain":"Quá nhiều thiết bị trên một ổ gây quá tải dòng điện, nguy cơ cháy cao.","points":0.25},{"type":"mcq","level":"NB","q":"Phòng cháy trong xưởng cơ khí cần gì?","options":["A. Không cần gì","B. Để xăng gần máy hàn","C. Hút thuốc trong xưởng","D. Bình chữa cháy, lối thoát hiểm và không để vật dễ cháy gần nguồn lửa"],"answer":"D","explain":"Xưởng cơ khí có nguy cơ cháy nổ nên cần bình chữa cháy, lối thoát và quy định an toàn.","points":0.25},{"type":"mcq","level":"TH","q":"Dây điện đi âm tường có ưu điểm gì?","options":["A. Dễ sửa chữa hơn","B. Rẻ hơn","C. Gọn đẹp và an toàn hơn dây nổi","D. Không cần ống bảo vệ"],"answer":"C","explain":"Đi âm tường gọn, tránh va chạm nhưng sửa chữa khó hơn; cần luồn trong ống bảo vệ.","points":0.25},{"type":"mcq","level":"NB","q":"Vì sao nên dùng ống luồn dây điện?","options":["A. Bảo vệ dây khỏi va đập, ẩm ướt và chuột cắn","B. Trang trí","C. Tăng điện áp","D. Giảm tiền điện"],"answer":"A","explain":"Ống luồn bảo vệ dây dẫn, tăng an toàn và tuổi thọ hệ thống điện.","points":0.25},{"type":"mcq","level":"VD","q":"Ổ cắm bị lỏng, phích cắm hay tuột ra. Nguy cơ và cách xử lý là gì?","options":["A. Không sao, cứ dùng","B. Chèn giấy vào","C. Tiếp xúc kém gây tóe lửa; ngắt điện và thay ổ cắm mới","D. Dùng băng dính quấn"],"answer":"C","explain":"Ổ lỏng gây tiếp xúc kém, phát nhiệt, tóe lửa; cần thay mới, không chèn vật lạ.","points":0.25},{"type":"mcq","level":"NB","q":"Linh kiện điện tử nào dùng để phát sáng?","options":["A. Điện trở","B. Tụ điện","C. Cuộn cảm","D. Đèn LED"],"answer":"D","explain":"LED là diode phát quang, biến điện thành ánh sáng hiệu suất cao.","points":0.25},{"type":"mcq","level":"NB","q":"Hệ thống nhúng là gì?","options":["A. Hệ thống lớn","B. Máy tính để bàn","C. Hệ thống điện tử nhỏ được lập trình làm một nhiệm vụ chuyên dụng","D. Điện thoại"],"answer":"C","explain":"Hệ thống nhúng như trong máy giặt, điều hòa là chip lập trình sẵn cho một nhiệm vụ.","points":0.25},{"type":"mcq","level":"TH","q":"Vi điều khiển khác máy tính ở điểm nào?","options":["A. Mạnh hơn máy tính","B. Nhỏ gọn, chuyên làm một nhiệm vụ điều khiển cụ thể","C. Đắt hơn máy tính","D. To hơn máy tính"],"answer":"B","explain":"Vi điều khiển là máy tính thu nhỏ, giá rẻ, chuyên điều khiển thiết bị tự động.","points":0.25},{"type":"mcq","level":"VD","q":"Máy giặt tự động chọn chế độ giặt theo khối lượng quần áo. Đây là ví dụ về gì?","options":["A. Hệ thống nhúng với cảm biến và điều khiển tự động","B. Điều khiển bằng tay","C. Ngẫu nhiên","D. Máy hỏng"],"answer":"A","explain":"Cảm biến đo khối lượng, vi điều khiển chọn chế độ phù hợp — ví dụ hệ thống nhúng thông minh.","points":0.25},{"type":"truefalse","level":"TH","q":"Tìm hiểu về tự động hóa trong sản xuất, một số bạn đưa ra ý kiến:","statements":["a) Tự động hóa giúp tăng năng suất lao động.","b) Tự động hóa thay thế hoàn toàn con người trong mọi công việc.","c) Hệ thống tự động vẫn cần nhân lực vận hành và bảo trì.","d) Tự động hóa giúp giảm sai sót trong sản xuất."],"answer":["T","F","T","T"],"explain":"a) Đúng: máy móc làm việc nhanh, liên tục. b) Sai: con người vẫn cần thiết kế, vận hành, bảo trì. c) Đúng: cần kĩ thuật viên vận hành, sửa chữa. d) Đúng: máy móc ổn định, ít sai sót hơn.","points":1},{"type":"truefalse","level":"VD","q":"Ổ cắm điện trong phòng học bị nóng bất thường, các bạn nhận định:","statements":["a) Quá tải điện không gây nguy hiểm gì đáng kể.","b) Cắm quá nhiều thiết bị vào một ổ cắm có thể gây quá tải.","c) Dây dẫn nóng bất thường là dấu hiệu nguy hiểm cần xử lý.","d) Aptomat sẽ tự ngắt khi xảy ra quá tải để bảo vệ."],"answer":["F","T","T","T"],"explain":"a) Sai: quá tải là nguyên nhân phổ biến gây cháy nổ điện. b) Đúng: tổng công suất vượt khả năng ổ cắm gây quá tải. c) Đúng: dây nóng có thể chảy vỏ cách điện, gây cháy. d) Đúng: aptomat bảo vệ quá tải, ngắn mạch.","points":1},{"type":"truefalse","level":"TH","q":"Ôn tập cách đọc bản vẽ kĩ thuật, một số bạn phát biểu:","statements":["a) Đọc bản vẽ cần kết hợp các hình chiếu để hình dung vật thể.","b) Con số kích thước cho biết độ lớn thật của chi tiết.","c) Chỉ cần nhìn một hình chiếu là đủ hiểu vật thể.","d) Khung tên cho biết vật liệu và tỉ lệ bản vẽ."],"answer":["T","T","F","T"],"explain":"a) Đúng: phối hợp các hình chiếu mới hình dung đầy đủ. b) Đúng: con số kích thước là kích thước thật. c) Sai: một hình chiếu không đủ mô tả vật thể 3 chiều. d) Đúng: vật liệu, tỉ lệ ghi trong khung tên.","points":1},{"type":"truefalse","level":"VD","q":"So sánh điều khiển bằng tay và điều khiển tự động, một số bạn phát biểu:","statements":["a) Điều khiển tự động không bao giờ xảy ra sai sót.","b) Điều khiển tự động hoạt động theo chương trình hoặc tín hiệu cảm biến.","c) Điều khiển bằng tay không cần con người thao tác.","d) Nhiều hệ thống kết hợp cả điều khiển tay và tự động."],"answer":["F","T","F","T"],"explain":"a) Sai: hệ thống tự động vẫn có thể lỗi do hỏng cảm biến, lập trình sai. b) Đúng: đó là đặc điểm của điều khiển tự động. c) Sai: điều khiển bằng tay cần con người trực tiếp thao tác. d) Đúng: nhiều máy có cả chế độ tay và tự động.","points":1}]}]}
