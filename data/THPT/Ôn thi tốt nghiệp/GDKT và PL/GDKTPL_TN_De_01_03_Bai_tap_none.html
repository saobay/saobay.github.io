<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Pháp luật là gì?", "options": ["A. Tập hợp các phong tục, tập quán của cộng đồng dân cư.", "B. Hệ thống các quy tắc xử sự chung do Nhà nước ban hành và được bảo đảm thực hiện bằng quyền lực nhà nước.", "C. Những quy định nội bộ của các tổ chức xã hội.", "D. Hệ thống các chuẩn mực đạo đức do xã hội tự nguyện tuân theo."], "answer": "B", "explain": "Theo chương trình GDPT 2018, pháp luật là hệ thống các quy tắc xử sự chung do Nhà nước ban hành và được bảo đảm thực hiện bằng quyền lực nhà nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, tất cả quyền lực nhà nước ở nước Cộng hòa xã hội chủ nghĩa Việt Nam thuộc về ai?", "options": ["A. Chính phủ.", "B. Đảng Cộng sản Việt Nam.", "C. Quốc hội.", "D. Nhân dân."], "answer": "D", "explain": "Điều 2 Hiến pháp 2013: Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam là Nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân; tất cả quyền lực nhà nước thuộc về Nhân dân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Bầu cử đại biểu Quốc hội và đại biểu Hội đồng nhân dân năm 2015, công dân từ đủ bao nhiêu tuổi trở lên có quyền bầu cử?", "options": ["A. Từ đủ 18 tuổi trở lên.", "B. Từ đủ 20 tuổi trở lên.", "C. Từ đủ 16 tuổi trở lên.", "D. Từ đủ 21 tuổi trở lên."], "answer": "A", "explain": "Điều 2 Luật Bầu cử đại biểu Quốc hội và đại biểu Hội đồng nhân dân 2015: công dân nước Cộng hòa xã hội chủ nghĩa Việt Nam đủ mười tám tuổi trở lên có quyền bầu cử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Bầu cử đại biểu Quốc hội và đại biểu Hội đồng nhân dân năm 2015, công dân từ đủ bao nhiêu tuổi trở lên có quyền ứng cử?", "options": ["A. Từ đủ 18 tuổi trở lên.", "B. Từ đủ 20 tuổi trở lên.", "C. Từ đủ 21 tuổi trở lên.", "D. Từ đủ 25 tuổi trở lên."], "answer": "C", "explain": "Điều 2 Luật Bầu cử đại biểu Quốc hội và đại biểu Hội đồng nhân dân 2015: công dân đủ hai mươi mốt tuổi trở lên có quyền ứng cử đại biểu Quốc hội, đại biểu Hội đồng nhân dân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Doanh nghiệp năm 2020, doanh nghiệp tư nhân là doanh nghiệp do ai làm chủ?", "options": ["A. Một cá nhân làm chủ và tự chịu trách nhiệm bằng toàn bộ tài sản của mình.", "B. Nhà nước làm chủ sở hữu duy nhất.", "C. Hai cá nhân trở lên cùng góp vốn làm chủ.", "D. Một tổ chức làm chủ với vốn điều lệ tối thiểu 10 tỉ đồng."], "answer": "A", "explain": "Điều 188 Luật Doanh nghiệp 2020: doanh nghiệp tư nhân là doanh nghiệp do một cá nhân làm chủ và tự chịu trách nhiệm bằng toàn bộ tài sản của mình về mọi hoạt động của doanh nghiệp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Doanh nghiệp năm 2020, công ty trách nhiệm hữu hạn hai thành viên trở lên có số lượng thành viên là bao nhiêu?", "options": ["A. Từ 2 đến 50 thành viên.", "B. Tối thiểu 2 thành viên, không giới hạn tối đa.", "C. Từ 3 đến 100 thành viên.", "D. Chỉ duy nhất 2 thành viên."], "answer": "A", "explain": "Điều 46 Luật Doanh nghiệp 2020: công ty trách nhiệm hữu hạn hai thành viên trở lên là doanh nghiệp có từ 02 đến 50 thành viên là tổ chức, cá nhân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thuế là gì?", "options": ["A. Khoản tiền phạt khi vi phạm quy định về kinh doanh.", "B. Khoản đóng góp tự nguyện của người dân cho các hoạt động từ thiện.", "C. Khoản phí dịch vụ mà doanh nghiệp thu của khách hàng.", "D. Khoản thu nộp mang tính bắt buộc của tổ chức, cá nhân vào ngân sách nhà nước theo quy định của pháp luật."], "answer": "D", "explain": "Theo chương trình GDPT 2018, thuế là khoản thu nộp mang tính bắt buộc của tổ chức, cá nhân vào ngân sách nhà nước theo quy định của pháp luật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Bộ luật Hình sự năm 2015, người từ đủ bao nhiêu tuổi trở lên phải chịu trách nhiệm hình sự về mọi tội phạm?", "options": ["A. Từ đủ 18 tuổi trở lên.", "B. Từ đủ 16 tuổi trở lên.", "C. Từ đủ 14 tuổi trở lên.", "D. Từ đủ 20 tuổi trở lên."], "answer": "B", "explain": "Điều 12 Bộ luật Hình sự 2015: người từ đủ 16 tuổi trở lên phải chịu trách nhiệm hình sự về mọi tội phạm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Xử lý vi phạm hành chính năm 2012, người từ đủ 14 tuổi đến dưới 16 tuổi bị xử phạt vi phạm hành chính trong trường hợp nào?", "options": ["A. Về vi phạm hành chính do vô ý.", "B. Về vi phạm hành chính do cố ý.", "C. Về mọi vi phạm hành chính.", "D. Không bị xử phạt trong mọi trường hợp."], "answer": "B", "explain": "Điều 5 Luật Xử lý vi phạm hành chính 2012: người từ đủ 14 tuổi đến dưới 16 tuổi bị xử phạt vi phạm hành chính về vi phạm hành chính do cố ý; người từ đủ 16 tuổi trở lên bị xử phạt về mọi vi phạm hành chính.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Hôn nhân và gia đình năm 2014, độ tuổi kết hôn của nam và nữ được quy định như thế nào?", "options": ["A. Nam từ đủ 18 tuổi, nữ từ đủ 16 tuổi.", "B. Nam từ đủ 20 tuổi, nữ từ đủ 18 tuổi.", "C. Nam nữ đều từ đủ 18 tuổi.", "D. Nam nữ đều từ đủ 20 tuổi."], "answer": "B", "explain": "Điều 8 Luật Hôn nhân và gia đình 2014: nam từ đủ 20 tuổi trở lên, nữ từ đủ 18 tuổi trở lên mới được kết hôn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quyền tác giả là quyền của tổ chức, cá nhân đối với đối tượng nào?", "options": ["A. Bí mật kinh doanh của đối thủ cạnh tranh.", "B. Tác phẩm do mình sáng tạo hoặc sở hữu.", "C. Mọi tài sản có giá trị mà mình đang quản lý.", "D. Nhãn hiệu hàng hóa của doanh nghiệp khác."], "answer": "B", "explain": "Theo Luật Sở hữu trí tuệ, quyền tác giả là quyền của tổ chức, cá nhân đối với tác phẩm do mình sáng tạo hoặc sở hữu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bảo hiểm xã hội là sự bảo đảm thay thế hoặc bù đắp một phần thu nhập của người lao động khi nào?", "options": ["A. Khi doanh nghiệp bị thua lỗ trong kinh doanh.", "B. Khi người lao động bị giảm hoặc mất thu nhập do ốm đau, thai sản, tai nạn lao động, bệnh nghề nghiệp, hết tuổi lao động hoặc chết.", "C. Khi người lao động muốn mua nhà, mua xe.", "D. Khi người lao động đi du lịch nước ngoài."], "answer": "B", "explain": "Theo Luật Bảo hiểm xã hội, bảo hiểm xã hội là sự bảo đảm thay thế hoặc bù đắp một phần thu nhập của người lao động khi họ bị giảm hoặc mất thu nhập do ốm đau, thai sản, tai nạn lao động, bệnh nghề nghiệp, hết tuổi lao động hoặc chết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Chị M mở cửa hàng tạp hóa, đã đăng ký hộ kinh doanh; cửa hàng có 3 người làm việc; hằng quý chị kê khai, nộp thuế. Hộ kinh doanh của chị M do ai làm chủ?", "options": ["A. Do một cá nhân hoặc các thành viên hộ gia đình đăng ký thành lập và chịu trách nhiệm bằng toàn bộ tài sản của mình.", "B. Do ít nhất 3 cổ đông góp vốn thành lập.", "C. Do chính quyền địa phương cấp vốn và điều hành.", "D. Do Nhà nước làm chủ và quản lý trực tiếp."], "answer": "A", "explain": "Theo Nghị định 01/2021/NĐ-CP, hộ kinh doanh do một cá nhân hoặc các thành viên hộ gia đình đăng ký thành lập và chịu trách nhiệm bằng toàn bộ tài sản của mình đối với hoạt động kinh doanh của hộ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Chị M mở cửa hàng tạp hóa, đã đăng ký hộ kinh doanh; cửa hàng có 3 người làm việc; hằng quý chị kê khai, nộp thuế. Việc chị M kê khai và nộp thuế hằng quý thể hiện nội dung nào?", "options": ["A. Nghĩa vụ của người kinh doanh đối với Nhà nước.", "B. Quyền được miễn trừ mọi khoản thu của người kinh doanh.", "C. Sự tự nguyện đóng góp từ thiện của người kinh doanh.", "D. Trách nhiệm bồi thường thiệt hại cho khách hàng."], "answer": "A", "explain": "Nộp thuế là nghĩa vụ bắt buộc của tổ chức, cá nhân kinh doanh đối với Nhà nước theo quy định của pháp luật về thuế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Anh K 17 tuổi điều khiển xe máy không có giấy phép lái xe, phóng nhanh vượt ẩu và gây tai nạn làm một người đi đường bị thương nặng. Theo quy định của pháp luật, anh K phải chịu trách nhiệm nào?", "options": ["A. Chỉ bị nhắc nhở vì còn là học sinh.", "B. Chỉ cha mẹ anh K phải chịu trách nhiệm thay.", "C. Không phải chịu trách nhiệm gì vì chưa đủ 18 tuổi.", "D. Trách nhiệm hình sự, vì người từ đủ 16 tuổi trở lên phải chịu trách nhiệm hình sự về mọi tội phạm."], "answer": "D", "explain": "Điều 12 Bộ luật Hình sự 2015: người từ đủ 16 tuổi trở lên phải chịu trách nhiệm hình sự về mọi tội phạm. Anh K 17 tuổi gây tai nạn nghiêm trọng có thể bị truy cứu trách nhiệm hình sự về tội vi phạm quy định về tham gia giao thông đường bộ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Công ty X nhiều lần xả nước thải chưa qua xử lý ra sông gây ô nhiễm môi trường. Cơ quan chức năng đã lập biên bản và ra quyết định xử phạt công ty X. Trong trường hợp này, công ty X phải chịu trách nhiệm pháp lý nào?", "options": ["A. Trách nhiệm kỉ luật lao động.", "B. Không phải chịu trách nhiệm vì đã nộp thuế đầy đủ.", "C. Trách nhiệm hình sự về tội giết người.", "D. Trách nhiệm hành chính."], "answer": "D", "explain": "Việc bị lập biên bản và ra quyết định xử phạt thể hiện công ty X phải chịu trách nhiệm hành chính về hành vi vi phạm pháp luật bảo vệ môi trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau cơ bản giữa vi phạm hành chính và tội phạm là gì?", "options": ["A. Giới tính của người thực hiện hành vi vi phạm.", "B. Mức độ nguy hiểm cho xã hội của hành vi vi phạm.", "C. Độ tuổi của người thực hiện hành vi vi phạm.", "D. Nơi xảy ra hành vi vi phạm."], "answer": "B", "explain": "Theo chương trình GDPT 2018, tội phạm là hành vi nguy hiểm cho xã hội được quy định trong Bộ luật Hình sự, còn vi phạm hành chính có mức độ nguy hiểm cho xã hội thấp hơn. Mức độ nguy hiểm cho xã hội là căn cứ cơ bản để phân biệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Anh T 16 tuổi làm phục vụ quán cà phê, đã ký hợp đồng lao động bằng văn bản với chủ quán. Theo Bộ luật Lao động năm 2019, người từ đủ 15 tuổi đến chưa đủ 18 tuổi giao kết hợp đồng lao động như thế nào?", "options": ["A. Không được giao kết hợp đồng lao động dưới bất kỳ hình thức nào.", "B. Phải nhờ người khác ký thay trong mọi trường hợp.", "C. Chỉ được giao kết hợp đồng bằng lời nói.", "D. Có thể tự mình giao kết hợp đồng lao động bằng văn bản."], "answer": "D", "explain": "Điều 144 Bộ luật Lao động 2019: người từ đủ 15 tuổi đến chưa đủ 18 tuổi có thể tự mình giao kết hợp đồng lao động bằng văn bản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Anh T 16 tuổi làm phục vụ quán cà phê, đã ký hợp đồng lao động bằng văn bản với chủ quán. Chủ quán muốn phân công anh T làm thêm ca đêm và khuân vác hàng hóa nặng. Theo Bộ luật Lao động năm 2019, quy định nào sau đây là đúng?", "options": ["A. Được phân công ca đêm cho người chưa đủ 18 tuổi nếu họ đồng ý.", "B. Được sử dụng người chưa đủ 18 tuổi làm mọi công việc như người trưởng thành.", "C. Không được sử dụng người chưa đủ 18 tuổi làm công việc nặng nhọc, độc hại, nguy hiểm hoặc làm thêm giờ, làm việc vào ban đêm.", "D. Được bắt người chưa đủ 18 tuổi làm thêm giờ nếu trả lương cao hơn."], "answer": "C", "explain": "Điều 147 Bộ luật Lao động 2019: không được sử dụng người chưa đủ 18 tuổi làm công việc nặng nhọc, độc hại, nguy hiểm hoặc làm thêm giờ, làm việc vào ban đêm, trừ một số trường hợp đặc biệt do pháp luật quy định.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ông A nhận quyết định xử phạt vi phạm hành chính mà ông cho là không đúng. Theo Luật Khiếu nại năm 2011, thời hiệu khiếu nại quyết định hành chính là bao lâu kể từ ngày nhận được quyết định?", "options": ["A. 90 ngày.", "B. 30 ngày.", "C. 180 ngày.", "D. 60 ngày."], "answer": "A", "explain": "Điều 9 Luật Khiếu nại 2011: thời hiệu khiếu nại là 90 ngày, kể từ ngày nhận được quyết định hành chính hoặc biết được quyết định hành chính, hành vi hành chính.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Công ty A ký hợp đồng cung cấp 500 bộ bàn ghế cho công ty B đúng dịp khai giảng năm học mới. Công ty A giao hàng chậm 2 tháng khiến công ty B bị mất hợp đồng với các trường học và thiệt hại 200 triệu đồng. Theo quy định của pháp luật, công ty A phải chịu trách nhiệm pháp lý nào?", "options": ["A. Không phải chịu trách nhiệm vì chậm giao hàng là rủi ro kinh doanh.", "B. Trách nhiệm kỉ luật buộc thôi việc giám đốc công ty A.", "C. Trách nhiệm hình sự về tội lừa đảo chiếm đoạt tài sản.", "D. Trách nhiệm dân sự: bồi thường thiệt hại do vi phạm nghĩa vụ trong hợp đồng."], "answer": "D", "explain": "Theo Bộ luật Dân sự 2015, bên vi phạm nghĩa vụ trong hợp đồng gây thiệt hại thì phải bồi thường thiệt hại. Đây là trách nhiệm dân sự, không phải trách nhiệm hình sự vì không có dấu hiệu của tội phạm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bà H mua một hộp thuốc bổ tại hiệu thuốc gần nhà. Sau khi uống, bà bị dị ứng nặng phải nhập viện. Cơ quan chức năng xác định đây là thuốc giả, nhãn mác ghi sai sự thật. Theo Luật Bảo vệ quyền lợi người tiêu dùng năm 2023, quyền nào của bà H đã bị xâm phạm?", "options": ["A. Quyền được kinh doanh thuốc không cần giấy phép.", "B. Quyền được miễn phí khám chữa bệnh trong mọi trường hợp.", "C. Quyền được bồi thường gấp 10 lần giá trị hàng hóa trong mọi trường hợp.", "D. Quyền được bảo đảm an toàn và quyền được cung cấp thông tin chính xác về hàng hóa."], "answer": "D", "explain": "Luật Bảo vệ quyền lợi người tiêu dùng 2023 quy định người tiêu dùng có quyền được bảo đảm an toàn tính mạng, sức khỏe và quyền được cung cấp thông tin chính xác, đầy đủ về hàng hóa. Thuốc giả, nhãn mác sai sự thật xâm phạm các quyền này.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai hộ gia đình ông C và ông D tranh chấp ranh giới thửa đất liền kề đã nhiều tháng không hòa giải được. Hai bên muốn đưa vụ việc ra Tòa án để giải quyết. Theo Luật Đất đai năm 2024, trước khi Tòa án thụ lý, tranh chấp đất đai phải được thực hiện bước nào?", "options": ["A. Hòa giải tại Ủy ban nhân dân cấp tỉnh.", "B. Xin ý kiến của toàn thể người dân trong thôn.", "C. Đợi cơ quan công an điều tra xong mới được khởi kiện.", "D. Hòa giải tại Ủy ban nhân dân cấp xã nơi có đất tranh chấp."], "answer": "D", "explain": "Điều 235 Luật Đất đai 2024: tranh chấp đất đai đã được hòa giải tại Ủy ban nhân dân cấp xã nơi có đất tranh chấp mà không thành thì được giải quyết tại Tòa án. Hòa giải ở cấp xã là bước bắt buộc trước khi khởi kiện.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ông P là chủ một lò gạch. Ông thuê em Q 14 tuổi làm công việc nung gạch là công việc nặng nhọc, độc hại với thời gian 10 giờ mỗi ngày. Theo Bộ luật Lao động năm 2019, ông P đã vi phạm quy định nào?", "options": ["A. Chỉ vi phạm khi không ký hợp đồng lao động với người lao động.", "B. Được sử dụng người chưa đủ 15 tuổi làm mọi công việc nếu trả lương cao.", "C. Nghiêm cấm sử dụng người chưa đủ 15 tuổi làm công việc nặng nhọc, độc hại, nguy hiểm, trừ một số nghề, công việc được pháp luật cho phép.", "D. Không vi phạm vì em Q tự nguyện đi làm."], "answer": "C", "explain": "Điều 145 Bộ luật Lao động 2019 nghiêm cấm sử dụng người chưa đủ 15 tuổi làm công việc nặng nhọc, độc hại, nguy hiểm, trừ một số nghề, công việc được pháp luật cho phép. Nung gạch không thuộc trường hợp được phép nên ông P đã vi phạm.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Anh S mở quán phở tại thị trấn và đã đăng ký hộ kinh doanh. Quán có anh S và 2 người phụ việc. Hằng tháng, anh S kê khai và nộp thuế đầy đủ. Xét tính đúng, sai của các nhận định:", "statements": ["a) Anh S đăng ký hộ kinh doanh là thực hiện đúng quy định của pháp luật về đăng ký kinh doanh.", "b) Hộ kinh doanh của anh S có tư cách pháp nhân như công ty cổ phần.", "c) Việc anh S kê khai và nộp thuế hằng tháng là thực hiện nghĩa vụ đối với Nhà nước.", "d) Hộ kinh doanh được sử dụng từ 10 lao động trở lên mà không cần chuyển đổi loại hình."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: kinh doanh phải đăng ký theo quy định. b) Sai: hộ kinh doanh không có tư cách pháp nhân. c) Đúng: nộp thuế là nghĩa vụ với Nhà nước. d) Sai: hộ kinh doanh sử dụng dưới 10 lao động; từ 10 lao động trở lên phải đăng ký thành lập doanh nghiệp (Nghị định 01/2021/NĐ-CP).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Ông A nhận được quyết định xử phạt vi phạm hành chính về trật tự đô thị mà ông cho rằng mình không vi phạm. Ông A muốn khiếu nại quyết định này. Xét tính đúng, sai của các nhận định:", "statements": ["a) Ông A có quyền khiếu nại quyết định xử phạt vi phạm hành chính.", "b) Thời hiệu khiếu nại quyết định hành chính là 90 ngày kể từ ngày nhận được quyết định.", "c) Ông A có thể khiếu nại bằng đơn hoặc trình bày trực tiếp với cơ quan có thẩm quyền.", "d) Trong thời gian khiếu nại, quyết định xử phạt đương nhiên bị đình chỉ thi hành."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Điều 2 Luật Khiếu nại 2011, công dân có quyền khiếu nại quyết định hành chính. b) Đúng: thời hiệu khiếu nại là 90 ngày (Điều 9). c) Đúng: khiếu nại bằng đơn hoặc trình bày trực tiếp (Điều 8). d) Sai: việc khiếu nại không đình chỉ việc thi hành quyết định hành chính bị khiếu nại (Điều 12).", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Tình huống: T 17 tuổi điều khiển xe máy không có giấy phép lái xe, vượt đèn đỏ và gây tai nạn làm một người đi đường tử vong. Xét tính đúng, sai của các nhận định:", "statements": ["a) T phải chịu trách nhiệm hình sự vì người từ đủ 16 tuổi trở lên phải chịu trách nhiệm hình sự về mọi tội phạm.", "b) Hành vi của T chỉ bị xử phạt vi phạm hành chính vì T chưa đủ 18 tuổi.", "c) Cha mẹ của T phải bồi thường thiệt hại về dân sự cho gia đình nạn nhân.", "d) T không thể bị áp dụng hình phạt tù vì chưa đủ 18 tuổi."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: Điều 12 Bộ luật Hình sự 2015, từ đủ 16 tuổi chịu trách nhiệm hình sự về mọi tội phạm. b) Sai: gây hậu quả chết người có dấu hiệu tội phạm nên bị truy cứu trách nhiệm hình sự. c) Đúng: người chưa thành niên gây thiệt hại thì cha mẹ phải bồi thường (Bộ luật Dân sự 2015). d) Sai: người từ đủ 16 đến dưới 18 tuổi phạm tội vẫn có thể bị phạt tù có thời hạn với mức nhẹ hơn, chỉ không áp dụng tù chung thân và tử hình.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Tình huống: M 17 tuổi được bố mẹ cho một chiếc xe máy để đi học. M tự ý bán chiếc xe máy cho anh K để lấy tiền chơi điện tử mà không hỏi ý kiến bố mẹ. Anh K không biết M chưa đủ 18 tuổi. Xét tính đúng, sai của các nhận định:", "statements": ["a) Giao dịch mua bán xe máy của M có hiệu lực vì M đã đủ 16 tuổi.", "b) Bố mẹ của M có quyền yêu cầu Tòa án tuyên bố giao dịch mua bán xe máy vô hiệu.", "c) Anh K là người mua ngay tình nên đương nhiên được giữ lại chiếc xe máy.", "d) Nếu giao dịch bị tuyên vô hiệu, các bên phải hoàn trả cho nhau những gì đã nhận."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: xe máy là động sản phải đăng ký, người từ đủ 15 đến chưa đủ 18 tuổi chỉ được tự mình xác lập giao dịch liên quan đến động sản phải đăng ký khi được người đại diện theo pháp luật đồng ý (Điều 21 Bộ luật Dân sự 2015). b) Đúng: người đại diện theo pháp luật có quyền yêu cầu Tòa án tuyên giao dịch vô hiệu. c) Sai: giao dịch vô hiệu thì không làm phát sinh quyền sở hữu cho bên mua. d) Đúng: hậu quả của giao dịch dân sự vô hiệu là các bên hoàn trả cho nhau những gì đã nhận (Điều 131 Bộ luật Dân sự 2015).", "points": 1}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Thị trường là gì?", "options": ["A. Là kho chứa hàng hóa của các doanh nghiệp.", "B. Là nơi chỉ để trưng bày hàng hóa mà không mua bán.", "C. Là nơi Nhà nước phân phối hàng hóa miễn phí cho người dân.", "D. Là nơi gặp gỡ giữa người mua và người bán, nơi diễn ra các hoạt động mua bán hàng hóa, dịch vụ."], "answer": "D", "explain": "Theo chương trình GDPT 2018, thị trường là nơi gặp gỡ giữa người mua và người bán, nơi diễn ra các hoạt động mua bán hàng hóa, dịch vụ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cạnh tranh trong kinh tế là gì?", "options": ["A. Sự can thiệp trực tiếp của Nhà nước vào giá cả.", "B. Sự ganh đua giữa các chủ thể kinh tế nhằm giành lợi thế trong sản xuất và tiêu thụ hàng hóa, dịch vụ.", "C. Sự hợp tác giúp đỡ lẫn nhau giữa các doanh nghiệp.", "D. Sự độc quyền của một doanh nghiệp trên thị trường."], "answer": "B", "explain": "Theo chương trình GDPT 2018, cạnh tranh là sự ganh đua giữa các chủ thể kinh tế nhằm giành lợi thế trong sản xuất và tiêu thụ hàng hóa, dịch vụ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, công dân có quyền tự do ngôn luận, tự do báo chí, tiếp cận thông tin, hội họp, lập hội, biểu tình. Việc thực hiện các quyền này do đối tượng nào quy định?", "options": ["A. Do mỗi cá nhân tự quy định.", "B. Không ai được quy định.", "C. Do pháp luật quy định.", "D. Do tổ chức xã hội quy định."], "answer": "C", "explain": "Điều 25 Hiến pháp 2013: công dân có quyền tự do ngôn luận, tự do báo chí, tiếp cận thông tin, hội họp, lập hội, biểu tình; việc thực hiện các quyền này do pháp luật quy định.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật An ninh mạng năm 2018, hành vi nào sau đây bị nghiêm cấm trên không gian mạng?", "options": ["A. Học tập trực tuyến và chia sẻ tài liệu học tập.", "B. Đăng tải thông tin xuyên tạc, vu khống, xúc phạm uy tín của tổ chức, danh dự của cá nhân.", "C. Đăng tải thông tin về các hoạt động văn hóa, thể thao lành mạnh.", "D. Trao đổi, mua bán hàng hóa hợp pháp trên các sàn thương mại điện tử."], "answer": "B", "explain": "Luật An ninh mạng 2018 nghiêm cấm hành vi đăng tải, phát tán thông tin xuyên tạc, vu khống, xúc phạm uy tín của tổ chức, danh dự, nhân phẩm của cá nhân trên không gian mạng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Sở hữu trí tuệ, nhãn hiệu là gì?", "options": ["A. Hình ảnh trang trí bao bì không có giá trị pháp lý.", "B. Dấu hiệu dùng để phân biệt hàng hóa, dịch vụ của các tổ chức, cá nhân khác nhau.", "C. Tên gọi chung của mọi loại hàng hóa trên thị trường.", "D. Địa chỉ sản xuất của doanh nghiệp."], "answer": "B", "explain": "Theo Luật Sở hữu trí tuệ, nhãn hiệu là dấu hiệu dùng để phân biệt hàng hóa, dịch vụ của các tổ chức, cá nhân khác nhau.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Bộ luật Lao động năm 2019, lao động chưa thành niên là người lao động như thế nào?", "options": ["A. Là người lao động chưa đủ 15 tuổi.", "B. Là người lao động chưa đủ 20 tuổi.", "C. Là người lao động chưa đủ 18 tuổi.", "D. Là người lao động chưa đủ 16 tuổi."], "answer": "C", "explain": "Điều 143 Bộ luật Lao động 2019: lao động chưa thành niên là người lao động chưa đủ 18 tuổi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Nghĩa vụ quân sự năm 2015, độ tuổi gọi công dân nhập ngũ là bao nhiêu?", "options": ["A. Từ đủ 18 tuổi đến hết 30 tuổi.", "B. Từ đủ 16 tuổi đến hết 25 tuổi.", "C. Từ đủ 18 tuổi đến hết 25 tuổi.", "D. Từ đủ 20 tuổi đến hết 27 tuổi."], "answer": "C", "explain": "Điều 30 Luật Nghĩa vụ quân sự 2015: công dân đủ 18 tuổi được gọi nhập ngũ; độ tuổi gọi nhập ngũ từ đủ 18 tuổi đến hết 25 tuổi; công dân được đào tạo trình độ cao đẳng, đại học đã được tạm hoãn gọi nhập ngũ thì độ tuổi gọi nhập ngũ đến hết 27 tuổi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vi phạm pháp luật là hành vi như thế nào?", "options": ["A. Là mọi hành vi gây thiệt hại cho người khác dù không trái pháp luật.", "B. Là hành vi vi phạm các chuẩn mực đạo đức xã hội.", "C. Là hành vi không phù hợp với phong tục tập quán địa phương.", "D. Là hành vi trái pháp luật, có lỗi do người có năng lực trách nhiệm pháp lý thực hiện, xâm hại các quan hệ xã hội được pháp luật bảo vệ."], "answer": "D", "explain": "Theo chương trình GDPT 2018, vi phạm pháp luật là hành vi trái pháp luật, có lỗi do người có năng lực trách nhiệm pháp lý thực hiện, xâm hại các quan hệ xã hội được pháp luật bảo vệ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trách nhiệm pháp lý là gì?", "options": ["A. Là nghĩa vụ mà các cá nhân, tổ chức phải gánh chịu hậu quả bất lợi từ hành vi vi phạm pháp luật của mình.", "B. Là nghĩa vụ đóng thuế của công dân.", "C. Là nghĩa vụ tham gia các hoạt động từ thiện.", "D. Là trách nhiệm chăm sóc gia đình của mỗi người."], "answer": "A", "explain": "Theo chương trình GDPT 2018, trách nhiệm pháp lý là nghĩa vụ mà các cá nhân, tổ chức phải gánh chịu hậu quả bất lợi từ hành vi vi phạm pháp luật của mình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, mọi người có quyền sống. Tính mạng con người được pháp luật bảo hộ như thế nào?", "options": ["A. Chỉ người giàu mới được pháp luật bảo hộ tính mạng.", "B. Ai cũng có thể tước đoạt tính mạng người khác khi mâu thuẫn.", "C. Không ai bị tước đoạt tính mạng trái luật.", "D. Pháp luật không bảo hộ tính mạng con người."], "answer": "C", "explain": "Điều 19 Hiến pháp 2013: mọi người có quyền sống; tính mạng con người được pháp luật bảo hộ; không ai bị tước đoạt tính mạng trái luật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Cạnh tranh năm 2018, hành vi nào sau đây là hành vi cạnh tranh không lành mạnh?", "options": ["A. Cải tiến chất lượng sản phẩm để thu hút khách hàng.", "B. Giảm giá bán trong chương trình khuyến mãi hợp pháp.", "C. Mở rộng hệ thống phân phối để phục vụ khách hàng tốt hơn.", "D. Đưa thông tin gian dối gây ảnh hưởng xấu đến uy tín của doanh nghiệp khác."], "answer": "D", "explain": "Điều 45 Luật Cạnh tranh 2018: hành vi đưa thông tin gian dối hoặc gây nhầm lẫn cho khách hàng về doanh nghiệp khác là hành vi cạnh tranh không lành mạnh bị cấm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đạo đức kinh doanh là gì?", "options": ["A. Là các quy định bắt buộc của Nhà nước về thuế.", "B. Là tập hợp các nguyên tắc, chuẩn mực đạo đức được các chủ thể kinh doanh tự nguyện tuân thủ trong hoạt động kinh doanh.", "C. Là hợp đồng mua bán giữa các doanh nghiệp.", "D. Là nội quy lao động của doanh nghiệp."], "answer": "B", "explain": "Theo chương trình GDPT 2018, đạo đức kinh doanh là tập hợp các nguyên tắc, chuẩn mực đạo đức được các chủ thể kinh doanh tự nguyện tuân thủ trong hoạt động kinh doanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Công ty B tung tin sai sự thật trên mạng rằng nước mắm của đối thủ cạnh tranh là công ty A chứa chất gây ung thư, khiến doanh số của công ty A sụt giảm nghiêm trọng. Hành vi của công ty B thuộc loại nào?", "options": ["A. Hành vi cạnh tranh không lành mạnh: đưa thông tin gian dối gây ảnh hưởng xấu đến uy tín của doanh nghiệp khác.", "B. Hoạt động quảng cáo hợp pháp của doanh nghiệp.", "C. Hoạt động bảo vệ quyền lợi người tiêu dùng.", "D. Hành vi cạnh tranh lành mạnh bằng chất lượng sản phẩm."], "answer": "A", "explain": "Điều 45 Luật Cạnh tranh 2018 cấm hành vi đưa thông tin gian dối hoặc gây nhầm lẫn cho khách hàng về doanh nghiệp khác, gây ảnh hưởng xấu đến uy tín của doanh nghiệp đó. Đây là hành vi cạnh tranh không lành mạnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Công ty B tung tin sai sự thật trên mạng rằng nước mắm của đối thủ cạnh tranh là công ty A chứa chất gây ung thư, khiến doanh số của công ty A sụt giảm nghiêm trọng. Để bảo vệ quyền lợi của mình, công ty A có thể làm gì?", "options": ["A. Yêu cầu công ty B chấm dứt hành vi vi phạm, công khai xin lỗi, cải chính và bồi thường thiệt hại.", "B. Thuê người tung tin xấu về công ty B để trả đũa.", "C. Im lặng chịu đựng vì pháp luật không bảo vệ doanh nghiệp.", "D. Tự ý tăng giá bán để bù đắp thiệt hại."], "answer": "A", "explain": "Theo Luật Cạnh tranh 2018, doanh nghiệp bị xâm phạm có quyền yêu cầu bên vi phạm chấm dứt hành vi, xin lỗi, cải chính công khai và bồi thường thiệt hại theo quy định của pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "N dùng tài khoản mạng xã hội đăng video bịa đặt, vu khống thầy giáo của mình nhận tiền của học sinh để nâng điểm, khiến nhiều người hiểu lầm và xúc phạm thầy giáo. Hành vi của N vi phạm quy định nào?", "options": ["A. Chỉ vi phạm nội quy của nhà trường, không vi phạm pháp luật.", "B. Chỉ vi phạm khi thầy giáo làm đơn kiện ra Tòa án.", "C. Không vi phạm vì mạng xã hội là nơi tự do ngôn luận tuyệt đối.", "D. Vi phạm pháp luật về an ninh mạng: nghiêm cấm đưa thông tin vu khống, xúc phạm danh dự, nhân phẩm của người khác trên không gian mạng."], "answer": "D", "explain": "Luật An ninh mạng 2018 nghiêm cấm hành vi đưa thông tin vu khống, xúc phạm uy tín của tổ chức, danh dự, nhân phẩm của cá nhân trên không gian mạng. Người vi phạm có thể bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Doanh nghiệp X đã đăng ký bảo hộ nhãn hiệu cho sản phẩm của mình. Doanh nghiệp Y sản xuất sản phẩm cùng loại và sử dụng nhãn hiệu gần giống đến mức gây nhầm lẫn cho người tiêu dùng. Hành vi của doanh nghiệp Y xâm phạm quyền nào?", "options": ["A. Quyền sở hữu công nghiệp đối với nhãn hiệu đã được bảo hộ.", "B. Quyền tự do kinh doanh của doanh nghiệp Y.", "C. Quyền tác giả đối với tác phẩm văn học.", "D. Không xâm phạm quyền nào vì nhãn hiệu không hoàn toàn giống nhau."], "answer": "A", "explain": "Theo Luật Sở hữu trí tuệ, chủ sở hữu nhãn hiệu đã được bảo hộ có quyền ngăn cấm người khác sử dụng dấu hiệu trùng hoặc tương tự đến mức gây nhầm lẫn với nhãn hiệu của mình cho hàng hóa, dịch vụ trùng hoặc tương tự.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Con trai ông H 19 tuổi, đã tốt nghiệp trung học phổ thông, đang làm việc tại địa phương và nhận được lệnh gọi nhập ngũ. Theo Luật Nghĩa vụ quân sự năm 2015, con trai ông H có thuộc đối tượng gọi nhập ngũ không?", "options": ["A. Có, nhưng chỉ gọi khi có chiến tranh.", "B. Có, vì độ tuổi gọi nhập ngũ là từ đủ 18 tuổi đến hết 25 tuổi.", "C. Không, vì đã tốt nghiệp trung học phổ thông.", "D. Không, vì phải đủ 21 tuổi mới gọi nhập ngũ."], "answer": "B", "explain": "Điều 30 Luật Nghĩa vụ quân sự 2015: độ tuổi gọi nhập ngũ từ đủ 18 tuổi đến hết 25 tuổi. Con trai ông H 19 tuổi, đủ điều kiện về độ tuổi gọi nhập ngũ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Gia đình ông H có con trai 19 tuổi, đã tốt nghiệp trung học phổ thông và đang làm việc tại địa phương. Đầu năm, con trai ông H nhận được lệnh gọi nhập ngũ nhưng đã bỏ trốn khỏi địa phương để trốn tránh. Hành vi trốn tránh nghĩa vụ quân sự bị xử lý như thế nào?", "options": ["A. Bị tước quyền công dân vĩnh viễn.", "B. Không bị xử lý vì nghĩa vụ quân sự là tự nguyện.", "C. Chỉ bị nhắc nhở vì còn trẻ.", "D. Bị xử phạt vi phạm hành chính; nếu đã bị xử phạt mà còn tái phạm thì có thể bị truy cứu trách nhiệm hình sự về tội trốn tránh nghĩa vụ quân sự."], "answer": "D", "explain": "Hành vi trốn tránh nghĩa vụ quân sự bị xử phạt vi phạm hành chính theo Nghị định 37/2022/NĐ-CP; trường hợp đã bị xử phạt vi phạm hành chính mà còn vi phạm thì bị truy cứu trách nhiệm hình sự về tội trốn tránh nghĩa vụ quân sự (Điều 332 Bộ luật Hình sự 2015).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cửa hàng của bà L bày bán nhiều mặt hàng nhưng không niêm yết giá. Khi khách hỏi, bà L báo giá mỗi lúc một khác, có lúc cao gấp đôi giá thị trường. Hành vi của bà L vi phạm quy định nào?", "options": ["A. Chỉ vi phạm khi khách hàng khiếu nại.", "B. Chỉ vi phạm đạo đức kinh doanh, không vi phạm pháp luật.", "C. Không vi phạm vì người bán có quyền tự định giá.", "D. Vi phạm quy định về niêm yết giá và bán đúng giá niêm yết trong hoạt động kinh doanh."], "answer": "D", "explain": "Pháp luật về giá và bảo vệ quyền lợi người tiêu dùng quy định tổ chức, cá nhân kinh doanh phải niêm yết giá và bán đúng giá niêm yết. Không niêm yết giá, báo giá tùy tiện là hành vi vi phạm và bị xử phạt vi phạm hành chính.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Do ảnh hưởng của dịch bệnh trên đàn lợn, nguồn cung thịt lợn giảm mạnh trong khi nhu cầu của người dân vẫn cao khiến giá thịt lợn tăng vọt. Hiện tượng này phản ánh nội dung nào của quan hệ cung cầu?", "options": ["A. Giá cả không chịu ảnh hưởng của quan hệ cung cầu.", "B. Khi cung giảm, cầu không đổi thì giá cả có xu hướng tăng.", "C. Nhu cầu của người dân quyết định hoàn toàn nguồn cung.", "D. Khi cung giảm thì giá cả luôn giảm."], "answer": "B", "explain": "Theo quy luật cung cầu: khi lượng cung giảm trong khi lượng cầu không đổi hoặc tăng thì giá cả hàng hóa có xu hướng tăng lên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ba doanh nghiệp sản xuất thép lớn nhất trong khu vực đã bí mật thỏa thuận với nhau ấn định giá bán thép ở mức cao và phân chia thị trường tiêu thụ, khiến các doanh nghiệp nhỏ không thể cạnh tranh. Hành vi này vi phạm quy định nào của Luật Cạnh tranh năm 2018?", "options": ["A. Chỉ vi phạm đạo đức kinh doanh.", "B. Được phép vì giúp ổn định giá cả thị trường.", "C. Thỏa thuận hạn chế cạnh tranh: thỏa thuận ấn định giá, phân chia thị trường bị cấm.", "D. Không vi phạm vì đây là thỏa thuận tự nguyện giữa các doanh nghiệp."], "answer": "C", "explain": "Điều 11 Luật Cạnh tranh 2018 cấm các thỏa thuận hạn chế cạnh tranh, trong đó có thỏa thuận ấn định giá hàng hóa, dịch vụ một cách trực tiếp hoặc gián tiếp và thỏa thuận phân chia thị trường tiêu thụ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "K mua một phần mềm kế toán có bản quyền rồi sao chép, bẻ khóa và bán lại cho nhiều người với giá rẻ, thu lợi hàng trăm triệu đồng. Hành vi của K xâm phạm quyền nào và có thể bị xử lý như thế nào?", "options": ["A. Xâm phạm quyền tác giả; có thể bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự về tội xâm phạm quyền tác giả, quyền liên quan.", "B. Chỉ vi phạm hợp đồng mua bán với nhà sản xuất.", "C. Không vi phạm vì phần mềm đã được mua hợp pháp.", "D. Chỉ bị nhắc nhở vì chưa gây hậu quả nghiêm trọng."], "answer": "A", "explain": "Phần mềm máy tính là đối tượng được bảo hộ quyền tác giả. Hành vi sao chép, phân phối trái phép nhằm thu lợi bất chính xâm phạm quyền tác giả, bị xử phạt vi phạm hành chính và có thể bị truy cứu trách nhiệm hình sự theo Điều 225 Bộ luật Hình sự 2015 khi đủ dấu hiệu tội phạm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Người dân phát hiện một cán bộ xã nhận tiền của người dân để làm nhanh thủ tục cấp giấy chứng nhận quyền sử dụng đất. Người dân muốn phản ánh hành vi này đến cơ quan có thẩm quyền. Đây là việc thực hiện quyền nào của công dân?", "options": ["A. Quyền tự do kinh doanh.", "B. Quyền tố cáo: mọi cá nhân có quyền tố cáo hành vi vi phạm pháp luật của cán bộ, công chức đến cơ quan có thẩm quyền.", "C. Quyền bầu cử đại biểu Hội đồng nhân dân.", "D. Quyền khiếu nại quyết định hành chính."], "answer": "B", "explain": "Luật Tố cáo 2018: tố cáo là việc cá nhân báo cho cơ quan, tổ chức, cá nhân có thẩm quyền biết về hành vi vi phạm pháp luật của cán bộ, công chức trong việc thực hiện nhiệm vụ, công vụ. Mọi cá nhân đều có quyền tố cáo.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Doanh nghiệp X trong quá trình hoạt động đã: khai sai thuế để trốn thuế với số tiền lớn; xả chất thải nguy hại ra môi trường; sử dụng lao động 13 tuổi làm việc nặng nhọc. Nhận định nào sau đây là đúng về trách nhiệm pháp lý của doanh nghiệp X?", "options": ["A. Doanh nghiệp đã nộp thuế thì không phải chịu trách nhiệm về môi trường.", "B. Doanh nghiệp X chỉ phải chịu một loại trách nhiệm pháp lý duy nhất.", "C. Sử dụng lao động trẻ em chỉ vi phạm đạo đức, không vi phạm pháp luật.", "D. Doanh nghiệp X và người có thẩm quyền có thể đồng thời phải chịu nhiều loại trách nhiệm pháp lý khác nhau: hành chính, hình sự và dân sự tùy từng hành vi."], "answer": "D", "explain": "Mỗi hành vi vi phạm pháp luật làm phát sinh trách nhiệm pháp lý tương ứng: trốn thuế có dấu hiệu tội phạm thì bị truy cứu trách nhiệm hình sự (Điều 200 Bộ luật Hình sự 2015); xả thải gây ô nhiễm bị xử phạt vi phạm hành chính về môi trường; sử dụng lao động chưa đủ 15 tuổi làm việc nặng nhọc bị xử phạt vi phạm hành chính về lao động. Một chủ thể có thể đồng thời chịu nhiều loại trách nhiệm pháp lý.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Quán cà phê A và quán cà phê B cạnh tranh nhau trên cùng một tuyến phố. Chủ quán A thuê người tung tin trên mạng rằng quán B dùng nguyên liệu bẩn, không đảm bảo vệ sinh, dù không có căn cứ khiến khách hàng tẩy chay quán B. Xét tính đúng, sai của các nhận định:", "statements": ["a) Hành vi của chủ quán A là hành vi cạnh tranh không lành mạnh.", "b) Chủ quán B có quyền yêu cầu chủ quán A chấm dứt hành vi, công khai xin lỗi và cải chính.", "c) Chủ quán B chỉ có thể im lặng chịu đựng vì đây là chuyện cạnh tranh bình thường.", "d) Nếu gây thiệt hại, chủ quán A phải bồi thường thiệt hại cho chủ quán B."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đưa thông tin gian dối gây ảnh hưởng xấu đến uy tín doanh nghiệp khác là cạnh tranh không lành mạnh (Điều 45 Luật Cạnh tranh 2018). b) Đúng: doanh nghiệp bị xâm phạm có quyền yêu cầu chấm dứt, xin lỗi, cải chính. c) Sai: pháp luật bảo vệ doanh nghiệp bị cạnh tranh không lành mạnh. d) Đúng: bên vi phạm gây thiệt hại phải bồi thường theo quy định của pháp luật.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Tình huống: H dùng tài khoản mạng xã hội đăng tin bịa đặt về một vụ dịch bệnh nguy hiểm đang bùng phát tại địa phương gây hoang mang dư luận, trong khi thực tế không có dịch bệnh nào. Xét tính đúng, sai của các nhận định:", "statements": ["a) Hành vi đăng tin bịa đặt của H vi phạm pháp luật về an ninh mạng.", "b) H có thể bị xử phạt vi phạm hành chính về hành vi cung cấp thông tin sai sự thật trên mạng xã hội.", "c) Mạng xã hội là không gian tự do tuyệt đối nên không ai bị xử lý khi đăng tin sai sự thật.", "d) Nếu hành vi gây hậu quả nghiêm trọng, H có thể bị truy cứu trách nhiệm hình sự."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Luật An ninh mạng 2018 nghiêm cấm đưa thông tin sai sự thật gây hoang mang dư luận. b) Đúng: hành vi bị xử phạt vi phạm hành chính theo Nghị định 15/2020/NĐ-CP. c) Sai: tự do ngôn luận trên mạng vẫn phải trong khuôn khổ pháp luật. d) Đúng: gây hậu quả nghiêm trọng có thể bị truy cứu trách nhiệm hình sự (Điều 288 Bộ luật Hình sự 2015).", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Tình huống: N 20 tuổi, đã tốt nghiệp trung học phổ thông, không học tiếp lên cao đẳng, đại học. Đầu năm, N nhận được lệnh gọi nhập ngũ nhưng đã bỏ trốn khỏi địa phương để trốn tránh. Xét tính đúng, sai của các nhận định:", "statements": ["a) N thuộc đối tượng gọi nhập ngũ vì đang trong độ tuổi từ đủ 18 tuổi đến hết 25 tuổi.", "b) Hành vi bỏ trốn của N chỉ bị nhắc nhở vì N còn trẻ.", "c) Nếu đã bị xử phạt vi phạm hành chính mà còn tái phạm, N có thể bị truy cứu trách nhiệm hình sự về tội trốn tránh nghĩa vụ quân sự.", "d) Công dân nữ trong mọi trường hợp đều không phải thực hiện nghĩa vụ quân sự."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: Điều 30 Luật Nghĩa vụ quân sự 2015, độ tuổi gọi nhập ngũ từ đủ 18 đến hết 25 tuổi. b) Sai: hành vi trốn tránh nghĩa vụ quân sự bị xử phạt vi phạm hành chính (Nghị định 37/2022/NĐ-CP). c) Đúng: Điều 332 Bộ luật Hình sự 2015 quy định tội trốn tránh nghĩa vụ quân sự. d) Sai: công dân nữ trong độ tuổi thực hiện nghĩa vụ quân sự, có ngành nghề chuyên môn phù hợp với yêu cầu của Quân đội vẫn được gọi nhập ngũ (Điều 6 Luật Nghĩa vụ quân sự 2015).", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Tình huống: P viết bài phê bình gay gắt chính sách thu hồi đất của Ủy ban nhân dân xã đăng trên blog cá nhân. Bài viết không bịa đặt sự việc nhưng dùng nhiều lời lẽ thiếu văn hóa, xúc phạm cá nhân ông chủ tịch xã. Chính quyền xã yêu cầu P gỡ bài. Xét tính đúng, sai của các nhận định:", "statements": ["a) Công dân có quyền tự do ngôn luận, tự do báo chí theo quy định của Hiến pháp.", "b) Mọi bài viết phê bình chính quyền đều là hành vi vi phạm pháp luật.", "c) Việc thực hiện quyền tự do ngôn luận phải trong khuôn khổ pháp luật, không được vu khống, xúc phạm danh dự, nhân phẩm của người khác.", "d) Nếu bài viết có nội dung bịa đặt, vu khống thì P phải chịu trách nhiệm pháp lý."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: Điều 25 Hiến pháp 2013 ghi nhận quyền tự do ngôn luận, tự do báo chí. b) Sai: phê bình đúng sự thật, có căn cứ là quyền của công dân, không phải vi phạm. c) Đúng: việc thực hiện các quyền tự do phải do pháp luật quy định và không được xâm phạm quyền, lợi ích hợp pháp của người khác. d) Đúng: bịa đặt, vu khống thì bị xử lý theo quy định của pháp luật.", "points": 1}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Theo Luật Các tổ chức tín dụng năm 2024, hoạt động ngân hàng bao gồm các nghiệp vụ nào?", "options": ["A. Nhận tiền gửi, cấp tín dụng và cung ứng dịch vụ thanh toán qua tài khoản.", "B. Chỉ cho vay tiền với lãi suất cao.", "C. Sản xuất hàng hóa để bán trên thị trường.", "D. Kinh doanh bất động sản và chứng khoán."], "answer": "A", "explain": "Theo Luật Các tổ chức tín dụng 2024, hoạt động ngân hàng là việc kinh doanh, cung ứng thường xuyên một hoặc một số nghiệp vụ: nhận tiền gửi, cấp tín dụng, cung ứng dịch vụ thanh toán qua tài khoản.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lãi suất trong quan hệ tín dụng được hiểu là gì?", "options": ["A. Là khoản tiền phạt khi vay vốn ngân hàng.", "B. Là thuế mà Nhà nước thu trên các khoản vay.", "C. Là giá cả của việc sử dụng vốn vay mà bên vay phải trả cho bên cho vay.", "D. Là phí dịch vụ mở tài khoản ngân hàng."], "answer": "C", "explain": "Theo chương trình GDPT 2018, lãi suất là giá cả của việc sử dụng vốn vay, là khoản tiền bên vay phải trả cho bên cho vay khi sử dụng vốn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thuế thu nhập cá nhân là loại thuế đánh vào đối tượng nào?", "options": ["A. Doanh thu của doanh nghiệp.", "B. Mọi tài sản mà cá nhân đang sở hữu.", "C. Thu nhập của cá nhân theo quy định của pháp luật.", "D. Giá trị hàng hóa nhập khẩu."], "answer": "C", "explain": "Theo Luật Thuế thu nhập cá nhân 2007, thuế thu nhập cá nhân là thuế đánh vào thu nhập của cá nhân bao gồm thu nhập từ tiền lương, tiền công, từ kinh doanh và các khoản thu nhập khác theo quy định.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thuế giá trị gia tăng là loại thuế đánh vào đối tượng nào?", "options": ["A. Giá trị tăng thêm của hàng hóa, dịch vụ phát sinh trong quá trình sản xuất, lưu thông đến tiêu dùng.", "B. Thu nhập từ tiền lương của người lao động.", "C. Tổng giá trị tài sản của doanh nghiệp.", "D. Lợi nhuận sau thuế của công ty."], "answer": "A", "explain": "Theo Luật Thuế giá trị gia tăng, thuế giá trị gia tăng là thuế đánh vào giá trị tăng thêm của hàng hóa, dịch vụ phát sinh trong quá trình từ sản xuất, lưu thông đến tiêu dùng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thuế tiêu thụ đặc biệt đánh vào hàng hóa, dịch vụ nào?", "options": ["A. Thuốc chữa bệnh và lương thực, thực phẩm.", "B. Sách giáo khoa và đồ dùng học tập.", "C. Một số hàng hóa, dịch vụ đặc biệt như thuốc lá, rượu bia, ô tô dưới 24 chỗ, dịch vụ karaoke, vũ trường.", "D. Mọi hàng hóa thiết yếu phục vụ đời sống người dân."], "answer": "C", "explain": "Theo Luật Thuế tiêu thụ đặc biệt, thuế này đánh vào một số hàng hóa, dịch vụ mang tính đặc biệt như thuốc lá, rượu bia, ô tô, dịch vụ kinh doanh karaoke, vũ trường nhằm điều tiết tiêu dùng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bảo hiểm y tế là hình thức bảo hiểm như thế nào?", "options": ["A. Là hình thức bảo hiểm tự nguyện vì mục đích lợi nhuận của doanh nghiệp.", "B. Là khoản tiền người dân đóng góp từ thiện cho bệnh viện.", "C. Là thuế mà người dân phải nộp khi khám chữa bệnh.", "D. Là hình thức bảo hiểm bắt buộc được áp dụng đối với các đối tượng theo quy định để chăm sóc sức khỏe, không vì mục đích lợi nhuận."], "answer": "D", "explain": "Theo Luật Bảo hiểm y tế, bảo hiểm y tế là hình thức bảo hiểm bắt buộc được áp dụng đối với các đối tượng theo quy định của Luật để chăm sóc sức khỏe, không vì mục đích lợi nhuận.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người có năng lực trách nhiệm pháp lý là người như thế nào?", "options": ["A. Là người có trình độ học vấn đại học trở lên.", "B. Là người giữ chức vụ trong cơ quan nhà nước.", "C. Là mọi công dân không phân biệt độ tuổi.", "D. Là người đạt một độ tuổi nhất định, có khả năng nhận thức và điều khiển được hành vi của mình."], "answer": "D", "explain": "Theo chương trình GDPT 2018, người có năng lực trách nhiệm pháp lý là người đạt một độ tuổi nhất định theo quy định của pháp luật, có khả năng nhận thức và điều khiển được hành vi của mình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vi phạm hình sự (tội phạm) là hành vi như thế nào?", "options": ["A. Là hành vi vi phạm các chuẩn mực đạo đức.", "B. Là hành vi nguy hiểm cho xã hội được quy định trong Bộ luật Hình sự.", "C. Là hành vi vi phạm hợp đồng dân sự.", "D. Là mọi hành vi vi phạm nội quy của cơ quan, tổ chức."], "answer": "B", "explain": "Theo chương trình GDPT 2018, vi phạm hình sự là hành vi nguy hiểm cho xã hội, có lỗi, được quy định trong Bộ luật Hình sự.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vi phạm hành chính là hành vi như thế nào?", "options": ["A. Là hành vi vi phạm nghĩa vụ trong hợp đồng mua bán.", "B. Là hành vi đi làm muộn, vi phạm nội quy công ty.", "C. Là hành vi nguy hiểm cho xã hội được quy định trong Bộ luật Hình sự.", "D. Là hành vi có lỗi vi phạm quy định của pháp luật về quản lý nhà nước mà không phải là tội phạm."], "answer": "D", "explain": "Theo Luật Xử lý vi phạm hành chính 2012, vi phạm hành chính là hành vi có lỗi do cá nhân, tổ chức thực hiện, vi phạm quy định của pháp luật về quản lý nhà nước mà không phải là tội phạm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vi phạm dân sự là hành vi như thế nào?", "options": ["A. Là hành vi vi phạm nghĩa vụ trong các quan hệ tài sản, nhân thân thuộc đối tượng điều chỉnh của pháp luật dân sự.", "B. Là hành vi vi phạm kỷ luật lao động trong doanh nghiệp.", "C. Là hành vi nguy hiểm cho xã hội bị truy cứu trách nhiệm hình sự.", "D. Là hành vi vi phạm quy định về quản lý nhà nước."], "answer": "A", "explain": "Theo chương trình GDPT 2018, vi phạm dân sự là hành vi của cá nhân, tổ chức vi phạm nghĩa vụ trong các quan hệ tài sản, quan hệ nhân thân thuộc đối tượng điều chỉnh của pháp luật dân sự.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vi phạm kỷ luật là hành vi như thế nào?", "options": ["A. Là hành vi vi phạm hợp đồng tín dụng với ngân hàng.", "B. Là hành vi phạm tội được quy định trong Bộ luật Hình sự.", "C. Là hành vi vi phạm nội quy, quy chế của cơ quan, tổ chức, đơn vị.", "D. Là hành vi gây ô nhiễm môi trường."], "answer": "C", "explain": "Theo chương trình GDPT 2018, vi phạm kỷ luật là hành vi của cán bộ, công chức, viên chức, người lao động vi phạm nội quy, quy chế của cơ quan, tổ chức.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Bảo vệ môi trường năm 2020, môi trường bao gồm những yếu tố nào?", "options": ["A. Chỉ bao gồm rừng, biển và không khí.", "B. Chỉ bao gồm đất đai và nguồn nước.", "C. Chỉ bao gồm các yếu tố do con người tạo ra.", "D. Các yếu tố vật chất tự nhiên và nhân tạo có quan hệ mật thiết với nhau, bao quanh con người, ảnh hưởng tới đời sống, kinh tế, xã hội của con người."], "answer": "D", "explain": "Điều 3 Luật Bảo vệ môi trường 2020: môi trường bao gồm các yếu tố vật chất tự nhiên và nhân tạo có quan hệ mật thiết với nhau, bao quanh con người, có ảnh hưởng đến đời sống, kinh tế, xã hội, sức khỏe con người và thiên nhiên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Bà K gửi tiết kiệm 100 triệu đồng tại ngân hàng thương mại, lãi suất 5 phần trăm một năm, kỳ hạn 12 tháng. Sau một năm, bà K sẽ nhận được bao nhiêu tiền lãi?", "options": ["A. 50 triệu đồng.", "B. 10 triệu đồng.", "C. 5 triệu đồng.", "D. 500 nghìn đồng."], "answer": "C", "explain": "Tiền lãi một năm bằng số tiền gửi nhân với lãi suất: 100 triệu đồng nhân 5 phần trăm bằng 5 triệu đồng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Bà K gửi tiết kiệm 100 triệu đồng tại ngân hàng thương mại, lãi suất 5 phần trăm một năm, kỳ hạn 12 tháng. Khoản tiền gửi tiết kiệm của bà K được bảo vệ bởi chính sách nào?", "options": ["A. Không có chính sách nào bảo vệ, người gửi tự chịu rủi ro.", "B. Được Nhà nước bảo đảm gấp đôi số tiền gửi trong mọi trường hợp.", "C. Chính sách bảo hiểm tiền gửi: tiền gửi của khách hàng tại tổ chức tín dụng được bảo hiểm theo quy định của pháp luật.", "D. Được doanh nghiệp bảo hiểm nhân thọ chi trả."], "answer": "C", "explain": "Theo Luật Bảo hiểm tiền gửi 2012, tiền gửi của cá nhân tại tổ chức tín dụng được bảo hiểm tiền gửi bảo vệ theo quy định của pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "D cần tiền gấp nên vay của một đối tượng cho vay nặng lãi 30 triệu đồng với lãi suất 30 phần trăm một tháng. Theo Bộ luật Dân sự năm 2015, quy định về lãi suất cho vay như thế nào?", "options": ["A. Lãi suất vay do bên cho vay tự quyết định, pháp luật không giới hạn.", "B. Lãi suất vay tối đa là 50 phần trăm một tháng.", "C. Lãi suất vay do các bên thỏa thuận nhưng không được vượt quá 20 phần trăm một năm; trường hợp vượt quá thì phần vượt quá không có hiệu lực.", "D. Mọi thỏa thuận về lãi suất đều vô hiệu."], "answer": "C", "explain": "Điều 468 Bộ luật Dân sự 2015: lãi suất vay do các bên thỏa thuận nhưng không được vượt quá 20 phần trăm một năm của khoản tiền vay; trường hợp lãi suất vượt quá thì phần vượt quá không có hiệu lực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Anh V là công nhân xây dựng, trong lúc làm việc bị giàn giáo đổ sập gây thương tích nặng phải nghỉ việc 6 tháng. Theo quy định của pháp luật, anh V được hưởng chế độ nào?", "options": ["A. Được miễn toàn bộ thuế thu nhập cá nhân suốt đời.", "B. Chỉ được doanh nghiệp thăm hỏi động viên tinh thần.", "C. Chế độ tai nạn lao động của bảo hiểm xã hội: được hưởng trợ cấp và chăm sóc y tế.", "D. Không được hưởng chế độ gì vì tai nạn là rủi ro nghề nghiệp."], "answer": "C", "explain": "Theo Luật Bảo hiểm xã hội và Luật An toàn, vệ sinh lao động, người lao động bị tai nạn lao động được hưởng chế độ tai nạn lao động gồm trợ cấp và chăm sóc y tế từ quỹ bảo hiểm xã hội.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Công ty Y sản xuất bánh kẹo, hằng tháng kê khai và nộp thuế giá trị gia tăng đầy đủ. Thuế giá trị gia tăng là loại thuế trực thu hay gián thu?", "options": ["A. Không phải thuế trực thu cũng không phải thuế gián thu.", "B. Thuế trực thu: doanh nghiệp là người chịu thuế cuối cùng.", "C. Vừa là thuế trực thu vừa là thuế gián thu.", "D. Thuế gián thu: người tiêu dùng cuối cùng là người chịu thuế thông qua giá cả hàng hóa."], "answer": "D", "explain": "Thuế giá trị gia tăng là thuế gián thu: doanh nghiệp kê khai nộp thuế nhưng thực chất người tiêu dùng cuối cùng chịu thuế thông qua giá cả hàng hóa, dịch vụ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Công ty Y sản xuất bánh kẹo, hằng tháng kê khai và nộp thuế giá trị gia tăng đầy đủ. Giám đốc công ty Y chỉ đạo kế toán lập hai hệ thống sổ sách để trốn thuế. Hành vi trốn thuế là hành vi như thế nào?", "options": ["A. Là hành vi vi phạm pháp luật về thuế, có thể bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự.", "B. Là quyền tự do của doanh nghiệp trong nền kinh tế thị trường.", "C. Là chiến lược kinh doanh thông minh được pháp luật khuyến khích.", "D. Chỉ vi phạm đạo đức kinh doanh, không vi phạm pháp luật."], "answer": "A", "explain": "Trốn thuế là hành vi vi phạm pháp luật về thuế, bị xử phạt vi phạm hành chính và có thể bị truy cứu trách nhiệm hình sự về tội trốn thuế (Điều 200 Bộ luật Hình sự 2015) khi đủ dấu hiệu tội phạm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một số người dân trong khu phố thường xuyên xả rác bừa bãi ra đường và nơi công cộng dù đã được nhắc nhở nhiều lần. Hành vi này thuộc loại vi phạm pháp luật nào?", "options": ["A. Vi phạm dân sự.", "B. Vi phạm hành chính về bảo vệ môi trường và trật tự đô thị.", "C. Vi phạm kỷ luật lao động.", "D. Tội phạm về môi trường."], "answer": "B", "explain": "Xả rác bừa bãi nơi công cộng là hành vi vi phạm quy định về quản lý nhà nước trong lĩnh vực bảo vệ môi trường, trật tự đô thị, bị xử phạt vi phạm hành chính theo Nghị định 45/2022/NĐ-CP.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một nhóm đối tượng vào rừng phòng hộ chặt phá hàng chục cây gỗ lớn để bán lấy tiền. Hành vi này có thể bị xử lý như thế nào?", "options": ["A. Không bị xử lý vì rừng là tài sản chung của mọi người.", "B. Bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự về tội hủy hoại rừng khi đủ dấu hiệu tội phạm.", "C. Chỉ bị yêu cầu trồng lại cây.", "D. Được phép vì phục vụ nhu cầu phát triển kinh tế."], "answer": "B", "explain": "Hành vi chặt phá rừng phòng hộ trái phép xâm phạm quy định về quản lý, bảo vệ rừng, bị xử phạt vi phạm hành chính và có thể bị truy cứu trách nhiệm hình sự về tội hủy hoại rừng (Điều 243 Bộ luật Hình sự 2015).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "A cho B vay 500 triệu đồng với lãi suất 5 phần trăm một tháng, tương đương 60 phần trăm một năm. Theo Bộ luật Dân sự năm 2015 và Bộ luật Hình sự năm 2015, nhận định nào sau đây là đúng?", "options": ["A. B không phải trả bất kỳ khoản tiền nào cho A.", "B. Mức lãi suất này hoàn toàn hợp pháp vì do hai bên tự thỏa thuận.", "C. Phần lãi suất vượt quá 20 phần trăm một năm không có hiệu lực; nếu A thu lợi bất chính từ 30 triệu đồng trở lên thì có thể phạm tội cho vay lãi nặng trong giao dịch dân sự.", "D. A chỉ vi phạm đạo đức, không vi phạm pháp luật."], "answer": "C", "explain": "Điều 468 Bộ luật Dân sự 2015 giới hạn lãi suất vay không quá 20 phần trăm một năm, phần vượt quá không có hiệu lực. Điều 201 Bộ luật Hình sự 2015 quy định tội cho vay lãi nặng trong giao dịch dân sự khi cho vay với lãi suất gấp 05 lần trở lên mức lãi suất cao nhất pháp luật quy định và thu lợi bất chính từ 30 triệu đồng trở lên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Công ty Z nhiều tháng liền không đóng bảo hiểm xã hội cho 40 công nhân dù đã trừ tiền đóng bảo hiểm vào lương của họ. Khi công nhân bị ốm đau, tai nạn, họ không được hưởng chế độ bảo hiểm. Hành vi của công ty Z vi phạm quy định nào?", "options": ["A. Chỉ vi phạm nội quy của công ty.", "B. Vi phạm pháp luật về bảo hiểm xã hội: người sử dụng lao động có trách nhiệm đóng bảo hiểm xã hội cho người lao động; hành vi trốn đóng có thể bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự.", "C. Không vi phạm vì đóng bảo hiểm là tự nguyện.", "D. Là quyền của người sử dụng lao động."], "answer": "B", "explain": "Theo Luật Bảo hiểm xã hội, người sử dụng lao động có trách nhiệm đóng bảo hiểm xã hội cho người lao động. Hành vi trốn đóng, chiếm dụng tiền đóng bảo hiểm xã hội bị xử phạt vi phạm hành chính và có thể bị truy cứu trách nhiệm hình sự về tội trốn đóng bảo hiểm xã hội (Điều 216 Bộ luật Hình sự 2015).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "C điều khiển xe máy vượt đèn đỏ và đâm vào xe của D làm xe D bị hư hỏng nặng, D bị thương phải nhập viện. Trong tình huống này, hành vi của C đồng thời làm phát sinh những loại trách nhiệm pháp lý nào?", "options": ["A. Trách nhiệm hành chính về vi phạm quy định giao thông và trách nhiệm dân sự bồi thường thiệt hại cho D.", "B. Chỉ trách nhiệm dân sự.", "C. Trách nhiệm kỷ luật của cơ quan nơi C làm việc.", "D. Chỉ trách nhiệm hành chính."], "answer": "A", "explain": "Một hành vi vi phạm có thể đồng thời làm phát sinh nhiều loại trách nhiệm pháp lý: vượt đèn đỏ bị xử phạt vi phạm hành chính về giao thông; gây thiệt hại về tài sản, sức khỏe cho D thì phải bồi thường thiệt hại về dân sự theo Bộ luật Dân sự 2015.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Giám đốc doanh nghiệp X chỉ đạo không đóng bảo hiểm xã hội cho 50 công nhân trong 2 năm, chiếm dụng số tiền đóng bảo hiểm lên tới 1,2 tỉ đồng để sử dụng vào mục đích cá nhân. Theo Bộ luật Hình sự năm 2015, hành vi này có thể bị xử lý như thế nào?", "options": ["A. Chỉ phải đóng bù số tiền còn thiếu là xong.", "B. Chỉ bị xử phạt vi phạm hành chính với mức phạt cảnh cáo.", "C. Không bị xử lý vì bảo hiểm xã hội là tự nguyện.", "D. Có thể bị truy cứu trách nhiệm hình sự về tội trốn đóng bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp cho người lao động."], "answer": "D", "explain": "Điều 216 Bộ luật Hình sự 2015 quy định tội trốn đóng bảo hiểm xã hội, bảo hiểm y tế, bảo hiểm thất nghiệp cho người lao động: người có nghĩa vụ đóng mà gian dối hoặc bằng thủ đoạn khác để không đóng hoặc đóng không đầy đủ, đã bị xử phạt vi phạm hành chính mà còn vi phạm thì bị truy cứu trách nhiệm hình sự.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Chị L gửi tiết kiệm 200 triệu đồng tại một ngân hàng thương mại với kỳ hạn 12 tháng. Hằng tháng chị L nhận tin nhắn thông báo số dư tài khoản. Xét tính đúng, sai của các nhận định:", "statements": ["a) Ngân hàng là tổ chức kinh doanh tiền tệ, làm dịch vụ ngân hàng.", "b) Khoản tiền gửi tiết kiệm của chị L được pháp luật về bảo hiểm tiền gửi bảo vệ.", "c) Giám đốc ngân hàng được tự ý dùng tiền gửi của chị L vào mục đích cá nhân.", "d) Chị L có quyền rút tiền gửi theo thỏa thuận với ngân hàng."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: ngân hàng là loại hình tổ chức tín dụng kinh doanh tiền tệ. b) Đúng: tiền gửi của cá nhân tại tổ chức tín dụng được bảo hiểm tiền gửi bảo vệ (Luật Bảo hiểm tiền gửi 2012). c) Sai: ngân hàng phải quản lý, sử dụng vốn theo quy định, không được tự ý dùng tiền gửi của khách hàng vào mục đích cá nhân. d) Đúng: khách hàng có quyền định đoạt khoản tiền gửi của mình theo thỏa thuận.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Trong một buổi sinh hoạt lớp, cô giáo yêu cầu học sinh phân loại các hành vi: (1) lái xe vượt đèn đỏ, (2) trộm cắp tài sản của người khác, (3) công nhân đi làm muộn vi phạm nội quy công ty, (4) bên bán giao hàng không đúng chất lượng như hợp đồng. Xét tính đúng, sai của các nhận định:", "statements": ["a) Hành vi lái xe vượt đèn đỏ là vi phạm hành chính.", "b) Hành vi trộm cắp tài sản là tội phạm được quy định trong Bộ luật Hình sự.", "c) Hành vi đi làm muộn vi phạm nội quy công ty là vi phạm kỷ luật.", "d) Mọi hành vi vi phạm pháp luật đều là tội phạm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: vượt đèn đỏ vi phạm quy định về quản lý nhà nước trong lĩnh vực giao thông. b) Đúng: trộm cắp tài sản là tội phạm (Điều 173 Bộ luật Hình sự 2015). c) Đúng: vi phạm nội quy cơ quan, tổ chức là vi phạm kỷ luật. d) Sai: vi phạm pháp luật gồm vi phạm hình sự, vi phạm hành chính, vi phạm dân sự và vi phạm kỷ luật; không phải mọi vi phạm đều là tội phạm.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Tình huống: E khó khăn về tài chính nên vay của F 50 triệu đồng với lãi suất 10 phần trăm một tháng. Khi E chậm trả, F cho người đến đe dọa, ép E phải trả cả gốc lẫn lãi. Xét tính đúng, sai của các nhận định:", "statements": ["a) Mức lãi suất 10 phần trăm một tháng vượt quá giới hạn lãi suất mà pháp luật cho phép.", "b) Phần lãi suất vượt quá 20 phần trăm một năm không có hiệu lực theo quy định của Bộ luật Dân sự.", "c) E không phải trả bất kỳ khoản tiền nào vì hợp đồng vay vô hiệu toàn bộ.", "d) Nếu F thu lợi bất chính từ 30 triệu đồng trở lên thì có thể bị truy cứu trách nhiệm hình sự về tội cho vay lãi nặng trong giao dịch dân sự."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: 10 phần trăm một tháng tương đương 120 phần trăm một năm, vượt xa giới hạn 20 phần trăm một năm. b) Đúng: Điều 468 Bộ luật Dân sự 2015, phần lãi vượt quá không có hiệu lực. c) Sai: E vẫn phải trả tiền gốc đã vay, chỉ phần lãi vượt quá là không có hiệu lực. d) Đúng: Điều 201 Bộ luật Hình sự 2015 quy định tội cho vay lãi nặng trong giao dịch dân sự.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Tình huống: Khu công nghiệp Z nhiều lần xả nước thải vượt quy chuẩn ra sông. Nhiều hộ dân nuôi cá lồng trên sông bị cá chết hàng loạt, thiệt hại hàng trăm triệu đồng. Xét tính đúng, sai của các nhận định:", "statements": ["a) Hành vi xả thải vượt quy chuẩn của khu công nghiệp Z là vi phạm pháp luật về bảo vệ môi trường.", "b) Khu công nghiệp Z chỉ bị xử phạt vi phạm hành chính, không phải bồi thường thiệt hại cho người dân.", "c) Các hộ dân bị thiệt hại có quyền khởi kiện yêu cầu khu công nghiệp Z bồi thường thiệt hại.", "d) Nếu gây hậu quả đặc biệt nghiêm trọng, người có trách nhiệm có thể bị truy cứu trách nhiệm hình sự về tội gây ô nhiễm môi trường."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: xả thải vượt quy chuẩn vi phạm Luật Bảo vệ môi trường 2020. b) Sai: ngoài bị xử phạt vi phạm hành chính, chủ thể gây ô nhiễm còn phải bồi thường thiệt hại do hành vi của mình gây ra (Bộ luật Dân sự 2015). c) Đúng: người bị thiệt hại có quyền khởi kiện yêu cầu bồi thường. d) Đúng: Điều 235 Bộ luật Hình sự 2015 quy định tội gây ô nhiễm môi trường.", "points": 1}]}]}</script>
