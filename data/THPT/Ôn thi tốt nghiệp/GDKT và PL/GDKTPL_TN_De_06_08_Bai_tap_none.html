<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Nền kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam được hiểu như thế nào?", "options": ["A. Là nền kinh tế chỉ có thành phần kinh tế nhà nước.", "B. Là nền kinh tế do Nhà nước trực tiếp điều hành mọi hoạt động sản xuất kinh doanh.", "C. Là nền kinh tế thị trường tự do hoàn toàn không có sự quản lý của Nhà nước.", "D. Là nền kinh tế vận hành theo cơ chế thị trường có sự quản lý của Nhà nước pháp quyền xã hội chủ nghĩa."], "answer": "D", "explain": "Theo chương trình GDPT 2018, nền kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam là nền kinh tế vận hành theo cơ chế thị trường có sự quản lý của Nhà nước pháp quyền xã hội chủ nghĩa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vai trò của Nhà nước trong nền kinh tế thị trường định hướng xã hội chủ nghĩa là gì?", "options": ["A. Quản lý vĩ mô nền kinh tế bằng pháp luật, chiến lược, quy hoạch, chính sách và điều tiết các quan hệ kinh tế.", "B. Không có vai trò gì trong nền kinh tế thị trường.", "C. Trực tiếp sản xuất kinh doanh thay cho mọi doanh nghiệp.", "D. Ấn định mọi mức giá cả hàng hóa trên thị trường."], "answer": "A", "explain": "Theo chương trình GDPT 2018, Nhà nước quản lý vĩ mô nền kinh tế bằng pháp luật, chiến lược, quy hoạch, kế hoạch, chính sách và điều tiết các quan hệ kinh tế nhằm thực hiện mục tiêu phát triển kinh tế xã hội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013 và Luật Đất đai năm 2024, chế độ sở hữu đất đai ở nước ta được quy định như thế nào?", "options": ["A. Đất đai thuộc sở hữu tư nhân của người đang sử dụng.", "B. Đất đai thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu và thống nhất quản lý.", "C. Đất đai thuộc sở hữu của chính quyền địa phương.", "D. Ai khai phá thì đất thuộc sở hữu của người đó."], "answer": "B", "explain": "Điều 53 Hiến pháp 2013 và Luật Đất đai 2024: đất đai thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu và thống nhất quản lý.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người sử dụng đất có các quyền nào sau đây?", "options": ["A. Được sở hữu đất đai như sở hữu tài sản riêng.", "B. Được tự ý mua bán đất đai với người nước ngoài.", "C. Được cấp giấy chứng nhận quyền sử dụng đất; được chuyển đổi, chuyển nhượng, cho thuê, thừa kế, tặng cho, thế chấp, góp vốn bằng quyền sử dụng đất.", "D. Được tự ý chuyển đất nông nghiệp thành đất ở mà không cần xin phép."], "answer": "C", "explain": "Theo Luật Đất đai 2024, người sử dụng đất có các quyền chung: được cấp giấy chứng nhận quyền sử dụng đất và các quyền chuyển đổi, chuyển nhượng, cho thuê, cho thuê lại, thừa kế, tặng cho, thế chấp, góp vốn bằng quyền sử dụng đất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, nguyên tắc công dân bình đẳng trước pháp luật được quy định như thế nào?", "options": ["A. Chỉ cán bộ, công chức mới bình đẳng trước pháp luật.", "B. Người giàu được ưu tiên hơn trước pháp luật.", "C. Mọi người đều bình đẳng trước pháp luật; không ai bị phân biệt đối xử trong đời sống chính trị, dân sự, kinh tế, văn hóa, xã hội.", "D. Bình đẳng chỉ áp dụng trong lĩnh vực kinh tế."], "answer": "C", "explain": "Điều 16 Hiến pháp 2013: mọi người đều bình đẳng trước pháp luật; không ai bị phân biệt đối xử trong đời sống chính trị, dân sự, kinh tế, văn hóa, xã hội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, quyền bất khả xâm phạm về thân thể của công dân được quy định như thế nào?", "options": ["A. Quyền này chỉ áp dụng với cán bộ nhà nước.", "B. Ai cũng có quyền xâm phạm thân thể người khác khi mâu thuẫn.", "C. Mọi người có quyền bất khả xâm phạm về thân thể, được pháp luật bảo hộ về sức khỏe, danh dự và nhân phẩm.", "D. Chỉ người thành niên mới được bảo hộ về thân thể."], "answer": "C", "explain": "Điều 20 Hiến pháp 2013: mọi người có quyền bất khả xâm phạm về thân thể, được pháp luật bảo hộ về sức khỏe, danh dự và nhân phẩm; không ai bị tra tấn, bạo lực, truy bức, nhục hình hay bất kỳ hình thức đối xử nào khác xâm phạm thân thể, sức khỏe, xúc phạm danh dự, nhân phẩm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, chỗ ở của công dân được bảo vệ như thế nào?", "options": ["A. Không ai được tự ý vào chỗ ở của người khác nếu không được người đó đồng ý, trừ trường hợp pháp luật quy định.", "B. Công an được vào nhà dân bất cứ lúc nào không cần lý do.", "C. Chỗ ở của công dân không được pháp luật bảo vệ.", "D. Ai cũng có quyền tự ý vào nhà người khác."], "answer": "A", "explain": "Điều 22 Hiến pháp 2013: công dân có quyền có nơi ở hợp pháp; không ai được tự ý vào chỗ ở của người khác nếu không được người đó đồng ý, trừ trường hợp pháp luật quy định.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, thư tín, điện thoại, điện tín của công dân được bảo đảm như thế nào?", "options": ["A. Không được pháp luật bảo vệ.", "B. Được bảo đảm an toàn và bí mật; việc bóc mở, kiểm soát, thu giữ trái luật thư tín, điện thoại, điện tín của người khác bị nghiêm cấm.", "C. Ai cũng có quyền đọc trộm thư của người khác.", "D. Cơ quan nhà nước được nghe lén điện thoại của công dân tùy ý."], "answer": "B", "explain": "Điều 21 Hiến pháp 2013: mọi người có quyền bất khả xâm phạm về đời sống riêng tư, bí mật cá nhân và bí mật gia đình; thư tín, điện thoại, điện tín và các hình thức trao đổi thông tin riêng tư khác được bảo đảm an toàn và bí mật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, quyền sở hữu tài sản của công dân được quy định như thế nào?", "options": ["A. Mọi người có quyền sở hữu về thu nhập hợp pháp, của cải để dành, nhà ở, tư liệu sinh hoạt, tư liệu sản xuất và vốn đầu tư.", "B. Chỉ Nhà nước mới có quyền sở hữu tài sản.", "C. Tài sản của công dân có thể bị tịch thu tùy ý.", "D. Công dân không có quyền sở hữu tài sản riêng."], "answer": "A", "explain": "Điều 32 Hiến pháp 2013: mọi người có quyền sở hữu về thu nhập hợp pháp, của cải để dành, nhà ở, tư liệu sinh hoạt, tư liệu sản xuất, phần vốn góp trong doanh nghiệp hoặc trong các tổ chức kinh tế khác; quyền sở hữu tư nhân và quyền thừa kế được pháp luật bảo hộ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Đất đai năm 2024, Nhà nước thu hồi đất trong trường hợp nào?", "options": ["A. Trong trường hợp thật cần thiết vì mục đích quốc phòng, an ninh; phát triển kinh tế xã hội vì lợi ích quốc gia, công cộng.", "B. Khi người sử dụng đất không nộp thuế đầy đủ.", "C. Khi người sử dụng đất đi vắng khỏi địa phương.", "D. Trong mọi trường hợp khi Nhà nước có nhu cầu."], "answer": "A", "explain": "Theo Luật Đất đai 2024, Nhà nước thu hồi đất trong trường hợp thật cần thiết vì mục đích quốc phòng, an ninh; để phát triển kinh tế xã hội vì lợi ích quốc gia, công cộng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Đất đai năm 2024, hành vi nào sau đây bị nghiêm cấm?", "options": ["A. Lấn đất, chiếm đất, hủy hoại đất đai.", "B. Sử dụng đất đúng mục đích được giao.", "C. Bảo vệ, cải tạo đất đai.", "D. Thực hiện đầy đủ nghĩa vụ tài chính về đất đai."], "answer": "A", "explain": "Luật Đất đai 2024 nghiêm cấm các hành vi: lấn đất, chiếm đất, hủy hoại đất đai; vi phạm quy hoạch, kế hoạch sử dụng đất đã được công bố; không sử dụng, sử dụng đất không đúng mục đích.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất là gì?", "options": ["A. Là hợp đồng mua bán đất đai.", "B. Là giấy chứng nhận đăng ký kinh doanh.", "C. Là chứng thư pháp lý để Nhà nước xác nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất hợp pháp của người có quyền sử dụng đất.", "D. Là giấy phép xây dựng nhà ở."], "answer": "C", "explain": "Theo Luật Đất đai 2024, giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất là chứng thư pháp lý để Nhà nước xác nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất hợp pháp của người có quyền sử dụng đất, chủ sở hữu tài sản gắn liền với đất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Gia đình ông N được cấp giấy chứng nhận quyền sử dụng đất đối với 500 mét vuông đất ở sử dụng ổn định từ lâu. Giấy chứng nhận quyền sử dụng đất có ý nghĩa pháp lý gì?", "options": ["A. Là chứng thư pháp lý để Nhà nước xác nhận quyền sử dụng đất hợp pháp của người sử dụng đất.", "B. Là giấy phép xây dựng nhà ở.", "C. Là chứng từ nộp thuế đất hằng năm.", "D. Là giấy phép để người dân được sở hữu đất đai."], "answer": "A", "explain": "Theo Luật Đất đai 2024, giấy chứng nhận quyền sử dụng đất là chứng thư pháp lý để Nhà nước xác nhận quyền sử dụng đất hợp pháp của người có quyền sử dụng đất. Đất đai thuộc sở hữu toàn dân, người dân chỉ có quyền sử dụng, không có quyền sở hữu đất đai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Gia đình ông N được cấp giấy chứng nhận quyền sử dụng đất đối với 500 mét vuông đất ở sử dụng ổn định từ lâu. Ông N muốn chuyển nhượng một phần diện tích đất cho người khác. Theo quy định của pháp luật, ông N có quyền này không?", "options": ["A. Có, chuyển nhượng quyền sử dụng đất là một trong các quyền của người sử dụng đất khi đủ điều kiện.", "B. Không, người dân không được chuyển nhượng đất trong mọi trường hợp.", "C. Chỉ được tặng cho, không được chuyển nhượng.", "D. Có, nhưng không cần làm thủ tục gì."], "answer": "A", "explain": "Theo Luật Đất đai 2024, người sử dụng đất có quyền chuyển nhượng quyền sử dụng đất khi có giấy chứng nhận, đất không có tranh chấp, quyền sử dụng đất không bị kê biên và còn thời hạn sử dụng đất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Anh Q đến làm thủ tục cấp giấy chứng nhận quyền sử dụng đất thì bị cán bộ địa chính gây khó khăn, đòi phải chi tiền bồi dưỡng mới giải quyết nhanh. Theo quy định của pháp luật, anh Q có thể làm gì?", "options": ["A. Im lặng vì sợ bị trù dập.", "B. Thuê người đe dọa cán bộ.", "C. tế đều là bộ phận cấu thành quan trọng của nền kinh tế quốc dân, bình đẳng trước pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Một dự án đầu tư công tổ chức đấu thầu, cả doanh nghiệp nhà nước và doanh nghiệp tư nhân đều tham gia. Trong nền kinh tế thị trường định hướng xã hội chủ nghĩa, kinh tế nhà nước giữ vai trò gì?", "options": ["A. Không có vai trò gì đặc biệt.", "B. Chỉ hoạt động trong lĩnh vực nông nghiệp.", "C. Giữ vai trò chủ đạo trong nền kinh tế quốc dân.", "D. Giữ vai trò duy nhất, loại trừ các thành phần kinh tế khác."], "answer": "C", "explain": "Điều 51 Hiến pháp 2013: kinh tế nhà nước giữ vai trò chủ đạo trong nền kinh tế quốc dân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một nhóm người tự xưng là cán bộ điều tra đến khám xét nhà bà G mà không xuất trình lệnh khám xét của cơ quan có thẩm quyền. Theo Hiến pháp năm 2013, hành vi này như thế nào?", "options": ["A. Là việc làm bình thường của cơ quan điều tra.", "B. Vi phạm quyền bất khả xâm phạm về chỗ ở của công dân; việc khám xét chỗ ở phải theo quy định của pháp luật và có lệnh của cơ quan có thẩm quyền.", "C. Người dân không có quyền từ chối.", "D. Chỉ vi phạm khi không tìm thấy tang vật."], "answer": "B", "explain": "Điều 22 Hiến pháp 2013: không ai được tự ý vào chỗ ở của người khác nếu không được người đó đồng ý, trừ trường hợp pháp luật quy định. Việc khám xét chỗ ở phải có lệnh của cơ quan có thẩm quyền theo quy định của pháp luật tố tụng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "T lén đọc trộm thư và tin nhắn điện thoại của bạn cùng phòng rồi kể cho nhiều người nghe. Hành vi của T xâm phạm quyền nào của công dân?", "options": ["A. Quyền bất khả xâm phạm về đời sống riêng tư, bí mật cá nhân; thư tín, điện thoại được bảo đảm an toàn và bí mật.", "B. Chỉ vi phạm đạo đức, không vi phạm pháp luật.", "C. Chỉ vi phạm khi bị phát hiện.", "D. Không xâm phạm quyền nào vì là bạn bè thân thiết."], "answer": "A", "explain": "Điều 21 Hiến pháp 2013: mọi người có quyền bất khả xâm phạm về đời sống riêng tư, bí mật cá nhân; thư tín, điện thoại, điện tín và các hình thức trao đổi thông tin riêng tư khác được bảo đảm an toàn và bí mật. Hành vi bóc mở, kiểm soát trái luật bị nghiêm cấm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ông M qua đời không để lại di chúc, có 3 người con đã thành niên và một mảnh đất 600 mét vuông đã được cấp giấy chứng nhận. Ba người con tranh chấp không thỏa thuận được việc phân chia. Theo Bộ luật Dân sự năm 2015, di sản của ông M được chia như thế nào?", "options": ["A. Chia theo pháp luật: những người thừa kế cùng hàng được hưởng phần di sản bằng nhau; hàng thừa kế thứ nhất gồm vợ, chồng, cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi, con đẻ, con nuôi của người chết.", "B. Người con cả được hưởng toàn bộ di sản.", "C. Nhà nước thu hồi toàn bộ di sản.", "D. Ai đang quản lý đất thì được hưởng toàn bộ."], "answer": "A", "explain": "Điều 650 và Điều 651 Bộ luật Dân sự 2015: thừa kế theo pháp luật được áp dụng khi không có di chúc; những người thừa kế cùng hàng được hưởng phần di sản bằng nhau; hàng thừa kế thứ nhất gồm vợ, chồng, cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi, con đẻ, con nuôi của người chết.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhà nước thu hồi đất của gia đình ông V để làm đường cao tốc. Ông V không đồng ý với giá bồi thường vì cho rằng thấp hơn giá thị trường. Theo Luật Đất đai năm 2024, giá đất cụ thể để tính tiền bồi thường do ai quyết định và ông V có quyền gì?", "options": ["A. Giá đất do chủ đầu tư quyết định; người dân không có quyền khiếu nại.", "B. Giá đất cụ thể do Ủy ban nhân dân cấp tỉnh quyết định; ông V có quyền khiếu nại nếu không đồng ý.", "C. Giá đất do ông V tự quyết định.", "D. Không bồi thường vì đất thuộc sở hữu toàn dân."], "answer": "B", "explain": "Theo Luật Đất đai 2024, giá đất cụ thể do Ủy ban nhân dân cấp tỉnh quyết định để tính tiền bồi thường khi Nhà nước thu hồi đất. Người có đất bị thu hồi có quyền khiếu nại quyết định hành chính về bồi thường theo Luật Khiếu nại 2011.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Doanh nghiệp tư nhân X có năng lực tốt nhưng nhiều lần bị loại khỏi danh sách xét duyệt cho vay vốn ưu đãi của ngân hàng chính sách với lý do ưu tiên doanh nghiệp nhà nước, dù cùng đáp ứng điều kiện. Việc làm này vi phạm nguyên tắc nào?", "options": ["A. Nguyên tắc bình đẳng giữa các thành phần kinh tế trước pháp luật trong tiếp cận nguồn lực và cơ hội kinh doanh.", "B. Chỉ vi phạm đạo đức kinh doanh.", "C. Là chính sách đúng đắn cần phát huy.", "D. Không vi phạm nguyên tắc nào vì ngân hàng có quyền lựa chọn."], "answer": "A", "explain": "Điều 51 Hiến pháp 2013: các thành phần kinh tế đều là bộ phận cấu thành quan trọng của nền kinh tế quốc dân, bình đẳng trước pháp luật. Phân biệt đối xử giữa doanh nghiệp nhà nước và doanh nghiệp tư nhân trong tiếp cận nguồn lực là vi phạm nguyên tắc bình đẳng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ông X tự ý lấn chiếm 200 mét vuông đất công do Ủy ban nhân dân xã quản lý để xây nhà ở. Chính quyền xã đã nhiều lần yêu cầu tháo dỡ nhưng ông X không chấp hành. Theo Luật Đất đai năm 2024, hành vi của ông X bị xử lý như thế nào?", "options": ["A. Không bị xử lý vì đất công không ai sử dụng.", "B. Chỉ bị nhắc nhở.", "C. Bị xử phạt vi phạm hành chính về đất đai, buộc khôi phục lại tình trạng ban đầu của đất và buộc tháo dỡ công trình xây dựng trái phép.", "D. Được công nhận quyền sử dụng đất vì đã xây nhà kiên cố."], "answer": "C", "explain": "Luật Đất đai 2024 nghiêm cấm hành vi lấn đất, chiếm đất. Người có hành vi lấn, chiếm đất bị xử phạt vi phạm hành chính và bị áp dụng biện pháp khắc phục hậu quả: buộc khôi phục lại tình trạng ban đầu của đất, buộc tháo dỡ công trình xây dựng trái phép.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Gia đình ông Đ sử dụng ổn định 300 mét vuông đất ở từ năm 1990 và đã được cấp giấy chứng nhận quyền sử dụng đất. Nay ông Đ muốn chuyển nhượng một phần đất cho người khác. Xét tính đúng, sai của các nhận định:", "statements": ["a) Đất đai thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu và thống nhất quản lý.", "b) Gia đình ông Đ được cấp giấy chứng nhận là đã được Nhà nước xác nhận quyền sử dụng đất hợp pháp.", "c) Ông Đ được tự ý chuyển mục đích sử dụng từ đất ở sang đất kinh doanh mà không cần xin phép.", "d) Khi đủ điều kiện, ông Đ có quyền chuyển nhượng quyền sử dụng đất cho người khác."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Điều 53 Hiến pháp 2013 và Luật Đất đai 2024. b) Đúng: giấy chứng nhận là chứng thư pháp lý xác nhận quyền sử dụng đất hợp pháp. c) Sai: chuyển mục đích sử dụng đất trong một số trường hợp phải được cơ quan nhà nước có thẩm quyền cho phép. d) Đúng: chuyển nhượng là một trong các quyền của người sử dụng đất khi đủ điều kiện.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Một người tự xưng là cán bộ công an đến yêu cầu khám xét nhà anh H nhưng không xuất trình bất kỳ giấy tờ, lệnh khám xét nào. Anh H từ chối và yêu cầu người này xuất trình lệnh. Xét tính đúng, sai của các nhận định:", "statements": ["a) Chỗ ở của công dân bất khả xâm phạm; không ai được tự ý vào chỗ ở của người khác nếu không được đồng ý.", "b) Việc khám xét chỗ ở phải tuân theo quy định của pháp luật và phải có lệnh của cơ quan có thẩm quyền.", "c) Cán bộ công an được khám xét nhà dân bất cứ lúc nào mà không cần lệnh.", "d) Thư tín, điện thoại của công dân được pháp luật bảo đảm an toàn và bí mật."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Điều 22 Hiến pháp 2013. b) Đúng: khám xét chỗ ở phải có căn cứ và lệnh theo quy định của pháp luật tố tụng. c) Sai: không ai được khám xét tùy tiện, phải có lệnh của cơ quan có thẩm quyền. d) Đúng: Điều 21 Hiến pháp 2013.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Tình huống: Bà L qua đời không để lại di chúc. Bà L có chồng, hai con đẻ và một người con nuôi. Những người thừa kế không thỏa thuận được việc phân chia di sản là một ngôi nhà. Xét tính đúng, sai của các nhận định:", "statements": ["a) Di sản của bà L được chia theo pháp luật vì không có di chúc.", "b) Chồng, con đẻ và con nuôi của bà L đều thuộc hàng thừa kế thứ nhất.", "c) Người con đã thành niên, có khả năng lao động thì không được hưởng thừa kế.", "d) Di chúc miệng trong mọi trường hợp đều không có giá trị pháp lý."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: Điều 650 Bộ luật Dân sự 2015, không có di chúc thì chia thừa kế theo pháp luật. b) Đúng: Điều 651, hàng thừa kế thứ nhất gồm vợ, chồng, cha đẻ, mẹ đẻ, cha nuôi, mẹ nuôi, con đẻ, con nuôi của người chết. c) Sai: người thừa kế cùng hàng được hưởng phần di sản bằng nhau, không phân biệt đã thành niên hay chưa. d) Sai: di chúc miệng được coi là hợp pháp nếu đáp ứng đủ điều kiện theo Điều 629, Điều 630 Bộ luật Dân sự 2015.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Tình huống: Ông P lấn chiếm đất trống do Ủy ban nhân dân xã quản lý để trồng rau. Sau 3 năm, ông P xây nhà kiên cố trên diện tích đất lấn chiếm và cho rằng đất đã thuộc quyền sử dụng của mình vì sử dụng lâu năm. Xét tính đúng, sai của các nhận định:", "statements": ["a) Hành vi lấn đất, chiếm đất của ông P là hành vi bị pháp luật nghiêm cấm.", "b) Ông P có thể bị xử phạt vi phạm hành chính và buộc khôi phục lại tình trạng ban đầu của đất.", "c) Cứ sử dụng đất lâu năm thì đương nhiên được Nhà nước công nhận quyền sử dụng đất.", "d) Công trình nhà ở xây trái phép trên đất lấn chiếm có thể bị buộc tháo dỡ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Luật Đất đai 2024 nghiêm cấm hành vi lấn đất, chiếm đất, hủy hoại đất đai. b) Đúng: người vi phạm bị xử phạt vi phạm hành chính và áp dụng biện pháp khắc phục hậu quả. c) Sai: việc công nhận quyền sử dụng đất phải đáp ứng điều kiện về nguồn gốc, quá trình sử dụng đất theo quy định; đất lấn chiếm không được công nhận. d) Đúng: công trình xây dựng trái phép trên đất lấn chiếm bị buộc tháo dỡ.", "points": 1}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Tiết kiệm trong chi tiêu được hiểu như thế nào?", "options": ["A. Là không chi tiêu bất cứ khoản nào trong mọi trường hợp.", "B. Là vay mượn để chi tiêu thoải mái.", "C. Là dành một phần thu nhập không chi tiêu cho nhu cầu hiện tại để dự phòng cho tương lai hoặc thực hiện mục tiêu lớn.", "D. Là chi tiêu hết toàn bộ thu nhập mỗi tháng."], "answer": "C", "explain": "Theo chương trình GDPT 2018, tiết kiệm là dành một phần thu nhập không chi tiêu cho nhu cầu hiện tại để dự phòng cho những nhu cầu trong tương lai hoặc thực hiện mục tiêu lớn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chi tiêu hợp lý là chi tiêu như thế nào?", "options": ["A. Là chi tiêu hết sạch thu nhập mỗi tháng.", "B. Là chi tiêu cân đối giữa thu nhập và chi tiêu, ưu tiên nhu cầu thiết yếu, có kế hoạch và có khoản dự phòng.", "C. Là vay nợ để mua hàng hiệu đắt tiền.", "D. Là mua sắm theo sở thích không cần tính toán."], "answer": "B", "explain": "Theo chương trình GDPT 2018, chi tiêu hợp lý là việc cân đối giữa thu nhập và chi tiêu, ưu tiên các nhu cầu thiết yếu, có kế hoạch chi tiêu và dành khoản dự phòng cho tương lai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bảo hiểm nhân thọ là loại bảo hiểm cho đối tượng nào?", "options": ["A. Cho xe ô tô và xe máy.", "B. Cho tính mạng, sức khỏe của con người.", "C. Cho nhà cửa và tài sản.", "D. Cho hàng hóa xuất khẩu."], "answer": "B", "explain": "Theo Luật Kinh doanh bảo hiểm, bảo hiểm nhân thọ là loại hình bảo hiểm cho trường hợp người được bảo hiểm sống hoặc chết, gặp tai nạn, ốm đau, nhằm bảo vệ tính mạng, sức khỏe con người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Phòng, chống tham nhũng năm 2018, tham nhũng là hành vi nào?", "options": ["A. Là hành vi đánh nhau gây rối trật tự công cộng.", "B. Là hành vi trộm cắp tài sản của người dân.", "C. Là hành vi trốn thuế của doanh nghiệp.", "D. Là hành vi của người có chức vụ, quyền hạn đã lợi dụng chức vụ, quyền hạn đó để vụ lợi."], "answer": "D", "explain": "Điều 3 Luật Phòng, chống tham nhũng 2018: tham nhũng là hành vi của người có chức vụ, quyền hạn đã lợi dụng chức vụ, quyền hạn đó để vụ lợi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lãng phí trong quản lý, sử dụng tài sản công được hiểu như thế nào?", "options": ["A. Là việc đầu tư có hiệu quả cao.", "B. Là việc sử dụng tài sản công đúng mục đích.", "C. Là việc tiết kiệm chi tiêu trong cơ quan nhà nước.", "D. Là việc quản lý, sử dụng vốn, tài sản, thời gian, công sức không hiệu quả, gây thất thoát, thiệt hại."], "answer": "D", "explain": "Theo Luật Thực hành tiết kiệm, chống lãng phí, lãng phí là việc quản lý, sử dụng vốn, tài sản nhà nước, thời gian, công sức của tập thể, cá nhân không hiệu quả, gây thất thoát, thiệt hại.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Trẻ em năm 2016, trẻ em có các nhóm quyền cơ bản nào?", "options": ["A. Trẻ em chỉ có quyền vui chơi, không có quyền học tập.", "B. Trẻ em không có quyền gì, chỉ có bổn phận.", "C. Trẻ em chỉ có quyền được cho tiền tiêu vặt.", "D. Quyền sống, quyền được bảo vệ, quyền được chăm sóc, nuôi dưỡng, quyền được giáo dục, học tập và vui chơi."], "answer": "D", "explain": "Luật Trẻ em 2016 quy định trẻ em có các nhóm quyền: quyền sống; quyền được bảo vệ; quyền được chăm sóc, nuôi dưỡng; quyền được giáo dục, học tập, phát triển năng khiếu và vui chơi, giải trí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Trẻ em năm 2016, trẻ em có bổn phận nào?", "options": ["A. Yêu quý, kính trọng, hiếu thảo với ông bà, cha mẹ; lễ phép với người lớn; chăm chỉ học tập; rèn luyện đạo đức.", "B. Không phải làm gì, chỉ cần hưởng thụ.", "C. Được quyền không vâng lời cha mẹ.", "D. Được nghỉ học tùy ý."], "answer": "A", "explain": "Điều 37 Luật Trẻ em 2016: trẻ em có bổn phận yêu quý, kính trọng, hiếu thảo với ông bà, cha mẹ; kính trọng thầy giáo, cô giáo; lễ phép với người lớn; chăm chỉ học tập; rèn luyện đạo đức, tác phong.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bình đẳng giới được hiểu như thế nào?", "options": ["A. Là việc ưu tiên tuyệt đối cho nữ giới trong mọi lĩnh vực.", "B. Là việc nam nữ phải làm những công việc giống hệt nhau.", "C. Là việc nam, nữ có vị trí, vai trò ngang nhau, được tạo điều kiện và cơ hội phát huy năng lực của mình cho sự phát triển của cộng đồng, gia đình và thụ hưởng như nhau về thành quả của sự phát triển đó.", "D. Là việc nam giới không phải làm việc nhà."], "answer": "C", "explain": "Điều 5 Luật Bình đẳng giới 2006: bình đẳng giới là việc nam, nữ có vị trí, vai trò ngang nhau, được tạo điều kiện và cơ hội phát huy năng lực của mình cho sự phát triển của cộng đồng, của gia đình và thụ hưởng như nhau về thành quả của sự phát triển đó.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tệ nạn xã hội bao gồm những hiện tượng nào?", "options": ["A. Các lễ hội truyền thống của dân tộc.", "B. Các phong trào tình nguyện của thanh niên.", "C. Các hoạt động thể thao lành mạnh.", "D. Ma túy, mại dâm, cờ bạc và các tệ nạn xã hội khác làm ảnh hưởng đến trật tự, an toàn xã hội."], "answer": "D", "explain": "Theo chương trình GDPT 2018, tệ nạn xã hội là hiện tượng xã hội bao gồm ma túy, mại dâm, cờ bạc và các tệ nạn khác làm ảnh hưởng xấu đến trật tự, an toàn xã hội, đạo đức, lối sống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo quy định của pháp luật, hành vi sản xuất, mua bán, tàng trữ, sử dụng trái phép chất ma túy bị xử lý như thế nào?", "options": ["A. Được pháp luật cho phép.", "B. Chỉ bị nhắc nhở.", "C. Bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự tùy tính chất, mức độ.", "D. Không bị xử lý vì là việc cá nhân."], "answer": "C", "explain": "Pháp luật nghiêm cấm sản xuất, mua bán, tàng trữ, sử dụng trái phép chất ma túy. Người vi phạm bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự về các tội phạm về ma túy (Điều 248 đến Điều 252 Bộ luật Hình sự 2015).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người nghiện ma túy có trách nhiệm gì theo quy định của pháp luật?", "options": ["A. Chỉ cai nghiện khi tự nguyện, Nhà nước không được can thiệp.", "B. Được Nhà nước cung cấp ma túy miễn phí.", "C. Không phải cai nghiện, được tiếp tục sử dụng.", "D. Đăng ký cai nghiện tự nguyện hoặc bị áp dụng biện pháp cai nghiện bắt buộc theo quy định của pháp luật."], "answer": "D", "explain": "Theo Luật Phòng, chống ma túy 2021, người nghiện ma túy có trách nhiệm đăng ký cai nghiện tự nguyện; trường hợp không đăng ký hoặc đã cai nghiện tự nguyện mà vẫn còn nghiện thì bị áp dụng biện pháp cai nghiện bắt buộc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hành vi đánh bạc trái phép bị xử lý như thế nào?", "options": ["A. Được pháp luật cho phép trong dịp lễ tết.", "B. Chỉ bị xử lý khi số tiền đánh bạc trên 1 tỉ đồng.", "C. Bị xử phạt vi phạm hành chính; trường hợp đủ dấu hiệu tội phạm thì bị truy cứu trách nhiệm hình sự về tội đánh bạc.", "D. Không bị xử lý vì là trò chơi giải trí."], "answer": "C", "explain": "Hành vi đánh bạc trái phép bị xử phạt vi phạm hành chính theo Nghị định 144/2021/NĐ-CP; trường hợp đủ dấu hiệu tội phạm thì bị truy cứu trách nhiệm hình sự về tội đánh bạc (Điều 321 Bộ luật Hình sự 2015).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Bạn H lập kế hoạch chi tiêu mỗi tháng: 50 phần trăm cho nhu cầu thiết yếu, 30 phần trăm cho mong muốn cá nhân, 20 phần trăm tiết kiệm. Cách chi tiêu của bạn H được đánh giá như thế nào?", "options": ["A. Là chi tiêu hợp lý, có kế hoạch và có khoản tiết kiệm dự phòng.", "B. Là chi tiêu vi phạm pháp luật.", "C. Là chi tiêu hoang phí, không hợp lý.", "D. Là chi tiêu quá tiết kiệm, không nên học theo."], "answer": "A", "explain": "Phân bổ thu nhập thành các khoản cho nhu cầu thiết yếu, mong muốn cá nhân và tiết kiệm dự phòng là cách chi tiêu hợp lý, có kế hoạch theo hướng dẫn giáo dục tài chính trong chương trình GDPT 2018.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Bạn H lập kế hoạch chi tiêu mỗi tháng: 50 phần trăm cho nhu cầu thiết yếu, 30 phần trăm cho mong muốn cá nhân, 20 phần trăm tiết kiệm. Khoản tiết kiệm 20 phần trăm có ý nghĩa gì?", "options": ["A. Không có ý nghĩa gì, nên tiêu hết.", "B. Là khoản tiền để tiêu xài hoang phí sau này.", "C. Là khoản tiền bắt buộc phải nộp cho Nhà nước.", "D. Giúp dự phòng cho những rủi ro, nhu cầu đột xuất trong tương lai và thực hiện các mục tiêu lớn."], "answer": "D", "explain": "Tiết kiệm giúp mỗi người chủ động dự phòng cho những rủi ro, nhu cầu đột xuất trong tương lai và có nguồn lực thực hiện các mục tiêu lớn như học tập, mua nhà, khởi nghiệp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "K rủ một số bạn học chơi game bài ăn tiền trong giờ ra chơi. Theo quy định của pháp luật, hành vi này như thế nào?", "options": ["A. Là trò chơi giải trí bình thường của học sinh.", "B. Được nhà trường khuyến khích.", "C. Là hành vi đánh bạc trái phép, bị xử phạt vi phạm hành chính; nếu đủ dấu hiệu tội phạm thì bị truy cứu trách nhiệm hình sự.", "D. Chỉ vi phạm khi chơi với số tiền lớn."], "answer": "C", "explain": "Đánh bạc dưới mọi hình thức ăn tiền mà không được cơ quan nhà nước có thẩm quyền cho phép là hành vi bị pháp luật nghiêm cấm, bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "T phát hiện bạn thân của mình sử dụng ma túy. Theo em, T nên làm gì?", "options": ["A. Bao che cho bạn để giữ tình bạn.", "B. Mặc kệ vì đó là việc riêng của bạn.", "C. Cùng bạn thử một lần cho biết.", "D. Khuyên bạn đi cai nghiện và báo cho gia đình, nhà trường, cơ quan chức năng để được giúp đỡ; tuyệt đối không bao che."], "answer": "D", "explain": "Phát hiện người sử dụng trái phép chất ma túy cần khuyên nhủ, giúp đỡ họ cai nghiện và báo cho gia đình, nhà trường, cơ quan chức năng. Bao che, không tố giác là vi phạm pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Một cán bộ địa chính xã nhận 10 triệu đồng của người dân để làm nhanh thủ tục cấp giấy chứng nhận. Hành vi nhận tiền của cán bộ này là gì?", "options": ["A. Chỉ vi phạm đạo đức, không vi phạm pháp luật.", "B. Là khoản bồi dưỡng hợp pháp cho cán bộ.", "C. Là việc làm bình thường trong quan hệ dân sự.", "D. Là hành vi tham nhũng: lợi dụng chức vụ, quyền hạn để vụ lợi."], "answer": "D", "explain": "Điều 3 Luật Phòng, chống tham nhũng 2018: tham nhũng là hành vi của người có chức vụ, quyền hạn đã lợi dụng chức vụ, quyền hạn đó để vụ lợi. Nhận tiền để giải quyết công việc là hành vi tham nhũng, có dấu hiệu tội nhận hối lộ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Một cán bộ địa chính xã nhận 10 triệu đồng của người dân để làm nhanh thủ tục cấp giấy chứng nhận. Người dân đưa tiền cho cán bộ trong trường hợp này như thế nào?", "options": ["A. Là việc làm đúng đắn để được việc.", "B. Cũng vi phạm pháp luật về hành vi đưa hối lộ; người dân cần tố cáo thay vì đưa tiền.", "C. Được pháp luật khuyến khích.", "D. Không vi phạm vì là người bị vòi vĩnh."], "answer": "B", "explain": "Đưa tiền, tài sản cho người có chức vụ, quyền hạn để được giải quyết công việc là hành vi đưa hối lộ, vi phạm pháp luật (Điều 364 Bộ luật Hình sự 2015). Người dân cần từ chối và tố cáo hành vi vòi vĩnh đến cơ quan có thẩm quyền.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vợ chồng ông B bắt con trai 12 tuổi nghỉ học để đi làm thuê kiếm tiền phụ giúp gia đình. Hành vi này xâm phạm quyền nào của trẻ em?", "options": ["A. Quyền được giáo dục, học tập của trẻ em; hành vi bị xử phạt vi phạm hành chính.", "B. Là việc làm đáng khuyến khích vì dạy con tính tự lập.", "C. Không xâm phạm quyền nào vì cha mẹ có quyền quyết định.", "D. Chỉ vi phạm đạo đức gia đình."], "answer": "A", "explain": "Luật Trẻ em 2016 quy định trẻ em có quyền được giáo dục, học tập. Cha mẹ có trách nhiệm bảo đảm cho trẻ em được đi học. Hành vi bắt trẻ em bỏ học đi làm thuê xâm phạm quyền trẻ em và bị xử phạt vi phạm hành chính.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Doanh nghiệp X trả lương cho lao động nữ thấp hơn lao động nam khi cùng làm một công việc, cùng trình độ và năng suất. Hành vi này vi phạm quy định nào?", "options": ["A. Không vi phạm vì doanh nghiệp có quyền tự quyết định lương.", "B. Chỉ vi phạm khi lao động nữ khiếu nại.", "C. Là chính sách hợp lý để khuyến khích lao động nam.", "D. Vi phạm nguyên tắc bình đẳng giới trong lao động: nam, nữ bình đẳng về tiền lương khi có cùng trình độ, năng lực và năng suất."], "answer": "D", "explain": "Luật Bình đẳng giới 2006 và Bộ luật Lao động 2019 quy định nam, nữ bình đẳng về tiền lương, tiền công khi có cùng trình độ, năng lực, năng suất lao động. Trả lương phân biệt giới tính là hành vi vi phạm bị xử phạt vi phạm hành chính.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ông Đ là kế toán của một cơ quan nhà nước, đã lập chứng từ giả để chiếm đoạt 500 triệu đồng tiền công quỹ sử dụng vào mục đích cá nhân. Theo Bộ luật Hình sự năm 2015, hành vi của ông Đ phạm tội gì?", "options": ["A. Tội trộm cắp tài sản.", "B. Tội lừa đảo chiếm đoạt tài sản.", "C. Không phạm tội vì là tiền của cơ quan.", "D. Tội tham ô tài sản: người có chức vụ, quyền hạn lợi dụng chức vụ, quyền hạn chiếm đoạt tài sản mà mình có trách nhiệm quản lý."], "answer": "D", "explain": "Điều 353 Bộ luật Hình sự 2015: tội tham ô tài sản là hành vi của người có chức vụ, quyền hạn lợi dụng chức vụ, quyền hạn chiếm đoạt tài sản mà mình có trách nhiệm quản lý. Ông Đ là kế toán có trách nhiệm quản lý tiền công quỹ nên hành vi cấu thành tội tham ô tài sản.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nhóm học sinh thường xuyên bắt nạt, đánh đập một bạn học yếu thế hơn và quay clip tung lên mạng xã hội để chế giễu. Theo quy định của pháp luật, hành vi này như thế nào?", "options": ["A. Chỉ nhà trường xử lý, pháp luật không can thiệp.", "B. Là hành vi bạo lực học đường, xâm phạm quyền được bảo vệ của trẻ em; người vi phạm bị xử lý kỷ luật, xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự tùy mức độ.", "C. Nạn nhân phải tự chịu đựng, không được phản ánh.", "D. Là trò đùa của tuổi học trò, không vi phạm pháp luật."], "answer": "B", "explain": "Luật Trẻ em 2016 quy định trẻ em có quyền được bảo vệ khỏi mọi hình thức bạo lực, xâm hại. Hành vi bạo lực học đường bị xử lý theo mức độ: kỷ luật của nhà trường, xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự khi gây hậu quả nghiêm trọng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Người dân phát hiện một cán bộ xã kê khai tài sản, thu nhập không trung thực, có nhiều tài sản bất minh. Theo Luật Phòng, chống tham nhũng năm 2018, người dân có quyền gì và cán bộ có nghĩa vụ gì?", "options": ["A. Người dân không có quyền gì; cán bộ không phải kê khai tài sản.", "B. Việc kê khai tài sản là hình thức, không bắt buộc.", "C. Người dân có quyền tố cáo; cán bộ, công chức có nghĩa vụ kê khai tài sản, thu nhập trung thực theo quy định.", "D. Chỉ cơ quan thanh tra mới được biết về tài sản của cán bộ."], "answer": "C", "explain": "Luật Phòng, chống tham nhũng 2018 quy định người có chức vụ, quyền hạn có nghĩa vụ kê khai tài sản, thu nhập trung thực; cơ quan, tổ chức, cá nhân có quyền tố cáo hành vi tham nhũng và được bảo vệ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "A là đối tượng mua bán trái phép chất ma túy, đã rủ B 15 tuổi tham gia vận chuyển ma túy thuê với tiền công cao. Khi bị phát hiện, cả hai bị bắt. Nhận định nào sau đây là đúng?", "options": ["A. A chỉ bị xử phạt vi phạm hành chính vì chưa trực tiếp cầm ma túy.", "B. A phạm tội mua bán trái phép chất ma túy với tình tiết lợi dụng người chưa thành niên; B 15 tuổi có thể phải chịu trách nhiệm hình sự về tội rất nghiêm trọng, đặc biệt nghiêm trọng trong danh mục luật định và được xem xét giảm nhẹ do chưa thành niên.", "C. B 15 tuổi không phải chịu trách nhiệm gì trong mọi trường hợp.", "D. Việc rủ trẻ em vận chuyển ma túy không làm tăng nặng trách nhiệm của A."], "answer": "B", "explain": "Điều 251 Bộ luật Hình sự 2015 quy định tội mua bán trái phép chất ma túy; lợi dụng người chưa thành niên là tình tiết tăng nặng. Điều 12 quy định người từ đủ 14 đến dưới 16 tuổi phải chịu trách nhiệm hình sự về tội rất nghiêm trọng, tội đặc biệt nghiêm trọng thuộc danh mục, trong đó có tội mua bán trái phép chất ma túy. Người chưa thành niên phạm tội được xem xét giảm nhẹ trách nhiệm hình sự.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Bạn N được bố mẹ cho 500 nghìn đồng tiền tiêu vặt mỗi tháng. Bạn N lập kế hoạch: 300 nghìn cho ăn sáng và đồ dùng học tập, 100 nghìn cho các sở thích cá nhân, 100 nghìn bỏ vào lợn đất tiết kiệm. Xét tính đúng, sai của các nhận định:", "statements": ["a) Việc lập kế hoạch chi tiêu của bạn N là cần thiết và hợp lý.", "b) Tiết kiệm là dành một phần thu nhập cho nhu cầu trong tương lai.", "c) Chi tiêu thường xuyên vượt quá thu nhập là cách chi tiêu hợp lý.", "d) Vay nặng lãi để tiêu dùng là cách quản lý tài chính khôn ngoan."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: lập kế hoạch chi tiêu giúp cân đối thu chi, ưu tiên nhu cầu thiết yếu và có khoản dự phòng. b) Đúng: tiết kiệm là dành một phần thu nhập không chi tiêu hiện tại cho tương lai. c) Sai: chi tiêu vượt quá thu nhập dẫn đến nợ nần, không hợp lý. d) Sai: vay nặng lãi để tiêu dùng gây hậu quả nghiêm trọng, vi phạm quy định về lãi suất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Trong buổi tuyên truyền phòng, chống ma túy, công an xã thông tin có một số thanh niên trong xã sử dụng trái phép chất ma túy và rủ rê học sinh tham gia. Xét tính đúng, sai của các nhận định:", "statements": ["a) Sử dụng trái phép chất ma túy là hành vi vi phạm pháp luật.", "b) Rủ rê, lôi kéo người khác sử dụng ma túy là hành vi vi phạm pháp luật.", "c) Học sinh phát hiện bạn dùng ma túy thì nên bao che để giữ tình bạn.", "d) Người nghiện ma túy có thể bị áp dụng biện pháp cai nghiện bắt buộc theo quy định."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: pháp luật nghiêm cấm sử dụng trái phép chất ma túy. b) Đúng: rủ rê, lôi kéo người khác sử dụng ma túy là vi phạm pháp luật, có thể bị truy cứu trách nhiệm hình sự. c) Sai: cần khuyên nhủ và báo cho gia đình, nhà trường, cơ quan chức năng; bao che là vi phạm. d) Đúng: Luật Phòng, chống ma túy 2021 quy định biện pháp cai nghiện bắt buộc.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Tình huống: Chị H phát hiện trưởng phòng nơi mình công tác nhận tiền của đối tác để ký duyệt hồ sơ không đủ điều kiện. Chị H làm đơn tố cáo gửi cơ quan thanh tra. Sau đó, chị H bị trưởng phòng gây khó dễ trong công việc. Xét tính đúng, sai của các nhận định:", "statements": ["a) Hành vi nhận tiền để ký duyệt hồ sơ trái quy định là hành vi tham nhũng.", "b) Người đưa tiền cho trưởng phòng không vi phạm pháp luật.", "c) Mọi cá nhân đều có quyền tố cáo hành vi tham nhũng đến cơ quan có thẩm quyền.", "d) Cán bộ, công chức có nghĩa vụ kê khai tài sản, thu nhập trung thực theo quy định."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: lợi dụng chức vụ, quyền hạn để vụ lợi là tham nhũng (Luật Phòng, chống tham nhũng 2018). b) Sai: đưa tiền cho người có chức vụ để được giải quyết công việc là hành vi đưa hối lộ, vi phạm pháp luật. c) Đúng: Luật Tố cáo 2018, mọi cá nhân có quyền tố cáo và được bảo vệ. d) Đúng: cán bộ, công chức có nghĩa vụ kê khai tài sản, thu nhập trung thực.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Tình huống: Bé G 10 tuổi bị người hàng xóm nhiều lần dụ dỗ, xâm hại. Gia đình phát hiện nhưng vì xấu hổ nên giấu kín, không trình báo. Xét tính đúng, sai của các nhận định:", "statements": ["a) Trẻ em có quyền được bảo vệ khỏi mọi hình thức xâm hại tình dục.", "b) Người xâm hại tình dục trẻ em có thể bị truy cứu trách nhiệm hình sự với hình phạt nghiêm khắc.", "c) Gia đình, nhà trường và xã hội có trách nhiệm bảo vệ trẻ em khỏi bị xâm hại.", "d) Khi trẻ em bị xâm hại, gia đình nên giấu kín, không trình báo để giữ thể diện."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Luật Trẻ em 2016, trẻ em có quyền được bảo vệ khỏi mọi hình thức xâm hại. b) Đúng: các tội xâm hại tình dục trẻ em (Điều 142 đến Điều 147 Bộ luật Hình sự 2015) có khung hình phạt nghiêm khắc. c) Đúng: bảo vệ trẻ em là trách nhiệm của gia đình, nhà trường, xã hội và Nhà nước. d) Sai: phải kịp thời trình báo cơ quan chức năng; giấu kín là tiếp tay cho tội phạm.", "points": 1}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Hội nhập kinh tế quốc tế được hiểu như thế nào?", "options": ["A. Là quá trình gắn kết nền kinh tế quốc gia với nền kinh tế thế giới thông qua hợp tác, liên kết kinh tế giữa các quốc gia.", "B. Là việc chỉ xuất khẩu mà không nhập khẩu.", "C. Là việc đóng cửa nền kinh tế, tự cung tự cấp.", "D. Là việc phụ thuộc hoàn toàn vào kinh tế nước ngoài."], "answer": "A", "explain": "Theo chương trình GDPT 2018, hội nhập kinh tế quốc tế là quá trình gắn kết nền kinh tế quốc gia với nền kinh tế khu vực và thế giới thông qua hợp tác, liên kết kinh tế.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tổ chức Thương mại Thế giới có tên viết tắt là gì và Việt Nam trở thành thành viên từ năm nào?", "options": ["A. WTO, Việt Nam trở thành thành viên từ năm 2007.", "B. ASEAN, Việt Nam trở thành thành viên từ năm 2007.", "C. WTO, Việt Nam trở thành thành viên từ năm 1995.", "D. APEC, Việt Nam trở thành thành viên từ năm 1995."], "answer": "A", "explain": "Tổ chức Thương mại Thế giới (WTO) là tổ chức thương mại đa phương lớn nhất thế giới; Việt Nam chính thức trở thành thành viên thứ 150 của WTO vào năm 2007.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiệp hội các quốc gia Đông Nam Á có tên viết tắt là gì và Việt Nam gia nhập từ năm nào?", "options": ["A. WTO, Việt Nam gia nhập từ năm 1995.", "B. ASEAN, Việt Nam gia nhập từ năm 2007.", "C. ASEAN, Việt Nam gia nhập từ năm 1995.", "D. EU, Việt Nam gia nhập từ năm 1995."], "answer": "C", "explain": "Hiệp hội các quốc gia Đông Nam Á (ASEAN) được thành lập năm 1967; Việt Nam chính thức gia nhập ASEAN vào năm 1995.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Sở hữu trí tuệ, sáng chế là gì?", "options": ["A. Là tác phẩm văn học, nghệ thuật do cá nhân sáng tạo.", "B. Là dấu hiệu phân biệt hàng hóa, dịch vụ.", "C. Là tên thương mại của doanh nghiệp.", "D. Là giải pháp kỹ thuật dưới dạng sản phẩm hoặc quy trình nhằm giải quyết một vấn đề xác định bằng việc ứng dụng các quy luật tự nhiên, có tính mới, trình độ sáng tạo và khả năng áp dụng công nghiệp."], "answer": "D", "explain": "Theo Luật Sở hữu trí tuệ, sáng chế là giải pháp kỹ thuật mới so với trình độ kỹ thuật trên thế giới, có trình độ sáng tạo, có khả năng áp dụng công nghiệp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Sở hữu trí tuệ, kiểu dáng công nghiệp là gì?", "options": ["A. Là giải pháp kỹ thuật mới trong sản xuất.", "B. Là hình dáng bên ngoài của sản phẩm được thể hiện bằng hình khối, đường nét, màu sắc hoặc sự kết hợp các yếu tố này, có tính mới và khả năng áp dụng công nghiệp.", "C. Là tác phẩm âm nhạc mới được sáng tác.", "D. Là bí mật kinh doanh của doanh nghiệp."], "answer": "B", "explain": "Theo Luật Sở hữu trí tuệ, kiểu dáng công nghiệp là hình dáng bên ngoài của sản phẩm được thể hiện bằng hình khối, đường nét, màu sắc hoặc sự kết hợp các yếu tố đó.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Sở hữu trí tuệ, quyền sở hữu công nghiệp đối với sáng chế, kiểu dáng công nghiệp, nhãn hiệu được xác lập trên cơ sở nào?", "options": ["A. Tự động phát sinh không cần đăng ký.", "B. Trên cơ sở quyết định cấp văn bằng bảo hộ của cơ quan nhà nước có thẩm quyền theo thủ tục đăng ký.", "C. Trên cơ sở công bố trên báo chí.", "D. Trên cơ sở thỏa thuận miệng giữa các bên."], "answer": "B", "explain": "Theo Luật Sở hữu trí tuệ, quyền sở hữu công nghiệp đối với sáng chế, kiểu dáng công nghiệp, nhãn hiệu được xác lập trên cơ sở quyết định cấp văn bằng bảo hộ của cơ quan nhà nước có thẩm quyền; riêng quyền tác giả phát sinh tự động từ khi tác phẩm được sáng tạo.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Luật Bảo vệ môi trường năm 2020, bảo vệ môi trường là trách nhiệm của ai?", "options": ["A. Chỉ là trách nhiệm của Bộ Tài nguyên và Môi trường.", "B. Là trách nhiệm của mọi cơ quan, tổ chức, cộng đồng dân cư, hộ gia đình và cá nhân.", "C. Chỉ là trách nhiệm của chính quyền địa phương.", "D. Chỉ là trách nhiệm của các doanh nghiệp."], "answer": "B", "explain": "Luật Bảo vệ môi trường 2020 quy định bảo vệ môi trường là trách nhiệm của mọi cơ quan, tổ chức, cộng đồng dân cư, hộ gia đình và cá nhân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phát triển bền vững được hiểu như thế nào?", "options": ["A. Là sự phát triển kinh tế bằng mọi giá, bất chấp môi trường.", "B. Là sự phát triển chỉ quan tâm đến lợi ích trước mắt.", "C. Là sự phát triển không cần quan tâm đến thế hệ tương lai.", "D. Là sự phát triển đáp ứng nhu cầu của hiện tại mà không làm tổn hại đến khả năng đáp ứng nhu cầu của các thế hệ tương lai."], "answer": "D", "explain": "Theo chương trình GDPT 2018, phát triển bền vững là sự phát triển đáp ứng nhu cầu của hiện tại mà không làm tổn hại đến khả năng đáp ứng nhu cầu của các thế hệ tương lai, hài hòa giữa tăng trưởng kinh tế, tiến bộ xã hội và bảo vệ môi trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quốc phòng được hiểu như thế nào?", "options": ["A. Không liên quan đến người dân.", "B. Chỉ là nhiệm vụ của quân đội.", "C. Chỉ được thực hiện khi có chiến tranh.", "D. Là công cuộc giữ nước bằng sức mạnh tổng hợp của toàn dân tộc, trong đó sức mạnh quân sự là đặc trưng, lực lượng vũ trang nhân dân làm nòng cốt."], "answer": "D", "explain": "Theo Luật Quốc phòng 2018, quốc phòng là công cuộc giữ nước bằng sức mạnh tổng hợp của toàn dân tộc, trong đó sức mạnh quân sự là đặc trưng, lực lượng vũ trang nhân dân làm nòng cốt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp năm 2013, bảo vệ Tổ quốc là nghĩa vụ như thế nào của công dân?", "options": ["A. Chỉ là nghĩa vụ của quân nhân chuyên nghiệp.", "B. Là nghĩa vụ thiêng liêng và quyền cao quý của công dân; công dân phải thực hiện nghĩa vụ quân sự và tham gia xây dựng nền quốc phòng toàn dân.", "C. Là việc tự nguyện, ai muốn thì làm.", "D. Chỉ áp dụng với nam giới trưởng thành."], "answer": "B", "explain": "Điều 44 Hiến pháp 2013: công dân có nghĩa vụ trung thành với Tổ quốc; bảo vệ Tổ quốc là nghĩa vụ thiêng liêng và quyền cao quý của công dân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Bộ luật Hình sự năm 2015, tội phản bội Tổ quốc được quy định như thế nào?", "options": ["A. Không phải là tội phạm.", "B. Chỉ bị xử phạt vi phạm hành chính.", "C. Là tội đặc biệt nghiêm trọng xâm phạm an ninh quốc gia, có khung hình phạt rất nghiêm khắc.", "D. Là tội ít nghiêm trọng."], "answer": "C", "explain": "Điều 108 Bộ luật Hình sự 2015 quy định tội phản bội Tổ quốc là tội đặc biệt nghiêm trọng xâm phạm an ninh quốc gia với khung hình phạt rất nghiêm khắc, thể hiện sự trừng trị nghiêm minh đối với hành vi phản bội Tổ quốc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "An ninh quốc gia được hiểu như thế nào?", "options": ["A. Chỉ là an toàn giao thông.", "B. Chỉ là an ninh mạng.", "C. Chỉ liên quan đến biên giới.", "D. Là sự ổn định, phát triển bền vững của chế độ xã hội chủ nghĩa và Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam, sự bất khả xâm phạm độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tổ quốc."], "answer": "D", "explain": "Theo Luật An ninh quốc gia 2004, an ninh quốc gia là sự ổn định, phát triển bền vững của chế độ xã hội chủ nghĩa và Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam, sự bất khả xâm phạm độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tổ quốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Doanh nghiệp X xuất khẩu gạo, tận dụng Hiệp định thương mại tự do Việt Nam - Liên minh châu Âu để hưởng thuế suất ưu đãi. Việc tham gia các hiệp định thương mại tự do mang lại cơ hội gì cho doanh nghiệp Việt Nam?", "options": ["A. Không mang lại lợi ích gì cho doanh nghiệp.", "B. Chỉ làm tăng cạnh tranh mà không có cơ hội.", "C. Doanh nghiệp phải đóng cửa vì không cạnh tranh nổi.", "D. Mở rộng thị trường tiêu thụ, được hưởng thuế suất ưu đãi, nâng cao năng lực cạnh tranh."], "answer": "D", "explain": "Hội nhập kinh tế quốc tế, tham gia các hiệp định thương mại tự do giúp doanh nghiệp mở rộng thị trường, được hưởng ưu đãi thuế quan, tiếp cận công nghệ và nâng cao năng lực cạnh tranh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Doanh nghiệp X xuất khẩu gạo, tận dụng Hiệp định thương mại tự do Việt Nam - Liên minh châu Âu để hưởng thuế suất ưu đãi. Để xuất khẩu thành công vào thị trường khó tính, doanh nghiệp X cần đáp ứng yêu cầu gì?", "options": ["A. Chỉ cần quảng cáo nhiều là bán được hàng.", "B. Đáp ứng các tiêu chuẩn về chất lượng, an toàn thực phẩm, quy tắc xuất xứ và các rào cản kỹ thuật của thị trường nhập khẩu.", "C. Không cần đáp ứng tiêu chuẩn gì.", "D. Chỉ cần giá rẻ là đủ, không cần quan tâm chất lượng."], "answer": "B", "explain": "Khi hội nhập, doanh nghiệp muốn xuất khẩu vào các thị trường khó tính phải đáp ứng các tiêu chuẩn về chất lượng, an toàn thực phẩm, quy tắc xuất xứ hàng hóa và các biện pháp kỹ thuật của nước nhập khẩu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kỹ sư N đã sáng chế ra loại máy gặt đập liên hợp phù hợp với đồng ruộng Việt Nam, tiết kiệm nhiên liệu vượt trội so với các máy hiện có. Để được độc quyền khai thác sáng chế của mình, kỹ sư N cần làm gì?", "options": ["A. Chỉ cần giữ bí mật, không cần đăng ký.", "B. Chỉ cần công bố trên mạng xã hội là được bảo hộ.", "C. Nộp đơn đăng ký bảo hộ sáng chế tại cơ quan nhà nước có thẩm quyền và được cấp văn bằng bảo hộ.", "D. Không cần làm gì, pháp luật tự động bảo hộ."], "answer": "C", "explain": "Theo Luật Sở hữu trí tuệ, quyền sở hữu công nghiệp đối với sáng chế được xác lập trên cơ sở quyết định cấp văn bằng bảo hộ theo thủ tục đăng ký tại cơ quan nhà nước có thẩm quyền.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhà máy Y xả khí thải vượt quy chuẩn kỹ thuật về môi trường ra không khí, gây ảnh hưởng đến sức khỏe người dân xung quanh. Hành vi này bị xử lý như thế nào?", "options": ["A. Chỉ bị nhắc nhở.", "B. Được phép vì phục vụ phát triển kinh tế.", "C. Không bị xử lý vì nhà máy đã nộp thuế.", "D. Bị xử phạt vi phạm hành chính về bảo vệ môi trường; nếu gây hậu quả nghiêm trọng có thể bị truy cứu trách nhiệm hình sự."], "answer": "D", "explain": "Xả khí thải vượt quy chuẩn là hành vi vi phạm pháp luật về bảo vệ môi trường, bị xử phạt vi phạm hành chính theo Nghị định 45/2022/NĐ-CP; gây hậu quả nghiêm trọng có thể bị truy cứu trách nhiệm hình sự về tội gây ô nhiễm môi trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Người dân phát hiện một đối tượng thường xuyên đăng tài liệu xuyên tạc, kêu gọi chống phá Nhà nước lên mạng xã hội. Theo quy định của pháp luật, công dân có trách nhiệm gì?", "options": ["A. Ủng hộ đối tượng để thể hiện tự do ngôn luận.", "B. Có trách nhiệm tố giác, đấu tranh với hành vi xâm phạm an ninh quốc gia; không chia sẻ, phát tán tài liệu xấu độc.", "C. Chia sẻ rộng rãi để mọi người cùng biết.", "D. Im lặng vì không liên quan đến mình."], "answer": "B", "explain": "Bảo vệ an ninh quốc gia là sự nghiệp của toàn dân. Công dân có nghĩa vụ tố giác hành vi xâm phạm an ninh quốc gia; việc chia sẻ, phát tán tài liệu chống phá Nhà nước là vi phạm pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin: Người dân phát hiện một đối tượng thường xuyên đăng tài liệu xuyên tạc, kêu gọi chống phá Nhà nước lên mạng xã hội. Hành vi tuyên truyền chống Nhà nước bị xử lý như thế nào?", "options": ["A. Được pháp luật bảo vệ.", "B. Chỉ bị nhắc nhở.", "C. Không bị xử lý vì là tự do ngôn luận.", "D. Bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự về tội làm, tàng trữ, phát tán hoặc tuyên truyền thông tin, tài liệu nhằm chống Nhà nước."], "answer": "D", "explain": "Điều 117 Bộ luật Hình sự 2015 quy định tội làm, tàng trữ, phát tán hoặc tuyên truyền thông tin, tài liệu, vật phẩm nhằm chống Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam. Tự do ngôn luận phải trong khuôn khổ pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một số người dân đốt rừng làm nương rẫy gây cháy rừng trên diện rộng, thiêu rụi hàng chục héc ta rừng phòng hộ. Hành vi này bị xử lý như thế nào?", "options": ["A. Được khuyến khích để mở rộng đất sản xuất.", "B. Bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự về tội hủy hoại rừng, tội vi phạm quy định về phòng cháy, chữa cháy tùy tính chất, mức độ.", "C. Không bị xử lý vì là tập quán canh tác.", "D. Chỉ phải trồng lại rừng là xong."], "answer": "B", "explain": "Đốt rừng gây cháy rừng là hành vi vi phạm pháp luật về bảo vệ rừng, phòng cháy chữa cháy, bị xử phạt vi phạm hành chính và có thể bị truy cứu trách nhiệm hình sự về tội hủy hoại rừng (Điều 243) hoặc tội vi phạm quy định về phòng cháy, chữa cháy (Điều 313 Bộ luật Hình sự 2015).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Anh T sau nhiều năm du học đã về nước khởi nghiệp trong lĩnh vực công nghệ thông tin, được hưởng nhiều chính sách ưu đãi của Nhà nước. Điều này thể hiện nội dung nào trong chính sách phát triển khoa học, công nghệ?", "options": ["A. Khởi nghiệp công nghệ không được pháp luật bảo hộ.", "B. Nhà nước khuyến khích, tạo điều kiện cho tổ chức, cá nhân đầu tư nghiên cứu, phát triển khoa học và công nghệ; trọng dụng nhân tài.", "C. Chỉ doanh nghiệp nhà nước mới được làm công nghệ.", "D. Nhà nước cấm người Việt ở nước ngoài về nước khởi nghiệp."], "answer": "B", "explain": "Điều 62 Hiến pháp 2013: phát triển khoa học và công nghệ là quốc sách hàng đầu; Nhà nước ưu tiên đầu tư, khuyến khích tổ chức, cá nhân đầu tư nghiên cứu khoa học, phát triển công nghệ và trọng dụng nhân tài.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tập đoàn nước ngoài F đầu tư xây dựng nhà máy tại Việt Nam. Trong quá trình hoạt động, tập đoàn F phải tuân thủ quy định nào?", "options": ["A. Được miễn trừ mọi nghĩa vụ về thuế và môi trường.", "B. Được áp dụng pháp luật của nước mình, không cần tuân thủ pháp luật Việt Nam.", "C. Phải tuân thủ pháp luật Việt Nam; được Nhà nước bảo hộ quyền sở hữu tài sản, vốn đầu tư và các quyền, lợi ích hợp pháp khác theo quy định của pháp luật về đầu tư.", "D. Được tự ý chuyển giá, trốn thuế."], "answer": "C", "explain": "Luật Đầu tư 2020: nhà đầu tư nước ngoài hoạt động tại Việt Nam phải tuân thủ pháp luật Việt Nam; Nhà nước bảo hộ quyền sở hữu tài sản, vốn đầu tư, thu nhập và các quyền, lợi ích hợp pháp khác của nhà đầu tư.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Công ty G đã đăng ký bảo hộ kiểu dáng công nghiệp cho mẫu bình giữ nhiệt độc đáo của mình. Công ty H sao chép y nguyên kiểu dáng này để sản xuất hàng loạt bán ra thị trường. Hành vi của công ty H như thế nào?", "options": ["A. Không vi phạm vì kiểu dáng là để mọi người cùng dùng.", "B. Xâm phạm quyền sở hữu công nghiệp của công ty G; bị xử phạt vi phạm hành chính, buộc chấm dứt hành vi và bồi thường thiệt hại.", "C. Chỉ vi phạm khi công ty G phát hiện.", "D. Là hành vi cạnh tranh lành mạnh."], "answer": "B", "explain": "Theo Luật Sở hữu trí tuệ, chủ sở hữu kiểu dáng công nghiệp đã được bảo hộ có quyền ngăn cấm người khác sử dụng kiểu dáng trùng hoặc tương tự gây nhầm lẫn. Hành vi sao chép là xâm phạm quyền sở hữu công nghiệp, bị xử phạt vi phạm hành chính và phải bồi thường thiệt hại.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một dự án khu công nghiệp có nguy cơ tác động xấu đến môi trường. Theo Luật Bảo vệ môi trường năm 2020, chủ đầu tư dự án phải thực hiện nghĩa vụ nào trước khi triển khai?", "options": ["A. Chỉ cần cam kết miệng về bảo vệ môi trường.", "B. Không cần đánh giá tác động môi trường, cứ triển khai trước.", "C. Thực hiện đánh giá tác động môi trường sau khi dự án đi vào hoạt động.", "D. Thực hiện đánh giá tác động môi trường và chỉ được triển khai sau khi báo cáo đánh giá tác động môi trường được phê duyệt."], "answer": "D", "explain": "Luật Bảo vệ môi trường 2020 quy định dự án đầu tư có nguy cơ tác động xấu đến môi trường phải thực hiện đánh giá tác động môi trường; báo cáo đánh giá tác động môi trường phải được phê duyệt trước khi triển khai dự án.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Doanh nghiệp có vốn đầu tư nước ngoài Z trong quá trình hoạt động đã xả chất thải nguy hại ra môi trường gây ô nhiễm nghiêm trọng, đồng thời hối lộ cán bộ môi trường địa phương để bỏ qua vi phạm. Nhận định nào sau đây là đúng?", "options": ["A. Chỉ xử phạt hành chính là đủ, không cần truy cứu hình sự.", "B. Hối lộ cán bộ là việc bình thường trong kinh doanh.", "C. Doanh nghiệp Z và người có trách nhiệm có thể bị xử phạt vi phạm hành chính, truy cứu trách nhiệm hình sự về tội gây ô nhiễm môi trường; cán bộ nhận hối lộ phạm tội nhận hối lộ; người đưa hối lộ phạm tội đưa hối lộ.", "D. Doanh nghiệp nước ngoài không bị pháp luật Việt Nam xử lý."], "answer": "C", "explain": "Mọi tổ chức, cá nhân hoạt động tại Việt Nam đều phải tuân thủ pháp luật Việt Nam. Gây ô nhiễm môi trường nghiêm trọng có thể bị truy cứu trách nhiệm hình sự (Điều 235 Bộ luật Hình sự 2015); nhận hối lộ là tội phạm (Điều 354), đưa hối lộ là tội phạm (Điều 364).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Trong giờ học Giáo dục kinh tế và pháp luật, cô giáo tổ chức thảo luận về tác động của hội nhập kinh tế quốc tế đối với Việt Nam. Xét tính đúng, sai của các nhận định:", "statements": ["a) Hội nhập kinh tế quốc tế mang lại cơ hội mở rộng thị trường, thu hút đầu tư, tiếp cận khoa học công nghệ.", "b) Hội nhập kinh tế quốc tế chỉ mang lại lợi ích, không đặt ra thách thức nào.", "c) Khi hội nhập, doanh nghiệp Việt Nam cần nâng cao năng lực cạnh tranh để tồn tại và phát triển.", "d) Hội nhập có nghĩa là mở cửa hoàn toàn, Nhà nước không cần quản lý nền kinh tế."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: hội nhập tạo cơ hội mở rộng thị trường, thu hút vốn đầu tư, chuyển giao công nghệ. b) Sai: hội nhập vừa mang lại cơ hội vừa đặt ra thách thức về cạnh tranh, an ninh kinh tế. c) Đúng: cạnh tranh gay gắt đòi hỏi doanh nghiệp nâng cao năng lực cạnh tranh. d) Sai: nền kinh tế thị trường định hướng xã hội chủ nghĩa luôn có sự quản lý của Nhà nước.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Anh S là nhà thiết kế đã đăng ký bảo hộ kiểu dáng công nghiệp cho mẫu đèn trang trí của mình. Một cơ sở sản xuất đã sao chép mẫu đèn này để bán. Xét tính đúng, sai của các nhận định:", "statements": ["a) Kiểu dáng công nghiệp đã đăng ký được pháp luật bảo hộ quyền sở hữu công nghiệp.", "b) Quyền tác giả đối với tác phẩm phát sinh từ khi tác phẩm được sáng tạo mà không cần đăng ký.", "c) Mọi người đều được tự do sao chép kiểu dáng công nghiệp đã được bảo hộ.", "d) Hành vi xâm phạm quyền sở hữu trí tuệ có thể bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: kiểu dáng công nghiệp được bảo hộ trên cơ sở văn bằng bảo hộ. b) Đúng: quyền tác giả tự động phát sinh từ khi tác phẩm được định hình. c) Sai: sao chép kiểu dáng đã được bảo hộ là xâm phạm quyền sở hữu công nghiệp. d) Đúng: xâm phạm quyền sở hữu trí tuệ bị xử phạt vi phạm hành chính và có thể bị truy cứu trách nhiệm hình sự.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Tình huống: Một dự án xây dựng nhà máy giấy có nguy cơ gây ô nhiễm nguồn nước sông. Chủ đầu tư chưa thực hiện đánh giá tác động môi trường nhưng đã khởi công xây dựng. Xét tính đúng, sai của các nhận định:", "statements": ["a) Dự án có nguy cơ tác động xấu đến môi trường phải thực hiện đánh giá tác động môi trường.", "b) Đánh giá tác động môi trường được thực hiện sau khi dự án đi vào hoạt động cũng được.", "c) Chủ đầu tư phải thực hiện các biện pháp bảo vệ môi trường theo báo cáo đánh giá tác động môi trường đã được phê duyệt.", "d) Khởi công khi chưa thực hiện đánh giá tác động môi trường thì bị xử phạt vi phạm hành chính."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: Luật Bảo vệ môi trường 2020 quy định dự án có nguy cơ tác động xấu đến môi trường phải thực hiện đánh giá tác động môi trường. b) Sai: đánh giá tác động môi trường phải được thực hiện và phê duyệt trước khi triển khai dự án. c) Đúng: chủ dự án phải thực hiện đúng các biện pháp bảo vệ môi trường đã cam kết. d) Đúng: vi phạm bị xử phạt vi phạm hành chính theo Nghị định 45/2022/NĐ-CP.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Tình huống: Một đối tượng lập nhiều tài khoản mạng xã hội đăng tải tài liệu xuyên tạc lịch sử, kêu gọi tụ tập đông người gây rối an ninh trật tự vào dịp lễ lớn. Một số người đã chia sẻ các bài viết này. Xét tính đúng, sai của các nhận định:", "statements": ["a) Bảo vệ an ninh quốc gia là sự nghiệp của toàn dân, là trách nhiệm của mọi công dân.", "b) Công dân có nghĩa vụ tố giác hành vi xâm phạm an ninh quốc gia đến cơ quan chức năng.", "c) Hành vi tuyên truyền chống Nhà nước có thể bị truy cứu trách nhiệm hình sự.", "d) Chia sẻ tài liệu xuyên tạc, chống phá Nhà nước trên mạng xã hội là vô hại, không vi phạm pháp luật."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: bảo vệ an ninh quốc gia, giữ gìn trật tự an toàn xã hội là sự nghiệp của toàn dân. b) Đúng: công dân có nghĩa vụ tố giác hành vi xâm phạm an ninh quốc gia. c) Đúng: Điều 117 Bộ luật Hình sự 2015. d) Sai: chia sẻ, phát tán tài liệu chống phá Nhà nước là hành vi vi phạm pháp luật, có thể bị xử phạt vi phạm hành chính hoặc truy cứu trách nhiệm hình sự.", "points": 1}]}]}</script>
