<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Lời kêu gọi toàn quốc kháng chiến của Chủ tịch Hồ Chí Minh được phát đi vào ngày nào?", "options": ["A. Ngày 19/12/1946.", "B. Ngày 6/3/1946.", "C. Ngày 2/9/1945.", "D. Ngày 20/7/1954."], "answer": "A", "explain": "Ngày 19/12/1946, Chủ tịch Hồ Chí Minh ra Lời kêu gọi toàn quốc kháng chiến (“Thà hy sinh tất cả, chứ nhất định không chịu mất nước, nhất định không chịu làm nô lệ”), hiệu triệu toàn dân đứng lên chống thực dân Pháp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đường lối kháng chiến chống thực dân Pháp của Đảng Cộng sản Đông Dương được thể hiện trong Chỉ thị “Toàn dân kháng chiến” (12/12/1946) là gì?", "options": ["A. Kháng chiến thần tốc, táo bạo.", "B. Kháng chiến toàn dân, toàn diện, trường kỳ, tự lực cánh sinh.", "C. Kháng chiến du kích cục bộ.", "D. Kháng chiến bằng con đường ngoại giao."], "answer": "B", "explain": "Đường lối kháng chiến chống Pháp là cuộc chiến tranh nhân dân: toàn dân (mọi người dân đều tham gia), toàn diện (quân sự, chính trị, kinh tế, văn hóa, ngoại giao), trường kỳ (lâu dài) và tự lực cánh sinh (dựa vào sức mình là chính).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong chiến dịch Việt Bắc thu – đông 1947, thực dân Pháp mở cuộc tiến công lên Việt Bắc nhằm mục đích gì?", "options": ["A. Giải phóng thủ đô Hà Nội.", "B. Rút quân về nước.", "C. Tiêu diệt cơ quan đầu não kháng chiến và bộ đội chủ lực của ta, nhanh chóng kết thúc chiến tranh.", "D. Đàm phán hòa bình với ta."], "answer": "C", "explain": "Tháng 10/1947, Pháp huy động 12.000 quân mở cuộc tiến công lên Việt Bắc hòng tiêu diệt cơ quan đầu não kháng chiến, phá tan căn cứ địa, kết thúc nhanh chiến tranh. Ta đã bẻ gãy cuộc tiến công này, bảo vệ vững chắc căn cứ địa Việt Bắc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiến dịch Biên giới (1950) diễn ra trong thời gian nào?", "options": ["A. Từ tháng 10 đến tháng 12/1947.", "B. Từ tháng 3 đến tháng 5/1954.", "C. Từ tháng 12/1946 đến tháng 2/1947.", "D. Từ ngày 16/9 đến ngày 14/10/1950."], "answer": "D", "explain": "Chiến dịch Biên giới diễn ra từ ngày 16/9 đến 14/10/1950, mở màn bằng trận Đông Khê. Đây là chiến dịch tiến công lớn đầu tiên do quân ta chủ động mở, giành thế chủ động trên chiến trường chính Bắc Bộ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mặt trận Dân tộc Giải phóng miền Nam Việt Nam được thành lập vào ngày nào?", "options": ["A. Ngày 17/1/1960.", "B. Ngày 20/12/1960.", "C. Ngày 3/2/1930.", "D. Ngày 19/5/1941."], "answer": "B", "explain": "Ngày 20/12/1960, Mặt trận Dân tộc Giải phóng miền Nam Việt Nam ra đời, tập hợp mọi lực lượng yêu nước miền Nam đấu tranh chống Mỹ và chính quyền Sài Gòn, giương cao ngọn cờ độc lập dân tộc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Ấp chiến lược” là thủ đoạn thâm độc thuộc chiến lược chiến tranh nào của Mỹ ở miền Nam Việt Nam?", "options": ["A. Chiến tranh cục bộ.", "B. Việt Nam hóa chiến tranh.", "C. Chiến tranh đặc biệt.", "D. Chiến tranh phá hoại."], "answer": "C", "explain": "Trong chiến lược “Chiến tranh đặc biệt” (1961–1965), Mỹ và chính quyền Sài Gòn thực hiện dồn dân lập “ấp chiến lược” hòng tách dân khỏi cách mạng, kiểm soát nông thôn miền Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cuộc Tổng tiến công và nổi dậy Tết Mậu Thân (1968) mở màn vào thời gian nào?", "options": ["A. Đêm 19 rạng ngày 20/12/1946.", "B. Ngày 7/5/1954.", "C. Ngày 30/4/1975.", "D. Đêm 30 rạng ngày 31/1/1968."], "answer": "D", "explain": "Đêm 30 rạng ngày 31/1/1968 (đêm giao thừa Tết Mậu Thân), quân dân ta đồng loạt tiến công vào các đô thị miền Nam, mở màn cuộc Tổng tiến công và nổi dậy Xuân Mậu Thân 1968, giáng đòn bất ngờ vào Mỹ và chính quyền Sài Gòn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cuộc đàm phán giữa Việt Nam và Hoa Kỳ tại Paris để bàn về chấm dứt chiến tranh kéo dài bao lâu?", "options": ["A. 4 năm 8 tháng (từ tháng 5/1968 đến tháng 1/1973).", "B. 1 năm.", "C. 2 năm.", "D. 10 năm."], "answer": "A", "explain": "Hội nghị Paris họp phiên đầu tiên ngày 13/5/1968 và kéo dài 4 năm 8 tháng với hơn 200 phiên họp công khai cùng nhiều cuộc gặp riêng, kết thúc bằng việc ký kết Hiệp định Paris ngày 27/1/1973.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiến dịch mở màn cho cuộc Tổng tiến công và nổi dậy mùa Xuân 1975 là chiến dịch nào?", "options": ["A. Chiến dịch Huế – Đà Nẵng.", "B. Chiến dịch Tây Nguyên.", "C. Chiến dịch Hồ Chí Minh.", "D. Chiến dịch Điện Biên Phủ."], "answer": "B", "explain": "Chiến dịch Tây Nguyên (từ 4/3 đến 24/3/1975, mở màn bằng trận Buôn Ma Thuột ngày 10/3) là chiến dịch mở màn, giành thắng lợi lớn, chuyển cuộc kháng chiến sang giai đoạn Tổng tiến công chiến lược trên toàn miền Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong chiến dịch Huế – Đà Nẵng (tháng 3/1975), thành phố Đà Nẵng được giải phóng vào ngày nào?", "options": ["A. Ngày 25/3/1975.", "B. Ngày 10/3/1975.", "C. Ngày 29/3/1975.", "D. Ngày 30/4/1975."], "answer": "C", "explain": "Sau khi Huế được giải phóng (25/3/1975), quân ta tiến công Đà Nẵng — căn cứ quân sự liên hợp lớn nhất của địch ở miền Trung, giải phóng thành phố ngày 29/3/1975.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tháng 6/1919, Nguyễn Ái Quốc đã có hoạt động nào gây tiếng vang lớn?", "options": ["A. Gửi Bản yêu sách của nhân dân An Nam đến Hội nghị Versailles.", "B. Thành lập Đảng Cộng sản Việt Nam.", "C. Ra đi tìm đường cứu nước.", "D. Đọc bản Tuyên ngôn độc lập."], "answer": "A", "explain": "Tháng 6/1919, Nguyễn Ái Quốc thay mặt những người Việt Nam yêu nước tại Pháp gửi Bản yêu sách của nhân dân An Nam đến Hội nghị Versailles, đòi quyền tự do, dân chủ cho nhân dân Việt Nam, gây tiếng vang lớn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cương lĩnh chính trị đầu tiên của Đảng Cộng sản Việt Nam (tháng 2/1930) xác định nhiệm vụ chiến lược của cách mạng Việt Nam là gì?", "options": ["A. Đánh đổ đế quốc Pháp và phong kiến tay sai, làm cho Việt Nam hoàn toàn độc lập.", "B. Cải cách ruộng đất ngay lập tức.", "C. Xây dựng chủ nghĩa xã hội.", "D. Liên minh với giai cấp tư sản mại bản."], "answer": "B", "explain": "Cương lĩnh chính trị đầu tiên (do Nguyễn Ái Quốc soạn thảo, thông qua tại Hội nghị thành lập Đảng 2/1930) xác định: cách mạng Việt Nam phải trải qua hai giai đoạn — cách mạng tư sản dân quyền và cách mạng xã hội chủ nghĩa; nhiệm vụ trước mắt là đánh đổ đế quốc và phong kiến, giành độc lập dân tộc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa quan trọng của chiến thắng Việt Bắc thu – đông (1947) là gì?", "options": ["A. Kết thúc hoàn toàn cuộc kháng chiến chống Pháp.", "B. Bẻ gãy cuộc tiến công quy mô lớn của Pháp, bảo vệ vững chắc căn cứ địa Việt Bắc và cơ quan đầu não kháng chiến.", "C. Buộc Pháp phải ký Hiệp định Genève.", "D. Giải phóng hoàn toàn vùng Tây Bắc."], "answer": "C", "explain": "Chiến thắng Việt Bắc (1947) bẻ gãy cuộc tiến công lớn của 12.000 quân Pháp, bảo vệ an toàn căn cứ địa và cơ quan đầu não, chứng tỏ đường lối kháng chiến đúng đắn, cổ vũ tinh thần toàn dân kháng chiến.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thắng lợi của chiến dịch Biên giới (1950) có ý nghĩa chiến lược nào?", "options": ["A. Kết thúc chiến tranh ở Đông Dương.", "B. Buộc Pháp phải rút hết quân về nước.", "C. Mở ra bước ngoặt của cuộc kháng chiến.", "D. Ta giành được thế chủ động trên chiến trường chính Bắc Bộ, mở rộng quan hệ giao lưu quốc tế."], "answer": "D", "explain": "Sau chiến dịch Biên giới, ta giành thế chủ động trên chiến trường chính; hành lang biên giới Việt – Trung được khai thông, tạo điều kiện mở rộng quan hệ đối ngoại, tranh thủ sự viện trợ của các nước xã hội chủ nghĩa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao đế quốc Mỹ chuyển từ chiến lược “Chiến tranh đặc biệt” sang “Chiến tranh cục bộ” ở miền Nam Việt Nam (1965)?", "options": ["A. Vì “Chiến tranh đặc biệt” bị phá sản trước phong trào đấu tranh của nhân dân miền Nam, buộc Mỹ phải trực tiếp đưa quân viễn chinh vào tham chiến.", "B. Vì “Chiến tranh đặc biệt” đã hoàn toàn thắng lợi.", "C. Vì Mỹ muốn rút quân về nước.", "D. Vì chính quyền Sài Gòn yêu cầu Mỹ rút cố vấn."], "answer": "A", "explain": "Trước những thất bại liên tiếp (Bình Giã 12/1964, Ba Gia 5/1965...) và sự phá sản của “Chiến tranh đặc biệt”, từ giữa 1965 Mỹ chuyển sang “Chiến tranh cục bộ”, trực tiếp đưa quân viễn chinh vào miền Nam, đẩy mạnh chiến tranh xâm lược.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa lớn nhất của cuộc Tổng tiến công và nổi dậy Tết Mậu Thân (1968) là gì?", "options": ["A. Giải phóng hoàn toàn miền Nam.", "B. Giáng đòn mạnh vào ý chí xâm lược của Mỹ, buộc Mỹ phải xuống thang chiến tranh, ngồi vào bàn đàm phán với ta tại Paris.", "C. Kết thúc chiến lược Việt Nam hóa chiến tranh.", "D. Buộc Pháp phải rút quân khỏi Đông Dương."], "answer": "B", "explain": "Mậu Thân 1968 giáng đòn bất ngờ, làm lung lay ý chí xâm lược của Mỹ, buộc Tổng thống Johnson phải tuyên bố ngừng ném bom miền Bắc, chấp nhận đàm phán — đánh dấu bước ngoặt, Mỹ chuyển sang chiến lược “Việt Nam hóa chiến tranh”.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Về mặt quân sự, Hiệp định Paris (1973) quy định điều khoản quan trọng nào?", "options": ["A. Quân đội ta phải rút khỏi miền Nam.", "B. Việt Nam phải chấp nhận chia cắt lâu dài.", "C. Chính quyền Sài Gòn được mở rộng vùng kiểm soát.", "D. Hoa Kỳ rút hết quân đội và cố vấn quân sự về nước; các bên để nguyên vị trí đóng quân, ta được giữ vững vùng giải phóng."], "answer": "D", "explain": "Hiệp định Paris quy định: Hoa Kỳ và quân đội các nước ngoài rút hết khỏi miền Nam trong 60 ngày; các bên ngừng bắn tại chỗ, giữ nguyên vị trí; nhân dân miền Nam tự quyết định tương lai chính trị của mình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thắng lợi của chiến dịch Tây Nguyên (3/1975) có ý nghĩa chiến lược nào?", "options": ["A. Mở ra thời cơ chiến lược mới, chuyển cuộc tiến công chiến lược sang tổng tiến công chiến lược trên toàn chiến trường miền Nam.", "B. Kết thúc cuộc kháng chiến chống Mỹ.", "C. Buộc Mỹ phải ký Hiệp định Paris.", "D. Giải phóng thủ đô Sài Gòn."], "answer": "A", "explain": "Thắng lợi Tây Nguyên (giải phóng Buôn Ma Thuột 10/3/1975, làm tan rã quân đoàn 2 Ngụy) tạo ra thời cơ chiến lược: Bộ Chính trị quyết định chuyển từ tiến công chiến lược sang Tổng tiến công và nổi dậy trên toàn miền Nam, giải phóng miền Nam trước mùa mưa 1975.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nội dung cơ bản của đường lối đổi mới kinh tế ở Việt Nam (từ 1986) là gì?", "options": ["A. Duy trì cơ chế tập trung quan liêu bao cấp.", "B. Xóa bỏ cơ chế tập trung quan liêu bao cấp, hình thành cơ chế thị trường; phát triển nền kinh tế nhiều thành phần theo định hướng xã hội chủ nghĩa.", "C. Tư nhân hóa toàn bộ nền kinh tế.", "D. Đóng cửa, tự cấp tự túc."], "answer": "B", "explain": "Đổi mới kinh tế: xóa bỏ tập trung quan liêu bao cấp, chuyển sang hạch toán kinh doanh xã hội chủ nghĩa; phát triển kinh tế hàng hóa nhiều thành phần, vận hành theo cơ chế thị trường có sự quản lý của Nhà nước, theo định hướng xã hội chủ nghĩa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa lịch sử của việc thành lập Đảng Cộng sản Việt Nam (3/2/1930) là gì?", "options": ["A. Chấm dứt ách đô hộ của thực dân Pháp.", "B. Mở ra thời đại mới cho cách mạng Việt Nam.", "C. Chấm dứt sự khủng hoảng về đường lối và giai cấp lãnh đạo của cách mạng Việt Nam, khẳng định vai trò lãnh đạo của giai cấp công nhân thông qua Đảng Cộng sản.", "D. Thống nhất đất nước về mặt nhà nước."], "answer": "C", "explain": "Sự ra đời của Đảng Cộng sản Việt Nam chấm dứt tình trạng khủng hoảng về đường lối cứu nước (từ cuối thế kỷ XIX), khẳng định giai cấp công nhân với đội tiên phong là Đảng Cộng sản là lực lượng lãnh đạo cách mạng Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mặt trận Việt Minh (thành lập 19/5/1941) là tổ chức như thế nào?", "options": ["A. Tổ chức chính trị của giai cấp tư sản.", "B. Đảng chính trị hoạt động hợp pháp dưới chế độ thực dân.", "C. Tổ chức quân sự của thực dân Pháp.", "D. Mặt trận dân tộc thống nhất, tập hợp mọi lực lượng yêu nước Việt Nam để đánh đuổi Pháp – Nhật, giành độc lập dân tộc."], "answer": "D", "explain": "Mặt trận Việt Minh (Việt Nam Độc lập Đồng minh) do Hội nghị Trung ương 8 (5/1941) thành lập, là mặt trận dân tộc thống nhất rộng rãi, đoàn kết mọi giai cấp, tầng lớp yêu nước, giương cao ngọn cờ giải phóng dân tộc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mục đích thành lập ASEAN được nêu trong Tuyên bố Bangkok (1967) là gì?", "options": ["A. Thúc đẩy hợp tác kinh tế, văn hóa, xã hội; giữ gìn hòa bình, ổn định và phát triển thịnh vượng ở khu vực Đông Nam Á.", "B. Xây dựng liên minh quân sự chống lại các nước lớn.", "C. Can thiệp vào công việc nội bộ của nhau.", "D. Đóng cửa khu vực với bên ngoài."], "answer": "A", "explain": "Tuyên bố Bangkok (8/8/1967) nêu mục đích ASEAN: tăng cường hợp tác kinh tế, xã hội, văn hóa; thúc đẩy hòa bình, ổn định khu vực trên cơ sở tôn trọng công lý và luật pháp quốc tế, tuân thủ nguyên tắc không can thiệp vào công việc nội bộ của nhau.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhận định nào sau đây đúng về vai trò của hậu phương miền Bắc đối với tiền tuyến miền Nam trong kháng chiến chống Mỹ (1965–1975)?", "options": ["A. Miền Bắc chỉ lo sản xuất, không chi viện cho miền Nam.", "B. Miền Bắc hoàn toàn tách khỏi cuộc chiến tranh ở miền Nam.", "C. Miền Bắc vừa chiến đấu chống chiến tranh phá hoại, vừa sản xuất và chi viện sức người, sức của cho tiền tuyến miền Nam, thực hiện nghĩa vụ của hậu phương lớn đối với tiền tuyến lớn.", "D. Miền Bắc đã đầu hàng trước các cuộc ném bom của Mỹ."], "answer": "C", "explain": "Trong kháng chiến chống Mỹ, miền Bắc thực hiện đồng thời hai nhiệm vụ chiến lược: xây dựng chủ nghĩa xã hội, chiến đấu chống chiến tranh phá hoại và làm hậu phương lớn, hết lòng chi viện cho tiền tuyến lớn miền Nam — đây là nhân tố quyết định thắng lợi chung của cả nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao thắng lợi của cuộc Tổng tiến công và nổi dậy mùa Xuân 1975 được đánh giá là có tầm vóc thời đại?", "options": ["A. Vì đây là chiến thắng quân sự lớn nhất trong lịch sử Việt Nam.", "B. Vì thắng lợi này chỉ có ý nghĩa đối với Việt Nam.", "C. Vì đây là cuộc chiến tranh duy nhất ở châu Á.", "D. Vì thắng lợi đã kết thúc 21 năm kháng chiến chống Mỹ, hoàn thành cách mạng dân tộc dân chủ nhân dân trong cả nước, mở ra kỷ nguyên độc lập, thống nhất và đi lên chủ nghĩa xã hội; cổ vũ mạnh mẽ phong trào đấu tranh vì hòa bình, độc lập dân tộc trên thế giới."], "answer": "D", "explain": "Đại thắng mùa Xuân 1975 kết thúc thắng lợi cuộc kháng chiến chống Mỹ cứu nước, hoàn thành cách mạng dân tộc dân chủ nhân dân trong cả nước, mở ra kỷ nguyên mới; đồng thời cổ vũ phong trào giải phóng dân tộc, vì hòa bình và tiến bộ trên thế giới, được đánh giá là sự kiện có tầm vóc quốc tế và tính thời đại sâu sắc.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Về Lời kêu gọi toàn quốc kháng chiến (19/12/1946), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Đêm 19/12/1946, theo Lời kêu gọi của Chủ tịch Hồ Chí Minh, quân dân cả nước nhất tề đứng lên, cuộc kháng chiến toàn quốc chống thực dân Pháp chính thức bùng nổ.", "b) Đường lối kháng chiến chống Pháp của Đảng là: toàn dân, toàn diện, trường kỳ, tự lực cánh sinh.", "c) Cuộc kháng chiến toàn quốc bùng nổ khi tương quan lực lượng đã nghiêng hẳn về phía ta.", "d) Lời kêu gọi toàn quốc kháng chiến thể hiện quyết tâm sắt đá bảo vệ nền độc lập: “Thà hy sinh tất cả, chứ nhất định không chịu mất nước, nhất định không chịu làm nô lệ”."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Lời kêu gọi toàn quốc kháng chiến (19/12/1946) là hiệu lệnh mở đầu cuộc kháng chiến toàn quốc. b) Đúng: đây là đường lối kháng chiến — cuộc chiến tranh nhân dân toàn dân, toàn diện, lâu dài, dựa vào sức mình là chính. c) Sai: khi kháng chiến bùng nổ, ta còn yếu hơn địch nhiều mặt (địch mạnh về vũ khí, ta mạnh về chính nghĩa và tinh thần); kháng chiến là tất yếu để bảo vệ thành quả Cách mạng tháng Tám. d) Đúng: đây là câu nói bất hủ trong Lời kêu gọi, thể hiện ý chí quyết chiến quyết thắng của dân tộc.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về chiến dịch Biên giới (1950), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Chiến dịch Biên giới (16/9 – 14/10/1950) là chiến dịch tiến công lớn đầu tiên do quân ta chủ động mở trên chiến trường chính Bắc Bộ.", "b) Mục tiêu duy nhất của chiến dịch Biên giới là giải phóng thị xã Cao Bằng.", "c) Thắng lợi của chiến dịch Biên giới giúp ta giành được thế chủ động trên chiến trường chính.", "d) Sau chiến dịch Biên giới, thực dân Pháp phải chuyển sang thế phòng ngự bị động, Mỹ can thiệp ngày càng sâu vào Đông Dương."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: Biên giới là chiến dịch tiến công quy mô lớn đầu tiên ta chủ động mở, mở màn bằng trận Đông Khê (16/9/1950). b) Sai: mục tiêu là tiêu diệt một bộ phận sinh lực địch, giải phóng vùng biên giới, khai thông hành lang giao lưu quốc tế chứ không chỉ giải phóng Cao Bằng. c) Đúng: sau chiến dịch, ta giành thế chủ động trên chiến trường chính Bắc Bộ. d) Đúng: Pháp bị động phòng ngự, Mỹ tăng viện trợ và can thiệp sâu vào chiến tranh Đông Dương.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về phong trào Đồng Khởi (1959–1960), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Phong trào Đồng Khởi chỉ sử dụng hình thức đấu tranh vũ trang để giành chính quyền.", "b) Thắng lợi của phong trào Đồng Khởi đã buộc Mỹ phải rút hết quân về nước.", "c) Từ phong trào Đồng Khởi, Mặt trận Dân tộc Giải phóng miền Nam Việt Nam ra đời (20/12/1960), giương cao ngọn cờ độc lập dân tộc.", "d) Phong trào Đồng Khởi thất bại hoàn toàn, không để lại ý nghĩa gì cho cách mạng miền Nam."], "answer": ["F", "F", "T", "F"], "explain": "a) Sai: Đồng Khởi kết hợp đấu tranh chính trị của quần chúng với đấu tranh vũ trang, nổi dậy giành chính quyền ở nhiều xã, ấp. b) Sai: năm 1960 Mỹ chưa đưa quân viễn chinh vào miền Nam; Đồng Khởi giáng đòn nặng nề vào chính sách “tố cộng”, “diệt cộng” của Ngô Đình Diệm. c) Đúng: thắng lợi Đồng Khởi dẫn đến sự ra đời của Mặt trận Dân tộc Giải phóng miền Nam Việt Nam (20/12/1960). d) Sai: Đồng Khởi thắng lợi, đánh dấu bước phát triển nhảy vọt của cách mạng miền Nam, chuyển từ thế giữ gìn lực lượng sang thế tiến công.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về Hiệp hội các quốc gia Đông Nam Á (ASEAN), xét tính đúng, sai của các nhận định sau:", "statements": ["a) ASEAN được thành lập ngày 8/8/1967 tại Jakarta (Indonesia) với 5 nước sáng lập.", "b) Mục đích của ASEAN là thúc đẩy hợp tác, giữ gìn hòa bình, ổn định và phát triển thịnh vượng ở khu vực Đông Nam Á.", "c) Việt Nam là một trong 5 nước sáng lập ASEAN.", "d) Cộng đồng ASEAN chính thức được thành lập ngày 31/12/2015 nhưng Việt Nam không phải là thành viên của cộng đồng này."], "answer": ["F", "T", "F", "F"], "explain": "a) Sai: ASEAN thành lập ngày 8/8/1967 tại Bangkok (Thái Lan), không phải Jakarta. b) Đúng: đây là mục đích được nêu trong Tuyên bố Bangkok (1967). c) Sai: Việt Nam gia nhập ASEAN ngày 28/7/1995, là thành viên thứ 7, không phải nước sáng lập. d) Sai: Cộng đồng ASEAN thành lập ngày 31/12/2015 và Việt Nam là thành viên tích cực tham gia xây dựng cả 3 trụ cột: chính trị – an ninh, kinh tế, văn hóa – xã hội.", "points": 1}]}]}</script>
