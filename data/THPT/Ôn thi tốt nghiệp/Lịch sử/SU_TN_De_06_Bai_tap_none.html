<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Sự kiện Nhật đảo chính Pháp ở Đông Dương diễn ra vào ngày nào?", "options": ["A. Ngày 15/8/1945.", "B. Ngày 9/3/1945.", "C. Ngày 19/8/1945.", "D. Ngày 2/9/1945."], "answer": "B", "explain": "Đêm 9/3/1945, Nhật đảo chính Pháp trên toàn Đông Dương, độc chiếm Đông Dương. Sự kiện này tạo ra thời cơ mới cho cách mạng Việt Nam: kẻ thù chính, trực tiếp đã thay đổi từ Pháp sang Nhật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngay sau khi Nhật đảo chính Pháp (9/3/1945), Đảng Cộng sản Đông Dương đã ra chỉ thị nào?", "options": ["A. Chỉ thị “Toàn dân kháng chiến”.", "B. Chỉ thị “Kháng chiến kiến quốc”.", "C. Chỉ thị “Nhật – Pháp bắn nhau và hành động của chúng ta” (12/3/1945).", "D. Chỉ thị thành lập Mặt trận Việt Minh."], "answer": "C", "explain": "Ngày 12/3/1945, Ban Thường vụ Trung ương Đảng ra Chỉ thị “Nhật – Pháp bắn nhau và hành động của chúng ta”, xác định kẻ thù chính là phát xít Nhật, phát động cao trào kháng Nhật cứu nước, chuẩn bị khởi nghĩa giành chính quyền.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hội nghị toàn quốc của Đảng Cộng sản Đông Dương quyết định phát động Tổng khởi nghĩa họp ở đâu, khi nào?", "options": ["A. Pác Bó (Cao Bằng), tháng 5/1941.", "B. Chiêm Hóa (Tuyên Quang), tháng 2/1951.", "C. Hà Nội, tháng 8/1945.", "D. Tân Trào (Tuyên Quang), từ ngày 14 đến 15/8/1945."], "answer": "D", "explain": "Từ 14 đến 15/8/1945, Hội nghị toàn quốc của Đảng họp tại Tân Trào (Tuyên Quang), quyết định phát động Tổng khởi nghĩa giành chính quyền trong cả nước trước khi quân Đồng minh vào Đông Dương.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đại hội Quốc dân được triệu tập tại Tân Trào vào ngày 16/8/1945 đã quyết định vấn đề quan trọng nào?", "options": ["A. Tán thành chủ trương Tổng khởi nghĩa của Đảng, thành lập Ủy ban Dân tộc Giải phóng Việt Nam (Chính phủ lâm thời).", "B. Ký hiệp định với Pháp.", "C. Giải tán Mặt trận Việt Minh.", "D. Tuyên bố đầu hàng phát xít Nhật."], "answer": "A", "explain": "Ngày 16/8/1945, Đại hội Quốc dân tại Tân Trào tán thành chủ trương Tổng khởi nghĩa, thông qua 10 chính sách của Việt Minh, thành lập Ủy ban Dân tộc Giải phóng Việt Nam do Chủ tịch Hồ Chí Minh đứng đầu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ủy ban Khởi nghĩa toàn quốc đã ban bố văn bản nào, hiệu triệu toàn dân nổi dậy giành chính quyền?", "options": ["A. Tuyên ngôn độc lập.", "B. Quân lệnh số 1.", "C. Lời kêu gọi toàn quốc kháng chiến.", "D. Chỉ thị “Nhật – Pháp bắn nhau”."], "answer": "B", "explain": "Đêm 13/8/1945, Ủy ban Khởi nghĩa toàn quốc ban bố Quân lệnh số 1, hiệu triệu toàn dân nổi dậy giành chính quyền; từ ngày 14/8, Tổng khởi nghĩa bùng nổ và giành thắng lợi nhanh chóng trong cả nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong Cách mạng tháng Tám 1945, nhân dân Huế và Sài Gòn giành chính quyền vào ngày nào?", "options": ["A. Ngày 19/8/1945.", "B. Ngày 2/9/1945.", "C. Ngày 23/8 (Huế) và ngày 25/8/1945 (Sài Gòn).", "D. Ngày 28/8/1945."], "answer": "C", "explain": "Sau thắng lợi ở Hà Nội (19/8/1945), nhân dân Huế giành chính quyền ngày 23/8, Sài Gòn giành chính quyền ngày 25/8/1945; đến 28/8, Tổng khởi nghĩa thắng lợi trong cả nước (trừ một số nơi).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngày Nam Bộ kháng chiến chống thực dân Pháp xâm lược trở lại là ngày nào?", "options": ["A. Ngày 23/9/1945.", "B. Ngày 19/12/1946.", "C. Ngày 6/3/1946.", "D. Ngày 2/9/1945."], "answer": "A", "explain": "Đêm 22 rạng 23/9/1945, được sự giúp đỡ của quân Anh, thực dân Pháp nổ súng đánh chiếm Sài Gòn, mở đầu cuộc xâm lược Việt Nam lần thứ hai. Nhân dân Nam Bộ nhất tề đứng lên kháng chiến, mở đầu cuộc kháng chiến chống Pháp của cả dân tộc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiệp ước Hoa – Pháp (28/2/1946) có nội dung nào liên quan đến Việt Nam?", "options": ["A. Pháp công nhận độc lập của Việt Nam.", "B. Pháp và Trung Hoa Dân quốc thỏa thuận: Pháp thay quân Trung Hoa Dân quốc ở miền Bắc Việt Nam (vĩ tuyến 16 trở ra Bắc), đổi lại Pháp nhượng bộ một số quyền lợi ở Trung Quốc.", "C. Mỹ thay Pháp ở Đông Dương.", "D. Việt Nam gia nhập Liên hiệp Pháp."], "answer": "B", "explain": "Ngày 28/2/1946, Pháp ký với Trung Hoa Dân quốc hiệp ước: quân Pháp thay quân Tưởng ở miền Bắc Việt Nam. Điều này đặt ta trước tình thế phải hòa hoãn với Pháp để đẩy nhanh quân Tưởng về nước — dẫn đến Hiệp định Sơ bộ 6/3/1946.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việt Nam Quốc dân Đảng là tổ chức chính trị theo khuynh hướng nào, do ai lãnh đạo?", "options": ["A. Khuynh hướng vô sản, do Nguyễn Ái Quốc lãnh đạo.", "B. Khuynh hướng phong kiến, do vua Hàm Nghi lãnh đạo.", "C. Khuynh hướng dân chủ tư sản, do Nguyễn Thái Học lãnh đạo.", "D. Khuynh hướng cải lương, do Phan Châu Trinh lãnh đạo."], "answer": "C", "explain": "Việt Nam Quốc dân Đảng (thành lập 12/1927) là tổ chức chính trị theo khuynh hướng dân chủ tư sản, do Nguyễn Thái Học lãnh đạo; chủ trương dùng bạo lực cách mạng đánh đổ Pháp, xây dựng nước Việt Nam độc lập theo chế độ cộng hòa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phong trào “vô sản hóa” (1928) do tổ chức nào phát động, có tác dụng nào?", "options": ["A. Do Việt Nam Quốc dân Đảng phát động.", "B. Do Đảng Cộng sản Đông Dương phát động.", "C. Do thực dân Pháp phát động.", "D. Do Hội Việt Nam Cách mạng Thanh niên phát động, đưa hội viên vào các nhà máy, hầm mỏ cùng sống, lao động với công nhân để rèn luyện và truyền bá chủ nghĩa Mác – Lênin."], "answer": "D", "explain": "Năm 1928, Hội Việt Nam Cách mạng Thanh niên phát động phong trào “vô sản hóa”: đưa hội viên vào nhà máy, hầm mỏ, đồn điền cùng ăn, cùng ở, cùng làm với công nhân, nhằm rèn luyện lập trường giai cấp và truyền bá lý luận cách mạng — thúc đẩy phong trào công nhân phát triển.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mặt trận Liên Việt được thành lập vào thời gian nào, trên cơ sở hợp nhất các tổ chức nào?", "options": ["A. Tháng 3/1951, hợp nhất Mặt trận Việt Minh và Hội Liên hiệp quốc dân Việt Nam (Liên Việt).", "B. Tháng 5/1941, hợp nhất các đảng phái.", "C. Tháng 12/1960, hợp nhất các mặt trận miền Nam.", "D. Tháng 7/1976, hợp nhất hai miền."], "answer": "A", "explain": "Tháng 3/1951, Đại hội toàn quốc thống nhất Mặt trận Việt Minh và Hội Liên Việt thành Mặt trận Liên Việt, nhằm củng cố, mở rộng khối đoàn kết toàn dân, tăng cường sức mạnh kháng chiến.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mệnh lệnh nổi tiếng của Đại tướng Võ Nguyên Giáp trong cuộc Tổng tiến công mùa Xuân 1975 là gì?", "options": ["A. “Đánh chắc, tiến chắc”.", "B. “Thần tốc, thần tốc hơn nữa; táo bạo, táo bạo hơn nữa; tranh thủ từng phút, từng giờ, xốc tới mặt trận, giải phóng miền Nam, quyết chiến và toàn thắng!”.", "C. “Đánh nhanh, giải quyết nhanh”.", "D. “Toàn dân kháng chiến”."], "answer": "B", "explain": "Ngày 7/4/1975, Đại tướng Võ Nguyên Giáp ra mệnh lệnh lịch sử: “Thần tốc, thần tốc hơn nữa; táo bạo, táo bạo hơn nữa...”, thể hiện quyết tâm giải phóng miền Nam trong thời gian nhanh nhất, với nhịp độ “một ngày bằng hai mươi năm”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sự kiện Nhật đảo chính Pháp (9/3/1945) đã tạo ra thời cơ mới nào cho cách mạng Việt Nam?", "options": ["A. Pháp mạnh lên, Nhật yếu đi.", "B. Quân Đồng minh vào Việt Nam ngay.", "C. Việt Nam được trao trả độc lập.", "D. Kẻ thù chính, trực tiếp của nhân dân Đông Dương đã thay đổi từ thực dân Pháp sang phát xít Nhật; mâu thuẫn Nhật – Pháp gay gắt, tạo điều kiện cho cao trào kháng Nhật cứu nước."], "answer": "D", "explain": "Nhật đảo chính Pháp làm thay đổi kẻ thù chính: từ Pháp sang Nhật. Đảng kịp thời ra Chỉ thị 12/3/1945, phát động cao trào kháng Nhật cứu nước, đẩy mạnh xây dựng lực lượng, chuẩn bị cho Tổng khởi nghĩa khi thời cơ đến.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quyết định quan trọng nhất của Hội nghị toàn quốc Tân Trào (14 – 15/8/1945) là gì?", "options": ["A. Phát động Tổng khởi nghĩa giành chính quyền trong cả nước trước khi quân Đồng minh vào Đông Dương.", "B. Ký hiệp định với Nhật.", "C. Giải tán Đảng.", "D. Chờ thời cơ thêm vài năm."], "answer": "A", "explain": "Trước thời cơ “ngàn năm có một” (Nhật đầu hàng), Hội nghị Tân Trào quyết định phát động Tổng khởi nghĩa ngay, giành chính quyền trước khi quân Đồng minh vào — quyết định sáng suốt, táo bạo, đảm bảo thắng lợi trọn vẹn của cách mạng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cuộc kháng chiến của nhân dân Nam Bộ (từ 23/9/1945) được coi là “tiếng súng mở đầu” cho cuộc kháng chiến chống Pháp của cả dân tộc?", "options": ["A. Vì Nam Bộ là nơi duy nhất kháng chiến.", "B. Vì đây là cuộc kháng chiến đầu tiên của nhân dân ta chống thực dân Pháp xâm lược trở lại sau Cách mạng tháng Tám, thể hiện ý chí “Nam Bộ là thành đồng Tổ quốc”, cổ vũ cả nước chuẩn bị kháng chiến lâu dài.", "C. Vì Nam Bộ đã đánh thắng Pháp hoàn toàn.", "D. Vì Nam Bộ không cần sự chi viện."], "answer": "B", "explain": "Nam Bộ là nơi đầu tiên nổ súng chống Pháp xâm lược trở lại (23/9/1945); tinh thần “đi trước về sau”, “thành đồng Tổ quốc” của Nam Bộ cổ vũ, làm chỗ dựa cho cả nước bước vào cuộc kháng chiến trường kỳ chống thực dân Pháp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tác phẩm “Bản án chế độ thực dân Pháp” (1925) của Nguyễn Ái Quốc có ý nghĩa nào?", "options": ["A. Kêu gọi cải lương với Pháp.", "B. Ca ngợi chế độ thực dân.", "C. Vạch trần bản chất tàn bạo, giả dối của chế độ thực dân Pháp, thức tỉnh tinh thần dân tộc của nhân dân các nước thuộc địa, chuẩn bị về tư tưởng cho cách mạng Việt Nam.", "D. Chỉ là tập hợp tin tức."], "answer": "C", "explain": "“Bản án chế độ thực dân Pháp” (1925, viết bằng tiếng Pháp, xuất bản tại Paris) tố cáo tội ác của chủ nghĩa thực dân, khơi dậy lòng yêu nước, tinh thần đoàn kết của các dân tộc thuộc địa; là bước chuẩn bị quan trọng về tư tưởng, lý luận cho sự ra đời của Đảng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sự ra đời của ba tổ chức cộng sản ở Việt Nam năm 1929 có ý nghĩa nào?", "options": ["A. Đánh dấu sự thất bại của khuynh hướng vô sản.", "B. Chứng tỏ chủ nghĩa Mác – Lênin đã thắng thế.", "C. Không có ý nghĩa gì.", "D. Đánh dấu bước phát triển của phong trào cách mạng, nhưng sự chia rẽ thành ba tổ chức đặt ra yêu cầu cấp thiết phải hợp nhất thành một Đảng thống nhất — dẫn đến sự ra đời của Đảng Cộng sản Việt Nam (3/2/1930)."], "answer": "D", "explain": "Năm 1929, ba tổ chức cộng sản ra đời (Đông Dương Cộng sản đảng, An Nam Cộng sản đảng, Đông Dương Cộng sản liên đoàn) phản ánh sự phát triển của phong trào; nhưng sự phân liệt đòi hỏi phải hợp nhất — Nguyễn Ái Quốc triệu tập Hội nghị hợp nhất (3 – 7/2/1930), thành lập Đảng Cộng sản Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nét đặc sắc của nghệ thuật quân sự Việt Nam trong cuộc Tổng tiến công mùa Xuân 1975 là gì?", "options": ["A. Nghệ thuật “thần tốc, táo bạo, bất ngờ, chắc thắng”: tiến công với nhịp độ cao, kết hợp tiến công quân sự với nổi dậy của quần chúng, chia cắt, bao vây, tiêu diệt lớn quân địch.", "B. Chỉ dùng bộ binh.", "C. Đánh theo kiểu phòng ngự.", "D. Đàm phán là chính."], "answer": "A", "explain": "Xuân 1975 thể hiện nghệ thuật quân sự phát triển đến đỉnh cao: chọn đúng hướng, đúng thời cơ; tiến công thần tốc (“một ngày bằng hai mươi năm”); kết hợp chặt chẽ tiến công và nổi dậy; tiêu diệt, làm tan rã từng mảng lớn quân địch, giải phóng hoàn toàn miền Nam chỉ trong 55 ngày đêm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nội dung toàn diện của đường lối đổi mới ở Việt Nam (từ 1986) được thể hiện như thế nào?", "options": ["A. Chỉ đổi mới kinh tế.", "B. Chỉ đổi mới văn hóa.", "C. Đổi mới toàn diện: trọng tâm là đổi mới kinh tế, đồng thời đổi mới hệ thống chính trị, văn hóa, xã hội, quốc phòng, an ninh và đối ngoại.", "D. Chỉ đổi mới chính trị."], "answer": "C", "explain": "Đại hội VI (1986) đề ra đổi mới toàn diện và đồng bộ: lấy đổi mới kinh tế làm trọng tâm; đồng thời từng bước đổi mới tổ chức, phương thức hoạt động của hệ thống chính trị, phát triển văn hóa, xã hội, mở rộng đối ngoại — tất cả vì mục tiêu dân giàu, nước mạnh, dân chủ, công bằng, văn minh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "ASEAN có vai trò nào đối với Việt Nam trong tiến trình hội nhập?", "options": ["A. Không có vai trò gì.", "B. Buộc Việt Nam phải thay đổi chế độ.", "C. Hạn chế sự phát triển của Việt Nam.", "D. Là cầu nối quan trọng giúp Việt Nam hội nhập khu vực và thế giới, mở rộng quan hệ đối ngoại, thu hút đầu tư, giữ gìn môi trường hòa bình, ổn định để phát triển."], "answer": "D", "explain": "Gia nhập ASEAN (1995) là bước đột phá trong hội nhập của Việt Nam: mở rộng quan hệ với các nước khu vực, thu hút đầu tư, tranh thủ môi trường hòa bình để phát triển; Việt Nam ngày càng có vai trò, vị thế cao trong ASEAN (Chủ tịch ASEAN 1998, 2010, 2020).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việt Nam đã có những đóng góp nào tại Liên hợp quốc?", "options": ["A. Việt Nam là thành viên tích cực: hai lần trúng cử Ủy viên không thường trực Hội đồng Bảo an (2008 – 2009, 2020 – 2021), tham gia lực lượng gìn giữ hòa bình LHQ, đóng góp vào các mục tiêu phát triển bền vững.", "B. Việt Nam chỉ nhận viện trợ từ LHQ.", "C. Việt Nam từ chối mọi vai trò.", "D. Việt Nam không tham gia hoạt động nào của LHQ."], "answer": "A", "explain": "Gia nhập LHQ (20/9/1977), Việt Nam là thành viên tích cực, có trách nhiệm: Ủy viên không thường trực HĐBA hai nhiệm kỳ, tham gia gìn giữ hòa bình tại Nam Sudan, Cộng hòa Trung Phi; thực hiện tốt các Mục tiêu phát triển bền vững (SDGs).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đặc điểm nổi bật của cuộc cách mạng khoa học – công nghệ hiện đại (từ những năm 40 của thế kỷ XX) là gì?", "options": ["A. Khoa học tách rời khỏi sản xuất.", "B. Khoa học gắn liền với kỹ thuật, đi trước mở đường cho kỹ thuật; khoa học trở thành lực lượng sản xuất trực tiếp.", "C. Chỉ phát triển trong lĩnh vực quân sự.", "D. Không ảnh hưởng đến đời sống xã hội."], "answer": "B", "explain": "Cách mạng khoa học – công nghệ hiện đại có đặc điểm: khoa học – kỹ thuật gắn bó chặt chẽ, khoa học đi trước mở đường cho kỹ thuật; khoa học trở thành lực lượng sản xuất trực tiếp; thời gian từ phát minh đến ứng dụng ngày càng rút ngắn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao thắng lợi của Cách mạng tháng Tám 1945 được đánh giá là thắng lợi có tầm vóc thời đại?", "options": ["A. Vì đây là cuộc cách mạng duy nhất ở châu Á.", "B. Vì nó diễn ra nhanh chóng.", "C. Vì thắng lợi đã mở ra kỷ nguyên độc lập, tự do cho dân tộc Việt Nam; góp phần làm sụp đổ hệ thống thuộc địa, cổ vũ mạnh mẽ phong trào giải phóng dân tộc trên thế giới trong thời đại mới.", "D. Vì nó chỉ có ý nghĩa với Việt Nam."], "answer": "C", "explain": "CMT8 là thắng lợi của đường lối cách mạng vô sản ở một nước thuộc địa; nó mở ra thời đại mới cho dân tộc Việt Nam và góp phần vào sự nghiệp giải phóng các dân tộc bị áp bức trên thế giới, được đánh giá là sự kiện có tầm vóc thời đại.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bài học “kết hợp sức mạnh dân tộc với sức mạnh thời đại” được Đảng vận dụng như thế nào trong cách mạng Việt Nam (1945–1975)?", "options": ["A. Chỉ dựa vào sức mình, không cần quốc tế.", "B. Từ bỏ độc lập, tự chủ.", "C. Chỉ trông chờ vào viện trợ nước ngoài.", "D. Phát huy cao độ sức mạnh đoàn kết toàn dân tộc, đồng thời tranh thủ sự đồng tình, ủng hộ, giúp đỡ của các lực lượng tiến bộ, yêu chuộng hòa bình trên thế giới."], "answer": "D", "explain": "Trong kháng chiến chống Pháp, chống Mỹ, Đảng vừa phát huy sức mạnh đại đoàn kết toàn dân tộc (sức mạnh nội sinh quyết định), vừa tranh thủ sự ủng hộ của phe xã hội chủ nghĩa, phong trào giải phóng dân tộc và nhân dân tiến bộ thế giới — kết hợp nhuần nhuyễn sức mạnh dân tộc với sức mạnh thời đại.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Về đường lối kháng chiến chống thực dân Pháp (1946–1954), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Đường lối kháng chiến chống Pháp của Đảng là cuộc chiến tranh nhân dân: toàn dân, toàn diện, trường kỳ, tự lực cánh sinh.", "b) Đường lối kháng chiến chống Pháp chủ trương “đánh nhanh, thắng nhanh” bằng những trận đánh lớn ngay từ đầu.", "c) “Toàn dân” có nghĩa là mọi người dân đều tham gia kháng chiến; “toàn diện” là đánh địch trên tất cả các mặt: quân sự, chính trị, kinh tế, văn hóa, ngoại giao.", "d) “Tự lực cánh sinh” có nghĩa là dựa vào sức mình là chính, đồng thời ra sức tranh thủ sự ủng hộ, giúp đỡ của quốc tế."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: đây là đường lối kháng chiến được nêu trong Chỉ thị “Toàn dân kháng chiến” (12/12/1946) và tác phẩm “Kháng chiến nhất định thắng lợi” của Trường Chinh. b) Sai: ta chủ trương trường kỳ kháng chiến vì tương quan lực lượng ban đầu ta yếu hơn địch; “đánh nhanh thắng nhanh” là âm mưu của Pháp. c) Đúng: kháng chiến toàn dân, toàn diện là bản chất của chiến tranh nhân dân Việt Nam. d) Đúng: tự lực cánh sinh là dựa vào sức mình là chính, không ỷ lại, đồng thời tranh thủ sự giúp đỡ quốc tế.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về mặt trận ngoại giao trong kháng chiến chống Mỹ (1968–1973), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Trong kháng chiến chống Mỹ, ta chỉ chú trọng đấu tranh quân sự, coi nhẹ mặt trận ngoại giao.", "b) Hội nghị Paris là cuộc đàm phán song phương giữa Việt Nam Dân chủ Cộng hòa và Hoa Kỳ.", "c) Thắng lợi quân sự (“Điện Biên Phủ trên không” tháng 12/1972) tạo thế mạnh quyết định để ta giành thắng lợi trên bàn đàm phán Paris.", "d) Hiệp định Paris (1973) là kết quả của đấu tranh ngoại giao đơn thuần, không liên quan đến thắng lợi trên chiến trường."], "answer": ["F", "F", "T", "F"], "explain": "a) Sai: Đảng thực hiện kết hợp “vừa đánh vừa đàm”, coi ngoại giao là mặt trận quan trọng. b) Sai: Hội nghị Paris gồm bốn bên: VNDCCH, Chính phủ Cách mạng lâm thời Cộng hòa miền Nam Việt Nam, Hoa Kỳ và Việt Nam Cộng hòa. c) Đúng: thắng lợi “Điện Biên Phủ trên không” buộc Mỹ phải trở lại bàn đàm phán, ký Hiệp định Paris theo dự thảo đã thỏa thuận. d) Sai: thắng lợi ngoại giao luôn gắn chặt với thắng lợi quân sự, chính trị trên chiến trường.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về kinh tế đối ngoại của Việt Nam thời kỳ đổi mới, xét tính đúng, sai của các nhận định sau:", "statements": ["a) Sau đổi mới, Việt Nam chủ trương đóng cửa nền kinh tế, không quan hệ kinh tế với bên ngoài.", "b) Việt Nam đã bình thường hóa quan hệ với Hoa Kỳ (1995), gia nhập ASEAN (1995), APEC (1998) và WTO (2007).", "c) Hội nhập kinh tế quốc tế chỉ mang lại thời cơ, không đặt ra thách thức nào cho Việt Nam.", "d) Việt Nam từ chối tham gia mọi hiệp định thương mại tự do thế hệ mới."], "answer": ["F", "T", "F", "F"], "explain": "a) Sai: đổi mới gắn với mở cửa, đa phương hóa, đa dạng hóa quan hệ kinh tế đối ngoại. b) Đúng: đây là những mốc quan trọng trong hội nhập kinh tế quốc tế của Việt Nam. c) Sai: hội nhập vừa tạo thời cơ (mở rộng thị trường, thu hút đầu tư, công nghệ) vừa đặt ra thách thức (cạnh tranh gay gắt, nguy cơ tụt hậu). d) Sai: Việt Nam tích cực tham gia CPTPP, EVFTA và nhiều FTA thế hệ mới.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về trật tự thế giới sau Chiến tranh lạnh, xét tính đúng, sai của các nhận định sau:", "statements": ["a) Sau khi Chiến tranh lạnh chấm dứt, trật tự hai cực Yalta sụp đổ, quan hệ quốc tế chuyển sang xu thế đa cực.", "b) Trong trật tự thế giới mới, Mỹ vẫn là siêu cường có ưu thế nhưng nhiều trung tâm, tổ chức quốc tế ngày càng có vai trò quan trọng.", "c) Xu thế đa cực có nghĩa là trên thế giới không còn xung đột, chiến tranh và mâu thuẫn.", "d) Trước xu thế đa cực, Việt Nam thực hiện đường lối đối ngoại độc lập, tự chủ, đa phương hóa, đa dạng hóa quan hệ quốc tế."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: sự sụp đổ của Liên Xô (1991) chấm dứt trật tự hai cực, mở ra thời kỳ mới. b) Đúng: Mỹ có ưu thế vượt trội nhưng không thể chi phối tuyệt đối; EU, Trung Quốc, Nga, Nhật Bản, ASEAN... ngày càng quan trọng. c) Sai: đa cực không đồng nghĩa với hết xung đột; cạnh tranh chiến lược, xung đột cục bộ vẫn diễn biến phức tạp. d) Đúng: Việt Nam thực hiện đối ngoại độc lập, tự chủ, hòa bình, hợp tác và phát triển; đa phương hóa, đa dạng hóa.", "points": 1}]}]}</script>
