<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Bản Tuyên ngôn độc lập khai sinh ra nước Việt Nam Dân chủ Cộng hòa được Chủ tịch Hồ Chí Minh đọc tại Quảng trường Ba Đình vào ngày nào?", "options": ["A. Ngày 2/9/1945.", "B. Ngày 19/8/1945.", "C. Ngày 6/1/1946.", "D. Ngày 19/12/1946."], "answer": "A", "explain": "Ngày 2/9/1945, tại Quảng trường Ba Đình (Hà Nội), Chủ tịch Hồ Chí Minh đọc bản Tuyên ngôn độc lập, khai sinh nước Việt Nam Dân chủ Cộng hòa, mở ra kỷ nguyên độc lập, tự do cho dân tộc Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thắng lợi của Cách mạng tháng Tám năm 1945 đã dẫn đến sự ra đời của nhà nước nào ở Việt Nam?", "options": ["A. Quốc gia Việt Nam.", "B. Việt Nam Dân chủ Cộng hòa.", "C. Cộng hòa Xã hội chủ nghĩa Việt Nam.", "D. Cộng hòa miền Nam Việt Nam."], "answer": "B", "explain": "Sau thắng lợi của Cách mạng tháng Tám, ngày 2/9/1945 nước Việt Nam Dân chủ Cộng hòa ra đời — nhà nước công nông đầu tiên ở Đông Nam Á, do nhân dân lao động làm chủ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cuộc kháng chiến toàn quốc chống thực dân Pháp của nhân dân Việt Nam bùng nổ vào ngày nào?", "options": ["A. Ngày 6/3/1946.", "B. Ngày 14/9/1946.", "C. Ngày 19/12/1946.", "D. Ngày 7/5/1954."], "answer": "C", "explain": "Đêm 19/12/1946, theo Lời kêu gọi toàn quốc kháng chiến của Chủ tịch Hồ Chí Minh, quân dân cả nước nhất tề đứng lên, cuộc kháng chiến toàn quốc chống thực dân Pháp chính thức bùng nổ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiến dịch Điện Biên Phủ (1954) kết thúc thắng lợi vào ngày nào?", "options": ["A. Ngày 13/3/1954.", "B. Ngày 1/5/1954.", "C. Ngày 21/7/1954.", "D. Ngày 7/5/1954."], "answer": "D", "explain": "Chiều ngày 7/5/1954, quân ta tiêu diệt toàn bộ tập đoàn cứ điểm Điện Biên Phủ, kết thúc thắng lợi chiến dịch (mở màn từ 13/3/1954), giáng đòn quyết định vào ý chí xâm lược của thực dân Pháp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiệp định Genève về chấm dứt chiến tranh, lập lại hòa bình ở Đông Dương được ký kết vào ngày nào?", "options": ["A. Ngày 21/7/1954.", "B. Ngày 7/5/1954.", "C. Ngày 27/1/1973.", "D. Ngày 20/7/1954."], "answer": "A", "explain": "Ngày 21/7/1954, Hiệp định Genève được ký kết, công nhận độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam, Lào, Campuchia; quy định tổng tuyển cử thống nhất Việt Nam vào tháng 7/1956.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiệp định Paris về chấm dứt chiến tranh, lập lại hòa bình ở Việt Nam được ký kết vào ngày nào?", "options": ["A. Ngày 21/7/1954.", "B. Ngày 30/4/1975.", "C. Ngày 27/1/1973.", "D. Ngày 2/3/1973."], "answer": "C", "explain": "Ngày 27/1/1973, Hiệp định Paris được ký kết giữa bốn bên, trong đó Hoa Kỳ cam kết tôn trọng độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam và rút hết quân về nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngày giải phóng hoàn toàn miền Nam, thống nhất đất nước là ngày nào?", "options": ["A. Ngày 27/1/1973.", "B. Ngày 25/4/1976.", "C. Ngày 2/7/1976.", "D. Ngày 30/4/1975."], "answer": "D", "explain": "Trưa ngày 30/4/1975, Chiến dịch Hồ Chí Minh toàn thắng, cờ giải phóng tung bay trên nóc Dinh Độc Lập, Sài Gòn được giải phóng, miền Nam hoàn toàn giải phóng, đất nước thống nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đại hội đại biểu toàn quốc lần thứ VI của Đảng (tháng 12/1986) đã đề ra đường lối nào?", "options": ["A. Đổi mới toàn diện đất nước.", "B. Đẩy mạnh kháng chiến chống Mỹ.", "C. Tiến hành cải cách ruộng đất.", "D. Xây dựng hợp tác xã nông nghiệp."], "answer": "A", "explain": "Đại hội VI của Đảng (12/1986) đề ra đường lối đổi mới toàn diện đất nước, trọng tâm là đổi mới kinh tế, mở ra thời kỳ phát triển mới của cách mạng Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiệp hội các quốc gia Đông Nam Á (ASEAN) được thành lập vào thời gian nào?", "options": ["A. Ngày 28/7/1995.", "B. Ngày 8/8/1967.", "C. Ngày 31/12/2015.", "D. Ngày 24/10/1945."], "answer": "B", "explain": "Ngày 8/8/1967, tại Bangkok (Thái Lan), ngoại trưởng 5 nước Indonesia, Malaysia, Philippines, Singapore và Thái Lan ký Tuyên bố Bangkok, chính thức thành lập ASEAN.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việt Nam chính thức trở thành thành viên của ASEAN vào thời gian nào?", "options": ["A. Ngày 8/8/1967.", "B. Ngày 31/12/2015.", "C. Ngày 28/7/1995.", "D. Ngày 11/1/2007."], "answer": "C", "explain": "Ngày 28/7/1995, Việt Nam chính thức gia nhập ASEAN, trở thành thành viên thứ 7 của tổ chức, đánh dấu bước tiến quan trọng trong tiến trình hội nhập khu vực.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đảng Cộng sản Việt Nam được thành lập vào ngày nào?", "options": ["A. Ngày 19/5/1941.", "B. Ngày 5/6/1911.", "C. Ngày 2/9/1945.", "D. Ngày 3/2/1930."], "answer": "D", "explain": "Từ ngày 3 đến 7/2/1930, Hội nghị hợp nhất các tổ chức cộng sản họp tại Cửu Long (Hương Cảng, Trung Quốc) dưới sự chủ trì của Nguyễn Ái Quốc, quyết định thành lập Đảng Cộng sản Việt Nam (lấy ngày 3/2 làm ngày thành lập Đảng).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cách mạng tháng Mười Nga năm 1917 giành thắng lợi vào ngày nào (theo dương lịch hiện nay)?", "options": ["A. Ngày 25/10/1917.", "B. Ngày 7/11/1917.", "C. Ngày 8/3/1917.", "D. Ngày 14/2/1917."], "answer": "B", "explain": "Đêm 24 rạng ngày 25/10/1917 theo lịch Nga cũ (tức đêm 6 rạng ngày 7/11/1917 theo dương lịch), cuộc khởi nghĩa vũ trang ở Petrograd thắng lợi, chính quyền Xô viết được thành lập, mở ra thời đại mới trong lịch sử nhân loại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một trong những ý nghĩa lịch sử quan trọng của Cách mạng tháng Tám năm 1945 là gì?", "options": ["A. Chấm dứt hoàn toàn ách thống trị của thực dân Pháp trên cả nước.", "B. Đánh bại hoàn toàn đế quốc Mỹ xâm lược.", "C. Đập tan xiềng xích nô lệ của thực dân Pháp, phát xít Nhật và chế độ phong kiến, đưa nhân dân ta từ thân phận nô lệ lên địa vị làm chủ đất nước.", "D. Hoàn thành thống nhất đất nước về mặt nhà nước."], "answer": "C", "explain": "Cách mạng tháng Tám đập tan ách thống trị của thực dân Pháp, phát xít Nhật và chế độ phong kiến tay sai, lập nên nước Việt Nam Dân chủ Cộng hòa, đưa dân tộc ta bước vào kỷ nguyên độc lập, tự do; cổ vũ phong trào giải phóng dân tộc trên thế giới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao chiến thắng Điện Biên Phủ (1954) được coi là trận “quyết chiến chiến lược” của quân dân Việt Nam?", "options": ["A. Vì đây là trận đánh đầu tiên của quân đội ta.", "B. Vì trận đánh chỉ diễn ra trong vòng một ngày.", "C. Vì quân Pháp đã tự nguyện rút khỏi Điện Biên Phủ.", "D. Vì thắng lợi này đã làm phá sản hoàn toàn kế hoạch Nava, giáng đòn quyết định vào ý chí xâm lược của Pháp, tạo thuận lợi cho đấu tranh ngoại giao ở Genève."], "answer": "D", "explain": "Điện Biên Phủ là trận quyết chiến chiến lược vì nó đánh bại ý chí xâm lược của thực dân Pháp, làm phá sản hoàn toàn kế hoạch Nava — nỗ lực chiến tranh lớn nhất của Pháp, buộc Pháp phải ngồi vào bàn đàm phán và ký Hiệp định Genève.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiến chương Liên hợp quốc được ký kết tại thành phố nào vào năm 1945?", "options": ["A. San Francisco (Hoa Kỳ).", "B. New York (Hoa Kỳ).", "C. Genève (Thụy Sĩ).", "D. Paris (Pháp)."], "answer": "A", "explain": "Từ tháng 4 đến tháng 6/1945, Hội nghị San Francisco (Hoa Kỳ) với sự tham dự của 50 nước đã thông qua Hiến chương Liên hợp quốc; Hiến chương chính thức có hiệu lực ngày 24/10/1945, đánh dấu sự ra đời của Liên hợp quốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nội dung cơ bản của Hiệp định Genève (1954) về Việt Nam là gì?", "options": ["A. Việt Nam bị chia cắt lâu dài thành hai miền Nam – Bắc.", "B. Các bên tham dự công nhận độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam; thực hiện ngừng bắn, tập kết, chuyển quân; tổng tuyển cử thống nhất đất nước vào tháng 7/1956.", "C. Pháp được tiếp tục đóng quân ở miền Nam Việt Nam.", "D. Hoa Kỳ được thay chân Pháp ở Đông Dương."], "answer": "B", "explain": "Hiệp định Genève công nhận các quyền dân tộc cơ bản của Việt Nam (độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ), quy định ngừng bắn, tập kết và chuyển quân hai bên, lấy vĩ tuyến 17 làm giới tuyến quân sự tạm thời và tổng tuyển cử tự do trong cả nước vào tháng 7/1956.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau cơ bản giữa chiến lược “Chiến tranh đặc biệt” (1961–1965) và chiến lược “Chiến tranh cục bộ” (1965–1968) của Mỹ ở miền Nam Việt Nam là gì?", "options": ["A. Chiến tranh đặc biệt dùng quân Mỹ trực tiếp tham chiến, còn chiến tranh cục bộ dùng quân Sài Gòn.", "B. Hai chiến lược không có điểm khác nhau về lực lượng.", "C. Chiến tranh đặc biệt tiến hành bằng quân đội Sài Gòn dưới sự chỉ huy của cố vấn Mỹ, còn chiến tranh cục bộ Mỹ trực tiếp đưa quân viễn chinh vào tham chiến.", "D. Chiến tranh cục bộ chỉ diễn ra ở miền Bắc Việt Nam."], "answer": "C", "explain": "Trong “Chiến tranh đặc biệt”, Mỹ dùng quân đội Sài Gòn làm xương sống, cố vấn Mỹ chỉ huy, thực hiện dồn dân lập ấp chiến lược. Sang “Chiến tranh cục bộ”, Mỹ trực tiếp đưa quân viễn chinh (lúc cao nhất gần 50 vạn) vào miền Nam, mở các cuộc hành quân càn quét, tìm diệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa quan trọng nhất của Hiệp định Paris (1973) đối với cách mạng Việt Nam là gì?", "options": ["A. Buộc Hoa Kỳ phải công nhận độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam, rút hết quân về nước, tạo thời cơ thuận lợi để nhân dân ta tiến lên giải phóng hoàn toàn miền Nam.", "B. Hoa Kỳ công nhận sự tồn tại hợp pháp của chính quyền Sài Gòn.", "C. Chiến tranh ở Việt Nam chấm dứt hoàn toàn ngay sau khi hiệp định được ký.", "D. Miền Nam Việt Nam được độc lập dưới sự bảo trợ của Hoa Kỳ."], "answer": "A", "explain": "Hiệp định Paris là thắng lợi có ý nghĩa chiến lược: Mỹ phải rút hết quân, so sánh lực lượng ở miền Nam thay đổi có lợi cho cách mạng, tạo ra thời cơ lớn để ta mở cuộc Tổng tiến công và nổi dậy mùa Xuân 1975, giải phóng hoàn toàn miền Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngày 5/6/1911, Nguyễn Tất Thành ra đi tìm đường cứu nước từ bến cảng nào?", "options": ["A. Cảng Hải Phòng.", "B. Cảng Nhà Rồng (Sài Gòn).", "C. Cảng Đà Nẵng.", "D. Cảng Quy Nhơn."], "answer": "B", "explain": "Ngày 5/6/1911, từ bến cảng Nhà Rồng (Sài Gòn), Nguyễn Tất Thành với tên gọi Văn Ba làm phụ bếp trên tàu Đô đốc Latouche-Tréville, ra đi tìm đường cứu nước, mở đầu hành trình tìm chân lý cách mạng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phong trào Xô viết Nghệ Tĩnh (1930–1931) mang tính chất của cuộc cách mạng nào?", "options": ["A. Phong trào yêu nước theo khuynh hướng dân chủ tư sản.", "B. Phong trào cải lương ôn hòa, bất bạo động.", "C. Phong trào cách mạng mang tính chất dân tộc dân chủ nhân dân, do giai cấp công nhân thông qua Đảng Cộng sản lãnh đạo.", "D. Cuộc khởi nghĩa nông dân mang tính tự phát."], "answer": "C", "explain": "Dưới sự lãnh đạo của Đảng, phong trào Xô viết Nghệ Tĩnh (1930–1931) của liên minh công – nông đã thực hiện khẩu hiệu “độc lập dân tộc” và “ruộng đất dân cày”, thành lập các Xô viết — chính quyền cách mạng sơ khai, mang tính chất cách mạng dân tộc dân chủ nhân dân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biểu hiện nào sau đây là của xu thế toàn cầu hóa từ những năm 80 của thế kỷ XX?", "options": ["A. Các nước đóng cửa biên giới, hạn chế giao thương.", "B. Chiến tranh lạnh giữa hai phe ngày càng leo thang.", "C. Các tổ chức hợp tác khu vực lần lượt tan rã.", "D. Sự phát triển nhanh chóng của thương mại, đầu tư, tài chính quốc tế và phân công lao động mang tính toàn cầu."], "answer": "D", "explain": "Toàn cầu hóa từ thập niên 80 của thế kỷ XX biểu hiện ở sự gia tăng mạnh mẽ các dòng thương mại, đầu tư, tài chính xuyên biên giới, sự phụ thuộc lẫn nhau giữa các nền kinh tế và vai trò lớn của các công ty xuyên quốc gia.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc ký kết Hiệp định Sơ bộ (6/3/1946) với Pháp thể hiện sách lược nào của Đảng và Chính phủ Việt Nam?", "options": ["A. Sách lược “hòa để tiến”: nhân nhượng có nguyên tắc để có thêm thời gian củng cố lực lượng, chuẩn bị cho cuộc kháng chiến lâu dài không thể tránh khỏi.", "B. Sách lược đầu hàng, thỏa hiệp với thực dân Pháp.", "C. Sách lược liên minh quân sự lâu dài với Pháp.", "D. Sách lược từ bỏ mục tiêu độc lập dân tộc."], "answer": "A", "explain": "Hiệp định Sơ bộ (6/3/1946) thể hiện sách lược “hòa để tiến”: ta nhân nhượng cho Pháp một số quyền lợi kinh tế, văn hóa (không nhân nhượng về độc lập, chủ quyền) để đẩy 20 vạn quân Trung Hoa Dân quốc về nước, tranh thủ thời gian hòa hoãn chuẩn bị lực lượng kháng chiến.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao Hội nghị Trung ương Đảng lần thứ 15 (tháng 1/1959) được coi là bước ngoặt của cách mạng miền Nam?", "options": ["A. Vì Hội nghị quyết định phát động tổng khởi nghĩa trên cả nước.", "B. Vì Hội nghị xác định con đường phát triển cơ bản của cách mạng miền Nam là khởi nghĩa giành chính quyền về tay nhân dân bằng bạo lực cách mạng — từ đó phong trào Đồng Khởi (1960) bùng nổ, đưa cách mạng miền Nam từ thế giữ gìn lực lượng sang thế tiến công.", "C. Vì Hội nghị quyết định ký hiệp định đình chiến với Hoa Kỳ.", "D. Vì Hội nghị chủ trương đấu tranh hòa bình, không dùng bạo lực."], "answer": "B", "explain": "Nghị quyết 15 (1/1959) khẳng định: ngoài con đường dùng bạo lực cách mạng, nhân dân miền Nam không có con đường nào khác để tự giải phóng. Đây là bước ngoặt đưa cách mạng miền Nam từ thế giữ gìn lực lượng sang thế tiến công, mở đầu bằng phong trào Đồng Khởi (1959–1960).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhận định nào sau đây đúng về vai trò của Mặt trận Việt Minh (thành lập ngày 19/5/1941)?", "options": ["A. Việt Minh chỉ hoạt động tuyên truyền, không tham gia chuẩn bị khởi nghĩa.", "B. Việt Minh do thực dân Pháp dựng lên để mị dân.", "C. Việt Minh chủ trương đấu tranh cải lương, không dùng bạo lực cách mạng.", "D. Việt Minh là mặt trận dân tộc thống nhất, tập hợp mọi lực lượng yêu nước, xây dựng lực lượng chính trị và vũ trang, làm nòng cốt cho thắng lợi của Tổng khởi nghĩa tháng Tám 1945."], "answer": "D", "explain": "Theo Nghị quyết Hội nghị Trung ương 8 (5/1941), Mặt trận Việt Minh đoàn kết toàn dân đánh Pháp, đuổi Nhật; xây dựng các đoàn thể cứu quốc, căn cứ địa cách mạng và lực lượng vũ trang (Việt Nam Tuyên truyền Giải phóng quân, 22/12/1944), chuẩn bị mọi mặt cho Tổng khởi nghĩa giành chính quyền tháng 8/1945.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Về Cách mạng tháng Tám năm 1945, xét tính đúng, sai của các nhận định sau:", "statements": ["a) Cách mạng tháng Tám nổ ra và giành thắng lợi khi thời cơ khách quan đã chín muồi: phát xít Nhật đầu hàng Đồng minh (15/8/1945), quân Đồng minh chưa kịp vào Đông Dương.", "b) Thắng lợi của Cách mạng tháng Tám đã đưa nhân dân ta từ thân phận nô lệ lên địa vị làm chủ đất nước, mở ra kỷ nguyên độc lập, tự do cho dân tộc Việt Nam.", "c) Lực lượng nòng cốt quyết định thắng lợi của Cách mạng tháng Tám là quân đội chính quy.", "d) Cách mạng tháng Tám năm 1945 là cuộc cách mạng giải phóng dân tộc mang tính dân tộc điển hình, có tính nhân dân sâu sắc."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: thời cơ “ngàn năm có một” xuất hiện khi Nhật đầu hàng (15/8/1945), chính phủ tay sai hoang mang, quân Đồng minh chưa vào. b) Đúng: đây là ý nghĩa lịch sử cơ bản của Cách mạng tháng Tám. c) Sai: lực lượng quyết định là lực lượng chính trị của quần chúng (công nhân, nông dân, các tầng lớp nhân dân) dưới sự lãnh đạo của Đảng và Mặt trận Việt Minh, kết hợp với lực lượng vũ trang. d) Đúng: tính chất của Cách mạng tháng Tám là cách mạng giải phóng dân tộc, mang tính dân tộc điển hình.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về chiến dịch Điện Biên Phủ (1954), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Thực dân Pháp xây dựng Điện Biên Phủ thành tập đoàn cứ điểm mạnh nhất ở Đông Dương, hòng thu hút và tiêu diệt bộ đội chủ lực của ta.", "b) Ngay từ đầu chiến dịch, Đảng ta đã xác định phương châm tác chiến là “đánh chắc, tiến chắc”.", "c) Chiến dịch Điện Biên Phủ kết thúc thắng lợi vào ngày 21/7/1954.", "d) Thắng lợi Điện Biên Phủ đã làm phá sản hoàn toàn kế hoạch Nava, tạo điều kiện thuận lợi cho cuộc đấu tranh ngoại giao của ta tại Hội nghị Genève."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng: Nava cho xây dựng Điện Biên Phủ thành “pháo đài bất khả xâm phạm”, tập đoàn cứ điểm mạnh nhất Đông Dương. b) Sai: ban đầu ta chủ trương “đánh nhanh, giải quyết nhanh”, sau khi phân tích tình hình đã chuyển sang “đánh chắc, tiến chắc”. c) Sai: chiến dịch kết thúc thắng lợi chiều 7/5/1954; 21/7/1954 là ngày ký Hiệp định Genève. d) Đúng: Điện Biên Phủ giáng đòn quyết định vào ý chí xâm lược của Pháp, làm phá sản kế hoạch Nava.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về Hiệp định Paris (1973), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Hiệp định Paris được ký kết ngày 27/1/1973 giữa hai bên là Việt Nam Dân chủ Cộng hòa và Hoa Kỳ.", "b) Theo Hiệp định Paris, Hoa Kỳ được phép duy trì căn cứ quân sự lâu dài ở miền Nam Việt Nam.", "c) Hiệp định Paris buộc Hoa Kỳ phải rút hết quân đội và cố vấn quân sự về nước trong vòng 60 ngày.", "d) Sau Hiệp định Paris, tương quan lực lượng ở miền Nam nghiêng hẳn về phía chính quyền Sài Gòn."], "answer": ["F", "F", "T", "F"], "explain": "a) Sai: Hiệp định Paris được ký giữa bốn bên: Việt Nam Dân chủ Cộng hòa, Chính phủ Cách mạng lâm thời Cộng hòa miền Nam Việt Nam, Hoa Kỳ và Việt Nam Cộng hòa (chính quyền Sài Gòn). b) Sai: Hiệp định buộc Mỹ rút hết quân, không được duy trì bất kỳ căn cứ quân sự nào ở miền Nam Việt Nam. c) Đúng: Mỹ phải rút hết quân đội và cố vấn quân sự trong vòng 60 ngày kể từ khi hiệp định được ký kết. d) Sai: sau Hiệp định Paris, so sánh lực lượng thay đổi có lợi cho cách mạng: Mỹ rút quân, viện trợ cho Sài Gòn giảm, vùng giải phóng được giữ vững và mở rộng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về công cuộc Đổi mới đất nước (từ năm 1986), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Đường lối đổi mới toàn diện đất nước được Đảng Cộng sản Việt Nam đề ra tại Đại hội VII (1991).", "b) Đổi mới toàn diện đất nước nhưng vẫn kiên định mục tiêu độc lập dân tộc và chủ nghĩa xã hội.", "c) Trọng tâm của công cuộc đổi mới là đổi mới kinh tế.", "d) Công cuộc đổi mới đã đưa Việt Nam trở thành nước công nghiệp phát triển ngay trong thập niên 90 của thế kỷ XX."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: đường lối đổi mới được đề ra tại Đại hội VI (12/1986), không phải Đại hội VII. b) Đúng: đổi mới nhưng kiên định chủ nghĩa Mác – Lênin, tư tưởng Hồ Chí Minh và mục tiêu độc lập dân tộc gắn liền với chủ nghĩa xã hội. c) Đúng: Đại hội VI xác định lấy đổi mới kinh tế làm trọng tâm. d) Sai: sau đổi mới, Việt Nam thoát khỏi khủng hoảng, kinh tế tăng trưởng liên tục, nhưng vẫn là nước đang phát triển, đang đẩy mạnh công nghiệp hóa, hiện đại hóa.", "points": 1}]}]}</script>
