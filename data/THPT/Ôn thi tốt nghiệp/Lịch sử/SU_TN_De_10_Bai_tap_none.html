<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Cách mạng tháng Tám giành thắng lợi vào năm nào, mở ra kỷ nguyên mới cho dân tộc Việt Nam?", "options": ["A. Năm 1930.", "B. Năm 1945.", "C. Năm 1954.", "D. Năm 1975."], "answer": "B", "explain": "Cách mạng tháng Tám thắng lợi năm 1945, lập nên nước Việt Nam Dân chủ Cộng hòa (2/9/1945), mở ra kỷ nguyên độc lập, tự do cho dân tộc Việt Nam — kỷ nguyên nhân dân làm chủ đất nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bản Tuyên ngôn độc lập (2/9/1945) do ai soạn thảo và đọc tại Quảng trường Ba Đình?", "options": ["A. Trường Chinh.", "B. Võ Nguyên Giáp.", "C. Chủ tịch Hồ Chí Minh.", "D. Phạm Văn Đồng."], "answer": "C", "explain": "Chủ tịch Hồ Chí Minh soạn thảo và trực tiếp đọc bản Tuyên ngôn độc lập ngày 2/9/1945 tại Quảng trường Ba Đình, khai sinh nước Việt Nam Dân chủ Cộng hòa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cuộc kháng chiến toàn quốc chống thực dân Pháp bùng nổ vào ngày tháng nào?", "options": ["A. Ngày 19/12/1946.", "B. Ngày 6/3/1946.", "C. Ngày 7/5/1954.", "D. Ngày 2/9/1945."], "answer": "A", "explain": "Đêm 19/12/1946, theo Lời kêu gọi toàn quốc kháng chiến của Chủ tịch Hồ Chí Minh, cuộc kháng chiến toàn quốc chống thực dân Pháp chính thức bùng nổ, mở đầu 9 năm kháng chiến trường kỳ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiến thắng nào bẻ gãy cuộc tiến công quy mô lớn đầu tiên của Pháp lên căn cứ địa Việt Bắc?", "options": ["A. Chiến dịch Biên giới.", "B. Chiến dịch Việt Bắc thu – đông 1947.", "C. Chiến dịch Điện Biên Phủ.", "D. Chiến dịch Tây Bắc."], "answer": "B", "explain": "Chiến thắng Việt Bắc thu – đông 1947 bẻ gãy cuộc tiến công của 12.000 quân Pháp, bảo vệ vững chắc căn cứ địa và cơ quan đầu não kháng chiến, đánh bại âm mưu “đánh nhanh, thắng nhanh” của địch.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thắng lợi của chiến dịch nào giúp quân dân Việt Nam giành thế chủ động trên chiến trường chính Bắc Bộ?", "options": ["A. Chiến dịch Việt Bắc.", "B. Chiến dịch Điện Biên Phủ.", "C. Chiến dịch Biên giới (1950).", "D. Chiến dịch Hòa Bình."], "answer": "C", "explain": "Chiến dịch Biên giới (16/9 – 14/10/1950) thắng lợi, ta giành thế chủ động trên chiến trường chính Bắc Bộ, khai thông hành lang giao lưu quốc tế Việt – Trung.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiến thắng Điện Biên Phủ (7/5/1954) đã làm phá sản hoàn toàn kế hoạch quân sự nào của Pháp?", "options": ["A. Kế hoạch Rơve.", "B. Kế hoạch Đờ Lát đơ Tátxinhi.", "C. Kế hoạch Bôlae.", "D. Kế hoạch Nava."], "answer": "D", "explain": "Chiến thắng Điện Biên Phủ làm phá sản hoàn toàn kế hoạch Nava — nỗ lực chiến tranh lớn nhất, cuối cùng của thực dân Pháp ở Đông Dương, giáng đòn quyết định vào ý chí xâm lược của Pháp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiệp định Genève được ký kết vào ngày nào, chấm dứt chiến tranh ở Đông Dương?", "options": ["A. Ngày 21/7/1954.", "B. Ngày 27/1/1973.", "C. Ngày 7/5/1954.", "D. Ngày 30/4/1975."], "answer": "A", "explain": "Ngày 21/7/1954, Hiệp định Genève được ký kết, chấm dứt chiến tranh, lập lại hòa bình ở Đông Dương; công nhận độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phong trào Đồng Khởi (1959–1960) ở miền Nam có ý nghĩa bước ngoặt nào?", "options": ["A. Kết thúc chiến tranh.", "B. Đưa cách mạng miền Nam từ thế giữ gìn lực lượng sang thế tiến công, làm phá sản chính sách “tố cộng, diệt cộng” của Mỹ – Diệm.", "C. Giải phóng Sài Gòn.", "D. Buộc Mỹ rút quân."], "answer": "B", "explain": "Đồng Khởi (tiêu biểu Bến Tre 17/1/1960) là bước phát triển nhảy vọt: từ giữ gìn lực lượng sang tiến công giành chính quyền ở nhiều xã, ấp; giáng đòn nặng nề vào chính sách khủng bố của Mỹ – Diệm, dẫn đến sự ra đời của Mặt trận Dân tộc Giải phóng miền Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cuộc Tổng tiến công và nổi dậy Tết Mậu Thân diễn ra vào năm nào?", "options": ["A. Năm 1965.", "B. Năm 1972.", "C. Năm 1973.", "D. Năm 1968."], "answer": "D", "explain": "Đêm 30 rạng 31/1/1968 (Tết Mậu Thân), quân dân ta mở cuộc Tổng tiến công và nổi dậy đồng loạt vào các đô thị miền Nam, giáng đòn bất ngờ vào Mỹ – Ngụy, tạo bước ngoặt chiến tranh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiệp định Paris về chấm dứt chiến tranh ở Việt Nam được ký vào ngày nào?", "options": ["A. Ngày 27/1/1973.", "B. Ngày 21/7/1954.", "C. Ngày 30/4/1975.", "D. Ngày 2/7/1976."], "answer": "A", "explain": "Ngày 27/1/1973, Hiệp định Paris được ký kết: Mỹ cam kết tôn trọng độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Việt Nam và rút hết quân về nước — thắng lợi có ý nghĩa chiến lược của cách mạng Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tháng 7/1920, Nguyễn Ái Quốc đã có bước chuyển biến quan trọng nào về tư tưởng?", "options": ["A. Ra đi tìm đường cứu nước.", "B. Đọc bản Sơ thảo lần thứ nhất những Luận cương về vấn đề dân tộc và vấn đề thuộc địa của Lênin, từ đó xác định con đường cứu nước đúng đắn.", "C. Thành lập Đảng.", "D. Về nước lãnh đạo cách mạng."], "answer": "B", "explain": "Tháng 7/1920, Nguyễn Ái Quốc đọc Sơ thảo Luận cương của Lênin, tìm thấy con đường cứu nước đúng đắn: cách mạng vô sản; từ đó Người chuyển hẳn sang lập trường cộng sản, tích cực chuẩn bị thành lập Đảng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đảng Cộng sản Việt Nam ra đời là kết quả của sự kết hợp nào?", "options": ["A. Chủ nghĩa yêu nước và tư tưởng cải lương.", "B. Tư tưởng phong kiến và giai cấp nông dân.", "C. Chủ nghĩa Mác – Lênin với phong trào công nhân và phong trào yêu nước Việt Nam.", "D. Chủ nghĩa tư bản và giai cấp tư sản."], "answer": "C", "explain": "Đảng Cộng sản Việt Nam (3/2/1930) là sản phẩm của sự kết hợp giữa chủ nghĩa Mác – Lênin với phong trào công nhân và phong trào yêu nước — quy luật ra đời của Đảng Cộng sản ở một nước thuộc địa như Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa lịch sử cơ bản nhất của Cách mạng tháng Tám 1945 là gì?", "options": ["A. Lật đổ chế độ phong kiến.", "B. Đánh bại phát xít Nhật.", "C. Mở rộng địa bàn.", "D. Đập tan ách thống trị của đế quốc, phong kiến, lập nên nước Việt Nam Dân chủ Cộng hòa, đưa dân tộc ta bước vào kỷ nguyên độc lập, tự do."], "answer": "D", "explain": "Ý nghĩa cơ bản: CMT8 đập tan xiềng xích nô lệ của Pháp, Nhật, phong kiến; lập nên nhà nước công nông đầu tiên ở Đông Nam Á; mở ra kỷ nguyên mới — kỷ nguyên độc lập, tự do, nhân dân làm chủ đất nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao chiến thắng Điện Biên Phủ được coi là “quyết chiến chiến lược”?", "options": ["A. Vì đây là trận đánh quyết định, làm phá sản hoàn toàn kế hoạch Nava, giáng đòn quyết định vào ý chí xâm lược của Pháp, tạo điều kiện cho thắng lợi ngoại giao ở Genève.", "B. Vì trận đánh diễn ra nhanh.", "C. Vì quân Pháp ít.", "D. Vì ta có ưu thế tuyệt đối."], "answer": "A", "explain": "Điện Biên Phủ là trận quyết chiến chiến lược vì nó quyết định cục diện chiến tranh: đánh bại ý đồ kết thúc chiến tranh có lợi của Pháp, buộc Pháp phải đàm phán và ký Hiệp định Genève với những điều khoản có lợi cho ta.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa chiến lược của Hiệp định Paris (1973) là gì?", "options": ["A. Chấm dứt hoàn toàn chiến tranh.", "B. Công nhận chính quyền Sài Gòn.", "C. Buộc Mỹ rút hết quân, công nhận các quyền dân tộc cơ bản của Việt Nam, tạo so sánh lực lượng có lợi để ta giải phóng hoàn toàn miền Nam.", "D. Chia cắt lâu dài Việt Nam."], "answer": "C", "explain": "Paris 1973 là thắng lợi chiến lược: Mỹ rút quân, ta giữ vững vùng giải phóng; so sánh lực lượng thay đổi có lợi cho cách mạng — tạo tiền đề, thời cơ để mở cuộc Tổng tiến công mùa Xuân 1975, giải phóng hoàn toàn miền Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa lịch sử của đại thắng mùa Xuân 1975 là gì?", "options": ["A. Chỉ giải phóng Sài Gòn.", "B. Chỉ có ý nghĩa quân sự.", "C. Chỉ ảnh hưởng trong nước.", "D. Kết thúc 21 năm kháng chiến chống Mỹ, hoàn thành cách mạng dân tộc dân chủ nhân dân trong cả nước, mở ra kỷ nguyên độc lập, thống nhất và đi lên chủ nghĩa xã hội."], "answer": "D", "explain": "Đại thắng mùa Xuân 1975 kết thúc thắng lợi cuộc kháng chiến chống Mỹ cứu nước; hoàn thành cách mạng dân tộc dân chủ nhân dân trong cả nước; mở ra kỷ nguyên mới — độc lập, thống nhất, cả nước đi lên chủ nghĩa xã hội; có tầm vóc quốc tế và tính thời đại sâu sắc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trọng tâm của công cuộc đổi mới ở Việt Nam (từ 1986) là gì?", "options": ["A. Đổi mới kinh tế: xóa bỏ cơ chế tập trung quan liêu bao cấp, phát triển kinh tế thị trường định hướng xã hội chủ nghĩa.", "B. Đổi mới quân sự.", "C. Đổi mới tôn giáo.", "D. Giữ nguyên mọi thứ."], "answer": "A", "explain": "Đổi mới lấy kinh tế làm trọng tâm: xóa bỏ tập trung quan liêu bao cấp, chuyển sang hạch toán kinh doanh; phát triển nền kinh tế hàng hóa nhiều thành phần, vận hành theo cơ chế thị trường có sự quản lý của Nhà nước, theo định hướng xã hội chủ nghĩa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mục đích của ASEAN được nêu trong Tuyên bố Bangkok (1967) là gì?", "options": ["A. Xây dựng liên minh quân sự.", "B. Thúc đẩy hợp tác, giữ gìn hòa bình, ổn định và phát triển thịnh vượng ở Đông Nam Á.", "C. Can thiệp nội bộ các nước.", "D. Đóng cửa khu vực."], "answer": "B", "explain": "Tuyên bố Bangkok (8/8/1967) xác định mục đích ASEAN: tăng cường hợp tác kinh tế, văn hóa, xã hội; thúc đẩy hòa bình, ổn định khu vực trên cơ sở tôn trọng độc lập, chủ quyền và không can thiệp vào công việc nội bộ của nhau.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việt Nam trở thành thành viên Liên hợp quốc vào ngày nào?", "options": ["A. Ngày 24/10/1945.", "B. Ngày 8/8/1967.", "C. Ngày 20/9/1977.", "D. Ngày 11/1/2007."], "answer": "C", "explain": "Ngày 20/9/1977, Việt Nam chính thức trở thành thành viên thứ 149 của Liên hợp quốc, đánh dấu sự công nhận của cộng đồng quốc tế đối với nước Việt Nam thống nhất, độc lập, có chủ quyền.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trật tự hai cực Yalta sụp đổ vào thời gian nào, đánh dấu sự chấm dứt Chiến tranh lạnh?", "options": ["A. Năm 1945.", "B. Năm 1975.", "C. Năm 1986.", "D. Năm 1991 (Liên Xô tan rã)."], "answer": "D", "explain": "Năm 1991, Liên Xô tan rã, Chiến tranh lạnh chấm dứt, trật tự hai cực Yalta sụp đổ; quan hệ quốc tế chuyển sang xu thế đa cực với sự vươn lên của nhiều trung tâm, tổ chức quốc tế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao ba tổ chức cộng sản ở Việt Nam (1929) cần phải hợp nhất thành một Đảng thống nhất?", "options": ["A. Vì các tổ chức quá mạnh.", "B. Vì sự chia rẽ, tranh giành ảnh hưởng làm suy yếu phong trào cách mạng; cách mạng cần một Đảng thống nhất, vững mạnh để lãnh đạo.", "C. Vì Pháp yêu cầu.", "D. Vì không còn đảng viên."], "answer": "B", "explain": "Sự tồn tại song song, tranh giành ảnh hưởng của ba tổ chức cộng sản gây chia rẽ, làm suy yếu phong trào; Nguyễn Ái Quốc triệu tập Hội nghị hợp nhất (3 – 7/2/1930), thành lập Đảng Cộng sản Việt Nam — đáp ứng yêu cầu bức thiết của cách mạng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bài học kinh nghiệm từ phong trào dân chủ 1936–1939 là gì?", "options": ["A. Chỉ đấu tranh vũ trang.", "B. Không cần mặt trận.", "C. Kết hợp đấu tranh công khai, hợp pháp với bí mật, bất hợp pháp; xây dựng mặt trận dân tộc thống nhất rộng rãi; chớp thời cơ, linh hoạt về sách lược.", "D. Đầu hàng kẻ thù."], "answer": "C", "explain": "Cao trào dân chủ 1936–1939 để lại bài học: kết hợp nhuần nhuyễn các hình thức đấu tranh (công khai – bí mật, hợp pháp – bất hợp pháp); xây dựng Mặt trận Dân chủ Đông Dương rộng rãi; nhạy bén với thời cơ, linh hoạt sách lược — chuẩn bị cho Tổng khởi nghĩa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Điểm giống nhau cơ bản giữa Cách mạng tháng Tám (1945) và đại thắng mùa Xuân (1975) là gì?", "options": ["A. Đều có quân Đồng minh giúp đỡ.", "B. Đều diễn ra trong một ngày.", "C. Đều không cần sự lãnh đạo của Đảng.", "D. Đều là thắng lợi của đường lối cách mạng đúng đắn, của nghệ thuật chớp thời cơ và sức mạnh đại đoàn kết toàn dân tộc dưới sự lãnh đạo của Đảng."], "answer": "D", "explain": "Cả CMT8 và Xuân 1975 đều: do Đảng lãnh đạo với đường lối đúng đắn; biết chớp thời cơ chiến lược (“ngàn năm có một” 1945; thời cơ sau Paris 1973); phát huy sức mạnh đại đoàn kết toàn dân tộc kết hợp sức mạnh thời đại — những nhân tố quyết định thắng lợi của cách mạng Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bài học lớn nhất, xuyên suốt của cách mạng Việt Nam (1945–1975) là gì?", "options": ["A. Sự lãnh đạo đúng đắn, sáng tạo của Đảng Cộng sản Việt Nam là nhân tố quyết định mọi thắng lợi của cách mạng.", "B. Chỉ cần vũ khí hiện đại.", "C. Chỉ cần viện trợ nước ngoài.", "D. Chỉ cần đấu tranh hòa bình."], "answer": "A", "explain": "Bài học lớn nhất: mọi thắng lợi của cách mạng Việt Nam (CMT8, kháng chiến chống Pháp, chống Mỹ) đều gắn liền với sự lãnh đạo đúng đắn, sáng tạo của Đảng — Đảng đề ra đường lối, xây dựng lực lượng, chớp thời cơ, kết hợp sức mạnh dân tộc với sức mạnh thời đại.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Về Tổng khởi nghĩa tháng Tám 1945, xét tính đúng, sai của các nhận định sau:", "statements": ["a) Lệnh Tổng khởi nghĩa được ban bố khi quân Đồng minh đã tiến vào Đông Dương.", "b) Tổng khởi nghĩa tháng Tám chỉ diễn ra ở Hà Nội rồi lan ra một vài tỉnh.", "c) Thắng lợi của Tổng khởi nghĩa gắn liền với sự lãnh đạo đúng đắn, sáng tạo của Đảng và Chủ tịch Hồ Chí Minh.", "d) Cách mạng tháng Tám thành công chủ yếu nhờ sự giúp đỡ trực tiếp về quân sự của Liên Xô."], "answer": ["F", "F", "T", "F"], "explain": "a) Sai: Đảng chủ trương giành chính quyền TRƯỚC khi quân Đồng minh vào Đông Dương (quyết định của Hội nghị Tân Trào 14 – 15/8/1945). b) Sai: Tổng khởi nghĩa nổ ra và thắng lợi trong cả nước (Hà Nội 19/8, Huế 23/8, Sài Gòn 25/8...). c) Đúng: sự lãnh đạo của Đảng là nhân tố quyết định thắng lợi. d) Sai: CMT8 thắng lợi chủ yếu bằng sức mạnh tự lực của toàn dân tộc; sự ủng hộ quốc tế là nhân tố quan trọng nhưng không phải quyết định.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về tầm vóc quốc tế của đại thắng mùa Xuân 1975, xét tính đúng, sai của các nhận định sau:", "statements": ["a) Đại thắng mùa Xuân 1975 chỉ có ý nghĩa trong phạm vi Việt Nam.", "b) Thắng lợi của Việt Nam năm 1975 cổ vũ mạnh mẽ phong trào đấu tranh vì hòa bình, độc lập dân tộc, dân chủ và tiến bộ trên thế giới.", "c) Thắng lợi của Xuân 1975 chủ yếu nhờ vào sự giúp đỡ quân sự trực tiếp của các nước xã hội chủ nghĩa.", "d) Sau năm 1975, đế quốc Mỹ vẫn tiếp tục chiếm đóng một phần lãnh thổ miền Nam Việt Nam."], "answer": ["F", "T", "F", "F"], "explain": "a) Sai: đại thắng mùa Xuân 1975 là sự kiện có tầm vóc quốc tế và tính thời đại sâu sắc. b) Đúng: thắng lợi cổ vũ mạnh mẽ phong trào giải phóng dân tộc, vì hòa bình và tiến bộ trên thế giới. c) Sai: nhân tố quyết định là sự lãnh đạo đúng đắn của Đảng và sức mạnh đại đoàn kết toàn dân tộc; sự giúp đỡ quốc tế là quan trọng nhưng không phải quyết định. d) Sai: chính quyền Sài Gòn sụp đổ hoàn toàn, Mỹ rút hết ảnh hưởng, miền Nam hoàn toàn giải phóng, non sông thu về một mối.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về công cuộc đổi mới đất nước (từ 1986), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Đổi mới là sự nghiệp của toàn Đảng, toàn dân, vì mục tiêu dân giàu, nước mạnh, dân chủ, công bằng, văn minh.", "b) Trọng tâm của công cuộc đổi mới là đổi mới kinh tế.", "c) Đổi mới đồng nghĩa với việc từ bỏ con đường xã hội chủ nghĩa.", "d) Đổi mới đã đưa đất nước thoát khỏi khủng hoảng kinh tế – xã hội, đạt được những thành tựu to lớn, có ý nghĩa lịch sử."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đổi mới là sự nghiệp của nhân dân, do Đảng lãnh đạo, vì mục tiêu dân giàu, nước mạnh, dân chủ, công bằng, văn minh. b) Đúng: Đại hội VI xác định đổi mới kinh tế làm trọng tâm. c) Sai: đổi mới kiên định mục tiêu độc lập dân tộc và chủ nghĩa xã hội; xây dựng kinh tế thị trường định hướng xã hội chủ nghĩa. d) Đúng: thành tựu của đổi mới được đánh giá là “to lớn, có ý nghĩa lịch sử”.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về Cộng đồng ASEAN (thành lập 31/12/2015), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Cộng đồng ASEAN chính thức được thành lập ngày 31/12/2015.", "b) Cộng đồng ASEAN chỉ gồm một trụ cột duy nhất là Cộng đồng Kinh tế.", "c) Việt Nam là thành viên tích cực, có trách nhiệm trong việc xây dựng Cộng đồng ASEAN.", "d) Mục tiêu của Cộng đồng ASEAN là xây dựng khu vực Đông Nam Á hòa bình, ổn định và thịnh vượng."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: 31/12/2015, Cộng đồng ASEAN chính thức được thành lập. b) Sai: Cộng đồng ASEAN gồm 3 trụ cột: Chính trị – An ninh, Kinh tế, Văn hóa – Xã hội. c) Đúng: Việt Nam đóng góp tích cực (Chủ tịch ASEAN 2020, xây dựng Tầm nhìn Cộng đồng ASEAN 2025...). d) Đúng: đây là mục tiêu bao trùm được nêu trong Tuyên bố thành lập Cộng đồng ASEAN.", "points": 1}]}]}</script>
