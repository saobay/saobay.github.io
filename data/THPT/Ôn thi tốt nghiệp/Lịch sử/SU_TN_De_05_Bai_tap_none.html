<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Kỳ họp đầu tiên của Quốc hội khóa I (2/3/1946) đã quyết định thành lập cơ quan nào?", "options": ["A. Chính phủ liên hiệp kháng chiến do Chủ tịch Hồ Chí Minh đứng đầu.", "B. Mặt trận Việt Minh.", "C. Ủy ban khởi nghĩa toàn quốc.", "D. Hội đồng quốc phòng tối cao."], "answer": "A", "explain": "Ngày 2/3/1946, kỳ họp thứ nhất Quốc hội khóa I thành lập Chính phủ liên hiệp kháng chiến do Chủ tịch Hồ Chí Minh đứng đầu, củng cố khối đoàn kết toàn dân tộc trong tình thế “ngàn cân treo sợi tóc”.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bản Hiến pháp đầu tiên của nước Việt Nam Dân chủ Cộng hòa được Quốc hội thông qua vào ngày nào?", "options": ["A. Ngày 2/9/1945.", "B. Ngày 6/1/1946.", "C. Ngày 9/11/1946.", "D. Ngày 25/4/1976."], "answer": "C", "explain": "Ngày 9/11/1946, Quốc hội khóa I thông qua bản Hiến pháp đầu tiên của nước Việt Nam Dân chủ Cộng hòa — bản Hiến pháp dân chủ, tiến bộ, khẳng định quyền làm chủ của nhân dân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngày 18/12/1946, thực dân Pháp đã có hành động nào khiêu khích, buộc nhân dân ta phải đứng lên kháng chiến?", "options": ["A. Ký hiệp định hòa bình.", "B. Rút quân về nước.", "C. Trao trả độc lập cho Việt Nam.", "D. Gửi tối hậu thư đòi Chính phủ ta giải tán lực lượng tự vệ, giao quyền kiểm soát Hà Nội cho Pháp."], "answer": "D", "explain": "Ngày 18/12/1946, Pháp gửi tối hậu thư đòi ta giải tán lực lượng tự vệ, tước vũ khí của Vệ quốc đoàn, giao quyền kiểm soát thủ đô cho Pháp. Trước hành động xâm lược trắng trợn, đêm 19/12/1946 cả nước đứng lên kháng chiến.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đại hội đại biểu toàn quốc lần thứ II của Đảng (tháng 2/1951) có quyết định quan trọng nào?", "options": ["A. Đưa Đảng ra hoạt động công khai, lấy tên là Đảng Lao động Việt Nam.", "B. Giải tán Đảng Cộng sản Đông Dương.", "C. Sáp nhập với Đảng Xã hội.", "D. Đổi tên nước."], "answer": "A", "explain": "Đại hội II (2/1951, Chiêm Hóa, Tuyên Quang) quyết định đưa Đảng ra hoạt động công khai với tên gọi Đảng Lao động Việt Nam, thông qua Chính cương, Điều lệ mới, bầu Ban Chấp hành Trung ương do Chủ tịch Hồ Chí Minh làm Chủ tịch.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kế hoạch Đờ Lát đơ Tátxinhi (tháng 12/1950) là kế hoạch quân sự của ai?", "options": ["A. Của Mỹ ở miền Nam Việt Nam.", "B. Của thực dân Pháp ở Đông Dương, hòng giành lại thế chủ động đã mất sau chiến dịch Biên giới.", "C. Của quân đội Sài Gòn.", "D. Của phát xít Nhật."], "answer": "B", "explain": "Sau thất bại ở Biên giới (1950), Pháp cử tướng Đờ Lát đơ Tátxinhi sang làm Tổng chỉ huy, đề ra kế hoạch mới (12/1950): xây dựng hệ thống phòng thủ, mở các cuộc tiến công, hòng giành lại thế chủ động chiến lược đã mất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiến dịch Tây Bắc (tháng 10 – 12/1952) đã giải phóng phần lớn các tỉnh nào?", "options": ["A. Cao Bằng, Lạng Sơn.", "B. Hà Nội, Hải Phòng.", "C. Sơn La (trừ Nà Sản), Lai Châu, Yên Bái và một phần Lào Cai.", "D. Huế, Đà Nẵng."], "answer": "C", "explain": "Chiến dịch Tây Bắc (14/10 – 10/12/1952) giải phóng Sơn La (trừ phân khu Nà Sản), Lai Châu, Yên Bái, mở rộng căn cứ địa Việt Bắc, tạo thế uy hiếp địch ở trung du và đồng bằng Bắc Bộ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đường mòn Hồ Chí Minh trên bộ được mở vào thời gian nào?", "options": ["A. Tháng 1/1960.", "B. Tháng 12/1960.", "C. Tháng 3/1975.", "D. Tháng 5/1959 (Đoàn 559 được thành lập, mở đường Trường Sơn)."], "answer": "D", "explain": "Tháng 5/1959, Đoàn 559 được thành lập, mở đường Trường Sơn — đường mòn Hồ Chí Minh chi viện cho miền Nam, trở thành tuyến vận tải chiến lược của cuộc kháng chiến.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chính phủ Cách mạng lâm thời Cộng hòa miền Nam Việt Nam được thành lập vào ngày nào?", "options": ["A. Ngày 20/12/1960.", "B. Ngày 6/6/1969.", "C. Ngày 30/4/1975.", "D. Ngày 27/1/1973."], "answer": "B", "explain": "Ngày 6/6/1969, Chính phủ Cách mạng lâm thời Cộng hòa miền Nam Việt Nam được thành lập, là chính phủ hợp pháp đại diện cho nhân dân miền Nam, tham gia đàm phán và ký kết Hiệp định Paris (1973).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cuộc khởi nghĩa Yên Bái (tháng 2/1930) do tổ chức nào lãnh đạo?", "options": ["A. Hội Việt Nam Cách mạng Thanh niên.", "B. Đông Dương Cộng sản đảng.", "C. Việt Nam Quốc dân Đảng do Nguyễn Thái Học lãnh đạo.", "D. Đảng Cộng sản Đông Dương."], "answer": "C", "explain": "Ngày 9/2/1930, Việt Nam Quốc dân Đảng do Nguyễn Thái Học lãnh đạo phát động khởi nghĩa Yên Bái (sau đó lan ra Phú Thọ, Hải Dương, Hà Nội...). Khởi nghĩa thất bại, chấm dứt vai trò của khuynh hướng dân chủ tư sản trong phong trào giải phóng dân tộc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác phẩm “Đường Kách mệnh” (1927) là của ai, có ý nghĩa nào?", "options": ["A. Của Phan Bội Châu, kêu gọi Đông Du.", "B. Của Phan Châu Trinh, đòi cải cách.", "C. Của Trần Phú, là Luận cương chính trị.", "D. Của Nguyễn Ái Quốc, tập hợp các bài giảng ở Quảng Châu, truyền bá chủ nghĩa Mác – Lênin vào Việt Nam, chuẩn bị về tư tưởng cho sự ra đời của Đảng."], "answer": "D", "explain": "“Đường Kách mệnh” (1927) tập hợp các bài giảng của Nguyễn Ái Quốc tại lớp huấn luyện ở Quảng Châu (Trung Quốc), là văn kiện lý luận quan trọng truyền bá chủ nghĩa Mác – Lênin, vạch đường lối cách mạng Việt Nam, chuẩn bị về tư tưởng, tổ chức cho sự thành lập Đảng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khối quân sự SEATO do Mỹ lập ra ở Đông Nam Á vào thời gian nào?", "options": ["A. Tháng 9/1954.", "B. Tháng 7/1956.", "C. Tháng 8/1967.", "D. Tháng 1/1973."], "answer": "A", "explain": "Tháng 9/1954, Mỹ lập khối quân sự Đông Nam Á (SEATO) gồm 8 nước, đặt trụ sở ở Bangkok, hòng ngăn chặn “làn sóng cộng sản”, biến Đông Nam Á thành tiền đồn chống chủ nghĩa xã hội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hội nghị Ban Chấp hành Trung ương Đảng lần thứ 8 (tháng 5/1941) đã quyết định chuyển hướng đấu tranh nào?", "options": ["A. Đặt nhiệm vụ giải phóng dân tộc lên hàng đầu, thành lập Mặt trận Việt Minh.", "B. Phát động tổng khởi nghĩa ngay lập tức.", "C. Giải tán các tổ chức quần chúng.", "D. Liên minh với phát xít Nhật."], "answer": "B", "explain": "Hội nghị Trung ương 8 (5/1941, Pác Bó, Cao Bằng) do Nguyễn Ái Quốc chủ trì, quyết định chuyển hướng: đặt nhiệm vụ giải phóng dân tộc lên hàng đầu, tạm gác khẩu hiệu cách mạng ruộng đất, thành lập Mặt trận Việt Minh, xúc tiến chuẩn bị khởi nghĩa vũ trang.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa của bản Hiến pháp 1946 đối với nước Việt Nam Dân chủ Cộng hòa là gì?", "options": ["A. Chỉ là văn bản hình thức.", "B. Sao chép hiến pháp Pháp.", "C. Là bản Hiến pháp dân chủ, tiến bộ đầu tiên, khẳng định quyền làm chủ của nhân dân, tính hợp hiến, hợp pháp của chính quyền cách mạng.", "D. Hạn chế quyền tự do của nhân dân."], "answer": "C", "explain": "Hiến pháp 1946 là bản Hiến pháp dân chủ đầu tiên của Việt Nam: khẳng định nước Việt Nam là nước dân chủ cộng hòa, mọi quyền lực thuộc về nhân dân; quy định các quyền tự do, dân chủ cơ bản, tạo cơ sở pháp lý vững chắc cho chính quyền cách mạng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Đại hội II của Đảng (2/1951) là mốc quan trọng trong quá trình lãnh đạo cách mạng?", "options": ["A. Vì Đảng ra hoạt động công khai với tên Đảng Lao động Việt Nam, tăng cường sự lãnh đạo trực tiếp, toàn diện đối với cuộc kháng chiến đang bước vào giai đoạn quyết liệt.", "B. Vì Đảng tuyên bố giải tán.", "C. Vì Đảng rút vào hoạt động bí mật.", "D. Vì Đảng đổi tên thành Đảng Cộng sản Việt Nam."], "answer": "A", "explain": "Đại hội II đưa Đảng ra công khai (Đảng Lao động Việt Nam), khẳng định vai trò lãnh đạo trực tiếp của Đảng đối với cuộc kháng chiến; thông qua Chính cương mới, phát động phong trào thi đua yêu nước, đẩy mạnh kháng chiến đến thắng lợi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiến dịch Tây Bắc (1952) không giải phóng được cứ điểm nào của Pháp?", "options": ["A. Nghĩa Lộ.", "B. Phân khu Nà Sản (Sơn La) — Pháp xây dựng thành tập đoàn cứ điểm mạnh, ta chưa tiêu diệt được.", "C. Tuần Giáo.", "D. Mộc Châu."], "answer": "B", "explain": "Trong chiến dịch Tây Bắc (1952), ta giải phóng nhiều địa bàn nhưng chưa tiêu diệt được phân khu Nà Sản — nơi Pháp tập trung xây dựng thành tập đoàn cứ điểm mạnh theo kiểu “con nhím”. Bài học Nà Sản giúp ta có cách đánh phù hợp sau này ở Điện Biên Phủ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đoàn 559 — đơn vị mở đường Trường Sơn chi viện cho miền Nam — được thành lập vào thời gian nào?", "options": ["A. Tháng 1/1960.", "B. Tháng 12/1960.", "C. Tháng 5/1959.", "D. Tháng 3/1965."], "answer": "C", "explain": "Tháng 5/1959, Đoàn 559 (sau là Binh đoàn Trường Sơn) được thành lập, mở đường mòn Hồ Chí Minh trên dãy Trường Sơn, trở thành tuyến chi viện chiến lược bằng đường bộ từ miền Bắc vào miền Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Mỹ thành lập khối quân sự SEATO (1954) ở Đông Nam Á?", "options": ["A. Để giúp các nước Đông Nam Á phát triển kinh tế.", "B. Để thúc đẩy hòa bình thế giới.", "C. Để giải trừ quân bị.", "D. Nhằm ngăn chặn sự lan rộng của chủ nghĩa xã hội, biến Đông Nam Á thành tiền đồn chống cộng, hợp thức hóa sự can thiệp của Mỹ vào Đông Dương."], "answer": "D", "explain": "SEATO (9/1954) là công cụ để Mỹ thực hiện chiến lược toàn cầu ngăn chặn cộng sản: lấy cớ “bảo vệ” Đông Nam Á, Mỹ hợp thức hóa việc can thiệp, viện trợ quân sự cho chính quyền tay sai, chuẩn bị thay chân Pháp ở Đông Dương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung cơ bản của ba chiến lược chiến tranh (“Chiến tranh đặc biệt”, “Chiến tranh cục bộ”, “Việt Nam hóa chiến tranh”) mà Mỹ thực hiện ở miền Nam là gì?", "options": ["A. Đều là chiến tranh xâm lược thực dân kiểu mới của Mỹ hòng biến miền Nam thành thuộc địa kiểu mới.", "B. Đều chỉ sử dụng quân đội Sài Gòn mà không có sự can thiệp của Mỹ.", "C. Đều được nhân dân miền Nam nhiệt tình ủng hộ.", "D. Đều giành thắng lợi hoàn toàn."], "answer": "A", "explain": "Cả ba chiến lược đều là hình thức chiến tranh xâm lược thực dân kiểu mới: Mỹ là kẻ chủ mưu, viện trợ, chỉ huy; chính quyền và quân đội Sài Gòn là công cụ tay sai; mục tiêu là chia cắt lâu dài Việt Nam, biến miền Nam thành thuộc địa kiểu mới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thành tựu nổi bật về kinh tế của Việt Nam sau hơn 35 năm đổi mới là gì?", "options": ["A. Kinh tế suy thoái kéo dài.", "B. Kinh tế tăng trưởng liên tục, từ nước thiếu lương thực trở thành nước xuất khẩu gạo hàng đầu thế giới; đời sống nhân dân được cải thiện rõ rệt.", "C. Vẫn là nước nông nghiệp lạc hậu.", "D. Phụ thuộc hoàn toàn vào viện trợ."], "answer": "B", "explain": "Sau đổi mới, kinh tế Việt Nam tăng trưởng khá liên tục; từ nước phải nhập lương thực đã trở thành một trong những nước xuất khẩu gạo, cà phê, thủy sản hàng đầu thế giới; cơ cấu kinh tế chuyển dịch tích cực, đời sống nhân dân nâng cao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cộng đồng ASEAN (thành lập 31/12/2015) gồm ba trụ cột nào?", "options": ["A. Quân sự, ngoại giao, tài chính.", "B. Giáo dục, y tế, môi trường.", "C. Nông nghiệp, công nghiệp, dịch vụ.", "D. Chính trị – an ninh, kinh tế, văn hóa – xã hội."], "answer": "D", "explain": "Cộng đồng ASEAN (chính thức 31/12/2015) được xây dựng trên 3 trụ cột: Cộng đồng Chính trị – An ninh, Cộng đồng Kinh tế và Cộng đồng Văn hóa – Xã hội, hướng tới một khu vực hòa bình, ổn định và thịnh vượng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phong trào cách mạng 1930–1931 (đỉnh cao là Xô viết Nghệ Tĩnh) có ý nghĩa lịch sử nào?", "options": ["A. Là cuộc tổng diễn tập đầu tiên của cách mạng Việt Nam dưới sự lãnh đạo của Đảng, khẳng định đường lối đúng đắn và để lại nhiều bài học quý.", "B. Buộc thực dân Pháp phải trao trả độc lập ngay lập tức.", "C. Không để lại bài học kinh nghiệm gì.", "D. Giành được chính quyền trong cả nước."], "answer": "A", "explain": "Phong trào 1930–1931 là cuộc tổng diễn tập đầu tiên của cách mạng Việt Nam: khẳng định vai trò lãnh đạo của Đảng, để lại bài học về xây dựng khối liên minh công – nông, về xây dựng chính quyền cách mạng của dân, do dân, vì dân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biểu hiện của xu thế đa cực trong quan hệ quốc tế sau Chiến tranh lạnh là gì?", "options": ["A. Chỉ có một siêu cường duy nhất chi phối mọi việc.", "B. Nhiều trung tâm, tổ chức quốc tế (Mỹ, Trung Quốc, Nga, EU, Nhật Bản, ASEAN...) ngày càng có vai trò quan trọng, không một thế lực nào chi phối tuyệt đối.", "C. Thế giới không còn tổ chức quốc tế nào.", "D. Các nước đều đóng cửa biên giới, không quan hệ với nhau."], "answer": "B", "explain": "Sau Chiến tranh lạnh, trật tự hai cực sụp đổ, thế giới phát triển theo xu thế đa cực: nhiều cường quốc, trung tâm kinh tế – chính trị cùng tồn tại, vừa cạnh tranh vừa hợp tác; vai trò của Liên hợp quốc và các tổ chức khu vực ngày càng được đề cao.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhận định nào sau đây đúng về vai trò của Chủ tịch Hồ Chí Minh trong Cách mạng tháng Tám 1945?", "options": ["A. Người không tham gia lãnh đạo cách mạng.", "B. Người chỉ hoạt động ở nước ngoài.", "C. Người là linh hồn của cách mạng: sáng lập Đảng, tìm đường cứu nước, trực tiếp chỉ đạo xây dựng lực lượng, chớp thời cơ phát động Tổng khởi nghĩa và khai sinh nước Việt Nam Dân chủ Cộng hòa.", "D. Người chủ trương chờ quân Đồng minh vào mới khởi nghĩa."], "answer": "C", "explain": "Hồ Chí Minh là người sáng lập, rèn luyện Đảng; trực tiếp chỉ đạo chuẩn bị khởi nghĩa (Tân Trào 8/1945); với nhãn quan chính trị sắc bén, Người cùng Trung ương chớp thời cơ “ngàn năm có một”, phát động Tổng khởi nghĩa thắng lợi và đọc Tuyên ngôn độc lập khai sinh nước VNDCCH.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao cuộc kháng chiến chống thực dân Pháp (1946–1954) của nhân dân Việt Nam phải là cuộc kháng chiến “trường kỳ”?", "options": ["A. Vì ta muốn kéo dài chiến tranh.", "B. Vì Pháp quá yếu.", "C. Vì ta chờ Mỹ giúp đỡ.", "D. Vì tương quan lực lượng ban đầu ta yếu hơn địch nhiều (địch mạnh về vũ khí, kinh tế), ta phải vừa kháng chiến vừa kiến quốc, từng bước làm chuyển hóa so sánh lực lượng có lợi cho ta, tiến tới tổng phản công."], "answer": "D", "explain": "Tính chất “trường kỳ” xuất phát từ so sánh lực lượng: địch mạnh hơn ta về quân sự, kinh tế; ta lấy ít đánh nhiều, vừa kháng chiến vừa kiến quốc, phát huy sức mạnh chiến tranh nhân dân, từng bước làm địch suy yếu, ta lớn mạnh, giành thế chủ động rồi tổng phản công giành thắng lợi.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Về Hiệp định Sơ bộ Việt – Pháp (6/3/1946), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Hiệp định Sơ bộ (6/3/1946) là văn bản Pháp công nhận Việt Nam là một quốc gia tự do, có chính phủ, nghị viện, quân đội và tài chính riêng.", "b) Theo Hiệp định Sơ bộ, Việt Nam đồng ý cho 20 vạn quân Pháp kéo vào miền Bắc thay quân Trung Hoa Dân quốc.", "c) Việc ký Hiệp định Sơ bộ thể hiện sự nhân nhượng vô nguyên tắc của Đảng và Chính phủ ta trước thực dân Pháp.", "d) Hiệp định Sơ bộ thể hiện sách lược “hòa để tiến”, giúp ta có thêm thời gian hòa hoãn để củng cố lực lượng, chuẩn bị kháng chiến lâu dài."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng: đây là nội dung cốt lõi của Hiệp định Sơ bộ. b) Sai: ta chỉ đồng ý cho 15.000 quân Pháp ra Bắc thay thế 20 vạn quân Trung Hoa Dân quốc về nước. c) Sai: ta nhân nhượng có nguyên tắc — nhân nhượng về kinh tế, văn hóa nhưng kiên quyết không nhân nhượng về độc lập, chủ quyền quốc gia. d) Đúng: “hòa để tiến” — tranh thủ hòa hoãn, đẩy bớt kẻ thù, chuẩn bị lực lượng cho cuộc kháng chiến không thể tránh khỏi.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về cuộc tiến công chiến lược Đông – Xuân 1953–1954, xét tính đúng, sai của các nhận định sau:", "statements": ["a) Trong Đông – Xuân 1953–1954, ta chỉ mở một hướng tiến công duy nhất vào Điện Biên Phủ.", "b) Cuộc tiến công Đông – Xuân đã buộc Nava phải tập trung toàn bộ lực lượng cơ động ở đồng bằng Bắc Bộ.", "c) Thắng lợi của Đông – Xuân 1953–1954 bước đầu làm phá sản kế hoạch Nava, tạo điều kiện thuận lợi để ta mở chiến dịch Điện Biên Phủ.", "d) Sau Đông – Xuân 1953–1954, thực dân Pháp hoàn toàn bị động và phải đầu hàng ngay lập tức."], "answer": ["F", "F", "T", "F"], "explain": "a) Sai: ta mở nhiều hướng tiến công (Tây Bắc, Trung Lào, Thượng Lào, Bắc Tây Nguyên, đường 9...), chỉ để một bộ phận vây Điện Biên Phủ. b) Sai: ngược lại, ta buộc Nava phải phân tán lực lượng thành 5 nơi đối phó. c) Đúng: Đông – Xuân làm phá sản bước đầu kế hoạch Nava, tạo thế chiến lược thuận lợi cho trận quyết chiến Điện Biên Phủ. d) Sai: Pháp vẫn ngoan cố, tập trung xây dựng Điện Biên Phủ thành tập đoàn cứ điểm; phải đến thắng lợi Điện Biên Phủ (7/5/1954) mới giáng đòn quyết định.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về cuộc Tổng tiến công và nổi dậy mùa Xuân 1975, xét tính đúng, sai của các nhận định sau:", "statements": ["a) Chiến dịch Tây Nguyên là chiến dịch cuối cùng của cuộc Tổng tiến công và nổi dậy mùa Xuân 1975.", "b) Thắng lợi của chiến dịch Tây Nguyên (3/1975) tạo ra thời cơ chiến lược để ta chuyển sang tổng tiến công trên toàn chiến trường miền Nam.", "c) Chiến dịch Hồ Chí Minh (26 – 30/4/1975) là chiến dịch quyết chiến chiến lược, giải phóng Sài Gòn, kết thúc thắng lợi cuộc kháng chiến chống Mỹ.", "d) Sau đại thắng mùa Xuân 1975, đế quốc Mỹ vẫn tiếp tục duy trì chính quyền tay sai ở miền Nam Việt Nam."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: Tây Nguyên là chiến dịch mở màn (4 – 24/3/1975); tiếp đó là Huế – Đà Nẵng và chiến dịch Hồ Chí Minh. b) Đúng: thắng lợi Tây Nguyên tạo bước ngoặt, Bộ Chính trị quyết định mở Tổng tiến công và nổi dậy trên toàn miền Nam. c) Đúng: chiến dịch Hồ Chí Minh toàn thắng (trưa 30/4/1975), giải phóng Sài Gòn – Gia Định, kết thúc 21 năm kháng chiến chống Mỹ. d) Sai: chính quyền Sài Gòn sụp đổ hoàn toàn, Mỹ rút hết ảnh hưởng, miền Nam hoàn toàn giải phóng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về xu thế toàn cầu hóa và hội nhập quốc tế của Việt Nam, xét tính đúng, sai của các nhận định sau:", "statements": ["a) Toàn cầu hóa là xu thế phát triển mạnh mẽ từ những năm 80 của thế kỷ XX, biểu hiện ở sự gia tăng nhanh chóng của thương mại, đầu tư và tài chính quốc tế.", "b) Toàn cầu hóa vừa tạo ra thời cơ, vừa đặt ra thách thức đối với các nước đang phát triển, trong đó có Việt Nam.", "c) Trước xu thế toàn cầu hóa, Việt Nam chủ trương đóng cửa, không hội nhập với bên ngoài.", "d) Để hội nhập quốc tế, Việt Nam đã gia nhập ASEAN (1995), APEC (1998), WTO (2007) và ký kết nhiều hiệp định thương mại tự do thế hệ mới."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đây là đặc trưng cơ bản của toàn cầu hóa từ thập niên 80 thế kỷ XX. b) Đúng: toàn cầu hóa mang đến cơ hội phát triển nhưng cũng đặt ra thách thức (cạnh tranh gay gắt, nguy cơ tụt hậu, ảnh hưởng văn hóa...). c) Sai: Việt Nam chủ trương chủ động, tích cực hội nhập quốc tế toàn diện, sâu rộng. d) Đúng: Việt Nam hội nhập sâu rộng — ASEAN, APEC, WTO, CPTPP, EVFTA... — nâng cao vị thế đất nước.", "points": 1}]}]}</script>
