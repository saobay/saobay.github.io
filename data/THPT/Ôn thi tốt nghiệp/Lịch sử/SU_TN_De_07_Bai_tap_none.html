<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Chiến dịch Điện Biên Phủ (1954) được tiến hành qua mấy đợt tiến công?", "options": ["A. Một đợt duy nhất.", "B. Ba đợt: đợt 1 (13 – 17/3), đợt 2 (30/3 – 30/4), đợt 3 (1 – 7/5/1954).", "C. Hai đợt.", "D. Năm đợt."], "answer": "B", "explain": "Chiến dịch Điện Biên Phủ diễn ra qua 3 đợt: đợt 1 (13 – 17/3/1954) tiêu diệt Him Lam, Độc Lập, Bản Kéo; đợt 2 (30/3 – 30/4) đánh vào phân khu trung tâm; đợt 3 (1 – 7/5) tổng tiến công, chiều 7/5 toàn thắng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ai là viên tướng chỉ huy tập đoàn cứ điểm Điện Biên Phủ của Pháp?", "options": ["A. Nava.", "B. Đờ Lát đơ Tátxinhi.", "C. Đờ Cátxtơri (De Castries).", "D. Rơve."], "answer": "C", "explain": "Thiếu tướng Đờ Cátxtơri được Nava cử làm chỉ huy tập đoàn cứ điểm Điện Biên Phủ; chiều 7/5/1954, Đờ Cátxtơri cùng toàn bộ Bộ tham mưu bị bắt sống, tập đoàn cứ điểm sụp đổ hoàn toàn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thực dân Pháp đã tập trung bao nhiêu quân tại tập đoàn cứ điểm Điện Biên Phủ?", "options": ["A. Khoảng 5.000 quân.", "B. Khoảng 50.000 quân.", "C. Khoảng 100.000 quân.", "D. Khoảng 16.200 quân tinh nhuệ với hệ thống công sự vững chắc."], "answer": "D", "explain": "Pháp tập trung ở Điện Biên Phủ khoảng 16.200 quân tinh nhuệ (trong đó có nhiều tiểu đoàn Âu – Phi), được trang bị hiện đại, bố phòng trong 49 cứ điểm thành hệ thống liên hoàn — được coi là “pháo đài bất khả xâm phạm”.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trưởng đoàn đại biểu Chính phủ Việt Nam Dân chủ Cộng hòa tại Hội nghị Genève (1954) là ai?", "options": ["A. Phạm Văn Đồng.", "B. Hồ Chí Minh.", "C. Võ Nguyên Giáp.", "D. Trường Chinh."], "answer": "A", "explain": "Đoàn đại biểu Chính phủ Việt Nam Dân chủ Cộng hòa do Phó Thủ tướng Phạm Văn Đồng làm trưởng đoàn, đã đấu tranh kiên cường, khôn khéo tại Hội nghị Genève, góp phần giành thắng lợi ngoại giao quan trọng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngày thành lập Quân đội nhân dân Việt Nam là ngày nào?", "options": ["A. Ngày 19/12/1946.", "B. Ngày 22/12/1944 (Đội Việt Nam Tuyên truyền Giải phóng quân).", "C. Ngày 7/5/1954.", "D. Ngày 30/4/1975."], "answer": "B", "explain": "Ngày 22/12/1944, tại Cao Bằng, Đội Việt Nam Tuyên truyền Giải phóng quân — tiền thân của Quân đội nhân dân Việt Nam — được thành lập với 34 chiến sĩ do Võ Nguyên Giáp chỉ huy; ngày 22/12 hằng năm là Ngày thành lập Quân đội nhân dân Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đội Việt Nam Tuyên truyền Giải phóng quân khi thành lập có bao nhiêu chiến sĩ?", "options": ["A. 100 chiến sĩ.", "B. 1.000 chiến sĩ.", "C. 10 chiến sĩ.", "D. 34 chiến sĩ."], "answer": "D", "explain": "Đội Việt Nam Tuyên truyền Giải phóng quân thành lập ngày 22/12/1944 gồm 34 chiến sĩ, với vũ khí thô sơ nhưng tinh thần quyết chiến cao; hai ngày sau đã giành thắng lợi ở Phai Khắt, Nà Ngần, mở đầu truyền thống của Quân đội nhân dân Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kế hoạch Rơve (1949) là kế hoạch quân sự của thực dân Pháp nhằm mục đích gì?", "options": ["A. Tăng cường đánh phá căn cứ địa Việt Bắc, khóa chặt biên giới Việt – Trung, hòng kết thúc chiến tranh.", "B. Rút quân về nước.", "C. Đàm phán với Việt Nam.", "D. Mở rộng chiến tranh ra toàn Đông Dương bằng quân Mỹ."], "answer": "A", "explain": "Kế hoạch Rơve (1949) chủ trương tăng cường hệ thống phòng ngự trên đường số 4, mở rộng kiểm soát, khóa chặt biên giới để cô lập căn cứ địa Việt Bắc, tiến tới tiêu diệt cơ quan đầu não ta — nhưng bị phá sản bởi chiến dịch Biên giới (1950).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiến thắng Ấp Bắc (2/1/1963) có ý nghĩa nào?", "options": ["A. Mở đầu phong trào Đồng Khởi.", "B. Đánh bại chiến thuật “trực thăng vận”, “thiết xa vận” của Mỹ – Ngụy, chứng tỏ quân dân miền Nam có khả năng đánh bại chiến lược “Chiến tranh đặc biệt”.", "C. Giải phóng Sài Gòn.", "D. Kết thúc chiến tranh."], "answer": "B", "explain": "Chiến thắng Ấp Bắc (2/1/1963, Mỹ Tho) đánh bại cuộc càn quét lớn với chiến thuật “trực thăng vận”, “thiết xa vận” hiện đại của Mỹ – Ngụy, cổ vũ phong trào đấu tranh, chứng tỏ cách đánh của quân dân miền Nam có thể thắng Mỹ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiến thắng Đồng Xoài (tháng 6/1965) giáng đòn vào chiến lược chiến tranh nào của Mỹ?", "options": ["A. Chiến tranh phá hoại.", "B. Việt Nam hóa chiến tranh.", "C. Chiến tranh đặc biệt.", "D. Chiến tranh cục bộ."], "answer": "C", "explain": "Chiến thắng Đồng Xoài (9/6 – 20/6/1965, Phước Long) cùng các thắng lợi Bình Giã, Ba Gia đã làm phá sản về cơ bản chiến lược “Chiến tranh đặc biệt”, buộc Mỹ phải chuyển sang “Chiến tranh cục bộ”.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiến thắng Vạn Tường (tháng 8/1965) là thắng lợi chống chiến lược chiến tranh nào của Mỹ?", "options": ["A. Chiến tranh đặc biệt.", "B. Việt Nam hóa chiến tranh.", "C. Chiến tranh phá hoại.", "D. Chiến tranh cục bộ (đánh bại quân viễn chinh Mỹ)."], "answer": "D", "explain": "Ngày 18/8/1965, quân dân Quảng Ngãi đánh bại cuộc hành quân tìm diệt của 9.000 quân viễn chinh Mỹ ở Vạn Tường, mở đầu cao trào “tìm Mỹ mà đánh, lùng Ngụy mà diệt”, chứng tỏ khả năng đánh thắng quân Mỹ của quân dân miền Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tiếng bom Sa Điện (tháng 6/1924) gắn với tên tuổi của nhà yêu nước nào?", "options": ["A. Phạm Hồng Thái.", "B. Nguyễn Thái Học.", "C. Phan Bội Châu.", "D. Lương Ngọc Quyến."], "answer": "A", "explain": "Ngày 19/6/1924, Phạm Hồng Thái — hội viên Tâm Tâm xã — ném bom mưu sát Toàn quyền Đông Dương Merlin tại Sa Điện (Quảng Châu, Trung Quốc), gây tiếng vang lớn, thức tỉnh tinh thần yêu nước, báo hiệu thời kỳ đấu tranh mới của cách mạng Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tân Việt Cách mạng Đảng (thành lập 1929) là tổ chức tiền thân của tổ chức nào?", "options": ["A. Việt Nam Quốc dân Đảng.", "B. Hội Việt Nam Cách mạng Thanh niên.", "C. Đông Dương Cộng sản liên đoàn (một trong ba tổ chức cộng sản năm 1929).", "D. Đảng Dân chủ Việt Nam."], "answer": "C", "explain": "Tân Việt Cách mạng Đảng (1929) sau khi phân hóa, những đảng viên tiên tiến thành lập Đông Dương Cộng sản liên đoàn — một trong ba tổ chức cộng sản tiền thân của Đảng Cộng sản Việt Nam (cùng Đông Dương Cộng sản đảng và An Nam Cộng sản đảng).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao thực dân Pháp chọn Điện Biên Phủ để xây dựng tập đoàn cứ điểm mạnh nhất Đông Dương?", "options": ["A. Vì Điện Biên Phủ gần Hà Nội.", "B. Vì Điện Biên Phủ là thủ đô của Việt Nam.", "C. Vì muốn rút quân an toàn.", "D. Vì Điện Biên Phủ có vị trí chiến lược ở Tây Bắc, khống chế cả một vùng rộng lớn Tây Bắc và Thượng Lào; Pháp hòng thu hút, tiêu diệt bộ đội chủ lực của ta trong một trận quyết chiến."], "answer": "D", "explain": "Nava chọn Điện Biên Phủ vì vị trí chiến lược: ngã ba biên giới Việt – Lào – Trung, khống chế Tây Bắc và Thượng Lào; Pháp muốn “nhử” chủ lực ta lên để tiêu diệt trong trận quyết chiến — nhưng ta đã biến nơi đây thành “mồ chôn” quân viễn chinh Pháp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc chuyển phương châm tác chiến từ “đánh nhanh, giải quyết nhanh” sang “đánh chắc, tiến chắc” ở Điện Biên Phủ thể hiện điều gì?", "options": ["A. Tư tưởng chỉ đạo tác chiến đúng đắn, sáng tạo: đánh giá đúng địch – ta, kiên quyết nhưng thận trọng, chắc thắng mới đánh.", "B. Sự chủ quan, khinh địch.", "C. Sự sao chép máy móc.", "D. Sự dao động, thiếu quyết tâm."], "answer": "A", "explain": "Quyết định chuyển phương châm (1/1954) của Đại tướng Võ Nguyên Giáp thể hiện sự đánh giá đúng tình hình, tư tưởng “đánh chắc thắng”: kéo pháo ra, đào chiến hào vây lấn — đảm bảo chắc thắng cho trận quyết chiến chiến lược, tránh tổn thất không cần thiết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao chiến thắng Ấp Bắc (1963) được coi là tiếng súng báo hiệu sự phá sản của “Chiến tranh đặc biệt”?", "options": ["A. Vì Ấp Bắc là thủ đô của miền Nam.", "B. Vì ta đã đánh bại chiến thuật hiện đại nhất của Mỹ (“trực thăng vận”, “thiết xa vận”), chứng tỏ quân Ngụy dù được Mỹ trang bị hiện đại vẫn bị đánh bại, làm lung lay niềm tin của Mỹ vào chiến lược này.", "C. Vì Mỹ rút quân ngay sau đó.", "D. Vì chính quyền Diệm sụp đổ ngay."], "answer": "B", "explain": "Ấp Bắc đánh bại cuộc càn với trực thăng, xe bọc thép hiện đại — vũ khí “át chủ bài” của “Chiến tranh đặc biệt”; thắng lợi chứng tỏ quân dân miền Nam hoàn toàn có thể đánh thắng Mỹ – Ngụy, báo hiệu sự phá sản không tránh khỏi của chiến lược này.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh kế hoạch Rơve (1949) và kế hoạch Nava (1953) của Pháp, điểm giống nhau là gì?", "options": ["A. Đều là kế hoạch rút quân.", "B. Đều là kế hoạch đàm phán.", "C. Đều là kế hoạch quân sự hòng giành lại thế chủ động, kết thúc chiến tranh có lợi cho Pháp, nhưng đều bị quân dân Việt Nam làm phá sản.", "D. Đều thành công."], "answer": "C", "explain": "Rơve (1949) và Nava (1953) đều là nỗ lực quân sự lớn của Pháp hòng giành thế chủ động, kết thúc chiến tranh: Rơve bị phá sản bởi chiến dịch Biên giới (1950), Nava bị phá sản hoàn toàn bởi Điện Biên Phủ (1954) — thể hiện sự phá sản của chủ nghĩa thực dân Pháp ở Đông Dương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vai trò của chiến tranh du kích trong kháng chiến chống Pháp (1946–1954) được thể hiện như thế nào?", "options": ["A. Không có vai trò gì.", "B. Chỉ mang tính chất phụ.", "C. Chỉ diễn ra ở thành phố.", "D. Là hình thức tác chiến phổ biến, rộng khắp của chiến tranh nhân dân: kết hợp với chiến tranh chính quy, làm tiêu hao, kìm chân địch, tạo điều kiện cho những đòn tiến công chiến lược."], "answer": "D", "explain": "Chiến tranh du kích là nét đặc sắc của chiến tranh nhân dân Việt Nam: “mỗi làng là một pháo đài, mỗi người dân là một chiến sĩ”; du kích phối hợp với bộ đội chủ lực, làm địch ăn không ngon, ngủ không yên, tạo thế cho các chiến dịch lớn (Biên giới, Điện Biên Phủ).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa của chiến thắng Vạn Tường (8/1965) là gì?", "options": ["A. Kết thúc chiến tranh cục bộ.", "B. Chứng tỏ quân dân miền Nam hoàn toàn có khả năng đánh bại quân viễn chinh Mỹ, mở đầu cao trào “tìm Mỹ mà đánh, lùng Ngụy mà diệt”.", "C. Buộc Mỹ rút hết quân.", "D. Giải phóng miền Nam."], "answer": "B", "explain": "Vạn Tường đánh bại 9.000 quân viễn chinh Mỹ trong cuộc hành quân tìm diệt đầu tiên, chứng minh: dù Mỹ có ưu thế vũ khí, quân dân miền Nam vẫn đánh thắng được quân Mỹ — mở đầu phong trào “tìm Mỹ mà đánh” lan rộng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nghị quyết 10 của Bộ Chính trị (tháng 4/1988) — thường gọi là “Khoán 10” — có nội dung chính nào?", "options": ["A. Quốc hữu hóa ruộng đất.", "B. Tập thể hóa nông nghiệp.", "C. Khoán hộ trong nông nghiệp: giao đất cho hộ nông dân sử dụng ổn định lâu dài, xóa bỏ cơ chế tập trung quan liêu bao cấp trong nông nghiệp.", "D. Cấm sản xuất nông nghiệp hàng hóa."], "answer": "C", "explain": "Nghị quyết 10 (4/1988) thực hiện khoán hộ: giao quyền sử dụng đất lâu dài cho hộ nông dân, thừa nhận hộ là đơn vị kinh tế tự chủ — tạo động lực mạnh mẽ, đưa Việt Nam từ thiếu lương thực thành nước xuất khẩu gạo hàng đầu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiến chương ASEAN được thông qua vào năm nào?", "options": ["A. Năm 1967.", "B. Năm 1995.", "C. Năm 2015.", "D. Năm 2007 (tại Hội nghị cấp cao ASEAN 13, Singapore)."], "answer": "D", "explain": "Hiến chương ASEAN được thông qua tháng 11/2007 tại Singapore, chính thức có hiệu lực 12/2008 — là văn kiện pháp lý quan trọng, tạo cơ sở để xây dựng Cộng đồng ASEAN (2015).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tiếng bom Sa Điện (1924) của Phạm Hồng Thái có ý nghĩa nào?", "options": ["A. Gây tiếng vang lớn, thức tỉnh tinh thần yêu nước của nhân dân, báo hiệu thời kỳ đấu tranh mới; Nguyễn Ái Quốc đánh giá đây là “tiếng bom thức tỉnh”.", "B. Không có ý nghĩa gì.", "C. Làm Pháp tăng cường khủng bố.", "D. Ám sát thành công Toàn quyền Merlin."], "answer": "A", "explain": "Dù mưu sát không thành (Merlin thoát chết), tiếng bom Sa Điện (19/6/1924) gây chấn động dư luận, thức tỉnh lòng yêu nước; Nguyễn Ái Quốc coi đây như “chim én báo hiệu mùa xuân” của cách mạng Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hội Việt Nam Cách mạng Thanh niên (1925) có vai trò nào trong cách mạng Việt Nam?", "options": ["A. Là tổ chức cải lương.", "B. Là tổ chức tiền thân của Đảng: truyền bá chủ nghĩa Mác – Lênin, đào tạo cán bộ, chuẩn bị về tư tưởng, chính trị và tổ chức cho sự ra đời của Đảng Cộng sản Việt Nam.", "C. Không có vai trò.", "D. Là tổ chức của tư sản."], "answer": "B", "explain": "Hội Việt Nam Cách mạng Thanh niên (6/1925, Quảng Châu) do Nguyễn Ái Quốc sáng lập, mở lớp huấn luyện, ra báo Thanh Niên, phát động “vô sản hóa” — là bước chuẩn bị trực tiếp, toàn diện cho sự thành lập Đảng Cộng sản Việt Nam (1930).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Công tác chuẩn bị của Đảng trước Cách mạng tháng Tám 1945 để lại bài học nào?", "options": ["A. Không cần chuẩn bị, chờ thời cơ.", "B. Chỉ cần chuẩn bị quân sự.", "C. Phải ra sức chuẩn bị chu đáo mọi mặt (đường lối, lực lượng chính trị, lực lượng vũ trang, căn cứ địa), đồng thời nhạy bén chớp thời cơ — “thời cơ” chỉ đến với ai đã chuẩn bị sẵn sàng.", "D. Chỉ cần tuyên truyền."], "answer": "C", "explain": "Bài học: 15 năm chuẩn bị (1930–1945) — xây dựng Đảng, Mặt trận Việt Minh, lực lượng vũ trang, căn cứ địa — là điều kiện chủ quan quyết định; khi thời cơ khách quan đến (Nhật đầu hàng), Đảng kịp thời phát động Tổng khởi nghĩa thắng lợi. Chuẩn bị chu đáo + chớp thời cơ = thắng lợi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao chiến thắng Điện Biên Phủ được coi là “mốc vàng” trong lịch sử dân tộc Việt Nam?", "options": ["A. Vì đây là chiến thắng quân sự lớn nhất, lừng lẫy năm châu, chấn động địa cầu; kết thúc thắng lợi cuộc kháng chiến chống Pháp, mở ra thời kỳ mới cho cách mạng Việt Nam và cổ vũ phong trào giải phóng dân tộc thế giới.", "B. Vì Pháp tự nguyện rút quân.", "C. Vì Mỹ giúp ta đánh Pháp.", "D. Vì đây là trận đánh duy nhất."], "answer": "A", "explain": "Điện Biên Phủ là thắng lợi quân sự lớn nhất của ta trong kháng chiến chống Pháp — “lừng lẫy năm châu, chấn động địa cầu”; giáng đòn quyết định vào chủ nghĩa thực dân Pháp, mở ra giai đoạn mới cho cách mạng Việt Nam và phong trào giải phóng dân tộc thế giới.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Về nghệ thuật quân sự trong chiến dịch Điện Biên Phủ (1954), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Trong chiến dịch Điện Biên Phủ, quân ta thực hiện cách đánh “vây, lấn, tấn, diệt”: bao vây, đào chiến hào lấn dần, tiến công tiêu diệt từng cứ điểm từ ngoài vào trong.", "b) Từ đầu đến cuối chiến dịch, ta kiên trì phương châm “đánh nhanh, giải quyết nhanh”.", "c) Hệ thống giao thông hào với hàng trăm km chiến hào do quân dân ta đào là sáng tạo độc đáo, siết chặt vòng vây quanh tập đoàn cứ điểm địch.", "d) Chiến thắng Điện Biên Phủ là thắng lợi của đường lối chiến tranh nhân dân, của tinh thần quyết chiến, quyết thắng của quân dân Việt Nam."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: “vây, lấn, tấn, diệt” là nét đặc sắc của nghệ thuật quân sự Việt Nam ở Điện Biên Phủ. b) Sai: ta đã chuyển từ “đánh nhanh, giải quyết nhanh” sang “đánh chắc, tiến chắc” trước khi nổ súng. c) Đúng: hàng trăm km chiến hào vây lấn là sáng tạo độc đáo, làm nên “cái thòng lọng” siết chặt Điện Biên Phủ. d) Đúng: thắng lợi là kết tinh của đường lối chiến tranh nhân dân đúng đắn và tinh thần anh dũng (tấm gương Tô Vĩnh Diện, Phan Đình Giót, Bế Văn Đàn...).", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về mục tiêu và nghệ thuật của cuộc Tổng tiến công và nổi dậy Tết Mậu Thân (1968), xét tính đúng, sai của các nhận định sau:", "statements": ["a) Mục tiêu của Mậu Thân 1968 là giải phóng hoàn toàn miền Nam ngay trong năm 1968.", "b) Cuộc tổng tiến công diễn ra đồng loạt ở hầu khắp các đô thị miền Nam vào đêm giao thừa Tết Mậu Thân.", "c) Mậu Thân 1968 thể hiện nghệ thuật kết hợp tiến công quân sự với nổi dậy của quần chúng nhân dân đô thị.", "d) Sau Mậu Thân 1968, Mỹ tiếp tục leo thang chiến tranh, đưa thêm hàng chục vạn quân viễn chinh vào miền Nam."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: mục tiêu là giáng đòn quyết định vào ý chí xâm lược của Mỹ, làm phá sản chiến lược “Chiến tranh cục bộ”, tạo bước ngoặt chiến tranh — chưa phải giải phóng hoàn toàn miền Nam. b) Đúng: đêm 30 rạng 31/1/1968, quân dân ta đồng loạt tiến công vào Sài Gòn, Huế, Đà Nẵng và hàng chục đô thị, thị xã khác. c) Đúng: Mậu Thân kết hợp chặt chẽ tiến công của lực lượng vũ trang với nổi dậy của quần chúng — nét đặc sắc của nghệ thuật quân sự Việt Nam. d) Sai: sau Mậu Thân, Mỹ phải xuống thang chiến tranh, bắt đầu rút quân dần và ngồi vào bàn đàm phán tại Paris.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về vai trò của Việt Nam trong ASEAN, xét tính đúng, sai của các nhận định sau:", "statements": ["a) Việt Nam gia nhập ASEAN ngày 8/8/1967, là một trong 5 nước sáng lập.", "b) Việt Nam đã đảm nhiệm thành công vai trò Chủ tịch ASEAN trong các năm 1998, 2010 và 2020.", "c) Trong ASEAN, Việt Nam chỉ tham gia hợp tác kinh tế, không tham gia hợp tác chính trị – an ninh.", "d) ASEAN là tổ chức liên minh quân sự do Hoa Kỳ đứng đầu."], "answer": ["F", "T", "F", "F"], "explain": "a) Sai: Việt Nam gia nhập ASEAN ngày 28/7/1995, là thành viên thứ 7. b) Đúng: Việt Nam ba lần làm Chủ tịch ASEAN, để lại nhiều dấu ấn (đặc biệt năm 2020 trong bối cảnh đại dịch). c) Sai: Việt Nam tham gia toàn diện cả 3 trụ cột của Cộng đồng ASEAN. d) Sai: ASEAN là tổ chức hợp tác khu vực về hòa bình, ổn định và phát triển, không phải liên minh quân sự.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Về cuộc cách mạng khoa học – công nghệ hiện đại, xét tính đúng, sai của các nhận định sau:", "statements": ["a) Cuộc cách mạng khoa học – công nghệ hiện đại bắt đầu từ những năm 40 của thế kỷ XX.", "b) Đặc điểm của cách mạng khoa học – công nghệ là khoa học tách rời khỏi sản xuất.", "c) Cách mạng công nghiệp lần thứ tư chỉ ảnh hưởng đến các nước phát triển, không liên quan đến Việt Nam.", "d) Việt Nam chủ trương đẩy mạnh ứng dụng khoa học – công nghệ, đổi mới sáng tạo và chuyển đổi số quốc gia."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng: cách mạng khoa học – công nghệ hiện đại khởi đầu từ những năm 40 thế kỷ XX với nhiều phát minh (năng lượng nguyên tử, máy tính, vật liệu mới...). b) Sai: đặc điểm là khoa học gắn liền với kỹ thuật, đi trước mở đường; khoa học trở thành lực lượng sản xuất trực tiếp. c) Sai: cách mạng 4.0 ảnh hưởng toàn cầu; Việt Nam chủ động tham gia, coi đây là động lực phát triển. d) Đúng: Đảng xác định phát triển khoa học – công nghệ, đổi mới sáng tạo, chuyển đổi số là đột phá chiến lược.", "points": 1}]}]}</script>
