<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 3", "questions": [{"type": "mcq", "level": "VDC", "q": "Tư liệu (Lời kêu gọi toàn quốc kháng chiến, 19/12/1946): \"Chúng ta muốn hòa bình, chúng ta phải nhân nhượng. Nhưng chúng ta càng nhân nhượng, thực dân Pháp càng lấn tới...\" Đoạn tư liệu trên thể hiện đường lối kháng chiến nào của Đảng?", "options": ["A. Chỉ tiến hành kháng chiến ở các đô thị lớn phía Bắc rồi rút vào căn cứ.", "B. Kháng chiến toàn dân, toàn diện, lâu dài (trường kỳ), tự lực cánh sinh.", "C. Tiếp tục nhân nhượng, đàm phán để tránh chiến tranh bằng mọi giá.", "D. Dựa hoàn toàn vào sự viện trợ của Liên Xô và Trung Quốc để kháng chiến."], "answer": "B", "explain": "Lời kêu gọi thể hiện: ta đã nhân nhượng tối đa (Hiệp định Sơ bộ 6/3/1946, Tạm ước 14/9/1946) nhưng Pháp bội ước, buộc ta phải đứng lên kháng chiến — đó là cuộc kháng chiến chính nghĩa, tự vệ. Đường lối được xác định: toàn dân (\"Ai có súng dùng súng, ai có gươm dùng gươm...\"); toàn diện (quân sự, chính trị, kinh tế, văn hóa, ngoại giao); lâu dài để \"mài mòn\" kẻ thù mạnh hơn; tự lực cánh sinh là chính. A thu hẹp phạm vi; C trái với tinh thần \"Thà hy sinh tất cả chứ nhất định không chịu mất nước\"; D sai vì giai đoạn đầu ta chưa có viện trợ ngoài.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "So sánh chiến dịch Việt Bắc thu – đông (1947) với chiến dịch Biên giới thu – đông (1950), bước phát triển về thế chiến lược của quân và dân ta là:", "options": ["A. Từ thế bị động đối phó chuyển sang thế chủ động tiến công, giành quyền chủ động chiến lược trên chiến trường chính.", "B. Từ lối đánh du kích chuyển hoàn toàn sang lối đánh chính quy.", "C. Từ thế phòng ngự ở chiến trường Việt Bắc chuyển sang phòng ngự ở đồng bằng Bắc Bộ.", "D. Từ tự lực cánh sinh chuyển sang dựa hẳn vào viện trợ của nước ngoài."], "answer": "A", "explain": "Chiến dịch Việt Bắc (1947) mang tính phòng ngự – phản công: đánh bại chiến lược \"đánh nhanh thắng nhanh\" của Pháp, bảo vệ an toàn cơ quan đầu não kháng chiến. Chiến dịch Biên giới (1950) là chiến dịch tiến công lớn đầu tiên do ta chủ động mở: tiêu diệt sinh lực địch, khai thông biên giới Việt – Trung, mở rộng quan hệ quốc tế, giành thế chủ động chiến lược. Đây là bước ngoặt về thế và lực. B sai (ta kết hợp du kích với chính quy); C sai (Biên giới là tiến công); D sai (tự lực cánh sinh vẫn là phương châm chủ yếu).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đánh giá ý nghĩa quyết định của chiến thắng Điện Biên Phủ (1954) đối với việc kết thúc cuộc kháng chiến chống thực dân Pháp:", "options": ["A. Đã tiêu diệt hoàn toàn quân Pháp ở Đông Dương nên Pháp phải đầu hàng vô điều kiện.", "B. Đã giáng đòn quyết định vào ý chí xâm lược của thực dân Pháp, làm phá sản hoàn toàn kế hoạch Na-va, buộc Pháp phải ngồi vào bàn đàm phán và ký Hiệp định Giơ-ne-vơ chấm dứt chiến tranh ở Đông Dương.", "C. Đã giúp ta giải phóng hoàn toàn miền Nam ngay trong năm 1954.", "D. Đã buộc đế quốc Mỹ phải thay chân Pháp, đưa quân viễn chinh trực tiếp xâm lược Việt Nam ngay lập tức."], "answer": "B", "explain": "Điện Biên Phủ (13/3–7/5/1954) tiêu diệt tập đoàn cứ điểm mạnh nhất Đông Dương, làm phá sản kế hoạch Na-va — nỗ lực chiến tranh cuối cùng của Pháp. Thắng lợi \"lừng lẫy năm châu, chấn động địa cầu\" đã tạo thế mạnh áp đảo cho ta trên bàn đàm phán Giơ-ne-vơ, buộc Pháp ký hiệp định chấm dứt chiến tranh, lập lại hòa bình ở Đông Dương. A sai (Pháp còn lực lượng, phải đàm phán chứ không đầu hàng vô điều kiện); C sai (miền Nam chưa được giải phóng); D sai (Mỹ can thiệp từng bước, chưa đưa quân trực tiếp ngay).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hiệp định Giơ-ne-vơ (21/7/1954) quy định lấy vĩ tuyến 17 làm giới tuyến quân sự tạm thời và hai năm sau (7/1956) sẽ tổng tuyển cử thống nhất đất nước. Đánh giá nào dưới đây là đúng đắn nhất về tính chất thắng lợi của Hiệp định?", "options": ["A. Là thắng lợi hoàn toàn và trọn vẹn của nhân dân Việt Nam.", "B. Là thắng lợi to lớn nhưng chưa trọn vẹn: Pháp phải rút quân, miền Bắc hoàn toàn giải phóng, song đất nước tạm thời bị chia cắt và ta phải tiếp tục đấu tranh để hoàn thành thống nhất.", "C. Là thất bại của cách mạng Việt Nam vì đã để mất miền Nam vào tay đế quốc Mỹ.", "D. Là thắng lợi chỉ có ý nghĩa với miền Bắc, không liên quan đến cách mạng miền Nam."], "answer": "B", "explain": "Hiệp định là thắng lợi to lớn: các nước tham dự công nhận độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ của Việt Nam; Pháp rút hết quân; miền Bắc hoàn toàn giải phóng, chuyển sang thời kỳ mới. Nhưng thắng lợi chưa trọn vẹn: đất nước tạm thời chia cắt ở vĩ tuyến 17; đế quốc Mỹ phá hoại tổng tuyển cử, dựng chính quyền tay sai ở miền Nam, buộc nhân dân ta phải tiếp tục cuộc kháng chiến chống Mỹ để hoàn thành thống nhất. Đánh giá biện chứng (B) mới đúng; A tuyệt đối hóa; C, D phủ nhận thành quả và tính thống nhất của cách mạng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong kế hoạch Na-va (1953), Pháp tập trung lực lượng cơ động ở đồng bằng Bắc Bộ và xây dựng Điện Biên Phủ thành tập đoàn cứ điểm mạnh nhất Đông Dương. Mâu thuẫn cố hữu trong kế hoạch này mà ta đã khéo léo khai thác là:", "options": ["A. Pháp tập trung quân ở Bắc Bộ nên hoàn toàn không còn quân để đối phó ở miền Nam.", "B. Càng tập trung quân cơ động để tạo ưu thế thì Pháp càng rơi vào thế bị động, phân tán: ta tiến công vào những hướng hiểm yếu, buộc Pháp phải phân tán lực lượng đối phó, còn Điện Biên Phủ thì bị cô lập và trở thành \"cái bẫy\" nuốt chửng quân Pháp.", "C. Kế hoạch Na-va hoàn toàn không có mâu thuẫn; Pháp thất bại chỉ vì thiếu viện trợ của Mỹ.", "D. Pháp xây dựng cứ điểm quá mạnh nên quân ta không dám và không thể tiến công vào cứ điểm."], "answer": "B", "explain": "Mâu thuẫn của Na-va: muốn tập trung quân để giành thắng lợi quyết định trong 18 tháng, nhưng chính sự tập trung ở đồng bằng Bắc Bộ lại tạo điều kiện cho ta mở cuộc tiến công chiến lược Đông – Xuân 1953–1954 trên nhiều hướng (Tây Bắc, Trung Lào, Hạ Lào, Tây Nguyên...), buộc Pháp phải phân tán quân cơ động đi đối phó, làm phá sản ý đồ tập trung. Khi Pháp dồn quân xây dựng Điện Biên Phủ thành \"pháo đài không thể công phá\", ta quyết định đánh thẳng vào đó, biến nơi mạnh nhất của địch thành nơi chúng bị tiêu diệt. Đây là biểu hiện đặc sắc của nghệ thuật quân sự Việt Nam: \"lấy yếu đánh mạnh\", điều địch theo ý mình. A tuyệt đối hóa; C, D trái thực tế.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "So sánh vai trò của mặt trận ngoại giao trong kháng chiến chống Pháp (1945–1954) và kháng chiến chống Mỹ (1954–1975), điểm chung cơ bản là:", "options": ["A. Đều giành thắng lợi quân sự hoàn toàn rồi mới tiến hành đấu tranh ngoại giao.", "B. Ngoại giao luôn phục vụ và gắn chặt với thắng lợi quân sự: kết hợp \"vừa đánh vừa đàm\", lấy thắng lợi trên chiến trường làm cơ sở quyết định cho thắng lợi trên bàn đàm phán.", "C. Mặt trận ngoại giao đóng vai trò quyết định, mặt trận quân sự chỉ giữ vai trò hỗ trợ.", "D. Chỉ trong kháng chiến chống Mỹ, đấu tranh ngoại giao mới thực sự có vai trò."], "answer": "B", "explain": "Điểm chung xuyên suốt: Đảng luôn kết hợp chặt chẽ đấu tranh quân sự với đấu tranh ngoại giao theo phương châm \"vừa đánh vừa đàm\". Chống Pháp: thắng lợi Điện Biên Phủ tạo thế mạnh buộc Pháp ký Hiệp định Giơ-ne-vơ. Chống Mỹ: thắng lợi tiến công 1972 và \"Điện Biên Phủ trên không\" (12/1972) buộc Mỹ ký Hiệp định Pa-ri. Trong cả hai cuộc kháng chiến, thắng lợi quân sự là cơ sở quyết định cho thắng lợi ngoại giao; ngoại giao phục vụ, củng cố thành quả quân sự và chính trị. A sai (đàm phán song song, không đợi thắng hoàn toàn); C đảo ngược vai trò; D sai (ngoại giao chống Pháp cũng rất quan trọng: mở quan hệ với Trung Quốc, Liên Xô đầu 1950; đàm phán Giơ-ne-vơ).", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về cuộc kháng chiến chống thực dân Pháp (1945–1954):", "statements": ["a) Đường lối kháng chiến của Đảng là: toàn dân, toàn diện, lâu dài, tự lực cánh sinh.", "b) Chiến thắng Biên giới thu – đông 1950 đã giúp ta giành được thế chủ động chiến lược trên chiến trường chính Bắc Bộ.", "c) Đại hội đại biểu toàn quốc lần thứ II của Đảng (2/1951) quyết định đưa Đảng ra hoạt động công khai với tên gọi Đảng Lao động Việt Nam.", "d) Hiệp định Giơ-ne-vơ đã công nhận một nước Việt Nam độc lập, thống nhất và toàn vẹn lãnh thổ ngay sau khi hiệp định được ký kết."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: đây là đường lối kháng chiến được thể hiện trong Lời kêu gọi toàn quốc kháng chiến và các văn kiện của Đảng. b) Đúng: Biên giới 1950 là chiến dịch tiến công lớn đầu tiên, ta giành thế chủ động chiến lược. c) Đúng: Đại hội II họp tại Chiêm Hóa (Tuyên Quang), quyết định tách Đảng Cộng sản Đông Dương thành ba đảng cách mạng và đưa Đảng ra công khai là Đảng Lao động Việt Nam. d) Sai: Hiệp định công nhận về nguyên tắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ, nhưng thực tế đất nước tạm thời chia cắt ở vĩ tuyến 17, chờ tổng tuyển cử tháng 7/1956.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về chiến dịch Điện Biên Phủ (1954):", "statements": ["a) Điện Biên Phủ được thực dân Pháp xây dựng thành tập đoàn cứ điểm mạnh nhất Đông Dương.", "b) Chiến dịch Điện Biên Phủ diễn ra từ ngày 13/3 đến ngày 7/5/1954 và giành thắng lợi hoàn toàn.", "c) Thắng lợi Điện Biên Phủ đã buộc đế quốc Mỹ phải đưa quân viễn chinh vào tham chiến trực tiếp ở miền Nam ngay trong năm 1954.", "d) Chiến thắng Điện Biên Phủ được đánh giá là \"lừng lẫy năm châu, chấn động địa cầu\"."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Na-va xây dựng Điện Biên Phủ thành tập đoàn cứ điểm mạnh nhất Đông Dương với 16.200 quân tinh nhuệ. b) Đúng: chiến dịch mở màn 13/3/1954, kết thúc 7/5/1954 với thắng lợi hoàn toàn. c) Sai: sau 1954, Mỹ từng bước can thiệp bằng viện trợ và cố vấn, chưa đưa quân viễn chinh trực tiếp ngay (quân chiến đấu Mỹ vào miền Nam từ 1965). d) Đúng: đây là đánh giá của Chủ tịch Hồ Chí Minh về tầm vóc thắng lợi.", "points": 1}, {"type": "short", "level": "VDC", "q": "Phân tích diễn biến chiến dịch Điện Biên Phủ cho thấy: chiến dịch kết thúc thắng lợi vào ngày, tháng, năm nào? (Ghi theo dạng ngày/tháng/năm)", "answer": "7/5/1954", "explain": "Chiều ngày 7/5/1954, quân ta hoàn toàn làm chủ tập đoàn cứ điểm Điện Biên Phủ, bắt sống tướng Đờ Ca-xtơ-ri cùng toàn bộ bộ tham mưu. Chiến dịch kéo dài 56 ngày đêm (13/3–7/5/1954) kết thúc thắng lợi hoàn toàn, giáng đòn quyết định vào ý chí xâm lược của thực dân Pháp.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Theo Hiệp định Giơ-ne-vơ năm 1954, vĩ tuyến nào được lấy làm giới tuyến quân sự tạm thời chia cắt hai miền Nam – Bắc Việt Nam? (Chỉ ghi số)", "answer": "17", "explain": "Hiệp định Giơ-ne-vơ (ký ngày 21/7/1954) quy định lấy vĩ tuyến 17 (dòng sông Bến Hải, tỉnh Quảng Trị) làm giới tuyến quân sự tạm thời. Hai năm sau (tháng 7/1956), hai miền sẽ hiệp thương tổng tuyển cử để thống nhất đất nước. Tuy nhiên, đế quốc Mỹ đã phá hoại hiệp định, chia cắt lâu dài đất nước ta.", "points": 0.5}]}]}
