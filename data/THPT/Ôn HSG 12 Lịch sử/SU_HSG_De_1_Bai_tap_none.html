<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "VDC", "q": "Tư liệu: \"Vào giai đoạn cuối của Chiến tranh thế giới thứ hai, sức mạnh và ưu thế trên chiến trường thuộc về phe Đồng minh chống phát xít; việc tổ chức lại thế giới sau chiến tranh ngày càng trở nên cấp bách.\" Vì sao trong hoàn cảnh đó, Hội nghị Xan-phran-xi-xcô (4–6/1945) đã thông qua Hiến chương Liên hợp quốc?", "options": ["A. Để hợp thức hóa việc phân chia phạm vi ảnh hưởng giữa các nước thắng trận.", "B. Để rút ra bài học từ sự thất bại của Hội Quốc liên, xây dựng một tổ chức quốc tế thực sự có vai trò duy trì hòa bình thế giới.", "C. Để thành lập một liên minh quân sự của phe Đồng minh chống lại các tàn dư phát xít.", "D. Để các nước lớn phân chia nhau quyền phủ quyết trong Hội đồng Bảo an."], "answer": "B", "explain": "Cuối Chiến tranh thế giới thứ hai, nhân loại nhận thức sâu sắc thảm họa chiến tranh và sự bất lực của Hội Quốc liên trong việc ngăn ngừa chiến tranh (Hội Quốc liên thiếu cơ chế cưỡng chế hữu hiệu, nước Mỹ không tham gia). Vì vậy, 50 quốc gia họp tại Xan-phran-xi-xcô đã thông qua Hiến chương LHQ với mục đích hàng đầu là duy trì hòa bình và an ninh quốc tế, giải quyết tranh chấp bằng biện pháp hòa bình. Phương án A là nội dung của trật tự I-an-ta, không phải mục đích của Hiến chương; C sai vì LHQ không phải liên minh quân sự; D nhầm lẫn cơ chế tổ chức với mục đích thành lập.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hiến chương Liên hợp quốc ghi nhận nguyên tắc \"bình đẳng về chủ quyền giữa các quốc gia\", nhưng đồng thời quy định 5 ủy viên thường trực của Hội đồng Bảo an có quyền phủ quyết. Đánh giá nào dưới đây là đúng đắn nhất về mối quan hệ giữa hai quy định này?", "options": ["A. Hai quy định mâu thuẫn nhau, chứng tỏ Hiến chương thiếu tính khả thi.", "B. Quyền phủ quyết chính là sự cụ thể hóa nguyên tắc bình đẳng chủ quyền.", "C. Đây là sự dung hòa giữa lý tưởng bình đẳng và thực tế: các cường quốc thắng trận giữ vai trò quyết định trong việc duy trì hòa bình, nên cần sự đồng thuận của họ để mọi quyết định cưỡng chế có tính khả thi.", "D. Quyền phủ quyết chứng tỏ LHQ chỉ là công cụ của các nước lớn, nguyên tắc bình đẳng chỉ mang tính hình thức."], "answer": "C", "explain": "Quyền phủ quyết ra đời từ thực tế lịch sử: bài học Hội Quốc liên thất bại một phần vì các cường quốc không bị ràng buộc; để LHQ hoạt động hiệu quả, mọi biện pháp cưỡng chế quan trọng cần sự nhất trí của 5 cường quốc thắng trận (Mỹ, Liên Xô, Anh, Pháp, Trung Quốc) vì không có họ thì quyết định không thể thực thi. Đây là sự thỏa hiệp có tính thực tế giữa nguyên tắc bình đẳng chủ quyền (áp dụng trong Đại hội đồng: mỗi nước một phiếu) và yêu cầu hiệu quả của cơ chế gìn giữ hòa bình, chứ không phải sự mâu thuẫn triệt tiêu nhau (A, D cực đoan) hay sự cụ thể hóa (B sai).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Liên hợp quốc có nhiều vai trò: duy trì hòa bình và an ninh quốc tế; thúc đẩy quá trình phi thực dân hóa; thúc đẩy phát triển kinh tế – xã hội; cứu trợ nhân đạo. Vai trò nào được đánh giá là quan trọng nhất và vì sao?", "options": ["A. Cứu trợ nhân đạo, vì đã trực tiếp cứu sống hàng chục triệu người trên thế giới.", "B. Duy trì hòa bình và an ninh quốc tế, vì đây là mục đích ra đời của tổ chức, nhằm ngăn ngừa một cuộc chiến tranh thế giới mới.", "C. Thúc đẩy phát triển kinh tế, vì nghèo đói là nguồn gốc sâu xa của mọi xung đột.", "D. Thúc đẩy phi thực dân hóa, vì đã giúp hơn 80 quốc gia giành được độc lập."], "answer": "B", "explain": "Duy trì hòa bình và an ninh quốc tế là mục đích đầu tiên và bao trùm ghi trong Hiến chương, là lý do tồn tại của LHQ sau thảm họa của hai cuộc chiến tranh thế giới. Mọi vai trò khác (phi thực dân hóa, phát triển, nhân đạo) đều chỉ phát huy đầy đủ trong điều kiện hòa bình. Lực lượng \"mũ nồi xanh\", các nghị quyết của Hội đồng Bảo an ngăn ngừa và chấm dứt xung đột chính là biểu hiện tập trung nhất của vai trò này. Các phương án A, C, D đều là những đóng góp to lớn nhưng là vai trò thứ yếu, phái sinh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên nhân sâu xa dẫn đến sự sụp đổ của trật tự thế giới hai cực I-an-ta là:", "options": ["A. Mỹ thực hiện thành công chiến lược \"diễn biến hòa bình\" làm tan rã hệ thống xã hội chủ nghĩa.", "B. Sự suy yếu và khủng hoảng toàn diện của Liên Xô và các nước xã hội chủ nghĩa Đông Âu, làm mất đi một cực của trật tự, phá vỡ thế cân bằng Xô – Mỹ.", "C. Sự vươn lên mạnh mẽ của Nhật Bản và Tây Âu thành các trung tâm kinh tế – tài chính của thế giới.", "D. Hội nghị Man-ta (12/1989) đã tuyên bố giải thể hai khối quân sự đối đầu."], "answer": "B", "explain": "Trật tự hai cực I-an-ta được dựng trên thế cân bằng lực lượng giữa hai siêu cường Xô – Mỹ. Khi Liên Xô lâm vào khủng hoảng trầm trọng về kinh tế – xã hội và sụp đổ (25/12/1991), một cực của trật tự không còn tồn tại, trật tự hai cực tất yếu sụp đổ. Đây là nguyên nhân sâu xa, mang tính quyết định. A chỉ là tác động từ bên ngoài góp phần thúc đẩy; C là biểu hiện của xu thế đa cực hình thành sau đó; D sai vì Hội nghị Man-ta chỉ tuyên bố chấm dứt Chiến tranh lạnh, không giải thể NATO.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điểm khác biệt cơ bản nhất giữa trật tự thế giới hai cực I-an-ta và xu thế đa cực đang hình thành hiện nay là:", "options": ["A. Số lượng các cường quốc tham gia chi phối quan hệ quốc tế.", "B. Vai trò của vũ khí hạt nhân trong quan hệ quốc tế.", "C. Tính chất của quan hệ quốc tế: từ đối đầu gay gắt về ý thức hệ, chạy đua vũ trang chuyển sang vừa hợp tác vừa cạnh tranh, lấy hòa bình và phát triển làm xu thế chủ đạo.", "D. Sự tồn tại của các tổ chức kinh tế, tài chính quốc tế."], "answer": "C", "explain": "Điểm khác biệt cơ bản nằm ở tính chất, chứ không chỉ số lượng cực. Trật tự hai cực đặc trưng bởi sự đối đầu toàn diện Xô – Mỹ về ý thức hệ, quân sự (hai khối NATO và Vác-sa-va, chạy đua vũ trang). Xu thế đa cực hiện nay: các trung tâm (Mỹ, EU, Nhật Bản, Trung Quốc...) cạnh tranh chủ yếu bằng sức mạnh kinh tế, khoa học – công nghệ; các nước vừa hợp tác vừa cạnh tranh, đối thoại thay cho đối đầu; hòa bình, hợp tác phát triển là xu thế chủ đạo dù vẫn còn xung đột cục bộ. A chỉ là khác biệt về hình thức; B, D tồn tại ở cả hai thời kỳ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đánh giá nào dưới đây là đúng đắn, toàn diện nhất về tác động của các tổ chức kinh tế, tài chính quốc tế (IMF, WB, WTO) đối với các nước đang phát triển?", "options": ["A. Chỉ mang lại lợi ích vì giúp các nước này tiếp cận vốn, công nghệ và thị trường.", "B. Chỉ gây tác hại vì áp đặt các điều kiện cho vay can thiệp vào chủ quyền kinh tế.", "C. Vừa tạo cơ hội (vốn, công nghệ, mở rộng thị trường, cải cách thể chế) vừa đặt ra thách thức (điều kiện cho vay ngặt nghèo, cạnh tranh gay gắt, nguy cơ lệ thuộc).", "D. Không có tác động đáng kể vì các nước đang phát triển ít tham gia các tổ chức này."], "answer": "C", "explain": "Các tổ chức kinh tế, tài chính quốc tế ngày càng đóng vai trò quan trọng trong trật tự thế giới mới. Với các nước đang phát triển, chúng mở ra cơ hội tiếp cận nguồn vốn, công nghệ, thị trường và khuôn khổ pháp lý cho cải cách thể chế (ví dụ Việt Nam gia nhập WTO năm 2006). Nhưng đồng thời, các điều kiện cho vay, mở cửa thị trường cũng tạo sức ép cạnh tranh gay gắt lên nền sản xuất trong nước còn yếu và nguy cơ lệ thuộc. Đánh giá biện chứng hai mặt (C) mới đúng; A, B phiến diện một chiều; D sai với thực tế.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về Liên hợp quốc:", "statements": ["a) Hiến chương Liên hợp quốc được thông qua tại Hội nghị Xan-phran-xi-xcô vào tháng 6/1945 và có hiệu lực từ ngày 24/10/1945.", "b) Mọi quyết định quan trọng của Hội đồng Bảo an đều cần sự nhất trí của cả 5 ủy viên thường trực, tức là không một ủy viên thường trực nào bỏ phiếu chống.", "c) Hiến chương cho phép Liên hợp quốc can thiệp vào những công việc thuộc thẩm quyền nội bộ của bất kỳ quốc gia nào khi xét thấy cần thiết.", "d) Việt Nam chính thức trở thành thành viên thứ 149 của Liên hợp quốc vào ngày 20/9/1977."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Hội nghị Xan-phran-xi-xcô họp từ 25/4 đến 26/6/1945 với 50 quốc gia, thông qua Hiến chương; Hiến chương có hiệu lực ngày 24/10/1945 (Ngày LHQ). b) Đúng: đây chính là nội dung của quyền phủ quyết của 5 ủy viên thường trực. c) Sai: Hiến chương quy định nguyên tắc không can thiệp vào công việc thuộc thẩm quyền nội bộ của quốc gia (Điều 2, khoản 7). d) Đúng: ngày 20/9/1977, Việt Nam được kết nạp, trở thành thành viên thứ 149.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về trật tự thế giới sau Chiến tranh lạnh:", "statements": ["a) Hội nghị cấp cao Xô – Mỹ tại Man-ta (12/1989) đã tuyên bố chấm dứt Chiến tranh lạnh.", "b) Sự kiện Liên Xô tan rã (12/1991) đánh dấu sự sụp đổ của trật tự thế giới hai cực I-an-ta.", "c) Ngay sau năm 1991, một trật tự thế giới đa cực hoàn chỉnh và ổn định đã được thiết lập.", "d) Sau Chiến tranh lạnh, Mỹ trở thành siêu cường duy nhất nên trật tự đơn cực do Mỹ chi phối đã được xác lập một cách vững chắc."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: tại Man-ta, lãnh đạo Mỹ và Liên Xô tuyên bố chấm dứt Chiến tranh lạnh. b) Đúng: Liên Xô tan rã (25/12/1991) làm mất đi một cực, trật tự hai cực sụp đổ. c) Sai: trật tự đa cực mới đang trong quá trình hình thành, chưa hoàn chỉnh và còn nhiều diễn biến phức tạp. d) Sai: dù là siêu cường mạnh nhất, sức mạnh của Mỹ suy giảm tương đối so với trước; thế giới vận động theo xu thế đa cực, đa trung tâm với sự vươn lên của EU, Nhật Bản, Trung Quốc và vai trò ngày càng tăng của các tổ chức khu vực, quốc tế.", "points": 1}, {"type": "short", "level": "VDC", "q": "Phân tích bối cảnh ra đời của Liên hợp quốc cho thấy: Việt Nam chính thức trở thành thành viên của tổ chức này vào năm nào? (Chỉ ghi số năm)", "answer": "1977", "explain": "Ngày 20/9/1977, Việt Nam được kết nạp vào Liên hợp quốc với tư cách thành viên thứ 149. Đây là sự kiện đối ngoại quan trọng, đánh dấu bước hội nhập đầu tiên của Việt Nam vào tổ chức quốc tế lớn nhất hành tinh sau khi đất nước thống nhất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hội nghị cấp cao Xô – Mỹ họp tháng 12/1989, tuyên bố chấm dứt Chiến tranh lạnh, được tổ chức tại địa danh nào? (Chỉ ghi tên địa danh)", "answer": "Man-ta", "explain": "Hội nghị Man-ta (3–4/12/1989) giữa Tổng thống Mỹ G. Bush và Tổng Bí thư Đảng Cộng sản Liên Xô M. Goóc-ba-chốp đã tuyên bố chấm dứt Chiến tranh lạnh, mở ra thời kỳ mới trong quan hệ quốc tế và tạo tiền đề cho sự hình thành trật tự thế giới mới.", "points": 0.5}]}]}
