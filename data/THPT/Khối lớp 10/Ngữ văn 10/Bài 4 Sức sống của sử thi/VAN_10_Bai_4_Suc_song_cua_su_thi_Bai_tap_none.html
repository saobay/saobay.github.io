ain": "Anh hùng sử thi không phải cá nhân đơn lẻ mà kết tinh sức mạnh, khát vọng của cộng đồng — chiến đấu vì cộng đồng.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Tác phẩm tự sự dân gian kể về người anh hùng Ê-đê Đăm Săn thuộc thể loại …", "answer": "sử thi", "explain": "Đăm Săn là sử thi anh hùng tiêu biểu của dân tộc Ê-đê (Tây Nguyên).", "points": 0.5}, {"type": "short", "level": "TH", "q": "Héc-to là hoàng tử, vị tướng tài ba của thành nào trong sử thi I-li-át?", "answer": "Tơ-roa", "explain": "Héc-to là hoàng tử thành Tơ-roa, chiến đấu bảo vệ quê hương trước quân Hi Lạp vây hãm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong sử thi, thủ pháp miêu tả người anh hùng với sức mạnh, tầm vóc vượt ngoài sức người (khỏe như voi, đẹp như thần) được gọi là thủ pháp …", "answer": "phóng đại", "explain": "Phóng đại là thủ pháp đặc trưng của sử thi: nâng tầm vóc anh hùng lên mức phi thường, kì vĩ.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích vẻ đẹp của người anh hùng Héc-to trong đoạn trích “Héc-to từ biệt Ăng-đrô-mác”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu Héc-to — hoàng tử, vị tướng của Tơ-roa. 2) Thân đoạn: phân tích vẻ đẹp — dũng cảm, có trách nhiệm với Tổ quốc (quyết ra trận dù biết hiểm nguy); giàu tình cảm (yêu vợ thương con tha thiết qua đối thoại từ biệt); bi kịch giằng xé giữa gia đình và nghĩa lớn; sự lựa chọn cao đẹp. Nghệ thuật: đối thoại cảm động, so sánh, giọng bi tráng. 3) Kết đoạn: khẳng định Héc-to là mẫu mực người anh hùng; cảm nghĩ. BÀI MẪU: Héc-to trong đoạn trích “Héc-to từ biệt Ăng-đrô-mác” hiện lên là một người anh hùng toàn vẹn với vẻ đẹp vừa hào hùng vừa rất con người. Trước hết, chàng là người dũng cảm, có trách nhiệm với Tổ quốc: khi thành Tơ-roa bị vây hãm, Héc-to quyết ra trận dù biết có thể không trở về — đặt nghĩa lớn lên trên mạng sống của mình. Nhưng Héc-to không phải cỗ máy chiến tranh vô cảm; qua cuộc đối thoại từ bi ất. Đó là người anh hùng dũng cảm, có trách nhiệm: đặt Tổ quốc lên trên mạng sống, quyết ra trận bảo vệ Tơ-roa. Đồng thời, đó là người chồng, người cha giàu tình cảm: qua đối thoại với Ăng-đrô-mác, ta thấy tình yêu thương tha thiết, nỗi lo lắng cho vợ con mai sau. Hai vẻ đẹp ấy va nhau tạo nên bi kịch: giằng xé giữa gia đình và nghĩa lớn, và Héc-to đã chọn nghĩa lớn — sự lựa chọn cao đẹp thể hiện quan niệm Hi Lạp: danh dự cộng đồng cao hơn hạnh phúc cá nhân. Bên cạnh Héc-to là Ăng-đrô-mác — người vợ yêu chồng, giàu đức hi sinh: van xin mà rồi tôn trọng quyết định của chồng, vẻ đẹp của người phụ nữ cổ đại. Về nghệ thuật, Hô-me-rơ thành công với đối thoại giàu cảm xúc, những lời so sánh trang trọng nâng tầm nhân vật, ngôn ngữ hào sảng và giọng điệu bi tráng đặc trưng. Đoạn trích ca ngợi lòng yêu nước, tinh thần trách nhiệm và tình cảm gia đình cao đẹp — những giá trị muôn đời. Ngày nay, đọc lại trang sử thi, chúng ta càng thấm thía bài học về trách nhiệm với Tổ quốc: mỗi người, ở vị trí của mình, hãy sống có trách nhiệm với cộng đồng, với đất nước — đó là cách tiếp nối tinh thần Héc-to trong thời đại mới.", "points": 0}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Sử thi anh hùng khác sử thi thần thoại ở điểm nào?", "options": ["A. Kể về các vị thần sáng tạo thế giới", "B. Kể về người anh hùng chiến đấu bảo vệ cộng đồng, chinh phục tự nhiên", "C. Viết bằng thơ tự do", "D. Không có nhân vật anh hùng"], "answer": "B", "explain": "Sử thi anh hùng kể về người anh hùng bảo vệ cộng đồng (Héc-to, Đăm Săn); sử thi thần thoại kể về thần sáng tạo thế giới.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đăm Săn là người anh hùng của dân tộc nào?", "options": ["A. Kinh", "B. Chăm", "C. Ê-đê", "D. Khmer"], "answer": "C", "explain": "Đăm Săn là người anh hùng trong sử thi của dân tộc Ê-đê (Tây Nguyên) — biểu tượng sức mạnh và khát vọng chinh phục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khát vọng lớn nhất của Đăm Săn trong đoạn trích “Đăm Săn đi bắt Nữ thần Mặt Trời” là gì?", "options": ["A. Trở thành thầy cúng", "B. Chinh phục cả thần linh: bắt Nữ thần Mặt Trời về làm vợ", "C. Sống ẩn dật trong rừng", "D. Đi buôn bán làm giàu"], "answer": "B", "explain": "Đăm Săn mang khát vọng chinh phục phi thường: muốn bắt cả Nữ thần Mặt Trời — thể hiện ý chí vươn tới những điều lớn lao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trích dẫn trực tiếp khác trích dẫn gián tiếp ở điểm nào?", "options": ["A. Không có điểm gì khác nhau", "B. Gián tiếp thì bịa thêm ý", "C. Trực tiếp thì không cần ghi nguồn", "D. Trích dẫn trực tiếp dẫn nguyên văn, đặt trong dấu ngoặc kép; gián tiếp diễn đạt lại ý"], "answer": "D", "explain": "Trích dẫn trực tiếp: nguyên văn trong ngoặc kép; gián tiếp: diễn đạt lại ý (vẫn phải trung thực, ghi nguồn).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Chi tiết Đăm Săn “đi bắt Nữ thần Mặt Trời” thể hiện quan niệm nào của người Ê-đê?", "options": ["A. Chỉ thích ở nhà", "B. Cam chịu số phận", "C. Sợ hãi thần linh", "D. Khát vọng chinh phục tự nhiên, vươn lên làm chủ thế giới; con người không cam chịu số phận"], "answer": "D", "explain": "Người Ê-đê gửi vào Đăm Săn khát vọng chinh phục: con người dám vươn tới cả thần linh, không cam chịu — triết lí sống mạnh mẽ.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Khi trích dẫn mà bỏ bớt một phần không cần thiết, phải đánh dấu bằng dấu […] — đó là phép …", "answer": "tỉnh lược", "explain": "Tỉnh lược: bỏ bớt phần không cần thiết khi trích dẫn, đánh dấu […] — không được làm sai lệch ý nguyên văn.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Vợ của Héc-to trong sử thi I-li-át tên là gì?", "answer": "Ăng-đrô-mác", "explain": "Ăng-đrô-mác là vợ của Héc-to — người phụ nữ yêu chồng, giàu đức hi sinh trong đoạn trích từ biệt.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong sử thi, biện pháp ví người anh hùng với thần linh, mãnh thú (“khỏe như voi”, “đẹp như thần”) được gọi là biện pháp …", "answer": "so sánh", "explain": "So sánh là biện pháp đặc trưng của sử thi: ví anh hùng với những hình ảnh kì vĩ để tôn vinh tầm vóc phi thường.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích hình tượng người anh hùng Đăm Săn trong đoạn trích “Đăm Săn đi bắt Nữ thần Mặt Trời”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu Đăm Săn — anh hùng Ê-đê. 2) Thân đoạn: phân tích — sức mạnh phi thường (qua phóng đại, so sánh); khát vọng chinh phục lớn lao (bắt Nữ thần Mặt Trời); dũng cảm, quyết đoán; nét kiêu hùng; nghệ thuật: phóng đại, trùng điệp, ngôn ngữ Tây Nguyên hào hùng. 3) Kết đoạn: khẳng định Đăm Săn kết tinh khát vọng cộng đồng; cảm nghĩ. BÀI MẪU: Đăm Săn trong đoạn trích “Đăm Săn đi bắt Nữ thần Mặt Trời” hiện lên là một người anh hùng mang tầm vóc sử thi của dân tộc Ê-đê. Trước hết, chàng có sức mạnh phi thường được miêu tả bằng thủ pháp phóng đại: những hành động vượt ngoài sức người, khiến núi rừng cũng phải rung chuyển. Nhưng điều làm nên đặc sắc của Đăm Săn không chỉ ở sức mạnh cơ bắp mà ở khát vọng chinh phục lớn lao: chàng dám lên đường bắt Nữ thần Mặt Trời về làm vợ — khát vọng vươn tới cả thần linh, điều không tưởng với người thường. Hành trình ấy thể hiện sự dũng cảm, quyết đoán: không ngại gian nan, không lùi bước. Đăm Săn cũng có nét kiêu hùng, tự phụ rất “người”: tự tin vào sức mình đến mức thách thức cả thần linh — nét tính cách đa diện khiến nhân vật sinh động, gần gũi. Nghệ thuật xây dựng nhân vật đậm màu sắc Tây Nguyên: phóng đại, so sánh (ví với voi, với thần), trùng điệp tạo nhịp hào hùng, ngôn ngữ trang trọng giàu hình ảnh núi rừng. Qua Đăm Săn, người Ê-đê gửi gắm khát vọng chinh phục tự nhiên và triết lí sống mạnh mẽ: con người phải dám vươn lên, không cam chịu số phận. Hình tượng Đăm Săn nhắc nhở chúng ta hôm nay: hãy nuôi dưỡng khát vọng lớn và ý chí kiên cường để chinh phục những đỉnh cao của cuộc đời.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích đoạn trích “Đăm Săn đi bắt Nữ thần Mặt Trời” (trích sử thi Đăm Săn, dân tộc Ê-đê).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu sử thi Đăm Săn (Ê-đê), vị trí đoạn trích; nêu vấn đề. 2) Thân bài: a) Khái quát: hành trình bắt Nữ thần Mặt Trời. b) Nhân vật Đăm Săn: sức mạnh phi thường; khát vọng chinh phục; dũng cảm, kiêu hùng. c) Nghệ thuật: phóng đại, so sánh, trùng điệp; ngôn ngữ Tây Nguyên. d) Ý nghĩa: khát vọng chinh phục tự nhiên; ca ngợi sức mạnh, ý chí; triết lí vươn lên. 3) Kết bài: khẳng định giá trị; liên hệ (khát vọng tuổi trẻ). BÀI MẪU: Sử thi Đăm Săn là viên ngọc quý của văn học dân gian Tây Nguyên, và đoạn trích “Đăm Săn đi bắt Nữ thần Mặt Trời” là một trong những chương hào hùng nhất, thể hiện tập trung vẻ đẹp người anh hùng Ê-đê. Đăm Săn lên đường thực hiện một khát vọng tưởng như không tưởng: bắt Nữ thần Mặt Trời về làm vợ. Hành trình ấy là bản anh hùng ca về sức mạnh và ý chí. Trước hết, Đăm Săn có sức mạnh phi thường được khắc họa bằng thủ pháp phóng đại đặc trưng sử thi: mỗi bước chân, mỗi hành động đều vượt ngoài sức người, khiến thiên nhiên cũng phải kinh ngạc. Nhưng sức mạnh thể chất chỉ là một phần; điều lớn lao hơn là khát vọng chinh phục: dám vươn tới cả thần linh — khát vọng của cả cộng đồng Ê-đê muốn làm chủ tự nhiên, làm chủ số phận. Trên hành trình, Đăm Săn thể hiện sự dũng cảm, quyết đoán, không lùi bước trước gian nan; đồng thời có nét kiêu hùng, tự phụ rất con người, khiến nhân vật vừa kì vĩ vừa gần gũi. Nghệ thuật đoạn trích đậm đà bản sắc Tây Nguyên: phóng đại, so sánh (ví anh hùng với voi, với thần, với núi), trùng điệp tạo nhịp điệu hào hùng như tiếng cồng chiêng, ngôn ngữ trang trọng giàu hình ảnh núi rừng. Ý nghĩa sâu xa của đoạn trích là triết lí sống mạnh mẽ: con người phải dám ước mơ lớn, dám hành động để chinh phục; không cam chịu, không buông xuôi trước số phận. Ngày nay, tinh thần Đăm Săn vẫn nguyên giá trị: tuổi trẻ cần nuôi dưỡng khát vọng lớn lao và ý chí kiên cường — dám “bắt mặt trời” của đời mình, chinh phục những đỉnh cao tri thức và sự nghiệp. Đó là sức sống bền lâu của sử thi trong thời đại mới.", "points": 0}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Không gian sử thi có đặc điểm gì?", "options": ["A. Rộng lớn, kì vĩ (chiến trường, buôn làng, rừng núi, bầu trời)", "B. Chật hẹp trong một căn phòng", "C. Chỉ diễn ra trong mơ", "D. Không có không gian cụ thể"], "answer": "A", "explain": "Không gian sử thi rộng lớn, kì vĩ — xứng với tầm vóc của biến cố trọng đại và người anh hùng phi thường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cước chú (chú thích cuối trang) dùng để làm gì?", "options": ["A. Trang trí cho trang sách đẹp", "B. Đánh dấu trang bị rách", "C. Ghi tên người đọc", "D. Giải nghĩa từ khó hoặc ghi xuất xứ tài liệu trích dẫn"], "answer": "D", "explain": "Cước chú giải nghĩa từ khó hoặc ghi nguồn tài liệu — thể hiện sự trung thực khoa học của người viết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao đoạn trích “Héc-to từ biệt Ăng-đrô-mác” có giọng điệu bi tráng?", "options": ["A. Vì toàn chuyện cười", "B. Vì nhân vật hát hay", "C. Vì không có cảm xúc gì", "D. Vì vừa bi thương (từ biệt có thể là vĩnh biệt) vừa hào hùng (người anh hùng ra trận vì Tổ quốc)"], "answer": "D", "explain": "Bi tráng là sự hòa quyện giữa bi thương và hào hùng: từ biệt đầy nước mắt mà người ra đi thì hiên ngang vì nghĩa lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong báo cáo nghiên cứu, phần “đặt vấn đề” có nhiệm vụ gì?", "options": ["A. Kết luận vội vàng", "B. Kể chuyện cười mở đầu", "C. Chép lại tài liệu", "D. Nêu vấn đề nghiên cứu, lí do chọn đề tài, mục đích, phạm vi"], "answer": "D", "explain": "Đặt vấn đề nêu rõ nghiên cứu cái gì, vì sao chọn, nhằm mục đích gì — định hướng toàn bộ báo cáo.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "So sánh Héc-to và Đăm Săn, điểm chung lớn nhất giữa hai người anh hùng là gì?", "options": ["A. Cùng sống ở Hi Lạp", "B. Cùng là hoàng tử", "C. Cùng có sức mạnh phi thường, phẩm chất cao đẹp, là kết tinh khát vọng của cộng đồng", "D. Cùng đi bắt mặt trời"], "answer": "C", "explain": "Dù khác văn hóa, cả hai đều là anh hùng sử thi: phi thường, cao đẹp, kết tinh khát vọng cộng đồng — tính phổ quát của sử thi.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Thời gian trong sử thi thường là quá khứ xa xôi, mang tính … (“thuở ấy”, “ngày xưa”).", "answer": "huyền thoại", "explain": "Thời gian sử thi mang tính huyền thoại — thời đại hoàng kim, xa xôi của cộng đồng.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Sử thi I-li-át kể về cuộc chiến của thành nào?", "answer": "Tơ-roa", "explain": "I-li-át kể về cuộc chiến thành Tơ-roa giữa quân Hi Lạp và người Tơ-roa (vì nàng Hê-len).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong sử thi, lối lặp lại cấu trúc, hình ảnh để tạo nhịp điệu hào hùng (như tiếng cồng chiêng) được gọi là thủ pháp …", "answer": "trùng điệp", "explain": "Trùng điệp là thủ pháp lặp cấu trúc, hình ảnh tạo nhịp — đặc trưng ngôn ngữ sử thi, nhất là sử thi Tây Nguyên.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích vẻ đẹp tình cảm gia đình trong đoạn trích “Héc-to từ biệt Ăng-đrô-mác”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu cuộc từ biệt — nơi tình gia đình tỏa sáng. 2) Thân đoạn: phân tích — tình vợ chồng (Ăng-đrô-mác yêu chồng, van xin mà tôn trọng; Héc-to yêu vợ, lo cho vợ con); tình cha con (ôm con, lo tương lai); tình cảm chân thực, cảm động; đặt cạnh trách nhiệm Tổ quốc càng thấy cao đẹp; nghệ thuật đối thoại. 3) Kết đoạn: khẳng định tình gia đình làm nên chiều sâu nhân văn; cảm nghĩ. BÀI MẪU: Bên cạnh vẻ đẹp hào hùng của người anh hùng ra trận, đoạn trích “Héc-to từ biệt Ăng-đrô-mác” còn tỏa sáng vẻ đẹp của tình cảm gia đình chân thực, cảm động. Tình vợ chồng thể hiện qua từng lời đối thoại: Ăng-đrô-mác yêu chồng tha thiết, van xin chàng đừng ra trận vì sợ mất chồng, sợ con mồ côi — nỗi lo rất đỗi con người của người vợ; nhưng cuối cùng nàng tôn trọng quyết định của chồng, tiễn chàng bằng nước mắt và niềm tin — đức hi sinh cao cả. Héc-to cũng yêu vợ thương con không kém: chàng ôm con vào lòng, lo lắng cho tương lai của vợ con sau khi mình ngã xuống — người anh hùng dũng cảm ngoài chiến trường lại dịu dàng trong vòng tay gia đình. Tình cha con, tình chồng vợ hòa quyện, tạo nên những phút giây lắng đọng nhất của sử thi. Điều khiến tình cảm gia đình ở đây cao đẹp hơn là nó được đặt cạnh trách nhiệm với Tổ quốc: càng yêu gia đình, sự hi sinh vì nghĩa lớn càng lớn lao. Hô-me-rơ đã chứng minh: anh hùng không phải là người không có tình cảm riêng mà là người biết đặt nghĩa lớn lên trên tình riêng. Vẻ đẹp tình gia đình trong đoạn trích nhắc nhở chúng ta: hãy trân trọng những người thân yêu, bởi gia đình là điểm tựa để ta sống có trách nhiệm hơn với cuộc đời.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ so sánh hình tượng người anh hùng trong “Héc-to từ biệt Ăng-đrô-mác” và “Đăm Săn đi bắt Nữ thần Mặt Trời”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu hai tác phẩm, hai anh hùng; nêu vấn đề so sánh. 2) Thân bài: a) Điểm giống: phi thường, cao đẹp, kết tinh cộng đồng; nghệ thuật (so sánh, phóng đại, ngôn ngữ trang trọng). b) Điểm khác: Héc-to — bi kịch (gia đình vs Tổ quốc), trách nhiệm, giọng bi tráng (Hi Lạp); Đăm Săn — khát vọng chinh phục, kiêu hùng, giọng hào sảng (Tây Nguyên). c) Lí giải: văn hóa khác nhau (Hi Lạp trọng danh dự cộng đồng; Ê-đê trọng chinh phục tự nhiên). d) Đánh giá: cả hai đều là đỉnh cao sử thi. 3) Kết bài: khẳng định tính phổ quát và bản sắc; liên hệ. BÀI MẪU: Héc-to (I-li-át) và Đăm Săn (sử thi Ê-đê) là hai người anh hùng thuộc hai nền văn hóa cách xa nhau, nhưng cùng tỏa sáng những phẩm chất làm nên sức sống của sử thi. Điểm gặp gỡ lớn nhất: cả hai đều có sức mạnh phi thường và phẩm chất cao đẹp, đều là kết tinh sức mạnh, khát vọng của cộng đồng mình; cả hai đều được khắc họa bằng ngôn ngữ trang trọng với so sánh, phóng đại đặc trưng sử thi. Tuy nhiên, mỗi người mang một vẻ đẹp riêng gắn với văn hóa dân tộc. Héc-to là anh hùng của trách nhiệm: bi kịch giằng xé giữa tình gia đình và nghĩa vụ với Tổ quốc, và sự lựa chọn nghĩa lớn làm nên chiều sâu; giọng điệu bi tráng — vừa bi thương vừa hào hùng — đúng tinh thần Hi Lạp cổ đại coi danh dự cộng đồng là tối thượng. Đăm Săn là anh hùng của khát vọng: sức mạnh phi thường gắn với khát vọng chinh phục tự nhiên, thậm chí thách thức thần linh; tính cách kiêu hùng, tự phụ rất “người”; giọng điệu hào sảng như tiếng cồng chiêng Tây Nguyên. Sự khác biệt bắt nguồn từ văn hóa: người Hi Lạp hướng tới danh dự và trách nhiệm công dân, người Ê-đê hướng tới chinh phục tự nhiên để sinh tồn. So sánh hai hình tượng cho thấy tính phổ quát của sử thi (ca ngợi con người phi thường) và bản sắc riêng của mỗi dân tộc. Ngày nay, cả Héc-to và Đăm Săn đều còn sức sống: một người dạy ta sống có trách nhiệm, một người dạy ta dám ước mơ lớn — hai bài học mà tuổi trẻ nào cũng cần.", "points": 0}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Người anh hùng sử thi có đặc điểm gì?", "options": ["A. Chỉ lo cho bản thân", "B. Không có gì đặc biệt", "C. Sức mạnh phi thường, phẩm chất cao đẹp, là kết tinh của cộng đồng", "D. Yếu đuối, nhút nhát"], "answer": "C", "explain": "Anh hùng sử thi: phi thường về sức mạnh, cao đẹp về phẩm chất, hành động vì cộng đồng — khác hẳn người thường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi trích dẫn trực tiếp, cần đặt phần trích trong dấu gì?", "options": ["A. Không cần dấu gì", "B. Dấu chấm than", "C. Dấu ngoặc đơn", "D. Dấu ngoặc kép"], "answer": "D", "explain": "Trích dẫn trực tiếp dẫn nguyên văn, đặt trong dấu ngoặc kép — thể hiện sự trung thực với nguồn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao trong đoạn trích, Hô-me-rơ thường ví Héc-to với thần linh, mãnh thú?", "options": ["A. Vì hết từ để tả", "B. Để kể chuyện hài", "C. Để tôn vinh tầm vóc phi thường của người anh hùng", "D. Vì Héc-to thực sự là thần"], "answer": "C", "explain": "So sánh với thần linh, mãnh thú là thủ pháp tôn vinh: nâng tầm vóc anh hùng lên mức phi thường, kì vĩ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phần “giải quyết vấn đề” trong báo cáo nghiên cứu có nhiệm vụ gì?", "options": ["A. Trình bày quá trình tìm hiểu, phân tích, lí giải bằng lí lẽ và bằng chứng", "B. Viết lời cảm ơn", "C. Chép nguyên tài liệu", "D. Kể chuyện ngoài lề"], "answer": "A", "explain": "Giải quyết vấn đề là phần chính: trình bày quá trình tìm hiểu, phân tích bằng lí lẽ, bằng chứng (có trích dẫn, cước chú).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhận xét nào đúng về vai trò của đối thoại trong đoạn trích “Héc-to từ biệt Ăng-đrô-mác”?", "options": ["A. Nên bỏ hết đối thoại", "B. Đối thoại chỉ để cho dài", "C. Đối thoại không có tác dụng gì", "D. Đối thoại làm bộc lộ tâm trạng, tính cách nhân vật một cách chân thực, cảm động"], "answer": "D", "explain": "Đối thoại từ biệt bộc lộ trực tiếp tâm trạng, tính cách: tình yêu, nỗi lo, sự hi sinh — chân thực và cảm động hơn lời kể.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Phần giải thích, ghi nguồn tài liệu ở cuối trang, đánh số thứ tự gọi là …", "answer": "cước chú", "explain": "Cước chú ghi ở cuối trang, đánh số — dùng để giải nghĩa từ khó hoặc ghi xuất xứ tài liệu trích dẫn.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nữ thần mà Đăm Săn quyết tâm “bắt” về làm vợ là nữ thần nào?", "answer": "Nữ thần Mặt Trời", "explain": "Đăm Săn đi bắt Nữ thần Mặt Trời — khát vọng chinh phục phi thường của người anh hùng Ê-đê.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong báo cáo nghiên cứu, việc dẫn lại nguyên văn ý kiến của người khác mà không ghi nguồn bị coi là hành vi gì?", "answer": "đạo văn", "explain": "Trích dẫn không ghi nguồn là đạo văn — vi phạm đạo đức khoa học; phải trích dẫn trung thực và ghi cước chú đầy đủ.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích nghệ thuật so sánh và phóng đại trong sử thi (qua hai đoạn trích đã học).", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: nêu luận điểm — so sánh, phóng đại là bộ đôi nghệ thuật của sử thi. 2) Thân đoạn: phân tích — so sánh (ví anh hùng với thần, mãnh thú, voi: tôn vinh tầm vóc); phóng đại (sức mạnh, hành động vượt ngoài sức người); ví dụ từ hai đoạn trích; tác dụng (kì vĩ, hào hùng, xứng tầm anh hùng). 3) Kết đoạn: khẳng định đây là “chữ kí” của sử thi; bài học. BÀI MẪU: So sánh và phóng đại là hai thủ pháp nghệ thuật làm nên “chữ kí” của sử thi, thể hiện rõ qua hai đoạn trích đã học. Trong “Héc-to từ biệt Ăng-đrô-mác”, Hô-me-rơ thường ví người anh hùng với thần linh, mãnh thú: so sánh ấy không chỉ tả ngoại hình mà tôn vinh tầm vóc phi thường, khiến Héc-to vừa là con người vừa mang dáng dấp thần thánh. Trong “Đăm Săn đi bắt Nữ thần Mặt Trời”, phóng đại được đẩy tới cực điểm: sức mạnh, bước chân, hành động của Đăm Săn đều vượt ngoài sức tưởng tượng của người thường — mỗi chi tiết đều được “thổi phồng” để xứng với khát vọng chinh phục thần linh. Hai thủ pháp thường đi đôi: phóng đại tạo độ “khổng lồ”, so sánh tạo hình ảnh cụ thể để người đọc hình dung được cái khổng lồ ấy. Tác dụng chung là tạo nên không khí kì vĩ, hào hùng — đúng với tầm vóc của biến cố trọng đại và người anh hùng phi thường. Nếu thiếu so sánh, phóng đại, sử thi sẽ mất đi vẻ đẹp đặc trưng, trở thành câu chuyện thường ngày. Bài học rút ra: mỗi thể loại có “vũ khí” nghệ thuật riêng; muốn viết hay, phải chọn đúng thủ pháp phù hợp với nội dung — như sử thi đã chọn so sánh và phóng đại để tôn vinh người anh hùng.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích đặc trưng sử thi qua hai đoạn trích “Héc-to từ biệt Ăng-đrô-mác” và “Đăm Săn đi bắt Nữ thần Mặt Trời”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu sử thi và hai đoạn trích; nêu vấn đề: đặc trưng sử thi. 2) Thân bài: a) Biến cố trọng đại (chiến tranh Tơ-roa; chinh phục thần linh). b) Người anh hùng phi thường (Héc-to, Đăm Săn). c) Không – thời gian kì vĩ, huyền thoại. d) Ngôn ngữ trang trọng (so sánh, phóng đại, trùng điệp). e) Đánh giá: hai đoạn trích thể hiện đầy đủ đặc trưng; sức sống bền lâu. 3) Kết bài: khẳng định; liên hệ (giữ gìn di sản sử thi). BÀI MẪU: Hai đoạn trích “Héc-to từ biệt Ăng-đrô-mác” và “Đăm Săn đi bắt Nữ thần Mặt Trời” là hai minh chứng tiêu biểu cho đặc trưng của sử thi — thể loại tự sự dân gian hào hùng nhất. Trước hết, cả hai đều kể về những biến cố trọng đại của cộng đồng: một bên là cuộc chiến bảo vệ thành Tơ-roa, một bên là hành trình chinh phục thần linh của người Ê-đê — đều là những sự kiện mang tầm vóc lịch sử, không phải chuyện đời thường. Thứ hai, trung tâm của cả hai là người anh hùng phi thường: Héc-to dũng cảm, giàu trách nhiệm; Đăm Săn sức mạnh phi thường, khát vọng lớn — đều là kết tinh sức mạnh, phẩm chất và khát vọng của cộng đồng mình. Thứ ba, không gian, thời gian đều kì vĩ, huyền thoại: chiến trường Tơ-roa khói lửa, núi rừng Tây Nguyên bao la; thời gian là quá khứ xa xôi “thuở ấy”. Thứ tư, ngôn ngữ cả hai đều trang trọng, hào sảng với bộ ba so sánh – phóng đại – trùng điệp: Hô-me-rơ ví anh hùng với thần linh, sử thi Ê-đê phóng đại sức mạnh và trùng điệp tạo nhịp như cồng chiêng. Bốn đặc trưng ấy hòa quyện làm nên sức hấp dẫn đặc biệt của sử thi: vừa kì vĩ vừa gần gũi, vừa hào hùng vừa nhân văn. Hơn thế, hai đoạn trích cho thấy sử thi không phải là di sản chết: những bài học về lòng yêu nước, tinh thần trách nhiệm (Héc-to) và khát vọng vươn lên (Đăm Săn) vẫn nguyên giá trị. Vì vậy, giữ gìn và phát huy di sản sử thi — nhất là sử thi Tây Nguyên của dân tộc ta — là trách nhiệm của thế hệ hôm nay.", "points": 0}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Giọng điệu bi tráng trong sử thi là gì?", "options": ["A. Chỉ toàn vui vẻ", "B. Vừa bi thương vừa hào hùng", "C. Chỉ toàn buồn bã", "D. Không có cảm xúc"], "answer": "B", "explain": "Bi tráng là sự hòa quyện giữa bi thương và hào hùng — giọng điệu đặc trưng khi anh hùng hi sinh vì nghĩa lớn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phần kết luận trong báo cáo nghiên cứu có nhiệm vụ gì?", "options": ["A. Quảng cáo sản phẩm", "B. Xin lỗi người đọc", "C. Kể thêm chuyện mới", "D. Tổng hợp kết quả, nêu nhận định, đề xuất và hướng mở"], "answer": "D", "explain": "Kết luận tổng hợp kết quả nghiên cứu, nêu nhận định và đề xuất — khép lại báo cáo một cách khoa học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Héc-to quyết ra trận dù biết có thể không trở về?", "options": ["A. Vì trách nhiệm với Tổ quốc, với cộng đồng cao hơn mạng sống cá nhân", "B. Vì thích đánh nhau", "C. Vì muốn bỏ vợ con", "D. Vì bị ép buộc"], "answer": "A", "explain": "Héc-to đặt nghĩa lớn lên trên mạng sống: trách nhiệm với Tơ-roa cao hơn hạnh phúc cá nhân — vẻ đẹp của người anh hùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi trình bày báo cáo nghiên cứu trước lớp, cần chú ý điều gì?", "options": ["A. Không cần chuẩn bị gì", "B. Nói càng nhanh càng tốt", "C. Đọc một mạch không nhìn ai", "D. Nói rõ ràng, mạch lạc theo bố cục; dùng tranh ảnh, sơ đồ minh họa; lắng nghe và trả lời phản biện lịch sự"], "answer": "D", "explain": "Trình bày báo cáo cần rõ ràng, mạch lạc, có minh họa và biết lắng nghe, trả lời phản biện — đó là kĩ năng nói và nghe.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Theo em, vì sao sử thi vẫn có “sức sống” trong thời đại ngày nay?", "options": ["A. Vì những giá trị nhân văn (yêu nước, trách nhiệm, khát vọng vươn lên) vẫn nguyên ý nghĩa; con người vẫn cần những tấm gương anh hùng", "B. Vì bắt buộc phải học", "C. Vì sử thi viết về tương lai", "D. Vì sử thi rất dài nên khó quên"], "answer": "A", "explain": "Sức sống của sử thi nằm ở giá trị nhân văn bền vững: mỗi thời đại đều cần những tấm gương về lòng yêu nước, trách nhiệm và khát vọng.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Lối lặp lại cấu trúc, hình ảnh để tạo nhịp điệu hào hùng trong sử thi gọi là thủ pháp …", "answer": "trùng điệp", "explain": "Trùng điệp tạo nhịp điệu hào hùng như tiếng cồng chiêng — đặc trưng ngôn ngữ sử thi, nhất là sử thi Tây Nguyên.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Ăng-đrô-mác là vợ của người anh hùng nào?", "answer": "Héc-to", "explain": "Ăng-đrô-mác là vợ của Héc-to — người phụ nữ yêu chồng, giàu đức hi sinh trong sử thi I-li-át.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong đoạn trích I-li-át, Héc-to được Hô-me-rơ ví với hình ảnh nào là chủ yếu?", "answer": "thần linh", "explain": "Hô-me-rơ thường ví Héc-to với thần linh, mãnh thú — thủ pháp so sánh tôn vinh tầm vóc phi thường của anh hùng.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu cảm nghĩ của em về bi kịch của người anh hùng Héc-to.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu bi kịch Héc-to — giằng xé giữa gia đình và Tổ quốc. 2) Thân đoạn: cảm nghĩ — thương cho hạnh phúc riêng phải hi sinh; cảm phục sự lựa chọn nghĩa lớn; suy ngẫm: bi kịch làm nên chiều sâu, anh hùng cũng là con người có tình cảm; liên hệ (trách nhiệm với cộng đồng hôm nay). 3) Kết đoạn: khẳng định bi kịch cao đẹp; bài học. BÀI MẪU: Bi kịch của Héc-to trong đoạn trích “Héc-to từ biệt Ăng-đrô-mác” để lại trong em nhiều suy ngẫm sâu sắc. Bi kịch ấy là sự giằng xé đau đớn giữa hai tình cảm lớn: một bên là tình yêu vợ con tha thiết — người vợ trẻ, đứa con thơ cần chỗ dựa; một bên là trách nhiệm với Tổ quốc đang lâm nguy — thành Tơ-roa cần người bảo vệ. Chọn gia đình thì có lỗi với đất nước, chọn Tổ quốc thì phải hi sinh hạnh phúc riêng — không có lựa chọn nào trọn vẹn. Em thương cho Héc-to: anh hùng cũng là con người, cũng có những giây phút yếu lòng trước nước mắt vợ con. Nhưng em càng cảm phục sự lựa chọn của chàng: đặt nghĩa lớn lên trên tình riêng, ra trận với tinh thần “da ngựa bọc thây”. Chính bi kịch và sự lựa chọn cao đẹp ấy làm nên chiều sâu nhân vật: Héc-to không phải cỗ máy chiến tranh mà là con người đích thực — biết yêu, biết đau, và biết hi sinh. Bi kịch của Héc-to nhắc nhở chúng ta hôm nay: sống là phải biết đặt lợi ích chung lên trên lợi ích riêng; và những hi sinh thầm lặng vì cộng đồng luôn là điều cao đẹp nhất. Đó là bài học vượt thời gian từ trang sử thi cổ đại.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ trả lời câu hỏi: Sử thi có còn sức sống trong thời đại ngày nay không? Vì sao? (Liên hệ hai đoạn trích đã học.)", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: nêu vấn đề — có ý kiến cho rằng sử thi đã lỗi thời; khẳng định: sử thi vẫn có sức sống. 2) Thân bài: a) Giải thích “sức sống”: giá trị còn được đón nhận. b) Lí lẽ 1: giá trị nhân văn bền vững (yêu nước, trách nhiệm — Héc-to; khát vọng vươn lên — Đăm Săn). c) Lí lẽ 2: giá trị thẩm mĩ (ngôn ngữ hào hùng, hình tượng đẹp) vẫn hấp dẫn. d) Bằng chứng: sử thi được nghiên cứu, chuyển thể (phim, sân khấu); du lịch văn hóa Tây Nguyên. e) Bác bỏ: “xa lạ với giới trẻ” — do cách tiếp cận, không phải do sử thi hết hay. f) Giải pháp phát huy: đưa vào trường học sinh động, chuyển thể hiện đại. 3) Kết bài: khẳng định; kêu gọi giữ gìn di sản. BÀI MẪU: Có ý kiến cho rằng sử thi là “chuyện ngày xưa”, xa lạ với thời đại công nghệ hôm nay. Nhưng tôi khẳng định: sử thi vẫn có sức sống mãnh liệt, bởi những giá trị nó mang theo không bao giờ cũ. Trước hết, sử thi chứa đựng những giá trị nhân văn bền vững. Héc-to dạy ta lòng yêu nước và tinh thần trách nhiệm: đặt lợi ích cộng đồng lên trên lợi ích cá nhân — bài học càng cần trong thời đại mà chủ nghĩa cá nhân có xu hướng lấn át. Đăm Săn dạy ta khát vọng vươn lên: dám ước mơ lớn, dám hành động để chinh phục — bài học quý cho tuổi trẻ khởi nghiệp hôm nay. Những giá trị ấy không thuộc về quá khứ mà thuộc về mọi thời đại. Thứ hai, sử thi có giá trị thẩm mĩ đặc biệt: ngôn ngữ trang trọng, hào hùng; hình tượng anh hùng kì vĩ; những câu chuyện li kì, hấp dẫn — vẫn đủ sức lôi cuốn người đọc hiện đại nếu được tiếp cận đúng cách. Thực tế, sử thi vẫn sống: được các nhà nghiên cứu khai thác, được chuyển thể thành phim, sân khấu; không gian văn hóa cồng chiêng Tây Nguyên thu hút du khách. Có người nói giới trẻ xa lạ với sử thi — nhưng đó là do cách dạy, cách tiếp cận khô khan, chứ không phải sử thi hết hay. Muốn phát huy sức sống, cần đưa sử thi vào trường học một cách sinh động, chuyển thể bằng ngôn ngữ hiện đại, gắn với trải nghiệm thực tế. Sử thi là di sản tinh thần của dân tộc — giữ gìn nó là giữ gìn cội nguồn. Hãy đọc sử thi không phải như một bài học bắt buộc mà như một cuộc gặp gỡ với cha ông — ta sẽ thấy quá khứ chưa bao giờ xa, và những người anh hùng vẫn đang nói với chúng ta hôm nay.", "points": 0}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Sử thi Đăm Săn là sáng tác của dân tộc nào?", "options": ["A. Tày", "B. Ê-đê", "C. Kinh", "D. Mường"], "answer": "B", "explain": "Đăm Săn là sử thi anh hùng của dân tộc Ê-đê ở Tây Nguyên — di sản văn hóa quý báu của Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "I-li-át và Ô-đi-xê là hai sử thi của nền văn học nào?", "options": ["A. Ai Cập", "B. Ấn Độ", "C. Trung Quốc", "D. Hi Lạp cổ đại"], "answer": "D", "explain": "I-li-át và Ô-đi-xê là hai sử thi vĩ đại của Hi Lạp cổ đại, do Hô-me-rơ sáng tác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi muốn bỏ bớt một phần không cần thiết trong đoạn trích dẫn, ta đánh dấu bằng gì?", "options": ["A. Dấu ba chấm trong ngoặc vuông [… ]", "B. Không cần đánh dấu", "C. Dấu chấm than", "D. Dấu hỏi"], "answer": "A", "explain": "Tỉnh lược được đánh dấu bằng […] — để người đọc biết có phần bị lược bỏ, mà ý vẫn không sai lệch.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nét tính cách nào khiến Đăm Săn vừa kì vĩ vừa gần gũi?", "options": ["A. Vừa dũng cảm, có khát vọng lớn vừa có nét kiêu hùng, tự phụ rất con người", "B. Lười biếng", "C. Chỉ toàn hoàn hảo", "D. Nhút nhát, sợ sệt"], "answer": "A", "explain": "Đăm Săn kì vĩ ở sức mạnh, khát vọng mà gần gũi ở nét kiêu hùng, tự phụ — tính cách đa diện, sinh động.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để viết báo cáo nghiên cứu tốt, cần tránh điều gì?", "options": ["A. Trình bày mạch lạc", "B. Lập đề cương", "C. Thu thập tài liệu", "D. Trích dẫn không ghi nguồn, sao chép ý người khác (đạo văn)"], "answer": "D", "explain": "Đạo văn — trích dẫn không ghi nguồn, sao chép — là vi phạm đạo đức khoa học nghiêm trọng, cần tuyệt đối tránh.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Nêu tên hai sử thi lớn của Hô-me-rơ.", "answer": "I-li-át và Ô-đi-xê", "explain": "Hô-me-rơ là tác giả của hai sử thi vĩ đại: I-li-át (chiến tranh Tơ-roa) và Ô-đi-xê (hành trình trở về).", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trong câu “Héc-to là người anh hùng dũng cảm. Chàng quyết ra trận bảo vệ Tơ-roa”, từ “Chàng” thay thế cho từ nào (phép thế liên kết)?", "answer": "Héc-to", "explain": "“Chàng” là phép thế cho “Héc-to” — cách liên kết câu tránh lặp từ, giúp văn bản gắn bó.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong sử thi Tây Nguyên, nhịp điệu hào hùng thường được tạo nên nhờ thủ pháp nào là chủ yếu?", "answer": "trùng điệp", "explain": "Trùng điệp (lặp cấu trúc, hình ảnh) tạo nhịp điệu hào hùng như tiếng cồng chiêng — đặc trưng sử thi Tây Nguyên.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích vẻ đẹp ngôn ngữ sử thi trong đoạn trích “Đăm Săn đi bắt Nữ thần Mặt Trời”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: nêu luận điểm — ngôn ngữ là một trong những vẻ đẹp nổi bật của đoạn trích. 2) Thân đoạn: phân tích — trang trọng, hào sảng; phóng đại (tầm vóc phi thường); so sánh (ví với voi, thần, núi); trùng điệp (lặp cấu trúc tạo nhịp như cồng chiêng); giàu hình ảnh núi rừng Tây Nguyên; tác dụng (kì vĩ, hào hùng, xứng tầm anh hùng). 3) Kết đoạn: khẳng định ngôn ngữ làm nên sức sống; cảm nghĩ. BÀI MẪU: Ngôn ngữ trong đoạn trích “Đăm Săn đi bắt Nữ thần Mặt Trời” là một trong những vẻ đẹp nổi bật nhất, mang đậm bản sắc sử thi Tây Nguyên. Trước hết, đó là ngôn ngữ trang trọng, hào sảng: không có chỗ cho sự suồng sã, đời thường; mỗi câu chữ đều như được “mặc áo lễ”, xứng với tầm vóc của người anh hùng và khát vọng chinh phục thần linh. Thủ pháp phóng đại được dùng triệt để: sức mạnh, bước chân, hành động của Đăm Săn đều vượt ngoài sức người — càng phóng đại, nhân vật càng kì vĩ. Đi cùng phóng đại là những lời so sánh đẹp như thơ: ví anh hùng với voi, với thần, với núi — vừa cụ thể vừa hùng vĩ, giúp người đọc hình dung được cái phi thường. Đặc biệt, thủ pháp trùng điệp — lặp đi lặp lại cấu trúc, hình ảnh — tạo nên nhịp điệu hào hùng như tiếng cồng chiêng vang vọng núi rừng, khiến đoạn trích như một bản hùng ca. Ngôn ngữ giàu hình ảnh núi rừng Tây Nguyên: voi, núi, rừng, mặt trời — vừa chân thực vừa huyền ảo. Tất cả hòa quyện tạo nên một thứ ngôn ngữ vừa kì vĩ vừa gần gũi, vừa hào hùng vừa thơ mộng. Đọc đoạn trích, em như nghe thấy tiếng cồng chiêng và thấy bóng dáng người anh hùng sừng sững giữa đại ngàn — đó là sức mạnh của ngôn ngữ sử thi, thứ ngôn ngữ xứng đáng được giữ gìn như báu vật văn hóa.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích vẻ đẹp tâm hồn người anh hùng Ê-đê qua nhân vật Đăm Săn.", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu Đăm Săn; nêu vấn đề: vẻ đẹp tâm hồn. 2) Thân bài: a) Khát vọng chinh phục lớn lao (bắt Nữ thần Mặt Trời) — tâm hồn dám ước mơ. b) Dũng cảm, quyết đoán, không lùi bước — ý chí kiên cường. c) Tình yêu buôn làng, cộng đồng (chiến đấu vì mọi người). d) Nét kiêu hùng — sự tự tin của con người làm chủ. e) Nghệ thuật: phóng đại, so sánh, trùng điệp. 3) Kết bài: khẳng định; liên hệ (nuôi dưỡng khát vọng, ý chí). BÀI MẪU: Đằng sau sức mạnh phi thường của Đăm Săn là một tâm hồn đẹp, mang đậm bản sắc của người anh hùng Ê-đê. Vẻ đẹp đầu tiên là khát vọng chinh phục lớn lao: dám lên đường bắt Nữ thần Mặt Trời về làm vợ — khát vọng vươn tới cả thần linh, điều không tưởng với người thường. Khát vọng ấy không phải ngông cuồng mà là biểu hiện của một tâm hồn lớn: không cam chịu số phận nhỏ bé, luôn muốn vươn tới những điều vĩ đại. Vẻ đẹp thứ hai là ý chí kiên cường: trên hành trình đầy gian nan, Đăm Săn dũng cảm, quyết đoán, không một lần lùi bước — khó khăn càng lớn, ý chí càng bừng sáng. Vẻ đẹp thứ ba là tình yêu buôn làng, cộng đồng: mọi kì tích của chàng đều hướng tới việc bảo vệ, làm rạng danh cộng đồng — anh hùng vì mọi người chứ không vì mình. Và còn một nét đẹp rất “người”: sự kiêu hùng, tự tin đến tự phụ — tin vào sức mình, dám thách thức cả thần linh; nét tính cách ấy khiến Đăm Săn vừa kì vĩ vừa gần gũi, không phải pho tượng đá vô hồn. Hô-me-rơ của Tây Nguyên đã khắc họa tâm hồn ấy bằng ngôn ngữ phóng đại, so sánh, trùng điệp hào hùng. Vẻ đẹp tâm hồn Đăm Săn là kết tinh khát vọng của người Ê-đê: sống phải dám ước mơ, dám hành động, dám vươn lên. Ngày nay, giữa thời đại nhiều cám dỗ khiến con người dễ bằng lòng với sự tầm thường, tâm hồn Đăm Săn nhắc nhở tuổi trẻ: hãy nuôi dưỡng khát vọng lớn và ý chí kiên cường — chỉ có như vậy mới chinh phục được “mặt trời” của đời mình.", "points": 0}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Báo cáo nghiên cứu gồm mấy phần chính?", "options": ["A. 3 phần: đặt vấn đề, giải quyết vấn đề, kết luận", "B. 10 phần", "C. 1 phần duy nhất", "D. Không có bố cục"], "answer": "A", "explain": "Báo cáo nghiên cứu có 3 phần: đặt vấn đề – giải quyết vấn đề – kết luận — bố cục khoa học, logic.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ăng-đrô-mác trong I-li-át là vợ của ai?", "options": ["A. Héc-to", "B. Ô-đi-xê", "C. A-sin", "D. Agamemnông"], "answer": "A", "explain": "Ăng-đrô-mác là vợ của Héc-to — người phụ nữ yêu chồng, giàu đức hi sinh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trích dẫn gián tiếp là gì?", "options": ["A. Không cần ghi nguồn", "B. Bịa ra ý của người khác", "C. Diễn đạt lại ý của người khác bằng lời của mình (vẫn phải trung thực và ghi nguồn)", "D. Chép nguyên văn không cần ngoặc kép"], "answer": "C", "explain": "Trích dẫn gián tiếp diễn đạt lại ý bằng lời mình — vẫn phải trung thực với ý gốc và ghi nguồn đầy đủ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Hô-me-rơ được coi là nhà thơ vĩ đại của Hi Lạp cổ đại?", "options": ["A. Vì ông biết nhiều ngoại ngữ", "B. Vì ông sống rất lâu", "C. Vì hai sử thi I-li-át và Ô-đi-xê là đỉnh cao văn học, ảnh hưởng sâu rộng đến văn minh nhân loại", "D. Vì ông rất giàu có"], "answer": "C", "explain": "I-li-át và Ô-đi-xê là đỉnh cao của sử thi thế giới, đặt nền móng cho văn học phương Tây — Hô-me-rơ bất tử cùng tác phẩm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi sử dụng trích dẫn trong bài viết, cần tuân thủ yêu cầu nào?", "options": ["A. Bịa thêm ý vào trích dẫn", "B. Trích tùy tiện, không cần nguồn", "C. Trích chính xác, đúng nguồn, ghi cước chú đầy đủ; tỉnh lược phải giữ đúng ý", "D. Trích càng dài càng tốt"], "answer": "C", "explain": "Trích dẫn phải chính xác, ghi nguồn, tỉnh lược giữ đúng ý — đó là sự trung thực khoa học tối thiểu.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Nêu tên thành phố (thành bang) mà Héc-to chiến đấu bảo vệ.", "answer": "Tơ-roa", "explain": "Héc-to là hoàng tử thành Tơ-roa, hi sinh để bảo vệ quê hương trước quân Hi Lạp.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trong đoạn trích Đăm Săn, thủ pháp nào được dùng nhiều nhất để miêu tả sức mạnh phi thường của nhân vật?", "answer": "phóng đại", "explain": "Phóng đại là thủ pháp chủ đạo: nâng sức mạnh Đăm Săn lên mức phi thường, kì vĩ — đặc trưng sử thi.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Câu nói “sử thi là bài ca về cộng đồng” muốn nhấn mạnh điều gì?", "answer": "tính cộng đồng", "explain": "Sử thi không kể chuyện cá nhân mà kể về biến cố của cộng đồng, anh hùng là kết tinh của cộng đồng — tính cộng đồng là bản chất sử thi.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ bàn về vai trò của người anh hùng trong sử thi (lấy dẫn chứng từ Héc-to và Đăm Săn).", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: nêu luận điểm — anh hùng là linh hồn của sử thi. 2) Thân đoạn: phân tích vai trò — trung tâm của biến cố (mọi sự kiện xoay quanh anh hùng); kết tinh sức mạnh, khát vọng cộng đồng (Héc-to: trách nhiệm; Đăm Săn: khát vọng); tấm gương đạo đức (dạy cách sống); dẫn chứng cụ thể. 3) Kết đoạn: khẳng định; liên hệ (cần những tấm gương hôm nay). BÀI MẪU: Người anh hùng là linh hồn của sử thi, giữ vai trò không thể thay thế. Trước hết, anh hùng là trung tâm của mọi biến cố: trong I-li-át, cuộc chiến Tơ-roa xoay quanh Héc-to; trong sử thi Ê-đê, mọi kì tích gắn với Đăm Săn — không có anh hùng thì không có sử thi. Thứ hai, anh hùng là kết tinh sức mạnh, phẩm chất và khát vọng của cả cộng đồng: Héc-to kết tinh lòng yêu nước, tinh thần trách nhiệm của người Hi Lạp; Đăm Săn kết tinh khát vọng chinh phục, ý chí vươn lên của người Ê-đê. Nhân dân gửi vào anh hùng những gì đẹp đẽ nhất mà mình mơ ước. Thứ ba, anh hùng là tấm gương đạo đức: Héc-to dạy ta sống có trách nhiệm, đặt nghĩa lớn lên trên tình riêng; Đăm Săn dạy ta dám ước mơ lớn và kiên cường hành động. Những bài học ấy vượt thời gian, vẫn nguyên giá trị. Có thể nói, người anh hùng sử thi là “người thầy” của cộng đồng: qua họ, nhân dân tự giáo dục mình. Ngày nay, dù không còn những Héc-to, Đăm Săn, xã hội vẫn cần những “anh hùng” đời thường — những con người sống có lí tưởng, dám hi sinh vì cộng đồng. Đó là cách sức sống của sử thi tiếp tục trong thời đại mới.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết báo cáo nghiên cứu khoảng 600 chữ về đề tài: Vẻ đẹp của người anh hùng trong sử thi Tây Nguyên (tập trung vào nhân vật Đăm Săn).", "explain": "DÀN Ý CHI TIẾT: 1) Đặt vấn đề: lí do chọn đề tài (sử thi Tây Nguyên là di sản quý; Đăm Săn tiêu biểu); mục đích, phạm vi (đoạn trích “Đăm Săn đi bắt Nữ thần Mặt Trời”). 2) Giải quyết vấn đề: a) Vẻ đẹp sức mạnh phi thường (dẫn chứng phóng đại). b) Vẻ đẹp khát vọng chinh phục (bắt Nữ thần Mặt Trời). c) Vẻ đẹp tâm hồn (dũng cảm, yêu cộng đồng, kiêu hùng). d) Nghệ thuật xây dựng (so sánh, phóng đại, trùng điệp). Có trích dẫn, cước chú. 3) Kết luận: tổng hợp; ý nghĩa (giữ gìn di sản; bài học cho tuổi trẻ). BÀI MẪU: 1. Đặt vấn đề: Sử thi Tây Nguyên là di sản văn hóa phi vật thể quý báu của dân tộc ta, trong đó Đăm Săn là sử thi tiêu biểu nhất. Tìm hiểu vẻ đẹp người anh hùng Đăm Săn giúp ta hiểu thêm bản sắc văn hóa Ê-đê và bồi đắp tâm hồn. Báo cáo tập trung vào đoạn trích “Đăm Săn đi bắt Nữ thần Mặt Trời”. 2. Giải quyết vấn đề: Trước hết, Đăm Săn có vẻ đẹp của sức mạnh phi thường: qua thủ pháp phóng đại, mỗi hành động của chàng đều vượt ngoài sức người — “mỗi bước chân rung chuyển núi rừng” — xứng tầm vóc anh hùng sử thi. Thứ hai, vẻ đẹp của khát vọng chinh phục: dám lên đường bắt Nữ thần Mặt Trời — khát vọng vươn tới cả thần linh, thể hiện ý chí không cam chịu số phận của người Ê-đê. Thứ ba, vẻ đẹp tâm hồn: dũng cảm, quyết đoán trước gian nan; yêu thương buôn làng, chiến đấu vì cộng đồng; đồng thời có nét kiêu hùng rất con người. Về nghệ thuật, nhân vật được xây dựng bằng bộ ba so sánh – phóng đại – trùng điệp, ngôn ngữ trang trọng giàu hình ảnh núi rừng, tạo nhịp hào hùng như cồng chiêng. 3. Kết luận: Đăm Săn là kết tinh sức mạnh, khát vọng và tâm hồn của người Ê-đê — một trong những hình tượng anh hùng đẹp nhất của sử thi Việt Nam. Giữ gìn sử thi Tây Nguyên là trách nhiệm của thế hệ trẻ; và bài học từ Đăm Săn — dám ước mơ lớn, kiên cường hành động — mãi còn nguyên giá trị.", "points": 0}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Khi viết báo cáo nghiên cứu, tài liệu tham khảo cần đảm bảo yêu cầu gì?", "options": ["A. Càng nhiều tin đồn càng tốt", "B. Chỉ cần nghe kể lại", "C. Đáng tin cậy, có nguồn gốc rõ ràng", "D. Lấy từ bất cứ đâu, không cần kiểm chứng"], "answer": "C", "explain": "Tài liệu nghiên cứu phải đáng tin cậy, có nguồn gốc rõ ràng — đó là cơ sở của tính khoa học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nữ thần mà Đăm Săn đi “bắt” trong đoạn trích là ai?", "options": ["A. Nữ thần Mặt Trời", "B. Nữ thần Biển", "C. Nữ thần Mặt Trăng", "D. Nữ thần Lúa"], "answer": "A", "explain": "Đăm Săn đi bắt Nữ thần Mặt Trời về làm vợ — khát vọng chinh phục phi thường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong I-li-át, quân đội vây hãm thành Tơ-roa là quân của ai?", "options": ["A. Quân La Mã", "B. Quân Ba Tư", "C. Quân Hi Lạp", "D. Quân Ai Cập"], "answer": "C", "explain": "Quân Hi Lạp vây hãm thành Tơ-roa — bối cảnh của sử thi I-li-át và đoạn trích từ biệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cần ghi cước chú khi trích dẫn trong báo cáo nghiên cứu?", "options": ["A. Để trang trí", "B. Để khoe đã đọc nhiều sách", "C. Để bài viết dài hơn", "D. Để thể hiện sự trung thực khoa học, giúp người đọc kiểm chứng nguồn"], "answer": "D", "explain": "Cước chú ghi nguồn giúp người đọc kiểm chứng, thể hiện sự trung thực khoa học — yêu cầu bắt buộc của nghiên cứu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác biệt lớn nhất giữa Héc-to và Đăm Săn là gì?", "options": ["A. Héc-to mang bi kịch trách nhiệm (gia đình – Tổ quốc), Đăm Săn mang khát vọng chinh phục (vươn tới thần linh)", "B. Héc-to là người Việt, Đăm Săn là người Hi Lạp", "C. Không có điểm gì khác nhau", "D. Héc-to yếu đuối, Đăm Săn mạnh mẽ"], "answer": "A", "explain": "Héc-to đẹp ở sự hi sinh vì nghĩa lớn; Đăm Săn đẹp ở khát vọng chinh phục — hai vẻ đẹp anh hùng khác nhau của hai nền văn hóa.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Kể tên một thủ pháp nghệ thuật đặc trưng của ngôn ngữ sử thi (ngoài so sánh).", "answer": "phóng đại", "explain": "Phóng đại (hoặc trùng điệp) là thủ pháp đặc trưng của ngôn ngữ sử thi, bên cạnh so sánh.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trong báo cáo nghiên cứu, phần nào trình bày quá trình tìm hiểu, phân tích bằng lí lẽ và bằng chứng?", "answer": "giải quyết vấn đề", "explain": "Phần “giải quyết vấn đề” là phần chính của báo cáo: trình bày quá trình tìm hiểu, phân tích, lí giải.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sử thi Tây Nguyên thường được diễn xướng cùng với loại hình nghệ thuật nào?", "answer": "cồng chiêng", "explain": "Sử thi Tây Nguyên gắn với không gian văn hóa cồng chiêng — nghệ thuật diễn xướng tạo nên sức sống của sử thi.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ bàn về cách sử dụng trích dẫn, cước chú khi viết báo cáo nghiên cứu (lấy ví dụ minh họa).", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: nêu luận điểm — trích dẫn, cước chú đúng cách thể hiện sự trung thực khoa học. 2) Thân đoạn: phân tích — trích dẫn trực tiếp (ngoặc kép, nguyên văn) vs gián tiếp (diễn đạt lại); cước chú (ghi nguồn cuối trang, đánh số); tỉnh lược ([…]); ví dụ minh họa (viết về Đăm Săn: trích câu văn miêu tả sức mạnh + cước chú nguồn); tác hại khi thiếu (đạo văn, kém tin cậy). 3) Kết đoạn: khẳng định; liên hệ (rèn thói quen khi viết). BÀI MẪU: Sử dụng trích dẫn và cước chú đúng cách là thước đo sự trung thực khoa học của một báo cáo nghiên cứu. Khi muốn dẫn lời người khác làm bằng chứng, có hai cách: trích dẫn trực tiếp — dẫn nguyên văn đặt trong dấu ngoặc kép; và trích dẫn gián tiếp — diễn đạt lại ý bằng lời của mình. Cả hai cách đều phải ghi nguồn bằng cước chú ở cuối trang, đánh số thứ tự. Ví dụ, khi viết về Đăm Săn, em có thể trích dẫn trực tiếp một câu văn miêu tả sức mạnh của chàng trong ngoặc kép, rồi ghi cước chú: “Trích Đăm Săn, sử thi Ê-đê”. Nếu đoạn trích quá dài, có thể bỏ bớt phần không cần thiết nhưng phải đánh dấu tỉnh lược bằng […] để người đọc biết — tuyệt đối không được làm sai lệch ý gốc. Ngược lại, dẫn ý người khác mà không ghi nguồn là đạo văn, vi phạm đạo đức khoa học; báo cáo thiếu trích dẫn, cước chú sẽ kém tin cậy, không ai dám tin vào kết quả. Vì vậy, ngay từ khi còn ngồi trên ghế nhà trường, hãy rèn thói quen: mượn ý ai thì ghi nguồn người ấy — đó vừa là sự tôn trọng trí tuệ người khác, vừa là cách bảo vệ uy tín của chính mình.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết báo cáo nghiên cứu khoảng 600 chữ về đề tài: Sức sống của sử thi trong đời sống hiện đại.", "explain": "DÀN Ý CHI TIẾT: 1) Đặt vấn đề: có ý kiến cho rằng sử thi đã lỗi thời; mục đích chứng minh sử thi vẫn có sức sống; phạm vi (I-li-át, Đăm Săn và đời sống hiện nay). 2) Giải quyết vấn đề: a) Giá trị nhân văn bền vững (yêu nước, trách nhiệm, khát vọng). b) Giá trị thẩm mĩ (ngôn ngữ, hình tượng) vẫn hấp dẫn. c) Bằng chứng sức sống: nghiên cứu, chuyển thể (phim, sân khấu), du lịch văn hóa, giáo dục. d) Thách thức: cách tiếp cận khô khan; giải pháp phát huy. Có trích dẫn, cước chú. 3) Kết luận: khẳng định; kêu gọi giữ gìn. BÀI MẪU: 1. Đặt vấn đề: Trong thời đại công nghệ số, có ý kiến cho rằng sử thi — những câu chuyện hàng nghìn năm tuổi — đã hết sức sống. Báo cáo này chứng minh điều ngược lại qua hai sử thi tiêu biểu: I-li-át của Hô-me-rơ và Đăm Săn của dân tộc Ê-đê, cùng những biểu hiện trong đời sống hiện nay. 2. Giải quyết vấn đề: Trước hết, sử thi mang những giá trị nhân văn bền vững: Héc-to dạy lòng yêu nước và tinh thần trách nhiệm — bài học càng cần khi chủ nghĩa cá nhân lấn át; Đăm Săn dạy khát vọng vươn lên — bài học quý cho tuổi trẻ khởi nghiệp. Những giá trị ấy thuộc về mọi thời đại, không riêng quá khứ. Thứ hai, sử thi có giá trị thẩm mĩ đặc biệt: ngôn ngữ trang trọng, hào hùng; hình tượng anh hùng kì vĩ; cốt truyện li kì — vẫn đủ sức hấp dẫn nếu được tiếp cận đúng cách. Thực tế cho thấy sử thi vẫn sống: các nhà nghiên cứu tiếp tục khai thác; nhiều tác phẩm được chuyển thể thành phim, sân khấu; không gian văn hóa cồng chiêng Tây Nguyên thu hút đông đảo du khách; sử thi được đưa vào chương trình giáo dục. Thách thức lớn nhất không phải ở sử thi mà ở cách tiếp cận: dạy học khô khan khiến giới trẻ xa lạ. Giải pháp là đổi mới cách giới thiệu: chuyển thể bằng ngôn ngữ hiện đại, gắn với trải nghiệm, dùng công nghệ số để lan tỏa. 3. Kết luận: Sử thi vẫn có sức sống mãnh liệt nhờ giá trị nhân văn và thẩm mĩ bền vững. Giữ gìn, phát huy di sản sử thi — nhất là sử thi các dân tộc Việt Nam — là trách nhiệm của thế hệ trẻ hôm nay.", "points": 0}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Đặc trưng về thời gian trong sử thi là gì?", "options": ["A. Hiện tại cụ thể từng ngày", "B. Tương lai xa vời", "C. Không có thời gian", "D. Quá khứ xa xôi, mang tính huyền thoại"], "answer": "D", "explain": "Thời gian sử thi là quá khứ xa xôi, huyền thoại (“thuở ấy”) — thời đại hoàng kim của cộng đồng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong đoạn trích I-li-át, Héc-to từ biệt ai trước khi ra trận?", "options": ["A. Vợ (Ăng-đrô-mác) và con trai", "B. Không từ biệt ai", "C. Bạn bè đi nhậu", "D. Kẻ thù"], "answer": "A", "explain": "Héc-to từ biệt vợ Ăng-đrô-mác và con trai nhỏ — cuộc từ biệt đầy xúc động trước giờ ra trận.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Báo cáo nghiên cứu khác bài văn nghị luận thông thường ở điểm nào?", "options": ["A. Viết tùy hứng", "B. Không cần bố cục", "C. Trình bày kết quả tìm hiểu một cách có hệ thống, khoa học, có trích dẫn và cước chú đầy đủ", "D. Không cần bằng chứng"], "answer": "C", "explain": "Báo cáo nghiên cứu đòi hỏi tính khoa học cao: hệ thống, trích dẫn, cước chú đầy đủ — khác với bài văn cảm nhận tự do.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao chi tiết Đăm Săn “đi bắt Nữ thần Mặt Trời” lại có sức hấp dẫn đặc biệt?", "options": ["A. Vì rất bình thường", "B. Vì ai cũng làm được", "C. Vì đó là khát vọng phi thường, táo bạo: con người dám vươn tới cả thần linh", "D. Vì không có ý nghĩa gì"], "answer": "C", "explain": "Khát vọng “bắt mặt trời” táo bạo đến phi thường — thể hiện ý chí vươn lên cực đại của con người, gây ấn tượng mạnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi phân tích nhân vật sử thi, cần chú ý điều gì?", "options": ["A. Chỉ chú ý ngoại hình", "B. Sức mạnh, phẩm chất, khát vọng và vai trò của nhân vật với cộng đồng; nghệ thuật khắc họa", "C. Chỉ đếm số lần xuất hiện", "D. Không cần phân tích gì"], "answer": "B", "explain": "Phân tích nhân vật sử thi phải toàn diện: sức mạnh, phẩm chất, khát vọng, vai trò cộng đồng và nghệ thuật khắc họa.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Nêu một biểu hiện của thủ pháp trùng điệp trong sử thi Tây Nguyên.", "answer": "lặp cấu trúc", "explain": "Trùng điệp: lặp lại cấu trúc câu, hình ảnh (lặp cấu trúc, lặp hình ảnh) tạo nhịp điệu hào hùng như cồng chiêng.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trong “Héc-to từ biệt Ăng-đrô-mác”, Hô-me-rơ đã dùng hình thức lời nào là chủ yếu để khắc họa tâm trạng nhân vật?", "answer": "đối thoại", "explain": "Đối thoại là hình thức chủ yếu: cuộc trò chuyện từ biệt bộc lộ trực tiếp tâm trạng, tính cách nhân vật.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Quan niệm “danh dự và trách nhiệm với cộng đồng cao hơn hạnh phúc cá nhân” là quan niệm của nền văn hóa nào (qua đoạn trích I-li-át)?", "answer": "Hi Lạp", "explain": "Đó là quan niệm của người Hi Lạp cổ đại: Héc-to hi sinh hạnh phúc riêng vì Tơ-roa — danh dự cộng đồng là tối thượng.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích vẻ đẹp của không gian, thời gian trong sử thi (qua hai đoạn trích đã học).", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: nêu luận điểm — không gian, thời gian góp phần tạo tầm vóc sử thi. 2) Thân đoạn: phân tích — không gian rộng lớn, kì vĩ (chiến trường Tơ-roa khói lửa; núi rừng Tây Nguyên bao la); thời gian huyền thoại (quá khứ xa xôi); tác dụng (xứng tầm anh hùng, tạo không khí hào hùng; tách khỏi đời thường). 3) Kết đoạn: khẳng định; cảm nghĩ. BÀI MẪU: Không gian và thời gian là hai yếu tố góp phần tạo nên tầm vóc kì vĩ của sử thi, thể hiện rõ qua hai đoạn trích đã học. Về không gian, cả hai tác phẩm đều mở ra những chân trời rộng lớn: một bên là chiến trường thành Tơ-roa khói lửa, nơi những đoàn quân dàn trận; một bên là núi rừng Tây Nguyên bao la, nơi Đăm Săn vượt đèo, lội suối đi bắt mặt trời. Không gian ấy không chật hẹp, tủn mủn mà bao la, hùng vĩ — xứng với tầm vóc của biến cố trọng đại và người anh hùng phi thường. Về thời gian, cả hai đều đặt câu chuyện vào quá khứ xa xôi, mang tính huyền thoại: “thuở ấy”, “ngày xưa” — thời đại hoàng kim của cộng đồng, khi con người còn sống chan hòa với thần linh. Thời gian huyền thoại tách câu chuyện khỏi đời thường cụ thể, nâng nó lên thành huyền thoại chung của cả dân tộc. Tác dụng của không – thời gian kì vĩ là tạo nên không khí hào hùng, trang trọng bao trùm tác phẩm: người đọc như được đưa về một thế giới khác, lớn lao hơn đời thường, nơi những điều phi thường trở thành có thể. Chính không gian, thời gian ấy làm nên sức hấp dẫn đặc biệt của sử thi — vừa xa xôi vừa gần gũi, vừa huyền ảo vừa chân thực.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích bi kịch của người anh hùng Héc-to trong đoạn trích “Héc-to từ biệt Ăng-đrô-mác”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu Héc-to, đoạn trích; nêu vấn đề: bi kịch anh hùng. 2) Thân bài: a) Hoàn cảnh bi kịch (Tơ-roa lâm nguy, ra trận có thể không về). b) Hai lực kéo: tình gia đình (yêu vợ thương con) vs nghĩa lớn (Tổ quốc). c) Diễn biến tâm lí qua đối thoại (giằng xé, lựa chọn). d) Ý nghĩa: bi kịch làm nên chiều sâu; quan niệm Hi Lạp (danh dự cộng đồng tối thượng); vẻ đẹp hi sinh. e) Nghệ thuật: đối thoại, giọng bi tráng. 3) Kết bài: khẳng định; liên hệ (sống có trách nhiệm). BÀI MẪU: Trong gallery những người anh hùng của văn học thế giới, Héc-to có một vị trí đặc biệt bởi bi kịch cao đẹp của mình trong đoạn trích “Héc-to từ biệt Ăng-đrô-mác”. Bi kịch của chàng bắt nguồn từ hoàn cảnh nghiệt ngã: thành Tơ-roa đang bị quân Hi Lạp vây hãm, Héc-to — vị tướng tài ba nhất — phải ra trận với linh cảm có thể không trở về. Đứng trước giờ phút sinh tử, chàng bị giằng xé bởi hai lực kéo mãnh liệt. Một bên là tình gia đình: người vợ trẻ Ăng-đrô-mác với nước mắt van xin, đứa con thơ cần chỗ dựa — tình yêu thương chân thành, tha thiết. Một bên là nghĩa lớn với Tổ quốc: Tơ-roa đang lâm nguy, nhân dân cần người bảo vệ. Chọn gia đình thì có lỗi với đất nước; chọn Tổ quốc thì phải hi sinh hạnh phúc riêng — không có lựa chọn nào không đau đớn. Qua đối thoại từ biệt đầy nước mắt, ta thấy rõ sự giằng xé trong tâm hồn chàng, và cuối cùng Héc-to đã chọn nghĩa lớn: ra trận với tinh thần quyết tử. Sự lựa chọn ấy thể hiện quan niệm của người Hi Lạp cổ đại: danh dự và trách nhiệm với cộng đồng cao hơn hạnh phúc cá nhân. Chính bi kịch và sự lựa chọn cao đẹp làm nên chiều sâu nhân vật: Héc-to không phải cỗ máy chiến tranh vô cảm mà là con người đích thực — biết yêu, biết đau, và biết hi sinh. Hô-me-rơ đã thể hiện bi kịch bằng nghệ thuật đối thoại giàu cảm xúc và giọng điệu bi tráng đặc trưng. Bi kịch của Héc-to nhắc nhở chúng ta: trong cuộc sống, đôi khi phải biết hi sinh lợi ích riêng vì lợi ích chung; và những hi sinh thầm lặng ấy là điều cao đẹp nhất làm nên giá trị con người.", "points": 0}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Sức sống của sử thi thể hiện ở điểm nào?", "options": ["A. Không có sức sống gì", "B. Sử thi rất dài nên khó quên", "C. Những giá trị nhân văn và thẩm mĩ bền vững, vẫn được đón nhận qua các thời đại", "D. Bắt buộc phải học thuộc"], "answer": "C", "explain": "Sức sống của sử thi nằm ở giá trị nhân văn, thẩm mĩ bền vững — mỗi thời đại đều tìm thấy mình trong đó.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để bài viết có tính khoa học, khi mượn ý của người khác cần làm gì?", "options": ["A. Trích dẫn trung thực và ghi nguồn bằng cước chú", "B. Giấu nguồn đi", "C. Không cần làm gì", "D. Bịa ra nguồn"], "answer": "A", "explain": "Mượn ý phải trích dẫn trung thực và ghi nguồn — đó là đạo đức khoa học tối thiểu và là cách bảo vệ uy tín của mình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mở đầu báo cáo nghiên cứu (phần đặt vấn đề) cần nêu những gì?", "options": ["A. Kết quả nghiên cứu", "B. Vấn đề nghiên cứu, lí do chọn đề tài, mục đích, phạm vi", "C. Quảng cáo", "D. Lời cảm ơn"], "answer": "B", "explain": "Đặt vấn đề nêu: nghiên cứu cái gì, vì sao chọn, nhằm mục đích gì, phạm vi nào — định hướng toàn báo cáo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung về giá trị nhân văn giữa I-li-át và Đăm Săn là gì?", "options": ["A. Cùng ca ngợi sức mạnh, phẩm chất cao đẹp của con người và khát vọng vươn lên", "B. Cùng kể về thần linh", "C. Không có điểm chung", "D. Cùng viết bằng chữ Hán"], "answer": "A", "explain": "Cả hai sử thi đều ca ngợi con người phi thường, khát vọng vươn lên — giá trị nhân văn phổ quát, bền vững.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi giới thiệu một tác phẩm sử thi (nói và nghe), cần chú ý điều gì?", "options": ["A. Chỉ kể tóm tắt rồi thôi", "B. Đọc thuộc lòng cả tác phẩm", "C. Nêu được nội dung chính, vẻ đẹp anh hùng, đặc sắc nghệ thuật và cảm nhận bản thân; trình bày mạch lạc, truyền cảm", "D. Nói càng nhanh càng tốt"], "answer": "C", "explain": "Giới thiệu sử thi cần nêu nội dung, vẻ đẹp anh hùng, nghệ thuật và cảm nhận — trình bày mạch lạc, truyền cảm.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Nêu tên dân tộc có sử thi Đăm Săn.", "answer": "Ê-đê", "explain": "Đăm Săn là sử thi anh hùng của dân tộc Ê-đê ở Tây Nguyên.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Vì sao thế hệ trẻ hôm nay cần tìm hiểu sử thi dân tộc?", "answer": "giữ gìn bản sắc", "explain": "Tìm hiểu sử thi giúp giữ gìn bản sắc văn hóa, bồi đắp tâm hồn và học những bài học về lòng yêu nước, ý chí vươn lên.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong lí luận văn học, những tác phẩm tự sự dân gian có quy mô lớn, kể về biến cố trọng đại và người anh hùng phi thường được xếp vào thể loại …", "answer": "sử thi", "explain": "Sử thi là thể loại tự sự dân gian quy mô lớn nhất — đỉnh cao của văn học dân gian các dân tộc.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày suy nghĩ của em về lòng dũng cảm (liên hệ hình tượng người anh hùng sử thi).", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: nêu luận điểm — dũng cảm là phẩm chất cao đẹp. 2) Thân đoạn: suy nghĩ — dũng cảm là gì (dám đối mặt khó khăn, hi sinh vì nghĩa lớn); dẫn chứng (Héc-to ra trận, Đăm Săn chinh phục); dũng cảm hôm nay (dám nói lên sự thật, vượt khó học tập, bảo vệ lẽ phải); phê phán hèn nhát, vô cảm. 3) Kết đoạn: khẳng định; rèn luyện. BÀI MẪU: Lòng dũng cảm là một trong những phẩm chất cao đẹp nhất của con người, được tôn vinh từ những trang sử thi cổ đại đến cuộc sống hôm nay. Dũng cảm không chỉ là không sợ nguy hiểm mà là dám đối mặt với khó khăn, dám hi sinh lợi ích riêng vì nghĩa lớn. Héc-to dũng cảm ra trận bảo vệ Tơ-roa dù biết có thể không trở về; Đăm Săn dũng cảm lên đường chinh phục thần linh dù đầy gian nan — đó là dũng cảm của người anh hùng. Ngày nay, dũng cảm có những biểu hiện mới: dám nói lên sự thật, dám bảo vệ lẽ phải trước cái sai; dám vượt qua khó khăn trong học tập thay vì bỏ cuộc; dám nhận lỗi và sửa sai. Ngược lại, hèn nhát — thấy sai không dám nói, gặp khó đã nản — và vô cảm — thấy người gặp nạn mà thờ ơ — là những điều đáng xấu hổ. Dũng cảm không phải là liều lĩnh mù quáng mà là sự can đảm có lí trí, có mục đích cao đẹp. Mỗi chúng ta hãy rèn luyện lòng dũng cảm từ những việc nhỏ: dám phát biểu ý kiến, dám thử thách bản thân, dám đứng về phía lẽ phải. Như các anh hùng sử thi đã chứng minh: dũng cảm làm nên giá trị con người, và chỉ những ai dũng cảm mới chinh phục được những đỉnh cao của cuộc đời.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ bàn về sức sống của sử thi qua hai tác phẩm “I-li-át” (đoạn trích Héc-to) và “Đăm Săn” (đoạn trích đi bắt Nữ thần Mặt Trời).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: nêu vấn đề — sức sống của sử thi qua hai kiệt tác Đông – Tây. 2) Thân bài: a) Sức sống từ giá trị nhân văn (Héc-to: yêu nước, trách nhiệm; Đăm Săn: khát vọng vươn lên) — còn nguyên ý nghĩa. b) Sức sống từ giá trị thẩm mĩ (hình tượng anh hùng kì vĩ; ngôn ngữ hào hùng). c) Biểu hiện trong đời sống hiện nay (nghiên cứu, chuyển thể, giáo dục, du lịch văn hóa). d) Trách nhiệm giữ gìn (nhất là sử thi Việt Nam). 3) Kết bài: khẳng định; kêu gọi. BÀI MẪU: Cách nhau hàng nghìn năm và nửa vòng trái đất, sử thi I-li-át của Hô-me-rơ và sử thi Đăm Săn của dân tộc Ê-đê cùng chứng minh một điều: sử thi có sức sống bền lâu trong lòng nhân loại. Sức sống ấy trước hết đến từ những giá trị nhân văn không bao giờ cũ. Héc-to với bi kịch cao đẹp dạy ta lòng yêu nước và tinh thần trách nhiệm: đặt lợi ích cộng đồng lên trên lợi ích cá nhân — bài học càng thiết thực khi chủ nghĩa cá nhân có xu hướng lấn át. Đăm Săn với khát vọng “bắt mặt trời” dạy ta ý chí vươn lên: dám ước mơ lớn, dám hành động để chinh phục — bài học quý cho tuổi trẻ trong thời đại khởi nghiệp. Những giá trị ấy thuộc về mọi thời đại, không riêng quá khứ. Sức sống của sử thi còn đến từ giá trị thẩm mĩ đặc biệt: hình tượng người anh hùng kì vĩ, ngôn ngữ trang trọng hào hùng, những câu chuyện li kì hấp dẫn — vẫn đủ sức lôi cuốn nếu được tiếp cận đúng cách. Thực tế, sử thi vẫn đang sống: được nghiên cứu, chuyển thể thành phim ảnh, sân khấu; không gian văn hóa cồng chiêng Tây Nguyên thu hút du khách; sử thi được đưa vào nhà trường. Với Việt Nam, giữ gìn sử thi các dân tộc — nhất là sử thi Tây Nguyên đang đứng trước nguy cơ mai một — là trách nhiệm thiêng liêng: đó là giữ gìn cội nguồn văn hóa, bản sắc dân tộc. Hãy đọc sử thi như một cuộc gặp gỡ với cha ông: ta sẽ thấy quá khứ chưa bao giờ xa, và những người anh hùng nghìn năm vẫn đang nói với chúng ta về cách sống đẹp hôm nay.", "points": 0}]}]}
