{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Văn bản thông tin có đặc trưng cơ bản nào?", "options": ["A. Hư cấu, tưởng tượng", "B. Chính xác, khách quan, cập nhật", "C. Giàu cảm xúc chủ quan", "D. Chỉ dùng thơ ca"], "answer": "B", "points": 0.25, "explain": "Văn bản thông tin cung cấp tri thức, tin tức một cách chính xác (số liệu kiểm chứng), khách quan (hạn chế cảm xúc chủ quan) và cập nhật."}, {"type": "mcq", "level": "NB", "q": "Văn bản Sự sống và cái chết được trích từ tác phẩm nào?", "options": ["A. Văn minh Việt Nam", "B. Từ điển yêu thích bầu trời và các vì sao", "C. Đời sống bí ẩn của cây", "D. Quốc âm thi tập"], "answer": "B", "points": 0.25, "explain": "Sự sống và cái chết của Trịnh Xuân Thuận trích từ Từ điển yêu thích bầu trời và các vì sao, viết về vòng đời của các vì sao."}, {"type": "mcq", "level": "TH", "q": "Ý chính của văn bản Sự sống và cái chết là gì?", "options": ["A. Kể về cuộc đời của tác giả", "B. Giới thiệu vòng đời các vì sao và suy ngẫm về quy luật sống – chết trong vũ trụ", "C. Phê phán ô nhiễm môi trường", "D. Hướng dẫn ngắm sao"], "answer": "B", "points": 0.25, "explain": "Văn bản giới thiệu vòng đời sao (sinh ra, tỏa sáng, chết đi) rồi mở rộng thành suy ngẫm triết lí: sống – chết là quy luật phổ biến của vũ trụ."}, {"type": "mcq", "level": "TH", "q": "Phương tiện phi ngôn ngữ nào được dùng trong văn bản Phục hồi tầng ozone (theo SGK)?", "options": ["A. Thơ ca", "B. Hình ảnh mô phỏng lỗ thủng ozone sắp xếp theo trục thời gian, thang đơn vị", "C. Nhạc nền", "D. Phim tài liệu"], "answer": "B", "points": 0.25, "explain": "Văn bản dùng hình ảnh mô phỏng lỗ thủng tầng ozone ở Nam Cực sắp xếp theo trục thời gian (1979–2019) kèm thang đơn vị và chú thích — trực quan, khoa học."}, {"type": "mcq", "level": "VDC", "q": "Vì sao văn bản Phục hồi tầng ozone được đánh giá là cho thấy thành công hiếm hoi của nỗ lực toàn cầu?", "options": ["A. Vì chỉ một nước thực hiện", "B. Vì các nước đã cùng tuân thủ Nghị định thư Montreal, cấm chất phá hủy ozone và tầng ozone đang phục hồi", "C. Vì không tốn tiền", "D. Vì ozone tự phục hồi không cần con người"], "answer": "B", "points": 0.25, "explain": "Nhờ Nghị định thư Montreal (1987), các nước cùng cấm chất CFC phá hủy ozone; kết quả là lỗ thủng ozone thu hẹp dần — minh chứng hiếm hoi cho sức mạnh hợp tác toàn cầu."}, {"type": "short", "level": "NB", "q": "Kể tên ba dạng văn bản thông tin thường gặp.", "answer": "Bản tin, văn bản thuyết minh, văn bản nội quy/hướng dẫn", "points": 0.5, "explain": "Ba dạng thường gặp: bản tin (tin tức ngắn gọn); văn bản thuyết minh (tri thức có hệ thống); văn bản nội quy, hướng dẫn (quy định, chỉ dẫn hành động)."}, {"type": "short", "level": "TH", "q": "Nêu hai phương tiện phi ngôn ngữ thường dùng trong văn bản thông tin.", "answer": "Hình ảnh và sơ đồ/biểu đồ (bảng số liệu, màu sắc, kí hiệu)", "points": 0.5, "explain": "Các phương tiện phi ngôn ngữ: hình ảnh, sơ đồ, biểu đồ, bảng số liệu, màu sắc, đường nét, kí hiệu — giúp thông tin trực quan, dễ nắm bắt."}, {"type": "short", "level": "VD", "q": "Khi đọc văn bản thông tin, cần chú ý những yếu tố nào để đánh giá độ tin cậy?", "answer": "Số liệu có kiểm chứng, nguồn trích dẫn rõ ràng, tính cập nhật", "points": 0.5, "explain": "Đánh giá độ tin cậy qua: số liệu, sự kiện có được kiểm chứng không; nguồn trích dẫn có rõ ràng, uy tín không; thông tin có cập nhật không."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ tóm tắt nội dung chính của văn bản Phục hồi tầng ozone: Thành công hiếm hoi của nỗ lực toàn cầu.", "points": 0, "explain": "DÀN Ý: Mở đoạn: giới thiệu văn bản. Thân đoạn: thực trạng (lỗ thủng ozone ở Nam Cực, nguyên nhân chất CFC); nỗ lực toàn cầu (Nghị định thư Montreal 1987); kết quả (ozone dần phục hồi qua số liệu, hình ảnh các năm); ý nghĩa (bài học hợp tác, niềm tin). Kết đoạn: thông điệp. BÀI MẪU: Văn bản Phục hồi tầng ozone: Thành công hiếm hoi của nỗ lực toàn cầu cung cấp những thông tin quan trọng về cuộc chiến bảo vệ tầng ozone của nhân loại. Mở đầu, văn bản cho biết thực trạng đáng lo ngại: tầng ozone ở Nam Cực xuất hiện lỗ thủng ngày càng rộng, nguyên nhân chính là các chất CFC có trong tủ lạnh, bình xịt... do con người thải ra. Trước nguy cơ, cộng đồng quốc tế đã hành động: Nghị định thư Montreal năm 1987 được kí kết, yêu cầu các nước cấm sản xuất, sử dụng các chất phá hủy ozone. Bằng số liệu và hình ảnh mô phỏng lỗ thủng ozone qua các năm từ 1979 đến 2019, văn bản cho thấy kết quả đáng mừng: tầng ozone đang dần phục hồi, lỗ thủng thu hẹp lại. Đây được đánh giá là thành công hiếm hoi của nỗ lực toàn cầu — minh chứng cho thấy khi nhân loại đồng lòng hành động kịp thời, con người hoàn toàn có thể khắc phục những hậu quả môi trường do chính mình gây ra. Văn bản khép lại bằng thông điệp lạc quan và lời kêu gọi tiếp tục chung tay bảo vệ môi trường."}, {"type": "essay", "level": "VDC", "q": "Viết một văn bản nội quy lớp học (khoảng 8–10 điều) theo đúng đặc điểm của kiểu văn bản này.", "points": 0, "explain": "DÀN Ý: Tiêu đề: NỘI QUY LỚP HỌC. Mở đầu: mục đích, phạm vi áp dụng. Các điều khoản đánh số: đi học đúng giờ; trang phục; giữ trật tự; giữ vệ sinh; bảo quản cơ sở vật chất; trung thực trong kiểm tra; tôn trọng thầy cô, bạn bè; sử dụng điện thoại đúng quy định; tham gia hoạt động tập thể; chấp hành an toàn. Kết: yêu cầu thực hiện. BÀI MẪU: NỘI QUY LỚP HỌC. (Áp dụng cho tập thể lớp 10A1, năm học 2026–2027; mục đích: xây dựng nề nếp, môi trường học tập tốt.) Điều 1. Đi học đúng giờ; nghỉ học phải xin phép giáo viên chủ nhiệm trước. Điều 2. Mặc đồng phục đúng quy định, đeo phù hiệu đầy đủ khi đến trường. Điều 3. Giữ trật tự trong giờ học; giơ tay phát biểu, không nói chuyện riêng. Điều 4. Giữ gìn vệ sinh lớp học; bỏ rác đúng nơi quy định; trực nhật đầy đủ theo phân công. Điều 5. Bảo quản bàn ghế, thiết bị lớp học; không viết vẽ bậy, không làm hư hỏng tài sản chung. Điều 6. Trung thực trong học tập và kiểm tra; không quay cóp, không dùng tài liệu trái phép. Điều 7. Lễ phép, tôn trọng thầy cô; đoàn kết, giúp đỡ bạn bè; không gây gổ, đánh nhau. Điều 8. Không sử dụng điện thoại trong giờ học trừ khi giáo viên cho phép phục vụ học tập. Điều 9. Tích cực tham gia các hoạt động tập thể của lớp, của trường. Điều 10. Chấp hành nghiêm quy định về an toàn giao thông, an toàn trường học. Mọi thành viên trong lớp có trách nhiệm thực hiện nghiêm nội quy này; vi phạm sẽ bị nhắc nhở và xử lí theo quy định của nhà trường. (Giáo viên chủ nhiệm kí duyệt.)"}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Tác giả của văn bản Nghệ thuật truyền thống của người Việt là ai?", "options": ["A. Trịnh Xuân Thuận", "B. Nguyễn Văn Huyên", "C. Lê My", "D. Peter Wohlleben"], "answer": "B", "points": 0.25, "explain": "Nghệ thuật truyền thống của người Việt của Nguyễn Văn Huyên, trích từ công trình Văn minh Việt Nam."}, {"type": "mcq", "level": "NB", "q": "Văn bản nào sau đây thuộc phần Thực hành đọc của Bài 8?", "options": ["A. Sự sống và cái chết", "B. Tính cách của cây", "C. Phục hồi tầng ozone", "D. Nghệ thuật truyền thống của người Việt"], "answer": "B", "points": 0.25, "explain": "Phần Thực hành đọc của Bài 8 là Tính cách của cây (trích Đời sống bí ẩn của cây của Peter Wohlleben)."}, {"type": "mcq", "level": "TH", "q": "Thái độ của tác giả Nguyễn Văn Huyên đối với nghệ thuật truyền thống dân tộc là gì?", "options": ["A. Thờ ơ, coi thường", "B. Trân trọng, tự hào; kêu gọi bảo tồn và phát huy", "C. Muốn loại bỏ", "D. Chỉ phê phán"], "answer": "B", "points": 0.25, "explain": "Văn bản thể hiện thái độ trân trọng, tự hào với di sản nghệ thuật truyền thống (ca trù, quan họ, chèo, tuồng, múa rối nước...) và kêu gọi bảo tồn, phát huy."}, {"type": "mcq", "level": "TH", "q": "Tác dụng chính của phương tiện phi ngôn ngữ trong văn bản thông tin là gì?", "options": ["A. Trang trí cho đẹp", "B. Trình bày thông tin trực quan, cô đọng, giúp người đọc nắm bắt nhanh, dễ nhớ, dễ so sánh", "C. Thay thế hoàn toàn lời văn", "D. Làm văn bản dài hơn"], "answer": "B", "points": 0.25, "explain": "Phương tiện phi ngôn ngữ (hình ảnh, sơ đồ, biểu đồ) giúp thông tin trực quan, cô đọng, có hệ thống — người đọc nắm bắt nhanh, dễ nhớ, dễ so sánh hơn lời văn đơn thuần."}, {"type": "mcq", "level": "VDC", "q": "Điểm đặc sắc trong cách viết của Trịnh Xuân Thuận ở văn bản Sự sống và cái chết là gì?", "options": ["A. Chỉ đưa số liệu khô khan", "B. Kết hợp ngôn ngữ khoa học chính xác với giọng văn thơ mộng và suy ngẫm triết lí", "C. Viết hoàn toàn bằng thơ", "D. Không có số liệu nào"], "answer": "B", "points": 0.25, "explain": "Trịnh Xuân Thuận viết khoa học mà thơ mộng: số liệu chính xác kết hợp so sánh, câu hỏi tu từ và suy ngẫm triết lí về sự sống, cái chết — vừa tin cậy vừa lay động."}, {"type": "short", "level": "NB", "q": "Nghị định thư quốc tế về bảo vệ tầng ozone được kí năm nào, tên là gì?", "answer": "Năm 1987, Nghị định thư Montreal", "points": 0.5, "explain": "Nghị định thư Montreal (1987) yêu cầu các nước cấm các chất làm suy giảm tầng ozone (CFC...) — cơ sở pháp lí cho thành công phục hồi ozone."}, {"type": "short", "level": "TH", "q": "Nêu hai loại hình nghệ thuật truyền thống của người Việt được giới thiệu trong văn bản.", "answer": "Ca trù, quan họ, chèo, tuồng, múa rối nước (nêu hai trong các loại hình này)", "points": 0.5, "explain": "Văn bản giới thiệu các loại hình: ca trù, quan họ, chèo, tuồng, múa rối nước, nhạc cụ dân tộc... — di sản nghệ thuật quý báu của dân tộc."}, {"type": "short", "level": "VD", "q": "Vì sao văn bản nội quy, hướng dẫn thường được trình bày dạng liệt kê, đánh số?", "answer": "Để rõ ràng, dễ theo dõi, dễ thực hiện từng điều", "points": 0.5, "explain": "Trình bày dạng liệt kê, đánh số giúp mỗi điều khoản tách bạch, người đọc dễ theo dõi, dễ nhớ và dễ thực hiện từng nội dung."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về thông điệp bảo vệ rừng từ văn bản Tính cách của cây.", "points": 0, "explain": "DÀN Ý: Mở đoạn: giới thiệu văn bản và thông điệp. Thân đoạn: cây có đời sống bí ẩn (giao tiếp, nuôi nhau, biết đau); con người cần nhìn cây bằng con mắt khác — tôn trọng, không tàn phá; liên hệ thực trạng phá rừng hiện nay. Kết đoạn: hành động cụ thể bảo vệ rừng. BÀI MẪU: Văn bản Tính cách của cây đã thay đổi hoàn toàn cách nhìn của em về cây cối. Hóa ra cây không phải là sinh vật vô tri: chúng có tính cách riêng, biết giao tiếp với nhau qua hệ rễ và nấm, cây mẹ che chở, nuôi dưỡng cây con, và cây cũng biết đau khi bị đốn hạ. Cách viết nhân hóa mà khoa học của tác giả khiến ta thấy rừng như một cộng đồng sống động, đầy tình nghĩa — không khác gì xã hội loài người. Từ đó, thông điệp bảo vệ rừng trở nên thuyết phục hơn bao giờ hết: chặt một cây không chỉ là mất đi gỗ mà là phá vỡ cả một cộng đồng, gây đau đớn cho những sinh linh biết cảm nhận. Liên hệ thực trạng nước ta, nạn phá rừng, cháy rừng vẫn diễn ra khiến em không khỏi xót xa. Mỗi chúng ta hãy hành động: không mua bán, sử dụng gỗ lậu; tích cực trồng cây; tuyên truyền bảo vệ rừng. Hãy nhìn cây bằng con mắt khác — bằng sự tôn trọng và biết ơn — bởi rừng là lá phổi xanh, là mái nhà chung của muôn loài, trong đó có con người."}, {"type": "essay", "level": "VDC", "q": "Viết một văn bản hướng dẫn tham quan thư viện trường (dành cho học sinh mới) theo đúng đặc điểm của kiểu văn bản này.", "points": 0, "explain": "DÀN Ý: Tiêu đề: HƯỚNG DẪN SỬ DỤNG THƯ VIỆN TRƯỜNG. Mở đầu: mục đích, đối tượng. Các bước/nội dung đánh số: giờ mở cửa; thủ tục làm thẻ; cách tìm sách (mục lục, kệ sách); quy định mượn – trả; quy định giữ trật tự, bảo quản sách; dịch vụ hỗ trợ (máy tính, wifi). Kết: lời nhắn, thông tin liên hệ. BÀI MẪU: HƯỚNG DẪN SỬ DỤNG THƯ VIỆN TRƯỜNG. (Dành cho học sinh khối 10 mới nhập học; giúp các em sử dụng thư viện hiệu quả.) 1. Giờ mở cửa: sáng 7 giờ đến 11 giờ 30; chiều 13 giờ 30 đến 17 giờ, từ thứ Hai đến thứ Bảy. 2. Làm thẻ thư viện: đăng kí tại quầy thủ thư với thẻ học sinh; thẻ dùng để mượn sách và vào phòng đọc. 3. Tìm sách: tra cứu tên sách trên máy tính tại quầy hoặc hỏi thủ thư; sách được xếp theo kệ: kệ A – sách giáo khoa, kệ B – tham khảo, kệ C – văn học, kệ D – báo, tạp chí. 4. Mượn – trả sách: mỗi lần mượn tối đa 3 cuốn, thời hạn 2 tuần; trả đúng hạn tại quầy; quá hạn sẽ bị nhắc nhở. 5. Giữ trật tự: nói khẽ, không ăn uống trong phòng đọc; tắt chuông điện thoại. 6. Bảo quản sách: giữ sách sạch, không gấp góc, không viết vẽ bậy; làm mất hoặc hư hỏng phải đền theo quy định. 7. Dịch vụ hỗ trợ: phòng máy tính tra cứu miễn phí; wifi phục vụ học tập; thủ thư sẵn sàng hướng dẫn. Chúc các em có những giờ đọc sách bổ ích tại thư viện trường! Mọi thắc mắc xin liên hệ quầy thủ thư (tầng 1, nhà C)."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Tác giả của văn bản Tính cách của cây là ai?", "options": ["A. Trịnh Xuân Thuận", "B. Nguyễn Văn Huyên", "C. Peter Wohlleben", "D. Lê My"], "answer": "C", "points": 0.25, "explain": "Tính cách của cây trích từ Đời sống bí ẩn của cây của Pê-tơ Vô-lơ-lê-ben (Peter Wohlleben), nhà lâm nghiệp người Đức."}, {"type": "mcq", "level": "NB", "q": "Kiểu bài viết của Bài 8 là gì?", "options": ["A. Bài văn nghị luận về tác phẩm truyện", "B. Văn bản nội quy hoặc văn bản hướng dẫn nơi công cộng", "C. Bài luận về bản thân", "D. Bài thơ Đường luật"], "answer": "B", "points": 0.25, "explain": "Kiểu bài viết của Bài 8 là viết một văn bản nội quy hoặc một văn bản hướng dẫn nơi công cộng."}, {"type": "mcq", "level": "TH", "q": "Ngôn ngữ của văn bản nội quy, hướng dẫn nơi công cộng có đặc điểm gì?", "options": ["A. Hoa mĩ, giàu hình ảnh", "B. Ngắn gọn, rõ ràng, mang tính mệnh lệnh (nên/không nên, phải/cấm)", "C. Hài hước, dí dỏm", "D. Buồn bã, bi lụy"], "answer": "B", "points": 0.25, "explain": "Văn bản nội quy, hướng dẫn dùng ngôn ngữ ngắn gọn, rõ ràng, mang tính mệnh lệnh để người đọc dễ hiểu, dễ thực hiện."}, {"type": "mcq", "level": "TH", "q": "Chi tiết nào cho thấy cây cối có đời sống tình cảm theo văn bản Tính cách của cây?", "options": ["A. Cây giao tiếp qua rễ và nấm, cây mẹ nuôi dưỡng cây con", "B. Cây biết nói tiếng người", "C. Cây tự di chuyển được", "D. Cây không cần nước"], "answer": "A", "points": 0.25, "explain": "Văn bản cho biết cây giao tiếp với nhau qua hệ rễ và nấm, cây mẹ che chở nuôi dưỡng cây con — đời sống cộng đồng đầy tình nghĩa của rừng."}, {"type": "mcq", "level": "VDC", "q": "Vì sao nói văn bản thông tin cần hạn chế cảm xúc chủ quan?", "options": ["A. Vì cảm xúc làm văn bản hay hơn nên phải hạn chế", "B. Vì mục đích là cung cấp tri thức chính xác, tin cậy; cảm xúc chủ quan dễ làm sai lệch thông tin", "C. Vì người đọc không thích cảm xúc", "D. Vì văn bản thông tin không có tác giả"], "answer": "B", "points": 0.25, "explain": "Mục đích của văn bản thông tin là cung cấp tri thức chính xác, tin cậy; đưa cảm xúc chủ quan vào dễ làm sai lệch, giảm độ tin cậy của thông tin."}, {"type": "short", "level": "NB", "q": "Chất gây phá hủy tầng ozone chủ yếu có tên viết tắt là gì?", "answer": "CFC", "points": 0.5, "explain": "CFC (cloflocacbon) có trong tủ lạnh, bình xịt... là chất chủ yếu phá hủy tầng ozone; Nghị định thư Montreal yêu cầu cấm các chất này."}, {"type": "short", "level": "TH", "q": "Nêu hai lưu ý khi sử dụng phương tiện phi ngôn ngữ trong văn bản.", "answer": "Chọn loại phù hợp với thông tin; có chú thích, tên hình, nguồn rõ ràng; kết hợp hài hòa với lời văn", "points": 0.5, "explain": "Cần chọn phương tiện phù hợp (biểu đồ cho số liệu theo thời gian...), có chú thích, tên hình, nguồn rõ ràng và kết hợp hài hòa với lời văn, tránh hình trơ trọi."}, {"type": "short", "level": "VD", "q": "Phân biệt văn bản thuyết minh và bản tin.", "answer": "Bản tin: tin tức ngắn gọn, kịp thời; văn bản thuyết minh: giới thiệu tri thức có hệ thống, chi tiết", "points": 0.5, "explain": "Bản tin cung cấp tin tức ngắn gọn, kịp thời về sự kiện; văn bản thuyết minh giới thiệu tri thức về đối tượng một cách có hệ thống, chi tiết hơn."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ giới thiệu về một loại hình nghệ thuật truyền thống của dân tộc mà em yêu thích.", "points": 0, "explain": "DÀN Ý: Mở đoạn: giới thiệu loại hình chọn (ví dụ múa rối nước). Thân đoạn: nguồn gốc, đặc điểm (sân khấu mặt nước, con rối gỗ điều khiển bằng sào); giá trị (độc đáo, mang hồn quê Việt); cảm nhận của em. Kết đoạn: ý thức bảo tồn. BÀI MẪU: (Minh họa với múa rối nước — học sinh có thể chọn loại hình khác theo dàn ý.) Trong các loại hình nghệ thuật truyền thống, em yêu thích nhất là múa rối nước — loại hình sân khấu độc đáo chỉ có ở Việt Nam. Múa rối nước ra đời từ đồng bằng Bắc Bộ, với sân khấu là mặt nước: những con rối gỗ được nghệ nhân điều khiển bằng hệ thống sào, dây khéo léo từ sau tấm mành, kết hợp với âm nhạc dân tộc rộn rã. Điều kì diệu là những con rối vô tri bỗng trở nên có hồn: chú Tễu hóm hỉnh, cảnh cày cấy, đánh cá, lễ hội... hiện lên sinh động, vừa hài hước vừa đậm hồn quê. Múa rối nước không chỉ là trò tiêu khiển mà còn là bức tranh sinh động về đời sống, tâm hồn người Việt xưa: cần cù, lạc quan, gắn bó với sông nước. Ngày nay, múa rối nước đã vươn ra thế giới, được bạn bè quốc tế trầm trồ thán phục — niềm tự hào của văn hóa Việt. Em nghĩ mỗi chúng ta, nhất là thế hệ trẻ, cần biết trân trọng, tìm hiểu và góp phần bảo tồn những di sản quý báu ấy, để hồn Việt mãi còn với thời gian."}, {"type": "essay", "level": "VDC", "q": "Viết một văn bản hướng dẫn giữ gìn vệ sinh chung tại khu di tích tham quan (dành cho khách tham quan).", "points": 0, "explain": "DÀN Ý: Tiêu đề: HƯỚNG DẪN GIỮ GÌN VỆ SINH CHUNG TẠI KHU DI TÍCH. Mở đầu: mục đích, đối tượng. Các nội dung đánh số: bỏ rác đúng nơi quy định; không xả rác, khạc nhổ bừa bãi; không viết vẽ bậy lên di tích; giữ trật tự, không gây ồn ào; bảo vệ cây xanh, cảnh quan; sử dụng nhà vệ sinh công cộng đúng cách; nhắc nhở người vi phạm; liên hệ ban quản lí. Kết: lời kêu gọi. BÀI MẪU: HƯỚNG DẪN GIỮ GÌN VỆ SINH CHUNG TẠI KHU DI TÍCH. (Dành cho du khách đến tham quan; nhằm giữ gìn cảnh quan sạch đẹp, bảo vệ di sản.) 1. Bỏ rác đúng nơi quy định: sử dụng thùng rác đặt dọc lối đi; phân loại rác theo hướng dẫn trên thùng. 2. Không xả rác, khạc nhổ bừa bãi trên đường đi, trong khuôn viên di tích. 3. Không viết, vẽ bậy lên tường, bia đá, hiện vật; không khắc tên lên cây cối. 4. Giữ trật tự chung: nói khẽ, không gây ồn ào ảnh hưởng không gian tôn nghiêm và du khách khác. 5. Bảo vệ cây xanh, thảm cỏ: không giẫm đạp, bẻ cành, hái hoa. 6. Sử dụng nhà vệ sinh công cộng đúng cách, giữ gìn sạch sẽ sau khi dùng. 7. Không mang đồ ăn có mùi nặng vào khu vực trưng bày, thờ tự. 8. Khi phát hiện hành vi vi phạm, vui lòng nhắc nhở nhẹ nhàng hoặc báo cho ban quản lí (số điện thoại niêm yết tại cổng). Mỗi du khách là một đại sứ văn hóa: hãy giữ gìn vệ sinh chung để di tích mãi sạch đẹp, xứng đáng với giá trị lịch sử của dân tộc. Ban quản lí khu di tích trân trọng cảm ơn!"}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Chủ đề của Bài 8 là gì?", "options": ["A. Thế giới đa dạng của thông tin", "B. Quyền năng của người kể chuyện", "C. Hành trang cuộc sống", "D. Vẻ đẹp của thơ ca"], "answer": "A", "points": 0.25, "explain": "Bài 8 có chủ đề Thế giới đa dạng của thông tin: đọc hiểu các văn bản thông tin về khoa học, văn hóa, môi trường."}, {"type": "mcq", "level": "NB", "q": "Văn bản nội quy thường có bố cục gồm mấy phần chính?", "options": ["A. 2 phần", "B. 4 phần: tiêu đề, mở đầu, các điều khoản, kết", "C. 1 phần duy nhất", "D. 6 phần"], "answer": "B", "points": 0.25, "explain": "Văn bản nội quy gồm: tiêu đề; phần mở đầu (mục đích, phạm vi); phần chính (các điều khoản đánh số); phần kết (yêu cầu thực hiện, chữ kí)."}, {"type": "mcq", "level": "TH", "q": "Khi đọc văn bản thông tin, việc đầu tiên nên làm là gì?", "options": ["A. Học thuộc lòng toàn bộ", "B. Xác định đề tài, thông tin cơ bản qua nhan đề, sa-pô, đề mục", "C. Tìm biện pháp tu từ", "D. Phân tích tâm lí nhân vật"], "answer": "B", "points": 0.25, "explain": "Đọc văn bản thông tin cần xác định đề tài, thông tin cơ bản trước qua nhan đề, sa-pô, đề mục — rồi mới đi vào chi tiết và đánh giá độ tin cậy."}, {"type": "mcq", "level": "TH", "q": "Số liệu, hình ảnh trong văn bản Phục hồi tầng ozone có vai trò gì?", "options": ["A. Trang trí", "B. Tăng tính thuyết phục, giúp người đọc thấy rõ xu hướng phục hồi của tầng ozone", "C. Làm văn bản dài hơn", "D. Thay thế lời văn"], "answer": "B", "points": 0.25, "explain": "Số liệu và hình ảnh mô phỏng theo trục thời gian giúp người đọc thấy trực quan xu hướng thu hẹp của lỗ thủng ozone — tăng sức thuyết phục của thông tin."}, {"type": "mcq", "level": "VDC", "q": "Bài học rút ra từ thành công phục hồi tầng ozone đối với các vấn đề môi trường hiện nay là gì?", "options": ["A. Môi trường sẽ tự phục hồi, con người không cần làm gì", "B. Khi nhân loại đồng lòng hành động kịp thời dựa trên khoa học, có thể khắc phục hậu quả môi trường", "C. Chỉ cần một nước hành động là đủ", "D. Vấn đề môi trường không thể giải quyết"], "answer": "B", "points": 0.25, "explain": "Thành công ozone chứng minh: với bằng chứng khoa học rõ ràng và sự đồng lòng hành động kịp thời của toàn cầu, con người có thể đảo ngược thiệt hại môi trường."}, {"type": "short", "level": "NB", "q": "Tác giả Lê My viết về vấn đề môi trường nào?", "answer": "Phục hồi tầng ozone", "points": 0.5, "explain": "Lê My là tác giả văn bản Phục hồi tầng ozone: Thành công hiếm hoi của nỗ lực toàn cầu — về lỗ thủng ozone và nỗ lực khắc phục của nhân loại."}, {"type": "short", "level": "TH", "q": "Nêu hai đặc điểm của ngôn ngữ trong văn bản Sự sống và cái chết.", "answer": "Khoa học, chính xác mà thơ mộng, giàu suy ngẫm", "points": 0.5, "explain": "Văn bản dùng ngôn ngữ khoa học chính xác (số liệu, khái niệm) nhưng giọng văn thơ mộng, có so sánh, câu hỏi tu từ gợi suy ngẫm triết lí."}, {"type": "short", "level": "VD", "q": "Vì sao khi viết văn bản hướng dẫn cần đánh số thứ tự các bước?", "answer": "Để người đọc thực hiện theo đúng trình tự, không bỏ sót, không nhầm lẫn", "points": 0.5, "explain": "Đánh số thứ tự giúp người đọc làm theo đúng trình tự các bước, không bỏ sót hay nhầm lẫn — đặc biệt quan trọng với hướng dẫn thao tác."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu cảm nhận của em về vẻ đẹp của bầu trời và các vì sao qua văn bản Sự sống và cái chết.", "points": 0, "explain": "DÀN Ý: Mở đoạn: giới thiệu văn bản. Thân đoạn: vũ trụ kì vĩ qua vòng đời các vì sao; cách viết khoa học mà thơ mộng của tác giả; suy ngẫm: con người là con của các vì sao — gắn bó với vũ trụ; cảm xúc: ngỡ ngàng, trân trọng. Kết đoạn: bài học về vị trí con người. BÀI MẪU: Văn bản Sự sống và cái chết đã mở ra trước mắt em một vũ trụ vừa kì vĩ vừa thơ mộng. Qua ngòi bút của Trịnh Xuân Thuận, các vì sao không còn là những chấm sáng xa xôi mà có cả một vòng đời: sinh ra từ đám mây khí, rực sáng nhờ phản ứng nhiệt hạch rồi lụi tàn theo nhiều cách khác nhau — như đời người có sinh, lão, bệnh, tử. Cách viết khoa học mà thơ mộng, với những phép so sánh đẹp và câu hỏi tu từ gợi suy ngẫm, khiến tri thức thiên văn trở nên gần gũi, lay động. Điều khiến em xúc động nhất là suy ngẫm của tác giả: con người được tạo nên từ vật chất của các vì sao — chúng ta là con của vũ trụ. Nhận ra mình là một phần của vũ trụ bao la, em vừa thấy mình bé nhỏ vừa thấy mình thiêng liêng: bé nhỏ trước sự vô tận, thiêng liêng vì mang trong mình vật chất của các vì sao. Văn bản dạy em biết ngước nhìn bầu trời với lòng biết ơn và trân trọng: hãy sống xứng đáng với món quà kì diệu mà vũ trụ đã ban tặng."}, {"type": "essay", "level": "VDC", "q": "Viết một văn bản nội quy phòng thí nghiệm (hoặc phòng tin học) của trường em.", "points": 0, "explain": "DÀN Ý: Tiêu đề: NỘI QUY PHÒNG THÍ NGHIỆM. Mở đầu: mục đích, phạm vi. Các điều đánh số: chỉ vào khi có giáo viên; trang phục bảo hộ; không tự ý thao tác hóa chất, thiết bị; giữ trật tự; vệ sinh; xử lí sự cố (báo giáo viên); bồi thường hư hỏng; ra về đúng quy định. Kết: yêu cầu thực hiện. BÀI MẪU: NỘI QUY PHÒNG THÍ NGHIỆM. (Áp dụng cho học sinh khi học tập tại phòng thí nghiệm; nhằm đảm bảo an toàn và hiệu quả.) Điều 1. Chỉ vào phòng thí nghiệm khi có giáo viên hướng dẫn; không tự ý vào khi chưa được phép. Điều 2. Mặc áo bảo hộ, đeo kính bảo hộ khi làm thí nghiệm theo yêu cầu của giáo viên. Điều 3. Không tự ý thao tác hóa chất, thiết bị; mọi thí nghiệm phải theo đúng hướng dẫn và trình tự giáo viên đã phổ biến. Điều 4. Không nếm, ngửi trực tiếp hóa chất; không đùa nghịch, chạy nhảy trong phòng. Điều 5. Giữ trật tự, tập trung quan sát; ghi chép kết quả cẩn thận, trung thực. Điều 6. Giữ gìn vệ sinh: rửa tay sau khi thí nghiệm; bỏ rác đúng nơi quy định; sắp xếp dụng cụ gọn gàng sau khi dùng. Điều 7. Khi xảy ra sự cố (đổ hóa chất, vỡ dụng cụ, bỏng...), phải bình tĩnh báo ngay cho giáo viên, không tự ý xử lí. Điều 8. Làm hư hỏng thiết bị phải báo cáo và bồi thường theo quy định. Điều 9. Ra về phải tắt thiết bị, khóa vòi nước, để phòng gọn gàng. Mọi học sinh nghiêm túc thực hiện nội quy để mỗi giờ thí nghiệm đều an toàn và bổ ích. (Ban giám hiệu / Tổ bộ môn kí duyệt.)"}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Dòng nào liệt kê đúng các văn bản đọc chính của Bài 8?", "options": ["A. Sự sống và cái chết – Nghệ thuật truyền thống của người Việt – Phục hồi tầng ozone", "B. Bình Ngô đại cáo – Bảo kính cảnh giới – Dục Thúy sơn", "C. Về chính chúng ta – Con đường không chọn – Một đời như kẻ tìm đường", "D. Người cầm quyền khôi phục uy quyền – Dưới bóng hoàng lan – Một chuyện đùa nho nhỏ"], "answer": "A", "points": 0.25, "explain": "Ba văn bản đọc chính của Bài 8 là: Sự sống và cái chết, Nghệ thuật truyền thống của người Việt, Phục hồi tầng ozone; Thực hành đọc: Tính cách của cây."}, {"type": "mcq", "level": "NB", "q": "Sa-pô trong văn bản thông tin (báo chí) là gì?", "options": ["A. Phần tóm tắt ngắn sau nhan đề, nêu thông tin khái quát", "B. Phần kết luận", "C. Tên tác giả", "D. Hình minh họa"], "answer": "A", "points": 0.25, "explain": "Sa-pô là đoạn tóm tắt ngắn đặt sau nhan đề, nêu thông tin khái quát nhất của văn bản — giúp người đọc nắm nhanh nội dung."}, {"type": "mcq", "level": "TH", "q": "Vì sao văn bản thuyết minh cần có bố cục rõ ràng, theo từng mục?", "options": ["A. Để văn bản dài hơn", "B. Để người đọc dễ theo dõi, nắm bắt tri thức có hệ thống", "C. Để khoe kiến thức", "D. Không cần thiết"], "answer": "B", "points": 0.25, "explain": "Bố cục rõ ràng theo từng mục giúp tri thức được trình bày có hệ thống, người đọc dễ theo dõi, dễ ghi nhớ và tra cứu."}, {"type": "mcq", "level": "TH", "q": "Thái độ của tác giả văn bản Tính cách của cây đối với cây cối là gì?", "options": ["A. Coi cây là vật vô tri", "B. Tôn trọng, yêu mến; kêu gọi nhìn cây bằng con mắt khác và bảo vệ rừng", "C. Muốn chặt hết cây", "D. Thờ ơ"], "answer": "B", "points": 0.25, "explain": "Tác giả nhìn cây như những sinh linh có đời sống riêng, với sự tôn trọng, yêu mến; qua đó kêu gọi con người bảo vệ rừng."}, {"type": "mcq", "level": "VDC", "q": "Điểm chung về phương pháp của Trịnh Xuân Thuận và Peter Wohlleben khi viết văn bản thông tin là gì?", "options": ["A. Chỉ dùng số liệu khô khan", "B. Kết hợp tri thức khoa học chính xác với cách diễn đạt gần gũi, gợi cảm xúc để thuyết phục người đọc", "C. Viết hoàn toàn bằng thơ", "D. Không cần dẫn chứng"], "answer": "B", "points": 0.25, "explain": "Cả hai đều viết khoa học mà gần gũi: số liệu, ví dụ cụ thể kết hợp so sánh, nhân hóa, suy ngẫm — vừa tin cậy vừa lay động, thuyết phục."}, {"type": "short", "level": "NB", "q": "Văn bản Nghệ thuật truyền thống của người Việt được trích từ công trình nào?", "answer": "Văn minh Việt Nam", "points": 0.5, "explain": "Văn bản trích từ công trình Văn minh Việt Nam của Nguyễn Văn Huyên, nhà nghiên cứu văn hóa Việt Nam."}, {"type": "short", "level": "TH", "q": "Nêu hai yêu cầu đối với lời văn trong văn bản nội quy.", "answer": "Ngắn gọn, rõ ràng; mang tính mệnh lệnh, dễ hiểu, dễ thực hiện", "points": 0.5, "explain": "Lời văn nội quy phải ngắn gọn, rõ ràng, dùng từ chính xác, mang tính mệnh lệnh (nên/không nên, phải/cấm) để dễ hiểu, dễ thực hiện."}, {"type": "short", "level": "VD", "q": "Cho biết khi nào nên dùng biểu đồ đường và khi nào nên dùng sơ đồ trong văn bản thông tin.", "answer": "Biểu đồ đường: số liệu biến đổi theo thời gian; sơ đồ: quy trình, cấu trúc, mối quan hệ", "points": 0.5, "explain": "Biểu đồ đường phù hợp thể hiện xu hướng biến đổi theo thời gian (như lỗ thủng ozone qua các năm); sơ đồ phù hợp thể hiện quy trình, cấu trúc, mối quan hệ giữa các yếu tố."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về ý nghĩa của việc bảo tồn nghệ thuật truyền thống dân tộc.", "points": 0, "explain": "DÀN Ý: Mở đoạn: nghệ thuật truyền thống là di sản quý. Thân đoạn: giá trị (thể hiện tâm hồn, bản sắc dân tộc; ca trù, quan họ, chèo, tuồng, múa rối nước...); nguy cơ mai một trước văn hóa ngoại lai; trách nhiệm bảo tồn (tìm hiểu, thưởng thức, quảng bá). Kết đoạn: giữ gìn bản sắc. BÀI MẪU: Nghệ thuật truyền thống là di sản văn hóa quý báu của dân tộc, thể hiện tâm hồn, trí tuệ và bản sắc Việt Nam qua bao thế hệ. Từ làn điệu quan họ mượt mà, tiếng ca trù sâu lắng, sân khấu chèo, tuồng rực rỡ đến múa rối nước độc đáo — mỗi loại hình đều là kết tinh của lao động sáng tạo và đời sống tinh thần cha ông. Thế nhưng, trước sự xâm nhập mạnh mẽ của văn hóa ngoại lai và thị hiếu giải trí nhanh, nhiều loại hình nghệ thuật truyền thống đang đứng trước nguy cơ mai một: nghệ nhân già đi mà lớp trẻ kế cận thưa thớt, khán giả ngày càng ít. Nếu mất đi những di sản ấy, dân tộc ta sẽ mất đi một phần hồn cốt, bản sắc. Vì vậy, bảo tồn nghệ thuật truyền thống là trách nhiệm của mỗi người, nhất là thế hệ trẻ: hãy tìm hiểu, thưởng thức, tham gia các câu lạc bộ nghệ thuật dân gian; quảng bá trên mạng xã hội để bạn bè quốc tế biết đến. Bảo tồn không có nghĩa là giữ nguyên xi mà là làm cho di sản sống động trong đời sống hôm nay. Giữ được hồn Việt trong nghệ thuật, ta mới giữ được mình giữa dòng chảy hội nhập."}, {"type": "essay", "level": "VDC", "q": "Viết một văn bản hướng dẫn an toàn khi tham gia giao thông bằng xe đạp điện (dành cho học sinh).", "points": 0, "explain": "DÀN Ý: Tiêu đề: HƯỚNG DẪN AN TOÀN KHI ĐI XE ĐẠP ĐIỆN. Mở đầu: đối tượng, mục đích. Các nội dung đánh số: đội mũ bảo hiểm; kiểm tra xe trước khi đi; đi đúng làn đường, tốc độ; chấp hành đèn tín hiệu, biển báo; không chở quá số người; không dùng điện thoại; không lạng lách; xử lí tình huống (mưa, đường đông); bảo dưỡng xe. Kết: lời nhắn. BÀI MẪU: HƯỚNG DẪN AN TOÀN KHI ĐI XE ĐẠP ĐIỆN. (Dành cho học sinh; giúp các em tham gia giao thông an toàn.) 1. Luôn đội mũ bảo hiểm đạt chuẩn, cài quai chắc chắn trước khi lên xe. 2. Kiểm tra xe trước khi đi: phanh, đèn, còi, lốp và lượng điện ắc quy. 3. Đi đúng làn đường dành cho xe thô sơ; giữ tốc độ vừa phải, không phóng nhanh. 4. Chấp hành nghiêm đèn tín hiệu, biển báo và hiệu lệnh của cảnh sát giao thông. 5. Không chở quá số người quy định; không chở vật cồng kềnh che khuất tầm nhìn. 6. Không sử dụng điện thoại, không nghe nhạc bằng tai nghe khi điều khiển xe. 7. Không lạng lách, đánh võng, đi dàn hàng ngang. 8. Khi trời mưa, đường trơn: giảm tốc độ, tăng khoảng cách với xe trước, bật đèn. 9. Khi qua đường giao nhau: quan sát kĩ hai bên, nhường đường cho người đi bộ. 10. Bảo dưỡng xe định kì; sạc điện ở nơi khô ráo, không sạc qua đêm không người trông. An toàn của em là hạnh phúc của gia đình: hãy luôn cẩn thận mỗi khi tham gia giao thông!"}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Phần Nói và nghe của Bài 8 yêu cầu thảo luận về vấn đề gì?", "options": ["A. Vấn đề xã hội", "B. Văn bản nội quy hoặc văn bản hướng dẫn nơi công cộng", "C. Vấn đề văn học", "D. Kế hoạch du lịch"], "answer": "B", "points": 0.25, "explain": "Phần Nói và nghe của Bài 8 là thảo luận về văn bản nội quy hoặc văn bản hướng dẫn nơi công cộng."}, {"type": "mcq", "level": "NB", "q": "Đâu KHÔNG phải là phương tiện phi ngôn ngữ?", "options": ["A. Sơ đồ", "B. Biểu đồ", "C. Câu văn miêu tả", "D. Bảng số liệu"], "answer": "C", "points": 0.25, "explain": "Câu văn miêu tả là phương tiện ngôn ngữ (lời văn). Sơ đồ, biểu đồ, bảng số liệu là phương tiện phi ngôn ngữ."}, {"type": "mcq", "level": "TH", "q": "Vì sao văn bản nội quy cần mỗi điều khoản chỉ nêu một nội dung?", "options": ["A. Để văn bản ngắn", "B. Để tránh nhầm lẫn, người đọc dễ nhớ và thực hiện chính xác từng yêu cầu", "C. Để tiết kiệm giấy", "D. Không cần thiết"], "answer": "B", "points": 0.25, "explain": "Mỗi điều khoản một nội dung giúp yêu cầu tách bạch, rõ ràng; người đọc không bị nhầm lẫn và thực hiện chính xác."}, {"type": "mcq", "level": "TH", "q": "Trong văn bản Sự sống và cái chết, phép so sánh vòng đời sao với đời người có tác dụng gì?", "options": ["A. Làm văn bản khó hiểu", "B. Giúp tri thức thiên văn trừu tượng trở nên gần gũi, dễ hình dung", "C. Chứng minh sao cũng biết nói", "D. Không có tác dụng"], "answer": "B", "points": 0.25, "explain": "So sánh vòng đời sao (sinh – tỏa sáng – lụi tàn) với đời người giúp tri thức vũ trụ trừu tượng trở nên gần gũi, dễ hình dung, dễ cảm nhận."}, {"type": "mcq", "level": "VDC", "q": "Một văn bản nội quy tốt cần tránh điều gì?", "options": ["A. Ngôn ngữ rõ ràng", "B. Quy định chung chung, mơ hồ, khó thực hiện và thiếu tính khả thi", "C. Đánh số điều khoản", "D. Có chữ kí"], "answer": "B", "points": 0.25, "explain": "Nội quy phải cụ thể, khả thi; quy định chung chung, mơ hồ khiến người đọc không biết phải làm gì, văn bản mất tác dụng."}, {"type": "short", "level": "NB", "q": "Trịnh Xuân Thuận là nhà khoa học trong lĩnh vực nào?", "answer": "Vật lí thiên văn", "points": 0.5, "explain": "Trịnh Xuân Thuận là nhà vật lí thiên văn người Việt nổi tiếng thế giới, tác giả nhiều công trình khoa học thường thức."}, {"type": "short", "level": "TH", "q": "Nêu hai thông tin cơ bản cần xác định khi đọc hiểu văn bản Phục hồi tầng ozone.", "answer": "Thực trạng lỗ thủng ozone (nguyên nhân) và nỗ lực, kết quả phục hồi", "points": 0.5, "explain": "Thông tin cơ bản: thực trạng (lỗ thủng ozone, nguyên nhân CFC) và nỗ lực toàn cầu (Nghị định thư Montreal) cùng kết quả phục hồi."}, {"type": "short", "level": "VD", "q": "Vì sao không nên để hình ảnh minh họa trơ trọi, không có lời giải thích trong văn bản thông tin?", "answer": "Vì người đọc khó hiểu đúng ý nghĩa, dễ hiểu sai hoặc bỏ qua thông tin", "points": 0.5, "explain": "Hình ảnh cần có tên hình, chú thích và lời văn giải thích đi kèm; nếu không, người đọc khó nắm đúng ý nghĩa, dễ hiểu sai hoặc bỏ qua."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày cách đọc hiểu một văn bản thông tin (lấy ví dụ một văn bản trong Bài 8).", "points": 0, "explain": "DÀN Ý: Mở đoạn: tầm quan trọng của kĩ năng đọc văn bản thông tin. Thân đoạn: các bước (đọc nhan đề, sa-pô để xác định đề tài; đọc lướt nắm bố cục; đọc kĩ từng phần, gạch chân thông tin cơ bản, số liệu; xem hình ảnh, sơ đồ; đánh giá độ tin cậy; tóm tắt). Ví dụ với Phục hồi tầng ozone. Kết đoạn: lợi ích. BÀI M�U: Đọc hiểu văn bản thông tin là kĩ năng cần thiết trong thời đại bùng nổ thông tin. Lấy văn bản Phục hồi tầng ozone làm ví dụ, em thường đọc theo các bước sau. Trước hết, đọc nhan đề và sa-pô để xác định đề tài: vấn đề tầng ozone và nỗ lực phục hồi. Sau đó đọc lướt toàn bài để nắm bố cục: thực trạng – nguyên nhân – nỗ lực – kết quả. Tiếp theo, đọc kĩ từng phần, gạch chân các thông tin cơ bản và số liệu quan trọng (lỗ thủng ở Nam Cực, chất CFC, Nghị định thư Montreal 1987, mốc thời gian 1979–2019). Đặc biệt, không bỏ qua hình ảnh mô phỏng: quan sát kĩ trục thời gian và chú thích để thấy xu hướng thu hẹp của lỗ thủng. Cuối cùng, đánh giá độ tin cậy (số liệu, nguồn rõ ràng) và tóm tắt nội dung chính bằng sơ đồ hoặc vài câu ngắn gọn. Cách đọc này giúp em không bị ngợp trước lượng thông tin lớn, nắm được cái cốt lõi và nhớ lâu hơn. Rèn luyện thường xuyên, kĩ năng đọc hiểu văn bản thông tin sẽ giúp ta làm chủ tri thức và không bị lạc trong biển thông tin."}, {"type": "essay", "level": "VDC", "q": "Viết một văn bản nội quy thư viện trường (khoảng 8–10 điều).", "points": 0, "explain": "DÀN Ý: Tiêu đề: NỘI QUY THƯ VIỆN. Mở đầu: mục đích, đối tượng. Các điều đánh số: giờ mở cửa; thủ tục vào, mượn sách; số lượng, thời hạn mượn; giữ trật tự; bảo quản sách; không ăn uống; sử dụng thiết bị; bồi thường; xử lí vi phạm. Kết: yêu cầu thực hiện. BÀI MẪU: NỘI QUY THƯ VIỆN TRƯỜNG. (Áp dụng cho cán bộ, giáo viên, học sinh; nhằm xây dựng môi trường đọc sách văn minh.) Điều 1. Thư viện mở cửa từ 7 giờ đến 17 giờ các ngày thứ Hai đến thứ Bảy; nghỉ Chủ nhật và ngày lễ. Điều 2. Xuất trình thẻ thư viện khi vào phòng đọc và khi mượn sách. Điều 3. Mỗi bạn đọc được mượn tối đa 3 cuốn một lần, thời hạn 2 tuần; có thể gia hạn một lần nếu sách chưa có người đặt trước. Điều 4. Trả sách đúng hạn tại quầy thủ thư; quá hạn 1 tuần sẽ bị nhắc nhở, quá 1 tháng bị tạm dừng quyền mượn. Điều 5. Giữ trật tự trong phòng đọc: nói khẽ, đi nhẹ, tắt chuông điện thoại. Điều 6. Không mang đồ ăn, thức uống có mùi vào phòng đọc; giữ gìn vệ sinh chung. Điều 7. Bảo quản sách: không gấp góc, không viết vẽ bậy, không làm rách; giữ sách khô ráo, sạch sẽ. Điều 8. Sử dụng máy tính tra cứu đúng mục đích học tập; không truy cập nội dung không lành mạnh. Điều 9. Làm mất hoặc hư hỏng sách phải đền theo giá bìa hoặc mua sách mới thay thế. Điều 10. Mọi hành vi vi phạm sẽ bị nhắc nhở; tái phạm nhiều lần sẽ bị đình chỉ quyền sử dụng thư viện. Kính mong quý thầy cô và các em học sinh nghiêm túc thực hiện để thư viện mãi là không gian tri thức thân thiện. (Ban giám hiệu kí duyệt.)"}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Văn bản thông tin khác văn bản văn học ở điểm nào?", "options": ["A. Văn bản thông tin cung cấp tri thức chính xác, khách quan; văn bản văn học hư cấu, giàu cảm xúc", "B. Không có điểm khác nhau", "C. Văn bản thông tin luôn viết bằng thơ", "D. Văn bản văn học luôn có số liệu"], "answer": "A", "points": 0.25, "explain": "Văn bản thông tin hướng tới tri thức chính xác, khách quan; văn bản văn học xây dựng hình tượng bằng hư cấu, giàu cảm xúc, chủ quan."}, {"type": "mcq", "level": "NB", "q": "Lỗ thủng tầng ozone lớn nhất được ghi nhận ở khu vực nào?", "options": ["A. Bắc Cực", "B. Nam Cực", "C. Xích đạo", "D. Việt Nam"], "answer": "B", "points": 0.25, "explain": "Lỗ thủng tầng ozone được phát hiện và theo dõi chủ yếu ở Nam Cực, nơi tập trung các hình ảnh mô phỏng trong văn bản."}, {"type": "mcq", "level": "TH", "q": "Câu hỏi tu từ trong văn bản khoa học thường thức có tác dụng gì?", "options": ["A. Yêu cầu người đọc trả lời ngay", "B. Gợi suy ngẫm, tăng sức hấp dẫn, dẫn dắt người đọc cùng tư duy", "C. Làm văn bản khó hiểu", "D. Thay thế kết luận"], "answer": "B", "points": 0.25, "explain": "Câu hỏi tu từ không cần trả lời trực tiếp mà gợi suy ngẫm, tạo sự tương tác, dẫn dắt người đọc cùng tư duy với tác giả."}, {"type": "mcq", "level": "TH", "q": "Khi thiết kế sơ đồ từ một đoạn văn, bước đầu tiên nên làm gì?", "options": ["A. Vẽ ngay hình tròn to nhất", "B. Xác định thông tin chính và mối quan hệ giữa các thông tin", "C. Tô màu thật đẹp", "D. Chép nguyên đoạn văn vào sơ đồ"], "answer": "B", "points": 0.25, "explain": "Thiết kế sơ đồ phải bắt đầu từ việc xác định thông tin chính và mối quan hệ giữa chúng; hình thức (màu sắc, hình khối) chỉ là bước thể hiện sau."}, {"type": "mcq", "level": "VDC", "q": "Vì sao văn bản Tính cách của cây có sức thuyết phục dù dùng cách nhân hóa cây cối?", "options": ["A. Vì nhân hóa tùy tiện", "B. Vì mọi nhận định đều dựa trên quan sát, nghiên cứu khoa học cụ thể, sinh động", "C. Vì cây thực sự biết nói", "D. Vì văn bản rất ngắn"], "answer": "B", "points": 0.25, "explain": "Nhân hóa trong văn bản dựa trên quan sát khoa học (rễ, nấm, cách cây nuôi nhau) nên vừa sinh động vừa đáng tin — không phải tưởng tượng tùy tiện."}, {"type": "short", "level": "NB", "q": "Kể tên hai văn bản trong Bài 8 viết về vấn đề môi trường, thiên nhiên.", "answer": "Phục hồi tầng ozone và Tính cách của cây (hoặc Sự sống và cái chết)", "points": 0.5, "explain": "Phục hồi tầng ozone (môi trường) và Tính cách của cây (thiên nhiên, rừng) là hai văn bản về môi trường – thiên nhiên trong Bài 8."}, {"type": "short", "level": "TH", "q": "Nêu hai tác dụng của việc kết hợp hình ảnh với lời văn trong văn bản thông tin.", "answer": "Thông tin trực quan, dễ hiểu; tăng sức thuyết phục, dễ nhớ", "points": 0.5, "explain": "Hình ảnh kết hợp lời văn giúp thông tin trực quan, dễ hiểu hơn; đồng thời tăng sức thuyết phục và khả năng ghi nhớ của người đọc."}, {"type": "short", "level": "VD", "q": "Nêu điểm khác nhau giữa văn bản nội quy và văn bản hướng dẫn.", "answer": "Nội quy: quy định những điều được/không được làm (tính bắt buộc); hướng dẫn: chỉ dẫn cách làm theo trình tự (tính chỉ dẫn)", "points": 0.5, "explain": "Nội quy quy định điều được/không được làm, mang tính bắt buộc; văn bản hướng dẫn chỉ dẫn cách thức thực hiện theo trình tự các bước."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về vai trò của số liệu trong văn bản thông tin.", "points": 0, "explain": "DÀN Ý: Mở đoạn: số liệu là linh hồn của văn bản thông tin. Thân đoạn: số liệu tạo độ chính xác, tin cậy (ví dụ mốc thời gian ozone 1979–2019); giúp so sánh, thấy xu hướng; lưu ý: số liệu phải có nguồn, được trình bày rõ ràng (bảng, biểu đồ). Kết đoạn: biết đọc và đánh giá số liệu. BÀI MẪU: Trong văn bản thông tin, số liệu đóng vai trò vô cùng quan trọng — có thể coi là linh hồn tạo nên độ tin cậy. Một nhận định chung chung như tầng ozone đang phục hồi sẽ thiếu sức thuyết phục nếu không có số liệu: các mốc thời gian từ 1979 đến 2019, diện tích lỗ thủng qua từng năm được trình bày cụ thể khiến người đọc thấy rõ xu hướng thu hẹp. Số liệu còn giúp so sánh: trước và sau Nghị định thư Montreal khác nhau thế nào; giúp người đọc tự kiểm chứng thay vì tin một chiều. Tuy nhiên, số liệu chỉ có giá trị khi trung thực, có nguồn gốc rõ ràng và được trình bày khoa học (bảng biểu, biểu đồ, chú thích đầy đủ); số liệu bịa đặt hoặc trình bày mập mờ sẽ phản tác dụng, làm mất niềm tin. Với người đọc, kĩ năng quan trọng là biết đọc số liệu: xem số liệu nói gì, có hợp lí không, nguồn từ đâu. Trong thời đại tin giả tràn lan, biết đọc và đánh giá số liệu chính là cách tự bảo vệ mình khỏi những thông tin sai lệch."}, {"type": "essay", "level": "VDC", "q": "Viết một văn bản hướng dẫn cách đọc hiểu một văn bản thông tin (dành cho bạn học cùng lớp).", "points": 0, "explain": "DÀN Ý: Tiêu đề: HƯỚNG DẪN CÁCH ĐỌC HIỂU VĂN BẢN THÔNG TIN. Mở đầu: mục đích, đối tượng. Các bước đánh số: đọc nhan đề, sa-pô; đọc lướt nắm bố cục; đọc kĩ, gạch chân thông tin cơ bản, số liệu; quan sát hình ảnh, sơ đồ; đánh giá độ tin cậy; tóm tắt bằng sơ đồ/câu ngắn; ghi thắc mắc để trao đổi. Kết: lời nhắn. BÀI MẪU: HƯỚNG DẪN CÁCH ĐỌC HIỂU VĂN BẢN THÔNG TIN. (Dành cho học sinh lớp 10; giúp các em đọc hiệu quả, không bị ngợp.) Bước 1. Đọc nhan đề và sa-pô: xác định đề tài và thông tin khái quát nhất của văn bản. Bước 2. Đọc lướt toàn bài: nắm bố cục (mở đầu – các phần – kết thúc), đánh dấu các đề mục chính. Bước 3. Đọc kĩ từng phần: gạch chân thông tin cơ bản (khái niệm, sự kiện, quá trình); khoanh tròn số liệu quan trọng. Bước 4. Quan sát kĩ hình ảnh, sơ đồ, biểu đồ: đọc tên hình, chú thích; xem hình minh họa cho thông tin nào trong lời văn. Bước 5. Đánh giá độ tin cậy: số liệu có nguồn không, thông tin có cập nhật, logic không; cảnh giác với thông tin mập mờ. Bước 6. Tóm tắt: dùng sơ đồ tư duy hoặc 3–5 câu ngắn gọn nêu nội dung chính. Bước 7. Ghi lại thắc mắc: những chỗ chưa hiểu để hỏi thầy cô, trao đổi với bạn. Lưu ý: không cần học thuộc lòng từng chữ; quan trọng là nắm được thông tin cốt lõi và biết đánh giá. Chúc các em đọc hiểu hiệu quả và làm chủ kho tri thức quanh mình!"}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Tác phẩm Đời sống bí ẩn của cây là của tác giả nào?", "options": ["A. Trịnh Xuân Thuận", "B. Peter Wohlleben", "C. Nguyễn Văn Huyên", "D. Lê My"], "answer": "B", "points": 0.25, "explain": "Đời sống bí ẩn của cây là tác phẩm của Pê-tơ Vô-lơ-lê-ben (Peter Wohlleben); văn bản Tính cách của cây được trích từ đó."}, {"type": "mcq", "level": "NB", "q": "Trong văn bản nội quy, phần mở đầu thường nêu nội dung gì?", "options": ["A. Các điều khoản chi tiết", "B. Mục đích ban hành và phạm vi áp dụng", "C. Chữ kí", "D. Hình phạt cụ thể"], "answer": "B", "points": 0.25, "explain": "Phần mở đầu của nội quy nêu mục đích ban hành và phạm vi, đối tượng áp dụng — giúp người đọc hiểu văn bản dành cho ai, để làm gì."}, {"type": "mcq", "level": "TH", "q": "Vì sao cần bảo tồn nghệ thuật truyền thống theo văn bản của Nguyễn Văn Huyên?", "options": ["A. Vì nó mang lại nhiều tiền", "B. Vì đó là di sản quý báu, thể hiện tâm hồn, bản sắc dân tộc", "C. Vì không có gì khác để xem", "D. Vì nhà nước bắt buộc"], "answer": "B", "points": 0.25, "explain": "Nghệ thuật truyền thống là di sản quý báu, kết tinh tâm hồn, bản sắc dân tộc qua bao thế hệ — mất đi là mất một phần hồn cốt dân tộc."}, {"type": "mcq", "level": "TH", "q": "Biểu đồ tròn thích hợp để thể hiện loại thông tin nào?", "options": ["A. Xu hướng thay đổi theo thời gian", "B. Cơ cấu, tỉ lệ các thành phần trong một tổng thể", "C. Quy trình các bước", "D. Vị trí địa lí"], "answer": "B", "points": 0.25, "explain": "Biểu đồ tròn thể hiện cơ cấu, tỉ lệ các thành phần trong một tổng thể; xu hướng theo thời gian dùng biểu đồ đường; quy trình dùng sơ đồ."}, {"type": "mcq", "level": "VDC", "q": "Nhận định nào đúng về mối quan hệ giữa văn bản thông tin và đời sống?", "options": ["A. Văn bản thông tin xa rời đời sống", "B. Văn bản thông tin gắn chặt với đời sống: cung cấp tri thức để con người hiểu và hành động đúng đắn", "C. Văn bản thông tin chỉ dành cho nhà khoa học", "D. Văn bản thông tin không có giá trị thực tiễn"], "answer": "B", "points": 0.25, "explain": "Văn bản thông tin gắn chặt với đời sống: từ tin tức hằng ngày đến tri thức khoa học, nội quy — đều giúp con người hiểu biết và hành động đúng đắn."}, {"type": "short", "level": "NB", "q": "Kể tên hai phương tiện phi ngôn ngữ được nhắc trong SGK Bài 8.", "answer": "Hình ảnh và sơ đồ (biểu đồ, bảng số liệu, màu sắc)", "points": 0.5, "explain": "SGK giới thiệu các phương tiện phi ngôn ngữ: hình ảnh, sơ đồ, biểu đồ, bảng số liệu, màu sắc, đường nét, kí hiệu."}, {"type": "short", "level": "TH", "q": "Nêu hai biểu hiện của tính khách quan trong văn bản Phục hồi tầng ozone.", "answer": "Dùng số liệu, hình ảnh kiểm chứng được; không đưa cảm xúc chủ quan áp đặt", "points": 0.5, "explain": "Văn bản khách quan nhờ số liệu, hình ảnh mô phỏng có thể kiểm chứng; tác giả không áp đặt cảm xúc chủ quan mà để sự thật tự lên tiếng."}, {"type": "short", "level": "VD", "q": "Khi viết văn bản hướng dẫn nơi công cộng, cần chú ý gì về đối tượng người đọc?", "answer": "Dùng từ ngữ đơn giản, dễ hiểu với mọi người; ngắn gọn, trực quan", "points": 0.5, "explain": "Nơi công cộng có đủ mọi đối tượng nên hướng dẫn phải dùng từ ngữ đơn giản, dễ hiểu, ngắn gọn, có thể kết hợp hình ảnh, biển báo trực quan."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ bàn về ý nghĩa của việc đọc sách, báo khoa học thường thức đối với học sinh.", "points": 0, "explain": "DÀN Ý: Mở đoạn: vai trò của sách báo khoa học. Thân đoạn: mở rộng tri thức (vũ trụ, thiên nhiên, văn hóa...); rèn tư duy logic, kĩ năng đọc hiểu văn bản thông tin; nuôi dưỡng tò mò, đam mê khám phá; ví dụ các văn bản Bài 8. Kết đoạn: thói quen đọc. BÀI MẪU: Đọc sách, báo khoa học thường thức mang lại nhiều lợi ích thiết thực cho học sinh. Trước hết, nó mở rộng tri thức vượt ra ngoài sách giáo khoa: từ vòng đời các vì sao, đời sống bí ẩn của cây cối đến nghệ thuật truyền thống dân tộc hay nỗ lực bảo vệ tầng ozone — mỗi trang viết đều mở ra một chân trời mới. Thứ hai, đọc văn bản thông tin rèn cho ta tư duy logic và kĩ năng đọc hiểu: biết xác định thông tin cơ bản, đánh giá số liệu, phân biệt tin thật – tin giả — kĩ năng sống còn trong thời đại bùng nổ thông tin. Thứ ba, những trang viết khoa học mà thơ mộng nuôi dưỡng trí tò mò, đam mê khám phá — biết đâu trong số chúng ta sẽ có những nhà khoa học tương lai. Thực tế, nhiều bạn chỉ đọc truyện giải trí mà ít đọc sách khoa học, bỏ lỡ một kho tàng quý. Hãy bắt đầu từ những cuốn sách mỏng, những bài báo ngắn về chủ đề mình thích; dần dần, đọc khoa học sẽ thành thói quen thú vị. Tri thức là sức mạnh — và sách khoa học thường thức là con đường ngắn nhất để mỗi học sinh chạm tới sức mạnh ấy."}, {"type": "essay", "level": "VDC", "q": "Viết một văn bản nội quy khi tham quan bảo tàng (dành cho học sinh).", "points": 0, "explain": "DÀN Ý: Tiêu đề: NỘI QUY THAM QUAN BẢO TÀNG. Mở đầu: mục đích, đối tượng. Các điều đánh số: xếp hàng, xuất trình vé; giữ trật tự, nói khẽ; không chạm vào hiện vật; không chụp ảnh nơi cấm; không ăn uống, xả rác; đi theo lối quy định; tôn trọng không gian trưng bày; xử lí vi phạm. Kết: lời cảm ơn. BÀI MẪU: NỘI QUY THAM QUAN BẢO TÀNG. (Dành cho học sinh đến tham quan học tập; nhằm giữ gìn hiện vật và không gian văn hóa.) Điều 1. Xếp hàng ngay ngắn, xuất trình vé (hoặc giấy giới thiệu) tại cổng; đi theo sự hướng dẫn của giáo viên và nhân viên bảo tàng. Điều 2. Giữ trật tự, nói khẽ trong khu vực trưng bày; không chạy nhảy, đùa nghịch. Điều 3. Tuyệt đối không chạm tay vào hiện vật, không trèo qua hàng rào bảo vệ; đứng cách tủ kính đúng khoảng cách quy định. Điều 4. Không chụp ảnh, quay phim tại những khu vực có biển cấm; khi được phép, tắt đèn flash. Điều 5. Không mang đồ ăn, thức uống vào khu trưng bày; bỏ rác đúng nơi quy định. Điều 6. Đi theo lối đi quy định, không tự ý vào khu vực hạn chế. Điều 7. Tôn trọng không gian trưng bày: không viết vẽ bậy, không gây ồn ào. Điều 8. Có thắc mắc xin hỏi nhân viên thuyết minh; tích cực ghi chép phục vụ học tập. Điều 9. Mọi hành vi vi phạm sẽ bị nhắc nhở; gây hư hỏng hiện vật phải bồi thường theo quy định pháp luật. Bảo tàng là nơi lưu giữ hồn thiêng dân tộc: hãy tham quan văn minh để mỗi chuyến đi đều bổ ích và đáng nhớ. Ban quản lí bảo tàng trân trọng cảm ơn!"}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Dòng nào nêu đúng thứ tự các văn bản đọc trong Bài 8 theo SGK?", "options": ["A. Sự sống và cái chết – Nghệ thuật truyền thống của người Việt – Phục hồi tầng ozone", "B. Phục hồi tầng ozone – Sự sống và cái chết – Nghệ thuật truyền thống của người Việt", "C. Tính cách của cây – Sự sống và cái chết – Phục hồi tầng ozone", "D. Nghệ thuật truyền thống – Tính cách của cây – Sự sống và cái chết"], "answer": "A", "points": 0.25, "explain": "Theo SGK, thứ tự là: Sự sống và cái chết, Nghệ thuật truyền thống của người Việt, Phục hồi tầng ozone; Thực hành đọc: Tính cách của cây."}, {"type": "mcq", "level": "NB", "q": "Biện pháp tu từ nào được học trong phần Thực hành tiếng Việt của Bài 8?", "options": ["A. Ẩn dụ, hoán dụ", "B. Sử dụng phương tiện phi ngôn ngữ", "C. Chêm xen, liệt kê", "D. Điệp ngữ, đối lập"], "answer": "B", "points": 0.25, "explain": "Phần Thực hành tiếng Việt của Bài 8 học về sử dụng phương tiện phi ngôn ngữ (hình ảnh, sơ đồ, biểu đồ...) trong văn bản thông tin."}, {"type": "mcq", "level": "TH", "q": "Vì sao nhan đề văn bản thường được đặt ngắn gọn, gây chú ý?", "options": ["A. Để tiết kiệm giấy", "B. Để người đọc nhanh chóng nắm được đề tài và bị thu hút tìm hiểu", "C. Để khoe tài đặt tên", "D. Không có lí do"], "answer": "B", "points": 0.25, "explain": "Nhan đề ngắn gọn, gây chú ý giúp người đọc nhanh chóng nhận ra đề tài và có hứng thú đọc tiếp — nhất là với văn bản thông tin, bản tin."}, {"type": "mcq", "level": "TH", "q": "Thông điệp chính mà văn bản Tính cách của cây gửi gắm là gì?", "options": ["A. Cây cối không có giá trị gì", "B. Hãy nhìn cây bằng con mắt khác — tôn trọng và bảo vệ rừng", "C. Chỉ nên trồng cây trong nhà", "D. Cây cối gây nguy hiểm"], "answer": "B", "points": 0.25, "explain": "Văn bản kêu gọi con người nhìn cây như những sinh linh có đời sống riêng, từ đó tôn trọng và bảo vệ rừng — lá phổi xanh của Trái Đất."}, {"type": "mcq", "level": "VDC", "q": "Để viết tốt văn bản nội quy, người viết cần đặt mình vào vị trí nào?", "options": ["A. Người muốn thể hiện quyền lực", "B. Người thực hiện: quy định phải rõ ràng, khả thi, dễ hiểu với đối tượng áp dụng", "C. Người ngoài cuộc", "D. Không cần quan tâm ai đọc"], "answer": "B", "points": 0.25, "explain": "Người viết nội quy phải đặt mình vào vị trí người thực hiện: quy định rõ ràng, khả thi, ngôn ngữ dễ hiểu thì văn bản mới có tác dụng."}, {"type": "short", "level": "NB", "q": "Kể tên hai tác giả nước ngoài có văn bản trong Bài 8.", "answer": "Trịnh Xuân Thuận và Peter Wohlleben", "points": 0.5, "explain": "Hai tác giả nước ngoài: Trịnh Xuân Thuận (nhà vật lí thiên văn, người Việt sống ở nước ngoài) với Sự sống và cái chết; Peter Wohlleben (Đức) với Tính cách của cây."}, {"type": "short", "level": "TH", "q": "Nêu hai dấu hiệu của một nguồn thông tin đáng tin cậy.", "answer": "Tác giả, tổ chức có uy tín; số liệu, dẫn chứng rõ ràng, kiểm chứng được", "points": 0.5, "explain": "Nguồn tin cậy thường đến từ tác giả, tổ chức uy tín; có số liệu, dẫn chứng rõ ràng, kiểm chứng được; thông tin cập nhật, logic."}, {"type": "short", "level": "VD", "q": "Nêu tác hại của việc đưa thông tin sai lệch trong văn bản thông tin.", "answer": "Gây hiểu lầm, hoang mang; mất niềm tin của người đọc; có thể gây hậu quả nghiêm trọng", "points": 0.5, "explain": "Thông tin sai lệch gây hiểu lầm, hoang mang dư luận; làm mất uy tín, niềm tin; trong lĩnh vực y tế, môi trường còn gây hậu quả nghiêm trọng."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về trách nhiệm của thế hệ trẻ trong việc bảo vệ môi trường (gợi ý từ văn bản Phục hồi tầng ozone).", "points": 0, "explain": "DÀN Ý: Mở đoạn: bài học từ thành công ozone. Thân đoạn: môi trường đang bị đe dọa; trách nhiệm của thế hệ trẻ (hiểu biết, hành động từ việc nhỏ, lan tỏa); niềm tin: hành động kịp thời có thể cứu vãn như câu chuyện ozone. Kết đoạn: kêu gọi. BÀI MẪU: Thành công trong việc phục hồi tầng ozone cho thấy: khi con người hành động kịp thời và đồng lòng, những thiệt hại môi trường hoàn toàn có thể được khắc phục. Bài học ấy đặt lên vai thế hệ trẻ chúng em một trách nhiệm lớn lao. Hiện nay, biến đổi khí hậu, ô nhiễm không khí, rác thải nhựa đang đe dọa trực tiếp tương lai của chính chúng em. Trách nhiệm của tuổi trẻ trước hết là trang bị hiểu biết về môi trường; sau đó là hành động từ những việc nhỏ nhất: tiết kiệm điện nước, hạn chế đồ nhựa dùng một lần, phân loại rác, trồng và bảo vệ cây xanh. Quan trọng hơn, mỗi bạn trẻ hãy là một tuyên truyền viên: lan tỏa lối sống xanh đến gia đình, bạn bè qua chính những việc làm của mình và qua mạng xã hội. Câu chuyện ozone chứng minh nỗ lực của con người không bao giờ là vô ích — nếu thế hệ hôm nay thờ ơ, thế hệ mai sau sẽ phải trả giá đắt hơn gấp nhiều lần. Hãy hành động ngay từ hôm nay, vì một Trái Đất xanh cho chúng ta và cho các thế hệ tương lai."}, {"type": "essay", "level": "VDC", "q": "Viết một văn bản hướng dẫn phòng tránh đuối nước cho học sinh trong dịp hè.", "points": 0, "explain": "DÀN Ý: Tiêu đề: HƯỚNG DẪN PHÒNG TRÁNH ĐUỐI NƯỚC. Mở đầu: đối tượng, mục đích. Các nội dung đánh số: chỉ bơi nơi an toàn, có người lớn; khởi động trước khi bơi; không bơi một mình, không đùa nghịch; mặc áo phao khi đi đò; không lội qua sông suối khi mưa lũ; cách xử lí khi bị chuột rút; cách kêu cứu và cứu người đúng cách (không nhảy xuống nếu không biết bơi); số điện thoại khẩn cấp. Kết: lời nhắn. BÀI MẪU: HƯỚNG DẪN PHÒNG TRÁNH ĐUỐI NƯỚC CHO HỌC SINH. (Dành cho học sinh trong dịp hè; giúp các em vui chơi an toàn.) 1. Chỉ tắm, bơi ở những nơi an toàn, có người lớn giám sát; tuyệt đối không bơi ở sông sâu, hồ hoang, khu vực có biển cấm. 2. Khởi động kĩ trước khi xuống nước để tránh chuột rút. 3. Không bơi một mình; không đùa nghịch, xô đẩy nhau dưới nước. 4. Khi đi đò, thuyền phải mặc áo phao; không thò tay, thò đầu ra ngoài. 5. Không lội qua sông, suối khi trời mưa lũ, nước chảy xiết. 6. Nếu bị chuột rút: bình tĩnh, thả lỏng, kêu cứu và cố bơi ngửa vào bờ. 7. Khi thấy người đuối nước: hô hoán kêu cứu, ném phao, cây sào cho người bị nạn; chỉ nhảy xuống cứu khi mình bơi giỏi và đã được tập huấn. 8. Ghi nhớ số điện thoại khẩn cấp: 115 (cấp cứu). Mỗi mùa hè, đuối nước cướp đi sinh mạng của nhiều bạn nhỏ — phần lớn do chủ quan, thiếu kĩ năng. Hãy ghi nhớ và thực hiện nghiêm hướng dẫn này để mùa hè của em luôn vui tươi, an toàn!"}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Chủ đề chung của các văn bản đọc trong Bài 8 là gì?", "options": ["A. Đều là văn bản thông tin về khoa học, văn hóa, môi trường", "B. Đều là truyện ngắn", "C. Đều là thơ ca", "D. Đều là văn bản nghị luận"], "answer": "A", "points": 0.25, "explain": "Các văn bản Bài 8 đều là văn bản thông tin: khoa học vũ trụ, nghệ thuật truyền thống, môi trường — đa dạng mà thống nhất ở tính thông tin."}, {"type": "mcq", "level": "NB", "q": "Văn bản nào sau đây KHÔNG thuộc Bài 8?", "options": ["A. Sự sống và cái chết", "B. Về chính chúng ta", "C. Nghệ thuật truyền thống của người Việt", "D. Tính cách của cây"], "answer": "B", "points": 0.25, "explain": "Về chính chúng ta thuộc Bài 9 (Hành trang cuộc sống). Ba văn bản còn lại đều thuộc Bài 8."}, {"type": "mcq", "level": "TH", "q": "Khi tóm tắt văn bản thông tin, cần đảm bảo điều gì?", "options": ["A. Chép nguyên văn toàn bộ", "B. Nêu đầy đủ thông tin cơ bản, ngắn gọn, trung thành với nội dung gốc", "C. Thêm ý kiến cá nhân vào", "D. Chỉ tóm tắt nhan đề"], "answer": "B", "points": 0.25, "explain": "Tóm tắt phải nêu đầy đủ thông tin cơ bản một cách ngắn gọn, trung thành với nội dung gốc; không chép nguyên văn, không thêm ý kiến chủ quan."}, {"type": "mcq", "level": "TH", "q": "Sơ đồ tư duy có ưu điểm gì khi tóm tắt văn bản thông tin?", "options": ["A. Làm văn bản dài hơn", "B. Thể hiện trực quan thông tin chính và mối quan hệ giữa các thông tin, dễ nhớ", "C. Thay thế việc đọc", "D. Không có ưu điểm"], "answer": "B", "points": 0.25, "explain": "Sơ đồ tư duy thể hiện trực quan thông tin chính và mối quan hệ giữa chúng bằng hình ảnh, màu sắc — giúp dễ nhớ, dễ hệ thống hơn chữ viết thuần túy."}, {"type": "mcq", "level": "VDC", "q": "Bài học phương pháp quan trọng nhất khi học Bài 8 là gì?", "options": ["A. Học thuộc lòng mọi số liệu", "B. Biết cách đọc hiểu, đánh giá độ tin cậy của thông tin và trình bày thông tin hiệu quả (kết hợp ngôn ngữ và phi ngôn ngữ)", "C. Chỉ đọc nhan đề là đủ", "D. Không cần quan tâm nguồn tin"], "answer": "B", "points": 0.25, "explain": "Bài học cốt lõi: kĩ năng đọc hiểu văn bản thông tin (xác định thông tin cơ bản, đánh giá độ tin cậy) và kĩ năng trình bày thông tin hiệu quả bằng cả phương tiện ngôn ngữ và phi ngôn ngữ."}, {"type": "short", "level": "NB", "q": "Kể tên hai loại hình nghệ thuật truyền thống được UNESCO công nhận là di sản (theo hiểu biết của em).", "answer": "Ca trù, quan họ, nhã nhạc cung đình Huế, cồng chiêng Tây Nguyên (nêu hai)", "points": 0.5, "explain": "Nhiều loại hình nghệ thuật Việt Nam được UNESCO công nhận: ca trù, quan họ Bắc Ninh, nhã nhạc cung đình Huế, cồng chiêng Tây Nguyên... — niềm tự hào dân tộc."}, {"type": "short", "level": "TH", "q": "Nêu hai việc cần làm khi gặp một thông tin chưa rõ độ tin cậy trên mạng.", "answer": "Kiểm chứng qua nguồn uy tín khác; không vội chia sẻ, lan truyền", "points": 0.5, "explain": "Trước thông tin chưa rõ độ tin cậy: kiểm chứng qua nguồn uy tín (báo chính thống, chuyên gia); tuyệt đối không vội chia sẻ, tránh tiếp tay cho tin giả."}, {"type": "short", "level": "VD", "q": "Vì sao văn bản hướng dẫn nơi công cộng nên kết hợp chữ viết với hình ảnh, biển báo?", "answer": "Vì trực quan, dễ hiểu với mọi đối tượng, kể cả người không đọc kĩ chữ", "points": 0.5, "explain": "Nơi công cộng có nhiều đối tượng; kết hợp chữ với hình ảnh, biển báo giúp hướng dẫn trực quan, dễ hiểu ngay cả với người không đọc kĩ hoặc bất đồng ngôn ngữ."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về câu nói: Tri thức là sức mạnh (liên hệ với các văn bản Bài 8).", "points": 0, "explain": "DÀN Ý: Mở đoạn: giải thích câu nói. Thân đoạn: tri thức giúp con người hiểu vũ trụ (Sự sống và cái chết), hiểu văn hóa dân tộc, tìm ra giải pháp môi trường (tầng ozone); người có tri thức làm chủ cuộc sống; phê phán thái độ coi thường học hành. Kết đoạn: nỗ lực học tập. BÀI MẪU: Câu nói Tri thức là sức mạnh đã được minh chứng qua chính các văn bản trong Bài 8. Nhờ tri thức thiên văn, con người hiểu được vòng đời các vì sao và vị trí của mình trong vũ trụ; nhờ tri thức văn hóa, ta biết trân trọng di sản cha ông; đặc biệt, nhờ tri thức khoa học về tầng ozone, nhân loại đã tìm ra nguyên nhân lỗ thủng và giải pháp khắc phục — biến điều tưởng chừng không thể thành hiện thực. Tri thức cho con người sức mạnh để cải tạo thế giới: người có tri thức sẽ có lựa chọn đúng đắn, không bị mê tín, tin giả dẫn dắt; trong học tập, ai chăm chỉ tích lũy tri thức người đó có tương lai rộng mở. Ngược lại, thiếu tri thức, con người dễ trở thành nạn nhân của sự dốt nát và bị động. Đáng tiếc, một số bạn còn coi thường việc học, cho rằng học nhiều không bằng quan hệ. Đó là quan niệm sai lầm: trong thời đại tri thức, chỉ có học vấn thực sự mới là hành trang vững chắc. Hãy biến mỗi ngày đến trường thành một ngày tích lũy sức mạnh — sức mạnh của tri thức."}, {"type": "essay", "level": "VDC", "q": "Viết một văn bản nội quy sử dụng phòng máy tính của trường (khoảng 8–10 điều).", "points": 0, "explain": "DÀN Ý: Tiêu đề: NỘI QUY PHÒNG MÁY TÍNH. Mở đầu: mục đích, đối tượng. Các điều đánh số: chỉ vào khi có giáo viên; giữ trật tự; sử dụng đúng mục đích học tập; không tự ý cài đặt, thay đổi cấu hình; bảo quản thiết bị; vệ sinh; an toàn điện; xử lí vi phạm. Kết: yêu cầu thực hiện. BÀI MẪU: NỘI QUY PHÒNG MÁY TÍNH. (Áp dụng cho học sinh khi học tập tại phòng máy; nhằm bảo quản thiết bị và đảm bảo hiệu quả học tập.) Điều 1. Chỉ vào phòng máy khi có giáo viên hướng dẫn; ngồi đúng vị trí được phân công. Điều 2. Giữ trật tự, không gây ồn ào ảnh hưởng lớp học. Điều 3. Sử dụng máy tính đúng mục đích học tập theo yêu cầu của giáo viên; không chơi game, không truy cập nội dung không lành mạnh. Điều 4. Không tự ý cài đặt, gỡ bỏ phần mềm; không thay đổi cấu hình hệ thống. Điều 5. Không ăn uống trong phòng máy; giữ tay sạch khi sử dụng bàn phím, chuột. Điều 6. Bảo quản thiết bị: không đập, gõ mạnh; tắt máy đúng cách khi kết thúc. Điều 7. Không tự ý cắm, rút các thiết bị ngoại vi; khi cần phải báo giáo viên. Điều 8. Phát hiện máy hỏng, sự cố điện phải báo ngay cho giáo viên, không tự ý sửa chữa. Điều 9. Giữ gìn vệ sinh chung; sắp xếp ghế ngồi gọn gàng sau khi ra về. Điều 10. Vi phạm nội quy sẽ bị nhắc nhở; gây hư hỏng thiết bị phải bồi thường theo quy định. Mong các em nghiêm túc thực hiện để phòng máy luôn là nơi học tập hiệu quả. (Ban giám hiệu kí duyệt.)"}]}]}
