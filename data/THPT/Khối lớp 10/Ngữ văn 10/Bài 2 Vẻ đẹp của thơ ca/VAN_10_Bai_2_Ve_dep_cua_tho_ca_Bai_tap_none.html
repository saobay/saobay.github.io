 ngụ tình đặc sắc: cảnh càng tiêu điều, lòng người càng buồn. Từ cảnh thu, nhà thơ dồn nén nỗi niềm: nhớ quê hương da diết, lo cho vận nước đang trong cơn loạn lạc. Nỗi buồn cá nhân hòa vào nỗi buồn thời đại, tạo nên chiều sâu tư tưởng: thơ Đỗ Phủ bao giờ cũng gắn số phận mình với vận mệnh đất nước. Về nghệ thuật, bài thơ là mẫu mực của thất ngôn bát cú Đường luật: niêm luật chặt chẽ, các cặp câu đối chỉnh, hình ảnh đối lập tương phản, ngôn ngữ hàm súc đến mỗi chữ đều “cân đo”. Giọng thơ trầm buồn, suy tư mà không bi lụy. “Thu hứng” có giá trị hiện thực sâu sắc (bức tranh thời loạn) và giá trị nhân đạo cao cả (tấm lòng yêu quê hương, lo cho dân cho nước). Hơn một nghìn năm đã trôi qua, bài thơ vẫn làm rung động lòng người — bởi nỗi buồn thu, tình quê, lòng yêu nước là những cảm xúc muôn thuở của con người. Đọc “Thu hứng”, em càng thấm thía: thơ hay là thơ nói được tiếng lòng của cả một thời đại.", "points": 0}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Hình ảnh thơ là gì?", "options": ["A. Hình ảnh được gợi lên từ ngôn từ, vừa tái hiện đối tượng vừa thể hiện tâm trạng chủ thể trữ tình", "B. Bìa của tập thơ", "C. Ảnh chân dung của nhà thơ", "D. Tranh minh họa in kèm bài thơ trong sách"], "answer": "A", "explain": "Hình ảnh thơ do ngôn từ gợi lên, mang hai lớp nghĩa: tái hiện đối tượng và thể hiện tâm trạng — cảnh tình hòa quyện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hàn Mặc Tử là nhà thơ tiêu biểu của dòng thơ nào?", "options": ["A. Thơ dân gian", "B. Thơ cách mạng kháng chiến", "C. Phong trào Thơ mới lãng mạn", "D. Thơ trung đại"], "answer": "C", "explain": "Hàn Mặc Tử (1912 – 1940) là nhà thơ tiêu biểu của phong trào Thơ mới lãng mạn, với phong cách độc đáo, vừa trong trẻo vừa huyền ảo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bức tranh mùa xuân trong “Mùa xuân chín” có vẻ đẹp như thế nào?", "options": ["A. Tiêu điều, ảm đạm", "B. Hoang tàn, đổ nát", "C. Trong trẻo, rực rỡ, căng tràn sức sống", "D. U ám, buồn bã"], "answer": "C", "explain": "Mùa xuân trong thơ Hàn Mặc Tử trong trẻo, rực rỡ: nắng, cỏ, sóng… căng tràn sức sống — biểu hiện của tình yêu đời tha thiết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lỗi dùng từ trong câu thường biểu hiện ở những dạng nào?", "options": ["A. Dùng đúng chính tả", "B. Câu văn quá ngắn gọn", "C. Viết chữ quá đẹp, khó đọc", "D. Dùng từ không đúng nghĩa, sai phong cách, lặp từ, dùng từ thừa"], "answer": "D", "explain": "Các lỗi dùng từ thường gặp: sai nghĩa, sai phong cách, lặp từ, thừa từ — cần nhận biết để sửa cho đúng, cho hay.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao khi đọc hiểu thơ, cần đọc diễn cảm nhiều lần?", "options": ["A. Để luyện giọng nói cho to", "B. Để thuộc lòng bài thơ thật nhanh", "C. Để đỡ buồn ngủ khi học", "D. Vì nhạc tính, nhịp điệu giúp cảm nhận vẻ đẹp âm thanh và mạch cảm xúc của bài thơ"], "answer": "D", "explain": "Thơ là nghệ thuật của âm thanh và cảm xúc; đọc diễn cảm giúp tai nghe được nhạc điệu, tim cảm được mạch cảm xúc.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Sự ngắt giọng tạo thành nhịp điệu trong thơ gọi là …", "answer": "nhịp", "explain": "Nhịp (ví dụ 4/3, 2/2/3) tạo nhạc điệu cho thơ, đồng thời nhấn mạnh ý nghĩa của từng đoạn.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Bài thơ “Mùa xuân chín” là sáng tác của nhà thơ nào?", "answer": "Hàn Mặc Tử", "explain": "Hàn Mặc Tử là tác giả của “Mùa xuân chín” — một trong những bài thơ xuân hay nhất của phong trào Thơ mới.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong bố cục thơ Đường luật thất ngôn bát cú (đề – thực – luận – kết), hai câu đầu (câu 1-2) thuộc phần nào?", "answer": "đề", "explain": "Phần đề (câu 1-2) có nhiệm vụ giới thiệu, mở ra ý thơ; tiếp theo là thực, luận (đối nhau) và kết.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích vẻ đẹp của hình ảnh mùa xuân trong bài thơ “Mùa xuân chín” của Hàn Mặc Tử.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu “Mùa xuân chín” và bức tranh xuân trong trẻo, rực rỡ. 2) Thân đoạn: phân tích các hình ảnh — nắng vàng, cỏ non, sóng, khách xa…: tươi mới, trong sáng, căng tràn sức sống; nghệ thuật gợi hình, gợi cảm; hình ảnh vừa tả thực vừa chở tâm trạng yêu đời, khát khao giao cảm của thi sĩ. 3) Kết đoạn: khẳng định hình ảnh xuân làm nên linh hồn bài thơ; cảm nghĩ. BÀI MẪU: Bức tranh mùa xuân trong “Mùa xuân chín” của Hàn Mặc Tử là một trong những bức tranh xuân đẹp nhất của thơ ca Việt Nam. Đó là một mùa xuân trong trẻo đến tinh khôi: nắng vàng ươm trải khắp, cỏ non mơn mởn, làn sóng lăn tăn gợn nhẹ — tất cả đều căng tràn sức sống như đang “chín” dần, rực rỡ dần. Điều đặc biệt là mỗi hình ảnh đều thấm đẫm tâm trạng thi sĩ: nắng không chỉ sáng mà còn ấm áp tình người, cỏ không chỉ xanh mà còn mơn mởn niềm vui, sóng không chỉ lăn tăn mà còn gợn lên khát khao giao cảm. Hàn Mặc Tử đã thổi hồn mình vào cảnh vật, khiến thiên nhiên như cũng đang yêu đời, đang say sưa cùng con người. Nghệ thuật gợi hình, gợi cảm tài tình: ít nét vẽ mà đủ đầy, mỗi chữ đều óng ánh như nắng xuân. Đọc những câu thơ, em như thấy mùa xuân đang chín dần trong lòng mình — một mùa xuân của tuổi trẻ, của niềm tin yêu cuộc đời. Bức tranh xuân ấy là minh chứng cho tâm hồn tha thiết yêu đời của Hàn Mặc Tử, và cũng nhắc em biết trân trọng vẻ đẹp của thiên nhiên, của cuộc sống quanh mình.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích bài thơ “Mùa xuân chín” của Hàn Mặc Tử (tình yêu đời và khát vọng giao cảm).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu Hàn Mặc Tử (Thơ mới) và “Mùa xuân chín”; nêu vấn đề: tình yêu đời, khát vọng giao cảm. 2) Thân bài: a) Khái quát: mạch cảm xúc (từ ngắm xuân đến hòa vào xuân). b) Phân tích: bức tranh xuân trong trẻo, rực rỡ (hình ảnh, từ ngữ); tình yêu đời tha thiết (say sưa, đắm chìm); khát vọng giao cảm (muốn hòa nhập, sẻ chia với đời); nét buồn man mác, dự cảm mong manh — chiều sâu tâm trạng. c) Nghệ thuật: thơ tự do phóng khoáng; hình ảnh tươi mới; nhạc điệu du dương; giọng say sưa mà bâng khuâng. d) Giá trị: vẻ đẹp tâm hồn thi sĩ; bài học yêu đời. 3) Kết bài: khẳng định vị trí bài thơ; cảm nghĩ, liên hệ. BÀI MẪU: Hàn Mặc Tử là nhà thơ của những khát khao cháy bỏng, và “Mùa xuân chín” là bài thơ kết tinh tình yêu đời tha thiết của ông. Mở đầu bài thơ là bức tranh mùa xuân trong trẻo, rực rỡ: nắng vàng, cỏ non, sóng gợn — thiên nhiên như đang vào độ “chín” căng tràn sức sống. Đắm chìm trong bức tranh ấy, thi sĩ bộc lộ một tình yêu đời say sưa đến ngây ngất: ông ngắm xuân, yêu xuân và muốn hòa tan vào xuân. Khát vọng giao cảm với đời thể hiện mãnh liệt: thi sĩ không đứng ngoài mà muốn bước vào bức tranh, muốn sẻ chia niềm vui với “khách xa”, với mọi người. Đó là khát vọng của một tâm hồn cô đơn muốn được yêu thương, được hòa nhập. Nhưng bên cạnh niềm say sưa, bài thơ phảng phất nỗi buồn man mác và dự cảm mong manh: mùa xuân rực rỡ mà ngắn ngủi, hạnh phúc đẹp mà dễ vỡ — nét tâm trạng rất Hàn Mặc Tử, khiến niềm vui thêm thấm thía. Về nghệ thuật, bài thơ thành công với thể thơ tự do phóng khoáng, hình ảnh tươi mới trong sáng, ngôn ngữ óng ả như nắng xuân, nhạc điệu nhẹ nhàng du dương và giọng điệu vừa say sưa vừa bâng khuâng. “Mùa xuân chín” không chỉ là bài ca về mùa xuân mà còn là bài ca về tình yêu cuộc sống. Đọc thơ, em thấm thía bài học: hãy yêu đời tha thiết, sống hết mình với từng khoảnh khắc, đồng thời biết trân trọng những gì mong manh, quý giá quanh mình — bởi hạnh phúc cũng như mùa xuân, đẹp nhất khi ta biết nâng niu.", "points": 0}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Nhạc tính trong thơ được tạo nên chủ yếu bởi yếu tố nào?", "options": ["A. Phần chú thích cuối bài", "B. Số trang của tập thơ", "C. Tên của tác giả", "D. Vần và nhịp"], "answer": "D", "explain": "Vần (âm điệu giống nhau) và nhịp (ngắt giọng) tạo nên nhạc tính — vẻ đẹp âm thanh của thơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lưu Trọng Lư là tác giả của bài thơ nổi tiếng nào được học trong bài?", "options": ["A. Qua Đèo Ngang", "B. Mùa xuân chín", "C. Thu hứng", "D. Tiếng thu"], "answer": "D", "explain": "Lưu Trọng Lư là nhà thơ Thơ mới, tác giả bài thơ “Tiếng thu” man mác buồn — đối tượng phân tích của Chu Văn Sơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Văn bản “Bản hòa âm ngôn từ trong Tiếng thu của Lưu Trọng Lư” của Chu Văn Sơn thuộc kiểu văn bản nào?", "options": ["A. Kịch bản sân khấu", "B. Hồi kí cá nhân", "C. Truyện ngắn", "D. Văn bản nghị luận về một tác phẩm thơ"], "answer": "D", "explain": "Đây là văn bản nghị luận văn học: dùng lí lẽ và cảm nhận để phân tích vẻ đẹp ngôn từ trong bài thơ “Tiếng thu”.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây mắc lỗi về trật tự từ?", "options": ["A. Em yêu màu xanh quê hương", "B. Quê hương em yêu màu xanh", "C. Màu xanh quê hương em yêu", "D. Xanh em yêu màu quê hương"], "answer": "D", "explain": "Câu B đảo lộn trật tự từ một cách tùy tiện, gây khó hiểu, tối nghĩa — mắc lỗi về trật tự từ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Điểm chung về cảm hứng giữa “Thu hứng” (Đỗ Phủ) và “Tiếng thu” (Lưu Trọng Lư) là gì?", "options": ["A. Đều viết về mùa hè rực rỡ", "B. Đều viết về đề tài chiến tranh", "C. Đều lấy mùa thu làm nguồn cảm hứng, gửi gắm tâm trạng con người", "D. Đều là thơ hai-cư Nhật Bản"], "answer": "C", "explain": "Cả hai bài thơ đều lấy mùa thu làm nguồn cảm hứng: Đỗ Phủ gửi nỗi buồn nhớ quê, Lưu Trọng Lư gửi nỗi buồn man mác — thu và tình hòa quyện.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Cách gieo những tiếng có âm điệu giống nhau ở cuối dòng thơ gọi là …", "answer": "vần", "explain": "Vần tạo nhạc tính cho thơ; có vần chân (cuối dòng), vần lưng (giữa dòng).", "points": 0.5}, {"type": "short", "level": "TH", "q": "Chu Văn Sơn đã phân tích “bản hòa âm ngôn từ” trong bài thơ nào của Lưu Trọng Lư?", "answer": "Tiếng thu", "explain": "Đối tượng phân tích của Chu Văn Sơn là bài thơ “Tiếng thu” — bài thơ thu man mác nổi tiếng của Lưu Trọng Lư.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thơ hai-cư thường khép lại bằng một “khoảng lặng” để người đọc suy ngẫm; lối viết ít chữ mà gợi nhiều ý này thể hiện tính … của thơ.", "answer": "hàm súc", "explain": "Tính hàm súc: ngôn ngữ ít mà ý nghĩa nhiều — đặc trưng nổi bật của thơ nói chung và hai-cư nói riêng.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích vẻ đẹp của “bản hòa âm ngôn từ” trong bài thơ “Tiếng thu” của Lưu Trọng Lư (theo cảm nhận của Chu Văn Sơn).", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu “Tiếng thu” (Lưu Trọng Lư) và nhận xét của Chu Văn Sơn về “bản hòa âm ngôn từ”. 2) Thân đoạn: phân tích — sự phối hợp thanh bằng – trắc tạo nhạc điệu trầm bổng; từ ngữ giàu nhạc tính gợi tiếng thu xao xác, man mác; âm thanh hòa quyện với cảm xúc (buồn nhẹ, bâng khuâng); nghệ thuật “chơi chữ” của nhà thơ. 3) Kết đoạn: khẳng định ngôn từ là linh hồn của thơ; bài học (đọc thơ phải lắng nghe). BÀI MẪU: Theo Chu Văn Sơn, cái hay đặc biệt của “Tiếng thu” (Lưu Trọng Lư) nằm ở “bản hòa âm ngôn từ” — một bản nhạc thu được dệt bằng chữ. Nhà thơ đã phối hợp tài tình thanh bằng và thanh trắc: những thanh bằng trải dài gợi sự êm đềm, man mác; những thanh trắc điểm xuyết tạo nhịp gấp, như tiếng lá rơi xao xác trong gió thu. Từ ngữ được chọn lọc kĩ lưỡng, giàu nhạc tính: mỗi chữ như một nốt nhạc, mỗi câu như một nhịp điệu, hòa quyện thành bản hòa âm buồn nhẹ mà thấm thía. Điều tài tình là âm thanh ấy không đứng riêng mà chở đầy cảm xúc: nghe tiếng thu mà thấy lòng bâng khuâng, man mác — âm và tình hòa làm một. Chu Văn Sơn đã cho ta thấy: nhà thơ đích thực là người “chơi” với chữ, phối âm thanh như nhạc sĩ phối nhạc; và vẻ đẹp của thơ ca trước hết nằm ở ngôn từ. Đọc “Tiếng thu”, em rút ra bài học: thưởng thức thơ không chỉ bằng mắt mà còn bằng tai — phải đọc thành tiếng, lắng nghe nhạc điệu thì mới cảm hết cái hay của thơ.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích vẻ đẹp triết lí và tính hàm súc của chùm thơ hai-cư Nhật Bản đã học.", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu thơ hai-cư (Nhật Bản, Ba-sô); nêu vấn đề: vẻ đẹp triết lí và tính hàm súc. 2) Thân bài: a) Khái quát: hình thức 17 âm tiết, nội dung khoảnh khắc thiên nhiên. b) Tính hàm súc: ít chữ gợi nhiều — phân tích một vài bài (bức tranh nhỏ, khoảng lặng lớn); nghệ thuật gợi, không tả cặn kẽ. c) Vẻ đẹp triết lí: từ khoảnh khắc thiên nhiên bừng sáng lẽ đời (vô thường, trân trọng hiện tại, hòa hợp thiên nhiên); triết lí phương Đông thâm trầm. d) So sánh nhẹ với thơ ca khác để làm nổi bật nét riêng. 3) Kết bài: khẳng định giá trị; liên hệ (sống chậm, tinh tế). BÀI MẪU: Thơ hai-cư Nhật Bản được mệnh danh là thể thơ ngắn nhất thế giới — chỉ ba câu, mười bảy âm tiết — nhưng lại là một trong những thể thơ hàm súc và giàu triết lí nhất. Vẻ đẹp đầu tiên của hai-cư là tính hàm súc đến kinh ngạc: nhà thơ chỉ ghi lại một khoảnh khắc thiên nhiên chân thực — con quạ đậu trên cành khô chiều thu, giọt sương đọng trên lá sen, tiếng ve ran trong nắng hạ — không một lời bình, không một tính từ tô vẽ. Vậy mà đằng sau những chữ ít ỏi ấy là cả một khoảng lặng mênh mông để người đọc suy ngẫm. Đó chính là nghệ thuật “lấy ít gợi nhiều”: càng ít lời, dư ba càng lớn. Vẻ đẹp thứ hai, sâu xa hơn, là tính triết lí: từ khoảnh khắc thiên nhiên cụ thể, bài thơ bừng sáng một lẽ đời — sự vô thường của vạn vật, vẻ đẹp của sự tĩnh tại, triết lí trân trọng từng phút giây hiện tại và sống hòa hợp với thiên nhiên. Triết lí ấy không được nói thẳng mà được gợi ra, thấm dần — đúng tinh thần thâm trầm của phương Đông. So với thơ Đường luật chặt chẽ hay thơ mới phóng khoáng, hai-cư chọn con đường riêng: im lặng mà sâu sắc. Đọc hai-cư, ta học được cách sống tinh tế: biết dừng lại trước một cành hoa, lắng nghe một tiếng chim, và nhận ra triết lí cuộc đời ẩn trong những điều giản dị nhất. Đó là món quà quý mà thơ hai-cư dành cho con người hiện đại vốn đang sống quá vội vàng.", "points": 0}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Giọng điệu trong thơ là gì?", "options": ["A. Thái độ, tình cảm của chủ thể trữ tình thể hiện qua ngôn từ (vui, buồn, trang trọng…)", "B. Giọng đọc to hay nhỏ của người đọc", "C. Âm lượng của buổi đọc thơ", "D. Giọng hát của nhà thơ"], "answer": "A", "explain": "Giọng điệu là thái độ, tình cảm của chủ thể trữ tình qua ngôn từ: có thể vui tươi, buồn man mác, trang trọng, mỉa mai…", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài “Thu hứng” (bài số 1) nằm trong chùm thơ gồm mấy bài của Đỗ Phủ?", "options": ["A. 8 bài", "B. 4 bài", "C. 10 bài", "D. 12 bài"], "answer": "A", "explain": "“Thu hứng” là chùm 8 bài thơ thất ngôn bát cú; bài được học trong SGK là bài số 1, hay nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hoàn cảnh sáng tác chùm “Thu hứng” của Đỗ Phủ là gì?", "options": ["A. Khi loạn lạc, ông lưu lạc ở Quỳ Châu, bệnh tật, nhớ quê", "B. Khi đất nước thái bình, ông làm quan to", "C. Khi ông còn đi học ở trường làng", "D. Khi ông đi du lịch vui vẻ cùng bạn bè"], "answer": "A", "explain": "Năm 766, Đỗ Phủ lưu lạc ở Quỳ Châu giữa thời loạn, bệnh tật, xa quê — nỗi buồn dồn nén thành chùm “Thu hứng” bất hủ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi viết văn bản nghị luận phân tích một bài thơ, phần thân bài KHÔNG nên làm gì?", "options": ["A. Chép lại toàn bộ bài thơ thay cho việc phân tích", "B. Đánh giá nghệ thuật (thể thơ, ngôn ngữ, giọng điệu)", "C. Phân tích mạch cảm xúc, hình ảnh", "D. Nêu chủ đề, giá trị của bài thơ"], "answer": "A", "explain": "Thân bài phải phân tích, đánh giá — chép lại bài thơ thay cho phân tích là cách làm sai, thiếu nghị luận.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Câu “Anh ấy là người rất là tốt bụng và hiền lành tốt” mắc lỗi dùng từ nào?", "options": ["A. Thiếu chủ ngữ", "B. Lặp từ (“tốt” lặp ý với “tốt bụng”), dùng từ thừa", "C. Sai chính tả", "D. Sai thì của động từ"], "answer": "B", "explain": "“Tốt bụng” đã bao hàm ý “tốt” nên thêm “tốt” là lặp từ, thừa từ — cần sửa thành “Anh ấy là người tốt bụng và hiền lành”.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Thơ hai-cư có nguồn gốc từ đất nước nào?", "answer": "Nhật Bản", "explain": "Hai-cư (haiku) là thể thơ truyền thống của Nhật Bản, do Ma-tsu-ô Ba-sô khai sáng.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Trong “Thu hứng”, mùa thu gợi cho Đỗ Phủ nỗi niềm gì lớn nhất?", "answer": "nhớ quê", "explain": "Xa quê giữa thời loạn, mùa thu càng gợi nỗi nhớ quê hương da diết trong lòng Đỗ Phủ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Biện pháp nghệ thuật dùng hình ảnh thiên nhiên để gửi gắm tâm trạng con người (như rừng phong tiêu điều gợi nỗi buồn trong “Thu hứng”) gọi là gì?", "answer": "tả cảnh ngụ tình", "explain": "Tả cảnh ngụ tình: mượn cảnh vật để gửi gắm tâm trạng — thủ pháp đặc sắc của thơ trữ tình, nhất là thơ Đường.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu cảm nhận của em về tình yêu thiên nhiên trong thơ hai-cư Nhật Bản.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu thơ hai-cư gắn bó máu thịt với thiên nhiên. 2) Thân đoạn: cảm nhận — nhà thơ quan sát thiên nhiên chăm chú, tinh tế (từng khoảnh khắc: quạ chiều, sương mai, ve hạ); thái độ nâng niu, trân trọng; con người hòa hợp, không tách khỏi thiên nhiên; qua thiên nhiên bừng sáng triết lí sống. 3) Kết đoạn: khẳng định tình yêu thiên nhiên làm nên vẻ đẹp hai-cư; liên hệ (yêu và bảo vệ thiên nhiên). BÀI MẪU: Đọc chùm thơ hai-cư Nhật Bản, em cảm nhận sâu sắc một tình yêu thiên nhiên tha thiết, tinh tế của các nhà thơ. Tình yêu ấy thể hiện ở sự quan sát chăm chú đến từng khoảnh khắc nhỏ bé nhất: con quạ đậu im trên cành khô giữa chiều thu, giọt sương long lanh trên lá sen buổi sớm, tiếng ve ran râm ran trong nắng hạ. Không ồn ào, không tô vẽ, nhà thơ chỉ lặng lẽ ghi lại như một người bạn tri âm của thiên nhiên. Tình yêu ấy còn ở thái độ nâng niu, trân trọng: mỗi khoảnh khắc đều được coi là duy nhất, đáng quý — triết lí trân trọng hiện tại thấm đẫm từng bài thơ. Đặc biệt, con người trong hai-cư không đứng ngoài ngắm cảnh mà hòa mình vào thiên nhiên, là một phần của thiên nhiên. Qua lăng kính ấy, thiên nhiên không chỉ đẹp mà còn dạy con người lẽ sống: tĩnh tại, khiêm nhường, thuận theo tự nhiên. Tình yêu thiên nhiên trong hai-cư khiến em soi lại mình: giữa cuộc sống vội vã, ta đã bao lần dừng lại ngắm một áng mây, nghe một tiếng chim? Bài học từ hai-cư thật giản dị mà sâu sắc: hãy yêu thiên nhiên bằng sự chăm chú và trân trọng, và hãy bảo vệ thiên nhiên như bảo vệ chính tâm hồn mình.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ đánh giá nghệ thuật thơ Đường luật qua bài “Thu hứng” của Đỗ Phủ (niêm luật, đối, hình ảnh, ngôn ngữ).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu Đỗ Phủ và “Thu hứng”; nêu vấn đề: nghệ thuật Đường luật mẫu mực. 2) Thân bài: a) Thể thất ngôn bát cú chuẩn mực: 8 câu 7 chữ, niêm luật chặt chẽ, bố cục đề – thực – luận – kết. b) Phép đối: các cặp câu thực – luận đối chỉnh (ý đối ý, lời đối lời) tạo vẻ đẹp cân xứng. c) Hình ảnh: đối lập, tương phản (cao – thấp, động – tĩnh); tả cảnh ngụ tình. d) Ngôn ngữ hàm súc, mỗi chữ đều đắt giá; giọng trầm buồn, suy tư. e) Đánh giá: nghệ thuật phục vụ nội dung, nâng cảm xúc thành triết lí. 3) Kết bài: khẳng định bậc thầy thơ Đường; bài học (học sự công phu trong dùng chữ). BÀI MẪU: “Thu hứng” của Đỗ Phủ được coi là bài thơ mẫu mực của thơ Đường luật, nơi nghệ thuật đạt tới độ hoàn mĩ. Trước hết, bài thơ tuân thủ nghiêm ngặt thể thất ngôn bát cú: tám câu, mỗi câu bảy chữ, niêm luật chặt chẽ, bố cục đề – thực – luận – kết rõ ràng — một “tòa kiến trúc” ngôn từ cân đối, vững chãi. Nổi bật là phép đối điêu luyện: các cặp câu phần thực và phần luận đối nhau chằn chặn cả về ý và lời, tạo nên vẻ đẹp cân xứng, hài hòa mà vẫn giàu biến hóa. Hệ thống hình ảnh được tổ chức theo nguyên tắc đối lập, tương phản: rừng phong với dòng sông, mây trời với mặt đất, cái cao vời với cái sâu thẳm — tương phản mà thống nhất trong nỗi buồn thu. Đặc biệt, Đỗ Phủ dùng thủ pháp tả cảnh ngụ tình bậc thầy: cảnh thu tiêu điều không chỉ là cảnh thực mà là tấm gương phản chiếu tâm trạng — buồn vì thu, nhớ quê, lo đời. Ngôn ngữ thơ hàm súc đến mức mỗi chữ đều như được “cân đo”: ít lời mà gợi cả một thế giới cảm xúc. Giọng thơ trầm buồn, suy tư, không bi lụy mà thâm trầm, từng trải. Tất cả hòa quyện cho thấy: ở Đỗ Phủ, nghệ thuật không phải là trò chơi chữ nghĩa mà là phương tiện để nâng cảm xúc cá nhân thành triết lí nhân sinh. Học “Thu hứng”, em thấm thía bài học về sự công phu trong dùng chữ: viết hay là phải “thôi xao” từng con chữ, để mỗi chữ đều có hồn.", "points": 0}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Thể thơ “thất ngôn bát cú” có đặc điểm gì?", "options": ["A. Tự do số câu, số chữ", "B. 6 câu, mỗi câu 8 chữ", "C. 8 câu, mỗi câu 7 chữ", "D. 4 câu, mỗi câu 7 chữ"], "answer": "C", "explain": "Thất ngôn bát cú: 8 câu, mỗi câu 7 chữ — thể thơ Đường luật trang trọng, chuẩn mực.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác giả của văn bản “Bản hòa âm ngôn từ trong Tiếng thu của Lưu Trọng Lư” là ai?", "options": ["A. Lưu Trọng Lư", "B. Chu Văn Sơn", "C. Hàn Mặc Tử", "D. Đỗ Phủ"], "answer": "B", "explain": "Chu Văn Sơn là tác giả văn bản nghị luận phân tích “bản hòa âm ngôn từ” trong “Tiếng thu” của Lưu Trọng Lư.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tâm trạng bao trùm trong “Thu hứng” của Đỗ Phủ là gì?", "options": ["A. Hài hước, dí dỏm", "B. Buồn thương: buồn vì cảnh thu tiêu điều, nhớ quê hương, lo cho vận nước", "C. Vui tươi, yêu đời", "D. Thờ ơ, lạnh nhạt"], "answer": "B", "explain": "“Thu hứng” thấm đẫm nỗi buồn: buồn cảnh thu, nhớ quê, lo đời — nỗi buồn của kẻ sĩ trước thời loạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ nào dùng sai trong câu “Cô ấy có một nhan sắc rất là xấu xí”?", "options": ["A. “nhan sắc” (vốn chỉ vẻ đẹp, không đi với “xấu xí”)", "B. “cô ấy”", "C. “có một”", "D. “rất là”"], "answer": "A", "explain": "“Nhan sắc” chỉ vẻ đẹp của người phụ nữ, không thể đi với “xấu xí” — lỗi dùng từ không đúng nghĩa; nên sửa thành “diện mạo” hoặc bỏ “nhan sắc”.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao “Mùa xuân chín” vừa rực rỡ vừa phảng phất nỗi buồn?", "options": ["A. Vì nhà thơ không thích mùa xuân", "B. Vì bài thơ bị in sai một số chữ", "C. Vì niềm vui giao cảm với đời xen lẫn dự cảm mong manh về hạnh phúc ngắn ngủi", "D. Vì nhà thơ viết bài thơ vào mùa đông"], "answer": "C", "explain": "Nét độc đáo của Hàn Mặc Tử: say sưa với vẻ đẹp mà vẫn phảng phất dự cảm mong manh — niềm vui càng thấm thía vì ý thức được sự ngắn ngủi.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Bốn phần đề – thực – luận – kết là bố cục của thể thơ …", "answer": "thất ngôn bát cú", "explain": "Thất ngôn bát cú Đường luật có bố cục đề – thực – luận – kết; cặp thực và cặp luận phải đối nhau.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Hàn Mặc Tử là nhà thơ của phong trào thơ ca nào?", "answer": "Thơ mới", "explain": "Phong trào Thơ mới lãng mạn (1932 – 1945) đã giải phóng cảm xúc cá nhân; Hàn Mặc Tử là một trong những nhà thơ tiêu biểu nhất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong “Mùa xuân chín”, nhiều hình ảnh vừa tả thực vừa gợi tâm trạng (nắng, cỏ, sóng…); loại hình ảnh mang hai lớp nghĩa này thường được gọi là hình ảnh …", "answer": "tượng trưng", "explain": "Hình ảnh tượng trưng vừa có nghĩa thực vừa gợi nghĩa bóng, chở tâm trạng — đặc trưng của thơ lãng mạn.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích tâm trạng của Đỗ Phủ trong bài thơ “Thu hứng”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu “Thu hứng” và tâm trạng buồn thương bao trùm. 2) Thân đoạn: phân tích các lớp tâm trạng — buồn vì cảnh thu tiêu điều (tả cảnh ngụ tình); nhớ quê hương da diết (xa quê giữa loạn lạc); lo cho vận nước (tấm lòng kẻ sĩ); nỗi buồn thấm đẫm mà không bi lụy, nâng thành triết lí nhân sinh. 3) Kết đoạn: khẳng định tâm trạng làm nên chiều sâu bài thơ; cảm nghĩ. BÀI MẪU: Tâm trạng bao trùm “Thu hứng” của Đỗ Phủ là nỗi buồn thương sâu lắng, nhiều tầng lớp. Trước hết là nỗi buồn trước cảnh thu tiêu điều: rừng phong nhuốm màu ảm đạm, dòng sông cuộn chảy, mây trời xám xịt — cảnh vật như cũng mang tâm sự con người. Từ cảnh thu, nỗi buồn dồn về nỗi nhớ quê hương da diết: kẻ lưu lạc nơi đất khách Quỳ Châu, giữa thời loạn lạc, càng thấm thía nỗi xa quê. Sâu hơn nữa là nỗi lo cho vận nước: nhà thơ không chỉ buồn cho mình mà buồn cho cả thời cuộc đảo điên, cho dân cho nước lầm than. Ba lớp tâm trạng hòa quyện: buồn cảnh – nhớ quê – lo đời, tạo nên một nỗi buồn lớn, mang tầm vóc thời đại. Điều đáng quý là nỗi buồn của Đỗ Phủ không bi lụy, yếu đuối mà trầm lắng, suy tư, được nâng lên thành triết lí nhân sinh về kiếp người nhỏ bé trước dòng đời dâu bể. Chính chiều sâu tâm trạng ấy khiến “Thu hứng” vượt qua nghìn năm mà vẫn chạm tới trái tim người đọc: ai xa quê mà không nhớ, ai yêu nước mà không lo? Đọc thơ, em càng trân trọng tấm lòng của nhà thơ — buồn mà đẹp, đau mà cao thượng.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích khát vọng giao cảm với cuộc đời trong bài thơ “Mùa xuân chín” của Hàn Mặc Tử.", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu Hàn Mặc Tử, “Mùa xuân chín”; nêu vấn đề: khát vọng giao cảm. 2) Thân bài: a) Bức tranh xuân — đối tượng của khát vọng (trong trẻo, rực rỡ). b) Biểu hiện khát vọng: đắm chìm, say sưa với xuân; muốn hòa nhập, sẻ chia niềm vui với “khách xa”, với đời; ngôn ngữ, hình ảnh thể hiện sự khao khát. c) Chiều sâu: khát vọng của tâm hồn cô đơn muốn được yêu thương; dự cảm mong manh khiến khát vọng thêm tha thiết. d) Nghệ thuật: thơ tự do, hình ảnh tươi mới, nhạc điệu, giọng say sưa. 3) Kết bài: khẳng định vẻ đẹp tâm hồn thi sĩ; liên hệ (sống cởi mở, giao cảm). BÀI MẪU: “Mùa xuân chín” của Hàn Mặc Tử là bài ca về khát vọng giao cảm với cuộc đời — khát vọng của một tâm hồn cô đơn muốn được hòa nhập, được yêu thương. Khát vọng ấy nảy sinh từ bức tranh mùa xuân trong trẻo, rực rỡ: nắng vàng ươm, cỏ non mơn mởn, sóng gợn lăn tăn — thiên nhiên đẹp đến mức con người không thể đứng ngoài mà ngắm nhìn dửng dưng. Thi sĩ đắm chìm, say sưa trong bức tranh ấy với tất cả các giác quan: mắt ngắm, tai nghe, lòng rộn ràng. Nhưng ông không dừng ở ngắm nhìn: khát vọng giao cảm thôi thúc ông muốn bước vào bức tranh, muốn sẻ chia niềm vui với “khách xa”, với mọi người — như muốn nói: xuân đẹp thế này, hãy cùng nhau tận hưởng. Đằng sau khát vọng nồng nàn là một tâm hồn từng cô đơn, từng chịu nhiều đau khổ, nên càng khao khát được giao hòa với đời. Và chính dự cảm mong manh về sự ngắn ngủi của hạnh phúc lại khiến khát vọng thêm tha thiết, da diết: phải yêu ngay, sống ngay kẻo lỡ. Nghệ thuật thơ tự do phóng khoáng, hình ảnh tươi mới óng ả, nhạc điệu du dương và giọng điệu say sưa mà bâng khuâng đã chuyển tải thành công khát vọng ấy. “Mùa xuân chín” nhắc nhở chúng ta: đừng sống khép kín, thờ ơ; hãy mở lòng giao cảm với thiên nhiên, với con người — bởi hạnh phúc lớn nhất là được sẻ chia, và cuộc đời đẹp nhất khi ta sống hết mình với nó.", "points": 0}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Ma-tsu-ô Ba-sô là ai?", "options": ["A. Nhà văn của Trung Quốc", "B. Nhà thơ hai-cư nổi tiếng của Nhật Bản", "C. Họa sĩ của nước Pháp", "D. Nhà thơ của Việt Nam"], "answer": "B", "explain": "Ma-tsu-ô Ba-sô (thế kỉ XVII) là người khai sáng thơ hai-cư Nhật Bản — bậc thầy của thể thơ ngắn nhất thế giới.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhan đề “Thu hứng” có nghĩa là gì?", "options": ["A. Chuyến du lịch mùa thu", "B. Cảm xúc mùa thu", "C. Mùa thu hoạch lúa", "D. Hội chợ mùa thu"], "answer": "B", "explain": "“Thu hứng” là từ Hán Việt: “thu” (mùa thu), “hứng” (cảm xúc) — cảm xúc trước mùa thu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu nào sau đây dùng từ đúng?", "options": ["A. Bức tranh mùa xuân trong trẻo, rực rỡ", "B. Anh ấy cao một cách lùn tịt", "C. Cô ấy đẹp một cách xấu xí", "D. Bài thơ hay một cách dở tệ"], "answer": "A", "explain": "Chỉ câu B dùng từ đúng nghĩa, hợp phong cách; các câu còn lại mâu thuẫn nghĩa (“đẹp” với “xấu xí”, “cao” với “lùn”).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nét đặc sắc trong “bản hòa âm ngôn từ” của “Tiếng thu” (theo Chu Văn Sơn) là gì?", "options": ["A. Sự phối hợp thanh bằng – trắc và từ ngữ giàu nhạc tính, gợi tiếng thu xao xác", "B. Bài thơ được viết bằng chữ Hán", "C. Bài thơ chỉ dùng toàn từ láy", "D. Bài thơ không hề gieo vần"], "answer": "A", "explain": "Chu Văn Sơn phát hiện: Lưu Trọng Lư phối hợp thanh điệu và từ ngữ như phối nhạc, tạo nên “bản hòa âm” man mác của mùa thu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi phân tích một bài thơ, cần tránh cách làm nào?", "options": ["A. Đánh giá nghệ thuật của bài thơ", "B. Nêu chủ đề, thông điệp", "C. Phân tích hình ảnh, từ ngữ", "D. Chỉ nêu cảm xúc chung chung mà không phân tích hình ảnh, ngôn từ cụ thể"], "answer": "D", "explain": "Phân tích thơ phải bám vào hình ảnh, từ ngữ, nhạc tính cụ thể; chỉ nói cảm xúc chung chung là cách làm sai.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Nêu tên một tác giả thơ hai-cư Nhật Bản được học trong bài.", "answer": "Ba-sô", "explain": "Ma-tsu-ô Ba-sô là tác giả hai-cư tiêu biểu nhất được giới thiệu trong chùm thơ hai-cư Nhật Bản.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trong “Thu hứng”, Đỗ Phủ đang sống lưu lạc ở vùng nào của Trung Quốc?", "answer": "Quỳ Châu", "explain": "Năm 766, Đỗ Phủ lưu lạc ở Quỳ Châu (nay thuộc Trùng Khánh) — nơi ông sáng tác chùm “Thu hứng”.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cách ngắt nhịp trong thơ (ví dụ nhịp 4/3 trong thơ thất ngôn) có tác dụng gì?", "answer": "tạo nhạc điệu", "explain": "Ngắt nhịp tạo nhạc điệu cho câu thơ, đồng thời nhấn mạnh ý nghĩa, tạo điểm dừng cảm xúc cho người đọc.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích “bản hòa âm ngôn từ” trong bài thơ “Tiếng thu” của Lưu Trọng Lư.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu “Tiếng thu” và nhận xét “bản hòa âm ngôn từ” của Chu Văn Sơn. 2) Thân đoạn: phân tích — thanh bằng gợi êm đềm, thanh trắc gợi xao xác; từ ngữ được chọn lọc như nốt nhạc; âm thanh hòa với nỗi buồn man mác; nghệ thuật phối âm của nhà thơ. 3) Kết đoạn: khẳng định vẻ đẹp ngôn từ; liên hệ (đọc thơ phải lắng nghe). BÀI MẪU: “Bản hòa âm ngôn từ” là nhận xét tinh tế của Chu Văn Sơn về bài thơ “Tiếng thu” của Lưu Trọng Lư. Đọc bài thơ, ta như được nghe một bản nhạc thu man mác: những thanh bằng trải dài, êm đềm gợi không gian thu tĩnh lặng, mênh mang; những thanh trắc điểm xuyết, gấp gáp gợi tiếng lá rơi xao xác, tiếng lòng thổn thức. Từ ngữ trong bài được chọn lọc kĩ lưỡng như những nốt nhạc: mỗi chữ vừa có nghĩa vừa có nhạc, vừa gợi hình vừa gợi thanh. Điều tài tình là “bản hòa âm” ấy không khô khan mà thấm đẫm cảm xúc: âm thanh man mác hòa quyện với nỗi buồn bâng khuâng của thi sĩ trước mùa thu — nghe tiếng thu mà thấy lòng mình xao động. Lưu Trọng Lư đã chứng tỏ mình là bậc thầy của ngôn từ: “chơi” với chữ mà như chơi nhạc. Qua phân tích của Chu Văn Sơn, em hiểu ra: vẻ đẹp của thơ ca trước hết nằm ở ngôn từ, và thưởng thức thơ phải dùng cả tai để nghe, cả tim để cảm. Bài học ấy khiến em đọc thơ chăm chú hơn, biết lắng nghe nhạc điệu ẩn trong từng con chữ.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích, đánh giá một bài thơ hai-cư Nhật Bản mà em yêu thích (trong chùm thơ đã học).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu thơ hai-cư và bài thơ em chọn; nêu vấn đề: phân tích, đánh giá. 2) Thân bài: a) Khái quát: hoàn cảnh, nội dung khoảnh khắc. b) Phân tích: bức tranh thiên nhiên (hình ảnh, âm thanh); cảm xúc gợi ra; triết lí bừng sáng; nghệ thuật hàm súc (17 âm tiết, khoảng lặng). c) Đánh giá: vẻ đẹp độc đáo, giá trị triết lí, sức gợi lâu bền. 3) Kết bài: khẳng định giá trị hai-cư; cảm nghĩ, liên hệ. BÀI MẪU: Trong chùm thơ hai-cư Nhật Bản, bài thơ để lại ấn tượng sâu đậm nhất trong em là bài tả con quạ đậu trên cành khô vào buổi chiều thu của Ba-sô. Bài thơ chỉ vỏn vẹn mười bảy âm tiết mà dựng lên cả một thế giới: cánh đồng chiều thu vắng lặng, cành cây khẳng khiu trơ trọi in trên nền trời xám, con quạ đậu im lìm, thỉnh thoảng cất tiếng kêu khản đặc. Nghệ thuật hàm súc đạt tới đỉnh cao: không một tính từ tô vẽ, không một lời bình luận, nhà thơ chỉ “ghi” lại khoảnh khắc như một nhiếp ảnh gia bằng ngôn từ. Vậy mà khoảng lặng sau bài thơ mênh mông biết bao: người đọc nghe ra nỗi cô đơn của kiếp người, thấm thía triết lí vô thường — mọi vẻ rực rỡ rồi cũng tàn, chỉ còn sự tĩnh tại là vĩnh hằng. Đồng thời, bài thơ cũng gợi một vẻ đẹp khác: sự hòa hợp tuyệt đối giữa con người và thiên nhiên, khi nhà thơ lặng ngắm mà không can thiệp, trân trọng khoảnh khắc như nó vốn có. So với những bài thơ dài dằng dặc, hai-cư chọn cách nói ít nhất để gợi nhiều nhất — đó là bản lĩnh của bậc thầy. Bài thơ dạy em bài học về cách sống: hãy biết dừng lại, quan sát và suy ngẫm; hãy trân trọng từng khoảnh khắc hiện tại, bởi triết lí cuộc đời luôn ẩn trong những điều giản dị nhất. Vẻ đẹp “ít mà nhiều” của hai-cư sẽ còn ám ảnh em mãi.", "points": 0}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "“Tiếng thu” là sáng tác của nhà thơ nào?", "options": ["A. Lưu Trọng Lư", "B. Nguyễn Du", "C. Hàn Mặc Tử", "D. Đỗ Phủ"], "answer": "A", "explain": "Lưu Trọng Lư — nhà thơ Thơ mới — là tác giả bài thơ “Tiếng thu” man mác buồn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phong trào Thơ mới (1932 – 1945) có đặc điểm gì?", "options": ["A. Viết bằng chữ Hán", "B. Gò bó chặt chẽ theo niêm luật", "C. Giải phóng cảm xúc cá nhân, hình ảnh mới mẻ, nhạc điệu phong phú", "D. Chỉ viết về đề tài chiến tranh"], "answer": "C", "explain": "Thơ mới đã giải phóng thơ ca khỏi niêm luật gò bó, đề cao cảm xúc cá nhân với hình ảnh mới mẻ, nhạc điệu phong phú.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ nào sau đây là từ Hán Việt?", "options": ["A. Mái chèo", "B. Thi thánh", "C. Bến nước", "D. Con đò"], "answer": "B", "explain": "“Thi thánh” (thánh thơ — danh hiệu của Đỗ Phủ) là từ Hán Việt; các từ còn lại là từ thuần Việt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vẻ đẹp của mùa thu trong “Thu hứng” gắn liền với tâm trạng nào của Đỗ Phủ?", "options": ["A. Niềm hân hoan chiến thắng", "B. Niềm vui sum họp gia đình", "C. Sự thờ ơ, lạnh nhạt", "D. Nỗi buồn xa quê, nỗi lo cho vận nước"], "answer": "D", "explain": "Mùa thu trong “Thu hứng” nhuốm nỗi buồn xa quê và nỗi lo vận nước — cảnh tình hòa quyện, tả cảnh ngụ tình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong văn bản nghị luận của Chu Văn Sơn, đối tượng phân tích chính là gì?", "options": ["A. Lịch sử phát triển của thơ ca", "B. Vẻ đẹp ngôn từ, nhạc tính trong bài thơ “Tiếng thu”", "C. Cách in ấn, xuất bản thơ", "D. Cuộc đời của Lưu Trọng Lư"], "answer": "B", "explain": "Chu Văn Sơn tập trung phân tích “bản hòa âm ngôn từ” — vẻ đẹp thanh điệu, từ ngữ, nhạc tính trong “Tiếng thu”.", "points": 0.25}, {"type": "short", "level": "TH", "q": "“Thu hứng” là chùm thơ gồm 8 bài; bài thơ được học trong SGK là bài số mấy?", "answer": "1", "explain": "Bài được học là bài số 1 trong chùm 8 bài “Thu hứng” — bài hay nhất, tiêu biểu nhất.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu một lỗi dùng từ thường gặp khi viết văn (ngoài lỗi sai chính tả).", "answer": "dùng từ không đúng nghĩa", "explain": "Lỗi dùng từ thường gặp: dùng từ không đúng nghĩa, sai phong cách, lặp từ, dùng từ thừa.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong thơ hai-cư, khoảnh khắc thiên nhiên được ghi lại chân thực rồi bừng sáng một triết lí; lối kết cấu “tả thực rồi ngộ ra” này thể hiện tính … của thơ.", "answer": "triết lí", "explain": "Tính triết lí: từ cái cụ thể, hữu hạn gợi ra lẽ đời phổ quát — nét sâu xa của hai-cư và thơ trữ tình.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu cảm nhận của em về vẻ đẹp mùa thu trong bài thơ “Thu hứng” của Đỗ Phủ.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu “Thu hứng” và bức tranh thu tiêu điều. 2) Thân đoạn: cảm nhận — cảnh thu ảm đạm (rừng phong, sông, mây) qua hình ảnh đối lập; cảnh nhuốm tâm trạng (tả cảnh ngụ tình); vẻ đẹp vừa hiện thực vừa thấm đẫm nỗi buồn nhớ quê, lo đời; nghệ thuật Đường luật làm tăng vẻ trang trọng, sâu lắng. 3) Kết đoạn: khẳng định mùa thu trong thơ Đỗ Phủ đẹp vì giàu tâm trạng; cảm nghĩ. BÀI MẪU: Mùa thu trong “Thu hứng” của Đỗ Phủ là một mùa thu đẹp mà buồn đến nao lòng. Đó không phải mùa thu rực rỡ của lá vàng mà là mùa thu tiêu điều, ảm đạm: rừng phong nhuốm màu thu xơ xác, dòng sông cuộn chảy lạnh lẽo, mây trời xám xịt giăng mắc. Cảnh vật hiện lên qua những hình ảnh đối lập, tương phản đầy ấn tượng, được tổ chức chặt chẽ theo niêm luật Đường. Điều khiến bức tranh thu trở nên đặc biệt là nó nhuốm đầy tâm trạng nhà thơ — thủ pháp tả cảnh ngụ tình bậc thầy: cảnh càng tiêu điều, nỗi buồn càng sâu. Nhìn rừng phong mà nhớ quê hương xa xôi, nhìn dòng sông mà lo cho vận nước đảo điên. Mùa thu vì thế không chỉ là cảnh thực mà là tấm gương phản chiếu tâm hồn kẻ sĩ trước thời loạn. Vẻ đẹp của mùa thu trong “Thu hứng” là vẻ đẹp của sự hòa quyện giữa cảnh và tình, giữa hiện thực và tâm trạng. Đọc thơ, em thấm thía: thiên nhiên đẹp nhất khi nó nói được tiếng lòng con người, và thơ hay là thơ khiến cảnh vật cũng biết buồn, biết nhớ cùng ta.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ so sánh cảm hứng mùa thu trong “Thu hứng” (Đỗ Phủ) và “Tiếng thu” (Lưu Trọng Lư).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu hai bài thơ, hai thời đại; nêu vấn đề: so sánh cảm hứng mùa thu. 2) Thân bài: a) Điểm giống: đều lấy mùa thu làm nguồn cảm hứng; đều mượn thu để gửi tâm trạng (cảnh – tình hòa quyện); đều buồn man mác. b) Điểm khác: “Thu hứng” — thu hùng vĩ, tiêu điều, nỗi buồn lớn gắn với thời cuộc (nhớ quê, lo đời), giọng trầm hùng, thể Đường luật; “Tiếng thu” — thu nhẹ nhàng, man mác, nỗi buồn cá nhân, tinh tế (nghe tiếng thu), giọng nhẹ nhàng, thơ tự do. c) Lí giải: khác nhau do thời đại, hoàn cảnh, phong cách (hiện thực hào sảng – lãng mạn tinh tế). d) Đánh giá: cả hai đều là kiệt tác về mùa thu. 3) Kết bài: khẳng định vẻ đẹp đa dạng của cảm hứng thu; cảm nghĩ. BÀI MẪU: Mùa thu là nguồn cảm hứng muôn thuở của thơ ca, và “Thu hứng” của Đỗ Phủ cùng “Tiếng thu” của Lưu Trọng Lư là hai kiệt tác tiêu biểu, cách nhau hơn nghìn năm mà cùng ngân lên nỗi buồn thu. Điểm gặp gỡ đầu tiên là cả hai đều lấy mùa thu làm đối tượng trữ tình và đều mượn thu để gửi tâm trạng — nghệ thuật tả cảnh ngụ tình. Nỗi buồn man mác trước sự tàn phai, vô thường là sợi dây nối hai tâm hồn thi sĩ. Tuy nhiên, cảm hứng thu ở hai bài thơ có sắc thái rất khác nhau. “Thu hứng” là mùa thu hùng vĩ, tiêu điều: rừng phong, sông dài, mây cao — cảnh lớn, buồn lớn. Nỗi buồn của Đỗ Phủ không chỉ là nỗi buồn cá nhân mà là nỗi buồn thời đại: nhớ quê hương, lo cho vận nước đang loạn lạc; giọng thơ trầm hùng, được đúc trong khuôn vàng thước ngọc của thơ Đường luật. Ngược lại, “Tiếng thu” là mùa thu nhẹ nhàng, man mác: thi sĩ không nhìn mà “nghe” tiếng thu xao xác — nỗi buồn tinh tế, mơ hồ, rất Thơ mới; giọng thơ nhẹ nhàng, thủ thỉ qua thể thơ tự do phóng khoáng. Sự khác biệt bắt nguồn từ thời đại và phong cách: Đỗ Phủ — nhà thơ hiện thực vĩ đại, thơ gắn với vận nước; Lưu Trọng Lư — nhà thơ lãng mạn, thơ là tiếng lòng cá nhân. Dù khác nhau, cả hai bài thơ đều chứng minh: mùa thu là tấm gương trung thực nhất của tâm hồn thi sĩ, và thơ hay là thơ khiến mỗi mùa thu đều mang một nỗi niềm riêng. Đọc hai bài thơ, em càng yêu thêm mùa thu — mùa của suy tư, của những cảm xúc đẹp đẽ nhất trong lòng người.", "points": 0}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Lỗi về trật tự từ trong câu là gì?", "options": ["A. Viết câu văn quá dài", "B. Sắp xếp từ ngữ sai vị trí, gây khó hiểu, tối nghĩa", "C. Dùng quá nhiều từ Hán Việt", "D. Viết chữ quá nhỏ, khó đọc"], "answer": "B", "explain": "Trật tự từ tiếng Việt có quy tắc riêng; sắp xếp sai vị trí gây khó hiểu, tối nghĩa — cần sắp xếp lại cho mạch lạc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài thơ “Mùa xuân chín” được viết theo thể thơ nào?", "options": ["A. Hai-cư", "B. Thơ tự do (thơ mới)", "C. Thất ngôn bát cú Đường luật", "D. Lục bát"], "answer": "B", "explain": "“Mùa xuân chín” viết theo thể thơ tự do phóng khoáng của phong trào Thơ mới — không gò bó niêm luật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhà thơ Đỗ Phủ sống ở thời đại nào của Trung Quốc?", "options": ["A. Đời Thanh", "B. Đời Minh", "C. Đời Đường", "D. Đời Tống"], "answer": "C", "explain": "Đỗ Phủ (712 – 770) sống đời Đường — thời đại hoàng kim của thơ ca Trung Quốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tính hàm súc của thơ hai-cư thể hiện ở điểm nào?", "options": ["A. Dùng càng nhiều chữ càng tốt", "B. Lặp đi lặp lại một ý", "C. Viết dài dòng, giải thích cặn kẽ", "D. Ít chữ mà gợi nhiều: một khoảnh khắc nhỏ mở ra triết lí lớn"], "answer": "D", "explain": "Hàm súc là “lấy ít gợi nhiều”: 17 âm tiết mà gợi cả bức tranh và triết lí — càng ít lời, dư ba càng lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi chữa lỗi dùng từ, việc đầu tiên cần làm là gì?", "options": ["A. Thêm thật nhiều từ mới vào câu", "B. Xóa bỏ cả câu văn", "C. Xác định từ dùng sai (sai nghĩa, sai phong cách, thừa, lặp) rồi thay bằng từ đúng", "D. Viết lại câu bằng tiếng Anh"], "answer": "C", "explain": "Muốn chữa lỗi phải xác định đúng từ mắc lỗi và dạng lỗi, rồi thay bằng từ đúng nghĩa, hợp phong cách.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Thơ hai-cư gồm mấy câu, bao nhiêu âm tiết?", "answer": "3 câu 17 âm tiết", "explain": "Hai-cư: 3 câu, 17 âm tiết theo cấu trúc 5-7-5 — thể thơ ngắn nhất thế giới.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Theo Chu Văn Sơn, yếu tố nào làm nên “bản hòa âm” đặc biệt trong bài thơ “Tiếng thu”?", "answer": "ngôn từ", "explain": "Chu Văn Sơn cho rằng vẻ đẹp của “Tiếng thu” nằm ở ngôn từ: sự phối hợp thanh điệu, từ ngữ giàu nhạc tính.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ngôn ngữ thơ có khả năng gợi nhiều hơn nói, mỗi chữ mở ra nhiều liên tưởng; đặc tính này của thơ được gọi là tính …", "answer": "gợi cảm", "explain": "Tính gợi cảm: ngôn ngữ thơ gợi ra nhiều cảm xúc, liên tưởng hơn là kể lể trực tiếp — “ý tại ngôn ngoại”.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích tính hàm súc trong thơ hai-cư Nhật Bản (qua một bài thơ cụ thể).", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu tính hàm súc — đặc trưng nổi bật của hai-cư. 2) Thân đoạn: phân tích qua bài cụ thể — chỉ 17 âm tiết mà dựng được bức tranh (hình ảnh, âm thanh); không lời bình mà gợi triết lí; khoảng lặng sau bài thơ; so sánh với thơ dài để thấy “ít mà nhiều”. 3) Kết đoạn: khẳng định hàm súc là đỉnh cao nghệ thuật; bài học (viết cô đọng). BÀI MẪU: Tính hàm súc là đỉnh cao nghệ thuật của thơ hai-cư Nhật Bản, thể hiện rõ qua bài thơ tả con quạ đậu trên cành khô chiều thu của Ba-sô. Chỉ mười bảy âm tiết ngắn ngủi, nhà thơ không hề bình luận, không dùng một tính từ tô vẽ, mà chỉ “ghi” lại khoảnh khắc: cành khô, chiều thu, con quạ đậu im. Vậy mà người đọc thấy hiện ra cả một bức tranh: cánh đồng vắng, nền trời xám, tiếng quạ kêu khản đặc giữa tĩnh lặng. Và đằng sau bức tranh là cả một khoảng lặng mênh mông để suy ngẫm về sự vô thường, cô đơn, về vẻ đẹp của tĩnh tại. Một bài thơ dài có thể kể lể hàng trăm chữ mà chưa chắc gợi được nhiều đến thế; hai-cư chỉ cần mười bảy âm tiết mà dư ba vô tận. Đó chính là “lấy ít gợi nhiều”: càng ít lời, sức gợi càng lớn, bởi những điều không nói ra lại là những điều sâu sắc nhất. Tính hàm súc dạy em bài học quý trong viết văn: đừng tham chữ, hãy chọn chữ đắt nhất; đừng nói hết, hãy để người đọc cùng suy ngẫm. Viết cô đọng mà giàu sức gợi — đó là đích đến của mọi người cầm bút.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích bài thơ “Tiếng thu” của Lưu Trọng Lư (nỗi buồn thu và “bản hòa âm ngôn từ”).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu Lưu Trọng Lư (Thơ mới) và “Tiếng thu”; nêu vấn đề: nỗi buồn thu và vẻ đẹp ngôn từ. 2) Thân bài: a) Khái quát: mạch cảm xúc (từ nghe tiếng thu đến bâng khuâng). b) Nỗi buồn thu: man mác, mơ hồ, tinh tế — nỗi buồn rất Thơ mới (không bi lụy mà thấm thía); gắn với cảm nhận tinh tế về sự chuyển mùa. c) “Bản hòa âm ngôn từ”: thanh bằng – trắc, từ ngữ giàu nhạc tính (theo Chu Văn Sơn); âm thanh chở cảm xúc. d) Nghệ thuật: thơ tự do, hình ảnh gợi cảm, giọng nhẹ nhàng. 3) Kết bài: khẳng định vị trí bài thơ; cảm nghĩ. BÀI MẪU: Lưu Trọng Lư là nhà thơ của những vần thơ thu man mác, và “Tiếng thu” là bài thơ tiêu biểu nhất cho phong cách ấy. Khác với Đỗ Phủ “nhìn” thu bằng mắt, Lưu Trọng Lư “nghe” thu bằng tai: tiếng thu xao xác trong lá rơi, trong gió nhẹ — một cách cảm nhận rất tinh tế, rất Thơ mới. Nỗi buồn trong “Tiếng thu” không ồn ào, không bi lụy mà man mác, mơ hồ như sương khói: buồn vì thu tàn, vì thời gian trôi, vì những điều đẹp đẽ mong manh. Đó là nỗi buồn của tâm hồn nhạy cảm trước sự vô thường — buồn mà đẹp, buồn mà thấm. Điều làm nên sức sống lâu bền của bài thơ, như Chu Văn Sơn đã tinh tế phát hiện, là “bản hòa âm ngôn từ”: nhà thơ phối hợp thanh bằng êm đềm với thanh trắc xao xác, chọn lọc từ ngữ giàu nhạc tính như chọn nốt nhạc, dệt nên một bản nhạc thu buồn nhẹ mà ám ảnh. Âm thanh và cảm xúc hòa quyện: nghe tiếng thu mà lòng bâng khuâng — “ý tại ngôn ngoại”, cái không nói ra lại là cái sâu nhất. Về nghệ thuật, bài thơ thành công với thể thơ tự do phóng khoáng, hình ảnh gợi cảm, giọng điệu nhẹ nhàng thủ thỉ như lời tâm sự. “Tiếng thu” chứng minh: thơ hay không cần ồn ào; chỉ cần một tiếng lá rơi xao xác cũng đủ làm xao động lòng người. Đọc bài thơ, em học được cách lắng nghe cuộc sống bằng tâm hồn tinh tế — bởi cái đẹp thường đến rất khẽ khàng.", "points": 0}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Đọc hiểu một bài thơ nên bắt đầu từ việc nào?", "options": ["A. Vẽ tranh minh họa", "B. Đếm số chữ trong bài", "C. Đọc diễn cảm, xác định thể thơ, nêu cảm nhận ban đầu", "D. Học thuộc lòng phần chú thích"], "answer": "C", "explain": "Bước đầu của đọc hiểu thơ: đọc diễn cảm nhiều lần, xác định thể thơ và cảm nhận ban đầu về cảm xúc chủ đạo.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ “thu hứng” thuộc loại từ nào?", "options": ["A. Từ láy", "B. Khẩu ngữ", "C. Từ thuần Việt", "D. Từ Hán Việt"], "answer": "D", "explain": "“Thu hứng” là từ Hán Việt (“thu”: mùa thu, “hứng”: cảm xúc), mang sắc thái trang trọng, cổ kính.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài thơ “Tiếng thu” gợi cảm xúc chủ đạo nào?", "options": ["A. Vui tươi, rộn ràng", "B. Giận dữ, căm phẫn", "C. Hài hước, dí dỏm", "D. Buồn man mác, bâng khuâng trước mùa thu"], "answer": "D", "explain": "“Tiếng thu” thấm đẫm nỗi buồn man mác, bâng khuâng — cảm xúc đặc trưng của thơ Lưu Trọng Lư.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao “Mùa xuân chín” được coi là bài thơ tiêu biểu của Hàn Mặc Tử?", "options": ["A. Vì thể hiện tình yêu đời tha thiết, khát khao giao cảm qua bức tranh xuân trong trẻo", "B. Vì bài thơ rất khó hiểu", "C. Vì viết về mùa đông giá rét", "D. Vì đây là bài thơ dài nhất của ông"], "answer": "A", "explain": "“Mùa xuân chín” kết tinh phong cách Hàn Mặc Tử: yêu đời tha thiết, khát khao giao cảm, vừa say sưa vừa man mác buồn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhan đề “Mùa xuân chín” gợi cho em liên tưởng gì?", "options": ["A. Mùa xuân đã vào độ rực rỡ nhất, căng tràn sức sống", "B. Quả chín để hái ăn", "C. Mùa xuân đã qua từ lâu", "D. Món ăn ngày xuân"], "answer": "A", "explain": "“Chín” gợi độ rực rỡ, viên mãn: mùa xuân căng tràn sức sống như trái chín mọng — một cách nói đầy sáng tạo.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Nêu tên phong trào thơ ca mà Hàn Mặc Tử, Lưu Trọng Lư là những nhà thơ tiêu biểu.", "answer": "Thơ mới", "explain": "Phong trào Thơ mới lãng mạn (1932 – 1945) với các nhà thơ tiêu biểu: Hàn Mặc Tử, Lưu Trọng Lư, Xuân Diệu, Huy Cận…", "points": 0.5}, {"type": "short", "level": "VD", "q": "“Thu hứng” thể hiện nỗi … quê hương và nỗi lo cho vận nước của Đỗ Phủ.", "answer": "nhớ", "explain": "Xa quê giữa thời loạn, Đỗ Phủ dồn nén nỗi nhớ quê hương và nỗi lo cho vận nước vào chùm “Thu hứng”.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong thơ Đường luật, phép đặt hai câu sóng đôi nhau về ý và lời (câu 3 với câu 4, câu 5 với câu 6) được gọi là phép …", "answer": "đối", "explain": "Phép đối là quy tắc bắt buộc của thơ Đường luật: cặp thực và cặp luận phải đối nhau cả ý lẫn lời.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích giọng điệu trong bài thơ “Mùa xuân chín” của Hàn Mặc Tử.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu giọng điệu đặc biệt của “Mùa xuân chín”. 2) Thân đoạn: phân tích — giọng say sưa, đắm chìm trước vẻ đẹp xuân (từ ngữ, nhịp điệu rộn ràng); xen lẫn giọng bâng khuâng, man mác (dự cảm mong manh); sự hòa quyện tạo nên giọng điệu riêng: vui mà không ồn ào, buồn mà không bi lụy. 3) Kết đoạn: khẳng định giọng điệu làm nên hồn thơ; cảm nghĩ. BÀI MẪU: Giọng điệu trong “Mùa xuân chín” của Hàn Mặc Tử là một giọng điệu rất riêng: say sưa mà bâng khuâng, rộn ràng mà man mác. Say sưa ở chỗ thi sĩ đắm chìm hoàn toàn trong vẻ đẹp mùa xuân: từ ngữ óng ả như nắng, nhịp thơ rộn ràng như bước chân xuân, mỗi câu thơ như một tiếng reo vui trước thiên nhiên căng tràn sức sống. Đọc thơ, ta nghe ra niềm hân hoan của người đang yêu đời tha thiết. Nhưng xen trong niềm say sưa là một giọng bâng khuâng khó tả: như thể thi sĩ vừa vui vừa sợ niềm vui vụt tắt, vừa đón xuân vừa thấp thỏm xuân qua mau. Dự cảm mong manh ấy không làm bài thơ bi lụy mà khiến niềm vui thêm thấm thía, sâu lắng. Sự hòa quyện giữa say sưa và bâng khuâng tạo nên giọng điệu độc đáo: vui mà không ồn ào, buồn mà không yếu đuối — đúng là giọng của Hàn Mặc Tử, của một tâm hồn từng đau khổ nên càng biết nâng niu hạnh phúc. Giọng điệu ấy là linh hồn của bài thơ, khiến “Mùa xuân chín” không chỉ đẹp mà còn ám ảnh, để lại dư ba lâu bền trong lòng người đọc.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích vẻ đẹp tâm hồn Hàn Mặc Tử qua bài thơ “Mùa xuân chín”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu Hàn Mặc Tử và “Mùa xuân chín”; nêu vấn đề: vẻ đẹp tâm hồn thi sĩ. 2) Thân bài: a) Tâm hồn yêu đời tha thiết: say sưa trước vẻ đẹp xuân (dẫn chứng hình ảnh). b) Tâm hồn khát khao giao cảm: muốn hòa nhập, sẻ chia với đời. c) Tâm hồn nhạy cảm, tinh tế: dự cảm mong manh, nỗi buồn man mác — chiều sâu. d) Nghệ thuật: hình ảnh tươi mới, ngôn ngữ óng ả, nhạc điệu, giọng điệu. e) Đánh giá: vẻ đẹp tâm hồn vượt lên số phận đau khổ. 3) Kết bài: khẳng định; bài học (yêu đời, vượt khó). BÀI MẪU: Đằng sau bức tranh mùa xuân rực rỡ trong “Mùa xuân chín” là một tâm hồn đẹp đến nao lòng của Hàn Mặc Tử. Trước hết, đó là tâm hồn yêu đời tha thiết: giữa những năm tháng đau bệnh, thi sĩ vẫn say sưa trước vẻ đẹp của nắng, của cỏ, của sóng — tình yêu đời mãnh liệt đến mức biến đau khổ thành thơ ca. Thứ hai, đó là tâm hồn khát khao giao cảm: ông không ngắm xuân một mình mà muốn sẻ chia niềm vui với “khách xa”, với mọi người — khát vọng của kẻ từng cô đơn muốn được hòa nhập với đời. Thứ ba, đó là tâm hồn nhạy cảm, tinh tế đến mong manh: bên cạnh niềm vui là dự cảm về sự ngắn ngủi, khiến mỗi vẻ đẹp đều thấm thía hơn. Ba nét ấy hòa quyện làm nên một tâm hồn vừa mạnh mẽ vừa yếu mềm, vừa say đời vừa ám ảnh — rất Hàn Mặc Tử. Điều khiến ta cảm phục nhất: một con người chịu nhiều đau khổ vẫn giữ được tâm hồn trong trẻo, vẫn hát ca về mùa xuân. “Mùa xuân chín” vì thế không chỉ là bài thơ về mùa xuân mà là bằng chứng về sức mạnh của tâm hồn: hoàn cảnh có thể tàn phá thân xác nhưng không thể đánh gục tình yêu đời. Đọc thơ, em rút ra bài học lớn: hãy sống lạc quan, yêu đời dù gặp khó khăn; hãy giữ cho tâm hồn mãi “chín” như mùa xuân — rực rỡ và căng tràn sức sống.", "points": 0}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Mở bài của văn bản nghị luận phân tích một bài thơ cần làm gì?", "options": ["A. Chép lại toàn bộ bài thơ", "B. Kể dài dòng về cuộc đời nhà thơ", "C. Giới thiệu tác giả, tác phẩm và nêu vấn đề nghị luận", "D. Viết lời kết luận ngay"], "answer": "C", "explain": "Mở bài giới thiệu tác giả, bài thơ và nêu rõ vấn đề nghị luận (phân tích, đánh giá khía cạnh nào).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dòng nào gồm toàn đặc trưng của thơ trữ tình?", "options": ["A. Cảm xúc, hình ảnh, nhạc tính", "B. Tự sự, kể chuyện, cốt truyện", "C. Số liệu, biểu đồ, bảng biểu", "D. Đối thoại kịch, sân khấu"], "answer": "A", "explain": "Thơ trữ tình là tiếng nói của cảm xúc, được thể hiện qua hình ảnh và nhạc tính — khác với tự sự hay kịch.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Văn bản “Bản hòa âm ngôn từ trong Tiếng thu của Lưu Trọng Lư” là sáng tác của ai?", "options": ["A. Ma-tsu-ô Ba-sô", "B. Lưu Trọng Lư", "C. Chu Văn Sơn", "D. Đỗ Phủ"], "answer": "C", "explain": "Chu Văn Sơn là tác giả văn bản nghị luận phân tích vẻ đẹp ngôn từ trong “Tiếng thu” của Lưu Trọng Lư.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung của các văn bản thơ trong Bài 2 (hai-cư, Thu hứng, Mùa xuân chín) là gì?", "options": ["A. Đều viết về mùa thu", "B. Đều là thơ trữ tình, lấy thiên nhiên để bộc lộ tâm trạng con người", "C. Đều của tác giả Việt Nam", "D. Đều là thơ Đường luật"], "answer": "B", "explain": "Dù khác thể loại, thời đại, cả ba đều là thơ trữ tình: mượn thiên nhiên để nói tâm trạng — cảnh tình hòa quyện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi nói và nghe (giới thiệu một tác phẩm thơ), cần chú ý điều gì?", "options": ["A. Nêu nội dung chính, điểm đặc sắc nghệ thuật và cảm nhận bản thân; trình bày mạch lạc, có trích dẫn ngắn", "B. Chỉ đọc thơ, không bình luận gì", "C. Nói càng nhanh càng tốt", "D. Đọc thuộc cả bài thơ rồi thôi"], "answer": "A", "explain": "Giới thiệu thơ cần: đọc diễn cảm trích đoạn, nêu nội dung, điểm đặc sắc nghệ thuật và cảm nhận cá nhân một cách mạch lạc, truyền cảm.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Nêu tên tác giả bài thơ “Tiếng thu”.", "answer": "Lưu Trọng Lư", "explain": "Lưu Trọng Lư — nhà thơ Thơ mới — là tác giả bài thơ “Tiếng thu” man mác buồn.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Thơ ca có vai trò quan trọng trong đời sống tinh thần con người vì thơ giúp …", "answer": "bồi đắp tâm hồn", "explain": "Thơ ca bồi đắp tâm hồn: nuôi dưỡng cảm xúc, làm phong phú đời sống tinh thần, dạy ta yêu cái đẹp.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thơ Đỗ Phủ được mệnh danh là “thi sử” vì đã phản ánh chân thực … đương thời.", "answer": "hiện thực xã hội", "explain": "“Thi sử” (sử bằng thơ): thơ Đỗ Phủ phản ánh chân thực hiện thực xã hội loạn lạc đời Đường — giá trị hiện thực sâu sắc.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày suy nghĩ của em về vai trò của thơ ca trong đời sống tinh thần con người.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: nêu vấn đề — thơ ca có vai trò gì trong đời sống hiện đại. 2) Thân đoạn: suy nghĩ — thơ bồi đắp tâm hồn (nuôi dưỡng cảm xúc, tình yêu cái đẹp); thơ là tiếng nói tri âm (chia sẻ nỗi niềm); thơ lưu giữ văn hóa, lịch sử; dẫn chứng (hai-cư dạy sống chậm, Thu hứng dạy yêu nước, Mùa xuân chín dạy yêu đời). Phê phán lối sống thờ ơ với thơ ca. 3) Kết đoạn: khẳng định vai trò không thể thay thế; kêu gọi đọc thơ. BÀI MẪU: Trong đời sống hiện đại vội vã, thơ ca vẫn giữ một vai trò không thể thay thế đối với tâm hồn con người. Trước hết, thơ bồi đắp tâm hồn: những vần thơ đẹp nuôi dưỡng cảm xúc, dạy ta biết rung động trước cái đẹp — như hai-cư dạy ta trân trọng từng khoảnh khắc, “Mùa xuân chín” dạy ta yêu đời tha thiết. Thứ hai, thơ là tiếng nói tri âm: khi buồn, ta tìm thấy mình trong nỗi buồn thu của Đỗ Phủ; khi vui, ta hòa vào niềm say sưa của Hàn Mặc Tử — thơ chia sẻ, an ủi những nỗi niềm khó nói thành lời. Thứ ba, thơ lưu giữ văn hóa và lịch sử: mỗi bài thơ là một lát cắt thời đại, một di sản tinh thần của dân tộc. Đáng buồn là nhiều bạn trẻ hôm nay thờ ơ với thơ ca, coi thơ là “khô khan”, “lỗi thời” — đó là một thiệt thòi lớn, bởi bỏ qua thơ là bỏ qua một cách làm giàu tâm hồn. Thơ ca không nuôi sống thể xác nhưng nuôi dưỡng tâm hồn; một xã hội thiếu thơ ca là một xã hội khô cằn cảm xúc. Vì thế, hãy dành thời gian đọc thơ mỗi ngày — để tâm hồn mãi được tưới tắm bởi những vần thơ đẹp.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ bàn về vẻ đẹp của thơ ca qua các tác phẩm đã học trong Bài 2 (hai-cư, “Thu hứng”, “Mùa xuân chín”, “Tiếng thu”).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: nêu vấn đề — vẻ đẹp đa dạng của thơ ca qua bốn văn bản bốn phong cách. 2) Thân bài: a) Vẻ đẹp của sự hàm súc (hai-cư: ít lời nhiều ý, triết lí). b) Vẻ đẹp của sự chuẩn mực, trầm hùng (“Thu hứng”: Đường luật, nỗi buồn thời đại). c) Vẻ đẹp của sự phóng khoáng, say sưa (“Mùa xuân chín”: thơ mới, tình yêu đời). d) Vẻ đẹp của ngôn từ, nhạc tính (“Tiếng thu” qua Chu Văn Sơn). e) Điểm chung: đều lấy thiên nhiên nói tâm trạng; đều bồi đắp tâm hồn. 3) Kết bài: khẳng định thơ ca là tài sản tinh thần; kêu gọi yêu thơ, đọc thơ. BÀI MẪU: Bài 2 đã đưa ta đi qua bốn thế giới thơ ca khác nhau, mỗi thế giới một vẻ đẹp riêng mà chung một linh hồn: thơ là tiếng nói của tâm hồn. Vẻ đẹp đầu tiên là vẻ đẹp của sự hàm súc trong thơ hai-cư Nhật Bản: chỉ mười bảy âm tiết mà gợi cả bức tranh thiên nhiên và triết lí nhân sinh — “ít mà nhiều”, im lặng mà sâu sắc. Vẻ đẹp thứ hai là vẻ đẹp của sự chuẩn mực, trầm hùng trong “Thu hứng” của Đỗ Phủ: thơ Đường luật với niêm luật chặt chẽ, hình ảnh đối lập, nỗi buồn mang tầm vóc thời đại — đẹp một cách trang trọng, cổ điển. Vẻ đẹp thứ ba là vẻ đẹp của sự phóng khoáng, say sưa trong “Mùa xuân chín” của Hàn Mặc Tử: thơ tự do với hình ảnh tươi mới, nhạc điệu du dương, tình yêu đời tha thiết — đẹp một cách rực rỡ, hiện đại. Vẻ đẹp thứ tư là vẻ đẹp của ngôn từ, nhạc tính trong “Tiếng thu” của Lưu Trọng Lư (qua phân tích của Chu Văn Sơn): “bản hòa âm ngôn từ” man mác — đẹp một cách tinh tế, thấm thía. Bốn vẻ đẹp, bốn phong cách, nhưng đều gặp nhau ở điểm chung: lấy thiên nhiên để bộc lộ tâm trạng con người, và đều hướng tới bồi đắp tâm hồn người đọc. Thơ ca vì thế là tài sản tinh thần vô giá: mỗi bài thơ hay là một lần tâm hồn được mở rộng, được nâng cao. Trong cuộc sống hiện đại, xin đừng để tâm hồn mình khô cằn vì thiếu thơ — hãy đọc thơ, yêu thơ, để mỗi ngày đều có thêm một vẻ đẹp ở lại trong lòng.", "points": 0}]}]}
