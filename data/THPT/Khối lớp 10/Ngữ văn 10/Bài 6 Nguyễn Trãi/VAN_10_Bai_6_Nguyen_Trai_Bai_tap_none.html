ảm xúc mà phải thể hiện bằng hành động cụ thể, phù hợp với thời đại. Thực tế đáng mừng là đa số bạn trẻ hôm nay sống có lí tưởng: nhiều bạn đạt thành tích cao trong học tập, nghiên cứu khoa học mang vinh quang về cho Tổ quốc; hàng vạn thanh niên tình nguyện đến vùng sâu vùng xa; trên không gian mạng, giới trẻ là lực lượng nòng cốt bảo vệ chủ quyền, lan tỏa hình ảnh đẹp về đất nước. Tuy nhiên, vẫn còn một bộ phận thờ ơ với thời sự đất nước, sính ngoại, chạy theo lối sống thực dụng, thậm chí có phát ngôn lệch lạc về lịch sử. Nguyên nhân một phần do giáo dục truyền thống chưa sâu, một phần do tác động tiêu cực của mạng xã hội và lối sống hưởng thụ. Cần hiểu rằng giữ gìn truyền thống yêu nước hôm nay không có nghĩa là rập khuôn quá khứ, mà là tiếp nối tinh thần cha ông bằng những việc làm của thời đại mới: học tập giỏi để xây dựng đất nước, lao động sáng tạo, bảo vệ môi trường, giữ gìn bản sắc văn hóa, sẵn sàng bảo vệ Tổ quốc khi cần. Mỗi bạn trẻ hãy bắt đầu từ những việc nhỏ: học tốt, sống trung thực, tôn trọng kỉ luật, quan tâm đến cộng đồng. Nhà trường và gia đình cần giáo dục truyền thống bằng những câu chuyện sinh động, gần gũi thay vì khô khan. Tuổi trẻ là mùa xuân của đất nước. Nếu mỗi người trẻ đều thắp sáng ngọn lửa yêu nước bằng hành động thiết thực, truyền thống vẻ vang của dân tộc sẽ mãi được giữ gìn và phát huy, đưa đất nước vững bước đi lên."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyễn Trãi đỗ Thái học sinh vào năm nào?", "options": ["A. 1380", "B. 1400", "C. 1418", "D. 1428"], "answer": "B", "points": 0.25, "explain": "Nguyễn Trãi đỗ Thái học sinh năm 1400, dưới triều Hồ. Sau đó ông tham gia khởi nghĩa Lam Sơn và trở thành quân sư của Lê Lợi."}, {"type": "mcq", "level": "NB", "q": "Bình Ngô đại cáo được Nguyễn Trãi viết thay lời ai?", "options": ["A. Trần Nguyên Đán", "B. Nguyễn Phi Khanh", "C. Lê Lợi", "D. Lê Thánh Tông"], "answer": "C", "points": 0.25, "explain": "Nguyễn Trãi viết Bình Ngô đại cáo thay lời Lê Lợi (Bình Định vương, sau là vua Lê Thái Tổ) để tuyên bố kết thúc chiến tranh chống quân Minh."}, {"type": "mcq", "level": "TH", "q": "Dòng nào nêu đúng bố cục 4 phần của Bình Ngô đại cáo?", "options": ["A. Tả cảnh – kể chuyện – bình luận – kết thúc", "B. Nêu luận đề chính nghĩa – tố cáo tội ác giặc – kể quá trình kháng chiến – tuyên bố độc lập", "C. Mở bài – thân bài – kết bài theo văn xuôi hiện đại", "D. Kể tội giặc – ca ngợi vua – răn quan lại – cầu mưa thuận gió hòa"], "answer": "B", "points": 0.25, "explain": "Bình Ngô đại cáo có bố cục 4 phần chặt chẽ: nêu luận đề chính nghĩa (nhân nghĩa, độc lập dân tộc); tố cáo tội ác giặc Minh; kể quá trình kháng chiến gian khổ đến thắng lợi; tuyên bố nền độc lập và nêu bài học giữ nước."}, {"type": "mcq", "level": "TH", "q": "Bài thơ Dục Thúy sơn của Nguyễn Trãi được viết bằng chữ gì?", "options": ["A. Chữ Nôm", "B. Chữ Hán", "C. Chữ Quốc ngữ", "D. Chữ Phạn"], "answer": "B", "points": 0.25, "explain": "Dục Thúy sơn là thơ chữ Hán, in trong Ức Trai thi tập. Thơ Nôm của Nguyễn Trãi tập trung ở Quốc âm thi tập (Bảo kính cảnh giới, Ngôn chí)."}, {"type": "mcq", "level": "VDC", "q": "Vì sao Bình Ngô đại cáo được coi là bản tuyên ngôn độc lập của dân tộc?", "options": ["A. Vì bài cáo có nhiều câu văn dài, khó hiểu", "B. Vì bài cáo khẳng định chủ quyền, nền độc lập và chính nghĩa của dân tộc ta một cách đanh thép", "C. Vì bài cáo do vua trực tiếp viết ra", "D. Vì bài cáo được viết bằng chữ Nôm"], "answer": "B", "points": 0.25, "explain": "Bình Ngô đại cáo khẳng định nước ta có nền văn hiến, có chủ quyền, phân định rõ chính nghĩa – phi nghĩa, tuyên bố kết thúc chiến tranh và nền thái bình — xứng đáng là bản tuyên ngôn độc lập thứ hai của dân tộc."}, {"type": "short", "level": "NB", "q": "Tập thơ Nôm nổi tiếng của Nguyễn Trãi có tên là gì?", "answer": "Quốc âm thi tập", "points": 0.5, "explain": "Quốc âm thi tập là tập thơ Nôm của Nguyễn Trãi, gồm các chùm Bảo kính cảnh giới, Ngôn chí..., có ý nghĩa mở đường cho thơ Nôm phát triển."}, {"type": "short", "level": "TH", "q": "Câu văn biền ngẫu trong Bình Ngô đại cáo có đặc điểm gì về cấu tạo và nhịp điệu?", "answer": "Đối xứng từng cặp, nhịp điệu hùng hồn", "points": 0.5, "explain": "Văn biền ngẫu là lối văn xuôi có các câu đối xứng nhau từng cặp về số chữ, nhịp điệu và ý nghĩa, tạo âm hưởng hùng hồn, trang trọng cho bài cáo."}, {"type": "short", "level": "VD", "q": "Nêu hai bài thơ (ngoài Bình Ngô đại cáo) cho thấy Nguyễn Trãi vừa là nhà thơ thiên nhiên vừa là nhà thơ thế sự.", "answer": "Bảo kính cảnh giới và Dục Thúy sơn", "points": 0.5, "explain": "Bảo kính cảnh giới (bài 43) tả cảnh ngày hè tươi đẹp; Dục Thúy sơn tả sơn thủy hữu tình — đều là thơ thiên nhiên. Nhưng ẩn sau cảnh là tấm lòng ưu dân, hoài cổ, suy ngẫm thế sự của nhà thơ."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích vẻ đẹp tâm hồn Nguyễn Trãi qua bài thơ Bảo kính cảnh giới (bài 43).", "points": 0, "explain": "DÀN Ý: Mở đoạn: giới thiệu bài thơ (thơ Nôm, chùm Bảo kính cảnh giới). Thân đoạn: bức tranh ngày hè rực rỡ, tràn đầy sức sống qua hình ảnh, từ ngữ giàu sức gợi; tâm hồn tinh tế, yêu thiên nhiên của nhà thơ; hai câu kết bộc lộ tấm lòng ưu dân (ước có đàn vua Thuấn gảy khúc Nam phong cho dân giàu đủ). Kết đoạn: vẻ đẹp con người Nguyễn Trãi — nghệ sĩ mà lòng luôn canh cánh việc dân, việc nước. BÀI MẪU: Qua bài thơ Bảo kính cảnh giới (bài 43), ta bắt gặp một Nguyễn Trãi với tâm hồn nghệ sĩ tinh tế và tấm lòng ưu dân tha thiết. Phần đầu bài thơ vẽ nên bức tranh ngày hè rực rỡ, căng tràn sức sống: sắc hoa, hương sen, tiếng ve hiện lên qua những từ ngữ giàu sức gợi, nhịp thơ sôi động. Thiên nhiên trong thơ ông không tĩnh lặng mà lúc nào cũng cựa quậy, sinh sôi — đó là cái nhìn của một tâm hồn yêu đời, gắn bó máu thịt với quê hương. Nhưng điều làm nên chiều sâu của bài thơ lại nằm ở phần kết: giữa cảnh hè tưng bừng, nhà thơ bỗng ước có được cây đàn của vua Thuấn để gảy khúc Nam phong, cầu cho dân giàu đủ khắp mọi phương. Từ tả cảnh, thơ chuyển sang trữ tình, từ niềm vui trước thiên nhiên chuyển thành nỗi lo cho dân. Vẻ đẹp tâm hồn Nguyễn Trãi chính là ở sự hòa quyện ấy: một nghệ sĩ tài hoa mà lúc nào cũng canh cánh việc nước, việc dân; yêu cái đẹp mà không quên nỗi khổ của đời."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ phân tích đoạn mở đầu của Bình Ngô đại cáo (phần nêu luận đề và chân lí về nền độc lập dân tộc).", "points": 0, "explain": "DÀN Ý: Mở bài: giới thiệu tác giả, tác phẩm, vị trí đoạn mở đầu. Thân bài: Luận đề nhân nghĩa (việc nhân nghĩa cốt ở yên dân) — tư tưởng tiến bộ, lấy dân làm gốc; chân lí về nền độc lập: nước ta có nền văn hiến lâu đời, có cương vực, phong tục riêng, các triều đại nối tiếp — khẳng định chủ quyền không thể chối cãi; nghệ thuật: câu văn biền ngẫu, đối xứng; dẫn chứng lịch sử; giọng điệu trang trọng, đanh thép. Kết bài: ý nghĩa — đặt nền tảng lí luận cho toàn bài, thể hiện tầm vóc tư tưởng Nguyễn Trãi. BÀI MẪU: Đoạn mở đầu Bình Ngô đại cáo là một trong những đoạn văn chính luận xuất sắc nhất của văn học trung đại Việt Nam, đặt nền móng tư tưởng cho toàn bộ bài cáo. Mở đầu, Nguyễn Trãi nêu luận đề nhân nghĩa: việc nhân nghĩa cốt ở yên dân. Đây là tư tưởng tiến bộ vượt thời đại — lấy cuộc sống yên ổn của nhân dân làm thước đo của mọi hành động chính trị, quân sự. Từ luận đề ấy, ông khẳng định chân lí về nền độc lập của dân tộc: nước Đại Việt ta có nền văn hiến lâu đời, có cương vực lãnh thổ, phong tục tập quán riêng, và trải qua các triều đại nối tiếp nhau giữ vững chủ quyền. Lời khẳng định đanh thép, dứt khoát, không cho phép bất cứ sự nghi ngờ hay xâm phạm nào. Về nghệ thuật, đoạn văn dùng lối văn biền ngẫu với các câu đối xứng, nhịp điệu trang trọng, hùng hồn; dẫn chứng lịch sử được liệt kê dồn dập tạo sức thuyết phục mạnh mẽ. Giọng điệu vừa trang nghiêm vừa tự hào, thể hiện niềm tin sắt đá vào chính nghĩa dân tộc. Đoạn mở đầu không chỉ nêu luận đề mà còn xác lập thế đứng chính nghĩa cho cuộc kháng chiến: ta đánh giặc là vì nhân nghĩa, vì độc lập — đó là chân lí vĩnh cửu. Qua đó, ta thấy tầm vóc tư tưởng của Nguyễn Trãi: một nhà chính trị lỗi lạc, một nhà văn hóa lớn luôn lấy dân, lấy nước làm gốc. Đoạn văn mãi là bài học về lòng yêu nước và ý thức độc lập dân tộc cho các thế hệ hôm nay."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyễn Trãi giữ vai trò gì trong khởi nghĩa Lam Sơn?", "options": ["A. Tướng tiên phong trực tiếp cầm quân", "B. Quân sư, soạn thảo văn thư cho Lê Lợi", "C. Sứ giả đi cầu viện nhà Minh", "D. Người trông coi kho lương"], "answer": "B", "points": 0.25, "explain": "Nguyễn Trãi là quân sư, cánh tay đắc lực của Lê Lợi, dâng Bình Định sách và soạn thảo nhiều văn thư, chiếu biểu quan trọng."}, {"type": "mcq", "level": "NB", "q": "Thể thơ của bài Bảo kính cảnh giới (bài 43) là gì?", "options": ["A. Lục bát", "B. Song thất lục bát", "C. Đường luật (thất ngôn)", "D. Thơ tự do"], "answer": "C", "points": 0.25, "explain": "Bảo kính cảnh giới là thơ Nôm Đường luật (thất ngôn), kết cấu tả cảnh ngụ tình: phần đầu tả cảnh ngày hè, phần cuối bộc lộ tấm lòng ưu dân."}, {"type": "mcq", "level": "TH", "q": "Hai câu kết của bài Bảo kính cảnh giới (bài 43) thể hiện tấm lòng nào của Nguyễn Trãi?", "options": ["A. Lòng căm thù giặc sâu sắc", "B. Nỗi buồn vì công danh lỡ dở", "C. Tấm lòng ưu dân, mong dân giàu nước mạnh", "D. Khao khát ẩn dật nơi núi rừng"], "answer": "C", "points": 0.25, "explain": "Hai câu kết mượn điển cố đàn vua Thuấn, khúc Nam phong để bày tỏ ước mong dân giàu đủ khắp mọi phương — tấm lòng ưu dân tha thiết của Nguyễn Trãi."}, {"type": "mcq", "level": "TH", "q": "Bài thơ Dục Thúy sơn bộc lộ tâm trạng nào của nhà thơ?", "options": ["A. Vui sướng tột cùng trước cảnh đẹp", "B. Hoài cổ, suy ngẫm về lẽ thịnh suy, bể dâu", "C. Giận dữ trước cảnh nước mất", "D. Thờ ơ, lãnh đạm với thế sự"], "answer": "B", "points": 0.25, "explain": "Từ cảnh núi Dục Thúy soi bóng, nhà thơ nhớ người xưa, ngẫm lẽ thịnh suy bể dâu của cuộc đời — tâm trạng hoài cổ trầm lắng."}, {"type": "mcq", "level": "VDC", "q": "Điểm gặp gỡ giữa Bảo kính cảnh giới (bài 43) và Dục Thúy sơn là gì?", "options": ["A. Cùng viết bằng chữ Nôm", "B. Cùng là thơ tả cảnh ngụ tình, từ thiên nhiên bộc lộ tâm sự thế sự của nhà thơ", "C. Cùng ca ngợi chiến thắng quân Minh", "D. Cùng có 8 câu thơ"], "answer": "B", "points": 0.25, "explain": "Cả hai bài đều tả cảnh thiên nhiên tươi đẹp (ngày hè / núi sông) rồi từ cảnh bộc lộ tâm sự: lòng ưu dân (Bảo kính cảnh giới) và nỗi hoài cổ, suy ngẫm thế sự (Dục Thúy sơn)."}, {"type": "short", "level": "NB", "q": "Nguyễn Trãi bị án oan nổi tiếng nào vào năm 1442?", "answer": "Án oan Lệ Chi viên", "points": 0.5, "explain": "Năm 1442, Nguyễn Trãi bị kết án oan trong vụ án Lệ Chi viên, bị tru di tam tộc; đến đời Lê Thánh Tông mới được minh oan."}, {"type": "short", "level": "TH", "q": "Trong Bình Ngô đại cáo, cặp phạm trù đối lập nào làm nên sức thuyết phục của lập luận?", "answer": "Chính nghĩa và phi nghĩa", "points": 0.5, "explain": "Toàn bài cáo xoay quanh đối lập chính nghĩa (ta: nhân nghĩa, vì dân, chống xâm lược) và phi nghĩa (giặc Minh: tàn bạo, xâm lược) — mọi chi tiết đều phục vụ luận đề này."}, {"type": "short", "level": "VD", "q": "Nêu tên điển cố được Nguyễn Trãi sử dụng ở cuối bài Bảo kính cảnh giới (bài 43).", "answer": "Đàn vua Thuấn, khúc Nam phong", "points": 0.5, "explain": "Nhà thơ ước có cây đàn của vua Thuấn để gảy khúc Nam phong — điển cố về vị vua thánh đức lo cho dân, qua đó bày tỏ khát vọng dân giàu nước mạnh."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về vẻ đẹp con người Nguyễn Trãi qua các văn bản đã học.", "points": 0, "explain": "DÀN Ý: Mở đoạn: Nguyễn Trãi — sự thống nhất giữa anh hùng và thi nhân. Thân đoạn: lòng yêu nước, thương dân (Bình Ngô đại cáo: tư tưởng nhân nghĩa; Bảo kính cảnh giới: ước dân giàu đủ); tâm hồn nghệ sĩ tinh tế (cảm nhận thiên nhiên trong Bảo kính cảnh giới, Dục Thúy sơn); nhân cách thanh cao (Ngôn chí), hoài cổ suy tư (Bạch Đằng hải khẩu, Dục Thúy sơn). Kết đoạn: vẻ đẹp toàn diện, tấm gương cho thế hệ trẻ. BÀI MẪU: Qua các văn bản đã học, Nguyễn Trãi hiện lên với vẻ đẹp toàn diện hiếm có: vừa là anh hùng dân tộc, vừa là thi nhân tài hoa. Trước hết, ông là con người của lòng yêu nước, thương dân tha thiết. Tư tưởng nhân nghĩa trong Bình Ngô đại cáo, ước mong dân giàu đủ trong Bảo kính cảnh giới cho thấy lúc nào ông cũng canh cánh việc dân, việc nước. Đồng thời, ông có tâm hồn nghệ sĩ vô cùng tinh tế: say đắm trước vẻ đẹp ngày hè rực rỡ, trầm tư trước núi sông Dục Thúy, để từ thiên nhiên mà gửi gắm bao tâm sự. Nhân cách ông lại thanh cao, không màng danh lợi như thể hiện trong Ngôn chí; trước Bạch Đằng giang, ông tự hào về truyền thống cha ông và trăn trở về trách nhiệm của mình. Sự thống nhất giữa con người hành động và con người nghệ sĩ, giữa lòng yêu nước và tình yêu cái đẹp đã làm nên một Nguyễn Trãi bất tử — vừa gần gũi vừa lớn lao, mãi là tấm gương sáng cho thế hệ trẻ noi theo."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề xã hội: Ý thức bảo vệ môi trường của học sinh hiện nay.", "points": 0, "explain": "DÀN Ý: Mở bài: môi trường đang bị đe dọa, trách nhiệm của mỗi người, nhất là học sinh. Thân bài: Giải thích: bảo vệ môi trường là giữ gìn không khí, nguồn nước, cây xanh... Thực trạng: nhiều bạn có ý thức (trồng cây, phân loại rác, ngày chủ nhật xanh); một bộ phận còn xả rác bừa bãi, lãng phí điện nước, phá hoại cây xanh. Nguyên nhân: ý thức kém, thói quen xấu, thiếu chế tài và giáo dục. Hậu quả: ô nhiễm, biến đổi khí hậu, ảnh hưởng sức khỏe. Giải pháp: từ việc nhỏ (bỏ rác đúng nơi, tiết kiệm, trồng cây); nhà trường tổ chức hoạt động; xã hội tuyên truyền, xử phạt. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Môi trường sống của chúng ta đang từng ngày bị đe dọa: không khí ô nhiễm, nguồn nước cạn kiệt, rác thải bủa vây khắp nơi. Trong bối cảnh ấy, ý thức bảo vệ môi trường của mỗi người, đặc biệt là học sinh — những chủ nhân tương lai của đất nước — trở thành vấn đề cấp thiết. Bảo vệ môi trường là những hành động thiết thực giữ gìn không khí trong lành, nguồn nước sạch, cây xanh và cảnh quan xung quanh. Đáng mừng là nhiều bạn học sinh đã có ý thức tốt: tích cực tham gia trồng cây, ngày Chủ nhật xanh, phân loại rác tại nguồn, tiết kiệm điện nước trong sinh hoạt. Tuy nhiên, bên cạnh đó vẫn còn không ít bạn xả rác bừa bãi trong sân trường, khắc vẽ lên bàn ghế, cây xanh; lãng phí giấy, điện, nước; thờ ơ trước các hoạt động vì môi trường. Nguyên nhân một phần do ý thức chưa cao, thói quen xấu từ nhỏ; một phần do công tác giáo dục, tuyên truyền chưa thường xuyên và thiếu chế tài xử lí nghiêm. Hậu quả thì ai cũng thấy: trường học, đường phố ngập rác; không khí ngột ngạt; lâu dài là biến đổi khí hậu đe dọa chính cuộc sống của chúng ta. Để thay đổi, mỗi học sinh hãy bắt đầu từ những việc nhỏ nhất: bỏ rác đúng nơi quy định, hạn chế đồ nhựa dùng một lần, tiết kiệm điện nước, chăm sóc cây xanh. Nhà trường cần tổ chức thường xuyên các hoạt động ngoại khóa về môi trường; gia đình làm gương cho con em. Bảo vệ môi trường không phải là việc của riêng ai. Nếu mỗi học sinh đều hành động từ hôm nay, chúng ta sẽ có một môi trường xanh – sạch – đẹp cho hôm nay và cho cả mai sau."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Quê gốc của Nguyễn Trãi ở đâu?", "options": ["A. Lam Sơn, Thanh Hóa", "B. Nhị Khê, Thường Tín (Hà Nội)", "C. Côn Sơn, Hải Dương", "D. Thăng Long, Hà Nội"], "answer": "B", "points": 0.25, "explain": "Quê gốc Nguyễn Trãi ở làng Nhị Khê, huyện Thường Tín (nay thuộc Hà Nội). Ông sinh tại Thăng Long và sau này về ở ẩn tại Côn Sơn."}, {"type": "mcq", "level": "NB", "q": "Từ Hán Việt là gì?", "options": ["A. Từ có nguồn gốc tiếng Hán, được Việt hóa về âm đọc và cách dùng", "B. Từ thuần Việt có từ lâu đời", "C. Từ mượn của tiếng Anh, tiếng Pháp", "D. Từ mới do giới trẻ sáng tạo"], "answer": "A", "points": 0.25, "explain": "Từ Hán Việt là từ có nguồn gốc tiếng Hán, đã được Việt hóa về âm đọc và cách dùng, ví dụ: nhân nghĩa, độc lập, sơn hà."}, {"type": "mcq", "level": "TH", "q": "Sắc thái biểu cảm của từ Hán Việt trong văn bản nghị luận trung đại là gì?", "options": ["A. Suồng sã, thân mật", "B. Hài hước, châm biếm", "C. Trang trọng, cổ kính", "D. Bi lụy, sầu thảm"], "answer": "C", "points": 0.25, "explain": "Từ Hán Việt mang sắc thái trang trọng, cổ kính, phù hợp với văn bản nghị luận, hành chính và văn chương trung đại như Bình Ngô đại cáo."}, {"type": "mcq", "level": "TH", "q": "Bài thơ Bạch Đằng hải khẩu gợi cho nhà thơ suy ngẫm về điều gì?", "options": ["A. Nỗi nhớ quê hương da diết", "B. Chiến công cha ông và trách nhiệm của thế hệ hôm nay", "C. Tình yêu đôi lứa trong sáng", "D. Nỗi buồn vì tuổi già"], "answer": "B", "points": 0.25, "explain": "Đứng trước cửa biển Bạch Đằng, Nguyễn Trãi nhớ chiến công oanh liệt của cha ông trên sông Bạch Đằng, tự hào về truyền thống chống ngoại xâm và suy ngẫm về trách nhiệm giữ nước."}, {"type": "mcq", "level": "VDC", "q": "Cách dùng từ Hán Việt nào sau đây là ĐÚNG?", "options": ["A. Dùng từ Hán Việt trang trọng trong văn bản hành chính, nghị luận", "B. Lạm dụng từ Hán Việt trong lời ăn tiếng nói hằng ngày cho sang", "C. Dùng từ Hán Việt mà không cần hiểu nghĩa yếu tố cấu tạo", "D. Trộn lẫn từ Hán Việt trang trọng với từ suồng sã trong một câu văn nghiêm túc"], "answer": "A", "points": 0.25, "explain": "Từ Hán Việt phù hợp với phong cách trang trọng (văn nghị luận, hành chính). Cần hiểu nghĩa yếu tố cấu tạo, tránh lạm dụng và tránh lẫn lộn sắc thái."}, {"type": "short", "level": "NB", "q": "Ai là thầy học, đồng thời là ông ngoại của Nguyễn Trãi?", "answer": "Trần Nguyên Đán", "points": 0.5, "explain": "Trần Nguyên Đán vừa là ông ngoại vừa là thầy học của Nguyễn Trãi, có ảnh hưởng lớn đến tư tưởng và văn chương của ông."}, {"type": "short", "level": "TH", "q": "Nêu một lỗi thường gặp khi sử dụng từ Hán Việt.", "answer": "Dùng sai nghĩa do không hiểu yếu tố Hán Việt cấu tạo (hoặc lạm dụng gây khó hiểu, sáo rỗng)", "points": 0.5, "explain": "Lỗi thường gặp: dùng từ Hán Việt sai nghĩa vì không hiểu yếu tố cấu tạo; lạm dụng gây khó hiểu, sáo rỗng; lẫn lộn sắc thái trang trọng và suồng sã."}, {"type": "short", "level": "VD", "q": "Văn bản nghị luận về một vấn đề xã hội gồm mấy phần? Nêu tên các phần.", "answer": "Ba phần: Mở bài, Thân bài, Kết bài", "points": 0.5, "explain": "Mở bài giới thiệu vấn đề và quan điểm; Thân bài giải thích, phân tích thực trạng – nguyên nhân – hậu quả, bàn luận, dẫn chứng, giải pháp; Kết bài khẳng định và kêu gọi."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích nghệ thuật tả cảnh ngụ tình trong bài Dục Thúy sơn.", "points": 0, "explain": "DÀN Ý: Mở đoạn: giới thiệu bài thơ (thơ chữ Hán, Ức Trai thi tập). Thân đoạn: bút pháp tả cảnh chấm phá, sơn thủy hữu tình (núi soi bóng nước); nghệ thuật lấy động tả tĩnh; từ cảnh nảy sinh tình — nỗi hoài cổ, suy ngẫm lẽ thịnh suy bể dâu; ngôn ngữ hàm súc, điển cố. Kết đoạn: cảnh và tình hòa quyện, thể hiện tâm hồn nghệ sĩ và trí tuệ của Nguyễn Trãi. BÀI MẪU: Bài thơ Dục Thúy sơn là minh chứng tiêu biểu cho nghệ thuật tả cảnh ngụ tình của Nguyễn Trãi. Bằng bút pháp chấm phá tài tình, nhà thơ vẽ nên bức tranh sơn thủy hữu tình: núi Dục Thúy sừng sững soi bóng xuống dòng sông trong vắt, cảnh vật vừa hùng vĩ vừa thơ mộng. Ngôn ngữ thơ chữ Hán hàm súc, mỗi chữ như một nét vẽ tinh luyện; nghệ thuật lấy động tả tĩnh khiến cảnh vật như có hồn, cựa quậy. Nhưng tả cảnh chỉ là cái cớ — điều nhà thơ hướng tới là bộc lộ tâm sự: đứng trước cảnh đẹp, ông nhớ đến người xưa, ngẫm về lẽ thịnh suy, bể dâu của cuộc đời. Cảnh càng đẹp, nỗi hoài cổ càng sâu; không gian càng rộng, suy tư càng lắng. Nghệ thuật tả cảnh ngụ tình ở đây đạt đến độ nhuần nhuyễn: không một câu nào tả cảnh đơn thuần, cũng không câu nào nói tình một cách khô khan — cảnh và tình thấm vào nhau, làm nên một Dục Thúy sơn vừa thực vừa mộng, vừa là thắng cảnh vừa là tấm gương soi tâm hồn thi nhân."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề xã hội: Văn hóa đọc của giới trẻ hiện nay.", "points": 0, "explain": "DÀN Ý: Mở bài: vai trò của sách và văn hóa đọc; vấn đề: văn hóa đọc của giới trẻ đáng lo ngại. Thân bài: Giải thích văn hóa đọc. Thực trạng: nhiều bạn ít đọc sách, chỉ lướt mạng xã hội; sách bị cạnh tranh bởi game, video ngắn; mặt tích cực: sách điện tử, audio book phát triển, nhiều bạn trẻ mê sách. Nguyên nhân: sức hút của công nghệ, thiếu thời gian, ít được định hướng. Hậu quả: kiến thức nông, ngôn ngữ nghèo nàn, tư duy thiếu chiều sâu. Giải pháp: mỗi bạn dành thời gian đọc mỗi ngày; nhà trường, thư viện tổ chức ngày hội sách; gia đình tạo thói quen đọc. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Sách là kho tàng tri thức của nhân loại, là người bạn lớn của con người. Thế nhưng, văn hóa đọc của giới trẻ hiện nay đang là vấn đề đáng lo ngại, cần được nhìn nhận nghiêm túc. Văn hóa đọc là thói quen, nhu cầu và kĩ năng đọc sách một cách thường xuyên, có chọn lọc. Thực tế cho thấy nhiều bạn trẻ ngày nay rất ít đọc sách: thời gian rảnh dành cho lướt mạng xã hội, chơi game, xem video ngắn; tủ sách gia đình thưa thớt; đến thư viện chỉ khi bị bắt buộc. Sách đang bị cạnh tranh quyết liệt bởi các phương tiện giải trí nhanh, gọn, bắt mắt. Tuy nhiên, bức tranh không hoàn toàn ảm đạm: sách điện tử, sách nói phát triển mạnh; nhiều bạn trẻ lập nhóm đọc sách, review sách trên mạng xã hội với hàng nghìn lượt theo dõi; các hội sách thu hút đông đảo bạn trẻ. Nguyên nhân của tình trạng lười đọc một phần do sức hút khó cưỡng của công nghệ, một phần do các em thiếu thời gian và ít được định hướng chọn sách phù hợp. Hậu quả là kiến thức nông cạn, vốn từ nghèo nàn, khả năng diễn đạt và tư duy phản biện hạn chế — điều này ảnh hưởng trực tiếp đến học tập và tương lai. Để chấn hưng văn hóa đọc, mỗi bạn trẻ hãy bắt đầu bằng việc đơn giản: dành 30 phút đọc sách mỗi ngày, chọn sách phù hợp sở thích rồi mở rộng dần. Nhà trường cần tổ chức ngày hội đọc sách, xây dựng thư viện thân thiện; gia đình hãy làm gương đọc sách cho con. Công nghệ không phải kẻ thù của sách nếu ta biết tận dụng sách điện tử, sách nói một cách thông minh. Hãy để mỗi trang sách mở ra một chân trời mới — bởi người đọc sách hôm nay chính là người làm chủ tri thức ngày mai."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Năm 1980, UNESCO vinh danh Nguyễn Trãi nhân kỉ niệm bao nhiêu năm ngày sinh của ông?", "options": ["A. 500 năm", "B. 550 năm", "C. 600 năm", "D. 650 năm"], "answer": "C", "points": 0.25, "explain": "Năm 1980, nhân kỉ niệm 600 năm ngày sinh Nguyễn Trãi (1380 – 1980), UNESCO vinh danh ông là danh nhân văn hóa thế giới."}, {"type": "mcq", "level": "NB", "q": "Chùm thơ nào sau đây thuộc Quốc âm thi tập?", "options": ["A. Bảo kính cảnh giới và Ngôn chí", "B. Dục Thúy sơn", "C. Bạch Đằng hải khẩu", "D. Ức Trai thi tập"], "answer": "A", "points": 0.25, "explain": "Bảo kính cảnh giới và Ngôn chí là thơ Nôm, thuộc Quốc âm thi tập. Dục Thúy sơn và Bạch Đằng hải khẩu là thơ chữ Hán."}, {"type": "mcq", "level": "TH", "q": "Ý nào KHÔNG đúng về Nguyễn Trãi?", "options": ["A. Là quân sư của Lê Lợi trong khởi nghĩa Lam Sơn", "B. Được UNESCO vinh danh là danh nhân văn hóa thế giới", "C. Sống suốt đời vinh hoa, không gặp biến cố nào", "D. Có sự nghiệp văn học đồ sộ cả chữ Hán và chữ Nôm"], "answer": "C", "points": 0.25, "explain": "Cuộc đời Nguyễn Trãi đầy biến cố: bị oan phải về Côn Sơn, mắc án oan Lệ Chi viên năm 1442 và bị tru di tam tộc, sau mới được minh oan."}, {"type": "mcq", "level": "TH", "q": "Trong văn bản nghị luận về một vấn đề xã hội, phần Thân bài KHÔNG bao gồm nội dung nào?", "options": ["A. Giải thích vấn đề, phân tích thực trạng – nguyên nhân – hậu quả", "B. Đưa dẫn chứng và đề xuất giải pháp", "C. Kể lại toàn bộ cốt truyện một tác phẩm văn học", "D. Bình luận, đánh giá vấn đề"], "answer": "C", "points": 0.25, "explain": "Thân bài nghị luận xã hội gồm: giải thích, phân tích thực trạng – nguyên nhân – hậu quả, bình luận đánh giá, dẫn chứng, giải pháp. Kể lại cốt truyện tác phẩm không thuộc kiểu bài này."}, {"type": "mcq", "level": "VDC", "q": "Câu: Việc nhân nghĩa cốt ở yên dân thể hiện tư tưởng tiến bộ nào của Nguyễn Trãi?", "options": ["A. Lấy dân làm gốc, lấy cuộc sống yên ổn của nhân dân làm thước đo", "B. Đề cao chiến tranh xâm lược", "C. Coi vua chúa là trên hết", "D. Chủ trương ẩn dật lánh đời"], "answer": "A", "points": 0.25, "explain": "Việc nhân nghĩa cốt ở yên dân là tư tưởng lấy dân làm gốc: mọi hành động chính trị, quân sự đều phải hướng tới cuộc sống yên ổn của nhân dân — tư tưởng tiến bộ vượt thời đại."}, {"type": "short", "level": "NB", "q": "Nguyễn Trãi về ở ẩn tại đâu sau khi bị oan?", "answer": "Côn Sơn", "points": 0.5, "explain": "Sau khi bị oan, Nguyễn Trãi lui về ở ẩn tại Côn Sơn (Chí Linh, Hải Dương) — nơi gắn với nhiều sáng tác thơ của ông."}, {"type": "short", "level": "TH", "q": "Nêu hai tác phẩm tiêu biểu viết bằng chữ Hán của Nguyễn Trãi.", "answer": "Bình Ngô đại cáo và Dục Thúy sơn (hoặc Ức Trai thi tập, Bạch Đằng hải khẩu)", "points": 0.5, "explain": "Nguyễn Trãi có sự nghiệp chữ Hán đồ sộ: Bình Ngô đại cáo (văn xuôi), Dục Thúy sơn, Bạch Đằng hải khẩu (thơ), tập Ức Trai thi tập."}, {"type": "short", "level": "VD", "q": "Vì sao khi dùng từ Hán Việt cần tách nghĩa từng yếu tố cấu tạo?", "answer": "Để hiểu đúng nghĩa của từ, tránh dùng sai", "points": 0.5, "explain": "Từ Hán Việt do các yếu tố Hán ghép lại; tách từng yếu tố (ví dụ ái – quốc: yêu – nước) giúp hiểu đúng nghĩa, đoán nghĩa từ mới và tránh dùng sai nghĩa, sai sắc thái."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu cảm nhận của em về bài thơ Ngôn chí (bài 3) của Nguyễn Trãi.", "points": 0, "explain": "DÀN Ý: Mở đoạn: giới thiệu bài thơ (thơ Nôm, chùm Ngôn chí — nói chí hướng). Thân đoạn: nhà thơ bày tỏ nhân cách thanh cao, không màng danh lợi; giữ lòng trong sạch giữa thời cuộc nhiễu nhương; giọng thơ thẳng thắn, bộc trực mà sâu lắng. Kết đoạn: vẻ đẹp nhân cách Nguyễn Trãi — tấm gương về lối sống thanh cao. BÀI MẪU: Bài thơ Ngôn chí (bài 3) cho ta thấy một Nguyễn Trãi khác: không phải nhà quân sự lẫm liệt hay thi nhân say cảnh, mà là một con người thẳng thắn bày tỏ chí hướng, nhân cách của mình. Giữa thời cuộc nhiễu nhương, danh lợi phù phiếm, nhà thơ khẳng định lối sống thanh cao: không màng công danh, giữ cho lòng mình trong sạch, ngay thẳng. Giọng thơ bộc trực, chân thành mà sâu lắng — đó là tiếng nói của một nhân cách lớn, dám sống thật với mình. Điều đáng quý là chí hướng ấy không phải lời nói suông: cả cuộc đời Nguyễn Trãi, từ việc phò Lê Lợi cứu nước đến khi lui về Côn Sơn, đều nhất quán với lí tưởng vì dân, vì nước, coi nhẹ vinh hoa. Đọc Ngôn chí, em càng thêm kính trọng Nguyễn Trãi — không chỉ tài năng mà còn ở nhân cách sáng ngời. Bài thơ cũng nhắc nhở thế hệ trẻ hôm nay: giữa bao cám dỗ vật chất, hãy giữ cho mình một chí hướng cao đẹp và một tâm hồn trong sạch."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề xã hội: Lòng biết ơn — đạo lí tốt đẹp của dân tộc cần được giữ gìn.", "points": 0, "explain": "DÀN Ý: Mở bài: đạo lí uống nước nhớ nguồn; vấn đề: lòng biết ơn trong xã hội hiện nay. Thân bài: Giải thích: biết ơn là ghi nhớ, trân trọng công ơn và đền đáp. Biểu hiện: biết ơn cha mẹ, thầy cô, anh hùng liệt sĩ, người giúp đỡ mình. Thực trạng: nhiều bạn sống có hiếu, tri ân; một bộ phận vô cảm, coi sự hi sinh của người khác là đương nhiên. Nguyên nhân: lối sống thực dụng, ích kỉ; giáo dục chưa sâu. Bàn luận: biết ơn là nền tảng đạo đức, gắn kết con người; cần thể hiện bằng hành động cụ thể. Dẫn chứng: ngày Thương binh Liệt sĩ, phong trào đền ơn đáp nghĩa, các bạn trẻ chăm sóc mẹ Việt Nam anh hùng. Giải pháp: giáo dục trong gia đình, nhà trường; mỗi người tự rèn luyện. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Dân tộc ta có đạo lí tốt đẹp: uống nước nhớ nguồn, ăn quả nhớ kẻ trồng cây. Lòng biết ơn — tình cảm thiêng liêng ấy — cần được mỗi người, nhất là thế hệ trẻ, giữ gìn và phát huy. Biết ơn là ghi nhớ công ơn của người khác đối với mình và tìm cách đền đáp xứng đáng. Đó là biết ơn cha mẹ đã sinh thành, dưỡng dục; biết ơn thầy cô đã dạy dỗ nên người; biết ơn các anh hùng liệt sĩ đã hi sinh xương máu cho độc lập hôm nay; biết ơn cả những người bình dị đã giúp đỡ ta trong cuộc sống. Thực tế đáng mừng là nhiều bạn trẻ sống rất có hiếu: chăm sóc cha mẹ, tri ân thầy cô; các phong trào đền ơn đáp nghĩa, chăm sóc mẹ Việt Nam anh hùng, thắp nến tri ân các liệt sĩ được hưởng ứng rộng rãi. Thế nhưng, vẫn còn một bộ phận sống vô cảm: coi sự hi sinh, chăm sóc của cha mẹ, thầy cô là điều đương nhiên; thờ ơ trước ngày lễ tri ân; thậm chí có hành vi bất hiếu, xúc phạm người có công. Nguyên nhân sâu xa là lối sống thực dụng, ích kỉ chỉ biết hưởng thụ; công tác giáo dục đạo lí có lúc còn hình thức. Lòng biết ơn không chỉ là tình cảm mà còn là nền tảng đạo đức, gắn kết con người với nhau, làm cho xã hội ấm áp, nhân văn. Biết ơn phải thể hiện bằng hành động cụ thể: một lời cảm ơn chân thành, sự quan tâm chăm sóc cha mẹ hằng ngày, nỗ lực học tập để không phụ công thầy cô, tham gia các hoạt động tri ân. Gia đình hãy dạy con biết ơn từ những việc nhỏ; nhà trường tổ chức các hoạt động giáo dục truyền thống thiết thực. Mỗi chúng ta hãy tự hỏi mỗi ngày: hôm nay mình đã nói lời cảm ơn với ai? Sống có lòng biết ơn, ta sẽ thấy cuộc đời ý nghĩa hơn và xứng đáng với đạo lí ngàn đời của dân tộc."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Bình Ngô đại cáo được viết bằng chữ gì?", "options": ["A. Chữ Nôm", "B. Chữ Hán", "C. Chữ Quốc ngữ", "D. Chữ La-tinh"], "answer": "B", "points": 0.25, "explain": "Bình Ngô đại cáo là văn xuôi chữ Hán. Thơ Nôm của Nguyễn Trãi gồm Quốc âm thi tập (Bảo kính cảnh giới, Ngôn chí)."}, {"type": "mcq", "level": "NB", "q": "Phần mở đầu bài học về tác gia Nguyễn Trãi trong SGK có tên là gì?", "options": ["A. Tri thức ngữ văn", "B. Tác gia Nguyễn Trãi", "C. Thực hành tiếng Việt", "D. Củng cố, mở rộng"], "answer": "B", "points": 0.25, "explain": "Sau phần Tri thức ngữ văn, SGK giới thiệu mục Tác gia Nguyễn Trãi với những nét chính về cuộc đời và sự nghiệp của ông."}, {"type": "mcq", "level": "TH", "q": "Nội dung chính của phần 2 trong bố cục Bình Ngô đại cáo là gì?", "options": ["A. Kể lại quá trình khởi nghĩa Lam Sơn", "B. Tố cáo tội ác của giặc Minh đối với nhân dân ta", "C. Ca ngợi cảnh đẹp đất nước", "D. Bàn về cách dùng từ Hán Việt"], "answer": "B", "points": 0.25, "explain": "Phần 2 của bài cáo vạch trần, tố cáo tội ác tày trời của giặc Minh: bóc lột, áp bức, giết hại nhân dân ta — làm nổi bật sự đối lập chính nghĩa và phi nghĩa."}, {"type": "mcq", "level": "TH", "q": "Biện pháp nghệ thuật nào được dùng nhiều trong đoạn tố cáo tội ác giặc Minh?", "options": ["A. Nhân hóa", "B. Liệt kê, phóng đại, so sánh", "C. Ẩn dụ duy nhất", "D. Nói giảm, nói tránh"], "answer": "B", "points": 0.25, "explain": "Đoạn tố giặc dùng phép liệt kê dồn dập các tội ác, kết hợp phóng đại và so sánh để khắc họa sự tàn bạo của giặc Minh, gây căm phẫn mạnh mẽ."}, {"type": "mcq", "level": "VDC", "q": "Nhận định nào đúng về vị trí của Nguyễn Trãi trong văn học dân tộc?", "options": ["A. Chỉ là nhà quân sự, không có đóng góp văn học", "B. Là kết tinh của anh hùng dân tộc và thi nhân, có sự nghiệp đồ sộ cả chữ Hán và chữ Nôm", "C. Chỉ viết thơ chữ Hán, không viết chữ Nôm", "D. Là nhà văn hiện đại đầu thế kỉ XX"], "answer": "B", "points": 0.25, "explain": "Nguyễn Trãi vừa là anh hùng dân tộc (quân sư Lam Sơn) vừa là thi nhân lớn; sự nghiệp gồm thơ chữ Hán (Ức Trai thi tập), thơ Nôm (Quốc âm thi tập), văn chính luận (Bình Ngô đại cáo)..."}, {"type": "short", "level": "NB", "q": "Bình Ngô đại cáo còn có tên gọi khác là gì?", "answer": "Đại cáo bình Ngô", "points": 0.5, "explain": "Bình Ngô đại cáo còn gọi là Đại cáo bình Ngô — bài cáo lớn đánh dẹp giặc Ngô (quân Minh)."}, {"type": "short", "level": "TH", "q": "Nêu hai thể thơ Đường luật mà học sinh cần nắm trong Bài 6.", "answer": "Thất ngôn bát cú và thất ngôn tứ tuyệt", "points": 0.5, "explain": "Thơ Đường luật gồm thất ngôn bát cú (8 câu, mỗi câu 7 chữ) và thất ngôn tứ tuyệt (4 câu, mỗi câu 7 chữ), có luật chặt chẽ về niêm, đối, vần."}, {"type": "short", "level": "VD", "q": "Trong bài văn nghị luận về một vấn đề xã hội, dẫn chứng cần đạt những yêu cầu gì?", "answer": "Cụ thể, tiêu biểu, cập nhật, xác đáng", "points": 0.5, "explain": "Dẫn chứng phải cụ thể, tiêu biểu, cập nhật và xác đáng thì mới có sức thuyết phục; dẫn chứng chung chung, cũ kĩ làm bài văn yếu đi."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích hình ảnh người anh hùng trong đoạn kể về quá trình kháng chiến của Bình Ngô đại cáo.", "points": 0, "explain": "DÀN Ý: Mở đoạn: phần 3 của bài cáo — bức tranh kháng chiến. Thân đoạn: hình ảnh nghĩa quân buổi đầu gian khổ (thiếu lương, quân ít) nhưng ý chí kiên cường; hình ảnh Lê Lợi – người lãnh tụ (nếm mật nằm gai, quên ăn vì dân); khí thế chiến thắng hào hùng (quân ta như hổ, giặc tan như ngói vỡ). Kết đoạn: vẻ đẹp người anh hùng — yêu nước, kiên cường, trí dũng song toàn. BÀI MẪU: Phần kể về quá trình kháng chiến trong Bình Ngô đại cáo đã dựng lên hình ảnh người anh hùng dân tộc vừa bi tráng vừa hào hùng. Buổi đầu, nghĩa quân Lam Sơn vô cùng gian khổ: quân ít, lương thiếu, phải nếm mật nằm gai, nhưng ý chí thì sắt đá, càng khó khăn càng kiên cường. Nổi bật giữa đội quân ấy là hình ảnh Lê Lợi — vị lãnh tụ quên ăn, mất ngủ vì dân, vì nước, đau nỗi đau của nhân dân, căm thù giặc sâu sắc. Khi thời cơ đến, nghĩa quân vùng lên như hổ báo, đánh đâu thắng đó; giặc Minh tan tác như ngói vỡ, như tro bay. Nghệ thuật tương phản (gian khổ buổi đầu – thắng lợi vẻ vang), liệt kê chiến công dồn dập và giọng văn hào sảng đã làm nên một khúc tráng ca về con người Việt Nam: yêu nước nồng nàn, kiên cường bất khuất, trí dũng song toàn. Đọc đoạn văn, em càng thêm tự hào về truyền thống anh hùng của dân tộc và thấm thía giá trị của độc lập hôm nay."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề xã hội: Tình bạn trong sáng của tuổi học trò.", "points": 0, "explain": "DÀN Ý: Mở bài: tuổi học trò gắn với tình bạn đẹp; vấn đề cần bàn. Thân bài: Giải thích: tình bạn trong sáng là quan hệ chân thành, vô tư, cùng giúp nhau tiến bộ. Biểu hiện: chia sẻ vui buồn, giúp nhau học tập, động viên lúc khó khăn. Thực trạng: nhiều tình bạn đẹp; một số bạn lợi dụng bạn bè, bè phái, bạo lực học đường làm xấu đi tình bạn. Nguyên nhân: ích kỉ, ảnh hưởng xấu, thiếu kĩ năng ứng xử. Bàn luận: tình bạn đẹp là tài sản quý; cần chọn bạn tốt, chân thành, biết tha thứ. Dẫn chứng: đôi bạn cùng tiến, tấm gương giúp bạn vượt khó. Giải pháp: mỗi người chân thành, tôn trọng; nhà trường giáo dục kĩ năng sống. Kết bài: khẳng định, nhắn nhủ. BÀI MẪU: Tuổi học trò là quãng đời đẹp nhất, và làm nên vẻ đẹp ấy không thể thiếu tình bạn trong sáng. Tình bạn tuổi học trò là thứ tình cảm thiêng liêng cần được trân trọng, giữ gìn. Tình bạn trong sáng là mối quan hệ chân thành, vô tư giữa những người bạn: cùng chia sẻ niềm vui, nỗi buồn; giúp nhau trong học tập; động viên nhau vượt qua khó khăn; nhắc nhở nhau khi bạn mắc lỗi. Một tình bạn đẹp không vụ lợi, không toan tính mà được xây nên bằng sự tin tưởng và tôn trọng lẫn nhau. Thực tế quanh ta có biết bao tình bạn đáng quý: những đôi bạn cùng tiến dìu nhau từ học yếu thành học giỏi; những nhóm bạn quyên góp giúp bạn nghèo vượt khó; những lời động viên kịp thời giúp bạn đứng dậy sau thất bại. Thế nhưng, cũng có những biểu hiện làm xấu đi tình bạn: lợi dụng bạn bè để chép bài, quay cóp; bè phái, tẩy chay; thậm chí bạo lực học đường. Nguyên nhân một phần do tính ích kỉ, thích thể hiện; một phần do thiếu kĩ năng ứng xử và sự buông lỏng giáo dục. Tình bạn đẹp là tài sản vô giá của tuổi trẻ: nó sưởi ấm tâm hồn, tiếp thêm nghị lực và để lại kỉ niệm theo ta suốt đời. Vì vậy, mỗi người hãy biết chọn bạn mà chơi — chọn những người bạn tốt, sống chân thành; hãy chân thành, biết lắng nghe, biết tha thứ và sẵn sàng giúp đỡ bạn. Nhà trường cần tăng cường giáo dục kĩ năng sống, xây dựng môi trường thân thiện. Hãy gìn giữ tình bạn trong sáng như gìn giữ những năm tháng học trò tươi đẹp nhất — bởi bạn tốt là món quà quý giá mà cuộc đời ban tặng."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyễn Trãi được minh oan dưới triều vua nào?", "options": ["A. Lê Lợi", "B. Lê Thánh Tông", "C. Lê Thái Tông", "D. Lê Nhân Tông"], "answer": "B", "points": 0.25, "explain": "Đến đời vua Lê Thánh Tông, vụ án oan Lệ Chi viên mới được làm sáng tỏ, Nguyễn Trãi được minh oan và truy tặng."}, {"type": "mcq", "level": "NB", "q": "Bài thơ nào sau đây là thơ chữ Hán của Nguyễn Trãi?", "options": ["A. Bảo kính cảnh giới", "B. Ngôn chí", "C. Dục Thúy sơn", "D. Cả ba đều là thơ Nôm"], "answer": "C", "points": 0.25, "explain": "Dục Thúy sơn là thơ chữ Hán (Ức Trai thi tập). Bảo kính cảnh giới và Ngôn chí là thơ Nôm (Quốc âm thi tập)."}, {"type": "mcq", "level": "TH", "q": "Phần kết của Bình Ngô đại cáo có ý nghĩa gì?", "options": ["A. Kể tội giặc thêm một lần nữa", "B. Tuyên bố nền độc lập, xã tắc vững bền và nêu bài học giữ nước", "C. Ca ngợi cảnh đẹp quê hương", "D. Tỏ lòng nhớ bạn bè"], "answer": "B", "points": 0.25, "explain": "Phần kết tuyên bố chiến tranh kết thúc, nền độc lập được khẳng định, xã tắc từ đây vững bền; đồng thời nêu bài học: phải luôn cảnh giác, chăm lo giữ nước."}, {"type": "mcq", "level": "TH", "q": "Khi viết văn bản nghị luận về một vấn đề xã hội, mở bài cần làm gì?", "options": ["A. Kể chi tiết một câu chuyện dài", "B. Giới thiệu vấn đề nghị luận và nêu quan điểm khái quát", "C. Đưa ngay giải pháp chi tiết", "D. Chép lại đề bài"], "answer": "B", "points": 0.25, "explain": "Mở bài có nhiệm vụ giới thiệu vấn đề cần nghị luận và nêu quan điểm, thái độ khái quát của người viết về vấn đề đó."}, {"type": "mcq", "level": "VDC", "q": "Vì sao thơ Nôm của Nguyễn Trãi (Quốc âm thi tập) có ý nghĩa đặc biệt?", "options": ["A. Vì viết bằng chữ Hán khó hiểu", "B. Vì mở đường cho thơ Nôm phát triển, gần gũi với lời ăn tiếng nói dân tộc", "C. Vì chỉ viết về đề tài chiến tranh", "D. Vì được UNESCO công nhận"], "answer": "B", "points": 0.25, "explain": "Quốc âm thi tập là tập thơ Nôm sớm, có giá trị mở đường: đưa chữ Nôm vào thơ ca bác học, gần gũi với ngôn ngữ dân tộc, tạo tiền đề cho thơ Nôm các thế kỉ sau."}, {"type": "short", "level": "NB", "q": "Cha của Nguyễn Trãi tên là gì?", "answer": "Nguyễn Phi Khanh", "points": 0.5, "explain": "Cha Nguyễn Trãi là Nguyễn Phi Khanh, một nhà nho yêu nước; thầy học và ông ngoại của ông là Trần Nguyên Đán."}, {"type": "short", "level": "TH", "q": "Nêu nội dung chính của phần 1 trong bố cục Bình Ngô đại cáo.", "answer": "Nêu luận đề chính nghĩa: nhân nghĩa, yên dân và chân lí độc lập dân tộc", "points": 0.5, "explain": "Phần 1 nêu luận đề: việc nhân nghĩa cốt ở yên dân; khẳng định nước ta có nền văn hiến, chủ quyền riêng — đặt nền tảng lí luận cho toàn bài."}, {"type": "short", "level": "VD", "q": "Phân biệt sắc thái sử dụng của từ Hán Việt và từ thuần Việt trong giao tiếp hằng ngày.", "answer": "Từ Hán Việt trang trọng, cổ kính; từ thuần Việt gần gũi, tự nhiên", "points": 0.5, "explain": "Từ Hán Việt mang sắc thái trang trọng, thích hợp văn bản nghiêm túc; trong giao tiếp hằng ngày nên dùng từ thuần Việt gần gũi, tự nhiên, tránh lạm dụng từ Hán Việt gây xa cách, khó hiểu."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày suy nghĩ của em về bài học giữ nước được nêu ở cuối Bình Ngô đại cáo.", "points": 0, "explain": "DÀN Ý: Mở đoạn: phần kết bài cáo — tuyên bố độc lập và bài học. Thân đoạn: bài học: chiến thắng đã giành được nhưng phải luôn cảnh giác, chăm lo xây dựng đất nước, đoàn kết; liên hệ hôm nay: giữ nước bằng xây dựng đất nước giàu mạnh, bảo vệ chủ quyền, cảnh giác trước âm mưu xâm phạm. Kết đoạn: bài học còn nguyên giá trị. BÀI MẪU: Cuối Bình Ngô đại cáo, sau khi tuyên bố nền độc lập, Nguyễn Trãi nêu bài học sâu sắc về việc giữ nước: chiến thắng đã giành được, nhưng muốn xã tắc vững bền thì phải luôn cảnh giác, chăm lo việc nước, đoàn kết một lòng. Bài học ấy cho thấy tầm nhìn xa của người anh hùng: dựng nước đã khó, giữ nước càng khó hơn. Thắng giặc bằng gươm súng, giữ nước bằng đức trị, bằng sự đồng lòng của toàn dân. Liên hệ hôm nay, bài học vẫn vẹn nguyên giá trị. Đất nước ta đã độc lập, nhưng nhiệm vụ bảo vệ Tổ quốc chưa bao giờ kết thúc: bảo vệ vững chắc chủ quyền biển đảo, biên giới; xây dựng đất nước giàu mạnh để không kẻ thù nào dám nhòm ngó; mỗi công dân nêu cao cảnh giác trước các âm mưu chống phá. Với học sinh chúng em, giữ nước hôm nay là học tập tốt, rèn luyện đạo đức, sống có trách nhiệm với cộng đồng — góp phần làm cho đất nước mạnh lên từ bên trong. Lời răn của Nguyễn Trãi cách đây sáu thế kỉ vẫn như tiếng chuông cảnh tỉnh, nhắc nhở mỗi thế hệ: độc lập phải đi đôi với tự cường."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề xã hội: Sống có trách nhiệm với bản thân và cộng đồng.", "points": 0, "explain": "DÀN Ý: Mở bài: trách nhiệm là phẩm chất cần thiết của con người hiện đại. Thân bài: Giải thích: sống có trách nhiệm là ý thức về bổn phận, dám làm dám chịu, quan tâm đến người khác và xã hội. Biểu hiện: với bản thân (học tập, rèn luyện, giữ gìn sức khỏe); với gia đình (hiếu thảo, chia sẻ); với cộng đồng (tuân thủ pháp luật, bảo vệ môi trường, giúp đỡ người khác). Thực trạng: nhiều bạn sống trách nhiệm; một bộ phận vô trách nhiệm (ỷ lại, đổ lỗi, vi phạm). Nguyên nhân: được nuông chiều, thiếu giáo dục, lối sống ích kỉ. Hậu quả: ảnh hưởng tương lai bản thân, gánh nặng xã hội. Giải pháp: tự rèn luyện từ việc nhỏ; gia đình, nhà trường giáo dục. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Sống có trách nhiệm là một trong những phẩm chất quan trọng nhất của con người hiện đại, là thước đo nhân cách của mỗi cá nhân. Sống có trách nhiệm nghĩa là ý thức rõ bổn phận của mình, dám làm dám chịu về hành động của bản thân, đồng thời quan tâm đến những người xung quanh và cộng đồng. Với bản thân, trách nhiệm thể hiện ở việc chăm chỉ học tập, rèn luyện sức khỏe, xây dựng ước mơ và nỗ lực thực hiện. Với gia đình, đó là lòng hiếu thảo, biết chia sẻ việc nhà, không để cha mẹ phải lo lắng. Với cộng đồng, đó là tuân thủ pháp luật, giữ gìn vệ sinh chung, bảo vệ môi trường, sẵn sàng giúp đỡ người gặp khó khăn. Thực tế có nhiều tấm gương sáng: những bạn học sinh vừa học giỏi vừa tích cực làm từ thiện; những bạn trẻ khởi nghiệp tạo việc làm cho cộng đồng. Nhưng đáng buồn là vẫn còn không ít bạn sống thiếu trách nhiệm: học hành ỷ lại, đổ lỗi cho hoàn cảnh; vi phạm nội quy; thờ ơ trước nỗi đau của người khác; thậm chí vi phạm pháp luật. Nguyên nhân một phần do được nuông chiều quá mức, một phần do giáo dục ý thức trách nhiệm chưa được chú trọng, cộng với lối sống ích kỉ, chỉ biết hưởng thụ. Hậu quả là tương lai của chính các bạn bị ảnh hưởng, đồng thời trở thành gánh nặng cho gia đình và xã hội. Để rèn luyện tinh thần trách nhiệm, mỗi người hãy bắt đầu từ những việc nhỏ nhất: hoàn thành bài tập đúng hạn, giữ lời hứa, nhận lỗi khi sai và sửa chữa. Gia đình cần giao việc phù hợp để con tự lập; nhà trường tổ chức các hoạt động tập thể để học sinh học cách chịu trách nhiệm. Một xã hội văn minh được xây nên từ những công dân có trách nhiệm. Hãy sống có trách nhiệm từ hôm nay — với chính mình, với gia đình và với cộng đồng."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Tác phẩm nào sau đây KHÔNG phải của Nguyễn Trãi?", "options": ["A. Bình Ngô đại cáo", "B. Quốc âm thi tập", "C. Truyện Kiều", "D. Dư địa chí"], "answer": "C", "points": 0.25, "explain": "Truyện Kiều là của Nguyễn Du (thế kỉ XIX). Các tác phẩm của Nguyễn Trãi gồm Bình Ngô đại cáo, Quốc âm thi tập, Ức Trai thi tập, Dư địa chí..."}, {"type": "mcq", "level": "NB", "q": "Trong bài văn nghị luận xã hội, kết bài có nhiệm vụ gì?", "options": ["A. Kể thêm một câu chuyện mới", "B. Khẳng định lại quan điểm, gửi gắm thông điệp, kêu gọi hành động", "C. Đưa ra thật nhiều số liệu", "D. Phê phán gay gắt đối tượng"], "answer": "B", "points": 0.25, "explain": "Kết bài khẳng định lại quan điểm đã trình bày, gửi gắm thông điệp và kêu gọi hành động, tạo dư âm cho người đọc."}, {"type": "mcq", "level": "TH", "q": "Giọng điệu chủ đạo của Bình Ngô đại cáo là gì?", "options": ["A. Hài hước, châm biếm", "B. Buồn bã, bi lụy", "C. Hùng hồn, trang trọng; khi căm phẫn, khi hào sảng", "D. Lãnh đạm, thờ ơ"], "answer": "C", "points": 0.25, "explain": "Bài cáo có giọng điệu hùng hồn, trang trọng của một bản tuyên ngôn: căm phẫn khi tố giặc, hào sảng khi kể chiến thắng, trang nghiêm khi tuyên bố độc lập."}, {"type": "mcq", "level": "TH", "q": "Chi tiết nào cho thấy Nguyễn Trãi là người luôn canh cánh việc dân?", "options": ["A. Ông thích ngắm cảnh đẹp", "B. Ông ước có đàn vua Thuấn để gảy khúc Nam phong cho dân giàu đủ", "C. Ông về ở ẩn tại Côn Sơn", "D. Ông đỗ Thái học sinh năm 1400"], "answer": "B", "points": 0.25, "explain": "Ước mong có đàn vua Thuấn gảy khúc Nam phong để dân giàu đủ khắp mọi phương cho thấy tấm lòng ưu dân tha thiết, lúc nào cũng nghĩ đến cuộc sống của nhân dân."}, {"type": "mcq", "level": "VDC", "q": "Vì sao nói Nguyễn Trãi là sự thống nhất giữa anh hùng dân tộc và thi nhân?", "options": ["A. Vì ông vừa cầm quân đánh giặc vừa làm thơ", "B. Vì trong con người ông, lòng yêu nước, chí khí anh hùng hòa quyện với tâm hồn nghệ sĩ tinh tế, nhạy cảm", "C. Vì ông được cả vua và dân yêu mến", "D. Vì ông sống rất lâu"], "answer": "B", "points": 0.25, "explain": "Nguyễn Trãi vừa là nhà chính trị, quân sự lỗi lạc (anh hùng) vừa là thi nhân tài hoa với tâm hồn tinh tế trước thiên nhiên và nỗi niềm thế sự — hai phẩm chất hòa quyện làm nên tầm vóc lớn lao của ông."}, {"type": "short", "level": "NB", "q": "Bình Ngô đại cáo được đánh giá là áng văn như thế nào?", "answer": "Thiên cổ hùng văn", "points": 0.5, "explain": "Bình Ngô đại cáo được ngợi ca là áng thiên cổ hùng văn — bài văn hùng tráng còn mãi với nghìn đời."}, {"type": "short", "level": "TH", "q": "Nêu tên hai biện pháp tu từ tiêu biểu trong thơ Nguyễn Trãi đã học.", "answer": "Điển cố và liệt kê (hoặc đối, phóng đại, so sánh)", "points": 0.5, "explain": "Thơ văn Nguyễn Trãi giàu biện pháp tu từ: điển cố (đàn vua Thuấn), liệt kê dồn dập, đối xứng, phóng đại, so sánh — tạo sức biểu cảm mạnh mẽ."}, {"type": "short", "level": "VD", "q": "Giải thích nghĩa của từ Hán Việt nhân nghĩa bằng cách tách các yếu tố cấu tạo.", "answer": "Nhân là người, là lòng thương người; nghĩa là lẽ phải, điều đúng đắn", "points": 0.5, "explain": "Nhân nghĩa: nhân (người, lòng thương người) + nghĩa (lẽ phải). Trong Bình Ngô đại cáo, nhân nghĩa được hiểu là thương dân, lấy việc yên dân làm gốc."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu cảm nhận của em về bức tranh thiên nhiên trong thơ Nguyễn Trãi (qua Bảo kính cảnh giới bài 43 hoặc Dục Thúy sơn).", "points": 0, "explain": "DÀN Ý: Mở đoạn: giới thiệu bài thơ chọn phân tích. Thân đoạn: bức tranh thiên nhiên (ngày hè rực rỡ / núi sông hữu tình) qua hình ảnh, từ ngữ giàu sức gợi; bút pháp chấm phá, tả cảnh ngụ tình; tâm hồn yêu thiên nhiên tinh tế của nhà thơ. Kết đoạn: thiên nhiên là tấm gương soi tâm hồn thi nhân. BÀI MẪU: Thiên nhiên trong thơ Nguyễn Trãi hiện lên vừa rực rỡ vừa trầm lắng, luôn gắn với tâm sự của nhà thơ. Trong Bảo kính cảnh giới (bài 43), đó là bức tranh ngày hè căng tràn sức sống: sắc màu tươi thắm, âm thanh rộn rã, mọi vật như đang cựa quậy sinh sôi dưới nắng hè. Từ ngữ giàu sức gợi, nhịp thơ sôi động cho thấy một tâm hồn yêu đời, gắn bó máu thịt với quê hương. Còn trong Dục Thúy sơn, thiên nhiên lại mang vẻ đẹp sơn thủy hữu tình, trầm mặc: núi soi bóng nước, không gian khoáng đạt gợi nỗi hoài cổ. Điểm chung là bút pháp tả cảnh ngụ tình tài tình: không câu thơ nào chỉ đơn thuần tả cảnh, mà cảnh nào cũng thấm đượm tình — tình yêu quê hương, nỗi lo cho dân, suy ngẫm về đời. Qua bức tranh thiên nhiên, ta thấy một Nguyễn Trãi vừa là nghệ sĩ tinh tế, vừa là con người nặng lòng với non sông, đất nước. Thiên nhiên trong thơ ông không chỉ để ngắm mà còn là nơi gửi gắm tâm sự, là tấm gương soi chiếu tâm hồn thi nhân."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề xã hội: Lòng trung thực trong học tập và thi cử.", "points": 0, "explain": "DÀN Ý: Mở bài: trung thực là phẩm chất quý; vấn đề gian lận trong học tập, thi cử. Thân bài: Giải thích: trung thực trong học tập là tự làm bài bằng năng lực thật. Thực trạng: nhiều bạn chăm chỉ, thật thà; một bộ phận quay cóp, dùng tài liệu, mua điểm, làm bài hộ. Nguyên nhân: áp lực điểm số, lười học, bệnh thành tích. Hậu quả: kiến thức rỗng, mất niềm tin, ảnh hưởng tương lai; làm méo mó giá trị giáo dục. Bàn luận: điểm số thật dù thấp còn quý hơn điểm cao giả dối. Dẫn chứng: tấm gương thật thà; vụ việc gian lận bị xử lí. Giải pháp: tự rèn luyện; nhà trường coi trọng thực chất, xử lí nghiêm; gia đình không gây áp lực điểm số. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Lòng trung thực là phẩm chất cao quý của con người, là nền tảng của mọi thành công bền vững. Trong học tập và thi cử, trung thực càng trở thành vấn đề nóng bỏng khi tình trạng gian lận vẫn diễn ra ở nhiều nơi. Trung thực trong học tập nghĩa là làm bài bằng chính năng lực của mình, không quay cóp, không dùng tài liệu trái phép, không nhờ người làm hộ. Đáng mừng là đa số học sinh vẫn chăm chỉ, thật thà, coi mỗi kì thi là thước đo đúng năng lực để phấn đấu. Thế nhưng, vẫn còn một bộ phận quay cóp trong giờ kiểm tra, mang tài liệu vào phòng thi, thậm chí mua điểm, thuê người học hộ. Nguyên nhân một phần do áp lực điểm số, bệnh thành tích; một phần do lười học, muốn hưởng thành quả mà không chịu cố gắng. Hậu quả thật nặng nề: kiến thức rỗng tuếch, đến khi ra đời không đáp ứng được công việc; mất niềm tin của thầy cô, bạn bè; lâu dài làm méo mó giá trị của giáo dục, tạo ra những con người dối trá. Cần nhớ rằng điểm số thật dù thấp còn đáng quý hơn điểm cao giả dối gấp trăm lần — vì điểm thật phản ánh đúng năng lực để ta biết mình thiếu gì mà bổ sung. Để đẩy lùi gian lận, mỗi học sinh hãy tự rèn cho mình thói quen học thật, thi thật; nhà trường cần đánh giá thực chất và xử lí nghiêm vi phạm; gia đình đừng gây áp lực điểm số mà hãy động viên con cố gắng. Trung thực hôm nay là hành trang cho thành công ngày mai. Hãy để mỗi điểm số đều là mồ hôi, công sức thật của chính mình — đó mới là niềm tự hào đích thực."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyễn Trãi sinh tại đâu?", "options": ["A. Nhị Khê", "B. Thăng Long", "C. Côn Sơn", "D. Lam Sơn"], "answer": "B", "points": 0.25, "explain": "Nguyễn Trãi sinh tại Thăng Long; quê gốc ở Nhị Khê (Thường Tín); sau về ở ẩn tại Côn Sơn."}, {"type": "mcq", "level": "NB", "q": "Phần Thực hành đọc của Bài 6 gồm những văn bản nào?", "options": ["A. Ngôn chí và Bạch Đằng hải khẩu", "B. Bảo kính cảnh giới và Dục Thúy sơn", "C. Bình Ngô đại cáo và Nam quốc sơn hà", "D. Chinh phụ ngâm và Cung oán ngâm"], "answer": "A", "points": 0.25, "explain": "Phần Thực hành đọc gồm Ngôn chí (bài 3, thơ Nôm) và Bạch Đằng hải khẩu (thơ chữ Hán)."}, {"type": "mcq", "level": "TH", "q": "Bài thơ Ngôn chí (bài 3) thể hiện chí hướng, nhân cách nào của Nguyễn Trãi?", "options": ["A. Mưu cầu công danh, phú quý", "B. Thanh cao, không màng danh lợi, giữ lòng trong sạch", "C. Buồn chán, bi quan về thời cuộc", "D. Thích phiêu du sơn thủy"], "answer": "B", "points": 0.25, "explain": "Ngôn chí (nói chí hướng) bày tỏ nhân cách thanh cao: không màng danh lợi phù phiếm, giữ lòng trong sạch, ngay thẳng giữa thời cuộc nhiễu nhương."}, {"type": "mcq", "level": "TH", "q": "Từ Hán Việt trong câu Việc nhân nghĩa cốt ở yên dân gồm những từ nào?", "options": ["A. Việc, ở", "B. Nhân nghĩa, yên dân", "C. Cốt, ở", "D. Không có từ Hán Việt"], "answer": "B", "points": 0.25, "explain": "Nhân nghĩa và yên dân là từ Hán Việt (nhân: người; nghĩa: lẽ phải; yên: yên ổn; dân: nhân dân), tạo sắc thái trang trọng cho luận đề."}, {"type": "mcq", "level": "VDC", "q": "Điểm chung về tư tưởng của Nguyễn Trãi qua Bình Ngô đại cáo và Bảo kính cảnh giới (bài 43) là gì?", "options": ["A. Đều ca ngợi chiến thắng quân sự", "B. Đều lấy dân làm gốc: thương dân, lo cho dân được yên ổn, ấm no", "C. Đều bày tỏ nỗi buồn cá nhân", "D. Đều viết về đề tài ẩn dật"], "answer": "B", "points": 0.25, "explain": "Cả hai tác phẩm đều thấm đượm tư tưởng lấy dân làm gốc: Bình Ngô đại cáo nêu việc nhân nghĩa cốt ở yên dân; Bảo kính cảnh giới ước dân giàu đủ — tấm lòng ưu dân nhất quán."}, {"type": "short", "level": "NB", "q": "Kể tên hai tập thơ của Nguyễn Trãi (một chữ Hán, một chữ Nôm).", "answer": "Ức Trai thi tập (chữ Hán) và Quốc âm thi tập (chữ Nôm)", "points": 0.5, "explain": "Ức Trai thi tập gồm thơ chữ Hán; Quốc âm thi tập gồm thơ Nôm — hai di sản thơ ca lớn của Nguyễn Trãi."}, {"type": "short", "level": "TH", "q": "Nêu tác dụng của việc sử dụng điển cố trong thơ văn Nguyễn Trãi.", "answer": "Tạo sắc thái cổ kính, trang trọng; gửi gắm ý nghĩa sâu xa một cách hàm súc", "points": 0.5, "explain": "Điển cố (đàn vua Thuấn, các triều đại...) vừa tạo sắc thái cổ kính, trang trọng vừa giúp diễn đạt hàm súc những tư tưởng, khát vọng sâu xa."}, {"type": "short", "level": "VD", "q": "Muốn viết tốt văn bản nghị luận về một vấn đề xã hội, người viết cần chuẩn bị những gì?", "answer": "Hiểu rõ vấn đề; luận điểm rõ ràng; dẫn chứng cụ thể, tiêu biểu, cập nhật; lập luận chặt chẽ", "points": 0.5, "explain": "Cần nắm vững vấn đề, xác định luận điểm rõ ràng, chuẩn bị dẫn chứng cụ thể tiêu biểu cập nhật, sắp xếp lập luận chặt chẽ theo bố cục ba phần."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ bàn về ý nghĩa của việc học tập tấm gương Nguyễn Trãi đối với thế hệ trẻ hôm nay.", "points": 0, "explain": "DÀN Ý: Mở đoạn: Nguyễn Trãi — tấm gương sáng. Thân đoạn: học lòng yêu nước, thương dân (đặt lợi ích dân tộc lên trên); học ý chí vượt khó, kiên cường (từ gian khổ đến thắng lợi); học nhân cách thanh cao, trung thực (Ngôn chí); học tinh thần ham học, tài năng toàn diện. Kết đoạn: noi gương bằng hành động cụ thể hôm nay. BÀI MẪU: Nguyễn Trãi là tấm gương sáng ngời để thế hệ trẻ hôm nay học tập và noi theo. Trước hết, ta học ở ông lòng yêu nước, thương dân tha thiết: cả cuộc đời ông gắn với vận mệnh dân tộc, từ việc phò Lê Lợi đánh giặc cứu nước đến ước mong dân giàu đủ trong thơ. Đó là bài học về việc đặt lợi ích của Tổ quốc, của nhân dân lên trên lợi ích cá nhân. Thứ hai, ta học ở ông ý chí kiên cường vượt qua gian khổ: từ buổi đầu khởi nghĩa thiếu thốn trăm bề đến thắng lợi vẻ vang — không khó khăn nào khuất phục được người có lí tưởng. Thứ ba, ta học ở ông nhân cách thanh cao, trung thực như trong Ngôn chí: không màng danh lợi, giữ lòng trong sạch giữa bao cám dỗ. Cuối cùng, ta học ở ông tinh thần ham học và tài năng toàn diện: văn võ song toàn, am hiểu nhiều lĩnh vực. Noi gương Nguyễn Trãi hôm nay không phải là điều gì xa vời: đó là học tập chăm chỉ, sống trung thực, biết quan tâm đến cộng đồng, sẵn sàng cống hiến cho đất nước. Mỗi việc tốt ta làm hôm nay chính là cách thiết thực nhất để tiếp nối truyền thống của cha ông."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề xã hội: Ứng xử có văn hóa trên mạng xã hội.", "points": 0, "explain": "DÀN Ý: Mở bài: mạng xã hội phổ biến; vấn đề ứng xử văn hóa. Thân bài: Giải thích: ứng xử có văn hóa là lịch sự, tôn trọng, có trách nhiệm khi tham gia mạng. Thực trạng: nhiều bạn dùng mạng tích cực (học tập, lan tỏa điều tốt); một bộ phận bình luận ác ý, tung tin giả, bắt nạt trực tuyến, khoe khoang phản cảm. Nguyên nhân: ẩn danh, thiếu hiểu biết pháp luật, đua theo trào lưu, thiếu giáo dục. Hậu quả: tổn thương tinh thần, mất uy tín, vi phạm pháp luật; làm xấu môi trường mạng. Giải pháp: tự rèn luyện (nghĩ kĩ trước khi đăng, tôn trọng người khác); nhà trường, gia đình giáo dục; xử lí nghiêm vi phạm. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Mạng xã hội đã trở thành một phần không thể thiếu trong đời sống giới trẻ. Bên cạnh những lợi ích to lớn, cách ứng xử của một bộ phận người dùng trên không gian mạng đang là vấn đề đáng báo động. Ứng xử có văn hóa trên mạng xã hội nghĩa là giao tiếp lịch sự, tôn trọng người khác, chịu trách nhiệm về những gì mình đăng tải, không làm tổn hại đến ai. Thực tế có nhiều bạn trẻ dùng mạng rất văn minh: chia sẻ kiến thức học tập, lan tỏa hành động đẹp, tham gia các chiến dịch nhân ái. Thế nhưng, mặt trái cũng không ít: bình luận ác ý, miệt thị người khác; tung tin giả, tin sai sự thật gây hoang mang; bắt nạt trực tuyến khiến nạn nhân trầm cảm, thậm chí tìm đến cái chết; khoe khoang lối sống phản cảm, câu view bằng mọi giá. Nguyên nhân một phần do tính ẩn danh khiến nhiều người buông thả; một phần do thiếu hiểu biết pháp luật về an ninh mạng; cộng với tâm lí đua theo trào lưu và sự thiếu vắng giáo dục kĩ năng số. Hậu quả rất nghiêm trọng: nạn nhân bị tổn thương tinh thần nặng nề; người vi phạm mất uy tín, có thể bị xử phạt hành chính, thậm chí truy cứu hình sự; môi trường mạng trở nên độc hại. Để xây dựng không gian mạng lành mạnh, mỗi người hãy tự rèn luyện: suy nghĩ kĩ trước khi đăng hay bình luận, đặt mình vào vị trí người khác, không chia sẻ thông tin chưa kiểm chứng. Nhà trường cần giáo dục kĩ năng số và đạo đức mạng; gia đình quan tâm, định hướng con em. Pháp luật cũng cần được thực thi nghiêm minh với các hành vi vi phạm. Mạng xã hội là con dao hai lưỡi — hãy dùng nó một cách văn minh để nó phục vụ cuộc sống tốt đẹp hơn, thay vì biến nó thành nơi gieo rắc tổn thương."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Dòng nào liệt kê đúng các văn bản đọc chính của Bài 6?", "options": ["A. Bình Ngô đại cáo, Bảo kính cảnh giới (bài 43), Dục Thúy sơn", "B. Truyện Kiều, Chinh phụ ngâm, Cung oán ngâm", "C. Nam quốc sơn hà, Hịch tướng sĩ, Bình Ngô đại cáo", "D. Tỏ lòng, Thuật hoài, Bạch Đằng giang phú"], "answer": "A", "points": 0.25, "explain": "Ba văn bản đọc chính của Bài 6 là Bình Ngô đại cáo, Bảo kính cảnh giới (bài 43) và Dục Thúy sơn; ngoài ra có phần Thực hành đọc: Ngôn chí, Bạch Đằng hải khẩu."}, {"type": "mcq", "level": "NB", "q": "Kiểu bài viết của Bài 6 là gì?", "options": ["A. Văn bản nghị luận về một vấn đề xã hội", "B. Bài thơ Đường luật", "C. Văn bản nội quy", "D. Bài luận về bản thân"], "answer": "A", "points": 0.25, "explain": "Kiểu bài viết của Bài 6 là văn bản nghị luận về một vấn đề xã hội — bàn luận một hiện tượng đời sống bằng lí lẽ và dẫn chứng thuyết phục."}, {"type": "mcq", "level": "TH", "q": "Câu nào dưới đây sử dụng từ Hán Việt SAI sắc thái?", "options": ["A. Hội nghị đã ra nghị quyết quan trọng.", "B. Bài cáo khẳng định nền độc lập của dân tộc.", "C. Ê, mày đi đâu mà tử tế thế?", "D. Lòng yêu nước là truyền thống quý báu."], "answer": "C", "points": 0.25, "explain": "Tử tế là từ Hán Việt mang sắc thái trang trọng; dùng trong câu nói suồng sã Ê, mày... là sai sắc thái, gây kệch cỡm."}, {"type": "mcq", "level": "TH", "q": "Nội dung nào KHÔNG thuộc phần Thân bài của văn bản nghị luận xã hội?", "options": ["A. Giải thích vấn đề", "B. Phân tích nguyên nhân, hậu quả", "C. Giới thiệu vấn đề và nêu quan điểm khái quát", "D. Đề xuất giải pháp"], "answer": "C", "points": 0.25, "explain": "Giới thiệu vấn đề và nêu quan điểm khái quát là nhiệm vụ của Mở bài, không phải Thân bài."}, {"type": "mcq", "level": "VDC", "q": "Từ các văn bản Bài 6, có thể rút ra phương pháp đọc hiểu văn bản trung đại nào?", "options": ["A. Chỉ cần đọc lướt, không cần chú thích", "B. Kết hợp hiểu thể loại, chú thích từ khó, bối cảnh lịch sử và phân tích nghệ thuật – nội dung", "C. Chỉ học thuộc lòng văn bản", "D. Bỏ qua phần chú thích vì không quan trọng"], "answer": "B", "points": 0.25, "explain": "Đọc hiểu văn bản trung đại cần: nắm thể loại (cáo, thơ Đường luật), đọc kĩ chú thích (từ Hán Việt, điển cố), đặt văn bản trong bối cảnh lịch sử, rồi phân tích nghệ thuật gắn với nội dung, tư tưởng."}, {"type": "short", "level": "NB", "q": "Phần thảo luận (Nói và nghe) của Bài 6 bàn về vấn đề gì?", "answer": "Thảo luận về một vấn đề xã hội có ý kiến khác nhau", "points": 0.5, "explain": "Phần Nói và nghe của Bài 6 là thảo luận về một vấn đề xã hội có ý kiến khác nhau — rèn kĩ năng tranh luận, bảo vệ quan điểm."}, {"type": "short", "level": "TH", "q": "Nêu hai nét chính về nghệ thuật thơ chữ Hán của Nguyễn Trãi qua Dục Thúy sơn.", "answer": "Ngôn ngữ hàm súc; bút pháp chấm phá, tả cảnh ngụ tình", "points": 0.5, "explain": "Thơ chữ Hán Nguyễn Trãi hàm súc, mỗi chữ đắt giá; bút pháp chấm phá gợi hơn tả; nghệ thuật tả cảnh ngụ tình nhuần nhuyễn."}, {"type": "short", "level": "VD", "q": "Vì sao Bình Ngô đại cáo được xếp sau Nam quốc sơn hà trong các bản tuyên ngôn độc lập?", "answer": "Vì Nam quốc sơn hà ra đời trước (thời Lý), khẳng định chủ quyền đầu tiên", "points": 0.5, "explain": "Nam quốc sơn hà (thời Lý, thế kỉ XI) là bản tuyên ngôn độc lập đầu tiên; Bình Ngô đại cáo (1428) kế tiếp, nên được coi là bản tuyên ngôn thứ hai."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ cảm nhận về câu luận đề Việc nhân nghĩa cốt ở yên dân trong Bình Ngô đại cáo.", "points": 0, "explain": "DÀN Ý: Mở đoạn: vị trí câu luận đề trong bài cáo. Thân đoạn: giải thích: nhân nghĩa là thương dân, lấy dân làm gốc; yên dân là mục đích cao nhất; tư tưởng tiến bộ, vượt thời đại phong kiến (vua chúa thường lấy mình làm trung tâm); là cơ sở đạo lí cho cuộc kháng chiến chính nghĩa. Kết đoạn: giá trị lâu dài — bài học lấy dân làm gốc cho hôm nay. BÀI MẪU: Câu luận đề Việc nhân nghĩa cốt ở yên dân là linh hồn của toàn bộ Bình Ngô đại cáo, thể hiện tư tưởng tiến bộ vượt thời đại của Nguyễn Trãi. Nhân nghĩa ở đây không phải đạo lí chung chung mà cụ thể là thương dân, lo cho dân; yên dân — làm cho dân được sống yên ổn — chính là mục đích cao nhất, là thước đo của mọi hành động. Trong xã hội phong kiến coi vua là trung tâm, việc đặt nhân dân lên vị trí cao nhất như vậy là một tư tưởng vô cùng mới mẻ và nhân văn. Từ luận đề này, Nguyễn Trãi có cơ sở đạo lí vững chắc để tố cáo giặc Minh (kẻ làm khổ dân là phi nghĩa) và khẳng định tính chính nghĩa của cuộc kháng chiến (đánh giặc để cứu dân là nhân nghĩa). Luận đề còn mang tính chiến lược: muốn thắng giặc, phải được lòng dân; muốn giữ nước, phải làm cho dân yên. Trải qua sáu thế kỉ, tư tưởng lấy dân làm gốc vẫn là bài học quý: mọi chủ trương, chính sách hôm nay đều phải hướng tới cuộc sống ấm no, hạnh phúc của nhân dân — đó mới là nền tảng vững bền nhất của đất nước."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề xã hội: Lòng nhân ái trong cuộc sống hôm nay.", "points": 0, "explain": "DÀN Ý: Mở bài: nhân ái là truyền thống quý; vấn đề: lòng nhân ái hôm nay. Thân bài: Giải thích: nhân ái là yêu thương, sẵn sàng giúp đỡ người khác. Biểu hiện: giúp người khó khăn, hiến máu, từ thiện, cứu người gặp nạn. Thực trạng: nhiều tấm gương (mạnh thường quân, tình nguyện viên); một bộ phận vô cảm, thờ ơ, thậm chí trục lợi từ thiện. Nguyên nhân: lối sống thực dụng, ích kỉ; thiếu giáo dục; một số vụ lợi dụng từ thiện gây mất niềm tin. Bàn luận: nhân ái làm xã hội ấm áp; cần giúp đúng cách, tránh bị lợi dụng. Dẫn chứng: các chương trình từ thiện, tấm gương người tốt việc tốt. Giải pháp: giáo dục từ gia đình, nhà trường; mỗi người hành động từ việc nhỏ. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Từ ngàn xưa, dân tộc ta đã coi lòng nhân ái là đạo lí làm người: thương người như thể thương thân, lá lành đùm lá rách. Trong cuộc sống hôm nay, lòng nhân ái vẫn là ngọn lửa sưởi ấm tình người, cần được giữ gìn và lan tỏa. Nhân ái là tình yêu thương con người, là sự sẵn sàng chia sẻ, giúp đỡ những người gặp khó khăn, hoạn nạn mà không toan tính vụ lợi. Biểu hiện của lòng nhân ái rất đa dạng: giúp đỡ người nghèo, người già neo đơn; hiến máu cứu người; tham gia các chương trình từ thiện, tình nguyện; cứu giúp người gặp nạn trên đường. Thực tế có biết bao tấm gương sáng: những mạnh thường quân âm thầm giúp đỡ hàng nghìn hoàn cảnh khó khăn; các bạn trẻ tình nguyện vùng cao; những người dũng cảm cứu người đuối nước, cháy nhà. Thế nhưng, bên cạnh đó vẫn còn những biểu hiện đáng buồn: thờ ơ trước nỗi đau của người khác, thấy người gặp nạn không cứu giúp; thậm chí có kẻ trục lợi từ hoạt động từ thiện, làm mất niềm tin của cộng đồng. Nguyên nhân một phần do lối sống thực dụng, ích kỉ; một phần do một số vụ việc tiêu cực khiến người ta e dè. Lòng nhân ái không chỉ giúp người được giúp vơi bớt khổ đau mà còn làm cho người cho đi cảm thấy hạnh phúc, xã hội trở nên ấm áp, gắn bó. Dĩ nhiên, nhân ái cũng cần tỉnh táo: giúp đúng người, đúng cách, tránh bị kẻ xấu lợi dụng. Mỗi chúng ta hãy bắt đầu từ những việc nhỏ: một lời động viên, một suất cơm từ thiện, một lần hiến máu. Gia đình và nhà trường cần giáo dục con em biết yêu thương, chia sẻ từ thuở nhỏ. Hãy để lòng nhân ái lan tỏa như ánh nắng mặt trời — sưởi ấm mọi tâm hồn và làm đẹp thêm cuộc đời này."}]}]}
