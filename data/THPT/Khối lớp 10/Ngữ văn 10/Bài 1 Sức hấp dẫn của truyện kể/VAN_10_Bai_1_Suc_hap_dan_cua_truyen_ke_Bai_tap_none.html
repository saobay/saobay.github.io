hách của kẻ anh hùng coi thường cái chết, coi khinh cường quyền.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao cảnh cho chữ trong “Chữ người tử tù” được coi là “cảnh tượng xưa nay chưa từng có”?", "options": ["A. Vì có sự đảo lộn ngôi thứ: người tử tù đeo gông vẫn đĩnh đạc cho chữ, viên quản ngục khúm núm đón nhận như học trò", "B. Vì diễn ra trong đêm tối có nhiều nến sáng", "C. Vì có đông đảo phạm nhân chứng kiến", "D. Vì Huấn Cao viết chữ quá nhanh"], "answer": "A", "explain": "Cảnh cho chữ đảo lộn trật tự thông thường (tù nhân thành thầy, cai ngục thành trò), khẳng định sự chiến thắng của cái đẹp, cái thiện — điều xưa nay chưa từng có.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Người đứng ra kể lại câu chuyện trong tác phẩm tự sự được gọi là …", "answer": "người kể chuyện", "explain": "Người kể chuyện có thể là một nhân vật trong truyện hoặc đứng ngoài câu chuyện.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Ba truyện “Thần Trụ Trời”, “Thần Sét”, “Thần Gió” thuộc nhóm thần thoại nào (loại thần thoại kể về nguồn gốc vũ trụ, muôn loài)?", "answer": "thần thoại suy nguyên", "explain": "Thần thoại suy nguyên kể về nguồn gốc vũ trụ và muôn loài, nhằm cắt nghĩa, lí giải các hiện tượng tự nhiên.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong “Chữ người tử tù”, Nguyễn Tuân xây dựng một hoàn cảnh đặc biệt: kẻ sắp chết cho chữ người cai tù, trong đêm tối trước giờ xử chém. Thuật ngữ văn học chỉ hoàn cảnh đặc biệt làm bộc lộ tính cách nhân vật này là gì?", "answer": "tình huống truyện", "explain": "Tình huống truyện là hoàn cảnh, sự việc đặc biệt trong đó nhân vật bộc lộ rõ nhất tính cách, phẩm chất; tình huống hay thường bất ngờ, éo le mà hợp lí.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích tình huống truyện trong “Chữ người tử tù” của Nguyễn Tuân.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu “Chữ người tử tù” (Nguyễn Tuân) và tình huống truyện éo le, độc đáo — cuộc xin chữ, cho chữ giữa chốn ngục tù. 2) Thân đoạn: phân tích sự éo le — người xin chữ là viên quản ngục (đại diện quyền lực cai trị), người cho chữ là Huấn Cao (tử tù sắp bị xử chém); không gian ngục tối, thời điểm gấp gáp trước giờ tử hình; diễn biến thắt nút (Huấn Cao khinh bạc, mắng quản ngục) rồi cởi nút (cảm phục tấm lòng tri kỉ, nhận lời cho chữ). Tác dụng: bộc lộ tính cách nhân vật (khí phách Huấn Cao, thiên lương quản ngục), tạo kịch tính, dẫn tới cảnh cho chữ, làm nổi bật chủ đề cái đẹp chiến thắng. 3) Kết đoạn: khẳng định tình huống truyện là thành công nghệ thuật lớn nhất, tạo sức hấp dẫn bất hủ. BÀI MẪU: Tình huống truyện trong “Chữ người tử tù” là một sáng tạo nghệ thuật độc đáo, éo le đến nghẹt thở của Nguyễn Tuân. Éo le ở chỗ mối quan hệ cho – xin hoàn toàn đảo ngược: kẻ nắm giữ cái đẹp, cái tài lại là Huấn Cao — người tử tù sắp bị xử chém; còn kẻ khao khát cái đẹp lại là viên quản ngục — người đại diện cho bộ máy cai trị. Không gian ngục tối tăm, thời điểm gấp gáp trước giờ tử hình càng đẩy mâu thuẫn lên đỉnh điểm. Tình huống được thắt nút khi Huấn Cao khinh bạc, mắng quản ngục, tưởng chừng cơ hội xin chữ đã hết; rồi cởi nút đầy bất ngờ khi ông cảm phục tấm lòng tri kỉ mà nhận lời cho chữ. Chính tình huống này đã bộc lộ trọn vẹn tính cách nhân vật: khí phách hiên ngang, thiên lương trong sáng của Huấn Cao và tấm lòng quý trọng cái đẹp của viên quản ngục. Đồng thời, nó tạo kịch tính hấp dẫn, dẫn tới cảnh cho chữ — đỉnh cao tư tưởng của tác phẩm: cái đẹp, cái thiện chiến thắng cái xấu, cái ác. Có thể nói, tình huống truyện éo le mà hợp lí chính là chìa khóa làm nên sức hấp dẫn bất hủ của truyện ngắn này.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích, đánh giá truyện ngắn “Chữ người tử tù” của Nguyễn Tuân.", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu Nguyễn Tuân — nhà văn tài hoa suốt đời đi tìm cái đẹp; “Chữ người tử tù” (tập “Vang bóng một thời”, 1940) là truyện ngắn xuất sắc nhất; nêu vấn đề nghị luận: phân tích, đánh giá giá trị nội dung và nghệ thuật. 2) Thân bài: a) Khái quát: hoàn cảnh sáng tác (trước Cách mạng tháng Tám), tóm tắt cốt truyện (cuộc gặp gỡ xin – cho chữ). b) Phân tích nội dung: tình huống truyện éo le (người xin chữ là quản ngục, người cho chữ là tử tù); nhân vật Huấn Cao (tài hoa: chữ đẹp nổi tiếng; khí phách: hiên ngang trước cái chết; thiên lương: chỉ cho chữ kẻ tri kỉ); nhân vật viên quản ngục (bề ngoài cai tù, bên trong là kẻ tri âm tri kỉ, quý trọng cái đẹp); cảnh cho chữ — đỉnh cao (đảo lộn ngôi thứ, cái đẹp chiến thắng); thông điệp “giữ thiên lương cho lành vững”. c) Đánh giá nghệ thuật: tình huống độc đáo; thủ pháp đối lập, tương phản (bóng tối – ánh sáng, gông xiềng – tài hoa); ngôn ngữ cổ kính, trang trọng, giàu chất tạo hình; giọng điệu ngợi ca. d) Đánh giá chung: giá trị nhân đạo sâu sắc, quan niệm thẩm mĩ tiến bộ; vị trí kiệt tác trong văn học. 3) Kết bài: khẳng định giá trị bất hủ; cảm nghĩ và bài học (sống có thiên lương, quý trọng cái đẹp). BÀI MẪU: Nguyễn Tuân là nhà văn lớn của văn học Việt Nam hiện đại, một nghệ sĩ tài hoa suốt đời đi tìm cái đẹp. “Chữ người tử tù” (in trong tập “Vang bóng một thời”, 1940) được coi là truyện ngắn xuất sắc nhất của ông trước Cách mạng, một kiệt tác về vẻ đẹp của thiên lương con người. Truyện kể về cuộc gặp gỡ đầy éo le giữa Huấn Cao — người tử tù tài hoa sắp bị xử chém — và viên quản ngục — kẻ cai tù khao khát cái đẹp. Tình huống truyện độc đáo: người xin chữ là kẻ đại diện cho quyền lực, người cho chữ lại là kẻ tử tù; cuộc xin – cho diễn ra trong ngục tối, trước giờ tử hình. Chính sự đảo ngược ấy tạo nên kịch tính và sức hấp dẫn đặc biệt. Nhân vật Huấn Cao hiện lên với ba vẻ đẹp thống nhất: tài hoa (chữ viết nổi tiếng khắp vùng), khí phách (hiên ngang trước cái chết, cổ đeo gông vẫn đĩnh đạc) và thiên lương trong sáng (chỉ cho chữ kẻ tri kỉ, khinh kẻ bất nghĩa). Đối lập mà tri kỉ với ông là viên quản ngục: bề ngoài là cai tù, bên trong là kẻ biết quý trọng cái tài, cái đẹp, dám liều mình biệt đãi tử tù. Đỉnh cao của truyện là cảnh cho chữ — “cảnh tượng xưa nay chưa từng có”: trong đêm tối, người tử tù viết chữ, viên quản ngục và thầy thơ lại khúm núm đón nhận. Sự đảo lộn ngôi thứ khẳng định sự chiến thắng của cái đẹp, cái thiện trước cái xấu, cái ác. Lời khuyên “giữ thiên lương cho lành vững” là thông điệp nhân văn sâu sắc. Về nghệ thuật, Nguyễn Tuân thành công với tình huống truyện éo le mà hợp lí, thủ pháp đối lập tương phản (bóng tối – ánh sáng, gông xiềng – tài hoa), ngôn ngữ cổ kính, trang trọng giàu chất tạo hình và giọng điệu ngợi ca. “Chữ người tử tù” không chỉ là kiệt tác của Nguyễn Tuân mà còn là bài ca về thiên lương con người. Tác phẩm nhắc nhở mỗi chúng ta: dù trong hoàn cảnh nào cũng phải giữ cho tâm hồn trong sáng, biết quý trọng cái đẹp và sống xứng đáng với hai chữ “thiên lương”.", "points": 0}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Người kể chuyện trong tác phẩm tự sự là ai?", "options": ["A. Người đọc truyện", "B. Người đứng ra kể lại câu chuyện, có thể là nhân vật trong truyện hoặc đứng ngoài", "C. Nhân vật chính của truyện", "D. Tác giả ngoài đời thực"], "answer": "B", "explain": "Người kể chuyện là người đứng ra kể lại câu chuyện; cần phân biệt với tác giả ngoài đời.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngôi kể thứ nhất có đặc điểm gì?", "options": ["A. Người kể biết hết mọi chuyện trên đời", "B. Người kể xưng “tôi”, là nhân vật trong truyện, tạo cảm giác chân thực, gần gũi", "C. Không có người kể chuyện", "D. Kể chuyện bằng thơ"], "answer": "B", "explain": "Ở ngôi thứ nhất, người kể xưng “tôi”, là nhân vật trong truyện, kể những gì mình chứng kiến — chân thực, gần gũi nhưng tầm nhìn hạn chế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong “Tản Viên từ Phán sự lục”, hành động đốt đền của Ngô Tử Văn thể hiện phẩm chất gì?", "options": ["A. Nóng nảy, liều lĩnh, thiếu suy nghĩ", "B. Cương trực, dũng cảm, ghét sự tà gian, dám trừ hại cho dân", "C. Mê tín, sợ ma quỷ", "D. Tham lam, muốn chiếm đền"], "answer": "B", "explain": "Ngô Tử Văn “khảng khái, nóng nảy, thấy sự tà gian thì không chịu được” — đốt đền là hành động chính nghĩa, trừ hại cho dân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Yếu tố kì ảo trong “Tản Viên từ Phán sự lục” được thể hiện qua chi tiết nào?", "options": ["A. Chuyện âm phủ: Diêm Vương xử án, hồn ma kiện tụng, người trần đối chất với cõi âm", "B. Ngô Tử Văn học giỏi, đỗ đạt cao", "C. Đền Tản Viên bị cháy do chập điện", "D. Ngô Tử Văn đi thi đỗ Trạng nguyên"], "answer": "A", "explain": "Nguyễn Dữ kết hợp hiện thực và kì ảo: chuyện trần gian (đốt đền) xen chuyện âm phủ (bị bắt xuống, đối chất trước Diêm Vương).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhận xét “thấy sự tà gian thì không chịu được, nỡ nào ngồi nhìn để yêu quái làm hại dân” phù hợp nhất với nhân vật nào?", "options": ["A. Huấn Cao", "B. Ngô Tử Văn", "C. Viên quản ngục", "D. Thần Sét"], "answer": "B", "explain": "Đó chính là tính cách khảng khái, cương trực của Ngô Tử Văn — tiêu biểu cho kẻ sĩ yêu nước, trọng chính nghĩa.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Chuỗi sự việc chính được sắp xếp theo trật tự nghệ thuật, tạo thành nội dung câu chuyện gọi là …", "answer": "cốt truyện", "explain": "Cốt truyện gồm các sự kiện chính: mở đầu, diễn biến, cao trào, kết thúc.", "points": 0.5}, {"type": "short", "level": "TH", "q": "“Tản Viên từ Phán sự lục” được trích từ tác phẩm nào của Nguyễn Dữ?", "answer": "Truyền kì mạn lục", "explain": "“Truyền kì mạn lục” (ghi chép tản mạn những điều kì lạ) là tác phẩm văn xuôi chữ Hán xuất sắc của Nguyễn Dữ (thế kỉ XVI).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong truyện kể, loại lời do nhân vật tự bộc lộ tâm tư, tình cảm với chính mình (không hướng tới người đối thoại) được gọi là gì?", "answer": "độc thoại", "explain": "Lời nhân vật gồm đối thoại (nói với nhau) và độc thoại (tự nói với mình, bộc lộ tâm tư).", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích nhân vật Ngô Tử Văn trong “Tản Viên từ Phán sự lục” (qua hành động đốt đền).", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu Ngô Tử Văn — nhân vật trung tâm của “Tản Viên từ Phán sự lục” (Nguyễn Dữ), kẻ sĩ đất Bắc thời loạn. 2) Thân đoạn: phân tích hành động đốt đền — nguyên nhân (tên tướng giặc họ Thôi chết trận còn làm yêu quái quấy nhiễu dân, “thấy sự tà gian thì không chịu được”); diễn biến (khảng khái châm lửa đốt đền, tắm gội sạch sẽ, khấn trời rồi đốt); ý nghĩa (dũng cảm, cương trực, dám trừ hại cho dân; niềm tin chính nghĩa). Nghệ thuật: xây dựng tình huống thử thách, đối lập chính – tà. 3) Kết đoạn: khẳng định Ngô Tử Văn là hình tượng đẹp của kẻ sĩ yêu nước, trọng chính nghĩa. BÀI MẪU: Ngô Tử Văn là nhân vật trung tâm của “Tản Viên từ Phán sự lục”, hiện lên như một kẻ sĩ cương trực, dũng cảm thời loạn. Hành động đốt đền Tản Viên đã khắc họa rõ nhất tính cách ấy. Nguyên nhân hành động xuất phát từ lòng căm ghét tà gian: tên tướng giặc họ Thôi tử trận còn làm yêu quái, chiếm đền, quấy nhiễu dân lành; Tử Văn “thấy sự tà gian thì không chịu được”, quyết trừ hại cho dân. Diễn biến hành động cho thấy sự khảng khái, quyết liệt: chàng tắm gội sạch sẽ, khấn trời đất rồi châm lửa đốt đền, bất chấp hiểm nguy. Đốt đền không phải hành động liều lĩnh mà là sự lựa chọn của chính nghĩa — dám đối đầu với thế lực tà ma để bảo vệ dân lành. Qua hành động này, Nguyễn Dữ đã xây dựng thành công hình tượng người anh hùng dân gian mang cốt cách kẻ sĩ: yêu nước, trọng chính nghĩa, tin vào sự thắng lợi của cái thiện. Hành động đốt đền cũng là tình huống mở đầu, tạo tiền đề cho những thử thách tiếp theo (bị bắt xuống âm phủ, đối chất với Diêm Vương), qua đó càng làm nổi bật khí phách của nhân vật. Ngô Tử Văn xứng đáng là biểu tượng đẹp của tinh thần đấu tranh cho chính nghĩa trong văn học trung đại.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích, đánh giá tác phẩm “Tản Viên từ Phán sự lục” của Nguyễn Dữ (tập trung vào hình tượng Ngô Tử Văn).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu Nguyễn Dữ và “Truyền kì mạn lục” (thế kỉ XVI) — đỉnh cao truyện truyền kì trung đại; “Tản Viên từ Phán sự lục” là truyện tiêu biểu; nêu vấn đề: phân tích, đánh giá hình tượng Ngô Tử Văn. 2) Thân bài: a) Khái quát: tóm tắt cốt truyện (đốt đền — bị bắt xuống âm phủ — đối chất — được minh oan, làm phán sự đền Tản Viên). b) Phân tích nhân vật Ngô Tử Văn: cương trực, khảng khái (đốt đền trừ tà); dũng cảm, mưu trí (đối chất với Diêm Vương, vạch mặt tên tướng giặc họ Thôi); được đền đáp xứng đáng (làm phán sự) — niềm tin chính nghĩa thắng gian tà. c) Đánh giá nghệ thuật: kết hợp hiện thực và kì ảo; xây dựng tình huống thử thách; đối lập chính – tà gay gắt; ngôn ngữ trang trọng. d) Giá trị: ca ngợi kẻ sĩ yêu nước; phê phán xã hội nhiễu nhương; ước mơ công lí. 3) Kết bài: khẳng định giá trị tác phẩm và hình tượng Ngô Tử Văn; liên hệ (sống cương trực, dám đấu tranh cho lẽ phải). BÀI MẪU: Nguyễn Dữ (thế kỉ XVI) là tác giả của “Truyền kì mạn lục” — tác phẩm được coi là “thiên cổ kì bút”, đỉnh cao của truyện truyền kì văn học trung đại. Trong đó, “Tản Viên từ Phán sự lục” là truyện tiêu biểu, xây dựng thành công hình tượng Ngô Tử Văn — kẻ sĩ cương trực, dũng cảm, hiện thân của chính nghĩa. Cốt truyện xoay quanh hành động đốt đền của Tử Văn: căm ghét tên tướng giặc họ Thôi chết trận còn làm yêu quái quấy nhiễu dân, chàng khảng khái châm lửa đốt đền. Hành động ấy đẩy chàng vào thử thách nghiệt ngã: bị hồn ma kiện, bị bắt xuống âm phủ đối chất trước Diêm Vương. Nhưng với sự cương trực và mưu trí, Tử Văn đã vạch mặt kẻ gian tà, được minh oan và được cử giữ chức phán sự đền Tản Viên. Qua diễn biến ấy, Nguyễn Dữ khắc họa một kẻ sĩ toàn vẹn: “thấy sự tà gian thì không chịu được”, dám hành động vì dân, dám đối đầu với cả cõi âm để bảo vệ lẽ phải. Kết thúc có hậu “ở hiền gặp lành” gửi gắm niềm tin sâu sắc: chính nghĩa nhất định thắng gian tà. Về nghệ thuật, truyện thành công nhờ bút pháp kết hợp hiện thực và kì ảo: chuyện trần gian xen chuyện âm phủ vừa li kì, hấp dẫn vừa là phương tiện để tác giả mượn cổ nói kim, phê phán hiện thực xã hội phong kiến nhiễu nhương đương thời. Thủ pháp đối lập chính – tà được đẩy tới gay gắt, tình huống thử thách liên tiếp bộc lộ tính cách nhân vật. “Tản Viên từ Phán sự lục” vì thế không chỉ là câu chuyện li kì mà còn là bản tuyên ngôn về chính nghĩa. Hình tượng Ngô Tử Văn nhắc nhở thế hệ hôm nay: sống phải cương trực, dám đấu tranh cho lẽ phải, cho công lí — đó là phẩm chất làm nên giá trị con người mọi thời đại.", "points": 0}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Điểm nhìn trong truyện kể là gì?", "options": ["A. Thời gian xảy ra câu chuyện", "B. Vị trí, góc độ mà người kể quan sát, miêu tả sự việc, nhân vật", "C. Nơi nhân vật sinh sống", "D. Ý kiến chủ quan của người đọc"], "answer": "B", "explain": "Điểm nhìn là vị trí, góc độ quan sát của người kể; thay đổi điểm nhìn làm câu chuyện có sắc thái khác nhau.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ nào sau đây là từ Hán Việt?", "options": ["A. Cái cày", "B. Bánh chưng", "C. Con trâu", "D. Thiên lương"], "answer": "D", "explain": "“Thiên lương” (lương tâm trời phú, đạo đức trong sáng) là từ Hán Việt, mang sắc thái trang trọng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong truyện “Thần Trụ Trời”, chi tiết thần “đào đất, đắp cột chống trời” thể hiện khát vọng gì của người Việt cổ?", "options": ["A. Chiến thắng giặc ngoại xâm", "B. Bay lên trời sống với thần linh", "C. Làm giàu nhanh chóng", "D. Nhận thức, lí giải và chinh phục tự nhiên; ca ngợi sức lao động sáng tạo"], "answer": "D", "explain": "Thần thoại suy nguyên phản ánh khát vọng nhận thức, cắt nghĩa thế giới và tôn vinh sức mạnh lao động sáng tạo của con người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhân vật viên quản ngục trong “Chữ người tử tù” có điểm đặc biệt gì?", "options": ["A. Bề ngoài là cai tù nhưng bên trong là kẻ tri âm, tri kỉ, biết quý trọng cái đẹp", "B. Độc ác, thường hành hạ tử tù", "C. Tham tiền, nhận hối lộ", "D. Sợ hãi Huấn Cao nên nịnh bợ"], "answer": "A", "explain": "Quản ngục là nhân vật đặc biệt: mang danh cai tù nhưng tâm hồn là kẻ tri kỉ, “biết quý trọng cái tài, cái đẹp” — thiên lương không phân biệt địa vị.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhận xét nào đúng về ngôn ngữ truyện Nguyễn Tuân trong “Chữ người tử tù”?", "options": ["A. Ngôn ngữ cổ kính, trang trọng, giàu chất tạo hình như vẽ bằng bút lông", "B. Ngôn ngữ khoa học, khô khan", "C. Ngôn ngữ đời thường, suồng sã", "D. Chỉ toàn lời thoại ngắn, cụt lủn"], "answer": "A", "explain": "Nguyễn Tuân dùng ngôn ngữ cổ kính, trang trọng, giàu hình ảnh tạo hình — phù hợp với không khí xưa cũ và vẻ đẹp tài hoa ông tôn thờ.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Hoàn cảnh, sự việc đặc biệt trong đó nhân vật bộc lộ rõ nhất tính cách, phẩm chất gọi là …", "answer": "tình huống truyện", "explain": "Tình huống truyện hay thường bất ngờ, éo le nhưng hợp lí, có sức thắt nút – cởi nút cho cốt truyện.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nguyễn Tuân được mệnh danh là nhà văn suốt đời đi tìm …", "answer": "cái đẹp", "explain": "Nguyễn Tuân suốt đời đi tìm cái đẹp, cái thật — từ thiên nhiên, con người đến nghệ thuật; “Chữ người tử tù” là minh chứng tiêu biểu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thủ pháp nghệ thuật đặt hai hình ảnh, hai tính cách trái ngược nhau cạnh nhau để làm nổi bật nhau (như bóng tối – ánh sáng, cai ngục – tử tù trong “Chữ người tử tù”) gọi là gì?", "answer": "tương phản", "explain": "Tương phản (đối lập) là thủ pháp đặt các mặt đối lập cạnh nhau để cùng làm nổi bật nhau; Nguyễn Tuân dùng rất thành công trong truyện.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu cảm nhận của em về nhân vật Huấn Cao trong “Chữ người tử tù”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu Huấn Cao — nhân vật trung tâm, nguyên mẫu là nhà Nho Cao Bá Quát. 2) Thân đoạn: cảm nhận ba vẻ đẹp — tài hoa (chữ đẹp nổi tiếng khắp vùng tỉnh Sơn); khí phách hiên ngang (thản nhiên trước cái chết, cổ đeo gông vẫn đĩnh đạc); thiên lương trong sáng (chỉ cho chữ kẻ tri kỉ, khinh kẻ bất nghĩa, lời khuyên giữ thiên lương). Nghệ thuật khắc họa: ngoại hình, hành động, lời nói; đặt trong tình huống éo le. 3) Kết đoạn: khẳng định Huấn Cao là hình tượng đẹp về người anh hùng tài hoa, thiên lương; cảm nghĩ bản thân. BÀI MẪU: Huấn Cao trong “Chữ người tử tù” là một trong những nhân vật đẹp nhất của văn học Việt Nam, khiến người đọc vừa cảm phục vừa xúc động. Trước hết, ông là con người tài hoa: chữ viết đẹp nổi tiếng khắp vùng, ai cũng ao ước có được. Nhưng tài hoa ấy gắn liền với khí phách hiên ngang hiếm có: là tử tù sắp bị xử chém mà vẫn thản nhiên, ung dung; đến đêm cho chữ, cổ đeo gông, chân vướng xiềng mà nét chữ vẫn đĩnh đạc, đàng hoàng. Điều khiến em cảm phục nhất là thiên lương trong sáng của ông: khinh bỉ kẻ bất nghĩa, nhưng khi nhận ra tấm lòng tri kỉ của viên quản ngục thì sẵn sàng cho chữ và chân thành khuyên “giữ thiên lương cho lành vững”. Nguyễn Tuân đã khắc họa Huấn Cao bằng bút pháp tài hoa: từ ngoại hình, hành động đến lời nói đều toát lên vẻ đẹp của người nghệ sĩ – chiến sĩ. Huấn Cao không chỉ là nhân vật văn học mà còn là biểu tượng cho khát vọng sống đẹp: tài năng phải đi cùng nhân cách, và cái đẹp chân chính luôn gắn với cái thiện. Hình tượng ấy khiến em thấm thía bài học: dù hoàn cảnh nào cũng phải giữ tâm hồn trong sáng, sống có khí phách và lòng nhân.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích vẻ đẹp trí tưởng tượng của dân gian qua “Truyện về các vị thần sáng tạo thế giới”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu chùm truyện (Thần Trụ Trời, Thần Sét, Thần Gió — theo Nguyễn Đổng Chi sưu tầm), thuộc thần thoại suy nguyên; nêu vấn đề: vẻ đẹp trí tưởng tượng dân gian. 2) Thân bài: a) Khái quát: nội dung ba truyện (tách trời đất, thần Sét thi hành pháp luật, thần Gió làm gió). b) Phân tích vẻ đẹp trí tưởng tượng: hình tượng thần khổng lồ, phi thường (thân thể to lớn, không đầu, mặt nanh ác); sức mạnh siêu nhiên gắn với hiện tượng tự nhiên (sấm, sét, gió, bão); trí tưởng tượng bay bổng mà có lô-gíc (lấy đặc điểm tự nhiên để hình dung thần: sét dữ dằn — thần nóng nảy). c) Ý nghĩa: cắt nghĩa, lí giải thế giới; thể hiện khát vọng chinh phục tự nhiên; ca ngợi lao động sáng tạo (thần Trụ Trời đào đất đắp cột). d) Đánh giá nghệ thuật: cốt truyện đơn giản, chi tiết phóng đại, thời gian phiếm chỉ, không gian vũ trụ. 3) Kết bài: khẳng định trí tưởng tượng là tài sản tinh thần quý báu; liên hệ (trân trọng văn hóa dân gian, bồi đắp trí tưởng tượng, sáng tạo). BÀI MẪU: “Truyện về các vị thần sáng tạo thế giới” (gồm “Thần Trụ Trời”, “Thần Sét”, “Thần Gió” do Nguyễn Đổng Chi sưu tầm) là những viên ngọc quý của thần thoại Việt Nam, thuộc nhóm thần thoại suy nguyên. Đọc ba truyện, người đọc không khỏi ngỡ ngàng trước trí tưởng tượng bay bổng mà giàu lô-gíc của người Việt cổ. Trước hết, trí tưởng tượng thể hiện ở việc xây dựng hình tượng các vị thần vừa phi thường vừa gần gũi: thần Trụ Trời thân thể to lớn “không biết bao nhiêu mà kể”, đầu đội trời, chân bước một bước như từ tỉnh này qua tỉnh nọ; thần Sét mặt mũi nanh ác, tiếng quát dữ dội, vác búa lớn đi thi hành pháp luật; thần Gió hình dạng kì quặc, không có đầu, có thể làm ra gió to gió nhỏ. Mỗi vị thần là sự nhân cách hóa một hiện tượng tự nhiên: tính khí nóng nảy, dữ dằn của thần Sét chính là đặc điểm của sấm sét; sự thất thường của thần Gió chính là đặc điểm của gió bão. Trí tưởng tượng dân gian không tùy tiện mà dựa trên quan sát thực tế, “lấy tự nhiên để cắt nghĩa tự nhiên”. Đằng sau những chuyện hoang đường là khát vọng nhận thức và chinh phục thế giới: người xưa muốn biết vì sao có trời đất, vì sao có sấm sét, gió mưa; và họ gửi vào thần Trụ Trời hình ảnh người lao động cần mẫn “đào đất, đắp cột”, tôn vinh sức sáng tạo của con người. Về nghệ thuật, ba truyện có cốt truyện đơn giản, chi tiết phóng đại, thời gian phiếm chỉ (“từ xa xưa”), không gian vũ trụ bao la — tất cả tạo nên vẻ đẹp nguyên sơ, hùng vĩ. “Truyện về các vị thần sáng tạo thế giới” cho thấy trí tưởng tượng là tài sản tinh thần vô giá của dân tộc. Ngày nay, đọc lại những trang thần thoại, chúng ta thêm trân trọng văn hóa dân gian và ý thức bồi đắp trí tưởng tượng, óc sáng tạo — hành trang không thể thiếu của con người hiện đại.", "points": 0}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Lời nhân vật trong truyện gồm những loại nào?", "options": ["A. Chỉ có đối thoại", "B. Chỉ có độc thoại", "C. Đối thoại (nhân vật nói với nhau) và độc thoại (nhân vật tự nói với mình)", "D. Lời dẫn truyện của tác giả"], "answer": "C", "explain": "Lời nhân vật gồm đối thoại và độc thoại; kết hợp với lời người kể chuyện tạo nên tính đa thanh cho truyện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Chữ người tử tù” của Nguyễn Tuân được in trong tập truyện nào?", "options": ["A. Truyện Tây Bắc", "B. Vang bóng một thời", "C. Số đỏ", "D. Sống mòn"], "answer": "B", "explain": "“Chữ người tử tù” in trong tập “Vang bóng một thời” (1940) — tập truyện ngắn xuất sắc viết về vẻ đẹp xưa cũ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa của chi tiết viên quản ngục “khúm núm” trước người tử tù trong cảnh cho chữ là gì?", "options": ["A. Quản ngục bị bệnh nên đi không vững", "B. Quản ngục sợ bị cách chức nên nịnh bợ", "C. Quản ngục giả vờ để lừa Huấn Cao", "D. Sự đảo lộn ngôi thứ: cái đẹp, cái tài được tôn vinh; người tri kỉ cúi mình trước thiên lương"], "answer": "D", "explain": "Chi tiết “khúm núm” thể hiện sự đảo lộn ngôi thứ: cai ngục thành học trò, tử tù thành thầy — cái đẹp, thiên lương được tôn vinh tuyệt đối.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dòng nào nêu đúng đặc điểm của thần thoại suy nguyên?", "options": ["A. Kể về anh hùng đánh giặc ngoại xâm", "B. Nhân vật là thần sáng tạo thế giới, nội dung lí giải hiện tượng tự nhiên, thời gian phiếm chỉ", "C. Được viết bằng thơ lục bát", "D. Kể chuyện tình yêu đôi lứa"], "answer": "B", "explain": "Thần thoại suy nguyên: nhân vật là thần sáng tạo thế giới; nội dung cắt nghĩa hiện tượng tự nhiên; thời gian phiếm chỉ, không gian vũ trụ, yếu tố kì ảo.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao Nguyễn Dữ để Ngô Tử Văn phải xuống âm phủ đối chất với Diêm Vương?", "options": ["A. Để tăng yếu tố kì ảo, tạo tình huống thử thách bộc lộ tính cách cương trực và khẳng định chính nghĩa thắng gian tà", "B. Vì trên trần gian đã hết chuyện để kể", "C. Vì Tử Văn thích xuống âm phủ chơi", "D. Để kể chuyện ma cho rùng rợn"], "answer": "A", "explain": "Chuyện âm phủ là tình huống thử thách nghiệt ngã: Tử Văn phải một mình đối chất, nhờ đó tính cách cương trực bộc lộ trọn vẹn và chân lí chính nghĩa thắng gian tà được khẳng định.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Câu chuyện về nguồn gốc vũ trụ, muôn loài do các vị thần sáng tạo, nhằm lí giải các hiện tượng tự nhiên gọi là …", "answer": "thần thoại", "explain": "Thần thoại là truyện dân gian về các vị thần, người anh hùng sáng tạo thế giới, phản ánh nhận thức nguyên sơ của con người.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Tác giả của “Truyền kì mạn lục” là ai?", "answer": "Nguyễn Dữ", "explain": "Nguyễn Dữ (thế kỉ XVI) là tác giả “Truyền kì mạn lục” — đỉnh cao truyện truyền kì văn học trung đại.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong “Chữ người tử tù”, vẻ đẹp đạo đức trong sáng trong tâm hồn con người mà Nguyễn Tuân suốt đời tôn thờ được gọi bằng thuật ngữ nào?", "answer": "thiên lương", "explain": "“Thiên lương” (lương tâm trời phú) là quan niệm trung tâm: cái đẹp chân chính gắn với cái thiện; lời khuyên “giữ thiên lương” là thông điệp của truyện.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích ý nghĩa của cảnh cho chữ trong “Chữ người tử tù”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu cảnh cho chữ — “cảnh tượng xưa nay chưa từng có”, đỉnh cao của truyện. 2) Thân đoạn: phân tích khung cảnh (đêm tối ngục tù, Huấn Cao cổ đeo gông, chân vướng xiềng vẫn đĩnh đạc viết chữ; quản ngục và thầy thơ lại khúm núm); ý nghĩa — sự đảo lộn ngôi thứ (tử tù thành thầy, cai ngục thành trò); khẳng định sự chiến thắng của cái đẹp, cái thiện, thiên lương trước cái xấu, cái ác; lời khuyên “giữ thiên lương” — thông điệp nhân văn. Nghệ thuật: đối lập tương phản, ngôn ngữ tạo hình. 3) Kết đoạn: khẳng định cảnh cho chữ là linh hồn của tác phẩm, để lại dư âm sâu sắc. BÀI MẪU: Cảnh cho chữ là đỉnh cao nghệ thuật và tư tưởng của “Chữ người tử tù” — “cảnh tượng xưa nay chưa từng có” trong văn học. Khung cảnh đầy kịch tính: trong đêm tối của ngục tù, trước giờ xử chém, Huấn Cao dù “cổ đeo gông, chân vướng xiềng” vẫn đĩnh đạc, đường hoàng viết những nét chữ tài hoa; còn viên quản ngục và thầy thơ lại thì “khúm núm” đón nhận từng nét chữ như học trò trước thầy. Ý nghĩa lớn nhất của cảnh tượng này là sự đảo lộn ngôi thứ hoàn toàn: kẻ tử tù trở thành người thầy ban phát cái đẹp, kẻ cai tù trở thành học trò cúi mình trước thiên lương. Qua đó, Nguyễn Tuân khẳng định một chân lí: cái đẹp, cái thiện có sức mạnh chiến thắng cái xấu, cái ác; thiên lương con người không bị gông xiềng nào trói buộc được. Lời khuyên cuối cùng của Huấn Cao — hãy về quê mà ở, “giữ thiên lương cho lành vững” — như một di chúc tinh thần, là thông điệp nhân văn sâu sắc gửi tới người đọc mọi thời đại. Bằng thủ pháp đối lập tương phản và ngôn ngữ giàu chất tạo hình, Nguyễn Tuân đã biến cảnh cho chữ thành biểu tượng bất hủ cho sự bất diệt của cái đẹp và thiên lương.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ đánh giá nghệ thuật kể chuyện trong “Chữ người tử tù” của Nguyễn Tuân (người kể chuyện, tình huống truyện, chi tiết, ngôn ngữ).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu Nguyễn Tuân và “Chữ người tử tù”; nêu vấn đề: nghệ thuật kể chuyện đặc sắc làm nên sức hấp dẫn. 2) Thân bài: a) Tình huống truyện éo le, độc đáo (xin – cho chữ đảo ngược; thắt nút – cởi nút) — linh hồn của truyện. b) Người kể chuyện ngôi thứ ba, điểm nhìn linh hoạt (khách quan mà thấm đẫm cảm xúc ngợi ca). c) Nghệ thuật xây dựng nhân vật: đối lập mà tri kỉ (Huấn Cao – quản ngục); khắc họa qua ngoại hình, hành động, lời nói. d) Chi tiết nghệ thuật đặc sắc (cảnh cho chữ, chi tiết “khúm núm”, gông xiềng). e) Ngôn ngữ cổ kính, trang trọng, giàu chất tạo hình; giọng điệu ngợi ca. 3) Kết bài: khẳng định nghệ thuật kể chuyện bậc thầy; giá trị lâu bền; bài học (học cách kể chuyện hấp dẫn, trau dồi ngôn ngữ). BÀI MẪU: Sức hấp dẫn của “Chữ người tử tù” trước hết đến từ nghệ thuật kể chuyện bậc thầy của Nguyễn Tuân. Thành công lớn nhất là việc xây dựng tình huống truyện éo le, độc đáo: cuộc xin chữ, cho chữ giữa chốn ngục tù với quan hệ cho – xin hoàn toàn đảo ngược. Tình huống được thắt nút khi Huấn Cao khinh bạc mắng quản ngục, rồi cởi nút đầy bất ngờ khi ông cảm phục tấm lòng tri kỉ mà nhận lời — tạo kịch tính lôi cuốn từ đầu đến cuối. Người kể chuyện ở ngôi thứ ba với điểm nhìn linh hoạt: khi khách quan quan sát, khi nhập vào tâm trạng nhân vật, giọng kể thấm đẫm sự ngợi ca cái đẹp. Nghệ thuật xây dựng nhân vật cũng đặc sắc: Huấn Cao và viên quản ngục được đặt trong thế đối lập (tử tù – cai tù) mà lại là tri kỉ; mỗi nhân vật hiện lên qua ngoại hình, hành động, lời nói sinh động. Các chi tiết nghệ thuật đắt giá như cảnh cho chữ, hình ảnh “khúm núm”, “cổ đeo gông, chân vướng xiềng” đều giàu sức gợi, trở thành biểu tượng. Đặc biệt, ngôn ngữ truyện cổ kính, trang trọng, giàu chất tạo hình — như vẽ bằng bút lông — tạo nên không khí xưa cũ, sang trọng, xứng với vẻ đẹp tài hoa được ngợi ca. Tất cả hòa quyện làm nên một truyện ngắn hoàn mĩ, chứng tỏ Nguyễn Tuân là bậc thầy của nghệ thuật truyện ngắn hiện đại. Học truyện, em rút ra bài học: muốn kể chuyện hấp dẫn phải biết xây dựng tình huống độc đáo, chi tiết đặc sắc và trau dồi ngôn ngữ giàu hình ảnh.", "points": 0}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Chủ đề của tác phẩm văn học là gì?", "options": ["A. Tên gọi của tác phẩm", "B. Nhân vật chính trong truyện", "C. Vấn đề, tư tưởng trung tâm mà tác phẩm thể hiện", "D. Nơi xảy ra câu chuyện"], "answer": "C", "explain": "Chủ đề là vấn đề, tư tưởng trung tâm mà tác phẩm thể hiện (ví dụ: chủ đề ca ngợi thiên lương trong “Chữ người tử tù”).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ “tử tù” trong nhan đề “Chữ người tử tù” thuộc loại từ nào?", "options": ["A. Từ Hán Việt", "B. Từ láy", "C. Từ thuần Việt", "D. Từ ghép thuần Việt"], "answer": "A", "explain": "“Tử tù” (người tù chờ xử tử) là từ Hán Việt, mang sắc thái trang trọng, phù hợp với văn phong của Nguyễn Tuân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chi tiết kì ảo nào sau đây có trong truyện “Thần Gió”?", "options": ["A. Thần Gió xây nhà trên đỉnh núi", "B. Thần Gió biết bay lên mặt trăng", "C. Thần Gió cưới vợ sinh con đông đúc", "D. Thần Gió không có đầu, có thể làm ra gió to, gió nhỏ, lúc ngắn lúc lâu"], "answer": "D", "explain": "Thần Gió có hình dạng kì quặc (không có đầu) và sức mạnh siêu nhiên (làm ra gió) — trí tưởng tượng phóng đại của dân gian.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "“Tản Viên từ Phán sự lục” phản ánh hiện thực xã hội nào?", "options": ["A. Xã hội tương lai tươi đẹp", "B. Xã hội hiện đại văn minh", "C. Xã hội nguyên thủy hoang sơ", "D. Xã hội phong kiến suy tàn, nhiễu nhương, cái ác lộng hành"], "answer": "D", "explain": "Nguyễn Dữ mượn chuyện ma quỷ, âm phủ để phê phán xã hội phong kiến suy tàn đương thời — bút pháp mượn cổ nói kim.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Điểm chung về tư tưởng giữa “Tản Viên từ Phán sự lục” và “Chữ người tử tù” là gì?", "options": ["A. Đều viết về cuộc sống nông thôn", "B. Đều phê phán chiến tranh xâm lược", "C. Đều ca ngợi chính nghĩa, cái đẹp, cái thiện chiến thắng cái xấu, cái ác", "D. Đều kể về các vị thần linh"], "answer": "C", "explain": "Cả hai tác phẩm đều hướng tới chân lí: chính nghĩa thắng gian tà (Ngô Tử Văn), cái đẹp và thiên lương thắng cái ác (Huấn Cao) — tư tưởng nhân văn nhất quán.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Ngôi kể mà người kể xưng “tôi”, là một nhân vật trong truyện gọi là ngôi kể thứ …", "answer": "nhất", "explain": "Ngôi kể thứ nhất tạo cảm giác chân thực, gần gũi; ngôi kể thứ ba giấu mình, có tầm nhìn toàn cảnh.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Trong “Chữ người tử tù”, nguyên mẫu của nhân vật Huấn Cao là nhà Nho tài hoa, bất đắc chí nào?", "answer": "Cao Bá Quát", "explain": "Huấn Cao có nguyên mẫu là Cao Bá Quát — nhà Nho tài hoa, tham gia khởi nghĩa Mỹ Lương, bị xử tử.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Xét về thể loại, “Tản Viên từ Phán sự lục” thuộc loại truyện nào của văn học trung đại (ghi chép những điều kì lạ, kết hợp hiện thực và kì ảo)?", "answer": "truyền kì", "explain": "Truyện truyền kì ghi chép những chuyện kì lạ, hoang đường, kết hợp hiện thực và huyền ảo; “Truyền kì mạn lục” là đỉnh cao của thể loại này.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích chi tiết kì ảo trong truyện “Thần Trụ Trời” (thần đào đất, đắp cột chống trời).", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu truyện “Thần Trụ Trời” và chi tiết kì ảo tiêu biểu — thần đào đất, đắp cột chống trời. 2) Thân đoạn: phân tích chi tiết — hành động phi thường (đầu đội trời, đào đất đá đắp thành cột vừa cao vừa to); trí tưởng tượng phóng đại (thân thể khổng lồ, sức mạnh siêu nhiên); ý nghĩa — lí giải vì sao có trời đất phân đôi, vì sao mặt đất không bằng phẳng (thần phá cột, ném đất đá tạo núi sông, biển đảo); gửi gắm khát vọng nhận thức và ca ngợi lao động sáng tạo. 3) Kết đoạn: khẳng định chi tiết kì ảo làm nên sức hấp dẫn của thần thoại. BÀI MẪU: Chi tiết thần Trụ Trời “đào đất, đắp cột chống trời” là một trong những chi tiết kì ảo đẹp nhất của thần thoại Việt Nam. Thuở ấy, trời đất còn là một đám hỗn độn, tối tăm; vị thần khổng lồ đã dùng đầu đội trời lên, tự mình đào đất, đập đá đắp thành một cái cột vừa cao vừa to để chống trời. Công việc cứ thế tiếp diễn cho đến khi trời và đất phân đôi rõ rệt. Khi trời đã cao và khô, thần phá cột đi, lấy đất đá ném tung khắp nơi tạo thành núi sông, biển đảo — vì thế mặt đất ngày nay mới có chỗ lồi chỗ lõm. Chi tiết kì ảo này thể hiện trí tưởng tượng phóng đại, bay bổng của người Việt cổ: lấy hình ảnh lao động đời thường (đào đất, đắp cột) để hình dung công cuộc sáng tạo vũ trụ. Đằng sau sự hoang đường là khát vọng nhận thức: người xưa muốn cắt nghĩa vì sao có trời, có đất, vì sao trời đất phân đôi, vì sao mặt đất không bằng phẳng. Đồng thời, hình ảnh vị thần cần mẫn lao động còn tôn vinh sức mạnh sáng tạo của con người. Chính chi tiết kì ảo giàu ý nghĩa ấy đã làm nên sức hấp dẫn bền lâu của truyện “Thần Trụ Trời”, để lại trong lòng người đọc niềm tự hào về trí tuệ và trí tưởng tượng của cha ông.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích quan niệm của dân gian về tự nhiên qua hai truyện “Thần Sét” và “Thần Gió”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu hai truyện trong chùm “Truyện về các vị thần sáng tạo thế giới”; nêu vấn đề: quan niệm dân gian về tự nhiên. 2) Thân bài: a) Khái quát nội dung: Thần Sét (mặt nanh ác, vác búa, thi hành pháp luật của Ngọc Hoàng; trừng phạt kẻ ác); Thần Gió (không đầu, làm gió to nhỏ; con bị đày xuống trần). b) Phân tích quan niệm: nhân cách hóa hiện tượng tự nhiên (sét dữ dằn — thần nóng nảy; gió thất thường — thần kì quặc); quan niệm “có vay có trả”, trừng phạt kẻ ác (thần Sét đánh kẻ cường bạo); thiên nhiên vừa đáng sợ vừa có trật tự, có chủ (Ngọc Hoàng cai quản). c) Cơ sở hình thành: quan sát thực tế + trí tưởng tượng + ước mơ công lí. d) Đánh giá nghệ thuật: chi tiết phóng đại, nhân vật sinh động, giọng kể hồn nhiên. 3) Kết bài: khẳng định giá trị nhận thức và thẩm mĩ; liên hệ (ứng xử với thiên nhiên hôm nay: tôn trọng, bảo vệ). BÀI MẪU: Trong chùm “Truyện về các vị thần sáng tạo thế giới”, “Thần Sét” và “Thần Gió” là hai truyện tiêu biểu phản ánh quan niệm của người Việt cổ về tự nhiên. Thần Sét hiện lên với mặt mũi nanh ác, tiếng quát dữ dội, vác chiếc búa lớn đi thi hành pháp luật của Ngọc Hoàng ở trần gian, chuyên trừng trị kẻ cường bạo, gian ác. Thần Gió có hình dạng kì quặc — không có đầu — có thể làm ra gió to gió nhỏ, lúc ngắn lúc lâu; đứa con ngỗ ngược của thần còn bị Ngọc Hoàng đày xuống trần. Qua hai hình tượng này, ta thấy rõ cách người xưa “nhân cách hóa” tự nhiên: lấy đặc điểm của hiện tượng để hình dung vị thần cai quản nó — sấm sét dữ dằn, đáng sợ nên thần Sét nóng nảy, nanh ác; gió thất thường nên thần Gió kì quặc. Đằng sau đó là quan niệm: thiên nhiên không phải vô tri mà có chủ, có trật tự (Ngọc Hoàng cai quản muôn thần); thiên nhiên còn là công cụ thực thi công lí — thần Sét đánh kẻ ác, thể hiện ước mơ “ở hiền gặp lành, ở ác gặp dữ” của dân gian. Quan niệm này hình thành từ quan sát thực tế (sấm sét đánh, gió bão tàn phá) cộng với trí tưởng tượng phong phú và khát vọng về một thế giới có công bằng. Về nghệ thuật, hai truyện hấp dẫn nhờ chi tiết phóng đại, nhân vật sinh động, giọng kể hồn nhiên, chân chất. Ngày nay, khoa học đã lí giải được sấm sét, gió bão, nhưng những truyện thần thoại vẫn có giá trị: chúng nhắc nhở con người phải tôn trọng, sống hài hòa và bảo vệ thiên nhiên — bài học càng thiết thực trong bối cảnh biến đổi khí hậu hiện nay.", "points": 0}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Tên tác phẩm “Truyền kì mạn lục” có nghĩa là gì?", "options": ["A. Truyện về các vị thần linh", "B. Tuyển tập thơ ca dân gian", "C. Ghi chép tản mạn những điều kì lạ", "D. Sách dạy cách làm quan"], "answer": "C", "explain": "“Truyền kì mạn lục” nghĩa là ghi chép tản mạn những điều kì lạ — đúng với nội dung: chuyện ma quỷ, âm phủ xen hiện thực.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyễn Tuân (1910 – 1987) nổi tiếng với phong cách nghệ thuật nào?", "options": ["A. Tài hoa, uyên bác, suốt đời đi tìm cái đẹp", "B. Trữ tình, lãng mạn, mơ mộng", "C. Khô khan, thiên về lí luận", "D. Giản dị, mộc mạc như lời ăn tiếng nói hằng ngày"], "answer": "A", "explain": "Nguyễn Tuân là nhà văn tài hoa, uyên bác; mỗi trang viết đều thấm đẫm tình yêu cái đẹp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong “Chữ người tử tù”, ai là người xin chữ?", "options": ["A. Viên quản ngục", "B. Thầy thơ lại", "C. Huấn Cao", "D. Tên cai tù độc ác"], "answer": "A", "explain": "Viên quản ngục — kẻ cai tù — lại là người khao khát xin chữ Huấn Cao; đó chính là sự éo le của tình huống truyện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chi tiết Huấn Cao “cổ đeo gông, chân vướng xiềng” mà vẫn đĩnh đạc cho chữ có tác dụng gì?", "options": ["A. Làm nổi bật khí phách hiên ngang, coi thường gông cùm; tôn vinh vẻ đẹp tâm hồn", "B. Tả thực cảnh nhà tù cho sinh động", "C. Kể cho câu chuyện thêm dài", "D. Phê phán chế độ nhà tù phong kiến"], "answer": "A", "explain": "Gông xiềng chỉ trói được thân thể, không trói được tâm hồn: chi tiết làm nổi bật khí phách và tôn vinh vẻ đẹp thiên lương bất diệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi sử dụng từ Hán Việt, điều cần tránh là gì?", "options": ["A. Tra từ điển để hiểu yếu tố cấu tạo", "B. Dùng trong văn bản nghị luận", "C. Lạm dụng gây khó hiểu, sáo rỗng; dùng sai phong cách, ngữ cảnh", "D. Dùng từ có sắc thái trang trọng"], "answer": "C", "explain": "Cần dùng từ Hán Việt đúng phong cách, ngữ cảnh; tránh lạm dụng gây khó hiểu, sáo rỗng hoặc dùng sai chỗ.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Trong “Chữ người tử tù”, lời khuyên “giữ thiên lương cho lành vững” của Huấn Cao với quản ngục thuộc loại lời nào?", "answer": "lời nhân vật", "explain": "Đây là lời của nhân vật Huấn Cao nói với viên quản ngục (đối thoại), không phải lời người kể chuyện.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Vì sao lúc đầu Huấn Cao lại tỏ ra khinh bạc, mắng mỏ viên quản ngục?", "answer": "chưa biết tấm lòng tri kỉ của quản ngục", "explain": "Huấn Cao chưa biết quản ngục là kẻ tri âm tri kỉ, chỉ thấy ông là tay sai của cái ác nên khinh bạc.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Khi người kể chuyện thay đổi vị trí, góc độ quan sát sự việc (từ bên ngoài sang nhập vào tâm trí nhân vật), yếu tố tự sự nào đã thay đổi?", "answer": "điểm nhìn", "explain": "Điểm nhìn là vị trí, góc độ quan sát của người kể; thay đổi điểm nhìn làm cho cách kể và sắc thái câu chuyện thay đổi.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích diễn biến tâm trạng của viên quản ngục trong “Chữ người tử tù”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu viên quản ngục — nhân vật đặc biệt, cai tù mà là tri kỉ. 2) Thân đoạn: diễn biến tâm trạng — khao khát, nôn nóng xin chữ (biệt đãi tử tù, dọn rượu thịt); lo lắng, day dứt khi bị Huấn Cao khinh bạc, mắng mỏ (sợ mất cơ hội, ân hận); vui mừng, cảm động khi được nhận lời; khúm núm, thành kính trong cảnh cho chữ; thấm thía lời khuyên giữ thiên lương. Nghệ thuật: khắc họa tâm lí tinh tế qua hành động, cử chỉ. 3) Kết đoạn: khẳng định diễn biến tâm trạng làm nổi bật vẻ đẹp tri kỉ, thiên lương của nhân vật. BÀI MẪU: Viên quản ngục là nhân vật có diễn biến tâm trạng phong phú, tinh tế trong “Chữ người tử tù”. Ngay từ đầu, ông nôn nóng, khao khát có được chữ Huấn Cao: biệt đãi tử tù, dọn rượu thịt chu đáo, chỉ mong một ngày được xin chữ. Khi bị Huấn Cao khinh bạc, mắng là kẻ “làm tay sai cho cái ác”, quản ngục đau khổ, day dứt, lo sợ vĩnh viễn mất đi cơ hội — nỗi dằn vặt của kẻ tri kỉ bị hiểu lầm. Rồi vỡ òa trong niềm vui, cảm động khi Huấn Cao nhận lời cho chữ, hiểu ra tấm lòng mình. Đỉnh điểm là trong cảnh cho chữ, quản ngục “khúm núm”, thành kính đón nhận từng nét chữ như học trò trước thầy, và lặng người thấm thía lời khuyên “giữ thiên lương cho lành vững”. Diễn biến tâm trạng ấy được Nguyễn Tuân khắc họa tinh tế qua hành động, cử chỉ, lời nói, làm nổi bật vẻ đẹp của một kẻ tri âm tri kỉ: bề ngoài là cai tù, bên trong là tâm hồn biết quý trọng cái tài, cái đẹp. Chính diễn biến tâm lí chân thực ấy khiến nhân vật quản ngục trở nên sinh động, đáng mến và góp phần làm nên chiều sâu nhân văn của tác phẩm.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích giá trị hiện thực và giá trị nhân đạo của “Tản Viên từ Phán sự lục” (Nguyễn Dữ).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu Nguyễn Dữ, “Truyền kì mạn lục”, truyện “Tản Viên từ Phán sự lục”; nêu vấn đề: giá trị hiện thực và nhân đạo. 2) Thân bài: a) Tóm tắt cốt truyện. b) Giá trị hiện thực: phản ánh xã hội phong kiến suy tàn, nhiễu nhương (cái ác lộng hành, oan khuất: người ngay bị vu oan phải xuống âm phủ minh oan); phê phán bọn gian tà đội lốt thần thánh. c) Giá trị nhân đạo: ca ngợi con người cương trực, dũng cảm (Ngô Tử Văn); niềm tin chính nghĩa thắng gian tà, “ở hiền gặp lành”; ước mơ công lí (Diêm Vương minh xét, kẻ ác bị trừng trị). d) Nghệ thuật: kết hợp hiện thực – kì ảo, tình huống thử thách, đối lập chính – tà. 3) Kết bài: khẳng định giá trị bền vững; liên hệ (đấu tranh cho công lí hôm nay). BÀI MẪU: “Tản Viên từ Phán sự lục” của Nguyễn Dữ không chỉ là câu chuyện li kì mà còn là tác phẩm giàu giá trị hiện thực và nhân đạo. Về giá trị hiện thực, truyện phản ánh xã hội phong kiến Việt Nam thế kỉ XVI suy tàn, nhiễu nhương: cái ác lộng hành đến mức tên tướng giặc họ Thôi chết trận còn dám chiếm đền, làm yêu quái quấy nhiễu dân lành; người ngay thẳng như Ngô Tử Văn đốt đền trừ tà lại bị vu oan, phải xuống tận âm phủ mới minh oan được. Qua đó, Nguyễn Dữ phê phán bọn gian tà đội lốt thần thánh và bộ máy cai trị thối nát đương thời. Về giá trị nhân đạo, tác phẩm là bản ca ngợi con người: Ngô Tử Văn hiện lên với phẩm chất cương trực, dũng cảm, “thấy sự tà gian thì không chịu được”, dám xả thân vì dân, vì lẽ phải. Kết thúc có hậu — kẻ ác bị trừng trị, người ngay được minh oan và trọng dụng — gửi gắm niềm tin mãnh liệt: chính nghĩa nhất định thắng gian tà, “ở hiền gặp lành”. Đó cũng là ước mơ ngàn đời của nhân dân về một xã hội công bằng, nơi công lí được thực thi. Nghệ thuật kết hợp hiện thực và kì ảo, xây dựng tình huống thử thách, đối lập chính – tà gay gắt đã giúp Nguyễn Dữ chuyển tải thành công hai giá trị ấy. Ngày nay, đọc “Tản Viên từ Phán sự lục”, chúng ta càng thấm thía bài học: phải dám đấu tranh cho lẽ phải, cho công lí; và tin rằng trong cuộc đấu tranh ấy, chính nghĩa cuối cùng sẽ chiến thắng.", "points": 0}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "“Tản Viên từ Phán sự lục” kể về nhân vật nào?", "options": ["A. Nguyễn Dữ", "B. Thần Trụ Trời", "C. Ngô Tử Văn", "D. Huấn Cao"], "answer": "C", "explain": "Ngô Tử Văn là nhân vật trung tâm: kẻ sĩ khảng khái đốt đền trừ tà, được minh oan và cử làm phán sự đền Tản Viên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ Hán Việt nào sau đây có yếu tố “thiên” (trời)?", "options": ["A. Con trâu", "B. Cái cày", "C. Bánh chưng", "D. Thiên lương"], "answer": "D", "explain": "“Thiên lương” gồm yếu tố “thiên” (trời) và “lương” (tốt lành) — lương tâm trời phú, đạo đức trong sáng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thần Sét trong thần thoại có đặc điểm ngoại hình và tính khí như thế nào?", "options": ["A. Hiền lành, điềm đạm", "B. Mặt mũi nanh ác, tiếng quát dữ dội, tính nóng nảy", "C. Thích làm thơ, ca hát", "D. Sống ẩn dật dưới biển sâu"], "answer": "B", "explain": "Thần Sét mặt mũi nanh ác, nóng nảy, vác búa lớn — hình dung của dân gian về sự dữ dằn, đáng sợ của sấm sét.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa của việc Nguyễn Dữ cho Ngô Tử Văn đốt đền Tản Viên là gì?", "options": ["A. Khuyên người ta mê tín, cúng bái", "B. Thể hiện tinh thần đấu tranh chống tà gian, trừ hại cho dân; niềm tin chính nghĩa thắng gian tà", "C. Phê phán việc dùng lửa", "D. Kể chuyện đốt nhà cho vui"], "answer": "B", "explain": "Đốt đền là hành động chính nghĩa: trừ hại cho dân, khẳng định niềm tin cái thiện thắng cái ác.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong văn bản nghị luận phân tích tác phẩm truyện, phần thân bài cần làm gì?", "options": ["A. Chỉ nêu cảm xúc chung chung", "B. Kể lại toàn bộ cốt truyện", "C. Chép nguyên văn tác phẩm", "D. Phân tích nội dung (cốt truyện, tình huống, nhân vật), đánh giá nghệ thuật, nêu chủ đề và giá trị"], "answer": "D", "explain": "Thân bài phải vừa phân tích nội dung vừa đánh giá nghệ thuật, làm nổi bật giá trị của tác phẩm — không kể lể dài dòng.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Chi tiết viên quản ngục “khúm núm” đón nhận từng nét chữ trong cảnh cho chữ thuộc loại chi tiết nào?", "answer": "chi tiết nghệ thuật", "explain": "Chi tiết “khúm núm” nhỏ mà giàu sức gợi: thể hiện sự đảo lộn ngôi thứ, tôn vinh cái đẹp — chi tiết nghệ thuật đặc sắc.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Ngô Tử Văn đã dựa vào điều gì để thắng kiện trước Diêm Vương trong “Tản Viên từ Phán sự lục”?", "answer": "chính nghĩa", "explain": "Tử Văn thắng kiện nhờ lẽ phải, chính nghĩa: có bằng chứng, được thần linh chứng giám — niềm tin chính nghĩa thắng gian tà.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trí tưởng tượng phóng đại, phi thực tế (thần khổng lồ đội trời, người không đầu làm ra gió) trong thần thoại và truyền kì thuộc yếu tố nghệ thuật nào?", "answer": "kì ảo", "explain": "Yếu tố kì ảo là những chi tiết hoang đường, phi thực tế; trong thần thoại nó thể hiện trí tưởng tượng nguyên sơ, trong truyền kì kết hợp với hiện thực để phê phán xã hội.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu cảm nghĩ của em về tấm lòng tri kỉ của viên quản ngục trong “Chữ người tử tù”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu viên quản ngục — nhân vật đặc biệt, cai tù mà là tri kỉ của tử tù. 2) Thân đoạn: cảm nghĩ — khâm phục tấm lòng quý trọng cái tài, cái đẹp (biệt đãi tử tù, dọn rượu thịt, khao khát xin chữ); xúc động trước sự day dứt, ân hận khi bị hiểu lầm; trân trọng sự thành kính “khúm núm” trong cảnh cho chữ; suy ngẫm: thiên lương không phân biệt địa vị, cái đẹp có sức cảm hóa. 3) Kết đoạn: khẳng định nhân vật để lại ấn tượng sâu sắc; bài học (biết quý trọng cái đẹp, sống có thiên lương). BÀI MẪU: Trong “Chữ người tử tù”, nhân vật để lại trong em nhiều xúc động nhất chính là viên quản ngục — một kẻ tri kỉ đặc biệt. Đặc biệt ở chỗ, ông mang danh là cai tù, đại diện cho bộ máy cai trị, nhưng tâm hồn lại là của một nghệ sĩ: biết quý trọng cái tài, khao khát cái đẹp đến mức biệt đãi tử tù, dọn rượu thịt chu đáo chỉ mong một ngày được xin chữ. Em khâm phục tấm lòng ấy — giữa chốn ngục tù tăm tối, vẫn có một tâm hồn trong sáng hướng về cái đẹp. Em cũng xúc động trước nỗi day dứt của ông khi bị Huấn Cao khinh bạc, mắng mỏ: nỗi đau của kẻ tri kỉ bị hiểu lầm, sợ vĩnh viễn đánh mất cơ hội. Và em trân trọng giây phút ông “khúm núm” đón nhận từng nét chữ trong cảnh cho chữ — cái cúi mình thành kính của học trò trước thầy, của cái thiện trước cái đẹp. Nhân vật viên quản ngục cho em bài học sâu sắc: thiên lương không phân biệt địa vị, sang hèn; con người dù ở cương vị nào cũng có thể hướng về cái đẹp, cái thiện. Chính tấm lòng tri kỉ ấy đã góp phần làm nên giá trị nhân văn bất hủ của tác phẩm.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ bàn về sức hấp dẫn của truyện kể qua các tác phẩm đã học trong Bài 1 (thần thoại, “Tản Viên từ Phán sự lục”, “Chữ người tử tù”).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: nêu vấn đề — vì sao truyện kể có sức hấp dẫn đặc biệt; giới thiệu ba tác phẩm tiêu biểu ba thời kì. 2) Thân bài: a) Sức hấp dẫn từ cốt truyện, tình huống: thần thoại (kì ảo, li kì); Tản Viên (thử thách, âm phủ); Chữ người tử tù (tình huống éo le xin – cho chữ). b) Sức hấp dẫn từ nhân vật: thần Trụ Trời hùng vĩ; Ngô Tử Văn cương trực; Huấn Cao tài hoa, thiên lương — nhân vật sinh động, đáng nhớ. c) Sức hấp dẫn từ chi tiết nghệ thuật và ngôn ngữ: chi tiết kì ảo, cảnh cho chữ, ngôn ngữ giàu hình ảnh. d) Sức hấp dẫn từ tư tưởng: khát vọng nhận thức, niềm tin chính nghĩa, tôn vinh cái đẹp — chạm tới tâm hồn người đọc. 3) Kết bài: khẳng định truyện kể hấp dẫn vì vừa giải trí vừa bồi đắp tâm hồn; liên hệ (rèn thói quen đọc truyện, học cách kể chuyện). BÀI MẪU: Vì sao có những câu chuyện đọc một lần mà nhớ cả đời? Ba tác phẩm trong Bài 1 — “Truyện về các vị thần sáng tạo thế giới”, “Tản Viên từ Phán sự lục” và “Chữ người tử tù” — thuộc ba thời kì văn học khác nhau nhưng đều chứng minh sức hấp dẫn kì diệu của truyện kể. Trước hết, truyện hấp dẫn nhờ cốt truyện, tình huống độc đáo: thần thoại lôi cuốn bằng những chuyện hoang đường, li kì về các vị thần sáng tạo thế giới; “Tản Viên từ Phán sự lục” gay cấn với hành trình xuống âm phủ đối chất của Ngô Tử Văn; “Chữ người tử tù” nghẹt thở với tình huống xin – cho chữ éo le giữa ngục tối. Thứ hai, truyện hấp dẫn nhờ những nhân vật sinh động, đáng nhớ: thần Trụ Trời hùng vĩ, Ngô Tử Văn cương trực, Huấn Cao tài hoa với thiên lương trong sáng — mỗi nhân vật là một thế giới tính cách khiến người đọc yêu mến, cảm phục. Thứ ba, chi tiết nghệ thuật đặc sắc và ngôn ngữ giàu hình ảnh tạo nên dư vị khó quên: chi tiết thần đắp cột chống trời, cảnh Diêm Vương xử án, và nhất là cảnh cho chữ “xưa nay chưa từng có”. Cuối cùng và quan trọng nhất, truyện kể hấp dẫn vì chạm tới tâm hồn người đọc bằng những tư tưởng lớn: khát vọng nhận thức thế giới, niềm tin chính nghĩa thắng gian tà, sự tôn vinh cái đẹp và thiên lương. Truyện kể không chỉ để giải trí mà còn bồi đắp tâm hồn, dạy ta cách sống đẹp. Vì thế, hãy rèn thói quen đọc truyện mỗi ngày — mỗi trang truyện hay là một lần tâm hồn được mở rộng.", "points": 0}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Ngôi kể thứ ba có đặc điểm gì?", "options": ["A. Người kể xưng “tôi” và là nhân vật trong truyện", "B. Truyện không có cốt truyện", "C. Người kể giấu mình, gọi nhân vật bằng tên, có thể biết hết mọi chuyện", "D. Truyện được viết bằng thơ"], "answer": "C", "explain": "Ở ngôi thứ ba, người kể đứng ngoài câu chuyện, giấu mình — có tầm nhìn toàn cảnh, khách quan.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Chữ người tử tù” lấy bối cảnh chủ yếu ở đâu?", "options": ["A. Ngục tối (nhà tù)", "B. Chợ quê đông đúc", "C. Trường học", "D. Làng quê yên bình"], "answer": "A", "explain": "Toàn bộ câu chuyện diễn ra trong ngục tối — không gian tương phản với vẻ đẹp tâm hồn của nhân vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chùm truyện “Thần Trụ Trời, Thần Sét, Thần Gió” trong SGK được giới thiệu theo bản sưu tầm của ai?", "options": ["A. Nguyễn Trãi", "B. Nguyễn Du", "C. Tố Hữu", "D. Nguyễn Đổng Chi"], "answer": "D", "explain": "Ba truyện được giới thiệu theo bản sưu tầm của Nguyễn Đổng Chi — nhà nghiên cứu văn hóa dân gian.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận xét nào đúng về ý nghĩa kết thúc truyện “Chữ người tử tù”?", "options": ["A. Quản ngục lén thả Huấn Cao", "B. Huấn Cao vượt ngục thành công", "C. Huấn Cao bị xử chém nhưng cái đẹp, thiên lương đã chiến thắng; lời khuyên “giữ thiên lương” đọng lại", "D. Truyện không có kết thúc rõ ràng"], "answer": "C", "explain": "Kết thúc bi kịch mà ngời sáng: con người có thể chết nhưng cái đẹp, thiên lương thì bất diệt — đó là thông điệp nhân văn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi giới thiệu, đánh giá một tác phẩm truyện (nói và nghe), cần tránh điều gì?", "options": ["A. Nêu nội dung chính của tác phẩm", "B. Dẫn chứng ngắn gọn từ tác phẩm", "C. Trình bày mạch lạc, rõ ràng", "D. Kể lể dài dòng toàn bộ cốt truyện mà thiếu đánh giá nghệ thuật và cảm nhận cá nhân"], "answer": "D", "explain": "Giới thiệu tác phẩm cần nêu nội dung chính, điểm đặc sắc nghệ thuật và đánh giá, cảm nhận của bản thân — tránh kể lể dài dòng.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Trong truyện “Thần Trụ Trời”, vị thần đã làm gì để tách trời ra khỏi đất?", "answer": "đắp cột chống trời", "explain": "Thần Trụ Trời đào đất, đập đá đắp thành cột chống trời; rồi phá cột, ném đất đá tạo núi sông, biển đảo.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Vì sao dân gian lại sáng tạo ra truyện “Thần Sét”?", "answer": "lí giải hiện tượng sấm sét", "explain": "Người xưa chưa hiểu khoa học nên sáng tạo truyện để cắt nghĩa, lí giải hiện tượng sấm sét đáng sợ trong tự nhiên.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nhân vật kết tinh phẩm chất tiêu biểu của cả một lớp người trong một thời đại (như Ngô Tử Văn với kẻ sĩ cương trực thời loạn) được gọi là nhân vật …", "answer": "điển hình", "explain": "Nhân vật điển hình là nhân vật tiêu biểu, kết tinh phẩm chất của cả một lớp người, một thời đại.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích yếu tố kì ảo trong “Tản Viên từ Phán sự lục”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu yếu tố kì ảo — nét đặc sắc của truyện truyền kì Nguyễn Dữ. 2) Thân đoạn: phân tích các biểu hiện — thế giới âm phủ (Diêm Vương, phán quan, hồn ma kiện tụng); Ngô Tử Văn người trần xuống âm phủ đối chất; tên tướng giặc họ Thôi chết còn làm yêu quái. Tác dụng: tạo li kì, hấp dẫn; là phương tiện mượn cổ nói kim, phê phán hiện thực; tạo tình huống thử thách bộc lộ tính cách. Kết hợp hiện thực – kì ảo nhuần nhuyễn. 3) Kết đoạn: khẳng định yếu tố kì ảo làm nên sức hấp dẫn và chiều sâu tư tưởng. BÀI MẪU: Yếu tố kì ảo là nét đặc sắc làm nên sức hấp dẫn của “Tản Viên từ Phán sự lục”. Nguyễn Dữ đã dựng lên một thế giới âm phủ sinh động không kém trần gian: có Diêm Vương ngồi xử án, có phán quan, có hồn ma tên tướng giặc họ Thôi hiện về kiện tụng. Kì ảo nhất là chi tiết Ngô Tử Văn — một người trần mắt thịt — bị bắt xuống âm phủ, đối chất tay đôi với hồn ma trước Diêm Vương rồi được minh oan trở về. Ngay từ đầu truyện, chi tiết tên tướng giặc chết trận còn làm yêu quái, chiếm đền quấy nhiễu dân cũng đầy màu sắc hoang đường. Yếu tố kì ảo không chỉ tạo sự li kì, hấp dẫn mà còn là phương tiện nghệ thuật đắc lực: mượn chuyện ma quỷ, âm phủ để nói chuyện đời, phê phán xã hội phong kiến nhiễu nhương; đồng thời tạo nên tình huống thử thách nghiệt ngã để bộc lộ trọn vẹn tính cách cương trực của Ngô Tử Văn. Điều tài tình là Nguyễn Dữ kết hợp hiện thực và kì ảo nhuần nhuyễn đến mức người đọc tin vào tính xác thực của câu chuyện. Có thể nói, yếu tố kì ảo vừa là “gia vị” hấp dẫn vừa là “vũ khí” tư tưởng, làm nên giá trị đặc biệt của truyện truyền kì Nguyễn Dữ.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích chủ đề đấu tranh giữa chính nghĩa và gian tà trong “Tản Viên từ Phán sự lục” (chú ý nghệ thuật kết hợp hiện thực và kì ảo).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu Nguyễn Dữ, “Truyền kì mạn lục”, truyện “Tản Viên từ Phán sự lục”; nêu vấn đề: chủ đề chính – tà và nghệ thuật hiện thực – kì ảo. 2) Thân bài: a) Tóm tắt cốt truyện. b) Phân tích cuộc đấu tranh: tuyến chính nghĩa (Ngô Tử Văn: đốt đền, đối chất, được minh oan); tuyến gian tà (tướng giặc họ Thôi: chiếm đền, vu oan); diễn biến đấu tranh quyết liệt cả trần gian lẫn âm phủ; kết cục: chính nghĩa thắng. c) Nghệ thuật kết hợp hiện thực – kì ảo: chuyện đời xen chuyện ma; tác dụng (li kì, mượn cổ nói kim, thử thách nhân vật). d) Ý nghĩa: ca ngợi kẻ sĩ yêu nước; phê phán xã hội; niềm tin “ở hiền gặp lành”. 3) Kết bài: khẳng định giá trị; liên hệ (sống đấu tranh cho lẽ phải). BÀI MẪU: “Tản Viên từ Phán sự lục” của Nguyễn Dữ là một trong những truyện truyền kì xuất sắc nhất, với chủ đề nổi bật: cuộc đấu tranh không khoan nhượng giữa chính nghĩa và gian tà. Tuyến chính nghĩa tiêu biểu là Ngô Tử Văn — kẻ sĩ “khảng khái, nóng nảy, thấy sự tà gian thì không chịu được”. Hành động đốt đền Tản Viên mở đầu cho cuộc đấu tranh: dám đối đầu với yêu quái để trừ hại cho dân. Thử thách lên tới đỉnh điểm khi chàng bị hồn ma vu oan, bị bắt xuống âm phủ đối chất trước Diêm Vương. Bằng sự cương trực và mưu trí, Tử Văn vạch mặt tên tướng giặc họ Thôi, được minh oan và trọng dụng. Tuyến gian tà do tên tướng giặc họ Thôi đại diện: sống làm tướng giặc, chết còn làm yêu quái chiếm đền quấy dân, lại trơ trẽn đi kiện người ngay. Cuộc đấu tranh diễn ra quyết liệt cả ở trần gian lẫn âm phủ, và kết thúc với thắng lợi thuộc về chính nghĩa — gửi gắm niềm tin “ở hiền gặp lành”. Để thể hiện chủ đề ấy, Nguyễn Dữ dùng bút pháp kết hợp hiện thực và kì ảo tài tình: chuyện đốt đền, kiện tụng rất đời thường xen lẫn chuyện âm phủ hoang đường. Yếu tố kì ảo vừa tạo li kì, hấp dẫn vừa là phương tiện “mượn cổ nói kim”: mượn chuyện ma quỷ để phê phán xã hội phong kiến suy tàn, nơi cái ác lộng hành, người ngay bị oan khuất. Đồng thời, thế giới âm phủ là tình huống thử thách lí tưởng để bộc lộ khí phách Ngô Tử Văn. “Tản Viên từ Phán sự lục” vì thế vượt lên một câu chuyện li kì, trở thành bản tuyên ngôn về chính nghĩa. Tác phẩm nhắc nhở chúng ta hôm nay: phải dám đấu tranh cho lẽ phải, cho công lí, và hãy tin rằng chính nghĩa cuối cùng sẽ chiến thắng.", "points": 0}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Yếu tố nào làm nên sức hấp dẫn đặc biệt của truyện kể?", "options": ["A. Cốt truyện hấp dẫn, tình huống độc đáo, nhân vật sinh động, chi tiết nghệ thuật đặc sắc", "B. Truyện có càng nhiều nhân vật càng hay", "C. Truyện càng dài càng hấp dẫn", "D. Truyện viết càng khó hiểu càng hấp dẫn"], "answer": "A", "explain": "Sức hấp dẫn của truyện đến từ cốt truyện, tình huống độc đáo, nhân vật sinh động và chi tiết nghệ thuật đặc sắc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhan đề “Chữ người tử tù” gợi cho người đọc chú ý tới điều gì?", "options": ["A. Chế độ nhà tù phong kiến", "B. Vẻ đẹp tài hoa và thiên lương của con người tử tù Huấn Cao", "C. Nghề viết chữ của người tử tù", "D. Nỗi khổ của người tù"], "answer": "B", "explain": "Nhan đề tập trung vào “chữ” — biểu tượng của tài hoa và thiên lương — của “người tử tù” Huấn Cao.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong “Chữ người tử tù”, thầy thơ lại là người như thế nào?", "options": ["A. Kẻ phản bội, ton hót", "B. Người vô cảm, chỉ biết làm theo lệnh", "C. Người nhanh nhảu, cũng quý trọng cái tài của Huấn Cao, giúp quản ngục biệt đãi tử tù", "D. Kẻ độc ác, hay hành hạ phạm nhân"], "answer": "C", "explain": "Thầy thơ lại là nhân vật phụ đáng mến: nhanh nhảu, cũng là kẻ tri âm, góp phần làm nên không khí trân trọng cái đẹp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh Huấn Cao và viên quản ngục, điểm chung lớn nhất giữa họ là gì?", "options": ["A. Cùng là những con người có thiên lương, quý trọng cái đẹp, là tri kỉ của nhau", "B. Cùng từng làm quan trong triều", "C. Cùng quê quán với nhau", "D. Cùng vượt ngục thành công"], "answer": "A", "explain": "Dù ở hai đầu chiến tuyến (tử tù – cai tù), họ gặp nhau ở thiên lương và lòng quý trọng cái đẹp — trở thành tri kỉ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Muốn phân tích một truyện ngắn, bước đầu tiên nên làm gì?", "options": ["A. Học thuộc lòng toàn bộ truyện", "B. Vẽ tranh minh họa các nhân vật", "C. Viết ngay kết bài", "D. Đọc lướt để nắm cốt truyện, nhân vật chính, sự kiện trung tâm"], "answer": "D", "explain": "Bước 1 của đọc hiểu truyện là đọc lướt nắm cốt truyện, nhân vật chính, sự kiện trung tâm; sau đó mới đọc kĩ, phân tích, tổng hợp.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Nêu tên tập truyện ngắn chứa “Chữ người tử tù”.", "answer": "Vang bóng một thời", "explain": "“Vang bóng một thời” (1940) là tập truyện ngắn xuất sắc của Nguyễn Tuân viết về vẻ đẹp xưa cũ, vang bóng.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trong “Tản Viên từ Phán sự lục”, kẻ ác đội lốt thần thánh, chiếm đền quấy nhiễu dân là ai?", "answer": "tướng giặc họ Thôi", "explain": "Tên tướng giặc họ Thôi tử trận còn làm yêu quái, chiếm đền Tản Viên quấy nhiễu dân — đại diện cho gian tà.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vấn đề, tư tưởng trung tâm mà tác phẩm thể hiện (như “ca ngợi thiên lương” trong “Chữ người tử tù”) được gọi là … của tác phẩm.", "answer": "chủ đề", "explain": "Chủ đề là vấn đề, tư tưởng trung tâm của tác phẩm; xác định đúng chủ đề là yêu cầu của bước tổng hợp khi đọc hiểu.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích nghệ thuật miêu tả nhân vật Huấn Cao trong “Chữ người tử tù” (ngoại hình, hành động, lời nói).", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu Huấn Cao và nghệ thuật miêu tả tài tình của Nguyễn Tuân. 2) Thân đoạn: phân tích — ngoại hình (được gợi qua ấn tượng “cái râu mà rung rung”, dáng vẻ hiên ngang); hành động (thản nhiên nhận rượu thịt, đĩnh đạc cho chữ dù đeo gông); lời nói (khinh bạc với kẻ bất nghĩa, chân thành với tri kỉ, lời khuyên giữ thiên lương). Tác dụng: khắc họa con người tài hoa, khí phách, thiên lương; ngôn ngữ tạo hình như vẽ. 3) Kết đoạn: khẳng định nghệ thuật miêu tả góp phần tạo nên hình tượng bất hủ. BÀI MẪU: Nguyễn Tuân đã khắc họa nhân vật Huấn Cao bằng nghệ thuật miêu tả bậc thầy, kết hợp nhuần nhuyễn ngoại hình, hành động và lời nói. Ngoại hình Huấn Cao không được tả kĩ mà hiện lên qua những nét chấm phá ấn tượng: dáng vẻ hiên ngang, “cái râu mà rung rung” đầy khí phách của kẻ anh hùng. Hành động của ông nói lên tất cả: thản nhiên nhận rượu thịt của quản ngục như không có chuyện gì; đến đêm cho chữ, dù “cổ đeo gông, chân vướng xiềng” vẫn đĩnh đạc, đường hoàng viết từng nét chữ tài hoa — hành động của con người coi thường gông cùm, coi cái chết nhẹ tựa lông hồng. Lời nói Huấn Cao cũng đầy cá tính: khinh bạc, mắng mỏ kẻ mà ông cho là tay sai của cái ác; nhưng lại chân thành, cảm động khi nhận ra tấm lòng tri kỉ, với lời khuyên “giữ thiên lương cho lành vững” như một di chúc tinh thần. Ba phương diện hòa quyện, được thể hiện bằng ngôn ngữ giàu chất tạo hình “như vẽ bằng bút lông”, đã dựng lên một Huấn Cao toàn vẹn: tài hoa, khí phách và thiên lương. Nghệ thuật miêu tả ấy chính là bí quyết khiến hình tượng Huấn Cao sống mãi trong lòng người đọc.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ so sánh nghệ thuật xây dựng tình huống truyện trong “Tản Viên từ Phán sự lục” và “Chữ người tử tù”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu hai tác phẩm, hai tác giả; nêu vấn đề: so sánh nghệ thuật xây dựng tình huống truyện. 2) Thân bài: a) Điểm giống: đều xây dựng tình huống thử thách, éo le để bộc lộ tính cách nhân vật (Tử Văn bị vu oan xuống âm phủ; Huấn Cao cho chữ trong ngục tối); tình huống đều có thắt nút – cởi nút, tạo kịch tính. b) Điểm khác: Tản Viên dùng tình huống kì ảo, kéo dài (hành trình trần gian – âm phủ), thử thách về lòng dũng cảm, mưu trí; Chữ người tử tù dùng tình huống hiện thực, dồn nén trong một đêm, thử thách về thiên lương, cái đẹp. c) Lí giải: khác nhau do thể loại, thời đại (truyền kì trung đại chuộng kì ảo; truyện ngắn hiện đại chú trọng tâm lí). d) Đánh giá: cả hai đều thành công, tình huống là linh hồn tác phẩm. 3) Kết bài: khẳng định tài năng của hai tác giả; bài học (học cách xây dựng tình huống khi kể chuyện, viết văn). BÀI MẪU: Nguyễn Dữ và Nguyễn Tuân cách nhau bốn thế kỉ, nhưng cả “Tản Viên từ Phán sự lục” và “Chữ người tử tù” đều thành công nhờ nghệ thuật xây dựng tình huống truyện đặc sắc. Điểm gặp gỡ lớn nhất là cả hai đều đặt nhân vật vào tình huống thử thách, éo le để bộc lộ tính cách: Ngô Tử Văn đốt đền trừ tà rồi bị vu oan, phải xuống âm phủ đối chất; Huấn Cao là tử tù mà lại là người ban phát cái đẹp cho kẻ cai tù trong đêm trước giờ xử chém. Tình huống của cả hai truyện đều có thắt nút – cởi nút, tạo kịch tính lôi cuốn. Tuy nhiên, cách xây dựng có nét khác biệt rõ rệt. Ở “Tản Viên từ Phán sự lục”, tình huống mang màu sắc kì ảo, trải dài theo hành trình từ trần gian xuống âm phủ rồi trở về — thử thách nhân vật về lòng dũng cảm và mưu trí, phù hợp với thể loại truyền kì trung đại. Ở “Chữ người tử tù”, tình huống hiện thực, dồn nén trong một đêm duy nhất nơi ngục tối — thử thách nhân vật về thiên lương và quan niệm cái đẹp, phù hợp với truyện ngắn hiện đại chú trọng khám phá tâm lí, tư tưởng. Sự khác biệt ấy bắt nguồn từ thời đại và quan niệm nghệ thuật: Nguyễn Dữ mượn cõi âm để nói chuyện đời, Nguyễn Tuân dựng tình huống éo le để tôn vinh cái đẹp. Dù khác nhau, cả hai tình huống đều là linh hồn của tác phẩm, chứng tỏ tài năng bậc thầy của hai tác giả trong nghệ thuật truyện kể. Học hai truyện, em rút ra bài học quý: muốn kể chuyện hay, viết văn hấp dẫn, phải biết xây dựng tình huống độc đáo, đặt nhân vật vào thử thách để tính cách được bộc lộ một cách tự nhiên mà sâu sắc.", "points": 0}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Khi viết văn bản nghị luận phân tích tác phẩm truyện, phần mở bài cần làm gì?", "options": ["A. Trích dẫn dài dòng tác phẩm", "B. Giới thiệu tác giả, tác phẩm và nêu vấn đề nghị luận", "C. Viết lời kết luận", "D. Kể lại toàn bộ cốt truyện"], "answer": "B", "explain": "Mở bài giới thiệu tác giả, tác phẩm và nêu rõ vấn đề nghị luận (phân tích, đánh giá khía cạnh nào).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dòng nào gồm toàn từ Hán Việt?", "options": ["A. Xanh xanh, à ơi, thầm thì", "B. Thiên lương, tử tù, quốc gia", "C. Đi học, về nhà, ăn cơm", "D. Con trâu, cái cày, bánh chưng"], "answer": "B", "explain": "“Thiên lương, tử tù, quốc gia” đều là từ Hán Việt; các dòng còn lại là từ thuần Việt hoặc từ láy.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Truyện về các vị thần sáng tạo thế giới” thuộc thể loại nào?", "options": ["A. Thần thoại dân gian", "B. Truyện ngắn hiện đại", "C. Kịch nói", "D. Tiểu thuyết chương hồi"], "answer": "A", "explain": "Đây là thần thoại dân gian — truyện kể về các vị thần sáng tạo thế giới của người Việt cổ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm giống nhau giữa ba tác phẩm trong Bài 1 (thần thoại, truyền kì, truyện ngắn hiện đại) là gì?", "options": ["A. Đều có yếu tố kì ảo, hoang đường", "B. Đều kể về các vị thần linh", "C. Đều được viết bằng chữ Hán", "D. Đều là truyện kể có sức hấp dẫn riêng, đều hướng tới cái đẹp, cái thiện, chính nghĩa"], "answer": "D", "explain": "Dù khác thời đại, thể loại, cả ba đều là truyện kể hấp dẫn và cùng hướng tới giá trị nhân văn: cái đẹp, cái thiện, chính nghĩa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các bước đọc hiểu truyện, bước “tổng hợp” yêu cầu làm gì?", "options": ["A. Đọc lướt nắm cốt truyện", "B. Ghi nhớ tên tác giả", "C. Rút ra chủ đề, tư tưởng, thông điệp; đánh giá giá trị nội dung và nghệ thuật", "D. Đếm số lượng nhân vật"], "answer": "C", "explain": "Tổng hợp là bước cuối: rút ra chủ đề, tư tưởng, thông điệp và đánh giá giá trị nội dung, nghệ thuật của tác phẩm.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Trong “Chữ người tử tù”, không gian nghệ thuật chủ yếu của câu chuyện là …", "answer": "ngục tối", "explain": "Ngục tối là không gian tương phản với vẻ đẹp tâm hồn nhân vật, làm nổi bật chủ đề cái đẹp chiến thắng.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Vì sao viên quản ngục lại biệt đãi Huấn Cao ngay từ đầu, dù chưa được cho chữ?", "answer": "kính trọng", "explain": "Quản ngục biết Huấn Cao là người tài hoa, có thiên lương nên đem lòng kính trọng, biệt đãi — tình cảm của kẻ tri kỉ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Khi tác giả để nhân vật “tôi” trực tiếp kể lại câu chuyện mình chứng kiến, ngôi kể thứ nhất tạo ưu thế lớn nhất ở mặt nào?", "answer": "chân thực", "explain": "Ngôi kể thứ nhất tạo cảm giác chân thực, gần gũi vì người kể là người trong cuộc, kể điều mình trải qua.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày suy nghĩ của em về thông điệp “giữ thiên lương cho lành vững” trong “Chữ người tử tù” và cuộc sống hôm nay.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu thông điệp — lời khuyên cuối của Huấn Cao với quản ngục. 2) Thân đoạn: suy nghĩ — “thiên lương” là lương tâm, đạo đức trong sáng; “giữ cho lành vững” là giữ gìn, không để vẩn đục; ý nghĩa trong truyện (lời di chúc tinh thần); liên hệ hôm nay (giữa cám dỗ: gian lận, vụ lợi, sống ảo… cần giữ lương tâm trong sáng; người có thiên lương được mọi người kính trọng). 3) Kết đoạn: khẳng định thông điệp còn nguyên giá trị; quyết tâm rèn luyện. BÀI MẪU: “Giữ thiên lương cho lành vững” — lời khuyên cuối cùng của Huấn Cao dành cho viên quản ngục cũng là thông điệp sâu sắc nhất của “Chữ người tử tù” gửi tới người đọc. “Thiên lương” là lương tâm, là đạo đức trong sáng trời phú cho mỗi con người; “giữ cho lành vững” nghĩa là phải gìn giữ, bảo vệ nó nguyên vẹn, không để những vẩn đục của cuộc đời làm hoen ố. Trong truyện, đó là lời di chúc tinh thần của người tử tù dành cho kẻ tri kỉ: hãy bỏ chốn quan trường nhơ nhuốc mà về quê sống trong sạch. Thông điệp ấy còn nguyên giá trị với cuộc sống hôm nay. Giữa bao cám dỗ — gian lận trong thi cử, vụ lợi, sống ảo, vô cảm — mỗi chúng ta càng cần giữ cho lương tâm trong sáng, không làm điều trái với lẽ phải. Người có thiên lương sẽ được mọi người kính trọng, sống thanh thản; kẻ đánh mất thiên lương dù giàu sang cũng khổ tâm, dằn vặt. Em tự nhủ sẽ rèn luyện mỗi ngày: trung thực trong học tập, nhân ái với mọi người, dám từ chối cái xấu — để “thiên lương” trong mình mãi “lành vững” như lời Huấn Cao căn dặn.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ trả lời câu hỏi: Vì sao truyện kể có sức hấp dẫn đặc biệt với người đọc? (Liên hệ các tác phẩm đã học trong Bài 1.)", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: nêu hiện tượng — con người mọi thời đều mê truyện kể; nêu vấn đề: lí giải sức hấp dẫn (liên hệ ba tác phẩm Bài 1). 2) Thân bài: a) Hấp dẫn vì thỏa mãn trí tò mò, khát vọng khám phá (cốt truyện li kì, tình huống éo le: thần thoại, âm phủ, xin – cho chữ). b) Hấp dẫn vì cho ta gặp gỡ những con người đẹp (thần Trụ Trời, Ngô Tử Văn, Huấn Cao) — bồi đắp tâm hồn. c) Hấp dẫn vì chứa đựng trí tuệ, tư tưởng (khát vọng nhận thức, niềm tin chính nghĩa, tôn vinh cái đẹp) — vừa giải trí vừa giáo dục. d) Mở rộng: so với phim ảnh, truyện kể kích thích trí tưởng tượng nhiều hơn. 3) Kết bài: khẳng định sức hấp dẫn bền vững; kêu gọi đọc sách, kể chuyện. BÀI MẪU: Từ thuở ấu thơ nghe bà kể chuyện cổ tích đến hôm nay đọc truyện ngắn hiện đại, con người dường như sinh ra đã mê truyện kể. Vì sao truyện kể có sức hấp dẫn đặc biệt đến vậy? Ba tác phẩm trong Bài 1 cho ta câu trả lời. Trước hết, truyện hấp dẫn vì thỏa mãn trí tò mò và khát vọng khám phá của con người. Ai mà không tò mò muốn biết thần Trụ Trời đã tách trời đất ra sao, Ngô Tử Văn đối chất với Diêm Vương thế nào, hay đêm cho chữ trong ngục tối diễn biến ra sao? Cốt truyện li kì, tình huống éo le như một thỏi nam châm níu chân người đọc. Thứ hai, truyện hấp dẫn vì cho ta gặp gỡ những con người đẹp: thần Trụ Trời hùng vĩ, Ngô Tử Văn cương trực, Huấn Cao tài hoa với thiên lương trong sáng. Gặp gỡ họ, tâm hồn ta được bồi đắp, ta học được cách sống đẹp, sống có khí phách. Thứ ba, truyện hấp dẫn vì chứa đựng trí tuệ và tư tưởng lớn: khát vọng nhận thức thế giới của người xưa, niềm tin chính nghĩa thắng gian tà, sự tôn vinh cái đẹp và thiên lương. Truyện kể vì thế vừa giải trí vừa giáo dục, vừa là tấm gương phản chiếu cuộc đời. So với phim ảnh, truyện kể còn có ưu thế riêng: nó buộc trí tưởng tượng của người đọc phải hoạt động, mỗi người tự vẽ nên thế giới riêng trong tâm trí — đó là niềm vui sáng tạo không gì thay thế được. Có thể nói, sức hấp dẫn của truyện kể đến từ sự hòa quyện giữa trí tuệ, tâm hồn và nghệ thuật. Trong thời đại bùng nổ thông tin hôm nay, hãy
