{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Tác giả của văn bản Về chính chúng ta là ai?", "options": ["A. Robert Frost", "B. Carlo Rovelli", "C. Phan Văn Trường", "D. Nguyễn Văn Thạc"], "answer": "B", "points": 0.25, "explain": "Về chính chúng ta của Các-lô Rô-ve-li (Carlo Rovelli), nhà vật lí lí thuyết người Ý, trích từ 7 bài học hay nhất về vật lí."}, {"type": "mcq", "level": "NB", "q": "Bài thơ Con đường không chọn của R. Frost sử dụng hình tượng trung tâm nào?", "options": ["A. Dòng sông", "B. Hai con đường rẽ trong rừng", "C. Ngọn núi", "D. Biển cả"], "answer": "B", "points": 0.25, "explain": "Hình tượng trung tâm là hai con đường rẽ trong rừng — ẩn dụ cho những lựa chọn trong đời người."}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa triết lí của hình tượng con đường trong bài thơ của R. Frost là gì?", "options": ["A. Ca ngợi cảnh đẹp thiên nhiên", "B. Ẩn dụ cho sự lựa chọn trong đời người: mỗi quyết định đều không thể quay lại và định hình số phận", "C. Kể về một chuyến du lịch", "D. Phê phán giao thông"], "answer": "B", "points": 0.25, "explain": "Con đường là ẩn dụ cho lựa chọn đời người: đứng trước ngã rẽ phải quyết định; đã chọn thì không thể quay lại; mỗi lựa chọn đều để lại day dứt và định hình số phận."}, {"type": "mcq", "level": "TH", "q": "Theo Phan Văn Trường, điểm khác biệt căn bản giữa con người và con vật là gì?", "options": ["A. Con người khỏe hơn", "B. Con người được quyền lựa chọn hướng đi cho đời mình", "C. Con người sống lâu hơn", "D. Con người ăn nhiều hơn"], "answer": "B", "points": 0.25, "explain": "Con vật chỉ tìm đường để tồn tại theo bản năng; con người có khả năng lựa chọn hướng đi, chịu trách nhiệm về lựa chọn của mình — đó là phẩm giá con người."}, {"type": "mcq", "level": "VDC", "q": "Thông điệp sâu sắc nhất của văn bản Một đời như kẻ tìm đường là gì?", "options": ["A. Hãy chờ đợi số phận an bài", "B. Dù chọn con đường nào, hãy hết lòng hết sức với nó — hạnh phúc nằm ngay trên chính con đường ta đã chọn", "C. Chỉ có một con đường duy nhất đúng", "D. Không cần lựa chọn gì cả"], "answer": "B", "points": 0.25, "explain": "Tác giả chiêm nghiệm: bất kì con đường nào cũng có lối ra; điều quan trọng không phải chọn đường nào mà là hết lòng với lựa chọn của mình — hạnh phúc nằm trên hành trình, không phải đích đến."}, {"type": "short", "level": "NB", "q": "Văn bản Mãi mãi tuổi hai mươi thuộc thể loại nào?", "answer": "Nhật kí", "points": 0.5, "explain": "Mãi mãi tuổi hai mươi là cuốn nhật kí của liệt sĩ Nguyễn Văn Thạc, ghi lại suy nghĩ, tình cảm của chàng sinh viên trên đường ra trận."}, {"type": "short", "level": "TH", "q": "Nêu hai đặc điểm của tản văn.", "answer": "Tự do, linh hoạt; giàu cảm xúc, suy ngẫm; cái tôi tác giả rõ nét", "points": 0.5, "explain": "Tản văn là văn xuôi ngắn, tự do linh hoạt; ghi cảm xúc, suy ngẫm của tác giả; ngôn ngữ giàu chất thơ, chất triết lí; cái tôi rõ nét."}, {"type": "short", "level": "VD", "q": "Trong sơ đồ Tôi của tương lai (SGK trang 111), các phương tiện phi ngôn ngữ gồm những gì?", "answer": "Hình ảnh, màu sắc, đường nét, số liệu", "points": 0.5, "explain": "Sơ đồ dùng hình ảnh (hình tròn với tâm là Tôi của tương lai), màu sắc (mỗi màu một phương diện), đường nét (mốc thời gian, mục tiêu), số liệu (giai đoạn) để trực quan hóa ước mơ."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về ý nghĩa của sự lựa chọn trong đời người (gợi ý từ Con đường không chọn và Một đời như kẻ tìm đường).", "points": 0, "explain": "DÀN Ý: Mở đoạn: lựa chọn là điều không thể tránh trong đời. Thân đoạn: mỗi lựa chọn đều không thể quay lại (Frost: day dứt trước ngã rẽ); điều quan trọng là dám lựa chọn và chịu trách nhiệm (Phan Văn Trường: hạnh phúc nằm trên con đường đã chọn); liên hệ: lựa chọn nghề nghiệp, lối sống của tuổi trẻ. Kết đoạn: hãy lựa chọn bằng cả trái tim và lí trí. BÀI MẪU: Trong đời người, lựa chọn là điều không thể tránh khỏi và cũng là điều làm nên số phận mỗi người. Bài thơ Con đường không chọn của R. Frost cho ta thấy nỗi day dứt muôn thuở: đứng trước ngã rẽ, ta ước gì được đi cả hai con đường, ước gì biết trước tương lai — nhưng đời không cho ta đặc ân ấy; mỗi bước đi đều không thể quay lại. Nỗi day dứt ấy không phải để ta sợ hãi lựa chọn mà để ta hiểu: lựa chọn nào cũng đáng trân trọng nếu ta đã cân nhắc kĩ. Phan Văn Trường trong Một đời như kẻ tìm đường lại mang đến một góc nhìn ấm áp: điều quan trọng không phải là chọn con đường nào, mà là sau khi chọn, hãy hết lòng hết sức với nó — bởi hạnh phúc nằm ngay trên chính con đường ta đã chọn. Với tuổi trẻ chúng em, những lựa chọn về nghề nghiệp, lối sống đang ở phía trước. Hãy lựa chọn bằng cả trái tim và lí trí, rồi dũng cảm bước đi, không hối tiếc, không đổ lỗi cho số phận. Bởi cuối cùng, chính thái độ của ta với lựa chọn mới quyết định ta thành công hay thất bại."}, {"type": "essay", "level": "VDC", "q": "Viết bài luận về bản thân (khoảng 600 chữ) theo bố cục đã học.", "points": 0, "explain": "DÀN Ý: Mở bài: giới thiệu khái quát về bản thân. Thân bài: Điểm mạnh (tính cách, năng lực, thành tích kèm dẫn chứng); điểm yếu, hạn chế và nguyên nhân (trung thực); ước mơ, mục tiêu (ngắn hạn, dài hạn); kế hoạch rèn luyện cụ thể (học tập, kĩ năng, sức khỏe). Kết bài: quyết tâm, niềm tin. BÀI MẪU: (Bài mẫu minh họa — học sinh viết về chính mình theo dàn ý.) Tôi là một học sinh lớp 10 bình thường với những ước mơ không hề bình thường. Nhìn lại mình, tôi thấy bản thân có những điểm mạnh đáng tự hào: tôi ham học hỏi, đặc biệt yêu thích văn chương; tôi sống chân thành, được bạn bè tin tưởng; tôi có ý chí — từng từ học sinh trung bình vươn lên học sinh giỏi nhờ kiên trì mỗi ngày. Dẫn chứng là những giờ tôi miệt mài bên trang sách, những lần tôi giúp bạn cùng tiến bộ. Nhưng tôi cũng trung thực nhìn nhận điểm yếu của mình: tôi hay trì hoãn, đôi khi nóng vội; khả năng quản lí thời gian chưa tốt khiến nhiều kế hoạch dang dở; tôi còn nhút nhát trước đám đông. Nguyên nhân một phần do thói quen xấu, một phần do tôi chưa đủ quyết tâm rèn luyện. Ước mơ của tôi là trở thành một nhà báo — người dùng ngòi bút để lan tỏa điều tốt đẹp. Mục tiêu ngắn hạn: đỗ vào đội tuyển văn của trường trong năm nay; mục tiêu dài hạn: thi đỗ khoa Báo chí của một trường đại học uy tín. Để thực hiện, tôi đặt kế hoạch cụ thể: mỗi ngày đọc 30 phút sách báo, viết nhật kí rèn diễn đạt; tham gia câu lạc bộ báo chí học đường; rèn sự tự tin bằng cách xung phong phát biểu, thuyết trình; tập thể dục đều đặn để có sức khỏe tốt. Tôi tin rằng với sự trung thực nhìn nhận mình và quyết tâm hành động, tôi sẽ từng bước biến ước mơ thành hiện thực. Tuổi trẻ chỉ đến một lần — tôi sẽ sống sao cho không phải hối tiếc. (Học sinh viết về chính mình: thay thông tin, dẫn chứng của bản thân theo đúng bố cục trên.)"}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Tác giả Phan Văn Trường được biết đến với vai trò nào?", "options": ["A. Nhà thơ", "B. Chuyên gia đàm phán quốc tế, cố vấn Chính phủ Pháp", "C. Cầu thủ bóng đá", "D. Ca sĩ"], "answer": "B", "points": 0.25, "explain": "Phan Văn Trường (sinh 1946) là chuyên gia cao cấp về đàm phán quốc tế, cố vấn của Chính phủ Pháp; cuốn Một đời như kẻ tìm đường đúc kết trải nghiệm của ông gửi thế hệ trẻ."}, {"type": "mcq", "level": "NB", "q": "Kiểu bài viết của Bài 9 là gì?", "options": ["A. Bài luận về bản thân", "B. Văn bản nội quy", "C. Bài văn nghị luận về tác phẩm truyện", "D. Văn bản nghị luận về một vấn đề xã hội"], "answer": "A", "points": 0.25, "explain": "Kiểu bài viết của Bài 9 là bài luận về bản thân — văn bản nghị luận mà đối tượng là chính người viết."}, {"type": "mcq", "level": "TH", "q": "Theo văn bản Về chính chúng ta, mọi sự vật quanh ta có điểm chung gì?", "options": ["A. Đều biết nói", "B. Đều chứa thông tin (giọt mưa, tia sáng, đồng hồ, cơn gió, DNA...)", "C. Đều do con người tạo ra", "D. Đều không quan trọng"], "answer": "B", "points": 0.25, "explain": "Tác giả chỉ ra: giọt mưa chứa thông tin về đám mây, tia sáng chứa thông tin về màu sắc, đồng hồ chứa thông tin về thời gian, DNA chứa thông tin di truyền... — vạn vật đều chứa thông tin."}, {"type": "mcq", "level": "TH", "q": "Giọng điệu chủ đạo của bài thơ Con đường không chọn là gì?", "options": ["A. Vui tươi, rộn rã", "B. Trầm lắng, suy tư, day dứt", "C. Hài hước, dí dỏm", "D. Giận dữ, phê phán"], "answer": "B", "points": 0.25, "explain": "Bài thơ có giọng trầm lắng, suy tư: người lữ khách đứng trước ngã rẽ với nỗi phân vân, day dứt — giọng điệu của triết lí nhân sinh."}, {"type": "mcq", "level": "VDC", "q": "Điểm gặp gỡ về tư tưởng giữa Về chính chúng ta và Một đời như kẻ tìm đường là gì?", "options": ["A. Cùng bàn về vật lí", "B. Cùng khẳng định giá trị của con người: hiểu mình trong vũ trụ và dám làm chủ cuộc đời bằng lựa chọn", "C. Cùng phê phán xã hội", "D. Không có điểm chung"], "answer": "B", "points": 0.25, "explain": "Cả hai văn bản đều hướng về con người: Rovelli giúp ta hiểu mình là một phần của vũ trụ; Phan Văn Trường khẳng định con người làm chủ đời mình bằng quyền lựa chọn — cùng tôn vinh giá trị con người."}, {"type": "short", "level": "NB", "q": "Nguyễn Văn Thạc hi sinh năm bao nhiêu tuổi?", "answer": "20 tuổi", "points": 0.5, "explain": "Nguyễn Văn Thạc (1952–1972) hi sinh khi mới 20 tuổi; cuốn nhật kí của anh có tên Mãi mãi tuổi hai mươi."}, {"type": "short", "level": "TH", "q": "Nêu hai yêu cầu đối với bài luận về bản thân.", "answer": "Chân thành, trung thực (không tô vẽ, không tự ti); có dẫn chứng cụ thể", "points": 0.5, "explain": "Bài luận về bản thân đòi hỏi chân thành, trung thực — nhìn thẳng vào cả điểm mạnh và điểm yếu; mọi nhận định cần có dẫn chứng cụ thể (kỉ niệm, thành tích)."}, {"type": "short", "level": "VD", "q": "Muốn thiết kế một sơ đồ từ đoạn văn, bước đầu tiên cần làm gì?", "answer": "Xác định thông tin chính và mối quan hệ giữa các thông tin", "points": 0.5, "explain": "Thiết kế sơ đồ bắt đầu từ việc xác định thông tin chính và mối quan hệ giữa chúng; sau đó mới chọn loại sơ đồ và dùng hình ảnh, màu sắc thể hiện."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu cảm nhận của em về khát vọng sống đẹp của thế hệ cha anh qua nhật kí Mãi mãi tuổi hai mươi.", "points": 0, "explain": "DÀN Ý: Mở đoạn: giới thiệu nhật kí và tác giả. Thân đoạn: khát vọng sống có ích, có lí tưởng; sẵn sàng hi sinh vì Tổ quốc; nỗi nhớ gia đình, tình yêu cuộc sống; trăn trở về ý nghĩa đời người ở tuổi hai mươi. Kết đoạn: bài học cho thế hệ hôm nay. BÀI MẪU: Đọc những trang nhật kí Mãi mãi tuổi hai mươi của liệt sĩ Nguyễn Văn Thạc, em vô cùng xúc động trước khát vọng sống đẹp của thế hệ cha anh. Ở tuổi hai mươi — độ tuổi đẹp nhất của đời người, thay vì nghĩ cho riêng mình, anh Thạc và bao thanh niên thời ấy đã xếp bút nghiên lên đường ra trận với lí tưởng cao cả: chiến đấu vì độc lập, tự do của Tổ quốc. Trang nhật kí thấm đượm tình yêu cuộc sống: nỗi nhớ mẹ, nhớ em, nhớ mái trường, bạn bè; những trăn trở về ý nghĩa của cuộc đời, về cách sống sao cho xứng đáng. Anh không hề sợ hi sinh mà chỉ sợ sống hoài, sống phí tuổi trẻ. Khát vọng ấy thật lớn lao và cũng thật giản dị: sống có ích, sống vì mọi người. Soi mình vào tấm gương ấy, em thấy thế hệ hôm nay thật may mắn được sống trong hòa bình — và càng thấy trách nhiệm phải sống xứng đáng: học tập tốt, sống có lí tưởng, biết ơn những người đã ngã xuống cho độc lập hôm nay. Mãi mãi tuổi hai mươi mãi là hành trang tinh thần quý báu cho tuổi trẻ Việt Nam."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề: Ước mơ và hành động của tuổi trẻ.", "points": 0, "explain": "DÀN Ý: Mở bài: vai trò của ước mơ; vấn đề: ước mơ phải đi đôi với hành động. Thân bài: Giải thích: ước mơ là khát vọng tốt đẹp; hành động là việc làm biến ước mơ thành hiện thực. Bàn luận: ước mơ không có hành động chỉ là ảo tưởng; hành động không có ước mơ dễ lạc hướng; cần ước mơ vừa sức, kế hoạch cụ thể, kiên trì. Dẫn chứng: tấm gương (Phan Văn Trường: từ lựa chọn đến thành công; các bạn trẻ khởi nghiệp; học sinh vượt khó). Thực trạng: một số bạn sống không ước mơ hoặc chỉ mơ mà không làm. Giải pháp: xác định ước mơ, lập kế hoạch, hành động mỗi ngày. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Ai cũng có ước mơ, nhưng không phải ai cũng biến ước mơ thành hiện thực. Khoảng cách giữa ước mơ và hiện thực được lấp đầy bằng một thứ duy nhất: hành động. Ước mơ là những khát vọng tốt đẹp về tương lai: trở thành bác sĩ, kĩ sư, nhà báo... Hành động là những việc làm cụ thể, kiên trì mỗi ngày để tiến gần đến ước mơ. Ước mơ mà không có hành động chỉ là ảo tưởng đẹp đẽ — như người đứng trước ngã rẽ mà mãi không dám bước đi. Ngược lại, hành động mà không có ước mơ dẫn đường dễ trở nên lạc hướng, mất phương hướng. Vì vậy, tuổi trẻ cần cả hai: một ước mơ rõ ràng, vừa sức và một kế hoạch hành động cụ thể, kiên trì. Nhìn vào tấm gương Phan Văn Trường: từ những lựa chọn dũng cảm thời trẻ, ông miệt mài học hỏi, trải nghiệm khắp thế giới để trở thành chuyên gia đàm phán quốc tế — ước mơ lớn được xây nên từ hàng nghìn hành động nhỏ mỗi ngày. Quanh ta cũng có biết bao bạn trẻ biến ước mơ thành hiện thực: bạn học sinh nghèo đỗ thủ khoa nhờ dậy từ 4 giờ sáng học bài; bạn trẻ khởi nghiệp từ gian hàng online nhỏ. Đáng buồn là vẫn có những bạn sống không ước mơ, buông thả; hoặc có ước mơ nhưng chỉ mơ mà không làm, viện đủ lí do trì hoãn. Để ước mơ thành hiện thực, mỗi bạn hãy: xác định ước mơ phù hợp với năng lực và đam mê; chia ước mơ lớn thành mục tiêu nhỏ; lập kế hoạch cụ thể từng ngày; kiên trì ngay cả khi nản lòng. Tuổi trẻ là quãng thời gian đẹp nhất để ước mơ và hành động. Đừng để tuổi trẻ trôi qua trong tiếc nuối — hãy ước mơ lớn và hành động ngay từ hôm nay, bởi hạnh phúc nằm trên chính con đường ta đã chọn và đang bước đi."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Robert Frost là nhà thơ nước nào?", "options": ["A. Anh", "B. Mỹ", "C. Pháp", "D. Nga"], "answer": "B", "points": 0.25, "explain": "Rô-bớt Phờ-rót (Robert Frost, 1874–1963) là nhà thơ lớn của Mỹ, nhiều lần đoạt giải Pulitzer."}, {"type": "mcq", "level": "NB", "q": "Văn bản Về chính chúng ta được trích từ tác phẩm nào?", "options": ["A. Đời sống bí ẩn của cây", "B. 7 bài học hay nhất về vật lí", "C. Văn minh Việt Nam", "D. Một đời như kẻ tìm đường"], "answer": "B", "points": 0.25, "explain": "Về chính chúng ta trích từ 7 bài học hay nhất về vật lí của Carlo Rovelli — cuốn sách khoa học thường thức nổi tiếng."}, {"type": "mcq", "level": "TH", "q": "Tùy bút khác tản văn ở điểm nào?", "options": ["A. Tùy bút tự do, tùy hứng hơn; cái tôi tác giả hiện rõ hơn", "B. Tùy bút luôn viết bằng thơ", "C. Tản văn không có cái tôi", "D. Không có điểm khác nhau"], "answer": "A", "points": 0.25, "explain": "Tùy bút gần với tản văn nhưng tự do, tùy hứng hơn trong ghi chép; cái tôi tác giả hiện lên rõ nét, chân thành, sâu sắc."}, {"type": "mcq", "level": "TH", "q": "Trong bài luận về bản thân, phần thân bài KHÔNG nên bao gồm nội dung nào?", "options": ["A. Điểm mạnh, điểm yếu của bản thân", "B. Ước mơ, kế hoạch rèn luyện", "C. Chép tiểu sử của một người nổi tiếng", "D. Phân tích nguyên nhân của hạn chế"], "answer": "C", "points": 0.25, "explain": "Bài luận về bản thân viết về chính mình: điểm mạnh, điểm yếu, ước mơ, kế hoạch. Chép tiểu sử người nổi tiếng không thuộc nội dung này."}, {"type": "mcq", "level": "VDC", "q": "Vì sao sự trung thực với chính mình là yêu cầu quan trọng nhất của bài luận về bản thân?", "options": ["A. Vì giáo viên dễ chấm điểm", "B. Vì chỉ khi nhìn thẳng vào cả điểm mạnh và điểm yếu, ta mới hiểu mình và có kế hoạch rèn luyện đúng đắn", "C. Vì bài văn sẽ dài hơn", "D. Vì mọi người thích đọc"], "answer": "B", "points": 0.25, "explain": "Tự tô vẽ khiến ta ảo tưởng, tự ti khiến ta nản lòng; chỉ có trung thực nhìn nhận mình mới hiểu đúng bản thân và xây dựng kế hoạch rèn luyện phù hợp, khả thi."}, {"type": "short", "level": "NB", "q": "Kể tên ba văn bản đọc chính của Bài 9.", "answer": "Về chính chúng ta, Con đường không chọn, Một đời như kẻ tìm đường", "points": 0.5, "explain": "Ba văn bản đọc chính: Về chính chúng ta (C. Rovelli), Con đường không chọn (R. Frost), Một đời như kẻ tìm đường (Phan Văn Trường)."}, {"type": "short", "level": "TH", "q": "Nêu hai biện pháp nghệ thuật trong văn bản Về chính chúng ta.", "answer": "Liệt kê và so sánh (ví dụ gần gũi)", "points": 0.5, "explain": "Tác giả dùng phép liệt kê dồn dập (giọt mưa, tia sáng, đồng hồ...) tạo nhịp và ví dụ gần gũi, so sánh giúp tri thức khoa học dễ hiểu."}, {"type": "short", "level": "VD", "q": "Nêu tác dụng của việc trực quan hóa ước mơ bằng sơ đồ (như sơ đồ Tôi của tương lai).", "answer": "Giúp xác lập mục tiêu rõ ràng, cụ thể; tạo động lực thực hiện", "points": 0.5, "explain": "Sơ đồ hóa ước mơ giúp mục tiêu trở nên rõ ràng, cụ thể, có mốc thời gian; từ đó tạo động lực và giúp ta theo dõi tiến độ thực hiện."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về câu nói: Hạnh phúc nằm ngay trên chính con đường ta đã chọn.", "points": 0, "explain": "DÀN Ý: Mở đoạn: giới thiệu câu nói (Phan Văn Trường). Thân đoạn: giải thích: hạnh phúc không chỉ ở đích đến mà ở hành trình nỗ lực; phê phán tâm lí đứng núi này trông núi nọ, đổ lỗi cho lựa chọn; dẫn chứng: người hết lòng với nghề đều tìm thấy niềm vui. Kết đoạn: bài học: trân trọng hiện tại, nỗ lực hết mình. BÀI MẪU: Câu nói Hạnh phúc nằm ngay trên chính con đường ta đã chọn của Phan Văn Trường chứa đựng một triết lí sống sâu sắc. Nhiều người lầm tưởng hạnh phúc chỉ ở đích đến: đỗ đại học, có việc tốt, giàu sang... nên suốt hành trình họ chỉ thấy mệt mỏi, chán nản. Nhưng thực ra, hạnh phúc nằm ngay trong từng bước đi: niềm vui khi học thêm được điều mới, tình bạn trong những ngày cùng cố gắng, sự trưởng thành sau mỗi khó khăn. Ngược lại, tâm lí đứng núi này trông núi nọ — luôn tiếc nuối con đường không chọn, đổ lỗi cho số phận — chỉ mang lại bất hạnh. Thực tế cho thấy: người nông dân hết lòng với ruộng đồng, người thợ hết lòng với nghề, học sinh hết lòng với việc học — ai cũng tìm thấy niềm vui và ý nghĩa trong công việc mình đã chọn. Dĩ nhiên, điều này không có nghĩa là mù quáng bám lấy lựa chọn sai lầm; nhưng trước khi đổi hướng, hãy tự hỏi mình đã thực sự hết lòng chưa. Bài học cho tuổi trẻ: đừng mải miết tìm kiếm hạnh phúc ở đâu xa — hãy trân trọng hiện tại, nỗ lực hết mình trên con đường đã chọn, hạnh phúc sẽ đến như hoa thơm trái ngọt của sự cố gắng."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề: Sống có lí tưởng của tuổi trẻ hôm nay (gợi ý từ Mãi mãi tuổi hai mươi).", "points": 0, "explain": "DÀN Ý: Mở bài: lí tưởng là ngọn đèn soi đường; vấn đề: lí tưởng của tuổi trẻ hôm nay. Thân bài: Giải thích: lí tưởng là mục đích cao đẹp của cuộc đời. Tấm gương: thế hệ cha anh (Nguyễn Văn Thạc: hi sinh vì Tổ quốc). Thực trạng hôm nay: nhiều bạn sống có lí tưởng (học giỏi, tình nguyện, khởi nghiệp vì cộng đồng); một bộ phận sống thực dụng, ích kỉ, không lí tưởng. Nguyên nhân: ảnh hưởng lối sống hưởng thụ, thiếu giáo dục. Hậu quả: cuộc sống trống rỗng, dễ sa ngã. Bàn luận: lí tưởng thời bình (xây dựng đất nước, cống hiến); cần cụ thể hóa bằng hành động. Dẫn chứng. Giải pháp: giáo dục, tự rèn luyện. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Lí tưởng là ngọn đèn soi sáng đường đời mỗi con người, nhất là tuổi trẻ. Sống có lí tưởng là sống có mục đích cao đẹp, biết vươn tới những giá trị lớn lao vượt lên trên lợi ích cá nhân tầm thường. Nhìn lại thế hệ cha anh qua trang nhật kí Mãi mãi tuổi hai mươi của liệt sĩ Nguyễn Văn Thạc, ta thấy một lí tưởng sáng ngời: tuổi hai mươi đẹp nhất đã hiến dâng cho độc lập, tự do của Tổ quốc. Các anh không sợ hi sinh mà chỉ sợ sống hoài, sống phí — đó là lí tưởng cao đẹp mà thế hệ hôm nay phải ghi nhớ. Trong thời bình, lí tưởng của tuổi trẻ mang hình hài mới nhưng không kém phần cao đẹp: đó là khát vọng học tập để xây dựng đất nước giàu mạnh; là tinh thần tình nguyện đến vùng sâu vùng xa; là ý chí khởi nghiệp, sáng tạo vì cộng đồng; là quyết tâm bảo vệ môi trường, giữ gìn bản sắc văn hóa. Thực tế có biết bao bạn trẻ sống đẹp: thủ khoa vượt khó, tình nguyện viên vùng cao, nhà khoa học trẻ mang vinh quang về cho đất nước. Thế nhưng, vẫn còn một bộ phận sống thực dụng, ích kỉ: chỉ biết hưởng thụ, thờ ơ với đất nước, thậm chí sa vào tệ nạn. Nguyên nhân là ảnh hưởng của lối sống hưởng thụ và sự thiếu vắng giáo dục lí tưởng một cách thiết thực. Cuộc sống không lí tưởng như con thuyền không bến — trống rỗng, dễ chao đảo trước sóng gió. Để nuôi dưỡng lí tưởng, mỗi bạn trẻ hãy bắt đầu từ việc xác định mục đích sống rõ ràng, gắn lợi ích cá nhân với lợi ích cộng đồng; biến lí tưởng thành hành động cụ thể mỗi ngày. Gia đình, nhà trường cần giáo dục lí tưởng bằng những tấm gương sống động, gần gũi. Tuổi trẻ chỉ đến một lần — hãy sống sao cho tuổi trẻ của mình có ý nghĩa, để mai này nhìn lại, ta có thể tự hào như thế hệ cha anh đã từng tự hào."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Chủ đề của Bài 9 là gì?", "options": ["A. Hành trang cuộc sống", "B. Thế giới đa dạng của thông tin", "C. Quyền năng của người kể chuyện", "D. Sức hấp dẫn của truyện kể"], "answer": "A", "points": 0.25, "explain": "Bài 9 có chủ đề Hành trang cuộc sống: chuẩn bị hiểu biết về bản thân, bản lĩnh lựa chọn và khát vọng vươn lên để bước vào đời."}, {"type": "mcq", "level": "NB", "q": "Phần Thực hành đọc của Bài 9 là văn bản nào?", "options": ["A. Tính cách của cây", "B. Mãi mãi tuổi hai mươi", "C. Con khướu sổ lồng", "D. Bạch Đằng hải khẩu"], "answer": "B", "points": 0.25, "explain": "Phần Thực hành đọc của Bài 9 là Mãi mãi tuổi hai mươi — trích nhật kí của liệt sĩ Nguyễn Văn Thạc."}, {"type": "mcq", "level": "TH", "q": "Điểm chung về thể loại của Về chính chúng ta và Một đời như kẻ tìm đường là gì?", "options": ["A. Đều là thơ", "B. Đều thuộc loại tản văn, tùy bút: ghi cảm xúc, suy ngẫm, cái tôi tác giả rõ nét", "C. Đều là truyện ngắn", "D. Đều là kịch"], "answer": "B", "points": 0.25, "explain": "Cả hai văn bản đều thuộc loại tản văn, tùy bút: văn xuôi tự do ghi lại cảm xúc, suy ngẫm sâu sắc của tác giả; cái tôi hiện rõ, chân thành."}, {"type": "mcq", "level": "TH", "q": "Trong sơ đồ, đường nét nối các hình có tác dụng gì?", "options": ["A. Trang trí", "B. Thể hiện mối quan hệ giữa các thông tin", "C. Làm sơ đồ dài hơn", "D. Không có tác dụng"], "answer": "B", "points": 0.25, "explain": "Đường nét nối các hình trong sơ đồ thể hiện mối quan hệ giữa các thông tin (quan hệ bao hàm, trình tự, nhân quả...) — giúp người đọc nắm cấu trúc thông tin."}, {"type": "mcq", "level": "VDC", "q": "Vì sao nói Mãi mãi tuổi hai mươi là hành trang tinh thần quý báu cho tuổi trẻ hôm nay?", "options": ["A. Vì nhật kí rất dài", "B. Vì nó truyền cảm hứng về lí tưởng sống cao đẹp, lòng yêu nước và ý thức trân trọng hòa bình", "C. Vì tác giả nổi tiếng", "D. Vì nhật kí viết về chiến thắng"], "answer": "B", "points": 0.25, "explain": "Nhật kí truyền cảm hứng về lí tưởng sống cao đẹp, sẵn sàng hi sinh vì Tổ quốc của thế hệ cha anh; nhắc thế hệ hôm nay trân trọng hòa bình và sống xứng đáng."}, {"type": "short", "level": "NB", "q": "Carlo Rovelli là nhà khoa học nước nào?", "answer": "Ý", "points": 0.5, "explain": "Các-lô Rô-ve-li (Carlo Rovelli) là nhà vật lí lí thuyết người Ý, tác giả cuốn 7 bài học hay nhất về vật lí."}, {"type": "short", "level": "TH", "q": "Nêu hai nội dung cần có trong phần thân bài của bài luận về bản thân.", "answer": "Điểm mạnh, điểm yếu (và nguyên nhân); ước mơ, mục tiêu và kế hoạch rèn luyện", "points": 0.5, "explain": "Thân bài luận về bản thân gồm: phân tích điểm mạnh, điểm yếu và nguyên nhân; trình bày ước mơ, mục tiêu và kế hoạch rèn luyện cụ thể."}, {"type": "short", "level": "VD", "q": "Phân biệt tản văn với truyện ngắn.", "answer": "Tản văn: tự do, ghi cảm xúc suy ngẫm, cái tôi rõ, ít cốt truyện; truyện ngắn: có cốt truyện, nhân vật, tình huống", "points": 0.5, "explain": "Tản văn tự do, linh hoạt, ghi cảm xúc suy ngẫm của tác giả, ít cốt truyện; truyện ngắn có cốt truyện, nhân vật, tình huống rõ ràng."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về việc hiểu chính mình (gợi ý từ văn bản Về chính chúng ta).", "points": 0, "explain": "DÀN Ý: Mở đoạn: hiểu mình là hành trang đầu tiên. Thân đoạn: hiểu điểm mạnh, điểm yếu, sở thích, ước mơ; nhiều bạn trẻ chưa hiểu mình nên chọn sai hướng; cách hiểu mình (trải nghiệm, lắng nghe góp ý, tự vấn); hiểu mình để lựa chọn đúng. Kết đoạn: hành trình khám phá bản thân. BÀI MẪU: Hiểu chính mình là hành trang đầu tiên và quan trọng nhất để bước vào đời, như cách Carlo Rovelli giúp ta hiểu mình là một phần của vũ trụ. Hiểu mình nghĩa là biết rõ điểm mạnh, điểm yếu, sở thích, ước mơ và giá trị mình theo đuổi. Thực tế, nhiều bạn trẻ chưa hiểu mình: chọn ngành học theo phong trào, theo ý cha mẹ mà không biết mình thực sự muốn gì, giỏi gì — để rồi chán nản, bỏ dở giữa chừng. Hiểu mình không phải điều dễ dàng: nó đòi hỏi ta dám trải nghiệm nhiều lĩnh vực, dám lắng nghe góp ý chân thành của người khác và dám tự vấn mình một cách trung thực. Viết nhật kí, thử sức ở các hoạt động ngoại khóa, trò chuyện với thầy cô, cha mẹ — đó là những cách khám phá bản thân hiệu quả. Khi hiểu mình, ta sẽ lựa chọn đúng hướng đi, phát huy được sở trường và biết khắc phục sở đoản. Hành trình hiểu mình là hành trình suốt đời, nhưng càng bắt đầu sớm, ta càng có nhiều thời gian để sống đúng với mình và sống có ý nghĩa."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề: Lòng biết ơn thế hệ cha anh (gợi ý từ Mãi mãi tuổi hai mươi).", "points": 0, "explain": "DÀN Ý: Mở bài: hòa bình hôm nay được đánh đổi bằng xương máu; vấn đề: lòng biết ơn của thế hệ trẻ. Thân bài: Giải thích: biết ơn là ghi nhớ, trân trọng sự hi sinh và đền đáp bằng hành động. Biểu hiện: thăm viếng nghĩa trang liệt sĩ, chăm sóc gia đình chính sách, học tập tốt. Thực trạng: nhiều bạn sống có trách nhiệm, tri ân; một bộ phận vô cảm, quên quá khứ, thậm chí xuyên tạc lịch sử. Nguyên nhân: thiếu giáo dục, ảnh hưởng xấu. Hậu quả: mất gốc, dễ bị lôi kéo. Bàn luận: biết ơn phải bằng hành động cụ thể, không phải khẩu hiệu. Dẫn chứng: phong trào đền ơn đáp nghĩa, thắp nến tri ân. Giải pháp: giáo dục truyền thống sinh động; mỗi người tự rèn. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Hòa bình, độc lập mà chúng ta đang hưởng hôm nay được đánh đổi bằng xương máu của bao thế hệ cha anh. Những trang nhật kí Mãi mãi tuổi hai mươi của liệt sĩ Nguyễn Văn Thạc cho ta thấy: để có ngày hôm nay, đã có những chàng trai hai mươi mãi mãi nằm lại nơi chiến trường. Vì vậy, lòng biết ơn thế hệ cha anh là đạo lí thiêng liêng mà mỗi người trẻ phải khắc cốt ghi tâm. Biết ơn không chỉ là xúc động khi đọc những trang viết ấy mà phải thể hiện bằng hành động cụ thể: chăm học để xây dựng đất nước — đó là cách đền đáp thiết thực nhất; tham gia các phong trào đền ơn đáp nghĩa, chăm sóc mẹ Việt Nam anh hùng, thắp nến tri ân các anh hùng liệt sĩ; bảo vệ sự thật lịch sử trước những luận điệu xuyên tạc. Thực tế đáng mừng là nhiều bạn trẻ sống rất có trách nhiệm: tình nguyện về vùng căn cứ cách mạng, sưu tầm hiện vật chiến tranh, viết về đề tài lịch sử. Thế nhưng, vẫn còn một bộ phận thờ ơ, coi hòa bình là điều đương nhiên; cá biệt có bạn phát ngôn thiếu tôn trọng lịch sử, bị kẻ xấu lôi kéo. Nguyên nhân là giáo dục truyền thống có lúc còn khô khan, hình thức và sự thiếu hiểu biết của một số bạn. Hậu quả là thế hệ trẻ dễ mất gốc, mất phương hướng. Để nuôi dưỡng lòng biết ơn, gia đình hãy kể cho con nghe câu chuyện về ông bà, cha anh; nhà trường tổ chức những buổi học lịch sử sinh động tại di tích, bảo tàng; mỗi bạn trẻ hãy tự đọc, tự tìm hiểu để hiểu đúng, nhớ sâu. Uống nước nhớ nguồn là đạo lí ngàn đời của dân tộc. Hãy sống xứng đáng với sự hi sinh của cha anh — đó là lời tri ân ý nghĩa nhất."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Dòng nào liệt kê đúng các văn bản đọc chính của Bài 9 theo SGK?", "options": ["A. Về chính chúng ta – Con đường không chọn – Một đời như kẻ tìm đường", "B. Sự sống và cái chết – Tính cách của cây – Phục hồi tầng ozone", "C. Bình Ngô đại cáo – Dục Thúy sơn – Ngôn chí", "D. Dưới bóng hoàng lan – Một chuyện đùa nho nhỏ – Con khướu sổ lồng"], "answer": "A", "points": 0.25, "explain": "Theo SGK, ba văn bản đọc chính của Bài 9 là: Về chính chúng ta, Con đường không chọn, Một đời như kẻ tìm đường."}, {"type": "mcq", "level": "NB", "q": "Phần Thực hành tiếng Việt của Bài 9 (trang 111) tiếp tục nội dung nào?", "options": ["A. Sử dụng từ Hán Việt", "B. Sử dụng phương tiện phi ngôn ngữ (tiếp theo)", "C. Biện pháp chêm xen, liệt kê", "D. Điệp ngữ, đối lập"], "answer": "B", "points": 0.25, "explain": "Phần Thực hành tiếng Việt trang 111 tiếp tục nội dung sử dụng phương tiện phi ngôn ngữ: thiết kế sơ đồ, biểu đồ từ thông tin (sơ đồ Tôi của tương lai)."}, {"type": "mcq", "level": "TH", "q": "Màu sắc trong sơ đồ Tôi của tương lai có tác dụng gì?", "options": ["A. Trang trí cho đẹp", "B. Mỗi màu đại diện cho một phương diện (tài chính, sở thích, cống hiến, công việc, gia đình), giúp phân biệt trực quan", "C. Làm sơ đồ khó hiểu", "D. Không có tác dụng"], "answer": "B", "points": 0.25, "explain": "Mỗi màu sắc trong sơ đồ đại diện cho một phương diện của tương lai, giúp người đọc phân biệt nhanh, nắm bắt trực quan các mục tiêu."}, {"type": "mcq", "level": "TH", "q": "Vì sao tác giả so sánh con người với con vật khi bàn về sự lựa chọn?", "options": ["A. Để chê con vật", "B. Để làm nổi bật phẩm giá con người: được quyền lựa chọn và chịu trách nhiệm về lựa chọn", "C. Để kể chuyện vui", "D. Không có mục đích"], "answer": "B", "points": 0.25, "explain": "So sánh con người – con vật làm nổi bật đặc quyền và cũng là trách nhiệm của con người: được lựa chọn hướng đi cho đời mình, không phó mặc cho bản năng hay số phận."}, {"type": "mcq", "level": "VDC", "q": "Điểm chung về triết lí sống của R. Frost và Phan Văn Trường là gì?", "options": ["A. Cùng khuyên con người trốn tránh lựa chọn", "B. Cùng khẳng định: lựa chọn định hình đời người; điều quan trọng là dám chọn và sống có trách nhiệm với lựa chọn", "C. Cùng cho rằng số phận đã an bài", "D. Không có điểm chung"], "answer": "B", "points": 0.25, "explain": "Frost nhấn mạnh tính không thể đảo ngược và sức nặng của lựa chọn; Phan Văn Trường nhấn mạnh dám lựa chọn và hết lòng với lựa chọn — cùng đề cao trách nhiệm với quyết định của mình."}, {"type": "short", "level": "NB", "q": "Bài thơ Con đường không chọn được viết theo thể thơ nào?", "answer": "Thơ tự do (thơ hiện đại)", "points": 0.5, "explain": "Con đường không chọn là thơ tự do (hiện đại): không gò bó niêm luật, nhịp điệu linh hoạt theo cảm xúc suy tư."}, {"type": "short", "level": "TH", "q": "Nêu hai phẩm chất của thế hệ cha anh thể hiện qua nhật kí Mãi mãi tuổi hai mươi.", "answer": "Lí tưởng cao đẹp, sẵn sàng hi sinh vì Tổ quốc; yêu cuộc sống, khát vọng sống có ích", "points": 0.5, "explain": "Nhật kí thể hiện lí tưởng cao đẹp (xếp bút nghiên ra trận), tinh thần hi sinh vì Tổ quốc cùng tình yêu cuộc sống và khát vọng sống có ích mãnh liệt."}, {"type": "short", "level": "VD", "q": "Khi viết về điểm yếu của bản thân trong bài luận, cần tránh thái độ nào?", "answer": "Tránh tô vẽ, che giấu hoặc tự ti, bi quan quá mức", "points": 0.5, "explain": "Viết về điểm yếu cần trung thực: không tô vẽ che giấu (ảo tưởng), cũng không tự ti bi quan (nản lòng); quan trọng là chỉ ra nguyên nhân và hướng khắc phục."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày suy nghĩ của em về vai trò của ước mơ đối với tuổi trẻ.", "points": 0, "explain": "DÀN Ý: Mở đoạn: ước mơ là ngọn đèn soi đường. Thân đoạn: ước mơ cho ta mục đích, động lực vượt khó; người không ước mơ dễ buông thả, lạc hướng; ước mơ cần vừa sức và đi đôi với hành động; dẫn chứng. Kết đoạn: nuôi dưỡng ước mơ. BÀI MẪU: Ước mơ là ngọn đèn soi sáng đường đời của tuổi trẻ, là nguồn động lực giúp ta vượt qua mọi khó khăn. Người có ước mơ rõ ràng sẽ biết mình muốn gì, cần làm gì; mỗi buổi sáng thức dậy đều có mục đích để cố gắng. Nhờ ước mơ, bao bạn học sinh nghèo đã vượt khó vươn lên, bao bạn trẻ đã biến ý tưởng khởi nghiệp thành hiện thực. Ngược lại, sống không ước mơ như con thuyền không bến: dễ buông thả, lạc hướng, phí hoài tuổi trẻ vào những thú vui vô bổ. Tuy nhiên, ước mơ phải vừa sức và phải đi đôi với hành động: ước mơ viển vông mà không cố gắng chỉ là ảo tưởng; ước mơ cần được chia nhỏ thành mục tiêu cụ thể từng ngày. Tuổi trẻ là quãng thời gian đẹp nhất để ước mơ và cũng là lúc ta có nhiều năng lượng nhất để thực hiện ước mơ. Hãy nuôi dưỡng một ước mơ đẹp, gắn với lợi ích của bản thân và cộng đồng, rồi kiên trì hành động — bởi ước mơ chỉ thành hiện thực khi ta dám bước đi."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề: Tinh thần tự học của học sinh hiện nay.", "points": 0, "explain": "DÀN Ý: Mở bài: vai trò của tự học trong thời đại tri thức. Thân bài: Giải thích: tự học là chủ động tìm tòi tri thức ngoài giờ lên lớp. Thực trạng: nhiều bạn tự học tốt (đọc sách, học online); một bộ phận ỷ lại, học đối phó, chỉ học khi bị ép. Nguyên nhân: thiếu phương pháp, thiếu động lực; ỷ lại vào học thêm; mải chơi. Hậu quả: kiến thức hổng, thụ động, kém thích ứng. Bàn luận: tự học là chìa khóa thành công (dẫn chứng: các tấm gương tự học thành tài); cần phương pháp đúng. Giải pháp: xác định mục tiêu; lập kế hoạch; tận dụng internet, thư viện; kiên trì. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Trong thời đại tri thức bùng nổ, tinh thần tự học trở thành chìa khóa quyết định thành công của mỗi học sinh. Tự học là khả năng chủ động tìm tòi, nghiên cứu tri thức ngoài giờ lên lớp, không chờ đợi, ỷ lại vào thầy cô. Đáng mừng là nhiều bạn đã ý thức tốt: chủ động đọc sách tham khảo, học online các khóa chất lượng, tự làm thêm bài tập, trao đổi với bạn bè để mở rộng hiểu biết. Nhờ tự học, các bạn nắm kiến thức sâu, nhớ lâu và rèn được tư duy độc lập. Thế nhưng, vẫn còn không ít bạn ỷ lại: chỉ học những gì thầy cô dạy trên lớp, học đối phó để qua kì thi; về nhà là dán mắt vào điện thoại; đi học thêm tràn lan mà thiếu tự học nên kiến thức vẫn hổng. Nguyên nhân một phần do chưa có phương pháp tự học đúng, một phần do thiếu động lực, chưa thấy được lợi ích lâu dài; lại thêm tâm lí ỷ lại vào học thêm, vào đáp án có sẵn. Hậu quả là kiến thức nông, tư duy thụ động, ra đời khó thích ứng với môi trường luôn đổi mới. Thực tế chứng minh: những người thành công đều là những người tự học xuất sắc — từ các nhà khoa học tự mày mò nghiên cứu đến các thủ khoa tự lên kế hoạch ôn luyện. Để rèn tinh thần tự học, mỗi bạn hãy: xác định mục tiêu rõ ràng; lập kế hoạch học tập cụ thể từng tuần; tận dụng internet, thư viện một cách thông minh (học chứ không phải lướt); kiên trì ngay cả khi khó khăn. Nhà trường và gia đình cần tạo điều kiện, động viên thay vì nhồi nhét. Thầy cô chỉ đưa ta đến cửa tri thức — bước vào hay không là ở chính ta. Hãy thắp sáng ngọn đèn tự học từ hôm nay, bởi đó là hành trang vững chắc nhất cho tương lai."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Phần Nói và nghe của Bài 9 yêu cầu thuyết trình về vấn đề gì?", "options": ["A. Vấn đề xã hội có sử dụng kết hợp phương tiện ngôn ngữ và phi ngôn ngữ", "B. Vấn đề văn học", "C. Văn bản nội quy", "D. Kế hoạch du lịch"], "answer": "A", "points": 0.25, "explain": "Phần Nói và nghe của Bài 9 là thuyết trình về một vấn đề xã hội có sử dụng kết hợp phương tiện ngôn ngữ và các phương tiện phi ngôn ngữ."}, {"type": "mcq", "level": "NB", "q": "Đâu là đặc điểm của thơ triết lí?", "options": ["A. Chỉ tả cảnh đẹp", "B. Gửi gắm triết lí nhân sinh qua hình tượng, biểu tượng", "C. Luôn viết theo thể lục bát", "D. Không có hình tượng"], "answer": "B", "points": 0.25, "explain": "Thơ triết lí gửi gắm những suy ngẫm về đời người qua hình tượng, biểu tượng (như con đường trong thơ Frost) — đọc cần giải mã biểu tượng."}, {"type": "mcq", "level": "TH", "q": "Vì sao trong bài luận về bản thân cần có dẫn chứng cụ thể?", "options": ["A. Để bài văn dài hơn", "B. Để những nhận định về bản thân có căn cứ, thuyết phục, tránh chung chung", "C. Để khoe thành tích", "D. Không cần thiết"], "answer": "B", "points": 0.25, "explain": "Dẫn chứng (kỉ niệm, thành tích, việc làm cụ thể) giúp nhận định về bản thân có căn cứ, chân thực, thuyết phục — tránh nói chung chung, sáo rỗng."}, {"type": "mcq", "level": "TH", "q": "Câu văn nào thể hiện cái tôi rõ nét của tản văn, tùy bút?", "options": ["A. Tôi day dứt mãi về con đường mình đã không chọn.", "B. Con đường dài 10 km.", "C. Hôm nay trời nắng.", "D. Lớp có 40 học sinh."], "answer": "A", "points": 0.25, "explain": "Câu A bộc lộ trực tiếp cảm xúc, suy ngẫm của cái tôi tác giả — đặc trưng của tản văn, tùy bút; các câu còn lại chỉ nêu sự kiện khách quan."}, {"type": "mcq", "level": "VDC", "q": "Bài học phương pháp quan trọng nhất khi đọc thơ triết lí như Con đường không chọn là gì?", "options": ["A. Học thuộc lòng", "B. Giải mã hình tượng, biểu tượng để nắm triết lí nhân sinh ẩn sau hình ảnh cụ thể", "C. Chỉ chú ý vần điệu", "D. Bỏ qua hình ảnh"], "answer": "B", "points": 0.25, "explain": "Thơ triết lí nói điều trừu tượng qua hình ảnh cụ thể; chìa khóa đọc hiểu là giải mã biểu tượng (con đường = lựa chọn...) để nắm thông điệp."}, {"type": "short", "level": "NB", "q": "Cuốn sách của Phan Văn Trường mà văn bản Một đời như kẻ tìm đường được trích có tên là gì?", "answer": "Một đời như kẻ tìm đường", "points": 0.5, "explain": "Văn bản được trích từ cuốn sách cùng tên Một đời như kẻ tìm đường — đúc kết trải nghiệm của tác giả gửi thế hệ trẻ."}, {"type": "short", "level": "TH", "q": "Nêu hai khó khăn thường gặp khi con người phải lựa chọn (theo R. Frost).", "answer": "Không thể đi cả hai con đường; không biết trước tương lai của lựa chọn", "points": 0.5, "explain": "Nỗi day dứt của sự lựa chọn: ước gì được đi cả hai đường và ước gì biết trước tương lai — nhưng đời không cho ta cả hai đặc ân ấy."}, {"type": "short", "level": "VD", "q": "Khi thuyết trình có sử dụng phương tiện phi ngôn ngữ, cần lưu ý gì?", "answer": "Hình ảnh, sơ đồ phải rõ ràng, liên quan chặt chẽ với nội dung nói; không lạm dụng", "points": 0.5, "explain": "Phương tiện phi ngôn ngữ phải rõ ràng, minh họa đúng nội dung đang trình bày; lạm dụng hình ảnh sẽ làm phân tán, lấn át lời nói."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về ý nghĩa của việc trân trọng thời gian tuổi trẻ.", "points": 0, "explain": "DÀN Ý: Mở đoạn: tuổi trẻ ngắn ngủi, quý giá. Thân đoạn: tuổi trẻ là lúc học tập, rèn luyện tốt nhất; phí hoài tuổi trẻ sẽ hối tiếc (như nỗi day dứt về lựa chọn); dẫn chứng: cha anh hiến dâng tuổi hai mươi; liên hệ: dùng thời gian hiệu quả. Kết đoạn: sống xứng đáng. BÀI MẪU: Tuổi trẻ là quãng thời gian đẹp nhất mà cũng ngắn ngủi nhất của đời người — vì vậy, biết trân trọng thời gian tuổi trẻ là điều vô cùng quan trọng. Đây là lúc ta có sức khỏe, trí nhớ và khát vọng tốt nhất để học tập, rèn luyện, xây dựng nền móng cho tương lai. Thời gian đã qua không bao giờ trở lại, như con đường đã chọn không thể quay đầu — ai phí hoài tuổi trẻ vào những thú vui vô bổ, lười biếng, chắc chắn sau này sẽ day dứt, hối tiếc. Nhìn thế hệ cha anh: tuổi hai mươi của họ là những năm tháng chiến đấu, hi sinh vì Tổ quốc — họ đã sống trọn vẹn từng phút giây. Thế hệ hôm nay may mắn hơn nhiều, nhưng không ít bạn lại để thời gian trôi qua trong game, mạng xã hội vô bổ. Trân trọng tuổi trẻ không có nghĩa là không được vui chơi mà là biết cân bằng: học tập nghiêm túc, rèn luyện kĩ năng, vun đắp ước mơ, đồng thời tận hưởng những niềm vui lành mạnh. Hãy dùng thời gian tuổi trẻ một cách xứng đáng — để mai này nhìn lại, ta có thể mỉm cười vì mình đã sống trọn vẹn, không hối tiếc."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề: Lòng dũng cảm đối mặt với thất bại.", "points": 0, "explain": "DÀN Ý: Mở bài: thất bại là điều không ai tránh khỏi; vấn đề: cần dũng cảm đối mặt. Thân bài: Giải thích: dũng cảm đối mặt thất bại là dám nhìn thẳng, rút bài học, đứng dậy. Bàn luận: thất bại là mẹ thành công (dẫn chứng: Edison, các tấm gương); sợ thất bại dẫn đến không dám thử, bỏ lỡ cơ hội. Thực trạng: một số bạn nản chí, bỏ cuộc khi thất bại; một số đổ lỗi, gian lận để tránh thất bại. Nguyên nhân: sợ chê cười, thiếu bản lĩnh, được bao bọc quá. Giải pháp: nhìn thất bại như bài học; chia nhỏ mục tiêu; tìm sự giúp đỡ; kiên trì. Kết bài: khẳng định, động viên. BÀI MẪU: Trong đời, không ai tránh khỏi thất bại — điều quan trọng là ta đối mặt với nó như thế nào. Dũng cảm đối mặt với thất bại nghĩa là dám nhìn thẳng vào thất bại, rút ra bài học và đứng dậy đi tiếp thay vì nản chí, bỏ cuộc hay đổ lỗi. Người ta thường nói: thất bại là mẹ thành công. Edison đã thất bại hàng nghìn lần trước khi phát minh ra bóng đèn; nhiều doanh nhân thành công từng phá sản nhiều lần; bao thủ khoa từng trượt đại học năm đầu. Điểm chung của họ là không để thất bại đánh gục mà biến nó thành bài học. Thực tế quanh ta: có bạn thi trượt thì nản, bỏ học; có bạn vì sợ thất bại mà không dám thử sức ở kì thi, cuộc thi nào; cá biệt có bạn gian lận để tránh điểm kém — đó là sự hèn nhát trước thất bại. Nguyên nhân là nỗi sợ bị chê cười, thiếu bản lĩnh và thói quen được bao bọc, không quen với vấp ngã. Hậu quả là các bạn bỏ lỡ cơ hội trưởng thành, mãi dậm chân tại chỗ. Để dũng cảm đối mặt thất bại, trước hết hãy thay đổi cách nhìn: thất bại không phải dấu chấm hết mà là dấu phẩy — nó cho ta biết cách làm nào chưa đúng. Hãy chia mục tiêu lớn thành bước nhỏ để dễ thành công từng bước; đừng ngại nhờ thầy cô, bạn bè giúp đỡ; và quan trọng nhất là kiên trì — ngã ở đâu, đứng dậy ở đó. Cha ông ta đã dạy: có công mài sắt, có ngày nên kim. Tuổi trẻ càng cần bản lĩnh này: dám thử, dám sai, dám sửa. Hãy nhớ rằng người thành công không phải người chưa từng thất bại mà là người chưa từng bỏ cuộc."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Tác giả của cuốn nhật kí Mãi mãi tuổi hai mươi là ai?", "options": ["A. Nguyễn Văn Thạc", "B. Phan Văn Trường", "C. Carlo Rovelli", "D. Robert Frost"], "answer": "A", "points": 0.25, "explain": "Mãi mãi tuổi hai mươi là nhật kí của liệt sĩ Nguyễn Văn Thạc (1952–1972), chàng sinh viên xếp bút nghiên lên đường ra trận."}, {"type": "mcq", "level": "NB", "q": "Văn bản Một đời như kẻ tìm đường thuộc thể loại nào?", "options": ["A. Thơ", "B. Tùy bút, tản văn", "C. Truyện ngắn", "D. Kịch"], "answer": "B", "points": 0.25, "explain": "Một đời như kẻ tìm đường thuộc loại tùy bút, tản văn: ghi lại chiêm nghiệm, suy ngẫm của tác giả về việc lựa chọn hướng đi trong đời."}, {"type": "mcq", "level": "TH", "q": "Vì sao nói hiểu vũ trụ cũng là hiểu chính chúng ta (theo C. Rovelli)?", "options": ["A. Vì con người tạo ra vũ trụ", "B. Vì con người là một phần của vũ trụ, được tạo nên từ vật chất và thông tin của vũ trụ", "C. Vì vũ trụ rất nhỏ", "D. Vì con người không quan trọng"], "answer": "B", "points": 0.25, "explain": "Con người được tạo nên từ vật chất của các vì sao, mang trong mình thông tin của vũ trụ (DNA...) — hiểu vũ trụ là hiểu cội nguồn và bản chất của chính mình."}, {"type": "mcq", "level": "TH", "q": "Trong bài luận về bản thân, thái độ nào là đúng khi nói về điểm mạnh?", "options": ["A. Khoác lác, phóng đại", "B. Chân thành, khiêm tốn, có dẫn chứng cụ thể", "C. Giấu kín, không nói", "D. Chê bai bản thân"], "answer": "B", "points": 0.25, "explain": "Nói về điểm mạnh cần chân thành, khiêm tốn và có dẫn chứng cụ thể — vừa tự tin vừa đáng tin, tránh khoác lác hay tự ti."}, {"type": "mcq", "level": "VDC", "q": "So sánh quan niệm về hạnh phúc của Phan Văn Trường với quan niệm thông thường: điểm mới mẻ là gì?", "options": ["A. Cho rằng hạnh phúc ở đích đến giàu sang", "B. Cho rằng hạnh phúc nằm trên hành trình, trong sự hết lòng với con đường đã chọn — chứ không chỉ ở đích đến", "C. Cho rằng không có hạnh phúc", "D. Cho rằng hạnh phúc do số phận ban"], "answer": "B", "points": 0.25, "explain": "Quan niệm thông thường đặt hạnh phúc ở đích đến; Phan Văn Trường mới mẻ khi khẳng định hạnh phúc nằm ngay trên hành trình — trong sự nỗ lực hết lòng mỗi ngày."}, {"type": "short", "level": "NB", "q": "R. Frost đoạt giải thưởng văn học nào nhiều lần?", "answer": "Giải Pulitzer", "points": 0.5, "explain": "Rô-bớt Phờ-rót (Robert Frost) nhiều lần đoạt giải Pulitzer — một trong những nhà thơ Mỹ được yêu mến nhất."}, {"type": "short", "level": "TH", "q": "Nêu hai nội dung của phần kết bài trong bài luận về bản thân.", "answer": "Khẳng định quyết tâm rèn luyện; gửi gắm niềm tin vào tương lai", "points": 0.5, "explain": "Kết bài khẳng định quyết tâm khắc phục hạn chế, phát huy điểm mạnh và gửi gắm niềm tin vào tương lai tốt đẹp."}, {"type": "short", "level": "VD", "q": "Giải thích vì sao tản văn, tùy bút phù hợp để viết về đề tài hành trang cuộc sống.", "answer": "Vì tự do, giàu cảm xúc suy ngẫm, cái tôi rõ nét — phù hợp bày tỏ quan niệm sống", "points": 0.5, "explain": "Tản văn, tùy bút tự do, giàu cảm xúc và suy ngẫm, cái tôi rõ nét — rất phù hợp để tác giả bày tỏ quan niệm, chiêm nghiệm về cuộc sống, về hành trang vào đời."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về câu nói: Đừng sợ lựa chọn sai, chỉ sợ không dám lựa chọn.", "points": 0, "explain": "DÀN Ý: Mở đoạn: nỗi sợ lựa chọn của nhiều bạn trẻ. Thân đoạn: không lựa chọn cũng là một lựa chọn (tồi tệ nhất) — bỏ lỡ cơ hội; lựa chọn sai vẫn cho bài học, vẫn có thể sửa; dẫn chứng: người thành công đều từng chọn sai; liên hệ: chọn ngành, chọn bạn. Kết đoạn: dám chọn, dám chịu trách nhiệm. BÀI MẪU: Nhiều bạn trẻ hôm nay mắc căn bệnh sợ lựa chọn: sợ chọn sai ngành, sợ chọn sai bạn, sợ thất bại... nên cứ chần chừ, để người khác quyết định thay mình. Nhưng cần hiểu rằng: không lựa chọn cũng chính là một lựa chọn — và là lựa chọn tồi tệ nhất, bởi nó đồng nghĩa với việc tự tước đi cơ hội của mình. Lựa chọn sai không đáng sợ như ta tưởng: sai thì sửa, vấp thì đứng dậy; mỗi lựa chọn sai đều cho ta một bài học quý mà sách vở không dạy được. Bao người thành công từng chọn sai đường: có doanh nhân từng học sai ngành, có nhà khoa học từng thi trượt — nhưng họ dám chọn, dám sai và dám làm lại. Ngược lại, những người cả đời không dám quyết định điều gì thường sống nhạt nhòa, đến cuối đời tiếc nuối vì những cơ hội đã bỏ lỡ. Dĩ nhiên, dám lựa chọn không có nghĩa là liều lĩnh: hãy tìm hiểu kĩ, cân nhắc cẩn thận rồi quyết định dứt khoát và chịu trách nhiệm đến cùng. Tuổi trẻ là lúc ta được phép sai để trưởng thành — đừng sợ lựa chọn sai, chỉ sợ không dám lựa chọn."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề: Ý thức tự lập của học sinh hiện nay.", "points": 0, "explain": "DÀN Ý: Mở bài: tự lập là hành trang quan trọng vào đời. Thân bài: Giải thích: tự lập là tự lo cho bản thân, tự quyết định, chịu trách nhiệm. Thực trạng: nhiều bạn tự lập tốt; một bộ phận ỷ lại cha mẹ (việc nhỏ cũng nhờ, không biết làm việc nhà). Nguyên nhân: được nuông chiều, bao bọc quá; nhà trường ít rèn kĩ năng sống. Hậu quả: lúng túng khi xa nhà, khó thích ứng, trở thành gánh nặng. Bàn luận: tự lập không phải xa lánh mà là trưởng thành; cần rèn từ việc nhỏ. Dẫn chứng. Giải pháp: gia đình giao việc; nhà trường rèn kĩ năng; bản thân chủ động. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Tự lập là một trong những hành trang quan trọng nhất để mỗi học sinh vững vàng bước vào đời. Tự lập nghĩa là tự lo liệu cho bản thân trong sinh hoạt, tự quyết định và chịu trách nhiệm về quyết định của mình, không ỷ lại, dựa dẫm vào người khác. Thực tế đáng mừng là nhiều bạn đã rất tự lập: tự đi học, tự nấu ăn, quản lí chi tiêu hợp lí, thậm chí làm thêm để đỡ đần cha mẹ. Thế nhưng, vẫn còn không ít bạn ỷ lại quá mức: việc nhỏ như giặt quần áo, nấu cơm cũng chờ mẹ; tiền tiêu vặt không biết quản lí; gặp khó khăn là gọi cha mẹ giải quyết thay vì tự tìm cách. Nguyên nhân một phần do được nuông chiều, bao bọc quá mức — cha mẹ làm hết mọi việc vì thương con; một phần do nhà trường, gia đình ít chú trọng rèn kĩ năng sống. Hậu quả là các bạn lúng túng khi phải xa nhà, khó thích ứng với môi trường mới, lâu dài trở thành gánh nặng cho gia đình và xã hội. Cần hiểu rằng tự lập không có nghĩa là xa lánh, không cần ai giúp đỡ; tự lập là trưởng thành — biết tự lo cho mình để không làm phiền người khác và còn có thể giúp đỡ người khác. Để rèn tính tự lập, mỗi bạn hãy bắt đầu từ việc nhỏ: tự dọn phòng, tự nấu những món đơn giản, tự lên kế hoạch học tập; cha mẹ hãy tin tưởng giao việc phù hợp thay vì làm thay; nhà trường tăng cường giáo dục kĩ năng sống qua hoạt động thực tế. Con chim muốn bay cao phải tự vỗ cánh — con người muốn thành công phải tự lập. Hãy rèn tính tự lập từ hôm nay, để ngày mai bước vào đời với đôi chân vững vàng của chính mình."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Chủ đề xuyên suốt Bài 9 được thể hiện qua cụm từ nào?", "options": ["A. Hành trang cuộc sống", "B. Đại dương thông tin", "C. Quyền năng kể chuyện", "D. Vẻ đẹp thơ ca"], "answer": "A", "points": 0.25, "explain": "Bài 9 có chủ đề Hành trang cuộc sống: những hiểu biết, phẩm chất cần chuẩn bị để bước vào đời."}, {"type": "mcq", "level": "NB", "q": "Văn bản nào sau đây KHÔNG thuộc Bài 9?", "options": ["A. Về chính chúng ta", "B. Con đường không chọn", "C. Sự sống và cái chết", "D. Một đời như kẻ tìm đường"], "answer": "C", "points": 0.25, "explain": "Sự sống và cái chết thuộc Bài 8. Bài 9 gồm: Về chính chúng ta, Con đường không chọn, Một đời như kẻ tìm đường, Mãi mãi tuổi hai mươi."}, {"type": "mcq", "level": "TH", "q": "Khi đọc hiểu thơ triết lí, điều quan trọng nhất là gì?", "options": ["A. Đếm số chữ trong mỗi câu", "B. Giải mã hình tượng, biểu tượng để nắm triết lí nhân sinh", "C. Học thuộc lòng", "D. Chỉ chú ý nhan đề"], "answer": "B", "points": 0.25, "explain": "Thơ triết lí gửi gắm suy ngẫm qua hình tượng; chìa khóa đọc hiểu là giải mã biểu tượng để nắm thông điệp nhân sinh ẩn sau hình ảnh."}, {"type": "mcq", "level": "TH", "q": "Sơ đồ Tôi của tương lai trong SGK gồm mấy phương diện?", "options": ["A. 3", "B. 4", "C. 5 (tài chính, sở thích, cống hiến, công việc, gia đình)", "D. 6"], "answer": "C", "points": 0.25, "explain": "Sơ đồ Tôi của tương lai trình bày kế hoạch trên 5 phương diện: tài chính, sở thích, cống hiến, công việc và gia đình."}, {"type": "mcq", "level": "VDC", "q": "Bài học lớn nhất từ Bài 9 đối với học sinh lớp 10 là gì?", "options": ["A. Chỉ cần học giỏi là đủ", "B. Cần chuẩn bị hành trang toàn diện: hiểu mình, dám lựa chọn, sống có lí tưởng và không ngừng nỗ lực", "C. Không cần ước mơ", "D. Hãy phó mặc cho số phận"], "answer": "B", "points": 0.25, "explain": "Bài 9 trang bị hành trang toàn diện: hiểu chính mình (Rovelli), dám lựa chọn và chịu trách nhiệm (Frost, Phan Văn Trường), sống có lí tưởng (Nguyễn Văn Thạc)."}, {"type": "short", "level": "NB", "q": "Kể tên hai tác giả Việt Nam có văn bản trong Bài 9.", "answer": "Phan Văn Trường và Nguyễn Văn Thạc", "points": 0.5, "explain": "Hai tác giả Việt Nam: Phan Văn Trường (Một đời như kẻ tìm đường) và liệt sĩ Nguyễn Văn Thạc (Mãi mãi tuổi hai mươi)."}, {"type": "short", "level": "TH", "q": "Nêu hai biểu hiện của cái tôi trong tản văn, tùy bút.", "answer": "Xưng tôi trực tiếp; bộc lộ cảm xúc, suy ngẫm cá nhân", "points": 0.5, "explain": "Cái tôi trong tản văn, tùy bút thể hiện qua việc xưng tôi trực tiếp và bộc lộ cảm xúc, suy ngẫm, quan niệm cá nhân một cách chân thành."}, {"type": "short", "level": "VD", "q": "Vì sao bài luận về bản thân nên kết hợp sơ đồ, biểu đồ minh họa kế hoạch?", "answer": "Vì trực quan, cụ thể, thể hiện tính khả thi của kế hoạch", "points": 0.5, "explain": "Sơ đồ, biểu đồ giúp kế hoạch trong bài luận trực quan, cụ thể, có mốc thời gian rõ ràng — thể hiện tính khả thi và quyết tâm của người viết."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về việc giữ gìn sự trong sáng của tiếng Việt (liên hệ với việc học văn).", "points": 0, "explain": "DÀN Ý: Mở đoạn: tiếng Việt giàu đẹp. Thân đoạn: thực trạng dùng sai (viết tắt, ngôn ngữ mạng thái quá, pha tạp); hậu quả (làm nghèo, xấu tiếng Việt); trách nhiệm giữ gìn (dùng đúng chính tả, chuẩn mực; học văn để cảm vẻ đẹp tiếng Việt). Kết đoạn: giữ gìn tiếng Việt là giữ gìn bản sắc. BÀI MẪU: Tiếng Việt là tài sản vô giá của dân tộc, là hồn cốt văn hóa Việt — càng học văn, em càng thấm thía điều ấy. Thế nhưng hiện nay, sự trong sáng của tiếng Việt đang bị đe dọa: không ít bạn trẻ viết tắt tùy tiện, dùng ngôn ngữ mạng thái quá cả trong bài kiểm tra; pha tạp tiếng nước ngoài một cách kệch cỡm; nói năng cộc lốc, thiếu chủ ngữ vị ngữ. Thói quen xấu ấy không chỉ làm nghèo đi vốn từ, xấu đi diễn đạt mà còn bào mòn bản sắc văn hóa dân tộc — bởi mất tiếng nói là mất một phần hồn dân tộc. Trách nhiệm giữ gìn tiếng Việt thuộc về mỗi người, nhất là học sinh: hãy viết đúng chính tả, dùng từ chuẩn mực; hạn chế ngôn ngữ mạng trong giao tiếp nghiêm túc; chăm đọc sách báo để trau dồi vốn từ; học văn không chỉ để thi mà để cảm nhận vẻ đẹp của tiếng mẹ đẻ. Mỗi câu văn đúng, đẹp ta viết ra hôm nay là một viên gạch góp phần giữ gìn ngôi nhà tiếng Việt. Hãy yêu và giữ gìn tiếng Việt như giữ gìn chính tâm hồn mình."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề: Tình yêu thương gia đình – điểm tựa của mỗi người.", "points": 0, "explain": "DÀN Ý: Mở bài: gia đình là tế bào xã hội, điểm tựa thiêng liêng. Thân bài: Giải thích: tình yêu thương gia đình là gắn bó, hiếu thảo, chia sẻ. Biểu hiện: cha mẹ hi sinh vì con; con cái hiếu thảo; anh em đùm bọc. Thực trạng: nhiều gia đình hạnh phúc; một bộ phận rạn nứt (bất hiếu, bạo lực gia đình, con cái hư). Nguyên nhân: áp lực cuộc sống, thiếu quan tâm, ảnh hưởng xấu. Hậu quả: con cái thiếu điểm tựa, dễ sa ngã; xã hội bất ổn. Bàn luận: gia đình là hành trang tinh thần; cần vun đắp mỗi ngày. Dẫn chứng. Giải pháp: mỗi thành viên quan tâm, chia sẻ; dành thời gian cho nhau. Kết bài: khẳng định, nhắn nhủ. BÀI MẪU: Gia đình là tế bào của xã hội, là điểm tựa thiêng liêng nhất của mỗi con người trên đường đời. Tình yêu thương gia đình là sự gắn bó máu thịt, là lòng hiếu thảo của con cái, sự hi sinh của cha mẹ và tình đùm bọc của anh em — thứ tình cảm không gì thay thế được. Trong gia đình hạnh phúc, cha mẹ tần tảo hi sinh vì con; con cái hiếu thảo, chăm ngoan; anh em yêu thương đùm bọc nhau. Chính không khí ấm áp ấy nuôi dưỡng tâm hồn ta, tiếp thêm sức mạnh mỗi khi vấp ngã. Thực tế có biết bao gia đình là tấm gương: cha mẹ nghèo vẫn nuôi con ăn học thành tài; con cái thành đạt không quên báo hiếu. Thế nhưng, cũng có những gia đình rạn nứt: con cái bất hiếu, hỗn láo; bạo lực gia đình; cha mẹ mải kiếm tiền bỏ bê con cái khiến con sa ngã. Nguyên nhân là áp lực cuộc sống, sự thiếu quan tâm chia sẻ và ảnh hưởng của lối sống thực dụng. Hậu quả là trẻ thiếu điểm tựa tinh thần, dễ sa vào tệ nạn; xã hội thêm bất ổn. Gia đình chính là hành trang tinh thần quý giá nhất mà mỗi người mang theo suốt đời — như quê hương trong thơ Thạch Lam, như nỗi nhớ trong nhật kí người lính. Vì vậy, mỗi thành viên hãy vun đắp gia đình mỗi ngày: một bữa cơm sum họp, một lời hỏi thăm, sự chia sẻ việc nhà, lòng hiếu thảo với ông bà cha mẹ. Đừng để đến khi mất đi mới hối tiếc. Hãy yêu thương gia đình khi còn có thể — bởi đó là điểm tựa vững chắc nhất cho ta bước vào đời."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Dòng nào nêu đúng trình tự các văn bản đọc trong Bài 9 theo SGK?", "options": ["A. Về chính chúng ta – Con đường không chọn – Một đời như kẻ tìm đường", "B. Một đời như kẻ tìm đường – Về chính chúng ta – Con đường không chọn", "C. Con đường không chọn – Mãi mãi tuổi hai mươi – Về chính chúng ta", "D. Mãi mãi tuổi hai mươi – Một đời như kẻ tìm đường – Về chính chúng ta"], "answer": "A", "points": 0.25, "explain": "Theo SGK, thứ tự là: Về chính chúng ta, Con đường không chọn, Một đời như kẻ tìm đường; Thực hành đọc: Mãi mãi tuổi hai mươi."}, {"type": "mcq", "level": "NB", "q": "Biện pháp nghệ thuật nào nổi bật trong văn bản Về chính chúng ta?", "options": ["A. Ẩn dụ", "B. Liệt kê (giọt mưa, tia sáng, đồng hồ, cơn gió, DNA...)", "C. Nhân hóa duy nhất", "D. Nói quá"], "answer": "B", "points": 0.25, "explain": "Tác giả liệt kê dồn dập các ví dụ gần gũi (giọt mưa, tia sáng, đồng hồ, cơn gió, DNA...) để chứng minh: vạn vật đều chứa thông tin."}, {"type": "mcq", "level": "TH", "q": "Vì sao R. Frost day dứt về con đường không chọn?", "options": ["A. Vì con đường đó đẹp hơn", "B. Vì không biết con đường không chọn sẽ ra sao và không thể quay lại để thử", "C. Vì bị lạc đường", "D. Vì không thích đi bộ"], "answer": "B", "points": 0.25, "explain": "Nỗi day dứt đến từ sự không thể biết trước và không thể quay lại: giá như được đi cả hai, giá như biết con đường kia sẽ ra sao — triết lí về tính không thể đảo ngược của lựa chọn."}, {"type": "mcq", "level": "TH", "q": "Khi viết bài luận về bản thân, phần mở bài nên làm gì?", "options": ["A. Kể lể dài dòng về gia đình", "B. Giới thiệu khái quát về bản thân, tạo ấn tượng ban đầu", "C. Phê phán bản thân gay gắt", "D. Chép dàn ý"], "answer": "B", "points": 0.25, "explain": "Mở bài giới thiệu khái quát về bản thân (tên, ấn tượng chung), tạo thiện cảm và định hướng cho toàn bài."}, {"type": "mcq", "level": "VDC", "q": "Nhận định nào đúng về mối quan hệ giữa hiểu mình và lựa chọn đúng?", "options": ["A. Không liên quan gì đến nhau", "B. Hiểu mình (điểm mạnh, điểm yếu, ước mơ) là cơ sở để lựa chọn đúng hướng đi", "C. Chỉ cần nghe theo người khác", "D. Lựa chọn là may rủi hoàn toàn"], "answer": "B", "points": 0.25, "explain": "Hiểu mình là tiền đề của lựa chọn đúng: biết mình giỏi gì, muốn gì thì mới chọn được hướng đi phù hợp; chọn theo phong trào dễ dẫn đến sai lầm, hối tiếc."}, {"type": "short", "level": "NB", "q": "Tác phẩm 7 bài học hay nhất về vật lí là của tác giả nào?", "answer": "Carlo Rovelli", "points": 0.5, "explain": "7 bài học hay nhất về vật lí (Seven Brief Lessons on Physics) là cuốn sách khoa học thường thức nổi tiếng của Carlo Rovelli."}, {"type": "short", "level": "TH", "q": "Nêu hai việc làm thể hiện lòng biết ơn thế hệ cha anh của học sinh hôm nay.", "answer": "Học tập tốt để xây dựng đất nước; tham gia đền ơn đáp nghĩa, thắp nến tri ân", "points": 0.5, "explain": "Biết ơn thiết thực nhất: học tập tốt, sống có ích để xứng đáng với hi sinh của cha anh; tham gia các hoạt động đền ơn đáp nghĩa, tri ân liệt sĩ."}, {"type": "short", "level": "VD", "q": "Giải thích ý nghĩa của việc đặt tên sơ đồ là Tôi của tương lai.", "answer": "Nhấn mạnh chủ thể là chính mình; hướng về tương lai với mục tiêu cụ thể", "points": 0.5, "explain": "Tên sơ đồ nhấn mạnh: tương lai là của chính tôi — tôi phải chủ động hoạch định; các mục tiêu cụ thể trên 5 phương diện giúp hiện thực hóa tương lai ấy."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về tinh thần vượt khó trong học tập.", "points": 0, "explain": "DÀN Ý: Mở đoạn: khó khăn là điều thường gặp trong học tập. Thân đoạn: biểu hiện của tinh thần vượt khó (kiên trì, không nản khi điểm kém, chủ động tìm cách); dẫn chứng (bạn vượt khó học giỏi; tấm gương); phê phán thói nản chí, đổ lỗi, gian lận. Kết đoạn: khó khăn là cơ hội trưởng thành. BÀI MẪU: Trong học tập, khó khăn là điều không ai tránh khỏi: bài khó, điểm kém, áp lực thi cử... Tinh thần vượt khó thể hiện ở sự kiên trì không nản lòng: điểm kém thì tìm nguyên nhân, học lại từ đầu; bài khó thì hỏi thầy, hỏi bạn, mày mò đến khi hiểu; áp lực thì biến thành động lực. Quanh ta có biết bao tấm gương: bạn học sinh mồ côi cha vẫn đỗ thủ khoa nhờ dậy sớm học bài; bạn khuyết tật vẫn đạt giải học sinh giỏi. Ngược lại, một số bạn gặp khó là nản: bỏ cuộc giữa chừng, đổ lỗi cho hoàn cảnh, thậm chí gian lận để có điểm cao giả tạo. Đó là sự đầu hàng đáng tiếc. Cần nhớ rằng khó khăn chính là cơ hội để ta trưởng thành: mỗi lần vượt qua một thử thách, ta lại mạnh mẽ và tự tin hơn. Như triết lí của Phan Văn Trường: con đường nào cũng có lối ra nếu ta hết lòng bước tiếp. Hãy coi khó khăn trong học tập là người thầy nghiêm khắc nhất — vượt qua nó, ta sẽ thấy mình lớn lên từng ngày."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề: Lòng kiên trì – chìa khóa của thành công.", "points": 0, "explain": "DÀN Ý: Mở bài: vai trò của kiên trì; vấn đề cần bàn. Thân bài: Giải thích: kiên trì là bền bỉ theo đuổi mục tiêu không nản lòng. Bàn luận: tài năng không kiên trì dễ thất bại; kiên trì bù đắp thiếu hụt (cần cù bù thông minh); dẫn chứng (Edison, các tấm gương vượt khó). Thực trạng: một số bạn thiếu kiên trì (bỏ cuộc sớm, đứng núi này trông núi nọ). Nguyên nhân: muốn thành công nhanh, thiếu bản lĩnh. Hậu quả: dang dở, phí hoài. Giải pháp: chia mục tiêu nhỏ, kiên trì từng bước; tự động viên; tìm bạn đồng hành. Kết bài: khẳng định, động viên. BÀI MẪU: Người ta thường nói: có công mài sắt, có ngày nên kim. Lòng kiên trì chính là chìa khóa mở cánh cửa thành công — điều mà mọi tấm gương vĩ đại đều chứng minh. Kiên trì là sự bền bỉ theo đuổi mục tiêu đến cùng, không nản lòng trước khó khăn, thất bại. Tài năng mà thiếu kiên trì cũng dễ thất bại: bao thần đồng mai một vì ỷ lại; ngược lại, người bình thường mà kiên trì có thể làm nên điều phi thường — cần cù bù thông minh. Edison thất bại hàng nghìn lần mới có bóng đèn; các vận động viên vô địch đều trải qua năm tháng tập luyện khổ ải; bao thủ khoa là những người dậy sớm, thức khuya bền bỉ suốt năm. Thực tế, không ít bạn thiếu kiên trì: học được vài hôm thì chán, đứng núi này trông núi nọ, gặp khó là bỏ cuộc. Nguyên nhân là tâm lí muốn thành công nhanh, thiếu bản lĩnh và thói quen dễ dãi. Hậu quả là mọi việc dang dở, tuổi trẻ trôi qua trong tiếc nuối. Để rèn lòng kiên trì, hãy chia mục tiêu lớn thành những bước nhỏ dễ đạt được — mỗi bước thành công sẽ tiếp thêm động lực; hãy tự động viên mình khi nản lòng; tìm bạn đồng hành để cùng cố gắng. Kiên trì không phải là cố chấp mù quáng: nếu hướng đi sai, hãy dũng cảm điều chỉnh — nhưng một khi đã chọn đúng, hãy kiên trì đến cùng. Thành công không dành cho người thông minh nhất mà dành cho người kiên trì nhất. Hãy kiên trì từ hôm nay — vì mỗi giọt mồ hôi kiên trì đều đang tưới cho hoa thành công nở rộ ngày mai."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Bài học nào sau đây KHÔNG thuộc chủ đề Hành trang cuộc sống?", "options": ["A. Hiểu chính mình", "B. Dám lựa chọn và chịu trách nhiệm", "C. Sống có lí tưởng", "D. Cách giải phương trình bậc hai"], "answer": "D", "points": 0.25, "explain": "Hành trang cuộc sống gồm: hiểu mình, dám lựa chọn, sống có lí tưởng, nỗ lực vươn lên. Giải phương trình bậc hai thuộc môn Toán."}, {"type": "mcq", "level": "NB", "q": "Văn bản nào sau đây là thơ?", "options": ["A. Về chính chúng ta", "B. Con đường không chọn", "C. Một đời như kẻ tìm đường", "D. Mãi mãi tuổi hai mươi"], "answer": "B", "points": 0.25, "explain": "Con đường không chọn là bài thơ (thơ tự do) của R. Frost; các văn bản còn lại là văn xuôi (tản văn, tùy bút, nhật kí)."}, {"type": "mcq", "level": "TH", "q": "Vì sao nhật kí được coi là thể loại chân thực nhất để hiểu một con người?", "options": ["A. Vì nhật kí rất dài", "B. Vì nhật kí ghi lại suy nghĩ, tình cảm thật nhất, không tô vẽ, thường viết cho chính mình", "C. Vì nhật kí ai cũng đọc được", "D. Vì nhật kí luôn vui vẻ"], "answer": "B", "points": 0.25, "explain": "Nhật kí thường viết cho chính mình nên ghi lại suy nghĩ, tình cảm chân thực nhất, không tô vẽ — là tấm gương trung thực phản chiếu tâm hồn con người."}, {"type": "mcq", "level": "TH", "q": "Trong thuyết trình, phương tiện phi ngôn ngữ nên được sử dụng như thế nào?", "options": ["A. Càng nhiều càng tốt", "B. Vừa đủ, minh họa đúng nội dung đang trình bày, rõ ràng", "C. Không nên dùng", "D. Chỉ dùng màu sắc lòe loẹt"], "answer": "B", "points": 0.25, "explain": "Phương tiện phi ngôn ngữ dùng vừa đủ, phải minh họa đúng nội dung đang nói và rõ ràng; lạm dụng sẽ phân tán, lấn át lời thuyết trình."}, {"type": "mcq", "level": "VDC", "q": "Thông điệp chung của cả ba văn bản đọc chính trong Bài 9 là gì?", "options": ["A. Hãy sống thụ động, chờ đợi", "B. Hãy hiểu mình, dám lựa chọn, hết lòng với lựa chọn và sống có lí tưởng", "C. Tiền bạc là quan trọng nhất", "D. Không cần nỗ lực"], "answer": "B", "points": 0.25, "explain": "Ba văn bản cùng hướng tới thông điệp: hiểu chính mình (Rovelli), dám lựa chọn (Frost), hết lòng với lựa chọn (Phan Văn Trường) — hành trang để sống có ý nghĩa, có lí tưởng."}, {"type": "short", "level": "NB", "q": "Kể tên hai nhà văn, nhà thơ nước ngoài có tác phẩm trong Bài 9.", "answer": "Carlo Rovelli (Ý) và Robert Frost (Mỹ)", "points": 0.5, "explain": "Hai tác giả nước ngoài: Các-lô Rô-ve-li (Ý) với Về chính chúng ta; Rô-bớt Phờ-rót (Mỹ) với Con đường không chọn."}, {"type": "short", "level": "TH", "q": "Nêu hai việc học sinh nên làm để chuẩn bị hành trang vào đời.", "answer": "Học tập tốt, rèn kĩ năng sống; xác định ước mơ và lập kế hoạch thực hiện", "points": 0.5, "explain": "Chuẩn bị hành trang: học tập tốt, rèn kĩ năng sống, đạo đức; xác định ước mơ, mục tiêu và lập kế hoạch hành động cụ thể, kiên trì."}, {"type": "short", "level": "VD", "q": "Vì sao nói tuổi trẻ là hành trang quý nhất của đời người?", "answer": "Vì có sức khỏe, trí tuệ, thời gian và khát vọng để học tập, lựa chọn, vươn lên", "points": 0.5, "explain": "Tuổi trẻ có sức khỏe, trí nhớ tốt, nhiều thời gian và khát vọng vươn lên — những điều kiện tốt nhất để học tập, lựa chọn hướng đi và xây dựng tương lai."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về ý nghĩa của hai chữ hành trang trong chủ đề Bài 9.", "points": 0, "explain": "DÀN Ý: Mở đoạn: nghĩa đen của hành trang. Thân đoạn: nghĩa bóng: những hiểu biết, phẩm chất, kĩ năng mang theo vào đời (hiểu mình, bản lĩnh lựa chọn, lí tưởng, tri thức, sức khỏe); hành trang tinh thần quan trọng không kém vật chất; liên hệ: chuẩn bị hành trang từ hôm nay. Kết đoạn: ai chuẩn bị tốt sẽ vững vàng. BÀI MẪU: Hành trang theo nghĩa đen là những vật dụng mang theo trong chuyến đi xa. Nhưng trong chủ đề Bài 9, hành trang mang nghĩa bóng sâu sắc: đó là những hiểu biết, phẩm chất và kĩ năng mà mỗi người mang theo trên hành trình cuộc đời. Hành trang ấy gồm: sự hiểu biết về chính mình (biết mình là ai, muốn gì); bản lĩnh lựa chọn và dám chịu trách nhiệm; lí tưởng sống cao đẹp; tri thức, kĩ năng sống; và cả sức khỏe. Khác với hành lí vật chất có thể mua được, hành trang tinh thần phải được chuẩn bị bằng cả quá trình rèn luyện lâu dài — không ai cho ta được, cũng không ai lấy đi được. Người có hành trang đầy đủ sẽ vững vàng trước sóng gió; người tay trắng ra đời dễ chao đảo, lạc hướng. Với học sinh chúng em, chuẩn bị hành trang chính là: học tập chăm chỉ, rèn đạo đức, xác định ước mơ, tập sống tự lập và biết yêu thương. Chuyến đi cuộc đời còn dài ở phía trước — hãy chuẩn bị hành trang thật tốt từ hôm nay để mỗi bước đi đều vững vàng, ý nghĩa."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề: Lòng yêu nước của tuổi trẻ trong thời đại mới.", "points": 0, "explain": "DÀN Ý: Mở bài: truyền thống yêu nước; vấn đề: biểu hiện mới của lòng yêu nước tuổi trẻ. Thân bài: Giải thích: yêu nước thời bình. Biểu hiện mới: học giỏi xây dựng đất nước; bảo vệ chủ quyền trên không gian mạng; quảng bá văn hóa Việt; tình nguyện vì cộng đồng; khởi nghiệp sáng tạo. Thực trạng: đa số tốt; một bộ phận thờ ơ, sính ngoại. Nguyên nhân. Bàn luận: yêu nước không phải khẩu hiệu mà là hành động cụ thể mỗi ngày. Dẫn chứng. Giải pháp: giáo dục, tự rèn. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Lòng yêu nước là truyền thống quý báu của dân tộc Việt Nam, được hun đúc qua hàng nghìn năm dựng nước và giữ nước. Trong thời đại mới, lòng yêu nước của tuổi trẻ có những biểu hiện mới mẻ, phù hợp với thời đại nhưng vẫn mang cốt cách cha ông. Yêu nước thời bình không còn là cầm súng ra trận mà thể hiện qua những hành động cụ thể: học tập giỏi để sau này xây dựng đất nước giàu mạnh; hăng hái bảo vệ chủ quyền trên không gian mạng, đấu tranh với thông tin sai lệch; quảng bá văn hóa, hình ảnh Việt Nam ra thế giới; tham gia tình nguyện vì cộng đồng; khởi nghiệp sáng tạo, làm giàu chính đáng. Thực tế có biết bao tấm gương: nhà khoa học trẻ đạt giải quốc tế mang vinh quang về cho Tổ quốc; các bạn trẻ tình nguyện nơi biên giới, hải đảo; những người trẻ dùng mạng xã hội lan tỏa điều tốt đẹp về đất nước. Thế nhưng, vẫn còn một bộ phận thờ ơ với vận mệnh đất nước, sính ngoại, coi thường giá trị truyền thống; cá biệt có bạn bị lôi kéo, có phát ngôn lệch lạc. Nguyên nhân là thiếu giáo dục truyền thống một cách sinh động và ảnh hưởng của lối sống thực dụng. Cần hiểu rằng yêu nước không phải là khẩu hiệu hô to mà là việc làm nhỏ mỗi ngày: học tốt, sống tốt, tuân thủ pháp luật, giữ gìn bản sắc văn hóa. Mỗi bạn trẻ hãy bắt đầu từ những việc trong tầm tay, đồng thời nuôi dưỡng khát vọng lớn lao. Gia đình, nhà trường cần thắp lửa yêu nước bằng những câu chuyện sinh động về cha anh. Tuổi trẻ hôm nay may mắn được sống trong hòa bình — hãy biến may mắn ấy thành trách nhiệm: xây dựng một Việt Nam hùng cường, để xứng đáng với xương máu cha ông và niềm tin của Tổ quốc."}]}]}
