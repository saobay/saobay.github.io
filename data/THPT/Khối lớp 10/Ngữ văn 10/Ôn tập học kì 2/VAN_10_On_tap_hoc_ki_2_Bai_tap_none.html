nh ảnh văn hóa Việt. Nguyên nhân là tác động của hội nhập thiếu chọn lọc, sự thiếu hiểu biết về di sản và giáo dục truyền thống chưa sâu. Cần hiểu rằng giữ gìn bản sắc không có nghĩa là bảo thủ, khép kín; mà là tiếp thu tinh hoa thế giới có chọn lọc đồng thời làm mới, lan tỏa di sản cha ông — như cách các bạn trẻ phối quan họ với nhạc hiện đại, đưa múa rối nước lên mạng xã hội. Mỗi bạn trẻ hãy: tìm hiểu di sản quê hương; trải nghiệm lễ hội, nghệ thuật dân gian; dùng mạng xã hội quảng bá văn hóa Việt; ứng xử văn minh khi ra nước ngoài — mỗi người là một đại sứ văn hóa. Dân tộc nào giữ được bản sắc, dân tộc ấy mới đứng vững giữa dòng chảy toàn cầu. Tuổi trẻ hãy là người giữ lửa — để hồn Việt mãi rực sáng."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Năm 1980, Nguyễn Trãi được UNESCO vinh danh là gì?", "options": ["A. Anh hùng lao động", "B. Danh nhân văn hóa thế giới", "C. Nhà khoa học vĩ đại", "D. Chiến sĩ hòa bình"], "answer": "B", "points": 0.25, "explain": "Năm 1980, nhân 600 năm ngày sinh, UNESCO vinh danh Nguyễn Trãi là danh nhân văn hóa thế giới."}, {"type": "mcq", "level": "NB", "q": "Tác giả của truyện Một chuyện đùa nho nhỏ là ai?", "options": ["A. V. Hugo", "B. A. Chekhov", "C. Thạch Lam", "D. Nguyễn Quang Sáng"], "answer": "B", "points": 0.25, "explain": "Một chuyện đùa nho nhỏ là của An-tôn Sê-khốp (Anton Chekhov), bậc thầy truyện ngắn Nga."}, {"type": "mcq", "level": "TH", "q": "Tư tưởng chủ đạo của Bình Ngô đại cáo là gì?", "options": ["A. Nhân nghĩa – việc nhân nghĩa cốt ở yên dân", "B. Thần quyền", "C. Ẩn dật", "D. Hưởng lạc"], "answer": "A", "points": 0.25, "explain": "Tư tưởng nhân nghĩa xuyên suốt bài cáo: việc nhân nghĩa cốt ở yên dân; chính nghĩa thuộc về ta, phi nghĩa thuộc về giặc."}, {"type": "mcq", "level": "TH", "q": "Tác dụng của phương tiện phi ngôn ngữ trong văn bản thông tin là gì?", "options": ["A. Trang trí", "B. Trình bày thông tin trực quan, cô đọng, dễ nắm bắt", "C. Thay thế lời văn", "D. Làm văn bản dài hơn"], "answer": "B", "points": 0.25, "explain": "Phương tiện phi ngôn ngữ (hình ảnh, sơ đồ, biểu đồ) giúp thông tin trực quan, cô đọng, có hệ thống — dễ nắm bắt, dễ nhớ."}, {"type": "mcq", "level": "VDC", "q": "Vì sao khi phân tích tác phẩm truyện cần kết hợp phân tích nội dung và nghệ thuật?", "options": ["A. Để bài văn dài hơn", "B. Vì nghệ thuật là phương tiện thể hiện nội dung; tách rời sẽ phân tích hình thức suông, thiếu sức thuyết phục", "C. Vì thầy cô yêu cầu", "D. Không cần thiết"], "answer": "B", "points": 0.25, "explain": "Nội dung và nghệ thuật thống nhất: mỗi biện pháp nghệ thuật đều phục vụ thể hiện nội dung, tư tưởng; phân tích tách rời sẽ thành hình thức suông."}, {"type": "short", "level": "NB", "q": "Kể tên hai văn bản thơ được học trong học kì 2.", "answer": "Bảo kính cảnh giới, Dục Thúy sơn, Con đường không chọn (nêu hai)", "points": 0.5, "explain": "Các văn bản thơ: Bảo kính cảnh giới (bài 43), Dục Thúy sơn, Ngôn chí, Bạch Đằng hải khẩu (bài 6); Con đường không chọn (bài 9)."}, {"type": "short", "level": "TH", "q": "Nêu hai điểm khác nhau giữa ngôi kể thứ nhất và ngôi kể thứ ba.", "answer": "Ngôi thứ nhất: xưng tôi, chủ quan gần gũi; ngôi thứ ba: giấu mình, khách quan hơn", "points": 0.5, "explain": "Ngôi thứ nhất người kể xưng tôi, là nhân vật, lời kể chủ quan gần gũi; ngôi thứ ba người kể giấu mình đứng ngoài, lời kể khách quan, có thể toàn tri."}, {"type": "short", "level": "VD", "q": "Nêu hai lưu ý khi viết văn bản nội quy.", "answer": "Ngôn ngữ ngắn gọn, rõ ràng; mỗi điều một nội dung; đánh số; khả thi", "points": 0.5, "explain": "Viết nội quy cần: ngôn ngữ ngắn gọn, rõ ràng, mang tính mệnh lệnh; mỗi điều khoản một nội dung; đánh số thứ tự; quy định cụ thể, khả thi."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích một biện pháp nghệ thuật đặc sắc trong một văn bản học kì 2.", "points": 0, "explain": "DÀN Ý: Mở đoạn: giới thiệu văn bản và biện pháp chọn. Thân đoạn: phân tích biểu hiện, tác dụng của biện pháp đối với việc thể hiện nội dung, tư tưởng. Kết đoạn: đánh giá. BÀI MẪU: (Minh họa với nghệ thuật tương phản trong Người cầm quyền khôi phục uy quyền — học sinh có thể chọn biện pháp khác theo dàn ý.) Nghệ thuật tương phản trong đoạn trích Người cầm quyền khôi phục uy quyền của V. Hugo là một biện pháp đặc sắc, góp phần quan trọng thể hiện tư tưởng nhân đạo của tác phẩm. Tương phản được thể hiện đậm nét qua hai nhân vật: Giăng Van-giăng nhân ái, cao thượng đối lập với Gia-ve máy móc, tàn nhẫn; tình thương đối lập với sự vô cảm; lẽ phải đối lập với pháp luật khô cứng. Chính sự đối lập gay gắt ấy làm nổi bật vẻ đẹp tâm hồn Giăng Van-giăng: càng đặt cạnh cái ác, cái thiện càng tỏa sáng. Tương phản còn thể hiện ở tình huống: trước người sắp chết, kẻ bị truy nã lại có uy quyền đạo đức khiến viên cảnh sát phải khuất phục — một nghịch lí đầy ý nghĩa. Nhờ nghệ thuật tương phản, Hugo không cần bình luận nhiều mà tư tưởng tự bộc lộ: cái thiện, tình thương có sức mạnh chiến thắng cái ác. Đây là bài học về cách dùng nghệ thuật phục vụ nội dung: biện pháp nào cũng phải góp phần thể hiện tư tưởng thì mới có giá trị. (Học sinh chọn biện pháp khác: phân tích theo đúng dàn ý trên.)"}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận phân tích, đánh giá một truyện ngắn đã học trong học kì 2.", "points": 0, "explain": "DÀN Ý: Mở bài: giới thiệu tác giả, tác phẩm; nêu vấn đề phân tích khái quát. Thân bài: Tóm tắt ngắn. Phân tích nội dung (đề tài, nhân vật, tư tưởng). Phân tích nghệ thuật (ngôi kể, điểm nhìn, chi tiết, ngôn ngữ, giọng điệu). Đánh giá (giá trị nội dung, nghệ thuật; ý nghĩa). Kết bài: khẳng định, cảm nghĩ. BÀI MẪU: (Minh họa với Dưới bóng hoàng lan — học sinh có thể chọn truyện khác theo dàn ý.) Dưới bóng hoàng lan của Thạch Lam là truyện ngắn để lại trong em nhiều rung động sâu lắng. Truyện kể về Thanh trở về thăm quê sau hai năm xa cách: ngôi nhà cũ, người bà hiền từ, cây hoàng lan thơm ngát và tình cảm trong sáng với Nga. Về nội dung, truyện là bài ca về tình quê hương và tình yêu trong sáng: quê hương hiện lên qua những hình ảnh thân thuộc trở thành cội nguồn nuôi dưỡng tâm hồn; tình cảm Thanh – Nga e ấp, vô tư như hương hoàng lan. Ẩn sau là triết lí: hạnh phúc đích thực nằm ở những điều bình dị. Về nghệ thuật, Thạch Lam dùng ngôi kể thứ ba với điểm nhìn gắn vào Thanh; nghệ thuật miêu tả tâm lí tinh tế qua cảm giác, cử chỉ; cây hoàng lan thành hình tượng trung tâm giàu biểu tượng; giọng văn nhẹ nhàng, man mác, giàu chất thơ. Cốt truyện đơn giản nhưng sức ám ảnh lớn — đúng phong cách truyện của tâm hồn. Đánh giá chung, đây là viên ngọc quý của truyện ngắn Việt Nam: nội dung nhân văn, nghệ thuật độc đáo. Với em, truyện dạy bài học về lòng yêu quê hương và cách sống chậm để cảm nhận vẻ đẹp cuộc sống. (Học sinh chọn truyện khác: thay tên truyện, phân tích theo đúng dàn ý.)"}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Bài thơ Bảo kính cảnh giới (bài 43) thuộc tập thơ nào?", "options": ["A. Ức Trai thi tập", "B. Quốc âm thi tập", "C. Nhật kí trong tù", "D. Góc sân và khoảng trời"], "answer": "B", "points": 0.25, "explain": "Bảo kính cảnh giới thuộc Quốc âm thi tập — tập thơ Nôm của Nguyễn Trãi."}, {"type": "mcq", "level": "NB", "q": "Văn bản Phục hồi tầng ozone đề cập đến nghị định thư quốc tế nào?", "options": ["A. Nghị định thư Kyoto", "B. Nghị định thư Montreal", "C. Hiệp định Paris", "D. Công ước Geneva"], "answer": "B", "points": 0.25, "explain": "Nghị định thư Montreal (1987) yêu cầu các nước cấm chất phá hủy tầng ozone — cơ sở cho thành công phục hồi ozone."}, {"type": "mcq", "level": "TH", "q": "Quyền năng của người kể chuyện thể hiện ở việc nào?", "options": ["A. Quyết định giá bìa sách", "B. Lựa chọn ngôi kể, điểm nhìn, cách sắp xếp chi tiết để dẫn dắt cảm xúc người đọc", "C. Chọn nhà xuất bản", "D. Vẽ minh họa"], "answer": "B", "points": 0.25, "explain": "Người kể chuyện có quyền lựa chọn ngôi kể, điểm nhìn, thứ tự chi tiết — từ đó định hướng cảm nhận của người đọc."}, {"type": "mcq", "level": "TH", "q": "Theo Phan Văn Trường, hạnh phúc nằm ở đâu?", "options": ["A. Ở đích đến giàu sang", "B. Ngay trên chính con đường ta đã chọn, nếu hết lòng với nó", "C. Do số phận ban cho", "D. Ở nơi xa xôi"], "answer": "B", "points": 0.25, "explain": "Hạnh phúc nằm ngay trên chính con đường ta đã chọn — trong sự nỗ lực hết lòng mỗi ngày, chứ không chỉ ở đích đến."}, {"type": "mcq", "level": "VDC", "q": "Khi gặp câu nghị luận văn học yêu cầu phân tích nhân vật, nên triển khai theo trình tự nào?", "options": ["A. Kể lại toàn bộ truyện", "B. Giới thiệu nhân vật → phân tích ngoại hình, hành động, lời nói, tâm lí → đánh giá, khái quát ý nghĩa", "C. Chỉ nêu cảm nghĩ chung chung", "D. Chép lại các câu văn miêu tả"], "answer": "B", "points": 0.25, "explain": "Phân tích nhân vật cần: giới thiệu vị trí nhân vật → phân tích các phương diện (ngoại hình, hành động, lời nói, tâm lí) với dẫn chứng → đánh giá, khái quát ý nghĩa."}, {"type": "short", "level": "NB", "q": "Kể tên hai tác giả nước ngoài có tác phẩm trong chương trình học kì 2.", "answer": "V. Hugo (Pháp), A. Chekhov (Nga), C. Rovelli (Ý), R. Frost (Mỹ), P. Wohlleben (Đức) (nêu hai)", "points": 0.5, "explain": "Các tác giả nước ngoài: Vích-to Huy-gô, An-tôn Sê-khốp, Các-lô Rô-ve-li, Rô-bớt Phờ-rót, Pê-tơ Vô-lơ-lê-ben."}, {"type": "short", "level": "TH", "q": "Nêu hai đặc điểm của tản văn, tùy bút.", "answer": "Tự do, linh hoạt; cái tôi rõ nét; giàu cảm xúc, suy ngẫm", "points": 0.5, "explain": "Tản văn, tùy bút: văn xuôi tự do, linh hoạt; cái tôi tác giả hiện rõ; giàu cảm xúc và suy ngẫm; ngôn ngữ tinh tế, giàu chất thơ."}, {"type": "short", "level": "VD", "q": "Vì sao khi dùng từ Hán Việt cần hiểu nghĩa từng yếu tố cấu tạo?", "answer": "Để dùng đúng nghĩa, đúng sắc thái; tránh nhầm lẫn", "points": 0.5, "explain": "Từ Hán Việt do các yếu tố Hán ghép lại; hiểu từng yếu tố giúp dùng đúng nghĩa, đúng sắc thái trang trọng, tránh nhầm lẫn, lạm dụng."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về tinh thần học tập suốt đời (gợi ý từ các văn bản đã học).", "points": 0, "explain": "DÀN Ý: Mở đoạn: tri thức không ngừng mở rộng. Thân đoạn: học từ sách vở, từ cuộc sống, từ thất bại; dẫn chứng (Phan Văn Trường: trải nghiệm khắp thế giới; các nhà khoa học); phê phán thói lười học, học vẹt. Kết đoạn: học tập suốt đời là hành trang. BÀI MẪU: Trong thời đại tri thức bùng nổ, học tập suốt đời không còn là khẩu hiệu mà là yêu cầu sống còn. Học không chỉ ở trường lớp mà ở mọi nơi: từ sách báo khoa học (như các văn bản Bài 8 mở ra chân trời vũ trụ, thiên nhiên), từ trải nghiệm cuộc sống (như Phan Văn Trường đúc kết từ hành trình khắp thế giới), từ cả thất bại của chính mình. Người học tập suốt đời luôn cập nhật, thích ứng được với thay đổi; người ngừng học sẽ nhanh chóng lạc hậu. Đáng tiếc, một số bạn coi việc học chỉ để thi, thi xong là quên; ra trường là ngừng đọc sách. Đó là quan niệm sai lầm trong thời đại mà tri thức hôm nay có thể lỗi thời ngày mai. Học tập suốt đời không có nghĩa là lúc nào cũng cầm sách mà là giữ được trí tò mò, ham hiểu biết: đọc mỗi ngày một chút, học từ mọi người xung quanh, dám thử cái mới. Hãy biến việc học thành niềm vui, thành thói quen — bởi như người xưa dạy: học, học nữa, học mãi. Đó chính là hành trang vững chắc nhất cho tương lai của mỗi chúng ta."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề xã hội: Văn hóa ứng xử nơi công cộng của giới trẻ.", "points": 0, "explain": "DÀN Ý: Mở bài: văn hóa ứng xử thể hiện văn minh; vấn đề: ứng xử nơi công cộng của giới trẻ. Thân bài: Giải thích: ứng xử văn minh (xếp hàng, giữ vệ sinh, nói khẽ, nhường nhịn). Thực trạng: nhiều bạn văn minh; một bộ phận chen lấn, xả rác, gây ồn, vô cảm. Nguyên nhân: thiếu giáo dục, ý thức kém, đua đòi. Hậu quả: mất mĩ quan, ảnh hưởng người khác, xấu hình ảnh. Bàn luận: văn minh bắt đầu từ việc nhỏ; mỗi người là hình ảnh đất nước. Dẫn chứng. Giải pháp: giáo dục, tự rèn, xử phạt. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Văn hóa ứng xử nơi công cộng là thước đo văn minh của mỗi người và của cả cộng đồng. Với giới trẻ — lực lượng đông đảo nơi công cộng — vấn đề này càng cần được quan tâm. Ứng xử văn minh là những việc tưởng nhỏ mà ý nghĩa lớn: xếp hàng khi chờ đợi, bỏ rác đúng nơi quy định, nói khẽ nơi tôn nghiêm, nhường ghế cho người già, trẻ em, giữ gìn cảnh quan chung. Đáng mừng là nhiều bạn trẻ rất văn minh: tình nguyện nhặt rác, xếp hàng ngay ngắn, nhắc nhở nhau giữ trật tự. Thế nhưng, vẫn còn những hình ảnh xấu xí: chen lấn xô đẩy khi lên xe, xả rác bừa bãi ở điểm du lịch, gây ồn ào nơi công cộng, thản nhiên vi phạm nội quy. Nguyên nhân là ý thức kém, thiếu giáo dục từ nhỏ và tâm lí đám đông a dua. Hậu quả: môi trường, cảnh quan bị hủy hoại; người khác bị ảnh hưởng; hình ảnh giới trẻ, hình ảnh đất nước bị xấu đi trong mắt bạn bè quốc tế. Cần nhớ rằng văn minh không phải điều gì cao xa mà bắt đầu từ việc nhỏ mỗi ngày; mỗi bạn trẻ ra nước ngoài đều là một đại sứ văn hóa Việt. Để cải thiện, mỗi người hãy tự rèn từ việc nhỏ nhất; gia đình, nhà trường giáo dục ý thức công cộng thường xuyên; các quy định cần được thực thi nghiêm minh. Hãy để mỗi nơi ta đến đều sạch đẹp hơn khi ta rời đi — đó là cách đơn giản nhất để thể hiện mình là người văn minh."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Thể văn của Bình Ngô đại cáo là gì?", "options": ["A. Hịch", "B. Cáo", "C. Chiếu", "D. Biểu"], "answer": "B", "points": 0.25, "explain": "Bình Ngô đại cáo thuộc thể cáo — thể văn tuyên ngôn, văn biền ngẫu trang trọng."}, {"type": "mcq", "level": "NB", "q": "Nhân vật chính trong đoạn trích Người cầm quyền khôi phục uy quyền là ai?", "options": ["A. Gia-ve", "B. Giăng Van-giăng", "C. Cô-dét", "D. Ma-ri-uyt"], "answer": "B", "points": 0.25, "explain": "Giăng Van-giăng là nhân vật trung tâm: con người nhân ái, dùng uy quyền đạo đức khuất phục Gia-ve, giữ trọn lời hứa với Phăng-tin."}, {"type": "mcq", "level": "TH", "q": "Biện pháp chêm xen có tác dụng gì?", "options": ["A. Bổ sung, giải thích, nhấn mạnh thông tin", "B. Làm câu văn khó hiểu", "C. Thay thế miêu tả", "D. Giảm thông tin"], "answer": "A", "points": 0.25, "explain": "Phần chêm xen (trong ngoặc đơn, gạch ngang) chèn thêm thông tin để bổ sung, giải thích hoặc nhấn mạnh."}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa của việc thiết kế sơ đồ Tôi của tương lai là gì?", "options": ["A. Trang trí vở", "B. Trực quan hóa ước mơ, giúp xác lập mục tiêu rõ ràng và tạo động lực thực hiện", "C. Để khoe với bạn", "D. Không có ý nghĩa"], "answer": "B", "points": 0.25, "explain": "Sơ đồ hóa ước mơ giúp mục tiêu rõ ràng, cụ thể, có mốc thời gian — từ đó tạo động lực và giúp theo dõi tiến độ thực hiện."}, {"type": "mcq", "level": "VDC", "q": "Trong bài văn nghị luận, dẫn chứng cần đạt yêu cầu nào?", "options": ["A. Càng nhiều càng tốt, không cần chọn lọc", "B. Cụ thể, tiêu biểu, cập nhật, xác đáng và gắn chặt với luận điểm", "C. Chỉ cần dẫn chứng cũ", "D. Bịa đặt cho hay"], "answer": "B", "points": 0.25, "explain": "Dẫn chứng phải cụ thể, tiêu biểu, cập nhật, xác đáng và gắn chặt với luận điểm; dẫn chứng chung chung, bịa đặt làm bài văn mất sức thuyết phục."}, {"type": "short", "level": "NB", "q": "Kể tên hai văn bản nghị luận trung đại được nhắc trong chương trình (một đã học kĩ, một liên hệ).", "answer": "Bình Ngô đại cáo và Nam quốc sơn hà", "points": 0.5, "explain": "Bình Ngô đại cáo (Nguyễn Trãi) là bản tuyên ngôn độc lập thứ hai, sau Nam quốc sơn hà (thời Lý) — bản tuyên ngôn đầu tiên."}, {"type": "short", "level": "TH", "q": "Nêu hai yêu cầu của bài luận về bản thân.", "answer": "Chân thành, trung thực; có dẫn chứng cụ thể; thể hiện khát vọng vươn lên", "points": 0.5, "explain": "Bài luận về bản thân đòi hỏi chân thành, trung thực (không tô vẽ, không tự ti); mọi nhận định có dẫn chứng cụ thể; thể hiện khát vọng vươn lên."}, {"type": "short", "level": "VD", "q": "Phân biệt văn bản thuyết minh và văn bản nội quy.", "answer": "Thuyết minh: giới thiệu tri thức có hệ thống; nội quy: quy định điều được/không được làm, tính bắt buộc", "points": 0.5, "explain": "Văn bản thuyết minh giới thiệu tri thức về đối tượng một cách có hệ thống; văn bản nội quy quy định những điều được/không được làm, mang tính bắt buộc."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ bày tỏ suy nghĩ của em về lời dạy: Học, học nữa, học mãi.", "points": 0, "explain": "DÀN Ý: Mở đoạn: giới thiệu lời dạy. Thân đoạn: giải thích: tri thức vô tận, phải học suốt đời; học ở trường, ở sách, ở đời; dẫn chứng: các tấm gương học tập suốt đời; phê phán thói học vẹt, ngừng học. Kết đoạn: quyết tâm. BÀI MẪU: Lời dạy Học, học nữa, học mãi là kim chỉ nam cho mỗi người trên con đường chiếm lĩnh tri thức. Học ở đây không chỉ là học ở trường lớp mà là học suốt đời: học từ sách vở, từ thầy cô, bạn bè, từ trải nghiệm cuộc sống và cả từ thất bại của chính mình. Vì sao phải học mãi? Vì tri thức nhân loại không ngừng mở rộng: điều đúng hôm nay có thể lỗi thời ngày mai; vì cuộc sống luôn đặt ra những bài toán mới đòi hỏi hiểu biết mới. Người ngừng học sẽ nhanh chóng lạc hậu, như chiếc máy không được cập nhật. Thực tế có những tấm gương học tập suốt đời đáng khâm phục: nhiều người dù tuổi cao vẫn miệt mài nghiên cứu, học ngoại ngữ, học công nghệ mới. Ngược lại, không ít bạn coi việc học chỉ để thi cử, thi xong là quên — đó là cách học vẹt, học đối phó đáng phê phán. Với học sinh chúng em, học, học nữa, học mãi trước hết là học thật chắc kiến thức phổ thông, đồng thời nuôi dưỡng trí tò mò, ham hiểu biết. Hãy biến mỗi ngày thành một ngày học tập — bởi tri thức là hành trang không bao giờ cũ."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề xã hội: Lòng trung thực – nền tảng của niềm tin.", "points": 0, "explain": "DÀN Ý: Mở bài: vai trò của trung thực; vấn đề: sự xuống cấp của lòng trung thực. Thân bài: Giải thích: trung thực là thật thà, không dối trá. Biểu hiện: thật thà trong học tập, kinh doanh, giao tiếp. Thực trạng: nhiều người trung thực; một bộ phận dối trá (gian lận thi cử, hàng giả, tin giả). Nguyên nhân: hám lợi, thiếu giáo dục, dễ dãi với cái xấu. Hậu quả: mất niềm tin, xã hội bất ổn. Bàn luận: trung thực có thể thiệt thòi trước mắt nhưng bền vững lâu dài. Dẫn chứng. Giải pháp: giáo dục, tự rèn, xử lí nghiêm. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Lòng trung thực là nền tảng của mọi niềm tin trong cuộc sống — niềm tin giữa con người với nhau và niềm tin vào xã hội. Trung thực nghĩa là thật thà, ngay thẳng, không dối trá trong lời nói và việc làm. Người trung thực dám nhìn thẳng sự thật, dám nhận lỗi, nói đi đôi với làm. Đáng quý là quanh ta vẫn có nhiều tấm gương: học sinh nhặt được của rơi trả lại người mất; người kinh doanh giữ chữ tín; cán bộ liêm khiết. Thế nhưng, sự dối trá vẫn len lỏi nhiều nơi: gian lận trong thi cử, hàng giả hàng nhái tràn lan, tin giả trên mạng, báo cáo thành tích phóng đại. Nguyên nhân là lòng tham, sự dễ dãi với cái xấu và giáo dục về trung thực có lúc còn hình thức. Hậu quả thật nặng nề: khi niềm tin bị xói mòn, mọi quan hệ đều rạn nứt — thầy không tin trò, khách không tin hàng, dân không tin vào lời hứa; xã hội phải trả giá đắt cho sự dối trá. Có người cho rằng trung thực là thiệt thòi, khôn ngoan là phải mánh khóe. Đó là quan niệm sai lầm: dối trá có thể mang lợi trước mắt nhưng sớm muộn cũng bị phát hiện và trả giá; chỉ có trung thực mới tạo dựng được niềm tin bền vững — tài sản vô giá của mỗi người. Để nuôi dưỡng lòng trung thực, mỗi người hãy bắt đầu từ việc nhỏ: thật thà trong từng bài kiểm tra, từng lời hứa; gia đình, nhà trường khen thưởng sự trung thực thay vì chỉ chạy theo thành tích; pháp luật xử lí nghiêm hành vi gian dối. Hãy nhớ rằng: mất tiền có thể kiếm lại, mất niềm tin thì khó vô cùng. Sống trung thực hôm nay là đầu tư cho niềm tin ngày mai."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Tập thơ Nôm của Nguyễn Trãi có tên là gì?", "options": ["A. Ức Trai thi tập", "B. Quốc âm thi tập", "C. Truyện Kiều", "D. Chinh phụ ngâm"], "answer": "B", "points": 0.25, "explain": "Quốc âm thi tập là tập thơ Nôm của Nguyễn Trãi (gồm Bảo kính cảnh giới, Ngôn chí...); Ức Trai thi tập là thơ chữ Hán."}, {"type": "mcq", "level": "NB", "q": "Tác giả của truyện ngắn Dưới bóng hoàng lan là ai?", "options": ["A. Nguyễn Quang Sáng", "B. Thạch Lam", "C. Nam Cao", "D. Tô Hoài"], "answer": "B", "points": 0.25, "explain": "Dưới bóng hoàng lan là truyện ngắn của Thạch Lam — bậc thầy truyện ngắn về vẻ đẹp bình dị và tâm hồn con người."}, {"type": "mcq", "level": "TH", "q": "Câu nào sử dụng biện pháp chêm xen?", "options": ["A. Vườn nhà có na, ổi, hoàng lan.", "B. Thanh — chàng trai hiền hậu — lặng nhìn xa xăm.", "C. Thanh về quê thăm bà.", "D. Trời hôm nay đẹp quá!"], "answer": "B", "points": 0.25, "explain": "Câu B có phần chêm xen chàng trai hiền hậu đặt giữa hai dấu gạch ngang để bổ sung, nhấn mạnh đặc điểm nhân vật."}, {"type": "mcq", "level": "TH", "q": "Khi viết bài luận về bản thân, điều quan trọng nhất là gì?", "options": ["A. Viết thật dài", "B. Chân thành, trung thực với chính mình", "C. Khoe khoang thành tích", "D. Chép mẫu có sẵn"], "answer": "B", "points": 0.25, "explain": "Bài luận về bản thân đòi hỏi chân thành, trung thực — nhìn thẳng vào cả điểm mạnh và điểm yếu; tô vẽ hay chép mẫu đều làm mất giá trị bài viết."}, {"type": "mcq", "level": "VDC", "q": "Để đạt điểm cao phần viết trong bài kiểm tra, cần chú ý điều gì nhất?", "options": ["A. Viết càng dài càng tốt", "B. Đúng kiểu bài, đủ bố cục, luận điểm rõ, dẫn chứng thuyết phục, diễn đạt mạch lạc", "C. Chữ viết thật đẹp là đủ", "D. Chép dàn ý của bạn"], "answer": "B", "points": 0.25, "explain": "Bài viết điểm cao cần: đúng kiểu bài, đủ ba phần bố cục, luận điểm rõ ràng, dẫn chứng thuyết phục, diễn đạt mạch lạc, ít lỗi chính tả."}, {"type": "short", "level": "NB", "q": "Kể tên hai văn bản văn học trung đại được học trong học kì 2.", "answer": "Bình Ngô đại cáo và Bảo kính cảnh giới (hoặc Dục Thúy sơn, Ngôn chí)", "points": 0.5, "explain": "Các văn bản trung đại: Bình Ngô đại cáo (văn xuôi), Bảo kính cảnh giới, Dục Thúy sơn, Ngôn chí, Bạch Đằng hải khẩu (thơ)."}, {"type": "short", "level": "TH", "q": "Nêu hai tác dụng của biện pháp liệt kê.", "answer": "Diễn đạt đầy đủ, cụ thể; tạo nhịp điệu cho câu văn", "points": 0.5, "explain": "Liệt kê kể ra hàng loạt sự vật cùng loại giúp diễn đạt đầy đủ, cụ thể và tạo nhịp điệu, sức gợi cho lời văn."}, {"type": "short", "level": "VD", "q": "Nêu hai việc cần làm khi đọc xong một văn bản thông tin.", "answer": "Tóm tắt nội dung chính; đánh giá độ tin cậy của thông tin", "points": 0.5, "explain": "Sau khi đọc cần tóm tắt nội dung chính (bằng sơ đồ hoặc câu ngắn) và đánh giá độ tin cậy (số liệu, nguồn) trước khi sử dụng thông tin."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về ý nghĩa của việc ôn tập có hệ thống trước kì thi.", "points": 0, "explain": "DÀN Ý: Mở đoạn: ôn tập là khâu quan trọng. Thân đoạn: ôn có hệ thống (sơ đồ, bảng biểu) giúp nhớ lâu, thấy mối liên hệ, không bỏ sót; ôn vẹt, ôn tủ dễ thất bại; kinh nghiệm: chia nhỏ, ôn đều, luyện đề. Kết đoạn: quyết tâm. BÀI MẪU: Ôn tập có hệ thống là chìa khóa giúp em tự tin bước vào kì thi. Học kì 2 với bao nhiêu văn bản, tri thức ngữ văn, tiếng Việt và kiểu bài viết — nếu ôn vẹt, học tủ, ta dễ bị ngợp và bỏ sót. Ôn có hệ thống nghĩa là: vẽ sơ đồ tư duy cho từng bài, lập bảng so sánh các tri thức dễ nhầm (ngôi kể thứ nhất – thứ ba, chêm xen – liệt kê), tóm tắt mỗi văn bản bằng vài câu ngắn gọn. Cách ôn này giúp ta thấy được mối liên hệ giữa các kiến thức: tri thức ngữ văn là chìa khóa đọc hiểu văn bản, tiếng Việt phục vụ cho viết văn. Nhờ đó, kiến thức không còn là những mảnh rời rạc mà thành một hệ thống vững chắc, nhớ lâu và dễ vận dụng. Bên cạnh đó, cần ôn đều, chia nhỏ theo ngày thay vì dồn vào đêm trước thi; kết hợp ôn lí thuyết với luyện đề để quen với cách ra đề. Ôn tập có hệ thống không chỉ giúp điểm cao mà còn rèn cho ta phương pháp học tập khoa học — hành trang quý cho những chặng đường sau này."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề xã hội: Lòng nhân ái trong cuộc sống hôm nay.", "points": 0, "explain": "DÀN Ý: Mở bài: nhân ái là truyền thống quý; vấn đề: lòng nhân ái hôm nay. Thân bài: Giải thích: nhân ái là yêu thương, sẵn sàng giúp đỡ. Biểu hiện: giúp người khó khăn, hiến máu, từ thiện. Thực trạng: nhiều tấm gương; một bộ phận vô cảm, trục lợi từ thiện. Nguyên nhân: thực dụng, ích kỉ; mất niềm tin do vụ việc tiêu cực. Bàn luận: nhân ái làm xã hội ấm áp; cần tỉnh táo, giúp đúng cách. Dẫn chứng. Giải pháp: giáo dục, hành động từ việc nhỏ. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Từ ngàn xưa, dân tộc ta đã coi lòng nhân ái là đạo lí làm người: thương người như thể thương thân, lá lành đùm lá rách. Trong cuộc sống hôm nay, lòng nhân ái vẫn là ngọn lửa sưởi ấm tình người, cần được giữ gìn và lan tỏa. Nhân ái là tình yêu thương con người, là sự sẵn sàng chia sẻ, giúp đỡ những người gặp khó khăn, hoạn nạn mà không toan tính vụ lợi. Biểu hiện của lòng nhân ái rất đa dạng: giúp đỡ người nghèo, người già neo đơn; hiến máu cứu người; tham gia các chương trình từ thiện, tình nguyện; cứu giúp người gặp nạn. Thực tế có biết bao tấm gương sáng: những mạnh thường quân âm thầm giúp đỡ hàng nghìn hoàn cảnh; các bạn trẻ tình nguyện vùng cao; những người dũng cảm cứu người đuối nước. Thế nhưng, bên cạnh đó vẫn còn những biểu hiện đáng buồn: thờ ơ trước nỗi đau của người khác; thậm chí có kẻ trục lợi từ hoạt động từ thiện, làm mất niềm tin cộng đồng. Nguyên nhân một phần do lối sống thực dụng, ích kỉ; một phần do một số vụ việc tiêu cực khiến người ta e dè. Lòng nhân ái không chỉ giúp người được giúp vơi bớt khổ đau mà còn làm cho người cho đi cảm thấy hạnh phúc, xã hội trở nên ấm áp, gắn bó. Dĩ nhiên, nhân ái cũng cần tỉnh táo: giúp đúng người, đúng cách, tránh bị kẻ xấu lợi dụng. Mỗi chúng ta hãy bắt đầu từ những việc nhỏ: một lời động viên, một suất cơm từ thiện, một lần hiến máu. Gia đình và nhà trường cần giáo dục con em biết yêu thương, chia sẻ từ thuở nhỏ. Hãy để lòng nhân ái lan tỏa như ánh nắng mặt trời — sưởi ấm mọi tâm hồn và làm đẹp thêm cuộc đời này."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Văn bản Sự sống và cái chết của Trịnh Xuân Thuận viết về vấn đề gì?", "options": ["A. Cuộc đời tác giả", "B. Vòng đời của các vì sao và quy luật sống – chết trong vũ trụ", "C. Ô nhiễm môi trường", "D. Cách ngắm sao"], "answer": "B", "points": 0.25, "explain": "Văn bản giới thiệu vòng đời các vì sao rồi mở rộng thành suy ngẫm triết lí về quy luật sống – chết trong vũ trụ."}, {"type": "mcq", "level": "NB", "q": "Tác giả của văn bản Một đời như kẻ tìm đường là ai?", "options": ["A. Carlo Rovelli", "B. Phan Văn Trường", "C. Robert Frost", "D. Nguyễn Văn Thạc"], "answer": "B", "points": 0.25, "explain": "Một đời như kẻ tìm đường của Phan Văn Trường — chuyên gia đàm phán quốc tế, trích từ cuốn sách cùng tên."}, {"type": "mcq", "level": "TH", "q": "Giọng điệu chủ đạo của truyện Dưới bóng hoàng lan là gì?", "options": ["A. Hài hước", "B. Nhẹ nhàng, man mác buồn, giàu chất thơ", "C. Hùng hồn", "D. Gay gắt"], "answer": "B", "points": 0.25, "explain": "Truyện Thạch Lam có giọng văn nhẹ nhàng, man mác buồn, giàu chất thơ — phù hợp diễn tả rung động tinh tế của tâm hồn."}, {"type": "mcq", "level": "TH", "q": "Trong bài văn nghị luận xã hội, phần thân bài KHÔNG bao gồm nội dung nào?", "options": ["A. Giải thích, phân tích thực trạng – nguyên nhân – hậu quả", "B. Dẫn chứng và giải pháp", "C. Kể lại toàn bộ cốt truyện một tác phẩm văn học", "D. Bình luận, đánh giá"], "answer": "C", "points": 0.25, "explain": "Thân bài nghị luận xã hội gồm giải thích, phân tích, bình luận, dẫn chứng, giải pháp. Kể cốt truyện tác phẩm không thuộc kiểu bài này."}, {"type": "mcq", "level": "VDC", "q": "Vì sao nói tri thức ngữ văn là chìa khóa đọc hiểu văn bản?", "options": ["A. Vì học thuộc tri thức là đủ điểm", "B. Vì nắm thể loại, phương thức biểu đạt giúp ta biết cần tìm gì trong văn bản và phân tích đúng hướng", "C. Vì tri thức thay thế được văn bản", "D. Vì không cần đọc văn bản nữa"], "answer": "B", "points": 0.25, "explain": "Nắm tri thức thể loại giúp định hướng đọc: đọc truyện thì tìm ngôi kể, tâm lí; đọc thơ thì tìm hình tượng; đọc văn bản thông tin thì tìm thông tin cơ bản — đọc đúng hướng, sâu sắc."}, {"type": "short", "level": "NB", "q": "Kể tên hai văn bản viết về thiên nhiên, môi trường trong học kì 2.", "answer": "Phục hồi tầng ozone và Tính cách của cây (hoặc Sự sống và cái chết)", "points": 0.5, "explain": "Các văn bản về thiên nhiên, môi trường: Phục hồi tầng ozone (môi trường), Tính cách của cây (rừng), Sự sống và cái chết (vũ trụ)."}, {"type": "short", "level": "TH", "q": "Nêu hai biểu hiện của tính khách quan trong văn bản thông tin.", "answer": "Dùng số liệu, dẫn chứng kiểm chứng được; hạn chế cảm xúc chủ quan", "points": 0.5, "explain": "Tính khách quan thể hiện qua số liệu, sự kiện kiểm chứng được và việc hạn chế đưa cảm xúc, ý kiến chủ quan áp đặt vào thông tin."}, {"type": "short", "level": "VD", "q": "Nêu hai bước quan trọng nhất khi làm bài văn nghị luận trong phòng thi.", "answer": "Lập dàn ý trước khi viết; đọc lại, sửa lỗi trước khi nộp", "points": 0.5, "explain": "Lập dàn ý (5–7 phút) giúp bài viết đủ ý, mạch lạc, không lan man; đọc lại giúp sửa lỗi chính tả, diễn đạt, bổ sung ý thiếu."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về câu nói: Tri thức là sức mạnh.", "points": 0, "explain": "DÀN Ý: Mở đoạn: giải thích câu nói. Thân đoạn: tri thức giúp hiểu vũ trụ, văn hóa, giải quyết vấn đề môi trường; người có tri thức làm chủ cuộc sống; phê phán coi thường học hành. Kết đoạn: nỗ lực học tập. BÀI MẪU: Câu nói Tri thức là sức mạnh đã được minh chứng qua chính các văn bản học kì 2. Nhờ tri thức thiên văn, con người hiểu được vòng đời các vì sao và vị trí của mình trong vũ trụ; nhờ tri thức văn hóa, ta biết trân trọng di sản cha ông; đặc biệt, nhờ tri thức khoa học về tầng ozone, nhân loại đã tìm ra nguyên nhân lỗ thủng và giải pháp khắc phục — biến điều tưởng chừng không thể thành hiện thực. Tri thức cho con người sức mạnh để cải tạo thế giới: người có tri thức sẽ có lựa chọn đúng đắn, không bị mê tín, tin giả dẫn dắt; trong học tập, ai chăm chỉ tích lũy tri thức người đó có tương lai rộng mở. Ngược lại, thiếu tri thức, con người dễ trở thành nạn nhân của sự dốt nát và bị động. Đáng tiếc, một số bạn còn coi thường việc học, cho rằng học nhiều không bằng quan hệ. Đó là quan niệm sai lầm: trong thời đại tri thức, chỉ có học vấn thực sự mới là hành trang vững chắc. Hãy biến mỗi ngày đến trường thành một ngày tích lũy sức mạnh — sức mạnh của tri thức."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề xã hội: Ý thức bảo vệ môi trường của học sinh.", "points": 0, "explain": "DÀN Ý: Mở bài: môi trường bị đe dọa; trách nhiệm học sinh. Thân bài: Giải thích. Thực trạng: nhiều bạn ý thức tốt; một bộ phận xả rác, lãng phí. Nguyên nhân: ý thức kém, thói quen xấu, thiếu giáo dục. Hậu quả: ô nhiễm, biến đổi khí hậu. Giải pháp: việc nhỏ mỗi ngày; nhà trường tổ chức hoạt động; xử phạt. Kết bài: kêu gọi. BÀI MẪU: Môi trường sống của chúng ta đang từng ngày bị đe dọa: không khí ô nhiễm, nguồn nước cạn kiệt, rác thải bủa vây khắp nơi. Trong bối cảnh ấy, ý thức bảo vệ môi trường của mỗi người, đặc biệt là học sinh — những chủ nhân tương lai của đất nước — trở thành vấn đề cấp thiết. Bảo vệ môi trường là những hành động thiết thực giữ gìn không khí trong lành, nguồn nước sạch, cây xanh và cảnh quan xung quanh. Đáng mừng là nhiều bạn học sinh đã có ý thức tốt: tích cực tham gia trồng cây, ngày Chủ nhật xanh, phân loại rác tại nguồn, tiết kiệm điện nước trong sinh hoạt. Tuy nhiên, bên cạnh đó vẫn còn không ít bạn xả rác bừa bãi trong sân trường, khắc vẽ lên bàn ghế, cây xanh; lãng phí giấy, điện, nước; thờ ơ trước các hoạt động vì môi trường. Nguyên nhân một phần do ý thức chưa cao, thói quen xấu từ nhỏ; một phần do công tác giáo dục, tuyên truyền chưa thường xuyên và thiếu chế tài xử lí nghiêm. Hậu quả thì ai cũng thấy: trường học, đường phố ngập rác; không khí ngột ngạt; lâu dài là biến đổi khí hậu đe dọa chính cuộc sống của chúng ta. Để thay đổi, mỗi học sinh hãy bắt đầu từ những việc nhỏ nhất: bỏ rác đúng nơi quy định, hạn chế đồ nhựa dùng một lần, tiết kiệm điện nước, chăm sóc cây xanh. Nhà trường cần tổ chức thường xuyên các hoạt động ngoại khóa về môi trường; gia đình làm gương cho con em. Bảo vệ môi trường không phải là việc của riêng ai. Nếu mỗi học sinh đều hành động từ hôm nay, chúng ta sẽ có một môi trường xanh – sạch – đẹp cho hôm nay và cho cả mai sau."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Dòng nào nêu đúng các bài học của học kì 2 môn Ngữ văn 10 (Kết nối tri thức)?", "options": ["A. Bài 6, 7, 8, 9", "B. Bài 1, 2, 3, 4", "C. Bài 5, 6, 7, 8", "D. Bài 9, 10, 11, 12"], "answer": "A", "points": 0.25, "explain": "Học kì 2 (Tập 2) gồm: Bài 6 (Nguyễn Trãi), Bài 7 (Quyền năng của người kể chuyện), Bài 8 (Thế giới đa dạng của thông tin), Bài 9 (Hành trang cuộc sống)."}, {"type": "mcq", "level": "NB", "q": "Nhân vật Gia-ve trong Người cầm quyền khôi phục uy quyền là ai?", "options": ["A. Viên cảnh sát đại diện pháp luật máy móc", "B. Bạn của Giăng Van-giăng", "C. Con gái Phăng-tin", "D. Người nông dân"], "answer": "A", "points": 0.25, "explain": "Gia-ve là viên cảnh sát truy bắt Giăng Van-giăng, đại diện cho pháp luật máy móc, tàn nhẫn — tương phản với lòng nhân ái."}, {"type": "mcq", "level": "TH", "q": "Hai câu kết bài Bảo kính cảnh giới (bài 43) thể hiện tấm lòng nào của Nguyễn Trãi?", "options": ["A. Căm thù giặc", "B. Ưu dân, mong dân giàu nước mạnh", "C. Buồn vì công danh", "D. Muốn ẩn dật"], "answer": "B", "points": 0.25, "explain": "Hai câu kết mượn điển cố đàn vua Thuấn, khúc Nam phong bày tỏ ước mong dân giàu đủ — tấm lòng ưu dân tha thiết."}, {"type": "mcq", "level": "TH", "q": "Sơ đồ, biểu đồ trong văn bản thông tin có ưu điểm gì so với lời văn thuần túy?", "options": ["A. Dài hơn", "B. Trực quan, cô đọng, dễ so sánh và ghi nhớ", "C. Khó hiểu hơn", "D. Không có ưu điểm"], "answer": "B", "points": 0.25, "explain": "Sơ đồ, biểu đồ trình bày thông tin trực quan, cô đọng, có hệ thống — giúp dễ so sánh, dễ ghi nhớ hơn lời văn thuần túy."}, {"type": "mcq", "level": "VDC", "q": "Khi đề yêu cầu viết bài luận về bản thân nhưng em thấy khó viết về điểm yếu, nên làm gì?", "options": ["A. Bỏ qua điểm yếu, chỉ viết điểm mạnh", "B. Trung thực nhìn nhận 1–2 điểm yếu, nêu nguyên nhân và hướng khắc phục — đó chính là sự trưởng thành", "C. Bịa ra điểm yếu cho có", "D. Chép của bạn"], "answer": "B", "points": 0.25, "explain": "Dũng cảm nhìn nhận điểm yếu kèm nguyên nhân và hướng khắc phục thể hiện sự trung thực và trưởng thành — đó là điểm cộng lớn của bài luận về bản thân."}, {"type": "short", "level": "NB", "q": "Kể tên hai nhà thơ có tác phẩm trong chương trình học kì 2.", "answer": "Nguyễn Trãi và R. Frost", "points": 0.5, "explain": "Hai nhà thơ: Nguyễn Trãi (Bảo kính cảnh giới, Dục Thúy sơn, Ngôn chí...) và Rô-bớt Phờ-rót (Con đường không chọn)."}, {"type": "short", "level": "TH", "q": "Nêu hai nội dung chính của phần thân bài trong văn bản nghị luận về một vấn đề xã hội.", "answer": "Phân tích thực trạng – nguyên nhân – hậu quả; bàn luận, đánh giá và đề xuất giải pháp", "points": 0.5, "explain": "Thân bài nghị luận xã hội gồm: giải thích vấn đề; phân tích thực trạng – nguyên nhân – hậu quả; bình luận, đánh giá; dẫn chứng; đề xuất giải pháp."}, {"type": "short", "level": "VD", "q": "Vì sao không nên học tủ, học vẹt trước kì thi?", "answer": "Vì dễ bỏ sót, không hiểu bản chất; gặp đề lạ sẽ lúng túng", "points": 0.5, "explain": "Học tủ, học vẹt khiến kiến thức rời rạc, không hiểu bản chất; khi đề ra theo hướng khác sẽ lúng túng, không vận dụng được."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về tình bạn tuổi học trò.", "points": 0, "explain": "DÀN Ý: Mở đoạn: tình bạn đẹp của tuổi học trò. Thân đoạn: biểu hiện (chân thành, giúp nhau tiến bộ); phê phán tình bạn vụ lợi, bè phái; liên hệ. Kết đoạn: trân trọng. BÀI MẪU: Tình bạn tuổi học trò là một trong những tình cảm đẹp đẽ nhất của đời người. Đó là thứ tình cảm vô tư, không toan tính: cùng chia sẻ niềm vui, nỗi buồn; cùng giúp nhau trong học tập; cùng mơ ước về tương lai. Một tình bạn đẹp được xây nên bằng sự chân thành và tôn trọng: bạn tốt là người dám nói thẳng khi ta sai, là người động viên khi ta nản, là người vui với thành công của ta mà không ghen tị. Đáng tiếc, quanh ta vẫn có những biểu hiện làm xấu đi tình bạn: chơi với nhau vì vụ lợi, bè phái tẩy chay, thậm chí lôi kéo nhau vào thói hư. Những thứ đó không phải tình bạn mà chỉ là sự lợi dụng. Tuổi học trò trôi qua nhanh lắm — hãy trân trọng từng người bạn tốt, vun đắp tình bạn bằng sự chân thành, để mai này nhìn lại, ta có thể mỉm cười vì những năm tháng đẹp đẽ ấy."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề xã hội: Lòng biết ơn – đạo lí cần giữ gìn.", "points": 0, "explain": "DÀN Ý: Mở bài: đạo lí uống nước nhớ nguồn. Thân bài: Giải thích. Biểu hiện: biết ơn cha mẹ, thầy cô, anh hùng liệt sĩ. Thực trạng: nhiều bạn sống có hiếu; một bộ phận vô cảm. Nguyên nhân: thực dụng, thiếu giáo dục. Bàn luận: biết ơn là nền tảng đạo đức; thể hiện bằng hành động. Dẫn chứng. Giải pháp. Kết bài: kêu gọi. BÀI MẪU: Dân tộc ta có đạo lí tốt đẹp: uống nước nhớ nguồn, ăn quả nhớ kẻ trồng cây. Lòng biết ơn — tình cảm thiêng liêng ấy — cần được mỗi người, nhất là thế hệ trẻ, giữ gìn và phát huy. Biết ơn là ghi nhớ công ơn của người khác đối với mình và tìm cách đền đáp xứng đáng. Đó là biết ơn cha mẹ đã sinh thành, dưỡng dục; biết ơn thầy cô đã dạy dỗ nên người; biết ơn các anh hùng liệt sĩ đã hi sinh xương máu cho độc lập hôm nay. Thực tế đáng mừng là nhiều bạn trẻ sống rất có hiếu: chăm sóc cha mẹ, tri ân thầy cô; các phong trào đền ơn đáp nghĩa, thắp nến tri ân được hưởng ứng rộng rãi. Thế nhưng, vẫn còn một bộ phận sống vô cảm: coi sự hi sinh của người khác là đương nhiên; thờ ơ trước ngày lễ tri ân. Nguyên nhân sâu xa là lối sống thực dụng, ích kỉ và giáo dục đạo lí có lúc còn hình thức. Lòng biết ơn không chỉ là tình cảm mà còn là nền tảng đạo đức, gắn kết con người với nhau. Biết ơn phải thể hiện bằng hành động cụ thể: một lời cảm ơn chân thành, sự quan tâm chăm sóc cha mẹ hằng ngày, nỗ lực học tập để không phụ công thầy cô. Mỗi chúng ta hãy tự hỏi mỗi ngày: hôm nay mình đã nói lời cảm ơn với ai? Sống có lòng biết ơn, ta sẽ thấy cuộc đời ý nghĩa hơn và xứng đáng với đạo lí ngàn đời của dân tộc."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Bình Ngô đại cáo ra đời năm nào?", "options": ["A. 1400", "B. 1418", "C. 1428", "D. 1442"], "answer": "C", "points": 0.25, "explain": "Đầu năm 1428, sau khi đánh tan quân Minh, Nguyễn Trãi thay lời Lê Lợi viết Bình Ngô đại cáo tuyên bố độc lập."}, {"type": "mcq", "level": "NB", "q": "Chi tiết nào là nút thắt tâm lí trong Một chuyện đùa nho nhỏ?", "options": ["A. Chiếc xe trượt tuyết", "B. Câu nói anh yêu em thì thầm trong gió", "C. Ngôi nhà của Na-đi-a", "D. Bữa tiệc"], "answer": "B", "points": 0.25, "explain": "Câu nói anh yêu em lẫn trong tiếng gió là nút thắt tâm lí: Na-đi-a bán tín bán nghi, day dứt khôn nguôi suốt nhiều năm."}, {"type": "mcq", "level": "TH", "q": "Vì sao văn bản nội quy thường dùng ngôn ngữ mệnh lệnh?", "options": ["A. Để dọa nạt", "B. Để người đọc hiểu rõ điều phải làm / không được làm, dễ thực hiện", "C. Để văn bản hay hơn", "D. Không có lí do"], "answer": "B", "points": 0.25, "explain": "Ngôn ngữ mệnh lệnh (phải, cấm, nên, không nên) giúp quy định rõ ràng, dứt khoát — người đọc biết chính xác phải làm gì."}, {"type": "mcq", "level": "TH", "q": "Theo C. Rovelli, điểm chung của vạn vật (giọt mưa, tia sáng, DNA...) là gì?", "options": ["A. Đều biết nói", "B. Đều chứa thông tin", "C. Đều do con người tạo ra", "D. Đều vô tri"], "answer": "B", "points": 0.25, "explain": "Mọi sự vật đều chứa thông tin: giọt mưa về đám mây, tia sáng về màu sắc, DNA về mã di truyền... — đó là góc nhìn mới về thế giới."}, {"type": "mcq", "level": "VDC", "q": "Một bài làm văn đạt điểm cao cần tránh điều gì nhất?", "options": ["A. Lạc đề, thiếu bố cục, không có dẫn chứng", "B. Chữ viết đẹp", "C. Dẫn chứng phong phú", "D. Lập dàn ý"], "answer": "A", "points": 0.25, "explain": "Lạc đề là lỗi nghiêm trọng nhất; tiếp đến là thiếu bố cục ba phần và không có dẫn chứng — ba lỗi này khiến bài văn mất điểm nặng."}, {"type": "short", "level": "NB", "q": "Kể tên hai truyện ngắn Việt Nam được học trong học kì 2.", "answer": "Dưới bóng hoàng lan và Con khướu sổ lồng", "points": 0.5, "explain": "Hai truyện ngắn Việt Nam: Dưới bóng hoàng lan (Thạch Lam) và Con khướu sổ lồng (Nguyễn Quang Sáng)."}, {"type": "short", "level": "TH", "q": "Nêu hai yêu cầu đối với dẫn chứng trong bài văn nghị luận.", "answer": "Cụ thể, tiêu biểu; cập nhật, xác đáng; gắn với luận điểm", "points": 0.5, "explain": "Dẫn chứng phải cụ thể, tiêu biểu, cập nhật, xác đáng và gắn chặt với luận điểm thì mới có sức thuyết phục."}, {"type": "short", "level": "VD", "q": "Vì sao khi tóm tắt văn bản nên dùng sơ đồ tư duy?", "answer": "Vì trực quan, thể hiện rõ thông tin chính và mối quan hệ, dễ nhớ", "points": 0.5, "explain": "Sơ đồ tư duy thể hiện trực quan thông tin chính và mối quan hệ giữa chúng bằng hình ảnh, màu sắc — dễ nhớ, dễ hệ thống hơn chữ viết thuần túy."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về ý nghĩa của lao động đối với tuổi trẻ.", "points": 0, "explain": "DÀN Ý: Mở đoạn: giá trị của lao động. Thân đoạn: lao động tạo ra của cải, rèn ý chí, mang lại niềm vui; phê phán lười biếng, ỷ lại; dẫn chứng. Kết đoạn: coi trọng lao động. BÀI MẪU: Lao động là hoạt động cao quý nhất của con người — nó tạo ra của cải vật chất, rèn luyện ý chí và mang lại niềm vui, ý nghĩa cho cuộc sống. Với tuổi trẻ, lao động (học tập cũng là một dạng lao động trí óc) giúp ta trưởng thành: mỗi bài toán giải được, mỗi kĩ năng học được đều là thành quả của sự nỗ lực. Lao động còn dạy ta biết quý trọng thành quả, biết chia sẻ: những bạn tham gia tình nguyện, làm thêm giúp đỡ gia đình đều trưởng thành hơn rất nhiều. Đáng tiếc, một số bạn lười biếng, ỷ lại, chỉ biết hưởng thụ thành quả của cha mẹ — đó là lối sống đáng phê phán, khiến con người trở nên vô dụng. Cần nhớ rằng không có thành công nào không đánh đổi bằng mồ hôi: từ người nông dân đến nhà khoa học, ai cũng phải lao động miệt mài. Tuổi trẻ hãy coi trọng lao động: học tập chăm chỉ hôm nay chính là lao động cho tương lai; tham gia lao động tập thể để rèn kĩ năng và tinh thần trách nhiệm. Lao động không chỉ nuôi sống ta mà còn làm cho cuộc đời ta có ý nghĩa."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề xã hội: Tình yêu thương gia đình – điểm tựa của mỗi người.", "points": 0, "explain": "DÀN Ý: Mở bài: gia đình là điểm tựa thiêng liêng. Thân bài: Giải thích. Biểu hiện: cha mẹ hi sinh; con cái hiếu thảo; anh em đùm bọc. Thực trạng: nhiều gia đình hạnh phúc; một bộ phận rạn nứt. Nguyên nhân: áp lực, thiếu quan tâm. Hậu quả: con cái thiếu điểm tựa. Bàn luận: vun đắp mỗi ngày. Dẫn chứng. Giải pháp. Kết bài: nhắn nhủ. BÀI MẪU: Gia đình là tế bào của xã hội, là điểm tựa thiêng liêng nhất của mỗi con người trên đường đời. Tình yêu thương gia đình là sự gắn bó máu thịt, là lòng hiếu thảo của con cái, sự hi sinh của cha mẹ và tình đùm bọc của anh em — thứ tình cảm không gì thay thế được. Trong gia đình hạnh phúc, cha mẹ tần tảo hi sinh vì con; con cái hiếu thảo, chăm ngoan; anh em yêu thương đùm bọc nhau. Chính không khí ấm áp ấy nuôi dưỡng tâm hồn ta, tiếp thêm sức mạnh mỗi khi vấp ngã. Thực tế có biết bao gia đình là tấm gương: cha mẹ nghèo vẫn nuôi con ăn học thành tài; con cái thành đạt không quên báo hiếu. Thế nhưng, cũng có những gia đình rạn nứt: con cái bất hiếu, hỗn láo; bạo lực gia đình; cha mẹ mải kiếm tiền bỏ bê con cái khiến con sa ngã. Nguyên nhân là áp lực cuộc sống, sự thiếu quan tâm chia sẻ và ảnh hưởng của lối sống thực dụng. Hậu quả là trẻ thiếu điểm tựa tinh thần, dễ sa vào tệ nạn; xã hội thêm bất ổn. Gia đình chính là hành trang tinh thần quý giá nhất mà mỗi người mang theo suốt đời. Vì vậy, mỗi thành viên hãy vun đắp gia đình mỗi ngày: một bữa cơm sum họp, một lời hỏi thăm, sự chia sẻ việc nhà, lòng hiếu thảo với ông bà cha mẹ. Đừng để đến khi mất đi mới hối tiếc. Hãy yêu thương gia đình khi còn có thể — bởi đó là điểm tựa vững chắc nhất cho ta bước vào đời."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Dòng nào nêu đúng các kiểu bài viết của học kì 2?", "options": ["A. Nghị luận xã hội – nghị luận tác phẩm truyện – nội quy/hướng dẫn – luận về bản thân", "B. Tả cảnh – kể chuyện – biểu cảm", "C. Thuyết minh – tự sự – trữ tình", "D. Đơn xin việc – sơ yếu lí lịch"], "answer": "A", "points": 0.25, "explain": "Bốn kiểu bài viết HK2: nghị luận về một vấn đề xã hội (b.6), nghị luận về tác phẩm truyện (b.7), văn bản nội quy/hướng dẫn (b.8), bài luận về bản thân (b.9)."}, {"type": "mcq", "level": "NB", "q": "Hình ảnh cây hoàng lan trong truyện của Thạch Lam là biểu tượng của điều gì?", "options": ["A. Sự giàu sang", "B. Quê hương, tình yêu trong sáng, vẻ đẹp bình dị", "C. Nỗi sợ hãi", "D. Chiến tranh"], "answer": "B", "points": 0.25, "explain": "Cây hoàng lan là hình tượng trung tâm: biểu tượng của quê hương, tình yêu trong sáng Thanh – Nga và vẻ đẹp bình dị, thơm thảo."}, {"type": "mcq", "level": "TH", "q": "Vì sao Bình Ngô đại cáo được gọi là thiên cổ hùng văn?", "options": ["A. Vì rất dài", "B. Vì là áng văn hùng tráng, có giá trị muôn đời về tư tưởng và nghệ thuật", "C. Vì khó hiểu", "D. Vì viết bằng chữ Nôm"], "answer": "B", "points": 0.25, "explain": "Thiên cổ hùng văn nghĩa là áng văn hùng tráng còn mãi với nghìn đời — ca ngợi giá trị tư tưởng (nhân nghĩa, độc lập) và nghệ thuật (biền ngẫu hùng hồn)."}, {"type": "mcq", "level": "TH", "q": "Khi đề văn yêu cầu thảo luận nhóm, điều quan trọng nhất là gì?", "options": ["A. Nói thật to", "B. Lắng nghe, tôn trọng ý kiến bạn và bảo vệ quan điểm bằng lí lẽ, dẫn chứng", "C. Im lặng hoàn toàn", "D. Nói theo số đông"], "answer": "B", "points": 0.25, "explain": "Thảo luận hiệu quả cần: lắng nghe, tôn trọng ý kiến khác nhau; trình bày quan điểm của mình bằng lí lẽ, dẫn chứng thuyết phục; cùng đi đến thống nhất."}, {"type": "mcq", "level": "VDC", "q": "Mối liên hệ giữa các bài học trong học kì 2 thể hiện qua điều gì?", "options": ["A. Không liên hệ gì", "B. Cùng bồi đắp cho người học: tri thức – kĩ năng tiếng Việt – kĩ năng viết, tất cả hướng tới việc đọc hiểu sâu và diễn đạt tốt", "C. Chỉ để đủ số tiết", "D. Các bài mâu thuẫn nhau"], "answer": "B", "points": 0.25, "explain": "Các bài liên hệ chặt chẽ: tri thức ngữ văn là chìa khóa đọc hiểu; tiếng Việt rèn diễn đạt; kiểu bài viết vận dụng tổng hợp — cùng hướng tới năng lực đọc hiểu và viết."}, {"type": "short", "level": "NB", "q": "Kể tên hai văn bản thể hiện lòng yêu nước trong chương trình học kì 2.", "answer": "Bình Ngô đại cáo và Bạch Đằng hải khẩu (hoặc Mãi mãi tuổi hai mươi)", "points": 0.5, "explain": "Bình Ngô đại cáo (tuyên ngôn độc lập), Bạch Đằng hải khẩu (tự hào truyền thống chống ngoại xâm), Mãi mãi tuổi hai mươi (hi sinh vì Tổ quốc) đều thể hiện lòng yêu nước."}, {"type": "short", "level": "TH", "q": "Nêu hai nội dung cần ôn tập về tiếng Việt trước kì thi học kì 2.", "answer": "Từ Hán Việt; biện pháp chêm xen, liệt kê; phương tiện phi ngôn ngữ (nêu hai)", "points": 0.5, "explain": "Tiếng Việt HK2: sử dụng từ Hán Việt (b.6); biện pháp chêm xen, liệt kê (b.7); sử dụng phương tiện phi ngôn ngữ (b.8, 9)."}, {"type": "short", "level": "VD", "q": "Nêu hai lợi ích của việc lập dàn ý trước khi viết bài văn.", "answer": "Giúp bài đủ ý, mạch lạc, không lan man; tiết kiệm thời gian, tránh bỏ sót", "points": 0.5, "explain": "Lập dàn ý giúp sắp xếp ý mạch lạc, đảm bảo đủ ý, không lan man; tiết kiệm thời gian viết và tránh bỏ sót luận điểm quan trọng."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về vai trò của người thầy trong cuộc đời mỗi học sinh.", "points": 0, "explain": "DÀN Ý: Mở đoạn: công ơn thầy cô. Thân đoạn: thầy cô truyền tri thức, dạy làm người; dẫn dắt, động viên lúc khó khăn; dẫn chứng (tấm gương trò nhớ ơn thầy); phê phán vô ơn. Kết đoạn: biết ơn, đền đáp. BÀI MẪU: Trong cuộc đời mỗi học sinh, người thầy có vai trò vô cùng to lớn — không chỉ truyền tri thức mà còn dạy ta cách làm người. Thầy cô là người thắp sáng ước mơ: bao thế hệ học trò đã tìm thấy hướng đi nhờ một lời khuyên của thầy; là người nâng đỡ khi ta vấp ngã: lời động viên đúng lúc có thể vực dậy một học sinh nản chí; là tấm gương về đạo đức, lối sống để ta noi theo. Không thầy đố mày làm nên — mọi thành công của ta đều in dấu công sức thầy cô. Đáng buồn là một số bạn vô ơn, hỗn láo với thầy cô; đó là biểu hiện suy đồi đạo đức cần phê phán. Biết ơn thầy cô không cần điều gì lớn lao: một lời chào lễ phép, một giờ học nghiêm túc, nỗ lực học tập để không phụ công dạy dỗ — đó là món quà ý nghĩa nhất. Mai này dù đi đâu, hãy nhớ về mái trường, nhớ về thầy cô với lòng biết ơn sâu sắc nhất."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề xã hội: Rèn luyện sức khỏe – hành trang không thể thiếu của tuổi trẻ.", "points": 0, "explain": "DÀN Ý: Mở bài: vai trò của sức khỏe; vấn đề: nhiều bạn trẻ lơ là rèn luyện. Thân bài: Giải thích: sức khỏe là vốn quý nhất. Thực trạng: nhiều bạn chăm tập thể thao; một bộ phận lười vận động, nghiện game, thức khuya, ăn uống thiếu khoa học. Nguyên nhân: mải học, mải chơi; thiếu ý thức; thiếu sân chơi. Hậu quả: thể lực yếu, bệnh tật, học tập kém. Bàn luận: có sức khỏe mới thực hiện được ước mơ; cân bằng học – chơi – rèn luyện. Dẫn chứng: Bác Hồ rèn luyện; các tấm gương. Giải pháp: tập thể dục mỗi ngày; ăn uống khoa học; ngủ đủ giấc; nhà trường tổ chức hoạt động. Kết bài: kêu gọi. BÀI MẪU: Người xưa có câu: có sức khỏe là có tất cả. Với tuổi trẻ — lứa tuổi của ước mơ và khát vọng — sức khỏe càng là hành trang không thể thiếu để biến ước mơ thành hiện thực. Sức khỏe là vốn quý nhất của con người: có sức khỏe ta mới học tập tốt, làm việc hiệu quả và tận hưởng cuộc sống. Đáng mừng là nhiều bạn trẻ đã ý thức rèn luyện: chạy bộ mỗi sáng, chơi thể thao, tham gia câu lạc bộ võ thuật, bơi lội. Thế nhưng, vẫn còn không ít bạn lơ là: lười vận động, nghiện game ngồi lì hàng giờ; thức khuya triền miên; ăn uống thiếu khoa học, lạm dụng đồ ăn nhanh. Nguyên nhân một phần do mải học, mải chơi; một phần do thiếu ý thức và thiếu sân chơi lành mạnh. Hậu quả là thể lực yếu, dễ ốm đau, học tập sa sút; lâu dài ảnh hưởng cả tương lai. Cần nhớ rằng trí tuệ minh mẫn chỉ có trong cơ thể khỏe mạnh; mọi ước mơ lớn lao đều cần một cơ thể dẻo dai để thực hiện — như Bác Hồ dù bận trăm công nghìn việc vẫn kiên trì rèn luyện thân thể. Để có sức khỏe tốt, mỗi bạn hãy: dành ít nhất 30 phút vận động mỗi ngày; ăn uống đủ chất, hạn chế đồ ăn nhanh; ngủ đủ 7–8 tiếng, tránh thức khuya; nhà trường tổ chức thêm hoạt động thể thao. Đừng đợi đến khi ốm đau mới tiếc sức khỏe. Hãy rèn luyện từ hôm nay — vì một tuổi trẻ khỏe mạnh là tiền đề cho mọi thành công mai sau."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Ôn tập học kì 2 bao gồm những bài nào?", "options": ["A. Bài 6, 7, 8, 9", "B. Bài 1, 2, 3, 4", "C. Bài 6, 7", "D. Bài 8, 9"], "answer": "A", "points": 0.25, "explain": "Ôn tập học kì 2 hệ thống hóa kiến thức 4 bài của Tập 2: Bài 6, 7, 8, 9."}, {"type": "mcq", "level": "NB", "q": "Tác phẩm nào sau đây là nhật kí?", "options": ["A. Mãi mãi tuổi hai mươi", "B. Dưới bóng hoàng lan", "C. Bình Ngô đại cáo", "D. Con đường không chọn"], "answer": "A", "points": 0.25, "explain": "Mãi mãi tuổi hai mươi là nhật kí của liệt sĩ Nguyễn Văn Thạc — ghi lại suy nghĩ, tình cảm chân thực của chàng sinh viên ra trận."}, {"type": "mcq", "level": "TH", "q": "Để làm tốt câu hỏi đọc hiểu ở mức vận dụng cao, cần làm gì?", "options": ["A. Chép nguyên văn bản", "B. Đưa ra ý kiến, đánh giá của bản thân có căn cứ từ văn bản và liên hệ thực tế", "C. Bỏ qua không làm", "D. Viết thật dài"], "answer": "B", "points": 0.25, "explain": "Câu vận dụng cao đòi hỏi ý kiến, đánh giá, liên hệ của bản thân — nhưng phải có căn cứ từ văn bản, lập luận thuyết phục, không nói chung chung."}, {"type": "mcq", "level": "TH", "q": "Trong các bước làm bài văn, bước nào quan trọng nhất?", "options": ["A. Trang trí bài viết", "B. Tìm hiểu đề, lập dàn ý", "C. Viết thật nhanh", "D. Đếm số chữ"], "answer": "B", "points": 0.25, "explain": "Tìm hiểu kĩ đề và lập dàn ý là bước quan trọng nhất: giúp xác định đúng yêu cầu, sắp xếp ý mạch lạc, tránh lạc đề, thiếu ý."}, {"type": "mcq", "level": "VDC", "q": "Thông điệp chung mà chương trình Ngữ văn 10 gửi gắm là gì?", "options": ["A. Chỉ cần học để thi", "B. Bồi dưỡng tâm hồn, trí tuệ: yêu nước, nhân ái, hiểu mình, sống có lí tưởng và có trách nhiệm", "C. Văn chương không có ích gì", "D. Chỉ học văn để viết hay"], "answer": "B", "points": 0.25, "explain": "Ngữ văn 10 bồi dưỡng toàn diện: lòng yêu nước (b.6), tình người (b.7), tri thức khoa học (b.8), hành trang sống đẹp (b.9) — hướng tới con người phát triển hài hòa."}, {"type": "short", "level": "NB", "q": "Nêu tên hai tác phẩm văn học nước ngoài được học trong học kì 2.", "answer": "Người cầm quyền khôi phục uy quyền và Một chuyện đùa nho nhỏ (hoặc Con đường không chọn)", "points": 0.5, "explain": "Các tác phẩm nước ngoài: Người cầm quyền khôi phục uy quyền (Hugo, Pháp), Một chuyện đùa nho nhỏ (Chekhov, Nga), Con đường không chọn (Frost, Mỹ), Về chính chúng ta (Rovelli, Ý)."}, {"type": "short", "level": "TH", "q": "Nêu hai việc nên làm trong 5 phút đầu khi nhận đề thi Ngữ văn.", "answer": "Đọc kĩ toàn bộ đề; phân bổ thời gian cho từng câu", "points": 0.5, "explain": "5 phút đầu: đọc kĩ toàn bộ đề để nắm yêu cầu, mức độ khó; phân bổ thời gian hợp lí cho từng câu, ưu tiên phần viết vì điểm cao."}, {"type": "short", "level": "VD", "q": "Nêu hai biểu hiện của việc học tập có phương pháp khoa học.", "answer": "Ôn theo sơ đồ, hệ thống; kết hợp lí thuyết với luyện đề; chia nhỏ thời gian", "points": 0.5, "explain": "Học khoa học: ôn theo sơ đồ, bảng hệ thống thay vì học vẹt; kết hợp lí thuyết với luyện đề; chia nhỏ thời gian ôn đều thay vì dồn ép."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ chia sẻ kinh nghiệm ôn tập môn Ngữ văn hiệu quả của em.", "points": 0, "explain": "DÀN Ý: Mở đoạn: tầm quan trọng của phương pháp. Thân đoạn: kinh nghiệm cụ thể (sơ đồ tư duy từng bài; tóm tắt văn bản bằng câu ngắn; luyện viết theo dàn ý; học nhóm trao đổi; đọc lại văn bản trọng tâm). Kết đoạn: hiệu quả và nhắn nhủ. BÀI MẪU: (Bài mẫu minh họa — học sinh viết theo kinh nghiệm của mình.) Qua quá trình học, em rút ra một số kinh nghiệm ôn tập Ngữ văn hiệu quả muốn chia sẻ. Trước hết, em ôn theo sơ đồ tư duy: mỗi bài học được gói gọn trong một trang giấy với các từ khóa (tri thức ngữ văn – văn bản – tiếng Việt – kiểu bài viết), giúp nhớ lâu và thấy được mối liên hệ. Thứ hai, với mỗi văn bản, em tự tóm tắt bằng 3–5 câu ngắn gọn và ghi lại 2–3 chi tiết nghệ thuật đặc sắc nhất — vừa đủ để làm bài mà không bị ngợp. Thứ ba, em luyện viết theo dàn ý: trước mỗi bài văn, em dành 5 phút lập dàn ý chi tiết; nhờ đó bài viết đủ ý, mạch lạc. Thứ tư, em học nhóm với bạn: mỗi người phụ trách giảng lại một bài — dạy cho người khác chính là cách học sâu nhất. Cuối cùng, em đọc lại các văn bản trọng tâm và làm lại các đề đã sai để rút kinh nghiệm. Nhờ phương pháp này, em không còn sợ môn Văn mà thấy nó thú vị, gần gũi. Mỗi người có thể có cách riêng, nhưng điểm chung của mọi phương pháp tốt là: hệ thống, đều đặn và chủ động. (Học sinh viết theo kinh nghiệm thực tế của mình.)"}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề xã hội: Khát vọng vươn lên của tuổi trẻ Việt Nam hôm nay.", "points": 0, "explain": "DÀN Ý: Mở bài: khát vọng là động lực phát triển; vấn đề: khát vọng của tuổi trẻ hôm nay. Thân bài: Giải thích: khát vọng vươn lên là mong muốn mãnh liệt đạt điều tốt đẹp. Biểu hiện: học tập vươn lên; khởi nghiệp sáng tạo; vươn ra thế giới; cống hiến cộng đồng. Thực trạng: nhiều bạn khát vọng lớn; một bộ phận an phận, hưởng thụ. Nguyên nhân: thiếu động lực, sợ thất bại, ảnh hưởng tiêu cực. Bàn luận: khát vọng phải đi đôi với hành động, gắn cá nhân với đất nước. Dẫn chứng: tấm gương trẻ thành công. Giải pháp: nuôi dưỡng ước mơ, hành động kiên trì. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Khát vọng vươn lên là ngọn lửa thiêng liêng thúc đẩy con người và dân tộc không ngừng tiến về phía trước. Với tuổi trẻ Việt Nam hôm nay, khát vọng ấy đang bùng cháy mạnh mẽ hơn bao giờ hết. Khát vọng vươn lên là mong muốn mãnh liệt đạt được những điều tốt đẹp, lớn lao trong cuộc sống — không cam chịu tầm thường, không ngừng hoàn thiện mình. Biểu hiện của khát vọng tuổi trẻ thật đa dạng: đó là khát vọng học tập để trở thành người giỏi nhất trong lĩnh vực mình theo đuổi; khát vọng khởi nghiệp, sáng tạo, đưa sản phẩm Việt vươn ra thế giới; khát vọng cống hiến cho cộng đồng, cho đất nước. Ta thấy những nhà khoa học trẻ đạt giải quốc tế, những startup Việt gọi vốn thành công, những tình nguyện viên mang ánh sáng đến vùng cao — tất cả đều được thúc đẩy bởi khát vọng vươn lên. Thế nhưng, vẫn còn một bộ phận bạn trẻ sống an phận, bằng lòng với hiện tại; ngại khó, sợ thất bại; thậm chí sa vào hưởng thụ, coi khát vọng là viển vông. Nguyên nhân là thiếu động lực, thiếu tấm gương và ảnh hưởng của lối sống dễ dãi. Cần hiểu rằng khát vọng phải đi đôi với hành động: khát vọng không có hành động chỉ là mơ mộng; và khát vọng đẹp nhất là khát vọng gắn với lợi ích của đất nước — như thế hệ cha anh từng khát vọng độc lập, tự do. Để nuôi dưỡng khát vọng, mỗi bạn trẻ hãy: xác định mục tiêu lớn lao nhưng cụ thể; học tập, rèn luyện không ngừng; dám thử thách, không sợ thất bại. Gia đình, nhà trường hãy thắp lửa khát vọng bằng những tấm gương sống động. Tuổi trẻ Việt Nam hôm nay có đủ trí tuệ, bản lĩnh để vươn xa — hãy để khát vọng vươn lên trở thành sức mạnh đưa đất nước hùng cường, sánh vai cùng năm châu như Bác Hồ hằng mong ước."}]}]}
