hort", "level": "TH", "q": "Điền thuật ngữ còn thiếu: Nghệ thuật múa rối gỗ diễn trên mặt nước, người điều khiển đứng sau tấm mành gọi là …", "answer": "múa rối nước", "explain": "Rối nước là nghệ thuật độc đáo của Việt Nam: rối gỗ diễn trên mặt nước.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu một hệ quả của phương thức lưu truyền bằng diễn xướng đối với văn bản sân khấu dân gian.", "answer": "nhiều dị bản", "explain": "Lưu truyền bằng truyền miệng và diễn xướng khiến mỗi lần diễn là một sáng tạo lại, tạo ra nhiều dị bản.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày hiểu biết của em về loại hình chèo trong sân khấu dân gian Việt Nam.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu chèo — sân khấu dân gian Bắc Bộ. 2) Thân đoạn: nguồn gốc (đồng bằng Bắc Bộ, gắn đời sống nông dân); đặc điểm (vừa trào lộng vừa trữ tình; kết hợp hát – múa – diễn); nhân vật tiêu biểu (Thị Mầu, Xúy Vân, hề chèo); tích trò nổi tiếng (Xúy Vân giả dại, Thị Mầu lên chùa). 3) Kết đoạn: giá trị — phản ánh đời sống, tinh thần nhân dân; cần bảo tồn. BÀI MẪU: Chèo là loại hình sân khấu dân gian đặc sắc ra đời ở đồng bằng Bắc Bộ, gắn bó máu thịt với đời sống người nông dân. Chèo có hai sắc thái tưởng chừng đối lập mà hòa quyện: vừa hài hước, trào lộng qua các vai hề châm biếm thói hư tật xấu, vừa đượm trữ tình qua những làn điệu mượt mà như sử, xẩm, chèo đường trường. Nghệ thuật chèo là sự kết hợp nhuần nhuyễn giữa hát, múa và diễn. Nhân vật chèo gần gũi, quen thuộc: Thị Mầu lẳng lơ, Xúy Vân giả dại đầy bi kịch, chú hề thông minh dí dỏm. Các tích trò như Xúy Vân giả dại, Thị Mầu lên chùa đã trở thành tài sản chung của dân tộc, được lưu truyền qua bao thế hệ. Chèo không chỉ là nghệ thuật giải trí mà còn là tiếng nói của nhân dân lao động: ca ngợi cái đẹp, cái thiện và phê phán cái xấu, cái ác. Trong đời sống hiện đại, chèo vẫn có sức sống bền bỉ, nhắc nhở thế hệ trẻ trách nhiệm giữ gìn di sản văn hóa cha ông.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 200 chữ lí giải vì sao văn bản sân khấu dân gian thường tồn tại nhiều dị bản.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: nêu hiện tượng nhiều dị bản. 2) Thân đoạn: nguyên nhân — tính vô danh (sáng tạo tập thể, mỗi thế hệ góp thêm); phương thức lưu truyền (truyền miệng, diễn xướng — mỗi lần diễn là sáng tạo lại); nghệ sĩ thêm bớt lời thoại, tình tiết cho hợp khán giả từng vùng, từng thời. Dẫn chứng: tích Xúy Vân có nhiều dị bản. 3) Kết đoạn: dị bản là minh chứng sức sống, không phải khiếm khuyết. BÀI MẪU: Văn bản sân khấu dân gian thường tồn tại nhiều dị bản, và đó là đặc trưng tất yếu chứ không phải khiếm khuyết. Nguyên nhân sâu xa nằm ở tính vô danh: tác phẩm là sáng tạo tập thể của nhân dân qua nhiều thế hệ, mỗi thế hệ đều có quyền góp thêm, sửa đổi. Cùng với đó, phương thức lưu truyền chủ yếu bằng truyền miệng và diễn xướng khiến mỗi lần biểu diễn trở thành một lần sáng tạo lại: nghệ sĩ có thể thêm bớt lời thoại, tình tiết sao cho phù hợp với khán giả từng vùng, từng thời. Chẳng hạn, tích trò Xúy Vân giả dại được lưu truyền với nhiều dị bản khác nhau ở các địa phương. Chính sự đa dạng này chứng tỏ sức sống bền bỉ của sân khấu dân gian: tác phẩm không bị đóng khung mà luôn vận động, thích ứng cùng đời sống nhân dân.", "points": 0}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Xúy Vân giả dại là tích trò trích từ vở chèo nào?", "options": ["A. Quan Âm Thị Kính", "B. Kim Nham", "C. Trương Viên", "D. Lưu Bình – Dương Lễ"], "answer": "B", "explain": "Tích Xúy Vân giả dại trích từ vở chèo Kim Nham, một trong những vở chèo cổ nổi tiếng nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xúy Vân vốn là cô gái có tính cách như thế nào trước khi giả dại?", "options": ["A. Lẳng lơ, đỏng đảnh", "B. Nết na, đảm đang", "C. Kiêu căng, hỗn láo", "D. Lười biếng, ăn chơi"], "answer": "B", "explain": "Xúy Vân vốn là cô gái quê nết na, đảm đang, bị ép gả cho Kim Nham.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Xúy Vân phải giả dại?", "options": ["A. Bị bệnh tâm thần thật", "B. Để thoát khỏi cuộc hôn nhân ép buộc, giành lại tự do", "C. Để được đi theo gánh hát rong kiếm tiền", "D. Để trả thù nhà chồng"], "answer": "B", "explain": "Đau khổ vì hôn nhân không tình yêu, Xúy Vân giả điên dại để thoát khỏi nhà chồng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc Xúy Vân giả dại thể hiện phẩm chất gì của nhân vật?", "options": ["A. Ngu dại, cam chịu", "B. Thông minh, dám phản kháng để giành hạnh phúc", "C. Ích kỉ, chỉ nghĩ cho mình", "D. Hèn nhát, trốn tránh"], "answer": "B", "explain": "Cái dại bề ngoài che giấu sự tỉnh táo bên trong — đó là cách phản kháng thông minh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Câu nói nào khái quát đúng nhất giá trị của tích trò Xúy Vân giả dại?", "options": ["A. Ca ngợi cuộc sống giàu sang", "B. Tố cáo hủ tục ép duyên, ca ngợi khát vọng hạnh phúc của người phụ nữ", "C. Phê phán người phụ nữ nông dân", "D. Khuyên phụ nữ nên cam chịu số phận"], "answer": "B", "explain": "Tích trò tố cáo hủ tục ép duyên phong kiến, ca ngợi khát vọng hạnh phúc và sức phản kháng của người phụ nữ.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Chồng của Xúy Vân trong vở chèo Kim Nham tên là …", "answer": "Kim Nham", "explain": "Xúy Vân bị ép gả cho Kim Nham — kẻ học đòi, vô tình.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Trong lời thoại của Xúy Vân, cái điên dại bề ngoài che giấu điều gì?", "answer": "lời tố cáo", "explain": "Lời Xúy Vân vừa ngây dại vừa tỉnh táo — cái điên che giấu lời tố cáo xã hội phong kiến ép duyên.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu nghệ thuật đặc sắc được sử dụng trong vở chèo Xúy Vân giả dại.", "answer": "kết hợp hát múa diễn", "explain": "Chèo kết hợp hát – múa – diễn; lời ca trữ tình xót xa; hề chèo châm biếm thói đời.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích vẻ đẹp nhân vật Xúy Vân trong tích trò Xúy Vân giả dại.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu Xúy Vân — nhân vật trung tâm vở chèo Kim Nham. 2) Thân đoạn: vẻ đẹp người phụ nữ nông dân (nết na, đảm đang, chịu thương chịu khó); bi kịch (bị ép duyên với Kim Nham); sự phản kháng thông minh qua việc giả dại (dại bề ngoài – tỉnh táo bên trong); lời thoại vừa ngây dại vừa là lời tố cáo. 3) Kết đoạn: Xúy Vân là biểu tượng khát vọng hạnh phúc và tinh thần nhân đạo. BÀI MẪU: Xúy Vân trong tích trò Xúy Vân giả dại hiện lên với vẻ đẹp vừa rất đỗi bình dị vừa đầy sức phản kháng của người phụ nữ nông dân Việt Nam. Trước hết, nàng là cô gái quê nết na, đảm đang, chịu thương chịu khó — hiện thân của những phẩm chất tốt đẹp của người phụ nữ lao động. Nhưng bi kịch ập đến khi nàng bị ép gả cho Kim Nham, kẻ học đòi vô tình, trong cuộc hôn nhân không tình yêu. Đau đớn, uất ức, Xúy Vân đã chọn một cách phản kháng đầy thông minh: giả điên dại. Cái dại bề ngoài chỉ là tấm màn che giấu sự tỉnh táo bên trong; lời thoại của nàng vừa ngây dại vừa thấm đẫm lời tố cáo xã hội phong kiến với hủ tục ép duyên. Càng giả dại, tiếng nói phản kháng càng trở nên thấm thía. Qua nhân vật Xúy Vân, nhân dân lao động đã gửi gắm khát vọng hạnh phúc chính đáng và tinh thần nhân đạo sâu sắc: con người sinh ra là để được yêu thương, được sống hạnh phúc, chứ không phải làm nạn nhân của những hủ tục tàn nhẫn.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 200 chữ so sánh cách phản kháng của Xúy Vân với quan niệm về người phụ nữ trong xã hội phong kiến.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: quan niệm phong kiến (tam tòng tứ đức, phụ nữ cam chịu). 2) Thân đoạn: Xúy Vân phá vỡ khuôn mẫu — không cam chịu mà giả dại để giành tự do; sự phản kháng khôn khéo (không đối đầu trực diện mà dùng trí tuệ); ý nghĩa tiến bộ của cách phản kháng. 3) Kết đoạn: Xúy Vân là tiếng nói nhân đạo vượt thời đại. BÀI MẪU: Trong xã hội phong kiến với quan niệm tam tòng tứ đức trói buộc, người phụ nữ được dạy phải cam chịu, phục tùng. Xúy Vân đã phá vỡ khuôn mẫu ấy bằng một cách phản kháng đầy trí tuệ: giả điên dại. Nàng không đối đầu trực diện với lễ giáo — điều gần như bất khả trong thời đại ấy — mà dùng cái dại làm tấm khiên bảo vệ mình, từng bước thoát khỏi cuộc hôn nhân ép buộc để đi tìm tự do. Cách phản kháng này vừa khôn khéo vừa thấm đẫm bi kịch: nàng phải đánh đổi cả danh dự, phải mang tiếng điên dại mới giành được quyền làm người. So với quan niệm phong kiến đòi hỏi phụ nữ tuyệt đối phục tùng, hành động của Xúy Vân là một tuyên ngôn nhân đạo mạnh mẽ: người phụ nữ cũng có quyền khát khao hạnh phúc, có quyền từ chối số phận bị áp đặt. Vượt lên thời đại, tiếng nói của Xúy Vân vẫn vang vọng đến hôm nay, nhắc nhở chúng ta trân trọng quyền được sống và được hạnh phúc của mỗi con người.", "points": 0}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Trong kịch, lời nhân vật trao đổi qua lại với nhau gọi là gì?", "options": ["A. Độc thoại", "B. Đối thoại", "C. Bàng thoại", "D. Thuyết minh"], "answer": "B", "explain": "Đối thoại là lời trao đổi giữa các nhân vật với nhau.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lời nhân vật nói riêng với khán giả, các nhân vật khác trên sân khấu giả vờ không nghe thấy gọi là gì?", "options": ["A. Độc thoại", "B. Đối thoại", "C. Bàng thoại", "D. Lời dẫn"], "answer": "C", "explain": "Bàng thoại là lời nói riêng với khán giả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lời thoại của Xúy Vân có đặc điểm gì nổi bật?", "options": ["A. Hoàn toàn ngây dại, vô nghĩa", "B. Vừa ngây dại vừa tỉnh táo, che giấu lời tố cáo", "C. Hống hách, ra lệnh", "D. Khô khan, lí trí"], "answer": "B", "explain": "Lời Xúy Vân vừa ngây dại vừa tỉnh táo — cái điên che giấu lời tố cáo xã hội.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhân vật hề trong chèo thường đảm nhận chức năng gì?", "options": ["A. Chỉ mua vui đơn thuần", "B. Châm biếm thói hư tật xấu của thói đời", "C. Ca ngợi vua quan", "D. Dẫn chuyện như người kể"], "answer": "B", "explain": "Hề chèo thông minh, dí dỏm, châm biếm thói hư tật xấu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao nói lời thoại phải phù hợp với tính cách nhân vật?", "options": ["A. Để khán giả dễ thuộc lời", "B. Vì nhân vật kịch chỉ hiện lên qua lời nói và hành động, lời thoại sai tính cách sẽ phá vỡ hình tượng", "C. Để vở diễn ngắn gọn", "D. Để tiết kiệm chi phí"], "answer": "B", "explain": "Kịch không có người kể chuyện nên nhân vật chỉ sống qua lời thoại và hành động.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Nhân vật sân khấu dân gian thường được … hóa, tức tập trung một nét tính cách nổi bật.", "answer": "điển hình", "explain": "Nhân vật sân khấu dân gian mang tính điển hình hóa.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Lời thoại bộc lộ nội tâm giằng xé, đau đớn của Xúy Vân thuộc loại lời thoại nào?", "answer": "độc thoại", "explain": "Độc thoại bộc lộ nội tâm nhân vật.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu một nét nghệ thuật tiêu biểu của chèo thể hiện trong tích Xúy Vân giả dại.", "answer": "hát múa diễn kết hợp", "explain": "Chèo kết hợp hát – múa – diễn; lời ca trữ tình xót xa.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ phân tích nghệ thuật xây dựng lời thoại trong tích trò Xúy Vân giả dại.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: vai trò lời thoại trong kịch. 2) Thân đoạn: lời Xúy Vân hai lớp nghĩa (ngây dại bề ngoài – tỉnh táo, tố cáo bên trong); độc thoại bộc lộ nội tâm giằng xé; lời thoại phù hợp tính cách; kết hợp với làn điệu chèo trữ tình. 3) Kết đoạn: lời thoại làm nên sức sống của tích trò. BÀI MẪU: Trong tích trò Xúy Vân giả dại, lời thoại là vũ khí nghệ thuật sắc bén nhất để khắc họa nhân vật và gửi gắm tư tưởng. Đặc sắc nhất là cấu trúc hai lớp nghĩa trong lời nói của Xúy Vân: bề ngoài ngây ngô, điên dại, nhưng bên trong ẩn chứa sự tỉnh táo và lời tố cáo đanh thép nhắm vào hủ tục ép duyên. Những câu độc thoại của nàng bộc lộ nội tâm giằng xé giữa đau đớn và khát vọng, giữa tủi nhục và phẩm giá. Lời thoại được viết rất phù hợp với tính cách: vừa là tiếng nức nở của người đàn bà bất hạnh, vừa là tiếng cười chua chát của kẻ đã nhìn thấu thói đời. Kết hợp với làn điệu chèo trữ tình, xót xa, lời thoại của Xúy Vân vừa lay động lòng người vừa khiến người xem phải suy ngẫm. Chính nghệ thuật lời thoại tinh tế ấy đã làm nên sức sống bền lâu của tích trò qua hàng trăm năm.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 200 chữ bàn về vai trò của tiếng cười trong chèo qua tích trò Xúy Vân giả dại.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: tiếng cười là đặc trưng chèo. 2) Thân đoạn: trong Xúy Vân, tiếng cười chua chát (cười ra nước mắt); cười để tố cáo, để phản kháng; khác với tiếng cười mua vui đơn thuần; tiếng cười mang tinh thần nhân đạo. 3) Kết đoạn: tiếng cười chèo là vũ khí của nhân dân. BÀI MẪU: Tiếng cười là linh hồn của chèo, và trong tích trò Xúy Vân giả dại, tiếng cười ấy mang sắc thái đặc biệt: cười ra nước mắt. Khán giả cười trước những lời lẽ ngây dại của Xúy Vân, nhưng càng cười càng thấy xót xa cho số phận người phụ nữ bị ép duyên. Đó không phải tiếng cười mua vui đơn thuần mà là tiếng cười tố cáo: cười vào hủ tục phong kiến tàn nhẫn, cười vào những kẻ như Kim Nham vô tình. Đồng thời, tiếng cười cũng là hình thức phản kháng của nhân vật: Xúy Vân dùng cái dại, dùng tiếng cười để che giấu nỗi đau và từng bước giành lại tự do. Như vậy, tiếng cười trong chèo vừa mang tính giải trí vừa mang tinh thần nhân đạo sâu sắc — nó là vũ khí của nhân dân lao động để phê phán cái xấu, bảo vệ cái thiện. Hiểu được tiếng cười Xúy Vân, ta mới thấy hết chiều sâu nhân văn của sân khấu chèo dân gian.", "points": 0}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Huyện đường là đoạn trích từ vở tuồng nào?", "options": ["A. Sơn Hậu", "B. Nghêu, Sò, Ốc, Hến", "C. Tam nữ đồ vương", "D. Đào Phi Phụng"], "answer": "B", "explain": "Huyện đường trích từ vở tuồng Nghêu, Sò, Ốc, Hến — vở tuồng hài nổi tiếng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vở tuồng Nghêu, Sò, Ốc, Hến thuộc loại tuồng nào?", "options": ["A. Tuồng cung đình nghiêm trang", "B. Tuồng hài châm biếm", "C. Tuồng lịch sử", "D. Tuồng thần thoại"], "answer": "B", "explain": "Đây là vở tuồng hài, châm biếm thói tham quan ô lại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đối tượng châm biếm chính trong đoạn trích Huyện đường là ai?", "options": ["A. Người nông dân", "B. Bọn quan lại tham lam, ngu dốt", "C. Các thương nhân", "D. Phụ nữ nông thôn"], "answer": "B", "explain": "Đoạn trích châm biếm bọn quan lại xử kiện lố bịch, bất công.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nghệ thuật nào được sử dụng để khắc họa bọn quan lại trong Huyện đường?", "options": ["A. Miêu tả chân thực, khách quan", "B. Phóng đại, cường điệu làm nổi bật thói hư tật xấu", "C. Tượng trưng, ẩn dụ", "D. Lãng mạn hóa"], "answer": "B", "explain": "Nghệ thuật phóng đại, cường điệu làm thói hư tật xấu càng lố bịch, càng châm biếm sâu cay.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Giá trị sâu sắc nhất của tiếng cười trong Huyện đường là gì?", "options": ["A. Mua vui cho khán giả", "B. Châm biếm bộ máy quan lại thối nát, bênh vực người dân lương thiện", "C. Ca ngợi sự thông minh của quan lại", "D. Khuyên dân nên kiện tụng"], "answer": "B", "explain": "Tiếng cười châm biếm bộ máy quan lại phong kiến thối nát, thể hiện tinh thần dân chủ của nhân dân.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Trong tuồng, mặt đỏ tượng trưng cho nhân vật … dũng.", "answer": "trung", "explain": "Hóa trang tuồng: mặt đỏ là trung dũng, mặt trắng là gian xảo.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Trong đoạn trích Huyện đường, việc xử kiện phụ thuộc vào yếu tố nào thay vì lẽ phải?", "answer": "tiền đút lót", "explain": "Kẻ có tội được tha, người vô tội bị phạt — tất cả phụ thuộc vào tiền đút lót.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu sự đối lập trong lời thoại tạo nên tiếng cười châm biếm ở Huyện đường.", "answer": "quan hống hách dân van xin", "explain": "Lời quan hống hách rỗng tuếch đối lập với lời dân khổ sở van xin, tạo tiếng cười châm biếm.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích nghệ thuật châm biếm trong đoạn trích Huyện đường.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu Huyện đường — tuồng hài châm biếm. 2) Thân đoạn: đối tượng (bọn quan lại); thủ pháp phóng đại, cường điệu; sự đối lập trong lời thoại (quan hống hách – dân van xin); tình huống lố bịch (xử kiện theo tiền); tiếng cười vừa hài hước vừa đau xót. 3) Kết đoạn: giá trị — phê phán tham quan, bênh vực nhân dân. BÀI MẪU: Đoạn trích Huyện đường là mẫu mực của nghệ thuật châm biếm trong tuồng dân gian. Đối tượng châm biếm là bọn quan lại phong kiến với đầy đủ thói hư tật xấu: tham lam, ngu dốt, hách dịch. Tác giả dân gian đã sử dụng thủ pháp phóng đại, cường điệu để những thói xấu ấy hiện lên lố bịch đến mức buồn cười: quan xử kiện không theo lẽ phải mà theo tiền đút lót, kẻ có tội được tha bổng còn người vô tội phải chịu phạt. Sự đối lập gay gắt trong lời thoại càng tăng hiệu quả châm biếm: lời quan hống hách, rỗng tuếch nhưng tự cho là minh xét; lời dân khổ sở, van xin mà chẳng được đoái hoài. Tình huống xử kiện bị đảo lộn hoàn toàn tạo nên tiếng cười vừa sảng khoái vừa chua chát. Đằng sau tiếng cười ấy là thái độ phê phán sâu sắc bộ máy cai trị thối nát và sự bênh vực người dân lương thiện — thể hiện tinh thần dân chủ đáng quý của nhân dân lao động.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 200 chữ lí giải sức sống lâu bền của tiếng cười châm biếm dân gian qua đoạn trích Huyện đường.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: Huyện đường vẫn được diễn đến nay. 2) Thân đoạn: vì đối tượng châm biếm (tham nhũng, bất công) mang tính thời sự muôn thuở; nghệ thuật phóng đại dễ nhớ, dễ lan truyền; tiếng cười đáp ứng nhu cầu công bằng của nhân dân; mỗi thời khán giả tìm thấy bóng dáng hiện thực mình trong vở diễn. 3) Kết đoạn: châm biếm dân gian là di sản tinh thần quý báu. BÀI MẪU: Trải qua hàng trăm năm, đoạn trích Huyện đường vẫn được biểu diễn và đón nhận, bởi tiếng cười châm biếm dân gian chạm đến những vấn đề mang tính thời sự muôn thuở. Tham nhũng, cửa quyền, bất công — những thói xấu bị vạch trần trong vở tuồng — không chỉ là chuyện của quá khứ mà ở mỗi thời đại, khán giả đều có thể tìm thấy bóng dáng quen thuộc. Nghệ thuật phóng đại, cường điệu khiến hình tượng bọn quan lại vừa lố bịch vừa dễ nhớ, dễ lan truyền trong dân gian. Hơn nữa, tiếng cười châm biếm đáp ứng nhu cầu công bằng sâu thẳm của nhân dân lao động: khi không thể thay đổi hiện thực bằng hành động, họ dùng tiếng cười để phán xét, để khẳng định lẽ phải. Chính vì gắn với khát vọng công lí muôn đời của con người mà Huyện đường vượt qua giới hạn thời gian, trở thành di sản tinh thần quý báu, nhắc nhở mỗi thế hệ về giá trị của sự liêm chính.", "points": 0}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Hóa trang trong tuồng có đặc điểm gì?", "options": ["A. Đơn giản, tự nhiên", "B. Cầu kì, mặt vẽ theo tính cách nhân vật", "C. Không hóa trang", "D. Chỉ dùng mặt nạ"], "answer": "B", "explain": "Hóa trang tuồng cầu kì: mặt vẽ theo tính cách (mặt đỏ trung dũng, mặt trắng gian xảo...).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong tuồng, mặt trắng thường tượng trưng cho nhân vật như thế nào?", "options": ["A. Trung thành", "B. Gian xảo", "C. Hiền lành", "D. Dũng cảm"], "answer": "B", "explain": "Mặt trắng tượng trưng cho kẻ gian xảo trong ước lệ hóa trang tuồng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Động tác diễn xuất trong tuồng mang đặc điểm gì?", "options": ["A. Tự nhiên như đời thường", "B. Ước lệ, khoa trương", "C. Tùy hứng, không quy tắc", "D. Chỉ đứng yên đọc lời"], "answer": "B", "explain": "Diễn xuất tuồng mang tính ước lệ, khoa trương — một đặc trưng của sân khấu cổ điển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tuồng đề cao những phẩm chất đạo đức nào?", "options": ["A. Giàu sang, quyền lực", "B. Trung – hiếu – tiết – nghĩa", "C. Thông minh, xảo quyệt", "D. Đẹp đẽ, duyên dáng"], "answer": "B", "explain": "Tuồng trang trọng, hùng tráng, đề cao trung – hiếu – tiết – nghĩa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao Huyện đường lại chọn hình thức tuồng hài mà không phải tuồng nghiêm trang?", "options": ["A. Vì tác giả không biết viết tuồng nghiêm", "B. Vì tiếng cười hài hước làm vũ khí châm biếm sắc bén, dễ đi vào lòng người", "C. Vì khán giả chỉ thích hài", "D. Vì tuồng nghiêm đã lỗi thời"], "answer": "B", "explain": "Tiếng cười là vũ khí châm biếm sắc bén: vừa tố cáo vừa dễ đi vào lòng người.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Tuồng có nguồn gốc từ sân khấu …, sau được dân gian hóa.", "answer": "cung đình", "explain": "Tuồng là sân khấu cung đình được dân gian hóa.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Trong tuồng, ba yếu tố nói, hát và … kết hợp tạo nên nghệ thuật biểu diễn tổng hợp.", "answer": "múa", "explain": "Tuồng kết hợp nói – hát – múa.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu điểm khác biệt cơ bản giữa không khí tuồng trong Huyện đường và tuồng lịch sử nghiêm trang.", "answer": "hài hước châm biếm", "explain": "Huyện đường dùng giọng hài hước châm biếm thay vì trang trọng hùng tráng như tuồng lịch sử.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ trình bày những hiểu biết của em về nghệ thuật tuồng qua đoạn trích Huyện đường.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu tuồng và đoạn trích. 2) Thân đoạn: nguồn gốc (cung đình dân gian hóa); hóa trang cầu kì (mặt vẽ theo tính cách); diễn xuất ước lệ khoa trương; kết hợp nói – hát – múa; nội dung đề cao trung hiếu tiết nghĩa nhưng Huyện đường dùng giọng hài châm biếm. 3) Kết đoạn: giá trị nghệ thuật tuồng. BÀI MẪU: Tuồng là loại hình sân khấu có nguồn gốc cung đình, sau được dân gian hóa và thịnh hành ở miền Trung, Nam Bộ. Qua đoạn trích Huyện đường, ta thấy rõ những đặc trưng nghệ thuật của tuồng: hóa trang cầu kì với gương mặt vẽ theo tính cách nhân vật; động tác diễn xuất mang tính ước lệ, khoa trương; nghệ thuật biểu diễn là sự kết hợp tổng hợp giữa nói, hát và múa. Về nội dung, tuồng truyền thống thường trang trọng, hùng tráng, đề cao trung – hiếu – tiết – nghĩa; nhưng Huyện đường đã sáng tạo khi dùng chính hình thức tuồng để diễn nội dung hài hước, châm biếm bọn quan lại thối nát. Sự kết hợp giữa hình thức trang trọng và nội dung châm biếm tạo nên hiệu quả nghệ thuật độc đáo: càng trang trọng, cái lố bịch càng nổi bật. Qua đó ta thấy tuồng không hề khô cứng mà rất linh hoạt, luôn biết thích ứng để phản ánh đời sống nhân dân.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 200 chữ so sánh nghệ thuật hóa trang và diễn xuất giữa chèo và tuồng.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: chèo và tuồng đều là sân khấu dân gian nhưng khác nhau. 2) Thân đoạn: hóa trang (chèo đơn giản, gần đời thường; tuồng cầu kì, ước lệ theo tính cách); diễn xuất (chèo tự nhiên, dí dỏm; tuồng ước lệ, khoa trương); nguyên nhân (chèo gắn nông dân Bắc Bộ; tuồng gốc cung đình). 3) Kết đoạn: mỗi loại hình có vẻ đẹp riêng. BÀI MẪU: Chèo và tuồng đều là sân khấu dân gian nhưng mang hai phong cách nghệ thuật khác biệt, thể hiện rõ nhất qua hóa trang và diễn xuất. Hóa trang chèo đơn giản, gần gũi đời thường, phù hợp với chất trào lộng, trữ tình của nông dân Bắc Bộ; còn hóa trang tuồng cầu kì, ước lệ cao — gương mặt vẽ theo tính cách nhân vật (đỏ là trung dũng, trắng là gian xảo), phản ánh nguồn gốc cung đình. Về diễn xuất, chèo tự nhiên, dí dỏm, linh hoạt với những vai hề thông minh; tuồng lại ước lệ, khoa trương với động tác được quy phạm chặt chẽ. Sự khác biệt này bắt nguồn từ môi trường hình thành: chèo sinh ra từ đồng ruộng, mang hơi thở dân dã; tuồng từ cung đình, mang vẻ trang trọng, khuôn phép. Tuy khác nhau, cả hai đều là những viên ngọc quý của sân khấu dân gian Việt Nam, mỗi loại hình góp một vẻ đẹp riêng vào kho tàng văn hóa dân tộc.", "points": 0}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Điểm chung về xuất xứ của Xúy Vân giả dại và Huyện đường là gì?", "options": ["A. Đều do một tác giả viết", "B. Đều từ tích trò dân gian, tác giả vô danh", "C. Đều dịch từ nước ngoài", "D. Đều là sáng tác hiện đại"], "answer": "B", "explain": "Cả hai đều từ tích trò dân gian, mang tính vô danh — sáng tạo tập thể của nhân dân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giọng điệu của hai đoạn trích khác nhau như thế nào?", "options": ["A. Đều bi tráng", "B. Xúy Vân trữ tình xót xa; Huyện đường hài hước châm biếm", "C. Đều hài hước", "D. Đều hùng tráng"], "answer": "B", "explain": "Xúy Vân mang giọng trữ tình, xót xa, bi kịch; Huyện đường mang giọng hài hước, châm biếm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đối tượng phê phán trong hai đoạn trích là gì?", "options": ["A. Xúy Vân phê phán hủ tục ép duyên; Huyện đường phê phán tham quan ô lại", "B. Cả hai đều phê phán nông dân", "C. Cả hai đều ca ngợi vua quan", "D. Không có đối tượng phê phán"], "answer": "A", "explain": "Xúy Vân tố cáo hủ tục ép duyên; Huyện đường châm biếm tham quan ô lại.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Điểm chung về tư tưởng của hai đoạn trích là gì?", "options": ["A. Ca ngợi giàu sang", "B. Tinh thần nhân đạo, dân chủ: bênh vực người lương thiện, phê phán cái xấu", "C. Khuyên người ta an phận", "D. Đề cao chiến tranh"], "answer": "B", "explain": "Cả hai đều thể hiện tinh thần nhân đạo, dân chủ của nhân dân lao động.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhân vật chính trong hai đoạn trích có vai trò nghệ thuật khác nhau như thế nào?", "options": ["A. Giống nhau hoàn toàn", "B. Xúy Vân là nạn nhân đáng thương; bọn quan lại trong Huyện đường là đối tượng bị châm biếm", "C. Cả hai đều là anh hùng", "D. Cả hai đều là hề"], "answer": "B", "explain": "Xúy Vân là nạn nhân cần được cảm thông; bọn quan lại là đối tượng bị vạch trần, châm biếm.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Xúy Vân giả dại thuộc loại hình chèo, Huyện đường thuộc loại hình …", "answer": "tuồng", "explain": "Xúy Vân là chèo (Bắc Bộ); Huyện đường là tuồng (Trung – Nam).", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nêu một điểm chung về nghệ thuật xây dựng nhân vật trong hai đoạn trích.", "answer": "điển hình hóa", "explain": "Nhân vật cả hai đoạn trích đều được điển hình hóa, khắc họa qua lời thoại và hành động.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu điểm khác biệt trong cách sử dụng tiếng cười giữa hai đoạn trích.", "answer": "xót xa và châm biếm", "explain": "Tiếng cười Xúy Vân chua xót (cười ra nước mắt); tiếng cười Huyện đường châm biếm sâu cay.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ so sánh hai đoạn trích Xúy Vân giả dại và Huyện đường.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu hai đoạn trích tiêu biểu của chèo và tuồng. 2) Thân đoạn: so sánh loại hình, giọng điệu (trữ tình xót xa – hài hước châm biếm), nhân vật (nạn nhân – đối tượng châm biếm), đối tượng phê phán (ép duyên – tham quan); chỉ ra điểm chung (tích trò dân gian, điển hình hóa, tinh thần nhân đạo). 3) Kết đoạn: hai mảnh ghép làm nên bức tranh sân khấu dân gian. BÀI MẪU: Xúy Vân giả dại và Huyện đường là hai đoạn trích tiêu biểu cho hai loại hình sân khấu dân gian: chèo và tuồng. Về loại hình, Xúy Vân thuộc chèo Bắc Bộ với giọng điệu trữ tình, xót xa, mang màu sắc bi kịch; Huyện đường thuộc tuồng với giọng hài hước, châm biếm sâu cay. Nhân vật trung tâm cũng đối lập: Xúy Vân là nạn nhân đáng thương của hủ tục ép duyên, cần được cảm thông và bênh vực; còn bọn quan lại trong Huyện đường là đối tượng bị vạch trần, chế giễu. Đối tượng phê phán vì thế cũng khác nhau: một bên tố cáo hủ tục phong kiến, một bên đả kích tham quan ô lại. Tuy nhiên, hai đoạn trích lại gặp nhau ở điểm chung sâu xa: đều bắt nguồn từ tích trò dân gian với tính vô danh; nhân vật đều được điển hình hóa và khắc họa qua lời thoại; và quan trọng nhất, cả hai đều thấm đẫm tinh thần nhân đạo, dân chủ của nhân dân lao động — bênh vực người lương thiện, phê phán cái xấu, cái ác. Hai đoạn trích như hai mảnh ghép, cùng làm nên bức tranh toàn cảnh rực rỡ của sân khấu dân gian Việt Nam.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 200 chữ bàn về giá trị nhân đạo trong sân khấu dân gian qua hai đoạn trích đã học.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: nhân đạo là giá trị cốt lõi. 2) Thân đoạn: Xúy Vân — đồng cảm với người phụ nữ, khát vọng hạnh phúc, tố cáo ép duyên; Huyện đường — bênh vực dân lành, phê phán bất công; nhân đạo thể hiện qua việc đứng về phía người yếu thế; so sánh với văn học viết cùng thời. 3) Kết đoạn: nhân đạo là sức sống lâu bền của sân khấu dân gian. BÀI MẪU: Giá trị nhân đạo là linh hồn làm nên sức sống bền lâu của sân khấu dân gian Việt Nam, thể hiện rõ qua hai đoạn trích đã học. Trong Xúy Vân giả dại, tinh thần nhân đạo bộc lộ qua sự đồng cảm sâu sắc với số phận người phụ nữ nông dân: tác giả dân gian không chỉ xót thương Xúy Vân mà còn đứng về phía nàng, ủng hộ khát vọng hạnh phúc chính đáng và lên án hủ tục ép duyên tàn nhẫn. Trong Huyện đường, tinh thần nhân đạo thể hiện qua việc bênh vực người dân lương thiện trước bộ máy quan lại thối nát: tiếng cười châm biếm chính là bản án của nhân dân dành cho bất công. Điểm chung đáng quý là sân khấu dân gian luôn đứng về phía người yếu thế, người bị áp bức — khác với không ít tác phẩm văn học viết cùng thời chỉ phục vụ tầng lớp trên. Chính tấm lòng nhân đạo ấy khiến sân khấu dân gian vượt qua mọi giới hạn thời gian, mãi mãi là tiếng nói của lương tri và công lí.", "points": 0}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Múa rối nước là nghệ thuật độc đáo của quốc gia nào?", "options": ["A. Trung Quốc", "B. Việt Nam", "C. Nhật Bản", "D. Thái Lan"], "answer": "B", "explain": "Múa rối nước là nghệ thuật độc đáo của Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Con rối nước thường được làm bằng loại gỗ nào?", "options": ["A. Gỗ lim", "B. Gỗ sung", "C. Gỗ trắc", "D. Gỗ mun"], "answer": "B", "explain": "Con rối làm bằng gỗ sung, sơn son.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người điều khiển rối nước đứng ở đâu?", "options": ["A. Trên sân khấu", "B. Trong buồng trò sau tấm mành", "C. Dưới nước", "D. Trên khán đài"], "answer": "B", "explain": "Người điều khiển đứng trong buồng trò sau mành, dùng sào và dây điều khiển rối.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Văn bản Múa rối nước hiện đại soi bóng tiền nhân thuộc thể loại nào?", "options": ["A. Truyện ngắn", "B. Văn bản thông tin", "C. Thơ", "D. Kịch"], "answer": "B", "explain": "Đây là văn bản thông tin: cung cấp tri thức về rối nước trong đời sống hiện đại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đặc điểm ngôn ngữ của văn bản thông tin là gì?", "options": ["A. Hoa mĩ, giàu cảm xúc", "B. Khách quan, chính xác", "C. Hài hước, châm biếm", "D. Trang trọng, hùng tráng"], "answer": "B", "explain": "Văn bản thông tin dùng ngôn ngữ khách quan, chính xác, cung cấp số liệu sự kiện.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Rối nước diễn trên mặt …, tạo nên nét độc đáo riêng.", "answer": "nước", "explain": "Rối nước diễn trên mặt nước — nét độc đáo không đâu có.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Kể tên hai tích trò quen thuộc thường được diễn trong múa rối nước.", "answer": "chọi trâu cày cấy", "explain": "Các tích trò quen thuộc: chọi trâu, cày cấy, đánh cá, rước kiệu...", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu một biểu hiện cho thấy rối nước vẫn có sức sống trong thời hiện đại.", "answer": "lưu diễn quốc tế", "explain": "Rối nước lưu diễn quốc tế, được bạn bè thế giới yêu mến; phường rối truyền nghề cho thế hệ trẻ.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ giới thiệu về nghệ thuật múa rối nước Việt Nam.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: rối nước — nghệ thuật độc đáo của Việt Nam. 2) Thân đoạn: con rối gỗ sung sơn son; diễn trên mặt nước; người điều khiển trong buồng trò dùng sào dây; tích trò (chọi trâu, cày cấy, đánh cá); âm nhạc dân gian đệm theo. 3) Kết đoạn: giá trị di sản, cần bảo tồn. BÀI MẪU: Múa rối nước là loại hình nghệ thuật độc đáo chỉ có ở Việt Nam, ra đời từ nền văn minh lúa nước. Con rối được tạc từ gỗ sung, sơn son rực rỡ, diễn trên mặt nước trong veo — mặt nước vừa là sân khấu vừa là yếu tố tạo nên sự sinh động kì ảo. Người điều khiển đứng trong buồng trò sau tấm mành tre, dùng hệ thống sào và dây để điều khiển con rối cử động nhịp nhàng như thật. Các tích trò quen thuộc gắn với đời sống nông dân: chọi trâu, cày cấy, đánh cá, rước kiệu, múa tiên... kết hợp với âm nhạc dân gian rộn rã. Điều kì diệu là giữa thời hiện đại, rối nước không hề mai một: các phường rối vẫn truyền nghề cho thế hệ trẻ, rối nước Việt Nam lưu diễn khắp thế giới và được bạn bè quốc tế thán phục. Rối nước xứng đáng là báu vật văn hóa của dân tộc, nhắc nhở chúng ta trách nhiệm giữ gìn hồn cốt cha ông.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 200 chữ bàn về trách nhiệm của thế hệ trẻ trong việc bảo tồn nghệ thuật dân gian như múa rối nước.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: nghệ thuật dân gian đứng trước nguy cơ mai một. 2) Thân đoạn: trách nhiệm của tuổi trẻ (tìm hiểu, thưởng thức, quảng bá; học nghề truyền thống; ứng dụng công nghệ để lan tỏa); dẫn chứng (phường rối truyền nghề, rối nước lưu diễn quốc tế); phê phán thái độ thờ ơ. 3) Kết đoạn: giữ gìn di sản là giữ gìn cội nguồn. BÀI MẪU: Trước làn sóng văn hóa ngoại lai, nhiều loại hình nghệ thuật dân gian đứng trước nguy cơ mai một, và thế hệ trẻ chính là người quyết định số phận của di sản. Trách nhiệm ấy thể hiện ở nhiều việc làm cụ thể: tìm hiểu và thưởng thức nghệ thuật dân gian thay vì thờ ơ; quảng bá rối nước, chèo, tuồng đến bạn bè trong và ngoài nước; thậm chí trực tiếp học nghề, nối nghiệp các nghệ nhân già. Trong thời đại số, tuổi trẻ còn có thể dùng công nghệ để lan tỏa di sản: quay video, livestream buổi diễn, xây dựng nội dung số về nghệ thuật truyền thống. Thực tế đáng mừng là nhiều phường rối đã truyền nghề thành công cho lớp trẻ, rối nước Việt Nam vươn ra thế giới. Ngược lại, thái độ thờ ơ, sính ngoại sẽ khiến di sản lụi tàn. Giữ gìn nghệ thuật dân gian chính là giữ gìn cội nguồn, bản sắc dân tộc — đó là mệnh lệnh thiêng liêng của mỗi người trẻ Việt Nam hôm nay.", "points": 0}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Văn bản Hồn thiêng đưa đường được học ở phần nào của bài?", "options": ["A. Đọc văn bản chính", "B. Thực hành đọc", "C. Tri thức ngữ văn", "D. Thực hành tiếng Việt"], "answer": "B", "explain": "Hồn thiêng đưa đường là văn bản thực hành đọc của Bài 5.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nội dung chính của văn bản Hồn thiêng đưa đường là gì?", "options": ["A. Kể về ma quỷ", "B. Hành trình tìm về cội nguồn sân khấu dân gian và niềm tin vào sự tiếp nối", "C. Dạy cách diễn kịch", "D. Phê phán nghệ thuật hiện đại"], "answer": "B", "explain": "Văn bản kể về hành trình tìm về cội nguồn: nghệ nhân truyền nghề, đêm diễn đình làng, niềm tin hồn thiêng tiền nhân đưa đường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Báo cáo nghiên cứu có bố cục gồm mấy phần?", "options": ["A. 2 phần", "B. 3 phần", "C. 4 phần", "D. 5 phần"], "answer": "B", "explain": "Báo cáo nghiên cứu gồm 3 phần: đặt vấn đề – giải quyết vấn đề – kết luận.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phần nào của báo cáo nghiên cứu trình bày quá trình tìm hiểu, phân tích bằng lí lẽ và bằng chứng?", "options": ["A. Đặt vấn đề", "B. Giải quyết vấn đề", "C. Kết luận", "D. Phụ lục"], "answer": "B", "explain": "Phần giải quyết vấn đề trình bày quá trình tìm hiểu, phân tích, lí giải bằng lí lẽ và bằng chứng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Yêu cầu quan trọng nhất khi sử dụng tài liệu trong báo cáo nghiên cứu là gì?", "options": ["A. Tài liệu càng nhiều càng tốt", "B. Tài liệu đáng tin cậy, trích dẫn và cước chú đầy đủ", "C. Chỉ dùng tài liệu trên mạng", "D. Không cần ghi nguồn"], "answer": "B", "explain": "Tài liệu phải đáng tin cậy; trích dẫn, cước chú đầy đủ thể hiện sự trung thực khoa học.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Khi trích dẫn mà bỏ bớt phần không cần thiết, phải đánh dấu bằng dấu ba chấm trong ngoặc …", "answer": "vuông", "explain": "Tỉnh lược đánh dấu bằng dấu ba chấm trong ngoặc vuông, không làm sai lệch ý nguyên văn.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nêu đề tài báo cáo nghiên cứu gợi ý trong Bài 5.", "answer": "sân khấu dân gian địa phương", "explain": "Đề tài gợi ý: tìm hiểu một loại hình sân khấu dân gian ở địa phương em.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Khi viết báo cáo, vì sao phải có quan điểm riêng của người viết?", "answer": "tránh sao chép", "explain": "Báo cáo cần quan điểm riêng để thể hiện sự suy nghĩ độc lập, tránh sao chép máy móc.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu cảm nhận của em về trách nhiệm giữ gìn di sản sân khấu dân gian sau khi đọc văn bản Hồn thiêng đưa đường.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: cảm xúc sau khi đọc. 2) Thân đoạn: hình ảnh nghệ nhân già truyền nghề, đêm diễn đình làng đông khán giả; suy nghĩ về trách nhiệm của bản thân (tìm hiểu, thưởng thức, quảng bá); liên hệ địa phương. 3) Kết đoạn: quyết tâm giữ gìn. BÀI MẪU: Đọc văn bản Hồn thiêng đưa đường, em thực sự xúc động trước hình ảnh những nghệ nhân tóc đã bạc vẫn miệt mài truyền nghề cho lớp trẻ, trước những đêm diễn ở đình làng vẫn đông nghịt khán giả. Hóa ra, giữa nhịp sống hiện đại hối hả, sân khấu dân gian vẫn âm thầm sống, vẫn có người gìn giữ như giữ ngọn lửa thiêng của cha ông. Văn bản khiến em day dứt nhìn lại chính mình: đã bao lần em thờ ơ với những làn điệu chèo, những đêm tuồng quê hương? Trách nhiệm giữ gìn di sản không phải điều gì xa xôi — nó bắt đầu từ việc em chịu khó tìm hiểu, đến xem một buổi diễn rối nước, kể cho bạn bè nghe về tích trò Xúy Vân. Mỗi người trẻ là một nhịp cầu nối quá khứ với tương lai; nếu chúng em quay lưng, hồn thiêng tiền nhân biết đưa đường cho ai? Em tự nhủ sẽ bắt đầu từ những việc nhỏ nhất để di sản quê hương không bao giờ lụi tàn.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết đoạn văn khoảng 200 chữ lập đề cương chi tiết cho báo cáo nghiên cứu về một loại hình sân khấu dân gian ở địa phương em.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: lí do chọn đề tài. 2) Thân đoạn: đề cương 3 phần (đặt vấn đề: lí do, mục đích, phạm vi; giải quyết: lịch sử, đặc điểm, nghệ nhân, thực trạng; kết luận: nhận định, đề xuất); phương pháp thu thập tài liệu (sách báo, phỏng vấn). 3) Kết đoạn: ý nghĩa của việc nghiên cứu. BÀI MẪU: Để nghiên cứu về nghệ thuật chèo ở quê hương mình, em lập đề cương như sau. Phần đặt vấn đề: lí do chọn đề tài (chèo là di sản quê hương đang mai một), mục đích (tìm hiểu lịch sử, đặc điểm và thực trạng), phạm vi (các phường chèo trong huyện). Phần giải quyết vấn đề gồm bốn nội dung: lịch sử hình thành phường chèo địa phương; đặc điểm nghệ thuật (làn điệu, tích trò tiêu biểu như Xúy Vân); giới thiệu một vài nghệ nhân tiêu biểu; thực trạng bảo tồn hiện nay (thuận lợi, khó khăn). Tài liệu thu thập từ sách báo địa phương, đặc biệt là phỏng vấn trực tiếp các nghệ nhân già — nguồn tư liệu quý không sách vở nào có. Phần kết luận: nhận định về giá trị và nguy cơ mai một, đề xuất giải pháp (đưa chèo vào hoạt động ngoại khóa, quay video quảng bá). Đề cương chi tiết giúp bài báo cáo đi đúng hướng, tránh lan man, đảm bảo tính khoa học. Quan trọng hơn, quá trình nghiên cứu sẽ giúp em hiểu sâu sắc và thêm yêu di sản quê hương.", "points": 0}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Khi thuyết trình kết quả nghiên cứu, người nói cần làm gì?", "options": ["A. Đọc nguyên văn báo cáo", "B. Nói rõ ràng mạch lạc theo bố cục, dùng tranh ảnh minh họa, tương tác với người nghe", "C. Nói càng nhanh càng tốt", "D. Chỉ nói phần kết luận"], "answer": "B", "explain": "Thuyết trình cần nói rõ ràng mạch lạc, dùng minh họa trực quan và tương tác với người nghe.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người nghe thuyết trình cần thực hiện yêu cầu nào?", "options": ["A. Ngủ gật", "B. Lắng nghe tích cực, ghi chép và phản hồi xây dựng", "C. Chỉ nghe phần mình thích", "D. Ngắt lời người nói"], "answer": "B", "explain": "Người nghe cần lắng nghe tích cực, ghi chép ý chính và phản hồi xây dựng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao khi thuyết trình nên sử dụng tranh ảnh, video minh họa?", "options": ["A. Để che giấu nội dung yếu", "B. Để bài trình bày sinh động, dễ hiểu, tăng sức thuyết phục", "C. Để kéo dài thời gian", "D. Để khoe kĩ năng công nghệ"], "answer": "B", "explain": "Minh họa trực quan giúp bài trình bày sinh động, dễ hiểu và thuyết phục hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi trả lời câu hỏi phản biện sau thuyết trình, thái độ đúng là gì?", "options": ["A. Cãi lại bằng mọi giá", "B. Lịch sự, trả lời có căn cứ", "C. Từ chối trả lời", "D. Đổ lỗi cho nhóm"], "answer": "B", "explain": "Cần lắng nghe phản biện và trả lời lịch sự, có căn cứ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tiêu chí quan trọng nhất để đánh giá một bài thuyết trình nghiên cứu là gì?", "options": ["A. Trang phục đẹp", "B. Nội dung chính xác, sâu sắc; hình thức hấp dẫn; kĩ năng tương tác tốt", "C. Nói dài", "D. Dùng nhiều hiệu ứng"], "answer": "B", "explain": "Bài thuyết trình tốt cần cả nội dung sâu sắc, hình thức hấp dẫn và tương tác tốt.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Người thuyết trình cần … với người nghe thay vì đọc một chiều.", "answer": "tương tác", "explain": "Thuyết trình hiệu quả cần tương tác với người nghe.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nêu một việc người nghe nên làm để thể hiện sự lắng nghe tích cực.", "answer": "ghi chép ý chính", "explain": "Lắng nghe tích cực thể hiện qua ghi chép ý chính và đặt câu hỏi phản hồi.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu điểm giống nhau giữa yêu cầu của bài viết báo cáo và bài thuyết trình.", "answer": "bố cục rõ ràng", "explain": "Cả hai đều cần bố cục rõ ràng, nội dung chính xác và có quan điểm riêng.", "points": 0.5}, {"type": "essay", "level": "TH", "q": "Viết đoạn văn khoảng 200 chữ chia sẻ kinh nghiệm để có một bài thuyết trình kết quả nghiên cứu thành công.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: tầm quan trọng của thuyết trình. 2) Thân đoạn: chuẩn bị (nắm chắc nội dung, làm slide gọn); khi nói (mạch lạc theo bố cục, minh họa trực quan, tương tác, điều chỉnh tốc độ); khi trả lời (lịch sự, có căn cứ). 3) Kết đoạn: thuyết trình tốt lan tỏa giá trị nghiên cứu. BÀI MẪU: Một bài thuyết trình kết quả nghiên cứu thành công bắt đầu từ khâu chuẩn bị kĩ lưỡng: nắm chắc nội dung báo cáo, thiết kế slide gọn gàng với hình ảnh, sơ đồ minh họa thay vì chữ dày đặc. Khi trình bày, cần nói rõ ràng, mạch lạc theo đúng bố cục đặt vấn đề – giải quyết vấn đề – kết luận; kết hợp trình chiếu đoạn video rối nước hay làn điệu chèo để bài nói thêm sinh động. Đừng quên tương tác với người nghe bằng ánh mắt, câu hỏi gợi mở, và điều chỉnh tốc độ nói phù hợp. Phần trả lời phản biện cũng rất quan trọng: hãy lắng nghe hết câu hỏi, trả lời lịch sự và luôn có căn cứ từ tài liệu đã nghiên cứu. Thuyết trình tốt không chỉ thể hiện năng lực của người nói mà còn giúp kết quả nghiên cứu lan
