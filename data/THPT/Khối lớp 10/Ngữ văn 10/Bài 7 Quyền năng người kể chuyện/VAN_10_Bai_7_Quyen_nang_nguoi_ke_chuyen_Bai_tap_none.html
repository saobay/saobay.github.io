{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Người kể chuyện trong truyện Một chuyện đùa nho nhỏ xưng hô như thế nào?", "options": ["A. Xưng tôi – ngôi kể thứ nhất", "B. Giấu mình – ngôi kể thứ ba", "C. Xưng chúng ta", "D. Không có người kể chuyện"], "answer": "A", "points": 0.25, "explain": "Truyện được kể bằng ngôi thứ nhất, người kể xưng tôi và là một nhân vật trong truyện, tạo độ chân thực, gần gũi như lời chứng."}, {"type": "mcq", "level": "NB", "q": "Tác giả của truyện ngắn Dưới bóng hoàng lan là ai?", "options": ["A. Nguyễn Quang Sáng", "B. Thạch Lam", "C. Nam Cao", "D. Tô Hoài"], "answer": "B", "points": 0.25, "explain": "Dưới bóng hoàng lan là truyện ngắn nổi tiếng của Thạch Lam (1910–1942), bậc thầy truyện ngắn về vẻ đẹp bình dị và tâm hồn con người."}, {"type": "mcq", "level": "TH", "q": "Điểm nhìn trần thuật là gì?", "options": ["A. Nơi in truyện", "B. Vị trí, góc độ mà người kể quan sát, miêu tả sự việc và nhân vật", "C. Số trang của truyện", "D. Tên nhân vật chính"], "answer": "B", "points": 0.25, "explain": "Điểm nhìn là vị trí, góc độ quan sát của người kể (bên ngoài hay bên trong nhân vật; không gian, thời gian). Thay đổi điểm nhìn làm thay đổi ý nghĩa câu chuyện."}, {"type": "mcq", "level": "TH", "q": "Trong đoạn trích Người cầm quyền khôi phục uy quyền, nghệ thuật nào được sử dụng nổi bật để khắc họa nhân vật?", "options": ["A. Nghệ thuật tương phản giữa Giăng Van-giăng và Gia-ve", "B. Nghệ thuật phóng đại duy nhất", "C. Nghệ thuật ẩn dụ", "D. Nghệ thuật nói quá"], "answer": "A", "points": 0.25, "explain": "Hugo dùng nghệ thuật tương phản: Giăng Van-giăng nhân ái, cao thượng đối lập với Gia-ve máy móc, tàn nhẫn — làm nổi bật vẻ đẹp tâm hồn Giăng Van-giăng."}, {"type": "mcq", "level": "VDC", "q": "Vì sao ngôi kể thứ nhất trong Một chuyện đùa nho nhỏ lại phù hợp với chủ đề tác phẩm?", "options": ["A. Vì giúp kể được nhiều sự kiện hơn", "B. Vì tạo độ chân thực của lời thú nhận, day dứt; người kể vừa là thủ phạm vừa là người suy ngẫm", "C. Vì ngôi thứ ba quá khó viết", "D. Vì tác giả thích xưng tôi"], "answer": "B", "points": 0.25, "explain": "Ngôi thứ nhất biến câu chuyện thành lời thú nhận day dứt của chính người gây ra chuyện đùa: anh vừa là thủ phạm vô tình vừa là người suy ngẫm về trách nhiệm — điều ngôi thứ ba khó đạt được."}, {"type": "short", "level": "NB", "q": "Đoạn trích Người cầm quyền khôi phục uy quyền được trích từ tiểu thuyết nào của V. Hugo?", "answer": "Những người khốn khổ", "points": 0.5, "explain": "Đoạn trích thuộc tiểu thuyết Những người khốn khổ (Les Misérables) của Vích-to Huy-gô, xoay quanh nhân vật Giăng Van-giăng."}, {"type": "short", "level": "TH", "q": "Hình ảnh nào là hình tượng trung tâm trong truyện Dưới bóng hoàng lan?", "answer": "Cây hoàng lan", "points": 0.5, "explain": "Cây hoàng lan là hình tượng trung tâm: gắn với kỉ niệm tuổi thơ của Thanh, với tình cảm trong sáng giữa Thanh và Nga, với quê hương."}, {"type": "short", "level": "VD", "q": "Nêu tác dụng của biện pháp chêm xen trong câu văn.", "answer": "Bổ sung, giải thích, nhấn mạnh thông tin", "points": 0.5, "explain": "Phần chêm xen (thường trong ngoặc đơn, gạch ngang) chèn thêm thông tin để bổ sung, giải thích hoặc nhấn mạnh, làm câu văn giàu thông tin hơn."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích nhân vật Giăng Van-giăng trong đoạn trích Người cầm quyền khôi phục uy quyền.", "points": 0, "explain": "DÀN Ý: Mở đoạn: giới thiệu nhân vật, hoàn cảnh đoạn trích. Thân đoạn: con người từng lầm lỗi được cảm hóa; lòng nhân ái (hứa với Phăng-tin, lo cho Cô-dét); dũng cảm, uy quyền đạo đức (ra lệnh cho Gia-ve, buộc kẻ ác phải chờ); tương phản với Gia-ve. Kết đoạn: vẻ đẹp tâm hồn cao thượng, tư tưởng nhân đạo của Hugo. BÀI MẪU: Trong đoạn trích Người cầm quyền khôi phục uy quyền, Giăng Van-giăng hiện lên là một con người có tâm hồn cao thượng. Từng là kẻ lầm lỗi, ông đã được cảm hóa để trở thành con người của lòng nhân ái. Trước Phăng-tin hấp hối, ông hứa sẽ đón Cô-dét về nuôi — lời hứa của một tấm lòng biết thương người. Khi Gia-ve ập đến bắt, ông không van xin mà khôi phục uy quyền của một con người lương thiện: ra lệnh cho Gia-ve phải chờ, buộc kẻ đại diện cho pháp luật máy móc phải tôn trọng lời hứa thiêng liêng với người sắp chết. Uy quyền ấy không đến từ chức tước mà từ đạo đức, từ lẽ phải — khiến Gia-ve dù hung hăng cũng phải khuất phục. Nghệ thuật tương phản với Gia-ve càng làm nổi bật vẻ đẹp của Giăng Van-giăng: một bên là tình thương, một bên là sự tàn nhẫn máy móc. Qua nhân vật, Hugo gửi gắm tư tưởng nhân đạo sâu sắc: lòng nhân ái có sức mạnh cảm hóa và chiến thắng cái ác."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận phân tích, đánh giá truyện ngắn Dưới bóng hoàng lan của Thạch Lam.", "points": 0, "explain": "DÀN Ý: Mở bài: giới thiệu Thạch Lam và tác phẩm; nêu vấn đề phân tích, đánh giá khái quát. Thân bài: Tóm tắt ngắn. Phân tích nội dung: tình quê hương tha thiết (qua hình ảnh ngôi nhà, người bà, cây hoàng lan); tình yêu trong sáng giữa Thanh và Nga; triết lí về cội nguồn. Phân tích nghệ thuật: ngôi kể thứ ba, điểm nhìn gắn với Thanh; miêu tả tâm lí tinh tế; hình tượng cây hoàng lan; giọng văn nhẹ nhàng, man mác. Đánh giá: giá trị nội dung (ca ngợi vẻ đẹp bình dị, tình người) và nghệ thuật (bậc thầy truyện ngắn tâm lí); ý nghĩa với người đọc hôm nay. Kết bài: khẳng định giá trị, cảm nghĩ. BÀI MẪU: Dưới bóng hoàng lan là một trong những truyện ngắn tiêu biểu nhất của Thạch Lam — nhà văn của những vẻ đẹp bình dị và những rung động tinh tế của tâm hồn. Truyện kể về Thanh trở về thăm quê sau hai năm xa cách: ngôi nhà cũ, người bà hiền từ, vườn cây xanh mát và đặc biệt là cây hoàng lan thơm ngát gợi bao kỉ niệm. Thanh gặp lại Nga, cô gái hàng xóm năm xưa; tình cảm trong sáng, e ấp nảy nở giữa hai người dưới bóng hoàng lan. Về nội dung, truyện là bài ca về tình quê hương tha thiết: quê hương hiện lên qua những hình ảnh thân thuộc — mái nhà, mảnh vườn, người bà — trở thành cội nguồn nuôi dưỡng tâm hồn con người. Tình yêu giữa Thanh và Nga trong sáng, nhẹ nhàng như hương hoàng lan, không một chút vị lợi, ồn ào. Ẩn sau đó là triết lí nhân sinh sâu sắc: con người dù đi đâu cũng hướng về cội nguồn, và hạnh phúc đích thực nằm ở những điều bình dị. Về nghệ thuật, Thạch Lam dùng ngôi kể thứ ba với điểm nhìn gắn chặt vào nhân vật Thanh, giúp người đọc cùng cảm nhận từng rung động của anh. Nghệ thuật miêu tả tâm lí đạt đến độ tinh tế: tâm trạng Thanh được bộc lộ qua cử chỉ, ánh mắt, cảm giác chứ không qua lời nói trực tiếp. Cây hoàng lan trở thành hình tượng trung tâm, vừa là cảnh vật vừa là biểu tượng của quê hương, của tình yêu trong sáng. Giọng văn nhẹ nhàng, man mác buồn — chất thơ thấm đượm từng câu chữ. Cốt truyện hầu như không có xung đột gay cấn, nhưng chính sự giản dị ấy làm nên sức hấp dẫn đặc biệt: truyện của Thạch Lam là truyện của tâm hồn. Đánh giá chung, Dưới bóng hoàng lan là viên ngọc quý của truyện ngắn Việt Nam: nội dung nhân văn sâu sắc, nghệ thuật tinh tế, độc đáo. Với bạn đọc hôm nay, truyện nhắc nhở ta biết trân trọng cội nguồn, giữ gìn những tình cảm trong sáng giữa cuộc sống xô bồ. Đọc Thạch Lam, ta học được cách sống chậm lại để cảm nhận vẻ đẹp bình dị quanh mình."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Tác giả An-tôn Sê-khốp là nhà văn nước nào?", "options": ["A. Pháp", "B. Nga", "C. Việt Nam", "D. Anh"], "answer": "B", "points": 0.25, "explain": "An-tôn Sê-khốp (Anton Chekhov, 1860–1904) là bậc thầy truyện ngắn của văn học Nga."}, {"type": "mcq", "level": "NB", "q": "Biện pháp liệt kê có tác dụng gì?", "options": ["A. Làm câu văn khó hiểu", "B. Diễn đạt đầy đủ, cụ thể, tạo nhịp điệu cho câu văn", "C. Giảm bớt thông tin", "D. Thay thế hoàn toàn miêu tả"], "answer": "B", "points": 0.25, "explain": "Liệt kê kể ra hàng loạt sự vật, sự việc cùng loại giúp diễn đạt đầy đủ, cụ thể và tạo nhịp điệu cho lời văn."}, {"type": "mcq", "level": "TH", "q": "Chi tiết nào là nút thắt tâm lí trong truyện Một chuyện đùa nho nhỏ?", "options": ["A. Chiếc xe trượt tuyết", "B. Câu nói anh yêu em thì thầm trong gió", "C. Ngôi nhà của Na-đi-a", "D. Bữa tiệc cuối năm"], "answer": "B", "points": 0.25, "explain": "Câu nói anh yêu em lẫn trong tiếng gió là nút thắt tâm lí: Na-đi-a bán tín bán nghi, day dứt khôn nguôi; nó ám ảnh cả người nói lẫn người nghe suốt nhiều năm."}, {"type": "mcq", "level": "TH", "q": "Giọng văn chủ đạo trong truyện Dưới bóng hoàng lan là gì?", "options": ["A. Hài hước, dí dỏm", "B. Nhẹ nhàng, man mác buồn, giàu chất thơ", "C. Hùng hồn, đanh thép", "D. Gay gắt, phê phán"], "answer": "B", "points": 0.25, "explain": "Truyện Thạch Lam có giọng văn nhẹ nhàng, man mác buồn, giàu chất thơ — phù hợp với việc diễn tả những rung động tinh tế của tâm hồn."}, {"type": "mcq", "level": "VDC", "q": "Ý nghĩa sâu xa của nhan đề Một chuyện đùa nho nhỏ là gì?", "options": ["A. Ca ngợi trò đùa vui vẻ của tuổi trẻ", "B. Chuyện đùa tuy nhỏ nhưng hậu quả không nhỏ: gợi suy ngẫm về trách nhiệm với lời nói và tình cảm của người khác", "C. Chê bai nhân vật Na-đi-a", "D. Khuyên mọi người nên đùa nhiều hơn"], "answer": "B", "points": 0.25, "explain": "Nhan đề mang tính châm biếm, chua xót: chuyện đùa nho nhỏ đã làm thay đổi cả một đời người — lời nhắc về trách nhiệm với mỗi lời nói, mỗi tình cảm ta gieo vào lòng người khác."}, {"type": "short", "level": "NB", "q": "Nhân vật nữ chính trong đoạn trích Người cầm quyền khôi phục uy quyền tên là gì?", "answer": "Phăng-tin", "points": 0.5, "explain": "Phăng-tin là người mẹ khốn khổ, trước khi chết chỉ mong gặp con gái Cô-dét một lần; tình mẫu tử của chị là điểm sáng nhân văn của đoạn trích."}, {"type": "short", "level": "TH", "q": "Nêu điểm khác nhau cơ bản giữa ngôi kể thứ nhất và ngôi kể thứ ba.", "answer": "Ngôi thứ nhất: người kể xưng tôi, là nhân vật trong truyện, lời kể chủ quan gần gũi; ngôi thứ ba: người kể giấu mình đứng ngoài, lời kể khách quan hơn", "points": 0.5, "explain": "Ngôi thứ nhất (xưng tôi) gắn với nhân vật, chủ quan, hạn chế về tầm biết; ngôi thứ ba (giấu mình) đứng ngoài, có thể toàn tri, khách quan hơn."}, {"type": "short", "level": "VD", "q": "Phần chêm xen trong câu thường được đặt trong những dấu câu nào?", "answer": "Dấu ngoặc đơn, dấu gạch ngang (hoặc dấu phẩy)", "points": 0.5, "explain": "Phần chêm xen thường đặt trong dấu ngoặc đơn hoặc giữa hai dấu gạch ngang (đôi khi là dấu phẩy) để tách khỏi cấu trúc chính của câu."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích tâm lí nhân vật Na-đi-a trong truyện Một chuyện đùa nho nhỏ.", "points": 0, "explain": "DÀN Ý: Mở đoạn: giới thiệu Na-đi-a và tình huống (câu nói trong gió). Thân đoạn: diễn biến tâm lí: bán tín bán nghi, tò mò, nài nỉ được nghe lại; vừa hi vọng vừa sợ hãi; nhiều năm day dứt không nguôi; khi biết sự thật thì đã muộn. Nghệ thuật: ngôi kể thứ nhất, điểm nhìn hồi cố; chi tiết tâm lí đắt giá. Kết đoạn: Na-đi-a là nạn nhân của sự vô tình; vẻ đẹp tâm hồn trong sáng. BÀI MẪU: Na-đi-a trong Một chuyện đùa nho nhỏ là một tâm hồn trong sáng trở thành nạn nhân của sự vô tình. Khi nghe câu nói anh yêu em lẫn trong tiếng gió lúc xe lao dốc, cô gái rơi vào trạng thái bán tín bán nghi đầy day dứt: vừa hi vọng đó là lời tỏ tình thật, vừa sợ mình ngộ nhận. Tâm lí ấy được Sê-khốp khắc họa tinh tế qua những lần Na-đi-a nài nỉ người kể cùng trượt tuyết chỉ để được nghe lại câu nói ấy — niềm khao khát hạnh phúc thật đáng thương. Nỗi day dứt theo cô suốt nhiều năm, ngay cả khi đã đi lấy chồng, câu nói năm xưa vẫn ám ảnh. Khi người kể thú nhận đó chỉ là chuyện đùa, sự thật đến quá muộn: tuổi trẻ và niềm tin trong sáng đã không thể lấy lại. Qua Na-đi-a, Sê-khốp không chỉ vẽ nên một cô gái đáng thương mà còn gióng lên hồi chuông cảnh tỉnh: đừng bao giờ đùa cợt với tình cảm của người khác, bởi vết thương lòng có khi theo người ta suốt cả cuộc đời."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận phân tích, đánh giá truyện ngắn Một chuyện đùa nho nhỏ của Sê-khốp.", "points": 0, "explain": "DÀN Ý: Mở bài: giới thiệu Sê-khốp và tác phẩm; nêu vấn đề phân tích, đánh giá. Thân bài: Tóm tắt ngắn. Phân tích nội dung: câu chuyện về trò đùa và hậu quả; số phận Na-đi-a; tư tưởng: phê phán sự vô tình, gióng chuông trách nhiệm với lời nói, tình cảm. Phân tích nghệ thuật: ngôi kể thứ nhất hồi cố; chi tiết câu nói trong gió; giọng văn hóm hỉnh mà chua xót; kết thúc mở. Đánh giá: giá trị nội dung, nghệ thuật; ý nghĩa với bạn đọc. Kết bài: khẳng định, cảm nghĩ. BÀI MẪU: Một chuyện đùa nho nhỏ là một trong những truyện ngắn đặc sắc của An-tôn Sê-khốp — bậc thầy truyện ngắn Nga với ngòi bút vừa hóm hỉnh vừa chua xót. Truyện kể về thời trẻ của người kể chuyện xưng tôi: trong một lần trượt tuyết cùng Na-đi-a, anh đã thì thầm câu nói anh yêu em lẫn trong tiếng gió. Câu nói nửa thật nửa đùa ấy khiến Na-đi-a bán tín bán nghi, day dứt khôn nguôi, cứ nài nỉ được nghe lại. Nhiều năm sau, khi Na-đi-a đã đi lấy chồng, anh mới thú nhận đó chỉ là chuyện đùa nho nhỏ. Về nội dung, truyện là lời phê phán nhẹ nhàng mà thấm thía thói vô tình, thiếu trách nhiệm với lời nói và tình cảm của người khác. Nhan đề mang tính châm biếm: chuyện đùa tuy nho nhỏ nhưng đã làm thay đổi cả số phận một con người. Qua số phận Na-đi-a, Sê-khốp gióng lên hồi chuông cảnh tỉnh: mỗi lời ta nói ra đều có thể gieo vào lòng người khác niềm hi vọng hoặc nỗi đau — hãy có trách nhiệm với lời nói của mình. Về nghệ thuật, Sê-khốp chọn ngôi kể thứ nhất với điểm nhìn hồi cố: câu chuyện là lời thú nhận day dứt của chính thủ phạm, tạo độ chân thực và sức ám ảnh. Chi tiết câu nói trong gió trở thành nút thắt tâm lí đắt giá, vừa mơ hồ vừa ám ảnh. Giọng văn hóm hỉnh bề ngoài mà chua xót bên trong — đúng phong cách Sê-khốp. Kết thúc mở để lại dư âm suy ngẫm: sau lời thú nhận, mỗi người sẽ ra sao? Đánh giá chung, đây là truyện ngắn mẫu mực về nghệ thuật: ít sự kiện mà giàu suy tư, nhẹ nhàng mà sâu sắc. Với bạn đọc hôm nay, truyện nhắc ta bài học về sự chân thành và trách nhiệm trong tình cảm — đừng bao giờ đùa cợt với trái tim người khác, bởi có những vết thương không bao giờ lành."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Nhân vật Gia-ve trong đoạn trích Người cầm quyền khôi phục uy quyền là ai?", "options": ["A. Một viên cảnh sát đại diện cho pháp luật máy móc, tàn nhẫn", "B. Bạn thân của Giăng Van-giăng", "C. Con gái của Phăng-tin", "D. Một người nông dân hiền lành"], "answer": "A", "points": 0.25, "explain": "Gia-ve là viên cảnh sát truy bắt Giăng Van-giăng, đại diện cho pháp luật máy móc, tàn nhẫn — tương phản với lòng nhân ái của Giăng Van-giăng."}, {"type": "mcq", "level": "NB", "q": "Truyện Con khướu sổ lồng của Nguyễn Quang Sáng viết về tình cảm nào?", "options": ["A. Tình bạn", "B. Tình cha con trong kháng chiến", "C. Tình yêu đôi lứa", "D. Tình thầy trò"], "answer": "B", "points": 0.25, "explain": "Con khướu sổ lồng viết về tình cha con tha thiết trong những năm kháng chiến: người cha đi xa, nỗi nhớ con da diết."}, {"type": "mcq", "level": "TH", "q": "Vì sao nói người kể chuyện có quyền năng?", "options": ["A. Vì người kể được trả nhiều tiền", "B. Vì người kể được lựa chọn ngôi kể, điểm nhìn, cách sắp xếp chi tiết để dẫn dắt cảm xúc người đọc", "C. Vì người kể luôn là tác giả", "D. Vì người kể được quyết định giá sách"], "answer": "B", "points": 0.25, "explain": "Quyền năng của người kể chuyện thể hiện ở việc lựa chọn ngôi kể, điểm nhìn, thứ tự chi tiết — từ đó định hướng cách người đọc cảm nhận câu chuyện."}, {"type": "mcq", "level": "TH", "q": "Câu nào sử dụng biện pháp chêm xen?", "options": ["A. Vườn nhà có na, ổi, hoàng lan.", "B. Thanh — chàng trai hiền hậu — lặng nhìn cây hoàng lan.", "C. Thanh về quê thăm bà.", "D. Trời hôm nay đẹp quá!"], "answer": "B", "points": 0.25, "explain": "Câu B có phần chêm xen chàng trai hiền hậu đặt giữa hai dấu gạch ngang để bổ sung, nhấn mạnh đặc điểm nhân vật."}, {"type": "mcq", "level": "VDC", "q": "Điểm giống nhau về nghệ thuật của ba truyện trong Bài 7 là gì?", "options": ["A. Cùng dùng ngôi kể thứ nhất", "B. Cùng chú trọng khám phá tâm lí, tình cảm con người hơn là tình tiết gay cấn", "C. Cùng viết về chiến tranh", "D. Cùng có kết thúc có hậu"], "answer": "B", "points": 0.25, "explain": "Cả ba truyện đều hướng vào thế giới nội tâm: day dứt của Giăng Van-giăng, rung động của Thanh, dằn vặt của người kể chuyện — tình tiết chỉ là cái cớ để bộc lộ tâm lí."}, {"type": "short", "level": "NB", "q": "Người kể chuyện có đồng nhất với tác giả không?", "answer": "Không", "points": 0.5, "explain": "Người kể chuyện là một vai do tác giả sáng tạo ra để kể chuyện, không đồng nhất với tác giả ngoài đời."}, {"type": "short", "level": "TH", "q": "Nêu hai biểu hiện của tình mẫu tử trong đoạn trích Người cầm quyền khôi phục uy quyền.", "answer": "Phăng-tin ốm nặng vẫn chỉ mong gặp con gái Cô-dét; Giăng Van-giăng hứa đón Cô-dét về khiến Phăng-tin yên lòng nhắm mắt", "points": 0.5, "explain": "Tình mẫu tử thể hiện qua nỗi mong con da diết của Phăng-tin lúc hấp hối và niềm tin, sự thanh thản của chị khi biết con sẽ được cứu giúp."}, {"type": "short", "level": "VD", "q": "Khi viết bài nghị luận phân tích một tác phẩm truyện, vì sao dẫn chứng phải lấy từ chính tác phẩm?", "answer": "Vì dẫn chứng từ tác phẩm mới chính xác, có sức thuyết phục; tránh suy diễn chủ quan", "points": 0.5, "explain": "Mọi nhận định về tác phẩm đều phải có căn cứ từ chi tiết, lời nhân vật trong tác phẩm; dẫn chứng ngoài tác phẩm dễ dẫn đến suy diễn chủ quan, thiếu sức thuyết phục."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích vẻ đẹp tâm hồn nhân vật Thanh trong truyện Dưới bóng hoàng lan.", "points": 0, "explain": "DÀN Ý: Mở đoạn: giới thiệu Thanh. Thân đoạn: hiền hậu, nhạy cảm (cảm nhận tinh tế về quê hương); nặng tình với quê (nhớ nhà, nhớ bà, nhớ vườn cây); tình cảm trong sáng với Nga; trân trọng những giá trị bình dị. Nghệ thuật: miêu tả tâm lí qua cảm giác, cử chỉ. Kết đoạn: Thanh là hiện thân của con người gắn bó với cội nguồn. BÀI MẪU: Thanh trong Dưới bóng hoàng lan hiện lên với một tâm hồn đẹp, nhạy cảm và nặng tình với quê hương. Sau hai năm xa cách, trở về ngôi nhà cũ, Thanh xúc động trước từng cảnh vật thân thuộc: mái nhà, mảnh vườn, cây hoàng lan thơm ngát — mỗi thứ đều gợi bao kỉ niệm tuổi thơ. Tâm hồn anh tinh tế đến mức cảm nhận được cả hương thơm, màu nắng, tiếng lá xào xạc như những người bạn cũ. Tình cảm của Thanh với Nga trong sáng, e ấp: không lời tỏ tình ồn ào, chỉ là những ánh nhìn, những bước chân song song dưới bóng hoàng lan mà chứa chan thương mến. Đặc biệt, Thanh trân trọng những giá trị bình dị: với anh, hạnh phúc không ở chốn phồn hoa mà ở mái nhà quê, ở người bà hiền từ, ở hương hoàng lan thoang thoảng. Thạch Lam đã khắc họa Thanh bằng nghệ thuật miêu tả tâm lí tinh tế qua cảm giác và cử chỉ, không cần lời thoại nhiều. Thanh chính là hiện thân của con người Việt Nam gắn bó máu thịt với cội nguồn — đi xa để rồi càng thêm yêu quê hương."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận phân tích, đánh giá đoạn trích Người cầm quyền khôi phục uy quyền (V. Hugo).", "points": 0, "explain": "DÀN Ý: Mở bài: giới thiệu Hugo, tiểu thuyết Những người khốn khổ, đoạn trích. Thân bài: Tóm tắt ngắn. Phân tích nội dung: tình mẫu tử thiêng liêng (Phăng-tin); vẻ đẹp Giăng Van-giăng (nhân ái, dũng cảm, uy quyền đạo đức); sự tương phản với Gia-ve; tư tưởng nhân đạo. Phân tích nghệ thuật: ngôi kể thứ ba, điểm nhìn linh hoạt; tương phản; miêu tả tâm lí; giọng văn bi tráng. Đánh giá: giá trị nội dung và nghệ thuật; ý nghĩa. Kết bài: khẳng định, cảm nghĩ. BÀI MẪU: Đoạn trích Người cầm quyền khôi phục uy quyền thuộc tiểu thuyết Những người khốn khổ của đại văn hào Pháp Vích-to Huy-gô — bản anh hùng ca về lòng nhân ái. Đoạn trích kể về giờ phút cuối đời của Phăng-tin: chị ốm nặng, chỉ mong gặp con gái Cô-dét một lần. Giăng Van-giăng hứa sẽ đón Cô-dét về. Đúng lúc ấy, Gia-ve ập đến bắt Giăng Van-giăng. Trước người sắp chết, Giăng Van-giăng đã khôi phục uy quyền của lương tri: buộc Gia-ve phải chờ, phải tôn trọng lời hứa thiêng liêng. Phăng-tin tắt thở trong niềm tin con gái được cứu. Về nội dung, đoạn trích ngợi ca tình mẫu tử thiêng liêng qua hình ảnh Phăng-tin: đến lúc hấp hối, điều duy nhất chị nghĩ đến là con. Nhân vật trung tâm Giăng Van-giăng hiện lên với vẻ đẹp cao thượng: từng lầm lỗi nhưng đã được cảm hóa thành con người của lòng nhân ái, dám đối đầu với cái ác để bảo vệ lẽ phải. Uy quyền của ông không đến từ địa vị mà từ đạo đức — khiến Gia-ve, đại diện cho pháp luật máy móc tàn nhẫn, cũng phải khuất phục. Nghệ thuật tương phản thiện – ác được Hugo sử dụng đắc địa, làm nổi bật tư tưởng nhân đạo: cái thiện, tình thương có sức mạnh chiến thắng. Về nghệ thuật, Hugo dùng ngôi kể thứ ba với điểm nhìn linh hoạt, lúc bao quát, lúc xoáy sâu vào tâm lí từng nhân vật; miêu tả tâm lí tinh tế (nỗi đau của Phăng-tin, sự giằng xé của Giăng Van-giăng, cơn giận của Gia-ve); giọng văn bi tráng, giàu cảm xúc. Đánh giá chung, đoạn trích là một trong những trang văn xúc động nhất của văn học nhân loại: vừa là bản án đanh thép với xã hội bất công, vừa là bài ca về lòng nhân ái. Với bạn đọc hôm nay, đoạn trích nhắc ta tin vào sức mạnh của tình thương và luôn đứng về phía lẽ phải, phía con người."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Hình ảnh con khướu sổ lồng trong truyện Nguyễn Quang Sáng là biểu tượng của điều gì?", "options": ["A. Sự giàu sang", "B. Khát vọng tự do, sum họp", "C. Nỗi sợ hãi", "D. Sự chia ly vĩnh viễn"], "answer": "B", "points": 0.25, "explain": "Con khướu sổ lồng là biểu tượng của khát vọng tự do, khát vọng sum họp gia đình trong những năm tháng kháng chiến đầy gian khổ."}, {"type": "mcq", "level": "NB", "q": "Trong bài văn nghị luận về tác phẩm truyện, mở bài cần nêu những gì?", "options": ["A. Kể toàn bộ cốt truyện", "B. Giới thiệu tác giả, tác phẩm và vấn đề phân tích, đánh giá khái quát", "C. Phê phán nhân vật", "D. Nêu cảm nghĩ cá nhân về thời sự"], "answer": "B", "points": 0.25, "explain": "Mở bài giới thiệu tác giả, tác phẩm và nêu vấn đề phân tích, đánh giá một cách khái quát, định hướng cho toàn bài."}, {"type": "mcq", "level": "TH", "q": "Lời nhân vật trong truyện có vai trò gì?", "options": ["A. Trang trí cho đẹp", "B. Bộc lộ trực tiếp tính cách, tâm lí nhân vật", "C. Thay thế hoàn toàn lời kể", "D. Không có vai trò gì"], "answer": "B", "points": 0.25, "explain": "Lời nhân vật (đối thoại, độc thoại nội tâm) bộc lộ trực tiếp tính cách, tâm lí, quan điểm của nhân vật; kết hợp với lời kể tạo nên sự sinh động."}, {"type": "mcq", "level": "TH", "q": "Câu nào sử dụng biện pháp liệt kê?", "options": ["A. Thanh — chàng trai hiền hậu — lặng nhìn xa xăm.", "B. Vườn nhà có na, ổi, hoàng lan, hoa sói thơm ngát.", "C. Thanh về quê thăm bà.", "D. Na-đi-a rất xinh đẹp."], "answer": "B", "points": 0.25, "explain": "Câu B liệt kê hàng loạt cây trái trong vườn (na, ổi, hoàng lan, hoa sói) — diễn đạt đầy đủ, cụ thể, tạo nhịp điệu."}, {"type": "mcq", "level": "VDC", "q": "Nhận định nào đúng về mối quan hệ giữa phân tích nghệ thuật và phân tích nội dung khi viết bài nghị luận về tác phẩm truyện?", "options": ["A. Chỉ cần phân tích nội dung, bỏ qua nghệ thuật", "B. Phân tích nghệ thuật phải luôn gắn với nội dung: mỗi biện pháp nghệ thuật đều phục vụ việc thể hiện nội dung, tư tưởng", "C. Nghệ thuật và nội dung không liên quan gì đến nhau", "D. Chỉ cần khen nghệ thuật hay là đủ"], "answer": "B", "points": 0.25, "explain": "Nghệ thuật và nội dung thống nhất với nhau: phân tích ngôi kể, điểm nhìn, hình ảnh... phải chỉ ra chúng góp phần thể hiện nội dung, tư tưởng như thế nào — tránh phân tích hình thức suông."}, {"type": "short", "level": "NB", "q": "Kể tên ba truyện đọc chính của Bài 7.", "answer": "Người cầm quyền khôi phục uy quyền, Dưới bóng hoàng lan, Một chuyện đùa nho nhỏ", "points": 0.5, "explain": "Ba truyện đọc chính: Người cầm quyền khôi phục uy quyền (V. Hugo), Dưới bóng hoàng lan (Thạch Lam), Một chuyện đùa nho nhỏ (Sê-khốp)."}, {"type": "short", "level": "TH", "q": "Nêu hai ưu điểm của ngôi kể thứ nhất.", "answer": "Tạo độ chân thực, gần gũi như lời chứng; bộc lộ trực tiếp tâm lí, suy nghĩ của nhân vật kể", "points": 0.5, "explain": "Ngôi thứ nhất (xưng tôi) tạo cảm giác chân thực như người trong cuộc kể lại; dễ bộc lộ trực tiếp tâm lí, suy ngẫm của nhân vật kể chuyện."}, {"type": "short", "level": "VD", "q": "Vì sao không nên lạm dụng biện pháp chêm xen trong câu văn?", "answer": "Vì làm câu văn rườm rà, đứt mạch, khó theo dõi", "points": 0.5, "explain": "Chêm xen quá nhiều khiến câu văn rườm rà, đứt mạch ý, người đọc khó theo dõi mạch chính — chỉ nên dùng khi thật cần bổ sung, nhấn mạnh."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về tình cảm quê hương trong truyện Dưới bóng hoàng lan.", "points": 0, "explain": "DÀN Ý: Mở đoạn: tình quê là mạch cảm xúc chính của truyện. Thân đoạn: quê hương hiện lên qua ngôi nhà, người bà, vườn cây, hương hoàng lan; tình cảm của Thanh: nhớ nhung, trân trọng, xem quê là cội nguồn; nghệ thuật: hình ảnh giàu sức gợi, giọng văn man mác. Kết đoạn: bài học về lòng yêu quê hương. BÀI MẪU: Tình cảm quê hương là mạch cảm xúc chủ đạo, thấm đượm trong từng trang của Dưới bóng hoàng lan. Quê hương hiện lên qua những hình ảnh thân thuộc mà thiêng liêng: ngôi nhà cũ với mái ngói rêu phong, người bà hiền từ tóc bạc, mảnh vườn xanh mát và đặc biệt là cây hoàng lan thơm ngát — tất cả đều gắn với tuổi thơ của Thanh. Sau hai năm xa cách, trở về, Thanh xúc động nhận ra quê hương chính là cội nguồn nuôi dưỡng tâm hồn mình; mỗi cảnh vật đều như người bạn cũ đón chào. Tình yêu quê của Thanh không ồn ào mà sâu lắng: anh trân trọng từng hương thơm, màu nắng, lặng ngắm và ghi nhớ để mang theo khi trở lại thành phố. Thạch Lam đã diễn tả tình quê bằng những hình ảnh giàu sức gợi và giọng văn man mác, khiến người đọc cũng thấy lòng mình xao xuyến. Truyện nhắc nhở chúng ta: dù đi đâu, làm gì, quê hương vẫn là nơi để trở về; hãy biết yêu và gìn giữ những giá trị bình dị mà thiêng liêng ấy."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ trình bày suy nghĩ của em về ý kiến: Người kể chuyện có quyền năng định hướng cảm xúc của người đọc.", "points": 0, "explain": "DÀN Ý: Mở bài: giới thiệu vấn đề (quyền năng người kể chuyện). Thân bài: Giải thích: người kể lựa chọn ngôi kể, điểm nhìn, chi tiết. Chứng minh qua ba truyện Bài 7: ngôi thứ nhất trong Một chuyện đùa nho nhỏ (lời thú nhận day dứt); ngôi thứ ba + điểm nhìn Thanh trong Dưới bóng hoàng lan (cùng rung động); điểm nhìn linh hoạt + tương phản trong Người cầm quyền khôi phục uy quyền (dẫn dắt căm phẫn, xúc động). Bàn luận: quyền năng ấy đòi hỏi trách nhiệm (định hướng đúng đắn); người đọc cần tỉnh táo. Kết bài: khẳng định. BÀI MẪU: Trong nghệ thuật truyện, người kể chuyện nắm một quyền năng đặc biệt: định hướng cảm xúc của người đọc. Quyền năng ấy thể hiện ở việc lựa chọn ngôi kể, điểm nhìn trần thuật và cách sắp xếp chi tiết — mỗi lựa chọn đều dẫn dắt người đọc cảm nhận câu chuyện theo một hướng nhất định. Trong Một chuyện đùa nho nhỏ, Sê-khốp dùng ngôi kể thứ nhất để biến câu chuyện thành lời thú nhận day dứt của chính thủ phạm; người đọc vừa trách vừa thương, vừa day dứt cùng nhân vật — điều mà ngôi kể thứ ba khó đạt được. Trong Dưới bóng hoàng lan, Thạch Lam dùng ngôi thứ ba nhưng gắn điểm nhìn vào nhân vật Thanh, khiến người đọc cùng xúc động, cùng nhớ quê, cùng rung động trước tình yêu trong sáng. Còn Hugo trong Người cầm quyền khôi phục uy quyền lại dùng điểm nhìn linh hoạt kết hợp nghệ thuật tương phản: người đọc căm phẫn Gia-ve, xót thương Phăng-tin và khâm phục Giăng Van-giăng — mọi cảm xúc đều được người kể dẫn dắt khéo léo. Như vậy, cùng một câu chuyện, đổi người kể, đổi điểm nhìn thì ý nghĩa và cảm xúc sẽ đổi khác. Quyền năng lớn đi kèm trách nhiệm lớn: người kể phải định hướng người đọc đến những giá trị nhân văn, chứ không thể bóp méo sự thật hay gieo rắc định kiến. Về phía người đọc, ta cũng cần tỉnh táo: nhận ra bàn tay dẫn dắt của người kể để không bị cảm xúc lôi cuốn một chiều, biết đặt câu hỏi và suy ngẫm độc lập. Hiểu được quyền năng của người kể chuyện, ta sẽ đọc truyện sâu sắc hơn — không chỉ xem kể gì mà còn xem kể như thế nào, vì sao kể như thế."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Tác giả của truyện Con khướu sổ lồng là ai?", "options": ["A. Nguyễn Quang Sáng", "B. Thạch Lam", "C. Tô Hoài", "D. Nguyễn Tuân"], "answer": "A", "points": 0.25, "explain": "Con khướu sổ lồng là truyện ngắn của Nguyễn Quang Sáng (1932–2014), nhà văn Nam Bộ nổi tiếng với Chiếc lược ngà."}, {"type": "mcq", "level": "NB", "q": "Trong truyện Dưới bóng hoàng lan, Nga là ai?", "options": ["A. Bà của Thanh", "B. Cô gái hàng xóm, người bạn tuổi thơ của Thanh", "C. Mẹ của Thanh", "D. Cô giáo của Thanh"], "answer": "B", "points": 0.25, "explain": "Nga là cô gái hàng xóm, người bạn tuổi thơ của Thanh; tình cảm trong sáng giữa hai người nảy nở dưới bóng hoàng lan."}, {"type": "mcq", "level": "TH", "q": "Hạn chế của ngôi kể thứ nhất là gì?", "options": ["A. Không tạo được sự gần gũi", "B. Người kể chỉ biết những gì nhân vật biết, tầm nhìn bị giới hạn", "C. Không thể bộc lộ tâm lí", "D. Luôn kém hấp dẫn hơn ngôi thứ ba"], "answer": "B", "points": 0.25, "explain": "Ngôi thứ nhất gắn với nhân vật nên chỉ biết những gì nhân vật biết, chứng kiến — tầm nhìn bị giới hạn, thiếu cái nhìn toàn cảnh, khách quan."}, {"type": "mcq", "level": "TH", "q": "Tình huống nào làm nổi bật uy quyền đạo đức của Giăng Van-giăng?", "options": ["A. Ông bỏ trốn khỏi nhà tù", "B. Trước mặt Phăng-tin hấp hối, ông ra lệnh cho Gia-ve phải chờ, buộc hắn tôn trọng lời hứa", "C. Ông tặng tiền cho Gia-ve", "D. Ông kể chuyện cười cho Phăng-tin nghe"], "answer": "B", "points": 0.25, "explain": "Trước người sắp chết, Giăng Van-giăng khôi phục uy quyền: ra lệnh cho Gia-ve phải chờ đợi, buộc kẻ đại diện pháp luật phải khuất phục trước lẽ phải và tình người."}, {"type": "mcq", "level": "VDC", "q": "Vì sao truyện của Thạch Lam được gọi là truyện của tâm hồn?", "options": ["A. Vì truyện rất dài", "B. Vì cốt truyện đơn giản, ít xung đột; sức hấp dẫn nằm ở diễn biến tâm trạng và rung động tinh tế của nhân vật", "C. Vì truyện viết về ma quỷ", "D. Vì truyện không có nhân vật"], "answer": "B", "points": 0.25, "explain": "Truyện Thạch Lam ít sự kiện, không có xung đột gay cấn; giá trị nằm ở việc khám phá những rung động tinh tế của tâm hồn con người trước vẻ đẹp bình dị."}, {"type": "short", "level": "NB", "q": "V. Hugo là nhà văn nước nào?", "answer": "Pháp", "points": 0.5, "explain": "Vích-to Huy-gô (Victor Hugo, 1802–1885) là đại văn hào Pháp, tác giả Những người khốn khổ, Nhà thờ Đức Bà Pa-ri."}, {"type": "short", "level": "TH", "q": "Nêu hai dấu hiệu nhận biết phần chêm xen trong câu.", "answer": "Đặt trong dấu ngoặc đơn hoặc giữa hai dấu gạch ngang", "points": 0.5, "explain": "Phần chêm xen thường được đặt trong dấu ngoặc đơn hoặc giữa hai dấu gạch ngang (đôi khi là dấu phẩy) để tách khỏi cấu trúc chính."}, {"type": "short", "level": "VD", "q": "Trong bài nghị luận về tác phẩm truyện, phần đánh giá cần nêu những gì?", "answer": "Giá trị nội dung, giá trị nghệ thuật của tác phẩm và ý nghĩa với người đọc", "points": 0.5, "explain": "Phần đánh giá khẳng định giá trị nội dung (tư tưởng, nhân văn) và giá trị nghệ thuật (độc đáo, thành công), nêu ý nghĩa, sức sống của tác phẩm với người đọc."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích nghệ thuật miêu tả tâm lí nhân vật trong truyện Dưới bóng hoàng lan.", "points": 0, "explain": "DÀN Ý: Mở đoạn: Thạch Lam bậc thầy miêu tả tâm lí. Thân đoạn: tâm lí Thanh bộc lộ qua cảm giác (hương hoàng lan, màu nắng), cử chỉ, ánh mắt chứ không qua lời nói trực tiếp; diễn biến: xúc động khi về quê, e ấp bên Nga, lưu luyến khi ra đi; điểm nhìn gắn với Thanh. Kết đoạn: nghệ thuật tinh tế làm nên sức hấp dẫn. BÀI MẪU: Nghệ thuật miêu tả tâm lí trong Dưới bóng hoàng lan đạt đến độ tinh tế hiếm có, làm nên phong cách Thạch Lam. Nhà văn không để nhân vật nói nhiều về cảm xúc của mình mà để tâm trạng tự bộc lộ qua cảm giác và cử chỉ: Thanh cảm nhận hương hoàng lan thơm ngát, thấy màu nắng vàng rải trên sân, nghe tiếng lá xào xạc — mỗi cảm giác đều thấm đượm nỗi nhớ và niềm thương. Khi gặp Nga, tình cảm e ấp của hai người được diễn tả qua những ánh nhìn ngại ngùng, những bước chân song song chứ không một lời tỏ tình trực tiếp — càng kín đáo càng sâu sắc. Diễn biến tâm trạng Thanh theo một mạch thống nhất: xúc động khi trở về, xao xuyến bên Nga, lưu luyến khi ra đi. Điểm nhìn trần thuật gắn chặt với Thanh giúp người đọc như cùng sống trong tâm hồn anh. Chính nghệ thuật đi sâu vào những rung động mong manh ấy đã biến một câu chuyện đơn giản thành một bản nhạc tâm hồn, khiến người đọc nhớ mãi."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề: Sống chậm lại để cảm nhận vẻ đẹp cuộc sống (gợi ý từ truyện Thạch Lam).", "points": 0, "explain": "DÀN Ý: Mở bài: nhịp sống vội vã hiện nay; vấn đề: cần sống chậm lại. Thân bài: Giải thích: sống chậm là dành thời gian cảm nhận, trân trọng những điều bình dị. Thực trạng: nhiều người cuốn vào guồng quay, lướt qua vẻ đẹp quanh mình; một số bạn trẻ bắt đầu tìm về lối sống chậm. Nguyên nhân: áp lực công việc, học tập; công nghệ khiến mọi thứ nhanh, gấp. Hậu quả: căng thẳng, vô cảm, bỏ lỡ hạnh phúc bình dị. Bàn luận: sống chậm không phải lười biếng mà là sống sâu sắc, chất lượng; như nhân vật Thanh biết rung động trước hương hoàng lan. Dẫn chứng: những người thành công vẫn giữ thói quen tận hưởng bình dị. Giải pháp: dành thời gian cho gia đình, thiên nhiên; hạn chế dán mắt vào điện thoại; tập quan sát, lắng nghe. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Cuộc sống hiện đại cuốn con người vào guồng quay vội vã: sáng vội đi làm, trưa vội ăn, tối vội lướt điện thoại rồi đi ngủ. Giữa nhịp sống ấy, biết bao vẻ đẹp bình dị bị ta lướt qua mà không hay. Vì vậy, sống chậm lại để cảm nhận vẻ đẹp cuộc sống là điều rất cần thiết, nhất là với giới trẻ. Sống chậm không có nghĩa là lười biếng, tụt hậu; đó là cách sống có ý thức: dành thời gian để quan sát, lắng nghe, cảm nhận những điều bình dị quanh mình — một buổi sáng trong lành, một bữa cơm gia đình ấm cúng, một lời hỏi thăm chân thành. Như nhân vật Thanh trong Dưới bóng hoàng lan của Thạch Lam: chỉ cần trở về quê, anh đã thấy lòng xao xuyến trước hương hoàng lan, màu nắng, tiếng lá — những thứ mà người vội vã chẳng bao giờ nhận ra. Thực tế, nhiều bạn trẻ ngày nay sống quá nhanh: ăn vội, học vội, yêu vội, mọi cảm xúc đều lướt qua như story 24 giờ rồi biến mất. Nguyên nhân là áp lực học tập, công việc và sự chi phối của công nghệ khiến ta luôn trong trạng thái gấp gáp. Hậu quả là căng thẳng, mệt mỏi, vô cảm trước vẻ đẹp và cả nỗi đau của người khác; ta có nhiều thứ mà ít hạnh phúc. Sống chậm giúp ta lấy lại cân bằng: tâm hồn thư thái, các mối quan hệ bền chặt, biết trân trọng hiện tại. Để sống chậm, hãy bắt đầu từ việc nhỏ: mỗi ngày dành ít phút ngắm bầu trời, trò chuyện với người thân không dùng điện thoại, đi bộ thay vì lúc nào cũng vội vàng. Gia đình và nhà trường cũng nên tạo không gian để các em được thảnh thơi, gần gũi thiên nhiên. Hạnh phúc không ở đâu xa — nó nằm trong những điều bình dị mà chỉ người biết sống chậm mới cảm nhận được. Hãy sống chậm lại, để mỗi ngày trôi qua đều đáng nhớ."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Kiểu bài viết của Bài 7 là gì?", "options": ["A. Bài văn nghị luận phân tích, đánh giá một tác phẩm truyện", "B. Văn bản nội quy", "C. Bài luận về bản thân", "D. Văn bản nghị luận về một vấn đề xã hội"], "answer": "A", "points": 0.25, "explain": "Kiểu bài viết của Bài 7 là bài văn nghị luận phân tích, đánh giá một tác phẩm truyện (phân tích nội dung, nghệ thuật rồi đánh giá giá trị)."}, {"type": "mcq", "level": "NB", "q": "Phần Nói và nghe của Bài 7 yêu cầu thảo luận về vấn đề gì?", "options": ["A. Vấn đề xã hội", "B. Vấn đề văn học có ý kiến khác nhau", "C. Văn bản nội quy", "D. Kế hoạch tương lai"], "answer": "B", "points": 0.25, "explain": "Phần Nói và nghe của Bài 7 là thảo luận về một vấn đề văn học có ý kiến khác nhau — rèn kĩ năng tranh luận về văn chương."}, {"type": "mcq", "level": "TH", "q": "Tình mẫu tử trong đoạn trích Người cầm quyền khôi phục uy quyền được thể hiện qua chi tiết nào?", "options": ["A. Phăng-tin ốm nặng vẫn chỉ mong gặp con gái Cô-dét một lần", "B. Phăng-tin mắng Gia-ve", "C. Phăng-tin bỏ đi xa", "D. Phăng-tin không quan tâm đến con"], "answer": "A", "points": 0.25, "explain": "Đến lúc hấp hối, điều duy nhất Phăng-tin mong mỏi là được gặp con gái Cô-dét — tình mẫu tử thiêng liêng, cảm động."}, {"type": "mcq", "level": "TH", "q": "Câu văn nào dưới đây KHÔNG sử dụng biện pháp liệt kê?", "options": ["A. Vườn nhà có na, ổi, hoàng lan thơm ngát.", "B. Cô bé có đôi mắt to, mái tóc dài, nụ cười tươi.", "C. Thanh lặng lẽ bước vào nhà.", "D. Trên bàn có sách, vở, bút, thước kẻ."], "answer": "C", "points": 0.25, "explain": "Câu C chỉ là câu kể đơn, không liệt kê hàng loạt sự vật cùng loại như các câu còn lại."}, {"type": "mcq", "level": "VDC", "q": "Chi tiết con khướu sổ lồng có ý nghĩa biểu tượng gì?", "options": ["A. Sự giàu có của gia đình", "B. Khát vọng tự do, sum họp và tình cha con tha thiết trong chiến tranh", "C. Nỗi sợ bóng tối", "D. Sự chia rẽ gia đình"], "answer": "B", "points": 0.25, "explain": "Con chim sổ lồng bay về trời xanh là biểu tượng của khát vọng tự do, khát vọng sum họp; qua đó bộc lộ tình cha con tha thiết trong hoàn cảnh kháng chiến."}, {"type": "short", "level": "NB", "q": "Sê-khốp là nhà văn của nước nào?", "answer": "Nga", "points": 0.5, "explain": "An-tôn Sê-khốp (1860–1904) là bậc thầy truyện ngắn của văn học Nga."}, {"type": "short", "level": "TH", "q": "Nêu hai việc người kể chuyện được quyền lựa chọn khi kể một câu chuyện.", "answer": "Lựa chọn ngôi kể và điểm nhìn trần thuật (cách sắp xếp chi tiết)", "points": 0.5, "explain": "Người kể chuyện có quyền lựa chọn ngôi kể (thứ nhất/thứ ba), điểm nhìn trần thuật và cách sắp xếp chi tiết — đó chính là quyền năng của người kể chuyện."}, {"type": "short", "level": "VD", "q": "Khi liệt kê trong câu văn, cần chú ý điều gì về trật tự?", "answer": "Sắp xếp theo trật tự hợp lí (từ gần đến xa, từ nhỏ đến lớn, theo logic)", "points": 0.5, "explain": "Liệt kê cần theo trật tự hợp lí (không gian, thời gian, mức độ...) để câu văn mạch lạc, dễ theo dõi và tạo nhịp điệu đẹp."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích ý nghĩa chi tiết cây hoàng lan trong truyện Dưới bóng hoàng lan.", "points": 0, "explain": "DÀN Ý: Mở đoạn: cây hoàng lan — hình tượng trung tâm. Thân đoạn: gắn với kỉ niệm tuổi thơ của Thanh; chứng nhân tình cảm Thanh – Nga; biểu tượng của quê hương, của vẻ đẹp bình dị, trong sáng; hương thơm gợi nhớ, gợi thương. Kết đoạn: chi tiết giàu sức biểu cảm, làm nên linh hồn truyện. BÀI MẪU: Cây hoàng lan trong truyện của Thạch Lam không chỉ là một loài cây mà đã trở thành hình tượng trung tâm, là linh hồn của tác phẩm. Với Thanh, cây hoàng lan gắn với bao kỉ niệm tuổi thơ: những buổi chiều hái hoa, những trò chơi dưới bóng mát. Hương thơm ngát của hoa như còn lưu giữ cả một thời thơ ấu êm đềm. Cây hoàng lan cũng là chứng nhân cho tình cảm trong sáng giữa Thanh và Nga: dưới bóng cây, hai người dạo bước, tình cảm e ấp nảy nở nhẹ nhàng như hương hoa lan tỏa. Ở tầng ý nghĩa sâu hơn, cây hoàng lan là biểu tượng của quê hương — bình dị, thơm thảo, thủy chung; dù Thanh đi xa, hương hoàng lan vẫn theo anh như quê hương luôn ở trong tim. Thạch Lam đã chọn một chi tiết thật đắt: vừa cụ thể, gần gũi vừa giàu sức gợi, vừa là cảnh vừa là tình. Nhờ chi tiết cây hoàng lan, câu chuyện đơn giản trở nên thơ mộng, ám ảnh; người đọc gấp sách rồi mà hương hoàng lan như vẫn còn vương vấn đâu đây."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề: Trách nhiệm với lời nói của bản thân (gợi ý từ Một chuyện đùa nho nhỏ).", "points": 0, "explain": "DÀN Ý: Mở bài: lời nói có sức mạnh; vấn đề trách nhiệm với lời nói. Thân bài: Giải thích: trách nhiệm với lời nói là cân nhắc kĩ, nói đúng, nói thật, giữ lời hứa. Dẫn chứng từ truyện: câu nói đùa trong gió ám ảnh Na-đi-a cả đời. Thực trạng: nhiều người nói thiếu suy nghĩ (hứa suông, nói dối, bình luận ác ý); nhiều người cẩn trọng, giữ chữ tín. Nguyên nhân: vô tình, thiếu giáo dục, coi nhẹ lời nói. Hậu quả: mất niềm tin, tổn thương người khác, ảnh hưởng nhân cách. Bàn luận: lời nói chẳng mất tiền mua, lựa lời mà nói cho vừa lòng nhau; nhưng cũng cần chân thành, không giả dối. Giải pháp: suy nghĩ trước khi nói; giữ lời hứa; xin lỗi khi lỡ lời. Kết bài: khẳng định, nhắn nhủ. BÀI MẪU: Người xưa có câu: Lời nói chẳng mất tiền mua, lựa lời mà nói cho vừa lòng nhau. Lời nói là công cụ giao tiếp kì diệu, nhưng cũng như con dao hai lưỡi — nó có thể sưởi ấm lòng người, cũng có thể gây ra vết thương suốt đời. Vì vậy, trách nhiệm với lời nói của bản thân là phẩm chất mỗi người cần rèn luyện. Trách nhiệm với lời nói nghĩa là trước khi nói phải suy nghĩ kĩ: lời mình nói có đúng sự thật không, có làm tổn thương ai không; đã nói thì phải giữ lời, đã hứa thì phải thực hiện. Truyện Một chuyện đùa nho nhỏ của Sê-khốp là minh chứng thấm thía: chỉ một câu nói đùa anh yêu em thì thầm trong gió mà Na-đi-a day dứt cả tuổi thanh xuân, ám ảnh cả khi đã yên bề gia thất. Người kể chuyện phải mang theo nỗi ân hận suốt đời vì sự vô tình của mình. Trong cuộc sống, không ít người nói năng thiếu trách nhiệm: hứa suông rồi quên, nói dối để trục lợi, bình luận ác ý trên mạng làm tổn thương người khác, đùa cợt quá trớn với tình cảm bạn bè. Nguyên nhân là sự vô tình, thiếu giáo dục về văn hóa giao tiếp và tâm lí coi nhẹ lời nói gió bay. Hậu quả thì nặng nề: mất niềm tin của mọi người, gây tổn thương tinh thần khó lành, thậm chí đẩy người khác vào bế tắc. Ngược lại, những người cẩn trọng trong lời nói, nói đi đôi với làm luôn được mọi người tin yêu, kính trọng. Để rèn luyện, mỗi chúng ta hãy tập thói quen: uốn lưỡi bảy lần trước khi nói; không hứa những điều mình không làm được; khi lỡ lời, hãy dũng cảm xin lỗi và sửa chữa. Gia đình, nhà trường cần dạy trẻ biết tôn trọng lời nói từ nhỏ. Lời nói là tấm gương phản chiếu nhân cách. Hãy để mỗi lời ta nói ra đều là lời chân thành, có trách nhiệm — bởi có những lời nói, một khi đã thốt ra, sẽ theo người ta suốt cả cuộc đời."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Ai là tác giả của tiểu thuyết Những người khốn khổ?", "options": ["A. An-tôn Sê-khốp", "B. Vích-to Huy-gô", "C. Thạch Lam", "D. Nguyễn Quang Sáng"], "answer": "B", "points": 0.25, "explain": "Những người khốn khổ (Les Misérables) là tiểu thuyết nổi tiếng của đại văn hào Pháp Vích-to Huy-gô (Victor Hugo)."}, {"type": "mcq", "level": "NB", "q": "Ngôi kể của truyện Dưới bóng hoàng lan là ngôi thứ mấy?", "options": ["A. Ngôi thứ nhất", "B. Ngôi thứ ba", "C. Ngôi thứ hai", "D. Không xác định được"], "answer": "B", "points": 0.25, "explain": "Dưới bóng hoàng lan được kể bằng ngôi thứ ba (người kể giấu mình), với điểm nhìn gắn chặt vào nhân vật Thanh."}, {"type": "mcq", "level": "TH", "q": "Tâm trạng chủ đạo của nhân vật Thanh khi trở về quê là gì?", "options": ["A. Giận dữ, bực bội", "B. Xúc động, nhớ nhung, trân trọng những gì thân thuộc", "C. Thờ ơ, lạnh nhạt", "D. Sợ hãi, lo lắng"], "answer": "B", "points": 0.25, "explain": "Trở về sau hai năm xa cách, Thanh xúc động trước từng cảnh vật thân thuộc, trân trọng mái nhà, người bà, vườn cây — tình cảm quê hương sâu lắng."}, {"type": "mcq", "level": "TH", "q": "Điểm nhìn hồi cố trong Một chuyện đùa nho nhỏ có tác dụng gì?", "options": ["A. Làm truyện khó hiểu", "B. Tạo khoảng cách thời gian để người kể suy ngẫm, day dứt về quá khứ", "C. Giúp kể nhanh hơn", "D. Không có tác dụng gì"], "answer": "B", "points": 0.25, "explain": "Điểm nhìn hồi cố (nhớ lại chuyện xưa) tạo khoảng cách thời gian, giúp người kể suy ngẫm, day dứt về hành động vô tình của tuổi trẻ — tăng chiều sâu triết lí."}, {"type": "mcq", "level": "VDC", "q": "So sánh cách xây dựng nhân vật của Hugo và Thạch Lam qua hai đoạn trích, truyện đã học: điểm khác biệt lớn nhất là gì?", "options": ["A. Hugo dùng tương phản gay gắt thiện – ác; Thạch Lam đi sâu vào rung động tâm lí nhẹ nhàng", "B. Cả hai đều viết về chiến tranh", "C. Cả hai đều dùng ngôi thứ nhất", "D. Không có điểm khác biệt"], "answer": "A", "points": 0.25, "explain": "Hugo xây dựng nhân vật bằng tương phản gay gắt (Giăng Van-giăng – Gia-ve) trong xung đột dữ dội; Thạch Lam khám phá tâm lí qua những rung động nhẹ nhàng, không có xung đột gay cấn."}, {"type": "short", "level": "NB", "q": "Cô bé trong đoạn trích Người cầm quyền khôi phục uy quyền tên là gì?", "answer": "Cô-dét", "points": 0.5, "explain": "Cô-dét là con gái của Phăng-tin; Giăng Van-giăng đã hứa với Phăng-tin sẽ đón Cô-dét về nuôi nấng."}, {"type": "short", "level": "TH", "q": "Nêu hai ưu điểm của ngôi kể thứ ba.", "answer": "Khách quan, có thể bao quát toàn cảnh; linh hoạt về điểm nhìn", "points": 0.5, "explain": "Ngôi thứ ba (giấu mình) giúp lời kể khách quan, có thể bao quát nhiều nhân vật, sự việc và linh hoạt chuyển điểm nhìn."}, {"type": "short", "level": "VD", "q": "Cho ví dụ một câu có sử dụng biện pháp chêm xen do em tự đặt.", "answer": "(Học sinh tự đặt câu, ví dụ: Nga — cô gái hàng xóm — e ấp nhìn Thanh.)", "points": 0.5, "explain": "Câu đúng yêu cầu khi có phần chêm xen đặt trong dấu ngoặc đơn hoặc giữa hai dấu gạch ngang, có tác dụng bổ sung, nhấn mạnh."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu cảm nhận của em về nhân vật Phăng-tin trong đoạn trích Người cầm quyền khôi phục uy quyền.", "points": 0, "explain": "DÀN Ý: Mở đoạn: giới thiệu Phăng-tin. Thân đoạn: người mẹ khốn khổ (ốm nặng, nghèo khổ); tình mẫu tử thiêng liêng (lúc hấp hối chỉ nghĩ đến con); cái chết thanh thản trong niềm tin; nghệ thuật: miêu tả tâm lí, tương phản số phận. Kết đoạn: Phăng-tin là hiện thân của tình mẫu tử và là nạn nhân của xã hội bất công. BÀI MẪU: Phăng-tin trong đoạn trích là hình ảnh cảm động về tình mẫu tử thiêng liêng và cũng là nạn nhân đáng thương của xã hội bất công. Chị ốm nặng, thân tàn ma dại, nhưng điều duy nhất níu giữ chị với cuộc sống là nỗi mong gặp con gái Cô-dét một lần cuối. Tình mẫu tử ấy mãnh liệt đến mức chiến thắng cả cái chết đang đến gần: chị gắng gượng từng hơi thở chỉ để chờ con. Khi Giăng Van-giăng hứa sẽ đón Cô-dét về, Phăng-tin yên lòng nhắm mắt — chị ra đi thanh thản trong niềm tin con gái mình sẽ được cứu rỗi. Hugo đã khắc họa Phăng-tin bằng ngòi bút đầy xót thương: số phận chị là bản án đanh thép với xã hội đẩy người phụ nữ lương thiện vào bước đường cùng. Nhưng vượt lên trên bi kịch, Phăng-tin tỏa sáng bởi tình yêu con vô bờ — thứ tình cảm khiến con người trở nên cao đẹp ngay cả trong khốn cùng. Hình ảnh người mẹ ấy nhắc nhở chúng ta biết trân trọng tình mẫu tử và căm ghét những bất công chà đạp lên phẩm giá con người."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề: Lòng dũng cảm trong cuộc sống (gợi ý từ nhân vật Giăng Van-giăng).", "points": 0, "explain": "DÀN Ý: Mở bài: dũng cảm là phẩm chất cao quý; vấn đề cần bàn. Thân bài: Giải thích: dũng cảm là dám đối mặt khó khăn, nguy hiểm vì lẽ phải. Biểu hiện: dám đấu tranh với cái xấu; dám nhận lỗi, sửa sai; dám vượt qua nỗi sợ của bản thân. Thực trạng: nhiều tấm gương dũng cảm (cứu người, tố giác tội phạm); một bộ phận hèn nhát, vô cảm, a dua. Nguyên nhân: sợ thiệt thân, thiếu giáo dục, lối sống ích kỉ. Hậu quả: cái xấu lộng hành, người tốt bị thiệt thòi. Bàn luận: dũng cảm không phải liều lĩnh; cần dũng cảm có trí tuệ. Dẫn chứng: Giăng Van-giăng đối đầu Gia-ve; các tấm gương đời thường. Giải pháp: rèn luyện từ việc nhỏ; giáo dục trong gia đình, nhà trường; xã hội tôn vinh người dũng cảm. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Lòng dũng cảm là một trong những phẩm chất cao quý nhất của con người — nó phân biệt người anh hùng với kẻ hèn nhát, người quân tử với kẻ tiểu nhân. Dũng cảm là dám đối mặt với khó khăn, nguy hiểm để bảo vệ lẽ phải, bảo vệ người khác, kể cả khi bản thân có thể bị thiệt thòi. Dũng cảm biểu hiện ở nhiều dạng: dũng cảm đấu tranh với cái xấu, cái ác; dũng cảm nhận lỗi và sửa chữa sai lầm của mình; dũng cảm vượt qua nỗi sợ hãi, giới hạn của bản thân để vươn lên. Như Giăng Van-giăng trong đoạn trích đã học: dù đang bị truy nã, ông vẫn dũng cảm đối đầu với Gia-ve để bảo vệ lời hứa với người sắp chết — đó là dũng cảm của lương tri. Trong đời sống, ta bắt gặp biết bao tấm gương: những người lao mình xuống dòng nước cứu người đuối; những người dũng cảm tố giác tội phạm; những bạn trẻ dám đứng lên bảo vệ bạn bị bắt nạt. Thế nhưng, vẫn còn không ít người hèn nhát, vô cảm: thấy người gặp nạn không cứu, thấy cái xấu không dám lên tiếng, a dua theo đám đông. Nguyên nhân là tâm lí sợ thiệt thân, lối sống ích kỉ và sự thiếu vắng giáo dục về lòng dũng cảm. Hậu quả là cái xấu có cơ hội lộng hành, người tốt bị thiệt thòi, xã hội mất đi sự công bằng. Cần hiểu rằng dũng cảm không đồng nghĩa với liều lĩnh: dũng cảm phải đi đôi với trí tuệ, hành động đúng lúc, đúng cách. Để rèn luyện lòng dũng cảm, mỗi người hãy bắt đầu từ những việc nhỏ: dám nhận lỗi khi sai, dám bảo vệ bạn yếu thế, dám nói không với điều xấu. Gia đình và nhà trường cần giáo dục, động viên các em sống dũng cảm; xã hội cần tôn vinh những tấm gương dũng cảm để lan tỏa. Cuộc sống luôn cần những con người dũng cảm — bởi mỗi hành động dũng cảm đều góp phần làm cho thế giới này tốt đẹp và công bằng hơn."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Thạch Lam là thành viên của nhóm văn học nào?", "options": ["A. Tự lực văn đoàn", "B. Nhân văn giai phẩm", "C. Thơ mới", "D. Văn học kháng chiến"], "answer": "A", "points": 0.25, "explain": "Thạch Lam (1910–1942) là thành viên của Tự lực văn đoàn, nổi tiếng với những truyện ngắn giàu chất thơ về cuộc sống bình dị."}, {"type": "mcq", "level": "NB", "q": "Phần Thực hành đọc của Bài 7 là văn bản nào?", "options": ["A. Con khướu sổ lồng", "B. Chiếc lược ngà", "C. Làng", "D. Lão Hạc"], "answer": "A", "points": 0.25, "explain": "Phần Thực hành đọc của Bài 7 là truyện ngắn Con khướu sổ lồng của Nguyễn Quang Sáng, viết về tình cha con trong kháng chiến."}, {"type": "mcq", "level": "TH", "q": "Vì sao Gia-ve phải khuất phục trước Giăng Van-giăng trong đoạn trích?", "options": ["A. Vì Giăng Van-giăng khỏe hơn", "B. Vì uy quyền đạo đức, lẽ phải thuộc về Giăng Van-giăng trước người sắp chết", "C. Vì Gia-ve sợ bị đuổi việc", "D. Vì có đông người can thiệp"], "answer": "B", "points": 0.25, "explain": "Trước Phăng-tin hấp hối, lẽ phải và tình người thuộc về Giăng Van-giăng; uy quyền đạo đức của ông khiến Gia-ve — dù đại diện pháp luật — cũng phải khuất phục, chờ đợi."}, {"type": "mcq", "level": "TH", "q": "Trong bài văn nghị luận về tác phẩm truyện, thân bài thường triển khai theo trình tự nào?", "options": ["A. Đánh giá – phân tích – tóm tắt", "B. Tóm tắt – phân tích nội dung – phân tích nghệ thuật – đánh giá", "C. Chỉ phân tích nghệ thuật", "D. Kể lại toàn bộ truyện"], "answer": "B", "points": 0.25, "explain": "Thân bài thường: tóm tắt ngắn gọn → phân tích nội dung (đề tài, nhân vật, tư tưởng) → phân tích nghệ thuật → đánh giá giá trị, ý nghĩa."}, {"type": "mcq", "level": "VDC", "q": "Câu nói anh yêu em trong gió có thể hiểu như một phép thử về điều gì?", "options": ["A. Thử xem Na-đi-a có thích trượt tuyết không", "B. Thử thách sự chân thành trong tình cảm và trách nhiệm với lời nói của con người", "C. Thử giọng nói của người kể", "D. Không có ý nghĩa gì"], "answer": "B", "points": 0.25, "explain": "Câu nói nửa thật nửa đùa là phép thử về sự chân thành: nó bộc lộ sự vô tình của người nói và khát khao hạnh phúc của người nghe — bài học về trách nhiệm với lời nói."}, {"type": "short", "level": "NB", "q": "Nêu tên hai nhân vật chính trong truyện Dưới bóng hoàng lan.", "answer": "Thanh và Nga", "points": 0.5, "explain": "Thanh (chàng trai về thăm quê) và Nga (cô gái hàng xóm) là hai nhân vật chính; tình cảm trong sáng giữa họ nảy nở dưới bóng hoàng lan."}, {"type": "short", "level": "TH", "q": "Phân biệt lời người kể chuyện và lời nhân vật.", "answer": "Lời người kể chuyện dẫn dắt mạch truyện; lời nhân vật bộc lộ trực tiếp tính cách, tâm lí", "points": 0.5, "explain": "Lời kể do người kể chuyện đảm nhận để dẫn dắt, miêu tả; lời nhân vật (đối thoại, độc thoại) thể hiện trực tiếp tiếng nói, tâm lí nhân vật."}, {"type": "short", "level": "VD", "q": "Nêu một hạn chế của ngôi kể thứ ba toàn tri.", "answer": "Dễ làm mất đi sự hồi hộp, bí ẩn; lời kể có thể xa cách, kém gần gũi", "points": 0.5, "explain": "Người kể toàn tri biết hết mọi điều nên có thể làm mất yếu tố bất ngờ, hồi hộp; giọng kể đôi khi xa cách, kém gần gũi so với ngôi thứ nhất."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu suy nghĩ của em về tình bạn tuổi học trò qua các tác phẩm đã học (gợi ý: tình cảm trong sáng như Thanh – Nga).", "points": 0, "explain": "DÀN Ý: Mở đoạn: tình bạn tuổi học trò đẹp đẽ. Thân đoạn: gợi từ tình cảm Thanh – Nga (trong sáng, vô tư); tình bạn đẹp là chân thành, giúp nhau tiến bộ; phê phán tình bạn vụ lợi, bè phái. Kết đoạn: trân trọng, giữ gìn tình bạn. BÀI MẪU: Tình bạn tuổi học trò là một trong những tình cảm đẹp đẽ nhất của đời người, như tình cảm trong sáng giữa Thanh và Nga dưới bóng hoàng lan. Đó là thứ tình cảm vô tư, không toan tính: cùng chia sẻ niềm vui, nỗi buồn; cùng giúp nhau trong học tập; cùng mơ ước về tương lai. Một tình bạn đẹp được xây nên bằng sự chân thành và tôn trọng: bạn tốt là người dám nói thẳng khi ta sai, là người động viên khi ta nản, là người vui với thành công của ta mà không ghen tị. Đáng tiếc, quanh ta vẫn có những biểu hiện làm xấu đi tình bạn: chơi với nhau vì vụ lợi, bè phái tẩy chay, thậm chí lôi kéo nhau vào thói hư. Những thứ đó không phải tình bạn mà chỉ là sự lợi dụng. Đọc truyện của Thạch Lam, em càng thấm thía: tình cảm trong sáng như hương hoàng lan mới bền lâu và đáng quý. Tuổi học trò trôi qua nhanh lắm — hãy trân trọng từng người bạn tốt, vun đắp tình bạn bằng sự chân thành, để mai này nhìn lại, ta có thể mỉm cười vì những năm tháng đẹp đẽ ấy."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề: Lòng nhân ái – sức mạnh cảm hóa con người (gợi ý từ nhân vật Giăng Van-giăng).", "points": 0, "explain": "DÀN Ý: Mở bài: sức mạnh của lòng nhân ái; vấn đề cần bàn. Thân bài: Giải thích: nhân ái là yêu thương, bao dung, sẵn sàng giúp đỡ; cảm hóa là làm cho người lầm lỗi trở nên tốt đẹp. Chứng minh: Giăng Van-giăng từ kẻ lầm lỗi thành người nhân ái nhờ được cảm hóa; ông tiếp tục cảm hóa người khác bằng tình thương. Thực trạng: nhiều tấm gương bao dung, giúp người lầm lỗi hoàn lương; một bộ phận định kiến, kì thị, vô cảm. Nguyên nhân: thiếu lòng bao dung, định kiến xã hội. Bàn luận: nhân ái không phải nhu nhược; cần tỉnh táo. Dẫn chứng đời sống. Giải pháp: giáo dục lòng bao dung; mỗi người mở lòng. Kết bài: khẳng định. BÀI MẪU: Trong cuộc đời, có một sức mạnh kì diệu có thể biến kẻ lầm lỗi thành người lương thiện, biến hận thù thành yêu thương — đó là lòng nhân ái. Nhân ái là tình yêu thương con người, là sự bao dung, sẵn sàng tha thứ và giúp đỡ những người gặp khó khăn, lầm lỗi. Cảm hóa là quá trình dùng tình thương để làm cho con người trở nên tốt đẹp hơn. Hình ảnh Giăng Van-giăng trong Những người khốn khổ là minh chứng hùng hồn: từ một kẻ tù khổ sai đầy hận thù, nhờ được một vị giám mục bao dung, ông đã lột xác thành con người nhân ái, dùng cả đời để cứu giúp người khác — từ Phăng-tin đến Cô-dét. Lòng nhân ái của ông thậm chí khiến Gia-ve, kẻ thù không đội trời chung, cũng phải lay động. Trong đời sống, ta cũng thấy sức mạnh cảm hóa của tình thương: những phạm nhân được gia đình, xã hội bao dung đã hoàn lương, sống có ích; những học sinh cá biệt được thầy cô kiên nhẫn dìu dắt đã thay đổi. Ngược lại, sự định kiến, kì thị chỉ đẩy con người lún sâu vào tội lỗi: bị xã hội ruồng bỏ, người lầm lỗi mất niềm tin, dễ tái phạm. Nguyên nhân của sự thiếu bao dung là lối sống ích kỉ, định kiến nặng nề và sự thiếu vắng giáo dục về lòng nhân ái. Cần hiểu rằng nhân ái không phải là nhu nhược, dung túng cái xấu; nhân ái là nghiêm khắc mà bao dung, là cho người lầm lỗi cơ hội sửa sai trong khuôn khổ đúng đắn. Để lan tỏa lòng nhân ái, mỗi người hãy bắt đầu từ sự bao dung với những lỗi lầm nhỏ quanh mình; gia đình, nhà trường dạy trẻ biết tha thứ; xã hội tạo điều kiện để người lầm lỗi tái hòa nhập. Lòng nhân ái là ngọn đèn xua tan bóng tối trong tâm hồn con người. Hãy thắp sáng ngọn đèn ấy — bởi cảm hóa được một con người còn quý hơn trừng phạt trăm kẻ có tội."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Dòng nào nêu đúng trình tự các truyện đọc chính trong Bài 7 theo SGK?", "options": ["A. Người cầm quyền khôi phục uy quyền – Dưới bóng hoàng lan – Một chuyện đùa nho nhỏ", "B. Một chuyện đùa nho nhỏ – Dưới bóng hoàng lan – Người cầm quyền khôi phục uy quyền", "C. Dưới bóng hoàng lan – Con khướu sổ lồng – Một chuyện đùa nho nhỏ", "D. Chiếc lược ngà – Làng – Lão Hạc"], "answer": "A", "points": 0.25, "explain": "Theo SGK, Bài 7 gồm: Người cầm quyền khôi phục uy quyền, Dưới bóng hoàng lan, Một chuyện đùa nho nhỏ; phần Thực hành đọc là Con khướu sổ lồng."}, {"type": "mcq", "level": "NB", "q": "Biện pháp tu từ nào được học trong phần Thực hành tiếng Việt của Bài 7?", "options": ["A. Ẩn dụ, hoán dụ", "B. Chêm xen, liệt kê", "C. So sánh, nhân hóa", "D. Điệp ngữ, đối lập"], "answer": "B", "points": 0.25, "explain": "Phần Thực hành tiếng Việt của Bài 7 học về biện pháp chêm xen và biện pháp liệt kê."}, {"type": "mcq", "level": "TH", "q": "Vì sao Phăng-tin có thể thanh thản nhắm mắt?", "options": ["A. Vì đã gặp được con gái", "B. Vì tin rằng Giăng Van-giăng sẽ giữ lời hứa đón Cô-dét về nuôi", "C. Vì Gia-ve đã tha cho Giăng Van-giăng", "D. Vì đã hết bệnh"], "answer": "B", "points": 0.25, "explain": "Phăng-tin thanh thản ra đi vì tin vào lời hứa của Giăng Van-giăng: Cô-dét sẽ được đón về, được cứu rỗi — tình mẫu tử được an ủi."}, {"type": "mcq", "level": "TH", "q": "Trong bài văn nghị luận về tác phẩm truyện, phần kết bài cần làm gì?", "options": ["A. Kể thêm tình tiết mới", "B. Khẳng định giá trị tác phẩm, nêu cảm nghĩ, liên hệ", "C. Chép lại mở bài", "D. Phê phán tác giả"], "answer": "B", "points": 0.25, "explain": "Kết bài khẳng định lại giá trị của tác phẩm, nêu cảm nghĩ của người viết và liên hệ với bản thân, cuộc sống."}, {"type": "mcq", "level": "VDC", "q": "Nhận định nào đúng về vai trò của chi tiết trong truyện ngắn?", "options": ["A. Chi tiết càng nhiều càng hay", "B. Chi tiết đắt giá có thể trở thành nút thắt tâm lí, mang ý nghĩa biểu tượng (như câu nói trong gió, cây hoàng lan)", "C. Chi tiết không quan trọng", "D. Chỉ cần chi tiết hài hước"], "answer": "B", "points": 0.25, "explain": "Trong truyện ngắn, chi tiết đắt giá (câu nói trong gió, cây hoàng lan, con khướu sổ lồng) có thể trở thành nút thắt tâm lí hoặc biểu tượng, quyết định sức ám ảnh của tác phẩm."}, {"type": "short", "level": "NB", "q": "Người bà trong truyện Dưới bóng hoàng lan là biểu tượng của điều gì?", "answer": "Quê hương, cội nguồn", "points": 0.5, "explain": "Người bà hiền từ là biểu tượng của quê hương, cội nguồn — nơi nuôi dưỡng tâm hồn và để con cháu trở về."}, {"type": "short", "level": "TH", "q": "Nêu hai biểu hiện của giọng văn Thạch Lam trong Dưới bóng hoàng lan.", "answer": "Nhẹ nhàng, man mác buồn; giàu chất thơ", "points": 0.5, "explain": "Giọng văn Thạch Lam nhẹ nhàng, man mác buồn, giàu chất thơ — phù hợp với việc diễn tả những rung động tinh tế của tâm hồn."}, {"type": "short", "level": "VD", "q": "Khi phân tích nhân vật trong truyện, cần chú ý những phương diện nào?", "answer": "Ngoại hình, hành động, lời nói, tâm lí; mối quan hệ với nhân vật khác; ý nghĩa biểu tượng", "points": 0.5, "explain": "Phân tích nhân vật cần bám vào ngoại hình, hành động, lời nói, diễn biến tâm lí; đặt nhân vật trong mối quan hệ với nhân vật khác và khái quát ý nghĩa."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích nghệ thuật xây dựng tình huống trong truyện Một chuyện đùa nho nhỏ.", "points": 0, "explain": "DÀN Ý: Mở đoạn: tình huống truyện độc đáo. Thân đoạn: tình huống trượt tuyết + câu nói trong gió — ngẫu nhiên mà định mệnh; tình huống thử thách tâm lí nhân vật; sự lặp lại (Na-đi-a nài nỉ nghe lại); tình huống hé lộ sự thật muộn màng. Kết đoạn: tình huống giàu kịch tính tâm lí, làm nên sức hấp dẫn. BÀI MẪU: Nghệ thuật xây dựng tình huống trong Một chuyện đùa nho nhỏ thể hiện bút pháp bậc thầy của Sê-khốp. Tình huống trung tâm là buổi trượt tuyết định mệnh: giữa lúc xe lao dốc, tiếng gió rít, người kể thì thầm câu nói anh yêu em — một tình huống vừa ngẫu nhiên vừa như được sắp đặt, vừa lãng mạn vừa đầy bất trắc. Tình huống ấy trở thành phép thử tâm lí: nó đặt Na-đi-a vào trạng thái bán tín bán nghi, day dứt khôn nguôi, còn người kể thì vừa thích thú vừa áy náy. Sê-khốp khéo léo lặp lại tình huống (những lần trượt tuyết sau, Na-đi-a nài nỉ được nghe lại câu nói) để đào sâu mâu thuẫn nội tâm. Đỉnh điểm là tình huống hé lộ sự thật muộn màng: nhiều năm sau người kể mới thú nhận đó chỉ là chuyện đùa — khi mọi thứ đã không thể cứu vãn. Tình huống truyện không ồn ào mà giàu kịch tính tâm lí: nó không thử thách hành động mà thử thách lương tâm con người. Chính nghệ thuật xây dựng tình huống tinh tế ấy đã biến một chuyện đùa nho nhỏ thành một bi kịch day dứt, khiến người đọc phải suy ngẫm về trách nhiệm với mỗi lời mình nói ra."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận về vấn đề: Lòng biết ơn thầy cô – đạo lí cần giữ gìn.", "points": 0, "explain": "DÀN Ý: Mở bài: công ơn thầy cô; vấn đề: lòng biết ơn trong học sinh hiện nay. Thân bài: Giải thích: biết ơn thầy cô là ghi nhớ công dạy dỗ và đền đáp bằng hành động. Biểu hiện: lễ phép, chăm học, thăm hỏi, tri ân. Thực trạng: nhiều bạn kính trọng thầy cô; một bộ phận vô lễ, qua cầu rút ván, thậm chí xúc phạm thầy cô. Nguyên nhân: thiếu giáo dục đạo lí, ảnh hưởng xấu, coi việc dạy là dịch vụ. Hậu quả: đạo đức suy giảm, thầy cô nản lòng. Bàn luận: không thầy đố mày làm nên; biết ơn phải bằng hành động cụ thể. Dẫn chứng: ngày 20-11, các tấm gương trò giỏi nhớ ơn thầy. Giải pháp: giáo dục từ gia đình; mỗi học sinh tự rèn; xã hội tôn vinh nghề giáo. Kết bài: khẳng định, kêu gọi. BÀI MẪU: Dân tộc ta có truyền thống tôn sư trọng đạo: Không thầy đố mày làm nên, Muốn sang thì bắc cầu Kiều, muốn con hay chữ thì yêu lấy thầy. Trong xã hội hiện nay, lòng biết ơn thầy cô của học sinh là vấn đề cần được quan tâm đúng mức. Biết ơn thầy cô là ghi nhớ công lao dạy dỗ của thầy cô và đền đáp bằng những hành động thiết thực: lễ phép, vâng lời; chăm chỉ học tập để không phụ công thầy; thăm hỏi, tri ân thầy cô nhân ngày lễ; sống tốt để thầy cô tự hào. Thực tế đáng mừng là đa số học sinh vẫn kính trọng thầy cô: những bó hoa ngày 20-11, những cuộc thăm thầy cô cũ, những thành tích học tập dâng lên thầy cô. Thế nhưng, vẫn còn những biểu hiện đáng buồn: một số bạn vô lễ, cãi lại thầy cô; học xong là quên, qua cầu rút ván; cá biệt có hành vi xúc phạm, thậm chí hành hung thầy cô gây bức xúc dư luận. Nguyên nhân một phần do giáo dục đạo lí chưa sâu, một phần do quan niệm sai lệch coi việc dạy học đơn thuần là dịch vụ mua bán. Hậu quả là đạo đức học đường suy giảm, nhiều thầy cô nản lòng, tâm huyết với nghề bị bào mòn. Cần nhớ rằng thầy cô không chỉ truyền kiến thức mà còn dạy ta làm người; mỗi thành công của ta đều có bóng dáng thầy cô. Biết ơn thầy cô không cần những món quà đắt tiền mà cần sự chân thành: một lời chào lễ phép, một giờ học nghiêm túc, một tin nhắn hỏi thăm. Gia đình hãy dạy con kính trọng thầy cô từ nhỏ; nhà trường xây dựng môi trường tôn sư trọng đạo; xã hội tôn vinh xứng đáng nghề giáo. Hãy để lòng biết ơn thầy cô mãi là nét đẹp văn hóa của người Việt — bởi uống nước nhớ nguồn là đạo lí làm người."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Chủ đề chung của Bài 7 là gì?", "options": ["A. Quyền năng của người kể chuyện", "B. Tình yêu quê hương", "C. Chiến tranh và hòa bình", "D. Bảo vệ môi trường"], "answer": "A", "points": 0.25, "explain": "Bài 7 có chủ đề Quyền năng của người kể chuyện: khám phá vai trò của ngôi kể, điểm nhìn trần thuật qua ba truyện ngắn."}, {"type": "mcq", "level": "NB", "q": "Tác phẩm nào sau đây KHÔNG thuộc Bài 7?", "options": ["A. Dưới bóng hoàng lan", "B. Một chuyện đùa nho nhỏ", "C. Bình Ngô đại cáo", "D. Con khướu sổ lồng"], "answer": "C", "points": 0.25, "explain": "Bình Ngô đại cáo thuộc Bài 6 (Nguyễn Trãi). Bài 7 gồm ba truyện và phần Thực hành đọc Con khướu sổ lồng."}, {"type": "mcq", "level": "TH", "q": "Lời độc thoại nội tâm của nhân vật có tác dụng gì?", "options": ["A. Kể lại sự việc khách quan", "B. Bộc lộ trực tiếp suy nghĩ, tình cảm sâu kín của nhân vật", "C. Miêu tả cảnh vật", "D. Giới thiệu tác giả"], "answer": "B", "points": 0.25, "explain": "Độc thoại nội tâm là lời nhân vật tự nói với mình, bộc lộ trực tiếp những suy nghĩ, tình cảm sâu kín nhất — công cụ đắc lực để khắc họa tâm lí."}, {"type": "mcq", "level": "TH", "q": "Câu: Cô bé — với đôi mắt to tròn — nhìn tôi chăm chăm sử dụng biện pháp gì?", "options": ["A. Liệt kê", "B. Chêm xen", "C. So sánh", "D. Nhân hóa"], "answer": "B", "points": 0.25, "explain": "Phần với đôi mắt to tròn đặt giữa hai dấu gạch ngang là phần chêm xen, có tác dụng bổ sung đặc điểm cho cô bé."}, {"type": "mcq", "level": "VDC", "q": "Bài học lớn nhất mà học sinh rút ra được từ Bài 7 là gì?", "options": ["A. Chỉ cần nhớ tên tác giả là đủ", "B. Đọc truyện không chỉ xem kể gì mà còn phải xem kể như thế nào: ngôi kể, điểm nhìn quyết định ý nghĩa và cảm xúc của câu chuyện", "C. Truyện nào cũng có kết thúc có hậu", "D. Không cần quan tâm đến người kể chuyện"], "answer": "B", "points": 0.25, "explain": "Bài học cốt lõi: nghệ thuật trần thuật (ai kể, nhìn từ đâu, kể bằng lời ai) quyết định ý nghĩa và sức lay động của câu chuyện — đọc sâu là đọc cách kể."}, {"type": "short", "level": "NB", "q": "Kể tên hai tác giả nước ngoài có truyện trong Bài 7.", "answer": "V. Hugo (Pháp) và A. Sê-khốp (Nga)", "points": 0.5, "explain": "Bài 7 có hai tác giả nước ngoài: Vích-to Huy-gô (Pháp) với Người cầm quyền khôi phục uy quyền và An-tôn Sê-khốp (Nga) với Một chuyện đùa nho nhỏ."}, {"type": "short", "level": "TH", "q": "Nêu hai biểu hiện của quyền năng của người kể chuyện.", "answer": "Lựa chọn ngôi kể; lựa chọn điểm nhìn trần thuật (sắp xếp chi tiết, lựa chọn lời kể)", "points": 0.5, "explain": "Quyền năng thể hiện ở việc lựa chọn ngôi kể, điểm nhìn, thứ tự sắp xếp chi tiết, cách dùng lời kể và lời nhân vật để dẫn dắt cảm xúc người đọc."}, {"type": "short", "level": "VD", "q": "Vì sao khi viết bài nghị luận về tác phẩm truyện cần tóm tắt ngắn gọn ở đầu thân bài?", "answer": "Để người đọc nắm được nội dung khái quát, tạo cơ sở cho phân tích; tránh kể lể dài dòng", "points": 0.5, "explain": "Tóm tắt ngắn giúp người đọc nắm nội dung khái quát làm nền cho phân tích; tóm tắt phải ngắn gọn, tránh kể lể dài dòng lấn át phần phân tích."}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ nêu cảm nhận của em về vẻ đẹp của tình người trong các truyện đã học ở Bài 7.", "points": 0, "explain": "DÀN Ý: Mở đoạn: tình người là sợi chỉ đỏ xuyên suốt ba truyện. Thân đoạn: lòng nhân ái của Giăng Van-giăng; tình mẫu tử của Phăng-tin; tình quê, tình yêu trong sáng trong Dưới bóng hoàng lan; sự day dứt, ân hận cũng là biểu hiện của tình người trong Một chuyện đùa nho nhỏ. Kết đoạn: tình người làm nên giá trị nhân văn. BÀI MẪU: Đọc ba truyện của Bài 7, điều đọng lại sâu nhất trong em là vẻ đẹp của tình người — thứ ánh sáng xua tan mọi bóng tối. Đó là lòng nhân ái cao thượng của Giăng Van-giăng: dù bị truy lùng, ông vẫn đặt lời hứa với người sắp chết lên trên an nguy bản thân. Đó là tình mẫu tử thiêng liêng của Phăng-tin: đến hơi thở cuối cùng vẫn chỉ nghĩ về con. Đó là tình quê hương đằm thắm và tình yêu trong sáng trong Dưới bóng hoàng lan: những con người bình dị mà tâm hồn thật đẹp. Ngay cả trong Một chuyện đùa nho nhỏ, sự day dứt, ân hận của người kể chuyện cũng là biểu hiện của tình người — của lương tri biết xót xa. Ba truyện, ba màu sắc khác nhau, nhưng cùng tỏa sáng một thông điệp: tình thương là sức mạnh lớn nhất, là cái đẹp bền vững nhất của con người. Trong cuộc sống hôm nay, khi con người dễ trở nên vô cảm, những trang văn ấy nhắc ta hãy giữ lấy tình người: biết yêu thương, biết xót xa, biết sống có trách nhiệm với nhau. Đó cũng chính là giá trị nhân văn muôn đời của văn chương."}, {"type": "essay", "level": "VDC", "q": "Viết bài văn khoảng 600 chữ nghị luận phân tích, đánh giá một truyện ngắn em yêu thích (ngoài các truyện trong Bài 7).", "points": 0, "explain": "DÀN Ý: Mở bài: giới thiệu truyện em chọn (tên truyện, tác giả); nêu lí do yêu thích và vấn đề phân tích khái quát. Thân bài: Tóm tắt ngắn. Phân tích nội dung: đề tài, nhân vật, tư tưởng, tình cảm. Phân tích nghệ thuật: ngôi kể, điểm nhìn, tình huống, ngôn ngữ, giọng điệu. Đánh giá: giá trị nội dung, nghệ thuật; ý nghĩa với bản thân. Kết bài: khẳng định, cảm nghĩ. BÀI MẪU: (Bài mẫu minh họa với truyện Lão Hạc của Nam Cao — học sinh có thể chọn truyện khác và làm theo dàn ý.) Trong kho tàng truyện ngắn Việt Nam, Lão Hạc của Nam Cao là tác phẩm khiến em xúc động và suy ngẫm nhiều nhất. Truyện kể về lão Hạc — người nông dân nghèo khổ, vợ mất sớm, con trai đi phu đồn điền cao su. Để dành tiền cưới vợ cho con, lão thắt lưng buộc bụng, bán dần từng thứ; cuối cùng phải bán con chó Vàng — kỉ vật duy nhất — rồi chọn cái chết bằng bả chó để giữ trọn số tiền cho con và không làm phiền hàng xóm. Về nội dung, truyện là bản án đanh thép với xã hội cũ đẩy người nông dân lương thiện vào bước đường cùng, đồng thời là bài ca về phẩm giá con người: dù nghèo khổ, lão Hạc vẫn giữ lòng tự trọng, tình thương con vô bờ và lòng nhân hậu. Về nghệ thuật, Nam Cao dùng ngôi kể thứ nhất qua nhân vật ông giáo — người chứng kiến và thấu hiểu; nghệ thuật miêu tả tâm lí bậc thầy (nỗi dằn vặt khi bán chó Vàng, cái chết dữ dội mà cao cả); ngôn ngữ giản dị mà thấm thía; giọng văn xót thương, trân trọng. Đánh giá chung, Lão Hạc là kiệt tác của văn xuôi hiện thực: nội dung nhân đạo sâu sắc, nghệ thuật đặc sắc. Với em, truyện dạy bài học về lòng tự trọng và tình yêu thương: dù hoàn cảnh nào cũng phải giữ phẩm giá làm người. Mỗi lần đọc lại, em càng thêm xót xa và càng thêm kính trọng những con người bình dị mà cao đẹp như lão Hạc. (Học sinh chọn truyện khác: thay tên truyện, tác giả, tóm tắt và phân tích theo đúng dàn ý trên.)"}]}]}
