 sáng xanh từ màn hình còn rối loạn nội tiết, tăng nguy cơ béo phì, trầm cảm — các chuyên gia y tế đã nhiều lần cảnh báo điều này. Thứ hai là với học tập: ngủ ít khiến hôm sau uể oải, mất tập trung, tiếp thu kém — học khuya mà không vào đầu thì khác gì “đổ nước vào rổ”. Thứ ba là với tinh thần: thiếu ngủ khiến ta cáu gắt, tiêu cực, xa cách bạn bè, gia đình. Có bạn bao biện: “thức khuya mới học vào” — nhưng khoa học đã chứng minh não bộ cần ngủ đủ để củng cố trí nhớ; học trong tỉnh táo một giờ hơn học trong uể oải ba giờ. Có bạn nói “không có điện thoại không ngủ được” — đó chính là biểu hiện của sự lệ thuộc, càng phải cai. Muốn từ bỏ, hãy đặt “giờ giới nghiêm”: tắt điện thoại trước 22 giờ, để xa tầm tay; thay bằng đọc sách, nghe nhạc nhẹ; nhờ bố mẹ, bạn bè nhắc nhở. Sức khỏe là vốn quý nhất của tuổi trẻ. Đừng vì những giờ phút lướt mạng vô bổ mà đánh đổi cả tương lai. Hãy tắt điện thoại sớm từ tối nay — đó là món quà ý nghĩa nhất bạn tặng cho chính mình.", "points": 0}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Luận cứ trong văn nghị luận gồm những gì?", "options": ["A. Cốt truyện và nhân vật", "B. Lí lẽ và bằng chứng", "C. Mở bài và kết bài", "D. Vần và nhịp"], "answer": "B", "explain": "Luận cứ gồm lí lẽ (lập luận logic) và bằng chứng (sự thật, số liệu, ví dụ cụ thể, tiêu biểu).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sức thuyết phục của văn nghị luận đến từ đâu?", "options": ["A. Bài viết càng dài càng thuyết phục", "B. Luận điểm đúng đắn, luận cứ xác đáng và lập luận chặt chẽ", "C. Dùng nhiều từ khó hiểu", "D. Viết chữ thật đẹp"], "answer": "B", "explain": "Công thức của sức thuyết phục: luận điểm đúng + luận cứ xác đáng + lập luận chặt chẽ — thiếu một sẽ kém thuyết phục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nghệ thuật lập luận nổi bật trong “Hiền tài là nguyên khí của quốc gia” là gì?", "options": ["A. Lí lẽ chặt chẽ, dẫn chứng lịch sử phong phú, câu văn biền ngẫu trang trọng", "B. Chỉ dùng cảm xúc, không cần lí lẽ", "C. Kể chuyện hài hước", "D. Viết bằng thơ lục bát"], "answer": "A", "explain": "Thân Nhân Trung dùng lí lẽ chặt chẽ, dẫn chứng lịch sử và câu văn biền ngẫu trang trọng — phong cách nghị luận trung đại mẫu mực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dấu hiệu nào cho thấy đoạn văn mắc lỗi về mạch lạc?", "options": ["A. Các câu đều hướng về chủ đề chung", "B. Đoạn văn quá ngắn", "C. Có câu lạc đề, ý lộn xộn, câu lạc lõng không liên quan đến chủ đề", "D. Dùng nhiều từ nối"], "answer": "C", "explain": "Mạch lạc là sự thống nhất nội dung; câu lạc đề, ý lộn xộn, câu lạc lõng là dấu hiệu mất mạch lạc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong “Yêu và đồng cảm”, Phong Tử Khải chủ yếu thuyết phục người đọc bằng cách nào?", "options": ["A. Dùng lí luận triết học cao siêu", "B. Đe dọa người đọc", "C. Dùng số liệu thống kê phức tạp", "D. Lí lẽ giản dị, gần gũi và bằng chứng là những câu chuyện đời thường chân thực, giọng văn ấm áp"], "answer": "D", "explain": "Phong Tử Khải thuyết phục bằng tình cảm: lí lẽ giản dị từ đời sống, câu chuyện nhỏ chân thực, giọng ấm áp — “lấy tình thắng lí”.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Ý kiến, quan điểm chính của người viết về vấn đề bàn luận gọi là …", "answer": "luận điểm", "explain": "Luận điểm là câu chủ đạo của bài viết, phải rõ ràng, đúng đắn, nhất quán.", "points": 0.5}, {"type": "short", "level": "TH", "q": "“Hiền tài là nguyên khí của quốc gia” được trích từ thể loại văn bản nào (bài văn khắc trên bia đá)?", "answer": "bài kí", "explain": "Văn bản trích từ bài kí đề danh tiến sĩ — thể văn khắc trên bia đá, có tính trang trọng, lưu truyền.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong văn nghị luận, thao tác chia vấn đề thành các mặt, các khía cạnh để xem xét sâu được gọi là thao tác …", "answer": "phân tích", "explain": "Phân tích là thao tác chia nhỏ vấn đề để xem xét từng mặt — giúp bài viết sâu sắc, toàn diện.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích sức thuyết phục của luận điểm “Hiền tài là nguyên khí của quốc gia”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: nêu luận điểm của Thân Nhân Trung và sức thuyết phục đặc biệt của nó. 2) Thân đoạn: phân tích — luận điểm đúng đắn (khẳng định vai trò người tài với vận nước); lí lẽ chặt chẽ (quan hệ nhân quả: trọng tài thì nước thịnh); bằng chứng lịch sử (triều đại thịnh trị trọng người tài; việc khắc bia); giọng văn trang trọng, tha thiết; giá trị vượt thời gian (bài học trọng dụng nhân tài hôm nay). 3) Kết đoạn: khẳng định đây là mẫu mực của nghệ thuật thuyết phục. BÀI MẪU: Luận điểm “Hiền tài là nguyên khí của quốc gia” của Thân Nhân Trung có sức thuyết phục bền vững suốt hơn năm trăm năm. Trước hết, luận điểm đúng đắn, đánh trúng chân lí: “nguyên khí” là khí chất cốt lõi làm nên sức sống; ví hiền tài với nguyên khí là khẳng định vai trò quyết định của người tài đức với vận nước — một chân lí được lịch sử kiểm chứng. Thứ hai, hệ thống luận cứ xác đáng: lí lẽ chặt chẽ chỉ ra quan hệ nhân quả (trọng hiền tài thì thế nước mạnh, bỏ quên thì thế nước suy), bằng chứng lịch sử phong phú (các triều đại thịnh trị đều trọng người tài; việc khắc bia đề danh để khuyến khích kẻ sĩ). Thứ ba, nghệ thuật lập luận khoa học: đi từ khái quát đến cụ thể, câu văn biền ngẫu trang trọng, giọng điệu vừa nghiêm túc vừa tha thiết yêu nước. Sức thuyết phục còn ở giá trị thời đại: hôm nay, muốn đất nước phát triển vẫn phải trọng hiền tài — phát hiện, đào tạo, dùng đúng người tài. Một luận điểm đúng đắn, được chứng minh bằng lí lẽ và bằng chứng xác đáng, trình bày một cách chặt chẽ — đó chính là mẫu mực của nghệ thuật thuyết phục mà Thân Nhân Trung để lại.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích văn bản “Hiền tài là nguyên khí của quốc gia” của Thân Nhân Trung (luận điểm, luận cứ, nghệ thuật).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu Thân Nhân Trung, hoàn cảnh ra đời (bài kí đề danh tiến sĩ 1484); nêu vấn đề: phân tích nghệ thuật thuyết phục. 2) Thân bài: a) Luận điểm trung tâm: “Hiền tài là nguyên khí của quốc gia” — giải thích “nguyên khí”. b) Luận cứ: lí lẽ (quan hệ hiền tài – vận nước; đào tạo, trọng dụng là kế lâu dài); bằng chứng (lịch sử các triều đại; việc khắc bia). c) Nghệ thuật: lập luận chặt chẽ (quy nạp – diễn dịch); câu văn biền ngẫu; giọng trang trọng, tha thiết. d) Ý nghĩa: bài học trọng dụng nhân tài xưa và nay. 3) Kết bài: khẳng định giá trị vượt thời gian; liên hệ (trách nhiệm của thế hệ trẻ: học tập để thành hiền tài). BÀI MẪU: “Hiền tài là nguyên khí của quốc gia” — bài kí đề danh tiến sĩ năm 1484 của Thân Nhân Trung — là một trong những văn bản nghị luận mẫu mực nhất của văn học trung đại, với sức thuyết phục vượt thời gian. Luận điểm trung tâm được nêu ngay từ đầu, ngắn gọn mà sâu sắc: “Hiền tài là nguyên khí của quốc gia”. “Nguyên khí” là khí chất cốt lõi làm nên sức sống; ví người tài đức với nguyên khí là khẳng định: vận nước thịnh hay suy phụ thuộc vào việc có trọng dụng hiền tài hay không. Để chứng minh, Thân Nhân Trung triển khai hệ thống luận cứ xác đáng. Về lí lẽ, ông chỉ ra quan hệ nhân quả chặt chẽ: trị quốc muốn lâu dài phải có người tài; đào tạo, trọng dụng hiền tài là kế sách gốc rễ, không phải việc nhất thời. Về bằng chứng, ông dẫn lịch sử các triều đại: thời nào trọng người tài thì thịnh trị, thời nào bỏ quên thì suy vong; và chính việc khắc bia đề danh tiến sĩ là bằng chứng sinh động cho chủ trương khuyến khích nhân tài. Nghệ thuật lập luận cũng bậc thầy: đi từ khái quát đến cụ thể, từ lí lẽ đến bằng chứng một cách khoa học; câu văn biền ngẫu đối xứng, trang trọng xứng với văn bia; giọng điệu vừa nghiêm túc vừa tha thiết yêu nước. Giá trị của văn bản không chỉ ở quá khứ: hôm nay, trong công cuộc phát triển đất nước, bài học “trọng hiền tài” càng thiết thực — phải phát hiện, đào tạo và sử dụng đúng người tài, chống bệnh hình thức, quan liêu. Với thế hệ trẻ, văn bản nhắc nhở: hãy học tập, rèn luyện để trở thành “hiền tài” — người vừa có tài vừa có đức, góp sức dựng xây quê hương. Một luận điểm đúng đắn, luận cứ xác đáng, lập luận chặt chẽ — đó là công thức làm nên sức thuyết phục bất hủ của Thân Nhân Trung.", "points": 0}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Lập luận trong văn nghị luận là gì?", "options": ["A. Cách gieo vần cho hay", "B. Cách kể chuyện hấp dẫn", "C. Cách vẽ tranh minh họa", "D. Cách sắp xếp, trình bày luận cứ để dẫn tới luận điểm một cách chặt chẽ, hợp lí"], "answer": "D", "explain": "Lập luận là cách sắp xếp, trình bày luận cứ một cách chặt chẽ, hợp lí để dẫn tới luận điểm — “xương sống” của bài văn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phong Tử Khải là nhà văn của nước nào?", "options": ["A. Pháp", "B. Trung Quốc", "C. Việt Nam", "D. Nhật Bản"], "answer": "B", "explain": "Phong Tử Khải (1898 – 1975) là nhà văn, họa sĩ nổi tiếng Trung Quốc với phong cách giản dị, chân thành.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dòng nào nêu đúng biểu hiện của lỗi về liên kết trong đoạn văn?", "options": ["A. Đoạn văn có chủ đề rõ ràng", "B. Các ý sắp xếp theo trình tự hợp lí", "C. Các câu gắn nối trôi chảy bằng từ nối phù hợp", "D. Thiếu từ nối khiến ý đứt đoạn; lặp từ thừa; dùng từ nối sai nghĩa"], "answer": "D", "explain": "Lỗi liên kết: thiếu từ nối, lặp từ thừa, dùng từ nối sai nghĩa — khiến câu văn rời rạc dù ý vẫn đúng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi thảo luận về một vấn đề có ý kiến khác nhau, cần tránh thái độ nào?", "options": ["A. Trình bày quan điểm bằng lí lẽ", "B. Hướng tới đồng thuận", "C. Lắng nghe và tôn trọng ý kiến bạn", "D. Áp đặt, coi thường ý kiến người khác; tranh cãi gay gắt, thiếu văn hóa"], "answer": "D", "explain": "Thảo luận văn minh: lắng nghe, tôn trọng khác biệt, phản bác lịch sự bằng lí lẽ — tránh áp đặt, coi thường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhận xét nào đúng về phong cách nghị luận của Lê Đạt trong “Chữ bầu lên nhà thơ”?", "options": ["A. Sắc sảo, độc đáo; cách nói nghịch lí mà thấm thía; giàu liên tưởng, hình ảnh", "B. Khô khan, giáo điều", "C. Đơn giản, dễ dãi", "D. Chỉ kể chuyện, không nghị luận"], "answer": "A", "explain": "Lê Đạt lập luận sắc sảo với cách nói nghịch lí độc đáo (“chữ bầu lên nhà thơ”), giàu liên tưởng — thuyết phục bằng trí tuệ.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Khả năng khiến người đọc tin và đồng tình với quan điểm của người viết gọi là sức …", "answer": "thuyết phục", "explain": "Sức thuyết phục đến từ luận điểm đúng đắn, luận cứ xác đáng và lập luận chặt chẽ.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Tác giả của văn bản “Yêu và đồng cảm” là ai?", "answer": "Phong Tử Khải", "explain": "Phong Tử Khải — nhà văn Trung Quốc — là tác giả của “Yêu và đồng cảm”, văn bản ca ngợi tình yêu thương con người.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong văn nghị luận, thao tác làm rõ nghĩa của vấn đề, khái niệm trước khi bàn luận được gọi là thao tác …", "answer": "giải thích", "explain": "Giải thích là thao tác mở đầu thường gặp: làm rõ khái niệm để người đọc hiểu đúng vấn đề rồi mới bàn sâu.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ bàn về vai trò của lí lẽ và bằng chứng trong văn nghị luận (lấy ví dụ từ các văn bản đã học).", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: nêu luận điểm — lí lẽ và bằng chứng là hai “chân” của sức thuyết phục. 2) Thân đoạn: phân tích — lí lẽ (lập luận logic) giúp người đọc hiểu, tin theo; bằng chứng (cụ thể, tiêu biểu) giúp luận điểm có sức nặng thực tế; ví dụ (Thân Nhân Trung: lí lẽ về quan hệ hiền tài – vận nước + dẫn chứng lịch sử; Phong Tử Khải: câu chuyện đời thường); thiếu một trong hai bài viết sẽ khô khan hoặc suông. 3) Kết đoạn: khẳng định phải kết hợp cả hai; liên hệ khi viết văn. BÀI MẪU: Lí lẽ và bằng chứng là hai yếu tố không thể thiếu làm nên sức thuyết phục của văn nghị luận, như hai “chân” giúp luận điểm đứng vững. Lí lẽ là hệ thống lập luận logic: nó giúp người đọc hiểu vì sao luận điểm đúng, theo dõi được mạch suy nghĩ của người viết. Thân Nhân Trung đã dùng lí lẽ chặt chẽ để chỉ ra quan hệ nhân quả giữa việc trọng hiền tài và sự thịnh suy của đất nước — nghe là thấy hợp lí, khó bắt bẻ. Bằng chứng là những sự thật, số liệu, ví dụ cụ thể: nó biến lí lẽ trừu tượng thành điều mắt thấy tai nghe, khiến luận điểm có sức nặng thực tế. Cũng trong bài kí của Thân Nhân Trung, dẫn chứng lịch sử về các triều đại thịnh – suy và việc khắc bia đề danh đã làm cho lí lẽ thêm vững chắc. Phong Tử Khải thì dùng những câu chuyện đời thường chân thực làm bằng chứng cho tình yêu thương — giản dị mà thấm thía. Bài học rút ra: chỉ có lí lẽ mà thiếu bằng chứng, bài viết sẽ khô khan, suông; chỉ có bằng chứng mà thiếu lí lẽ, bài viết sẽ rời rạc, thiếu chiều sâu. Muốn viết văn nghị luận hay, phải biết kết hợp nhuần nhuyễn cả hai: lí lẽ dẫn đường, bằng chứng tiếp sức.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ thuyết phục các bạn từ bỏ quan niệm sai lầm: “học tủ, học vẹt vẫn đạt điểm cao nên không cần học hiểu”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: nêu quan niệm sai lầm khá phổ biến; khẳng định: cần từ bỏ. 2) Thân bài: a) Giải thích: học tủ (đoán đề), học vẹt (thuộc lòng không hiểu) là gì. b) Phân tích tác hại: kiến thức hổng, không vận dụng được; điểm số ảo, sụp đổ khi gặp đề mới; mất năng lực tư duy, ảnh hưởng tương lai (thi cử, nghề nghiệp); bằng chứng (thí sinh học tủ “trắng tay”, người học vẹt lúng túng trong thực tế). c) Bác bỏ: “điểm cao là được” — điểm ảo không phải năng lực thật; “học hiểu mất thời gian” — học hiểu mới nhớ lâu, nhẹ nhàng. d) Giải pháp: học hiểu bản chất, hệ thống kiến thức, luyện vận dụng. 3) Kết bài: khẳng định; kêu gọi học thật, hiểu thật. BÀI MẪU: “Học tủ, học vẹt vẫn đạt điểm cao nên không cần học hiểu” — quan niệm sai lầm này đang khiến nhiều bạn trẻ tự đánh đổi tương lai mình, và cần phải từ bỏ ngay. Học tủ là đoán đề, học vẹt là thuộc lòng mà không hiểu bản chất. Tác hại của nó thật nghiêm trọng. Trước hết, kiến thức hổng lỗ chỗ: thuộc công thức mà không hiểu thì gặp bài biến tấu là “tắc”; như xây nhà không móng, càng lên cao càng dễ sập. Đã có không ít thí sinh ôm mộng “tủ đè” rồi trắng tay khi đề thi nằm ngoài dự đoán — bằng chứng nhãn tiền cho sự mạo hiểm. Thứ hai, điểm số đạt được chỉ là “điểm ảo”: nó không phản ánh năng lực thật, và sẽ sụp đổ khi bước vào môi trường đòi hỏi tư duy thực sự như đại học hay công việc. Thứ ba, học vẹt giết chết năng lực tư duy: não bộ quen thuộc lòng máy móc sẽ lười suy nghĩ, mất dần khả năng sáng tạo — điều nguy hiểm nhất trong thời đại tri thức. Có bạn bao biện: “miễn điểm cao là được” — nhưng điểm số ảo không mua được năng lực thật, và nhà tuyển dụng cần người làm được việc chứ không cần người thuộc lòng. Có bạn nói “học hiểu mất thời gian” — ngược lại, hiểu bản chất thì nhớ lâu, học một mà biết mười, càng về sau càng nhàn. Muốn từ bỏ, hãy thay đổi phương pháp: học hiểu bản chất thay vì thuộc lòng; hệ thống kiến thức bằng sơ đồ; luyện vận dụng qua bài tập đa dạng. Học thật, hiểu thật mới là con đường duy nhất dẫn tới thành công bền vững. Đừng để những điểm số ảo hôm nay trở thành hối tiếc ngày mai — hãy học bằng trí tuệ, không học bằng trí nhớ máy móc.", "points": 0}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Bằng chứng trong văn nghị luận là gì?", "options": ["A. Lời chào hỏi đầu bài", "B. Chữ kí của tác giả", "C. Tên sách giáo khoa", "D. Những sự thật, số liệu, ví dụ cụ thể, tiêu biểu để chứng minh luận điểm"], "answer": "D", "explain": "Bằng chứng là sự thật, số liệu, ví dụ cụ thể, tiêu biểu — làm cho luận điểm có sức nặng thực tế.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lê Đạt (1929 – 2008) là nhà thơ của nước nào?", "options": ["A. Việt Nam", "B. Nhật Bản", "C. Trung Quốc", "D. Nga"], "answer": "A", "explain": "Lê Đạt là nhà thơ Việt Nam, nổi tiếng với những suy ngẫm sắc sảo về thơ ca và chữ nghĩa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cách sửa lỗi về mạch lạc trong đoạn văn là gì?", "options": ["A. Xác định chủ đề → bỏ câu lạc đề, sắp xếp lại ý theo trình tự hợp lí", "B. Viết thêm một đoạn mới không liên quan", "C. Thêm thật nhiều từ khó", "D. Xóa cả đoạn văn"], "answer": "A", "explain": "Sửa lỗi mạch lạc: xác định chủ đề, bỏ câu lạc đề, sắp xếp ý theo trình tự hợp lí — để nội dung thống nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Luận điểm chính của “Yêu và đồng cảm” (Phong Tử Khải) là gì?", "options": ["A. Tiền bạc là quan trọng nhất", "B. Không nên quan tâm đến ai", "C. Con người cần có tình yêu thương và sự đồng cảm: biết yêu thương và đặt mình vào hoàn cảnh người khác", "D. Con người nên sống ích kỉ"], "answer": "C", "explain": "Phong Tử Khải khẳng định: yêu thương và đồng cảm là nền tảng đạo đức, hạnh phúc của con người.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao trong bài luận thuyết phục, cần có thao tác bác bỏ?", "options": ["A. Để bài viết dài hơn", "B. Để chê bai người khác", "C. Để đoán trước và phản bác ý kiến đối lập, khiến lập luận vững chắc, khó bị phản đối", "D. Để khoe kiến thức"], "answer": "C", "explain": "Bác bỏ giúp “đón đầu” phản đối: phản bác ý kiến trái chiều bằng lí lẽ khiến bài viết vững chắc, thuyết phục hơn.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Cách sắp xếp, trình bày luận cứ một cách chặt chẽ, hợp lí để dẫn tới luận điểm gọi là …", "answer": "lập luận", "explain": "Lập luận là “xương sống” của bài văn nghị luận; lập luận tốt dùng các thao tác phù hợp, sắp xếp khoa học.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Tác giả của văn bản “Chữ bầu lên nhà thơ” là ai?", "answer": "Lê Đạt", "explain": "Lê Đạt — nhà thơ Việt Nam — là tác giả của “Chữ bầu lên nhà thơ”, văn bản bàn về sứ mệnh nhà thơ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong văn nghị luận, thao tác nêu nhận xét, đánh giá về vấn đề sau khi phân tích, chứng minh được gọi là thao tác …", "answer": "bình luận", "explain": "Bình luận là thao tác nêu nhận xét, đánh giá — thường đặt ở cuối quá trình lập luận để nâng tầm vấn đề.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích nghệ thuật lập luận trong văn bản “Yêu và đồng cảm” của Phong Tử Khải.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu “Yêu và đồng cảm” và nét riêng trong lập luận của Phong Tử Khải. 2) Thân đoạn: phân tích — lí lẽ giản dị, gần gũi (xuất phát từ đời sống); bằng chứng là câu chuyện nhỏ chân thực; giọng văn ấm áp, chân thành; thuyết phục bằng tình cảm (“lấy tình thắng lí”); so sánh nhẹ với lối lập luận khô khan. 3) Kết đoạn: khẳng định nghệ thuật phù hợp với chủ đề yêu thương; bài học. BÀI MẪU: Nghệ thuật lập luận trong “Yêu và đồng cảm” của Phong Tử Khải có nét riêng đầy quyến rũ: thuyết phục bằng tình cảm chứ không chỉ bằng lí trí khô khan. Lí lẽ của ông giản dị, gần gũi, xuất phát từ những điều mắt thấy tai nghe trong đời sống hằng ngày — ai đọc cũng thấy hợp lí, thấy gần. Bằng chứng ông đưa ra không phải số liệu phức tạp mà là những câu chuyện nhỏ, chân thực về tình người: giản dị mà thấm thía, khiến người đọc vừa tin vừa xúc động. Đặc biệt, giọng văn ấm áp, chân thành như lời thủ thỉ của người từng trải — người đọc cảm thấy được chia sẻ chứ không bị “dạy dỗ”. Cách lập luận “lấy tình thắng lí” này rất phù hợp với chủ đề: bàn về yêu thương thì phải viết bằng yêu thương. So với lối nghị luận khô khan chỉ chăm chăm vào logic, Phong Tử Khải chứng minh: tình cảm chân thành cũng là một thứ “lí lẽ” mạnh mẽ. Bài học cho người viết: muốn thuyết phục, đừng chỉ nói cho người ta hiểu mà hãy nói cho người ta cảm — lí trí mở đường, tình cảm tiếp sức thì bài viết mới thực sự đi vào lòng người.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích văn bản “Yêu và đồng cảm” của Phong Tử Khải (luận điểm, nghệ thuật, ý nghĩa).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu Phong Tử Khải và “Yêu và đồng cảm”; nêu vấn đề: phân tích nghệ thuật thuyết phục. 2) Thân bài: a) Luận điểm: con người cần yêu thương và đồng cảm. b) Luận cứ: lí lẽ giản dị từ đời sống; bằng chứng là câu chuyện nhỏ chân thực. c) Nghệ thuật: “lấy tình thắng lí”; giọng ấm áp, chân thành; kết cấu tự nhiên. d) Ý nghĩa: bài học về tình người trong xã hội hiện đại (chống vô cảm). 3) Kết bài: khẳng định giá trị; liên hệ (sống yêu thương, đồng cảm). BÀI MẪU: Giữa dòng đời hối hả, “Yêu và đồng cảm” của Phong Tử Khải như một lời nhắc nhở dịu dàng mà thấm thía về tình người. Luận điểm của văn bản giản dị mà sâu sắc: con người cần có tình yêu thương và sự đồng cảm — biết yêu thương người khác và biết đặt mình vào hoàn cảnh của họ để thấu hiểu, sẻ chia. Để thuyết phục, Phong Tử Khải không dùng lí luận cao siêu mà xuất phát từ đời sống: những lí lẽ gần gũi, ai cũng có thể kiểm chứng bằng trải nghiệm của mình. Bằng chứng của ông là những câu chuyện nhỏ, chân thực về tình người trong đời thường — không ồn ào mà thấm thía, khiến người đọc vừa gật gù vừa rưng rưng. Nghệ thuật đặc sắc nhất là cách “lấy tình thắng lí”: giọng văn ấm áp, chân thành như lời tâm sự, khiến người đọc cảm thấy được chia sẻ chứ không bị áp đặt. Bàn về yêu thương bằng chính yêu thương — đó là sự thống nhất tuyệt đẹp giữa nội dung và hình thức. Ý nghĩa của văn bản càng lớn trong xã hội hiện đại: khi con người mải miết chạy theo vật chất, dễ trở nên vô cảm, thì lời kêu gọi yêu thương, đồng cảm là liều thuốc cho tâm hồn. Văn bản dạy ta: hãy quan tâm đến người bên cạnh, hãy đặt mình vào vị trí của người khác trước khi phán xét — bởi một xã hội chỉ thực sự văn minh khi con người biết yêu thương nhau. Đọc “Yêu và đồng cảm”, em tự nhủ sẽ sống chậm lại, quan tâm nhiều hơn, sẻ chia nhiều hơn — vì cho đi yêu thương chính là cách nhận lại hạnh phúc.", "points": 0}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Thao tác chứng minh trong văn nghị luận là gì?", "options": ["A. Hát một bài hát", "B. Đưa bằng chứng xác thực để khẳng định luận điểm", "C. Kể một câu chuyện cười", "D. Vẽ sơ đồ minh họa"], "answer": "B", "explain": "Chứng minh là đưa bằng chứng xác thực để khẳng định luận điểm — thao tác quan trọng nhất của nghị luận.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Nguyên khí” trong luận điểm của Thân Nhân Trung có nghĩa là gì?", "options": ["A. Khí đốt tự nhiên", "B. Không khí trong lành", "C. Khí chất cốt lõi làm nên sức sống của đất nước", "D. Tính khí nóng nảy"], "answer": "C", "explain": "“Nguyên khí” là khí chất cốt lõi, nguồn sức sống; ví hiền tài với nguyên khí là đề cao vai trò quyết định của người tài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ nối nào sau đây dùng để thể hiện quan hệ nguyên nhân – kết quả?", "options": ["A. Đầu tiên, tiếp theo", "B. Tuy nhiên, nhưng, mặc dù", "C. Vì vậy, do đó, cho nên", "D. Ví dụ, chẳng hạn"], "answer": "C", "explain": "“Vì vậy, do đó, cho nên” thể hiện quan hệ nguyên nhân – kết quả; dùng đúng từ nối giúp liên kết chặt chẽ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kết bài của bài luận thuyết phục nên làm gì?", "options": ["A. Kể thêm một câu chuyện mới không liên quan", "B. Hỏi người đọc một câu đố", "C. Khẳng định lại quan điểm và kêu gọi hành động", "D. Xin lỗi người đọc"], "answer": "C", "explain": "Kết bài khẳng định lại quan điểm và kêu gọi hành động — “chốt” lại sức thuyết phục, lan tỏa thông điệp.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "So sánh phong cách nghị luận của Thân Nhân Trung và Phong Tử Khải, nhận xét nào đúng?", "options": ["A. Không có điểm gì khác nhau", "B. Cả hai đều chỉ kể chuyện cười", "C. Cả hai đều khô khan như nhau", "D. Thân Nhân Trung trang trọng, chặt chẽ với lí lẽ và dẫn chứng lịch sử; Phong Tử Khải giản dị, ấm áp, thuyết phục bằng tình cảm"], "answer": "D", "explain": "Hai phong cách, một mục đích: Thân Nhân Trung “lấy lí thắng”, Phong Tử Khải “lấy tình thắng” — đều là mẫu mực của nghệ thuật thuyết phục.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Điền thuật ngữ còn thiếu: Những sự thật, số liệu, ví dụ cụ thể dùng để chứng minh luận điểm gọi là …", "answer": "bằng chứng", "explain": "Bằng chứng phải cụ thể, tiêu biểu, xác thực thì mới có sức thuyết phục.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Trong “Chữ bầu lên nhà thơ”, Lê Đạt bàn về vấn đề gì?", "answer": "sứ mệnh nhà thơ", "explain": "Lê Đạt bàn về sứ mệnh của nhà thơ và sức mạnh của chữ nghĩa: chính “chữ” làm nên nhà thơ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong văn nghị luận, thao tác đặt vấn đề cạnh vấn đề tương đồng hoặc đối lập để làm nổi bật được gọi là thao tác …", "answer": "so sánh", "explain": "So sánh là thao tác đặt cạnh nhau để làm nổi bật đặc điểm — dùng tốt sẽ khiến luận điểm sáng rõ.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ bàn về sức mạnh của sự đồng cảm trong cuộc sống (có lí lẽ và dẫn chứng).", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: nêu luận điểm — đồng cảm có sức mạnh diệu kì. 2) Thân đoạn: lí lẽ (đồng cảm giúp thấu hiểu, xóa khoảng cách, sưởi ấm tâm hồn); dẫn chứng (câu chuyện người mẹ, người thầy, bạn bè đồng cảm; hoặc tấm gương); bác bỏ nhẹ (đồng cảm không phải là yếu đuối). 3) Kết đoạn: khẳng định; kêu gọi sống đồng cảm. BÀI MẪU: Đồng cảm — biết đặt mình vào hoàn cảnh của người khác để thấu hiểu và sẻ chia — có một sức mạnh diệu kì trong cuộc sống. Trước hết, đồng cảm xóa nhòa khoảng cách giữa người với người: khi ta hiểu được nỗi đau của bạn, lời an ủi của ta mới thực sự chạm tới trái tim, thay vì những lời khuyên sáo rỗng. Một cái ôm đúng lúc, một lời “mình hiểu mà” chân thành có thể vực dậy một tâm hồn đang gục ngã — sức mạnh ấy không tiền bạc nào mua được. Trong gia đình, cha mẹ đồng cảm thì con cái dám chia sẻ; ở trường, thầy cô đồng cảm thì học trò thêm tự tin; ngoài xã hội, sự đồng cảm tạo nên một cộng đồng nhân ái. Có người cho rằng đồng cảm là yếu đuối, nhưng thực ra dám mở lòng thấu hiểu người khác cần một tâm hồn mạnh mẽ và bao dung. Ngược lại, thiếu đồng cảm, con người dễ phán xét vội vàng, gây tổn thương nhau. Vì vậy, hãy rèn luyện sự đồng cảm mỗi ngày: lắng nghe nhiều hơn, phán xét ít đi, đặt mình vào vị trí người khác trước khi lên tiếng. Một xã hội mà ai cũng biết đồng cảm sẽ là một xã hội ấm áp, nơi không ai phải chịu đựng nỗi đau một mình.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ thuyết phục các bạn từ bỏ thói quen lười vận động, nghiện màn hình để có lối sống lành mạnh.", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: nêu thực trạng (ngồi lì với điện thoại, lười thể thao); khẳng định cần thay đổi. 2) Thân bài: a) Giải thích thực trạng, biểu hiện. b) Tác hại: sức khỏe (béo phì, cận thị, cột sống, tim mạch — số liệu); tinh thần (trì trệ, tự ti); kĩ năng sống (thiếu giao tiếp thực tế). c) Bác bỏ: “học nhiều không có thời gian”, “thể thao mệt”. d) Giải pháp: 30 phút vận động mỗi ngày, thể thao cùng bạn, giới hạn màn hình. 3) Kết bài: khẳng định; kêu gọi hành động. BÀI MẪU: Nhiều bạn trẻ hôm nay đang tự “giam mình” trong bốn bức tường cùng chiếc điện thoại: ngồi lì hàng giờ, lười vận động, và đã đến lúc chúng ta phải thay đổi để có một lối sống lành mạnh. Thực trạng thật đáng báo động: không ít bạn dành 5-6 giờ mỗi ngày cho màn hình mà không nổi 30 phút vận động; sân trường vắng bóng người chơi thể thao, phòng gym thì xa lạ. Tác hại của lối sống này hiện rõ từng ngày. Về sức khỏe: ngồi nhiều, ít vận động là nguyên nhân hàng đầu của béo phì, cận thị, cong vẹo cột sống ở tuổi học đường; các bác sĩ cảnh báo “ngồi là kẻ giết người thầm lặng”, tăng nguy cơ tim mạch, tiểu đường ngay từ trẻ. Về tinh thần: lười vận động khiến cơ thể trì trệ, tinh thần uể oải, dễ tự ti về ngoại hình; trong khi vận động giúp giải tỏa stress, tăng sự tự tin. Về kĩ năng sống: dán mắt vào màn hình khiến ta thiếu giao tiếp thực tế, kĩ năng ứng xử kém dần. Có bạn bao biện “học nhiều không có thời gian” — nhưng 30 phút vận động mỗi ngày chỉ bằng một phần nhỏ thời gian lướt mạng, mà hiệu quả học tập lại tăng lên nhờ đầu óc tỉnh táo. Có bạn nói “thể thao mệt lắm” — mệt lúc đầu nhưng khỏe về sau, đó là quy luật. Muốn thay đổi, hãy bắt đầu từ việc nhỏ: đi bộ, chạy bộ 30 phút mỗi ngày; rủ bạn chơi cầu lông, bóng đá cuối tuần; đặt giới hạn 2 giờ màn hình giải trí mỗi ngày. Tuổi trẻ là vốn quý nhất — đừng để nó trôi qua trên chiếc ghế với cái cổ cúi gằm vào điện thoại. Hãy đứng dậy, vận động ngay hôm nay, vì một cơ thể khỏe mạnh và một tinh thần minh mẫn.", "points": 0}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Thao tác giải thích trong văn nghị luận là gì?", "options": ["A. Kể chuyện cười cho vui", "B. Chép lại đề bài", "C. Làm rõ nghĩa của vấn đề, khái niệm trước khi bàn luận", "D. Vẽ tranh minh họa"], "answer": "C", "explain": "Giải thích là thao tác mở đầu: làm rõ khái niệm để người đọc hiểu đúng vấn đề rồi mới bàn sâu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Văn bản “Hiền tài là nguyên khí của quốc gia” được khắc trên bia đá ở đâu?", "options": ["A. Hoàng thành Thăng Long", "B. Văn Miếu – Quốc Tử Giám", "C. Chùa Một Cột", "D. Phố cổ Hội An"], "answer": "B", "explain": "Bài kí đề danh tiến sĩ được khắc trên bia đá ở Văn Miếu – Quốc Tử Giám — nơi tôn vinh hiền tài.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Từ nào sau đây là từ nối thể hiện sự nhượng bộ, đối lập?", "options": ["A. Tuy nhiên, mặc dù, nhưng", "B. Vì vậy, cho nên", "C. Chẳng hạn, ví dụ", "D. Đầu tiên, sau đó"], "answer": "A", "explain": "“Tuy nhiên, mặc dù, nhưng” thể hiện quan hệ đối lập, nhượng bộ; dùng đúng giúp liên kết ý mạch lạc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mở bài của bài luận thuyết phục từ bỏ một thói quen xấu cần làm gì?", "options": ["A. Kể một câu chuyện không liên quan", "B. Nêu thực trạng thói quen xấu và khẳng định quan điểm cần từ bỏ", "C. Chê bai những người có thói quen xấu", "D. Hỏi người đọc có thích không"], "answer": "B", "explain": "Mở bài nêu thực trạng và khẳng định quan điểm — đặt vấn đề rõ ràng để dẫn dắt toàn bài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao “Chữ bầu lên nhà thơ” có cách nói gây ấn tượng mạnh?", "options": ["A. Vì dùng nhiều từ khó", "B. Vì bài viết rất dài", "C. Vì không có luận điểm", "D. Vì cách nói nghịch lí, đảo ngược quan niệm thông thường: chính “chữ” làm nên nhà thơ"], "answer": "D", "explain": "“Chữ bầu lên nhà thơ” đảo ngược quan niệm (người ta thường nghĩ nhà thơ tạo ra chữ) — nghịch lí mà thấm thía, gây ấn tượng mạnh.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Nêu tên tác giả của bài kí “Hiền tài là nguyên khí của quốc gia”.", "answer": "Thân Nhân Trung", "explain": "Thân Nhân Trung (1419 – 1499) — danh sĩ đời Lê sơ — là tác giả bài kí nổi tiếng năm 1484.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trong câu “Học tập là nhiệm vụ quan trọng. Vì vậy, chúng ta cần chăm chỉ”, từ “Vì vậy” thể hiện quan hệ ý nghĩa nào?", "answer": "nguyên nhân – kết quả", "explain": "“Vì vậy” nối ý nguyên nhân (học tập quan trọng) với kết quả (cần chăm chỉ) — quan hệ nguyên nhân – kết quả.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Khi viết bài luận thuyết phục, việc đoán trước ý kiến phản đối của người đọc rồi phản bác nó thuộc thao tác lập luận nào?", "answer": "bác bỏ", "explain": "Đón trước phản đối để bác bỏ là cách dùng thao tác bác bỏ một cách chủ động, khiến bài viết vững chắc hơn.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích cách sử dụng bằng chứng trong văn bản “Hiền tài là nguyên khí của quốc gia”.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: giới thiệu vai trò của bằng chứng trong bài kí của Thân Nhân Trung. 2) Thân đoạn: phân tích — bằng chứng lịch sử (các triều đại trọng tài thì thịnh, bỏ quên thì suy); bằng chứng thực tế (việc khắc bia đề danh tiến sĩ); đặc điểm: tiêu biểu, xác thực, gắn với lí lẽ; tác dụng: biến lí lẽ trừu tượng thành điều có thật, tăng sức thuyết phục. 3) Kết đoạn: khẳng định nghệ thuật dùng bằng chứng mẫu mực; bài học. BÀI MẪU: Bằng chứng là một trong những yếu tố làm nên sức thuyết phục bền vững của “Hiền tài là nguyên khí của quốc gia”. Thân Nhân Trung không nói suông mà đưa ra những bằng chứng lịch sử tiêu biểu, xác thực: các triều đại biết trọng dụng hiền tài thì quốc gia thịnh trị, còn thời nào bỏ quên nhân tài thì thế nước suy vi — đó là bài học được lịch sử kiểm chứng, không ai có thể phủ nhận. Đặc biệt, chính việc khắc bia đề danh tiến sĩ là một bằng chứng “sống”: nhà nước đã hành động để tôn vinh, khuyến khích hiền tài, chứ không chỉ nói suông. Các bằng chứng được lựa chọn kĩ lưỡng: tiêu biểu (đại diện cho quy luật), xác thực (có thật trong lịch sử), và luôn gắn chặt với lí lẽ — bằng chứng nào cũng nhằm chứng minh cho quan hệ nhân quả giữa hiền tài và vận nước. Nhờ đó, những lí lẽ trừu tượng về “nguyên khí” trở nên cụ thể, mắt thấy tai nghe, khiến người đọc vừa hiểu vừa tin. Nghệ thuật dùng bằng chứng của Thân Nhân Trung là bài học mẫu mực: muốn thuyết phục, đừng chỉ nói lí thuyết mà hãy đưa ra sự thật; bằng chứng càng cụ thể, tiêu biểu thì luận điểm càng đứng vững.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ phân tích văn bản “Chữ bầu lên nhà thơ” của Lê Đạt (luận điểm, nghệ thuật, ý nghĩa).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: giới thiệu Lê Đạt và “Chữ bầu lên nhà thơ”; nêu vấn đề: phân tích nghệ thuật thuyết phục. 2) Thân bài: a) Luận điểm: sứ mệnh nhà thơ và sức mạnh của chữ nghĩa — chính “chữ” làm nên nhà thơ. b) Nghệ thuật: cách nói nghịch lí, độc đáo; lập luận sắc sảo; giàu liên tưởng, hình ảnh; giọng trí tuệ, tâm huyết. c) Ý nghĩa: bài học về lao động nghệ thuật nghiêm túc; trách nhiệm với chữ nghĩa, với đời. 3) Kết bài: khẳng định giá trị; liên hệ (người viết trẻ: trau dồi chữ nghĩa). BÀI MẪU: “Chữ bầu lên nhà thơ” của Lê Đạt là một văn bản nghị luận đặc sắc, với luận điểm độc đáo ngay từ nhan đề: chính “chữ” — ngôn từ được lao động nghệ thuật — làm nên nhà thơ, chứ không phải ngược lại. Quan niệm này đảo ngược cách nghĩ thông thường (ta vẫn tưởng nhà thơ tạo ra chữ), tạo nên một nghịch lí đầy ám ảnh: không có sự khổ luyện với chữ nghĩa thì không có nhà thơ đích thực. Để thuyết phục, Lê Đạt triển khai lập luận sắc sảo: ông phân tích mối quan hệ máu thịt giữa nhà thơ và chữ — chữ không phải công cụ vô tri mà là sinh thể có hồn, đòi hỏi người viết phải “bầu” nó lên bằng tài năng và tâm huyết; nhà thơ phải có trách nhiệm với từng con chữ mình viết ra, vì chữ sẽ sống lâu hơn người. Lập luận giàu liên tưởng, hình ảnh, được diễn đạt bằng giọng văn trí tuệ mà tâm huyết, khiến người đọc vừa thán phục vừa thấm thía. Ý nghĩa của văn bản vượt ra khỏi phạm vi thơ ca: đó là bài học về lao động nghệ thuật nghiêm túc — tài năng phải đi cùng khổ luyện; và là lời nhắc nhở về trách nhiệm của người cầm bút với chữ nghĩa, với cuộc đời. Trong thời đại bùng nổ thông tin, khi nhiều người viết cẩu thả, qua loa, thông điệp của Lê Đạt càng thiết thực: hãy trân trọng từng con chữ, viết có trách nhiệm. Với người trẻ yêu văn chương, “Chữ bầu lên nhà thơ” là kim chỉ nam: muốn thành nhà văn, trước hết hãy làm người thợ cần mẫn của chữ nghĩa.", "points": 0}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Thao tác phân tích trong văn nghị luận là gì?", "options": ["A. Chỉ nêu kết luận", "B. Chia vấn đề thành các mặt, các khía cạnh để xem xét sâu", "C. Bỏ qua chi tiết", "D. Gộp mọi vấn đề thành một"], "answer": "B", "explain": "Phân tích là chia nhỏ vấn đề để xem xét từng mặt — giúp bài viết sâu sắc, toàn diện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "“Hiền tài là nguyên khí của quốc gia” bàn về vai trò của ai đối với đất nước?", "options": ["A. Người nước ngoài", "B. Người tài đức (hiền tài)", "C. Người nổi tiếng", "D. Người giàu có"], "answer": "B", "explain": "Văn bản khẳng định vai trò quyết định của người tài đức (hiền tài) đối với vận nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dấu hiệu nào giúp nhận biết đoạn văn mắc lỗi liên kết?", "options": ["A. Đoạn văn có mở bài", "B. Đoạn văn có nhiều câu", "C. Đoạn văn viết về một chủ đề", "D. Ý đứt đoạn, câu đứng chơ vơ, thiếu từ nối hoặc dùng từ nối sai"], "answer": "D", "explain": "Đọc to đoạn văn: chỗ nào thấy “vấp”, ý nhảy cóc, câu lạc lõng — đó là chỗ mất liên kết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong xã hội hiện nay, bài học “trọng hiền tài” của Thân Nhân Trung có ý nghĩa gì?", "options": ["A. Đã lỗi thời, không còn giá trị", "B. Chỉ áp dụng cho nhà văn", "C. Vẫn nguyên giá trị: muốn phát triển phải phát hiện, đào tạo, sử dụng đúng người tài", "D. Chỉ đúng với thời phong kiến"], "answer": "C", "explain": "Bài học trọng hiền tài vượt thời gian: mọi quốc gia muốn phát triển đều phải trọng dụng nhân tài — chống bệnh hình thức, quan liêu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi viết đoạn văn nghị luận, cần đảm bảo yêu cầu nào về mạch lạc?", "options": ["A. Viết càng dài càng tốt", "B. Các câu đều hướng về một chủ đề, sắp xếp theo trình tự hợp lí", "C. Sắp xếp câu ngẫu nhiên", "D. Mỗi câu nói một chủ đề khác nhau"], "answer": "B", "explain": "Mạch lạc đòi hỏi thống nhất chủ đề và trình tự hợp lí — “xương sống” của đoạn văn.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Văn bản “Hiền tài là nguyên khí của quốc gia” được viết nhằm mục đích gì (khắc bia đề danh)?", "answer": "tôn vinh hiền tài", "explain": "Bài kí đề danh tiến sĩ nhằm tôn vinh, khuyến khích hiền tài — thể hiện chủ trương trọng dụng nhân tài.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu một biểu hiện của lỗi dùng từ “sai phong cách” khi viết văn.", "answer": "dùng từ suồng sã trong văn trang trọng", "explain": "Sai phong cách: dùng từ suồng sã, khẩu ngữ trong văn bản trang trọng (hoặc ngược lại) — gây phản cảm, kém thuyết phục.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong “Yêu và đồng cảm”, Phong Tử Khải đã dùng kiểu bằng chứng nào là chủ yếu?", "answer": "câu chuyện đời thường", "explain": "Phong Tử Khải dùng những câu chuyện nhỏ, chân thực trong đời sống làm bằng chứng — giản dị mà thấm thía.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ bàn về vai trò của hiền tài đối với đất nước hôm nay (liên hệ “Hiền tài là nguyên khí của quốc gia”).", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: nêu luận điểm — hiền tài vẫn là nguyên khí của quốc gia hôm nay. 2) Thân đoạn: lí lẽ (đất nước phát triển cần người tài trong mọi lĩnh vực: khoa học, kinh tế, văn hóa); bằng chứng (tấm gương nhân tài đóng góp; đất nước trọng dụng nhân tài thì tiến bộ); liên hệ tư tưởng Thân Nhân Trung; phê phán bệnh hình thức, chảy máu chất xám. 3) Kết đoạn: khẳng định; kêu gọi (trọng dụng nhân tài; tuổi trẻ phấn đấu thành hiền tài). BÀI MẪU: Hơn năm trăm năm sau bài kí của Thân Nhân Trung, chân lí “Hiền tài là nguyên khí của quốc gia” vẫn nguyên giá trị trong thời đại hôm nay. Đất nước muốn phát triển nhanh, bền vững thì không thể thiếu những người tài đức trong mọi lĩnh vực: nhà khoa học đưa công nghệ tiến lên, doanh nhân tạo việc làm, thầy thuốc cứu người, thầy giáo trồng người. Thực tế cho thấy: quốc gia nào trọng dụng nhân tài — tạo môi trường tốt, đãi ngộ xứng đáng — thì phát triển vượt bậc; nơi nào để “chảy máu chất xám”, dùng người không đúng tài thì trì trệ. Đáng buồn là đâu đó vẫn còn bệnh hình thức, quan liêu trong dùng người, khiến người tài nản lòng. Vì vậy, bài học của Thân Nhân Trung càng thiết thực: phải phát hiện, đào tạo và sử dụng đúng người tài, coi đó là quốc sách hàng đầu. Với tuổi trẻ chúng em, thông điệp ấy là lời kêu gọi: hãy học tập, rèn đức luyện tài để trở thành “hiền tài” — người vừa có tài vừa có đức, sẵn sàng cống hiến cho quê hương. Tương lai đất nước nằm trong tay những hiền tài hôm nay đang ngồi trên ghế nhà trường.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ bàn về vai trò của tri thức đối với sự phát triển của đất nước (liên hệ tư tưởng “trọng hiền tài”).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: nêu vấn đề — tri thức là sức mạnh; liên hệ tư tưởng trọng hiền tài. 2) Thân bài: a) Giải thích: tri thức là gì, hiền tài là người có tri thức + đức. b) Vai trò: tri thức thúc đẩy kinh tế, khoa học, văn hóa; bằng chứng (cách mạng công nghiệp, kinh tế tri thức; tấm gương); so sánh nước trọng tri thức và nước kém phát triển. c) Bác bỏ: “học nhiều không bằng quen biết”, “bằng cấp không quan trọng”. d) Giải pháp: đầu tư giáo dục, trọng dụng nhân tài; tuổi trẻ học tập. 3) Kết bài: khẳng định; kêu gọi. BÀI MẪU: Từ bài kí “Hiền tài là nguyên khí của quốc gia” của Thân Nhân Trung đến hôm nay, một chân lí không đổi: tri thức là sức mạnh quyết định sự phát triển của đất nước. Tri thức thúc đẩy mọi mặt đời sống: trong kinh tế, tri thức tạo ra công nghệ, nâng cao năng suất — các “con rồng” châu Á vươn lên nhờ đầu tư cho giáo dục và khoa học; trong xã hội, tri thức nâng cao dân trí, xây dựng nếp sống văn minh; trong quốc phòng, tri thức là sức mạnh bảo vệ Tổ quốc. Lịch sử đã chứng minh: cuộc cách mạng công nghiệp nào cũng bắt đầu từ tri thức; quốc gia nào coi trọng hiền tài thì thịnh vượng, quốc gia nào coi nhẹ thì tụt hậu. Có ý kiến cho rằng “học nhiều không bằng quen biết rộng” — đó là tư tưởng lạc hậu, đi ngược quy luật phát triển; thực tế, người có tri thức thật luôn được trọng dụng ở mọi môi trường lành mạnh. Có người nói “bằng cấp không quan trọng” — đúng là bằng cấp không đồng nghĩa với tri thức, nhưng đó không phải lí do để coi nhẹ học tập, mà là lí do để học thật, học thực chất. Muốn phát huy vai trò của tri thức, đất nước cần đầu tư mạnh cho giáo dục, tạo môi trường để nhân tài cống hiến, chống bệnh hình thức trong dùng người. Với tuổi trẻ, thông điệp rõ ràng: hãy học tập không ngừng để trở thành “hiền tài” — người có tri thức và có đức. Tương lai đất nước phụ thuộc vào tri thức của thế hệ hôm nay — đó vừa là cơ hội, vừa là trách nhiệm thiêng liêng.", "points": 0}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Thao tác bác bỏ trong văn nghị luận là gì?", "options": ["A. Bỏ qua ý kiến trái chiều", "B. Khen ngợi mọi ý kiến", "C. Chỉ ra cái sai của ý kiến đối lập để khẳng định ý kiến đúng", "D. Chép lại ý kiến người khác"], "answer": "C", "explain": "Bác bỏ là chỉ ra cái sai của ý kiến đối lập để khẳng định ý kiến đúng — khiến bài viết vững chắc hơn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giọng văn trong “Yêu và đồng cảm” của Phong Tử Khải có đặc điểm gì?", "options": ["A. Ấm áp, chân thành như lời thủ thỉ", "B. Lạnh lùng, xa cách", "C. Hài hước, châm biếm", "D. Gay gắt, đanh thép"], "answer": "A", "explain": "Phong Tử Khải viết bằng giọng ấm áp, chân thành — thuyết phục bằng tình cảm, khiến người đọc cảm thấy được chia sẻ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu văn biền ngẫu có đặc điểm gì?", "options": ["A. Các vế đối nhau từng cặp, nhịp nhàng", "B. Viết tùy hứng, không cần nhịp", "C. Chỉ có một vế", "D. Toàn câu hỏi"], "answer": "A", "explain": "Câu văn biền ngẫu có các vế đối nhau từng cặp, tạo nhịp điệu trang trọng, hùng hồn — đặc trưng văn nghị luận trung đại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cần thêm từ nối khi sửa lỗi liên kết?", "options": ["A. Để khoe vốn từ", "B. Để câu văn dài hơn", "C. Để viết khó hiểu hơn", "D. Để gắn nối các câu, các ý thành mạch trôi chảy, rõ quan hệ ý nghĩa"], "answer": "D", "explain": "Từ nối là “khớp nối” giữa các câu, các ý; thêm từ nối phù hợp giúp văn bản trôi chảy, rõ quan hệ nguyên nhân, đối lập…", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong bài luận thuyết phục từ bỏ thói quen xấu, thao tác nào giúp “đón đầu” sự phản đối của người đọc?", "options": ["A. Thao tác vẽ tranh", "B. Thao tác bác bỏ", "C. Thao tác hát", "D. Thao tác kể chuyện cười"], "answer": "B", "explain": "Đoán trước ý kiến phản đối rồi bác bỏ bằng lí lẽ là cách dùng thao tác bác bỏ chủ động, khiến bài viết khó bị bắt bẻ.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Nêu một thao tác lập luận thường dùng để làm rõ nghĩa của khái niệm trước khi bàn luận.", "answer": "giải thích", "explain": "Giải thích là thao tác mở đầu: làm rõ khái niệm để người đọc hiểu đúng vấn đề rồi mới bàn sâu.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trong “Hiền tài là nguyên khí của quốc gia”, Thân Nhân Trung đã dùng loại bằng chứng nào là chủ yếu?", "answer": "dẫn chứng lịch sử", "explain": "Thân Nhân Trung dùng dẫn chứng lịch sử (các triều đại thịnh – suy) — bằng chứng xác thực, có sức nặng thuyết phục.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Câu nói “chữ bầu lên nhà thơ” của Lê Đạt gây ấn tượng vì đã sử dụng thủ pháp lập luận nào?", "answer": "nghịch lí", "explain": "Cách nói nghịch lí (đảo ngược quan niệm thông thường) gây ấn tượng mạnh, khiến người đọc phải suy ngẫm.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ phân tích giọng điệu trong văn nghị luận (so sánh giọng trang trọng của Thân Nhân Trung và giọng ấm áp của Phong Tử Khải).", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: nêu luận điểm — giọng điệu góp phần tạo sức thuyết phục. 2) Thân đoạn: phân tích — Thân Nhân Trung: trang trọng, nghiêm túc (văn bia, biền ngẫu) phù hợp luận đề lớn về vận nước; Phong Tử Khải: ấm áp, chân thành (chuyện đời thường) phù hợp chủ đề yêu thương; so sánh: khác nhau mà cùng thuyết phục — giọng điệu phải phù hợp nội dung, đối tượng. 3) Kết đoạn: bài học (chọn giọng điệu phù hợp khi viết). BÀI MẪU: Giọng điệu là một yếu tố thầm lặng mà mạnh mẽ tạo nên sức thuyết phục của văn nghị luận, thể hiện rõ qua hai văn bản trong bài học. Thân Nhân Trung trong “Hiền tài là nguyên khí của quốc gia” dùng giọng trang trọng, nghiêm túc: câu văn biền ngẫu đối xứng, từ ngữ cổ kính, nhịp điệu hùng hồn — xứng với văn bia đá và luận đề lớn lao về vận nước. Giọng trang trọng khiến người đọc cảm thấy vấn đề hệ trọng, đáng suy ngẫm. Ngược lại, Phong Tử Khải trong “Yêu và đồng cảm” dùng giọng ấm áp, chân thành như lời thủ thỉ: câu văn giản dị, gần gũi, thấm đẫm tình người — xứng với chủ đề yêu thương. Giọng ấm áp khiến người đọc cảm thấy được chia sẻ chứ không bị áp đặt. Hai giọng điệu khác nhau mà cùng đạt hiệu quả thuyết phục cao, chứng tỏ một nguyên tắc: giọng điệu phải phù hợp với nội dung và đối tượng. Bàn chuyện quốc gia đại sự thì trang trọng; bàn chuyện tình người thì ấm áp. Bài học cho người viết: đừng viết một giọng cho mọi bài; hãy “chọn giọng” như chọn trang phục — phù hợp thì đẹp, không phù hợp thì phản cảm, kém thuyết phục.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ thuyết phục các bạn từ bỏ thói quen xả rác bừa bãi để bảo vệ môi trường.", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: nêu thực trạng xả rác (trường học, nơi công cộng); khẳng định cần từ bỏ. 2) Thân bài: a) Biểu hiện: vứt rác bừa bãi, khạc nhổ, vẽ bậy… b) Tác hại: môi trường (ô nhiễm, mất mĩ quan — dẫn chứng); sức khỏe (dịch bệnh); hình ảnh con người, đất nước (du khách đánh giá); bằng chứng cụ thể. c) Bác bỏ: “một mình tôi không ảnh hưởng”, “có người quét dọn rồi”. d) Giải pháp: bỏ rác đúng nơi, phân loại, nhắc nhau, phạt nghiêm. 3) Kết bài: khẳng định; kêu gọi hành động. BÀI M�ẪU: Xả rác bừa bãi đang là thói quen xấu làm xấu đi hình ảnh của chúng ta, và đã đến lúc mỗi người phải dũng cảm từ bỏ nó để bảo vệ môi trường sống. Thực trạng thật đáng buồn: sân trường sau giờ ra chơi đầy vỏ kẹo, chai nhựa; công viên, bãi biển ngập rác sau ngày lễ; có bạn vô tư vứt rác qua cửa sổ, khạc nhổ bừa bãi nơi công cộng. Tác hại của thói quen này hiện rõ từng ngày. Về môi trường: rác thải làm ô nhiễm đất, nước, không khí; rác nhựa mất hàng trăm năm mới phân hủy, giết chết sinh vật biển — những hình ảnh rùa biển mắc rác nhựa khiến ai cũng xót xa. Về sức khỏe: bãi rác bừa bãi là ổ dịch bệnh, ruồi muỗi, ảnh hưởng trực tiếp đến cộng đồng. Về hình ảnh: một đất nước mà người dân xả rác bừa bãi sẽ mất điểm trong mắt du khách, ảnh hưởng đến du lịch và lòng tự hào dân tộc. Có bạn bao biện: “một mình tôi xả thì ảnh hưởng gì” — nhưng hàng triệu cái “một mình” gộp lại thành núi rác; môi trường chỉ sạch khi mỗi người đều có ý thức. Có bạn nói “đã có người quét dọn” — đó là sự ỷ lại đáng xấu hổ; người quét dọn không phải để dọn cho sự vô ý thức của ta. Muốn từ bỏ, hãy bắt đầu từ việc nhỏ nhất: bỏ rác đúng nơi quy định, phân loại rác tại nguồn, mang theo túi vải thay túi ni-lông, và dũng cảm nhắc nhở người xả rác bừa bãi. Môi trường là ngôi nhà chung — giữ nó sạch đẹp chính là giữ thể diện và sức khỏe cho chính mình. Hãy từ bỏ thói quen xả rác bừa bãi ngay hôm nay, để mai này con cháu chúng ta được sống trong một đất nước xanh – sạch – đẹp.", "points": 0}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Thao tác so sánh trong văn nghị luận là gì?", "options": ["A. So sánh chiều cao của tác giả", "B. Đếm số chữ trong bài", "C. Đặt vấn đề cạnh vấn đề tương đồng hoặc đối lập để làm nổi bật", "D. Làm toán so sánh số học"], "answer": "C", "explain": "So sánh là đặt cạnh nhau để làm nổi bật đặc điểm — dùng tốt sẽ khiến luận điểm sáng rõ, dễ hiểu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mạch lạc trong đoạn văn, văn bản là gì?", "options": ["A. Dùng nhiều màu mực", "B. Viết chữ thật đẹp", "C. Sự thống nhất, liền mạch về nội dung: các câu, các đoạn đều hướng về chủ đề chung", "D. Viết thật dài"], "answer": "C", "explain": "Mạch lạc là “xương sống” nội dung: mọi câu, mọi đoạn đều hướng về chủ đề chung, sắp xếp hợp lí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Liên kết trong đoạn văn, văn bản là gì?", "options": ["A. Sự gắn nối về hình thức giữa các câu, các đoạn bằng từ nối, phép lặp, phép thế", "B. Dán ảnh minh họa", "C. Buộc các trang giấy lại với nhau", "D. Đánh số trang"], "answer": "A", "explain": "Liên kết là “khớp nối” hình thức: từ nối, phép lặp, phép thế… giúp câu văn trôi chảy, gắn bó.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi viết bài luận thuyết phục, bằng chứng như thế nào mới có sức thuyết phục cao?", "options": ["A. Càng khó kiểm chứng càng tốt", "B. Bịa ra cho hấp dẫn", "C. Càng cụ thể, tiêu biểu, xác thực càng tốt", "D. Càng chung chung càng tốt"], "answer": "C", "explain": "Bằng chứng phải cụ thể, tiêu biểu, xác thực — bịa đặt hoặc chung chung sẽ phản tác dụng, mất lòng tin.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nào sau đây thể hiện đúng tinh thần “trọng hiền tài” trong thời đại ngày nay?", "options": ["A. Dùng người theo quan hệ thân quen", "B. Chỉ trọng người nổi tiếng trên mạng", "C. Phát hiện, đào tạo, sử dụng đúng người có tài đức; chống bệnh hình thức, quan liêu", "D. Chỉ trọng người giàu"], "answer": "C", "explain": "Trọng hiền tài hôm nay là dùng đúng người tài đức, chống hình thức, quan liêu — kế sách phát triển bền vững.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Nêu tên một thao tác lập luận dùng để chỉ ra cái sai của ý kiến đối lập.", "answer": "bác bỏ", "explain": "Bác bỏ là thao tác phản bác ý kiến sai/trái chiều để khẳng định ý kiến đúng.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trong câu “Tuy trời mưa nhưng chúng em vẫn đến trường”, từ “nhưng” thể hiện quan hệ ý nghĩa nào?", "answer": "đối lập", "explain": "“Nhưng” nối hai ý đối lập (trời mưa – vẫn đến trường) — quan hệ nhượng bộ, đối lập.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Văn bản “Hiền tài là nguyên khí của quốc gia” có sức sống lâu bền vì đã kết hợp thành công yếu tố nào?", "answer": "lí trí và tình cảm", "explain": "Văn bản vừa có lí lẽ chặt chẽ (lí trí) vừa có giọng tha thiết yêu nước (tình cảm) — sự kết hợp làm nên sức thuyết phục bền vững.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ bàn về yêu cầu mạch lạc và liên kết khi viết văn (lấy ví dụ minh họa).", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: nêu luận điểm — mạch lạc và liên kết là yêu cầu bắt buộc của văn bản. 2) Thân đoạn: giải thích (mạch lạc: thống nhất nội dung; liên kết: gắn nối hình thức); ví dụ minh họa (đoạn văn tốt vs đoạn văn lạc đề, thiếu từ nối); tác hại khi thiếu (khó hiểu, kém thuyết phục). 3) Kết đoạn: khẳng định; liên hệ (rèn luyện khi viết). BÀI MẪU: Mạch lạc và liên kết là hai yêu cầu bắt buộc làm nên một văn bản tốt, như “xương sống” và “khớp nối” của cơ thể bài viết. Mạch lạc là sự thống nhất về nội dung: mọi câu, mọi đoạn đều hướng về một chủ đề, sắp xếp theo trình tự hợp lí. Một đoạn văn bàn về tác hại của thức khuya mà xen vào câu chuyện đi du lịch là mất mạch lạc — người đọc sẽ hoang mang không biết tác giả muốn nói gì. Liên kết là sự gắn nối về hình thức: dùng từ nối (“vì vậy”, “tuy nhiên”, “bên cạnh đó”), phép lặp, phép thế để các câu gắn với nhau thành mạch trôi chảy. Thiếu liên kết, dù ý đúng, câu văn vẫn rời rạc, đứt đoạn như những viên gạch không có vữa. Ví dụ: viết “Học tập rất quan trọng. Chúng ta cần chăm chỉ” mà thiếu từ nối “vì vậy” thì hai câu đứng chơ vơ, kém gắn bó. Ngược lại, đoạn văn mạch lạc, liên kết tốt sẽ dẫn dắt người đọc đi từ ý này sang ý khác một cách tự nhiên, tăng sức thuyết phục. Vì vậy, khi viết văn, hãy luôn tự hỏi: các ý có cùng hướng về chủ đề không (mạch lạc)? Các câu đã được nối với nhau trôi chảy chưa (liên kết)? Rèn luyện hai kĩ năng này, bài viết của ta sẽ vững chắc và thuyết phục hơn nhiều.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ bàn về lòng đồng cảm trong xã hội hiện nay (liên hệ “Yêu và đồng cảm” của Phong Tử Khải).", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: nêu vấn đề — xã hội hiện đại và nguy cơ vô cảm; liên hệ Phong Tử Khải. 2) Thân bài: a) Giải thích: đồng cảm là gì. b) Thực trạng: mặt tốt (nhiều tấm lòng nhân ái) và mặt xấu (vô cảm: thờ ơ trước nỗi đau người khác — dẫn chứng). c) Vì sao cần đồng cảm: gắn kết con người, sưởi ấm tâm hồn, xây dựng xã hội nhân ái; hậu quả của vô cảm. d) Bác bỏ: “đồng cảm là yếu đuối”, “lo cho mình chưa xong”. e) Giải pháp: rèn luyện từ việc nhỏ (lắng nghe, sẻ chia, thiện nguyện). 3) Kết bài: khẳng định; kêu gọi. BÀI MẪU: Phong Tử Khải đã viết “Yêu và đồng cảm” từ nhiều thập kỉ trước, nhưng lời kêu gọi ấy càng thiết thực trong xã hội hiện nay — khi con người có nguy cơ trở nên vô cảm giữa dòng đời hối hả. Đồng cảm là biết đặt mình vào hoàn cảnh của người khác để thấu hiểu và sẻ chia. Thực trạng xã hội hôm nay có hai mặt: bên cạnh những tấm lòng nhân ái — người dân quyên góp giúp đồng bào bão lụt, bạn trẻ làm thiện nguyện — vẫn còn không ít biểu hiện vô cảm đáng buồn: thờ ơ trước người gặp nạn, cười cợt trên nỗi đau người khác, “ném đá” vô tội vạ trên mạng xã hội. Vô cảm khiến con người xa cách nhau, xã hội lạnh lẽo; một cộng đồng mà ai cũng chỉ lo cho mình thì không thể gọi là văn minh. Ngược lại, đồng cảm có sức mạnh diệu kì: nó sưởi ấm những tâm hồn tổn thương, gắn kết người với người, tạo nên một xã hội nhân ái. Có người cho rằng đồng cảm là yếu đuối, “lo cho mình chưa xong hơi đâu lo cho người” — nhưng thực ra, dám mở lòng thấu hiểu cần một tâm hồn mạnh mẽ; và cho đi yêu thương chính là cách nhận lại hạnh phúc. Muốn nuôi dưỡng đồng cảm, hãy bắt đầu từ việc nhỏ: lắng nghe nhiều hơn, phán xét ít đi; quan tâm đến người bên cạnh; tham gia hoạt động thiện nguyện. “Yêu và đồng cảm” nhắc nhở mỗi chúng ta: đừng để cuộc sống vội vã làm chai sạn trái tim — hãy giữ cho tâm hồn luôn ấm áp tình người, vì đó mới là giá trị làm nên con người.", "points": 0}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Thao tác bình luận trong văn nghị luận là gì?", "options": ["A. Chê mọi thứ đều xấu", "B. Nêu nhận xét, đánh giá về vấn đề sau khi phân tích, chứng minh", "C. Khen mọi thứ đều tốt", "D. Im lặng không nói gì"], "answer": "B", "explain": "Bình luận là nêu nhận xét, đánh giá — thường đặt cuối quá trình lập luận để nâng tầm vấn đề.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi sửa lỗi về liên kết, việc cần làm là gì?", "options": ["A. Viết thêm nhiều câu không liên quan", "B. Đổi toàn bộ từ ngữ", "C. Xóa hết từ nối", "D. Thêm từ nối phù hợp, sửa từ nối dùng sai, bỏ từ lặp thừa"], "answer": "D", "explain": "Sửa lỗi liên kết: thêm từ nối phù hợp, sửa từ nối sai nghĩa, bỏ lặp thừa — để câu văn gắn bó, trôi chảy.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mở bài của bài luận thuyết phục từ bỏ một quan niệm sai lầm cần làm gì?", "options": ["A. Kể chuyện không liên quan", "B. Nêu quan niệm sai lầm và khẳng định quan điểm cần từ bỏ nó", "C. Khen quan niệm sai lầm", "D. Hỏi người đọc ăn cơm chưa"], "answer": "B", "explain": "Mở bài nêu quan niệm sai lầm và khẳng định quan điểm — đặt vấn đề rõ ràng, dẫn dắt toàn bài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung trong nghệ thuật thuyết phục của ba văn bản trong Bài 3 là gì?", "options": ["A. Đều chỉ dùng cảm xúc", "B. Đều rất ngắn gọn, sơ sài", "C. Đều viết bằng thơ", "D. Đều có luận điểm rõ ràng, luận cứ xác đáng và lập luận chặt chẽ, phù hợp với nội dung"], "answer": "D", "explain": "Dù phong cách khác nhau (trang trọng – ấm áp – sắc sảo), cả ba đều tuân thủ công thức: luận điểm rõ + luận cứ xác đáng + lập luận chặt chẽ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi thảo luận nhóm về một vấn đề có ý kiến khác nhau, cách ứng xử đúng là gì?", "options": ["A. Bỏ về giữa chừng", "B. Im lặng không tham gia", "C. Cãi nhau thật to để thắng", "D. Lắng nghe, tôn trọng khác biệt, trình bày quan điểm bằng lí lẽ, phản bác lịch sự, hướng tới đồng thuận"], "answer": "D", "explain": "Thảo luận văn minh: lắng nghe, tôn trọng, lí lẽ, lịch sự và hướng tới đồng thuận — đó cũng là nghệ thuật thuyết phục.", "points": 0.25}, {"type": "short", "level": "TH", "q": "Nêu tên một thao tác lập luận dùng để làm rõ nghĩa của khái niệm trước khi bàn luận.", "answer": "giải thích", "explain": "Giải thích là thao tác mở đầu: làm rõ khái niệm để người đọc hiểu đúng vấn đề rồi mới bàn sâu.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trong bài luận thuyết phục, phần nào có nhiệm vụ “đón đầu” và phản bác ý kiến đối lập?", "answer": "thân bài", "explain": "Trong thân bài, sau khi phân tích, người viết dùng thao tác bác bỏ để đón trước phản đối — khiến lập luận vững chắc.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Theo Lê Đạt, yếu tố nào “bầu” nên nhà thơ (làm nên nhà thơ đích thực)?", "answer": "chữ", "explain": "Lê Đạt khẳng định: chính “chữ” — ngôn từ được lao động nghệ thuật — làm nên nhà thơ; nhà thơ phải có trách nhiệm với chữ.", "points": 0.5}, {"type": "essay", "level": "VD", "q": "Viết đoạn văn khoảng 200 chữ trình bày suy nghĩ của em về sức thuyết phục của lời nói trong giao tiếp hằng ngày.", "explain": "DÀN Ý CHI TIẾT: 1) Mở đoạn: nêu luận điểm — lời nói có sức thuyết phục lớn nếu biết cách. 2) Thân đoạn: lí lẽ (lời nói ảnh hưởng đến quan hệ, công việc); dẫn chứng (người khéo ăn nói được tin yêu; lời nói thiếu suy nghĩ gây mất lòng); yếu tố tạo sức thuyết phục (chân thành, có lí lẽ, đúng lúc, tôn trọng người nghe); liên hệ bài học từ văn nghị luận. 3) Kết đoạn: khẳng định; rèn luyện. BÀI MẪU: Trong giao tiếp hằng ngày, lời nói có một sức thuyết phục đặc biệt — nó có thể xây dựng mà cũng có thể phá vỡ các mối quan hệ. Người biết nói lời chân thành, có lí lẽ thường được mọi người tin yêu, công việc thuận lợi: một lời xin lỗi đúng lúc hóa giải mâu thuẫn, một lời động viên chân thành vực dậy tinh thần bạn bè. Ngược lại, lời nói thiếu suy nghĩ, áp đặt, coi thường người nghe sẽ gây mất lòng, thậm chí đổ vỡ — “lời nói chẳng mất tiền mua” mà hậu quả thì đắt giá. Sức thuyết phục của lời nói đến từ ba yếu tố: chân thành (nói từ tấm lòng), có lí lẽ (nói có căn cứ, không suông), và tôn trọng người nghe (lắng nghe, đúng lúc, đúng chỗ). Bài học từ văn nghị luận hoàn toàn đúng với giao tiếp: muốn thuyết phục, phải có “luận điểm” rõ (muốn nói gì), “luận cứ” xác đáng (vì sao), và “lập luận” khéo (nói thế nào). Vì vậy, hãy rèn luyện nghệ thuật nói mỗi ngày: nghĩ trước khi nói, nói điều chân thành, và luôn đặt mình vào vị trí người nghe. Lời nói đẹp sẽ mở ra những cánh cửa mà sức mạnh không mở được.", "points": 0}, {"type": "essay", "level": "VDC", "q": "Viết bài văn nghị luận khoảng 600 chữ bàn về nghệ thuật thuyết phục trong văn nghị luận qua các văn bản đã học trong Bài 3.", "explain": "DÀN Ý CHI TIẾT: 1) Mở bài: nêu vấn đề — nghệ thuật thuyết phục là linh hồn của văn nghị luận; giới thiệu ba văn bản. 2) Thân bài: a) Công thức chung: luận điểm rõ + luận cứ xác đáng + lập luận chặt chẽ. b) Phân tích từng văn bản: Thân Nhân Trung (trang trọng, lí lẽ + dẫn chứng lịch sử); Phong Tử Khải (giản dị, ấm áp, lấy tình thắng lí); Lê Đạt (sắc sảo, nghịch lí độc đáo). c) So sánh: khác phong cách mà cùng hiệu quả — nghệ thuật phải phù hợp nội dung, đối tượng. d) Bài học: khi viết văn nghị luận và khi giao tiếp. 3) Kết bài: khẳng định; liên hệ. BÀI MẪU: Nghệ thuật thuyết phục là linh hồn của văn nghị luận, và ba văn bản trong Bài 3 — “Hiền tài là nguyên khí của quốc gia”, “Yêu và đồng cảm”, “Chữ bầu lên nhà thơ” — là ba mẫu mực với ba phong cách khác nhau mà cùng đạt hiệu quả cao. Điểm chung làm nên sức thuyết phục của cả ba là công thức vàng: luận điểm rõ ràng, luận cứ xác đáng (lí lẽ chặt chẽ, bằng chứng tiêu biểu) và lập luận khoa học. Nhưng mỗi tác giả lại có một “vũ khí” riêng. Thân Nhân Trung thuyết phục bằng sự trang trọng và chặt chẽ: lí lẽ sâu sắc về quan hệ hiền tài – vận nước, dẫn chứng lịch sử xác thực, câu văn biền ngẫu hùng hồn — “lấy lí thắng”, xứng với văn bia và luận đề lớn. Phong Tử Khải thuyết phục bằng sự giản dị và chân thành: lí lẽ gần gũi từ đời sống, bằng chứng là những câu chuyện nhỏ thấm thía, giọng văn ấm áp như lời tâm sự — “lấy tình thắng”, xứng với chủ đề yêu thương. Lê Đạt thuyết phục bằng sự sắc sảo và độc đáo: cách nói nghịch lí “chữ bầu lên nhà thơ” gây ấn tượng mạnh, lập luận giàu liên tưởng — “lấy trí thắng”, xứng với chủ đề nghệ thuật. Ba phong cách chứng minh một chân lí: không có một khuôn mẫu duy nhất cho sự thuyết phục; nghệ thuật phải phù hợp với nội dung và đối tượng — bàn việc nước thì trang trọng, bàn tình người thì ấm áp, bàn nghệ thuật thì sắc sảo. Bài học cho người viết: trước khi viết, hãy xác định rõ luận điểm, chuẩn bị luận cứ xác đáng, chọn thao tác lập luận và giọng điệu phù hợp. Và trong giao tiếp hằng ngày cũng vậy: muốn thuyết phục ai, hãy nói điều đúng, có căn cứ, bằng thái độ phù hợp. Nghệ thuật thuyết phục không phải là mánh khóe mà là sự kết hợp giữa trí tuệ, tình cảm và sự chân thành — đó là điều ba văn bản để lại cho chúng ta.", "points": 0}]}]}
