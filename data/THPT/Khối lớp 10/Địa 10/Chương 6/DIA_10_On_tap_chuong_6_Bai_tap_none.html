{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao các nhà nông học thường xét nghiệm đất trước khi quyết định trồng cây gì?", "options": ["A. Vì mỗi loại cây thích nghi với tính chất đất nhất định (độ phì, độ chua, độ ẩm).", "B. Vì đất nào cũng trồng được mọi loại cây.", "C. Vì xét nghiệm đất để bán đất.", "D. Vì cây trồng không cần đất."], "answer": "A", "explain": "Mỗi cây có yêu cầu sinh thái riêng về đất; xét nghiệm đất giúp bố trí cây trồng phù hợp, cho năng suất cao, bền vững."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho sơ đồ tác động: Phá rừng → (1) → đất bạc màu; Phá rừng → (2) → động vật mất nơi cư trú. Các ô trống (1), (2) phù hợp nhất là", "options": ["A. (1) xói mòn, rửa trôi; (2) mất nguồn thức ăn, nơi ẩn náu.", "B. (1) đất tốt hơn; (2) động vật phát triển.", "C. (1) tăng mùn; (2) tăng đa dạng.", "D. (1) không ảnh hưởng; (2) không ảnh hưởng."], "answer": "A", "explain": "Phá rừng gây xói mòn, rửa trôi (đất bạc màu) đồng thời phá hủy nơi cư trú, nguồn thức ăn của động vật."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đất đỏ ba dan ở Tây Nguyên thích hợp trồng cà phê.", "b) Đất phù sa ở đồng bằng thích hợp trồng lúa nước.", "c) Đất nào cũng trồng được mọi loại cây với năng suất như nhau.", "d) Cần bố trí cây trồng phù hợp với từng loại đất."], "answer": ["T", "T", "F", "T"], "explain": "a), b) Đúng: ví dụ ở Việt Nam. c) Sai: mỗi cây có yêu cầu đất riêng. d) Đúng: nguyên tắc sử dụng đất hợp lí."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về sử dụng tổng hợp:", "statements": ["a) Mô hình nông – lâm kết hợp trên đất đồi vừa giữ đất vừa tăng thu nhập.", "b) Trồng cây che phủ giúp đất đồi bớt xói mòn.", "c) Chăn thả gia súc quá mức trên đồng cỏ làm đất bị thoái hóa.", "d) Khai thác tài nguyên không cần quan tâm đến đất và sinh vật."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng: các mô hình bền vững. c) Đúng: chăn thả quá mức gây xói mòn, sa mạc hóa. d) Sai: phải bảo vệ đất và sinh quyển khi khai thác."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Tàn dư sinh vật bị vi sinh vật làm cho mục nát, trả lại chất dinh dưỡng cho đất. Hiện tượng này được gọi là gì?", "answer": "phân hủy", "explain": "Phân hủy xác sinh vật tạo mùn, trả lại chất dinh dưỡng cho đất."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Vùng ôn đới có cặp tương ứng “đất đen – đồng cỏ”. Vùng nhiệt đới ẩm có cặp tương ứng “đất đỏ vàng – …” (điền kiểu rừng, 4 từ)", "answer": "rừng mưa nhiệt đới", "explain": "Vùng nhiệt đới ẩm: đất đỏ vàng (feralit) tương ứng với rừng mưa nhiệt đới."}
]},
{"name": "Đề 4", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Sinh quyển được giới hạn trong khoảng", "options": ["A. từ tầng ô-dôn xuống đáy đại dương sâu nhất.", "B. từ mặt đất lên đỉnh khí quyển.", "C. từ tâm Trái Đất lên mặt đất.", "D. chỉ trong lòng đại dương."], "answer": "A", "explain": "Giới hạn trên: tầng ô-dôn (~22–25 km); giới hạn dưới: đáy rãnh đại dương sâu nhất (~11 km)."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đất được giới hạn chủ yếu ở", "options": ["A. đáy đại dương.", "B. bề mặt lục địa.", "C. tầng cao khí quyển.", "D. trong lòng núi lửa."], "answer": "B", "explain": "Đất là lớp vật chất tơi xốp ở bề mặt lục địa."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Điểm khác nhau cơ bản giữa đất và sinh quyển là", "options": ["A. đất là vật chất vô cơ lẫn hữu cơ ở bề mặt lục địa; sinh quyển là toàn bộ sinh vật và môi trường sống của chúng.", "B. đất rộng hơn sinh quyển.", "C. sinh quyển không bao gồm đất.", "D. đất và sinh quyển hoàn toàn giống nhau."], "answer": "A", "explain": "Đất là một thành phần vật chất; sinh quyển là quyển sinh vật bao trùm cả đất, nước, không khí nơi có sự sống."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một vùng ven biển có rừng ngập mặn phát triển tốt trên đất bùn lầy. Điều này chứng tỏ", "options": ["A. sinh vật có thể thích nghi với điều kiện đất, nước đặc biệt (mặn, ngập).", "B. đất bùn lầy không nuôi được sinh vật.", "C. rừng ngập mặn không cần đất.", "D. nước mặn giết chết mọi sinh vật."], "answer": "A", "explain": "Cây đước, sú, vẹt thích nghi với đất bùn, nước mặn: rễ thở, chịu mặn — minh họa sự thích nghi của sinh vật với điều kiện sống."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong các hoạt động sau, hoạt động nào gây hại đồng thời cho cả đất và sinh vật?", "options": ["A. Trồng rừng phòng hộ", "B. Đốt rừng làm nương rẫy bừa bãi", "C. Bón phân hữu cơ", "D. Xây dựng khu bảo tồn"], "answer": "B", "explain": "Đốt rừng bừa bãi: đất mất lớp phủ bị xói mòn, bạc màu; sinh vật mất nơi cư trú."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Để phục hồi một vùng đất đồi trọc ở nhiệt đới, trình tự các việc làm hợp lí nhất là", "options": ["A. Trồng cây ngay trên đất trọc không cần cải tạo.", "B. Chống xói mòn trước (trồng cây che phủ, làm đường đồng mức), cải tạo đất, rồi trồng rừng và cây lâu năm phù hợp.", "C. Đổ bê tông chống xói mòn.", "D. Bỏ hoang chờ tự phục hồi hoàn toàn."], "answer": "B", "explain": "Phục hồi tổng hợp: giữ đất trước (chống xói mòn), cải tạo độ phì, rồi tái tạo thảm thực vật phù hợp — tác động đồng thời lên đất và sinh quyển."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giới hạn trên của sinh quyển là tầng ô-dôn.", "b) Đất phân bố chủ yếu ở bề mặt lục địa.", "c) Sinh quyển bao trùm cả đất, nước và không khí nơi có sự sống.", "d) Đất và sinh quyển không giao nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đất (lớp đất có sự sống) là một bộ phận của sinh quyển, chúng giao nhau."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cùng một vùng khí hậu, đất và thảm thực vật thường tương ứng với nhau.", "b) Thay đổi khí hậu sẽ kéo theo thay đổi cả đất và sinh vật.", "c) Bảo vệ rừng đồng thời là bảo vệ đất và đa dạng sinh học.", "d) Con người không thể làm gì để cải thiện đất và sinh vật."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: cùng do khí hậu chi phối. b) Đúng: khí hậu là nhân tố chung quyết định. c) Đúng: vai trò tổng hợp của rừng. d) Sai: con người có thể cải tạo, phục hồi."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Môi trường sống của sinh vật gồm đất, nước, không khí và các sinh vật khác được gọi chung là gì? (2 từ)", "answer": "sinh quyển", "explain": "Sinh quyển bao gồm toàn bộ sinh vật và môi trường sống (đất, nước, không khí) của chúng."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Hiện tượng đất mất lớp phủ thực vật, bị nước mưa cuốn trôi lớp đất mặt gọi là hiện tượng gì? (3 từ)", "answer": "xói mòn đất", "explain": "Xói mòn đất làm mất lớp đất mặt màu mỡ, gây thoái hóa đất."}
]}
,
{"name": "Đề 5", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đặc trưng quan trọng nhất của đất, thể hiện khả năng nuôi dưỡng cây trồng là", "options": ["A. màu sắc của đất.", "B. độ phì.", "C. độ dày của đất.", "D. độ cứng của đất."], "answer": "B", "explain": "Độ phì là khả năng cung cấp nước, dinh dưỡng cho cây trồng — đặc trưng quan trọng nhất của đất."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Sinh vật trong đất (giun đất, vi sinh vật) có vai trò gì?", "options": ["A. Làm đất thêm chặt cứng.", "B. Làm tơi xốp đất, phân hủy chất hữu cơ tạo mùn.", "C. Hút hết dinh dưỡng của đất.", "D. Không có vai trò gì."], "answer": "B", "explain": "Giun đất đào xới làm tơi xốp; vi sinh vật phân hủy xác hữu cơ tạo mùn, cải tạo đất."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một vùng có lượng mưa 2000 mm/năm, nhiệt độ trung bình 27 độ C. Dự đoán loại đất và thảm thực vật điển hình ở đó là", "options": ["A. đất pốt dôn và rừng lá kim.", "B. đất đỏ vàng và rừng mưa nhiệt đới.", "C. đất xám hoang mạc và cây bụi chịu hạn.", "D. đất đen và đồng cỏ."], "answer": "B", "explain": "Nóng ẩm (27 độ C, mưa 2000 mm) là khí hậu nhiệt đới ẩm → đất đỏ vàng (feralit) và rừng mưa nhiệt đới."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Người ta thấy ở vùng núi cao, đất càng lên cao càng mỏng và cây càng thấp, thưa. Nguyên nhân chung là", "options": ["A. nhiệt độ giảm theo độ cao: vừa hạn chế phong hóa tạo đất, vừa hạn chế sinh trưởng của cây.", "B. trên cao không có đá mẹ.", "C. con người chặt hết cây trên núi cao.", "D. trên cao không có mưa."], "answer": "A", "explain": "Nhiệt độ giảm theo độ cao tác động đồng thời: phong hóa chậm (đất mỏng) và cây khó sinh trưởng (thấp, thưa) — quy luật đai cao."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao không nên chăn thả gia súc quá mức trên đồng cỏ?", "options": ["A. Vì gia súc ăn hết cỏ làm đất trơ, dễ bị xói mòn, thoái hóa; đồng cỏ mất khả năng tái sinh.", "B. Vì gia súc làm đất tốt hơn.", "C. Vì đồng cỏ không cần bảo vệ.", "D. Vì gia súc không ảnh hưởng đến đất."], "answer": "A", "explain": "Chăn thả quá mức: cỏ bị ăn trụi → đất trơ → xói mòn, thoái hóa; minh họa tác động của sinh vật (qua con người) đến đất."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một học sinh lập luận: “Muốn bảo vệ đa dạng sinh học thì chỉ cần cấm săn bắt là đủ”. Em có đồng ý không?", "options": ["A. Đồng ý, vì săn bắt là nguyên nhân duy nhất.", "B. Không đồng ý, vì còn phải bảo vệ nơi cư trú (rừng, đất, nguồn nước) — mất nơi sống thì loài cũng tuyệt chủng.", "C. Đồng ý, vì nơi cư trú không quan trọng.", "D. Không có ý kiến."], "answer": "B", "explain": "Bảo vệ loài phải gắn với bảo vệ sinh cảnh: rừng, đất, nước. Mất rừng, ô nhiễm đất nước cũng làm loài tuyệt chủng dù không săn bắt."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giun đất giúp làm tơi xốp đất.", "b) Vi sinh vật phân hủy xác sinh vật tạo mùn cho đất.", "c) Rễ cây giúp giữ đất, chống xói mòn.", "d) Sinh vật trong đất chỉ gây hại cho đất."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: vai trò tích cực của sinh vật với đất. d) Sai: sinh vật chủ yếu cải tạo đất."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về quy luật phân bố:", "statements": ["a) Từ xích đạo về cực, đất và thảm thực vật thay đổi theo quy luật.", "b) Vùng xích đạo: đất đỏ vàng và rừng mưa nhiệt đới.", "c) Vùng cực: đất pốt dôn và rừng lá kim.", "d) Hoang mạc nhiệt đới: đất xám hoang mạc và cây chịu hạn."], "answer": ["T", "T", "F", "T"], "explain": "a), b) Đúng. c) Sai: vùng cực có đồng rêu, địa y (đất pốt dôn và rừng lá kim ở đới ôn đới lạnh). d) Đúng."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Động vật nhỏ đào xới trong đất, giúp đất tơi xốp (ví dụ: giun, dế) được gọi chung là động vật gì? (2 từ)", "answer": "động vật đất", "explain": "Động vật đất (giun, dế, mối...) đào xới làm tơi xốp đất, góp phần cải tạo đất."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Vùng có nhiệt độ trung bình 27 độ C, mưa 2000 mm/năm thuộc đới khí hậu nào? (2 từ)", "answer": "nhiệt đới", "explain": "Nóng ẩm quanh năm (27 độ C, mưa lớn) là khí hậu nhiệt đới (cụ thể là nhiệt đới ẩm)."}
]},
{"name": "Đề 6", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Trong tự nhiên, đất và sinh vật có mối quan hệ", "options": ["A. gắn bó mật thiết, tác động qua lại lẫn nhau.", "B. hoàn toàn độc lập.", "C. một chiều từ đất đến sinh vật.", "D. một chiều từ sinh vật đến đất."], "answer": "A", "explain": "Đất và sinh vật tác động qua lại: đất nuôi sinh vật, sinh vật cải tạo và bảo vệ đất."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Loại đất nào sau đây thường đi đôi với rừng lá kim ở đới ôn đới lạnh?", "options": ["A. Đất phù sa", "B. Đất pốt dôn", "C. Đất đen", "D. Đất xám hoang mạc"], "answer": "B", "explain": "Đới ôn đới lạnh: đất pốt dôn nghèo dinh dưỡng đi đôi với rừng lá kim."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một vùng đất bị ô nhiễm thuốc trừ sâu nặng. Hậu quả đối với sinh quyển là", "options": ["A. không ảnh hưởng gì.", "B. vi sinh vật đất chết, chuỗi thức ăn bị phá vỡ, chất độc tích lũy qua cây trồng vào cơ thể người.", "C. đất tốt hơn.", "D. sinh vật phát triển mạnh."], "answer": "B", "explain": "Ô nhiễm đất giết vi sinh vật, phá vỡ hệ sinh thái đất; chất độc tích lũy qua chuỗi thức ăn đến con người."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Vì sao các nhà sinh thái khuyến cáo “không nên trồng rừng thuần loài trên diện tích lớn”?", "options": ["A. Vì rừng thuần loài tốn nhiều công chăm sóc.", "B. Vì rừng thuần loài làm giảm đa dạng sinh học, đất dễ bị suy kiệt một loại dinh dưỡng, sâu bệnh dễ bùng phát.", "C. Vì rừng thuần loài không cho gỗ.", "D. Vì rừng thuần loài đẹp hơn."], "answer": "B", "explain": "Rừng thuần loài: cấu trúc đơn điệu → ít loài cư trú; một loài cây hút kiệt một nhóm dinh dưỡng; sâu bệnh lan nhanh — hại cả đất và sinh quyển."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Hoạt động nào sau đây thể hiện con người tác động tích cực đến cả đất và sinh vật?", "options": ["A. Khai thác khoáng sản bừa bãi", "B. Trồng rừng ngập mặn ven biển", "C. Xả rác thải nhựa ra đồng ruộng", "D. Đốt đồng sau thu hoạch"], "answer": "B", "explain": "Trồng rừng ngập mặn: giữ đất ven biển chống xói lở, tạo nơi cư trú cho thủy sinh — lợi cả đất và sinh quyển."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ba vùng X, Y, Z có cùng điều kiện khí hậu nhưng: X trồng rừng hỗn loài, Y trồng rừng thuần loài, Z để đất trống. Sau 20 năm, độ phì của đất và đa dạng sinh học sẽ", "options": ["A. như nhau ở cả ba vùng.", "B. tốt nhất ở X, kém nhất ở Z.", "C. tốt nhất ở Z vì không bị khai thác.", "D. tốt nhất ở Y vì cây lớn nhanh."], "answer": "B", "explain": "Rừng hỗn loài (X) cho tàn dư đa dạng, cấu trúc phức tạp → đất giàu mùn, đa dạng cao nhất; đất trống (Z) bị xói mòn, suy thoái nhất."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trồng rừng ngập mặn giúp chống xói lở đất ven biển.", "b) Rừng ngập mặn là nơi cư trú của nhiều loài thủy sinh.", "c) Chặt phá rừng ngập mặn không ảnh hưởng gì.", "d) Bảo vệ rừng ngập mặn là bảo vệ cả đất và sinh vật biển."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng: vai trò tổng hợp của rừng ngập mặn. c) Sai: gây xói lở, mất nơi cư trú."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về phát triển bền vững:", "statements": ["a) Khai thác tài nguyên cần gắn với bảo vệ đất và sinh quyển.", "b) Có thể đánh đổi môi trường lấy tăng trưởng kinh tế bằng mọi giá.", "c) Trồng rừng, cải tạo đất là đầu tư cho tương lai.", "d) Mỗi người đều có thể góp phần bảo vệ đất và sinh vật."], "answer": ["T", "F", "T", "T"], "explain": "a), c), d) Đúng: nguyên tắc phát triển bền vững. b) Sai: đánh đổi môi trường gây hậu quả lâu dài."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Rừng trồng ven biển có tác dụng chắn sóng, giữ đất, nơi cư trú của thủy sinh có tên là rừng gì? (3 từ)", "answer": "rừng ngập mặn", "explain": "Rừng ngập mặn (đước, sú, vẹt) bảo vệ đất ven biển và là hệ sinh thái quan trọng."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Mô hình trồng cây lâu năm xen với cây nông nghiệp ngắn ngày trên đất đồi, vừa giữ đất vừa tăng thu nhập được gọi là mô hình gì? (2 từ)", "answer": "nông lâm", "explain": "Mô hình nông – lâm kết hợp là hướng sử dụng đất đồi núi bền vững."}
]}
,
{"name": "Đề 7", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Nhân tố nào sau đây KHÔNG tham gia vào quá trình hình thành đất?", "options": ["A. Đá mẹ", "B. Sinh vật", "C. Dòng biển", "D. Khí hậu"], "answer": "C", "explain": "6 nhân tố hình thành đất: đá mẹ, khí hậu, sinh vật, địa hình, thời gian, con người. Dòng biển không phải nhân tố hình thành đất."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Nhân tố nào sau đây KHÔNG ảnh hưởng đến sự phân bố của sinh vật?", "options": ["A. Địa hình", "B. Nguồn nước", "C. Lực Cô-ri-ô-lit", "D. Đất"], "answer": "C", "explain": "6 nhân tố ảnh hưởng đến sinh vật: khí hậu, đất, địa hình, nguồn nước, sinh vật, con người."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một vùng đất có tầng đất mặt dày, giàu mùn. Có thể suy ra vùng đó", "options": ["A. chắc chắn là hoang mạc.", "B. có thảm thực vật phát triển tốt, ít bị xói mòn.", "C. không có sinh vật.", "D. bị ô nhiễm nặng."], "answer": "B", "explain": "Đất giàu mùn chứng tỏ có nguồn tàn dư hữu cơ dồi dào (thảm thực vật tốt) và ít bị xói mòn, rửa trôi."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Ở đồng bằng sông Hồng, người dân đắp đê ngăn lũ, trồng lúa 2–3 vụ/năm. Việc đắp đê đã làm thay đổi mối quan hệ đất – sinh vật – con người như thế nào?", "options": ["A. Không thay đổi gì.", "B. Ngăn phù sa bồi đắp tự nhiên nên phải bón phân nhiều hơn; nhưng chủ động được nước tưới, tăng vụ.", "C. Làm đất tốt hơn mà không cần bón phân.", "D. Làm mất hoàn toàn vai trò của đất."], "answer": "B", "explain": "Đê ngăn lũ cũng ngăn phù sa → đất không được bồi đắp tự nhiên, phải bón phân; đổi lại chủ động thủy lợi, thâm canh tăng vụ — ví dụ về tác động của con người lên đất."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Cây cà phê ở Tây Nguyên cho năng suất cao trên đất đỏ ba dan vì", "options": ["A. đất đỏ ba dan tơi xốp, giàu dinh dưỡng, khí hậu cao nguyên phù hợp với cây cà phê.", "B. đất đỏ ba dan nghèo dinh dưỡng.", "C. Tây Nguyên lạnh quanh năm.", "D. cà phê không cần đất."], "answer": "A", "explain": "Đất đỏ ba dan màu mỡ + khí hậu cao nguyên mát mẻ, phân hóa mùa mưa khô rõ — điều kiện lí tưởng cho cà phê."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một vùng có 3 kiểu đất: feralit đồi núi, phù sa đồng bằng, đất mặn ven biển. Bố trí sử dụng hợp lí nhất là", "options": ["A. trồng lúa ở cả ba vùng.", "B. đồi núi trồng cây công nghiệp lâu năm và rừng; đồng bằng trồng lúa; ven biển nuôi trồng thủy sản và trồng rừng ngập mặn.", "C. bỏ hoang cả ba vùng.", "D. xây dựng hết thành khu công nghiệp."], "answer": "B", "explain": "Sử dụng đất hợp lí: mỗi loại đất bố trí cây trồng, vật nuôi phù hợp với đặc tính đất và điều kiện sinh thái — vừa hiệu quả vừa bền vững."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mỗi loại đất thích hợp với một số loại cây trồng nhất định.", "b) Đất feralit đồi núi thích hợp trồng cây công nghiệp lâu năm.", "c) Đất mặn ven biển thích hợp nuôi trồng thủy sản.", "d) Có thể trồng bất kì cây gì trên bất kì loại đất nào."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: nguyên tắc bố trí cây trồng theo đất. d) Sai: phải phù hợp với tính chất đất."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về tác động của con người ở đồng bằng:", "statements": ["a) Đắp đê ngăn được lũ nhưng cũng ngăn phù sa bồi đắp.", "b) Thâm canh tăng vụ cần bón phân nhiều hơn.", "c) Con người hoàn toàn làm chủ được đất, không cần quan tâm đến quy luật tự nhiên.", "d) Sử dụng đất cần kết hợp lợi ích kinh tế và bảo vệ môi trường."], "answer": ["T", "T", "F", "T"], "explain": "a), b) Đúng: thực tế đồng bằng sông Hồng. c) Sai: vẫn phải tôn trọng quy luật tự nhiên. d) Đúng: phát triển bền vững."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Lớp phù sa do sông bồi đắp hằng năm ở đồng bằng châu thổ làm cho đất trở nên như thế nào? (2 từ)", "answer": "màu mỡ", "explain": "Phù sa bồi đắp hằng năm bổ sung dinh dưỡng, làm đất màu mỡ."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Vùng Tây Nguyên nổi tiếng với loại đất đỏ nào rất thích hợp trồng cà phê? (3 từ)", "answer": "đất đỏ ba dan", "explain": "Đất đỏ ba dan ở Tây Nguyên tơi xốp, giàu dinh dưỡng, thích hợp trồng cà phê, cao su."}
]},
{"name": "Đề 8", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Sinh quyển bao gồm", "options": ["A. toàn bộ sinh vật và môi trường sống của chúng.", "B. chỉ động vật.", "C. chỉ thực vật.", "D. chỉ vi sinh vật."], "answer": "A", "explain": "Sinh quyển gồm toàn bộ sinh vật (thực vật, động vật, vi sinh vật) và môi trường sống của chúng."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đất bao gồm các thành phần", "options": ["A. chất khoáng, chất hữu cơ, nước, không khí.", "B. chỉ chất khoáng.", "C. chỉ nước và không khí.", "D. đá, sỏi, cát."], "answer": "A", "explain": "4 thành phần của đất: chất khoáng (~45%), chất hữu cơ (~5%), nước và không khí (~20–30% mỗi loại)."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một học sinh quan sát thấy: nơi đất tốt thì cây xanh tốt, nơi cây xanh tốt thì đất giàu mùn. Kết luận đúng là", "options": ["A. đất và cây không liên quan nhau, đó chỉ là trùng hợp.", "B. đất và thực vật tác động qua lại lẫn nhau.", "C. chỉ đất quyết định cây.", "D. chỉ cây quyết định đất."], "answer": "B", "explain": "Quan sát thực tế minh họa quan hệ hai chiều: đất nuôi cây, cây cải tạo đất."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Vì sao sau mỗi trận mưa lớn ở vùng đồi trọc, nước sông thường đục ngầu phù sa?", "options": ["A. Vì mưa làm nước sông trong hơn.", "B. Vì đất đồi trọc không có lớp phủ thực vật giữ đất nên bị xói mòn, cuốn trôi xuống sông.", "C. Vì sông tự tạo ra phù sa.", "D. Vì cá khuấy đục nước."], "answer": "B", "explain": "Mất lớp phủ thực vật → mưa xói mòn đất đồi → phù sa cuốn xuống sông làm nước đục; đồng thời gây bồi lấp lòng sông."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Để hạn chế xói mòn đất ở vùng đồi núi, biện pháp hiệu quả nhất là", "options": ["A. đốt rừng lấy đất trồng trọt.", "B. trồng rừng, trồng cây theo đường đồng mức, phủ xanh đất trống.", "C. cày xới đất dốc theo chiều dốc.", "D. để đất trống tự nhiên."], "answer": "B", "explain": "Lớp phủ thực vật và canh tác theo đường đồng mức giữ đất, giữ nước, chống xói mòn hiệu quả nhất."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một vùng núi có độ cao 3000 m ở nhiệt đới. Dự đoán sự thay đổi của đất và sinh vật từ chân núi lên đỉnh núi là", "options": ["A. không thay đổi gì.", "B. đất mỏng dần, cây thấp dần: rừng nhiệt đới – rừng ôn đới – đồng cỏ – băng tuyết.", "C. đất dày dần, cây cao dần.", "D. chỉ đất thay đổi, sinh vật không đổi."], "answer": "B", "explain": "Quy luật đai cao: nhiệt độ giảm theo độ cao → vành đai đất và sinh vật thay đổi tương ứng từ chân lên đỉnh núi."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mưa lớn trên đất trống đồi trọc gây xói mòn mạnh.", "b) Trồng cây theo đường đồng mức giúp giữ đất.", "c) Phủ xanh đất trống giúp tăng mùn cho đất.", "d) Xói mòn đất không gây hại gì."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: các kiến thức về chống xói mòn. d) Sai: xói mòn làm mất lớp đất mặt màu mỡ, gây thoái hóa."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về quy luật đai cao:", "statements": ["a) Càng lên cao, nhiệt độ càng giảm.", "b) Vành đai sinh vật thay đổi theo độ cao.", "c) Đất trên núi cao thường mỏng hơn ở chân núi.", "d) Đỉnh núi cao nhiệt đới có băng tuyết vĩnh cửu và rừng rậm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: quy luật đai cao. d) Sai: đỉnh núi băng tuyết không có rừng rậm."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Hiện tượng nước mưa cuốn trôi lớp đất mặt ở vùng đồi trọc được gọi là hiện tượng gì? (3 từ)", "answer": "xói mòn đất", "explain": "Xói mòn đất gây mất lớp đất mặt màu mỡ, làm đất bạc màu, thoái hóa."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Sự thay đổi của đất và sinh vật theo độ cao ở vùng núi được gọi là quy luật gì? (2 từ)", "answer": "đai cao", "explain": "Quy luật đai cao: các thành phần tự nhiên thay đổi theo độ cao của địa hình."}
]}
,
{"name": "Đề 9", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Trong các nhân tố sau, nhân tố nào là nguồn gốc vật chất vô cơ của đất?", "options": ["A. Khí hậu", "B. Đá mẹ", "C. Con người", "D. Nguồn nước"], "answer": "B", "explain": "Đá mẹ bị phong hóa tạo vật chất vô cơ (cát, limon, sét) cho đất."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Trong các nhân tố sau, nhân tố nào là nguồn cung cấp chất hữu cơ cho đất?", "options": ["A. Đá mẹ", "B. Địa hình", "C. Sinh vật", "D. Thời gian"], "answer": "C", "explain": "Sinh vật cung cấp xác hữu cơ; phân hủy tạo mùn cho đất."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một vùng có khí hậu khô hạn quanh năm. Có thể dự đoán về đất và sinh vật ở đó là", "options": ["A. đất giàu mùn, rừng rậm rạp.", "B. đất nghèo mùn (đất xám hoang mạc), thực vật chịu hạn thưa thớt.", "C. đất đen, đồng cỏ tươi tốt.", "D. đất phù sa, lúa nước bạt ngàn."], "answer": "B", "explain": "Khô hạn → ít tàn dư hữu cơ (đất nghèo mùn) và thực vật khó phát triển (cây chịu hạn thưa thớt)."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một trang trại trồng cây ăn quả trên đất dốc áp dụng: trồng cỏ che phủ, bón phân hữu cơ, làm mương thoát nước theo đường đồng mức. Cách làm này", "options": ["A. gây hại cho đất.", "B. vừa chống xói mòn, vừa tăng độ phì — tác động tích cực của con người lên đất.", "C. không có tác dụng gì.", "D. làm đất bạc màu nhanh."], "answer": "B", "explain": "Cỏ che phủ chống xói mòn, phân hữu cơ tăng mùn, mương đồng mức giữ nước — tổng hợp các biện pháp bảo vệ, cải tạo đất."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Đa dạng sinh học của một vùng phụ thuộc vào các yếu tố nào?", "options": ["A. Chỉ phụ thuộc vào diện tích.", "B. Khí hậu thuận lợi, diện tích rộng, ít bị tác động, đất đai màu mỡ.", "C. Chỉ phụ thuộc vào con người.", "D. Không phụ thuộc yếu tố nào."], "answer": "B", "explain": "Đa dạng sinh học cao nơi khí hậu thuận lợi, sinh cảnh đa dạng, ít bị phá hoại — ví dụ rừng mưa nhiệt đới."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho các phát biểu: (1) Đất tốt thì cây tốt. (2) Cây tốt thì đất giàu mùn. (3) Mất rừng thì đất xấu đi. Kết luận khái quát đúng nhất là", "options": ["A. Chỉ (1) đúng.", "B. Cả ba đều đúng và thể hiện quan hệ hai chiều, nhân quả giữa đất, sinh vật và con người.", "C. Chỉ (3) đúng.", "D. Cả ba đều sai."], "answer": "B", "explain": "Ba phát biểu đều đúng, cùng thể hiện mối quan hệ nhân quả, hai chiều trong hệ thống đất – sinh vật – con người."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đá mẹ cung cấp vật chất vô cơ cho đất.", "b) Sinh vật cung cấp chất hữu cơ cho đất.", "c) Khí hậu ảnh hưởng đến cả đất và sinh vật.", "d) Con người không liên quan đến đất và sinh vật."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: vai trò các nhân tố. d) Sai: con người tác động mạnh đến cả hai."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về bảo vệ tổng hợp:", "statements": ["a) Bảo vệ rừng là bảo vệ đất, nước và sinh vật.", "b) Sử dụng phân hữu cơ tốt hơn lạm dụng phân hóa học.", "c) Có thể khai thác đất đến kiệt quệ vì đất tái tạo nhanh.", "d) Quy hoạch sử dụng đất cần phù hợp với điều kiện tự nhiên."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: đất hình thành rất chậm, khai thác kiệt quệ gây thoái hóa khó phục hồi."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Vật chất vô cơ của đất (cát, limon, sét) có nguồn gốc từ nhân tố nào?", "answer": "đá mẹ", "explain": "Đá mẹ phong hóa tạo vật chất vô cơ cho đất."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Cả 6 nhân tố hình thành đất và 6 nhân tố ảnh hưởng đến sinh vật đều có chung nhân tố “khí hậu”. Ngoài khí hậu, kể một nhân tố chung nữa.", "answer": "con người", "explain": "Các nhân tố chung: khí hậu, sinh vật, địa hình, con người (chấp nhận một trong các đáp án này)."}
]},
{"name": "Đề 10", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Chương 6 nghiên cứu về", "options": ["A. đất và sinh vật trên Trái Đất.", "B. chuyển động của Trái Đất.", "C. cấu tạo của khí quyển.", "D. dân số thế giới."], "answer": "A", "explain": "Chương 6: Sinh quyển gồm Bài 14 (Đất trên Trái Đất) và Bài 15 (Sinh quyển)."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Sinh vật và đất có quan hệ với nhau như thế nào?", "options": ["A. Không liên quan", "B. Tác động qua lại, gắn bó mật thiết", "C. Đất quyết định tất cả", "D. Sinh vật quyết định tất cả"], "answer": "B", "explain": "Đất nuôi sinh vật; sinh vật cải tạo, bảo vệ đất — quan hệ hai chiều."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một vùng đất ven sông được bồi đắp phù sa hằng năm, cây cối xanh tốt. Điều này cho thấy", "options": ["A. sông chỉ gây hại cho đất.", "B. phù sa bồi đắp làm đất màu mỡ, nuôi dưỡng thảm thực vật.", "C. đất ven sông không trồng được cây.", "D. sông không liên quan đến đất."], "answer": "B", "explain": "Phù sa bồi đắp bổ sung dinh dưỡng → đất màu mỡ → thực vật xanh tốt; minh họa vai trò của nước (sông) với đất và sinh vật."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một địa phương có diện tích đất đồi lớn đang bị hoang hóa. Giải pháp tổng thể, bền vững nhất là", "options": ["A. để hoang hóa tự nhiên.", "B. phủ xanh bằng trồng rừng và cây lâu năm phù hợp, kết hợp nông – lâm, chống xói mòn.", "C. san ủi làm mặt bằng xây dựng hết.", "D. đốt sạch để trồng một vụ màu."], "answer": "B", "explain": "Giải pháp tổng hợp: tái tạo thảm thực vật (cải tạo đất, nơi cư trú), chống xói mòn, phát triển kinh tế bền vững trên đất đồi."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Thông điệp chính của chương 6 đối với học sinh là", "options": ["A. chỉ cần học thuộc các loại đất.", "B. hiểu mối quan hệ đất – sinh vật – con người để sử dụng, bảo vệ tài nguyên đất và đa dạng sinh học.", "C. đất không quan trọng.", "D. sinh vật không cần bảo vệ."], "answer": "B", "explain": "Chương 6 giúp hiểu hệ thống đất – sinh vật – con người, từ đó có ý thức bảo vệ, sử dụng hợp lí."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Sắp xếp đúng trình tự hình thành đất từ đá gốc là", "options": ["A. Đá gốc → phong hóa tạo đá mẹ → tích lũy mùn, phân hóa tầng → đất hoàn chỉnh.", "B. Đất hoàn chỉnh → đá mẹ → đá gốc.", "C. Đá gốc → đất hoàn chỉnh ngay lập tức.", "D. Mùn → đá mẹ → đá gốc."], "answer": "A", "explain": "Quá trình: đá gốc phong hóa → vật chất vô cơ (đá mẹ) → sinh vật đến cư trú, tàn dư phân hủy tạo mùn → phân hóa các tầng → đất hoàn chỉnh (rất chậm)."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau (tổng kết chương):", "statements": ["a) Đất hình thành rất chậm nhưng bị phá hủy rất nhanh.", "b) Sinh vật đa dạng nhất ở vùng khí hậu nóng ẩm.", "c) Con người có thể cải tạo đất và bảo vệ sinh vật.", "d) Không cần bảo vệ đất vì đất có ở khắp nơi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: kiến thức trọng tâm chương. d) Sai: đất tốt ngày càng ít, cần bảo vệ."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phù sa sông làm đất ven sông màu mỡ.", "b) Rừng đầu nguồn giúp điều hòa nước cho vùng hạ lưu.", "c) Đất đồi trọc cần được phủ xanh để chống xói mòn.", "d) Mọi vấn đề về đất và sinh vật đều không thể giải quyết."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: bằng khoa học và ý thức, con người có thể cải tạo, phục hồi."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Lớp vật chất tơi xốp ở bề mặt lục địa, là nơi cây trồng bám rễ và hút dinh dưỡng được gọi là gì?", "answer": "đất", "explain": "Đất là lớp vật chất tơi xốp ở bề mặt lục địa, đặc trưng bởi độ phì."},
