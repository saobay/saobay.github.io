{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về các kiểu thảm thực vật:", "statements": ["a) Rừng mưa nhiệt đới phân bố ở vùng xích đạo nóng ẩm.", "b) Rừng lá kim phân bố ở đới ôn đới lạnh.", "c) Đồng rêu, địa y phân bố ở vùng cực.", "d) Xa-van là đồng cỏ cao ở vùng nhiệt đới."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng theo sự phân bố thảm thực vật từ xích đạo về hai cực."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ánh sáng ảnh hưởng đến quá trình quang hợp của thực vật.", "b) Nhiệt độ ảnh hưởng đến sự phân bố của sinh vật.", "c) Lượng mưa càng lớn thì sinh vật càng phát triển tốt trong mọi trường hợp.", "d) Đất đai ảnh hưởng đến sự phát triển của thực vật."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: ánh sáng cần cho quang hợp. b) Đúng: mỗi loài có giới hạn nhiệt. c) Sai: mưa quá lớn gây ngập úng, rửa trôi cũng hại sinh vật. d) Đúng: độ phì, độ ẩm của đất ảnh hưởng đến thực vật."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Bộ phận nào của Trái Đất gồm toàn bộ sông, hồ, biển, đại dương và là một phần của sinh quyển?", "answer": "thủy quyển", "explain": "Toàn bộ thủy quyển đều thuộc sinh quyển, là môi trường sống của sinh vật thủy sinh."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Kiểu thảm thực vật xum xuê nhiều tầng ở vùng xích đạo nóng ẩm có tên là rừng gì? (3 từ)", "answer": "rừng mưa nhiệt đới", "explain": "Rừng mưa nhiệt đới phân bố ở xích đạo nóng ẩm quanh năm, nhiều tầng tán, đa dạng sinh học cao."}
]},
{"name": "Đề 4", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Sinh vật nào sau đây sống trong môi trường nước thuộc sinh quyển?", "options": ["A. Cá voi, san hô, rong biển.", "B. Xương rồng, lạc đà.", "C. Thông, vân sam.", "D. Rêu, địa y trên núi cao."], "answer": "A", "explain": "Cá voi, san hô, rong biển sống ở biển, đại dương — thuộc thủy quyển trong sinh quyển."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Giới hạn trên của sinh quyển khoảng bao nhiêu ki-lô-mét?", "options": ["A. Khoảng 8–10 km.", "B. Khoảng 22–25 km.", "C. Khoảng 50 km.", "D. Khoảng 100 km."], "answer": "B", "explain": "Giới hạn trên của sinh quyển tiếp giáp tầng ô-dôn, khoảng 22–25 km trên mực nước biển."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao rừng ngập mặn phân bố ở vùng ven biển nhiệt đới?", "options": ["A. Vì cây rừng ngập mặn ưa đất liền khô ráo.", "B. Vì cây đước, sú, vẹt thích nghi với nước mặn, đất bùn ven biển.", "C. Vì ven biển không có sóng.", "D. Vì con người chỉ trồng rừng ở ven biển."], "answer": "B", "explain": "Cây rừng ngập mặn (đước, sú, vẹt) thích nghi với đất bùn lầy, nước mặn ven biển nhiệt đới; đó là sự thích nghi với điều kiện sống đặc thù."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Khi nghiên cứu một khu rừng, người ta thấy số lượng thỏ giảm mạnh sau khi số lượng cáo tăng cao. Hiện tượng này phản ánh", "options": ["A. mối quan hệ giữa các loài sinh vật trong chuỗi thức ăn.", "B. tác động của khí hậu.", "C. tác động của đá mẹ.", "D. sự thay đổi của địa hình."], "answer": "A", "explain": "Cáo ăn thịt thỏ: khi cáo tăng, thỏ bị săn nhiều nên giảm — đó là quan hệ dinh dưỡng giữa các loài trong hệ sinh thái."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Biện pháp nào sau đây góp phần bảo vệ đa dạng sinh học?", "options": ["A. Săn bắt động vật hoang dã để bán.", "B. Xây dựng các khu bảo tồn thiên nhiên, vườn quốc gia.", "C. Phá rừng làm nương rẫy.", "D. Xả rác thải trực tiếp ra sông, biển."], "answer": "B", "explain": "Khu bảo tồn, vườn quốc gia bảo vệ nơi cư trú tự nhiên của các loài, góp phần bảo vệ đa dạng sinh học."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một loài cây chỉ ra hoa khi nhiệt độ xuống dưới 15 độ C trong nhiều ngày. Loài cây này KHÓ có thể trồng thành công ở vùng nào sau đây?", "options": ["A. Vùng ôn đới có mùa đông lạnh.", "B. Vùng núi cao nhiệt đới.", "C. Vùng xích đạo nóng quanh năm.", "D. Vùng cận nhiệt đới."], "answer": "C", "explain": "Vùng xích đạo nóng quanh năm, nhiệt độ không bao giờ xuống dưới 15 độ C nên cây không ra hoa được — minh họa giới hạn nhiệt của sinh vật."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thực vật là nguồn thức ăn của nhiều loài động vật.", "b) Động vật không có vai trò gì đối với thực vật.", "c) Vi sinh vật giúp phân hủy xác sinh vật, trả lại chất dinh dưỡng cho đất.", "d) Các loài sinh vật trong tự nhiên tồn tại hoàn toàn độc lập với nhau."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: động vật thụ phấn, phát tán hạt cho thực vật. c) Đúng: vi sinh vật phân hủy tạo mùn. d) Sai: các loài quan hệ chặt chẽ trong hệ sinh thái."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về giới hạn sinh quyển:", "statements": ["a) Càng lên cao trong khí quyển, điều kiện sống càng khắc nghiệt.", "b) Ở đáy đại dương sâu vẫn có sinh vật sinh sống.", "c) Trong lòng đất (lớp đất, vỏ phong hóa) có vi sinh vật và động vật đất.", "d) Trên tầng ô-dôn, sinh vật phát triển rất phong phú."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: không khí loãng, lạnh, tử ngoại mạnh. b) Đúng: sinh vật đáy biển sâu thích nghi với áp suất cao, tối. c) Đúng: giun đất, vi sinh vật sống trong đất. d) Sai: trên tầng ô-dôn không có sự sống."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Nhân tố tự nhiên nào gồm nhiệt độ, lượng mưa, ánh sáng và được xem là quyết định nhất đến phân bố sinh vật?", "answer": "khí hậu", "explain": "Khí hậu là nhân tố quyết định nhất đến sự phát triển và phân bố của sinh vật."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Vùng đồng cỏ cao nhiệt đới ở châu Phi, nơi sinh sống của ngựa vằn, hươu cao cổ có tên gọi là gì?", "answer": "xa-van", "explain": "Xa-van là đồng cỏ cao nhiệt đới (châu Phi, Nam Mỹ), thảm thực vật của vùng nhiệt đới mưa theo mùa."}
]}
,
{"name": "Đề 5", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Có bao nhiêu nhân tố chính ảnh hưởng đến sự phát triển và phân bố của sinh vật được SGK nêu?", "options": ["A. 4 nhân tố", "B. 5 nhân tố", "C. 6 nhân tố", "D. 7 nhân tố"], "answer": "C", "explain": "6 nhân tố: khí hậu, đất, địa hình, nguồn nước, sinh vật, con người."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Rừng lá kim (tai-ga) phân bố chủ yếu ở", "options": ["A. vùng xích đạo.", "B. đới ôn đới lạnh.", "C. hoang mạc nhiệt đới.", "D. vùng cực."], "answer": "B", "explain": "Rừng lá kim (thông, vân sam) chịu lạnh tốt, phân bố ở đới ôn đới lạnh (Nga, Ca-na-đa, Bắc Âu)."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao thảm thực vật ở sườn núi cao lại thay đổi theo độ cao?", "options": ["A. Vì đá mẹ thay đổi theo độ cao.", "B. Vì nhiệt độ giảm dần theo độ cao nên điều kiện sống thay đổi.", "C. Vì con người trồng cây khác nhau theo độ cao.", "D. Vì càng lên cao mưa càng nhiều ở mọi nơi."], "answer": "B", "explain": "Độ cao tăng, nhiệt độ giảm (quy luật đai cao) nên mỗi vành đai độ cao có kiểu thảm thực vật thích nghi riêng."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một loài cá chỉ sống được ở nước có nhiệt độ 20–28 độ C. Khi nhiệt độ nước vượt quá 30 độ C kéo dài, loài cá này sẽ", "options": ["A. phát triển mạnh hơn.", "B. bị suy giảm số lượng hoặc chết, phải di cư đến vùng nước mát hơn.", "C. không bị ảnh hưởng gì.", "D. biến thành loài khác ngay lập tức."], "answer": "B", "explain": "Mỗi loài có giới hạn chịu đựng về nhiệt độ; vượt quá giới hạn, sinh vật suy giảm hoặc chết — minh họa vai trò của khí hậu."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Hoạt động nào sau đây của con người gây hại cho sinh quyển?", "options": ["A. Trồng rừng phủ xanh đất trống.", "B. Phá rừng, săn bắt động vật hoang dã quá mức.", "C. Xây dựng khu bảo tồn thiên nhiên.", "D. Xử lí rác thải trước khi thải ra môi trường."], "answer": "B", "explain": "Phá rừng và săn bắt quá mức làm mất nơi cư trú, giảm đa dạng sinh học, nhiều loài nguy cấp."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ở Việt Nam, rừng ở vùng núi cao Hoàng Liên Sơn có nhiều loài ôn đới (đỗ quyên, thông) xen lẫn loài nhiệt đới. Điều này được giải thích bằng", "options": ["A. độ cao lớn làm nhiệt độ giảm, tạo điều kiện cho loài ôn đới sinh sống giữa vùng nhiệt đới.", "B. con người mang cây ôn đới từ châu Âu về trồng.", "C. đá mẹ ở Hoàng Liên Sơn giống châu Âu.", "D. gió mùa đông bắc mang hạt cây ôn đới tới."], "answer": "A", "explain": "Núi cao trên 2000 m, nhiệt độ thấp như ôn đới nên các loài ôn đới tồn tại được giữa vùng nhiệt đới — minh họa quy luật đai cao."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sinh quyển có giới hạn trên và giới hạn dưới rõ rệt.", "b) Mọi nơi trên Trái Đất đều thuộc sinh quyển.", "c) Đại dương là bộ phận quan trọng của sinh quyển.", "d) Sinh vật chỉ phân bố trên lục địa."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: trên là tầng ô-dôn, dưới là đáy đại dương. b) Sai: nơi không có sự sống (đỉnh núi băng, sâu trong thạch quyển) không thuộc sinh quyển. c) Đúng. d) Sai: sinh vật biển rất phong phú."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về thích nghi của sinh vật:", "statements": ["a) Cây xương rồng mọng nước, lá thành gai là thích nghi với khô hạn.", "b) Cây ở vùng ngập úng có rễ thở (khí sinh) là thích nghi với đất thiếu ô-xi.", "c) Động vật vùng cực có lớp mỡ dày, lông dày để giữ nhiệt.", "d) Sinh vật không cần thích nghi với môi trường vẫn tồn tại được."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: các đặc điểm thích nghi điển hình. d) Sai: thích nghi là điều kiện tồn tại của sinh vật."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Tầng khí quyển thấp nhất, nơi chim bay lượn và là một phần của sinh quyển có tên là tầng gì?", "answer": "đối lưu", "explain": "Tầng đối lưu là tầng thấp nhất của khí quyển, nơi tập trung sự sống trên không."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Kiểu rừng rậm thường xanh nhiều tầng ở Việt Nam, thuộc vùng nhiệt đới ẩm có tên là rừng gì? (4 từ)", "answer": "rừng mưa nhiệt đới", "explain": "Việt Nam có rừng mưa nhiệt đới (rừng rậm thường xanh) với đa dạng sinh học cao."}
]},

{"type": "mcq", "level": "NB", "points": 0.25, "q": "Động vật điển hình của rừng mưa nhiệt đới là", "options": ["A. gấu trắng, tuần lộc.", "B. khỉ, vượn, vẹt, trăn.", "C. lạc đà, chuột sa mạc.", "D. cú tuyết, chồn trắng."], "answer": "B", "explain": "Rừng mưa nhiệt đới nóng ẩm có khỉ, vượn, vẹt, trăn, côn trùng rất phong phú."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Mối quan hệ giữa thực vật và đất được thể hiện ở điểm nào?", "options": ["A. Thực vật không liên quan gì đến đất.", "B. Đất cung cấp nước, dinh dưỡng cho thực vật; tàn dư thực vật bổ sung mùn cho đất.", "C. Đất chỉ làm giá đỡ cho cây.", "D. Thực vật làm đất thêm nghèo."], "answer": "B", "explain": "Quan hệ hai chiều: đất nuôi thực vật; thực vật trả lại chất hữu cơ, cải tạo đất."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Vì sao các vườn quốc gia ở Việt Nam (Cúc Phương, Cát Tiên, Bạch Mã) có vai trò quan trọng?", "options": ["A. Vì là nơi khai thác gỗ.", "B. Vì bảo tồn các hệ sinh thái tự nhiên và nhiều loài động thực vật quý hiếm.", "C. Vì là nơi xây dựng khu du lịch duy nhất.", "D. Vì là nơi trồng cây công nghiệp."], "answer": "B", "explain": "Vườn quốc gia bảo vệ nguyên vẹn hệ sinh thái, là nơi cư trú của nhiều loài quý hiếm, góp phần bảo vệ đa dạng sinh học."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Nhân tố nào sau đây thuộc nhóm nhân tố vô sinh ảnh hưởng đến sinh vật?", "options": ["A. Cạnh tranh giữa các loài", "B. Nhiệt độ, lượng mưa, ánh sáng", "C. Chuỗi thức ăn", "D. Sự cộng sinh"], "answer": "B", "explain": "Nhiệt độ, mưa, ánh sáng là nhân tố vô sinh (thuộc khí hậu); các đáp án còn lại là quan hệ giữa sinh vật với nhau."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một nhà khoa học dự báo: nếu nhiệt độ toàn cầu tăng thêm 2 độ C, ranh giới rừng lá kim sẽ dịch chuyển về phía cực. Cơ sở của dự báo này là", "options": ["A. sinh vật luôn di chuyển ngẫu nhiên.", "B. mỗi kiểu thảm thực vật thích nghi với một khoảng nhiệt độ nhất định; nóng lên làm đới khí hậu dịch chuyển.", "C. con người sẽ trồng rừng lá kim ở cực.", "D. đá mẹ ở cực sẽ thay đổi."], "answer": "B", "explain": "Khí hậu quyết định phân bố sinh vật; biến đổi khí hậu làm các đới nhiệt dịch chuyển về cực, kéo theo sự dịch chuyển của các kiểu thảm thực vật."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Rừng là nơi cư trú của nhiều loài động vật.", "b) Rừng có vai trò điều hòa khí hậu, giữ nước, chống xói mòn.", "c) Phá rừng không ảnh hưởng gì đến sinh vật.", "d) Trồng rừng góp phần bảo vệ sinh quyển."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: vai trò sinh thái của rừng. c) Sai: phá rừng mất nơi cư trú, gây xói mòn, biến đổi khí hậu. d) Đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về phân bố sinh vật theo vĩ độ:", "statements": ["a) Từ xích đạo về hai cực, thảm thực vật thay đổi theo quy luật.", "b) Vùng xích đạo có đa dạng sinh học cao nhất.", "c) Vùng cực có thảm thực vật phong phú như vùng xích đạo.", "d) Hoang mạc chỉ phân bố ở vùng nhiệt đới."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: quy luật địa đới. b) Đúng: nóng ẩm quanh năm thuận lợi nhất. c) Sai: vùng cực lạnh giá, thảm thực vật thưa thớt (đồng rêu, địa y). d) Sai: hoang mạc còn ở ôn đới lục địa (Trung Á) và ven biển."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Lớp đất đá trên bề mặt thạch quyển nơi có rễ cây, vi sinh vật sinh sống có thuộc sinh quyển không? (Trả lời: có hoặc không)", "answer": "có", "explain": "Lớp đất và vỏ phong hóa có sự sống là một bộ phận của sinh quyển."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Hiện tượng các kiểu thảm thực vật thay đổi theo độ cao ở vùng núi được gọi là quy luật gì? (2 từ)", "answer": "đai cao", "explain": "Quy luật đai cao: sinh vật thay đổi theo độ cao do nhiệt độ giảm dần."}
]}
,
{"name": "Đề 7", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Sinh quyển tiếp xúc và gắn bó mật thiết với các quyển nào của Trái Đất?", "options": ["A. Khí quyển, thủy quyển, thạch quyển.", "B. Chỉ khí quyển.", "C. Chỉ thủy quyển.", "D. Man-ti và nhân Trái Đất."], "answer": "A", "explain": "Sinh quyển là nơi gặp gỡ của khí quyển, thủy quyển và thạch quyển — nơi có sự sống."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Thảm thực vật điển hình của hoang mạc nhiệt đới là", "options": ["A. rừng rậm nhiều tầng.", "B. cây bụi chịu hạn, xương rồng thưa thớt.", "C. rừng lá kim.", "D. đồng rêu địa y."], "answer": "B", "explain": "Khô hạn nên chỉ cây chịu hạn (xương rồng, cây bụi) tồn tại, thảm thực vật thưa thớt."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao nói khí hậu là nhân tố quyết định sự phân bố sinh vật?", "options": ["A. Vì khí hậu quyết định loại đá mẹ.", "B. Vì chế độ nhiệt, ẩm, ánh sáng tạo điều kiện sống khác nhau, mỗi loài chỉ thích nghi trong giới hạn nhất định.", "C. Vì khí hậu làm thay đổi địa hình.", "D. Vì khí hậu do con người tạo ra."], "answer": "B", "explain": "Nhiệt, ẩm, ánh sáng là điều kiện sống cơ bản; mỗi loài có giới hạn chịu đựng riêng nên phân bố theo các đới khí hậu."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một ao hồ bị ô nhiễm nặng, cá chết hàng loạt, rong tảo phát triển bất thường. Chuỗi nguyên nhân nào đúng?", "options": ["A. Ô nhiễm làm thay đổi môi trường nước, vượt giới hạn chịu đựng của cá.", "B. Cá tự di cư đi nơi khác.", "C. Rong tảo ăn thịt cá.", "D. Ao hồ cạn nước do bốc hơi."], "answer": "A", "explain": "Ô nhiễm thay đổi chất lượng nước (thiếu ô-xi, độc chất) vượt giới hạn chịu đựng của cá → cá chết; đó là tác động của môi trường (có nguồn gốc từ con người) đến sinh vật thủy sinh."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Loài cây nào sau đây thích nghi với đất ngập nước ven biển?", "options": ["A. Thông", "B. Đước, sú, vẹt (rừng ngập mặn)", "C. Xương rồng", "D. Bạch đàn"], "answer": "B", "explain": "Đước, sú, vẹt có rễ thở, chịu mặn, thích nghi với đất bùn lầy ngập nước ven biển nhiệt đới."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hai khu rừng A (nguyên sinh) và B (rừng trồng thuần loài keo) có cùng diện tích, cùng khí hậu. Khu rừng nào có đa dạng sinh học cao hơn và vì sao?", "options": ["A. Rừng A, vì rừng nguyên sinh nhiều tầng tán, nhiều loài cây tạo môi trường sống đa dạng cho động vật.", "B. Rừng B, vì cây keo lớn nhanh.", "C. Hai rừng như nhau.", "D. Không thể so sánh."], "answer": "A", "explain": "Rừng nguyên sinh cấu trúc phức tạp, nhiều loài → nơi cư trú, nguồn thức ăn đa dạng → đa dạng sinh học cao hơn hẳn rừng trồng thuần loài."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Việt Nam có đa dạng sinh học cao nhờ khí hậu nhiệt đới ẩm.", "b) Rừng ngập mặn chỉ có ở vùng ôn đới.", "c) Hoàng Liên Sơn có cả loài nhiệt đới và ôn đới do độ cao lớn.", "d) Mọi loài sinh vật đều sống được ở mọi nơi trên Trái Đất."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: nóng ẩm thuận lợi cho sinh vật. b) Sai: rừng ngập mặn ở ven biển nhiệt đới. c) Đúng: đai cao tạo khí hậu ôn đới trên núi cao. d) Sai: mỗi loài có giới hạn phân bố riêng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về vai trò của nước với sinh vật:", "statements": ["a) Nước là thành phần cơ thể và môi trường sống của sinh vật.", "b) Thiếu nước, sinh vật không thể tồn tại lâu dài.", "c) Vùng càng nhiều nước thì sinh vật càng đa dạng trong mọi trường hợp.", "d) Sinh vật biển cũng cần nước sạch để sinh sống."], "answer": ["T", "T", "F", "T"], "explain": "a), b) Đúng: nước thiết yếu cho sự sống. c) Sai: ngập úng kéo dài cũng gây hại. d) Đúng: ô nhiễm biển đe dọa sinh vật biển."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Nơi tiếp giáp với tầng ô-dôn được xem là giới hạn nào của sinh quyển? (giới hạn trên hoặc giới hạn dưới)", "answer": "giới hạn trên", "explain": "Tầng ô-dôn (khoảng 22–25 km) là giới hạn trên của sinh quyển."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Khu vực được bảo vệ nghiêm ngặt để giữ nguyên hệ sinh thái tự nhiên, bảo tồn các loài quý hiếm ở Việt Nam có tên gọi là gì? (3 từ)", "answer": "vườn quốc gia", "explain": "Vườn quốc gia (Cúc Phương, Cát Tiên...) bảo tồn hệ sinh thái và đa dạng sinh học."}
]},
{"name": "Đề 8", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Sinh vật sống ở đáy đại dương sâu thuộc bộ phận nào của sinh quyển?", "options": ["A. Khí quyển", "B. Thủy quyển", "C. Thạch quyển", "D. Tầng ô-dôn"], "answer": "B", "explain": "Toàn bộ thủy quyển (kể cả đáy đại dương sâu) đều thuộc sinh quyển."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Nhân tố nào sau đây do con người tạo ra, ảnh hưởng ngày càng lớn đến sinh vật?", "options": ["A. Cháy rừng do sét đánh", "B. Phá rừng, ô nhiễm môi trường, săn bắt", "C. Núi lửa phun trào", "D. Động đất"], "answer": "B", "explain": "Phá rừng, ô nhiễm, săn bắt là tác động của con người, ngày càng mạnh mẽ đến sinh quyển."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Cây lúa nước cần nhiều nước, đất phù sa màu mỡ. Điều này cho thấy", "options": ["A. mỗi loại cây trồng thích nghi với điều kiện đất, nước nhất định.", "B. cây lúa sống được ở mọi loại đất.", "C. đất không ảnh hưởng đến cây trồng.", "D. nước không cần thiết cho cây lúa."], "answer": "A", "explain": "Mỗi loài cây có yêu cầu sinh thái riêng về đất, nước, khí hậu; lúa nước ưa nước, đất phù sa."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Người ta trồng cây chắn gió, chắn cát ở ven hoang mạc để", "options": ["A. làm cảnh.", "B. cố định cát, cải tạo đất, tạo môi trường cho sinh vật phát triển, chống sa mạc hóa.", "C. lấy gỗ xuất khẩu.", "D. làm tăng nhiệt độ."], "answer": "B", "explain": "Rừng chắn cát cố định cát bay, cải tạo vi khí hậu và đất, tạo điều kiện cho sinh vật, chống sa mạc hóa lan rộng."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Chuỗi thức ăn trong tự nhiên cho thấy", "options": ["A. các loài sinh vật hoàn toàn độc lập.", "B. các loài sinh vật có quan hệ dinh dưỡng chặt chẽ với nhau.", "C. chỉ thực vật mới quan trọng.", "D. động vật không cần thức ăn."], "answer": "B", "explain": "Chuỗi thức ăn thể hiện quan hệ dinh dưỡng: sinh vật này là thức ăn của sinh vật khác, gắn bó trong hệ sinh thái."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một loài chim di cư mỗi năm bay từ Xi-bi-ri về Đông Nam Á tránh rét. Hành vi này chứng tỏ", "options": ["A. nhiệt độ (khí hậu) ảnh hưởng đến hoạt động sống và phân bố theo mùa của động vật.", "B. chim thích bay xa.", "C. thức ăn ở Xi-bi-ri hết vào mùa đông.", "D. chim sợ con người."], "answer": "A", "explain": "Chim di cư tránh rét là thích nghi với sự thay đổi nhiệt độ theo mùa — minh họa ảnh hưởng của khí hậu đến động vật. (Thức ăn giảm cũng do lạnh, nhưng nguyên nhân gốc là nhiệt độ.)"},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tầng đối lưu là nơi tập trung sự sống trong khí quyển.", "b) Trên đỉnh núi băng vĩnh cửu vẫn có rừng rậm.", "c) Rạn san hô là hệ sinh thái biển đa dạng sinh học cao.", "d) Sa mạc hoàn toàn không có sinh vật."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: băng tuyết vĩnh cửu quá lạnh, không có rừng. c) Đúng: san hô là nơi cư trú của nhiều loài biển. d) Sai: sa mạc vẫn có sinh vật chịu hạn."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về bảo vệ sinh quyển:", "statements": ["a) Đa dạng sinh học có giá trị to lớn về kinh tế, khoa học và môi trường.", "b) Mỗi loài bị tuyệt chủng là tổn thất không thể phục hồi.", "c) Bảo vệ sinh quyển là trách nhiệm của tất cả mọi người.", "d) Chỉ nhà khoa học mới cần quan tâm đến bảo vệ sinh vật."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: giá trị và trách nhiệm bảo vệ đa dạng sinh học. d) Sai: mọi người đều có trách nhiệm (không săn bắt, không phá rừng, không xả rác...)."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Độ sâu khoảng bao nhiêu ki-lô-mét là giới hạn dưới của sinh quyển ở đại dương? (chỉ ghi số)", "answer": "11", "explain": "Giới hạn dưới của sinh quyển xuống tới đáy các rãnh đại dương sâu nhất, khoảng 11 km."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Mối quan hệ “kẻ ăn – con mồi” giữa các loài sinh vật trong tự nhiên được thể hiện qua khái niệm nào? (3 từ)", "answer": "chuỗi thức ăn", "explain": "Chuỗi thức ăn thể hiện quan hệ dinh dưỡng giữa các loài trong hệ sinh thái."}
]}
,
{"name": "Đề 9", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Khối lượng sinh quyển tập trung chủ yếu ở", "options": ["A. tầng cao của khí quyển.", "B. bề mặt lục địa, đại dương và lớp không khí sát mặt đất.", "C. sâu trong lòng đất.", "D. trên tầng ô-dôn."], "answer": "B", "explain": "Sự sống tập trung ở bề mặt tiếp xúc giữa các quyển: mặt đất, mặt biển và lớp không khí sát mặt đất."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Thực vật ở vùng ôn đới rụng lá vào mùa đông chủ yếu để", "options": ["A. làm đẹp cảnh quan.", "B. giảm thoát hơi nước, thích nghi với lạnh giá, ít nước.", "C. thu hút động vật.", "D. tăng quang hợp."], "answer": "B", "explain": "Rụng lá mùa đông giúp cây ôn đới giảm thoát hơi nước, chống chịu lạnh — thích nghi với khí hậu."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao cùng ở vùng nhiệt đới nhưng rừng ven biển lại rậm rạp hơn rừng trong nội địa sâu?", "options": ["A. Vì ven biển gần đường xích đạo hơn.", "B. Vì ven biển nhận được hơi ẩm từ biển, mưa nhiều hơn nội địa.", "C. Vì đất ven biển luôn tốt hơn.", "D. Vì con người không sống ở ven biển."], "answer": "B", "explain": "Gần biển, hơi ẩm dồi dào, mưa nhiều nên rừng rậm rạp; càng vào nội địa, khí hậu càng khô hạn."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một dự án thủy điện làm ngập một vùng rừng nguyên sinh rộng lớn. Hậu quả nghiêm trọng nhất đối với sinh quyển là", "options": ["A. tăng diện tích mặt nước.", "B. mất nơi cư trú của nhiều loài, có thể làm một số loài quý hiếm tuyệt chủng.", "C. tạo cảnh quan đẹp.", "D. tăng lượng mưa."], "answer": "B", "explain": "Ngập rừng phá hủy nơi cư trú, chia cắt sinh cảnh; nhiều loài không thích nghi kịp có thể tuyệt chủng — tổn thất đa dạng sinh học."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Đặc điểm nào sau đây đúng với rừng mưa nhiệt đới?", "options": ["A. Cây rụng lá vào mùa đông.", "B. Xum xuê, nhiều tầng tán, xanh quanh năm.", "C. Chỉ có một tầng cây thấp.", "D. Cây thưa thớt, còi cọc."], "answer": "B", "explain": "Nóng ẩm quanh năm nên rừng mưa nhiệt đới xanh tốt quanh năm, cấu trúc nhiều tầng (tán cao, tán trung, tầng bụi, thảm cỏ)."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Các nhà khoa học dùng phấn hoa trong trầm tích để tái hiện thảm thực vật hàng nghìn năm trước. Cơ sở khoa học của phương pháp này là", "options": ["A. phấn hoa không bao giờ bị phân hủy.", "B. mỗi kiểu thảm thực vật để lại loại phấn hoa đặc trưng, phản ánh khí hậu thời kì đó.", "C. phấn hoa do con người tạo ra.", "D. trầm tích luôn chứa đầy đủ mọi loài."], "answer": "B", "explain": "Thảm thực vật do khí hậu quyết định; phấn hoa bảo quản trong trầm tích phản ánh thành phần thực vật → suy ra khí hậu quá khứ. Đây là ứng dụng của mối quan hệ khí hậu – sinh vật."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Khí hậu nóng ẩm quanh năm thuận lợi nhất cho sinh vật phát triển.", "b) Vùng cực lạnh giá có đa dạng sinh học cao nhất.", "c) Hoang mạc có sinh vật nhưng kém đa dạng hơn rừng nhiệt đới.", "d) Núi cao có các vành đai sinh vật khác nhau theo độ cao."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: xích đạo đa dạng nhất. b) Sai: vùng cực khắc nghiệt, đa dạng thấp. c) Đúng. d) Đúng: quy luật đai cao."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về con người và sinh quyển:", "statements": ["a) Dân số tăng nhanh gây sức ép lên tài nguyên sinh vật.", "b) Đô thị hóa làm thu hẹp nơi cư trú tự nhiên của sinh vật.", "c) Phát triển kinh tế luôn đi đôi với bảo vệ sinh quyển.", "d) Giáo dục ý thức bảo vệ môi trường giúp bảo vệ sinh quyển."], "answer": ["T", "T", "F", "T"], "explain": "a), b) Đúng: sức ép dân số và đô thị hóa. c) Sai: phát triển thiếu bền vững gây hại sinh quyển. d) Đúng: ý thức cộng đồng rất quan trọng."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Sinh vật trên Trái Đất sống trong ba quyển: khí quyển, thủy quyển và quyển nào nữa?", "answer": "thạch quyển", "explain": "Sinh quyển giao nhau với khí quyển, thủy quyển và thạch quyển (lớp đất đá bề mặt có sự sống)."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Rừng ngập mặn ở Việt Nam (Cần Giờ, Cà Mau) có loài cây gỗ điển hình nào? (1 từ)", "answer": "đước", "explain": "Cây đước là loài điển hình của rừng ngập mặn Việt Nam, có rễ thở thích nghi với đất bùn lầy."}
]},
{"name": "Đề 10", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Yếu tố nào sau đây KHÔNG phải là nhân tố ảnh hưởng đến sinh vật?", "options": ["A. Khí hậu", "B. Đất", "C. Lực hấp dẫn của Mặt Trăng", "D. Con người"], "answer": "C", "explain": "6 nhân tố: khí hậu, đất, địa hình, nguồn nước, sinh vật, con người. Lực hấp dẫn của Mặt Trăng không phải nhân tố ảnh hưởng đến phân bố sinh vật."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đồng cỏ ôn đới có động vật điển hình là", "options": ["A. hươu, nai, gấu, sóc.", "B. cá voi, hải cẩu.", "C. khỉ, vượn.", "D. lạc đà."], "answer": "A", "explain": "Đồng cỏ, rừng lá rộng ôn đới có hươu, nai, gấu, sóc, chim."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Tại sao các loài cây ở vùng ôn đới thường rụng lá vào mùa đông còn cây nhiệt đới thì không?", "options": ["A. Do cây ôn đới bị bệnh.", "B. Do mùa đông ôn đới lạnh giá, khô hạn nên rụng lá để thích nghi; nhiệt đới nóng ẩm quanh năm nên cây xanh quanh năm.", "C. Do con người tỉa lá.", "D. Do đất ôn đới xấu hơn."], "answer": "B", "explain": "Rụng lá mùa đông là thích nghi với lạnh và khô; nhiệt đới điều kiện thuận lợi quanh năm nên cây thường xanh."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một vùng đất sau khi bị khai thác khoáng sản trở thành đất trống, ô nhiễm. Muốn phục hồi sinh quyển ở đây, việc làm đầu tiên và quan trọng nhất là", "options": ["A. xây nhà máy mới.", "B. cải tạo đất, xử lí ô nhiễm rồi trồng cây phủ xanh.", "C. để tự nhiên không cần làm gì.", "D. đổ thêm chất thải."], "answer": "B", "explain": "Phục hồi sinh thái: xử lí ô nhiễm, cải tạo đất trước; trồng cây phủ xanh tái tạo thảm thực vật, từ đó động vật quay trở lại."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Điểm chung của các loài sinh vật sống ở hoang mạc là", "options": ["A. đều cần rất nhiều nước.", "B. đều có khả năng chịu hạn, tiết kiệm nước.", "C. đều sống dưới nước.", "D. đều ngủ đông quanh năm."], "answer": "B", "explain": "Sinh vật hoang mạc thích nghi với khô hạn: trữ nước, giảm thoát hơi nước, hoạt động về đêm..."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Sắp xếp các kiểu thảm thực vật theo thứ tự từ xích đạo về cực đúng là", "options": ["A. Rừng mưa nhiệt đới – xa-van – hoang mạc – rừng ôn đới – rừng lá kim – đồng rêu.", "B. Đồng rêu – rừng lá kim – rừng ôn đới – hoang mạc – xa-van – rừng mưa nhiệt đới.", "C. Hoang mạc – xa-van – rừng mưa nhiệt đới – rừng lá kim – đồng rêu.", "D. Rừng lá kim – rừng mưa nhiệt đới – xa-van – đồng rêu – hoang mạc."], "answer": "A", "explain": "Từ xích đạo về cực: rừng mưa nhiệt đới (nóng ẩm) – xa-van (nhiệt đới mùa) – hoang mạc – rừng ôn đới – rừng lá kim (ôn đới lạnh) – đồng rêu địa y (cực)."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sinh quyển bao gồm cả sinh vật và môi trường sống của chúng.", "b) Con người là một bộ phận của sinh quyển.", "c) Bảo vệ sinh quyển cũng chính là bảo vệ cuộc sống của con người.", "d) Sinh quyển tồn tại độc lập, không liên quan đến các quyển khác."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: con người sống trong và phụ thuộc vào sinh quyển. d) Sai: sinh quyển gắn bó mật thiết với khí, thủy, thạch quyển."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Một nhóm học sinh tranh luận về nguyên nhân rừng A-ma-dôn đa dạng sinh học. Xét tính đúng, sai:", "statements": ["a) Khí hậu nóng ẩm quanh năm là nguyên nhân chủ yếu.", "b) Diện tích rừng rộng lớn tạo nhiều sinh cảnh khác nhau.", "c) Rừng ít bị tác động của con người trong thời gian dài.", "d) Đa dạng sinh học chỉ do con người tạo ra."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: khí hậu, diện tích, ít tác động tạo đa dạng cao. d) Sai: đa dạng sinh học là sản phẩm của tự nhiên."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Vùng khí hậu nào có thảm thực vật là đồng rêu, địa y thưa thớt và động vật là gấu trắng, tuần lộc?", "answer": "cực", "explain": "Vùng cực (địa cực) lạnh giá quanh năm: thảm thực vật đồng rêu, địa y; động vật gấu trắng, tuần lộc, chim cánh cụt."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Có 6 nhân tố ảnh hưởng đến sinh vật: khí hậu, đất, địa hình, nguồn nước, sinh vật và nhân tố nào nữa?", "answer": "con người", "explain": "6 nhân tố: khí hậu, đất, địa hình, nguồn nước, sinh vật, con người."}
