{"type": "mcq", "level": "TH", "points": 0.25, "q": "Nước trong đất có vai trò quan trọng nào sau đây đối với cây trồng?", "options": ["A. Cung cấp trực tiếp chất khoáng cho đất.", "B. Hòa tan chất dinh dưỡng để rễ cây hấp thụ.", "C. Tạo ra mùn cho tầng đất mặt.", "D. Làm tăng độ chua của mọi loại đất."], "answer": "B", "explain": "Nước hòa tan các chất dinh dưỡng thành dung dịch để rễ cây hút; đồng thời tham gia vận chuyển vật chất trong đất."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Ở Việt Nam, đất đỏ vàng (feralit) chiếm diện tích lớn ở vùng đồi núi và thích hợp trồng cây công nghiệp lâu năm (cà phê, cao su, chè). Tuy nhiên, khi trồng các loại cây này cần đặc biệt chú ý biện pháp nào?", "options": ["A. Tưới nước thật nhiều để rửa phèn.", "B. Chống xói mòn, rửa trôi bằng cách trồng cây che phủ, làm ruộng bậc thang.", "C. Bón vôi với liều lượng thật lớn mỗi năm.", "D. Cày sâu, lật đất thường xuyên."], "answer": "B", "explain": "Đất feralit đồi núi dễ bị xói mòn, rửa trôi khi mất lớp phủ; trồng cây che phủ, canh tác theo đường đồng mức, ruộng bậc thang giúp giữ đất, giữ ẩm."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong các nhân tố hình thành đất, nhân tố nào vừa có thể cải tạo đất theo hướng tích cực, vừa có thể làm đất bị thoái hóa?", "options": ["A. Đá mẹ", "B. Khí hậu", "C. Con người", "D. Thời gian"], "answer": "C", "explain": "Con người cải tạo đất bằng bón phân, thủy lợi, phủ xanh; nhưng cũng gây thoái hóa do phá rừng, canh tác bừa bãi, ô nhiễm đất."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một vùng đất có đá mẹ là đá vôi, khí hậu nhiệt đới ẩm, địa hình dốc. Loại đất hình thành ở đây nhiều khả năng có đặc điểm nào?", "options": ["A. Rất giàu mùn như đất đen thảo nguyên.", "B. Tầng đất mỏng, dễ bị xói mòn, rửa trôi do địa hình dốc và mưa nhiều.", "C. Tích tụ nhiều muối như đất hoang mạc.", "D. Đóng băng quanh năm như đất đới lạnh."], "answer": "B", "explain": "Tổng hợp các nhân tố: mưa nhiều (rửa trôi mạnh) + địa hình dốc (xói mòn) → tầng đất mỏng dù đá vôi phong hóa nhanh; đây là kiểu đất feralit vùng đồi núi nhiệt đới."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về các loại đất:", "statements": ["a) Đất đen thảo nguyên giàu mùn hơn đất pốt dôn.", "b) Đất phù sa được bồi đắp hằng năm nên rất màu mỡ.", "c) Đất xám hoang mạc giàu mùn do ít bị rửa trôi.", "d) Đất đỏ vàng phân bố chủ yếu ở vùng nhiệt đới ẩm."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đất đen giàu mùn nhất, đất pốt dôn nghèo mùn. b) Đúng: phù sa bồi đắp hằng năm bổ sung dinh dưỡng. c) Sai: đất xám hoang mạc nghèo mùn vì thực vật thưa thớt. d) Đúng: nhiệt đới ẩm là nơi phân bố chính của đất đỏ vàng feralit."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thành phần cơ giới của đất do đá mẹ quyết định chủ yếu.", "b) Ở nơi địa hình bằng phẳng, thấp trũng, tầng đất thường dày do được bồi tụ.", "c) Khí hậu càng lạnh thì quá trình phân giải chất hữu cơ càng nhanh.", "d) Trồng rừng, phủ xanh đất trống giúp hạn chế xói mòn đất."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đá mẹ cung cấp vật chất vô cơ, quyết định tỉ lệ cát, limon, sét. b) Đúng: nơi thấp nhận vật chất từ nơi cao đưa tới. c) Sai: lạnh làm phân giải chậm, mùn tích lũy nhưng nghèo dinh dưỡng. d) Đúng: tán rừng và rễ cây giữ đất, giảm xói mòn."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Lớp đá cứng chưa bị phong hóa, nằm dưới cùng của phẫu diện đất được kí hiệu bằng chữ cái nào?", "answer": "D", "explain": "Tầng D là đá gốc: đá cứng, chưa bị phong hóa, nằm dưới cùng của phẫu diện đất."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Có 6 nhân tố hình thành đất: đá mẹ, khí hậu, sinh vật, địa hình, thời gian và con người. Trong đó, hai nhân tố được xem là ảnh hưởng mạnh nhất đến sự phân bố các loại đất trên Trái Đất là khí hậu và nhân tố nào?", "answer": "sinh vật", "explain": "Khí hậu và sinh vật là hai nhân tố ảnh hưởng mạnh nhất đến sự hình thành và phân bố các loại đất (quyết định tốc độ phong hóa, lượng mùn)."}
]},
{"name": "Đề 4", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Chất hữu cơ (mùn) trong đất chiếm tỉ lệ khoảng bao nhiêu?", "options": ["A. Khoảng 45%", "B. Khoảng 5%", "C. Khoảng 25%", "D. Khoảng 50%"], "answer": "B", "explain": "Chất hữu cơ chỉ chiếm khoảng 5% thể tích đất nhưng quyết định chủ yếu độ phì của đất."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Tầng tích tụ trong phẫu diện đất được kí hiệu là", "options": ["A. tầng A.", "B. tầng B.", "C. tầng C.", "D. tầng D."], "answer": "B", "explain": "Tầng B là tầng tích tụ: nơi tích lũy sét và các oxit bị rửa trôi từ tầng A xuống."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao đất ở vùng đồng bằng châu thổ thường màu mỡ, thích hợp trồng lúa?", "options": ["A. Vì được sông bồi đắp phù sa hằng năm, bổ sung dinh dưỡng.", "B. Vì khí hậu lạnh giúp mùn tích lũy nhiều.", "C. Vì đá mẹ ở đồng bằng đều là đá ba dan.", "D. Vì không có con người tác động."], "answer": "A", "explain": "Sông mang phù sa bồi đắp hằng năm cho đồng bằng châu thổ, bổ sung chất dinh dưỡng nên đất phù sa rất màu mỡ."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Người ta nhận thấy: cùng một sườn đồi, đất ở chân đồi thường dày và tốt hơn đất ở đỉnh đồi. Giải thích nào sau đây là đúng nhất?", "options": ["A. Chân đồi nhận vật chất xói mòn từ trên cao đưa xuống nên được bồi tụ.", "B. Đỉnh đồi có nhiều ánh sáng hơn nên đất tốt hơn.", "C. Chân đồi có đá mẹ tốt hơn đỉnh đồi.", "D. Con người chỉ canh tác ở chân đồi."], "answer": "A", "explain": "Đây là vai trò của địa hình: vật chất bị xói mòn ở nơi cao được vận chuyển xuống bồi tụ ở chân đồi, nơi thấp nên tầng đất ở chân đồi dày và giàu dinh dưỡng hơn."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Đặc điểm nào sau đây KHÔNG đúng với đất pốt dôn?", "options": ["A. Phân bố dưới rừng lá kim ở đới lạnh và ôn đới lạnh.", "B. Nghèo mùn, chua, kém dinh dưỡng.", "C. Rất giàu mùn, tơi xốp.", "D. Chịu quá trình rửa trôi tương đối mạnh."], "answer": "C", "explain": "Rất giàu mùn, tơi xốp là đặc điểm của đất đen thảo nguyên, không phải đất pốt dôn (nghèo mùn, chua)."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Để cải tạo đất phèn, đất mặn ở đồng bằng sông Cửu Long, biện pháp kĩ thuật quan trọng hàng đầu là", "options": ["A. bón thật nhiều phân đạm.", "B. thau chua, rửa mặn kết hợp xây dựng hệ thống thủy lợi.", "C. trồng rừng phòng hộ ven biển.", "D. cày ải, phơi đất trong mùa khô."], "answer": "B", "explain": "Đất phèn, mặn cần nước ngọt để thau chua, rửa mặn; hệ thống thủy lợi (đê bao, cống) kiểm soát mặn, giữ ngọt là biện pháp then chốt ở đồng bằng sông Cửu Long."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Độ phì là đặc trưng quan trọng nhất của đất.", "b) Đất hình thành rất nhanh nhưng bị phá hủy rất chậm.", "c) Đá mẹ khác nhau tạo ra đất có thành phần cơ giới khác nhau.", "d) Rừng có tác dụng hạn chế xói mòn, bảo vệ đất."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: độ phì quyết định khả năng cung cấp dinh dưỡng cho cây. b) Sai: đất hình thành rất chậm (hàng trăm, hàng nghìn năm) nhưng bị phá hủy rất nhanh. c) Đúng: đá mẹ quyết định thành phần khoáng và cơ giới. d) Đúng: tán và rễ cây giữ đất, giảm xói mòn."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Một nhóm học sinh đưa ra các nhận định về đất ở Việt Nam. Xét tính đúng, sai:", "statements": ["a) Đất phù sa ở đồng bằng sông Hồng thích hợp trồng lúa nước.", "b) Đất đỏ vàng ở vùng đồi núi thích hợp trồng cây công nghiệp lâu năm.", "c) Đất ở vùng đồi núi dốc nếu mất rừng sẽ bị xói mòn, rửa trôi mạnh.", "d) Mọi loại đất ở Việt Nam đều giàu mùn như đất đen thảo nguyên."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: phù sa màu mỡ, đủ nước trồng lúa. b) Đúng: cà phê, cao su, chè ưa đất đỏ vàng. c) Đúng: mất lớp phủ, mưa nhiệt đới gây xói mòn mạnh. d) Sai: đất feralit đồi núi thường nghèo dinh dưỡng hơn đất đen."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Quá trình nào của đá (dưới tác động của nhiệt độ, nước, sinh vật) tạo ra vật chất vô cơ cho đất?", "answer": "phong hóa", "explain": "Phong hóa là quá trình phá hủy đá thành vật chất vụn bở, cung cấp chất khoáng cho đất."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Ở Việt Nam, loại đất đỏ hình thành trên đá ba dan ở Tây Nguyên, rất thích hợp trồng cà phê, có tên gọi là đất đỏ gì?", "answer": "ba dan", "explain": "Đất đỏ ba dan ở Tây Nguyên tơi xốp, giàu dinh dưỡng, rất thích hợp trồng cà phê, cao su."}
]},
{"name": "Đề 5", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Có bao nhiêu nhân tố hình thành đất được SGK nêu?", "options": ["A. 4 nhân tố", "B. 5 nhân tố", "C. 6 nhân tố", "D. 7 nhân tố"], "answer": "C", "explain": "6 nhân tố: đá mẹ, khí hậu, sinh vật, địa hình, thời gian, con người."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Không khí trong đất có vai trò chủ yếu nào?", "options": ["A. Hòa tan chất dinh dưỡng.", "B. Cung cấp ô-xi cho hô hấp của rễ cây và vi sinh vật.", "C. Tạo ra chất mùn.", "D. Làm đất thêm chặt."], "answer": "B", "explain": "Không khí nằm trong khe hở của đất, cung cấp ô-xi cho rễ cây và vi sinh vật hô hấp."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Nhân tố thời gian ảnh hưởng đến quá trình hình thành đất như thế nào?", "options": ["A. Thời gian càng dài, phẫu diện đất càng phân hóa rõ, tầng đất càng dày (nếu không bị xói mòn).", "B. Thời gian càng dài, đất càng bị rửa trôi hết.", "C. Thời gian không ảnh hưởng gì đến đất.", "D. Đất chỉ hình thành trong vài chục năm."], "answer": "A", "explain": "Đất hình thành rất chậm; tuổi đất càng lớn thì các tầng đất phân hóa càng rõ và tầng đất càng dày, với điều kiện không bị xói mòn."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Ở hoang mạc Xa-ha-ra, đất nghèo dinh dưỡng, khô cằn. Chuỗi nguyên nhân nào sau đây giải thích đúng nhất?", "options": ["A. Mưa nhiều gây rửa trôi, cộng thêm địa hình dốc.", "B. Khí hậu khô hạn, thực vật thưa thớt nên ít tàn dư hữu cơ, đất nghèo mùn.", "C. Nhiệt độ quá thấp làm đất đóng băng.", "D. Đá mẹ ở đây không chứa chất khoáng."], "answer": "B", "explain": "Khí hậu khô hạn → thực vật thưa → ít tàn dư hữu cơ → đất nghèo mùn; bốc hơi mạnh còn làm tích tụ muối."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Loại đất nào sau đây phân bố chủ yếu ở vùng nhiệt đới ẩm như Đông Nam Á?", "options": ["A. Đất pốt dôn", "B. Đất đen thảo nguyên", "C. Đất đỏ vàng (feralit)", "D. Đất xám hoang mạc"], "answer": "C", "explain": "Nóng ẩm quanh năm, phong hóa mạnh tạo đất đỏ vàng (feralit) giàu oxit sắt, nhôm ở vùng nhiệt đới ẩm."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một dự án trồng rừng trên đất đồi trọc ở vùng nhiệt đới. Sau 10 năm, tầng đất mặt dày thêm và giàu mùn hơn. Kết quả này chứng tỏ vai trò của nhân tố nào là quyết định?", "options": ["A. Đá mẹ", "B. Sinh vật (thảm thực vật)", "C. Thời gian", "D. Địa hình"], "answer": "B", "explain": "Trồng rừng bổ sung thảm thực vật: tán che giảm xói mòn, tàn dư lá rễ phân hủy bổ sung mùn. Đây là tác động trực tiếp của nhân tố sinh vật (có sự can thiệp của con người)."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đất đen thảo nguyên hình thành dưới đồng cỏ ôn đới.", "b) Đất pốt dôn phân bố dưới rừng lá kim ở đới lạnh.", "c) Đất đỏ vàng giàu mùn hơn đất đen thảo nguyên.", "d) Đất phù sa thường phân bố ở đồng bằng châu thổ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: đất đen mới là loại giàu mùn nhất; đất đỏ vàng thường nghèo dinh dưỡng hơn. d) Đúng: phù sa do sông bồi đắp ở châu thổ."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về vai trò của các nhân tố:", "statements": ["a) Khí hậu ảnh hưởng đến tốc độ phong hóa đá và quá trình tích lũy mùn.", "b) Sinh vật quyết định lượng mùn trong đất thông qua tàn dư hữu cơ.", "c) Ở vùng dốc, con người không thể tác động để bảo vệ đất.", "d) Đá mẹ chỉ ảnh hưởng đến màu sắc của đất, không ảnh hưởng đến độ phì."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: nhiệt, ẩm chi phối phong hóa và phân giải hữu cơ. b) Đúng: thảm thực vật quyết định lượng mùn. c) Sai: con người có thể trồng rừng, canh tác theo đường đồng mức để chống xói mòn. d) Sai: đá mẹ quyết định thành phần khoáng, cơ giới nên ảnh hưởng đến độ phì."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Tầng đất nằm ngay dưới tầng mùn (tầng A), có vai trò tích tụ sét và các oxit, được kí hiệu là tầng gì?", "answer": "B", "explain": "Tầng B là tầng tích tụ, nằm ngay dưới tầng A."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Loại đất nghèo mùn, chua, phân bố dưới rừng lá kim ở đới lạnh và ôn đới lạnh có tên là đất gì?", "answer": "pốt dôn", "explain": "Đất pốt dôn (podzol): nghèo mùn, chua, kém dinh dưỡng, dưới rừng lá kim đới lạnh."}
]},
{"name": "Đề 6", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đá mẹ cung cấp cho đất thành phần nào?", "options": ["A. Chất hữu cơ", "B. Chất khoáng (vật chất vô cơ)", "C. Nước", "D. Không khí"], "answer": "B", "explain": "Đá mẹ bị phong hóa tạo ra vật chất vô cơ (cát, limon, sét) là nguồn chất khoáng của đất."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Tầng đá mẹ trong phẫu diện đất được kí hiệu là", "options": ["A. tầng A.", "B. tầng B.", "C. tầng C.", "D. tầng D."], "answer": "C", "explain": "Tầng C là đá mẹ đang trong quá trình phong hóa dở dang, nằm dưới tầng tích tụ B."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong các cặp nhân tố sau, cặp nhân tố nào ảnh hưởng mạnh nhất đến sự phân bố các loại đất trên Trái Đất?", "options": ["A. Đá mẹ và thời gian", "B. Khí hậu và sinh vật", "C. Địa hình và con người", "D. Đá mẹ và địa hình"], "answer": "B", "explain": "Khí hậu (nhiệt, ẩm) và sinh vật (thảm thực vật) quyết định tốc độ phong hóa và lượng mùn, nên chi phối mạnh nhất sự phân bố các loại đất."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Người nông dân ở vùng đồi núi thường trồng xen cây họ đậu, bón phân xanh để cải tạo đất. Cơ sở khoa học của việc làm này là", "options": ["A. cây họ đậu làm tăng độ dốc của đất.", "B. cây họ đậu cố định đạm, tàn dư phân hủy bổ sung mùn, tăng độ phì.", "C. cây họ đậu hút hết nước trong đất.", "D. cây họ đậu làm đất thêm chua."], "answer": "B", "explain": "Cây họ đậu có vi khuẩn nốt sần cố định đạm khí trời; thân lá phân hủy bổ sung chất hữu cơ, tăng mùn và độ phì cho đất."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Hiện tượng nào sau đây là biểu hiện của đất bị thoái hóa?", "options": ["A. Tầng đất mặt dày thêm, giàu mùn.", "B. Đất bị xói mòn, rửa trôi, bạc màu, nhiễm mặn.", "C. Cây trồng sinh trưởng tốt.", "D. Độ phì của đất tăng lên."], "answer": "B", "explain": "Thoái hóa đất là suy giảm độ phì do xói mòn, rửa trôi, bạc màu, nhiễm mặn, nhiễm phèn, ô nhiễm."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ba vùng A, B, C có cùng khí hậu nhiệt đới ẩm, cùng thảm thực vật rừng. Vùng A đá mẹ là đá ba dan, vùng B đá mẹ là đá cát kết, vùng C đá mẹ là đá vôi. Dự đoán nào sau đây hợp lí nhất về đất ở ba vùng?", "options": ["A. Cả ba vùng có đất hoàn toàn giống nhau.", "B. Đất ba vùng khác nhau về thành phần khoáng và độ phì do đá mẹ khác nhau.", "C. Vùng nào cũng hình thành đất đen thảo nguyên.", "D. Đá mẹ không ảnh hưởng gì khi khí hậu đã giống nhau."], "answer": "B", "explain": "Khi các nhân tố khác giống nhau, đá mẹ trở thành nhân tố tạo sự khác biệt: đá ba dan cho đất tốt, giàu dinh dưỡng; đá cát kết cho đất cát pha, nghèo; đá vôi cho đất có phản ứng khác. Đây là cách phân tích tổng hợp các nhân tố."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chất khoáng chiếm khoảng 45% thể tích của đất.", "b) Chất hữu cơ chiếm khoảng 5% thể tích của đất.", "c) Nước và không khí mỗi loại chiếm khoảng 20–30% thể tích đất.", "d) Tỉ lệ các thành phần của đất là cố định ở mọi loại đất."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: tỉ lệ điển hình ở đất mặt. d) Sai: tỉ lệ thay đổi tùy loại đất, tầng đất và điều kiện cụ thể."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về bảo vệ đất:", "statements": ["a) Đất hình thành rất chậm nên cần sử dụng tiết kiệm, hợp lí.", "b) Phủ xanh đất trống, đồi trọc giúp chống xói mòn đất.", "c) Canh tác bừa bãi trên đất dốc không ảnh hưởng đến đất.", "d) Bón phân cân đối, hợp lí giúp duy trì độ phì của đất."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: cần hàng trăm, hàng nghìn năm để hình thành lớp đất dày. b) Đúng: lớp phủ thực vật bảo vệ đất. c) Sai: canh tác bừa bãi trên dốc gây xói mòn nghiêm trọng. d) Đúng: bón phân cân đối bổ sung dinh dưỡng, duy trì độ phì."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Mẹo nhớ 6 nhân tố hình thành đất: “Đá – Khí – Sinh – Địa – Thời – …”. Từ còn thiếu là gì?", "answer": "Người", "explain": "6 nhân tố: đá mẹ, khí hậu, sinh vật, địa hình, thời gian, con người (Người)."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Loại đất được sông bồi đắp hằng năm ở đồng bằng châu thổ, rất màu mỡ và thích hợp trồng lúa nước có tên là đất gì?", "answer": "phù sa", "explain": "Đất phù sa do sông bồi đắp hằng năm, giàu dinh dưỡng, thích hợp trồng lúa nước."}
]},
{"name": "Đề 7", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Mùn trong đất được hình thành từ nguồn nào?", "options": ["A. Đá mẹ bị phong hóa.", "B. Xác sinh vật phân hủy.", "C. Nước mưa thấm xuống.", "D. Không khí trong đất."], "answer": "B", "explain": "Mùn là chất hữu cơ hình thành từ xác thực vật, động vật và vi sinh vật phân hủy."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Tầng đất nào giàu mùn nhất?", "options": ["A. Tầng A", "B. Tầng B", "C. Tầng C", "D. Tầng D"], "answer": "A", "explain": "Tầng A (tầng mùn) nằm trên cùng, tích lũy nhiều chất hữu cơ nhất nên giàu mùn nhất."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "So sánh đất ở vùng nhiệt đới ẩm và vùng ôn đới lạnh, nhận xét nào sau đây đúng?", "options": ["A. Vùng nhiệt đới ẩm phong hóa mạnh hơn nhưng đất dễ bị rửa trôi, chua.", "B. Vùng ôn đới lạnh phong hóa mạnh hơn vùng nhiệt đới ẩm.", "C. Hai vùng có đất hoàn toàn giống nhau.", "D. Vùng nhiệt đới ẩm không có quá trình phong hóa."], "answer": "A", "explain": "Nóng ẩm làm phong hóa hóa học rất mạnh, nhưng mưa lớn cũng rửa trôi mạnh các chất dễ hòa tan khiến đất chua; vùng lạnh phong hóa yếu hơn."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một học sinh cho rằng: “Muốn đất tốt chỉ cần bón thật nhiều phân hóa học”. Theo em, quan điểm này", "options": ["A. đúng vì phân hóa học cung cấp đầy đủ dinh dưỡng.", "B. chưa đầy đủ vì lạm dụng phân hóa học làm đất chai cứng, mất cân bằng; cần kết hợp phân hữu cơ, bảo vệ cấu tượng đất.", "C. đúng vì phân hữu cơ không có tác dụng.", "D. sai vì đất không cần dinh dưỡng."], "answer": "B", "explain": "Lạm dụng phân hóa học làm đất chai cứng, chua hóa, ô nhiễm; cần bón cân đối, kết hợp phân hữu cơ, giữ cấu tượng và vi sinh vật đất."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Đất xám hoang mạc, bán hoang mạc có đặc điểm nào?", "options": ["A. Rất giàu mùn, tơi xốp.", "B. Nghèo mùn, khô cằn, có nơi tích tụ muối.", "C. Được bồi đắp phù sa hằng năm.", "D. Chua, giàu oxit sắt nhôm."], "answer": "B", "explain": "Khí hậu khô hạn, thực vật thưa thớt → đất nghèo mùn, khô cằn; bốc hơi mạnh gây tích tụ muối ở một số nơi."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ở một vùng núi cao nhiệt đới, người ta thấy càng lên cao đất càng mỏng và nghèo dinh dưỡng hơn. Ngoài nhiệt độ giảm, nguyên nhân quan trọng nhất liên quan đến nhân tố nào?", "options": ["A. Địa hình: độ dốc lớn, xói mòn mạnh; sườn núi hứng mưa nhiều gây rửa trôi.", "B. Đá mẹ ở trên cao luôn tốt hơn ở dưới thấp.", "C. Con người không lên núi cao nên đất xấu.", "D. Thời gian hình thành đất trên núi cao luôn ngắn hơn."], "answer": "A", "explain": "Vùng núi cao dốc → xói mòn, rửa trôi mạnh; mưa lớn trên sườn đón gió cuốn trôi vật chất → tầng đất mỏng, nghèo dinh dưỡng. Đây là tác động tổng hợp của địa hình và khí hậu."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phong hóa là quá trình phá hủy đá, tạo vật chất vô cơ cho đất.", "b) Tầng B nằm giữa tầng A và tầng C.", "c) Đất đỏ ba dan ở Tây Nguyên thích hợp trồng cà phê, cao su.", "d) Mọi tầng đất đều giàu mùn như nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: phong hóa tạo vật chất vụn bở. b) Đúng: thứ tự A – B – C – D. c) Đúng: đất đỏ ba dan tơi xốp, giàu dinh dưỡng. d) Sai: chỉ tầng A giàu mùn; các tầng dưới nghèo mùn dần."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về mối quan hệ giữa các nhân tố:", "statements": ["a) Các nhân tố hình thành đất tác động tổng hợp, không tách rời nhau.", "b) Cùng một loại đá mẹ nhưng khí hậu khác nhau có thể tạo ra loại đất khác nhau.", "c) Con người có thể làm thay đổi tính chất của đất trong thời gian ngắn.", "d) Địa hình chỉ ảnh hưởng đến độ dày của đất, không ảnh hưởng đến độ phì."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: đất là sản phẩm tác động tổng hợp của 6 nhân tố. b) Đúng: ví dụ cùng đá granit nhưng nóng ẩm cho feralit, lạnh khô cho đất khác. c) Đúng: bón phân, cải tạo làm thay đổi nhanh tính chất đất. d) Sai: địa hình còn ảnh hưởng đến độ ẩm, dinh dưỡng (bồi tụ/xói mòn) nên ảnh hưởng cả độ phì."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Thành phần nào của đất gồm cát, limon, sét và chiếm khoảng 45% thể tích đất?", "answer": "chất khoáng", "explain": "Chất khoáng (cát, limon, sét) có nguồn gốc từ đá mẹ, chiếm khoảng 45% thể tích đất."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Trong 6 nhân tố hình thành đất, nhân tố nào là nguồn gốc cung cấp vật chất vô cơ, quyết định thành phần cơ giới của đất?", "answer": "đá mẹ", "explain": "Đá mẹ cung cấp vật chất vô cơ, quyết định thành phần khoáng vật và tỉ lệ cát, limon, sét của đất."}
]},
{"name": "Đề 8", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Lớp vật chất tơi xốp ở bề mặt lục địa có khả năng nuôi dưỡng cây trồng được gọi là", "options": ["A. đá mẹ.", "B. đất.", "C. phù sa.", "D. mùn."], "answer": "B", "explain": "Đất là lớp vật chất tơi xốp ở bề mặt lục địa, đặc trưng bởi độ phì, nuôi dưỡng cây trồng."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Nhân tố nào quyết định lượng mùn trong đất?", "options": ["A. Đá mẹ", "B. Sinh vật (thảm thực vật)", "C. Thời gian", "D. Địa hình"], "answer": "B", "explain": "Thảm thực vật cung cấp tàn dư hữu cơ; loại thực vật và lượng tàn dư quyết định lượng mùn tích lũy trong đất."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao không nên đốt nương làm rẫy bừa bãi ở vùng đồi núi?", "options": ["A. Vì làm mất lớp phủ thực vật, đất bị xói mòn, rửa trôi, bạc màu nhanh chóng.", "B. Vì làm đất thêm màu mỡ.", "C. Vì làm tăng lượng mùn trong đất.", "D. Vì làm địa hình bằng phẳng hơn."], "answer": "A", "explain": "Đốt nương phá lớp phủ, đất trơ ra trước mưa nắng nhiệt đới → xói mòn, rửa trôi mạnh, mất mùn, đất bạc màu, thoái hóa nhanh."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Quan sát phẫu diện đất ở hai điểm: điểm X (đỉnh đồi) tầng đất mỏng 20 cm, điểm Y (chân đồi) tầng đất dày 80 cm. Kết luận nào phù hợp nhất?", "options": ["A. Điểm X có đá mẹ tốt hơn điểm Y.", "B. Vật chất từ đỉnh đồi bị xói mòn đưa xuống bồi tụ ở chân đồi.", "C. Điểm Y có khí hậu lạnh hơn điểm X.", "D. Con người chỉ cải tạo đất ở chân đồi."], "answer": "B", "explain": "Địa hình chi phối sự phân bố lại vật chất: đỉnh đồi bị xói mòn (đất mỏng), chân đồi nhận bồi tụ (đất dày)."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Đất phù sa thích hợp nhất với loại cây trồng nào?", "options": ["A. Cà phê, cao su", "B. Lúa nước", "C. Thông, keo lá tràm", "D. Xương rồng"], "answer": "B", "explain": "Đất phù sa ở đồng bằng châu thổ màu mỡ, đủ nước, bằng phẳng — điều kiện lí tưởng cho lúa nước."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một vùng có lượng mưa rất lớn (trên 2500 mm/năm) nhưng đất vẫn nghèo dinh dưỡng. Lời giải thích khoa học nhất là", "options": ["A. mưa lớn rửa trôi các chất dinh dưỡng dễ hòa tan xuống tầng sâu.", "B. mưa lớn làm tăng lượng mùn.", "C. mưa lớn giúp đất tơi xốp hơn.", "D. mưa không ảnh hưởng gì đến đất."], "answer": "A", "explain": "Mưa quá nhiều gây rửa trôi mạnh (lateral hóa): các chất bazơ, dinh dưỡng dễ hòa tan bị cuốn xuống sâu hoặc ra sông, chỉ còn lại oxit sắt nhôm khó hòa tan → đất chua, nghèo."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đất là tư liệu sản xuất đặc biệt của nông nghiệp.", "b) Độ phì của đất phụ thuộc chủ yếu vào hàm lượng mùn.", "c) Đất pốt dôn thích hợp nhất để trồng lúa nước.", "d) Bảo vệ rừng đầu nguồn góp phần bảo vệ đất."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: không có đất không thể trồng trọt. b) Đúng: mùn quyết định độ phì. c) Sai: đất pốt dôn nghèo dinh dưỡng, không thích hợp trồng lúa; đất phù sa mới thích hợp. d) Đúng: rừng giữ đất, chống xói mòn."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về đất ở các đới khí hậu:", "statements": ["a) Đới lạnh: đất pốt dôn nghèo dinh dưỡng dưới rừng lá kim.", "b) Đới ôn hòa: đất đen thảo nguyên giàu mùn dưới đồng cỏ.", "c) Đới nóng ẩm: đất đỏ vàng (feralit) giàu oxit sắt, nhôm.", "d) Hoang mạc: đất giàu mùn do ít bị rửa trôi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo quy luật phân bố đất theo đới khí hậu. d) Sai: hoang mạc ít mưa nhưng thực vật thưa thớt nên đất nghèo mùn, khô cằn."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Tỉ lệ các hạt cát, limon, sét trong đất được gọi là thành phần gì của đất?", "answer": "cơ giới", "explain": "Thành phần cơ giới là tỉ lệ cát, limon, sét, quyết định độ tơi xốp của đất."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Hiện tượng đất bị mất lớp phủ thực vật rồi bị nước mưa cuốn trôi lớp đất mặt, làm đất bạc màu được gọi là gì?", "answer": "xói mòn", "explain": "Xói mòn đất là quá trình nước (hoặc gió) cuốn trôi lớp đất mặt, gây thoái hóa đất, đặc biệt nghiêm trọng ở vùng đồi núi mất rừng."}
]},
{"name": "Đề 9", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Trong các nhân tố sau, nhân tố nào thuộc nhóm nhân tố tự nhiên hình thành đất?", "options": ["A. Đá mẹ, khí hậu, sinh vật, địa hình, thời gian", "B. Vốn, lao động, thị trường", "C. Chính sách, khoa học công nghệ", "D. Phân bón, thuốc trừ sâu"], "answer": "A", "explain": "5 nhân tố tự nhiên: đá mẹ, khí hậu, sinh vật, địa hình, thời gian; nhân tố thứ 6 là con người."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đất đỏ vàng (feralit) có màu đỏ vàng chủ yếu do", "options": ["A. giàu mùn.", "B. tích tụ oxit sắt, nhôm.", "C. nhiều cát trắng.", "D. nhiễm mặn."], "answer": "B", "explain": "Quá trình feralit hóa tích tụ oxit sắt (màu đỏ) và oxit nhôm trong đất, tạo màu đỏ vàng đặc trưng."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Tại sao nói “bảo vệ rừng là bảo vệ đất”?", "options": ["A. Vì rừng làm tăng lượng mưa.", "B. Vì tán rừng che chắn, rễ cây giữ đất, tàn dư bổ sung mùn, hạn chế xói mòn.", "C. Vì rừng làm đất thêm chua.", "D. Vì rừng hút hết nước trong đất."], "answer": "B", "explain": "Rừng bảo vệ đất toàn diện: tán giảm xói mòn do mưa, rễ giữ đất chống sạt lở, tàn dư lá rễ bổ sung mùn."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Ở vùng núi đá vôi, người ta thường thấy đất mỏng, nhiều hốc đá tai mèo, canh tác khó khăn. Nguyên nhân sâu xa liên quan đến cặp nhân tố nào?", "options": ["A. Đá mẹ (đá vôi dễ bị hòa tan, rửa trôi) và địa hình (dốc, thoát nước nhanh).", "B. Khí hậu lạnh và thời gian ngắn.", "C. Thiếu con người tác động.", "D. Sinh vật quá phong phú."], "answer": "A", "explain": "Đá vôi bị nước mưa (có a-xít) hòa tan, rửa trôi theo khe nứt; địa hình dốc thoát nước nhanh, vật chất khó tích lũy → đất mỏng, trơ đá."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Biện pháp “cày nông, bừa kĩ” và “làm đất theo đường đồng mức” nhằm mục đích gì?", "options": ["A. Làm đất thêm dốc.", "B. Hạn chế xói mòn, giữ nước và dinh dưỡng trong đất.", "C. Làm đất nhanh bạc màu.", "D. Tăng tốc độ rửa trôi."], "answer": "B", "explain": "Canh tác theo đường đồng mức tạo các “bậc” giữ nước, giảm dòng chảy mặt; cày nông bừa kĩ giữ cấu tượng đất, hạn chế xói mòn."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Sắp xếp nào sau đây đúng theo thứ tự độ phì tự nhiên GIẢM DẦN của các loại đất?", "options": ["A. Đất đen thảo nguyên – đất phù sa – đất đỏ vàng – đất xám hoang mạc.", "B. Đất xám hoang mạc – đất đỏ vàng – đất phù sa – đất đen.", "C. Đất pốt dôn – đất đen – đất phù sa – đất xám hoang mạc.", "D. Đất đỏ vàng – đất đen – đất pốt dôn – đất phù sa."], "answer": "A", "explain": "Đất đen giàu mùn nhất; đất phù sa màu mỡ do bồi đắp; đất đỏ vàng nghèo hơn do rửa trôi; đất xám hoang mạc nghèo nhất do khô hạn, ít hữu cơ."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đất feralit thích hợp trồng cây công nghiệp lâu năm như cà phê, cao su, chè.", "b) Đất phù sa thích hợp trồng lúa nước.", "c) Đất đen thảo nguyên thích hợp trồng cây lương thực, cây công nghiệp ngắn ngày.", "d) Đất xám hoang mạc thích hợp trồng lúa nước."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: cây công nghiệp lâu năm ưa đất đỏ vàng đồi núi. b) Đúng. c) Đúng: đất đen là đất nông nghiệp tốt nhất. d) Sai: đất xám hoang mạc khô cằn, nghèo dinh dưỡng, không trồng được lúa nước."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về sử dụng đất hợp lí:", "statements": ["a) Nên bố trí cây trồng phù hợp với từng loại đất.", "b) Đất dốc nên trồng cây lâu năm, cây ăn quả thay vì trồng màu ngắn ngày bừa bãi.", "c) Có thể khai thác đất kiệt quệ vì đất tái tạo rất nhanh.", "d) Kết hợp nông – lâm trên đất đồi núi vừa bảo vệ đất vừa tăng thu nhập."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: phù hợp đất – cây cho năng suất cao, bền vững. b) Đúng: cây lâu năm giữ đất tốt hơn cây ngắn ngày trên đất dốc. c) Sai: đất hình thành rất chậm, khai thác kiệt quệ gây thoái hóa khó phục hồi. d) Đúng: mô hình nông lâm kết hợp là hướng sử dụng đất đồi núi bền vững."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Loại đất giàu oxit sắt, nhôm, có màu đỏ vàng, phân bố chủ yếu ở vùng nhiệt đới ẩm được gọi là đất gì?", "answer": "feralit", "explain": "Đất đỏ vàng (feralit): giàu oxit sắt, nhôm, chua, phân bố ở vùng nhiệt đới ẩm."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Quá trình nước mưa cuốn trôi lớp đất mặt ở nơi mất lớp phủ thực vật, gây bạc màu đất, được gọi là hiện tượng gì? (2 từ)", "answer": "xói mòn đất", "explain": "Xói mòn đất làm mất lớp đất mặt màu mỡ, gây thoái hóa đất nghiêm trọng."}
]},
{"name": "Đề 10", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Yếu tố nào sau đây KHÔNG phải là thành phần của đất?", "options": ["A. Chất khoáng", "B. Chất hữu cơ", "C. Sinh vật phù du", "D. Nước"], "answer": "C", "explain": "4 thành phần của đất: chất khoáng, chất hữu cơ, nước, không khí. Sinh vật phù du sống trong nước, không phải thành phần của đất."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Tầng đất nào được hình thành từ đá gốc bị phong hóa dở dang?", "options": ["A. Tầng A", "B. Tầng B", "C. Tầng C", "D. Tầng D"], "answer": "C", "explain": "Tầng C là đá mẹ đang phong hóa dở dang, nằm trên tầng đá gốc D."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Khí hậu ảnh hưởng đến đất thông qua các yếu tố nào?", "options": ["A. Nhiệt độ và lượng mưa.", "B. Độ cao và độ dốc.", "C. Loại đá mẹ.", "D. Mật độ dân số."], "answer": "A", "explain": "Nhiệt độ và lượng mưa (chế độ nhiệt, ẩm) chi phối tốc độ phong hóa đá, quá trình phân giải và tích lũy chất hữu cơ trong đất."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một vùng đất ven biển bị nhiễm mặn, cây trồng còi cọc. Biện pháp cải tạo phù hợp nhất là", "options": ["A. bón thêm đạm để cây xanh tốt.", "B. thau chua, rửa mặn bằng nước ngọt kết hợp trồng cây chịu mặn, xây dựng đê bao ngăn mặn.", "C. cày sâu để đưa muối lên mặt.", "D. bỏ hoang đất."], "answer": "B", "explain": "Đất mặn cần rửa mặn bằng nước ngọt; đê bao ngăn nước mặn xâm nhập; trồng cây chịu mặn từng bước cải tạo."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Điểm giống nhau cơ bản giữa đất pốt dôn và đất xám hoang mạc là", "options": ["A. đều giàu mùn.", "B. đều nghèo dinh dưỡng, kém thuận lợi cho nông nghiệp.", "C. đều được bồi đắp phù sa.", "D. đều phân bố ở vùng nhiệt đới ẩm."], "answer": "B", "explain": "Cả hai đều nghèo dinh dưỡng: pốt dôn do rửa trôi và ít mùn; đất xám hoang mạc do khô hạn, ít hữu cơ."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho bảng số liệu (tỉ lệ % thể tích) của hai mẫu đất mặt: Mẫu X: khoáng 45, hữu cơ 8, nước 22, không khí 25. Mẫu Y: khoáng 45, hữu cơ 2, nước 28, không khí 25. Nhận xét nào đúng?", "options": ["A. Mẫu X có độ phì cao hơn mẫu Y vì hàm lượng chất hữu cơ cao hơn.", "B. Mẫu Y tốt hơn vì nhiều nước hơn.", "C. Hai mẫu có độ phì như nhau.", "D. Không thể so sánh."], "answer": "A", "explain": "Chất hữu cơ (mùn) quyết định độ phì; mẫu X có 8% hữu cơ, gấp 4 lần mẫu Y (2%) nên độ phì cao hơn dù các thành phần khác tương đương."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tầng A nằm trên cùng và giàu mùn nhất.", "b) Tầng D là đá gốc cứng chưa bị phong hóa.", "c) Giữa tầng A và tầng C không có tầng nào khác.", "d) Độ dày các tầng đất giống nhau ở mọi nơi."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng. b) Đúng. c) Sai: giữa A và C còn tầng B (tầng tích tụ). d) Sai: độ dày thay đổi theo địa hình, khí hậu, mức độ xói mòn."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về vai trò của đất:", "statements": ["a) Đất là nơi cư trú của nhiều loài sinh vật.", "b) Đất là tư liệu sản xuất không thể thay thế của nông nghiệp.", "c) Đất chỉ có vai trò với trồng trọt, không liên quan đến chăn nuôi.", "d) Ô nhiễm đất ảnh hưởng đến sức khỏe con người qua chuỗi thức ăn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đất là môi trường sống của vi sinh vật, côn trùng... b) Đúng. c) Sai: đất trồng cỏ, cây thức ăn phục vụ chăn nuôi. d) Đúng: chất ô nhiễm tích lũy qua cây trồng, vật nuôi vào cơ thể người."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Loại đất rất giàu mùn, tơi xốp, hình thành dưới đồng cỏ ôn đới, được mệnh danh là đất nông nghiệp tốt nhất thế giới có tên là đất gì?", "answer": "đất đen", "explain": "Đất đen thảo nguyên: giàu mùn nhất, tơi xốp, thích hợp nhất cho nông nghiệp."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Có 4 thành phần của đất: chất khoáng, chất hữu cơ, nước và thành phần nào nữa?", "answer": "không khí", "explain": "4 thành phần: chất khoáng (45%), chất hữu cơ (5%), nước (20–30%), không khí (20–30%)."}
]}
