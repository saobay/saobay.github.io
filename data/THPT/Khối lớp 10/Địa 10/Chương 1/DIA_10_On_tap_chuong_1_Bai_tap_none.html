{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các phương pháp biểu hiện trên bản đồ, phương pháp nào dùng kí hiệu đặt đúng vị trí đối tượng phân bố?", "options": ["A. Phương pháp kí hiệu.", "B. Phương pháp chấm điểm.", "C. Phương pháp khoanh vùng.", "D. Phương pháp đường chuyển động."], "answer": "A", "explain": "Phương pháp kí hiệu đặt các dạng kí hiệu chính xác vào vị trí mà đối tượng phân bố.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bản đồ tỉ lệ 1 : 1 000 000 thì 2 cm trên bản đồ tương ứng bao nhiêu km ngoài thực địa?", "options": ["A. 2 km.", "B. 20 km.", "C. 200 km.", "D. 2 000 km."], "answer": "B", "explain": "2 × 1 000 000 = 2 000 000 cm = 20 km.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Muốn thể hiện hướng di chuyển của các dòng hải lưu trên bản đồ thế giới, phương pháp thích hợp là:", "options": ["A. Kí hiệu.", "B. Đường chuyển động.", "C. Chấm điểm.", "D. Khoanh vùng."], "answer": "B", "explain": "Dòng hải lưu là sự di chuyển của nước biển nên dùng phương pháp đường chuyển động với các mũi tên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bản đồ thể hiện cơ cấu kinh tế của các vùng bằng biểu đồ tròn đặt trong phạm vi từng vùng. Phương pháp này cho biết:", "options": ["A. Vị trí chính xác từng cơ sở kinh tế.", "B. Giá trị tổng cộng và cơ cấu của đối tượng theo từng lãnh thổ.", "C. Hướng di chuyển của hàng hóa.", "D. Mật độ phân bố dân cư."], "answer": "B", "explain": "Đó là phương pháp bản đồ – biểu đồ, thể hiện giá trị tổng cộng (và cơ cấu) của đối tượng theo từng đơn vị lãnh thổ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trên bản đồ phân bố dân cư, người ta quy ước 1 chấm = 8 000 người. Một khu vực có 12 chấm thì dân số khoảng:", "options": ["A. 9 600 người.", "B. 96 000 người.", "C. 960 000 người.", "D. 8 012 người."], "answer": "B", "explain": "12 × 8 000 = 96 000 người.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để thể hiện 'vùng đồng bằng châu thổ' trên bản đồ tự nhiên Việt Nam, đồng thời thể hiện 'hướng chảy của các sông chính', cần kết hợp:", "options": ["A. Khoanh vùng và đường chuyển động.", "B. Chấm điểm và kí hiệu.", "C. Bản đồ – biểu đồ và khoanh vùng.", "D. Kí hiệu và chấm điểm."], "answer": "A", "explain": "Vùng đồng bằng châu thổ phân bố theo vùng nên khoanh vùng; hướng chảy của sông là sự di chuyển nên đường chuyển động.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phương pháp kí hiệu thể hiện đối tượng phân bố theo điểm cụ thể.", "b) Tỉ lệ 1 : 200 000 nghĩa là 1 cm trên bản đồ ứng với 2 km thực địa.", "c) GPS gồm 24 vệ tinh.", "d) Bản đồ số không cập nhật được thông tin."], "answer": ["T", "T", "T", "F"], "explain": "a, c đúng; b đúng (200 000 cm = 2 km); d sai (bản đồ số cập nhật nhanh).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mũi tên càng rộng thì quy mô luồng di chuyển càng lớn.", "b) Phương pháp khoanh vùng thể hiện được hướng di chuyển.", "c) Đọc bản đồ cần kết hợp bảng chú giải và tỉ lệ.", "d) GPS cần ít nhất 3 vệ tinh để xác định vị trí."], "answer": ["T", "F", "T", "T"], "explain": "a đúng; b sai; c, d đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Bản đồ tỉ lệ 1 : 500 000, đoạn đường 11 cm trên bản đồ dài bao nhiêu km thực tế?", "answer": "55", "explain": "11 × 500 000 = 5 500 000 cm = 55 km.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết tên phương pháp biểu hiện đối tượng 'phân bố theo vùng nhưng không đều khắp trên lãnh thổ'.", "answer": "Phương pháp khoanh vùng", "explain": "Đó là đối tượng đặc trưng của phương pháp khoanh vùng.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Yếu tố nào trên bản đồ giúp xác định phương hướng?", "options": ["A. Kim chỉ Bắc.", "B. Bảng chú giải.", "C. Tên bản đồ.", "D. Khung bản đồ."], "answer": "A", "explain": "Kim chỉ Bắc (mũi tên chỉ hướng Bắc) hoặc hệ thống kinh tuyến, vĩ tuyến giúp xác định phương hướng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mỗi chấm điểm trên bản đồ phân bố đàn gia cầm tương ứng với 500 con. Nơi có 14 chấm thì có khoảng bao nhiêu con?", "options": ["A. 700 con.", "B. 7 000 con.", "C. 70 000 con.", "D. 514 con."], "answer": "B", "explain": "14 × 500 = 7 000 con.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bản đồ các tuyến đường bay quốc tế dùng các đường cong có mũi tên nối các sân bay. Phương pháp này thể hiện:", "options": ["A. Vị trí các sân bay.", "B. Sự di chuyển của các chuyến bay giữa các sân bay.", "C. Số lượng hành khách.", "D. Giá vé máy bay."], "answer": "B", "explain": "Đường cong có mũi tên nối các điểm thể hiện sự di chuyển — phương pháp đường chuyển động.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao khi thể hiện vùng trồng cây công nghiệp lâu năm, người ta thường dùng khoanh vùng thay vì chấm điểm?", "options": ["A. Vì cây công nghiệp di chuyển.", "B. Vì cần thể hiện phạm vi vùng phân bố (ranh giới vùng) hơn là số lượng từng cá thể.", "C. Vì khoanh vùng chính xác đến từng cây.", "D. Vì chấm điểm không dùng được cho cây trồng."], "answer": "B", "explain": "Vùng trồng cây công nghiệp là đối tượng phân bố theo vùng; khoanh vùng thể hiện rõ phạm vi, ranh giới vùng phân bố.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một học sinh đếm được trên bản đồ phân bố dân cư có 30 chấm ở đồng bằng và 6 chấm ở miền núi (quy ước 1 chấm = 10 000 người). Nhận xét đúng là:", "options": ["A. Dân số miền núi đông hơn đồng bằng.", "B. Dân số đồng bằng khoảng 300 000 người, gấp 5 lần miền núi (60 000 người).", "C. Hai vùng dân số bằng nhau.", "D. Không thể so sánh."], "answer": "B", "explain": "Đồng bằng: 30 × 10 000 = 300 000 người; miền núi: 6 × 10 000 = 60 000 người; tỉ lệ 5 lần.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Bản đồ A dùng kí hiệu ngôi sao cho thủ đô, bản đồ B dùng biểu đồ cột thể hiện dân số các nước. Điểm chung và điểm khác của hai phương pháp là:", "options": ["A. Chung: đều dùng hình vẽ; khác: A thể hiện đối tượng tại điểm cụ thể, B thể hiện giá trị tổng theo lãnh thổ.", "B. Hai bản đồ giống nhau hoàn toàn.", "C. Chung: đều thể hiện hướng di chuyển.", "D. Khác: A dùng màu, B không dùng màu."], "answer": "A", "explain": "Cả hai đều dùng hình vẽ trực quan; nhưng kí hiệu (A) gắn với điểm cụ thể, còn bản đồ – biểu đồ (B) gắn với giá trị tổng theo đơn vị lãnh thổ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phương pháp đường chuyển động dùng các mũi tên.", "b) Phương pháp bản đồ – biểu đồ đặt biểu đồ trong đơn vị lãnh thổ.", "c) Tỉ lệ càng lớn thì bản đồ càng chi tiết.", "d) GPS xác định vị trí nhờ các vệ tinh."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng theo nội dung chương 1.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kích thước kí hiệu thể hiện quy mô của đối tượng.", "b) Phương pháp chấm điểm cho biết chính xác số lượng tại từng điểm.", "c) Bản đồ số kết hợp GPS có thể dẫn đường trực tiếp.", "d) Vùng phân bố rừng ngập mặn nên thể hiện bằng khoanh vùng."], "answer": ["T", "F", "T", "T"], "explain": "a đúng; b sai (chấm điểm cho số lượng tương đối); c, d đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Tỉ lệ 1 : 25 000, một khu đất dài 7 cm trên bản đồ thì thực tế dài bao nhiêu mét?", "answer": "1750", "explain": "7 × 25 000 = 175 000 cm = 1 750 m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết tên hệ thống định vị vệ tinh của châu Âu.", "answer": "Galileo", "explain": "Galileo là hệ thống định vị vệ tinh của châu Âu.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Đối tượng nào sau đây phù hợp thể hiện bằng phương pháp kí hiệu?", "options": ["A. Các trung tâm công nghiệp.", "B. Luồng gió mùa.", "C. Vùng phân bố đất feralit.", "D. Mật độ dân số các tỉnh."], "answer": "A", "explain": "Trung tâm công nghiệp là đối tượng phân bố theo điểm cụ thể nên dùng phương pháp kí hiệu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trên bản đồ tỉ lệ 1 : 2 000 000, 1 cm tương ứng bao nhiêu km thực địa?", "options": ["A. 2 km.", "B. 20 km.", "C. 200 km.", "D. 2 000 km."], "answer": "B", "explain": "2 000 000 cm = 20 km.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bản đồ thể hiện sản lượng thủy sản khai thác của các tỉnh ven biển bằng biểu đồ cột. Hạn chế của cách thể hiện này là gì?", "options": ["A. Không thể hiện được vị trí chính xác của từng tàu cá.", "B. Không thể hiện được tổng sản lượng.", "C. Không so sánh được giữa các tỉnh.", "D. Không thể hiện được tên tỉnh."], "answer": "A", "explain": "Bản đồ – biểu đồ thể hiện giá trị tổng theo lãnh thổ, không thể hiện vị trí chính xác của từng đối tượng cụ thể (từng tàu cá).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi quan sát bản đồ gió trên thế giới, thấy các mũi tên từ áp cao chí tuyến thổi về áp thấp xích đạo. Đây là loại gió nào và phương pháp thể hiện là gì?", "options": ["A. Gió Tây ôn đới, phương pháp kí hiệu.", "B. Gió Mậu dịch (Tín phong), phương pháp đường chuyển động.", "C. Gió mùa, phương pháp chấm điểm.", "D. Gió địa phương, phương pháp khoanh vùng."], "answer": "B", "explain": "Gió thổi từ chí tuyến về xích đạo là gió Mậu dịch (Tín phong); hướng gió được thể hiện bằng mũi tên — đường chuyển động.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một tỉnh có diện tích rừng được thể hiện bằng 22 chấm (1 chấm = 2 000 ha). Sau 5 năm, số chấm giảm còn 17. Diện tích rừng đã mất khoảng:", "options": ["A. 5 ha.", "B. 1 000 ha.", "C. 10 000 ha.", "D. 5 000 ha."], "answer": "C", "explain": "Số chấm giảm: 22 − 17 = 5 chấm; diện tích mất = 5 × 2 000 = 10 000 ha.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một bản đồ chuyên đề thể hiện đồng thời: các mỏ khoáng sản (kí hiệu), trữ lượng theo tỉnh (biểu đồ), luồng vận chuyển quặng (mũi tên). Nhận xét đúng về bản đồ này:", "options": ["A. Bản đồ sai vì chỉ được dùng một phương pháp.", "B. Bản đồ kết hợp hợp lí 3 phương pháp: kí hiệu, bản đồ – biểu đồ, đường chuyển động để thể hiện nhiều nội dung liên quan.", "C. Bản đồ thừa phương pháp, nên bỏ bớt.", "D. Không thể đọc được bản đồ này."], "answer": "B", "explain": "Kết hợp nhiều phương pháp trên cùng bản đồ là bình thường và hiệu quả khi các nội dung có bản chất khác nhau (điểm, giá trị tổng, luồng di chuyển).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vùng trồng lúa phân bố theo vùng nên dùng khoanh vùng.", "b) 1 cm trên bản đồ 1 : 500 000 ứng với 5 km thực địa.", "c) Máy thu GPS cần ít nhất 2 vệ tinh để định vị.", "d) Bản đồ số hiển thị trên thiết bị điện tử."], "answer": ["T", "T", "F", "T"], "explain": "a đúng; b đúng (500 000 cm = 5 km); c sai (cần ít nhất 3); d đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hình dạng kí hiệu phân biệt được loại đối tượng.", "b) Độ rộng mũi tên thể hiện quy mô luồng di chuyển.", "c) Phương pháp chấm điểm thể hiện được chất lượng đối tượng.", "d) GLONASS là hệ thống định vị của Nga."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng; c sai (chấm điểm chủ yếu thể hiện số lượng).", "points": 1}, {"type": "short", "level": "VD", "q": "Tỉ lệ 1 : 100 000, quãng đường 4,5 cm trên bản đồ tương ứng bao nhiêu km thực tế?", "answer": "4.5", "explain": "4,5 × 100 000 = 450 000 cm = 4,5 km.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết tên phương pháp có hình thức 'các mũi tên với màu sắc, độ rộng và hướng khác nhau'.", "answer": "Phương pháp đường chuyển động", "explain": "Đó là hình thức đặc trưng của phương pháp đường chuyển động.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Bảng chú giải trên bản đồ dùng để làm gì?", "options": ["A. Giải thích ý nghĩa các kí hiệu.", "B. Ghi tên tác giả bản đồ.", "C. Tính tỉ lệ bản đồ.", "D. Xác định hướng Bắc."], "answer": "A", "explain": "Bảng chú giải giải thích ý nghĩa của các kí hiệu sử dụng trên bản đồ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hệ thống định vị toàn cầu GPS do nước nào xây dựng?", "options": ["A. Hoa Kỳ.", "B. Nga.", "C. Trung Quốc.", "D. Nhật Bản."], "answer": "A", "explain": "GPS do Hoa Kỳ xây dựng và vận hành.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên bản đồ hành chính, ranh giới tỉnh được vẽ bằng đường nét đứt màu đỏ. Đây là vận dụng của phương pháp nào?", "options": ["A. Kí hiệu.", "B. Khoanh vùng (đường nét đứt bao quanh vùng lãnh thổ).", "C. Chấm điểm.", "D. Đường chuyển động."], "answer": "B", "explain": "Đường nét đứt bao quanh phạm vi lãnh thổ tỉnh là hình thức của phương pháp khoanh vùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bản đồ dùng màu xanh đậm nhạt để thể hiện lượng mưa các vùng (càng đậm càng nhiều mưa). Cách thể hiện này thuộc phương pháp nào?", "options": ["A. Kí hiệu.", "B. Khoanh vùng.", "C. Chấm điểm.", "D. Đường chuyển động."], "answer": "B", "explain": "Tô màu đậm nhạt theo vùng để phân biệt mức độ của hiện tượng là hình thức khoanh vùng theo vùng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đoạn đường trên bản đồ tỉ lệ 1 : 1 000 000 dài 13,5 cm. Một ô tô đi với vận tốc 54 km/h thì đi hết bao lâu?", "options": ["A. 2 giờ.", "B. 2,5 giờ.", "C. 3 giờ.", "D. 1,5 giờ."], "answer": "B", "explain": "Quãng đường = 13,5 × 1 000 000 = 13 500 000 cm = 135 km. Thời gian = 135 : 54 = 2,5 giờ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao cùng một hiện tượng (phân bố dân cư) có thể vừa thể hiện bằng chấm điểm, vừa thể hiện bằng khoanh vùng?", "options": ["A. Vì hai phương pháp giống nhau.", "B. Vì tùy mục đích: chấm điểm nhấn mạnh số lượng và sự phân bố tương đối, khoanh vùng nhấn mạnh mức độ tập trung theo vùng.", "C. Vì SGK quy định như vậy.", "D. Vì không có phương pháp nào phù hợp."], "answer": "B", "explain": "Mỗi phương pháp nhấn mạnh một khía cạnh khác nhau của cùng hiện tượng; người lập bản đồ chọn phương pháp theo mục đích thể hiện.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phương pháp kí hiệu đặt kí hiệu đúng vị trí đối tượng.", "b) Phương pháp chấm điểm mỗi chấm ứng với một số lượng nhất định.", "c) Tỉ lệ 1 : 50 000 chi tiết hơn tỉ lệ 1 : 500 000.", "d) Bản đồ số không thể phóng to."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng; d sai (bản đồ số phóng to, thu nhỏ dễ dàng).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vệ tinh GPS phát tín hiệu vô tuyến.", "b) Bản đồ số kết hợp GPS dẫn đường trực tiếp được.", "c) Muốn so sánh giá trị tổng theo tỉnh nên dùng bản đồ – biểu đồ.", "d) Phương pháp đường chuyển động thể hiện được ranh giới vùng."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng; d sai (ranh giới vùng là của khoanh vùng).", "points": 1}, {"type": "short", "level": "VD", "q": "1 chấm = 3 000 tấn thóc. Một xã có 9 chấm thì sản lượng khoảng bao nhiêu tấn?", "answer": "27000", "explain": "9 × 3 000 = 27 000 tấn.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết tên đầy đủ tiếng Anh của GPS.", "answer": "Global Positioning System", "explain": "GPS = Global Positioning System (hệ thống định vị toàn cầu).", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Phương pháp nào thể hiện sự dịch chuyển của bão trên bản đồ khí tượng?", "options": ["A. Phương pháp kí hiệu.", "B. Phương pháp đường chuyển động.", "C. Phương pháp chấm điểm.", "D. Phương pháp khoanh vùng."], "answer": "B", "explain": "Đường đi của bão là sự di chuyển nên dùng phương pháp đường chuyển động (mũi tên).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "1 cm trên bản đồ tỉ lệ 1 : 10 000 tương ứng bao nhiêu mét thực địa?", "options": ["A. 10 m.", "B. 100 m.", "C. 1 000 m.", "D. 10 000 m."], "answer": "B", "explain": "10 000 cm = 100 m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên bản đồ thế giới, vành đai động đất quanh Thái Bình Dương được vẽ bằng đường bao màu đỏ. Phương pháp và ý nghĩa là:", "options": ["A. Khoanh vùng; cho biết phạm vi phân bố của vành đai động đất.", "B. Kí hiệu; cho biết vị trí từng trận động đất.", "C. Chấm điểm; cho biết số trận động đất.", "D. Đường chuyển động; cho biết hướng động đất."], "answer": "A", "explain": "Đường bao quanh vùng là khoanh vùng; cho biết phạm vi phân bố của vành đai (không cho vị trí từng trận hay số lượng).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bản đồ thể hiện nhiệt độ trung bình năm tại các trạm khí tượng bằng các con số đặt tại vị trí trạm. Đây là phương pháp nào?", "options": ["A. Kí hiệu (số liệu đặt đúng vị trí điểm trạm).", "B. Chấm điểm.", "C. Khoanh vùng.", "D. Bản đồ – biểu đồ."], "answer": "A", "explain": "Trạm khí tượng là điểm cụ thể; con số là dạng kí hiệu (kí hiệu chữ/số) đặt đúng vị trí trạm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bản đồ quy hoạch sử dụng đất của một huyện thể hiện: đất ở (màu hồng), đất nông nghiệp (màu vàng), đất rừng (màu xanh). Phương pháp này là:", "options": ["A. Khoanh vùng bằng màu sắc theo loại đất.", "B. Chấm điểm.", "C. Đường chuyển động.", "D. Bản đồ – biểu đồ."], "answer": "A", "explain": "Phân loại đất theo vùng bằng màu sắc là hình thức khoanh vùng (phân bố theo vùng, mỗi vùng một loại đất).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một nhà báo muốn minh họa bài viết về 'luồng lao động từ nông thôn ra thành phố'. Hình thức trực quan phù hợp nhất trên bản đồ là:", "options": ["A. Các mũi tên từ nông thôn hướng về thành phố, độ rộng tỉ lệ với số lao động.", "B. Chấm điểm rải khắp nông thôn.", "C. Biểu đồ tròn ở mỗi thành phố.", "D. Tô màu các tỉnh."], "answer": "A", "explain": "Luồng lao động là sự di chuyển; mũi tên thể hiện hướng, độ rộng thể hiện quy mô — đúng phương pháp đường chuyển động.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Có 5 phương pháp biểu hiện các đối tượng địa lí trên bản đồ.", "b) 1 cm trên bản đồ 1 : 25 000 ứng với 250 m thực địa.", "c) GPS cần ít nhất 4 vệ tinh mới định vị được.", "d) Bản đồ số cập nhật thông tin nhanh."], "answer": ["T", "T", "F", "T"], "explain": "a đúng; b đúng (25 000 cm = 250 m); c sai (cần ít nhất 3; 4 vệ tinh để có cả độ cao); d đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kích thước kí hiệu tỉ lệ với quy mô đối tượng.", "b) Màu sắc mũi tên phân biệt tính chất luồng di chuyển.", "c) Chấm điểm thể hiện được hướng di chuyển.", "d) BeiDou là hệ thống định vị của Trung Quốc."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng; c sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Tỉ lệ 1 : 2 000 000, đoạn thẳng 6,5 cm trên bản đồ dài bao nhiêu km thực tế?", "answer": "130", "explain": "6,5 × 2 000 000 = 13 000 000 cm = 130 km.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết tên phương pháp dùng 'đường nét liền, nét đứt, màu sắc hoặc viết tên đối tượng vào vùng đó'.", "answer": "Phương pháp khoanh vùng", "explain": "Đó là hình thức thể hiện của phương pháp khoanh vùng.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trong học tập, để biết nội dung chính của bản đồ, ta đọc yếu tố nào đầu tiên?", "options": ["A. Tên bản đồ.", "B. Tỉ lệ bản đồ.", "C. Bảng chú giải.", "D. Kim chỉ Bắc."], "answer": "A", "explain": "Tên bản đồ cho biết nội dung chính được thể hiện — là yếu tố đọc đầu tiên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thiết bị thu GPS trên điện thoại xác định vị trí nhờ:", "options": ["A. Sóng wifi duy nhất.", "B. Tín hiệu từ các vệ tinh định vị.", "C. Cảm biến nhiệt độ.", "D. Loa ngoài."], "answer": "B", "explain": "Thiết bị thu GPS xác định vị trí dựa vào tín hiệu từ các vệ tinh định vị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bản đồ phân bố các di sản thế giới ở Việt Nam đánh dấu mỗi di sản bằng một kí hiệu riêng. Thông tin mà bản đồ nhấn mạnh là:", "options": ["A. Số lượng khách tham quan.", "B. Vị trí và loại hình của từng di sản.", "C. Hướng di chuyển của du khách.", "D. Doanh thu du lịch từng tỉnh."], "answer": "B", "explain": "Kí hiệu đặt tại điểm di sản cho biết vị trí chính xác; hình dạng kí hiệu phân biệt loại hình di sản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao bản đồ tỉ lệ lớn (ví dụ 1 : 10 000) thường dùng cho quy hoạch chi tiết một khu vực nhỏ?", "options": ["A. Vì rẻ tiền.", "B. Vì mức độ chi tiết cao, thể hiện rõ từng thửa đất, tuyến đường nhỏ.", "C. Vì dễ gấp gọn.", "D. Vì không cần chú giải."], "answer": "B", "explain": "Tỉ lệ càng lớn (mẫu số càng nhỏ) thì càng chi tiết, phù hợp quy hoạch chi tiết phạm vi nhỏ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một công ty muốn mở chuỗi cửa hàng và cần bản đồ thể hiện mật độ dân cư các quận (để chọn nơi đông dân). Phương pháp phù hợp nhất là:", "options": ["A. Chấm điểm (1 chấm = số dân nhất định) để thấy nơi đông, nơi thưa qua mật độ chấm.", "B. Đường chuyển động.", "C. Kí hiệu cho từng người dân.", "D. Không dùng bản đồ."], "answer": "A", "explain": "Chấm điểm thể hiện trực quan số lượng và sự phân bố dân cư qua mật độ chấm — nơi chấm dày là nơi đông dân.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai bản đồ cùng thể hiện lượng mưa: bản đồ X tô màu đậm nhạt theo vùng, bản đồ Y đặt con số lượng mưa tại các trạm. Nhận xét đúng:", "options": ["A. X dùng khoanh vùng (nhấn mạnh mức độ theo vùng), Y dùng kí hiệu số (nhấn mạnh giá trị chính xác tại điểm trạm).", "B. Hai bản đồ dùng cùng phương pháp.", "C. X chính xác hơn Y.", "D. Y không phải là bản đồ."], "answer": "A", "explain": "X: tô màu theo vùng là khoanh vùng, nhấn mạnh mức độ phân bố theo vùng. Y: số liệu tại điểm trạm là kí hiệu, nhấn mạnh giá trị chính xác từng điểm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phương pháp kí hiệu thể hiện được chất lượng đối tượng qua hình dạng, màu sắc.", "b) 1 cm trên bản đồ 1 : 5 000 ứng với 50 m thực địa.", "c) Bản đồ số hiển thị trên giấy.", "d) GPS ứng dụng trong đo đạc bản đồ."], "answer": ["T", "T", "F", "T"], "explain": "a đúng; b đúng (5 000 cm = 50 m); c sai; d đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đối chiếu nhiều bản đồ giúp rút ra nhận xét địa lí.", "b) Tỉ lệ 1 : 1 000 000 nhỏ hơn tỉ lệ 1 : 100 000.", "c) Khi mất tín hiệu vệ tinh, GPS vẫn định vị chính xác.", "d) Vùng trồng chè phù hợp thể hiện bằng khoanh vùng."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng; c sai.", "points": 1}, {"type": "short", "level": "VD", "q": "1 chấm = 2 500 người, một thị trấn có 16 chấm thì dân số khoảng bao nhiêu người?", "answer": "40000", "explain": "16 × 2 500 = 40 000 người.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một thiết bị chỉ thu được tín hiệu từ đúng 3 vệ tinh GPS. Nó xác định được vị trí trên mặt đất nhưng còn thiếu thông tin gì?", "answer": "Độ cao", "explain": "Với 3 vệ tinh chỉ xác định được vị trí 2 chiều trên mặt đất; cần vệ tinh thứ 4 mới xác định chính xác cả độ cao.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Phương pháp bản đồ – biểu đồ thường được dùng trong loại bản đồ nào?", "options": ["A. Bản đồ kinh tế.", "B. Bản đồ địa hình.", "C. Bản đồ khí hậu.", "D. Bản đồ hành chính."], "answer": "A", "explain": "SGK nêu phương pháp bản đồ – biểu đồ thường dùng trong các bản đồ kinh tế.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khoảng cách thực được tính bằng công thức nào?", "options": ["A. Khoảng cách trên bản đồ × mẫu số tỉ lệ.", "B. Khoảng cách trên bản đồ : mẫu số tỉ lệ.", "C. Mẫu số tỉ lệ − khoảng cách trên bản đồ.", "D. Khoảng cách trên bản đồ + mẫu số tỉ lệ."], "answer": "A", "explain": "Khoảng cách thực = khoảng cách đo trên bản đồ × mẫu số của tỉ lệ bản đồ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên bản đồ du lịch, tuyến tham quan được vẽ bằng đường màu đỏ có mũi tên chỉ hướng đi. Đây là sự kết hợp của:", "options": ["A. Kí hiệu đường và đường chuyển động (hướng tuyến).", "B. Chấm điểm và khoanh vùng.", "C. Bản đồ – biểu đồ.", "D. Chỉ dùng màu sắc."], "answer": "A", "explain": "Đường vẽ tuyến là kí hiệu đường; mũi tên chỉ hướng di chuyển của đoàn tham quan là đường chuyển động.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bản đồ thể hiện các nhà máy thủy điện bằng kí hiệu, kích thước kí hiệu tỉ lệ với công suất. Điều này vận dụng khả năng nào của phương pháp kí hiệu?", "options": ["A. Thể hiện số lượng (quy mô) qua kích thước kí hiệu.", "B. Thể hiện hướng di chuyển.", "C. Thể hiện giá trị tổng theo tỉnh.", "D. Thể hiện vùng phân bố."], "answer": "A", "explain": "Kích thước kí hiệu thể hiện số lượng/quy mô của đối tượng (ở đây là công suất nhà máy).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một huyện muốn vận động người dân trồng rừng. Bản đồ nào sau đây thuyết phục nhất?", "options": ["A. Bản đồ so sánh diện tích rừng của huyện với các huyện khác bằng biểu đồ (thấy huyện mình ít rừng nhất).", "B. Bản đồ thế giới.", "C. Bản đồ các dòng biển.", "D. Bản đồ phân bố dân cư thế giới."], "answer": "A", "explain": "Biểu đồ so sánh trực quan cho thấy huyện có diện tích rừng thấp nhất — có sức thuyết phục để vận động trồng rừng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một học sinh lập luận: 'Vì GPS cho tọa độ chính xác nên không cần học cách xác định vị trí tương đối trên bản đồ giấy'. Em đánh giá thế nào?", "options": ["A. Đúng, GPS thay thế mọi kĩ năng.", "B. Sai, vì kĩ năng xác định vị trí tương đối rèn tư duy không gian và vẫn cần khi không có thiết bị hoặc cần phân tích mối quan hệ vị trí.", "C. Đúng, vì bản đồ giấy đã lỗi thời.", "D. Không có ý kiến."], "answer": "B", "explain": "GPS là công cụ hỗ trợ; kĩ năng đọc, phân tích vị trí trên bản đồ rèn tư duy không gian và cần thiết khi không có thiết bị hoặc khi phân tích địa lí.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đường chuyển động thể hiện sự dịch chuyển bằng mũi tên.", "b) Chấm điểm thể hiện đối tượng phân tán nhỏ lẻ.", "c) 1 cm trên bản đồ 1 : 200 000 ứng với 20 km thực địa.", "d) Bản đồ số không tương tác được."], "answer": ["T", "T", "F", "F"], "explain": "a, b đúng; c sai (200 000 cm = 2 km); d sai (bản đồ số tương tác được).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Khoanh vùng thể hiện đối tượng theo vùng nhưng không đều khắp.", "b) Bản đồ – biểu đồ thể hiện giá trị tổng theo lãnh thổ.", "c) Tỉ lệ càng nhỏ thì bản đồ càng chi tiết.", "d) Kết hợp GPS và bản đồ số giúp dẫn đường trực tiếp."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng; c sai (tỉ lệ càng lớn càng chi tiết).", "points": 1}, {"type": "short", "level": "VD", "q": "Tỉ lệ 1 : 500 000, quãng đường 8,5 cm trên bản đồ tương ứng bao nhiêu km thực tế?", "answer": "42.5", "explain": "8,5 × 500 000 = 4 250 000 cm = 42,5 km.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết tên phương pháp: 'đặt các biểu đồ vào phạm vi của các đơn vị lãnh thổ'.", "answer": "Phương pháp bản đồ – biểu đồ", "explain": "Đó là hình thức đặc trưng của phương pháp bản đồ – biểu đồ.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Vệ tinh GPS phát loại tín hiệu nào xuống mặt đất?", "options": ["A. Tín hiệu vô tuyến.", "B. Tín hiệu âm thanh.", "C. Tín hiệu ánh sáng.", "D. Tín hiệu nhiệt."], "answer": "A", "explain": "Vệ tinh GPS phát tín hiệu vô tuyến; máy thu tính thời gian truyền tín hiệu để suy ra khoảng cách.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ưu điểm của bản đồ số so với bản đồ giấy là:", "options": ["A. Cập nhật nhanh, tương tác được, nhiều lớp thông tin.", "B. Không cần thiết bị.", "C. Luôn miễn phí.", "D. Không cần kĩ năng đọc."], "answer": "A", "explain": "Ba ưu điểm cốt lõi của bản đồ số: cập nhật nhanh, tương tác, tích hợp nhiều lớp thông tin.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bản đồ mật độ giao thông các tuyến đường dùng đường càng đậm thì lưu lượng xe càng lớn. Đây là vận dụng của:", "options": ["A. Phương pháp kí hiệu đường (độ đậm thể hiện lưu lượng).", "B. Phương pháp chấm điểm.", "C. Phương pháp khoanh vùng.", "D. Phương pháp bản đồ – biểu đồ."], "answer": "A", "explain": "Tuyến đường là đối tượng dạng đường (kí hiệu đường); độ đậm thể hiện lưu lượng (số lượng) — thuộc họ phương pháp kí hiệu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi cần so sánh tổng đàn trâu của các huyện trong một tỉnh, cách thể hiện trực quan nhất là:", "options": ["A. Vẽ biểu đồ cột thể hiện tổng đàn trâu trong phạm vi mỗi huyện.", "B. Vẽ mũi tên giữa các huyện.", "C. Tô màu toàn tỉnh một màu.", "D. Chấm 1 chấm cho mỗi con trâu."], "answer": "A", "explain": "So sánh giá trị tổng theo đơn vị lãnh thổ (huyện) thì biểu đồ cột đặt trong phạm vi huyện (bản đồ – biểu đồ) là trực quan nhất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trên bản đồ tỉ lệ 1 : 50 000, một con suối dài 14 cm. Thực tế con suối dài:", "options": ["A. 7 km.", "B. 70 km.", "C. 0,7 km.", "D. 700 km."], "answer": "A", "explain": "14 × 50 000 = 700 000 cm = 7 km.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong phòng chống dịch bệnh, bản đồ số thể hiện các ổ dịch bằng kí hiệu, vùng nguy cơ bằng khoanh vùng màu. Giá trị của cách làm này là:", "options": ["A. Chỉ để trang trí.", "B. Giúp xác định nhanh vị trí ổ dịch (kí hiệu) và phạm vi cần khoanh vùng dập dịch (khoanh vùng), hỗ trợ ra quyết định kịp thời.", "C. Thay thế xét nghiệm.", "D. Không có giá trị."], "answer": "B", "explain": "Kết hợp kí hiệu (điểm ổ dịch) và khoanh vùng (phạm vi nguy cơ) giúp trực quan hóa tình hình dịch, hỗ trợ chỉ đạo chống dịch kịp thời.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kí hiệu được đặt chính xác vào vị trí đối tượng phân bố.", "b) Mỗi chấm điểm ứng với một số lượng nhất định.", "c) Tỉ lệ 1 : 1 000 000 nghĩa là 1 cm ứng với 1 km.", "d) GPS do Hoa Kỳ xây dựng."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng; c sai (1 cm ứng với 10 km).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mũi tên thể hiện hướng di chuyển của đối tượng.", "b) Vùng chuyên canh cây ăn quả nên dùng khoanh vùng.", "c) Sản lượng lúa các tỉnh nên dùng đường chuyển động.", "d) Google Maps là ứng dụng bản đồ số."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng; c sai (sản lượng tổng theo tỉnh dùng bản đồ – biểu đồ).", "points": 1}, {"type": "short", "level": "VD", "q": "1 chấm = 4 000 con vịt, một xã có 19 chấm thì đàn vịt khoảng bao nhiêu con?", "answer": "76000", "explain": "19 × 4 000 = 76 000 con.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết tên hệ thống định vị vệ tinh của Trung Quốc.", "answer": "BeiDou", "explain": "BeiDou là hệ thống định vị vệ tinh của Trung Quốc.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Đối tượng phân bố theo những điểm cụ thể được thể hiện bằng phương pháp nào?", "options": ["A. Phương pháp kí hiệu.", "B. Phương pháp chấm điểm.", "C. Phương pháp khoanh vùng.", "D. Phương pháp bản đồ – biểu đồ."], "answer": "A", "explain": "Đối tượng phân bố theo điểm cụ thể (hoặc diện tích nhỏ) dùng phương pháp kí hiệu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "1 cm trên bản đồ tỉ lệ 1 : 250 000 ứng với bao nhiêu km thực địa?", "options": ["A. 0,25 km.", "B. 2,5 km.", "C. 25 km.", "D. 250 km."], "answer": "B", "explain": "250 000 cm = 2,5 km.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bản đồ các dòng biển nóng, lạnh trên thế giới dùng mũi tên đỏ và xanh. Màu sắc ở đây phân biệt:", "options": ["A. Tốc độ dòng biển.", "B. Tính chất nóng, lạnh của dòng biển.", "C. Độ sâu dòng biển.", "D. Độ muối dòng biển."], "answer": "B", "explain": "Màu sắc mũi tên phân biệt tính chất của luồng di chuyển (dòng biển nóng/lạnh).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bản đồ thể hiện số trường học của từng huyện bằng biểu đồ. Muốn biết huyện nào có nhiều trường nhất, ta:", "options": ["A. So sánh chiều cao (độ lớn) các biểu đồ giữa các huyện.", "B. Đếm số màu trên bản đồ.", "C. Đo khoảng cách giữa các huyện.", "D. Xem tên huyện."], "answer": "A", "explain": "Biểu đồ càng lớn (cột càng cao) thì giá trị tổng (số trường) càng lớn — so sánh trực quan giữa các huyện.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trên bản đồ tỉ lệ 1 : 2 000 000, hành trình du lịch qua 3 chặng đo được 4 cm, 6 cm và 5 cm. Tổng quãng đường thực tế là:", "options": ["A. 150 km.", "B. 300 km.", "C. 30 km.", "D. 1 500 km."], "answer": "B", "explain": "Tổng trên bản đồ = 4 + 6 + 5 = 15 cm; thực tế = 15 × 2 000 000 = 30 000 000 cm = 300 km.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một công trình nghiên cứu so sánh 'vùng trồng lúa' của hai đồng bằng lớn bằng cách khoanh vùng trên cùng một bản đồ. Giá trị khoa học của cách làm này là:", "options": ["A. Không có giá trị.", "B. Trực quan so sánh được vị trí, phạm vi và sự chênh lệch diện tích vùng trồng lúa giữa hai đồng bằng.", "C. Chỉ để minh họa cho đẹp.", "D. Thay thế số liệu thống kê."], "answer": "B", "explain": "Khoanh vùng trên cùng bản đồ cho phép so sánh trực quan vị trí, phạm vi, quy mô vùng trồng lúa giữa hai đồng bằng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phương pháp đường chuyển động thể hiện sự dịch chuyển.", "b) Phương pháp khoanh vùng thể hiện đối tượng theo vùng nhất định.", "c) Tỉ lệ 1 : 5 000 000 chi tiết hơn tỉ lệ 1 : 500 000.", "d) Bản đồ số tương tác và cập nhật nhanh."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng; c sai (1 : 500 000 chi tiết hơn).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hình dạng kí hiệu phân biệt loại đối tượng.", "b) Độ rộng mũi tên thể hiện quy mô luồng di chuyển.", "c) Chấm điểm cho biết số lượng tuyệt đối chính xác từng điểm.", "d) Galileo là hệ thống định vị của châu Âu."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng; c sai (chấm điểm cho số lượng tương đối).", "points": 1}, {"type": "short", "level": "VD", "q": "Tỉ lệ 1 : 1 000 000, đoạn đường 12,5 cm trên bản đồ dài bao nhiêu km thực tế?", "answer": "125", "explain": "12,5 × 1 000 000 = 12 500 000 cm = 125 km.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết tên phương pháp: mỗi chấm điểm tương ứng với một số lượng nhất định của đối tượng.", "answer": "Phương pháp chấm điểm", "explain": "Đó là đặc trưng của phương pháp chấm điểm.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Khi sử dụng bản đồ trong học tập, kĩ năng nào giúp rút ra mối quan hệ giữa các đối tượng địa lí?", "options": ["A. Phân tích, so sánh, đối chiếu các bản đồ.", "B. Gấp bản đồ.", "C. Tô màu bản đồ.", "D. Đoán mò."], "answer": "A", "explain": "Phân tích, so sánh, đối chiếu giúp rút ra nhận xét về mối quan hệ giữa các đối tượng địa lí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các hệ thống định vị vệ tinh sau, hệ thống nào của Hoa Kỳ?", "options": ["A. GPS.", "B. GLONASS.", "C. Galileo.", "D. BeiDou."], "answer": "A", "explain": "GPS (Global Positioning System) là hệ thống của Hoa Kỳ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bản đồ hiện trạng rừng của một tỉnh dùng màu xanh đậm cho rừng giàu, xanh nhạt cho rừng nghèo. Cách thể hiện này là:", "options": ["A. Khoanh vùng bằng màu sắc theo chất lượng rừng từng vùng.", "B. Chấm điểm.", "C. Đường chuyển động.", "D. Kí hiệu điểm."], "answer": "A", "explain": "Phân vùng theo chất lượng rừng bằng màu đậm nhạt là hình thức khoanh vùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bản đồ thể hiện lượng khách du lịch đến các tỉnh bằng biểu đồ cột. Tỉnh có cột cao nhất cho biết điều gì?", "options": ["A. Tỉnh đó có lượng khách du lịch lớn nhất.", "B. Tỉnh đó có diện tích lớn nhất.", "C. Tỉnh đó có dân số đông nhất.", "D. Tỉnh đó ở gần biển nhất."], "answer": "A", "explain": "Cột càng cao thì giá trị tổng (lượng khách) càng lớn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một đội cứu hộ cần đến một bản làng bị cô lập. Họ có tọa độ GPS của bản và bản đồ số địa hình. Cách tiếp cận tốt nhất là:", "options": ["A. Đi theo đường chim bay.", "B. Dùng bản đồ số xem địa hình, đường sá từ vị trí hiện tại (GPS) đến tọa độ bản làng, chọn lộ trình khả thi nhất.", "C. Đợi người dân ra đón.", "D. Đi ngẫu nhiên."], "answer": "B", "explain": "Kết hợp tọa độ GPS (vị trí) và bản đồ số (địa hình, đường sá) để hoạch định lộ trình cứu hộ khả thi, an toàn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đánh giá nhận định: 'Bản đồ càng nhiều màu sắc, kí hiệu thì càng tốt'.", "options": ["A. Đúng, càng nhiều càng tốt.", "B. Sai, bản đồ tốt là bản đồ thể hiện đúng, đủ nội dung cần thiết bằng phương pháp phù hợp, rõ ràng, dễ đọc; nhồi nhét gây rối.", "C. Đúng, màu sắc là tất cả.", "D. Không đánh giá được."], "answer": "B", "explain": "Bản đồ tốt phải chính xác, phù hợp mục đích, rõ ràng dễ đọc; quá nhiều chi tiết gây rối, khó khai thác.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bảng chú giải giải thích các kí hiệu.", "b) Tỉ lệ cho biết mức độ thu nhỏ.", "c) GPS xác định vị trí nhờ vệ tinh.", "d) Bản đồ giấy cập nhật nhanh hơn bản đồ số."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng; d sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vùng nguy cơ lũ quét nên thể hiện bằng khoanh vùng.", "b) Luồng hàng hóa xuất khẩu nên thể hiện bằng đường chuyển động.", "c) Tổng giá trị sản xuất theo tỉnh nên dùng bản đồ – biểu đồ.", "d) Vị trí trường học nên thể hiện bằng chấm điểm."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng; d sai (vị trí trường học là điểm cụ thể nên dùng kí hiệu).", "points": 1}, {"type": "short", "level": "VD", "q": "1 chấm = 6 000 người, một phường có 13 chấm thì dân số khoảng bao nhiêu người?", "answer": "78000", "explain": "13 × 6 000 = 78 000 người.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Có bao nhiêu phương pháp biểu hiện các đối tượng địa lí trên bản đồ theo SGK Địa lí 10?", "answer": "5", "explain": "5 phương pháp: kí hiệu, đường chuyển động, bản đồ – biểu đồ, chấm điểm, khoanh vùng.", "points": 0.5}]}]}</script>
