g cao.", "B. Hai mảng tách dãn.", "C. Núi lửa phun trào duy nhất.", "D. Băng hà bào mòn."], "answer": "A", "explain": "Mảng Ấn – Úc xô vào mảng Âu – Á; hai mảng lục địa nén ép nhau nâng lên tạo dãy Himalaya vẫn đang cao thêm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thạch quyển gồm vỏ Trái Đất và phần trên của manti.", "b) Thạch quyển dày khoảng 100 km.", "c) Thạch quyển mỏng hơn vỏ Trái Đất.", "d) Các mảng kiến tạo luôn chuyển động."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: thạch quyển dày hơn vỏ Trái Đất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Có 7 mảng kiến tạo lớn trên Trái Đất.", "b) Mảng Thái Bình Dương là mảng lớn nhất, chủ yếu là vỏ đại dương.", "c) Dòng đối lưu manti làm các mảng chuyển động.", "d) Nơi hai mảng tách dãn thường có núi lửa và động đất yếu."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng: 7 mảng lớn; Thái Bình Dương lớn nhất; dòng đối lưu là nguyên nhân; nơi tách dãn có macma trào lên.", "points": 1}, {"type": "short", "level": "VD", "q": "Kể tên mảng kiến tạo lớn nhất, chủ yếu là vỏ đại dương.", "answer": "Mảng Thái Bình Dương", "explain": "Mảng Thái Bình Dương là mảng lớn nhất, hầu hết là vỏ đại dương.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vành đai lửa Thái Bình Dương hình thành do kiểu tiếp xúc nào của các mảng?", "answer": "Xô vào (hút chìm)", "explain": "Vành đai lửa Thái Bình Dương hình thành nơi các mảng đại dương hút chìm xuống dưới các mảng lục địa (xô vào).", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Theo thuyết kiến tạo mảng, thạch quyển được cấu tạo bởi:", "options": ["A. Các mảng kiến tạo nằm kề nhau.", "B. Một khối đá liền mạch.", "C. Toàn nước biển.", "D. Các lớp khí."], "answer": "A", "explain": "Thạch quyển gồm các mảng kiến tạo (mảng đại dương, mảng lục địa) nằm kề nhau và chuyển động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mảng kiến tạo nào sau đây là mảng lớn?", "options": ["A. Mảng Âu – Á.", "B. Mảng Philippin.", "C. Mảng Cocos.", "D. Mảng Arập."], "answer": "A", "explain": "7 mảng lớn: Thái Bình Dương, Ấn – Úc, Âu – Á, Phi, Bắc Mĩ, Nam Mĩ, Nam Cực. Philippin, Cocos, Arập là mảng nhỏ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nơi hai mảng xô vào nhau (mảng đại dương hút chìm) thường xảy ra hiện tượng gì?", "options": ["A. Động đất mạnh, núi lửa, tạo rãnh sâu và dãy núi cao.", "B. Hình thành sống núi giữa đại dương.", "C. Không có hiện tượng gì.", "D. Chỉ có mưa nhiều."], "answer": "A", "explain": "Nơi hút chìm: mảng đại dương chìm xuống, nén ép tạo rãnh sâu, động đất mạnh, núi lửa và dãy núi cao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đứt gãy San Andreas (California, Mỹ) là kết quả của kiểu tiếp xúc nào?", "options": ["A. Trượt ngang.", "B. Tách dãn.", "C. Xô vào.", "D. Nâng lên."], "answer": "A", "explain": "San Andreas là nơi mảng Thái Bình Dương và mảng Bắc Mĩ trượt ngang qua nhau, gây động đất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhật Bản thường xuyên có động đất, núi lửa vì:", "options": ["A. Nằm trên nơi tiếp xúc, hút chìm của nhiều mảng (Thái Bình Dương, Philippin, Âu – Á).", "B. Nằm giữa mảng.", "C. Do bão nhiều.", "D. Do con người."], "answer": "A", "explain": "Nhật Bản nằm trên 'vành đai lửa', nơi nhiều mảng hút chìm nên động đất, núi lửa hoạt động mạnh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao ở nơi hai mảng tách dãn, đáy đại dương ngày càng rộng ra?", "options": ["A. Vì macma liên tục trào lên, đông cứng tạo vỏ đại dương mới đẩy hai bên ra xa.", "B. Vì nước biển dâng.", "C. Vì đáy biển bị xói mòn.", "D. Vì Trái Đất co lại."], "answer": "A", "explain": "Macma trào lên ở sống núi giữa đại dương tạo vỏ mới, đẩy hai mảng tách xa — đáy Đại Tây Dương đang rộng ra.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Có 7 mảng kiến tạo lớn.", "b) Mảng Âu – Á là mảng lớn.", "c) Mảng Philippin là mảng lớn.", "d) Các mảng nhỏ gồm Cocos, Nazca, Arập."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: Philippin là mảng nhỏ.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nơi hút chìm thường có động đất mạnh và núi lửa.", "b) Nơi tách dãn tạo vỏ đại dương mới.", "c) San Andreas do hai mảng trượt ngang.", "d) Himalaya do hai mảng tách dãn."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: Himalaya do hai mảng lục địa xô vào, nén ép.", "points": 1}, {"type": "short", "level": "VD", "q": "Có bao nhiêu mảng kiến tạo lớn trên Trái Đất?", "answer": "7", "explain": "7 mảng lớn: Thái Bình Dương, Ấn – Úc, Âu – Á, Phi, Bắc Mĩ, Nam Mĩ, Nam Cực.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sống núi giữa Đại Tây Dương hình thành do kiểu tiếp xúc nào?", "answer": "Tách dãn", "explain": "Nơi hai mảng tách dãn, macma trào lên tạo sống núi giữa đại dương.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Phần trên của lớp manti thuộc bộ phận nào của Trái Đất?", "options": ["A. Thạch quyển.", "B. Khí quyển.", "C. Thủy quyển.", "D. Sinh quyển."], "answer": "A", "explain": "Thạch quyển gồm vỏ Trái Đất và phần trên (phần cứng) của lớp manti.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thuyết kiến tạo mảng do ai đề xuất (người đặt nền móng với thuyết trôi dạt lục địa)?", "options": ["A. Alfred Wegener.", "B. Isaac Newton.", "C. Charles Darwin.", "D. Albert Einstein."], "answer": "A", "explain": "Alfred Wegener đề xuất thuyết trôi dạt lục địa (1912) — tiền đề của thuyết kiến tạo mảng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao gọi là 'vành đai lửa Thái Bình Dương'?", "options": ["A. Vì quanh Thái Bình Dương tập trung nhiều núi lửa, động đất do các mảng hút chìm.", "B. Vì nước biển ở đó nóng.", "C. Vì có nhiều cháy rừng.", "D. Vì Mặt Trời chiếu mạnh."], "answer": "A", "explain": "Quanh Thái Bình Dương là nơi nhiều mảng hút chìm nên tập trung phần lớn núi lửa và động đất mạnh của Trái Đất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dãy Andes (Nam Mĩ) được hình thành do:", "options": ["A. Mảng Nazca hút chìm xuống dưới mảng Nam Mĩ.", "B. Hai mảng tách dãn.", "C. Hai mảng trượt ngang.", "D. Băng hà bào mòn."], "answer": "A", "explain": "Mảng đại dương Nazca hút chìm dưới mảng lục địa Nam Mĩ, nén ép nâng lên tạo dãy Andes.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Biển Đỏ đang rộng dần ra. Hiện tượng này phù hợp với quá trình nào?", "options": ["A. Tách dãn: mảng Arập tách khỏi mảng Phi, macma trào lên tạo vỏ mới.", "B. Hai mảng xô vào.", "C. Nước biển dâng.", "D. Sông bồi đắp."], "answer": "A", "explain": "Biển Đỏ nằm trên đới tách dãn giữa mảng Phi và mảng Arập nên ngày càng rộng ra.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vùng nằm giữa hai mảng lục địa đang xô vào nhau sẽ có địa hình và hiện tượng gì?", "options": ["A. Núi cao, động đất (ví dụ Himalaya).", "B. Vực sâu đại dương.", "C. Đồng bằng phẳng lặng.", "D. Không có biến đổi."], "answer": "A", "explain": "Hai mảng lục địa xô vào, không mảng nào chìm hẳn nên nén ép nâng lên tạo núi cao và động đất.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thạch quyển dày khoảng 100 km.", "b) Vành đai lửa Thái Bình Dương nhiều núi lửa, động đất.", "c) Dãy Andes do mảng Nazca hút chìm.", "d) Biển Đỏ đang hẹp dần."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: Biển Đỏ đang rộng dần do tách dãn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nơi tách dãn, macma trào lên tạo vỏ mới.", "b) Nơi hút chìm tạo rãnh sâu đại dương.", "c) Nơi trượt ngang ít khi có động đất.", "d) Himalaya do Ấn – Úc xô vào Âu – Á."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: nơi trượt ngang (San Andreas) thường có động đất.", "points": 1}, {"type": "short", "level": "VD", "q": "Kể tên dãy núi cao nhất thế giới được tạo thành do hai mảng lục địa xô vào nhau.", "answer": "Dãy Himalaya", "explain": "Dãy Himalaya do mảng Ấn – Úc xô vào mảng Âu – Á.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đứt gãy San Andreas ở Mỹ là kết quả của kiểu tiếp xúc nào?", "answer": "Trượt ngang", "explain": "San Andreas do mảng Thái Bình Dương và mảng Bắc Mĩ trượt ngang qua nhau.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Các mảng kiến tạo chuyển động với tốc độ khoảng:", "options": ["A. Vài cm mỗi năm.", "B. Vài km mỗi ngày.", "C. Vài m mỗi giờ.", "D. Đứng yên."], "answer": "A", "explain": "Các mảng chuyển động rất chậm, chỉ vài cm mỗi năm (khoảng tốc độ móng tay mọc).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mảng nào sau đây chủ yếu là vỏ đại dương?", "options": ["A. Mảng Thái Bình Dương.", "B. Mảng Âu – Á.", "C. Mảng Phi.", "D. Mảng Nam Cực."], "answer": "A", "explain": "Mảng Thái Bình Dương hầu hết là vỏ đại dương; các mảng còn lại mang nhiều lục địa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao các mảng chuyển động rất chậm nhưng vẫn tạo ra động đất mạnh?", "options": ["A. Vì năng lượng tích tụ lâu ngày ở nơi tiếp xúc, khi giải phóng đột ngột gây động đất mạnh.", "B. Vì mảng nhẹ.", "C. Vì nước biển đẩy.", "D. Vì gió mạnh."], "answer": "A", "explain": "Chuyển động chậm nhưng liên tục làm tích tụ ứng suất; khi vượt giới hạn, năng lượng giải phóng đột ngột gây động đất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Rãnh Mariana (sâu nhất thế giới) được hình thành do:", "options": ["A. Mảng Thái Bình Dương hút chìm xuống dưới mảng Philippin.", "B. Hai mảng tách dãn.", "C. Sông bào mòn.", "D. Băng hà đào sâu."], "answer": "A", "explain": "Rãnh Mariana là rãnh sâu đại dương nơi mảng Thái Bình Dương hút chìm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Iceland nằm trên sống núi giữa Đại Tây Dương. Đặc điểm địa chất của Iceland là:", "options": ["A. Nhiều núi lửa, suối nước nóng do nằm trên đới tách dãn.", "B. Không có núi lửa.", "C. Toàn đồng bằng.", "D. Không có động đất."], "answer": "A", "explain": "Iceland nằm trên đới tách dãn giữa hai mảng nên macma trào lên gây núi lửa, suối nước nóng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một học sinh nói: 'Các lục địa đang trôi dạt nên bản đồ thế giới trong tương lai sẽ khác'. Nhận định này:", "options": ["A. Đúng, vì các mảng chuyển động vài cm/năm, sau hàng triệu năm vị trí lục địa thay đổi rõ.", "B. Sai, vì lục địa đứng yên.", "C. Sai, vì mảng không chuyển động.", "D. Không thể kiểm chứng."], "answer": "A", "explain": "Thuyết kiến tạo mảng khẳng định lục địa trôi dạt; sau hàng triệu năm, bản đồ lục địa sẽ khác hiện nay.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Các mảng chuyển động vài cm mỗi năm.", "b) Mảng Thái Bình Dương chủ yếu là vỏ đại dương.", "c) Rãnh Mariana do hút chìm tạo thành.", "d) Iceland nằm trên đới tách dãn."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng theo thuyết kiến tạo mảng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Động đất mạnh do năng lượng tích tụ giải phóng đột ngột.", "b) Nơi tách dãn có macma trào lên.", "c) Lục địa đứng yên vĩnh viễn.", "d) Vành đai lửa quanh Thái Bình Dương."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: lục địa trôi dạt theo mảng.", "points": 1}, {"type": "short", "level": "VD", "q": "Rãnh đại dương sâu nhất thế giới có tên là gì?", "answer": "Rãnh Mariana", "explain": "Rãnh Mariana (Tây Thái Bình Dương) là rãnh sâu nhất thế giới.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Dãy núi nào ở Nam Mĩ được tạo thành do mảng Nazca hút chìm?", "answer": "Dãy Andes", "explain": "Dãy Andes do mảng Nazca hút chìm dưới mảng Nam Mĩ.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Mảng kiến tạo gồm những loại nào?", "options": ["A. Mảng đại dương và mảng lục địa.", "B. Mảng khí và mảng nước.", "C. Mảng nóng và mảng lạnh.", "D. Mảng sáng và mảng tối."], "answer": "A", "explain": "Các mảng kiến tạo gồm mảng đại dương (vỏ đại dương) và mảng lục địa (mang lục địa).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việt Nam nằm trên mảng kiến tạo nào?", "options": ["A. Mảng Âu – Á.", "B. Mảng Thái Bình Dương.", "C. Mảng Ấn – Úc.", "D. Mảng Phi."], "answer": "A", "explain": "Việt Nam nằm trên mảng Âu – Á (rìa đông nam của mảng).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Việt Nam ít chịu động đất mạnh như Nhật Bản?", "options": ["A. Vì Việt Nam nằm sâu trong nội mảng Âu – Á, xa nơi tiếp xúc hút chìm.", "B. Vì Việt Nam không có núi.", "C. Vì Việt Nam ở xích đạo.", "D. Vì Việt Nam nhiều sông."], "answer": "A", "explain": "Việt Nam nằm trong nội mảng, xa vành đai hút chìm nên ít động đất mạnh; Nhật Bản nằm trên vành đai lửa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi hai mảng đại dương xô vào nhau, hiện tượng nào xảy ra?", "options": ["A. Mảng già hơn, nặng hơn hút chìm tạo rãnh sâu và vòng cung đảo núi lửa.", "B. Tạo sống núi giữa đại dương.", "C. Không có gì xảy ra.", "D. Tạo đồng bằng."], "answer": "A", "explain": "Hai mảng đại dương xô vào: mảng già nặng hơn chìm xuống tạo rãnh sâu và vòng cung đảo núi lửa (ví dụ quần đảo Nhật Bản, Philippin).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Thung lũng Tách giãn Đông Phi (Great Rift Valley) đang rộng ra. Điều này cho thấy:", "options": ["A. Châu Phi đang bị tách làm đôi bởi đới tách dãn trên lục địa.", "B. Châu Phi đang chìm xuống.", "C. Núi lửa tắt hẳn.", "D. Không có ý nghĩa."], "answer": "A", "explain": "Thung lũng tách giãn Đông Phi là đ�ới tách dãn trên lục địa; trong tương lai xa có thể thành biển mới.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vùng có nhiều suối nước nóng, núi lửa đang hoạt động nhưng không nằm gần rìa mảng nào. Giải thích có thể là:", "options": ["A. Nằm trên 'điểm nóng' (hotspot): cột macma từ sâu trong manti bốc lên xuyên qua mảng.", "B. Do khí hậu nóng.", "C. Do con người đào.", "D. Không giải thích được."], "answer": "A", "explain": "Điểm nóng (như Hawaii) là cột vật chất nóng từ manti sâu bốc lên xuyên qua mảng, gây núi lửa giữa mảng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Có mảng đại dương và mảng lục địa.", "b) Việt Nam nằm trên mảng Âu – Á.", "c) Việt Nam nằm trên vành đai lửa Thái Bình Dương.", "d) Hai mảng đại dương xô vào tạo vòng cung đảo núi lửa."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: Việt Nam nằm trong nội mảng, không trên vành đai lửa.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thung lũng Đông Phi do tách dãn trên lục địa.", "b) Điểm nóng gây núi lửa giữa mảng (Hawaii).", "c) Nơi tiếp xúc mảng thường có động đất.", "d) Mọi núi lửa đều nằm ở rìa mảng."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: có núi lửa giữa mảng do điểm nóng.", "points": 1}, {"type": "short", "level": "VD", "q": "Việt Nam nằm trên mảng kiến tạo nào?", "answer": "Mảng Âu – Á", "explain": "Việt Nam nằm trên mảng Âu – Á.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thung lũng tách giãn lớn ở Đông Phi cho thấy quá trình nào đang diễn ra?", "answer": "Tách dãn", "explain": "Thung lũng Đông Phi là đới tách dãn trên lục địa.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Lớp vật chất quánh dẻo làm các mảng chuyển động nằm ở đâu?", "options": ["A. Lớp manti.", "B. Nhân Trái Đất.", "C. Vỏ Trái Đất.", "D. Khí quyển."], "answer": "A", "explain": "Dòng đối lưu vật chất quánh dẻo trong lớp manti làm các mảng kiến tạo chuyển động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kiểu tiếp xúc nào tạo ra sống núi giữa đại dương?", "options": ["A. Tách dãn.", "B. Xô vào.", "C. Trượt ngang.", "D. Nâng lên."], "answer": "A", "explain": "Nơi tách dãn, macma trào lên tạo sống núi giữa đại dương và vỏ đại dương mới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao động đất ở nơi hút chìm thường mạnh và sâu?", "options": ["A. Vì mảng chìm xuống sâu, ma sát lớn, tích tụ nhiều năng lượng.", "B. Vì nước biển nặng.", "C. Vì gió mạnh.", "D. Vì dân đông."], "answer": "A", "explain": "Mảng hút chìm xuống sâu hàng trăm km, ma sát và tích tụ năng lượng lớn nên động đất mạnh, chấn tiêu sâu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Núi lửa ở Iceland và núi lửa ở Nhật Bản khác nhau cơ bản ở điểm nào?", "options": ["A. Iceland do tách dãn, Nhật Bản do hút chìm.", "B. Iceland lạnh hơn.", "C. Nhật Bản cao hơn.", "D. Không khác nhau."], "answer": "A", "explain": "Iceland trên đới tách dãn (macma trào lên); Nhật Bản trên đới hút chìm (vành đai lửa).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một thành phố nằm trên đứt gãy trượt ngang cần biện pháp nào để giảm thiệt hại động đất?", "options": ["A. Xây dựng công trình chống động đất, quy hoạch tránh vùng đứt gãy, diễn tập sơ tán.", "B. Cấm xây dựng hoàn toàn.", "C. Không cần biện pháp.", "D. Chuyển thành phố đi nơi khác."], "answer": "A", "explain": "Không ngăn được động đất nhưng giảm thiệt hại bằng xây dựng chống động đất, quy hoạch hợp lí và diễn tập.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai mảng có tốc độ chuyển động khác nhau (mảng A nhanh hơn mảng B) xô vào nhau. Hệ quả có thể là:", "options": ["A. Vùng tiếp xúc biến dạng phức tạp, động đất mạnh do chênh lệch ứng suất.", "B. Không có gì xảy ra.", "C. Mảng nhanh dừng lại.", "D. Hai mảng hợp nhất êm thấm."], "answer": "A", "explain": "Chênh lệch tốc độ làm ứng suất tích tụ phức tạp ở đới tiếp xúc, dễ gây động đất mạnh khi giải phóng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dòng đối lưu manti ở lớp manti.", "b) Tách dãn tạo sống núi giữa đại dương.", "c) Nơi hút chìm động đất mạnh và sâu.", "d) Iceland và Nhật Bản cùng kiểu núi lửa."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: Iceland (tách dãn), Nhật Bản (hút chìm).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xây dựng chống động đất giảm thiệt hại.", "b) Không thể ngăn động đất xảy ra.", "c) Mọi nơi trên Trái Đất động đất như nhau.", "d) Vùng rìa mảng động đất nhiều hơn nội mảng."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: động đất tập trung ở nơi tiếp xúc mảng.", "points": 1}, {"type": "short", "level": "VD", "q": "Kể tên một mảng nhỏ (không thuộc 7 mảng lớn).", "answer": "Mảng Philippin", "explain": "Các mảng nhỏ: Philippin, Arập, Cocos, Nazca, Caribe...", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Núi lửa giữa mảng (như Hawaii) được giải thích bằng hiện tượng nào?", "answer": "Điểm nóng", "explain": "Điểm nóng (hotspot): cột macma từ manti sâu bốc lên xuyên qua mảng.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Thạch quyển khác vỏ Trái Đất ở điểm nào?", "options": ["A. Thạch quyển gồm vỏ Trái Đất và phần trên của manti nên dày hơn.", "B. Vỏ Trái Đất dày hơn thạch quyển.", "C. Hai khái niệm giống nhau.", "D. Thạch quyển là chất lỏng."], "answer": "A", "explain": "Thạch quyển (~100 km) gồm vỏ Trái Đất (5 – 70 km) và phần cứng trên của manti.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các mảng sau, mảng nào là mảng nhỏ?", "options": ["A. Mảng Nazca.", "B. Mảng Phi.", "C. Mảng Nam Mĩ.", "D. Mảng Bắc Mĩ."], "answer": "A", "explain": "Nazca macma trào lên tạo đảo (như Iceland).", "B. Sông bồi đắp.", "C. San hô.", "D. Con người đắp."], "answer": "A", "explain": "Đảo núi lửa trên sống núi giữa đại dương do macma trào lên ở đới tách dãn (ví dụ đảo Surtsey, Iceland).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vùng đất từng là đáy biển (có hóa thạch biển) nay thành núi cao. Quá trình nào giải thích?", "options": ["A. Nén ép ở đới xô vào nâng đáy biển lên thành núi.", "B. Nước biển rút.", "C. Núi lửa phun.", "D. Băng tan."], "answer": "A", "explain": "Đáy biển bị nén ép ở đới xô vào được nâng lên thành núi (ví dụ Himalaya từng là biển Tetys).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mảng Thái Bình Dương lớn nhất.", "b) Nơi tách dãn gọi là đới tách dãn.", "c) Động đất sâu ở đới hút chìm.", "d) Đảo núi lửa giữa đại dương do tách dãn."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Macma trào lên do vỏ nứt, áp suất giảm.", "b) Himalaya từng là biển Tetys.", "c) Mọi đảo đều do tách dãn.", "d) Vỏ đại dương mới tạo ở sống núi giữa đại dương."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: đảo còn do san hô, điểm nóng, bồi đắp...", "points": 1}, {"type": "short", "level": "VD", "q": "Nơi hai mảng tách xa nhau được gọi là gì?", "answer": "Đới tách dãn", "explain": "Gọi là đới tách dãn (divergent boundary).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Biển nào từng tồn tại ở vị trí dãy Himalaya ngày nay?", "answer": "Biển Tetys", "explain": "Dãy Himalaya được nâng lên từ đáy biển Tetys cổ.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Có mấy kiểu tiếp xúc chính của các mảng kiến tạo?", "options": ["A. 3 kiểu: tách dãn, xô vào, trượt ngang.", "B. 2 kiểu.", "C. 4 kiểu.", "D. 1 kiểu."], "answer": "A", "explain": "3 kiểu tiếp xúc chính: tách dãn, xô vào (hút chìm) và trượt ngang.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kiểu tiếp xúc nào gây ra đứt gãy San Andreas?", "options": ["A. Trượt ngang.", "B. Tách dãn.", "C. Xô vào.", "D. Nâng lên."], "answer": "A", "explain": "San Andreas do mảng Thái Bình Dương và mảng Bắc Mĩ trượt ngang qua nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói thuyết kiến tạo mảng là thuyết tổng hợp?", "options": ["A. Vì giải thích được đồng thời sự hình thành núi, động đất, núi lửa, sự trôi dạt lục địa.", "B. Vì do nhiều người viết.", "C. Vì rất dài.", "D. Vì khó hiểu."], "answer": "A", "explain": "Thuyết kiến tạo mảng giải thích thống nhất nhiều hiện tượng địa chất: núi, động đất, núi lửa, trôi dạt lục địa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bằng chứng nào sau đây ủng hộ thuyết trôi dạt lục địa?", "options": ["A. Bờ biển hai bên Đại Tây Dương khớp nhau và hóa thạch cùng loài.", "B. Màu nước biển.", "C. Nhiệt độ.", "D. Số lượng cá."], "answer": "A", "explain": "Đường bờ khớp nhau và hóa thạch, địa tầng tương đồng là bằng chứng lục địa từng liền nhau.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một kỹ sư xây dựng nhà máy điện hạt nhân cần tránh vùng nào nhất?", "options": ["A. Vùng rìa mảng có động đất mạnh (đới hút chìm, đứt gãy lớn).", "B. Vùng nội mảng ổn định.", "C. Vùng đồng bằng.", "D. Vùng ven biển bất kì."], "answer": "A", "explain": "Công trình đặc biệt nguy hiểm phải tránh vùng động đất mạnh ở rìa mảng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đánh giá: 'Thuyết kiến tạo mảng giải thích được mọi hiện tượng địa chất'.", "options": ["A. Sai, vì còn hiện tượng nội mảng (điểm nóng) và nhiều chi tiết chưa giải thích hết; nhưng là khung lí thuyết tốt nhất hiện nay.", "B. Đúng tuyệt đối.", "C. Sai hoàn toàn.", "D. Không có giá trị."], "answer": "A", "explain": "Thuyết kiến tạo mảng là khung lí thuyết tốt nhất hiện nay nhưng vẫn được bổ sung (điểm nóng, chi tiết nội mảng).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Có 3 kiểu tiếp xúc mảng chính.", "b) San Andreas do trượt ngang.", "c) Thuyết kiến tạo mảng giải thích núi, động đất, núi lửa.", "d) Bờ biển hai bên Đại Tây Dương khớp nhau."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Công trình nguy hiểm nên tránh vùng rìa mảng.", "b) Thuyết kiến tạo mảng vẫn được bổ sung hoàn thiện.", "c) Mọi hiện tượng địa chất đã được giải thích tuyệt đối.", "d) Điểm nóng bổ sung cho thuyết kiến tạo mảng."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: khoa học luôn tiếp tục hoàn thiện.", "points": 1}, {"type": "short", "level": "VD", "q": "Kể tên 3 kiểu tiếp xúc của mảng kiến tạo (cách nhau bằng dấu phẩy).", "answer": "Tách dãn, xô vào, trượt ngang", "explain": "3 kiểu: tách dãn, xô vào (hút chìm), trượt ngang.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ai là người đề xuất thuyết trôi dạt lục địa (tiền đề của thuyết kiến tạo mảng)?", "answer": "Alfred Wegener", "explain": "Alfred Wegener đề xuất thuyết trôi dạt lục địa năm 1912.", "points": 0.5}]}]}</script>
