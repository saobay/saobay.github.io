ype": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kè chắn sóng hạn chế xâm thực.", "b) Hẻm vực do nâng và xâm thực.", "c) Mọi vách đá đều do núi lửa.", "d) Phù sa bồi đắp đồng bằng."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Biển nào đang rộng ra do tách dãn?", "answer": "Biển Đỏ", "explain": "Biển Đỏ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thung lũng sông Hồng thuộc dạng địa hình nào trong đứt gãy?", "answer": "Địa hào", "explain": "Thung lũng sông Hồng là địa hào.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Nơi hai mảng xô vào nhau thường có:", "options": ["A. Động đất mạnh, núi lửa.", "B. Đồng bằng phẳng.", "C. Sa mạc.", "D. Không có gì."], "answer": "A", "explain": "Nơi xô vào/hút chìm có động đất mạnh, núi lửa, núi cao.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phong hóa sinh học do:", "options": ["A. Sinh vật (rễ cây, động vật).", "B. Nhiệt độ.", "C. Nước mưa.", "D. Gió."], "answer": "A", "explain": "Sinh vật phá hủy đá là phong hóa sinh học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao vùng nóng ẩm phong hóa hóa học mạnh?", "options": ["A. Vì nhiệt, ẩm thúc đẩy phản ứng hóa học.", "B. Vì nhiều đá vôi.", "C. Vì không có đá.", "D. Vì ngẫu nhiên."], "answer": "A", "explain": "Nhiệt độ cao và ẩm nhiều thúc đẩy các phản ứng hóa học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Scandinavia đang nâng lên?", "options": ["A. Vì băng tan bớt tải trọng, vỏ đàn hồi nâng lên.", "B. Vì núi lửa.", "C. Vì con người.", "D. Vì thủy triều."], "answer": "A", "explain": "Băng hà tan làm giảm tải trọng, vỏ đàn hồi nâng lên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một công trình thủy điện cần quan tâm quá trình ngoại lực nào nhất?", "options": ["A. Xâm thực gây xói mòn, bồi lấp lòng hồ.", "B. Gió.", "C. Sóng.", "D. Băng."], "answer": "A", "explain": "Xâm thực gây xói mòn lưu vực, bồi lấp lòng hồ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vùng núi đá vôi được nâng lên nhưng bị nước hòa tan mạnh. Địa hình là:", "options": ["A. Núi đá vôi với hang động karst.", "B. Đồng bằng.", "C. Sa mạc.", "D. Không có địa hình."], "answer": "A", "explain": "Nâng (nội lực) + hòa tan (ngoại lực) tạo địa hình karst.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nơi xô vào có động đất, núi lửa.", "b) Phong hóa sinh học do sinh vật.", "c) Nóng ẩm phong hóa hóa học mạnh.", "d) Scandinavia nâng do băng tan."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xâm thực gây bồi lấp lòng hồ.", "b) Karst do nâng và hòa tan.", "c) Mọi hang động đều do núi lửa.", "d) Băng tan giảm tải trọng vỏ."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Bán đảo nào đang nâng lên sau khi băng hà tan?", "answer": "Scandinavia", "explain": "Bán đảo Scandinavia.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Địa hình với hang động trên núi đá vôi gọi là địa hình gì?", "answer": "Địa hình karst", "explain": "Địa hình karst.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Mối quan hệ giữa nội lực và ngoại lực:", "options": ["A. Đối kháng nhưng thống nhất.", "B. Độc lập tuyệt đối.", "C. Ngoại lực triệt tiêu nội lực.", "D. Không liên quan."], "answer": "A", "explain": "Hai lực đối kháng (nâng – san bằng) nhưng thống nhất tạo địa hình.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nội lực và ngoại lực cùng tạo nên:", "options": ["A. Địa hình hiện tại của Trái Đất.", "B. Khí hậu.", "C. Đại dương.", "D. Sinh vật."], "answer": "A", "explain": "Địa hình là kết quả tổng hợp của nội lực và ngoại lực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao núi trẻ cao hiểm trở, núi già thấp thoải?", "options": ["A. Núi trẻ ít bị bào mòn, núi già bị san bằng lâu.", "B. Núi trẻ ở xích đạo.", "C. Núi già không có đá cứng.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Núi trẻ nâng mạnh, ít bào mòn; núi già bị ngoại lực san bằng lâu dài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bằng chứng lục địa từng liền nhau:", "options": ["A. Bờ biển khớp nhau, hóa thạch cùng loài.", "B. Màu nước biển.", "C. Nhiệt độ.", "D. Số cá."], "answer": "A", "explain": "Bờ biển khớp và hóa thạch tương đồng chứng tỏ trôi dạt lục địa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Xây nhà máy điện hạt nhân nên tránh:", "options": ["A. Vùng rìa mảng động đất mạnh.", "B. Vùng nội mảng ổn định.", "C. Đồng bằng.", "D. Ven biển bất kì."], "answer": "A", "explain": "Tránh vùng động đất mạnh ở rìa mảng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong 50 triệu năm tới, châu Phi có thể:", "options": ["A. Tách đôi ở Đông Phi, thành biển mới.", "B. Chìm hẳn.", "C. Nối châu Âu.", "D. Không đổi."], "answer": "A", "explain": "Đới tách dãn Đông Phi đang hoạt động.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nội, ngoại lực đối kháng nhưng thống nhất.", "b) Địa hình do cả hai lực tạo ra.", "c) Núi trẻ ít bị bào mòn.", "d) Bờ biển khớp nhau chứng tỏ trôi dạt."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhà máy hạt nhân tránh rìa mảng.", "b) Châu Phi có thể tách đôi.", "c) Mọi dự đoán địa chất đều chắc chắn.", "d) Núi già bị san bằng lâu."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: dự đoán địa chất có tính xác suất.", "points": 1}, {"type": "short", "level": "VD", "q": "Núi trẻ ít bị bào mòn nên có đặc điểm gì?", "answer": "Cao và hiểm trở", "explain": "Núi trẻ cao, hiểm trở.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thuyết nào giải thích sự trôi dạt của các lục địa?", "answer": "Thuyết kiến tạo mảng", "explain": "Thuyết kiến tạo mảng (từ thuyết trôi dạt lục địa của Wegener).", "points": 0.5}]}]}</script>
