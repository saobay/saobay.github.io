 Vì con người lấn biển duy nhất."], "answer": "A", "explain": "Phù sa sông Mê Kông bồi tụ ở cửa sông làm đồng bằng tiến ra biển (mũi Cà Mau).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Gió thổi mòn ở sa mạc tạo nên địa hình nào?", "options": ["A. Nấm đá, rãnh thổi mòn.", "B. Hang động.", "C. Thác nước.", "D. Đồng bằng."], "answer": "A", "explain": "Gió mang cát thổi mòn tạo nấm đá, rãnh thổi mòn ở sa mạc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sóng biển vỗ vào vách đá ven bờ lâu ngày tạo ra:", "options": ["A. Hàm ếch, vách đá dựng đứng do mài mòn.", "B. Núi cao.", "C. Đồng bằng.", "D. Sa mạc."], "answer": "A", "explain": "Sóng biển mài mòn chân vách đá tạo hàm ếch, vách đá sụt lở dựng đứng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vùng núi cao, sườn dốc bị xói mòn mạnh; chân núi có nón phóng vật (nón bồi tụ). Điều này thể hiện mối quan hệ nào?", "options": ["A. Ngoại lực vừa bóc mòn ở sườn cao vừa bồi tụ ở chân núi — phá nơi cao, đắp nơi thấp.", "B. Chỉ có nội lực.", "C. Không có quá trình nào.", "D. Chỉ có phong hóa."], "answer": "A", "explain": "Ngoại lực bóc mòn vật liệu ở sườn dốc rồi bồi tụ ở chân núi — đúng bản chất 'san bằng' của ngoại lực.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bóc mòn thuộc ngoại lực.", "b) Bồi tụ tạo đồng bằng châu thổ.", "c) Gió thổi mòn tạo nấm đá ở sa mạc.", "d) Uốn nếp thuộc ngoại lực."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: uốn nếp thuộc nội lực.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồng bằng sông Cửu Long mở rộng do bồi tụ.", "b) Sóng biển mài mòn tạo hàm ếch.", "c) Ngoại lực phá nơi cao, đắp nơi thấp.", "d) Bồi tụ thuộc nội lực."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: bồi tụ thuộc ngoại lực.", "points": 1}, {"type": "short", "level": "VD", "q": "Quá trình gió mang cát thổi mòn đá ở sa mạc gọi là gì?", "answer": "Thổi mòn", "explain": "Gió thổi mòn (thổi mòn) là hình thức bóc mòn do gió.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Địa hình đồng bằng châu thổ được tạo thành do quá trình nào của ngoại lực?", "answer": "Bồi tụ", "explain": "Phù sa sông bồi tụ ở cửa sông tạo đồng bằng châu thổ.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Mối quan hệ giữa nội lực và ngoại lực là:", "options": ["A. Đối kháng nhau nhưng thống nhất trong việc tạo địa hình.", "B. Hoàn toàn độc lập.", "C. Ngoại lực mạnh hơn nội lực.", "D. Nội lực triệt tiêu ngoại lực."], "answer": "A", "explain": "Nội lực và ngoại lực đối kháng (nâng cao – san bằng) nhưng thống nhất tạo nên địa hình hiện tại.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vận động theo phương thẳng đứng gồm:", "options": ["A. Nâng lên và hạ xuống.", "B. Uốn nếp và đứt gãy.", "C. Phong hóa và bóc mòn.", "D. Vận chuyển và bồi tụ."], "answer": "A", "explain": "Vận động theo phương thẳng đứng: bộ phận này nâng lên, bộ phận khác hạ xuống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói địa hình hiện tại là kết quả của cả nội lực và ngoại lực?", "options": ["A. Vì nội lực tạo dạng địa hình lớn, ngoại lực mài mòn, bồi đắp làm biến đổi chúng — hai quá trình tác động đồng thời, lâu dài.", "B. Vì chỉ có nội lực.", "C. Vì chỉ có ngoại lực.", "D. Vì con người tạo ra."], "answer": "A", "explain": "Nội lực nâng núi, tạo đứt gãy; ngoại lực phong hóa, bóc mòn, bồi tụ — cùng tạo địa hình hiện tại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dãy núi trẻ (Himalaya) cao và hiểm trở, dãy núi già (Uran) thấp và thoải. Giải thích đúng là:", "options": ["A. Núi trẻ chịu nội lực nâng mạnh, chưa bị ngoại lực bào mòn nhiều; núi già bị ngoại lực bào mòn lâu nên thấp, thoải.", "B. Núi trẻ ở gần xích đạo.", "C. Núi già không có đá cứng.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Tuổi địa hình phản ánh tỉ lệ nội lực/ngoại lực: núi trẻ nâng mạnh, ít bào mòn; núi già bị san bằng dần.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vùng đồng bằng được nâng lên thành cao nguyên. Quá trình nào đóng vai trò chính?", "options": ["A. Nội lực (nâng lên theo phương thẳng đứng).", "B. Ngoại lực (bồi tụ).", "C. Gió thổi.", "D. Sóng biển."], "answer": "A", "explain": "Nâng đồng bằng thành cao nguyên là vận động nâng theo phương thẳng đứng của nội lực.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ở vùng núi đá vôi, nội lực nâng lên nhưng ngoại lực (nước mưa) hòa tan mạnh. Địa hình kết quả có thể là:", "options": ["A. Núi đá vôi với hang động, thung lũng karst — kết quả tổng hợp của nâng (nội lực) và hòa tan (ngoại lực).", "B. Đồng bằng phẳng.", "C. Sa mạc.", "D. Không có địa hình."], "answer": "A", "explain": "Địa hình karst là kết quả tổng hợp: nội lực nâng khối đá vôi, ngoại lực hòa tan tạo hang động, thung lũng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nội lực và ngoại lực đối kháng nhưng thống nhất.", "b) Vận động thẳng đứng gồm nâng lên, hạ xuống.", "c) Núi trẻ cao do ít bị bào mòn.", "d) Địa hình chỉ do nội lực tạo ra."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: địa hình do cả nội lực và ngoại lực.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nội lực tạo dạng địa hình lớn.", "b) Ngoại lực mài mòn, bồi đắp biến đổi địa hình.", "c) Núi già thấp do bị bào mòn lâu.", "d) Đồng bằng nâng thành cao nguyên do bồi tụ."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: do nội lực nâng lên theo phương thẳng đứng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nội lực và ngoại lực có mối quan hệ như thế nào?", "answer": "Đối kháng nhưng thống nhất", "explain": "Hai lực đối kháng (nâng cao – san bằng) nhưng thống nhất trong việc tạo địa hình.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Dãy núi nào là ví dụ điển hình của núi trẻ, cao và hiểm trở?", "answer": "Dãy Himalaya", "explain": "Himalaya là dãy núi trẻ, đang được nâng cao, hiểm trở.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Nguồn năng lượng chủ yếu của ngoại lực là:", "options": ["A. Bức xạ Mặt Trời.", "B. Năng lượng phóng xạ trong lòng đất.", "C. Lực hấp dẫn.", "D. Năng lượng hạt nhân của con người."], "answer": "A", "explain": "Nguồn năng lượng chủ yếu của ngoại lực là bức xạ Mặt Trời.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phong hóa là quá trình:", "options": ["A. Làm đá bị vỡ vụn, biến đổi ngay tại chỗ.", "B. Dời vật liệu đi xa.", "C. Nâng núi lên.", "D. Lắng đọng phù sa."], "answer": "A", "explain": "Phong hóa làm đá, khoáng vật bị vỡ vụn, biến đổi ngay tại chỗ (chưa dời đi).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phong hóa lí học mạnh ở sa mạc và vùng núi cao?", "options": ["A. Vì biên độ nhiệt ngày đêm lớn làm đá co giãn, nứt vỡ.", "B. Vì có nhiều nước.", "C. Vì có nhiều cây.", "D. Vì ít gió."], "answer": "A", "explain": "Sa mạc và núi cao có biên độ nhiệt ngày đêm rất lớn → đá co giãn liên tục → nứt vỡ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Xâm thực là hình thức bóc mòn do:", "options": ["A. Nước chảy.", "B. Gió.", "C. Băng hà.", "D. Sóng biển."], "answer": "A", "explain": "Xâm thực là bóc mòn do nước chảy (mưa, sông) xói mòn đất đá.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ở Tây Bắc Việt Nam, mùa mưa thường xảy ra lũ quét, sạt lở. Quá trình ngoại lực nào là nguyên nhân trực tiếp?", "options": ["A. Xâm thực (nước mưa xói mòn) kết hợp phong hóa làm đất đá bở rời.", "B. Động đất.", "C. Núi lửa.", "D. Thủy triều."], "answer": "A", "explain": "Mưa lớn gây xâm thực mạnh trên sườn dốc đã phong hóa bở rời → lũ quét, sạt lở.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một sườn đồi bị chặt phá rừng, sau vài mùa mưa xuất hiện nhiều rãnh xói sâu. Giải thích và bài học là:", "options": ["A. Mất rừng làm tăng xâm thực; bài học: bảo vệ rừng để chống xói mòn.", "B. Do động đất.", "C. Do hạn hán.", "D. Không có bài học."], "answer": "A", "explain": "Rừng giữ đất, giảm xói mòn; chặt phá rừng làm xâm thực tăng mạnh — cần bảo vệ và trồng rừng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bức xạ Mặt Trời là nguồn năng lượng chính của ngoại lực.", "b) Phong hóa làm đá vỡ vụn tại chỗ.", "c) Xâm thực do nước chảy.", "d) Phong hóa lí học do sinh vật."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: do sinh vật là phong hóa sinh học.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sa mạc phong hóa lí học mạnh do chênh lệch nhiệt.", "b) Mất rừng làm tăng xói mòn.", "c) Xâm thực thuộc nội lực.", "d) Phong hóa là bước đầu của bóc mòn."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: xâm thực thuộc ngoại lực.", "points": 1}, {"type": "short", "level": "VD", "q": "Hình thức bóc mòn do nước chảy xói mòn gọi là gì?", "answer": "Xâm thực", "explain": "Xâm thực là bóc mòn do nước chảy (mưa, sông).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Bảo vệ rừng có tác dụng gì đối với quá trình xâm thực?", "answer": "Chống xói mòn", "explain": "Rừng giữ đất, làm giảm dòng chảy mặt nên chống xói mòn, hạn chế xâm thực.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Vận động nào sau đây thuộc nội lực?", "options": ["A. Đứt gãy.", "B. Thổi mòn.", "C. Xâm thực.", "D. Bồi tụ."], "answer": "A", "explain": "Đứt gãy là vận động của nội lực; các quá trình còn lại thuộc ngoại lực.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quá trình nào sau đây thuộc ngoại lực?", "options": ["A. Vận chuyển vật liệu.", "B. Uốn nếp.", "C. Nâng lên.", "D. Động đất."], "answer": "A", "explain": "Vận chuyển vật liệu (bởi gió, nước, băng) là quá trình của ngoại lực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao các dòng sông ở miền núi thường có nhiều thác ghềnh?", "options": ["A. Vì địa hình dốc do nội lực nâng, nước chảy xiết xâm thực mạnh tạo thác ghềnh.", "B. Vì sông ngắn.", "C. Vì ít nước.", "D. Vì ngẫu nhiên."], "answer": "A", "explain": "Địa hình dốc (nội lực) + nước chảy xiết (ngoại lực xâm thực) tạo thác ghềnh ở miền núi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cồn cát ven biển được hình thành do:", "options": ["A. Gió vận chuyển cát rồi bồi tụ.", "B. Sóng thần.", "C. Núi lửa.", "D. Động đất."], "answer": "A", "explain": "Gió vận chuyển cát từ bãi biển vào đất liền rồi bồi tụ thành cồn cát.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Người dân vùng ven biển trồng phi lao chắn cát. Việc làm này tác động vào quá trình nào?", "options": ["A. Hạn chế thổi mòn và vận chuyển cát của gió (ngoại lực).", "B. Ngăn động đất.", "C. Ngăn núi lửa.", "D. Ngăn thủy triều."], "answer": "A", "explain": "Rừng phi lao chắn gió, giữ cát — hạn chế thổi mòn, vận chuyển cát vào đất liền.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một đồng bằng châu thổ vừa được bồi tụ mở rộng, vừa bị sóng biển xâm thực ở cửa sông. Kết quả địa hình phụ thuộc vào:", "options": ["A. Tương quan giữa tốc độ bồi tụ của sông và tốc độ mài mòn của sóng.", "B. Chỉ phụ thuộc sông.", "C. Chỉ phụ thuộc sóng.", "D. Không phụ thuộc gì."], "answer": "A", "explain": "Địa hình cửa sông là kết quả tổng hợp: bồi tụ mạnh hơn thì đồng bằng tiến ra biển, mài mòn mạnh hơn thì bị xâm thực.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đứt gãy thuộc nội lực.", "b) Vận chuyển thuộc ngoại lực.", "c) Thác ghềnh do địa hình dốc và xâm thực.", "d) Cồn cát do gió bồi tụ."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trồng phi lao hạn chế cát bay.", "b) Cửa sông là nơi bồi tụ và mài mòn cùng tác động.", "c) Ngoại lực chỉ phá hủy, không bồi đắp.", "d) Sông miền núi nhiều thác do dốc và xâm thực."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: ngoại lực vừa bóc mòn vừa bồi tụ.", "points": 1}, {"type": "short", "level": "VD", "q": "Quá trình dời vật liệu khỏi vị trí ban đầu gọi là gì?", "answer": "Bóc mòn", "explain": "Bóc mòn là quá trình dời chuyển vật liệu khỏi vị trí ban đầu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cồn cát ven biển hình thành do gió làm gì với cát?", "answer": "Vận chuyển và bồi tụ", "explain": "Gió vận chuyển cát rồi bồi tụ thành cồn cát.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Nội lực sinh ra từ đâu?", "options": ["A. Bên trong Trái Đất.", "B. Mặt Trời.", "C. Mặt Trăng.", "D. Khí quyển."], "answer": "A", "explain": "Nội lực sinh ra từ bên trong Trái Đất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mài mòn là hình thức bóc mòn do:", "options": ["A. Sóng biển, băng hà.", "B. Gió.", "C. Nước mưa.", "D. Sinh vật."], "answer": "A", "explain": "Mài mòn do sóng biển và băng hà (còn gió là thổi mòn, nước chảy là xâm thực).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao băng hà có thể mài mòn, vận chuyển được cả tảng đá lớn?", "options": ["A. Vì khối băng hà khổng lồ, di chuyển chậm nhưng sức công phá rất lớn.", "B. Vì băng lạnh.", "C. Vì băng nhẹ.", "D. Vì băng trong suốt."], "answer": "A", "explain": "Băng hà khối lượng khổng lồ, khi trượt mang theo đá vụn mài mòn và vận chuyển cả tảng đá lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thung lũng hình chữ U là kết quả của:", "options": ["A. Băng hà mài mòn.", "B. Sông xâm thực.", "C. Gió thổi mòn.", "D. Động đất."], "answer": "A", "explain": "Băng hà mài mòn tạo thung lũng hình chữ U (khác thung lũng sông hình chữ V).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ở vùng núi cao Việt Nam (như Fansipan), đá thường nứt vỡ thành mảng. Nguyên nhân chính là:", "options": ["A. Phong hóa lí học do chênh lệch nhiệt độ ngày đêm lớn.", "B. Động đất.", "C. Núi lửa.", "D. Con người đập đá."], "answer": "A", "explain": "Vùng núi cao biên độ nhiệt ngày đêm lớn → đá co giãn, nứt vỡ (phong hóa lí học).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một công trình thủy điện cần đánh giá xói mòn lưu vực. Yếu tố ngoại lực nào cần quan tâm nhất?", "options": ["A. Xâm thực (nước mưa, dòng chảy) gây xói mòn, bồi lấp lòng hồ.", "B. Động đất.", "C. Gió.", "D. Thủy triều."], "answer": "A", "explain": "Xâm thực gây xói mòn đất, bồi lấp lòng hồ làm giảm tuổi thọ công trình thủy điện.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nội lực từ bên trong Trái Đất.", "b) Mài mòn do sóng biển, băng hà.", "c) Thung lũng chữ U do băng hà.", "d) Phong hóa lí học do nước hòa tan."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: nước hòa tan là phong hóa hóa học.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Băng hà vận chuyển được tảng đá lớn.", "b) Fansipan đá nứt do chênh lệch nhiệt.", "c) Xâm thực gây bồi lấp lòng hồ thủy điện.", "d) Thung lũng sông hình chữ U."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thung lũng sông thường hình chữ V; chữ U là do băng hà.", "points": 1}, {"type": "short", "level": "VD", "q": "Thung lũng hình chữ U do quá trình nào tạo thành?", "answer": "Băng hà mài mòn", "explain": "Băng hà mài mòn tạo thung lũng hình chữ U.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Kể tên 4 quá trình của ngoại lực theo thứ tự.", "answer": "Phong hóa, bóc mòn, vận chuyển, bồi tụ", "explain": "Phong hóa → bóc mòn → vận chuyển → bồi tụ.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Uốn nếp là kết quả của vận động:", "options": ["A. Nén ép theo phương nằm ngang.", "B. Nâng lên theo phương thẳng đứng.", "C. Phong hóa.", "D. Bồi tụ."], "answer": "A", "explain": "Nén ép theo phương nằm ngang làm các lớp đá bị uốn nếp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thổi mòn là hình thức bóc mòn do:", "options": ["A. Gió.", "B. Nước.", "C. Băng.", "D. Sóng."], "answer": "A", "explain": "Thổi mòn do gió (ở sa mạc, ven biển).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nếp uốn thường tạo thành các dãy núi?", "options": ["A. Vì nén ép làm các lớp đá nhô cao lên thành nếp lồi (núi).", "B. Vì núi lửa phun.", "C. Vì gió đắp.", "D. Vì ngẫu nhiên."], "answer": "A", "explain": "Nén ép uốn các lớp đá thành nếp lồi (khúc uốn lên) tạo dãy núi uốn nếp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Địa hào thường trở thành nơi:", "options": ["A. Trũng thấp, được bồi đắp thành đồng bằng, thung lũng.", "B. Núi cao.", "C. Sa mạc.", "D. Biển sâu."], "answer": "A", "explain": "Địa hào là phần hạ xuống nên trũng thấp, thường được bồi đắp thành đồng bằng, thung lũng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Dãy Hoàng Liên Sơn (Tây Bắc) có nhiều đỉnh cao trên 2 000 m. Nguyên nhân địa chất chính là:", "options": ["A. Vận động nâng (nội lực) kết hợp uốn nếp, đứt gãy.", "B. Gió bồi đắp.", "C. Sóng biển.", "D. Băng hà."], "answer": "A", "explain": "Hoàng Liên Sơn được nâng cao bởi nội lực (nâng, uốn nếp, đứt gãy).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vùng có nếp oằn (uốn nếp thoải) rộng lớn. Địa hình đó phù hợp phát triển gì?", "options": ["A. Nông nghiệp (địa hình thoải, đất dày) và giao thông.", "B. Thủy điện lớn.", "C. Leo núi mạo hiểm.", "D. Không phù hợp gì."], "answer": "A", "explain": "Nếp oằn tạo địa hình đồi thoải, đất dày — thuận lợi cho nông nghiệp và giao thông.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Uốn nếp do nén ép nằm ngang.", "b) Thổi mòn do gió.", "c) Địa hào là vùng trũng được bồi đắp.", "d) Nếp uốn tạo đồng bằng."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: nếp uốn (nếp lồi) tạo núi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hoàng Liên Sơn do nội lực nâng cao.", "b) Nếp oằn thuận lợi cho nông nghiệp.", "c) Địa lũy là phần hạ xuống.", "d) Nén ép tạo nếp lồi thành núi."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: địa lũy là phần nâng lên.", "points": 1}, {"type": "short", "level": "VD", "q": "Nếp lồi do uốn nếp thường tạo thành dạng địa hình gì?", "answer": "Núi", "explain": "Nếp lồi (khúc uốn lên) tạo thành núi, dãy núi uốn nếp.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hoàng Liên Sơn được nâng cao chủ yếu do lực nào?", "answer": "Nội lực", "explain": "Do vận động nâng, uốn nếp, đứt gãy của nội lực.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Quá trình nào sau đây KHÔNG thuộc ngoại lực?", "options": ["A. Động đất.", "B. Phong hóa.", "C. Bóc mòn.", "D. Bồi tụ."], "answer": "A", "explain": "Động đất là biểu hiện của nội lực; các quá trình còn lại thuộc ngoại lực.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Núi lửa là biểu hiện của:", "options": ["A. Nội lực.", "B. Ngoại lực.", "C. Phong hóa.", "D. Bồi tụ."], "answer": "A", "explain": "Núi lửa (macma phun trào) là biểu hiện của nội lực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao động đất và núi lửa thường đi kèm nhau ở đới hút chìm?", "options": ["A. Vì cùng do mảng hút chìm gây ra: ma sát gây động đất, mảng chìm nóng chảy tạo macma gây núi lửa.", "B. Vì ngẫu nhiên.", "C. Vì núi lửa gây động đất duy nhất.", "D. Vì động đất gây núi lửa duy nhất."], "answer": "A", "explain": "Cùng một nguyên nhân (hút chìm) sinh ra cả động đất (ma sát, đứt gãy) và núi lửa (macma).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vùng đất bị hạ xuống, biển lấn vào. Hiện tượng này là:", "options": ["A. Biển tiến do vận động hạ xuống.", "B. Biển thoái.", "C. Núi lửa.", "D. Động đất."], "answer": "A", "explain": "Đất hạ xuống (hoặc nước dâng) làm biển lấn vào đất liền — biển tiến.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đồng bằng Hà Lan nằm thấp hơn mực nước biển. Nguyên nhân địa chất và giải pháp là:", "options": ["A. Vùng đang hạ xuống (nội lực); giải pháp: đê biển, cống ngăn mặn.", "B. Do mưa nhiều.", "C. Do sông bồi đắp.", "D. Không có giải pháp."], "answer": "A", "explain": "Hà Lan hạ xuống nên phải đắp đê biển, làm cống để chống biển tiến.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một khu vực có địa hình vừa được nâng lên (nội lực) vừa bị sông xâm thực mạnh (ngoại lực). Dạng địa hình đặc trưng có thể là:", "options": ["A. Hẻm vực, khe sâu (sông cắt xuống khối nâng).", "B. Đồng bằng.", "C. Sa mạc.", "D. Đầm lầy."], "answer": "A", "explain": "Khối nâng lên + sông xâm thực cắt xuống tạo hẻm vực sâu (ví dụ hẻm vực sông Nho Quế).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Động đất thuộc nội lực.", "b) Núi lửa thuộc nội lực.", "c) Biển tiến do đất hạ xuống.", "d) Phong hóa thuộc nội lực."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: phong hóa thuộc ngoại lực.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đới hút chìm vừa có động đất vừa có núi lửa.", "b) Hà Lan phải đắp đê chống biển tiến.", "c) Hẻm vực do nâng và xâm thực.", "d) Ngoại lực làm địa hình gồ ghề hơn."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: ngoại lực san bằng địa hình.", "points": 1}, {"type": "short", "level": "VD", "q": "Hiện tượng biển lấn vào đất liền gọi là gì?", "answer": "Biển tiến", "explain": "Biển lấn vào đất liền gọi là biển tiến (ngược lại là biển thoái).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hẻm vực sâu do sông cắt xuống khối núi đang nâng là kết quả tổng hợp của 2 lực nào?", "answer": "Nội lực và ngoại lực", "explain": "Nâng (nội lực) + xâm thực (ngoại lực) tạo hẻm vực.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Tác động của ngoại lực đến địa hình là:", "options": ["A. San bằng địa hình.", "B. Nâng cao địa hình.", "C. Tạo đứt gãy.", "D. Gây động đất."], "answer": "A", "explain": "Ngoại lực san bằng địa hình: phá nơi cao, bồi nơi thấp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tác động của nội lực đến địa hình là:", "options": ["A. Làm địa hình gồ ghề, cao thấp.", "B. San bằng địa hình.", "C. Không thay đổi.", "D. Chỉ tạo đồng bằng."], "answer": "A", "explain": "Nội lực làm địa hình gồ ghề, phân bậc cao thấp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thứ tự đúng của các quá trình ngoại lực là:", "options": ["A. Phong hóa → bóc mòn → vận chuyển → bồi tụ.", "B. Bồi tụ → phong hóa → bóc mòn → vận chuyển.", "C. Vận chuyển → phong hóa → bồi tụ → bóc mòn.", "D. Bóc mòn → bồi tụ → phong hóa → vận chuyển."], "answer": "A", "explain": "Đá phong hóa vỡ vụn → bị bóc mòn dời đi → vận chuyển → bồi tụ nơi khác.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phải bảo vệ rừng đầu nguồn?", "options": ["A. Vì rừng hạn chế xói mòn, lũ quét, bảo vệ đất và nguồn nước.", "B. Vì rừng đẹp.", "C. Vì rừng cho gỗ.", "D. Vì luật quy định duy nhất."], "answer": "A", "explain": "Rừng đầu nguồn giữ đất, điều hòa nước — chống xói mòn, lũ quét, bảo vệ đất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một bãi biển đẹp bị sóng xâm thực mạnh, bờ biển lùi dần. Biện pháp nào phù hợp?", "options": ["A. Kè chắn sóng, trồng cây chắn sóng, quy hoạch tránh xây dựng sát mép xâm thực.", "B. Đổ thêm cát ra biển.", "C. Cấm du lịch.", "D. Không làm gì."], "answer": "A", "explain": "Kè chắn sóng và cây chắn sóng giảm năng lượng sóng, hạn chế xâm thực bờ biển.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đánh giá: 'Con người có thể ngăn chặn hoàn toàn tác động của nội lực và ngoại lực'.", "options": ["A. Sai, con người không ngăn được nội lực/ngoại lực, chỉ có thể thích ứng, giảm thiệt hại và lợi dụng mặt tích cực.", "B. Đúng, con người làm được mọi việc.", "C. Đúng với ngoại lực.", "D. Không đánh giá được."], "answer": "A", "explain": "Nội/ngoại lực là quy luật tự nhiên; con người thích ứng (chống động đất, chống xói mòn) và khai thác mặt tích cực (phù sa, cảnh quan).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ngoại lực san bằng địa hình.", "b) Nội lực làm địa hình gồ ghề.", "c) Thứ tự: phong hóa, bóc mòn, vận chuyển, bồi tụ.", "d) Con người ngăn được hoàn toàn nội lực."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: chỉ thích ứng và giảm thiệt hại.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Rừng đầu nguồn chống xói mòn, lũ quét.", "b) Kè chắn sóng hạn chế xâm thực bờ biển.", "c) Phù sa là mặt tích cực của ngoại lực.", "d) Nội lực và ngoại lực độc lập tuyệt đối."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: hai lực đối kháng nhưng thống nhất.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết đúng thứ tự 4 quá trình của ngoại lực (cách nhau bằng dấu phẩy).", "answer": "Phong hóa, bóc mòn, vận chuyển, bồi tụ", "explain": "Phong hóa → bóc mòn → vận chuyển → bồi tụ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Con người có ngăn chặn hoàn toàn được nội lực không? (trả lời: có hoặc không)", "answer": "Không", "explain": "Không; con người chỉ thích ứng, giảm thiệt hại và khai thác mặt tích cực.", "points": 0.5}]}]}</script>
