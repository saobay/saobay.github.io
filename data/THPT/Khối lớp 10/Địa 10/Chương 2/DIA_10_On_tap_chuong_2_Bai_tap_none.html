{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Trái Đất ra đời cách đây khoảng:", "options": ["A. 4,6 tỉ năm.", "B. 4,6 triệu năm.", "C. 460 năm.", "D. 46 tỉ năm."], "answer": "A", "explain": "Trái Đất hình thành cách đây khoảng 4,6 tỉ năm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một ngày sao kéo dài:", "options": ["A. 23 giờ 56 phút 4 giây.", "B. 24 giờ.", "C. 12 giờ.", "D. 365 ngày."], "answer": "A", "explain": "Một ngày sao = 23 giờ 56 phút 4 giây (thời gian tự quay một vòng).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao vỏ đại dương nằm thấp hơn vỏ lục địa?", "options": ["A. Vì vỏ đại dương bằng đá bazan nặng và mỏng hơn vỏ lục địa bằng đá granit nhẹ.", "B. Vì nước biển nặng.", "C. Vì đại dương không có núi.", "D. Vì Trái Đất quay nhanh."], "answer": "A", "explain": "Vỏ đại dương (bazan nặng, 5 – 10 km) chìm thấp hơn vỏ lục địa (granit nhẹ, 25 – 70 km).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lực Coriolis có hướng lệch như thế nào?", "options": ["A. Bắc lệch phải, Nam lệch trái.", "B. Bắc lệch trái, Nam lệch phải.", "C. Đều lệch phải.", "D. Đều lệch trái."], "answer": "A", "explain": "Lực Coriolis làm lệch về bên phải ở bán cầu Bắc, bên trái ở bán cầu Nam.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đá vôi ở vùng núi cao chứa hóa thạch ốc biển. Kết luận hợp lí nhất là:", "options": ["A. Vùng đó xưa là biển, sau được nâng lên thành núi.", "B. Ốc biển leo lên núi.", "C. Con người mang ốc lên núi.", "D. Đá vôi tự sinh ra hóa thạch."], "answer": "A", "explain": "Hóa thạch biển trong đá vôi ở núi cao chứng tỏ khu vực từng là biển rồi được nâng lên.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một học sinh viết: 'Mùa hạ nóng do Trái Đất gần Mặt Trời'. Bằng chứng nào bác bỏ?", "options": ["A. Đầu tháng 7 Trái Đất xa Mặt Trời nhất nhưng Bắc bán cầu vẫn nóng nhất.", "B. Mùa hạ có bão.", "C. Mùa hạ ngày dài.", "D. Không có bằng chứng."], "answer": "A", "explain": "Ở vi uốc tế ở khoảng kinh tuyến 180°.", "points": 1}, {"type": "short", "level": "VD", "q": "Ngày 22/12, tia sáng chiếu thẳng góc với chí tuyến nào?", "answer": "Chí tuyến Nam", "explain": "Ngày 22/12 (đông chí ở Bắc bán cầu), tia sáng Mặt Trời chiếu thẳng góc với chí tuyến Nam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cát kết biến chất thành đá gì?", "answer": "Quaczit", "explain": "Cát kết biến chất thành quaczit.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Khoáng vật khác đá ở điểm nào?", "options": ["A. Khoáng vật là đơn chất/hợp chất tự nhiên; đá là tập hợp của khoáng vật.", "B. Khoáng vật cứng hơn đá.", "C. Khoáng vật chỉ có trong lòng đất.", "D. Không có điểm khác."], "answer": "A", "explain": "Khoáng vật là đơn chất hoặc hợp chất hóa học tự nhiên; đá là tập hợp của một hay nhiều loại khoáng vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hướng tự quay của Trái Đất là:", "options": ["A. Từ tây sang đông.", "B. Từ đông sang tây.", "C. Từ bắc xuống nam.", "D. Thẳng đứng."], "answer": "A", "explain": "Trái Đất tự quay quanh trục theo hướng từ tây sang đông.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao granit có hạt thô còn bazan có hạt mịn?", "options": ["A. Granit nguội chậm trong lòng đất, bazan nguội nhanh trên mặt đất.", "B. Granit ở trên núi, bazan ở dưới biển.", "C. Granit cổ hơn bazan.", "D. Granit bị phong hóa mạnh hơn."], "answer": "A", "explain": "Tốc độ nguội quyết định kích thước tinh thể: nguội chậm (xâm nhập) hạt thô, nguội nhanh (phun trào) hạt mịn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật chuyển động ở bán cầu Nam bị lệch về bên trái. Đó là tác dụng của:", "options": ["A. Lực Coriolis.", "B. Lực hấp dẫn.", "C. Lực ma sát.", "D. Lực đẩy Ác-si-mét."], "answer": "A", "explain": "Lực Coriolis do tự quay làm lệch chuyển động: Nam bán cầu lệch trái.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ở vùng núi đá vôi, mùa khô người dân thư có cực quang.", "D. Không có cơ sở khoa học."], "answer": "A", "explain": "60°B vào 22/6 có ngày dài gần 19 giờ, chạng vạng trắng đêm — 'đêm trắng'.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đá hoa từ đá vôi biến chất.", "b) 23/9 là thu phân ở Bắc bán cầu.", "c) Phong hóa lí học làm đá nứt vỡ do nhiệt.", "d) Gió không chịu tác dụng của Coriolis."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: gió chịu tác dụng của lực Coriolis.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hang động karst do nước hòa tan đá vôi.", "b) Đêm trắng do ngày dài ở vĩ độ cao mùa hạ.", "c) Núi đá vôi khan nước mặt vào mùa khô.", "d) Mọi đá trầm tích đều chứa dầu khí."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: chỉ một số bồn trầm tích có điều kiện mới sinh dầu khí.", "points": 1}, {"type": "short", "level": "VD", "q": "Ngày 21/3 được gọi là gì ở bán cầu Bắc?", "answer": "Xuân phân", "explain": "21/3 là xuân phân ở bán cầu Bắc.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết tên đá trầm tích hữu cơ từ xác thực vật, dùng làm nhiên liệu.", "answer": "Than đá", "explain": "Than đá là đá trầm tích hữu cơ từ xác thực vật.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Thạch anh là ví dụ của:", "options": ["A. Khoáng vật.", "B. Đá trầm tích.", "C. Đá biến chất.", "D. Nhiên liệu."], "answer": "A", "explain": "Thạch anh là một loại khoáng vật phổ biến.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tia sáng Mặt Trời trong năm lần lượt chiếu thẳng góc với các vĩ tuyến trong phạm vi:", "options": ["A. Giữa hai chí tuyến.", "B. Vùng cực.", "C. Toàn cầu.", "D. Vùng ôn đới."], "answer": "A", "explain": "Tia sáng chỉ chiếu thẳng góc trong vùng nội chí tuyến (23°27'B – 23°27'N).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao vùng ngoại chí tuyến không có Mặt Trời lên thiên đỉnh?", "options": ["A. Vì tia sáng không bao giờ chiếu thẳng góc ngoài hai chí tuyến.", "B. Vì vùng đó quá lạnh.", "C. Vì Trái Đất không quay.", "D. Vì mây che phủ."], "answer": "A", "explain": "Ngoài chí tuyến, góc nhập xạ luôn nhỏ hơn 90°.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dấu hiệu nào chứng tỏ vùng đá từng chịu nén ép mạnh?", "options": ["A. Các lớp đá bị uốn nếp, đứt gãy.", "B. Đá nằm ngang.", "C. Đá có màu đỏ.", "D. Đá xốp."], "answer": "A", "explain": "Uốn nếp, đứt gãy là bằng chứng của vận động nén ép (nội lực).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một trận bóng đá lúc 20 giờ ở Luân Đôn (UTC+0). Ở Hà Nội (UTC+7) xem trực tiếp lúc:", "options": ["A. 3 giờ sáng hôm sau.", "B. 13 giờ.", "C. 20 giờ.", "D. 1 giờ sáng."], "answer": "A", "explain": "20 + 7 = 27 giờ = 3 giờ sáng hôm sau.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nếu một năm chỉ có 365 ngày mà không có năm nhuận, điều gì xảy ra lâu dài?", "options": ["A. Lịch dần lệch khỏi mùa vụ (mỗi năm lệch 6 giờ).", "B. Không có gì xảy ra.", "C. Một năm ngắn đi.", "D. Mùa biến mất."], "answer": "A", "explain": "Mỗi năm dư 6 giờ; không nhuận thì lịch lệch dần khỏi chu kì mùa (khoảng 1 ngày sau 4 năm).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thạch anh là khoáng vật.", "b) Tia sáng chiếu thẳng góc trong vùng nội chí tuyến.", "c) Ngoại chí tuyến có Mặt Trời lên thiên đỉnh.", "d) Uốn nếp chứng tỏ nén ép."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Không nhuận thì lịch lệch khỏi mùa.", "b) 4 năm có 1 năm nhuận 366 ngày.", "c) Ngày sao ngắn hơn ngày Mặt Trời.", "d) Tốc độ góc tự quay khác nhau theo vĩ độ."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: tốc độ góc như nhau mọi nơi.", "points": 1}, {"type": "short", "level": "VD", "q": "Mỗi năm dư ra 6 giờ so với 365 ngày. Sau mấy năm thì dồn đủ 24 giờ để có 1 ngày nhuận?", "answer": "4", "explain": "4 × 6 giờ = 24 giờ = 1 ngày nhuận (29/2).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết tên hiện tượng: Mặt Trời không mọc suốt 24 giờ ở vùng cực.", "answer": "Đêm cực", "explain": "Đêm cực: suốt 24 giờ đều là ban đêm ở vùng cực.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Vỏ Trái Đất gồm:", "options": ["A. Các địa mảng luôn chuyển động.", "B. Một khối đá bất động.", "C. Toàn nước.", "D. Toàn khí."], "answer": "A", "explain": "Vỏ Trái Đất gồm các địa mảng nằm kề nhau, luôn chuyển động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngày Mặt Trời dài:", "options": ["A. 24 giờ.", "B. 23 giờ 56 phút.", "C. 12 giờ.", "D. 365 ngày."], "answer": "A", "explain": "Ngày Mặt Trời (từ lúc Mặt Trời lên cao nhất hôm nay đến hôm sau) dài 24 giờ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao ngày Mặt Trời dài hơn ngày sao?", "options": ["A. Vì Trái Đất vừa tự quay vừa dịch chuyển trên quỹ đạo nên phải quay thêm một góc nhỏ.", "B. Vì đồng hồ sai.", "C. Vì Mặt Trời to.", "D. Vì Trái Đất quay chậm dần."], "answer": "A", "explain": "Dịch chuyển trên quỹ đạo làm Trái Đất phải quay thêm ~4 phút mới hoàn thành một ngày Mặt Trời.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ở hai cực, tốc độ dài tự quay bằng bao nhiêu?", "options": ["A. 0 m/s.", "B. 465 m/s.", "C. 15 m/s.", "D. 100 m/s."], "answer": "A", "explain": "Hai cực nằm trên trục quay nên tốc độ dài bằng 0.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Người ta khai thác cát thạch anh để làm thủy tinh. Mối liên hệ là:", "options": ["A. Thạch anh (silic) là nguyên liệu chính của thủy tinh.", "B. Cát tự biến thành thủy tinh.", "C. Không liên quan.", "D. Thủy tinh tạo ra thạch anh."], "answer": "A", "explain": "Thạch anh giàu silic — nguyên liệu chính sản xuất thủy tinh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật rơi tự do từ tháp cao ở bán cầu Bắc bị lệch về phía đông so với chân tháp. Nguyên nhân là:", "options": ["A. Lực Coriolis và tốc độ dài tự quay ở đỉnh tháp lớn hơn ở chân tháp.", "B. Gió thổi.", "C. Tháp nghiêng.", "D. Trái Đất hút lệch."], "answer": "A", "explain": "Đỉnh tháp xa trục quay hơn nên tốc độ dài lớn hơn; khi rơi, vật giữ quán tính lệch về phía đông (biểu hiện của Coriolis).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Các địa mảng luôn chuyển động.", "b) Ngày Mặt Trời dài 24 giờ.", "c) Ở cực, tốc độ dài tự quay bằng 0.", "d) Thạch anh là đá."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thạch anh là khoáng vật.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ngày Mặt Trời dài hơn ngày sao do dịch chuyển quỹ đạo.", "b) Vật rơi ở Bắc bán cầu lệch đông.", "c) Cát thạch anh làm thủy tinh.", "d) Tốc độ dài tự quay lớn nhất ở cực."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: lớn nhất ở xích đạo.", "points": 1}, {"type": "short", "level": "VD", "q": "Tốc độ góc trong vận động tự quay của Trái Đất là bao nhiêu độ mỗi giờ?", "answer": "15", "explain": "Trái Đất quay 360° trong khoảng 24 giờ nên tốc độ góc là 15°/giờ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết tên 3 loại đá chính (cách nhau bằng dấu phẩy).", "answer": "Đá macma, đá trầm tích, đá biến chất", "explain": "Ba loại đá chính: macma, trầm tích, biến chất.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Lúc đầu Trái Đất là:", "options": ["A. Khối khí nóng sáng.", "B. Khối băng.", "C. Khối nước.", "D. Khối đá rắn."], "answer": "A", "explain": "Lúc đầu Trái Đất là khối khí nóng sáng, sau nguội dần.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hệ quả nào KHÔNG phải của tự quay?", "options": ["A. Các mùa trong năm.", "B. Ngày đêm luân phiên.", "C. Lực Coriolis.", "D. Múi giờ."], "answer": "A", "explain": "Các mùa là hệ quả của quay quanh Mặt Trời.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao các mỏ dầu khí gắn với đá trầm tích?", "options": ["A. Vì dầu khí từ xác sinh vật bị vùi lấp trong bồn trầm tích.", "B. Vì đá trầm tích cứng.", "C. Vì dầu khí do núi lửa tạo.", "D. Vì đá trầm tích ở mặt đất."], "answer": "A", "explain": "Dầu khí hình thành từ xác sinh vật biển bị vùi lấp trong các bồn trầm tích.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hệ quả nào KHÔNG phải của quay quanh Mặt Trời?", "options": ["A. Sự luân phiên ngày đêm.", "B. Các mùa.", "C. Ngày đêm dài ngắn theo mùa.", "D. Chuyển động biểu kiến hằng năm."], "answer": "A", "explain": "Ngày đêm luân phiên là hệ quả của tự quay quanh trục.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai thành phố A (100°Đ) và B (130°Đ). Khi A là 12 giờ thì B là:", "options": ["A. 14 giờ.", "B. 10 giờ.", "C. 12 giờ.", "D. 16 giờ."], "answer": "A", "explain": "Chênh 30° = 2 giờ; B phía đông nên 12 + 2 = 14 giờ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một nhà địa chất tìm than đá nên tìm ở đâu?", "options": ["A. Các bồn trầm tích cổ.", "B. Miệng núi lửa.", "C. Vùng đá granit.", "D. Đáy đại dương hiện tại."], "answer": "A", "explain": "Than đá là đá trầm tích hữu cơ nên tìm trong các bồn trầm tích cổ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lúc đầu Trái Đất là khối khí nóng.", "b) Các mùa do quay quanh Mặt Trời.", "c) Dầu khí gắn với đá trầm tích.", "d) Ngày đêm luân phiên do quay quanh Mặt Trời."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: do tự quay quanh trục.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chênh 30° kinh tuyến thì giờ chênh 2 giờ.", "b) Than đá tìm trong bồn trầm tích.", "c) Trục Trái Đất đổi phương liên tục.", "d) Quỹ đạo hình elip."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: trục không đổi phương.", "points": 1}, {"type": "short", "level": "VD", "q": "Chênh 45° kinh tuyến thì giờ địa phương chênh bao nhiêu giờ?", "answer": "3", "explain": "45 : 15 = 3 giờ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết tên đá biến chất từ đá vôi.", "answer": "Đá hoa", "explain": "Đá vôi biến chất thành đá hoa.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Đá là:", "options": ["A. Tập hợp của một hay nhiều loại khoáng vật.", "B. Một khoáng vật tinh khiết.", "C. Nước đóng băng.", "D. Kim loại."], "answer": "A", "explain": "Đá là tập hợp của một hay nhiều loại khoáng vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trục Trái Đất nghiêng bao nhiêu so với mặt phẳng quỹ đạo?", "options": ["A. 66°33'.", "B. 90°.", "C. 0°.", "D. 45°."], "answer": "A", "explain": "Trục nghiêng 66°33' so với mặt phẳng quỹ đạo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao vỏ lục địa nổi cao hơn vỏ đại dương?", "options": ["A. Vì vỏ lục địa bằng đá granit nhẹ, dày hơn.", "B. Vì lục địa không bị xói mòn.", "C. Vì đại dương sâu.", "D. Vì Trái Đất quay."], "answer": "A", "explain": "Vỏ lục địa (granit nhẹ, dày) nổi cao hơn vỏ đại dương (bazan nặng, mỏng).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân biệt đúng 'ngày sao' và 'ngày Mặt Trời':", "options": ["A. Ngày sao 23h56'04'' (một vòng tự quay); ngày Mặt Trời 24h (Mặt Trời lên cao nhất hai lần liên tiếp).", "B. Hai khái niệm giống nhau.", "C. Ngày sao dài hơn.", "D. Ngày Mặt Trời chỉ ở cực."], "answer": "A", "explain": "Ngày sao đo một vòng tự quay tuyệt đối (23h56'04''); ngày Mặt Trời dài hơn ~4 phút.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đồng bằng sông Cửu Long có lớp trầm tích dày hàng nghìn mét. Điều này cho biết:", "options": ["A. Vùng sụt lún, nhận bồi đắp liên tục trong quá khứ.", "B. Vùng từng là núi cao.", "C. Vùng là miệng núi lửa.", "D. Không có ý nghĩa."], "answer": "A", "explain": "Trầm tích dày chứng tỏ sụt lún lâu dài, liên tục nhận phù sa bồi đắp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đánh giá: 'Đá càng cứng thì càng trẻ'.", "options": ["A. Sai, độ cứng không quyết định tuổi; tuổi xác định bằng địa tầng và hóa thạch.", "B. Đúng.", "C. Đúng với đá trầm tích.", "D. Không kiểm chứng được."], "answer": "A", "explain": "Độ cứng không liên quan tuổi; tuổi tương đối dựa vào chồng chất địa tầng và hóa thạch chỉ thị.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đá là tập hợp khoáng vật.", "b) Trục nghiêng 66°33'.", "c) Vỏ lục địa nhẹ hơn vỏ đại dương.", "d) Ngày sao dài hơn ngày Mặt Trời."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trầm tích dày chứng tỏ sụt lún bồi đắp.", "b) Tuổi đá xác định bằng địa tầng, hóa thạch.", "c) Độ cứng quyết định tuổi đá.", "d) Hai bán cầu mùa trái ngược."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Kể tên 2 loại đá macma (cách nhau bằng dấu phẩy).", "answer": "Đá granit, đá bazan", "explain": "Đá granit (xâm nhập) và đá bazan (phun trào) là hai loại đá macma điển hình.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Kể tên 2 hệ quả của tự quay (cách nhau bằng dấu phẩy).", "answer": "Ngày đêm luân phiên, lực Coriolis", "explain": "Ngày đêm luân phiên, giờ/múi giờ, lực Coriolis, chuyển động biểu kiến hằng ngày.", "points": 0.5}]}]}</script>
