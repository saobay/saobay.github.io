", "D. 360°/ngày."], "answer": "A", "explain": "Trái Đất quay 360° trong khoảng 24 giờ nên tốc độ góc là 15°/giờ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao các địa điểm ở kinh tuyến khác nhau lại có giờ khác nhau?", "options": ["A. Vì Trái Đất hình cầu và tự quay từ tây sang đông nên các nơi lần lượt đón ánh sáng Mặt Trời.", "B. Vì đồng hồ mỗi nơi chạy khác nhau.", "C. Vì Mặt Trời di chuyển.", "D. Vì con người quy định ngẫu nhiên."], "answer": "A", "explain": "Do tự quay từ tây sang đông, nơi ở phía đông đón bình minh sớm hơn nên giờ sớm hơn nơi phía tây.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lực Coriolis ảnh hưởng đến đối tượng nào sau đây?", "options": ["A. Hướng gió thổi và hướng dòng biển.", "B. Sự mọc của cây.", "C. Màu sắc của đất.", "D. Độ cao của núi."], "answer": "A", "explain": "Lực Coriolis làm lệch hướng chuyển động của không khí (gió) và nước biển (dòng biển).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tokyo (múi +9) đang là 12 giờ trưa. Ở Hà Nội (múi +7) là mấy giờ?", "options": ["A. 10 giờ sáng.", "B. 14 giờ.", "C. 12 giờ trưa.", "D. 9 giờ sáng."], "answer": "A", "explain": "Chênh 2 múi giờ; Hà Nội ở phía tây nên giờ muộn hơn: 12 − 2 = 10 giờ sáng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một con tàu đi từ đông sang tây qua đường chuyển ngày quốc tế vào ngày 10/10. Theo quy ước, ngày trên tàu sẽ là:", "options": ["A. 11/10 (cộng thêm 1 ngày).", "B. 9/10 (lùi 1 ngày).", "C. Vẫn 10/10.", "D. 12/10."], "answer": "A", "explain": "Đi từ đông sang tây qua đường chuyển ngày quốc tế thì cộng thêm 1 ngày: 10/10 thành 11/10.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tự quay quanh trục sinh ra sự luân phiên ngày đêm.", "b) Tự quay quanh trục sinh ra các mùa.", "c) Tự quay quanh trục sinh ra lực Coriolis.", "d) Tự quay quanh trục làm các nơi khác kinh tuyến có giờ khác nhau."], "answer": ["T", "F", "T", "T"], "explain": "a, c, d đúng. b sai: các mùa là hệ quả của quay quanh Mặt Trời.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tốc độ dài tự quay giảm dần từ xích đạo về hai cực.", "b) Ở hai cực, tốc độ dài tự quay bằng 0.", "c) Mọi điểm trên Trái Đất có tốc độ góc tự quay như nhau.", "d) Hướng tự quay là từ đông sang tây."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: hướng tự quay là từ tây sang đông.", "points": 1}, {"type": "short", "level": "VD", "q": "Chênh lệch 1 giờ tương ứng với bao nhiêu độ kinh tuyến?", "answer": "15", "explain": "24 múi giờ ứng với 360° nên 1 giờ = 15° kinh tuyến.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Lực Coriolis làm lệch hướng chuyển động về bên phải ở bán cầu nào?", "answer": "Bán cầu Bắc", "explain": "Ở bán cầu Bắc, lực Coriolis làm lệch về bên phải hướng chuyển động.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Hệ quả nào sau đây là của vận động quay quanh Mặt Trời?", "options": ["A. Các mùa trong năm.", "B. Sự luân phiên ngày đêm.", "C. Giờ địa phương.", "D. Lực Coriolis."], "answer": "A", "explain": "Các mùa trong năm là hệ quả của vận động quay quanh Mặt Trời (kết hợp trục nghiêng).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vào ngày 21/3, hiện tượng ngày đêm trên Trái Đất như thế nào?", "options": ["A. Mọi nơi ngày đêm dài bằng nhau.", "B. Bán cầu Bắc ngày dài hơn đêm.", "C. Bán cầu Nam ngày dài hơn đêm.", "D. Vùng cực có ngày cực."], "answer": "A", "explain": "Ngày 21/3 (xuân phân), tia sáng chiếu thẳng góc xích đạo nên mọi nơi ngày đêm bằng nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao ở xích đạo quanh năm ngày đêm dài gần bằng nhau?", "options": ["A. Vì xích đạo luôn nhận tia sáng gần như thẳng góc, ít chịu ảnh hưởng của sự thay đổi góc chiếu theo mùa.", "B. Vì xích đạo không tự quay.", "C. Vì xích đạo xa Mặt Trời.", "D. Vì xích đạo không có mùa."], "answer": "A", "explain": "Ở xích đạo, góc nhập xạ luôn lớn và ít thay đổi theo mùa nên ngày đêm gần bằng nhau quanh năm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiện tượng ngày cực, đêm cực xảy ra ở đâu?", "options": ["A. Vùng cực.", "B. Xích đạo.", "C. Chí tuyến.", "D. Vùng ôn đới."], "answer": "A", "explain": "Ở vùng cực, do trục nghiêng nên có thời kì suốt 24 giờ là ban ngày (ngày cực) hoặc ban đêm (đêm cực).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ở Việt Nam (bán cầu Bắc), ngày 22/6 có đặc điểm gì?", "options": ["A. Ngày dài nhất trong năm.", "B. Đêm dài nhất trong năm.", "C. Ngày đêm bằng nhau.", "D. Có đêm cực."], "answer": "A", "explain": "Ngày 22/6 là hạ chí ở bán cầu Bắc: ngày dài nhất, đêm ngắn nhất trong năm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một du khách muốn ngắm 'đêm trắng' (mặt trời không lặn). Nên đến đâu và vào thời gian nào?", "options": ["A. Vùng cực Bắc vào khoảng tháng 6 (mùa hạ bán cầu Bắc, có ngày cực).", "B. Xích đạo vào tháng 6.", "C. Vùng cực Nam vào tháng 6.", "D. Chí tuyến Bắc vào tháng 12."], "answer": "A", "explain": "Tháng 6, cực Bắc ngả về Mặt Trời nên vùng cực Bắc có ngày cực — mặt trời không lặn ('đêm trắng').", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quay quanh Mặt Trời sinh ra các mùa.", "b) Quay quanh Mặt Trời làm ngày đêm luân phiên.", "c) Ngày 22/12, bán cầu Nam có ngày dài nhất.", "d) Trục Trái Đất không đổi phương khi quay quanh Mặt Trời."], "answer": ["T", "F", "T", "T"], "explain": "a đúng; b sai (ngày đêm luân phiên do tự quay); c đúng (hạ chí ở Nam); d đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Càng về phía cực, chênh lệch ngày đêm theo mùa càng lớn.", "b) Ở xích đạo, ngày đêm gần bằng nhau quanh năm.", "c) Ngày 23/9, tia sáng chiếu thẳng góc chí tuyến Nam.", "d) Mùa ở hai bán cầu trái ngược nhau."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: 23/9 tia sáng chiếu thẳng góc xích đạo.", "points": 1}, {"type": "short", "level": "VD", "q": "Ngày 22/12, tia sáng Mặt Trời chiếu thẳng góc với vĩ tuyến nào?", "answer": "Chí tuyến Nam", "explain": "Ngày 22/12 (đông chí ở Bắc, hạ chí ở Nam), tia sáng chiếu thẳng góc chí tuyến Nam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hiện tượng suốt 24 giờ đều là ban ngày ở vùng cực gọi là gì?", "answer": "Ngày cực", "explain": "Hiện tượng suốt 24 giờ là ban ngày ở vùng cực gọi là ngày cực (ngược lại là đêm cực).", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Việt Nam thuộc múi giờ số mấy (giờ quốc tế)?", "options": ["A. Múi giờ +7.", "B. Múi giờ +8.", "C. Múi giờ +9.", "D. Múi giờ +0."], "answer": "A", "explain": "Việt Nam dùng giờ UTC+7 (múi giờ số 7).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đường chuyển ngày quốc tế đi qua đâu?", "options": ["A. Khoảng kinh tuyến 180°, giữa múi giờ số 12.", "B. Kinh tuyến 0°.", "C. Xích đạo.", "D. Chí tuyến Bắc."], "answer": "A", "explain": "Đường chuyển ngày quốc tế đi qua giữa múi giờ số 12, khoảng kinh tuyến 180°.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao khi bay từ Việt Nam sang Mỹ (về phía đông), hành khách thường bị 'lệch múi giờ' (jet lag)?", "options": ["A. Vì chênh lệch múi giờ lớn, đồng hồ sinh học chưa kịp thích nghi với ngày đêm mới.", "B. Vì máy bay bay quá nhanh.", "C. Vì ăn uống trên máy bay.", "D. Vì áp suất cabin."], "answer": "A", "explain": "Chênh lệch nhiều múi giờ làm đảo lộn nhịp ngày đêm của cơ thể — hiện tượng lệch múi giờ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Gió Mậu dịch ở bán cầu Bắc thổi theo hướng đông bắc – tây nam nhưng bị lệch. Đó là do:", "options": ["A. Lực Coriolis làm lệch về bên phải ở bán cầu Bắc.", "B. Núi chắn gió.", "C. Biển hút gió.", "D. Mặt Trăng hút."], "answer": "A", "explain": "Lực Coriolis do tự quay làm lệch hướng gió: ở bán cầu Bắc lệch phải.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một trận bóng đá diễn ra lúc 20 giờ ở Luân Đôn (múi +0). Ở Hà Nội (múi +7), người hâm mộ xem trực tiếp lúc mấy giờ?", "options": ["A. 3 giờ sáng hôm sau.", "B. 13 giờ.", "C. 20 giờ.", "D. 1 giờ sáng."], "answer": "A", "explain": "Chênh 7 múi giờ; Hà Nội phía đông nên muộn hơn: 20 + 7 = 27 giờ = 3 giờ sáng hôm sau.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai thành phố A (kinh tuyến 100°Đ) và B (kinh tuyến 130°Đ). Khi ở A là 12 giờ trưa thì ở B là mấy giờ?", "options": ["A. 14 giờ.", "B. 10 giờ.", "C. 12 giờ.", "D. 16 giờ."], "answer": "A", "explain": "Chênh 30° kinh tuyến = 2 giờ; B ở phía đông nên sớm hơn: 12 + 2 = 14 giờ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Có 24 múi giờ, mỗi múi rộng 15° kinh tuyến.", "b) Việt Nam thuộc múi giờ +7.", "c) Qua đường chuyển ngày quốc tế từ tây sang đông phải lùi 1 ngày.", "d) Giờ ở phía đông sớm hơn phía tây."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng: 24 múi giờ; Việt Nam UTC+7; quy tắc đường chuyển ngày; phía đông đón Mặt Trời sớm hơn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lực Coriolis do vận động tự quay sinh ra.", "b) Dòng biển cũng chịu ảnh hưởng của lực Coriolis.", "c) Tốc độ góc tự quay ở xích đạo lớn hơn ở ôn đới.", "d) Ngày sao dài hơn ngày Mặt Trời."], "answer": ["T", "T", "F", "F"], "explain": "a, b đúng. c sai (tốc độ góc như nhau mọi nơi); d sai (ngày sao 23h56' ngắn hơn ngày Mặt Trời 24h).", "points": 1}, {"type": "short", "level": "VD", "q": "Chênh lệch 30° kinh tuyến thì giờ địa phương chênh nhau bao nhiêu giờ?", "answer": "2", "explain": "15° = 1 giờ nên 30° = 2 giờ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đường chuyển ngày quốc tế nằm ở khoảng kinh tuyến bao nhiêu độ?", "answer": "180", "explain": "Đường chuyển ngày quốc tế ở khoảng kinh tuyến 180°.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Mùa hạ ở bán cầu Bắc kéo dài trong khoảng thời gian nào?", "options": ["A. Từ 22/6 đến 23/9.", "B. Từ 22/12 đến 21/3.", "C. Từ 21/3 đến 22/6.", "D. Từ 23/9 đến 22/12."], "answer": "A", "explain": "Mùa hạ ở bán cầu Bắc từ hạ chí (22/6) đến thu phân (23/9).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngày 22/12 được gọi là gì ở bán cầu Bắc?", "options": ["A. Đông chí.", "B. Hạ chí.", "C. Xuân phân.", "D. Thu phân."], "answer": "A", "explain": "Ngày 22/12 là đông chí ở bán cầu Bắc (đêm dài nhất).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao mùa hạ ở bán cầu Bắc nóng hơn mùa đông?", "options": ["A. Vì mùa hạ tia sáng chiếu gần thẳng góc hơn, thời gian chiếu sáng dài hơn nên lượng nhiệt nhận được nhiều hơn.", "B. Vì mùa hạ Trái Đất gần Mặt Trời hơn nhiều.", "C. Vì mùa hạ ngày ngắn hơn.", "D. Vì mùa hạ có bão."], "answer": "A", "explain": "Mùa hạ, bán cầu Bắc ngả về Mặt Trời: góc nhập xạ lớn, ngày dài nên nhận nhiều nhiệt hơn mùa đông.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ở bán cầu Nam, tháng 12 là mùa gì?", "options": ["A. Mùa hạ.", "B. Mùa đông.", "C. Mùa xuân.", "D. Mùa thu."], "answer": "A", "explain": "Tháng 12, bán cầu Nam ngả về phía Mặt Trời nên là mùa hạ (trái ngược với bán cầu Bắc).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nước Úc đón Giáng sinh (25/12) vào mùa hè với thời tiết nóng nực. Giải thích đúng là:", "options": ["A. Úc ở bán cầu Nam, tháng 12 là mùa hạ.", "B. Úc gần xích đạo nên nóng.", "C. Úc không có mùa đông.", "D. Do biến đổi khí hậu."], "answer": "A", "explain": "Úc ở bán cầu Nam; tháng 12 bán cầu Nam ngả về Mặt Trời nên là mùa hạ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nếu một người đứng ở cực Bắc vào ngày 22/6, hiện tượng quan sát được là:", "options": ["A. Mặt Trời không lặn suốt 24 giờ (ngày cực).", "B. Mặt Trời không mọc suốt 24 giờ.", "C. Ngày đêm bằng nhau.", "D. Mặt Trời mọc ở phía tây."], "answer": "A", "explain": "Ngày 22/6, cực Bắc ngả hoàn toàn về Mặt Trời nên có ngày cực: Mặt Trời không lặn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ngày 22/6 là hạ chí ở bán cầu Bắc.", "b) Ngày 22/12 là đông chí ở bán cầu Bắc.", "c) Tháng 12, bán cầu Nam là mùa hạ.", "d) Hai bán cầu có mùa giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: mùa hai bán cầu trái ngược nhau.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mùa hạ nhận được nhiều nhiệt hơn mùa đông do góc chiếu và thời gian chiếu sáng.", "b) Ở cực, một năm có 6 tháng ngày và 6 tháng đêm.", "c) Ngày 21/3, cực Bắc bắt đầu có ngày cực.", "d) Xích đạo không có hiện tượng ngày cực."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng: nguyên nhân nhiệt theo mùa; cực có nửa năm ngày nửa năm đêm; 21/3 bắt đầu ngày cực ở Bắc; xích đạo ngày đêm gần bằng nhau quanh năm.", "points": 1}, {"type": "short", "level": "VD", "q": "Ngày 23/9 được gọi là gì ở bán cầu Bắc?", "answer": "Thu phân", "explain": "Ngày 23/9 là thu phân ở bán cầu Bắc (ngày đêm bằng nhau).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Khi bán cầu Bắc là mùa đông thì bán cầu Nam là mùa gì?", "answer": "Mùa hạ", "explain": "Các mùa hai bán cầu trái ngược nhau.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Chuyển động biểu kiến hằng năm của Mặt Trời là hệ quả của vận động nào?", "options": ["A. Trái Đất quay quanh Mặt Trời.", "B. Trái Đất tự quay quanh trục.", "C. Mặt Trăng quay quanh Trái Đất.", "D. Mặt Trời tự quay."], "answer": "A", "explain": "Do Trái Đất quay quanh Mặt Trời với trục nghiêng không đổi phương nên ta thấy Mặt Trời di chuyển biểu kiến giữa hai chí tuyến trong năm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong năm, tia sáng Mặt Trời chiếu thẳng góc với mặt đất ở khu vực nào?", "options": ["A. Giữa hai chí tuyến (từ 23°27'B đến 23°27'N).", "B. Vùng cực.", "C. Vùng ôn đới.", "D. Mọi nơi trên Trái Đất."], "answer": "A", "explain": "Tia sáng chỉ chiếu thẳng góc trong khu vực giữa hai chí tuyến (vùng nội chí tuyến).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao vùng ngoại chí tuyến không có hiện tượng Mặt Trời lên thiên đỉnh?", "options": ["A. Vì tia sáng không bao giờ chiếu thẳng góc ngoài phạm vi hai chí tuyến.", "B. Vì vùng đó quá lạnh.", "C. Vì vùng đó không tự quay.", "D. Vì Mặt Trời xa hơn."], "answer": "A", "explain": "Góc nhập xạ lớn nhất ở ngoại chí tuyến vẫn nhỏ hơn 90° nên không có lúc Mặt Trời lên thiên đỉnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một năm trên Trái Đất dài 365 ngày 6 giờ. Số 6 giờ dư ra được xử lí thế nào?", "options": ["A. 4 năm dồn lại thành 1 ngày nhuận (29/2).", "B. Bỏ đi.", "C. Cộng vào tháng 12.", "D. Không xử lí."], "answer": "A", "explain": "4 × 6 giờ = 24 giờ = 1 ngày; cứ 4 năm có một năm nhuận với ngày 29/2.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hà Nội có hai lần Mặt Trời lên thiên đỉnh trong năm. Thời gian đó rơi vào khoảng:", "options": ["A. Tháng 5 và tháng 7.", "B. Tháng 1 và tháng 12.", "C. Tháng 3 và tháng 9.", "D. Chỉ một lần vào tháng 6."], "answer": "A", "explain": "Hà Nội (khoảng 21°B) nằm trong vùng nội chí tuyến nên có 2 lần Mặt Trời lên thiên đỉnh: khoảng giữa tháng 5 và cuối tháng 7.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tại sao ở vùng ôn đới, mùa đông ngày ngắn đêm dài còn mùa hạ ngày dài đêm ngắn?", "options": ["A. Do trục nghiêng nên mùa đông bán cầu đó ngả xa Mặt Trời: góc chiếu nhỏ, thời gian ban ngày ngắn.", "B. Do Trái Đất quay chậm lại vào mùa đông.", "C. Do mây che nhiều vào mùa đông.", "D. Do Mặt Trời di chuyển."], "answer": "A", "explain": "Mùa đông, bán cầu ngả xa Mặt Trời: vòng chiếu sáng bao phủ ít phần bán cầu đó hơn nên ngày ngắn, đêm dài.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tia sáng chỉ chiếu thẳng góc trong vùng nội chí tuyến.", "b) Năm nhuận có ngày 29/2.", "c) Trục Trái Đất đổi phương liên tục khi quay.", "d) Quay quanh Mặt Trời hết 365 ngày 6 giờ."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: trục Trái Đất không đổi phương khi quay quanh Mặt Trời.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hà Nội nằm trong vùng nội chí tuyến nên có 2 lần Mặt Trời lên thiên đỉnh.", "b) Vùng ôn đới không bao giờ có Mặt Trời lên thiên đỉnh.", "c) Ngày 21/3, mọi nơi ngày đêm bằng nhau.", "d) Mùa là hệ quả của tự quay quanh trục."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: mùa là hệ quả của quay quanh Mặt Trời.", "points": 1}, {"type": "short", "level": "VD", "q": "Một năm nhuận có bao nhiêu ngày?", "answer": "366", "explain": "Năm nhuận có 366 ngày (thêm ngày 29/2).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vùng nằm giữa hai chí tuyến được gọi là vùng gì?", "answer": "Vùng nội chí tuyến", "explain": "Vùng giữa chí tuyến Bắc và chí tuyến Nam gọi là vùng nội chí tuyến.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Tốc độ dài trong vận động tự quay lớn nhất ở đâu?", "options": ["A. Xích đạo (khoảng 465 m/s).", "B. Hai cực.", "C. Chí tuyến.", "D. Vùng ôn đới."], "answer": "A", "explain": "Tốc độ dài lớn nhất ở xích đạo (khoảng 465 m/s) và giảm dần về hai cực (bằng 0 ở cực).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngày Mặt Trời (24 giờ) dài hơn ngày sao (23h56'04'') vì:", "options": ["A. Trái Đất vừa tự quay vừa quay quanh Mặt Trời nên phải quay thêm một góc nhỏ mới đón lại Mặt Trời.", "B. Đồng hồ chạy sai.", "C. Mặt Trời di chuyển nhanh.", "D. Không có lí do."], "answer": "A", "explain": "Trong lúc tự quay, Trái Đất đồng thời dịch chuyển trên quỹ đạo nên phải quay thêm khoảng 4 phút mới hoàn thành một ngày Mặt Trời.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao ở hai cực, tốc độ dài tự quay bằng 0?", "options": ["A. Vì hai cực nằm trên trục quay nên không dịch chuyển theo vòng quay.", "B. Vì cực lạnh.", "C. Vì cực không có người ở.", "D. Vì băng dày."], "answer": "A", "explain": "Hai cực nằm trên trục quay của Trái Đất nên không tham gia chuyển động vòng tròn — tốc độ dài bằng 0.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật chuyển động từ xích đạo lên cực Bắc sẽ bị lệch về hướng nào?", "options": ["A. Bên phải hướng chuyển động.", "B. Bên trái hướng chuyển động.", "C. Không lệch.", "D. Lệch lên trên."], "answer": "A", "explain": "Ở bán cầu Bắc, lực Coriolis làm lệch về bên phải hướng chuyển động.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Các dòng biển ở bán cầu Nam thường chảy lệch về bên trái hướng chảy. Nguyên nhân là:", "options": ["A. Lực Coriolis ở bán cầu Nam làm lệch trái.", "B. Gió thổi mạnh.", "C. Đáy biển dốc.", "D. Mặt Trăng hút."], "answer": "A", "explain": "Lực Coriolis ở bán cầu Nam làm lệch mọi chuyển động về bên trái, kể cả dòng biển.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong thực tế, đường sắt ở bán cầu Bắc thường bị mòn một bên ray nhiều hơn. Giải thích nào đúng?", "options": ["A. Do lực Coriolis tác động lên đoàn tàu đang chạy, đẩy lệch về một phía.", "B. Do tàu chạy quá nhanh.", "C. Do ray kém chất lượng.", "D. Do thời tiết."], "answer": "A", "explain": "Lực Coriolis tác động lên mọi vật chuyển động, kể cả đoàn tàu, gây áp lực lệch về một bên ray.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tốc độ dài tự quay lớn nhất ở xích đạo.", "b) Tốc độ dài tự quay bằng 0 ở hai cực.", "c) Ngày Mặt Trời dài 24 giờ.", "d) Lực Coriolis làm lệch trái ở bán cầu Bắc."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: ở bán cầu Bắc lệch phải.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Gió và dòng biển chịu ảnh hưởng của lực Coriolis.", "b) Ngày sao ngắn hơn ngày Mặt Trời.", "c) Tốc độ góc tự quay khác nhau theo vĩ độ.", "d) Hướng tự quay là tây sang đông."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: tốc độ góc như nhau ở mọi nơi (trừ cực).", "points": 1}, {"type": "short", "level": "VD", "q": "Tốc độ dài tự quay ở xích đạo khoảng bao nhiêu m/s?", "answer": "465", "explain": "Khoảng 465 m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một ngày sao dài bao nhiêu (giờ, phút, giây)?", "answer": "23 giờ 56 phút 4 giây", "explain": "Một ngày sao = 23 giờ 56 phút 4 giây.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Quỹ đạo chuyển động của Trái Đất quanh Mặt Trời có hình gì?", "options": ["A. Elip.", "B. Tròn hoàn hảo.", "C. Vuông.", "D. Thẳng."], "answer": "A", "explain": "Trái Đất quay quanh Mặt Trời theo quỹ đạo hình elip.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi ở bán cầu Bắc là mùa xuân thì ở bán cầu Nam là mùa gì?", "options": ["A. Mùa thu.", "B. Mùa xuân.", "C. Mùa hạ.", "D. Mùa đông."], "answer": "A", "explain": "Các mùa hai bán cầu trái ngược: Bắc xuân thì Nam thu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao thời gian các mùa ở hai bán cầu không hoàn toàn bằng nhau (mùa hạ Bắc dài hơn mùa đông Bắc)?", "options": ["A. Vì quỹ đạo elip nên tốc độ quay quanh Mặt Trời không đều trong năm.", "B. Vì trục nghiêng thay đổi.", "C. Vì Mặt Trời to nhỏ khác nhau.", "D. Vì lịch của con người sai."], "answer": "A", "explain": "Quỹ đạo elip làm tốc độ chuyển động không đều: nửa năm mùa hạ ở Bắc (xa Mặt Trời hơn) dài hơn nửa năm mùa đông vài ngày.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ngày 21/3 và 23/9 có điểm chung nào về ngày đêm?", "options": ["A. Mọi nơi trên Trái Đất đều có ngày đêm dài bằng nhau.", "B. Bán cầu Bắc ngày dài nhất.", "C. Bán cầu Nam đêm dài nhất.", "D. Cực Bắc có đêm cực."], "answer": "A", "explain": "Vào hai ngày phân, tia sáng chiếu thẳng góc xích đạo nên mọi nơi ngày đêm bằng nhau (12 giờ).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nông dân ở đồng bằng sông Hồng gieo mạ vụ đông vào tháng 11. Yếu tố mùa vụ nào chi phối?", "options": ["A. Mùa đông lạnh, ít mưa phù hợp cho cây vụ đông ưa lạnh.", "B. Mùa hạ nóng.", "C. Không liên quan đến mùa.", "D. Chỉ do tập quán."], "answer": "A", "explain": "Vụ đông ở miền Bắc tận dụng mùa đông lạnh (khí hậu phân mùa) để trồng cây ưa lạnh như khoai tây, bắp cải.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nếu em sống ở Nam Cực, em sẽ trải qua hiện tượng nào vào tháng 6?", "options": ["A. Đêm cực (suốt 24 giờ là ban đêm).", "B. Ngày cực.", "C. Ngày đêm bằng nhau.", "D. Mặt Trời lên thiên đỉnh."], "answer": "A", "explain": "Tháng 6, cực Nam ngả xa Mặt Trời nên có đêm cực.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quỹ đạo Trái Đất có hình elip.", "b) Bắc xuân thì Nam thu.", "c) Tốc độ quay quanh Mặt Trời đều nhau quanh năm.", "d) Ngày 21/3, mọi nơi ngày đêm bằng nhau."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: do quỹ đạo elip nên tốc độ không đều.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vụ đông ở miền Bắc tận dụng mùa đông lạnh.", "b) Tháng 6 ở Nam Cực là đêm cực.", "c) Xích đạo có 4 mùa rõ rệt.", "d) Trục Trái Đất nghiêng 66°33'."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: xích đạo nóng quanh năm, không phân 4 mùa rõ rệt.", "points": 1}, {"type": "short", "level": "VD", "q": "Bán cầu Bắc là mùa thu thì bán cầu Nam là mùa gì?", "answer": "Mùa xuân", "explain": "Hai bán cầu mùa trái ngược: Bắc thu thì Nam xuân.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trái Đất quay quanh Mặt Trời hết bao nhiêu ngày (lấy số ngày của năm thường)?", "answer": "365", "explain": "365 ngày 6 giờ; năm thường có 365 ngày.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Hệ quả địa lí nào sau đây KHÔNG phải của vận động tự quay?", "options": ["A. Các mùa trong năm.", "B. Sự luân phiên ngày đêm.", "C. Lực Coriolis.", "D. Giờ địa phương."], "answer": "A", "explain": "Các mùa là hệ quả của quay quanh Mặt Trời, không phải của tự quay.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hệ quả địa lí nào sau đây KHÔNG phải của quay quanh Mặt Trời?", "options": ["A. Sự luân phiên ngày đêm.", "B. Các mùa.", "C. Ngày đêm dài ngắn theo mùa.", "D. Chuyển động biểu kiến hằng năm của Mặt Trời."], "answer": "A", "explain": "Sự luân phiên ngày đêm là hệ quả của tự quay quanh trục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một học sinh nhầm lẫn giữa 'ngày sao' và 'ngày Mặt Trời'. Cách phân biệt đúng là:", "options": ["A. Ngày sao (23h56'04'') là thời gian tự quay một vòng; ngày Mặt Trời (24h) là khoảng cách giữa hai lần Mặt Trời lên cao nhất.", "B. Hai khái niệm hoàn toàn giống nhau.", "C. Ngày sao dài hơn ngày Mặt Trời.", "D. Ngày Mặt Trời chỉ có ở vùng cực."], "answer": "A", "explain": "Ngày sao đo một vòng tự quay tuyệt đối; ngày Mặt Trời dài hơn ~4 phút do Trái Đất đồng thời dịch chuyển trên quỹ đạo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao càng lên vĩ độ cao, sự chênh lệch độ dài ngày đêm giữa mùa hạ và mùa đông càng lớn?", "options": ["A. Vì góc nhập xạ thay đổi càng mạnh theo mùa ở vĩ độ cao do trục nghiêng.", "B. Vì ở vĩ độ cao Trái Đất quay nhanh hơn.", "C. Vì vĩ độ cao gần Mặt Trời hơn.", "D. Vì không khí loãng."], "answer": "A", "explain": "Trục nghiêng làm góc nhập xạ và vòng chiếu sáng thay đổi mạnh theo mùa ở vĩ độ cao, dẫn đến chênh lệch ngày đêm lớn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một công ty du lịch quảng cáo tour 'săn đêm trắng' ở Xanh Petecbua (Nga, khoảng 60°B) vào tháng 6. Cơ sở khoa học của tour là:", "options": ["A. Vĩ độ cao ở bán cầu Bắc vào tháng 6 có ngày rất dài, mặt trời gần như không lặn (đêm trắng).", "B. Tháng 6 ở Nga lạnh.", "C. Tháng 6 có bão.", "D. Không có cơ sở."], "answer": "A", "explain": "Vĩ độ 60°B vào hạ chí có ngày dài gần 19 giờ, chạng vạng kéo dài suốt đêm — hiện tượng 'đêm trắng'.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đánh giá phát biểu: 'Mùa hạ nóng vì Trái Đất gần Mặt Trời nhất'.", "options": ["A. Sai, vì khi Bắc bán cầu là mùa hạ thì Trái Đất ở xa Mặt Trời nhất (đầu tháng 7); nguyên nhân nóng là góc chiếu lớn và ngày dài.", "B. Đúng hoàn toàn.", "C. Đúng một phần.", "D. Không thể kiểm chứng."], "answer": "A", "explain": "Đầu tháng 7 Trái Đất ở viễn nhật (xa nhất) nhưng Bắc bán cầu vẫn là mùa hạ nóng nhất — chứng tỏ khoảng cách không phải nguyên nhân chính; góc nhập xạ và độ dài ngày mới quyết định.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tự quay gây ra ngày đêm luân phiên.", "b) Quay quanh Mặt Trời gây ra các mùa.", "c) Trục Trái Đất nghiêng 66°33'.", "d) Ngày đêm dài ngắn theo vĩ độ là hệ quả của tự quay."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: ngày đêm dài ngắn theo mùa và vĩ độ là hệ quả của quay quanh Mặt Trời (kết hợp trục nghiêng).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đầu tháng 7, Trái Đất ở xa Mặt Trời nhất nhưng Bắc bán cầu vẫn nóng nhất.", "b) Nguyên nhân nóng lạnh theo mùa chủ yếu là góc chiếu và thời gian chiếu sáng.", "c) Ngày sao dài hơn ngày Mặt Trời.", "d) Ở xích đạo, ngày đêm gần bằng nhau quanh năm."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: ngày sao (23h56') ngắn hơn ngày Mặt Trời (24h).", "points": 1}, {"type": "short", "level": "VD", "q": "Kể tên 2 hệ quả của vận động tự quay quanh trục (viết ngắn gọn, cách nhau bằng dấu phẩy).", "answer": "Ngày đêm luân phiên, lực Coriolis", "explain": "Các hệ quả: ngày đêm luân phiên; giờ (múi giờ); lực Coriolis; chuyển động biểu kiến hằng ngày của Mặt Trời.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Kể tên 2 hệ quả của vận động quay quanh Mặt Trời (viết ngắn gọn, cách nhau bằng dấu phẩy).", "answer": "Các mùa, ngày đêm dài ngắn theo mùa", "explain": "Các hệ quả: các mùa; ngày đêm dài ngắn theo mùa và vĩ độ; chuyển động biểu kiến hằng năm của Mặt Trời.", "points": 0.5}]}]}</script>
