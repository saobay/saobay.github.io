{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Thủy quyển là gì?", "options": ["A. Toàn bộ nước trên Trái Đất.", "B. Toàn bộ không khí.", "C. Lớp vỏ cứng.", "D. Sinh vật."], "answer": "A", "explain": "Thủy quyển là toàn bộ nước trên Trái Đất (biển, sông, hồ, băng, nước ngầm, hơi nước...).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tỉ lệ nước mặn và nước ngọt trên Trái Đất là:", "options": ["A. 97,5% mặn, 2,5% ngọt.", "B. 50% mặn, 50% ngọt.", "C. 2,5% mặn, 97,5% ngọt.", "D. 70% mặn, 30% ngọt."], "answer": "A", "explain": "Khoảng 97,5% là nước mặn (biển, đại dương), chỉ 2,5% là nước ngọt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nước ngọt sử dụng được lại rất ít?", "options": ["A. Vì phần lớn nước ngọt tồn tại ở dạng băng ở hai cực và núi cao, khó khai thác.", "B. Vì nước ngọt bốc hơi hết.", "C. Vì không có mưa.", "D. Vì ngẫu nhiên."], "answer": "A", "explain": "Khoảng 68,7% nước ngọt ở dạng băng — khó khai thác; nước con người dùng được (sông, hồ, ngầm) rất ít.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vòng tuần hoàn nước có ý nghĩa gì?", "options": ["A. Nước không mất đi mà vận động liên tục, nhưng phân bố không đều và có thể bị ô nhiễm.", "B. Nước mất đi dần.", "C. Nước chỉ ở biển.", "D. Không có ý nghĩa."], "answer": "A", "explain": "Vòng tuần hoàn làm nước vận động không ngừng; tuy không mất đi nhưng phân bố không đều theo không gian, thời gian.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vùng khô hạn muốn có nước sinh hoạt ổn định. Giải pháp bền vững là:", "options": ["A. Khai thác nước ngầm hợp lí kết hợp thu gom nước mưa và tiết kiệm nước.", "B. Đào giếng bừa bãi.", "C. Chờ mưa.", "D. Mua nước đóng chai mãi."], "answer": "A", "explain": "Khai thác hợp lí + thu gom + tiết kiệm là giải pháp bền vững cho vùng khô hạn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao khai thác nước ngầm bừa bãi ở vùng ven biển gây nhiễm mặn?", "options": ["A. Vì mực nước ngầm hạ thấp, nước biển xâm nhập vào tầng chứa nước.", "B. Vì giếng sâu.", "C. Vì mưa ít.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Khai thác quá mức làm hạ mực nước ngầm, tạo điều kiện cho nước biển xâm nhập gây nhiễm mặn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thủy quyển là toàn bộ nước trên Trái Đất.", "b) Nước mặn chiếm 97,5%.", "c) Phần lớn nước ngọt ở dạng băng.", "d) Nước trên Trái Đất mất đi dần."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: vòng tuần hoàn làm nước không mất đi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nước ngọt khai thác được rất ít.", "b) Khai thác bừa bãi gây nhiễm mặn ven biển.", "c) Vòng tuần hoàn phân bố nước đều khắp.", "d) Cần tiết kiệm và chống ô nhiễm nước."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: phân bố không đều.", "points": 1}, {"type": "short", "level": "VD", "q": "Nước mặn chiếm khoảng bao nhiêu % tổng lượng nước trên Trái Đất?", "answer": "97,5", "explain": "Khoảng 97,5%.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Phần lớn nước ngọt tồn tại ở dạng nào?", "answer": "Băng", "explain": "Khoảng 68,7% nước ngọt ở dạng băng (số liệu USGS).", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Nước ngầm được hình thành chủ yếu do:", "options": ["A. Nước mưa, nước sông hồ thấm xuống.", "B. Núi lửa phun.", "C. Tuyết rơi.", "D. Con người bơm."], "answer": "A", "explain": "Nước ngầm chủ yếu do nước mưa, nước mặt thấm xuống các tầng chứa nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sông là gì?", "options": ["A. Dòng nước chảy thường xuyên, tương đối lớn trên bề mặt lục địa.", "B. Vùng trũng chứa nước.", "C. Nước dưới đất.", "D. Nước mưa."], "answer": "A", "explain": "Sông là dòng nước chảy thường xuyên, tương đối lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nước ngầm là nguồn nước quan trọng ở vùng khô hạn?", "options": ["A. Vì ít chịu ảnh hưởng của hạn hán bề mặt, trữ lượng ổn định.", "B. Vì vô tận.", "C. Vì không bao giờ cạn.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Nước ngầm ít biến động theo mùa, là nguồn dự trữ quan trọng khi mặt đất khô hạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phụ lưu và chi lưu khác nhau ở điểm nào?", "options": ["A. Phụ lưu đổ vào sông chính, chi lưu tách ra từ sông chính.", "B. Phụ lưu lớn hơn chi lưu.", "C. Chi lưu ở thượng nguồn.", "D. Không khác nhau."], "answer": "A", "explain": "Phụ lưu: sông nhỏ đổ vào sông chính. Chi lưu: sông tách ra từ sông chính (thường ở hạ lưu, đồng bằng).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sông Mê Kông ở hạ lưu tách thành nhiều chi lưu (sông Tiền, sông Hậu...). Điều này cho thấy:", "options": ["A. Ở đồng bằng, sông phân lưu thành chi lưu trước khi ra biển.", "B. Sông cạn nước.", "C. Sông bị ô nhiễm.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Ở đồng bằng thấp, sông phân thành nhiều chi lưu (cửu long = chín rồng).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một thành phố khai thác nước ngầm quá mức, mặt đất bị sụt lún. Nguyên nhân là:", "options": ["A. Mất nước đỡ trong tầng chứa nước, đất đá bị nén lún.", "B. Động đất.", "C. Xây nhà cao.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Khai thác quá mức làm rỗng tầng chứa nước, đất đá phía trên lún xuống (ví dụ một số đô thị ven biển).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nước ngầm do nước mưa thấm xuống.", "b) Sông là dòng chảy thường xuyên.", "c) Phụ lưu tách ra từ sông chính.", "d) Nước ngầm quan trọng ở vùng khô hạn."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: chi lưu mới tách ra từ sông chính; phụ lưu đổ vào sông chính.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sông Tiền, sông Hậu là chi lưu của Mê Kông.", "b) Khai thác quá mức gây sụt lún.", "c) Nước ngầm là vô tận.", "d) Mạch lộ là nơi nước ngầm lộ ra."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: nước ngầm có hạn, cần khai thác hợp lí.", "points": 1}, {"type": "short", "level": "VD", "q": "Sông nhỏ đổ vào sông chính gọi là gì?", "answer": "Phụ lưu", "explain": "Phụ lưu đổ vào sông chính.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nơi nước ngầm lộ ra mặt đất gọi là gì?", "answer": "Mạch lộ", "explain": "Mạch lộ (hoặc suối nguồn).", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Chế độ nước sông là gì?", "options": ["A. Sự thay đổi lưu lượng nước sông trong năm.", "B. Màu sắc của nước sông.", "C. Chiều dài của sông.", "D. Số lượng cá trong sông."], "answer": "A", "explain": "Chế độ nước (thủy chế) là sự thay đổi lưu lượng nước sông trong năm: mùa lũ, mùa cạn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhân tố nào quyết định chủ yếu chế độ nước sông?", "options": ["A. Chế độ mưa.", "B. Địa hình.", "C. Thực vật.", "D. Con người."], "answer": "A", "explain": "Chế độ mưa quyết định chủ yếu chế độ nước sông (mưa nhiều → lũ).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao sông ở vùng mưa theo mùa có thủy chế phân mùa rõ rệt?", "options": ["A. Vì lưu lượng phụ thuộc mưa: mùa mưa lũ lớn, mùa khô cạn kiệt.", "B. Vì sông ngắn.", "C. Vì có đập.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Nguồn cấp nước chủ yếu là mưa nên mùa mưa/mùa khô tạo mùa lũ/mùa cạn rõ rệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hồ có vai trò gì đối với chế độ nước sông?", "options": ["A. Điều hòa dòng chảy: giữ nước mùa lũ, bổ sung mùa cạn.", "B. Làm lũ lớn hơn.", "C. Không có vai trò.", "D. Làm sông cạn."], "answer": "A", "explain": "Hồ như 'túi' điều hòa: chứa nước mùa lũ, xả ra mùa cạn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sông Hồng có mùa lũ từ tháng 6 đến tháng 10. Nguyên nhân chính là:", "options": ["A. Mưa lớn của gió mùa hạ trong thời gian này.", "B. Băng tan.", "C. Thủy triều.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Mùa mưa (gió mùa hạ) từ tháng 5 – 10 gây lũ sông Hồng từ tháng 6 – 10.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sau khi xây dựng nhiều hồ thủy điện ở thượng nguồn, chế độ nước sông ở hạ lưu thay đổi thế nào?", "options": ["A. Lũ giảm bớt, mùa cạn được bổ sung nước — điều hòa hơn.", "B. Lũ lớn hơn.", "C. Không thay đổi.", "D. Sông cạn hẳn."], "answer": "A", "explain": "Hồ chứa điều tiết: giữ nước mùa lũ, xả mùa cạn — con người làm thay đổi thủy chế.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chế độ nước là sự thay đổi lưu lượng trong năm.", "b) Chế độ mưa quyết định thủy chế.", "c) Hồ điều hòa dòng chảy.", "d) Sông Hồng lũ từ tháng 6 đến tháng 10."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sông mưa theo mùa có lũ, cạn rõ rệt.", "b) Thủy điện điều hòa thủy chế.", "c) Rừng không ảnh hưởng đến sông.", "d) Băng tan cũng cấp nước cho sông."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: rừng giữ nước, điều hòa dòng chảy.", "points": 1}, {"type": "short", "level": "VD", "q": "Mùa nước sông dâng cao, lưu lượng lớn gọi là mùa gì?", "answer": "Mùa lũ", "explain": "Mùa lũ (ngược lại là mùa cạn).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nhân tố nào quyết định chủ yếu chế độ nước sông?", "answer": "Chế độ mưa", "explain": "Chế độ mưa quyết định chủ yếu.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Hồ là gì?", "options": ["A. Vùng trũng chứa nước, không thông trực tiếp với biển.", "B. Dòng nước chảy.", "C. Nước dưới đất.", "D. Nước mưa."], "answer": "A", "explain": "Hồ là vùng trũng chứa nước trên lục địa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hồ Baikal (Nga) có nguồn gốc:", "options": ["A. Kiến tạo.", "B. Băng hà.", "C. Núi lửa.", "D. Nhân tạo."], "answer": "A", "explain": "Hồ Baikal nằm trong đới tách giãn, có nguồn gốc kiến tạo — hồ sâu nhất thế giới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao hồ có vai trò điều hòa khí hậu địa phương?", "options": ["A. Vì nước hồ điều hòa nhiệt: ngày mát, đêm ấm; tăng độ ẩm.", "B. Vì hồ đẹp.", "C. Vì hồ sâu.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Nước nhiệt dung lớn, điều hòa nhiệt độ và độ ẩm xung quanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hồ thủy điện (nhân tạo) khác hồ tự nhiên ở điểm nào?", "options": ["A. Do con người đắp đập tạo ra để phát điện, điều tiết nước.", "B. Sâu hơn.", "C. Đẹp hơn.", "D. Không khác."], "answer": "A", "explain": "Hồ nhân tạo do đắp đập ngăn sông: phát điện, chống lũ, cấp nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Biển Hồ (Campuchia) có diện tích thay đổi lớn theo mùa. Nguyên nhân là:", "options": ["A. Mùa mưa nước Mê Kông dâng tràn vào, mùa khô nước rút ra.", "B. Động đất.", "C. Núi lửa.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Biển Hồ điều hòa lũ Mê Kông: mùa lũ nhận nước, mùa cạn trả nước.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một hồ bị bồi lấp nhanh do xói mòn thượng nguồn. Biện pháp khắc phục bền vững là:", "options": ["A. Trồng rừng đầu nguồn chống xói mòn + nạo vét hợp lí.", "B. Lấp hồ.", "C. Cấm đánh cá.", "D. Không làm gì."], "answer": "A", "explain": "Chống xói mòn từ gốc (rừng đầu nguồn) kết hợp nạo vét.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hồ là vùng trũng chứa nước.", "b) Hồ Baikal do kiến tạo.", "c) Hồ điều hòa khí hậu.", "d) Hồ nhân tạo do đắp đập."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Biển Hồ điều hòa lũ Mê Kông.", "b) Chống bồi lấp bằng rừng đầu nguồn.", "c) Hồ không có vai trò gì.", "d) Hồ cung cấp nước, thủy sản, du lịch."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: hồ nhiều vai trò.", "points": 1}, {"type": "short", "level": "VD", "q": "Hồ sâu nhất thế giới có tên là gì?", "answer": "Hồ Baikal", "explain": "Hồ Baikal (Nga) sâu nhất thế giới.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hồ được tạo ra bằng cách đắp đập ngăn sông gọi là hồ gì?", "answer": "Hồ nhân tạo", "explain": "Hồ nhân tạo (hồ thủy điện).", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Lưu vực sông là gì?", "options": ["A. Vùng đất cung cấp nước cho sông.", "B. Lòng sông.", "C. Cửa sông.", "D. Thượng nguồn."], "answer": "A", "explain": "Lưu vực sông là vùng đất mà nước mặt, nước ngầm đều chảy về sông.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chi lưu là gì?", "options": ["A. Sông tách ra từ sông chính.", "B. Sông đổ vào sông chính.", "C. Sông ở thượng nguồn.", "D. Sông cạn."], "answer": "A", "explain": "Chi lưu tách ra từ sông chính (thường ở đồng bằng); phụ lưu đổ vào sông chính.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao rừng đầu nguồn quan trọng với sông?", "options": ["A. Vì rừng giữ nước, chống xói mòn, điều hòa dòng chảy.", "B. Vì rừng đẹp.", "C. Vì rừng cho gỗ.", "D. Không quan trọng."], "answer": "A", "explain": "Rừng giữ đất, giữ nước: giảm lũ, chống xói mòn, duy trì dòng chảy mùa cạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sông ở vùng ôn đới lạnh có nguồn cấp nước chủ yếu từ:", "options": ["A. Băng tuyết tan vào mùa xuân hạ.", "B. Mưa.", "C. Nước ngầm.", "D. Hồ."], "answer": "A", "explain": "Vùng lạnh: băng tuyết tan vào mùa ấm là nguồn cấp nước chính → lũ vào xuân hạ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một con sông có lũ vào mùa xuân do băng tan. Sông đó nằm ở vùng khí hậu nào?", "options": ["A. Ôn đới lạnh.", "B. Nhiệt đới.", "C. Xích đạo.", "D. Hoang mạc."], "answer": "A", "explain": "Lũ do băng tan là đặc trưng sông vùng ôn đới lạnh (Nga, Canada).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sông Nin có lũ đều đặn vào mùa hạ do mưa ở thượng nguồn. Người Ai Cập cổ đã lợi dụng để:", "options": ["A. Làm nông nghiệp: lũ mang phù sa màu mỡ bồi đắp đồng ruộng.", "B. Đánh cá duy nhất.", "C. Du lịch.", "D. Không lợi dụng."], "answer": "A", "explain": "Lũ Nin mang phù sa bồi đắp — nền tảng nông nghiệp Ai Cập cổ ('Ai Cập là tặng phẩm của sông Nin').", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lưu vực là vùng đất cấp nước cho sông.", "b) Chi lưu tách từ sông chính.", "c) Rừng đầu nguồn điều hòa dòng chảy.", "d) Sông vùng lạnh lũ do băng tan."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lũ Nin mang phù sa cho nông nghiệp.", "b) Băng tan gây lũ xuân ở vùng lạnh.", "c) Phá rừng đầu nguồn gây lũ quét.", "d) Sông chỉ có một nguồn cấp nước."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: sông có nhiều nguồn (mưa, băng tuyết, ngầm, hồ).", "points": 1}, {"type": "short", "level": "VD", "q": "Vùng đất cung cấp nước cho một con sông gọi là gì?", "answer": "Lưu vực sông", "explain": "Lưu vực sông.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sông nào được gọi là 'tặng phẩm' của Ai Cập cổ?", "answer": "Sông Nin", "explain": "Sông Nin — 'Ai Cập là tặng phẩm của sông Nin' (Herodotus).", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Nước trên lục địa gồm:", "options": ["A. Nước ngầm, sông, hồ, băng.", "B. Chỉ sông.", "C. Chỉ hồ.", "D. Chỉ mưa."], "answer": "A", "explain": "Nước trên lục địa: nước ngầm, sông, hồ, băng hà, hơi nước...", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tầng chứa nước nằm giữa:", "options": ["A. Các tầng cách nước (không thấm).", "B. Không khí.", "C. Đá nóng.", "D. Dầu mỏ."], "answer": "A", "explain": "Nước ngầm tồn tại trong tầng thấm nước nằm giữa các tầng cách nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nước giếng khoan thường sạch hơn nước sông?", "options": ["A. Vì được đất đá lọc tự nhiên khi thấm xuống.", "B. Vì sâu hơn.", "C. Vì không có cá.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Nước thấm qua các lớp đất đá được lọc tự nhiên nên sạch hơn nước mặt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ô nhiễm nước ngầm khó khắc phục hơn nước mặt vì:", "options": ["A. Nước ngầm vận động chậm, chất ô nhiễm tồn tại lâu, khó làm sạch.", "B. Nước ngầm sâu.", "C. Không ai quan tâm.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Nước ngầm chảy chậm, tự làm sạch rất chậm nên ô nhiễm tồn tại hàng chục năm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một làng nghề xả thải trực tiếp xuống sông. Hậu quả lâu dài là:", "options": ["A. Ô nhiễm nước mặt và thấm xuống gây ô nhiễm nước ngầm.", "B. Không sao.", "C. Nước tự sạch ngay.", "D. Cá nhiều hơn."], "answer": "A", "explain": "Ô nhiễm mặt thấm xuống gây ô nhiễm nước ngầm — ảnh hưởng sức khỏe lâu dài.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để bảo vệ nguồn nước, biện pháp tổng hợp nào đúng?", "options": ["A. Xử lí nước thải, bảo vệ rừng đầu nguồn, tiết kiệm nước, chống khai thác bừa bãi.", "B. Chỉ xây đập.", "C. Chỉ cấm đánh cá.", "D. Không cần làm gì."], "answer": "A", "explain": "Bảo vệ nước cần đồng bộ: xử lí thải, bảo vệ rừng, tiết kiệm, khai thác hợp lí.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nước lục địa gồm ngầm, sông, hồ, băng.", "b) Nước giếng được đất đá lọc tự nhiên.", "c) Ô nhiễm nước ngầm khó khắc phục.", "d) Nước ngầm là vô tận."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: có hạn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xả thải gây ô nhiễm cả mặt và ngầm.", "b) Bảo vệ nước cần nhiều biện pháp.", "c) Nước thải tự sạch ngay.", "d) Rừng đầu nguồn bảo vệ nguồn nước."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Nước trong tầng chứa nước dưới đất gọi là nước gì?", "answer": "Nước ngầm", "explain": "Nước ngầm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao cần bảo vệ rừng đầu nguồn để bảo vệ nguồn nước?", "answer": "Chống xói mòn, điều hòa dòng chảy", "explain": "Rừng giữ đất, giữ nước, điều hòa dòng chảy, chống xói mòn.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Băng hà chủ yếu phân bố ở:", "options": ["A. Hai cực và vùng núi cao.", "B. Xích đạo.", "C. Hoang mạc.", "D. Đồng bằng."], "answer": "A", "explain": "Băng hà ở hai cực và vùng núi cao (nơi lạnh quanh năm).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vai trò của băng hà với sông:", "options": ["A. Cung cấp nước cho sông vào mùa ấm (băng tan).", "B. Không có vai trò.", "C. Làm sông cạn.", "D. Gây lũ quét."], "answer": "A", "explain": "Băng tan vào mùa ấm là nguồn cấp nước quan trọng cho sông vùng lạnh, vùng núi cao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao băng ở hai cực tan ảnh hưởng toàn cầu?", "options": ["A. Vì làm nước biển dâng, ảnh hưởng khí hậu toàn cầu.", "B. Vì mất cảnh đẹp.", "C. Vì gấu mất nhà.", "D. Không ảnh hưởng."], "answer": "A", "explain": "Băng tan làm nước biển dâng, đe dọa vùng ven biển thấp và làm biến đổi khí hậu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hồ móng ngựa được hình thành do:", "options": ["A. Sông đổi dòng, khúc uốn bị tách thành hồ.", "B. Núi lửa.", "C. Băng hà.", "D. Động đất."], "answer": "A", "explain": "Khúc sông uốn cong bị tách khỏi dòng chính tạo hồ móng ngựa ở đồng bằng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đồng bằng sông Cửu Long có nhiều hồ, đầm, kênh rạch. Điều này thuận lợi cho:", "options": ["A. Nuôi trồng thủy sản, giao thông đường thủy, điều hòa nước.", "B. Trồng rừng.", "C. Khai thác mỏ.", "D. Không thuận lợi."], "answer": "A", "explain": "Mạng lưới sông hồ dày đặc thuận lợi cho thủy sản, giao thông thủy, điều hòa lũ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vùng núi cao có băng hà đang thu hẹp. Hệ quả lâu dài với sông là:", "options": ["A. Ban đầu lũ tăng, sau đó nguồn nước cạn kiệt khi băng hết.", "B. Không ảnh hưởng.", "C. Sông nhiều nước mãi.", "D. Sông đóng băng."], "answer": "A", "explain": "Băng tan nhanh ban đầu tăng lũ; khi băng cạn, sông mất nguồn cấp quan trọng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Băng hà ở hai cực và núi cao.", "b) Băng tan cấp nước cho sông.", "c) Băng tan làm biển dâng.", "d) Hồ móng ngựa do sông đổi dòng."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Băng tan ảnh hưởng khí hậu toàn cầu.", "b) Sông hồ thuận lợi cho thủy sản.", "c) Băng hết thì sông mất nguồn nước.", "d) Băng hà chỉ có ở Nam Cực."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: băng hà còn ở Bắc Cực và núi cao.", "points": 1}, {"type": "short", "level": "VD", "q": "Hồ hình thành do khúc sông bị tách ra gọi là hồ gì?", "answer": "Hồ móng ngựa", "explain": "Hồ móng ngựa.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Băng ở hai cực tan làm hiện tượng gì ở đại dương?", "answer": "Nước biển dâng", "explain": "Băng tan làm nước biển dâng.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Nguồn cấp nước cho sông gồm:", "options": ["A. Mưa, băng tuyết tan, nước ngầm, hồ.", "B. Chỉ mưa.", "C. Chỉ băng tan.", "D. Chỉ nước ngầm."], "answer": "A", "explain": "Sông được cấp nước từ nhiều nguồn: mưa, băng tuyết tan, nước ngầm, hồ đầm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mùa cạn của sông là:", "options": ["A. Mùa lưu lượng nước nhỏ.", "B. Mùa lũ lớn.", "C. Mùa không có nước.", "D. Mùa mưa."], "answer": "A", "explain": "Mùa cạn: lưu lượng nhỏ (ngược với mùa lũ).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao sông ở xích đạo thường nhiều nước quanh năm?", "options": ["A. Vì mưa quanh năm (mưa đối lưu).", "B. Vì sông dài.", "C. Vì có đập.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Xích đạo mưa quanh năm nên sông nhiều nước quanh năm, thủy chế điều hòa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sông Nin chảy qua hoang mạc Sahara nhưng vẫn nhiều nước vì:", "options": ["A. Nguồn nước từ thượng nguồn mưa nhiều (vùng xích đạo, cao nguyên).", "B. Nước ngầm Sahara.", "C. Mưa ở Sahara.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Nin nhận nước từ thượng nguồn (hồ Victoria, mưa xích đạo) nên vượt qua sa mạc vẫn nhiều nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một con sông chảy qua nhiều đới khí hậu. Chế độ nước của nó:", "options": ["A. Phức tạp, tổng hợp nguồn cấp của các vùng.", "B. Đơn giản.", "C. Không có lũ.", "D. Chỉ một mùa."], "answer": "A", "explain": "Sông dài qua nhiều đới khí hậu (như Nin, Mê Kông) có thủy chế phức tạp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để dự báo lũ cho hạ lưu, cần theo dõi yếu tố nào ở thượng nguồn?", "options": ["A. Lượng mưa, mực nước, tình trạng hồ chứa và rừng đầu nguồn.", "B. Nhiệt độ.", "C. Gió.", "D. Không cần theo dõi."], "answer": "A", "explain": "Dự báo lũ dựa vào mưa, mực nước thượng nguồn, điều tiết hồ chứa.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sông có nhiều nguồn cấp nước.", "b) Mùa cạn lưu lượng nhỏ.", "c) Sông xích đạo nhiều nước quanh năm.", "d) Sông Nin lấy nước từ Sahara."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: Nin lấy nước từ thượng nguồn mưa nhiều.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dự báo lũ theo dõi mưa thượng nguồn.", "b) Sông dài có thủy chế phức tạp.", "c) Mọi sông đều có lũ vào mùa hạ.", "d) Hồ chứa giúp dự báo lũ."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: tùy vùng khí hậu (vùng lạnh lũ do băng tan...).", "points": 1}, {"type": "short", "level": "VD", "q": "Sông ở xích đạo có thủy chế như thế nào?", "answer": "Điều hòa, nhiều nước quanh năm", "explain": "Mưa quanh năm nên sông điều hòa, nhiều nước.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Để dự báo lũ hạ lưu, cần theo dõi lượng mưa ở đâu?", "answer": "Thượng nguồn", "explain": "Theo dõi mưa, mực nước ở thượng nguồn.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Nước ngọt chiếm bao nhiêu % tổng lượng nước?", "options": ["A. 2,5%.", "B. 97,5%.", "C. 68,7%.", "D. 30%."], "answer": "A", "explain": "Nước ngọt chỉ chiếm khoảng 2,5%.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong nước ngọt, phần lớn ở dạng:", "options": ["A. Băng.", "B. Sông.", "C. Hồ.", "D. Mưa."], "answer": "A", "explain": "Khoảng 68,7% nước ngọt ở dạng băng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phải tiết kiệm nước ngọt?", "options": ["A. Vì nước ngọt ít, phân bố không đều và dễ bị ô nhiễm.", "B. Vì nước mặn nhiều.", "C. Vì không có mưa.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Nước ngọt chỉ 2,5%, phần lớn ở dạng băng — nguồn dùng được rất ít.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biện pháp nào tiết kiệm nước trong nông nghiệp?", "options": ["A. Tưới nhỏ giọt, tưới phun mưa.", "B. Tưới tràn lan.", "C. Không tưới.", "D. Tưới ban trưa nắng."], "answer": "A", "explain": "Tưới nhỏ giọt, phun mưa tiết kiệm nước hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một khu công nghiệp xả thải chưa xử lí ra sông. Ai chịu ảnh hưởng?", "options": ["A. Người dân hạ lưu dùng nước sông và hệ sinh thái.", "B. Không ai.", "C. Chỉ cá.", "D. Chỉ cây."], "answer": "A", "explain": "Ô nhiễm lan theo dòng nước, ảnh hưởng sức khỏe cộng đồng và sinh thái.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tranh chấp nguồn nước sông xuyên biên giới cần giải quyết bằng:", "options": ["A. Hợp tác quốc tế, chia sẻ công bằng, bảo vệ chung.", "B. Chiếm đoạt.", "C. Ngăn sông.", "D. Chiến tranh."], "answer": "A", "explain": "Sông xuyên biên giới cần hợp tác, chia sẻ công bằng (ví dụ Mê Kông).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nước ngọt chiếm 2,5%.", "b) Phần lớn nước ngọt ở dạng băng.", "c) Cần tiết kiệm nước ngọt.", "d) Nước ngọt là vô tận."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tưới nhỏ giọt tiết kiệm nước.", "b) Xả thải ảnh hưởng hạ lưu.", "c) Sông xuyên biên giới cần hợp tác.", "d) Ô nhiễm nước tự hết ngay."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Nước ngọt chiếm bao nhiêu %?", "answer": "2,5", "explain": "2,5%.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Biện pháp tưới nào tiết kiệm nước nhất?", "answer": "Tưới nhỏ giọt", "explain": "Tưới nhỏ giọt tiết kiệm nước nhất.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Vòng tuần hoàn nước gồm các giai đoạn:", "options": ["A. Bốc hơi, ngưng tụ, mưa, dòng chảy, thấm.", "B. Chỉ mưa.", "C. Chỉ bốc hơi.", "D. Chỉ chảy ra biển."], "answer": "A", "explain": "Bốc hơi → ngưng tụ → mưa → chảy/thấm → lại bốc hơi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nước biển chiếm phần lớn thủy quyển vì:", "options": ["A. Biển, đại dương chiếm phần lớn bề mặt Trái Đất.", "B. Sông nhiều.", "C. Hồ nhiều.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Biển, đại dương chiếm khoảng 71% bề mặt Trái Đất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nước sông thường ngọt còn nước biển mặn?", "options": ["A. Vì muối từ đất liền theo sông ra biển tích tụ hàng triệu năm.", "B. Vì sông ngắn.", "C. Vì biển sâu.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Sông mang muối hòa tan ra biển; nước biển bốc hơi để lại muối tích tụ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Muối trong nước biển chủ yếu từ đâu?", "options": ["A. Từ đất liền do sông mang ra và từ đáy biển.", "B. Từ mưa.", "C. Từ không khí.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Muối do sông mang từ đất liền ra và từ hoạt động địa chất đáy biển.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vùng ven biển bị nhiễm mặn vào mùa khô. Nguyên nhân và giải pháp:", "options": ["A. Nước biển xâm nhập + khai thác quá mức; giải pháp: đê ngăn mặn, tiết kiệm nước ngọt.", "B. Mưa nhiều.", "C. Không nguyên nhân.", "D. Không giải pháp."], "answer": "A", "explain": "Mùa khô sông cạn, biển xâm nhập; cần đê ngăn mặn, giữ nước ngọt.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đồng bằng sông Cửu Long đối mặt với xâm nhập mặn ngày càng sâu. Giải pháp tổng hợp là:", "options": ["A. Đê bao, cống ngăn mặn, chuyển đổi cây trồng, tiết kiệm nước thượng nguồn.", "B. Bỏ ruộng.", "C. Đào sâu kênh.", "D. Không làm gì."], "answer": "A", "explain": "Tổng hợp: công trình ngăn mặn + chuyển đổi sản xuất + quản lí nước thượng nguồn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vòng tuần hoàn: bốc hơi, mưa, chảy, thấm.", "b) Biển chiếm phần lớn bề mặt.", "c) Muối biển do sông mang ra.", "d) Nước sông mặn như biển."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: nước sông ngọt.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mùa khô ven biển dễ nhiễm mặn.", "b) Cần đê ngăn mặn và tiết kiệm nước.", "c) Xâm nhập mặn không ảnh hưởng nông nghiệp.", "d) Nước biển mặn do tích tụ muối."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: ảnh hưởng lớn.", "points": 1}, {"type": "short", "level": "VD", "q": "Biển, đại dương chiếm khoảng bao nhiêu % bề mặt Trái Đất?", "answer": "71", "explain": "Khoảng 71%.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hiện tượng nước biển lấn vào đất liền ở vùng ven biển gọi là gì?", "answer": "Xâm nhập mặn", "explain": "Xâm nhập mặn.", "points": 0.5}]}]}</script>
