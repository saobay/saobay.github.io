{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Độ muối trung bình của nước biển và đại dương là bao nhiêu?", "options": ["A. 35‰.", "B. 10‰.", "C. 41‰.", "D. 100‰."], "answer": "A", "explain": "Độ muối trung bình của nước biển và đại dương là 35‰ (35 gam muối/1 kg nước biển).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Độ muối được tính bằng đơn vị nào?", "options": ["A. Phần nghìn (‰).", "B. Phần trăm (%).", "C. Độ C.", "D. Mét."], "answer": "A", "explain": "Độ muối tính bằng phần nghìn (‰): gam muối hòa tan trong 1 kg nước biển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao độ muối ở xích đạo thấp hơn ở chí tuyến?", "options": ["A. Vì xích đạo mưa nhiều làm loãng muối, chí tuyến ít mưa, bốc hơi mạnh.", "B. Vì xích đạo lạnh.", "C. Vì chí tuyến nhiều sông.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Mưa nhiều pha loãng muối ở xích đạo; chí tuyến khô, bốc hơi mạnh làm muối đậm đặc hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biển Đỏ có độ muối cao (41‰) vì:", "options": ["A. Là biển kín, nóng, ít mưa, bốc hơi mạnh.", "B. Nhiều sông đổ vào.", "C. Ở vùng lạnh.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Biển kín, khí hậu nóng khô, bốc hơi mạnh mà ít sông đổ vào nên độ muối cao nhất thế giới.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vùng cửa sông thường có độ muối thấp. Nguyên nhân là:", "options": ["A. Nước sông ngọt đổ ra pha loãng nước biển.", "B. Sóng lớn.", "C. Gió mạnh.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Nước sông ngọt đổ ra biển pha loãng, làm giảm độ muối ven cửa sông.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Biển Baltic (châu Âu) có độ muối rất thấp (khoảng 10‰). Giải thích đúng là:", "options": ["A. Vùng lạnh, băng tan + nhiều sông đổ vào, lại là biển kín ít trao đổi với đại dương.", "B. Vùng nóng.", "C. Ít sông.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Baltic: khí hậu lạnh, băng tan, nhiều sông đổ vào, biển kín — độ muối thấp.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Độ muối trung bình là 35‰.", "b) Độ muối tính bằng phần nghìn.", "c) Xích đạo độ muối thấp hơn chí tuyến.", "d) Biển Đỏ độ muối thấp."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: Biển Đỏ độ muối cao (41‰).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mưa nhiều làm giảm độ muối.", "b) Bốc hơi mạnh làm tăng độ muối.", "c) Cửa sông độ muối thấp.", "d) Biển kín nóng độ muối thấp."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: biển kín nóng độ muối cao.", "points": 1}, {"type": "short", "level": "VD", "q": "Độ muối trung bình của nước biển là bao nhiêu phần nghìn?", "answer": "35", "explain": "35‰.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Biển nào có độ muối cao nhất thế giới (41‰)?", "answer": "Biển Đỏ", "explain": "Biển Đỏ: 41‰.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên nhân chủ yếu sinh ra sóng biển là:", "options": ["A. Gió.", "B. Động đất.", "C. Thủy triều.", "D. Núi lửa."], "answer": "A", "explain": "Gió thổi trên mặt biển là nguyên nhân chủ yếu sinh ra sóng (gió càng mạnh, sóng càng lớn).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sóng thần được sinh ra do:", "options": ["A. Động đất, núi lửa ngầm dưới đáy biển.", "B. Gió mạnh.", "C. Mưa lớn.", "D. Thủy triều."], "answer": "A", "explain": "Sóng thần do động đất, núi lửa ngầm làm đáy biển dịch chuyển đột ngột.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao sóng thần có sức tàn phá khủng khiếp?", "options": ["A. Vì sóng cao, dài, truyền nhanh với năng lượng khổng lồ.", "B. Vì sóng đẹp.", "C. Vì sóng nhỏ.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Sóng thần bước sóng dài hàng trăm km, tốc độ hàng trăm km/h, ập vào bờ với năng lượng khổng lồ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi có cảnh báo sóng thần, người dân ven biển cần:", "options": ["A. Nhanh chóng di chuyển lên vùng đất cao, xa bờ biển.", "B. Ra biển xem sóng.", "C. Ở yên trong nhà gần biển.", "D. Đi tắm biển."], "answer": "A", "explain": "Sóng thần ập vào bờ rất nhanh; phải sơ tán lên cao, xa bờ ngay khi có cảnh báo.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trận sóng thần Ấn Độ Dương năm 2004 gây thiệt hại nặng nề vì:", "options": ["A. Động đất mạnh dưới đáy biển + nhiều nước ven biển thiếu hệ thống cảnh báo.", "B. Bão lớn.", "C. Núi lửa trên cạn.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Động đất 9,1 độ Richter dưới biển Sumatra gây sóng thần; thiếu cảnh báo nên thiệt hại lớn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phân biệt sóng thường và sóng thần:", "options": ["A. Sóng thường do gió, chỉ ở mặt biển; sóng thần do động đất ngầm, ảnh hưởng cả cột nước, dài và nhanh hơn nhiều.", "B. Hai loại giống nhau.", "C. Sóng thần do gió.", "D. Sóng thường nguy hiểm hơn."], "answer": "A", "explain": "Sóng thần khác bản chất: năng lượng từ đáy biển, bước sóng rất dài, tốc độ rất lớn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sóng biển chủ yếu do gió.", "b) Sóng thần do động đất ngầm.", "c) Khi có sóng thần nên ra biển xem.", "d) Sóng thần tàn phá mạnh."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: phải sơ tán lên cao, xa bờ.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Gió càng mạnh sóng càng lớn.", "b) Sóng thần ảnh hưởng cả cột nước.", "c) Sóng thần do gió mạnh.", "d) Cần hệ thống cảnh báo sóng thần."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: do động đất, núi lửa ngầm.", "points": 1}, {"type": "short", "level": "VD", "q": "Sóng biển chủ yếu do tác nhân nào gây ra?", "answer": "Gió", "explain": "Gió là nguyên nhân chủ yếu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sóng lớn do động đất dưới đáy biển gây ra gọi là gì?", "answer": "Sóng thần", "explain": "Sóng thần (tsunami).", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Thủy triều là gì?", "options": ["A. Sự dao động lên xuống của mực nước biển theo chu kì.", "B. Sóng do gió.", "C. Dòng biển.", "D. Mưa trên biển."], "answer": "A", "explain": "Thủy triều là hiện tượng nước biển dâng lên, hạ xuống theo chu kì.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên nhân chủ yếu sinh ra thủy triều là:", "options": ["A. Lực hấp dẫn của Mặt Trăng (và một phần Mặt Trời).", "B. Gió.", "C. Động đất.", "D. Núi lửa."], "answer": "A", "explain": "Thủy triều chủ yếu do lực hấp dẫn của Mặt Trăng (Mặt Trăng gần Trái Đất nhất) cùng lực li tâm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Mặt Trăng ảnh hưởng đến thủy triều mạnh hơn Mặt Trời?", "options": ["A. Vì Mặt Trăng gần Trái Đất hơn nhiều, dù khối lượng nhỏ hơn.", "B. Vì Mặt Trăng to hơn.", "C. Vì Mặt Trăng nóng hơn.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Lực hấp dẫn phụ thuộc khoảng cách; Mặt Trăng gần nên ảnh hưởng thủy triều mạnh gấp đôi Mặt Trời.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bán nhật triều là thủy triều:", "options": ["A. Lên xuống 2 lần mỗi ngày.", "B. Lên xuống 1 lần mỗi ngày.", "C. Không đều.", "D. Không có."], "answer": "A", "explain": "Bán nhật triều: mỗi ngày 2 lần nước lên, 2 lần nước xuống.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ngư dân thường ra khơi khi nước lên. Vì sao?", "options": ["A. Vì nước lên tàu dễ ra vào cửa sông, luồng lạch sâu hơn.", "B. Vì cá nhiều.", "C. Vì trời đẹp.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Nước lên làm luồng lạch sâu, tàu thuyền ra vào thuận lợi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Triều cường xảy ra khi:", "options": ["A. Mặt Trăng, Mặt Trời, Trái Đất thẳng hàng (trăng tròn, trăng khuyết).", "B. Ba thiên thể vuông góc.", "C. Ngẫu nhiên.", "D. Khi có bão."], "answer": "A", "explain": "Thẳng hàng thì lực hấp dẫn cộng hưởng → triều cường (biên độ lớn nhất).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thủy triều là dao động mực nước theo chu kì.", "b) Do lực hấp dẫn Mặt Trăng.", "c) Bán nhật triều 2 lần/ngày.", "d) Thủy triều do gió."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mặt Trăng ảnh hưởng thủy triều mạnh hơn Mặt Trời.", "b) Triều cường khi ba thiên thể thẳng hàng.", "c) Ngư dân lợi dụng thủy triều.", "d) Triều kém khi thẳng hàng."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: triều kém khi vuông góc.", "points": 1}, {"type": "short", "level": "VD", "q": "Thủy triều lên xuống 2 lần mỗi ngày gọi là gì?", "answer": "Bán nhật triều", "explain": "Bán nhật triều.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Khi Mặt Trăng, Mặt Trời, Trái Đất thẳng hàng thì xảy ra triều gì?", "answer": "Triều cường", "explain": "Triều cường (biên độ lớn nhất).", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Dòng biển là gì?", "options": ["A. Sự chuyển động thành dòng của nước biển.", "B. Sóng biển.", "C. Thủy triều.", "D. Mưa trên biển."], "answer": "A", "explain": "Dòng biển (hải lưu) là sự chuyển động thành dòng của nước biển.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên nhân chủ yếu sinh ra dòng biển là:", "options": ["A. Gió thường xuyên thổi trên mặt biển.", "B. Động đất.", "C. Núi lửa.", "D. Thủy triều."], "answer": "A", "explain": "Gió thường xuyên (Mậu dịch, Tây ôn đới) là nguyên nhân chủ yếu sinh ra dòng biển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dòng biển nóng và dòng biển lạnh khác nhau ở:", "options": ["A. Nhiệt độ so với vùng biển xung quanh.", "B. Tốc độ.", "C. Màu sắc.", "D. Độ sâu."], "answer": "A", "explain": "Dòng nóng có nhiệt độ cao hơn, dòng lạnh thấp hơn vùng biển xung quanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ven bờ đông các đại dương thường có dòng biển:", "options": ["A. Lạnh.", "B. Nóng.", "C. Không có dòng biển.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Ven bờ đông đại dương thường có dòng biển lạnh (ví dụ California, Peru, Benguela).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Dòng biển nóng Gulf Stream làm cho Tây Âu ấm hơn. Vì sao?", "options": ["A. Vì mang nước ấm từ vùng nhiệt đới lên, sưởi ấm ven bờ.", "B. Vì gần xích đạo.", "C. Vì gió mạnh.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Gulf Stream mang nước ấm từ Caribê lên Tây Âu, làm khí hậu ôn hòa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hoang mạc Atacama (Chile) khô hạn một phần do:", "options": ["A. Dòng biển lạnh Peru chảy ven bờ làm ít mưa.", "B. Ở xa biển.", "C. Núi thấp.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Dòng Peru lạnh làm không khí khó bốc lên, ít mưa — góp phần tạo Atacama khô nhất thế giới.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dòng biển là chuyển động thành dòng của nước biển.", "b) Do gió thường xuyên sinh ra.", "c) Ven bờ đông đại dương thường có dòng lạnh.", "d) Dòng biển do thủy triều."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Gulf Stream sưởi ấm Tây Âu.", "b) Dòng lạnh Peru góp phần tạo Atacama.", "c) Dòng nóng gây mưa, dòng lạnh gây khô.", "d) Dòng biển không ảnh hưởng khí hậu."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: ảnh hưởng rõ rệt.", "points": 1}, {"type": "short", "level": "VD", "q": "Dòng biển mang nước ấm từ nhiệt đới lên ôn đới gọi là dòng biển gì?", "answer": "Dòng biển nóng", "explain": "Dòng biển nóng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Dòng biển nào sưởi ấm cho Tây Âu?", "answer": "Gulf Stream", "explain": "Dòng Gulf Stream (dòng Vịnh).", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Nhiệt độ nước biển thay đổi theo:", "options": ["A. Vĩ độ, mùa và độ sâu.", "B. Chỉ vĩ độ.", "C. Không thay đổi.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Nhiệt độ nước biển giảm theo vĩ độ, thay đổi theo mùa, giảm theo độ sâu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vùng biển nào có nhiệt độ cao nhất?", "options": ["A. Vùng xích đạo.", "B. Vùng cực.", "C. Vùng ôn đới.", "D. Vùng chí tuyến."], "answer": "A", "explain": "Xích đạo nhận nhiều bức xạ nên nước biển ấm nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nhiệt độ nước biển thay đổi chậm hơn nhiệt độ không khí?", "options": ["A. Vì nước có nhiệt dung lớn, nóng chậm lạnh chậm.", "B. Vì biển sâu.", "C. Vì biển rộng.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Nước nhiệt dung lớn nên thay đổi nhiệt chậm — biển điều hòa khí hậu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Càng xuống sâu, nhiệt độ nước biển:", "options": ["A. Càng giảm.", "B. Càng tăng.", "C. Không đổi.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Ánh sáng, nhiệt khó xuống sâu nên nhiệt độ giảm theo độ sâu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vùng biển ven bờ Việt Nam ấm quanh năm vì:", "options": ["A. Ở vùng nhiệt đới, nhận nhiều bức xạ.", "B. Có dòng biển nóng.", "C. Nước cạn.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Việt Nam ở vùng nhiệt đới nên nước biển ấm quanh năm, thuận lợi cho thủy sản nhiệt đới.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nước biển ấm lên toàn cầu gây hệ quả nào?", "options": ["A. Băng tan, nước biển dâng, bão mạnh hơn, san hô tẩy trắng.", "B. Không hệ quả.", "C. Biển lạnh đi.", "D. Mưa ít đi khắp nơi."], "answer": "A", "explain": "Biển ấm: băng tan, dâng mực nước, bão mạnh, san hô tẩy trắng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhiệt độ nước biển giảm theo vĩ độ.", "b) Càng sâu càng lạnh.", "c) Nước nhiệt dung lớn.", "d) Biển xích đạo lạnh nhất."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: xích đạo ấm nhất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Biển điều hòa khí hậu ven bờ.", "b) Biển ấm lên gây bão mạnh hơn.", "c) San hô tẩy trắng do biển ấm.", "d) Nhiệt độ biển không đổi theo mùa."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thay đổi theo mùa.", "points": 1}, {"type": "short", "level": "VD", "q": "Vùng biển nào ấm nhất?", "answer": "Xích đạo", "explain": "Vùng biển xích đạo ấm nhất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hiện tượng san hô mất màu do nước biển ấm lên gọi là gì?", "answer": "Tẩy trắng san hô", "explain": "Tẩy trắng san hô (coral bleaching).", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Thủy triều lên xuống 1 lần mỗi ngày gọi là:", "options": ["A. Nhật triều.", "B. Bán nhật triều.", "C. Triều cường.", "D. Triều kém."], "answer": "A", "explain": "Nhật triều: 1 lần lên, 1 lần xuống mỗi ngày.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Triều kém xảy ra khi:", "options": ["A. Mặt Trăng, Mặt Trời vuông góc với nhau (so với Trái Đất).", "B. Thẳng hàng.", "C. Ngẫu nhiên.", "D. Khi có bão."], "answer": "A", "explain": "Vuông góc thì lực hấp dẫn triệt tiêu bớt → triều kém (biên độ nhỏ).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ứng dụng nào của thủy triều trong đời sống?", "options": ["A. Đánh bắt thủy sản, giao thông thủy, phát điện.", "B. Trồng lúa.", "C. Chăn nuôi.", "D. Không ứng dụng."], "answer": "A", "explain": "Thủy triều phục vụ đánh cá, tàu bè ra vào, nhà máy điện thủy triều.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao có thể phát điện bằng thủy triều?", "options": ["A. Vì chênh lệch mực nước lên xuống tạo thế năng làm quay tuabin.", "B. Vì nước mặn.", "C. Vì sóng lớn.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Chênh lệch mực nước tạo dòng chảy qua tuabin phát điện (năng lượng tái tạo).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một số vùng ven biển Việt Nam có nhật triều (như Hải Phòng). Đặc điểm là:", "options": ["A. Mỗi ngày 1 lần nước lên, 1 lần xuống.", "B. 2 lần lên xuống.", "C. Không có thủy triều.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Vùng biển Đông Bắc (Hải Phòng, Quảng Ninh) có chế độ nhật triều.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khi triều cường kết hợp với bão, vùng ven biển thấp đối mặt với:", "options": ["A. Ngập lụt nghiêm trọng do nước dâng cao.", "B. Không sao.", "C. Hạn hán.", "D. Động đất."], "answer": "A", "explain": "Triều cường + nước dâng do bão gây ngập lụt ven biển nghiêm trọng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhật triều 1 lần/ngày.", "b) Triều kém khi vuông góc.", "c) Thủy triều phát điện được.", "d) Hải Phòng có nhật triều."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Triều cường + bão gây ngập nặng.", "b) Điện thủy triều là năng lượng tái tạo.", "c) Thủy triều không có ứng dụng.", "d) Biên độ triều lớn nhất khi thẳng hàng."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Thủy triều lên xuống 1 lần mỗi ngày gọi là gì?", "answer": "Nhật triều", "explain": "Nhật triều.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Khi Mặt Trăng và Mặt Trời vuông góc thì xảy ra triều gì?", "answer": "Triều kém", "explain": "Triều kém (biên độ nhỏ).", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Ở Bắc bán cầu, các dòng biển tạo thành vòng xoáy theo chiều:", "options": ["A. Chiều kim đồng hồ.", "B. Ngược chiều kim đồng hồ.", "C. Không có vòng xoáy.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Bắc bán cầu: vòng xoáy dòng biển theo chiều kim đồng hồ (do lực Coriolis).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dòng biển lạnh Peru chảy ven bờ:", "options": ["A. Tây Nam Mỹ.", "B. Đông Á.", "C. Tây Âu.", "D. Đông Phi."], "answer": "A", "explain": "Dòng Peru (Humboldt) lạnh chảy ven bờ tây Nam Mỹ (bờ đông Thái Bình Dương).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao dòng biển lạnh thường gây khô hạn cho ven bờ?", "options": ["A. Vì làm không khí lạnh, khó bốc lên, ít mưa.", "B. Vì mang nhiều muối.", "C. Vì chảy nhanh.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Không khí trên dòng lạnh bị làm lạnh, ổn định, khó bốc lên tạo mưa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dòng biển nóng Kuroshio ảnh hưởng đến:", "options": ["A. Khí hậu Nhật Bản (ấm, ẩm hơn).", "B. Khí hậu châu Phi.", "C. Khí hậu Nam Mỹ.", "D. Không ảnh hưởng."], "answer": "A", "explain": "Kuroshio (dòng Nhật Bản) mang nước ấm lên, làm Nhật Bản ấm ẩm hơn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ngư trường lớn thường hình thành nơi dòng nóng gặp dòng lạnh vì:", "options": ["A. Nước trồi mang chất dinh dưỡng, sinh vật phù du phát triển, cá tụ về.", "B. Nước đẹp.", "C. Sóng êm.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Nơi gặp nhau có nước trồi giàu dinh dưỡng → chuỗi thức ăn phát triển → ngư trường lớn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hiện tượng El Nino liên quan đến dòng biển nào?", "options": ["A. Dòng Peru: nước ấm bất thường thay thế nước lạnh ven bờ Tây Nam Mỹ.", "B. Gulf Stream.", "C. Kuroshio.", "D. Benguela."], "answer": "A", "explain": "El Nino: dòng nước ấm từ xích đạo tràn xuống thay dòng Peru lạnh, gây biến động khí hậu toàn cầu.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bắc bán cầu vòng xoáy theo chiều kim đồng hồ.", "b) Dòng Peru lạnh ven Tây Nam Mỹ.", "c) Dòng lạnh gây khô.", "d) Kuroshio ảnh hưởng Nhật Bản."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ngư trường lớn nơi dòng nóng gặp dòng lạnh.", "b) El Nino liên quan dòng Peru.", "c) Dòng nóng gây khô hạn.", "d) Dòng biển không ảnh hưởng ngư trường."], "answer": ["T", "T", "F", "F"], "explain": "a, b đúng. c sai: dòng lạnh gây khô. d sai: ảnh hưởng lớn.", "points": 1}, {"type": "short", "level": "VD", "q": "Dòng biển lạnh chảy ven bờ Tây Nam Mỹ tên là gì?", "answer": "Dòng Peru", "explain": "Dòng Peru (Humboldt).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hiện tượng nước ấm bất thường thay dòng Peru lạnh gọi là gì?", "answer": "El Nino", "explain": "El Nino.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Tài nguyên biển gồm:", "options": ["A. Sinh vật, khoáng sản, năng lượng, du lịch.", "B. Chỉ cá.", "C. Chỉ dầu khí.", "D. Chỉ muối."], "answer": "A", "explain": "Biển giàu tài nguyên: sinh vật, khoáng sản (dầu khí), năng lượng (thủy triều, sóng, gió), du lịch.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguồn lợi thủy sản của biển phụ thuộc vào:", "options": ["A. Sinh vật phù du, dòng biển, độ sâu, nhiệt độ.", "B. Chỉ độ sâu.", "C. Chỉ nhiệt độ.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Thủy sản phụ thuộc chuỗi thức ăn (phù du), dòng biển mang dinh dưỡng, môi trường nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cần khai thác thủy sản hợp lí?", "options": ["A. Vì khai thác quá mức làm cạn kiệt nguồn lợi, phá vỡ cân bằng sinh thái.", "B. Vì cá đắt.", "C. Vì biển sâu.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Khai thác bừa bãi (kích điện, lưới mắt nhỏ) làm cạn kiệt nguồn lợi biển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ô nhiễm biển chủ yếu do:", "options": ["A. Dầu tràn, rác thải nhựa, nước thải công nghiệp và sinh hoạt.", "B. Mưa.", "C. Sóng.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Ô nhiễm biển: sự cố tràn dầu, rác nhựa, nước thải — đe dọa sinh vật biển.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Rác thải nhựa trên biển gây hại vì:", "options": ["A. Sinh vật biển nuốt phải, mắc kẹt; vi nhựa xâm nhập chuỗi thức ăn.", "B. Làm nước đẹp.", "C. Không gây hại.", "D. Làm cá nhiều."], "answer": "A", "explain": "Rác nhựa gây chết sinh vật biển, vi nhựa vào chuỗi thức ăn ảnh hưởng cả con người.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để phát triển kinh tế biển bền vững, cần:", "options": ["A. Khai thác hợp lí, bảo vệ môi trường, chống ô nhiễm, hợp tác quốc tế.", "B. Khai thác tối đa.", "C. Cấm đánh cá hoàn toàn.", "D. Không cần làm gì."], "answer": "A", "explain": "Kinh tế biển bền vững: khai thác đi đôi với bảo vệ môi trường biển.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Biển giàu tài nguyên sinh vật, khoáng sản.", "b) Cần khai thác thủy sản hợp lí.", "c) Ô nhiễm biển do dầu tràn, rác nhựa.", "d) Biển không có tài nguyên."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Rác nhựa gây hại sinh vật biển.", "b) Kinh tế biển cần bền vững.", "c) Khai thác bừa bãi làm cạn kiệt nguồn lợi.", "d) Ô nhiễm biển không ảnh hưởng con người."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: ảnh hưởng qua chuỗi thức ăn.", "points": 1}, {"type": "short", "level": "VD", "q": "Sự cố nào gây ô nhiễm biển nghiêm trọng nhất từ tàu chở dầu?", "answer": "Tràn dầu", "explain": "Tràn dầu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Loại rác nào đang là mối đe dọa lớn nhất với sinh vật biển hiện nay?", "answer": "Rác thải nhựa", "explain": "Rác thải nhựa.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Muối trong nước biển chủ yếu từ:", "options": ["A. Đất liền do sông mang ra và hoạt động địa chất đáy biển.", "B. Mưa.", "C. Không khí.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Sông mang muối hòa tan từ đất liền ra biển tích tụ hàng triệu năm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vì sao nước sông ngọt còn nước biển mặn?", "options": ["A. Vì muối theo sông ra biển tích tụ, nước biển bốc hơi để lại muối.", "B. Vì sông ngắn.", "C. Vì biển sâu.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Nước bốc hơi (ngọt) để lại muối; muối tích tụ dần trong biển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Độ muối của biển thay đổi theo mùa ở vùng nào?", "options": ["A. Vùng mưa theo mùa: mùa mưa độ muối giảm, mùa khô tăng.", "B. Không thay đổi.", "C. Vùng cực.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Mưa theo mùa làm độ muối dao động: mưa nhiều pha loãng, khô bốc hơi đậm đặc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vùng biển Việt Nam có độ muối khoảng 32-34‰, hơi thấp hơn trung bình vì:", "options": ["A. Nhiều sông lớn đổ ra + mưa nhiều.", "B. Ít sông.", "C. Vùng lạnh.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Nhiều sông (Hồng, Mê Kông...) đổ ra + mưa nhiều làm độ muối ven bờ thấp hơn 35‰.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Người ta sản xuất muối ăn từ nước biển bằng cách:", "options": ["A. Phơi nước biển cho bốc hơi, muối kết tinh lại.", "B. Đun sôi.", "C. Lọc.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Ruộng muối: dẫn nước biển vào, phơi nắng cho bốc hơi, thu muối kết tinh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vùng biển nào sau đây có độ muối thấp nhất?", "options": ["A. Biển Baltic (khoảng 10‰).", "B. Biển Đỏ (41‰).", "C. Địa Trung Hải (39‰).", "D. Đại Tây Dương (35‰)."], "answer": "A", "explain": "Baltic thấp nhất trong các đáp án do lạnh, nhiều sông, biển kín.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Muối biển do sông mang từ đất liền ra.", "b) Nước bốc hơi để lại muối.", "c) Biển Việt Nam độ muối 32-34‰.", "d) Muối biển từ mưa."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mùa mưa độ muối giảm.", "b) Làm muối bằng phơi bốc hơi.", "c) Baltic độ muối rất thấp.", "d) Độ muối không bao giờ thay đổi."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thay đổi theo vùng, mùa.", "points": 1}, {"type": "short", "level": "VD", "q": "Nghề sản xuất muối ăn từ nước biển bằng cách phơi nắng gọi là nghề gì?", "answer": "Làm muối", "explain": "Nghề làm muối (diêm nghiệp).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Biển nào có độ muối thấp nhất trong các biển: Baltic, Biển Đỏ, Địa Trung Hải?", "answer": "Biển Baltic", "explain": "Biển Baltic (~10‰).", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Đại dương nào lớn nhất?", "options": ["A. Thái Bình Dương.", "B. Đại Tây Dương.", "C. Ấn Độ Dương.", "D. Bắc Băng Dương."], "answer": "A", "explain": "Thái Bình Dương lớn nhất, chiếm khoảng 1/3 bề mặt Trái Đất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biển và đại dương chiếm khoảng bao nhiêu % bề mặt Trái Đất?", "options": ["A. 71%.", "B. 29%.", "C. 50%.", "D. 97,5%."], "answer": "A", "explain": "Biển và đại dương chiếm khoảng 71% bề mặt Trái Đất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vai trò của biển và đại dương với khí hậu:", "options": ["A. Điều hòa nhiệt độ, cung cấp hơi nước gây mưa.", "B. Không vai trò.", "C. Chỉ gây bão.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Biển là 'máy điều hòa' của Trái Đất: điều hòa nhiệt, cung cấp hơi nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giao thông đường biển quan trọng vì:", "options": ["A. Vận chuyển khối lượng lớn, giá rẻ giữa các châu lục.", "B. Nhanh nhất.", "C. Không quan trọng.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Đường biển vận chuyển hàng hóa khối lượng lớn với chi phí thấp nhất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Việt Nam có đường bờ biển dài, thuận lợi cho:", "options": ["A. Đánh bắt thủy sản, du lịch biển, giao thông đường biển.", "B. Trồng lúa.", "C. Khai thác rừng.", "D. Không thuận lợi."], "answer": "A", "explain": "Bờ biển dài 3260 km là lợi thế lớn cho kinh tế biển Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Bảo vệ chủ quyền biển đảo của Việt Nam có ý nghĩa:", "options": ["A. Bảo vệ tài nguyên, an ninh quốc phòng và phát triển kinh tế biển.", "B. Chỉ ý nghĩa tinh thần.", "C. Không ý nghĩa.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Biển đảo gắn với tài nguyên, an ninh và phát triển bền vững đất nước.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thái Bình Dương lớn nhất.", "b) Biển chiếm 71% bề mặt.", "c) Biển điều hòa khí hậu.", "d) Đường biển vận chuyển giá rẻ."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Việt Nam bờ biển dài thuận lợi kinh tế biển.", "b) Bảo vệ biển đảo có ý nghĩa to lớn.", "c) Biển không có vai trò giao thông.", "d) Biển cung cấp hơi nước gây mưa."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Đại dương lớn nhất thế giới tên là gì?", "answer": "Thái Bình Dương", "explain": "Thái Bình Dương.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đường bờ biển Việt Nam dài khoảng bao nhiêu km?", "answer": "3260", "explain": "Khoảng 3260 km.", "points": 0.5}]}]}</script>
