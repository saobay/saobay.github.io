ó chảy qua.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ven bờ tây các đại dương thường có dòng biển nóng vì:", "options": ["A. Nước ấm từ xích đạo được gió đẩy dồn về phía tây.", "B. Gần cực.", "C. Ngẫu nhiên.", "D. Sông đổ ra."], "answer": "A", "explain": "Gió Mậu dịch đẩy nước ấm về phía tây đại dương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dòng biển lạnh Benguela chảy ven bờ:", "options": ["A. Tây Nam Phi.", "B. Đông Á.", "C. Tây Âu.", "D. Đông Mỹ."], "answer": "A", "explain": "Dòng Benguela lạnh chảy ven bờ tây Nam Phi (bờ đông Đại Tây Dương).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hoang mạc Namib (Tây Nam Phi) khô hạn một phần do:", "options": ["A. Dòng Benguela lạnh làm không khí ổn định, ít mưa.", "B. Ở xa biển.", "C. Địa hình thấp.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Dòng lạnh ven bờ gây khô hạn — tương tự Atacama với dòng Peru.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tàu thuyền đi từ châu Âu sang châu Mỹ thường lợi dụng:", "options": ["A. Dòng biển và gió để tiết kiệm nhiên liệu, rút ngắn thời gian.", "B. Sóng thần.", "C. Thủy triều.", "D. Không lợi dụng gì."], "answer": "A", "explain": "Hàng hải lợi dụng dòng biển, gió xuôi chiều để tiết kiệm nhiên liệu.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dòng biển do gió thường xuyên.", "b) Dòng nóng ấm hơn xung quanh.", "c) Ven bờ tây đại dương thường có dòng nóng.", "d) Dòng Benguela ven Tây Nam Phi."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dòng Benguela gây khô Namib.", "b) Tàu thuyền lợi dụng dòng biển.", "c) Dòng lạnh gây mưa nhiều.", "d) Dòng biển do thủy triều."], "answer": ["T", "T", "F", "F"], "explain": "a, b đúng. c sai: dòng lạnh gây khô. d sai: do gió.", "points": 1}, {"type": "short", "level": "VD", "q": "Dòng biển lạnh chảy ven bờ Tây Nam Phi tên là gì?", "answer": "Dòng Benguela", "explain": "Dòng Benguela.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hoang mạc nào ở Tây Nam Phi chịu ảnh hưởng của dòng Benguela?", "answer": "Hoang mạc Namib", "explain": "Hoang mạc Namib.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Nhiệt độ nước biển cao nhất ở:", "options": ["A. Vùng xích đạo.", "B. Vùng cực.", "C. Vùng ôn đới.", "D. Vùng núi cao."], "answer": "A", "explain": "Xích đạo nhận nhiều bức xạ Mặt Trời nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Càng xuống sâu dưới biển, nhiệt độ nước:", "options": ["A. Càng giảm.", "B. Càng tăng.", "C. Không đổi.", "D. Lúc tăng lúc giảm."], "answer": "A", "explain": "Nhiệt và ánh sáng khó truyền xuống sâu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biển có tác dụng điều hòa khí hậu vì:", "options": ["A. Nước nhiệt dung lớn, nóng chậm lạnh chậm.", "B. Biển sâu.", "C. Biển rộng.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Nhiệt dung lớn giúp ven biển mùa hạ mát, mùa đông ấm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vùng ven biển thường có khí hậu ôn hòa hơn trong đất liền vì:", "options": ["A. Biển điều hòa nhiệt độ.", "B. Gió mạnh.", "C. Mưa nhiều.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Biển làm giảm biên độ nhiệt ngày đêm và mùa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Mùa đông, vùng ven biển miền Bắc Việt Nam ấm hơn vùng núi cao vì:", "options": ["A. Biển giữ nhiệt, điều hòa; núi cao lạnh do độ cao.", "B. Gần xích đạo.", "C. Nhiều nhà.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Biển điều hòa nhiệt; càng lên cao nhiệt độ càng giảm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Biến đổi khí hậu làm nước biển ấm lên sẽ ảnh hưởng đến bão vì:", "options": ["A. Biển ấm cung cấp nhiều năng lượng, hơi nước làm bão mạnh hơn.", "B. Bão yếu đi.", "C. Không ảnh hưởng.", "D. Bão mất hẳn."], "answer": "A", "explain": "Bão nhiệt đới lấy năng lượng từ nước biển ấm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Biển xích đạo ấm nhất.", "b) Càng sâu càng lạnh.", "c) Nước nhiệt dung lớn.", "d) Biển cực ấm nhất."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Biển điều hòa khí hậu ven bờ.", "b) Biển ấm làm bão mạnh hơn.", "c) Ven biển ôn hòa hơn nội địa.", "d) Nhiệt độ biển không đổi."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thay đổi theo vĩ độ, mùa, độ sâu.", "points": 1}, {"type": "short", "level": "VD", "q": "Vì sao biển có tác dụng điều hòa khí hậu?", "answer": "Nhiệt dung lớn", "explain": "Nước có nhiệt dung lớn, nóng chậm lạnh chậm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Bão nhiệt đới lấy năng lượng từ đâu?", "answer": "Nước biển ấm", "explain": "Từ nước biển ấm (hơi nước và nhiệt).", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Tài nguyên sinh vật biển gồm:", "options": ["A. Cá, tôm, rong biển và các sinh vật khác.", "B. Chỉ cá.", "C. Dầu khí.", "D. Muối."], "answer": "A", "explain": "Sinh vật biển đa dạng: cá, tôm, mực, rong biển...", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tài nguyên khoáng sản quan trọng nhất của biển là:", "options": ["A. Dầu khí.", "B. Vàng.", "C. Than.", "D. Sắt."], "answer": "A", "explain": "Dầu khí ở thềm lục địa là khoáng sản biển quan trọng nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đánh bắt bằng kích điện, chất nổ bị cấm vì:", "options": ["A. Hủy diệt nguồn lợi, phá hủy môi trường sống của sinh vật.", "B. Tốn điện.", "C. Cá chạy nhanh.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Kích điện, chất nổ diệt cả cá con, phá hủy san hô, hệ sinh thái.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nuôi trồng thủy sản phát triển giúp:", "options": ["A. Giảm áp lực khai thác tự nhiên, tăng nguồn cung.", "B. Ô nhiễm thêm.", "C. Không lợi ích.", "D. Cá tự nhiên mất."], "answer": "A", "explain": "Nuôi trồng đáp ứng nhu cầu, giảm khai thác bừa bãi ngoài tự nhiên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sự cố tràn dầu trên biển gây hại vì:", "options": ["A. Dầu phủ mặt biển, giết sinh vật, ô nhiễm lâu dài.", "B. Làm nước đẹp.", "C. Cá thích.", "D. Không hại."], "answer": "A", "explain": "Dầu ngăn trao đổi khí, độc hại, tồn tại lâu trong môi trường biển.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phát triển du lịch biển bền vững cần:", "options": ["A. Bảo vệ cảnh quan, xử lí rác thải, không phá san hô.", "B. Xây kín bờ biển.", "C. Xả rác tự nhiên.", "D. Không cần quy hoạch."], "answer": "A", "explain": "Du lịch biển bền vững gắn với bảo vệ môi trường biển.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sinh vật biển đa dạng.", "b) Dầu khí là khoáng sản biển quan trọng.", "c) Cấm kích điện, chất nổ.", "d) Biển không có tài nguyên."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tràn dầu gây hại lâu dài.", "b) Nuôi trồng giảm áp lực khai thác.", "c) Du lịch biển cần bền vững.", "d) Xả rác ra biển không sao."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Tài nguyên khoáng sản quan trọng nhất dưới đáy biển là gì?", "answer": "Dầu khí", "explain": "Dầu khí.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hình thức đánh bắt nào bị cấm vì hủy diệt nguồn lợi: kích điện hay câu tay?", "answer": "Kích điện", "explain": "Kích điện (và chất nổ) bị cấm.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Vòng tuần hoàn của nước diễn ra nhờ:", "options": ["A. Năng lượng Mặt Trời và trọng lực.", "B. Gió.", "C. Động đất.", "D. Con người."], "answer": "A", "explain": "Mặt Trời gây bốc hơi; trọng lực kéo nước mưa chảy xuống, thấm xuống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong vòng tuần hoàn, nước từ biển trở lại đất liền nhờ:", "options": ["A. Gió đưa hơi nước vào đất liền gây mưa.", "B. Sông chảy ngược.", "C. Thủy triều.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Hơi nước từ biển được gió đưa vào đất liền, ngưng tụ gây mưa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Con người làm gián đoạn vòng tuần hoàn nước khi:", "options": ["A. Bê tông hóa làm giảm thấm, chặt rừng làm giảm bốc hơi, ô nhiễm nguồn nước.", "B. Trồng cây.", "C. Đào giếng.", "D. Không bao giờ."], "answer": "A", "explain": "Đô thị hóa, phá rừng, ô nhiễm đều ảnh hưởng các khâu của vòng tuần hoàn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tiết kiệm nước trong sinh hoạt gồm:", "options": ["A. Khóa vòi khi không dùng, tái sử dụng nước, sửa rò rỉ.", "B. Xả nước thoải mái.", "C. Tắm lâu.", "D. Không cần tiết kiệm."], "answer": "A", "explain": "Thói quen tiết kiệm nước hàng ngày rất quan trọng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một thành phố bê tông hóa nhiều, khi mưa lớn thường ngập vì:", "options": ["A. Nước không thấm được xuống đất, dồn hết ra cống gây quá tải.", "B. Mưa to.", "C. Sông cạn.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Bê tông ngăn thấm → nước mặt tăng đột ngột → ngập úng đô thị.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để thành phố chống ngập bền vững, giải pháp là:", "options": ["A. Tăng mảng xanh, hồ điều hòa, cống thoát tốt, giữ đất thấm nước.", "B. Bê tông thêm.", "C. Lấp hồ.", "D. Không làm gì."], "answer": "A", "explain": "'Thành phố bọt biển': tăng thấm, trữ nước mưa, thoát nước tốt.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vòng tuần hoàn nhờ Mặt Trời và trọng lực.", "b) Gió đưa hơi nước vào đất liền.", "c) Cần tiết kiệm nước.", "d) Bê tông hóa không gây ngập."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: bê tông hóa gây ngập.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chặt rừng ảnh hưởng vòng tuần hoàn.", "b) Hồ điều hòa giúp chống ngập.", "c) Mảng xanh tăng thấm nước.", "d) Ô nhiễm không ảnh hưởng nước."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Vòng tuần hoàn nước diễn ra nhờ năng lượng từ đâu?", "answer": "Mặt Trời", "explain": "Năng lượng Mặt Trời (và trọng lực).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thành phố nhiều bê tông, ít cây xanh khi mưa lớn dễ bị gì?", "answer": "Ngập úng", "explain": "Ngập úng đô thị.", "points": 0.5}]}]}</script>
