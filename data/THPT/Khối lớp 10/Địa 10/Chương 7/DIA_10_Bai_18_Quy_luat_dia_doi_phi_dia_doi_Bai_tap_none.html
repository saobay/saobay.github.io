{"type": "mcq", "level": "NB", "points": 0.25, "q": "Góc nhập xạ là", "options": ["A. góc chiếu sáng của Mặt Trời xuống bề mặt Trái Đất.", "B. góc giữa hai đường kinh tuyến.", "C. góc nghiêng của trục Trái Đất.", "D. góc giữa xích đạo và chí tuyến."], "answer": "A", "explain": "Góc nhập xạ (góc tới của tia nắng) giảm dần từ xích đạo về cực, gây ra quy luật địa đới."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Càng lên cao, nhiệt độ không khí thay đổi như thế nào?", "options": ["A. Càng tăng", "B. Càng giảm", "C. Không thay đổi", "D. Lúc tăng lúc giảm thất thường"], "answer": "B", "explain": "Trong tầng đối lưu, nhiệt độ giảm dần theo độ cao (trung bình 0,6 độ C mỗi 100 m) — cơ sở của quy luật đai cao."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao ở cùng một vĩ độ, sườn đón gió thường mưa nhiều hơn sườn khuất gió?", "options": ["A. Do sườn đón gió cao hơn.", "B. Do không khí ẩm bị địa hình chặn lại, bốc lên cao gây mưa ở sườn đón gió; xuống sườn khuất gió trở nên khô nóng (hiệu ứng phơn).", "C. Do con người tưới nước một bên.", "D. Do sườn khuất gió gần biển hơn."], "answer": "B", "explain": "Địa hình làm phân bố lại mưa theo hướng sườn — biểu hiện của phi địa đới (vai trò của địa hình)."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Dãy Trường Sơn (Việt Nam) có sườn đông mưa nhiều vào thu đông, sườn tây mưa nhiều vào hè thu. Hiện tượng này chủ yếu do", "options": ["A. quy luật địa đới.", "B. địa hình (hướng sườn) kết hợp với gió mùa — thuộc nhóm phi địa đới.", "C. con người tạo ra.", "D. ngẫu nhiên."], "answer": "B", "explain": "Hướng sườn so với gió mùa quyết định mùa mưa khác nhau — vai trò của địa hình (phi địa đới)."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong các yếu tố sau, yếu tố nào thuộc nguyên nhân bên trong gây ra phi địa đới?", "options": ["A. Bức xạ Mặt Trời", "B. Sự phân bố lục địa, đại dương và địa hình do nội lực tạo ra", "C. Gió mùa", "D. Dòng biển"], "answer": "B", "explain": "Nội lực tạo địa hình, phân bố lục địa – đại dương — nguồn năng lượng bên trong gây ra phi địa đới."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một vùng đồng bằng ở vĩ độ 20 độ B có khí hậu nhiệt đới gió mùa, nhưng vùng núi cao 2500 m ngay cạnh đó lại có khí hậu mát mẻ như ôn đới. Sự tồn tại đồng thời này cho thấy", "options": ["A. quy luật địa đới sai.", "B. quy luật đai cao có thể “lấn át” biểu hiện của địa đới ở vùng núi cao.", "C. hai vùng không cùng một quốc gia.", "D. nhiệt độ không phụ thuộc vào độ cao."], "answer": "B", "explain": "Ở vùng núi cao, đai cao chi phối mạnh hơn địa đới: dù vĩ độ thấp (nóng) nhưng độ cao lớn làm khí hậu mát như ôn đới."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Góc nhập xạ giảm dần từ xích đạo về hai cực.", "b) Nhiệt độ giảm dần theo độ cao trong tầng đối lưu.", "c) Sườn đón gió thường mưa nhiều hơn sườn khuất gió.", "d) Địa hình không ảnh hưởng đến phân bố mưa."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: địa hình ảnh hưởng rõ rệt đến phân bố mưa."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dãy Trường Sơn có chế độ mưa khác nhau giữa hai sườn.", "b) Hướng sườn núi ảnh hưởng đến lượng mưa.", "c) Ở vùng núi cao, đai cao có thể lấn át địa đới.", "d) Cùng vĩ độ thì mọi nơi đều có khí hậu giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: địa hình, biển – nội địa làm khí hậu khác nhau."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Trung bình cứ lên cao 100 m, nhiệt độ giảm khoảng bao nhiêu độ C? (ghi dạng số thập phân, ví dụ: 0,6)", "answer": "0,6", "explain": "Trung bình nhiệt độ giảm 0,6 độ C khi lên cao 100 m trong tầng đối lưu."},

]}

{"type": "mcq", "level": "NB", "points": 0.25, "q": "Quy luật nào sau đây do nguồn năng lượng bên ngoài Trái Đất gây ra?", "options": ["A. Quy luật địa đới", "B. Quy luật đai cao", "C. Quy luật địa ô", "D. Cả ba quy luật"], "answer": "A", "explain": "Địa đới do bức xạ Mặt Trời (năng lượng ngoài); đai cao và địa ô do năng lượng bên trong (nội lực)."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Các quy luật nào sau đây do nguồn năng lượng bên trong Trái Đất gây ra?", "options": ["A. Địa đới", "B. Đai cao và địa ô", "C. Thống nhất và hoàn chỉnh", "D. Ngày đêm"], "answer": "B", "explain": "Đai cao và địa ô (phi địa đới) do nội lực — năng lượng bên trong Trái Đất gây ra."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Sắp xếp đúng thứ tự các đới cảnh quan từ xích đạo về cực là", "options": ["A. rừng mưa nhiệt đới – xa-van – hoang mạc – rừng ôn đới – rừng lá kim – đồng rêu.", "B. đồng rêu – rừng lá kim – rừng ôn đới – hoang mạc – xa-van – rừng mưa nhiệt đới.", "C. hoang mạc – xa-van – rừng mưa nhiệt đới – đồng rêu.", "D. rừng lá kim – rừng mưa nhiệt đới – xa-van – hoang mạc."], "answer": "A", "explain": "Thứ tự địa đới từ xích đạo về cực theo nhiệt độ giảm dần."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một du khách đi từ Hà Nội vào TP. Hồ Chí Minh thấy cảnh quan thay đổi: từ đồng bằng ôn hòa sang vùng nhiệt đới nóng ẩm hơn. Sự thay đổi này chủ yếu do", "options": ["A. quy luật địa ô.", "B. quy luật địa đới (vĩ độ giảm dần về phía nam, nhiệt độ tăng).", "C. quy luật đai cao.", "D. ngẫu nhiên."], "answer": "B", "explain": "Hà Nội (21 độ B) đến TP. Hồ Chí Minh (11 độ B): vĩ độ giảm → nóng hơn — thay đổi theo vĩ độ (địa đới)."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao hoang mạc Xa-ha-ra lại nằm ở vĩ độ nhiệt đới (khoảng 20–30 độ) mà không phải ở xích đạo?", "options": ["A. Do ở xích đạo mưa nhiều (hội tụ), còn vĩ độ 20–30 độ chịu ảnh hưởng của khối khí chí tuyến khô nóng.", "B. Do ngẫu nhiên.", "C. Do con người tạo ra.", "D. Do ở đó không có Mặt Trời."], "answer": "A", "explain": "Hoàn lưu khí quyển: xích đạo hội tụ gây mưa; chí tuyến phân kì gây khô — vẫn là biểu hiện của địa đới qua hoàn lưu khí quyển."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ba địa điểm: X (xích đạo, đồng bằng), Y (xích đạo, núi cao 4000 m), Z (vùng cực, đồng bằng). Nơi lạnh nhất và nơi nóng nhất lần lượt là", "options": ["A. X lạnh nhất, Z nóng nhất.", "B. Z và Y lạnh (băng tuyết), X nóng nhất.", "C. Y nóng nhất, X lạnh nhất.", "D. Cả ba nóng như nhau."], "answer": "B", "explain": "X nóng nhất (xích đạo, thấp); Y lạnh do đai cao (đỉnh băng tuyết); Z lạnh do địa đới (cực) — hai quy luật cùng tạo ra lạnh."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Địa đới do năng lượng bên ngoài gây ra.", "b) Đai cao và địa ô do năng lượng bên trong gây ra.", "c) Từ Hà Nội vào TP. Hồ Chí Minh, khí hậu nóng dần lên.", "d) Hoang mạc Xa-ha-ra nằm ở vùng xích đạo."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: Xa-ha-ra ở vĩ độ nhiệt đới (chí tuyến), không phải xích đạo."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Núi cao ở xích đạo có thể có băng tuyết trên đỉnh.", "b) Vùng cực lạnh giá do góc nhập xạ nhỏ.", "c) Cùng vĩ độ, nơi nào cũng nóng như nhau.", "d) Địa đới và đai cao đều làm nhiệt độ giảm."], "answer": ["T", "T", "F", "T"], "explain": "a), b) Đúng. c) Sai: địa hình, biển – nội địa làm khác nhau. d) Đúng: theo vĩ độ và theo độ cao."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Quy luật địa đới do nguồn năng lượng nào gây ra? (2 từ: Mặt Trời hoặc Trái Đất)", "answer": "Mặt Trời", "explain": "Bức xạ Mặt Trời là nguồn năng lượng bên ngoài gây ra địa đới."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Vùng nào trên Trái Đất nóng nhất: xích đạo hay vùng cực?", "answer": "xích đạo", "explain": "Xích đạo nhận bức xạ lớn nhất (góc nhập xạ lớn) nên nóng nhất."}

{"type": "mcq", "level": "NB", "points": 0.25, "q": "Biểu hiện rõ nhất của quy luật đai cao là", "options": ["A. các đới khí hậu.", "B. các vành đai thực vật thay đổi theo độ cao ở vùng núi.", "C. các dòng biển.", "D. sự phân bố dân cư."], "answer": "B", "explain": "Vành đai thực vật, đất thay đổi từ chân lên đỉnh núi — biểu hiện của đai cao."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một ngọn núi ở ôn đới có các vành đai: chân núi rừng lá rộng, trên là rừng hỗn hợp, rồi rừng lá kim, đỉnh là đồng cỏ núi cao. Số vành đai thực vật ở đây là", "options": ["A. 2", "B. 3", "C. 4", "D. 5"], "answer": "C", "explain": "4 vành đai: rừng lá rộng – rừng hỗn hợp – rừng lá kim – đồng cỏ núi cao."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Vì sao số lượng vành đai thực vật ở núi vùng nhiệt đới thường nhiều hơn ở núi vùng ôn đới?", "options": ["A. Vì núi nhiệt đới cao hơn.", "B. Vì chân núi nhiệt đới nóng hơn nên chênh lệch nhiệt độ từ chân lên đỉnh lớn hơn, phân hóa thành nhiều vành đai hơn.", "C. Vì núi ôn đới không có thực vật.", "D. Ngẫu nhiên."], "answer": "B", "explain": "Chênh lệch nhiệt chân – đỉnh càng lớn thì càng phân hóa nhiều vành đai; núi nhiệt đới bắt đầu từ nền nhiệt cao nên có nhiều vành đai hơn."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Quy luật địa ô thể hiện rõ nhất ở", "options": ["A. vùng núi cao.", "B. vùng nội địa rộng lớn (như Trung Á) so với ven biển ở cùng vĩ độ.", "C. vùng xích đạo.", "D. vùng cực."], "answer": "B", "explain": "Lục địa Á – Âu rộng lớn: ven biển ẩm, nội địa khô hạn — địa ô thể hiện rõ."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một nhà quy hoạch muốn trồng rừng chống sa mạc hóa ở rìa hoang mạc. Theo các quy luật đã học, cần lưu ý", "options": ["A. chỉ cần trồng bất kì cây gì.", "B. chọn cây chịu hạn phù hợp với quy luật địa ô (khô hạn), trồng thành vành đai chắn gió cát, kết hợp giữ nước.", "C. trồng cây ưa nước.", "D. không thể trồng được."], "answer": "B", "explain": "Vùng rìa hoang mạc khô hạn (địa ô): phải chọn cây chịu hạn, trồng vành đai chắn cát, giữ ẩm — tôn trọng quy luật tự nhiên."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) 7 đới khí hậu là biểu hiện của địa đới.", "b) Vành đai thực vật theo độ cao là biểu hiện của đai cao.", "c) Nội địa Trung Á khô hạn hơn ven biển Đông Á ở cùng vĩ độ.", "d) Mọi vùng núi đều có số vành đai thực vật như nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: số vành đai phụ thuộc độ cao núi và nền nhiệt chân núi."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Núi nhiệt đới thường có nhiều vành đai thực vật hơn núi ôn đới.", "b) Trồng rừng chống sa mạc hóa cần chọn cây chịu hạn.", "c) Quy luật tự nhiên cần được tôn trọng trong sản xuất.", "d) Có thể trồng cây ưa nước ở rìa hoang mạc mà không cần biện pháp gì."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phải có biện pháp giữ nước, chọn cây phù hợp."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Sự phân bố các đới khí hậu trên Trái Đất là biểu hiện của quy luật nào? (2 từ)", "answer": "địa đới", "explain": "Các đới khí hậu phân bố theo vĩ độ — biểu hiện của địa đới."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Sự thay đổi cảnh quan từ ven biển vào sâu nội địa (rừng – thảo nguyên – hoang mạc) là biểu hiện của quy luật nào? (2 từ)", "answer": "địa ô", "explain": "Thay đổi theo kinh độ — quy luật địa ô."}
]}
,
{"name": "Đề 7", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Quy luật địa đới và quy luật phi địa đới khác nhau ở", "options": ["A. nguyên nhân gây ra: địa đới do năng lượng ngoài, phi địa đới do năng lượng trong.", "B. không có điểm khác nhau.", "C. địa đới do con người, phi địa đới do tự nhiên.", "D. địa đới chỉ đúng ở lục địa."], "answer": "A", "explain": "Địa đới: bức xạ Mặt Trời (ngoài); phi địa đới: nội lực (trong)."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Trong các quy luật sau, quy luật nào KHÔNG thuộc nhóm phi địa đới?", "options": ["A. Quy luật đai cao", "B. Quy luật địa ô", "C. Quy luật địa đới", "D. Cả A và B"], "answer": "C", "explain": "Phi địa đới gồm đai cao và địa ô; địa đới là quy luật riêng."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một vùng có vĩ độ thấp (gần xích đạo) nhưng khí hậu mát mẻ quanh năm. Giải thích hợp lí nhất là", "options": ["A. vùng đó ở trên núi cao (đai cao lấn át địa đới).", "B. quy luật địa đới sai.", "C. vùng đó không nhận được ánh sáng Mặt Trời.", "D. nhiệt độ không phụ thuộc vĩ độ."], "answer": "A", "explain": "Cao nguyên, núi cao ở xích đạo (ví dụ Đà Lạt, cao nguyên Đông Phi) mát mẻ do đai cao."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Thành phố Đà Lạt (cao khoảng 1500 m) có khí hậu mát mẻ dù nằm ở vĩ độ nhiệt đới. Đây là ví dụ về", "options": ["A. quy luật địa đới.", "B. quy luật đai cao lấn át biểu hiện địa đới.", "C. quy luật địa ô.", "D. không thuộc quy luật nào."], "answer": "B", "explain": "Độ cao 1500 m làm nhiệt độ giảm khoảng 9 độ C nên mát mẻ như ôn đới — đai cao."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Để nhận biết một hiện tượng thuộc quy luật địa ô, cần xem hiện tượng đó thay đổi theo", "options": ["A. vĩ độ.", "B. kinh độ (từ biển vào nội địa).", "C. độ cao.", "D. thời gian."], "answer": "B", "explain": "Địa ô: thay đổi theo kinh độ do phân bố lục địa – đại dương."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một học sinh vẽ sơ đồ các đới khí hậu từ xích đạo về cực nhưng quên vẽ sự khác biệt giữa ven biển và nội địa. Sơ đồ của bạn thiếu", "options": ["A. không thiếu gì.", "B. biểu hiện của quy luật địa ô (phi địa đới).", "C. biểu hiện của quy luật đai cao.", "D. tên các đới."], "answer": "B", "explain": "Cùng vĩ độ, ven biển và nội địa khác nhau do địa ô — sơ đồ chỉ có địa đới là chưa đầy đủ."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Địa đới do năng lượng ngoài, phi địa đới do năng lượng trong.", "b) Đà Lạt mát mẻ do ở trên cao nguyên (đai cao).", "c) Địa ô là thay đổi theo kinh độ.", "d) Sơ đồ chỉ vẽ theo vĩ độ là đã đầy đủ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: còn cần thể hiện địa ô, đai cao."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vùng núi cao ở xích đạo có thể mát như ôn đới.", "b) Cùng vĩ độ, khí hậu ven biển và nội địa luôn giống hệt nhau.", "c) Các quy luật địa lí tác động đồng thời trong thực tế.", "d) Quy luật nào mạnh hơn sẽ thể hiện rõ hơn."], "answer": ["T", "F", "T", "T"], "explain": "a), c), d) Đúng. b) Sai: địa ô làm chúng khác nhau."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Đà Lạt mát mẻ dù ở vĩ độ nhiệt đới là do quy luật nào? (2 từ)", "answer": "đai cao", "explain": "Độ cao 1500 m làm nhiệt độ giảm — quy luật đai cao."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Hai quy luật nhỏ thuộc nhóm phi địa đới là đai cao và quy luật nào nữa? (2 từ)", "answer": "địa ô", "explain": "Phi địa đới gồm quy luật đai cao và quy luật địa ô."}
]},
{"name": "Đề 8", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Năng lượng bên ngoài Trái Đất chủ yếu là", "options": ["A. năng lượng địa nhiệt.", "B. bức xạ Mặt Trời.", "C. năng lượng thủy triều.", "D. năng lượng hạt nhân."], "answer": "B", "explain": "Bức xạ Mặt Trời là nguồn năng lượng bên ngoài chủ yếu, gây ra quy luật địa đới."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Năng lượng bên trong Trái Đất còn được gọi là", "options": ["A. ngoại lực.", "B. nội lực.", "C. bức xạ.", "D. thủy triều."], "answer": "B", "explain": "Nội lực là năng lượng bên trong Trái Đất, tạo địa hình, phân bố lục địa – đại dương."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao nói quy luật địa đới có tính toàn cầu còn quy luật đai cao, địa ô có tính địa phương?", "options": ["A. Vì địa đới do bức xạ Mặt Trời chi phối toàn bộ Trái Đất; đai cao, địa ô phụ thuộc địa hình, vị trí lục địa cụ thể.", "B. Vì địa đới quan trọng hơn.", "C. Vì đai cao, địa ô không phải quy luật.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Bức xạ Mặt Trời tác động toàn cầu theo vĩ độ; địa hình và phân bố lục địa mang tính địa phương."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một nông dân ở vùng núi muốn trồng chè (cây ưa mát). Theo quy luật đai cao, nên trồng chè ở", "options": ["A. chân núi nóng.", "B. sườn núi ở độ cao thích hợp, mát mẻ.", "C. đỉnh núi băng tuyết.", "D. thung lũng kín gió nóng."], "answer": "B", "explain": "Chè ưa khí hậu mát: trồng ở độ cao thích hợp (ví dụ 800–1500 m ở Việt Nam) — vận dụng đai cao vào sản xuất."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Ứng dụng của quy luật địa đới trong nông nghiệp là", "options": ["A. bố trí cây trồng phù hợp với đới khí hậu (ví dụ vùng nhiệt đới trồng lúa, cao su; ôn đới trồng lúa mì).", "B. trồng bất kì cây gì ở đâu cũng được.", "C. chỉ trồng một loại cây.", "D. không có ứng dụng."], "answer": "A", "explain": "Mỗi đới khí hậu có cây trồng thích nghi riêng — vận dụng địa đới để bố trí sản xuất hợp lí."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một công ty du lịch quảng cáo: “Một ngày ở X, trải nghiệm bốn mùa”. Địa điểm X có thể là", "options": ["A. đồng bằng ven biển.", "B. vùng núi cao (sáng mát, trưa nắng, chiều lạnh — vành đai khí hậu thay đổi theo độ cao, thời gian trong ngày).", "C. hoang mạc.", "D. vùng cực."], "answer": "B", "explain": "Vùng núi cao: chênh lệch nhiệt ngày đêm lớn, vành đai khí hậu đa dạng — “bốn mùa trong một ngày” (ví dụ Sa Pa, Đà Lạt)."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bức xạ Mặt Trời là năng lượng bên ngoài.", "b) Nội lực là năng lượng bên trong Trái Đất.", "c) Địa đới có tính toàn cầu.", "d) Đai cao, địa ô mang tính địa phương."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng theo phân tích nguyên nhân các quy luật."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về ứng dụng:", "statements": ["a) Trồng chè ở vùng núi cao là vận dụng quy luật đai cao.", "b) Bố trí cây trồng theo đới khí hậu là vận dụng địa đới.", "c) Du lịch núi cao khai thác sự đa dạng vành đai khí hậu.", "d) Các quy luật địa lí không có ứng dụng thực tiễn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: các quy luật có nhiều ứng dụng trong sản xuất, du lịch."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Nguồn năng lượng bên ngoài gây ra quy luật địa đới có tên là gì? (2 từ)", "answer": "Mặt Trời", "explain": "Bức xạ Mặt Trời."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Cây chè ưa khí hậu mát được trồng nhiều ở vùng núi cao Việt Nam (Thái Nguyên, Mộc Châu). Đây là vận dụng quy luật nào? (2 từ)", "answer": "đai cao", "explain": "Trồng cây ưa mát ở độ cao thích hợp — vận dụng quy luật đai cao."}
]}
,
{"name": "Đề 9", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Chương 7 nghiên cứu về", "options": ["A. một số quy luật của vỏ địa lí.", "B. dân số thế giới.", "C. các ngành kinh tế.", "D. bản đồ."], "answer": "A", "explain": "Chương 7: Một số quy luật của vỏ địa lí (Bài 17, Bài 18)."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Bài 18 nghiên cứu về", "options": ["A. quy luật thống nhất và hoàn chỉnh.", "B. quy luật địa đới và quy luật phi địa đới.", "C. vỏ địa lí.", "D. sinh quyển."], "answer": "B", "explain": "Bài 18: Quy luật địa đới và quy luật phi địa đới."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một vùng ở vĩ độ 40 độ B ven biển có rừng lá rộng, nhưng vùng nội địa cùng vĩ độ lại là thảo nguyên khô. Sự khác biệt này do", "options": ["A. quy luật địa đới.", "B. quy luật địa ô (khoảng cách tới biển khác nhau).", "C. quy luật đai cao.", "D. ngẫu nhiên."], "answer": "B", "explain": "Cùng vĩ độ, khác nhau theo kinh độ biển – nội địa — quy luật địa ô."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một người leo núi từ chân lên đỉnh ghi nhận: nhiệt độ giảm dần, cây cối thấp dần rồi mất hẳn, xuất hiện tuyết. Người đó đã chứng kiến", "options": ["A. quy luật địa đới.", "B. quy luật đai cao.", "C. quy luật địa ô.", "D. quy luật ngày đêm."], "answer": "B", "explain": "Thay đổi theo độ cao — quy luật đai cao."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong ba quy luật (địa đới, đai cao, địa ô), quy luật nào liên quan trực tiếp đến vĩ độ?", "options": ["A. Địa đới", "B. Đai cao", "C. Địa ô", "D. Cả ba"], "answer": "A", "explain": "Địa đới: theo vĩ độ; đai cao: theo độ cao; địa ô: theo kinh độ."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cho các hiện tượng: (1) các đới khí hậu, (2) vành đai thực vật theo độ cao, (3) ven biển ẩm – nội địa khô. Sắp xếp theo nhóm (địa đới / phi địa đới) đúng là", "options": ["A. (1) địa đới; (2), (3) phi địa đới.", "B. (1), (2) địa đới; (3) phi địa đới.", "C. cả ba đều địa đới.", "D. cả ba đều phi địa đới."], "answer": "A", "explain": "(1) theo vĩ độ — địa đới; (2) theo độ cao, (3) theo kinh độ — phi địa đới."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bài 18 nghiên cứu địa đới và phi địa đới.", "b) Cùng vĩ độ, ven biển và nội địa có thể khác nhau do địa ô.", "c) Leo núi từ chân lên đỉnh chứng kiến quy luật đai cao.", "d) Địa đới liên quan đến vĩ độ."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Các đới khí hậu thuộc nhóm địa đới.", "b) Vành đai thực vật theo độ cao thuộc nhóm phi địa đới.", "c) Ven biển ẩm – nội địa khô thuộc nhóm phi địa đới.", "d) Mọi hiện tượng địa lí đều thuộc địa đới."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: còn có phi địa đới."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Trong ba quy luật địa đới, đai cao, địa ô, quy luật nào thay đổi theo kinh độ?", "answer": "địa ô", "explain": "Địa ô: thay đổi theo kinh độ (biển – nội địa)."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Trong ba quy luật địa đới, đai cao, địa ô, quy luật nào do bức xạ Mặt Trời gây ra?", "answer": "địa đới", "explain": "Địa đới do bức xạ Mặt Trời (năng lượng ngoài)."}
]},
{"name": "Đề 10", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Quy luật địa đới thể hiện", "options": ["A. sự thay đổi có quy luật theo vĩ độ.", "B. sự thay đổi theo độ cao.", "C. sự thay đổi theo kinh độ.", "D. sự đứng yên của tự nhiên."], "answer": "A", "explain": "Địa đới: thay đổi theo vĩ độ từ xích đạo về hai cực."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Quy luật phi địa đới thể hiện", "options": ["A. sự thay đổi theo vĩ độ.", "B. sự thay đổi không theo vĩ độ (theo độ cao, kinh độ).", "C. sự không thay đổi.", "D. sự thay đổi do con người."], "answer": "B", "explain": "Phi địa đới: đai cao (độ cao) và địa ô (kinh độ)."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một học sinh đi du lịch từ đồng bằng lên Sa Pa thấy trời se lạnh, cây cối khác hẳn. Em giải thích cho bạn cùng đi rằng đó là do", "options": ["A. Sa Pa ở vùng cực.", "B. quy luật đai cao: lên cao nhiệt độ giảm, cảnh quan thay đổi.", "C. Sa Pa gần biển.", "D. thời tiết thất thường."], "answer": "B", "explain": "Sa Pa (cao ~1500 m) mát mẻ do độ cao — quy luật đai cao."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một nhà làm phim muốn quay cảnh tuyết rơi mà không ra khỏi Việt Nam. Theo các quy luật đã học, nên đến", "options": ["A. đồng bằng sông Cửu Long.", "B. đỉnh Phan-xi-păng mùa đông (đai cao: đủ cao thì đủ lạnh để có tuyết).", "C. bãi biển Nha Trang.", "D. đảo Phú Quốc."], "answer": "B", "explain": "Đỉnh Phan-xi-păng (3143 m) mùa đông có thể có băng tuyết — vận dụng đai cao."},
