{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một quốc gia xây đập lớn trên sông Mê Kông ở thượng nguồn. Theo quy luật thống nhất và hoàn chỉnh, các nước hạ lưu (trong đó có Việt Nam) có thể chịu ảnh hưởng dây chuyền nào?", "options": ["A. Không bị ảnh hưởng gì.", "B. Thay đổi chế độ dòng chảy, giảm phù sa, ảnh hưởng sản xuất nông nghiệp và hệ sinh thái đồng bằng.", "C. Chỉ được lợi, không bị hại.", "D. Sông Mê Kông cạn khô hoàn toàn."], "answer": "B", "explain": "Đập thượng nguồn giữ nước, giữ phù sa → hạ lưu thiếu nước mùa khô, lũ bất thường, đất giảm màu mỡ, thủy sinh suy giảm — hệ quả dây chuyền xuyên biên giới."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vỏ địa lí bao gồm cả phần đại dương.", "b) Sinh quyển là một bộ phận của vỏ địa lí.", "c) Các thành phần trong vỏ địa lí biến đổi độc lập với nhau.", "d) Phá rừng gây ra nhiều hệ quả dây chuyền."], "answer": ["T", "T", "F", "T"], "explain": "a), b) Đúng. c) Sai: các thành phần gắn bó, biến đổi kéo theo nhau. d) Đúng: xói mòn, lũ lụt, khô hạn, mất đa dạng sinh học."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ô nhiễm nguồn nước chỉ ảnh hưởng đến nước, không ảnh hưởng đến đất và sinh vật.", "b) Trồng rừng phòng hộ ven biển vừa chống xói lở vừa bảo vệ hệ sinh thái.", "c) Khai thác cát sông bừa bãi có thể gây sạt lở bờ sông.", "d) Mọi hoạt động của con người đều có thể gây hệ quả dây chuyền đến tự nhiên."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: ô nhiễm nước lan sang đất, sinh vật, con người. b), c), d) Đúng theo quy luật thống nhất và hoàn chỉnh."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Vỏ địa lí dày khoảng bao nhiêu ki-lô-mét? (ghi dạng khoảng, ví dụ: 30–35)", "answer": "30–35", "explain": "Vỏ địa lí dày khoảng 30–35 km."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Cụm từ nào (4 từ) diễn tả việc một tác động nhỏ vào tự nhiên có thể gây ra nhiều hệ quả liên tiếp?", "answer": "hệ quả dây chuyền", "explain": "Quy luật thống nhất và hoàn chỉnh: một thay đổi gây ra hệ quả dây chuyền đến các thành phần khác."}
]},
{"name": "Đề 4", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đối tượng nghiên cứu của chương 7 là", "options": ["A. các quy luật của vỏ địa lí.", "B. cấu tạo của nguyên tử.", "C. lịch sử Việt Nam.", "D. văn học dân gian."], "answer": "A", "explain": "Chương 7: Một số quy luật của vỏ địa lí (Bài 17, Bài 18)."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Bài 17 nghiên cứu về", "options": ["A. quy luật địa đới.", "B. vỏ địa lí và quy luật thống nhất, hoàn chỉnh của vỏ địa lí.", "C. quy luật đai cao.", "D. dân số thế giới."], "answer": "B", "explain": "Bài 17: Vỏ địa lí, quy luật thống nhất và hoàn chỉnh của vỏ địa lí."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao nói “bảo vệ rừng là bảo vệ cả hệ thống tự nhiên”?", "options": ["A. Vì rừng chỉ có giá trị lấy gỗ.", "B. Vì rừng gắn bó với đất, nước, khí hậu, sinh vật; bảo vệ rừng là bảo vệ đồng thời các thành phần đó.", "C. Vì rừng không liên quan đến các thành phần khác.", "D. Vì rừng chỉ để làm cảnh."], "answer": "B", "explain": "Theo quy luật thống nhất và hoàn chỉnh, rừng gắn bó với đất (chống xói mòn), nước (điều hòa), khí hậu, sinh vật — bảo vệ rừng là bảo vệ cả hệ thống."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một khu công nghiệp xả thải ra sông mà không xử lí. Người dân hạ lưu bị bệnh, cá chết, đất nhiễm độc. Để giải quyết triệt để, cần", "options": ["A. chỉ cấp thuốc cho người bệnh.", "B. xử lí triệt để nguồn thải tại nhà máy (nguyên nhân gốc), đồng thời khắc phục đất, nước bị ô nhiễm.", "C. chuyển nhà máy đi nơi khác mà không xử lí.", "D. cấm người dân dùng nước sông."], "answer": "B", "explain": "Theo quy luật thống nhất và hoàn chỉnh: phải xử lí nguyên nhân gốc (nguồn thải) đồng thời khắc phục các hệ quả dây chuyền (đất, nước, sức khỏe)."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong các hệ quả sau của việc phá rừng, hệ quả nào KHÔNG phải là hệ quả dây chuyền?", "options": ["A. Đất bị xói mòn", "B. Lũ quét mùa mưa", "C. Động vật mất nơi cư trú", "D. Gỗ rừng bị lấy đi (hệ quả trực tiếp)"], "answer": "D", "explain": "Gỗ bị lấy đi là hệ quả trực tiếp của hành động chặt phá; các hệ quả còn lại là dây chuyền qua các thành phần khác."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hai ngôi làng A (đầu nguồn, phá rừng làm nương) và B (hạ lưu) cùng một con sông. Mùa mưa, làng B bị lũ quét dù không phá rừng. Điều này chứng tỏ", "options": ["A. làng B bị trời phạt.", "B. tác động ở đầu nguồn gây hệ quả dây chuyền xuống hạ lưu theo quy luật thống nhất và hoàn chỉnh.", "C. hai làng không liên quan nhau.", "D. lũ quét là ngẫu nhiên."], "answer": "B", "explain": "Phá rừng đầu nguồn → mất khả năng giữ nước → lũ quét hạ lưu: hệ quả dây chuyền trong một hệ thống lưu vực sông thống nhất."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Rừng đầu nguồn có vai trò giữ nước, chống lũ cho hạ lưu.", "b) Phá rừng đầu nguồn có thể gây lũ quét ở hạ lưu.", "c) Các làng trong cùng lưu vực sông không liên quan đến nhau.", "d) Bảo vệ rừng đầu nguồn là bảo vệ cả vùng hạ lưu."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng: quan hệ đầu nguồn – hạ lưu trong hệ thống thống nhất. c) Sai: gắn bó trong cùng lưu vực."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về phát triển bền vững:", "statements": ["a) Phát triển kinh tế cần đi đôi với bảo vệ môi trường.", "b) Có thể hi sinh môi trường để phát triển kinh tế bằng mọi giá.", "c) Đánh giá tác động môi trường giúp hạn chế hệ quả xấu.", "d) Quy luật thống nhất và hoàn chỉnh là cơ sở khoa học của phát triển bền vững."], "answer": ["T", "F", "T", "T"], "explain": "a), c), d) Đúng. b) Sai: hi sinh môi trường gây hậu quả dây chuyền lâu dài, tốn kém hơn."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Quy luật nào cho rằng các thành phần tự nhiên gắn bó thành một thể thống nhất? (4 từ)", "answer": "thống nhất và hoàn chỉnh", "explain": "Quy luật thống nhất và hoàn chỉnh của vỏ địa lí."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Việc làm nào (4 từ) giúp dự báo trước các hệ quả dây chuyền của một dự án đối với tự nhiên?", "answer": "đánh giá tác động", "explain": "Đánh giá tác động môi trường là việc làm bắt buộc trước các dự án lớn."}
]}
,
{"name": "Đề 5", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Vỏ địa lí là nơi", "options": ["A. các quyển tách biệt hoàn toàn.", "B. các quyển tiếp xúc, xâm nhập và tác động lẫn nhau.", "C. chỉ có con người sinh sống.", "D. không có sự sống."], "answer": "B", "explain": "Đặc trưng của vỏ địa lí là sự tiếp xúc, xâm nhập, tác động lẫn nhau giữa các quyển."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Quy luật thống nhất và hoàn chỉnh nghiên cứu mối quan hệ giữa", "options": ["A. các thành phần tự nhiên trong vỏ địa lí với nhau.", "B. các hành tinh trong hệ Mặt Trời.", "C. các nguyên tố hóa học.", "D. các quốc gia với nhau."], "answer": "A", "explain": "Quy luật nghiên cứu mối quan hệ gắn bó giữa các thành phần tự nhiên (địa hình, khí hậu, thủy văn, đất, sinh vật...) trong vỏ địa lí."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một vùng đất ngập nước được cải tạo thành đất nông nghiệp. Theo quy luật thống nhất và hoàn chỉnh, hệ sinh thái vùng đó sẽ", "options": ["A. không thay đổi gì.", "B. thay đổi: hệ sinh thái ngập nước mất đi, thay bằng hệ sinh thái nông nghiệp; chế độ nước, đất cũng thay đổi.", "C. tốt hơn mà không có mặt trái nào.", "D. chỉ thay đổi về cây trồng."], "answer": "B", "explain": "Can thiệp vào một thành phần (đất, nước) làm thay đổi cả hệ sinh thái và các thành phần liên quan."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Người dân một vùng chuyển từ trồng lúa sang trồng cây ăn quả trên đất dốc mà không có biện pháp chống xói mòn. Hậu quả có thể xảy ra là", "options": ["A. không có hậu quả gì.", "B. đất bị xói mòn, rửa trôi do mất lớp che phủ thường xuyên của ruộng lúa nước; năng suất giảm dần.", "C. đất tốt hơn.", "D. cây ăn quả không cần đất."], "answer": "B", "explain": "Ruộng lúa nước có lớp nước và bờ giữ đất; chuyển sang cây ăn quả thưa trên đất dốc không chống xói mòn → đất bị rửa trôi — hệ quả dây chuyền của việc thay đổi sử dụng đất."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Ý nghĩa thực tiễn quan trọng nhất của quy luật thống nhất và hoàn chỉnh là", "options": ["A. giúp học thuộc các thành phần tự nhiên.", "B. giúp con người dự báo hệ quả dây chuyền khi tác động vào tự nhiên, từ đó hành động có trách nhiệm.", "C. giúp tính toán diện tích đất.", "D. giúp dự báo thời tiết hằng ngày."], "answer": "B", "explain": "Ý nghĩa: dự báo trước các tác động dây chuyền để có biện pháp phù hợp, tránh hậu quả xấu."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một dự án du lịch muốn san lấp một đầm nước ngọt ven biển để xây resort. Theo quy luật thống nhất và hoàn chỉnh, cần cân nhắc hệ quả nào?", "options": ["A. Không cần cân nhắc gì.", "B. Mất hệ sinh thái đầm nước, ảnh hưởng nguồn nước ngầm, mất nơi cư trú của thủy sinh và chim nước, tăng nguy cơ ngập úng.", "C. Chỉ mất cảnh quan.", "D. Du lịch luôn có lợi, không có hại."], "answer": "B", "explain": "San lấp đầm nước tác động dây chuyền: mất sinh cảnh, thay đổi thủy văn, ảnh hưởng nước ngầm — cần đánh giá đầy đủ trước khi quyết định."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mọi thành phần trong vỏ địa lí đều có mối liên hệ với nhau.", "b) Thay đổi cách sử dụng đất có thể kéo theo thay đổi hệ sinh thái.", "c) Con người tác động vào tự nhiên mà không gây hệ quả gì.", "d) Cần dự báo hệ quả trước khi thực hiện các dự án lớn."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: mọi tác động đều có thể gây hệ quả dây chuyền."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) San lấp đầm nước chỉ ảnh hưởng đến mặt nước.", "b) Mất đầm nước có thể làm suy giảm nước ngầm.", "c) Hệ sinh thái đầm nước là nơi cư trú của nhiều loài.", "d) Phát triển du lịch không cần quan tâm đến môi trường."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: ảnh hưởng dây chuyền. b), c) Đúng. d) Sai: du lịch bền vững phải gắn với bảo vệ môi trường."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Trong vỏ địa lí, các quyển có quan hệ với nhau như thế nào? (2 từ: tiếp xúc, xâm nhập hay tách biệt)", "answer": "xâm nhập", "explain": "Các quyển trong vỏ địa lí tiếp xúc, xâm nhập và tác động lẫn nhau."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Theo quy luật thống nhất và hoàn chỉnh, khi một thành phần tự nhiên thay đổi thì các thành phần còn lại sẽ như thế nào? (2 từ)", "answer": "thay đổi", "explain": "Một thành phần thay đổi kéo theo sự thay đổi của các thành phần còn lại."}
]},
{"name": "Đề 6", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Thành phần nào sau đây thuộc vỏ địa lí?", "options": ["A. Rừng, sông, đất, không khí ở tầng đối lưu", "B. Nhân Trái Đất", "C. Tầng bình lưu", "D. Vũ trụ"], "answer": "A", "explain": "Rừng (sinh quyển), sông (thủy quyển), đất (thạch quyển), không khí tầng đối lưu (khí quyển) đều thuộc vỏ địa lí."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Quy luật thống nhất và hoàn chỉnh còn được diễn đạt bằng cụm từ nào?", "options": ["A. “Đụng một – động tất cả”", "B. “Mạnh ai nấy làm”", "C. “Nước sông không phạm nước giếng”", "D. “Chia để trị”"], "answer": "A", "explain": "“Đụng một – động tất cả”: một thành phần thay đổi kéo theo toàn bộ hệ thống thay đổi."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một cánh đồng lúa được chuyển thành khu công nghiệp. Theo quy luật thống nhất và hoàn chỉnh, những thay đổi nào sẽ xảy ra?", "options": ["A. Chỉ thay đổi về cây trồng.", "B. Mất đất nông nghiệp, thay đổi chế độ nước, ô nhiễm đất – nước – không khí, ảnh hưởng đời sống dân cư.", "C. Không có thay đổi gì.", "D. Môi trường tốt hơn."], "answer": "B", "explain": "Chuyển đổi sử dụng đất kéo theo hàng loạt thay đổi về kinh tế, môi trường, xã hội — hệ quả dây chuyền."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Để giảm thiểu hệ quả xấu khi xây dựng hồ chứa nước, biện pháp nào phù hợp với quy luật thống nhất và hoàn chỉnh?", "options": ["A. Xây xong rồi tính.", "B. Đánh giá tác động môi trường trước, có phương án bảo vệ rừng, tái định cư, bảo tồn đa dạng sinh học.", "C. Ngập bao nhiêu rừng cũng được.", "D. Không cần quan tâm đến hạ lưu."], "answer": "B", "explain": "Dự báo trước hệ quả dây chuyền (ngập rừng, thay đổi dòng chảy, tái định cư) và có giải pháp đồng bộ — đúng tinh thần quy luật."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Hiện tượng nào sau đây KHÔNG phải là hệ quả dây chuyền của việc phá rừng?", "options": ["A. Đất bị xói mòn", "B. Lũ quét", "C. Mất đa dạng sinh học", "D. Cây bị chặt đổ (hệ quả trực tiếp)"], "answer": "D", "explain": "Cây bị chặt là hệ quả trực tiếp; các hiện tượng còn lại là hệ quả dây chuyền qua các thành phần khác."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một thành phố mở rộng đô thị ra vùng đất nông nghiệp ven đô. Theo quy luật thống nhất và hoàn chỉnh, cần lưu ý vấn đề nào nhất?", "options": ["A. Chỉ cần quan tâm đến giá đất.", "B. Mất đất nông nghiệp, thay đổi thủy văn gây ngập úng, ô nhiễm, áp lực hạ tầng — cần quy hoạch đồng bộ.", "C. Đô thị hóa không ảnh hưởng gì.", "D. Nông nghiệp ven đô không quan trọng."], "answer": "B", "explain": "Đô thị hóa lấn đất nông nghiệp gây hệ quả dây chuyền về đất, nước, môi trường, xã hội — cần quy hoạch tổng thể."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chuyển đất nông nghiệp sang đất công nghiệp gây nhiều thay đổi dây chuyền.", "b) Xây hồ chứa nước cần đánh giá tác động môi trường.", "c) Đô thị hóa không ảnh hưởng đến tự nhiên.", "d) Mọi dự án lớn đều cần dự báo hệ quả."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: đô thị hóa tác động mạnh đến đất, nước, không khí."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về ứng xử với tự nhiên:", "statements": ["a) “Lợi một – hại mười” là điều cần tránh khi tác động vào tự nhiên.", "b) Nên tính toán lợi ích trước mắt mà bỏ qua hệ quả lâu dài.", "c) Bảo vệ môi trường là bảo vệ cuộc sống của chính con người.", "d) Quy luật tự nhiên có thể bị phớt lờ nếu có công nghệ."], "answer": ["T", "F", "T", "F"], "explain": "a), c) Đúng. b) Sai: phải tính cả hệ quả lâu dài. d) Sai: công nghệ không thể phớt lờ quy luật tự nhiên."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Cụm từ “đụng một – động …” diễn tả quy luật thống nhất và hoàn chỉnh. Từ còn thiếu là gì?", "answer": "tất cả", "explain": "“Đụng một – động tất cả”: một thành phần thay đổi kéo theo toàn bộ hệ thống."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Khi quy hoạch một khu công nghiệp, cần xem xét đồng thời đất, nước, không khí, dân cư… Cách tiếp cận này thể hiện tư duy theo quy luật nào? (4 từ)", "answer": "thống nhất và hoàn chỉnh", "explain": "Tư duy tổng thể, dự báo hệ quả dây chuyền — đúng quy luật thống nhất và hoàn chỉnh."}
]}
,
{"name": "Đề 7", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Vỏ địa lí có đặc điểm nào sau đây?", "options": ["A. Các quyển tách rời nhau.", "B. Là nơi các quyển tiếp xúc, xâm nhập, tác động lẫn nhau.", "C. Không có sự sống.", "D. Dày bằng cả Trái Đất."], "answer": "B", "explain": "Đặc trưng cơ bản của vỏ địa lí là sự tiếp xúc, xâm nhập, tác động lẫn nhau giữa các quyển."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Quy luật thống nhất và hoàn chỉnh cho thấy", "options": ["A. tự nhiên là một thể thống nhất.", "B. tự nhiên gồm các phần rời rạc.", "C. con người đứng ngoài tự nhiên.", "D. tự nhiên không thay đổi."], "answer": "A", "explain": "Các thành phần tự nhiên gắn bó thành một thể thống nhất, biến đổi có tính hoàn chỉnh (dây chuyền)."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một vùng cửa sông bị bồi lấp do xói mòn đất ở thượng nguồn. Điều này chứng tỏ", "options": ["A. thượng nguồn và hạ lưu không liên quan.", "B. xói mòn ở thượng nguồn gây hệ quả dây chuyền xuống hạ lưu (bồi lấp cửa sông).", "C. cửa sông tự bồi lấp.", "D. sông không liên quan đến đất."], "answer": "B", "explain": "Đất bị xói mòn thượng nguồn → phù sa bồi lấp hạ lưu, cửa sông: hệ quả dây chuyền trong hệ thống lưu vực thống nhất."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một địa phương khai thác đá vôi làm xi măng, gây bụi, ồn, sụt lún đất. Để phát triển bền vững, địa phương cần", "options": ["A. đóng cửa mỏ ngay lập tức.", "B. khai thác có quy hoạch, xử lí bụi – ồn, hoàn thổ phục hồi môi trường sau khai thác.", "C. khai thác tối đa không cần xử lí.", "D. chuyển sang khai thác ở nơi khác mà không xử lí."], "answer": "B", "explain": "Khai thác gắn với bảo vệ: quy hoạch, giảm thiểu ô nhiễm, phục hồi môi trường — cân bằng lợi ích và hệ quả dây chuyền."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong các ví dụ sau, ví dụ nào KHÔNG thể hiện quy luật thống nhất và hoàn chỉnh?", "options": ["A. Phá rừng gây lũ quét.", "B. Ô nhiễm sông làm cá chết.", "C. Trái Đất quay quanh Mặt Trời gây ra các mùa.", "D. Xây đập gây ngập rừng."], "answer": "C", "explain": "Các mùa do chuyển động của Trái Đất — thuộc quy luật khác; các ví dụ còn lại đều là hệ quả dây chuyền trong vỏ địa lí."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một nhà máy giấy đặt cạnh khu dân cư và dòng sông. Theo quy luật thống nhất và hoàn chỉnh, để hoạt động bền vững, nhà máy cần", "options": ["A. xả thải trực tiếp để tiết kiệm chi phí.", "B. xử lí nước thải, khí thải đạt chuẩn; trồng cây xanh cách li; giám sát sức khỏe cộng đồng.", "C. chuyển ô nhiễm sang nơi khác.", "D. chỉ quan tâm đến lợi nhuận."], "answer": "B", "explain": "Xử lí đồng bộ các tác động đến nước, không khí, đất, sức khỏe — vì ô nhiễm một thành phần sẽ lan thành hệ quả dây chuyền."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xói mòn thượng nguồn có thể gây bồi lấp hạ lưu.", "b) Khai thác tài nguyên cần đi đôi với phục hồi môi trường.", "c) Ô nhiễm không khí không ảnh hưởng đến đất và nước.", "d) Phát triển bền vững cần tôn trọng quy luật tự nhiên."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: ô nhiễm không khí (mưa a-xít) ảnh hưởng đến đất, nước."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mưa a-xít làm ô nhiễm cả không khí, đất và nước.", "b) Một vấn đề môi trường thường liên quan đến nhiều thành phần tự nhiên.", "c) Giải quyết ô nhiễm cần cách tiếp cận tổng thể.", "d) Chỉ cần xử lí triệu chứng, không cần tìm nguyên nhân."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: tính thống nhất của các vấn đề môi trường. d) Sai: phải xử lí nguyên nhân gốc."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Vỏ địa lí là thể thống nhất của các thành phần tự nhiên. Tính chất này được gọi là tính gì? (2 từ)", "answer": "thống nhất", "explain": "Tính thống nhất: các thành phần gắn bó thành một thể."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Sự biến đổi lan từ thành phần này sang thành phần khác trong vỏ địa lí thể hiện tính gì của quy luật? (2 từ)", "answer": "hoàn chỉnh", "explain": "Tính hoàn chỉnh: biến đổi có tính dây chuyền, đầy đủ."}
]},

{"type": "mcq", "level": "NB", "points": 0.25, "q": "Có mấy thành phần chính tham gia vào vỏ địa lí (dưới dạng các quyển)?", "options": ["A. 2", "B. 3", "C. 4", "D. 5"], "answer": "C", "explain": "4 quyển: khí quyển, thủy quyển, thạch quyển, sinh quyển."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Quy luật thống nhất và hoàn chỉnh là quy luật của", "options": ["A. vỏ địa lí.", "B. vũ trụ.", "C. nguyên tử.", "D. xã hội loài người."], "answer": "A", "explain": "Đây là quy luật của vỏ địa lí (Bài 17, chương 7)."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một hồ thủy điện tích nước làm ngập rừng. Theo quy luật thống nhất và hoàn chỉnh, ngoài việc mất rừng, còn có thể xảy ra", "options": ["A. không có gì thêm.", "B. thay đổi chế độ dòng chảy hạ lưu, ảnh hưởng hệ sinh thái, phải tái định cư dân cư.", "C. chỉ có lợi, không có hại.", "D. rừng tự mọc lại ngay."], "answer": "B", "explain": "Ngập rừng kéo theo: thay đổi thủy văn, mất đa dạng sinh học, xáo trộn đời sống dân cư — hệ quả dây chuyền."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một vùng trồng lúa nước lâu đời chuyển sang nuôi tôm công nghiệp. Hệ quả dây chuyền cần lường trước là", "options": ["A. không có hệ quả.", "B. đất bị nhiễm mặn, nguồn nước ô nhiễm, hệ sinh thái thay đổi; nếu tôm thất bại, khó quay lại trồng lúa.", "C. đất tốt hơn.", "D. môi trường sạch hơn."], "answer": "B", "explain": "Nuôi tôm mặn hóa đất, ô nhiễm nước; thay đổi khó đảo ngược — cần cân nhắc kĩ trước khi chuyển đổi."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Biện pháp nào sau đây phù hợp với quy luật thống nhất và hoàn chỉnh?", "options": ["A. Khai thác kiệt quệ tài nguyên.", "B. Khai thác đi đôi với bảo vệ, phục hồi môi trường.", "C. Xả thải bừa bãi.", "D. Phá rừng lấy đất sản xuất bằng mọi giá."], "answer": "B", "explain": "Khai thác phải tính đến hệ quả dây chuyền, đi đôi với bảo vệ và phục hồi — phát triển bền vững."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một tỉnh quy hoạch khu du lịch sinh thái trong rừng đặc dụng. Theo quy luật thống nhất và hoàn chỉnh, quy hoạch cần", "options": ["A. xây dựng tối đa để thu hút khách.", "B. giới hạn sức chứa, giữ nguyên hệ sinh thái, xử lí rác thải, bảo vệ nguồn nước và đa dạng sinh học.", "C. chặt bớt rừng làm đường.", "D. không cần quy hoạch."], "answer": "B", "explain": "Du lịch trong rừng đặc dụng phải bảo đảm tính thống nhất của hệ sinh thái: giới hạn tác động, bảo vệ toàn diện các thành phần."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hồ thủy điện làm thay đổi chế độ dòng chảy hạ lưu.", "b) Nuôi tôm có thể gây nhiễm mặn đất.", "c) Du lịch sinh thái cần bảo vệ hệ sinh thái.", "d) Mọi hoạt động kinh tế đều không ảnh hưởng đến tự nhiên."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: mọi hoạt động đều có thể gây hệ quả."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chuyển đổi sử dụng đất cần cân nhắc hệ quả lâu dài.", "b) Nuôi tôm trên đất lúa có thể khó đảo ngược.", "c) Quy hoạch du lịch sinh thái cần giới hạn sức chứa.", "d) Cứ phát triển kinh tế trước, môi trường tính sau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: “kinh tế trước, môi trường sau” gây hậu quả nặng nề, khó khắc phục."},

{"type": "short", "level": "VDC", "points": 0.5, "q": "Muốn phát triển bền vững, con người khi tác động vào tự nhiên cần tuân thủ quy luật nào của vỏ địa lí? (4 từ)", "answer": "thống nhất và hoàn chỉnh", "explain": "Quy luật thống nhất và hoàn chỉnh là cơ sở khoa học của phát triển bền vững."}
]}

{"name": "Đề 9", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Vỏ địa lí dày khoảng 30–35 km, bao gồm", "options": ["A. từ hết tầng đối lưu đến đáy vực thẳm đại dương.", "B. từ mặt đất đến tâm Trái Đất.", "C. toàn bộ khí quyển.", "D. toàn bộ thạch quyển."], "answer": "A", "explain": "Giới hạn trên: hết tầng đối lưu; giới hạn dưới: đáy vực thẳm đại dương; dày khoảng 30–35 km."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Quy luật nào được học trong Bài 17?", "options": ["A. Quy luật địa đới", "B. Quy luật thống nhất và hoàn chỉnh của vỏ địa lí", "C. Quy luật đai cao", "D. Quy luật địa ô"], "answer": "B", "explain": "Bài 17: Vỏ địa lí, quy luật thống nhất và hoàn chỉnh của vỏ địa lí."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một con sông bị ô nhiễm nặng ở thượng nguồn. Theo quy luật thống nhất và hoàn chỉnh, vùng hạ lưu sẽ", "options": ["A. không bị ảnh hưởng.", "B. bị ảnh hưởng dây chuyền: nước ô nhiễm lan xuống, thủy sinh chết, đất ven sông nhiễm độc.", "C. tự làm sạch hoàn toàn.", "D. chỉ ảnh hưởng đến cá."], "answer": "B", "explain": "Ô nhiễm lan theo dòng chảy thành hệ quả dây chuyền xuống hạ lưu."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một làng nghề tái chế chì gây ô nhiễm đất, nước, không khí; người dân mắc bệnh. Giải pháp căn cơ nhất là", "options": ["A. phát thuốc cho dân.", "B. di dời, xử lí ô nhiễm tổng thể (đất, nước, không khí) và chuyển đổi nghề bền vững.", "C. cấm báo chí đưa tin.", "D. để tự nhiên xử lí."], "answer": "B", "explain": "Ô nhiễm chì ảnh hưởng dây chuyền nhiều thành phần; phải xử lí tổng thể nguồn ô nhiễm và chuyển đổi sinh kế."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Câu tục ngữ nào gần nhất với tinh thần quy luật thống nhất và hoàn chỉnh?", "options": ["A. “Nhổ một sợi tóc động cả đầu”.", "B. “Mỗi cây mỗi hoa, mỗi nhà mỗi cảnh”.", "C. “Ăn quả nhớ kẻ trồng cây”.", "D. “Có công mài sắt, có ngày nên kim”."], "answer": "A", "explain": "“Nhổ một sợi tóc động cả đầu”: một tác động nhỏ ảnh hưởng cả hệ thống — đúng tinh thần “đụng một – động tất cả”."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một quốc gia cấm khai thác rừng tự nhiên nhưng cho phép trồng rừng kinh tế. Chính sách này", "options": ["A. không có ý nghĩa gì.", "B. vừa bảo vệ hệ sinh thái rừng tự nhiên (đất, nước, đa dạng sinh học), vừa đáp ứng nhu cầu gỗ — cân bằng theo quy luật thống nhất và hoàn chỉnh.", "C. làm mất hoàn toàn nguồn gỗ.", "D. chỉ có lợi về kinh tế."], "answer": "B", "explain": "Bảo vệ rừng tự nhiên giữ tính thống nhất của hệ sinh thái; trồng rừng kinh tế đáp ứng nhu cầu — hài hòa bảo vệ và phát triển."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ô nhiễm thượng nguồn ảnh hưởng dây chuyền xuống hạ lưu.", "b) Làng nghề gây ô nhiễm cần được xử lí tổng thể.", "c) Bảo vệ rừng tự nhiên giúp giữ hệ sinh thái.", "d) Có thể tách rời bảo vệ rừng với bảo vệ đất, nước."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: rừng, đất, nước gắn bó thống nhất."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Nhổ một sợi tóc động cả đầu” gần với quy luật thống nhất và hoàn chỉnh.", "b) Chính sách bảo vệ rừng tự nhiên là đúng đắn.", "c) Trồng rừng kinh tế có thể thay thế hoàn toàn rừng tự nhiên.", "d) Cần hài hòa giữa bảo vệ và phát triển."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: rừng trồng không thay thế được hệ sinh thái rừng tự nhiên."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Bài 17 nghiên cứu quy luật nào của vỏ địa lí? (chỉ ghi 2 từ đầu của tên quy luật)", "answer": "thống nhất", "explain": "Quy luật thống nhất và hoàn chỉnh của vỏ địa lí."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Một tác động vào rừng gây ra hàng loạt thay đổi ở đất, nước, khí hậu. Tính chất “hàng loạt, đầy đủ” này được gọi là tính gì? (2 từ)", "answer": "hoàn chỉnh", "explain": "Tính hoàn chỉnh: biến đổi diễn ra đầy đủ, dây chuyền."}
]},
{"name": "Đề 10", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Vỏ địa lí là", "options": ["A. lớp vỏ Trái Đất nơi các quyển tiếp xúc, xâm nhập, tác động lẫn nhau.", "B. lớp vỏ cứng của Trái Đất.", "C. bầu khí quyển.", "D. đại dương thế giới."], "answer": "A", "explain": "Định nghĩa SGK về vỏ địa lí."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Nội dung quy luật thống nhất và hoàn chỉnh: khi một thành phần của vỏ địa lí thay đổi thì", "options": ["A. các thành phần khác không thay đổi.", "B. các thành phần còn lại và toàn bộ lãnh thổ cũng thay đổi theo.", "C. chỉ khí hậu thay đổi.", "D. con người không bị ảnh hưởng."], "answer": "B", "explain": "Tính hoàn chỉnh của sự biến đổi dây chuyền."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một vùng đất ngập mặn được quai đê lấn biển làm đất nông nghiệp. Hệ quả dây chuyền có thể là", "options": ["A. không có hệ quả.", "B. mất hệ sinh thái ngập mặn, đất bị nhiễm mặn, phải thau chua rửa mặn tốn kém.", "C. đất tốt ngay lập tức.", "D. chỉ có lợi."], "answer": "B", "explain": "Quai đê lấn biển: mất rừng ngập mặn, đất nhiễm mặn — cần cải tạo tốn kém; hệ quả dây chuyền."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một thành phố xây dựng hệ thống công viên cây xanh, hồ điều hòa. Theo quy luật thống nhất và hoàn chỉnh, lợi ích tổng hợp là", "options": ["A. chỉ để đẹp.", "B. điều hòa khí hậu, giảm ngập úng, cải thiện không khí, tạo nơi vui chơi — tác động tích cực dây chuyền.", "C. tốn đất, không có lợi.", "D. chỉ có lợi về du lịch."], "answer": "B", "explain": "Cây xanh, hồ nước tác động tích cực dây chuyền đến khí hậu, thủy văn, môi trường, sức khỏe — mặt tích cực của quy luật."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Để hạn chế mặt tiêu cực của quy luật thống nhất và hoàn chỉnh, con người cần", "options": ["A. ngừng mọi hoạt động.", "B. dự báo hệ quả, đánh giá tác động môi trường, có giải pháp đồng bộ.", "C. phát triển bằng mọi giá.", "D. phớt lờ quy luật tự nhiên."], "answer": "B", "explain": "Hiểu quy luật để dự báo, phòng ngừa, giảm thiểu hệ quả xấu — chủ động ứng xử với tự nhiên."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Sắp xếp các sự kiện theo trình tự hệ quả dây chuyền khi phá rừng đầu nguồn: (1) lũ quét hạ lưu, (2) mất lớp phủ thực vật, (3) đất bị xói mòn.", "options": ["A. (2) – (3) – (1).", "B. (1) – (2) – (3).", "C. (3) – (1) – (2).", "D. (2) – (1) – (3)."], "answer": "A", "explain": "Trình tự: mất lớp phủ (2) → đất bị xói mòn (3) → lũ quét hạ lưu (1): chuỗi nhân quả dây chuyền."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quai đê lấn biển có thể gây nhiễm mặn đất.", "b) Công viên, hồ điều hòa giúp cải thiện môi trường đô thị.", "c) Mọi tác động vào tự nhiên đều có hai mặt cần cân nhắc.", "d) Không cần dự báo hệ quả khi xây dựng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phải dự báo hệ quả dây chuyền."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau (tổng kết bài):", "statements": ["a) Vỏ địa lí dày khoảng 30–35 km.", "b) Quy luật thống nhất và hoàn chỉnh: “đụng một – động tất cả”.", "c) Con người cần đánh giá tác động môi trường trước các dự án lớn.", "d) Quy luật này không có ý nghĩa thực tiễn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: kiến thức trọng tâm bài 17. d) Sai: quy luật có ý nghĩa thực tiễn to lớn."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Cụm từ nào tóm tắt nội dung quy luật của Bài 17? (5 từ, dạng “đụng một – động tất cả”)", "answer": "đụng một – động tất cả", "explain": "“Đụng một – động tất cả”: một thành phần thay đổi kéo theo toàn bộ hệ thống."},
