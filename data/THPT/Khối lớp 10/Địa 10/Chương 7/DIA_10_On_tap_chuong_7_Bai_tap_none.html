{"type": "mcq", "level": "NB", "points": 0.25, "q": "Quy luật địa đới nhấn mạnh", "options": ["A. sự thay đổi theo độ cao.", "B. sự thay đổi theo vĩ độ do bức xạ Mặt Trời.", "C. sự thay đổi theo kinh độ.", "D. hệ quả dây chuyền."], "answer": "B", "explain": "Địa đới: theo vĩ độ, do bức xạ Mặt Trời."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một khu rừng bị cháy. Theo quy luật thống nhất và hoàn chỉnh, hệ quả tiếp theo KHÓ tránh khỏi là", "options": ["A. không có hệ quả gì.", "B. đất bị xói mòn, động vật mất nơi cư trú, khí hậu địa phương khô hạn hơn.", "C. rừng tự phục hồi ngay.", "D. đất tốt hơn."], "answer": "B", "explain": "Cháy rừng → mất lớp phủ → hệ quả dây chuyền đến đất, sinh vật, khí hậu."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một tỉnh có cả đồng bằng, trung du và miền núi. Để phát triển nông nghiệp hợp lí, tỉnh nên", "options": ["A. trồng một loại cây cho cả tỉnh.", "B. vận dụng các quy luật: đồng bằng trồng lúa (phù sa), trung du trồng cây công nghiệp, miền núi trồng rừng và cây ưa mát theo vành đai độ cao.", "C. bỏ hoang miền núi.", "D. chỉ phát triển công nghiệp."], "answer": "B", "explain": "Bố trí sản xuất phù hợp với từng vành đai tự nhiên — vận dụng tổng hợp các quy luật."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Câu nói “đụng một – động tất cả” diễn tả quy luật nào?", "options": ["A. Địa đới", "B. Thống nhất và hoàn chỉnh", "C. Đai cao", "D. Địa ô"], "answer": "B", "explain": "Một thành phần thay đổi kéo theo toàn bộ hệ thống — thống nhất và hoàn chỉnh."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một dự án thủy điện được phê duyệt mà không đánh giá tác động môi trường. Theo chương 7, rủi ro lớn nhất là", "options": ["A. không có rủi ro.", "B. các hệ quả dây chuyền không lường trước (ngập rừng, thay đổi dòng chảy, mất đa dạng sinh học, tái định cư) gây thiệt hại lớn.", "C. chỉ tốn thêm chi phí.", "D. chỉ ảnh hưởng đến cá."], "answer": "B", "explain": "Bỏ qua đánh giá tác động là phớt lờ quy luật thống nhất và hoàn chỉnh — hệ quả dây chuyền có thể rất nghiêm trọng."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Đụng một – động tất cả” diễn tả thống nhất và hoàn chỉnh.", "b) Cháy rừng gây hệ quả dây chuyền.", "c) Phát triển nông nghiệp cần phù hợp với điều kiện tự nhiên từng vùng.", "d) Dự án thủy điện không cần đánh giá tác động môi trường."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: bắt buộc phải đánh giá."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mỗi vùng nên bố trí cây trồng phù hợp với vành đai tự nhiên.", "b) Bỏ qua đánh giá tác động môi trường rất rủi ro.", "c) Quy luật tự nhiên có thể bị phớt lờ khi có tiền.", "d) Phát triển phải gắn với bảo vệ môi trường."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: phớt lờ quy luật gây hậu quả nặng nề."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Cụm từ nào (5 từ) tóm tắt quy luật thống nhất và hoàn chỉnh?", "answer": "đụng một – động tất cả", "explain": "“Đụng một – động tất cả”. "},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Rừng cháy gây xói mòn đất, mất nơi cư trú của động vật. Đây là minh họa cho tính chất nào của quy luật? (2 từ)", "answer": "hoàn chỉnh", "explain": "Tính hoàn chỉnh: biến đổi dây chuyền, đầy đủ."}
]}
,
{"name": "Đề 5", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Trong vỏ địa lí, giới hạn trên là", "options": ["A. mặt đất.", "B. hết tầng đối lưu.", "C. tầng ô-dôn.", "D. đỉnh Everest."], "answer": "B", "explain": "Giới hạn trên của vỏ địa lí: hết tầng đối lưu của khí quyển."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Trong các quy luật sau, quy luật nào thay đổi theo kinh độ?", "options": ["A. Địa đới", "B. Đai cao", "C. Địa ô", "D. Ngày đêm"], "answer": "C", "explain": "Địa ô: thay đổi theo kinh độ (từ biển vào nội địa)."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một học sinh vẽ biểu đồ nhiệt độ trung bình năm từ xích đạo về cực thấy giảm dần. Biểu đồ này minh họa", "options": ["A. quy luật địa ô.", "B. quy luật địa đới (nhiệt độ giảm theo vĩ độ).", "C. quy luật đai cao.", "D. không minh họa quy luật nào."], "answer": "B", "explain": "Nhiệt độ giảm theo vĩ độ — cơ sở của địa đới."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một đoàn làm phim muốn quay cảnh “từ rừng nhiệt đới lên đến tuyết trắng chỉ trong một ngày leo núi”. Nên chọn", "options": ["A. núi cao ở vùng nhiệt đới (ví dụ dãy An-đét, Kilimanjaro).", "B. đồng bằng sông Hồng.", "C. bãi biển.", "D. hoang mạc."], "answer": "A", "explain": "Núi cao nhiệt đới: chân núi rừng nhiệt đới (địa đới), lên cao lạnh dần có tuyết (đai cao) — hai quy luật cùng thể hiện."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao các nhà địa lí phải dùng phối hợp nhiều quy luật để giải thích thực tế?", "options": ["A. Vì một quy luật là đủ.", "B. Vì trong thực tế các quy luật tác động đồng thời, đan xen nhau.", "C. Vì các quy luật mâu thuẫn nhau.", "D. Vì không có quy luật nào đúng."], "answer": "B", "explain": "Thực tế phức tạp: nhiều quy luật cùng tác động, cần phân tích tổng hợp."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một vùng ven biển ở vĩ độ 15 độ B có núi cao 2000 m sát biển. Khí hậu ở đây chịu tác động của các quy luật nào?", "options": ["A. Chỉ địa đới.", "B. Địa đới (vĩ độ thấp – nóng), đai cao (núi cao – mát), địa hình ven biển (mưa nhiều) — tác động tổng hợp.", "C. Chỉ đai cao.", "D. Không chịu quy luật nào."], "answer": "B", "explain": "Vĩ độ thấp (nóng) + núi cao (mát) + ven biển (ẩm): ba yếu tố cùng tác động — ví dụ tổng hợp các quy luật."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giới hạn trên của vỏ địa lí là hết tầng đối lưu.", "b) Địa ô thay đổi theo kinh độ.", "c) Nhiệt độ giảm theo vĩ độ từ xích đạo về cực.", "d) Trong thực tế các quy luật tác động đồng thời."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Núi Kilimanjaro ở xích đạo có tuyết trên đỉnh.", "b) Một địa điểm có thể chịu tác động của nhiều quy luật.", "c) Giải thích thực tế cần phối hợp nhiều quy luật.", "d) Mỗi hiện tượng chỉ do một quy luật duy nhất gây ra."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: thường do nhiều quy luật phối hợp."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Nhiệt độ trung bình năm giảm dần từ xích đạo về hai cực minh họa quy luật nào? (2 từ)", "answer": "địa đới", "explain": "Nhiệt độ giảm theo vĩ độ — địa đới."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Núi Kilimanjaro nằm ở xích đạo nhưng đỉnh có tuyết vĩnh cửu. Đây là do quy luật nào lấn át? (2 từ)", "answer": "đai cao", "explain": "Độ cao lớn (5895 m) làm nhiệt độ giảm mạnh — đai cao lấn át địa đới."}
]},
{"name": "Đề 6", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Vỏ địa lí là môi trường sống của", "options": ["A. toàn bộ sinh vật trên Trái Đất.", "B. chỉ con người.", "C. chỉ thực vật.", "D. không có sinh vật."], "answer": "A", "explain": "Vỏ địa lí chứa sinh quyển — môi trường sống của toàn bộ sinh vật."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Quy luật nào giải thích sự khác nhau giữa ven biển và nội địa ở cùng vĩ độ?", "options": ["A. Địa đới", "B. Địa ô", "C. Đai cao", "D. Thống nhất và hoàn chỉnh"], "answer": "B", "explain": "Địa ô: thay đổi theo kinh độ do phân bố lục địa – đại dương."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một vùng nội địa ở vĩ độ 45 độ B có mùa đông rất lạnh, mùa hè nóng, mưa ít. Kiểu khí hậu này hình thành do", "options": ["A. chỉ do vĩ độ.", "B. sự phối hợp của địa đới (vĩ độ trung bình) và địa ô (xa biển, tính lục địa tăng).", "C. chỉ do độ cao.", "D. ngẫu nhiên."], "answer": "B", "explain": "Vĩ độ 45 độ (ôn đới) + sâu nội địa (lục địa) → khí hậu lục địa khắc nghiệt."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Hai thành phố A (ven biển) và B (nội địa) cùng vĩ độ 45 độ B. Dự đoán đúng là", "options": ["A. A và B có khí hậu giống hệt nhau.", "B. A ôn hòa, mưa nhiều hơn; B chênh lệch nhiệt lớn, mưa ít hơn (địa ô).", "C. B ôn hòa hơn A.", "D. không thể dự đoán."], "answer": "B", "explain": "Ven biển được biển điều hòa (ôn hòa, ẩm); nội địa tính lục địa tăng (khắc nghiệt, khô)."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Ý nghĩa của việc học các quy luật vỏ địa lí là", "options": ["A. chỉ để thi cử.", "B. giúp hiểu tự nhiên, vận dụng vào sản xuất và bảo vệ môi trường.", "C. không có ý nghĩa.", "D. chỉ để biết tên các quy luật."], "answer": "B", "explain": "Hiểu quy luật để sản xuất hợp lí (bố trí cây trồng) và bảo vệ môi trường (dự báo hệ quả)."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một học sinh thắc mắc: “Tại sao cùng ở Việt Nam mà Sa Pa lạnh, Cà Mau nóng?”. Câu trả lời đầy đủ nhất là", "options": ["A. Do Sa Pa ở miền Bắc.", "B. Do chênh lệch vĩ độ (địa đới: Bắc lạnh hơn Nam) và độ cao (đai cao: Sa Pa trên núi cao nên lạnh hơn).", "C. Do Cà Mau gần xích đạo hơn nên nóng — chỉ do vĩ độ.", "D. Ngẫu nhiên."], "answer": "B", "explain": "Sa Pa (22 độ B, cao 1500 m) vs Cà Mau (9 độ B, đồng bằng): vĩ độ + độ cao cùng tác động — địa đới và đai cao phối hợp."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vỏ địa lí là môi trường sống của sinh vật.", "b) Địa ô giải thích sự khác nhau giữa ven biển và nội địa.", "c) Vùng nội địa 45 độ B có tính lục địa rõ.", "d) Học quy luật địa lí giúp sản xuất và bảo vệ môi trường."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ven biển 45 độ B ôn hòa hơn nội địa cùng vĩ độ.", "b) Sa Pa lạnh hơn Cà Mau do cả vĩ độ và độ cao.", "c) Một hiện tượng có thể do nhiều quy luật cùng gây ra.", "d) Chỉ cần nhớ tên quy luật là đủ, không cần hiểu."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần hiểu để vận dụng."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Vùng nội địa xa biển có biên độ nhiệt lớn, mưa ít. Tính chất này được gọi là tính gì? (2 từ: lục địa hoặc hải dương)", "answer": "lục địa", "explain": "Tính lục địa tăng dần khi vào sâu nội địa."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Sa Pa lạnh hơn Cà Mau do chênh lệch vĩ độ và độ cao. Hai quy luật nào đã phối hợp ở đây? (ghi 2 quy luật, cách nhau bằng dấu phẩy)", "answer": "địa đới, đai cao", "explain": "Vĩ độ (địa đới) và độ cao (đai cao) cùng tác động."}
]}
,
{"name": "Đề 7", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Các quyển trong vỏ địa lí có quan hệ", "options": ["A. độc lập với nhau.", "B. tiếp xúc, xâm nhập, tác động lẫn nhau.", "C. đối lập nhau.", "D. không liên quan."], "answer": "B", "explain": "Đặc trưng của vỏ địa lí: các quyển tiếp xúc, xâm nhập, tác động lẫn nhau."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Quy luật nào KHÔNG thay đổi theo vĩ độ?", "options": ["A. Địa đới", "B. Đai cao", "C. Cả A và B", "D. Không có"], "answer": "B", "explain": "Đai cao thay đổi theo độ cao (thuộc phi địa đới); địa đới thay đổi theo vĩ độ."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một vùng có địa hình núi cao, ven biển, ở vĩ độ nhiệt đới. Số quy luật trong chương 7 tác động đến vùng này là", "options": ["A. 1", "B. 2", "C. 3", "D. 4"], "answer": "D", "explain": "Cả 4: địa đới (vĩ độ), đai cao (núi), địa ô/địa hình ven biển (mưa), thống nhất và hoàn chỉnh (mối quan hệ các thành phần)."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một nhà địa lí nói: “Muốn hiểu một vùng đất, phải đặt nó trong mối quan hệ với các vùng xung quanh và các thành phần tự nhiên”. Quan điểm này phù hợp với", "options": ["A. quy luật thống nhất và hoàn chỉnh (tính hệ thống, tổng thể).", "B. quy luật địa đới.", "C. quy luật đai cao.", "D. không phù hợp quy luật nào."], "answer": "A", "explain": "Tư duy hệ thống, tổng thể — đúng tinh thần thống nhất và hoàn chỉnh."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong các hiện tượng sau, hiện tượng nào là hệ quả dây chuyền?", "options": ["A. Mặt Trời mọc ở phía đông.", "B. Phá rừng đầu nguồn gây lũ quét hạ lưu.", "C. Thủy triều lên xuống.", "D. Trái Đất tự quay."], "answer": "B", "explain": "Phá rừng → mất khả năng giữ nước → lũ quét: chuỗi nhân quả dây chuyền."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Sắp xếp các bước tư duy đúng khi đánh giá một dự án theo quy luật thống nhất và hoàn chỉnh: (1) đề xuất giải pháp giảm thiểu, (2) xác định tác động trực tiếp, (3) dự báo hệ quả dây chuyền.", "options": ["A. (2) – (3) – (1).", "B. (1) – (2) – (3).", "C. (3) – (1) – (2).", "D. (2) – (1) – (3)."], "answer": "A", "explain": "Trình tự: xác định tác động trực tiếp → dự báo hệ quả dây chuyền → đề xuất giải pháp — đúng quy trình đánh giá tác động môi trường."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Các quyển trong vỏ địa lí tác động lẫn nhau.", "b) Đai cao không thay đổi theo vĩ độ.", "c) Vùng núi ven biển nhiệt đới chịu tác động của nhiều quy luật.", "d) Phá rừng đầu nguồn gây lũ quét hạ lưu là hệ quả dây chuyền."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Muốn hiểu một vùng đất cần đặt trong mối quan hệ tổng thể.", "b) Đánh giá dự án cần theo trình tự: tác động trực tiếp – hệ quả dây chuyền – giải pháp.", "c) Có thể đánh giá dự án mà không cần dự báo hệ quả.", "d) Tư duy hệ thống phù hợp với thống nhất và hoàn chỉnh."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: phải dự báo hệ quả dây chuyền."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Muốn hiểu một vùng đất phải đặt nó trong mối quan hệ tổng thể với xung quanh. Đây là tư duy theo quy luật nào? (4 từ)", "answer": "thống nhất và hoàn chỉnh", "explain": "Tư duy hệ thống, tổng thể — quy luật thống nhất và hoàn chỉnh."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Có 4 quy luật trong chương 7. Kể tên 2 quy luật thuộc nhóm phi địa đới. (cách nhau bằng dấu phẩy)", "answer": "đai cao, địa ô", "explain": "Phi địa đới gồm đai cao và địa ô."}
]},
{"name": "Đề 8", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Vỏ địa lí dày khoảng 30–35 km, tính từ", "options": ["A. mặt đất lên đỉnh khí quyển.", "B. hết tầng đối lưu xuống đáy vực thẳm đại dương.", "C. tâm Trái Đất lên mặt đất.", "D. đáy biển lên mặt biển."], "answer": "B", "explain": "Giới hạn trên: hết tầng đối lưu; dưới: đáy vực thẳm đại dương."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Quy luật địa đới do đâu gây ra?", "options": ["A. Nội lực", "B. Bức xạ Mặt Trời", "C. Con người", "D. Thủy triều"], "answer": "B", "explain": "Bức xạ Mặt Trời — năng lượng bên ngoài."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một cánh rừng nguyên sinh bị chuyển thành đất nông nghiệp. Theo chương 7, sự thay đổi này liên quan đến quy luật nào nhất?", "options": ["A. Địa đới", "B. Thống nhất và hoàn chỉnh (thay đổi một thành phần kéo theo hệ sinh thái, đất, nước thay đổi).", "C. Đai cao", "D. Địa ô"], "answer": "B", "explain": "Chuyển đổi sử dụng đất gây hệ quả dây chuyền — thống nhất và hoàn chỉnh."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một thành phố xây dựng “hành lang xanh” ven sông. Theo chương 7, lợi ích tổng hợp là", "options": ["A. chỉ để đẹp.", "B. điều hòa khí hậu, giữ đất ven sông, tạo nơi cư trú cho sinh vật, cải thiện môi trường — tác động tích cực dây chuyền.", "C. tốn đất.", "D. không có lợi ích."], "answer": "B", "explain": "Hành lang xanh tác động tích cực dây chuyền — mặt tích cực của thống nhất và hoàn chỉnh."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Để phân biệt địa đới với địa ô, dựa vào", "options": ["A. chiều thay đổi: vĩ độ hay kinh độ.", "B. màu sắc bản đồ.", "C. tên gọi.", "D. không thể phân biệt."], "answer": "A", "explain": "Địa đới: theo vĩ độ; địa ô: theo kinh độ (biển – nội địa)."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một bài kiểm tra yêu cầu: “Nêu 2 biểu hiện của phi địa đới ở Việt Nam”. Câu trả lời đúng là", "options": ["A. Sa Pa se lạnh (đai cao); Trường Sơn hai sườn mưa khác mùa (địa hình – phi địa đới).", "B. Hà Nội lạnh về mùa đông; TP. Hồ Chí Minh nóng quanh năm.", "C. Cả nước đều nóng ẩm.", "D. Không có biểu hiện nào."], "answer": "A", "explain": "Sa Pa mát do độ cao (đai cao); Trường Sơn phân hóa mưa theo sườn (địa hình – phi địa đới). Đáp án B là địa đới + gió mùa."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vỏ địa lí từ hết tầng đối lưu đến đáy vực thẳm.", "b) Địa đới do bức xạ Mặt Trời.", "c) Chuyển rừng thành đất nông nghiệp gây hệ quả dây chuyền.", "d) Phân biệt địa đới – địa ô dựa vào chiều thay đổi."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hành lang xanh ven sông có lợi ích tổng hợp.", "b) Sa Pa se lạnh là biểu hiện của đai cao.", "c) Trường Sơn hai sườn mưa khác mùa do địa hình.", "d) Ở Việt Nam không có biểu hiện của phi địa đới."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: có nhiều biểu hiện."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Để phân biệt địa đới với địa ô, ta dựa vào chiều thay đổi: vĩ độ hay kinh độ đối với địa ô?", "answer": "kinh độ", "explain": "Địa ô thay đổi theo kinh độ."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Sa Pa se lạnh và Trường Sơn hai sườn mưa khác mùa là biểu hiện của nhóm quy luật nào? (3 từ)", "answer": "phi địa đới", "explain": "Đai cao và vai trò địa hình — thuộc phi địa đới."}
]}
,
{"name": "Đề 9", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Có bao nhiêu quyển hợp thành vỏ địa lí?", "options": ["A. 2", "B. 3", "C. 4", "D. 6"], "answer": "C", "explain": "4 quyển: khí quyển, thủy quyển, thạch quyển, sinh quyển."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Có bao nhiêu quy luật được học trong Bài 18?", "options": ["A. 1", "B. 2", "C. 3", "D. 4"], "answer": "C", "explain": "Bài 18: địa đới, đai cao, địa ô (3 quy luật)."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một vùng đất bị sa mạc hóa lan rộng. Theo chương 7, nguyên nhân có thể liên quan đến", "options": ["A. chỉ do khí hậu khô hạn (địa ô).", "B. khí hậu khô hạn kết hợp với con người khai thác quá mức (chăn thả, phá rừng) — tác động tổng hợp.", "C. chỉ do con người.", "D. không có nguyên nhân."], "answer": "B", "explain": "Sa mạc hóa: nguyên nhân tự nhiên (khô hạn) + con người (phá rừng, chăn thả quá mức) — phân tích tổng hợp."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Để chống sa mạc hóa ở rìa hoang mạc, biện pháp tổng hợp phù hợp với chương 7 là", "options": ["A. để tự nhiên.", "B. trồng vành đai rừng chắn gió cát (cây chịu hạn), quản lí chăn thả, giữ nước — tác động đồng bộ nhiều thành phần.", "C. chỉ trồng một loại cây.", "D. chuyển dân đi nơi khác."], "answer": "B", "explain": "Chống sa mạc hóa cần tác động đồng bộ: rừng chắn cát, quản lí sử dụng đất, giữ nước — tư duy thống nhất và hoàn chỉnh."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Mối quan hệ giữa quy luật thống nhất và hoàn chỉnh với ba quy luật còn lại là", "options": ["A. không liên quan.", "B. thống nhất và hoàn chỉnh là “khung” chung: mọi sự thay đổi theo địa đới, đai cao, địa ô đều kéo theo hệ quả dây chuyền.", "C. mâu thuẫn nhau.", "D. chỉ một quy luật đúng."], "answer": "B", "explain": "Thống nhất và hoàn chỉnh là quy luật chung nhất, bao trùm: mọi biến đổi (dù theo quy luật nào) đều gây hệ quả dây chuyền."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một học sinh giỏi tóm tắt chương 7 bằng sơ đồ tư duy. Nhánh trung tâm nên ghi", "options": ["A. “Vỏ địa lí – 4 quy luật”.", "B. “Trái Đất hình cầu”.", "C. “Con người”.", "D. “Bản đồ”."], "answer": "A", "explain": "Trung tâm: vỏ địa lí; 4 nhánh: thống nhất và hoàn chỉnh, địa đới, đai cao, địa ô."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vỏ địa lí gồm 4 quyển.", "b) Bài 18 có 3 quy luật.", "c) Sa mạc hóa do cả tự nhiên và con người.", "d) Thống nhất và hoàn chỉnh là quy luật chung nhất."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chống sa mạc hóa cần biện pháp tổng hợp.", "b) Mọi biến đổi đều gây hệ quả dây chuyền.", "c) Sơ đồ tư duy chương 7 lấy vỏ địa lí làm trung tâm.", "d) Chỉ cần học thuộc tên các quy luật là đủ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần hiểu và vận dụng."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Bài 18 có 3 quy luật: địa đới, đai cao và gì? (2 từ)", "answer": "địa ô", "explain": "Địa đới, đai cao, địa ô."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Trong 4 quy luật chương 7, quy luật nào được xem là chung nhất, bao trùm các quy luật còn lại? (4 từ)", "answer": "thống nhất và hoàn chỉnh", "explain": "Mọi biến đổi đều gây hệ quả dây chuyền — tính bao trùm của thống nhất và hoàn chỉnh."}
]},
{"name": "Đề 10", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Chương 7 có tên là", "options": ["A. Sinh quyển.", "B. Một số quy luật của vỏ địa lí.", "C. Địa lí dân cư.", "D. Thủy quyển."], "answer": "B", "explain": "Chương 7: Một số quy luật của vỏ địa lí."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Bài 17 có tên là", "options": ["A. Quy luật địa đới và phi địa đới.", "B. Vỏ địa lí, quy luật thống nhất và hoàn chỉnh của vỏ địa lí.", "C. Sinh quyển.", "D. Đất trên Trái Đất."], "answer": "B", "explain": "Bài 17: Vỏ địa lí, quy luật thống nhất và hoàn chỉnh của vỏ địa lí."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một học sinh ôn tập chương 7 bằng cách lập bảng so sánh 4 quy luật theo các tiêu chí: nội dung – nguyên nhân – ví dụ. Cách học này", "options": ["A. không hiệu quả.", "B. rất hiệu quả vì giúp phân biệt rõ các quy luật, tránh nhầm lẫn.", "C. chỉ tốn thời gian.", "D. chỉ phù hợp với môn Toán."], "answer": "B", "explain": "Bảng so sánh giúp hệ thống hóa, phân biệt các quy luật dễ nhầm (địa đới – đai cao – địa ô)."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một câu hỏi kiểm tra: “Phân tích ảnh hưởng của địa hình đến khí hậu Việt Nam”. Cần vận dụng", "options": ["A. chỉ quy luật địa đới.", "B. quy luật đai cao (Hoàng Liên Sơn, Trường Sơn), hướng sườn (mưa theo mùa), thống nhất và hoàn chỉnh (tác động tổng hợp).", "C. chỉ quy luật địa ô.", "D. không cần quy luật nào."], "answer": "B", "explain": "Địa hình Việt Nam: núi cao (đai cao), hướng sườn đón gió (phân hóa mưa), tác động tổng hợp — cần phối hợp nhiều quy luật."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Thông điệp quan trọng nhất của chương 7 là", "options": ["A. thuộc lòng các định nghĩa.", "B. hiểu các quy luật của vỏ địa lí để vận dụng vào sản xuất, đời sống và bảo vệ môi trường.", "C. vẽ được bản đồ.", "D. tính được diện tích."], "answer": "B", "explain": "Học quy luật để hiểu tự nhiên, sản xuất hợp lí và bảo vệ môi trường."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Sắp xếp đúng trình tự từ khái quát đến cụ thể khi trình bày chương 7: (1) các quy luật cụ thể, (2) khái niệm vỏ địa lí, (3) vận dụng.", "options": ["A. (2) – (1) – (3).", "B. (1) – (2) – (3).", "C. (3) – (1) – (2).", "D. (2) – (3) – (1)."], "answer": "A", "explain": "Trình tự logic: khái niệm vỏ địa lí → các quy luật → vận dụng thực tiễn."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau (tổng kết chương 7):", "statements": ["a) Vỏ địa lí là nơi 4 quyển gặp nhau.", "b) Có 4 quy luật: thống nhất và hoàn chỉnh, địa đới, đai cao, địa ô.", "c) Địa đới do Mặt Trời, đai cao và địa ô do nội lực.", "d) Học quy luật để vận dụng vào đời sống."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng: tổng kết toàn chương 7."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lập bảng so sánh giúp phân biệt các quy luật.", "b) Phân tích địa hình Việt Nam cần phối hợp nhiều quy luật.", "c) Trình bày từ khái quát đến cụ thể là logic.", "d) Chương 7 không liên quan đến thực tế Việt Nam."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nhiều ví dụ Việt Nam (Sa Pa, Trường Sơn, Đà Lạt)."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Muốn phân biệt các quy luật dễ nhầm, nên lập loại bảng nào? (2 từ)", "answer": "so sánh", "explain": "Bảng so sánh giúp phân biệt địa đới – đai cao – địa ô."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Cả 4 quy luật trong chương 7 đều là quy luật của đối tượng nào? (3 từ)", "answer": "vỏ địa lí", "explain": "Chương 7: Một số quy luật của vỏ địa lí."}
]}
]}
