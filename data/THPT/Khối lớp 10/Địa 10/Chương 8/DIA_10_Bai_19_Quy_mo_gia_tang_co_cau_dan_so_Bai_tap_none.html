{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một nước có tỉ suất tử thô rất thấp (5‰) nhờ y tế hiện đại, nhưng tỉ suất sinh cũng thấp (9‰). Tháp dân số của nước này có dạng", "options": ["A. mở rộng.", "B. ổn định hoặc thu hẹp.", "C. không xác định.", "D. hình tam giác."], "answer": "B", "explain": "Sinh thấp (9‰), tử thấp (5‰) → gia tăng 0,4% → tháp ổn định hoặc thu hẹp (kiểu nước phát triển)."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một công ty muốn mở nhà máy cần nhiều lao động trẻ. Nên đặt nhà máy ở nước có tháp dân số dạng nào?", "options": ["A. Thu hẹp", "B. Mở rộng (dân số trẻ, lao động dồi dào).", "C. Không quan trọng", "D. Nước ít dân"], "answer": "B", "explain": "Tháp mở rộng: dân số trẻ, lực lượng lao động dồi dào, chi phí nhân công thường thấp."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Tỉ số giới tính mất cân bằng (thừa nam, thiếu nữ) gây hệ quả xã hội nào?", "options": ["A. Không gây hệ quả.", "B. Khó khăn trong hôn nhân, gia đình; mất cân bằng xã hội.", "C. Kinh tế phát triển nhanh.", "D. Dân số tăng nhanh."], "answer": "B", "explain": "Mất cân bằng giới tính gây hệ lụy hôn nhân, gia đình và ổn định xã hội."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một nước có chính sách ưu đãi cho gia đình sinh con thứ 3 (như một số nước châu Âu). Mục đích là", "options": ["A. tăng dân số nhanh.", "B. chống già hóa, tăng sinh để cân bằng cơ cấu dân số.", "C. giảm dân số.", "D. không có mục đích."], "answer": "B", "explain": "Nước sinh thấp, già hóa → khuyến khích sinh để trẻ hóa cơ cấu dân số."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Việt Nam đứng thứ 3 Đông Nam Á về dân số.", "b) Tháp thu hẹp có đáy hẹp, đỉnh rộng.", "c) Nước sinh 9‰, tử 5‰ có tháp ổn định hoặc thu hẹp.", "d) Mất cân bằng giới tính gây hệ lụy xã hội."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nên đặt nhà máy cần lao động trẻ ở nước có tháp mở rộng.", "b) Nước già hóa có thể khuyến khích sinh con thứ 3.", "c) Chính sách dân số cần phù hợp với thực tế mỗi nước.", "d) Mọi nước đều nên áp dụng một chính sách dân số giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: mỗi nước có tình hình dân số khác nhau."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Tháp dân số có đáy hẹp, đỉnh rộng thuộc dạng nào? (1 từ)", "answer": "thu hẹp", "explain": "Tháp thu hẹp: già hóa dân số."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Tháp dân số dạng mở rộng (đáy rộng, đỉnh nhọn) cho thấy dân số tăng như thế nào? (2 từ)", "answer": "tăng nhanh", "explain": "Tháp mở rộng: dân số trẻ, tăng nhanh."}
]}

{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một nước có dân số 100 triệu, tỉ suất gia tăng tự nhiên 1%/năm. Sau 1 năm, dân số tăng thêm khoảng", "options": ["A. 100 nghìn người.", "B. 1 triệu người.", "C. 10 triệu người.", "D. 100 triệu người."], "answer": "B", "explain": "100 triệu × 1% = 1 triệu người."},

{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một nước có tỉ lệ thất nghiệp cao ở thanh niên dù dân số trong tuổi lao động lớn. Nguyên nhân sâu xa có thể là", "options": ["A. dân số quá ít.", "B. chất lượng nguồn nhân lực thấp, cơ cấu kinh tế chưa tạo đủ việc làm phù hợp.", "C. thanh niên lười biếng.", "D. không có nguyên nhân."], "answer": "B", "explain": "Lao động dồi dào nhưng thiếu kĩ năng + thiếu việc làm → thất nghiệp: vấn đề chất lượng và cơ cấu, không chỉ số lượng."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sinh thô, tử thô có đơn vị là ‰.", "b) Dân số 100 triệu tăng 1%/năm thì tăng 1 triệu người.", "c) Dân số tăng nhanh gây sức ép việc làm.", "d) Thất nghiệp thanh niên chỉ do dân số đông."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: còn do chất lượng nhân lực và cơ cấu kinh tế."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tăng 1 triệu trên 100 triệu dân là tăng 1%.", "b) Chất lượng nhân lực quan trọng hơn số lượng.", "c) Cần tạo việc làm tương xứng với tăng dân số.", "d) Dân số đông tự động mang lại phát triển."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần chất lượng và việc làm."},
