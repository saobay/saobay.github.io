{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Có 2 loại hình quần cư cơ bản.", "b) Tỉ lệ dân thành thị = dân thành thị / tổng dân số.", "c) Tỉ lệ 85% thể hiện đô thị hóa cao.", "d) Nông thôn và thành thị khác nhau về kinh tế, nhà cửa, lối sống."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nước 60 triệu dân, tỉ lệ 50% thì dân thành thị là 30 triệu.", "b) Huyện ngoại thành có khu công nghiệp đang đô thị hóa.", "c) Đô thị hóa chỉ diễn ra ở thành phố lớn.", "d) Nông thôn ven đô cũng đang đô thị hóa."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: đô thị hóa lan cả về nông thôn ven đô."},

{"type": "short", "level": "VDC", "points": 0.5, "q": "Nước 60 triệu dân, tỉ lệ dân thành thị 50% thì có bao nhiêu triệu dân thành thị? (chỉ ghi số)", "answer": "30", "explain": "60 × 50% = 30 triệu."}

{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một vùng có mật độ 5 người/km². Để phát triển kinh tế, khó khăn lớn nhất là", "options": ["A. thiếu lao động, thị trường nhỏ, chi phí hạ tầng cao.", "B. ô nhiễm.", "C. ùn tắc.", "D. thiếu đất."], "answer": "A", "explain": "Thưa dân: thiếu lao động, thị trường tiêu thụ nhỏ, đầu tư hạ tầng tốn kém trên đầu người."},
