{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một nước chỉ trông chờ vào viện trợ nước ngoài mà không phát huy nội lực. Hậu quả là", "options": ["A. phát triển bền vững.", "B. phụ thuộc, thiếu tự chủ, dễ tổn thương khi viện trợ giảm.", "C. không có hậu quả.", "D. trở nên giàu có."], "answer": "B", "explain": "Nội lực quyết định; chỉ dựa vào ngoại lực dẫn đến phụ thuộc, kém bền vững."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lao động, vốn, công nghệ là nguồn lực KT–XH.", "b) Nội lực có vai trò quyết định.", "c) Lao động dồi dào cần đào tạo và việc làm.", "d) Hội nhập giúp tranh thủ ngoại lực."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thất nghiệp cao thể hiện nguồn lực lao động chưa được khai thác tốt.", "b) Chỉ trông chờ viện trợ dẫn đến phụ thuộc.", "c) Cần phát huy nội lực là chính.", "d) Ngoại lực không cần thiết."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: ngoại lực quan trọng."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Dân cư và nguồn lao động thuộc loại nguồn lực nào: tự nhiên hay kinh tế – xã hội?", "answer": "kinh tế – xã hội", "explain": "Con người (dân cư, lao động) thuộc nguồn lực KT–XH."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Nước chỉ trông chờ viện trợ nước ngoài mà không phát huy nội lực sẽ rơi vào tình trạng gì? (2 từ)", "answer": "phụ thuộc", "explain": "Phụ thuộc vào bên ngoài, thiếu tự chủ."}
]}
,

{"type": "mcq", "level": "NB", "points": 0.25, "q": "Tài nguyên thiên nhiên thuộc loại nguồn lực nào?", "options": ["A. Kinh tế – xã hội", "B. Tự nhiên", "C. Ngoại lực", "D. Không phải nguồn lực"], "answer": "B", "explain": "Tài nguyên thiên nhiên (đất, nước, khoáng sản...) là nguồn lực tự nhiên."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một nước có nhiều sông ngòi, tiềm năng thủy điện lớn. Đây là nguồn lực để phát triển", "options": ["A. nông nghiệp.", "B. công nghiệp năng lượng (thủy điện).", "C. du lịch biển.", "D. khai thác than."], "answer": "B", "explain": "Sông ngòi dốc nhiều (như Việt Nam, Lào) là tiềm năng thủy điện."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Lào được mệnh danh là “cục pin của Đông Nam Á” nhờ xuất khẩu điện. Nguồn lực chủ yếu mà Lào khai thác là", "options": ["A. dầu mỏ.", "B. thủy điện từ sông Mê Kông và các phụ lưu (nguồn lực tự nhiên).", "C. than đá.", "D. gió."], "answer": "B", "explain": "Lào khai thác tiềm năng thủy điện dồi dào từ hệ thống sông Mê Kông."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Nguồn lực nào sau đây là vô hạn nếu khai thác hợp lí?", "options": ["A. Dầu mỏ", "B. Than đá", "C. Năng lượng mặt trời, gió (tái tạo).", "D. Quặng sắt"], "answer": "C", "explain": "Năng lượng tái tạo (mặt trời, gió) không cạn kiệt; khoáng sản thì có hạn."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một nước có nắng, gió dồi dào nhưng vẫn dùng than đá gây ô nhiễm. Lời khuyên phù hợp là", "options": ["A. tiếp tục dùng than đá.", "B. chuyển dần sang năng lượng tái tạo (mặt trời, gió) — khai thác nguồn lực bền vững.", "C. nhập khẩu than nhiều hơn.", "D. không dùng năng lượng."], "answer": "B", "explain": "Chuyển đổi năng lượng: tận dụng nguồn lực tái tạo, giảm ô nhiễm."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tài nguyên thiên nhiên là nguồn lực tự nhiên.", "b) Sông ngòi là tiềm năng thủy điện.", "c) Năng lượng mặt trời, gió là tái tạo.", "d) Khoáng sản là vô hạn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: khoáng sản có hạn, cạn kiệt nếu khai thác bừa bãi."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lào xuất khẩu điện từ thủy điện.", "b) Nên chuyển dần sang năng lượng tái tạo.", "c) Than đá gây ô nhiễm hơn năng lượng tái tạo.", "d) Nguồn lực nào cũng vô hạn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nhiều nguồn lực có hạn."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Năng lượng mặt trời, gió thuộc loại năng lượng nào? (2 từ: tái tạo hay hóa thạch)", "answer": "tái tạo", "explain": "Năng lượng tái tạo: không cạn kiệt."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Lào được mệnh danh là “cục pin của Đông Nam Á” nhờ khai thác nguồn năng lượng nào? (2 từ)", "answer": "thủy điện", "explain": "Thủy điện từ sông Mê Kông."}
]},
{"name": "Đề 6", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Nguồn lực là", "options": ["A. “vốn liếng” để phát triển kinh tế.", "B. chỉ tiền bạc.", "C. chỉ máy móc.", "D. không quan trọng."], "answer": "A", "explain": "Nguồn lực là tổng thể điều kiện để phát triển — “vốn liếng” của quốc gia."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Thị trường tiêu thụ thuộc loại nguồn lực nào?", "options": ["A. Tự nhiên", "B. Kinh tế – xã hội", "C. Không phải nguồn lực", "D. Nội lực duy nhất"], "answer": "B", "explain": "Thị trường do con người tạo ra — nguồn lực KT–XH."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một sản phẩm tốt nhưng không bán được vì thiếu thị trường. Điều này cho thấy", "options": ["A. thị trường không quan trọng.", "B. thị trường là nguồn lực quan trọng của phát triển.", "C. sản phẩm không cần thị trường.", "D. chỉ cần sản xuất."], "answer": "B", "explain": "Có sản xuất mà không có thị trường tiêu thụ thì kinh tế không phát triển được."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Việt Nam tham gia nhiều hiệp định thương mại tự do (FTA). Mục đích về nguồn lực là", "options": ["A. đóng cửa thị trường.", "B. mở rộng thị trường xuất khẩu (ngoại lực), thu hút đầu tư.", "C. chỉ để quảng bá.", "D. không có mục đích."], "answer": "B", "explain": "FTA mở rộng thị trường, thu hút FDI — tranh thủ ngoại lực."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Cơ sở hạ tầng (đường sá, cảng, điện) thuộc loại nguồn lực nào?", "options": ["A. Tự nhiên", "B. Kinh tế – xã hội", "C. Không phải nguồn lực", "D. Ngoại lực duy nhất"], "answer": "B", "explain": "Hạ tầng do con người xây dựng — nguồn lực KT–XH."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hai tỉnh A (hạ tầng tốt) và B (hạ tầng kém) có tài nguyên tương đương. Tỉnh nào thu hút đầu tư hơn?", "options": ["A. Tỉnh B", "B. Tỉnh A (hạ tầng tốt giảm chi phí, tăng hiệu quả).", "C. Như nhau", "D. Không liên quan"], "answer": "B", "explain": "Hạ tầng là nguồn lực KT–XH quan trọng thu hút đầu tư."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nguồn lực là “vốn liếng” phát triển.", "b) Thị trường là nguồn lực KT–XH.", "c) FTA giúp mở rộng thị trường.", "d) Hạ tầng không ảnh hưởng đến đầu tư."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: hạ tầng tốt thu hút đầu tư."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Không có thị trường thì sản xuất khó phát triển.", "b) Hạ tầng tốt thu hút đầu tư.", "c) Nguồn lực KT–XH do con người tạo ra.", "d) Chỉ cần tài nguyên là đủ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Hiệp định thương mại tự do được viết tắt là gì? (3 chữ cái)", "answer": "FTA", "explain": "FTA (Free Trade Agreement)."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Đường sá, cầu cảng, lưới điện thuộc loại nguồn lực nào: tự nhiên hay kinh tế – xã hội?", "answer": "kinh tế – xã hội", "explain": "Cơ sở hạ tầng do con người xây dựng."}
]}
,

{"type": "mcq", "level": "NB", "points": 0.25, "q": "Nguồn lực ngoài nước có vai trò", "options": ["A. quyết định.", "B. quan trọng (hỗ trợ, thúc đẩy).", "C. không cần thiết.", "D. gây hại."], "answer": "B", "explain": "Ngoại lực quan trọng, hỗ trợ phát triển nhanh hơn."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một nước nghèo nhưng có chính sách đúng, người dân cần cù, học hỏi công nghệ. Nước này có thể", "options": ["A. không bao giờ phát triển.", "B. phát triển nhanh nhờ phát huy nội lực (con người) và tranh thủ ngoại lực (công nghệ).", "C. chỉ trông chờ viện trợ.", "D. mãi nghèo."], "answer": "B", "explain": "Ví dụ Hàn Quốc, Singapore: nghèo tài nguyên nhưng phát triển nhờ con người và chính sách đúng."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Singapore rất nhỏ, nghèo tài nguyên nhưng giàu có. Nguồn lực chủ yếu của Singapore là", "options": ["A. dầu mỏ.", "B. vị trí địa lí (cảng biển), nguồn nhân lực, chính sách (KT–XH).", "C. nông nghiệp.", "D. khoáng sản."], "answer": "B", "explain": "Singapore phát triển nhờ vị trí cảng, nhân lực và chính sách — nguồn lực KT–XH."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Để biến tiềm năng thành hiện thực phát triển, cần", "options": ["A. chỉ cần tiềm năng.", "B. chính sách đúng, vốn, công nghệ, nhân lực — khai thác hiệu quả.", "C. chờ đợi.", "D. khai thác bừa bãi."], "answer": "B", "explain": "Tiềm năng + khai thác hiệu quả = phát triển."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một học sinh nói: “Nước giàu tài nguyên thì tự động giàu có”. Em phản biện", "options": ["A. Đồng ý.", "B. Chưa đúng: nhiều nước giàu tài nguyên vẫn nghèo; quan trọng là khai thác hiệu quả, chính sách đúng (ví dụ Nhật Bản nghèo tài nguyên vẫn giàu).", "C. Tài nguyên gây nghèo.", "D. Không có ý kiến."], "answer": "B", "explain": "Phản biện bằng thực tế: tài nguyên là điều kiện cần, khai thác hiệu quả là điều kiện đủ."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nội lực quyết định, ngoại lực quan trọng.", "b) Nước nghèo có thể phát triển nhờ chính sách đúng.", "c) Singapore phát triển nhờ vị trí và nhân lực.", "d) Tiềm năng tự động thành hiện thực."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần khai thác hiệu quả."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giàu tài nguyên chưa chắc đã giàu có.", "b) Nghèo tài nguyên vẫn có thể phát triển.", "c) Quan trọng là cách khai thác nguồn lực.", "d) Tài nguyên là tất cả."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Yếu tố nào có vai trò quyết định sự phát triển: nội lực hay ngoại lực?", "answer": "nội lực", "explain": "Nội lực quyết định."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Quốc đảo nhỏ ở Đông Nam Á, nghèo tài nguyên nhưng rất phát triển nhờ cảng biển và nhân lực là nước nào?", "answer": "Singapore", "explain": "Singapore: vị trí, nhân lực, chính sách."}
]},

{"type": "mcq", "level": "TH", "points": 0.25, "q": "Nội lực và ngoại lực là cách phân loại theo", "options": ["A. nguồn gốc.", "B. phạm vi lãnh thổ.", "C. giá trị.", "D. thời gian."], "answer": "B", "explain": "Theo phạm vi: trong nước (nội lực) / ngoài nước (ngoại lực)."},
