{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một nước muốn tăng GDP nhanh nhất trong ngắn hạn nên", "options": ["A. chỉ trông chờ tăng dân số.", "B. tăng năng suất, mở rộng sản xuất, thu hút đầu tư (tăng giá trị sản xuất trong lãnh thổ).", "C. in thêm tiền.", "D. giảm sản xuất."], "answer": "B", "explain": "GDP tăng khi giá trị sản xuất trong lãnh thổ tăng thực chất."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) GDP chỉ tính sản phẩm cuối cùng.", "b) Giá trị xe máy 30 triệu được tính đủ 30 triệu vào GDP.", "c) Lợi nhuận công ty VN ở Lào tính vào GNI Việt Nam.", "d) Cơ cấu lãnh thổ là phân bố kinh tế theo không gian."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level":  "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Muốn tăng GDP cần tăng giá trị sản xuất thực.", "b) In thêm tiền làm tăng GDP thực.", "c) Đầu tư nước ngoài góp phần tăng GDP.", "d) GDP phản ánh quy mô nền kinh tế."], "answer": ["T", "F", "T", "T"], "explain": "a), c), d) Đúng. b) Sai: in tiền gây lạm phát, không tăng GDP thực."},
{"type": "short", "level": "NB", "points": 0.5, "q": "GDP chỉ tính hàng hóa, dịch vụ ở khâu nào: trung gian hay cuối cùng?", "answer": "cuối cùng", "explain": "Chỉ tính sản phẩm cuối cùng, tránh tính trùng."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Lợi nhuận của doanh nghiệp Việt Nam đầu tư ở Lào chuyển về nước được tính vào GDP hay GNI của Việt Nam?", "answer": "GNI", "explain": "Thu nhập từ nước ngoài của công dân/doanh nghiệp VN → GNI."}
]}
,

{"type": "mcq", "level": "VD", "points": 0.25, "q": "Hai nước A và B có tổng GDP bằng nhau, nhưng dân số A gấp đôi B. So sánh mức sống bình quân", "options": ["A. A giàu gấp đôi B.", "B. GDP/người của A chỉ bằng một nửa của B — mức sống bình quân của B cao hơn.", "C. Hai nước giàu như nhau.", "D. Không so sánh được."], "answer": "B", "explain": "GDP bằng nhau, dân số A gấp đôi → GDP/người của A bằng một nửa B."},

{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hai nước GDP bằng nhau, dân đông hơn thì GDP/người thấp hơn.", "b) So sánh mức sống phải dùng GDP/người.", "c) GDP lớn nhất thì dân giàu nhất.", "d) HDI là một tiêu chí đánh giá phát triển."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: cần GDP/người."},

]},
{"name": "Đề 6", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "“GDP – Đất, GNI – Người” là mẹo nhớ về", "options": ["A. cách phân biệt GDP (theo lãnh thổ) và GNI (theo công dân).", "B. cách tính GDP/người.", "C. cơ cấu ngành.", "D. nguồn lực."], "answer": "A", "explain": "GDP theo lãnh thổ (đất), GNI theo công dân (người)."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Thu nhập ròng từ nước ngoài bằng", "options": ["A. thu nhập công dân kiếm được ở nước ngoài − thu nhập người nước ngoài kiếm được trong nước.", "B. tổng thu nhập trong nước.", "C. GDP × 2.", "D. dân số × thu nhập."], "answer": "A", "explain": "Thu nhập ròng = thu nhập ra − thu nhập vào."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một nước có nhiều công dân làm việc ở nước ngoài gửi tiền về. GNI của nước này so với GDP sẽ", "options": ["A. GNI lớn hơn GDP (vì cộng thêm thu nhập ròng dương từ nước ngoài).", "B. GNI nhỏ hơn GDP.", "C. bằng nhau.", "D. không liên quan."], "answer": "A", "explain": "Thu nhập ròng dương → GNI lớn hơn GDP."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một nước có nhiều doanh nghiệp nước ngoài hoạt động, lợi nhuận chuyển ra nước ngoài lớn. GNI của nước này so với GDP sẽ", "options": ["A. GNI lớn hơn GDP.", "B. GNI nhỏ hơn GDP (thu nhập ròng từ nước ngoài âm).", "C. bằng nhau.", "D. không tính được."], "answer": "B", "explain": "Lợi nhuận chảy ra nhiều hơn vào → thu nhập ròng âm → GNI nhỏ hơn GDP."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Cơ cấu kinh tế hợp lí là cơ cấu", "options": ["A. chỉ có nông nghiệp.", "B. phù hợp với điều kiện và xu hướng phát triển, các ngành hỗ trợ nhau.", "C. chỉ có công nghiệp.", "D. không thay đổi."], "answer": "B", "explain": "Cơ cấu hợp lí phù hợp điều kiện, phát huy lợi thế, các ngành liên kết."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một nước đang phát triển có tỉ trọng nông nghiệp trong GDP còn 40%. Để chuyển dịch cơ cấu, nước này nên", "options": ["A. bỏ nông nghiệp.", "B. công nghiệp hóa, hiện đại hóa nông nghiệp, phát triển công nghiệp và dịch vụ.", "C. chỉ phát triển dịch vụ.", "D. giữ nguyên."], "answer": "B", "explain": "Chuyển dịch: hiện đại hóa nông nghiệp + phát triển công nghiệp, dịch vụ."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) GDP theo lãnh thổ, GNI theo công dân.", "b) Thu nhập ròng = thu nhập ra − thu nhập vào.", "c) Nhiều kiều hối làm GNI lớn hơn GDP.", "d) Cơ cấu hợp lí phù hợp điều kiện phát triển."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lợi nhuận chảy ra nhiều làm GNI nhỏ hơn GDP.", "b) Chuyển dịch cơ cấu cần công nghiệp hóa.", "c) Nên bỏ hẳn nông nghiệp.", "d) Các ngành cần hỗ trợ nhau."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: hiện đại hóa chứ không bỏ."},
{"type": "short", "level": "NB", "points": 0.5, "q": "GNI lớn hơn GDP khi thu nhập ròng từ nước ngoài dương hay âm?", "answer": "dương", "explain": "GNI = GDP + thu nhập ròng; ròng dương → GNI lớn hơn."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Nước có nhiều doanh nghiệp nước ngoài, lợi nhuận chảy ra lớn thì GNI so với GDP sẽ lớn hơn hay nhỏ hơn?", "answer": "nhỏ hơn", "explain": "Thu nhập ròng âm → GNI nhỏ hơn GDP."}
]}

{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một tỉnh có tỉ trọng dịch vụ trong GRDP (tổng sản phẩm trên địa bàn) tăng nhanh nhờ du lịch biển. Điều này thể hiện", "options": ["A. chuyển dịch cơ cấu ngành theo hướng tăng tỉ trọng dịch vụ.", "B. suy giảm kinh tế.", "C. không thay đổi.", "D. chỉ phát triển nông nghiệp."], "answer": "A", "explain": "Tỉ trọng dịch vụ tăng = chuyển dịch cơ cấu tích cực."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "GRDP là", "options": ["A. tổng sản phẩm trên địa bàn một tỉnh/thành phố.", "B. GDP của cả nước.", "C. thu nhập của công dân.", "D. ngân sách tỉnh."], "answer": "A", "explain": "GRDP: tổng sản phẩm trên địa bàn (cấp tỉnh)."},

{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nền kinh tế có 3 nhóm ngành.", "b) Du lịch thuộc nhóm dịch vụ.", "c) GRDP là tổng sản phẩm trên địa bàn tỉnh.", "d) Tăng tỉ trọng dịch vụ là chuyển dịch tích cực."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chế biến nông sản giúp tăng giá trị.", "b) Du lịch nông nghiệp tăng tỉ trọng dịch vụ.", "c) Giữ sản xuất lạc hậu vẫn tăng GRDP.", "d) Thu hút đầu tư giúp chuyển dịch cơ cấu."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Ngành du lịch thuộc nhóm ngành nào? (1 từ)", "answer": "dịch vụ", "explain": "Du lịch là ngành dịch vụ."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Tổng sản phẩm trên địa bàn một tỉnh/thành phố được viết tắt là gì? (4 chữ cái)", "answer": "GRDP", "explain": "GRDP (Gross Regional Domestic Product)."}
]},

{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao HDI được dùng cùng với GDP để đánh giá phát triển?", "options": ["A. Vì HDI thay thế hoàn toàn GDP.", "B. Vì HDI bổ sung các khía cạnh GDP chưa phản ánh: tuổi thọ, giáo dục.", "C. Vì HDI dễ tính hơn.", "D. Vì GDP không cần thiết."], "answer": "B", "explain": "HDI gồm thu nhập, tuổi thọ, giáo dục — toàn diện hơn GDP đơn thuần."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Hai nước có GDP/người tương đương nhưng một nước có tuổi thọ và tỉ lệ đi học cao hơn. Theo HDI, nước nào phát triển hơn?", "options": ["A. Nước có tuổi thọ và giáo dục cao hơn.", "B. Hai nước như nhau.", "C. Nước có dân số đông hơn.", "D. Không đánh giá được."], "answer": "A", "explain": "HDI tính cả tuổi thọ và giáo dục nên nước đó xếp hạng cao hơn."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một nước có GDP/người cao nhưng HDI thấp. Nguyên nhân có thể là", "options": ["A. thu nhập phân phối không đều, giáo dục và y tế kém.", "B. dân số ít.", "C. diện tích nhỏ.", "D. không có nguyên nhân."], "answer": "A", "explain": "GDP/người cao nhưng bất bình đẳng, y tế – giáo dục kém → HDI thấp."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một chính phủ đặt mục tiêu “tăng trưởng bao trùm”. Điều này có nghĩa là", "options": ["A. chỉ tăng GDP.", "B. tăng trưởng gắn với giảm nghèo, công bằng xã hội, bảo vệ môi trường — phát triển toàn diện.", "C. chỉ phát triển thành phố.", "D. không cần tăng trưởng."], "answer": "B", "explain": "Tăng trưởng bao trùm: mọi người cùng hưởng lợi, bền vững."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) HDI là chỉ số phát triển con người.", "b) HDI bổ sung tuổi thọ, giáo dục cho GDP.", "c) GDP/người cao nhưng HDI có thể thấp.", "d) Tăng trưởng bao trùm gắn với công bằng và môi trường."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hai nước GDP/người bằng nhau, nước có giáo dục tốt hơn thì HDI cao hơn.", "b) Bất bình đẳng làm HDI thấp dù GDP/người cao.", "c) Đánh giá phát triển cần nhiều tiêu chí.", "d) GDP phản ánh mọi mặt phát triển."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."},
{"type": "short", "level": "NB", "points": 0.5, "q": "HDI là viết tắt của chỉ số nào? (4 từ: chỉ số phát triển con người)", "answer": "chỉ số phát triển con người", "explain": "HDI: Human Development Index."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Ngoài thu nhập, HDI còn dựa vào hai yếu tố nào? (ghi: tuổi thọ, giáo dục)", "answer": "tuổi thọ, giáo dục", "explain": "HDI: thu nhập, tuổi thọ, giáo dục."}
]}
,
{"name": "Đề 9", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "“Cuối cùng” trong định nghĩa GDP nhằm", "options": ["A. tránh tính trùng.", "B. tính cho đẹp.", "C. giảm số liệu.", "D. tăng số liệu."], "answer": "A", "explain": "Chỉ tính sản phẩm cuối cùng để tránh tính trùng giá trị trung gian."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Sản phẩm trung gian là", "options": ["A. sản phẩm dùng để tiếp tục sản xuất ra sản phẩm khác.", "B. sản phẩm cuối cùng.", "C. sản phẩm xuất khẩu.", "D. sản phẩm nhập khẩu."], "answer": "A", "explain": "Sản phẩm trung gian: nguyên liệu, linh kiện dùng để sản xuất tiếp."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong ví dụ làm bánh mì, đâu là sản phẩm trung gian?", "options": ["A. Chiếc bánh mì", "B. Bột mì, men, đường dùng làm bánh", "C. Người bán bánh", "D. Cửa hàng bánh"], "answer": "B", "explain": "Bột mì, men, đường là nguyên liệu (trung gian); bánh mì là sản phẩm cuối cùng."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một nhà máy sản xuất 1000 chiếc xe đạp, giá 2 triệu đồng/chiếc, dùng lốp mua ngoài trị giá 200 nghìn đồng/chiếc. Giá trị tính vào GDP là", "options": ["A. 2 tỉ đồng (1000 × 2 triệu) — chỉ tính xe đạp cuối cùng.", "B. 2 tỉ + 200 triệu đồng.", "C. chỉ 200 triệu đồng.", "D. 0 đồng."], "answer": "A", "explain": "Chỉ tính sản phẩm cuối cùng: 1000 × 2 triệu = 2 tỉ đồng; giá lốp đã nằm trong giá xe."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Việc nấu cơm ở nhà cho gia đình ăn có được tính vào GDP không?", "options": ["A. Có, tính đầy đủ.", "B. Không, vì là sản xuất tự cung tự cấp ngoài thị trường, khó đo lường.", "C. Có, tính một nửa.", "D. Tùy tâm trạng."], "answer": "B", "explain": "GDP chỉ tính giá trị thị trường; sản xuất tự dùng ngoài thị trường thường không được tính."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một người tranh luận: “GDP chưa tính công việc nội trợ nên chưa phản ánh hết giá trị xã hội tạo ra”. Ý kiến này", "options": ["A. sai hoàn toàn.", "B. đúng — đó là một hạn chế của GDP: bỏ sót sản xuất ngoài thị trường và kinh tế phi chính thức.", "C. đúng nhưng không quan trọng.", "D. không thể kiểm chứng."], "answer": "B", "explain": "Hạn chế của GDP: không đo được sản xuất tự cung, kinh tế ngầm, và các giá trị phi vật chất."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) “Cuối cùng” nhằm tránh tính trùng.", "b) Bột mì là sản phẩm trung gian.", "c) Chỉ tính giá trị xe đạp cuối cùng vào GDP.", "d) Nấu cơm ở nhà không tính vào GDP."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) 1000 xe đạp giá 2 triệu/chiếc đóng góp 2 tỉ đồng vào GDP.", "b) Giá lốp đã nằm trong giá xe nên không cộng thêm.", "c) GDP bỏ sót sản xuất ngoài thị trường.", "d) GDP phản ánh mọi giá trị xã hội tạo ra."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: GDP có hạn chế."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Sản phẩm dùng để tiếp tục sản xuất ra sản phẩm khác được gọi là sản phẩm gì? (2 từ)", "answer": "trung gian", "explain": "Sản phẩm trung gian."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "1000 chiếc xe đạp, giá 2 triệu đồng/chiếc thì đóng góp vào GDP bao nhiêu tỉ đồng? (chỉ ghi số)", "answer": "2", "explain": "1000 × 2 triệu = 2 tỉ đồng."}
]},

{"type": "mcq", "level": "NB", "points": 0.25, "q": "Bài 22 có tên đầy đủ là", "options": ["A. Cơ cấu kinh tế, tổng sản phẩm trong nước và tổng thu nhập quốc gia.", "B. Các nguồn lực phát triển kinh tế.", "C. Quy mô dân số.", "D. Vỏ địa lí."], "answer": "A", "explain": "Tên đầy đủ của Bài 22."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "GDP phản ánh", "options": ["A. quy mô nền kinh tế.", "B. dân số.", "C. diện tích.", "D. khí hậu."], "answer": "A", "explain": "GDP đo quy mô (giá trị sản xuất) của nền kinh tế."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một học sinh tóm tắt Bài 22: “Cơ cấu 3 nhóm ngành – GDP theo lãnh thổ – GNI theo công dân – GDP/người = GDP/dân số”. Tóm tắt này", "options": ["A. sai.", "B. đúng và đủ ý chính.", "C. thiếu nhiều.", "D. quá dài."], "answer": "B", "explain": "Đủ 4 ý chính của bài."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một nhà báo viết: “Nước X có GDP tăng 7%, cơ cấu chuyển dịch tích cực, HDI cải thiện”. Nhận định tổng hợp là", "options": ["A. nước X chỉ tăng trưởng số lượng.", "B. nước X phát triển khá toàn diện: tăng trưởng + chuyển dịch cơ cấu + phát triển con người.", "C. nước X đang suy thoái.", "D. không thể nhận định."], "answer": "B", "explain": "Kết hợp nhiều tiêu chí: tăng trưởng, cơ cấu, HDI = phát triển toàn diện."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Thông điệp của Bài 22 là", "options": ["A. chỉ cần biết GDP.", "B. hiểu cơ cấu kinh tế và các chỉ tiêu (GDP, GNI, GDP/người, HDI) để đánh giá đúng sự phát triển.", "C. GDP là tất cả.", "D. không cần chỉ tiêu nào."], "answer": "B", "explain": "Đánh giá phát triển cần hiểu cơ cấu và nhiều chỉ tiêu."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Sắp xếp đúng trình tự bài học: (1) cơ cấu kinh tế, (2) GDP, (3) GNI, (4) GDP/người và tiêu chí đánh giá.", "options": ["A. (1) – (2) – (3) – (4).", "B. (2) – (1) – (3) – (4).", "C. (4) – (3) – (2) – (1).", "D. (1) – (3) – (2) – (4)."], "answer": "A", "explain": "Đúng trình tự SGK: cơ cấu → GDP → GNI → GDP/người và tiêu chí."},
