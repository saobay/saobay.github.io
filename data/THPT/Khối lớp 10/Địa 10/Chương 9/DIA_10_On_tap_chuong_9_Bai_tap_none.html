{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ưu tiên hạ tầng, nhân lực để phát triển du lịch miền núi.", "b) Huyện có y tế, giáo dục tốt bền vững hơn huyện chỉ có mỏ.", "c) Khai thác mỏ là vĩnh viễn.", "d) Phát triển cần bền vững."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: mỏ cạn kiệt."},
{"type": "short", "level": "NB", "points": 0.5, "q": "HDI gồm 3 yếu tố: thu nhập, tuổi thọ và gì?", "answer": "giáo dục", "explain": "Thu nhập, tuổi thọ, giáo dục."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Huyện có trường học, bệnh viện tốt nhưng GDP/người thấp hơn được đánh giá có nền tảng phát triển gì hơn? (2 từ)", "answer": "bền vững", "explain": "Phát triển con người, bền vững."}
]}
,
{"name": "Đề 5", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Vị trí địa lí thuộc loại nguồn lực nào?", "options": ["A. Kinh tế – xã hội", "B. Tự nhiên", "C. Ngoại lực", "D. Không phải nguồn lực"], "answer": "B", "explain": "Vị trí địa lí là tặng vật của tự nhiên."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Công thức tính GNI là", "options": ["A. GNI = GDP − thu nhập ròng từ nước ngoài.", "B. GNI = GDP + thu nhập ròng từ nước ngoài.", "C. GNI = GDP × 2.", "D. GNI = GDP / dân số."], "answer": "B", "explain": "GNI = GDP + thu nhập ròng từ nước ngoài."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một thành phố nằm ở ngã ba sông, thuận lợi giao thương từ xưa. Ngày nay thành phố này vẫn sầm uất nhờ chợ đầu mối. Điều này cho thấy vị trí địa lí", "options": ["A. không còn giá trị.", "B. là nguồn lực lâu dài nếu được khai thác tốt qua các thời kì.", "C. chỉ có giá trị trong quá khứ.", "D. gây hại."], "answer": "B", "explain": "Vị trí địa lí là nguồn lực bền vững, giá trị lâu dài."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một nước có GNI lớn hơn GDP. Điều này có nghĩa là", "options": ["A. thu nhập ròng từ nước ngoài của nước này dương (công dân kiếm được ở nước ngoài nhiều hơn người nước ngoài kiếm trong nước).", "B. số liệu sai.", "C. nước này nghèo.", "D. GDP không có ý nghĩa."], "answer": "A", "explain": "GNI lớn hơn GDP khi thu nhập ròng từ nước ngoài dương."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Cơ cấu thành phần kinh tế của Việt Nam KHÔNG bao gồm", "options": ["A. kinh tế nhà nước.", "B. kinh tế tư nhân.", "C. kinh tế phong kiến.", "D. kinh tế có vốn đầu tư nước ngoài."], "answer": "C", "explain": "4 thành phần: nhà nước, tập thể, tư nhân, có vốn đầu tư nước ngoài; không có “phong kiến”."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một học sinh cho rằng: “Cứ tăng GDP là đất nước phát triển”. Để phản biện, em dùng luận cứ nào?", "options": ["A. GDP tăng luôn đồng nghĩa phát triển.", "B. GDP tăng nhưng môi trường suy thoái, bất bình đẳng tăng thì chưa phải phát triển bền vững — cần thêm HDI, môi trường, phân phối.", "C. GDP không liên quan phát triển.", "D. Không cần phản biện."], "answer": "B", "explain": "Phát triển bền vững đòi hỏi nhiều tiêu chí, không chỉ GDP."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vị trí địa lí là nguồn lực tự nhiên.", "b) GNI = GDP + thu nhập ròng từ nước ngoài.", "c) Vị trí là nguồn lực lâu dài.", "d) Việt Nam không có thành phần kinh tế phong kiến."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) GNI lớn hơn GDP khi thu nhập ròng dương.", "b) GDP tăng chưa chắc đã phát triển bền vững.", "c) Cần thêm HDI, môi trường để đánh giá.", "d) Cứ tăng GDP là phát triển."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Khi nào thì GNI nhỏ hơn GDP? (ghi: thu nhập ròng từ nước ngoài âm)", "answer": "thu nhập ròng từ nước ngoài âm", "explain": "Thu nhập ròng âm → GNI nhỏ hơn GDP."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "GDP tăng nhưng môi trường suy thoái, bất bình đẳng tăng thì chưa phải phát triển gì? (2 từ)", "answer": "bền vững", "explain": "Chưa phải phát triển bền vững."}
]},

{"type": "mcq", "level": "NB", "points": 0.25, "q": "Dân cư, lao động thuộc loại nguồn lực nào?", "options": ["A. Tự nhiên", "B. Kinh tế – xã hội", "C. Ngoại lực duy nhất", "D. Không phải nguồn lực"], "answer": "B", "explain": "Con người (dân cư, lao động) thuộc nguồn lực KT–XH."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Nhóm ngành nào sau đây thuộc “nhóm ngành thứ hai”?", "options": ["A. Nông nghiệp", "B. Công nghiệp và xây dựng", "C. Dịch vụ", "D. Thủy sản"], "answer": "B", "explain": "Nhóm ngành thứ hai: công nghiệp – xây dựng."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một công ty may mặc sử dụng 5000 lao động địa phương, xuất khẩu sang châu Âu. Lao động địa phương ở đây là", "options": ["A. nguồn lực tự nhiên.", "B. nguồn lực kinh tế – xã hội (nội lực) quan trọng của công ty.", "C. ngoại lực.", "D. không phải nguồn lực."], "answer": "B", "explain": "Lao động trong nước là nội lực thuộc nguồn lực KT–XH."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Công ty may mặc trên muốn nâng giá trị sản phẩm. Theo kiến thức chương 9, công ty nên", "options": ["A. chỉ tăng số lượng công nhân.", "B. đầu tư thiết kế, thương hiệu, công nghệ (nâng cao nguồn lực KT–XH) để tăng giá trị gia tăng.", "C. giảm lương công nhân.", "D. chuyển sang nhập khẩu."], "answer": "B", "explain": "Tăng giá trị nhờ công nghệ, thiết kế, thương hiệu — nâng cao chất lượng nguồn lực."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "GDP của Việt Nam năm 2023 khoảng bao nhiêu?", "options": ["A. 43 tỉ USD", "B. 430 tỉ USD", "C. 4300 tỉ USD", "D. 4,3 tỉ USD"], "answer": "B", "explain": "GDP Việt Nam 2023 khoảng 430 tỉ USD."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một nước xuất khẩu chủ yếu nguyên liệu thô, nhập khẩu hàng chế biến đắt tiền. Về cơ cấu kinh tế, nước này", "options": ["A. có cơ cấu tiến bộ.", "B. đang ở vị thế bất lợi: giá trị gia tăng thấp, cần công nghiệp chế biến để nâng cao vị thế.", "C. rất phát triển.", "D. không cần thay đổi."], "answer": "B", "explain": "Xuất thô – nhập tinh = bất lợi; cần chế biến sâu để tăng giá trị."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lao động là nguồn lực KT–XH.", "b) Công nghiệp – xây dựng là nhóm ngành thứ hai.", "c) Nâng giá trị nhờ công nghệ, thương hiệu.", "d) GDP Việt Nam 2023 khoảng 430 tỉ USD."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xuất nguyên liệu thô, nhập hàng chế biến là bất lợi.", "b) Cần công nghiệp chế biến để tăng giá trị.", "c) Chỉ tăng số lượng lao động là đủ.", "d) Thương hiệu giúp tăng giá trị sản phẩm."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: cần chất lượng, công nghệ."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Công nghiệp và xây dựng là nhóm ngành thứ mấy?", "answer": "2", "explain": "Nhóm ngành thứ hai."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Nước xuất nguyên liệu thô, nhập hàng chế biến đắt tiền đang ở vị thế bất lợi về mặt nào? (3 từ: giá trị...)", "answer": "giá trị gia tăng", "explain": "Giá trị gia tăng thấp."}
]}
,
{"name": "Đề 7", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Trong các nguồn lực sau, nguồn lực nào là sản phẩm trí tuệ của con người?", "options": ["A. Đất đai", "B. Khí hậu", "C. Tri thức khoa học – công nghệ", "D. Khoáng sản"], "answer": "C", "explain": "Tri thức khoa học – công nghệ do con người tạo ra — nguồn lực KT–XH."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Nhóm ngành dịch vụ bao gồm", "options": ["A. trồng trọt, chăn nuôi.", "B. khai thác, chế biến.", "C. thương mại, du lịch, giao thông vận tải, tài chính...", "D. xây dựng nhà cửa."], "answer": "C", "explain": "Dịch vụ: thương mại, du lịch, vận tải, tài chính, giáo dục, y tế..."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một nông dân áp dụng tưới nhỏ giọt, năng suất tăng gấp đôi mà vẫn dùng diện tích cũ. Điều này cho thấy vai trò của", "options": ["A. mở rộng diện tích.", "B. khoa học – công nghệ (nguồn lực KT–XH) trong nâng cao hiệu quả.", "C. tăng số lao động.", "D. may mắn."], "answer": "B", "explain": "Công nghệ giúp tăng năng suất trên cùng diện tích."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một nước có GDP tăng 5%/năm nhưng lượng khí thải CO2 tăng 10%/năm. Đánh giá về chất lượng tăng trưởng", "options": ["A. rất tốt.", "B. tăng trưởng đánh đổi môi trường — thiếu bền vững, cần công nghệ sạch.", "C. không liên quan.", "D. nên tăng nhanh hơn."], "answer": "B", "explain": "Tăng trưởng gây ô nhiễm nhanh hơn là thiếu bền vững."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Thị trường tiêu thụ có vai trò gì?", "options": ["A. Không quan trọng", "B. Là nguồn lực KT–XH quan trọng — nơi tiêu thụ sản phẩm, thúc đẩy sản xuất", "C. Chỉ gây hại", "D. Chỉ ở nước ngoài"], "answer": "B", "explain": "Thị trường là động lực và điều kiện tiêu thụ của sản xuất."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một doanh nghiệp có công nghệ tốt nhưng sản phẩm ế ẩm vì không nghiên cứu thị trường. Bài học về nguồn lực là", "options": ["A. công nghệ là đủ.", "B. cần kết hợp đồng bộ các nguồn lực (công nghệ + thị trường + nhân lực...) — thiếu một khâu có thể thất bại.", "C. nên bỏ công nghệ.", "D. thị trường không quan trọng."], "answer": "B", "explain": "Các nguồn lực có quan hệ hữu cơ, cần phát huy đồng bộ."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Khoa học – công nghệ là nguồn lực KT–XH.", "b) Du lịch, thương mại thuộc nhóm dịch vụ.", "c) Công nghệ giúp tăng năng suất.", "d) Thị trường là nguồn lực quan trọng."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tăng trưởng gây ô nhiễm nhanh là thiếu bền vững.", "b) Cần công nghệ sạch.", "c) Các nguồn lực cần phát huy đồng bộ.", "d) Chỉ cần công nghệ tốt là thành công."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần cả thị trường."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Thương mại, du lịch, vận tải thuộc nhóm ngành nào? (2 từ)", "answer": "dịch vụ", "explain": "Nhóm ngành dịch vụ."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Tăng trưởng kinh tế nhưng gây ô nhiễm nhanh hơn được gọi là tăng trưởng thiếu gì? (2 từ)", "answer": "bền vững", "explain": "Thiếu bền vững."}
]},

{"type": "mcq", "level": "NB", "points": 0.25, "q": "Chương 9 gồm mấy bài?", "options": ["A. 1", "B. 2", "C. 3", "D. 4"], "answer": "B", "explain": "Chương 9 gồm Bài 21 (nguồn lực) và Bài 22 (cơ cấu, GDP, GNI)."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Bài 21 nghiên cứu về", "options": ["A. các nguồn lực phát triển kinh tế.", "B. GDP và GNI.", "C. dân số.", "D. đất đai."], "answer": "A", "explain": "Bài 21: Các nguồn lực phát triển kinh tế."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một địa phương ban hành chính sách ưu đãi thuế cho doanh nghiệp công nghệ cao. Chính sách này là", "options": ["A. nguồn lực tự nhiên.", "B. nguồn lực kinh tế – xã hội (thể chế, chính sách) thu hút đầu tư.", "C. ngoại lực duy nhất.", "D. không phải nguồn lực."], "answer": "B", "explain": "Chính sách, thể chế là nguồn lực KT–XH quan trọng."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Hai tỉnh có tài nguyên tương đương, tỉnh A thu hút được nhiều dự án công nghệ cao hơn tỉnh B. Nguyên nhân có thể là", "options": ["A. tỉnh A may mắn hơn.", "B. tỉnh A có chính sách, hạ tầng, nhân lực (nguồn lực KT–XH) tốt hơn.", "C. tỉnh B giàu hơn.", "D. không có nguyên nhân."], "answer": "B", "explain": "Nguồn lực KT–XH (chính sách, hạ tầng, nhân lực) quyết định sức hút đầu tư."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Bài 22 nghiên cứu về", "options": ["A. các nguồn lực.", "B. cơ cấu kinh tế, GDP và GNI.", "C. sinh quyển.", "D. đô thị hóa."], "answer": "B", "explain": "Bài 22: Cơ cấu kinh tế, tổng sản phẩm trong nước và tổng thu nhập quốc gia."},
