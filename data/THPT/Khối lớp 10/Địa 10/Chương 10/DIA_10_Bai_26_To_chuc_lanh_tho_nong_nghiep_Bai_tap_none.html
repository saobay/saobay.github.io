{"type": "mcq", "level": "NB", "points": 0.25, "q": "Vùng chuyên canh cà phê lớn nhất Việt Nam ở", "options": ["A. đồng bằng sông Hồng.", "B. Tây Nguyên.", "C. đồng bằng sông Cửu Long.", "D. Bắc Trung Bộ."], "answer": "B", "explain": "Tây Nguyên: đất đỏ bazan — cà phê."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một địa phương có thế mạnh về cây ăn quả (vải, nhãn). Để phát triển bền vững, địa phương nên", "options": ["A. trồng tự phát.", "B. quy hoạch vùng chuyên canh + chế biến + thương hiệu + thị trường.", "C. chặt bỏ.", "D. chỉ bán tươi."], "answer": "B", "explain": "Vùng chuyên canh + chế biến + thương hiệu = bền vững."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Vải thiều Lục Ngạn (Bắc Giang) có thương hiệu, xuất khẩu. Thành công này nhờ", "options": ["A. may mắn.", "B. tổ chức thành vùng chuyên canh + chất lượng + thương hiệu + thị trường.", "C. trồng ít.", "D. không chăm sóc."], "answer": "B", "explain": "Vùng chuyên canh + thương hiệu + thị trường."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Thương hiệu nông sản (vải thiều Lục Ngạn, bưởi Đoan Hùng) giúp", "options": ["A. giảm giá.", "B. nâng giá trị, sức cạnh tranh trên thị trường.", "C. không tác dụng.", "D. tăng chi phí vô ích."], "answer": "B", "explain": "Thương hiệu nâng giá trị và niềm tin."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một vùng chuyên canh rau nhưng nông dân dùng thuốc trừ sâu quá liều. Hậu quả lâu dài là", "options": ["A. rau ngon hơn.", "B. mất an toàn thực phẩm, mất thị trường, ô nhiễm đất nước — chuyên canh phải gắn với an toàn, bền vững.", "C. tăng năng suất mãi.", "D. không hậu quả."], "answer": "B", "explain": "Chuyên canh phải an toàn, bền vững (VietGAP, hữu cơ)."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tổ chức lãnh thổ khai thác hiệu quả từng vùng.", "b) Tây Nguyên chuyên canh cà phê.", "c) Vùng chuyên canh cần thương hiệu.", "d) Thương hiệu nâng giá trị."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vải Lục Ngạn thành công nhờ vùng chuyên canh.", "b) Lạm dụng thuốc trừ sâu mất thị trường.", "c) Chuyên canh cần an toàn, bền vững.", "d) Cứ chuyên canh là bền vững."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần an toàn."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Vùng chuyên canh cà phê lớn nhất Việt Nam ở đâu? (2 từ)", "answer": "Tây Nguyên", "explain": "Tây Nguyên."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Vải thiều nổi tiếng có thương hiệu ở huyện Lục Ngạn thuộc tỉnh nào? (2 từ)", "answer": "Bắc Giang", "explain": "Lục Ngạn, Bắc Giang."}
]},
{"name": "Đề 6", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Nông nghiệp hàng hóa khác nông nghiệp tự cấp ở", "options": ["A. sản xuất để bán.", "B. sản xuất để ăn.", "C. không dùng kĩ thuật.", "D. quy mô nhỏ."], "answer": "A", "explain": "Hàng hóa: sản xuất để bán; tự cấp: để ăn."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Vùng chuyên canh gắn với sản xuất", "options": ["A. tự cấp.", "B. hàng hóa.", "C. manh mún.", "D. lạc hậu."], "answer": "B", "explain": "Vùng chuyên canh sản xuất nông sản hàng hóa."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một nông dân trồng 5 sào lúa đủ ăn, dư ít bán. Đây là", "options": ["A. sản xuất hàng hóa.", "B. sản xuất tự cấp (tự túc).", "C. trang trại.", "D. vùng chuyên canh."], "answer": "B", "explain": "Chủ yếu để ăn = tự cấp."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Xu hướng chuyển từ tự cấp sang hàng hóa ở nông thôn Việt Nam thể hiện", "options": ["A. sự thụt lùi.", "B. quá trình công nghiệp hóa, hiện đại hóa nông nghiệp; nâng cao thu nhập.", "C. không thay đổi.", "D. nông dân lười."], "answer": "B", "explain": "Hàng hóa hóa = hiện đại hóa nông nghiệp."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Để chuyển sang sản xuất hàng hóa, nông dân cần", "options": ["A. chỉ trồng nhiều.", "B. vốn, kĩ thuật, thông tin thị trường, liên kết tiêu thụ.", "C. bỏ ruộng.", "D. chờ đợi."], "answer": "B", "explain": "Hàng hóa cần vốn, kĩ thuật, thị trường, liên kết."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một xã chuyển đổi thành công sang trồng rau hàng hóa cho thành phố. Yếu tố then chốt là", "options": ["A. may mắn.", "B. gần thị trường + tổ chức liên kết (HTX) + kĩ thuật + đầu ra ổn định.", "C. trồng nhiều.", "D. giá cao."], "answer": "B", "explain": "Gần thị trường + liên kết + kĩ thuật + đầu ra."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hàng hóa là sản xuất để bán.", "b) Vùng chuyên canh sản xuất hàng hóa.", "c) Trồng đủ ăn là tự cấp.", "d) Hàng hóa cần vốn, kĩ thuật, thị trường."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chuyển sang hàng hóa là hiện đại hóa.", "b) Rau hàng hóa cần gần thị trường.", "c) Liên kết giúp đầu ra ổn định.", "d) Cứ trồng nhiều là hàng hóa."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần thị trường, liên kết."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Sản xuất nông nghiệp để bán được gọi là sản xuất gì? (2 từ)", "answer": "hàng hóa", "explain": "Sản xuất hàng hóa."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Sản xuất chủ yếu để ăn, dư ít mới bán được gọi là sản xuất gì? (2 từ)", "answer": "tự cấp", "explain": "Sản xuất tự cấp (tự túc)."}
]}
,
{"name": "Đề 7", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Lợi thế so sánh của một vùng là", "options": ["A. điều kiện thuận lợi hơn vùng khác về một mặt nào đó.", "B. diện tích lớn nhất.", "C. dân số đông nhất.", "D. giàu nhất."], "answer": "A", "explain": "Lợi thế so sánh: thuận lợi hơn vùng khác ở một mặt."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Tổ chức lãnh thổ nông nghiệp dựa trên", "options": ["A. lợi thế so sánh của từng vùng.", "B. sự ngẫu nhiên.", "C. ý thích.", "D. sự bắt chước."], "answer": "A", "explain": "Dựa trên lợi thế so sánh từng vùng."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "ĐBSCL có lợi thế so sánh về", "options": ["A. cây công nghiệp lâu năm.", "B. lúa gạo, thủy sản, cây ăn quả (đồng bằng rộng, sông ngòi, khí hậu).", "C. chăn nuôi bò sữa.", "D. rừng."], "answer": "B", "explain": "ĐBSCL: lúa, thủy sản, cây ăn quả."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một vùng trung du có lợi thế về chè nhưng lại trồng lúa năng suất thấp. Lời khuyên là", "options": ["A. tiếp tục trồng lúa.", "B. chuyển sang phát triển chè theo lợi thế so sánh — hiệu quả hơn.", "C. bỏ nông nghiệp.", "D. trồng cả hai như cũ."], "answer": "B", "explain": "Phát huy lợi thế so sánh (chè) thay vì cây kém lợi thế."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Phát huy lợi thế so sánh giúp", "options": ["A. lãng phí nguồn lực.", "B. nâng cao hiệu quả, sức cạnh tranh.", "C. giảm sản lượng.", "D. tăng chi phí."], "answer": "B", "explain": "Lợi thế so sánh → hiệu quả, cạnh tranh."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hai vùng A (đất tốt trồng lúa) và B (đất tốt trồng mía) trao đổi sản phẩm cho nhau. Đây là", "options": ["A. lãng phí.", "B. phân công lao động theo lãnh thổ dựa trên lợi thế so sánh — hai bên cùng có lợi.", "C. không cần thiết.", "D. tự cấp."], "answer": "B", "explain": "Mỗi vùng làm thứ mình có lợi thế, trao đổi — cùng có lợi."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lợi thế so sánh là thuận lợi hơn vùng khác.", "b) Tổ chức lãnh thổ dựa trên lợi thế so sánh.", "c) ĐBSCL có lợi thế lúa, thủy sản.", "d) Phát huy lợi thế nâng hiệu quả."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vùng có lợi thế chè nên phát triển chè.", "b) Hai vùng trao đổi theo lợi thế cùng có lợi.", "c) Nên làm thứ mình kém lợi thế.", "d) Phân công theo lãnh thổ hiệu quả."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Tổ chức lãnh thổ nông nghiệp dựa trên lợi thế gì của từng vùng? (3 từ: lợi thế so...)", "answer": "lợi thế so sánh", "explain": "Lợi thế so sánh."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Mỗi vùng làm thứ mình có lợi thế rồi trao đổi cho nhau được gọi là phân công lao động theo gì? (2 từ)", "answer": "lãnh thổ", "explain": "Phân công lao động theo lãnh thổ."}
]},
{"name": "Đề 8", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Bài 26 thuộc chương nào?", "options": ["A. Chương 9", "B. Chương 10", "C. Chương 8", "D. Chương 7"], "answer": "B", "explain": "Bài 26 thuộc Chương 10."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Bài 26 là bài thứ mấy của Chương 10?", "options": ["A. Bài đầu", "B. Bài thứ hai", "C. Bài thứ ba", "D. Bài cuối (thứ tư)"], "answer": "D", "explain": "Bài 26 là bài cuối Chương 10 (23, 24, 25, 26)."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một tỉnh quy hoạch 3 vùng: vùng lúa, vùng cây ăn quả, vùng chăn nuôi. Đây là", "options": ["A. tổ chức lãnh thổ nông nghiệp theo vùng chuyên môn hóa.", "B. ngẫu nhiên.", "C. không cần thiết.", "D. chia cắt."], "answer": "A", "explain": "Quy hoạch vùng chuyên môn hóa = tổ chức lãnh thổ."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Quy hoạch vùng nông nghiệp cần căn cứ vào", "options": ["A. ý muốn chủ quan.", "B. điều kiện tự nhiên, KT–XH, thị trường, lợi thế so sánh.", "C. sự bắt chước tỉnh khác.", "D. không cần căn cứ."], "answer": "B", "explain": "Quy hoạch phải căn cứ điều kiện thực tế và thị trường."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Tổ chức lãnh thổ nông nghiệp hợp lí giúp", "options": ["A. tăng hiệu quả, sức cạnh tranh, bền vững.", "B. giảm hiệu quả.", "C. lãng phí.", "D. ô nhiễm."], "answer": "A", "explain": "Tổ chức hợp lí → hiệu quả, cạnh tranh, bền vững."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một tỉnh bắt chước tỉnh khác trồng cây không phù hợp, thất bại. Bài học là", "options": ["A. nên bắt chước tiếp.", "B. quy hoạch phải căn cứ điều kiện thực tế của mình, không bắt chước máy móc.", "C. nông nghiệp rủi ro.", "D. không nên quy hoạch."], "answer": "B", "explain": "Mỗi vùng điều kiện khác nhau; không bắt chước máy móc."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bài 26 thuộc Chương 10.", "b) Quy hoạch vùng chuyên môn hóa là tổ chức lãnh thổ.", "c) Quy hoạch cần căn cứ thực tế.", "d) Tổ chức hợp lí tăng hiệu quả."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Không nên bắt chước máy móc tỉnh khác.", "b) Mỗi vùng điều kiện khác nhau.", "c) Quy hoạch cần theo thị trường.", "d) Cứ bắt chước là thành công."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Bài 26 là bài thứ mấy của Chương 10? (chỉ ghi số)", "answer": "4", "explain": "Bài cuối (thứ tư)."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Quy hoạch nông nghiệp không nên làm gì một cách máy móc theo tỉnh khác? (2 từ: bắt...)", "answer": "bắt chước", "explain": "Không bắt chước máy móc."}
]}
,
{"name": "Đề 9", "questions": [
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Hình thức tổ chức nào có quy mô lớn nhất?", "options": ["A. Hộ gia đình", "B. Trang trại", "C. Vùng nông nghiệp", "D. Không so sánh được"], "answer": "C", "explain": "Vùng nông nghiệp (vùng chuyên canh) quy mô lớn nhất — cả một vùng lãnh thổ."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Hình thức nào gắn nông nghiệp với công nghiệp chế biến?", "options": ["A. Trang trại", "B. Thể tổng hợp nông – công nghiệp", "C. Vùng chuyên canh", "D. Hộ gia đình"], "answer": "B", "explain": "Thể tổng hợp nông – công nghiệp."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một vùng có nhiều trang trại chăn nuôi lợn, có nhà máy chế biến thịt, có vùng trồng ngô làm thức ăn. Đây là", "options": ["A. chỉ trang trại.", "B. thể tổng hợp nông – công nghiệp hoàn chỉnh (trồng ngô – chăn nuôi – chế biến).", "C. vùng chuyên canh lúa.", "D. khu công nghiệp."], "answer": "B", "explain": "Chuỗi: trồng thức ăn – chăn nuôi – chế biến = thể tổng hợp."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Chuỗi “trồng ngô – chăn nuôi lợn – chế biến thịt” giúp", "options": ["A. tăng chi phí.", "B. khép kín, giảm chi phí, tăng giá trị, ổn định đầu ra.", "C. giảm chất lượng.", "D. không hiệu quả."], "answer": "B", "explain": "Chuỗi khép kín: chủ động thức ăn, đầu ra, tăng giá trị."},
