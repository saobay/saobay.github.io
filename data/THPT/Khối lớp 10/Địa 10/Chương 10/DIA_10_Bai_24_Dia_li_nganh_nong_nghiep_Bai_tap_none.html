{"type": "mcq", "level": "NB", "points": 0.25, "q": "Bò được nuôi để lấy", "options": ["A. chỉ thịt.", "B. thịt, sữa và sức kéo.", "C. chỉ lông.", "D. chỉ để cưỡi."], "answer": "B", "explain": "Bò: thịt, sữa, sức kéo (tùy vùng)."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vùng nào sau đây chăn nuôi bò sữa phát triển?", "options": ["A. Hoang mạc Xa-ha-ra", "B. Đồng cỏ ôn đới (châu Âu, Niu Di-lân) — khí hậu mát, cỏ tốt, thị trường sữa", "C. Rừng xích đạo", "D. Bắc Cực"], "answer": "B", "explain": "Bò sữa cần cỏ tốt, khí hậu mát, thị trường — châu Âu, Niu Di-lân."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Niu Di-lân nổi tiếng xuất khẩu sữa, bơ. Lợi thế tự nhiên là", "options": ["A. đồng cỏ ôn đới xanh tốt quanh năm, khí hậu mát.", "B. hoang mạc rộng.", "C. rừng rậm.", "D. núi cao."], "answer": "A", "explain": "Đồng cỏ ôn đới + khí hậu mát = chăn nuôi bò sữa lí tưởng."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Cừu được nuôi nhiều ở", "options": ["A. vùng khô hạn, bán hoang mạc (Ô-xtrây-li-a, Trung Á).", "B. rừng xích đạo.", "C. đồng bằng ngập nước.", "D. thành phố."], "answer": "A", "explain": "Cừu chịu khô hạn, ăn cỏ khô — vùng bán hoang mạc."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ô-xtrây-li-a xuất khẩu len cừu lớn nhất thế giới. Điều này gắn với", "options": ["A. đồng cỏ bán khô hạn rộng lớn phù hợp chăn thả cừu quy mô lớn.", "B. rừng rậm.", "C. công nghiệp dệt.", "D. may mắn."], "answer": "A", "explain": "Bán khô hạn + đồng cỏ rộng = chăn cừu lấy len."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trồng trọt gồm nhiều nhóm cây.", "b) Bò cho thịt, sữa, sức kéo.", "c) Bò sữa phát triển ở đồng cỏ ôn đới.", "d) Cừu nuôi nhiều ở vùng khô hạn."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Niu Di-lân xuất khẩu sữa nhờ đồng cỏ ôn đới.", "b) Ô-xtrây-li-a xuất khẩu len nhờ bán khô hạn.", "c) Vật nuôi phân bố theo điều kiện tự nhiên.", "d) Chăn nuôi không cần thị trường."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần thị trường tiêu thụ."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Cừu được nuôi nhiều ở vùng khí hậu nào? (2 từ: khô...)", "answer": "khô hạn", "explain": "Vùng khô hạn, bán hoang mạc."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Quốc đảo ở châu Đại Dương nổi tiếng xuất khẩu sữa, bơ nhờ đồng cỏ ôn đới là nước nào? (3 từ)", "answer": "Niu Di-lân", "explain": "Niu Di-lân."}
]},

{"type": "mcq", "level": "NB", "points": 0.25, "q": "Cây cao su phân bố chủ yếu ở", "options": ["A. ôn đới.", "B. nhiệt đới ẩm (Đông Nam Á: Thái Lan, In-đô-nê-xi-a, Việt Nam).", "C. hàn đới.", "D. hoang mạc."], "answer": "B", "explain": "Cao su cần nóng ẩm quanh năm — Đông Nam Á."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một vùng có mùa đông lạnh giá, mùa hè ấm. Cây công nghiệp phù hợp là", "options": ["A. cao su.", "B. củ cải đường, hướng dương.", "C. cọ dầu.", "D. cà phê."], "answer": "B", "explain": "Ôn đới: củ cải đường, hướng dương."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Thái Lan là nước xuất khẩu cao su lớn nhất. Điều kiện thuận lợi là", "options": ["A. khí hậu nhiệt đới ẩm, đất phù hợp ở miền Nam.", "B. khí hậu lạnh.", "C. hoang mạc.", "D. không có điều kiện."], "answer": "A", "explain": "Miền Nam Thái Lan nóng ẩm — phù hợp cao su."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Hồ tiêu được mệnh danh là", "options": ["A. “vàng đen”.", "B. “vàng trắng”.", "C. “vàng xanh”.", "D. “kim cương”."], "answer": "A", "explain": "Hồ tiêu mệnh danh “vàng đen”; Việt Nam xuất khẩu lớn."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Việt Nam là nước xuất khẩu hồ tiêu lớn nhất thế giới. Vùng trồng chính là", "options": ["A. đồng bằng sông Hồng.", "B. Tây Nguyên và Đông Nam Bộ.", "C. đồng bằng sông Cửu Long.", "D. ven biển miền Trung."], "answer": "B", "explain": "Hồ tiêu trồng nhiều ở Tây Nguyên, Đông Nam Bộ (đất đỏ bazan)."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bông trồng ở cận nhiệt, nhiệt đới.", "b) Cao su cần nhiệt đới ẩm.", "c) Vùng ôn đới phù hợp củ cải đường.", "d) Hồ tiêu mệnh danh “vàng đen”."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thái Lan xuất khẩu cao su nhờ nhiệt đới ẩm.", "b) Việt Nam xuất khẩu hồ tiêu lớn nhất.", "c) Hồ tiêu trồng ở Tây Nguyên, Đông Nam Bộ.", "d) Cao su trồng tốt ở ôn đới."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Hồ tiêu được mệnh danh là gì? (2 từ, trong ngoặc kép)", "answer": "vàng đen", "explain": "“Vàng đen”."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Vùng trồng hồ tiêu chính của Việt Nam là Tây Nguyên và vùng nào nữa? (4 từ)", "answer": "Đông Nam Bộ", "explain": "Tây Nguyên và Đông Nam Bộ."}
]}
,

{"type": "mcq", "level": "NB", "points": 0.25, "q": "Ngành nông nghiệp gồm hai phân ngành chính là", "options": ["A. trồng trọt và chăn nuôi.", "B. trồng trọt và lâm nghiệp.", "C. chăn nuôi và thủy sản.", "D. lâm nghiệp và thủy sản."], "answer": "A", "explain": "Nông nghiệp (hẹp): trồng trọt + chăn nuôi."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Gia cầm được nuôi để lấy", "options": ["A. thịt và trứng.", "B. sữa.", "C. len.", "D. sức kéo."], "answer": "A", "explain": "Gà, vịt: thịt và trứng."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Một gia đình nuôi 10.000 con gà đẻ trứng trong chuồng kín, cho ăn cám công nghiệp. Đây là hình thức", "options": ["A. chăn thả.", "B. chăn nuôi công nghiệp.", "C. chăn nuôi quảng canh.", "D. đánh bắt."], "answer": "B", "explain": "Chuồng kín + thức ăn công nghiệp = chăn nuôi công nghiệp."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một vùng núi cao, giao thông khó khăn, đồng cỏ tự nhiên rộng. Mô hình chăn nuôi phù hợp là", "options": ["A. chăn nuôi công nghiệp.", "B. chăn thả gia súc (bò, dê, cừu) dựa vào đồng cỏ.", "C. nuôi tôm.", "D. không chăn nuôi."], "answer": "B", "explain": "Đồng cỏ tự nhiên + xa thị trường = chăn thả."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Phân bố cây trồng, vật nuôi phụ thuộc chủ yếu vào", "options": ["A. ý thích.", "B. điều kiện tự nhiên (khí hậu, đất, đồng cỏ) và thị trường.", "C. màu sắc.", "D. ngẫu nhiên."], "answer": "B", "explain": "Tự nhiên quyết định cơ cấu; thị trường định hướng sản xuất."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một nước có khí hậu đa dạng từ nhiệt đới đến ôn đới (như Trung Quốc). Lợi thế về nông nghiệp là", "options": ["A. không có lợi thế.", "B. trồng được đa dạng cây trồng (lúa gạo ở Nam, lúa mì ở Bắc) — đa dạng hóa sản phẩm.", "C. chỉ trồng được một loại.", "D. phải nhập khẩu hết."], "answer": "B", "explain": "Khí hậu đa dạng = cơ cấu cây trồng đa dạng (Nam – lúa gạo, Bắc – lúa mì)."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nông nghiệp gồm trồng trọt và chăn nuôi.", "b) Gia cầm cho thịt và trứng.", "c) Nuôi gà chuồng kín là chăn nuôi công nghiệp.", "d) Phân bố cây trồng theo tự nhiên và thị trường."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng."},
{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vùng núi đồng cỏ phù hợp chăn thả.", "b) Trung Quốc trồng lúa gạo ở Nam, lúa mì ở Bắc.", "c) Khí hậu đa dạng giúp đa dạng cây trồng.", "d) Chăn thả cần gần thành phố."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chăn nuôi công nghiệp mới cần gần thị trường."},
{"type": "short", "level": "NB", "points": 0.5, "q": "Ngành nông nghiệp (hẹp) gồm trồng trọt và gì?", "answer": "chăn nuôi", "explain": "Trồng trọt và chăn nuôi."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Trung Quốc trồng lúa gạo chủ yếu ở miền Nam, lúa mì ở miền nào?", "answer": "miền Bắc", "explain": "Miền Bắc ôn đới — lúa mì."}
]},

{"type": "truefalse", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đậu tương dùng ép dầu, làm thức ăn chăn nuôi.", "b) VAC tận dụng phế phẩm các phân ngành.", "c) Trồng trọt cung cấp thức ăn cho chăn nuôi.", "d) Chăn nuôi không liên quan trồng trọt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai."},

{"type": "short", "level": "VDC", "points": 0.5, "q": "Mô hình vườn – ao – chuồng ở Việt Nam được viết tắt là gì? (3 chữ cái)", "answer": "VAC", "explain": "VAC."}
]}
,
