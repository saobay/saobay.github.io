ùa lạnh khô, cuối mùa lạnh ẩm có mưa phùn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vụ hè thu ở đồng bằng sông Cửu Long gieo trồng vào mùa mưa. Cơ sở khí hậu là:", "options": ["A. Gió mùa hạ mang mưa đến, đảm bảo nước cho lúa.", "B. Mùa khô thiếu nước.", "C. Không liên quan gió mùa.", "D. Do tập quán."], "answer": "A", "explain": "Gió mùa tây nam (mùa hạ) gây mưa lớn ở Nam Bộ, cung cấp nước cho vụ hè thu.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vùng ven biển đón gió mùa hạ nhưng lại ít mưa. Giải thích có thể là:", "options": ["A. Gió thổi song song với bờ biển hoặc địa hình không gây nâng ẩm.", "B. Gió quá yếu.", "C. Biển quá lạnh.", "D. Không giải thích được."], "answer": "A", "explain": "Gió ẩm nhưng thổi song song bờ hoặc không gặp địa hình chắn thì ít gây mưa (ví dụ duyên hải Nam Trung Bộ với gió tây nam).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Gió mùa đổi hướng theo mùa.", "b) Đông Nam Á chịu ảnh hưởng gió mùa.", "c) Gió mùa hạ nóng ẩm, gây mưa.", "d) Gió mùa thổi quanh năm một hướng."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: gió mùa đổi hướng theo mùa.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Gió mùa đông bắc ở miền Bắc lạnh khô đầu mùa.", "b) Vụ hè thu nhờ mưa của gió mùa hạ.", "c) Gió ẩm luôn gây mưa mọi nơi.", "d) Việt Nam chịu ảnh hưởng gió mùa."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: còn phụ thuộc hướng gió với bờ biển và địa hình.", "points": 1}, {"type": "short", "level": "VD", "q": "Gió thổi theo mùa, đổi hướng giữa đông và hạ gọi là gió gì?", "answer": "Gió mùa", "explain": "Đó là gió mùa.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Gió mùa mùa đông ở miền Bắc Việt Nam thổi theo hướng nào?", "answer": "Đông bắc", "explain": "Gió mùa đông bắc (từ áp cao Xibia về).", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Loại mưa nào do không khí nóng bốc lên cao gây ra?", "options": ["A. Mưa đối lưu.", "B. Mưa địa hình.", "C. Mưa frông.", "D. Mưa axit."], "answer": "A", "explain": "Mưa đối lưu: không khí nóng bốc lên, ngưng tụ gây mưa (điển hình xích đạo).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sườn đón gió của dãy núi thường:", "options": ["A. Mưa nhiều.", "B. Khô hạn.", "C. Không có mưa.", "D. Lạnh giá."], "answer": "A", "explain": "Sườn đón gió: không khí ẩm bị đẩy lên cao, ngưng tụ gây mưa địa hình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao sườn khuất gió của núi thường khô hạn?", "options": ["A. Vì không khí sau khi vượt núi đã mất hơi ẩm, đi xuống nóng lên (hiệu ứng phơn).", "B. Vì sườn khuất gió lạnh.", "C. Vì không có gió.", "D. Vì ngẫu nhiên."], "answer": "A", "explain": "Không khí xuống sườn khuất gió bị nén nóng lên, độ ẩm thấp — khô nóng (gió phơn).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mưa frông hình thành khi:", "options": ["A. Hai khối khí nóng và lạnh gặp nhau.", "B. Không khí bốc lên do nóng.", "C. Gió vượt núi.", "D. Biển bốc hơi."], "answer": "A", "explain": "Frông là mặt tiếp xúc của hai khối khí khác tính chất; không khí nóng bốc lên trên frông gây mưa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vùng xích đạo mưa nhiều quanh năm vì:", "options": ["A. Áp thấp xích đạo + mưa đối lưu hoạt động mạnh quanh năm.", "B. Gió mùa.", "C. Bão nhiều.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Xích đạo có đai áp thấp, không khí nóng ẩm bốc lên gây mưa đối lưu quanh năm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Dãy Trường Sơn đón gió đông bắc gây mưa lớn ở sườn đông (miền Trung) vào thu đông, nhưng sườn tây (Lào) lại khô. Giải thích:", "options": ["A. Sườn đông đón gió ẩm gây mưa địa hình; sườn tây khuất gió chịu hiệu ứng phơn khô nóng.", "B. Sườn tây cao hơn.", "C. Sườn đông gần biển hơn duy nhất.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Mưa địa hình ở sườn đón gió + hiệu ứng phơn ở sườn khuất gió.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mưa đối lưu do không khí nóng bốc lên.", "b) Sườn đón gió mưa nhiều.", "c) Mưa frông do hai khối khí gặp nhau.", "d) Sườn khuất gió mưa nhiều hơn sườn đón gió."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: sườn đón gió mưa nhiều hơn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xích đạo mưa quanh năm do đối lưu.", "b) Hiệu ứng phơn gây khô nóng sườn khuất gió.", "c) Miền Trung mưa lớn do đón gió đông bắc.", "d) Mưa địa hình chỉ xảy ra ở đồng bằng."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: mưa địa hình xảy ra ở sườn núi đón gió.", "points": 1}, {"type": "short", "level": "VD", "q": "Loại mưa do không khí ẩm vượt qua núi, gây mưa ở sườn đón gió gọi là mưa gì?", "answer": "Mưa địa hình", "explain": "Mưa địa hình (mưa sườn núi).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Gió khô nóng ở sườn khuất gió của dãy núi gọi là gió gì?", "answer": "Gió phơn", "explain": "Gió phơn (foehn): khô nóng ở sườn khuất gió.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Nhiệt độ không khí chủ yếu do đâu?", "options": ["A. Bức xạ Mặt Trời đốt nóng mặt đất, mặt đất truyền nhiệt cho không khí.", "B. Núi lửa.", "C. Con người.", "D. Sấm sét."], "answer": "A", "explain": "Mặt đất hấp thụ bức xạ Mặt Trời rồi bức xạ lại, đốt nóng không khí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhiệt độ phân bố theo vĩ độ như thế nào?", "options": ["A. Giảm dần từ xích đạo về hai cực.", "B. Tăng dần từ xích đạo về hai cực.", "C. Bằng nhau mọi nơi.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Góc nhập xạ giảm dần từ xích đạo về cực nên nhiệt độ giảm dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao biên độ nhiệt năm ở lục địa lớn hơn ở đại dương?", "options": ["A. Vì đất nóng nhanh, lạnh nhanh; nước điều hòa nhiệt.", "B. Vì lục địa gần Mặt Trời hơn.", "C. Vì đại dương sâu.", "D. Vì ngẫu nhiên."], "answer": "A", "explain": "Đất có nhiệt dung nhỏ nên nóng/lạnh nhanh; nước nhiệt dung lớn, điều hòa nhiệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một địa điểm ở độ cao 1 500 m có nhiệt độ 18°C. Nhiệt độ ở chân núi (mực nước biển) khoảng:", "options": ["A. 27°C.", "B. 9°C.", "C. 18°C.", "D. 36°C."], "answer": "A", "explain": "1 500 m chênh 9°C (0,6 × 15); chân núi ấm hơn: 18 + 9 = 27°C.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sa Pa (1 500 m) mát mẻ quanh năm, mùa đông có băng giá. Nguyên nhân chính là:", "options": ["A. Độ cao lớn nên nhiệt độ thấp (giảm theo độ cao).", "B. Gần Trung Quốc.", "C. Nhiều mưa.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Sa Pa ở độ cao khoảng 1 500 m nên nhiệt độ thấp hơn đồng bằng khoảng 9°C.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai thành phố cùng vĩ độ: một ở ven biển, một sâu trong lục địa. Thành phố nào có mùa đông lạnh hơn, mùa hạ nóng hơn?", "options": ["A. Thành phố trong lục địa (biên độ nhiệt lớn).", "B. Thành phố ven biển.", "C. Hai nơi như nhau.", "D. Không thể so sánh."], "answer": "A", "explain": "Trong lục địa: đất nóng/lạnh nhanh nên biên độ nhiệt lớn; ven biển được đại dương điều hòa.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Không khí nhận nhiệt từ mặt đất.", "b) Nhiệt độ giảm từ xích đạo về cực.", "c) Đất nóng nhanh, lạnh nhanh hơn nước.", "d) Càng lên cao càng nóng."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: càng lên cao càng lạnh.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sa Pa mát do độ cao.", "b) Trong lục địa biên độ nhiệt lớn.", "c) Ven biển được đại dương điều hòa.", "d) Nhiệt độ không phụ thuộc độ cao."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: nhiệt độ giảm theo độ cao.", "points": 1}, {"type": "short", "level": "VD", "q": "Nơi nóng nhanh, lạnh nhanh so với đại dương là lục địa hay đại dương?", "answer": "Lục địa", "explain": "Lục địa (đất) nóng nhanh, lạnh nhanh; đại dương điều hòa.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sườn núi nào ấm hơn: sườn đón nắng hay sườn khuất nắng?", "answer": "Sườn đón nắng", "explain": "Sườn đón nắng nhận nhiều bức xạ hơn nên ấm hơn.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Khí áp là gì?", "options": ["A. Sức ép của không khí lên bề mặt Trái Đất.", "B. Sức gió thổi.", "C. Lượng mưa.", "D. Nhiệt độ."], "answer": "A", "explain": "Khí áp là sức ép của không khí lên bề mặt Trái Đất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Các đai khí áp trên Trái Đất phân bố:", "options": ["A. Xen kẽ cao – thấp từ xích đạo về cực.", "B. Chỉ có áp cao.", "C. Chỉ có áp thấp.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Các đai áp cao, áp thấp xen kẽ nhau từ xích đạo về hai cực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao ở xích đạo hình thành đai áp thấp?", "options": ["A. Vì không khí nóng bốc lên cao, tạo áp thấp.", "B. Vì ở đó lạnh.", "C. Vì gió mạnh.", "D. Vì ngẫu nhiên."], "answer": "A", "explain": "Xích đạo nóng, không khí bốc lên → áp thấp (nguyên nhân nhiệt lực).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nơi có khí áp thấp thường có thời tiết:", "options": ["A. Mưa nhiều (không khí bốc lên, ngưng tụ).", "B. Khô hạn.", "C. Lạnh giá.", "D. Không có mây."], "answer": "A", "explain": "Áp thấp: không khí bốc lên, ngưng tụ gây mưa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vùng áp cao chí tuyến thường có thời tiết:", "options": ["A. Khô hạn, ít mưa (không khí giáng xuống).", "B. Mưa nhiều.", "C. Bão nhiều.", "D. Ẩm ướt."], "answer": "A", "explain": "Áp cao: không khí giáng xuống, khô — ít mưa, hình thành hoang mạc.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vùng ven biển có dòng biển lạnh chảy qua thường ít mưa. Nguyên nhân là:", "options": ["A. Dòng biển lạnh làm không khí lạnh, khó bốc lên, ít ngưng tụ gây mưa.", "B. Dòng biển lạnh hút hết mưa.", "C. Ven biển luôn khô.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Dòng biển lạnh làm lạnh không khí phía trên, ức chế bốc hơi, đối lưu — ít mưa (ví dụ hoang mạc Namib).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Khí áp là sức ép của không khí.", "b) Các đai áp cao thấp xen kẽ nhau.", "c) Xích đạo có đai áp thấp.", "d) Áp thấp thường khô hạn."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: áp thấp thường mưa nhiều.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Áp cao chí tuyến gây khô hạn.", "b) Dòng biển lạnh làm ít mưa.", "c) Áp thấp gây mưa nhiều.", "d) Hoang mạc chỉ do áp cao."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: hoang mạc còn do dòng biển lạnh, vị trí sâu trong lục địa, sườn khuất gió...", "points": 1}, {"type": "short", "level": "VD", "q": "Nơi có không khí bốc lên thường hình thành đai khí áp cao hay thấp?", "answer": "Thấp", "explain": "Không khí bốc lên tạo áp thấp.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hoang mạc Namib (châu Phi) ít mưa một phần do dòng biển nào chảy qua?", "answer": "Dòng biển lạnh", "explain": "Dòng biển lạnh Benguela làm ít mưa ở Namib.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Vai trò nào sau đây của khí quyển đối với sự sống?", "options": ["A. Cung cấp oxi, bảo vệ khỏi tia cực tím và thiên thạch nhỏ.", "B. Gây động đất.", "C. Tạo núi lửa.", "D. Làm nước biển mặn."], "answer": "A", "explain": "Khí quyển cung cấp oxi, ozon chắn tia cực tím, đốt cháy thiên thạch nhỏ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tầng đối lưu có đặc điểm nào?", "options": ["A. Nhiệt độ giảm theo độ cao, sinh ra các hiện tượng khí tượng.", "B. Có lớp ozon.", "C. Không khí rất loãng.", "D. Không có hơi nước."], "answer": "A", "explain": "Tầng đối lưu: nhiệt độ giảm theo cao, chứa hơi nước, sinh mây mưa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao các chuyến bay dân dụng thường bay ở tầng bình lưu (độ cao khoảng 10 – 12 km)?", "options": ["A. Vì ở đó không khí ổn định, ít nhiễu động, tiết kiệm nhiên liệu.", "B. Vì ở đó có oxi nhiều.", "C. Vì gần mặt đất.", "D. Vì ngẫu nhiên."], "answer": "A", "explain": "Tầng bình lưu ổn định, ít mây, ít nhiễu động nên máy bay bay êm, tiết kiệm nhiên liệu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiệu ứng nhà kính tự nhiên của khí quyển có vai trò:", "options": ["A. Giữ nhiệt cho Trái Đất, nếu không Trái Đất sẽ rất lạnh.", "B. Gây nóng lên toàn cầu.", "C. Gây mưa axit.", "D. Phá hủy ozon."], "answer": "A", "explain": "Hiệu ứng nhà kính tự nhiên giữ nhiệt, giúp Trái Đất ấm áp; chỉ khi bị tăng cường quá mức mới gây nóng lên toàn cầu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Thủng tầng ozon gây hậu quả gì?", "options": ["A. Tia cực tím lọt xuống nhiều, gây ung thư da, hại mùa màng.", "B. Mưa nhiều hơn.", "C. Gió mạnh hơn.", "D. Không hậu quả."], "answer": "A", "explain": "Ozon suy giảm làm tia cực tím chiếu xuống mặt đất nhiều hơn, hại sức khỏe và sinh vật.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một hành tinh không có khí quyển sẽ có đặc điểm gì?", "options": ["A. Biên độ nhiệt ngày đêm rất lớn, không có thời tiết, dễ bị thiên thạch và tia có hại.", "B. Giống Trái Đất.", "C. Có mưa nhiều.", "D. Có sự sống."], "answer": "A", "explain": "Không khí quyển: không giữ nhiệt (ngày nóng, đêm lạnh), không có thời tiết, không được bảo vệ (ví dụ Mặt Trăng).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Khí quyển cung cấp oxi cho sự sống.", "b) Tầng đối lưu sinh ra mây, mưa.", "c) Khí quyển không có vai trò gì.", "d) Ozon bảo vệ sinh vật."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: khí quyển có nhiều vai trò quan trọng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Máy bay bay ở tầng bình lưu vì ổn định.", "b) Hiệu ứng nhà kính tự nhiên giữ ấm Trái Đất.", "c) Thủng ozon làm tăng tia cực tím.", "d) Mặt Trăng không có khí quyển."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Khí nào chiếm tỉ lệ lớn thứ hai trong khí quyển (sau nitơ)?", "answer": "Oxi", "explain": "Oxi chiếm 20,9%, đứng thứ hai sau nitơ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hiện tượng tia cực tím lọt nhiều xuống mặt đất do suy giảm khí nào trong khí quyển?", "answer": "Ozon", "explain": "Suy giảm ozon làm tăng tia cực tím.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Gió đất – biển là loại gió:", "options": ["A. Gió địa phương thổi theo ngày đêm ở ven biển.", "B. Gió toàn cầu.", "C. Gió mùa.", "D. Gió Mậu dịch."], "answer": "A", "explain": "Gió đất – biển là gió địa phương: ban ngày thổi từ biển vào, ban đêm từ đất ra.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ban ngày ở ven biển, gió thổi theo hướng nào?", "options": ["A. Từ biển vào đất liền.", "B. Từ đất liền ra biển.", "C. Không thổi.", "D. Thổi vòng tròn."], "answer": "A", "explain": "Ban ngày đất nóng hơn biển, không khí bốc lên, gió từ biển (áp cao) thổi vào đất liền.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao ban đêm gió thổi từ đất liền ra biển?", "options": ["A. Vì ban đêm đất lạnh nhanh hơn biển, không khí giáng xuống tạo áp cao đẩy ra biển.", "B. Vì biển nóng.", "C. Vì ngẫu nhiên.", "D. Vì Mặt Trăng."], "answer": "A", "explain": "Đất lạnh nhanh, không khí lạnh giáng xuống tạo áp cao trên đất liền, gió thổi ra biển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Gió phơn Tây Nam ở miền Trung Việt Nam gây ra:", "options": ["A. Khô nóng gay gắt vào mùa hạ.", "B. Mưa lớn.", "C. Lạnh giá.", "D. Bão."], "answer": "A", "explain": "Gió phơn (Lào) vượt Trường Sơn xuống đồng bằng ven biển miền Trung gây khô nóng gay gắt.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ngư dân ven biển thường ra khơi vào ban đêm (gió đất) và về vào ban ngày (gió biển). Lợi ích là:", "options": ["A. Thuận gió cả đi lẫn về, tiết kiệm nhiên liệu.", "B. Tránh bão.", "C. Cá nhiều hơn.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Ban đêm gió từ đất ra biển đẩy thuyền ra khơi; ban ngày gió từ biển vào đẩy thuyền về — thuận gió.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vùng núi có gió thung lũng ban ngày và gió núi ban đêm. Nguyên nhân chung của các gió địa phương này là:", "options": ["A. Chênh lệch nhiệt độ giữa các bề mặt (đất – biển, núi – thung lũng) theo ngày đêm.", "B. Trái Đất quay.", "C. Bão.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Gió địa phương do chênh lệch nhiệt giữa các bề mặt kề nhau, đổi hướng theo ngày đêm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Gió đất – biển là gió địa phương.", "b) Ban ngày gió từ biển vào đất liền.", "c) Gió phơn gây khô nóng.", "d) Ban đêm gió từ biển vào đất liền."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: ban đêm gió từ đất liền ra biển.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ngư dân lợi dụng gió đất – biển.", "b) Gió địa phương do chênh lệch nhiệt.", "c) Gió phơn ở miền Trung vào mùa hạ.", "d) Gió đất – biển thổi quanh năm một hướng."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: đổi hướng ngày đêm.", "points": 1}, {"type": "short", "level": "VD", "q": "Ban đêm ở ven biển, gió thổi từ đâu ra đâu?", "answer": "Từ đất liền ra biển", "explain": "Ban đêm gió đất thổi từ đất liền ra biển.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Gió khô nóng ở miền Trung Việt Nam vào mùa hạ có tên là gì?", "answer": "Gió phơn", "explain": "Gió phơn Tây Nam (gió Lào).", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Nhân tố nào ảnh hưởng đến lượng mưa?", "options": ["A. Khí áp, gió, dòng biển, địa hình, frông.", "B. Động đất.", "C. Núi lửa.", "D. Thủy triều."], "answer": "A", "explain": "Các nhân tố ảnh hưởng đến mưa: khí áp, gió, dòng biển, địa hình, frông.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nơi nào sau đây mưa nhiều?", "options": ["A. Sườn đón gió ẩm.", "B. Sườn khuất gió.", "C. Vùng áp cao chí tuyến.", "D. Sâu trong lục địa."], "answer": "A", "explain": "Sườn đón gió ẩm mưa nhiều (mưa địa hình).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao sâu trong lục địa (như Trung Á) mưa ít?", "options": ["A. Vì gió ẩm từ biển khó vào sâu, hơi ẩm hao hụt dọc đường.", "B. Vì ở đó lạnh.", "C. Vì không có sông.", "D. Vì ngẫu nhiên."], "answer": "A", "explain": "Càng vào sâu lục địa, gió biển càng mất hơi ẩm nên mưa ít.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vùng nào sau đây mưa ít do dòng biển lạnh?", "options": ["A. Hoang mạc Namib (dòng Benguela).", "B. Xích đạo.", "C. Tây Âu.", "D. Đông Nam Á."], "answer": "A", "explain": "Dòng biển lạnh Benguela làm ít mưa, góp phần tạo hoang mạc Namib.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Miền Trung Việt Nam mưa lớn vào thu đông. Nguyên nhân chính là:", "options": ["A. Đón gió mùa đông bắc ẩm + bão + dải hội tụ.", "B. Gió mùa hạ.", "C. Không có nguyên nhân.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Thu đông, miền Trung đón gió đông bắc qua biển mang ẩm, kết hợp bão và dải hội tụ gây mưa lớn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vùng nằm sau dãy núi cao (sườn khuất gió) nhưng vẫn mưa nhiều. Giải thích có thể là:", "options": ["A. Vùng chịu ảnh hưởng của frông hoặc bão, không chỉ phụ thuộc địa hình.", "B. Địa hình không ảnh hưởng mưa.", "C. Ngẫu nhiên.", "D. Do con người."], "answer": "A", "explain": "Mưa còn do frông, bão, áp thấp — không chỉ do địa hình; sườn khuất gió vẫn mưa nếu có các nhân tố khác.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sườn đón gió mưa nhiều.", "b) Sâu trong lục địa mưa ít.", "c) Dòng biển lạnh làm ít mưa.", "d) Vùng áp cao mưa nhiều."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: vùng áp cao khô, ít mưa.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Miền Trung mưa lớn vào thu đông.", "b) Frông cũng gây mưa.", "c) Mưa chỉ do địa hình.", "d) Gió ẩm từ biển gây mưa."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: mưa do nhiều nhân tố.", "points": 1}, {"type": "short", "level": "VD", "q": "Kể tên 3 loại mưa chính.", "answer": "Mưa đối lưu, mưa địa hình, mưa frông", "explain": "Ba loại: mưa đối lưu, mưa địa hình, mưa frông.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vùng nào mưa nhiều quanh năm nhờ mưa đối lưu?", "answer": "Xích đạo", "explain": "Xích đạo có áp thấp và đối lưu mạnh nên mưa quanh năm.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Yếu tố khí hậu nào được hình thành đầu tiên từ bức xạ Mặt Trời?", "options": ["A. Nhiệt độ.", "B. Gió.", "C. Mưa.", "D. Khí áp."], "answer": "A", "explain": "Bức xạ Mặt Trời tạo ra nhiệt độ; chênh lệch nhiệt sinh ra khí áp, gió; gió mang ẩm gây mưa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mối quan hệ giữa các yếu tố khí hậu là:", "options": ["A. Tác động qua lại lẫn nhau (nhiệt → áp → gió → mưa).", "B. Độc lập nhau.", "C. Chỉ nhiệt độ quan trọng.", "D. Không liên quan."], "answer": "A", "explain": "Các yếu tố khí hậu tác động qua lại: nhiệt chênh lệch sinh áp, áp sinh gió, gió mang ẩm sinh mưa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói 'khí hậu là kết quả tổng hợp của các yếu tố'?", "options": ["A. Vì nhiệt, áp, gió, mưa tác động qua lại tạo nên khí hậu mỗi vùng.", "B. Vì chỉ cần nhiệt độ.", "C. Vì khí hậu ngẫu nhiên.", "D. Vì con người quyết định."], "answer": "A", "explain": "Khí hậu mỗi vùng là kết quả tổng hợp, tương tác của các yếu tố nhiệt độ, khí áp, gió, mưa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việt Nam có khí hậu nhiệt đới gió mùa vì:", "options": ["A. Nằm trong vùng nội chí tuyến, chịu ảnh hưởng gió mùa châu Á.", "B. Ở gần xích đạo duy nhất.", "C. Có nhiều sông.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Việt Nam trong vùng nhiệt đới, chịu gió mùa đông bắc (đông) và tây nam (hạ) nên khí hậu nhiệt đới gió mùa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nhà nông muốn trồng cây cần nhiều nước. Dựa vào kiến thức khí hậu, nên chọn vùng:", "options": ["A. Vùng mưa nhiều (sườn đón gió, ven biển đón gió mùa).", "B. Vùng áp cao chí tuyến.", "C. Sườn khuất gió.", "D. Hoang mạc."], "answer": "A", "explain": "Vùng mưa nhiều đảm bảo nước tưới: sườn đón gió ẩm, ven biển đón gió mùa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Biến đổi khí hậu làm mưa phân bố cực đoan hơn. Giải pháp thích ứng trong nông nghiệp là:", "options": ["A. Làm thủy lợi, chọn giống chịu hạn/ngập, điều chỉnh lịch thời vụ.", "B. Bỏ trồng trọt.", "C. Chỉ trồng một vụ.", "D. Không làm gì."], "answer": "A", "explain": "Thích ứng: thủy lợi điều tiết nước, giống chống chịu, lịch thời vụ linh hoạt.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhiệt độ do bức xạ Mặt Trời.", "b) Các yếu tố khí hậu tác động qua lại.", "c) Việt Nam có khí hậu nhiệt đới gió mùa.", "d) Khí hậu các vùng giống nhau."], "an
