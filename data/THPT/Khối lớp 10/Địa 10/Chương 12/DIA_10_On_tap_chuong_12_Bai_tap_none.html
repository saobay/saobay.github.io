", "q": "Một ngân hàng ra mắt app cá nhân hóa theo từng khách. Đây là:", "options": ["A. Số hóa và cá nhân hóa dịch vụ.", "B. Lạc hậu.", "C. Không cần thiết.", "D. Tốn kém vô ích."], "answer": "A", "explain": "App cá nhân hóa là số hóa dịch vụ ngân hàng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) App ngân hàng tiện cho khách.", "b) Cá nhân hóa tăng hài lòng.", "c) Số hóa chỉ cho người trẻ.", "d) Mọi người cần được hướng dẫn số."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: số hóa phục vụ mọi người, cần hướng dẫn.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Tương lai ngành dịch vụ Việt Nam phụ thuộc vào:", "options": ["A. Số hóa, nhân lực chất lượng, hội nhập, bền vững.", "B. Giữ nguyên.", "C. Đóng cửa.", "D. Không đầu tư."], "answer": "A", "explain": "Cần số hóa, nhân lực, hội nhập, bền vững.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Nguồn nhân lực có trình độ cao đáp ứng dịch vụ hiện đại gọi là nhân lực gì? (3 từ)", "answer": "chất lượng cao", "explain": "Nhân lực chất lượng cao then chốt cho dịch vụ hiện đại.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Việt Nam có thế mạnh dịch vụ nào?", "options": ["A. Du lịch, thương mại.", "B. Luyện kim.", "C. Đóng tàu vũ trụ.", "D. Khai thác dầu khí."], "answer": "A", "explain": "Du lịch, thương mại là thế mạnh dịch vụ Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thương mại điện tử Việt Nam phát triển nhanh nhờ:", "options": ["A. Dân trẻ, smartphone phổ biến.", "B. Không ai dùng mạng.", "C. Hạ tầng kém.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Dân trẻ, smartphone phổ biến thúc đẩy thương mại điện tử.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Ngành kinh tế nào đóng góp trên 40% GDP Việt Nam? (2 từ)", "answer": "dịch vụ", "explain": "Dịch vụ đóng góp lớn vào GDP Việt Nam.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Du lịch Việt Nam thu hút khách quốc tế nhờ:", "options": ["A. Tài nguyên phong phú, ẩm thực, giá hợp lí.", "B. Không có gì.", "C. Giá đắt.", "D. Ít tài nguyên."], "answer": "A", "explain": "Tài nguyên phong phú, ẩm thực ngon, giá hợp lí thu hút khách.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để dịch vụ Việt Nam cạnh tranh, cần:", "options": ["A. Chất lượng, giá hợp lí, đặc sắc.", "B. Giảm chất lượng.", "C. Tăng giá vô lí.", "D. Bắt chước."], "answer": "A", "explain": "Cần chất lượng, giá hợp lí, sản phẩm đặc sắc.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Du lịch là thế mạnh của Việt Nam.", "b) Thương mại điện tử phát triển nhanh.", "c) Dịch vụ đóng góp lớn vào GDP.", "d) Việt Nam không có lợi thế dịch vụ."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: Việt Nam có nhiều lợi thế dịch vụ.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Để quảng bá du lịch Việt Nam, nên dùng:", "options": ["A. Mạng xã hội, lễ hội, xúc tiến quốc tế.", "B. Giữ kín.", "C. Không quảng bá.", "D. Chỉ trong nước."], "answer": "A", "explain": "Cần quảng bá đa kênh, xúc tiến quốc tế.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mạng xã hội quảng bá hiệu quả.", "b) Lễ hội thu hút khách quốc tế.", "c) Không cần quảng bá.", "d) Hình ảnh đẹp tạo ấn tượng."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: quảng bá rất quan trọng.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Chiến lược phát triển dịch vụ Việt Nam cần:", "options": ["A. Hiện đại, số hóa, phát huy lợi thế, hội nhập, bền vững.", "B. Giữ lạc hậu.", "C. Đóng cửa.", "D. Không chiến lược."], "answer": "A", "explain": "Cần hiện đại, số hóa, lợi thế, hội nhập, bền vững.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Việc đưa sản phẩm dịch vụ Việt Nam ra thị trường thế giới gọi là hội nhập gì? (2 từ)", "answer": "quốc tế", "explain": "Hội nhập quốc tế mở rộng thị trường dịch vụ.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Chương 12 có bao nhiêu bài học (không kể thực hành)?", "options": ["A. 5 bài: 33, 34, 35, 36, 37.", "B. 3 bài.", "C. 4 bài.", "D. 6 bài."], "answer": "A", "explain": "Chương 12 có 5 bài: 33-37 (bài 38 thực hành).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài 34 nghiên cứu ngành nào?", "options": ["A. Giao thông vận tải.", "B. Du lịch.", "C. Thương mại.", "D. Viễn thông."], "answer": "A", "explain": "Bài 34: giao thông vận tải.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Hai ngành ở bài 37 đều thuộc nhóm dịch vụ nào? (3 từ)", "answer": "dịch vụ kinh doanh", "explain": "Thương mại và tài chính ngân hàng thuộc dịch vụ kinh doanh.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Mạch kiến thức chương 12 là:", "options": ["A. Tổng quan dịch vụ — từng ngành cụ thể.", "B. Ngẫu nhiên.", "C. Chỉ một ngành.", "D. Không có mạch."], "answer": "A", "explain": "Từ tổng quan (bài 33) tới từng ngành (34-37).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhân tố nào xuyên suốt mọi ngành dịch vụ?", "options": ["A. Kinh tế, dân cư, công nghệ.", "B. Chỉ khoáng sản.", "C. Chỉ khí hậu.", "D. Không có."], "answer": "A", "explain": "Kinh tế, dân cư, công nghệ ảnh hưởng mọi ngành dịch vụ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng kết chương 12):", "statements": ["a) Dịch vụ gồm 3 nhóm chính.", "b) Có 6 loại hình vận tải.", "c) Viễn thông là hạ tầng số.", "d) Du lịch không cần bảo tồn."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: du lịch cần gắn với bảo tồn.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Để học tốt chương 12, cần nắm:", "options": ["A. Vai trò, đặc điểm, loại hình từng ngành và mối liên hệ.", "B. Chỉ tên bài.", "C. Chỉ làm bài tập.", "D. Không cần hệ thống."], "answer": "A", "explain": "Cần hệ thống vai trò, đặc điểm, loại hình, mối liên hệ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ôn tập giúp hệ thống kiến thức.", "b) Làm đề rèn kĩ năng vận dụng.", "c) Chỉ học một bài là đủ.", "d) Liên hệ thực tế giúp hiểu sâu."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: cần học đầy đủ các bài.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Vận dụng tổng hợp: để dịch vụ Việt Nam thành mũi nhọn, cần:", "options": ["A. Hiện đại hóa, số hóa, nhân lực giỏi, hội nhập, bền vững.", "B. Giữ lạc hậu.", "C. Đóng cửa.", "D. Không đầu tư."], "answer": "A", "explain": "Cần hiện đại, số hóa, nhân lực, hội nhập, bền vững.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Ngành được ưu tiên phát triển, dẫn dắt nền kinh tế gọi là ngành mũi gì? (1 từ)", "answer": "nhọn", "explain": "Dịch vụ là ngành kinh tế mũi nhọn.", "points": 0.5}]}]}</script>
