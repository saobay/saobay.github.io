ain": "d) Sai: Việt Nam có tài nguyên du lịch phong phú.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Để quảng bá du lịch Việt Nam ra thế giới, nên:", "options": ["A. Dùng mạng xã hội, lễ hội văn hóa, xúc tiến quốc tế.", "B. Giữ bí mật.", "C. Không quảng bá.", "D. Chỉ trong nước."], "answer": "A", "explain": "Cần quảng bá đa kênh, xúc tiến quốc tế.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mạng xã hội giúp quảng bá du lịch hiệu quả.", "b) Lễ hội văn hóa thu hút khách quốc tế.", "c) Không cần quảng bá cũng đông khách.", "d) Hình ảnh đẹp tạo ấn tượng điểm đến."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: quảng bá rất quan trọng.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Để du lịch Việt Nam cạnh tranh khu vực, cần:", "options": ["A. Sản phẩm đặc sắc, dịch vụ chất lượng, giá hợp lí, bền vững.", "B. Chỉ tăng giá.", "C. Giảm chất lượng.", "D. Bỏ qua môi trường."], "answer": "A", "explain": "Cần đặc sắc, chất lượng, giá hợp lí, bền vững để cạnh tranh.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Việc đưa hình ảnh du lịch Việt Nam ra thế giới gọi là xúc tiến hay quảng bá? (2 từ)", "answer": "xúc tiến", "explain": "Xúc tiến du lịch quốc tế rất quan trọng.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Khách du lịch quốc tế mang lại:", "options": ["A. Ngoại tệ cho đất nước.", "B. Không lợi ích.", "C. Chỉ rắc rối.", "D. Mất tiền."], "answer": "A", "explain": "Khách quốc tế mang ngoại tệ, cải thiện cán cân thanh toán.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mùa du lịch biển ở Việt Nam thường là:", "options": ["A. Mùa hè.", "B. Mùa đông.", "C. Quanh năm như nhau.", "D. Không có mùa."], "answer": "A", "explain": "Du lịch biển sôi động nhất vào mùa hè.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Thời gian trong năm đông khách du lịch gọi là mùa gì? (2 từ)", "answer": "cao điểm", "expla  "Một di tích bị xuống cấp do đông khách. Giải pháp là:", "options": ["A. Hạn chế lượng khách, thu phí tu bổ, tuyên truyền.", "B. Đóng cửa vĩnh viễn.", "C. Mặc kệ.", "D. Phá bỏ xây mới."], "answer": "A", "explain": "Hạn chế khách, thu phí tu bổ, tuyên truyền để bảo tồn.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phí tham quan góp phần tu bổ di tích.", "b) Hạn chế khách giúp bảo vệ di tích.", "c) Càng đông khách càng tốt cho di tích.", "d) Ý thức du khách quan trọng."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: quá tải phá hủy di tích.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Mối quan hệ giữa du lịch và bảo tồn di sản là:", "options": ["A. Hai chiều: du lịch tạo kinh phí bảo tồn; bảo tồn tạo sức hút du lịch.", "B. Một chiều.", "C. Đối lập.", "D. Không liên quan."], "answer": "A", "explain": "Du lịch và bảo tồn tác động qua lại, hỗ trợ nhau.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Việc giữ gìn di sản cho thế hệ sau gọi là bảo gì? (2 từ)", "answer": "bảo tồn", "explain": "Bảo tồn di sản là trách nhiệm chung.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Hướng dẫn viên du lịch có vai trò:", "options": ["A. Giới thiệu, tổ chức, hỗ trợ du khách.", "B. Chỉ đi cùng.", "C. Không cần thiết.", "D. Chỉ bán hàng."], "answer": "A", "explain": "Hướng dẫn viên giới thiệu, tổ chức, hỗ trợ du khách.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khách sạn, nhà nghỉ thuộc dịch vụ:", "options": ["A. Lưu trú.", "B. Vận tải.", "C. Y tế.", "D. Giáo dục."], "answer": "A", "explain": "Khách sạn thuộc dịch vụ lưu trú.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Người dẫn đoàn, thuyết minh tại điểm du lịch gọi là hướng dẫn viên gì? (2 từ)", "answer": "du lịch", "explain": "Hướng dẫn viên du lịch rất quan trọng.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Vì sao hướng dẫn viên giỏi thu hút khách quay lại?", "options": ["A. Vì am hiểu, nhiệt tình, tạo trải nghiệm đáng nhớ.", "B. Vì nói nhiều.", "C. Vì đi nhanh.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Am hiểu, nhiệt tình tạo trải nghiệm đáng nhớ cho khách.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chất lượng lưu trú ảnh hưởng tới:", "options": ["A. Sự hài lòng và quyết định quay lại của du khách.", "B. Không ảnh hưởng.", "C. Chỉ giá tiền.", "D. Không quan trọng."], "answer": "A", "explain": "Lưu trú tốt làm khách hài lòng, muốn quay lại.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hướng dẫn viên cần am hiểu, ngoại ngữ.", "b) Lưu trú tốt tăng sự hài lòng.", "c) Thái độ phục vụ không quan trọng.", "d) Dịch vụ tốt tạo thương hiệu điểm đến."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: thái độ phục vụ rất quan trọng.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Một khách sạn muốn nâng hạng sao. Cần:", "options": ["A. Nâng cơ sở vật chất, đào tạo nhân viên, dịch vụ chuẩn.", "B. Chỉ tăng giá.", "C. Chỉ sơn lại.", "D. Không cần gì."], "answer": "A", "explain": "Cần cơ sở vật chất, nhân viên, dịch vụ đạt chuẩn.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đào tạo nâng chất lượng phục vụ.", "b) Cơ sở vật chất tốt thu hút khách.", "c) Chỉ cần quảng cáo là đủ.", "d) Phản hồi khách giúp cải thiện."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: cần chất lượng thực, không chỉ quảng cáo.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Để nhân lực du lịch Việt Nam đạt chuẩn quốc tế, cần:", "options": ["A. Đào tạo ngoại ngữ, kĩ năng, thái độ chuyên nghiệp.", "B. Không cần đào tạo.", "C. Chỉ cần đông người.", "D. Tự phát."], "answer": "A", "explain": "Cần ngoại ngữ, kĩ năng, thái độ chuyên nghiệp.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Người lao động trong ngành du lịch gọi là nhân lực gì? (2 từ)", "answer": "du lịch", "explain": "Nhân lực du lịch cần được đào tạo bài bản.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Lễ hội ở Việt Nam thu hút khách vì:", "options": ["A. Độc đáo, mang bản sắc văn hóa.", "B. Giống nhau mọi nơi.", "C. Không đặc sắc.", "D. Ít lễ hội."], "answer": "A", "explain": "Lễ hội độc đáo, bản sắc thu hút du khách.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Làng nghề truyền thống gắn với du lịch qua:", "options": ["A. Tham quan, trải nghiệm, mua sản phẩm.", "B. Chỉ sản xuất.", "C. Đóng cửa.", "D. Không gắn."], "answer": "A", "explain": "Làng nghề gắn du lịch qua tham quan, trải nghiệm, mua sắm.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Nét riêng độc đáo của một vùng, dân tộc gọi là bản gì? (2 từ)", "answer": "bản sắc", "explain": "Bản sắc văn hóa là sức hút du lịch.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Thương mại hóa quá mức lễ hội gây:", "options": ["A. Mất bản sắc, phản cảm.", "B. Giữ nguyên vẹn.", "C. Không ảnh hưởng.", "D. Chỉ lợi ích."], "answer": "A", "explain": "Thương mại hóa quá mức làm mất bản sắc lễ hội.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để lễ hội vừa thu hút khách vừa giữ bản sắc, cần:", "options": ["A. Tổ chức bài bản, tôn trọng truyền thống.", "B. Biến tấu tùy tiện.", "C. Chỉ vì lợi nhuận.", "D. Bỏ lễ hội."], "answer": "A", "explain": "Cần tổ chức bài bản, tôn trọng giá trị truyền thống.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lễ hội là tài nguyên nhân văn quý.", "b) Cần giữ bản sắc khi khai thác lễ hội.", "c) Thương mại hóa quá mức có hại.", "d) Mọi lễ hội đều nên biến tấu hiện đại."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: cần tôn trọng giá trị gốc.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Một lễ hội bị phản ánh chặt chém, mất vệ sinh. Cần:", "options": ["A. Chấn chỉnh quản lí, giá cả, vệ sinh.", "B. Bỏ lễ hội.", "C. Mặc kệ.", "D. Tăng giá thêm."], "answer": "A", "explain": "Cần chấn chỉnh quản lí để giữ uy tín lễ hội.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quản lí tốt nâng uy tín lễ hội.", "b) Giá cả hợp lí giữ chân khách.", "c) Vệ sinh kém làm khách e ngại.", "d) Chặt chém không ảnh hưởng gì."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: chặt chém làm mất uy tín điểm đến.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Phát huy lễ hội trong du lịch cần hài hòa:", "options": ["A. Bảo tồn giá trị gốc và đáp ứng nhu cầu du khách.", "B. Chỉ bảo tồn.", "C. Chỉ kinh doanh.", "D. Bỏ truyền thống."], "answer": "A", "explain": "Cần hài hòa bảo tồn và phát triển.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Giá trị cốt lõi, nguyên bản của di sản, lễ hội gọi là giá trị gì? (2 từ)", "answer": "truyền thống", "explain": "Cần tôn trọng giá trị truyền thống.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Nội dung nào không thuộc bài 36?", "options": ["A. Bưu chính viễn thông.", "B. Vai trò du lịch.", "C. Tài nguyên du lịch.", "D. Loại hình du lịch."], "answer": "A", "explain": "Bưu chính viễn thông thuộc bài 35.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét theo cơ cấu ngành dịch vụ, du lịch được xếp vào nhóm nào?", "options": ["A. Nhóm dịch vụ tiêu dùng.", "B. Nhóm dịch vụ kinh doanh.", "C. Nhóm dịch vụ công.", "D. Nhóm công nghiệp chế biến."], "answer": "A", "explain": "Du lịch phục vụ nhu cầu đời sống nên thuộc dịch vụ tiêu dùng.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Bài 36 nghiên cứu ngành gì? (2 từ)", "answer": "du lịch", "explain": "Bài 36: Địa lí ngành du lịch.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa du lịch và các ngành dịch vụ khác là:", "options": ["A. Du lịch kéo theo vận tải, lưu trú, thương mại cùng phát triển.", "B. Độc lập.", "C. Kìm hãm nhau.", "D. Không liên quan."], "answer": "A", "explain": "Du lịch có tác động lan tỏa tới nhiều ngành.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao du lịch được coi là ngành không khói?", "options": ["A. Vì ít gây ô nhiễm so với công nghiệp nặng.", "B. Vì không có khói.", "C. Vì không cần năng lượng.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Du lịch ít ô nhiễm nên được gọi là ngành không khói.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (ôn tập bài 36):", "statements": ["a) Du lịch tạo việc làm, ngoại tệ.", "b) Tài nguyên gồm tự nhiên và nhân văn.", "c) Cần phát triển bền vững.", "d) Du lịch không cần hạ tầng."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: du lịch rất cần hạ tầng.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Địa phương có biển đẹp, di tích, ẩm thực ngon. Nên phát triển:", "options": ["A. Du lịch tổng hợp: biển, văn hóa, ẩm thực.", "B. Chỉ một loại.", "C. Không phát triển.", "D. Chỉ công nghiệp."], "answer": "A", "explain": "Kết hợp đa dạng tài nguyên thành sản phẩm tổng hợp.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kết hợp nhiều tài nguyên tạo sản phẩm hấp dẫn.", "b) Mỗi địa phương nên có sản phẩm đặc trưng.", "c) Bắt chước nơi khác là tốt nhất.", "d) Sáng tạo sản phẩm mới thu hút khách."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: cần sản phẩm đặc trưng riêng.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Thông điệp chính của bài 36 là:", "options": ["A. Phát triển du lịch gắn với bảo tồn, bền vững, văn minh.", "B. Khai thác tối đa.", "C. Chỉ chạy theo số lượng.", "D. Bỏ qua văn hóa."], "answer": "A", "explain": "Thông điệp: du lịch bền vững, văn minh, gắn bảo tồn.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Cách ứng xử đẹp, có ý thức của du khách gọi là du lịch gì? (2 từ)", "answer": "văn minh", "explain": "Du lịch văn minh là nét đẹp cần lan tỏa.", "points": 0.5}]}]}</script>
