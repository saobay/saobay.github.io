u tuyến đường.", "c) Giao thông xanh chỉ là khẩu hiệu.", "d) Vé điện tử tiện lợi cho hành khách."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: giao thông xanh là xu hướng thực tế với xe điện, nhiên liệu sạch.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Để giảm ùn tắc đô thị, giải pháp tổng hợp là:", "options": ["A. Phát triển giao thông công cộng, hạn chế xe cá nhân, quy hoạch đồng bộ.", "B. Mở thêm đường cho xe cá nhân.", "C. Cấm mọi phương tiện.", "D. Không làm gì."], "answer": "A", "explain": "Giảm ùn tắc cần giao thông công cộng, hạn chế xe cá nhân, quy hoạch đồng bộ.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Loại hình giao thông phục vụ số đông, giá rẻ trong đô thị gọi là giao thông gì? (2 từ)", "answer": "công cộng", "explain": "Giao thông công cộng giúp giảm ùn tắc đô thị.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Bài 34 nghiên cứu về ngành:", "options": ["A. Giao thông vận tải.", "B. Bưu chính viễn thông.", "C. Du lịch.", "D. Thương mại."], "answer": "A", "explain": "Bài 34: Địa lí ngành giao thông vận tải.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Có mấy loại hình giao thông vận tải chính?", "options": ["A. 6: bộ, sắt, sông, biển, hàng không, ống.", "B. 3.", "C. 4.", "D. 8."], "answer": "A", "explain": "Có 6 loại hình chính.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Bài 34 thuộc chương nào? (2 từ)", "answer": "chương 12", "explain": "Bài 34 thuộc Chương 12: Địa lí ngành dịch vụ.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Loại hình nào sau đây vừa chở người vừa chở hàng phổ biến?", "options": ["A. Đường bộ, đường sắt, hàng không.", "B. Đường ống.", "C. Chỉ đường ống.", "D. Không loại nào."], "answer": "A", "explain": "Đường bộ, sắt, hàng không đều chở người và hàng; đường ống chỉ chở dầu khí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đường ống khác các loại hình khác ở:", "options": ["A. Chỉ chuyên chở dầu, khí, vận chuyển liên tục.", "B. Chở được mọi thứ.", "C. Chở khách.", "D. Không khác."], "answer": "A", "explain": "Đường ống chuyên chở dầu khí, vận chuyển liên tục, an toàn.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng kết bài 34):", "statements": ["a) Giao thông nối sản xuất với tiêu dùng.", "b) Có 6 loại hình vận tải chính.", "c) Hàng không nhanh nhất nhưng đắt.", "d) Đường bộ chở được khối lượng lớn nhất."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: đường biển chở khối lượng lớn nhất.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Sắp xếp đúng tốc độ từ nhanh tới chậm: hàng không, đường bộ, đường biển.", "options": ["A. Hàng không, đường bộ, đường biển.", "B. Đường biển, đường bộ, hàng không.", "C. Đường bộ, hàng không, đường biển.", "D. Đường biển, hàng không, đường bộ."], "answer": "A", "explain": "Thứ tự tốc độ: hàng không nhanh nhất, tới đường bộ, chậm nhất là đường biển.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mỗi loại hình có ưu, nhược điểm riêng.", "b) Nên kết hợp nhiều loại hình (đa phương thức).", "c) Chỉ nên phát triển một loại hình duy nhất.", "d) Lựa chọn loại hình tùy hàng hóa, cự li."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: cần phát triển đồng bộ nhiều loại hình.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Phát triển giao thông bền vững cần:", "options": ["A. Hiện đại, xanh, an toàn, kết nối đồng bộ các loại hình.", "B. Chỉ mở rộng đường bộ.", "C. Bỏ qua môi trường.", "D. Không quy hoạch."], "answer": "A", "explain": "Bền vững: hiện đại, xanh, an toàn, kết nối đồng bộ.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Cụm từ nào chỉ mạng lưới đường, cầu, cảng, sân bay phục vụ đi lại, vận chuyển? (2 từ)", "answer": "hạ tầng giao thông", "explain": "Hạ tầng giao thông là nền tảng phát triển vận tải.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Phương tiện nào thuộc đường bộ?", "options": ["A. Ô tô, xe máy.", "B. Tàu thủy.", "C. Máy bay.", "D. Tàu hỏa."], "answer": "A", "explain": "Ô tô, xe máy thuộc đường bộ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cảng biển phục vụ loại hình nào?", "options": ["A. Đường biển.", "B. Đường bộ.", "C. Đường sắt.", "D. Đường ống."], "answer": "A", "explain": "Cảng biển phục vụ đường biển.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Nơi máy bay cất, hạ cánh gọi là gì? (2 từ)", "answer": "sân bay", "explain": "Sân bay phục vụ đường hàng không.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Vì sao Việt Nam có lợi thế phát triển đường biển?", "options": ["A. Vì bờ biển dài, nhiều cảng nước sâu.", "B. Vì không có biển.", "C. Vì biển cạn.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Bờ biển dài, nhiều cảng là lợi thế phát triển đường biển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đường sông ở Đồng bằng sông Cửu Long phát triển vì:", "options": ["A. Sông ngòi chằng chịt, địa hình bằng phẳng.", "B. Núi cao.", "C. Không có sông.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Sông ngòi chằng chịt, bằng phẳng thuận lợi đường sông.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Việt Nam có bờ biển dài thuận lợi đường biển.", "b) Đồng bằng sông Cửu Long thuận lợi đường sông.", "c) Mọi vùng đều thuận lợi mọi loại hình.", "d) Địa hình ảnh hưởng tới phát triển giao thông."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: mỗi vùng phù hợp loại hình khác nhau tùy địa hình.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Vùng núi cao, địa hình hiểm trở nên ưu tiên loại hình nào?", "options": ["A. Đường bộ, hàng không.", "B. Đường biển.", "C. Đường sông lớn.", "D. Đường ống dầu."], "answer": "A", "explain": "Vùng núi phù hợp đường bộ linh hoạt và hàng không vượt địa hình.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phát triển giao thông cần phù hợp địa hình.", "b) Vùng núi khó phát triển đường sông, biển.", "c) Mọi nơi đều xây được sân bay quốc tế.", "d) Cầu, hầm giúp vượt địa hình hiểm trở."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: sân bay quốc tế cần nhiều điều kiện.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Để kết nối vùng núi với đồng bằng hiệu quả, cần:", "options": ["A. Đầu tư đường bộ, cầu hầm, kết hợp đa phương thức.", "B. Chỉ chờ đường tự nhiên.", "C. Không đầu tư.", "D. Di dân hết."], "answer": "A", "explain": "Cần đầu tư đường bộ, cầu hầm và kết hợp đa phương thức.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Công trình vượt sông, vượt thung lũng cho giao thông gọi là gì? (1 từ)", "answer": "cầu", "explain": "Cầu giúp giao thông vượt sông, thung lũng.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Loại hình nào tốn nhiên liệu, dễ ùn tắc nhất ở đô thị?", "options": ["A. Đường bộ.", "B. Đường sắt.", "C. Đường biển.", "D. Đường ống."], "answer": "A", "explain": "Đường bộ tốn nhiên liệu, dễ ùn tắc ở đô thị.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "An toàn giao thông phụ thuộc vào:", "options": ["A. Ý thức người tham gia, hạ tầng, phương tiện.", "B. Màu xe.", "C. Giá xe.", "D. Không phụ thuộc gì."], "answer": "A", "explain": "An toàn phụ thuộc ý thức, hạ tầng, phương tiện.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Tình trạng xe cộ đông đúc, di chuyển chậm ở đô thị gọi là gì? (2 từ)", "answer": "ùn tắc", "explain": "Ùn tắc giao thông là vấn đề đô thị.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Vì sao đường bộ vừa phổ biến nhất vừa gây nhiều vấn đề nhất?", "options": ["A. Vì ai cũng dùng nên đông, tốn nhiên liệu, ô nhiễm, tai nạn.", "B. Vì ít người dùng.", "C. Vì không tốn nhiên liệu.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Phổ biến nên đông đúc, gây ùn tắc, ô nhiễm, tai nạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biện pháp nào giảm tai nạn giao thông đường bộ?", "options": ["A. Nâng ý thức, hoàn thiện hạ tầng, xử lí vi phạm.", "B. Tăng tốc độ.", "C. Bỏ đèn tín hiệu.", "D. Không cần làm gì."], "answer": "A", "explain": "Cần ý thức, hạ tầng tốt, xử lí vi phạm để giảm tai nạn.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đường bộ phổ biến nhất trong các loại hình.", "b) Ùn tắc là vấn đề của đô thị lớn.", "c) Ý thức người tham gia quyết định an toàn.", "d) Đường bộ không gây ô nhiễm."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: đường bộ gây ô nhiễm không khí, tiếng ồn.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Học sinh đi học bằng xe đạp điện cần:", "options": ["A. Đội mũ bảo hiểm, đi đúng làn, quan sát.", "B. Đi nhanh, lạng lách.", "C. Không cần mũ.", "D. Đi ngược chiều."], "answer": "A", "explain": "An toàn: mũ bảo hiểm, đúng làn, quan sát.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mũ bảo hiểm bảo vệ khi tai nạn.", "b) Đi đúng làn giảm va chạm.", "c) Phóng nhanh an toàn hơn.", "d) Quan sát giúp phòng tránh nguy hiểm."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: phóng nhanh rất nguy hiểm.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Văn hóa giao thông thể hiện qua:", "options": ["A. Ý thức chấp hành, nhường nhịn, tôn trọng người khác.", "B. Đi nhanh nhất.", "C. Bấm còi liên tục.", "D. Vượt đèn đỏ."], "answer": "A", "explain": "Văn hóa giao thông là ý thức, nhường nhịn, tôn trọng.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Cụm từ nào chỉ nếp ứng xử đẹp khi tham gia giao thông? (3 từ)", "answer": "văn hóa giao thông", "explain": "Văn hóa giao thông cần được xây dựng.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Logistics trong giao thông là:", "options": ["A. Tổ chức, quản lí chuỗi vận chuyển, kho bãi.", "B. Chỉ lái xe.", "C. Chỉ bốc xếp.", "D. Không liên quan."], "answer": "A", "explain": "Logistics tổ chức, quản lí chuỗi vận chuyển, kho bãi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kho bãi trong vận tải có tác dụng:", "options": ["A. Lưu giữ, phân phối hàng hóa.", "B. Chỉ để xe.", "C. Không tác dụng.", "D. Chỉ trang trí."], "answer": "A", "explain": "Kho bãi lưu giữ, phân phối hàng hóa.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Hoạt động đưa hàng từ kho tới tay khách hàng gọi là phân gì? (2 từ)", "answer": "phân phối", "explain": "Phân phối đưa hàng tới người tiêu dùng.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Vì sao logistics quan trọng với thương mại điện tử?", "options": ["A. Vì quyết định tốc độ, chi phí giao hàng tới khách.", "B. Vì không cần giao hàng.", "C. Vì khách tự lấy.", "D. Không quan trọng."], "answer": "A", "explain": "Logistics quyết định tốc độ, chi phí giao hàng — then chốt của thương mại điện tử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cảng thông minh khác cảng truyền thống ở:", "options": ["A. Tự động hóa, số hóa quản lí, nhanh, chính xác.", "B. Lớn hơn.", "C. Nhiều công nhân hơn.", "D. Không khác."], "answer": "A", "explain": "Cảng thông minh tự động hóa, số hóa nên nhanh, chính xác.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Logistics gồm vận chuyển, kho bãi, phân phối.", "b) Thương mại điện tử cần logistics tốt.", "c) Kho bãi không cần thiết.", "d) Số hóa giúp logistics hiệu quả."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: kho bãi rất cần thiết cho lưu giữ, phân phối.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Một shop online giao hàng chậm, hay thất lạc. Nguyên nhân likely là:", "options": ["A. Logistics yếu: kho bãi, vận chuyển kém.", "B. Hàng xấu.", "C. Giá cao.", "D. Không quảng cáo."], "answer": "A", "explain": "Giao chậm, thất lạc thường do logistics yếu.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giao hàng nhanh là lợi thế cạnh tranh.", "b) Theo dõi đơn hàng giúp khách yên tâm.", "c) Logistics không ảnh hưởng trải nghiệm khách.", "d) Kho gần khách giúp giao nhanh."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: logistics ảnh hưởng trực tiếp trải nghiệm khách hàng.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Để logistics Việt Nam cạnh tranh quốc tế, cần:", "options": ["A. Hiện đại hóa cảng, kho, số hóa, giảm chi phí.", "B. Giữ thủ công.", "C. Tăng chi phí.", "D. Không đầu tư."], "answer": "A", "explain": "Cần hiện đại hóa, số hóa, giảm chi phí logistics.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Tổng chi phí vận chuyển, kho bãi, phân phối gọi là chi phí gì? (2 từ)", "answer": "logistics", "explain": "Chi phí logistics ảnh hưởng giá thành hàng hóa.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Tuyến đường sắt Bắc — Nam của Việt Nam dài khoảng:", "options": ["A. Trên 1700 km.", "B. 100 km.", "C. 500 km.", "D. 10000 km."], "answer": "A", "explain": "Đường sắt Bắc — Nam dài trên 1700km (số liệu ngành đường sắt).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sân bay quốc tế lớn nhất Việt Nam hiện nay là:", "options": ["A. Tân Sơn Nhất.", "B. Vinh.", "C. Pleiku.", "D. Côn Đảo."], "answer": "A", "explain": "Tân Sơn Nhất là sân bay quốc tế lớn nhất Việt Nam hiện nay.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Cảng biển lớn nhất Việt Nam hiện nay là cảng nào? (2 từ)", "answer": "Cát Lái", "explain": "Cảng Cát Lái (TP. Hồ Chí Minh) là cảng container lớn nhất Việt Nam.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Vì sao đường sắt Bắc — Nam quan trọng với Việt Nam?", "options": ["A. Vì nối hai miền kinh tế lớn, chở khối lượng lớn.", "B. Vì ngắn.", "C. Vì nhanh nhất.", "D. Không quan trọng."], "answer": "A", "explain": "Đường sắt Bắc — Nam nối hai đầu kinh tế, chở khối lượng lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hệ thống cảng biển giúp Việt Nam:", "options": ["A. Giao thương quốc tế, xuất nhập khẩu thuận lợi.", "B. Chỉ đánh cá.", "C. Không tác dụng.", "D. Chỉ du lịch."], "answer": "A", "explain": "Cảng biển là cửa ngõ xuất nhập khẩu, giao thương quốc tế.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đường sắt Bắc — Nam nối hai miền đất nước.", "b) Cảng biển thúc đẩy xuất nhập khẩu.", "c) Sân bay kết nối quốc tế nhanh nhất.", "d) Việt Nam không cần phát triển giao thông."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: giao thông là mạch máu kinh tế, cần phát triển.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Để giảm tải cho đường bộ Bắc — Nam, cần:", "options": ["A. Nâng cấp đường sắt, phát triển đường sắt tốc độ cao, đường biển ven bờ.", "B. Cấm xe tải.", "C. Không làm gì.", "D. Chỉ mở thêm đường bộ."], "answer": "A", "explain": "Cần đa dạng loại hình: đường sắt, sắt tốc độ cao, biển ven bờ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đa dạng loại hình giúp giảm tải đường bộ.", "b) Đường sắt tốc độ cao là xu hướng.", "c) Chỉ cần đường bộ là đủ.", "d) Kết nối đồng bộ nâng hiệu quả."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: cần kết hợp nhiều loại hình.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Chiến lược phát triển giao thông Việt Nam cần ưu tiên:", "options": ["A. Đồng bộ, hiện đại, xanh, kết nối vùng và quốc tế.", "B. Chỉ đường bộ.", "C. Bỏ đường sắt.", "D. Không quy hoạch."], "answer": "A", "explain": "Cần đồng bộ, hiện đại, xanh, kết nối vùng và quốc tế.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Việc đầu tư có trọng tâm, trọng điểm vào công trình then chốt gọi là đầu tư gì? (2 từ)", "answer": "trọng điểm", "explain": "Đầu tư trọng điểm vào công trình giao thông then chốt.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Giao thông vận tải thuộc nhóm dịch vụ nào?", "options": ["A. Dịch vụ kinh doanh.", "B. Dịch vụ tiêu dùng.", "C. Dịch vụ công.", "D. Công nghiệp."], "answer": "A", "explain": "Giao thông vận tải thuộc dịch vụ kinh doanh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Loại hình nào không chở hành khách?", "options": ["A. Đường ống.", "B. Đường bộ.", "C. Đường sắt.", "D. Hàng không."], "answer": "A", "explain": "Đường ống chỉ chở dầu khí, không chở khách.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Bài 34 nghiên cứu ngành giao thông gì? (2 từ)", "answer": "vận tải", "explain": "Bài 34: Địa lí ngành giao thông vận tải.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa giao thông và các ngành dịch vụ khác là:", "options": ["A. Giao thông là nền tảng để thương mại, du lịch phát triển.", "B. Không liên quan.", "C. Kìm hãm nhau.", "D. Đối lập."], "answer": "A", "explain": "Giao thông là nền tảng cho thương mại, du lịch phát triển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Du lịch phát triển cần giao thông vì:", "options": ["A. Du khách cần di chuyển tới điểm đến.", "B. Không cần di chuyển.", "C. Du lịch tại chỗ.", "D. Không liên quan."], "answer": "A", "explain": "Du lịch gắn với di chuyển nên cần giao thông thuận lợi.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (ôn tập bài 34):", "statements": ["a) Giao thông là mạch máu của nền kinh tế.", "b) Mỗi loại hình có ưu, nhược điểm riêng.", "c) Xu hướng là hiện đại, xanh, số hóa.", "d) Chỉ cần một loại hình là đủ."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: cần phát triển đồng bộ nhiều loại hình.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Một điểm du lịch đẹp nhưng đường xấu, ít khách. Giải pháp là:", "options": ["A. Đầu tư giao thông kết nối để thu hút du khách.", "B. Đóng cửa điểm du lịch.", "C. Tăng giá vé.", "D. Không làm gì."], "answer": "A", "explain": "Giao thông là điều kiện để du lịch phát triển.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giao thông tốt thu hút du lịch.", "b) Thương mại cần vận chuyển hàng hóa.", "c) Dịch vụ phát triển độc lập với giao thông.", "d) Kết nối vùng cần giao thông đồng bộ."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: dịch vụ gắn chặt với giao thông.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Tổng hợp: vai trò của giao thông vận tải trong phát triển bền vững là:", "options": ["A. Kết nối kinh tế — xã hội theo hướng xanh, an toàn, hiệu quả.", "B. Chỉ tăng trưởng.", "C. Bỏ qua môi trường.", "D. Không vai trò."], "answer": "A", "explain": "Giao thông bền vững: kết nối, xanh, an toàn, hiệu quả.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Cụm từ nào chỉ sự gắn kết chặt chẽ giữa các vùng, miền nhờ giao thông? (2 từ)", "answer": "kết nối vùng", "explain": "Giao thông tạo kết nối vùng, thúc đẩy phát triển.", "points": 0.5}]}]}</script>
