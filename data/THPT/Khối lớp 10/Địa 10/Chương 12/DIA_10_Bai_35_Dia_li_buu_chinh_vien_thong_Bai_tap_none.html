ảo."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: tin nhắn lạ cần cảnh giác, xác minh.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Để an toàn trên không gian mạng, học sinh cần:", "options": ["A. Kĩ năng số, cảnh giác, bảo vệ thông tin cá nhân.", "B. Tin mọi thứ trên mạng.", "C. Chia sẻ mọi thông tin.", "D. Không cần học."], "answer": "A", "explain": "Cần kĩ năng số, cảnh giác, bảo vệ thông tin cá nhân.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Hành vi lừa đảo chiếm đoạt tài sản qua mạng gọi là lừa đảo gì? (2 từ)", "answer": "trực tuyến", "explain": "Cần cảnh giác với lừa đảo trực tuyến.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Nhà mạng viễn thông ở Việt Nam gồm:", "options": ["A. Viettel, VNPT, MobiFone...", "B. Chỉ một nhà mạng.", "C. Không có nhà mạng.", "D. Chỉ nước ngoài."], "answer": "A", "explain": "Việt Nam có nhiều nhà mạng: Viettel, VNPT, MobiFone...", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bưu điện Việt Nam (Vietnam Post) cung cấp:", "options": ["A. Chuyển phát, bưu chính.", "B. Điện thoại.", "C. Internet.", "D. Truyền hình."], "answer": "A", "explain": "Vietnam Post cung cấp dịch vụ bưu chính, chuyển phát.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Tổng công ty bưu chính lớn của Việt Nam viết tắt là gì? (2 từ)", "answer": "Vietnam Post", "explain": "Vietnam Post là bưu chính Việt Nam.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Cạnh tranh giữa các nhà mạng mang lại lợi ích:", "options": ["A. Giá rẻ hơn, chất lượng tốt hơn cho người dùng.", "B. Giá đắt hơn.", "C. Chất lượng kém.", "D. Không lợi ích."], "answer": "A", "explain": "Cạnh tranh giúp giá tốt hơn, chất lượng cao hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Viettel vươn ra nước ngoài thể hiện:", "options": ["A. Hội nhập quốc tế của viễn thông Việt Nam.", "B. Đóng cửa.", "C. Chỉ trong nước.", "D. Không phát triển."], "answer": "A", "explain": "Viettel đầu tư n ptions": ["A. Số hóa, hội tụ.", "B. Quay lại thủ công.", "C. Bỏ công nghệ.", "D. Giảm dịch vụ."], "answer": "A", "explain": "Xu hướng: số hóa, hội tụ.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Bài 35 nghiên cứu ngành bưu chính và gì? (2 từ)", "answer": "viễn thông", "explain": "Bài 35: bưu chính viễn thông.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa viễn thông và các ngành dịch vụ khác là:", "options": ["A. Viễn thông là hạ tầng cho thương mại, tài chính, du lịch số.", "B. Không liên quan.", "C. Kìm hãm nhau.", "D. Đối lập."], "answer": "A", "explain": "Viễn thông là hạ tầng số cho mọi ngành dịch vụ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thương mại điện tử cần cả bưu chính và viễn thông vì:", "options": ["A. Viễn thông đặt hàng, thanh toán; bưu chính giao hàng.", "B. Chỉ cần một.", "C. Không cần cả hai.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Đặt hàng, thanh toán qua viễn thông; giao hàng qua bưu chính.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (ôn tập bài 35):", "statements": ["a) Bưu chính viễn thông truyền tin nhanh chóng.", "b) Viễn thông là hạ tầng của kinh tế số.", "c) Xu hướng là số hóa, hội tụ.", "d) Ngành này không cần an toàn thông tin."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: an toàn thông tin rất quan trọng.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Một cửa hàng vừa bán online vừa giao tận nơi. Cần kết hợp:", "options": ["A. Website, thanh toán số (viễn thông) và giao hàng (bưu chính).", "B. Chỉ website.", "C. Chỉ giao hàng.", "D. Không cần gì."], "answer": "A", "explain": "Kết hợp viễn thông (bán, thanh toán) và bưu chính (giao hàng).", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kinh tế số dựa trên hạ tầng viễn thông.", "b) Bưu chính giao hàng cho thương mại điện tử.", "c) Hai lĩnh vực thúc đẩy nhau.", "d) Chỉ cần một
