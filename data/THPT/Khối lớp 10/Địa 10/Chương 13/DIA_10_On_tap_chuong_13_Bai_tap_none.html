iến lược tăng trưởng xanh của Việt Nam.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Nông nghiệp xanh ở Việt Nam là:", "options": ["A. Canh tác bền vững, ít hóa chất.", "B. Dùng nhiều hóa chất.", "C. Phá rừng.", "D. Không cần thiết."], "answer": "A", "explain": "Nông nghiệp xanh bền vững, ít hóa chất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Du lịch bền vững ở Việt Nam cần:", "options": ["A. Bảo vệ tài nguyên, văn minh.", "B. Khai thác tối đa.", "C. Xả rác.", "D. Chặt chém."], "answer": "A", "explain": "Du lịch bền vững cần bảo vệ tài nguyên, văn minh.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Việt Nam có chiến lược tăng trưởng xanh.", "b) Cam kết trung hòa các-bon 2050.", "c) Cần năng lượng tái tạo.", "d) Không cần hành động."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: cần hành động quyết liệt.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Học sinh góp phần vào mục tiêu 2050 bằng:", "options": ["A. Tiết kiệm năng lượng, trồng cây.", "B. Lãng phí.", "C. Xả rác.", "D. Không quan tâm."], "answer": "A", "explain": "Tiết kiệm, trồng cây góp phần giảm phát thải.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mỗi người góp phần vào mục tiêu chung.", "b) Tiết kiệm điện giảm phát thải.", "c) Trồng cây tăng hấp thụ.", "d) Học sinh không liên quan."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: ai cũng góp phần.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Thách thức lớn nhất của Việt Nam là:", "options": ["A. Vừa tăng trưởng vừa chuyển đổi xanh công bằng.", "B. Không thách thức.", "C. Quá dễ.", "D. Không cần chuyển đổi."], "answer": "A", "explain": "Cần vừa tăng trưởng vừa chuyển đổi xanh, công bằng.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Chuyển đổi đảm bảo mọi người cùng hưởng lợi gọi là chuyển đổi gì? (2 từ)", "answer": "công bằng", "explain": "Chuyển đổi công bằng, không ai bị bỏ lại.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Chương 13 có mấy bài học?", "options": ["A. 2 bài: 39, 40.", "B. 3 bài.", "C. 4 bài.", "D. 5 bài."], "answer": "A", "explain": "Chương 13 có 2 bài: 39, 40.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài 39 nghiên cứu về:", "options": ["A. Môi trường và tài nguyên.", "B. Tăng trưởng xanh.", "C. Công nghiệp.", "D. Du lịch."], "answer": "A", "explain": "Bài 39: Môi trường và tài nguyên thiên nhiên.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Bài cuối cùng của chương 13 là bài số mấy? (1 từ)", "answer": "40", "explain": "Bài 40 là bài cuối của chương 13 và của SGK Địa lí 10.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Mạch kiến thức chương 13 là:", "options": ["A. Môi trường, tài nguyên, vấn đề — hướng phát triển.", "B. Ngẫu nhiên.", "C. Chỉ môi trường.", "D. Chỉ kinh tế."], "answer": "A", "explain": "Từ thực trạng tới hướng phát triển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bài 39 và 40 liên quan vì:", "options": ["A. Hiểu vấn đề (39) để tìm hướng đi (40).", "B. Không liên quan.", "C. Trùng lặp.", "D. Đối lập."], "answer": "A", "explain": "Hiểu vấn đề môi trường để định hướng phát triển.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chương 13 có 2 bài.", "b) Bài 39 về môi trường, tài nguyên.", "c) Bài 40 về bền vững, tăng trưởng xanh.", "d) Hai bài không liên quan."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: hai bài liên quan chặt chẽ.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Để học tốt chương 13, cần:", "options": ["A. Nắm khái niệm, vấn đề, hướng phát triển, liên hệ thực tế.", "B. Học vẹt.", "C. Chỉ làm bài tập.", "D. Không cần hệ thống."], "answer": "A", "explain": "Cần hệ thống và liên hệ thực tế.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ôn tập giúp hệ thống kiến thức.", "b) Liên hệ thực tế giúp hiểu sâu.", "c) Chỉ học một bài là đủ.", "d) Làm đề rèn kĩ năng."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: cần học cả hai bài.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Giá trị lớn nhất của chương 13 với học sinh là:", "options": ["A. Hình thành ý thức, hành động vì tương lai bền vững.", "B. Chỉ để thi.", "C. Không giá trị.", "D. Chỉ kiến thức."], "answer": "A", "explain": "Giá trị: ý thức và hành động vì tương lai.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Thế hệ con cháu mai sau gọi là thế hệ gì? (2 từ)", "answer": "tương lai", "explain": "Phát triển vì thế hệ tương lai.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Thông điệp chung của chương 13 là:", "options": ["A. Bảo vệ môi trường, phát triển bền vững, xanh.", "B. Khai thác tối đa.", "C. Tăng trưởng bằng mọi giá.", "D. Bỏ qua tương lai."], "answer": "A", "explain": "Thông điệp: bảo vệ môi trường, bền vững, xanh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hành động nào sau đây là xanh?", "options": ["A. Tiết kiệm điện, phân loại rác.", "B. Xả rác.", "C. Lãng phí nước.", "D. Phá cây."], "answer": "A", "explain": "Tiết kiệm, phân loại rác là hành động xanh.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Lối sống thân thiện với môi trường gọi là lối sống gì? (1 từ)", "answer": "xanh", "explain": "Lối sống xanh cần lan tỏa.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Vì sao mỗi người đều quan trọng với bền vững?", "options": ["A. Vì hành động nhỏ của nhiều người tạo thay đổi lớn.", "B. Vì một người không ảnh hưởng.", "C. Vì chỉ nhà nước quyết định.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Nhiều hành động nhỏ tạo thay đổi lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tương lai bền vững phụ thuộc vào:", "options": ["A. Hành động hôm nay của chúng ta.", "B. Chờ đợi.", "C. May rủi.", "D. Không ai."], "answer": "A", "explain": "Tương lai phụ thuộc hành động hôm nay.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng kết chương 13):", "statements": ["a) Cần bảo vệ môi trường.", "b) Phát triển phải bền vững.", "c) Tăng trưởng cần xanh.", "d) Không cần hành động gì."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: cần hành động ngay.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Lớp em muốn xây dựng lớp học xanh. Nên:", "options": ["A. Tiết kiệm điện nước, cây xanh, phân loại rác.", "B. Xả rác.", "C. Lãng phí.", "D. Không quan tâm."], "answer": "A", "explain": "Tiết kiệm, cây xanh, phân loại rác là lớp học xanh.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lớp học xanh từ hành động nhỏ.", "b) Tắt điện khi ra về.", "c) Trồng cây trong lớp.", "d) Xanh chỉ là khẩu hiệu."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: xanh là hành động thực tế.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Ước mơ về tương lai bền vững thành hiện thực khi:", "options": ["A. Mỗi người hành động ngay hôm nay.", "B. Chờ người khác.", "C. Chỉ nói.", "D. Không làm gì."], "answer": "A", "explain": "Hành động ngay hôm nay tạo tương lai bền vững.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Ngày mai tốt đẹp hơn nhờ hành động của ai? (3 từ)", "answer": "chính chúng ta", "explain": "Tương lai trong tay chính chúng ta.", "points": 0.5}]}]}</script>
