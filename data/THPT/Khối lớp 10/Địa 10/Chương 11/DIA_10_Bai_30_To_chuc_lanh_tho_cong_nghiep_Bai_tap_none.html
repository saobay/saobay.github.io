hoáng sản.", "D. Không phát triển công nghiệp."], "answer": "A", "explain": "Hội tụ cảng, sân bay, nhân lực, thị trường phù hợp trung tâm công nghiệp đa ngành.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trung tâm công nghiệp thúc đẩy đô thị hóa.", "b) Trung tâm công nghiệp tạo nhiều việc làm đa dạng.", "c) Trung tâm công nghiệp cần quan tâm xử lí ô nhiễm.", "d) Mọi đô thị đều trở thành trung tâm công nghiệp như nhau."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: quy mô, vai trò trung tâm công nghiệp khác nhau tùy điều kiện.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Mối quan hệ giữa trung tâm công nghiệp và đô thị là:", "options": ["A. Quan hệ hai chiều: đô thị cung cấp điều kiện cho công nghiệp; công nghiệp thúc đẩy đô thị phát triển.", "B. Một chiều.", "C. Đối lập nhau.", "D. Không liên quan."], "answer": "A", "explain": "Đô thị và trung tâm công nghiệp tác động qua lại, thúc đẩy nhau phát triển.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Quá trình tăng tỉ trọng dân số đô thị gắn với phát triển công nghiệp gọi là gì? (3 từ)", "answer": "đô thị hóa", "explain": "Công nghiệp thúc đẩy quá trình đô thị hóa.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Vùng công nghiệp có đặc điểm nào sau đây?", "options": ["A. Lãnh thổ rộng, gồm nhiều trung tâm, khu, điểm công nghiệp, có ngành chuyên môn hóa.", "B. Chỉ gồm một xí nghiệp.", "C. Không có ranh giới.", "D. Chỉ có một ngành duy nhất."], "answer": "A", "explain": "Vùng công nghiệp rộng lớn, gồm nhiều hình thức nhỏ hơn, có ngành chuyên môn hóa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ví dụ nào sau đây là vùng công nghiệp?", "options": ["A. Vùng Đông Nam Bộ.", "B. Một nhà máy đường.", "C. Một khu công nghiệp.", "D. Một thành phố."], "answer": "A", "explain": "Vùng Đông Nam Bộ là vùng công nghiệp lớn của Việt Nam.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Hình thức tổ chức lãnh thổ công nghiệp nào có quy mô lớn nhất? (3 từ)", "answer": "vùng công nghiệp", "explain": "Vùng công nghiệp là hình thức có quy mô lớn nhất.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Hướng chuyên môn hóa của vùng công nghiệp được xác định dựa vào:", "options": ["A. Lợi thế nổi bật về tài nguyên, lao động, vị trí của vùng.", "B. Sở thích cá nhân.", "C. Ngẫu nhiên.", "D. Chỉ dựa vào diện tích."], "answer": "A", "explain": "Hướng chuyên môn hóa dựa trên lợi thế nổi bật của vùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sắp xếp đúng các hình thức tổ chức lãnh thổ công nghiệp theo quy mô từ nhỏ đến lớn:", "options": ["A. Điểm — khu — trung tâm — vùng.", "B. Vùng — trung tâm — khu — điểm.", "C. Khu — điểm — vùng — trung tâm.", "D. Điểm — trung tâm — khu — vùng."], "answer": "A", "explain": "Thứ tự quy mô tăng dần: điểm, khu, trung tâm, vùng công nghiệp.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về vùng công nghiệp:", "statements": ["a) Vùng công nghiệp có lãnh thổ rộng lớn.", "b) Vùng công nghiệp gồm nhiều trung tâm, khu, điểm công nghiệp.", "c) Vùng công nghiệp có ngành chuyên môn hóa chủ đạo.", "d) Vùng công nghiệp chỉ gồm một xí nghiệp."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: vùng công nghiệp gồm rất nhiều xí nghiệp thuộc nhiều hình thức.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Vùng Đồng bằng sông Hồng có lợi thế lao động dồi dào, thị trường lớn, hạ tầng tốt. Hướng chuyên môn hóa phù hợp là:", "options": ["A. Công nghiệp chế biến, điện tử, dệt may, cơ khí.", "B. Khai thác than quy mô lớn.", "C. Luyện kim nặng.", "D. Không phát triển công nghiệp."], "answer": "A", "explain": "Phù hợp lợi thế lao động, thị trường, hạ tầng: chế biến, điện tử, dệt may, cơ khí.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mỗi vùng công nghiệp nên có hướng chuyên môn hóa riêng.", "b) Chuyên môn hóa giúp vùng phát huy lợi thế và tăng sức cạnh tranh.", "c) Mọi vùng đều chuyên môn hóa cùng một ngành.", "d) Vùng công nghiệp thúc đẩy phát triển kinh tế vùng."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: mỗi vùng chuyên môn hóa theo lợi thế riêng, khác nhau.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Ý nghĩa của việc xác định hướng chuyên môn hóa cho vùng công nghiệp là:", "options": ["A. Tập trung nguồn lực phát huy lợi thế, tránh dàn trải, nâng cao hiệu quả và sức cạnh tranh.", "B. Hạn chế phát triển.", "C. Chỉ làm một việc duy nhất.", "D. Không có ý nghĩa."], "answer": "A", "explain": "Chuyên môn hóa giúp tập trung nguồn lực, tránh dàn trải, nâng hiệu quả.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Thuật ngữ nào chỉ ngành giữ vai trò chủ đạo, tạo nên đặc trưng của vùng công nghiệp? (3 từ)", "answer": "ngành chuyên môn hóa", "explain": "Ngành chuyên môn hóa tạo đặc trưng cho vùng công nghiệp.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Tổ chức lãnh thổ công nghiệp hợp lí đem lại lợi ích nào sau đây?", "options": ["A. Sử dụng hợp lí nguồn lực, hiệu quả kinh tế cao.", "B. Tăng ô nhiễm.", "C. Lãng phí nguồn lực.", "D. Giảm việc làm."], "answer": "A", "explain": "Tổ chức hợp lí giúp dùng hợp lí nguồn lực, hiệu quả kinh tế cao.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bố trí ngành gây ô nhiễm xa khu dân cư thể hiện vai trò nào?", "options": ["A. Bảo vệ môi trường.", "B. Tăng lợi nhuận.", "C. Giảm việc làm.", "D. Tăng chi phí."], "answer": "A", "explain": "Bố trí hợp lí giúp bảo vệ môi trường, sức khỏe cộng đồng.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Tổ chức lãnh thổ công nghiệp hợp lí giúp tạo việc làm và thúc đẩy phát triển kinh tế của đơn vị nào? (1 từ)", "answer": "vùng", "explain": "Tổ chức hợp lí thúc đẩy phát triển kinh tế — xã hội của vùng.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Vì sao tổ chức lãnh thổ công nghiệp hợp lí giúp giảm chi phí sản xuất?", "options": ["A. Vì dùng chung hạ tầng, gần nguyên liệu và thị trường, liên kết xí nghiệp.", "B. Vì giảm lương công nhân.", "C. Vì không cần hạ tầng.", "D. Vì xa thị trường."], "answer": "A", "explain": "Dùng chung hạ tầng, gần nguyên liệu, thị trường và liên kết giúp giảm chi phí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tổ chức lãnh thổ công nghiệp gắn với chuyển dịch cơ cấu kinh tế theo hướng:", "options": ["A. Công nghiệp hóa, hiện đại hóa.", "B. Nông nghiệp hóa.", "C. Tự cung tự cấp.", "D. Quay lại thủ công."], "answer": "A", "explain": "Tổ chức công nghiệp hợp lí thúc đẩy công nghiệp hóa, hiện đại hóa.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về vai trò tổ chức lãnh thổ công nghiệp:", "statements": ["a) Giúp sử dụng hợp lí các nguồn lực của vùng.", "b) Giúp nâng cao hiệu quả kinh tế.", "c) Góp phần bảo vệ môi trường.", "d) Làm chậm quá trình đô thị hóa."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: tổ chức công nghiệp hợp lí thúc đẩy đô thị hóa.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Một huyện có cụm công nghiệp gây ô nhiễm nằm sát khu dân cư. Giải pháp tổ chức lãnh thổ đúng đắn là:", "options": ["A. Di dời, quy hoạch lại xa dân cư, đầu tư xử lí chất thải tập trung.", "B. Mở rộng thêm nhà máy sát dân cư.", "C. Đóng cửa mọi nhà máy.", "D. Mặc kệ ô nhiễm."], "answer": "A", "explain": "Quy hoạch lại xa dân cư, xử lí chất thải tập trung — vừa phát triển vừa bảo vệ môi trường.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bố trí công nghiệp tự phát, không quy hoạch gây lãng phí và ô nhiễm.", "b) Quy hoạch công nghiệp cần gắn với quy hoạch đô thị, môi trường.", "c) Mọi địa phương đều nên phát triển đầy đủ mọi ngành công nghiệp.", "d) Liên kết vùng giúp phân công hợp lí giữa các địa phương."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: mỗi địa phương phát huy lợi thế riêng, liên kết vùng thay vì dàn trải.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Phát triển công nghiệp bền vững đòi hỏi tổ chức lãnh thổ theo hướng:", "options": ["A. Hiệu quả kinh tế gắn với bảo vệ môi trường và tiến bộ xã hội.", "B. Chỉ chạy theo tăng trưởng bằng mọi giá.", "C. Bỏ qua môi trường.", "D. Không cần quy hoạch."], "answer": "A", "explain": "Bền vững là hài hòa kinh tế — môi trường — xã hội trong tổ chức lãnh thổ.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Cụm từ nào chỉ sự phát triển đáp ứng nhu cầu hiện tại mà không tổn hại thế hệ tương lai? (3 từ)", "answer": "phát triển bền vững", "explain": "Phát triển bền vững là mục tiêu của tổ chức lãnh thổ hợp lí.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Có mấy hình thức tổ chức lãnh thổ công nghiệp?", "options": ["A. 4: điểm, khu, trung tâm, vùng công nghiệp.", "B. 2.", "C. 3.", "D. 5."], "answer": "A", "explain": "Có 4 hình thức: điểm, khu, trung tâm, vùng công nghiệp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài 30 có tên là:", "options": ["A. Tổ chức lãnh thổ công nghiệp.", "B. Địa lí một số ngành công nghiệp.", "C. Công nghiệp và môi trường.", "D. Vai trò của công nghiệp."], "answer": "A", "explain": "Đúng tên bài 30 trong SGK.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Bài 30 thuộc chương nào? (2 từ)", "answer": "chương 11", "explain": "Bài 30 thuộc Chương 11: Địa lí ngành công nghiệp.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Phân biệt đúng: khu công nghiệp và trung tâm công nghiệp khác nhau chủ yếu ở:", "options": ["A. Quy mô, mức độ gắn với đô thị và tính đa dạng ngành.", "B. Màu sắc nhà máy.", "C. Số lượng công nhân.", "D. Không khác nhau."], "answer": "A", "explain": "Trung tâm lớn hơn, gắn đô thị, đa ngành hơn khu công nghiệp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm công nghiệp và vùng công nghiệp khác nhau căn bản ở:", "options": ["A. Quy mô lãnh thổ và số lượng xí nghiệp.", "B. Tên gọi.", "C. Màu sắc.", "D. Không khác nhau."], "answer": "A", "explain": "Điểm là một xí nghiệp đơn lẻ; vùng rộng lớn gồm nhiều hình thức.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng kết bài 30):", "statements": ["a) Có 4 hình thức tổ chức lãnh thổ công nghiệp.", "b) Điểm công nghiệp là hình thức đơn giản nhất.", "c) Khu công nghiệp không có dân cư sinh sống.", "d) Vùng công nghiệp là hình thức quy mô lớn nhất."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Xác định đúng hình thức: (1) nhà máy giấy đơn lẻ gần rừng trồng, (2) khu vực có 20 nhà máy không dân cư, (3) thành phố có nhiều khu công nghiệp, (4) vùng có nhiều trung tâm công nghiệp.", "options": ["A. (1) điểm, (2) khu, (3) trung tâm, (4) vùng.", "B. (1) vùng, (2) trung tâm, (3) khu, (4) điểm.", "C. (1) khu, (2) điểm, (3) vùng, (4) trung tâm.", "D. (1) trung tâm, (2) vùng, (3) điểm, (4) khu."], "answer": "A", "explain": "Đúng thứ tự: điểm (1 xí nghiệp), khu (nhiều xí nghiệp), trung tâm (gắn đô thị), vùng (rộng lớn).", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Một xí nghiệp đơn lẻ gần mỏ là điểm công nghiệp.", "b) Nhiều xí nghiệp có ranh giới chung là khu công nghiệp.", "c) Đô thị lớn với nhiều khu công nghiệp là trung tâm công nghiệp.", "d) Điểm công nghiệp bao giờ cũng lớn hơn khu công nghiệp."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: điểm công nghiệp nhỏ hơn khu công nghiệp.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Tổng hợp: một quốc gia muốn phát triển công nghiệp nhanh và bền vững cần:", "options": ["A. Kết hợp các hình thức tổ chức lãnh thổ phù hợp từng vùng, gắn với quy hoạch và bảo vệ môi trường.", "B. Chỉ phát triển vùng công nghiệp.", "C. Chỉ phát triển điểm công nghiệp.", "D. Không cần tổ chức lãnh thổ."], "answer": "A", "explain": "Cần kết hợp linh hoạt các hình thức phù hợp từng vùng, quy hoạch đồng bộ, bền vững.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Cụm từ nào chỉ việc sắp xếp, phân bố các ngành kinh tế trên lãnh thổ một cách khoa học? (3 từ)", "answer": "tổ chức lãnh thổ", "explain": "Tổ chức lãnh thổ là sự sắp xếp khoa học các hoạt động kinh tế trên lãnh thổ.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Điểm công nghiệp thường phân bố ở đâu?", "options": ["A. Lẻ tẻ, gần nguồn nguyên liệu.", "B. Tập trung trong đô thị lớn.", "C. Trong khu dân cư đông.", "D. Trên vùng rộng lớn."], "answer": "A", "explain": "Điểm công nghiệp phân bố lẻ tẻ, thường gần nguồn nguyên liệu tại chỗ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khu công nghiệp có đặc điểm về dân cư nào?", "options": ["A. Không có dân cư sinh sống.", "B. Dân cư rất đông.", "C. Chỉ có công nhân ở.", "D. Là khu đô thị."], "answer": "A", "explain": "Khu công nghiệp chuyên sản xuất, không có dân cư sinh sống.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Hình thức nào gồm nhiều khu công nghiệp, điểm công nghiệp và gắn với đô thị? (3 từ)", "answer": "trung tâm công nghiệp", "explain": "Trung tâm công nghiệp gắn với đô thị, gồm nhiều khu, điểm công nghiệp.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Vì sao khu công nghiệp cần có ranh giới xác định?", "options": ["A. Để quản lí, quy hoạch hạ tầng và bảo vệ môi trường tập trung.", "B. Để ngăn cách với thế giới.", "C. Để tăng giá đất.", "D. Không cần thiết."], "answer": "A", "explain": "Ranh giới rõ giúp quản lí, quy hoạch hạ tầng đồng bộ và xử lí môi trường tập trung.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một xí nghiệp chế biến cà phê đơn lẻ ở Tây Nguyên là:", "options": ["A. Điểm công nghiệp.", "B. Khu công nghiệp.", "C. Trung tâm công nghiệp.", "D. Vùng công nghiệp."], "answer": "A", "explain": "Xí nghiệp đơn lẻ gần vùng nguyên liệu là điểm công nghiệp.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Điểm công nghiệp gắn với một xí nghiệp đơn lẻ.", "b) Khu công nghiệp có nhiều xí nghiệp tập trung.", "c) Trung tâm công nghiệp gắn với đô thị.", "d) Vùng công nghiệp có quy mô nhỏ nhất."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: vùng công nghiệp có quy mô lớn nhất.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Tình huống: huyện A có 3 nhà máy (gạch, đường, giấy) nằm rải rác gần các vùng nguyên liệu. Đây là:", "options": ["A. Các điểm công nghiệp độc lập.", "B. Một khu công nghiệp.", "C. Một trung tâm công nghiệp.", "D. Một vùng công nghiệp."], "answer": "A", "explain": "Các nhà máy đơn lẻ, phân tán là các điểm công nghiệp độc lập.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Điểm công nghiệp phù hợp với vùng nguyên liệu phân tán.", "b) Khu công nghiệp phù hợp thu hút nhiều nhà đầu tư.", "c) Trung tâm công nghiệp cần đô thị làm hạt nhân.", "d) Có thể gộp mọi điểm công nghiệp thành vùng công nghiệp ngay."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: vùng công nghiệp cần quy mô, liên kết và chuyên môn hóa, không gộp cơ học.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Lựa chọn hình thức tổ chức lãnh thổ công nghiệp cho một địa phương cần căn cứ vào:", "options": ["A. Điều kiện tự nhiên, kinh tế — xã hội cụ thể và mục tiêu phát triển của địa phương.", "B. Sở thích của nhà đầu tư.", "C. Bắt chước địa phương khác.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Lựa chọn hình thức phải căn cứ điều kiện cụ thể và mục tiêu phát triển.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Cụm từ nào chỉ việc các xí nghiệp dùng chung hạ tầng, cung ứng cho nhau trong khu công nghiệp? (2 từ)", "answer": "liên kết", "explain": "Liên kết giữa các xí nghiệp nâng cao hiệu quả khu công nghiệp.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Tổ chức lãnh thổ công nghiệp hợp lí giúp bảo vệ môi trường bằng cách:", "options": ["A. Xử lí chất thải tập trung, bố trí ngành ô nhiễm xa dân cư.", "B. Xả thải tự do.", "C. Đặt nhà máy trong khu dân cư.", "D. Không cần xử lí."], "answer": "A", "explain": "Tổ chức hợp lí giúp xử lí chất thải tập trung và bố trí hợp lí để bảo vệ môi trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lợi ích kinh tế của tổ chức lãnh thổ công nghiệp là:", "options": ["A. Giảm chi phí, nâng cao hiệu quả sản xuất.", "B. Tăng chi phí.", "C. Giảm năng suất.", "D. Không có lợi ích."], "answer": "A", "explain": "Tổ chức hợp lí giúp giảm chi phí, nâng cao hiệu quả kinh tế.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Tổ chức lãnh thổ công nghiệp hợp lí tạo việc làm, tăng thu nhập cho người dân ở đâu? (2 từ)", "answer": "địa phương", "explain": "Tổ chức hợp lí thúc đẩy phát triển kinh tế — xã hội địa phương.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa tổ chức lãnh thổ công nghiệp và phát triển vùng là:", "options": ["A. Tổ chức hợp lí thúc đẩy vùng phát triển toàn diện.", "B. Không liên quan.", "C. Kìm hãm vùng.", "D. Chỉ lợi cho nhà máy."], "answer": "A", "explain": "Tổ chức hợp lí tạo việc làm, hạ tầng, thu nhập — thúc đẩy vùng phát triển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hậu quả của bố trí công nghiệp tự phát, thiếu quy hoạch là:", "options": ["A. Lãng phí đất, ô nhiễm môi trường, kém hiệu quả.", "B. Hiệu quả cao.", "C. Môi trường tốt.", "D. Không hậu quả."], "answer": "A", "explain": "Tự phát, thiếu quy hoạch gây lãng phí, ô nhiễm, kém hiệu quả.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tổ chức lãnh thổ hợp lí giúp phát huy lợi thế từng vùng.", "b) Bố trí tự phát gây lãng phí và ô nhiễm.", "c) Quy hoạch công nghiệp cần gắn với bảo vệ môi trường.", "d) Tổ chức lãnh thổ không ảnh hưởng tới hiệu quả kinh tế."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: tổ chức lãnh thổ ảnh hưởng trực tiếp tới hiệu quả kinh tế.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Để vừa thu hút đầu tư vừa bảo vệ môi trường, khu công nghiệp nên:", "options": ["A. Có hệ thống xử lí nước thải tập trung, phân loại ngành, giám sát chặt.", "B. Thu hút mọi ngành bằng mọi giá.", "C. Bỏ qua xử lí chất thải.", "D. Đặt sát khu dân cư."], "answer": "A", "explain": "Xử lí tập trung, phân loại ngành, giám sát chặt vừa thu hút đầu tư vừa bảo vệ môi trường.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dùng chung hạ tầng giúp từng xí nghiệp giảm chi phí.", "b) Liên kết xí nghiệp tạo chuỗi cung ứng hiệu quả.", "c) Tập trung công nghiệp luôn gây ô nhiễm không thể kiểm soát.", "d) Quy hoạch tốt giúp hài hòa kinh tế và môi trường."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: tập trung có quy hoạch, xử lí tập trung giúp kiểm soát ô nhiễm tốt hơn.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Bài học cho Việt Nam trong tổ chức lãnh thổ công nghiệp hiện nay là:", "options": ["A. Quy hoạch đồng bộ, phát huy lợi thế vùng, thu hút đầu tư có chọn lọc, bảo vệ môi trường.", "B. Phát triển ồ ạt không quy hoạch.", "C. Chỉ tập trung vào một vùng.", "D. Bỏ qua môi trường."], "answer": "A", "explain": "Cần quy hoạch đồng bộ, phát huy lợi thế, chọn lọc đầu tư, bảo vệ môi trường.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Cụm từ nào chỉ việc lựa chọn kĩ dự án đầu tư phù hợp mục tiêu phát triển? (4 từ)", "answer": "đầu tư có chọn lọc", "explain": "Thu hút đầu tư có chọn lọc đảm bảo phát triển bền vững.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Hình thức nào sau đây có ngành chuyên môn hóa chủ đạo?", "options": ["A. Vùng công nghiệp.", "B. Điểm công nghiệp.", "C. Khu công nghiệp.", "D. Không hình thức nào."], "answer": "A", "explain": "Vùng công nghiệp có ngành chuyên môn hóa chủ đạo tạo đặc trưng vùng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trung tâm công nghiệp khác khu công nghiệp ở:", "options": ["A. Gắn với đô thị, quy mô lớn, đa ngành hơn.", "B. Nhỏ hơn.", "C. Không có xí nghiệp.", "D. Không có hạ tầng."], "answer": "A", "explain": "Trung tâm công nghiệp lớn hơn, gắn đô thị, đa ngành hơn.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Có bao nhiêu hình thức tổ chức lãnh thổ công nghiệp? (1 từ)", "answer": "4", "explain": "Có 4 hình thức: điểm, khu, trung tâm, vùng công nghiệp.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Vì sao vùng công nghiệp cần có ngành chuyên môn hóa?", "options": ["A. Để tập trung nguồn lực, phát huy lợi thế, tăng sức cạnh tranh.", "B. Để hạn chế phát triển.", "C. Để giảm việc làm.", "D. Không cần thiết."], "answer": "A", "explain": "Chuyên môn hóa giúp tập trung nguồn lực, phát huy lợi thế, tăng cạnh tranh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa 4 hình thức tổ chức lãnh thổ công nghiệp là:", "options": ["A. Vùng bao gồm các trung tâm, khu, điểm; các hình thức liên kết với nhau.", "B. Độc lập hoàn toàn.", "C. Đối lập nhau.", "D. Không liên quan."], "answer": "A", "explain": "Các hình thức lồng ghép: vùng gồm trung tâm, khu, điểm, liên kết chặt chẽ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vùng công nghiệp gồm nhiều trung tâm công nghiệp.", "b) Trung tâm công nghiệp gồm nhiều khu công nghiệp.", "c) Khu công nghiệp gồm nhiều điểm công nghiệp.", "d) Điểm công nghiệp là đơn vị nhỏ nhất."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: khu công nghiệp gồm nhiều xí nghiệp, không nhất thiết gồm các điểm công nghiệp.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Một vùng có 2 trung tâm công nghiệp, 10 khu công nghiệp và nhiều điểm công nghiệp, chuyên về điện tử. Đây là:", "options": ["A. Vùng công nghiệp chuyên môn hóa điện tử.", "B. Điểm công nghiệp.", "C. Khu công nghiệp.", "D. Trung tâm công nghiệp đơn lẻ."], "answer": "A", "explain": "Quy mô rộng, nhiều hình thức, có ngành chuyên môn hóa là vùng công nghiệp.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chuyên môn hóa giúp vùng tránh dàn trải nguồn lực.", "b) Mỗi vùng nên chuyên môn hóa theo lợi thế riêng.", "c) Vùng công nghiệp thúc đẩy liên kết vùng.", "d) Chuyên môn hóa làm vùng kém linh hoạt hoàn toàn."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: chuyên môn hóa đi kèm đa dạng hóa hợp lí, không làm kém linh hoạt hoàn toàn.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Để xây dựng vùng công nghiệp thành công, yếu tố then chốt là:", "options": ["A. Xác định đúng hướng chuyên môn hóa, quy hoạch đồng bộ, liên kết các hình thức.", "B. Xây thật nhiều nhà máy.", "C. Chỉ cần vốn.", "D. Không cần quy hoạch."], "answer": "A", "explain": "Then chốt: đúng hướng chuyên môn hóa, quy hoạch đồng bộ, liên kết chặt chẽ.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Thuật ngữ nào chỉ sự phối hợp, gắn kết giữa các hình thức tổ chức lãnh thổ trong vùng? (2 từ)", "answer": "liên kết vùng", "explain": "Liên kết vùng giúp các hình thức tổ chức lãnh thổ phát huy hiệu quả.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Khái niệm tổ chức lãnh thổ công nghiệp nhấn mạnh:", "options": ["A. Bố trí, sắp xếp hợp lí để dùng hiệu quả nguồn lực.", "B. Xây dựng tự do.", "C. Di chuyển dân cư.", "D. Khai thác tối đa."], "answer": "A", "explain": "Nhấn mạnh bố trí, sắp xếp hợp lí để sử dụng hiệu quả nguồn lực.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hình thức đơn giản nhất và hình thức phức tạp nhất là:", "options": ["A. Điểm công nghiệp và vùng công nghiệp.", "B. Khu và trung tâm.", "C. Trung tâm và khu.", "D. Vùng và điểm."], "answer": "A", "explain": "Đơn giản nhất: điểm công nghiệp; phức tạp, quy mô lớn nhất: vùng công nghiệp.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Bài 30 nghiên cứu về tổ chức lãnh thổ của ngành nào? (2 từ)", "answer": "công nghiệp", "explain": "Bài 30: Tổ chức lãnh thổ công nghiệp.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Tổ chức lãnh thổ công nghiệp hợp lí tác động tới chuyển dịch cơ cấu kinh tế vì:", "options": ["A. Thúc đẩy công nghiệp hóa, hiện đại hóa, tăng tỉ trọng công nghiệp.", "B. Làm giảm tỉ trọng công nghiệp.", "C. Không tác động.", "D. Chỉ tác động nông nghiệp."], "answer": "A", "explain": "Tổ chức hợp lí thúc đẩy công nghiệp hóa, tăng tỉ trọng công nghiệp trong cơ cấu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đâu là biểu hiện của tổ chức lãnh thổ công nghiệp hợp lí?", "options": ["A. Khu công nghiệp có xử lí chất thải tập trung, gần cảng, giao thông thuận lợi.", "B. Nhà máy xả thải trực tiếp.", "C. Nhà máy nằm rải rác không quy hoạch.", "D. Khu công nghiệp không có hạ tầng."], "answer": "A", "explain": "Hạ tầng đồng bộ, xử lí chất thải, vị trí thuận lợi là biểu hiện tổ chức hợp lí.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (ôn tập bài 30):", "statements": ["a) Tổ chức lãnh thổ là bố trí, sắp xếp công nghiệp trên lãnh thổ.", "b) Có 4 hình thức: điểm, khu, trung tâm, vùng.", "c) Tổ chức hợp lí nâng cao hiệu quả và bảo vệ môi trường.", "d) Mọi hình thức đều có dân cư sinh sống bên trong."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: khu công nghiệp không có dân cư sinh sống.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Sắp xếp đúng quy trình hình thành vùng công nghiệp: (1) phát triển các điểm, khu; (2) hình thành trung tâm gắn đô thị; (3) liên kết thành vùng có chuyên môn hóa.", "options": ["A. (1) — (2) — (3).", "B. (3) — (2) — (1).", "C. (2) — (1) — (3).", "D. (1) — (3) — (2)."], "answer": "A", "explain": "Trình tự phát triển: từ điểm, khu tới trung tâm rồi liên kết thành vùng chuyên môn hóa.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tổ chức lãnh thổ cần phù hợp điều kiện từng địa phương.", "b) Có thể áp dụng máy móc mô hình nơi khác mà không điều chỉnh.", "c) Quy hoạch cần tầm nhìn dài hạn.", "d) Phát triển công nghiệp phải gắn với tiến bộ xã hội."], "answer": ["T", "F", "T", "T"], "explain": "b) Sai: cần điều chỉnh phù hợp điều kiện cụ thể, không áp dụng máy móc.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Tổng hợp toàn bài: vai trò cốt lõi của tổ chức lãnh thổ công nghiệp là:", "options": ["A. Tối ưu hóa việc sử dụng nguồn lực trên lãnh thổ để phát triển công nghiệp hiệu quả, bền vững.", "B. Xây dựng nhiều nhà máy nhất.", "C. Tập trung dân cư.", "D. Tăng diện tích đất công nghiệp."], "answer": "A", "explain": "Cốt lõi: tối ưu dùng nguồn lực trên lãnh thổ để công nghiệp hiệu quả, bền vững.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Cụm từ nào chỉ mục tiêu dùng ít nguồn lực nhất mà đạt hiệu quả cao nhất? (3 từ)", "answer": "tối ưu hóa", "explain": "Tối ưu hóa sử dụng nguồn lực là mục tiêu của tổ chức lãnh thổ.", "points": 0.5}]}]}</script>
