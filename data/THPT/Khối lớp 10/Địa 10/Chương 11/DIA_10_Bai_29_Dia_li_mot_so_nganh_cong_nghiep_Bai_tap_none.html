"T"], "explain": "c) Sai: mỗi loại điện phù hợp với điều kiện tự nhiên khác nhau.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Để đảm bảo an ninh năng lượng, một quốc gia nên:", "options": ["A. Đa dạng hóa nguồn điện, kết hợp truyền thống và tái tạo, tiết kiệm năng lượng.", "B. Chỉ dựa vào một loại điện duy nhất.", "C. Nhập khẩu toàn bộ điện năng.", "D. Không cần quy hoạch điện."], "answer": "A", "explain": "Đa dạng hóa nguồn, kết hợp các loại điện và tiết kiệm là giải pháp an ninh năng lượng.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Cụm từ nào chỉ khả năng đảm bảo đủ điện năng cho phát triển kinh tế và đời sống? (3 từ)", "answer": "an ninh năng lượng", "explain": "An ninh năng lượng là mục tiêu của mọi quốc gia.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Ngành nào cung cấp máy móc, thiết bị cho mọi ngành kinh tế?", "options": ["A. Công nghiệp cơ khí.", "B. Công nghiệp dệt may.", "C. Công nghiệp thực phẩm.", "D. Công nghiệp khai thác."], "answer": "A", "explain": "Cơ khí cung cấp máy móc, thiết bị cho mọi ngành kinh tế.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Luyện kim màu bao gồm các kim loại nào sau đây?", "options": ["A. Nhôm, đồng, chì, kẽm.", "B. Gang, thép.", "C. Vàng, bạc.", "D. Sắt, thép."], "answer": "A", "explain": "Luyện kim màu: nhôm, đồng, chì, kẽm...", "points": 0.25}, {"type": "short", "level": "NB", "q": "Ngành công nghiệp nào được ví là quả đấm thép của công nghiệp hóa? (2 từ)", "answer": "cơ khí", "explain": "Công nghiệp cơ khí được ví là quả đấm thép của công nghiệp hóa.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Vì sao công nghiệp cơ khí tập trung ở nước phát triển và nước công nghiệp mới?", "options": ["A. Vì cần kim loại, vốn lớn và lao động kĩ thuật cao.", "B. Vì các nước này nhiều tài nguyên.", "C. Vì các nước này ít dân.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Cơ khí đòi hỏi kim loại, vốn và lao động kĩ thuật — thế mạnh của nước phát t uy luật."], "answer": "A", "explain": "Luyện kim cung cấp kim loại cho cơ khí; cơ khí tạo thiết bị cho luyện kim — liên kết, thúc đẩy nhau.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Thuật ngữ nào chỉ mối quan hệ cung ứng, thúc đẩy lẫn nhau giữa các ngành công nghiệp? (2 từ)", "answer": "liên kết ngành", "explain": "Liên kết ngành thể hiện mối quan hệ chặt chẽ giữa các ngành công nghiệp.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Bài 29 nghiên cứu nội dung nào sau đây?", "options": ["A. Địa lí một số ngành công nghiệp tiêu biểu.", "B. Địa lí nông nghiệp.", "C. Địa lí dịch vụ.", "D. Địa lí dân cư."], "answer": "A", "explain": "Bài 29: Địa lí một số ngành công nghiệp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngành nào sau đây thuộc công nghiệp năng lượng?", "options": ["A. Khai thác dầu mỏ.", "B. Dệt may.", "C. Da giày.", "D. Chế biến thủy sản."], "answer": "A", "explain": "Khai thác dầu mỏ thuộc công nghiệp năng lượng.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Bài 29 thuộc chương nào? (2 từ)", "answer": "chương 11", "explain": "Bài 29 thuộc Chương 11: Địa lí ngành công nghiệp.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Điểm chung của các ngành công nghiệp hiện đại (điện tử, cơ khí chính xác) là:", "options": ["A. Cần lao động trình độ cao, vốn lớn, giá trị gia tăng cao.", "B. Cần nhiều nguyên liệu thô.", "C. Gây ô nhiễm nặng.", "D. Chỉ dùng lao động phổ thông."], "answer": "A", "explain": "Ngành hiện đại cần tri thức, vốn, cho giá trị gia tăng cao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ngành nào sau đây vừa thâm dụng lao động vừa gắn với nguyên liệu nông sản?", "options": ["A. Chế biến thực phẩm.", "B. Luyện kim.", "C. Điện tử.", "D. Đóng tàu."], "answer": "A", "explain": "Chế biến thực phẩm thâm dụng lao động, nguyên liệu từ nông sản.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng kết bài 29):", "statements": ["a) Năng lượng là ngành đi trước một bước.", "b) Luyện kim đen cần quặng sắt và than cốc.", "c) Điện tử — tin học là ngành công nghệ cao.", "d) Hóa chất không bao giờ gây ô nhiễm."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: hóa chất dễ gây ô nhiễm, cần công nghệ sạch.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Sắp xếp đúng trình tự từ nguyên liệu tới sản phẩm cuối cùng: quặng sắt, thép, ô tô. Trình tự này minh họa:", "options": ["A. Mối liên kết từ khai thác qua luyện kim tới cơ khí chế tạo.", "B. Ba ngành độc lập.", "C. Trình tự ngược.", "D. Không liên quan."], "answer": "A", "explain": "Quặng sắt (khai thác) thành thép (luyện kim) thành ô tô (cơ khí) — chuỗi liên kết ngành.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nước giàu tài nguyên có lợi thế phát triển năng lượng, luyện kim.", "b) Nước nghèo tài nguyên vẫn phát triển được điện tử, cơ khí chính xác.", "c) Mọi ngành công nghiệp đều cần nhiều khoáng sản tại chỗ.", "d) Lựa chọn ngành phát triển phải phù hợp điều kiện từng nước."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: điện tử, dệt may... ít cần khoáng sản tại chỗ.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Chiến lược phát triển công nghiệp đúng đắn của một quốc gia cần:", "options": ["A. Lựa chọn ngành phù hợp lợi thế, nâng dần trình độ công nghệ, gắn với bảo vệ môi trường.", "B. Phát triển mọi ngành cùng lúc.", "C. Chỉ phát triển ngành truyền thống.", "D. Bỏ qua môi trường để tăng trưởng nhanh."], "answer": "A", "explain": "Chiến lược đúng: phù hợp lợi thế, nâng dần công nghệ, phát triển bền vững.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Cụm từ nào chỉ việc lựa chọn ngành công nghiệp phù hợp với điểm mạnh của đất nước? (3 từ)", "answer": "lợi thế so sánh", "explain": "Phát huy lợi thế so sánh trong lựa chọn ngành công nghiệp.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Than được sử dụng trong các ngành nào sau đây?", "options": ["A. Nhiệt điện, luyện kim, hóa chất.", "B. Dệt may, da giày.", "C. Điện tử, tin học.", "D. Chế biến thủy sản."], "answer": "A", "explain": "Than dùng cho nhiệt điện, luyện kim (than cốc), hóa chất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khu vực nào sau đây giàu dầu mỏ, khí đốt?", "options": ["A. Trung Đông.", "B. Bắc Âu.", "C. Nam Cực.", "D. Trung Phi."], "answer": "A", "explain": "Trung Đông là khu vực giàu dầu mỏ, khí đốt bậc nhất thế giới.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Ngoài làm nhiên liệu, dầu mỏ còn là nguyên liệu cho công nghiệp lọc và gì? (2 từ)", "answer": "hóa dầu", "explain": "Dầu mỏ là nguyên liệu cho công nghiệp lọc — hóa dầu.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Vì sao giá dầu mỏ biến động ảnh hưởng mạnh tới kinh tế thế giới?", "options": ["A. Vì dầu mỏ là nhiên liệu, nguyên liệu của nhiều ngành, chi phí vận tải.", "B. Vì dầu mỏ chỉ dùng trang trí.", "C. Vì ít nước dùng dầu.", "D. Không ảnh hưởng."], "answer": "A", "explain": "Dầu mỏ ảnh hưởng chi phí năng lượng, vận tải, hóa dầu của toàn bộ nền kinh tế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khai thác than, dầu khí cần chú ý vấn đề nào sau đây?", "options": ["A. An toàn lao động và bảo vệ môi trường.", "B. Chỉ cần tăng sản lượng.", "C. Không cần công nghệ.", "D. Khai thác cạn kiệt càng nhanh càng tốt."], "answer": "A", "explain": "Khai thác nhiên liệu hóa thạch cần đảm bảo an toàn và bảo vệ môi trường, khai thác hợp lí.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Than, dầu, khí là nhiên liệu hóa thạch, có thể cạn kiệt.", "b) Dầu mỏ vừa là nhiên liệu vừa là nguyên liệu hóa dầu.", "c) Khai thác than không ảnh hưởng môi trường.", "d) Trung Đông giàu dầu mỏ, khí đốt."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: khai thác than gây ô nhiễm, sụt lún, ảnh hưởng môi trường.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Một nước xuất khẩu dầu thô muốn tăng thu nhập. Giải pháp tốt nhất là:", "options": ["A. Phát triển lọc — hóa dầu trong nước để xuất khẩu sản phẩm chế biến.", "B. Tăng khai thác thô bán ra.", "C. Nhập khẩu xăng dầu về bán.", "D. Đóng cửa mỏ dầu."], "answer": "A", "explain": "Chế biến sâu (lọc — hóa dầu) tạo giá trị gia tăng cao hơn xuất dầu thô.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhiên liệu hóa thạch hình thành qua hàng triệu năm nên cần sử dụng tiết kiệm.", "b) Khai thác dầu khí ngoài khơi đòi hỏi công nghệ cao.", "c) Mọi nước đều có dầu mỏ để khai thác.", "d) Sử dụng năng lượng tái tạo giúp giảm phụ thuộc dầu mỏ."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: dầu mỏ phân bố không đều, chỉ một số khu vực giàu có.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Cuộc khủng hoảng năng lượng cho thấy các nước nhập khẩu dầu cần:", "options": ["A. Đa dạng hóa nguồn cung, dự trữ chiến lược, phát triển năng lượng tái tạo và tiết kiệm.", "B. Chỉ trông chờ một nguồn cung.", "C. Tăng tiêu thụ dầu.", "D. Không cần dự trữ."], "answer": "A", "explain": "Bài học an ninh năng lượng: đa dạng nguồn, dự trữ, tái tạo, tiết kiệm.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Cụm từ nào chỉ lượng dầu dự trữ của quốc gia để ứng phó khủng hoảng? (3 từ)", "answer": "dự trữ chiến lược", "explain": "Dự trữ chiến lược đảm bảo an ninh năng lượng khi khủng hoảng.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên liệu của công nghiệp hóa chất gồm:", "options": ["A. Dầu khí, than, muối mỏ, quặng.", "B. Bông, sợi.", "C. Gỗ, tre.", "D. Cá, tôm."], "answer": "A", "explain": "Hóa chất dùng dầu khí, than, muối mỏ, quặng làm nguyên liệu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngành nào sau đây thuộc công nghiệp sản xuất hàng tiêu dùng?", "options": ["A. Dệt may.", "B. Luyện thép.", "C. Khai thác than.", "D. Đóng tàu."], "answer": "A", "explain": "Dệt may thuộc công nghiệp sản xuất hàng tiêu dùng.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Sản phẩm phân bón, thuốc trừ sâu thuộc ngành công nghiệp gì? (2 từ)", "answer": "hóa chất", "explain": "Phân bón, thuốc trừ sâu thuộc công nghiệp hóa chất.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Vì sao nhà máy hóa chất thường đặt gần nguồn nguyên liệu hoặc cảng?", "options": ["A. Vì nguyên liệu cồng kềnh, vận chuyển tốn kém; gần cảng thuận nhập khẩu.", "B. Vì hóa chất nhẹ.", "C. Vì không cần nguyên liệu.", "D. Ngẫu nhiên."], "answer": "A", "explain": "Nguyên liệu hóa chất cồng kềnh nên cần gần nguồn hoặc cảng nhập khẩu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vai trò của công nghiệp chế biến thực phẩm với nông nghiệp là:", "options": ["A. Tăng giá trị nông sản, giảm hao hụt, mở rộng thị trường.", "B. Làm giảm giá nông sản.", "C. Không liên quan.", "D. Kìm hãm nông nghiệp."], "answer": "A", "explain": "Chế biến tăng giá trị, bảo quản nông sản, mở rộng thị trường tiêu thụ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hóa chất sản xuất phân bón, nhựa, dược phẩm, mỹ phẩm.", "b) Dệt may, da giày thâm dụng lao động.", "c) Chế biến thực phẩm nên gần nguồn nguyên liệu nông sản.", "d) Hàng tiêu dùng không cần quan tâm thị trường."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: hàng tiêu dùng rất cần gần thị trường tiêu thụ.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Vùng trồng mía lớn muốn phát triển công nghiệp. Lựa chọn hợp lí nhất là:", "options": ["A. Xây nhà máy đường và chế biến sau đường gần vùng mía.", "B. Xây nhà máy thép.", "C. Khai thác dầu khí.", "D. Không phát triển công nghiệp."], "answer": "A", "explain": "Gần nguồn mía phát triển công nghiệp đường và chế biến sau đường — phù hợp nguyên liệu.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dược phẩm thuộc công nghiệp hóa chất.", "b) Da giày cần gần nguồn da và lao động.", "c) Mọi nhà máy hóa chất đều an toàn tuyệt đối.", "d) Chế biến gỗ cần gần nguồn gỗ nguyên liệu."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: hóa chất tiềm ẩn rủi ro, cần quản lí an toàn nghiêm ngặt.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Để công nghiệp hóa chất phát triển bền vững, cần:", "options": ["A. Công nghệ sạch, xử lí chất thải, an toàn lao động và quy hoạch hợp lí.", "B. Xả thải tự do để giảm chi phí.", "C. Đặt nhà máy trong khu dân cư.", "D. Không cần kiểm soát."], "answer": "A", "explain": "Hóa chất bền vững cần công nghệ sạch, xử lí chất thải, an toàn và quy hoạch.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Cụm từ nào chỉ công nghệ sản xuất ít gây ô nhiễm, thân thiện môi trường? (2 từ)", "answer": "công nghệ sạch", "explain": "Công nghệ sạch giúp công nghiệp phát triển bền vững.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Sản phẩm nào sau đây thuộc công nghiệp điện tử — tin học?", "options": ["A. Điện thoại, máy tính.", "B. Quần áo.", "C. Gạo.", "D. Xi măng."], "answer": "A", "explain": "Điện thoại, máy tính là sản phẩm điện tử — tin học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trung tâm công nghệ điện tử lớn của thế giới gồm:", "options": ["A. Hoa Kì, Nhật Bản, Hàn Quốc, Trung Quốc.", "B. Các nước nghèo nhất.", "C. Vùng hoang mạc.", "D. Vùng cực."], "answer": "A", "explain": "Hoa Kì, Nhật Bản, Hàn Quốc, Trung Quốc là trung tâm điện tử — tin học lớn.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Ngành điện tử — tin học cần nhất loại lao động nào? (4 từ)", "answer": "lao động trình độ cao", "explain": "Điện tử — tin học cần lao động trình độ cao.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Vì sao điện tử — tin học được coi là ngành ít gây ô nhiễm?", "options": ["A. Vì sản
