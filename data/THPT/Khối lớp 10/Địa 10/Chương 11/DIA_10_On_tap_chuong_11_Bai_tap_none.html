 Dệt may.", "D. Thực phẩm."], "answer": "A", "explain": "Phân bón thuộc công nghiệp hóa chất.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Ngành dệt may, da giày cần nhiều lao động nên gọi là thâm dụng gì? (2 từ)", "answer": "lao động", "explain": "Dệt may, da giày là ngành thâm dụng lao động.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Điểm chung của điện tử — tin học và công nghiệp phần mềm là:", "options": ["A. Giá trị từ tri thức, công nghệ, cần lao động trình độ cao.", "B. Cần nhiều nguyên liệu thô.", "C. Gây ô nhiễm nặng.", "D. Chỉ cần lao động phổ thông."], "answer": "A", "explain": "Cả hai đều dựa vào tri thức, công nghệ, nhân lực trình độ cao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Công nghiệp hóa chất cần đặc biệt chú ý:", "options": ["A. An toàn và xử lí chất thải vì dễ gây ô nhiễm.", "B. Chỉ tăng sản lượng.", "C. Không cần công nghệ.", "D. Xả thải tự do."], "answer": "A", "explain": "Hóa chất dễ gây ô nhiễm nên cần an toàn, xử lí chất thải.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dệt may phù hợp với nước đông lao động.", "b) Chế biến thực phẩm tăng giá trị nông sản.", "c) Điện tử — tin học ít phụ thuộc khoáng sản.", "d) Hóa chất không bao giờ gây ô nhiễm."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: hóa chất tiềm ẩn nguy cơ ô nhiễm cao.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Vùng trồng bông lớn, dân đông. Ngành công nghiệp nên phát triển là:", "options": ["A. Dệt may.", "B. Luyện thép.", "C. Đóng tàu.", "D. Điện hạt nhân."], "answer": "A", "explain": "Có bông (nguyên liệu) và lao động dồi dào nên phát triển dệt may.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lắp ráp điện tử ở nước đang phát triển tận dụng lao động rẻ.", "b) Nghiên cứu — phát triển tạo lợi thế cạnh tranh.", "c) Hàng tiêu dùng cần gần thị trường đông dân.", "d) Mọi ngành công nghiệp đều cần nhiều vốn như nhau."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: nhu cầu vốn khác nhau tùy ngành.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Để tham gia sâu vào chuỗi giá trị toàn cầu, doanh nghiệp Việt Nam cần:", "options": ["A. Nâng cao công nghệ, chất lượng, xây dựng thương hiệu.", "B. Chỉ gia công giá rẻ.", "C. Không cần đổi mới.", "D. Đóng cửa thị trường."], "answer": "A", "explain": "Muốn lên nấc cao trong chuỗi giá trị cần công nghệ, chất lượng, thương hiệu.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Tên tuổi, uy tín của sản phẩm, doanh nghiệp trên thị trường gọi là gì? (2 từ)", "answer": "thương hiệu", "explain": "Thương hiệu mạnh nâng giá trị sản phẩm.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Hình thức tổ chức lãnh thổ công nghiệp gồm một xí nghiệp đơn lẻ là:", "options": ["A. Điểm công nghiệp.", "B. Vùng công nghiệp.", "C. Trung tâm công nghiệp.", "D. Khu công nghiệp."], "answer": "A", "explain": "Điểm công nghiệp đồng nhất với một xí nghiệp đơn lẻ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khu công nghiệp có đặc điểm:", "options": ["A. Ranh giới rõ, nhiều xí nghiệp, hạ tầng đồng bộ.", "B. Một xí nghiệp.", "C. Gắn với đô thị lớn.", "D. Rộng bằng cả vùng."], "answer": "A", "explain": "Khu công nghiệp: ranh giới rõ, nhiều xí nghiệp, hạ tầng đồng bộ.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Hình thức tổ chức lãnh thổ công nghiệp nào gắn với đô thị vừa và lớn? (3 từ)", "answer": "trung tâm công nghiệp", "explain": "Trung tâm công nghiệp gắn với đô thị vừa và lớn.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Thứ tự đúng về quy mô các hình thức tổ chức lãnh thổ công nghiệp là:", "options": ["A. Điểm, khu, trung tâm, vùng.", "B. Vùng, khu, điểm, trung tâm.", "C. Khu, điểm, vùng, trung tâm.", "D. Trung tâm, vùng, khu, điểm."], "answer": "A", "explain": "Quy mô tăng dần: điểm, khu, trung tâm, vùng.", "points": ", "explain": "Liên kết, dùng chung hạ tầng nâng hiệu quả.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Hoạt động công nghiệp nào sau đây gây ô nhiễm không khí?", "options": ["A. Đốt than trong nhiệt điện, luyện kim.", "B. Trồng rừng.", "C. Dùng điện mặt trời.", "D. Tái chế rác."], "answer": "A", "explain": "Đốt than phát thải khí gây ô nhiễm không khí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguồn năng lượng nào sạch, vô tận?", "options": ["A. Mặt trời.", "B. Than đá.", "C. Dầu mỏ.", "D. Khí đốt."], "answer": "A", "explain": "Mặt trời là năng lượng sạch, vô tận.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Năng lượng từ gió, mặt trời, sinh khối gọi chung là năng lượng gì? (2 từ)", "answer": "tái tạo", "explain": "Đó là năng lượng tái tạo.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Mưa a-xít ảnh hưởng tới:", "options": ["A. Rừng, đất, công trình xây dựng và sức khỏe.", "B. Chỉ quần áo.", "C. Không ảnh hưởng gì.", "D. Chỉ ô tô."], "answer": "A", "explain": "Mưa a-xít hại rừng, chua đất, ăn mòn công trình, hại sức khỏe.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điện gió có hạn chế nào?", "options": ["A. Phụ thuộc gió, cần diện tích, ảnh hưởng cảnh quan.", "B. Gây ô nhiễm nặng.", "C. Nhanh cạn kiệt.", "D. Không tái tạo."], "answer": "A", "explain": "Điện gió phụ thuộc gió, cần diện tích, ảnh hưởng cảnh quan, tiếng ồn.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Công nghiệp tạo công nghệ xử lí môi trường.", "b) Nước thải chưa xử lí gây ô nhiễm nguồn nước.", "c) Năng lượng tái tạo giảm phát thải.", "d) Ô nhiễm công nghiệp không ảnh hưởng sức khỏe."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: ô nhiễm ảnh hưởng trực tiếp sức khỏe cộng đồng.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Khu dân cư gần nhà máy thải khí độc. Biện pháp bảo vệ đúng đắn là:", "options": ["A. Yêu cầu nhà máy xử lí khí thải, di dời hợp lí, giám sát.", "B. Chấp nhận sống chung.", "C. Tự mua mặt nạ.", "D. Không làm gì."], "answer": "A", "explain": "Cần xử lí khí thải, quy hoạch lại và giám sát môi trường.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lắp điện mặt trời mái nhà giảm hóa đơn điện.", "b) Sinh khối tận dụng phế phẩm nông nghiệp.", "c) Tái tạo không cần đầu tư ban đầu.", "d) Tiết kiệm năng lượng ai cũng làm được."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: tái tạo cần đầu tư ban đầu khá lớn.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Giải pháp căn cơ giảm ô nhiễm công nghiệp là:", "options": ["A. Công nghệ sạch từ thiết kế, xử lí chất thải, giám sát chặt.", "B. Chuyển ô nhiễm đi nơi khác.", "C. Xả thải ban đêm.", "D. Không sản xuất."], "answer": "A", "explain": "Căn cơ: công nghệ sạch, xử lí, giám sát — không chuyển ô nhiễm.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Việc đánh giá ảnh hưởng của dự án tới tự nhiên trước khi triển khai gọi là đánh giá tác động gì? (2 từ)", "answer": "môi trường", "explain": "Đánh giá tác động môi trường là bắt buộc với dự án công nghiệp.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Công nghiệp xanh là:", "options": ["A. Ít ô nhiễm, tiết kiệm tài nguyên, thân thiện môi trường.", "B. Nhà máy sơn xanh.", "C. Trồng cây trong nhà máy.", "D. Chỉ sản xuất rau."], "answer": "A", "explain": "Công nghiệp xanh ít ô nhiễm, tiết kiệm, thân thiện môi trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kinh tế tuần hoàn nghĩa là:", "options": ["A. Tái chế, tái sử dụng chất thải thành nguyên liệu.", "B. Sản xuất một lần rồi bỏ.", "C. Xả thải tự do.", "D. Không tái chế."], "answer": "A", "explain": "Tuần hoàn: tái chế, tái sử dụng, chất thải thành nguyên liệu.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Mô hình nhà máy ứng dụng tự động hóa, dữ liệu lớn gọi là nhà máy gì? (3 từ)", "answer": "nhà máy thông minh", "explain": "Nhà máy thông minh ứng dụng công nghệ số.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Vì sao tương lai ưu tiên ngành công nghệ cao?", "options": ["A. Giá trị gia tăng cao, ít ô nhiễm, tiết kiệm tài nguyên.", "B. Cần nhiều lao động phổ thông.", "C. Gây ô nhiễm nhiều.", "D. Tốn nguyên liệu."], "answer": "A", "explain": "Công nghệ cao: giá trị cao, ít ô nhiễm, tiết kiệm tài nguyên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trung hòa các-bon có nghĩa là:", "options": ["A. Cân bằng lượng phát thải và hấp thụ các-bon.", "B. Không phát thải gì.", "C. Chỉ trồng cây.", "D. Ngừng sản xuất."], "answer": "A", "explain": "Trung hòa các-bon: cân bằng phát thải và hấp thụ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tương lai ưu tiên công nghiệp xanh, công nghệ cao.", "b) Tiết kiệm tài nguyên giảm chi phí, bảo vệ môi trường.", "c) Chuyển đổi số nâng năng suất công nghiệp.", "d) Phát triển công nghiệp nên tăng phát thải."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: cần giảm phát thải.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Doanh nghiệp dùng năng lượng mặt trời, tái chế nước, xử lí khí thải. Đây là:", "options": ["A. Sản xuất xanh, bền vững.", "B. Sản xuất gây ô nhiễm.", "C. Sản xuất lạc hậu.", "D. Sản xuất tự phát."], "answer": "A", "explain": "Năng lượng sạch, tái chế, xử lí thải là sản xuất xanh.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Người tiêu dùng xanh thúc đẩy sản xuất sạch.", "b) Số hóa giúp giảm lãng phí nguyên liệu.", "c) Mọi doanh nghiệp số hóa đều thành công ngay.", "d) Đào tạo lại giúp lao động thích ứng."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: số hóa cần lộ trình và đầu tư.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Định hướng đúng cho công nghiệp Việt Nam tương lai là:", "options": ["A. Xanh, công nghệ cao, tuần hoàn, chọn lọc đầu tư, bảo vệ môi trường.", "B. Ồ ạt không quy hoạch.", "C. Chỉ khai thác thô.", "D. Bỏ qua môi trường."], "answer": "A", "explain": "Hướng đúng: xanh, công nghệ cao, tuần hoàn, chọn lọc, bền vững.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Nền kinh tế ít phát thải, sử dụng hiệu quả tài nguyên gọi là kinh tế gì? (2 từ)", "answer": "kinh tế xanh", "explain": "Kinh tế xanh là định hướng tương lai.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Chương 11 của Địa lí 10 nghiên cứu về:", "options": ["A. Địa lí ngành công nghiệp.", "B. Địa lí nông nghiệp.", "C. Địa lí dịch vụ.", "D. Địa lí dân cư."], "answer": "A", "explain": "Chương 11: Địa lí ngành công nghiệp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngành đi trước một bước, tạo tiền đề cho các ngành khác là:", "options": ["A. Năng lượng.", "B. Dệt may.", "C. Da giày.", "D. Thực phẩm."], "answer": "A", "explain": "Năng lượng đi trước một bước.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Chương 11 có bao nhiêu bài học (không kể thực hành)? (1 từ)", "answer": "4", "explain": "Chương 11 có 4 bài: 28, 29, 30, 31 (bài 32 thực hành).", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Điểm giống nhau giữa luyện kim và hóa chất là:", "options": ["A. Đều gắn với nguồn nguyên liệu, cần vốn lớn, tiềm ẩn ô nhiễm.", "B. Đều không cần nguyên liệu.", "C. Đều thâm dụng lao động.", "D. Đều công nghệ cao sạch."], "answer": "A", "explain": "Luyện kim, hóa chất đều gắn nguyên liệu, vốn lớn, dễ gây ô nhiễm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau giữa điện tử và dệt may là:", "options": ["A. Điện tử cần tri thức, vốn; dệt may thâm dụng lao động phổ thông.", "B. Không khác nhau.", "C. Dệt may cần tri thức hơn.", "D. Điện tử thâm dụng lao động hơn."], "answer": "A", "explain": "Điện tử dựa tri thức; dệt may thâm dụng lao động phổ thông.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Năng lượng là tiền đề cho mọi ngành.", "b) Cơ khí cung cấp máy móc cho các ngành.", "c) Tổ chức lãnh thổ gồm 4 hình thức.", "d) Tái tạo là năng lượng hóa thạch."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: tái tạo không phải hóa thạch.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Tỉnh có than, quặng sắt, cảng biển, dân đông. Cơ cấu công nghiệp phù hợp:", "options": ["A. Nhiệt điện, luyện kim, cơ khí, dệt may, chế biến.", "B. Chỉ trồng lúa.", "C. Chỉ du lịch.", "D. Không phát triển."], "answer": "A", "explain": "Tận dụng than, quặng (nặng), cảng, lao động (nhẹ): cơ cấu đa dạng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lựa chọn ngành phải phù hợp lợi thế địa phương.", "b) Công nghiệp nặng và nhẹ có thể kết hợp.", "c) Mọi tỉnh đều nên làm thép.", "d) Bảo vệ môi trường là yêu cầu bắt buộc."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai: luyện thép cần điều kiện đặc thù.", "points": 1}, {"type": "mcq", "level": "VDC", "q": "Bài học chung từ chương 11 cho phát triển công nghiệp Việt Nam:", "options": ["A. Phát huy lợi thế, nâng công nghệ, tổ chức hợp lí, phát triển xanh bền vững.", "B. Phát triển tự phát.", "C. Chỉ chạy theo số lượng.", "D. Bỏ qua môi trường."], "answer": "A", "explain": "Bài học: lợi thế, công nghệ, tổ chức, xanh, bền vững.", "points": 0.25}, {"type": "short", "level": "VDC", "q": "Cụm từ nào chỉ sự phát triển đáp ứng hiện tại, không hại tương lai? (3 từ)", "answer": "phát triển bền vững", "explain": "Phát triển bền vững là mục tiêu xuyên suốt.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Bài 28 nghiên cứu về:", "options": ["A. Vai trò, đặc điểm, cơ cấu công nghiệp và nhân tố ảnh hưởng.", "B. Tổ chức lãnh thổ.", "C. Môi trường.", "D. Dịch vụ."], "answer": "A", "explain": "Bài 28: vai trò, đặc điểm, cơ cấu và nhân tố ảnh hưởng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài 30 nghiên cứu về:", "options": ["A. Tổ chức lãnh thổ công nghiệp.", "B. Năng lượng tái tạo.", "C. Luyện kim.", "D. Dệt may."], "answer": "A", "explain": "Bài 30: tổ chức lãnh thổ công nghiệp.", "points": 0.25}, {"type": "short", "level": "NB", "q": "Bài 31 nghiên cứu năng lượng tái tạo và định hướng công nghiệp trong gì? (2 từ)", "answer": "tương lai", "explain": "Bài 31: định hướng phát triển công nghiệp trong tương lai.", "points": 0.5}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa 4 bài trong chương 11 là:", "options": ["A. Từ chung tới riêng: vai trò, ngành cụ thể, tổ chức lãnh thổ, bền vững.", "B. Độc lập hoàn toàn.", "C. Mâu thuẫn nhau.", "D. Trùng lặp."], "answer": "A", "explain": "Logic chương: tổng quan, từng ngành, tổ chức lãnh thổ, phát triển bền vững.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhân tố nào ảnh hưởng tới cả 4 nội dung của chương?", "options": ["A. Khoa học — công nghệ và bảo vệ môi trường.", "B. Chỉ khoáng sản.", "C. Chỉ lao động.", "D. Không nhân tố nào."], "answer": "A", "explain": "Khoa học — công nghệ và môi trường xuyên suốt mọi nội dung chương 11.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng kết chương 11):", "statements": ["a) Công nghiệp là động lực tăng trưởng kinh tế.", "b) Cơ cấu ngành gồm khai thác, chế biến, điện — khí — nước.", "c) Có 4 hình thức tổ chức lãnh thổ công nghiệp.", "d) Tương lai ưu tiên công nghiệp gây ô nhiễm."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai: tương lai ưu tiên công nghiệp xanh.", "points": 1}, {"type": "mcq", "level": "VD", "q": "Để học tốt chương 11, học sinh cần nắm vững mạch kiến thức:", "options": ["A. Vai trò — đặc điểm — cơ cấu — nhân tố — từng ngành — tổ chức lãnh thổ — bền vững.", "B. Chỉ học thuộc tên bài.", "C. Chỉ làm bài tập.", "D. Không cần mạch kiến thức."], "answer": "A", "explain": "Mạch kiến thức chươn
