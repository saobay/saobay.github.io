<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Cho hình bình hành $ABCD$. Vectơ nào sau đây bằng vectơ $\\overrightarrow{AB}$?", "options": ["A. $\\overrightarrow{DC}$", "B. $\\overrightarrow{BA}$", "C. $\\overrightarrow{CD}$", "D. $\\overrightarrow{AD}$"], "answer": "A", "explain": "Trong hình bình hành, $\\overrightarrow{AB} = \\overrightarrow{DC}$ (cùng hướng, cùng độ dài)."}, {"type": "mcq", "level": "TH", "q": "Cặp số nào sau đây là nghiệm của bất phương trình $1x + 4y < 7$?", "options": ["A. $(2;0)$", "B. $(4;2)$", "C. $(0;6)$", "D. $(6;6)$"], "answer": "A", "explain": "Thay $(2;0)$ vào: $1\\cdot2+4\\cdot0=2<7$ (đúng)."}, {"type": "mcq", "level": "VD", "q": "Khoảng cách từ điểm $M(0;0)$ đến đường thẳng $\\Delta: 3x+4y-10=0$ bằng:", "options": ["A. $4$", "B. $3$", "C. $2{,}5$", "D. $2$"], "answer": "D", "explain": "$d(M,\\Delta) = \\frac{|3\\cdot0+0-10|}{\\sqrt{3^2+4^2}} = \\frac{10}{\\sqrt{25}} = 2$."}, {"type": "mcq", "level": "TH", "q": "Cho tam giác $ABC$ có $a = 5$, $b = 12$, $\\widehat{C} = 90^\\circ$. Độ dài cạnh $c$ bằng:", "options": ["A. $13$", "B. $12$", "C. $14$", "D. $15$"], "answer": "A", "explain": "$c^2 = 5^2+12^2 = 169$ nên $c=13$."}, {"type": "mcq", "level": "VD", "q": "Từ $7$ người, số cách chọn ra $1$ tổ trưởng và $1$ tổ phó là:", "options": ["A. $42$", "B. $21$", "C. $14$", "D. $49$"], "answer": "A", "explain": "$A_7^2 = 7\\cdot 6 = 42$."}, {"type": "mcq", "level": "TH", "q": "Tập nghiệm của bất phương trình $x^2 - 5x + 6 > 0$ là:", "options": ["A. $(-\\infty;2)\\cup(3;+\\infty)$", "B. $(2;3)$", "C. $(-\\infty;2]$", "D. $[3;+\\infty)$"], "answer": "A", "explain": "$x^2-5x+6 = (x-2)(x-3) > 0 \\Leftrightarrow x<2$ hoặc $x>3$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai:", "statements": ["Với mọi biến cố $A$, $0\\le P(A)\\le 1$.", "$P(\\Omega) = 1$ và $P(\\varnothing) = 0$.", "Nếu $A$ và $B$ xung khắc thì $P(A\\cup B) = P(A)+P(B)$.", "
