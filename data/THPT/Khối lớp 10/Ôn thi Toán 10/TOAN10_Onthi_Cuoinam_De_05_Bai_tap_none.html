<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 5", "questions": [{"type": "mcq", "level": "TH", "q": "Tập nghiệm của $x^2 - 4x + 4 \\\\le 0$ là:", "options": ["A. $\\{2\\}$", "B. $\\mathbb{R}$", "C. $\\varnothing$", "D. $[2;+\\infty)$"], "answer": "A", "explain": "$x^2-4x+4 = (x-2)^2 \\le 0 \\Leftrightarrow x = 2$."}, {"type": "mcq", "level": "TH", "q": "Cho mệnh đề $P$: \"$\\pi > 3$\". Mệnh đề phủ định $\\overline{P}$ là:", "options": ["A. \"$\\pi \\le 3$\"", "B. \"$\\pi < 3$\"", "C. \"$\\pi \\ge 3$\"", "D. \"$\\pi = 3$\""], "answer": "A", "explain": "Phủ định của $>$ là $\\le$."}, {"type": "mcq", "level": "TH", "q": "Đường thẳng đi qua $M(0;3)$ và song song với $d: 2x-y+1=0$ có phương trình:", "options": ["A. $2x-y+3=0$", "B. $2x-y-3=0$", "C. $x+2y-6=0$", "D. $2x+y-3=0$"], "answer": "A", "explain": "Song song nên dạng $2x-y+c=0$; qua $(0;3)$: $-3+c=0\\Rightarrow c=3$."}, {"type": "mcq", "level": "TH", "q": "Cặp số nào sau đây là nghiệm của bất phương trình $4x + 2y < 8$?", "options": ["A. $(6;5)$", "B. $(6;2)$", "C. $(0;1)$", "D. $(2;1)$"], "answer": "C", "explain": "Thay $(0;1)$ vào: $4\\cdot0+2\\cdot1=2<8$ (đúng)."}, {"type": "mcq", "level": "VD", "q": "Khai triển $(x+1)^4$ có số hạng là:", "options": ["A. $x^4+4x^3+6x^2+4x+1$", "B. $x^4+3x^3+3x^2+x+1$", "C. $x^4+4x^3+4x^2+4x+1$", "D. $x^4+x^3+x^2+x+1$"], "answer": "A", "explain": "Dùng nhị thức Newton với các hệ số $C_4^0,\\dots,C_4^4 = 1,4,6,4,1$."}, {"type": "mcq", "level": "NB", "q": "$\\sin 90^\\circ + \\cos 180^\\circ$ bằng:", "options": ["A. $0$", "B. $1$", "C. $2$", "D. $-1$"], "answer": "A", "explain": "$\\sin 90^\\circ = 1$, $\\cos 180^\\circ = -1$ nên tổng bằng $0$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các khẳng định sau:", "statements": ["Trong mọi tam giác, $a^2 = b^2 + c^2 - 2bc\\cos A$.", "$\\sin 0^\\circ = 0$ và $\\cos 180^\\circ = -1$.", "Nếu $\\widehat{A} = 90^\\circ$ thì định lí cosin trở thành định lí Pythagore.", "$\\tan 90^\\circ = 1$."], "answer": ["T", "T", "T", "F"], "explain": "$\\tan 90^\\circ$ không xác định."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai:", "statements": ["Số trung bình nhạy cảm với các giá trị bất thường.", "Trung vị luôn bằng số trung bình.", "Phương sai càng lớn thì độ phân tán càng lớn.", "Mốt là giá trị xuất hiện nhiều nhất trong mẫu."], "answer": ["T", "F", "T", "T"], "explain": "Trung vị và số trung bình nói chung khác nhau; trung vị ít bị ảnh hưởng bởi giá trị bất thường."}, {"type": "short", "level": "VD", "q": "Cho $\\overrightarrow{a} = (2;3)$. Tìm tung độ $t$ của vectơ $\\overrightarrow{b} = (-3;t)$ để $\\overrightarrow{a} \\perp \\overrightarrow{b}$.", "answer": "2", "explain": "$\\overrightarrow{a}\\cdot\\overrightarrow{b} = 2\\cdot(-3)+3\\cdot t = 0 \\Rightarrow t = 2$."}, {"type": "short", "level": "VD", "q": "Gieo hai con xúc xắc cân đối. Gọi $P$ là xác suất tổng số chấm bằng $7$. Tính $36 \\times P$ (làm tròn đến số nguyên).", "answer": "6", "explain": "Các cặp $(1,6),(2,5),\\dots,(6,1)$: $6$ cặp. $P=\\frac{6}{36}=\\frac{1}{6}$ nên $36P = 6$."}]}]}</script>
