<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 10", "questions": [{"type": "mcq", "level": "VD", "q": "Khoảng cách từ điểm $M(0;0)$ đến đường thẳng $\\Delta: 3x+4y-10=0$ bằng:", "options": ["A. $2{,}5$", "B. $3$", "C. $2$", "D. $4$"], "answer": "C", "explain": "$d(M,\\Delta) = \\frac{|3\\cdot0+0-10|}{\\sqrt{3^2+4^2}} = \\frac{10}{\\sqrt{25}} = 2$."}, {"type": "mcq", "level": "TH", "q": "Cho $P(A)=0{,}3$. Xác suất của biến cố đối $\\overline{A}$ là:", "options": ["A. $0{,}7$", "B. $0{,}3$", "C. $1{,}3$", "D. $-0{,}3$"], "answer": "A", "explain": "$P(\\overline{A}) = 1-P(A) = 0{,}7$."}, {"type": "mcq", "level": "VD", "q": "Phương trình $\\sqrt{x+4} = 3$ có nghiệm là:", "options": ["A. $x=4$", "B. $x=6$", "C. $x=13$", "D. $x=5$"], "answer": "D", "explain": "Điều kiện $x\\ge -4$. Bình phương: $x+4 = 9 \\Rightarrow x = 5$ (thỏa mãn)."}, {"type": "mcq", "level": "VD", "q": "Hệ số của $x^2$ trong khai triển $(x+2)^4$ là:", "options": ["A. $24$", "B. $12$", "C. $16$", "D. $6$"], "answer": "A", "explain": "Số hạng chứa $x^2$: $C_4^2 x^2\\cdot 2^2 = 6\\cdot 4\\,x^2 = 24x^2$."}, {"type": "mcq", "level": "TH", "q": "Phương trình đường thẳng đi qua $A(1;2)$ và có vectơ chỉ phương $\\overrightarrow{u}=(2;1)$ là:", "options": ["A. $\\frac{x-1}{2}=\\frac{y-2}{1}$", "B. $\\frac{x-2}{1}=\\frac{y-1}{2}$", "C. $x-2y+3=0$", "D. $2x+y-4=0$"], "answer": "A", "explain": "Phương trình chính tắc: $\\frac{x-1}{2}=\\frac{y-2}{1}$."}, {"type": "mcq", "level": "NB", "q": "Một hộp có $3$ bi xanh, $2$ bi đỏ. Lấy ngẫu nhiên $1$ bi. Xác suất được bi xanh là:", "options": ["A. $\\frac{3}{5}$", "B. $\\frac{2}{5}$", "C. $\\frac{1}{2}$", "D. $\\frac{3}{2}$"], "answer": "A", "explain": "$P = \\frac{3}{3+2} = \\frac{3}{5}$."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai:", "statements": ["$C_n^k = C_n^{n-k}$ với mọi $0\\le k\\le n$.", "$A_n^k = k!\\cdot C_n^k$.", "$P_n = n\\cdot P_{n-1}$.", "Thứ tự không quan trọng khi dùng chỉnh hợp."], "answer": ["T",
