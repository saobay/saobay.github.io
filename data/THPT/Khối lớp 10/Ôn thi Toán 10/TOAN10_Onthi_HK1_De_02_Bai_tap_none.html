<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 2", "questions": [{"type": "mcq", "level": "TH", "q": "Cho $\\overrightarrow{a} = (2;3)$, $\\overrightarrow{b} = (-3;-3)$. Tích vô hướng $\\overrightarrow{a} \\cdot \\overrightarrow{b}$ bằng:", "options": ["A. $-16$", "B. $-15$", "C. $-14$", "D. $-13$"], "answer": "B", "explain": "$\\overrightarrow{a}\\cdot\\overrightarrow{b} = 2\\cdot-3+3\\cdot-3 = -15$."}, {"type": "mcq", "level": "NB", "q": "Điểm nào sau đây KHÔNG thuộc miền nghiệm của bất phương trình $2x - y > 1$?", "options": ["A. $(2;1)$", "B. $(0;0)$", "C. $(3;0)$", "D. $(1;-2)$"], "answer": "B", "explain": "$2\\cdot 0-0=0 \\ngtr 1$ nên $(0;0)$ không thuộc miền nghiệm."}, {"type": "mcq", "level": "TH", "q": "Trung vị của mẫu số liệu $3,9,14,16,18$ (đã sắp xếp) là:", "options": ["A. $15$", "B. $13$", "C. $14$", "D. $3$"], "answer": "C", "explain": "Cỡ mẫu $n=5$ lẻ, trung vị là giá trị thứ $3$, tức là $14$."}, {"type": "mcq", "level": "NB", "q": "Mệnh đề nào sau đây đúng?", "options": ["A. $\\forall n \\in \\mathbb{N}, n^2 \\vdots 2$", "B. $\\exists x \\in \\mathbb{R}, x^2 < 0$", "C. $\\forall x \\in \\mathbb{R}, x^2 \\ge 0$", "D. $\\exists n \\in \\mathbb{N}, n < 0$"], "answer": "C", "explain": "Với mọi số thực $x$, $x^2 \\ge 0$ luôn đúng."}, {"type": "mcq", "level": "TH", "q": "Cho tam giác $ABC$ có $\\widehat{A} = 30^\\circ$, bán kính đường tròn ngoại tiếp $R = 6$. Độ dài cạnh $a$ bằng:", "options": ["A. $18$", "B. $\\frac{6}{2}$", "C. $12$", "D. $6$"], "answer": "D", "explain": "Theo định lí sin: $\\frac{a}{\\sin A} = 2R \\Rightarrow a = 2R\\sin 30^\\circ = 6$."}, {"type": "mcq", "level": "NB", "q": "Cho hình bình hành $ABCD$. Vectơ nào sau đây bằng vectơ $\\overrightarrow{AB}$?", "options": ["A. $\\overrightarrow{DC}$", "B. $\\overrightarrow{BA}$", "C. $\\overrightarrow{CD}$", "D. $\\overrightarrow{AD}$"], "answer": "A", "explain": "Trong hình bình hành, $\\overrightarrow{AB} = \\overrightarrow{DC}$ (cùng hướng, cùng độ dài)."}, {"type": "truefalse", "level": "TH", "q": "Xét bất phương trình $3x + 1y < 4$. Xét tính đúng sai:", "statements": ["$(0;0)$ là nghiệm của $3x+1y<4$.", "$(4;0)$ là nghiệm của $3x+1y<4$.", "Miền nghiệm của $3x+1y<4$ là nửa mặt phẳng không chứa điểm $(5;5)$.", "Đường thẳng $3x+1y=4$ là bờ của miền nghiệm."], "answer": ["T", "F", "T", "T"], "explain": "Thay $(0;0)$: $0<4$ đúng. Thay $(4;0)$: $12<4$ sai vì $a\\ge 1$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai:", "statements": ["Số trung bình nhạy cảm với các giá trị bất thường.", "Trung vị luôn bằng số trung bình.", "Phương sai càng lớn thì độ phân tán càng lớn.", "Mốt là giá trị xuất hiện nhiều nhất trong mẫu."], "answer": ["T", "F", "T", "T"], "explain": "Trung vị và số trung bình nói chung khác nhau; trung vị ít bị ảnh hưởng bởi giá trị bất thường."}, {"type": "short", "level": "NB", "q": "Một tập hợp có $4$ phần tử thì có bao nhiêu tập con gồm đúng $1$ phần tử?", "answer": "4", "explain": "Số tập con $1$ phần tử bằng số phần tử của tập hợp, tức là $4$."}, {"type": "short", "level": "VD", "q": "Cho $\\overrightarrow{a} = (3;4)$. Tìm tung độ $t$ của vectơ $\\overrightarrow{b} = (-4;t)$ để $\\overrightarrow{a} \\perp \\overrightarrow{b}$.", "answer": "3", "explain": "$\\overrightarrow{a}\\cdot\\overrightarrow{b} = 3\\cdot(-4)+4\\cdot t = 0 \\Rightarrow t = 3$."}]}]}</script>
