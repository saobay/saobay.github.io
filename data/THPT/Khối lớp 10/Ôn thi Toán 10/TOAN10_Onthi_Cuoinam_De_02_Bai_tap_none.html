<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 2", "questions": [{"type": "mcq", "level": "TH", "q": "Cho $\\overrightarrow{a} = (-1;3)$, $\\overrightarrow{b} = (-2;3)$. Tích vô hướng $\\overrightarrow{a} \\cdot \\overrightarrow{b}$ bằng:", "options": ["A. $-7$", "B. $12$", "C. $11$", "D. $10$"], "answer": "C", "explain": "$\\overrightarrow{a}\\cdot\\overrightarrow{b} = -1\\cdot-2+3\\cdot3 = 11$."}, {"type": "mcq", "level": "VD", "q": "Khoảng cách từ điểm $M(2;1)$ đến đường thẳng $\\Delta: 3x+4y+5=0$ bằng:", "options": ["A. $4$", "B. $5$", "C. $3{,}5$", "D. $3$"], "answer": "D", "explain": "$d(M,\\Delta) = \\frac{|3\\cdot2+4+5|}{\\sqrt{3^2+4^2}} = \\frac{15}{\\sqrt{25}} = 3$."}, {"type": "mcq", "level": "VD", "q": "Phương sai của mẫu số liệu $1,2,3,4,5$ là:", "options": ["A. $3$", "B. $4$", "C. $1$", "D. $2$"], "answer": "D", "explain": "$\\overline{x}=3$; $s^2=\\frac{(1-3)^2+(2-3)^2+0+1+4}{5}=\\frac{10}{5}=2$."}, {"type": "mcq", "level": "VD", "q": "Hệ số của $x^2$ trong khai triển $(x+2)^4$ là:", "options": ["A. $24$", "B. $12$", "C. $16$", "D. $6$"], "answer": "A", "explain": "Số hạng chứa $x^2$: $C_4^2 x^2\\cdot 2^2 = 6\\cdot 4\\,x^2 = 24x^2$."}, {"type": "mcq", "level": "NB", "q": "Gieo một con xúc xắc cân đối. Xác suất xuất hiện mặt $6$ chấm là:", "options": ["A. $\\frac{1}{6}$", "B. $\\frac{1}{2}$", "C. $\\frac{1}{3}$", "D. $1$"], "answer": "A", "explain": "$n(\\Omega)=6$, $n(A)=1$ nên $P=\\frac{1}{6}$."}, {"type": "mcq", "level": "TH", "q": "Cho tam giác $ABC$ có $a = 3$, $b = 4$, $\\widehat{C} = 90^\\circ$. Độ dài cạnh $c$ bằng:", "options": ["A. $4$", "B. $5$", "C. $7$", "D. $6$"], "answer": "B", "explain": "$c^2 = 3^2+4^2-2\\cdot3\\cdot4\\cdot\\cos90^\\circ = 25$ nên $c=5$."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai:", "statements": ["Mọi đường thẳng đều có phương trình tổng quát $ax+by+c=0$ ($a^2+b^2\\ne 0$).", "Vectơ chỉ phương của đường thẳng vuông góc với vectơ pháp tuyến của nó.", "Khoảng cách t
