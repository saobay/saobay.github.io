<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 3", "questions": [{"type": "mcq", "level": "TH", "q": "Cho tam giác $ABC$ có $\\widehat{A} = 30^\\circ$, bán kính đường tròn ngoại tiếp $R = 10$. Độ dài cạnh $a$ bằng:", "options": ["A. $\\frac{10}{2}$", "B. $20$", "C. $30$", "D. $10$"], "answer": "D", "explain": "Theo định lí sin: $\\frac{a}{\\sin A} = 2R \\Rightarrow a = 2R\\sin 30^\\circ = 10$."}, {"type": "mcq", "level": "NB", "q": "Cho ba điểm $A, B, C$. $\\overrightarrow{AB} + \\overrightarrow{BC}$ bằng:", "options": ["A. $\\overrightarrow{AC}$", "B. $\\overrightarrow{CA}$", "C. $\\overrightarrow{0}$", "D. $2\\overrightarrow{AB}$"], "answer": "A", "explain": "Quy tắc ba điểm: $\\overrightarrow{AB}+\\overrightarrow{BC}=\\overrightarrow{AC}$."}, {"type": "mcq", "level": "TH", "q": "Cặp số nào sau đây là nghiệm của bất phương trình $4x + 1y < 7$?", "options": ["A. $(6;5)$", "B. $(3;6)$", "C. $(1;2)$", "D. $(6;1)$"], "answer": "C", "explain": "Thay $(1;2)$ vào: $4\\cdot1+1\\cdot2=6<7$ (đúng)."}, {"type": "mcq", "level": "TH", "q": "Cho $A = \\{1,2,7\\}$, $B = \\{6,8,9\\}$. Tập $A \\cup B$ là:", "options": ["A. $\\{1,2,6,7,8,9\\}$", "B. $\\{6,8,9\\}$", "C. $\\varnothing$", "D. $\\{1,2,7\\}$"], "answer": "A", "explain": "Tính trực tiếp được kết quả $$\\{1,2,6,7,8,9\\}$$."}, {"type": "mcq", "level": "TH", "q": "Trung vị của mẫu số liệu $2,6,7,9,14$ (đã sắp xếp) là:", "options": ["A. $2$", "B. $7$", "C. $8$", "D. $6$"], "answer": "B", "explain": "Cỡ mẫu $n=5$ lẻ, trung vị là giá trị thứ $3$, tức là $7$."}, {"type": "mcq", "level": "NB", "q": "$\\sin 90^\\circ + \\cos 180^\\circ$ bằng:", "options": ["A. $0$", "B. $1$", "C. $2$", "D. $-1$"], "answer": "A", "explain": "$\\sin 90^\\circ = 1$, $\\cos 180^\\circ = -1$ nên tổng bằng $0$."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai:", "statements": ["Hai vectơ cùng phương thì cùng hướng.", "$\\overrightarrow{0}$ cùng phương với mọi vectơ.", "Nếu $\\overrightarrow{AB} = \\overrightarrow{CD}$ thì $ABCD$ là hình bình hành.", "Với mọi $\\overrightarrow{a}$, ta có $\\overrightarrow{a} + (-\\overrightarrow{a}) = \\overrightarrow{0}$."], "answer": ["F", "T", "F", "T"], "explain": "Cùng phương gồm cùng hướng HOẶC ngược hướng. $\\overrightarrow{AB}=\\overrightarrow{CD}$ chỉ suy ra $ABDC$ là hình bình hành khi $A,B,C,D$ không thẳng hàng."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai:", "statements": ["Số trung bình nhạy cảm với các giá trị bất thường.", "Trung vị luôn bằng số trung bình.", "Phương sai càng lớn thì độ phân tán càng lớn.", "Mốt là giá trị xuất hiện nhiều nhất trong mẫu."], "answer": ["T", "F", "T", "T"], "explain": "Trung vị và số trung bình nói chung khác nhau; trung vị ít bị ảnh hưởng bởi giá trị bất thường."}, {"type": "short", "level": "TH", "q": "Cho tam giác $ABC$ có $AB = 8$, $AC = 10$, $\\widehat{A} = 30^\\circ$. Diện tích tam giác bằng bao nhiêu (đơn vị diện tích)?", "answer": "20", "explain": "$S=\\frac{1}{2}\\cdot8\\cdot10\\cdot\\frac{1}{2}=20$."}, {"type": "short", "level": "NB", "q": "Một tập hợp có $3$ phần tử thì có bao nhiêu tập con gồm đúng $1$ phần tử?", "answer": "3", "explain": "Số tập con $1$ phần tử bằng số phần tử của tập hợp, tức là $3$."}]}]}</script>
