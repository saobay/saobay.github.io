<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 5", "questions": [{"type": "mcq", "level": "TH", "q": "Cho tam giác $ABC$ có $\\widehat{A} = 30^\\circ$, bán kính đường tròn ngoại tiếp $R = 5$. Độ dài cạnh $a$ bằng:", "options": ["A. $\\frac{5}{2}$", "B. $5$", "C. $10$", "D. $15$"], "answer": "B", "explain": "Theo định lí sin: $\\frac{a}{\\sin A} = 2R \\Rightarrow a = 2R\\sin 30^\\circ = 5$."}, {"type": "mcq", "level": "NB", "q": "Cho $\\overrightarrow{a} = (1;2)$, $\\overrightarrow{b} = (3;4)$. Tọa độ $\\overrightarrow{a} + \\overrightarrow{b}$ là:", "options": ["A. $(4;6)$", "B. $(3;8)$", "C. $(2;2)$", "D. $(-2;-2)$"], "answer": "A", "explain": "$\\overrightarrow{a}+\\overrightarrow{b} = (1+3; 2+4) = (4;6)$."}, {"type": "mcq", "level": "VD", "q": "Phương sai của mẫu số liệu $2,4,4,4,6$ là:", "options": ["A. $1{,}6$", "B. $3{,}2$", "C. $0{,}6$", "D. $2{,}6$"], "answer": "A", "explain": "$\\overline{x}=4$; $s^2=\\frac{4+0+0+0+4}{5}=1{,}6$."}, {"type": "mcq", "level": "TH", "q": "Cho $A = \\{5,6,8\\}$, $B = \\{2,5,7\\}$. Tập $A \\cap B$ là:", "options": ["A. $\\{5\\}$", "B. $\\{6,8\\}$", "C. $\\varnothing$", "D. $\\{2,5,6,7,8\\}$"], "answer": "A", "explain": "Tính trực tiếp được kết quả $$\\{5\\}$$."}, {"type": "mcq", "level": "TH", "q": "Cặp số nào sau đây là nghiệm của bất phương trình $3x + 2y < 10$?", "options": ["A. $(6;1)$", "B. $(3;3)$", "C. $(1;0)$", "D. $(4;0)$"], "answer": "C", "explain": "Thay $(1;0)$ vào: $3\\cdot1+2\\cdot0=3<10$ (đúng)."}, {"type": "mcq", "level": "TH", "q": "Cho tam giác $ABC$ có $a = 6$, $b = 8$, $\\widehat{C} = 90^\\circ$. Độ dài cạnh $c$ bằng:", "options": ["A. $10$", "B. $9$", "C. $11$", "D. $12$"], "answer": "A", "explain": "$c^2 = 6^2+8^2 = 100$ nên $c=10$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các khẳng định sau:", "statements": ["Trong mọi tam giác, $a^2 = b^2 + c^2 - 2bc\\cos A$.", "$\\sin 0^\\circ = 0$ và $\\cos 180^\\circ = -1$.", "Nếu $\\widehat{A} = 90^\\circ$ thì định lí cosin trở thành định lí Pythagore.", "$\\tan 90^\\circ = 1$."], "answer": ["T", "T", "T", "F"], "explain": "$\\tan 90^\\circ$ không xác định."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai:", "statements": ["Hai vectơ cùng phương thì cùng hướng.", "$\\overrightarrow{0}$ cùng phương với mọi vectơ.", "Nếu $\\overrightarrow{AB} = \\overrightarrow{CD}$ thì $ABCD$ là hình bình hành.", "Với mọi $\\overrightarrow{a}$, ta có $\\overrightarrow{a} + (-\\overrightarrow{a}) = \\overrightarrow{0}$."], "answer": ["F", "T", "F", "T"], "explain": "Cùng phương gồm cùng hướng HOẶC ngược hướng. $\\overrightarrow{AB}=\\overrightarrow{CD}$ chỉ suy ra $ABDC$ là hình bình hành khi $A,B,C,D$ không thẳng hàng."}, {"type": "short", "level": "VD", "q": "Một xưởng sản xuất hai loại sản phẩm. Mỗi đơn vị loại I lãi $3$ triệu, loại II lãi $5$ triệu. Gọi $x, y$ lần lượt là số đơn vị loại I, II ($x, y \\ge 0$, $x + y \\le 4$). Lợi nhuận lớn nhất (triệu đồng) đạt được là bao nhiêu?", "answer": "20", "explain": "Lợi nhuận $L = 3x + 5y$ với $x+y\\le 4$, $x,y\\ge 0$. Vì hệ số của $y$ lớn hơn nên cho $x=0, y=4$: $L_{max} = 20$ triệu đồng."}, {"type": "short", "level": "NB", "q": "Một tập hợp có $5$ phần tử thì có bao nhiêu tập con gồm đúng $1$ phần tử?", "answer": "5", "explain": "Số tập con $1$ phần tử bằng số phần tử của tập hợp, tức là $5$."}]}]}</script>
