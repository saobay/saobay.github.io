<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 7", "questions": [{"type": "mcq", "level": "VD", "q": "Phương trình $\\sqrt{x+2} = 2$ có nghiệm là:", "options": ["A. $x=3$", "B. $x=1$", "C. $x=6$", "D. $x=2$"], "answer": "D", "explain": "Điều kiện $x\\ge -2$. Bình phương: $x+2 = 4 \\Rightarrow x = 2$ (thỏa mãn)."}, {"type": "mcq", "level": "VD", "q": "Một hộp có $5$ bi xanh và $4$ bi đỏ. Lấy ngẫu nhiên $2$ bi. Xác suất để được $2$ bi xanh là:", "options": ["A. $\\frac{10}{37}$", "B. $\\frac{11}{36}$", "C. $\\frac{1}{36}$", "D. $\\frac{5}{18}$"], "answer": "D", "explain": "$n(\\Omega)=C_9^2=36$, $n(A)=C_5^2=10$ nên $P=$\\frac{5}{18}$$."}, {"type": "mcq", "level": "TH", "q": "Phương trình đường thẳng đi qua $A(1;2)$ và có vectơ chỉ phương $\\overrightarrow{u}=(2;1)$ là:", "options": ["A. $\\frac{x-1}{2}=\\frac{y-2}{1}$", "B. $\\frac{x-2}{1}=\\frac{y-1}{2}$", "C. $x-2y+3=0$", "D. $2x+y-4=0$"], "answer": "A", "explain": "Phương trình chính tắc: $\\frac{x-1}{2}=\\frac{y-2}{1}$."}, {"type": "mcq", "level": "NB", "q": "Gieo một con xúc xắc và một đồng xu. Số kết quả có thể là:", "options": ["A. $12$", "B. $8$", "C. $6$", "D. $36$"], "answer": "A", "explain": "Quy tắc nhân: $6\\cdot 2 = 12$."}, {"type": "mcq", "level": "TH", "q": "Tập nghiệm của bất phương trình $x^2 - 5x + 6 > 0$ là:", "options": ["A. $(-\\infty;2)\\cup(3;+\\infty)$", "B. $(2;3)$", "C. $(-\\infty;2]$", "D. $[3;+\\infty)$"], "answer": "A", "explain": "$x^2-5x+6 = (x-2)(x-3) > 0 \\Leftrightarrow x<2$ hoặc $x>3$."}, {"type": "mcq", "level": "TH", "q": "Gieo xúc xắc $1$ lần. Xác suất xuất hiện mặt có số chấm KHÔNG vượt quá $4$ là:", "options": ["A. $\\frac{2}{3}$", "B. $\\frac{1}{3}$", "C. $\\frac{1}{2}$", "D. $\\frac{5}{6}$"], "answer": "A", "explain": "Các mặt $1,2,3,4$: $P=\\frac{4}{6}=\\frac{2}{3}$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai:", "statements": ["Với mọi biến cố $A$, $0\\le P(A)\\le 1$.", "$P(\\Omega) = 1$ và $P(\\varnothing) = 0$.", "Nếu
