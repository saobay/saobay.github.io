<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Cho ba điểm $A, B, C$. $\\overrightarrow{AB} + \\overrightarrow{BC}$ bằng:", "options": ["A. $\\overrightarrow{AC}$", "B. $\\overrightarrow{CA}$", "C. $\\overrightarrow{0}$", "D. $2\\overrightarrow{AB}$"], "answer": "A", "explain": "Quy tắc ba điểm: $\\overrightarrow{AB}+\\overrightarrow{BC}=\\overrightarrow{AC}$."}, {"type": "mcq", "level": "NB", "q": "Điểm nào sau đây KHÔNG thuộc miền nghiệm của bất phương trình $2x - y > 1$?", "options": ["A. $(2;1)$", "B. $(0;0)$", "C. $(3;0)$", "D. $(1;-2)$"], "answer": "B", "explain": "$2\\cdot 0-0=0 \\ngtr 1$ nên $(0;0)$ không thuộc miền nghiệm."}, {"type": "mcq", "level": "TH", "q": "Cho tam giác $ABC$ có $\\widehat{A} = 30^\\circ$, bán kính đường tròn ngoại tiếp $R = 5$. Độ dài cạnh $a$ bằng:", "options": ["A. $\\frac{5}{2}$", "B. $10$", "C. $5$", "D. $15$"], "answer": "C", "explain": "Theo định lí sin: $\\frac{a}{\\sin A} = 2R \\Rightarrow a = 2R\\sin 30^\\circ = 5$."}, {"type": "mcq", "level": "VD", "q": "Phương sai của mẫu số liệu $1,2,3,4,5$ là:", "options": ["A. $1$", "B. $3$", "C. $2$", "D. $4$"], "answer": "C", "explain": "$\\overline{x}=3$; $s^2=\\frac{(1-3)^2+(2-3)^2+0+1+4}{5}=\\frac{10}{5}=2$."}, {"type": "mcq", "level": "NB", "q": "Mệnh đề nào sau đây là mệnh đề sai?", "options": ["A. $(-3)^2 = 9$", "B. $\\sqrt{9} = 3$", "C. $1 + 1 = 3$", "D. $0 < 1$"], "answer": "C", "explain": "$1+1=2 \\ne 3$ nên đây là mệnh đề sai."}, {"type": "mcq", "level": "TH", "q": "Cho $\\overrightarrow{a} = (0;1)$, $\\overrightarrow{b} = (3;3)$. Tích vô hướng $\\overrightarrow{a} \\cdot \\overrightarrow{b}$ bằng:", "options": ["A. $-3$", "B. $4$", "C. $3$", "D. $2$"], "answer": "C", "explain": "$\\overrightarrow{a}\\cdot\\overrightarrow{b} = 0\\cdot3+1\\cdot3 = 3$."}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai:", "statements": ["Số trung bình nhạy cảm với các giá trị bất thường.", "Trung vị luôn bằng số trung bình.", "Phương sai càng lớn thì độ phân tán càng lớn.", "Mốt là giá trị xuất hiện nhiều nhất trong mẫu."], "answer": ["T", "F", "T", "T"], "explain": "Trung vị và số trung bình nói chung khác nhau; trung vị ít bị ảnh hưởng bởi giá trị bất thường."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai:", "statements": ["Hai vectơ cùng phương thì cùng hướng.", "$\\overrightarrow{0}$ cùng phương với mọi vectơ.", "Nếu $\\overrightarrow{AB} = \\overrightarrow{CD}$ thì $ABCD$ là hình bình hành.", "Với mọi $\\overrightarrow{a}$, ta có $\\overrightarrow{a} + (-\\overrightarrow{a}) = \\overrightarrow{0}$."], "answer": ["F", "T", "F", "T"], "explain": "Cùng phương gồm cùng hướng HOẶC ngược hướng. $\\overrightarrow{AB}=\\overrightarrow{CD}$ chỉ suy ra $ABDC$ là hình bình hành khi $A,B,C,D$ không thẳng hàng."}, {"type": "short", "level": "NB", "q": "Một tập hợp có $4$ phần tử thì có bao nhiêu tập con gồm đúng $1$ phần tử?", "answer": "4", "explain": "Số tập con $1$ phần tử bằng số phần tử của tập hợp, tức là $4$."}, {"type": "short", "level": "VD", "q": "Một xưởng sản xuất hai loại sản phẩm. Mỗi đơn vị loại I lãi $3$ triệu, loại II lãi $5$ triệu. Gọi $x, y$ lần lượt là số đơn vị loại I, II ($x, y \\ge 0$, $x + y \\le 4$). Lợi nhuận lớn nhất (triệu đồng) đạt được là bao nhiêu?", "answer": "20", "explain": "Lợi nhuận $L = 3x + 5y$ với $x+y\\le 4$, $x,y\\ge 0$. Vì hệ số của $y$ lớn hơn nên cho $x=0, y=4$: $L_{max} = 20$ triệu đồng."}]}]}</script>
