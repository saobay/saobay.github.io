<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 2", "questions": [{"type": "mcq", "level": "VD", "q": "Khoảng cách từ điểm $M(0;0)$ đến đường thẳng $\\Delta: 3x+4y-10=0$ bằng:", "options": ["A. $2{,}5$", "B. $2$", "C. $3$", "D. $4$"], "answer": "B", "explain": "$d(M,\\Delta) = \\frac{|3\\cdot0+0-10|}{\\sqrt{3^2+4^2}} = \\frac{10}{\\sqrt{25}} = 2$."}, {"type": "mcq", "level": "VD", "q": "Tổng các hệ số trong khai triển $(2x+1)^3$ bằng:", "options": ["A. $27$", "B. $9$", "C. $8$", "D. $1$"], "answer": "A", "explain": "Cho $x=1$: $(2+1)^3 = 27$."}, {"type": "mcq", "level": "VD", "q": "Phương trình $\\sqrt{x+3} = 3$ có nghiệm là:", "options": ["A. $x=5$", "B. $x=6$", "C. $x=7$", "D. $x=12$"], "answer": "B", "explain": "Điều kiện $x\\ge -3$. Bình phương: $x+3 = 9 \\Rightarrow x = 6$ (thỏa mãn)."}, {"type": "mcq", "level": "VD", "q": "Một hộp có $4$ bi xanh và $4$ bi đỏ. Lấy ngẫu nhiên $2$ bi. Xác suất để được $2$ bi xanh là:", "options": ["A. $\\frac{3}{14}$", "B. $\\frac{1}{2}$", "C. $\\frac{1}{28}$", "D. $\\frac{1}{4}$"], "answer": "A", "explain": "$n(\\Omega)=C_8^2=28$, $n(A)=C_4^2=6$ nên $P=$\\frac{3}{14}$$."}, {"type": "mcq", "level": "TH", "q": "Phương trình đường thẳng đi qua $A(1;2)$ và có vectơ chỉ phương $\\overrightarrow{u}=(2;1)$ là:", "options": ["A. $\\frac{x-1}{2}=\\frac{y-2}{1}$", "B. $\\frac{x-2}{1}=\\frac{y-1}{2}$", "C. $x-2y+3=0$", "D. $2x+y-4=0$"], "answer": "A", "explain": "Phương trình chính tắc: $\\frac{x-1}{2}=\\frac{y-2}{1}$."}, {"type": "mcq", "level": "TH", "q": "$A_5^{3}$ bằng:", "options": ["A. $61$", "B. $60$", "C. $59$", "D. $65$"], "answer": "B", "explain": "$A_5^{3} = \\frac{5!}{(5-3)!} = 60$."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai:", "statements": ["Mọi đường thẳng đều có phương trình tổng quát $ax+by+c=0$ ($a^2+b^2\\ne 0$).", "Vectơ chỉ phương của đường thẳng vuông góc với vectơ pháp tuyến của nó.", "Khoảng cách từ $O(0;0)$ đến $\\Delta: 3x+4y-10=0$ bằng $2$.", "Đường tròn $x^2+
