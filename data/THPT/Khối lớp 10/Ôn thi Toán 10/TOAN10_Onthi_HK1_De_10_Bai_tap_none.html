<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 10", "questions": [{"type": "mcq", "level": "TH", "q": "Cặp số nào sau đây là nghiệm của bất phương trình $2x + 1y < 6$?", "options": ["A. $(4;0)$", "B. $(4;4)$", "C. $(4;6)$", "D. $(0;0)$"], "answer": "D", "explain": "Thay $(0;0)$ vào: $2\\cdot0+1\\cdot0=0<6$ (đúng)."}, {"type": "mcq", "level": "TH", "q": "Trung vị của mẫu số liệu $8,10,14,18,19$ (đã sắp xếp) là:", "options": ["A. $13$", "B. $14$", "C. $15$", "D. $8$"], "answer": "B", "explain": "Cỡ mẫu $n=5$ lẻ, trung vị là giá trị thứ $3$, tức là $14$."}, {"type": "mcq", "level": "TH", "q": "Cho $\\overrightarrow{a} = (2;-3)$, $\\overrightarrow{b} = (2;0)$. Tích vô hướng $\\overrightarrow{a} \\cdot \\overrightarrow{b}$ bằng:", "options": ["A. $5$", "B. $4$", "C. $3$", "D. $6$"], "answer": "B", "explain": "$\\overrightarrow{a}\\cdot\\overrightarrow{b} = 2\\cdot2+-3\\cdot0 = 4$."}, {"type": "mcq", "level": "TH", "q": "Cho tam giác $ABC$ có $\\widehat{A} = 30^\\circ$, bán kính đường tròn ngoại tiếp $R = 5$. Độ dài cạnh $a$ bằng:", "options": ["A. $10$", "B. $15$", "C. $\\frac{5}{2}$", "D. $5$"], "answer": "D", "explain": "Theo định lí sin: $\\frac{a}{\\sin A} = 2R \\Rightarrow a = 2R\\sin 30^\\circ = 5$."}, {"type": "mcq", "level": "TH", "q": "Mệnh đề phủ định của \"$\\exists n \\in \\mathbb{N}, n$ chia hết cho $3$\" là:", "options": ["A. \"$\\forall n \\in \\mathbb{N}, n$ không chia hết cho $3$\"", "B. \"$\\exists n \\in \\mathbb{N}, n$ không chia hết cho $3$\"", "C. \"$\\forall n \\in \\mathbb{N}, n$ chia hết cho $3$\"", "D. \"$\\exists n \\notin \\mathbb{N}, n$ chia hết cho $3$\""], "answer": "A", "explain": "Phủ định của $\\exists$ là $\\forall$ và phủ định của khẳng định."}, {"type": "mcq", "level": "NB", "q": "Miền nghiệm của bất phương trình $x + y \\le 4$ chứa điểm nào sau đây?", "options": ["A. $(1;2)$", "B. $(3;3)$", "C. $(5;0)$", "D. $(0;5)$"], "answer": "A", "explain": "$1+2=3 \\le 4$ nên $(1;2)$ thuộc miền nghiệm."}, {"type": "truefalse", "level": "TH", "q": "Cho $A = \\{1,4,6,10\\}$, $B = \\{2,6,8,10\\}$. Xét tính đúng sai:", "statements": ["$A \\cap B$ có $2$ phần tử.", "$A \\cup B$ có $6$ phần tử.", "$A \\setminus B = \\{1,4\\}$.", "$1 \\in A \\cap B$."], "answer": ["T", "T", "T", "F"], "explain": "$A\\cap B = \\{6,10\\}$, $A\\cup B$ có $6$ phần tử, $A\\setminus B = \\{1,4\\}$."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai:", "statements": ["Hai vectơ cùng phương thì cùng hướng.", "$\\overrightarrow{0}$ cùng phương với mọi vectơ.", "Nếu $\\overrightarrow{AB} = \\overrightarrow{CD}$ thì $ABCD$ là hình bình hành.", "Với mọi $\\overrightarrow{a}$, ta có $\\overrightarrow{a} + (-\\overrightarrow{a}) = \\overrightarrow{0}$."], "answer": ["F", "T", "F", "T"], "explain": "Cùng phương gồm cùng hướng HOẶC ngược hướng. $\\overrightarrow{AB}=\\overrightarrow{CD}$ chỉ suy ra $ABDC$ là hình bình hành khi $A,B,C,D$ không thẳng hàng."}, {"type": "short", "level": "TH", "q": "Cho tam giác $ABC$ có $AB = 4$, $AC = 6$, $\\widehat{A} = 30^\\circ$. Diện tích tam giác bằng bao nhiêu (đơn vị diện tích)?", "answer": "6", "explain": "$S=\\frac{1}{2}\\cdot4\\cdot6\\cdot\\sin30^\\circ=6$."}, {"type": "short", "level": "VD", "q": "Một xưởng sản xuất hai loại sản phẩm. Mỗi đơn vị loại I lãi $3$ triệu, loại II lãi $5$ triệu. Gọi $x, y$ lần lượt là số đơn vị loại I, II ($x, y \\ge 0$, $x + y \\le 4$). Lợi nhuận lớn nhất (triệu đồng) đạt được là bao nhiêu?", "answer": "20", "explain": "Lợi nhuận $L = 3x + 5y$ với $x+y\\le 4$, $x,y\\ge 0$. Vì hệ số của $y$ lớn hơn nên cho $x=0, y=4$: $L_{max} = 20$ triệu đồng."}]}]}</script>
