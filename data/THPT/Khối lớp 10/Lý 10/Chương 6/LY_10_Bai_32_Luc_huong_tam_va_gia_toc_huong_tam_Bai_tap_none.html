{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Trong chuyển động tròn đều, gia tốc của vật","options": ["A. hướng vào tâm quỹ đạo.","B. hướng ra xa tâm quỹ đạo.","C. tiếp tuyến với quỹ đạo.","D. bằng 0."],"answer": "A","explain": "Gia tốc hướng tâm luôn hướng vào tâm.","points": 0.25},{"type": "mcq","level": "NB","q": "Biểu thức tính độ lớn gia tốc hướng tâm là","options": ["A. $a_{ht} = \\frac{v^2}{r}$.","B. $a_{ht} = vr$.","C. $a_{ht} = \\frac{r}{v^2}$.","D. $a_{ht} = v^2r$."],"answer": "A","explain": "$a_{ht} = v^2/r = \\omega^2 r$.","points": 0.25},{"type": "mcq","level": "NB","q": "Lực hướng tâm là","options": ["A. hợp lực tác dụng lên vật, gây ra gia tốc hướng tâm.","B. một loại lực mới xuất hiện trong chuyển động tròn.","C. lực ma sát duy nhất.","D. lực luôn cân bằng với trọng lực."],"answer": "A","explain": "Lực hướng tâm là hợp lực, không phải lực mới.","points": 0.25},{"type": "mcq","level": "NB","q": "Biểu thức tính độ lớn lực hướng tâm là","options": ["A. $F_{ht} = m\\frac{v^2}{r}$.","B. $F_{ht} = \\frac{mr}{v^2}$.","C. $F_{ht} = mv^2r$.","D. $F_{ht} = \\frac{v^2}{mr}$."],"answer": "A","explain": "$F_{ht} = ma_{ht} = mv^2/r$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $0,5\\ \\text{kg}$ chuyển động tròn đều với tốc độ $4\\ \\text{m/s}$ trên đường tròn bán kính $0,8\\ \\text{m}$. Độ lớn lực hướng tâm tác dụng lên vật bằng","options": ["A. $10\\ \\text{N}$.","B. $2,5\\ \\text{N}$.","C. $1,6\\ \\text{N}$.","D. $40\\ \\text{N}$."],"answer": "A","explain": "$F_{ht} = 0,5 \\cdot 16/0,8 = 10\\ \\text{N}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một chất điểm chuyển động tròn đều với tốc độ góc $5\\ \\text{rad/s}$ trên đường tròn bán kính $0,4\\ \\text{m}$. Độ lớn gia tốc hướng tâm bằng","options": ["A. $10\\ \\text{m/s}^2$.","B. $2\\ \\text{m/s}^2$.","C. $25\\ \\text{m/s}^2$.","D. $0,08\\ \\text{m/s}^2$."],"answer": "A","explain": "$a_{ht} = \\omega^2 r = 25 \\cdot 0,4 = 10\\ \\text{m/s}^2$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Gia tốc hướng tâm đặc trưng cho sự thay đổi hướng của vận tốc.","b) Trong chuyển động tròn đều, độ lớn gia tốc hướng tâm không đổi.","c) Lực hướng tâm là một loại lực cơ học mới.","d) Vệ tinh chuyển động tròn quanh Trái Đất nhờ lực hấp dẫn đóng vai trò lực hướng tâm."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng: $v, r$ không đổi. c) Sai: là hợp lực. d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Một ô tô khối lượng $1200\\ \\text{kg}$ đi qua đoạn đường cong bán kính $50\\ \\text{m}$ với tốc độ $15\\ \\text{m/s}$ (lực ma sát nghỉ đóng vai trò lực hướng tâm). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Gia tốc hướng tâm của ô tô bằng $4,5\\ \\text{m/s}^2$.","b) Lực hướng tâm tác dụng lên ô tô bằng $5400\\ \\text{N}$.","c) Nếu tốc độ tăng gấp đôi thì lực hướng tâm tăng gấp đôi.","d) Nếu đường ướt làm giảm ma sát cực đại, xe dễ bị văng ra ngoài khi vào cua nhanh."],"answer": ["T","T","F","T"],"explain": "a) Đúng: $a_{ht} = 225/50 = 4,5\\ \\text{m/s}^2$. b) Đúng: $F = 1200 \\cdot 4,5 = 5400\\ \\text{N}$. c) Sai: $F_{ht} \\propto v^2$ nên tăng gấp BỐN. d) Đúng.","points": 1},{"type": "short","level": "VD","q": "Một vật $2\\ \\text{kg}$ buộc vào dây dài $1\\ \\text{m}$ quay tròn đều trong mặt phẳng ngang với tần số $2\\ \\text{Hz}$. Độ lớn lực căng dây (đóng vai trò lực hướng tâm) bằng bao nhiêu N? (chỉ điền số, lấy $\\pi^2 \\approx 9,87$)","answer": "315.84","explain": "$F = m\\omega^2 r = 2 \\cdot (4\\pi)^2 \\cdot 1 = 32\\pi^2 \\approx 315,84\\ \\text{N}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vệ tinh khối lượng $500\\ \\text{kg}$ chuyển động tròn đều quanh Trái Đất với tốc độ $7,5\\ \\text{km/s}$ trên quỹ đạo bán kính $6800\\ \\text{km}$. Độ lớn lực hướng tâm (lực hấp dẫn) tác dụng lên vệ tinh bằng bao nhiêu N? (chỉ điền số, làm tròn đến hàng đơn vị)","answer": "4136","explain": "$F = 500 \\cdot 7500^2/6800000 \\approx 4136\\ \\text{N}$.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "NB","q": "Gia tốc hướng tâm đặc trưng cho","options": ["A. sự thay đổi hướng của vectơ vận tốc.","B. sự thay đổi độ lớn của vận tốc.","C. sự thay đổi quãng đường.","D. sự thay đổi tốc độ góc."],"answer": "A","explain": "Trong chuyển động tròn đều, tốc độ không đổi nên gia tốc chỉ làm đổi hướng vận tốc.","points": 0.25},{"type": "mcq","level": "NB","q": "Công thức $a_{ht} = \\omega^2 r$ cho thấy gia tốc hướng tâm","options": ["A. tỉ lệ thuận với bình phương tốc độ góc.","B. tỉ lệ nghịch với bán kính.","C. không phụ thuộc bán kính.","D. tỉ lệ thuận với tốc độ góc."],"answer": "A","explain": "$a_{ht} \\propto \\omega^2$.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi xe đi qua đoạn đường cong, lực đóng vai trò lực hướng tâm thường là","options": ["A. lực ma sát nghỉ giữa lốp xe và mặt đường.","B. trọng lực của xe.","C. lực phát động của động cơ.","D. lực cản không khí."],"answer": "A","explain": "Ma sát nghỉ hướng vào tâm đường cong.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật chuyển động tròn đều với tốc độ $v$ trên đường tròn bán kính $r$. Nếu tăng $v$ gấp đôi, giữ nguyên $r$ thì lực hướng tâm","options": ["A. tăng gấp 4 lần.","B. tăng gấp đôi.","C. giảm một nửa.","D. không đổi."],"answer": "A","explain": "$F_{ht} \\propto v^2$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $1,5\\ \\text{kg}$ chuyển động tròn đều trên đường tròn bán kính $0,6\\ \\text{m}$ với tốc độ góc $4\\ \\text{rad/s}$. Lực hướng tâm tác dụng lên vật bằng","options": ["A. $14,4\\ \\text{N}$.","B. $3,6\\ \\text{N}$.","C. $9,6\\ \\text{N}$.","D. $57,6\\ \\text{N}$."],"answer": "A","explain": "$F = 1,5 \\cdot 16 \\cdot 0,6 = 14,4\\ \\text{N}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một chất điểm chuyển động tròn đều với tốc độ $6\\ \\text{m/s}$ trên đường tròn bán kính $1,2\\ \\text{m}$. Gia tốc hướng tâm của chất điểm bằng","options": ["A. $30\\ \\text{m/s}^2$.","B. $5\\ \\text{m/s}^2$.","C. $7,2\\ \\text{m/s}^2$.","D. $43,2\\ \\text{m/s}^2$."],"answer": "A","explain": "$a_{ht} = 36/1,2 = 30\\ \\text{m/s}^2$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lực hướng tâm luôn hướng vào tâm quỹ đạo.","b) Lực hướng tâm làm thay đổi độ lớn vận tốc của vật.","c) Trong chuyển động tròn đều, hợp lực tác dụng lên vật chính là lực hướng tâm.","d) Khi vật chuyển động tròn đều, lực hướng tâm cân bằng với một lực khác."],"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: chỉ làm đổi HƯỚNG vận tốc. c) Đúng. d) Sai: hợp lực KHÔNG cân bằng (vật có gia tốc).","points": 1},{"type": "truefalse","level": "VD","q": "Một con lắc đơn gồm vật $0,2\\ \\text{kg}$ treo vào sợi dây dài $0,5\\ \\text{m}$; khi vật qua vị trí cân bằng với tốc độ $2\\ \\text{m/s}$. Xét tính đúng, sai của các khẳng định sau (lấy $g = 10\\ \\text{m/s}^2$):","statements": ["a) Lực căng dây và trọng lực cùng đóng vai trò tạo ra lực hướng tâm.","b) Gia tốc hướng tâm của vật lúc đó bằng $8\\ \\text{m/s}^2$.","c) Lực hướng tâm tác dụng lên vật bằng $1,6\\ \\text{N}$.","d) Lực căng dây lúc đó bằng $3,6\\ \\text{N}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: hợp lực của $\\vec{T}$ và $\\vec{P}$ hướng vào tâm (điểm treo). b) Đúng: $a_{ht} = 4/0,5 = 8\\ \\text{m/s}^2$. c) Đúng: $F_{ht} = 0,2 \\cdot 8 = 1,6\\ \\text{N}$. d) Đúng: $T - mg = 1,6$, $T = 3,6\\ \\text{N}$.","points": 1},{"type": "short","level": "VD","q": "Một ô tô $1000\\ \\text{kg}$ đi qua đường cong bán kính $40\\ \\text{m}$ với tốc độ $12\\ \\text{m/s}$. Lực ma sát nghỉ cực đại giữa lốp và đường là $5000\\ \\text{N}$. Hỏi xe có bị trượt không nếu lực hướng tâm cần thiết vượt quá ma sát cực đại? (điền 1 nếu trượt, 0 nếu không)","answer": "0","explain": "$F_{ht} = 1000 \\cdot 144/40 = 3600\\ \\text{N} \\lt 5000\\ \\text{N}$: không trượt.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật chuyển động tròn đều với bán kính $r_1$ có gia tốc hướng tâm $a_1$. Khi tăng bán kính lên gấp đôi và giữ nguyên tốc độ dài, gia tốc hướng tâm lúc sau bằng bao nhiêu lần $a_1$? (chỉ điền số)","answer": "0.5","explain": "$a_{ht} = v^2/r$ nên $r$ tăng gấp đôi thì $a$ giảm một nửa.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Vectơ gia tốc hướng tâm","options": ["A. luôn hướng vào tâm quỹ đạo tròn.","B. luôn tiếp tuyến với quỹ đạo.","C. có hướng không đổi.","D. luôn hướng ra ngoài quỹ đạo."],"answer": "A","explain": "Định nghĩa gia tốc hướng tâm.","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị của gia tốc hướng tâm là","options": ["A. $\\text{m/s}^2$.","B. $\\text{m/s}$.","C. $\\text{rad/s}$.","D. $\\text{N}$."],"answer": "A","explain": "Đơn vị gia tốc.","points": 0.25},{"type": "mcq","level": "NB","q": "Lực nào sau đây có thể đóng vai trò lực hướng tâm?","options": ["A. Lực ma sát, lực căng dây, lực hấp dẫn (tùy tình huống).","B. Chỉ có lực ma sát.","C. Chỉ có trọng lực.","D. Chỉ có lực đàn hồi."],"answer": "A","explain": "Tùy tình huống, các lực khác nhau đóng vai trò lực hướng tâm.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật chuyển động tròn đều, nếu bán kính quỹ đạo tăng gấp đôi và tốc độ dài không đổi thì gia tốc hướng tâm","options": ["A. giảm một nửa.","B. tăng gấp đôi.","C. tăng gấp bốn.","D. không đổi."],"answer": "A","explain": "$a_{ht} = v^2/r$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vệ tinh chuyển động tròn đều với tốc độ góc $1,1 \\cdot 10^{-3}\\ \\text{rad/s}$ trên quỹ đạo bán kính $7000\\ \\text{km}$. Gia tốc hướng tâm của vệ tinh xấp xỉ","options": ["A. $8,47\\ \\text{m/s}^2$.","B. $7,7\\ \\text{m/s}^2$.","C. $1,1\\ \\text{m/s}^2$.","D. $7700\\ \\text{m/s}^2$."],"answer": "A","explain": "$a = \\omega^2 r = 1,21 \\cdot 10^{-6} \\cdot 7 \\cdot 10^6 = 8,47\\ \\text{m/s}^2$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $0,4\\ \\text{kg}$ quay tròn đều với tần số $3\\ \\text{Hz}$ trên đường tròn bán kính $0,5\\ \\text{m}$. Lực hướng tâm tác dụng lên vật xấp xỉ (lấy $\\pi^2 \\approx 9,87$)","options": ["A. $71,1\\ \\text{N}$.","B. $7,9\\ \\text{N}$.","C. $18\\ \\text{N}$.","D. $639,6\\ \\text{N}$."],"answer": "A","explain": "$F = 0,4 \\cdot (6\\pi)^2 \\cdot 0,5 = 7,2\\pi^2 \\approx 71,1\\ \\text{N}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Gia tốc hướng tâm có độ lớn $a_{ht} = \\frac{v^2}{r}$.","b) Gia tốc hướng tâm có độ lớn $a_{ht} = \\omega^2 r$.","c) Khi tốc độ dài tăng gấp đôi (giữ nguyên $r$) thì $a_{ht}$ tăng gấp đôi.","d) Khi tốc độ góc tăng gấp đôi (giữ nguyên $r$) thì $a_{ht}$ tăng gấp bốn."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: tăng gấp BỐN ($a \\propto v^2$). d) Đúng ($a \\propto \\omega^2$).","points": 1},{"type": "truefalse","level": "VD","q": "Một máy giặt vắt quần áo: lồng giặt hình trụ bán kính $0,25\\ \\text{m}$ quay với tốc độ $1200\\ \\text{vòng/phút}$. Xét tính đúng, sai của các khẳng định sau (lấy $\\pi^2 \\approx 9,87$):","statements": ["a) Tần số quay của lồng giặt bằng $20\\ \\text{Hz}$.","b) Tốc độ góc của lồng giặt bằng $40\\pi\\ \\text{rad/s}$.","c) Gia tốc hướng tâm ở thành lồng xấp xỉ $3948\\ \\text{m/s}^2$.","d) Gia tốc này gấp khoảng $400$ lần gia tốc trọng trường."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $1200/60 = 20\\ \\text{Hz}$. b) Đúng. c) Đúng: $a = (40\\pi)^2 \\cdot 0,25 = 400\\pi^2 \\approx 3948\\ \\text{m/s}^2$ . d) Đúng: $3948/9,8 \\approx 403$.","points": 1},{"type": "short","level": "VD","q": "Một vật khối lượng $3\\ \\text{kg}$ chuyển động tròn đều với tốc độ $5\\ \\text{m/s}$; lực hướng tâm tác dụng lên vật bằng $30\\ \\text{N}$. Bán kính quỹ đạo bằng bao nhiêu m? (chỉ điền số)","answer": "2.5","explain": "$r = mv^2/F = 3 \\cdot 25/30 = 2,5\\ \\text{m}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một ô tô khối lượng $1500\\ \\text{kg}$ đi qua đoạn đường cong bán kính $60\\ \\text{m}$. Hệ số ma sát nghỉ cực đại giữa lốp và đường là $0,4$ (lấy $g = 10\\ \\text{m/s}^2$). Tốc độ tối đa để xe không bị trượt bằng bao nhiêu m/s? (chỉ điền số, làm tròn đến 1 chữ số thập phân)","answer": "15.5","explain": "$F_{msn\\,max} = 0,4 \\cdot 15000 = 6000\\ \\text{N}$. $mv^2/r \\le 6000$, $v \\le \\sqrt{6000 \\cdot 60/1500} = \\sqrt{240} \\approx 15,49\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "NB","q": "Trong chuyển động tròn đều, hợp lực tác dụng lên vật","options": ["A. hướng vào tâm quỹ đạo.","B. bằng 0.","C. tiếp tuyến với quỹ đạo.","D. hướng ra xa tâm."],"answer": "A","explain": "Hợp lực chính là lực hướng tâm.","points": 0.25},{"type": "mcq","level": "NB","q": "Gia tốc hướng tâm tỉ lệ thuận với","options": ["A. bình phương tốc độ dài (khi $r$ không đổi).","B. tốc độ dài (khi $r$ không đổi).","C. bán kính (khi $v$ không đổi).","D. khối lượng của vật."],"answer": "A","explain": "$a_{ht} = v^2/r$.","points": 0.25},{"type": "mcq","level": "NB","q": "Lực hướng tâm KHÔNG có đặc điểm nào sau đây?","options": ["A. Là một loại lực cơ học mới, khác các lực đã học.","B. Hướng vào tâm quỹ đạo.","C. Gây ra gia tốc hướng tâm.","D. Có thể là hợp lực của nhiều lực."],"answer": "A","explain": "Lực hướng tâm không phải lực mới.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật có khối lượng $m$ chuyển động tròn đều với tốc độ góc $\\omega$ trên đường tròn bán kính $r$. Lực hướng tâm bằng","options": ["A. $m\\omega^2 r$.","B. $m\\omega r^2$.","C. $\\frac{m\\omega}{r}$.","D. $m\\omega^2 r^2$."],"answer": "A","explain": "$F_{ht} = m\\omega^2 r$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $2,5\\ \\text{kg}$ chuyển động tròn đều với tốc độ $8\\ \\text{m/s}$ trên đường tròn bán kính $2\\ \\text{m}$. Lực hướng tâm tác dụng lên vật bằng","options": ["A. $80\\ \\text{N}$.","B. $10\\ \\text{N}$.","C. $160\\ \\text{N}$.","D. $40\\ \\text{N}$."],"answer": "A","explain": "$F = 2,5 \\cdot 64/2 = 80\\ \\text{N}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một chất điểm chuyển động tròn đều với chu kì $0,5\\ \\text{s}$ trên đường tròn bán kính $0,2\\ \\text{m}$. Gia tốc hướng tâm của chất điểm xấp xỉ (lấy $\\pi^2 \\approx 9,87$)","options": ["A. $31,6\\ \\text{m/s}^2$.","B. $7,9\\ \\text{m/s}^2$.","C. $126,3\\ \\text{m/s}^2$.","D. $3,16\\ \\text{m/s}^2$."],"answer": "A","explain": "$a = (4\\pi)^2 \\cdot 0,2 = 3,2\\pi^2 \\approx 31,6\\ \\text{m/s}^2$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Mọi chuyển động tròn đều đều có gia tốc hướng tâm.","b) Gia tốc hướng tâm bằng 0 khi vật đứng yên.","c) Lực hướng tâm thực hiện công trong chuyển động tròn đều.","d) Lực hướng tâm luôn vuông góc với vận tốc."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: lực vuông góc với hướng dịch chuyển nên công bằng 0. d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Một viên bi $0,1\\ \\text{kg}$ được buộc vào đầu sợi dây dài $0,6\\ \\text{m}$, quay tròn đều trong mặt phẳng ngang với tốc độ $3\\ \\text{m/s}$ (dây nằm ngang, bỏ qua trọng lượng dây). Xét tính đúng, sai của các khẳng định sau (lấy $g = 10\\ \\text{m/s}^2$):","statements": ["a) Lực căng dây đóng vai trò lực hướng tâm.","b) Gia tốc hướng tâm của viên bi bằng $15\\ \\text{m/s}^2$.","c) Lực căng dây bằng $1,5\\ \\text{N}$.","d) Nếu tăng tốc độ lên gấp đôi thì lực căng dây tăng gấp đôi."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng: $a = 9/0,6 = 15\\ \\text{m/s}^2$. c) Đúng: $T = 0,1 \\cdot 15 = 1,5\\ \\text{N}$. d) Sai: tăng gấp BỐN.","points": 1},{"type": "short","level": "VDC","q": "Một vệ tinh chuyển động tròn đều quanh Trái Đất; lực hấp dẫn đóng vai trò lực hướng tâm bằng $4000\\ \\text{N}$, khối lượng vệ tinh $400\\ \\text{kg}$, bán kính quỹ đạo $7000\\ \\text{km}$. Tốc độ của vệ tinh bằng bao nhiêu km/s? (chỉ điền số, làm tròn đến 1 chữ số thập phân)","answer": "8.4","explain": "$v = \\sqrt{Fr/m} = \\sqrt{4000 \\cdot 7000000/400} = \\sqrt{7 \\cdot 10^7} \\approx 8367\\ \\text{m/s} \\approx 8,4\\ \\text{km/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật chuyển động tròn đều trên đường tròn bán kính $0,9\\ \\text{m}$ với gia tốc hướng tâm $40\\ \\text{m/s}^2$. Tốc độ dài của vật bằng bao nhiêu m/s? (chỉ điền số)","answer": "6","explain": "$v = \\sqrt{a r} = \\sqrt{36} = 6\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Gia tốc hướng tâm có hướng","options": ["A. vào tâm của quỹ đạo tròn.","B. ra xa tâm của quỹ đạo tròn.","C. tiếp tuyến với quỹ đạo tròn.","D. trùng với hướng chuyển động."],"answer": "A","explain": "Định nghĩa.","points": 0.25},{"type": "mcq","level": "NB","q": "Lực hướng tâm có độ lớn được tính bằng","options": ["A. $F_{ht} = m\\omega^2 r$.","B. $F_{ht} = m\\frac{r}{\\omega^2}$.","C. $F_{ht} = m\\omega r^2$.","D. $F_{ht} = \\frac{\\omega^2 r}{m}$."],"answer": "A","explain": "$F_{ht} = ma_{ht} = m\\omega^2 r$.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong các lực sau, lực nào KHÔNG thể đóng vai trò lực hướng tâm?","options": ["A. Lực quán tính li tâm (trong hệ quy chiếu quán tính).","B. Lực ma sát nghỉ.","C. Lực căng dây.","D. Lực hấp dẫn."],"answer": "A","explain": "Trong hệ quy chiếu quán tính không có lực quán tính li tâm.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật chuyển động tròn đều với tốc độ dài $v$, bán kính $r$. Nếu $r$ tăng gấp đôi, $v$ không đổi thì lực hướng tâm","options": ["A. giảm một nửa.","B. tăng gấp đôi.","C. tăng gấp bốn.","D. không đổi."],"answer": "A","explain": "$F_{ht} = mv^2/r$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $0,8\\ \\text{kg}$ chuyển động tròn đều với tốc độ $10\\ \\text{m/s}$ trên đường tròn bán kính $0,5\\ \\text{m}$. Gia tốc hướng tâm của vật bằng","options": ["A. $200\\ \\text{m/s}^2$.","B. $16\\ \\text{m/s}^2$.","C. $20\\ \\text{m/s}^2$.","D. $400\\ \\text{m/s}^2$."],"answer": "A","explain": "$a = 100/0,5 = 200\\ \\text{m/s}^2$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một chất điểm chuyển động tròn đều với tần số $4\\ \\text{Hz}$ trên đường tròn bán kính $0,25\\ \\text{m}$. Lực hướng tâm tác dụng lên chất điểm khối lượng $0,2\\ \\text{kg}$ xấp xỉ (lấy $\\pi^2 \\approx 9,87$)","options": ["A. $31,6\\ \\text{N}$.","B. $7,9\\ \\text{N}$.","C. $126,3\\ \\text{N}$.","D. $2\\ \\text{N}$."],"answer": "A","explain": "$F = 0,2 \\cdot (8\\pi)^2 \\cdot 0,25 = 3,2\\pi^2 \\approx 31,6\\ \\text{N}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lực hướng tâm gây ra gia tốc hướng tâm.","b) Gia tốc hướng tâm tỉ lệ thuận với khối lượng của vật.","c) Vật có khối lượng càng lớn thì cần lực hướng tâm càng lớn (cùng $v$, $r$).","d) Lực hướng tâm đổi hướng liên tục trong chuyển động tròn đều."],"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: $a_{ht} = v^2/r$ không phụ thuộc $m$. c) Đúng: $F = ma$. d) Đúng: luôn hướng vào tâm.","points": 1},{"type": "truefalse","level": "VD","q": "Một người $60\\ \\text{kg}$ ngồi trên ghế của đu quay đứng (vòng quay thẳng đứng) bán kính $4\\ \\text{m}$, quay đều với tốc độ $6\\ \\text{m/s}$. Xét tính đúng, sai của các khẳng định sau (lấy $g = 10\\ \\text{m/s}^2$):","statements": ["a) Gia tốc hướng tâm của người bằng $9\\ \\text{m/s}^2$.","b) Lực hướng tâm tác dụng lên người bằng $540\\ \\text{N}$.","c) Ở vị trí thấp nhất, lực của ghế tác dụng lên người bằng $1140\\ \\text{N}$.","d) Ở vị trí cao nhất, lực của ghế tác dụng lên người bằng $60\\ \\text{N}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $a = 36/4 = 9\\ \\text{m/s}^2$. b) Đúng: $F = 60 \\cdot 9 = 540\\ \\text{N}$. c) Đúng: $N - mg = 540$, $N = 1140\\ \\text{N}$. d) Đúng: $mg - N = 540$, $N = 60\\ \\text{N}$.","points": 1},{"type": "short","level": "VDC","q": "Một vật $1,2\\ \\text{kg}$ chuyển động tròn đều trên đường tròn bán kính $0,75\\ \\text{m}$ với lực hướng tâm $48\\ \\text{N}$. Tốc độ dài của vật bằng bao nhiêu m/s? (chỉ điền số)","answer": "5.48","explain": "$v = \\sqrt{Fr/m} = \\sqrt{48 \\cdot 0,75/1,2} = \\sqrt{30} \\approx 5,48\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một con lắc đơn dài $1\\ \\text{m}$, vật nặng $0,3\\ \\text{kg}$; khi dây hợp với phương thẳng đứng góc $60^\\circ$ thì tốc độ của vật bằng $2\\ \\text{m/s}$. Lực căng dây lúc đó bằng bao nhiêu N? (lấy $g = 10\\ \\text{m/s}^2$, chỉ điền số, làm tròn đến 1 chữ số thập phân)","answer": "2.7","explain": "Theo phương dây (hướng tâm): $T - mg\\cos60^\\circ = mv^2/l$. $T = 0,3 \\cdot 10 \\cdot 0,5 + 0,3 \\cdot 4/1 = 1,5 + 1,2 = 2,7\\ \\text{N}$.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Phát biểu nào sau đây sai về lực hướng tâm?","options": ["A. Lực hướng tâm là một loại lực mới, khác với các lực cơ học đã học.","B. Lực hướng tâm hướng vào tâm quỹ đạo.","C. Lực hướng tâm gây ra gia tốc hướng tâm.","D. Lực hướng tâm có thể là hợp lực của nhiều lực."],"answer": "A","explain": "Lực hướng tâm không phải lực mới.","points": 0.25},{"type": "mcq","level": "NB","q": "Gia tốc hướng tâm của chuyển động tròn đều","options": ["A. có độ lớn không đổi.","B. có hướng không đổi.","C. bằng 0.","D. tiếp tuyến với quỹ đạo."],"answer": "A","explain": "Độ lớn $v^2/r$ không đổi; hướng luôn đổi.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật chuyển động tròn đều với chu kì $T$ trên đường tròn bán kính $r$. Gia tốc hướng tâm bằng","options": ["A. $\\frac{4\\pi^2 r}{T^2}$.","B. $\\frac{2\\pi r}{T}$.","C. $\\frac{4\\pi r^2}{T}$.","D. $\\frac{2\\pi r^2}{T^2}$."],"answer": "A","explain": "$a = \\omega^2 r = 4\\pi^2 r/T^2$.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi vật chuyển động tròn đều, công của lực hướng tâm bằng","options": ["A. $0$.","B. $F_{ht} \\cdot 2\\pi r$.","C. $F_{ht} \\cdot r$.","D. $m v^2$."],"answer": "A","explain": "Lực vuông góc với hướng dịch chuyển.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $4\\ \\text{kg}$ chuyển động tròn đều với tốc độ góc $3\\ \\text{rad/s}$ trên đường tròn bán kính $1,5\\ \\text{m}$. Lực hướng tâm bằng","options": ["A. $54\\ \\text{N}$.","B. $18\\ \\text{N}$.","C. $6\\ \\text{N}$.","D. $162\\ \\text{N}$."],"answer": "A","explain": "$F = 4 \\cdot 9 \\cdot 1,5 = 54\\ \\text{N}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một ô tô $900\\ \\text{kg}$ đi qua cầu vồng lên (mặt cầu lồi) bán kính cong $45\\ \\text{m}$ với tốc độ $9\\ \\text{m/s}$. Áp lực của ô tô lên mặt cầu tại điểm cao nhất bằng (lấy $g = 10\\ \\text{m/s}^2$)","options": ["A. $7380\\ \\text{N}$.","B. $9000\\ \\text{N}$.","C. $10620\\ \\text{N}$.","D. $1620\\ \\text{N}$."],"answer": "A","explain": "$mg - N = mv^2/r$, $N = 9000 - 900 \\cdot 81/45 = 9000 - 1620 = 7380\\ \\text{N}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Trong chuyển động tròn đều, tốc độ dài không đổi nên gia tốc bằng 0.","b) Gia tốc hướng tâm làm thay đổi hướng của vận tốc.","c) Lực hướng tâm không sinh công.","d) Vệ tinh nhân tạo chuyển động tròn đều quanh Trái Đất là nhờ lực hấp dẫn."],"answer": ["F","T","T","T"],"explain": "a) Sai: hướng vận tốc đổi nên có gia tốc. b) Đúng. c) Đúng. d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật $0,5\\ \\text{kg}$ buộc vào dây dài $0,8\\ \\text{m}$ quay tròn đều trong mặt phẳng thẳng đứng với tốc độ dài không đổi $4\\ \\text{m/s}$. Xét tính đúng, sai của các khẳng định sau (lấy $g = 10\\ \\text{m/s}^2$):","statements": ["a) Gia tốc hướng tâm của vật bằng $20\\ \\text{m/s}^2$.","b) Lực hướng tâm tác dụng lên vật bằng $10\\ \\text{N}$.","c) Lực căng dây ở vị trí thấp nhất bằng $15\\ \\text{N}$.","d) Lực căng dây ở vị trí cao nhất bằng $15\\ \\text{N}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $a = 16/0,8 = 20\\ \\text{m/s}^2$. b) Đúng: $F = 0,5 \\cdot 20 = 10\\ \\text{N}$. c) Đúng: $T = mg + 10 = 15\\ \\text{N}$. d) Sai: $T = 10 - mg = 5\\ \\text{N}$.","points": 1},{"type": "short","level": "VDC","q": "Một chất điểm khối lượng $0,6\\ \\text{kg}$ chuyển động tròn đều với tốc độ góc $5\\ \\text{rad/s}$; lực hướng tâm tác dụng lên chất điểm bằng $18\\ \\text{N}$. Bán kính quỹ đạo bằng bao nhiêu m? (chỉ điền số)","answer": "1.2","explain": "$r = F/(m\\omega^2) = 18/(0,6 \\cdot 25) = 1,2\\ \\text{m}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một máy bay nhào lộn theo vòng tròn thẳng đứng bán kính $200\\ \\text{m}$ với tốc độ $72\\ \\text{m/s}$ không đổi. Tỉ số giữa áp lực của người phi công ($70\\ \\text{kg}$) lên ghế ở điểm thấp nhất và trọng lượng của người bằng bao nhiêu? (lấy $g = 10\\ \\text{m/s}^2$, chỉ điền số, làm tròn đến 2 chữ số thập phân)","answer": "3.59","explain": "$a_{ht} = 72^2/200 = 25,92\\ \\text{m/s}^2$. $N = m(g + a) = 70 \\cdot 35,92$. Tỉ số $= 35,92/10 = 3,592 \\approx 3,59$.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Điều nào sau đây đúng khi nói về gia tốc hướng tâm?","options": ["A. Gia tốc hướng tâm luôn hướng vào tâm quỹ đạo.","B. Gia tốc hướng tâm làm tăng tốc độ của vật.","C. Gia tốc hướng tâm có độ lớn tỉ lệ nghịch với tốc độ.","D. Gia tốc hướng tâm bằng 0 trong chuyển động tròn đều."],"answer": "A","explain": "Định nghĩa.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật chuyển động tròn đều với tốc độ $v$. Động năng của vật","options": ["A. không đổi.","B. tăng dần.","C. giảm dần.","D. bằng 0."],"answer": "A","explain": "$v$ không đổi nên động năng không đổi (lực hướng tâm không sinh công).","points": 0.25},{"type": "mcq","level": "NB","q": "Lực ma sát nghỉ đóng vai trò lực hướng tâm trong trường hợp","options": ["A. xe đi qua đoạn đường cong nằm ngang.","B. vật rơi tự do.","C. con lắc đơn dao động.","D. vệ tinh quay quanh Trái Đất."],"answer": "A","explain": "Ma sát nghỉ hướng vào tâm đường cong.","points": 0.25},{"type": "mcq","level": "TH","q": "Nếu tốc độ dài của vật chuyển động tròn đều tăng gấp 3, giữ nguyên bán kính thì gia tốc hướng tâm","options": ["A. tăng gấp 9 lần.","B. tăng gấp 3 lần.","C. giảm 3 lần.","D. không đổi."],"answer": "A","explain": "$a_{ht} \\propto v^2$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $1,2\\ \\text{kg}$ chuyển động tròn đều trên đường tròn bán kính $0,9\\ \\text{m}$ với tần số $2\\ \\text{Hz}$. Lực hướng tâm tác dụng lên vật xấp xỉ (lấy $\\pi^2 \\approx 9,87$)","options": ["A. $170,6\\ \\text{N}$.","B. $42,6\\ \\text{N}$.","C. $21,3\\ \\text{N}$.","D. $681,7\\ \\text{N}$."],"answer": "A","explain": "$F = 1,2 \\cdot (4\\pi)^2 \\cdot 0,9 = 17,28\\pi^2 \\approx 170,6\\ \\text{N}$ .","points": 0.25},{"type": "mcq","level": "TH","q": "Một chất điểm chuyển động tròn đều với tốc độ $5\\ \text{m/s}$ trên đường tròn bán kính $1,25\\ \text{m}$. Gia tốc hướng tâm của chất điểm bằng","options": ["A. $20\\ \text{m/s}^2$.","B. $4\\ \text{m/s}^2$.","C. $6,25\\ \text{m/s}^2$.","D. $31,25\\ \text{m/s}^2$."],"answer": "A","explain": "$a = 25/1,25 = 20\\ \text{m/s}^2$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Gia tốc trong chuyển động tròn đều gọi là gia tốc hướng tâm.","b) Độ lớn gia tốc hướng tâm tính bằng $v^2/r$.","c) Lực hướng tâm là nguyên nhân gây ra chuyển động tròn đều.","d) Không có lực hướng tâm thì vật không thể chuyển động tròn đều."],"answer": ["T","T","T","T"],"explain": "a) Đúng. b) Đúng. c) Đúng: lực hướng tâm tạo gia tốc đổi hướng vận tốc. d) Đúng: vật sẽ chuyển động thẳng đều theo quán tính.","points": 1},{"type": "truefalse","level": "VD","q": "Một đoàn tàu khối lượng $50000\\ \\text{kg}$ đi qua đoạn đường cong bán kính $400\\ \\text{m}$ với tốc độ $20\\ \\text{m/s}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Gia tốc hướng tâm của đoàn tàu bằng $1\\ \\text{m/s}^2$.","b) Lực hướng tâm cần thiết bằng $50000\\ \\text{N}$.","c) Lực này do thành ray tác dụng lên bánh tàu (lực pháp tuyến ngang).","d) Nếu tăng tốc độ lên $40\\ \\text{m/s}$ thì lực hướng tâm cần thiết là $100000\\ \\text{N}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $a = 400/400 = 1\\ \\text{m/s}^2$. b) Đúng: $F = 50000 \\cdot 1$. c) Đúng. d) Sai: $F \\propto v^2$ nên bằng $200000\\ \\text{N}$.","points": 1},{"type": "short","level": "VDC","q": "Một vật chuyển động tròn đều với tốc độ góc $6\\ \\text{rad/s}$ trên đường tròn bán kính $0,5\\ \\text{m}$. Gia tốc hướng tâm của vật bằng bao nhiêu $\\text{m/s}^2$? (chỉ điền số)","answer": "18","explain": "$a = 36 \\cdot 0,5 = 18\\ \\text{m/s}^2$.","points": 0.5},{"type": "short","level": "VDC","q": "Một quả cầu $0,4\\ \\text{kg}$ được treo vào sợi dây dài $0,6\\ \\text{m}$, quay tròn đều tạo thành mặt nón với góc $37^\\circ$ so với phương thẳng đứng ($\\cos37^\\circ \\approx 0,8$, $\\sin37^\\circ \\approx 0,6$, $g = 10\\ \\text{m/s}^2$). Lực căng dây bằng bao nhiêu N? (chỉ điền số)","answer": "5","explain": "Theo phương thẳng đứng: $T\\cos37^\\circ = mg$, $T = 4/0,8 = 5\\ \\text{N}$.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "NB","q": "Trong chuyển động tròn đều, vectơ gia tốc","options": ["A. hướng vào tâm và có độ lớn không đổi.","B. tiếp tuyến với quỹ đạo.","C. hướng ra xa tâm.","D. bằng 0."],"answer": "A","explain": "Gia tốc hướng tâm.","points": 0.25},{"type": "mcq","level": "NB","q": "Lực hướng tâm và gia tốc hướng tâm","options": ["A. cùng hướng với nhau.","B. ngược hướng nhau.","C. vuông góc nhau.","D. không liên quan nhau."],"answer": "A","explain": "$\\vec{F}_{ht} = m\\vec{a}_{ht}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật đứng yên trên đĩa quay đều. Lực đóng vai trò lực hướng tâm giữ vật đứng yên so với đĩa là","options": ["A. lực ma sát nghỉ.","B. trọng lực.","C. lực quán tính li tâm.","D. phản lực của đĩa."],"answer": "A","explain": "Ma sát nghỉ hướng vào tâm.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi khối lượng của vật chuyển động tròn đều tăng gấp đôi (giữ nguyên $v$, $r$) thì lực hướng tâm","options": ["A. tăng gấp đôi.","B. tăng gấp bốn.","C. giảm một nửa.","D. không đổi."],"answer": "A","explain": "$F_{ht} = mv^2/r \\propto m$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một electron chuyển động tròn đều với tốc độ $2 \\cdot 10^6\\ \\text{m/s}$ trên quỹ đạo bán kính $5,3 \\cdot 10^{-11}\\ \\text{m}$ (mẫu nguyên tử Bohr). Gia tốc hướng tâm của electron xấp xỉ","options": ["A. $7,5 \\cdot 10^{22}\\ \\text{m/s}^2$.","B. $3,8 \\cdot 10^{16}\\ \\text{m/s}^2$.","C. $1,1 \\cdot 10^{-4}\\ \\text{m/s}^2$.","D. $2,7 \\cdot 10^{5}\\ \\text{m/s}^2$."],"answer": "A","explain": "$a = 4 \\cdot 10^{12}/(5,3 \\cdot 10^{-11}) \\approx 7,55 \\cdot 10^{22}\\ \\text{m/s}^2$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật $3\\ \\text{kg}$ chuyển động tròn đều với chu kì $1,5\\ \\text{s}$ trên đường tròn bán kính $1,2\\ \\text{m}$. Lực hướng tâm tác dụng lên vật xấp xỉ (lấy $\\pi^2 \\approx 9,87$)","options": ["A. $63,2\\ \\text{N}$.","B. $15,8\\ \\text{N}$.","C. $252,7\\ \\text{N}$.","D. $7,9\\ \\text{N}$."],"answer": "A","explain": "$F = 3 \\cdot (2\\pi/1,5)^2 \\cdot 1,2 = 3 \\cdot (16\\pi^2/9) \\cdot 1,2 = 6,4\\pi^2 \\approx 63,2\\ \\text{N}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) $F_{ht} = m\\frac{v^2}{r}$ với $r$ là bán kính quỹ đạo.","b) $F_{ht} = m\\omega^2 r$.","c) Lực hướng tâm càng lớn khi bán kính càng lớn (cùng $v$).","d) Lực hướng tâm càng lớn khi tốc độ góc càng lớn (cùng $r$, $m$)."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: $F \\propto 1/r$ khi $v$ không đổi. d) Đúng: $F \\propto \\omega^2$.","points": 1},{"type": "truefalse","level": "VDC","q": "Một người đi xe đạp qua vòng xiếc (vòng tròn thẳng đứng) bán kính $3\\ \\text{m}$ với tốc độ $9\\ \\text{m/s}$ ở điểm cao nhất. Xét tính đúng, sai của các khẳng định sau (lấy $g = 10\\ \\text{m/s}^2$, khối lượng người + xe $80\\ \\text{kg}$):","statements": ["a) Gia tốc hướng tâm tại điểm cao nhất bằng $27\\ \\text{m/s}^2$.","b) Lực hướng tâm cần thiết bằng $2160\\ \\text{N}$.","c) Áp lực của xe lên vòng xiếc tại điểm cao nhất bằng $1360\\ \\text{N}$.","d) Nếu tốc độ nhỏ hơn $\\sqrt{30} \\approx 5,48\\ \\text{m/s}$ thì xe bị rơi khỏi vòng."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $a = 81/3 = 27\\ \\text{m/s}^2$. b) Đúng: $F = 80 \\cdot 27 = 2160\\ \\text{N}$. c) Đúng: $N + mg = 2160$, $N = 1360\\ \\text{N}$. d) Đúng: cần $v^2/r \\ge g$.","points": 1},{"type": "short","level": "VDC","q": "Một vật $2\\ \\text{kg}$ chuyển động tròn đều với tốc độ $7\\ \\text{m/s}$; gia tốc hướng tâm của vật bằng $14\\ \\text{m/s}^2$. Bán kính quỹ đạo bằng bao nhiêu m? (chỉ điền số)","answer": "3.5","explain": "$r = v^2/a = 49/14 = 3,5\\ \\text{m}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vệ tinh địa tĩnh chuyển động tròn đều quanh Trái Đất với bán kính quỹ đạo $42000\\ \\text{km}$, chu kì $24$ giờ. Gia tốc hướng tâm của vệ tinh bằng bao nhiêu $\\text{m/s}^2$? (chỉ điền số, làm tròn đến 2 chữ số thập phân)","answer": "0.22","explain": "$a = 4\\pi^2 r/T^2 = 4\\pi^2 \\cdot 4,2 \\cdot 10^7/86400^2 \\approx 0,222\\ \\text{m/s}^2$.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Công thức tính gia tốc hướng tâm theo chu kì là","options": ["A. $a_{ht} = \\frac{4\\pi^2 r}{T^2}$.","B. $a_{ht} = \\frac{2\\pi r}{T}$.","C. $a_{ht} = \\frac{4\\pi r}{T}$.","D. $a_{ht} = \\frac{2\\pi r^2}{T^2}$."],"answer": "A","explain": "$a_{ht} = \\omega^2 r$, $\\omega = 2\\pi/T$.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật chuyển động tròn đều, lực hướng tâm","options": ["A. không sinh công.","B. sinh công dương.","C. sinh công âm.","D. sinh công thay đổi."],"answer": "A","explain": "Lực vuông góc với hướng dịch chuyển.","points": 0.25},{"type": "mcq","level": "TH","q": "Gia tốc hướng tâm phụ thuộc vào","options": ["A. tốc độ dài và bán kính quỹ đạo.","B. khối lượng của vật.","C. thời gian chuyển động.","D. quãng đường đi được."],"answer": "A","explain": "$a_{ht} = v^2/r$.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi xe vào đoạn đường cong, người lái cần giảm tốc độ vì","options": ["A. lực hướng tâm cần thiết tỉ lệ với bình phương tốc độ, dễ vượt quá ma sát cực đại.","B. trọng lực của xe tăng lên.","C. động cơ yếu đi.","D. bánh xe mòn nhanh."],"answer": "A","explain": "$F_{ht} = mv^2/r$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $0,6\\ \\text{kg}$ chuyển động tròn đều với tốc độ $12\\ \\text{m/s}$ trên đường tròn bán kính $0,4\\ \\text{m}$. Lực hướng tâm tác dụng lên vật bằng","options": ["A. $216\\ \\text{N}$.","B. $18\\ \\text{N}$.","C. $7,2\\ \\text{N}$.","D. $432\\ \\text{N}$."],"answer": "A","explain": "$F = 0,6 \\cdot 144/0,4 = 216\\ \\text{N}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Trạm vũ trụ ISS chuyển động tròn đều quanh Trái Đất với chu kì $92$ phút trên quỹ đạo bán kính $6800\\ \\text{km}$. Tốc độ của trạm xấp xỉ","options": ["A. $7,7\\ \\text{km/s}$.","B. $1,23\\ \\text{km/s}$.","C. $73,9\\ \\text{km/s}$.","D. $0,46\\ \\text{km/s}$."],"answer": "A","explain": "$v = 2\\pi \\cdot 6800000/5520 \\approx 7739\\ \\text{m/s} \\approx 7,7\\ \\text{km/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Chuyển động tròn đều có gia tốc.","b) Gia tốc của chuyển động tròn đều hướng vào tâm.","c) Độ lớn gia tốc của chuyển động tròn đều không đổi.","d) Hướng của gia tốc trong chuyển động tròn đều không đổi."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: hướng luôn đổi (luôn vào tâm).","points": 1},{"type": "truefalse","level": "VDC","q": "Một vật khối lượng $m$ chuyển động tròn đều với tốc độ $v$ trên đường tròn bán kính $r$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Gia tốc hướng tâm của vật là $v^2/r$.","b) Lực hướng tâm tác dụng lên vật là $mv^2/r$.","c) Khi $v$ tăng gấp đôi ($r$ không đổi) thì lực hướng tâm tăng gấp bốn.","d) Khi $m$ tăng gấp đôi ($v$, $r$ không đổi) thì gia tốc hướng tâm tăng gấp đôi."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $a_{ht}$ không phụ thuộc $m$.","points": 1},{"type": "short","level": "VDC","q": "Một ô tô $1200\\ \\text{kg}$ đi qua đoạn đường cong bán kính $75\\ \\text{m}$ với tốc độ $18\\ \\text{m/s}$. Lực hướng tâm tác dụng lên ô tô bằng bao nhiêu N? (chỉ điền số)","answer": "5184","explain": "$F = 1200 \\cdot 324/75 = 5184\\ \\text{N}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một con lắc đơn dài $0,8\\ \\text{m}$, vật nặng $0,25\\ \\text{kg}$; tại vị trí dây hợp với phương thẳng đứng góc $53^\\circ$ ($\\cos53^\\circ \\approx 0,6$), tốc độ của vật bằng $3\\ \\text{m/s}$. Lực căng dây lúc đó bằng bao nhiêu N? (lấy $g = 10\\ \\text{m/s}^2$, chỉ điền số)","answer": "4.31","explain": "$T - mg\\cos53^\\circ = mv^2/l$. $T = 0,25 \\cdot 10 \\cdot 0,6 + 0,25 \\cdot 9/0,8 = 1,5 + 2,8125 = 4,3125 \\approx 4,31\\ \\text{N}$.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Lực giữ cho vệ tinh chuyển động tròn quanh Trái Đất là","options": ["A. lực hấp dẫn của Trái Đất.","B. lực đẩy của động cơ.","C. lực ma sát.","D. lực căng dây."],"answer": "A","explain": "Lực hấp dẫn đóng vai trò lực hướng tâm.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật chuyển động tròn đều với bán kính $r$, tốc độ góc $\\omega$. Động năng của vật","options": ["A. bằng $\\frac{1}{2}m\\omega^2 r^2$ và không đổi.","B. bằng $m\\omega^2 r^2$ và tăng dần.","C. bằng 0.","D. thay đổi liên tục."],"answer": "A","explain": "$W_đ = mv^2/2 = m\\omega^2 r^2/2$, không đổi.","points": 0.25},{"type": "mcq","level": "TH","q": "Gia tốc hướng tâm của vật chuyển động tròn đều bằng 0 khi","options": ["A. vật đứng yên (không chuyển động).","B. vật chuyển động nhanh.","C. bán kính rất lớn.","D. không bao giờ bằng 0."],"answer": "A","explain": "$v = 0$ thì $a_{ht} = 0$.","points": 0.25},{"type": "mcq","level": "TH","q": "Độ lớn lực hướng tâm tỉ lệ thuận với","options": ["A. khối lượng của vật (khi $v$, $r$ không đổi).","B. bán kính quỹ đạo (khi $v$ không đổi).","C. chu kì (khi $r$ không đổi).","D. tốc độ dài (khi $r$ không đổi)."],"answer": "A","explain": "$F = mv^2/r$: tỉ lệ thuận với $m$, tỉ lệ NGHỊCH với $r$, tỉ lệ với $v^2$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $5\\ \\text{kg}$ chuyển động tròn đều với tốc độ góc $2\\ \\text{rad/s}$ trên đường tròn bán kính $2,5\\ \\text{m}$. Gia tốc hướng tâm của vật bằng","options": ["A. $10\\ \\text{m/s}^2$.","B. $4\\ \\text{m/s}^2$.","C. $25\\ \\text{m/s}^2$.","D. $5\\ \\text{m/s}^2$."],"answer": "A","explain": "$a = 4 \\cdot 2,5 = 10\\ \\text{m/s}^2$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một viên đá $0,3\\ \\text{kg}$ buộc vào dây dài $1,2\\ \\text{m}$ quay tròn đều trong mặt phẳng ngang với tốc độ $4\\ \\text{m/s}$ (dây nằm ngang). Lực căng dây bằng","options": ["A. $4\\ \\text{N}$.","B. $1\\ \\text{N}$.","C. $14,4\\ \\text{N}$.","D. $0,83\\ \\text{N}$."],"answer": "A","explain": "$T = 0,3 \\cdot 16/1,2 = 4\\ \\text{N}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Mọi vật chuyển động tròn đều đều chịu tác dụng của lực hướng tâm.","b) Lực hướng tâm có thể do một lực hoặc hợp lực của nhiều lực tạo nên.","c) Phương của lực hướng tâm trùng với phương của bán kính quỹ đạo.","d) Chiều của lực hướng tâm hướng ra xa tâm quỹ đạo."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng: dọc theo bán kính. d) Sai: hướng VÀO tâm.","points": 1},{"type": "truefalse","level": "VDC","q": "Một máy bay biểu diễn nhào lộn theo vòng tròn thẳng đứng bán kính $150\\ \\text{m}$ với tốc độ không đổi $60\\ \\text{m/s}$. Xét tính đúng, sai của các khẳng định sau (lấy $g = 10\\ \\text{m/s}^2$):","statements": ["a) Gia tốc hướng tâm của máy bay bằng $24\\ \\text{m/s}^2$.","b) Tại điểm thấp nhất, gia tốc hướng tâm hướng lên trên.","c) Tại điểm cao nhất, gia tốc hướng tâm hướng xuống dưới.","d) Lực hướng tâm tác dụng lên máy bay thay đổi độ lớn theo vị trí."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $a = 3600/150 = 24\\ \\text{m/s}^2$. b) Đúng: hướng vào tâm (lên trên). c) Đúng: hướng vào tâm (xuống dưới). d) Sai: tốc độ không đổi nên độ lớn $F_{ht}$ không đổi.","points": 1},{"type": "short","level": "VDC","q": "Một chất điểm chuyển động tròn đều với gia tốc hướng tâm $25\\ \\text{m/s}^2$ trên đường tròn bán kính $0,64\\ \\text{m}$. Tốc độ góc của chất điểm bằng bao nhiêu rad/s? (chỉ điền số)","answer": "6.25","explain": "$\\omega = \\sqrt{a/r} = \\sqrt{25/0,64} = \\sqrt{39,0625} = 6,25\\ \\text{rad/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật $0,5\\ \\text{kg}$ chuyển động tròn đều trên đường tròn bán kính $0,4\\ \\text{m}$ với động năng $20\\ \\text{J}$. Lực hướng tâm tác dụng lên vật bằng bao nhiêu N? (chỉ điền số)","answer": "100","explain": "$W_đ = mv^2/2 = 20$, $mv^2 = 40$. $F_{ht} = mv^2/r = 40/0,4 = 100\\ \\text{N}$.","points": 0.5}]}]}
