{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Chuyển động tròn đều được định nghĩa là chuyển động","options": ["A. có quỹ đạo tròn và tốc độ dài không đổi.","B. có quỹ đạo tròn và gia tốc bằng 0.","C. có tốc độ góc thay đổi đều.","D. có quỹ đạo thẳng."],"answer": "A","explain": "Định nghĩa chuyển động tròn đều.","points": 0.25},{"type": "mcq","level": "NB","q": "Gia tốc hướng tâm luôn","options": ["A. hướng vào tâm quỹ đạo.","B. hướng ra xa tâm quỹ đạo.","C. tiếp tuyến với quỹ đạo.","D. bằng 0."],"answer": "A","explain": "Định nghĩa gia tốc hướng tâm.","points": 0.25},{"type": "mcq","level": "NB","q": "Công thức nào sau đây tính đúng độ lớn lực hướng tâm?","options": ["A. $F_{ht} = m\\frac{v^2}{r}$.","B. $F_{ht} = mvr$.","C. $F_{ht} = \\frac{m}{vr}$.","D. $F_{ht} = mv^2r^2$."],"answer": "A","explain": "$F_{ht} = ma_{ht} = mv^2/r$.","points": 0.25},{"type": "mcq","level": "NB","q": "Tần số của chuyển động tròn đều có đơn vị là","options": ["A. héc (Hz).","B. giây (s).","C. rad/s.","D. vòng."],"answer": "A","explain": "Đơn vị Hz.","points": 0.25},{"type": "mcq","level": "TH","q": "Một chất điểm chuyển động tròn đều với chu kì $0,8\\ \\text{s}$. Tần số của chuyển động bằng","options": ["A. $1,25\\ \\text{Hz}$.","B. $0,8\\ \\text{Hz}$.","C. $5\\ \\text{Hz}$.","D. $8\\ \\text{Hz}$."],"answer": "A","explain": "$f = 1/0,8 = 1,25\\ \\text{Hz}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $0,9\\ \\text{kg}$ chuyển động tròn đều với tốc độ $6\\ \\text{m/s}$ trên đường tròn bán kính $0,45\\ \\text{m}$. Lực hướng tâm tác dụng lên vật bằng","options": ["A. $72\\ \\text{N}$.","B. $12\\ \\text{N}$.","C. $10,8\\ \\text{N}$.","D. $108\\ \\text{N}$."],"answer": "A","explain": "$F = 0,9 \\cdot 36/0,45 = 72\\ \\text{N}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Trong chuyển động tròn đều, tốc độ dài không đổi.","b) Trong chuyển động tròn đều, vectơ vận tốc không hức $a_{ht} = \\omega^2 r$ cho biết","options": ["A. gia tốc hướng tâm tỉ lệ thuận với bình phương tốc độ góc.","B. gia tốc hướng tâm tỉ lệ nghịch với bán kính.","C. gia tốc hướng tâm không phụ thuộc tốc độ góc.","D. gia tốc hướng tâm tỉ lệ thuận với tốc độ góc."],"answer": "A","explain": "$a_{ht} \\propto \\omega^2$.","points": 0.25},{"type": "mcq","level": "NB","q": "Lực hướng tâm KHÔNG phải là","options": ["A. một loại lực cơ học hoàn toàn mới.","B. hợp lực của các lực tác dụng lên vật.","C. nguyên nhân gây ra gia tốc hướng tâm.","D. lực luôn hướng vào tâm quỹ đạo."],"answer": "A","explain": "Lực hướng tâm không phải lực mới.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật quay một vòng hết $T$ giây. Tốc độ góc của vật bằng","options": ["A. $\\frac{2\\pi}{T}$.","B. $\\frac{T}{2\\pi}$.","C. $2\\pi T$.","D. $\\frac{\\pi}{T}$."],"answer": "A","explain": "$\\omega = 2\\pi/T$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một mô hình máy bay quay tròn đều với tốc độ góc $2,5\\ \\text{rad/s}$ trên đường tròn bán kính $2\\ \\text{m}$. Tốc độ dài của mô hình bằng","options": ["A. $5\\ \\text{m/s}$.","B. $1,25\\ \\text{m/s}$.","C. $0,8\\ \\text{m/s}$.","D. $10\\ \\text{m/s}$."],"answer": "A","explain": "$v = 2,5 \\cdot 2 = 5\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một chất điểm chuyển động tròn đều với tốc độ góc $8\\ \\text{rad/s}$ trên đường tròn bán kính $0,25\\ \\text{m}$. Gia tốc hướng tâm của chất điểm bằng","options": ["A. $16\\ \\text{m/s}^2$.","B. $2\\ \\text{m/s}^2$.","C. $64\\ \\text{m/s}^2$.","D. $0,5\\ \\text{m/s}^2$."],"answer": "A","explain": "$a = 64 \\cdot 0,25 = 16\\ \\text{m/s}^2$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Chu kì là thời gian vật đi hết một vòng tròn.","b) Tần số là số vòng vật đi được trong 1 giây.","c) $T$ càng lớn thì $f$ càng lớn.","d) $\\omega = 2\\pi f$."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: $f = 1/T$. d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Một ô tô $1100\\ \\text{kg}$ đi qua đoạn đường cong bán kính $55\\ \\text{m}$ với tốc độ $14\\ \\text{m/s}$. Xét tính đúng, sai của các khẳng định sau (lực ma sát nghỉ đóng vai trò lực hướng tâm):","statements": ["a) Gia tốc hướng tâm của ô tô xấp xỉ $3,56\\ \\text{m/s}^2$.","b) Lực hướng tâm tác dụng lên ô tô xấp xỉ $3920\\ \\text{N}$.","c) Nếu tốc độ tăng lên $28\\ \\text{m/s}$ thì lực hướng tâm tăng gấp đôi.","d) Để vào cua an toàn khi đường trơn, người lái nên giảm tốc độ."],"answer": ["T","T","F","T"],"explain": "a) Đúng: $a = 196/55 \\approx 3,56\\ \\text{m/s}^2$. b) Đúng: $F = 1100 \\cdot 3,56 \\approx 3920\\ \\text{N}$. c) Sai: tăng gấp BỐN. d) Đúng.","points": 1},{"type": "short","level": "VD","q": "Một vệ tinh chuyển động tròn đều với tốc độ góc $1,2 \\cdot 10^{-3}\\ \\text{rad/s}$ trên quỹ đạo bán kính $7000\\ \\text{km}$. Tốc độ dài của vệ tinh bằng bao nhiêu km/s? (chỉ điền số, làm tròn đến 1 chữ số thập phân)","answer": "8.4","explain": "$v = \\omega r = 1,2 \\cdot 10^{-3} \\cdot 7 \\cdot 10^6 = 8400\\ \\text{m/s} = 8,4\\ \\text{km/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật chuyển động tròn đều trên đường tròn bán kính $r$. Khi giảm tốc độ dài đi một nửa (giữ nguyên $r$) thì gia tốc hướng tâm giảm đi bao nhiêu lần? (chỉ điền số)","answer": "4","explain": "$a_{ht} \\propto v^2$ nên giảm $4$ lần.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Trong chuyển động tròn đều, quãng đường vật đi được trong thời gian $t$ là","options": ["A. $s = vt$ với $v$ không đổi.","B. $s = \\frac{1}{2}at^2$.","C. $s = v_0t + \\frac{1}{2}at^2$.","D. $s = \\frac{v}{t}$."],"answer": "A","explain": "$v$ không đổi nên $s = vt$.","points": 0.25},{"type": "mcq","level": "NB","q": "Vectơ vận tốc trong chuyển động tròn đều","options": ["A. tiếp tuyến với quỹ đạo tại mỗi điểm.","B. hướng vào tâm quỹ đạo.","C. hướng ra xa tâm quỹ đạo.","D. trùng với vectơ gia tốc."],"answer": "A","explain": "Vận tốc tiếp tuyến với đường tròn.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi bán kính quỹ đạo tăng gấp đôi, tốc độ dài không đổi thì lực hướng tâm","options": ["A. giảm một nửa.","B. tăng gấp đôi.","C. tăng gấp bốn.","D. không đổi."],"answer": "A","explain": "$F_{ht} = mv^2/r$.","points": 0.25},{"type": "mcq","level": "NB","q": "Góc $\\frac{\\pi}{2}\\ \\text{rad}$ tương ứng với","options": ["A. $90^\\circ$.","B. $180^\\circ$.","C. $45^\\circ$.","D. $360^\\circ$."],"answer": "A","explain": "$\\pi/2\\ \\text{rad} = 90^\\circ$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một đĩa hát quay với tốc độ $33\\ \\text{vòng/phút}$. Tốc độ góc của đĩa xấp xỉ (lấy $\\pi \\approx 3,14$)","options": ["A. $3,45\\ \\text{rad/s}$.","B. $33\\ \\text{rad/s}$.","C. $0,55\\ \\text{rad/s}$.","D. $207\\ \\text{rad/s}$."],"answer": "A","explain": "$f = 0,55\\ \\text{vòng/s}$, $\\omega = 2\\pi \\cdot 0,55 \\approx 3,45\\ \\text{rad/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $2\\ \\text{kg}$ buộc vào dây dài $0,9\\ \\text{m}$ quay tròn đều trong mặt phẳng ngang với tốc độ $6\\ \\text{m/s}$ (dây nằm ngang). Lực căng dây bằng","options": ["A. $80\\ \\text{N}$.","B. $13,3\\ \\text{N}$.","C. $6,7\\ \\text{N}$.","D. $240\\ \\text{N}$."],"answer": "A","explain": "$T = 2 \\cdot 36/0,9 = 80\\ \\text{N}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Mọi điểm trên vật rắn quay đều có cùng tốc độ góc.","b) Điểm càng xa trục quay thì tốc độ dài càng lớn.","c) Điểm càng xa trục quay thì chu kì càng lớn.","d) $v = \\omega r$ đúng với mọi điểm trên vật rắn quay đều."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: chu kì như nhau. d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Một con lắc đơn dài $0,64\\ \\text{m}$, vật nặng $0,15\\ \\text{kg}$; khi qua vị trí cân bằng, vật có tốc độ $1,6\\ \\text{m/s}$. Xét tính đúng, sai của các khẳng định sau (lấy $g = 10\\ \\text{m/s}^2$):","statements": ["a) Gia tốc hướng tâm của vật lúc đó bằng $4\\ \\text{m/s}^2$.","b) Lực hướng tâm tác dụng lên vật bằng $0,6\\ \\text{N}$.","c) Lực căng dây lúc đó bằng $2,1\\ \\text{N}$.","d) Trọng lực của vật đóng vai trò duy nhất làm lực hướng tâm."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $a = 2,56/0,64 = 4\\ \\text{m/s}^2$. b) Đúng: $F = 0,15 \\cdot 4 = 0,6\\ \\text{N}$. c) Đúng: $T = mg + 0,6 = 2,1\\ \\text{N}$. d) Sai: hợp lực của $\\vec{T}$ và $\\vec{P}$.","points": 1},{"type": "short","level": "VD","q": "Một chất điểm chuyển động tròn đều với tần số $3\\ \\text{Hz}$ trên đường tròn bán kính $0,5\\ \\text{m}$. Gia tốc hướng tâm của chất điểm bằng bao nhiêu $\\text{m/s}^2$? (chỉ điền số, lấy $\\pi^2 \\approx 9,87$)","answer": "177.66","explain": "$a = (6\\pi)^2 \\cdot 0,5 = 18\\pi^2 \\approx 177,66\\ \\text{m/s}^2$.","points": 0.5},{"type": "short","level": "VDC","q": "Một ô tô $1300\\ \\text{kg}$ đi qua đường cong bán kính $65\\ \\text{m}$; hệ số ma sát nghỉ cực đại giữa lốp và đường là $0,5$ (lấy $g = 10\\ \\text{m/s}^2$). Tốc độ tối đa để xe không trượt bằng bao nhiêu m/s? (chỉ điền số, làm tròn đến 1 chữ số thập phân)","answer": "18","explain": "$F_{msn\\,max} = 0,5 \\cdot 13000 = 6500\\ \\text{N}$. $v_{max} = \\sqrt{6500 \\cdot 65/1300} = \\sqrt{325} \\approx 18,03\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "NB","q": "Đơn vị của tốc độ góc là","options": ["A. $\\text{rad/s}$.","B. $\\text{m/s}$.","C. $\\text{Hz}$.","D. $\\text{s}$."],"answer": "A","explain": "Đơn vị rad/s.","points": 0.25},{"type": "mcq","level": "NB","q": "Lực nào sau đây thường đóng vai trò lực hướng tâm khi xe đi qua đoạn đường cong nằm ngang?","options": ["A. Lực ma sát nghỉ.","B. Trọng lực.","C. Lực phát động.","D. Lực quán tính."],"answer": "A","explain": "Ma sát nghỉ hướng vào tâm.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật chuyển động tròn đều với tốc độ góc $\\omega$ không đổi. Nếu bán kính tăng gấp đôi thì tốc độ dài","options": ["A. tăng gấp đôi.","B. giảm một nửa.","C. không đổi.","D. tăng gấp bốn."],"answer": "A","explain": "$v = \\omega r$.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong chuyển động tròn đều, đại lượng nào sau đây có hướng thay đổi liên tục?","options": ["A. Vectơ vận tốc.","B. Tốc độ dài.","C. Tốc độ góc.","D. Chu kì."],"answer": "A","explain": "Hướng vận tốc (tiếp tuyến) luôn đổi.","points": 0.25},{"type": "mcq","level": "TH","q": "Một bánh xe có bán kính $0,4\\ \\text{m}$ quay đều với chu kì $0,2\\ \\text{s}$. Tốc độ dài của điểm ở vành bánh xe bằng (lấy $\\pi \\approx 3,14$)","options": ["A. $12,56\\ \\text{m/s}$.","B. $2\\ \\text{m/s}$.","C. $0,8\\ \\text{m/s}$.","D. $6,28\\ \\text{m/s}$."],"answer": "A","explain": "$v = 2\\pi \\cdot 0,4/0,2 = 4\\pi \\approx 12,56\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $0,7\\ \\text{kg}$ chuyển động tròn đều với tốc độ góc $10\\ \\text{rad/s}$ trên đường tròn bán kính $0,35\\ \\text{m}$. Lực hướng tâm tác dụng lên vật bằng","options": ["A. $24,5\\ \\text{N}$.","B. $2,45\\ \\text{N}$.","C. $245\\ \\text{N}$.","D. $0,245\\ \\text{N}$."],"answer": "A","explain": "$F = 0,7 \\cdot 100 \\cdot 0,35 = 24,5\\ \\text{N}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) $1$ vòng tròn tương ứng với góc $2\\pi\\ \\text{rad}$.","b) $180^\\circ$ tương ứng với $\\pi\\ \\text{rad}$.","c) Radian là đơn vị đo góc.","d) Độ dài cung tròn bằng tích của bán kính và số đo góc (rad)."],"answer": ["T","T","T","T"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: $s = r\\theta$.","points": 1},{"type": "truefalse","level": "VD","q": "Trái Đất quay quanh Mặt Trời gần đúng là chuyển động tròn đều với bán kính quỹ đạo $1,5 \\cdot 10^{11}\\ \\text{m}$, chu kì $365$ ngày. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tốc độ góc của Trái Đất xấp xỉ $2 \\cdot 10^{-7}\\ \\text{rad/s}$.","b) Tốc độ dài của Trái Đất xấp xỉ $30\\ \\text{km/s}$.","c) Lực hấp dẫn của Mặt Trời đóng vai trò lực hướng tâm.","d) Gia tốc hướng tâm của Trái Đất hướng ra xa Mặt Trời."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $\\omega = 2\\pi/(365 \\cdot 86400) \\approx 1,99 \\cdot 10^{-7}\\ \\text{rad/s}$. b) Đúng: $v \\approx 29,9\\ \\text{km/s}$. c) Đúng. d) Sai: hướng VÀO Mặt Trời.","points": 1},{"type": "short","level": "VDC","q": "Một điểm trên vành đĩa quay đều có gia tốc hướng tâm $50\\ \\text{m/s}^2$; đĩa quay với tốc độ góc $10\\ \\text{rad/s}$. Bán kính của đĩa bằng bao nhiêu m? (chỉ điền số)","answer": "0.5","explain": "$r = a/\\omega^2 = 50/100 = 0,5\\ \\text{m}$.","points": 0.5},{"type": "short","level": "VDC","q": "Hai chất điểm chuyển động tròn đều trên hai đường tròn đồng tâm với cùng tốc độ dài $v$; bán kính $r_1 = 3r_2$. Tỉ số gia tốc hướng tâm $a_1/a_2$ bằng bao nhiêu? (chỉ điền số, dạng thập phân)","answer": "0.33","explain": "$a = v^2/r$ nên $a_1/a_2 = r_2/r_1 = 1/3 \\approx 0,33$.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Chu kì của chuyển động tròn đều là","options": ["A. thời gian vật đi hết một vòng.","B. số vòng vật đi được trong 1 giây.","C. góc quét được trong 1 giây.","D. quãng đường đi được trong 1 giây."],"answer": "A","explain": "Định nghĩa chu kì.","points": 0.25},{"type": "mcq","level": "NB","q": "Gia tốc hướng tâm có độ lớn được tính bằng","options": ["A. $a_{ht} = \\frac{v^2}{r}$.","B. $a_{ht} = vr$.","C. $a_{ht} = \\frac{r}{v}$.","D. $a_{ht} = v^2r^2$."],"answer": "A","explain": "Công thức gia tốc hướng tâm.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi tốc độ dài tăng gấp đôi, bán kính không đổi thì lực hướng tâm","options": ["A. tăng gấp 4 lần.","B. tăng gấp đôi.","C. giảm một nửa.","D. không đổi."],"answer": "A","explain": "$F_{ht} \\propto v^2$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật chuyển động tròn đều với tần số $f$. Chu kì của vật bằng","options": ["A. $\\frac{1}{f}$.","B. $f$.","C. $2\\pi f$.","D. $\\frac{f}{2\\pi}$."],"answer": "A","explain": "$T = 1/f$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một quạt trần quay với tốc độ $300\\ \\text{vòng/phút}$. Tốc độ góc của quạt bằng (lấy $\\pi \\approx 3,14$)","options": ["A. $31,4\\ \\text{rad/s}$.","B. $300\\ \\text{rad/s}$.","C. $5\\ \\text{rad/s}$.","D. $1884\\ \\text{rad/s}$."],"answer": "A","explain": "$f = 5\\ \\text{vòng/s}$, $\\omega = 10\\pi \\approx 31,4\\ \\text{rad/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $1,8\\ \\text{kg}$ chuyển động tròn đều với tốc độ $7\\ \\text{m/s}$ trên đường tròn bán kính $0,7\\ \\text{m}$. Lực hướng tâm tác dụng lên vật bằng","options": ["A. $126\\ \\text{N}$.","B. $18\\ \\text{N}$.","C. $12,6\\ \\text{N}$.","D. $882\\ \\text{N}$."],"answer": "A","explain": "$F = 1,8 \\cdot 49/0,7 = 126\\ \\text{N}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lực hướng tâm luôn hướng vào tâm quỹ đạo.","b) Lực hướng tâm làm thay đổi độ lớn của vận tốc.","c) Hợp lực tác dụng lên vật chuyển động tròn đều chính là lực hướng tâm.","d) Lực hướng tâm không sinh công trong chuyển động tròn đều."],"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: chỉ đổi hướng. c) Đúng. d) Đúng: vuông góc với hướng dịch chuyển.","points": 1},{"type": "truefalse","level": "VD","q": "Một vệ tinh $600\\ \\text{kg}$ chuyển động tròn đều quanh Trái Đất với tốc độ $7,6\\ \\text{km/s}$ trên quỹ đạo bán kính $6900\\ \\text{km}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Gia tốc hướng tâm của vệ tinh xấp xỉ $8,37\\ \\text{m/s}^2$.","b) Lực hướng tâm (lực hấp dẫn) tác dụng lên vệ tinh xấp xỉ $5022\\ \\text{N}$.","c) Nếu vệ tinh bay cao hơn (bán kính lớn hơn) với cùng tốc độ thì lực hướng tâm giảm.","d) Chu kì của vệ tinh khoảng $95$ phút."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $a = 7600^2/6900000 \\approx 8,37\\ \\text{m/s}^2$. b) Đúng: $F = 600 \\cdot 8,37 \\approx 5022\\ \\text{N}$. c) Đúng: $F \\propto 1/r$. d) Đúng: $T = 2\\pi r/v \\approx 5705\\ \\text{s} \\approx 95$ phút.","points": 1},{"type": "short","level": "VDC","q": "Một chất điểm chuyển động tròn đều với tốc độ dài $4\\ \\text{m/s}$ trên đường tròn bán kính $0,8\\ \\text{m}$. Tốc độ góc của chất điểm bằng bao nhiêu rad/s? (chỉ điền số)","answer": "5","explain": "$\\omega = 4/0,8 = 5\\ \\text{rad/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật $0,4\\ \\text{kg}$ buộc vào dây dài $l$ quay tròn đều trong mặt phẳng ngang với tốc độ $5\\ \\text{m/s}$; lực căng dây bằng $50\\ \\text{N}$ (dây nằm ngang). Chiều dài sợi dây bằng bao nhiêu m? (chỉ điền số)","answer": "0.2","explain": "$l = mv^2/T = 0,4 \\cdot 25/50 = 0,2\\ \\text{m}$.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Trong chuyển động tròn đều, tốc độ dài","options": ["A. không đổi theo thời gian.","B. tăng đều theo thời gian.","C. giảm đều theo thời gian.","D. tỉ lệ thuận với thời gian."],"answer": "A","explain": "Định nghĩa.","points": 0.25},{"type": "mcq","level": "NB","q": "Lực giữ cho vật chuyển động tròn đều trên mặt phẳng ngang nhẵn khi buộc vào dây là","options": ["A. lực căng dây.","B. trọng lực.","C. lực ma sát.","D. lực đàn hồi của mặt phẳng."],"answer": "A","explain": "Lực căng dây hướng vào tâm.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật chuyển động tròn đều với bán kính $r$ và chu kì $T$. Tốc độ dài của vật bằng","options": ["A. $\\frac{2\\pi r}{T}$.","B. $\\frac{2\\pi T}{r}$.","C. $\\frac{rT}{2\\pi}$.","D. $2\\pi rT$."],"answer": "A","explain": "$v = 2\\pi r/T$.","points": 0.25},{"type": "mcq","level": "TH","q": "Gia tốc hướng tâm tỉ lệ thuận với","options": ["A. bình phương tốc độ góc (khi $r$ không đổi).","B. tốc độ góc (khi $r$ không đổi).","C. khối lượng vật.","D. thời gian chuyển động."],"answer": "A","explain": "$a_{ht} = \\omega^2 r$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một điểm trên vành xe đạp có đường kính $0,66\\ \\text{m}$; xe chạy với tốc độ $33\\ \\text{km/h}$ (bánh lăn không trượt). Tốc độ góc của bánh xe xấp xỉ (lấy $\\pi \\approx 3,14$)","options": ["A. $27,8\\ \\text{rad/s}$.","B. $8,8\\ \\text{rad/s}$.","C. $50\\ \\text{rad/s}$.","D. $174\\ \\text{rad/s}$."],"answer": "A","explain": "$v = 9,17\\ \\text{m/s}$, $r = 0,33\\ \\text{m}$, $\\omega = 9,17/0,33 \\approx 27,8\\ \\text{rad/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $2,2\\ \\text{kg}$ chuyển động tròn đều với chu kì $0,4\\ \\text{s}$ trên đường tròn bán kính $0,55\\ \\text{m}$. Lực hướng tâm tác dụng lên vật xấp xỉ (lấy $\\pi^2 \\approx 9,87$)","options": ["A. $298,6\\ \\text{N}$.","B. $74,6\\ \\text{N}$.","C. $1194\\ \\text{N}$.","D. $18,7\\ \\text{N}$."],"answer": "A","explain": "$F = 2,2 \\cdot (5\\pi)^2 \\cdot 0,55 = 30,25\\pi^2 \\approx 298,6\\ \\text{N}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Radian là đơn vị đo góc.","b) $2\\pi\\ \\text{rad}$ tương ứng với $1$ vòng tròn.","c) Tốc độ góc có đơn vị là vòng/s.","d) $v = \\omega r$ liên hệ tốc độ dài và tốc độ góc."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: rad/s. d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Một người $55\\ \\text{kg}$ ngồi trên đu quay đứng bán kính $5\\ \\text{m}$, quay đều với tốc độ $7\\ \\text{m/s}$. Xét tính đúng, sai của các khẳng định sau (lấy $g = 10\\ \\text{m/s}^2$):","statements": ["a) Gia tốc hướng tâm của người bằng $9,8\\ \\text{m/s}^2$.","b) Lực hướng tâm tác dụng lên người bằng $539\\ \\text{N}$.","c) Ở vị trí thấp nhất, ghế tác dụng lên người lực $1089\\ \\text{N}$.","d) Ở vị trí cao nhất, người có cảm giác nặng hơn so với khi đứng yên."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $a = 49/5 = 9,8\\ \\text{m/s}^2$. b) Đúng: $F = 55 \\cdot 9,8 = 539\\ \\text{N}$. c) Đúng: $N = 550 + 539 = 1089\\ \\text{N}$. d) Sai: $N = 550 - 539 = 11\\ \\text{N}$ nên cảm giác NHẸ hơn.","points": 1},{"type": "short","level": "VDC","q": "Một vật chuyển động tròn đều với gia tốc hướng tâm $18\\ \\text{m/s}^2$ trên đường tròn bán kính $0,5\\ \\text{m}$. Tốc độ dài của vật bằng bao nhiêu m/s? (chỉ điền số)","answer": "3","explain": "$v = \\sqrt{18 \\cdot 0,5} = 3\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một máy bay nhào lộn theo vòng tròn thẳng đứng bán kính $120\\ \\text{m}$ với tốc độ $48\\ \\text{m/s}$ không đổi. Áp lực của người phi công ($75\\ \\text{kg}$) lên ghế ở điểm cao nhất bằng bao nhiêu N? (lấy $g = 10\\ \\text{m/s}^2$, chỉ điền số)","answer": "690","explain": "$a_{ht} = 48^2/120 = 19,2\\ \\text{m/s}^2$. $N + mg = ma$, $N = 75 \\cdot (19,2 - 10) = 690\\ \\text{N}$.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Phát biểu nào sau đây đúng về chuyển động tròn đều?","options": ["A. Tốc độ dài không đổi, tốc độ góc không đổi.","B. Vectơ vận tốc không đổi.","C. Gia tốc bằng 0.","D. Lực tác dụng lên vật bằng 0."],"answer": "A","explain": "Chỉ hướng của vận tốc thay đổi.","points": 0.25},{"type": "mcq","level": "NB","q": "Độ lớn gia tốc hướng tâm được tính bằng công thức","options": ["A. $a_{ht} = \\omega^2 r$.","B. $a_{ht} = \\omega r^2$.","C. $a_{ht} = \\frac{\\omega}{r}$.","D. $a_{ht} = \\frac{r}{\\omega^2}$."],"answer": "A","explain": "Công thức.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật có khối lượng $m$ chuyển động tròn đều. Lực hướng tâm tác dụng lên vật","options": ["A. tỉ lệ thuận với $m$.","B. tỉ lệ nghịch với $m$.","C. không phụ thuộc $m$.","D. tỉ lệ với $m^2$."],"answer": "A","explain": "$F_{ht} = mv^2/r$.","points": 0.25},{"type": "mcq","level": "TH","q": "Kim phút của đồng hồ dài $10\\ \\text{cm}$. Tốc độ dài của đầu kim phút xấp xỉ","options": ["A. $1,75 \\cdot 10^{-4}\\ \\text{m/s}$.","B. $1,05 \\cdot 10^{-2}\\ \\text{m/s}$.","C. $10\\ \\text{m/s}$.","D. $0,1\\ \\text{m/s}$."],"answer": "A","explain": "$\\omega = 2\\pi/3600$, $v = \\omega \\cdot 0,1 \\approx 1,75 \\cdot 10^{-4}\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một chất điểm chuyển động tròn đều, trong $4\\ \\text{s}$ quay được $10$ vòng. Tần số của chuyển động bằng","options": ["A. $2,5\\ \\text{Hz}$.","B. $0,4\\ \\text{Hz}$.","C. $40\\ \\text{Hz}$.","D. $10\\ \\text{Hz}$."],"answer": "A","explain": "$f = 10/4 = 2,5\\ \\text{Hz}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $0,5\\ \\text{kg}$ chuyển động tròn đều với tốc độ $9\\ \\text{m/s}$ trên đường tròn bán kính $0,3\\ \\text{m}$. Gia tốc hướng tâm của vật bằng","options": ["A. $270\\ \\text{m/s}^2$.","B. $30\\ \\text{m/s}^2$.","C. $15\\ \\text{m/s}^2$.","D. $135\\ \\text{m/s}^2$."],"answer": "A","explain": "$a = 81/0,3 = 270\\ \\text{m/s}^2$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Chuyển động của đầu kim đồng hồ là chuyển động tròn đều.","b) Tốc độ dài của đầu kim giây lớn hơn đầu kim phút (cùng đồng hồ).","c) Chu kì của kim giây, kim phút và kim giờ đều bằng nhau.","d) Đầu kim giờ có tốc độ góc lớn nhất."],"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng: kim giây vừa dài hơn vừa quay nhanh hơn. c) Sai: kim giây $60\\ \\text{s}$, kim phút $3600\\ \\text{s}$, kim giờ $43200\\ \\text{s}$. d) Sai: kim giờ quay CHẬM nhất nên tốc độ góc nhỏ nhất.","points": 1},{"type": "truefalse","level": "VD","q": "Một sợi dây dài $1,2\\ \\text{m}$ buộc vật $0,3\\ \\text{kg}$, quay tròn đều trong mặt phẳng ngang với tần số $2\\ \\text{Hz}$ (dây nằm ngang). Xét tính đúng, sai của các khẳng định sau (lấy $\\pi^2 \\approx 9,87$):","statements": ["a) Tốc độ góc của vật bằng $4\\pi\\ \\text{rad/s}$.","b) Tốc độ dài của vật xấp xỉ $15,1\\ \\text{m/s}$.","c) Lực căng dây xấp xỉ $56,9\\ \\text{N}$.","d) Nếu tăng tần số lên gấp đôi thì lực căng dây tăng gấp đôi."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $\\omega = 4\\pi\\ \\text{rad/s}$. b) Đúng: $v = 4\\pi \\cdot 1,2 \\approx 15,08\\ \\text{m/s}$. c) Đúng: $T = 0,3 \\cdot (4\\pi)^2 \\cdot 1,2 = 5,76\\pi^2 \\approx 56,85\\ \\text{N}$. d) Sai: $T \\propto f^2$ nên tăng gấp BỐN.","points": 1},{"type": "short","level": "VDC","q": "Một đĩa quay đều với tốc độ góc $15\\ \\text{rad/s}$; một điểm trên đĩa cách trục $0,2\\ \\text{m}$ có gia tốc hướng tâm bằng bao nhiêu $\\text{m/s}^2$? (chỉ điền số)","answer": "45","explain": "$a = 225 \\cdot 0,2 = 45\\ \\text{m/s}^2$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật chuyển động tròn đều với tốc độ dài $v_1$ có lực hướng tâm $F_1$. Khi tốc độ dài tăng lên $v_2 = 1,5v_1$ (giữ nguyên $r$) thì lực hướng tâm bằng $90\\ \\text{N}$. Giá trị $F_1$ bằng bao nhiêu N? (chỉ điền số)","answer": "40","explain": "$F_2/F_1 = (1,5)^2 = 2,25$, $F_1 = 90/2,25 = 40\\ \\text{N}$.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "NB","q": "Trong các đại lượng sau, đại lượng nào KHÔNG đổi trong chuyển động tròn đều?","options": ["A. Tốc độ góc.","B. Vectơ vận tốc.","C. Vectơ gia tốc.","D. Hướng của lực hướng tâm."],"answer": "A","explain": "Các đại lượng vectơ đều đổi hướng.","points": 0.25},{"type": "mcq","level": "NB","q": "Lực hấp dẫn giữa Trái Đất và vệ tinh đóng vai trò","options": ["A. lực hướng tâm giữ vệ tinh chuyển động tròn.","B. lực cản làm vệ tinh chậm lại.","C. lực đẩy vệ tinh ra xa.","D. không có vai trò gì."],"answer": "A","explain": "Lực hấp dẫn là lực hướng tâm.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật chuyển động tròn đều với tốc độ dài $v$ trên đường tròn bán kính $r$. Động năng của vật bằng","options": ["A. $\\frac{1}{2}mv^2$ và không đổi.","B. $mv^2$ và tăng dần.","C. $0$.","D. $\\frac{1}{2}mv^2$ và giảm dần."],"answer": "A","explain": "$v$ không đổi.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi xe chạy qua đoạn đường cong với tốc độ càng lớn thì","options": ["A. lực hướng tâm cần thiết càng lớn.","B. lực hướng tâm cần thiết càng nhỏ.","C. lực hướng tâm không đổi.","D. xe càng bám đường."],"answer": "A","explain": "$F_{ht} \\propto v^2$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vệ tinh chuyển động tròn đều với chu kì $100$ phút. Tốc độ góc của vệ tinh xấp xỉ","options": ["A. $1,05 \\cdot 10^{-3}\\ \\text{rad/s}$.","B. $6,28 \\cdot 10^{-2}\\ \\text{rad/s}$.","C. $100\\ \\text{rad/s}$.","D. $1,67\\ \\text{rad/s}$."],"answer": "A","explain": "$\\omega = 2\\pi/6000 \\approx 1,047 \\cdot 10^{-3}\\ \\text{rad/s}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật $4\\ \\text{kg}$ chuyển động tròn đều với tốc độ góc $6\\ \\text{rad/s}$ trên đường tròn bán kính $0,8\\ \\text{m}$. Lực hướng tâm tác dụng lên vật bằng","options": ["A. $115,2\\ \\text{N}$.","B. $19,2\\ \\text{N}$.","C. $28,8\\ \\text{N}$.","D. $460,8\\ \\text{N}$."],"answer": "A","explain": "$F = 4 \\cdot 36 \\cdot 0,8 = 115,2\\ \\text{N}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Gia tốc hướng tâm làm thay đổi hướng của vận tốc.","b) Gia tốc hướng tâm làm thay đổi độ lớn của vận tốc.","c) Trong chuyển động tròn đều, công của lực hướng tâm bằng 0.","d) Động năng của vật chuyển động tròn đều không đổi."],"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai. c) Đúng: lực vuông góc hướng dịch chuyển. d) Đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Một ô tô khối lượng $1400\\ \\text{kg}$ đi qua cầu vồng xuống (mặt cầu lõm) bán kính cong $50\\ \\text{m}$ với tốc độ $10\\ \\text{m/s}$. Xét tính đúng, sai của các khẳng định sau (lấy $g = 10\\ \\text{m/s}^2$):","statements": ["a) Gia tốc hướng tâm của ô tô bằng $2\\ \\text{m/s}^2$, hướng lên trên.","b) Lực hướng tâm tác dụng lên ô tô bằng $2800\\ \\text{N}$.","c) Áp lực của ô tô lên mặt cầu tại điểm thấp nhất bằng $16800\\ \\text{N}$.","d) Khi qua cầu lõm, người ngồi trong xe có cảm giác nặng hơn."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $a = 100/50 = 2\\ \\text{m/s}^2$ hướng vào tâm (lên trên). b) Đúng: $F = 1400 \\cdot 2 = 2800\\ \\text{N}$. c) Đúng: $N - mg = 2800$, $N = 16800\\ \\text{N}$. d) Đúng.","points": 1},{"type": "short","level": "VDC","q": "Một chất điểm chuyển động tròn đều trên đường tròn bán kính $1,25\\ \\text{m}$ với tốc độ góc $4\\ \\text{rad/s}$. Tốc độ dài của chất điểm bằng bao nhiêu m/s? (chỉ điền số)","answer": "5","explain": "$v = 4 \\cdot 1,25 = 5\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật $0,8\\ \\text{kg}$ chuyển động tròn đều trên đường tròn bán kính $0,5\\ \\text{m}$ với chu kì $0,4\\ \\text{s}$. Lực hướng tâm tác dụng lên vật bằng bao nhiêu N? (chỉ điền số, lấy $\\pi^2 \\approx 9,87$)","answer": "98.7","explain": "$F = 0,8 \\cdot (5\\pi)^2 \\cdot 0,5 = 10\\pi^2 \\approx 98,7\\ \\text{N}$.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Biểu thức liên hệ giữa tốc độ dài, tốc độ góc và bán kính là","options": ["A. $v = \\omega r$.","B. $v = \\frac{\\omega}{r}$.","C. $v = \\omega r^2$.","D. $v = \\frac{r}{\\omega}$."],"answer": "A","explain": "Công thức.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật chuyển động tròn đều với tốc độ góc $4\\ \\text{rad/s}$. Sau $5\\ \\text{s}$, góc quét được bằng","options": ["A. $20\\ \\text{rad}$.","B. $0,8\\ \\text{rad}$.","C. $9\\ \\text{rad}$.","D. $1,25\\ \\text{rad}$."],"answer": "A","explain": "$\\Delta\\theta = 4 \\cdot 5 = 20\\ \\text{rad}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Lực hướng tâm có đặc điểm","options": ["A. luôn hướng vào tâm quỹ đạo.","B. luôn tiếp tuyến với quỹ đạo.","C. có độ lớn tỉ lệ nghịch với khối lượng.","D. sinh công dương."],"answer": "A","explain": "Định nghĩa.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi vật chuyển động tròn đều với tốc độ dài không đổi, động năng của vật","options": ["A. không đổi.","B. tăng đều.","C. giảm đều.","D. bằng 0."],"answer": "A","explain": "$W_đ = mv^2/2$ không đổi.","points": 0.25},{"type": "mcq","level": "TH","q": "Một chiếc đu quay quay một vòng hết $15\\ \\text{s}$. Tần số quay của đu quay bằng","options": ["A. $\\frac{1}{15}\\ \\text{Hz} \\approx 0,067\\ \\text{Hz}$.","B. $15\\ \\text{Hz}$.","C. $0,15\\ \\text{Hz}$.","D. $1,5\\ \\text{Hz}$."],"answer": "A","explain": "$f = 1/15\\ \\text{Hz}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật $1,1\\ \\text{kg}$ chuyển động tròn đều với tốc độ $11\\ \\text{m/s}$ trên đường tròn bán kính $1,1\\ \\text{m}$. Lực hướng tâm tác dụng lên vật bằng","options": ["A. $121\\ \\text{N}$.","B. $11\\ \\text{N}$.","C. $12,1\\ \\text{N}$.","D. $1331\\ \\text{N}$."],"answer": "A","explain": "$F = 1,1 \\cdot 121/1,1 = 121\\ \\text{N}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tốc độ dài cho biết mức độ nhanh, chậm của chuyển động.","b) Tốc độ góc cho biết mức độ quay nhanh, chậm.","c) Hai vật có cùng tốc độ dài thì có cùng tốc độ góc.","d) $\\omega = \\frac{\\Delta\\theta}{\\Delta t}$."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: còn phụ thuộc bán kính. d) Đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Một máy phát điện có rôto quay với tốc độ $1500\\ \\text{vòng/phút}$; một điểm trên rôto cách trục $0,12\\ \\text{m}$. Xét tính đúng, sai của các khẳng định sau (lấy $\\pi \\approx 3,14$):","statements": ["a) Tần số quay của rôto bằng $25\\ \\text{Hz}$.","b) Tốc độ góc của rôto bằng $50\\pi\\ \\text{rad/s}$.","c) Tốc độ dài của điểm đó xấp xỉ $18,84\\ \\text{m/s}$.","d) Gia tốc hướng tâm của điểm đó xấp xỉ $2958\\ \\text{m/s}^2$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $1500/60 = 25\\ \\text{Hz}$. b) Đúng: $\\omega = 50\\pi\\ \\text{rad/s}$. c) Đúng: $v = 50\\pi \\cdot 0,12 \\approx 18,84\\ \\text{m/s}$. d) Đúng: $a = (50\\pi)^2 \\cdot 0,12 = 300\\pi^2 \\approx 2958\\ \\text{m/s}^2$.","points": 1},{"type": "short","level": "VDC","q": "Một chất điểm chuyển động tròn đều với chu kì $0,6\\ \\text{s}$ trên đường tròn bán kính $0,9\\ \\text{m}$. Gia tốc hướng tâm của chất điểm bằng bao nhiêu $\\text{m/s}^2$? (chỉ điền số, lấy $\\pi^2 \\approx 9,87$)","answer": "98.7","explain": "$a = (2\\pi/0,6)^2 \\cdot 0,9 = 10\\pi^2 \\approx 98,7\\ \\text{m/s}^2$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật chuyển động tròn đều; khi bán kính quỹ đạo tăng gấp đôi và tốc độ góc giữ nguyên thì lực hướng tâm tăng thêm $60\\ \\text{N}$. Lực hướng tâm ban đầu bằng bao nhiêu N? (chỉ điền số)","answer": "60","explain": "$F' = 2F$ (vì $F = m\\omega^2 r$), $2F - F = 60$, $F = 60\\ \\text{N}$.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Chuyển động nào sau đây là chuyển động tròn đều?","options": ["A. Đầu kim giây của đồng hồ đang chạy.","B. Viên bi lăn trên mặt phẳng nghiêng.","C. Vật rơi tự do.","D. Ô tô phanh gấp."],"answer": "A","explain": "Đầu kim giây chuyển động tròn đều.","points": 0.25},{"type": "mcq","level": "NB","q": "Gia tốc của chuyển động tròn đều","options": ["A. hướng vào tâm, độ lớn không đổi.","B. tiếp tuyến với quỹ đạo.","C. bằng 0.","D. hướng ra xa tâm."],"answer": "A","explain": "Gia tốc hướng tâm.","points": 0.25},{"type": "mcq","level": "TH","q": "Công thức tính lực hướng tâm theo tần số $f$ là","options": ["A. $F_{ht} = 4\\pi^2 mrf^2$.","B. $F_{ht} = 2\\pi mrf$.","C. $F_{ht} = \\frac{4\\pi^2 rf}{m}$.","D. $F_{ht} = 4\\pi mrf^2$."],"answer": "A","explain": "$F = m\\omega^2 r = m(2\\pi f)^2 r$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật chuyển động tròn đều, nếu chu kì tăng gấp đôi (bán kính không đổi) thì tốc độ dài","options": ["A. giảm một nửa.","B. tăng gấp đôi.","C. không đổi.","D. tăng gấp bốn."],"answer": "A","explain": "$v = 2\\pi r/T$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một con quay quay với tốc độ $240\\ \\text{vòng/phút}$. Chu kì quay của con quay bằng","options": ["A. $0,25\\ \\text{s}$.","B. $240\\ \\text{s}$.","C. $4\\ \\text{s}$.","D. $0,004\\ \\text{s}$."],"answer": "A","explain": "$f = 4\\ \\text{vòng/s}$, $T = 0,25\\ \\text{s}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật $0,45\\ \\text{kg}$ chuyển động tròn đều với tần số $5\\ \\text{Hz}$ trên đường tròn bán kính $0,2\\ \\text{m}$. Lực hướng tâm tác dụng lên vật xấp xỉ (lấy $\\pi^2 \\approx 9,87$)","options": ["A. $88,8\\ \\text{N}$.","B. $22,2\\ \\text{N}$.","C. $355,3\\ \\text{N}$.","D. $4,5\\ \\text{N}$."],"answer": "A","explain": "$F = 0,45 \\cdot (10\\pi)^2 \\cdot 0,2 = 9\\pi^2 \\approx 88,8\\ \\text{N}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Trong chuyển động tròn đều, quãng đường đi được tỉ lệ thuận với thời gian.","b) Góc quét được tỉ lệ thuận với thời gian.","c) Khi bán kính tăng gấp đôi (cùng tốc độ góc) thì tốc độ dài tăng gấp đôi.","d) Khi tốc độ dài tăng gấp đôi (cùng bán kính) thì chu kì tăng gấp đôi."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $s = vt$. b) Đúng: $\\Delta\\theta = \\omega t$. c) Đúng: $v = \\omega r$. d) Sai: $T = 2\\pi r/v$ GIẢM một nửa.","points": 1},{"type": "truefalse","level": "VDC","q": "Một hành tinh quay quanh ngôi sao của nó theo quỹ đạo tròn bán kính $2 \\cdot 10^{11}\\ \\text{m}$ với chu kì $400$ ngày. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tốc độ góc của hành tinh xấp xỉ $1,82 \\cdot 10^{-7}\\ \\text{rad/s}$.","b) Tốc độ dài của hành tinh xấp xỉ $36,4\\ \\text{km/s}$.","c) Lực hấp dẫn của ngôi sao đóng vai trò lực hướng tâm.","d) Gia tốc hướng tâm của hành tinh hướng ra xa ngôi sao."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $\\omega = 2\\pi/(400 \\cdot 86400) \\approx 1,818 \\cdot 10^{-7}\\ \\text{rad/s}$. b) Đúng: $v = \\omega r \\approx 36360\\ \\text{m/s}$. c) Đúng. d) Sai: hướng VÀO ngôi sao.","points": 1},{"type": "short","level": "VDC","q": "Một vật $3\\ \\text{kg}$ chuyển động tròn đều với tốc độ góc $7\\ \\text{rad/s}$ trên đường tròn bán kính $0,6\\ \\text{m}$. Lực hướng tâm tác dụng lên vật bằng bao nhiêu N? (chỉ điền số)","answer": "88.2","explain": "$F = 3 \\cdot 49 \\cdot 0,6 = 88,2\\ \\text{N}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vệ tinh $800\\ \\text{kg}$ chuyển động tròn đều quanh Trái Đất với tốc độ $7,2\\ \\text{km/s}$; lực hấp dẫn tác dụng lên vệ tinh bằng $6400\\ \\text{N}$. Bán kính quỹ đạo của vệ tinh bằng bao nhiêu km? (chỉ điền số)","answer": "6480","explain": "$r = mv^2/F = 800 \\cdot 7200^2/6400 = 6480000\\ \\text{m} = 6480\\ \\text{km}$.","points": 0.5}]}]}
