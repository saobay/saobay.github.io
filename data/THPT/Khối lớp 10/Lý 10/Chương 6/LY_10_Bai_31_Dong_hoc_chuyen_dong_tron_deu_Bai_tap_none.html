{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Chuyển động tròn đều là chuyển động","options": ["A. có quỹ đạo là đường tròn và tốc độ dài không đổi.","B. có quỹ đạo là đường tròn và tốc độ dài thay đổi.","C. có quỹ đạo là đường thẳng và tốc độ không đổi.","D. có gia tốc bằng 0."],"answer": "A","explain": "Định nghĩa chuyển động tròn đều.","points": 0.25},{"type": "mcq","level": "NB","q": "Tốc độ góc của chuyển động tròn đều được tính bằng","options": ["A. $\\omega = \\frac{\\Delta\\theta}{\\Delta t}$.","B. $\\omega = \\frac{\\Delta t}{\\Delta\\theta}$.","C. $\\omega = \\Delta\\theta \\cdot \\Delta t$.","D. $\\omega = \\frac{v}{r^2}$."],"answer": "A","explain": "Định nghĩa tốc độ góc.","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị của tốc độ góc là","options": ["A. $\\text{rad/s}$.","B. $\\text{m/s}$.","C. $\\text{vòng/s}$.","D. $\\text{s}$."],"answer": "A","explain": "Góc tính bằng radian, đơn vị rad/s.","points": 0.25},{"type": "mcq","level": "NB","q": "Chu kì của chuyển động tròn đều là","options": ["A. thời gian vật đi được một vòng.","B. số vòng vật đi được trong 1 giây.","C. góc quét được trong 1 giây.","D. quãng đường vật đi được trong 1 giây."],"answer": "A","explain": "Định nghĩa chu kì T.","points": 0.25},{"type": "mcq","level": "TH","q": "Một chất điểm chuyển động tròn đều với chu kì $2\\ \\text{s}$. Tần số của chuyển động bằng","options": ["A. $0,5\\ \\text{Hz}$.","B. $2\\ \\text{Hz}$.","C. $4\\ \\text{Hz}$.","D. $1\\ \\text{Hz}$."],"answer": "A","explain": "$f = 1/T = 0,5\\ \\text{Hz}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một bánh xe quay đều với tốc độ góc $10\\ \\text{rad/s}$. Một điểm ở vành bánh xe cách trục quay $0,3\\ \\text{m}$ có tốc độ dài bằng","options": ["A. $3\\ \\text{m/s}$.","B. $33,3\\ \\text{m/s}$.","C. $0,03\\ \\text{m/s}$.","D. $10\\ \\text{m/s}$."],"answer": "A","explain": "$v = \\omega r = 10 \\cdot 0,3 = 3\\ \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Trong chuyển động tròn đều, tốc độ dài của vật không đổi.","b) Trong chuyển động tròn đều, hướng của vận tốc không đổi.","c) Chu kì và tần số liên hệ với nhau qua công thức $T = \\frac{1}{f}$.","d) Tốc độ góc càng lớn thì vật quay càng nhanh."],"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: vận tốc luôn tiếp tuyến với quỹ đạo nên hướng thay đổi. c) Đúng. d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Một đĩa tròn quay đều, một điểm A ở vành đĩa cách trục $20\\ \\text{cm}$, một điểm B cách trục $10\\ \\text{cm}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tốc độ góc của hai điểm bằng nhau.","b) Tốc độ dài của điểm A gấp đôi điểm B.","c) Chu kì quay của hai điểm bằng nhau.","d) Tần số quay của điểm A lớn hơn điểm B."],"answer": ["T","T","T","F"],"explain": "a) Đúng: cùng đĩa cứng. b) Đúng: $v = \\omega r$. c) Đúng. d) Sai: tần số bằng nhau.","points": 1},{"type": "short","level": "VD","q": "Một vệ tinh chuyển động tròn đều quanh Trái Đất với chu kì $24\\ \\text{giờ}$. Tốc độ góc của vệ tinh bằng bao nhiêu $\\text{rad/s}$? (chỉ điền số, dạng $a \\times 10^b$ không dùng được nên điền số thập phân, ví dụ 0.0000727)","answer": "0.0000727","explain": "$\\omega = 2\\pi/T = 2\\pi/86400 \\approx 7,27 \\cdot 10^{-5}\\ \\text{rad/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một chất điểm chuyển động tròn đều trên đường tròn bán kính $0,5\\ \\text{m}$ với tốc độ dài $4\\ \\text{m/s}$. Trong $0,25\\ \\text{s}$, bán kính nối tâm với chất điểm quét được góc bằng bao nhiêu rad? (chỉ điền số, lấy $\\pi \\approx 3,14$)","answer": "2","explain": "$\\omega = v/r = 8\\ \\text{rad/s}$. $\\Delta\\theta = 8 \\cdot 0,25 = 2\\ \\text{rad}$.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "NB","q": "Tần số của chuyển động tròn đều là","options": ["A. số vòng vật đi được trong 1 giây.","B. thời gian vật đi được một vòng.","C. góc vật quét được trong 1 giây.","D. quãng đường vật đi được trong 1 giây."],"answer": "A","explain": "Định nghĩa tần số f, đơn vị Hz.","points": 0.25},{"type": "mcq","level": "NB","q": "Công thức liên hệ giữa tốc độ dài và tốc độ góc là","options": ["A. $v = \\omega r$.","B. $v = \\frac{\\omega}{r}$.","C. $v = \\omega r^2$.","D. $v = \\frac{r}{\\omega}$."],"answer": "A","explain": "$v = \\omega r$.","points": 0.25},{"type": "mcq","level": "NB","q": "Một radian là góc ở tâm chắn cung có độ dài","options": ["A. bằng bán kính của đường tròn.","B. gấp đôi bán kính.","C. bằng đường kính.","D. bằng nửa bán kính."],"answer": "A","explain": "Định nghĩa radian.","points": 0.25},{"type": "mcq","level": "NB","q": "Kim giây của đồng hồ chuyển động","options": ["A. tròn đều với chu kì $60\\ \\text{s}$.","B. tròn đều với chu kì $60$ phút.","C. thẳng đều.","D. tròn nhanh dần đều."],"answer": "A","explain": "Kim giây quay một vòng hết 60 s.","points": 0.25},{"type": "mcq","level": "TH","q": "Một chất điểm chuyển động tròn đều với tần số $5\\ \\text{Hz}$. Chu kì của chuyển động bằng","options": ["A. $0,2\\ \\text{s}$.","B. $5\\ \\text{s}$.","C. $2\\ \\text{s}$.","D. $0,5\\ \\text{s}$."],"answer": "A","explain": "$T = 1/f = 0,2\\ \\text{s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một điểm trên vành đĩa quay đều cách trục $0,25\\ \\text{m}$, có tốc độ dài $5\\ \\text{m/s}$. Tốc độ góc của đĩa bằng","options": ["A. $20\\ \\text{rad/s}$.","B. $1,25\\ \\text{rad/s}$.","C. $0,05\\ \\text{rad/s}$.","D. $125\\ \\text{rad/s}$."],"answer": "A","explain": "$\\omega = v/r = 5/0,25 = 20\\ \\text{rad/s}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tốc độ góc cho biết góc quét được trong một đơn vị thời gian.","b) Đơn vị của tần số là Hz.","c) $1$ vòng tương ứng với góc $2\\pi\\ \\text{rad}$.","d) Điểm càng xa trục quay thì tốc độ góc càng lớn."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tốc độ góc như nhau, chỉ tốc độ dài khác.","points": 1},{"type": "truefalse","level": "VD","q": "Hai chất điểm chuyển động tròn đều trên hai đường tròn đồng tâm với bán kính $r_1 = 30\\ \\text{cm}$, $r_2 = 15\\ \\text{cm}$ và cùng tốc độ góc $\\omega$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tỉ số tốc độ dài $v_1/v_2 = 2$.","b) Chu kì của hai chất điểm bằng nhau.","c) Trong cùng một khoảng thời gian, hai bán kính quét được góc bằng nhau.","d) Chất điểm 2 có tần số gấp đôi chất điểm 1."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $v_1/v_2 = r_1/r_2 = 2$. b) Đúng: cùng $\\omega$. c) Đúng. d) Sai: tần số bằng nhau.","points": 1},{"type": "short","level": "VD","q": "Một bánh xe có đường kính $0,6\\ \\text{m}$ quay đều với tần số $10\\ \\text{Hz}$. Tốc độ dài của một điểm ở vành bánh xe bằng bao nhiêu m/s? (chỉ điền số, lấy $\\pi \\approx 3,14$)","answer": "18.84","explain": "$r = 0,3\\ \\text{m}$. $v = 2\\pi f r = 2 \\cdot 3,14 \\cdot 10 \\cdot 0,3 = 18,84\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một chất điểm chuyển động tròn đều với tốc độ góc $4\\ \\text{rad/s}$ trên đường tròn bán kính $0,25\\ \\text{m}$. Quãng đường chất điểm đi được trong $5\\ \\text{s}$ bằng bao nhiêu m? (chỉ điền số)","answer": "5","explain": "$v = \\omega r = 1\\ \\text{m/s}$. $s = v \\cdot 5 = 5\\ \\text{m}$.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Độ dịch chuyển góc của chuyển động tròn được đo bằng đơn vị","options": ["A. radian (rad).","B. mét (m).","C. giây (s).","D. héc (Hz)."],"answer": "A","explain": "Góc đo bằng radian.","points": 0.25},{"type": "mcq","level": "NB","q": "Biểu thức liên hệ giữa tốc độ góc, chu kì và tần số là","options": ["A. $\\omega = \\frac{2\\pi}{T} = 2\\pi f$.","B. $\\omega = \\frac{T}{2\\pi}$.","C. $\\omega = 2\\pi T f$.","D. $\\omega = \\frac{f}{2\\pi}$."],"answer": "A","explain": "$\\omega = 2\\pi/T = 2\\pi f$.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong chuyển động tròn đều, vectơ vận tốc","options": ["A. luôn tiếp tuyến với quỹ đạo.","B. luôn hướng vào tâm quỹ đạo.","C. luôn hướng ra xa tâm.","D. có hướng không đổi."],"answer": "A","explain": "Vận tốc tiếp tuyến với đường tròn tại mỗi điểm.","points": 0.25},{"type": "mcq","level": "NB","q": "Kim phút của đồng hồ có chu kì bằng","options": ["A. $3600\\ \\text{s}$.","B. $60\\ \\text{s}$.","C. $12$ giờ.","D. $60$ phút tính theo kim giây."],"answer": "A","explain": "Kim phút quay một vòng hết 1 giờ = 3600 s.","points": 0.25},{"type": "mcq","level": "TH","q": "Một đĩa quay đều với tốc độ $120\\ \\text{vòng/phút}$. Tốc độ góc của đĩa bằng","options": ["A. $4\\pi\\ \\text{rad/s} \\approx 12,56\\ \\text{rad/s}$.","B. $120\\ \\text{rad/s}$.","C. $2\\ \\text{rad/s}$.","D. $240\\pi\\ \\text{rad/s}$."],"answer": "A","explain": "$f = 2\\ \\text{vòng/s}$, $\\omega = 2\\pi f = 4\\pi\\ \\text{rad/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một chất điểm chuyển động tròn đều trên đường tròn bán kính $0,4\\ \\text{m}$ với tốc độ góc $5\\ \\text{rad/s}$. Tốc độ dài của chất điểm bằng","options": ["A. $2\\ \\text{m/s}$.","B. $12,5\\ \\text{m/s}$.","C. $0,08\\ \\text{m/s}$.","D. $5\\ \\text{m/s}$."],"answer": "A","explain": "$v = 5 \\cdot 0,4 = 2\\ \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Chuyển động tròn đều có tốc độ dài không đổi.","b) Tốc độ góc của mọi điểm trên vật rắn quay đều là như nhau.","c) Điểm ở càng xa trục quay thì tốc độ dài càng lớn (cùng vật quay đều).","d) Chu kì càng lớn thì vật quay càng nhanh."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng: $v = \\omega r$. d) Sai: chu kì lớn nghĩa là quay CHẬM.","points": 1},{"type": "truefalse","level": "VD","q": "Một chiếc xe đạp có bánh xe đường kính $0,68\\ \\text{m}$ đang chạy với tốc độ $36\\ \\text{km/h}$ (bánh lăn không trượt). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tốc độ dài của điểm ở vành bánh xe so với trục bằng $10\\ \\text{m/s}$.","b) Tốc độ góc của bánh xe xấp xỉ $29,4\\ \\text{rad/s}$.","c) Tần số quay của bánh xe xấp xỉ $4,68\\ \\text{Hz}$.","d) Điểm ở trục bánh xe có tốc độ dài bằng 0 so với mặt đất."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $36\\ \\text{km/h} = 10\\ \\text{m/s}$. b) Đúng: $\\omega = 10/0,34 \\approx 29,4\\ \\text{rad/s}$. c) Đúng: $f = \\omega/2\\pi \\approx 4,68\\ \\text{Hz}$. d) Sai: điểm ở trục chuyển động cùng xe với tốc độ $10\\ \\text{m/s}$ so với mặt đất.","points": 1},{"type": "short","level": "VD","q": "Một quạt điện quay với tốc độ $900\\ \\text{vòng/phút}$. Tốc độ góc của cánh quạt bằng bao nhiêu rad/s? (chỉ điền số, lấy $\\pi \\approx 3,14$)","answer": "94.2","explain": "$f = 15\\ \\text{vòng/s}$. $\\omega = 2\\pi \\cdot 15 = 30\\pi \\approx 94,2\\ \\text{rad/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Hai điểm A, B nằm trên cùng một bán kính của đĩa quay đều, với $r_A = 2r_B$. Tỉ số tốc độ dài $v_A/v_B$ bằng bao nhiêu? (chỉ điền số)","answer": "2","explain": "Cùng tốc độ góc nên $v_A/v_B = r_A/r_B = 2$.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "NB","q": "Góc $\\pi\\ \\text{rad}$ tương ứng với","options": ["A. $180^\\circ$.","B. $90^\\circ$.","C. $360^\\circ$.","D. $60^\\circ$."],"answer": "A","explain": "$\\pi\\ \\text{rad} = 180^\\circ$.","points": 0.25},{"type": "mcq","level": "NB","q": "Tốc độ dài trong chuyển động tròn đều","options": ["A. không đổi theo thời gian.","B. tăng đều theo thời gian.","C. giảm đều theo thời gian.","D. tỉ lệ thuận với thời gian."],"answer": "A","explain": "Định nghĩa chuyển động tròn đều.","points": 0.25},{"type": "mcq","level": "NB","q": "Đại lượng nào sau đây KHÔNG đổi trong chuyển động tròn đều?","options": ["A. Tốc độ góc.","B. Hướng của vận tốc.","C. Vectơ vận tốc.","D. Hướng của gia tốc."],"answer": "A","explain": "Tốc độ góc không đổi; hướng vận tốc và gia tốc đều thay đổi.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật chuyển động tròn đều một vòng hết $0,5\\ \\text{s}$. Tần số của vật bằng","options": ["A. $2\\ \\text{Hz}$.","B. $0,5\\ \\text{Hz}$.","C. $1\\ \\text{Hz}$.","D. $4\\ \\text{Hz}$."],"answer": "A","explain": "$f = 1/0,5 = 2\\ \\text{Hz}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một chất điểm chuyển động tròn đều với tốc độ góc $2\\pi\\ \\text{rad/s}$. Chu kì của chuyển động bằng","options": ["A. $1\\ \\text{s}$.","B. $2\\ \\text{s}$.","C. $2\\pi\\ \\text{s}$.","D. $0,5\\ \\text{s}$."],"answer": "A","explain": "$T = 2\\pi/\\omega = 1\\ \\text{s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Trái Đất quay quanh trục của nó một vòng hết $24$ giờ. Một điểm ở xích đạo cách trục quay $6400\\ \\text{km}$ có tốc độ dài xấp xỉ","options": ["A. $465\\ \\text{m/s}$.","B. $1670\\ \\text{km/h}$.","C. $24\\ \\text{m/s}$.","D. $6400\\ \\text{m/s}$."],"answer": "A","explain": "$v = 2\\pi \\cdot 6400000/86400 \\approx 465\\ \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Radian là đơn vị đo góc trong hệ SI.","b) $360^\\circ$ tương ứng với $2\\pi\\ \\text{rad}$.","c) Tốc độ dài $v = \\omega r$ với $r$ là bán kính quỹ đạo.","d) Khi bán kính quỹ đạo tăng gấp đôi (cùng tốc độ góc) thì tốc độ dài giảm một nửa."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $v$ TĂNG gấp đôi.","points": 1},{"type": "truefalse","level": "VD","q": "Một vệ tinh địa tĩnh chuyển động tròn đều quanh Trái Đất với chu kì bằng chu kì tự quay của Trái Đất ($24$ giờ). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tốc độ góc của vệ tinh bằng tốc độ góc tự quay của Trái Đất.","b) Vệ tinh luôn đứng yên so với một điểm trên mặt đất.","c) Bán kính quỹ đạo của vệ tinh bằng bán kính Trái Đất.","d) Tần số chuyển động của vệ tinh là $1/86400\\ \\text{Hz}$."],"answer": ["T","T","F","T"],"explain": "a) Đúng: cùng chu kì. b) Đúng: đặc điểm vệ tinh địa tĩnh. c) Sai: quỹ đạo ở độ cao khoảng $36000\\ \\text{km}$. d) Đúng: $f = 1/T$.","points": 1},{"type": "short","level": "VDC","q": "Một điểm trên vành đĩa quay đều có tốc độ dài $6\\ \\text{m/s}$; đĩa quay được $30$ vòng trong $1$ phút. Bán kính của đĩa bằng bao nhiêu m? (chỉ điền số, lấy $\\pi \\approx 3,14$)","answer": "1.91","explain": "$f = 0,5\\ \\text{Hz}$, $\\omega = \\pi\\ \\text{rad/s}$. $r = v/\\omega = 6/\\pi \\approx 1,91\\ \\text{m}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một chất điểm chuyển động tròn đều, trong $10\\ \\text{s}$ đi được $5$ vòng trên đường tròn bán kính $0,2\\ \\text{m}$. Tốc độ dài của chất điểm bằng bao nhiêu m/s? (chỉ điền số, lấy $\\pi \\approx 3,14$)","answer": "0.628","explain": "$f = 0,5\\ \\text{Hz}$. $v = 2\\pi f r = 2 \\cdot 3,14 \\cdot 0,5 \\cdot 0,2 = 0,628\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Chuyển động của đầu kim đồng hồ là chuyển động","options": ["A. tròn đều.","B. thẳng đều.","C. tròn nhanh dần.","D. rơi tự do."],"answer": "A","explain": "Đầu kim đồng hồ chuyển động tròn đều.","points": 0.25},{"type": "mcq","level": "NB","q": "Tốc độ góc kí hiệu là","options": ["A. $\\omega$.","B. $v$.","C. $f$.","D. $T$."],"answer": "A","explain": "Tốc độ góc kí hiệu $\\omega$.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật chuyển động tròn đều với bán kính $r$, tốc độ góc $\\omega$. Quãng đường vật đi được trong thời gian $t$ là","options": ["A. $s = \\omega r t$.","B. $s = \\frac{\\omega t}{r}$.","C. $s = \\omega r^2 t$.","D. $s = \\frac{r t}{\\omega}$."],"answer": "A","explain": "$s = vt = \\omega r t$.","points": 0.25},{"type": "mcq","level": "TH","q": "Góc $90^\\circ$ tương ứng với","options": ["A. $\\frac{\\pi}{2}\\ \\text{rad}$.","B. $\\pi\\ \\text{rad}$.","C. $2\\pi\\ \\text{rad}$.","D. $\\frac{\\pi}{4}\\ \\text{rad}$."],"answer": "A","explain": "$90^\\circ = \\pi/2\\ \\text{rad}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một bánh đà quay đều với tần số $20\\ \\text{Hz}$. Tốc độ góc của bánh đà bằng","options": ["A. $40\\pi\\ \\text{rad/s} \\approx 125,6\\ \\text{rad/s}$.","B. $20\\ \\text{rad/s}$.","C. $10\\pi\\ \\text{rad/s}$.","D. $400\\ \\text{rad/s}$."],"answer": "A","explain": "$\\omega = 2\\pi f = 40\\pi\\ \\text{rad/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vệ tinh nhân tạo chuyển động tròn đều quanh Trái Đất với tốc độ dài $7,9\\ \\text{km/s}$ trên quỹ đạo bán kính $6600\\ \\text{km}$. Chu kì của vệ tinh xấp xỉ","options": ["A. $5250\\ \\text{s}$.","B. $835\\ \\text{s}$.","C. $24$ giờ.","D. $90$ phút tính theo công thức khác."],"answer": "A","explain": "$T = 2\\pi r/v = 2\\pi \\cdot 6600000/7900 \\approx 5250\\ \\text{s}$ (khoảng 87,5 phút).","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Mọi điểm trên kim đồng hồ có cùng tốc độ góc.","b) Đầu kim giây có tốc độ dài lớn hơn đầu kim phút.","c) Chu kì của kim giờ là $12$ giờ.","d) Tần số của kim giây là $1\\ \\text{Hz}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: cùng trục quay. b) Đúng: kim giây dài hơn và quay nhanh hơn. c) Đúng. d) Sai: $f = 1/60\\ \\text{Hz}$.","points": 1},{"type": "truefalse","level": "VD","q": "Một ô tô đang chạy với tốc độ $72\\ \\text{km/h}$, bánh xe có đường kính $0,7\\ \\text{m}$ lăn không trượt. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tốc độ dài của điểm ở vành bánh xe so với trục xe bằng $20\\ \\text{m/s}$.","b) Tốc độ góc của bánh xe xấp xỉ $57,1\\ \\text{rad/s}$.","c) Tần số quay của bánh xe xấp xỉ $9,1\\ \\text{Hz}$.","d) Trong $1\\ \\text{s}$, bánh xe quay được khoảng $57$ vòng."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $72\\ \\text{km/h} = 20\\ \\text{m/s}$. b) Đúng: $\\omega = 20/0,35 \\approx 57,1\\ \\text{rad/s}$. c) Đúng: $f \\approx 9,09\\ \\text{Hz}$. d) Sai: khoảng $9,1$ vòng.","points": 1},{"type": "short","level": "VDC","q": "Một chất điểm chuyển động tròn đều với chu kì $0,4\\ \\text{s}$ trên đường tròn bán kính $0,5\\ \\text{m}$. Tốc độ dài của chất điểm bằng bao nhiêu m/s? (chỉ điền số, lấy $\\pi \\approx 3,14$)","answer": "7.85","explain": "$v = 2\\pi r/T = 2 \\cdot 3,14 \\cdot 0,5/0,4 = 7,85\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một đĩa quay đều với tốc độ góc $6\\ \\text{rad/s}$. Một điểm trên đĩa cách trục $0,15\\ \\text{m}$. Trong $10\\ \\text{s}$, điểm đó đi được quãng đường bằng bao nhiêu m? (chỉ điền số)","answer": "9","explain": "$v = 6 \\cdot 0,15 = 0,9\\ \\text{m/s}$. $s = 0,9 \\cdot 10 = 9\\ \\text{m}$.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Trong chuyển động tròn đều, đại lượng nào sau đây thay đổi theo thời gian?","options": ["A. Hướng của vectơ vận tốc.","B. Tốc độ dài.","C. Tốc độ góc.","D. Chu kì."],"answer": "A","explain": "Hướng vận tốc (tiếp tuyến) luôn thay đổi.","points": 0.25},{"type": "mcq","level": "NB","q": "Công thức tính chu kì theo tốc độ góc là","options": ["A. $T = \\frac{2\\pi}{\\omega}$.","B. $T = \\frac{\\omega}{2\\pi}$.","C. $T = 2\\pi\\omega$.","D. $T = \\frac{\\pi}{\\omega^2}$."],"answer": "A","explain": "$\\omega = 2\\pi/T$.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật quay được $10$ vòng trong $5\\ \\text{s}$ đều đặn. Tần số quay của vật bằng","options": ["A. $2\\ \\text{Hz}$.","B. $0,5\\ \\text{Hz}$.","C. $50\\ \\text{Hz}$.","D. $10\\ \\text{Hz}$."],"answer": "A","explain": "$f = 10/5 = 2\\ \\text{Hz}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Độ dài cung tròn chắn góc $\\theta$ (rad) trên đường tròn bán kính $r$ bằng","options": ["A. $r\\theta$.","B. $\\frac{r}{\\theta}$.","C. $r\\theta^2$.","D. $\\frac{\\theta}{r}$."],"answer": "A","explain": "$s = r\\theta$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một chất điểm chuyển động tròn đều, cứ $2\\ \\text{s}$ đi được một vòng. Tốc độ góc của chất điểm bằng","options": ["A. $\\pi\\ \\text{rad/s}$.","B. $2\\pi\\ \\text{rad/s}$.","C. $4\\pi\\ \\text{rad/s}$.","D. $0,5\\pi\\ \\text{rad/s}$."],"answer": "A","explain": "$\\omega = 2\\pi/2 = \\pi\\ \\text{rad/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một điểm ở vành ngoài của đĩa hát quay đều với tốc độ dài $1,5\\ \\text{m/s}$, bán kính đĩa $0,15\\ \\text{m}$. Tần số quay của đĩa bằng","options": ["A. $\\frac{5}{\\pi}\\ \\text{Hz} \\approx 1,59\\ \\text{Hz}$.","B. $10\\ \\text{Hz}$.","C. $0,225\\ \\text{Hz}$.","D. $22,5\\ \\text{Hz}$."],"answer": "A","explain": "$\\omega = 1,5/0,15 = 10\\ \\text{rad/s}$, $f = 10/2\\pi = 5/\\pi \\approx 1,59\\ \\text{Hz}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Chuyển động tròn đều là chuyển động có gia tốc bằng 0.","b) Tốc độ dài cho biết quãng đường đi được trong một đơn vị thời gian.","c) $v = \\omega r$ đúng với mọi điểm trên vật rắn quay đều.","d) Hai vật có cùng tốc độ góc thì có cùng tốc độ dài."],"answer": ["F","T","T","F"],"explain": "a) Sai: có gia tốc hướng tâm. b) Đúng. c) Đúng. d) Sai: còn phụ thuộc bán kính.","points": 1},{"type": "truefalse","level": "VD","q": "Một ròng rọc có đường kính $0,4\\ \\text{m}$ quay đều, dây quấn trên ròng rọc chuyển động với tốc độ $8\\ \\text{m/s}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tốc độ dài của điểm ở vành ròng rọc bằng $8\\ \\text{m/s}$.","b) Tốc độ góc của ròng rọc bằng $40\\ \\text{rad/s}$.","c) Chu kì quay của ròng rọc bằng $0,157\\ \\text{s}$ (lấy $\\pi \\approx 3,14$).","d) Tần số quay của ròng rọc bằng $40\\ \\text{Hz}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: dây không trượt. b) Đúng: $\\omega = 8/0,2 = 40\\ \\text{rad/s}$. c) Đúng: $T = 2\\pi/40 \\approx 0,157\\ \\text{s}$. d) Sai: $f = 1/T \\approx 6,37\\ \\text{Hz}$.","points": 1},{"type": "short","level": "VDC","q": "Một cánh quạt dài $0,6\\ \\text{m}$ quay đều với tốc độ $600\\ \\text{vòng/phút}$. Tốc độ dài của đầu cánh quạt bằng bao nhiêu m/s? (chỉ điền số, lấy $\\pi \\approx 3,14$)","answer": "37.68","explain": "$f = 10\\ \\text{vòng/s}$. $v = 2\\pi f r = 2 \\cdot 3,14 \\cdot 10 \\cdot 0,6 = 37,68\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một chất điểm chuyển động tròn đều trên đường tròn bán kính $0,3\\ \\text{m}$ với tốc độ dài $6\\ \\text{m/s}$. Nếu tăng tốc độ dài lên gấp đôi mà giữ nguyên bán kính, tốc độ góc lúc sau bằng bao nhiêu rad/s? (chỉ điền số)","answer": "40","explain": "$v' = 12\\ \\text{m/s}$. $\\omega' = v'/r = 12/0,3 = 40\\ \\text{rad/s}$.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Đơn vị của chu kì là","options": ["A. giây (s).","B. héc (Hz).","C. rad/s.","D. vòng/phút."],"answer": "A","explain": "Chu kì là thời gian, đơn vị giây.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật chuyển động tròn đều với tốc độ góc $\\omega$. Góc quét được sau thời gian $t$ là","options": ["A. $\\Delta\\theta = \\omega t$.","B. $\\Delta\\theta = \\frac{\\omega}{t}$.","C. $\\Delta\\theta = \\frac{t}{\\omega}$.","D. $\\Delta\\theta = \\omega t^2$."],"answer": "A","explain": "$\\omega = \\Delta\\theta/\\Delta t$.","points": 0.25},{"type": "mcq","level": "NB","q": "Kim giờ của đồng hồ quay một vòng hết","options": ["A. $12$ giờ.","B. $1$ giờ.","C. $60$ giây.","D. $24$ giờ."],"answer": "A","explain": "Kim giờ quay một vòng hết 12 giờ.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong chuyển động tròn đều, quãng đường vật đi được trong một chu kì bằng","options": ["A. chu vi của đường tròn quỹ đạo.","B. bán kính quỹ đạo.","C. đường kính quỹ đạo.","D. một nửa chu vi."],"answer": "A","explain": "Một chu kì vật đi hết một vòng.","points": 0.25},{"type": "mcq","level": "TH","q": "Một đĩa quay đều $45\\ \\text{vòng/phút}$. Chu kì quay của đĩa bằng","options": ["A. $\\frac{4}{3}\\ \\text{s} \\approx 1,33\\ \\text{s}$.","B. $45\\ \\text{s}$.","C. $0,75\\ \\text{s}$.","D. $2700\\ \\text{s}$."],"answer": "A","explain": "$f = 0,75\\ \\text{vòng/s}$, $T = 1/f = 4/3\\ \\text{s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một chất điểm chuyển động tròn đều trên đường tròn bán kính $0,25\\ \\text{m}$ với chu kì $0,5\\ \\text{s}$. Tốc độ góc của chất điểm bằng","options": ["A. $4\\pi\\ \\text{rad/s}$.","B. $2\\pi\\ \\text{rad/s}$.","C. $0,5\\pi\\ \\text{rad/s}$.","D. $8\\pi\\ \\text{rad/s}$."],"answer": "A","explain": "$\\omega = 2\\pi/0,5 = 4\\pi\\ \\text{rad/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tốc độ dài đặc trưng cho sự nhanh, chậm của chuyển động tròn.","b) Tốc độ góc đặc trưng cho sự quay nhanh, chậm.","c) Vật có tốc độ dài lớn hơn thì tốc độ góc cũng lớn hơn.","d) Chu kì là thời gian để vật đi hết một vòng tròn."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: còn phụ thuộc bán kính ($v = \\omega r$). d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Một chất điểm chuyển động tròn đều trên đường tròn bán kính $0,5\\ \\text{m}$ với tốc độ dài $2\\ \\text{m/s}$. Xét tính đúng, sai của các khẳng định sau (lấy $\\pi \\approx 3,14$):","statements": ["a) Tốc độ góc của chất điểm bằng $4\\ \\text{rad/s}$.","b) Chu kì chuyển động của chất điểm xấp xỉ $1,57\\ \\text{s}$.","c) Tần số chuyển động của chất điểm xấp xỉ $0,64\\ \\text{Hz}$.","d) Trong $2\\ \\text{s}$, chất điểm đi được quãng đường $8\\ \\text{m}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $\\omega = 2/0,5 = 4\\ \\text{rad/s}$. b) Đúng: $T = 2\\pi/4 \\approx 1,57\\ \\text{s}$. c) Đúng: $f = 1/T \\approx 0,64\\ \\text{Hz}$. d) Sai: $s = v \\cdot t = 4\\ \\text{m}$.","points": 1},{"type": "short","level": "VDC","q": "Một bánh xe quay đều với tốc độ góc $8\\ \\text{rad/s}$. Một điểm trên bánh xe cách trục quay $0,2\\ \\text{m}$ có tốc độ dài bằng bao nhiêu m/s? (chỉ điền số)","answer": "1.6","explain": "$v = \\omega r = 8 \\cdot 0,2 = 1,6\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một chất điểm chuyển động tròn đều với tần số $2\\ \\text{Hz}$ trên đường tròn bán kính $0,4\\ \\text{m}$. Trong $2,5\\ \\text{s}$, chất điểm đi được quãng đường bằng bao nhiêu m? (chỉ điền số, lấy $\\pi \\approx 3,14$)","answer": "12.56","explain": "$v = 2\\pi f r = 2 \\cdot 3,14 \\cdot 2 \\cdot 0,4 = 5,024\\ \\text{m/s}$. $s = 5,024 \\cdot 2,5 = 12,56\\ \\text{m}$.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "NB","q": "Chuyển động tròn đều có đặc điểm","options": ["A. tốc độ dài không đổi, tốc độ góc không đổi.","B. tốc độ dài thay đổi, tốc độ góc không đổi.","C. tốc độ dài không đổi, tốc độ góc thay đổi.","D. cả tốc độ dài và tốc độ góc đều thay đổi."],"answer": "A","explain": "Cả hai đều không đổi trong chuyển động tròn đều.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật chuyển động tròn đều với tần số $f$. Tốc độ góc của vật bằng","options": ["A. $2\\pi f$.","B. $\\frac{f}{2\\pi}$.","C. $2\\pi f^2$.","D. $\\frac{2\\pi}{f^2}$."],"answer": "A","explain": "$\\omega = 2\\pi f$.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong $1$ phút, một vật quay đều được $30$ vòng. Chu kì quay của vật bằng","options": ["A. $2\\ \\text{s}$.","B. $30\\ \\text{s}$.","C. $0,5\\ \\text{s}$.","D. $60\\ \\text{s}$."],"answer": "A","explain": "$T = 60/30 = 2\\ \\text{s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Bán kính quỹ đạo càng lớn (cùng tốc độ góc) thì tốc độ dài","options": ["A. càng lớn.","B. càng nhỏ.","C. không đổi.","D. bằng 0."],"answer": "A","explain": "$v = \\omega r$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một mô tơ quay với tốc độ $1400\\ \\text{vòng/phút}$. Tần số quay của mô tơ bằng","options": ["A. $\\frac{70}{3}\\ \\text{Hz} \\approx 23,3\\ \\text{Hz}$.","B. $1400\\ \\text{Hz}$.","C. $84\\ \\text{Hz}$.","D. $23,3\\ \\text{vòng/s}$ tính theo đơn vị khác."],"answer": "A","explain": "$f = 1400/60 = 70/3\\ \\text{Hz}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một điểm trên mâm quay đều cách trục $0,1\\ \\text{m}$ có tốc độ dài $2\\ \\text{m/s}$. Chu kì quay của mâm bằng","options": ["A. $0,1\\pi\\ \\text{s} \\approx 0,314\\ \\text{s}$.","B. $0,2\\ \\text{s}$.","C. $20\\ \\text{s}$.","D. $5\\ \\text{s}$."],"answer": "A","explain": "$\\omega = 20\\ \\text{rad/s}$, $T = 2\\pi/20 = 0,1\\pi\\ \\text{s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tần số là số vòng quay được trong một giây.","b) Chu kì càng nhỏ thì tần số càng lớn.","c) Tốc độ góc đo bằng đơn vị vòng/s.","d) $\\omega = 2\\pi f$ với $f$ tính bằng Hz."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng: $f = 1/T$. c) Sai: đơn vị rad/s. d) Đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Một sợi dây dài $0,8\\ \\text{m}$ buộc vào vật và quay tròn đều trong mặt phẳng ngang với tần số $1,5\\ \\text{Hz}$ (dây không dãn). Xét tính đúng, sai của các khẳng định sau (lấy $\\pi \\approx 3,14$):","statements": ["a) Tốc độ góc của vật bằng $3\\pi\\ \\text{rad/s}$.","b) Tốc độ dài của vật xấp xỉ $7,54\\ \\text{m/s}$.","c) Chu kì quay của vật bằng $0,667\\ \\text{s}$.","d) Trong $10\\ \\text{s}$, vật quay được $10$ vòng."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $\\omega = 2\\pi \\cdot 1,5 = 3\\pi\\ \\text{rad/s}$. b) Đúng: $v = 3\\pi \\cdot 0,8 \\approx 7,54\\ \\text{m/s}$. c) Đúng: $T = 1/1,5 \\approx 0,667\\ \\text{s}$. d) Sai: $15$ vòng.","points": 1},{"type": "short","level": "VDC","q": "Một chất điểm chuyển động tròn đều với tốc độ dài $3\\ \\text{m/s}$ trên đường tròn bán kính $0,6\\ \\text{m}$. Tần số chuyển động của chất điểm bằng bao nhiêu Hz? (chỉ điền số, lấy $\\pi \\approx 3,14$)","answer": "0.8","explain": "$\\omega = 3/0,6 = 5\\ \\text{rad/s}$. $f = 5/(2\\pi) \\approx 0,796\\ \\text{Hz}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vô lăng có đường kính $0,5\\ \\text{m}$ quay đều với tốc độ $120\\ \\text{vòng/phút}$. Tốc độ dài của một điểm ở vành vô lăng bằng bao nhiêu m/s? (chỉ điền số, lấy $\\pi \\approx 3,14$)","answer": "3.14","explain": "$f = 2\\ \\text{vòng/s}$, $r = 0,25\\ \\text{m}$. $v = 2\\pi \\cdot 2 \\cdot 0,25 = \\pi \\approx 3,14\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Quỹ đạo của chuyển động tròn đều là","options": ["A. đường tròn.","B. đường thẳng.","C. đường parabol.","D. đường xoắn ốc."],"answer": "A","explain": "Định nghĩa.","points": 0.25},{"type": "mcq","level": "NB","q": "Tốc độ góc của kim giây đồng hồ bằng","options": ["A. $\\frac{\\pi}{30}\\ \\text{rad/s}$.","B. $\\frac{\\pi}{1800}\\ \\text{rad/s}$.","C. $2\\pi\\ \\text{rad/s}$.","D. $\\frac{\\pi}{60}\\ \\text{rad/s}$."],"answer": "A","explain": "$T = 60\\ \\text{s}$, $\\omega = 2\\pi/60 = \\pi/30\\ \\text{rad/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật chuyển động tròn đều với bán kính $r$ và tốc độ $v$. Tần số của vật bằng","options": ["A. $\\frac{v}{2\\pi r}$.","B. $\\frac{2\\pi r}{v}$.","C. $\\frac{v r}{2\\pi}$.","D. $2\\pi v r$."],"answer": "A","explain": "$f = \\omega/2\\pi = v/(2\\pi r)$.","points": 0.25},{"type": "mcq","level": "TH","q": "Hai điểm A, B trên cùng một đĩa quay đều, A ở xa trục hơn B. So sánh tốc độ góc của hai điểm:","options": ["A. $\\omega_A = \\omega_B$.","B. $\\omega_A \\gt \\omega_B$.","C. $\\omega_A \\lt \\omega_B$.","D. Không so sánh được."],"answer": "A","explain": "Cùng vật rắn quay thì tốc độ góc như nhau.","points": 0.25},{"type": "mcq","level": "TH","q": "Một chất điểm chuyển động tròn đều với tốc độ góc $10\\ \\text{rad/s}$. Trong $3\\ \\text{s}$, bán kính quét được góc bằng","options": ["A. $30\\ \\text{rad}$.","B. $\\frac{10}{3}\\ \\text{rad}$.","C. $3,3\\ \\text{rad}$.","D. $90\\ \\text{rad}$."],"answer": "A","explain": "$\\Delta\\theta = 10 \\cdot 3 = 30\\ \\text{rad}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vệ tinh chuyển động tròn đều với chu kì $90$ phút trên quỹ đạo bán kính $6700\\ \\text{km}$. Tốc độ dài của vệ tinh xấp xỉ","options": ["A. $7,8\\ \\text{km/s}$.","B. $1,24\\ \\text{km/s}$.","C. $74\\ \\text{km/s}$.","D. $0,13\\ \\text{km/s}$."],"answer": "A","explain": "$v = 2\\pi \\cdot 6700000/5400 \\approx 7796\\ \\text{m/s} \\approx 7,8\\ \\text{km/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Trong chuyển động tròn đều, quãng đường đi được tỉ lệ thuận với thời gian.","b) Góc quét được tỉ lệ thuận với thời gian.","c) Bán kính quỹ đạo càng lớn thì chu kì càng lớn (cùng tốc độ dài).","d) Tốc độ góc của các điểm khác nhau trên cùng một vật quay đều là khác nhau."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $s = vt$. b) Đúng: $\\Delta\\theta = \\omega t$. c) Đúng: $T = 2\\pi r/v$. d) Sai: mọi điểm trên vật rắn quay đều có CÙNG tốc độ góc.","points": 1},{"type": "truefalse","level": "VDC","q": "Một chiếc đu quay có bán kính $5\\ \\text{m}$, quay đều một vòng hết $20\\ \\text{s}$. Xét tính đúng, sai của các khẳng định sau (lấy $\\pi \\approx 3,14$):","statements": ["a) Tốc độ góc của đu quay bằng $0,314\\ \\text{rad/s}$.","b) Tốc độ dài của ghế ngồi ở vành đu quay bằng $1,57\\ \\text{m/s}$.","c) Tần số quay của đu quay bằng $0,05\\ \\text{Hz}$.","d) Trong $1$ phút, đu quay được $6$ vòng."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $\\omega = 2\\pi/20 = 0,314\\ \\text{rad/s}$. b) Đúng: $v = 0,314 \\cdot 5 = 1,57\\ \\text{m/s}$. c) Đúng: $f = 1/20 = 0,05\\ \\text{Hz}$. d) Sai: $3$ vòng.","points": 1},{"type": "short","level": "VDC","q": "Một điểm trên vành bánh xe đạp có tốc độ dài $12\\ \\text{m/s}$; bánh xe quay với tần số $5\\ \\text{Hz}$. Đường kính của bánh xe bằng bao nhiêu m? (chỉ điền số, lấy $\\pi \\approx 3,14$)","answer": "0.76","explain": "$r = v/(2\\pi f) = 12/(2 \\cdot 3,14 \\cdot 5) \\approx 0,382\\ \\text{m}$. Đường kính $\\approx 0,76\\ \\text{m}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một chất điểm chuyển động tròn đều trên đường tròn bán kính $0,5\\ \\text{m}$ với tốc độ dài $v$. Khi giảm bán kính quỹ đạo còn một nửa mà vẫn giữ nguyên tốc độ dài, tốc độ góc của chất điểm tăng gấp bao nhiêu lần? (chỉ điền số)","answer": "2","explain": "$\\omega = v/r$. Khi $r' = r/2$, $\\omega' = v/(r/2) = 2\\omega$: tăng gấp 2 lần.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Chuyển động tròn đều là chuyển động có","options": ["A. quỹ đạo tròn và tốc độ dài không đổi.","B. quỹ đạo tròn và gia tốc bằng 0.","C. tốc độ góc thay đổi đều.","D. quỹ đạo thẳng và tốc độ không đổi."],"answer": "A","explain": "Định nghĩa.","points": 0.25},{"type": "mcq","level": "NB","q": "Tốc độ dài kí hiệu là","options": ["A. $v$.","B. $\\omega$.","C. $f$.","D. $T$."],"answer": "A","explain": "Tốc độ dài kí hiệu $v$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật quay đều với tốc độ góc $3\\ \\text{rad/s}$. Sau $2\\ \\text{s}$, bán kính quét được góc","options": ["A. $6\\ \\text{rad}$.","B. $1,5\\ \\text{rad}$.","C. $5\\ \\text{rad}$.","D. $12\\ \\text{rad}$."],"answer": "A","explain": "$\\Delta\\theta = 3 \\cdot 2 = 6\\ \\text{rad}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Đơn vị của tần số là","options": ["A. héc (Hz).","B. giây (s).","C. rad/s.","D. m/s."],"answer": "A","explain": "Đơn vị Hz.","points": 0.25},{"type": "mcq","level": "TH","q": "Một chất điểm chuyển động tròn đều với tốc độ dài $9\\ \\text{m/s}$ trên đường tròn bán kính $0,3\\ \\text{m}$. Tốc độ góc của chất điểm bằng","options": ["A. $30\\ \\text{rad/s}$.","B. $2,7\\ \\text{rad/s}$.","C. $0,033\\ \\text{rad/s}$.","D. $270\\ \\text{rad/s}$."],"answer": "A","explain": "$\\omega = 9/0,3 = 30\\ \\text{rad/s}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một đĩa tròn quay đều với chu kì $0,25\\ \\text{s}$. Một điểm cách trục $0,12\\ \\text{m}$ có tốc độ dài bằng (lấy $\\pi \\approx 3,14$)","options": ["A. $3,0144\\ \\text{m/s}$.","B. $0,48\\ \\text{m/s}$.","C. $1,92\\ \\text{m/s}$.","D. $0,03\\ \\text{m/s}$."],"answer": "A","explain": "$v = 2\\pi r/T = 2 \\cdot 3,14 \\cdot 0,12/0,25 = 3,0144\\ \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Vectơ vận tốc trong chuyển động tròn đều luôn tiếp tuyến với quỹ đạo.","b) Tốc độ dài trong chuyển động tròn đều không đổi.","c) Kim giây đồng hồ chuyển động tròn đều.","d) Chuyển động của van xe đạp (so với trục xe) là chuyển động tròn đều khi xe chạy đều."],"answer": ["T","T","T","T"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: van xe quay đều quanh trục.","points": 1},{"type": "truefalse","level": "VDC","q": "Một máy ly tâm quay với tốc độ $1200\\ \\text{vòng/phút}$; ống nghiệm đặt cách trục quay $0,1\\ \\text{m}$. Xét tính đúng, sai của các khẳng định sau (lấy $\\pi \\approx 3,14$):","statements": ["a) Tần số quay của máy bằng $20\\ \\text{Hz}$.","b) Tốc độ góc của ống nghiệm bằng $40\\pi\\ \\text{rad/s}$.","c) Tốc độ dài của ống nghiệm xấp xỉ $12,56\\ \\text{m/s}$.","d) Chu kì quay của máy bằng $20\\ \\text{s}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $f = 1200/60 = 20\\ \\text{Hz}$. b) Đúng: $\\omega = 2\\pi \\cdot 20 = 40\\pi\\ \\text{rad/s}$. c) Đúng: $v = 40\\pi \\cdot 0,1 \\approx 12,56\\ \\text{m/s}$. d) Sai: $T = 1/20 = 0,05\\ \\text{s}$.","points": 1},{"type": "short","level": "VDC","q": "Một chất điểm chuyển động tròn đều trên đường tròn bán kính $0,8\\ \\text{m}$ với tần số $2,5\\ \\text{Hz}$. Tốc độ dài của chất điểm bằng bao nhiêu m/s? (chỉ điền số, lấy $\\pi \\approx 3,14$)","answer": "12.56","explain": "$v = 2\\pi f r = 2 \\cdot 3,14 \\cdot 2,5 \\cdot 0,8 = 12,56\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Hai chất điểm A, B chuyển động tròn đều trên cùng một đường tròn bán kính $r$ với tốc độ dài $v_A = 2v_B$. Tỉ số chu kì $T_A/T_B$ bằng bao nhiêu? (chỉ điền số)","answer": "0.5","explain": "$T = 2\\pi r/v$ nên $T_A/T_B = v_B/v_A = 1/2 = 0,5$.","points": 0.5}]}]}
