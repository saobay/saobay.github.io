{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Biến dạng đàn hồi là biến dạng mà","options": ["A. vật trở lại hình dạng ban đầu khi thôi tác dụng lực.","B. vật giữ nguyên hình dạng mới khi thôi tác dụng lực.","C. làm vật bị đứt gãy.","D. chỉ xảy ra với chất lỏng."],"answer": "A","explain": "Định nghĩa.","points": 0.25},{"type": "mcq","level": "NB","q": "Khối lượng riêng của nhôm là $2700\\ \\text{kg/m}^3$ có nghĩa là","options": ["A. $1\\ \\text{m}^3$ nhôm có khối lượng $2700\\ \\text{kg}$.","B. $2700\\ \\text{m}^3$ nhôm có khối lượng $1\\ \\text{kg}$.","C. nhôm luôn nặng $2700\\ \\text{kg}$.","D. $1\\ \\text{kg}$ nhôm có thể tích $2700\\ \\text{m}^3$."],"answer": "A","explain": "Ý nghĩa khối lượng riêng.","points": 0.25},{"type": "mcq","level": "NB","q": "Áp suất chất lỏng tại một điểm phụ thuộc vào","options": ["A. độ sâu của điểm đó và khối lượng riêng của chất lỏng.","B. hình dạng của bình chứa.","C. lượng chất lỏng trong bình.","D. diện tích đáy bình."],"answer": "A","explain": "$p = \\rho gh$.","points": 0.25},{"type": "mcq","level": "NB","q": "Một lò xo có độ cứng $k$. Khi độ biến dạng tăng gấp đôi (trong giới hạn đàn hồi) thì lực đàn hồi","options": ["A. tăng gấp đôi.","B. tăng gấp bốn.","C. giảm một nửa.","D. không đổi."],"answer": "A","explain": "$F = k|\\Delta l|$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có độ cứng $120\\ \\text{N/m}$, khi bị nén $5\\ \\text{cm}$ thì lực đàn hồi bằng","options": ["A. $6\\ \\text{N}$.","B. $0,6\\ \\text{N}$.","C. $2400\\ \\text{N}$.","D. $600\\ \\text{N}$."],"answer": "A","explain": "$F = 120 \\cdot 0,05 = 6\\ \\text{N}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một khối gỗ có khối lượng $1,5\\ \\text{kg}$, thể tích $2,5 \\cdot 10^{-3}\\ \\text{m}^3$. Khối lượng riêng của gỗ bằng","options": ["A. $600\\ \\text{kg/m}^3$.","B. $3750\\ \\text{kg/m}^3$.","C. $0,0017\\ \\text{kg/m}^3$.","D. $60\\ \\text{kg/m}^3$."],"answer": "A","explain": "$\\rho = 1,5/(2,5 \\cdot 10^{-3}) = 600\\ \\text{kg/m}^3$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lực đàn hồi của lò xo ngược chiều với biến dạng.","b) Trong giới hạn đàn hồi, $F = k|\\Delta l|$.","c) Độ cứng của lò xo có đơn vị N/m.","d) Lò xo càng cứng thì với cùng lực tác dụng, độ biến dạng càng lớn."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: độ biến dạng càng NHỎ.","points": 1},{"type": "truefalse","level": "VD","q": "Một lò xo treo thẳng đứng có chiều dài tự nhiên $28\\ \\text{cm}$, độ cứng $90\\ \\text{N/m}$. Treo vật $0,45\\ \\text{kg}$ (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Độ dãn của lò xo bằng $5\\ \\text{cm}$.","b) Chiều dài lò xo khi cân bằng bằng $33\\ \\text{cm}$.","c) Lực đàn hồi của lò xo bằng $4,5\\ \\text{N}$.","d) Nếu treo vật $0,9\\ \\text{kg}$ thì độ dãn tăng gấp đôi."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $\\Delta l = 4,5/90 = 0,05\\ \\text{m}$. b) Đúng. c) Đúng. d) Đúng.","points": 1},{"type": "short","level": "VD","q": "Một bể nước sâu $3\\ \\text{m}$ ($\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Áp suất của nước tại điểm cách mặt nước $2\\ \\text{m}$ bằng bao nhiêu Pa? (chỉ điền số)","answer": "20000","explain": "$p = 1000 \\cdot 10 \\cdot 2 = 20000\\ \\text{Pa}$.","points": 0.5},{"type": "short","level": "VDC","q": "Hai lò xo $k_1 = 80\\ \\text{N/m}$, $k_2 = 120\\ \\text{N/m}$ mắc nối tiếp rồi treo vật $m = 480\\ \\text{g}$ (lấy $g = 10\\ \\text{m/s}^2$). Độ dãn của hệ bằng bao nhiêu cm? (chỉ điền số)","answer": "10","explain": "$k_{td} = 48\\ \\text{N/m}$. $\\Delta l = 4,8/48 = 0,1\\ \\text{m} = 10\\ \\text{cm}$.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "NB","q": "Định luật Hooke đúng khi","options": ["A. biến dạng trong giới hạn đàn hồi.","B. biến dạng dẻo.","C. vật bị phá hủy.","D. mọi trường hợp."],"answer": "A","explain": "Điều kiện định luật Hooke.","points": 0.25},{"type": "mcq","level": "NB","q": "Áp suất được tính bằng công thức","options": ["A. $p = \\frac{F}{S}$.","B. $p = \\frac{S}{F}$.","C. $p = FS$.","D. $p = \\frac{F}{V}$."],"answer": "A","explain": "Định nghĩa.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật chìm trong nước khi","options": ["A. khối lượng riêng của vật lớn hơn khối lượng riêng của nước.","B. khối lượng riêng của vật nhỏ hơn của nước.","C. vật nhẹ.","D. vật có hình dạng tròn."],"answer": "A","explain": "Điều kiện chìm.","points": 0.25},{"type": "mcq","level": "NB","q": "Lò xo càng cứng (k càng lớn) thì","options": ["A. càng khó bị biến dạng.","B. càng dễ bị biến dạng.","C. càng dài.","D. càng nhẹ."],"answer": "A","explain": "Ý nghĩa độ cứng.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người $650\\ \\text{N}$ đứng bằng hai chân, diện tích mỗi bàn chân $130\\ \\text{cm}^2$. Áp suất của người lên mặt đất bằng","options": ["A. $25000\\ \\text{Pa}$.","B. $5\\ \\text{Pa}$.","C. $84500\\ \\text{Pa}$.","D. $2,5\\ \\text{Pa}$."],"answer": "A","explain": "$S = 0,026\\ \\text{m}^2$, $p = 650/0,026 = 25000\\ \\text{Pa}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo dãn $6\\ \\text{cm}$ khi treo vật $360\\ \\text{g}$ (lấy $g = 10\\ \\text{m/s}^2$). Độ cứng của lò xo bằng","options": ["A. $60\\ \\text{N/m}$.","B. $216\\ \\text{N/m}$.","C. $6\\ \\text{N/m}$.","D. $0,6\\ \\text{N/m}$."],"answer": "A","explain": "$k = 3,6/0,06 = 60\\ \\text{N/m}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) $1\\ \\text{Pa} = 1\\ \\text{N/m}^2$.","b) Áp suất chất lỏng tác dụng theo mọi phương.","c) Áp suất tại đáy bình phụ thuộc vào hình dạng bình.","d) Càng xuống sâu, áp suất chất lỏng càng lớn."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: $p = \\rho gh$. d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Một thùng cao $1,2\\ \\text{m}$ chứa đầy dầu ($\\rho = 800\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Áp suất tại đáy thùng bằng $9600\\ \\text{Pa}$.","b) Áp suất tại điểm giữa thùng bằng $4800\\ \\text{Pa}$.","c) Nếu thay dầu bằng nước thì áp suất tại đáy tăng.","d) Áp suất tại đáy không phụ thuộc vào tiết diện thùng."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $p = 800 \\cdot 10 \\cdot 1,2 = 9600\\ \\text{Pa}$. b) Đúng: $h = 0,6\\ \\text{m}$. c) Đúng: $\\rho_{nước} \\gt \\rho_{dầu}$. d) Đúng.","points": 1},{"type": "short","level": "VD","q": "Một lò xo có độ cứng $75\\ \\text{N/m}$, chiều dài tự nhiên $20\\ \\text{cm}$. Khi treo vật $m$ thì lò xo dài $26\\ \\text{cm}$ (lấy $g = 10\\ \\text{m/s}^2$). Khối lượng $m$ bằng bao nhiêu gam? (chỉ điền số)","answer": "450","explain": "$F = 75 \\cdot 0,06 = 4,5\\ \\text{N}$, $m = 450\\ \\text{g}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một khối kim loại có khối lượng $5,4\\ \\text{kg}$, khi nhúng chìm hoàn toàn vào nước thì lực kế chỉ $34\\ \\text{N}$ (lấy $g = 10\\ \\text{m/s}^2$, $\\rho_{nước} = 1000\\ \\text{kg/m}^3$). Khối lượng riêng của kim loại bằng bao nhiêu $\\text{kg/m}^3$? (chỉ điền số)","answer": "2700","explain": "$F_A = 54 - 34 = 20\\ \\text{N}$. $V = 20/(1000 \\cdot 10) = 2 \\cdot 10^{-3}\\ \\text{m}^3$. $\\rho = 5,4/(2 \\cdot 10^{-3}) = 2700\\ \\text{kg/m}^3$.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Khi lò xo bị nén, lực đàn hồi có hướng","options": ["A. ngược chiều với sự nén (hướng ra ngoài).","B. cùng chiều với sự nén.","C. thẳng đứng xuống.","D. bằng 0."],"answer": "A","explain": "Ngược chiều biến dạng.","points": 0.25},{"type": "mcq","level": "NB","q": "Khối lượng riêng là","options": ["A. khối lượng của một đơn vị thể tích.","B. thể tích của một đơn vị khối lượng.","C. trọng lượng của vật.","D. áp lực trên một đơn vị diện tích."],"answer": "A","explain": "Định nghĩa.","points": 0.25},{"type": "mcq","level": "NB","q": "Áp suất tại một điểm trong lòng chất lỏng đứng yên không phụ thuộc vào","options": ["A. lượng chất lỏng trong bình.","B. độ sâu của điểm đó.","C. khối lượng riêng của chất lỏng.","D. gia tốc trọng trường nơi đặt bình."],"answer": "A","explain": "$p = \\rho gh$.","points": 0.25},{"type": "mcq","level": "NB","q": "Vượt quá giới hạn đàn hồi, lò xo sẽ","options": ["A. bị biến dạng dẻo, không trở lại như cũ.","B. vẫn trở lại như cũ.","C. co ngắn lại vĩnh viễn về 0.","D. trở nên cứng hơn."],"answer": "A","explain": "Mất tính đàn hồi.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có độ cứng $200\\ \\text{N/m}$. Để lò xo nén $3\\ \\text{cm}$ cần lực bằng","options": ["A. $6\\ \\text{N}$.","B. $0,06\\ \\text{N}$.","C. $6667\\ \\text{N}$.","D. $600\\ \\text{N}$."],"answer": "A","explain": "$F = 200 \\cdot 0,03 = 6\\ \\text{N}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một bể chứa xăng ($\\rho = 700\\ \\text{kg/m}^3$) cao $2\\ \\text{m}$ ($g = 10\\ \\text{m/s}^2$). Áp suất tại đáy bể bằng","options": ["A. $14000\\ \\text{Pa}$.","B. $1400\\ \\text{Pa}$.","C. $350\\ \\text{Pa}$.","D. $28000\\ \\text{Pa}$."],"answer": "A","explain": "$p = 700 \\cdot 10 \\cdot 2 = 14000\\ \\text{Pa}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Hai vật có cùng khối lượng riêng thì làm bằng cùng chất.","b) Khối lượng riêng của chất lỏng thay đổi khi nhiệt độ thay đổi (do dãn nở).","c) Nước đá nổi trên nước vì $\\rho_{đá} \\lt \\rho_{nước}$.","d) Mọi vật thả vào nước đều chìm."],"answer": ["F","T","T","F"],"explain": "a) Sai: các chất khác nhau có thể có cùng $\\rho$. b) Đúng. c) Đúng. d) Sai: vật nhẹ hơn nước thì nổi.","points": 1},{"type": "truefalse","level": "VD","q": "Một lò xo có độ cứng $k_1 = 100\\ \\text{N/m}$ mắc nối tiếp với lò xo $k_2 = 150\\ \\text{N/m}$, treo vật $0,3\\ \\text{kg}$ (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Độ cứng tương đương của hệ bằng $60\\ \\text{N/m}$.","b) Độ dãn của hệ bằng $5\\ \\text{cm}$.","c) Lực đàn hồi của hai lò xo bằng nhau.","d) Lò xo 1 dãn nhiều hơn lò xo 2."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $1/k = 1/100 + 1/150 = 5/300$, $k = 60\\ \\text{N/m}$. b) Đúng: $\\Delta l = 3/60 = 0,05\\ \\text{m}$. c) Đúng. d) Đúng: $\\Delta l_1 = 3/100 \\gt \\Delta l_2 = 3/150$.","points": 1},{"type": "short","level": "VD","q": "Một tàu ngầm lặn ở độ sâu $40\\ \\text{m}$ trong nước biển ($\\rho = 1030\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Áp suất của nước biển tác dụng lên thân tàu bằng bao nhiêu Pa? (chỉ điền số)","answer": "412000","explain": "$p = 1030 \\cdot 10 \\cdot 40 = 412000\\ \\text{Pa}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một lò xo có độ cứng $k_0 = 60\\ \\text{N/m}$, cắt thành 3 phần bằng nhau rồi mắc song song. Độ cứng tương đương bằng bao nhiêu N/m? (chỉ điền số)","answer": "540","explain": "Mỗi phần: $k = 180\\ \\text{N/m}$. Song song: $k_{td} = 3 \\cdot 180 = 540\\ \\text{N/m}$.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "NB","q": "Lực kế hoạt động dựa trên","options": ["A. định luật Hooke.","B. định luật bảo toàn động lượng.","C. định luật 2 Newton.","D. nguyên lí Pascal."],"answer": "A","explain": "Lực kế lò xo.","points": 0.25},{"type": "mcq","level": "NB","q": "Áp suất khí quyển tác dụng","options": ["A. theo mọi phương.","B. chỉ theo phương thẳng đứng.","C. chỉ lên chất rắn.","D. chỉ lên chất lỏng."],"answer": "A","explain": "Tính chất.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật lơ lửng trong chất lỏng khi","options": ["A. khối lượng riêng của vật bằng khối lượng riêng của chất lỏng.","B. vật rất nặng.","C. vật rất nhẹ.","D. chất lỏng rất đặc."],"answer": "A","explain": "Điều kiện lơ lửng.","points": 0.25},{"type": "mcq","level": "TH","q": "Độ cứng của lò xo phụ thuộc vào","options": ["A. vật liệu và kích thước của lò xo.","B. màu sắc của lò xo.","C. khối lượng của lò xo.","D. nhiệt độ phòng."],"answer": "A","explain": "Các yếu tố ảnh hưởng đến $k$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật có khối lượng $4,5\\ \\text{kg}$, thể tích $1,5 \\cdot 10^{-3}\\ \\text{m}^3$. Khối lượng riêng của vật bằng","options": ["A. $3000\\ \\text{kg/m}^3$.","B. $6750\\ \\text{kg/m}^3$.","C. $0,00033\\ \\text{kg/m}^3$.","D. $300\\ \\text{kg/m}^3$."],"answer": "A","explain": "$\\rho = 4,5/(1,5 \\cdot 10^{-3}) = 3000\\ \\text{kg/m}^3$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo khi treo vật $250\\ \\text{g}$ thì dãn $5\\ \\text{cm}$ (lấy $g = 10\\ \\text{m/s}^2$). Độ cứng của lò xo bằng","options": ["A. $50\\ \\text{N/m}$.","B. $1250\\ \\text{N/m}$.","C. $5\\ \\text{N/m}$.","D. $12,5\\ \\text{N/m}$."],"answer": "A","explain": "$k = 2,5/0,05 = 50\\ \\text{N/m}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Trong giới hạn đàn hồi, lực đàn hồi tỉ lệ thuận với độ biến dạng.","b) Đồ thị $F$ theo $|\\Delta l|$ là đường thẳng đi qua gốc tọa độ.","c) Hệ số góc của đồ thị bằng độ cứng $k$.","d) Khi vượt quá giới hạn đàn hồi, định luật Hooke vẫn đúng."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai.","points": 1},{"type": "truefalse","level": "VD","q": "Một khối hộp đặc $0,3\\ \\text{m} \\times 0,2\\ \\text{m} \\times 0,1\\ \\text{m}$ có khối lượng $15\\ \\text{kg}$ đặt trên mặt bàn ($g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Thể tích của khối hộp bằng $6 \\cdot 10^{-3}\\ \\text{m}^3$.","b) Khối lượng riêng của chất làm hộp bằng $2500\\ \\text{kg/m}^3$.","c) Áp suất nhỏ nhất của hộp lên bàn bằng $2500\\ \\text{Pa}$.","d) Áp suất lớn nhất của hộp lên bàn bằng $7500\\ \\text{Pa}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $V = 0,006\\ \\text{m}^3$. b) Đúng: $\\rho = 15/0,006 = 2500\\ \\text{kg/m}^3$. c) Đúng: $S_{max} = 0,06\\ \\text{m}^2$, $p = 150/0,06 = 2500\\ \\text{Pa}$. d) Đúng: $S_{min} = 0,02\\ \\text{m}^2$, $p = 7500\\ \\text{Pa}$.","points": 1},{"type": "short","level": "VDC","q": "Một lò xo có chiều dài tự nhiên $25\\ \\text{cm}$, độ cứng $80\\ \\text{N/m}$. Khi chịu lực kéo $12\\ \\text{N}$, chiều dài của lò xo bằng bao nhiêu cm? (chỉ điền số)","answer": "40","explain": "$\\Delta l = 12/80 = 0,15\\ \\text{m} = 15\\ \\text{cm}$. $l = 40\\ \\text{cm}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một phao hình hộp $1\\ \\text{m} \\times 0,5\\ \\text{m} \\times 0,4\\ \\text{m}$ có khối lượng $60\\ \\text{kg}$ nổi trên mặt nước ($\\rho = 1000\\ \\text{kg/m}^3$). Chiều cao phần chìm bằng bao nhiêu cm? (chỉ điền số)","answer": "12","explain": "$V_{chìm} = m/\\rho = 60/1000 = 0,06\\ \\text{m}^3$. $h_{chìm} = 0,06/(1 \\cdot 0,5) = 0,12\\ \\text{m} = 12\\ \\text{cm}$.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Biến dạng kéo xảy ra khi vật chịu tác dụng của","options": ["A. hai lực kéo ngược chiều nhau.","B. hai lực ép vào nhau.","C. một lực duy nhất.","D. không có lực nào."],"answer": "A","explain": "Định nghĩa.","points": 0.25},{"type": "mcq","level": "NB","q": "Đổi $2,5\\ \text{g/cm}^3$ ra $\\ \text{kg/m}^3$ được","options": ["A. $2500\\ \text{kg/m}^3$.","B. $2,5\\ \text{kg/m}^3$.","C. $250\\ \text{kg/m}^3$.","D. $25\\ \text{kg/m}^3$."],"answer": "A","explain": "$2,5\\ \text{g/cm}^3 = 2,5 \\cdot 1000 = 2500\\ \text{kg/m}^3$.","points": 0.25},{"type": "mcq","level": "NB","q": "Muốn tăng áp suất, ta nên","options": ["A. làm cho diện tích bị ép nhỏ lại (cùng áp lực).","B. làm cho diện tích bị ép lớn ra.","C. giảm áp lực.","D. tăng cả áp lực và diện tích."],"answer": "A","explain": "$p = F/S$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có $k = 50\\ \\text{N/m}$. Khi dãn $2\\ \\text{cm}$, lực đàn hồi bằng","options": ["A. $1\\ \\text{N}$.","B. $100\\ \\text{N}$.","C. $25\\ \\text{N}$.","D. $0,04\\ \\text{N}$."],"answer": "A","explain": "$F = 50 \\cdot 0,02 = 1\\ \\text{N}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một cột thủy ngân cao $0,76\\ \\text{m}$ ($\\rho = 13600\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Áp suất do cột thủy ngân gây ra bằng","options": ["A. $103360\\ \\text{Pa}$.","B. $10336\\ \\text{Pa}$.","C. $17894\\ \\text{Pa}$.","D. $1033,6\\ \\text{Pa}$."],"answer": "A","explain": "$p = 13600 \\cdot 10 \\cdot 0,76 = 103360\\ \\text{Pa}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có độ cứng $90\\ \\text{N/m}$, chiều dài tự nhiên $18\\ \\text{cm}$. Khi treo vật $270\\ \\text{g}$ (lấy $g = 10\\ \\text{m/s}^2$), chiều dài của lò xo bằng","options": ["A. $21\\ \\text{cm}$.","B. $48\\ \\text{cm}$.","C. $15\\ \\text{cm}$.","D. $20,7\\ \\text{cm}$."],"answer": "A","explain": "$\\Delta l = 2,7/90 = 0,03\\ \\text{m} = 3\\ \\text{cm}$. $l = 21\\ \\text{cm}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lò xo bị kéo dãn thì lực đàn hồi hướng vào trong.","b) Lò xo bị nén thì lực đàn hồi hướng ra ngoài.","c) Lực đàn hồi luôn ngược chiều biến dạng.","d) Lực đàn hồi cùng chiều với ngoại lực gây biến dạng."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai.","points": 1},{"type": "truefalse","level": "VD","q": "Một bể nước hình hộp có đáy $2\\ \\text{m}^2$, chứa nước sâu $1,5\\ \\text{m}$ ($\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Áp suất của nước tại đáy bể bằng $15000\\ \\text{Pa}$.","b) Lực do nước tác dụng lên đáy bể bằng $30000\\ \\text{N}$.","c) Khối lượng nước trong bể bằng $3000\\ \\text{kg}$.","d) Nếu tăng diện tích đáy lên gấp đôi (cùng độ sâu) thì áp suất tại đáy tăng gấp đôi."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $p = 1000 \\cdot 10 \\cdot 1,5 = 15000\\ \\text{Pa}$. b) Đúng: $F = 15000 \\cdot 2 = 30000\\ \\text{N}$. c) Đúng: $m = 1000 \\cdot 3 = 3000\\ \\text{kg}$. d) Sai: $p$ không phụ thuộc diện tích đáy.","points": 1},{"type": "short","level": "VDC","q": "Một lò xo khi treo vật $m_1 = 100\\ \\text{g}$ thì dãn $2\\ \\text{cm}$; khi treo vật $m_2$ thì dãn $7\\ \\text{cm}$ (trong giới hạn đàn hồi). Khối lượng $m_2$ bằng bao nhiêu gam? (chỉ điền số)","answer": "350","explain": "$m_2 = 100 \\cdot 7/2 = 350\\ \\text{g}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một thanh kim loại có khối lượng $7,8\\ \\text{kg}$, thể tích $10^{-3}\\ \\text{m}^3$. Nếu khoét đi một phần thể tích $2 \\cdot 10^{-4}\\ \\text{m}^3$ (không làm thay đổi chất liệu), khối lượng còn lại bằng bao nhiêu kg? (chỉ điền số)","answer": "6.24","explain": "$\\rho = 7800\\ \\text{kg/m}^3$. $m_{còn} = 7800 \\cdot 8 \\cdot 10^{-4} = 6,24\\ \\text{kg}$.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Vật nào sau đây không có tính đàn hồi?","options": ["A. Cục đất sét.","B. Lò xo.","C. Dây cao su.","D. Quả bóng cao su."],"answer": "A","explain": "Đất sét bị biến dạng dẻo.","points": 0.25},{"type": "mcq","level": "NB","q": "Áp suất tại đáy bình chứa chất lỏng không phụ thuộc vào","options": ["A. tiết diện của bình.","B. độ cao cột chất lỏng.","C. khối lượng riêng của chất lỏng.","D. gia tốc trọng trường."],"answer": "A","explain": "$p = \\rho gh$.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật nổi trên mặt nước thì","options": ["A. trọng lượng của vật bằng lực đẩy Archimedes.","B. trọng lượng lớn hơn lực đẩy Archimedes.","C. lực đẩy Archimedes bằng 0.","D. vật không chịu tác dụng của trọng lực."],"answer": "A","explain": "Cân bằng.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong công thức $F = k|\\Delta l|$, đơn vị của $k|\\Delta l|$ là","options": ["A. niutơn (N).","B. mét (m).","C. $\\text{N/m}$.","D. jun (J)."],"answer": "A","explain": "Lực đàn hồi đo bằng N.","points": 0.25},{"type": "mcq","level": "TH","q": "Một thợ lặn ở độ sâu $12\\ \\text{m}$ trong nước ($\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Áp suất của nước tác dụng lên thợ lặn bằng","options": ["A. $120000\\ \\text{Pa}$.","B. $12000\\ \\text{Pa}$.","C. $833\\ \\text{Pa}$.","D. $1200\\ \\text{Pa}$."],"answer": "A","explain": "$p = 1000 \\cdot 10 \\cdot 12 = 120000\\ \\text{Pa}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có độ cứng $140\\ \\text{N/m}$. Khi lực đàn hồi bằng $7\\ \\text{N}$, độ biến dạng của lò xo bằng","options": ["A. $5\\ \\text{cm}$.","B. $0,05\\ \\text{cm}$.","C. $980\\ \\text{cm}$.","D. $20\\ \\text{cm}$."],"answer": "A","explain": "$|\\Delta l| = 7/140 = 0,05\\ \\text{m} = 5\\ \\text{cm}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cắt lò xo thành hai phần bằng nhau thì mỗi phần cứng gấp đôi lò xo ban đầu.","b) Mắc nối tiếp hai lò xo giống nhau thì hệ mềm hơn mỗi lò xo.","c) Mắc song song hai lò xo giống nhau thì hệ cứng gấp đôi mỗi lò xo.","d) Độ cứng của hệ lò xo mắc nối tiếp bằng tổng độ cứng các lò xo."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng: $k_{td} = k/2$. c) Đúng: $k_{td} = 2k$. d) Sai: $1/k_{td} = 1/k_1 + 1/k_2$.","points": 1},{"type": "truefalse","level": "VD","q": "Một khối sắt đặc có khối lượng $15,6\\ \\text{kg}$ ($\\rho_{sắt} = 7800\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Thể tích của khối sắt bằng $2 \\cdot 10^{-3}\\ \\text{m}^3$.","b) Khi nhúng chìm hoàn toàn vào nước, lực đẩy Archimedes bằng $20\\ \\text{N}$.","c) Khi nhúng chìm trong nước, lực kế treo vật chỉ $136\\ \\text{N}$.","d) Khối sắt nổi trên mặt thủy ngân ($\\rho = 13600\\ \\text{kg/m}^3$)."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $V = 15,6/7800 = 2 \\cdot 10^{-3}\\ \\text{m}^3$. b) Đúng: $F_A = 1000 \\cdot 2 \\cdot 10^{-3} \\cdot 10 = 20\\ \\text{N}$. c) Đúng: $156 - 20 = 136\\ \\text{N}$. d) Đúng: $\\rho_{sắt} \\lt \\rho_{thủy ngân}$.","points": 1},{"type": "short","level": "VDC","q": "Một lò xo có độ cứng $55\\ \\text{N/m}$. Muốn lực đàn hồi bằng $11\\ \\text{N}$ thì phải làm lò xo biến dạng bao nhiêu cm? (chỉ điền số)","answer": "20","explain": "$|\\Delta l| = 11/55 = 0,2\\ \\text{m} = 20\\ \\text{cm}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một bể bơi dài $25\\ \\text{m}$, rộng $10\\ \\text{m}$, sâu $2\\ \\text{m}$ chứa đầy nước ($\\rho = 1000\\ \\text{kg/m}^3$). Khối lượng nước trong bể bằng bao nhiêu tấn? (chỉ điền số)","answer": "500","explain": "$V = 25 \\cdot 10 \\cdot 2 = 500\\ \\text{m}^3$. $m = 500000\\ \\text{kg} = 500$ tấn.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Phát biểu nào sau đây sai về lực đàn hồi?","options": ["A. Lực đàn hồi cùng chiều với biến dạng.","B. Lực đàn hồi ngược chiều biến dạng.","C. Lực đàn hồi xuất hiện khi vật bị biến dạng đàn hồi.","D. Lực đàn hồi có xu hướng đưa vật về trạng thái ban đầu."],"answer": "A","explain": "Lực đàn hồi ngược chiều biến dạng.","points": 0.25},{"type": "mcq","level": "NB","q": "Áp suất là","options": ["A. độ lớn của áp lực trên một đơn vị diện tích bị ép.","B. lực tác dụng lên vật.","C. khối lượng trên một đơn vị thể tích.","D. độ biến dạng của vật."],"answer": "A","explain": "Định nghĩa.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật có khối lượng riêng bằng khối lượng riêng của chất lỏng thì khi thả vào chất lỏng sẽ","options": ["A. lơ lửng trong chất lỏng.","B. chìm xuống đáy.","C. nổi lên mặt.","D. tan ra."],"answer": "A","explain": "Điều kiện lơ lửng.","points": 0.25},{"type": "mcq","level": "TH","q": "Hai lò xo có cùng độ cứng $k$. Mắc nối tiếp hai lò xo thì độ cứng của hệ bằng","options": ["A. $k/2$.","B. $2k$.","C. $k$.","D. $k^2$."],"answer": "A","explain": "$1/k_{td} = 2/k$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một xe ô tô nặng $12000\\ \\text{N}$, diện tích tiếp xúc của 4 bánh xe là $0,06\\ \\text{m}^2$. Áp suất của xe lên mặt đường bằng","options": ["A. $200000\\ \\text{Pa}$.","B. $720\\ \\text{Pa}$.","C. $0,000005\\ \\text{Pa}$.","D. $2000\\ \\text{Pa}$."],"answer": "A","explain": "$p = 12000/0,06 = 200000\\ \\text{Pa}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo dài $26\\ \\text{cm}$ khi treo vật $200\\ \\text{g}$ và dài $30\\ \\text{cm}$ khi treo vật $400\\ \\text{g}$ (lấy $g = 10\\ \\text{m/s}^2$). Độ cứng của lò xo bằng","options": ["A. $50\\ \\text{N/m}$.","B. $100\\ \\text{N/m}$.","C. $25\\ \\text{N/m}$.","D. $200\\ \\text{N/m}$."],"answer": "A","explain": "$\\Delta F = 2\\ \\text{N}$ ứng với $\\Delta l = 0,04\\ \\text{m}$, $k = 50\\ \\text{N/m}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Áp suất chất lỏng tại một điểm tỉ lệ thuận với độ sâu.","b) Tại cùng độ sâu trong cùng chất lỏng, áp suất bằng nhau.","c) Đập thủy điện xây chân đập dày vì áp suất tăng theo độ sâu.","d) Áp suất tại mặt thoáng của chất lỏng luôn bằng 0."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bằng áp suất khí quyển.","points": 1},{"type": "truefalse","level": "VD","q": "Một quả cầu đặc có khối lượng $2,7\\ \\text{kg}$, thể tích $10^{-3}\\ \\text{m}^3$ ($g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khối lượng riêng của quả cầu bằng $2700\\ \\text{kg/m}^3$.","b) Quả cầu chìm trong nước.","c) Khi nhúng chìm hoàn toàn vào nước, lực đẩy Archimedes bằng $10\\ \\text{N}$.","d) Khi nhúng chìm trong nước, lực kế treo quả cầu chỉ $17\\ \\text{N}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng. b) Đúng: $2700 \\gt 1000$. c) Đúng: $F_A = 1000 \\cdot 10^{-3} \\cdot 10 = 10\\ \\text{N}$. d) Đúng: $27 - 10 = 17\\ \\text{N}$.","points": 1},{"type": "short","level": "VDC","q": "Một lò xo có độ cứng $65\\ \\text{N/m}$, chiều dài tự nhiên $22\\ \\text{cm}$. Khi treo vật $m$ thì lò xo dài $30\\ \\text{cm}$ (lấy $g = 10\\ \\text{m/s}^2$). Khối lượng $m$ bằng bao nhiêu gam? (chỉ điền số)","answer": "520","explain": "$F = 65 \\cdot 0,08 = 5,2\\ \\text{N}$, $m = 520\\ \\text{g}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một khối gỗ $3,6\\ \\text{kg}$ nổi trên mặt nước, thể tích phần nổi bằng $1/4$ thể tích khối gỗ ($\\rho_{nước} = 1000\\ \\text{kg/m}^3$). Thể tích của khối gỗ bằng bao nhiêu $\\text{m}^3$? (chỉ điền số, dạng thập phân)","answer": "0.0048","explain": "$V_{chìm} = 3V/4$. $m = \\rho_{nước} \\cdot 3V/4$, $V = 3,6 \\cdot 4/(3 \\cdot 1000) = 0,0048\\ \\text{m}^3$.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "NB","q": "Trong các trường hợp sau, trường hợp nào là biến dạng dẻo?","options": ["A. Nặn đất sét thành hình con vật.","B. Kéo dãn dây cao su rồi thả ra.","C. Nén lò xo rồi thả ra.","D. Uốn thước nhựa rồi thả ra."],"answer": "A","explain": "Đất sét giữ nguyên hình dạng mới.","points": 0.25},{"type": "mcq","level": "NB","q": "Áp suất do người đứng trên mặt đất gây ra sẽ giảm khi","options": ["A. nằm xuống đất (tăng diện tích tiếp xúc).","B. đứng co một chân.","C. mang thêm ba lô nặng.","D. đi giày cao gót."],"answer": "A","explain": "$S$ tăng thì $p$ giảm.","points": 0.25},{"type": "mcq","level": "TH","q": "Khối lượng riêng của dầu là $800\\ \\text{kg/m}^3$, của nước là $1000\\ \\text{kg/m}^3$. Khi đổ dầu vào nước, dầu sẽ","options": ["A. nổi lên trên mặt nước.","B. chìm xuống đáy.","C. lơ lửng trong nước.","D. trộn lẫn hoàn toàn."],"answer": "A","explain": "$\\rho_{dầu} \\lt \\rho_{nước}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có độ cứng $k_1$, cắt đôi thì mỗi phần có độ cứng","options": ["A. $2k_1$.","B. $k_1/2$.","C. $k_1$.","D. $4k_1$."],"answer": "A","explain": "Độ cứng tỉ lệ nghịch với chiều dài.","points": 0.25},{"type": "mcq","level": "TH","q": "Một bể nước cao $1,6\\ \\text{m}$ chứa đầy nước ($\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Áp suất tại đáy bể bằng","options": ["A. $16000\\ \\text{Pa}$.","B. $1600\\ \\text{Pa}$.","C. $625\\ \\text{Pa}$.","D. $160\\ \\text{Pa}$."],"answer": "A","explain": "$p = 1000 \\cdot 10 \\cdot 1,6 = 16000\\ \\text{Pa}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một lò xo có độ cứng $85\\ \\text{N/m}$. Khi dãn $4\\ \\text{cm}$, lực đàn hồi bằng","options": ["A. $3,4\\ \\text{N}$.","B. $0,034\\ \\text{N}$.","C. $2125\\ \\text{N}$.","D. $340\\ \\text{N}$."],"answer": "A","explain": "$F = 85 \\cdot 0,04 = 3,4\\ \\text{N}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Thước kẻ bằng nhựa uốn cong rồi thả ra trở lại thẳng là biến dạng đàn hồi.","b) Sợi dây thép kéo quá mạnh bị đứt là vượt quá giới hạn đàn hồi.","c) Mọi biến dạng của vật rắn đều là biến dạng đàn hồi.","d) Lò xo mất tính đàn hồi nếu bị kéo quá dãn."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: có biến dạng dẻo. d) Đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Hai lò xo $k_1 = 70\\ \\text{N/m}$, $k_2 = 105\\ \\text{N/m}$ mắc song song, treo vật $m$ thì hệ dãn $4\\ \\text{cm}$ (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Độ cứng tương đương của hệ bằng $175\\ \\text{N/m}$.","b) Lực đàn hồi của hệ bằng $7\\ \\text{N}$.","c) Khối lượng $m$ bằng $700\\ \\text{g}$.","d) Độ dãn của mỗi lò xo đều bằng $4\\ \\text{cm}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $k = 175\\ \\text{N/m}$. b) Đúng: $F = 175 \\cdot 0,04 = 7\\ \\text{N}$. c) Đúng: $m = 0,7\\ \\text{kg}$. d) Đúng: song song thì cùng độ dãn.","points": 1},{"type": "short","level": "VDC","q": "Một người đi giày cao gót, diện tích mỗi gót giày $2\\ \\text{cm}^2$, người nặng $500\\ \\text{N}$ đứng bằng hai gót. Áp suất lên mặt đất bằng bao nhiêu Pa? (chỉ điền số)","answer": "1250000","explain": "$S = 4 \\cdot 10^{-4}\\ \\text{m}^2$, $p = 500/(4 \\cdot 10^{-4}) = 1250000\\ \\text{Pa}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một lò xo có độ cứng $k_0 = 100\\ \\text{N/m}$ được cắt thành hai phần với chiều dài tỉ lệ $2:3$. Mắc nối tiếp hai phần này. Độ cứng tương đương bằng bao nhiêu N/m? (chỉ điền số)","answer": "100","explain": "Phần 1 dài $2/5$: $k_1 = 100/(2/5) = 250\\ \\text{N/m}$. Phần 2 dài $3/5$: $k_2 = 100/(3/5) \\approx 166,7\\ \\text{N/m}$. Nối tiếp: $1/k_{td} = 1/250 + 1/166,7 = 1/100$, $k_{td} = 100\\ \\text{N/m}$.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Lực đàn hồi xuất hiện khi","options": ["A. vật bị biến dạng đàn hồi.","B. vật chuyển động nhanh.","C. vật đứng yên lâu ngày.","D. vật bị nung nóng."],"answer": "A","explain": "Điều kiện xuất hiện.","points": 0.25},{"type": "mcq","level": "NB","q": "Áp suất chất lỏng gây ra tại đáy bình","options": ["A. tỉ lệ thuận với chiều cao cột chất lỏng.","B. tỉ lệ nghịch với chiều cao cột chất lỏng.","C. không phụ thuộc chiều cao.","D. bằng 0 khi bình đậy kín."],"answer": "A","explain": "$p = \\rho gh$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật đặc có khối lượng $m$, thể tích $V$. Nếu tăng cả $m$ và $V$ lên gấp đôi thì khối lượng riêng","options": ["A. không đổi.","B. tăng gấp đôi.","C. giảm một nửa.","D. tăng gấp bốn."],"answer": "A","explain": "$\\rho = m/V$ không đổi.","points": 0.25},{"type": "mcq","level": "TH","q": "Giới hạn đàn hồi là","options": ["A. giới hạn mà trong đó vật còn giữ được tính đàn hồi.","B. lực tối đa mà vật chịu được.","C. độ dãn tối đa của lò xo.","D. khối lượng tối đa treo được."],"answer": "A","explain": "Định nghĩa.","points": 0.25},{"type": "mcq","level": "TH","q": "Một khối chì có khối lượng $11,3\\ \\text{kg}$, khối lượng riêng của chì là $11300\\ \\text{kg/m}^3$. Thể tích của khối chì bằng","options": ["A. $10^{-3}\\ \\text{m}^3$.","B. $127690\\ \\text{m}^3$.","C. $1\\ \\text{m}^3$.","D. $0,001\\ \\text{cm}^3$."],"answer": "A","explain": "$V = 11,3/11300 = 10^{-3}\\ \\text{m}^3$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một lò xo có độ cứng $95\\ \\text{N/m}$, chiều dài tự nhiên $24\\ \\text{cm}$. Khi nén với lực $9,5\\ \\text{N}$, chiều dài của lò xo bằng","options": ["A. $14\\ \\text{cm}$.","B. $34\\ \\text{cm}$.","C. $23\\ \\text{cm}$.","D. $25\\ \\text{cm}$."],"answer": "A","explain": "$\\Delta l = 9,5/95 = 0,1\\ \\text{m} = 10\\ \\text{cm}$. $l = 24 - 10 = 14\\ \\text{cm}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Dầu nổi trên nước vì khối lượng riêng của dầu nhỏ hơn nước.","b) Thép chìm trong nước vì khối lượng riêng của thép lớn hơn nước.","c) Tàu thủy bằng thép nổi được vì có khoang rỗng làm khối lượng riêng trung bình nhỏ.","d) Mọi kim loại đều chìm trong thủy ngân."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: kim loại nhẹ hơn thủy ngân ($\\rho = 13600\\ \\text{kg/m}^3$) thì nổi.","points": 1},{"type": "truefalse","level": "VDC","q": "Một lò xo có độ cứng $110\\ \\text{N/m}$, chiều dài tự nhiên $30\\ \\text{cm}$, treo thẳng đứng và móc vật $0,55\\ \\text{kg}$ (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Độ dãn của lò xo bằng $5\\ \\text{cm}$.","b) Chiều dài lò xo khi cân bằng bằng $35\\ \\text{cm}$.","c) Lực đàn hồi của lò xo bằng $5,5\\ \\text{N}$.","d) Nếu thay lò xo có độ cứng gấp đôi thì độ dãn giảm một nửa."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $\\Delta l = 5,5/110 = 0,05\\ \\text{m}$. b) Đúng. c) Đúng. d) Đúng.","points": 1},{"type": "short","level": "VDC","q": "Một hồ chứa nước sâu $2,2\\ \\text{m}$ ($\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Áp suất tại đáy hồ bằng bao nhiêu Pa? (chỉ điền số)","answer": "22000","explain": "$p = 1000 \\cdot 10 \\cdot 2,2 = 22000\\ \\text{Pa}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một lò xo có độ cứng $k_0$. Nối tiếp hai lò xo giống hệt nhau (mỗi lò xo độ cứng $k_0$) thì hệ có độ cứng $40\\ \\text{N/m}$. Giá trị $k_0$ bằng bao nhiêu N/m? (chỉ điền số)","answer": "80","explain": "$k_{td} = k_0/2 = 40$, $k_0 = 80\\ \\text{N/m}$.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Biến dạng của vật rắn là sự","options": ["A. thay đổi hình dạng và kích thước của vật.","B. thay đổi khối lượng của vật.","C. thay đổi nhiệt độ của vật.","D. thay đổi màu sắc của vật."],"answer": "A","explain": "Định nghĩa.","points": 0.25},{"type": "mcq","level": "NB","q": "Khối lượng riêng của một chất","options": ["A. đặc trưng cho chất liệu đó.","B. phụ thuộc vào kích thước vật.","C. bằng trọng lượng của vật.","D. thay đổi khi chia nhỏ vật."],"answer": "A","explain": "Đặc trưng của chất.","points": 0.25},{"type": "mcq","level": "TH","q": "Áp suất tại một điểm trong chất lỏng đứng yên","options": ["A. tác dụng theo mọi phương.","B. chỉ tác dụng xuống dưới.","C. chỉ tác dụng lên trên.","D. bằng 0."],"answer": "A","explain": "Tính chất.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi treo vật nặng vào lò xo, lò xo dãn ra. Lực đàn hồi của lò xo","options": ["A. hướng lên trên, cân bằng với trọng lực.","B. hướng xuống dưới.","C. bằng 0.","D. hướng ngang."],"answer": "A","explain": "Cân bằng: $F_{đh} = P$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật có thể tích $0,8\\ \\text{m}^3$, khối lượng riêng $1250\\ \\text{kg/m}^3$. Khối lượng của vật bằng","options": ["A. $1000\\ \\text{kg}$.","B. $1562,5\\ \\text{kg}$.","C. $0,00064\\ \\text{kg}$.","D. $100\\ \\text{kg}$."],"answer": "A","explain": "$m = 1250 \\cdot 0,8 = 1000\\ \\text{kg}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một lò xo khi chịu lực kéo $12\\ \\text{N}$ thì dãn $6\\ \\text{cm}$. Độ cứng của lò xo bằng","options": ["A. $200\\ \\text{N/m}$.","B. $72\\ \\text{N/m}$.","C. $2\\ \\text{N/m}$.","D. $0,5\\ \\text{N/m}$."],"answer": "A","explain": "$k = 12/0,06 = 200\\ \\text{N/m}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) $p = F/S$ với $F$ là áp lực.","b) $1\\ \\text{Pa} = 1\\ \\text{N/m}^2$.","c) Áp suất càng lớn khi diện tích bị ép càng nhỏ (cùng áp lực).","d) Áp suất là đại lượng vectơ."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: vô hướng.","points": 1},{"type": "truefalse","level": "VDC","q": "Một khối gỗ hình lập phương cạnh $0,15\\ \\text{m}$, khối lượng $2,025\\ \\text{kg}$ nổi trên mặt nước ($\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khối lượng riêng của gỗ bằng $600\\ \\text{kg/m}^3$.","b) Thể tích phần chìm bằng $2,025 \\cdot 10^{-3}\\ \\text{m}^3$.","c) Chiều cao phần nổi bằng $6\\ \\text{cm}$.","d) Lực đẩy Archimedes tác dụng lên gỗ bằng $20,25\\ \\text{N}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $\\rho = 2,025/0,003375 = 600\\ \\text{kg/m}^3$. b) Đúng: $V_{chìm} = 2,025/1000$. c) Đúng: $h_{chìm} = 9\\ \\text{cm}$, phần nổi $6\\ \\text{cm}$. d) Đúng: $F_A = P = 20,25\\ \\text{N}$.","points": 1},{"type": "short","level": "VDC","q": "Một lò xo có độ cứng $120\\ \\text{N/m}$. Cắt lò xo thành 3 phần bằng nhau rồi mắc nối tiếp 3 phần. Độ cứng tương đương bằng bao nhiêu N/m? (chỉ điền số)","answer": "120","explain": "Mỗi phần: $k = 360\\ \\text{N/m}$. Nối tiếp 3 phần: $k_{td} = 360/3 = 120\\ \\text{N/m}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một bể nước có diện tích đáy $4\\ \\text{m}^2$, độ sâu $1,25\\ \\text{m}$ ($\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Áp lực của nước lên đáy bể bằng bao nhiêu N? (chỉ điền số)","answer": "50000","explain": "$p = 1000 \\cdot 10 \\cdot 1,25 = 12500\\ \\text{Pa}$. $F = 12500 \\cdot 4 = 50000\\ \\text{N}$.","points": 0.5}]}]}
