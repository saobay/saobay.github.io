<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Biến dạng của vật rắn là","options": ["A. sự thay đổi hình dạng và kích thước của vật dưới tác dụng của ngoại lực.","B. sự thay đổi khối lượng của vật.","C. sự thay đổi màu sắc của vật.","D. sự nóng chảy của vật."],"answer": "A","explain": "Định nghĩa biến dạng.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi thôi tác dụng lực mà vật trở lại hình dạng ban đầu, biến dạng đó gọi là","options": ["A. biến dạng đàn hồi.","B. biến dạng dẻo.","C. biến dạng vĩnh viễn.","D. biến dạng phá hủy."],"answer": "A","explain": "Định nghĩa biến dạng đàn hồi.","points": 0.25},{"type": "mcq","level": "NB","q": "Định luật Hooke được phát biểu cho","options": ["A. biến dạng đàn hồi của lò xo (trong giới hạn đàn hồi).","B. mọi biến dạng của vật rắn.","C. biến dạng dẻo.","D. sự nóng chảy."],"answer": "A","explain": "Điều kiện: trong giới hạn đàn hồi.","points": 0.25},{"type": "mcq","level": "NB","q": "Biểu thức của định luật Hooke là","options": ["A. $F = k|\\Delta l|$.","B. $F = \\frac{k}{|\\Delta l|}$.","C. $F = k + |\\Delta l|$.","D. $F = k|\\Delta l|^2$."],"answer": "A","explain": "$F = k|\\Delta l|$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có độ cứng $100\\ \\text{N/m}$, khi bị kéo dãn $4\\ \\text{cm}$, lực đàn hồi của lò xo bằng","options": ["A. $4\\ \\text{N}$.","B. $0,04\\ \\text{N}$.","C. $2500\\ \\text{N}$.","D. $400\\ \\text{N}$."],"answer": "A","explain": "$F = 100 \\cdot 0,04 = 4\\ \\text{N}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Treo vật khối lượng $0,5\\ \\text{kg}$ vào lò xo thì lò xo dãn $5\\ \\text{cm}$ (lấy $g = 10\\ \\text{m/s}^2$). Độ cứng của lò xo bằng","options": ["A. $100\\ \\text{N/m}$.","B. $10\\ \\text{N/m}$.","C. $250\\ \\text{N/m}$.","D. $0,1\\ \\text{N/m}$."],"answer": "A","explain": "$k = mg/\\Delta l = 5/0,05 = 100\\ \\text{N/m}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lò xo bị kéo dãn thì xuất hiện lực đàn hồi chống lại sự dãn.","b) Lực đàn hồi của lò xo tỉ lệ thuận với độ biến dạng (trong giới hạn đàn hồi).","c) Đơn vị của độ cứng lò xo là N/m.","d) Lò xo càng cứng thì với cùng lực tác dụng, độ dãn càng lớn."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng: định luật Hooke. c) Đúng. d) Sai: lò xo càng cứng (k lớn) thì độ dãn càng NHỎ.","points": 1},{"type": "truefalse","level": "VD","q": "Một lò xo có chiều dài tự nhiên $20\\ \\text{cm}$, độ cứng $150\\ \\text{N/m}$. Treo vật $0,6\\ \\text{kg}$ vào lò xo (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Độ dãn của lò xo bằng $4\\ \\text{cm}$.","b) Chiều dài của lò xo lúc này bằng $24\\ \\text{cm}$.","c) Lực đàn hồi của lò xo bằng $6\\ \\text{N}$.","d) Nếu treo thêm vật $0,6\\ \\text{kg}$ nữa thì độ dãn tăng gấp đôi."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $\\Delta l = 6/150 = 0,04\\ \\text{m}$. b) Đúng: $20 + 4 = 24\\ \\text{cm}$. c) Đúng: cân bằng với trọng lực. d) Đúng: $\\Delta l \\propto F$.","points": 1},{"type": "short","level": "VD","q": "Một lò xo khi treo vật $200\\ \\text{g}$ thì dãn $2\\ \\text{cm}$; khi treo thêm vật nữa thì dãn tổng cộng $5\\ \\text{cm}$ (trong giới hạn đàn hồi, $g = 10\\ \\text{m/s}^2$). Khối lượng vật treo thêm bằng bao nhiêu gam? (chỉ điền số)","answer": "300","explain": "$\\Delta l \\propto m$: $m_{tổng} = 200 \\cdot 5/2 = 500\\ \\text{g}$. Treo thêm $300\\ \\text{g}$.","points": 0.5},{"type": "short","level": "VDC","q": "Hai lò xo có độ cứng $k_1 = 100\\ \\text{N/m}$, $k_2 = 200\\ \\text{N/m}$ mắc nối tiếp. Độ cứng tương đương của hệ bằng bao nhiêu N/m? (chỉ điền số, làm tròn đến 1 chữ số thập phân)","answer": "66.7","explain": "$1/k = 1/100 + 1/200 = 3/200$, $k = 200/3 \\approx 66,7\\ \\text{N/m}$.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "NB","q": "Các dạng biến dạng của vật rắn gồm","options": ["A. kéo, nén, uốn, xoắn, cắt.","B. chỉ có kéo và nén.","C. nóng chảy và đông đặc.","D. dãn nở và co lại."],"answer": "A","explain": "Các dạng biến dạng cơ bản.","points": 0.25},{"type": "mcq","level": "NB","q": "Lực đàn hồi xuất hiện khi","options": ["A. vật bị biến dạng đàn hồi.","B. vật chuyển động.","C. vật đứng yên.","D. vật bị nung nóng."],"answer": "A","explain": "Lực đàn hồi chống lại biến dạng.","points": 0.25},{"type": "mcq","level": "NB","q": "Giới hạn đàn hồi là","options": ["A. giới hạn mà trong đó vật còn giữ được tính đàn hồi.","B. lực lớn nhất có thể tác dụng lên vật.","C. độ dãn lớn nhất của lò xo.","D. nhiệt độ nóng chảy của vật."],"answer": "A","explain": "Định nghĩa giới hạn đàn hồi.","points": 0.25},{"type": "mcq","level": "NB","q": "Độ cứng của lò xo","options": ["A. đặc trưng cho khả năng chống lại biến dạng của lò xo.","B. bằng khối lượng của lò xo.","C. bằng chiều dài của lò xo.","D. không phụ thuộc vào vật liệu."],"answer": "A","explain": "Ý nghĩa của độ cứng k.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có độ cứng $50\\ \\text{N/m}$. Lực cần thiết để nén lò xo $6\\ \\text{cm}$ bằng","options": ["A. $3\\ \\text{N}$.","B. $0,12\\ \\text{N}$.","C. $833\\ \\text{N}$.","D. $300\\ \\text{N}$."],"answer": "A","explain": "$F = 50 \\cdot 0,06 = 3\\ \\text{N}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo dãn $8\\ \\text{cm}$ khi chịu lực kéo $4\\ \\text{N}$. Độ cứng của lò xo bằng","options": ["A. $50\\ \\text{N/m}$.","B. $0,5\\ \\text{N/m}$.","C. $32\\ \\text{N/m}$.","D. $2\\ \\text{N/m}$."],"answer": "A","explain": "$k = 4/0,08 = 50\\ \\text{N/m}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khi lò xo bị nén, lực đàn hồi có hướng chống lại sự nén.","b) Độ lớn lực đàn hồi tính bằng $k|\\Delta l|$.","c) $|\\Delta l|$ là độ biến dạng của lò xo.","d) Định luật Hooke đúng với mọi độ biến dạng."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: chỉ đúng trong giới hạn đàn hồi.","points": 1},{"type": "truefalse","level": "VD","q": "Một lò xo nhẹ có độ cứng $200\\ \\text{N/m}$, chiều dài tự nhiên $25\\ \\text{cm}$, đặt trên mặt phẳng ngang. Tác dụng lực $10\\ \\text{N}$ nén lò xo. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Độ nén của lò xo bằng $5\\ \\text{cm}$.","b) Chiều dài của lò xo lúc này bằng $20\\ \\text{cm}$.","c) Lực đàn hồi của lò xo bằng $10\\ \\text{N}$.","d) Nếu tăng lực nén lên gấp đôi thì độ nén tăng gấp đôi."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $\\Delta l = 10/200 = 0,05\\ \\text{m}$. b) Đúng: $25 - 5 = 20\\ \\text{cm}$. c) Đúng. d) Đúng.","points": 1},{"type": "short","level": "VD","q": "Một lò xo có độ cứng $80\\ \\text{N/m}$. Khi treo vật nặng, lò xo dãn $7,5\\ \\text{cm}$ (lấy $g = 10\\ \\text{m/s}^2$). Khối lượng của vật bằng bao nhiêu gam? (chỉ điền số)","answer": "600","explain": "$F = 80 \\cdot 0,075 = 6\\ \\text{N} = mg$, $m = 0,6\\ \\text{kg} = 600\\ \\text{g}$.","points": 0.5},{"type": "short","level": "VDC","q": "Hai lò xo có độ cứng $k_1 = 120\\ \\text{N/m}$, $k_2 = 180\\ \\text{N/m}$ mắc song song. Độ cứng tương đương của hệ bằng bao nhiêu N/m? (chỉ điền số)","answer": "300","explain": "$k = k_1 + k_2 = 300\\ \\text{N/m}$.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Khi lò xo bị kéo dãn, lực đàn hồi của lò xo","options": ["A. hướng vào trong, chống lại sự dãn.","B. hướng ra ngoài, cùng chiều dãn.","C. bằng 0.","D. hướng thẳng đứng xuống."],"answer": "A","explain": "Lực đàn hồi ngược chiều biến dạng.","points": 0.25},{"type": "mcq","level": "NB","q": "Biến dạng dẻo là biến dạng mà","options": ["A. vật không trở lại hình dạng ban đầu khi thôi tác dụng lực.","B. vật trở lại hình dạng ban đầu khi thôi tác dụng lực.","C. chỉ xảy ra với lò xo.","D. không làm thay đổi hình dạng vật."],"answer": "A","explain": "Định nghĩa biến dạng dẻo.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong công thức $F = k|\\Delta l|$, $|\\Delta l|$ là","options": ["A. độ biến dạng của lò xo.","B. chiều dài của lò xo.","C. khối lượng của lò xo.","D. độ cứng của lò xo."],"answer": "A","explain": "$|\\Delta l|$ là độ dãn (nén).","points": 0.25},{"type": "mcq","level": "NB","q": "Một lò xo có độ cứng càng lớn thì","options": ["A. càng khó bị biến dạng.","B. càng dễ bị biến dạng.","C. càng dài.","D. càng nhẹ."],"answer": "A","explain": "k lớn nghĩa là cứng, khó biến dạng.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo dãn $5\\ \\text{cm}$ khi treo vật $300\\ \\text{g}$ (lấy $g = 10\\ \\text{m/s}^2$). Độ cứng của lò xo bằng","options": ["A. $60\\ \\text{N/m}$.","B. $15\\ \\text{N/m}$.","C. $6\\ \\text{N/m}$.","D. $1500\\ \\text{N/m}$."],"answer": "A","explain": "$k = 3/0,05 = 60\\ \\text{N/m}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Phải treo vật có khối lượng bao nhiêu vào lò xo có độ cứng $40\\ \\text{N/m}$ để nó dãn $10\\ \\text{cm}$? (lấy $g = 10\\ \\text{m/s}^2$)","options": ["A. $400\\ \\text{g}$.","B. $4\\ \\text{kg}$.","C. $40\\ \\text{g}$.","D. $25\\ \\text{g}$."],"answer": "A","explain": "$F = 40 \\cdot 0,1 = 4\\ \\text{N}$, $m = 0,4\\ \\text{kg} = 400\\ \\text{g}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lực đàn hồi luôn ngược chiều với biến dạng.","b) Lò xo bị dãn càng nhiều thì lực đàn hồi càng lớn (trong giới hạn đàn hồi).","c) Hai lò xo cùng chất liệu, lò xo dài hơn thì cứng hơn.","d) Cắt lò xo thành hai phần bằng nhau thì mỗi phần cứng gấp đôi lò xo ban đầu."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: lò xo dài hơn thì MỀM hơn. d) Đúng: độ cứng tỉ lệ nghịch với chiều dài.","points": 1},{"type": "truefalse","level": "VD","q": "Một lò xo có chiều dài tự nhiên $30\\ \\text{cm}$, độ cứng $100\\ \\text{N/m}$. Khi treo vật $m$, lò xo dài $34\\ \\text{cm}$ (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Độ dãn của lò xo bằng $4\\ \\text{cm}$.","b) Khối lượng $m$ bằng $400\\ \\text{g}$.","c) Lực đàn hồi của lò xo bằng $4\\ \\text{N}$.","d) Nếu thay bằng lò xo cứng gấp đôi thì độ dãn giảm một nửa."],"answer": ["T","T","T","T"],"explain": "a) Đúng. b) Đúng: $m = 4/10 = 0,4\\ \\text{kg}$. c) Đúng. d) Đúng: $\\Delta l = F/k$.","points": 1},{"type": "short","level": "VD","q": "Một lò xo khi chịu lực kéo $6\\ \\text{N}$ thì dãn $3\\ \\text{cm}$. Khi chịu lực kéo $10\\ \\text{N}$ thì độ dãn của lò xo bằng bao nhiêu cm? (chỉ điền số)","answer": "5","explain": "$\\Delta l \\propto F$: $\\Delta l = 3 \\cdot 10/6 = 5\\ \\text{cm}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một lò xo có độ cứng $k$, cắt thành 3 phần bằng nhau rồi mắc song song 3 phần đó. Độ cứng tương đương của hệ bằng bao nhiêu lần $k$? (chỉ điền số)","answer": "9","explain": "Mỗi phần có độ cứng $3k$. Mắc song song: $k_{td} = 3 \\cdot 3k = 9k$.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "NB","q": "Đơn vị của độ cứng lò xo là","options": ["A. $\\text{N/m}$.","B. $\\text{N} \\cdot \\text{m}$.","C. $\\text{kg/m}$.","D. $\\text{m/N}$."],"answer": "A","explain": "Đơn vị N/m.","points": 0.25},{"type": "mcq","level": "NB","q": "Dây cao su bị kéo dãn là ví dụ về","options": ["A. biến dạng đàn hồi.","B. biến dạng dẻo.","C. sự nóng chảy.","D. sự bay hơi."],"answer": "A","explain": "Dây cao su trở lại hình dạng ban đầu.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi vượt quá giới hạn đàn hồi, vật rắn thường bị","options": ["A. biến dạng dẻo hoặc bị phá hủy.","B. trở lại hình dạng ban đầu.","C. co lại.","D. nhẹ đi."],"answer": "A","explain": "Mất tính đàn hồi.","points": 0.25},{"type": "mcq","level": "TH","q": "Lực đàn hồi của lò xo không phụ thuộc vào","options": ["A. màu sắc của lò xo.","B. độ cứng của lò xo.","C. độ biến dạng của lò xo.","D. vật liệu làm lò xo (thông qua $k$)."],"answer": "A","explain": "Màu sắc không liên quan.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có chiều dài tự nhiên $15\\ \\text{cm}$, khi treo vật $250\\ \\text{g}$ thì dài $18\\ \\text{cm}$ (lấy $g = 10\\ \\text{m/s}^2$). Độ cứng của lò xo bằng","options": ["A. $\\frac{250}{3}\\ \\text{N/m} \\approx 83,3\\ \\text{N/m}$.","B. $45\\ \\text{N/m}$.","C. $750\\ \\text{N/m}$.","D. $13,9\\ \\text{N/m}$."],"answer": "A","explain": "$k = 2,5/0,03 \\approx 83,3\\ \\text{N/m}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có độ cứng $200\\ \\text{N/m}$, chiều dài tự nhiên $20\\ \\text{cm}$. Khi chịu lực nén $8\\ \\text{N}$, chiều dài của lò xo bằng","options": ["A. $16\\ \\text{cm}$.","B. $24\\ \\text{cm}$.","C. $12\\ \\text{cm}$.","D. $28\\ \\text{cm}$."],"answer": "A","explain": "$\\Delta l = 8/200 = 0,04\\ \\text{m} = 4\\ \\text{cm}$. $l = 20 - 4 = 16\\ \\text{cm}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Định luật Hooke: trong giới hạn đàn hồi, lực đàn hồi tỉ lệ thuận với độ biến dạng.","b) Đồ thị lực đàn hồi theo độ biến dạng là đường thẳng qua gốc tọa độ.","c) Hệ số góc của đồ thị $F$ theo $|\\Delta l|$ chính là độ cứng $k$.","d) Ngoài giới hạn đàn hồi, lực đàn hồi vẫn tỉ lệ thuận với độ biến dạng."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai.","points": 1},{"type": "truefalse","level": "VD","q": "Hai lò xo $k_1 = 60\\ \\text{N/m}$, $k_2 = 90\\ \\text{N/m}$ mắc nối tiếp rồi treo vật $m$. Xét tính đúng, sai của các khẳng định sau (lấy $g = 10\\ \\text{m/s}^2$):","statements": ["a) Độ cứng tương đương của hệ bằng $36\\ \\text{N/m}$.","b) Với $m = 360\\ \\text{g}$, độ dãn của hệ bằng $10\\ \\text{cm}$.","c) Lực đàn hồi của mỗi lò xo bằng nhau.","d) Độ dãn của lò xo 1 lớn hơn của lò xo 2."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $1/k = 1/60 + 1/90 = 5/180$, $k = 36\\ \\text{N/m}$. b) Đúng: $\\Delta l = 3,6/36 = 0,1\\ \\text{m}$. c) Đúng: nối tiếp thì lực bằng nhau. d) Đúng: $\\Delta l_1 = F/k_1 \\gt \\Delta l_2$.","points": 1},{"type": "short","level": "VDC","q": "Một lò xo có độ cứng $120\\ \\text{N/m}$. Cắt lò xo thành hai phần với chiều dài tỉ lệ $1:2$. Độ cứng của phần ngắn bằng bao nhiêu N/m? (chỉ điền số)","answer": "360","explain": "Độ cứng tỉ lệ nghịch với chiều dài. Phần ngắn dài $1/3$ nên $k = 3 \\cdot 120 = 360\\ \\text{N/m}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một lò xo nhẹ đặt thẳng đứng, đầu trên cố định. Khi treo vật $100\\ \\text{g}$ thì lò xo dãn $2\\ \\text{cm}$; khi treo vật $300\\ \\text{g}$ thì lò xo dãn bao nhiêu cm? (lấy $g = 10\\ \\text{m/s}^2$, chỉ điền số)","answer": "6","explain": "$\\Delta l \\propto m$: $\\Delta l = 2 \\cdot 3 = 6\\ \\text{cm}$.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Biến dạng kéo xảy ra khi","options": ["A. vật chịu tác dụng của hai lực kéo ngược chiều nhau.","B. vật chịu tác dụng của hai lực nén.","C. vật bị uốn cong.","D. vật bị xoắn."],"answer": "A","explain": "Định nghĩa biến dạng kéo.","points": 0.25},{"type": "mcq","level": "NB","q": "Lò xo trong bút bi là ứng dụng của","options": ["A. lực đàn hồi.","B. lực ma sát.","C. trọng lực.","D. lực quán tính."],"answer": "A","explain": "Lò xo đàn hồi đẩy ruột bút.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi lò xo bị nén, lực đàn hồi","options": ["A. hướng ra ngoài, chống lại sự nén.","B. hướng vào trong, cùng chiều nén.","C. bằng 0.","D. hướng xuống dưới."],"answer": "A","explain": "Ngược chiều biến dạng.","points": 0.25},{"type": "mcq","level": "TH","q": "Độ biến dạng của lò xo được tính bằng","options": ["A. $|\\Delta l| = |l - l_0|$.","B. $|\\Delta l| = l + l_0$.","C. $|\\Delta l| = l \\cdot l_0$.","D. $|\\Delta l| = \\frac{l}{l_0}$."],"answer": "A","explain": "Độ chênh lệch chiều dài.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có độ cứng $150\\ \\text{N/m}$. Để lò xo dãn $12\\ \\text{cm}$ cần lực kéo bằng","options": ["A. $18\\ \\text{N}$.","B. $1,8\\ \\text{N}$.","C. $1250\\ \\text{N}$.","D. $1800\\ \\text{N}$."],"answer": "A","explain": "$F = 150 \\cdot 0,12 = 18\\ \\text{N}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Treo quả cân $400\\ \\text{g}$ vào lò xo thì lò xo dài $22\\ \\text{cm}$; treo quả cân $600\\ \\text{g}$ thì lò xo dài $24\\ \\text{cm}$ (lấy $g = 10\\ \\text{m/s}^2$). Độ cứng của lò xo bằng","options": ["A. $100\\ \\text{N/m}$.","B. $50\\ \\text{N/m}$.","C. $200\\ \\text{N/m}$.","D. $20\\ \\text{N/m}$."],"answer": "A","explain": "$\\Delta F = 2\\ \\text{N}$ ứng với $\\Delta l = 0,02\\ \\text{m}$, $k = 100\\ \\text{N/m}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lò xo càng dài (cùng tiết diện, vật liệu) thì càng mềm.","b) Lò xo có tiết diện dây càng lớn thì càng cứng.","c) Độ cứng của lò xo không phụ thuộc vào vật liệu.","d) Hai lò xo giống hệt nhau mắc song song thì hệ cứng gấp đôi mỗi lò xo."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: phụ thuộc vật liệu. d) Đúng: $k_{td} = 2k$.","points": 1},{"type": "truefalse","level": "VD","q": "Một lò xo có độ cứng $80\\ \\text{N/m}$, chiều dài tự nhiên $18\\ \\text{cm}$, treo thẳng đứng. Móc vật $0,32\\ \\text{kg}$ vào đầu dưới (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Độ dãn của lò xo bằng $4\\ \\text{cm}$.","b) Chiều dài lò xo lúc cân bằng bằng $22\\ \\text{cm}$.","c) Nếu nhúng vật vào nước (lực đẩy Archimedes $1,2\\ \\text{N}$) thì độ dãn còn $2,5\\ \\text{cm}$.","d) Lực đàn hồi cực đại mà lò xo chịu được là vô hạn."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $\\Delta l = 3,2/80 = 0,04\\ \\text{m}$. b) Đúng. c) Đúng: $F = 3,2 - 1,2 = 2\\ \\text{N}$, $\\Delta l = 2/80 = 0,025\\ \\text{m}$. d) Sai: giới hạn bởi giới hạn đàn hồi.","points": 1},{"type": "short","level": "VDC","q": "Một lò xo dãn $4\\ \\text{cm}$ khi treo vật $m_1$; dãn $10\\ \\text{cm}$ khi treo vật $m_1 + 300\\ \\text{g}$ (trong giới hạn đàn hồi). Khối lượng $m_1$ bằng bao nhiêu gam? (chỉ điền số)","answer": "200","explain": "$\\Delta l \\propto m$: $m_1/4 = (m_1 + 300)/10$, $10m_1 = 4m_1 + 1200$, $m_1 = 200\\ \\text{g}$.","points": 0.5},{"type": "short","level": "VDC","q": "Ba lò xo giống nhau, mỗi lò xo có độ cứng $k = 90\\ \\text{N/m}$, mắc song song rồi treo vật $m$. Hệ dãn $5\\ \\text{cm}$ (lấy $g = 10\\ \\text{m/s}^2$). Khối lượng $m$ bằng bao nhiêu gam? (chỉ điền số)","answer": "1350","explain": "$k_{td} = 270\\ \\text{N/m}$. $F = 270 \\cdot 0,05 = 13,5\\ \\text{N}$, $m = 1,35\\ \\text{kg} = 1350\\ \\text{g}$.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Vật nào sau đây có tính đàn hồi tốt?","options": ["A. Lò xo thép.","B. Cục đất sét.","C. Miếng kẹo cao su đã nhai.","D. Tờ giấy ướt."],"answer": "A","explain": "Lò xo thép đàn hồi tốt.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi nói về lực đàn hồi, phát biểu nào sai?","options": ["A. Lực đàn hồi luôn cùng chiều với biến dạng.","B. Lực đàn hồi ngược chiều biến dạng.","C. Lực đàn hồi xuất hiện khi vật bị biến dạng đàn hồi.","D. Trong giới hạn đàn hồi, lực đàn hồi tỉ lệ với độ biến dạng."],"answer": "A","explain": "Lực đàn hồi NGƯỢC chiều biến dạng.","points": 0.25},{"type": "mcq","level": "NB","q": "Một sợi dây thép bị kéo dãn một chút rồi trở lại như cũ khi thôi kéo. Đây là","options": ["A. biến dạng đàn hồi.","B. biến dạng dẻo.","C. sự đứt gãy.","D. sự nóng chảy."],"answer": "A","explain": "Trở lại hình dạng ban đầu.","points": 0.25},{"type": "mcq","level": "TH","q": "Hai lò xo $k_1 \\lt k_2$. Với cùng một lực tác dụng,","options": ["A. lò xo 1 dãn nhiều hơn lò xo 2.","B. lò xo 2 dãn nhiều hơn lò xo 1.","C. hai lò xo dãn như nhau.","D. không so sánh được."],"answer": "A","explain": "$\\Delta l = F/k$, $k$ nhỏ thì $\\Delta l$ lớn.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có độ cứng $60\\ \\text{N/m}$, chiều dài tự nhiên $25\\ \\text{cm}$. Khi kéo bằng lực $9\\ \\text{N}$, chiều dài của lò xo bằng","options": ["A. $40\\ \\text{cm}$.","B. $34\\ \\text{cm}$.","C. $10\\ \\text{cm}$.","D. $16\\ \\text{cm}$."],"answer": "A","explain": "$\\Delta l = 9/60 = 0,15\\ \\text{m} = 15\\ \\text{cm}$. $l = 40\\ \\text{cm}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo bị nén $5\\ \\text{cm}$ thì lực đàn hồi bằng $10\\ \\text{N}$. Độ cứng của lò xo bằng","options": ["A. $200\\ \\text{N/m}$.","B. $50\\ \\text{N/m}$.","C. $2\\ \\text{N/m}$.","D. $500\\ \\text{N/m}$."],"answer": "A","explain": "$k = 10/0,05 = 200\\ \\text{N/m}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Mọi vật rắn đều có tính đàn hồi.","b) Lò xo chỉ có thể bị kéo dãn, không thể bị nén.","c) Khi thôi tác dụng lực, vật đàn hồi trở về hình dạng ban đầu.","d) Vượt quá giới hạn đàn hồi, vật bị biến dạng dẻo."],"answer": ["T","F","T","T"],"explain": "a) Đúng (mức độ khác nhau). b) Sai: lò xo nén được. c) Đúng. d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Một lò xo đặt nằm ngang, một đầu cố định, đầu còn lại gắn vật $0,2\\ \\text{kg}$ trên mặt ngang không ma sát. Kéo vật ra khỏi vị trí cân bằng $6\\ \\text{cm}$ rồi thả nhẹ; khi vật qua vị trí lò xo dãn $3\\ \\text{cm}$ thì lực đàn hồi bằng $1,2\\ \\text{N}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Độ cứng của lò xo bằng $40\\ \\text{N/m}$.","b) Khi vật ở vị trí biên ($6\\ \\text{cm}$), lực đàn hồi bằng $2,4\\ \\text{N}$.","c) Khi vật qua vị trí cân bằng, lực đàn hồi bằng 0.","d) Lực đàn hồi cực đại trong quá trình chuyển động bằng $1,2\\ \\text{N}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $k = 1,2/0,03 = 40\\ \\text{N/m}$. b) Đúng: $F = 40 \\cdot 0,06 = 2,4\\ \\text{N}$. c) Đúng. d) Sai: cực đại $2,4\\ \\text{N}$ ở biên.","points": 1},{"type": "short","level": "VDC","q": "Một lò xo có chiều dài tự nhiên $l_0$. Khi treo vật $200\\ \\text{g}$ thì dài $24\\ \\text{cm}$; khi treo vật $500\\ \\text{g}$ thì dài $30\\ \\text{cm}$ (lấy $g = 10\\ \\text{m/s}^2$). Chiều dài tự nhiên $l_0$ bằng bao nhiêu cm? (chỉ điền số)","answer": "20","explain": "$\\Delta l = 6\\ \\text{cm}$ ứng với $\\Delta m = 300\\ \\text{g}$. Với $200\\ \\text{g}$: $\\Delta l = 4\\ \\text{cm}$. $l_0 = 24 - 4 = 20\\ \\text{cm}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một lò xo có độ cứng $100\\ \\text{N/m}$ được cắt thành hai phần dài bằng nhau, sau đó mắc nối tiếp hai phần này. Độ cứng của hệ bằng bao nhiêu N/m? (chỉ điền số)","answer": "100","explain": "Mỗi phần: $k' = 200\\ \\text{N/m}$. Nối tiếp: $1/k_{td} = 2/200$, $k_{td} = 100\\ \\text{N/m}$.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Biến dạng nén xảy ra khi","options": ["A. vật chịu tác dụng của hai lực ép vào từ hai phía.","B. vật chịu tác dụng của hai lực kéo ra.","C. vật bị bẻ cong.","D. vật bị xoắn."],"answer": "A","explain": "Định nghĩa biến dạng nén.","points": 0.25},{"type": "mcq","level": "NB","q": "Lực đàn hồi của lò xo có đặc điểm","options": ["A. tỉ lệ thuận với độ biến dạng trong giới hạn đàn hồi.","B. không đổi khi độ biến dạng thay đổi.","C. tỉ lệ nghịch với độ biến dạng.","D. bằng 0 mọi lúc."],"answer": "A","explain": "Định luật Hooke.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật bị biến dạng nhưng khi thôi tác dụng lực thì giữ nguyên hình dạng mới. Đây là","options": ["A. biến dạng dẻo.","B. biến dạng đàn hồi.","C. biến dạng kéo.","D. không phải biến dạng."],"answer": "A","explain": "Định nghĩa biến dạng dẻo.","points": 0.25},{"type": "mcq","level": "TH","q": "Thước nhựa bị uốn cong rồi trở lại thẳng khi thôi uốn là ví dụ về","options": ["A. biến dạng đàn hồi.","B. biến dạng dẻo.","C. sự gãy.","D. sự nóng chảy."],"answer": "A","explain": "Trở lại hình dạng ban đầu.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có độ cứng $250\\ \\text{N/m}$. Lực đàn hồi của lò xo khi bị dãn $2\\ \\text{cm}$ bằng","options": ["A. $5\\ \\text{N}$.","B. $0,5\\ \\text{N}$.","C. $12500\\ \\text{N}$.","D. $500\\ \\text{N}$."],"answer": "A","explain": "$F = 250 \\cdot 0,02 = 5\\ \\text{N}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo khi treo vật $150\\ \\text{g}$ thì dãn $3\\ \\text{cm}$ (lấy $g = 10\\ \\text{m/s}^2$). Độ cứng của lò xo bằng","options": ["A. $50\\ \\text{N/m}$.","B. $450\\ \\text{N/m}$.","C. $5\\ \\text{N/m}$.","D. $45\\ \\text{N/m}$."],"answer": "A","explain": "$k = 1,5/0,03 = 50\\ \\text{N/m}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Trong giới hạn đàn hồi, đồ thị $F$ theo $|\\Delta l|$ là đường thẳng.","b) Ngoài giới hạn đàn hồi, vật có thể bị biến dạng dẻo.","c) Lò xo bị dãn quá mức có thể không trở lại chiều dài ban đầu.","d) Mọi lò xo đều có cùng giới hạn đàn hồi."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: phụ thuộc vật liệu, kích thước.","points": 1},{"type": "truefalse","level": "VD","q": "Một lò xo có độ cứng $k = 50\\ \\text{N/m}$, chiều dài tự nhiên $20\\ \\text{cm}$, treo thẳng đứng và móc vật $m = 250\\ \\text{g}$ (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Độ dãn của lò xo khi cân bằng bằng $5\\ \\text{cm}$.","b) Chiều dài lò xo khi cân bằng bằng $25\\ \\text{cm}$.","c) Nếu cắt bỏ một nửa chiều dài lò xo (giữ vật $m$) thì độ dãn còn $2,5\\ \\text{cm}$.","d) Nếu thay vật $500\\ \\text{g}$ thì lò xo dãn $10\\ \\text{cm}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $\\Delta l = 2,5/50 = 0,05\\ \\text{m}$. b) Đúng. c) Đúng: $k' = 100\\ \\text{N/m}$, $\\Delta l = 2,5/100 = 0,025\\ \\text{m}$. d) Đúng: $\\Delta l \\propto m$.","points": 1},{"type": "short","level": "VDC","q": "Một lò xo có độ cứng $90\\ \\text{N/m}$, khi treo vật $m$ thì dãn $5\\ \\text{cm}$ (lấy $g = 10\\ \\text{m/s}^2$). Khối lượng $m$ bằng bao nhiêu gam? (chỉ điền số)","answer": "450","explain": "$F = 90 \\cdot 0,05 = 4,5\\ \\text{N}$, $m = 0,45\\ \\text{kg} = 450\\ \\text{g}$.","points": 0.5},{"type": "short","level": "VDC","q": "Hai lò xo giống nhau, mỗi lò xo độ cứng $k_0$, mắc nối tiếp thành hệ có độ cứng $30\\ \\text{N/m}$. Giá trị $k_0$ bằng bao nhiêu N/m? (chỉ điền số)","answer": "60","explain": "Nối tiếp hai lò xo giống nhau: $k_{td} = k_0/2$, $k_0 = 60\\ \\text{N/m}$.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "NB","q": "Khi vật bị biến dạng đàn hồi, lực đàn hồi","options": ["A. xuất hiện để chống lại biến dạng.","B. làm tăng biến dạng.","C. không xuất hiện.","D. hướng cùng chiều biến dạng."],"answer": "A","explain": "Bản chất lực đàn hồi.","points": 0.25},{"type": "mcq","level": "NB","q": "Độ cứng $k$ của lò xo càng lớn thì với cùng độ biến dạng, lực đàn hồi","options": ["A. càng lớn.","B. càng nhỏ.","C. không đổi.","D. bằng 0."],"answer": "A","explain": "$F = k|\\Delta l|$.","points": 0.25},{"type": "mcq","level": "TH","q": "Biến dạng của dây đàn ghi ta khi gảy thuộc loại","options": ["A. biến dạng đàn hồi (uốn).","B. biến dạng dẻo.","C. biến dạng phá hủy.","D. không biến dạng."],"answer": "A","explain": "Dây trở lại vị trí cũ.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo ban đầu dài $l_0$, sau khi biến dạng dài $l$. Độ biến dạng được tính bằng","options": ["A. $|l - l_0|$.","B. $l + l_0$.","C. $l \\cdot l_0$.","D. $l^2 - l_0^2$."],"answer": "A","explain": "Giá trị tuyệt đối của độ chênh lệch.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có độ cứng $75\\ \\text{N/m}$. Khi lực đàn hồi bằng $6\\ \\text{N}$ thì độ biến dạng của lò xo bằng","options": ["A. $8\\ \\text{cm}$.","B. $0,08\\ \\text{cm}$.","C. $450\\ \\text{cm}$.","D. $12,5\\ \\text{cm}$."],"answer": "A","explain": "$|\\Delta l| = 6/75 = 0,08\\ \\text{m} = 8\\ \\text{cm}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một lò xo dài $28\\ \\text{cm}$ khi treo vật $300\\ \\text{g}$ và dài $32\\ \\text{cm}$ khi treo vật $500\\ \\text{g}$ (lấy $g = 10\\ \\text{m/s}^2$). Chiều dài tự nhiên của lò xo bằng","options": ["A. $22\\ \\text{cm}$.","B. $24\\ \\text{cm}$.","C. $26\\ \\text{cm}$.","D. $20\\ \\text{cm}$."],"answer": "A","explain": "$\\Delta l = 4\\ \\text{cm}$ ứng với $\\Delta m = 200\\ \\text{g}$. Với $300\\ \\text{g}$: $\\Delta l = 6\\ \\text{cm}$. $l_0 = 28 - 6 = 22\\ \\text{cm}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lực kế hoạt động dựa trên định luật Hooke.","b) Giảm xóc xe máy dùng lò xo để hấp thụ chấn động.","c) Lò xo trong bút bi giúp ruột bút thụt vào khi bấm.","d) Định luật Hooke chỉ đúng với lò xo kim loại."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: đúng với mọi vật đàn hồi trong giới hạn đàn hồi.","points": 1},{"type": "truefalse","level": "VDC","q": "Một lò xo có chiều dài tự nhiên $16\\ \\text{cm}$, độ cứng $120\\ \\text{N/m}$, đặt trên mặt ngang và bị nén bởi lực $7,2\\ \\text{N}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Độ nén của lò xo bằng $6\\ \\text{cm}$.","b) Chiều dài của lò xo lúc này bằng $10\\ \\text{cm}$.","c) Nếu lực nén tăng lên $14,4\\ \\text{N}$ thì độ nén tăng gấp đôi.","d) Lực đàn hồi của lò xo khi bị nén $6\\ \\text{cm}$ bằng $7,2\\ \\text{N}$ và hướng ra ngoài."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $\\Delta l = 7,2/120 = 0,06\\ \\text{m}$. b) Đúng: $16 - 6 = 10\\ \\text{cm}$. c) Đúng. d) Đúng: chống lại sự nén.","points": 1},{"type": "short","level": "VDC","q": "Một lò xo có độ cứng $200\\ \\text{N/m}$, treo vật $m$ thì dãn $4\\ \\text{cm}$ (lấy $g = 10\\ \\text{m/s}^2$). Khối lượng $m$ bằng bao nhiêu gam? (chỉ điền số)","answer": "800","explain": "$F = 200 \\cdot 0,04 = 8\\ \\text{N}$, $m = 0,8\\ \\text{kg} = 800\\ \\text{g}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một lò xo có độ cứng $k_0 = 80\\ \\text{N/m}$. Cắt lò xo thành 4 phần bằng nhau rồi mắc song song cả 4 phần. Độ cứng tương đương bằng bao nhiêu N/m? (chỉ điền số)","answer": "1280","explain": "Mỗi phần: $k = 4k_0 = 320\\ \\text{N/m}$. Song song 4 phần: $k_{td} = 4 \\cdot 320 = 1280\\ \\text{N/m}$.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Lò xo bị biến dạng đàn hồi khi","options": ["A. ngoại lực tác dụng không vượt quá giới hạn đàn hồi.","B. ngoại lực rất lớn.","C. nhiệt độ cao.","D. để lâu ngày."],"answer": "A","explain": "Điều kiện biến dạng đàn hồi.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong giới hạn đàn hồi, khi độ biến dạng tăng gấp đôi thì lực đàn hồi","options": ["A. tăng gấp đôi.","B. tăng gấp bốn.","C. giảm một nửa.","D. không đổi."],"answer": "A","explain": "$F \\propto |\\Delta l|$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có $k = 100\\ \\text{N/m}$. Khi dãn $1\\ \\text{cm}$, lực đàn hồi bằng","options": ["A. $1\\ \\text{N}$.","B. $100\\ \\text{N}$.","C. $0,01\\ \\text{N}$.","D. $10000\\ \\text{N}$."],"answer": "A","explain": "$F = 100 \\cdot 0,01 = 1\\ \\text{N}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Vật liệu nào sau đây khó bị biến dạng đàn hồi nhất (cứng nhất)?","options": ["A. Thép.","B. Cao su.","C. Đất sét.","D. Sáp ong."],"answer": "A","explain": "Thép có độ cứng cao.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có độ cứng $45\\ \\text{N/m}$. Treo vật $270\\ \\text{g}$ (lấy $g = 10\\ \\text{m/s}^2$) thì lò xo dãn","options": ["A. $6\\ \\text{cm}$.","B. $0,6\\ \\text{cm}$.","C. $12150\\ \\text{cm}$.","D. $16,7\\ \\text{cm}$."],"answer": "A","explain": "$\\Delta l = 2,7/45 = 0,06\\ \\text{m} = 6\\ \\text{cm}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một lò xo dài $30\\ \\text{cm}$ khi không treo vật; khi treo vật $400\\ \\text{g}$ thì dài $35\\ \\text{cm}$ (lấy $g = 10\\ \\text{m/s}^2$). Độ cứng của lò xo bằng","options": ["A. $80\\ \\text{N/m}$.","B. $114\\ \\text{N/m}$.","C. $8\\ \\text{N/m}$.","D. $1400\\ \\text{N/m}$."],"answer": "A","explain": "$k = 4/0,05 = 80\\ \\text{N/m}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lực đàn hồi xuất hiện ở hai đầu lò xo khi lò xo bị biến dạng.","b) Lực đàn hồi có xu hướng đưa lò xo về trạng thái không biến dạng.","c) Khi lò xo bị kéo dãn, lực đàn hồi ở hai đầu hướng ra ngoài.","d) Lực đàn hồi của lò xo không bao giờ vượt quá giới hạn đàn hồi."],"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng. c) Sai: hướng VÀO trong. d) Sai: có thể vượt quá (khi đó mất tính đàn hồi).","points": 1},{"type": "truefalse","level": "VDC","q": "Một lò xo treo thẳng đứng có độ cứng $60\\ \\text{N/m}$, chiều dài tự nhiên $24\\ \\text{cm}$. Treo vật $0,36\\ \\text{kg}$ (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Độ dãn của lò xo bằng $6\\ \\text{cm}$.","b) Chiều dài lò xo khi cân bằng bằng $30\\ \\text{cm}$.","c) Kéo vật xuống thêm $2\\ \\text{cm}$ rồi thả, lực đàn hồi cực đại bằng $4,8\\ \\text{N}$.","d) Khi vật ở vị trí cao nhất (lò xo dãn $4\\ \\text{cm}$), lực đàn hồi bằng $2,4\\ \\text{N}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $\\Delta l = 3,6/60 = 0,06\\ \\text{m}$. b) Đúng. c) Đúng: $\\Delta l_{max} = 8\\ \\text{cm}$, $F = 60 \\cdot 0,08 = 4,8\\ \\text{N}$. d) Đúng: $F = 60 \\cdot 0,04 = 2,4\\ \\text{N}$.","points": 1},{"type": "short","level": "VDC","q": "Hai lò xo $k_1 = 40\\ \\text{N/m}$, $k_2 = 60\\ \\text{N/m}$ mắc nối tiếp, treo vật $m$. Hệ dãn $12,5\\ \\text{cm}$ (lấy $g = 10\\ \\text{m/s}^2$). Khối lượng $m$ bằng bao nhiêu gam? (chỉ điền số)","answer": "300","explain": "$k_{td} = 24\\ \\text{N/m}$. $F = 24 \\cdot 0,125 = 3\\ \\text{N}$, $m = 300\\ \\text{g}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một lò xo có độ cứng $k_0$. Khi cắt đi $1/3$ chiều dài thì phần còn lại có độ cứng bằng bao nhiêu lần $k_0$? (chỉ điền số, dạng thập phân)","answer": "1.5","explain": "Phần còn lại dài $2/3$ nên $k = k_0/(2/3) = 1,5k_0$.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Định luật Hooke mô tả mối quan hệ giữa","options": ["A. lực đàn hồi và độ biến dạng (trong giới hạn đàn hồi).","B. khối lượng và trọng lượng.","C. áp suất và thể tích.","D. nhiệt độ và thể tích."],"answer": "A","explain": "Nội dung định luật Hooke.","points": 0.25},{"type": "mcq","level": "NB","q": "Một lò xo có chiều dài tự nhiên $l_0 = 20\\ \\text{cm}$. Khi dãn $5\\ \\text{cm}$, chiều dài của lò xo bằng","options": ["A. $25\\ \\text{cm}$.","B. $15\\ \\text{cm}$.","C. $100\\ \\text{cm}$.","D. $4\\ \\text{cm}$."],"answer": "A","explain": "$l = 20 + 5 = 25\\ \\text{cm}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có chiều dài tự nhiên $l_0 = 20\\ \\text{cm}$. Khi bị nén $4\\ \\text{cm}$, chiều dài của lò xo bằng","options": ["A. $16\\ \\text{cm}$.","B. $24\\ \\text{cm}$.","C. $80\\ \\text{cm}$.","D. $5\\ \\text{cm}$."],"answer": "A","explain": "$l = 20 - 4 = 16\\ \\text{cm}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Lực kế lò xo dùng để đo","options": ["A. lực.","B. khối lượng.","C. chiều dài.","D. thời gian."],"answer": "A","explain": "Lực kế đo lực dựa trên định luật Hooke.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có độ cứng $110\\ \\text{N/m}$. Khi treo vật $550\\ \\text{g}$ (lấy $g = 10\\ \\text{m/s}^2$), độ dãn của lò xo bằng","options": ["A. $5\\ \\text{cm}$.","B. $0,5\\ \\text{cm}$.","C. $605\\ \\text{cm}$.","D. $20\\ \\text{cm}$."],"answer": "A","explain": "$\\Delta l = 5,5/110 = 0,05\\ \\text{m} = 5\\ \\text{cm}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một lò xo khi chịu lực $8\\ \\text{N}$ thì dãn $4\\ \\text{cm}$. Độ cứng của lò xo bằng","options": ["A. $200\\ \\text{N/m}$.","B. $32\\ \\text{N/m}$.","C. $2\\ \\text{N/m}$.","D. $0,5\\ \\text{N/m}$."],"answer": "A","explain": "$k = 8/0,04 = 200\\ \\text{N/m}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Độ cứng của lò xo phụ thuộc vào vật liệu làm lò xo.","b) Độ cứng của lò xo phụ thuộc vào kích thước của lò xo.","c) Hai lò xo làm bằng cùng vật liệu thì có cùng độ cứng.","d) Lò xo nhẹ (khối lượng nhỏ) thì luôn mềm."],"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng. c) Sai: còn phụ thuộc kích thước. d) Sai: không liên quan.","points": 1},{"type": "truefalse","level": "VDC","q": "Một lò xo có độ cứng $150\\ \\text{N/m}$, chiều dài tự nhiên $22\\ \\text{cm}$, treo thẳng đứng. Khi treo vật $0,45\\ \\text{kg}$ (lấy $g = 10\\ \\text{m/s}^2$), xét tính đúng, sai của các khẳng định sau:","statements": ["a) Độ dãn của lò xo bằng $3\\ \\text{cm}$.","b) Chiều dài của lò xo bằng $25\\ \\text{cm}$.","c) Lực đàn hồi của lò xo bằng $4,5\\ \\text{N}$.","d) Nếu treo vật $0,9\\ \\text{kg}$ thì lò xo dãn $6\\ \\text{cm}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $\\Delta l = 4,5/150 = 0,03\\ \\text{m}$. b) Đúng. c) Đúng. d) Đúng.","points": 1},{"type": "short","level": "VDC","q": "Một lò xo có độ cứng $70\\ \\text{N/m}$, chiều dài tự nhiên $20\\ \\text{cm}$. Muốn lò xo dài $26\\ \\text{cm}$ cần treo vật có khối lượng bao nhiêu gam? (lấy $g = 10\\ \\text{m/s}^2$, chỉ điền số)","answer": "420","explain": "$\\Delta l = 0,06\\ \\text{m}$, $F = 70 \\cdot 0,06 = 4,2\\ \\text{N}$, $m = 420\\ \\text{g}$.","points": 0.5},{"type": "short","level": "VDC","q": "Hai lò xo $k_1 = 50\\ \\text{N/m}$, $k_2 = 150\\ \\text{N/m}$ mắc song song rồi treo vật $m = 400\\ \\text{g}$ (lấy $g = 10\\ \\text{m/s}^2$). Độ dãn của hệ bằng bao nhiêu cm? (chỉ điền số)","answer": "2","explain": "$k_{td} = 200\\ \\text{N/m}$. $\\Delta l = 4/200 = 0,02\\ \\text{m} = 2\\ \\text{cm}$.","points": 0.5}]}]}
