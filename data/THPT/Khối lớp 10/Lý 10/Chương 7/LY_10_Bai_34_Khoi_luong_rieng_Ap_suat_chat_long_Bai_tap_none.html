{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Khối lượng riêng của một chất được tính bằng","options": ["A. $\\rho = \\frac{m}{V}$.","B. $\\rho = \\frac{V}{m}$.","C. $\\rho = mV$.","D. $\\rho = \\frac{m}{V^2}$."],"answer": "A","explain": "Định nghĩa khối lượng riêng.","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị của khối lượng riêng trong hệ SI là","options": ["A. $\\text{kg/m}^3$.","B. $\\text{g/cm}^3$.","C. $\\text{N/m}^3$.","D. $\\text{kg} \\cdot \\text{m}^3$."],"answer": "A","explain": "Đơn vị SI: kg/m³.","points": 0.25},{"type": "mcq","level": "NB","q": "Áp suất được tính bằng","options": ["A. $p = \\frac{F}{S}$.","B. $p = \\frac{S}{F}$.","C. $p = FS$.","D. $p = \\frac{F^2}{S}$."],"answer": "A","explain": "Định nghĩa áp suất.","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị của áp suất trong hệ SI là","options": ["A. paxcan (Pa).","B. niutơn (N).","C. jun (J).","D. oát (W)."],"answer": "A","explain": "$1\\ \\text{Pa} = 1\\ \\text{N/m}^2$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một khối kim loại có khối lượng $780\\ \\text{g}$, thể tích $100\\ \\text{cm}^3$. Khối lượng riêng của kim loại bằng","options": ["A. $7800\\ \\text{kg/m}^3$.","B. $7,8\\ \\text{kg/m}^3$.","C. $780\\ \\text{kg/m}^3$.","D. $0,78\\ \\text{kg/m}^3$."],"answer": "A","explain": "$\\rho = 7,8\\ \\text{g/cm}^3 = 7800\\ \\text{kg/m}^3$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người nặng $600\\ \\text{N}$ đứng bằng hai chân, diện tích tiếp xúc mỗi bàn chân là $150\\ \\text{cm}^2$. Áp suất của người lên mặt đất bằng","options": ["A. $20000\\ \\text{Pa}$.","B. $4\\ \\text{Pa}$.","C. $90000\\ \\text{Pa}$.","D. $2\\ \\text{Pa}$."],"answer": "A","explain": "$S = 0,03\\ \\text{m}^2$, $p = 600/0,03 = 20000\\ \\text{Pa}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khối lượng riêng cho biết khối lượng của một đơn vị thể tích chất đó.","b) $1\\ \\text{g/cm}^3 = 1000\\ \\text{kg/m}^3$.","c) Áp suất càng lớn khi diện tích bị ép càng lớn (cùng lực ép).","d) $1\\ \\text{Pa} = 1\\ \\text{N/m}^2$."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: $p = F/S$ nên $S$ càng lớn thì $p$ càng NHỎ. d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Một thợ lặn đang lặn ở độ sâu $10\\ \\text{m}$ trong nước biển ($\\rho = 1030\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Áp suất do nước biển gây ra ở độ sâu đó bằng $103000\\ \\text{Pa}$.","b) Áp suất tăng khi lặn sâu hơn.","c) Áp suất tại một điểm trong lòng chất lỏng phụ thuộc vào hình dạng của bình chứa.","d) Áp suất do nước gây ra không phụ thuộc vào diện tích màng nhĩ của thợ lặn."],"answer": ["T","T","F","T"],"explain": "a) Đúng: $p = 1030 \\cdot 10 \\cdot 10 = 103000\\ \\text{Pa}$. b) Đúng: $p = \\rho gh$. c) Sai: chỉ phụ thuộc $\\rho, g, h$. d) Đúng: $p$ không phụ thuộc $S$ (lực ép thì có).","points": 1},{"type": "short","level": "VD","q": "Một bể nước sâu $2,5\\ \\text{m}$ chứa đầy nước ($\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Áp suất của nước tại đáy bể bằng bao nhiêu Pa? (chỉ điền số)","answer": "25000","explain": "$p = 1000 \\cdot 10 \\cdot 2,5 = 25000\\ \\text{Pa}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một khối gỗ hình lập phương cạnh $10\\ \\text{cm}$ nổi trên mặt nước, phần chìm trong nước cao $6\\ \\text{cm}$ ($\\rho_{nước} = 1000\\ \\text{kg/m}^3$). Khối lượng riêng của gỗ bằng bao nhiêu $\\text{kg/m}^3$? (chỉ điền số)","answer": "600","explain": "Vật nổi: $P = F_A$, $\\rho_{gỗ} \\cdot V = \\rho_{nước} \\cdot V_{chìm}$, $\\rho_{gỗ} = 1000 \\cdot 0,6 = 600\\ \\text{kg/m}^3$.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "NB","q": "Áp suất chất lỏng tại một điểm ở độ sâu $h$ được tính bằng","options": ["A. $p = \\rho gh$.","B. $p = \\frac{\\rho g}{h}$.","C. $p = \\rho g + h$.","D. $p = \\frac{h}{\\rho g}$."],"answer": "A","explain": "Áp suất thủy tĩnh.","points": 0.25},{"type": "mcq","level": "NB","q": "Áp suất tại một điểm trong lòng chất lỏng đứng yên","options": ["A. tăng khi độ sâu tăng.","B. giảm khi độ sâu tăng.","C. không phụ thuộc độ sâu.","D. bằng 0 mọi nơi."],"answer": "A","explain": "$p = \\rho gh$.","points": 0.25},{"type": "mcq","level": "NB","q": "Hai chất lỏng có khối lượng riêng khác nhau. Ở cùng độ sâu, chất lỏng nào gây áp suất lớn hơn?","options": ["A. Chất lỏng có khối lượng riêng lớn hơn.","B. Chất lỏng có khối lượng riêng nhỏ hơn.","C. Hai chất gây áp suất bằng nhau.","D. Không xác định được."],"answer": "A","explain": "$p = \\rho gh$.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật có khối lượng riêng lớn hơn khối lượng riêng của nước thì khi thả vào nước sẽ","options": ["A. chìm xuống.","B. nổi lên.","C. lơ lửng.","D. tan ra."],"answer": "A","explain": "Vật chìm khi $\\rho_{vật} \\gt \\rho_{nước}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một thùng chứa đầy dầu ($\\rho = 800\\ \\text{kg/m}^3$) cao $1,5\\ \\text{m}$ ($g = 10\\ \\text{m/s}^2$). Áp suất của dầu tại đáy thùng bằng","options": ["A. $12000\\ \\text{Pa}$.","B. $1200\\ \\text{Pa}$.","C. $533\\ \\text{Pa}$.","D. $800\\ \\text{Pa}$."],"answer": "A","explain": "$p = 800 \\cdot 10 \\cdot 1,5 = 12000\\ \\text{Pa}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một khối gỗ $0,6\\ \\text{kg}$ có thể tích $10^{-3}\\ \\text{m}^3$. Khối lượng riêng của gỗ bằng","options": ["A. $600\\ \\text{kg/m}^3$.","B. $0,0006\\ \\text{kg/m}^3$.","C. $1667\\ \\text{kg/m}^3$.","D. $60\\ \\text{kg/m}^3$."],"answer": "A","explain": "$\\rho = 0,6/10^{-3} = 600\\ \\text{kg/m}^3$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Áp suất chất lỏng tác dụng theo mọi phương.","b) Tại cùng độ sâu, áp suất như nhau tại mọi điểm trong cùng chất lỏng đứng yên.","c) Áp suất khí quyển tác dụng theo mọi phương.","d) Càng lên cao, áp suất khí quyển càng tăng."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: càng lên cao áp suất khí quyển càng GIẢM.","points": 1},{"type": "truefalse","level": "VD","q": "Một pít-tông có diện tích $0,02\\ \\text{m}^2$ chịu lực ép $400\\ \\text{N}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Áp suất do pít-tông gây ra bằng $20000\\ \\text{Pa}$.","b) Nếu tăng diện tích lên gấp đôi (lực không đổi) thì áp suất giảm một nửa.","c) Nếu tăng lực ép lên gấp đôi thì áp suất tăng gấp đôi.","d) Áp suất không phụ thuộc vào lực ép."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $p = 400/0,02 = 20000\\ \\text{Pa}$. b) Đúng. c) Đúng. d) Sai: $p = F/S$.","points": 1},{"type": "short","level": "VD","q": "Một cột thủy ngân cao $76\\ \\text{cm}$ ($\\rho = 13600\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Áp suất do cột thủy ngân gây ra bằng bao nhiêu Pa? (chỉ điền số)","answer": "103360","explain": "$p = 13600 \\cdot 10 \\cdot 0,76 = 103360\\ \\text{Pa}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một tàu ngầm đang lặn ở độ sâu $50\\ \\text{m}$ trong nước biển ($\\rho = 1030\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Một cửa sổ của tàu có diện tích $0,4\\ \\text{m}^2$. Lực do nước biển tác dụng lên cửa sổ bằng bao nhiêu N? (chỉ điền số)","answer": "206000","explain": "$p = 1030 \\cdot 10 \\cdot 50 = 515000\\ \\text{Pa}$. $F = pS = 515000 \\cdot 0,4 = 206000\\ \\text{N}$.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Khối lượng riêng cho biết","options": ["A. khối lượng của một đơn vị thể tích chất đó.","B. thể tích của một đơn vị khối lượng.","C. trọng lượng của vật.","D. áp suất của chất lỏng."],"answer": "A","explain": "Ý nghĩa khối lượng riêng.","points": 0.25},{"type": "mcq","level": "NB","q": "$1\\ \\text{g/cm}^3$ bằng","options": ["A. $1000\\ \\text{kg/m}^3$.","B. $1\\ \\text{kg/m}^3$.","C. $100\\ \\text{kg/m}^3$.","D. $10\\ \\text{kg/m}^3$."],"answer": "A","explain": "Đổi đơn vị.","points": 0.25},{"type": "mcq","level": "NB","q": "Áp suất càng lớn khi","options": ["A. lực ép càng lớn (cùng diện tích).","B. diện tích bị ép càng lớn (cùng lực).","C. lực ép càng nhỏ.","D. vật càng nhẹ."],"answer": "A","explain": "$p = F/S$.","points": 0.25},{"type": "mcq","level": "NB","q": "Tại sao đập thủy điện thường được xây với chân đập dày hơn đỉnh đập?","options": ["A. Vì áp suất nước tăng theo độ sâu.","B. Vì nước ở đáy nhẹ hơn.","C. Vì thẩm mỹ.","D. Vì đỉnh đập chịu gió lớn."],"answer": "A","explain": "$p = \\rho gh$ tăng theo $h$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật có thể tích $0,5\\ \\text{m}^3$, khối lượng riêng $2500\\ \\text{kg/m}^3$. Khối lượng của vật bằng","options": ["A. $1250\\ \\text{kg}$.","B. $5000\\ \\text{kg}$.","C. $0,0002\\ \\text{kg}$.","D. $125\\ \\text{kg}$."],"answer": "A","explain": "$m = \\rho V = 1250\\ \\text{kg}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một xe tăng nặng $400000\\ \\text{N}$, diện tích tiếp xúc của hai dải xích là $4\\ \\text{m}^2$. Áp suất của xe lên mặt đất bằng","options": ["A. $100000\\ \\text{Pa}$.","B. $1600000\\ \\text{Pa}$.","C. $10\\ \\text{Pa}$.","D. $0,00001\\ \\text{Pa}$."],"answer": "A","explain": "$p = 400000/4 = 100000\\ \\text{Pa}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khối lượng riêng của một chất không đổi (cùng điều kiện).","b) Hai vật có cùng khối lượng thì có cùng khối lượng riêng.","c) Nước đá nổi trên nước vì khối lượng riêng của nước đá nhỏ hơn nước.","d) Áp suất là đại lượng vectơ."],"answer": ["T","F","T","F"],"explain": "a) Đúng: đặc trưng của chất. b) Sai: còn phụ thuộc thể tích. c) Đúng. d) Sai: áp suất là đại lượng vô hướng.","points": 1},{"type": "truefalse","level": "VD","q": "Một bình chứa hai chất lỏng không trộn lẫn: dầu ($\\rho = 800\\ \\text{kg/m}^3$) ở trên, nước ở dưới. Xét một điểm A trong lớp dầu cách mặt thoáng $0,3\\ \\text{m}$ và điểm B trong nước cách mặt phân cách $0,2\\ \\text{m}$ ($g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Áp suất tại A bằng $2400\\ \\text{Pa}$.","b) Áp suất tại B lớn hơn áp suất tại A.","c) Áp suất tại mặt phân cách dầu - nước bằng $2400\\ \\text{Pa}$.","d) Nếu thay dầu bằng thủy ngân thì áp suất tại A tăng lên."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $p_A = 800 \\cdot 10 \\cdot 0,3 = 2400\\ \\text{Pa}$. b) Đúng: $p_B = 2400 + 1000 \\cdot 10 \\cdot 0,2 = 4400\\ \\text{Pa}$. c) Đúng. d) Đúng: $\\rho$ lớn hơn.","points": 1},{"type": "short","level": "VD","q": "Một hồ bơi sâu $1,8\\ \\text{m}$ chứa đầy nước ($\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Áp suất của nước tại điểm cách mặt nước $0,9\\ \\text{m}$ bằng bao nhiêu Pa? (chỉ điền số)","answer": "9000","explain": "$p = 1000 \\cdot 10 \\cdot 0,9 = 9000\\ \\text{Pa}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một khối kim loại hình hộp có kích thước $20\\ \\text{cm} \\times 10\\ \\text{cm} \\times 5\\ \\text{cm}$, khối lượng $8\\ \\text{kg}$. Khối lượng riêng của kim loại bằng bao nhiêu $\\text{kg/m}^3$? (chỉ điền số)","answer": "8000","explain": "$V = 0,2 \\cdot 0,1 \\cdot 0,05 = 10^{-3}\\ \\text{m}^3$. $\\rho = 8/10^{-3} = 8000\\ \\text{kg/m}^3$.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "NB","q": "Áp suất chất lỏng không phụ thuộc vào","options": ["A. hình dạng của bình chứa.","B. độ sâu tính từ mặt thoáng.","C. khối lượng riêng của chất lỏng.","D. gia tốc trọng trường."],"answer": "A","explain": "$p = \\rho gh$.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật lơ lửng trong chất lỏng khi","options": ["A. khối lượng riêng của vật bằng khối lượng riêng của chất lỏng.","B. khối lượng riêng của vật lớn hơn của chất lỏng.","C. khối lượng riêng của vật nhỏ hơn của chất lỏng.","D. vật rất nặng."],"answer": "A","explain": "Điều kiện lơ lửng.","points": 0.25},{"type": "mcq","level": "NB","q": "Áp suất khí quyển","options": ["A. tác dụng theo mọi phương.","B. chỉ tác dụng theo phương thẳng đứng.","C. bằng 0.","D. chỉ tác dụng lên chất rắn."],"answer": "A","explain": "Tính chất áp suất khí quyển.","points": 0.25},{"type": "mcq","level": "TH","q": "Diện tích bị ép càng nhỏ (cùng lực ép) thì áp suất","options": ["A. càng lớn.","B. càng nhỏ.","C. không đổi.","D. bằng 0."],"answer": "A","explain": "$p = F/S$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một thùng cao $2\\ \\text{m}$ chứa đầy nước ($\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Áp suất của nước tại điểm cách đáy thùng $0,5\\ \\text{m}$ bằng","options": ["A. $15000\\ \\text{Pa}$.","B. $20000\\ \\text{Pa}$.","C. $5000\\ \\text{Pa}$.","D. $10000\\ \\text{Pa}$."],"answer": "A","explain": "$h = 1,5\\ \\text{m}$, $p = 1000 \\cdot 10 \\cdot 1,5 = 15000\\ \\text{Pa}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một quả cầu sắt đặc có khối lượng $3,9\\ \\text{kg}$, khối lượng riêng của sắt là $7800\\ \\text{kg/m}^3$. Thể tích của quả cầu bằng","options": ["A. $5 \\cdot 10^{-4}\\ \\text{m}^3$.","B. $0,0005\\ \\text{cm}^3$.","C. $30420\\ \\text{m}^3$.","D. $2000\\ \\text{m}^3$."],"answer": "A","explain": "$V = 3,9/7800 = 5 \\cdot 10^{-4}\\ \\text{m}^3$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Áp suất do chất lỏng gây ra tại một điểm tỉ lệ thuận với độ sâu của điểm đó.","b) Trong cùng một chất lỏng đứng yên, các điểm trên cùng mặt phẳng nằm ngang có áp suất bằng nhau.","c) Áp suất tại đáy bình lớn hơn áp suất tại mặt thoáng.","d) Nhấn chìm vật càng sâu thì áp suất chất lỏng tác dụng lên vật càng nhỏ."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: càng sâu áp suất càng LỚN.","points": 1},{"type": "truefalse","level": "VD","q": "Một khối gỗ $0,48\\ \\text{kg}$ nổi trên mặt nước, thể tích phần chìm bằng $4,8 \\cdot 10^{-4}\\ \\text{m}^3$ ($\\rho_{nước} = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lực đẩy Archimedes tác dụng lên gỗ bằng $4,8\\ \\text{N}$.","b) Trọng lượng của gỗ bằng $4,8\\ \\text{N}$.","c) Thể tích của khối gỗ bằng $7,5 \\cdot 10^{-4}\\ \\text{m}^3$ nếu khối lượng riêng của gỗ là $640\\ \\text{kg/m}^3$.","d) Nếu nhấn chìm hoàn toàn khối gỗ thì lực đẩy Archimedes tăng lên."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $F_A = 1000 \\cdot 4,8 \\cdot 10^{-4} \\cdot 10 = 4,8\\ \\text{N}$. b) Đúng: $P = mg = 4,8\\ \\text{N}$ (vật nổi nên $P = F_A$). c) Đúng: $V = 0,48/640 = 7,5 \\cdot 10^{-4}\\ \\text{m}^3$. d) Đúng: $V_{chìm}$ tăng nên $F_A$ tăng.","points": 1},{"type": "short","level": "VDC","q": "Một người có khối lượng $50\\ \\text{kg}$ đứng trên mặt sàn bằng một chân, diện tích tiếp xúc $120\\ \\text{cm}^2$ (lấy $g = 10\\ \\text{m/s}^2$). Áp suất của người lên sàn bằng bao nhiêu Pa? (chỉ điền số)","answer": "41667","explain": "$p = 500/0,012 \\approx 41666,7\\ \\text{Pa}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một bể bơi có diện tích đáy $50\\ \\text{m}^2$, chứa nước sâu $2\\ \\text{m}$ ($\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Lực do nước tác dụng lên đáy bể bằng bao nhiêu N? (chỉ điền số)","answer": "1000000","explain": "$p = 1000 \\cdot 10 \\cdot 2 = 20000\\ \\text{Pa}$. $F = 20000 \\cdot 50 = 10^6\\ \\text{N}$.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Khối lượng riêng của nước là $1000\\ \\text{kg/m}^3$. Điều đó có nghĩa là","options": ["A. $1\\ \\text{m}^3$ nước có khối lượng $1000\\ \\text{kg}$.","B. $1\\ \\text{kg}$ nước có thể tích $1000\\ \\text{m}^3$.","C. $1\\ \\text{m}^3$ nước có trọng lượng $1000\\ \\text{N}$.","D. nước luôn có khối lượng $1000\\ \\text{kg}$."],"answer": "A","explain": "Ý nghĩa khối lượng riêng.","points": 0.25},{"type": "mcq","level": "NB","q": "Áp suất của người đứng trên mặt đất sẽ tăng lên khi","options": ["A. co một chân lên (giảm diện tích tiếp xúc).","B. nằm xuống đất.","C. đi giày đế rộng.","D. giảm cân."],"answer": "A","explain": "$p = F/S$, $S$ giảm thì $p$ tăng.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong các vật sau, vật nào có khối lượng riêng lớn nhất?","options": ["A. Khối sắt.","B. Khối gỗ.","C. Khối xốp.","D. Khối nước đá."],"answer": "A","explain": "Sắt đặc hơn các chất còn lại.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật có thể tích $V$, khối lượng $m$. Khối lượng riêng của vật","options": ["A. không đổi khi chia vật thành hai phần bằng nhau.","B. giảm một nửa khi chia vật thành hai phần bằng nhau.","C. tăng gấp đôi khi chia vật thành hai phần bằng nhau.","D. bằng 0 khi vật rất nhỏ."],"answer": "A","explain": "Khối lượng riêng là đặc trưng của chất.","points": 0.25},{"type": "mcq","level": "TH","q": "Một bể cá hình hộp có đáy $0,5\\ \\text{m}^2$, mực nước cao $0,4\\ \\text{m}$ ($\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Áp suất của nước tại đáy bể bằng","options": ["A. $4000\\ \\text{Pa}$.","B. $2000\\ \\text{Pa}$.","C. $500\\ \\text{Pa}$.","D. $1250\\ \\text{Pa}$."],"answer": "A","explain": "$p = 1000 \\cdot 10 \\cdot 0,4 = 4000\\ \\text{Pa}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một thanh nhôm có khối lượng $5,4\\ \\text{kg}$, khối lượng riêng của nhôm là $2700\\ \\text{kg/m}^3$. Thể tích của thanh nhôm bằng","options": ["A. $2 \\cdot 10^{-3}\\ \\text{m}^3$.","B. $14580\\ \\text{m}^3$.","C. $0,0005\\ \\text{m}^3$.","D. $500\\ \\text{m}^3$."],"answer": "A","explain": "$V = 5,4/2700 = 2 \\cdot 10^{-3}\\ \\text{m}^3$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Người đi trên nền đất mềm nên dùng ván rộng để giảm áp suất.","b) Lưỡi dao càng sắc (diện tích càng nhỏ) thì cắt càng dễ.","c) Xe tăng dùng dải xích rộng để tăng áp suất lên mặt đất.","d) Đinh có đầu nhọn để giảm áp suất khi đóng."],"answer": ["T","T","F","F"],"explain": "a) Đúng: tăng $S$ giảm $p$. b) Đúng: giảm $S$ tăng $p$. c) Sai: để GIẢM áp suất, chống lún. d) Sai: đầu nhọn để TĂNG áp suất.","points": 1},{"type": "truefalse","level": "VD","q": "Một khối lập phương đặc cạnh $0,2\\ \\text{m}$, khối lượng $17,6\\ \\text{kg}$ ($g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Thể tích của khối là $8 \\cdot 10^{-3}\\ \\text{m}^3$.","b) Khối lượng riêng của chất làm khối là $2200\\ \\text{kg/m}^3$.","c) Áp suất của khối lên mặt bàn (đặt trên một mặt) bằng $4400\\ \\text{Pa}$.","d) Nếu khoét rỗng một nửa thể tích thì khối lượng riêng của chất làm khối giảm một nửa."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $V = 0,008\\ \\text{m}^3$. b) Đúng: $\\rho = 17,6/0,008 = 2200\\ \\text{kg/m}^3$. c) Đúng: $p = 176/0,04 = 4400\\ \\text{Pa}$. d) Sai: $\\rho$ là đặc trưng của chất, không đổi.","points": 1},{"type": "short","level": "VDC","q": "Một cột nước cao $10,3\\ \\text{m}$ ($\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Áp suất do cột nước gây ra bằng bao nhiêu Pa? (chỉ điền số)","answer": "103000","explain": "$p = 1000 \\cdot 10 \\cdot 10,3 = 103000\\ \\text{Pa}$ (xấp xỉ áp suất khí quyển).","points": 0.5},{"type": "short","level": "VDC","q": "Một quả cầu rỗng bằng đồng có thể tích ngoài $500\\ \\text{cm}^3$, khối lượng $1780\\ \\text{g}$ ($\\rho_{đồng} = 8900\\ \\text{kg/m}^3$). Thể tích phần rỗng bằng bao nhiêu $\\text{cm}^3$? (chỉ điền số)","answer": "300","explain": "$V_{đồng} = 1780/8,9 = 200\\ \\text{cm}^3$. $V_{rỗng} = 500 - 200 = 300\\ \\text{cm}^3$.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Áp suất được định nghĩa là","options": ["A. độ lớn của áp lực trên một đơn vị diện tích bị ép.","B. lực tác dụng lên vật.","C. diện tích bị ép.","D. khối lượng trên một đơn vị thể tích."],"answer": "A","explain": "Định nghĩa áp suất.","points": 0.25},{"type": "mcq","level": "NB","q": "Khối lượng riêng của một vật rắn không phụ thuộc vào","options": ["A. kích thước của vật.","B. chất liệu làm vật.","C. nhiệt độ (khi dãn nở).","D. trạng thái của chất."],"answer": "A","explain": "Cùng chất thì $\\rho$ như nhau.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật nổi trên mặt chất lỏng khi","options": ["A. khối lượng riêng trung bình của vật nhỏ hơn khối lượng riêng của chất lỏng.","B. khối lượng riêng của vật lớn hơn của chất lỏng.","C. vật rất nặng.","D. vật có hình dạng đặc biệt."],"answer": "A","explain": "Điều kiện nổi.","points": 0.25},{"type": "mcq","level": "TH","q": "Áp suất tại đáy của hai bình có chiều cao cột chất lỏng bằng nhau, chứa cùng một chất lỏng","options": ["A. bằng nhau, không phụ thuộc hình dạng bình.","B. bình to hơn thì lớn hơn.","C. bình nhỏ hơn thì lớn hơn.","D. phụ thuộc vào lượng chất lỏng."],"answer": "A","explain": "$p = \\rho gh$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người thợ lặn lặn xuống độ sâu $20\\ \\text{m}$ trong nước ($\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Áp suất của nước tác dụng lên người thợ lặn bằng","options": ["A. $200000\\ \\text{Pa}$.","B. $20000\\ \\text{Pa}$.","C. $500\\ \\text{Pa}$.","D. $2000\\ \\text{Pa}$."],"answer": "A","explain": "$p = 1000 \\cdot 10 \\cdot 20 = 200000\\ \\text{Pa}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật có khối lượng $2,7\\ \\text{kg}$, thể tích $1\\ \\text{dm}^3$. Khối lượng riêng của vật bằng","options": ["A. $2700\\ \\text{kg/m}^3$.","B. $2,7\\ \\text{kg/m}^3$.","C. $270\\ \\text{kg/m}^3$.","D. $27000\\ \\text{kg/m}^3$."],"answer": "A","explain": "$1\\ \\text{dm}^3 = 10^{-3}\\ \\text{m}^3$, $\\rho = 2,7/10^{-3} = 2700\\ \\text{kg/m}^3$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) $p = F/S$ với $F$ là áp lực vuông góc với mặt bị ép.","b) Áp lực là lực ép vuông góc với mặt bị ép.","c) Áp suất có đơn vị là $\\text{N/m}^2$.","d) Tăng áp lực và giảm diện tích đều làm tăng áp suất."],"answer": ["T","T","T","T"],"explain": "a) Đúng. b) Đúng. c) Đúng: paxcan. d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Một máy thủy lực có pít-tông nhỏ diện tích $5\\ \\text{cm}^2$, pít-tông lớn diện tích $500\\ \\text{cm}^2$. Tác dụng lực $100\\ \\text{N}$ lên pít-tông nhỏ. Xét tính đúng, sai của các khẳng định sau (bỏ qua ma sát):","statements": ["a) Áp suất truyền trong chất lỏng bằng $200000\\ \\text{Pa}$.","b) Lực nâng ở pít-tông lớn bằng $10000\\ \\text{N}$.","c) Máy thủy lực cho ta lợi về lực $100$ lần.","d) Máy thủy lực cho ta lợi về công $100$ lần."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $p = 100/(5 \\cdot 10^{-4}) = 200000\\ \\text{Pa}$. b) Đúng: $F = 200000 \\cdot 0,05 = 10000\\ \\text{N}$. c) Đúng. d) Sai: không lợi về công.","points": 1},{"type": "short","level": "VDC","q": "Một thùng phi cao $0,9\\ \\text{m}$ chứa đầy xăng ($\\rho = 700\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Áp suất của xăng tại đáy thùng bằng bao nhiêu Pa? (chỉ điền số)","answer": "6300","explain": "$p = 700 \\cdot 10 \\cdot 0,9 = 6300\\ \\text{Pa}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một khối hộp chữ nhật $30\\ \\text{cm} \\times 20\\ \\text{cm} \\times 10\\ \\text{cm}$ có khối lượng $15,6\\ \\text{kg}$. Đặt khối hộp trên mặt bàn. Áp suất lớn nhất mà khối hộp tác dụng lên mặt bàn bằng bao nhiêu Pa? (lấy $g = 10\\ \\text{m/s}^2$, chỉ điền số)","answer": "7800","explain": "$p_{max}$ khi diện tích tiếp xúc nhỏ nhất: $S = 0,2 \\cdot 0,1 = 0,02\\ \\text{m}^2$. $p = 156/0,02 = 7800\\ \\text{Pa}$.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Để tăng áp suất, ta có thể","options": ["A. tăng áp lực hoặc giảm diện tích bị ép.","B. giảm áp lực và tăng diện tích bị ép.","C. giữ nguyên áp lực và diện tích.","D. tăng cả áp lực và diện tích theo cùng tỉ lệ."],"answer": "A","explain": "$p = F/S$.","points": 0.25},{"type": "mcq","level": "NB","q": "Để giảm áp suất, ta có thể","options": ["A. giảm áp lực hoặc tăng diện tích bị ép.","B. tăng áp lực.","C. giảm diện tích bị ép.","D. tăng cả hai."],"answer": "A","explain": "$p = F/S$.","points": 0.25},{"type": "mcq","level": "NB","q": "Khối lượng riêng của chất lỏng thường được đo bằng","options": ["A. $\\text{kg/m}^3$ hoặc $\\text{g/cm}^3$.","B. $\\text{N/m}^2$.","C. $\\text{kg} \\cdot \\text{m/s}^2$.","D. $\\text{m}^3/\\text{kg}$."],"answer": "A","explain": "Đơn vị khối lượng riêng.","points": 0.25},{"type": "mcq","level": "TH","q": "Áp suất do cột chất lỏng gây ra tỉ lệ thuận với","options": ["A. chiều cao của cột chất lỏng.","B. tiết diện của cột chất lỏng.","C. thể tích của cột chất lỏng.","D. hình dạng của bình chứa."],"answer": "A","explain": "$p = \\rho gh$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một khối đá có thể tích $2\\ \\text{m}^3$, khối lượng riêng $2600\\ \\text{kg/m}^3$. Khối lượng của khối đá bằng","options": ["A. $5200\\ \\text{kg}$.","B. $1300\\ \\text{kg}$.","C. $0,00077\\ \\text{kg}$.","D. $2602\\ \\text{kg}$."],"answer": "A","explain": "$m = 2600 \\cdot 2 = 5200\\ \\text{kg}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lưỡi dao có diện tích tiếp xúc $0,1\\ \\text{mm}^2$, tác dụng lực $20\\ \\text{N}$. Áp suất của lưỡi dao lên vật bị cắt bằng","options": ["A. $2 \\cdot 10^8\\ \\text{Pa}$.","B. $2\\ \\text{Pa}$.","C. $200\\ \\text{Pa}$.","D. $0,005\\ \\text{Pa}$."],"answer": "A","explain": "$S = 10^{-7}\\ \\text{m}^2$, $p = 20/10^{-7} = 2 \\cdot 10^8\\ \\text{Pa}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tàu thuyền bằng thép vẫn nổi được vì khối lượng riêng trung bình của tàu nhỏ hơn nước.","b) Khinh khí cầu bay lên vì khối lượng riêng của khí trong cầu nhỏ hơn không khí.","c) Vật có khối lượng riêng lớn hơn nước thì luôn chìm trong nước.","d) Nước đá chìm trong nước lỏng."],"answer": ["T","T","T","F"],"explain": "a) Đúng: tàu rỗng nên $\\rho_{tb}$ nhỏ. b) Đúng. c) Đúng. d) Sai: nước đá NỔI.","points": 1},{"type": "truefalse","level": "VD","q": "Một bình thông nhau gồm hai nhánh có tiết diện $10\\ \\text{cm}^2$ và $50\\ \\text{cm}^2$, chứa nước. Đổ thêm dầu ($\\rho = 800\\ \\text{kg/m}^3$) vào nhánh nhỏ làm cột dầu cao $15\\ \\text{cm}$. Xét tính đúng, sai của các khẳng định sau ($g = 10\\ \\text{m/s}^2$):","statements": ["a) Mặt thoáng hai nhánh chênh lệch nhau.","b) Độ chênh lệch mực nước hai bên bằng $12\\ \\text{cm}$.","c) Áp suất tại mặt phân cách dầu - nước bằng $1200\\ \\text{Pa}$.","d) Nếu đổ thêm nước vào nhánh lớn thì mực dầu dâng lên."],"answer": ["T","T","T","T"],"explain": "a) Đúng. b) Đúng: $\\rho_{dầu}h_{dầu} = \\rho_{nước}\\Delta h$, $\\Delta h = 12\\ \\text{cm}$. c) Đúng: $p = 800 \\cdot 10 \\cdot 0,15 = 1200\\ \\text{Pa}$. d) Đúng.","points": 1},{"type": "short","level": "VDC","q": "Một người nặng $700\\ \\text{N}$ đứng bằng hai chân trên mặt đất, mỗi bàn chân có diện tích $175\\ \\text{cm}^2$. Áp suất của người lên mặt đất bằng bao nhiêu Pa? (chỉ điền số)","answer": "20000","explain": "$S = 0,035\\ \\text{m}^2$, $p = 700/0,035 = 20000\\ \\text{Pa}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một bể chứa nước có hai điểm A, B với độ sâu lần lượt $1,2\\ \\text{m}$ và $2,8\\ \\text{m}$ ($\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Hiệu áp suất giữa hai điểm bằng bao nhiêu Pa? (chỉ điền số)","answer": "16000","explain": "$\\Delta p = \\rho g\\Delta h = 1000 \\cdot 10 \\cdot 1,6 = 16000\\ \\text{Pa}$.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "NB","q": "Áp lực là","options": ["A. lực ép vuông góc với mặt bị ép.","B. lực ép xiên với mặt bị ép.","C. lực kéo vật lên.","D. trọng lượng của vật."],"answer": "A","explain": "Định nghĩa áp lực.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong công thức $p = \\frac{F}{S}$, $S$ là","options": ["A. diện tích mặt bị ép.","B. diện tích toàn phần của vật.","C. thể tích của vật.","D. quãng đường."],"answer": "A","explain": "$S$ là diện tích bị ép.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật đặt trên mặt bàn. Áp suất của vật lên mặt bàn phụ thuộc vào","options": ["A. trọng lượng của vật và diện tích tiếp xúc.","B. màu sắc của vật.","C. nhiệt độ của vật.","D. chất liệu của mặt bàn."],"answer": "A","explain": "$p = F/S$.","points": 0.25},{"type": "mcq","level": "TH","q": "Càng lặn sâu, thợ lặn càng cảm thấy tức ngực vì","options": ["A. áp suất nước tăng theo độ sâu.","B. nhiệt độ nước tăng.","C. nước càng lạnh.","D. thiếu ôxy."],"answer": "A","explain": "$p = \\rho gh$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một khối đồng có khối lượng $8,9\\ \\text{kg}$, khối lượng riêng của đồng là $8900\\ \\text{kg/m}^3$. Thể tích của khối đồng bằng","options": ["A. $10^{-3}\\ \\text{m}^3$.","B. $79210\\ \\text{m}^3$.","C. $1\\ \\text{m}^3$.","D. $0,001\\ \\text{cm}^3$."],"answer": "A","explain": "$V = 8,9/8900 = 10^{-3}\\ \\text{m}^3$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một máy nén thủy lực nâng ô tô $12000\\ \\text{N}$ bằng pít-tông lớn diện tích $0,12\\ \\text{m}^2$. Áp suất trong chất lỏng bằng","options": ["A. $100000\\ \\text{Pa}$.","B. $1440\\ \\text{Pa}$.","C. $0,00001\\ \\text{Pa}$.","D. $1000\\ \\text{Pa}$."],"answer": "A","explain": "$p = 12000/0,12 = 100000\\ \\text{Pa}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Áp suất là đại lượng vô hướng.","b) Áp lực là đại lượng vectơ.","c) Đơn vị paxcan tương đương $\\text{N/m}^2$.","d) $1\\ \\text{atm} \\approx 101325\\ \\text{Pa}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng. b) Đúng: áp lực là lực. c) Đúng. d) Đúng: giá trị áp suất khí quyển chuẩn.","points": 1},{"type": "truefalse","level": "VDC","q": "Một quả bóng bay được bơm căng với áp suất trong bóng $1,2 \\cdot 10^5\\ \\text{Pa}$, diện tích van bóng $2\\ \\text{cm}^2$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lực do khí trong bóng tác dụng lên van bằng $24\\ \\text{N}$.","b) Nếu áp suất tăng gấp đôi thì lực tác dụng lên van tăng gấp đôi.","c) Áp suất trong bóng tác dụng theo mọi phương.","d) Van càng rộng thì áp suất trong bóng càng lớn (cùng lượng khí)."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $F = 1,2 \\cdot 10^5 \\cdot 2 \\cdot 10^{-4} = 24\\ \\text{N}$. b) Đúng. c) Đúng. d) Sai: áp suất không phụ thuộc diện tích van.","points": 1},{"type": "short","level": "VDC","q": "Một thùng chứa thủy ngân ($\\rho = 13600\\ \\text{kg/m}^3$) cao $0,5\\ \\text{m}$ ($g = 10\\ \\text{m/s}^2$). Áp suất tại đáy thùng bằng bao nhiêu Pa? (chỉ điền số)","answer": "68000","explain": "$p = 13600 \\cdot 10 \\cdot 0,5 = 68000\\ \\text{Pa}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một tấm ván hình chữ nhật $2\\ \\text{m} \\times 0,5\\ \\text{m}$, dày $4\\ \\text{cm}$, khối lượng riêng $500\\ \\text{kg/m}^3$ nổi trên mặt nước ($\\rho_{nước} = 1000\\ \\text{kg/m}^3$). Chiều cao phần nổi trên mặt nước bằng bao nhiêu cm? (chỉ điền số)","answer": "2","explain": "$\\rho_{ván}/\\rho_{nước} = 0,5$ nên một nửa thể tích chìm. Phần nổi $= 2\\ \\text{cm}$.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Khối lượng riêng của sắt là $7800\\ \\text{kg/m}^3$. Con số này cho biết","options": ["A. $1\\ \\text{m}^3$ sắt có khối lượng $7800\\ \\text{kg}$.","B. $7800\\ \\text{m}^3$ sắt có khối lượng $1\\ \\text{kg}$.","C. sắt luôn nặng $7800\\ \\text{kg}$.","D. $1\\ \\text{kg}$ sắt có thể tích $7800\\ \\text{m}^3$."],"answer": "A","explain": "Ý nghĩa.","points": 0.25},{"type": "mcq","level": "NB","q": "Áp suất chất lỏng tại đáy bình chứa","options": ["A. lớn hơn áp suất tại mặt thoáng.","B. nhỏ hơn áp suất tại mặt thoáng.","C. bằng áp suất tại mặt thoáng.","D. bằng 0."],"answer": "A","explain": "$p = \\rho gh$, đáy sâu hơn.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật đặc, đồng chất có khối lượng riêng $\\rho$. Khi cắt vật thành 3 phần bằng nhau, khối lượng riêng của mỗi phần","options": ["A. vẫn bằng $\\rho$.","B. bằng $\\rho/3$.","C. bằng $3\\rho$.","D. bằng 0."],"answer": "A","explain": "Đặc trưng của chất.","points": 0.25},{"type": "mcq","level": "TH","q": "Đơn vị nào sau đây KHÔNG phải đơn vị của áp suất?","options": ["A. $\\text{N} \\cdot \\text{m}$.","B. $\\text{Pa}$.","C. $\\text{N/m}^2$.","D. $\\text{atm}$."],"answer": "A","explain": "$\\text{N} \\cdot \\text{m}$ là đơn vị công.","points": 0.25},{"type": "mcq","level": "TH","q": "Một khối bê tông có thể tích $0,25\\ \\text{m}^3$, khối lượng $600\\ \\text{kg}$. Khối lượng riêng của bê tông bằng","options": ["A. $2400\\ \\text{kg/m}^3$.","B. $150\\ \\text{kg/m}^3$.","C. $0,00042\\ \\text{kg/m}^3$.","D. $240\\ \\text{kg/m}^3$."],"answer": "A","explain": "$\\rho = 600/0,25 = 2400\\ \\text{kg/m}^3$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một cái bàn có 4 chân, mỗi chân có diện tích tiếp xúc $25\\ \\text{cm}^2$. Bàn và vật trên bàn nặng tổng cộng $200\\ \\text{N}$. Áp suất của bàn lên sàn bằng","options": ["A. $20000\\ \\text{Pa}$.","B. $8\\ \\text{Pa}$.","C. $5000\\ \\text{Pa}$.","D. $2\\ \\text{Pa}$."],"answer": "A","explain": "$S = 0,01\\ \\text{m}^2$, $p = 200/0,01 = 20000\\ \\text{Pa}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Chất lỏng đứng yên gây áp suất theo mọi phương.","b) Áp suất tại hai điểm có cùng độ sâu trong cùng chất lỏng thì bằng nhau.","c) Đổ thêm chất lỏng vào bình thì áp suất tại đáy tăng.","d) Áp suất chất lỏng chỉ tác dụng lên đáy bình."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng: $h$ tăng. d) Sai: tác dụng theo mọi phương, lên cả thành bình.","points": 1},{"type": "truefalse","level": "VDC","q": "Một khối nước đá $0,9\\ \\text{kg}$ ($\\rho = 900\\ \\text{kg/m}^3$) nổi trong nước ($\\rho = 1000\\ \\text{kg/m}^3$). Xét tính đúng, sai của các khẳng định sau ($g = 10\\ \\text{m/s}^2$):","statements": ["a) Thể tích của khối nước đá bằng $10^{-3}\\ \\text{m}^3$.","b) Thể tích phần chìm bằng $9 \\cdot 10^{-4}\\ \\text{m}^3$.","c) Thể tích phần nổi bằng $10^{-4}\\ \\text{m}^3$.","d) Khi nước đá tan hết, mực nước trong cốc không đổi (bỏ qua dãn nở nhiệt)."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $V = 0,9/900 = 10^{-3}\\ \\text{m}^3$. b) Đúng: $V_{chìm} = 0,9 \\cdot V = 9 \\cdot 10^{-4}\\ \\text{m}^3$. c) Đúng. d) Đúng: nước tan ra đúng bằng thể tích phần chìm.","points": 1},{"type": "short","level": "VDC","q": "Một giếng nước sâu $6\\ \\text{m}$, mặt nước cách miệng giếng $2\\ \\text{m}$ ($\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Áp suất của nước tại đáy giếng bằng bao nhiêu Pa? (chỉ điền số)","answer": "40000","explain": "$h = 4\\ \\text{m}$, $p = 1000 \\cdot 10 \\cdot 4 = 40000\\ \\text{Pa}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một quả cầu bằng nhôm rỗng có khối lượng $540\\ \\text{g}$, thể tích ngoài $300\\ \\text{cm}^3$ ($\\rho_{nhôm} = 2700\\ \\text{kg/m}^3$). Thể tích phần rỗng bằng bao nhiêu $\\text{cm}^3$? (chỉ điền số)","answer": "100","explain": "$V_{nhôm} = 540/2,7 = 200\\ \\text{cm}^3$. $V_{rỗng} = 300 - 200 = 100\\ \\text{cm}^3$.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Áp suất khí quyển ở mặt đất xấp xỉ","options": ["A. $10^5\\ \\text{Pa}$.","B. $10^3\\ \\text{Pa}$.","C. $10\\ \\text{Pa}$.","D. $10^7\\ \\text{Pa}$."],"answer": "A","explain": "Xấp xỉ $101325\\ \\text{Pa}$.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật có khối lượng riêng nhỏ hơn khối lượng riêng của chất lỏng thì khi thả vào chất lỏng sẽ","options": ["A. nổi lên mặt chất lỏng.","B. chìm xuống đáy.","C. lơ lửng.","D. tan ra."],"answer": "A","explain": "Điều kiện nổi.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong hệ SI, paxcan là đơn vị của","options": ["A. áp suất.","B. lực.","C. công.","D. khối lượng riêng."],"answer": "A","explain": "Đơn vị áp suất.","points": 0.25},{"type": "mcq","level": "TH","q": "Hai bình có cùng chiều cao cột nước nhưng tiết diện khác nhau. Áp suất tại đáy hai bình","options": ["A. bằng nhau.","B. bình to hơn thì lớn hơn.","C. bình nhỏ hơn thì lớn hơn.","D. không so sánh được."],"answer": "A","explain": "$p = \\rho gh$ không phụ thuộc tiết diện.","points": 0.25},{"type": "mcq","level": "TH","q": "Một khối thủy tinh có khối lượng $1,25\\ \\text{kg}$, khối lượng riêng $2500\\ \\text{kg/m}^3$. Thể tích của khối thủy tinh bằng","options": ["A. $5 \\cdot 10^{-4}\\ \\text{m}^3$.","B. $3125\\ \\text{m}^3$.","C. $0,0005\\ \\text{cm}^3$.","D. $2\\ \\text{m}^3$."],"answer": "A","explain": "$V = 1,25/2500 = 5 \\cdot 10^{-4}\\ \\text{m}^3$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một bao gạo $500\\ \\text{N}$ đặt trên mặt đất với diện tích tiếp xúc $0,25\\ \\text{m}^2$. Áp suất của bao gạo lên mặt đất bằng","options": ["A. $2000\\ \\text{Pa}$.","B. $125\\ \\text{Pa}$.","C. $0,0005\\ \\text{Pa}$.","D. $500,25\\ \\text{Pa}$."],"answer": "A","explain": "$p = 500/0,25 = 2000\\ \\text{Pa}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khối lượng riêng là khối lượng của một đơn vị thể tích.","b) $1\\ \\text{kg/m}^3 = 1000\\ \\text{g/cm}^3$.","c) Áp suất $p = F/S$.","d) Lực ép càng lớn thì áp suất càng lớn (cùng diện tích)."],"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: $1\\ \\text{g/cm}^3 = 1000\\ \\text{kg/m}^3$. c) Đúng. d) Đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Một tàu ngầm có thể tích $3000\\ \\text{m}^3$, khối lượng (kể cả nước dằn) $3,09 \\cdot 10^6\\ \\text{kg}$ đang lơ lửng trong nước biển ($\\rho = 1030\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khối lượng riêng trung bình của tàu bằng $1030\\ \\text{kg/m}^3$.","b) Lực đẩy Archimedes tác dụng lên tàu bằng $3,09 \\cdot 10^7\\ \\text{N}$.","c) Trọng lượng của tàu bằng $3,09 \\cdot 10^7\\ \\text{N}$.","d) Muốn tàu nổi lên, phải giảm khối lượng riêng trung bình của tàu (xả bớt nước dằn)."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $3,09 \\cdot 10^6/3000 = 1030\\ \\text{kg/m}^3$. b) Đúng: $F_A = 1030 \\cdot 3000 \\cdot 10 = 3,09 \\cdot 10^7\\ \\text{N}$. c) Đúng: $P = mg$. d) Đúng.","points": 1},{"type": "short","level": "VDC","q": "Một đập thủy điện có mực nước cao $80\\ \\text{m}$ ($\\rho = 1000\\ \\text{kg/m}^3$, $g = 10\\ \\text{m/s}^2$). Áp suất của nước tại chân đập bằng bao nhiêu Pa? (chỉ điền số)","answer": "800000","explain": "$p = 1000 \\cdot 10 \\cdot 80 = 800000\\ \\text{Pa}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một khối gỗ hình hộp $40\\ \\text{cm} \\times 25\\ \\text{cm} \\times 12\\ \\text{cm}$ nổi trên nước, phần chìm cao $9\\ \\text{cm}$ ($\\rho_{nước} = 1000\\ \\text{kg/m}^3$). Khối lượng của khối gỗ bằng bao nhiêu kg? (chỉ điền số)","answer": "9","explain": "$V_{chìm} = 0,4 \\cdot 0,25 \\cdot 0,09 = 0,009\\ \\text{m}^3$. $m = 1000 \\cdot 0,009 = 9\\ \\text{kg}$.","points": 0.5}]}]}
