²", "D. Tay đòn là khoảng cách từ trục quay đến giá của lực; moment lực có đơn vị N.m"], "answer": "D", "explain": "Moment lực $M = F \\cdot d$: $d$ (tay đòn) là khoảng cách từ trục quay đến GIÁ của lực (không phải đến điểm đặt). Đơn vị: niutơn nhân mét (N.m).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dùng một cờ lê dài $0.5$ m để vặn ốc, tác dụng lực $F = 100$ N vuông góc với cờ lê tại đầu của nó. Moment của lực đối với trục quay là:", "options": ["A. $50$ N.m", "B. $100$ N.m", "C. $25$ N.m", "D. $100.5$ N.m"], "answer": "A", "explain": "$M = F \\cdot d = 100 \\cdot 0.5 = 50$ N.m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai bạn chơi bập bênh (coi thanh bập bênh nhẹ, bỏ qua khối lượng). Bạn An nặng $m_1 = 25$ kg ngồi cách trục quay $d_1 = 2$ m, bạn Bình nặng $m_2 = 50$ kg. Để bập bênh cân bằng nằm ngang, bạn Bình phải ngồi cách trục quay:", "options": ["A. $2$ m", "B. $1$ m", "C. $4$ m", "D. $1$ m"], "answer": "B", "explain": "Quy tắc moment: $P_1 d_1 = P_2 d_2$, tức $m_1 d_1 = m_2 d_2$ (g triệt tiêu hai vế). Suy ra $d_2 = \\frac{m_1 d_1}{m_2} = \\frac{25 \\cdot 2}{50} = 1$ m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người dùng đòn bẩy để nâng một vật nặng. Người đó tác dụng một lực $F = 40$ N vuông góc với đòn bẩy tại điểm cách điểm tựa $d = 0.9$ m. Moment của lực này đối với điểm tựa là:", "options": ["A. $44.44$ N.m", "B. $32.4$ N.m", "C. $36$ N.m", "D. $76$ N.m"], "answer": "C", "explain": "$M = F \\cdot d = 40 \\cdot 0.9 = 36$ N.m. Moment này có tác dụng làm quay đòn bẩy quanh điểm tựa để nâng vật.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tác dụng lên một vật một ngẫu lực gồm hai lực song song, ngược chiều, mỗi lực có độ lớn $F = 20$ N, khoảng cách giữa hai giá của lực là $d = 0.3$ m. Moment của ngẫu lực đối với mọi trục quay là:", "options": ["A. $12$ N.m", "B. $0$ N.m", "C. $20.3$ N.m", "D. $6$ N.m"], "answer": "D", "explain": "Moment của ngẫu lực: $M = F \\cdot d = 20 \\cdot 0.3 = 6$ N.m, không ực đối với một trục quay: $M = F \\cdot d$, trong đó $d$ là khoảng cách từ trục quay đến giá của lực (tay đòn). Ở đây $M = 60 \\cdot 0.6 = 36$ N.m.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một lực $F = 40$ N tác dụng lên vật, giá của lực cách trục quay một khoảng $d = 0.6$ m. Phát biểu nào sau đây đúng về moment lực và tay đòn?", "options": ["A. Tay đòn là khoảng cách từ điểm đặt của lực đến trục quay; moment lực có đơn vị N", "B. Moment lực có đơn vị là N/m; tay đòn tính bằng mét", "C. Tay đòn là khoảng cách từ trục quay đến giá của lực; moment lực có đơn vị N.m", "D. Tay đòn là độ dài của vectơ lực; moment lực có đơn vị kg.m/s²"], "answer": "C", "explain": "Moment lực $M = F \\cdot d$: $d$ (tay đòn) là khoảng cách từ trục quay đến GIÁ của lực (không phải đến điểm đặt). Đơn vị: niutơn nhân mét (N.m).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người đẩy cửa với lực $F = 60$ N vuông góc với mặt cửa tại điểm cách bản lề $d = 0.6$ m. Moment của lực đối với trục quay là:", "options": ["A. $72$ N.m", "B. $18$ N.m", "C. $60.6$ N.m", "D. $36$ N.m"], "answer": "D", "explain": "$M = F \\cdot d = 60 \\cdot 0.6 = 36$ N.m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai bạn chơi bập bênh (coi thanh bập bênh nhẹ, bỏ qua khối lượng). Bạn An nặng $m_1 = 20$ kg ngồi cách trục quay $d_1 = 2$ m, bạn Bình nặng $m_2 = 40$ kg. Để bập bênh cân bằng nằm ngang, bạn Bình phải ngồi cách trục quay:", "options": ["A. $1$ m", "B. $2$ m", "C. $4$ m", "D. $1$ m"], "answer": "A", "explain": "Quy tắc moment: $P_1 d_1 = P_2 d_2$, tức $m_1 d_1 = m_2 d_2$ (g triệt tiêu hai vế). Suy ra $d_2 = \\frac{m_1 d_1}{m_2} = \\frac{20 \\cdot 2}{40} = 1$ m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người dùng đòn bẩy để nâng một vật nặng. Người đó tác dụng một lực $F = 35$ N vuông góc với đòn bẩy tại điểm cách điểm tựa $d = 0.8$ m. Moment của lực này đối với điểm tựa là:", "options": ["A. $43.75$ N.m", "B. $28$ N.m", "C. $22.4$ N.m", "D. $63$ N.m"], "a $ N.m", "C. $35.2$ N.m", "D. $99$ N.m"], "answer": "B", "explain": "$M = F \\cdot d = 55 \\cdot 0.8 = 44$ N.m. Moment này có tác dụng làm quay đòn bẩy quanh điểm tựa để nâng vật.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một thanh AB nhẹ dài $L = 1.8$ m có trục quay tại O cách đầu A một đoạn $d_1 = 0.6$ m. Treo một vật nặng $P_1 = 150$ N tại đầu A. Để thanh cân bằng nằm ngang, cần treo tại đầu B một vật nặng:", "options": ["A. $150$ N", "B. $300$ N", "C. $75$ N", "D. $37.5$ N"], "answer": "C", "explain": "Quy tắc moment với trục quay O: $P_1 d_1 = P_2 d_2$, trong đó $d_2 = L - d_1 = 1.8 - 0.6 = 1.2$ m. Suy ra $P_2 = \\frac{P_1 d_1}{d_2} = \\frac{150 \\cdot 0.6}{1.2} = 75$ N.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét các phát biểu về moment lực. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một lực $F = 90$ N tác dụng vuông góc lên cánh cửa tại điểm cách bản lề $d = 0.5$ m. Moment của lực đối với trục bản lề là $M = 45$ N.m.", "b) Moment lực có đơn vị là N.m.", "c) Tay đòn của lực là khoảng cách từ điểm đặt của lực đến trục quay.", "d) Lực có giá đi qua trục quay thì moment của nó đối với trục đó bằng 0."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $M = Fd = 90 \\cdot 0.5 = 45$ N.m. b) Đúng. c) Sai: tay đòn là khoảng cách từ trục quay đến GIÁ của lực. d) Đúng: khi đó $d = 0$ nên $M = 0$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về quy tắc moment và ngẫu lực. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Thanh nhẹ AB có trục quay tại O. Lực $F_1 = 80$ N đặt tại A cách O $d_1 = 0.5$ m làm thanh quay cùng chiều kim đồng hồ; lực $F_2 = 100$ N đặt tại B cách O $d_2 = 0.4$ m làm thanh quay ngược chiều kim đồng hồ. Thanh cân bằng.", "b) Quy tắc moment: muốn thanh cân bằng thì tổng các moment làm quay theo chiều kim đồng hồ phải bằng tổng các moment làm quay ngược chiều kim đồng hồ.", "c) Điều kiện cân bằng của vật rắn có trục quay cố định là tổng các lực tác dụng lên vật bằng 0.", "d) Ngẫu lực là hệ hai lực song song, cùng chiều, có độ lớn bằng nhau."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $M_1 = F_1 d_1 = 40$ N.m, $M_2 = F_2 d_2 = 40$ N.m; $M_1 = M_2$ và ngược chiều nhau nên thanh cân bằng. b) Đúng: đây chính là quy tắc moment. c) Sai: với vật có trục quay cố định, điều kiện cân bằng là tổng moment bằng 0. d) Sai: ngẫu lực gồm hai lực song song, NGƯỢC chiều.", "points": 1}, {"type": "short", "level": "VD", "q": "Dùng một cờ lê dài $d = 0.4$ m để vặn một con ốc. Tác dụng một lực $F = 55$ N vuông góc với cờ lê tại đầu của nó. Tính moment của lực đối với trục của con ốc (đơn vị: N.m).", "answer": "22", "explain": "$M = F \\cdot d = 55 \\cdot 0.4 = 22$ N.m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một ngẫu lực gồm hai lực song song, ngược chiều, mỗi lực có độ lớn $F = 50$ N, khoảng cách giữa hai giá của lực là $d = 0.4$ m. Tính moment của ngẫu lực (đơn vị: N.m).", "answer": "20", "explain": "$M = F \\cdot d = 50 \\cdot 0.4 = 20$ N.m.", "points": 0.5}]}]}
