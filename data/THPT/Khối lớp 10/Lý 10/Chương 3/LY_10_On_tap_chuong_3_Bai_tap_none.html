 "statements": ["a) Một vật khối lượng $m = 15$ kg chịu lực kéo $F = 90$ N theo phương ngang trên sàn có hệ số ma sát trượt $\\mu_t = 0.2$ (lấy $g = 10$ m/s$^2$). Lực ma sát trượt tác dụng lên vật là $F_{mst} = 30$ N.", "b) Gia tốc của vật là $a = 4$ m/s$^2$.", "c) Nếu ngừng tác dụng lực kéo thì vật sẽ chuyển động thẳng đều.", "d) Nếu tăng khối lượng của vật lên gấp đôi thì lực ma sát trượt cũng tăng lên gấp đôi."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $F_{mst} = \\mu_t mg = 0.2 \\cdot 15 \\cdot 10 = 30$ N. b) Đúng: $a = \\frac{F - F_{mst}}{m} = \\frac{90 - 30}{15} = 4$ m/s$^2$. c) Sai: khi ngừng kéo, vật chỉ còn chịu ma sát nên chuyển động chậm dần đều rồi dừng lại. d) Đúng: $F_{mst} = \\mu_t mg$ tỉ lệ thuận với $m$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật được ném ngang với vận tốc ban đầu $v_0 = 18$ m/s từ độ cao $h = 20$ m (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Tính tầm xa của vật (đơn vị: m).", "answer": "36", "explain": "Thời gian rơi $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 20}{10}} = 2$ s. Tầm xa $L = v_0 t = 18 \\cdot 2 = 36$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một ô tô có khối lượng $m = 2$ tấn đang chạy với vận tốc $v_0 = 25$ m/s thì tắt máy và để xe trượt tự do trên đoạn đường nằm ngang có hệ số ma sát $\\mu = 0.5$ cho đến khi dừng hẳn. Tính quãng đường ô tô đi được (đơn vị: m; lấy $g = 10$ m/s$^2$).", "answer": "62.5", "explain": "Xe chỉ chịu lực ma sát nên gia tốc hãm $a = \\mu g = 0.5 \\cdot 10 = 5$ m/s$^2$ (không phụ thuộc khối lượng). Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{25^2}{2 \\cdot 5} = 62.5$ m.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật được ném ngang từ độ cao $h = 20$ m với vận tốc ban đầu $v_0 = 28$ m/s (bỏ qua sức cản không khí). Thời gian từ lúc ném đến khi vật chạm đất phụ thuộc vào:", "options": ["A. Vận tốc ném ban đầu $v_0$", "B. Khối lượng của vật", "C. Cả $v_0$ và kh explain": "a) Đúng: đó chính là nội dung tính quán tính (định luật 1 Newton). b) Đúng: chuyển động thẳng đều thì hợp lực bằng 0. c) Sai: lực ma sát trượt NGƯỢC chiều chuyển động. d) Đúng: $M = F \\cdot d$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật khối lượng $m = 30$ kg chịu lực kéo $F = 180$ N theo phương ngang trên sàn có hệ số ma sát trượt $\\mu_t = 0.3$ (lấy $g = 10$ m/s$^2$). Lực ma sát trượt tác dụng lên vật là $F_{mst} = 90$ N.", "b) Gia tốc của vật là $a = 3$ m/s$^2$.", "c) Nếu ngừng tác dụng lực kéo thì vật sẽ chuyển động thẳng đều.", "d) Nếu tăng khối lượng của vật lên gấp đôi thì lực ma sát trượt cũng tăng lên gấp đôi."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $F_{mst} = \\mu_t mg = 0.3 \\cdot 30 \\cdot 10 = 90$ N. b) Đúng: $a = \\frac{F - F_{mst}}{m} = \\frac{180 - 90}{30} = 3$ m/s$^2$. c) Sai: khi ngừng kéo, vật chỉ còn chịu ma sát nên chuyển động chậm dần đều rồi dừng lại. d) Đúng: $F_{mst} = \\mu_t mg$ tỉ lệ thuận với $m$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật được ném ngang với vận tốc ban đầu $v_0 = 22$ m/s từ độ cao $h = 80$ m (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Tính tầm xa của vật (đơn vị: m).", "answer": "88", "explain": "Thời gian rơi $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 80}{10}} = 4$ s. Tầm xa $L = v_0 t = 22 \\cdot 4 = 88$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một ô tô có khối lượng $m = 2.5$ tấn đang chạy với vận tốc $v_0 = 30$ m/s thì tắt máy và để xe trượt tự do trên đoạn đường nằm ngang có hệ số ma sát $\\mu = 0.6$ cho đến khi dừng hẳn. Tính quãng đường ô tô đi được (đơn vị: m; lấy $g = 10$ m/s$^2$).", "answer": "75", "explain": "Xe chỉ chịu lực ma sát nên gia tốc hãm $a = \\mu g = 0.6 \\cdot 10 = 6$ m/s$^2$ (không phụ thuộc khối lượng). Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{30^2}{2 \\cdot 6} = 75$ m.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật được ném ngang từ độ cao $h = 80$ m với vận tốc ban đầu $v_0 = 36$ m/s (bỏ qua sức cản không khí). Thời gian từ lúc ném đến khi vật chạm đất phụ thuộc vào:", "options": ["A. Vận tốc ném ban đầu $v_0$", "B. Độ cao $h$ (và gia tốc $g$)", "C. Khối lượng của vật", "D. Cả $v_0$ và khối lượng của vật"], "answer": "B", "explain": "Thời gian rơi của chuyển động ném ngang $t = \\sqrt{\\frac{2h}{g}}$ chỉ phụ thuộc độ cao $h$ (và $g$); vận tốc ban đầu $v_0$ và khối lượng không ảnh hưởng đến thời gian rơi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một người khối lượng $75$ kg xô mạnh vào một bức tường. Theo định luật 3 Newton, phát biểu nào sau đây đúng?", "options": ["A. Lực của người và phản lực của tường triệt tiêu nhau", "B. Bức tường tác dụng trở lại người một lực có độ lớn bằng lực người tác dụng lên tường", "C. Lực và phản lực đặt vào cùng một vật", "D. Chỉ có người tác dụng lực lên tường, tường không tác dụng lực trở lại"], "answer": "B", "explain": "Cặp lực - phản lực: cùng độ lớn, ngược chiều, đặt vào HAI vật khác nhau (người và tường) nên không triệt tiêu nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tác dụng một hợp lực không đổi $F = 90$ N lên một vật có khối lượng $m = 30$ kg đang đứng yên trên mặt sàn nhẵn. Gia tốc mà vật thu được là:", "options": ["A. $2700$ m/s$^2$", "B. $0.33$ m/s$^2$", "C. $4$ m/s$^2$", "D. $3$ m/s$^2$"], "answer": "D", "explain": "Theo định luật 2 Newton: $a = \\frac{F}{m} = \\frac{90}{30} = 3$ m/s$^2$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đẩy cho một vật có khối lượng $m = 22$ kg trượt trên sàn nằm ngang. Hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.25$ (lấy $g = 10$ m/s$^2$). Độ lớn lực ma sát trượt tác dụng lên vật là:", "options": ["A. $55$ N", "B. $27.5$ N", "C. $110$ N", "D. $220$ N"], "answer": "A", "explain": "$F_{mst} = \\mu_t N = \\mu_t mg = 0.25 \\cdot 22 \\cdot 10 = 55$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người dùng cờ lê dài $d = 0.4$ m để vặn một con ốc, tác dụng một lực $F = 65$ N vuông góc với cờ lê tại đầu của nó. Moment của lực đối với trục của con ốc là:", "options": ["A. $162.5$ N.m", "B. $26$ N.m", "C. $52$ N.m", "D. $65.4$ N.m"], "answer": "B", "explain": "$M = F \\cdot d = 65 \\cdot 0.4 = 26$ N.m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người có khối lượng $m = 50$ kg đứng trong thang máy đang đi lên chậm dần đều với gia tốc $a = 3$ m/s$^2$. Lực do sàn thang máy tác dụng lên người có độ lớn (lấy $g = 10$ m/s$^2$):", "options": ["A. $650$ N", "B. $500$ N", "C. $350$ N", "D. $150$ N"], "answer": "C", "explain": "Chọn chiều dương hướng lên: $N - P = ma$ với $a = -3$ m/s$^2$ (chậm dần khi đi lên). Suy ra $N = m(g - 3) = 50 \\cdot 7 = 350$ N.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Mọi vật đều có xu hướng giữ nguyên vận tốc của mình; tính chất này gọi là quán tính.", "b) Một vật có khối lượng $m = 15$ kg đang chuyển động thẳng đều với vận tốc $v = 18$ m/s thì hợp lực tác dụng lên vật bằng 0.", "c) Lực ma sát trượt có hướng cùng chiều với chuyển động của vật.", "d) Moment lực đối với một trục quay được tính bằng tích của độ lớn lực với tay đòn của nó."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đó chính là nội dung tính quán tính (định luật 1 Newton). b) Đúng: chuyển động thẳng đều thì hợp lực bằng 0. c) Sai: lực ma sát trượt NGƯỢC chiều chuyển động. d) Đúng: $M = F \\cdot d$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật khối lượng $m = 12$ kg chịu lực kéo $F = 72$ N theo phương ngang trên sàn có hệ số ma sát trượt $\\mu_t = 0.2$ (lấy $g = 10$ m/s$^2$). Lực ma sát trượt tác dụng lên vật là $F_{mst} = 24$ N.", "b) Gia tốc của vật là $a = 4$ m/s$^2$.", "c) Nếu ngừng tác dụng lực kéo thì vật sẽ chuyển động thẳng đều.", "d) Nếu tăng khối lượng của vật lên gấp đôi thì lực ma sát trượt cũng tăng lên gấp đôi."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $F_{mst} = \\mu_t mg = 0.2 \\cdot 12 \\cdot 10 = 24$ N. b) Đúng: $a = \\frac{F - F_{mst}}{m} = \\frac{72 - 24}{12} = 4$ m/s$^2$. c) Sai: khi ngừng kéo, vật chỉ còn chịu ma sát nên chuyển động chậm dần đều rồi dừng lại. d) Đúng: $F_{mst} = \\mu_t mg$ tỉ lệ thuận với $m$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật được ném ngang với vận tốc ban đầu $v_0 = 35$ m/s từ độ cao $h = 45$ m (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Tính tầm xa của vật (đơn vị: m).", "answer": "105", "explain": "Thời gian rơi $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 45}{10}} = 3$ s. Tầm xa $L = v_0 t = 35 \\cdot 3 = 105$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một ô tô có khối lượng $m = 1$ tấn đang chạy với vận tốc $v_0 = 12$ m/s thì tắt máy và để xe trượt tự do trên đoạn đường nằm ngang có hệ số ma sát $\\mu = 0.24$ cho đến khi dừng hẳn. Tính quãng đường ô tô đi được (đơn vị: m; lấy $g = 10$ m/s$^2$).", "answer": "30", "explain": "Xe chỉ chịu lực ma sát nên gia tốc hãm $a = \\mu g = 0.24 \\cdot 10 = 2.4$ m/s$^2$ (không phụ thuộc khối lượng). Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{12^2}{2 \\cdot 2.4} = 30$ m.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật được ném ngang từ độ cao $h = 20$ m với vận tốc ban đầu $v_0 = 44$ m/s (bỏ qua sức cản không khí). Thời gian từ lúc ném đến khi vật chạm đất phụ thuộc vào:", "options": ["A. Vận tốc ném ban đầu $v_0$", "B. Khối lượng của vật", "C. Độ cao $h$ (và gia tốc $g$)", "D. Cả $v_0$ và khối lượng của vật"], "answer": "C", "explain": "Thời gian rơi của chuyển động ném ngang $t = \\sqrt{\\frac{2h}{g}}$ chỉ phụ thuộc độ cao $h$ (và $g$); vận tốc ban đầu $v_0$ và khối lượng không ảnh hưởng đến thời gian rơi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai lực $F_1 = 30$ N và $F_2 = 12$ N cùng phương, ngược chiều, cùng tác dụng lên một chất điểm. Hợp lực của chúng có độ lớn:", "options": ["A. $42$ N", "B. $0$ N", "C. $18$ N", "D. $32.31$ N"], "answer": "C", "explain": "Cùng phương ngược chiều: $F = |F_1 - F_2| = |30 - 12| = 18$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tác dụng một hợp lực không đổi $F = 120$ N lên một vật có khối lượng $m = 40$ kg đang đứng yên trên mặt sàn nhẵn. Gia tốc mà vật thu được là:", "options": ["A. $3$ m/s$^2$", "B. $4800$ m/s$^2$", "C. $0.33$ m/s$^2$", "D. $4$ m/s$^2$"], "answer": "A", "explain": "Theo định luật 2 Newton: $a = \\frac{F}{m} = \\frac{120}{40} = 3$ m/s$^2$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đẩy cho một vật có khối lượng $m = 40$ kg trượt trên sàn nằm ngang. Hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.2$ (lấy $g = 10$ m/s$^2$). Độ lớn lực ma sát trượt tác dụng lên vật là:", "options": ["A. $40$ N", "B. $80$ N", "C. $160$ N", "D. $400$ N"], "answer": "B", "explain": "$F_{mst} = \\mu_t N = \\mu_t mg = 0.2 \\cdot 40 \\cdot 10 = 80$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người dùng cờ lê dài $d = 0.3$ m để vặn một con ốc, tác dụng một lực $F = 85$ N vuông góc với cờ lê tại đầu của nó. Moment của lực đối với trục của con ốc là:", "options": ["A. $283.33$ N.m", "B. $51$ N.m", "C. $25.5$ N.m", "D. $85.3$ N.m"], "answer": "C", "explain": "$M = F \\cdot d = 85 \\cdot 0.3 = 25.5$ N.m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Từ độ cao $h = 125$ m, một vật được ném ngang và chạm đất tại điểm cách chân đường thẳng đứng qua vị trí ném $L = 200$ m theo phương ngang. Vận tốc ném ban đầu $v_0$ của vật là (lấy $g = 10$ m/s$^2$, bỏ qua sức cản):", "options": ["A. $20$ m/s", "B. $80$ m/s", "C. $1.6$ m/s", "D. $40$ m/s"], "answer": "D", "explain": "Thời gian rơi $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 125}{10}} = 5$ s. $v_0 = \\frac{L}{t} = \\frac{200}{5} = 40$ m/s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Mọi vật đều có xu hướng giữ nguyên vận tốc của mình; tính chất này gọi là quán tính.", "b) Một vật có khối lượng $m = 4$ kg đang chuyển động thẳng đều với vận tốc $v = 8$ m/s thì hợp lực tác dụng lên vật bằng 0.", "c) Lực ma sát trượt có hướng cùng chiều với chuyển động của vật.", "d) Moment lực đối với một trục quay được tính bằng tích của độ lớn lực với tay đòn của nó."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đó chính là nội dung tính quán tính (định luật 1 Newton). b) Đúng: chuyển động thẳng đều thì hợp lực bằng 0. c) Sai: lực ma sát trượt NGƯỢC chiều chuyển động. d) Đúng: $M = F \\cdot d$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật khối lượng $m = 40$ kg chịu lực kéo $F = 200$ N theo phương ngang trên sàn có hệ số ma sát trượt $\\mu_t = 0.25$ (lấy $g = 10$ m/s$^2$). Lực ma sát trượt tác dụng lên vật là $F_{mst} = 100$ N.", "b) Gia tốc của vật là $a = 2.5$ m/s$^2$.", "c) Nếu ngừng tác dụng lực kéo thì vật sẽ chuyển động thẳng đều.", "d) Nếu tăng khối lượng của vật lên gấp đôi thì lực ma sát trượt cũng tăng lên gấp đôi."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $F_{mst} = \\mu_t mg = 0.25 \\cdot 40 \\cdot 10 = 100$ N. b) Đúng: $a = \\frac{F - F_{mst}}{m} = \\frac{200 - 100}{40} = 2.5$ m/s$^2$. c) Sai: khi ngừng kéo, vật chỉ còn chịu ma sát nên chuyển động chậm dần đều rồi dừng lại. d) Đúng: $F_{mst} = \\mu_t mg$ tỉ lệ thuận với $m$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật được ném ngang với vận tốc ban đầu $v_0 = 28$ m/s từ độ cao $h = 125$ m (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Tính tầm xa của vật (đơn vị: m).", "answer": "140", "explain": "Thời gian rơi $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 125}{10}} = 5$ s. Tầm xa $L = v_0 t = 28 \\cdot 5 = 140$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một ô tô có khối lượng $m = 3$ tấn đang chạy với vận tốc $v_0 = 20$ m/s thì tắt máy và để xe trượt tự do trên đoạn đường nằm ngang có hệ số ma sát $\\mu = 0.5$ cho đến khi dừng hẳn. Tính quãng đường ô tô đi được (đơn vị: m; lấy $g = 10$ m/s$^2$).", "answer": "40", "explain": "Xe chỉ chịu lực ma sát nên gia tốc hãm $a = \\mu g = 0.5 \\cdot 10 = 5$ m/s$^2$ (không phụ thuộc khối lượng). Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{20^2}{2 \\cdot 5} = 40$ m.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật được ném ngang từ độ cao $h = 45$ m với vận tốc ban đầu $v_0 = 52$ m/s (bỏ qua sức cản không khí). Thời gian từ lúc ném đến khi vật chạm đất phụ thuộc vào:", "options": ["A. Vận tốc ném ban đầu $v_0$", "B. Khối lượng của vật", "C. Cả $v_0$ và khối lượng của vật", "D. Độ cao $h$ (và gia tốc $g$)"], "answer": "D", "explain": "Thời gian rơi của chuyển động ném ngang $t = \\sqrt{\\frac{2h}{g}}$ chỉ phụ thuộc độ cao $h$ (và $g$); vận tốc ban đầu $v_0$ và khối lượng không ảnh hưởng đến thời gian rơi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một chiếc xe có khối lượng $m = 900$ kg đang chuyển động thẳng đều trên đoạn đường nằm ngang. Hợp lực của các lực tác dụng lên xe:", "options": ["A. Bằng trọng lượng của xe", "B. Cùng hướng với vận tốc của xe", "C. Tỉ lệ thuận với khối lượng của xe", "D. Bằng 0"], "answer": "D", "explain": "Vật chuyển động thẳng đều (hoặc đứng yên) khi hợp lực tác dụng lên nó bằng 0 (định luật 1 Newton).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tác dụng một hợp lực không đổi $F = 66$ N lên một vật có khối lượng $m = 22$ kg đang đứng yên trên mặt sàn nhẵn. Gia tốc mà vật thu được là:", "options": ["A. $1452$ m/s$^2$", "B. $3$ m/s$^2$", "C. $0.33$ m/s$^2$", "D. $4$ m/s$^2$"], "answer": "B", "explain": "Theo định luật 2 Newton: $a = \\frac{F}{m} = \\frac{66}{22} = 3$ m/s$^2$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đẩy cho một vật có khối lượng $m = 16$ kg trượt trên sàn nằm ngang. Hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.3$ (lấy $g = 10$ m/s$^2$). Độ lớn lực ma sát trượt tác dụng lên vật là:", "options": ["A. $24$ N", "B. $96$ N", "C. $48$ N", "D. $160$ N"], "answer": "C", "explain": "$F_{mst} = \\mu_t N = \\mu_t mg = 0.3 \\cdot 16 \\cdot 10 = 48$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người dùng cờ lê dài $d = 0.25$ m để vặn một con ốc, tác dụng một lực $F = 95$ N vuông góc với cờ lê tại đầu của nó. Moment của lực đối với trục của con ốc là:", "options": ["A. $380$ N.m", "B. $47.5$ N.m", "C. $95.25$ N.m", "D. $23.75$ N.m"], "answer": "D", "explain": "$M = F \\cdot d = 95 \\cdot 0.25 = 23.75$ N.m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người có khối lượng $m = 80$ kg đứng trong thang máy đang đi lên chậm dần đều với gia tốc $a = 5$ m/s$^2$. Lực do sàn thang máy tác dụng lên người có độ lớn (lấy $g = 10$ m/s$^2$):", "options": ["A. $400$ N", "B. $1200$ N", "C. $800$ N", "D. $400$ N"], "answer": "A", "explain": "Chọn chiều dương hướng lên: $N - P = ma$ với $a = -5$ m/s$^2$ (chậm dần khi đi lên). Suy ra $N = m(g - 5) = 80 \\cdot 5 = 400$ N.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Mọi vật đều có xu hướng giữ nguyên vận tốc của mình; tính chất này gọi là quán tính.", "b) Một vật có khối lượng $m = 12$ kg đang chuyển động thẳng đều với vận tốc $v = 16$ m/s thì hợp lực tác dụng lên vật bằng 0.", "c) Lực ma sát trượt có hướng cùng chiều với chuyển động của vật.", "d) Moment lực đối với một trục quay được tính bằng tích của độ lớn lực với tay đòn của nó."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đó chính là nội dung tính quán tính (định luật 1 Newton). b) Đúng: chuyển động thẳng đều thì hợp lực bằng 0. c) Sai: lực ma sát trượt NGƯỢC chiều chuyển động. d) Đúng: $M = F \\cdot d$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật khối lượng $m = 50$ kg chịu lực kéo $F = 300$ N theo phương ngang trên sàn có hệ số ma sát trượt $\\mu_t = 0.4$ (lấy $g = 10$ m/s$^2$). Lực ma sát trượt tác dụng lên vật là $F_{mst} = 200$ N.", "b) Gia tốc của vật là $a = 2$ m/s$^2$.", "c) Nếu ngừng tác dụng lực kéo thì vật sẽ chuyển động thẳng đều.", "d) Nếu tăng khối lượng của vật lên gấp đôi thì lực ma sát trượt cũng tăng lên gấp đôi."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $F_{mst} = \\mu_t mg = 0.4 \\cdot 50 \\cdot 10 = 200$ N. b) Đúng: $a = \\frac{F - F_{mst}}{m} = \\frac{300 - 200}{50} = 2$ m/s$^2$. c) Sai: khi ngừng kéo, vật chỉ còn chịu ma sát nên chuyển động chậm dần đều rồi dừng lại. d) Đúng: $F_{mst} = \\mu_t mg$ tỉ lệ thuận với $m$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật được ném ngang với vận tốc ban đầu $v_0 = 40$ m/s từ độ cao $h = 20$ m (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Tính tầm xa của vật (đơn vị: m).", "answer": "80", "explain": "Thời gian rơi $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 20}{10}} = 2$ s. Tầm xa $L = v_0 t = 40 \\cdot 2 = 80$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một ô tô có khối lượng $m = 2$ tấn đang chạy với vận tốc $v_0 = 28$ m/s thì tắt máy và để xe trượt tự do trên đoạn đường nằm ngang có hệ số ma sát $\\mu = 0.56$ cho đến khi dừng hẳn. Tính quãng đường ô tô đi được (đơn vị: m; lấy $g = 10$ m/s$^2$).", "answer": "70", "explain": "Xe chỉ chịu lực ma sát nên gia tốc hãm $a = \\mu g = 0.56 \\cdot 10 = 5.6$ m/s$^2$ (không phụ thuộc khối lượng). Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{28^2}{2 \\cdot 5.6} = 70$ m.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật được ném ngang từ độ cao $h = 80$ m với vận tốc ban đầu $v_0 = 56$ m/s (bỏ qua sức cản không khí). Thời gian từ lúc ném đến khi vật chạm đất phụ thuộc vào:", "options": ["A. Độ cao $h$ (và gia tốc $g$)", "B. Vận tốc ném ban đầu $v_0$", "C. Khối lượng của vật", "D. Cả $v_0$ và khối lượng của vật"], "answer": "A", "explain": "Thời gian rơi của chuyển động ném ngang $t = \\sqrt{\\frac{2h}{g}}$ chỉ phụ thuộc độ cao $h$ (và $g$); vận tốc ban đầu $v_0$ và khối lượng không ảnh hưởng đến thời gian rơi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một người khối lượng $90$ kg xô mạnh vào một bức tường. Theo định luật 3 Newton, phát biểu nào sau đây đúng?", "options": ["A. Bức tường tác dụng trở lại người một lực có độ lớn bằng lực người tác dụng lên tường", "B. Lực của người và phản lực của tường triệt tiêu nhau", "C. Lực và phản lực đặt vào cùng một vật", "D. Chỉ có người tác dụng lực lên tường, tường không tác dụng lực trở lại"], "answer": "A", "explain": "Cặp lực - phản lực: cùng độ lớn, ngược chiều, đặt vào HAI vật khác nhau (người và tường) nên không triệt tiêu nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tác dụng một hợp lực không đổi $F = 84$ N lên một vật có khối lượng $m = 28$ kg đang đứng yên trên mặt sàn nhẵn. Gia tốc mà vật thu được là:", "options": ["A. $2352$ m/s$^2$", "B. $0.33$ m/s$^2$", "C. $3$ m/s$^2$", "D. $4$ m/s$^2$"], "answer": "C", "explain": "Theo định luật 2 Newton: $a = \\frac{F}{m} = \\frac{84}{28} = 3$ m/s$^2$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đẩy cho một vật có khối lượng $m = 28$ kg trượt trên sàn nằm ngang. Hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.25$ (lấy $g = 10$ m/s$^2$). Độ lớn lực ma sát trượt tác dụng lên vật là:", "options": ["A. $35$ N", "B. $140$ N", "C. $280$ N", "D. $70$ N"], "answer": "D", "explain": "$F_{mst} = \\mu_t N = \\mu_t mg = 0.25 \\cdot 28 \\cdot 10 = 70$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người dùng cờ lê dài $d = 0.3$ m để vặn một con ốc, tác dụng một lực $F = 130$ N vuông góc với cờ lê tại đầu của nó. Moment của lực đối với trục của con ốc là:", "options": ["A. $39$ N.m", "B. $433.33$ N.m", "C. $78$ N.m", "D. $130.3$ N.m"], "answer": "A", "explain": "$M = F \\cdot d = 130 \\cdot 0.3 = 39$ N.m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Từ độ cao $h = 5$ m, một vật được ném ngang và chạm đất tại điểm cách chân đường thẳng đứng qua vị trí ném $L = 15$ m theo phương ngang. Vận tốc ném ban đầu $v_0$ của vật là (lấy $g = 10$ m/s$^2$, bỏ qua sức cản):", "options": ["A. $7.5$ m/s", "B. $15$ m/s", "C. $30$ m/s", "D. $3$ m/s"], "answer": "B", "explain": "Thời gian rơi $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 5}{10}} = 1$ s. $v_0 = \\frac{L}{t} = \\frac{15}{1} = 15$ m/s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Mọi vật đều có xu hướng giữ nguyên vận tốc của mình; tính chất này gọi là quán tính.", "b) Một vật có khối lượng $m = 6$ kg đang chuyển động thẳng đều với vận tốc $v = 24$ m/s thì hợp lực tác dụng lên vật bằng 0.", "c) Lực ma sát trượt có hướng cùng chiều với chuyển động của vật.", "d) Moment lực đối với một trục quay được tính bằng tích của độ lớn lực với tay đòn của nó."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đó chính là nội dung tính quán tính (định luật 1 Newton). b) Đúng: chuyển động thẳng đều thì hợp lực bằng 0. c) Sai: lực ma sát trượt NGƯỢC chiều chuyển động. d) Đúng: $M = F \\cdot d$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật khối lượng $m = 18$ kg chịu lực kéo $F = 108$ N theo phương ngang trên sàn có hệ số ma sát trượt $\\mu_t = 0.3$ (lấy $g = 10$ m/s$^2$). Lực ma sát trượt tác dụng lên vật là $F_{mst} = 54$ N.", "b) Gia tốc của vật là $a = 3$ m/s$^2$.", "c) Nếu ngừng tác dụng lực kéo thì vật sẽ chuyển động thẳng đều.", "d) Nếu tăng khối lượng của vật lên gấp đôi thì lực ma sát trượt cũng tăng lên gấp đôi."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $F_{mst} = \\mu_t mg = 0.3 \\cdot 18 \\cdot 10 = 54$ N. b) Đúng: $a = \\frac{F - F_{mst}}{m} = \\frac{108 - 54}{18} = 3$ m/s$^2$. c) Sai: khi ngừng kéo, vật chỉ còn chịu ma sát nên chuyển động chậm dần đều rồi dừng lại. d) Đúng: $F_{mst} = \\mu_t mg$ tỉ lệ thuận với $m$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật được ném ngang với vận tốc ban đầu $v_0 = 12$ m/s từ độ cao $h = 80$ m (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Tính tầm xa của vật (đơn vị: m).", "answer": "48", "explain": "Thời gian rơi $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 80}{10}} = 4$ s. Tầm xa $L = v_0 t = 12 \\cdot 4 = 48$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một ô tô có khối lượng $m = 1.5$ tấn đang chạy với vận tốc $v_0 = 24$ m/s thì tắt máy và để xe trượt tự do trên đoạn đường nằm ngang có hệ số ma sát $\\mu = 0.48$ cho đến khi dừng hẳn. Tính quãng đường ô tô đi được (đơn vị: m; lấy $g = 10$ m/s$^2$).", "answer": "60", "explain": "Xe chỉ chịu lực ma sát nên gia tốc hãm $a = \\mu g = 0.48 \\cdot 10 = 4.8$ m/s$^2$ (không phụ thuộc khối lượng). Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{24^2}{2 \\cdot 4.8} = 60$ m.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật được ném ngang từ độ cao $h = 20$ m với vận tốc ban đầu $v_0 = 64$ m/s (bỏ qua sức cản không khí). Thời gian từ lúc ném đến khi vật chạm đất phụ thuộc vào:", "options": ["A. Vận tốc ném ban đầu $v_0$", "B. Độ cao $h$ (và gia tốc $g$)", "C. Khối lượng của vật", "D. Cả $v_0$ và khối lượng của vật"], "answer": "B", "explain": "Thời gian rơi của chuyển động ném ngang $t = \\sqrt{\\frac{2h}{g}}$ chỉ phụ thuộc độ cao $h$ (và $g$); vận tốc ban đầu $v_0$ và khối lượng không ảnh hưởng đến thời gian rơi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai lực $F_1 = 40$ N và $F_2 = 15$ N cùng phương, ngược chiều, cùng tác dụng lên một chất điểm. Hợp lực của chúng có độ lớn:", "options": ["A. $55$ N", "B. $25$ N", "C. $0$ N", "D. $42.72$ N"], "answer": "B", "explain": "Cùng phương ngược chiều: $F = |F_1 - F_2| = |40 - 15| = 25$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tác dụng một hợp lực không đổi $F = 150$ N lên một vật có khối lượng $m = 50$ kg đang đứng yên trên mặt sàn nhẵn. Gia tốc mà vật thu được là:", "options": ["A. $7500$ m/s$^2$", "B. $0.33$ m/s$^2$", "C. $4$ m/s$^2$", "D. $3$ m/s$^2$"], "answer": "D", "explain": "Theo định luật 2 Newton: $a = \\frac{F}{m} = \\frac{150}{50} = 3$ m/s$^2$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đẩy cho một vật có khối lượng $m = 35$ kg trượt trên sàn nằm ngang. Hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.2$ (lấy $g = 10$ m/s$^2$). Độ lớn lực ma sát trượt tác dụng lên vật là:", "options": ["A. $70$ N", "B. $35$ N", "C. $140$ N", "D. $350$ N"], "answer": "A", "explain": "$F_{mst} = \\mu_t N = \\mu_t mg = 0.2 \\cdot 35 \\cdot 10 = 70$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người dùng cờ lê dài $d = 0.45$ m để vặn một con ốc, tác dụng một lực $F = 70$ N vuông góc với cờ lê tại đầu của nó. Moment của lực đối với trục của con ốc là:", "options": ["A. $155.56$ N.m", "B. $31.5$ N.m", "C. $63$ N.m", "D. $70.45$ N.m"], "answer": "B", "explain": "$M = F \\cdot d = 70 \\cdot 0.45 = 31.5$ N.m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người có khối lượng $m = 90$ kg đứng trong thang máy đang đi lên chậm dần đều với gia tốc $a = 1$ m/s$^2$. Lực do sàn thang máy tác dụng lên người có độ lớn (lấy $g = 10$ m/s$^2$):", "options": ["A. $990$ N", "B. $900$ N", "C. $810$ N", "D. $90$ N"], "answer": "C", "explain": "Chọn chiều dương hướng lên: $N - P = ma$ với $a = -1$ m/s$^2$ (chậm dần khi đi lên). Suy ra $N = m(g - 1) = 90 \\cdot 9 = 810$ N.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Mọi vật đều có xu hướng giữ nguyên vận tốc của mình; tính chất này gọi là quán tính.", "b) Một vật có khối lượng $m = 25$ kg đang chuyển động thẳng đều với vận tốc $v = 30$ m/s thì hợp lực tác dụng lên vật bằng 0.", "c) Lực ma sát trượt có hướng cùng chiều với chuyển động của vật.", "d) Moment lực đối với một trục quay được tính bằng tích của độ lớn lực với tay đòn của nó."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đó chính là nội dung tính quán tính (định luật 1 Newton). b) Đúng: chuyển động thẳng đều thì hợp lực bằng 0. c) Sai: lực ma sát trượt NGƯỢC chiều chuyển động. d) Đúng: $M = F \\cdot d$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật khối lượng $m = 60$ kg chịu lực kéo $F = 360$ N theo phương ngang trên sàn có hệ số ma sát trượt $\\mu_t = 0.35$ (lấy $g = 10$ m/s$^2$). Lực ma sát trượt tác dụng lên vật là $F_{mst} = 210$ N.", "b) Gia tốc của vật là $a = 2.5$ m/s$^2$.", "c) Nếu ngừng tác dụng lực kéo thì vật sẽ chuyển động thẳng đều.", "d) Nếu tăng khối lượng của vật lên gấp đôi thì lực ma sát trượt cũng tăng lên gấp đôi."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $F_{mst} = \\mu_t mg = 0.35 \\cdot 60 \\cdot 10 = 210$ N. b) Đúng: $a = \\frac{F - F_{mst}}{m} = \\frac{360 - 210}{60} = 2.5$ m/s$^2$. c) Sai: khi ngừng kéo, vật chỉ còn chịu ma sát nên chuyển động chậm dần đều rồi dừng lại. d) Đúng: $F_{mst} = \\mu_t mg$ tỉ lệ thuận với $m$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật được ném ngang với vận tốc ban đầu $v_0 = 45$ m/s từ độ cao $h = 45$ m (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Tính tầm xa của vật (đơn vị: m).", "answer": "135", "explain": "Thời gian rơi $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 45}{10}} = 3$ s. Tầm xa $L = v_0 t = 45 \\cdot 3 = 135$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một ô tô có khối lượng $m = 4$ tấn đang chạy với vận tốc $v_0 = 20$ m/s thì tắt máy và để xe trượt tự do trên đoạn đường nằm ngang có hệ số ma sát $\\mu = 0.4$ cho đến khi dừng hẳn. Tính quãng đường ô tô đi được (đơn vị: m; lấy $g = 10$ m/s$^2$).", "answer": "50", "explain": "Xe chỉ chịu lực ma sát nên gia tốc hãm $a = \\mu g = 0.4 \\cdot 10 = 4$ m/s$^2$ (không phụ thuộc khối lượng). Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{20^2}{2 \\cdot 4} = 50$ m.", "points": 0.5}]}]}
