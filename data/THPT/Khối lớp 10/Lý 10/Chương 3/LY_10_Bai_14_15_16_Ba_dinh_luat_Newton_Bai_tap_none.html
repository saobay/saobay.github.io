 vào hai vật khác nhau nên không phải hai lực cân bằng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một ô tô có khối lượng $m = 1.5$ tấn đang chạy với vận tốc $v_0 = 15$ m/s thì phanh gấp và dừng lại sau $t = 3$ s. Tính độ lớn lực hãm tác dụng lên ô tô (đơn vị: N; bỏ qua các lực khác).", "answer": "7500", "explain": "Gia tốc (chậm dần): $a = \\frac{v_0}{t} = \\frac{15}{3} = 5$ m/s$^2$. Theo định luật 2 Newton: $F = ma = 1500 \\cdot 5 = 7500$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một xe có khối lượng $m = 1000$ kg đang chuyển động với vận tốc $v_0 = 20$ m/s thì phanh và dừng lại sau khi đi được $s = 40$ m. Tính độ lớn lực hãm (đơn vị: N; bỏ qua các lực khác).", "answer": "5000", "explain": "Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $a = \\frac{v_0^2}{2s} = \\frac{20^2}{2 \\cdot 40} = 5$ m/s$^2$. Lực hãm $F = ma = 1000 \\cdot 5 = 5000$ N.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật có khối lượng $m = 4$ kg đang đứng yên trên mặt sàn nằm ngang nhẵn. Nếu hợp lực tác dụng lên vật bằng 0 thì vật sẽ:", "options": ["A. Chuyển động thẳng đều", "B. Chuyển động nhanh dần đều", "C. Tiếp tục đứng yên", "D. Tự dừng lại sau một thời gian"], "answer": "C", "explain": "Theo định luật 1 Newton: vật đang đứng yên sẽ tiếp tục đứng yên khi hợp lực tác dụng lên nó bằng 0 (tính quán tính giữ nguyên trạng thái ban đầu).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét trường hợp quả bóng đập vào tường. Theo định luật 3 Newton, cặp lực và phản lực ở đây là:", "options": ["A. Hai lực cùng đặt vào một vật nên chúng triệt tiêu nhau", "B. Lực bức tường tác dụng lên quả bóng và trọng lực của vật", "C. Chỉ có một lực duy nhất là lực bức tường tác dụng lên quả bóng", "D. Lực bức tường tác dụng lên quả bóng và lực quả bóng tác dụng lên bức tường"], "answer": "D", "explain": "Định luật 3 Newton: lực và phản lực luôn xuất hiện thành cặp, đặt vào HAI vật tương tác khác nhau (ở đây: bức tường tác dụng lên quả bóng và quả bóng tác dụng lên bức tường), cùng độ lớn, ngược chiều nên KHÔNG triệt tiêu nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một cầu thủ truyền cho quả bóng khối lượng 4 kg một gia tốc 2.5 m/s$^2$ (bỏ qua ma sát). Độ lớn của lực tác dụng là:", "options": ["A. $10$ N", "B. $1.6$ N", "C. $6.5$ N", "D. $5$ N"], "answer": "A", "explain": "Theo định luật 2 Newton: $F = ma = 4 \\cdot 2.5 = 10$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có khối lượng $m = 10$ kg chịu tác dụng của một lực không đổi $F = 50$ N (bỏ qua ma sát). Gia tốc của vật là:", "options": ["A. $500$ m/s$^2$", "B. $5$ m/s$^2$", "C. $0.2$ m/s$^2$", "D. $2.5$ m/s$^2$"], "answer": "B", "explain": "Theo định luật 2 Newton: $a = \\frac{F}{m} = \\frac{50}{10} = 5$ m/s$^2$. Gia tốc cùng hướng với lực tác dụng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có khối lượng $m = 12$ kg đang đứng yên thì chịu tác dụng của lực không đổi $F = 60$ N trong $t = 5$ s (bỏ qua ma sát). Vận tốc của vật sau thời gian đó là:", "options": ["A. $5$ m/s", "B. $300$ m/s", "C. $25$ m/s", "D. $12.5$ m/s"], "answer": "C", "explain": "Gia tốc $a = \\frac{F}{m} = \\frac{60}{12} = 5$ m/s$^2$. Vật bắt đầu từ trạng thái đứng yên nên $v = v_0 + at = 0 + 5 \\cdot 5 = 25$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một khẩu súng có khối lượng $M = 5$ kg bắn ra một viên đạn khối lượng $m = 0.01$ kg với vận tốc $v = 500$ m/s theo phương ngang (lúc đầu súng đứng yên, bỏ qua ma sát). Vận tốc giật lùi của súng có độ lớn xấp xỉ:", "options": ["A. $2$ m/s", "B. $500$ m/s", "C. $0.5$ m/s", "D. $1$ m/s"], "answer": "D", "explain": "Theo định luật 3 Newton, lực súng tác dụng lên đạn và lực đạn tác dụng lên súng là cặp lực - phản lực, cùng độ lớn trong cùng thời gian nên $M \\cdot V = m \\cdot v$, suy ra $V = \\frac{mv}{M} = \\frac{0.01 \\cdot 500}{5} = 1$ m/s (ngược hướng viên đạn).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét các phát biểu về định luật 1 Newton và quán tính (vật khối lượng $m = 4$ kg):", "statements": ["a) Một vật khối lượng $m = 4$ kg đang đứng yên; nếu hợp lực tác dụng lên vật bằng 0 thì vật tiếp tục đứng yên.", "b) Quán tính là tính chất của mọi vật có xu hướng bảo toàn vận tốc cả về hướng và độ lớn.", "c) Khối lượng càng lớn thì mức quán tính của vật càng nhỏ.", "d) Theo định luật 1 Newton, lực là nguyên nhân duy trì chuyển động của vật."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng (định luật 1 Newton). b) Đúng. c) Sai: khối lượng càng lớn thì mức quán tính càng LỚN.. d) Sai: lực là nguyên nhân làm BIẾN ĐỔI vận tốc, không phải nguyên nhân duy trì chuyển động; khi hợp lực bằng 0, vật đang chuyển động sẽ chuyển động thẳng đều mãi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một vật khối lượng $m = 12$ kg chịu tác dụng của lực $F = 48$ N. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực $F = 48$ N tác dụng lên vật khối lượng $m = 12$ kg gây ra gia tốc $a = 4$ m/s$^2$.", "b) Khi $F$ không đổi, gia tốc của vật tỉ lệ nghịch với khối lượng của vật.", "c) Đơn vị của lực trong hệ SI là kg.m/s.", "d) Lực tác dụng và phản lực là hai lực cân bằng vì chúng ngược chiều nhau."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $a = F/m = 48/12 = 4$ m/s$^2$. b) Đúng: $a = F/m$. c) Sai: đơn vị của lực là niutơn (N), $1$ N $= 1$ kg.m/s$^2$. d) Sai: lực và phản lực đặt vào hai vật khác nhau nên không phải hai lực cân bằng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một ô tô có khối lượng $m = 2$ tấn đang chạy với vận tốc $v_0 = 25$ m/s thì phanh gấp và dừng lại sau $t = 5$ s. Tính độ lớn lực hãm tác dụng lên ô tô (đơn vị: N; bỏ qua các lực khác).", "answer": "10000", "explain": "Gia tốc (chậm dần): $a = \\frac{v_0}{t} = \\frac{25}{5} = 5$ m/s$^2$. Theo định luật 2 Newton: $F = ma = 2000 \\cdot 5 = 10000$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một xe có khối lượng $m = 1500$ kg đang chuyển động với vận tốc $v_0 = 30$ m/s thì phanh với lực hãm không đổi $F = 9000$ N. Tính quãng đường xe đi được cho đến khi dừng hẳn (đơn vị: m; bỏ qua các lực khác).", "answer": "75", "explain": "Gia tốc hãm: $a = \\frac{F}{m} = \\frac{9000}{1500} = 6$ m/s$^2$. Áp dụng $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{30^2}{2 \\cdot 6} = 75$ m.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật có khối lượng $m = 10$ kg đang đứng yên trên mặt sàn nằm ngang nhẵn. Nếu hợp lực tác dụng lên vật bằng 0 thì vật sẽ:", "options": ["A. Chuyển động thẳng đều", "B. Chuyển động nhanh dần đều", "C. Tự dừng lại sau một thời gian", "D. Tiếp tục đứng yên"], "answer": "D", "explain": "Theo định luật 1 Newton: vật đang đứng yên sẽ tiếp tục đứng yên khi hợp lực tác dụng lên nó bằng 0 (tính quán tính giữ nguyên trạng thái ban đầu).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét trường hợp quyển sách đặt trên mặt bàn. Theo định luật 3 Newton, cặp lực và phản lực ở đây là:", "options": ["A. Lực mặt bàn tác dụng lên quyển sách và lực quyển sách tác dụng lên mặt bàn", "B. Hai lực cùng đặt vào một vật nên chúng triệt tiêu nhau", "C. Lực mặt bàn tác dụng lên quyển sách và trọng lực của vật", "D. Chỉ có một lực duy nhất là lực mặt bàn tác dụng lên quyển sách"], "answer": "A", "explain": "Định luật 3 Newton: lực và phản lực luôn xuất hiện thành cặp, đặt vào HAI vật tương tác khác nhau (ở đây: mặt bàn tác dụng lên quyển sách và quyển sách tác dụng lên mặt bàn), cùng độ lớn, ngược chiều nên KHÔNG triệt tiêu nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người đẩy một chiếc xe hàng có khối lượng 10 kg với gia tốc 1.5 m/s$^2$ (bỏ qua ma sát). Độ lớn của lực tác dụng là:", "options": ["A. $6.67$ N", "B. $15$ N", "C. $11.5$ N", "D. $7.5$ N"], "answer": "B", "explain": "Theo định luật 2 Newton: $F = ma = 10 \\cdot 1.5 = 15$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có khối lượng $m = 3$ kg chịu tác dụng của một lực không đổi $F = 15$ N (bỏ qua ma sát). Gia tốc của vật là:", "options": ["A. $45$ m/s$^2$", "B. $0.2$ m/s$^2$", "C. $5$ m/s$^2$", "D. $2.5$ m/s$^2$"], "answer": "C", "explain": "Theo định luật 2 Newton: $a = \\frac{F}{m} = \\frac{15}{3} = 5$ m/s$^2$. Gia tốc cùng hướng với lực tác dụng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có khối lượng $m = 20$ kg đang đứng yên thì chịu tác dụng của lực không đổi $F = 100$ N trong $t = 2$ s (bỏ qua ma sát). Vận tốc của vật sau thời gian đó là:", "options": ["A. $5$ m/s", "B. $200$ m/s", "C. $5$ m/s", "D. $10$ m/s"], "answer": "D", "explain": "Gia tốc $a = \\frac{F}{m} = \\frac{100}{20} = 5$ m/s$^2$. Vật bắt đầu từ trạng thái đứng yên nên $v = v_0 + at = 0 + 5 \\cdot 2 = 10$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ngụy biện: người dùng búa đóng đinh — lực cái búa tác dụng lên cái đinh và phản lực cái đinh tác dụng lên cái búa triệt tiêu nhau nên vật không thể chuyển động. Chỗ sai của ngụy biện này là:", "options": ["A. Hai lực đặt vào hai vật khác nhau nên không thể triệt tiêu nhau", "B. Định luật 3 Newton chỉ đúng với vật đứng yên", "C. Lực và phản lực luôn có độ lớn khác nhau", "D. Phản lực luôn xuất hiện trước lực tác dụng"], "answer": "A", "explain": "Theo định luật 3 Newton, cặp lực - phản lực đặt vào HAI vật khác nhau (cái búa và cái đinh) nên không bao giờ triệt tiêu nhau. Vật chuyển động hay không phụ thuộc vào hợp lực tác dụng lên CHÍNH vật đó.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét các phát biểu về định luật 1 Newton và quán tính (vật khối lượng $m = 10$ kg):", "statements": ["a) Một vật khối lượng $m = 10$ kg đang đứng yên; nếu hợp lực tác dụng lên vật bằng 0 thì vật tiếp tục đứng yên.", "b) Mọi vật đều có quán tính, không phụ thuộc vào trạng thái chuyển động của vật.", "c) Vật có khối lượng lớn thì khó thay đổi vận tốc hơn vật có khối lượng nhỏ.", "d) Nếu không có lực tác dụng thì vật đang chuyển động sẽ dừng lại ngay lập tức."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng (định luật 1 Newton). b) Đúng. c) Đúng: khối lượng là số đo mức quán tính.. d) Sai: lực là nguyên nhân làm BIẾN ĐỔI vận tốc, không phải nguyên nhân duy trì chuyển động; khi hợp lực bằng 0, vật đang chuyển động sẽ chuyển động thẳng đều mãi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một vật khối lượng $m = 13$ kg chịu tác dụng của lực $F = 65$ N. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực $F = 65$ N tác dụng lên vật khối lượng $m = 13$ kg gây ra gia tốc $a = 5$ m/s$^2$.", "b) Khi $F$ không đổi, gia tốc của vật tỉ lệ nghịch với khối lượng của vật.", "c) Đơn vị của lực trong hệ SI là kg.m/s.", "d) Lực tác dụng và phản lực là hai lực cân bằng vì chúng ngược chiều nhau."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $a = F/m = 65/13 = 5$ m/s$^2$. b) Đúng: $a = F/m$. c) Sai: đơn vị của lực là niutơn (N), $1$ N $= 1$ kg.m/s$^2$. d) Sai: lực và phản lực đặt vào hai vật khác nhau nên không phải hai lực cân bằng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một ô tô có khối lượng $m = 1.2$ tấn đang chạy với vận tốc $v_0 = 18$ m/s thì phanh gấp và dừng lại sau $t = 6$ s. Tính độ lớn lực hãm tác dụng lên ô tô (đơn vị: N; bỏ qua các lực khác).", "answer": "3600", "explain": "Gia tốc (chậm dần): $a = \\frac{v_0}{t} = \\frac{18}{6} = 3$ m/s$^2$. Theo định luật 2 Newton: $F = ma = 1200 \\cdot 3 = 3600$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một xe có khối lượng $m = 1500$ kg đang chuyển động với vận tốc $v_0 = 30$ m/s thì phanh và dừng lại sau khi đi được $s = 75$ m. Tính độ lớn lực hãm (đơn vị: N; bỏ qua các lực khác).", "answer": "9000", "explain": "Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $a = \\frac{v_0^2}{2s} = \\frac{30^2}{2 \\cdot 75} = 6$ m/s$^2$. Lực hãm $F = ma = 1500 \\cdot 6 = 9000$ N.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật có khối lượng $m = 3$ kg đang đứng yên trên mặt sàn nằm ngang nhẵn. Nếu hợp lực tác dụng lên vật bằng 0 thì vật sẽ:", "options": ["A. Tiếp tục đứng yên", "B. Chuyển động thẳng đều", "C. Chuyển động nhanh dần đều", "D. Tự dừng lại sau một thời gian"], "answer": "A", "explain": "Theo định luật 1 Newton: vật đang đứng yên sẽ tiếp tục đứng yên khi hợp lực tác dụng lên nó bằng 0 (tính quán tính giữ nguyên trạng thái ban đầu).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét trường hợp con ngựa kéo chiếc xe. Theo định luật 3 Newton, cặp lực và phản lực ở đây là:", "options": ["A. Hai lực cùng đặt vào một vật nên chúng triệt tiêu nhau", "B. Lực chiếc xe tác dụng lên con ngựa và lực con ngựa tác dụng lên chiếc xe", "C. Lực chiếc xe tác dụng lên con ngựa và trọng lực của vật", "D. Chỉ có một lực duy nhất là lực chiếc xe tác dụng lên con ngựa"], "answer": "B", "explain": "Định luật 3 Newton: lực và phản lực luôn xuất hiện thành cặp, đặt vào HAI vật tương tác khác nhau (ở đây: chiếc xe tác dụng lên con ngựa và con ngựa tác dụng lên chiếc xe), cùng độ lớn, ngược chiều nên KHÔNG triệt tiêu nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một lực tác dụng lên vật có khối lượng 3 kg gây ra gia tốc 4 m/s$^2$ (bỏ qua ma sát). Độ lớn của lực tác dụng là:", "options": ["A. $0.75$ N", "B. $7$ N", "C. $12$ N", "D. $6$ N"], "answer": "C", "explain": "Theo định luật 2 Newton: $F = ma = 3 \\cdot 4 = 12$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có khối lượng $m = 25$ kg chịu tác dụng của một lực không đổi $F = 100$ N (bỏ qua ma sát). Gia tốc của vật là:", "options": ["A. $2500$ m/s$^2$", "B. $0.25$ m/s$^2$", "C. $2$ m/s$^2$", "D. $4$ m/s$^2$"], "answer": "D", "explain": "Theo định luật 2 Newton: $a = \\frac{F}{m} = \\frac{100}{25} = 4$ m/s$^2$. Gia tốc cùng hướng với lực tác dụng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có khối lượng $m = 9$ kg đang đứng yên thì chịu tác dụng của lực không đổi $F = 45$ N trong $t = 6$ s (bỏ qua ma sát). Vận tốc của vật sau thời gian đó là:", "options": ["A. $30$ m/s", "B. $5$ m/s", "C. $270$ m/s", "D. $15$ m/s"], "answer": "A", "explain": "Gia tốc $a = \\frac{F}{m} = \\frac{45}{9} = 5$ m/s$^2$. Vật bắt đầu từ trạng thái đứng yên nên $v = v_0 + at = 0 + 5 \\cdot 6 = 30$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một khẩu súng có khối lượng $M = 3$ kg bắn ra một viên đạn khối lượng $m = 0.01$ kg với vận tốc $v = 300$ m/s theo phương ngang (lúc đầu súng đứng yên, bỏ qua ma sát). Vận tốc giật lùi của súng có độ lớn xấp xỉ:", "options": ["A. $3$ m/s", "B. $1.5$ m/s", "C. $300$ m/s", "D. $0.75$ m/s"], "answer": "B", "explain": "Theo định luật 3 Newton, lực súng tác dụng lên đạn và lực đạn tác dụng lên súng là cặp lực - phản lực, cùng độ lớn trong cùng thời gian nên $M \\cdot V = m \\cdot v$, suy ra $V = \\frac{mv}{M} = \\frac{0.01 \\cdot 300}{3} = 1.5$ m/s (ngược hướng viên đạn).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét các phát biểu về định luật 1 Newton và quán tính (vật khối lượng $m = 3$ kg):", "statements": ["a) Một vật khối lượng $m = 3$ kg đang đứng yên; nếu hợp lực tác dụng lên vật bằng 0 thì vật tiếp tục đứng yên.", "b) Quán tính là tính chất của mọi vật có xu hướng bảo toàn vận tốc cả về hướng và độ lớn.", "c) Khối lượng càng lớn thì mức quán tính của vật càng nhỏ.", "d) Theo định luật 1 Newton, lực là nguyên nhân duy trì chuyển động của vật."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng (định luật 1 Newton). b) Đúng. c) Sai: khối lượng càng lớn thì mức quán tính càng LỚN.. d) Sai: lực là nguyên nhân làm BIẾN ĐỔI vận tốc, không phải nguyên nhân duy trì chuyển động; khi hợp lực bằng 0, vật đang chuyển động sẽ chuyển động thẳng đều mãi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một vật khối lượng $m = 18$ kg chịu tác dụng của lực $F = 72$ N. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực $F = 72$ N tác dụng lên vật khối lượng $m = 18$ kg gây ra gia tốc $a = 4$ m/s$^2$.", "b) Khi $F$ không đổi, gia tốc của vật tỉ lệ nghịch với khối lượng của vật.", "c) Đơn vị của lực trong hệ SI là kg.m/s.", "d) Lực tác dụng và phản lực là hai lực cân bằng vì chúng ngược chiều nhau."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $a = F/m = 72/18 = 4$ m/s$^2$. b) Đúng: $a = F/m$. c) Sai: đơn vị của lực là niutơn (N), $1$ N $= 1$ kg.m/s$^2$. d) Sai: lực và phản lực đặt vào hai vật khác nhau nên không phải hai lực cân bằng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một ô tô có khối lượng $m = 2.5$ tấn đang chạy với vận tốc $v_0 = 20$ m/s thì phanh gấp và dừng lại sau $t = 5$ s. Tính độ lớn lực hãm tác dụng lên ô tô (đơn vị: N; bỏ qua các lực khác).", "answer": "10000", "explain": "Gia tốc (chậm dần): $a = \\frac{v_0}{t} = \\frac{20}{5} = 4$ m/s$^2$. Theo định luật 2 Newton: $F = ma = 2500 \\cdot 4 = 10000$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một xe có khối lượng $m = 2000$ kg đang chuyển động với vận tốc $v_0 = 20$ m/s thì phanh với lực hãm không đổi $F = 8000$ N. Tính quãng đường xe đi được cho đến khi dừng hẳn (đơn vị: m; bỏ qua các lực khác).", "answer": "50", "explain": "Gia tốc hãm: $a = \\frac{F}{m} = \\frac{8000}{2000} = 4$ m/s$^2$. Áp dụng $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{20^2}{2 \\cdot 4} = 50$ m.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật có khối lượng $m = 8$ kg đang đứng yên trên mặt sàn nằm ngang nhẵn. Nếu hợp lực tác dụng lên vật bằng 0 thì vật sẽ:", "options": ["A. Chuyển động thẳng đều", "B. Tiếp tục đứng yên", "C. Chuyển động nhanh dần đều", "D. Tự dừng lại sau một thời gian"], "answer": "B", "explain": "Theo định luật 1 Newton: vật đang đứng yên sẽ tiếp tục đứng yên khi hợp lực tác dụng lên nó bằng 0 (tính quán tính giữ nguyên trạng thái ban đầu).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét trường hợp quả bóng đập vào tường. Theo định luật 3 Newton, cặp lực và phản lực ở đây là:", "options": ["A. Hai lực cùng đặt vào một vật nên chúng triệt tiêu nhau", "B. Lực bức tường tác dụng lên quả bóng và trọng lực của vật", "C. Lực bức tường tác dụng lên quả bóng và lực quả bóng tác dụng lên bức tường", "D. Chỉ có một lực duy nhất là lực bức tường tác dụng lên quả bóng"], "answer": "C", "explain": "Định luật 3 Newton: lực và phản lực luôn xuất hiện thành cặp, đặt vào HAI vật tương tác khác nhau (ở đây: bức tường tác dụng lên quả bóng và quả bóng tác dụng lên bức tường), cùng độ lớn, ngược chiều nên KHÔNG triệt tiêu nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một cầu thủ truyền cho quả bóng khối lượng 8 kg một gia tốc 2 m/s$^2$ (bỏ qua ma sát). Độ lớn của lực tác dụng là:", "options": ["A. $4$ N", "B. $10$ N", "C. $8$ N", "D. $16$ N"], "answer": "D", "explain": "Theo định luật 2 Newton: $F = ma = 8 \\cdot 2 = 16$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có khối lượng $m = 12$ kg chịu tác dụng của một lực không đổi $F = 60$ N (bỏ qua ma sát). Gia tốc của vật là:", "options": ["A. $5$ m/s$^2$", "B. $720$ m/s$^2$", "C. $0.2$ m/s$^2$", "D. $2.5$ m/s$^2$"], "answer": "A", "explain": "Theo định luật 2 Newton: $a = \\frac{F}{m} = \\frac{60}{12} = 5$ m/s$^2$. Gia tốc cùng hướng với lực tác dụng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có khối lượng $m = 10$ kg đang đứng yên thì chịu tác dụng của lực không đổi $F = 50$ N trong $t = 7$ s (bỏ qua ma sát). Vận tốc của vật sau thời gian đó là:", "options": ["A. $5$ m/s", "B. $35$ m/s", "C. $350$ m/s", "D. $17.5$ m/s"], "answer": "B", "explain": "Gia tốc $a = \\frac{F}{m} = \\frac{50}{10} = 5$ m/s$^2$. Vật bắt đầu từ trạng thái đứng yên nên $v = v_0 + at = 0 + 5 \\cdot 7 = 35$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ngụy biện: vận động viên bơi đạp chân vào thành bể — lực người bơi tác dụng lên thành bể và phản lực thành bể tác dụng lên người bơi triệt tiêu nhau nên vật không thể chuyển động. Chỗ sai của ngụy biện này là:", "options": ["A. Định luật 3 Newton chỉ đúng với vật đứng yên", "B. Lực và phản lực luôn có độ lớn khác nhau", "C. Hai lực đặt vào hai vật khác nhau nên không thể triệt tiêu nhau", "D. Phản lực luôn xuất hiện trước lực tác dụng"], "answer": "C", "explain": "Theo định luật 3 Newton, cặp lực - phản lực đặt vào HAI vật khác nhau (người bơi và thành bể) nên không bao giờ triệt tiêu nhau. Vật chuyển động hay không phụ thuộc vào hợp lực tác dụng lên CHÍNH vật đó.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét các phát biểu về định luật 1 Newton và quán tính (vật khối lượng $m = 8$ kg):", "statements": ["a) Một vật khối lượng $m = 8$ kg đang đứng yên; nếu hợp lực tác dụng lên vật bằng 0 thì vật tiếp tục đứng yên.", "b) Mọi vật đều có quán tính, không phụ thuộc vào trạng thái chuyển động của vật.", "c) Vật có khối lượng lớn thì khó thay đổi vận tốc hơn vật có khối lượng nhỏ.", "d) Nếu không có lực tác dụng thì vật đang chuyển động sẽ dừng lại ngay lập tức."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng (định luật 1 Newton). b) Đúng. c) Đúng: khối lượng là số đo mức quán tính.. d) Sai: lực là nguyên nhân làm BIẾN ĐỔI vận tốc, không phải nguyên nhân duy trì chuyển động; khi hợp lực bằng 0, vật đang chuyển động sẽ chuyển động thẳng đều mãi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một vật khối lượng $m = 13$ kg chịu tác dụng của lực $F = 91$ N. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực $F = 91$ N tác dụng lên vật khối lượng $m = 13$ kg gây ra gia tốc $a = 7$ m/s$^2$.", "b) Khi $F$ không đổi, gia tốc của vật tỉ lệ nghịch với khối lượng của vật.", "c) Đơn vị của lực trong hệ SI là kg.m/s.", "d) Lực tác dụng và phản lực là hai lực cân bằng vì chúng ngược chiều nhau."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $a = F/m = 91/13 = 7$ m/s$^2$. b) Đúng: $a = F/m$. c) Sai: đơn vị của lực là niutơn (N), $1$ N $= 1$ kg.m/s$^2$. d) Sai: lực và phản lực đặt vào hai vật khác nhau nên không phải hai lực cân bằng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một ô tô có khối lượng $m = 1$ tấn đang chạy với vận tốc $v_0 = 10$ m/s thì phanh gấp và dừng lại sau $t = 2$ s. Tính độ lớn lực hãm tác dụng lên ô tô (đơn vị: N; bỏ qua các lực khác).", "answer": "5000", "explain": "Gia tốc (chậm dần): $a = \\frac{v_0}{t} = \\frac{10}{2} = 5$ m/s$^2$. Theo định luật 2 Newton: $F = ma = 1000 \\cdot 5 = 5000$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một xe có khối lượng $m = 2000$ kg đang chuyển động với vận tốc $v_0 = 20$ m/s thì phanh và dừng lại sau khi đi được $s = 50$ m. Tính độ lớn lực hãm (đơn vị: N; bỏ qua các lực khác).", "answer": "8000", "explain": "Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $a = \\frac{v_0^2}{2s} = \\frac{20^2}{2 \\cdot 50} = 4$ m/s$^2$. Lực hãm $F = ma = 2000 \\cdot 4 = 8000$ N.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật có khối lượng $m = 6$ kg đang đứng yên trên mặt sàn nằm ngang nhẵn. Nếu hợp lực tác dụng lên vật bằng 0 thì vật sẽ:", "options": ["A. Chuyển động thẳng đều", "B. Chuyển động nhanh dần đều", "C. Tiếp tục đứng yên", "D. Tự dừng lại sau một thời gian"], "answer": "C", "explain": "Theo định luật 1 Newton: vật đang đứng yên sẽ tiếp tục đứng yên khi hợp lực tác dụng lên nó bằng 0 (tính quán tính giữ nguyên trạng thái ban đầu).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét trường hợp quyển sách đặt trên mặt bàn. Theo định luật 3 Newton, cặp lực và phản lực ở đây là:", "options": ["A. Hai lực cùng đặt vào một vật nên chúng triệt tiêu nhau", "B. Lực mặt bàn tác dụng lên quyển sách và trọng lực của vật", "C. Chỉ có một lực duy nhất là lực mặt bàn tác dụng lên quyển sách", "D. Lực mặt bàn tác dụng lên quyển sách và lực quyển sách tác dụng lên mặt bàn"], "answer": "D", "explain": "Định luật 3 Newton: lực và phản lực luôn xuất hiện thành cặp, đặt vào HAI vật tương tác khác nhau (ở đây: mặt bàn tác dụng lên quyển sách và quyển sách tác dụng lên mặt bàn), cùng độ lớn, ngược chiều nên KHÔNG triệt tiêu nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người đẩy một chiếc xe hàng có khối lượng 6 kg với gia tốc 5 m/s$^2$ (bỏ qua ma sát). Độ lớn của lực tác dụng là:", "options": ["A. $30$ N", "B. $1.2$ N", "C. $11$ N", "D. $15$ N"], "answer": "A", "explain": "Theo định luật 2 Newton: $F = ma = 6 \\cdot 5 = 30$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có khối lượng $m = 9$ kg chịu tác dụng của một lực không đổi $F = 45$ N (bỏ qua ma sát). Gia tốc của vật là:", "options": ["A. $405$ m/s$^2$", "B. $5$ m/s$^2$", "C. $0.2$ m/s$^2$", "D. $2.5$ m/s$^2$"], "answer": "B", "explain": "Theo định luật 2 Newton: $a = \\frac{F}{m} = \\frac{45}{9} = 5$ m/s$^2$. Gia tốc cùng hướng với lực tác dụng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có khối lượng $m = 9$ kg đang đứng yên thì chịu tác dụng của lực không đổi $F = 36$ N trong $t = 5$ s (bỏ qua ma sát). Vận tốc của vật sau thời gian đó là:", "options": ["A. $4$ m/s", "B. $180$ m/s", "C. $20$ m/s", "D. $10$ m/s"], "answer": "C", "explain": "Gia tốc $a = \\frac{F}{m} = \\frac{36}{9} = 4$ m/s$^2$. Vật bắt đầu từ trạng thái đứng yên nên $v = v_0 + at = 0 + 4 \\cdot 5 = 20$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một khẩu súng có khối lượng $M = 4$ kg bắn ra một viên đạn khối lượng $m = 0.03$ kg với vận tốc $v = 320$ m/s theo phương ngang (lúc đầu súng đứng yên, bỏ qua ma sát). Vận tốc giật lùi của súng có độ lớn xấp xỉ:", "options": ["A. $4$ m/s", "B. $320$ m/s", "C. $1$ m/s", "D. $2$ m/s"], "answer": "D", "explain": "Theo định luật 3 Newton, lực súng tác dụng lên đạn và lực đạn tác dụng lên súng là cặp lực - phản lực, cùng độ lớn trong cùng thời gian nên $M \\cdot V = m \\cdot v$, suy ra $V = \\frac{mv}{M} = \\frac{0.03 \\cdot 320}{4} = 2$ m/s (ngược hướng viên đạn).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét các phát biểu về định luật 1 Newton và quán tính (vật khối lượng $m = 6$ kg):", "statements": ["a) Một vật khối lượng $m = 6$ kg đang đứng yên; nếu hợp lực tác dụng lên vật bằng 0 thì vật tiếp tục đứng yên.", "b) Quán tính là tính chất của mọi vật có xu hướng bảo toàn vận tốc cả về hướng và độ lớn.", "c) Khối lượng càng lớn thì mức quán tính của vật càng nhỏ.", "d) Theo định luật 1 Newton, lực là nguyên nhân duy trì chuyển động của vật."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng (định luật 1 Newton). b) Đúng. c) Sai: khối lượng càng lớn thì mức quán tính càng LỚN.. d) Sai: lực là nguyên nhân làm BIẾN ĐỔI vận tốc, không phải nguyên nhân duy trì chuyển động; khi hợp lực bằng 0, vật đang chuyển động sẽ chuyển động thẳng đều mãi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một vật khối lượng $m = 24$ kg chịu tác dụng của lực $F = 96$ N. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực $F = 96$ N tác dụng lên vật khối lượng $m = 24$ kg gây ra gia tốc $a = 4$ m/s$^2$.", "b) Khi $F$ không đổi, gia tốc của vật tỉ lệ nghịch với khối lượng của vật.", "c) Đơn vị của lực trong hệ SI là kg.m/s.", "d) Lực tác dụng và phản lực là hai lực cân bằng vì chúng ngược chiều nhau."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $a = F/m = 96/24 = 4$ m/s$^2$. b) Đúng: $a = F/m$. c) Sai: đơn vị của lực là niutơn (N), $1$ N $= 1$ kg.m/s$^2$. d) Sai: lực và phản lực đặt vào hai vật khác nhau nên không phải hai lực cân bằng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một ô tô có khối lượng $m = 3$ tấn đang chạy với vận tốc $v_0 = 30$ m/s thì phanh gấp và dừng lại sau $t = 6$ s. Tính độ lớn lực hãm tác dụng lên ô tô (đơn vị: N; bỏ qua các lực khác).", "answer": "15000", "explain": "Gia tốc (chậm dần): $a = \\frac{v_0}{t} = \\frac{30}{6} = 5$ m/s$^2$. Theo định luật 2 Newton: $F = ma = 3000 \\cdot 5 = 15000$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một xe có khối lượng $m = 1200$ kg đang chuyển động với vận tốc $v_0 = 24$ m/s thì phanh với lực hãm không đổi $F = 7200$ N. Tính quãng đường xe đi được cho đến khi dừng hẳn (đơn vị: m; bỏ qua các lực khác).", "answer": "48", "explain": "Gia tốc hãm: $a = \\frac{F}{m} = \\frac{7200}{1200} = 6$ m/s$^2$. Áp dụng $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{24^2}{2 \\cdot 6} = 48$ m.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật có khối lượng $m = 12$ kg đang đứng yên trên mặt sàn nằm ngang nhẵn. Nếu hợp lực tác dụng lên vật bằng 0 thì vật sẽ:", "options": ["A. Chuyển động thẳng đều", "B. Chuyển động nhanh dần đều", "C. Tự dừng lại sau một thời gian", "D. Tiếp tục đứng yên"], "answer": "D", "explain": "Theo định luật 1 Newton: vật đang đứng yên sẽ tiếp tục đứng yên khi hợp lực tác dụng lên nó bằng 0 (tính quán tính giữ nguyên trạng thái ban đầu).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét trường hợp con ngựa kéo chiếc xe. Theo định luật 3 Newton, cặp lực và phản lực ở đây là:", "options": ["A. Lực chiếc xe tác dụng lên con ngựa và lực con ngựa tác dụng lên chiếc xe", "B. Hai lực cùng đặt vào một vật nên chúng triệt tiêu nhau", "C. Lực chiếc xe tác dụng lên con ngựa và trọng lực của vật", "D. Chỉ có một lực duy nhất là lực chiếc xe tác dụng lên con ngựa"], "answer": "A", "explain": "Định luật 3 Newton: lực và phản lực luôn xuất hiện thành cặp, đặt vào HAI vật tương tác khác nhau (ở đây: chiếc xe tác dụng lên con ngựa và con ngựa tác dụng lên chiếc xe), cùng độ lớn, ngược chiều nên KHÔNG triệt tiêu nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một lực tác dụng lên vật có khối lượng 12 kg gây ra gia tốc 3 m/s$^2$ (bỏ qua ma sát). Độ lớn của lực tác dụng là:", "options": ["A. $4$ N", "B. $36$ N", "C. $15$ N", "D. $18$ N"], "answer": "B", "explain": "Theo định luật 2 Newton: $F = ma = 12 \\cdot 3 = 36$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có khối lượng $m = 15$ kg chịu tác dụng của một lực không đổi $F = 90$ N (bỏ qua ma sát). Gia tốc của vật là:", "options": ["A. $1350$ m/s$^2$", "B. $0.17$ m/s$^2$", "C. $6$ m/s$^2$", "D. $3$ m/s$^2$"], "answer": "C", "explain": "Theo định luật 2 Newton: $a = \\frac{F}{m} = \\frac{90}{15} = 6$ m/s$^2$. Gia tốc cùng hướng với lực tác dụng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có khối lượng $m = 16$ kg đang đứng yên thì chịu tác dụng của lực không đổi $F = 80$ N trong $t = 4$ s (bỏ qua ma sát). Vận tốc của vật sau thời gian đó là:", "options": ["A. $5$ m/s", "B. $320$ m/s", "C. $10$ m/s", "D. $20$ m/s"], "answer": "D", "explain": "Gia tốc $a = \\frac{F}{m} = \\frac{80}{16} = 5$ m/s$^2$. Vật bắt đầu từ trạng thái đứng yên nên $v = v_0 + at = 0 + 5 \\cdot 4 = 20$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ngụy biện: con ngựa kéo chiếc xe — lực con ngựa tác dụng lên chiếc xe và phản lực chiếc xe tác dụng lên con ngựa triệt tiêu nhau nên vật không thể chuyển động. Chỗ sai của ngụy biện này là:", "options": ["A. Hai lực đặt vào hai vật khác nhau nên không thể triệt tiêu nhau", "B. Định luật 3 Newton chỉ đúng với vật đứng yên", "C. Lực và phản lực luôn có độ lớn khác nhau", "D. Phản lực luôn xuất hiện trước lực tác dụng"], "answer": "A", "explain": "Theo định luật 3 Newton, cặp lực - phản lực đặt vào HAI vật khác nhau (con ngựa và chiếc xe) nên không bao giờ triệt tiêu nhau. Vật chuyển động hay không phụ thuộc vào hợp lực tác dụng lên CHÍNH vật đó.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét các phát biểu về định luật 1 Newton và quán tính (vật khối lượng $m = 12$ kg):", "statements": ["a) Một vật khối lượng $m = 12$ kg đang đứng yên; nếu hợp lực tác dụng lên vật bằng 0 thì vật tiếp tục đứng yên.", "b) Mọi vật đều có quán tính, không phụ thuộc vào trạng thái chuyển động của vật.", "c) Vật có khối lượng lớn thì khó thay đổi vận tốc hơn vật có khối lượng nhỏ.", "d) Nếu không có lực tác dụng thì vật đang chuyển động sẽ dừng lại ngay lập tức."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng (định luật 1 Newton). b) Đúng. c) Đúng: khối lượng là số đo mức quán tính.. d) Sai: lực là nguyên nhân làm BIẾN ĐỔI vận tốc, không phải nguyên nhân duy trì chuyển động; khi hợp lực bằng 0, vật đang chuyển động sẽ chuyển động thẳng đều mãi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một vật khối lượng $m = 13$ kg chịu tác dụng của lực $F = 117$ N. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực $F = 117$ N tác dụng lên vật khối lượng $m = 13$ kg gây ra gia tốc $a = 9$ m/s$^2$.", "b) Khi $F$ không đổi, gia tốc của vật tỉ lệ nghịch với khối lượng của vật.", "c) Đơn vị của lực trong hệ SI là kg.m/s.", "d) Lực tác dụng và phản lực là hai lực cân bằng vì chúng ngược chiều nhau."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $a = F/m = 117/13 = 9$ m/s$^2$. b) Đúng: $a = F/m$. c) Sai: đơn vị của lực là niutơn (N), $1$ N $= 1$ kg.m/s$^2$. d) Sai: lực và phản lực đặt vào hai vật khác nhau nên không phải hai lực cân bằng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một ô tô có khối lượng $m = 2$ tấn đang chạy với vận tốc $v_0 = 36$ m/s thì phanh gấp và dừng lại sau $t = 9$ s. Tính độ lớn lực hãm tác dụng lên ô tô (đơn vị: N; bỏ qua các lực khác).", "answer": "8000", "explain": "Gia tốc (chậm dần): $a = \\frac{v_0}{t} = \\frac{36}{9} = 4$ m/s$^2$. Theo định luật 2 Newton: $F = ma = 2000 \\cdot 4 = 8000$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một xe có khối lượng $m = 1200$ kg đang chuyển động với vận tốc $v_0 = 24$ m/s thì phanh và dừng lại sau khi đi được $s = 48$ m. Tính độ lớn lực hãm (đơn vị: N; bỏ qua các lực khác).", "answer": "7200", "explain": "Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $a = \\frac{v_0^2}{2s} = \\frac{24^2}{2 \\cdot 48} = 6$ m/s$^2$. Lực hãm $F = ma = 1200 \\cdot 6 = 7200$ N.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật có khối lượng $m = 15$ kg đang đứng yên trên mặt sàn nằm ngang nhẵn. Nếu hợp lực tác dụng lên vật bằng 0 thì vật sẽ:", "options": ["A. Tiếp tục đứng yên", "B. Chuyển động thẳng đều", "C. Chuyển động nhanh dần đều", "D. Tự dừng lại sau một thời gian"], "answer": "A", "explain": "Theo định luật 1 Newton: vật đang đứng yên sẽ tiếp tục đứng yên khi hợp lực tác dụng lên nó bằng 0 (tính quán tính giữ nguyên trạng thái ban đầu).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét trường hợp quả bóng đập vào tường. Theo định luật 3 Newton, cặp lực và phản lực ở đây là:", "options": ["A. Hai lực cùng đặt vào một vật nên chúng triệt tiêu nhau", "B. Lực bức tường tác dụng lên quả bóng và lực quả bóng tác dụng lên bức tường", "C. Lực bức tường tác dụng lên quả bóng và trọng lực của vật", "D. Chỉ có một lực duy nhất là lực bức tường tác dụng lên quả bóng"], "answer": "B", "explain": "Định luật 3 Newton: lực và phản lực luôn xuất hiện thành cặp, đặt vào HAI vật tương tác khác nhau (ở đây: bức tường tác dụng lên quả bóng và quả bóng tác dụng lên bức tường), cùng độ lớn, ngược chiều nên KHÔNG triệt tiêu nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một cầu thủ truyền cho quả bóng khối lượng 15 kg một gia tốc 4 m/s$^2$ (bỏ qua ma sát). Độ lớn của lực tác dụng là:", "options": ["A. $3.75$ N", "B. $19$ N", "C. $60$ N", "D. $30$ N"], "answer": "C", "explain": "Theo định luật 2 Newton: $F = ma = 15 \\cdot 4 = 60$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có khối lượng $m = 30$ kg chịu tác dụng của một lực không đổi $F = 120$ N (bỏ qua ma sát). Gia tốc của vật là:", "options": ["A. $3600$ m/s$^2$", "B. $0.25$ m/s$^2$", "C. $2$ m/s$^2$", "D. $4$ m/s$^2$"], "answer": "D", "explain": "Theo định luật 2 Newton: $a = \\frac{F}{m} = \\frac{120}{30} = 4$ m/s$^2$. Gia tốc cùng hướng với lực tác dụng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có khối lượng $m = 30$ kg đang đứng yên thì chịu tác dụng của lực không đổi $F = 150$ N trong $t = 3$ s (bỏ qua ma sát). Vận tốc của vật sau thời gian đó là:", "options": ["A. $15$ m/s", "B. $5$ m/s", "C. $450$ m/s", "D. $7.5$ m/s"], "answer": "A", "explain": "Gia tốc $a = \\frac{F}{m} = \\frac{150}{30} = 5$ m/s$^2$. Vật bắt đầu từ trạng thái đứng yên nên $v = v_0 + at = 0 + 5 \\cdot 3 = 15$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một khẩu súng có khối lượng $M = 6$ kg bắn ra một viên đạn khối lượng $m = 0.02$ kg với vận tốc $v = 450$ m/s theo phương ngang (lúc đầu súng đứng yên, bỏ qua ma sát). Vận tốc giật lùi của súng có độ lớn xấp xỉ:", "options": ["A. $3$ m/s", "B. $1.5$ m/s", "C. $450$ m/s", "D. $0.75$ m/s"], "answer": "B", "explain": "Theo định luật 3 Newton, lực súng tác dụng lên đạn và lực đạn tác dụng lên súng là cặp lực - phản lực, cùng độ lớn trong cùng thời gian nên $M \\cdot V = m \\cdot v$, suy ra $V = \\frac{mv}{M} = \\frac{0.02 \\cdot 450}{6} = 1.5$ m/s (ngược hướng viên đạn).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét các phát biểu về định luật 1 Newton và quán tính (vật khối lượng $m = 15$ kg):", "statements": ["a) Một vật khối lượng $m = 15$ kg đang đứng yên; nếu hợp lực tác dụng lên vật bằng 0 thì vật tiếp tục đứng yên.", "b) Quán tính là tính chất của mọi vật có xu hướng bảo toàn vận tốc cả về hướng và độ lớn.", "c) Khối lượng càng lớn thì mức quán tính của vật càng nhỏ.", "d) Theo định luật 1 Newton, lực là nguyên nhân duy trì chuyển động của vật."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng (định luật 1 Newton). b) Đúng. c) Sai: khối lượng càng lớn thì mức quán tính càng LỚN.. d) Sai: lực là nguyên nhân làm BIẾN ĐỔI vận tốc, không phải nguyên nhân duy trì chuyển động; khi hợp lực bằng 0, vật đang chuyển động sẽ chuyển động thẳng đều mãi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một vật khối lượng $m = 26$ kg chịu tác dụng của lực $F = 130$ N. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực $F = 130$ N tác dụng lên vật khối lượng $m = 26$ kg gây ra gia tốc $a = 5$ m/s$^2$.", "b) Khi $F$ không đổi, gia tốc của vật tỉ lệ nghịch với khối lượng của vật.", "c) Đơn vị của lực trong hệ SI là kg.m/s.", "d) Lực tác dụng và phản lực là hai lực cân bằng vì chúng ngược chiều nhau."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $a = F/m = 130/26 = 5$ m/s$^2$. b) Đúng: $a = F/m$. c) Sai: đơn vị của lực là niutơn (N), $1$ N $= 1$ kg.m/s$^2$. d) Sai: lực và phản lực đặt vào hai vật khác nhau nên không phải hai lực cân bằng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một ô tô có khối lượng $m = 1.5$ tấn đang chạy với vận tốc $v_0 = 24$ m/s thì phanh gấp và dừng lại sau $t = 8$ s. Tính độ lớn lực hãm tác dụng lên ô tô (đơn vị: N; bỏ qua các lực khác).", "answer": "4500", "explain": "Gia tốc (chậm dần): $a = \\frac{v_0}{t} = \\frac{24}{8} = 3$ m/s$^2$. Theo định luật 2 Newton: $F = ma = 1500 \\cdot 3 = 4500$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một xe có khối lượng $m = 2500$ kg đang chuyển động với vận tốc $v_0 = 25$ m/s thì phanh với lực hãm không đổi $F = 12500$ N. Tính quãng đường xe đi được cho đến khi dừng hẳn (đơn vị: m; bỏ qua các lực khác).", "answer": "62.5", "explain": "Gia tốc hãm: $a = \\frac{F}{m} = \\frac{12500}{2500} = 5$ m/s$^2$. Áp dụng $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{25^2}{2 \\cdot 5} = 62.5$ m.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật có khối lượng $m = 20$ kg đang đứng yên trên mặt sàn nằm ngang nhẵn. Nếu hợp lực tác dụng lên vật bằng 0 thì vật sẽ:", "options": ["A. Chuyển động thẳng đều", "B. Tiếp tục đứng yên", "C. Chuyển động nhanh dần đều", "D. Tự dừng lại sau một thời gian"], "answer": "B", "explain": "Theo định luật 1 Newton: vật đang đứng yên sẽ tiếp tục đứng yên khi hợp lực tác dụng lên nó bằng 0 (tính quán tính giữ nguyên trạng thái ban đầu).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét trường hợp quyển sách đặt trên mặt bàn. Theo định luật 3 Newton, cặp lực và phản lực ở đây là:", "options": ["A. Hai lực cùng đặt vào một vật nên chúng triệt tiêu nhau", "B. Lực mặt bàn tác dụng lên quyển sách và trọng lực của vật", "C. Lực mặt bàn tác dụng lên quyển sách và lực quyển sách tác dụng lên mặt bàn", "D. Chỉ có một lực duy nhất là lực mặt bàn tác dụng lên quyển sách"], "answer": "C", "explain": "Định luật 3 Newton: lực và phản lực luôn xuất hiện thành cặp, đặt vào HAI vật tương tác khác nhau (ở đây: mặt bàn tác dụng lên quyển sách và quyển sách tác dụng lên mặt bàn), cùng độ lớn, ngược chiều nên KHÔNG triệt tiêu nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người đẩy một chiếc xe hàng có khối lượng 20 kg với gia tốc 4 m/s$^2$ (bỏ qua ma sát). Độ lớn của lực tác dụng là:", "options": ["A. $5$ N", "B. $24$ N", "C. $40$ N", "D. $80$ N"], "answer": "D", "explain": "Theo định luật 2 Newton: $F = ma = 20 \\cdot 4 = 80$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có khối lượng $m = 40$ kg chịu tác dụng của một lực không đổi $F = 200$ N (bỏ qua ma sát). Gia tốc của vật là:", "options": ["A. $5$ m/s$^2$", "B. $8000$ m/s$^2$", "C. $0.2$ m/s$^2$", "D. $2.5$ m/s$^2$"], "answer": "A", "explain": "Theo định luật 2 Newton: $a = \\frac{F}{m} = \\frac{200}{40} = 5$ m/s$^2$. Gia tốc cùng hướng với lực tác dụng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có khối lượng $m = 25$ kg đang đứng yên thì chịu tác dụng của lực không đổi $F = 200$ N trong $t = 8$ s (bỏ qua ma sát). Vận tốc của vật sau thời gian đó là:", "options": ["A. $8$ m/s", "B. $64$ m/s", "C. $1600$ m/s", "D. $32$ m/s"], "answer": "B", "explain": "Gia tốc $a = \\frac{F}{m} = \\frac{200}{25} = 8$ m/s$^2$. Vật bắt đầu từ trạng thái đứng yên nên $v = v_0 + at = 0 + 8 \\cdot 8 = 64$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ngụy biện: người dùng búa đóng đinh — lực cái búa tác dụng lên cái đinh và phản lực cái đinh tác dụng lên cái búa triệt tiêu nhau nên vật không thể chuyển động. Chỗ sai của ngụy biện này là:", "options": ["A. Định luật 3 Newton chỉ đúng với vật đứng yên", "B. Lực và phản lực luôn có độ lớn khác nhau", "C. Hai lực đặt vào hai vật khác nhau nên không thể triệt tiêu nhau", "D. Phản lực luôn xuất hiện trước lực tác dụng"], "answer": "C", "explain": "Theo định luật 3 Newton, cặp lực - phản lực đặt vào HAI vật khác nhau (cái búa và cái đinh) nên không bao giờ triệt tiêu nhau. Vật chuyển động hay không phụ thuộc vào hợp lực tác dụng lên CHÍNH vật đó.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét các phát biểu về định luật 1 Newton và quán tính (vật khối lượng $m = 20$ kg):", "statements": ["a) Một vật khối lượng $m = 20$ kg đang đứng yên; nếu hợp lực tác dụng lên vật bằng 0 thì vật tiếp tục đứng yên.", "b) Mọi vật đều có quán tính, không phụ thuộc vào trạng thái chuyển động của vật.", "c) Vật có khối lượng lớn thì khó thay đổi vận tốc hơn vật có khối lượng nhỏ.", "d) Nếu không có lực tác dụng thì vật đang chuyển động sẽ dừng lại ngay lập tức."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng (định luật 1 Newton). b) Đúng. c) Đúng: khối lượng là số đo mức quán tính.. d) Sai: lực là nguyên nhân làm BIẾN ĐỔI vận tốc, không phải nguyên nhân duy trì chuyển động; khi hợp lực bằng 0, vật đang chuyển động sẽ chuyển động thẳng đều mãi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một vật khối lượng $m = 13$ kg chịu tác dụng của lực $F = 169$ N. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực $F = 169$ N tác dụng lên vật khối lượng $m = 13$ kg gây ra gia tốc $a = 13$ m/s$^2$.", "b) Khi $F$ không đổi, gia tốc của vật tỉ lệ nghịch với khối lượng của vật.", "c) Đơn vị của lực trong hệ SI là kg.m/s.", "d) Lực tác dụng và phản lực là hai lực cân bằng vì chúng ngược chiều nhau."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $a = F/m = 169/13 = 13$ m/s$^2$. b) Đúng: $a = F/m$. c) Sai: đơn vị của lực là niutơn (N), $1$ N $= 1$ kg.m/s$^2$. d) Sai: lực và phản lực đặt vào hai vật khác nhau nên không phải hai lực cân bằng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một ô tô có khối lượng $m = 4$ tấn đang chạy với vận tốc $v_0 = 20$ m/s thì phanh gấp và dừng lại sau $t = 10$ s. Tính độ lớn lực hãm tác dụng lên ô tô (đơn vị: N; bỏ qua các lực khác).", "answer": "8000", "explain": "Gia tốc (chậm dần): $a = \\frac{v_0}{t} = \\frac{20}{10} = 2$ m/s$^2$. Theo định luật 2 Newton: $F = ma = 4000 \\cdot 2 = 8000$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một xe có khối lượng $m = 2500$ kg đang chuyển động với vận tốc $v_0 = 30$ m/s thì phanh và dừng lại sau khi đi được $s = 90$ m. Tính độ lớn lực hãm (đơn vị: N; bỏ qua các lực khác).", "answer": "12500", "explain": "Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $a = \\frac{v_0^2}{2s} = \\frac{30^2}{2 \\cdot 90} = 5$ m/s$^2$. Lực hãm $F = ma = 2500 \\cdot 5 = 12500$ N.", "points": 0.5}]}]}
