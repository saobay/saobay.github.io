{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Xét một người đang nhảy dù trong không khí. Phát biểu nào sau đây đúng về lực cản của không khí?", "options": ["A. Lực cản ngược chiều với chiều chuyển động của vật", "B. Lực cản cùng chiều với chiều chuyển động của vật", "C. Lực cản có phương vuông góc với hướng chuyển động", "D. Lực cản chỉ xuất hiện khi vật đứng yên"], "answer": "A", "explain": "Khi vật chuyển động trong chất lưu (không khí, nước), chất lưu tác dụng lên vật một lực cản ngược chiều chuyển động, có tác dụng làm giảm tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một chiếc ô tô đang chạy với tốc độ $60$ km/h. Lực cản của không khí tác dụng lên vật phụ thuộc vào các yếu tố nào?", "options": ["A. Khối lượng của vật và gia tốc của vật", "B. Hình dạng của vật, tốc độ chuyển động của vật và khối lượng riêng của không khí", "C. Chỉ phụ thuộc vào tốc độ của vật", "D. Chỉ phụ thuộc vào khối lượng riêng của không khí"], "answer": "B", "explain": "Lực cản phụ thuộc hình dạng khí động học của vật (vật càng thuôn dài cản càng nhỏ), tốc độ chuyển động (càng nhanh cản càng lớn) và tính chất của chất lưu. Khối lượng của vật không ảnh hưởng trực tiếp đến lực cản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một giọt mưa có trọng lượng $P = 5$ N đang rơi trong không khí. Khi lực cản của không khí đạt $F_c = 5$ N thì:", "options": ["A. Giọt mưa rơi nhanh dần đều với gia tốc $g$", "B. Giọt mưa dừng lại giữa không trung", "C. Giọt mưa rơi với vận tốc không đổi (đạt vận tốc giới hạn)", "D. Giọt mưa chuyển động chậm dần rồi dừng lại"], "answer": "C", "explain": "Khi $F_c = P = 5$ N, hợp lực tác dụng lên giọt mưa bằng 0 nên theo định luật 1 Newton, giọt mưa chuyển động thẳng đều với vận tốc không đổi — gọi là vận tốc giới hạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cánh máy bay được thiết kế sao cho khi bay, vận tốc dòng khí ở mặt trên của cánh là $v_1 = 120$ m/s, lớn hơn vận tốc dòng khí ở mặt dưới $v_2 = 100$ m/s. Điều này tạo ra:", "options": ["A. Lực cản hướng xuống do áp suất ở mặt trên lớn hơn", "B. Lực đẩy ngang giúp máy bay tiến về phía trước", "C. Trọng lực của máy bay giảm đi", "D. Lực nâng hướng lên do áp suất ở mặt dưới cánh lớn hơn ở mặt trên"], "answer": "D", "explain": "Theo nguyên lí Bernoulli: nơi nào dòng khí chuyển động nhanh hơn thì áp suất nhỏ hơn. Vì $v_1 = 120$ m/s lớn hơn $v_2 = 100$ m/s nên áp suất mặt dưới lớn hơn mặt trên, chênh lệch áp suất tạo ra lực nâng hướng lên, cân bằng với trọng lực khi máy bay bay ổn định.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 2$ N.s/m. Vật có khối lượng $m = 5$ kg. Vận tốc giới hạn của vật khi rơi là (lấy $g = 10$ m/s$^2$):", "options": ["A. $25$ m/s", "B. $12.5$ m/s", "C. $50$ m/s", "D. $0.4$ m/s"], "answer": "A", "explain": "Vận tốc giới hạn đạt được khi lực cản cân bằng với trọng lực: $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{5 \\cdot 10}{2} = 25$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai vật A và B có cùng hình dạng, khối lượng $m_A = 10$ kg và $m_B = 5$ kg, cùng rơi trong không khí. Giả sử lực cản của không khí tỉ lệ với vận tốc ($F_c = kv$, cùng hệ số $k$ cho hai vật). Tỉ số vận tốc giới hạn $\\frac{v_{ghA}}{v_{ghB}}$ bằng:", "options": ["A. 4", "B. 2", "C. 0.5", "D. 1"], "answer": "B", "explain": "$v_{gh} = \\frac{mg}{k}$ tỉ lệ thuận với $m$ nên $\\frac{v_{ghA}}{v_{ghB}} = \\frac{m_A}{m_B} = \\frac{10}{5} = 2$. Vật nặng hơn có vận tốc giới hạn lớn hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật rơi trong không khí. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực cản của chất lưu tác dụng lên vật chuyển động có hướng ngược với hướng chuyển động của vật.", "b) Một giọt mưa đang rơi với vận tốc không đổi $v = 5$ m/s; khi đó lực cản của không khí cân bằng với trọng lực của giọt er": "6", "explain": "Khi rơi ổn định: $kv^2 = mg$, suy ra $v = \\sqrt{\\frac{mg}{k}} = \\sqrt{\\frac{72 \\cdot 10}{20}} = 6$ m/s.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Xét một chiếc ô tô đang chạy trong không khí. Phát biểu nào sau đây đúng về lực cản của không khí?", "options": ["A. Lực cản cùng chiều với chiều chuyển động của vật", "B. Lực cản ngược chiều với chiều chuyển động của vật", "C. Lực cản có phương vuông góc với hướng chuyển động", "D. Lực cản chỉ xuất hiện khi vật đứng yên"], "answer": "B", "explain": "Khi vật chuyển động trong chất lưu (không khí, nước), chất lưu tác dụng lên vật một lực cản ngược chiều chuyển động, có tác dụng làm giảm tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một người đang nhảy dù với tốc độ rơi $6$ m/s. Lực cản của không khí tác dụng lên vật phụ thuộc vào các yếu tố nào?", "options": ["A. Khối lượng của vật và gia tốc của vật", "B. Chỉ phụ thuộc vào tốc độ của vật", "C. Hình dạng của vật, tốc độ chuyển động của vật và khối lượng riêng của không khí", "D. Chỉ phụ thuộc vào khối lượng riêng của không khí"], "answer": "C", "explain": "Lực cản phụ thuộc hình dạng khí động học của vật (vật càng thuôn dài cản càng nhỏ), tốc độ chuyển động (càng nhanh cản càng lớn) và tính chất của chất lưu. Khối lượng của vật không ảnh hưởng trực tiếp đến lực cản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một giọt mưa có trọng lượng $P = 6$ N đang rơi trong không khí. Khi lực cản của không khí đạt $F_c = 6$ N thì:", "options": ["A. Giọt mưa rơi nhanh dần đều với gia tốc $g$", "B. Giọt mưa dừng lại giữa không trung", "C. Giọt mưa chuyển động chậm dần rồi dừng lại", "D. Giọt mưa rơi với vận tốc không đổi (đạt vận tốc giới hạn)"], "answer": "D", "explain": "Khi $F_c = P = 6$ N, hợp lực tác dụng lên giọt mưa bằng 0 nên theo định luật 1 Newton, giọt mưa chuyển động thẳng đều với vận tốc không đổi — gọi là vận tốc giới hạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cánh máy bay được thiết kế sao cho khi bay, vận tốc dòng khí ở mặt trên của cánh là $v_1 = 150$ m/s, lớn hơn vận tốc dòng khí ở mặt dưới $v_2 = 120$ m/s. Điều này tạo ra:", "options": ["A. Lực nâng hướng lên do áp suất ở mặt dưới cánh lớn hơn ở mặt trên", "B. Lực cản hướng xuống do áp suất ở mặt trên lớn hơn", "C. Lực đẩy ngang giúp máy bay tiến về phía trước", "D. Trọng lực của máy bay giảm đi"], "answer": "A", "explain": "Theo nguyên lí Bernoulli: nơi nào dòng khí chuyển động nhanh hơn thì áp suất nhỏ hơn. Vì $v_1 = 150$ m/s lớn hơn $v_2 = 120$ m/s nên áp suất mặt dưới lớn hơn mặt trên, chênh lệch áp suất tạo ra lực nâng hướng lên, cân bằng với trọng lực khi máy bay bay ổn định.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 4$ N.s/m. Vật có khối lượng $m = 10$ kg. Vận tốc giới hạn của vật khi rơi là (lấy $g = 10$ m/s$^2$):", "options": ["A. $12.5$ m/s", "B. $25$ m/s", "C. $50$ m/s", "D. $0.4$ m/s"], "answer": "B", "explain": "Vận tốc giới hạn đạt được khi lực cản cân bằng với trọng lực: $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{10 \\cdot 10}{4} = 25$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một máy bay có khối lượng $m = 5000$ kg đang bay ổn định ở độ cao không đổi. Phát biểu nào sau đây đúng?", "options": ["A. Lực nâng lớn hơn trọng lực nên máy bay bay lên cao mãi", "B. Trọng lực của máy bay bằng 0 khi bay ổn định", "C. Lực nâng của không khí cân bằng với trọng lực của máy bay", "D. Lực cản của không khí giúp máy bay bay lên"], "answer": "C", "explain": "Bay ổn định ở độ cao không đổi nghĩa là hợp lực bằng 0: lực nâng $F_n$ cân bằng với trọng lực $P = mg = 50000$ N (hướng lên), đồng thời lực đẩy của động cơ cân bằng với lực cản của không khí (phương ngang).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật rơi trong không khí. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực cản của chất lưu tác dụng lên vật chuyển động có hướng ngược với hướng chuyển động của vật.", "b) Một giọt mưa đang rơi với vận tốc không đổi $v = 8$ m/s; khi đó lực cản của không khí cân bằng với trọng lực của giọt mưa.", "c) Lực cản của không khí càng lớn khi vật chuyển động càng nhanh.", "d) Vận tốc giới hạn là vận tốc lớn nhất mà vật có thể đạt được khi rơi tự do trong chân không."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: hợp lực bằng 0 nên vật chuyển động thẳng đều với vận tốc $v = 8$ m/s. c) Đúng. d) Sai: trong chân không không có lực cản nên không có vận tốc giới hạn; vận tốc giới hạn chỉ xuất hiện khi vật rơi trong chất lưu.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về lực nâng và lực cản. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Khi máy bay bay ổn định ở độ cao không đổi, lực nâng của không khí cân bằng với trọng lực của máy bay.", "b) Cánh máy bay được thiết kế sao cho vận tốc dòng khí ở mặt trên cánh $v_1 = 150$ m/s lớn hơn vận tốc ở mặt dưới $v_2 = 120$ m/s.", "c) Lực nâng của cánh máy bay có hướng cùng chiều với trọng lực.", "d) Người ta thiết kế ô tô có hình dạng khí động học để giảm lực cản của không khí."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: hợp lực theo phương đứng bằng 0. b) Đúng. c) Sai: lực nâng hướng lên, ngược chiều trọng lực. d) Đúng: hình dạng thuôn dài làm giảm lực cản, tiết kiệm nhiên liệu.", "points": 1}, {"type": "short", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 5$ N.s/m. Vật có khối lượng $m = 15$ kg. Tính vận tốc giới hạn của vật khi rơi (đơn vị: m/s; lấy $g = 10$ m/s$^2$).", "answer": "30", "explain": "Khi đạt vận tốc giới hạn: $F_c = P$, tức $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{15 \\cdot 10}{5} = 30$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai viên bi có cùng hình dạng, khối lượng $m_1 = 30$ g và $m_2 = 20$ g, cùng rơi trong không khí. Giả sử lực cản của không khí tỉ lệ với vận tốc ($F_c = kv$, cùng hệ số $k$). Tính tỉ số vận tốc giới hạn $\\frac{v_{gh1}}{v_{gh2}}$ (làm tròn đến 1 chữ số thập phân).", "answer": "1.5", "explain": "$v_{gh} = \\frac{mg}{k}$ tỉ lệ thuận với $m$ nên $\\frac{v_{gh1}}{v_{gh2}} = \\frac{m_1}{m_2} = \\frac{30}{20} = 1.5$.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Xét một giọt mưa đang rơi trong không khí. Phát biểu nào sau đây đúng về lực cản của không khí?", "options": ["A. Lực cản cùng chiều với chiều chuyển động của vật", "B. Lực cản có phương vuông góc với hướng chuyển động", "C. Lực cản ngược chiều với chiều chuyển động của vật", "D. Lực cản chỉ xuất hiện khi vật đứng yên"], "answer": "C", "explain": "Khi vật chuyển động trong chất lưu (không khí, nước), chất lưu tác dụng lên vật một lực cản ngược chiều chuyển động, có tác dụng làm giảm tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một giọt mưa đang rơi với tốc độ $12$ m/s. Lực cản của không khí tác dụng lên vật phụ thuộc vào các yếu tố nào?", "options": ["A. Khối lượng của vật và gia tốc của vật", "B. Chỉ phụ thuộc vào tốc độ của vật", "C. Chỉ phụ thuộc vào khối lượng riêng của không khí", "D. Hình dạng của vật, tốc độ chuyển động của vật và khối lượng riêng của không khí"], "answer": "D", "explain": "Lực cản phụ thuộc hình dạng khí động học của vật (vật càng thuôn dài cản càng nhỏ), tốc độ chuyển động (càng nhanh cản càng lớn) và tính chất của chất lưu. Khối lượng của vật không ảnh hưởng trực tiếp đến lực cản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một giọt mưa có trọng lượng $P = 7$ N đang rơi trong không khí. Khi lực cản của không khí đạt $F_c = 7$ N thì:", "options": ["A. Giọt mưa rơi với vận tốc không đổi (đạt vận tốc giới hạn)", "B. Giọt mưa rơi nhanh dần đều với gia tốc $g$", "C. Giọt mưa dừng lại giữa không trung", "D. Giọt mưa chuyển động chậm dần rồi dừng lại"], "answer": "A", "explain": "Khi $F_c = P = 7$ N, hợp lực tác dụng lên giọt mưa bằng 0 nên theo định luật 1 Newton, giọt mưa chuyển động thẳng đều với vận tốc không đổi — gọi là vận tốc giới hạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cánh máy bay được thiết kế sao cho khi bay, vận tốc dòng khí ở mặt trên của cánh là $v_1 = 200$ m/s, lớn hơn vận tốc dòng khí ở mặt dưới $v_2 = 160$ m/s. Điều này tạo ra:", "options": ["A. Lực cản hướng xuống do áp suất ở mặt trên lớn hơn", "B. Lực nâng hướng lên do áp suất ở mặt dưới cánh lớn hơn ở mặt trên", "C. Lực đẩy ngang giúp máy bay tiến về phía trước", "D. Trọng lực của máy bay giảm đi"], "answer": "B", "explain": "Theo nguyên lí Bernoulli: nơi nào dòng khí chuyển động nhanh hơn thì áp suất nhỏ hơn. Vì $v_1 = 200$ m/s lớn hơn $v_2 = 160$ m/s nên áp suất mặt dưới lớn hơn mặt trên, chênh lệch áp suất tạo ra lực nâng hướng lên, cân bằng với trọng lực khi máy bay bay ổn định.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 1$ N.s/m. Vật có khối lượng $m = 2$ kg. Vận tốc giới hạn của vật khi rơi là (lấy $g = 10$ m/s$^2$):", "options": ["A. $10$ m/s", "B. $40$ m/s", "C. $20$ m/s", "D. $0.5$ m/s"], "answer": "C", "explain": "Vận tốc giới hạn đạt được khi lực cản cân bằng với trọng lực: $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{2 \\cdot 10}{1} = 20$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai vật A và B có cùng hình dạng, khối lượng $m_A = 20$ kg và $m_B = 10$ kg, cùng rơi trong không khí. Giả sử lực cản của không khí tỉ lệ với vận tốc ($F_c = kv$, cùng hệ số $k$ cho hai vật). Tỉ số vận tốc giới hạn $\\frac{v_{ghA}}{v_{ghB}}$ bằng:", "options": ["A. 4", "B. 0.5", "C. 1", "D. 2"], "answer": "D", "explain": "$v_{gh} = \\frac{mg}{k}$ tỉ lệ thuận với $m$ nên $\\frac{v_{ghA}}{v_{ghB}} = \\frac{m_A}{m_B} = \\frac{20}{10} = 2$. Vật nặng hơn có vận tốc giới hạn lớn hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật rơi trong không khí. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực cản của chất lưu tác dụng lên vật chuyển động có hướng ngược với hướng chuyển động của vật.", "b) Một giọt mưa đang rơi với vận tốc không đổi $v = 10$ m/s; khi đó lực cản của không khí cân bằng với trọng lực của giọt mưa.", "c) Lực cản của không khí càng lớn khi vật chuyển động càng nhanh.", "d) Vận tốc giới hạn là vận tốc lớn nhất mà vật có thể đạt được khi rơi tự do trong chân không."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: hợp lực bằng 0 nên vật chuyển động thẳng đều với vận tốc $v = 10$ m/s. c) Đúng. d) Sai: trong chân không không có lực cản nên không có vận tốc giới hạn; vận tốc giới hạn chỉ xuất hiện khi vật rơi trong chất lưu.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về lực nâng và lực cản. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Khi máy bay bay ổn định ở độ cao không đổi, lực nâng của không khí cân bằng với trọng lực của máy bay.", "b) Cánh máy bay được thiết kế sao cho vận tốc dòng khí ở mặt trên cánh $v_1 = 200$ m/s lớn hơn vận tốc ở mặt dưới $v_2 = 160$ m/s.", "c) Lực nâng của cánh máy bay có hướng cùng chiều với trọng lực.", "d) Người ta thiết kế ô tô có hình dạng khí động học để giảm lực cản của không khí."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: hợp lực theo phương đứng bằng 0. b) Đúng. c) Sai: lực nâng hướng lên, ngược chiều trọng lực. d) Đúng: hình dạng thuôn dài làm giảm lực cản, tiết kiệm nhiên liệu.", "points": 1}, {"type": "short", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 4$ N.s/m. Vật có khối lượng $m = 4$ kg. Tính vận tốc giới hạn của vật khi rơi (đơn vị: m/s; lấy $g = 10$ m/s$^2$).", "answer": "10", "explain": "Khi đạt vận tốc giới hạn: $F_c = P$, tức $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{4 \\cdot 10}{4} = 10$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một người nhảy dù có tổng khối lượng $m = 108$ kg. Khi dù đã bung hoàn toàn, giả sử lực cản của không khí tỉ lệ với bình phương vận tốc: $F_c = kv^2$ với $k = 30$ N.s$^2$/m$^2$. Tính vận tốc rơi ổn định (vận tốc giới hạn) của người đó (đơn vị: m/s; lấy $g = 10$ m/s$^2$).", "answer": "6", "explain": "Khi rơi ổn định: $kv^2 = mg$, suy ra $v = \\sqrt{\\frac{mg}{k}} = \\sqrt{\\frac{108 \\cdot 10}{30}} = 6$ m/s.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Xét một người đang nhảy dù trong không khí. Phát biểu nào sau đây đúng về lực cản của không khí?", "options": ["A. Lực cản cùng chiều với chiều chuyển động của vật", "B. Lực cản có phương vuông góc với hướng chuyển động", "C. Lực cản chỉ xuất hiện khi vật đứng yên", "D. Lực cản ngược chiều với chiều chuyển động của vật"], "answer": "D", "explain": "Khi vật chuyển động trong chất lưu (không khí, nước), chất lưu tác dụng lên vật một lực cản ngược chiều chuyển động, có tác dụng làm giảm tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một chiếc ô tô đang chạy với tốc độ $50$ km/h. Lực cản của không khí tác dụng lên vật phụ thuộc vào các yếu tố nào?", "options": ["A. Hình dạng của vật, tốc độ chuyển động của vật và khối lượng riêng của không khí", "B. Khối lượng của vật và gia tốc của vật", "C. Chỉ phụ thuộc vào tốc độ của vật", "D. Chỉ phụ thuộc vào khối lượng riêng của không khí"], "answer": "A", "explain": "Lực cản phụ thuộc hình dạng khí động học của vật (vật càng thuôn dài cản càng nhỏ), tốc độ chuyển động (càng nhanh cản càng lớn) và tính chất của chất lưu. Khối lượng của vật không ảnh hưởng trực tiếp đến lực cản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một giọt mưa có trọng lượng $P = 8$ N đang rơi trong không khí. Khi lực cản của không khí đạt $F_c = 8$ N thì:", "options": ["A. Giọt mưa rơi nhanh dần đều với gia tốc $g$", "B. Giọt mưa rơi với vận tốc không đổi (đạt vận tốc giới hạn)", "C. Giọt mưa dừng lại giữa không trung", "D. Giọt mưa chuyển động chậm dần rồi dừng lại"], "answer": "B", "explain": "Khi $F_c = P = 8$ N, hợp lực tác dụng lên giọt mưa bằng 0 nên theo định luật 1 Newton, giọt mưa chuyển động thẳng đều với vận tốc không đổi — gọi là vận tốc giới hạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cánh máy bay được thiết kế sao cho khi bay, vận tốc dòng khí ở mặt trên của cánh là $v_1 = 90$ m/s, lớn hơn vận tốc dòng khí ở mặt dưới $v_2 = 70$ m/s. Điều này tạo ra:", "options": ["A. Lực cản hướng xuống do áp suất ở mặt trên lớn hơn", "B. Lực đẩy ngang giúp máy bay tiến về phía trước", "C. Lực nâng hướng lên do áp suất ở mặt dưới cánh lớn hơn ở mặt trên", "D. Trọng lực của máy bay giảm đi"], "answer": "C", "explain": "Theo nguyên lí Bernoulli: nơi nào dòng khí chuyển động nhanh hơn thì áp suất nhỏ hơn. Vì $v_1 = 90$ m/s lớn hơn $v_2 = 70$ m/s nên áp suất mặt dưới lớn hơn mặt trên, chênh lệch áp suất tạo ra lực nâng hướng lên, cân bằng với trọng lực khi máy bay bay ổn định.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 2$ N.s/m. Vật có khối lượng $m = 8$ kg. Vận tốc giới hạn của vật khi rơi là (lấy $g = 10$ m/s$^2$):", "options": ["A. $20$ m/s", "B. $80$ m/s", "C. $0.25$ m/s", "D. $40$ m/s"], "answer": "D", "explain": "Vận tốc giới hạn đạt được khi lực cản cân bằng với trọng lực: $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{8 \\cdot 10}{2} = 40$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một máy bay có khối lượng $m = 8000$ kg đang bay ổn định ở độ cao không đổi. Phát biểu nào sau đây đúng?", "options": ["A. Lực nâng của không khí cân bằng với trọng lực của máy bay", "B. Lực nâng lớn hơn trọng lực nên máy bay bay lên cao mãi", "C. Trọng lực của máy bay bằng 0 khi bay ổn định", "D. Lực cản của không khí giúp máy bay bay lên"], "answer": "A", "explain": "Bay ổn định ở độ cao không đổi nghĩa là hợp lực bằng 0: lực nâng $F_n$ cân bằng với trọng lực $P = mg = 80000$ N (hướng lên), đồng thời lực đẩy của động cơ cân bằng với lực cản của không khí (phương ngang).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật rơi trong không khí. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực cản của chất lưu tác dụng lên vật chuyển động có hướng ngược với hướng chuyển động của vật.", "b) Một giọt mưa đang rơi với vận tốc không đổi $v = 4$ m/s; khi đó lực cản của không khí cân bằng với trọng lực của giọt mưa.", "c) Lực cản của không khí càng lớn khi vật chuyển động càng nhanh.", "d) Vận tốc giới hạn là vận tốc lớn nhất mà vật có thể đạt được khi rơi tự do trong chân không."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: hợp lực bằng 0 nên vật chuyển động thẳng đều với vận tốc $v = 4$ m/s. c) Đúng. d) Sai: trong chân không không có lực cản nên không có vận tốc giới hạn; vận tốc giới hạn chỉ xuất hiện khi vật rơi trong chất lưu.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về lực nâng và lực cản. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Khi máy bay bay ổn định ở độ cao không đổi, lực nâng của không khí cân bằng với trọng lực của máy bay.", "b) Cánh máy bay được thiết kế sao cho vận tốc dòng khí ở mặt trên cánh $v_1 = 90$ m/s lớn hơn vận tốc ở mặt dưới $v_2 = 70$ m/s.", "c) Lực nâng của cánh máy bay có hướng cùng chiều với trọng lực.", "d) Người ta thiết kế ô tô có hình dạng khí động học để giảm lực cản của không khí."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: hợp lực theo phương đứng bằng 0. b) Đúng. c) Sai: lực nâng hướng lên, ngược chiều trọng lực. d) Đúng: hình dạng thuôn dài làm giảm lực cản, tiết kiệm nhiên liệu.", "points": 1}, {"type": "short", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 6$ N.s/m. Vật có khối lượng $m = 24$ kg. Tính vận tốc giới hạn của vật khi rơi (đơn vị: m/s; lấy $g = 10$ m/s$^2$).", "answer": "40", "explain": "Khi đạt vận tốc giới hạn: $F_c = P$, tức $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{24 \\cdot 10}{6} = 40$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai viên bi có cùng hình dạng, khối lượng $m_1 = 45$ g và $m_2 = 30$ g, cùng rơi trong không khí. Giả sử lực cản của không khí tỉ lệ với vận tốc ($F_c = kv$, cùng hệ số $k$). Tính tỉ số vận tốc giới hạn $\\frac{v_{gh1}}{v_{gh2}}$ (làm tròn đến 1 chữ số thập phân).", "answer": "1.5", "explain": "$v_{gh} = \\frac{mg}{k}$ tỉ lệ thuận với $m$ nên $\\frac{v_{gh1}}{v_{gh2}} = \\frac{m_1}{m_2} = \\frac{45}{30} = 1.5$.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Xét một chiếc ô tô đang chạy trong không khí. Phát biểu nào sau đây đúng về lực cản của không khí?", "options": ["A. Lực cản ngược chiều với chiều chuyển động của vật", "B. Lực cản cùng chiều với chiều chuyển động của vật", "C. Lực cản có phương vuông góc với hướng chuyển động", "D. Lực cản chỉ xuất hiện khi vật đứng yên"], "answer": "A", "explain": "Khi vật chuyển động trong chất lưu (không khí, nước), chất lưu tác dụng lên vật một lực cản ngược chiều chuyển động, có tác dụng làm giảm tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một người đang nhảy dù với tốc độ rơi $7$ m/s. Lực cản của không khí tác dụng lên vật phụ thuộc vào các yếu tố nào?", "options": ["A. Khối lượng của vật và gia tốc của vật", "B. Hình dạng của vật, tốc độ chuyển động của vật và khối lượng riêng của không khí", "C. Chỉ phụ thuộc vào tốc độ của vật", "D. Chỉ phụ thuộc vào khối lượng riêng của không khí"], "answer": "B", "explain": "Lực cản phụ thuộc hình dạng khí động học của vật (vật càng thuôn dài cản càng nhỏ), tốc độ chuyển động (càng nhanh cản càng lớn) và tính chất của chất lưu. Khối lượng của vật không ảnh hưởng trực tiếp đến lực cản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một giọt mưa có trọng lượng $P = 9$ N đang rơi trong không khí. Khi lực cản của không khí đạt $F_c = 9$ N thì:", "options": ["A. Giọt mưa rơi nhanh dần đều với gia tốc $g$", "B. Giọt mưa dừng lại giữa không trung", "C. Giọt mưa rơi với vận tốc không đổi (đạt vận tốc giới hạn)", "D. Giọt mưa chuyển động chậm dần rồi dừng lại"], "answer": "C", "explain": "Khi $F_c = P = 9$ N, hợp lực tác dụng lên giọt mưa bằng 0 nên theo định luật 1 Newton, giọt mưa chuyển động thẳng đều với vận tốc không đổi — gọi là vận tốc giới hạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cánh máy bay được thiết kế sao cho khi bay, vận tốc dòng khí ở mặt trên của cánh là $v_1 = 180$ m/s, lớn hơn vận tốc dòng khí ở mặt dưới $v_2 = 150$ m/s. Điều này tạo ra:", "options": ["A. Lực cản hướng xuống do áp suất ở mặt trên lớn hơn", "B. Lực đẩy ngang giúp máy bay tiến về phía trước", "C. Trọng lực của máy bay giảm đi", "D. Lực nâng hướng lên do áp suất ở mặt dưới cánh lớn hơn ở mặt trên"], "answer": "D", "explain": "Theo nguyên lí Bernoulli: nơi nào dòng khí chuyển động nhanh hơn thì áp suất nhỏ hơn. Vì $v_1 = 180$ m/s lớn hơn $v_2 = 150$ m/s nên áp suất mặt dưới lớn hơn mặt trên, chênh lệch áp suất tạo ra lực nâng hướng lên, cân bằng với trọng lực khi máy bay bay ổn định.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 5$ N.s/m. Vật có khối lượng $m = 20$ kg. Vận tốc giới hạn của vật khi rơi là (lấy $g = 10$ m/s$^2$):", "options": ["A. $40$ m/s", "B. $20$ m/s", "C. $80$ m/s", "D. $0.25$ m/s"], "answer": "A", "explain": "Vận tốc giới hạn đạt được khi lực cản cân bằng với trọng lực: $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{20 \\cdot 10}{5} = 40$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai vật A và B có cùng hình dạng, khối lượng $m_A = 15$ kg và $m_B = 5$ kg, cùng rơi trong không khí. Giả sử lực cản của không khí tỉ lệ với vận tốc ($F_c = kv$, cùng hệ số $k$ cho hai vật). Tỉ số vận tốc giới hạn $\\frac{v_{ghA}}{v_{ghB}}$ bằng:", "options": ["A. 9", "B. 3", "C. 0.33", "D. 1"], "answer": "B", "explain": "$v_{gh} = \\frac{mg}{k}$ tỉ lệ thuận với $m$ nên $\\frac{v_{ghA}}{v_{ghB}} = \\frac{m_A}{m_B} = \\frac{15}{5} = 3$. Vật nặng hơn có vận tốc giới hạn lớn hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật rơi trong không khí. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực cản của chất lưu tác dụng lên vật chuyển động có hướng ngược với hướng chuyển động của vật.", "b) Một giọt mưa đang rơi với vận tốc không đổi $v = 6$ m/s; khi đó lực cản của không khí cân bằng với trọng lực của giọt mưa.", "c) Lực cản của không khí càng lớn khi vật chuyển động càng nhanh.", "d) Vận tốc giới hạn là vận tốc lớn nhất mà vật có thể đạt được khi rơi tự do trong chân không."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: hợp lực bằng 0 nên vật chuyển động thẳng đều với vận tốc $v = 6$ m/s. c) Đúng. d) Sai: trong chân không không có lực cản nên không có vận tốc giới hạn; vận tốc giới hạn chỉ xuất hiện khi vật rơi trong chất lưu.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về lực nâng và lực cản. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Khi máy bay bay ổn định ở độ cao không đổi, lực nâng của không khí cân bằng với trọng lực của máy bay.", "b) Cánh máy bay được thiết kế sao cho vận tốc dòng khí ở mặt trên cánh $v_1 = 180$ m/s lớn hơn vận tốc ở mặt dưới $v_2 = 150$ m/s.", "c) Lực nâng của cánh máy bay có hướng cùng chiều với trọng lực.", "d) Người ta thiết kế ô tô có hình dạng khí động học để giảm lực cản của không khí."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: hợp lực theo phương đứng bằng 0. b) Đúng. c) Sai: lực nâng hướng lên, ngược chiều trọng lực. d) Đúng: hình dạng thuôn dài làm giảm lực cản, tiết kiệm nhiên liệu.", "points": 1}, {"type": "short", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 3$ N.s/m. Vật có khối lượng $m = 9$ kg. Tính vận tốc giới hạn của vật khi rơi (đơn vị: m/s; lấy $g = 10$ m/s$^2$).", "answer": "30", "explain": "Khi đạt vận tốc giới hạn: $F_c = P$, tức $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{9 \\cdot 10}{3} = 30$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một người nhảy dù có tổng khối lượng $m = 144$ kg. Khi dù đã bung hoàn toàn, giả sử lực cản của không khí tỉ lệ với bình phương vận tốc: $F_c = kv^2$ với $k = 40$ N.s$^2$/m$^2$. Tính vận tốc rơi ổn định (vận tốc giới hạn) của người đó (đơn vị: m/s; lấy $g = 10$ m/s$^2$).", "answer": "6", "explain": "Khi rơi ổn định: $kv^2 = mg$, suy ra $v = \\sqrt{\\frac{mg}{k}} = \\sqrt{\\frac{144 \\cdot 10}{40}} = 6$ m/s.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Xét một giọt mưa đang rơi trong không khí. Phát biểu nào sau đây đúng về lực cản của không khí?", "options": ["A. Lực cản cùng chiều với chiều chuyển động của vật", "B. Lực cản ngược chiều với chiều chuyển động của vật", "C. Lực cản có phương vuông góc với hướng chuyển động", "D. Lực cản chỉ xuất hiện khi vật đứng yên"], "answer": "B", "explain": "Khi vật chuyển động trong chất lưu (không khí, nước), chất lưu tác dụng lên vật một lực cản ngược chiều chuyển động, có tác dụng làm giảm tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một giọt mưa đang rơi với tốc độ $11$ m/s. Lực cản của không khí tác dụng lên vật phụ thuộc vào các yếu tố nào?", "options": ["A. Khối lượng của vật và gia tốc của vật", "B. Chỉ phụ thuộc vào tốc độ của vật", "C. Hình dạng của vật, tốc độ chuyển động của vật và khối lượng riêng của không khí", "D. Chỉ phụ thuộc vào khối lượng riêng của không khí"], "answer": "C", "explain": "Lực cản phụ thuộc hình dạng khí động học của vật (vật càng thuôn dài cản càng nhỏ), tốc độ chuyển động (càng nhanh cản càng lớn) và tính chất của chất lưu. Khối lượng của vật không ảnh hưởng trực tiếp đến lực cản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một giọt mưa có trọng lượng $P = 10$ N đang rơi trong không khí. Khi lực cản của không khí đạt $F_c = 10$ N thì:", "options": ["A. Giọt mưa rơi nhanh dần đều với gia tốc $g$", "B. Giọt mưa dừng lại giữa không trung", "C. Giọt mưa chuyển động chậm dần rồi dừng lại", "D. Giọt mưa rơi với vận tốc không đổi (đạt vận tốc giới hạn)"], "answer": "D", "explain": "Khi $F_c = P = 10$ N, hợp lực tác dụng lên giọt mưa bằng 0 nên theo định luật 1 Newton, giọt mưa chuyển động thẳng đều với vận tốc không đổi — gọi là vận tốc giới hạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cánh máy bay được thiết kế sao cho khi bay, vận tốc dòng khí ở mặt trên của cánh là $v_1 = 110$ m/s, lớn hơn vận tốc dòng khí ở mặt dưới $v_2 = 90$ m/s. Điều này tạo ra:", "options": ["A. Lực nâng hướng lên do áp suất ở mặt dưới cánh lớn hơn ở mặt trên", "B. Lực cản hướng xuống do áp suất ở mặt trên lớn hơn", "C. Lực đẩy ngang giúp máy bay tiến về phía trước", "D. Trọng lực của máy bay giảm đi"], "answer": "A", "explain": "Theo nguyên lí Bernoulli: nơi nào dòng khí chuyển động nhanh hơn thì áp suất nhỏ hơn. Vì $v_1 = 110$ m/s lớn hơn $v_2 = 90$ m/s nên áp suất mặt dưới lớn hơn mặt trên, chênh lệch áp suất tạo ra lực nâng hướng lên, cân bằng với trọng lực khi máy bay bay ổn định.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 2$ N.s/m. Vật có khối lượng $m = 4$ kg. Vận tốc giới hạn của vật khi rơi là (lấy $g = 10$ m/s$^2$):", "options": ["A. $10$ m/s", "B. $20$ m/s", "C. $40$ m/s", "D. $0.5$ m/s"], "answer": "B", "explain": "Vận tốc giới hạn đạt được khi lực cản cân bằng với trọng lực: $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{4 \\cdot 10}{2} = 20$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một máy bay có khối lượng $m = 10000$ kg đang bay ổn định ở độ cao không đổi. Phát biểu nào sau đây đúng?", "options": ["A. Lực nâng lớn hơn trọng lực nên máy bay bay lên cao mãi", "B. Trọng lực của máy bay bằng 0 khi bay ổn định", "C. Lực nâng của không khí cân bằng với trọng lực của máy bay", "D. Lực cản của không khí giúp máy bay bay lên"], "answer": "C", "explain": "Bay ổn định ở độ cao không đổi nghĩa là hợp lực bằng 0: lực nâng $F_n$ cân bằng với trọng lực $P = mg = 100000$ N (hướng lên), đồng thời lực đẩy của động cơ cân bằng với lực cản của không khí (phương ngang).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật rơi trong không khí. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực cản của chất lưu tác dụng lên vật chuyển động có hướng ngược với hướng chuyển động của vật.", "b) Một giọt mưa đang rơi với vận tốc không đổi $v = 12$ m/s; khi đó lực cản của không khí cân bằng với trọng lực của giọt mưa.", "c) Lực cản của không khí càng lớn khi vật chuyển động càng nhanh.", "d) Vận tốc giới hạn là vận tốc lớn nhất mà vật có thể đạt được khi rơi tự do trong chân không."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: hợp lực bằng 0 nên vật chuyển động thẳng đều với vận tốc $v = 12$ m/s. c) Đúng. d) Sai: trong chân không không có lực cản nên không có vận tốc giới hạn; vận tốc giới hạn chỉ xuất hiện khi vật rơi trong chất lưu.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về lực nâng và lực cản. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Khi máy bay bay ổn định ở độ cao không đổi, lực nâng của không khí cân bằng với trọng lực của máy bay.", "b) Cánh máy bay được thiết kế sao cho vận tốc dòng khí ở mặt trên cánh $v_1 = 110$ m/s lớn hơn vận tốc ở mặt dưới $v_2 = 90$ m/s.", "c) Lực nâng của cánh máy bay có hướng cùng chiều với trọng lực.", "d) Người ta thiết kế ô tô có hình dạng khí động học để giảm lực cản của không khí."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: hợp lực theo phương đứng bằng 0. b) Đúng. c) Sai: lực nâng hướng lên, ngược chiều trọng lực. d) Đúng: hình dạng thuôn dài làm giảm lực cản, tiết kiệm nhiên liệu.", "points": 1}, {"type": "short", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 8$ N.s/m. Vật có khối lượng $m = 40$ kg. Tính vận tốc giới hạn của vật khi rơi (đơn vị: m/s; lấy $g = 10$ m/s$^2$).", "answer": "50", "explain": "Khi đạt vận tốc giới hạn: $F_c = P$, tức $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{40 \\cdot 10}{8} = 50$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai viên bi có cùng hình dạng, khối lượng $m_1 = 50$ g và $m_2 = 25$ g, cùng rơi trong không khí. Giả sử lực cản của không khí tỉ lệ với vận tốc ($F_c = kv$, cùng hệ số $k$). Tính tỉ số vận tốc giới hạn $\\frac{v_{gh1}}{v_{gh2}}$ (làm tròn đến 1 chữ số thập phân).", "answer": "2", "explain": "$v_{gh} = \\frac{mg}{k}$ tỉ lệ thuận với $m$ nên $\\frac{v_{gh1}}{v_{gh2}} = \\frac{m_1}{m_2} = \\frac{50}{25} = 2$.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Xét một người đang nhảy dù trong không khí. Phát biểu nào sau đây đúng về lực cản của không khí?", "options": ["A. Lực cản cùng chiều với chiều chuyển động của vật", "B. Lực cản có phương vuông góc với hướng chuyển động", "C. Lực cản ngược chiều với chiều chuyển động của vật", "D. Lực cản chỉ xuất hiện khi vật đứng yên"], "answer": "C", "explain": "Khi vật chuyển động trong chất lưu (không khí, nước), chất lưu tác dụng lên vật một lực cản ngược chiều chuyển động, có tác dụng làm giảm tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một chiếc ô tô đang chạy với tốc độ $110$ km/h. Lực cản của không khí tác dụng lên vật phụ thuộc vào các yếu tố nào?", "options": ["A. Khối lượng của vật và gia tốc của vật", "B. Chỉ phụ thuộc vào tốc độ của vật", "C. Chỉ phụ thuộc vào khối lượng riêng của không khí", "D. Hình dạng của vật, tốc độ chuyển động của vật và khối lượng riêng của không khí"], "answer": "D", "explain": "Lực cản phụ thuộc hình dạng khí động học của vật (vật càng thuôn dài cản càng nhỏ), tốc độ chuyển động (càng nhanh cản càng lớn) và tính chất của chất lưu. Khối lượng của vật không ảnh hưởng trực tiếp đến lực cản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một giọt mưa có trọng lượng $P = 11$ N đang rơi trong không khí. Khi lực cản của không khí đạt $F_c = 11$ N thì:", "options": ["A. Giọt mưa rơi với vận tốc không đổi (đạt vận tốc giới hạn)", "B. Giọt mưa rơi nhanh dần đều với gia tốc $g$", "C. Giọt mưa dừng lại giữa không trung", "D. Giọt mưa chuyển động chậm dần rồi dừng lại"], "answer": "A", "explain": "Khi $F_c = P = 11$ N, hợp lực tác dụng lên giọt mưa bằng 0 nên theo định luật 1 Newton, giọt mưa chuyển động thẳng đều với vận tốc không đổi — gọi là vận tốc giới hạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cánh máy bay được thiết kế sao cho khi bay, vận tốc dòng khí ở mặt trên của cánh là $v_1 = 160$ m/s, lớn hơn vận tốc dòng khí ở mặt dưới $v_2 = 130$ m/s. Điều này tạo ra:", "options": ["A. Lực cản hướng xuống do áp suất ở mặt trên lớn hơn", "B. Lực nâng hướng lên do áp suất ở mặt dưới cánh lớn hơn ở mặt trên", "C. Lực đẩy ngang giúp máy bay tiến về phía trước", "D. Trọng lực của máy bay giảm đi"], "answer": "B", "explain": "Theo nguyên lí Bernoulli: nơi nào dòng khí chuyển động nhanh hơn thì áp suất nhỏ hơn. Vì $v_1 = 160$ m/s lớn hơn $v_2 = 130$ m/s nên áp suất mặt dưới lớn hơn mặt trên, chênh lệch áp suất tạo ra lực nâng hướng lên, cân bằng với trọng lực khi máy bay bay ổn định.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 10$ N.s/m. Vật có khối lượng $m = 50$ kg. Vận tốc giới hạn của vật khi rơi là (lấy $g = 10$ m/s$^2$):", "options": ["A. $25$ m/s", "B. $100$ m/s", "C. $50$ m/s", "D. $0.2$ m/s"], "answer": "C", "explain": "Vận tốc giới hạn đạt được khi lực cản cân bằng với trọng lực: $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{50 \\cdot 10}{10} = 50$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai vật A và B có cùng hình dạng, khối lượng $m_A = 30$ kg và $m_B = 10$ kg, cùng rơi trong không khí. Giả sử lực cản của không khí tỉ lệ với vận tốc ($F_c = kv$, cùng hệ số $k$ cho hai vật). Tỉ số vận tốc giới hạn $\\frac{v_{ghA}}{v_{ghB}}$ bằng:", "options": ["A. 9", "B. 0.33", "C. 1", "D. 3"], "answer": "D", "explain": "$v_{gh} = \\frac{mg}{k}$ tỉ lệ thuận với $m$ nên $\\frac{v_{ghA}}{v_{ghB}} = \\frac{m_A}{m_B} = \\frac{30}{10} = 3$. Vật nặng hơn có vận tốc giới hạn lớn hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật rơi trong không khí. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực cản của chất lưu tác dụng lên vật chuyển động có hướng ngược với hướng chuyển động của vật.", "b) Một giọt mưa đang rơi với vận tốc không đổi $v = 15$ m/s; khi đó lực cản của không khí cân bằng với trọng lực của giọt mưa.", "c) Lực cản của không khí càng lớn khi vật chuyển động càng nhanh.", "d) Vận tốc giới hạn là vận tốc lớn nhất mà vật có thể đạt được khi rơi tự do trong chân không."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: hợp lực bằng 0 nên vật chuyển động thẳng đều với vận tốc $v = 15$ m/s. c) Đúng. d) Sai: trong chân không không có lực cản nên không có vận tốc giới hạn; vận tốc giới hạn chỉ xuất hiện khi vật rơi trong chất lưu.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về lực nâng và lực cản. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Khi máy bay bay ổn định ở độ cao không đổi, lực nâng của không khí cân bằng với trọng lực của máy bay.", "b) Cánh máy bay được thiết kế sao cho vận tốc dòng khí ở mặt trên cánh $v_1 = 160$ m/s lớn hơn vận tốc ở mặt dưới $v_2 = 130$ m/s.", "c) Lực nâng của cánh máy bay có hướng cùng chiều với trọng lực.", "d) Người ta thiết kế ô tô có hình dạng khí động học để giảm lực cản của không khí."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: hợp lực theo phương đứng bằng 0. b) Đúng. c) Sai: lực nâng hướng lên, ngược chiều trọng lực. d) Đúng: hình dạng thuôn dài làm giảm lực cản, tiết kiệm nhiên liệu.", "points": 1}, {"type": "short", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 2$ N.s/m. Vật có khối lượng $m = 7$ kg. Tính vận tốc giới hạn của vật khi rơi (đơn vị: m/s; lấy $g = 10$ m/s$^2$).", "answer": "35", "explain": "Khi đạt vận tốc giới hạn: $F_c = P$, tức $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{7 \\cdot 10}{2} = 35$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một người nhảy dù có tổng khối lượng $m = 36$ kg. Khi dù đã bung hoàn toàn, giả sử lực cản của không khí tỉ lệ với bình phương vận tốc: $F_c = kv^2$ với $k = 10$ N.s$^2$/m$^2$. Tính vận tốc rơi ổn định (vận tốc giới hạn) của người đó (đơn vị: m/s; lấy $g = 10$ m/s$^2$).", "answer": "6", "explain": "Khi rơi ổn định: $kv^2 = mg$, suy ra $v = \\sqrt{\\frac{mg}{k}} = \\sqrt{\\frac{36 \\cdot 10}{10}} = 6$ m/s.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Xét một chiếc ô tô đang chạy trong không khí. Phát biểu nào sau đây đúng về lực cản của không khí?", "options": ["A. Lực cản cùng chiều với chiều chuyển động của vật", "B. Lực cản có phương vuông góc với hướng chuyển động", "C. Lực cản chỉ xuất hiện khi vật đứng yên", "D. Lực cản ngược chiều với chiều chuyển động của vật"], "answer": "D", "explain": "Khi vật chuyển động trong chất lưu (không khí, nước), chất lưu tác dụng lên vật một lực cản ngược chiều chuyển động, có tác dụng làm giảm tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một người đang nhảy dù với tốc độ rơi $12$ m/s. Lực cản của không khí tác dụng lên vật phụ thuộc vào các yếu tố nào?", "options": ["A. Hình dạng của vật, tốc độ chuyển động của vật và khối lượng riêng của không khí", "B. Khối lượng của vật và gia tốc của vật", "C. Chỉ phụ thuộc vào tốc độ của vật", "D. Chỉ phụ thuộc vào khối lượng riêng của không khí"], "answer": "A", "explain": "Lực cản phụ thuộc hình dạng khí động học của vật (vật càng thuôn dài cản càng nhỏ), tốc độ chuyển động (càng nhanh cản càng lớn) và tính chất của chất lưu. Khối lượng của vật không ảnh hưởng trực tiếp đến lực cản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một giọt mưa có trọng lượng $P = 12$ N đang rơi trong không khí. Khi lực cản của không khí đạt $F_c = 12$ N thì:", "options": ["A. Giọt mưa rơi nhanh dần đều với gia tốc $g$", "B. Giọt mưa rơi với vận tốc không đổi (đạt vận tốc giới hạn)", "C. Giọt mưa dừng lại giữa không trung", "D. Giọt mưa chuyển động chậm dần rồi dừng lại"], "answer": "B", "explain": "Khi $F_c = P = 12$ N, hợp lực tác dụng lên giọt mưa bằng 0 nên theo định luật 1 Newton, giọt mưa chuyển động thẳng đều với vận tốc không đổi — gọi là vận tốc giới hạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cánh máy bay được thiết kế sao cho khi bay, vận tốc dòng khí ở mặt trên của cánh là $v_1 = 140$ m/s, lớn hơn vận tốc dòng khí ở mặt dưới $v_2 = 110$ m/s. Điều này tạo ra:", "options": ["A. Lực cản hướng xuống do áp suất ở mặt trên lớn hơn", "B. Lực đẩy ngang giúp máy bay tiến về phía trước", "C. Lực nâng hướng lên do áp suất ở mặt dưới cánh lớn hơn ở mặt trên", "D. Trọng lực của máy bay giảm đi"], "answer": "C", "explain": "Theo nguyên lí Bernoulli: nơi nào dòng khí chuyển động nhanh hơn thì áp suất nhỏ hơn. Vì $v_1 = 140$ m/s lớn hơn $v_2 = 110$ m/s nên áp suất mặt dưới lớn hơn mặt trên, chênh lệch áp suất tạo ra lực nâng hướng lên, cân bằng với trọng lực khi máy bay bay ổn định.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 3$ N.s/m. Vật có khối lượng $m = 6$ kg. Vận tốc giới hạn của vật khi rơi là (lấy $g = 10$ m/s$^2$):", "options": ["A. $10$ m/s", "B. $40$ m/s", "C. $0.5$ m/s", "D. $20$ m/s"], "answer": "D", "explain": "Vận tốc giới hạn đạt được khi lực cản cân bằng với trọng lực: $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{6 \\cdot 10}{3} = 20$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một máy bay có khối lượng $m = 6000$ kg đang bay ổn định ở độ cao không đổi. Phát biểu nào sau đây đúng?", "options": ["A. Lực nâng của không khí cân bằng với trọng lực của máy bay", "B. Lực nâng lớn hơn trọng lực nên máy bay bay lên cao mãi", "C. Trọng lực của máy bay bằng 0 khi bay ổn định", "D. Lực cản của không khí giúp máy bay bay lên"], "answer": "A", "explain": "Bay ổn định ở độ cao không đổi nghĩa là hợp lực bằng 0: lực nâng $F_n$ cân bằng với trọng lực $P = mg = 60000$ N (hướng lên), đồng thời lực đẩy của động cơ cân bằng với lực cản của không khí (phương ngang).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật rơi trong không khí. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực cản của chất lưu tác dụng lên vật chuyển động có hướng ngược với hướng chuyển động của vật.", "b) Một giọt mưa đang rơi với vận tốc không đổi $v = 7$ m/s; khi đó lực cản của không khí cân bằng với trọng lực của giọt mưa.", "c) Lực cản của không khí càng lớn khi vật chuyển động càng nhanh.", "d) Vận tốc giới hạn là vận tốc lớn nhất mà vật có thể đạt được khi rơi tự do trong chân không."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: hợp lực bằng 0 nên vật chuyển động thẳng đều với vận tốc $v = 7$ m/s. c) Đúng. d) Sai: trong chân không không có lực cản nên không có vận tốc giới hạn; vận tốc giới hạn chỉ xuất hiện khi vật rơi trong chất lưu.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về lực nâng và lực cản. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Khi máy bay bay ổn định ở độ cao không đổi, lực nâng của không khí cân bằng với trọng lực của máy bay.", "b) Cánh máy bay được thiết kế sao cho vận tốc dòng khí ở mặt trên cánh $v_1 = 140$ m/s lớn hơn vận tốc ở mặt dưới $v_2 = 110$ m/s.", "c) Lực nâng của cánh máy bay có hướng cùng chiều với trọng lực.", "d) Người ta thiết kế ô tô có hình dạng khí động học để giảm lực cản của không khí."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: hợp lực theo phương đứng bằng 0. b) Đúng. c) Sai: lực nâng hướng lên, ngược chiều trọng lực. d) Đúng: hình dạng thuôn dài làm giảm lực cản, tiết kiệm nhiên liệu.", "points": 1}, {"type": "short", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 6$ N.s/m. Vật có khối lượng $m = 18$ kg. Tính vận tốc giới hạn của vật khi rơi (đơn vị: m/s; lấy $g = 10$ m/s$^2$).", "answer": "30", "explain": "Khi đạt vận tốc giới hạn: $F_c = P$, tức $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{18 \\cdot 10}{6} = 30$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai viên bi có cùng hình dạng, khối lượng $m_1 = 60$ g và $m_2 = 40$ g, cùng rơi trong không khí. Giả sử lực cản của không khí tỉ lệ với vận tốc ($F_c = kv$, cùng hệ số $k$). Tính tỉ số vận tốc giới hạn $\\frac{v_{gh1}}{v_{gh2}}$ (làm tròn đến 1 chữ số thập phân).", "answer": "1.5", "explain": "$v_{gh} = \\frac{mg}{k}$ tỉ lệ thuận với $m$ nên $\\frac{v_{gh1}}{v_{gh2}} = \\frac{m_1}{m_2} = \\frac{60}{40} = 1.5$.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Xét một giọt mưa đang rơi trong không khí. Phát biểu nào sau đây đúng về lực cản của không khí?", "options": ["A. Lực cản ngược chiều với chiều chuyển động của vật", "B. Lực cản cùng chiều với chiều chuyển động của vật", "C. Lực cản có phương vuông góc với hướng chuyển động", "D. Lực cản chỉ xuất hiện khi vật đứng yên"], "answer": "A", "explain": "Khi vật chuyển động trong chất lưu (không khí, nước), chất lưu tác dụng lên vật một lực cản ngược chiều chuyển động, có tác dụng làm giảm tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một giọt mưa đang rơi với tốc độ $10$ m/s. Lực cản của không khí tác dụng lên vật phụ thuộc vào các yếu tố nào?", "options": ["A. Khối lượng của vật và gia tốc của vật", "B. Hình dạng của vật, tốc độ chuyển động của vật và khối lượng riêng của không khí", "C. Chỉ phụ thuộc vào tốc độ của vật", "D. Chỉ phụ thuộc vào khối lượng riêng của không khí"], "answer": "B", "explain": "Lực cản phụ thuộc hình dạng khí động học của vật (vật càng thuôn dài cản càng nhỏ), tốc độ chuyển động (càng nhanh cản càng lớn) và tính chất của chất lưu. Khối lượng của vật không ảnh hưởng trực tiếp đến lực cản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một giọt mưa có trọng lượng $P = 13$ N đang rơi trong không khí. Khi lực cản của không khí đạt $F_c = 13$ N thì:", "options": ["A. Giọt mưa rơi nhanh dần đều với gia tốc $g$", "B. Giọt mưa dừng lại giữa không trung", "C. Giọt mưa rơi với vận tốc không đổi (đạt vận tốc giới hạn)", "D. Giọt mưa chuyển động chậm dần rồi dừng lại"], "answer": "C", "explain": "Khi $F_c = P = 13$ N, hợp lực tác dụng lên giọt mưa bằng 0 nên theo định luật 1 Newton, giọt mưa chuyển động thẳng đều với vận tốc không đổi — gọi là vận tốc giới hạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cánh máy bay được thiết kế sao cho khi bay, vận tốc dòng khí ở mặt trên của cánh là $v_1 = 100$ m/s, lớn hơn vận tốc dòng khí ở mặt dưới $v_2 = 80$ m/s. Điều này tạo ra:", "options": ["A. Lực cản hướng xuống do áp suất ở mặt trên lớn hơn", "B. Lực đẩy ngang giúp máy bay tiến về phía trước", "C. Trọng lực của máy bay giảm đi", "D. Lực nâng hướng lên do áp suất ở mặt dưới cánh lớn hơn ở mặt trên"], "answer": "D", "explain": "Theo nguyên lí Bernoulli: nơi nào dòng khí chuyển động nhanh hơn thì áp suất nhỏ hơn. Vì $v_1 = 100$ m/s lớn hơn $v_2 = 80$ m/s nên áp suất mặt dưới lớn hơn mặt trên, chênh lệch áp suất tạo ra lực nâng hướng lên, cân bằng với trọng lực khi máy bay bay ổn định.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 4$ N.s/m. Vật có khối lượng $m = 12$ kg. Vận tốc giới hạn của vật khi rơi là (lấy $g = 10$ m/s$^2$):", "options": ["A. $30$ m/s", "B. $15$ m/s", "C. $60$ m/s", "D. $0.33$ m/s"], "answer": "A", "explain": "Vận tốc giới hạn đạt được khi lực cản cân bằng với trọng lực: $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{12 \\cdot 10}{4} = 30$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai vật A và B có cùng hình dạng, khối lượng $m_A = 12$ kg và $m_B = 4$ kg, cùng rơi trong không khí. Giả sử lực cản của không khí tỉ lệ với vận tốc ($F_c = kv$, cùng hệ số $k$ cho hai vật). Tỉ số vận tốc giới hạn $\\frac{v_{ghA}}{v_{ghB}}$ bằng:", "options": ["A. 9", "B. 3", "C. 0.33", "D. 1"], "answer": "B", "explain": "$v_{gh} = \\frac{mg}{k}$ tỉ lệ thuận với $m$ nên $\\frac{v_{ghA}}{v_{ghB}} = \\frac{m_A}{m_B} = \\frac{12}{4} = 3$. Vật nặng hơn có vận tốc giới hạn lớn hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật rơi trong không khí. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực cản của chất lưu tác dụng lên vật chuyển động có hướng ngược với hướng chuyển động của vật.", "b) Một giọt mưa đang rơi với vận tốc không đổi $v = 9$ m/s; khi đó lực cản của không khí cân bằng với trọng lực của giọt mưa.", "c) Lực cản của không khí càng lớn khi vật chuyển động càng nhanh.", "d) Vận tốc giới hạn là vận tốc lớn nhất mà vật có thể đạt được khi rơi tự do trong chân không."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: hợp lực bằng 0 nên vật chuyển động thẳng đều với vận tốc $v = 9$ m/s. c) Đúng. d) Sai: trong chân không không có lực cản nên không có vận tốc giới hạn; vận tốc giới hạn chỉ xuất hiện khi vật rơi trong chất lưu.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về lực nâng và lực cản. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Khi máy bay bay ổn định ở độ cao không đổi, lực nâng của không khí cân bằng với trọng lực của máy bay.", "b) Cánh máy bay được thiết kế sao cho vận tốc dòng khí ở mặt trên cánh $v_1 = 100$ m/s lớn hơn vận tốc ở mặt dưới $v_2 = 80$ m/s.", "c) Lực nâng của cánh máy bay có hướng cùng chiều với trọng lực.", "d) Người ta thiết kế ô tô có hình dạng khí động học để giảm lực cản của không khí."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: hợp lực theo phương đứng bằng 0. b) Đúng. c) Sai: lực nâng hướng lên, ngược chiều trọng lực. d) Đúng: hình dạng thuôn dài làm giảm lực cản, tiết kiệm nhiên liệu.", "points": 1}, {"type": "short", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 5$ N.s/m. Vật có khối lượng $m = 25$ kg. Tính vận tốc giới hạn của vật khi rơi (đơn vị: m/s; lấy $g = 10$ m/s$^2$).", "answer": "50", "explain": "Khi đạt vận tốc giới hạn: $F_c = P$, tức $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{25 \\cdot 10}{5} = 50$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một người nhảy dù có tổng khối lượng $m = 200$ kg. Khi dù đã bung hoàn toàn, giả sử lực cản của không khí tỉ lệ với bình phương vận tốc: $F_c = kv^2$ với $k = 80$ N.s$^2$/m$^2$. Tính vận tốc rơi ổn định (vận tốc giới hạn) của người đó (đơn vị: m/s; lấy $g = 10$ m/s$^2$).", "answer": "5", "explain": "Khi rơi ổn định: $kv^2 = mg$, suy ra $v = \\sqrt{\\frac{mg}{k}} = \\sqrt{\\frac{200 \\cdot 10}{80}} = 5$ m/s.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Xét một người đang nhảy dù trong không khí. Phát biểu nào sau đây đúng về lực cản của không khí?", "options": ["A. Lực cản cùng chiều với chiều chuyển động của vật", "B. Lực cản ngược chiều với chiều chuyển động của vật", "C. Lực cản có phương vuông góc với hướng chuyển động", "D. Lực cản chỉ xuất hiện khi vật đứng yên"], "answer": "B", "explain": "Khi vật chuyển động trong chất lưu (không khí, nước), chất lưu tác dụng lên vật một lực cản ngược chiều chuyển động, có tác dụng làm giảm tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một chiếc ô tô đang chạy với tốc độ $85$ km/h. Lực cản của không khí tác dụng lên vật phụ thuộc vào các yếu tố nào?", "options": ["A. Khối lượng của vật và gia tốc của vật", "B. Chỉ phụ thuộc vào tốc độ của vật", "C. Hình dạng của vật, tốc độ chuyển động của vật và khối lượng riêng của không khí", "D. Chỉ phụ thuộc vào khối lượng riêng của không khí"], "answer": "C", "explain": "Lực cản phụ thuộc hình dạng khí động học của vật (vật càng thuôn dài cản càng nhỏ), tốc độ chuyển động (càng nhanh cản càng lớn) và tính chất của chất lưu. Khối lượng của vật không ảnh hưởng trực tiếp đến lực cản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một giọt mưa có trọng lượng $P = 14$ N đang rơi trong không khí. Khi lực cản của không khí đạt $F_c = 14$ N thì:", "options": ["A. Giọt mưa rơi nhanh dần đều với gia tốc $g$", "B. Giọt mưa dừng lại giữa không trung", "C. Giọt mưa chuyển động chậm dần rồi dừng lại", "D. Giọt mưa rơi với vận tốc không đổi (đạt vận tốc giới hạn)"], "answer": "D", "explain": "Khi $F_c = P = 14$ N, hợp lực tác dụng lên giọt mưa bằng 0 nên theo định luật 1 Newton, giọt mưa chuyển động thẳng đều với vận tốc không đổi — gọi là vận tốc giới hạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cánh máy bay được thiết kế sao cho khi bay, vận tốc dòng khí ở mặt trên của cánh là $v_1 = 130$ m/s, lớn hơn vận tốc dòng khí ở mặt dưới $v_2 = 105$ m/s. Điều này tạo ra:", "options": ["A. Lực nâng hướng lên do áp suất ở mặt dưới cánh lớn hơn ở mặt trên", "B. Lực cản hướng xuống do áp suất ở mặt trên lớn hơn", "C. Lực đẩy ngang giúp máy bay tiến về phía trước", "D. Trọng lực của máy bay giảm đi"], "answer": "A", "explain": "Theo nguyên lí Bernoulli: nơi nào dòng khí chuyển động nhanh hơn thì áp suất nhỏ hơn. Vì $v_1 = 130$ m/s lớn hơn $v_2 = 105$ m/s nên áp suất mặt dưới lớn hơn mặt trên, chênh lệch áp suất tạo ra lực nâng hướng lên, cân bằng với trọng lực khi máy bay bay ổn định.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 6$ N.s/m. Vật có khối lượng $m = 30$ kg. Vận tốc giới hạn của vật khi rơi là (lấy $g = 10$ m/s$^2$):", "options": ["A. $25$ m/s", "B. $50$ m/s", "C. $100$ m/s", "D. $0.2$ m/s"], "answer": "B", "explain": "Vận tốc giới hạn đạt được khi lực cản cân bằng với trọng lực: $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{30 \\cdot 10}{6} = 50$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một máy bay có khối lượng $m = 12000$ kg đang bay ổn định ở độ cao không đổi. Phát biểu nào sau đây đúng?", "options": ["A. Lực nâng lớn hơn trọng lực nên máy bay bay lên cao mãi", "B. Trọng lực của máy bay bằng 0 khi bay ổn định", "C. Lực nâng của không khí cân bằng với trọng lực của máy bay", "D. Lực cản của không khí giúp máy bay bay lên"], "answer": "C", "explain": "Bay ổn định ở độ cao không đổi nghĩa là hợp lực bằng 0: lực nâng $F_n$ cân bằng với trọng lực $P = mg = 120000$ N (hướng lên), đồng thời lực đẩy của động cơ cân bằng với lực cản của không khí (phương ngang).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật rơi trong không khí. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Lực cản của chất lưu tác dụng lên vật chuyển động có hướng ngược với hướng chuyển động của vật.", "b) Một giọt mưa đang rơi với vận tốc không đổi $v = 11$ m/s; khi đó lực cản của không khí cân bằng với trọng lực của giọt mưa.", "c) Lực cản của không khí càng lớn khi vật chuyển động càng nhanh.", "d) Vận tốc giới hạn là vận tốc lớn nhất mà vật có thể đạt được khi rơi tự do trong chân không."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: hợp lực bằng 0 nên vật chuyển động thẳng đều với vận tốc $v = 11$ m/s. c) Đúng. d) Sai: trong chân không không có lực cản nên không có vận tốc giới hạn; vận tốc giới hạn chỉ xuất hiện khi vật rơi trong chất lưu.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về lực nâng và lực cản. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Khi máy bay bay ổn định ở độ cao không đổi, lực nâng của không khí cân bằng với trọng lực của máy bay.", "b) Cánh máy bay được thiết kế sao cho vận tốc dòng khí ở mặt trên cánh $v_1 = 130$ m/s lớn hơn vận tốc ở mặt dưới $v_2 = 105$ m/s.", "c) Lực nâng của cánh máy bay có hướng cùng chiều với trọng lực.", "d) Người ta thiết kế ô tô có hình dạng khí động học để giảm lực cản của không khí."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: hợp lực theo phương đứng bằng 0. b) Đúng. c) Sai: lực nâng hướng lên, ngược chiều trọng lực. d) Đúng: hình dạng thuôn dài làm giảm lực cản, tiết kiệm nhiên liệu.", "points": 1}, {"type": "short", "level": "VD", "q": "Giả sử lực cản của không khí tác dụng lên một vật đang rơi tỉ lệ với vận tốc của vật theo công thức $F_c = kv$ với $k = 9$ N.s/m. Vật có khối lượng $m = 36$ kg. Tính vận tốc giới hạn của vật khi rơi (đơn vị: m/s; lấy $g = 10$ m/s$^2$).", "answer": "40", "explain": "Khi đạt vận tốc giới hạn: $F_c = P$, tức $kv_{gh} = mg$, suy ra $v_{gh} = \\frac{mg}{k} = \\frac{36 \\cdot 10}{9} = 40$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai viên bi có cùng hình dạng, khối lượng $m_1 = 70$ g và $m_2 = 50$ g, cùng rơi trong không khí. Giả sử lực cản của không khí tỉ lệ với vận tốc ($F_c = kv$, cùng hệ số $k$). Tính tỉ số vận tốc giới hạn $\\frac{v_{gh1}}{v_{gh2}}$ (làm tròn đến 1 chữ số thập phân).", "answer": "1.4", "explain": "$v_{gh} = \\frac{mg}{k}$ tỉ lệ thuận với $m$ nên $\\frac{v_{gh1}}{v_{gh2}} = \\frac{m_1}{m_2} = \\frac{70}{50} = 1.4$.", "points": 0.5}]}]}
