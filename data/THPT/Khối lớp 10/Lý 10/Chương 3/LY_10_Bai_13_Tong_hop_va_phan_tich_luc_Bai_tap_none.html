 lực $\\vec{F_1}$, $\\vec{F_2}$ là vectơ đường chéo của hình bình hành có hai cạnh là $\\vec{F_1}$, $\\vec{F_2}$.", "d) Lực là đại lượng vectơ nên phép tổng hợp lực tuân theo quy tắc cộng vectơ."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: cùng phương cùng chiều thì $F = F_1 + F_2 = 17$ N. b) Đúng: $F \\le F_1 + F_2$ luôn thỏa mãn.. c) Đúng: đây chính là quy tắc hình bình hành. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai lực đồng quy $F_1 = 5$ N, $F_2 = 12$ N vuông góc với nhau. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Độ lớn hợp lực của hai lực là $F = 13$ N.", "b) Hợp lực có độ lớn $F = F_1 + F_2 = 17$ N.", "c) Nếu hai lực ngược chiều nhau thì hợp lực có độ lớn $|F_1 - F_2| = 7$ N.", "d) Góc $\\varphi$ giữa hợp lực và lực $\\vec{F_1}$ thỏa mãn $\\tan\\varphi = \\frac{F_2}{F_1} = \\frac{12}{5}$."], "answer": ["T", "F", "T", "T"], "explain": "$F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{5^2 + 12^2} = 13$ N nên a) đúng, b) sai. c) Đúng: ngược chiều thì $F = |F_1 - F_2| = 7$ N. d) Đúng theo định nghĩa tang của góc trong tam giác lực vuông.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật chịu tác dụng của hai lực vuông góc $F_1 = 9$ N và $F_2 = 40$ N. Tính độ lớn hợp lực của chúng (đơn vị: N).", "answer": "41", "explain": "$F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{9^2 + 40^2} = 41$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật có trọng lượng $P = 100$ N đặt trên mặt phẳng nghiêng góc $37^\\circ$ so với phương ngang ($\\sin37^\\circ \\approx 0{,}6$). Tính độ lớn thành phần của trọng lực dọc theo mặt phẳng nghiêng (đơn vị: N, làm tròn đến hàng đơn vị).", "answer": "60", "explain": "$P_1 = P\\sin37^\\circ \\approx 100 \\cdot 0{,}6 = 60$ N.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Hai lực đồng quy $\\vec{F_1}$, $\\vec{F_2}$ có độ lớn $F_1 = 9$ N, $F_2 = 12$ N. Muốn xác định hợp lực $\\vec{F}$ của chúng, ta dùng quy tắc nào?", "options": ["A. Quy tắc tam suất", "B. Quy tắc bàn tay trái", "C. Quy tắc hình bình hành", "D. Quy tắc nắm tay phải"], "answer": "C", "explain": "Lực là đại lượng vectơ; tổng hợp hai lực đồng quy tuân theo quy tắc hình bình hành: hợp lực $\\vec{F} = \\vec{F_1} + \\vec{F_2}$ là đường chéo của hình bình hành có hai cạnh là $\\vec{F_1}$, $\\vec{F_2}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai lực $F_1 = 11$ N và $F_2 = 13$ N đồng quy. Độ lớn $F$ của hợp lực thỏa mãn hệ thức nào?", "options": ["A. $F = 24$ N", "B. $F = 2$ N", "C. $0 \\le F \\le 24$ (N)", "D. $2 \\le F \\le 24$ (N)"], "answer": "D", "explain": "Độ lớn hợp lực nằm trong khoảng $|F_1 - F_2| \\le F \\le F_1 + F_2$, tức $2 \\le F \\le 24$ (N). Dấu bằng xảy ra khi hai lực cùng phương: cùng chiều ($F = F_1 + F_2$) hoặc ngược chiều ($F = |F_1 - F_2|$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai lực đồng quy vuông góc với nhau cùng tác dụng lên một vật với $F_1 = 9$ N, $F_2 = 40$ N. Độ lớn hợp lực của chúng là:", "options": ["A. $41$ N", "B. $49$ N", "C. $31$ N", "D. $34.31$ N"], "answer": "A", "explain": "Hai lực vuông góc ($\\alpha = 90^\\circ$) nên $F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{9^2 + 40^2} = 41$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai lực $F_1 = 9$ N và $F_2 = 40$ N cùng phương, cùng chiều tác dụng lên một vật. Hợp lực của chúng có độ lớn:", "options": ["A. $31$ N", "B. $49$ N", "C. $41$ N", "D. $360$ N"], "answer": "B", "explain": "Cùng phương cùng chiều ($\\alpha = 0^\\circ$): $F = F_1 + F_2 = 9 + 40 = 49$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai lực đồng quy có độ lớn bằng nhau $F_1 = F_2 = 10$ N, góc giữa chúng bằng $120^\\circ$. Độ lớn hợp lực là:", "options": ["A. $20$ N", "B. $17.32$ N", "C. $10$ N", "D. $0$ N"], "answer": "C", "explain": "$F^2 = F_1^2 + F_2^2 + 2F_1F_2\\cos120^\\circ = 10^2 + 10^2 + 2 \\cdot 10 \\cdot 10 \\cdot \\left(-\\frac{1}{2}\\right) = 10^2$, suy ra $F = 10$ N.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một lực $\\vec{F}$ có độ lớn $F = 150$ N hợp với phương ngang một góc $37^\\circ$ ($\\sin37^\\circ \\approx 0{,}6$; $\\cos37^\\circ \\approx 0{,}8$). Độ lớn thành phần của $\\vec{F}$ theo phương ngang là:", "options": ["A. $90$ N", "B. $150$ N", "C. $75$ N", "D. $120$ N"], "answer": "D", "explain": "Phân tích $\\vec{F}$ thành hai thành phần vuông góc: $F_x = F\\cos37^\\circ \\approx 150 \\cdot 0{,}8 = 120$ N; $F_y = F\\sin37^\\circ \\approx 90$ N.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét hai lực đồng quy $F_1 = 9$ N, $F_2 = 12$ N tác dụng lên một chất điểm. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Hai lực $F_1 = 9$ N và $F_2 = 12$ N cùng phương, cùng chiều có hợp lực $F = 21$ N.", "b) Hợp lực của hai lực đồng quy có độ lớn luôn bằng tổng độ lớn của hai lực thành phần.", "c) Muốn tổng hợp hai lực đồng quy, ta dùng quy tắc hình bình hành.", "d) Lực là đại lượng vectơ nên phép tổng hợp lực tuân theo quy tắc cộng vectơ."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: cùng phương cùng chiều thì $F = F_1 + F_2 = 21$ N. b) Sai: chỉ đúng khi hai lực cùng phương cùng chiều; nói chung $|F_1-F_2| \\le F \\le F_1+F_2$.. c) Đúng: đây chính là quy tắc hình bình hành. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai lực đồng quy $F_1 = 9$ N, $F_2 = 40$ N vuông góc với nhau. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Độ lớn hợp lực của hai lực là $F = 41$ N.", "b) Hợp lực có độ lớn $F = F_1 + F_2 = 49$ N.", "c) Nếu hai lực ngược chiều nhau thì hợp lực có độ lớn $|F_1 - F_2| = 31$ N.", "d) Góc $\\varphi$ giữa hợp lực và lực $\\vec{F_1}$ thỏa mãn $\\tan\\varphi = \\frac{F_2}{F_1} = \\frac{40}{9}$."], "answer": ["T", "F", "T", "T"], "explain": "$F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{9^2 + 40^2} = 41$ N nên a) đúng, b) sai. c) Đúng: ngược chiều thì $F = |F_1 - F_2| = 31$ N. d) Đúng theo định nghĩa tang của góc trong tam giác lực vuông.", "points": 1}, {"type": "short", "level": "VD", "q": "Hai lực đồng quy $F_1 = 12$ N, $F_2 = 35$ N vuông góc với nhau. Tính độ lớn hợp lực của chúng (đơn vị: N).", "answer": "37", "explain": "$F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{12^2 + 35^2} = 37$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật có trọng lượng $P = 60$ N đặt trên mặt phẳng nghiêng góc $30^\\circ$ so với phương ngang. Tính độ lớn thành phần của trọng lực dọc theo mặt phẳng nghiêng (đơn vị: N).", "answer": "30", "explain": "Phân tích trọng lực $\\vec{P}$ thành hai thành phần vuông góc: dọc mặt phẳng nghiêng $P_1 = P\\sin30^\\circ = 60 \\cdot \\frac{1}{2} = 30$ N; vuông góc mặt phẳng nghiêng $P_2 = P\\cos30^\\circ$.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Hai lực đồng quy $\\vec{F_1}$, $\\vec{F_2}$ có độ lớn $F_1 = 8$ N, $F_2 = 15$ N. Muốn xác định hợp lực $\\vec{F}$ của chúng, ta dùng quy tắc nào?", "options": ["A. Quy tắc tam suất", "B. Quy tắc bàn tay trái", "C. Quy tắc nắm tay phải", "D. Quy tắc hình bình hành"], "answer": "D", "explain": "Lực là đại lượng vectơ; tổng hợp hai lực đồng quy tuân theo quy tắc hình bình hành: hợp lực $\\vec{F} = \\vec{F_1} + \\vec{F_2}$ là đường chéo của hình bình hành có hai cạnh là $\\vec{F_1}$, $\\vec{F_2}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai lực $F_1 = 10$ N và $F_2 = 16$ N đồng quy. Độ lớn $F$ của hợp lực thỏa mãn hệ thức nào?", "options": ["A. $6 \\le F \\le 26$ (N)", "B. $F = 26$ N", "C. $F = 6$ N", "D. $0 \\le F \\le 26$ (N)"], "answer": "A", "explain": "Độ lớn hợp lực nằm trong khoảng $|F_1 - F_2| \\le F \\le F_1 + F_2$, tức $6 \\le F \\le 26$ (N). Dấu bằng xảy ra khi hai lực cùng phương: cùng chiều ($F = F_1 + F_2$) hoặc ngược chiều ($F = |F_1 - F_2|$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai người cùng kéo một chiếc thuyền bằng hai dây vuông góc với nhau với $F_1 = 12$ N, $F_2 = 35$ N. Độ lớn hợp lực của chúng là:", "options": ["A. $47$ N", "B. $37$ N", "C. $23$ N", "D. $29.13$ N"], "answer": "B", "explain": "Hai lực vuông góc ($\\alpha = 90^\\circ$) nên $F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{12^2 + 35^2} = 37$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai lực $F_1 = 12$ N và $F_2 = 35$ N cùng phương, ngược chiều tác dụng lên một vật. Hợp lực của chúng có độ lớn:", "options": ["A. $47$ N", "B. $37$ N", "C. $23$ N", "D. $0$ N"], "answer": "C", "explain": "Cùng phương ngược chiều ($\\alpha = 180^\\circ$): $F = |F_1 - F_2| = |12 - 35| = 23$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai lực đồng quy có độ lớn bằng nhau $F_1 = F_2 = 12$ N, góc giữa chúng bằng $60^\\circ$. Độ lớn hợp lực là:", "options": ["A. $12$ N", "B. $24$ N", "C. $6$ N", "D. $12\\sqrt{3}$ N"], "answer": "D", "explain": "$F^2 = F_1^2 + F_2^2 + 2F_1F_2\\cos60^\\circ = 12^2 + 12^2 + 2 \\cdot 12 \\cdot 12 \\cdot \\frac{1}{2} = 3 \\cdot 12^2$, suy ra $F = 12\\sqrt{3}$ N.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một chất điểm đứng yên dưới tác dụng của ba lực đồng phẳng $\\vec{F_1}$, $\\vec{F_2}$, $\\vec{F_3}$. Biết $F_1 = 8$ N, $F_2 = 15$ N và góc giữa $\\vec{F_1}$, $\\vec{F_2}$ bằng $90^\\circ$. Độ lớn của $\\vec{F_3}$ là:", "options": ["A. $17$ N", "B. $23$ N", "C. $7$ N", "D. $8.5$ N"], "answer": "A", "explain": "Cân bằng: $\\vec{F_1} + \\vec{F_2} + \\vec{F_3} = \\vec{0}$ nên $\\vec{F_3} = -(\\vec{F_1} + \\vec{F_2})$, độ lớn $F_3 = \\sqrt{F_1^2 + F_2^2} = \\sqrt{8^2 + 15^2} = 17$ N.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét hai lực đồng quy $F_1 = 8$ N, $F_2 = 15$ N tác dụng lên một chất điểm. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Hai lực $F_1 = 8$ N và $F_2 = 15$ N cùng phương, cùng chiều có hợp lực $F = 23$ N.", "b) Độ lớn của hợp lực không bao giờ vượt quá tổng độ lớn của hai lực thành phần.", "c) Hợp lực của hai lực $\\vec{F_1}$, $\\vec{F_2}$ là vectơ đường chéo của hình bình hành có hai cạnh là $\\vec{F_1}$, $\\vec{F_2}$.", "d) Lực là đại lượng vectơ nên phép tổng hợp lực tuân theo quy tắc cộng vectơ."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: cùng phương cùng chiều thì $F = F_1 + F_2 = 23$ N. b) Đúng: $F \\le F_1 + F_2$ luôn thỏa mãn.. c) Đúng: đây chính là quy tắc hình bình hành. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai lực đồng quy $F_1 = 12$ N, $F_2 = 35$ N vuông góc với nhau. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Độ lớn hợp lực của hai lực là $F = 37$ N.", "b) Hợp lực có độ lớn $F = F_1 + F_2 = 47$ N.", "c) Nếu hai lực ngược chiều nhau thì hợp lực có độ lớn $|F_1 - F_2| = 23$ N.", "d) Góc $\\varphi$ giữa hợp lực và lực $\\vec{F_1}$ thỏa mãn $\\tan\\varphi = \\frac{F_2}{F_1} = \\frac{35}{12}$."], "answer": ["T", "F", "T", "T"], "explain": "$F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{12^2 + 35^2} = 37$ N nên a) đúng, b) sai. c) Đúng: ngược chiều thì $F = |F_1 - F_2| = 23$ N. d) Đúng theo định nghĩa tang của góc trong tam giác lực vuông.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật chịu tác dụng của hai lực vuông góc $F_1 = 20$ N và $F_2 = 48$ N. Tính độ lớn hợp lực của chúng (đơn vị: N).", "answer": "52", "explain": "$F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{20^2 + 48^2} = 52$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật có trọng lượng $P = 200$ N đặt trên mặt phẳng nghiêng góc $37^\\circ$ so với phương ngang ($\\sin37^\\circ \\approx 0{,}6$). Tính độ lớn thành phần của trọng lực dọc theo mặt phẳng nghiêng (đơn vị: N, làm tròn đến hàng đơn vị).", "answer": "120", "explain": "$P_1 = P\\sin37^\\circ \\approx 200 \\cdot 0{,}6 = 120$ N.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Hai lực đồng quy $\\vec{F_1}$, $\\vec{F_2}$ có độ lớn $F_1 = 20$ N, $F_2 = 21$ N. Muốn xác định hợp lực $\\vec{F}$ của chúng, ta dùng quy tắc nào?", "options": ["A. Quy tắc hình bình hành", "B. Quy tắc tam suất", "C. Quy tắc bàn tay trái", "D. Quy tắc nắm tay phải"], "answer": "A", "explain": "Lực là đại lượng vectơ; tổng hợp hai lực đồng quy tuân theo quy tắc hình bình hành: hợp lực $\\vec{F} = \\vec{F_1} + \\vec{F_2}$ là đường chéo của hình bình hành có hai cạnh là $\\vec{F_1}$, $\\vec{F_2}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai lực $F_1 = 22$ N và $F_2 = 22$ N đồng quy. Độ lớn $F$ của hợp lực thỏa mãn hệ thức nào?", "options": ["A. $F = 44$ N", "B. $0 \\le F \\le 44$ (N)", "C. $F = 0$ N", "D. $0 \\le F \\le 44$ (N)"], "answer": "B", "explain": "Độ lớn hợp lực nằm trong khoảng $|F_1 - F_2| \\le F \\le F_1 + F_2$, tức $0 \\le F \\le 44$ (N). Dấu bằng xảy ra khi hai lực cùng phương: cùng chiều ($F = F_1 + F_2$) hoặc ngược chiều ($F = |F_1 - F_2|$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một chất điểm chịu tác dụng đồng thời của hai lực vuông góc nhau với $F_1 = 20$ N, $F_2 = 48$ N. Độ lớn hợp lực của chúng là:", "options": ["A. $68$ N", "B. $28$ N", "C. $52$ N", "D. $39.76$ N"], "answer": "C", "explain": "Hai lực vuông góc ($\\alpha = 90^\\circ$) nên $F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{20^2 + 48^2} = 52$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai lực $F_1 = 20$ N và $F_2 = 48$ N cùng phương, cùng chiều tác dụng lên một vật. Hợp lực của chúng có độ lớn:", "options": ["A. $28$ N", "B. $52$ N", "C. $960$ N", "D. $68$ N"], "answer": "D", "explain": "Cùng phương cùng chiều ($\\alpha = 0^\\circ$): $F = F_1 + F_2 = 20 + 48 = 68$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai lực đồng quy có độ lớn bằng nhau $F_1 = F_2 = 15$ N, góc giữa chúng bằng $120^\\circ$. Độ lớn hợp lực là:", "options": ["A. $15$ N", "B. $30$ N", "C. $25.98$ N", "D. $0$ N"], "answer": "A", "explain": "$F^2 = F_1^2 + F_2^2 + 2F_1F_2\\cos120^\\circ = 15^2 + 15^2 + 2 \\cdot 15 \\cdot 15 \\cdot \\left(-\\frac{1}{2}\\right) = 15^2$, suy ra $F = 15$ N.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một lực $\\vec{F}$ có độ lớn $F = 250$ N hợp với phương ngang một góc $37^\\circ$ ($\\sin37^\\circ \\approx 0{,}6$; $\\cos37^\\circ \\approx 0{,}8$). Độ lớn thành phần của $\\vec{F}$ theo phương ngang là:", "options": ["A. $150$ N", "B. $200$ N", "C. $250$ N", "D. $125$ N"], "answer": "B", "explain": "Phân tích $\\vec{F}$ thành hai thành phần vuông góc: $F_x = F\\cos37^\\circ \\approx 250 \\cdot 0{,}8 = 200$ N; $F_y = F\\sin37^\\circ \\approx 150$ N.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét hai lực đồng quy $F_1 = 20$ N, $F_2 = 21$ N tác dụng lên một chất điểm. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Hai lực $F_1 = 20$ N và $F_2 = 21$ N cùng phương, cùng chiều có hợp lực $F = 41$ N.", "b) Hợp lực của hai lực đồng quy có độ lớn luôn bằng tổng độ lớn của hai lực thành phần.", "c) Muốn tổng hợp hai lực đồng quy, ta dùng quy tắc hình bình hành.", "d) Lực là đại lượng vectơ nên phép tổng hợp lực tuân theo quy tắc cộng vectơ."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: cùng phương cùng chiều thì $F = F_1 + F_2 = 41$ N. b) Sai: chỉ đúng khi hai lực cùng phương cùng chiều; nói chung $|F_1-F_2| \\le F \\le F_1+F_2$.. c) Đúng: đây chính là quy tắc hình bình hành. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai lực đồng quy $F_1 = 20$ N, $F_2 = 48$ N vuông góc với nhau. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Độ lớn hợp lực của hai lực là $F = 52$ N.", "b) Hợp lực có độ lớn $F = F_1 + F_2 = 68$ N.", "c) Nếu hai lực ngược chiều nhau thì hợp lực có độ lớn $|F_1 - F_2| = 28$ N.", "d) Góc $\\varphi$ giữa hợp lực và lực $\\vec{F_1}$ thỏa mãn $\\tan\\varphi = \\frac{F_2}{F_1} = \\frac{48}{20}$."], "answer": ["T", "F", "T", "T"], "explain": "$F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{20^2 + 48^2} = 52$ N nên a) đúng, b) sai. c) Đúng: ngược chiều thì $F = |F_1 - F_2| = 28$ N. d) Đúng theo định nghĩa tang của góc trong tam giác lực vuông.", "points": 1}, {"type": "short", "level": "VD", "q": "Hai lực đồng quy $F_1 = 11$ N, $F_2 = 60$ N vuông góc với nhau. Tính độ lớn hợp lực của chúng (đơn vị: N).", "answer": "61", "explain": "$F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{11^2 + 60^2} = 61$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật có trọng lượng $P = 100$ N đặt trên mặt phẳng nghiêng góc $30^\\circ$ so với phương ngang. Tính độ lớn thành phần của trọng lực dọc theo mặt phẳng nghiêng (đơn vị: N).", "answer": "50", "explain": "Phân tích trọng lực $\\vec{P}$ thành hai thành phần vuông góc: dọc mặt phẳng nghiêng $P_1 = P\\sin30^\\circ = 100 \\cdot \\frac{1}{2} = 50$ N; vuông góc mặt phẳng nghiêng $P_2 = P\\cos30^\\circ$.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Hai lực đồng quy $\\vec{F_1}$, $\\vec{F_2}$ có độ lớn $F_1 = 12$ N, $F_2 = 16$ N. Muốn xác định hợp lực $\\vec{F}$ của chúng, ta dùng quy tắc nào?", "options": ["A. Quy tắc tam suất", "B. Quy tắc hình bình hành", "C. Quy tắc bàn tay trái", "D. Quy tắc nắm tay phải"], "answer": "B", "explain": "Lực là đại lượng vectơ; tổng hợp hai lực đồng quy tuân theo quy tắc hình bình hành: hợp lực $\\vec{F} = \\vec{F_1} + \\vec{F_2}$ là đường chéo của hình bình hành có hai cạnh là $\\vec{F_1}$, $\\vec{F_2}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai lực $F_1 = 14$ N và $F_2 = 17$ N đồng quy. Độ lớn $F$ của hợp lực thỏa mãn hệ thức nào?", "options": ["A. $F = 31$ N", "B. $F = 3$ N", "C. $3 \\le F \\le 31$ (N)", "D. $0 \\le F \\le 31$ (N)"], "answer": "C", "explain": "Độ lớn hợp lực nằm trong khoảng $|F_1 - F_2| \\le F \\le F_1 + F_2$, tức $3 \\le F \\le 31$ (N). Dấu bằng xảy ra khi hai lực cùng phương: cùng chiều ($F = F_1 + F_2$) hoặc ngược chiều ($F = |F_1 - F_2|$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai lực đồng quy vuông góc với nhau cùng tác dụng lên một vật với $F_1 = 11$ N, $F_2 = 60$ N. Độ lớn hợp lực của chúng là:", "options": ["A. $71$ N", "B. $49$ N", "C. $52.41$ N", "D. $61$ N"], "answer": "D", "explain": "Hai lực vuông góc ($\\alpha = 90^\\circ$) nên $F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{11^2 + 60^2} = 61$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai lực $F_1 = 11$ N và $F_2 = 60$ N cùng phương, ngược chiều tác dụng lên một vật. Hợp lực của chúng có độ lớn:", "options": ["A. $49$ N", "B. $71$ N", "C. $61$ N", "D. $0$ N"], "answer": "A", "explain": "Cùng phương ngược chiều ($\\alpha = 180^\\circ$): $F = |F_1 - F_2| = |11 - 60| = 49$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai lực đồng quy có độ lớn bằng nhau $F_1 = F_2 = 20$ N, góc giữa chúng bằng $60^\\circ$. Độ lớn hợp lực là:", "options": ["A. $20$ N", "B. $20\\sqrt{3}$ N", "C. $40$ N", "D. $10$ N"], "answer": "B", "explain": "$F^2 = F_1^2 + F_2^2 + 2F_1F_2\\cos60^\\circ = 20^2 + 20^2 + 2 \\cdot 20 \\cdot 20 \\cdot \\frac{1}{2} = 3 \\cdot 20^2$, suy ra $F = 20\\sqrt{3}$ N.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một chất điểm đứng yên dưới tác dụng của ba lực đồng phẳng $\\vec{F_1}$, $\\vec{F_2}$, $\\vec{F_3}$. Biết $F_1 = 12$ N, $F_2 = 16$ N và góc giữa $\\vec{F_1}$, $\\vec{F_2}$ bằng $90^\\circ$. Độ lớn của $\\vec{F_3}$ là:", "options": ["A. $28$ N", "B. $4$ N", "C. $20$ N", "D. $10$ N"], "answer": "C", "explain": "Cân bằng: $\\vec{F_1} + \\vec{F_2} + \\vec{F_3} = \\vec{0}$ nên $\\vec{F_3} = -(\\vec{F_1} + \\vec{F_2})$, độ lớn $F_3 = \\sqrt{F_1^2 + F_2^2} = \\sqrt{12^2 + 16^2} = 20$ N.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét hai lực đồng quy $F_1 = 12$ N, $F_2 = 16$ N tác dụng lên một chất điểm. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Hai lực $F_1 = 12$ N và $F_2 = 16$ N cùng phương, cùng chiều có hợp lực $F = 28$ N.", "b) Độ lớn của hợp lực không bao giờ vượt quá tổng độ lớn của hai lực thành phần.", "c) Hợp lực của hai lực $\\vec{F_1}$, $\\vec{F_2}$ là vectơ đường chéo của hình bình hành có hai cạnh là $\\vec{F_1}$, $\\vec{F_2}$.", "d) Lực là đại lượng vectơ nên phép tổng hợp lực tuân theo quy tắc cộng vectơ."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: cùng phương cùng chiều thì $F = F_1 + F_2 = 28$ N. b) Đúng: $F \\le F_1 + F_2$ luôn thỏa mãn.. c) Đúng: đây chính là quy tắc hình bình hành. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai lực đồng quy $F_1 = 11$ N, $F_2 = 60$ N vuông góc với nhau. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Độ lớn hợp lực của hai lực là $F = 61$ N.", "b) Hợp lực có độ lớn $F = F_1 + F_2 = 71$ N.", "c) Nếu hai lực ngược chiều nhau thì hợp lực có độ lớn $|F_1 - F_2| = 49$ N.", "d) Góc $\\varphi$ giữa hợp lực và lực $\\vec{F_1}$ thỏa mãn $\\tan\\varphi = \\frac{F_2}{F_1} = \\frac{60}{11}$."], "answer": ["T", "F", "T", "T"], "explain": "$F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{11^2 + 60^2} = 61$ N nên a) đúng, b) sai. c) Đúng: ngược chiều thì $F = |F_1 - F_2| = 49$ N. d) Đúng theo định nghĩa tang của góc trong tam giác lực vuông.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật chịu tác dụng của hai lực vuông góc $F_1 = 28$ N và $F_2 = 45$ N. Tính độ lớn hợp lực của chúng (đơn vị: N).", "answer": "53", "explain": "$F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{28^2 + 45^2} = 53$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật có trọng lượng $P = 75$ N đặt trên mặt phẳng nghiêng góc $37^\\circ$ so với phương ngang ($\\sin37^\\circ \\approx 0{,}6$). Tính độ lớn thành phần của trọng lực dọc theo mặt phẳng nghiêng (đơn vị: N, làm tròn đến hàng đơn vị).", "answer": "45", "explain": "$P_1 = P\\sin37^\\circ \\approx 75 \\cdot 0{,}6 = 45$ N.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Hai lực đồng quy $\\vec{F_1}$, $\\vec{F_2}$ có độ lớn $F_1 = 7$ N, $F_2 = 24$ N. Muốn xác định hợp lực $\\vec{F}$ của chúng, ta dùng quy tắc nào?", "options": ["A. Quy tắc tam suất", "B. Quy tắc bàn tay trái", "C. Quy tắc hình bình hành", "D. Quy tắc nắm tay phải"], "answer": "C", "explain": "Lực là đại lượng vectơ; tổng hợp hai lực đồng quy tuân theo quy tắc hình bình hành: hợp lực $\\vec{F} = \\vec{F_1} + \\vec{F_2}$ là đường chéo của hình bình hành có hai cạnh là $\\vec{F_1}$, $\\vec{F_2}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai lực $F_1 = 9$ N và $F_2 = 25$ N đồng quy. Độ lớn $F$ của hợp lực thỏa mãn hệ thức nào?", "options": ["A. $F = 34$ N", "B. $F = 16$ N", "C. $0 \\le F \\le 34$ (N)", "D. $16 \\le F \\le 34$ (N)"], "answer": "D", "explain": "Độ lớn hợp lực nằm trong khoảng $|F_1 - F_2| \\le F \\le F_1 + F_2$, tức $16 \\le F \\le 34$ (N). Dấu bằng xảy ra khi hai lực cùng phương: cùng chiều ($F = F_1 + F_2$) hoặc ngược chiều ($F = |F_1 - F_2|$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai người cùng kéo một chiếc thuyền bằng hai dây vuông góc với nhau với $F_1 = 28$ N, $F_2 = 45$ N. Độ lớn hợp lực của chúng là:", "options": ["A. $53$ N", "B. $73$ N", "C. $17$ N", "D. $38.48$ N"], "answer": "A", "explain": "Hai lực vuông góc ($\\alpha = 90^\\circ$) nên $F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{28^2 + 45^2} = 53$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai lực $F_1 = 28$ N và $F_2 = 45$ N cùng phương, cùng chiều tác dụng lên một vật. Hợp lực của chúng có độ lớn:", "options": ["A. $17$ N", "B. $73$ N", "C. $53$ N", "D. $1260$ N"], "answer": "B", "explain": "Cùng phương cùng chiều ($\\alpha = 0^\\circ$): $F = F_1 + F_2 = 28 + 45 = 73$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai lực đồng quy có độ lớn bằng nhau $F_1 = F_2 = 5$ N, góc giữa chúng bằng $120^\\circ$. Độ lớn hợp lực là:", "options": ["A. $10$ N", "B. $8.66$ N", "C. $5$ N", "D. $0$ N"], "answer": "C", "explain": "$F^2 = F_1^2 + F_2^2 + 2F_1F_2\\cos120^\\circ = 5^2 + 5^2 + 2 \\cdot 5 \\cdot 5 \\cdot \\left(-\\frac{1}{2}\\right) = 5^2$, suy ra $F = 5$ N.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một lực $\\vec{F}$ có độ lớn $F = 125$ N hợp với phương ngang một góc $37^\\circ$ ($\\sin37^\\circ \\approx 0{,}6$; $\\cos37^\\circ \\approx 0{,}8$). Độ lớn thành phần của $\\vec{F}$ theo phương ngang là:", "options": ["A. $75$ N", "B. $125$ N", "C. $62.5$ N", "D. $100$ N"], "answer": "D", "explain": "Phân tích $\\vec{F}$ thành hai thành phần vuông góc: $F_x = F\\cos37^\\circ \\approx 125 \\cdot 0{,}8 = 100$ N; $F_y = F\\sin37^\\circ \\approx 75$ N.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét hai lực đồng quy $F_1 = 7$ N, $F_2 = 24$ N tác dụng lên một chất điểm. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Hai lực $F_1 = 7$ N và $F_2 = 24$ N cùng phương, cùng chiều có hợp lực $F = 31$ N.", "b) Hợp lực của hai lực đồng quy có độ lớn luôn bằng tổng độ lớn của hai lực thành phần.", "c) Muốn tổng hợp hai lực đồng quy, ta dùng quy tắc hình bình hành.", "d) Lực là đại lượng vectơ nên phép tổng hợp lực tuân theo quy tắc cộng vectơ."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: cùng phương cùng chiều thì $F = F_1 + F_2 = 31$ N. b) Sai: chỉ đúng khi hai lực cùng phương cùng chiều; nói chung $|F_1-F_2| \\le F \\le F_1+F_2$.. c) Đúng: đây chính là quy tắc hình bình hành. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai lực đồng quy $F_1 = 28$ N, $F_2 = 45$ N vuông góc với nhau. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Độ lớn hợp lực của hai lực là $F = 53$ N.", "b) Hợp lực có độ lớn $F = F_1 + F_2 = 73$ N.", "c) Nếu hai lực ngược chiều nhau thì hợp lực có độ lớn $|F_1 - F_2| = 17$ N.", "d) Góc $\\varphi$ giữa hợp lực và lực $\\vec{F_1}$ thỏa mãn $\\tan\\varphi = \\frac{F_2}{F_1} = \\frac{45}{28}$."], "answer": ["T", "F", "T", "T"], "explain": "$F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{28^2 + 45^2} = 53$ N nên a) đúng, b) sai. c) Đúng: ngược chiều thì $F = |F_1 - F_2| = 17$ N. d) Đúng theo định nghĩa tang của góc trong tam giác lực vuông.", "points": 1}, {"type": "short", "level": "VD", "q": "Hai lực đồng quy $F_1 = 33$ N, $F_2 = 56$ N vuông góc với nhau. Tính độ lớn hợp lực của chúng (đơn vị: N).", "answer": "65", "explain": "$F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{33^2 + 56^2} = 65$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật có trọng lượng $P = 140$ N đặt trên mặt phẳng nghiêng góc $30^\\circ$ so với phương ngang. Tính độ lớn thành phần của trọng lực dọc theo mặt phẳng nghiêng (đơn vị: N).", "answer": "70", "explain": "Phân tích trọng lực $\\vec{P}$ thành hai thành phần vuông góc: dọc mặt phẳng nghiêng $P_1 = P\\sin30^\\circ = 140 \\cdot \\frac{1}{2} = 70$ N; vuông góc mặt phẳng nghiêng $P_2 = P\\cos30^\\circ$.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Hai lực đồng quy $\\vec{F_1}$, $\\vec{F_2}$ có độ lớn $F_1 = 15$ N, $F_2 = 20$ N. Muốn xác định hợp lực $\\vec{F}$ của chúng, ta dùng quy tắc nào?", "options": ["A. Quy tắc tam suất", "B. Quy tắc bàn tay trái", "C. Quy tắc nắm tay phải", "D. Quy tắc hình bình hành"], "answer": "D", "explain": "Lực là đại lượng vectơ; tổng hợp hai lực đồng quy tuân theo quy tắc hình bình hành: hợp lực $\\vec{F} = \\vec{F_1} + \\vec{F_2}$ là đường chéo của hình bình hành có hai cạnh là $\\vec{F_1}$, $\\vec{F_2}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai lực $F_1 = 17$ N và $F_2 = 21$ N đồng quy. Độ lớn $F$ của hợp lực thỏa mãn hệ thức nào?", "options": ["A. $4 \\le F \\le 38$ (N)", "B. $F = 38$ N", "C. $F = 4$ N", "D. $0 \\le F \\le 38$ (N)"], "answer": "A", "explain": "Độ lớn hợp lực nằm trong khoảng $|F_1 - F_2| \\le F \\le F_1 + F_2$, tức $4 \\le F \\le 38$ (N). Dấu bằng xảy ra khi hai lực cùng phương: cùng chiều ($F = F_1 + F_2$) hoặc ngược chiều ($F = |F_1 - F_2|$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một chất điểm chịu tác dụng đồng thời của hai lực vuông góc nhau với $F_1 = 33$ N, $F_2 = 56$ N. Độ lớn hợp lực của chúng là:", "options": ["A. $89$ N", "B. $65$ N", "C. $23$ N", "D. $47.47$ N"], "answer": "B", "explain": "Hai lực vuông góc ($\\alpha = 90^\\circ$) nên $F = \\sqrt{F_1^2 + F_2^2} = \\sqrt{33^2 + 56^2} = 65$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai lực $F_1 = 33$ N và $F_2 = 56$ N cùng phương, ngược chiều tác dụng lên một vật. Hợp lực của chúng có độ lớn:", "options": ["A. $89$ N", "B. $65$ N", "C. $23$ N", "D. $0$ N"], "answer": "C", "explain": "Cùng phương ngược chiều ($\\alpha = 180^\\circ$): $F = |F_1 - F_2| = |33 - 56| = 23$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai lực đồng quy có độ lớn bằng nhau $F_1 = F_2 = 9$ N, góc giữa chúng bằng $60^\\circ$. Độ lớn hợp lực là:", "options": ["A. $9$ N", "B. $18$ N", "C. $4.5$ N", "D. $9\\sqrt{3}$ N"], "answer": "D", "explain": "$F^2 = F_1^2 + F_2^2 + 2F_1F_2\\cos60^\\circ = 9^2 + 9^2 + 2 \\cdot 9 \\cdot 9 \\cdot \\frac{1}{2} = 3 \\cdot 9^2$, suy ra $F = 9\\sqrt{3}$ N.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một chất điểm đứng yên dưới tác dụng của ba lực đồng phẳng $\\vec{F_1}$, $\\vec{F_2}$, $\\vec{F_3}$. Biết $F_1 = 15$ N, $F_2 = 20$ N và góc giữa $\\vec{F_1}$, $\\vec{F_2}$ bằng $90^\\circ$. Độ lớn của $\\vec{F_3}$ là:", "options": ["A. $25$ N", "B. $35$ N", "C. $5$ N", "D. $12.5$ N"], "answer": "A", "explain": "Cân bằng: $\\vec{F_1} + \\vec{F_2} + \\vec{F_3} = \\vec{0}$ nên $\\vec{F_3} = -(\\vec{F_1} + \\vec{F_2})$, độ lớn $F_3 = \\sqrt{F_1^2 + F_2^2} = \\sqrt{15^2 + 20^2} = 25$ N.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét hai lực đồng quy $F_1 = 15$ N, $F_2 = 20$ N tác dụng lên một chất điểm. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Hai lực $F_1 = 15$ N và $F_2 = 20$ N cùng phương, cùng chiều có hợp lực $F = 35$ N.", "b) Độ lớn của hợp lực không bao giờ vượt quá tổng độ lớn của hai lực thành phần.", "c) Hợp lực của hai lực $\\vec{F_1}$, $\\vec{F_2}$ là vectơ đường chéo của hình bình hành có hai cạnh là $\\vec{F_1}$, $\\vec{F_2}$.", "d) Lực là đại lượng vectơ nên phép tổng hợp lực tuân theo quy tắc cộng vectơ."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: cùng phương cùng chiều thì $F = F_1 + F_2 = 35$ N. b) Đúng: $F \\le F_1 + F_2$ luôn thỏa mãn.. c) Đúng: đây chính là quy tắc hình bình hành. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Hai lực đồng quy $F_1 = 33$ N, $F_2 = 56$ N vuông góc với nhau. Xét tính đúng sai
