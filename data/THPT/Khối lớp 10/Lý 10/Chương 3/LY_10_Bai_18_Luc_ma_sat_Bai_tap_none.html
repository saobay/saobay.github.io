 Tác dụng lên vật một lực kéo $F = 80$ N theo phương ngang (lấy $g = 10$ m/s$^2$). Gia tốc của vật là:", "options": ["A. $4$ m/s$^2$", "B. $1$ m/s$^2$", "C. $3$ m/s$^2$", "D. $2$ m/s$^2$"], "answer": "B", "explain": "Lực ma sát trượt $F_{mst} = \\mu_t mg = 0.3 \\cdot 20 \\cdot 10 = 60$ N. Định luật 2 Newton theo phương ngang: $F - F_{mst} = ma$, suy ra $a = \\frac{80 - 60}{20} = 1$ m/s$^2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật đặt trên mặt phẳng nghiêng. Hệ số ma sát nghỉ cực đại giữa vật và mặt phẳng là $\\mu_n = 0.5$. Góc nghiêng $\\alpha$ lớn nhất để vật còn đứng yên trên mặt phẳng thỏa mãn:", "options": ["A. $\\alpha_{max} \\approx 34.57^\\circ$", "B. $\\alpha_{max} \\approx 18.57^\\circ$", "C. $\\alpha_{max} \\approx 26.57^\\circ$", "D. $\\alpha_{max} = 90^\\circ$"], "answer": "C", "explain": "Vật đứng yên khi thành phần trọng lực kéo xuống không vượt quá ma sát nghỉ cực đại: $mg\\sin\\alpha \\le \\mu_n mg\\cos\\alpha$, suy ra $\\tan\\alpha \\le \\mu_n = 0.5$. Góc lớn nhất $\\alpha_{max} = \\arctan(0.5) \\approx 26.57^\\circ$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật trượt trên mặt sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật có trọng lượng $P = 200$ N trượt trên mặt sàn nằm ngang, hệ số ma sát trượt $\\mu_t = 0.3$. Lực ma sát trượt tác dụng lên vật là $F_{mst} = 60$ N.", "b) Lực ma sát trượt xuất hiện ở mặt tiếp xúc và ngược chiều với chuyển động tương đối của vật.", "c) Lực ma sát trượt phụ thuộc vào diện tích của mặt tiếp xúc.", "d) Lực ma sát nghỉ luôn có độ lớn bằng $\\mu_n N$."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $F_{mst} = \\mu_t N = \\mu_t P = 0.3 \\cdot 200 = 60$ N (mặt sàn nằm ngang nên $N = P$). b) Đúng. c) Sai: $F_{mst}$ không phụ thuộc diện tích tiếp xúc. d) Sai: chỉ có ma sát nghỉ CỰC ĐẠI mới bằng $\\mu_n N$; khi vật đứng yên, ma sát nghỉ cân bằng với lực tác dụng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một vật khối lượng $m = 20$ kg đặt trên sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật khối lượng $m = 20$ kg đặt yên trên sàn nằm ngang thì lực ma sát nghỉ tác dụng lên vật bằng 0.", "b) Tác dụng lực kéo $F = 30$ N theo phương ngang, vật vẫn đứng yên thì lực ma sát nghỉ $F_{msn} = 30$ N.", "c) Nếu tăng lực kéo lên $60$ N mà vật vẫn đứng yên thì lực ma sát nghỉ tăng lên $60$ N.", "d) Lực ma sát nghỉ có độ lớn luôn không đổi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: không có lực nào có xu hướng làm vật chuyển động nên không xuất hiện ma sát nghỉ. b) Đúng: vật cân bằng nên $F_{msn} = F = 30$ N. c) Đúng: ma sát nghỉ tự điều chỉnh theo lực tác dụng (cho đến giá trị cực đại). d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có khối lượng $m = 20$ kg trượt trên mặt sàn nằm ngang, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.25$. Tính độ lớn lực ma sát trượt tác dụng lên vật (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "50", "explain": "Trên mặt sàn nằm ngang, $N = P = mg = 20 \\cdot 10 = 200$ N. $F_{mst} = \\mu_t N = 0.25 \\cdot 200 = 50$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật trượt trên mặt sàn nằm ngang với vận tốc ban đầu $v_0 = 20$ m/s, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.5$. Tính quãng đường vật đi được cho đến khi dừng hẳn (đơn vị: m; lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí).", "answer": "40", "explain": "Vật chỉ chịu lực ma sát nên gia tốc hãm $a = \\frac{F_{mst}}{m} = \\mu_t g = 0.5 \\cdot 10 = 5$ m/s$^2$. Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{20^2}{2 \\cdot 5} = 40$ m.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Xét một vật đang trượt trên mặt phẳng nghiêng. Phát biểu nào sau đây đúng về lực ma sát tác dụng lên vật?", "options": ["A. Lực ma sát cùng chiều với chuyển động của vật", "B. Lực ma sát có phương vuông góc với mặt tiếp xúc", "C. Lực ma sát xuất hiện ở mặt tiếp xúc, ngược chiều với chuyển động (hoặc xu hướng chuyển động) của vật", "D. Lực ma sát chỉ xuất hiện khi vật chuyển động nhanh"], "answer": "C", "explain": "Lực ma sát xuất hiện tại mặt tiếp xúc giữa hai vật, có hướng ngược với hướng chuyển động tương đối (hoặc xu hướng chuyển động tương đối) của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một vật trượt trên mặt sàn nằm ngang với hệ số ma sát trượt $\\mu_t = 0.1$, áp lực của vật lên sàn là $N = 200$ N. Công thức tính lực ma sát trượt và độ lớn của nó là:", "options": ["A. $F_{mst} = \\frac{\\mu_t}{N} = 0$ N", "B. $F_{mst} = \\mu_t + N = 200.1$ N", "C. $F_{mst} = \\frac{N}{\\mu_t} = 2000$ N", "D. $F_{mst} = \\mu_t N = 20$ N"], "answer": "D", "explain": "Lực ma sát trượt: $F_{mst} = \\mu_t N = 0.1 \\cdot 200 = 20$ N. Lực ma sát trượt không phụ thuộc diện tích tiếp xúc và tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một khúc gỗ trượt trên mặt sàn với hệ số ma sát trượt $\\mu_t = 0.1$, áp lực $N = 200$ N. Lực ma sát trượt tác dụng lên vật là:", "options": ["A. $20$ N", "B. $40$ N", "C. $10$ N", "D. $180$ N"], "answer": "A", "explain": "$F_{mst} = \\mu_t N = 0.1 \\cdot 200 = 20$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật đặt trên sàn nằm ngang. Người ta tác dụng một lực kéo $F = 15$ N theo phương ngang nhưng vật vẫn đứng yên. Lực ma sát nghỉ tác dụng lên vật có độ lớn:", "options": ["A. $0$ N", "B. $15$ N", "C. Lớn hơn $15$ N", "D. Nhỏ hơn $15$ N"], "answer": "B", "explain": "Vật đứng yên nên hợp lực bằng 0: lực ma sát nghỉ cân bằng với lực kéo, do đó $F_{msn} = F = 15$ N (ma sát nghỉ tự điều chỉnh độ lớn cho đến giá trị cực đại $\\mu_n N$).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có khối lượng $m = 5$ kg đặt trên sàn nằm ngang, hệ số ma sát trượt $\\mu_t = 0.2$. Tác dụng lên vật một lực kéo $F = 30$ N theo phương ngang (lấy $g = 10$ m/s$^2$). Gia tốc của vật là:", "options": ["A. $6$ m/s$^2$", "B. $2$ m/s$^2$", "C. $4$ m/s$^2$", "D. $8$ m/s$^2$"], "answer": "C", "explain": "Lực ma sát trượt $F_{mst} = \\mu_t mg = 0.2 \\cdot 5 \\cdot 10 = 10$ N. Định luật 2 Newton theo phương ngang: $F - F_{mst} = ma$, suy ra $a = \\frac{30 - 10}{5} = 4$ m/s$^2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật trượt không vận tốc đầu từ đỉnh một mặt phẳng nghiêng góc $37^\\circ$ so với phương ngang ($\\sin37^\\circ \\approx 0{,}6$; $\\cos37^\\circ \\approx 0{,}8$). Hệ số ma sát trượt giữa vật và mặt phẳng là $\\mu_t = 0.5$. Gia tốc của vật khi trượt xuống là (lấy $g = 10$ m/s$^2$):", "options": ["A. $6$ m/s$^2$", "B. $4$ m/s$^2$", "C. $3$ m/s$^2$", "D. $2$ m/s$^2$"], "answer": "D", "explain": "Chiếu lên phương mặt phẳng nghiêng: $mg\\sin37^\\circ - F_{mst} = ma$, với $F_{mst} = \\mu_t mg\\cos37^\\circ$. Suy ra $a = g(\\sin37^\\circ - \\mu_t\\cos37^\\circ) = 10 \\cdot (0{,}6 - 0.5 \\cdot 0{,}8) = 2$ m/s$^2$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật trượt trên mặt sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật có trọng lượng $P = 150$ N trượt trên mặt sàn nằm ngang, hệ số ma sát trượt $\\mu_t = 0.1$. Lực ma sát trượt tác dụng lên vật là $F_{mst} = 15$ N.", "b) Lực ma sát trượt xuất hiện ở mặt tiếp xúc và ngược chiều với chuyển động tương đối của vật.", "c) Lực ma sát trượt phụ thuộc vào diện tích của mặt tiếp xúc.", "d) Lực ma sát nghỉ luôn có độ lớn bằng $\\mu_n N$."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $F_{mst} = \\mu_t N = \\mu_t P = 0.1 \\cdot 150 = 15$ N (mặt sàn nằm ngang nên $N = P$). b) Đúng. c) Sai: $F_{mst}$ không phụ thuộc diện tích tiếp xúc. d) Sai: chỉ có ma sát nghỉ CỰC ĐẠI mới bằng $\\mu_n N$; khi vật đứng yên, ma sát nghỉ cân bằng với lực tác dụng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một vật khối lượng $m = 5$ kg đặt trên sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật khối lượng $m = 5$ kg đặt yên trên sàn nằm ngang thì lực ma sát nghỉ tác dụng lên vật bằng 0.", "b) Tác dụng lực kéo $F = 15$ N theo phương ngang, vật vẫn đứng yên thì lực ma sát nghỉ $F_{msn} = 15$ N.", "c) Nếu tăng lực kéo lên $30$ N mà vật vẫn đứng yên thì lực ma sát nghỉ tăng lên $30$ N.", "d) Lực ma sát nghỉ có độ lớn luôn không đổi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: không có lực nào có xu hướng làm vật chuyển động nên không xuất hiện ma sát nghỉ. b) Đúng: vật cân bằng nên $F_{msn} = F = 15$ N. c) Đúng: ma sát nghỉ tự điều chỉnh theo lực tác dụng (cho đến giá trị cực đại). d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có khối lượng $m = 5$ kg trượt trên mặt sàn nằm ngang, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.4$. Tính độ lớn lực ma sát trượt tác dụng lên vật (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "20", "explain": "Trên mặt sàn nằm ngang, $N = P = mg = 5 \\cdot 10 = 50$ N. $F_{mst} = \\mu_t N = 0.4 \\cdot 50 = 20$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật trượt trên mặt sàn nằm ngang với vận tốc ban đầu $v_0 = 15$ m/s, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.25$. Tính quãng đường vật đi được cho đến khi dừng hẳn (đơn vị: m; lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí).", "answer": "45", "explain": "Vật chỉ chịu lực ma sát nên gia tốc hãm $a = \\frac{F_{mst}}{m} = \\mu_t g = 0.25 \\cdot 10 = 2.5$ m/s$^2$. Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{15^2}{2 \\cdot 2.5} = 45$ m.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Xét một chiếc tủ đang bị đẩy trượt trên sàn. Phát biểu nào sau đây đúng về lực ma sát tác dụng lên vật?", "options": ["A. Lực ma sát cùng chiều với chuyển động của vật", "B. Lực ma sát có phương vuông góc với mặt tiếp xúc", "C. Lực ma sát chỉ xuất hiện khi vật chuyển động nhanh", "D. Lực ma sát xuất hiện ở mặt tiếp xúc, ngược chiều với chuyển động (hoặc xu hướng chuyển động) của vật"], "answer": "D", "explain": "Lực ma sát xuất hiện tại mặt tiếp xúc giữa hai vật, có hướng ngược với hướng chuyển động tương đối (hoặc xu hướng chuyển động tương đối) của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một vật trượt trên mặt sàn nằm ngang với hệ số ma sát trượt $\\mu_t = 0.25$, áp lực của vật lên sàn là $N = 80$ N. Công thức tính lực ma sát trượt và độ lớn của nó là:", "options": ["A. $F_{mst} = \\mu_t N = 20$ N", "B. $F_{mst} = \\frac{\\mu_t}{N} = 0$ N", "C. $F_{mst} = \\mu_t + N = 80.25$ N", "D. $F_{mst} = \\frac{N}{\\mu_t} = 320$ N"], "answer": "A", "explain": "Lực ma sát trượt: $F_{mst} = \\mu_t N = 0.25 \\cdot 80 = 20$ N. Lực ma sát trượt không phụ thuộc diện tích tiếp xúc và tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một chiếc hộp trượt trên sàn nhà, hệ số ma sát trượt $\\mu_t = 0.25$, áp lực của hộp lên sàn $N = 80$ N. Lực ma sát trượt tác dụng lên vật là:", "options": ["A. $40$ N", "B. $20$ N", "C. $10$ N", "D. $60$ N"], "answer": "B", "explain": "$F_{mst} = \\mu_t N = 0.25 \\cdot 80 = 20$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật đặt trên sàn nằm ngang. Người ta tác dụng một lực kéo $F = 30$ N theo phương ngang nhưng vật vẫn đứng yên. Lực ma sát nghỉ tác dụng lên vật có độ lớn:", "options": ["A. $0$ N", "B. Lớn hơn $30$ N", "C. $30$ N", "D. Nhỏ hơn $30$ N"], "answer": "C", "explain": "Vật đứng yên nên hợp lực bằng 0: lực ma sát nghỉ cân bằng với lực kéo, do đó $F_{msn} = F = 30$ N (ma sát nghỉ tự điều chỉnh độ lớn cho đến giá trị cực đại $\\mu_n N$).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có khối lượng $m = 50$ kg đặt trên sàn nằm ngang, hệ số ma sát trượt $\\mu_t = 0.3$. Tác dụng lên vật một lực kéo $F = 200$ N theo phương ngang (lấy $g = 10$ m/s$^2$). Gia tốc của vật là:", "options": ["A. $4$ m/s$^2$", "B. $3$ m/s$^2$", "C. $2$ m/s$^2$", "D. $1$ m/s$^2$"], "answer": "D", "explain": "Lực ma sát trượt $F_{mst} = \\mu_t mg = 0.3 \\cdot 50 \\cdot 10 = 150$ N. Định luật 2 Newton theo phương ngang: $F - F_{mst} = ma$, suy ra $a = \\frac{200 - 150}{50} = 1$ m/s$^2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật đặt trên mặt phẳng nghiêng. Hệ số ma sát nghỉ cực đại giữa vật và mặt phẳng là $\\mu_n = 0.75$. Góc nghiêng $\\alpha$ lớn nhất để vật còn đứng yên trên mặt phẳng thỏa mãn:", "options": ["A. $\\alpha_{max} \\approx 36.87^\\circ$", "B. $\\alpha_{max} \\approx 44.87^\\circ$", "C. $\\alpha_{max} \\approx 28.87^\\circ$", "D. $\\alpha_{max} = 90^\\circ$"], "answer": "A", "explain": "Vật đứng yên khi thành phần trọng lực kéo xuống không vượt quá ma sát nghỉ cực đại: $mg\\sin\\alpha \\le \\mu_n mg\\cos\\alpha$, suy ra $\\tan\\alpha \\le \\mu_n = 0.75$. Góc lớn nhất $\\alpha_{max} = \\arctan(0.75) \\approx 36.87^\\circ$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật trượt trên mặt sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật có trọng lượng $P = 80$ N trượt trên mặt sàn nằm ngang, hệ số ma sát trượt $\\mu_t = 0.25$. Lực ma sát trượt tác dụng lên vật là $F_{mst} = 20$ N.", "b) Lực ma sát trượt xuất hiện ở mặt tiếp xúc và ngược chiều với chuyển động tương đối của vật.", "c) Lực ma sát trượt phụ thuộc vào diện tích của mặt tiếp xúc.", "d) Lực ma sát nghỉ luôn có độ lớn bằng $\\mu_n N$."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $F_{mst} = \\mu_t N = \\mu_t P = 0.25 \\cdot 80 = 20$ N (mặt sàn nằm ngang nên $N = P$). b) Đúng. c) Sai: $F_{mst}$ không phụ thuộc diện tích tiếp xúc. d) Sai: chỉ có ma sát nghỉ CỰC ĐẠI mới bằng $\\mu_n N$; khi vật đứng yên, ma sát nghỉ cân bằng với lực tác dụng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một vật khối lượng $m = 50$ kg đặt trên sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật khối lượng $m = 50$ kg đặt yên trên sàn nằm ngang thì lực ma sát nghỉ tác dụng lên vật bằng 0.", "b) Tác dụng lực kéo $F = 100$ N theo phương ngang, vật vẫn đứng yên thì lực ma sát nghỉ $F_{msn} = 100$ N.", "c) Nếu tăng lực kéo lên $200$ N mà vật vẫn đứng yên thì lực ma sát nghỉ tăng lên $200$ N.", "d) Lực ma sát nghỉ có độ lớn luôn không đổi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: không có lực nào có xu hướng làm vật chuyển động nên không xuất hiện ma sát nghỉ. b) Đúng: vật cân bằng nên $F_{msn} = F = 100$ N. c) Đúng: ma sát nghỉ tự điều chỉnh theo lực tác dụng (cho đến giá trị cực đại). d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có khối lượng $m = 50$ kg trượt trên mặt sàn nằm ngang, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.15$. Tính độ lớn lực ma sát trượt tác dụng lên vật (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "75", "explain": "Trên mặt sàn nằm ngang, $N = P = mg = 50 \\cdot 10 = 500$ N. $F_{mst} = \\mu_t N = 0.15 \\cdot 500 = 75$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật trượt trên mặt sàn nằm ngang với vận tốc ban đầu $v_0 = 30$ m/s, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.5$. Tính quãng đường vật đi được cho đến khi dừng hẳn (đơn vị: m; lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí).", "answer": "90", "explain": "Vật chỉ chịu lực ma sát nên gia tốc hãm $a = \\frac{F_{mst}}{m} = \\mu_t g = 0.5 \\cdot 10 = 5$ m/s$^2$. Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{30^2}{2 \\cdot 5} = 90$ m.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Xét bánh xe đang lăn trên mặt đường. Phát biểu nào sau đây đúng về lực ma sát tác dụng lên vật?", "options": ["A. Lực ma sát xuất hiện ở mặt tiếp xúc, ngược chiều với chuyển động (hoặc xu hướng chuyển động) của vật", "B. Lực ma sát cùng chiều với chuyển động của vật", "C. Lực ma sát có phương vuông góc với mặt tiếp xúc", "D. Lực ma sát chỉ xuất hiện khi vật chuyển động nhanh"], "answer": "A", "explain": "Lực ma sát xuất hiện tại mặt tiếp xúc giữa hai vật, có hướng ngược với hướng chuyển động tương đối (hoặc xu hướng chuyển động tương đối) của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một vật trượt trên mặt sàn nằm ngang với hệ số ma sát trượt $\\mu_t = 0.4$, áp lực của vật lên sàn là $N = 50$ N. Công thức tính lực ma sát trượt và độ lớn của nó là:", "options": ["A. $F_{mst} = \\frac{\\mu_t}{N} = 0.01$ N", "B. $F_{mst} = \\mu_t N = 20$ N", "C. $F_{mst} = \\mu_t + N = 50.4$ N", "D. $F_{mst} = \\frac{N}{\\mu_t} = 125$ N"], "answer": "B", "explain": "Lực ma sát trượt: $F_{mst} = \\mu_t N = 0.4 \\cdot 50 = 20$ N. Lực ma sát trượt không phụ thuộc diện tích tiếp xúc và tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một khúc gỗ trượt trên mặt sàn với hệ số ma sát trượt $\\mu_t = 0.4$, áp lực $N = 50$ N. Lực ma sát trượt tác dụng lên vật là:", "options": ["A. $40$ N", "B. $10$ N", "C. $20$ N", "D. $30$ N"], "answer": "C", "explain": "$F_{mst} = \\mu_t N = 0.4 \\cdot 50 = 20$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật đặt trên sàn nằm ngang. Người ta tác dụng một lực kéo $F = 25$ N theo phương ngang nhưng vật vẫn đứng yên. Lực ma sát nghỉ tác dụng lên vật có độ lớn:", "options": ["A. $0$ N", "B. Lớn hơn $25$ N", "C. Nhỏ hơn $25$ N", "D. $25$ N"], "answer": "D", "explain": "Vật đứng yên nên hợp lực bằng 0: lực ma sát nghỉ cân bằng với lực kéo, do đó $F_{msn} = F = 25$ N (ma sát nghỉ tự điều chỉnh độ lớn cho đến giá trị cực đại $\\mu_n N$).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có khối lượng $m = 100$ kg đặt trên sàn nằm ngang, hệ số ma sát trượt $\\mu_t = 0.4$. Tác dụng lên vật một lực kéo $F = 500$ N theo phương ngang (lấy $g = 10$ m/s$^2$). Gia tốc của vật là:", "options": ["A. $1$ m/s$^2$", "B. $5$ m/s$^2$", "C. $4$ m/s$^2$", "D. $2$ m/s$^2$"], "answer": "A", "explain": "Lực ma sát trượt $F_{mst} = \\mu_t mg = 0.4 \\cdot 100 \\cdot 10 = 400$ N. Định luật 2 Newton theo phương ngang: $F - F_{mst} = ma$, suy ra $a = \\frac{500 - 400}{100} = 1$ m/s$^2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật trượt không vận tốc đầu từ đỉnh một mặt phẳng nghiêng góc $37^\\circ$ so với phương ngang ($\\sin37^\\circ \\approx 0{,}6$; $\\cos37^\\circ \\approx 0{,}8$). Hệ số ma sát trượt giữa vật và mặt phẳng là $\\mu_t = 0.12$. Gia tốc của vật khi trượt xuống là (lấy $g = 10$ m/s$^2$):", "options": ["A. $6$ m/s$^2$", "B. $5$ m/s$^2$", "C. $1$ m/s$^2$", "D. $6$ m/s$^2$"], "answer": "B", "explain": "Chiếu lên phương mặt phẳng nghiêng: $mg\\sin37^\\circ - F_{mst} = ma$, với $F_{mst} = \\mu_t mg\\cos37^\\circ$. Suy ra $a = g(\\sin37^\\circ - \\mu_t\\cos37^\\circ) = 10 \\cdot (0{,}6 - 0.12 \\cdot 0{,}8) = 5$ m/s$^2$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật trượt trên mặt sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật có trọng lượng $P = 120$ N trượt trên mặt sàn nằm ngang, hệ số ma sát trượt $\\mu_t = 0.4$. Lực ma sát trượt tác dụng lên vật là $F_{mst} = 48$ N.", "b) Lực ma sát trượt xuất hiện ở mặt tiếp xúc và ngược chiều với chuyển động tương đối của vật.", "c) Lực ma sát trượt phụ thuộc vào diện tích của mặt tiếp xúc.", "d) Lực ma sát nghỉ luôn có độ lớn bằng $\\mu_n N$."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $F_{mst} = \\mu_t N = \\mu_t P = 0.4 \\cdot 120 = 48$ N (mặt sàn nằm ngang nên $N = P$). b) Đúng. c) Sai: $F_{mst}$ không phụ thuộc diện tích tiếp xúc. d) Sai: chỉ có ma sát nghỉ CỰC ĐẠI mới bằng $\\mu_n N$; khi vật đứng yên, ma sát nghỉ cân bằng với lực tác dụng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một vật khối lượng $m = 25$ kg đặt trên sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật khối lượng $m = 25$ kg đặt yên trên sàn nằm ngang thì lực ma sát nghỉ tác dụng lên vật bằng 0.", "b) Tác dụng lực kéo $F = 40$ N theo phương ngang, vật vẫn đứng yên thì lực ma sát nghỉ $F_{msn} = 40$ N.", "c) Nếu tăng lực kéo lên $80$ N mà vật vẫn đứng yên thì lực ma sát nghỉ tăng lên $80$ N.", "d) Lực ma sát nghỉ có độ lớn luôn không đổi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: không có lực nào có xu hướng làm vật chuyển động nên không xuất hiện ma sát nghỉ. b) Đúng: vật cân bằng nên $F_{msn} = F = 40$ N. c) Đúng: ma sát nghỉ tự điều chỉnh theo lực tác dụng (cho đến giá trị cực đại). d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có khối lượng $m = 15$ kg trượt trên mặt sàn nằm ngang, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.2$. Tính độ lớn lực ma sát trượt tác dụng lên vật (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "30", "explain": "Trên mặt sàn nằm ngang, $N = P = mg = 15 \\cdot 10 = 150$ N. $F_{mst} = \\mu_t N = 0.2 \\cdot 150 = 30$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật trượt trên mặt sàn nằm ngang với vận tốc ban đầu $v_0 = 12$ m/s, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.2$. Tính quãng đường vật đi được cho đến khi dừng hẳn (đơn vị: m; lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí).", "answer": "36", "explain": "Vật chỉ chịu lực ma sát nên gia tốc hãm $a = \\frac{F_{mst}}{m} = \\mu_t g = 0.2 \\cdot 10 = 2$ m/s$^2$. Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{12^2}{2 \\cdot 2} = 36$ m.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Xét một vật đang trượt trên mặt phẳng nghiêng. Phát biểu nào sau đây đúng về lực ma sát tác dụng lên vật?", "options": ["A. Lực ma sát cùng chiều với chuyển động của vật", "B. Lực ma sát xuất hiện ở mặt tiếp xúc, ngược chiều với chuyển động (hoặc xu hướng chuyển động) của vật", "C. Lực ma sát có phương vuông góc với mặt tiếp xúc", "D. Lực ma sát chỉ xuất hiện khi vật chuyển động nhanh"], "answer": "B", "explain": "Lực ma sát xuất hiện tại mặt tiếp xúc giữa hai vật, có hướng ngược với hướng chuyển động tương đối (hoặc xu hướng chuyển động tương đối) của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một vật trượt trên mặt sàn nằm ngang với hệ số ma sát trượt $\\mu_t = 0.15$, áp lực của vật lên sàn là $N = 300$ N. Công thức tính lực ma sát trượt và độ lớn của nó là:", "options": ["A. $F_{mst} = \\frac{\\mu_t}{N} = 0$ N", "B. $F_{mst} = \\mu_t + N = 300.15$ N", "C. $F_{mst} = \\mu_t N = 45$ N", "D. $F_{mst} = \\frac{N}{\\mu_t} = 2000$ N"], "answer": "C", "explain": "Lực ma sát trượt: $F_{mst} = \\mu_t N = 0.15 \\cdot 300 = 45$ N. Lực ma sát trượt không phụ thuộc diện tích tiếp xúc và tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một chiếc hộp trượt trên sàn nhà, hệ số ma sát trượt $\\mu_t = 0.15$, áp lực của hộp lên sàn $N = 300$ N. Lực ma sát trượt tác dụng lên vật là:", "options": ["A. $90$ N", "B. $22.5$ N", "C. $255$ N", "D. $45$ N"], "answer": "D", "explain": "$F_{mst} = \\mu_t N = 0.15 \\cdot 300 = 45$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật đặt trên sàn nằm ngang. Người ta tác dụng một lực kéo $F = 40$ N theo phương ngang nhưng vật vẫn đứng yên. Lực ma sát nghỉ tác dụng lên vật có độ lớn:", "options": ["A. $40$ N", "B. $0$ N", "C. Lớn hơn $40$ N", "D. Nhỏ hơn $40$ N"], "answer": "A", "explain": "Vật đứng yên nên hợp lực bằng 0: lực ma sát nghỉ cân bằng với lực kéo, do đó $F_{msn} = F = 40$ N (ma sát nghỉ tự điều chỉnh độ lớn cho đến giá trị cực đại $\\mu_n N$).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có khối lượng $m = 25$ kg đặt trên sàn nằm ngang, hệ số ma sát trượt $\\mu_t = 0.2$. Tác dụng lên vật một lực kéo $F = 100$ N theo phương ngang (lấy $g = 10$ m/s$^2$). Gia tốc của vật là:", "options": ["A. $4$ m/s$^2$", "B. $2$ m/s$^2$", "C. $2$ m/s$^2$", "D. $4$ m/s$^2$"], "answer": "B", "explain": "Lực ma sát trượt $F_{mst} = \\mu_t mg = 0.2 \\cdot 25 \\cdot 10 = 50$ N. Định luật 2 Newton theo phương ngang: $F - F_{mst} = ma$, suy ra $a = \\frac{100 - 50}{25} = 2$ m/s$^2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật đặt trên mặt phẳng nghiêng. Hệ số ma sát nghỉ cực đại giữa vật và mặt phẳng là $\\mu_n = 1$. Góc nghiêng $\\alpha$ lớn nhất để vật còn đứng yên trên mặt phẳng thỏa mãn:", "options": ["A. $\\alpha_{max} \\approx 53^\\circ$", "B. $\\alpha_{max} \\approx 37^\\circ$", "C. $\\alpha_{max} \\approx 45^\\circ$", "D. $\\alpha_{max} = 90^\\circ$"], "answer": "C", "explain": "Vật đứng yên khi thành phần trọng lực kéo xuống không vượt quá ma sát nghỉ cực đại: $mg\\sin\\alpha \\le \\mu_n mg\\cos\\alpha$, suy ra $\\tan\\alpha \\le \\mu_n = 1$. Góc lớn nhất $\\alpha_{max} = \\arctan(1) \\approx 45^\\circ$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật trượt trên mặt sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật có trọng lượng $P = 300$ N trượt trên mặt sàn nằm ngang, hệ số ma sát trượt $\\mu_t = 0.15$. Lực ma sát trượt tác dụng lên vật là $F_{mst} = 45$ N.", "b) Lực ma sát trượt xuất hiện ở mặt tiếp xúc và ngược chiều với chuyển động tương đối của vật.", "c) Lực ma sát trượt phụ thuộc vào diện tích của mặt tiếp xúc.", "d) Lực ma sát nghỉ luôn có độ lớn bằng $\\mu_n N$."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $F_{mst} = \\mu_t N = \\mu_t P = 0.15 \\cdot 300 = 45$ N (mặt sàn nằm ngang nên $N = P$). b) Đúng. c) Sai: $F_{mst}$ không phụ thuộc diện tích tiếp xúc. d) Sai: chỉ có ma sát nghỉ CỰC ĐẠI mới bằng $\\mu_n N$; khi vật đứng yên, ma sát nghỉ cân bằng với lực tác dụng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một vật khối lượng $m = 15$ kg đặt trên sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật khối lượng $m = 15$ kg đặt yên trên sàn nằm ngang thì lực ma sát nghỉ tác dụng lên vật bằng 0.", "b) Tác dụng lực kéo $F = 25$ N theo phương ngang, vật vẫn đứng yên thì lực ma sát nghỉ $F_{msn} = 25$ N.", "c) Nếu tăng lực kéo lên $50$ N mà vật vẫn đứng yên thì lực ma sát nghỉ tăng lên $50$ N.", "d) Lực ma sát nghỉ có độ lớn luôn không đổi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: không có lực nào có xu hướng làm vật chuyển động nên không xuất hiện ma sát nghỉ. b) Đúng: vật cân bằng nên $F_{msn} = F = 25$ N. c) Đúng: ma sát nghỉ tự điều chỉnh theo lực tác dụng (cho đến giá trị cực đại). d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có khối lượng $m = 30$ kg trượt trên mặt sàn nằm ngang, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.35$. Tính độ lớn lực ma sát trượt tác dụng lên vật (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "105", "explain": "Trên mặt sàn nằm ngang, $N = P = mg = 30 \\cdot 10 = 300$ N. $F_{mst} = \\mu_t N = 0.35 \\cdot 300 = 105$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật trượt trên mặt sàn nằm ngang với vận tốc ban đầu $v_0 = 25$ m/s, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.25$. Tính quãng đường vật đi được cho đến khi dừng hẳn (đơn vị: m; lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí).", "answer": "125", "explain": "Vật chỉ chịu lực ma sát nên gia tốc hãm $a = \\frac{F_{mst}}{m} = \\mu_t g = 0.25 \\cdot 10 = 2.5$ m/s$^2$. Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{25^2}{2 \\cdot 2.5} = 125$ m.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Xét một chiếc tủ đang bị đẩy trượt trên sàn. Phát biểu nào sau đây đúng về lực ma sát tác dụng lên vật?", "options": ["A. Lực ma sát cùng chiều với chuyển động của vật", "B. Lực ma sát có phương vuông góc với mặt tiếp xúc", "C. Lực ma sát xuất hiện ở mặt tiếp xúc, ngược chiều với chuyển động (hoặc xu hướng chuyển động) của vật", "D. Lực ma sát chỉ xuất hiện khi vật chuyển động nhanh"], "answer": "C", "explain": "Lực ma sát xuất hiện tại mặt tiếp xúc giữa hai vật, có hướng ngược với hướng chuyển động tương đối (hoặc xu hướng chuyển động tương đối) của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một vật trượt trên mặt sàn nằm ngang với hệ số ma sát trượt $\\mu_t = 0.5$, áp lực của vật lên sàn là $N = 40$ N. Công thức tính lực ma sát trượt và độ lớn của nó là:", "options": ["A. $F_{mst} = \\frac{\\mu_t}{N} = 0.01$ N", "B. $F_{mst} = \\mu_t + N = 40.5$ N", "C. $F_{mst} = \\frac{N}{\\mu_t} = 80$ N", "D. $F_{mst} = \\mu_t N = 20$ N"], "answer": "D", "explain": "Lực ma sát trượt: $F_{mst} = \\mu_t N = 0.5 \\cdot 40 = 20$ N. Lực ma sát trượt không phụ thuộc diện tích tiếp xúc và tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một khúc gỗ trượt trên mặt sàn với hệ số ma sát trượt $\\mu_t = 0.5$, áp lực $N = 40$ N. Lực ma sát trượt tác dụng lên vật là:", "options": ["A. $20$ N", "B. $40$ N", "C. $10$ N", "D. $20$ N"], "answer": "A", "explain": "$F_{mst} = \\mu_t N = 0.5 \\cdot 40 = 20$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật đặt trên sàn nằm ngang. Người ta tác dụng một lực kéo $F = 12$ N theo phương ngang nhưng vật vẫn đứng yên. Lực ma sát nghỉ tác dụng lên vật có độ lớn:", "options": ["A. $0$ N", "B. $12$ N", "C. Lớn hơn $12$ N", "D. Nhỏ hơn $12$ N"], "answer": "B", "explain": "Vật đứng yên nên hợp lực bằng 0: lực ma sát nghỉ cân bằng với lực kéo, do đó $F_{msn} = F = 12$ N (ma sát nghỉ tự điều chỉnh độ lớn cho đến giá trị cực đại $\\mu_n N$).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có khối lượng $m = 40$ kg đặt trên sàn nằm ngang, hệ số ma sát trượt $\\mu_t = 0.1$. Tác dụng lên vật một lực kéo $F = 120$ N theo phương ngang (lấy $g = 10$ m/s$^2$). Gia tốc của vật là:", "options": ["A. $3$ m/s$^2$", "B. $1$ m/s$^2$", "C. $2$ m/s$^2$", "D. $4$ m/s$^2$"], "answer": "C", "explain": "Lực ma sát trượt $F_{mst} = \\mu_t mg = 0.1 \\cdot 40 \\cdot 10 = 40$ N. Định luật 2 Newton theo phương ngang: $F - F_{mst} = ma$, suy ra $a = \\frac{120 - 40}{40} = 2$ m/s$^2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật trượt không vận tốc đầu từ đỉnh một mặt phẳng nghiêng góc $37^\\circ$ so với phương ngang ($\\sin37^\\circ \\approx 0{,}6$; $\\cos37^\\circ \\approx 0{,}8$). Hệ số ma sát trượt giữa vật và mặt phẳng là $\\mu_t = 0.38$. Gia tốc của vật khi trượt xuống là (lấy $g = 10$ m/s$^2$):", "options": ["A. $6$ m/s$^2$", "B. $3$ m/s$^2$", "C. $4$ m/s$^2$", "D. $3$ m/s$^2$"], "answer": "D", "explain": "Chiếu lên phương mặt phẳng nghiêng: $mg\\sin37^\\circ - F_{mst} = ma$, với $F_{mst} = \\mu_t mg\\cos37^\\circ$. Suy ra $a = g(\\sin37^\\circ - \\mu_t\\cos37^\\circ) = 10 \\cdot (0{,}6 - 0.38 \\cdot 0{,}8) = 3$ m/s$^2$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật trượt trên mặt sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật có trọng lượng $P = 50$ N trượt trên mặt sàn nằm ngang, hệ số ma sát trượt $\\mu_t = 0.5$. Lực ma sát trượt tác dụng lên vật là $F_{mst} = 25$ N.", "b) Lực ma sát trượt xuất hiện ở mặt tiếp xúc và ngược chiều với chuyển động tương đối của vật.", "c) Lực ma sát trượt phụ thuộc vào diện tích của mặt tiếp xúc.", "d) Lực ma sát nghỉ luôn có độ lớn bằng $\\mu_n N$."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $F_{mst} = \\mu_t N = \\mu_t P = 0.5 \\cdot 50 = 25$ N (mặt sàn nằm ngang nên $N = P$). b) Đúng. c) Sai: $F_{mst}$ không phụ thuộc diện tích tiếp xúc. d) Sai: chỉ có ma sát nghỉ CỰC ĐẠI mới bằng $\\mu_n N$; khi vật đứng yên, ma sát nghỉ cân bằng với lực tác dụng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một vật khối lượng $m = 30$ kg đặt trên sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật khối lượng $m = 30$ kg đặt yên trên sàn nằm ngang thì lực ma sát nghỉ tác dụng lên vật bằng 0.", "b) Tác dụng lực kéo $F = 60$ N theo phương ngang, vật vẫn đứng yên thì lực ma sát nghỉ $F_{msn} = 60$ N.", "c) Nếu tăng lực kéo lên $120$ N mà vật vẫn đứng yên thì lực ma sát nghỉ tăng lên $120$ N.", "d) Lực ma sát nghỉ có độ lớn luôn không đổi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: không có lực nào có xu hướng làm vật chuyển động nên không xuất hiện ma sát nghỉ. b) Đúng: vật cân bằng nên $F_{msn} = F = 60$ N. c) Đúng: ma sát nghỉ tự điều chỉnh theo lực tác dụng (cho đến giá trị cực đại). d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có khối lượng $m = 8$ kg trượt trên mặt sàn nằm ngang, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.25$. Tính độ lớn lực ma sát trượt tác dụng lên vật (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "20", "explain": "Trên mặt sàn nằm ngang, $N = P = mg = 8 \\cdot 10 = 80$ N. $F_{mst} = \\mu_t N = 0.25 \\cdot 80 = 20$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật trượt trên mặt sàn nằm ngang với vận tốc ban đầu $v_0 = 18$ m/s, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.3$. Tính quãng đường vật đi được cho đến khi dừng hẳn (đơn vị: m; lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí).", "answer": "54", "explain": "Vật chỉ chịu lực ma sát nên gia tốc hãm $a = \\frac{F_{mst}}{m} = \\mu_t g = 0.3 \\cdot 10 = 3$ m/s$^2$. Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{18^2}{2 \\cdot 3} = 54$ m.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Xét bánh xe đang lăn trên mặt đường. Phát biểu nào sau đây đúng về lực ma sát tác dụng lên vật?", "options": ["A. Lực ma sát cùng chiều với chuyển động của vật", "B. Lực ma sát có phương vuông góc với mặt tiếp xúc", "C. Lực ma sát chỉ xuất hiện khi vật chuyển động nhanh", "D. Lực ma sát xuất hiện ở mặt tiếp xúc, ngược chiều với chuyển động (hoặc xu hướng chuyển động) của vật"], "answer": "D", "explain": "Lực ma sát xuất hiện tại mặt tiếp xúc giữa hai vật, có hướng ngược với hướng chuyển động tương đối (hoặc xu hướng chuyển động tương đối) của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một vật trượt trên mặt sàn nằm ngang với hệ số ma sát trượt $\\mu_t = 0.2$, áp lực của vật lên sàn là $N = 150$ N. Công thức tính lực ma sát trượt và độ lớn của nó là:", "options": ["A. $F_{mst} = \\mu_t N = 30$ N", "B. $F_{mst} = \\frac{\\mu_t}{N} = 0$ N", "C. $F_{mst} = \\mu_t + N = 150.2$ N", "D. $F_{mst} = \\frac{N}{\\mu_t} = 750$ N"], "answer": "A", "explain": "Lực ma sát trượt: $F_{mst} = \\mu_t N = 0.2 \\cdot 150 = 30$ N. Lực ma sát trượt không phụ thuộc diện tích tiếp xúc và tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một chiếc hộp trượt trên sàn nhà, hệ số ma sát trượt $\\mu_t = 0.2$, áp lực của hộp lên sàn $N = 150$ N. Lực ma sát trượt tác dụng lên vật là:", "options": ["A. $60$ N", "B. $30$ N", "C. $15$ N", "D. $120$ N"], "answer": "B", "explain": "$F_{mst} = \\mu_t N = 0.2 \\cdot 150 = 30$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật đặt trên sàn nằm ngang. Người ta tác dụng một lực kéo $F = 18$ N theo phương ngang nhưng vật vẫn đứng yên. Lực ma sát nghỉ tác dụng lên vật có độ lớn:", "options": ["A. $0$ N", "B. Lớn hơn $18$ N", "C. $18$ N", "D. Nhỏ hơn $18$ N"], "answer": "C", "explain": "Vật đứng yên nên hợp lực bằng 0: lực ma sát nghỉ cân bằng với lực kéo, do đó $F_{msn} = F = 18$ N (ma sát nghỉ tự điều chỉnh độ lớn cho đến giá trị cực đại $\\mu_n N$).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có khối lượng $m = 15$ kg đặt trên sàn nằm ngang, hệ số ma sát trượt $\\mu_t = 0.2$. Tác dụng lên vật một lực kéo $F = 60$ N theo phương ngang (lấy $g = 10$ m/s$^2$). Gia tốc của vật là:", "options": ["A. $4$ m/s$^2$", "B. $2$ m/s$^2$", "C. $4$ m/s$^2$", "D. $2$ m/s$^2$"], "answer": "D", "explain": "Lực ma sát trượt $F_{mst} = \\mu_t mg = 0.2 \\cdot 15 \\cdot 10 = 30$ N. Định luật 2 Newton theo phương ngang: $F - F_{mst} = ma$, suy ra $a = \\frac{60 - 30}{15} = 2$ m/s$^2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật đặt trên mặt phẳng nghiêng. Hệ số ma sát nghỉ cực đại giữa vật và mặt phẳng là $\\mu_n = 0.25$. Góc nghiêng $\\alpha$ lớn nhất để vật còn đứng yên trên mặt phẳng thỏa mãn:", "options": ["A. $\\alpha_{max} \\approx 14.04^\\circ$", "B. $\\alpha_{max} \\approx 22.04^\\circ$", "C. $\\alpha_{max} \\approx 6.04^\\circ$", "D. $\\alpha_{max} = 90^\\circ$"], "answer": "A", "explain": "Vật đứng yên khi thành phần trọng lực kéo xuống không vượt quá ma sát nghỉ cực đại: $mg\\sin\\alpha \\le \\mu_n mg\\cos\\alpha$, suy ra $\\tan\\alpha \\le \\mu_n = 0.25$. Góc lớn nhất $\\alpha_{max} = \\arctan(0.25) \\approx 14.04^\\circ$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật trượt trên mặt sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật có trọng lượng $P = 250$ N trượt trên mặt sàn nằm ngang, hệ số ma sát trượt $\\mu_t = 0.2$. Lực ma sát trượt tác dụng lên vật là $F_{mst} = 50$ N.", "b) Lực ma sát trượt xuất hiện ở mặt tiếp xúc và ngược chiều với chuyển động tương đối của vật.", "c) Lực ma sát trượt phụ thuộc vào diện tích của mặt tiếp xúc.", "d) Lực ma sát nghỉ luôn có độ lớn bằng $\\mu_n N$."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $F_{mst} = \\mu_t N = \\mu_t P = 0.2 \\cdot 250 = 50$ N (mặt sàn nằm ngang nên $N = P$). b) Đúng. c) Sai: $F_{mst}$ không phụ thuộc diện tích tiếp xúc. d) Sai: chỉ có ma sát nghỉ CỰC ĐẠI mới bằng $\\mu_n N$; khi vật đứng yên, ma sát nghỉ cân bằng với lực tác dụng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một vật khối lượng $m = 40$ kg đặt trên sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật khối lượng $m = 40$ kg đặt yên trên sàn nằm ngang thì lực ma sát nghỉ tác dụng lên vật bằng 0.", "b) Tác dụng lực kéo $F = 80$ N theo phương ngang, vật vẫn đứng yên thì lực ma sát nghỉ $F_{msn} = 80$ N.", "c) Nếu tăng lực kéo lên $160$ N mà vật vẫn đứng yên thì lực ma sát nghỉ tăng lên $160$ N.", "d) Lực ma sát nghỉ có độ lớn luôn không đổi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: không có lực nào có xu hướng làm vật chuyển động nên không xuất hiện ma sát nghỉ. b) Đúng: vật cân bằng nên $F_{msn} = F = 80$ N. c) Đúng: ma sát nghỉ tự điều chỉnh theo lực tác dụng (cho đến giá trị cực đại). d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có khối lượng $m = 25$ kg trượt trên mặt sàn nằm ngang, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.4$. Tính độ lớn lực ma sát trượt tác dụng lên vật (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "100", "explain": "Trên mặt sàn nằm ngang, $N = P = mg = 25 \\cdot 10 = 250$ N. $F_{mst} = \\mu_t N = 0.4 \\cdot 250 = 100$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật trượt trên mặt sàn nằm ngang với vận tốc ban đầu $v_0 = 40$ m/s, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.4$. Tính quãng đường vật đi được cho đến khi dừng hẳn (đơn vị: m; lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí).", "answer": "200", "explain": "Vật chỉ chịu lực ma sát nên gia tốc hãm $a = \\frac{F_{mst}}{m} = \\mu_t g = 0.4 \\cdot 10 = 4$ m/s$^2$. Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{40^2}{2 \\cdot 4} = 200$ m.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Xét một vật đang trượt trên mặt phẳng nghiêng. Phát biểu nào sau đây đúng về lực ma sát tác dụng lên vật?", "options": ["A. Lực ma sát xuất hiện ở mặt tiếp xúc, ngược chiều với chuyển động (hoặc xu hướng chuyển động) của vật", "B. Lực ma sát cùng chiều với chuyển động của vật", "C. Lực ma sát có phương vuông góc với mặt tiếp xúc", "D. Lực ma sát chỉ xuất hiện khi vật chuyển động nhanh"], "answer": "A", "explain": "Lực ma sát xuất hiện tại mặt tiếp xúc giữa hai vật, có hướng ngược với hướng chuyển động tương đối (hoặc xu hướng chuyển động tương đối) của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một vật trượt trên mặt sàn nằm ngang với hệ số ma sát trượt $\\mu_t = 0.35$, áp lực của vật lên sàn là $N = 100$ N. Công thức tính lực ma sát trượt và độ lớn của nó là:", "options": ["A. $F_{mst} = \\frac{\\mu_t}{N} = 0$ N", "B. $F_{mst} = \\mu_t N = 35$ N", "C. $F_{mst} = \\mu_t + N = 100.35$ N", "D. $F_{mst} = \\frac{N}{\\mu_t} = 285.71$ N"], "answer": "B", "explain": "Lực ma sát trượt: $F_{mst} = \\mu_t N = 0.35 \\cdot 100 = 35$ N. Lực ma sát trượt không phụ thuộc diện tích tiếp xúc và tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một khúc gỗ trượt trên mặt sàn với hệ số ma sát trượt $\\mu_t = 0.35$, áp lực $N = 100$ N. Lực ma sát trượt tác dụng lên vật là:", "options": ["A. $70$ N", "B. $17.5$ N", "C. $35$ N", "D. $65$ N"], "answer": "C", "explain": "$F_{mst} = \\mu_t N = 0.35 \\cdot 100 = 35$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật đặt trên sàn nằm ngang. Người ta tác dụng một lực kéo $F = 35$ N theo phương ngang nhưng vật vẫn đứng yên. Lực ma sát nghỉ tác dụng lên vật có độ lớn:", "options": ["A. $0$ N", "B. Lớn hơn $35$ N", "C. Nhỏ hơn $35$ N", "D. $35$ N"], "answer": "D", "explain": "Vật đứng yên nên hợp lực bằng 0: lực ma sát nghỉ cân bằng với lực kéo, do đó $F_{msn} = F = 35$ N (ma sát nghỉ tự điều chỉnh độ lớn cho đến giá trị cực đại $\\mu_n N$).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có khối lượng $m = 30$ kg đặt trên sàn nằm ngang, hệ số ma sát trượt $\\mu_t = 0.3$. Tác dụng lên vật một lực kéo $F = 150$ N theo phương ngang (lấy $g = 10$ m/s$^2$). Gia tốc của vật là:", "options": ["A. $2$ m/s$^2$", "B. $5$ m/s$^2$", "C. $3$ m/s$^2$", "D. $4$ m/s$^2$"], "answer": "A", "explain": "Lực ma sát trượt $F_{mst} = \\mu_t mg = 0.3 \\cdot 30 \\cdot 10 = 90$ N. Định luật 2 Newton theo phương ngang: $F - F_{mst} = ma$, suy ra $a = \\frac{150 - 90}{30} = 2$ m/s$^2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật trượt không vận tốc đầu từ đỉnh một mặt phẳng nghiêng góc $37^\\circ$ so với phương ngang ($\\sin37^\\circ \\approx 0{,}6$; $\\cos37^\\circ \\approx 0{,}8$). Hệ số ma sát trượt giữa vật và mặt phẳng là $\\mu_t = 0.62$. Gia tốc của vật khi trượt xuống là (lấy $g = 10$ m/s$^2$):", "options": ["A. $6$ m/s$^2$", "B. $1$ m/s$^2$", "C. $5$ m/s$^2$", "D. $2$ m/s$^2$"], "answer": "B", "explain": "Chiếu lên phương mặt phẳng nghiêng: $mg\\sin37^\\circ - F_{mst} = ma$, với $F_{mst} = \\mu_t mg\\cos37^\\circ$. Suy ra $a = g(\\sin37^\\circ - \\mu_t\\cos37^\\circ) = 10 \\cdot (0{,}6 - 0.62 \\cdot 0{,}8) = 1$ m/s$^2$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật trượt trên mặt sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật có trọng lượng $P = 180$ N trượt trên mặt sàn nằm ngang, hệ số ma sát trượt $\\mu_t = 0.35$. Lực ma sát trượt tác dụng lên vật là $F_{mst} = 63$ N.", "b) Lực ma sát trượt xuất hiện ở mặt tiếp xúc và ngược chiều với chuyển động tương đối của vật.", "c) Lực ma sát trượt phụ thuộc vào diện tích của mặt tiếp xúc.", "d) Lực ma sát nghỉ luôn có độ lớn bằng $\\mu_n N$."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $F_{mst} = \\mu_t N = \\mu_t P = 0.35 \\cdot 180 = 63$ N (mặt sàn nằm ngang nên $N = P$). b) Đúng. c) Sai: $F_{mst}$ không phụ thuộc diện tích tiếp xúc. d) Sai: chỉ có ma sát nghỉ CỰC ĐẠI mới bằng $\\mu_n N$; khi vật đứng yên, ma sát nghỉ cân bằng với lực tác dụng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một vật khối lượng $m = 12$ kg đặt trên sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật khối lượng $m = 12$ kg đặt yên trên sàn nằm ngang thì lực ma sát nghỉ tác dụng lên vật bằng 0.", "b) Tác dụng lực kéo $F = 24$ N theo phương ngang, vật vẫn đứng yên thì lực ma sát nghỉ $F_{msn} = 24$ N.", "c) Nếu tăng lực kéo lên $48$ N mà vật vẫn đứng yên thì lực ma sát nghỉ tăng lên $48$ N.", "d) Lực ma sát nghỉ có độ lớn luôn không đổi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: không có lực nào có xu hướng làm vật chuyển động nên không xuất hiện ma sát nghỉ. b) Đúng: vật cân bằng nên $F_{msn} = F = 24$ N. c) Đúng: ma sát nghỉ tự điều chỉnh theo lực tác dụng (cho đến giá trị cực đại). d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có khối lượng $m = 40$ kg trượt trên mặt sàn nằm ngang, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.1$. Tính độ lớn lực ma sát trượt tác dụng lên vật (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "40", "explain": "Trên mặt sàn nằm ngang, $N = P = mg = 40 \\cdot 10 = 400$ N. $F_{mst} = \\mu_t N = 0.1 \\cdot 400 = 40$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật trượt trên mặt sàn nằm ngang với vận tốc ban đầu $v_0 = 14$ m/s, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.35$. Tính quãng đường vật đi được cho đến khi dừng hẳn (đơn vị: m; lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí).", "answer": "28", "explain": "Vật chỉ chịu lực ma sát nên gia tốc hãm $a = \\frac{F_{mst}}{m} = \\mu_t g = 0.35 \\cdot 10 = 3.5$ m/s$^2$. Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{14^2}{2 \\cdot 3.5} = 28$ m.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Xét một chiếc tủ đang bị đẩy trượt trên sàn. Phát biểu nào sau đây đúng về lực ma sát tác dụng lên vật?", "options": ["A. Lực ma sát cùng chiều với chuyển động của vật", "B. Lực ma sát xuất hiện ở mặt tiếp xúc, ngược chiều với chuyển động (hoặc xu hướng chuyển động) của vật", "C. Lực ma sát có phương vuông góc với mặt tiếp xúc", "D. Lực ma sát chỉ xuất hiện khi vật chuyển động nhanh"], "answer": "B", "explain": "Lực ma sát xuất hiện tại mặt tiếp xúc giữa hai vật, có hướng ngược với hướng chuyển động tương đối (hoặc xu hướng chuyển động tương đối) của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một vật trượt trên mặt sàn nằm ngang với hệ số ma sát trượt $\\mu_t = 0.12$, áp lực của vật lên sàn là $N = 250$ N. Công thức tính lực ma sát trượt và độ lớn của nó là:", "options": ["A. $F_{mst} = \\frac{\\mu_t}{N} = 0$ N", "B. $F_{mst} = \\mu_t + N = 250.12$ N", "C. $F_{mst} = \\mu_t N = 30$ N", "D. $F_{mst} = \\frac{N}{\\mu_t} = 2083.33$ N"], "answer": "C", "explain": "Lực ma sát trượt: $F_{mst} = \\mu_t N = 0.12 \\cdot 250 = 30$ N. Lực ma sát trượt không phụ thuộc diện tích tiếp xúc và tốc độ của vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một chiếc hộp trượt trên sàn nhà, hệ số ma sát trượt $\\mu_t = 0.12$, áp lực của hộp lên sàn $N = 250$ N. Lực ma sát trượt tác dụng lên vật là:", "options": ["A. $60$ N", "B. $15$ N", "C. $220$ N", "D. $30$ N"], "answer": "D", "explain": "$F_{mst} = \\mu_t N = 0.12 \\cdot 250 = 30$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật đặt trên sàn nằm ngang. Người ta tác dụng một lực kéo $F = 50$ N theo phương ngang nhưng vật vẫn đứng yên. Lực ma sát nghỉ tác dụng lên vật có độ lớn:", "options": ["A. $50$ N", "B. $0$ N", "C. Lớn hơn $50$ N", "D. Nhỏ hơn $50$ N"], "answer": "A", "explain": "Vật đứng yên nên hợp lực bằng 0: lực ma sát nghỉ cân bằng với lực kéo, do đó $F_{msn} = F = 50$ N (ma sát nghỉ tự điều chỉnh độ lớn cho đến giá trị cực đại $\\mu_n N$).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có khối lượng $m = 80$ kg đặt trên sàn nằm ngang, hệ số ma sát trượt $\\mu_t = 0.4$. Tác dụng lên vật một lực kéo $F = 400$ N theo phương ngang (lấy $g = 10$ m/s$^2$). Gia tốc của vật là:", "options": ["A. $5$ m/s$^2$", "B. $1$ m/s$^2$", "C. $4$ m/s$^2$", "D. $2$ m/s$^2$"], "answer": "B", "explain": "Lực ma sát trượt $F_{mst} = \\mu_t mg = 0.4 \\cdot 80 \\cdot 10 = 320$ N. Định luật 2 Newton theo phương ngang: $F - F_{mst} = ma$, suy ra $a = \\frac{400 - 320}{80} = 1$ m/s$^2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật đặt trên mặt phẳng nghiêng. Hệ số ma sát nghỉ cực đại giữa vật và mặt phẳng là $\\mu_n = 1.5$. Góc nghiêng $\\alpha$ lớn nhất để vật còn đứng yên trên mặt phẳng thỏa mãn:", "options": ["A. $\\alpha_{max} \\approx 64.31^\\circ$", "B. $\\alpha_{max} \\approx 48.31^\\circ$", "C. $\\alpha_{max} \\approx 56.31^\\circ$", "D. $\\alpha_{max} = 90^\\circ$"], "answer": "C", "explain": "Vật đứng yên khi thành phần trọng lực kéo xuống không vượt quá ma sát nghỉ cực đại: $mg\\sin\\alpha \\le \\mu_n mg\\cos\\alpha$, suy ra $\\tan\\alpha \\le \\mu_n = 1.5$. Góc lớn nhất $\\alpha_{max} = \\arctan(1.5) \\approx 56.31^\\circ$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét một vật trượt trên mặt sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật có trọng lượng $P = 90$ N trượt trên mặt sàn nằm ngang, hệ số ma sát trượt $\\mu_t = 0.1$. Lực ma sát trượt tác dụng lên vật là $F_{mst} = 9$ N.", "b) Lực ma sát trượt xuất hiện ở mặt tiếp xúc và ngược chiều với chuyển động tương đối của vật.", "c) Lực ma sát trượt phụ thuộc vào diện tích của mặt tiếp xúc.", "d) Lực ma sát nghỉ luôn có độ lớn bằng $\\mu_n N$."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $F_{mst} = \\mu_t N = \\mu_t P = 0.1 \\cdot 90 = 9$ N (mặt sàn nằm ngang nên $N = P$). b) Đúng. c) Sai: $F_{mst}$ không phụ thuộc diện tích tiếp xúc. d) Sai: chỉ có ma sát nghỉ CỰC ĐẠI mới bằng $\\mu_n N$; khi vật đứng yên, ma sát nghỉ cân bằng với lực tác dụng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một vật khối lượng $m = 60$ kg đặt trên sàn nằm ngang. Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một vật khối lượng $m = 60$ kg đặt yên trên sàn nằm ngang thì lực ma sát nghỉ tác dụng lên vật bằng 0.", "b) Tác dụng lực kéo $F = 120$ N theo phương ngang, vật vẫn đứng yên thì lực ma sát nghỉ $F_{msn} = 120$ N.", "c) Nếu tăng lực kéo lên $240$ N mà vật vẫn đứng yên thì lực ma sát nghỉ tăng lên $240$ N.", "d) Lực ma sát nghỉ có độ lớn luôn không đổi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: không có lực nào có xu hướng làm vật chuyển động nên không xuất hiện ma sát nghỉ. b) Đúng: vật cân bằng nên $F_{msn} = F = 120$ N. c) Đúng: ma sát nghỉ tự điều chỉnh theo lực tác dụng (cho đến giá trị cực đại). d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có khối lượng $m = 12$ kg trượt trên mặt sàn nằm ngang, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.5$. Tính độ lớn lực ma sát trượt tác dụng lên vật (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "60", "explain": "Trên mặt sàn nằm ngang, $N = P = mg = 12 \\cdot 10 = 120$ N. $F_{mst} = \\mu_t N = 0.5 \\cdot 120 = 60$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật trượt trên mặt sàn nằm ngang với vận tốc ban đầu $v_0 = 22$ m/s, hệ số ma sát trượt giữa vật và sàn là $\\mu_t = 0.55$. Tính quãng đường vật đi được cho đến khi dừng hẳn (đơn vị: m; lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí).", "answer": "44", "explain": "Vật chỉ chịu lực ma sát nên gia tốc hãm $a = \\frac{F_{mst}}{m} = \\mu_t g = 0.55 \\cdot 10 = 5.5$ m/s$^2$. Từ $v^2 - v_0^2 = 2as$ với $v = 0$: $s = \\frac{v_0^2}{2a} = \\frac{22^2}{2 \\cdot 5.5} = 44$ m.", "points": 0.5}]}]}
