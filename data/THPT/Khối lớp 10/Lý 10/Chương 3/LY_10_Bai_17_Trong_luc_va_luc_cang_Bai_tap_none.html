\vec{P} = \\vec{0}$ nên $T = P = mg = 15.5 \\cdot 10 = 155$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật khối lượng $m = 5$ kg được treo bằng dây vào trần xe đang chuyển động nhanh dần đều với gia tốc $a = 7{,}5$ m/s$^2$ theo phương ngang. Tính lực căng của dây khi vật cân bằng tương đối với xe (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "62.5", "explain": "$T = m\\sqrt{g^2 + a^2} = 5 \\cdot \\sqrt{10^2 + 7{,}5^2} = 5 \\cdot 12{,}5 = 62.5$ N.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật có khối lượng $m = 8$ kg đặt trên mặt đất. Phát biểu nào sau đây đúng về trọng lực tác dụng lên vật?", "options": ["A. Trọng lực đặt tại trọng tâm của vật, hướng thẳng đứng xuống dưới, độ lớn $P = 80$ N", "B. Trọng lực đặt tại mặt đất, hướng thẳng đứng lên trên", "C. Trọng lực có độ lớn không phụ thuộc khối lượng của vật", "D. Trọng lực đặt tại trọng tâm, hướng theo phương chuyển động của vật"], "answer": "A", "explain": "Trọng lực $\\vec{P}$ là lực hút của Trái Đất tác dụng lên vật: đặt tại trọng tâm, phương thẳng đứng, chiều hướng xuống (về phía tâm Trái Đất), độ lớn $P = mg = 8 \\cdot 10 = 80$ N.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét sợi dây kéo một chiếc xe đang căng. Phát biểu nào sau đây đúng về lực căng của dây?", "options": ["A. Lực căng có phương vuông góc với sợi dây", "B. Lực căng có phương trùng với sợi dây, chiều chống lại sự kéo dãn của dây", "C. Lực căng luôn hướng thẳng đứng xuống dưới", "D. Lực căng chỉ xuất hiện khi dây bị chùng"], "answer": "B", "explain": "Lực căng $\\vec{T}$ xuất hiện khi dây bị kéo căng: có điểm đặt tại vật, phương trùng với sợi dây, chiều hướng ra khỏi vật (chống lại sự kéo dãn).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một chiếc xe máy có khối lượng 8 kg (lấy $g = 10$ m/s$^2$). Trọng lượng của vật là:", "options": ["A. $8$ N", "B. $40$ N", "C. $80$ N", "D. $0.8$ N"], "answer": "C", "explain": "Trọng lượng $P = mg = 8 \\cdot 10 = 80$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một chiếc đèn chùm khối lượng 30 kg được treo cân bằng bằng một sợi dây thẳng đứng (lấy $g = 10$ m/s$^2$). Lực căng của dây là:", "options": ["A. $30$ N", "B. $600$ N", "C. $0$ N", "D. $300$ N"], "answer": "D", "explain": "Vật cân bằng nên $\\vec{T} + \\vec{P} = \\vec{0}$, suy ra $T = P = mg = 30 \\cdot 10 = 300$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người có khối lượng $m = 80$ kg đứng trong thang máy đang đi lên nhanh dần đều với gia tốc $a = 2.5$ m/s$^2$. Lực mà sàn thang máy tác dụng lên người có độ lớn (lấy $g = 10$ m/s$^2$):", "options": ["A. $1000$ N", "B. $600$ N", "C. $800$ N", "D. $200$ N"], "answer": "A", "explain": "Chọn chiều dương hướng lên: $N - P = ma$, suy ra $N = m(g + a) = 80 \\cdot (10 + 2.5) = 1000$ N. Người cảm thấy nặng hơn bình thường.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật khối lượng $m = 12$ kg được treo bằng một sợi dây vào trần một chiếc xe đang chuyển động nhanh dần đều với gia tốc $a = 7{,}5$ m/s$^2$ theo phương ngang. Lực căng của dây khi vật cân bằng tương đối với xe là (lấy $g = 10$ m/s$^2$):", "options": ["A. $120$ N", "B. $150$ N", "C. $90$ N", "D. $210$ N"], "answer": "B", "explain": "Trong hệ quy chiếu gắn với xe, vật chịu thêm lực quán tính $F_q = ma$ nằm ngang. Dây lệch khỏi phương thẳng đứng góc $\\alpha$ với $\\tan\\alpha = \\frac{a}{g} = 0{,}75$. Lực căng $T = m\\sqrt{g^2 + a^2} = 12 \\cdot \\sqrt{10^2 + 7{,}5^2} = 12 \\cdot 12{,}5 = 150$ N.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét các phát biểu về trọng lực và lực căng (vật khối lượng $m = 8$ kg):", "statements": ["a) Trọng lượng của vật có khối lượng $m = 8$ kg là $P = 80$ N (lấy $g = 10$ m/s$^2$).", "b) Trọng lực đặt tại trọng tâm của vật và luôn hướng về phía tâm Trái Đất.", "c) Lực căng của dây có phương vuông góc với sợi dây.", "d) Khi vật treo cân bằng bằng một dây thẳng đứng thì lực căng của dây bằng trọng lượng của vật."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $P = mg = 80$ N. b) Đúng. c) Sai: lực căng có phương TRÙNG với sợi dây. d) Đúng: $\\vec{T} + \\vec{P} = \\vec{0}$ nên $T = P$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một người khối lượng $m = 40$ kg đứng trong thang máy (lấy $g = 10$ m/s$^2$). Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một người khối lượng $m = 40$ kg đứng trong thang máy đi lên nhanh dần đều với gia tốc $a = 3$ m/s$^2$. Lực mà sàn thang máy tác dụng lên người là $N = 520$ N.", "b) Khi thang máy chuyển động thẳng đều thì lực sàn tác dụng lên người bằng trọng lượng của người.", "c) Khi thang máy đi xuống nhanh dần đều với gia tốc $a$ thì $N = m(g + a)$.", "d) Khi thang máy đi lên nhanh dần, người trong thang máy cảm thấy nặng hơn bình thường."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $N = m(g + a) = 40 \\cdot (10 + 3) = 520$ N. b) Đúng: $a = 0$ nên $N = P$. c) Sai: đi xuống nhanh dần thì $N = m(g - a)$. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có khối lượng $m = 30.5$ kg được treo cân bằng bằng một sợi dây thẳng đứng. Tính lực căng của dây (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "305", "explain": "Vật cân bằng: $\\vec{T} + \\vec{P} = \\vec{0}$ nên $T = P = mg = 30.5 \\cdot 10 = 305$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật nặng có trọng lượng $P = 350$ N được treo cân bằng bằng hai dây giống nhau, mỗi dây hợp với phương thẳng đứng một góc $60^\\circ$. Tính lực căng của mỗi dây (đơn vị: N).", "answer": "350", "explain": "Chiếu lên phương thẳng đứng: $2T\\cos60^\\circ = P$. Vì $\\cos60^\\circ = \\frac{1}{2}$ nên $T = P = 350$ N.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật có khối lượng $m = 20$ kg đặt trên mặt đất. Phát biểu nào sau đây đúng về trọng lực tác dụng lên vật?", "options": ["A. Trọng lực đặt tại mặt đất, hướng thẳng đứng lên trên", "B. Trọng lực đặt tại trọng tâm của vật, hướng thẳng đứng xuống dưới, độ lớn $P = 200$ N", "C. Trọng lực có độ lớn không phụ thuộc khối lượng của vật", "D. Trọng lực đặt tại trọng tâm, hướng theo phương chuyển động của vật"], "answer": "B", "explain": "Trọng lực $\\vec{P}$ là lực hút của Trái Đất tác dụng lên vật: đặt tại trọng tâm, phương thẳng đứng, chiều hướng xuống (về phía tâm Trái Đất), độ lớn $P = mg = 20 \\cdot 10 = 200$ N.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét sợi dây buộc một con diều đang căng. Phát biểu nào sau đây đúng về lực căng của dây?", "options": ["A. Lực căng có phương vuông góc với sợi dây", "B. Lực căng luôn hướng thẳng đứng xuống dưới", "C. Lực căng có phương trùng với sợi dây, chiều chống lại sự kéo dãn của dây", "D. Lực căng chỉ xuất hiện khi dây bị chùng"], "answer": "C", "explain": "Lực căng $\\vec{T}$ xuất hiện khi dây bị kéo căng: có điểm đặt tại vật, phương trùng với sợi dây, chiều hướng ra khỏi vật (chống lại sự kéo dãn).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vận động viên có khối lượng 20 kg (lấy $g = 10$ m/s$^2$). Trọng lượng của vật là:", "options": ["A. $20$ N", "B. $100$ N", "C. $2$ N", "D. $200$ N"], "answer": "D", "explain": "Trọng lượng $P = mg = 20 \\cdot 10 = 200$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một biển quảng cáo khối lượng 2.5 kg được treo cân bằng bằng một sợi dây thẳng đứng (lấy $g = 10$ m/s$^2$). Lực căng của dây là:", "options": ["A. $25$ N", "B. $2.5$ N", "C. $50$ N", "D. $0$ N"], "answer": "A", "explain": "Vật cân bằng nên $\\vec{T} + \\vec{P} = \\vec{0}$, suy ra $T = P = mg = 2.5 \\cdot 10 = 25$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật nặng có trọng lượng $P = 80$ N được treo cân bằng bằng hai dây giống nhau, mỗi dây hợp với phương thẳng đứng một góc $60^\\circ$. Lực căng của mỗi dây là:", "options": ["A. $40$ N", "B. $80$ N", "C. $160$ N", "D. $69.28$ N"], "answer": "B", "explain": "Chiếu lên phương thẳng đứng: $2T\\cos60^\\circ = P$, mà $\\cos60^\\circ = \\frac{1}{2}$ nên $2T \\cdot \\frac{1}{2} = T = P = 80$ N.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người có khối lượng $m = 80$ kg đứng trong thang máy đang đi xuống nhanh dần đều với gia tốc $a = 5$ m/s$^2$. Lực mà sàn thang máy tác dụng lên người có độ lớn (lấy $g = 10$ m/s$^2$):", "options": ["A. $1200$ N", "B. $800$ N", "C. $400$ N", "D. $400$ N"], "answer": "C", "explain": "Chọn chiều dương hướng xuống: $P - N = ma$, suy ra $N = m(g - a) = 80 \\cdot (10 - 5) = 400$ N. Người cảm thấy nhẹ hơn bình thường.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét các phát biểu về trọng lực và lực căng (vật khối lượng $m = 20$ kg):", "statements": ["a) Trọng lượng của vật có khối lượng $m = 20$ kg là $P = 200$ N (lấy $g = 10$ m/s$^2$).", "b) Trọng lượng của một vật thay đổi theo vị trí địa lí vì $g$ thay đổi theo vĩ độ và độ cao.", "c) Lực căng của dây chỉ có thể kéo vật chứ không thể đẩy vật.", "d) Một vật treo bằng dây đứng yên thì dây không có lực căng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $P = mg = 200$ N. b) Đúng. c) Đúng: dây mềm chỉ kéo được chứ không đẩy được. d) Sai: dây treo vật đứng yên vẫn chịu lực căng $T = P$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một người khối lượng $m = 70$ kg đứng trong thang máy (lấy $g = 10$ m/s$^2$). Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một người khối lượng $m = 70$ kg đứng trong thang máy đi lên nhanh dần đều với gia tốc $a = 2$ m/s$^2$. Lực mà sàn thang máy tác dụng lên người là $N = 840$ N.", "b) Khi thang máy chuyển động thẳng đều thì lực sàn tác dụng lên người bằng trọng lượng của người.", "c) Khi thang máy đi xuống nhanh dần đều với gia tốc $a$ thì $N = m(g + a)$.", "d) Khi thang máy đi lên nhanh dần, người trong thang máy cảm thấy nặng hơn bình thường."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $N = m(g + a) = 70 \\cdot (10 + 2) = 840$ N. b) Đúng: $a = 0$ nên $N = P$. c) Sai: đi xuống nhanh dần thì $N = m(g - a)$. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có khối lượng $m = 2.5$ kg được treo cân bằng bằng một sợi dây thẳng đứng. Tính lực căng của dây (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "25", "explain": "Vật cân bằng: $\\vec{T} + \\vec{P} = \\vec{0}$ nên $T = P = mg = 2.5 \\cdot 10 = 25$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật khối lượng $m = 7$ kg được treo bằng dây vào trần xe đang chuyển động nhanh dần đều với gia tốc $a = 7{,}5$ m/s$^2$ theo phương ngang. Tính lực căng của dây khi vật cân bằng tương đối với xe (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "87.5", "explain": "$T = m\\sqrt{g^2 + a^2} = 7 \\cdot \\sqrt{10^2 + 7{,}5^2} = 7 \\cdot 12{,}5 = 87.5$ N.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật có khối lượng $m = 50$ kg đặt trên mặt đất. Phát biểu nào sau đây đúng về trọng lực tác dụng lên vật?", "options": ["A. Trọng lực đặt tại mặt đất, hướng thẳng đứng lên trên", "B. Trọng lực có độ lớn không phụ thuộc khối lượng của vật", "C. Trọng lực đặt tại trọng tâm của vật, hướng thẳng đứng xuống dưới, độ lớn $P = 500$ N", "D. Trọng lực đặt tại trọng tâm, hướng theo phương chuyển động của vật"], "answer": "C", "explain": "Trọng lực $\\vec{P}$ là lực hút của Trái Đất tác dụng lên vật: đặt tại trọng tâm, phương thẳng đứng, chiều hướng xuống (về phía tâm Trái Đất), độ lớn $P = mg = 50 \\cdot 10 = 500$ N.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét sợi dây treo một chiếc đèn chùm đang căng. Phát biểu nào sau đây đúng về lực căng của dây?", "options": ["A. Lực căng có phương vuông góc với sợi dây", "B. Lực căng luôn hướng thẳng đứng xuống dưới", "C. Lực căng chỉ xuất hiện khi dây bị chùng", "D. Lực căng có phương trùng với sợi dây, chiều chống lại sự kéo dãn của dây"], "answer": "D", "explain": "Lực căng $\\vec{T}$ xuất hiện khi dây bị kéo căng: có điểm đặt tại vật, phương trùng với sợi dây, chiều hướng ra khỏi vật (chống lại sự kéo dãn).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bao gạo có khối lượng 50 kg (lấy $g = 10$ m/s$^2$). Trọng lượng của vật là:", "options": ["A. $500$ N", "B. $50$ N", "C. $250$ N", "D. $5$ N"], "answer": "A", "explain": "Trọng lượng $P = mg = 50 \\cdot 10 = 500$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một chiếc đèn chùm khối lượng 7 kg được treo cân bằng bằng một sợi dây thẳng đứng (lấy $g = 10$ m/s$^2$). Lực căng của dây là:", "options": ["A. $7$ N", "B. $70$ N", "C. $140$ N", "D. $0$ N"], "answer": "B", "explain": "Vật cân bằng nên $\\vec{T} + \\vec{P} = \\vec{0}$, suy ra $T = P = mg = 7 \\cdot 10 = 70$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người có khối lượng $m = 100$ kg đứng trong thang máy đang đi lên nhanh dần đều với gia tốc $a = 1.5$ m/s$^2$. Lực mà sàn thang máy tác dụng lên người có độ lớn (lấy $g = 10$ m/s$^2$):", "options": ["A. $850$ N", "B. $1000$ N", "C. $1150$ N", "D. $150$ N"], "answer": "C", "explain": "Chọn chiều dương hướng lên: $N - P = ma$, suy ra $N = m(g + a) = 100 \\cdot (10 + 1.5) = 1150$ N. Người cảm thấy nặng hơn bình thường.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật khối lượng $m = 16$ kg được treo bằng một sợi dây vào trần một chiếc xe đang chuyển động nhanh dần đều với gia tốc $a = 7{,}5$ m/s$^2$ theo phương ngang. Lực căng của dây khi vật cân bằng tương đối với xe là (lấy $g = 10$ m/s$^2$):", "options": ["A. $160$ N", "B. $120$ N", "C. $280$ N", "D. $200$ N"], "answer": "D", "explain": "Trong hệ quy chiếu gắn với xe, vật chịu thêm lực quán tính $F_q = ma$ nằm ngang. Dây lệch khỏi phương thẳng đứng góc $\\alpha$ với $\\tan\\alpha = \\frac{a}{g} = 0{,}75$. Lực căng $T = m\\sqrt{g^2 + a^2} = 16 \\cdot \\sqrt{10^2 + 7{,}5^2} = 16 \\cdot 12{,}5 = 200$ N.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét các phát biểu về trọng lực và lực căng (vật khối lượng $m = 50$ kg):", "statements": ["a) Trọng lượng của vật có khối lượng $m = 50$ kg là $P = 500$ N (lấy $g = 10$ m/s$^2$).", "b) Trọng lực đặt tại trọng tâm của vật và luôn hướng về phía tâm Trái Đất.", "c) Lực căng của dây có phương vuông góc với sợi dây.", "d) Khi vật treo cân bằng bằng một dây thẳng đứng thì lực căng của dây bằng trọng lượng của vật."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $P = mg = 500$ N. b) Đúng. c) Sai: lực căng có phương TRÙNG với sợi dây. d) Đúng: $\\vec{T} + \\vec{P} = \\vec{0}$ nên $T = P$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một người khối lượng $m = 90$ kg đứng trong thang máy (lấy $g = 10$ m/s$^2$). Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một người khối lượng $m = 90$ kg đứng trong thang máy đi lên nhanh dần đều với gia tốc $a = 1$ m/s$^2$. Lực mà sàn thang máy tác dụng lên người là $N = 990$ N.", "b) Khi thang máy chuyển động thẳng đều thì lực sàn tác dụng lên người bằng trọng lượng của người.", "c) Khi thang máy đi xuống nhanh dần đều với gia tốc $a$ thì $N = m(g + a)$.", "d) Khi thang máy đi lên nhanh dần, người trong thang máy cảm thấy nặng hơn bình thường."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $N = m(g + a) = 90 \\cdot (10 + 1) = 990$ N. b) Đúng: $a = 0$ nên $N = P$. c) Sai: đi xuống nhanh dần thì $N = m(g - a)$. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có khối lượng $m = 7.5$ kg được treo cân bằng bằng một sợi dây thẳng đứng. Tính lực căng của dây (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "75", "explain": "Vật cân bằng: $\\vec{T} + \\vec{P} = \\vec{0}$ nên $T = P = mg = 7.5 \\cdot 10 = 75$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật nặng có trọng lượng $P = 90$ N được treo cân bằng bằng hai dây giống nhau, mỗi dây hợp với phương thẳng đứng một góc $60^\\circ$. Tính lực căng của mỗi dây (đơn vị: N).", "answer": "90", "explain": "Chiếu lên phương thẳng đứng: $2T\\cos60^\\circ = P$. Vì $\\cos60^\\circ = \\frac{1}{2}$ nên $T = P = 90$ N.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật có khối lượng $m = 100$ kg đặt trên mặt đất. Phát biểu nào sau đây đúng về trọng lực tác dụng lên vật?", "options": ["A. Trọng lực đặt tại mặt đất, hướng thẳng đứng lên trên", "B. Trọng lực có độ lớn không phụ thuộc khối lượng của vật", "C. Trọng lực đặt tại trọng tâm, hướng theo phương chuyển động của vật", "D. Trọng lực đặt tại trọng tâm của vật, hướng thẳng đứng xuống dưới, độ lớn $P = 1000$ N"], "answer": "D", "explain": "Trọng lực $\\vec{P}$ là lực hút của Trái Đất tác dụng lên vật: đặt tại trọng tâm, phương thẳng đứng, chiều hướng xuống (về phía tâm Trái Đất), độ lớn $P = mg = 100 \\cdot 10 = 1000$ N.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét sợi dây kéo một chiếc xe đang căng. Phát biểu nào sau đây đúng về lực căng của dây?", "options": ["A. Lực căng có phương trùng với sợi dây, chiều chống lại sự kéo dãn của dây", "B. Lực căng có phương vuông góc với sợi dây", "C. Lực căng luôn hướng thẳng đứng xuống dưới", "D. Lực căng chỉ xuất hiện khi dây bị chùng"], "answer": "A", "explain": "Lực căng $\\vec{T}$ xuất hiện khi dây bị kéo căng: có điểm đặt tại vật, phương trùng với sợi dây, chiều hướng ra khỏi vật (chống lại sự kéo dãn).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một chiếc xe máy có khối lượng 100 kg (lấy $g = 10$ m/s$^2$). Trọng lượng của vật là:", "options": ["A. $100$ N", "B. $1000$ N", "C. $500$ N", "D. $10$ N"], "answer": "B", "explain": "Trọng lượng $P = mg = 100 \\cdot 10 = 1000$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một biển quảng cáo khối lượng 9 kg được treo cân bằng bằng một sợi dây thẳng đứng (lấy $g = 10$ m/s$^2$). Lực căng của dây là:", "options": ["A. $9$ N", "B. $180$ N", "C. $90$ N", "D. $0$ N"], "answer": "C", "explain": "Vật cân bằng nên $\\vec{T} + \\vec{P} = \\vec{0}$, suy ra $T = P = mg = 9 \\cdot 10 = 90$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật nặng có trọng lượng $P = 40$ N được treo cân bằng bằng hai dây giống nhau, mỗi dây hợp với phương thẳng đứng một góc $60^\\circ$. Lực căng của mỗi dây là:", "options": ["A. $20$ N", "B. $80$ N", "C. $34.64$ N", "D. $40$ N"], "answer": "D", "explain": "Chiếu lên phương thẳng đứng: $2T\\cos60^\\circ = P$, mà $\\cos60^\\circ = \\frac{1}{2}$ nên $2T \\cdot \\frac{1}{2} = T = P = 40$ N.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người có khối lượng $m = 100$ kg đứng trong thang máy đang đi xuống nhanh dần đều với gia tốc $a = 2$ m/s$^2$. Lực mà sàn thang máy tác dụng lên người có độ lớn (lấy $g = 10$ m/s$^2$):", "options": ["A. $800$ N", "B. $1200$ N", "C. $1000$ N", "D. $200$ N"], "answer": "A", "explain": "Chọn chiều dương hướng xuống: $P - N = ma$, suy ra $N = m(g - a) = 100 \\cdot (10 - 2) = 800$ N. Người cảm thấy nhẹ hơn bình thường.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét các phát biểu về trọng lực và lực căng (vật khối lượng $m = 100$ kg):", "statements": ["a) Trọng lượng của vật có khối lượng $m = 100$ kg là $P = 1000$ N (lấy $g = 10$ m/s$^2$).", "b) Trọng lượng của một vật thay đổi theo vị trí địa lí vì $g$ thay đổi theo vĩ độ và độ cao.", "c) Lực căng của dây chỉ có thể kéo vật chứ không thể đẩy vật.", "d) Một vật treo bằng dây đứng yên thì dây không có lực căng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $P = mg = 1000$ N. b) Đúng. c) Đúng: dây mềm chỉ kéo được chứ không đẩy được. d) Sai: dây treo vật đứng yên vẫn chịu lực căng $T = P$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một người khối lượng $m = 55$ kg đứng trong thang máy (lấy $g = 10$ m/s$^2$). Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một người khối lượng $m = 55$ kg đứng trong thang máy đi lên nhanh dần đều với gia tốc $a = 4$ m/s$^2$. Lực mà sàn thang máy tác dụng lên người là $N = 770$ N.", "b) Khi thang máy chuyển động thẳng đều thì lực sàn tác dụng lên người bằng trọng lượng của người.", "c) Khi thang máy đi xuống nhanh dần đều với gia tốc $a$ thì $N = m(g + a)$.", "d) Khi thang máy đi lên nhanh dần, người trong thang máy cảm thấy nặng hơn bình thường."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $N = m(g + a) = 55 \\cdot (10 + 4) = 770$ N. b) Đúng: $a = 0$ nên $N = P$. c) Sai: đi xuống nhanh dần thì $N = m(g - a)$. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có khối lượng $m = 9.5$ kg được treo cân bằng bằng một sợi dây thẳng đứng. Tính lực căng của dây (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "95", "explain": "Vật cân bằng: $\\vec{T} + \\vec{P} = \\vec{0}$ nên $T = P = mg = 9.5 \\cdot 10 = 95$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật khối lượng $m = 9$ kg được treo bằng dây vào trần xe đang chuyển động nhanh dần đều với gia tốc $a = 7{,}5$ m/s$^2$ theo phương ngang. Tính lực căng của dây khi vật cân bằng tương đối với xe (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "112.5", "explain": "$T = m\\sqrt{g^2 + a^2} = 9 \\cdot \\sqrt{10^2 + 7{,}5^2} = 9 \\cdot 12{,}5 = 112.5$ N.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật có khối lượng $m = 0.5$ kg đặt trên mặt đất. Phát biểu nào sau đây đúng về trọng lực tác dụng lên vật?", "options": ["A. Trọng lực đặt tại trọng tâm của vật, hướng thẳng đứng xuống dưới, độ lớn $P = 5$ N", "B. Trọng lực đặt tại mặt đất, hướng thẳng đứng lên trên", "C. Trọng lực có độ lớn không phụ thuộc khối lượng của vật", "D. Trọng lực đặt tại trọng tâm, hướng theo phương chuyển động của vật"], "answer": "A", "explain": "Trọng lực $\\vec{P}$ là lực hút của Trái Đất tác dụng lên vật: đặt tại trọng tâm, phương thẳng đứng, chiều hướng xuống (về phía tâm Trái Đất), độ lớn $P = mg = 0.5 \\cdot 10 = 5$ N.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét sợi dây buộc một con diều đang căng. Phát biểu nào sau đây đúng về lực căng của dây?", "options": ["A. Lực căng có phương vuông góc với sợi dây", "B. Lực căng có phương trùng với sợi dây, chiều chống lại sự kéo dãn của dây", "C. Lực căng luôn hướng thẳng đứng xuống dưới", "D. Lực căng chỉ xuất hiện khi dây bị chùng"], "answer": "B", "explain": "Lực căng $\\vec{T}$ xuất hiện khi dây bị kéo căng: có điểm đặt tại vật, phương trùng với sợi dây, chiều hướng ra khỏi vật (chống lại sự kéo dãn).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vận động viên có khối lượng 0.5 kg (lấy $g = 10$ m/s$^2$). Trọng lượng của vật là:", "options": ["A. $0.5$ N", "B. $2.5$ N", "C. $5$ N", "D. $0.05$ N"], "answer": "C", "explain": "Trọng lượng $P = mg = 0.5 \\cdot 10 = 5$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một chiếc đèn chùm khối lượng 18 kg được treo cân bằng bằng một sợi dây thẳng đứng (lấy $g = 10$ m/s$^2$). Lực căng của dây là:", "options": ["A. $18$ N", "B. $360$ N", "C. $0$ N", "D. $180$ N"], "answer": "D", "explain": "Vật cân bằng nên $\\vec{T} + \\vec{P} = \\vec{0}$, suy ra $T = P = mg = 18 \\cdot 10 = 180$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người có khối lượng $m = 40$ kg đứng trong thang máy đang đi lên nhanh dần đều với gia tốc $a = 3$ m/s$^2$. Lực mà sàn thang máy tác dụng lên người có độ lớn (lấy $g = 10$ m/s$^2$):", "options": ["A. $520$ N", "B. $280$ N", "C. $400$ N", "D. $120$ N"], "answer": "A", "explain": "Chọn chiều dương hướng lên: $N - P = ma$, suy ra $N = m(g + a) = 40 \\cdot (10 + 3) = 520$ N. Người cảm thấy nặng hơn bình thường.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật khối lượng $m = 20$ kg được treo bằng một sợi dây vào trần một chiếc xe đang chuyển động nhanh dần đều với gia tốc $a = 7{,}5$ m/s$^2$ theo phương ngang. Lực căng của dây khi vật cân bằng tương đối với xe là (lấy $g = 10$ m/s$^2$):", "options": ["A. $200$ N", "B. $250$ N", "C. $150$ N", "D. $350$ N"], "answer": "B", "explain": "Trong hệ quy chiếu gắn với xe, vật chịu thêm lực quán tính $F_q = ma$ nằm ngang. Dây lệch khỏi phương thẳng đứng góc $\\alpha$ với $\\tan\\alpha = \\frac{a}{g} = 0{,}75$. Lực căng $T = m\\sqrt{g^2 + a^2} = 20 \\cdot \\sqrt{10^2 + 7{,}5^2} = 20 \\cdot 12{,}5 = 250$ N.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét các phát biểu về trọng lực và lực căng (vật khối lượng $m = 0.5$ kg):", "statements": ["a) Trọng lượng của vật có khối lượng $m = 0.5$ kg là $P = 5$ N (lấy $g = 10$ m/s$^2$).", "b) Trọng lực đặt tại trọng tâm của vật và luôn hướng về phía tâm Trái Đất.", "c) Lực căng của dây có phương vuông góc với sợi dây.", "d) Khi vật treo cân bằng bằng một dây thẳng đứng thì lực căng của dây bằng trọng lượng của vật."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $P = mg = 5$ N. b) Đúng. c) Sai: lực căng có phương TRÙNG với sợi dây. d) Đúng: $\\vec{T} + \\vec{P} = \\vec{0}$ nên $T = P$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một người khối lượng $m = 65$ kg đứng trong thang máy (lấy $g = 10$ m/s$^2$). Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một người khối lượng $m = 65$ kg đứng trong thang máy đi lên nhanh dần đều với gia tốc $a = 2$ m/s$^2$. Lực mà sàn thang máy tác dụng lên người là $N = 780$ N.", "b) Khi thang máy chuyển động thẳng đều thì lực sàn tác dụng lên người bằng trọng lượng của người.", "c) Khi thang máy đi xuống nhanh dần đều với gia tốc $a$ thì $N = m(g + a)$.", "d) Khi thang máy đi lên nhanh dần, người trong thang máy cảm thấy nặng hơn bình thường."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $N = m(g + a) = 65 \\cdot (10 + 2) = 780$ N. b) Đúng: $a = 0$ nên $N = P$. c) Sai: đi xuống nhanh dần thì $N = m(g - a)$. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có khối lượng $m = 18.5$ kg được treo cân bằng bằng một sợi dây thẳng đứng. Tính lực căng của dây (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "185", "explain": "Vật cân bằng: $\\vec{T} + \\vec{P} = \\vec{0}$ nên $T = P = mg = 18.5 \\cdot 10 = 185$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật nặng có trọng lượng $P = 130$ N được treo cân bằng bằng hai dây giống nhau, mỗi dây hợp với phương thẳng đứng một góc $60^\\circ$. Tính lực căng của mỗi dây (đơn vị: N).", "answer": "130", "explain": "Chiếu lên phương thẳng đứng: $2T\\cos60^\\circ = P$. Vì $\\cos60^\\circ = \\frac{1}{2}$ nên $T = P = 130$ N.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật có khối lượng $m = 25$ kg đặt trên mặt đất. Phát biểu nào sau đây đúng về trọng lực tác dụng lên vật?", "options": ["A. Trọng lực đặt tại mặt đất, hướng thẳng đứng lên trên", "B. Trọng lực đặt tại trọng tâm của vật, hướng thẳng đứng xuống dưới, độ lớn $P = 250$ N", "C. Trọng lực có độ lớn không phụ thuộc khối lượng của vật", "D. Trọng lực đặt tại trọng tâm, hướng theo phương chuyển động của vật"], "answer": "B", "explain": "Trọng lực $\\vec{P}$ là lực hút của Trái Đất tác dụng lên vật: đặt tại trọng tâm, phương thẳng đứng, chiều hướng xuống (về phía tâm Trái Đất), độ lớn $P = mg = 25 \\cdot 10 = 250$ N.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét sợi dây treo một chiếc đèn chùm đang căng. Phát biểu nào sau đây đúng về lực căng của dây?", "options": ["A. Lực căng có phương vuông góc với sợi dây", "B. Lực căng luôn hướng thẳng đứng xuống dưới", "C. Lực căng có phương trùng với sợi dây, chiều chống lại sự kéo dãn của dây", "D. Lực căng chỉ xuất hiện khi dây bị chùng"], "answer": "C", "explain": "Lực căng $\\vec{T}$ xuất hiện khi dây bị kéo căng: có điểm đặt tại vật, phương trùng với sợi dây, chiều hướng ra khỏi vật (chống lại sự kéo dãn).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bao gạo có khối lượng 25 kg (lấy $g = 10$ m/s$^2$). Trọng lượng của vật là:", "options": ["A. $25$ N", "B. $125$ N", "C. $2.5$ N", "D. $250$ N"], "answer": "D", "explain": "Trọng lượng $P = mg = 25 \\cdot 10 = 250$ N.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một biển quảng cáo khối lượng 40 kg được treo cân bằng bằng một sợi dây thẳng đứng (lấy $g = 10$ m/s$^2$). Lực căng của dây là:", "options": ["A. $400$ N", "B. $40$ N", "C. $800$ N", "D. $0$ N"], "answer": "A", "explain": "Vật cân bằng nên $\\vec{T} + \\vec{P} = \\vec{0}$, suy ra $T = P = mg = 40 \\cdot 10 = 400$ N.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật nặng có trọng lượng $P = 400$ N được treo cân bằng bằng hai dây giống nhau, mỗi dây hợp với phương thẳng đứng một góc $60^\\circ$. Lực căng của mỗi dây là:", "options": ["A. $200$ N", "B. $400$ N", "C. $800$ N", "D. $346.41$ N"], "answer": "B", "explain": "Chiếu lên phương thẳng đứng: $2T\\cos60^\\circ = P$, mà $\\cos60^\\circ = \\frac{1}{2}$ nên $2T \\cdot \\frac{1}{2} = T = P = 400$ N.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người có khối lượng $m = 70$ kg đứng trong thang máy đang đi xuống nhanh dần đều với gia tốc $a = 3$ m/s$^2$. Lực mà sàn thang máy tác dụng lên người có độ lớn (lấy $g = 10$ m/s$^2$):", "options": ["A. $910$ N", "B. $700$ N", "C. $490$ N", "D. $210$ N"], "answer": "C", "explain": "Chọn chiều dương hướng xuống: $P - N = ma$, suy ra $N = m(g - a) = 70 \\cdot (10 - 3) = 490$ N. Người cảm thấy nhẹ hơn bình thường.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét các phát biểu về trọng lực và lực căng (vật khối lượng $m = 25$ kg):", "statements": ["a) Trọng lượng của vật có khối lượng $m = 25$ kg là $P = 250$ N (lấy $g = 10$ m/s$^2$).", "b) Trọng lượng của một vật thay đổi theo vị trí địa lí vì $g$ thay đổi theo vĩ độ và độ cao.", "c) Lực căng của dây chỉ có thể kéo vật chứ không thể đẩy vật.", "d) Một vật treo bằng dây đứng yên thì dây không có lực căng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $P = mg = 250$ N. b) Đúng. c) Đúng: dây mềm chỉ kéo được chứ không đẩy được. d) Sai: dây treo vật đứng yên vẫn chịu lực căng $T = P$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một người khối lượng $m = 75$ kg đứng trong thang máy (lấy $g = 10$ m/s$^2$). Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Một người khối lượng $m = 75$ kg đứng trong thang máy đi lên nhanh dần đều với gia tốc $a = 3$ m/s$^2$. Lực mà sàn thang máy tác dụng lên người là $N = 975$ N.", "b) Khi thang máy chuyển động thẳng đều thì lực sàn tác dụng lên người bằng trọng lượng của người.", "c) Khi thang máy đi xuống nhanh dần đều với gia tốc $a$ thì $N = m(g + a)$.", "d) Khi thang máy đi lên nhanh dần, người trong thang máy cảm thấy nặng hơn bình thường."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $N = m(g + a) = 75 \\cdot (10 + 3) = 975$ N. b) Đúng: $a = 0$ nên $N = P$. c) Sai: đi xuống nhanh dần thì $N = m(g - a)$. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có khối lượng $m = 40.5$ kg được treo cân bằng bằng một sợi dây thẳng đứng. Tính lực căng của dây (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "405", "explain": "Vật cân bằng: $\\vec{T} + \\vec{P} = \\vec{0}$ nên $T = P = mg = 40.5 \\cdot 10 = 405$ N.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật khối lượng $m = 11$ kg được treo bằng dây vào trần xe đang chuyển động nhanh dần đều với gia tốc $a = 7{,}5$ m/s$^2$ theo phương ngang. Tính lực căng của dây khi vật cân bằng tương đối với xe (đơn vị: N; lấy $g = 10$ m/s$^2$).", "answer": "137.5", "explain": "$T = m\\sqrt{g^2 + a^2} = 11 \\cdot \\sqrt{10^2 + 7{,}5^2} = 11 \\cdot 12{,}5 = 137.5$ N.", "points": 0.5}]}]}
