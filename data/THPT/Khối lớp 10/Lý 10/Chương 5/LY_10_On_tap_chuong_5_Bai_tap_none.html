{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Đại lượng nào đặc trưng cho khả năng truyền chuyển động của vật khi tương tác?","options": ["A. Động lượng.","B. Động năng.","C. Công suất.","D. Gia tốc."],"answer": "A","explain": "Động lượng đặc trưng cho khả năng truyền chuyển động.","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị của xung lượng của lực là","options": ["A. $\\text{N} \\cdot \\text{s}$.","B. $\\text{J}$.","C. $\\text{W}$.","D. $\\text{kg}$."],"answer": "A","explain": "Xung lượng $\\vec{F}\\Delta t$ có đơn vị $\\text{N} \\cdot \\text{s}$ (tương đương $\\text{kg} \\cdot \\text{m/s}$).","points": 0.25},{"type": "mcq","level": "NB","q": "Vectơ động lượng của vật","options": ["A. cùng hướng với vectơ vận tốc của vật.","B. ngược hướng với vectơ vận tốc của vật.","C. vuông góc với vectơ vận tốc của vật.","D. không có hướng xác định."],"answer": "A","explain": "$\\vec{p} = m\\vec{v}$ nên cùng hướng với $\\vec{v}$.","points": 0.25},{"type": "mcq","level": "NB","q": "Hệ được coi là hệ kín khi","options": ["A. tổng các ngoại lực tác dụng lên hệ bằng 0.","B. các vật trong hệ đứng yên.","C. các vật trong hệ không va chạm nhau.","D. hệ chỉ gồm một vật duy nhất."],"answer": "A","explain": "Điều kiện của hệ kín.","points": 0.25},{"type": "mcq","level": "TH","q": "Một ô tô khối lượng $1200\\ \\text{kg}$ chạy với tốc độ $20\\ \\text{m/s}$. Động lượng của ô tô bằng","options": ["A. $24000\\ \\text{kg} \\cdot \\text{m/s}$.","B. $60\\ \\text{kg} \\cdot \\text{m/s}$.","C. $1200\\ \\text{kg} \\cdot \\text{m/s}$.","D. $240000\\ \\text{kg} \\cdot \\text{m/s}$."],"answer": "A","explain": "$p = 1200 \\cdot 20 = 24000\\ \\text{kg} \\cdot \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Quả bóng khối lượng $0,4\\ \\text{kg}$ đang bay với tốc độ $12\\ \\text{m/s}$ thì đập vào tường và nảy ngược lại với tốc độ $8\\ \\text{m/s}$. Chọn chiều dương là chiều bóng bay tới. Độ biến thiên động lượng của bóng bằng","options": ["A. $-8\\ \\text{kg} \\cdot \\text{m/s}$.","B. $8\\ \\text{kg} \\cdot \\text{m/s}$.","C. $1,6\\ \\text{kg} \\cdot \\text{m/s}$.","D. $-1,6\\ \\text{kg} \\cdot \\text{m/s}$."],"answer": "A","explain": "$\\Delta p = 0,4 \\cdot (-8 - 12) = -8\\ \\text{kg} \\cdot \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng là đại lượng vectơ.","b) Đơn vị của động lượng là $\\text{kg} \\cdot \\text{m/s}$.","c) Độ biến thiên động lượng của vật bằng xung lượng của lực tác dụng lên vật.","d) Lực tác dụng càng lớn thì xung lượng của lực càng nhỏ."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng: $\\Delta\\vec{p} = \\vec{F}\\Delta t$. d) Sai: xung lượng tỉ lệ thuận với lực.","points": 1},{"type": "truefalse","level": "VD","q": "Một viên bi khối lượng $0,25\\ \\text{kg}$ chuyển động với tốc độ $8\\ \\text{m/s}$ đến va chạm mềm với viên bi khối lượng $0,75\\ \\text{kg}$ đang đứng yên. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tổng động lượng của hệ trước va chạm bằng $2\\ \\text{kg} \\cdot \\text{m/s}$.","b) Tốc độ của hệ sau va chạm bằng $2\\ \\text{m/s}$.","c) Động năng của hệ trước va chạm bằng $8\\ \\text{J}$.","d) Động năng của hệ sau va chạm bằng $8\\ \\text{J}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $0,25 \\cdot 8 = 2$. b) Đúng: $V = 2/1 = 2\\ \\text{m/s}$. c) Đúng: $\\frac{1}{2} \\cdot 0,25 \\cdot 64 = 8\\ \\text{J}$. d) Sai: $\\frac{1}{2} \\cdot 1 \\cdot 4 = 2\\ \\text{J} \\lt 8\\ \\text{J}$.","points": 1},{"type": "short","level": "VD","q": "Một lực $60\\ \\text{N}$ tác dụng lên vật khối lượng $3\\ \\text{kg}$ đang đứng yên trong $4\\ \\text{s}$ (bỏ qua ma sát). Tốc độ của vật sau đó bằng bao nhiêu m/s? (chỉ điền số)","answer": "80","explain": "$F\\Delta t = \\Delta p$: $60 \\cdot 4 = 3v$, $v = 80\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một viên đạn khối lượng $30\\ \\text{g}$ đang bay với tốc độ $250\\ \\text{m/s}$ thì nổ thành hai mảnh: mảnh 1 ($20\\ \\text{g}$) bay tiếp với tốc độ $300\\ \\text{m/s}$ cùng hướng. Tốc độ của mảnh 2 bằng bao nhiêu m/s? (chỉ điền số)","answer": "150","explain": "$0,03 \\cdot 250 = 0,02 \\cdot 300 + 0,01v_2$, $v_2 = (7,5 - 6)/0,01 = 150\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "NB","q": "Biểu thức tính độ lớn động lượng của vật là","options": ["A. $p = mv$.","B. $p = \\frac{m}{v}$.","C. $p = mv^2$.","D. $p = \\frac{1}{2}mv^2$."],"answer": "A","explain": "Định nghĩa $p = mv$.","points": 0.25},{"type": "mcq","level": "NB","q": "Định luật bảo toàn động lượng áp dụng cho","options": ["A. hệ kín.","B. hệ có ma sát lớn.","C. mọi hệ vật.","D. vật chuyển động tròn đều."],"answer": "A","explain": "Điều kiện hệ kín (hoặc gần đúng).","points": 0.25},{"type": "mcq","level": "NB","q": "Đặc điểm của va chạm mềm là","options": ["A. hai vật dính vào nhau và chuyển động với cùng tốc độ.","B. hai vật nảy ra xa nhau sau va chạm.","C. một vật dừng lại hẳn sau va chạm.","D. hai vật biến dạng rồi tách rời nhau."],"answer": "A","explain": "Định nghĩa va chạm mềm.","points": 0.25},{"type": "mcq","level": "NB","q": "Hiện tượng nào sau đây là chuyển động bằng phản lực?","options": ["A. Tên lửa phụt khí về phía sau và bay về phía trước.","B. Ô tô tăng tốc nhờ lực kéo của động cơ.","C. Xe đạp lao xuống dốc.","D. Thuyền buồm chạy nhờ sức gió."],"answer": "A","explain": "Tên lửa là ví dụ điển hình của chuyển động bằng phản lực.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người khối lượng $70\\ \\text{kg}$ chạy với tốc độ $6\\ \\text{m/s}$. Động lượng của người bằng","options": ["A. $420\\ \\text{kg} \\cdot \\text{m/s}$.","B. $11,7\\ \\text{kg} \\cdot \\text{m/s}$.","C. $76\\ \\text{kg} \\cdot \\text{m/s}$.","D. $4200\\ \\text{kg} \\cdot \\text{m/s}$."],"answer": "A","explain": "$p = 70 \\cdot 6 = 420\\ \\text{kg} \\cdot \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lực không đổi $25\\ \\text{N}$ tác dụng lên vật trong $0,4\\ \\text{s}$. Xung lượng của lực bằng","options": ["A. $10\\ \\text{N} \\cdot \\text{s}$.","B. $62,5\\ \\text{N} \\cdot \\text{s}$.","C. $100\\ \\text{N} \\cdot \\text{s}$.","D. $0,016\\ \\text{N} \\cdot \\text{s}$."],"answer": "A","explain": "$J = 25 \\cdot 0,4 = 10\\ \\text{N} \\cdot \\text{s}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Hệ kín là hệ có tổng các ngoại lực tác dụng bằng 0.","b) Động lượng của hệ kín được bảo toàn theo thời gian.","c) Trong va chạm mềm, động năng của hệ được bảo toàn.","d) Khi đạn nổ trong thời gian rất ngắn, có thể bỏ qua trọng lực so với lực nổ."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: va chạm mềm làm giảm động năng. d) Đúng: coi gần đúng là hệ kín.","points": 1},{"type": "truefalse","level": "VD","q": "Một khẩu súng khối lượng $6\\ \\text{kg}$ bắn viên đạn $30\\ \\text{g}$ với tốc độ $500\\ \\text{m/s}$ (bỏ qua ma sát). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng của viên đạn sau khi bắn bằng $15\\ \\text{kg} \\cdot \\text{m/s}$.","b) Tốc độ giật lùi của súng bằng $2,5\\ \\text{m/s}$.","c) Động lượng của súng sau khi bắn ngược hướng với đạn.","d) Nếu khối lượng súng tăng gấp đôi thì tốc độ giật lùi tăng gấp đôi (cùng loại đạn)."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $0,03 \\cdot 500 = 15$. b) Đúng: $6V = 15$, $V = 2,5\\ \\text{m/s}$. c) Đúng. d) Sai: $V = p/M$ nên $M$ tăng gấp đôi thì $V$ GIẢM một nửa.","points": 1},{"type": "short","level": "VD","q": "Một toa xe $3000\\ \\text{kg}$ đang chạy với tốc độ $4\\ \\text{m/s}$ đến va chạm mềm với toa xe $2000\\ \\text{kg}$ đang đứng yên. Tốc độ của hệ sau va chạm bằng bao nhiêu m/s? (chỉ điền số)","answer": "2.4","explain": "$V = (3000 \\cdot 4)/5000 = 2,4\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một tên lửa $1500\\ \\text{kg}$ đang đứng yên trong không gian thì phụt ra $150\\ \\text{kg}$ khí với tốc độ $900\\ \\text{m/s}$ (so với đất). Tốc độ của tên lửa sau khi phụt bằng bao nhiêu m/s? (chỉ điền số)","answer": "100","explain": "$150 \\cdot 900 = 1350V$, $V = 100\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Xung lượng của lực được tính bằng biểu thức","options": ["A. $F\\Delta t$.","B. $\\frac{F}{\\Delta t}$.","C. $F + \\Delta t$.","D. $m\\Delta t$."],"answer": "A","explain": "Định nghĩa xung lượng của lực.","points": 0.25},{"type": "mcq","level": "NB","q": "Độ biến thiên động lượng của vật bằng","options": ["A. xung lượng của lực tác dụng lên vật trong khoảng thời gian đó.","B. tích của khối lượng và gia tốc của vật.","C. công của lực tác dụng lên vật.","D. động năng của vật."],"answer": "A","explain": "Định lí biến thiên động lượng: $\\Delta\\vec{p} = \\vec{F}\\Delta t$.","points": 0.25},{"type": "mcq","level": "NB","q": "Hai vật có cùng khối lượng, vật nào có động lượng lớn hơn?","options": ["A. Vật có tốc độ lớn hơn.","B. Vật có tốc độ nhỏ hơn.","C. Vật đang đứng yên.","D. Cả hai bằng nhau."],"answer": "A","explain": "$p = mv$, $m$ bằng nhau thì $v$ lớn hơn cho $p$ lớn hơn.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong thời gian va chạm rất ngắn, hệ các vật va chạm (bỏ qua ma sát) được coi là","options": ["A. hệ kín (gần đúng).","B. hệ mở.","C. hệ không có nội lực.","D. hệ có tổng động lượng bằng 0."],"answer": "A","explain": "Nội lực va chạm rất lớn so với ngoại lực trong thời gian ngắn.","points": 0.25},{"type": "mcq","level": "TH","q": "Một viên bi khối lượng $0,3\\ \\text{kg}$ lăn với tốc độ $10\\ \\text{m/s}$. Động lượng của viên bi bằng","options": ["A. $3\\ \\text{kg} \\cdot \\text{m/s}$.","B. $0,03\\ \\text{kg} \\cdot \\text{m/s}$.","C. $33,3\\ \\text{kg} \\cdot \\text{m/s}$.","D. $30\\ \\text{kg} \\cdot \\text{m/s}$."],"answer": "A","explain": "$p = 0,3 \\cdot 10 = 3\\ \\text{kg} \\cdot \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Lực $120\\ \\text{N}$ tác dụng lên vật khối lượng $6\\ \\text{kg}$ đang đứng yên trong $0,5\\ \\text{s}$ (bỏ qua ma sát). Độ biến thiên động lượng của vật bằng","options": ["A. $60\\ \\text{kg} \\cdot \\text{m/s}$.","B. $20\\ \\text{kg} \\cdot \\text{m/s}$.","C. $720\\ \\text{kg} \\cdot \\text{m/s}$.","D. $3\\ \\text{kg} \\cdot \\text{m/s}$."],"answer": "A","explain": "$\\Delta p = F\\Delta t = 120 \\cdot 0,5 = 60\\ \\text{kg} \\cdot \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Hai vật có cùng tốc độ thì luôn có cùng động lượng.","b) Động lượng của vật tỉ lệ thuận với khối lượng của vật (cùng tốc độ).","c) Đơn vị $\\text{N} \\cdot \\text{s}$ tương đương với đơn vị $\\text{kg} \\cdot \\text{m/s}$.","d) Xung lượng của lực là đại lượng vectơ."],"answer": ["F","T","T","T"],"explain": "a) Sai: còn phụ thuộc khối lượng. b) Đúng. c) Đúng: $1\\ \\text{N} \\cdot \\text{s} = 1\\ \\text{kg} \\cdot \\text{m/s}$. d) Đúng: cùng hướng với lực.","points": 1},{"type": "truefalse","level": "VD","q": "Một người khối lượng $48\\ \\text{kg}$ đứng trên thuyền $192\\ \\text{kg}$ đang đứng yên, rồi nhảy khỏi thuyền với tốc độ $3\\ \\text{m/s}$ (so với nước, bỏ qua sức cản của nước). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tổng động lượng của hệ người + thuyền trước khi nhảy bằng 0.","b) Tốc độ giật lùi của thuyền bằng $0,75\\ \\text{m/s}$.","c) Động lượng của người sau khi nhảy bằng $144\\ \\text{kg} \\cdot \\text{m/s}$.","d) Thuyền chuyển động cùng hướng với người nhảy."],"answer": ["T","T","T","F"],"explain": "a) Đúng: hệ đứng yên. b) Đúng: $48 \\cdot 3 = 192V$, $V = 0,75\\ \\text{m/s}$. c) Đúng: $48 \\cdot 3 = 144$. d) Sai: thuyền giật lùi NGƯỢC hướng người nhảy.","points": 1},{"type": "short","level": "VD","q": "Một quả bóng $0,45\\ \\text{kg}$ đang bay với tốc độ $18\\ \\text{m/s}$ thì đập vào tường và nảy ra với tốc độ $12\\ \\text{m/s}$; thời gian va chạm là $0,03\\ \\text{s}$. Độ lớn lực trung bình của tường tác dụng lên bóng bằng bao nhiêu N? (chỉ điền số)","answer": "450","explain": "$\\Delta p = 0,45 \\cdot (-12 - 18) = -13,5\\ \\text{kg} \\cdot \\text{m/s}$. $|F| = 13,5/0,03 = 450\\ \\text{N}$.","points": 0.5},{"type": "short","level": "VDC","q": "Hai viên bi $m_1 = 0,4\\ \\text{kg}$, $m_2 = 0,6\\ \\text{kg}$ chuyển động ngược chiều nhau với tốc độ $v_1 = 5\\ \\text{m/s}$, $v_2 = 5\\ \\text{m/s}$ rồi va chạm mềm. Tốc độ của hệ sau va chạm bằng bao nhiêu m/s? (chọn chiều dương là chiều của bi 1, chỉ điền giá trị tuyệt đối)","answer": "1","explain": "$V = (0,4 \\cdot 5 - 0,6 \\cdot 5)/1 = -1\\ \\text{m/s}$. Giá trị tuyệt đối bằng $1\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "NB","q": "Động lượng của một vật đang đứng yên bằng","options": ["A. $0$.","B. khối lượng của vật.","C. trọng lượng của vật.","D. một hằng số khác 0."],"answer": "A","explain": "$v = 0$ nên $p = mv = 0$.","points": 0.25},{"type": "mcq","level": "NB","q": "Nếu khối lượng của vật tăng gấp đôi, tốc độ không đổi thì động lượng của vật","options": ["A. tăng gấp đôi.","B. giảm một nửa.","C. không đổi.","D. tăng gấp bốn."],"answer": "A","explain": "$p = mv$ tỉ lệ thuận với $m$.","points": 0.25},{"type": "mcq","level": "NB","q": "Túi khí trong ô tô có tác dụng","options": ["A. kéo dài thời gian va chạm để giảm lực tác dụng lên người.","B. làm tăng động lượng của người.","C. triệt tiêu hoàn toàn va chạm.","D. làm tăng tốc độ của xe."],"answer": "A","explain": "Với cùng $\\Delta p$, $\\Delta t$ càng dài thì $F$ càng nhỏ.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật đang chuyển động tách thành hai phần. Tổng động lượng của hai phần","options": ["A. bằng động lượng ban đầu của vật.","B. bằng 0.","C. gấp đôi động lượng ban đầu.","D. bằng một nửa động lượng ban đầu."],"answer": "A","explain": "Định luật bảo toàn động lượng.","points": 0.25},{"type": "mcq","level": "TH","q": "Một xe tải khối lượng $4000\\ \\text{kg}$ chạy với tốc độ $15\\ \\text{m/s}$. Động lượng của xe bằng","options": ["A. $60000\\ \\text{kg} \\cdot \\text{m/s}$.","B. $266,7\\ \\text{kg} \\cdot \\text{m/s}$.","C. $4015\\ \\text{kg} \\cdot \\text{m/s}$.","D. $900000\\ \\text{kg} \\cdot \\text{m/s}$."],"answer": "A","explain": "$p = 4000 \\cdot 15 = 60000\\ \\text{kg} \\cdot \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một cầu thủ đá quả bóng $0,43\\ \\text{kg}$ đang bay tới với tốc độ $20\\ \\text{m/s}$ làm nó bật ngược lại với tốc độ $25\\ \\text{m/s}$. Chọn chiều dương là chiều bóng bay tới. Độ biến thiên động lượng của bóng bằng","options": ["A. $-19,35\\ \\text{kg} \\cdot \\text{m/s}$.","B. $19,35\\ \\text{kg} \\cdot \\text{m/s}$.","C. $-2,15\\ \\text{kg} \\cdot \\text{m/s}$.","D. $2,15\\ \\text{kg} \\cdot \\text{m/s}$."],"answer": "A","explain": "$\\Delta p = 0,43 \\cdot (-25 - 20) = -19,35\\ \\text{kg} \\cdot \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Trong va chạm mềm, hai vật dính vào nhau sau va chạm.","b) Động lượng của hệ kín được bảo toàn trong va chạm mềm.","c) Động năng của hệ được bảo toàn trong va chạm mềm.","d) Va chạm mềm chỉ xảy ra với các vật rắn."],"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng. c) Sai: động năng giảm. d) Sai: va chạm mềm xảy ra với nhiều loại vật (ví dụ đạn găm vào bao cát).","points": 1},{"type": "truefalse","level": "VD","q": "Một quả lựu đạn $0,8\\ \\text{kg}$ đang bay với tốc độ $25\\ \\text{m/s}$ thì nổ thành hai mảnh bằng nhau; một mảnh bay tiếp với tốc độ $40\\ \\text{m/s}$ cùng hướng ban đầu. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng của đạn ngay trước khi nổ bằng $20\\ \\text{kg} \\cdot \\text{m/s}$.","b) Tốc độ của mảnh còn lại bằng $10\\ \\text{m/s}$ cùng hướng ban đầu.","c) Tổng động lượng của hai mảnh ngay sau khi nổ bằng $20\\ \\text{kg} \\cdot \\text{m/s}$.","d) Động năng của hệ các mảnh giảm sau khi nổ."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $0,8 \\cdot 25 = 20$. b) Đúng: $20 = 0,4 \\cdot 40 + 0,4v$, $v = 10\\ \\text{m/s}$. c) Đúng: bảo toàn động lượng. d) Sai: thuốc nổ cung cấp năng lượng nên động năng TĂNG.","points": 1},{"type": "short","level": "VDC","q": "Một người $62\\ \\text{kg}$ đang chạy với tốc độ $4,5\\ \\text{m/s}$ nhảy lên xe $248\\ \\text{kg}$ đang đứng yên (bỏ qua ma sát). Tốc độ của hệ sau đó bằng bao nhiêu m/s? (chỉ điền số)","answer": "0.9","explain": "$V = (62 \\cdot 4,5)/310 = 279/310 = 0,9\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một khẩu pháo $1200\\ \\text{kg}$ đặt trên mặt ngang, bắn viên đạn $24\\ \\text{kg}$ với tốc độ $350\\ \\text{m/s}$ hợp với phương ngang góc $37^\\circ$ ($\\cos37^\\circ \\approx 0,8$). Tốc độ giật lùi của pháo theo phương ngang bằng bao nhiêu m/s? (chỉ điền số)","answer": "5.6","explain": "Theo phương ngang: $1200V = 24 \\cdot 350 \\cdot 0,8 = 6720$, $V = 5,6\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Vectơ xung lượng của lực","options": ["A. cùng hướng với vectơ lực tác dụng.","B. ngược hướng với vectơ lực tác dụng.","C. vuông góc với vectơ lực tác dụng.","D. luôn hướng thẳng đứng xuống."],"answer": "A","explain": "Xung lượng $\\vec{F}\\Delta t$ cùng hướng với $\\vec{F}$.","points": 0.25},{"type": "mcq","level": "NB","q": "Động lượng của hệ hai vật chuyển động bằng","options": ["A. tổng vectơ động lượng của hai vật.","B. tổng độ lớn động lượng của hai vật.","C. hiệu độ lớn động lượng của hai vật.","D. tích động lượng của hai vật."],"answer": "A","explain": "Động lượng của hệ là tổng vectơ.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi tốc độ của vật tăng gấp 3 lần, khối lượng không đổi thì động lượng của vật","options": ["A. tăng gấp 3 lần.","B. tăng gấp 9 lần.","C. giảm 3 lần.","D. không đổi."],"answer": "A","explain": "$p = mv$ tỉ lệ thuận với $v$.","points": 0.25},{"type": "mcq","level": "TH","q": "Đệm nhảy cao trong thi đấu thể thao có tác dụng","options": ["A. giảm lực va chạm bằng cách kéo dài thời gian tiếp đất.","B. làm tăng động lượng của vận động viên.","C. triệt tiêu trọng lực.","D. làm vận động viên nảy cao hơn."],"answer": "A","explain": "Cùng $\\Delta p$, $\\Delta t$ dài hơn thì $F$ nhỏ hơn.","points": 0.25},{"type": "mcq","level": "TH","q": "Một hòn đá khối lượng $2\\ \\text{kg}$ rơi với tốc độ $14\\ \\text{m/s}$ (ngay trước khi chạm đất). Động lượng của hòn đá lúc đó bằng","options": ["A. $28\\ \\text{kg} \\cdot \\text{m/s}$.","B. $7\\ \\text{kg} \\cdot \\text{m/s}$.","C. $16\\ \\text{kg} \\cdot \\text{m/s}$.","D. $196\\ \\text{kg} \\cdot \\text{m/s}$."],"answer": "A","explain": "$p = 2 \\cdot 14 = 28\\ \\text{kg} \\cdot \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lực $80\\ \\text{N}$ tác dụng lên vật khối lượng $4\\ \\text{kg}$ đang đứng yên. Sau $3\\ \\text{s}$ (bỏ qua ma sát), tốc độ của vật bằng","options": ["A. $60\\ \\text{m/s}$.","B. $20\\ \\text{m/s}$.","C. $6,7\\ \\text{m/s}$.","D. $960\\ \\text{m/s}$."],"answer": "A","explain": "$80 \\cdot 3 = 4v$, $v = 60\\ \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Định luật bảo toàn động lượng chỉ đúng với hệ kín.","b) Tổng động lượng của hệ kín là một vectơ không đổi theo thời gian.","c) Khi có ngoại lực tác dụng, động lượng của hệ kín vẫn được bảo toàn.","d) Có thể áp dụng định luật bảo toàn động lượng theo từng phương."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng: bảo toàn cả độ lớn và hướng. c) Sai: có ngoại lực thì hệ không còn kín. d) Đúng: ví dụ theo phương ngang khi pháo bắn.","points": 1},{"type": "truefalse","level": "VD","q": "Một xe chở cát $2500\\ \\text{kg}$ đang chạy với tốc độ $6\\ \\text{m/s}$ thì một bao cát $100\\ \\text{kg}$ trên xe rơi thẳng đứng xuống đường (bỏ qua ma sát). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng của hệ theo phương ngang được bảo toàn.","b) Tốc độ của xe sau khi bao cát rơi vẫn bằng $6\\ \\text{m/s}$.","c) Bao cát rơi thẳng đứng nên động lượng ngang của nó bằng 0.","d) Nếu bao cát được ném về phía sau xe thì tốc độ của xe tăng lên."],"answer": ["T","T","F","T"],"explain": "a) Đúng: không có ngoại lực theo phương ngang. b) Đúng: $2500 \\cdot 6 = 2400V + 100 \\cdot 6$, $V = 6\\ \\text{m/s}$. c) Sai: bao cát vẫn giữ tốc độ ngang $6\\ \\text{m/s}$ nên mang động lượng ngang $600\\ \\text{kg} \\cdot \\text{m/s}$. d) Đúng: phản lực đẩy xe tiến lên.","points": 1},{"type": "short","level": "VDC","q": "Một toa xe $4500\\ \\text{kg}$ đang chạy với tốc độ $5\\ \\text{m/s}$ đến va chạm mềm với toa xe $1500\\ \\text{kg}$ đang chạy cùng chiều với tốc độ $1\\ \\text{m/s}$. Tốc độ của hệ sau va chạm bằng bao nhiêu m/s? (chỉ điền số)","answer": "4","explain": "$V = (4500 \\cdot 5 + 1500 \\cdot 1)/6000 = 24000/6000 = 4\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một khẩu súng $3,5\\ \\text{kg}$ bắn viên đạn $14\\ \\text{g}$ với tốc độ $700\\ \\text{m/s}$. Bỏ qua ma sát. Động năng của súng ngay sau khi bắn bằng bao nhiêu jun? (chỉ điền số)","answer": "13.72","explain": "$3,5V = 0,014 \\cdot 700 = 9,8$, $V = 2,8\\ \\text{m/s}$. $W_đ = \\frac{1}{2} \\cdot 3,5 \\cdot 2,8^2 = 13,72\\ \\text{J}$.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Đơn vị nào sau đây là đơn vị của động lượng?","options": ["A. $\\text{kg} \\cdot \\text{m/s}$.","B. $\\text{kg} \\cdot \\text{m/s}^2$.","C. $\\text{J}$.","D. $\\text{N/m}$."],"answer": "A","explain": "Đơn vị của $p = mv$.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi vật chuyển động ngược chiều dương đã chọn, động lượng của vật","options": ["A. có giá trị âm.","B. có giá trị dương.","C. bằng 0.","D. không xác định được."],"answer": "A","explain": "$p = mv$, $v \\lt 0$ nên $p \\lt 0$.","points": 0.25},{"type": "mcq","level": "NB","q": "Nội lực trong hệ vật","options": ["A. không làm thay đổi tổng động lượng của hệ.","B. luôn làm tăng tổng động lượng của hệ.","C. luôn làm giảm tổng động lượng của hệ.","D. triệt tiêu lẫn nhau nên bằng 0 mọi lúc."],"answer": "A","explain": "Các nội lực từng cặp trực đối nên tổng nội lực bằng 0.","points": 0.25},{"type": "mcq","level": "TH","q": "Ví dụ nào sau đây là chuyển động bằng phản lực?","options": ["A. Con mực bơi bằng cách phụt nước về phía sau.","B. Chim bay nhờ vỗ cánh.","C. Cá bơi nhờ vây.","D. Người đi bộ trên mặt đất."],"answer": "A","explain": "Mực phụt nước về sau, cơ thể tiến về trước.","points": 0.25},{"type": "mcq","level": "TH","q": "Một máy bay khối lượng $70000\\ \\text{kg}$ bay với tốc độ $250\\ \\text{m/s}$. Động lượng của máy bay bằng","options": ["A. $1,75 \\cdot 10^7\\ \\text{kg} \\cdot \\text{m/s}$.","B. $280\\ \\text{kg} \\cdot \\text{m/s}$.","C. $70250\\ \\text{kg} \\cdot \\text{m/s}$.","D. $1,75 \\cdot 10^5\\ \\text{kg} \\cdot \\text{m/s}$."],"answer": "A","explain": "$p = 70000 \\cdot 250 = 17500000 = 1,75 \\cdot 10^7\\ \\text{kg} \\cdot \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Quả bóng $0,5\\ \\text{kg}$ đang lăn với tốc độ $10\\ \\text{m/s}$ thì đập vào tường và nảy ra với tốc độ $6\\ \\text{m/s}$. Thời gian va chạm là $0,02\\ \\text{s}$. Độ lớn lực trung bình của tường tác dụng lên bóng bằng","options": ["A. $400\\ \\text{N}$.","B. $100\\ \\text{N}$.","C. $200\\ \\text{N}$.","D. $800\\ \\text{N}$."],"answer": "A","explain": "$\\Delta p = 0,5 \\cdot (-6 - 10) = -8\\ \\text{kg} \\cdot \\text{m/s}$. $|F| = 8/0,02 = 400\\ \\text{N}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Xung lượng của lực càng lớn khi lực tác dụng càng lớn (cùng thời gian).","b) Xung lượng của lực càng lớn khi thời gian tác dụng càng dài (cùng lực).","c) Hai lực khác nhau không thể có cùng xung lượng.","d) Xung lượng của hợp lực bằng tổng các xung lượng thành phần."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: $F_1\\Delta t_1$ có thể bằng $F_2\\Delta t_2$. d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Hai viên bi $m_1 = 0,5\\ \\text{kg}$, $m_2 = 1\\ \\text{kg}$ chuyển động ngược chiều nhau với tốc độ $v_1 = 6\\ \\text{m/s}$, $v_2 = 3\\ \\text{m/s}$ rồi va chạm mềm (chọn chiều dương là chiều chuyển động của bi 1). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tổng động lượng của hệ trước va chạm bằng 0.","b) Sau va chạm, hệ hai viên bi đứng yên.","c) Động năng của hệ trước va chạm bằng $13,5\\ \\text{J}$.","d) Động năng của hệ sau va chạm bằng $13,5\\ \\text{J}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $0,5 \\cdot 6 - 1 \\cdot 3 = 0$. b) Đúng: $p = 0$ nên $V = 0$. c) Đúng: $\\frac{1}{2} \\cdot 0,5 \\cdot 36 + \\frac{1}{2} \\cdot 1 \\cdot 9 = 9 + 4,5 = 13,5\\ \\text{J}$. d) Sai: hệ đứng yên nên động năng bằng 0.","points": 1},{"type": "short","level": "VDC","q": "Một vật $1,2\\ \\text{kg}$ chuyển động với tốc độ $15\\ \\text{m/s}$; một vật $1,8\\ \\text{kg}$ chuyển động ngược chiều với tốc độ $10\\ \\text{m/s}$. Độ lớn tổng động lượng của hệ hai vật bằng bao nhiêu $\\text{kg} \\cdot \\text{m/s}$? (chỉ điền số)","answer": "0","explain": "$|1,2 \\cdot 15 - 1,8 \\cdot 10| = |18 - 18| = 0$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật $6\\ \\text{kg}$ đang đứng yên thì nổ thành ba mảnh: mảnh 1 ($2\\ \\text{kg}$) bay với tốc độ $9\\ \\text{m/s}$ về hướng đông, mảnh 2 ($2\\ \\text{kg}$) bay với tốc độ $12\\ \\text{m/s}$ về hướng bắc. Tốc độ của mảnh 3 ($2\\ \\text{kg}$) bằng bao nhiêu m/s? (chỉ điền số)","answer": "15","explain": "$\\vec{p}_3 = -(\\vec{p}_1 + \\vec{p}_2)$. $|p_3| = 2\\sqrt{9^2 + 12^2} = 30\\ \\text{kg} \\cdot \\text{m/s}$. $v_3 = 30/2 = 15\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Phát biểu nào sau đây đúng về động lượng?","options": ["A. Động lượng là đại lượng vectơ.","B. Động lượng là đại lượng vô hướng.","C. Động lượng luôn có giá trị dương.","D. Động lượng không phụ thuộc vào khối lượng."],"answer": "A","explain": "$\\vec{p} = m\\vec{v}$ là vectơ.","points": 0.25},{"type": "mcq","level": "NB","q": "Hệ hai vật va chạm với nhau trong thời gian rất ngắn, bỏ qua ma sát được coi là","options": ["A. hệ kín (gần đúng).","B. hệ mở.","C. hệ không có động lượng.","D. hệ có ngoại lực rất lớn."],"answer": "A","explain": "Nội lực va chạm lớn hơn nhiều so với ngoại lực.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật đang đứng yên vỡ thành hai mảnh thì","options": ["A. hai mảnh bay ngược chiều nhau.","B. hai mảnh bay cùng chiều nhau.","C. hai mảnh cùng đứng yên.","D. hai mảnh bay vuông góc nhau."],"answer": "A","explain": "Tổng động lượng bằng 0 nên $m_1\\vec{v}_1 = -m_2\\vec{v}_2$.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong các trường hợp sau (cùng khối lượng), trường hợp nào động lượng của vật lớn nhất?","options": ["A. Vật chuyển động nhanh nhất.","B. Vật chuyển động chậm nhất.","C. Vật đang đứng yên.","D. Mọi trường hợp bằng nhau."],"answer": "A","explain": "$p = mv$, $v$ lớn nhất thì $p$ lớn nhất.","points": 0.25},{"type": "mcq","level": "TH","q": "Một viên đạn khối lượng $20\\ \\text{g}$ bay với tốc độ $300\\ \\text{m/s}$. Động lượng của viên đạn bằng","options": ["A. $6\\ \\text{kg} \\cdot \\text{m/s}$.","B. $0,067\\ \\text{kg} \\cdot \\text{m/s}$.","C. $6000\\ \\text{kg} \\cdot \\text{m/s}$.","D. $320\\ \\text{kg} \\cdot \\text{m/s}$."],"answer": "A","explain": "$p = 0,02 \\cdot 300 = 6\\ \\text{kg} \\cdot \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một ô tô $1500\\ \\text{kg}$ đang chạy với tốc độ $72\\ \\text{km/h}$. Động lượng của ô tô bằng","options": ["A. $30000\\ \\text{kg} \\cdot \\text{m/s}$.","B. $108000\\ \\text{kg} \\cdot \\text{m/s}$.","C. $20,8\\ \\text{kg} \\cdot \\text{m/s}$.","D. $3000\\ \\text{kg} \\cdot \\text{m/s}$."],"answer": "A","explain": "$72\\ \\text{km/h} = 20\\ \\text{m/s}$. $p = 1500 \\cdot 20 = 30000\\ \\text{kg} \\cdot \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tên lửa chuyển động được nhờ định luật bảo toàn động lượng.","b) Khi tên lửa phụt khí về phía sau, khí nhận động lượng hướng về phía sau.","c) Tên lửa nhận động lượng hướng về phía trước.","d) Tổng động lượng của hệ tên lửa + khí phụt ra tăng lên theo thời gian."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: hệ kín nên tổng động lượng KHÔNG đổi.","points": 1},{"type": "truefalse","level": "VD","q": "Một người $54\\ \\text{kg}$ đang chạy với tốc độ $5\\ \\text{m/s}$ nhảy lên xe $216\\ \\text{kg}$ đang đứng yên (bỏ qua ma sát). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tốc độ của hệ người + xe sau đó bằng $1\\ \\text{m/s}$.","b) Động năng ban đầu của người bằng $675\\ \\text{J}$.","c) Động năng của hệ sau đó bằng $135\\ \\text{J}$.","d) Động năng của hệ được bảo toàn."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $V = (54 \\cdot 5)/270 = 1\\ \\text{m/s}$. b) Đúng: $\\frac{1}{2} \\cdot 54 \\cdot 25 = 675\\ \\text{J}$. c) Đúng: $\\frac{1}{2} \\cdot 270 \\cdot 1 = 135\\ \\text{J}$. d) Sai: $135 \\lt 675$, động năng giảm.","points": 1},{"type": "short","level": "VDC","q": "Một khẩu súng $4,5\\ \\text{kg}$ bắn viên đạn $18\\ \\text{g}$ với tốc độ $600\\ \\text{m/s}$. Bỏ qua ma sát. Tốc độ giật lùi của súng bằng bao nhiêu m/s? (chỉ điền số)","answer": "2.4","explain": "$4,5V = 0,018 \\cdot 600 = 10,8$, $V = 2,4\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một viên đạn $40\\ \\text{g}$ đang bay với tốc độ $200\\ \\text{m/s}$ thì nổ thành hai mảnh bằng nhau; một mảnh bay với tốc độ $300\\ \\text{m/s}$ ngược hướng ban đầu. Tốc độ của mảnh còn lại bằng bao nhiêu m/s? (chỉ điền số)","answer": "700","explain": "Chọn chiều dương là chiều đạn bay: $0,04 \\cdot 200 = 0,02 \\cdot (-300) + 0,02v$, $v = (8 + 6)/0,02 = 700\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "NB","q": "Biểu thức của định lí biến thiên động lượng là","options": ["A. $\\Delta\\vec{p} = \\vec{F}\\Delta t$.","B. $\\Delta\\vec{p} = \\frac{\\vec{F}}{\\Delta t}$.","C. $\\Delta p = F + \\Delta t$.","D. $\\Delta\\vec{p} = m\\vec{a}$."],"answer": "A","explain": "Định lí: độ biến thiên động lượng bằng xung lượng của lực.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật chịu tác dụng của lực không đổi trong thời gian $\\Delta t$. Độ biến thiên động lượng của vật","options": ["A. tỉ lệ thuận với $\\Delta t$.","B. tỉ lệ nghịch với $\\Delta t$.","C. không phụ thuộc $\\Delta t$.","D. luôn bằng 0."],"answer": "A","explain": "$\\Delta p = F\\Delta t$.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi hai xe va chạm và dính vào nhau, loại va chạm này gọi là","options": ["A. va chạm mềm.","B. va chạm đàn hồi.","C. va chạm xuyên tâm.","D. va chạm hoàn toàn."],"answer": "A","explain": "Định nghĩa va chạm mềm.","points": 0.25},{"type": "mcq","level": "TH","q": "Sau va chạm mềm của hệ kín, đại lượng nào sau đây KHÔNG đổi?","options": ["A. Tổng động lượng của hệ.","B. Tổng động năng của hệ.","C. Tốc độ của mỗi vật.","D. Thế năng của hệ."],"answer": "A","explain": "Va chạm mềm bảo toàn động lượng, không bảo toàn động năng.","points": 0.25},{"type": "mcq","level": "TH","q": "Một quả tạ $5\\ \\text{kg}$ rơi với tốc độ $10\\ \\text{m/s}$ (ngay trước khi chạm đất). Động lượng của quả tạ lúc đó bằng","options": ["A. $50\\ \\text{kg} \\cdot \\text{m/s}$.","B. $0,5\\ \\text{kg} \\cdot \\text{m/s}$.","C. $15\\ \\text{kg} \\cdot \\text{m/s}$.","D. $500\\ \\text{kg} \\cdot \\text{m/s}$."],"answer": "A","explain": "$p = 5 \\cdot 10 = 50\\ \\text{kg} \\cdot \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một lực $50\\ \\text{N}$ tác dụng lên vật khối lượng $10\\ \\text{kg}$ đang đứng yên trong $2\\ \\text{s}$ (bỏ qua ma sát). Độ biến thiên tốc độ của vật bằng","options": ["A. $10\\ \\text{m/s}$.","B. $5\\ \\text{m/s}$.","C. $100\\ \\text{m/s}$.","D. $1000\\ \\text{m/s}$."],"answer": "A","explain": "$50 \\cdot 2 = 10\\Delta v$, $\\Delta v = 10\\ \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng của hệ nhiều vật bằng tổng vectơ động lượng của các vật.","b) Hai vật chuyển động ngược chiều nhau có thể có tổng động lượng bằng 0.","c) Động lượng của vật luôn cùng hướng với lực tác dụng lên vật.","d) Hai vật cùng tốc độ, vật có khối lượng lớn hơn thì động lượng lớn hơn."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng: ví dụ $m_1v_1 = m_2v_2$ ngược chiều. c) Sai: động lượng cùng hướng VẬN TỐC, không phải lực. d) Đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Một khẩu pháo $800\\ \\text{kg}$ bắn viên đạn $16\\ \\text{kg}$ với tốc độ $400\\ \\text{m/s}$ theo phương ngang (bỏ qua ma sát). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tốc độ giật lùi của pháo bằng $8\\ \\text{m/s}$.","b) Động lượng của viên đạn sau khi bắn bằng $6400\\ \\text{kg} \\cdot \\text{m/s}$.","c) Động lượng của pháo sau khi bắn ngược hướng với đạn.","d) Nếu bắn đạn với tốc độ gấp đôi thì pháo giật lùi chậm hơn."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $800V = 16 \\cdot 400 = 6400$, $V = 8\\ \\text{m/s}$. b) Đúng: $16 \\cdot 400 = 6400$. c) Đúng. d) Sai: $V$ tỉ lệ thuận với tốc độ đạn nên giật lùi NHANH hơn.","points": 1},{"type": "short","level": "VDC","q": "Một xe $1800\\ \\text{kg}$ đang chạy với tốc độ $9\\ \\text{m/s}$ đến va chạm mềm với xe $1200\\ \\text{kg}$ đang đứng yên. Tốc độ của hệ sau va chạm bằng bao nhiêu m/s? (chỉ điền số)","answer": "5.4","explain": "$V = (1800 \\cdot 9)/3000 = 16200/3000 = 5,4\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một tên lửa $2000\\ \\text{kg}$ đang bay với tốc độ $250\\ \\text{m/s}$ thì phụt ra $100\\ \\text{kg}$ khí với tốc độ $500\\ \\text{m/s}$ ngược chiều chuyển động (so với đất). Tốc độ của tên lửa sau khi phụt bằng bao nhiêu m/s? (chỉ điền số, làm tròn đến 1 chữ số thập phân)","answer": "289.5","explain": "Chọn chiều dương là chiều tên lửa bay: $2000 \\cdot 250 = 100 \\cdot (-500) + 1900V$, $1900V = 550000$, $V \\approx 289,5\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Khi một lực tác dụng lên vật trong thời gian càng dài (lực không đổi) thì","options": ["A. độ biến thiên động lượng của vật càng lớn.","B. độ biến thiên động lượng của vật càng nhỏ.","C. động lượng của vật không đổi.","D. vật chuyển động chậm lại."],"answer": "A","explain": "$\\Delta p = F\\Delta t$.","points": 0.25},{"type": "mcq","level": "NB","q": "Động lượng của vật phụ thuộc vào","options": ["A. khối lượng và vận tốc của vật.","B. khối lượng và gia tốc của vật.","C. quãng đường và thời gian.","D. lực tác dụng và thời gian."],"answer": "A","explain": "$\\vec{p} = m\\vec{v}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một hệ gồm hai vật chỉ tương tác với nhau, không chịu tác dụng của ngoại lực là","options": ["A. hệ kín.","B. hệ mở.","C. hệ cô đặc.","D. hệ quy chiếu."],"answer": "A","explain": "Định nghĩa hệ kín.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong chuyển động bằng phản lực, phần còn lại của vật chuyển động","options": ["A. ngược chiều với phần tách ra.","B. cùng chiều với phần tách ra.","C. vuông góc với phần tách ra.","D. đứng yên."],"answer": "A","explain": "Để tổng động lượng bảo toàn.","points": 0.25},{"type": "mcq","level": "TH","q": "Một con ngựa khối lượng $500\\ \\text{kg}$ phi với tốc độ $12\\ \\text{m/s}$. Động lượng của con ngựa bằng","options": ["A. $6000\\ \\text{kg} \\cdot \\text{m/s}$.","B. $41,7\\ \\text{kg} \\cdot \\text{m/s}$.","C. $512\\ \\text{kg} \\cdot \\text{m/s}$.","D. $72000\\ \\text{kg} \\cdot \\text{m/s}$."],"answer": "A","explain": "$p = 500 \\cdot 12 = 6000\\ \\text{kg} \\cdot \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật khối lượng $8\\ \\text{kg}$ đang đứng yên thì chịu tác dụng của lực $40\\ \\text{N}$ trong $2\\ \\text{s}$ (bỏ qua ma sát). Tốc độ của vật sau đó bằng","options": ["A. $10\\ \\text{m/s}$.","B. $5\\ \\text{m/s}$.","C. $160\\ \\text{m/s}$.","D. $640\\ \\text{m/s}$."],"answer": "A","explain": "$40 \\cdot 2 = 8v$, $v = 10\\ \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Va chạm mềm không bảo toàn động năng của hệ.","b) Va chạm mềm vẫn bảo toàn động lượng của hệ kín.","c) Phần động năng mất đi trong va chạm mềm chuyển thành nhiệt năng và công làm biến dạng vật.","d) Sau va chạm mềm, hai vật chuyển động với tốc độ khác nhau."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: hai vật dính vào nhau nên cùng tốc độ.","points": 1},{"type": "truefalse","level": "VDC","q": "Một viên đạn $50\\ \\text{g}$ đang bay với tốc độ $300\\ \\text{m/s}$ thì nổ thành hai mảnh: mảnh 1 ($30\\ \\text{g}$) bay tiếp với tốc độ $400\\ \\text{m/s}$ cùng hướng ban đầu. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng của đạn ngay trước khi nổ bằng $15\\ \\text{kg} \\cdot \\text{m/s}$.","b) Tốc độ của mảnh 2 bằng $150\\ \\text{m/s}$ cùng hướng ban đầu.","c) Động năng của hệ các mảnh tăng lên sau khi nổ.","d) Tổng động lượng của hệ các mảnh giảm sau khi nổ."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $0,05 \\cdot 300 = 15$. b) Đúng: $15 = 0,03 \\cdot 400 + 0,02v$, $v = 150\\ \\text{m/s}$. c) Đúng: thuốc nổ cung cấp năng lượng. d) Sai: động lượng được bảo toàn.","points": 1},{"type": "short","level": "VDC","q": "Một người $45\\ \\text{kg}$ đang đứng trên xe $135\\ \\text{kg}$ đang chạy với tốc độ $4\\ \\text{m/s}$ thì nhảy khỏi xe với tốc độ $2\\ \\text{m/s}$ ngược chiều xe chạy (so với đất, bỏ qua ma sát). Tốc độ của xe sau khi người nhảy bằng bao nhiêu m/s? (chỉ điền số)","answer": "6","explain": "Chọn chiều dương là chiều xe chạy: $(45 + 135) \\cdot 4 = 45 \\cdot (-2) + 135V$, $135V = 810$, $V = 6\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một viên bi $0,6\\ \\text{kg}$ chuyển động với tốc độ $5\\ \\text{m/s}$ đến va chạm mềm với viên bi $0,4\\ \\text{kg}$ đang đứng yên. Phần trăm động năng bị mất sau va chạm bằng bao nhiêu %? (chỉ điền số)","answer": "40","explain": "$W_{đ1} = \\frac{1}{2} \\cdot 0,6 \\cdot 25 = 7,5\\ \\text{J}$. $V = 3/1 = 3\\ \\text{m/s}$. $W_{đ2} = \\frac{1}{2} \\cdot 1 \\cdot 9 = 4,5\\ \\text{J}$. Mất $3\\ \\text{J}$, tức $40\\%$.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Đại lượng $F\\Delta t$ được gọi là","options": ["A. xung lượng của lực.","B. động lượng của vật.","C. công của lực.","D. công suất của lực."],"answer": "A","explain": "Định nghĩa xung lượng của lực.","points": 0.25},{"type": "mcq","level": "NB","q": "Động lượng của vật có khối lượng $m$ đang chuyển động với tốc độ $v$ có độ lớn bằng","options": ["A. $mv$.","B. $\\frac{1}{2}mv^2$.","C. $mgh$.","D. $\\frac{mv}{2}$."],"answer": "A","explain": "$p = mv$.","points": 0.25},{"type": "mcq","level": "TH","q": "Vì động lượng là đại lượng vectơ nên khi giải bài tập cần","options": ["A. chọn chiều dương và xác định dấu của các vận tốc.","B. chỉ tính độ lớn, bỏ qua hướng.","C. bỏ qua khối lượng của các vật.","D. đổi mọi đơn vị về jun."],"answer": "A","explain": "Phải ghi dấu cho các vectơ ngược chiều.","points": 0.25},{"type": "mcq","level": "TH","q": "Hiện tượng súng giật lùi khi bắn là do","options": ["A. định luật bảo toàn động lượng.","B. định luật bảo toàn năng lượng.","C. lực ma sát.","D. trọng lực."],"answer": "A","explain": "Hệ súng + đạn là hệ kín theo phương ngang.","points": 0.25},{"type": "mcq","level": "TH","q": "Một xe buýt $8000\\ \\text{kg}$ chạy với tốc độ $54\\ \\text{km/h}$. Động lượng của xe bằng","options": ["A. $120000\\ \\text{kg} \\cdot \\text{m/s}$.","B. $432000\\ \\text{kg} \\cdot \\text{m/s}$.","C. $148,1\\ \\text{kg} \\cdot \\text{m/s}$.","D. $12000\\ \\text{kg} \\cdot \\text{m/s}$."],"answer": "A","explain": "$54\\ \\text{km/h} = 15\\ \\text{m/s}$. $p = 8000 \\cdot 15 = 120000\\ \\text{kg} \\cdot \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vận động viên bóng rổ $90\\ \\text{kg}$ đang chạy với tốc độ $7\\ \\text{m/s}$ thì va vào đệm và dừng lại trong $0,5\\ \\text{s}$. Độ lớn lực trung bình của đệm tác dụng lên người bằng","options": ["A. $1260\\ \\text{N}$.","B. $315\\ \\text{N}$.","C. $630\\ \\text{N}$.","D. $180\\ \\text{N}$."],"answer": "A","explain": "$\\Delta p = 90 \\cdot 7 = 630\\ \\text{kg} \\cdot \\text{m/s}$. $|F| = 630/0,5 = 1260\\ \\text{N}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Đơn vị của xung lượng của lực là $\\text{N} \\cdot \\text{s}$.","b) Xung lượng của lực bằng độ biến thiên động lượng của vật.","c) Lực tác dụng trong thời gian càng ngắn thì độ biến thiên động lượng càng lớn (cùng độ lớn lực).","d) Đệm nhảy cao giúp giảm lực va chạm lên vận động viên."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: $\\Delta p = F\\Delta t$ nên thời gian càng ngắn thì $\\Delta p$ càng NHỎ. d) Đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Một tên lửa $600\\ \\text{kg}$ đang đứng yên trong không gian thì phụt ra $60\\ \\text{kg}$ khí với tốc độ $800\\ \\text{m/s}$ (so với đất). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tốc độ của tên lửa sau khi phụt tỉ lệ nghịch với khối lượng còn lại của nó.","b) Tốc độ của tên lửa sau khi phụt bằng $80\\ \\text{m/s}$.","c) Động lượng của khối khí phụt ra bằng $48000\\ \\text{kg} \\cdot \\text{m/s}$.","d) Nếu phụt khí với tốc độ gấp đôi thì tốc độ của tên lửa tăng gấp đôi."],"answer": ["T","F","T","T"],"explain": "a) Đúng: $V = m_{khí}v/(M - m_{khí})$. b) Sai: $60 \\cdot 800 = 540V$, $V \\approx 88,9\\ \\text{m/s}$. c) Đúng: $60 \\cdot 800 = 48000$. d) Đúng: $V$ tỉ lệ thuận với $v_{khí}$.","points": 1},{"type": "short","level": "VDC","q": "Hai viên bi $m_1 = 0,8\\ \\text{kg}$, $m_2 = 1,2\\ \\text{kg}$ chuyển động cùng chiều với tốc độ $v_1 = 7\\ \\text{m/s}$, $v_2 = 2\\ \\text{m/s}$ rồi va chạm mềm. Tốc độ của hệ sau va chạm bằng bao nhiêu m/s? (chỉ điền số)","answer": "4","explain": "$V = (0,8 \\cdot 7 + 1,2 \\cdot 2)/2 = 8/2 = 4\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $2m$ đang chuyển động với tốc độ $v$ thì nổ thành hai mảnh bằng nhau bay theo hai hướng vuông góc nhau, mỗi mảnh có tốc độ $2v$. Động lượng ban đầu của vật có độ lớn bằng bao nhiêu lần $mv$? (chỉ điền số, dạng thập phân)","answer": "2.83","explain": "Mỗi mảnh: $p = m \\cdot 2v = 2mv$. Hai vectơ vuông góc: $p = \\sqrt{(2mv)^2 + (2mv)^2} = 2\\sqrt{2}mv \\approx 2,83mv$.","points": 0.5}]}]}
