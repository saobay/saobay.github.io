.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "NB","q": "Biểu thức của định luật bảo toàn động lượng cho hệ hai vật là","options": ["A. $\\vec{p}_1 + \\vec{p}_2 = \\text{hằng số}$.","B. $p_1 + p_2 = 0$.","C. $\\vec{p}_1 = \\vec{p}_2$.","D. $m_1\\vec{v}_1 = m_2\\vec{v}_2$."],"answer": "A","explain": "Tổng vectơ động lượng của hệ kín không đổi.","points": 0.25},{"type": "mcq","level": "NB","q": "Chuyển động bằng phản lực là chuyển động","options": ["A. của vật tự tách ra thành các phần chuyển động ngược chiều nhau.","B. do phản lực của mặt đất.","C. do lực ma sát.","D. của vật rơi tự do."],"answer": "A","explain": "Ví dụ: tên lửa phụt khí, súng giật lùi.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi viên đạn nổ thành nhiều mảnh đang bay, động lượng của hệ các mảnh","options": ["A. được bảo toàn (nếu bỏ qua ngoại lực).","B. luôn bằng 0.","C. tăng lên.","D. giảm đi."],"answer": "A","explain": "Nội lực (thuốc nổ) rất lớn so với trọng lực trong thời gian ngắn nên coi như hệ kín.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật đang đứng yên trong hệ kín tách thành hai phần. Hai phần sẽ","options": ["A. chuyển động ngược chiều nhau.","B. chuyển động cùng chiều nhau.","C. cùng đứng yên.","D. chuyển động vuông góc nhau."],"answer": "A","explain": "Tổng động lượng bằng 0 nên $m_1\\vec{v}_1 = -m_2\\vec{v}_2$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một toa xe $4000\\ \\text{kg}$ đang chạy với tốc độ $3\\ \\text{m/s}$ đến va chạm mềm với toa xe $6000\\ \\text{kg}$ đang đứng yên. Tốc độ của hệ sau va chạm bằng","options": ["A. $1,2\\ \\text{m/s}$.","B. $3\\ \\text{m/s}$.","C. $2\\ \\text{m/s}$.","D. $7,5\\ \\text{m/s}$."],"answer": "A","explain": "$4000 \\cdot 3 = 10000V$, $V = 1,2\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người $55\\ \\text{kg}$ đứng trên thuyền $145\\ \\text{kg}$ đang đứng yên, rồi nhảy khỏi thuyền với tốc độ $2,5\\ \\text{m/s}$ (so với nước). Tốc độ giật lùi của thuyền bằng","options ,"level": "VDC","q": "Một tên lửa có khối lượng $2000\\ \\text{kg}$ đang bay với tốc độ $300\\ \\text{m/s}$ thì phụt ra $200\\ \\text{kg}$ khí với tốc độ $800\\ \\text{m/s}$ ngược chiều chuyển động (tốc độ tương đối so với tên lửa trước khi phụt). Tốc độ của tên lửa sau khi phụt bằng bao nhiêu m/s? (chỉ điền số, làm tròn đến hàng đơn vị)","answer": "389","explain": "Chọn chiều dương là chiều tên lửa bay. Tốc độ khí so với đất: $300 - 800 = -500\\ \\text{m/s}$. Bảo toàn động lượng: $2000 \\cdot 300 = 200 \\cdot (-500) + 1800V$, suy ra $1800V = 700000$, $V \\approx 389\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Một hệ được coi là hệ kín khi","options": ["A. tổng các ngoại lực tác dụng lên hệ bằng 0.","B. không có vật nào chuyển động.","C. các vật trong hệ không va chạm nhau.","D. hệ chỉ gồm hai vật."],"answer": "A","explain": "Điều kiện hệ kín.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong chuyển động bằng phản lực,","options": ["A. một phần của vật tách ra chuyển động ngược chiều với phần còn lại.","B. vật chịu tác dụng của ngoại lực lớn.","C. động lượng của vật tăng gấp đôi.","D. vật luôn đứng yên."],"answer": "A","explain": "Ví dụ tên lửa, súng giật lùi.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi đạn nổ, các mảnh văng ra","options": ["A. sao cho tổng động lượng của hệ các mảnh được bảo toàn (bỏ qua ngoại lực).","B. với cùng tốc độ.","C. theo cùng một hướng.","D. với tổng động năng không đổi."],"answer": "A","explain": "Nội lực vụ nổ rất lớn trong thời gian ngắn.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật $3\\ \\text{kg}$ đang đứng yên thì nổ thành hai mảnh $1\\ \\text{kg}$ và $2\\ \\text{kg}$. Mảnh $1\\ \\text{kg}$ bay với tốc độ $12\\ \\text{m/s}$. Tốc độ của mảnh $2\\ \\text{kg}$ bằng","options": ["A. $6\\ \\text{m/s}$ ngược hướng mảnh 1.","B. $12\\ \\text{m/s}$ cùng hướng mảnh 1.","C. $4\\ \\text{m/s}$.","D. $18\\ \\text{m/s}$."],"answer": "A","explain": "$1 \\cdot 12 = 2v_2$, $v_2 = 6\\ \\text{m/s}$ ngược hướng.","points": 0.25},{"type": "mcq","level": "TH","q": "Hai vật $m_1 = 4\\ \\text{kg}$, $v_1 = 5\\ \\text{m/s}$ và $m_2 = 5\\ \\text{kg}$, $v_2 = 4\\ \\text{m/s}$ chuyển động ngược chiều nhau đến va chạm mềm. Tốc độ của hệ sau va chạm bằng","options": ["A. $0$ (hệ dừng lại).","B. $9\\ \\text{m/s}$.","C. $4,44\\ \\text{m/s}$.","D. $1\\ \\text{m/s}$."],"answer": "A","explain": "$p = 4 \\cdot 5 - 5 \\cdot 4 = 0$ nên hệ dừng lại.","points": 0.25},{"type": "mcq","level": "TH","q": "Một tên lửa $800\\ \\text{kg}$ đang đứng yên phụt ra $80\\ \\text{kg}$ khí với tốc độ $1000\\ \\text{m/s}$ (so với đất). Tốc độ của tên lửa sau khi phụt bằng","options": ["A. $111,1\\ \\text{m/s}$.","B. $1000\\ \\text{m/s}$.","C. $100\\ \\text{m/s}$.","D. $11,1\\ \\text{m/s}$."],"answer": "A","explain": "$80 \\cdot 1000 = 720V$, $V \\approx 111,1\\ \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Hệ kín là hệ không chịu tác dụng của ngoại lực.","b) Động lượng của hệ kín bảo toàn theo thời gian.","c) Va chạm mềm bảo toàn động năng.","d) Súng giật lùi là ví dụ về chuyển động bằng phản lực."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai. d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Một xe goòng $500\\ \\text{kg}$ đang chạy với tốc độ $4\\ \\text{m/s}$ thì người ta ném vào xe một bao cát $50\\ \\text{kg}$ theo phương ngang ngược chiều chuyển động của xe với tốc độ $6\\ \\text{m/s}$ (so với đất, bỏ qua ma sát). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng của hệ theo phương ngang được bảo toàn.","b) Tổng động lượng trước khi ném bằng $1700\\ \\text{kg} \\cdot \\text{m/s}$ (chọn chiều dương là chiều xe chạy).","c) Tốc độ của hệ sau đó xấp xỉ $3,09\\ \\text{m/s}$.","d) Nếu ném bao cát cùng chiều xe thì tốc độ của hệ tăng."],"answer": ["T","T","T","T"],"explain": "a) Đúng: không có ngoại lực theo phương ngang. b) Đúng: $500 \\cdot 4 - 50 \\cdot 6 = 1700$. c) Đúng: $V = 1700/550 \\approx 3,09\\ \\text{m/s}$. d) Đúng: $p$ tăng.","points": 1},{"type": "short","level": "VD","q": "Một vật khối lượng $1,5\\ \\text{kg}$ chuyển động với tốc độ $6\\ \\text{m/s}$ đến va chạm mềm với vật $2,5\\ \\text{kg}$ đang đứng yên. Động năng của hệ sau va chạm bằng bao nhiêu jun? (chỉ điền số)","answer": "10.125","explain": "$V = (1,5 \\cdot 6)/4 = 2,25\\ \\text{m/s}$. $W_đ = \\frac{1}{2} \\cdot 4 \\cdot 2,25^2 = 10,125\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một khẩu pháo $1000\\ \\text{kg}$ đặt trên mặt ngang, bắn viên đạn $20\\ \\text{kg}$ với tốc độ $300\\ \\text{m/s}$ hợp với phương ngang góc $30^\\circ$ ($\\cos30^\\circ \\approx 0,87$). Tốc độ giật lùi của pháo theo phương ngang bằng bao nhiêu m/s? (chỉ điền số, làm tròn đến 1 chữ số thập phân)","answer": "5.2","explain": "Theo phương ngang: $1000V = 20 \\cdot 300 \\cdot \\cos30^\\circ = 5220$, $V = 5,22\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "NB","q": "Động lượng của hệ hai vật $m_1$, $m_2$ chuyển động với tốc độ $v_1$, $v_2$ ngược chiều nhau có độ lớn bằng","options": ["A. $|m_1v_1 - m_2v_2|$.","B. $m_1v_1 + m_2v_2$.","C. $m_1v_1 \\cdot m_2v_2$.","D. $0$."],"answer": "A","explain": "Cộng vectơ ngược chiều: lấy hiệu độ lớn.","points": 0.25},{"type": "mcq","level": "NB","q": "Một quả pháo thăng thiên nổ trên không. Ngay sau khi nổ, tổng động lượng của các mảnh","options": ["A. bằng động lượng của quả pháo ngay trước khi nổ (bỏ qua trọng lực trong thời gian ngắn).","B. bằng 0.","C. tăng gấp đôi.","D. giảm một nửa."],"answer": "A","explain": "Nội lực vụ nổ lớn hơn nhiều so với trọng lực trong thời gian ngắn.","points": 0.25},{"type": "mcq","level": "NB","q": "Ví dụ nào sau đây KHÔNG phải chuyển động bằng phản lực?","options": ["A. Ô tô phanh gấp.","B. Tên lửa.","C. Súng giật lùi khi bắn.","D. Bạch tuộc bơi bằng cách phụt nước."],"answer": "A","explain": "Ô tô phanh là do lực ma sát (ngoại lực), không phải phản lực.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người $60\\ \\text{kg}$ đang đứng yên trên ván trượt $10\\ \\text{kg}$ thì ném quả tạ $5\\ \\text{kg}$ về phía trước với tốc độ $8\\ \\text{m/s}$ (so với đất). Tốc độ giật lùi của người và ván bằng","options": ["A. $\\frac{4}{7}\\ \\text{m/s} \\approx 0,57\\ \\text{m/s}$.","B. $8\\ \\text{m/s}$.","C. $4\\ \\text{m/s}$.","D. $0,8\\ \\text{m/s}$."],"answer": "A","explain": "$5 \\cdot 8 = 70V$, $V = 40/70 \\approx 0,57\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Hai viên bi $m_1 = 0,2\\ \\text{kg}$, $m_2 = 0,3\\ \\text{kg}$ chuyển động ngược chiều với tốc độ $v_1 = 3\\ \\text{m/s}$, $v_2 = 2\\ \\text{m/s}$ rồi va chạm mềm. Tốc độ của hệ sau va chạm bằng","options": ["A. $0$ (dừng lại).","B. $5\\ \\text{m/s}$.","C. $1\\ \\text{m/s}$.","D. $2,5\\ \\text{m/s}$."],"answer": "A","explain": "$p = 0,2 \\cdot 3 - 0,3 \\cdot 2 = 0$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $m$ đang chuyển động với tốc độ $v$ thì tách thành hai phần bằng nhau, một phần dừng lại. Tốc độ của phần còn lại bằng","options": ["A. $2v$ cùng hướng ban đầu.","B. $v$.","C. $v/2$.","D. $0$."],"answer": "A","explain": "$mv = \\frac{m}{2}v_2$, $v_2 = 2v$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Trong va chạm, nội lực rất lớn nên có thể bỏ qua ngoại lực.","b) Động lượng là đại lượng vectơ nên khi áp dụng định luật phải chú ý chiều.","c) Hệ vật trượt có ma sát là hệ kín.","d) Khi đạn nổ, động năng của hệ các mảnh tăng lên."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: có ngoại lực ma sát. d) Đúng: thuốc nổ cung cấp năng lượng.","points": 1},{"type": "truefalse","level": "VD","q": "Một thuyền $200\\ \\text{kg}$ đang đứng yên trên mặt nước thì người $50\\ \\text{kg}$ trên thuyền nhảy khỏi thuyền với tốc độ $4\\ \\text{m/s}$ (so với nước, bỏ qua sức cản nước). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng của hệ trước khi nhảy bằng 0.","b) Tốc độ giật lùi của thuyền bằng $1\\ \\text{m/s}$.","c) Nếu người nhảy với tốc độ gấp đôi thì thuyền giật lùi nhanh gấp đôi.","d) Động lượng của người và thuyền sau khi nhảy cùng hướng."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng: $50 \\cdot 4 = 200V$, $V = 1\\ \\text{m/s}$. c) Đúng: $V$ tỉ lệ với $v_{người}$. d) Sai: ngược hướng nhau.","points": 1},{"type": "short","level": "VDC","q": "Một toa xe $2500\\ \\text{kg}$ đang chạy với tốc độ $6\\ \\text{m/s}$ đến va chạm mềm với toa xe $1500\\ \\text{kg}$ đang chạy cùng chiều với tốc độ $2\\ \\text{m/s}$. Tốc độ của hệ sau va chạm bằng bao nhiêu m/s? (chỉ điền số)","answer": "4.5","explain": "$V = (2500 \\cdot 6 + 1500 \\cdot 2)/4000 = 18000/4000 = 4,5\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật $4\\ \\text{kg}$ đang đứng yên thì nổ thành ba mảnh: mảnh 1 ($1\\ \\text{kg}$) bay với tốc độ $12\\ \\text{m/s}$ theo hướng đông, mảnh 2 ($1\\ \\text{kg}$) bay với tốc độ $12\\ \\text{m/s}$ theo hướng tây. Tốc độ của mảnh 3 ($2\\ \\text{kg}$) bằng bao nhiêu m/s? (chỉ điền số)","answer": "0","explain": "Động lượng hai mảnh 1, 2 triệt tiêu nhau ($12$ đông và $12$ tây), nên mảnh 3 đứng yên.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Hệ nào sau đây được coi là hệ kín?","options": ["A. Hệ hai viên bi va chạm trên mặt ngang không ma sát trong thời gian ngắn.","B. Hệ vật trượt có ma sát lớn.","C. Hệ ô tô đang phanh gấp.","D. Hệ vật rơi có sức cản không khí lớn."],"answer": "A","explain": "Không có (hoặc bỏ qua được) ngoại lực.","points": 0.25},{"type": "mcq","level": "NB","q": "Định luật bảo toàn động lượng là hệ quả của","options": ["A. định luật 3 Newton cho hệ kín.","B. định luật bảo toàn năng lượng.","C. định luật 1 Newton.","D. định luật vạn vật hấp dẫn."],"answer": "A","explain": "Các vật trong hệ tương tác theo cặp lực trực đối, tổng nội lực bằng 0.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi áp dụng định luật bảo toàn động lượng, cần","options": ["A. chọn chiều dương và ghi dấu cho các vectơ.","B. chỉ tính độ lớn, bỏ qua hướng.","C. đổi tất cả về đơn vị jun.","D. bỏ qua khối lượng các vật."],"answer": "A","explain": "Động lượng là vectơ.","points": 0.25},{"type": "mcq","level": "TH","q": "Một xe tải $5000\\ \\text{kg}$ đang chạy $10\\ \\text{m/s}$ thì va chạm mềm với xe con $1000\\ \\text{kg}$ đang đứng yên. Tốc độ của hệ sau va chạm bằng","options": ["A. $\\frac{25}{3}\\ \\text{m/s} \\approx 8,33\\ \\text{m/s}$.","B. $10\\ \\text{m/s}$.","C. $5\\ \\text{m/s}$.","D. $60\\ \\text{m/s}$."],"answer": "A","explain": "$V = (5000 \\cdot 10)/6000 \\approx 8,33\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một quả lựu đạn $1\\ \\text{kg}$ đang bay với tốc độ $20\\ \\text{m/s}$ thì nổ thành hai mảnh bằng nhau, một mảnh bay tiếp với tốc độ $30\\ \\text{m/s}$ cùng hướng. Tốc độ của mảnh còn lại bằng","options": ["A. $10\\ \\text{m/s}$ cùng hướng ban đầu.","B. $30\\ \\text{m/s}$ ngược hướng.","C. $20\\ \\text{m/s}$.","D. $50\\ \\text{m/s}$."],"answer": "A","explain": "$1 \\cdot 20 = 0,5 \\cdot 30 + 0,5v_2$, $v_2 = 10\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vận động viên $70\\ \\text{kg}$ chạy với tốc độ $8\\ \\text{m/s}$ nhảy lên xe $230\\ \\text{kg}$ đang chuyển động cùng chiều với tốc độ $2\\ \\text{m/s}$ (bỏ qua ma sát). Tốc độ của hệ sau đó bằng","options": ["A. $3,4\\ \\text{m/s}$.","B. $8\\ \\text{m/s}$.","C. $10\\ \\text{m/s}$.","D. $2\\ \\text{m/s}$."],"answer": "A","explain": "$V = (70 \\cdot 8 + 230 \\cdot 2)/300 = 1020/300 = 3,4\\ \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tổng động lượng của hệ kín không đổi theo thời gian.","b) Va chạm mềm: hai vật dính vào nhau sau va chạm.","c) Trong va chạm đàn hồi, cả động lượng và động năng đều bảo toàn.","d) Động lượng của từng vật trong hệ kín luôn không đổi."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng: va chạm đàn hồi bảo toàn cả hai. d) Sai: từng vật có thể thay đổi, chỉ tổng không đổi.","points": 1},{"type": "truefalse","level": "VD","q": "Một khẩu súng $3\\ \\text{kg}$ bắn liên tiếp hai viên đạn, mỗi viên $15\\ \\text{g}$, với tốc độ $400\\ \\text{m/s}$ (so với đất, cùng hướng). Bỏ qua ma sát. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Sau phát bắn thứ nhất, tốc độ giật lùi của súng là $2\\ \\text{m/s}$.","b) Sau phát bắn thứ hai, tốc độ giật lùi tăng thêm $2\\ \\text{m/s}$ (xấp xỉ, bỏ qua khối lượng đạn đã bắn).","c) Động lượng của hệ súng + đạn được bảo toàn.","d) Nếu bắn ngược hướng thì súng giật lùi theo hướng đạn bay."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $3V = 0,015 \\cdot 400 = 6$, $V = 2\\ \\text{m/s}$. b) Đúng (xấp xỉ). c) Đúng: hệ kín theo phương ngang. d) Sai: súng giật lùi NGƯỢC hướng đạn.","points": 1},{"type": "short","level": "VDC","q": "Hai viên bi $m_1 = 0,5\\ \\text{kg}$, $m_2 = 1,5\\ \\text{kg}$ chuyển động ngược chiều với tốc độ $v_1 = 6\\ \\text{m/s}$, $v_2 = 2\\ \\text{m/s}$ rồi va chạm mềm. Tốc độ của hệ sau va chạm bằng bao nhiêu m/s? (chỉ điền số, lấy chiều dương là chiều của bi 1, điền giá trị tuyệt đối)","answer": "0","explain": "$p = 0,5 \\cdot 6 - 1,5 \\cdot 2 = 0$, hệ dừng lại.","points": 0.5},{"type": "short","level": "VDC","q": "Một tên lửa $500\\ \\text{kg}$ đang đứng yên phụt ra $25\\ \\text{kg}$ khí với tốc độ $1200\\ \\text{m/s}$ (so với đất). Bỏ qua trọng lực trong thời gian phụt ngắn. Tốc độ của tên lửa sau khi phụt bằng bao nhiêu m/s? (chỉ điền số, làm tròn đến 1 chữ số thập phân)","answer": "63.2","explain": "$25 \\cdot 1200 = 475V$, $V = 30000/475 \\approx 63,16\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Phát biểu nào sau đây đúng?","options": ["A. Động lượng của hệ kín được bảo toàn.","B. Động lượng của hệ mở được bảo toàn.","C. Động năng của hệ kín luôn bảo toàn.","D. Mọi va chạm đều bảo toàn động năng."],"answer": "A","explain": "Chỉ hệ kín mới bảo toàn động lượng.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật tách thành hai phần chuyển động ngược chiều nhau. Nhận xét nào đúng về động lượng?","options": ["A. Tổng động lượng của hai phần bằng động lượng ban đầu của vật.","B. Mỗi phần có động lượng bằng ban đầu.","C. Tổng động lượng bằng 0.","D. Động lượng không liên quan."],"answer": "A","explain": "Định luật bảo toàn động lượng.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong va chạm mềm,","options": ["A. một phần động năng chuyển thành dạng năng lượng khác.","B. động năng tăng lên.","C. động lượng tăng lên.","D. khối lượng hệ giảm."],"answer": "A","explain": "Va chạm mềm không bảo toàn động năng.","points": 0.25},{"type": "mcq","level": "TH","q": "Một toa tàu $8000\\ \\text{kg}$ đang chạy $5\\ \\text{m/s}$ đến va chạm mềm với toa $4000\\ \\text{kg}$ đang chạy ngược chiều $3\\ \\text{m/s}$. Tốc độ của hệ sau va chạm bằng (chọn chiều dương là chiều toa 1)","options": ["A. $\\frac{7}{3}\\ \\text{m/s} \\approx 2,33\\ \\text{m/s}$.","B. $8\\ \\text{m/s}$.","C. $2\\ \\text{m/s}$.","D. $0,67\\ \\text{m/s}$."],"answer": "A","explain": "$V = (8000 \\cdot 5 - 4000 \\cdot 3)/12000 = 28000/12000 \\approx 2,33\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người $65\\ \\text{kg}$ nhảy khỏi xuồng $135\\ \\text{kg}$ đang đứng yên với tốc độ $3\\ \\text{m/s}$ (so với nước). Bỏ qua sức cản. Tốc độ của xuồng bằng","options": ["A. $1,44\\ \\text{m/s}$ ngược hướng người nhảy.","B. $3\\ \\text{m/s}$.","C. $6,23\\ \\text{m/s}$.","D. $0,69\\ \\text{m/s}$."],"answer": "A","explain": "$65 \\cdot 3 = 135V$, $V \\approx 1,44\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một viên bi $0,4\\ \\text{kg}$ chuyển động với tốc độ $6\\ \\text{m/s}$ đến va chạm mềm với viên bi $0,6\\ \\text{kg}$ đang đứng yên. Phần trăm động năng bị mất sau va chạm bằng","options": ["A. $60\\%$.","B. $40\\%$.","C. $100\\%$.","D. $0\\%$."],"answer": "A","explain": "$W_{đ1} = 7,2\\ \\text{J}$; $V = 2,4\\ \\text{m/s}$; $W_{đ2} = 2,88\\ \\text{J}$. Mất $4,32\\ \\text{J}$ tức $60\\%$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khi hệ kín, tổng các nội lực bằng 0.","b) Định luật bảo toàn động lượng là định luật vectơ.","c) Va chạm mềm không bảo toàn động lượng.","d) Pháo thăng thiên nổ trên không tuân theo định luật bảo toàn động lượng (gần đúng)."],"answer": ["T","T","F","T"],"explain": "a) Đúng: nội lực từng cặp trực đối. b) Đúng. c) Sai: va chạm mềm VẪN bảo toàn động lượng (chỉ mất động năng). d) Đúng: thời gian nổ ngắn.","points": 1},{"type": "truefalse","level": "VD","q": "Một xe cát $3000\\ \\text{kg}$ đang chạy với tốc độ $4\\ \\text{m/s}$ thì $200\\ \\text{kg}$ cát bị rò rỉ rơi thẳng đứng xuống đường (bỏ qua ma sát). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng của hệ theo phương ngang được bảo toàn.","b) Tốc độ của xe sau khi cát rơi vẫn là $4\\ \\text{m/s}$.","c) Cát rơi thẳng đứng không mang theo động lượng ngang.","d) Nếu cát bắn ra phía sau thì tốc độ xe tăng."],"answer": ["T","T","T","T"],"explain": "a) Đúng. b) Đúng: $3000 \\cdot 4 = 2800V + 200 \\cdot 4$ (cát vẫn giữ tốc độ ngang $4\\ \\text{m/s}$), suy ra $V = 4\\ \\text{m/s}$. c) Đúng: cát rơi thẳng đứng, tốc độ ngang không đổi. d) Đúng: phản lực đẩy xe tiến lên.","points": 1},{"type": "short","level": "VDC","q": "Một vật $2\\ \\text{kg}$ đang đứng yên thì nổ thành hai mảnh: mảnh 1 bay với tốc độ $15\\ \\text{m/s}$. Biết mảnh 1 có khối lượng $0,5\\ \\text{kg}$. Tốc độ của mảnh 2 bằng bao nhiêu m/s? (chỉ điền số)","answer": "5","explain": "$0,5 \\cdot 15 = 1,5v_2$, $v_2 = 5\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một quả bóng $0,6\\ \\text{kg}$ đang bay với tốc độ $8\\ \\text{m/s}$ đến va chạm đàn hồi xuyên tâm với quả bóng $0,4\\ \\text{kg}$ đang đứng yên. Tốc độ của quả bóng thứ nhất sau va chạm bằng bao nhiêu m/s? (chỉ điền số)","answer": "1.6","explain": "Va chạm đàn hồi xuyên tâm: $v_1' = \\frac{m_1 - m_2}{m_1 + m_2}v_1 = \\frac{0,2}{1,0} \\cdot 8 = 1,6\\ \\text{m/s}$ cùng hướng ban đầu.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Điều kiện để áp dụng định luật bảo toàn động lượng là","options": ["A. hệ kín hoặc ngoại lực không đáng kể so với nội lực.","B. hệ phải đứng yên.","C. các vật phải có khối lượng bằng nhau.","D. không có va chạm xảy ra."],"answer": "A","explain": "Hệ kín hoặc gần đúng hệ kín (va chạm, nổ).","points": 0.25},{"type": "mcq","level": "NB","q": "Một người đang đứng yên trên sân băng ném quả bóng về phía trước. Người đó sẽ","options": ["A. trượt về phía sau.","B. trượt về phía trước.","C. đứng yên.","D. quay tròn."],"answer": "A","explain": "Phản lực: động lượng tổng bằng 0.","points": 0.25},{"type": "mcq","level": "NB","q": "Tên lửa chuyển động được là nhờ","options": ["A. khí phụt ra phía sau đẩy tên lửa về phía trước.","B. lực đẩy của không khí.","C. lực hấp dẫn của Trái Đất.","D. cánh quạt."],"answer": "A","explain": "Chuyển động bằng phản lực.","points": 0.25},{"type": "mcq","level": "TH","q": "Một xe $1200\\ \\text{kg}$ đang chạy $15\\ \\text{m/s}$ thì hãm phanh va chạm mềm với xe $800\\ \\text{kg}$ đang đứng yên (va chạm trong thời gian ngắn, bỏ qua lực hãm). Tốc độ của hệ sau va chạm bằng","options": ["A. $9\\ \\text{m/s}$.","B. $15\\ \\text{m/s}$.","C. $6\\ \\text{m/s}$.","D. $24\\ \\text{m/s}$."],"answer": "A","explain": "$V = (1200 \\cdot 15)/2000 = 9\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một viên đạn $10\\ \\text{g}$ bay với tốc độ $500\\ \\text{m/s}$ xuyên vào bao cát $4,99\\ \\text{kg}$ đang treo và nằm yên trong đó. Tốc độ của hệ bao cát + đạn ngay sau đó bằng","options": ["A. $1\\ \\text{m/s}$.","B. $500\\ \\text{m/s}$.","C. $2\\ \\text{m/s}$.","D. $0,5\\ \\text{m/s}$."],"answer": "A","explain": "$V = (0,01 \\cdot 500)/5 = 1\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Hai vật giống hệt nhau ($m$), vật 1 chuyển động với tốc độ $v$, vật 2 đứng yên, va chạm mềm. Tốc độ của hệ sau va chạm bằng","options": ["A. $v/2$.","B. $v$.","C. $2v$.","D. $0$."],"answer": "A","explain": "$mv = 2mV$, $V = v/2$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng có thể âm tùy theo cách chọn chiều dương.","b) Tổng động lượng của hệ kín luôn không đổi.","c) Va chạm mềm bảo toàn động lượng nhưng không bảo toàn động năng.","d) Khi tên lửa phụt khí, động lượng của tên lửa tăng."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $p = mv$ có dấu theo $v$. b) Đúng. c) Đúng. d) Đúng: khí mang động lượng ngược chiều, tên lửa nhận động lượng cùng chiều bay.","points": 1},{"type": "truefalse","level": "VD","q": "Một quả cầu $1\\ \\text{kg}$ chuyển động với tốc độ $10\\ \\text{m/s}$ đến va chạm mềm với quả cầu $3\\ \\text{kg}$ đang chuyển động ngược chiều với tốc độ $2\\ \\text{m/s}$. Xét tính đúng, sai của các khẳng định sau (chọn chiều dương là chiều quả cầu 1):","statements": ["a) Tổng động lượng trước va chạm bằng $4\\ \\text{kg} \\cdot \\text{m/s}$.","b) Tốc độ của hệ sau va chạm bằng $1\\ \\text{m/s}$ cùng chiều quả cầu 1.","c) Động năng trước va chạm bằng $56\\ \\text{J}$.","d) Sau va chạm mềm, động năng của hệ tăng."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $1 \\cdot 10 - 3 \\cdot 2 = 4$. b) Đúng: $V = 4/4 = 1\\ \\text{m/s}$. c) Đúng: $50 + 6 = 56\\ \\text{J}$. d) Sai: động năng giảm.","points": 1},{"type": "short","level": "VDC","q": "Một người $55\\ \\text{kg}$ đang chạy với tốc độ $5\\ \\text{m/s}$ nhảy lên xe $245\\ \\text{kg}$ đang đứng yên (bỏ qua ma sát). Động năng của hệ sau đó bằng bao nhiêu jun? (chỉ điền số, làm tròn đến 2 chữ số thập phân)","answer": "126.04","explain": "$V = (55 \\cdot 5)/300 \\approx 0,9167\\ \\text{m/s}$. $W_đ = \\frac{1}{2} \\cdot 300 \\cdot (11/12)^2 \\approx 126,04\\ \\text{J}$... ","points": 0.5},{"type": "short","level": "VDC","q": "Một khẩu đại bác $2000\\ \\text{kg}$ bắn viên đạn $40\\ \\text{kg}$ với tốc độ $250\\ \\text{m/s}$ theo phương ngang. Bỏ qua ma sát. Tốc độ giật lùi của đại bác bằng bao nhiêu m/s? (chỉ điền số)","answer": "5","explain": "$2000V = 40 \\cdot 250 = 10000$, $V = 5\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "NB","q": "Hệ kín là hệ mà","options": ["A. các vật chỉ tương tác với nhau, tổng ngoại lực bằng 0.","B. không có vật nào.","C. các vật chuyển động tròn đều.","D. tổng nội lực khác 0."],"answer": "A","explain": "Định nghĩa.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi bắn súng, súng giật lùi vì","options": ["A. đạn bay về phía trước nên súng phải chuyển động ngược lại để tổng động lượng bằng 0.","B. thuốc súng đẩy súng.","C. người bắn đẩy súng.","D. đạn quá nặng."],"answer": "A","explain": "Bảo toàn động lượng của hệ súng + đạn.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong các đại lượng sau, đại lượng nào KHÔNG bảo toàn trong va chạm mềm của hệ kín?","options": ["A. Động năng.","B. Động lượng.","C. Khối lượng.","D. Tổng các lực."],"answer": "A","explain": "Động năng giảm.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $5\\ \\text{kg}$ đang đứng yên thì nổ thành hai mảnh $2\\ \\text{kg}$ và $3\\ \\text{kg}$ bay ngược chiều nhau. Nếu mảnh $2\\ \\text{kg}$ bay với tốc độ $9\\ \\text{m/s}$ thì tốc độ của mảnh $3\\ \\text{kg}$ bằng","options": ["A. $6\\ \\text{m/s}$.","B. $9\\ \\text{m/s}$.","C. $13,5\\ \\text{m/s}$.","D. $4\\ \\text{m/s}$."],"answer": "A","explain": "$2 \\cdot 9 = 3v$, $v = 6\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một toa xe $6000\\ \\text{kg}$ đang chạy $8\\ \\text{m/s}$ đến va chạm mềm với toa xe $2000\\ \\text{kg}$ đang chạy cùng chiều $2\\ \\text{m/s}$. Tốc độ của hệ sau va chạm bằng","options": ["A. $6,5\\ \\text{m/s}$.","B. $8\\ \\text{m/s}$.","C. $10\\ \\text{m/s}$.","D. $5\\ \\text{m/s}$."],"answer": "A","explain": "$V = (6000 \\cdot 8 + 2000 \\cdot 2)/8000 = 52000/8000 = 6,5\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một tên lửa $1000\\ \\text{kg}$ đang bay với tốc độ $200\\ \\text{m/s}$ thì phụt ra $50\\ \\text{kg}$ khí với tốc độ $600\\ \\text{m/s}$ ngược chiều (so với đất). Tốc độ của tên lửa sau khi phụt bằng","options": ["A. $242,1\\ \\text{m/s}$.","B. $200\\ \\text{m/s}$.","C. $180\\ \\text{m/s}$.","D. $210\\ \\text{m/s}$."],"answer": "A","explain": "$1000 \\cdot 200 = 50 \\cdot (-600) + 950V$, $950V = 230000$, $V \\approx 242,1\\ \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Hệ vật va chạm trong thời gian rất ngắn được coi gần đúng là hệ kín.","b) Động lượng của hệ kín bảo toàn cả về độ lớn và hướng.","c) Động năng của hệ kín luôn bảo toàn.","d) Người nhảy khỏi thuyền làm thuyền chuyển động ngược lại."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng: bảo toàn vectơ. c) Sai: chỉ động lượng. d) Đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Một viên bi $0,3\\ \\text{kg}$ chuyển động với tốc độ $4\\ \\text{m/s}$ đến va chạm mềm với viên bi $0,2\\ \\text{kg}$ đang đứng yên. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tổng động lượng trước va chạm bằng $1,2\\ \\text{kg} \\cdot \\text{m/s}$.","b) Tốc độ của hệ sau va chạm bằng $2,4\\ \\text{m/s}$.","c) Động năng trước va chạm bằng $2,4\\ \\text{J}$.","d) Động năng sau va chạm bằng $1,44\\ \\text{J}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $0,3 \\cdot 4 = 1,2$. b) Đúng: $V = 1,2/0,5 = 2,4\\ \\text{m/s}$. c) Đúng: $\\frac{1}{2} \\cdot 0,3 \\cdot 16 = 2,4\\ \\text{J}$. d) Đúng: $\\frac{1}{2} \\cdot 0,5 \\cdot 5,76 = 1,44\\ \\text{J}$.","points": 1},{"type": "short","level": "VDC","q": "Một khẩu súng $4\\ \\text{kg}$ bắn viên đạn $20\\ \\text{g}$ với tốc độ $600\\ \\text{m/s}$. Bỏ qua ma sát. Động năng của súng ngay sau khi bắn bằng bao nhiêu jun? (chỉ điền số)","answer": "18","explain": "$4V = 0,02 \\cdot 600 = 12$, $V = 3\\ \\text{m/s}$. $W_đ = \\frac{1}{2} \\cdot 4 \\cdot 9 = 18\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $m$ đang chuyển động với tốc độ $v$ thì nổ thành hai mảnh có khối lượng bằng nhau bay theo hai hướng vuông góc nhau, mỗi mảnh có tốc độ $v$. Động lượng ban đầu của vật có độ lớn bằng bao nhiêu lần $mv$? (chỉ điền số, dạng thập phân)","answer": "0.71","explain": "Mỗi mảnh có $p_1 = p_2 = \\frac{m}{2}v$. Hai vectơ vuông góc nhau nên $p = \\sqrt{p_1^2 + p_2^2} = \\frac{\\sqrt{2}}{2}mv \\approx 0,71mv$.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Một hệ gồm các vật chuyển động trên mặt ngang không ma sát, các vật va chạm với nhau trong thời gian ngắn. Hệ này được coi là","options": ["A. hệ kín (gần đúng).","B. hệ mở.","C. hệ không có nội lực.","D. hệ có tổng động lượng bằng 0."],"answer": "A","explain": "Ngoại lực không đáng kể trong thời gian va chạm ngắn.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi một vận động viên trượt băng ném quả tạ về phía trước, vận động viên sẽ","options": ["A. trượt lùi về phía sau.","B. trượt nhanh về phía trước.","C. đứng yên tại chỗ.","D. ngã xuống."],"answer": "A","explain": "Bảo toàn động lượng: tổng động lượng hệ ban đầu bằng 0.","points": 0.25},{"type": "mcq","level": "TH","q": "Trong va chạm mềm của hệ kín, phát biểu nào sai?","options": ["A. Động năng của hệ được bảo toàn.","B. Động lượng của hệ được bảo toàn.","C. Hai vật dính vào nhau sau va chạm.","D. Một phần động năng chuyển thành nhiệt."],"answer": "A","explain": "Va chạm mềm không bảo toàn động năng.","points": 0.25},{"type": "mcq","level": "TH","q": "Một xe goòng $1000\\ \\text{kg}$ đang chạy với tốc độ $3\\ \\text{m/s}$ thì một kiện hàng $200\\ \\text{kg}$ được đặt nhẹ nhàng xuống xe (tốc độ ban đầu của kiện hàng bằng 0, bỏ qua ma sát). Tốc độ của xe sau đó bằng","options": ["A. $2,5\\ \\text{m/s}$.","B. $3\\ \\text{m/s}$.","C. $3,6\\ \\text{m/s}$.","D. $15\\ \\text{m/s}$."],"answer": "A","explain": "$V = (1000 \\cdot 3)/1200 = 2,5\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một quả bóng $0,5\\ \\text{kg}$ đang lăn với tốc độ $4\\ \\text{m/s}$ thì va chạm mềm với quả bóng $1,5\\ \\text{kg}$ đang lăn ngược chiều với tốc độ $2\\ \\text{m/s}$. Tốc độ của hệ sau va chạm bằng (chọn chiều dương là chiều bóng 1)","options": ["A. $0,5\\ \\text{m/s}$ ngược chiều bóng 1.","B. $3\\ \\text{m/s}$.","C. $1\\ \\text{m/s}$.","D. $6\\ \\text{m/s}$."],"answer": "A","explain": "$V = (0,5 \\cdot 4 - 1,5 \\cdot 2)/2 = -0,5\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một người $50\\ \\text{kg}$ đứng trên xe $150\\ \\text{kg}$ đang đứng yên, rồi nhảy xuống đất với tốc độ $6\\ \\text{m/s}$ (so với đất). Bỏ qua ma sát. Tốc độ của xe sau khi người nhảy bằng","options": ["A. $2\\ \\text{m/s}$ ngược hướng người nhảy.","B. $6\\ \\text{m/s}$.","C. $1,5\\ \\text{m/s}$.","D. $8\\ \\text{m/s}$."],"answer": "A","explain": "$50 \\cdot 6 = 150V$, $V = 2\\ \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Hệ kín: tổng ngoại lực tác dụng lên hệ bằng 0.","b) Định luật bảo toàn động lượng áp dụng được cho cả va chạm đàn hồi và va chạm mềm.","c) Khi đạn nổ, động lượng của hệ các mảnh ngay sau khi nổ bằng động lượng của đạn ngay trước khi nổ.","d) Chuyển động bằng phản lực vi phạm định luật 3 Newton."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng: mọi va chạm của hệ kín đều bảo toàn động lượng. c) Đúng (gần đúng). d) Sai: phản lực chính là biểu hiện của định luật 3 Newton.","points": 1},{"type": "truefalse","level": "VDC","q": "Một viên bi thép $0,2\\ \\text{kg}$ chuyển động với tốc độ $5\\ \\text{m/s}$ đến va chạm mềm với viên bi đất sét $0,3\\ \\text{kg}$ đang đứng yên. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tốc độ của hệ sau va chạm bằng $2\\ \\text{m/s}$.","b) Động năng trước va chạm bằng $2,5\\ \\text{J}$.","c) Động năng sau va chạm bằng $1\\ \\text{J}$.","d) Phần động năng bị mất chuyển thành nhiệt và công biến dạng."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $V = (0,2 \\cdot 5)/0,5 = 2\\ \\text{m/s}$. b) Đúng: $\\frac{1}{2} \\cdot 0,2 \\cdot 25 = 2,5\\ \\text{J}$. c) Đúng: $\\frac{1}{2} \\cdot 0,5 \\cdot 4 = 1\\ \\text{J}$. d) Đúng.","points": 1},{"type": "short","level": "VDC","q": "Một toa xe $3500\\ \\text{kg}$ đang chạy với tốc độ $7\\ \\text{m/s}$ đến va chạm mềm với toa xe $1500\\ \\text{kg}$ đang đứng yên. Động năng bị mất sau va chạm bằng bao nhiêu jun? (chỉ điền số)","answer": "25725","explain": "$V = (3500 \\cdot 7)/5000 = 4,9\\ \\text{m/s}$. $W_{đ1} = 85750\\ \\text{J}$; $W_{đ2} = 60025\\ \\text{J}$. Mất $25725\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một tên lửa có khối lượng $1200\\ \\text{kg}$ (kể cả nhiên liệu $300\\ \\text{kg}$) đang đứng yên trong không gian thì phụt hết nhiên liệu với tốc độ $1500\\ \\text{m/s}$ (so với tên lửa trước khi phụt). Tốc độ của tên lửa sau khi phụt bằng bao nhiêu m/s? (chỉ điền số, làm tròn đến hàng đơn vị)","answer": "500","explain": "$300 \\cdot 1500 = 900V$, $V = 500\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Định luật bảo toàn động lượng đúng khi","options": ["A. hệ là hệ kín.","B. hệ có ma sát.","C. các vật chuyển động nhanh.","D. va chạm là đàn hồi."],"answer": "A","explain": "Điều kiện hệ kín (hoặc gần đúng).","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật đang đứng yên vỡ thành hai mảnh. Hai mảnh sẽ bay","options": ["A. ngược hướng nhau.","B. cùng hướng nhau.","C. vuông góc nhau.","D. cùng tốc độ."],"answer": "A","explain": "Tổng động lượng bằng 0.","points": 0.25},{"type": "mcq","level": "TH","q": "Đại lượng nào sau đây là đại lượng vectơ?","options": ["A. Động lượng.","B. Động năng.","C. Khối lượng.","D. Tốc độ."],"answer": "A","explain": "$\\vec{p} = m\\vec{v}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $2\\ \\text{kg}$ đang chuyển động với tốc độ $10\\ \\text{m/s}$ đến va chạm mềm với vật $3\\ \\text{kg}$ đang chuyển động cùng chiều với tốc độ $5\\ \\text{m/s}$. Tốc độ của hệ sau va chạm bằng","options": ["A. $7\\ \\text{m/s}$.","B. $15\\ \\text{m/s}$.","C. $5\\ \\text{m/s}$.","D. $2,5\\ \\text{m/s}$."],"answer": "A","explain": "$V = (2 \\cdot 10 + 3 \\cdot 5)/5 = 35/5 = 7\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một khẩu súng $5\\ \\text{kg}$ bắn viên đạn $10\\ \\text{g}$ với tốc độ $800\\ \\text{m/s}$. Bỏ qua ma sát. Tốc độ giật lùi của súng bằng","options": ["A. $1,6\\ \\text{m/s}$.","B. $800\\ \\text{m/s}$.","C. $16\\ \\text{m/s}$.","D. $0,16\\ \\text{m/s}$."],"answer": "A","explain": "$5V = 0,01 \\cdot 800 = 8$, $V = 1,6\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một xe $2000\\ \\text{kg}$ đang chạy $12\\ \\text{m/s}$ đến va chạm mềm với xe $3000\\ \\text{kg}$ đang chạy ngược chiều $8\\ \\text{m/s}$. Tốc độ của hệ sau va chạm bằng (chọn chiều dương là chiều xe 1)","options": ["A. $0\\ \\text{m/s}$ (dừng lại).","B. $20\\ \\text{m/s}$.","C. $4\\ \\text{m/s}$.","D. $9,6\\ \\text{m/s}$."],"answer": "A","explain": "$p = 2000 \\cdot 12 - 3000 \\cdot 8 = 0$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Nội lực không làm thay đổi tổng động lượng của hệ.","b) Khi áp dụng định luật bảo toàn động lượng phải chọn chiều dương.","c) Va chạm mềm làm giảm động năng của hệ.","d) Súng càng nặng thì giật lùi càng nhanh (cùng loại đạn)."],"answer": ["T","T","T","F"],"explain": "a) Đúng: nội lực từng cặp trực đối. b) Đúng. c) Đúng. d) Sai: súng càng nặng giật lùi càng CHẬM ($V = mv/M$).","points": 1},{"type": "truefalse","level": "VDC","q": "Một người $60\\ \\text{kg}$ đang chạy với tốc độ $5\\ \\text{m/s}$ nhảy lên xe goòng $240\\ \\text{kg}$ đang chạy cùng chiều với tốc độ $1\\ \\text{m/s}$ (bỏ qua ma sát). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tổng động lượng trước khi nhảy bằng $540\\ \\text{kg} \\cdot \\text{m/s}$.","b) Tốc độ của hệ sau khi nhảy bằng $1,8\\ \\text{m/s}$.","c) Nếu xe đứng yên, tốc độ của hệ sau khi nhảy bằng $1\\ \\text{m/s}$.","d) Động năng của hệ sau khi nhảy nhỏ hơn tổng động năng ban đầu."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $60 \\cdot 5 + 240 \\cdot 1 = 540$. b) Đúng: $V = 540/300 = 1,8\\ \\text{m/s}$. c) Đúng: $V = 300/300 = 1\\ \\text{m/s}$. d) Đúng: va chạm mềm mất động năng.","points": 1},{"type": "short","level": "VDC","q": "Một viên đạn $25\\ \\text{g}$ đang bay với tốc độ $400\\ \\text{m/s}$ thì nổ thành hai mảnh bằng nhau, một mảnh bay tiếp với tốc độ $600\\ \\text{m/s}$ cùng hướng. Tốc độ của mảnh còn lại bằng bao nhiêu m/s? (chỉ điền số)","answer": "200","explain": "$0,025 \\cdot 400 = 0,0125 \\cdot 600 + 0,0125v_2$, $v_2 = (10 - 7,5)/0,0125 = 200\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Hai xe lăn $m_1 = 1\\ \\text{kg}$, $m_2 = 2\\ \\text{kg}$ ban đầu đứng yên trên mặt ngang không ma sát, giữa chúng có lò xo nén. Khi thả lò xo, xe 1 đạt tốc độ $6\\ \\text{m/s}$. Tổng động năng của hệ sau khi lò xo bung hết bằng bao nhiêu jun? (chỉ điền số)","answer": "27","explain": "$1 \\cdot 6 = 2v_2$, $v_2 = 3\\ \\text{m/s}$. $W_đ = \\frac{1}{2} \\cdot 1 \\cdot 36 + \\frac{1}{2} \\cdot 2 \\cdot 9 = 18 + 9 = 27\\ \\text{J}$.","points": 0.5}]}]}
