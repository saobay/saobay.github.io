ain": "$\\Delta p = 0 - 20000 = -20000$. $F = \\Delta p/\\Delta t = -20000/4 = -5000\\ \\text{N}$, độ lớn $5000\\ \\text{N}$.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Động lượng của vật càng lớn khi","options": ["A. khối lượng và tốc độ càng lớn.","B. khối lượng càng nhỏ.","C. tốc độ càng nhỏ.","D. vật ở càng cao."],"answer": "A","explain": "$p = mv$: $p$ tỉ lệ với cả $m$ và $v$.","points": 0.25},{"type": "mcq","level": "NB","q": "Một hệ gồm hai vật có động lượng $\\\\vec{p}_1$ và $\\\\vec{p}_2$. Động lượng của hệ bằng","options": ["A. $\\\\vec{p}_1 + \\\\vec{p}_2$.","B. $p_1 + p_2$ (cộng độ lớn).","C. $|p_1 - p_2|$.","D. $p_1 \\\\cdot p_2$."],"answer": "A","explain": "Động lượng của hệ bằng tổng vectơ động lượng các vật.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi vật chuyển động chậm dần, động lượng của vật","options": ["A. giảm dần.","B. tăng dần.","C. không đổi.","D. bằng 0."],"answer": "A","explain": "Tốc độ giảm nên $p = mv$ giảm.","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị $\\\\text{N} \\\\cdot \\\\text{s}$ là đơn vị của","options": ["A. xung lượng của lực (cũng là đơn vị động lượng).","B. công.","C. công suất.","D. năng lượng."],"answer": "A","explain": "$\\\\text{N} \\\\cdot \\\\text{s} = \\\\text{kg} \\\\cdot \\\\text{m/s}$: đơn vị xung lượng và động lượng.","points": 0.25},{"type": "mcq","level": "TH","q": "Một viên đạn khối lượng $20\\\\ \\\\text{g}$ bay với tốc độ $400\\\\ \\\\text{m/s}$. Động lượng của viên đạn bằng","options": ["A. $8\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","B. $8000\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","C. $20\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","D. $0,05\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$."],"answer": "A","explain": "$p = 0,02 \\\\cdot 400 = 8\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Hai vật có khối lượng $m_1 = 2\\\\ \\\\text{kg}$, $m_2 = 3\\\\ \\\\text{kg}$, chuyển động với tốc độ $v_1 = 6\\\\ \\\\text{m/s}$, $v_2 = 4\\\\ \\\\text{m/s}$ cùng hướng. Tổng động lượng của hệ hai vật bằng","options": ["A. $24\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","B. $12\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","C. $0$.","D. $36\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$."],"answer": "A","explain": "$p_1 = 12$, $p_2 = 12$, cùng hướng nên $p = 24\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng tỉ lệ thuận với khối lượng khi tốc độ không đổi.","b) Động lượng tỉ lệ thuận với tốc độ khi khối lượng không đổi.","c) Hai vật có cùng khối lượng và tốc độ thì động lượng bằng nhau.","d) Động lượng của vật rơi tự do không đổi."],"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng. c) Sai: còn phụ thuộc HƯỚNG chuyển động. d) Sai: tốc độ tăng nên $p$ tăng.","points": 1},{"type": "truefalse","level": "VD","q": "Một cầu thủ đá quả bóng $0,45\\\\ \\\\text{kg}$ đang bay tới với tốc độ $12\\\\ \\\\text{m/s}$; sau cú đá, bóng bay ngược lại với tốc độ $18\\\\ \\\\text{m/s}$ (chọn chiều dương là chiều bóng bay tới). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng của bóng trước cú đá bằng $5,4\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","b) Động lượng của bóng sau cú đá bằng $-8,1\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","c) Độ biến thiên động lượng của bóng bằng $-13,5\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","d) Nếu thời gian chân chạm bóng là $0,05\\\\ \\\\text{s}$ thì lực trung bình tác dụng lên bóng là $270\\\\ \\\\text{N}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $0,45 \\\\cdot 12 = 5,4$. b) Đúng: $0,45 \\\\cdot (-18) = -8,1$. c) Đúng: $-8,1 - 5,4 = -13,5$. d) Đúng: $F = \\\\Delta p/\\\\Delta t = -13,5/0,05 = -270\\\\ \\\\text{N}$, độ lớn $270\\\\ \\\\text{N}$.","points": 1},{"type": "short","level": "VD","q": "Một xe tải khối lượng $4$ tấn đang chạy với tốc độ $54\\\\ \\\\text{km/h}$. Động lượng của xe bằng bao nhiêu $\\\\text{kg} \\\\cdot \\\\text{m/s}$? (chỉ điền số)","answer": "60000","explain": "$v = 15\\\\ \\\\text{m/s}$. $p = 4000 \\\\cdot 15 = 60000$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $0,5\\\\ \\\\text{kg}$ đang chuyển động với tốc độ $8\\\\ \\\\text{m/s}$ thì chịu lực cản $10\\\\ \\\\text{N}$ ngược chiều chuyển động. Sau bao lâu thì vật dừng lại? (đơn vị giây, chỉ điền số)","answer": "0.4","explain": "$\\\\Delta p = 0 - 4 = -4$. $\\\\Delta t = \\\\Delta p/F = -4/(-10) = 0,4\\\\ \\\\text{s}$.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "NB","q": "Biểu thức liên hệ giữa xung lượng của lực và độ biến thiên động lượng là","options": ["A. $\\\\vec{F}\\\\Delta t = \\\\Delta\\\\vec{p}$.","B. $\\\\vec{F}\\\\Delta t = \\\\Delta W_đ$.","C. $\\\\vec{F} = \\\\frac{\\\\Delta\\\\vec{p}}{\\\\Delta t^2}$.","D. $\\\\Delta\\\\vec{p} = m\\\\vec{a}$."],"answer": "A","explain": "Xung lượng của lực bằng độ biến thiên động lượng.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật đang chuyển động, nếu hợp lực tác dụng lên vật bằng 0 thì động lượng của vật","options": ["A. không đổi.","B. tăng dần.","C. giảm dần.","D. bằng 0."],"answer": "A","explain": "$\\\\vec{F} = 0$ nên $\\\\Delta\\\\vec{p} = 0$.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong va chạm, động lượng của mỗi vật riêng lẻ","options": ["A. có thể thay đổi do tương tác với vật khác.","B. luôn được bảo toàn.","C. luôn bằng 0.","D. không phụ thuộc khối lượng."],"answer": "A","explain": "Chỉ có động lượng của HỆ KÍN mới bảo toàn; từng vật có thể thay đổi.","points": 0.25},{"type": "mcq","level": "TH","q": "Một hòn bi khối lượng $100\\\\ \\\\text{g}$ chuyển động với tốc độ $5\\\\ \\\\text{m/s}$ tới đập vào tường rồi nảy ra với tốc độ $4\\\\ \\\\text{m/s}$ (theo phương vuông góc với tường). Độ lớn độ biến thiên động lượng của hòn bi bằng","options": ["A. $0,9\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","B. $0,1\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","C. $0,5\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","D. $0,4\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$."],"answer": "A","explain": "$|\\\\Delta p| = 0,1 \\\\cdot (5 + 4) = 0,9\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lực $F = 200\\\\ \\\\text{N}$ tác dụng lên vật trong $0,1\\\\ \\\\text{s}$. Xung lượng của lực bằng","options": ["A. $20\\\\ \\\\text{N} \\\\cdot \\\\text{s}$.","B. $2000\\\\ \\\\text{N} \\\\cdot \\\\text{s}$.","C. $2\\\\ \\\\text{N} \\\\cdot \\\\text{s}$.","D. $0,5\\\\ \\\\text{N} \\\\cdot \\\\text{s}$."],"answer": "A","explain": "$F\\\\Delta t = 200 \\\\cdot 0,1 = 20\\\\ \\\\text{N} \\\\cdot \\\\text{s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật có động lượng $12\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$, khối lượng $3\\\\ \\\\text{kg}$. Tốc độ của vật bằng","options": ["A. $4\\\\ \\\\text{m/s}$.","B. $36\\\\ \\\\text{m/s}$.","C. $15\\\\ \\\\text{m/s}$.","D. $9\\\\ \\\\text{m/s}$."],"answer": "A","explain": "$v = p/m = 12/3 = 4\\\\ \\\\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) $\\\\vec{p} = m\\\\vec{v}}$: động lượng cùng hướng vận tốc.","b) Xung lượng của lực càng lớn thì độ biến thiên động lượng càng lớn.","c) Vật có khối lượng lớn hơn luôn có động lượng lớn hơn.","d) Khi vật đổi hướng chuyển động, động lượng của vật thay đổi."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng: $\\\\Delta\\\\vec{p} = \\\\vec{F}\\\\Delta t$. c) Sai: còn phụ thuộc tốc độ. d) Đúng: $\\\\vec{p}$ đổi hướng.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $2\\\\ \\\\text{kg}$ đang đứng yên thì chịu lực $F = 10\\\\ \\\\text{N}$ không đổi trong $3\\\\ \\\\text{s}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Xung lượng của lực bằng $30\\\\ \\\\text{N} \\\\cdot \\\\text{s}$.","b) Động lượng của vật sau $3\\\\ \\\\text{s}$ bằng $30\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","c) Tốc độ của vật sau $3\\\\ \\\\text{s}$ bằng $15\\\\ \\\\text{m/s}$.","d) Gia tốc của vật bằng $3\\\\ \\\\text{m/s}^2$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $10 \\\\cdot 3 = 30$. b) Đúng: $p_2 = 0 + 30 = 30$. c) Đúng: $v = 30/2 = 15\\\\ \\\\text{m/s}$. d) Sai: $a = F/m = 5\\\\ \\\\text{m/s}^2$.","points": 1},{"type": "short","level": "VDC","q": "Một vật có khối lượng $1,5\\\\ \\\\text{kg}$, động lượng $9\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$. Tốc độ của vật bằng bao nhiêu m/s? (chỉ điền số)","answer": "6","explain": "$v = 9/1,5 = 6\\\\ \\\\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một quả bóng $0,6\\\\ \\\\text{kg}$ rơi từ độ cao $5\\\\ \\\\text{m}$ xuống đất rồi nảy lên độ cao $3,2\\\\ \\\\text{m}$ (lấy $g = 10\\\\ \\\\text{m/s}^2$). Độ lớn độ biến thiên động lượng của bóng trong va chạm với đất bằng bao nhiêu $\\\\text{kg} \\\\cdot \\\\text{m/s}$? (chỉ điền số)","answer": "10.8","explain": "$v_1 = \\\\sqrt{2 \\\\cdot 10 \\\\cdot 5} = 10\\\\ \\\\text{m/s}$ (hướng xuống); $v_2 = \\\\sqrt{2 \\\\cdot 10 \\\\cdot 3,2} = 8\\\\ \\\\text{m/s}$ (hướng lên). $|\\\\Delta p| = 0,6 \\\\cdot (10 + 8) = 10,8$.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Động lượng đặc trưng cho","options": ["A. khả năng truyền chuyển động của vật khi tương tác.","B. mức quán tính của vật.","C. khả năng sinh công của vật.","D. tốc độ tỏa nhiệt của vật."],"answer": "A","explain": "Vật có động lượng lớn thì khó dừng lại, khả năng truyền chuyển động lớn.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật có khối lượng $m$, tốc độ $v$. Động lượng của vật tăng gấp đôi khi","options": ["A. tốc độ tăng gấp đôi (khối lượng không đổi).","B. khối lượng giảm một nửa.","C. tốc độ giảm một nửa.","D. vật đổi hướng chuyển động."],"answer": "A","explain": "$p = mv$ tỉ lệ thuận với $v$.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong các trường hợp sau, trường hợp nào động lượng của vật thay đổi?","options": ["A. Vật chuyển động tròn đều.","B. Vật chuyển động thẳng đều.","C. Vật đứng yên.","D. Vật không chịu lực nào."],"answer": "A","explain": "Chuyển động tròn đều: hướng của $\\\\vec{p}$ thay đổi liên tục.","points": 0.25},{"type": "mcq","level": "TH","q": "Một xe con $900\\\\ \\\\text{kg}$ chạy $20\\\\ \\\\text{m/s}$ và một xe tải $3000\\\\ \\\\text{kg}$ chạy $6\\\\ \\\\text{m/s}$ cùng hướng. So sánh động lượng:","options": ["A. Bằng nhau ($18000\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$).","B. Xe con lớn hơn.","C. Xe tải lớn hơn.","D. Không so sánh được."],"answer": "A","explain": "$p_1 = 900 \\\\cdot 20 = 18000$; $p_2 = 3000 \\\\cdot 6 = 18000$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lực không đổi $F = 25\\\\ \\\\text{N}$ tác dụng lên vật $5\\\\ \\\\text{kg}$ đang đứng yên trong $4\\\\ \\\\text{s}$. Tốc độ của vật sau đó bằng","options": ["A. $20\\\\ \\\\text{m/s}$.","B. $5\\\\ \\\\text{m/s}$.","C. $100\\\\ \\\\text{m/s}$.","D. $4\\\\ \\\\text{m/s}$."],"answer": "A","explain": "$p_2 = 25 \\\\cdot 4 = 100$; $v = 100/5 = 20\\\\ \\\\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $4\\\\ \\\\text{kg}$ đang chuyển động với tốc độ $3\\\\ \\\\text{m/s}$ thì tăng tốc đến $7\\\\ \\\\text{m/s}$. Độ biến thiên động lượng bằng","options": ["A. $16\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","B. $12\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","C. $28\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","D. $40\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$."],"answer": "A","explain": "$\\\\Delta p = 4 \\\\cdot (7 - 3) = 16$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng của hệ hai vật bằng tổng vectơ động lượng mỗi vật.","b) Xung lượng của lực có đơn vị $\\\\text{N} \\\\cdot \\\\text{s}$.","c) Độ biến thiên động lượng có đơn vị jun.","d) Lực tác dụng càng lâu thì xung lượng càng lớn (lực không đổi)."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: đơn vị $\\\\text{kg} \\\\cdot \\\\text{m/s}$. d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Hai xe đồ chơi khối lượng $m_1 = 0,5\\\\ \\\\text{kg}$, $m_2 = 0,3\\\\ \\\\text{kg}$ chuyển động ngược chiều nhau với tốc độ $v_1 = 2\\\\ \\\\text{m/s}$, $v_2 = 4\\\\ \\\\text{m/s}$ (chọn chiều dương là chiều của xe 1). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng của xe 1 bằng $1\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","b) Động lượng của xe 2 bằng $-1,2\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","c) Tổng động lượng của hệ bằng $-0,2\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","d) Tổng động lượng của hệ bằng $2,2\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $0,5 \\\\cdot 2 = 1$. b) Đúng: $0,3 \\\\cdot (-4) = -1,2$. c) Đúng: $1 - 1,2 = -0,2$. d) Sai: cộng vectơ (có dấu) được $-0,2$.","points": 1},{"type": "short","level": "VDC","q": "Một vật khối lượng $2,5\\\\ \\\\text{kg}$ đang chuyển động với động lượng $15\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$. Tốc độ của vật bằng bao nhiêu m/s? (chỉ điền số)","answer": "6","explain": "$v = 15/2,5 = 6$.","points": 0.5},{"type": "short","level": "VDC","q": "Một quả bóng khối lượng $0,5\\\\ \\\\text{kg}$ đập vào tường với tốc độ $20\\\\ \\\\text{m/s}$ rồi nảy ra với tốc độ $15\\\\ \\\\text{m/s}$; thời gian va chạm $0,02\\\\ \\\\text{s}$. Độ lớn lực trung bình của tường tác dụng lên bóng bằng bao nhiêu niutơn? (chỉ điền số)","answer": "875","explain": "$|\\Delta p| = 0,5 \\\\cdot (20 + 15) = 17,5\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$. $F = 17,5/0,02 = 875\\\\ \\\\text{N}$.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Một vật đang chuyển động với động lượng $\\\\vec{p}$. Nếu tốc độ tăng gấp ba thì động lượng","options": ["A. tăng gấp ba.","B. tăng gấp chín.","C. không đổi.","D. giảm ba lần."],"answer": "A","explain": "$p$ tỉ lệ thuận với $v$.","points": 0.25},{"type": "mcq","level": "NB","q": "Xung lượng của trọng lực tác dụng lên vật rơi tự do trong thời gian $t$ bằng","options": ["A. $mg\\\\Delta t$ (hướng xuống).","B. $0$.","C. $mv$.","D. $mgh$."],"answer": "A","explain": "$\\\\vec{F} = m\\\\vec{g}$ không đổi nên xung lượng $= mg\\\\Delta t$.","points": 0.25},{"type": "mcq","level": "NB","q": "Động lượng của một vật không đổi khi","options": ["A. vật chuyển động thẳng đều.","B. vật chuyển động nhanh dần.","C. vật chuyển động tròn đều.","D. vật rơi tự do."],"answer": "A","explain": "Thẳng đều: cả độ lớn và hướng của $\\\\vec{v}}$ không đổi.","points": 0.25},{"type": "mcq","level": "TH","q": "Một quả tạ $5\\\\ \\\\text{kg}$ được ném với tốc độ $9\\\\ \\\\text{m/s}$. Động lượng của quả tạ bằng","options": ["A. $45\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","B. $14\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","C. $405\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","D. $1,8\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$."],"answer": "A","explain": "$p = 5 \\\\cdot 9 = 45$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $0,2\\\\ \\\\text{kg}$ đang bay với tốc độ $25\\\\ \\\\text{m/s}$ thì nổ thành hai mảnh. Mảnh 1 ($0,12\\\\ \\\\text{kg}$) bay tiếp với tốc độ $30\\\\ \\\\text{m/s}$ cùng hướng. Tốc độ của mảnh 2 (cùng phương) bằng","options": ["A. $17,5\\\\ \\\\text{m/s}$ cùng hướng ban đầu.","B. $30\\\\ \\\\text{m/s}$ ngược hướng.","C. $25\\\\ \\\\text{m/s}$ cùng hướng.","D. $0$."],"answer": "A","explain": "Bảo toàn động lượng: $0,2 \\\\cdot 25 = 0,12 \\\\cdot 30 + 0,08v_2$, suy ra $v_2 = (5 - 3,6)/0,08 = 17,5\\\\ \\\\text{m/s}$ cùng hướng ban đầu.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lực $F$ tác dụng lên vật $2\\\\ \\\\text{kg}$ đang đứng yên, sau $5\\\\ \\\\text{s}$ vật đạt tốc độ $10\\\\ \\\\text{m/s}$. Độ lớn lực $F$ bằng","options": ["A. $4\\\\ \\\\text{N}$.","B. $100\\\\ \\\\text{N}$.","C. $20\\\\ \\\\text{N}$.","D. $50\\\\ \\\\text{N}$."],"answer": "A","explain": "$\\\\Delta p = 20$; $F = 20/5 = 4\\\\ \\\\text{N}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khi vật tăng tốc, động lượng tăng.","b) Khi vật giảm tốc, động lượng giảm.","c) Khi vật đổi hướng mà giữ nguyên tốc độ, động lượng không đổi.","d) Động lượng của vật tỉ lệ với khối lượng."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: $\\\\vec{p}$ đổi hướng. d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Một toa xe khối lượng $2000\\\\ \\\\text{kg}$ đang chuyển động với tốc độ $4\\\\ \\\\text{m/s}$ thì chịu lực hãm $1000\\\\ \\\\text{N}$ ngược chiều chuyển động. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng ban đầu của toa xe bằng $8000\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","b) Sau $5\\\\ \\\\text{s}$, động lượng của toa xe bằng $3000\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","c) Sau $8\\\\ \\\\text{s}$, toa xe dừng lại.","d) Quãng đường toa xe đi được đến khi dừng là $16\\\\ \\\\text{m}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $2000 \\\\cdot 4 = 8000$. b) Đúng: $p = 8000 - 1000 \\\\cdot 5 = 3000$. c) Đúng: $t = 8000/1000 = 8\\\\ \\\\text{s}$. d) Đúng: $s = v_0t - \\\\frac{1}{2}at^2$ với $a = 0,5\\\\ \\\\text{m/s}^2$: $s = 32 - 16 = 16\\\\ \\\\text{m}$.","points": 1},{"type": "short","level": "VDC","q": "Một vật khối lượng $800\\\\ \\\\text{g}$ đang chuyển động với tốc độ $7,5\\\\ \\\\text{m/s}$. Động lượng của vật bằng bao nhiêu $\\\\text{kg} \\\\cdot \\\\text{m/s}$? (chỉ điền số)","answer": "6","explain": "$p = 0,8 \\\\cdot 7,5 = 6$.","points": 0.5},{"type": "short","level": "VDC","q": "Một chiếc xe khối lượng $1200\\\\ \\\\text{kg}$ đang đứng yên thì chịu lực phát động $3000\\\\ \\\\text{N}$ trong $6\\\\ \\\\text{s}$ (bỏ qua ma sát). Tốc độ của xe sau đó bằng bao nhiêu m/s? (chỉ điền số)","answer": "15","explain": "$p_2 = 3000 \\\\cdot 6 = 18000$; $v = 18000/1200 = 15\\\\ \\\\text{m/s}$.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Phát biểu nào sau đây là SAI?","options": ["A. Động lượng là đại lượng vô hướng.","B. Động lượng có đơn vị $\\\\text{kg} \\\\cdot \\\\text{m/s}$.","C. Vectơ động lượng cùng hướng vận tốc.","D. $\\\\vec{p} = m\\\\vec{v}}$."],"answer": "A","explain": "Động lượng là vectơ.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật có động lượng $p$, khối lượng $m$. Tốc độ của vật là","options": ["A. $v = \\\\frac{p}{m}$.","B. $v = pm$.","C. $v = \\\\frac{m}{p}$.","D. $v = p + m$."],"answer": "A","explain": "Từ $p = mv$ suy ra $v = p/m$.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi hai vật va chạm, động lượng của hệ hai vật","options": ["A. có thể bảo toàn nếu hệ là hệ kín.","B. luôn tăng.","C. luôn giảm.","D. luôn bằng 0."],"answer": "A","explain": "Chỉ hệ kín mới bảo toàn động lượng.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $1,2\\\\ \\\\text{kg}$ đang chuyển động với động lượng $7,2\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$. Tốc độ của vật bằng","options": ["A. $6\\\\ \\\\text{m/s}$.","B. $8,64\\\\ \\\\text{m/s}$.","C. $6,2\\\\ \\\\text{m/s}$.","D. $0,167\\\\ \\\\text{m/s}$."],"answer": "A","explain": "$v = 7,2/1,2 = 6\\\\ \\\\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lực $F = 60\\\\ \\\\text{N}$ tác dụng lên vật $3\\\\ \\\\text{kg}$ đang đứng yên trong $2,5\\\\ \\\\text{s}$. Động lượng của vật sau đó bằng","options": ["A. $150\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","B. $24\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","C. $375\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","D. $62,5\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$."],"answer": "A","explain": "$p = F\\\\Delta t = 60 \\\\cdot 2,5 = 150$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một ô tô $1500\\\\ \\\\text{kg}$ chạy $25\\\\ \\\\text{m/s}$ hãm phanh còn $10\\\\ \\\\text{m/s}$. Độ biến thiên động lượng bằng","options": ["A. $-22500\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","B. $22500\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","C. $37500\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","D. $15000\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$."],"answer": "A","explain": "$\\\\Delta p = 1500 \\\\cdot (10 - 25) = -22500$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng là đại lượng vectơ.","b) $\\\\text{kg} \\\\cdot \\\\text{m/s}$ và $\\\\text{N} \\\\cdot \\\\text{s}$ là hai đơn vị tương đương.","c) Vật chuyển động càng nhanh thì động lượng càng lớn (cùng khối lượng).","d) Động lượng của vật không phụ thuộc vào hướng chuyển động."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $\\\\vec{p}$ có hướng.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $0,4\\\\ \\\\text{kg}$ được ném thẳng đứng lên với tốc độ $20\\\\ \\\\text{m/s}$ (chọn chiều dương hướng lên). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng của vật lúc ném bằng $8\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","b) Khi vật đạt độ cao cực đại, động lượng bằng 0.","c) Khi vật rơi trở về vị trí ném, động lượng bằng $-8\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$ (bỏ qua sức cản).","d) Độ biến thiên động lượng từ lúc ném đến khi về vị trí cũ bằng 0."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $0,4 \\\\cdot 20 = 8$. b) Đúng: $v = 0$. c) Đúng: tốc độ vẫn $20\\\\ \\\\text{m/s}$ nhưng hướng xuống. d) Sai: $\\\\Delta p = -8 - 8 = -16\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","points": 1},{"type": "short","level": "VDC","q": "Một vật khối lượng $3\\\\ \\\\text{kg}$ đang đứng yên thì chịu lực $12\\\\ \\\\text{N}$ trong $2,5\\\\ \\\\text{s}$. Động lượng của vật sau đó bằng bao nhiêu $\\\\text{kg} \\\\cdot \\\\text{m/s}$? (chỉ điền số)","answer": "30","explain": "$p = 12 \\\\cdot 2,5 = 30$.","points": 0.5},{"type": "short","level": "VDC","q": "Một quả bóng khối lượng $0,45\\\\ \\\\text{kg}$ bay với tốc độ $10\\\\ \\\\text{m/s}$ đập vuông góc vào tường rồi nảy ra với tốc độ $6\\\\ \\\\text{m/s}$. Thời gian va chạm $0,04\\\\ \\\\text{s}$. Độ lớn lực trung bình của tường lên bóng bằng bao nhiêu niutơn? (chỉ điền số)","answer": "180","explain": "$|\\\\Delta p| = 0,45 \\\\cdot 16 = 7,2$. $F = 7,2/0,04 = 180\\\\ \\\\text{N}$.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "NB","q": "Xung lượng của lực đặc trưng cho","options": ["A. tác dụng của lực trong một khoảng thời gian.","B. tác dụng của lực trên một quãng đường.","C. tốc độ sinh công của lực.","D. hiệu quả sử dụng năng lượng."],"answer": "A","explain": "Xung lượng $\\\\vec{F}\\\\Delta t$ gắn với thời gian tác dụng.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật đang chuyển động thẳng với tốc độ $v$. Nếu khối lượng tăng gấp đôi và tốc độ giảm một nửa thì động lượng","options": ["A. không đổi.","B. tăng gấp đôi.","C. giảm một nửa.","D. tăng gấp bốn."],"answer": "A","explain": "$p' = 2m \\\\cdot v/2 = mv = p$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một máy bay $60000\\\\ \\\\text{kg}$ hạ cánh với tốc độ $60\\\\ \\\\text{m/s}$. Động lượng của máy bay lúc chạm đất bằng","options": ["A. $3,6 \\\\cdot 10^6\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","B. $1000\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","C. $60060\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","D. $3,6 \\\\cdot 10^4\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$."],"answer": "A","explain": "$p = 60000 \\\\cdot 60 = 3,6 \\\\cdot 10^6$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $5\\ \\text{kg}$ đang chuyển động với tốc độ $4\\ \\text{m/s}$ thì chịu lực $15\\ \\text{N}$ ngược chiều chuyển động trong $2\\ \\text{s}$. Tốc độ của vật sau đó bằng","options": ["A. $2\\ \\text{m/s}$ cùng chiều ban đầu.","B. $10\\ \\text{m/s}$ cùng chiều ban đầu.","C. $2\\ \\text{m/s}$ ngược chiều ban đầu.","D. $0$."],"answer": "C","explain": "Động lượng ban đầu $p_1 = 20$. Xung lượng của lực cản $\\Delta p = -30$. Suy ra $p_2 = -10$, vật chuyển động ngược chiều ban đầu với tốc độ $2\\ \\text{m/s}.$","points": 0.2 ext{kg}$ đang chuyển động với tốc độ $5\\\\ \\\\text{m/s}$ thì chịu lực $F = 6\\\\ \\\\text{N}$ cùng hướng chuyển động trong $4\\\\ \\\\text{s}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Xung lượng của lực bằng $24\\\\ \\\\text{N} \\\\cdot \\\\text{s}$.","b) Động lượng lúc sau bằng $39\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","c) Tốc độ lúc sau bằng $13\\\\ \\\\text{m/s}$.","d) Quãng đường vật đi được trong $4\\\\ \\\\text{s}$ là $36\\\\ \\\\text{m}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $6 \\\\cdot 4 = 24$. b) Đúng: $15 + 24 = 39$. c) Đúng: $39/3 = 13$. d) Đúng: $a = 2\\\\ \\\\text{m/s}^2$, $s = 5 \\\\cdot 4 + \\\\frac{1}{2} \\\\cdot 2 \\\\cdot 16 = 36\\\\ \\\\text{m}$.","points": 1},{"type": "short","level": "VDC","q": "Một ô tô $800\\\\ \\\\text{kg}$ đang chạy $72\\\\ \\\\text{km/h}$ thì tài xế phanh với lực hãm $4000\\\\ \\\\text{N}$. Thời gian từ lúc phanh đến khi dừng bằng bao nhiêu giây? (chỉ điền số)","answer": "4","explain": "$v = 20\\\\ \\\\text{m/s}$, $p = 16000$. $\\\\Delta t = 16000/4000 = 4\\\\ \\\\text{s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một quả cầu khối lượng $0,2\\\\ \\\\text{kg}$ chuyển động với tốc độ $10\\\\ \\\\text{m/s}$ đến va chạm mềm với quả cầu $0,3\\\\ \\\\text{kg}$ đang đứng yên. Tốc độ của hệ sau va chạm bằng bao nhiêu m/s? (chỉ điền số)","answer": "4","explain": "$0,2 \\\\cdot 10 = 0,5V$, suy ra $V = 4\\\\ \\\\text{m/s}$.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Trong va chạm mềm, sau va chạm hai vật","options": ["A. dính vào nhau và chuyển động cùng tốc độ.","B. tách ra chuyển động ngược chiều.","C. dừng lại.","D. biến mất."],"answer": "A","explain": "Đặc điểm của va chạm mềm.","points": 0.25},{"type": "mcq","level": "NB","q": "Định luật bảo toàn động lượng áp dụng cho","options": ["A. hệ kín (hệ cô lập).","B. mọi hệ vật.","C. vật đơn lẻ.","D. vật đứng yên."],"answer": "A","explain": "Điều kiện: tổng ngoại lực bằng 0.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người khối lượng $50\\\\ \\\\text{kg}$ đang chạy với tốc độ $6\\\\ \\\\text{m/s}$ nhảy lên xe goòng $150\\\\ \\\\text{kg}$ đang đứng yên (bỏ qua ma sát). Tốc độ của hệ sau đó bằng","options": ["A. $1,5\\\\ \\\\text{m/s}$.","B. $6\\\\ \\\\text{m/s}$.","C. $2\\\\ \\\\text{m/s}$.","D. $0,5\\\\ \\\\text{m/s}$."],"answer": "A","explain": "$50 \\\\cdot 6 = 200V$, $V = 1,5\\\\ \\\\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một viên đạn $10\\\\ \\\\text{g}$ được bắn với tốc độ $600\\\\ \\\\text{m/s}$ vào bao cát $5\\\\ \\\\text{kg}$ treo yên, đạn nằm trong bao cát. Tốc độ của hệ sau va chạm bằng","options": ["A. $1,2\\\\ \\\\text{m/s}$.","B. $600\\\\ \\\\text{m/s}$.","C. $6\\\\ \\\\text{m/s}$.","D. $0,12\\\\ \\\\text{m/s}$."],"answer": "A","explain": "$0,01 \\\\cdot 600 = 5,01V$, $V \\\\approx 1,197 \\\\approx 1,2\\\\ \\\\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $2\\\\ \\\\text{kg}$ đang đứng yên thì nổ thành hai mảnh: mảnh 1 ($1,2\\\\ \\\\text{kg}$) bay với tốc độ $10\\\\ \\\\text{m/s}$. Tốc độ của mảnh 2 bằng","options": ["A. $15\\\\ \\\\text{m/s}$ ngược hướng mảnh 1.","B. $10\\\\ \\\\text{m/s}$ cùng hướng mảnh 1.","C. $6\\\\ \\\\text{m/s}$.","D. $0$."],"answer": "A","explain": "$1,2 \\\\cdot 10 = 0,8v_2$, $v_2 = 15\\\\ \\\\text{m/s}$ ngược hướng.","points": 0.25},{"type": "mcq","level": "VD","q": "Một quả bóng $0,5\\\\ \\\\text{kg}$ rơi từ độ cao $3,2\\\\ \\\\text{m}$ xuống đất (lấy $g = 10\\\\ \\\\text{m/s}^2$). Động lượng của bóng ngay trước khi chạm đất bằng","options": ["A. $4\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","B. $16\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","C. $1,6\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","D. $8\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$."],"answer": "A","explain": "$v = \\\\sqrt{2 \\\\cdot 10 \\\\cdot 3,2} = 8\\\\ \\\\text{m/s}$. $p = 0,5 \\\\cdot 8 = 4$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Va chạm mềm là va chạm mà sau đó hai vật dính vào nhau.","b) Trong va chạm mềm của hệ kín, động lượng được bảo toàn.","c) Trong va chạm mềm, động năng của hệ được bảo toàn.","d) Súng giật lùi khi bắn là ứng dụng của định luật bảo toàn động lượng."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: một phần động năng chuyển thành nhiệt, biến dạng. d) Đúng: chuyển động bằng phản lực.","points": 1},{"type": "truefalse","level": "VDC","q": "Một toa xe $3000\\\\ \\\\text{kg}$ đang chạy với tốc độ $2\\\\ \\\\text{m/s}$ thì một người $60\\\\ \\\\text{kg}$ nhảy lên theo hướng chuyển động của xe với tốc độ $4\\\\ \\\\text{m/s}$ (so với đất, bỏ qua ma sát). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động lượng của hệ trước khi nhảy bằng $6240\\\\ \\\\text{kg} \\\\cdot \\\\text{m/s}$.","b) Tốc độ của hệ sau khi người nhảy lên xe xấp xỉ $2,04\\\\ \\\\text{m/s}$.","c) Động lượng của hệ được bảo toàn.","d) Nếu người nhảy ngược hướng xe thì tốc độ của hệ giảm."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $3000 \\\\cdot 2 + 60 \\\\cdot 4 = 6240$. b) Đúng: $V = 6240/3060 \\\\approx 2,039\\\\ \\\\text{m/s}$. c) Đúng: hệ kín theo phương ngang. d) Đúng: $p_{người}}$ âm làm $V$ giảm.","points": 1},{"type": "short","level": "VDC","q": "Một khẩu đại bác $500\\\\ \\\\text{kg}$ bắn viên đạn $10\\\\ \\\\text{kg}$ với tốc độ $200\\\\ \\\\text{m/s}$. Tốc độ giật lùi của đại bác bằng bao nhiêu m/s? (chỉ điền số)","answer": "4","explain": "$500V = 10 \\\\cdot 200$, $V = 4\\\\ \\\\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Hai xe lăn $m_1 = 1\\\\ \\\\text{kg}$ và $m_2 = 2\\\\ \\\\text{kg}$ ban đầu đứng yên, được nối bằng lò xo nén. Khi thả ra, xe 1 chuyển động với tốc độ $6\\\\ \\\\text{m/s}$. Tốc độ của xe 2 bằng bao nhiêu m/s? (chỉ điền số)","answer": "3","explain": "Bảo toàn động lượng: $1 \\\\cdot 6 = 2v_2$, $v_2 = 3\\\\ \\\\text{m/s}$ ngược hướng xe 1.","points": 0.5}]}]}
