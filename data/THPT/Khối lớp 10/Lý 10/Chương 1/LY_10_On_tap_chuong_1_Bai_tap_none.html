", "q": "Bạn bị hóa chất ăn da nhẹ bắn vào tay trong lúc thí nghiệm. Cách xử lí đúng và đầy đủ là", "options": ["A. rửa ngay dưới vòi nước sạch nhiều lần rồi báo cho giáo viên.", "B. lau qua bằng khăn giấy rồi làm tiếp.", "C. bôi dầu ăn lên tay.", "D. hơ tay trên ngọn lửa cho khô."], "answer": "A", "explain": "Hóa chất dính vào da phải rửa ngay dưới vòi nước sạch nhiều lần để loại bỏ, sau đó báo giáo viên.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Khi dùng thiết bị điện, tay phải khô ráo.", "b) Nên lắp mạch điện khi nguồn đang đóng để tiết kiệm thời gian.", "c) Tuyệt đối không chiếu tia laser vào mắt.", "d) Được ăn kẹo trong phòng thực hành."], "answer": ["T", "F", "T", "F"], "explain": "a), c) Đúng. b) Sai: lắp mạch khi nguồn đang ngắt. d) Sai: không ăn uống trong phòng thực hành.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mô hình là sự đơn giản hóa đối tượng nghiên cứu.", "b) Mọi lí thuyết vật lí đều cần được thực nghiệm kiểm chứng.", "c) Vật lí không liên quan gì đến công nghệ hiện đại.", "d) Suy luận là bước dùng toán học rút ra quy luật từ số liệu."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: vật lí là nền tảng của công nghệ hiện đại.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho đại lượng $x = (20,0 \\pm 0,4)$ (đơn vị tùy ý). Tính sai số tỉ đối $\\delta x$ (ghi số, đơn vị %).", "answer": "2", "explain": "$\\delta x = \\frac{0,4}{20,0} \\times 100\\% = 2\\%$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Khi xảy ra đám cháy do chập điện, sau khi đã ngắt nguồn điện thì dùng dụng cụ nào để dập lửa?", "answer": "bình chữa cháy", "explain": "Sau khi ngắt nguồn điện, dùng bình chữa cháy (bình cứu hỏa) để dập đám cháy do điện.", "points": 0.5}]},
{"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Cầu vồng, sấm sét và thủy triều đều là", "options": ["A. các hiện tượng tự nhiên thuộc đối tượng nghiên cứu của vật lí.", "B. các hiện tượng siêu nhiên không thể nghiên cứu.", "C. các hiện tượng chỉ có trong truyện cổ tích.", "D. các hiện tượng do con người tạo ra."], "answer": "A", "explain": "Cầu vồng (quang học), sấm sét (điện học), thủy triều (cơ học) đều là hiện tượng tự nhiên mà vật lí nghiên cứu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dụng cụ dùng để bảo vệ mắt trong phòng thí nghiệm là", "options": ["A. kính bảo hộ.", "B. kính lúp.", "C. kính viễn vọng.", "D. gương phẳng."], "answer": "A", "explain": "Kính bảo hộ che chắn mắt khỏi hóa chất và vật văng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn đo thời gian con lắc thực hiện 10 dao động rồi lấy kết quả chia cho 10 để tính chu kì. Mục đích của cách làm này là", "options": ["A. giảm sai số ngẫu nhiên khi đo thời gian.", "B. làm cho con lắc dao động đẹp hơn.", "C. tiết kiệm pin đồng hồ.", "D. tăng sai số hệ thống."], "answer": "A", "explain": "Đo tổng thời gian nhiều dao động rồi chia giúp sai số bấm giờ được chia nhỏ, giảm sai số ngẫu nhiên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi đun nóng ống nghiệm có hóa chất, miệng ống nghiệm phải hướng", "options": ["A. ra xa người (xa mình và xa mọi người xung quanh).", "B. vào mặt mình để dễ quan sát.", "C. lên trần nhà.", "D. xuống mặt bàn."], "answer": "A", "explain": "Hóa chất sôi có thể phụt ra; miệng ống nghiệm hướng ra xa người để đảm bảo an toàn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một mô hình vật lí tốt cần phải", "options": ["A. giữ lại những yếu tố bản chất, bỏ qua chi tiết không cần thiết.", "B. mô tả đầy đủ mọi chi tiết của vật thật.", "C. càng phức tạp càng tốt.", "D. giống hệt vật thật về mọi mặt."], "answer": "A", "explain": "Bản chất của mô hình là đơn giản hóa: giữ yếu tố bản chất, bỏ qua chi tiết không ảnh hưởng đến hiện tượng đang xét.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Diện tích hình chữ nhật $S = a \\cdot b$ với $a = (10,0 \\pm 0,2)$ cm, $b = (8,0 \\pm 0,2)$ cm. Sai số tuyệt đối của diện tích là", "options": ["A. 3,6 cm vuông.", "B. 0,4 cm vuông.", "C. 0,2 cm vuông.", "D. 80 cm vuông."], "answer": "A", "explain": "$\\bar{S} = 80$ cm vuông. $\\delta a = 2\\%$; $\\delta b = 2,5\\%$ nên $\\delta S = 4,5\\%$. Vậy $\\Delta S = 4,5\\% \\times 80 = 3,6$ cm vuông.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dùng dụng cụ đo trực tiếp đại lượng là phép đo trực tiếp.", "b) Đo rồi tính qua công thức là phép đo gián tiếp.", "c) Sai số hệ thống do dụng cụ đo chưa chuẩn gây ra.", "d) Đo một lần duy nhất luôn cho kết quả chính xác tuyệt đối."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: một lần đo chịu sai số ngẫu nhiên, cần đo nhiều lần.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cầm vật nóng phải dùng kẹp gắp hoặc găng tay chịu nhiệt.", "b) Hóa chất bị đổ ra bàn phải lau sạch ngay.", "c) Được dùng tay trần nhặt mảnh thủy tinh vỡ.", "d) Tia laser chiếu vào mắt là vô hại."], "answer": ["T", "T", "F", "F"], "explain": "a), b) Đúng. c) Sai: phải dùng chổi gom. d) Sai: laser gây tổn thương mắt nghiêm trọng.", "points": 1}, {"type": "short", "level": "VD", "q": "Lĩnh vực vật lí nghiên cứu sự truyền nhiệt trong động cơ ô tô có tên gọi là gì?", "answer": "Nhiệt học", "explain": "Động cơ đốt trong của ô tô là máy nhiệt, thuộc lĩnh vực nhiệt học.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho $\\Delta x = 0,5$ và $\\Delta y = 0,5$ (cùng đơn vị). Với $F = x - y$, tính $\\Delta F$ (ghi số).", "answer": "1", "explain": "Với phép trừ: $\\Delta F = \\Delta x + \\Delta y = 0,5 + 0,5 = 1$.", "points": 0.5}]},
{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Khi ngửi thấy mùi khét bốc ra từ thiết bị điện đang dùng, phải", "options": ["A. ngắt nguồn điện ngay lập tức.", "B. lại gần ngửi kĩ xem mùi gì.", "C. đổ nước vào thiết bị.", "D. dùng tay sờ thử xem nóng không."], "answer": "A", "explain": "Mùi khét là dấu hiệu chập cháy; ngắt nguồn điện ngay rồi báo giáo viên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sai số ngẫu nhiên được khắc phục bằng cách", "options": ["A. đo nhiều lần rồi lấy giá trị trung bình.", "B. mua dụng cụ mới.", "C. đo một lần thật nhanh.", "D. nhắm mắt đo cho khách quan."], "answer": "A", "explain": "Đo nhiều lần lấy trung bình giúp triệt tiêu bớt sai số ngẫu nhiên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chiếc tivi, tủ lạnh và máy giặt trong gia đình đều hoạt động dựa trên", "options": ["A. các định luật vật lí về điện, nhiệt và cơ.", "B. phép màu.", "C. sự may mắn.", "D. ý muốn chủ quan của người dùng."], "answer": "A", "explain": "Mọi thiết bị công nghệ đều vận hành tuân theo các định luật vật lí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số 0,070 có bao nhiêu chữ số có nghĩa?", "options": ["A. 2.", "B. 1.", "C. 3.", "D. 4."], "answer": "A", "explain": "0,070 có 2 chữ số có nghĩa là 7 và 0 (số 0 cuối phần thập phân).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn làm vỡ ống nghiệm, mảnh thủy tinh văng tung tóe trên bàn. Việc đầu tiên cần làm là", "options": ["A. báo giáo viên và dùng chổi gom mảnh vỡ (không dùng tay trần).", "B. dùng tay nhặt nhanh cho sạch.", "C. đá mảnh vỡ xuống gầm bàn.", "D. tiếp tục thí nghiệm, kệ mảnh vỡ."], "answer": "A", "explain": "Thủy tinh vỡ phải gom bằng chổi, tuyệt đối không nhặt bằng tay trần; đồng thời báo giáo viên.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai nhóm học sinh nghiên cứu cùng một hiện tượng nhưng đưa ra hai lí thuyết khác nhau. Cách phân xử đúng theo tinh thần khoa học là", "options": ["A. làm thực nghiệm kiểm chứng độc lập để xem lí thuyết nào phù hợp.", "B. nhóm nào đông người hơn thì đúng.", "C. nhóm nào nói to hơn thì đúng.", "D. bỏ phiếu kín trong lớp."], "answer": "A", "explain": "Thực nghiệm là tiêu chuẩn kiểm chứng: lí thuyết nào phù hợp với thực nghiệm thì được công nhận.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cơ học nghiên cứu chuyển động của vật và lực tác dụng.", "b) Nhiệt học nghiên cứu về ánh sáng.", "c) Điện học nghiên cứu các hiện tượng điện và từ.", "d) Quang học nghiên cứu về âm thanh."], "answer": ["T", "F", "T", "F"], "explain": "a), c) Đúng. b) Sai: nhiệt học nghiên cứu nhiệt. d) Sai: quang học nghiên cứu ánh sáng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Với $F = x + y$ thì $\\Delta F = \\Delta x + \\Delta y$.", "b) Với $F = x/y$ thì $\\delta F = \\delta x + \\delta y$.", "c) Với $F = x^3$ thì $\\delta F = 3\\delta x$.", "d) Nhân đại lượng với hằng số 2 không làm thay đổi sai số tuyệt đối."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $\\Delta(2x) = 2\\Delta x$, sai số tuyệt đối tăng gấp đôi.", "points": 1}, {"type": "short", "level": "VD", "q": "Vết bỏng nhẹ KHÔNG nên bôi thứ gì lên trên? (ghi tên)", "answer": "kem đánh răng", "explain": "Không bôi kem đánh răng lên vết bỏng vì dễ gây nhiễm trùng; cách đúng là xả dưới vòi nước mát 10 đến 15 phút.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tính tốc độ $v = s/t$ với sai số tỉ đối của quãng đường $\\delta s = 2\\%$ và của thời gian $\\delta t = 3\\%$. Tính $\\delta v$ (ghi số, đơn vị %).", "answer": "5", "explain": "Với phép chia: $\\delta v = \\delta s + \\delta t = 2\\% + 3\\% = 5\\%$.", "points": 0.5}]},
{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Kết quả của một phép đo được ghi dưới dạng chuẩn là", "options": ["A. $A = \\bar{A} \\pm \\Delta A$.", "B. $A = \\bar{A} + \\Delta A$ (chỉ lấy dấu cộng).", "C. $A = \\Delta A$.", "D. $A = \\bar{A}$ (không cần sai số)."], "answer": "A", "explain": "Quy ước ghi kết quả đo: $A = \\bar{A} \\pm \\Delta A$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phương pháp nào giúp đơn giản hóa đối tượng nghiên cứu trong vật lí?", "options": ["A. Phương pháp mô hình.", "B. Phương pháp làm bài tập.", "C. Phương pháp học thuộc lòng.", "D. Phương pháp đoán mò."], "answer": "A", "explain": "Phương pháp mô hình dùng mô hình đơn giản hóa đối tượng nghiên cứu (ví dụ chất điểm).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phải buộc gọn tóc dài khi vào phòng thực hành?", "options": ["A. Vì tóc dài dễ vướng vào thiết bị đang quay hoặc gần lửa, gây nguy hiểm.", "B. Vì tóc dài làm mất thời gian.", "C. Vì tóc dài gây nhiễu sóng điện từ.", "D. Vì giáo viên không thích tóc dài."], "answer": "A", "explain": "Tóc dài vướng vào thiết bị quay hoặc bắt lửa rất nguy hiểm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đo đường kính trong của ống 5 lần được: 3,0 mm; 3,1 mm; 3,0 mm; 3,2 mm; 3,0 mm. Giá trị đại diện cho kết quả đo là", "options": ["A. 3,06 mm.", "B. 3,0 mm.", "C. 3,2 mm.", "D. 3,1 mm."], "answer": "A", "explain": "Giá trị trung bình $= \\frac{3,0 + 3,1 + 3,0 + 3,2 + 3,0}{5} = \\frac{15,3}{5} = 3,06$ mm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Phát biểu nào sau đây đúng về lí thuyết vật lí?", "options": ["A. Lí thuyết có thể được hoàn thiện khi có kết quả thực nghiệm mới.", "B. Lí thuyết một khi đã có thì đúng mãi mãi.", "C. Lí thuyết không cần liên quan đến thực tế.", "D. Lí thuyết càng khó hiểu càng đúng."], "answer": "A", "explain": "Khoa học phát triển bằng cách hoàn thiện lí thuyết theo thực nghiệm mới; lí thuyết cũ vẫn đúng trong phạm vi áp dụng của nó.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đang làm thí nghiệm thì mất điện toàn bộ phòng, mạch điện vẫn đang nối với nguồn. Việc cần làm là", "options": ["A. giữ nguyên hiện trường, báo giáo viên, không tự ý tháo mạch khi chưa rõ.", "B. tự tháo mạch ra ngay.", "C. dùng đèn pin soi tiếp tục làm.", "D. nối mạch sang ổ điện khác."], "answer": "A", "explain": "Khi mất điện đột ngột, giữ nguyên hiện trường, báo giáo viên; không tự ý tháo lắp vì điện có thể có trở lại bất ngờ gây nguy hiểm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phải nắm rõ vị trí bình chữa cháy trong phòng thực hành.", "b) Sai số tỉ đối càng nhỏ thì phép đo càng chính xác.", "c) Học sinh được tự ý sửa chữa thiết bị điện bị hỏng.", "d) Số 2,50 có 2 chữ số có nghĩa."], "answer": ["T", "T", "F", "F"], "explain": "a), b) Đúng. c) Sai: không tự ý sửa thiết bị điện. d) Sai: 2,50 có 3 chữ số có nghĩa.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thực nghiệm là tiêu chuẩn kiểm chứng lí thuyết vật lí.", "b) Mô hình cần giữ lại những yếu tố bản chất của hiện tượng.", "c) Kiến thức khoa học không bao giờ thay đổi.", "d) Vật lí là cơ sở của nhiều ngành công nghệ."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: khoa học phát triển bằng cách hoàn thiện lí thuyết.", "points": 1}, {"type": "short", "level": "VD", "q": "Đo khối lượng 2 lần được: 5,5 g; 5,9 g. Tính giá trị trung bình (ghi số, đơn vị g).", "answer": "5.7", "explain": "Giá trị trung bình $= \\frac{5,5 + 5,9}{2} = 5,7$ g.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Chu trình nghiên cứu vật lí gồm các bước: mô hình, quan sát và thực nghiệm, suy luận, kiểm chứng. Có tất cả bao nhiêu bước?", "answer": "4", "explain": "Chu trình gồm 4 bước: (1) xây dựng mô hình, (2) quan sát và thực nghiệm, (3) suy luận, (4) kiểm chứng.", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Lĩnh vực nghiên cứu về nhiệt độ và các loại máy nhiệt là", "options": ["A. nhiệt học.", "B. cơ học.", "C. quang học.", "D. điện học."], "answer": "A", "explain": "Nhiệt học nghiên cứu nhiệt độ, sự truyền nhiệt và các loại máy nhiệt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Không được làm gì với hóa chất trong phòng thí nghiệm?", "options": ["A. Nếm thử hóa chất.", "B. Đeo găng tay khi cầm.", "C. Đeo kính bảo hộ.", "D. Rửa tay sau khi làm xong."], "answer": "A", "explain": "Tuyệt đối không nếm thử hóa chất vì có thể là chất độc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thước có độ chia nhỏ nhất là 2 mm thì sai số dụng cụ khi đo bằng thước này thường lấy bằng", "options": ["A. 1 mm.", "B. 2 mm.", "C. 4 mm.", "D. 0,5 mm."], "answer": "A", "explain": "Sai số dụng cụ thường lấy bằng nửa độ chia nhỏ nhất: 2 mm / 2 = 1 mm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sau khi đưa ra dự đoán về hiện tượng, nhà vật lí làm thí nghiệm để xem dự đoán có đúng không. Đây là bước", "options": ["A. kiểm chứng.", "B. xây dựng mô hình.", "C. quan sát.", "D. ghi chép."], "answer": "A", "explain": "Làm thí nghiệm để xác nhận dự đoán là bước kiểm chứng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sai số tỉ đối của phép đo được ghi là $(4,00 \\pm 0,04)$ (đơn vị tùy ý) là", "options": ["A. 1%.", "B. 0,04%.", "C. 4%.", "D. 0,1%."], "answer": "A", "explain": "$\\delta = \\frac{0,04}{4,00} \\times 100\\% = 1\\%$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Bạn An bị điện giật nhẹ nhưng đã được tách khỏi nguồn điện. Việc tiếp theo cần làm là", "options": ["A. kiểm tra tình trạng nạn nhân, sơ cứu, báo giáo viên và gọi cấp cứu nếu cần.", "B. để An nghỉ một lát rồi làm tiếp.", "C. cho An uống nước lạnh.", "D. tiếp tục thí nghiệm như bình thường."], "answer": "A", "explain": "Sau khi tách nạn nhân khỏi nguồn điện: kiểm tra tình trạng, sơ cứu, báo giáo viên và gọi cấp cứu nếu có dấu hiệu nặng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dùng dụng cụ đo trực tiếp đại lượng cần đo là phép đo trực tiếp.", "b) Đo các đại lượng rồi tính qua công thức là phép đo gián tiếp.", "c) Sai số hệ thống do dụng cụ đo chưa chuẩn gây ra.", "d) Sai số ngẫu nhiên được khắc phục bằng cách hiệu chỉnh dụng cụ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: hiệu chỉnh dụng cụ khắc phục sai số hệ thống; sai số ngẫu nhiên khắc phục bằng đo nhiều lần.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cháy do chập điện: ngắt nguồn điện trước khi dập lửa.", "b) Bị bỏng nhẹ: xả vết bỏng dưới vòi nước mát.", "c) Hóa chất bắn vào mắt: rửa ngay bằng nước sạch nhiều lần.", "d) Đứt tay do thủy tinh: bôi vôi vào vết thương."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phải rửa sạch, cầm máu, sát trùng và băng lại.", "points": 1}, {"type": "short", "level": "VD", "q": "Thiết bị y tế dùng tia X để chụp chiếu bên trong cơ thể có tên gọi là gì?", "answer": "Máy X-quang", "explain": "Máy chụp X-quang là ứng dụng của vật lí trong y học.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Diện tích hình vuông $S = a^2$ với sai số tỉ đối của cạnh $\\delta a = 1,5\\%$. Tính $\\delta S$ (ghi số, đơn vị %).", "answer": "3", "explain": "Với lũy thừa bậc 2: $\\delta S = 2 \\times \\delta a = 3\\%$.", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trang phục khi vào phòng thực hành vật lí phải", "options": ["A. gọn gàng, tóc dài buộc gọn.", "B. thật sành điệu.", "C. càng nhiều phụ kiện càng tốt.", "D. mặc áo dài tay rộng thùng thình."], "answer": "A", "explain": "Trang phục gọn gàng, buộc tóc gọn để tránh vướng vào thiết bị.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sai số tuyệt đối của phép đo có đơn vị là", "options": ["A. cùng đơn vị với đại lượng được đo.", "B. luôn là kilôgam.", "C. không có đơn vị.", "D. luôn là phần trăm."], "answer": "A", "explain": "Sai số tuyệt đối có cùng đơn vị với đại lượng đo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tấm pin mặt trời trên mái nhà là ứng dụng kết hợp của các lĩnh vực", "options": ["A. quang học và điện học.", "B. cơ học và nhiệt học.", "C. âm học và quang học.", "D. nhiệt học và cơ học."], "answer": "A", "explain": "Pin mặt trời thu ánh sáng (quang học) và tạo ra dòng điện (điện học).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi chọn thang đo cho ampe kế, cần", "options": ["A. ước lượng giá trị cần đo trước rồi chọn thang đo lớn hơn giá trị đó.", "B. chọn thang đo nhỏ nhất cho chính xác.", "C. chọn thang đo bất kì.", "D. không cần chọn thang đo."], "answer": "A", "explain": "Phải ước lượng trước và chọn thang đo lớn hơn giá trị ước lượng để tránh quá tải.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đo 4 lần được: 7,0; 7,3; 7,1; 7,2 (đơn vị tùy ý) bằng thước có độ chia nhỏ nhất 1 mm. Sai số tuyệt đối của phép đo xấp xỉ", "options": ["A. 0,15.", "B. 0,05.", "C. 0,3.", "D. 0,1."], "answer": "A", "explain": "Giá trị trung bình 7,15. Các độ lệch: 0,15; 0,15; 0,05; 0,05, trung bình 0,1. Sai số dụng cụ 0,05. Vậy $\\Delta A = 0,1 + 0,05 = 0,15$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một bạn nói: Vật lí chỉ dành cho các nhà khoa học, người bình thường không cần. Lập luận phản bác đúng đắn nhất là", "options": ["A. ai cũng cần hiểu biết vật lí để sử dụng công nghệ an toàn và giải thích hiện tượng quanh mình.", "B. vật lí là môn bắt buộc nên phải học.", "C. không học vật lí sẽ bị điểm kém.", "D. nhà khoa học cũng là người bình thường."], "answer": "A", "explain": "Hiểu biết vật lí giúp mọi người sử dụng điện, thiết bị an toàn, tiết kiệm năng lượng và hiểu thế giới xung quanh.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật lí nghiên cứu các dạng vận động của vật chất và năng lượng.", "b) Tuyệt đối không chiếu tia laser vào mắt.", "c) Được đùa nghịch xô đẩy trong phòng thực hành.", "d) Hóa chất bị đổ ra phải lau sạch ngay."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: nghiêm cấm đùa nghịch xô đẩy.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sai số tỉ đối của $(25,0 \\pm 0,5)$ độ C là 2%.", "b) Với $V = a \\cdot b \\cdot c$ thì $\\delta V = \\delta a + \\delta b + \\delta c$.", "c) Số 0,05 có 2 chữ số có nghĩa.", "d) Với $F = 2x$ thì $\\Delta F = 2\\Delta x$."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: 0,05 có 1 chữ số có nghĩa.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho đại lượng $x = (10 \\pm 0,5)$ (đơn vị tùy ý). Tính sai số tỉ đối $\\delta x$ (ghi số, đơn vị %).", "answer": "5", "explain": "$\\delta x = \\frac{0,5}{10} \\times 100\\% = 5\\%$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Khi đám cháy trong phòng thí nghiệm đã lan rộng, không thể kiểm soát được, ưu tiên hàng đầu là gì?", "answer": "sơ tán", "explain": "Khi cháy lan rộng không kiểm soát được, ưu tiên hàng đầu là sơ tán mọi người ra nơi an toàn và báo lực lượng chữa cháy.", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Sai số hệ thống được khắc phục bằng cách", "options": ["A. hiệu chỉnh dụng cụ và đo đúng cách.", "B. đo thật nhiều lần.", "C. đổi người đo.", "D. đo vào ban đêm."], "answer": "A", "explain": "Sai số hệ thống do dụng cụ/cách đo nên khắc phục bằng hiệu chỉnh dụng cụ và đo đúng cách.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đối tượng nghiên cứu của cơ học là", "options": ["A. chuyển động của vật và lực tác dụng lên vật.", "B. sự truyền nhiệt.", "C. dòng điện.", "D. ánh sáng."], "answer": "A", "explain": "Cơ học nghiên cứu chuyển động của vật và lực tác dụng lên vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không được dùng nước để dập đám cháy do điện khi chưa ngắt nguồn?", "options": ["A. Vì nước dẫn điện, người dập lửa dễ bị điện giật.", "B. Vì nước làm hỏng bình chữa cháy.", "C. Vì nước quá nặng khó xách.", "D. Vì lửa điện không sợ nước."], "answer": "A", "explain": "Nước dẫn điện nên rất nguy hiểm khi dập lửa điện chưa ngắt nguồn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kết quả đo được ghi là $(20,0 \\pm 0,4)$ cm. Điều này có nghĩa là", "options": ["A. giá trị thật nằm trong khoảng từ 19,6 cm đến 20,4 cm.", "B. giá trị thật đúng bằng 20,0 cm.", "C. phép đo sai 0,4 cm.", "D. phải đo lại từ đầu."], "answer": "A", "explain": "Giá trị thật nằm trong $[\\bar{A} - \\Delta A; \\bar{A} + \\Delta A] = [19,6; 20,4]$ cm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Mô hình chất điểm KHÔNG thể dùng được trong trường hợp nào sau đây?", "options": ["A. Nghiên cứu chuyển động tự quay của Trái Đất quanh trục của nó.", "B. Nghiên cứu chuyển động của ô tô trên quãng đường dài 100 km.", "C. Nghiên cứu chuyển động của máy bay trên đường bay dài.", "D. Nghiên cứu chuyển động của viên bi trên mặt bàn dài."], "answer": "A", "explain": "Khi nghiên cứu chuyển động tự quay, kích thước và hình dạng Trái Đất là yếu tố bản chất nên không thể coi là chất điểm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Xác định gia tốc trọng trường từ công thức $g = \\frac{2h}{t^2}$ với $h = (5,00 \\pm 0,05)$ m và $t = (1,00 \\pm 0,02)$ s. Sai số tỉ đối của $g$ là", "options": ["A. 5%.", "B. 1%.", "C. 2%.", "D. 3%."], "answer": "A", "explain": "$\\delta h = \\frac{0,05}{5,00} = 1\\%$; $\\delta t = \\frac{0,02}{1,00} = 2\\%$. Vì $g$ tỉ lệ với $h/t^2$ nên $\\delta g = \\delta h + 2\\delta t = 1\\% + 4\\% = 5\\%$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trước khi thí nghiệm phải đọc kĩ hướng dẫn.", "b) Phải kiểm tra dụng cụ trước khi làm.", "c) Dụng cụ hỏng phải báo ngay cho giáo viên.", "d) Được tự ý thay đổi nội dung thí nghiệm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tuyệt đối không tự ý thay đổi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mô phỏng chuyển động trên máy tính là một dạng mô hình.", "b) Vẽ đồ thị từ số liệu giúp phát hiện quy luật.", "c) Lí thuyết càng nhiều công thức thì càng đúng.", "d) Thực nghiệm có thể bác bỏ một lí thuyết."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: tính đúng đắn do thực nghiệm quyết định.", "points": 1}, {"type": "short", "level": "VD", "q": "Đo 6 lần được: 2,0; 2,2; 2,1; 2,0; 2,2; 2,1 (đơn vị tùy ý). Tính giá trị trung bình (ghi số).", "answer": "2.1", "explain": "Giá trị trung bình $= \\frac{2,0 + 2,2 + 2,1 + 2,0 + 2,2 + 2,1}{6} = \\frac{12,6}{6} = 2,1$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Xử lí khi bạn bị điện giật gồm: (1) sơ cứu nạn nhân, (2) ngắt nguồn điện. Bước nào phải làm TRƯỚC? (ghi số)", "answer": "2", "explain": "Phải ngắt nguồn điện trước (bước 2), nếu không người cứu cũng bị điện giật theo.", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Môn Vật lí giúp con người", "options": ["A. hiểu các quy luật của tự nhiên và vận dụng vào đời sống, công nghệ.", "B. trở nên giàu có nhanh chóng.", "C. tránh phải lao động.", "D. đoán trước tương lai."], "answer": "A", "explain": "Vật lí giúp hiểu quy luật tự nhiên và là nền tảng của công nghệ, đời sống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi lắp ráp mạch điện, nguồn điện phải ở trạng thái", "options": ["A. ngắt (chưa có điện).", "B. đang đóng (có điện).", "C. lúc đóng lúc ngắt.", "D. trạng thái nào cũng được."], "answer": "A", "explain": "Lắp mạch khi nguồn đang ngắt; kiểm tra kĩ rồi mới đóng nguồn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số 4,20 có bao nhiêu chữ số có nghĩa?", "options": ["A. 3.", "B. 2.", "C. 4.", "D. 1."], "answer": "A", "explain": "4,20 có 3 chữ số có nghĩa: 4, 2 và 0.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ các số liệu thí nghiệm, học sinh vẽ đồ thị và dùng toán học tìm ra công thức. Đây là bước nào?", "options": ["A. Suy luận.", "B. Quan sát.", "C. Kiểm chứng.", "D. Xây dựng mô hình."], "answer": "A", "explain": "Dùng toán học rút ra quy luật từ số liệu là bước suy luận.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho $x = (30,0 \\pm 0,4)$ và $y = (10,0 \\pm 0,2)$ (cùng đơn vị). Với $F = x - y$, kết quả ghi đúng là", "options": ["A. $F = (20,0 \\pm 0,6)$.", "B. $F = (20,0 \\pm 0,2)$.", "C. $F = (40,0 \\pm 0,6)$.", "D. $F = (20,0 \\pm 0,4)$."], "answer": "A", "explain": "$\\bar{F} = 20,0$; $\\Delta F = 0,4 + 0,2 = 0,6$. Vậy $F = (20,0 \\pm 0,6)$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nhóm bạn được giao thí nghiệm với vật nóng nhưng không có găng tay chịu nhiệt. Quyết định đúng của nhóm là", "options": ["A. báo giáo viên xin găng tay hoặc xin đổi sang nội dung an toàn hơn.", "B. dùng tay trần cầm cho nhanh.", "C. nhờ bạn khác cầm hộ.", "D. bỏ thí nghiệm, đi chơi."], "answer": "A", "explain": "Thiếu đồ bảo hộ thì không làm thí nghiệm có nguy cơ; báo giáo viên để được hỗ trợ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sai số tỉ đối càng nhỏ thì phép đo càng chính xác.", "b) Số 4,20 có 3 chữ số có nghĩa.", "c) Phép đo trực tiếp cần dùng công thức tính.", "d) Phép đo gián tiếp đo trực tiếp đại lượng cần đo."], "answer": ["T", "T", "F", "F"], "explain": "a), b) Đúng. c) Sai: phép đo trực tiếp dùng dụng cụ đo. d) Sai: phép đo gián tiếp tính qua công thức.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quên tắt bếp điện sau khi dùng có thể gây cháy.", "b) Thấy bạn vi phạm quy tắc an toàn phải nhắc nhở ngay.", "c) Mỗi thí nghiệm đều cần đọc kĩ hướng dẫn riêng.", "d) Đồ bảo hộ chỉ mang tính hình thức, không cần thiết."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đồ bảo hộ bảo vệ trực tiếp người làm thí nghiệm.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguồn năng lượng sạch thu được từ gió có tên gọi là gì?", "answer": "Điện gió", "explain": "Điện gió là nguồn năng lượng tái tạo, sạch, ứng dụng của vật lí.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho $F = x \\cdot y \\cdot z$ với $\\delta x = 2\\%$, $\\delta y = 2\\%$, $\\delta z = 2\\%$. Tính $\\delta F$ (ghi số, đơn vị %).", "answer": "6", "explain": "$\\delta F = \\delta x + \\delta y + \\delta z = 2\\% + 2\\% + 2\\% = 6\\%$.", "points": 0.5}]},
{"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Mục đích cốt lõi nhất của các quy tắc an toàn trong phòng thực hành là", "options": ["A. bảo vệ tính mạng và sức khỏe của con người.", "B. giữ cho phòng thực hành đẹp mắt.", "C. giúp thí nghiệm làm nhanh hơn.", "D. tránh bị giáo viên phê bình."], "answer": "A", "explain": "Mục đích cốt lõi của quy tắc an toàn là bảo vệ tính mạng, sức khỏe.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giá trị trung bình của các lần đo được coi là", "options": ["A. kết quả gần đúng nhất của phép đo.", "B. giá trị thật tuyệt đối.", "C. sai số của phép đo.", "D. độ chia nhỏ nhất."], "answer": "A", "explain": "Giá trị trung bình là kết quả gần đúng nhất, vẫn còn sai số.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhà máy thủy điện biến đổi cơ năng của nước thành điện năng là ứng dụng kết hợp của", "options": ["A. cơ học và điện học.", "B. quang học và nhiệt học.", "C. âm học và cơ học.", "D. nhiệt học và quang học."], "answer": "A", "explain": "Nước chảy (cơ năng) làm quay turbine - máy phát (điện học) tạo ra điện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Với $F = x + y + z$ ($x, y, z$ đo trực tiếp), sai số tuyệt đối của $F$ là", "options": ["A. $\\Delta F = \\Delta x + \\Delta y + \\Delta z$.", "B. $\\Delta F = \\Delta x \\cdot \\Delta y \\cdot \\Delta z$.", "C. $\\Delta F = \\frac{\\Delta x + \\Delta y + \\Delta z}{3}$.", "D. $\\Delta F = |\\Delta x - \\Delta y - \\Delta z|$."], "answer": "A", "explain": "Với phép cộng nhiều số hạng, cộng tất cả các sai số tuyệt đối.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn định dùng vôn kế có thang đo 5 V để đo nguồn điện 12 V. Điều gì có thể xảy ra?", "options": ["A. Vôn kế bị quá tải, có thể cháy hỏng.", "B. Vôn kế đo càng chính xác.", "C. Nguồn điện tự giảm xuống 5 V.", "D. Không có gì xảy ra."], "answer": "A", "explain": "Điện áp cần đo vượt giới hạn thang đo gây quá tải, cháy vôn kế.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Xác định điện trở $R = U/I$ với $U = (12,0 \\pm 0,2)$ V và $I = (3,0 \\pm 0,1)$ A. Sai số tuyệt đối của $R$ xấp xỉ", "options": ["A. 0,2 ôm.", "B. 0,1 ôm.", "C. 0,3 ôm.", "D. 4 ôm."], "answer": "A", "explain": "$\\bar{R} = 4,0$ ôm. $\\delta U = \\frac{0,2}{12,0} \\approx 1,67\\%$; $\\delta I = \\frac{0,1}{3,0} \\approx 3,33\\%$. Vậy $\\delta R \\approx 5\\%$ và $\\Delta R = 5\\% \\times 4,0 = 0,2$ ôm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật lí là cơ sở của nhiều ngành công nghệ hiện đại.", "b) Sai số tuyệt đối có cùng đơn vị với đại lượng được đo.", "c) Sai số tỉ đối là tỉ số nên không có đơn vị.", "d) Mọi phép đo đều cho kết quả chính xác tuyệt đối."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: mọi phép đo đều có sai số.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) An toàn trong phòng thực hành là trách nhiệm chung của cả nhóm.", "b) Mỗi thí nghiệm đều cần đọc kĩ hướng dẫn riêng của nó.", "c) Sau khi dùng phải kiểm tra đã tắt các thiết bị điện.", "d) Khi có sự cố nên giấu đi, không báo cho giáo viên."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: có sự cố phải báo ngay cho giáo viên.", "points": 1}, {"type": "short", "level": "VD", "q": "Đo 4 lần được: 8,0; 8,2; 8,1; 8,1 (đơn vị tùy ý). Tính giá trị trung bình (ghi số).", "answer": "8.1", "explain": "Giá trị trung bình $= \\frac{8,0 + 8,2 + 8,1 + 8,1}{4} = \\frac{32,4}{4} = 8,1$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Chu trình nghiên cứu vật lí gồm 4 bước: mô hình, quan sát và thực nghiệm, suy luận và một bước cuối cùng. Bước cuối cùng là gì?", "answer": "kiểm chứng", "explain": "Bước cuối cùng là kiểm chứng bằng thực nghiệm mới.", "points": 0.5}]}]}
