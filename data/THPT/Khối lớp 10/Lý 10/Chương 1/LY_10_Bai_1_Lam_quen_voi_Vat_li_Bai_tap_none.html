ch thước của vật.", "C. Mọi mô hình đều phản ánh đầy đủ mọi chi tiết của vật thật.", "D. Mô hình quỹ đạo tròn giúp tính toán chuyển động của Trái Đất dễ hơn."], "answer": "C", "explain": "Mô hình là sự đơn giản hóa, nó bỏ qua các chi tiết không cần thiết nên không thể phản ánh đầy đủ mọi chi tiết của vật thật. Đó chính là ý nghĩa của việc mô hình hóa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một kĩ sư thiết kế cầu chỉ dùng mô hình tính toán trên máy tính rồi cho thi công ngay mà bỏ qua bước thử tải thực tế. Việc làm này vi phạm nguyên tắc nào của nghiên cứu vật lí?", "options": ["A. Mọi công trình đều phải thật đẹp mắt.", "B. Lí thuyết và mô hình tính toán phải được kiểm chứng bằng thực nghiệm.", "C. Kĩ sư không được dùng máy tính.", "D. Cầu nào cũng phải thử tải 100 lần."], "answer": "B", "explain": "Mô hình tính toán là lí thuyết trên giấy; theo phương pháp nghiên cứu vật lí, nó phải được kiểm chứng bằng thực nghiệm (thử tải) trước khi áp dụng vào thực tế để đảm bảo an toàn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phương pháp mô hình giúp đơn giản hóa đối tượng nghiên cứu.", "b) Chất điểm là mô hình coi vật có kích thước rất nhỏ, bỏ qua được.", "c) Suy luận là bước dùng toán học rút ra quy luật từ số liệu.", "d) Nghề kĩ sư xây dựng không liên quan gì đến vật lí."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo bài học. d) Sai: kĩ sư xây dựng phải vững cơ học (lực, kết cấu) nên rất liên quan đến vật lí.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Máy cộng hưởng từ (MRI) là ứng dụng của vật lí trong y học.", "b) Động cơ đốt trong hoạt động dựa trên kiến thức nhiệt học.", "c) Internet ra đời mà không cần đến bất cứ kiến thức vật lí nào.", "d) Nhà nghiên cứu vật lí là một nghề nghiệp liên quan đến vật lí."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: MRI ứng dụng hiện tượng cộng hưởng từ. b) Đúng: động cơ đốt trong là máy nhiệt. c) Sai: internet dựa trên điện tử, quang học (cáp quang). d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu tên một nghề nghiệp liên quan đến Vật lí trong lĩnh vực thiết kế và thi công các công trình.", "answer": "Kĩ sư xây dựng", "explain": "Kĩ sư xây dựng (cũng chấp nhận kĩ sư cầu đường, kĩ sư kết cấu) phải vận dụng cơ học về lực và chuyển động để thiết kế công trình an toàn.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong chu trình nghiên cứu vật lí, bước nào đứng ngay sau bước quan sát và thực nghiệm?", "answer": "Suy luận", "explain": "Trình tự: mô hình, quan sát và thực nghiệm, suy luận ra quy luật, kiểm chứng. Sau khi có số liệu thực nghiệm, nhà vật lí dùng toán học suy luận để rút ra quy luật.", "points": 0.5}]},
{"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Hiện tượng nào sau đây thuộc đối tượng nghiên cứu của Vật lí?", "options": ["A. Quả bóng rơi xuống đất khi được thả ra.", "B. Cây lúa quang hợp tạo chất hữu cơ.", "C. Sắt bị gỉ khi để ngoài không khí ẩm.", "D. Tranh cử chức lớp trưởng của học sinh."], "answer": "A", "explain": "Quả bóng rơi là chuyển động của vật dưới tác dụng của lực — đối tượng của vật lí (cơ học). Các hiện tượng còn lại thuộc sinh học, hóa học và hoạt động xã hội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lĩnh vực nghiên cứu về điện, từ và điện từ trường là", "options": ["A. cơ học.", "B. nhiệt học.", "C. điện học.", "D. quang học."], "answer": "C", "explain": "Điện học nghiên cứu các hiện tượng điện, từ và điện từ trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tủ lạnh làm lạnh thực phẩm dựa chủ yếu trên kiến thức của lĩnh vực", "options": ["A. cơ học.", "B. nhiệt học.", "C. quang học.", "D. vật lí hạt nhân."], "answer": "B", "explain": "Tủ lạnh hoạt động theo nguyên lí máy lạnh: lấy nhiệt từ trong tủ thải ra ngoài — kiến thức thuộc nhiệt học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Coi quỹ đạo chuyển động của Trái Đất quanh Mặt Trời là một đường tròn là ví dụ của", "options": ["A. phương pháp mô hình.", "B. phương pháp quan sát.", "C. phương pháp thực nghiệm.", "D. phương pháp suy luận."], "answer": "A", "explain": "Quỹ đạo thật là elip gần tròn; coi là đường tròn là đơn giản hóa đối tượng để tính toán dễ hơn — phương pháp mô hình.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao khi làm thí nghiệm, các nhà vật lí thường đo nhiều lần rồi lấy giá trị trung bình?", "options": ["A. Để bài báo cáo trông dài hơn.", "B. Để giảm ảnh hưởng của sai số ngẫu nhiên, số liệu đáng tin cậy hơn.", "C. Vì thiết bị đo luôn hỏng sau một lần đo.", "D. Để tốn nhiều thời gian hơn."], "answer": "B", "explain": "Đo nhiều lần rồi lấy trung bình giúp triệt tiêu bớt sai số ngẫu nhiên, kết quả đại diện và đáng tin cậy hơn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai nhóm cùng nghiên cứu sự nở vì nhiệt của thanh kim loại. Nhóm A chỉ đo độ dài ở một nhiệt độ duy nhất; nhóm B đo ở nhiều nhiệt độ khác nhau rồi vẽ đồ thị. Cách làm của nhóm B tốt hơn vì", "options": ["A. nhóm B dùng thước đắt tiền hơn.", "B. nhóm B thu được quy luật biến thiên theo nhiệt độ, số liệu tin cậy hơn.", "C. nhóm A đo sai đơn vị.", "D. vẽ đồ thị luôn đúng mà không cần đo."], "answer": "B", "explain": "Đo ở nhiều nhiệt độ cho thấy quy luật biến thiên của độ dài theo nhiệt độ, còn đo một điểm không thể rút ra quy luật. Đó là ưu điểm của phương pháp thực nghiệm có hệ thống.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Âm thanh do loa phát ra thuộc đối tượng nghiên cứu của vật lí.", "b) Điện học nghiên cứu các hiện tượng điện và từ.", "c) Kính hiển vi là ứng dụng của quang học.", "d) Làm thí nghiệm là cách duy nhất để học vật lí, không cần lí thuyết."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: âm học là một phần của vật lí. b) Đúng. c) Đúng: kính hiển vi dùng hệ thấu kính (quang học). d) Sai: cần kết hợp lí thuyết, mô hình và thực nghiệm.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Coi vật là chất điểm là một ví dụ của phương pháp mô hình.", "b) Mọi lí thuyết vật lí đều đúng mãi mãi, không bao giờ bị thay thế.", "c) Thực nghiệm có thể bác bỏ một lí thuyết vật lí.", "d) Vật lí góp phần phát triển công nghệ năng lượng tái tạo."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: lí thuyết có thể được hoàn thiện hoặc thay thế khi có thực nghiệm mới (ví dụ cơ học Newton được mở rộng bởi thuyết tương đối). c) Đúng: thực nghiệm là tiêu chuẩn kiểm chứng. d) Đúng: điện mặt trời, điện gió.", "points": 1}, {"type": "short", "level": "VD", "q": "Lĩnh vực vật lí nghiên cứu về máy nhiệt và sự truyền nhiệt có tên gọi là gì?", "answer": "Nhiệt học", "explain": "Nhiệt học nghiên cứu nhiệt độ, sự truyền nhiệt và các loại máy nhiệt như động cơ đốt trong, tủ lạnh.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Khi coi ô tô đang chạy trên quãng đường dài 100 km là một chất điểm, mô hình này đã bỏ qua đại lượng nào của ô tô?", "answer": "kích thước", "explain": "Mô hình chất điểm bỏ qua kích thước (và hình dạng) của vật, chỉ giữ lại khối lượng và vị trí, vì kích thước ô tô rất nhỏ so với quãng đường 100 km.", "points": 0.5}]},
{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Câu hỏi nào sau đây thuộc phạm vi nghiên cứu của Vật lí?", "options": ["A. Vì sao con thuyền nổi được trên mặt nước?", "B. Vì sao con người cần uống nước mỗi ngày?", "C. Vì sao giá gạo năm nay tăng cao?", "D. Vì sao bạn An học giỏi môn Văn?"], "answer": "A", "explain": "Thuyền nổi liên quan đến lực đẩy Archimedes — hiện tượng vật lí. Các câu còn lại thuộc sinh học, kinh tế và tâm lí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tia laser dùng trong máy chiếu là ứng dụng của lĩnh vực", "options": ["A. cơ học.", "B. nhiệt học.", "C. quang học.", "D. vật lí hạt nhân."], "answer": "C", "explain": "Laser là nguồn sáng đặc biệt, thuộc lĩnh vực quang học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Máy phát điện trong nhà máy thủy điện ứng dụng chủ yếu kiến thức của lĩnh vực", "options": ["A. điện học (hiện tượng cảm ứng điện từ).", "B. quang học.", "C. nhiệt học.", "D. cơ học lượng tử."], "answer": "A", "explain": "Máy phát điện biến cơ năng thành điện năng nhờ hiện tượng cảm ứng điện từ — kiến thức điện học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ các số liệu đo được trong thí nghiệm, học sinh dùng toán học để rút ra công thức tính. Đây là bước nào trong chu trình nghiên cứu?", "options": ["A. Xây dựng mô hình.", "B. Quan sát và thực nghiệm.", "C. Suy luận.", "D. Kiểm chứng."], "answer": "C", "explain": "Dùng toán học rút ra quy luật từ số liệu chính là bước suy luận.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Phát biểu nào sau đây đúng về mối quan hệ giữa lí thuyết và thực nghiệm trong vật lí?", "options": ["A. Lí thuyết luôn đúng nên không cần thực nghiệm.", "B. Thực nghiệm là tiêu chuẩn để kiểm chứng và hoàn thiện lí thuyết.", "C. Thực nghiệm chỉ để minh họa cho đẹp mắt.", "D. Lí thuyết và thực nghiệm không liên quan đến nhau."], "answer": "B", "explain": "Thực nghiệm vừa là nguồn gốc vừa là tiêu chuẩn kiểm chứng của lí thuyết; lí thuyết không phù hợp thực nghiệm sẽ bị sửa đổi hoặc loại bỏ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người quảng cáo đã chế tạo thành công động cơ chạy mãi mãi mà không cần cung cấp năng lượng. Dựa vào hiểu biết vật lí, đánh giá đúng đắn nhất là", "options": ["A. tin ngay vì đó là phát minh vĩ đại.", "B. nghi ngờ vì nó vi phạm định luật bảo toàn và chuyển hóa năng lượng, cần thực nghiệm kiểm chứng độc lập.", "C. tin vì người đó nói rất tự tin.", "D. không quan tâm vì vật lí không liên quan đến động cơ."], "answer": "B", "explain": "Động cơ vĩnh cửu loại 1 vi phạm định luật bảo toàn năng lượng. Theo phương pháp vật lí, mọi tuyên bố đều phải qua thực nghiệm kiểm chứng độc lập mới đáng tin.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật lí có vai trò quan trọng trong sự phát triển của công nghệ.", "b) Siêu âm trong y học là một ứng dụng của vật lí.", "c) Mọi hiện tượng tự nhiên đều là đối tượng nghiên cứu của vật lí.", "d) Học vật lí giúp giải thích được nhiều hiện tượng trong đời sống."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: máy siêu âm dùng sóng siêu âm. c) Sai: vật lí nghiên cứu các dạng vận động của vật chất và năng lượng, còn nhiều hiện tượng thuộc sinh học, hóa học. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phương pháp mô hình, quan sát - thực nghiệm và suy luận bổ trợ cho nhau.", "b) Một mô hình càng chi tiết thì càng tốt, không cần đơn giản hóa.", "c) Số liệu thực nghiệm là cơ sở để suy luận ra quy luật.", "d) Kiểm chứng bằng thực nghiệm mới giúp lí thuyết thêm vững chắc."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: ba phương pháp phối hợp trong chu trình nghiên cứu. b) Sai: mô hình cần đơn giản hóa, giữ lại yếu tố bản chất. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Kể tên lĩnh vực vật lí có ứng dụng tiêu biểu là máy phát điện.", "answer": "Điện học", "explain": "Máy phát điện ứng dụng hiện tượng cảm ứng điện từ, thuộc lĩnh vực điện học.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Bài học nêu chu trình nghiên cứu vật lí gồm các bước: mô hình, quan sát và thực nghiệm, suy luận, kiểm chứng. Có tất cả bao nhiêu bước?", "answer": "4", "explain": "Chu trình gồm 4 bước: (1) xây dựng mô hình, (2) quan sát và thực nghiệm, (3) suy luận ra quy luật, (4) kiểm chứng bằng thực nghiệm mới.", "points": 0.5}]},
{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Đối tượng nghiên cứu của cơ học là", "options": ["A. chuyển động của vật và lực tác dụng lên vật.", "B. sự truyền nhiệt giữa các vật.", "C. dòng điện trong mạch kín.", "D. sự phát sáng của các vật."], "answer": "A", "explain": "Cơ học là lĩnh vực nghiên cứu chuyển động của vật và lực tác dụng lên vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các nghề sau, nghề nào liên quan trực tiếp đến Vật lí?", "options": ["A. Kĩ sư điện.", "B. Đầu bếp.", "C. Thợ may.", "D. Hướng dẫn viên du lịch."], "answer": "A", "explain": "Kĩ sư điện làm việc với mạch điện, máy điện — ứng dụng trực tiếp của điện học. Các nghề còn lại ít liên quan đến vật lí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi thiết kế kính đeo mắt cho người cận thị, người ta đã vận dụng kiến thức của lĩnh vực", "options": ["A. nhiệt học.", "B. quang học.", "C. cơ học.", "D. vật lí hạt nhân."], "answer": "B", "explain": "Kính cận là thấu kính phân kì, dùng để điều chỉnh đường đi của tia sáng — kiến thức quang học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bạn quan sát thấy lá cờ bay phấp phới và kết luận hôm nay có gió. Bạn đã thực hiện bước nào của chu trình nghiên cứu?", "options": ["A. Xây dựng mô hình.", "B. Quan sát.", "C. Suy luận ra định luật.", "D. Kiểm chứng bằng thí nghiệm mới."], "answer": "B", "explain": "Nhìn thấy hiện tượng trong tự nhiên và ghi nhận là bước quan sát.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao khi nghiên cứu chuyển động của viên bi trên mặt bàn, ta có thể coi viên bi là chất điểm?", "options": ["A. Vì viên bi có khối lượng rất lớn.", "B. Vì kích thước viên bi rất nhỏ so với quãng đường nó đi được.", "C. Vì viên bi có màu sắc đẹp.", "D. Vì viên bi luôn chuyển động tròn."], "answer": "B", "explain": "Điều kiện dùng mô hình chất điểm là kích thước của vật nhỏ không đáng kể so với quãng đường hoặc phạm vi chuyển động đang xét.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một nhóm học sinh muốn biết vật nặng hơn có rơi nhanh hơn không. Thiết kế thí nghiệm đúng theo phương pháp vật lí là", "options": ["A. hỏi ý kiến cả lớp rồi lấy đa số.", "B. thả hai vật nặng nhẹ khác nhau từ cùng độ cao, đo thời gian rơi và so sánh.", "C. đọc một bài báo rồi kết luận ngay.", "D. đoán theo cảm tính."], "answer": "B", "explain": "Phương pháp vật lí đòi hỏi thực nghiệm có đối chứng: cùng điều kiện (độ cao), chỉ thay đổi khối lượng, đo thời gian rồi so sánh để rút ra kết luận.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kính lúp là ứng dụng của quang học.", "b) Nồi cơm điện hoạt động dựa trên tác dụng nhiệt của dòng điện.", "c) Vật lí chỉ nghiên cứu những vật nhìn thấy được bằng mắt thường.", "d) Vệ tinh nhân tạo bay quanh Trái Đất tuân theo các định luật cơ học."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: kính lúp là thấu kính hội tụ. b) Đúng: dòng điện làm nóng dây mayxo. c) Sai: vật lí nghiên cứu từ hạt vi mô đến vũ trụ vĩ mô. d) Đúng: chuyển động của vệ tinh tuân theo cơ học.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thả vật từ các độ cao khác nhau để đo thời gian rơi là làm thực nghiệm.", "b) Vẽ đồ thị từ số liệu đo được giúp phát hiện quy luật.", "c) Một lần đo duy nhất luôn cho kết quả chính xác tuyệt đối.", "d) Lí thuyết mới cần được thực nghiệm kiểm chứng."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: đồ thị giúp nhìn ra quy luật biến thiên. c) Sai: một lần đo chịu ảnh hưởng của sai số ngẫu nhiên. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Gọi tên bước nghiên cứu mà ở đó nhà vật lí dùng toán học để rút ra quy luật từ các số liệu thực nghiệm.", "answer": "Suy luận", "explain": "Sau khi có số liệu từ quan sát và thực nghiệm, nhà vật lí dùng toán học suy luận để rút ra quy luật, công thức.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một học sinh liệt kê các ứng dụng: (1) điều hòa nhiệt độ, (2) máy phát điện, (3) kính hiển vi, (4) động cơ ô tô. Có bao nhiêu ứng dụng trong số đó liên quan đến nhiệt học?", "answer": "2", "explain": "Điều hòa nhiệt độ và động cơ ô tô (động cơ đốt trong là máy nhiệt) liên quan đến nhiệt học. Máy phát điện thuộc điện học, kính hiển vi thuộc quang học.", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Vật lí học nghiên cứu", "options": ["A. các dạng vận động của vật chất và năng lượng.", "B. cấu tạo tế bào của sinh vật.", "C. sự hình thành các loại đá.", "D. ngôn ngữ của các dân tộc."], "answer": "A", "explain": "Đây là định nghĩa đối tượng nghiên cứu của Vật lí trong bài học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lĩnh vực vật lí nghiên cứu cấu trúc vi mô của vật chất (nguyên tử, hạt nhân) là", "options": ["A. cơ học.", "B. vật lí nguyên tử và hạt nhân.", "C. nhiệt học.", "D. quang học."], "answer": "B", "explain": "Vật lí nguyên tử và hạt nhân nghiên cứu cấu trúc vi mô của vật chất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiện tượng nhật thực (Mặt Trăng che khuất Mặt Trời) được giải thích bằng kiến thức của lĩnh vực", "options": ["A. quang học (sự truyền thẳng của ánh sáng).", "B. nhiệt học.", "C. điện học.", "D. âm học."], "answer": "A", "explain": "Nhật thực xảy ra do ánh sáng truyền thẳng tạo vùng bóng tối — kiến thức quang học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để kiểm tra xem dự đoán lí thuyết có đúng không, nhà vật lí cần", "options": ["A. làm thực nghiệm kiểm chứng.", "B. hỏi thêm nhiều người.", "C. viết dự đoán thật dài.", "D. chờ người khác kiểm tra hộ."], "answer": "A", "explain": "Thực nghiệm kiểm chứng là bước bắt buộc để xác nhận hoặc bác bỏ dự đoán lí thuyết.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong các mô hình sau, mô hình nào KHÔNG phù hợp khi nghiên cứu chuyển động quay của Trái Đất quanh trục của nó?", "options": ["A. Coi Trái Đất là một quả cầu đặc.", "B. Coi Trái Đất là một chất điểm.", "C. Coi trục quay của Trái Đất là cố định trong thời gian ngắn.", "D. Coi chuyển động quay là đều."], "answer": "B", "explain": "Khi nghiên cứu chuyển động tự quay, kích thước và hình dạng Trái Đất là yếu tố bản chất (quyết định chuyển động quay) nên không thể coi là chất điểm. Mô hình chất điểm chỉ dùng khi kích thước không ảnh hưởng đến hiện tượng đang xét.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một bạn khẳng định: Vì đã có công thức tính, nên không cần làm thí nghiệm nữa. Theo tinh thần của bài học, ý kiến này", "options": ["A. đúng vì công thức luôn chính xác.", "B. sai vì công thức lí thuyết cần được thực nghiệm kiểm chứng và hoàn thiện.", "C. đúng vì thí nghiệm tốn thời gian.", "D. sai vì công thức chỉ dùng để trang trí."], "answer": "B", "explain": "Công thức là kết quả của suy luận lí thuyết; nó chỉ đáng tin khi đã qua kiểm chứng thực nghiệm, và thực nghiệm mới có thể giúp hoàn thiện công thức.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật lí là môn khoa học nghiên cứu các dạng vận động của vật chất và năng lượng.", "b) Cơ học, nhiệt học, điện học, quang học là các lĩnh vực của vật lí.", "c) Thực nghiệm là tiêu chuẩn kiểm chứng lí thuyết vật lí.", "d) Vật lí không có ứng dụng gì trong đời sống hằng ngày."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo bài học. d) Sai: điện, tủ lạnh, điện thoại... đều là ứng dụng của vật lí trong đời sống.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Coi ô tô là chất điểm khi tính thời gian đi hết quãng đường dài là hợp lí.", "b) Khi nghiên cứu va chạm của hai xe ô tô, có thể bỏ qua kích thước của xe.", "c) Mô hình cần giữ lại những yếu tố bản chất của hiện tượng.", "d) Suy luận giúp rút ra quy luật từ số liệu thực nghiệm."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: kích thước xe nhỏ không đáng kể so với quãng đường dài. b) Sai: khi nghiên cứu va chạm, kích thước và hình dạng xe là yếu tố bản chất, không được bỏ qua. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu tên lĩnh vực vật lí mà máy điều hòa nhiệt độ là một ứng dụng tiêu biểu.", "answer": "Nhiệt học", "explain": "Điều hòa nhiệt độ là máy lạnh hoạt động theo nguyên lí nhiệt học (lấy nhiệt từ trong phòng thải ra ngoài).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một bạn liệt kê 4 bước nghiên cứu: mô hình, quan sát và thực nghiệm, suy luận, kiểm chứng. Bước thứ ba trong dãy trên là bước nào?", "answer": "Suy luận", "explain": "Thứ tự đúng: (1) mô hình, (2) quan sát và thực nghiệm, (3) suy luận ra quy luật, (4) kiểm chứng. Bước thứ ba là suy luận.", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây là đúng?", "options": ["A. Vật lí nghiên cứu các dạng vận động của vật chất và năng lượng.", "B. Vật lí chỉ nghiên cứu các vật chuyển động.", "C. Vật lí không nghiên cứu về năng lượng.", "D. Vật lí chỉ nghiên cứu vũ trụ bao la."], "answer": "A", "explain": "Vật lí nghiên cứu các dạng vận động của vật chất và năng lượng, bao gồm cả vật đứng yên (trạng thái cũng là một dạng vận động) và mọi quy mô từ vi mô đến vĩ mô.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sóng âm do đàn ghi-ta phát ra thuộc phạm vi nghiên cứu của", "options": ["A. quang học.", "B. vật lí (phần âm học).", "C. hóa học hữu cơ.", "D. sinh học phân tử."], "answer": "B", "explain": "Âm thanh là dao động cơ lan truyền trong môi trường — đối tượng nghiên cứu của vật lí (âm học thuộc cơ học).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Pin mặt trời biến đổi quang năng thành điện năng là ứng dụng kết hợp của các lĩnh vực", "options": ["A. quang học và điện học.", "B. cơ học và nhiệt học.", "C. nhiệt học và âm học.", "D. cơ học và quang học."], "answer": "A", "explain": "Pin mặt trời thu nhận ánh sáng (quang học) và tạo ra dòng điện (điện học).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi dùng nhiệt kế đo nhiệt độ nước nhiều lần ở cùng điều kiện, ta đang thực hiện", "options": ["A. phương pháp mô hình.", "B. quan sát và thực nghiệm.", "C. suy luận toán học.", "D. kiểm chứng lí thuyết mới."], "answer": "B", "explain": "Dùng dụng cụ đo để thu thập số liệu là thực nghiệm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một học sinh nói: Mô hình Trái Đất quay quanh Mặt Trời theo quỹ đạo tròn là sai vì thực tế quỹ đạo là elip. Nhận xét đúng về ý kiến này là", "options": ["A. đúng, phải bỏ hẳn mô hình này.", "B. sai, vì mô hình là sự đơn giản hóa có chủ đích để tính toán thuận lợi, vẫn cho kết quả gần đúng.", "C. đúng, vật lí không được phép gần đúng.", "D. sai, vì quỹ đạo thật là đường thẳng."], "answer": "B", "explain": "Mô hình cho phép đơn giản hóa (elip gần tròn coi như tròn) để tính toán thuận lợi; sai số nhỏ vẫn chấp nhận được. Đó chính là bản chất của phương pháp mô hình.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để tìm hiểu vì sao dây đàn càng căng thì âm càng cao, thiết kế nghiên cứu đúng là", "options": ["A. chỉ gảy một dây duy nhất một lần rồi kết luận.", "B. thay đổi độ căng của dây, giữ nguyên các yếu tố khác, đo tần số âm và rút ra quy luật.", "C. hỏi bạn bè xem ai đồng ý.", "D. tra mạng rồi chép lại kết luận."], "answer": "B", "explain": "Nghiên cứu đúng phải thay đổi có kiểm soát một yếu tố (độ căng), cố định các yếu tố khác, đo đạc và rút ra quy luật — đó là thực nghiệm khoa học.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ánh sáng Mặt Trời sưởi ấm Trái Đất là hiện tượng vật lí.", "b) Gió thổi làm quay chong chóng là hiện tượng cơ học.", "c) Sự lên men của bột làm bánh thuộc đối tượng nghiên cứu của vật lí.", "d) Dòng điện làm sáng bóng đèn là hiện tượng vật lí."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: truyền năng lượng. b) Đúng: chuyển động của không khí tác dụng lực. c) Sai: lên men là quá trình sinh - hóa. d) Đúng: tác dụng của dòng điện.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nghiên cứu vật lí luôn bắt đầu bằng việc xây dựng mô hình.", "b) Số liệu thực nghiệm càng nhiều thì kết luận càng đáng tin cậy.", "c) Lí thuyết vật lí không bao giờ cần sửa đổi.", "d) Ứng dụng vật lí giúp cải thiện đời sống con người."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: mô hình là bước đầu đơn giản hóa đối tượng. b) Đúng: nhiều số liệu giúp giảm sai số ngẫu nhiên. c) Sai: lí thuyết được hoàn thiện dần theo thực nghiệm mới. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Hiện tượng sấm sét trong cơn dông thuộc lĩnh vực nào của vật lí (gợi ý: liên quan đến sự phóng điện trong khí quyển)?", "answer": "Điện học", "explain": "Sấm sét là hiện tượng phóng điện trong khí quyển — thuộc lĩnh vực điện học.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Có 5 thiết bị: bàn là, quạt điện, kính lúp, loa, nồi cơm điện. Có bao nhiêu thiết bị hoạt động chủ yếu dựa trên tác dụng nhiệt của dòng điện?", "answer": "2", "explain": "Bàn là và nồi cơm điện dùng tác dụng nhiệt của dòng điện để làm nóng. Quạt điện dùng tác dụng từ, loa dùng tác dụng từ của dòng điện biến đổi, kính lúp là quang học.", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Môn Vật lí ở trường phổ thông chủ yếu giúp học sinh", "options": ["A. hiểu các quy luật của tự nhiên và vận dụng vào đời sống.", "B. thuộc lòng mọi công thức mà không cần hiểu.", "C. tránh xa mọi thiết bị công nghệ.", "D. chỉ học để thi cử."], "answer": "A", "explain": "Mục tiêu của môn Vật lí là giúp học sinh hiểu quy luật tự nhiên và vận dụng giải quyết vấn đề thực tiễn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiện tượng nào sau đây KHÔNG thuộc đối tượng nghiên cứu của Vật lí?", "options": ["A. Nước sôi ở 100 độ C.", "B. Nam châm hút sắt.", "C. Cây cối quang hợp.", "D. Thác nước đổ từ trên cao xuống."], "answer": "C", "explain": "Quang hợp là quá trình sinh học. Các hiện tượng còn lại (sôi, từ tính, chuyển động) đều là hiện tượng vật lí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi xem dự báo thời tiết nói về áp suất khí quyển và gió, kiến thức vật lí được dùng thuộc lĩnh vực", "options": ["A. cơ học (chuyển động của khối khí) và nhiệt học.", "B. quang học.", "C. vật lí hạt nhân.", "D. âm học."], "answer": "A", "explain": "Gió là chuyển động của khối không khí (cơ học chất lưu), còn nhiệt độ, áp suất liên quan đến nhiệt học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bạn dùng phần mềm mô phỏng chuyển động của con lắc trên máy tính thay vì làm thí nghiệm thật. Đây là ví dụ của", "options": ["A. phương pháp mô hình (mô phỏng).", "B. quan sát trực tiếp.", "C. thực nghiệm với dụng cụ thật.", "D. suy luận không cần số liệu."], "answer": "A", "explain": "Mô phỏng trên máy tính là một dạng mô hình hóa: dùng mô hình toán học thay cho vật thật để nghiên cứu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao nói vật lí là cơ sở của nhiều ngành công nghệ hiện đại?", "options": ["A. Vì mọi kĩ sư đều phải học thuộc lòng sách vật lí.", "B. Vì các thiết bị công nghệ đều hoạt động dựa trên các định luật vật lí.", "C. Vì vật lí là môn học dễ nhất.", "D. Vì công nghệ không cần đến thực nghiệm."], "answer": "B", "explain": "Mọi thiết bị từ đơn giản đến phức tạp đều vận hành tuân theo các định luật vật lí; hiểu vật lí mới thiết kế, chế tạo và cải tiến được công nghệ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một nhóm học sinh tranh luận: nhóm X cho rằng chỉ cần học lí thuyết là đủ, nhóm Y cho rằng phải làm thí nghiệm. Theo bài học, quan điểm đúng là", "options": ["A. nhóm X đúng vì thí nghiệm mất thời gian.", "B. nhóm Y đúng một phần: cần kết hợp lí thuyết, mô hình và thực nghiệm trong chu trình nghiên cứu.", "C. cả hai nhóm đều sai, không cần học vật lí.", "D. nhóm X đúng vì sách đã viết sẵn kết quả thí nghiệm."], "answer": "B", "explain": "Chu trình nghiên cứu vật lí đòi hỏi phối hợp mô hình, quan sát - thực nghiệm và suy luận. Lí thuyết cần thực nghiệm kiểm chứng; thực nghiệm cần lí thuyết định hướng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Học vật lí giúp ta giải thích được nhiều hiện tượng tự nhiên.", "b) Công nghệ hiện đại đều dựa trên các thành tựu của vật lí.", "c) Chỉ có nhà khoa học mới cần học vật lí.", "d) Vật lí góp phần bảo vệ môi trường thông qua công nghệ sạch."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng theo bài học. c) Sai: mọi người đều cần hiểu biết vật lí để sử dụng công nghệ an toàn, hiệu quả trong đời sống.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mô phỏng chuyển động trên máy tính là một dạng mô hình.", "b) Thực nghiệm giúp phát hiện những điều lí thuyết chưa dự đoán được.", "c) Một lí thuyết bị thực nghiệm bác bỏ thì phải sửa đổi hoặc loại bỏ.", "d) Càng nhiều công thức càng chứng tỏ lí thuyết đúng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: thực nghiệm có thể mở ra hướng nghiên cứu mới. c) Đúng: thực nghiệm là tiêu chuẩn cuối cùng. d) Sai: tính đúng đắn do thực nghiệm quyết định, không phải số lượng công thức.", "points": 1}, {"type": "short", "level": "VD", "q": "Nêu tên một thiết bị y học ứng dụng vật lí để nhìn thấy cấu trúc bên trong cơ thể mà bài học đã nhắc tới.", "answer": "Máy X-quang", "explain": "Máy chụp X-quang (chấp nhận máy siêu âm, máy MRI) là ứng dụng của vật lí trong y học để chẩn đoán bệnh.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một bạn kể tên các bước nghiên cứu vật lí nhưng viết sai thứ tự: suy luận, mô hình, kiểm chứng, quan sát và thực nghiệm. Hãy viết lại bước đứng đầu tiên theo thứ tự đúng.", "answer": "mô hình", "explain": "Thứ tự đúng: mô hình, quan sát và thực nghiệm, suy luận, kiểm chứng. Bước đầu tiên là xây dựng mô hình.", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Câu nào dưới đây nêu đúng đối tượng nghiên cứu của Vật lí?", "options": ["A. Các dạng vận động của vật chất và năng lượng.", "B. Tâm lí và hành vi của con người.", "C. Sự tiến hóa của các loài sinh vật.", "D. Lịch sử hình thành các quốc gia."], "answer": "A", "explain": "Định nghĩa chuẩn trong bài học: Vật lí nghiên cứu các dạng vận động của vật chất và năng lượng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đồng hồ treo tường chạy bằng pin hoạt động dựa trên kiến thức của lĩnh vực", "options": ["A. điện học và cơ học.", "B. quang học.", "C. nhiệt học.", "D. vật lí hạt nhân."], "answer": "A", "explain": "Pin cung cấp điện năng (điện học) làm mạch dao động, kim đồng hồ chuyển động (cơ học).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi nấu ăn bằng bếp từ, kiến thức vật lí được vận dụng thuộc lĩnh vực", "options": ["A. điện từ (dòng điện cảm ứng làm nóng nồi).", "B. quang học.", "C. âm học.", "D. cơ học chất rắn."], "answer": "A", "explain": "Bếp từ dùng dòng điện cảm ứng (hiện tượng điện từ) để làm nóng đáy nồi — kiến thức điện học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để xác định quy luật, sau khi có số liệu thực nghiệm nhà vật lí thường", "options": ["A. vẽ đồ thị, dùng toán học suy luận tìm mối liên hệ.", "B. cất số liệu vào tủ.", "C. đoán mò kết quả.", "D. xóa số liệu đi."], "answer": "A", "explain": "Xử lí số liệu bằng đồ thị và toán học để suy luận ra quy luật là bước tiếp theo sau thực nghiệm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một học sinh cho rằng học vật lí chỉ để thi, ngoài đời không dùng đến. Lập luận phản bác thuyết phục nhất là", "options": ["A. vật lí giúp giải thích và sử dụng an toàn các thiết bị quanh ta như điện, bếp từ, điều hòa.", "B. vật lí là môn bắt buộc.", "C. thầy cô yêu cầu phải học.", "D. bạn bè đều học vật lí."], "answer": "A", "explain": "Vật lí hiện diện khắp đời sống: sử dụng điện an toàn, hiểu nguyên lí thiết bị, tiết kiệm năng lượng... — đó là giá trị thực tiễn của môn học.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Có ý kiến: Khoa học càng phát triển thì các định luật vật lí cũ càng bị bác bỏ hoàn toàn. Đánh giá đúng là", "options": ["A. đúng, kiến thức cũ đều sai hết.", "B. sai, các định luật cũ vẫn đúng trong phạm vi áp dụng của chúng và được mở rộng bởi lí thuyết mới.", "C. đúng, nên không cần học các định luật cũ.", "D. sai, vì khoa học không bao giờ phát triển."], "answer": "B", "explain": "Lí thuyết mới thường bao hàm lí thuyết cũ như trường hợp riêng (ví dụ cơ học Newton vẫn đúng ở tốc độ thường ngày, thuyết tương đối mở rộng ra tốc độ lớn). Khoa học phát triển bằng cách hoàn thiện, không phải phủ nhận sạch trơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bếp từ làm nóng nồi nhờ hiện tượng điện từ.", "b) Điều hòa nhiệt độ là ứng dụng của nhiệt học.", "c) Kính lúp giúp nhìn rõ vật nhỏ nhờ hiện tượng khúc xạ ánh sáng.", "d) Vật lí không liên quan đến việc sử dụng điện an toàn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: hiểu biết về điện (vật lí) giúp sử dụng điện an toàn, tránh điện giật, chập cháy.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị giúp phát hiện quy luật từ số liệu thực nghiệm.", "b) Mô hình chất điểm áp dụng được cho mọi tình huống.", "c) Thực nghiệm có kiểm soát giúp xác định nguyên nhân của hiện tượng.", "d) Học vật lí góp phần hình thành tư duy khoa học."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: chỉ dùng khi kích thước vật không ảnh hưởng đến hiện tượng đang xét. c) Đúng: cố định các yếu tố khác, thay đổi một yếu tố để thấy ảnh hưởng. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Thiết bị biến đổi quang năng thành điện năng (thường đặt trên mái nhà) có tên gọi là gì?", "answer": "Pin mặt trời", "explain": "Pin mặt trời (tấm pin quang điện) biến đổi quang năng thành điện năng, là ứng dụng kết hợp của quang học và điện học.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong 4 lĩnh vực: cơ học, nhiệt học, điện học, quang học, có bao nhiêu lĩnh vực liên quan trực tiếp đến hoạt động của chiếc quạt điện (động cơ điện làm quay cánh quạt)?", "answer": "2", "explain": "Quạt điện liên quan đến điện học (động cơ điện biến điện năng thành cơ năng) và cơ học (cánh quạt chuyển động quay tạo gió).", "points": 0.5}]},
{"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Vật lí học là môn khoa học nghiên cứu", "options": ["A. các dạng vận động của vật chất và năng lượng.", "B. cách chăm sóc cây trồng.", "C. cách pha chế thuốc.", "D. các triều đại phong kiến."], "answer": "A", "explain": "Định nghĩa trong bài học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhà máy điện gió biến đổi dạng năng lượng nào thành điện năng?", "options": ["A. Cơ năng của gió thành điện năng.", "B. Nhiệt năng thành điện năng.", "C. Quang năng thành điện năng.", "D. Hóa năng thành điện năng."], "answer": "A", "explain": "Turbine gió quay (cơ năng) làm quay máy phát điện tạo ra điện năng — ứng dụng của cơ học và điện học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi đi xe đạp, líp và xích truyền chuyển động. Kiến thức vật lí liên quan thuộc lĩnh vực", "options": ["A. cơ học (truyền chuyển động quay).", "B. quang học.", "C. nhiệt học.", "D. điện học."], "answer": "A", "explain": "Xích líp truyền chuyển động quay từ đĩa sang líp — hiện tượng cơ học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bước kiểm chứng trong chu trình nghiên cứu có mục đích", "options": ["A. làm lại thí nghiệm cũ cho vui.", "B. xác nhận lại quy luật bằng thực nghiệm mới, tăng độ tin cậy.", "C. xóa bỏ mọi kết quả trước đó.", "D. chứng minh nhà khoa học luôn đúng."], "answer": "B", "explain": "Kiểm chứng bằng thực nghiệm mới, độc lập giúp khẳng định quy luật rút ra là đúng đắn, tăng độ tin cậy.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một bạn dùng mô hình hệ Mặt Trời thu nhỏ để giải thích ngày đêm. Ưu điểm của cách làm này là", "options": ["A. mô hình giúp hình dung trực quan hiện tượng phức tạp một cách đơn giản.", "B. mô hình thay thế được hoàn toàn Trái Đất thật.", "C. mô hình luôn cho số liệu chính xác tuyệt đối.", "D. không cần học lí thuyết nữa."], "answer": "A", "explain": "Ưu điểm của mô hình là đơn giản hóa, giúp hình dung trực quan hiện tượng phức tạp. Mô hình không thay thế hoàn toàn vật thật và vẫn có sai số.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để trả lời câu hỏi Vì sao áo trắng phơi nắng nhanh khô hơn áo đen?, cách tiếp cận đúng theo tinh thần vật lí là", "options": ["A. khẳng định ngay áo trắng hút nắng tốt hơn.", "B. tìm hiểu về sự hấp thụ bức xạ nhiệt của các màu, làm thí nghiệm so sánh rồi kết luận.", "C. hỏi đa số bạn bè tin màu nào.", "D. bỏ qua vì không quan trọng."], "answer": "B", "explain": "Cách tiếp cận khoa học: tìm hiểu lí thuyết (vật đen hấp thụ bức xạ tốt hơn nên thực ra áo đen hấp thụ nhiệt mạnh hơn), làm thí nghiệm so sánh có kiểm soát rồi mới kết luận. (Thực tế áo đen hấp thụ nhiệt mạnh hơn nên khô nhanh hơn khi phơi nắng trực tiếp.)", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhà máy điện gió biến cơ năng của gió thành điện năng.", "b) Xe đạp truyền chuyển động nhờ xích và líp.", "c) Vật lí chỉ có ích cho các nhà khoa học.", "d) Hiểu biết vật lí giúp sử dụng các thiết bị điện an toàn."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: kiến thức vật lí cần thiết cho mọi người trong đời sống hằng ngày.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chu trình nghiên cứu vật lí gồm mô hình, thực nghiệm, suy luận và kiểm chứng.", "b) Mô hình hệ Mặt Trời thu nhỏ giúp hình dung hiện tượng ngày đêm.", "c) Thí nghiệm so sánh có kiểm soát cho kết luận đáng tin cậy.", "d) Áo đen hấp thụ bức xạ nhiệt tốt hơn áo trắng."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng: mô hình trực quan hóa hiện tượng. c) Đúng. d) Đúng: vật màu sẫm hấp thụ bức xạ nhiệt tốt hơn vật màu sáng.", "points": 1}, {"type": "short", "level": "VD", "q": "Kể tên một nguồn năng lượng tái tạo mà bài học nhắc tới như thành tựu ứng dụng vật lí.", "answer": "Điện mặt trời", "explain": "Bài học nhắc tới điện mặt trời và điện gió là các nguồn năng lượng tái tạo, công nghệ sạch ứng dụng vật lí.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Có 4 nhận định về học vật lí: (1) giúp giải thích hiện tượng tự nhiên, (2) là cơ sở của công nghệ, (3) giúp dùng thiết bị an toàn, (4) chỉ phục vụ thi cử. Có bao nhiêu nhận định đúng?", "answer": "3", "explain": "Ba nhận định (1), (2), (3) đúng theo bài học. Nhận định (4) sai: giá trị của vật lí vượt xa thi cử, gắn với đời sống và công nghệ.", "points": 0.5}]}]}
