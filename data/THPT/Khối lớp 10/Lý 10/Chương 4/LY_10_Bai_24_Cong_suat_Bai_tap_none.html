e": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công suất đặc trưng cho tốc độ thực hiện công của máy.","b) Đơn vị mã lực (HP) dùng để đo công suất, $1\\ \\text{HP} = 736\\ \\text{W}$.","c) Hai máy có cùng công suất thì thực hiện công bằng nhau trong cùng thời gian.","d) Công suất là đại lượng vectơ."],"answer": ["T","T","T","F"],"explain": "a) Đúng (định nghĩa). b) Đúng: $1\\ \\text{HP} = 736\\ \\text{W}$. c) Đúng: $A = Pt$. d) Sai: công suất là đại lượng vô hướng.","points": 1},{"type": "truefalse","level": "VD","q": "Một động cơ có công suất $500\\ \\text{W}$ hoạt động liên tục trong $2$ phút. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công mà động cơ thực hiện bằng $60000\\ \\text{J}$.","b) Đổi ra kilôjun được $60\\ \\text{kJ}$.","c) Nếu thời gian tăng gấp đôi thì công tăng gấp đôi.","d) Công suất $500\\ \\text{W}$ tương đương $0,5\\ \\text{kW}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $A = Pt = 500 \\cdot 120 = 60000\\ \\text{J}$. b) Đúng: $60000\\ \\text{J} = 60\\ \\text{kJ}$. c) Đúng: $A$ tỉ lệ thuận với $t$. d) Đúng: $500\\ \\text{W} = 0,5\\ \\text{kW}$.","points": 1},{"type": "short","level": "VD","q": "Một cần cẩu nâng vật khối lượng $200\\ \\text{kg}$ lên cao $10\\ \\text{m}$ trong $25\\ \\text{s}$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất của cần cẩu bằng bao nhiêu oát? (chỉ điền số)","answer": "800","explain": "$A = mgh = 200 \\cdot 10 \\cdot 10 = 20000\\ \\text{J}$. $P = A/t = 20000/25 = 800\\ \\text{W}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một ô tô chuyển động đều với tốc độ $15\\ \\text{m/s}$, lực kéo của động cơ $1200\\ \\text{N}$. Công suất của động cơ bằng bao nhiêu kilôoát? (chỉ điền số)","answer": "18","explain": "Với chuyển động đều, $P = Fv = 1200 \\cdot 15 = 18000\\ \\text{W} = 18\\ \\text{kW}$.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "NB","q": "Khi lực $F$ không đổi cùng hướng với vận tốc $v$ của vật, công suất tức thời được tính bằng","options": ["A. $P = Fv$.","B. $P = F/v$.","C. $P = Fvt$.","D. $P = \\frac{1}{2}Fv$."],"answer": "A","explain": "$P = A/t = Fs/t = Fv$ khi lực cùng hướng với vận tốc.","points": 0.25},{"type": "mcq","level": "NB","q": "$1\\ \\text{HP}$ (mã lực) bằng","options": ["A. $736\\ \\text{W}$.","B. $1000\\ \\text{W}$.","C. $1\\ \\text{W}$.","D. $3600\\ \\text{W}$."],"answer": "A","explain": "Theo quy ước, $1\\ \\text{HP} = 736\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "NB","q": "Đại lượng nào sau đây đặc trưng cho tốc độ thực hiện công?","options": ["A. Công suất.","B. Công cơ học.","C. Năng lượng.","D. Lực."],"answer": "A","explain": "Công suất đặc trưng cho tốc độ (nhanh hay chậm) thực hiện công.","points": 0.25},{"type": "mcq","level": "NB","q": "Một máy có công suất càng lớn thì","options": ["A. thực hiện công càng nhanh.","B. thực hiện công càng nhiều.","C. tiêu thụ càng ít năng lượng.","D. hoạt động càng lâu."],"answer": "A","explain": "Công suất lớn nghĩa là tốc độ sinh công lớn, không nói lên tổng công (còn phụ thuộc thời gian).","points": 0.25},{"type": "mcq","level": "TH","q": "Một người kéo gàu nước khối lượng $10\\ \\text{kg}$ từ giếng sâu $8\\ \\text{m}$ lên trong $20\\ \\text{s}$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất trung bình của người bằng","options": ["A. $40\\ \\text{W}$.","B. $160\\ \\text{W}$.","C. $800\\ \\text{J}$.","D. $16\\ \\text{W}$."],"answer": "A","explain": "$A = mgh = 10 \\cdot 10 \\cdot 8 = 800\\ \\text{J}$. $P = 800/20 = 40\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một bóng đèn có công suất $60\\ \\text{W}$. Điện năng mà đèn tiêu thụ trong $1$ giờ bằng","options": ["A. $216000\\ \\text{J}$.","B. $60\\ \\text{J}$.","C. $3600\\ \\text{J}$.","D. $2160\\ \\text{J}$."],"answer": "A","explain": "$A = Pt = 60 \\cdot 3600 = 216000\\ \\text{J}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) $P = \\frac{A}{t}$ cho công suất trung bình trong khoảng thời gian $t$.","b) $1\\ \\text{kW} = 1000\\ \\text{W}$.","c) Công suất có thể đo bằng đơn vị mã lực (HP).","d) Máy có công suất $100\\ \\text{W}$ thực hiện công $100\\ \\text{J}$ trong $1\\ \\text{s}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: đó là công suất trung bình. b) Đúng. c) Đúng: HP là đơn vị công suất ngoài hệ SI. d) Đúng: $A = Pt = 100 \\cdot 1 = 100\\ \\text{J}$.","points": 1},{"type": "truefalse","level": "VD","q": "Một thang máy khối lượng $800\\ \\text{kg}$ đi lên đều $12\\ \\text{m}$ trong $20\\ \\text{s}$ (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công của lực kéo động cơ bằng $96000\\ \\text{J}$.","b) Công suất của động cơ bằng $4800\\ \\text{W}$.","c) Nếu thời gian đi lên giảm một nửa thì công suất tăng gấp đôi.","d) Công của trọng lực trong quá trình này bằng $96000\\ \\text{J}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $A = mgh = 800 \\cdot 10 \\cdot 12 = 96000\\ \\text{J}$. b) Đúng: $P = 96000/20 = 4800\\ \\text{W}$. c) Đúng: $P = A/t$, $t$ giảm một nửa thì $P$ tăng gấp đôi. d) Sai: trọng lực ngược hướng đi nên $A_P = -96000\\ \\text{J}$.","points": 1},{"type": "short","level": "VD","q": "Một máy bơm đưa $300\\ \\text{kg}$ nước lên cao $10\\ \\text{m}$ trong $50\\ \\text{s}$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất có ích của máy bơm bằng bao nhiêu oát? (chỉ điền số)","answer": "600","explain": "$A = 300 \\cdot 10 \\cdot 10 = 30000\\ \\text{J}$. $P = 30000/50 = 600\\ \\text{W}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một xe tải chuyển động đều lên dốc với tốc độ $5\\ \\text{m/s}$; lực kéo của động cơ $8000\\ \\text{N}$. Công suất của động cơ bằng bao nhiêu kilôoát? (chỉ điền số)","answer": "40","explain": "$P = Fv = 8000 \\cdot 5 = 40000\\ \\text{W} = 40\\ \\text{kW}$.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Công suất trung bình của một máy trong khoảng thời gian $t$ được tính bằng","options": ["A. $P = \\frac{A}{t}$.","B. $P = \\frac{t}{A}$.","C. $P = A + t$.","D. $P = A - t$."],"answer": "A","explain": "Công suất trung bình bằng công thực hiện chia cho thời gian thực hiện.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong các đơn vị sau, đơn vị nào KHÔNG phải đơn vị công suất?","options": ["A. Jun (J).","B. Oát (W).","C. Kilôoát (kW).","D. Mã lực (HP)."],"answer": "A","explain": "Jun là đơn vị công (năng lượng). Oát, kilôoát, mã lực đều là đơn vị công suất.","points": 0.25},{"type": "mcq","level": "NB","q": "Một động cơ có công suất $1\\ \\text{kW}$ nghĩa là","options": ["A. mỗi giây động cơ thực hiện công $1000\\ \\text{J}$.","B. mỗi giây động cơ thực hiện công $1\\ \\text{J}$.","C. động cơ thực hiện tổng cộng $1000\\ \\text{J}$.","D. động cơ dùng lực $1000\\ \\text{N}$."],"answer": "A","explain": "$1\\ \\text{kW} = 1000\\ \\text{W} = 1000\\ \\text{J/s}$: mỗi giây sinh công $1000\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "NB","q": "Một máy kéo thực hiện công $36000\\ \\text{J}$ trong $1$ phút. Công suất của máy bằng","options": ["A. $600\\ \\text{W}$.","B. $36000\\ \\text{W}$.","C. $60\\ \\text{W}$.","D. $2160000\\ \\text{W}$."],"answer": "A","explain": "$t = 60\\ \\text{s}$, $P = 36000/60 = 600\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vận động viên nâng tạ khối lượng $100\\ \\text{kg}$ lên cao $2\\ \\text{m}$ trong $4\\ \\text{s}$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất trung bình của vận động viên bằng","options": ["A. $500\\ \\text{W}$.","B. $2000\\ \\text{W}$.","C. $800\\ \\text{W}$.","D. $50\\ \\text{W}$."],"answer": "A","explain": "$A = 100 \\cdot 10 \\cdot 2 = 2000\\ \\text{J}$. $P = 2000/4 = 500\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Hai máy cùng thực hiện một công $A$; máy 1 mất thời gian $t_1$, máy 2 mất thời gian $t_2 = 2t_1$. So sánh công suất:","options": ["A. $P_1 = 2P_2$.","B. $P_2 = 2P_1$.","C. $P_1 = P_2$.","D. $P_1 = 4P_2$."],"answer": "A","explain": "$P = A/t$ nên thời gian gấp đôi thì công suất bằng một nửa: $P_1 = A/t_1 = 2A/(2t_1) = 2P_2$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công suất cho biết máy thực hiện công nhanh hay chậm.","b) $1\\ \\text{W} = 1\\ \\text{J/s}$.","c) Công suất càng lớn thì tổng công thực hiện càng lớn.","d) Có thể đo công suất bằng đơn vị jun trên giây."],"answer": ["T","T","F","T"],"explain": "a) Đúng (định nghĩa). b) Đúng. c) Sai: tổng công còn phụ thuộc thời gian ($A = Pt$). d) Đúng: $\\text{J/s}$ chính là oát.","points": 1},{"type": "truefalse","level": "VD","q": "Một ô tô khối lượng $1200\\ \\text{kg}$ chuyển động đều với tốc độ $20\\ \\text{m/s}$ trên đường ngang; lực cản $600\\ \\text{N}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lực kéo của động cơ bằng $600\\ \\text{N}$.","b) Công suất của động cơ bằng $12000\\ \\text{W}$.","c) Trong $10\\ \\text{s}$, động cơ thực hiện công $120000\\ \\text{J}$.","d) Nếu tốc độ tăng gấp đôi thì công suất tăng gấp đôi."],"answer": ["T","T","T","T"],"explain": "a) Đúng: chuyển động đều nên $F_{kéo} = F_c = 600\\ \\text{N}$. b) Đúng: $P = 600 \\cdot 20 = 12000\\ \\text{W}$. c) Đúng: $A = Pt = 12000 \\cdot 10 = 120000\\ \\text{J}$. d) Đúng: $P = Fv$ tỉ lệ thuận với $v$ khi $F$ không đổi.","points": 1},{"type": "short","level": "VD","q": "Một máy có công suất $2,5\\ \\text{kW}$ hoạt động trong $40\\ \\text{s}$. Công mà máy thực hiện bằng bao nhiêu kilôjun? (chỉ điền số)","answer": "100","explain": "$A = Pt = 2500 \\cdot 40 = 100000\\ \\text{J} = 100\\ \\text{kJ}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một cần cẩu nâng đều kiện hàng $500\\ \\text{kg}$ với tốc độ $0,4\\ \\text{m/s}$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất của cần cẩu bằng bao nhiêu oát? (chỉ điền số)","answer": "2000","explain": "Nâng đều nên $F = mg = 5000\\ \\text{N}$. $P = Fv = 5000 \\cdot 0,4 = 2000\\ \\text{W}$.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "NB","q": "Biểu thức $P = Fv$ được áp dụng khi","options": ["A. lực $F$ không đổi và cùng hướng với vận tốc $v$.","B. lực $F$ vuông góc với vận tốc $v$.","C. vật đứng yên.","D. lực $F$ thay đổi theo thời gian."],"answer": "A","explain": "$P = A/t = Fs/t = Fv$ với điều kiện $F$ cùng hướng chuyển động (khi đó $s/t = v$).","points": 0.25},{"type": "mcq","level": "NB","q": "Đổi $7360\\ \\text{W}$ ra mã lực (HP):","options": ["A. $10\\ \\text{HP}$.","B. $1\\ \\text{HP}$.","C. $100\\ \\text{HP}$.","D. $7,36\\ \\text{HP}$."],"answer": "A","explain": "$1\\ \\text{HP} = 736\\ \\text{W}$ nên $7360\\ \\text{W} = 10\\ \\text{HP}$.","points": 0.25},{"type": "mcq","level": "NB","q": "Công suất tức thời cho biết","options": ["A. tốc độ sinh công tại một thời điểm.","B. tổng công đã thực hiện.","C. lực tác dụng tại một thời điểm.","D. quãng đường đi được."],"answer": "A","explain": "Công suất tức thời đặc trưng cho tốc độ sinh công ngay tại thời điểm xét.","points": 0.25},{"type": "mcq","level": "TH","q": "Một máy bơm có công suất $1500\\ \\text{W}$. Trong $2$ phút, máy thực hiện công bằng","options": ["A. $180000\\ \\text{J}$.","B. $3000\\ \\text{J}$.","C. $750\\ \\text{J}$.","D. $300\\ \\text{J}$."],"answer": "A","explain": "$A = Pt = 1500 \\cdot 120 = 180000\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người đi xe đạp với lực đạp $60\\ \\text{N}$, tốc độ $5\\ \\text{m/s}$. Công suất của người bằng","options": ["A. $300\\ \\text{W}$.","B. $12\\ \\text{W}$.","C. $65\\ \\text{W}$.","D. $3000\\ \\text{W}$."],"answer": "A","explain": "$P = Fv = 60 \\cdot 5 = 300\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một thang máy đi lên đều với tốc độ $1,5\\ \\text{m/s}$; tổng khối lượng thang và người $600\\ \\text{kg}$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất của động cơ bằng","options": ["A. $9000\\ \\text{W}$.","B. $400\\ \\text{W}$.","C. $900\\ \\text{W}$.","D. $1500\\ \\text{W}$."],"answer": "A","explain": "$F = mg = 6000\\ \\text{N}$. $P = Fv = 6000 \\cdot 1,5 = 9000\\ \\text{W}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Muốn tăng công suất của động cơ khi lực kéo không đổi, phải tăng tốc độ.","b) Công suất $1\\ \\text{HP}$ xấp xỉ $0,736\\ \\text{kW}$.","c) Đơn vị oát được đặt theo tên nhà bác học James Watt.","d) Công suất của người đi bộ khoảng vài trăm oát."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $P = Fv$. b) Đúng: $736\\ \\text{W} = 0,736\\ \\text{kW}$. c) Đúng. d) Đúng: người đi bộ có công suất cỡ $100$–$200\\ \\text{W}$.","points": 1},{"type": "truefalse","level": "VD","q": "Một xe máy chuyển động đều với tốc độ $10\\ \\text{m/s}$; công suất của động cơ $3000\\ \\text{W}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lực kéo của động cơ bằng $300\\ \\text{N}$.","b) Trong $1$ phút, động cơ thực hiện công $180000\\ \\text{J}$.","c) Nếu giữ nguyên lực kéo mà tốc độ tăng lên $15\\ \\text{m/s}$ thì công suất là $4500\\ \\text{W}$.","d) Công suất $3000\\ \\text{W}$ tương đương khoảng $4,08\\ \\text{HP}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $F = P/v = 3000/10 = 300\\ \\text{N}$. b) Đúng: $A = 3000 \\cdot 60 = 180000\\ \\text{J}$. c) Đúng: $P = 300 \\cdot 15 = 4500\\ \\text{W}$. d) Đúng: $3000/736 \\approx 4,08$.","points": 1},{"type": "short","level": "VDC","q": "Một động cơ điện có công suất $800\\ \\text{W}$ kéo vật nặng lên đều. Sau $30\\ \\text{s}$, công mà động cơ thực hiện bằng bao nhiêu kilôjun? (chỉ điền số)","answer": "24","explain": "$A = Pt = 800 \\cdot 30 = 24000\\ \\text{J} = 24\\ \\text{kJ}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một ô tô khối lượng $1000\\ \\text{kg}$ lên dốc nghiêng $30^\\circ$ với tốc độ không đổi $10\\ \\text{m/s}$; lực ma sát $1000\\ \\text{N}$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất của động cơ bằng bao nhiêu kilôoát? (chỉ điền số)","answer": "60","explain": "$F_{kéo} = mg\\sin 30^\\circ + F_{ms} = 5000 + 1000 = 6000\\ \\text{N}$. $P = 6000 \\cdot 10 = 60000\\ \\text{W} = 60\\ \\text{kW}$.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Công suất của một máy cho biết","options": ["A. máy đó thực hiện công nhanh hay chậm.","B. lực mà máy tác dụng.","C. năng lượng mà máy tiêu thụ.","D. thời gian máy hoạt động."],"answer": "A","explain": "Công suất đặc trưng cho tốc độ thực hiện công.","points": 0.25},{"type": "mcq","level": "NB","q": "$3\\ \\text{kW}$ bằng bao nhiêu oát?","options": ["A. $3000\\ \\text{W}$.","B. $300\\ \\text{W}$.","C. $30\\ \\text{W}$.","D. $30000\\ \\text{W}$."],"answer": "A","explain": "$1\\ \\text{kW} = 1000\\ \\text{W}$ nên $3\\ \\text{kW} = 3000\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị nào sau đây dùng để đo công suất?","options": ["A. Mã lực (HP).","B. Jun (J).","C. Niutơn (N).","D. Mét trên giây (m/s)."],"answer": "A","explain": "Mã lực là đơn vị công suất ngoài hệ SI ($1\\ \\text{HP} = 736\\ \\text{W}$).","points": 0.25},{"type": "mcq","level": "TH","q": "Một cần cẩu thực hiện công $50000\\ \\text{J}$ trong $50\\ \\text{s}$. Công suất của cần cẩu bằng","options": ["A. $1000\\ \\text{W}$.","B. $2500000\\ \\text{W}$.","C. $100\\ \\text{W}$.","D. $49950\\ \\text{W}$."],"answer": "A","explain": "$P = 50000/50 = 1000\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một động cơ có công suất $2000\\ \\text{W}$ kéo vật chuyển động đều với tốc độ $4\\ \\text{m/s}$. Lực kéo của động cơ bằng","options": ["A. $500\\ \\text{N}$.","B. $8000\\ \\text{N}$.","C. $2004\\ \\text{N}$.","D. $50\\ \\text{N}$."],"answer": "A","explain": "$P = Fv$ nên $F = P/v = 2000/4 = 500\\ \\text{N}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một học sinh chạy lên cầu thang cao $3\\ \\text{m}$ trong $5\\ \\text{s}$; khối lượng học sinh $50\\ \\text{kg}$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất trung bình của học sinh bằng","options": ["A. $300\\ \\text{W}$.","B. $1500\\ \\text{W}$.","C. $750\\ \\text{W}$.","D. $83\\ \\text{W}$."],"answer": "A","explain": "$A = mgh = 50 \\cdot 10 \\cdot 3 = 1500\\ \\text{J}$. $P = 1500/5 = 300\\ \\text{W}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công suất là đại lượng vô hướng.","b) $P = Fv$ chỉ đúng khi lực cùng hướng với vận tốc.","c) Hai động cơ có công suất bằng nhau thì trong cùng thời gian thực hiện công bằng nhau.","d) Đơn vị của công suất trong hệ SI là jun."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng: điều kiện áp dụng của $P = Fv$. c) Đúng: $A = Pt$. d) Sai: đơn vị công suất là oát.","points": 1},{"type": "truefalse","level": "VD","q": "Một máy bơm có công suất $1000\\ \\text{W}$, hiệu suất $80\\%$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Mỗi giây máy bơm thực hiện công có ích $800\\ \\text{J}$.","b) Trong $1$ phút, công có ích của máy bơm là $48000\\ \\text{J}$.","c) Công suất có ích của máy bơm là $800\\ \\text{W}$.","d) Công suất toàn phần của máy bơm là $800\\ \\text{W}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $P_{có ích} = 0,8 \\cdot 1000 = 800\\ \\text{W} = 800\\ \\text{J/s}$. b) Đúng: $800 \\cdot 60 = 48000\\ \\text{J}$. c) Đúng. d) Sai: công suất toàn phần là $1000\\ \\text{W}$.","points": 1},{"type": "short","level": "VDC","q": "Một ô tô có công suất $60000\\ \\text{W}$ chuyển động đều trên đường ngang. Biết lực cản $1500\\ \\text{N}$. Tốc độ của ô tô bằng bao nhiêu m/s? (chỉ điền số)","answer": "40","explain": "Chuyển động đều: $F_{kéo} = F_c = 1500\\ \\text{N}$. $v = P/F = 60000/1500 = 40\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một thác nước cao $20\\ \\text{m}$, mỗi giây có $500\\ \\text{kg}$ nước đổ xuống (lấy $g = 10\\ \\text{m/s}^2$). Công suất của dòng nước bằng bao nhiêu kilôoát? (chỉ điền số)","answer": "100","explain": "Mỗi giây: $A = mgh = 500 \\cdot 10 \\cdot 20 = 100000\\ \\text{J}$. $P = 100000\\ \\text{W} = 100\\ \\text{kW}$.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Kí hiệu $P$ trong công thức $P = \\frac{A}{t}$ là","options": ["A. công suất.","B. công cơ học.","C. trọng lượng.","D. áp suất."],"answer": "A","explain": "$P$ là kí hiệu của công suất (power).","points": 0.25},{"type": "mcq","level": "NB","q": "Phát biểu nào sau đây đúng?","options": ["A. Oát là công suất của máy thực hiện công $1\\ \\text{J}$ trong $1\\ \\text{s}$.","B. Oát là công thực hiện trong $1\\ \\text{s}$ của lực $1\\ \\text{N}$.","C. Jun là đơn vị của công suất.","D. Mã lực là đơn vị của công."],"answer": "A","explain": "$1\\ \\text{W} = 1\\ \\text{J/s}$ đúng theo định nghĩa.","points": 0.25},{"type": "mcq","level": "NB","q": "Một máy hoạt động với công suất không đổi. Thời gian để máy thực hiện công $A$ là","options": ["A. $t = \\frac{A}{P}$.","B. $t = A \\cdot P$.","C. $t = \\frac{P}{A}$.","D. $t = A + P$."],"answer": "A","explain": "Từ $P = A/t$ suy ra $t = A/P$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một động cơ $5\\ \\text{HP}$ có công suất bằng","options": ["A. $3680\\ \\text{W}$.","B. $5000\\ \\text{W}$.","C. $736\\ \\text{W}$.","D. $368\\ \\text{W}$."],"answer": "A","explain": "$5 \\cdot 736 = 3680\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người đẩy xe hàng với lực $100\\ \\text{N}$, xe chuyển động đều với tốc độ $1,2\\ \\text{m/s}$. Công suất của người bằng","options": ["A. $120\\ \\text{W}$.","B. $83\\ \\text{W}$.","C. $101,2\\ \\text{W}$.","D. $1200\\ \\text{W}$."],"answer": "A","explain": "$P = Fv = 100 \\cdot 1,2 = 120\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một máy nâng vật $300\\ \\text{kg}$ lên cao $6\\ \\text{m}$ trong $15\\ \\text{s}$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất của máy bằng","options": ["A. $1200\\ \\text{W}$.","B. $18000\\ \\text{W}$.","C. $270000\\ \\text{W}$.","D. $200\\ \\text{W}$."],"answer": "A","explain": "$A = 300 \\cdot 10 \\cdot 6 = 18000\\ \\text{J}$. $P = 18000/15 = 1200\\ \\text{W}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khi cùng thực hiện một công, máy nào mất ít thời gian hơn thì công suất lớn hơn.","b) $1\\ \\text{kW} = 1000\\ \\text{J/s}$.","c) Công suất tức thời $P = Fv$ với $v$ là tốc độ tức thời.","d) Công suất của động cơ xe máy khoảng vài chục kilôoát."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $P = A/t$. b) Đúng: $1\\ \\text{kW} = 1000\\ \\text{W} = 1000\\ \\text{J/s}$. c) Đúng. d) Sai: động cơ xe máy thường có công suất vài kilôoát (không đến vài chục).","points": 1},{"type": "truefalse","level": "VD","q": "Một cần cẩu nâng đều container $2000\\ \\text{kg}$ lên cao $15\\ \\text{m}$ trong $30\\ \\text{s}$ (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công của lực nâng bằng $300000\\ \\text{J}$.","b) Công suất của cần cẩu bằng $10000\\ \\text{W}$.","c) Công suất này tương đương khoảng $13,6\\ \\text{HP}$.","d) Nếu nâng nhanh gấp đôi (thời gian giảm một nửa) thì công của lực nâng tăng gấp đôi."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $A = 2000 \\cdot 10 \\cdot 15 = 300000\\ \\text{J}$. b) Đúng: $P = 300000/30 = 10000\\ \\text{W}$. c) Đúng: $10000/736 \\approx 13,6$. d) Sai: công $A = mgh$ không đổi, chỉ công suất tăng gấp đôi.","points": 1},{"type": "short","level": "VDC","q": "Một máy phát điện có công suất $5000\\ \\text{W}$ hoạt động trong $2$ giờ. Điện năng máy phát ra bằng bao nhiêu kilôoát giờ (kWh)? (chỉ điền số)","answer": "10","explain": "$A = Pt = 5\\ \\text{kW} \\cdot 2\\ \\text{h} = 10\\ \\text{kWh}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một đoàn tàu khối lượng $500$ tấn chuyển động đều với tốc độ $72\\ \\text{km/h}$; lực cản bằng $0,005$ trọng lượng của tàu (lấy $g = 10\\ \\text{m/s}^2$). Công suất của đầu máy bằng bao nhiêu kilôoát? (chỉ điền số)","answer": "500","explain": "$v = 20\\ \\text{m/s}$; $F_c = 0,005 \\cdot 500000 \\cdot 10 = 25000\\ \\text{N}$. $P = Fv = 25000 \\cdot 20 = 500000\\ \\text{W} = 500\\ \\text{kW}$.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Dụng cụ nào sau đây dùng để đo công suất điện?","options": ["A. Oát kế.","B. Vôn kế.","C. Ampe kế.","D. Nhiệt kế."],"answer": "A","explain": "Oát kế là dụng cụ đo công suất (điện). Vôn kế đo hiệu điện thế, ampe kế đo cường độ dòng điện.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong hệ SI, $1\\ \\text{kW}$ bằng","options": ["A. $1000\\ \\text{W}$.","B. $100\\ \\text{W}$.","C. $10\\ \\text{W}$.","D. $1\\ \\text{W}$."],"answer": "A","explain": "Tiền tố kilô (k) nghĩa là $1000$.","points": 0.25},{"type": "mcq","level": "NB","q": "Công thức liên hệ giữa công suất, lực kéo và tốc độ là","options": ["A. $P = Fv$.","B. $P = F + v$.","C. $P = \\frac{v}{F}$.","D. $P = Fv^2$."],"answer": "A","explain": "Khi lực cùng hướng vận tốc: $P = Fv$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một máy cày có công suất $12000\\ \\text{W}$. Trong $30$ phút, máy thực hiện công bằng","options": ["A. $21600000\\ \\text{J}$.","B. $400\\ \\text{J}$.","C. $360000\\ \\text{J}$.","D. $400\\ \\text{J}$."],"answer": "A","explain": "$A = 12000 \\cdot 1800 = 21600000\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một con ngựa kéo xe với lực $300\\ \\text{N}$, xe đi đều với tốc độ $2\\ \\text{m/s}$. Công suất của con ngựa bằng","options": ["A. $600\\ \\text{W}$.","B. $150\\ \\text{W}$.","C. $302\\ \\text{W}$.","D. $6000\\ \\text{W}$."],"answer": "A","explain": "$P = 300 \\cdot 2 = 600\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một động cơ điện nâng thùng hàng $150\\ \\text{kg}$ lên cao $4\\ \\text{m}$ trong $10\\ \\text{s}$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất của động cơ bằng","options": ["A. $600\\ \\text{W}$.","B. $6000\\ \\text{W}$.","C. $1500\\ \\text{W}$.","D. $400\\ \\text{W}$."],"answer": "A","explain": "$A = 150 \\cdot 10 \\cdot 4 = 6000\\ \\text{J}$. $P = 6000/10 = 600\\ \\text{W}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công suất cho biết công thực hiện được trong một đơn vị thời gian.","b) Động cơ có công suất lớn hơn thì luôn thực hiện được nhiều công hơn.","c) $P = \\frac{A}{t}$ với $A$ tính bằng jun, $t$ tính bằng giây thì $P$ tính bằng oát.","d) Có thể biểu diễn công suất theo đơn vị $\\text{J/s}$."],"answer": ["T","F","T","T"],"explain": "a) Đúng (định nghĩa). b) Sai: còn phụ thuộc thời gian hoạt động. c) Đúng: $\\text{J/s} = \\text{W}$. d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Một người có công suất trung bình $200\\ \\text{W}$ leo cầu thang. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Mỗi giây người thực hiện công $200\\ \\text{J}$.","b) Trong $1$ phút, người thực hiện công $12000\\ \\text{J}$.","c) Nếu khối lượng người $50\\ \\text{kg}$ ($g = 10$) thì mỗi giây người lên cao trung bình $0,4\\ \\text{m}$.","d) Công suất này tương đương $0,27\\ \\text{HP}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $200\\ \\text{W} = 200\\ \\text{J/s}$. b) Đúng: $200 \\cdot 60 = 12000\\ \\text{J}$. c) Đúng: $h = A/(mg) = 200/500 = 0,4\\ \\text{m}$. d) Đúng: $200/736 \\approx 0,27$.","points": 1},{"type": "short","level": "VDC","q": "Một máy nén khí có công suất $3\\ \\text{kW}$. Thời gian để máy thực hiện công $180\\ \\text{kJ}$ là bao nhiêu giây? (chỉ điền số)","answer": "60","explain": "$t = A/P = 180000/3000 = 60\\ \\text{s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một ô tô có khối lượng $1500\\ \\text{kg}$ chuyển động đều lên dốc nghiêng $37^\\circ$ ($\\sin 37^\\circ \\approx 0,6$) với tốc độ $8\\ \\text{m/s}$; lực ma sát $900\\ \\text{N}$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất của động cơ bằng bao nhiêu kilôoát? (chỉ điền số)","answer": "79","explain": "$F_{kéo} = mg\\sin 37^\\circ + F_{ms} = 9000 + 900 = 9900\\ \\text{N}$. $P = 9900 \\cdot 8 = 79200\\ \\text{W} \\approx 79\\ \\text{kW}$ (làm tròn).","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "NB","q": "Đại lượng $P = \\frac{A}{t}$ trong đó $A$ là công, $t$ là thời gian, được gọi là","options": ["A. công suất.","B. hiệu suất.","C. động năng.","D. thế năng."],"answer": "A","explain": "$P = A/t$ là công thức tính công suất.","points": 0.25},{"type": "mcq","level": "NB","q": "Một bóng đèn LED ghi $12\\ \\text{W}$ có nghĩa là","options": ["A. mỗi giây đèn tiêu thụ $12\\ \\text{J}$ điện năng.","B. đèn phát sáng được $12\\ \\text{J}$.","C. đèn dùng hiệu điện thế $12\\ \\text{V}$.","D. đèn có tuổi thọ $12$ giờ."],"answer": "A","explain": "Công suất $12\\ \\text{W} = 12\\ \\text{J/s}$: mỗi giây tiêu thụ $12\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một máy xúc thực hiện công $240000\\ \\text{J}$ trong $4$ phút. Công suất của máy bằng","options": ["A. $1000\\ \\text{W}$.","B. $60000\\ \\text{W}$.","C. $960000\\ \\text{W}$.","D. $240\\ \\text{W}$."],"answer": "A","explain": "$t = 240\\ \\text{s}$, $P = 240000/240 = 1000\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một xe đạp điện có công suất $500\\ \\text{W}$, chuyển động đều với tốc độ $5\\ \\text{m/s}$. Lực kéo của động cơ bằng","options": ["A. $100\\ \\text{N}$.","B. $2500\\ \\text{N}$.","C. $505\\ \\text{N}$.","D. $250\\ \\text{N}$."],"answer": "A","explain": "$F = P/v = 500/5 = 100\\ \\text{N}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Hai bạn cùng kéo một xe với tổng lực $120\\ \\text{N}$ cùng chiều chuyển động, xe đi đều với tốc độ $1,5\\ \\text{m/s}$. Tổng công suất của hai bạn bằng","options": ["A. $180\\ \\text{W}$.","B. $80\\ \\text{W}$.","C. $121,5\\ \\text{W}$.","D. $1800\\ \\text{W}$."],"answer": "A","explain": "$P = Fv = 120 \\cdot 1,5 = 180\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một gàu nước $12\\ \\text{kg}$ được kéo từ giếng sâu $10\\ \\text{m}$ lên trong $30\\ \\text{s}$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất trung bình bằng","options": ["A. $40\\ \\text{W}$.","B. $360\\ \\text{W}$.","C. $1200\\ \\text{W}$.","D. $4\\ \\text{W}$."],"answer": "A","explain": "$A = 12 \\cdot 10 \\cdot 10 = 1200\\ \\text{J}$. $P = 1200/30 = 40\\ \\text{W}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Muốn cùng thực hiện một công mà tốn ít thời gian hơn thì cần máy có công suất lớn hơn.","b) Công suất $500\\ \\text{W}$ có nghĩa là mỗi phút thực hiện công $30000\\ \\text{J}$.","c) $1\\ \\text{HP}$ lớn hơn $1\\ \\text{kW}$.","d) Công suất tỉ lệ thuận với công thực hiện khi thời gian không đổi."],"answer": ["T","T","F","T"],"explain": "a) Đúng: $t = A/P$. b) Đúng: $500 \\cdot 60 = 30000\\ \\text{J}$. c) Sai: $1\\ \\text{HP} = 736\\ \\text{W} \\lt 1000\\ \\text{W}$. d) Đúng: $P = A/t$.","points": 1},{"type": "truefalse","level": "VDC","q": "Một thang cuốn đưa người khối lượng $60\\ \\text{kg}$ lên cao $5\\ \\text{m}$ trong $20\\ \\text{s}$ (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công có ích của thang cuốn bằng $3000\\ \\text{J}$.","b) Công suất có ích bằng $150\\ \\text{W}$.","c) Nếu thời gian giảm còn $10\\ \\text{s}$ thì công suất có ích tăng gấp đôi.","d) Công của trọng lực tác dụng lên người là $3000\\ \\text{J}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $A = 60 \\cdot 10 \\cdot 5 = 3000\\ \\text{J}$. b) Đúng: $P = 3000/20 = 150\\ \\text{W}$. c) Đúng: $P = A/t$. d) Sai: trọng lực ngược hướng đi lên nên $A_P = -3000\\ \\text{J}$.","points": 1},{"type": "short","level": "VDC","q": "Một động cơ có công suất $1,5\\ \\text{kW}$ bơm nước lên bể cao $6\\ \\text{m}$. Trong $10$ phút, khối lượng nước bơm được là bao nhiêu kilôgam? (lấy $g = 10\\ \\text{m/s}^2$, chỉ điền số)","answer": "15000","explain": "$A = Pt = 1500 \\cdot 600 = 900000\\ \\text{J} = mgh$, suy ra $m = 900000/(10 \\cdot 6) = 15000\\ \\text{kg}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một xe ô tô chuyển động thẳng đều với tốc độ $25\\ \\text{m/s}$ thì công suất của động cơ là $50000\\ \\text{W}$. Lực cản của mặt đường bằng bao nhiêu niutơn? (chỉ điền số)","answer": "2000","explain": "Chuyển động đều: $F_{kéo} = F_c = P/v = 50000/25 = 2000\\ \\text{N}$.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Phát biểu nào sau đây là SAI?","options": ["A. Công suất có đơn vị là jun.","B. Công suất đặc trưng cho tốc độ thực hiện công.","C. $P = \\frac{A}{t}$.","D. $1\\ \\text{W} = 1\\ \\text{J/s}$."],"answer": "A","explain": "Jun là đơn vị công, đơn vị công suất là oát (W).","points": 0.25},{"type": "mcq","level": "NB","q": "Một máy có công suất $100\\ \\text{W}$ hoạt động trong $10\\ \\text{s}$ thì thực hiện công","options": ["A. $1000\\ \\text{J}$.","B. $10\\ \\text{J}$.","C. $110\\ \\text{J}$.","D. $10000\\ \\text{J}$."],"answer": "A","explain": "$A = Pt = 100 \\cdot 10 = 1000\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người đạp xe với công suất $250\\ \\text{W}$ trong $2$ phút. Công người thực hiện bằng","options": ["A. $30000\\ \\text{J}$.","B. $500\\ \\text{J}$.","C. $125\\ \\text{J}$.","D. $3000\\ \\text{J}$."],"answer": "A","explain": "$A = 250 \\cdot 120 = 30000\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một ô tô có công suất $75000\\ \\text{W}$ chuyển động đều với tốc độ $30\\ \\text{m/s}$. Lực kéo của động cơ bằng","options": ["A. $2500\\ \\text{N}$.","B. $2250000\\ \\text{N}$.","C. $75030\\ \\text{N}$.","D. $250\\ \\text{N}$."],"answer": "A","explain": "$F = P/v = 75000/30 = 2500\\ \\text{N}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một máy bơm đưa $200\\ \\text{kg}$ nước lên cao $12\\ \\text{m}$ trong $60\\ \\text{s}$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất có ích của máy bằng","options": ["A. $400\\ \\text{W}$.","B. $144000\\ \\text{W}$.","C. $24000\\ \\text{W}$.","D. $200\\ \\text{W}$."],"answer": "A","explain": "$A = 200 \\cdot 10 \\cdot 12 = 24000\\ \\text{J}$. $P = 24000/60 = 400\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một cần trục nâng kiện hàng với tốc độ $0,5\\ \\text{m/s}$; lực nâng $4000\\ \\text{N}$. Công suất của cần trục bằng","options": ["A. $2000\\ \\text{W}$.","B. $8000\\ \\text{W}$.","C. $4000,5\\ \\text{W}$.","D. $200\\ \\text{W}$."],"answer": "A","explain": "$P = Fv = 4000 \\cdot 0,5 = 2000\\ \\text{W}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công suất $2\\ \\text{kW}$ lớn gấp đôi công suất $1000\\ \\text{W}$.","b) $1\\ \\text{HP} \\approx 0,736\\ \\text{kW}$.","c) Công suất của bóng đèn sợi đốt $60\\ \\text{W}$ có nghĩa là mỗi giờ đèn tiêu thụ $60\\ \\text{J}$.","d) $P = Fv$ cho công suất tức thời khi $v$ là tốc độ tức thời."],"answer": ["T","T","F","T"],"explain": "a) Đúng: $2000\\ \\text{W} = 2 \\cdot 1000\\ \\text{W}$. b) Đúng. c) Sai: mỗi GIÂY tiêu thụ $60\\ \\text{J}$; mỗi giờ là $216000\\ \\text{J}$. d) Đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Một xe buýt khối lượng $8000\\ \\text{kg}$ chuyển động đều với tốc độ $15\\ \\text{m/s}$ trên đường ngang; hệ số cản $\\mu_c = 0,02$ (lực cản $F_c = \\mu_c mg$); lấy $g = 10\\ \\text{m/s}^2$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lực cản có độ lớn $1600\\ \\text{N}$.","b) Công suất của động cơ bằng $24000\\ \\text{W}$.","c) Trong $1$ giờ, động cơ thực hiện công $86400000\\ \\text{J}$.","d) Nếu tốc độ giảm một nửa thì công suất giảm một nửa."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $F_c = 0,02 \\cdot 8000 \\cdot 10 = 1600\\ \\text{N}$. b) Đúng: $P = 1600 \\cdot 15 = 24000\\ \\text{W}$. c) Đúng: $A = 24000 \\cdot 3600 = 86400000\\ \\text{J}$. d) Đúng: $P = Fv$ tỉ lệ thuận với $v$.","points": 1},{"type": "short","level": "VDC","q": "Một động cơ có công suất $4000\\ \\text{W}$ cần bao nhiêu giây để thực hiện công $120\\ \\text{kJ}$? (chỉ điền số)","answer": "30","explain": "$t = A/P = 120000/4000 = 30\\ \\text{s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một nhà máy thủy điện có công suất $200\\ \\text{MW}$. Trong một ngày đêm, điện năng nhà máy phát ra bằng bao nhiêu triệu kilôoát giờ? (chỉ điền số)","answer": "4.8","explain": "$A = Pt = 200\\ \\text{MW} \\cdot 24\\ \\text{h} = 4800\\ \\text{MWh} = 4,8$ triệu kWh.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Kí hiệu nào sau đây dùng cho đơn vị công suất trong hệ SI?","options": ["A. W.","B. J.","C. N.","D. Pa."],"answer": "A","explain": "Oát (W) là đơn vị công suất trong hệ SI.","points": 0.25},{"type": "mcq","level": "NB","q": "Công suất $1\\ \\text{MW}$ bằng","options": ["A. $10^6\\ \\text{W}$.","B. $10^3\\ \\text{W}$.","C. $10^9\\ \\text{W}$.","D. $10^2\\ \\text{W}$."],"answer": "A","explain": "Tiền tố mêga (M) nghĩa là $10^6$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một thang máy có công suất $6000\\ \\text{W}$ nâng người và thang với tổng lực kéo $3000\\ \\text{N}$ đi lên đều. Tốc độ của thang máy bằng","options": ["A. $2\\ \\text{m/s}$.","B. $18000\\ \\text{m/s}$.","C. $0,5\\ \\text{m/s}$.","D. $9000\\ \\text{m/s}$."],"answer": "A","explain": "$v = P/F = 6000/3000 = 2\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một máy kéo có công suất $36000\\ \\text{W}$ hoạt động trong $10$ phút. Công máy thực hiện bằng","options": ["A. $21600000\\ \\text{J}$.","B. $360000\\ \\text{J}$.","C. $3600\\ \\text{J}$.","D. $21600\\ \\text{J}$."],"answer": "A","explain": "$A = 36000 \\cdot 600 = 21600000\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một con trâu kéo cày với lực $400\\ \\text{N}$, đi đều với tốc độ $1\\ \\text{m/s}$. Công suất của con trâu bằng","options": ["A. $400\\ \\text{W}$.","B. $401\\ \\text{W}$.","C. $4000\\ \\text{W}$.","D. $40\\ \\text{W}$."],"answer": "A","explain": "$P = 400 \\cdot 1 = 400\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Để nâng một vật nặng $P_0 = 500\\ \\text{N}$ lên cao $8\\ \\text{m}$ trong $20\\ \\text{s}$ cần công suất tối thiểu bằng","options": ["A. $200\\ \\text{W}$.","B. $4000\\ \\text{W}$.","C. $80000\\ \\text{W}$.","D. $62,5\\ \\text{W}$."],"answer": "A","explain": "$A = 500 \\cdot 8 = 4000\\ \\text{J}$. $P = 4000/20 = 200\\ \\text{W}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công suất càng lớn thì máy càng khỏe (thực hiện công nhanh).","b) $\\text{kW}$ và $\\text{HP}$ đều là đơn vị công suất.","c) Công thức $P = Fv$ áp dụng được khi $F$ ngược hướng $v$.","d) Trong $10\\ \\text{s}$, máy có công suất $50\\ \\text{W}$ thực hiện công $500\\ \\text{J}$."],"answer": ["T","T","F","T"],"explain": "a) Đúng (nói theo ngôn ngữ đời thường). b) Đúng. c) Sai: $P = Fv$ yêu cầu $F$ cùng hướng $v$ (nếu ngược hướng thì $P = -Fv$). d) Đúng: $A = 50 \\cdot 10 = 500\\ \\text{J}$.","points": 1},{"type": "truefalse","level": "VDC","q": "Một ô tô đang chạy với tốc độ $v_1 = 10\\ \\text{m/s}$ thì công suất động cơ $P_1 = 20000\\ \\text{W}$; sau đó xe tăng tốc lên $v_2 = 20\\ \\text{m/s}$ với cùng lực kéo. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lực kéo của động cơ bằng $2000\\ \\text{N}$.","b) Công suất lúc sau $P_2 = 40000\\ \\text{W}$.","c) Công suất tỉ lệ thuận với tốc độ khi lực kéo không đổi.","d) Nếu giữ nguyên công suất $P_1$ mà muốn đi nhanh gấp đôi thì lực kéo phải tăng gấp đôi."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $F = P_1/v_1 = 2000\\ \\text{N}$. b) Đúng: $P_2 = 2000 \\cdot 20 = 40000\\ \\text{W}$. c) Đúng: $P = Fv$. d) Sai: $F = P/v$ nên $v$ tăng gấp đôi thì $F$ giảm một nửa.","points": 1},{"type": "short","level": "VDC","q": "Một máy bơm nước có công suất $2000\\ \\text{W}$. Mỗi giờ máy bơm thực hiện công bằng bao nhiêu mêgajun (MJ)? (chỉ điền số)","answer": "7.2","explain": "$A = 2000 \\cdot 3600 = 7200000\\ \\text{J} = 7,2\\ \\text{MJ}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một xe lửa khối lượng $1000$ tấn đang chuyển động đều với tốc độ $54\\ \\text{km/h}$ thì công suất đầu máy là $750\\ \\text{kW}$. Hệ số ma sát lăn giữa bánh xe và đường ray bằng bao nhiêu? (lấy $g = 10\\ \\text{m/s}^2$, chỉ điền số)","answer": "0.005","explain": "$v = 15\\ \\text{m/s}$; $F_{ms} = P/v = 750000/15 = 50000\\ \\text{N}$. $\\mu = F_{ms}/(mg) = 50000/10^7 = 0,005$.","points": 0.5}]}]}
