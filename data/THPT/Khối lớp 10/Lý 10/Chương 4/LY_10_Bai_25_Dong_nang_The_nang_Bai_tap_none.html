{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Động năng của một vật được xác định bằng","options": ["A. $W_đ = \\frac{1}{2}mv^2$.","B. $W_đ = mv^2$.","C. $W_đ = mgh$.","D. $W_đ = \\frac{1}{2}mv$."],"answer": "A","explain": "Động năng: $W_đ = \\frac{1}{2}mv^2$, với $m$ là khối lượng, $v$ là tốc độ của vật.","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị của động năng trong hệ SI là","options": ["A. jun (J).","B. oát (W).","C. $\\text{kg} \\cdot \\text{m/s}$.","D. niutơn (N)."],"answer": "A","explain": "Động năng là một dạng năng lượng nên có đơn vị là jun (J).","points": 0.25},{"type": "mcq","level": "NB","q": "Thế năng trọng trường của một vật được xác định bằng","options": ["A. $W_t = mgh$.","B. $W_t = \\frac{1}{2}mv^2$.","C. $W_t = mg$.","D. $W_t = \\frac{1}{2}k(\\Delta l)^2$."],"answer": "A","explain": "Thế năng trọng trường $W_t = mgh$, với $h$ là độ cao của vật so với mốc thế năng.","points": 0.25},{"type": "mcq","level": "NB","q": "Phát biểu nào sau đây đúng về động năng?","options": ["A. Động năng là đại lượng vô hướng và luôn không âm.","B. Động năng là đại lượng vectơ.","C. Động năng có thể nhận giá trị âm.","D. Động năng không phụ thuộc khối lượng."],"answer": "A","explain": "$W_đ = \\frac{1}{2}mv^2 \\ge 0$: động năng vô hướng, không âm, tỉ lệ thuận với khối lượng.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $2\\ \\text{kg}$ chuyển động với tốc độ $10\\ \\text{m/s}$. Động năng của vật bằng","options": ["A. $100\\ \\text{J}$.","B. $200\\ \\text{J}$.","C. $20\\ \\text{J}$.","D. $400\\ \\text{J}$."],"answer": "A","explain": "$W_đ = \\frac{1}{2} \\cdot 2 \\cdot 10^2 = 100\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $1\\ \\text{kg}$ ở độ cao $5\\ \\text{m}$ so với mặt đất (chọn mốc thế năng tại mặt đất, lấy $g = 10\\ \\text{m/s}^2$). Thế năng trọng trường của vật bằng","options": ["A. $50\\ \\text{J}$.","B. $5\\ \\text{J}$.","C. $15\\ \\text{J}$.","D. $500\\ \\text{J}$."],"answer": "A","explain": "$W_t = mgh = 1 \\cdot 10 \\cdot 5 = 50\\ \\text{J}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động năng của vật tỉ lệ thuận với bình phương tốc độ.","b) Khi tốc độ tăng gấp đôi thì động năng tăng gấp đôi.","c) Thế năng trọng trường phụ thuộc vào việc chọn mốc thế năng.","d) Động năng của vật đứng yên bằng 0."],"answer": ["T","F","T","T"],"explain": "a) Đúng: $W_đ = \\frac{1}{2}mv^2$. b) Sai: $v$ tăng gấp đôi thì $W_đ$ tăng gấp BỐN. c) Đúng: $h$ đo từ mốc, đổi mốc thì $W_t$ đổi. d) Đúng: $v = 0$ nên $W_đ = 0$.","points": 1},{"type": "truefalse","level": "VD","q": "Một ô tô khối lượng $1000\\ \\text{kg}$ đang chạy với tốc độ $20\\ \\text{m/s}$ thì phanh gấp, lực hãm không đổi $5000\\ \\text{N}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động năng ban đầu của ô tô bằng $200000\\ \\text{J}$.","b) Công của lực hãm đến khi xe dừng bằng $-200000\\ \\text{J}$.","c) Quãng đường xe đi được đến khi dừng là $40\\ \\text{m}$.","d) Nếu tốc độ ban đầu tăng gấp đôi thì quãng đường phanh tăng gấp đôi."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $W_đ = \\frac{1}{2} \\cdot 1000 \\cdot 400 = 200000\\ \\text{J}$. b) Đúng: theo định lí động năng $A = 0 - W_{đ1}$. c) Đúng: $s = 200000/5000 = 40\\ \\text{m}$. d) Sai: $s = W_đ/F_c$ tỉ lệ với $v^2$ nên tăng gấp BỐN.","points": 1},{"type": "short","level": "VD","q": "Một viên bi khối lượng $0,5\\ \\text{kg}$ lăn với tốc độ $4\\ \\text{m/s}$. Động năng của viên bi bằng bao nhiêu jun? (chỉ điền số)","answer": "4","explain": "$W_đ = \\frac{1}{2} \\cdot 0,5 \\cdot 16 = 4\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $1\\ \\text{kg}$ trượt không ma sát từ trạng thái nghỉ trên mặt ngang dưới tác dụng của lực $F = 10\\ \\text{N}$ cùng hướng chuyển động, đi được $20\\ \\text{m}$. Tốc độ của vật lúc đó bằng bao nhiêu m/s? (chỉ điền số)","answer": "20","explain": "Theo định lí động năng: $\\frac{1}{2}mv^2 - 0 = Fs = 200\\ \\text{J}$, suy ra $v^2 = 400$, $v = 20\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "NB","q": "Định lí động năng phát biểu rằng","options": ["A. công của ngoại lực tác dụng lên vật bằng độ biến thiên động năng của vật.","B. động năng của vật luôn được bảo toàn.","C. công của trọng lực bằng độ giảm thế năng.","D. động năng bằng thế năng."],"answer": "A","explain": "Định lí động năng: $A = \\Delta W_đ = W_{đ2} - W_{đ1}$.","points": 0.25},{"type": "mcq","level": "NB","q": "Thế năng đàn hồi của lò xo được xác định bằng","options": ["A. $W_{tđh} = \\frac{1}{2}k(\\Delta l)^2$.","B. $W_{tđh} = k\\Delta l$.","C. $W_{tđh} = mgh$.","D. $W_{tđh} = \\frac{1}{2}mv^2$."],"answer": "A","explain": "Thế năng đàn hồi: $W_{tđh} = \\frac{1}{2}k(\\Delta l)^2$, với $k$ là độ cứng, $\\Delta l$ là độ biến dạng.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi một vật chuyển động, nếu công của ngoại lực dương thì động năng của vật","options": ["A. tăng lên.","B. giảm đi.","C. không đổi.","D. bằng 0."],"answer": "A","explain": "Theo định lí động năng $\\Delta W_đ = A$: $A \\gt 0$ thì động năng tăng.","points": 0.25},{"type": "mcq","level": "NB","q": "Mốc thế năng trọng trường thường được chọn tại","options": ["A. mặt đất hoặc vị trí thuận tiện cho bài toán.","B. tâm Trái Đất.","C. độ cao cực đại của vật.","D. vị trí ban đầu của vật trong mọi bài toán."],"answer": "A","explain": "Mốc thế năng do người giải chọn sao cho thuận tiện, thường là mặt đất.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có độ cứng $k = 100\\ \\text{N/m}$, bị nén $10\\ \\text{cm}$. Thế năng đàn hồi của lò xo bằng","options": ["A. $0,5\\ \\text{J}$.","B. $5\\ \\text{J}$.","C. $10\\ \\text{J}$.","D. $50\\ \\text{J}$."],"answer": "A","explain": "$\\Delta l = 0,1\\ \\text{m}$. $W_{tđh} = \\frac{1}{2} \\cdot 100 \\cdot 0,1^2 = 0,5\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một quả bóng khối lượng $0,4\\ \\text{kg}$ đang bay với tốc độ $15\\ \\text{m/s}$. Động năng của bóng bằng","options": ["A. $45\\ \\text{J}$.","B. $90\\ \\text{J}$.","C. $6\\ \\text{J}$.","D. $225\\ \\text{J}$."],"answer": "A","explain": "$W_đ = \\frac{1}{2} \\cdot 0,4 \\cdot 225 = 45\\ \\text{J}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Thế năng trọng trường có thể nhận giá trị âm nếu vật ở dưới mốc thế năng.","b) Động năng của hai vật có thể bằng nhau dù khối lượng khác nhau.","c) Thế năng đàn hồi luôn dương.","d) Khi vật rơi tự do, động năng của vật giảm dần."],"answer": ["T","T","T","F"],"explain": "a) Đúng: dưới mốc thì $h \\lt 0$ nên $W_t \\lt 0$. b) Đúng: $\\frac{1}{2}m_1v_1^2$ có thể bằng $\\frac{1}{2}m_2v_2^2$. c) Đúng: $W_{tđh} = \\frac{1}{2}k(\\Delta l)^2 \\ge 0$. d) Sai: vật rơi nhanh dần nên động năng TĂNG.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $2\\ \\text{kg}$ đang chuyển động với tốc độ $5\\ \\text{m/s}$ thì chịu lực $F = 12\\ \\text{N}$ cùng hướng chuyển động, đi thêm $10\\ \\text{m}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động năng ban đầu của vật bằng $25\\ \\text{J}$.","b) Công của lực $F$ bằng $120\\ \\text{J}$.","c) Động năng lúc sau của vật bằng $145\\ \\text{J}$.","d) Tốc độ lúc sau của vật xấp xỉ $12\\ \\text{m/s}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $\\frac{1}{2} \\cdot 2 \\cdot 25 = 25\\ \\text{J}$. b) Đúng: $12 \\cdot 10 = 120\\ \\text{J}$. c) Đúng: $W_{đ2} = 25 + 120 = 145\\ \\text{J}$. d) Đúng: $v = \\sqrt{2 \\cdot 145/2} = \\sqrt{145} \\approx 12\\ \\text{m/s}$.","points": 1},{"type": "short","level": "VD","q": "Một vật khối lượng $3\\ \\text{kg}$ ở độ cao $4\\ \\text{m}$ so với mặt đất (mốc thế năng tại mặt đất, lấy $g = 10\\ \\text{m/s}^2$). Thế năng trọng trường của vật bằng bao nhiêu jun? (chỉ điền số)","answer": "120","explain": "$W_t = 3 \\cdot 10 \\cdot 4 = 120\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một xe khối lượng $500\\ \\text{kg}$ đang chạy với tốc độ $10\\ \\text{m/s}$ thì tắt máy, xe đi thêm $50\\ \\text{m}$ rồi dừng do ma sát. Lực ma sát trung bình bằng bao nhiêu niutơn? (chỉ điền số)","answer": "500","explain": "Định lí động năng: $-F_{ms} \\cdot s = 0 - \\frac{1}{2}mv^2$, suy ra $F_{ms} = (0,5 \\cdot 500 \\cdot 100)/50 = 500\\ \\text{N}$.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Động năng là năng lượng mà vật có được do","options": ["A. chuyển động.","B. vị trí trong trọng trường.","C. biến dạng đàn hồi.","D. nhiệt độ cao."],"answer": "A","explain": "Động năng gắn với chuyển động của vật.","points": 0.25},{"type": "mcq","level": "NB","q": "Thế năng trọng trường là năng lượng mà vật có được do","options": ["A. vị trí của vật trong trọng trường Trái Đất.","B. chuyển động của vật.","C. sự biến dạng của vật.","D. khối lượng của vật."],"answer": "A","explain": "Thế năng trọng trường phụ thuộc độ cao của vật trong trọng trường.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi vật chuyển động với tốc độ không đổi thì động năng của vật","options": ["A. không đổi.","B. tăng dần.","C. giảm dần.","D. bằng 0."],"answer": "A","explain": "$W_đ = \\frac{1}{2}mv^2$: $v$ không đổi thì $W_đ$ không đổi.","points": 0.25},{"type": "mcq","level": "NB","q": "Một máy bay khối lượng $70000\\ \\text{kg}$ đang bay với tốc độ $250\\ \\text{m/s}$. Động năng của máy bay bằng","options": ["A. $2,1875 \\cdot 10^9\\ \\text{J}$.","B. $8,75 \\cdot 10^6\\ \\text{J}$.","C. $1,75 \\cdot 10^7\\ \\text{J}$.","D. $17500000\\ \\text{kJ}$."],"answer": "A","explain": "$W_đ = \\frac{1}{2} \\cdot 70000 \\cdot 62500 = 2,1875 \\cdot 10^9\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $0,2\\ \\text{kg}$ được ném thẳng đứng lên với tốc độ $10\\ \\text{m/s}$. Động năng của vật lúc ném bằng","options": ["A. $10\\ \\text{J}$.","B. $20\\ \\text{J}$.","C. $2\\ \\text{J}$.","D. $100\\ \\text{J}$."],"answer": "A","explain": "$W_đ = \\frac{1}{2} \\cdot 0,2 \\cdot 100 = 10\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Chọn mốc thế năng tại mặt đất. Một vật khối lượng $5\\ \\text{kg}$ đặt trên bàn cao $0,8\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$). Thế năng của vật bằng","options": ["A. $40\\ \\text{J}$.","B. $400\\ \\text{J}$.","C. $4\\ \\text{J}$.","D. $58\\ \\text{J}$."],"answer": "A","explain": "$W_t = 5 \\cdot 10 \\cdot 0,8 = 40\\ \\text{J}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công của trọng lực bằng độ giảm thế năng trọng trường.","b) Khi vật đi lên, thế năng trọng trường tăng.","c) Thế năng đàn hồi tỉ lệ thuận với độ biến dạng của lò xo.","d) Động năng của vật phụ thuộc vào hệ quy chiếu."],"answer": ["T","T","F","T"],"explain": "a) Đúng: $A_P = W_{t1} - W_{t2}$. b) Đúng: $h$ tăng nên $W_t = mgh$ tăng. c) Sai: $W_{tđh}$ tỉ lệ với BÌNH PHƯƠNG độ biến dạng. d) Đúng: $v$ phụ thuộc hệ quy chiếu nên $W_đ$ cũng vậy.","points": 1},{"type": "truefalse","level": "VD","q": "Một lò xo có độ cứng $k = 200\\ \\text{N/m}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khi lò xo bị nén $5\\ \\text{cm}$, thế năng đàn hồi bằng $0,25\\ \\text{J}$.","b) Khi độ biến dạng tăng gấp đôi thì thế năng đàn hồi tăng gấp bốn.","c) Lò xo ở trạng thái không biến dạng có thế năng đàn hồi bằng 0.","d) Thế năng đàn hồi khi lò xo dãn $5\\ \\text{cm}$ khác khi nén $5\\ \\text{cm}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $\\frac{1}{2} \\cdot 200 \\cdot 0,05^2 = 0,25\\ \\text{J}$. b) Đúng: tỉ lệ với $(\\Delta l)^2$. c) Đúng: $\\Delta l = 0$. d) Sai: chỉ phụ thuộc $|\\Delta l|$ nên bằng nhau.","points": 1},{"type": "short","level": "VD","q": "Một ô tô khối lượng $1200\\ \\text{kg}$ chuyển động với tốc độ $15\\ \\text{m/s}$. Động năng của ô tô bằng bao nhiêu kilôjun? (chỉ điền số)","answer": "135","explain": "$W_đ = \\frac{1}{2} \\cdot 1200 \\cdot 225 = 135000\\ \\text{J} = 135\\ \\text{kJ}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $0,5\\ \\text{kg}$ được thả rơi tự do từ độ cao $20\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Tốc độ của vật khi chạm đất bằng bao nhiêu m/s? (chỉ điền số)","answer": "20","explain": "Định lí động năng: $\\frac{1}{2}mv^2 = mgh$, suy ra $v = \\sqrt{2gh} = \\sqrt{400} = 20\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "NB","q": "Biểu thức của định lí động năng là","options": ["A. $A = W_{đ2} - W_{đ1}$.","B. $A = W_{đ1} - W_{đ2}$.","C. $A = W_{đ1} + W_{đ2}$.","D. $W_{đ1} = W_{đ2}$."],"answer": "A","explain": "Công của ngoại lực bằng độ biến thiên động năng: $A = \\Delta W_đ = W_{đ2} - W_{đ1}$.","points": 0.25},{"type": "mcq","level": "NB","q": "Thế năng đàn hồi phụ thuộc vào","options": ["A. độ cứng của lò xo và độ biến dạng.","B. khối lượng của lò xo.","C. tốc độ biến dạng.","D. nhiệt độ của lò xo."],"answer": "A","explain": "$W_{tđh} = \\frac{1}{2}k(\\Delta l)^2$: phụ thuộc $k$ và $\\Delta l$.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật đang chuyển động, nếu ngoại lực tác dụng sinh công âm thì","options": ["A. động năng của vật giảm.","B. động năng của vật tăng.","C. động năng của vật không đổi.","D. thế năng của vật tăng."],"answer": "A","explain": "$\\Delta W_đ = A \\lt 0$ nên động năng giảm.","points": 0.25},{"type": "mcq","level": "TH","q": "Một viên đạn khối lượng $20\\ \\text{g}$ bay với tốc độ $400\\ \\text{m/s}$. Động năng của viên đạn bằng","options": ["A. $1600\\ \\text{J}$.","B. $80000\\ \\text{J}$.","C. $160\\ \\text{J}$.","D. $8000\\ \\text{J}$."],"answer": "A","explain": "$m = 0,02\\ \\text{kg}$. $W_đ = \\frac{1}{2} \\cdot 0,02 \\cdot 160000 = 1600\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $4\\ \\text{kg}$ ở độ cao $2,5\\ \\text{m}$ so với sàn nhà (chọn mốc thế năng tại sàn, lấy $g = 10\\ \\text{m/s}^2$). Thế năng của vật bằng","options": ["A. $100\\ \\text{J}$.","B. $10\\ \\text{J}$.","C. $40\\ \\text{J}$.","D. $1000\\ \\text{J}$."],"answer": "A","explain": "$W_t = 4 \\cdot 10 \\cdot 2,5 = 100\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo bị dãn $8\\ \\text{cm}$, độ cứng $k = 50\\ \\text{N/m}$. Thế năng đàn hồi của lò xo bằng","options": ["A. $0,16\\ \\text{J}$.","B. $1,6\\ \\text{J}$.","C. $3,2\\ \\text{J}$.","D. $0,32\\ \\text{J}$."],"answer": "A","explain": "$W_{tđh} = \\frac{1}{2} \\cdot 50 \\cdot 0,08^2 = 25 \\cdot 0,0064 = 0,16\\ \\text{J}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động năng luôn không âm.","b) Thế năng trọng trường luôn không âm.","c) Khi lò xo bị nén gấp đôi thì thế năng đàn hồi tăng gấp bốn.","d) Công của lực ma sát làm giảm động năng của vật."],"answer": ["T","F","T","T"],"explain": "a) Đúng: $W_đ = \\frac{1}{2}mv^2 \\ge 0$. b) Sai: vật dưới mốc thế năng có $W_t \\lt 0$. c) Đúng: tỉ lệ với $(\\Delta l)^2$. d) Đúng: ma sát sinh công âm nên $\\Delta W_đ \\lt 0$.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $m = 1\\ \\text{kg}$ chuyển động trên mặt ngang với tốc độ $v_1 = 6\\ \\text{m/s}$ thì chịu lực cản $F_c = 4\\ \\text{N}$ ngược chiều chuyển động. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động năng ban đầu của vật bằng $18\\ \\text{J}$.","b) Sau khi đi $2\\ \\text{m}$, động năng của vật bằng $10\\ \\text{J}$.","c) Tốc độ của vật sau khi đi $2\\ \\text{m}$ xấp xỉ $4,5\\ \\text{m/s}$.","d) Quãng đường vật đi được đến khi dừng là $4,5\\ \\text{m}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $\\frac{1}{2} \\cdot 1 \\cdot 36 = 18\\ \\text{J}$. b) Đúng: $W_{đ2} = 18 - 4 \\cdot 2 = 10\\ \\text{J}$. c) Đúng: $v = \\sqrt{20} \\approx 4,47\\ \\text{m/s}$. d) Đúng: $s = 18/4 = 4,5\\ \\text{m}$.","points": 1},{"type": "short","level": "VDC","q": "Một vật có động năng $200\\ \\text{J}$, khối lượng $4\\ \\text{kg}$. Tốc độ của vật bằng bao nhiêu m/s? (chỉ điền số)","answer": "10","explain": "$v = \\sqrt{2W_đ/m} = \\sqrt{400/4} = 10\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $2\\ \\text{kg}$ được ném thẳng đứng lên với tốc độ $15\\ \\text{m/s}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Độ cao cực đại vật đạt được bằng bao nhiêu mét? (chỉ điền số)","answer": "11.25","explain": "Động năng ban đầu chuyển hết thành thế năng: $\\frac{1}{2}mv_0^2 = mgh_{max}$, suy ra $h_{max} = v_0^2/(2g) = 225/20 = 11,25\\ \\text{m}$.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Động năng của vật tăng khi","options": ["A. tốc độ của vật tăng.","B. tốc độ của vật giảm.","C. khối lượng của vật giảm.","D. vật đứng yên."],"answer": "A","explain": "$W_đ = \\frac{1}{2}mv^2$ tăng khi $v$ tăng.","points": 0.25},{"type": "mcq","level": "NB","q": "Thế năng trọng trường của vật bằng 0 khi","options": ["A. vật ở tại mốc thế năng.","B. vật đứng yên.","C. vật chuyển động đều.","D. vật ở rất cao."],"answer": "A","explain": "Tại mốc thế năng $h = 0$ nên $W_t = mgh = 0$.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong các vật sau, vật nào có động năng lớn nhất? (cùng tốc độ)","options": ["A. Xe tải nặng.","B. Xe máy.","C. Người đi bộ.","D. Quả bóng."],"answer": "A","explain": "Cùng tốc độ, vật có khối lượng lớn nhất thì $W_đ = \\frac{1}{2}mv^2$ lớn nhất.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $10\\ \\text{kg}$ chuyển động với tốc độ $3\\ \\text{m/s}$. Động năng của vật bằng","options": ["A. $45\\ \\text{J}$.","B. $90\\ \\text{J}$.","C. $15\\ \\text{J}$.","D. $30\\ \\text{J}$."],"answer": "A","explain": "$W_đ = \\frac{1}{2} \\cdot 10 \\cdot 9 = 45\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một cần cẩu giữ kiện hàng $800\\ \\text{kg}$ ở độ cao $20\\ \\text{m}$ so với mặt đất (mốc thế năng tại mặt đất, lấy $g = 10\\ \\text{m/s}^2$). Thế năng của kiện hàng bằng","options": ["A. $160000\\ \\text{J}$.","B. $16000\\ \\text{J}$.","C. $1600\\ \\text{J}$.","D. $400\\ \\text{J}$."],"answer": "A","explain": "$W_t = 800 \\cdot 10 \\cdot 20 = 160000\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Lò xo có $k = 150\\ \\text{N/m}$ bị nén $6\\ \\text{cm}$. Thế năng đàn hồi bằng","options": ["A. $0,27\\ \\text{J}$.","B. $2,7\\ \\text{J}$.","C. $0,54\\ \\text{J}$.","D. $9\\ \\text{J}$."],"answer": "A","explain": "$W_{tđh} = \\frac{1}{2} \\cdot 150 \\cdot 0,06^2 = 75 \\cdot 0,0036 = 0,27\\ \\text{J}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khi vật rơi tự do, thế năng giảm và động năng tăng.","b) Động năng của vật tỉ lệ thuận với khối lượng.","c) Thế năng đàn hồi không phụ thuộc vào dấu của độ biến dạng.","d) Đơn vị của thế năng là oát."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $h$ giảm, $v$ tăng. b) Đúng: $W_đ = \\frac{1}{2}mv^2$. c) Đúng: phụ thuộc $(\\Delta l)^2$. d) Sai: thế năng có đơn vị jun.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $0,5\\ \\text{kg}$ ở độ cao $10\\ \\text{m}$ so với mặt đất được thả rơi tự do (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Thế năng ban đầu của vật (mốc tại mặt đất) bằng $50\\ \\text{J}$.","b) Động năng của vật khi chạm đất bằng $50\\ \\text{J}$.","c) Tốc độ của vật khi chạm đất xấp xỉ $14,1\\ \\text{m/s}$.","d) Tại độ cao $5\\ \\text{m}$, động năng của vật bằng $25\\ \\text{J}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $0,5 \\cdot 10 \\cdot 10 = 50\\ \\text{J}$. b) Đúng: thế năng chuyển hết thành động năng. c) Đúng: $v = \\sqrt{2 \\cdot 50/0,5} = \\sqrt{200} \\approx 14,14\\ \\text{m/s}$. d) Đúng: $W_đ = 50 - 0,5 \\cdot 10 \\cdot 5 = 25\\ \\text{J}$.","points": 1},{"type": "short","level": "VDC","q": "Một vật khối lượng $2\\ \\text{kg}$ có thế năng trọng trường $60\\ \\text{J}$ so với mặt đất (lấy $g = 10\\ \\text{m/s}^2$). Độ cao của vật so với mặt đất bằng bao nhiêu mét? (chỉ điền số)","answer": "3","explain": "$h = W_t/(mg) = 60/20 = 3\\ \\text{m}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một ô tô khối lượng $1500\\ \\text{kg}$ đang chạy $20\\ \\text{m/s}$ thì phanh; lực hãm trung bình $7500\\ \\text{N}$. Quãng đường phanh đến khi dừng bằng bao nhiêu mét? (chỉ điền số)","answer": "40","explain": "$W_đ = \\frac{1}{2} \\cdot 1500 \\cdot 400 = 300000\\ \\text{J}$. $s = W_đ/F_h = 300000/7500 = 40\\ \\text{m}$.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Khi nào động năng của vật bằng 0?","options": ["A. Khi vật đứng yên.","B. Khi vật chuyển động đều.","C. Khi vật ở trên cao.","D. Khi không có lực tác dụng."],"answer": "A","explain": "$v = 0$ thì $W_đ = \\frac{1}{2}mv^2 = 0$.","points": 0.25},{"type": "mcq","level": "NB","q": "Công của lực thế (trọng lực, lực đàn hồi) bằng","options": ["A. độ giảm thế năng.","B. độ tăng động năng.","C. tổng cơ năng.","D. 0 trong mọi trường hợp."],"answer": "A","explain": "$A_{thế} = W_{t1} - W_{t2}$: công của lực thế bằng độ giảm thế năng.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật được ném lên, tại vị trí cao nhất thì","options": ["A. động năng bằng 0 (bỏ qua sức cản, xét theo phương thẳng đứng).","B. thế năng bằng 0.","C. động năng cực đại.","D. cơ năng bằng 0."],"answer": "A","explain": "Tại độ cao cực đại, tốc độ theo phương thẳng đứng bằng 0 nên động năng bằng 0.","points": 0.25},{"type": "mcq","level": "TH","q": "Một hòn đá khối lượng $0,3\\ \\text{kg}$ được ném ngang với tốc độ $12\\ \\text{m/s}$. Động năng của hòn đá lúc ném bằng","options": ["A. $21,6\\ \\text{J}$.","B. $43,2\\ \\text{J}$.","C. $3,6\\ \\text{J}$.","D. $1,8\\ \\text{J}$."],"answer": "A","explain": "$W_đ = \\frac{1}{2} \\cdot 0,3 \\cdot 144 = 21,6\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $2,5\\ \\text{kg}$ đặt tại độ cao $1,2\\ \\text{m}$ so với mặt bàn, mặt bàn cao $0,8\\ \\text{m}$ so với sàn. Chọn mốc thế năng tại sàn (lấy $g = 10\\ \\text{m/s}^2$). Thế năng của vật bằng","options": ["A. $50\\ \\text{J}$.","B. $30\\ \\text{J}$.","C. $20\\ \\text{J}$.","D. $80\\ \\text{J}$."],"answer": "A","explain": "Độ cao so với sàn: $1,2 + 0,8 = 2\\ \\text{m}$. $W_t = 2,5 \\cdot 10 \\cdot 2 = 50\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Hai lò xo có cùng độ cứng $k$, lò xo 1 dãn $4\\ \\text{cm}$, lò xo 2 dãn $2\\ \\text{cm}$. So sánh thế năng đàn hồi:","options": ["A. $W_1 = 4W_2$.","B. $W_1 = 2W_2$.","C. $W_1 = W_2$.","D. $W_2 = 4W_1$."],"answer": "A","explain": "$W_{tđh}$ tỉ lệ với $(\\Delta l)^2$: $(4/2)^2 = 4$ nên $W_1 = 4W_2$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Định lí động năng áp dụng được cho mọi loại lực.","b) Khi vật chuyển động tròn đều, động năng của vật không đổi.","c) Thế năng của vật chỉ có một giá trị duy nhất, không phụ thuộc mốc.","d) Lò xo càng cứng thì với cùng độ biến dạng, thế năng đàn hồi càng lớn."],"answer": ["T","T","F","T"],"explain": "a) Đúng: $A$ là công của TẤT CẢ ngoại lực. b) Đúng: tốc độ không đổi. c) Sai: $W_t$ phụ thuộc mốc. d) Đúng: $W_{tđh}$ tỉ lệ với $k$.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $4\\ \\text{kg}$ trượt không vận tốc đầu từ đỉnh mặt phẳng nghiêng cao $3\\ \\text{m}$, dài $6\\ \\text{m}$, không ma sát (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công của trọng lực bằng $120\\ \\text{J}$.","b) Động năng của vật ở chân dốc bằng $120\\ \\text{J}$.","c) Tốc độ của vật ở chân dốc xấp xỉ $7,75\\ \\text{m/s}$.","d) Nếu có ma sát thì động năng ở chân dốc vẫn bằng $120\\ \\text{J}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $4 \\cdot 10 \\cdot 3 = 120\\ \\text{J}$. b) Đúng: định lí động năng $W_{đ2} = 120\\ \\text{J}$. c) Đúng: $v = \\sqrt{2 \\cdot 120/4} = \\sqrt{60} \\approx 7,75\\ \\text{m/s}$. d) Sai: ma sát sinh công âm nên $W_{đ2} \\lt 120\\ \\text{J}$.","points": 1},{"type": "short","level": "VDC","q": "Một lò xo có độ cứng $k = 80\\ \\text{N/m}$. Để lò xo có thế năng đàn hồi $1,6\\ \\text{J}$ thì phải biến dạng bao nhiêu centimét? (chỉ điền số)","answer": "20","explain": "$(\\Delta l)^2 = 2W/k = 3,2/80 = 0,04$, suy ra $\\Delta l = 0,2\\ \\text{m} = 20\\ \\text{cm}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một viên bi khối lượng $100\\ \\text{g}$ lăn không ma sát từ đỉnh dốc cao $1,5\\ \\text{m}$ xuống rồi tiếp tục lăn trên mặt ngang, sau đó nén một lò xo ($k = 200\\ \\text{N/m}$) rồi dừng lại (lấy $g = 10\\ \\text{m/s}^2$). Độ nén cực đại của lò xo bằng bao nhiêu centimét? (chỉ điền số)","answer": "12.25","explain": "Thế năng $mgh = 0,1 \\cdot 10 \\cdot 1,5 = 1,5\\ \\text{J}$ chuyển hết thành thế năng đàn hồi: $\\frac{1}{2} \\cdot 200 \\cdot (\\Delta l)^2 = 1,5$, suy ra $\\Delta l = \\sqrt{0,015} \\approx 0,1225\\ \\text{m} = 12,25\\ \\text{cm}$.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Động năng của một vật phụ thuộc vào","options": ["A. khối lượng và tốc độ của vật.","B. độ cao của vật.","C. độ biến dạng của vật.","D. thời gian chuyển động."],"answer": "A","explain": "$W_đ = \\frac{1}{2}mv^2$: phụ thuộc $m$ và $v$.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi tốc độ của vật giảm một nửa thì động năng của vật","options": ["A. giảm 4 lần.","B. giảm 2 lần.","C. không đổi.","D. tăng 2 lần."],"answer": "A","explain": "$W_đ$ tỉ lệ với $v^2$: $v$ giảm một nửa thì $W_đ$ giảm $(1/2)^2 = 1/4$.","points": 0.25},{"type": "mcq","level": "NB","q": "Thế năng trọng trường của vật ở độ cao $h$ so với mốc được tính bằng $W_t = mgh$. Nếu chọn mốc tại vị trí của vật thì","options": ["A. $W_t = 0$.","B. $W_t = mgh$.","C. $W_t \\lt 0$.","D. $W_t$ cực đại."],"answer": "A","explain": "Mốc tại vị trí vật thì $h = 0$ nên $W_t = 0$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người khối lượng $60\\ \\text{kg}$ chạy với tốc độ $5\\ \\text{m/s}$. Động năng của người bằng","options": ["A. $750\\ \\text{J}$.","B. $1500\\ \\text{J}$.","C. $300\\ \\text{J}$.","D. $150\\ \\text{J}$."],"answer": "A","explain": "$W_đ = \\frac{1}{2} \\cdot 60 \\cdot 25 = 750\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một quả dừa khối lượng $1,5\\ \\text{kg}$ ở trên cây cao $6\\ \\text{m}$ so với mặt đất (mốc thế năng tại mặt đất, lấy $g = 10\\ \\text{m/s}^2$). Thế năng của quả dừa bằng","options": ["A. $90\\ \\text{J}$.","B. $9\\ \\text{J}$.","C. $15\\ \\text{J}$.","D. $900\\ \\text{J}$."],"answer": "A","explain": "$W_t = 1,5 \\cdot 10 \\cdot 6 = 90\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật đang chuyển động với động năng $W_đ$. Nếu khối lượng tăng gấp đôi và tốc độ giữ nguyên thì động năng","options": ["A. tăng gấp đôi.","B. tăng gấp bốn.","C. giảm một nửa.","D. không đổi."],"answer": "A","explain": "$W_đ$ tỉ lệ thuận với $m$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Vật có khối lượng càng lớn, chuyển động càng nhanh thì động năng càng lớn.","b) Thế năng trọng trường của máy bay đang bay rất lớn do độ cao lớn.","c) Khi nén lò xo, thế năng đàn hồi của lò xo tăng.","d) Động năng và thế năng có đơn vị khác nhau."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $W_đ = \\frac{1}{2}mv^2$. b) Đúng: $W_t = mgh$ với $h$ lớn. c) Đúng: $|\\Delta l|$ tăng nên $W_{tđh}$ tăng. d) Sai: cả hai đều có đơn vị jun.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $2\\ \\text{kg}$ được kéo trên mặt ngang không ma sát bằng lực $F = 8\\ \\text{N}$ cùng hướng chuyển động từ trạng thái nghỉ. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Sau $5\\ \\text{m}$, động năng của vật bằng $40\\ \\text{J}$.","b) Tốc độ của vật sau $5\\ \\text{m}$ xấp xỉ $6,3\\ \\text{m/s}$.","c) Gia tốc của vật bằng $4\\ \\text{m/s}^2$.","d) Sau $10\\ \\text{m}$, động năng của vật bằng $60\\ \\text{J}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $W_đ = Fs = 40\\ \\text{J}$. b) Đúng: $v = \\sqrt{2 \\cdot 40/2} = \\sqrt{40} \\approx 6,32\\ \\text{m/s}$. c) Đúng: $a = F/m = 4\\ \\text{m/s}^2$. d) Sai: $W_đ = 8 \\cdot 10 = 80\\ \\text{J}$.","points": 1},{"type": "short","level": "VDC","q": "Một vật có khối lượng $800\\ \\text{g}$, động năng $100\\ \\text{J}$. Tốc độ của vật bằng bao nhiêu m/s? (chỉ điền số)","answer": "15.81","explain": "$v = \\sqrt{2W_đ/m} = \\sqrt{200/0,8} = \\sqrt{250} \\approx 15,81\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $m$ đang chuyển động với tốc độ $v_1 = 10\\ \\text{m/s}$ thì tăng tốc đến $v_2 = 20\\ \\text{m/s}$. Công của ngoại lực thực hiện trong quá trình tăng tốc bằng $1500\\ \\text{J}$. Khối lượng $m$ bằng bao nhiêu kilôgam? (chỉ điền số)","answer": "10","explain": "$A = \\frac{1}{2}m(v_2^2 - v_1^2) = \\frac{1}{2}m \\cdot 300 = 150m = 1500$, suy ra $m = 10\\ \\text{kg}$.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "NB","q": "Phát biểu nào sau đây là SAI?","options": ["A. Động năng của vật luôn dương.","B. Động năng tỉ lệ với bình phương tốc độ.","C. Động năng có đơn vị là jun.","D. Động năng bằng 0 khi vật đứng yên."],"answer": "A","explain": "Động năng KHÔNG ÂM ($W_đ \\ge 0$), bằng 0 khi vật đứng yên — nói luôn dương là sai.","points": 0.25},{"type": "mcq","level": "NB","q": "Thế năng đàn hồi của lò xo bằng 0 khi","options": ["A. lò xo không biến dạng.","B. lò xo bị nén.","C. lò xo bị dãn.","D. lò xo có khối lượng nhỏ."],"answer": "A","explain": "$\\Delta l = 0$ thì $W_{tđh} = 0$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một ô tô tải khối lượng $5000\\ \\text{kg}$ chạy với tốc độ $10\\ \\text{m/s}$. Động năng của ô tô bằng","options": ["A. $250000\\ \\text{J}$.","B. $500000\\ \\text{J}$.","C. $50000\\ \\text{J}$.","D. $25000\\ \\text{J}$."],"answer": "A","explain": "$W_đ = \\frac{1}{2} \\cdot 5000 \\cdot 100 = 250000\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $m = 0,5\\ \\text{kg}$ rơi từ độ cao $8\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Động năng của vật khi chạm đất bằng","options": ["A. $40\\ \\text{J}$.","B. $4\\ \\text{J}$.","C. $20\\ \\text{J}$.","D. $80\\ \\text{J}$."],"answer": "A","explain": "Thế năng ban đầu $0,5 \\cdot 10 \\cdot 8 = 40\\ \\text{J}$ chuyển hết thành động năng.","points": 0.25},{"type": "mcq","level": "TH","q": "Chọn mốc thế năng tại mặt đất. Vật $3\\ \\text{kg}$ ở độ cao $2\\ \\text{m}$ có thế năng $60\\ \\text{J}$ (lấy $g = 10$). Nếu chuyển mốc thế năng lên độ cao $2\\ \\text{m}$ (ngang vị trí vật) thì thế năng của vật bằng","options": ["A. $0$.","B. $60\\ \\text{J}$.","C. $-60\\ \\text{J}$.","D. $120\\ \\text{J}$."],"answer": "A","explain": "Vật ở ngay mốc mới nên $h = 0$, $W_t = 0$.","points": 0.25},{"type": "mcq","level": "VD","q": "Lò xo $k = 100\\ \\text{N/m}$ dãn $12\\ \\text{cm}$. Thế năng đàn hồi bằng","options": ["A. $0,72\\ \\text{J}$.","B. $7,2\\ \\text{J}$.","C. $1,44\\ \\text{J}$.","D. $0,36\\ \\text{J}$."],"answer": "A","explain": "$W = \\frac{1}{2} \\cdot 100 \\cdot 0,12^2 = 50 \\cdot 0,0144 = 0,72\\ \\text{J}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khi vật chuyển động nhanh dần, động năng của vật tăng.","b) Khi vật chuyển động chậm dần, công của hợp lực tác dụng lên vật là công cản.","c) Thế năng trọng trường của vật trên mặt đất (chọn mốc tại mặt đất) bằng 0.","d) Hai lò xo giống hệt nhau, lò xo bị nén nhiều hơn có thế năng đàn hồi lớn hơn."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $v$ tăng nên $W_đ$ tăng. b) Đúng: $\\Delta W_đ \\lt 0$ nên $A \\lt 0$. c) Đúng: $h = 0$. d) Đúng: $W_{tđh}$ tỉ lệ với $(\\Delta l)^2$.","points": 1},{"type": "truefalse","level": "VDC","q": "Một quả bóng khối lượng $0,5\\ \\text{kg}$ được đá với tốc độ $20\\ \\text{m/s}$ từ mặt đất lên theo phương thẳng đứng (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động năng ban đầu của bóng bằng $100\\ \\text{J}$.","b) Độ cao cực đại bóng đạt được là $20\\ \\text{m}$.","c) Tại độ cao $10\\ \\text{m}$, động năng của bóng bằng $50\\ \\text{J}$.","d) Khi rơi trở về mặt đất, tốc độ của bóng nhỏ hơn $20\\ \\text{m/s}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $\\frac{1}{2} \\cdot 0,5 \\cdot 400 = 100\\ \\text{J}$. b) Đúng: $h = v^2/(2g) = 400/20 = 20\\ \\text{m}$. c) Đúng: $W_đ = 100 - 0,5 \\cdot 10 \\cdot 10 = 50\\ \\text{J}$. d) Sai: không có sức cản nên tốc độ khi về mặt đất vẫn bằng $20\\ \\text{m/s}$.","points": 1},{"type": "short","level": "VDC","q": "Một vật khối lượng $1,2\\ \\text{kg}$ chuyển động với động năng $60\\ \\text{J}$. Tốc độ của vật bằng bao nhiêu m/s? (chỉ điền số, làm tròn đến 1 chữ số thập phân)","answer": "10","explain": "$v = \\sqrt{2 \\cdot 60/1,2} = \\sqrt{100} = 10\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật trượt không ma sát từ đỉnh dốc cao $5\\ \\text{m}$ xuống chân dốc rồi đi tiếp trên mặt ngang và dừng lại sau $20\\ \\text{m}$ do ma sát (lấy $g = 10\\ \\text{m/s}^2$). Hệ số ma sát trên mặt ngang bằng bao nhiêu? (chỉ điền số)","answer": "0.25","explain": "Động năng ở chân dốc: $W_đ = mgh$. Trên mặt ngang: $\\mu mg \\cdot s = W_đ$, suy ra $\\mu = h/s = 5/20 = 0,25$.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Động năng của vật sẽ tăng gấp đôi khi","options": ["A. khối lượng tăng gấp đôi, tốc độ không đổi.","B. tốc độ tăng gấp đôi, khối lượng không đổi.","C. khối lượng giảm một nửa.","D. tốc độ giảm một nửa."],"answer": "A","explain": "$W_đ$ tỉ lệ thuận với $m$; tốc độ tăng gấp đôi thì $W_đ$ tăng gấp bốn.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật ở độ cao $h$ so với mốc thế năng. Nếu đưa vật lên cao gấp đôi thì thế năng trọng trường","options": ["A. tăng gấp đôi.","B. tăng gấp bốn.","C. không đổi.","D. giảm một nửa."],"answer": "A","explain": "$W_t = mgh$ tỉ lệ thuận với $h$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một xe đạp khối lượng $15\\ \\text{kg}$ (cả người $60\\ \\text{kg}$) chuyển động với tốc độ $6\\ \\text{m/s}$. Động năng của hệ người và xe bằng","options": ["A. $1350\\ \\text{J}$.","B. $2700\\ \\text{J}$.","C. $450\\ \\text{J}$.","D. $225\\ \\text{J}$."],"answer": "A","explain": "$m = 75\\ \\text{kg}$. $W_đ = \\frac{1}{2} \\cdot 75 \\cdot 36 = 1350\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $6\\ \\text{kg}$ được nâng từ sàn lên bàn cao $0,75\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$). Độ tăng thế năng của vật bằng","options": ["A. $45\\ \\text{J}$.","B. $450\\ \\text{J}$.","C. $4,5\\ \\text{J}$.","D. $80\\ \\text{J}$."],"answer": "A","explain": "$\\Delta W_t = mg\\Delta h = 6 \\cdot 10 \\cdot 0,75 = 45\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo khi bị nén $10\\ \\text{cm}$ có thế năng đàn hồi $2\\ \\text{J}$. Độ cứng của lò xo bằng","options": ["A. $400\\ \\text{N/m}$.","B. $40\\ \\text{N/m}$.","C. $200\\ \\text{N/m}$.","D. $20\\ \\text{N/m}$."],"answer": "A","explain": "$k = 2W/(\\Delta l)^2 = 4/0,01 = 400\\ \\text{N/m}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật có khối lượng $m$, tốc độ $v$. Nếu cả $m$ và $v$ đều tăng gấp đôi thì động năng tăng","options": ["A. 8 lần.","B. 2 lần.","C. 4 lần.","D. 16 lần."],"answer": "A","explain": "$W_đ' = \\frac{1}{2}(2m)(2v)^2 = 8 \\cdot \\frac{1}{2}mv^2 = 8W_đ$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công của ngoại lực bằng độ biến thiên động năng.","b) Khi vật rơi, trọng lực thực hiện công dương và thế năng của vật giảm.","c) Lò xo ở trạng thái tự nhiên có thế năng đàn hồi cực đại.","d) Động năng của vật chuyển động tròn đều không đổi."],"answer": ["T","T","F","T"],"explain": "a) Đúng (định lí động năng). b) Đúng: $A_P \\gt 0$, $W_t = mgh$ giảm. c) Sai: $\\Delta l = 0$ nên $W_{tđh} = 0$ (cực tiểu). d) Đúng: tốc độ không đổi.","points": 1},{"type": "truefalse","level": "VDC","q": "Một vật khối lượng $3\\ \\text{kg}$ đang đứng yên trên mặt ngang thì chịu lực $F = 15\\ \\text{N}$ cùng phương chuyển động trong $4\\ \\text{s}$ (bỏ qua ma sát). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Gia tốc của vật bằng $5\\ \\text{m/s}^2$.","b) Quãng đường vật đi được là $40\\ \\text{m}$.","c) Công của lực $F$ bằng $600\\ \\text{J}$.","d) Động năng của vật sau $4\\ \\text{s}$ bằng $600\\ \\text{J}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $a = 15/3 = 5\\ \\text{m/s}^2$. b) Đúng: $s = \\frac{1}{2} \\cdot 5 \\cdot 16 = 40\\ \\text{m}$. c) Đúng: $A = 15 \\cdot 40 = 600\\ \\text{J}$. d) Đúng: định lí động năng $W_{đ2} = 600\\ \\text{J}$.","points": 1},{"type": "short","level": "VDC","q": "Một vật khối lượng $250\\ \\text{g}$ chuyển động với tốc độ $8\\ \\text{m/s}$. Động năng của vật bằng bao nhiêu jun? (chỉ điền số)","answer": "16","explain": "$W_đ = \\frac{1}{2} \\cdot 0,25 \\cdot 64 = 16\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một con lắc đơn có chiều dài $1\\ \\text{m}$, vật nặng $0,2\\ \\text{kg}$ được kéo lệch khỏi vị trí cân bằng góc $60^\\circ$ rồi thả nhẹ (lấy $g = 10\\ \\text{m/s}^2$). Tốc độ của vật khi qua vị trí cân bằng bằng bao nhiêu m/s? (chỉ điền số)","answer": "3.16","explain": "Độ cao ban đầu: $h = l(1 - \\cos 60^\\circ) = 0,5\\ \\text{m}$. $\\frac{1}{2}mv^2 = mgh$ nên $v = \\sqrt{2 \\cdot 10 \\cdot 0,5} = \\sqrt{10} \\approx 3,16\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Năng lượng nào sau đây KHÔNG phải là cơ năng?","options": ["A. Nhiệt năng.","B. Động năng.","C. Thế năng trọng trường.","D. Thế năng đàn hồi."],"answer": "A","explain": "Cơ năng gồm động năng và thế năng; nhiệt năng không thuộc cơ năng.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi một vật chuyển động chậm dần đều thì","options": ["A. động năng của vật giảm dần.","B. động năng của vật tăng dần.","C. thế năng của vật tăng dần.","D. động năng của vật không đổi."],"answer": "A","explain": "Tốc độ giảm nên $W_đ = \\frac{1}{2}mv^2$ giảm.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $5\\ \\text{kg}$ chuyển động với tốc độ $4\\ \\text{m/s}$ trên mặt ngang thì gặp dốc lên. Bỏ qua ma sát, độ cao cực đại vật lên được là (lấy $g = 10\\ \\text{m/s}^2$)","options": ["A. $0,8\\ \\text{m}$.","B. $1,6\\ \\text{m}$.","C. $8\\ \\text{m}$.","D. $0,4\\ \\text{m}$."],"answer": "A","explain": "$\\frac{1}{2}mv^2 = mgh$, suy ra $h = v^2/(2g) = 16/20 = 0,8\\ \\text{m}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có thế năng đàn hồi $0,9\\ \\text{J}$ khi dãn $6\\ \\text{cm}$. Nếu dãn $12\\ \\text{cm}$ thì thế năng bằng","options": ["A. $3,6\\ \\text{J}$.","B. $1,8\\ \\text{J}$.","C. $0,9\\ \\text{J}$.","D. $7,2\\ \\text{J}$."],"answer": "A","explain": "Độ biến dạng tăng gấp đôi nên $W$ tăng gấp bốn: $0,9 \\cdot 4 = 3,6\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Vật $2\\ \\text{kg}$ đang chuyển động với tốc độ $8\\ \\text{m/s}$ thì hãm lại còn $4\\ \\text{m/s}$. Độ giảm động năng bằng","options": ["A. $48\\ \\text{J}$.","B. $64\\ \\text{J}$.","C. $16\\ \\text{J}$.","D. $96\\ \\text{J}$."],"answer": "A","explain": "$\\Delta W_đ = \\frac{1}{2} \\cdot 2 \\cdot (64 - 16) = 48\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật được thả rơi từ độ cao $h$. Khi vật ở độ cao $h/2$ thì động năng của vật bằng","options": ["A. một nửa thế năng ban đầu.","B. thế năng ban đầu.","C. gấp đôi thế năng ban đầu.","D. 0."],"answer": "A","explain": "Thế năng giảm một nửa ($mgh/2$), phần giảm chuyển thành động năng nên $W_đ = mgh/2$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Định lí động năng: $A = W_{đ2} - W_{đ1}$.","b) Công của trọng lực khi vật đi lên bằng độ tăng thế năng.","c) Khi vật đứng yên, động năng bằng 0 nhưng thế năng có thể khác 0.","d) Thế năng đàn hồi tỉ lệ nghịch với độ cứng của lò xo."],"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: công trọng lực khi đi lên $A_P = -mgh$ bằng ĐỘ GIẢM thế năng ($-\\Delta W_t$). c) Đúng: $W_t$ phụ thuộc vị trí. d) Sai: $W_{tđh}$ tỉ lệ THUẬN với $k$.","points": 1},{"type": "truefalse","level": "VDC","q": "Một vật khối lượng $1\\ \\text{kg}$ trượt từ đỉnh mặt phẳng nghiêng cao $2\\ \\text{m}$ xuống với tốc độ đầu bằng 0, đến chân dốc có tốc độ $5\\ \\text{m/s}$ (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Thế năng ban đầu của vật (mốc tại chân dốc) bằng $20\\ \\text{J}$.","b) Động năng ở chân dốc bằng $12,5\\ \\text{J}$.","c) Công của lực ma sát bằng $-7,5\\ \\text{J}$.","d) Nếu không có ma sát, tốc độ ở chân dốc là $\\sqrt{40}\\ \\text{m/s}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $1 \\cdot 10 \\cdot 2 = 20\\ \\text{J}$. b) Đúng: $\\frac{1}{2} \\cdot 1 \\cdot 25 = 12,5\\ \\text{J}$. c) Đúng: $A_{ms} = 12,5 - 20 = -7,5\\ \\text{J}$. d) Đúng: $v = \\sqrt{2gh} = \\sqrt{40}\\ \\text{m/s}$.","points": 1},{"type": "short","level": "VDC","q": "Một cần trục nâng vật $400\\ \\text{kg}$ lên độ cao $5\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$). Độ tăng thế năng của vật bằng bao nhiêu kilôjun? (chỉ điền số)","answer": "20","explain": "$\\Delta W_t = 400 \\cdot 10 \\cdot 5 = 20000\\ \\text{J} = 20\\ \\text{kJ}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $0,4\\ \\text{kg}$ được ném xiên từ mặt đất với tốc độ $25\\ \\text{m/s}$; khi đạt độ cao $20\\ \\text{m}$ thì tốc độ của vật còn $10\\ \\text{m/s}$ (lấy $g = 10\\ \\text{m/s}^2$). Công của lực cản không khí bằng bao nhiêu jun? (chỉ điền số)","answer": "-25","explain": "Cơ năng ban đầu: $W_1 = \\frac{1}{2} \\cdot 0,4 \\cdot 625 = 125\\ \\text{J}$. Cơ năng lúc sau: $W_2 = \\frac{1}{2} \\cdot 0,4 \\cdot 100 + 0,4 \\cdot 10 \\cdot 20 = 20 + 80 = 100\\ \\text{J}$. Công lực cản: $A_c = W_2 - W_1 = -25\\ \\text{J}$.","points": 0.5}]}]}
