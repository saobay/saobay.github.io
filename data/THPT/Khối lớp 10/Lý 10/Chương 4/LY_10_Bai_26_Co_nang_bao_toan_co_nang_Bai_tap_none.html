{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Cơ năng của một vật được xác định bằng","options": ["A. tổng động năng và thế năng của vật.","B. hiệu động năng và thế năng của vật.","C. tích động năng và thế năng của vật.","D. thương động năng và thế năng của vật."],"answer": "A","explain": "Cơ năng $W = W_đ + W_t$: tổng động năng và thế năng.","points": 0.25},{"type": "mcq","level": "NB","q": "Định luật bảo toàn cơ năng phát biểu rằng","options": ["A. khi vật chỉ chịu tác dụng của trọng lực (không có ma sát), cơ năng của vật được bảo toàn.","B. cơ năng của vật luôn được bảo toàn trong mọi trường hợp.","C. động năng của vật luôn không đổi.","D. thế năng của vật luôn không đổi."],"answer": "A","explain": "Điều kiện bảo toàn cơ năng: vật chỉ chịu tác dụng của lực thế (trọng lực, lực đàn hồi), không có lực cản, ma sát.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi cơ năng được bảo toàn, tại vị trí động năng cực đại thì","options": ["A. thế năng cực tiểu.","B. thế năng cực đại.","C. thế năng bằng động năng.","D. thế năng bằng 0."],"answer": "A","explain": "$W = W_đ + W_t = const$ nên $W_đ$ cực đại khi $W_t$ cực tiểu.","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị của cơ năng trong hệ SI là","options": ["A. jun (J).","B. oát (W).","C. niutơn (N).","D. $\\text{m/s}$."],"answer": "A","explain": "Cơ năng là một dạng năng lượng nên có đơn vị jun.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $1\\ \\text{kg}$ ở độ cao $10\\ \\text{m}$ so với mặt đất, đang đứng yên (lấy $g = 10\\ \\text{m/s}^2$, mốc thế năng tại mặt đất). Cơ năng của vật bằng","options": ["A. $100\\ \\text{J}$.","B. $10\\ \\text{J}$.","C. $110\\ \\text{J}$.","D. $0$."],"answer": "A","explain": "$W_đ = 0$, $W_t = 1 \\cdot 10 \\cdot 10 = 100\\ \\text{J}$ nên $W = 100\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật được thả rơi tự do từ độ cao $20\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Tốc độ của vật khi chạm đất bằng","options": ["A. $20\\ \\text{m/s}$.","B. $10\\ \\text{m/s}$.","C. $40\\ \\text{m/s}$.","D. $14,1\\ \\text{m/s}$."],"answer": "A","explain": "Bảo toàn cơ năng: $mgh = \\frac{1}{2}mv^2$, suy ra $v = \\sqrt{2gh} = \\sqrt{400} = 20\\ \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng bằng tổng động năng và thế năng.","b) Khi có lực ma sát tác dụng, cơ năng của vật vẫn được bảo toàn.","c) Trong chuyển động của con lắc đơn (bỏ qua sức cản), cơ năng được bảo toàn.","d) Khi vật rơi tự do, động năng tăng bao nhiêu thì thế năng giảm bấy nhiêu."],"answer": ["T","F","T","T"],"explain": "a) Đúng: $W = W_đ + W_t$. b) Sai: ma sát làm cơ năng giảm (chuyển thành nhiệt năng). c) Đúng: chỉ có trọng lực sinh công. d) Đúng: $W = const$.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $2\\ \\text{kg}$ được ném thẳng đứng lên với tốc độ $10\\ \\text{m/s}$ từ mặt đất (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản, mốc thế năng tại mặt đất). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng của vật bằng $100\\ \\text{J}$.","b) Độ cao cực đại vật đạt được là $5\\ \\text{m}$.","c) Tại độ cao $2,5\\ \\text{m}$, động năng của vật bằng $50\\ \\text{J}$.","d) Tại độ cao cực đại, thế năng của vật bằng $50\\ \\text{J}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $W = \\frac{1}{2} \\cdot 2 \\cdot 100 = 100\\ \\text{J}$. b) Đúng: $h_{max} = v_0^2/(2g) = 5\\ \\text{m}$. c) Đúng: $W_đ = 100 - 2 \\cdot 10 \\cdot 2,5 = 50\\ \\text{J}$. d) Sai: $W_t = W = 100\\ \\text{J}$.","points": 1},{"type": "short","level": "VD","q": "Một vật khối lượng $0,5\\ \\text{kg}$ trượt không ma sát từ đỉnh dốc cao $4\\ \\text{m}$ xuống chân dốc (lấy $g = 10\\ \\text{m/s}^2$). Tốc độ của vật ở chân dốc bằng bao nhiêu m/s? (chỉ điền số, làm tròn đến 1 chữ số thập phân)","answer": "8.9","explain": "$v = \\sqrt{2gh} = \\sqrt{80} \\approx 8,94\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một con lắc đơn dài $2\\ \\text{m}$, vật nặng $0,3\\ \\text{kg}$ được kéo lệch góc $60^\\circ$ rồi thả nhẹ (lấy $g = 10\\ \\text{m/s}^2$). Tốc độ của vật khi qua vị trí cân bằng bằng bao nhiêu m/s? (chỉ điền số, làm tròn đến 2 chữ số thập phân)","answer": "4.47","explain": "$h = l(1 - \\cos 60^\\circ) = 1\\ \\text{m}$. $v = \\sqrt{2gh} = \\sqrt{20} \\approx 4,47\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "NB","q": "Biểu thức của định luật bảo toàn cơ năng là","options": ["A. $W_1 = W_2$ hay $W_{đ1} + W_{t1} = W_{đ2} + W_{t2}$.","B. $W_{đ1} = W_{đ2}$.","C. $W_{t1} = W_{t2}$.","D. $W_1 + W_2 = 0$."],"answer": "A","explain": "Cơ năng tại hai thời điểm bằng nhau khi được bảo toàn.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong quá trình chuyển động của vật, cơ năng KHÔNG được bảo toàn khi","options": ["A. có lực ma sát hoặc lực cản tác dụng.","B. chỉ có trọng lực tác dụng.","C. chỉ có lực đàn hồi tác dụng.","D. vật chuyển động trong chân không."],"answer": "A","explain": "Ma sát, lực cản là lực không thế, làm cơ năng giảm.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật rơi tự do, tại vị trí thế năng bằng động năng thì","options": ["A. vật ở độ cao bằng một nửa độ cao ban đầu.","B. vật ở độ cao cực đại.","C. vật chạm đất.","D. động năng bằng 0."],"answer": "A","explain": "$W_t = W_đ$ và $W_t + W_đ = mgh_0$ nên $W_t = mgh_0/2$, tức $h = h_0/2$.","points": 0.25},{"type": "mcq","level": "NB","q": "Cơ năng của con lắc lò xo dao động (bỏ qua ma sát) gồm","options": ["A. động năng và thế năng đàn hồi.","B. động năng và thế năng trọng trường.","C. chỉ có động năng.","D. chỉ có thế năng đàn hồi."],"answer": "A","explain": "Con lắc lò xo nằm ngang: $W = W_đ + W_{tđh}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $0,2\\ \\text{kg}$ được ném ngang với tốc độ $10\\ \\text{m/s}$ từ độ cao $5\\ \\text{m}$ so với mặt đất (lấy $g = 10\\ \\text{m/s}^2$, mốc thế năng tại mặt đất, bỏ qua sức cản). Cơ năng của vật bằng","options": ["A. $20\\ \\text{J}$.","B. $10\\ \\text{J}$.","C. $30\\ \\text{J}$.","D. $15\\ \\text{J}$."],"answer": "A","explain": "$W_đ = \\frac{1}{2} \\cdot 0,2 \\cdot 100 = 10\\ \\text{J}$; $W_t = 0,2 \\cdot 10 \\cdot 5 = 10\\ \\text{J}$. $W = 20\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật được thả rơi tự do từ độ cao $h$. Khi động năng bằng thế năng thì tốc độ của vật bằng","options": ["A. $\\sqrt{gh}$.","B. $\\sqrt{2gh}$.","C. $\\sqrt{gh/2}$.","D. $2\\sqrt{gh}$."],"answer": "A","explain": "$W_đ = W_t = mgh/2$ nên $\\frac{1}{2}mv^2 = mgh/2$, suy ra $v = \\sqrt{gh}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Định luật bảo toàn cơ năng chỉ đúng khi không có ma sát và lực cản.","b) Khi vật trượt có ma sát, cơ năng giảm và phần giảm chuyển thành nhiệt năng.","c) Cơ năng của vật ném xiên (bỏ qua sức cản) được bảo toàn.","d) Tại vị trí cao nhất của chuyển động ném xiên, động năng của vật bằng 0."],"answer": ["T","T","T","F"],"explain": "a) Đúng: điều kiện của định luật. b) Đúng: $W_2 - W_1 = A_{ms} \\lt 0$. c) Đúng: chỉ có trọng lực sinh công. d) Sai: tại điểm cao nhất, thành phần vận tốc ngang vẫn khác 0 nên $W_đ \\ne 0$.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $1\\ \\text{kg}$ trượt không ma sát từ đỉnh mặt phẳng nghiêng cao $6\\ \\text{m}$ xuống (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng của vật bằng $60\\ \\text{J}$.","b) Tốc độ của vật ở chân dốc xấp xỉ $11\\ \\text{m/s}$.","c) Tại độ cao $3\\ \\text{m}$, tốc độ của vật xấp xỉ $7,7\\ \\text{m/s}$.","d) Nếu khối lượng tăng gấp đôi thì tốc độ ở chân dốc tăng gấp đôi."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $W = mgh = 60\\ \\text{J}$. b) Đúng: $v = \\sqrt{2 \\cdot 60/1} = \\sqrt{120} \\approx 10,95\\ \\text{m/s}$. c) Đúng: $W_đ = 60 - 30 = 30\\ \\text{J}$, $v = \\sqrt{60} \\approx 7,75\\ \\text{m/s}$. d) Sai: $v = \\sqrt{2gh}$ không phụ thuộc $m$.","points": 1},{"type": "short","level": "VD","q": "Một vật được ném thẳng đứng lên với tốc độ $12\\ \\text{m/s}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Độ cao cực đại vật đạt được bằng bao nhiêu mét? (chỉ điền số)","answer": "7.2","explain": "$h_{max} = v_0^2/(2g) = 144/20 = 7,2\\ \\text{m}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $0,4\\ \\text{kg}$ trượt từ đỉnh dốc cao $3\\ \\text{m}$ xuống, đến chân dốc có tốc độ $6\\ \\text{m/s}$ (lấy $g = 10\\ \\text{m/s}^2$). Công của lực ma sát bằng bao nhiêu jun? (chỉ điền số)","answer": "-4.8","explain": "$W_1 = 0,4 \\cdot 10 \\cdot 3 = 12\\ \\text{J}$; $W_{đ2} = \\frac{1}{2} \\cdot 0,4 \\cdot 36 = 7,2\\ \\text{J}$. $A_{ms} = 7,2 - 12 = -4,8\\ \\text{J}$.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Khi vật chuyển động chỉ dưới tác dụng của trọng lực, đại lượng nào sau đây được bảo toàn?","options": ["A. Cơ năng.","B. Động năng.","C. Thế năng.","D. Vận tốc."],"answer": "A","explain": "Chỉ có tổng $W = W_đ + W_t$ được bảo toàn; $W_đ$ và $W_t$ chuyển hóa lẫn nhau.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật đang rơi tự do, cơ năng của vật","options": ["A. không đổi (bỏ qua sức cản).","B. tăng dần.","C. giảm dần.","D. bằng 0."],"answer": "A","explain": "Chỉ có trọng lực sinh công nên cơ năng bảo toàn.","points": 0.25},{"type": "mcq","level": "NB","q": "Tại vị trí cân bằng của con lắc đơn,","options": ["A. động năng cực đại, thế năng cực tiểu.","B. động năng cực tiểu, thế năng cực đại.","C. cả động năng và thế năng đều cực đại.","D. cơ năng bằng 0."],"answer": "A","explain": "Vị trí cân bằng là vị trí thấp nhất: $W_t$ cực tiểu nên $W_đ$ cực đại.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật khối lượng $m$ được thả rơi từ độ cao $h$. Tốc độ khi chạm đất (bỏ qua sức cản) là","options": ["A. $v = \\sqrt{2gh}$.","B. $v = \\sqrt{gh}$.","C. $v = 2gh$.","D. $v = gh$."],"answer": "A","explain": "Bảo toàn cơ năng: $mgh = \\frac{1}{2}mv^2$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một con lắc đơn có vật nặng $0,5\\ \\text{kg}$, kéo lệch để vật lên cao $0,2\\ \\text{m}$ so với vị trí cân bằng rồi thả nhẹ (lấy $g = 10\\ \\text{m/s}^2$). Tốc độ của vật khi qua vị trí cân bằng bằng","options": ["A. $2\\ \\text{m/s}$.","B. $1\\ \\text{m/s}$.","C. $4\\ \\text{m/s}$.","D. $0,5\\ \\text{m/s}$."],"answer": "A","explain": "$v = \\sqrt{2gh} = \\sqrt{2 \\cdot 10 \\cdot 0,2} = 2\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật được ném lên với tốc độ $v_0$. Bỏ qua sức cản, độ cao cực đại vật đạt được là","options": ["A. $h_{max} = \\frac{v_0^2}{2g}$.","B. $h_{max} = \\frac{v_0^2}{g}$.","C. $h_{max} = \\frac{2v_0^2}{g}$.","D. $h_{max} = v_0^2 g$."],"answer": "A","explain": "$\\frac{1}{2}mv_0^2 = mgh_{max}$ nên $h_{max} = v_0^2/(2g)$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng của vật bằng tổng động năng và thế năng.","b) Khi vật chỉ chịu tác dụng của lực đàn hồi, cơ năng được bảo toàn.","c) Trong dao động của con lắc lò xo (bỏ qua ma sát), động năng cực đại bằng cơ năng.","d) Vật trượt không ma sát từ đỉnh dốc xuống thì tốc độ ở chân dốc phụ thuộc khối lượng."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng: lực đàn hồi là lực thế. c) Đúng: tại vị trí lò xo không biến dạng, $W_{tđh} = 0$ nên $W_đ = W$. d) Sai: $v = \\sqrt{2gh}$ không phụ thuộc $m$.","points": 1},{"type": "truefalse","level": "VD","q": "Một hòn bi khối lượng $0,1\\ \\text{kg}$ lăn không ma sát từ đỉnh dốc cao $2\\ \\text{m}$ xuống (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng của hòn bi bằng $2\\ \\text{J}$.","b) Tốc độ ở chân dốc xấp xỉ $6,3\\ \\text{m/s}$.","c) Khi hòn bi ở độ cao $1\\ \\text{m}$, động năng bằng $1\\ \\text{J}$.","d) Nếu dốc có ma sát thì cơ năng của hòn bi vẫn bằng $2\\ \\text{J}$ suốt quá trình."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $0,1 \\cdot 10 \\cdot 2 = 2\\ \\text{J}$. b) Đúng: $v = \\sqrt{2 \\cdot 2/0,1} = \\sqrt{40} \\approx 6,32\\ \\text{m/s}$. c) Đúng: $W_đ = 2 - 0,1 \\cdot 10 \\cdot 1 = 1\\ \\text{J}$. d) Sai: ma sát làm cơ năng giảm.","points": 1},{"type": "short","level": "VD","q": "Một vật khối lượng $2\\ \\text{kg}$ đang chuyển động với tốc độ $6\\ \\text{m/s}$ ở độ cao $3\\ \\text{m}$ so với mặt đất (lấy $g = 10\\ \\text{m/s}^2$, mốc tại mặt đất). Cơ năng của vật bằng bao nhiêu jun? (chỉ điền số)","answer": "96","explain": "$W_đ = \\frac{1}{2} \\cdot 2 \\cdot 36 = 36\\ \\text{J}$; $W_t = 2 \\cdot 10 \\cdot 3 = 60\\ \\text{J}$. $W = 96\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật được ném thẳng đứng lên từ mặt đất với tốc độ $10\\ \\text{m/s}$ (bỏ qua sức cản, lấy $g = 10\\ \\text{m/s}^2$). Độ cao cực đại mà vật đạt được bằng bao nhiêu mét? (chỉ điền số)","answer": "5","explain": "Bảo toàn cơ năng: $\\frac{1}{2}mv_0^2 = mgh_{max}$, suy ra $h_{max} = v_0^2/(2g) = 100/20 = 5\\ \\text{m}$.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "NB","q": "Định luật bảo toàn cơ năng áp dụng cho trường hợp","options": ["A. vật chỉ chịu tác dụng của trọng lực hoặc lực đàn hồi.","B. vật chịu tác dụng của lực ma sát.","C. vật chịu tác dụng của lực cản không khí lớn.","D. mọi chuyển động của vật."],"answer": "A","explain": "Điều kiện: chỉ có lực thế sinh công.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi có ma sát, cơ năng của vật","options": ["A. giảm dần, phần giảm chuyển thành nhiệt năng.","B. tăng dần.","C. không đổi.","D. bằng 0."],"answer": "A","explain": "$W_2 - W_1 = A_{ms} \\lt 0$: cơ năng giảm, chuyển thành nhiệt năng làm nóng vật và mặt tiếp xúc.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật trượt không ma sát trên mặt phẳng nghiêng từ trên xuống,","options": ["A. thế năng giảm, động năng tăng.","B. thế năng tăng, động năng giảm.","C. cả thế năng và động năng đều tăng.","D. cơ năng tăng."],"answer": "A","explain": "Độ cao giảm nên $W_t$ giảm; $W = const$ nên $W_đ$ tăng.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $3\\ \\text{kg}$ rơi tự do từ độ cao $15\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Khi vật ở độ cao $5\\ \\text{m}$, động năng của vật bằng","options": ["A. $300\\ \\text{J}$.","B. $150\\ \\text{J}$.","C. $450\\ \\text{J}$.","D. $500\\ \\text{J}$."],"answer": "A","explain": "$W = 3 \\cdot 10 \\cdot 15 = 450\\ \\text{J}$. $W_đ = 450 - 3 \\cdot 10 \\cdot 5 = 300\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một con lắc đơn dài $1\\ \\text{m}$ được kéo lệch góc $90^\\circ$ (dây nằm ngang) rồi thả nhẹ (lấy $g = 10\\ \\text{m/s}^2$). Tốc độ của vật khi qua vị trí cân bằng bằng","options": ["A. $\\sqrt{20}\\ \\text{m/s} \\approx 4,47\\ \\text{m/s}$.","B. $10\\ \\text{m/s}$.","C. $\\sqrt{10}\\ \\text{m/s}$.","D. $20\\ \\text{m/s}$."],"answer": "A","explain": "$h = l = 1\\ \\text{m}$. $v = \\sqrt{2gl} = \\sqrt{20} \\approx 4,47\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có độ cứng $k = 200\\ \\text{N/m}$ bị nén $10\\ \\text{cm}$ rồi thả để đẩy viên bi $0,1\\ \\text{kg}$ (bỏ qua ma sát). Tốc độ của viên bi khi rời lò xo bằng","options": ["A. $\\sqrt{20}\\ \\text{m/s} \\approx 4,47\\ \\text{m/s}$.","B. $10\\ \\text{m/s}$.","C. $1\\ \\text{m/s}$.","D. $20\\ \\text{m/s}$."],"answer": "A","explain": "$\\frac{1}{2}k(\\Delta l)^2 = \\frac{1}{2}mv^2$ nên $v^2 = k(\\Delta l)^2/m = 200 \\cdot 0,01/0,1 = 20$, suy ra $v = \\sqrt{20} \\approx 4,47\\ \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khi vật rơi tự do, thế năng chuyển hóa thành động năng.","b) Cơ năng của vật ném ngang (bỏ qua sức cản) được bảo toàn.","c) Tại điểm cao nhất của quỹ đạo ném xiên, cơ năng của vật bằng 0.","d) Lực ma sát trượt không làm thay đổi cơ năng của vật."],"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng: chỉ có trọng lực sinh công. c) Sai: cơ năng $W = const \\ne 0$ (vẫn còn động năng theo phương ngang). d) Sai: ma sát làm cơ năng giảm.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $0,5\\ \\text{kg}$ được ném thẳng đứng lên từ mặt đất với tốc độ $20\\ \\text{m/s}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng của vật bằng $100\\ \\text{J}$.","b) Độ cao cực đại là $20\\ \\text{m}$.","c) Khi vật ở độ cao $10\\ \\text{m}$, tốc độ của vật xấp xỉ $14,1\\ \\text{m/s}$.","d) Khi vật rơi trở về mặt đất, tốc độ bằng $20\\ \\text{m/s}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $\\frac{1}{2} \\cdot 0,5 \\cdot 400 = 100\\ \\text{J}$. b) Đúng: $400/20 = 20\\ \\text{m}$. c) Đúng: $W_đ = 100 - 50 = 50\\ \\text{J}$, $v = \\sqrt{200} \\approx 14,14\\ \\text{m/s}$. d) Đúng: bảo toàn cơ năng.","points": 1},{"type": "short","level": "VDC","q": "Một vật có cơ năng $50\\ \\text{J}$, đang chuyển động với động năng $30\\ \\text{J}$. Thế năng của vật bằng bao nhiêu jun? (chỉ điền số)","answer": "20","explain": "$W_t = W - W_đ = 50 - 30 = 20\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $1\\ \\text{kg}$ trượt không vận tốc đầu từ đỉnh dốc nghiêng cao $4\\ \\text{m}$; khi đến chân dốc, tốc độ của vật là $8\\ \\text{m/s}$ (lấy $g = 10\\ \\text{m/s}^2$). Công của lực ma sát bằng bao nhiêu jun? (chỉ điền số)","answer": "-8","explain": "$W_1 = 40\\ \\text{J}$; $W_{đ2} = \\frac{1}{2} \\cdot 64 = 32\\ \\text{J}$. $A_{ms} = 32 - 40 = -8\\ \\text{J}$.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Cơ năng của vật tại một vị trí bằng","options": ["A. $W = W_đ + W_t$.","B. $W = W_đ - W_t$.","C. $W = \\frac{W_đ}{W_t}$.","D. $W = W_đ \\cdot W_t$."],"answer": "A","explain": "Định nghĩa cơ năng.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật chuyển động trong trọng trường, bỏ qua mọi ma sát. Nhận xét nào sau đây đúng?","options": ["A. Tổng động năng và thế năng của vật không đổi.","B. Động năng của vật không đổi.","C. Thế năng của vật không đổi.","D. Tốc độ của vật không đổi."],"answer": "A","explain": "Cơ năng bảo toàn; động năng và thế năng chuyển hóa lẫn nhau.","points": 0.25},{"type": "mcq","level": "NB","q": "Vật nào sau đây có cơ năng được bảo toàn khi chuyển động (bỏ qua sức cản)?","options": ["A. Viên bi rơi tự do.","B. Ô tô phanh gấp.","C. Vật trượt có ma sát.","D. Tên lửa đang phụt khí."],"answer": "A","explain": "Viên bi rơi tự do chỉ chịu trọng lực nên cơ năng bảo toàn.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $2\\ \\text{kg}$ ở độ cao $4\\ \\text{m}$ đang chuyển động với tốc độ $6\\ \\text{m/s}$ (lấy $g = 10\\ \\text{m/s}^2$, mốc tại mặt đất). Cơ năng của vật bằng","options": ["A. $116\\ \\text{J}$.","B. $80\\ \\text{J}$.","C. $36\\ \\text{J}$.","D. $196\\ \\text{J}$."],"answer": "A","explain": "$W_đ = \\frac{1}{2} \\cdot 2 \\cdot 36 = 36\\ \\text{J}$; $W_t = 2 \\cdot 10 \\cdot 4 = 80\\ \\text{J}$. $W = 116\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một quả bóng được đá lên với tốc độ $14\\ \\text{m/s}$ (bỏ qua sức cản, lấy $g = 10\\ \\text{m/s}^2$). Độ cao cực đại quả bóng đạt được là","options": ["A. $9,8\\ \\text{m}$.","B. $19,6\\ \\text{m}$.","C. $14\\ \\text{m}$.","D. $4,9\\ \\text{m}$."],"answer": "A","explain": "$h_{max} = 14^2/20 = 196/20 = 9,8\\ \\text{m}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật rơi tự do từ độ cao $45\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Tốc độ khi chạm đất bằng","options": ["A. $30\\ \\text{m/s}$.","B. $45\\ \\text{m/s}$.","C. $21,2\\ \\text{m/s}$.","D. $15\\ \\text{m/s}$."],"answer": "A","explain": "$v = \\sqrt{2 \\cdot 10 \\cdot 45} = \\sqrt{900} = 30\\ \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khi vật chỉ chịu tác dụng của trọng lực, cơ năng được bảo toàn.","b) Động năng cực đại của con lắc đơn đạt được tại vị trí dây treo thẳng đứng.","c) Thế năng trọng trường của vật rơi tự do tăng dần.","d) Cơ năng có đơn vị là jun."],"answer": ["T","T","F","T"],"explain": "a) Đúng (định luật bảo toàn cơ năng). b) Đúng: vị trí cân bằng (thấp nhất). c) Sai: độ cao giảm nên thế năng GIẢM. d) Đúng.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $m$ được ném thẳng đứng lên với tốc độ $v_0 = 15\\ \\text{m/s}$ từ mặt đất (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng của vật bằng $112,5m$ (jun).","b) Độ cao cực đại bằng $11,25\\ \\text{m}$.","c) Khi vật ở độ cao $5\\ \\text{m}$, tốc độ của vật xấp xỉ $11,2\\ \\text{m/s}$.","d) Cơ năng của vật tỉ lệ thuận với khối lượng $m$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $W = \\frac{1}{2}m \\cdot 225 = 112,5m$. b) Đúng: $225/20 = 11,25\\ \\text{m}$. c) Đúng: $W_đ = 112,5m - 50m = 62,5m$, $v = \\sqrt{125} \\approx 11,18\\ \\text{m/s}$. d) Đúng: $W = m(v_0^2/2)$ với $v_0$ cho trước.","points": 1},{"type": "short","level": "VDC","q": "Một vật khối lượng $1,5\\ \\text{kg}$ được thả rơi từ độ cao $12\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Động năng của vật khi chạm đất bằng bao nhiêu jun? (chỉ điền số)","answer": "180","explain": "$W_đ = mgh = 1,5 \\cdot 10 \\cdot 12 = 180\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một con lắc đơn dài $0,8\\ \\text{m}$ được kéo lệch góc $53^\\circ$ ($\\cos 53^\\circ \\approx 0,6$) rồi thả nhẹ (lấy $g = 10\\ \\text{m/s}^2$). Tốc độ của vật khi qua vị trí cân bằng bằng bao nhiêu m/s? (chỉ điền số, làm tròn đến 1 chữ số thập phân)","answer": "2.5","explain": "$h = 0,8 \\cdot (1 - 0,6) = 0,32\\ \\text{m}$. $v = \\sqrt{2 \\cdot 10 \\cdot 0,32} = \\sqrt{6,4} \\approx 2,53\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Trong dao động của con lắc đơn (bỏ qua sức cản), khi vật đi từ vị trí biên về vị trí cân bằng thì","options": ["A. thế năng giảm, động năng tăng.","B. thế năng tăng, động năng giảm.","C. cả thế năng và động năng đều tăng.","D. cơ năng tăng."],"answer": "A","explain": "Độ cao giảm nên $W_t$ giảm; $W = const$ nên $W_đ$ tăng.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi vật chuyển động có ma sát, phát biểu nào sau đây đúng?","options": ["A. Cơ năng của vật giảm dần.","B. Cơ năng của vật tăng dần.","C. Cơ năng của vật không đổi.","D. Động năng của vật không đổi."],"answer": "A","explain": "Ma sát sinh công âm làm cơ năng giảm.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật được ném thẳng đứng lên. Bỏ qua sức cản, tại độ cao cực đại thì","options": ["A. thế năng cực đại, động năng bằng 0.","B. động năng cực đại, thế năng bằng 0.","C. cơ năng bằng 0.","D. cơ năng cực đại."],"answer": "A","explain": "Tốc độ bằng 0 nên $W_đ = 0$; độ cao lớn nhất nên $W_t$ cực đại; $W = const$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một viên bi $0,2\\ \\text{kg}$ lăn với tốc độ $5\\ \\text{m/s}$ ở độ cao $2\\ \\text{m}$ so với mặt đất (lấy $g = 10\\ \\text{m/s}^2$, mốc tại mặt đất). Cơ năng của viên bi bằng","options": ["A. $6,5\\ \\text{J}$.","B. $2,5\\ \\text{J}$.","C. $4\\ \\text{J}$.","D. $10,5\\ \\text{J}$."],"answer": "A","explain": "$W_đ = \\frac{1}{2} \\cdot 0,2 \\cdot 25 = 2,5\\ \\text{J}$; $W_t = 0,2 \\cdot 10 \\cdot 2 = 4\\ \\text{J}$. $W = 6,5\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật trượt không ma sát từ đỉnh dốc cao $h = 8\\ \\text{m}$. Tốc độ ở chân dốc (lấy $g = 10\\ \\text{m/s}^2$) bằng","options": ["A. $\\sqrt{160}\\ \\text{m/s} \\approx 12,6\\ \\text{m/s}$.","B. $80\\ \\text{m/s}$.","C. $8\\ \\text{m/s}$.","D. $\\sqrt{80}\\ \\text{m/s}$."],"answer": "A","explain": "$v = \\sqrt{2gh} = \\sqrt{160} \\approx 12,65\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo nằm ngang có $k = 100\\ \\text{N/m}$, vật $0,25\\ \\text{kg}$ gắn vào lò xo. Kéo vật dãn $10\\ \\text{cm}$ rồi thả nhẹ (bỏ qua ma sát). Tốc độ cực đại của vật bằng","options": ["A. $2\\ \\text{m/s}$.","B. $1\\ \\text{m/s}$.","C. $4\\ \\text{m/s}$.","D. $0,5\\ \\text{m/s}$."],"answer": "A","explain": "$\\frac{1}{2}k(\\Delta l)^2 = \\frac{1}{2}mv_{max}^2$, suy ra $v_{max} = \\Delta l\\sqrt{k/m} = 0,1 \\cdot \\sqrt{400} = 2\\ \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng của vật rơi tự do (bỏ qua sức cản) không đổi trong suốt quá trình rơi.","b) Khi vật đi lên, động năng chuyển hóa thành thế năng.","c) Công của lực ma sát bằng độ biến thiên cơ năng.","d) Vật có cơ năng càng lớn thì tốc độ càng lớn."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng: $W_đ$ giảm, $W_t$ tăng, tổng không đổi. c) Đúng: $A_{ms} = W_2 - W_1$. d) Sai: cơ năng còn gồm thế năng, tốc độ lớn chưa chắc cơ năng lớn.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $2\\ \\text{kg}$ trượt không vận tốc đầu từ đỉnh mặt phẳng nghiêng dài $10\\ \\text{m}$, cao $6\\ \\text{m}$, không ma sát (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng của vật bằng $120\\ \\text{J}$.","b) Tốc độ ở chân dốc xấp xỉ $11\\ \\text{m/s}$.","c) Thời gian trượt không ảnh hưởng đến tốc độ ở chân dốc.","d) Nếu góc nghiêng tăng (giữ nguyên độ cao) thì tốc độ ở chân dốc tăng."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $2 \\cdot 10 \\cdot 6 = 120\\ \\text{J}$. b) Đúng: $v = \\sqrt{2 \\cdot 120/2} = \\sqrt{120} \\approx 10,95\\ \\text{m/s}$. c) Đúng: $v = \\sqrt{2gh}$ chỉ phụ thuộc $h$. d) Sai: $v$ chỉ phụ thuộc độ cao, không phụ thuộc góc nghiêng.","points": 1},{"type": "short","level": "VDC","q": "Một vật được ném thẳng đứng lên đạt độ cao cực đại $20\\ \\text{m}$ (bỏ qua sức cản, lấy $g = 10\\ \\text{m/s}^2$). Tốc độ ném ban đầu bằng bao nhiêu m/s? (chỉ điền số)","answer": "20","explain": "$v_0 = \\sqrt{2gh_{max}} = \\sqrt{400} = 20\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $0,5\\ \\text{kg}$ trượt trên mặt ngang với tốc độ đầu $8\\ \\text{m/s}$ rồi dừng lại sau $16\\ \\text{m}$ do ma sát. Công của lực ma sát bằng bao nhiêu jun? (chỉ điền số)","answer": "-16","explain": "$A_{ms} = 0 - \\frac{1}{2} \\cdot 0,5 \\cdot 64 = -16\\ \\text{J}$.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Phát biểu nào sau đây là SAI?","options": ["A. Cơ năng luôn được bảo toàn.","B. Cơ năng bằng tổng động năng và thế năng.","C. Cơ năng có đơn vị là jun.","D. Khi có ma sát, cơ năng giảm."],"answer": "A","explain": "Cơ năng chỉ bảo toàn khi không có lực cản, ma sát.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật đang chuyển động, nếu thế năng tăng mà cơ năng không đổi thì","options": ["A. động năng giảm.","B. động năng tăng.","C. động năng không đổi.","D. tốc độ tăng."],"answer": "A","explain": "$W_đ = W - W_t$: $W_t$ tăng thì $W_đ$ giảm.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong chuyển động ném ngang (bỏ qua sức cản),","options": ["A. cơ năng của vật được bảo toàn.","B. động năng của vật không đổi.","C. thế năng của vật không đổi.","D. tốc độ của vật không đổi."],"answer": "A","explain": "Chỉ có trọng lực sinh công nên cơ năng bảo toàn (động năng tăng, thế năng giảm).","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $4\\ \\text{kg}$ được thả rơi từ độ cao $10\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Khi vật còn cách mặt đất $4\\ \\text{m}$, tốc độ của vật bằng","options": ["A. $\\sqrt{120}\\ \\text{m/s} \\approx 11\\ \\text{m/s}$.","B. $\\sqrt{200}\\ \\text{m/s}$.","C. $10\\ \\text{m/s}$.","D. $\\sqrt{80}\\ \\text{m/s}$."],"answer": "A","explain": "$W = 400\\ \\text{J}$; $W_t = 4 \\cdot 10 \\cdot 4 = 160\\ \\text{J}$; $W_đ = 240\\ \\text{J}$; $v = \\sqrt{2 \\cdot 240/4} = \\sqrt{120}\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một con lắc đơn được thả từ vị trí dây treo hợp với phương thẳng đứng góc $60^\\circ$, chiều dài dây $1\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$). Tốc độ tại vị trí cân bằng bằng","options": ["A. $\\sqrt{10}\\ \\text{m/s} \\approx 3,16\\ \\text{m/s}$.","B. $10\\ \\text{m/s}$.","C. $5\\ \\text{m/s}$.","D. $\\sqrt{20}\\ \\text{m/s}$."],"answer": "A","explain": "$h = 1 - \\cos 60^\\circ = 0,5\\ \\text{m}$; $v = \\sqrt{2 \\cdot 10 \\cdot 0,5} = \\sqrt{10}\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật có khối lượng $m$, ở độ cao $h$ có tốc độ $v$. Cơ năng của vật (mốc tại mặt đất) là","options": ["A. $W = \\frac{1}{2}mv^2 + mgh$.","B. $W = \\frac{1}{2}mv^2 - mgh$.","C. $W = mgh - \\frac{1}{2}mv^2$.","D. $W = mv^2 + mgh$."],"answer": "A","explain": "$W = W_đ + W_t$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Định luật bảo toàn cơ năng là trường hợp riêng của định luật bảo toàn năng lượng.","b) Khi vật rơi có sức cản không khí, cơ năng giảm dần.","c) Tại mọi vị trí, tổng động năng và thế năng của con lắc đơn (bỏ qua sức cản) là như nhau.","d) Vật trượt đều xuống dốc nghiêng có cơ năng bảo toàn."],"answer": ["T","T","T","F"],"explain": "a) Đúng: năng lượng nói chung luôn bảo toàn; cơ năng chỉ bảo toàn khi không có lực không thế. b) Đúng: sức cản sinh công âm. c) Đúng: $W = const$. d) Sai: trượt đều thì có ma sát cân bằng với thành phần trọng lực, cơ năng giảm.","points": 1},{"type": "truefalse","level": "VD","q": "Một xe trượt không ma sát từ đỉnh đường ray cao $12\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Tốc độ của xe ở chân đường ray xấp xỉ $15,5\\ \\text{m/s}$.","b) Muốn xe lên được đỉnh đồi tiếp theo cao $10\\ \\text{m}$ thì tốc độ ở chân phải đủ lớn.","c) Với tốc độ ở chân như câu a, xe lên được tối đa $12\\ \\text{m}$.","d) Khối lượng xe tăng gấp đôi thì tốc độ ở chân tăng gấp đôi."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $v = \\sqrt{2 \\cdot 10 \\cdot 12} = \\sqrt{240} \\approx 15,49\\ \\text{m/s}$. b) Đúng: cần $W_đ \\ge mgh'$. c) Đúng: $h'_{max} = v^2/(2g) = 12\\ \\text{m}$. d) Sai: $v$ không phụ thuộc $m$.","points": 1},{"type": "short","level": "VDC","q": "Một vật khối lượng $0,8\\ \\text{kg}$ đang bay với tốc độ $10\\ \\text{m/s}$ ở độ cao $6\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$, mốc tại mặt đất). Cơ năng của vật bằng bao nhiêu jun? (chỉ điền số)","answer": "88","explain": "$W_đ = \\frac{1}{2} \\cdot 0,8 \\cdot 100 = 40\\ \\text{J}$; $W_t = 0,8 \\cdot 10 \\cdot 6 = 48\\ \\text{J}$. $W = 88\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật được ném thẳng đứng lên từ mặt đất; khi vật ở độ cao $3\\ \\text{m}$ thì tốc độ của vật là $4\\ \\text{m/s}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Tốc độ ném ban đầu bằng bao nhiêu m/s? (chỉ điền số)","answer": "8.72","explain": "Bảo toàn cơ năng: $\\frac{1}{2}v_0^2 = \\frac{1}{2} \\cdot 16 + 10 \\cdot 3 = 38$, suy ra $v_0 = \\sqrt{76} \\approx 8,72\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "NB","q": "Cơ năng của hệ vật và lò xo (bỏ qua ma sát) gồm","options": ["A. động năng của vật và thế năng đàn hồi của lò xo.","B. chỉ động năng của vật.","C. chỉ thế năng đàn hồi.","D. động năng và nhiệt năng."],"answer": "A","explain": "$W = W_đ + W_{tđh}$.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi con lắc đơn đi từ vị trí cân bằng ra vị trí biên thì","options": ["A. động năng giảm, thế năng tăng.","B. động năng tăng, thế năng giảm.","C. động năng và thế năng đều giảm.","D. cơ năng giảm."],"answer": "A","explain": "Độ cao tăng nên $W_t$ tăng; $W = const$ nên $W_đ$ giảm.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $1\\ \\text{kg}$ rơi tự do từ độ cao $5\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Động năng của vật khi chạm đất bằng","options": ["A. $50\\ \\text{J}$.","B. $5\\ \\text{J}$.","C. $25\\ \\text{J}$.","D. $100\\ \\text{J}$."],"answer": "A","explain": "$W_đ = mgh = 50\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vận động viên nhảy cầu từ ván cao $10\\ \\text{m}$ với tốc độ ban đầu không đáng kể (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Tốc độ khi chạm nước bằng","options": ["A. $\\sqrt{200}\\ \\text{m/s} \\approx 14,1\\ \\text{m/s}$.","B. $10\\ \\text{m/s}$.","C. $20\\ \\text{m/s}$.","D. $100\\ \\text{m/s}$."],"answer": "A","explain": "$v = \\sqrt{2gh} = \\sqrt{200} \\approx 14,14\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật được ném lên với tốc độ $v_0 = 8\\ \\text{m/s}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Khi vật ở độ cao $2\\ \\text{m}$, tốc độ của vật bằng","options": ["A. $\\sqrt{24}\\ \\text{m/s} \\approx 4,9\\ \\text{m/s}$.","B. $8\\ \\text{m/s}$.","C. $6\\ \\text{m/s}$.","D. $\\sqrt{104}\\ \\text{m/s}$."],"answer": "A","explain": "$\\frac{1}{2}v^2 = \\frac{1}{2} \\cdot 64 - 10 \\cdot 2 = 12$, suy ra $v = \\sqrt{24} \\approx 4,9\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Hai vật có cùng cơ năng khi rơi tự do từ cùng độ cao. Nhận xét nào đúng?","options": ["A. Hai vật chạm đất với cùng tốc độ.","B. Vật nặng hơn chạm đất nhanh hơn.","C. Vật nhẹ hơn chạm đất với tốc độ lớn hơn.","D. Không so sánh được."],"answer": "A","explain": "$v = \\sqrt{2gh}$ không phụ thuộc khối lượng.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Thế năng của vật ở độ cao cực đại (ném thẳng đứng, bỏ qua sức cản) bằng cơ năng.","b) Động năng của vật ném xiên tại điểm cao nhất bằng 0.","c) Cơ năng của vật chỉ chịu tác dụng của trọng lực là không đổi.","d) Khi có lực cản, độ giảm cơ năng bằng công của lực cản (lấy dấu âm)."],"answer": ["T","F","T","T"],"explain": "a) Đúng: $W_đ = 0$ nên $W_t = W$. b) Sai: còn thành phần tốc độ ngang. c) Đúng. d) Đúng: $W_2 - W_1 = A_c \\lt 0$.","points": 1},{"type": "truefalse","level": "VDC","q": "Một lò xo có độ cứng $k = 50\\ \\text{N/m}$ đặt nằm ngang, một đầu gắn vật $0,2\\ \\text{kg}$. Nén lò xo $20\\ \\text{cm}$ rồi thả nhẹ (bỏ qua ma sát). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng của hệ bằng $1\\ \\text{J}$.","b) Tốc độ cực đại của vật bằng $\\sqrt{10}\\ \\text{m/s}$.","c) Khi lò xo dãn $10\\ \\text{cm}$, tốc độ của vật xấp xỉ $2,7\\ \\text{m/s}$.","d) Nếu có ma sát thì tốc độ cực đại vẫn đạt tại vị trí lò xo không biến dạng."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $W = \\frac{1}{2} \\cdot 50 \\cdot 0,04 = 1\\ \\text{J}$. b) Đúng: $v_{max} = \\sqrt{2 \\cdot 1/0,2} = \\sqrt{10}\\ \\text{m/s}$. c) Đúng: $W_đ = 1 - \\frac{1}{2} \\cdot 50 \\cdot 0,01 = 0,75\\ \\text{J}$, $v = \\sqrt{7,5} \\approx 2,74\\ \\text{m/s}$. d) Sai: có ma sát, vị trí tốc độ cực đại lệch khỏi vị trí lò xo không biến dạng.","points": 1},{"type": "short","level": "VDC","q": "Một vật khối lượng $3\\ \\text{kg}$ có cơ năng $120\\ \\text{J}$ (mốc thế năng tại mặt đất), đang ở độ cao $2\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$). Động năng của vật bằng bao nhiêu jun? (chỉ điền số)","answer": "60","explain": "$W_t = 3 \\cdot 10 \\cdot 2 = 60\\ \\text{J}$. $W_đ = 120 - 60 = 60\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $0,25\\ \\text{kg}$ được bắn thẳng đứng lên với tốc độ $30\\ \\text{m/s}$; khi đạt độ cao $30\\ \\text{m}$, tốc độ còn $10\\ \\text{m/s}$ (lấy $g = 10\\ \\text{m/s}^2$). Công của lực cản không khí bằng bao nhiêu jun? (chỉ điền số)","answer": "-25","explain": "Cơ năng ban đầu: $W_1 = \\frac{1}{2} \\cdot 0,25 \\cdot 900 = 112,5\\ \\text{J}$. Cơ năng lúc sau: $W_2 = \\frac{1}{2} \\cdot 0,25 \\cdot 100 + 0,25 \\cdot 10 \\cdot 30 = 12,5 + 75 = 87,5\\ \\text{J}$. Công lực cản: $A_c = W_2 - W_1 = -25\\ \\text{J}$.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Định luật bảo toàn cơ năng đúng khi","options": ["A. không có lực ma sát và lực cản.","B. có lực ma sát.","C. có lực cản không khí.","D. vật chuyển động đều."],"answer": "A","explain": "Ma sát, lực cản làm cơ năng không bảo toàn.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật rơi tự do từ độ cao $h_0$. Tại độ cao nào thì động năng gấp đôi thế năng?","options": ["A. $h = h_0/3$.","B. $h = h_0/2$.","C. $h = 2h_0/3$.","D. $h = h_0/4$."],"answer": "A","explain": "$W_đ = 2W_t$ và $W_đ + W_t = mgh_0$ nên $3W_t = mgh_0$, suy ra $h = h_0/3$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật $0,4\\ \\text{kg}$ được ném lên với tốc độ $10\\ \\text{m/s}$ (bỏ qua sức cản, lấy $g = 10\\ \\text{m/s}^2$). Cơ năng của vật bằng","options": ["A. $20\\ \\text{J}$.","B. $40\\ \\text{J}$.","C. $4\\ \\text{J}$.","D. $100\\ \\text{J}$."],"answer": "A","explain": "$W = \\frac{1}{2} \\cdot 0,4 \\cdot 100 = 20\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một con lắc đơn dài $1,5\\ \\text{m}$ được kéo lệch để vật lên cao $0,3\\ \\text{m}$ rồi thả nhẹ (lấy $g = 10\\ \\text{m/s}^2$). Tốc độ tại vị trí cân bằng bằng","options": ["A. $\\sqrt{6}\\ \\text{m/s} \\approx 2,45\\ \\text{m/s}$.","B. $\\sqrt{30}\\ \\text{m/s}$.","C. $3\\ \\text{m/s}$.","D. $1,5\\ \\text{m/s}$."],"answer": "A","explain": "$v = \\sqrt{2 \\cdot 10 \\cdot 0,3} = \\sqrt{6} \\approx 2,45\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật trượt không ma sát từ đỉnh dốc cao $2,5\\ \\text{m}$. Tốc độ ở chân dốc (lấy $g = 10\\ \\text{m/s}^2$) bằng","options": ["A. $\\sqrt{50}\\ \\text{m/s} \\approx 7,07\\ \\text{m/s}$.","B. $5\\ \\text{m/s}$.","C. $25\\ \\text{m/s}$.","D. $\\sqrt{25}\\ \\text{m/s}$."],"answer": "A","explain": "$v = \\sqrt{2 \\cdot 10 \\cdot 2,5} = \\sqrt{50}\\ \\text{m/s}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật có cơ năng $80\\ \\text{J}$ đang ở độ cao mà thế năng bằng $3$ lần động năng. Động năng của vật bằng","options": ["A. $20\\ \\text{J}$.","B. $60\\ \\text{J}$.","C. $26,7\\ \\text{J}$.","D. $240\\ \\text{J}$."],"answer": "A","explain": "$W_t = 3W_đ$ nên $4W_đ = 80$, $W_đ = 20\\ \\text{J}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khi vật chỉ chịu tác dụng của trọng lực, tổng động năng và thế năng không đổi.","b) Con lắc đơn dao động với biên độ nhỏ (bỏ qua sức cản) có cơ năng bảo toàn.","c) Vật trượt có ma sát xuống dốc thì động năng luôn tăng.","d) Độ giảm cơ năng bằng độ lớn công của lực ma sát."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: ma sát có thể làm vật trượt đều (động năng không đổi) hoặc chậm dần. d) Đúng: $|\\Delta W| = |A_{ms}|$.","points": 1},{"type": "truefalse","level": "VDC","q": "Một vật khối lượng $5\\ \\text{kg}$ được thả rơi từ độ cao $8\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản, mốc tại mặt đất). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng của vật bằng $400\\ \\text{J}$.","b) Khi vật ở độ cao $2\\ \\text{m}$, động năng bằng $300\\ \\text{J}$.","c) Tốc độ chạm đất bằng $\\sqrt{160}\\ \\text{m/s}$.","d) Tại độ cao $4\\ \\text{m}$, thế năng gấp đôi động năng."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $5 \\cdot 10 \\cdot 8 = 400\\ \\text{J}$. b) Đúng: $400 - 5 \\cdot 10 \\cdot 2 = 300\\ \\text{J}$. c) Đúng: $v = \\sqrt{2 \\cdot 400/5} = \\sqrt{160}\\ \\text{m/s}$. d) Sai: $W_t = 200\\ \\text{J} = W_đ$, bằng nhau.","points": 1},{"type": "short","level": "VDC","q": "Một vật được ném thẳng đứng lên với tốc độ $18\\ \\text{m/s}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Khi động năng bằng thế năng, vật ở độ cao bao nhiêu mét? (chỉ điền số)","answer": "8.1","explain": "$W_đ = W_t = W/2$ nên $mgh = \\frac{1}{4}mv_0^2$, suy ra $h = v_0^2/(4g) = 324/40 = 8,1\\ \\text{m}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $2\\ \\text{kg}$ trượt từ đỉnh dốc cao $5\\ \\text{m}$ xuống với tốc độ đầu bằng 0; khi đến chân dốc tốc độ là $8\\ \\text{m/s}$ (lấy $g = 10\\ \\text{m/s}^2$). Độ lớn công của lực ma sát bằng bao nhiêu jun? (chỉ điền số)","answer": "36","explain": "$W_1 = 100\\ \\text{J}$; $W_{đ2} = \\frac{1}{2} \\cdot 2 \\cdot 64 = 64\\ \\text{J}$. $|A_{ms}| = 36\\ \\text{J}$.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Khi vật chuyển động chỉ dưới tác dụng của lực đàn hồi thì","options": ["A. cơ năng của vật được bảo toàn.","B. động năng của vật không đổi.","C. thế năng đàn hồi không đổi.","D. tốc độ của vật không đổi."],"answer": "A","explain": "Lực đàn hồi là lực thế nên cơ năng bảo toàn.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật được ném thẳng đứng lên, bỏ qua sức cản. Trong quá trình vật đi lên,","options": ["A. động năng giảm, thế năng tăng.","B. động năng tăng, thế năng giảm.","C. động năng và thế năng đều tăng.","D. cơ năng tăng."],"answer": "A","explain": "Tốc độ giảm, độ cao tăng; $W = const$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một hòn đá $0,5\\ \\text{kg}$ được ném xiên với tốc độ $12\\ \\text{m/s}$ từ mặt đất (bỏ qua sức cản). Cơ năng của hòn đá bằng","options": ["A. $36\\ \\text{J}$.","B. $72\\ \\text{J}$.","C. $6\\ \\text{J}$.","D. $144\\ \\text{J}$."],"answer": "A","explain": "$W = \\frac{1}{2} \\cdot 0,5 \\cdot 144 = 36\\ \\text{J}$ (thế năng tại mặt đất bằng 0).","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật rơi tự do từ độ cao $h_0 = 20\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Khi thế năng bằng $3$ lần động năng, vật cách mặt đất","options": ["A. $15\\ \\text{m}$.","B. $5\\ \\text{m}$.","C. $10\\ \\text{m}$.","D. $6,7\\ \\text{m}$."],"answer": "A","explain": "$W_t = 3W_đ$, $W_t + W_đ = mgh_0$ nên $W_t = 3mgh_0/4$, $h = 15\\ \\text{m}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một con lắc lò xo nằm ngang dao động (bỏ qua ma sát). Tại vị trí lò xo không biến dạng,","options": ["A. động năng của vật cực đại.","B. thế năng đàn hồi cực đại.","C. cơ năng bằng 0.","D. tốc độ của vật bằng 0."],"answer": "A","explain": "$W_{tđh} = 0$ nên $W_đ = W$ cực đại.","points": 0.25},{"type": "mcq","level": "VD","q": "Một vật khối lượng $m$ rơi tự do từ độ cao $h$. Công của trọng lực trong quá trình rơi bằng","options": ["A. $mgh$.","B. $\\frac{1}{2}mgh$.","C. $2mgh$.","D. $0$."],"answer": "A","explain": "$A_P = mgh$ (cũng bằng độ tăng động năng).","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng bằng tổng động năng và thế năng tại cùng một thời điểm.","b) Khi không có ma sát, cơ năng của vật chuyển động trong trọng trường là hằng số.","c) Vật có tốc độ càng lớn thì cơ năng càng lớn.","d) Đơn vị của cơ năng là jun."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: cơ năng còn phụ thuộc thế năng (vị trí). d) Đúng.","points": 1},{"type": "truefalse","level": "VDC","q": "Một vật khối lượng $1\\ \\text{kg}$ được ném ngang với tốc độ $10\\ \\text{m/s}$ từ độ cao $20\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản, mốc tại mặt đất). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng của vật bằng $250\\ \\text{J}$.","b) Tốc độ của vật khi chạm đất xấp xỉ $22,4\\ \\text{m/s}$.","c) Tại độ cao $10\\ \\text{m}$, động năng của vật bằng $150\\ \\text{J}$.","d) Thời gian rơi của vật phụ thuộc vào khối lượng."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $50 + 200 = 250\\ \\text{J}$. b) Đúng: $v = \\sqrt{2 \\cdot 250/1} = \\sqrt{500} \\approx 22,36\\ \\text{m/s}$. c) Đúng: $W_đ = 250 - 100 = 150\\ \\text{J}$. d) Sai: $t = \\sqrt{2h/g}$ không phụ thuộc $m$.","points": 1},{"type": "short","level": "VDC","q": "Một lò xo có độ cứng $k = 120\\ \\text{N/m}$ bị nén $15\\ \\text{cm}$ rồi thả để đẩy vật $0,3\\ \\text{kg}$ trượt trên mặt ngang không ma sát. Tốc độ của vật khi rời lò xo bằng bao nhiêu m/s? (chỉ điền số, làm tròn đến 1 chữ số thập phân)","answer": "3","explain": "$\\frac{1}{2} \\cdot 120 \\cdot 0,0225 = \\frac{1}{2} \\cdot 0,3 \\cdot v^2$, suy ra $v^2 = 9$, $v = 3\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $m$ được thả rơi từ độ cao $H$; khi chạm đất, tốc độ của vật là $0,8$ lần tốc độ khi không có sức cản (lấy $g = 10\\ \\text{m/s}^2$). Tỉ số giữa công của lực cản và trọng lượng nhân độ cao ($|A_c|/(mgH)$) bằng bao nhiêu? (chỉ điền số)","answer": "0.36","explain": "$v_{lý tưởng} = \\sqrt{2gH}$; $v_{thực} = 0,8\\sqrt{2gH}$. $W_{đ} = \\frac{1}{2}m \\cdot 0,64 \\cdot 2gH = 0,64mgH$. $|A_c| = mgH - 0,64mgH = 0,36mgH$.","points": 0.5}]}]}
