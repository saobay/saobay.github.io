\text{W}$."],"answer": "A","explain": "$P_{có ích} = 0,75 \\cdot 2000 = 1500\\ \\text{W}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Hiệu suất cho biết máy sử dụng năng lượng hiệu quả đến mức nào.","b) Hiệu suất có thể lớn hơn $100\\%$ nếu máy tốt.","c) Công toàn phần bằng công có ích cộng công hao phí.","d) Muốn tăng hiệu suất phải giảm năng lượng hao phí."],"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: $H \\le 100\\%$ vì luôn có hao phí. c) Đúng: $A_{tp} = A_{ci} + A_{hp}$. d) Đúng: giảm ma sát, bôi trơn...","points": 1},{"type": "truefalse","level": "VD","q": "Một máy bơm có công suất toàn phần $1500\\ \\text{W}$, hiệu suất $80\\%$, dùng để bơm nước lên cao $10\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công suất có ích của máy bơm bằng $1200\\ \\text{W}$.","b) Mỗi giây máy bơm đưa được $12\\ \\text{kg}$ nước lên.","c) Trong $1$ phút, khối lượng nước bơm được là $720\\ \\text{kg}$.","d) Năng lượng hao phí mỗi giây là $1500\\ \\text{J}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $0,8 \\cdot 1500 = 1200\\ \\text{W}$. b) Đúng: $m = P_{ci}/(gh) = 1200/100 = 12\\ \\text{kg}$. c) Đúng: $12 \\cdot 60 = 720\\ \\text{kg}$. d) Sai: hao phí mỗi giây là $1500 - 1200 = 300\\ \\text{J}$.","points": 1},{"type": "short","level": "VD","q": "Một ròng rọc có hiệu suất $90\\%$. Để nâng vật nặng $50\\ \\text{kg}$ lên cao $4\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$), công toàn phần cần thực hiện bằng bao nhiêu jun? (chỉ điền số, làm tròn đến hàng đơn vị)","answer": "2222","explain": "$A_{ci} = 50 \\cdot 10 \\cdot 4 = 2000\\ \\text{J}$. $A_{tp} = A_{ci}/H = 2000/0,9 \\approx 2222\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Dùng mặt phẳng nghiêng dài $5\\ \\text{m}$ để kéo vật $60\\ \\text{kg}$ lên cao $2\\ \\text{m}$ với lực kéo $300\\ \\text{N}$ (lấy $g = 10\\ \\text{m/s}^2$). Hiệu suất của mặt phẳng nghiêng bằng bao nhiêu phần trăm? (chỉ điền số)","answer": "80","explain": "$A_{ci} = 60 \\cdot 10 \\cdot 2 = 1200\\ \\text{J}$; $A_{tp} = 300 \\cdot 5 = 1500\\ \\text{J}$. $H = 1200/1500 = 80\\%$.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "NB","q": "Công có ích là","options": ["A. phần công phục vụ trực tiếp mục đích sử dụng.","B. tổng công mà máy thực hiện.","C. phần công do ma sát gây ra.","D. công của trọng lực."],"answer": "A","explain": "Ví dụ: công nâng vật lên cao là công có ích của cần cẩu.","points": 0.25},{"type": "mcq","level": "NB","q": "Công hao phí là","options": ["A. phần công không phục vụ mục đích sử dụng (thường do ma sát).","B. công có ích của máy.","C. tổng năng lượng đầu vào.","D. công của lực phát động."],"answer": "A","explain": "Công hao phí thắng ma sát, chuyển thành nhiệt năng tỏa ra môi trường.","points": 0.25},{"type": "mcq","level": "NB","q": "Hiệu suất được tính theo công suất bằng","options": ["A. $H = \\frac{P_{có ích}}{P_{toàn phần}} \\cdot 100\\%$.","B. $H = \\frac{P_{toàn phần}}{P_{có ích}} \\cdot 100\\%$.","C. $H = P_{có ích} - P_{hao phí}$.","D. $H = \\frac{A}{P} \\cdot 100\\%$."],"answer": "A","explain": "Vì $P = A/t$ nên tỉ số công suất bằng tỉ số công trong cùng thời gian.","points": 0.25},{"type": "mcq","level": "NB","q": "Muốn nâng cao hiệu suất của máy cơ, cần","options": ["A. giảm ma sát.","B. tăng ma sát.","C. tăng khối lượng máy.","D. giảm công có ích."],"answer": "A","explain": "Giảm ma sát (bôi trơn, dùng ổ bi...) làm giảm hao phí, tăng $H$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một máy có công suất toàn phần $500\\ \\text{W}$, công suất hao phí $100\\ \\text{W}$. Hiệu suất của máy bằng","options": ["A. $80\\%$.","B. $20\\%$.","C. $500\\%$.","D. $120\\%$."],"answer": "A","explain": "$P_{ci} = 500 - 100 = 400\\ \\text{W}$. $H = 400/500 = 80\\%$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một động cơ điện tiêu thụ công suất $1000\\ \\text{W}$, hiệu suất $90\\%$. Công suất tỏa nhiệt hao phí bằng","options": ["A. $100\\ \\text{W}$.","B. $900\\ \\text{W}$.","C. $1111\\ \\text{W}$.","D. $10\\ \\text{W}$."],"answer": "A","explain": "$P_{hp} = 1000 - 0,9 \\cdot 1000 = 100\\ \\text{W}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) $H = \\frac{A_{ci}}{A_{tp}} \\cdot 100\\%$ và $H = \\frac{P_{ci}}{P_{tp}} \\cdot 100\\%$ là tương đương.","b) Không có máy nào đạt hiệu suất $100\\%$.","c) Hiệu suất càng cao thì năng lượng hao phí càng ít (với cùng công có ích).","d) Công có ích luôn lớn hơn công toàn phần."],"answer": ["T","T","T","F"],"explain": "a) Đúng: cùng tỉ số trong cùng khoảng thời gian. b) Đúng: luôn có ma sát, hao phí. c) Đúng. d) Sai: $A_{ci} \\le A_{tp}$.","points": 1},{"type": "truefalse","level": "VD","q": "Một ô tô có công suất động cơ $60000\\ \\text{W}$, hiệu suất $30\\%$ (phần còn lại tỏa nhiệt). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công suất có ích bằng $18000\\ \\text{W}$.","b) Công suất hao phí bằng $42000\\ \\text{W}$.","c) Trong $1$ giờ, năng lượng hao phí là $151,2\\ \\text{MJ}$.","d) Hiệu suất $30\\%$ nghĩa là $70\\%$ nhiên liệu bị lãng phí."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $0,3 \\cdot 60000 = 18000\\ \\text{W}$. b) Đúng: $60000 - 18000 = 42000\\ \\text{W}$. c) Đúng: $42000 \\cdot 3600 = 151200000\\ \\text{J} = 151,2\\ \\text{MJ}$. d) Đúng (nói theo nghĩa năng lượng).","points": 1},{"type": "short","level": "VD","q": "Một máy kéo có hiệu suất $85\\%$, công suất toàn phần $20000\\ \\text{W}$. Công suất có ích bằng bao nhiêu oát? (chỉ điền số)","answer": "17000","explain": "$P_{ci} = 0,85 \\cdot 20000 = 17000\\ \\text{W}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một cần cẩu nâng $400\\ \\text{kg}$ vật liệu lên cao $15\\ \\text{m}$ trong $30\\ \\text{s}$ với hiệu suất $75\\%$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất toàn phần của cần cẩu bằng bao nhiêu oát? (chỉ điền số)","answer": "2667","explain": "$A_{ci} = 400 \\cdot 10 \\cdot 15 = 60000\\ \\text{J}$. $P_{ci} = 2000\\ \\text{W}$. $P_{tp} = 2000/0,75 \\approx 2667\\ \\text{W}$.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Hiệu suất $H = 80\\%$ có nghĩa là","options": ["A. $80\\%$ năng lượng đầu vào được chuyển thành công có ích.","B. $80\\%$ năng lượng bị hao phí.","C. máy thực hiện công $80\\ \\text{J}$.","D. máy hoạt động $80\\%$ thời gian."],"answer": "A","explain": "$H$ là tỉ lệ năng lượng có ích trên tổng năng lượng đầu vào.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong các biện pháp sau, biện pháp nào giúp tăng hiệu suất của máy cơ?","options": ["A. Bôi trơn các bộ phận chuyển động.","B. Tăng độ nhám của bề mặt tiếp xúc.","C. Tăng khối lượng của máy.","D. Giảm công suất của máy."],"answer": "A","explain": "Bôi trơn giảm ma sát, giảm hao phí.","points": 0.25},{"type": "mcq","level": "NB","q": "Công thức nào sau đây tính hiệu suất là SAI?","options": ["A. $H = \\frac{A_{tp}}{A_{ci}} \\cdot 100\\%$.","B. $H = \\frac{A_{ci}}{A_{tp}} \\cdot 100\\%$.","C. $H = \\frac{P_{ci}}{P_{tp}} \\cdot 100\\%$.","D. $H = \\left(1 - \\frac{A_{hp}}{A_{tp}}\\right) \\cdot 100\\%$."],"answer": "A","explain": "Tỉ số đúng là có ích trên toàn phần; phương án A đảo ngược nên cho $H \\ge 100\\%$ là sai.","points": 0.25},{"type": "mcq","level": "NB","q": "Một máy bơm nước có hiệu suất $70\\%$. Để có công có ích $3500\\ \\text{J}$, cần cung cấp năng lượng bằng","options": ["A. $5000\\ \\text{J}$.","B. $2450\\ \\text{J}$.","C. $3570\\ \\text{J}$.","D. $7000\\ \\text{J}$."],"answer": "A","explain": "$A_{tp} = A_{ci}/H = 3500/0,7 = 5000\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một động cơ nhiệt có hiệu suất $25\\%$, mỗi giây đốt nhiên liệu tỏa ra $40000\\ \\text{J}$. Công suất có ích của động cơ bằng","options": ["A. $10000\\ \\text{W}$.","B. $160000\\ \\text{W}$.","C. $30000\\ \\text{W}$.","D. $40000\\ \\text{W}$."],"answer": "A","explain": "$P_{ci} = 0,25 \\cdot 40000 = 10000\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một palăng có hiệu suất $80\\%$. Muốn nâng vật $100\\ \\text{kg}$ lên cao $5\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$) thì công của lực kéo (công toàn phần) bằng","options": ["A. $6250\\ \\text{J}$.","B. $5000\\ \\text{J}$.","C. $4000\\ \\text{J}$.","D. $8000\\ \\text{J}$."],"answer": "A","explain": "$A_{ci} = 100 \\cdot 10 \\cdot 5 = 5000\\ \\text{J}$. $A_{tp} = 5000/0,8 = 6250\\ \\text{J}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Hiệu suất cho biết tỉ lệ năng lượng có ích.","b) Giảm ma sát giúp tăng hiệu suất.","c) Hiệu suất của động cơ nhiệt thường thấp hơn hiệu suất của động cơ điện.","d) Công hao phí càng lớn thì hiệu suất càng cao."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng: động cơ nhiệt $H$ khoảng $20$–$40\\%$, động cơ điện có thể trên $90\\%$. d) Sai: hao phí lớn thì $H$ thấp.","points": 1},{"type": "truefalse","level": "VD","q": "Dùng ròng rọc động có hiệu suất $90\\%$ để nâng vật $80\\ \\text{kg}$ lên cao $6\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công có ích bằng $4800\\ \\text{J}$.","b) Công toàn phần xấp xỉ $5333\\ \\text{J}$.","c) Công hao phí xấp xỉ $533\\ \\text{J}$.","d) Nếu hiệu suất là $100\\%$ thì công toàn phần bằng $4800\\ \\text{J}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $80 \\cdot 10 \\cdot 6 = 4800\\ \\text{J}$. b) Đúng: $4800/0,9 \\approx 5333\\ \\text{J}$. c) Đúng: $5333 - 4800 = 533\\ \\text{J}$. d) Đúng: $A_{tp} = A_{ci}$.","points": 1},{"type": "short","level": "VD","q": "Một máy có công suất hao phí $200\\ \\text{W}$, hiệu suất $80\\%$. Công suất toàn phần của máy bằng bao nhiêu oát? (chỉ điền số)","answer": "1000","explain": "$P_{hp} = (1 - H)P_{tp}$ nên $P_{tp} = 200/0,2 = 1000\\ \\text{W}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một ô tô khối lượng $1200\\ \\text{kg}$ lên dốc cao $50\\ \\text{m}$, dài $500\\ \\text{m}$ với tốc độ không đổi; công của lực ma sát là $120000\\ \\text{J}$ (lấy $g = 10\\ \\text{m/s}^2$). Hiệu suất của quá trình lên dốc bằng bao nhiêu phần trăm? (chỉ điền số)","answer": "83.3","explain": "$A_{ci} = 1200 \\cdot 10 \\cdot 50 = 600000\\ \\text{J}$. $A_{tp} = 600000 + 120000 = 720000\\ \\text{J}$. $H = 600000/720000 \\approx 83,3\\%$.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "NB","q": "Đại lượng nào sau đây KHÔNG có đơn vị?","options": ["A. Hiệu suất.","B. Công suất.","C. Công cơ học.","D. Năng lượng."],"answer": "A","explain": "Hiệu suất là tỉ số (thường tính theo phần trăm), không có đơn vị.","points": 0.25},{"type": "mcq","level": "NB","q": "Một máy có hiệu suất $90\\%$ tốt hơn máy có hiệu suất $70\\%$ vì","options": ["A. ít năng lượng bị hao phí hơn (với cùng công có ích).","B. công suất lớn hơn.","C. hoạt động nhanh hơn.","D. bền hơn."],"answer": "A","explain": "$H$ cao hơn nghĩa là tỉ lệ hao phí thấp hơn.","points": 0.25},{"type": "mcq","level": "NB","q": "Năng lượng hao phí của động cơ điện chủ yếu chuyển thành","options": ["A. nhiệt năng.","B. động năng.","C. thế năng.","D. quang năng."],"answer": "A","explain": "Ma sát và điện trở làm nóng động cơ, tỏa nhiệt ra môi trường.","points": 0.25},{"type": "mcq","level": "TH","q": "Một máy phát điện có hiệu suất $95\\%$, công suất toàn phần $10000\\ \\text{W}$. Công suất điện phát ra (có ích) bằng","options": ["A. $9500\\ \\text{W}$.","B. $10526\\ \\text{W}$.","C. $500\\ \\text{W}$.","D. $10000\\ \\text{W}$."],"answer": "A","explain": "$P_{ci} = 0,95 \\cdot 10000 = 9500\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Để nâng một vật $200\\ \\text{kg}$ lên cao $10\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$) bằng một máy có hiệu suất $80\\%$, năng lượng cần cung cấp cho máy bằng","options": ["A. $25000\\ \\text{J}$.","B. $20000\\ \\text{J}$.","C. $16000\\ \\text{J}$.","D. $2000\\ \\text{J}$."],"answer": "A","explain": "$A_{ci} = 20000\\ \\text{J}$. $A_{tp} = 20000/0,8 = 25000\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một bếp điện có hiệu suất $85\\%$, công suất $1000\\ \\text{W}$. Công suất có ích đun nóng nước bằng","options": ["A. $850\\ \\text{W}$.","B. $1176\\ \\text{W}$.","C. $150\\ \\text{W}$.","D. $85\\ \\text{W}$."],"answer": "A","explain": "$P_{ci} = 0,85 \\cdot 1000 = 850\\ \\text{W}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Hiệu suất là đại lượng không có đơn vị.","b) $H = 100\\%$ nghĩa là không có hao phí.","c) Máy có $H$ càng cao càng tiết kiệm năng lượng.","d) Công toàn phần luôn bằng công có ích."],"answer": ["T","T","T","F"],"explain": "a) Đúng: là tỉ số. b) Đúng (trên lí thuyết). c) Đúng: ít hao phí hơn với cùng công có ích. d) Sai: $A_{tp} = A_{ci} + A_{hp} \\ge A_{ci}$.","points": 1},{"type": "truefalse","level": "VD","q": "Một thang máy có hiệu suất $75\\%$, công suất toàn phần của động cơ $8000\\ \\text{W}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công suất có ích bằng $6000\\ \\text{W}$.","b) Mỗi giây động cơ tiêu thụ $8000\\ \\text{J}$ điện năng.","c) Mỗi giây có $2000\\ \\text{J}$ chuyển thành nhiệt năng hao phí.","d) Nếu nâng đều với tốc độ $1\\ \\text{m/s}$ thì tổng trọng lượng thang và người là $6000\\ \\text{N}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $0,75 \\cdot 8000 = 6000\\ \\text{W}$. b) Đúng: $8000\\ \\text{W} = 8000\\ \\text{J/s}$. c) Đúng: $8000 - 6000 = 2000\\ \\text{J/s}$. d) Đúng: $F = P_{ci}/v = 6000\\ \\text{N}$.","points": 1},{"type": "short","level": "VDC","q": "Một động cơ có công suất có ích $3000\\ \\text{W}$, hiệu suất $75\\%$. Công suất hao phí bằng bao nhiêu oát? (chỉ điền số)","answer": "1000","explain": "$P_{tp} = 3000/0,75 = 4000\\ \\text{W}$. $P_{hp} = 4000 - 3000 = 1000\\ \\text{W}$.","points": 0.5},{"type": "short","level": "VDC","q": "Người ta kéo một vật khối lượng $50\\ \\text{kg}$ lên cao $3\\ \\text{m}$ bằng mặt phẳng nghiêng dài $6\\ \\text{m}$ với lực kéo $350\\ \\text{N}$ (lấy $g = 10\\ \\text{m/s}^2$). Độ lớn công của lực ma sát bằng bao nhiêu jun? (chỉ điền số)","answer": "600","explain": "$A_{tp} = 350 \\cdot 6 = 2100\\ \\text{J}$; $A_{ci} = 50 \\cdot 10 \\cdot 3 = 1500\\ \\text{J}$. $A_{ms} = -(2100 - 1500) = -600\\ \\text{J}$, độ lớn $600\\ \\text{J}$.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Hiệu suất của máy được tính bằng tỉ số","options": ["A. công có ích trên công toàn phần.","B. công hao phí trên công có ích.","C. công toàn phần trên công hao phí.","D. năng lượng đầu vào trên công có ích."],"answer": "A","explain": "Định nghĩa hiệu suất.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi nói hiệu suất của một tấm pin mặt trời là $20\\%$, ta hiểu rằng","options": ["A. $20\\%$ năng lượng ánh sáng được chuyển thành điện năng.","B. $20\\%$ năng lượng bị mất đi dưới dạng nhiệt.","C. pin hoạt động $20\\%$ thời gian.","D. pin có công suất $20\\ \\text{W}$."],"answer": "A","explain": "$H$ là tỉ lệ năng lượng có ích thu được.","points": 0.25},{"type": "mcq","level": "NB","q": "Công toàn phần mà máy thực hiện gồm","options": ["A. công có ích và công hao phí.","B. chỉ công có ích.","C. chỉ công hao phí.","D. công của trọng lực và công của ma sát."],"answer": "A","explain": "$A_{tp} = A_{ci} + A_{hp}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một máy nén khí tiêu thụ $5000\\ \\text{J}$ điện năng để thực hiện công có ích $4000\\ \\text{J}$. Hiệu suất của máy bằng","options": ["A. $80\\%$.","B. $125\\%$.","C. $20\\%$.","D. $90\\%$."],"answer": "A","explain": "$H = 4000/5000 = 80\\%$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một động cơ có hiệu suất $60\\%$, công suất toàn phần $3000\\ \\text{W}$. Trong $10\\ \\text{s}$, công có ích của động cơ bằng","options": ["A. $18000\\ \\text{J}$.","B. $30000\\ \\text{J}$.","C. $1800\\ \\text{J}$.","D. $12000\\ \\text{J}$."],"answer": "A","explain": "$P_{ci} = 0,6 \\cdot 3000 = 1800\\ \\text{W}$. $A_{ci} = 1800 \\cdot 10 = 18000\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một ấm điện đun nước với hiệu suất $90\\%$, công suất $1100\\ \\text{W}$. Nhiệt lượng nước nhận được mỗi giây bằng","options": ["A. $990\\ \\text{J}$.","B. $1100\\ \\text{J}$.","C. $1222\\ \\text{J}$.","D. $110\\ \\text{J}$."],"answer": "A","explain": "$Q = 0,9 \\cdot 1100 = 990\\ \\text{J/s}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Hiệu suất càng gần $100\\%$ thì máy càng tốt.","b) Công hao phí là phần công thắng lực ma sát.","c) Dùng ổ bi thay ổ trượt giúp tăng hiệu suất.","d) Hiệu suất của máy không bao giờ đổi."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng: ma sát lăn nhỏ hơn ma sát trượt. d) Sai: $H$ phụ thuộc tình trạng máy (mòn, bôi trơn...).","points": 1},{"type": "truefalse","level": "VD","q": "Một máy đào đất có công suất toàn phần $50000\\ \\text{W}$, hiệu suất $80\\%$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công suất có ích bằng $40000\\ \\text{W}$.","b) Mỗi giờ máy thực hiện công có ích $144\\ \\text{MJ}$.","c) Công suất hao phí bằng $10000\\ \\text{W}$.","d) Nếu hiệu suất tăng lên $90\\%$ thì công suất hao phí giảm còn $5000\\ \\text{W}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $0,8 \\cdot 50000 = 40000\\ \\text{W}$. b) Đúng: $40000 \\cdot 3600 = 144000000\\ \\text{J} = 144\\ \\text{MJ}$. c) Đúng: $50000 - 40000 = 10000\\ \\text{W}$. d) Đúng: $0,1 \\cdot 50000 = 5000\\ \\text{W}$.","points": 1},{"type": "short","level": "VDC","q": "Một động cơ điện có hiệu suất $92\\%$. Để có công suất có ích $4600\\ \\text{W}$ thì công suất tiêu thụ (toàn phần) bằng bao nhiêu oát? (chỉ điền số)","answer": "5000","explain": "$P_{tp} = 4600/0,92 = 5000\\ \\text{W}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một xe ô tô tiêu thụ $5$ lít xăng ($1$ lít xăng tỏa ra $35\\ \\text{MJ}$ khi cháy) đi được $40\\ \\text{km}$; lực cản trung bình $875\\ \\text{N}$. Hiệu suất của động cơ ô tô bằng bao nhiêu phần trăm? (chỉ điền số)","answer": "20","explain": "Năng lượng xăng: $5 \\cdot 35 = 175\\ \\text{MJ}$. Công có ích: $A = 875 \\cdot 40000 = 35\\ \\text{MJ}$. $H = 35/175 = 20\\%$.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Phát biểu nào sau đây đúng về hiệu suất?","options": ["A. Hiệu suất cho biết hiệu quả sử dụng năng lượng của máy.","B. Hiệu suất cho biết máy hoạt động nhanh hay chậm.","C. Hiệu suất có đơn vị là oát.","D. Hiệu suất càng lớn thì công suất càng lớn."],"answer": "A","explain": "Hiệu suất đo hiệu quả, công suất đo tốc độ sinh công.","points": 0.25},{"type": "mcq","level": "NB","q": "Một máy lí tưởng (không có ma sát) có hiệu suất bằng","options": ["A. $100\\%$.","B. $0\\%$.","C. $50\\%$.","D. không xác định."],"answer": "A","explain": "Không hao phí nên $A_{ci} = A_{tp}$, $H = 100\\%$ (chỉ có trên lí thuyết).","points": 0.25},{"type": "mcq","level": "NB","q": "Để giảm năng lượng hao phí của máy, người ta thường","options": ["A. bôi trơn, dùng ổ bi, chế tạo chính xác.","B. tăng tốc độ hoạt động tối đa.","C. tăng tải trọng của máy.","D. giảm công có ích."],"answer": "A","explain": "Các biện pháp giảm ma sát.","points": 0.25},{"type": "mcq","level": "TH","q": "Một cần cẩu có hiệu suất $75\\%$. Khi nâng vật $600\\ \\text{kg}$ lên cao $10\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$), công toàn phần mà cần cẩu thực hiện bằng","options": ["A. $80000\\ \\text{J}$.","B. $60000\\ \\text{J}$.","C. $45000\\ \\text{J}$.","D. $7500\\ \\text{J}$."],"answer": "A","explain": "$A_{ci} = 60000\\ \\text{J}$. $A_{tp} = 60000/0,75 = 80000\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một máy bơm có công suất toàn phần $2200\\ \\text{W}$, hiệu suất $75\\%$. Công suất có ích bằng","options": ["A. $1650\\ \\text{W}$.","B. $2933\\ \\text{W}$.","C. $550\\ \\text{W}$.","D. $2200\\ \\text{W}$."],"answer": "A","explain": "$0,75 \\cdot 2200 = 1650\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một động cơ thực hiện công có ích $9000\\ \\text{J}$ trong $15\\ \\text{s}$ với hiệu suất $60\\%$. Công suất toàn phần của động cơ bằng","options": ["A. $1000\\ \\text{W}$.","B. $600\\ \\text{W}$.","C. $360\\ \\text{W}$.","D. $15000\\ \\text{W}$."],"answer": "A","explain": "$P_{ci} = 9000/15 = 600\\ \\text{W}$. $P_{tp} = 600/0,6 = 1000\\ \\text{W}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) $H = \\frac{A_{ci}}{A_{tp}} \\cdot 100\\%$.","b) $A_{tp} = A_{ci} + A_{hp}$.","c) Hiệu suất của ròng rọc thường trên $90\\%$.","d) Muốn $H = 100\\%$ chỉ cần tăng công có ích."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng: ròng rọc ít ma sát. d) Sai: $H = 100\\%$ đòi hỏi $A_{hp} = 0$, không thể đạt do luôn có ma sát.","points": 1},{"type": "truefalse","level": "VD","q": "Một nhà máy điện có công suất phát $100\\ \\text{MW}$, hiệu suất truyền tải $95\\%$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công suất đến nơi tiêu thụ bằng $95\\ \\text{MW}$.","b) Công suất hao phí trên đường dây bằng $5\\ \\text{MW}$.","c) Trong $1$ giờ, năng lượng hao phí là $18\\ \\text{GJ}$.","d) Tăng hiệu suất truyền tải giúp giảm hao phí."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $0,95 \\cdot 100 = 95\\ \\text{MW}$. b) Đúng: $100 - 95 = 5\\ \\text{MW}$. c) Đúng: $5 \\cdot 10^6 \\cdot 3600 = 18 \\cdot 10^9\\ \\text{J} = 18\\ \\text{GJ}$. d) Đúng.","points": 1},{"type": "short","level": "VDC","q": "Một máy có hiệu suất $80\\%$, mỗi giây hao phí $50\\ \\text{J}$. Công có ích mỗi giây của máy bằng bao nhiêu jun? (chỉ điền số)","answer": "200","explain": "$A_{hp} = 0,2A_{tp} = 50$ nên $A_{tp} = 250\\ \\text{J/s}$; $A_{ci} = 200\\ \\text{J/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Dùng đòn bẩy để nâng vật $120\\ \\text{kg}$ lên cao $0,5\\ \\text{m}$; lực tác dụng $400\\ \\text{N}$, điểm đặt lực đi xuống $2\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$). Hiệu suất của đòn bẩy bằng bao nhiêu phần trăm? (chỉ điền số)","answer": "75","explain": "$A_{ci} = 120 \\cdot 10 \\cdot 0,5 = 600\\ \\text{J}$; $A_{tp} = 400 \\cdot 2 = 800\\ \\text{J}$. $H = 75\\%$.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Hiệu suất của động cơ nhiệt thường vào khoảng","options": ["A. $20\\%$ – $40\\%$.","B. $90\\%$ – $100\\%$.","C. $60\\%$ – $80\\%$.","D. $0\\%$ – $10\\%$."],"answer": "A","explain": "Động cơ nhiệt thải nhiều nhiệt ra môi trường nên $H$ thấp.","points": 0.25},{"type": "mcq","level": "NB","q": "Hiệu suất của động cơ điện có thể đạt","options": ["A. trên $90\\%$.","B. dưới $20\\%$.","C. $50\\%$.","D. $0\\%$."],"answer": "A","explain": "Động cơ điện ít hao phí nên $H$ cao, có thể trên $90\\%$.","points": 0.25},{"type": "mcq","level": "NB","q": "Công có ích của cần cẩu khi nâng vật lên cao là","options": ["A. công nâng vật: $A_{ci} = mgh$.","B. công thắng ma sát.","C. công làm nóng động cơ.","D. công của lực cản không khí."],"answer": "A","explain": "Mục đích của cần cẩu là nâng vật lên cao.","points": 0.25},{"type": "mcq","level": "TH","q": "Một máy có công suất toàn phần $4000\\ \\text{W}$, hiệu suất $85\\%$. Công suất hao phí bằng","options": ["A. $600\\ \\text{W}$.","B. $3400\\ \\text{W}$.","C. $4706\\ \\text{W}$.","D. $850\\ \\text{W}$."],"answer": "A","explain": "$P_{hp} = (1 - 0,85) \\cdot 4000 = 600\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một tấm pin mặt trời nhận công suất bức xạ $800\\ \\text{W}$, hiệu suất $18\\%$. Công suất điện tạo ra bằng","options": ["A. $144\\ \\text{W}$.","B. $4444\\ \\text{W}$.","C. $656\\ \\text{W}$.","D. $818\\ \\text{W}$."],"answer": "A","explain": "$0,18 \\cdot 800 = 144\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người dùng ròng rọc cố định kéo vật $40\\ \\text{kg}$ lên cao $3\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$), lực kéo $500\\ \\text{N}$. Hiệu suất của ròng rọc bằng","options": ["A. $80\\%$.","B. $125\\%$.","C. $60\\%$.","D. $150\\%$."],"answer": "A","explain": "$A_{ci} = 40 \\cdot 10 \\cdot 3 = 1200\\ \\text{J}$; $A_{tp} = 500 \\cdot 3 = 1500\\ \\text{J}$. $H = 80\\%$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Hiệu suất cho biết phần trăm năng lượng đầu vào được dùng có ích.","b) Không thể chế tạo máy có hiệu suất $100\\%$.","c) Bôi trơn giúp giảm hao phí, tăng hiệu suất.","d) Hai máy có cùng hiệu suất thì công suất bằng nhau."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng: luôn có ma sát. c) Đúng. d) Sai: $H$ và $P$ là hai đại lượng độc lập.","points": 1},{"type": "truefalse","level": "VD","q": "Một xe máy có hiệu suất động cơ $25\\%$, công suất toàn phần $6000\\ \\text{W}$, chuyển động đều với tốc độ $15\\ \\text{m/s}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công suất có ích bằng $1500\\ \\text{W}$.","b) Lực kéo của động cơ bằng $100\\ \\text{N}$.","c) Lực cản của mặt đường bằng $100\\ \\text{N}$.","d) Mỗi giây động cơ tỏa ra môi trường $6000\\ \\text{J}$ nhiệt."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $0,25 \\cdot 6000 = 1500\\ \\text{W}$. b) Đúng: $F = 1500/15 = 100\\ \\text{N}$. c) Đúng: chuyển động đều nên $F_c = F_{kéo}$. d) Sai: hao phí mỗi giây là $6000 - 1500 = 4500\\ \\text{J}$.","points": 1},{"type": "short","level": "VDC","q": "Một động cơ có công suất hao phí $300\\ \\text{W}$, hiệu suất $70\\%$. Công suất có ích bằng bao nhiêu oát? (chỉ điền số)","answer": "700","explain": "$P_{hp} = 0,3P_{tp} = 300$ nên $P_{tp} = 1000\\ \\text{W}$; $P_{ci} = 700\\ \\text{W}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một máy bơm đưa $1000\\ \\text{kg}$ nước lên cao $8\\ \\text{m}$ trong $100\\ \\text{s}$ với hiệu suất $80\\%$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất tiêu thụ của máy bơm bằng bao nhiêu oát? (chỉ điền số)","answer": "1000","explain": "$A_{ci} = 1000 \\cdot 10 \\cdot 8 = 80000\\ \\text{J}$; $P_{ci} = 800\\ \\text{W}$. $P_{tp} = 800/0,8 = 1000\\ \\text{W}$.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "NB","q": "Khi hiệu suất của máy tăng từ $70\\%$ lên $85\\%$ (cùng công có ích) thì","options": ["A. năng lượng hao phí giảm.","B. năng lượng hao phí tăng.","C. công suất tăng.","D. công có ích giảm."],"answer": "A","explain": "$H$ tăng nghĩa là tỉ lệ hao phí giảm.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong công thức $H = \\frac{A_{ci}}{A_{tp}} \\cdot 100\\%$, $A_{tp}$ là","options": ["A. tổng công (năng lượng) mà máy tiêu thụ.","B. công có ích.","C. công hao phí.","D. công của ma sát."],"answer": "A","explain": "$A_{tp}$ là toàn bộ năng lượng đầu vào.","points": 0.25},{"type": "mcq","level": "TH","q": "Một động cơ diesel có hiệu suất $35\\%$. Muốn có công có ích $70000\\ \\text{J}$ cần đốt nhiên liệu tỏa ra","options": ["A. $200000\\ \\text{J}$.","B. $24500\\ \\text{J}$.","C. $105000\\ \\text{J}$.","D. $35000\\ \\text{J}$."],"answer": "A","explain": "$Q = 70000/0,35 = 200000\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một động cơ có công suất toàn phần $5000\\ \\text{W}$, hiệu suất $80\\%$. Công suất có ích bằng","options": ["A. $4000\\ \\text{W}$.","B. $6250\\ \\text{W}$.","C. $1000\\ \\text{W}$.","D. $5080\\ \\text{W}$."],"answer": "A","explain": "$P_{ci} = 0,8 \\cdot 5000 = 4000\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người kéo vật $30\\ \\text{kg}$ lên cao $2\\ \\text{m}$ bằng mặt phẳng nghiêng dài $5\\ \\text{m}$, lực kéo $150\\ \\text{N}$ (lấy $g = 10\\ \\text{m/s}^2$). Hiệu suất của mặt phẳng nghiêng bằng","options": ["A. $80\\%$.","B. $125\\%$.","C. $75\\%$.","D. $60\\%$."],"answer": "A","explain": "$A_{ci} = 600\\ \\text{J}$; $A_{tp} = 750\\ \\text{J}$. $H = 80\\%$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một bóng đèn sợi đốt có hiệu suất phát sáng $5\\%$, công suất $60\\ \\text{W}$. Công suất tỏa nhiệt của đèn bằng","options": ["A. $57\\ \\text{W}$.","B. $3\\ \\text{W}$.","C. $1200\\ \\text{W}$.","D. $65\\ \\text{W}$."],"answer": "A","explain": "$P_{nhiệt} = 0,95 \\cdot 60 = 57\\ \\text{W}$ (phần lớn điện năng thành nhiệt).","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Máy có hiệu suất cao giúp tiết kiệm năng lượng.","b) Hiệu suất của máy cơ học luôn nhỏ hơn $100\\%$.","c) Công hao phí chủ yếu do ma sát gây ra.","d) Tăng công toàn phần luôn làm tăng hiệu suất."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $H$ phụ thuộc TỈ SỐ $A_{ci}/A_{tp}$.","points": 1},{"type": "truefalse","level": "VDC","q": "Một cần trục tháp nâng $500\\ \\text{kg}$ thép lên cao $20\\ \\text{m}$ trong $40\\ \\text{s}$, hiệu suất $80\\%$ (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công có ích bằng $100000\\ \\text{J}$.","b) Công suất có ích bằng $2500\\ \\text{W}$.","c) Công suất toàn phần bằng $3125\\ \\text{W}$.","d) Năng lượng hao phí trong quá trình nâng là $20000\\ \\text{J}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $500 \\cdot 10 \\cdot 20 = 100000\\ \\text{J}$. b) Đúng: $100000/40 = 2500\\ \\text{W}$. c) Đúng: $2500/0,8 = 3125\\ \\text{W}$. d) Sai: $A_{hp} = 125000 - 100000 = 25000\\ \\text{J}$.","points": 1},{"type": "short","level": "VDC","q": "Một máy phát điện gió có hiệu suất $40\\%$, công suất gió thổi vào cánh quạt $25000\\ \\text{W}$. Công suất điện phát ra bằng bao nhiêu kilôoát? (chỉ điền số)","answer": "10","explain": "$0,4 \\cdot 25000 = 10000\\ \\text{W} = 10\\ \\text{kW}$.","points": 0.5},{"type": "short","level": "VDC","q": "Để kéo một kiện hàng $80\\ \\text{kg}$ lên sàn xe cao $1,2\\ \\text{m}$ bằng tấm ván dài $3\\ \\text{m}$, người ta dùng lực $400\\ \\text{N}$ (lấy $g = 10\\ \\text{m/s}^2$). Lực ma sát giữa kiện hàng và tấm ván bằng bao nhiêu niutơn? (chỉ điền số)","answer": "80","explain": "$A_{tp} = 400 \\cdot 3 = 1200\\ \\text{J}$; $A_{ci} = 80 \\cdot 10 \\cdot 1,2 = 960\\ \\text{J}$. $A_{ms} = 240\\ \\text{J} = F_{ms} \\cdot 3$, suy ra $F_{ms} = 80\\ \\text{N}$.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Hiệu suất của máy cho biết","options": ["A. mức độ sử dụng hiệu quả năng lượng của máy.","B. tốc độ thực hiện công của máy.","C. độ bền của máy.","D. khối lượng của máy."],"answer": "A","explain": "Định nghĩa hiệu suất.","points": 0.25},{"type": "mcq","level": "NB","q": "Một máy có hiệu suất $60\\%$ nghĩa là","options": ["A. $60\\%$ năng lượng đầu vào thành công có ích, $40\\%$ hao phí.","B. $60\\%$ năng lượng bị hao phí.","C. máy sinh công $60\\ \\text{J}$ mỗi giây.","D. máy hoạt động được $60\\%$ thời gian."],"answer": "A","explain": "Ý nghĩa của hiệu suất.","points": 0.25},{"type": "mcq","level": "TH","q": "Một động cơ có công suất toàn phần $8000\\ \\text{W}$, hiệu suất $75\\%$. Công suất có ích bằng","options": ["A. $6000\\ \\text{W}$.","B. $10667\\ \\text{W}$.","C. $2000\\ \\text{W}$.","D. $8075\\ \\text{W}$."],"answer": "A","explain": "$0,75 \\cdot 8000 = 6000\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một hệ thống ròng rọc nâng vật $150\\ \\text{kg}$ lên cao $4\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$) với hiệu suất $75\\%$. Công của lực kéo bằng","options": ["A. $8000\\ \\text{J}$.","B. $6000\\ \\text{J}$.","C. $4500\\ \\text{J}$.","D. $1500\\ \\text{J}$."],"answer": "A","explain": "$A_{ci} = 6000\\ \\text{J}$. $A_{tp} = 6000/0,75 = 8000\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một ấm đun nước hiệu suất $80\\%$, công suất $1000\\ \\text{W}$. Để đun sôi cần $336000\\ \\text{J}$ nhiệt lượng. Thời gian đun bằng","options": ["A. $420\\ \\text{s}$.","B. $336\\ \\text{s}$.","C. $268,8\\ \\text{s}$.","D. $3360\\ \\text{s}$."],"answer": "A","explain": "$P_{ci} = 800\\ \\text{W}$. $t = 336000/800 = 420\\ \\text{s}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một ô tô có hiệu suất $28\\%$. Khi đốt $1$ lít xăng tỏa $35\\ \\text{MJ}$, công có ích thu được bằng","options": ["A. $9,8\\ \\text{MJ}$.","B. $125\\ \\text{MJ}$.","C. $25,2\\ \\text{MJ}$.","D. $35\\ \\text{MJ}$."],"answer": "A","explain": "$0,28 \\cdot 35 = 9,8\\ \\text{MJ}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Hiệu suất là tỉ số giữa công có ích và công toàn phần.","b) Hiệu suất không bao giờ vượt quá $100\\%$.","c) Giảm ma sát giúp tăng hiệu suất của máy cơ.","d) Công suất và hiệu suất là một."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: công suất đo tốc độ sinh công, hiệu suất đo hiệu quả sử dụng năng lượng.","points": 1},{"type": "truefalse","level": "VDC","q": "Một máy cẩu có hiệu suất $80\\%$, nâng $1000\\ \\text{kg}$ hàng lên cao $12\\ \\text{m}$ trong $60\\ \\text{s}$ (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công có ích bằng $120000\\ \\text{J}$.","b) Công suất có ích bằng $2000\\ \\text{W}$.","c) Công suất toàn phần bằng $2500\\ \\text{W}$.","d) Năng lượng hao phí là $24000\\ \\text{J}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $1000 \\cdot 10 \\cdot 12 = 120000\\ \\text{J}$. b) Đúng: $120000/60 = 2000\\ \\text{W}$. c) Đúng: $2000/0,8 = 2500\\ \\text{W}$. d) Sai: $A_{hp} = 150000 - 120000 = 30000\\ \\text{J}$.","points": 1},{"type": "short","level": "VDC","q": "Một động cơ tiêu thụ công suất $2500\\ \\text{W}$, hiệu suất $80\\%$. Công có ích mà động cơ thực hiện trong $2$ phút bằng bao nhiêu kilôjun? (chỉ điền số)","answer": "240","explain": "$P_{ci} = 2000\\ \\text{W}$. $A_{ci} = 2000 \\cdot 120 = 240000\\ \\text{J} = 240\\ \\text{kJ}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một mặt phẳng nghiêng dài $4\\ \\text{m}$, cao $1,5\\ \\text{m}$, hiệu suất $75\\%$. Để kéo vật $40\\ \\text{kg}$ lên (lấy $g = 10\\ \\text{m/s}^2$) cần lực kéo dọc theo mặt nghiêng bằng bao nhiêu niutơn? (chỉ điền số)","answer": "200","explain": "$A_{ci} = 40 \\cdot 10 \\cdot 1,5 = 600\\ \\text{J}$. $A_{tp} = 600/0,75 = 800\\ \\text{J}$. $F = 800/4 = 200\\ \\text{N}$.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Công thức tính hiệu suất theo công suất là","options": ["A. $H = \\frac{P_{ci}}{P_{tp}} \\cdot 100\\%$.","B. $H = \\frac{P_{tp}}{P_{ci}} \\cdot 100\\%$.","C. $H = P_{ci} \\cdot P_{tp}$.","D. $H = \\frac{A}{t} \\cdot 100\\%$."],"answer": "A","explain": "Tỉ số công suất có ích trên công suất toàn phần.","points": 0.25},{"type": "mcq","level": "NB","q": "Năng lượng hao phí trong máy cơ học thường chuyển thành","options": ["A. nhiệt năng tỏa ra môi trường.","B. động năng của máy.","C. thế năng của máy.","D. điện năng."],"answer": "A","explain": "Ma sát làm nóng các bộ phận.","points": 0.25},{"type": "mcq","level": "TH","q": "Một nhà máy thủy điện có hiệu suất $90\\%$, công suất nước chảy $200\\ \\text{MW}$. Công suất điện phát ra bằng","options": ["A. $180\\ \\text{MW}$.","B. $222\\ \\text{MW}$.","C. $20\\ \\text{MW}$.","D. $200\\ \\text{MW}$."],"answer": "A","explain": "$0,9 \\cdot 200 = 180\\ \\text{MW}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một động cơ điện kéo vật $250\\ \\text{kg}$ lên cao $6\\ \\text{m}$ trong $25\\ \\text{s}$ với hiệu suất $75\\%$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất tiêu thụ của động cơ bằng","options": ["A. $800\\ \\text{W}$.","B. $600\\ \\text{W}$.","C. $15000\\ \\text{W}$.","D. $450\\ \\text{W}$."],"answer": "A","explain": "$A_{ci} = 15000\\ \\text{J}$; $P_{ci} = 600\\ \\text{W}$. $P_{tp} = 600/0,75 = 800\\ \\text{W}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một bóng đèn LED công suất $10\\ \\text{W}$, hiệu suất phát sáng $40\\%$. Công suất ánh sáng phát ra bằng","options": ["A. $4\\ \\text{W}$.","B. $25\\ \\text{W}$.","C. $6\\ \\text{W}$.","D. $14\\ \\text{W}$."],"answer": "A","explain": "$0,4 \\cdot 10 = 4\\ \\text{W}$ (phần còn lại thành nhiệt).","points": 0.25},{"type": "mcq","level": "VD","q": "Muốn có công có ích $5000\\ \\text{J}$ từ một máy có hiệu suất $65\\%$, cần cung cấp năng lượng bằng","options": ["A. $7692\\ \\text{J}$ (làm tròn).","B. $3250\\ \\text{J}$.","C. $5065\\ \\text{J}$.","D. $5000\\ \\text{J}$."],"answer": "A","explain": "$A_{tp} = 5000/0,65 \\approx 7692\\ \\text{J}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) $A_{tp} = A_{ci} + A_{hp}$.","b) Hiệu suất càng cao thì với cùng công có ích, năng lượng tiêu thụ càng ít.","c) Mọi máy đều có hiệu suất nhỏ hơn $100\\%$.","d) Hiệu suất có đơn vị là jun."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng: $A_{tp} = A_{ci}/H$. c) Đúng. d) Sai: hiệu suất không có đơn vị.","points": 1},{"type": "truefalse","level": "VDC","q": "Một ô tô chạy với tốc độ không đổi $20\\ \\text{m/s}$, lực cản $1000\\ \\text{N}$, hiệu suất động cơ $25\\%$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công suất có ích bằng $20000\\ \\text{W}$.","b) Công suất toàn phần bằng $80000\\ \\text{W}$.","c) Mỗi giây động cơ tỏa ra môi trường $60000\\ \\text{J}$ nhiệt.","d) Nếu hiệu suất tăng lên $32\\%$ thì công suất hao phí giảm."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $P_{ci} = 1000 \\cdot 20 = 20000\\ \\text{W}$. b) Đúng: $20000/0,25 = 80000\\ \\text{W}$. c) Đúng: $80000 - 20000 = 60000\\ \\text{J/s}$. d) Đúng: $P_{hp} = P_{tp}(1-H)$ giảm khi $H$ tăng (với $P_{ci}$ không đổi).","points": 1},{"type": "short","level": "VDC","q": "Một pin mặt trời có hiệu suất $20\\%$, diện tích $2\\ \\text{m}^2$, cường độ bức xạ mặt trời $1000\\ \\text{W/m}^2$. Công suất điện của pin bằng bao nhiêu oát? (chỉ điền số)","answer": "400","explain": "$P_{vào} = 1000 \\cdot 2 = 2000\\ \\text{W}$. $P_{điện} = 0,2 \\cdot 2000 = 400\\ \\text{W}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một người đạp xe lên dốc với công suất có ích $150\\ \\text{W}$ trong $10$ phút; hiệu suất cơ thể người khoảng $25\\%$. Năng lượng mà cơ thể người tiêu hao bằng bao nhiêu kilôjun? (chỉ điền số)","answer": "360","explain": "$A_{ci} = 150 \\cdot 600 = 90000\\ \\text{J}$. $A_{tp} = 90000/0,25 = 360000\\ \\text{J} = 360\\ \\text{kJ}$.","points": 0.5}]}]}
