{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Trong các công thức sau, công thức nào tính công của lực không đổi?","options": ["A. $A = Fs\\cos\\alpha$.","B. $A = \\frac{Fs}{\\cos\\alpha}$.","C. $A = Fs + \\cos\\alpha$.","D. $A = F + s\\cos\\alpha$."],"answer": "A","explain": "Công của lực không đổi: $A = Fs\\cos\\alpha$.","points": 0.25},{"type": "mcq","level": "NB","q": "Một lực sinh công âm khi","options": ["A. góc giữa lực và hướng dịch chuyển là góc tù.","B. góc giữa lực và hướng dịch chuyển là góc nhọn.","C. lực vuông góc với hướng dịch chuyển.","D. vật đứng yên."],"answer": "A","explain": "Góc tù thì $\\cos\\alpha \\lt 0$ nên $A \\lt 0$.","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị oát (W) là đơn vị của","options": ["A. công suất.","B. công cơ học.","C. năng lượng.","D. lực."],"answer": "A","explain": "Oát là đơn vị công suất.","points": 0.25},{"type": "mcq","level": "NB","q": "Biểu thức tính động năng là","options": ["A. $W_đ = \\frac{1}{2}mv^2$.","B. $W_đ = 2mv^2$.","C. $W_đ = mv$.","D. $W_đ = \\frac{mv}{2}$."],"answer": "A","explain": "Định nghĩa động năng.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lực $F = 25\\ \\text{N}$ không đổi tác dụng lên vật theo hướng hợp với hướng chuyển động góc $37^\\circ$ ($\\cos37^\\circ \\approx 0,8$). Vật đi được $12\\ \\text{m}$. Công của lực bằng","options": ["A. $240\\ \\text{J}$.","B. $300\\ \\text{J}$.","C. $375\\ \\text{J}$.","D. $150\\ \\text{J}$."],"answer": "A","explain": "$A = 25 \\cdot 12 \\cdot 0,8 = 240\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một máy nâng thực hiện công $48000\\ \\text{J}$ trong $1,5$ phút. Công suất của máy bằng","options": ["A. $\\frac{1600}{3}\\ \\text{W} \\approx 533\\ \\text{W}$.","B. $72000\\ \\text{W}$.","C. $32000\\ \\text{W}$.","D. $53333\\ \\text{W}$."],"answer": "A","explain": "$t = 90\\ \\text{s}$, $P = 48000/90 \\approx 533\\ \\text{W}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công suất đặc trưng cho tốc độ thực hiện công.","b) Động năng của vật đang đứng yên bằng 0.","c) Lực vuông góc với hướng dịch chuyển không sinh công.","d) Hiệu suất của máy có thể đạt $120\\%$."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng: $v = 0$. c) Đúng: $\\alpha = 90^\\circ$. d) Sai: $H \\le 100\\%$.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $3\\ \\text{kg}$ chịu lực kéo $F = 18\\ \\text{N}$ cùng chiều chuyển động trên mặt ngang không ma sát, đi từ trạng thái nghỉ được $15\\ \\text{m}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công của lực kéo bằng $270\\ \\text{J}$.","b) Động năng của vật lúc sau bằng $270\\ \\text{J}$.","c) Tốc độ của vật lúc sau xấp xỉ $13,4\\ \\text{m/s}$.","d) Nếu có ma sát thì động năng lúc sau lớn hơn $270\\ \\text{J}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $18 \\cdot 15 = 270\\ \\text{J}$. b) Đúng: định lí động năng. c) Đúng: $v = \\sqrt{2 \\cdot 270/3} = \\sqrt{180} \\approx 13,42\\ \\text{m/s}$. d) Sai: ma sát làm $W_đ$ NHỎ hơn.","points": 1},{"type": "short","level": "VD","q": "Một cần cẩu nâng thùng hàng $300\\ \\text{kg}$ lên cao $9\\ \\text{m}$ trong $18\\ \\text{s}$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất trung bình của cần cẩu bằng bao nhiêu oát? (chỉ điền số)","answer": "1500","explain": "$A = 300 \\cdot 10 \\cdot 9 = 27000\\ \\text{J}$. $P = 27000/18 = 1500\\ \\text{W}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $6\\ \\text{kg}$ trượt đều xuống mặt phẳng nghiêng dài $12\\ \\text{m}$, cao $4\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$). Độ lớn công của lực ma sát bằng bao nhiêu jun? (chỉ điền số)","answer": "240","explain": "Trượt đều nên công ma sát triệt tiêu công trọng lực: $|A_{ms}| = mgh = 6 \\cdot 10 \\cdot 4 = 240\\ \\text{J}$.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "NB","q": "Thế năng trọng trường của vật có khối lượng $m$ ở độ cao $h$ so với mốc là","options": ["A. $W_t = mgh$.","B. $W_t = \\frac{1}{2}mgh$.","C. $W_t = mgh^2$.","D. $W_t = \\frac{mg}{h}$."],"answer": "A","explain": "Định nghĩa thế năng trọng trường.","points": 0.25},{"type": "mcq","level": "NB","q": "Cơ năng của vật được bảo toàn khi","options": ["A. vật chỉ chịu tác dụng của trọng lực, không có ma sát.","B. vật chịu tác dụng của lực ma sát lớn.","C. vật chuyển động đều trên mặt ngang.","D. có ngoại lực sinh công dương."],"answer": "A","explain": "Điều kiện định luật bảo toàn cơ năng.","points": 0.25},{"type": "mcq","level": "NB","q": "Hiệu suất $H$ của máy được tính bằng","options": ["A. $H = \\frac{A_{ci}}{A_{tp}} \\cdot 100\\%$.","B. $H = \\frac{A_{tp}}{A_{ci}} \\cdot 100\\%$.","C. $H = A_{ci} + A_{tp}$.","D. $H = \\frac{P}{A} \\cdot 100\\%$."],"answer": "A","explain": "Định nghĩa hiệu suất.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi vật rơi tự do (bỏ qua sức cản),","options": ["A. thế năng giảm, động năng tăng, cơ năng không đổi.","B. thế năng tăng, động năng giảm.","C. cơ năng tăng dần.","D. động năng không đổi."],"answer": "A","explain": "Chuyển hóa thế năng thành động năng, cơ năng bảo toàn.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $0,6\\ \\text{kg}$ ở độ cao $7\\ \\text{m}$ so với mặt đất (lấy $g = 10\\ \\text{m/s}^2$, mốc tại mặt đất). Thế năng của vật bằng","options": ["A. $42\\ \\text{J}$.","B. $4,2\\ \\text{J}$.","C. $420\\ \\text{J}$.","D. $13\\ \\text{J}$."],"answer": "A","explain": "$W_t = 0,6 \\cdot 10 \\cdot 7 = 42\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một con lắc đơn dài $1,2\\ \\text{m}$ được kéo lệch để vật lên cao $0,45\\ \\text{m}$ so với vị trí cân bằng rồi thả nhẹ (lấy $g = 10\\ \\text{m/s}^2$). Tốc độ khi qua vị trí cân bằng bằng","options": ["A. $3\\ \\text{m/s}$.","B. $\\sqrt{45}\\ \\text{m/s}$.","C. $4,5\\ \\text{m/s}$.","D. $1,5\\ \\text{m/s}$."],"answer": "A","explain": "$v = \\sqrt{2 \\cdot 10 \\cdot 0,45} = \\sqrt{9} = 3\\ \\text{m/s}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) $W = W_đ + W_t$ là biểu thức cơ năng.","b) Khi có ma sát, cơ năng của vật giảm.","c) Động năng tỉ lệ với bình phương tốc độ.","d) Công của trọng lực phụ thuộc đường đi của vật."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: trọng lực là lực thế.","points": 1},{"type": "truefalse","level": "VD","q": "Một máy kéo có hiệu suất $80\\%$, công suất toàn phần $25000\\ \\text{W}$, dùng để kéo vật lên cao (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công suất có ích bằng $20000\\ \\text{W}$.","b) Mỗi giây máy nâng được $200\\ \\text{kg}$ vật lên cao $10\\ \\text{m}$.","c) Công suất hao phí bằng $5000\\ \\text{W}$.","d) Nếu hiệu suất là $100\\%$ thì mỗi giây nâng được $250\\ \\text{kg}$ lên cao $10\\ \\text{m}$."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $0,8 \\cdot 25000 = 20000\\ \\text{W}$. b) Đúng: $m = 20000/(10 \\cdot 10) = 200\\ \\text{kg}$. c) Đúng: $25000 - 20000 = 5000\\ \\text{W}$. d) Đúng: $m = 25000/100 = 250\\ \\text{kg}$.","points": 1},{"type": "short","level": "VD","q": "Một vật được ném thẳng đứng lên với tốc độ $16\\ \\text{m/s}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Độ cao cực đại bằng bao nhiêu mét? (chỉ điền số)","answer": "12.8","explain": "$h_{max} = 16^2/20 = 256/20 = 12,8\\ \\text{m}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một lò xo có độ cứng $k = 90\\ \\text{N/m}$ bị nén $12\\ \\text{cm}$ rồi thả để đẩy vật $0,18\\ \\text{kg}$ trên mặt ngang không ma sát. Tốc độ của vật khi rời lò xo bằng bao nhiêu m/s? (chỉ điền số, làm tròn đến 1 chữ số thập phân)","answer": "2.7","explain": "$\\frac{1}{2} \\cdot 90 \\cdot 0,0144 = \\frac{1}{2} \\cdot 0,18 \\cdot v^2$, suy ra $v^2 = 7,2$, $v \\approx 2,68\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Phát biểu nào sau đây đúng?","options": ["A. Công là đại lượng vô hướng có thể dương, âm hoặc bằng 0.","B. Công là đại lượng vectơ.","C. Công luôn dương.","D. Công có đơn vị là oát."],"answer": "A","explain": "Tính chất của công cơ học.","points": 0.25},{"type": "mcq","level": "NB","q": "Công suất $P = Fv$ áp dụng khi","options": ["A. lực cùng hướng với vận tốc.","B. lực vuông góc với vận tốc.","C. vật đứng yên.","D. lực ngược hướng vận tốc."],"answer": "A","explain": "Điều kiện của công thức $P = Fv$.","points": 0.25},{"type": "mcq","level": "NB","q": "Thế năng đàn hồi của lò xo tỉ lệ với","options": ["A. bình phương độ biến dạng.","B. độ biến dạng.","C. khối lượng lò xo.","D. tốc độ biến dạng."],"answer": "A","explain": "$W_{tđh} = \\frac{1}{2}k(\\Delta l)^2$.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi con lắc đơn đi từ vị trí biên về vị trí cân bằng (bỏ qua sức cản),","options": ["A. động năng tăng, thế năng giảm.","B. động năng giảm, thế năng tăng.","C. cơ năng tăng.","D. động năng không đổi."],"answer": "A","explain": "Chuyển hóa thế năng thành động năng.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $1,5\\ \\text{kg}$ chuyển động với tốc độ $8\\ \\text{m/s}$. Động năng của vật bằng","options": ["A. $48\\ \\text{J}$.","B. $96\\ \\text{J}$.","C. $12\\ \\text{J}$.","D. $6\\ \\text{J}$."],"answer": "A","explain": "$W_đ = \\frac{1}{2} \\cdot 1,5 \\cdot 64 = 48\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một động cơ điện có công suất $1200\\ \\text{W}$, hiệu suất $85\\%$. Công suất hao phí bằng","options": ["A. $180\\ \\text{W}$.","B. $1020\\ \\text{W}$.","C. $1412\\ \\text{W}$.","D. $85\\ \\text{W}$."],"answer": "A","explain": "$P_{hp} = 0,15 \\cdot 1200 = 180\\ \\text{W}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) $1\\ \\text{J} = 1\\ \\text{N} \\cdot 1\\ \\text{m}$.","b) $1\\ \\text{W} = 1\\ \\text{J/s}$.","c) $1\\ \\text{HP} = 736\\ \\text{W}$.","d) $1\\ \\text{kWh} = 3600\\ \\text{J}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $1\\ \\text{kWh} = 3,6 \\cdot 10^6\\ \\text{J}$.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $4\\ \\text{kg}$ được thả rơi từ độ cao $25\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản, mốc tại mặt đất). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng của vật bằng $1000\\ \\text{J}$.","b) Khi vật cách mặt đất $10\\ \\text{m}$, động năng bằng $600\\ \\text{J}$.","c) Tốc độ chạm đất xấp xỉ $22,4\\ \\text{m/s}$.","d) Tại độ cao $12,5\\ \\text{m}$, động năng bằng thế năng."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $4 \\cdot 10 \\cdot 25 = 1000\\ \\text{J}$. b) Đúng: $1000 - 400 = 600\\ \\text{J}$. c) Đúng: $v = \\sqrt{2 \\cdot 1000/4} = \\sqrt{500} \\approx 22,36\\ \\text{m/s}$. d) Đúng: $W_t = 500\\ \\text{J} = W/2$.","points": 1},{"type": "short","level": "VD","q": "Một ô tô khối lượng $900\\ \\text{kg}$ chuyển động đều với tốc độ $25\\ \\text{m/s}$; lực cản $720\\ \\text{N}$. Công suất của động cơ bằng bao nhiêu kilôoát? (chỉ điền số)","answer": "18","explain": "$P = 720 \\cdot 25 = 18000\\ \\text{W} = 18\\ \\text{kW}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $2,5\\ \\text{kg}$ trượt không vận tốc đầu từ đỉnh dốc cao $6\\ \\text{m}$, đến chân dốc có tốc độ $9\\ \\text{m/s}$ (lấy $g = 10\\ \\text{m/s}^2$). Công của lực ma sát bằng bao nhiêu jun? (chỉ điền số)","answer": "-48.75","explain": "$W_1 = 2,5 \\cdot 10 \\cdot 6 = 150\\ \\text{J}$; $W_{đ2} = \\frac{1}{2} \\cdot 2,5 \\cdot 81 = 101,25\\ \\text{J}$. $A_{ms} = -48,75\\ \\text{J}$.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "NB","q": "Năng lượng đặc trưng cho","options": ["A. khả năng thực hiện công của vật.","B. mức quán tính của vật.","C. tốc độ của vật.","D. khối lượng của vật."],"answer": "A","explain": "Định nghĩa năng lượng.","points": 0.25},{"type": "mcq","level": "NB","q": "Định lí động năng: công của ngoại lực bằng","options": ["A. độ biến thiên động năng.","B. độ biến thiên thế năng.","C. cơ năng.","D. công suất."],"answer": "A","explain": "$A = \\Delta W_đ$.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật được ném thẳng đứng lên, bỏ qua sức cản. Tại độ cao cực đại,","options": ["A. động năng bằng 0, thế năng cực đại.","B. động năng cực đại.","C. cơ năng bằng 0.","D. thế năng bằng 0."],"answer": "A","explain": "Tốc độ bằng 0 tại điểm cao nhất.","points": 0.25},{"type": "mcq","level": "TH","q": "Muốn tăng hiệu suất của máy cơ, cần","options": ["A. giảm lực ma sát.","B. tăng lực ma sát.","C. tăng khối lượng máy.","D. giảm tốc độ máy."],"answer": "A","explain": "Giảm hao phí.","points": 0.25},{"type": "mcq","level": "TH","q": "Lực $F = 60\\ \\text{N}$ kéo vật đi $9\\ \\text{m}$ theo hướng hợp với lực góc $53^\\circ$ ($\\cos53^\\circ \\approx 0,6$). Công của lực bằng","options": ["A. $324\\ \\text{J}$.","B. $540\\ \\text{J}$.","C. $432\\ \\text{J}$.","D. $69\\ \\text{J}$."],"answer": "A","explain": "$A = 60 \\cdot 9 \\cdot 0,6 = 324\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lò xo có độ cứng $k = 60\\ \\text{N/m}$ bị dãn $15\\ \\text{cm}$. Thế năng đàn hồi bằng","options": ["A. $0,675\\ \\text{J}$.","B. $6,75\\ \\text{J}$.","C. $1,35\\ \\text{J}$.","D. $0,09\\ \\text{J}$."],"answer": "A","explain": "$W = \\frac{1}{2} \\cdot 60 \\cdot 0,0225 = 0,675\\ \\text{J}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công phát động làm tăng động năng của vật.","b) Công cản làm giảm động năng của vật.","c) Tổng công của các lực bằng công của hợp lực.","d) Khi vật chuyển động đều, công của hợp lực khác 0."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: hợp lực bằng 0 nên công bằng 0.","points": 1},{"type": "truefalse","level": "VD","q": "Một xe khối lượng $1500\\ \\text{kg}$ lên dốc nghiêng $30^\\circ$ với tốc độ không đổi $12\\ \\text{m/s}$; lực ma sát $1500\\ \\text{N}$ (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lực kéo của động cơ bằng $9000\\ \\text{N}$.","b) Công suất của động cơ bằng $108\\ \\text{kW}$.","c) Trong $20\\ \\text{s}$, công của trọng lực bằng $-1800000\\ \\text{J}$.","d) Công của lực kéo trong $20\\ \\text{s}$ bằng công của trọng lực về độ lớn."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $1500 \\cdot 10 \\cdot 0,5 + 1500 = 9000\\ \\text{N}$. b) Đúng: $9000 \\cdot 12 = 108000\\ \\text{W}$. c) Đúng: $A_P = -mg\\sin30^\\circ \\cdot vt = -7500 \\cdot 240 = -1800000\\ \\text{J}$. d) Sai: còn công của ma sát nên $|A_{kéo}| \\ne |A_P|$.","points": 1},{"type": "short","level": "VDC","q": "Một vật có khối lượng $700\\ \\text{g}$, thế năng trọng trường $35\\ \\text{J}$ so với mặt đất (lấy $g = 10\\ \\text{m/s}^2$). Độ cao của vật bằng bao nhiêu mét? (chỉ điền số)","answer": "5","explain": "$h = 35/(0,7 \\cdot 10) = 5\\ \\text{m}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một viên đạn khối lượng $10\\ \\text{g}$ bay với tốc độ $500\\ \\text{m/s}$ xuyên vào bao cát dày $40\\ \\text{cm}$ rồi dừng lại. Lực cản trung bình của bao cát bằng bao nhiêu niutơn? (chỉ điền số)","answer": "3125","explain": "$W_đ = \\frac{1}{2} \\cdot 0,01 \\cdot 250000 = 1250\\ \\text{J}$. $F_c = 1250/0,4 = 3125\\ \\text{N}$.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Trong hệ SI, công và năng lượng có đơn vị chung là","options": ["A. jun.","B. oát.","C. niutơn.","D. mét."],"answer": "A","explain": "Cả hai đều đo bằng jun.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi lực tác dụng lên vật tăng gấp ba, các yếu tố khác không đổi thì công của lực","options": ["A. tăng gấp ba.","B. giảm ba lần.","C. không đổi.","D. tăng gấp chín."],"answer": "A","explain": "$A$ tỉ lệ thuận với $F$.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật chuyển động với tốc độ không đổi thì","options": ["A. động năng không đổi.","B. động năng tăng.","C. thế năng tăng.","D. cơ năng tăng."],"answer": "A","explain": "$W_đ$ chỉ phụ thuộc $v$.","points": 0.25},{"type": "mcq","level": "TH","q": "Thế năng của vật phụ thuộc vào","options": ["A. vị trí của vật và mốc thế năng.","B. tốc độ của vật.","C. thời gian chuyển động.","D. quãng đường đã đi."],"answer": "A","explain": "$W_t = mgh$ với $h$ đo từ mốc.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người xách vali $12\\ \\text{kg}$ đi bộ $50\\ \\text{m}$ trên đường ngang. Công của trọng lực tác dụng lên vali bằng","options": ["A. $0$.","B. $6000\\ \\text{J}$.","C. $600\\ \\text{J}$.","D. $120\\ \\text{J}$."],"answer": "A","explain": "Trọng lực vuông góc hướng đi.","points": 0.25},{"type": "mcq","level": "TH","q": "Một máy bơm có công suất $900\\ \\text{W}$ hoạt động trong $5$ phút. Công máy thực hiện bằng","options": ["A. $270000\\ \\text{J}$.","B. $4500\\ \\text{J}$.","C. $180\\ \\text{J}$.","D. $45000\\ \\text{J}$."],"answer": "A","explain": "$A = 900 \\cdot 300 = 270000\\ \\text{J}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Năng lượng đặc trưng cho khả năng sinh công.","b) Công suất đặc trưng cho tốc độ sinh công.","c) Hiệu suất đặc trưng cho hiệu quả sử dụng năng lượng.","d) Cả ba đại lượng trên đều có đơn vị là jun."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: công suất đơn vị oát, hiệu suất không có đơn vị.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $0,8\\ \\text{kg}$ được ném ngang với tốc độ $12\\ \\text{m/s}$ từ độ cao $15\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản, mốc tại mặt đất). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng của vật bằng $177,6\\ \\text{J}$.","b) Tốc độ khi chạm đất xấp xỉ $21\\ \\text{m/s}$.","c) Động năng khi chạm đất bằng $177,6\\ \\text{J}$.","d) Thời gian chạm đất phụ thuộc khối lượng vật."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $\\frac{1}{2} \\cdot 0,8 \\cdot 144 + 0,8 \\cdot 10 \\cdot 15 = 57,6 + 120 = 177,6\\ \\text{J}$. b) Đúng: $v = \\sqrt{2 \\cdot 177,6/0,8} = \\sqrt{444} \\approx 21,07\\ \\text{m/s}$. c) Đúng: thế năng tại đất bằng 0. d) Sai: $t = \\sqrt{2h/g}$.","points": 1},{"type": "short","level": "VDC","q": "Một vật khối lượng $5\\ \\text{kg}$ có động năng $160\\ \\text{J}$. Tốc độ của vật bằng bao nhiêu m/s? (chỉ điền số)","answer": "8","explain": "$v = \\sqrt{2 \\cdot 160/5} = \\sqrt{64} = 8\\ \\text{m/s}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một xe goòng khối lượng $400\\ \\text{kg}$ đang chuyển động với tốc độ $6\\ \\text{m/s}$ thì hãm phanh, đi thêm $24\\ \\text{m}$ rồi dừng. Hệ số ma sát giữa xe và đường bằng bao nhiêu? (lấy $g = 10\\ \\text{m/s}^2$, chỉ điền số)","answer": "0.075","explain": "$W_đ = \\frac{1}{2} \\cdot 400 \\cdot 36 = 7200\\ \\text{J}$. $F_{ms} = 7200/24 = 300\\ \\text{N}$. $\\mu = 300/4000 = 0,075$.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Công của trọng lực khi vật đi lên độ cao $h$ bằng","options": ["A. $-mgh$.","B. $mgh$.","C. $0$.","D. $2mgh$."],"answer": "A","explain": "Trọng lực ngược hướng đi lên: công cản.","points": 0.25},{"type": "mcq","level": "NB","q": "Công thức $P = \\frac{A}{t}$ cho","options": ["A. công suất trung bình.","B. công suất tức thời.","C. hiệu suất.","D. động năng."],"answer": "A","explain": "Đó là công suất trung bình trong khoảng thời gian $t$.","points": 0.25},{"type": "mcq","level": "NB","q": "Động năng của vật bằng 0 khi","options": ["A. vật đứng yên.","B. vật ở trên cao.","C. vật có khối lượng lớn.","D. không có lực tác dụng."],"answer": "A","explain": "$v = 0$.","points": 0.25},{"type": "mcq","level": "TH","q": "Cơ năng của con lắc lò xo (bỏ qua ma sát) gồm","options": ["A. động năng và thế năng đàn hồi.","B. động năng và nhiệt năng.","C. thế năng trọng trường và nhiệt năng.","D. chỉ có động năng."],"answer": "A","explain": "$W = W_đ + W_{tđh}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $2\\ \\text{kg}$ rơi từ độ cao $18\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Công của trọng lực bằng","options": ["A. $360\\ \\text{J}$.","B. $36\\ \\text{J}$.","C. $20\\ \\text{J}$.","D. $-360\\ \\text{J}$."],"answer": "A","explain": "$A_P = 2 \\cdot 10 \\cdot 18 = 360\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một thang cuốn đưa người $65\\ \\text{kg}$ lên cao $6\\ \\text{m}$ trong $30\\ \\text{s}$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất có ích bằng","options": ["A. $130\\ \\text{W}$.","B. $3900\\ \\text{W}$.","C. $117000\\ \\text{W}$.","D. $13\\ \\text{W}$."],"answer": "A","explain": "$A = 65 \\cdot 10 \\cdot 6 = 3900\\ \\text{J}$. $P = 3900/30 = 130\\ \\text{W}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khi $\\alpha = 0^\\circ$, công của lực đạt cực đại.","b) Khi $\\alpha = 180^\\circ$, công của lực đạt cực tiểu (âm nhất).","c) Công của lực ma sát nghỉ luôn bằng 0.","d) Công của lực đàn hồi trên đường kín khác 0."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $\\cos0^\\circ = 1$. b) Đúng: $\\cos180^\\circ = -1$. c) Đúng: điểm đặt không dịch chuyển. d) Sai: lực đàn hồi là lực thế, công trên đường kín bằng 0.","points": 1},{"type": "truefalse","level": "VD","q": "Một cần cẩu nâng đều dầm thép $800\\ \\text{kg}$ lên cao $25\\ \\text{m}$ trong $50\\ \\text{s}$, hiệu suất $80\\%$ (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công có ích bằng $200000\\ \\text{J}$.","b) Công suất có ích bằng $4000\\ \\text{W}$.","c) Công suất toàn phần bằng $5000\\ \\text{W}$.","d) Tốc độ nâng đều bằng $0,4\\ \\text{m/s}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $800 \\cdot 10 \\cdot 25 = 200000\\ \\text{J}$. b) Đúng: $200000/50 = 4000\\ \\text{W}$. c) Đúng: $4000/0,8 = 5000\\ \\text{W}$. d) Sai: $v = 25/50 = 0,5\\ \\text{m/s}$.","points": 1},{"type": "short","level": "VDC","q": "Một lực không đổi $F$ tác dụng lên vật làm vật đi $20\\ \\text{m}$ theo hướng của lực, thực hiện công $1000\\ \\text{J}$. Độ lớn lực $F$ bằng bao nhiêu niutơn? (chỉ điền số)","answer": "50","explain": "$F = A/s = 1000/20 = 50\\ \\text{N}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật được ném thẳng đứng lên đạt độ cao cực đại $45\\ \\text{m}$ (bỏ qua sức cản, lấy $g = 10\\ \\text{m/s}^2$). Khi vật ở độ cao $20\\ \\text{m}$ (đang đi lên), tốc độ của vật bằng bao nhiêu m/s? (chỉ điền số, làm tròn đến 1 chữ số thập phân)","answer": "22.4","explain": "$v_0 = \\sqrt{2 \\cdot 10 \\cdot 45} = 30\\ \\text{m/s}$. $v^2 = 900 - 2 \\cdot 10 \\cdot 20 = 500$, $v = \\sqrt{500} \\approx 22,36\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Phát biểu nào sau đây đúng về công suất?","options": ["A. Công suất là đại lượng vô hướng.","B. Công suất là đại lượng vectơ.","C. Đơn vị của công suất là jun.","D. Công suất càng lớn thì hiệu suất càng lớn."],"answer": "A","explain": "Công suất chỉ có độ lớn (vô hướng), đơn vị là oát; công suất và hiệu suất là hai đại lượng độc lập.","points": 0.25},{"type": "mcq","level": "NB","q": "$1\\ \\text{HP}$ bằng","options": ["A. $736\\ \\text{W}$.","B. $1000\\ \\text{W}$.","C. $1\\ \\text{W}$.","D. $3600\\ \\text{W}$."],"answer": "A","explain": "Quy ước đơn vị mã lực.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi tốc độ của vật tăng gấp đôi thì động năng","options": ["A. tăng gấp bốn.","B. tăng gấp đôi.","C. không đổi.","D. giảm một nửa."],"answer": "A","explain": "$W_đ$ tỉ lệ với $v^2$.","points": 0.25},{"type": "mcq","level": "TH","q": "Vật ở dưới mốc thế năng thì thế năng trọng trường","options": ["A. âm.","B. dương.","C. bằng 0.","D. không xác định."],"answer": "A","explain": "$h \\lt 0$ nên $W_t \\lt 0$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lực $F = 40\\ \\text{N}$ ngược chiều chuyển động tác dụng lên vật đi được $7\\ \\text{m}$. Công của lực bằng","options": ["A. $-280\\ \\text{J}$.","B. $280\\ \\text{J}$.","C. $47\\ \\text{J}$.","D. $0$."],"answer": "A","explain": "$A = -40 \\cdot 7 = -280\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một xe máy chuyển động đều với tốc độ $12\\ \\text{m/s}$, công suất động cơ $3600\\ \\text{W}$. Lực kéo của động cơ bằng","options": ["A. $300\\ \\text{N}$.","B. $43200\\ \\text{N}$.","C. $3612\\ \\text{N}$.","D. $30\\ \\text{N}$."],"answer": "A","explain": "$F = 3600/12 = 300\\ \\text{N}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động năng luôn không âm.","b) Thế năng trọng trường có thể âm.","c) Thế năng đàn hồi luôn không âm.","d) Cơ năng luôn dương."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng: dưới mốc. c) Đúng. d) Sai: cơ năng có thể âm nếu thế năng âm đủ lớn.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $1,2\\ \\text{kg}$ trượt không ma sát từ đỉnh dốc cao $5\\ \\text{m}$ xuống (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng của vật bằng $60\\ \\text{J}$.","b) Tốc độ ở chân dốc bằng $10\\ \\text{m/s}$.","c) Tại độ cao $2\\ \\text{m}$, động năng bằng $36\\ \\text{J}$.","d) Tốc độ ở chân dốc không phụ thuộc góc nghiêng của dốc."],"answer": ["T","T","T","T"],"explain": "a) Đúng: $1,2 \\cdot 10 \\cdot 5 = 60\\ \\text{J}$. b) Đúng: $v = \\sqrt{2 \\cdot 60/1,2} = 10\\ \\text{m/s}$. c) Đúng: $60 - 1,2 \\cdot 10 \\cdot 2 = 36\\ \\text{J}$. d) Đúng: $v = \\sqrt{2gh}$.","points": 1},{"type": "short","level": "VDC","q": "Một máy có hiệu suất $75\\%$, công suất hao phí $250\\ \\text{W}$. Công suất có ích bằng bao nhiêu oát? (chỉ điền số)","answer": "750","explain": "$P_{tp} = 250/0,25 = 1000\\ \\text{W}$; $P_{ci} = 750\\ \\text{W}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $m$ đang chuyển động với tốc độ $v$. Nếu khối lượng giảm một nửa và tốc độ tăng gấp ba thì động năng thay đổi thế nào? Điền hệ số (ví dụ tăng 2 lần thì điền 2, giảm 2 lần thì điền 0.5).","answer": "4.5","explain": "$W_đ' = \\frac{1}{2} \\cdot \\frac{m}{2} \\cdot 9v^2 = 4,5W_đ$.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "NB","q": "Kí hiệu $\\alpha$ trong $A = Fs\\cos\\alpha$ là","options": ["A. góc giữa lực và hướng dịch chuyển.","B. góc nghiêng của mặt phẳng.","C. góc quay của vật.","D. góc tới của tia sáng."],"answer": "A","explain": "Định nghĩa góc $\\alpha$.","points": 0.25},{"type": "mcq","level": "NB","q": "Công suất cho biết","options": ["A. tốc độ thực hiện công.","B. tổng công thực hiện.","C. lực tác dụng.","D. năng lượng tiêu thụ."],"answer": "A","explain": "Định nghĩa công suất.","points": 0.25},{"type": "mcq","level": "TH","q": "Động năng của vật phụ thuộc vào","options": ["A. khối lượng và tốc độ.","B. độ cao.","C. độ biến dạng.","D. nhiệt độ."],"answer": "A","explain": "$W_đ = \\frac{1}{2}mv^2$.","points": 0.25},{"type": "mcq","level": "TH","q": "Điều kiện để cơ năng được bảo toàn là","options": ["A. không có lực ma sát, lực cản.","B. có lực ma sát.","C. vật chuyển động đều.","D. vật đứng yên."],"answer": "A","explain": "Chỉ có lực thế sinh công.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $9\\ \\text{kg}$ được nâng lên cao $2\\ \\text{m}$ với tốc độ không đổi (lấy $g = 10\\ \\text{m/s}^2$). Công của lực nâng bằng","options": ["A. $180\\ \\text{J}$.","B. $18\\ \\text{J}$.","C. $45\\ \\text{J}$.","D. $-180\\ \\text{J}$."],"answer": "A","explain": "$A = mgh = 9 \\cdot 10 \\cdot 2 = 180\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một bóng đèn $75\\ \\text{W}$ thắp sáng trong $4$ giờ. Điện năng tiêu thụ bằng","options": ["A. $1080000\\ \\text{J}$.","B. $300\\ \\text{J}$.","C. $18000\\ \\text{J}$.","D. $30000\\ \\text{J}$."],"answer": "A","explain": "$A = 75 \\cdot 14400 = 1080000\\ \\text{J}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) $A = Fs\\cos\\alpha$ áp dụng cho lực không đổi.","b) $P = \\frac{A}{t}$ cho công suất trung bình.","c) $W_đ = \\frac{1}{2}mv^2$.","d) $H = \\frac{A_{tp}}{A_{ci}} \\cdot 100\\%$."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $H = A_{ci}/A_{tp}$.","points": 1},{"type": "truefalse","level": "VDC","q": "Một lò xo $k = 120\\ \\text{N/m}$ nằm ngang, vật $0,3\\ \\text{kg}$. Kéo dãn $15\\ \\text{cm}$ rồi thả nhẹ (bỏ qua ma sát). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng của hệ bằng $1,35\\ \\text{J}$.","b) Tốc độ cực đại của vật bằng $3\\ \\text{m/s}$.","c) Khi lò xo dãn $9\\ \\text{cm}$, tốc độ của vật là $2,4\\ \\text{m/s}$.","d) Tại vị trí cân bằng, thế năng đàn hồi cực đại."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $\\frac{1}{2} \\cdot 120 \\cdot 0,0225 = 1,35\\ \\text{J}$. b) Đúng: $v_{max} = \\sqrt{2 \\cdot 1,35/0,3} = 3\\ \\text{m/s}$. c) Đúng: $W_đ = 1,35 - \\frac{1}{2} \\cdot 120 \\cdot 0,0081 = 0,864\\ \\text{J}$, $v = \\sqrt{5,76} = 2,4\\ \\text{m/s}$. d) Sai: tại vị trí cân bằng lò xo không biến dạng nên thế năng cực TIỂU.","points": 1},{"type": "short","level": "VDC","q": "Một vật đang chuyển động với động năng $50\\ \\text{J}$ thì chịu lực cản sinh công $-30\\ \\text{J}$. Động năng lúc sau bằng bao nhiêu jun? (chỉ điền số)","answer": "20","explain": "$W_{đ2} = 50 - 30 = 20\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật được thả rơi từ độ cao $H$. Khi động năng gấp $3$ lần thế năng, vật đã rơi được quãng đường bằng bao nhiêu phần của $H$? (chỉ điền số, ví dụ $0.5$)","answer": "0.75","explain": "$W_đ = 3W_t$, $W_đ + W_t = mgH$ nên $W_t = mgH/4$, độ cao còn $H/4$, đã rơi $3H/4$.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Phát biểu nào sau đây là SAI?","options": ["A. Hiệu suất của máy có thể lớn hơn $100\\%$.","B. Công suất có đơn vị là oát.","C. Động năng không âm.","D. Cơ năng bằng tổng động năng và thế năng."],"answer": "A","explain": "$H \\le 100\\%$.","points": 0.25},{"type": "mcq","level": "NB","q": "Một máy thực hiện công càng nhanh thì","options": ["A. công suất càng lớn.","B. hiệu suất càng lớn.","C. công càng lớn.","D. năng lượng càng lớn."],"answer": "A","explain": "Công suất đặc trưng cho tốc độ sinh công.","points": 0.25},{"type": "mcq","level": "TH","q": "Lò xo bị nén $5\\ \\text{cm}$ và lò xo bị dãn $5\\ \\text{cm}$ (cùng độ cứng) có thế năng đàn hồi","options": ["A. bằng nhau.","B. khác nhau.","C. bằng 0.","D. không so sánh được."],"answer": "A","explain": "Chỉ phụ thuộc $|\\Delta l|$.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi vật trượt có ma sát xuống dốc,","options": ["A. cơ năng giảm dần.","B. cơ năng không đổi.","C. động năng không đổi.","D. thế năng tăng."],"answer": "A","explain": "Ma sát làm cơ năng giảm.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $0,9\\ \\text{kg}$ chuyển động với tốc độ $10\\ \\text{m/s}$. Động năng bằng","options": ["A. $45\\ \\text{J}$.","B. $90\\ \\text{J}$.","C. $9\\ \\text{J}$.","D. $4,5\\ \\text{J}$."],"answer": "A","explain": "$W_đ = \\frac{1}{2} \\cdot 0,9 \\cdot 100 = 45\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một động cơ nâng $120\\ \\text{kg}$ vật liệu lên cao $8\\ \\text{m}$ trong $24\\ \\text{s}$ (lấy $g = 10\\ \\text{m/s}^2$). Công suất có ích bằng","options": ["A. $400\\ \\text{W}$.","B. $9600\\ \\text{W}$.","C. $230400\\ \\text{W}$.","D. $40\\ \\text{W}$."],"answer": "A","explain": "$A = 120 \\cdot 10 \\cdot 8 = 9600\\ \\text{J}$. $P = 9600/24 = 400\\ \\text{W}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công của hợp lực bằng tổng công các lực thành phần.","b) Công suất $P = Fv$ khi lực cùng hướng vận tốc.","c) Định lí động năng: $A = W_{đ2} - W_{đ1}$.","d) Hiệu suất $H = \\frac{A_{tp}}{A_{ci}} \\cdot 100\\%$."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $H = A_{ci}/A_{tp}$.","points": 1},{"type": "truefalse","level": "VDC","q": "Một vật khối lượng $2\\ \\text{kg}$ được ném thẳng đứng lên với tốc độ $14\\ \\text{m/s}$ từ mặt đất (lấy $g = 10\\ \\text{m/s}^2$, bỏ qua sức cản). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Cơ năng của vật bằng $196\\ \\text{J}$.","b) Độ cao cực đại bằng $9,8\\ \\text{m}$.","c) Khi vật ở độ cao $4,9\\ \\text{m}$, tốc độ xấp xỉ $9,9\\ \\text{m/s}$.","d) Khi rơi về mặt đất, tốc độ nhỏ hơn $14\\ \\text{m/s}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $\\frac{1}{2} \\cdot 2 \\cdot 196 = 196\\ \\text{J}$. b) Đúng: $196/20 = 9,8\\ \\text{m}$. c) Đúng: $W_đ = 196 - 98 = 98\\ \\text{J}$, $v = \\sqrt{98} \\approx 9,9\\ \\text{m/s}$. d) Sai: bảo toàn cơ năng nên tốc độ vẫn $14\\ \\text{m/s}$.","points": 1},{"type": "short","level": "VDC","q": "Một vật có cơ năng $200\\ \\text{J}$, thế năng $70\\ \\text{J}$. Động năng của vật bằng bao nhiêu jun? (chỉ điền số)","answer": "130","explain": "$W_đ = 200 - 70 = 130\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một con lắc đơn dài $1,6\\ \\text{m}$ được kéo lệch góc $37^\\circ$ ($\\cos37^\\circ \\approx 0,8$) rồi thả nhẹ (lấy $g = 10\\ \\text{m/s}^2$). Tốc độ tại vị trí cân bằng bằng bao nhiêu m/s? (chỉ điền số, làm tròn đến 1 chữ số thập phân)","answer": "2.5","explain": "$h = 1,6 \\cdot 0,2 = 0,32\\ \\text{m}$. $v = \\sqrt{6,4} \\approx 2,53\\ \\text{m/s}$.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Trong các đơn vị sau, đơn vị nào KHÔNG phải đơn vị năng lượng?","options": ["A. Oát.","B. Jun.","C. Calo.","D. $\\text{N} \\cdot \\text{m}$."],"answer": "A","explain": "Oát là đơn vị công suất.","points": 0.25},{"type": "mcq","level": "NB","q": "Công của lực $F$ khi $\\alpha = 90^\\circ$ bằng","options": ["A. $0$.","B. $Fs$.","C. $-Fs$.","D. $Fs/2$."],"answer": "A","explain": "$\\cos90^\\circ = 0$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật rơi tự do, đại lượng nào được bảo toàn (bỏ qua sức cản)?","options": ["A. Cơ năng.","B. Động năng.","C. Thế năng.","D. Vận tốc."],"answer": "A","explain": "Chỉ có tổng $W_đ + W_t$ không đổi.","points": 0.25},{"type": "mcq","level": "TH","q": "Hiệu suất càng cao thì","options": ["A. năng lượng hao phí càng ít (với cùng công có ích).","B. công suất càng lớn.","C. máy càng nặng.","D. thời gian hoạt động càng lâu."],"answer": "A","explain": "Ý nghĩa của hiệu suất.","points": 0.25},{"type": "mcq","level": "TH","q": "Hai xe có khối lượng $m$ và $2m$, chuyển động với cùng tốc độ $v$. Tỉ số động năng $W_{đ1}/W_{đ2}$ bằng","options": ["A. $1/2$.","B. $2$.","C. $1$.","D. $1/4$."],"answer": "A","explain": "$W_đ$ tỉ lệ với $m$ nên tỉ số bằng $1/2$.","points": 0.25},{"type": "mcq","level": "VD","q": "Một máy phát điện có công suất $50\\ \\text{kW}$, hiệu suất $95\\%$. Công suất hao phí bằng","options": ["A. $2,5\\ \\text{kW}$.","B. $47,5\\ \\text{kW}$.","C. $52,6\\ \\text{kW}$.","D. $5\\ \\text{kW}$."],"answer": "A","explain": "$0,05 \\cdot 50 = 2,5\\ \\text{kW}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) $1\\ \\text{J} = 1\\ \\text{N} \\cdot 1\\ \\text{m}$.","b) $1\\ \\text{W} = 1\\ \\text{J/s}$.","c) $1\\ \\text{kW} = 1000\\ \\text{W}$.","d) $1\\ \\text{HP} = 1000\\ \\text{W}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $1\\ \\text{HP} = 736\\ \\text{W}$.","points": 1},{"type": "truefalse","level": "VDC","q": "Một ô tô khối lượng $1000\\ \\text{kg}$ đang chạy $18\\ \\text{m/s}$ thì phanh với lực hãm $4500\\ \\text{N}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Động năng ban đầu bằng $162000\\ \\text{J}$.","b) Quãng đường phanh bằng $36\\ \\text{m}$.","c) Công của lực hãm bằng $-162000\\ \\text{J}$.","d) Nếu tốc độ ban đầu tăng gấp đôi thì quãng đường phanh tăng gấp đôi."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $\\frac{1}{2} \\cdot 1000 \\cdot 324 = 162000\\ \\text{J}$. b) Đúng: $162000/4500 = 36\\ \\text{m}$. c) Đúng: định lí động năng. d) Sai: $s$ tỉ lệ với $v^2$ nên tăng gấp bốn.","points": 1},{"type": "short","level": "VDC","q": "Một lực $F$ không đổi cùng hướng chuyển động thực hiện công $600\\ \\text{J}$ khi vật đi $15\\ \\text{m}$. Độ lớn $F$ bằng bao nhiêu niutơn? (chỉ điền số)","answer": "40","explain": "$F = 600/15 = 40\\ \\text{N}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $0,5\\ \\text{kg}$ trượt từ đỉnh mặt phẳng nghiêng cao $2\\ \\text{m}$, dài $4\\ \\text{m}$, hệ số ma sát $\\mu = 0,1$ (lấy $g = 10\\ \\text{m/s}^2$, $\\sqrt{3} \\approx 1,73$). Tốc độ ở chân dốc bằng bao nhiêu m/s? (chỉ điền số, làm tròn đến 1 chữ số thập phân)","answer": "5.8","explain": "$\\sin\\alpha = 0,5$, $\\cos\\alpha \\approx 0,866$. $W_{đ2} = mgh - \\mu mg\\cos\\alpha \\cdot l = 10 - 0,1 \\cdot 5 \\cdot 0,866 \\cdot 4 = 10 - 1,732 = 8,268\\ \\text{J}$. $v = \\sqrt{2 \\cdot 8,268/0,5} = \\sqrt{33,07} \\approx 5,75\\ \\text{m/s}$.","points": 0.5}]}]}
