{"sets": [{"name": "Đề 1","questions": [{"type": "mcq","level": "NB","q": "Năng lượng của một vật đặc trưng cho","options": ["A. khả năng thực hiện công của vật.","B. khối lượng của vật.","C. tốc độ chuyển động của vật.","D. nhiệt độ của vật."],"answer": "A","explain": "Theo SGK, năng lượng đặc trưng cho khả năng thực hiện công của vật. Vật có năng lượng càng lớn thì khả năng sinh công càng lớn.","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị của công cơ học trong hệ SI là","options": ["A. jun (J).","B. oát (W).","C. niutơn (N).","D. mét (m)."],"answer": "A","explain": "Công cơ học có đơn vị là jun, kí hiệu J. Oát (W) là đơn vị công suất, niutơn (N) là đơn vị lực.","points": 0.25},{"type": "mcq","level": "NB","q": "Công thức tính công $A$ của một lực không đổi $F$ làm vật dịch chuyển quãng đường $s$ là","options": ["A. $A = Fs\\cos\\alpha$.","B. $A = Fs\\sin\\alpha$.","C. $A = \\frac{F}{s}$.","D. $A = Fst$."],"answer": "A","explain": "Công của lực không đổi: $A = Fs\\cos\\alpha$, trong đó $\\alpha$ là góc giữa hướng của lực và hướng dịch chuyển.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi góc giữa lực tác dụng và hướng dịch chuyển $\\alpha = 90^\\circ$ thì công của lực","options": ["A. bằng 0.","B. có giá trị dương.","C. có giá trị âm.","D. đạt cực đại."],"answer": "A","explain": "Vì $\\cos 90^\\circ = 0$ nên $A = Fs\\cos 90^\\circ = 0$. Lực vuông góc với hướng dịch chuyển không sinh công.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lực $F = 20\\ \\text{N}$ kéo vật đi quãng đường $s = 5\\ \\text{m}$ theo đúng hướng của lực. Công của lực bằng","options": ["A. $100\\ \\text{J}$.","B. $25\\ \\text{J}$.","C. $4\\ \\text{J}$.","D. $0,25\\ \\text{J}$."],"answer": "A","explain": "Lực cùng hướng dịch chuyển nên $\\alpha = 0^\\circ$, $\\cos\\alpha = 1$. $A = Fs = 20 \\cdot 5 = 100\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Trường hợp nào sau đây lực thực hiện công phát động?","options": ["A. Lực kéo cùng chiều chuyển động của vật.","B. Lực ma sát trượt.","C. Lực vuông góc với hướng dịch chuyển.","D. Trọng lực khi vật được nâng lên cao."],"answer": "A","explain": "Công phát động là công dương ($A \\gt 0$), xảy ra khi $\\alpha$ nhọn, tức lực có thành phần cùng chiều chuyển động.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Năng lượng có đơn vị là jun (J).","b) Công là đại lượng vô hướng, có thể dương, âm hoặc bằng 0.","c) Khi vật đứng yên thì mọi lực tác dụng lên vật đều sinh công bằng 0.","d) Công của lực ma sát trượt luôn là công phát động."],"answer": ["T","T","T","F"],"explain": "a) Đúng: công và năng lượng cùng đơn vị jun. b) Đúng: công vô hướng, dấu phụ thuộc góc $\\alpha$. c) Đúng: $s = 0$ nên $A = Fs\\cos\\alpha = 0$. d) Sai: lực ma sát trượt ngược chiều chuyển động nên luôn sinh công cản (âm).","points": 1},{"type": "truefalse","level": "VD","q": "Một lực không đổi $F = 10\\ \\text{N}$ tác dụng lên vật làm vật dịch chuyển $s = 4\\ \\text{m}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khi $\\alpha = 60^\\circ$ thì công của lực bằng $20\\ \\text{J}$.","b) Khi $\\alpha = 120^\\circ$ thì công của lực bằng $-20\\ \\text{J}$.","c) Khi $\\alpha = 90^\\circ$ thì công của lực bằng $20\\ \\text{J}$.","d) Nếu quãng đường tăng gấp đôi thì công của lực tăng gấp đôi."],"answer": ["T","T","F","T"],"explain": "a) Đúng: $A = 10 \\cdot 4 \\cdot \\cos 60^\\circ = 40 \\cdot 0,5 = 20\\ \\text{J}$. b) Đúng: $A = 40 \\cdot \\cos 120^\\circ = 40 \\cdot (-0,5) = -20\\ \\text{J}$. c) Sai: $\\cos 90^\\circ = 0$ nên $A = 0$. d) Đúng: $A$ tỉ lệ thuận với $s$ khi $F$ và $\\alpha$ không đổi.","points": 1},{"type": "short","level": "VD","q": "Một người kéo thùng hàng bằng lực $F = 50\\ \\text{N}$ hợp với phương ngang góc $60^\\circ$, thùng đi được $8\\ \\text{m}$ trên mặt ngang. Tính công của lực kéo (đơn vị jun, chỉ điền số).","answer": "200","explain": "$A = Fs\\cos\\alpha = 50 \\cdot 8 \\cdot \\cos 60^\\circ = 400 \\cdot 0,5 = 200\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Vật khối lượng $2\\ \\text{kg}$ trượt đều xuống mặt phẳng nghiêng dài $5\\ \\text{m}$, góc nghiêng $30^\\circ$ so với phương ngang. Tính công của trọng lực (lấy $g = 10\\ \\text{m/s}^2$, đơn vị jun, chỉ điền số).","answer": "50","explain": "Độ cao vật hạ xuống: $h = 5 \\cdot \\sin 30^\\circ = 2,5\\ \\text{m}$. Công của trọng lực: $A_P = mgh = 2 \\cdot 10 \\cdot 2,5 = 50\\ \\text{J}$.","points": 0.5}]},{"name": "Đề 2","questions": [{"type": "mcq","level": "NB","q": "Một vật rơi tự do từ độ cao $h$ xuống đất. Công của trọng lực tác dụng lên vật bằng","options": ["A. $mgh$.","B. $-mgh$.","C. $\\frac{1}{2}mv^2$.","D. $0$."],"answer": "A","explain": "Khi vật rơi xuống, trọng lực cùng hướng dịch chuyển ($\\alpha = 0^\\circ$) nên công dương: $A_P = Ph = mgh$.","points": 0.25},{"type": "mcq","level": "NB","q": "Đại lượng nào sau đây KHÔNG phải là một dạng năng lượng?","options": ["A. Khối lượng.","B. Động năng.","C. Nhiệt năng.","D. Điện năng."],"answer": "A","explain": "Khối lượng là đại lượng đặc trưng cho mức quán tính của vật, không phải dạng năng lượng. Động năng, nhiệt năng, điện năng đều là các dạng năng lượng.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi $90^\\circ \\lt \\alpha \\le 180^\\circ$ thì công của lực là","options": ["A. công cản.","B. công phát động.","C. bằng 0.","D. đạt giá trị cực đại."],"answer": "A","explain": "Khi $\\alpha$ tù, $\\cos\\alpha \\lt 0$ nên $A = Fs\\cos\\alpha \\lt 0$: lực sinh công cản.","points": 0.25},{"type": "mcq","level": "NB","q": "Một vật chuyển động tròn đều. Lực nào sau đây KHÔNG sinh công?","options": ["A. Lực hướng tâm.","B. Lực kéo tiếp tuyến cùng chiều chuyển động.","C. Lực ma sát nghỉ.","D. Lực đàn hồi của lò xo bị biến dạng."],"answer": "A","explain": "Lực hướng tâm luôn vuông góc với hướng chuyển động ($\\alpha = 90^\\circ$) nên công của nó bằng 0.","points": 0.25},{"type": "mcq","level": "TH","q": "Vật khối lượng $5\\ \\text{kg}$ được nâng thẳng đứng lên cao $2\\ \\text{m}$ với tốc độ không đổi. Công của trọng lực bằng (lấy $g = 10\\ \\text{m/s}^2$)","options": ["A. $-100\\ \\text{J}$.","B. $100\\ \\text{J}$.","C. $50\\ \\text{J}$.","D. $-50\\ \\text{J}$."],"answer": "A","explain": "Trọng lực ngược hướng dịch chuyển ($\\alpha = 180^\\circ$) nên $A_P = -Ph = -mgh = -5 \\cdot 10 \\cdot 2 = -100\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật chịu tác dụng của lực $F = 10\\ \\text{N}$ ngược chiều chuyển động và đi được $3\\ \\text{m}$. Công của lực này bằng","options": ["A. $-30\\ \\text{J}$.","B. $30\\ \\text{J}$.","C. $13\\ \\text{J}$.","D. $0$."],"answer": "A","explain": "$\\alpha = 180^\\circ$, $\\cos\\alpha = -1$ nên $A = -Fs = -10 \\cdot 3 = -30\\ \\text{J}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Lực ma sát trượt luôn sinh công âm.","b) Khi nâng vật lên cao với tốc độ không đổi, công của lực nâng bằng $mgh$.","c) Công của trọng lực khi vật chuyển động trên mặt phẳng ngang bằng 0.","d) Lực càng lớn thì công của lực càng lớn."],"answer": ["T","T","T","F"],"explain": "a) Đúng: ma sát trượt ngược chiều chuyển động nên $A \\lt 0$. b) Đúng: lực nâng $F = P = mg$ cùng hướng dịch chuyển, $A = mgh$. c) Đúng: trọng lực vuông góc với mặt ngang nên $A = 0$. d) Sai: công còn phụ thuộc quãng đường $s$ và góc $\\alpha$.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật trượt đều trên mặt ngang dưới tác dụng của lực kéo $F = 20\\ \\text{N}$ theo phương ngang, đi được $s = 10\\ \\text{m}$; lực ma sát trượt có độ lớn $20\\ \\text{N}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công của lực kéo bằng $200\\ \\text{J}$.","b) Công của lực ma sát bằng $-200\\ \\text{J}$.","c) Công của trọng lực bằng 0.","d) Tổng công của các lực tác dụng lên vật khác 0."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $A_F = 20 \\cdot 10 = 200\\ \\text{J}$. b) Đúng: $A_{ms} = -20 \\cdot 10 = -200\\ \\text{J}$. c) Đúng: trọng lực vuông góc mặt ngang. d) Sai: vật chuyển động đều nên hợp lực bằng 0, tổng công các lực bằng 0.","points": 1},{"type": "short","level": "VD","q": "Một xe khối lượng $1000\\ \\text{kg}$ chuyển động đều trên đường ngang với tốc độ $10\\ \\text{m/s}$, lực cản không đổi $F_c = 400\\ \\text{N}$. Tính công của lực kéo động cơ sau $30\\ \\text{s}$ (đơn vị kilôjun, chỉ điền số).","answer": "120","explain": "Chuyển động đều nên $F_{kéo} = F_c = 400\\ \\text{N}$. Quãng đường: $s = vt = 10 \\cdot 30 = 300\\ \\text{m}$. $A = 400 \\cdot 300 = 120000\\ \\text{J} = 120\\ \\text{kJ}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $2\\ \\text{kg}$ được kéo trượt đều lên mặt phẳng nghiêng góc $30^\\circ$, dài $10\\ \\text{m}$, hệ số ma sát $\\mu = 0,1$ (lấy $\\sqrt{3} \\approx 1,73$; $g = 10\\ \\text{m/s}^2$). Tính công của lực kéo theo mặt nghiêng (đơn vị jun, chỉ điền số, làm tròn đến hàng đơn vị).","answer": "117","explain": "Trượt đều nên $F_{kéo} = mg\\sin 30^\\circ + \\mu mg\\cos 30^\\circ = 20 \\cdot 0,5 + 0,1 \\cdot 20 \\cdot 0,866 = 11,732\\ \\text{N}$. $A = F_{kéo} \\cdot s = 11,732 \\cdot 10 \\approx 117\\ \\text{J}$.","points": 0.5}]},{"name": "Đề 3","questions": [{"type": "mcq","level": "NB","q": "Công cơ học được thực hiện khi","options": ["A. có lực tác dụng lên vật và vật chuyển dời.","B. có lực tác dụng lên vật dù vật đứng yên.","C. vật chuyển động mà không có lực nào tác dụng.","D. vật có khối lượng rất lớn."],"answer": "A","explain": "Điều kiện sinh công: có lực tác dụng và điểm đặt của lực chuyển dời (vật dịch chuyển).","points": 0.25},{"type": "mcq","level": "NB","q": "$1\\ \\text{J}$ bằng","options": ["A. $1\\ \\text{N} \\cdot 1\\ \\text{m}$.","B. $1\\ \\text{N} / 1\\ \\text{m}$.","C. $1\\ \\text{kg} \\cdot 1\\ \\text{m}$.","D. $1\\ \\text{m} / 1\\ \\text{s}$."],"answer": "A","explain": "$1\\ \\text{J} = 1\\ \\text{N} \\cdot 1\\ \\text{m}$: công của lực $1\\ \\text{N}$ làm vật dịch chuyển $1\\ \\text{m}$ theo hướng của lực.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong các đơn vị sau, đơn vị nào KHÔNG phải đơn vị của công?","options": ["A. Oát (W).","B. Jun (J).","C. Kilôjun (kJ).","D. $\\text{N} \\cdot \\text{m}$."],"answer": "A","explain": "Oát (W) là đơn vị công suất. Jun, kilôjun và $\\text{N} \\cdot \\text{m}$ đều là đơn vị công (năng lượng).","points": 0.25},{"type": "mcq","level": "NB","q": "Khi vật chuyển động thẳng đều, tổng công của tất cả các lực tác dụng lên vật bằng","options": ["A. $0$.","B. một số dương.","C. một số âm.","D. $mgh$."],"answer": "A","explain": "Chuyển động thẳng đều nên hợp lực bằng 0, do đó công của hợp lực (bằng tổng công các lực) bằng 0.","points": 0.25},{"type": "mcq","level": "TH","q": "Lực $F = 100\\ \\text{N}$ tác dụng lên vật theo phương ngang làm vật đi $20\\ \\text{m}$ theo hướng của lực. Công của lực bằng","options": ["A. $2000\\ \\text{J}$.","B. $120\\ \\text{J}$.","C. $5\\ \\text{J}$.","D. $0,5\\ \\text{J}$."],"answer": "A","explain": "$A = Fs = 100 \\cdot 20 = 2000\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một cần cẩu nâng vật khối lượng $200\\ \\text{kg}$ lên cao $10\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$). Công tối thiểu mà cần cẩu phải thực hiện bằng","options": ["A. $20000\\ \\text{J}$.","B. $2000\\ \\text{J}$.","C. $200\\ \\text{J}$.","D. $20\\ \\text{J}$."],"answer": "A","explain": "Lực nâng tối thiểu $F = P = mg = 2000\\ \\text{N}$. $A = Fh = 2000 \\cdot 10 = 20000\\ \\text{J}$.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Góc giữa lực kéo và hướng dịch chuyển là $180^\\circ$ thì $A = -Fs$.","b) Lực ma sát nghỉ không sinh công vì điểm đặt lực không dịch chuyển.","c) Khi nâng vật lên đều, công của lực nâng có độ lớn bằng $mgh$.","d) Đơn vị oát (W) dùng để đo công cơ học."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $\\cos 180^\\circ = -1$ nên $A = -Fs$. b) Đúng: $s = 0$ tại điểm đặt lực nên $A = 0$. c) Đúng: $F = mg$ cùng hướng dịch chuyển, $A = mgh$. d) Sai: oát là đơn vị công suất, công đo bằng jun.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $2\\ \\text{kg}$ được kéo trên mặt ngang bằng lực $F = 10\\ \\text{N}$ hợp với phương ngang góc $30^\\circ$, đi được $s = 6\\ \\text{m}$ (lấy $\\cos 30^\\circ \\approx 0,87$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công của lực kéo xấp xỉ $52\\ \\text{J}$.","b) Nếu lực kéo theo phương ngang ($\\alpha = 0^\\circ$) thì công bằng $60\\ \\text{J}$.","c) Công của phản lực của mặt đường bằng 0.","d) Công của trọng lực bằng $120\\ \\text{J}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $A = 10 \\cdot 6 \\cdot 0,87 \\approx 52\\ \\text{J}$. b) Đúng: $A = 10 \\cdot 6 = 60\\ \\text{J}$. c) Đúng: phản lực vuông góc hướng dịch chuyển. d) Sai: trọng lực vuông góc hướng dịch chuyển nên $A_P = 0$.","points": 1},{"type": "short","level": "VD","q": "Vật khối lượng $1\\ \\text{kg}$ rơi tự do từ độ cao $20\\ \\text{m}$ xuống đất (lấy $g = 10\\ \\text{m/s}^2$). Công của trọng lực bằng bao nhiêu jun? (chỉ điền số)","answer": "200","explain": "$A_P = mgh = 1 \\cdot 10 \\cdot 20 = 200\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật trượt từ đỉnh mặt phẳng nghiêng cao $3\\ \\text{m}$, dài $6\\ \\text{m}$ xuống chân dốc. Khối lượng vật $4\\ \\text{kg}$, lấy $g = 10\\ \\text{m/s}^2$. Công của trọng lực bằng bao nhiêu jun? (chỉ điền số)","answer": "120","explain": "Công của trọng lực chỉ phụ thuộc độ cao: $A_P = mgh = 4 \\cdot 10 \\cdot 3 = 120\\ \\text{J}$, không phụ thuộc chiều dài mặt nghiêng.","points": 0.5}]},{"name": "Đề 4","questions": [{"type": "mcq","level": "NB","q": "Dạng năng lượng nào sau đây gắn với chuyển động của vật?","options": ["A. Động năng.","B. Thế năng đàn hồi.","C. Nhiệt năng.","D. Quang năng."],"answer": "A","explain": "Động năng là năng lượng mà vật có được do chuyển động.","points": 0.25},{"type": "mcq","level": "NB","q": "Một lò xo bị nén rồi được thả để trở về vị trí ban đầu. Công của lực đàn hồi trong cả quá trình bằng","options": ["A. $0$.","B. một số dương.","C. một số âm.","D. $k(\\Delta l)^2$."],"answer": "A","explain": "Lực đàn hồi là lực thế; công của lực thế trên đường đi kín bằng 0.","points": 0.25},{"type": "mcq","level": "NB","q": "Với $F$ và $s$ cho trước, công của lực đạt giá trị cực đại khi","options": ["A. $\\alpha = 0^\\circ$.","B. $\\alpha = 90^\\circ$.","C. $\\alpha = 180^\\circ$.","D. $\\alpha = 60^\\circ$."],"answer": "A","explain": "$A = Fs\\cos\\alpha$ cực đại khi $\\cos\\alpha$ cực đại, tức $\\alpha = 0^\\circ$ ($\\cos 0^\\circ = 1$).","points": 0.25},{"type": "mcq","level": "TH","q": "Lực $F = 30\\ \\text{N}$ tác dụng lên vật, góc giữa lực và hướng dịch chuyển $\\alpha = 60^\\circ$, quãng đường $s = 4\\ \\text{m}$. Công của lực bằng","options": ["A. $60\\ \\text{J}$.","B. $120\\ \\text{J}$.","C. $30\\ \\text{J}$.","D. $104\\ \\text{J}$."],"answer": "A","explain": "$A = 30 \\cdot 4 \\cdot \\cos 60^\\circ = 120 \\cdot 0,5 = 60\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật được ném thẳng đứng lên cao. Trong quá trình vật đi lên, công của trọng lực là","options": ["A. công cản.","B. công phát động.","C. bằng 0.","D. tăng dần theo thời gian."],"answer": "A","explain": "Trọng lực ngược hướng chuyển động đi lên ($\\alpha = 180^\\circ$) nên $A_P \\lt 0$: công cản.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người đẩy xe với lực $50\\ \\text{N}$ theo phương ngang, xe đi $12\\ \\text{m}$ (bỏ qua ma sát). Công của người thực hiện bằng","options": ["A. $600\\ \\text{J}$.","B. $62\\ \\text{J}$.","C. $4,2\\ \\text{J}$.","D. $0$."],"answer": "A","explain": "$A = Fs = 50 \\cdot 12 = 600\\ \\text{J}$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công là đại lượng vô hướng.","b) Khi $\\alpha$ nhọn, lực sinh công phát động.","c) Công của hợp lực bằng tổng công của các lực thành phần.","d) Công của trọng lực phụ thuộc vào dạng quỹ đạo của vật."],"answer": ["T","T","T","F"],"explain": "a) Đúng: công chỉ có độ lớn và dấu, không có hướng. b) Đúng: $\\alpha$ nhọn thì $\\cos\\alpha \\gt 0$, $A \\gt 0$. c) Đúng: $A_{hl} = A_1 + A_2 + \\dots$. d) Sai: trọng lực là lực thế, công chỉ phụ thuộc điểm đầu và điểm cuối.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $0,5\\ \\text{kg}$ được kéo trượt đều trên mặt ngang một đoạn $s = 8\\ \\text{m}$ bởi lực $F = 5\\ \\text{N}$ cùng hướng chuyển động; hệ số ma sát $\\mu = 0,1$; lấy $g = 10\\ \\text{m/s}^2$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công của lực kéo bằng $40\\ \\text{J}$.","b) Lực ma sát trượt có độ lớn $0,5\\ \\text{N}$.","c) Công của lực ma sát bằng $-4\\ \\text{J}$.","d) Tổng công của các lực theo phương ngang bằng $36\\ \\text{J}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $A_F = 5 \\cdot 8 = 40\\ \\text{J}$. b) Đúng: $F_{ms} = \\mu mg = 0,1 \\cdot 0,5 \\cdot 10 = 0,5\\ \\text{N}$. c) Đúng: $A_{ms} = -0,5 \\cdot 8 = -4\\ \\text{J}$. d) Sai: vật trượt đều nên $F = F_{ms}$, tổng công theo phương ngang bằng 0.","points": 1},{"type": "short","level": "VDC","q": "Lực $F = 25\\ \\text{N}$ hợp với phương ngang góc $37^\\circ$ ($\\cos 37^\\circ \\approx 0,8$) kéo vật đi $10\\ \\text{m}$ trên mặt ngang. Tính công của lực kéo (đơn vị jun, chỉ điền số).","answer": "200","explain": "$A = Fs\\cos\\alpha = 25 \\cdot 10 \\cdot 0,8 = 200\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một ô tô khối lượng $1500\\ \\text{kg}$ lên dốc nghiêng $30^\\circ$ dài $100\\ \\text{m}$ với tốc độ không đổi; lực ma sát bằng $0,1$ trọng lượng của xe; lấy $g = 10\\ \\text{m/s}^2$. Tính công của lực kéo động cơ (đơn vị kilôjun, chỉ điền số).","answer": "900","explain": "Lên dốc đều: $F_{kéo} = mg\\sin 30^\\circ + 0,1mg = 1500 \\cdot 10 \\cdot 0,5 + 1500 = 9000\\ \\text{N}$. $A = 9000 \\cdot 100 = 900000\\ \\text{J} = 900\\ \\text{kJ}$.","points": 0.5}]},{"name": "Đề 5","questions": [{"type": "mcq","level": "NB","q": "Thế năng trọng trường của một vật phụ thuộc vào","options": ["A. vị trí mốc tính thế năng.","B. tốc độ chuyển động của vật.","C. quãng đường vật đã đi.","D. thời gian vật chuyển động."],"answer": "A","explain": "Thế năng trọng trường $W_t = mgh$ với $h$ đo từ mốc thế năng; đổi mốc thì $h$ đổi nên thế năng đổi.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi lực tác dụng lên vật tăng gấp đôi, quãng đường dịch chuyển và góc $\\alpha$ không đổi thì công của lực","options": ["A. tăng gấp đôi.","B. giảm một nửa.","C. không đổi.","D. tăng gấp bốn."],"answer": "A","explain": "$A = Fs\\cos\\alpha$ tỉ lệ thuận với $F$ nên $F$ tăng gấp đôi thì $A$ tăng gấp đôi.","points": 0.25},{"type": "mcq","level": "NB","q": "Đơn vị nào sau đây tương đương với jun?","options": ["A. $\\text{N} \\cdot \\text{m}$.","B. $\\text{N} / \\text{m}$.","C. $\\text{kg} \\cdot \\text{m}$.","D. $\\text{m} / \\text{s}$."],"answer": "A","explain": "$1\\ \\text{J} = 1\\ \\text{N} \\cdot 1\\ \\text{m}$ nên $\\text{N} \\cdot \\text{m}$ tương đương với jun.","points": 0.25},{"type": "mcq","level": "TH","q": "Hai lực có cùng độ lớn $F$ tác dụng lên hai vật; vật 1 dịch chuyển $s$, vật 2 dịch chuyển $2s$ cùng hướng với lực. So sánh công $A_1$, $A_2$ của hai lực:","options": ["A. $A_2 = 2A_1$.","B. $A_1 = 2A_2$.","C. $A_1 = A_2$.","D. $A_2 = 4A_1$."],"answer": "A","explain": "$A_1 = Fs$, $A_2 = F \\cdot 2s = 2Fs = 2A_1$.","points": 0.25},{"type": "mcq","level": "TH","q": "Vật khối lượng $2\\ \\text{kg}$ trượt không ma sát từ độ cao $5\\ \\text{m}$ xuống mặt đất (lấy $g = 10\\ \\text{m/s}^2$). Công của trọng lực bằng","options": ["A. $100\\ \\text{J}$.","B. $50\\ \\text{J}$.","C. $20\\ \\text{J}$.","D. $10\\ \\text{J}$."],"answer": "A","explain": "$A_P = mgh = 2 \\cdot 10 \\cdot 5 = 100\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Lực $F$ không đổi tác dụng lên vật; góc $\\alpha$ tăng dần từ $0^\\circ$ đến $90^\\circ$ thì công của lực","options": ["A. giảm dần về 0.","B. tăng dần.","C. không đổi.","D. đổi dấu từ âm sang dương."],"answer": "A","explain": "$\\cos\\alpha$ giảm từ 1 về 0 khi $\\alpha$ tăng từ $0^\\circ$ đến $90^\\circ$ nên $A = Fs\\cos\\alpha$ giảm dần về 0.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Mọi vật đều có năng lượng.","b) Công là số đo phần năng lượng mà vật trao đổi trong quá trình thực hiện công.","c) Vật đứng yên trên mặt đất luôn có năng lượng bằng 0.","d) Năng lượng có thể chuyển hóa từ dạng này sang dạng khác."],"answer": ["T","T","F","T"],"explain": "a) Đúng: mọi vật đều mang năng lượng dưới dạng nào đó. b) Đúng: công đo phần năng lượng được chuyển hóa. c) Sai: vật đứng yên vẫn có thế năng (tùy mốc), nội năng. d) Đúng: ví dụ động năng chuyển thành nhiệt năng khi có ma sát.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $3\\ \\text{kg}$ rơi từ độ cao $h = 4\\ \\text{m}$ xuống đất (lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công của trọng lực bằng $120\\ \\text{J}$.","b) Công của trọng lực không phụ thuộc dạng đường đi của vật.","c) Nếu vật trượt theo mặt phẳng nghiêng có cùng độ cao thì công của trọng lực nhỏ hơn khi rơi thẳng đứng.","d) Nếu vật rơi xuống rồi nảy trở lại đúng độ cao ban đầu thì tổng công của trọng lực bằng 0."],"answer": ["T","T","F","T"],"explain": "a) Đúng: $A_P = 3 \\cdot 10 \\cdot 4 = 120\\ \\text{J}$. b) Đúng: trọng lực là lực thế. c) Sai: công trọng lực chỉ phụ thuộc độ cao, hai trường hợp bằng nhau. d) Đúng: lúc xuống $A = mgh$, lúc lên $A = -mgh$, tổng bằng 0.","points": 1},{"type": "short","level": "VDC","q": "Một lực $40\\ \\text{N}$ đẩy vật đi $15\\ \\text{m}$ theo hướng hợp với hướng dịch chuyển góc $120^\\circ$. Tính công của lực (đơn vị jun, chỉ điền số).","answer": "-300","explain": "$A = Fs\\cos 120^\\circ = 40 \\cdot 15 \\cdot (-0,5) = -300\\ \\text{J}$. Dấu âm cho biết đây là công cản.","points": 0.5},{"type": "short","level": "VDC","q": "Thang máy khối lượng $800\\ \\text{kg}$ đi lên đều $12\\ \\text{m}$ trong $20\\ \\text{s}$ (lấy $g = 10\\ \\text{m/s}^2$). Tính công của lực kéo động cơ (đơn vị kilôjun, chỉ điền số).","answer": "96","explain": "Đi lên đều nên $F_{kéo} = mg = 8000\\ \\text{N}$. $A = 8000 \\cdot 12 = 96000\\ \\text{J} = 96\\ \\text{kJ}$.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Công phát động có đặc điểm nào sau đây?","options": ["A. $A \\gt 0$.","B. $A \\lt 0$.","C. $A = 0$.","D. $A$ không xác định được."],"answer": "A","explain": "Công phát động là công dương ($A \\gt 0$), lực có thành phần cùng chiều chuyển động.","points": 0.25},{"type": "mcq","level": "NB","q": "Trong hệ SI, công và năng lượng có cùng đơn vị là","options": ["A. jun (J).","B. oát (W).","C. niutơn (N).","D. jun trên giây (J/s)."],"answer": "A","explain": "Cả công và năng lượng đều đo bằng jun (J). Oát là đơn vị công suất.","points": 0.25},{"type": "mcq","level": "NB","q": "Lực ma sát nghỉ tác dụng lên vật có sinh công không?","options": ["A. Không, vì điểm đặt của lực không dịch chuyển.","B. Có, và là công phát động.","C. Có, và là công cản.","D. Có, công bằng $F_{ms} \\cdot s$."],"answer": "A","explain": "Ma sát nghỉ tác dụng tại điểm tiếp xúc đứng yên tương đối nên điểm đặt lực không dịch chuyển, công bằng 0.","points": 0.25},{"type": "mcq","level": "TH","q": "Lực $F = 12\\ \\text{N}$ hợp với hướng dịch chuyển góc $37^\\circ$ ($\\cos 37^\\circ \\approx 0,8$), vật đi $s = 5\\ \\text{m}$. Công của lực bằng","options": ["A. $48\\ \\text{J}$.","B. $60\\ \\text{J}$.","C. $36\\ \\text{J}$.","D. $72\\ \\text{J}$."],"answer": "A","explain": "$A = 12 \\cdot 5 \\cdot 0,8 = 48\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật chuyển động tròn đều. Công của lực hướng tâm thực hiện trong một chu kì bằng","options": ["A. $0$.","B. $F_{ht} \\cdot 2\\pi R$.","C. $F_{ht} \\cdot R$.","D. một số dương."],"answer": "A","explain": "Lực hướng tâm luôn vuông góc với vận tốc nên công của nó luôn bằng 0.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người xách túi khối lượng $5\\ \\text{kg}$ đi ngang $20\\ \\text{m}$ trên mặt đường nằm ngang. Công của trọng lực tác dụng lên túi bằng","options": ["A. $0$.","B. $1000\\ \\text{J}$.","C. $100\\ \\text{J}$.","D. $4\\ \\text{J}$."],"answer": "A","explain": "Trọng lực vuông góc với hướng dịch chuyển ngang nên $A_P = 0$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Khi $\\alpha$ nhọn, lực sinh công phát động.","b) Khi $\\alpha$ tù, lực sinh công cản.","c) Công của hợp lực bằng tổng công của các lực thành phần.","d) Công của trọng lực phụ thuộc vào quỹ đạo chuyển động của vật."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $\\cos\\alpha \\gt 0$ nên $A \\gt 0$. b) Đúng: $\\cos\\alpha \\lt 0$ nên $A \\lt 0$. c) Đúng: $A_{hl} = \\sum A_i$. d) Sai: trọng lực là lực thế, công không phụ thuộc quỹ đạo.","points": 1},{"type": "truefalse","level": "VD","q": "Một vật khối lượng $4\\ \\text{kg}$ nằm trên mặt ngang, chịu lực kéo $F = 20\\ \\text{N}$ hợp với phương ngang góc $30^\\circ$ hướng lên, đi được $s = 5\\ \\text{m}$; hệ số ma sát $\\mu = 0,2$; lấy $g = 10\\ \\text{m/s}^2$, $\\sin 30^\\circ = 0,5$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công của lực kéo theo phương ngang xấp xỉ $87\\ \\text{J}$.","b) Phản lực của mặt đường có độ lớn $30\\ \\text{N}$.","c) Công của lực ma sát bằng $-30\\ \\text{J}$.","d) Công của trọng lực bằng $200\\ \\text{J}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $A = Fs\\cos 30^\\circ = 20 \\cdot 5 \\cdot 0,87 \\approx 87\\ \\text{J}$. b) Đúng: $N = mg - F\\sin 30^\\circ = 40 - 10 = 30\\ \\text{N}$. c) Đúng: $A_{ms} = -\\mu Ns = -0,2 \\cdot 30 \\cdot 5 = -30\\ \\text{J}$. d) Sai: trọng lực vuông góc hướng đi nên $A_P = 0$.","points": 1},{"type": "short","level": "VDC","q": "Cần cẩu nâng kiện hàng khối lượng $500\\ \\text{kg}$ lên cao $8\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$). Công tối thiểu của lực nâng bằng bao nhiêu kilôjun? (chỉ điền số)","answer": "40","explain": "$A = mgh = 500 \\cdot 10 \\cdot 8 = 40000\\ \\text{J} = 40\\ \\text{kJ}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật khối lượng $1\\ \\text{kg}$ trượt đều xuống mặt phẳng nghiêng góc $37^\\circ$ ($\\sin 37^\\circ \\approx 0,6$), quãng đường $10\\ \\text{m}$, lấy $g = 10\\ \\text{m/s}^2$. Tính độ lớn công của lực ma sát (đơn vị jun, chỉ điền số).","answer": "60","explain": "Trượt đều nên $F_{ms} = mg\\sin 37^\\circ = 1 \\cdot 10 \\cdot 0,6 = 6\\ \\text{N}$. $A_{ms} = -6 \\cdot 10 = -60\\ \\text{J}$, độ lớn bằng $60\\ \\text{J}$.","points": 0.5}]},{"name": "Đề 7","questions": [{"type": "mcq","level": "NB","q": "Năng lượng của nước chứa trong hồ trên cao chủ yếu thuộc dạng","options": ["A. thế năng trọng trường.","B. động năng.","C. nhiệt năng.","D. điện năng."],"answer": "A","explain": "Nước ở trên cao so với mốc thế năng có khả năng sinh công khi chảy xuống, đó là thế năng trọng trường.","points": 0.25},{"type": "mcq","level": "NB","q": "Công của lực $F$ khi vật dịch chuyển ngược hướng với lực ($\\alpha = 180^\\circ$) bằng","options": ["A. $A = -Fs$.","B. $A = Fs$.","C. $A = 0$.","D. $A = Fs/2$."],"answer": "A","explain": "$A = Fs\\cos 180^\\circ = Fs \\cdot (-1) = -Fs$.","points": 0.25},{"type": "mcq","level": "NB","q": "Đại lượng nào sau đây là đại lượng vô hướng?","options": ["A. Công cơ học.","B. Lực.","C. Vận tốc.","D. Gia tốc."],"answer": "A","explain": "Công chỉ có độ lớn và dấu, không có hướng nên là đại lượng vô hướng. Lực, vận tốc, gia tốc là vectơ.","points": 0.25},{"type": "mcq","level": "TH","q": "Vật khối lượng $10\\ \\text{kg}$ rơi $3\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$). Công của trọng lực bằng","options": ["A. $300\\ \\text{J}$.","B. $30\\ \\text{J}$.","C. $13\\ \\text{J}$.","D. $-300\\ \\text{J}$."],"answer": "A","explain": "$A_P = mgh = 10 \\cdot 10 \\cdot 3 = 300\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Lực kéo $F = 80\\ \\text{N}$ cùng chiều chuyển động làm vật đi $25\\ \\text{m}$. Công của lực kéo bằng","options": ["A. $2000\\ \\text{J}$.","B. $105\\ \\text{J}$.","C. $3,2\\ \\text{J}$.","D. $320\\ \\text{J}$."],"answer": "A","explain": "$A = Fs = 80 \\cdot 25 = 2000\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Khi quãng đường dịch chuyển tăng gấp 3 lần, lực và góc $\\alpha$ không đổi thì công của lực","options": ["A. tăng gấp 3 lần.","B. giảm 3 lần.","C. không đổi.","D. tăng gấp 9 lần."],"answer": "A","explain": "$A = Fs\\cos\\alpha$ tỉ lệ thuận với $s$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Jun là đơn vị của cả công và năng lượng.","b) Công thức $A = Fs$ chỉ đúng khi lực cùng hướng với dịch chuyển.","c) Công của lực cản làm tăng năng lượng của vật.","d) Vật chuyển động thẳng đều thì công của hợp lực tác dụng lên vật bằng 0."],"answer": ["T","T","F","T"],"explain": "a) Đúng: $1\\ \\text{J}$ dùng cho cả hai. b) Đúng: $A = Fs$ là trường hợp riêng $\\alpha = 0^\\circ$ của $A = Fs\\cos\\alpha$. c) Sai: công cản ($A \\lt 0$) làm giảm năng lượng của vật. d) Đúng: hợp lực bằng 0 nên công bằng 0.","points": 1},{"type": "truefalse","level": "VD","q": "Một đầu máy kéo toa xe bằng lực không đổi $F = 5000\\ \\text{N}$, toa xe đi $200\\ \\text{m}$ theo hướng của lực. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công của lực kéo bằng $10^6\\ \\text{J}$.","b) Đổi ra kilôjun được $1000\\ \\text{kJ}$.","c) Nếu lực kéo hợp với hướng đi góc $60^\\circ$ thì công chỉ còn một nửa.","d) Công của trọng lực tác dụng lên toa xe khác 0."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $A = 5000 \\cdot 200 = 10^6\\ \\text{J}$. b) Đúng: $10^6\\ \\text{J} = 1000\\ \\text{kJ}$. c) Đúng: nhân thêm $\\cos 60^\\circ = 0,5$. d) Sai: toa xe đi trên đường ngang, trọng lực vuông góc hướng đi nên công bằng 0.","points": 1},{"type": "short","level": "VDC","q": "Người ta dùng mặt phẳng nghiêng dài $4\\ \\text{m}$ để đưa vật khối lượng $50\\ \\text{kg}$ lên cao $1\\ \\text{m}$ (bỏ qua ma sát, lấy $g = 10\\ \\text{m/s}^2$). Lực kéo tối thiểu theo mặt nghiêng bằng bao nhiêu niutơn? (chỉ điền số)","answer": "125","explain": "Công của lực kéo bằng công nâng trực tiếp: $F \\cdot l = mgh$, suy ra $F = 50 \\cdot 10 \\cdot 1 / 4 = 125\\ \\text{N}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một vật được kéo trượt đều trên mặt ngang với tốc độ $2\\ \\text{m/s}$ bởi lực $F = 30\\ \\text{N}$ cùng hướng chuyển động. Tính công của lực $F$ trong $10\\ \\text{s}$ (đơn vị jun, chỉ điền số).","answer": "600","explain": "Quãng đường: $s = vt = 2 \\cdot 10 = 20\\ \\text{m}$. $A = Fs = 30 \\cdot 20 = 600\\ \\text{J}$.","points": 0.5}]},{"name": "Đề 8","questions": [{"type": "mcq","level": "NB","q": "Kí hiệu $\\alpha$ trong công thức $A = Fs\\cos\\alpha$ là","options": ["A. góc giữa vectơ lực và hướng dịch chuyển.","B. góc giữa hai lực tác dụng.","C. góc nghiêng của mặt phẳng.","D. góc quay của vật."],"answer": "A","explain": "$\\alpha$ là góc hợp bởi hướng của lực $F$ và hướng của độ dịch chuyển.","points": 0.25},{"type": "mcq","level": "NB","q": "Công của trọng lực khi vật chuyển động trên mặt phẳng ngang bằng","options": ["A. $0$.","B. $mgh$.","C. $-mgh$.","D. $mgs$."],"answer": "A","explain": "Trọng lực vuông góc với hướng dịch chuyển ngang ($\\alpha = 90^\\circ$) nên công bằng 0.","points": 0.25},{"type": "mcq","level": "TH","q": "Lực $F = 60\\ \\text{N}$ tác dụng lên vật, góc giữa lực và hướng dịch chuyển $\\alpha = 53^\\circ$ ($\\cos 53^\\circ \\approx 0,6$), quãng đường $s = 10\\ \\text{m}$. Công của lực bằng","options": ["A. $360\\ \\text{J}$.","B. $600\\ \\text{J}$.","C. $480\\ \\text{J}$.","D. $100\\ \\text{J}$."],"answer": "A","explain": "$A = 60 \\cdot 10 \\cdot 0,6 = 360\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Vật khối lượng $2\\ \\text{kg}$ được nâng đều lên cao $1,5\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$). Công của lực nâng bằng","options": ["A. $30\\ \\text{J}$.","B. $20\\ \\text{J}$.","C. $13\\ \\text{J}$.","D. $-30\\ \\text{J}$."],"answer": "A","explain": "Nâng đều nên $F_{nâng} = mg = 20\\ \\text{N}$ cùng hướng dịch chuyển: $A = 20 \\cdot 1,5 = 30\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "So sánh công của trọng lực trong hai trường hợp: vật rơi thẳng đứng và vật trượt không ma sát theo mặt phẳng nghiêng, cùng độ cao $h$.","options": ["A. Hai công bằng nhau.","B. Công khi rơi thẳng đứng lớn hơn.","C. Công khi trượt nghiêng lớn hơn.","D. Công khi trượt nghiêng bằng 0."],"answer": "A","explain": "Trọng lực là lực thế, công chỉ phụ thuộc độ cao điểm đầu và điểm cuối nên hai trường hợp bằng nhau ($A_P = mgh$).","points": 0.25},{"type": "mcq","level": "VD","q": "Một lực $50\\ \\text{N}$ tác dụng lên vật trong $10\\ \\text{s}$ nhưng vật không dịch chuyển. Công của lực bằng","options": ["A. $0$.","B. $500\\ \\text{J}$.","C. $5\\ \\text{J}$.","D. không xác định được."],"answer": "A","explain": "$s = 0$ nên $A = Fs\\cos\\alpha = 0$ dù lực lớn và thời gian dài.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Năng lượng đặc trưng cho khả năng thực hiện công của vật.","b) Công thức $A = Fs\\cos\\alpha$ áp dụng cho lực không đổi.","c) Khi $s = 0$ thì $A = 0$ dù $F$ lớn đến đâu.","d) Lực càng lớn thì công của lực càng lớn."],"answer": ["T","T","T","F"],"explain": "a) Đúng (định nghĩa SGK). b) Đúng: với lực thay đổi phải dùng công thức tích phân. c) Đúng: không có dịch chuyển thì không có công cơ học. d) Sai: công còn phụ thuộc $s$ và $\\alpha$.","points": 1},{"type": "truefalse","level": "VDC","q": "Một vật chịu hai lực: $F_1 = 10\\ \\text{N}$ cùng chiều chuyển động và $F_2 = 4\\ \\text{N}$ ngược chiều chuyển động; vật đi $s = 5\\ \\text{m}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công của lực $F_1$ bằng $50\\ \\text{J}$.","b) Công của lực $F_2$ bằng $-20\\ \\text{J}$.","c) Công của hợp lực bằng $30\\ \\text{J}$.","d) Công của hợp lực bằng hiệu $A_1 - A_2$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $A_1 = 10 \\cdot 5 = 50\\ \\text{J}$. b) Đúng: $A_2 = -4 \\cdot 5 = -20\\ \\text{J}$. c) Đúng: $A_{hl} = 50 + (-20) = 30\\ \\text{J}$. d) Sai: công của hợp lực bằng TỔNG các công thành phần.","points": 1},{"type": "short","level": "VDC","q": "Một lực không đổi $F = 15\\ \\text{N}$ tác dụng lên vật; vật dịch chuyển $6\\ \\text{m}$ theo hướng vuông góc với lực. Công của lực bằng bao nhiêu jun? (chỉ điền số)","answer": "0","explain": "$\\alpha = 90^\\circ$ nên $A = Fs\\cos 90^\\circ = 0$.","points": 0.5},{"type": "short","level": "VDC","q": "Kéo một vật khối lượng $5\\ \\text{kg}$ trượt đều lên mặt phẳng nghiêng góc $30^\\circ$, dài $8\\ \\text{m}$; hệ số ma sát $\\mu = 0,2$; lấy $\\sqrt{3} \\approx 1,73$; $g = 10\\ \\text{m/s}^2$. Tính công của lực kéo theo mặt nghiêng (đơn vị jun, chỉ điền số, làm tròn đến hàng đơn vị).","answer": "269","explain": "$F_{kéo} = mg\\sin 30^\\circ + \\mu mg\\cos 30^\\circ = 25 + 0,2 \\cdot 50 \\cdot 0,866 = 33,66\\ \\text{N}$. $A = 33,66 \\cdot 8 \\approx 269\\ \\text{J}$.","points": 0.5}]},{"name": "Đề 9","questions": [{"type": "mcq","level": "NB","q": "Phát biểu nào sau đây là SAI?","options": ["A. Công là đại lượng vectơ.","B. Công có thể nhận giá trị âm.","C. Công có đơn vị là jun.","D. Công bằng 0 khi lực vuông góc với hướng dịch chuyển."],"answer": "A","explain": "Công là đại lượng vô hướng (chỉ có độ lớn và dấu), không phải vectơ. Các phát biểu còn lại đều đúng.","points": 0.25},{"type": "mcq","level": "NB","q": "Khi vật rơi tự do, trọng lực thực hiện","options": ["A. công phát động.","B. công cản.","C. công bằng 0.","D. công không đổi dấu."],"answer": "A","explain": "Trọng lực cùng hướng rơi ($\\alpha = 0^\\circ$) nên $A_P \\gt 0$: công phát động.","points": 0.25},{"type": "mcq","level": "TH","q": "Một vật khối lượng $m$ trượt trên mặt ngang rồi dừng lại do ma sát. Công của lực ma sát trượt là","options": ["A. công cản.","B. công phát động.","C. bằng 0.","D. bằng công của trọng lực."],"answer": "A","explain": "Ma sát trượt ngược chiều chuyển động nên sinh công âm: công cản, làm giảm năng lượng của vật.","points": 0.25},{"type": "mcq","level": "TH","q": "Lực $F = 45\\ \\text{N}$ ngược chiều chuyển động tác dụng lên vật đi được $s = 8\\ \\text{m}$. Công của lực bằng","options": ["A. $-360\\ \\text{J}$.","B. $360\\ \\text{J}$.","C. $53\\ \\text{J}$.","D. $0$."],"answer": "A","explain": "$A = -Fs = -45 \\cdot 8 = -360\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Lực $F = 20\\ \\text{N}$, góc $\\alpha = 120^\\circ$, quãng đường $s = 5\\ \\text{m}$. Độ lớn công của lực bằng","options": ["A. $50\\ \\text{J}$.","B. $100\\ \\text{J}$.","C. $20\\ \\text{J}$.","D. $87\\ \\text{J}$."],"answer": "A","explain": "$A = 20 \\cdot 5 \\cdot \\cos 120^\\circ = 100 \\cdot (-0,5) = -50\\ \\text{J}$, độ lớn bằng $50\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "VD","q": "Góc $\\alpha$ bằng bao nhiêu thì công của lực bằng một nửa giá trị cực đại (với $F$, $s$ cho trước)?","options": ["A. $60^\\circ$.","B. $30^\\circ$.","C. $90^\\circ$.","D. $120^\\circ$."],"answer": "A","explain": "$A = \\frac{1}{2}Fs$ khi $\\cos\\alpha = \\frac{1}{2}$, tức $\\alpha = 60^\\circ$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công phát động làm tăng khả năng sinh công của vật.","b) Công cản làm giảm năng lượng của vật.","c) Tổng công của các lực bằng công của hợp lực của chúng.","d) Đơn vị của công trong hệ SI là calo."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $A \\gt 0$ truyền năng lượng cho vật. b) Đúng: $A \\lt 0$ lấy bớt năng lượng của vật. c) Đúng: $A_{hl} = \\sum A_i$. d) Sai: đơn vị công là jun; calo là đơn vị năng lượng nhiệt ngoài hệ SI.","points": 1},{"type": "truefalse","level": "VDC","q": "Một vật được nâng từ mặt đất lên độ cao $h = 2\\ \\text{m}$ rồi hạ trở xuống mặt đất (khối lượng $1\\ \\text{kg}$, lấy $g = 10\\ \\text{m/s}^2$). Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Công của trọng lực lúc vật đi lên bằng $-20\\ \\text{J}$.","b) Công của trọng lực lúc vật đi xuống bằng $20\\ \\text{J}$.","c) Tổng công của trọng lực trong cả quá trình bằng 0.","d) Công của người nâng vật lúc đi lên bằng $-20\\ \\text{J}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $A = -mgh = -20\\ \\text{J}$. b) Đúng: $A = mgh = 20\\ \\text{J}$. c) Đúng: $-20 + 20 = 0$ (đường đi kín). d) Sai: lực nâng cùng hướng đi lên nên công dương $+20\\ \\text{J}$.","points": 1},{"type": "short","level": "VDC","q": "Lực $F = 100\\ \\text{N}$ kéo vật đi $12\\ \\text{m}$, góc giữa lực và hướng dịch chuyển $\\alpha = 45^\\circ$ ($\\cos 45^\\circ \\approx 0,71$). Tính công của lực (đơn vị jun, chỉ điền số, làm tròn đến hàng đơn vị).","answer": "852","explain": "$A = 100 \\cdot 12 \\cdot 0,71 = 852\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Một máy bơm đưa $200\\ \\text{kg}$ nước lên cao $15\\ \\text{m}$ (lấy $g = 10\\ \\text{m/s}^2$). Công có ích của máy bơm bằng bao nhiêu kilôjun? (chỉ điền số)","answer": "30","explain": "$A_{có ích} = mgh = 200 \\cdot 10 \\cdot 15 = 30000\\ \\text{J} = 30\\ \\text{kJ}$.","points": 0.5}]},{"name": "Đề 10","questions": [{"type": "mcq","level": "NB","q": "Năng lượng của gió và của dòng nước chảy thuộc dạng năng lượng nào?","options": ["A. Động năng.","B. Thế năng trọng trường.","C. Nhiệt năng.","D. Hóa năng."],"answer": "A","explain": "Gió và dòng nước đang chuyển động nên mang động năng.","points": 0.25},{"type": "mcq","level": "NB","q": "Công thức $A = P \\cdot h$ ($P$ là trọng lượng của vật) dùng để tính công của trọng lực khi","options": ["A. vật rơi thẳng đứng từ độ cao $h$.","B. vật chuyển động trên mặt ngang.","C. vật được ném xiên.","D. vật đứng yên."],"answer": "A","explain": "Khi vật rơi thẳng đứng đoạn $h$, trọng lực cùng hướng dịch chuyển nên $A_P = Ph$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một lực $50\\ \\text{N}$ tác dụng lên vật trong $10\\ \\text{s}$ nhưng vật không dịch chuyển. Công của lực bằng","options": ["A. $0$.","B. $500\\ \\text{J}$.","C. $5\\ \\text{J}$.","D. $5000\\ \\text{J}$."],"answer": "A","explain": "Không có dịch chuyển ($s = 0$) nên không có công cơ học.","points": 0.25},{"type": "mcq","level": "TH","q": "Kéo vật khối lượng $8\\ \\text{kg}$ trượt đều trên mặt ngang ($\\mu = 0,25$, lấy $g = 10\\ \\text{m/s}^2$) một đoạn $6\\ \\text{m}$. Công của lực kéo bằng","options": ["A. $120\\ \\text{J}$.","B. $480\\ \\text{J}$.","C. $20\\ \\text{J}$.","D. $80\\ \\text{J}$."],"answer": "A","explain": "Trượt đều nên $F_{kéo} = F_{ms} = \\mu mg = 0,25 \\cdot 80 = 20\\ \\text{N}$. $A = 20 \\cdot 6 = 120\\ \\text{J}$.","points": 0.25},{"type": "mcq","level": "TH","q": "Một người gánh nước đi trên đường bằng phẳng. Công của trọng lực tác dụng lên đôi thùng nước bằng","options": ["A. $0$.","B. $mgh$ với $h$ là độ cao vai người.","C. một số dương.","D. một số âm."],"answer": "A","explain": "Thùng nước dịch chuyển theo phương ngang, trọng lực vuông góc nên công bằng 0.","points": 0.25},{"type": "mcq","level": "VD","q": "Hai vật có khối lượng bằng nhau, cùng rơi từ độ cao $h$; vật 1 rơi thẳng đứng, vật 2 trượt không ma sát theo mặt nghiêng. So sánh công của trọng lực:","options": ["A. $A_1 = A_2 = mgh$.","B. $A_1 \\gt A_2$.","C. $A_1 \\lt A_2$.","D. $A_2 = 0$."],"answer": "A","explain": "Công trọng lực chỉ phụ thuộc độ cao: cả hai đều bằng $mgh$.","points": 0.25},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các khẳng định sau:","statements": ["a) $1\\ \\text{J} = 1\\ \\text{N} \\cdot 1\\ \\text{m}$.","b) Công của lực đàn hồi trên đường đi kín bằng 0.","c) Khi nâng vật lên đều, công của lực nâng có độ lớn bằng $mgh$.","d) Lực ma sát nghỉ luôn sinh công cản."],"answer": ["T","T","T","F"],"explain": "a) Đúng (định nghĩa jun). b) Đúng: lực đàn hồi là lực thế. c) Đúng: $F = mg$ cùng hướng dịch chuyển. d) Sai: ma sát nghỉ không sinh công vì điểm đặt không dịch chuyển.","points": 1},{"type": "truefalse","level": "VDC","q": "Một xe khối lượng $1200\\ \\text{kg}$ chuyển động đều lên dốc nghiêng $30^\\circ$, lực ma sát $600\\ \\text{N}$ (lấy $g = 10\\ \\text{m/s}^2$), quãng đường $50\\ \\text{m}$. Xét tính đúng, sai của các khẳng định sau:","statements": ["a) Thành phần trọng lực dọc theo mặt dốc có độ lớn $6000\\ \\text{N}$.","b) Lực kéo của động cơ bằng $6600\\ \\text{N}$.","c) Công của lực kéo bằng $330000\\ \\text{J}$.","d) Công của trọng lực bằng $-330000\\ \\text{J}$."],"answer": ["T","T","T","F"],"explain": "a) Đúng: $mg\\sin 30^\\circ = 12000 \\cdot 0,5 = 6000\\ \\text{N}$. b) Đúng: lên đều nên $F_{kéo} = 6000 + 600 = 6600\\ \\text{N}$. c) Đúng: $A = 6600 \\cdot 50 = 330000\\ \\text{J}$. d) Sai: $A_P = -mg\\sin 30^\\circ \\cdot s = -300000\\ \\text{J}$.","points": 1},{"type": "short","level": "VDC","q": "Một vật khối lượng $3\\ \\text{kg}$ trượt không vận tốc đầu từ đỉnh dốc cao $2\\ \\text{m}$ xuống chân dốc (bỏ qua ma sát, lấy $g = 10\\ \\text{m/s}^2$). Công của trọng lực bằng bao nhiêu jun? (chỉ điền số)","answer": "60","explain": "$A_P = mgh = 3 \\cdot 10 \\cdot 2 = 60\\ \\text{J}$.","points": 0.5},{"type": "short","level": "VDC","q": "Hai người cùng kéo một xe: người thứ nhất dùng lực $60\\ \\text{N}$ cùng chiều chuyển động, người thứ hai dùng lực $40\\ \\text{N}$ hợp với hướng chuyển động góc $60^\\circ$. Xe đi $20\\ \\text{m}$. Tổng công hai người thực hiện bằng bao nhiêu jun? (chỉ điền số)","answer": "1600","explain": "$A_1 = 60 \\cdot 20 = 1200\\ \\text{J}$; $A_2 = 40 \\cdot 20 \\cdot \\cos 60^\\circ = 400\\ \\text{J}$. Tổng: $1600\\ \\text{J}$.","points": 0.5}]}]}
