 góc ném bằng 30 độ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tầm xa cực đại khi góc ném bằng 45 độ.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật ($v_0 = 15$ m/s, $a = 2$ m/s vuông) sau 4 s có vận tốc 23 m/s.", "b) Độ dịch chuyển của vật trên sau 4 s là 76 m.", "c) Xe chạy 30 m/s phanh với $a = -6$ m/s vuông thì quãng đường phanh là 75 m.", "d) Thời gian để xe trên dừng hẳn là 6 s."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $t = 5$ s.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có $v_0 = 9$ m/s, $a = 6$ m/s vuông. Sau 2 s, độ dịch chuyển của vật là bao nhiêu m? (ghi số)", "answer": "30", "explain": "$d = 9 \\times 2 + \\frac{1}{2} \\times 6 \\times 2^2 = 18 + 12 = 30$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật có $v_0 = 30$ m/s, khi dừng lại ($v = 0$) thì độ dịch chuyển là 75 m. Gia tốc của vật là bao nhiêu m/s vuông? (ghi số)", "answer": "-6", "explain": "$0 - 900 = 2 \\times a \\times 75$, suy ra $a = -6$ m/s vuông.", "points": 0.5}]},
{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật đi rồi quay trở lại đúng vị trí xuất phát. Độ dịch chuyển của vật bằng", "options": ["A. 0.", "B. quãng đường đã đi.", "C. hai lần quãng đường đã đi.", "D. một nửa quãng đường đã đi."], "answer": "A", "explain": "Vị trí đầu trùng vị trí cuối nên độ dịch chuyển bằng 0.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tốc độ tức thời của xe được đo bằng dụng cụ nào?", "options": ["A. Tốc kế.", "B. Thước dây.", "C. Đồng hồ bấm giây.", "D. Cân đồng hồ."], "answer": "A", "explain": "Tốc kế đo tốc độ tức thời của xe.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vận động viên chạy một vòng sân 400 m rồi về đúng vạch xuất phát. Độ dịch chuyển của vận động viên là", "options": ["A. 0.", "B. 400 m.", "C. 800 m.", "D. 200 m."], "answer": "A", "explain": "Vị trí đầu trùng vị trí cuối nên độ dịch chuyển bằng 0.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vận động viên trên hoàn thành vòng chạy trong 80 s. Tốc độ trung bình của vận động viên là", "options": ["A. 5 m/s.", "B. 0.", "C. 400 m/s.", "D. 80 m/s."], "answer": "A", "explain": "$v_{tb} = \\frac{400}{80} = 5$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật được ném ngang với $v_0 = 30$ m/s từ độ cao 80 m (lấy $g = 10$ m/s vuông, bỏ qua sức cản không khí). Thời gian vật chạm đất là", "options": ["A. 4 s.", "B. 8 s.", "C. 80 s.", "D. 16 s."], "answer": "A", "explain": "$t = \\sqrt{\\frac{2 \\times 80}{10}} = 4$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tầm xa của vật trong tình huống trên là", "options": ["A. 120 m.", "B. 240 m.", "C. 30 m.", "D. 80 m."], "answer": "A", "explain": "$L = 30 \\times 4 = 120$ m.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật quay về vị trí xuất phát thì độ dịch chuyển bằng 0.", "b) Tốc kế đo tốc độ tức thời.", "c) Độ dịch chuyển là đại lượng vectơ.", "d) Quãng đường là đại lượng vectơ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quãng đường là đại lượng vô hướng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật ném ngang ($v_0 = 30$ m/s, $h = 80$ m) chạm đất sau 4 s.", "b) Tầm xa của vật trên là 120 m.", "c) Theo phương ngang, vận tốc của vật không đổi.", "d) Theo phương thẳng đứng, vận tốc của vật không đổi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: theo phương thẳng đứng vật rơi tự do nên $v_y = gt$ tăng dần.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật được ném ngang từ độ cao 80 m (lấy $g = 10$ m/s vuông). Thành phần vận tốc theo phương thẳng đứng khi chạm đất là bao nhiêu m/s? (ghi số)", "answer": "40", "explain": "$t = 4$ s; $v_y = gt = 10 \\times 4 = 40$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vật trên được ném ngang với $v_0 = 30$ m/s, khi chạm đất $v_y = 40$ m/s. Độ lớn vận tốc khi chạm đất là bao nhiêu m/s? (ghi số)", "answer": "50", "explain": "$v = \\sqrt{30^2 + 40^2} = 50$ m/s.", "points": 0.5}]},
{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật chuyển động nhanh dần đều thì gia tốc và vận tốc", "options": ["A. cùng dấu với nhau.", "B. trái dấu nhau.", "C. đều bằng 0.", "D. không liên quan đến nhau."], "answer": "A", "explain": "Nhanh dần: $a$ cùng dấu với $v$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một vật chuyển động chậm dần đều thì gia tốc và vận tốc", "options": ["A. trái dấu nhau.", "B. cùng dấu với nhau.", "C. đều bằng 0.", "D. đều không đổi dấu."], "answer": "A", "explain": "Chậm dần: $a$ trái dấu với $v$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có $v_0 = 5$ m/s, $a = -2$ m/s vuông (ngược chiều chuyển động). Sau 5 s, vận tốc của vật là", "options": ["A. -5 m/s.", "B. 15 m/s.", "C. 5 m/s.", "D. 0."], "answer": "A", "explain": "$v = 5 - 2 \\times 5 = -5$ m/s (vật đã dừng rồi đổi chiều).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong tình huống trên, sau bao lâu thì vật dừng lại?", "options": ["A. 2,5 s.", "B. 5 s.", "C. 10 s.", "D. 0,5 s."], "answer": "A", "explain": "$0 = 5 - 2t$, suy ra $t = 2,5$ s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Thả một vật rơi tự do từ độ cao 125 m (lấy $g = 10$ m/s vuông). Thời gian vật chạm đất là", "options": ["A. 5 s.", "B. 12,5 s.", "C. 125 s.", "D. 25 s."], "answer": "A", "explain": "$t = \\sqrt{\\frac{2 \\times 125}{10}} = 5$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vận tốc của vật khi chạm đất trong tình huống trên là", "options": ["A. 50 m/s.", "B. 125 m/s.", "C. 25 m/s.", "D. 5 m/s."], "answer": "A", "explain": "$v = 10 \\times 5 = 50$ m/s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhanh dần đều thì $a$ cùng dấu với $v$.", "b) Chậm dần đều thì $a$ trái dấu với $v$.", "c) Rơi tự do là chuyển động thẳng nhanh dần đều.", "d) Gia tốc rơi tự do phụ thuộc vào khối lượng vật."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $g$ không phụ thuộc khối lượng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật ($v_0 = 5$ m/s, $a = -2$ m/s vuông) sau 5 s có vận tốc -5 m/s.", "b) Vật trên dừng lại sau 2,5 s.", "c) Vật thả từ 125 m ($g = 10$ m/s vuông) chạm đất sau 5 s.", "d) Vận tốc của vật trên khi chạm đất là 25 m/s."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $v = 50$ m/s.", "points": 1}, {"type": "short", "level": "VD", "q": "Một hòn sỏi rơi tự do từ vách núi cao 45 m (lấy $g = 10$ m/s vuông, bỏ qua sức cản của không khí). Thời gian hòn sỏi chạm đất là bao nhiêu s? (ghi số)", "answer": "3", "explain": "$t = \\sqrt{\\frac{2 \\times 45}{10}} = 3$ s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Quãng đường vật rơi được trong giây thứ năm (lấy $g = 10$ m/s vuông) là bao nhiêu m? (ghi số)", "answer": "45", "explain": "Tỉ lệ 1 : 3 : 5 : 7 : 9 nên quãng đường giây thứ năm là $9 \\times 5 = 45$ m.", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Khi bài toán cho $v_0, v, d$ mà không cho biết thời gian $t$, ta nên dùng công thức nào?", "options": ["A. $v^2 - v_0^2 = 2ad$.", "B. $v = v_0 + at$.", "C. $d = v_0t + \\frac{1}{2}at^2$.", "D. $v_{tb} = \\frac{s}{t}$."], "answer": "A", "explain": "Công thức $v^2 - v_0^2 = 2ad$ không chứa $t$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Diện tích hình giới hạn bởi đồ thị vận tốc – thời gian với trục thời gian cho biết", "options": ["A. độ dịch chuyển của vật.", "B. gia tốc của vật.", "C. vận tốc của vật.", "D. thời gian của vật."], "answer": "A", "explain": "Diện tích dưới đồ thị $v$ – $t$ bằng độ dịch chuyển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đồ thị độ dịch chuyển – thời gian của một vật là một đường nằm ngang. Vật đang", "options": ["A. đứng yên.", "B. chuyển động thẳng đều.", "C. chuyển động nhanh dần đều.", "D. chuyển động chậm dần đều."], "answer": "A", "explain": "Đồ thị nằm ngang: $d$ không đổi theo $t$ nên vật đứng yên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đồ thị độ dịch chuyển – thời gian của một vật là đường thẳng dốc xuống. Vật đang chuyển động", "options": ["A. ngược chiều dương đã chọn.", "B. cùng chiều dương đã chọn.", "C. nhanh dần đều.", "D. đứng yên."], "answer": "A", "explain": "Dốc xuống: $d$ giảm theo $t$ nên vật chuyển động ngược chiều dương.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật được ném ngang với $v_0 = 10$ m/s từ độ cao 5 m (lấy $g = 10$ m/s vuông, bỏ qua sức cản không khí). Thời gian vật chạm đất là", "options": ["A. 1 s.", "B. 5 s.", "C. 0,5 s.", "D. 10 s."], "answer": "A", "explain": "$t = \\sqrt{\\frac{2 \\times 5}{10}} = 1$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tầm xa của vật trong tình huống trên là", "options": ["A. 10 m.", "B. 5 m.", "C. 100 m.", "D. 1 m."], "answer": "A", "explain": "$L = 10 \\times 1 = 10$ m.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Khi không biết $t$, ta dùng $v^2 - v_0^2 = 2ad$.", "b) Diện tích dưới đồ thị $v$ – $t$ là độ dịch chuyển.", "c) Đồ thị $d$ – $t$ nằm ngang nghĩa là vật đứng yên.", "d) Độ dốc của đồ thị $d$ – $t$ là gia tốc."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: độ dốc của đồ thị $d$ – $t$ là vận tốc.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật ném ngang ($v_0 = 10$ m/s, $h = 5$ m) chạm đất sau 1 s.", "b) Tầm xa của vật trên là 10 m.", "c) Thành phần vận tốc theo phương thẳng đứng khi chạm đất là 10 m/s.", "d) Theo phương ngang, vận tốc của vật tăng dần."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng. c) Đúng: $v_y = 10 \\times 1 = 10$ m/s. d) Sai: theo phương ngang vật chuyển động thẳng đều nên $v_x = v_0$ không đổi.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật được ném ngang từ độ cao 5 m (lấy $g = 10$ m/s vuông). Thành phần vận tốc theo phương thẳng đứng khi chạm đất là bao nhiêu m/s? (ghi số)", "answer": "10", "explain": "$t = 1$ s; $v_y = 10 \\times 1 = 10$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật được ném ngang với $v_0 = 6$ m/s, khi chạm đất thành phần vận tốc theo phương thẳng đứng là 8 m/s. Độ lớn vận tốc khi chạm đất là bao nhiêu m/s? (ghi số)", "answer": "10", "explain": "$v = \\sqrt{6^2 + 8^2} = 10$ m/s.", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trong thực hành đo gia tốc rơi tự do, công thức tính $g$ từ số liệu đo được là", "options": ["A. $g = \\frac{2h}{t^2}$.", "B. $g = \\frac{h}{2t^2}$.", "C. $g = ht^2$.", "D. $g = \\frac{t^2}{2h}$."], "answer": "A", "explain": "Từ $h = \\frac{1}{2}gt^2$ suy ra $g = \\frac{2h}{t^2}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để kết quả đo gia tốc rơi tự do đáng tin cậy hơn, ta nên", "options": ["A. đo nhiều lần rồi lấy giá trị trung bình.", "B. chỉ đo một lần duy nhất.", "C. ước lượng bằng mắt thường.", "D. dùng vật càng nhẹ càng tốt."], "answer": "A", "explain": "Đo nhiều lần lấy trung bình giúp giảm sai số ngẫu nhiên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong thí nghiệm đo $g$, vật rơi từ độ cao $h = 0,2$ m trong thời gian $t = 0,2$ s. Gia tốc đo được là", "options": ["A. 10 m/s vuông.", "B. 5 m/s vuông.", "C. 1 m/s vuông.", "D. 20 m/s vuông."], "answer": "A", "explain": "$g = \\frac{2 \\times 0,2}{0,2^2} = \\frac{0,4}{0,04} = 10$ m/s vuông.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một xe đi được 72 km trong 2 giờ. Tốc độ trung bình của xe là", "options": ["A. 36 km/h.", "B. 144 km/h.", "C. 72 km/h.", "D. 2 km/h."], "answer": "A", "explain": "$v_{tb} = \\frac{72}{2} = 36$ km/h.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật khởi hành từ trạng thái đứng yên với $a = 8$ m/s vuông. Sau 5 s, độ dịch chuyển của vật là", "options": ["A. 100 m.", "B. 40 m.", "C. 200 m.", "D. 20 m."], "answer": "A", "explain": "$d = \\frac{1}{2} \\times 8 \\times 5^2 = 100$ m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vận tốc của vật sau 5 s trong tình huống trên là", "options": ["A. 40 m/s.", "B. 100 m/s.", "C. 20 m/s.", "D. 8 m/s."], "answer": "A", "explain": "$v = 0 + 8 \\times 5 = 40$ m/s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $g = \\frac{2h}{t^2}$.", "b) Nên đo nhiều lần rồi lấy trung bình.", "c) Dùng vật đặc, nặng giúp giảm ảnh hưởng của sức cản không khí.", "d) Đơn vị của gia tốc rơi tự do là m/s."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đơn vị của $g$ là m/s vuông.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $h = 0,2$ m, $t = 0,2$ s thì $g = 10$ m/s vuông.", "b) Xe đi 72 km trong 2 giờ thì tốc độ trung bình là 36 km/h.", "c) Vật ($v_0 = 0$, $a = 8$ m/s vuông) sau 5 s đi được 100 m.", "d) Vận tốc của vật trên sau 5 s là 20 m/s."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $v = 40$ m/s.", "points": 1}, {"type": "short", "level": "VD", "q": "Một xe đi được 72 km trong 2 giờ. Tốc độ trung bình của xe là bao nhiêu km/h? (ghi số)", "answer": "36", "explain": "$v_{tb} = \\frac{72}{2} = 36$ km/h.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật khởi hành từ trạng thái đứng yên với $a = 8$ m/s vuông. Sau 5 s, vận tốc của vật là bao nhiêu m/s? (ghi số)", "answer": "40", "explain": "$v = 0 + 8 \\times 5 = 40$ m/s.", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Đối với chuyển động ném xiên, tầm xa đạt cực đại khi góc ném bằng", "options": ["A. 45 độ.", "B. 30 độ.", "C. 60 độ.", "D. 90 độ."], "answer": "A", "explain": "Tầm xa $L = \\frac{v_0^2\\sin 2\\alpha}{g}$ cực đại khi $\\sin 2\\alpha = 1$, tức $\\alpha = 45$ độ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Độ cao cực đại của vật được ném xiên với góc $\\alpha$ và vận tốc đầu $v_0$ là", "options": ["A. $H = \\frac{v_0^2\\sin^2\\alpha}{2g}$.", "B. $H = \\frac{v_0^2\\sin\\alpha}{g}$.", "C. $H = v_0\\sin\\alpha$.", "D. $H = \\frac{v_0^2}{2g}$."], "answer": "A", "explain": "$H = \\frac{v_0^2\\sin^2\\alpha}{2g}$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một thang máy đi lên 30 m rồi đi xuống 10 m (chọn chiều dương hướng lên). Độ dịch chuyển của thang máy là", "options": ["A. 20 m.", "B. 40 m.", "C. -10 m.", "D. 30 m."], "answer": "A", "explain": "$d = 30 - 10 = 20$ m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quãng đường thang máy đã đi trong tình huống trên là", "options": ["A. 40 m.", "B. 20 m.", "C. 30 m.", "D. 10 m."], "answer": "A", "explain": "$s = 30 + 10 = 40$ m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có $v_0 = 20$ m/s, $a = -4$ m/s vuông (ngược chiều chuyển động). Sau 3 s, độ dịch chuyển của vật là", "options": ["A. 42 m.", "B. 60 m.", "C. 24 m.", "D. 6 m."], "answer": "A", "explain": "$d = 20 \\times 3 + \\frac{1}{2} \\times (-4) \\times 3^2 = 60 - 18 = 42$ m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vật trên sẽ dừng lại sau khi đi được quãng đường là", "options": ["A. 50 m.", "B. 42 m.", "C. 100 m.", "D. 20 m."], "answer": "A", "explain": "$0 - 400 = 2 \\times (-4) \\times d$, suy ra $d = 50$ m.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ném xiên đạt tầm xa cực đại khi góc ném bằng 45 độ.", "b) $H = \\frac{v_0^2\\sin^2\\alpha}{2g}$.", "c) Thang máy đi lên 30 m rồi xuống 10 m thì độ dịch chuyển là 20 m.", "d) Quãng đường thang máy đã đi là 20 m."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quãng đường là 40 m.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật ($v_0 = 20$ m/s, $a = -4$ m/s vuông) sau 3 s đi được 42 m.", "b) Vật trên dừng hẳn sau khi đi được 50 m.", "c) Vật trên dừng lại sau 5 s.", "d) Gia tốc của vật trên là dương."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: $t = \\frac{20}{4} = 5$ s. d) Sai: $a = -4$ m/s vuông.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có $v_0 = 20$ m/s, $a = -4$ m/s vuông (ngược chiều chuyển động). Sau 3 s, vận tốc của vật là bao nhiêu m/s? (ghi số)", "answer": "8", "explain": "$v = 20 - 4 \\times 3 = 8$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong tình huống trên, sau bao lâu thì vật dừng lại? (ghi số, đơn vị s)", "answer": "5", "explain": "$0 = 20 - 4t$, suy ra $t = 5$ s.", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Đồ thị gia tốc – thời gian của chuyển động thẳng biến đổi đều là", "options": ["A. một đường thẳng nằm ngang.", "B. một đường thẳng xiên.", "C. một đường parabol.", "D. một điểm duy nhất."], "answer": "A", "explain": "Gia tốc không đổi nên đồ thị $a$ – $t$ là đường nằm ngang.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi vật chuyển động thẳng đều, đường biểu diễn vận tốc theo thời gian có dạng", "options": ["A. đường thẳng song song với trục thời gian.", "B. đường thẳng xiên góc.", "C. đường parabol.", "D. đường cong lượn sóng."], "answer": "A", "explain": "Vận tốc không đổi nên đồ thị $v$ – $t$ là đường thẳng nằm ngang (song song với trục $t$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một xe chuyển động thẳng đều với vận tốc 20 m/s trong 30 s. Độ dịch chuyển của xe là", "options": ["A. 600 m.", "B. 20 m.", "C. 30 m.", "D. 50 m."], "answer": "A", "explain": "$d = vt = 20 \\times 30 = 600$ m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đồ thị độ dịch chuyển – thời gian của xe trên có độ dốc bằng", "options": ["A. 20 m/s.", "B. 600 m/s.", "C. 30 m/s.", "D. 0."], "answer": "A", "explain": "Độ dốc của đồ thị $d$ – $t$ bằng vận tốc 20 m/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật được ném ngang với $v_0 = 12$ m/s từ độ cao 20 m (lấy $g = 10$ m/s vuông, bỏ qua sức cản không khí). Thời gian vật chạm đất là", "options": ["A. 2 s.", "B. 12 s.", "C. 20 s.", "D. 4 s."], "answer": "A", "explain": "$t = \\sqrt{\\frac{2 \\times 20}{10}} = 2$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tầm xa của vật trong tình huống trên là", "options": ["A. 24 m.", "B. 48 m.", "C. 12 m.", "D. 20 m."], "answer": "A", "explain": "$L = 12 \\times 2 = 24$ m.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị $a$ – $t$ của chuyển động thẳng biến đổi đều là đường nằm ngang.", "b) Đồ thị $v$ – $t$ của chuyển động thẳng đều là đường nằm ngang.", "c) Độ dốc của đồ thị $d$ – $t$ là vận tốc.", "d) Đồ thị $d$ – $t$ của chuyển động thẳng đều là đường parabol."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: là đường thẳng xiên.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xe chạy thẳng đều 20 m/s trong 30 s thì độ dịch chuyển là 600 m.", "b) Độ dốc đồ thị $d$ – $t$ của xe trên là 20 m/s.", "c) Vật ném ngang ($v_0 = 12$ m/s, $h = 20$ m) chạm đất sau 2 s.", "d) Tầm xa của vật trên là 48 m."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $L = 24$ m.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật được ném ngang từ độ cao 20 m (lấy $g = 10$ m/s vuông). Thành phần vận tốc theo phương thẳng đứng khi chạm đất là bao nhiêu m/s? (ghi số)", "answer": "20", "explain": "$t = 2$ s; $v_y = 10 \\times 2 = 20$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vật trên được ném ngang với $v_0 = 9$ m/s, khi chạm đất $v_y = 12$ m/s. Độ lớn vận tốc khi chạm đất là bao nhiêu m/s? (ghi số)", "answer": "15", "explain": "$v = \\sqrt{9^2 + 12^2} = 15$ m/s.", "points": 0.5}]},
{"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Độ lớn của độ dịch chuyển bằng quãng đường khi vật", "options": ["A. đi thẳng một chiều, không đổi hướng.", "B. đi rồi quay lại vị trí cũ.", "C. chuyển động tròn một vòng.", "D. đi zigzag liên tục."], "answer": "A", "explain": "Đi thẳng một chiều không đổi hướng thì độ dài vectơ độ dịch chuyển bằng quãng đường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vận tốc trung bình được tính bằng công thức", "options": ["A. $v = \\frac{\\Delta d}{\\Delta t}$.", "B. $v = \\frac{s}{t^2}$.", "C. $v = at$.", "D. $v = \\frac{\\Delta t}{\\Delta d}$."], "answer": "A", "explain": "Vận tốc trung bình bằng độ dịch chuyển chia cho khoảng thời gian.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người đi 200 m về phía đông rồi đi tiếp 150 m về phía tây (chọn chiều dương hướng đông). Độ dịch chuyển của người đó là", "options": ["A. 50 m.", "B. 350 m.", "C. -50 m.", "D. 150 m."], "answer": "A", "explain": "$d = 200 - 150 = 50$ m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quãng đường người đó đã đi là", "options": ["A. 350 m.", "B. 50 m.", "C. 200 m.", "D. 150 m."], "answer": "A", "explain": "$s = 200 + 150 = 350$ m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật rơi tự do trong 6 s (lấy $g = 10$ m/s vuông). Quãng đường vật rơi được là", "options": ["A. 180 m.", "B. 60 m.", "C. 360 m.", "D. 30 m."], "answer": "A", "explain": "$h = \\frac{1}{2} \\times 10 \\times 6^2 = 180$ m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vận tốc của vật sau 6 s trong tình huống trên là", "options": ["A. 60 m/s.", "B. 180 m/s.", "C. 30 m/s.", "D. 6 m/s."], "answer": "A", "explain": "$v = 10 \\times 6 = 60$ m/s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật đi thẳng một chiều không đổi hướng thì độ lớn độ dịch chuyển bằng quãng đường.", "b) $v = \\frac{\\Delta d}{\\Delta t}$.", "c) Vật rơi tự do (thả nhẹ) có $v_0 = 0$.", "d) Quãng đường là đại lượng vectơ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quãng đường là đại lượng vô hướng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Người đi 200 m về đông rồi 150 m về tây thì độ dịch chuyển là 50 m.", "b) Quãng đường người đó đã đi là 350 m.", "c) Vật rơi tự do trong 6 s thì đi được 180 m.", "d) Vận tốc của vật trên sau 6 s là 30 m/s."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $v = 60$ m/s.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật rơi tự do trong 6 s (lấy $g = 10$ m/s vuông). Quãng đường vật rơi được là bao nhiêu m? (ghi số)", "answer": "180", "explain": "$h = \\frac{1}{2} \\times 10 \\times 6^2 = 180$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong tình huống trên, vận tốc của vật sau 6 s là bao nhiêu m/s? (ghi số)", "answer": "60", "explain": "$v = 10 \\times 6 = 60$ m/s.", "points": 0.5}]}]}
