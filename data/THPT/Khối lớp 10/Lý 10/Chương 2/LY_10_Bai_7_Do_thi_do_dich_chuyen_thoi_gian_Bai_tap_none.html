{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Đồ thị d – t của một vật đang đứng yên là", "options": ["A. một đường thẳng nằm ngang.", "B. một đường thẳng xiên.", "C. một đường parabol.", "D. một điểm duy nhất."], "answer": "A", "explain": "Vật đứng yên: d không đổi theo t nên đồ thị là đường nằm ngang.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đồ thị v – t của một vật đang đứng yên là", "options": ["A. đường thẳng trùng với trục thời gian (v = 0).", "B. đường thẳng nằm ngang ở v lớn hơn 0.", "C. đường thẳng xiên.", "D. đường parabol."], "answer": "A", "explain": "Vật đứng yên có v = 0 nên đồ thị v – t trùng với trục t.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đồ thị d – t của vật đi qua gốc tọa độ có nghĩa là", "options": ["A. lúc t = 0 vật ở gốc tọa độ.", "B. vật luôn đứng yên.", "C. vật chuyển động ngược chiều.", "D. vật có vận tốc bằng 0."], "answer": "A", "explain": "Điểm (0; 0) nghĩa là tại thời điểm t = 0, độ dịch chuyển d = 0 (vật ở gốc).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vận tốc âm được thể hiện trên đồ thị d – t bằng", "options": ["A. đường thẳng dốc xuống.", "B. đường thẳng dốc lên.", "C. đường nằm ngang.", "D. đường cong."], "answer": "A", "explain": "Vận tốc âm (ngược chiều dương) ứng với đường dốc xuống.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đồ thị d – t là đường thẳng đi qua (0 s; 0 m) và (12 s; 36 m). Vận tốc của vật là", "options": ["A. 3 m/s.", "B. 12 m/s.", "C. 36 m/s.", "D. 0,33 m/s."], "answer": "A", "explain": "v = 36/12 = 3 m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đồ thị d – t của xe A dốc hơn đồ thị d – t của xe B. So sánh tốc độ hai xe.", "options": ["A. Xe A nhanh hơn xe B.", "B. Xe B nhanh hơn xe A.", "C. Hai xe nhanh như nhau.", "D. Không so sánh được."], "answer": "A", "explain": "Độ dốc lớn hơn nghĩa là vận tốc lớn hơn nên xe A nhanh hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Giao điểm của đồ thị d – t của hai vật cho biết", "options": ["A. hai vật gặp nhau.", "B. hai vật cùng xuất phát.", "C. hai vật có cùng vận tốc.", "D. hai vật cùng đứng yên."], "answer": "A", "explain": "Tại giao điểm, hai vật cùng thời điểm và cùng vị trí nên gặp nhau.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Độ dốc của đồ thị d – t có đơn vị là", "options": ["A. m/s.", "B. m.", "C. s.", "D. m.s."], "answer": "A", "explain": "Độ dốc = Δd/Δt có đơn vị của vận tốc: m/s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đồ thị d – t là đường thẳng đi qua điểm (0 s; 20 m) và song song với trục thời gian. Vật đang", "options": ["A. đứng yên tại vị trí cách gốc 20 m.", "B. chuyển động đều với vận tốc lớn.", "C. chuyển động ngược chiều dương.", "D. chuyển động nhanh dần."], "answer": "A", "explain": "Đường nằm ngang: d = 20 m không đổi, vật đứng yên tại vị trí cách gốc 20 m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ đồ thị v – t là đường nằm ngang, muốn tính độ dịch chuyển ta tính", "options": ["A. diện tích hình chữ nhật dưới đường đồ thị.", "B. độ dốc của đường đồ thị.", "C. độ dài của đường đồ thị.", "D. khoảng cách từ đường đồ thị đến gốc tọa độ."], "answer": "A", "explain": "Diện tích dưới đồ thị v – t bằng độ dịch chuyển.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đồ thị d – t là đường thẳng đi qua (5 s; 25 m) và (15 s; 75 m). Vận tốc của vật là", "options": ["A. 5 m/s.", "B. 15 m/s.", "C. 50 m/s.", "D. 0,5 m/s."], "answer": "A", "explain": "v = (75 - 25)/(15 - 5) = 50/10 = 5 m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đồ thị d – t của một xe gồm hai đoạn: từ 0 đến 2 s đường dốc lên, từ 2 s đến 5 s đường nằm ngang. Mô tả chuyển động của xe.", "options": ["A. Xe chuyển động đều trong 2 s rồi đứng yên trong 3 s.", "B. Xe đứng yên trong 2 s rồi chuyển động trong 3 s.", "C. Xe chuyển động đều trong 5 s.", "D. Xe chuyển động ngược chiều trong 5 s."], "answer": "A", "explain": "Đoạn dốc lên: chuyển động đều; đoạn nằm ngang: đứng yên. Thời gian đứng yên: 5 - 2 = 3 s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giao điểm hai đồ thị d – t cho biết hai vật gặp nhau.", "b) Độ dốc của đồ thị d – t có đơn vị m/s.", "c) Đường nằm ngang trên đồ thị d – t nghĩa là vật đứng yên.", "d) Đường dốc lên nghĩa là vật chuyển động ngược chiều dương."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đường dốc lên là chuyển động theo chiều dương.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị d – t qua (5; 25) và (15; 75) cho vận tốc 5 m/s.", "b) Xe đi 2 s rồi dừng 3 s có đồ thị gồm đoạn dốc lên rồi đoạn nằm ngang.", "c) Muốn tính độ dịch chuyển từ đồ thị v – t ta tính diện tích.", "d) Đồ thị d – t nằm ngang tại d = 20 m nghĩa là vật ở gốc tọa độ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vật đứng yên tại vị trí cách gốc 20 m.", "points": 1}, {"type": "short", "level": "VD", "q": "Đồ thị d – t là đường thẳng đi qua (0 s; 0 m) và (20 s; 100 m). Vận tốc của vật là bao nhiêu m/s? (ghi số)", "answer": "5", "explain": "v = 100/20 = 5 m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đồ thị v – t nằm ngang tại v = 6 m/s từ t = 0 đến t = 5 s. Độ dịch chuyển là bao nhiêu m? (ghi số)", "answer": "30", "explain": "d = 6 x 5 = 30 m.", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trên đồ thị vận tốc – thời gian, trục hoành biểu diễn", "options": ["A. thời gian t.", "B. vận tốc v.", "C. độ dịch chuyển d.", "D. gia tốc a."], "answer": "A", "explain": "Mọi đồ thị theo thời gian đều có trục hoành là thời gian t.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trên đồ thị vận tốc – thời gian, trục tung biểu diễn", "options": ["A. vận tốc v.", "B. thời gian t.", "C. độ dịch chuyển d.", "D. quãng đường s."], "answer": "A", "explain": "Trục tung (trục đứng) của đồ thị v – t là vận tốc v.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên đồ thị d – t, đường dốc xuống càng dốc thì vật", "options": ["A. chuyển động ngược chiều dương càng nhanh.", "B. chuyển động theo chiều dương càng nhanh.", "C. đứng yên.", "D. chuyển động chậm dần."], "answer": "A", "explain": "Dốc xuống: ngược chiều dương; càng dốc: độ lớn vận tốc càng lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Diện tích hình chữ nhật giới hạn bởi đồ thị v – t với trục t được tính bằng", "options": ["A. v nhân với t.", "B. v chia cho t.", "C. v cộng với t.", "D. v trừ đi t."], "answer": "A", "explain": "Diện tích hình chữ nhật = cạnh đáy nhân chiều cao = t.v, chính là độ dịch chuyển.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đồ thị d – t là đường thẳng đi qua (0 s; 0 m) và (4 s; 60 m). Vận tốc của vật là", "options": ["A. 15 m/s.", "B. 4 m/s.", "C. 60 m/s.", "D. 240 m/s."], "answer": "A", "explain": "v = 60/4 = 15 m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đồ thị d – t của vật gồm đoạn đầu dốc lên rồi đoạn sau dốc xuống. Mô tả chuyển động của vật.", "options": ["A. Vật đi theo chiều dương rồi quay ngược trở lại.", "B. Vật đứng yên rồi chuyển động.", "C. Vật chuyển động đều mãi.", "D. Vật chuyển động nhanh dần đều."], "answer": "A", "explain": "Dốc lên: đi theo chiều dương; dốc xuống: quay ngược lại.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trục hoành của đồ thị v – t là thời gian.", "b) Trục tung của đồ thị v – t là vận tốc.", "c) Đường dốc xuống càng dốc thì vật đi ngược chiều dương càng nhanh.", "d) Diện tích dưới đồ thị v – t tính bằng v chia cho t."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: diện tích = v nhân với t.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị d – t qua (0; 0) và (4; 60) cho vận tốc 15 m/s.", "b) Đồ thị dốc lên rồi dốc xuống nghĩa là vật đi rồi quay lại.", "c) Diện tích dưới đồ thị v – t là độ dịch chuyển.", "d) Đồ thị v – t của chuyển động thẳng đều là đường xiên."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: là đường nằm ngang.", "points": 1}, {"type": "short", "level": "VD", "q": "Đồ thị d – t là đường thẳng đi qua (2 s; 8 m) và (10 s; 64 m). Vận tốc của vật là bao nhiêu m/s? (ghi số)", "answer": "7", "explain": "v = (64 - 8)/(10 - 2) = 56/8 = 7 m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đồ thị v – t nằm ngang tại v = 12 m/s từ t = 0 đến t = 2,5 s. Độ dịch chuyển là bao nhiêu m? (ghi số)", "answer": "30", "explain": "d = 12 x 2,5 = 30 m.", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Nếu đồ thị d – t là một đường cong (không phải đường thẳng) thì chuyển động", "options": ["A. không phải chuyển động thẳng đều.", "B. là chuyển động thẳng đều.", "C. là vật đứng yên.", "D. không xác định được."], "answer": "A", "explain": "Chuyển động thẳng đều có đồ thị d – t là đường thẳng; đường cong nghĩa là vận tốc thay đổi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vận tốc của vật có thể xác định từ đồ thị d – t bằng cách tính", "options": ["A. độ dốc của đường đồ thị.", "B. diện tích dưới đường đồ thị.", "C. độ dài của đường đồ thị.", "D. màu sắc của đường đồ thị."], "answer": "A", "explain": "Vận tốc bằng độ dốc của đồ thị d – t.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai vật có đồ thị d – t là hai đường thẳng song song với nhau thì", "options": ["A. hai vật có cùng vận tốc.", "B. hai vật gặp nhau.", "C. hai vật đứng yên.", "D. hai vật chuyển động ngược chiều."], "answer": "A", "explain": "Song song nghĩa là cùng độ dốc, tức cùng vận tốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đồ thị d – t cắt trục thời gian tại thời điểm t0 có nghĩa là", "options": ["A. lúc t0 vật ở gốc tọa độ.", "B. lúc t0 vật dừng lại.", "C. lúc t0 vật bắt đầu chuyển động.", "D. lúc t0 vật biến mất."], "answer": "A", "explain": "Điểm cắt trục t: d = 0, nghĩa là lúc t0 vật ở gốc tọa độ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đồ thị d – t là đường thẳng đi qua (0 s; 0 m) và (25 s; 100 m). Vận tốc của vật là", "options": ["A. 4 m/s.", "B. 25 m/s.", "C. 100 m/s.", "D. 2500 m/s."], "answer": "A", "explain": "v = 100/25 = 4 m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đồ thị v – t là đường nằm ngang tại v = -3 m/s từ t = 0 đến t = 4 s. Độ dịch chuyển của vật là", "options": ["A. -12 m.", "B. 12 m.", "C. -7 m.", "D. 1 m."], "answer": "A", "explain": "Độ dịch chuyển = v.t = (-3) x 4 = -12 m (dấu trừ cho biết ngược chiều dương).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị d – t là đường cong thì không phải chuyển động thẳng đều.", "b) Vận tốc tính được từ độ dốc của đồ thị d – t.", "c) Hai đồ thị d – t song song thì hai vật cùng vận tốc.", "d) Đồ thị d – t cắt trục t tại t0 nghĩa là lúc t0 vật ở gốc tọa độ."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị d – t qua (0; 0) và (25; 100) cho vận tốc 4 m/s.", "b) Đồ thị v – t tại v = -3 m/s (0 đến 4 s) cho độ dịch chuyển -12 m.", "c) Dấu trừ của độ dịch chuyển cho biết hướng ngược chiều dương.", "d) Đồ thị d – t song song thì hai vật gặp nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: song song nghĩa là cùng vận tốc, không gặp nhau.", "points": 1}, {"type": "short", "level": "VD", "q": "Đồ thị d – t là đường thẳng đi qua (1 s; 7 m) và (11 s; 57 m). Vận tốc của vật là bao nhiêu m/s? (ghi số)", "answer": "5", "explain": "v = (57 - 7)/(11 - 1) = 50/10 = 5 m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đồ thị v – t nằm ngang tại v = 7 m/s từ t = 0 đến t = 4 s. Độ dịch chuyển là bao nhiêu m? (ghi số)", "answer": "28", "explain": "d = 7 x 4 = 28 m.", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Để vẽ được đồ thị độ dịch chuyển – thời gian, trước hết cần có", "options": ["A. bảng số liệu độ dịch chuyển theo thời gian.", "B. khối lượng của vật.", "C. màu sắc của vật.", "D. nhiệt độ môi trường."], "answer": "A", "explain": "Cần bảng số liệu d theo t mới vẽ được đồ thị d – t.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mỗi điểm trên đồ thị d – t cho biết", "options": ["A. vị trí (độ dịch chuyển) của vật tại thời điểm đó.", "B. khối lượng của vật.", "C. vận tốc tức thời của vật.", "D. gia tốc của vật."], "answer": "A", "explain": "Điểm (t; d) cho biết tại thời điểm t, vật ở vị trí có độ dịch chuyển d.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đồ thị d – t của hai xe cắt nhau tại điểm (4 s; 60 m). Điều này có nghĩa là", "options": ["A. hai xe gặp nhau lúc 4 s tại vị trí cách gốc 60 m.", "B. hai xe cùng xuất phát lúc 4 s.", "C. hai xe có cùng vận tốc.", "D. hai xe cùng đứng yên tại 60 m."], "answer": "A", "explain": "Giao điểm cho biết thời điểm và vị trí gặp nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ đồ thị d – t có một đoạn nằm ngang, ta biết được", "options": ["A. khoảng thời gian vật đứng yên.", "B. vận tốc của vật.", "C. gia tốc của vật.", "D. khối lượng của vật."], "answer": "A", "explain": "Đoạn nằm ngang ứng với khoảng thời gian vật đứng yên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đồ thị d – t là đường thẳng đi qua (0 s; 0 m) và (6 s; 90 m). Vận tốc của vật là", "options": ["A. 15 m/s.", "B. 6 m/s.", "C. 90 m/s.", "D. 540 m/s."], "answer": "A", "explain": "v = 90/6 = 15 m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đồ thị d – t là đường thẳng đi qua (0 s; 30 m) và (10 s; 0 m). Mô tả nào đúng về chuyển động?", "options": ["A. Lúc t = 0 vật ở vị trí cách gốc 30 m, chuyển động ngược chiều dương về gốc tọa độ.", "B. Vật đứng yên tại gốc tọa độ.", "C. Vật chuyển động theo chiều dương ra xa gốc.", "D. Vật chuyển động nhanh dần đều."], "answer": "A", "explain": "Tại t = 0, d = 30 m; d giảm dần về 0 nên vật chuyển động ngược chiều dương về gốc.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Muốn vẽ đồ thị d – t cần bảng số liệu d theo t.", "b) Điểm (t; d) cho biết vị trí của vật tại thời điểm t.", "c) Hai đồ thị d – t cắt nhau tại (4; 60) nghĩa là hai vật gặp nhau lúc 4 s tại vị trí 60 m.", "d) Đoạn nằm ngang trên đồ thị d – t cho biết vận tốc của vật."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đoạn nằm ngang cho biết khoảng thời gian vật đứng yên.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị d – t qua (0; 0) và (6; 90) cho vận tốc 15 m/s.", "b) Đồ thị qua (0; 30) và (10; 0) mô tả vật từ vị trí 30 m đi ngược về gốc.", "c) Diện tích dưới đồ thị v – t là độ dịch chuyển.", "d) Đường dốc lên trên đồ thị d – t nghĩa là vật đứng yên."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đường dốc lên là chuyển động theo chiều dương.", "points": 1}, {"type": "short", "level": "VD", "q": "Đồ thị d – t là đường thẳng đi qua (4 s; 16 m) và (12 s; 80 m). Vận tốc của vật là bao nhiêu m/s? (ghi số)", "answer": "8", "explain": "v = (80 - 16)/(12 - 4) = 64/8 = 8 m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đồ thị v – t nằm ngang tại v = 9 m/s từ t = 0 đến t = 5 s. Độ dịch chuyển là bao nhiêu m? (ghi số)", "answer": "45", "explain": "d = 9 x 5 = 45 m.", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Đồ thị v – t nằm phía trên trục thời gian (v lớn hơn 0) có nghĩa là vật", "options": ["A. chuyển động theo chiều dương.", "B. chuyển động ngược chiều dương.", "C. đang đứng yên.", "D. chuyển động nhanh dần."], "answer": "A", "explain": "v dương nghĩa là vật chuyển động theo chiều dương đã chọn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đồ thị v – t nằm phía dưới trục thời gian (v nhỏ hơn 0) có nghĩa là vật", "options": ["A. chuyển động ngược chiều dương.", "B. chuyển động theo chiều dương.", "C. đang đứng yên.", "D. chuyển động nhanh dần."], "answer": "A", "explain": "v âm nghĩa là vật chuyển động ngược chiều dương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Diện tích giới hạn bởi đồ thị v – t (phần nằm dưới trục t, v âm) với trục t cho ta", "options": ["A. độ dịch chuyển mang giá trị âm.", "B. quãng đường luôn dương.", "C. vận tốc dương.", "D. thời gian âm."], "answer": "A", "explain": "Diện tích dưới đồ thị v – t là độ dịch chuyển; v âm thì độ dịch chuyển âm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đồ thị d – t có một đoạn nằm ngang từ t = 2 s đến t = 5 s. Vật đã đứng yên trong", "options": ["A. 3 s.", "B. 2 s.", "C. 5 s.", "D. 7 s."], "answer": "A", "explain": "Thời gian đứng yên = 5 - 2 = 3 s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đồ thị d – t là đường thẳng đi qua (0 s; 0 m) và (10 s; 120 m). Vận tốc của vật là", "options": ["A. 12 m/s.", "B. 10 m/s.", "C. 120 m/s.", "D. 1200 m/s."], "answer": "A", "explain": "v = 120/10 = 12 m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đồ thị d – t của một người đi bộ: từ 0 đến 1 giờ đường dốc lên đến 4 km, từ 1 đến 2 giờ đường nằm ngang, từ 2 đến 3 giờ đường dốc xuống về 0. Tốc độ của người lúc đang đi là", "options": ["A. 4 km/h.", "B. 2 km/h.", "C. 1,33 km/h.", "D. 0."], "answer": "A", "explain": "Lúc đang đi (đoạn dốc lên): v = 4 km / 1 h = 4 km/h.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị v – t ở phía trên trục t (v dương) nghĩa là vật đi theo chiều dương.", "b) Đồ thị v – t ở phía dưới trục t (v âm) nghĩa là vật đi ngược chiều dương.", "c) Đoạn nằm ngang từ t = 2 s đến t = 5 s nghĩa là vật đứng yên trong 3 s.", "d) Diện tích dưới đồ thị v – t khi v âm cho độ dịch chuyển dương."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cho độ dịch chuyển âm.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị d – t qua (0; 0) và (10; 120) cho vận tốc 12 m/s.", "b) Người đi bộ (đồ thị trên) có tốc độ lúc đang đi là 4 km/h.", "c) Diện tích dưới đồ thị v – t là độ dịch chuyển.", "d) Đường nằm ngang trên đồ thị d – t nghĩa là vật chuyển động đều."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đường nằm ngang nghĩa là vật đứng yên.", "points": 1}, {"type": "short", "level": "VD", "q": "Đồ thị d – t là đường thẳng đi qua (5 s; 20 m) và (15 s; 90 m). Vận tốc của vật là bao nhiêu m/s? (ghi số)", "answer": "7", "explain": "v = (90 - 20)/(15 - 5) = 70/10 = 7 m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đồ thị v – t nằm ngang tại v = 15 m/s từ t = 0 đến t = 6 s. Độ dịch chuyển là bao nhiêu m? (ghi số)", "answer": "90", "explain": "d = 15 x 6 = 90 m.", "points": 0.5}]},

c khẳng định sau:", "statements": ["a) Cả đồ thị d – t và v – t đều có trục hoành là thời gian.", "b) Muốn biết nhanh chậm từ đồ thị d – t ta xem độ dốc.", "c) Xe A (100 m/5 s) nhanh hơn xe B (100 m/10 s).", "d) Vận tốc của xe A trên là 10 m/s."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vận tốc xe A là 20 m/s.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị d – t qua (0; 0) và (15; 45) cho vận tốc 3 m/s.", "b) Vật có đồ thị d – t tăng rồi giảm về 0 thì độ dịch chuyển bằng 0.", "c) Diện tích dưới đồ thị v – t là độ dịch chuyển.", "d) Độ dốc của đồ thị v – t là vận tốc."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: độ dốc của đồ thị d – t mới là vận tốc.", "points": 1}, {"type": "short", "level": "VD", "q": "Đồ thị d – t là đường thẳng đi qua (0 s; 10 m) và (8 s; 74 m). Vận tốc của vật là bao nhiêu m/s? (ghi số)", "answer": "8", "explain": "v = (74 - 10)/8 = 64/8 = 8 m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đồ thị v – t nằm ngang tại v = 20 m/s từ t = 0 đến t = 7,5 s. Độ dịch chuyển là bao nhiêu m? (ghi số)", "answer": "150", "explain": "d = 20 x 7,5 = 150 m.", "points": 0.5}]}]}
