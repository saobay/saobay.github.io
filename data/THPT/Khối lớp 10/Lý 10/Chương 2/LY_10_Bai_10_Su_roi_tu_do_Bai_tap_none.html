": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tờ giấy rơi chậm hơn hòn đá vì sức cản không khí tác dụng lên nó đáng kể.", "b) Trong ống chân không, mọi vật rơi nhanh như nhau.", "c) Vật thả từ 80 m ($g = 10$ m/s vuông) thì chạm đất sau 4 s.", "d) Gia tốc rơi tự do của hòn đá lớn hơn của tờ giấy."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $g$ như nhau với mọi vật.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vận tốc của vật thả từ 80 m khi chạm đất là 40 m/s.", "b) Quãng đường rơi trong giây thứ hai là 15 m.", "c) Quãng đường rơi trong giây thứ ba là 25 m.", "d) Quãng đường rơi trong các giây liên tiếp tỉ lệ 1 : 2 : 3."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tỉ lệ là 1 : 3 : 5.", "points": 1}, {"type": "short", "level": "VD", "q": "Thả một vật rơi tự do từ độ cao 125 m (lấy $g = 10$ m/s vuông). Thời gian vật chạm đất là bao nhiêu s? (ghi số)", "answer": "5", "explain": "$t = \\sqrt{\\frac{2 \\times 125}{10}} = 5$ s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong tình huống trên, vận tốc của vật khi chạm đất là bao nhiêu m/s? (ghi số)", "answer": "50", "explain": "$v = 10 \\times 5 = 50$ m/s.", "points": 0.5}]},
{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên tắc đo gia tốc rơi tự do trong thực hành là", "options": ["A. đo độ cao $h$ và thời gian rơi $t$, rồi tính $g = \\frac{2h}{t^2}$.", "B. cân khối lượng vật rồi chia cho thời gian.", "C. đo vận tốc rồi nhân với thời gian.", "D. thả vật rồi ước lượng bằng mắt."], "answer": "A", "explain": "Từ $h = \\frac{1}{2}gt^2$ suy ra $g = \\frac{2h}{t^2}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để giảm sai số khi đo gia tốc rơi tự do, ta nên", "options": ["A. dùng vật đặc, nặng và lặp lại thí nghiệm nhiều lần lấy trung bình.", "B. dùng tờ giấy mỏng, nhẹ.", "C. đo một lần duy nhất.", "D. thả vật từ độ cao rất thấp."], "answer": "A", "explain": "Vật đặc, nặng giảm ảnh hưởng của sức cản không khí; đo nhiều lần giảm sai số ngẫu nhiên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong thí nghiệm, vật rơi từ độ cao $h = 0,8$ m trong thời gian $t = 0,4$ s. Gia tốc rơi tự do đo được là", "options": ["A. 10 m/s vuông.", "B. 5 m/s vuông.", "C. 2 m/s vuông.", "D. 20 m/s vuông."], "answer": "A", "explain": "$g = \\frac{2 \\times 0,8}{0,4^2} = \\frac{1,6}{0,16} = 10$ m/s vuông.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đơn vị của gia tốc rơi tự do trong hệ SI là", "options": ["A. m/s vuông.", "B. m/s.", "C. N.", "D. kg."], "answer": "A", "explain": "Gia tốc có đơn vị m/s vuông.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong thí nghiệm khác, $h = 1,25$ m, $t = 0,5$ s. Gia tốc rơi tự do đo được là", "options": ["A. 10 m/s vuông.", "B. 5 m/s vuông.", "C. 2,5 m/s vuông.", "D. 25 m/s vuông."], "answer": "A", "explain": "$g = \\frac{2 \\times 1,25}{0,5^2} = \\frac{2,5}{0,25} = 10$ m/s vuông.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đo thời gian rơi 3 lần được các giá trị 0,39 s; 0,41 s; 0,40 s. Thời gian trung bình là", "options": ["A. 0,40 s.", "B. 0,39 s.", "C. 0,41 s.", "D. 1,20 s."], "answer": "A", "explain": "$t_{tb} = \\frac{0,39 + 0,41 + 0,40}{3} = 0,40$ s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đo $g$ bằng cách đo $h$ và $t$, tính $g = \\frac{2h}{t^2}$.", "b) Nên dùng vật đặc, nặng và đo nhiều lần lấy trung bình.", "c) $h = 0,8$ m, $t = 0,4$ s thì $g = 10$ m/s vuông.", "d) Đơn vị của $g$ là m/s."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đơn vị của $g$ là m/s vuông.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $h = 1,25$ m, $t = 0,5$ s thì $g = 10$ m/s vuông.", "b) Thời gian trung bình của 3 lần đo 0,39 s; 0,41 s; 0,40 s là 0,40 s.", "c) Bấm đồng hồ bằng tay gây sai số do thời gian phản ứng.", "d) Sức cản không khí làm giá trị $g$ đo được lớn hơn giá trị thật."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: sức cản làm vật rơi chậm hơn nên $g$ đo được nhỏ hơn giá trị thật.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong thí nghiệm, $h = 0,45$ m, $t = 0,3$ s. Gia tốc rơi tự do đo được là bao nhiêu m/s vuông? (ghi số)", "answer": "10", "explain": "$g = \\frac{2 \\times 0,45}{0,3^2} = \\frac{0,9}{0,09} = 10$ m/s vuông.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong thí nghiệm khác, $h = 1,8$ m, $t = 0,6$ s. Gia tốc rơi tự do đo được là bao nhiêu m/s vuông? (ghi số)", "answer": "10", "explain": "$g = \\frac{2 \\times 1,8}{0,6^2} = \\frac{3,6}{0,36} = 10$ m/s vuông.", "points": 0.5}]},
{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Đối với sự rơi tự do (vật được thả nhẹ), vận tốc đầu $v_0$ bằng", "options": ["A. 0.", "B. $g$.", "C. 9,8 m/s.", "D. 10 m/s."], "answer": "A", "explain": "Thả nhẹ nghĩa là $v_0 = 0$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong sự rơi tự do, gia tốc $a$ của vật bằng", "options": ["A. $g$.", "B. 0.", "C. $v_0$.", "D. $2g$."], "answer": "A", "explain": "Rơi tự do là chuyển động nhanh dần đều với gia tốc $a = g$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thả một vật rơi tự do từ độ cao 180 m (lấy $g = 10$ m/s vuông). Thời gian vật chạm đất là", "options": ["A. 6 s.", "B. 18 s.", "C. 180 s.", "D. 36 s."], "answer": "A", "explain": "$t = \\sqrt{\\frac{2 \\times 180}{10}} = 6$ s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vận tốc của vật khi chạm đất trong tình huống trên là", "options": ["A. 60 m/s.", "B. 180 m/s.", "C. 30 m/s.", "D. 6 m/s."], "answer": "A", "explain": "$v = 10 \\times 6 = 60$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật rơi tự do trong 4 s (lấy $g = 10$ m/s vuông). Quãng đường vật rơi được là", "options": ["A. 80 m.", "B. 40 m.", "C. 160 m.", "D. 4 m."], "answer": "A", "explain": "$h = \\frac{1}{2} \\times 10 \\times 4^2 = 80$ m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vận tốc của vật sau 4 s trong tình huống trên là", "options": ["A. 40 m/s.", "B. 80 m/s.", "C. 20 m/s.", "D. 4 m/s."], "answer": "A", "explain": "$v = 10 \\times 4 = 40$ m/s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật rơi tự do được thả nhẹ thì $v_0 = 0$.", "b) Gia tốc của vật rơi tự do là $g$.", "c) Vật thả từ 180 m ($g = 10$ m/s vuông) thì chạm đất sau 6 s.", "d) Vận tốc của vật trên khi chạm đất là 180 m/s."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $v = 60$ m/s.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật rơi tự do trong 4 s thì đi được 80 m.", "b) Vận tốc của vật sau 4 s là 40 m/s.", "c) Quãng đường rơi tỉ lệ thuận với bình phương thời gian.", "d) Vận tốc rơi tỉ lệ nghịch với thời gian."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $v = gt$ tỉ lệ thuận với $t$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật rơi tự do trong 2 s (lấy $g = 10$ m/s vuông). Quãng đường vật rơi được là bao nhiêu m? (ghi số)", "answer": "20", "explain": "$h = \\frac{1}{2} \\times 10 \\times 2^2 = 20$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong tình huống trên, vận tốc của vật sau 2 s là bao nhiêu m/s? (ghi số)", "answer": "20", "explain": "$v = 10 \\times 2 = 20$ m/s.", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Quãng đường vật rơi tự do đi được trong các khoảng thời gian bằng nhau liên tiếp tỉ lệ với", "options": ["A. các số lẻ 1 : 3 : 5 : 7 : ...", "B. các số chẵn 2 : 4 : 6 : 8 : ...", "C. các số 1 : 2 : 3 : 4 : ...", "D. các số 1 : 4 : 9 : 16 : ..."], "answer": "A", "explain": "Dấu hiệu của chuyển động nhanh dần đều: quãng đường trong các khoảng $T$ liên tiếp tỉ lệ 1 : 3 : 5 : 7.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quãng đường vật rơi tự do đi được trong giây đầu tiên (lấy $g = 10$ m/s vuông) là", "options": ["A. 5 m.", "B. 10 m.", "C. 20 m.", "D. 1 m."], "answer": "A", "explain": "$h = \\frac{1}{2} \\times 10 \\times 1^2 = 5$ m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quãng đường vật rơi được trong giây thứ hai (lấy $g = 10$ m/s vuông) là", "options": ["A. 15 m.", "B. 5 m.", "C. 20 m.", "D. 10 m."], "answer": "A", "explain": "Tỉ lệ 1 : 3 nên quãng đường giây thứ hai là $3 \\times 5 = 15$ m.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quãng đường vật rơi được trong giây thứ tư (lấy $g = 10$ m/s vuông) là", "options": ["A. 35 m.", "B. 25 m.", "C. 45 m.", "D. 15 m."], "answer": "A", "explain": "Tỉ lệ 1 : 3 : 5 : 7 nên quãng đường giây thứ tư là $7 \\times 5 = 35$ m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật rơi tự do trong 3 s (lấy $g = 10$ m/s vuông). Tổng quãng đường vật rơi được là", "options": ["A. 45 m.", "B. 30 m.", "C. 90 m.", "D. 15 m."], "answer": "A", "explain": "$h = \\frac{1}{2} \\times 10 \\times 3^2 = 45$ m (cũng bằng $5 + 15 + 25$).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Thả một vật rơi tự do từ độ cao 44,1 m (lấy $g = 9,8$ m/s vuông). Thời gian vật chạm đất là", "options": ["A. 3 s.", "B. 4,5 s.", "C. 9 s.", "D. 44,1 s."], "answer": "A", "explain": "$t = \\sqrt{\\frac{2 \\times 44,1}{9,8}} = \\sqrt{9} = 3$ s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quãng đường rơi trong các khoảng thời gian bằng nhau liên tiếp tỉ lệ 1 : 3 : 5.", "b) Quãng đường rơi trong giây đầu ($g = 10$ m/s vuông) là 5 m.", "c) Quãng đường rơi trong giây thứ hai là 15 m.", "d) Vật thả từ 44,1 m ($g = 9,8$ m/s vuông) thì chạm đất sau 9 s."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $t = 3$ s.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quãng đường rơi trong giây thứ ba là 25 m.", "b) Tổng quãng đường rơi trong 3 s là 45 m.", "c) Vận tốc của vật thả từ 44,1 m khi chạm đất là 29,4 m/s.", "d) Quãng đường rơi tỉ lệ thuận với thời gian."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng ($45 = 5 + 15 + 25$). c) Đúng: $v = 9,8 \\times 3 = 29,4$ m/s. d) Sai: tỉ lệ với bình phương thời gian.", "points": 1}, {"type": "short", "level": "VD", "q": "Thả một vật rơi tự do từ độ cao 19,6 m (lấy $g = 9,8$ m/s vuông). Thời gian vật chạm đất là bao nhiêu s? (ghi số)", "answer": "2", "explain": "$t = \\sqrt{\\frac{2 \\times 19,6}{9,8}} = 2$ s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong tình huống trên, vận tốc của vật khi chạm đất là bao nhiêu m/s? (ghi số, dùng dấu chấm thập phân)", "answer": "19.6", "explain": "$v = 9,8 \\times 2 = 19,6$ m/s.", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Sai số chủ yếu khi đo thời gian rơi bằng cách bấm đồng hồ tay là", "options": ["A. thời gian phản ứng của người bấm.", "B. khối lượng của vật quá lớn.", "C. đồng hồ chạy quá chính xác.", "D. độ cao quá lớn."], "answer": "A", "explain": "Người bấm có thời gian phản ứng nên thời gian đo không chính xác tuyệt đối.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để giảm ảnh hưởng của sức cản không khí khi đo gia tốc rơi tự do, ta nên", "options": ["A. dùng vật đặc, nặng, kích thước nhỏ.", "B. dùng tờ giấy mỏng.", "C. dùng quả bóng bay.", "D. thả vật từ độ cao rất thấp."], "answer": "A", "explain": "Vật đặc, nặng, nhỏ thì sức cản không khí không đáng kể so với trọng lượng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thả một vật rơi tự do từ độ cao 3,2 m (lấy $g = 10$ m/s vuông). Thời gian vật chạm đất là", "options": ["A. 0,8 s.", "B. 3,2 s.", "C. 1,6 s.", "D. 0,32 s."], "answer": "A", "explain": "$t = \\sqrt{\\frac{2 \\times 3,2}{10}} = \\sqrt{0,64} = 0,8$ s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vận tốc của vật khi chạm đất trong tình huống trên là", "options": ["A. 8 m/s.", "B. 3,2 m/s.", "C. 32 m/s.", "D. 0,8 m/s."], "answer": "A", "explain": "$v = 10 \\times 0,8 = 8$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai vật có khối lượng khác nhau được thả rơi tự do cùng lúc từ cùng một độ cao (bỏ qua sức cản không khí). So sánh thời gian chạm đất của hai vật:", "options": ["A. Hai vật chạm đất cùng lúc.", "B. Vật nặng chạm đất trước.", "C. Vật nhẹ chạm đất trước.", "D. Không so sánh được."], "answer": "A", "explain": "$g$ không phụ thuộc khối lượng nên hai vật rơi nhanh như nhau.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Thả một vật rơi tự do từ độ cao 12,8 m (lấy $g = 10$ m/s vuông). Vận tốc của vật khi chạm đất là", "options": ["A. 16 m/s.", "B. 12,8 m/s.", "C. 32 m/s.", "D. 8 m/s."], "answer": "A", "explain": "$v = \\sqrt{2 \\times 10 \\times 12,8} = \\sqrt{256} = 16$ m/s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bấm đồng hồ tay gây sai số do thời gian phản ứng.", "b) Nên dùng vật đặc, nặng, nhỏ để giảm sức cản không khí.", "c) Vật thả từ 3,2 m ($g = 10$ m/s vuông) thì chạm đất sau 0,8 s.", "d) Vận tốc của vật trên khi chạm đất là 3,2 m/s."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $v = 8$ m/s.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hai vật khối lượng khác nhau, cùng thả từ một độ cao thì chạm đất cùng lúc.", "b) Vật thả từ 12,8 m ($g = 10$ m/s vuông) chạm đất với vận tốc 16 m/s.", "c) Thời gian vật trên chạm đất là 1,6 s.", "d) Vận tốc rơi tỉ lệ nghịch với độ cao."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng. c) Đúng: $t = \\sqrt{\\frac{2 \\times 12,8}{10}} = 1,6$ s. d) Sai: $v = \\sqrt{2gh}$ tỉ lệ với căn bậc hai của độ cao.", "points": 1}, {"type": "short", "level": "VD", "q": "Thả một vật rơi tự do từ độ cao 12,8 m (lấy $g = 10$ m/s vuông). Thời gian vật chạm đất là bao nhiêu s? (ghi số, dùng dấu chấm thập phân)", "answer": "1.6", "explain": "$t = \\sqrt{\\frac{2 \\times 12,8}{10}} = 1,6$ s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong tình huống trên, vận tốc của vật khi chạm đất là bao nhiêu m/s? (ghi số)", "answer": "16", "explain": "$v = 10 \\times 1,6 = 16$ m/s.", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Vật nào sau đây khi rơi trong không khí gần với chuyển động rơi tự do nhất?", "options": ["A. Hòn bi sắt rơi từ ban công.", "B. Tờ giấy rơi.", "C. Lông chim rơi.", "D. Chiếc lá rơi."], "answer": "A", "explain": "Hòn bi sắt đặc, nặng nên sức cản không khí không đáng kể.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Điều kiện để có thể coi chuyển động rơi của vật là rơi tự do là", "options": ["A. sức cản của không khí nhỏ, không đáng kể so với trọng lượng vật.", "B. vật phải rất nhẹ.", "C. vật phải rơi từ độ cao rất lớn.", "D. vật phải có hình dạng đẹp."], "answer": "A", "explain": "Khi sức cản không đáng kể, vật rơi chỉ dưới tác dụng của trọng lực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thả một vật rơi tự do từ độ cao 0,2 m (lấy $g = 10$ m/s vuông). Thời gian vật chạm đất là", "options": ["A. 0,2 s.", "B. 2 s.", "C. 0,02 s.", "D. 1 s."], "answer": "A", "explain": "$t = \\sqrt{\\frac{2 \\times 0,2}{10}} = \\sqrt{0,04} = 0,2$ s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vận tốc của vật khi chạm đất trong tình huống trên là", "options": ["A. 2 m/s.", "B. 0,2 m/s.", "C. 20 m/s.", "D. 10 m/s."], "answer": "A", "explain": "$v = 10 \\times 0,2 = 2$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một giọt nước rơi tự do từ mái nhà cao 5 m (lấy $g = 10$ m/s vuông). Thời gian giọt nước chạm đất là", "options": ["A. 1 s.", "B. 5 s.", "C. 0,5 s.", "D. 10 s."], "answer": "A", "explain": "$t = \\sqrt{\\frac{2 \\times 5}{10}} = 1$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vận tốc của giọt nước khi chạm đất trong tình huống trên là", "options": ["A. 10 m/s.", "B. 5 m/s.", "C. 50 m/s.", "D. 1 m/s."], "answer": "A", "explain": "$v = 10 \\times 1 = 10$ m/s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hòn bi sắt rơi gần với rơi tự do nhất.", "b) Muốn coi là rơi tự do thì sức cản không khí phải không đáng kể.", "c) Vật thả từ 0,2 m ($g = 10$ m/s vuông) thì chạm đất sau 0,2 s.", "d) Vận tốc của vật trên khi chạm đất là 0,2 m/s."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $v = 2$ m/s.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giọt nước rơi từ mái nhà 5 m ($g = 10$ m/s vuông) chạm đất sau 1 s.", "b) Vận tốc của giọt nước khi chạm đất là 10 m/s.", "c) $v^2 = 2gh$.", "d) Rơi tự do là chuyển động thẳng đều."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: rơi tự do là chuyển động thẳng nhanh dần đều.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật rơi tự do trong 0,5 s (lấy $g = 10$ m/s vuông). Quãng đường vật rơi được là bao nhiêu m? (ghi số, dùng dấu chấm thập phân)", "answer": "1.25", "explain": "$h = \\frac{1}{2} \\times 10 \\times 0,5^2 = 1,25$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong tình huống trên, vận tốc của vật sau 0,5 s là bao nhiêu m/s? (ghi số)", "answer": "5", "explain": "$v = 10 \\times 0,5 = 5$ m/s.", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các bài toán đơn giản, giá trị gia tốc rơi tự do thường được lấy là", "options": ["A. 10 m/s vuông.", "B. 9,8 m/s.", "C. 100 m/s vuông.", "D. 1 m/s vuông."], "answer": "A", "explain": "Trong bài toán đơn giản thường lấy $g = 10$ m/s vuông.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Càng lên cao (xa mặt đất), gia tốc rơi tự do", "options": ["A. càng giảm.", "B. càng tăng.", "C. không đổi.", "D. bằng 0."], "answer": "A", "explain": "Càng xa tâm Trái Đất, lực hấp dẫn càng yếu nên $g$ càng giảm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thả một vật rơi tự do từ độ cao 7,2 m (lấy $g = 10$ m/s vuông). Thời gian vật chạm đất là", "options": ["A. 1,2 s.", "B. 7,2 s.", "C. 0,72 s.", "D. 2,4 s."], "answer": "A", "explain": "$t = \\sqrt{\\frac{2 \\times 7,2}{10}} = \\sqrt{1,44} = 1,2$ s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vận tốc của vật khi chạm đất trong tình huống trên là", "options": ["A. 12 m/s.", "B. 7,2 m/s.", "C. 72 m/s.", "D. 1,2 m/s."], "answer": "A", "explain": "$v = 10 \\times 1,2 = 12$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vật A được thả rơi từ độ cao 20 m, vật B được thả rơi từ độ cao 5 m (cùng $g$). Tỉ số thời gian rơi $t_A/t_B$ bằng", "options": ["A. 2.", "B. 4.", "C. 0,5.", "D. 1."], "answer": "A", "explain": "$t = \\sqrt{\\frac{2h}{g}}$ nên $\\frac{t_A}{t_B} = \\sqrt{\\frac{20}{5}} = 2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tỉ số vận tốc khi chạm đất $v_A/v_B$ của hai vật trên bằng", "options": ["A. 2.", "B. 4.", "C. 0,5.", "D. 1."], "answer": "A", "explain": "$v = \\sqrt{2gh}$ nên $\\frac{v_A}{v_B} = \\sqrt{\\frac{20}{5}} = 2$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong bài toán đơn giản thường lấy $g = 10$ m/s vuông.", "b) Càng lên cao, $g$ càng giảm.", "c) Vật thả từ 7,2 m ($g = 10$ m/s vuông) thì chạm đất sau 1,2 s.", "d) Vận tốc của vật trên khi chạm đất là 7,2 m/s."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $v = 12$ m/s.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật A (20 m) và vật B (5 m) có tỉ số thời gian rơi là 2.", "b) Tỉ số vận tốc chạm đất của hai vật trên là 2.", "c) Thời gian rơi tỉ lệ với căn bậc hai của độ cao.", "d) Vật rơi từ độ cao gấp 4 lần thì thời gian rơi gấp 4 lần."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: thời gian chỉ gấp 2 lần (căn bậc hai của 4).", "points": 1}, {"type": "short", "level": "VD", "q": "Thả một vật rơi tự do từ độ cao 7,2 m (lấy $g = 10$ m/s vuông). Thời gian vật chạm đất là bao nhiêu s? (ghi số, dùng dấu chấm thập phân)", "answer": "1.2", "explain": "$t = \\sqrt{\\frac{2 \\times 7,2}{10}} = 1,2$ s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong tình huống trên, vận tốc của vật khi chạm đất là bao nhiêu m/s? (ghi số)", "answer": "12", "explain": "$v = 10 \\times 1,2 = 12$ m/s.", "points": 0.5}]},
{"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Sự rơi tự do là chuyển động", "options": ["A. thẳng nhanh dần đều.", "B. thẳng đều.", "C. thẳng chậm dần đều.", "D. tròn đều."], "answer": "A", "explain": "Rơi tự do: thẳng đứng, hướng xuống, thẳng nhanh dần đều.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Công thức nào sau đây KHÔNG đúng đối với sự rơi tự do (vật được thả nhẹ)?", "options": ["A. $h = vt$.", "B. $v = gt$.", "C. $h = \\frac{1}{2}gt^2$.", "D. $v^2 = 2gh$."], "answer": "A", "explain": "$h = vt$ là công thức của chuyển động thẳng đều, không đúng cho rơi tự do.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thả một vật rơi tự do từ độ cao 500 m (lấy $g = 10$ m/s vuông). Thời gian vật chạm đất là", "options": ["A. 10 s.", "B. 50 s.", "C. 500 s.", "D. 100 s."], "answer": "A", "explain": "$t = \\sqrt{\\frac{2 \\times 500}{10}} = \\sqrt{100} = 10$ s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vận tốc của vật khi chạm đất trong tình huống trên là", "options": ["A. 100 m/s.", "B. 500 m/s.", "C. 50 m/s.", "D. 10 m/s."], "answer": "A", "explain": "$v = 10 \\times 10 = 100$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật rơi tự do (lấy $g = 10$ m/s vuông), trong 1 s cuối cùng trước khi chạm đất vật rơi được 25 m. Tổng thời gian vật rơi là", "options": ["A. 3 s.", "B. 2,5 s.", "C. 5 s.", "D. 1 s."], "answer": "A", "explain": "Quãng đường trong 1 s cuối: $h_T - h_{T-1} = 5T^2 - 5(T-1)^2 = 10T - 5 = 25$, suy ra $T = 3$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Độ cao mà vật được thả rơi trong tình huống trên là", "options": ["A. 45 m.", "B. 25 m.", "C. 90 m.", "D. 30 m."], "answer": "A", "explain": "$h = \\frac{1}{2} \\times 10 \\times 3^2 = 45$ m.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Rơi tự do là chuyển động thẳng nhanh dần đều.", "b) $h = vt$ không phải công thức của rơi tự do.", "c) Vật thả từ 500 m ($g = 10$ m/s vuông) thì chạm đất sau 10 s.", "d) Vận tốc của vật trên khi chạm đất là 500 m/s."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $v = 100$ m/s.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật rơi 1 s cuối được 25 m ($g = 10$ m/s vuông) thì tổng thời gian rơi là 3 s.", "b) Độ cao thả vật trong tình huống trên là 45 m.", "c) $g = \\frac{2h}{t^2}$.", "d) Khi đo $g$, càng đo ít lần càng chính xác."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đo nhiều lần lấy trung bình mới giảm sai số.", "points": 1}, {"type": "short", "level": "VD", "q": "Thả một vật rơi tự do từ độ cao 500 m (lấy $g = 10$ m/s vuông). Thời gian vật chạm đất là bao nhiêu s? (ghi số)", "answer": "10", "explain": "$t = \\sqrt{\\frac{2 \\times 500}{10}} = 10$ s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong tình huống trên, vận tốc của vật khi chạm đất là bao nhiêu m/s? (ghi số)", "answer": "100", "explain": "$v = 10 \\times 10 = 100$ m/s.", "points": 0.5}]}]}
