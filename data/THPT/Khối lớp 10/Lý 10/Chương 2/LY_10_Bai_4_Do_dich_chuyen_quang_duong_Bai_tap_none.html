các khẳng định sau:", "statements": ["a) Quãng đường là độ dài của quỹ đạo.", "b) Độ dịch chuyển là vectơ nối vị trí đầu đến vị trí cuối.", "c) Con kiến bò 3 cm đông rồi 4 cm tây có độ lớn độ dịch chuyển 1 cm.", "d) Quãng đường của con kiến trên là 1 cm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quãng đường là 3 + 4 = 7 cm.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vận động viên chạy về vạch xuất phát có độ dịch chuyển bằng 0.", "b) Quãng đường của vận động viên trên bằng độ dài một vòng sân.", "c) Độ dịch chuyển của tàu (6 km đông, 8 km nam) có độ lớn 10 km.", "d) Quãng đường của tàu trên cũng bằng 10 km."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quãng đường là 6 + 8 = 14 km.", "points": 1}, {"type": "short", "level": "VD", "q": "Một xe đi từ A đến B dài 12 km rồi quay ngược lại đến C, biết C cách B 5 km (về phía A). Quãng đường xe đã đi là bao nhiêu km? (ghi số)", "answer": "17", "explain": "Quãng đường: AB + BC = 12 + 5 = 17 km.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong tình huống trên, độ lớn độ dịch chuyển từ A đến C là bao nhiêu km? (ghi số)", "answer": "7", "explain": "C cách A một đoạn AC = 12 - 5 = 7 km nên độ lớn độ dịch chuyển là 7 km.", "points": 0.5}]},
{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Vật làm mốc được dùng để", "options": ["A. xác định vị trí của vật chuyển động.", "B. đo khối lượng của vật.", "C. đo thời gian chuyển động.", "D. làm vật cản đường đi."], "answer": "A", "explain": "Vật làm mốc cùng hệ tọa độ gắn với nó dùng để xác định vị trí của vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chất điểm là mô hình của vật có", "options": ["A. kích thước rất nhỏ, có thể bỏ qua được.", "B. khối lượng rất lớn.", "C. hình dạng rất đẹp.", "D. tốc độ rất lớn."], "answer": "A", "explain": "Chất điểm là mô hình coi vật có kích thước rất nhỏ, bỏ qua được so với quãng đường đi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh độ lớn độ dịch chuyển $|\\vec{d}|$ và quãng đường $s$, phát biểu đúng là", "options": ["A. $|\\vec{d}| \\le s$.", "B. $|\\vec{d}|$ luôn lớn hơn $s$.", "C. $|\\vec{d}| = 2s$.", "D. $|\\vec{d}|$ luôn bằng $s$."], "answer": "A", "explain": "Độ lớn độ dịch chuyển không bao giờ vượt quá quãng đường; bằng nhau khi đi thẳng không đổi chiều.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật đi từ A đến B dài 2 km rồi đi tiếp đến C dài 3 km, ba điểm A, B, C thẳng hàng theo đúng thứ tự. Quãng đường vật đi được là", "options": ["A. 5 km.", "B. 1 km.", "C. 6 km.", "D. 2 km."], "answer": "A", "explain": "Quãng đường: 2 + 3 = 5 km.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong tình huống trên, độ lớn độ dịch chuyển từ A đến C là", "options": ["A. 5 km.", "B. 1 km.", "C. 6 km.", "D. 2 km."], "answer": "A", "explain": "Ba điểm thẳng hàng theo thứ tự nên AC = AB + BC = 5 km.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người đi 5 km về phía bắc rồi 12 km về phía đông (hai hướng vuông góc). Độ lớn độ dịch chuyển của người này là", "options": ["A. 13 km.", "B. 17 km.", "C. 7 km.", "D. 60 km."], "answer": "A", "explain": "Độ lớn độ dịch chuyển $= \\sqrt{5^2 + 12^2} = 13$ km.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật làm mốc giúp xác định vị trí của vật.", "b) Ô tô chạy trên đường dài có thể coi là chất điểm.", "c) $|\\vec{d}| \\le s$ luôn đúng.", "d) Độ dịch chuyển của vật đi từ A đến C (qua B, thẳng hàng) có độ lớn 1 km khi AB = 2 km, BC = 3 km."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: độ lớn là 5 km.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quãng đường từ A đến C (qua B) trong ví dụ trên là 5 km.", "b) Người đi 5 km bắc, 12 km đông có độ lớn độ dịch chuyển 13 km.", "c) Quãng đường của người này là 13 km.", "d) Khi đi thẳng không đổi chiều, $|\\vec{d}| = s$."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: quãng đường là 5 + 12 = 17 km.", "points": 1}, {"type": "short", "level": "VD", "q": "Một quả bóng lăn 8 m về phía trước rồi lăn ngược lại 3 m. Quãng đường quả bóng đã lăn là bao nhiêu m? (ghi số)", "answer": "11", "explain": "Quãng đường: 8 + 3 = 11 m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong tình huống trên, độ lớn độ dịch chuyển của quả bóng là bao nhiêu m? (ghi số)", "answer": "5", "explain": "Chọn chiều dương là phía trước: độ dịch chuyển = 8 - 3 = 5 m, độ lớn là 5 m.", "points": 0.5}]},
{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Độ dịch chuyển được xác định bằng", "options": ["A. vectơ nối vị trí đầu đến vị trí cuối của chuyển động.", "B. độ dài toàn bộ quỹ đạo.", "C. thời gian vật chuyển động.", "D. tốc độ trung bình của vật."], "answer": "A", "explain": "Định nghĩa độ dịch chuyển: vectơ nối vị trí đầu đến vị trí cuối.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quãng đường đi được không bao giờ", "options": ["A. mang giá trị âm.", "B. lớn hơn 0.", "C. được đo bằng mét.", "D. thay đổi."], "answer": "A", "explain": "Quãng đường là độ dài nên không bao giờ âm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một con thuyền đi 3 km xuôi dòng rồi quay ngược lại 3 km về đúng bến cũ. Độ dịch chuyển của thuyền là", "options": ["A. 0.", "B. 3 km xuôi dòng.", "C. 6 km.", "D. 3 km ngược dòng."], "answer": "A", "explain": "Thuyền về đúng bến cũ nên độ dịch chuyển bằng 0.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quãng đường thuyền đã đi trong tình huống trên là", "options": ["A. 6 km.", "B. 0.", "C. 3 km.", "D. 9 km."], "answer": "A", "explain": "Quãng đường: 3 + 3 = 6 km.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một xe máy đi 9 km về phía đông rồi 12 km về phía bắc (hai hướng vuông góc). Độ lớn độ dịch chuyển của xe là", "options": ["A. 15 km.", "B. 21 km.", "C. 3 km.", "D. 108 km."], "answer": "A", "explain": "Độ lớn độ dịch chuyển $= \\sqrt{9^2 + 12^2} = 15$ km.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người đi bộ quanh hồ hình vuông cạnh 1 km, đi hết đúng một vòng và trở về điểm xuất phát. Độ lớn độ dịch chuyển của người này là", "options": ["A. 0.", "B. 1 km.", "C. 4 km.", "D. 2 km."], "answer": "A", "explain": "Trở về điểm xuất phát nên độ dịch chuyển bằng 0 (quãng đường đi được là 4 km).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Độ dịch chuyển là vectơ nối vị trí đầu đến vị trí cuối.", "b) Quãng đường không bao giờ âm.", "c) Thuyền về đúng bến cũ có độ dịch chuyển bằng 0.", "d) Quãng đường của thuyền trên bằng 0."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quãng đường là 6 km.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xe đi 9 km đông, 12 km bắc có độ lớn độ dịch chuyển 15 km.", "b) Quãng đường của xe trên là 21 km.", "c) Người đi một vòng quanh hồ có độ dịch chuyển bằng 0.", "d) Quãng đường của người đi quanh hồ là 1 km."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quãng đường là chu vi hồ, 4 km.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật đi từ A đến B dài 10 km, quay về A (10 km), lại đi đến B (10 km) rồi quay về A (10 km). Quãng đường vật đã đi là bao nhiêu km? (ghi số)", "answer": "40", "explain": "Quãng đường: 10 + 10 + 10 + 10 = 40 km.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong tình huống trên, độ lớn độ dịch chuyển của vật là bao nhiêu km? (ghi số)", "answer": "0", "explain": "Vật kết thúc tại A (điểm xuất phát) nên độ dịch chuyển bằng 0.", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Để xác định vị trí của một vật chuyển động, cần chọn", "options": ["A. một vật làm mốc và một hệ tọa độ gắn với vật mốc.", "B. một chiếc đồng hồ.", "C. một chiếc thước duy nhất.", "D. một người quan sát."], "answer": "A", "explain": "Vị trí của vật được xác định so với vật làm mốc trong hệ tọa độ gắn với vật mốc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trường hợp nào sau đây có thể coi vật là chất điểm?", "options": ["A. Ô tô đang chạy trên quãng đường dài.", "B. Ô tô đang vào gara chật hẹp.", "C. Quả bóng đang được cầu thủ sút.", "D. Viên bi đang lăn trên bàn ngắn."], "answer": "A", "explain": "Trên quãng đường dài, kích thước ô tô nhỏ không đáng kể nên coi là chất điểm; các trường hợp còn lại kích thước vật ảnh hưởng đến hiện tượng đang xét.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một máy bay bay 200 km về phía đông rồi quay đầu bay 200 km về phía tây. Độ lớn độ dịch chuyển của máy bay là", "options": ["A. 0.", "B. 200 km.", "C. 400 km.", "D. 100 km."], "answer": "A", "explain": "Máy bay về đúng điểm xuất phát nên độ dịch chuyển bằng 0.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quãng đường máy bay đã bay trong tình huống trên là", "options": ["A. 400 km.", "B. 0.", "C. 200 km.", "D. 100 km."], "answer": "A", "explain": "Quãng đường: 200 + 200 = 400 km.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một cầu thủ chạy 30 m về phía đông rồi 40 m về phía bắc (hai hướng vuông góc). Độ lớn độ dịch chuyển của cầu thủ là", "options": ["A. 50 m.", "B. 70 m.", "C. 10 m.", "D. 1200 m."], "answer": "A", "explain": "Độ lớn độ dịch chuyển $= \\sqrt{30^2 + 40^2} = 50$ m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật đi từ A đến B dài 4 km về phía đông, rồi từ B đến C dài 3 km về phía tây (ngược hướng AB). Độ lớn độ dịch chuyển từ A đến C là", "options": ["A. 1 km.", "B. 7 km.", "C. 5 km.", "D. 12 km."], "answer": "A", "explain": "Chọn chiều dương về phía đông: độ dịch chuyển = 4 - 3 = 1 km, độ lớn là 1 km.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vị trí của vật được xác định so với vật làm mốc.", "b) Ô tô trên đường dài có thể coi là chất điểm.", "c) Máy bay bay đi rồi về chỗ cũ có độ dịch chuyển bằng 0.", "d) Quãng đường của máy bay trên bằng 0."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quãng đường là 400 km.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cầu thủ chạy 30 m đông, 40 m bắc có độ lớn độ dịch chuyển 50 m.", "b) Quãng đường của cầu thủ trên là 70 m.", "c) Vật đi 4 km đông rồi 3 km tây có độ lớn độ dịch chuyển 1 km.", "d) Quãng đường của vật trên là 1 km."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quãng đường là 4 + 3 = 7 km.", "points": 1}, {"type": "short", "level": "VD", "q": "Một xe đi từ A đến B dài 7 km rồi quay ngược lại, dừng ở A (điểm xuất phát). Quãng đường xe đã đi là bao nhiêu km? (ghi số)", "answer": "14", "explain": "Quãng đường: 7 + 7 = 14 km.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong tình huống trên, độ lớn độ dịch chuyển của xe là bao nhiêu km? (ghi số)", "answer": "0", "explain": "Xe về đúng điểm xuất phát nên độ dịch chuyển bằng 0.", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các đại lượng sau, đại lượng nào là đại lượng vectơ?", "options": ["A. Độ dịch chuyển.", "B. Quãng đường.", "C. Thời gian.", "D. Khối lượng."], "answer": "A", "explain": "Độ dịch chuyển có cả độ lớn và hướng nên là đại lượng vectơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các đại lượng sau, đại lượng nào là đại lượng vô hướng?", "options": ["A. Quãng đường.", "B. Độ dịch chuyển.", "C. Vận tốc.", "D. Gia tốc."], "answer": "A", "explain": "Quãng đường chỉ có độ lớn nên là đại lượng vô hướng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người đi chợ cách nhà 2 km rồi quay về nhà. Độ dịch chuyển của người này là", "options": ["A. 0.", "B. 2 km.", "C. 4 km.", "D. 1 km."], "answer": "A", "explain": "Về đúng nhà (điểm xuất phát) nên độ dịch chuyển bằng 0.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quãng đường người này đã đi là", "options": ["A. 4 km.", "B. 0.", "C. 2 km.", "D. 1 km."], "answer": "A", "explain": "Quãng đường: 2 + 2 = 4 km.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một con thuyền đi 8 km về phía đông rồi 6 km về phía bắc (hai hướng vuông góc). Độ lớn độ dịch chuyển của thuyền là", "options": ["A. 10 km.", "B. 14 km.", "C. 2 km.", "D. 48 km."], "answer": "A", "explain": "Độ lớn độ dịch chuyển $= \\sqrt{8^2 + 6^2} = 10$ km.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật đi nửa vòng tròn từ A đến B (A, B là hai đầu đường kính), bán kính đường tròn là 10 m. Độ lớn độ dịch chuyển từ A đến B là", "options": ["A. 20 m.", "B. 10 m.", "C. 31,4 m.", "D. 5 m."], "answer": "A", "explain": "Độ dịch chuyển là vectơ nối A đến B, độ lớn bằng đường kính: 2 x 10 = 20 m. (Quãng đường là nửa chu vi: khoảng 31,4 m.)", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Độ dịch chuyển là đại lượng vectơ.", "b) Quãng đường là đại lượng vô hướng.", "c) Người đi chợ rồi về nhà có độ dịch chuyển bằng 0.", "d) Quãng đường của người này bằng 0."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quãng đường là 4 km.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thuyền đi 8 km đông, 6 km bắc có độ lớn độ dịch chuyển 10 km.", "b) Quãng đường của thuyền trên là 14 km.", "c) Vật đi nửa vòng tròn bán kính 10 m có độ lớn độ dịch chuyển 20 m.", "d) Quãng đường của vật trên là 20 m."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quãng đường là nửa chu vi, khoảng 31,4 m.", "points": 1}, {"type": "short", "level": "VD", "q": "Một người đi 5 km về phía đông rồi quay lại 2 km về phía tây. Quãng đường người này đã đi là bao nhiêu km? (ghi số)", "answer": "7", "explain": "Quãng đường: 5 + 2 = 7 km.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong tình huống trên, độ lớn độ dịch chuyển của người này là bao nhiêu km? (ghi số)", "answer": "3", "explain": "Chọn chiều dương về phía đông: độ dịch chuyển = 5 - 2 = 3 km, độ lớn là 3 km.", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Quỹ đạo chuyển động của vật là", "options": ["A. đường mà vật vạch ra trong quá trình chuyển động.", "B. vectơ nối điểm đầu và điểm cuối.", "C. thời gian vật chuyển động.", "D. tốc độ của vật."], "answer": "A", "explain": "Quỹ đạo là đường mà vật vạch ra khi chuyển động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Độ dài của quỹ đạo mà vật đã đi qua chính là", "options": ["A. quãng đường đi được.", "B. độ dịch chuyển.", "C. vận tốc.", "D. gia tốc."], "answer": "A", "explain": "Quãng đường là độ dài của quỹ đạo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vận động viên bơi 50 m rồi quay lại 50 m về đúng điểm xuất phát. Độ lớn độ dịch chuyển là", "options": ["A. 0.", "B. 50 m.", "C. 100 m.", "D. 25 m."], "answer": "A", "explain": "Về đúng điểm xuất phát nên độ dịch chuyển bằng 0.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quãng đường vận động viên đã bơi là", "options": ["A. 100 m.", "B. 0.", "C. 50 m.", "D. 25 m."], "answer": "A", "explain": "Quãng đường: 50 + 50 = 100 m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một xe ô tô đi 12 km về phía nam rồi 5 km về phía đông (hai hướng vuông góc). Độ lớn độ dịch chuyển của xe là", "options": ["A. 13 km.", "B. 17 km.", "C. 7 km.", "D. 60 km."], "answer": "A", "explain": "Độ lớn độ dịch chuyển $= \\sqrt{12^2 + 5^2} = 13$ km.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người đi từ A đến B dài 10 km, rồi quay ngược lại đến C. Biết C nằm giữa A và B, cách A 4 km. Độ lớn độ dịch chuyển từ A đến C là", "options": ["A. 4 km.", "B. 10 km.", "C. 16 km.", "D. 6 km."], "answer": "A", "explain": "Điểm cuối là C cách A 4 km nên độ lớn độ dịch chuyển là 4 km. (Quãng đường: 10 + 6 = 16 km.)", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quỹ đạo là đường mà vật vạch ra khi chuyển động.", "b) Quãng đường là độ dài của quỹ đạo.", "c) VĐV bơi về điểm xuất phát có độ dịch chuyển bằng 0.", "d) Quãng đường của VĐV trên bằng 0."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quãng đường là 100 m.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xe đi 12 km nam, 5 km đông có độ lớn độ dịch chuyển 13 km.", "b) Quãng đường của xe trên là 17 km.", "c) Người đi từ A đến C (cách A 4 km) có độ lớn độ dịch chuyển 4 km.", "d) Quãng đường của người này là 4 km."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quãng đường là 10 + 6 = 16 km.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong tình huống người đi từ A đến B (10 km) rồi quay lại C (cách A 4 km) ở trên, quãng đường người này đã đi là bao nhiêu km? (ghi số)", "answer": "16", "explain": "Quãng đường: AB + BC = 10 + 6 = 16 km.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật đi từ A đến B dài 9 km rồi quay về A. Độ lớn độ dịch chuyển của vật là bao nhiêu km? (ghi số)", "answer": "0", "explain": "Vật về đúng điểm xuất phát nên độ dịch chuyển bằng 0.", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Khi vật quay về đúng vị trí ban đầu thì", "options": ["A. vectơ độ dịch chuyển bằng vectơ không.", "B. quãng đường đi được bằng 0.", "C. vật không hề chuyển động.", "D. thời gian chuyển động bằng 0."], "answer": "A", "explain": "Vị trí đầu trùng vị trí cuối nên vectơ độ dịch chuyển bằng 0.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi vật quay về đúng vị trí ban đầu thì quãng đường đi được", "options": ["A. lớn hơn 0.", "B. bằng 0.", "C. mang giá trị âm.", "D. không xác định được."], "answer": "A", "explain": "Vật đã thực sự di chuyển nên quãng đường (độ dài quỹ đạo) lớn hơn 0.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một đoàn tàu đi 15 km về phía trước rồi lùi lại 15 km về đúng vị trí ban đầu. Quãng đường tàu đã đi là", "options": ["A. 30 km.", "B. 0.", "C. 15 km.", "D. 7,5 km."], "answer": "A", "explain": "Quãng đường: 15 + 15 = 30 km.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Độ lớn độ dịch chuyển của đoàn tàu trên là", "options": ["A. 0.", "B. 15 km.", "C. 30 km.", "D. 7,5 km."], "answer": "A", "explain": "Tàu về đúng vị trí ban đầu nên độ dịch chuyển bằng 0.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một con kiến bò 9 m về phía đông rồi 12 m về phía bắc (hai hướng vuông góc). Độ lớn độ dịch chuyển của con kiến là", "options": ["A. 15 m.", "B. 21 m.", "C. 3 m.", "D. 108 m."], "answer": "A", "explain": "Độ lớn độ dịch chuyển $= \\sqrt{9^2 + 12^2} = 15$ m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật đi từ A đến B dài 6 km về phía bắc, rồi từ B đến C dài 8 km về phía đông, rồi từ C đến D dài 6 km về phía nam. Độ lớn độ dịch chuyển từ A đến D là", "options": ["A. 8 km.", "B. 20 km.", "C. 6 km.", "D. 14 km."], "answer": "A", "explain": "Đoạn đi về phía bắc và phía nam triệt tiêu nhau (6 km - 6 km = 0), còn lại 8 km về phía đông nên độ lớn độ dịch chuyển là 8 km.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật quay về vị trí ban đầu có vectơ độ dịch chuyển bằng 0.", "b) Quãng đường khi đó lớn hơn 0.", "c) Đoàn tàu đi 15 km rồi lùi 15 km có quãng đường 30 km.", "d) Độ dịch chuyển của đoàn tàu trên là 30 km."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: độ dịch chuyển bằng 0.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kiến bò 9 m đông, 12 m bắc có độ lớn độ dịch chuyển 15 m.", "b) Quãng đường của con kiến trên là 21 m.", "c) Vật đi A-B-C-D như trên có độ lớn độ dịch chuyển 8 km.", "d) Quãng đường của vật trên là 8 km."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quãng đường là 6 + 8 + 6 = 20 km.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong tình huống vật đi từ A đến D ở trên, quãng đường vật đã đi là bao nhiêu km? (ghi số)", "answer": "20", "explain": "Quãng đường: 6 + 8 + 6 = 20 km.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một người đi 2 km về phía đông, 2 km về phía bắc, 2 km về phía tây rồi 2 km về phía nam, trở về điểm xuất phát. Độ lớn độ dịch chuyển là bao nhiêu km? (ghi số)", "answer": "0", "explain": "Người trở về điểm xuất phát nên độ dịch chuyển bằng 0.", "points": 0.5}]},
{"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng về độ dịch chuyển?", "options": ["A. Là vectơ nối vị trí đầu đến vị trí cuối của chuyển động.", "B. Là độ dài của toàn bộ quỹ đạo.", "C. Luôn có giá trị dương.", "D. Không bao giờ bằng 0."], "answer": "A", "explain": "Định nghĩa độ dịch chuyển.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng về quãng đường đi được?", "options": ["A. Là độ dài của quỹ đạo, không bao giờ âm.", "B. Là vectơ có hướng xác định.", "C. Có thể mang giá trị âm.", "D. Chỉ phụ thuộc điểm đầu và điểm cuối."], "answer": "A", "explain": "Quãng đường là độ dài quỹ đạo, là đại lượng vô hướng không âm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một xe buýt đi 5 km rồi quay đầu đi tiếp 5 km về đúng bến cũ. Độ dịch chuyển của xe là", "options": ["A. 0.", "B. 5 km.", "C. 10 km.", "D. 2,5 km."], "answer": "A", "explain": "Xe về đúng bến cũ nên độ dịch chuyển bằng 0.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quãng đường xe buýt đã đi là", "options": ["A. 10 km.", "B. 0.", "C. 5 km.", "D. 2,5 km."], "answer": "A", "explain": "Quãng đường: 5 + 5 = 10 km.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người đi 20 m về phía đông rồi 15 m về phía bắc (hai hướng vuông góc). Độ lớn độ dịch chuyển của người này là", "options": ["A. 25 m.", "B. 35 m.", "C. 5 m.", "D. 300 m."], "answer": "A", "explain": "Độ lớn độ dịch chuyển $= \\sqrt{20^2 + 15^2} = 25$ m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật đi 3 cạnh liên tiếp của hình vuông cạnh 2 km theo thứ tự A đến B đến C đến D. Độ lớn độ dịch chuyển từ A đến D là", "options": ["A. 2 km.", "B. 6 km.", "C. 4 km.", "D. 8 km."], "answer": "A", "explain": "Đi 3 cạnh của hình vuông thì điểm cuối D đối diện với B qua cạnh AD; đoạn AD chính là một cạnh hình vuông dài 2 km.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Độ dịch chuyển là vectơ nối vị trí đầu đến vị trí cuối.", "b) Quãng đường là độ dài quỹ đạo, không âm.", "c) Xe buýt về đúng bến cũ có độ dịch chuyển bằng 0.", "d) Quãng đường của xe buýt trên bằng 0."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quãng đường là 10 km.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Người đi 20 m đông, 15 m bắc có độ lớn độ dịch chuyển 25 m.", "b) Quãng đường của người này là 35 m.", "c) Vật đi 3 cạnh hình vuông cạnh 2 km có độ lớn độ dịch chuyển 2 km.", "d) Quãng đường của vật trên là 2 km."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quãng đường là 3 x 2 = 6 km.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong tình huống vật đi 3 cạnh hình vuông cạnh 2 km ở trên, quãng đường vật đã đi là bao nhiêu km? (ghi số)", "answer": "6", "explain": "Quãng đường: 3 x 2 = 6 km.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật đi từ A đến B dài 4 km, rồi đi tiếp đến C dài 4 km sao cho A, B, C thẳng hàng theo đúng thứ tự. Độ lớn độ dịch chuyển từ A đến C là bao nhiêu km? (ghi số)", "answer": "8", "explain": "Ba điểm thẳng hàng theo thứ tự nên AC = 4 + 4 = 8 km.", "points": 0.5}]}]}
