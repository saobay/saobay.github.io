{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Cổng quang điện kết hợp với đồng hồ đo thời gian hiện số dùng để", "options": ["A. đo khoảng thời gian rất ngắn khi vật đi qua cổng.", "B. đo khối lượng của vật.", "C. đo nhiệt độ của vật.", "D. chụp ảnh vật chuyển động."], "answer": "A", "explain": "Cổng quang điện phát hiện vật chắn tia sáng và đồng hồ hiện số đo khoảng thời gian chắn sáng rất ngắn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Súng bắn tốc độ của cảnh sát giao thông dùng để đo", "options": ["A. tốc độ tức thời của phương tiện.", "B. tốc độ trung bình của phương tiện.", "C. quãng đường phương tiện đã đi.", "D. khối lượng phương tiện."], "answer": "A", "explain": "Súng bắn tốc độ đo tốc độ tức thời của phương tiện tại thời điểm đo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vận động viên chạy 100 m trong 10 s. Tốc độ trung bình của vận động viên là", "options": ["A. 10 m/s.", "B. 1000 m/s.", "C. 0,1 m/s.", "D. 90 m/s."], "answer": "A", "explain": "$v_{tb} = \\frac{100}{10} = 10$ m/s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đổi 36 km/h sang m/s được", "options": ["A. 10 m/s.", "B. 36 m/s.", "C. 129,6 m/s.", "D. 1 m/s."], "answer": "A", "explain": "$\\frac{36}{3,6} = 10$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một xe ô tô đi nửa quãng đường đầu với tốc độ 60 km/h, nửa quãng đường sau với tốc độ 40 km/h. Tốc độ trung bình trên cả quãng đường là", "options": ["A. 48 km/h.", "B. 50 km/h.", "C. 100 km/h.", "D. 24 km/h."], "answer": "A", "explain": "Gọi quãng đường là $2s$: thời gian $t = \\frac{s}{60} + \\frac{s}{40} = \\frac{5s}{120}$. Tốc độ trung bình $= \\frac{2s}{t} = \\frac{240}{5} = 48$ km/h. (Không phải trung bình cộng 50 km/h.)", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật đi từ A đến B rồi quay về A. So sánh tốc độ trung bình và độ lớn của vận tốc trung bình của vật.", "options": ["A. Tốc độ trung bình lớn hơn 0, độ lớn vận tốc trung bình bằng 0.", "B. Cả hai đều bằng 0.", "C. Tốc độ trung bình bằng 0, độ lớn vận tốc trung bình lớn hơn 0.", "D. Cả hai đều lớn hơn 0 và bằng nhau."], "answer": "A", "explain": "Vật đi rồi về nên độ dịch chuyển bằng 0 (vận tốc trung bình bằng 0) nhưng quãng đường lớn hơn 0 nên tốc độ trung bình lớn hơn 0.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cổng quang điện giúp đo khoảng thời gian rất ngắn.", "b) Súng bắn tốc độ đo tốc độ tức thời.", "c) Tốc độ trung bình trên nửa quãng đường 60 km/h và nửa còn lại 40 km/h là 50 km/h.", "d) Vật đi rồi về chỗ cũ có độ lớn vận tốc trung bình bằng 0."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: tốc độ trung bình là 48 km/h (trung bình điều hòa), không phải 50 km/h.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) VĐV chạy 100 m trong 10 s có tốc độ trung bình 10 m/s.", "b) 36 km/h = 10 m/s.", "c) Tốc độ trung bình luôn bằng trung bình cộng của các tốc độ thành phần.", "d) Khi đi rồi về, tốc độ trung bình lớn hơn độ lớn vận tốc trung bình."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: ví dụ trên cho thấy tốc độ trung bình là 48 km/h chứ không phải 50 km/h.", "points": 1}, {"type": "short", "level": "VD", "q": "Một người đi bộ 6 km trong 1,5 giờ. Tốc độ trung bình của người này là bao nhiêu km/h? (ghi số)", "answer": "4", "explain": "$v_{tb} = \\frac{6}{1,5} = 4$ km/h.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đổi 30 m/s sang km/h được bao nhiêu? (ghi số)", "answer": "108", "explain": "$30 \\times 3,6 = 108$ km/h.", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Tốc độ là đại lượng", "options": ["A. vô hướng.", "B. vectơ.", "C. không có đơn vị.", "D. luôn âm."], "answer": "A", "explain": "Tốc độ chỉ cho biết sự nhanh chậm (độ lớn) nên là đại lượng vô hướng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vận tốc cho biết", "options": ["A. cả hướng chuyển động và sự nhanh chậm của chuyển động.", "B. chỉ sự nhanh chậm của chuyển động.", "C. chỉ hướng chuyển động.", "D. khối lượng của vật."], "answer": "A", "explain": "Vận tốc là đại lượng vectơ, cho biết cả hướng và sự nhanh chậm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một con thuyền đi 30 km trong 1 giờ. Tốc độ trung bình của thuyền là", "options": ["A. 30 km/h.", "B. 15 km/h.", "C. 60 km/h.", "D. 300 km/h."], "answer": "A", "explain": "$v_{tb} = \\frac{30}{1} = 30$ km/h.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đổi 18 km/h sang m/s được", "options": ["A. 5 m/s.", "B. 18 m/s.", "C. 64,8 m/s.", "D. 1,8 m/s."], "answer": "A", "explain": "$\\frac{18}{3,6} = 5$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật đi 8 m về phía đông mất 2 s rồi đi 6 m về phía tây mất 2 s. Tốc độ trung bình của vật là", "options": ["A. 3,5 m/s.", "B. 0,5 m/s.", "C. 7 m/s.", "D. 2 m/s."], "answer": "A", "explain": "Tốc độ trung bình $v_{tb} = \\frac{8 + 6}{2 + 2} = 3,5$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong tình huống trên, vận tốc trung bình của vật (chọn chiều dương về phía đông) là", "options": ["A. 0,5 m/s.", "B. 3,5 m/s.", "C. -0,5 m/s.", "D. 0."], "answer": "A", "explain": "Độ dịch chuyển = 8 - 6 = 2 m; vận tốc trung bình $v = \\frac{2}{4} = 0,5$ m/s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tốc độ là đại lượng vô hướng.", "b) Vận tốc cho biết cả hướng và sự nhanh chậm.", "c) 18 km/h = 5 m/s.", "d) Vận tốc trung bình không bao giờ âm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vận tốc trung bình có thể âm khi ngược chiều dương.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật đi 8 m đông (2 s) rồi 6 m tây (2 s) có tốc độ trung bình 3,5 m/s.", "b) Vận tốc trung bình của vật trên (chiều dương về đông) là 0,5 m/s.", "c) Tốc độ trung bình luôn lớn hơn hoặc bằng độ lớn vận tốc trung bình.", "d) Thuyền đi 30 km trong 1 giờ có tốc độ trung bình 30 km/h."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng ($s \\ge |\\Delta d|$ nên $v_{tb} \\ge |v|$).", "points": 1}, {"type": "short", "level": "VD", "q": "Một ô tô đi 200 km trong 4 giờ. Tốc độ trung bình của ô tô là bao nhiêu km/h? (ghi số)", "answer": "50", "explain": "$v_{tb} = \\frac{200}{4} = 50$ km/h.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật có bề rộng 2 cm đi qua cổng quang điện trong 0,005 s. Tốc độ của vật là bao nhiêu m/s? (ghi số)", "answer": "4", "explain": "$v = \\frac{0,02}{0,005} = 4$ m/s.", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Muốn đo gần đúng tốc độ tức thời của vật, nên dùng", "options": ["A. cổng quang điện.", "B. thước dây.", "C. cân đồng hồ.", "D. nhiệt kế."], "answer": "A", "explain": "Cổng quang điện đo được khoảng thời gian rất ngắn khi vật đi qua, cho tốc độ gần với tốc độ tức thời.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cảm biến chuyển động trong phòng thí nghiệm có thể", "options": ["A. tự động ghi lại vị trí của vật theo thời gian.", "B. tự động cân khối lượng của vật.", "C. tự động đo nhiệt độ của vật.", "D. tự động phát ra âm thanh."], "answer": "A", "explain": "Cảm biến chuyển động (siêu âm) ghi vị trí theo thời gian, từ đó vẽ đồ thị và tính vận tốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một xe lửa đi 240 km trong 4 giờ. Tốc độ trung bình của xe lửa là", "options": ["A. 60 km/h.", "B. 960 km/h.", "C. 120 km/h.", "D. 30 km/h."], "answer": "A", "explain": "$v_{tb} = \\frac{240}{4} = 60$ km/h.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đổi 12 m/s sang km/h được", "options": ["A. 43,2 km/h.", "B. 12 km/h.", "C. 3,33 km/h.", "D. 120 km/h."], "answer": "A", "explain": "$12 \\times 3,6 = 43,2$ km/h.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người đi 4 km trong 1 giờ rồi đi tiếp 6 km trong 1 giờ nữa, cùng một hướng. Tốc độ trung bình của người này là", "options": ["A. 5 km/h.", "B. 10 km/h.", "C. 4 km/h.", "D. 6 km/h."], "answer": "A", "explain": "$v_{tb} = \\frac{4 + 6}{1 + 1} = 5$ km/h (cũng bằng vận tốc trung bình vì cùng hướng).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người đi 4 km về phía đông trong 1 giờ rồi quay lại 4 km về phía tây trong 1 giờ nữa. Tốc độ trung bình của người này là", "options": ["A. 4 km/h.", "B. 0.", "C. 8 km/h.", "D. 2 km/h."], "answer": "A", "explain": "Tốc độ trung bình $v_{tb} = \\frac{4 + 4}{1 + 1} = 4$ km/h (vận tốc trung bình bằng 0).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cổng quang điện giúp đo gần đúng tốc độ tức thời.", "b) Cảm biến chuyển động ghi vị trí của vật theo thời gian.", "c) Xe lửa đi 240 km trong 4 giờ có tốc độ trung bình 60 km/h.", "d) 12 m/s = 43,2 km/h."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Người đi 4 km (1 h) rồi 6 km (1 h) cùng hướng có tốc độ trung bình 5 km/h.", "b) Người đi 4 km đông (1 h) rồi 4 km tây (1 h) có tốc độ trung bình 4 km/h.", "c) Vận tốc trung bình của người trong câu b) bằng 0.", "d) Tốc độ trung bình của người trong câu b) bằng 0."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tốc độ trung bình là 4 km/h.", "points": 1}, {"type": "short", "level": "VD", "q": "Một máy bay bay 1200 km trong 2 giờ. Tốc độ trung bình của máy bay là bao nhiêu km/h? (ghi số)", "answer": "600", "explain": "$v_{tb} = \\frac{1200}{2} = 600$ km/h.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đổi 22 m/s sang km/h được bao nhiêu (làm tròn đến một chữ số thập phân)? (ghi số)", "answer": "79.2", "explain": "$22 \\times 3,6 = 79,2$ km/h.", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Vận tốc tức thời là đại lượng", "options": ["A. vectơ.", "B. vô hướng.", "C. không có hướng.", "D. luôn dương."], "answer": "A", "explain": "Vận tốc (kể cả tức thời) là đại lượng vectơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tốc độ tức thời là", "options": ["A. độ lớn của vận tốc tức thời.", "B. hướng của vận tốc tức thời.", "C. quãng đường vật đã đi.", "D. thời gian vật chuyển động."], "answer": "A", "explain": "Tốc độ tức thời chính là độ lớn của vectơ vận tốc tức thời.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một ca nô đi 36 km trong 1,5 giờ. Tốc độ trung bình của ca nô là", "options": ["A. 24 km/h.", "B. 54 km/h.", "C. 18 km/h.", "D. 36 km/h."], "answer": "A", "explain": "$v_{tb} = \\frac{36}{1,5} = 24$ km/h.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đổi 90 km/h sang m/s được", "options": ["A. 25 m/s.", "B. 90 m/s.", "C. 324 m/s.", "D. 9 m/s."], "answer": "A", "explain": "$\\frac{90}{3,6} = 25$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật đi từ A đến B dài 30 m mất 5 s, nghỉ 5 s, rồi quay về A mất 5 s. Tốc độ trung bình của vật là", "options": ["A. 4 m/s.", "B. 0.", "C. 6 m/s.", "D. 2 m/s."], "answer": "A", "explain": "Tốc độ trung bình $v_{tb} = \\frac{30 + 30}{5 + 5 + 5} = \\frac{60}{15} = 4$ m/s (thời gian nghỉ vẫn tính).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong tình huống trên, vận tốc trung bình của vật là", "options": ["A. 0.", "B. 4 m/s.", "C. 2 m/s.", "D. 6 m/s."], "answer": "A", "explain": "Vật về đúng A nên độ dịch chuyển bằng 0, vận tốc trung bình bằng 0.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vận tốc tức thời là đại lượng vectơ.", "b) Tốc độ tức thời là độ lớn của vận tốc tức thời.", "c) Ca nô đi 36 km trong 1,5 giờ có tốc độ trung bình 24 km/h.", "d) 90 km/h = 25 m/s."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thời gian nghỉ vẫn được tính khi tính tốc độ trung bình.", "b) Vật đi từ A đến B (30 m, 5 s), nghỉ 5 s, về A (5 s) có tốc độ trung bình 4 m/s.", "c) Vận tốc trung bình của vật trên bằng 0.", "d) Tốc độ trung bình của vật trên bằng 0."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tốc độ trung bình là 4 m/s.", "points": 1}, {"type": "short", "level": "VD", "q": "Một người chạy 5 km trong 25 phút. Tốc độ trung bình của người này là bao nhiêu km/h? (ghi số)", "answer": "12", "explain": "25 phút = $\\frac{5}{12}$ giờ. $v_{tb} = \\frac{5}{5/12} = 12$ km/h.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật có bề rộng 10 cm đi qua cổng quang điện trong 0,04 s. Tốc độ của vật là bao nhiêu m/s? (ghi số)", "answer": "2.5", "explain": "$v = \\frac{0,1}{0,04} = 2,5$ m/s.", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Đơn vị km/h thường được dùng", "options": ["A. trong đời sống hằng ngày (tốc độ xe cộ).", "B. trong hệ SI.", "C. để đo khối lượng.", "D. để đo thời gian."], "answer": "A", "explain": "km/h là đơn vị thông dụng trong đời sống; đơn vị SI là m/s.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đơn vị m/s là đơn vị của tốc độ trong", "options": ["A. hệ SI.", "B. hệ đo lường cổ.", "C. hệ đo lường Anh.", "D. hệ đo lường tự chế."], "answer": "A", "explain": "m/s là đơn vị của tốc độ, vận tốc trong hệ SI.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một tàu thủy đi 48 km trong 2 giờ. Tốc độ trung bình của tàu là", "options": ["A. 24 km/h.", "B. 96 km/h.", "C. 12 km/h.", "D. 48 km/h."], "answer": "A", "explain": "$v_{tb} = \\frac{48}{2} = 24$ km/h.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đổi 5 m/s sang km/h được", "options": ["A. 18 km/h.", "B. 5 km/h.", "C. 1,39 km/h.", "D. 50 km/h."], "answer": "A", "explain": "$5 \\times 3,6 = 18$ km/h.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một xe ô tô đi 2 giờ đầu với tốc độ 50 km/h, 2 giờ sau với tốc độ 70 km/h. Tốc độ trung bình trên cả quãng đường là", "options": ["A. 60 km/h.", "B. 120 km/h.", "C. 35 km/h.", "D. 58,3 km/h."], "answer": "A", "explain": "Quãng đường: $50 \\times 2 + 70 \\times 2 = 240$ km; thời gian 4 giờ. $v_{tb} = \\frac{240}{4} = 60$ km/h.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "So sánh tốc độ của hai vật: vật A đi 100 m trong 10 s, vật B đi 150 m trong 20 s. Kết luận đúng là", "options": ["A. Vật A nhanh hơn vật B.", "B. Vật B nhanh hơn vật A.", "C. Hai vật nhanh như nhau.", "D. Không so sánh được."], "answer": "A", "explain": "Tốc độ A: $\\frac{100}{10} = 10$ m/s; tốc độ B: $\\frac{150}{20} = 7,5$ m/s. Vậy A nhanh hơn B.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) km/h là đơn vị thông dụng trong đời sống.", "b) m/s là đơn vị của tốc độ trong hệ SI.", "c) Tàu đi 48 km trong 2 giờ có tốc độ trung bình 24 km/h.", "d) 5 m/s = 18 km/h."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xe đi 2 h đầu 50 km/h, 2 h sau 70 km/h có tốc độ trung bình 60 km/h.", "b) Vật A (100 m/10 s) nhanh hơn vật B (150 m/20 s).", "c) Muốn so sánh sự nhanh chậm phải so sánh tốc độ, không so sánh quãng đường hay thời gian riêng lẻ.", "d) Vật đi quãng đường dài hơn luôn nhanh hơn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phải so sánh tốc độ (quãng đường trên cùng thời gian).", "points": 1}, {"type": "short", "level": "VD", "q": "Một xe tải đi 75 km trong 1,5 giờ. Tốc độ trung bình của xe là bao nhiêu km/h? (ghi số)", "answer": "50", "explain": "$v_{tb} = \\frac{75}{1,5} = 50$ km/h.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đổi 8 m/s sang km/h được bao nhiêu? (ghi số)", "answer": "28.8", "explain": "$8 \\times 3,6 = 28,8$ km/h.", "points": 0.5}]},
{"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Công thức tính tốc độ trung bình là", "options": ["A. $v_{tb} = \\frac{s}{t}$.", "B. $v_{tb} = \\frac{t}{s}$.", "C. $v_{tb} = s \\times t$.", "D. $v_{tb} = s - t$."], "answer": "A", "explain": "$v_{tb} = \\frac{s}{t}$: quãng đường chia cho thời gian.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Công thức tính vận tốc trung bình là", "options": ["A. $v = \\frac{\\Delta d}{\\Delta t}$.", "B. $v = \\frac{\\Delta t}{\\Delta d}$.", "C. $v = \\Delta d \\times \\Delta t$.", "D. $v = \\Delta d - \\Delta t$."], "answer": "A", "explain": "$v = \\frac{\\Delta d}{\\Delta t}$: độ dịch chuyển chia cho thời gian.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người đi xe đạp 15 km trong 1 giờ. Tốc độ trung bình của người này là", "options": ["A. 15 km/h.", "B. 7,5 km/h.", "C. 30 km/h.", "D. 150 km/h."], "answer": "A", "explain": "$v_{tb} = \\frac{15}{1} = 15$ km/h.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đổi 108 km/h sang m/s được", "options": ["A. 30 m/s.", "B. 108 m/s.", "C. 388,8 m/s.", "D. 3 m/s."], "answer": "A", "explain": "$\\frac{108}{3,6} = 30$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật chuyển động trong nửa thời gian đầu với tốc độ 40 km/h, nửa thời gian sau với tốc độ 60 km/h. Tốc độ trung bình của vật là", "options": ["A. 50 km/h.", "B. 48 km/h.", "C. 100 km/h.", "D. 24 km/h."], "answer": "A", "explain": "Gọi tổng thời gian là $2t$: quãng đường $= 40t + 60t = 100t$. Tốc độ trung bình $= \\frac{100t}{2t} = 50$ km/h. (Chú ý: khác với trường hợp chia nửa quãng đường.)", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật chuyển động thẳng đều với tốc độ 20 m/s trong 10 s. Quãng đường vật đi được là", "options": ["A. 200 m.", "B. 2 m.", "C. 30 m.", "D. 0,5 m."], "answer": "A", "explain": "$s = v \\times t = 20 \\times 10 = 200$ m.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $v_{tb} = \\frac{s}{t}$.", "b) $v = \\frac{\\Delta d}{\\Delta t}$.", "c) Người đi xe đạp 15 km trong 1 giờ có tốc độ trung bình 15 km/h.", "d) 108 km/h = 30 m/s."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật đi nửa thời gian đầu 40 km/h, nửa sau 60 km/h có tốc độ trung bình 50 km/h.", "b) Vật chuyển động thẳng đều 20 m/s trong 10 s đi được 200 m.", "c) Chia nửa thời gian và chia nửa quãng đường cho tốc độ trung bình khác nhau.", "d) Tốc độ trung bình không phụ thuộc vào cách chia quãng đường."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng (48 km/h khi chia nửa quãng đường, 50 km/h khi chia nửa thời gian). d) Sai: cách chia ảnh hưởng đến kết quả.", "points": 1}, {"type": "short", "level": "VD", "q": "Một đoàn tàu đi 300 km trong 5 giờ. Tốc độ trung bình của tàu là bao nhiêu km/h? (ghi số)", "answer": "60", "explain": "$v_{tb} = \\frac{300}{5} = 60$ km/h.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật có bề rộng 6 cm đi qua cổng quang điện trong 0,03 s. Tốc độ của vật là bao nhiêu m/s? (ghi số)", "answer": "2", "explain": "$v = \\frac{0,06}{0,03} = 2$ m/s.", "points": 0.5}]}]}
