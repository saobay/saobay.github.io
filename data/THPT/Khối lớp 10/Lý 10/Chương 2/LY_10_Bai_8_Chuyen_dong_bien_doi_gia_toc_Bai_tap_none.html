, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $a = \\frac{v - v_0}{t - t_0}$.", "b) Vectơ gia tốc cùng hướng với vectơ độ biến thiên vận tốc.", "c) Vật giảm từ 15 m/s xuống 5 m/s trong 5 s thì gia tốc là -2 m/s vuông.", "d) Tích $a.v$ nhỏ hơn 0 thì vật nhanh dần."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $a.v$ nhỏ hơn 0 thì chậm dần.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $v = -8$ m/s, $a = -4$ m/s vuông thì vật nhanh dần theo chiều âm.", "b) Tàu tăng từ 10 m/s lên 30 m/s trong 20 s thì gia tốc là 1 m/s vuông.", "c) Gia tốc luôn cùng chiều với vận tốc.", "d) Khi phanh xe, vectơ gia tốc ngược chiều chuyển động."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: khi chậm dần thì ngược chiều.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật tăng tốc từ trạng thái đứng yên lên 9 m/s trong 3 s. Gia tốc của vật là bao nhiêu m/s vuông? (ghi số)", "answer": "3", "explain": "$a = \\frac{9 - 0}{3} = 3$ m/s vuông.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật giảm tốc từ 12 m/s xuống 0 trong 6 s (chiều dương là chiều chuyển động). Gia tốc của vật là bao nhiêu m/s vuông? (ghi số)", "answer": "-2", "explain": "$a = \\frac{0 - 12}{6} = -2$ m/s vuông.", "points": 0.5}]},
{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Chuyển động nhanh dần là chuyển động có", "options": ["A. vận tốc tăng dần theo thời gian.", "B. vận tốc giảm dần theo thời gian.", "C. vận tốc không đổi.", "D. gia tốc bằng 0."], "answer": "A", "explain": "Nhanh dần: độ lớn vận tốc tăng dần.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chuyển động chậm dần là chuyển động có", "options": ["A. vận tốc giảm dần theo thời gian.", "B. vận tốc tăng dần theo thời gian.", "C. vận tốc không đổi.", "D. quãng đường không đổi."], "answer": "A", "explain": "Chậm dần: độ lớn vận tốc giảm dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một xe đạt tốc độ 36 km/h sau 5 s kể từ lúc khởi hành. Gia tốc của xe là (biết 36 km/h = 10 m/s)", "options": ["A. 2 m/s vuông.", "B. 7,2 m/s vuông.", "C. 180 m/s vuông.", "D. 5 m/s vuông."], "answer": "A", "explain": "$a = \\frac{10 - 0}{5} = 2$ m/s vuông.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vật có gia tốc bằng 0 thì", "options": ["A. chuyển động thẳng đều hoặc đứng yên.", "B. chuyển động nhanh dần.", "C. chuyển động chậm dần.", "D. chuyển động tròn."], "answer": "A", "explain": "$a = 0$ nghĩa là vận tốc không đổi: thẳng đều hoặc đứng yên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một máy bay tăng tốc từ 50 m/s lên 90 m/s trong 20 s trên đường băng. Gia tốc của máy bay là", "options": ["A. 2 m/s vuông.", "B. 4 m/s vuông.", "C. 40 m/s vuông.", "D. 0,5 m/s vuông."], "answer": "A", "explain": "$a = \\frac{90 - 50}{20} = 2$ m/s vuông.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật có $v = 12$ m/s và gia tốc $a = -4$ m/s vuông (ngược chiều chuyển động). Sau bao lâu thì vật dừng lại?", "options": ["A. 3 s.", "B. 4 s.", "C. 12 s.", "D. 48 s."], "answer": "A", "explain": "Khi dừng: $v = 0 = 12 - 4t$, suy ra $t = 3$ s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhanh dần: vận tốc tăng dần theo thời gian.", "b) Chậm dần: vận tốc giảm dần theo thời gian.", "c) Gia tốc bằng 0 thì vật chuyển động thẳng đều hoặc đứng yên.", "d) Xe đạt 36 km/h sau 5 s từ lúc khởi hành thì gia tốc là 7,2 m/s vuông."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: 36 km/h = 10 m/s nên gia tốc là 2 m/s vuông.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Máy bay tăng từ 50 m/s lên 90 m/s trong 20 s thì gia tốc là 2 m/s vuông.", "b) Vật có $v = 12$ m/s, $a = -4$ m/s vuông thì dừng sau 3 s.", "c) Gia tốc càng lớn thì vận tốc biến đổi càng nhanh.", "d) Vật đang chậm dần thì gia tốc luôn dương."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: dấu của gia tốc phụ thuộc chiều dương đã chọn.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật tăng tốc từ 6 m/s lên 18 m/s trong 4 s. Gia tốc của vật là bao nhiêu m/s vuông? (ghi số)", "answer": "3", "explain": "$a = \\frac{18 - 6}{4} = 3$ m/s vuông.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật có vận tốc đầu 20 m/s, gia tốc -5 m/s vuông (ngược chiều chuyển động). Sau bao nhiêu giây thì vật dừng lại? (ghi số)", "answer": "4", "explain": "$0 = 20 - 5t$ suy ra $t = 4$ s.", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Gia tốc là đại lượng", "options": ["A. vectơ.", "B. vô hướng.", "C. không có đơn vị.", "D. luôn dương."], "answer": "A", "explain": "Gia tốc là đại lượng vectơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Độ biến thiên vận tốc được kí hiệu là", "options": ["A. $\\Delta v$.", "B. $\\Delta t$.", "C. $\\Delta s$.", "D. $\\Delta d$."], "answer": "A", "explain": "Độ biến thiên vận tốc kí hiệu $\\Delta v = v - v_0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một ô tô giảm tốc từ 54 km/h xuống 0 trong 5 s (biết 54 km/h = 15 m/s, chiều dương là chiều chuyển động). Gia tốc của ô tô là", "options": ["A. -3 m/s vuông.", "B. 3 m/s vuông.", "C. -10,8 m/s vuông.", "D. 10,8 m/s vuông."], "answer": "A", "explain": "$a = \\frac{0 - 15}{5} = -3$ m/s vuông.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Gia tốc và vận tốc trái dấu thì vật chuyển động", "options": ["A. chậm dần.", "B. nhanh dần.", "C. thẳng đều.", "D. đứng yên."], "answer": "A", "explain": "Trái dấu nghĩa là $a.v$ nhỏ hơn 0, vật chậm dần.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật có vận tốc đầu 3 m/s, sau 7 s vận tốc là 17 m/s. Gia tốc của vật là", "options": ["A. 2 m/s vuông.", "B. 14 m/s vuông.", "C. 7 m/s vuông.", "D. 0,5 m/s vuông."], "answer": "A", "explain": "$a = \\frac{17 - 3}{7} = 2$ m/s vuông.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật có vận tốc $v = -15$ m/s và gia tốc $a = 5$ m/s vuông. Vật đang chuyển động", "options": ["A. chậm dần.", "B. nhanh dần.", "C. thẳng đều.", "D. đứng yên."], "answer": "A", "explain": "$a$ và $v$ trái dấu nên vật chậm dần.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Gia tốc là đại lượng vectơ.", "b) Độ biến thiên vận tốc kí hiệu là $\\Delta v$.", "c) Ô tô giảm từ 54 km/h xuống 0 trong 5 s thì gia tốc là -3 m/s vuông.", "d) Gia tốc và vận tốc trái dấu thì vật nhanh dần."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: trái dấu thì chậm dần.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $v = -15$ m/s, $a = 5$ m/s vuông thì vật chậm dần.", "b) Vật tăng từ 3 m/s lên 17 m/s trong 7 s thì gia tốc là 2 m/s vuông.", "c) 54 km/h = 15 m/s.", "d) Khi xe phanh, gia tốc luôn cùng chiều chuyển động."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: khi phanh, gia tốc ngược chiều chuyển động.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật tăng tốc từ 5 m/s lên 20 m/s trong 5 s. Gia tốc của vật là bao nhiêu m/s vuông? (ghi số)", "answer": "3", "explain": "$a = \\frac{20 - 5}{5} = 3$ m/s vuông.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật giảm tốc từ 16 m/s xuống 4 m/s trong 6 s (chiều dương là chiều chuyển động). Gia tốc của vật là bao nhiêu m/s vuông? (ghi số)", "answer": "-2", "explain": "$a = \\frac{4 - 16}{6} = -2$ m/s vuông.", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Khi vectơ gia tốc cùng chiều với vectơ vận tốc, vật chuyển động", "options": ["A. nhanh dần.", "B. chậm dần.", "C. thẳng đều.", "D. đứng yên."], "answer": "A", "explain": "Cùng chiều: $a.v$ lớn hơn 0, nhanh dần.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi vectơ gia tốc ngược chiều với vectơ vận tốc, vật chuyển động", "options": ["A. chậm dần.", "B. nhanh dần.", "C. thẳng đều.", "D. tròn đều."], "answer": "A", "explain": "Ngược chiều: $a.v$ nhỏ hơn 0, chậm dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có độ biến thiên vận tốc -8 m/s trong 4 s. Gia tốc của vật là", "options": ["A. -2 m/s vuông.", "B. 2 m/s vuông.", "C. -32 m/s vuông.", "D. 32 m/s vuông."], "answer": "A", "explain": "$a = \\frac{-8}{4} = -2$ m/s vuông.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vật chuyển động nhanh dần đều thì gia tốc", "options": ["A. không đổi và cùng chiều với vận tốc.", "B. thay đổi liên tục.", "C. bằng 0.", "D. ngược chiều với vận tốc."], "answer": "A", "explain": "Nhanh dần đều: $a$ không đổi và cùng chiều $v$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một xe đang chạy 72 km/h thì phanh gấp và dừng hẳn sau 10 s (biết 72 km/h = 20 m/s, chiều dương là chiều chuyển động). Gia tốc của xe là", "options": ["A. -2 m/s vuông.", "B. 2 m/s vuông.", "C. -7,2 m/s vuông.", "D. 7,2 m/s vuông."], "answer": "A", "explain": "$a = \\frac{0 - 20}{10} = -2$ m/s vuông.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật có vận tốc đầu 10 m/s và gia tốc -2 m/s vuông (ngược chiều chuyển động). Vận tốc của vật sau 3 s là", "options": ["A. 4 m/s.", "B. 16 m/s.", "C. 0.", "D. -4 m/s."], "answer": "A", "explain": "$v = v_0 + at = 10 - 2 \\times 3 = 4$ m/s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Gia tốc cùng chiều vận tốc thì vật nhanh dần.", "b) Gia tốc ngược chiều vận tốc thì vật chậm dần.", "c) Vật có độ biến thiên vận tốc -8 m/s trong 4 s thì gia tốc là -2 m/s vuông.", "d) Nhanh dần đều thì gia tốc thay đổi liên tục."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nhanh dần đều thì gia tốc không đổi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xe chạy 72 km/h phanh dừng sau 10 s thì gia tốc là -2 m/s vuông.", "b) Vật có $v_0 = 10$ m/s, $a = -2$ m/s vuông thì sau 3 s vận tốc là 4 m/s.", "c) 72 km/h = 20 m/s.", "d) Vật chậm dần đều thì gia tốc cùng chiều vận tốc."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chậm dần đều thì gia tốc ngược chiều vận tốc.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật tăng tốc từ 8 m/s lên 24 m/s trong 8 s. Gia tốc của vật là bao nhiêu m/s vuông? (ghi số)", "answer": "2", "explain": "$a = \\frac{24 - 8}{8} = 2$ m/s vuông.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật có vận tốc đầu 14 m/s, gia tốc -2 m/s vuông (ngược chiều chuyển động). Sau bao nhiêu giây thì vật dừng lại? (ghi số)", "answer": "7", "explain": "$0 = 14 - 2t$ suy ra $t = 7$ s.", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Dấu của gia tốc một mình", "options": ["A. chưa cho biết vật chuyển động nhanh hay chậm.", "B. đã cho biết vật nhanh hay chậm.", "C. luôn cho biết vật nhanh dần.", "D. luôn cho biết vật chậm dần."], "answer": "A", "explain": "Phải so sánh dấu của $a$ với dấu của $v$ mới biết nhanh hay chậm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Muốn biết vật chuyển động nhanh dần hay chậm dần, ta phải xét", "options": ["A. dấu của gia tốc so với dấu của vận tốc.", "B. chỉ dấu của gia tốc.", "C. chỉ dấu của vận tốc.", "D. độ lớn của gia tốc."], "answer": "A", "explain": "Xét tích $a.v$: cùng dấu thì nhanh dần, trái dấu thì chậm dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật tăng tốc từ 2 m/s lên 8 m/s trong 3 s. Gia tốc của vật là", "options": ["A. 2 m/s vuông.", "B. 6 m/s vuông.", "C. 24 m/s vuông.", "D. 0,5 m/s vuông."], "answer": "A", "explain": "$a = \\frac{8 - 2}{3} = 2$ m/s vuông.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có $v = 10$ m/s và $a = -5$ m/s vuông (ngược chiều chuyển động). Sau 2 s, vận tốc của vật là", "options": ["A. 0.", "B. 20 m/s.", "C. 5 m/s.", "D. -5 m/s."], "answer": "A", "explain": "$v = 10 - 5 \\times 2 = 0$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một tàu điện tăng tốc từ 0 lên 18 m/s trong 9 s. Gia tốc của tàu là", "options": ["A. 2 m/s vuông.", "B. 162 m/s vuông.", "C. 9 m/s vuông.", "D. 0,5 m/s vuông."], "answer": "A", "explain": "$a = \\frac{18 - 0}{9} = 2$ m/s vuông.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật có $v_0 = -20$ m/s và $a = -5$ m/s vuông. Sau 2 s, độ lớn vận tốc của vật là", "options": ["A. 30 m/s.", "B. 10 m/s.", "C. 20 m/s.", "D. 0."], "answer": "A", "explain": "$v = -20 + (-5) \\times 2 = -30$ m/s, độ lớn là 30 m/s (nhanh dần theo chiều âm).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dấu của gia tốc một mình chưa cho biết nhanh hay chậm.", "b) Phải so sánh dấu của $a$ với dấu của $v$.", "c) Vật tăng từ 2 m/s lên 8 m/s trong 3 s thì gia tốc là 2 m/s vuông.", "d) $v = 10$ m/s, $a = -5$ m/s vuông thì sau 2 s vật dừng lại."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $v_0 = -20$ m/s, $a = -5$ m/s vuông thì sau 2 s độ lớn vận tốc là 30 m/s.", "b) Tàu điện tăng từ 0 lên 18 m/s trong 9 s thì gia tốc là 2 m/s vuông.", "c) Vật có $v$ và $a$ cùng âm thì chậm dần.", "d) Vật có $v$ và $a$ cùng âm thì nhanh dần theo chiều âm."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: cùng âm (cùng dấu) thì nhanh dần.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật tăng tốc từ 3 m/s lên 15 m/s trong 6 s. Gia tốc của vật là bao nhiêu m/s vuông? (ghi số)", "answer": "2", "explain": "$a = \\frac{15 - 3}{6} = 2$ m/s vuông.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật giảm tốc từ 9 m/s xuống 3 m/s trong 2 s (chiều dương là chiều chuyển động). Gia tốc của vật là bao nhiêu m/s vuông? (ghi số)", "answer": "-3", "explain": "$a = \\frac{3 - 9}{2} = -3$ m/s vuông.", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Chuyển động biến đổi đều là chuyển động", "options": ["A. có gia tốc không đổi.", "B. có vận tốc không đổi.", "C. có quãng đường không đổi.", "D. có gia tốc bằng 0."], "answer": "A", "explain": "Chuyển động biến đổi đều: gia tốc không đổi theo thời gian.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi gia tốc không đổi, gia tốc tức thời và gia tốc trung bình", "options": ["A. bằng nhau.", "B. khác nhau.", "C. tỉ lệ nghịch với nhau.", "D. không so sánh được."], "answer": "A", "explain": "Khi a không đổi, mọi giá trị gia tốc đều bằng nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có vận tốc đầu bằng 0, sau 5 s vận tốc là 25 m/s. Gia tốc của vật là", "options": ["A. 5 m/s vuông.", "B. 125 m/s vuông.", "C. 25 m/s vuông.", "D. 0,2 m/s vuông."], "answer": "A", "explain": "$a = \\frac{25 - 0}{5} = 5$ m/s vuông.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật đang phanh với gia tốc -4 m/s vuông, vận tốc đầu 20 m/s. Thời gian để vật dừng hẳn là", "options": ["A. 5 s.", "B. 4 s.", "C. 80 s.", "D. 0,2 s."], "answer": "A", "explain": "$0 = 20 - 4t$ suy ra $t = 5$ s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai xe cùng tăng tốc từ 0 lên 20 m/s; xe A mất 4 s, xe B mất 8 s. Gia tốc của xe A và xe B lần lượt là", "options": ["A. 5 m/s vuông và 2,5 m/s vuông.", "B. 2,5 m/s vuông và 5 m/s vuông.", "C. 80 m/s vuông và 160 m/s vuông.", "D. 4 m/s vuông và 8 m/s vuông."], "answer": "A", "explain": "$a_A = \\frac{20}{4} = 5$ m/s vuông; $a_B = \\frac{20}{8} = 2,5$ m/s vuông. Xe A tăng tốc nhanh hơn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đồ thị vận tốc – thời gian của một vật là đường thẳng dốc lên. Gia tốc của vật", "options": ["A. dương và không đổi.", "B. âm và không đổi.", "C. bằng 0.", "D. thay đổi liên tục."], "answer": "A", "explain": "Đồ thị v – t là đường thẳng dốc lên: vận tốc tăng đều, gia tốc dương và không đổi.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chuyển động biến đổi đều có gia tốc không đổi.", "b) Khi gia tốc không đổi, gia tốc tức thời bằng gia tốc trung bình.", "c) Vật tăng từ 0 lên 25 m/s trong 5 s thì gia tốc là 5 m/s vuông.", "d) Chuyển động biến đổi đều có vận tốc không đổi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vận tốc thay đổi đều.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xe A (20 m/s sau 4 s) có gia tốc 5 m/s vuông, xe B (20 m/s sau 8 s) có gia tốc 2,5 m/s vuông.", "b) Đồ thị v – t dốc lên nghĩa là gia tốc dương không đổi.", "c) Vật phanh với $a = -4$ m/s vuông, $v_0 = 20$ m/s thì dừng sau 5 s.", "d) Gia tốc càng lớn thì thời gian tăng tốc càng dài."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: gia tốc càng lớn thì vận tốc biến đổi càng nhanh, thời gian càng ngắn.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật tăng tốc từ 7 m/s lên 21 m/s trong 7 s. Gia tốc của vật là bao nhiêu m/s vuông? (ghi số)", "answer": "2", "explain": "$a = \\frac{21 - 7}{7} = 2$ m/s vuông.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật có vận tốc đầu 24 m/s, gia tốc -6 m/s vuông (ngược chiều chuyển động). Sau bao nhiêu giây thì vật dừng lại? (ghi số)", "answer": "4", "explain": "$0 = 24 - 6t$ suy ra $t = 4$ s.", "points": 0.5}]},
{"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Gia tốc cho biết mức độ", "options": ["A. nhanh hay chậm của sự biến đổi vận tốc.", "B. dài hay ngắn của quãng đường.", "C. nặng hay nhẹ của vật.", "D. sáng hay tối của vật."], "answer": "A", "explain": "Gia tốc đặc trưng cho sự biến đổi nhanh hay chậm của vận tốc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đơn vị m/s vuông được đọc là", "options": ["A. mét trên giây bình phương.", "B. mét trên giây.", "C. mét giây.", "D. giây trên mét bình phương."], "answer": "A", "explain": "m/s² đọc là mét trên giây bình phương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật giảm tốc từ 10 m/s xuống 4 m/s trong 3 s (chiều dương là chiều chuyển động). Gia tốc của vật là", "options": ["A. -2 m/s vuông.", "B. 2 m/s vuông.", "C. -3 m/s vuông.", "D. 3 m/s vuông."], "answer": "A", "explain": "$a = \\frac{4 - 10}{3} = -2$ m/s vuông.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có $v = 5$ m/s và $a = 2$ m/s vuông cùng chiều với vận tốc. Sau 4 s, vận tốc của vật là", "options": ["A. 13 m/s.", "B. 3 m/s.", "C. 40 m/s.", "D. 7 m/s."], "answer": "A", "explain": "$v = 5 + 2 \\times 4 = 13$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một xe đua tăng tốc từ 30 m/s lên 60 m/s trong 6 s. Gia tốc của xe là", "options": ["A. 5 m/s vuông.", "B. 180 m/s vuông.", "C. 30 m/s vuông.", "D. 0,2 m/s vuông."], "answer": "A", "explain": "$a = \\frac{60 - 30}{6} = 5$ m/s vuông.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một vật có $v_0 = -12$ m/s và $a = 3$ m/s vuông. Sau 4 s, vật", "options": ["A. dừng lại (vận tốc bằng 0).", "B. có vận tốc 12 m/s.", "C. có vận tốc -24 m/s.", "D. có vận tốc -12 m/s."], "answer": "A", "explain": "$v = -12 + 3 \\times 4 = 0$: vật dừng lại (đang chậm dần theo chiều âm).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Gia tốc cho biết vận tốc biến đổi nhanh hay chậm.", "b) m/s vuông đọc là mét trên giây bình phương.", "c) Vật giảm từ 10 m/s xuống 4 m/s trong 3 s thì gia tốc là -2 m/s vuông.", "d) $v = 5$ m/s, $a = 2$ m/s vuông cùng chiều thì sau 4 s vận tốc là 3 m/s."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $v = 5 + 8 = 13$ m/s.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xe đua tăng từ 30 m/s lên 60 m/s trong 6 s thì gia tốc là 5 m/s vuông.", "b) $v_0 = -12$ m/s, $a = 3$ m/s vuông thì sau 4 s vật dừng lại.", "c) Vật đang chậm dần theo chiều âm thì $v$ âm và $a$ dương.", "d) Gia tốc là đại lượng vô hướng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: gia tốc là đại lượng vectơ.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật tăng tốc từ 10 m/s lên 30 m/s trong 10 s. Gia tốc của vật là bao nhiêu m/s vuông? (ghi số)", "answer": "2", "explain": "$a = \\frac{30 - 10}{10} = 2$ m/s vuông.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật giảm tốc từ 15 m/s xuống 0 trong 5 s (chiều dương là chiều chuyển động). Gia tốc của vật là bao nhiêu m/s vuông? (ghi số)", "answer": "-3", "explain": "$a = \\frac{0 - 15}{5} = -3$ m/s vuông.", "points": 0.5}]}]}
