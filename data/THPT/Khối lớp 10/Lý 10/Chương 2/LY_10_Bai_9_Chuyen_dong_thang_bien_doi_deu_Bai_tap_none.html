, "b) Công thức $v^2 - v_0^2 = 2ad$ dùng khi không biết thời gian.", "c) Vật khởi hành từ 0 với $a = 4$ m/s vuông thì sau 3 s vận tốc là 12 m/s.", "d) Độ dịch chuyển của vật trên sau 3 s là 36 m."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $d = 18$ m.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tàu ($v_0 = 5$ m/s, $a = 1$ m/s vuông) sau 10 s có vận tốc 15 m/s.", "b) Quãng đường tàu đi được trong 10 s là 100 m.", "c) Đồ thị $v$ – $t$ dốc lên nghĩa là vật nhanh dần.", "d) Diện tích dưới đồ thị $a$ – $t$ là độ dịch chuyển."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: diện tích dưới đồ thị $v$ – $t$ mới là độ dịch chuyển.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có $v_0 = 6$ m/s, $a = 4$ m/s vuông. Sau 2 s, độ dịch chuyển của vật là bao nhiêu m? (ghi số)", "answer": "20", "explain": "$d = 6 \\times 2 + \\frac{1}{2} \\times 4 \\times 2^2 = 12 + 8 = 20$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật có $v_0 = 20$ m/s, khi dừng lại ($v = 0$) thì độ dịch chuyển là 40 m. Gia tốc của vật là bao nhiêu m/s vuông? (ghi số)", "answer": "-5", "explain": "$0 - 400 = 2 \\times a \\times 40$, suy ra $a = -5$ m/s vuông.", "points": 0.5}]},
{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các công thức của chuyển động thẳng biến đổi đều, $v_0$ là", "options": ["A. vận tốc của vật lúc $t = 0$.", "B. vận tốc của vật lúc $t$ bất kì.", "C. gia tốc của vật.", "D. độ dịch chuyển của vật."], "answer": "A", "explain": "$v_0$ là vận tốc đầu, tức vận tốc lúc $t = 0$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong công thức $d = v_0t + \\frac{1}{2}at^2$, nếu dùng hệ SI thì đơn vị của $d, v_0, a, t$ lần lượt là", "options": ["A. m; m/s; m/s vuông; s.", "B. km; km/h; km/h vuông; h.", "C. m; m/s vuông; m/s; s.", "D. cm; cm/s; cm/s vuông; phút."], "answer": "A", "explain": "Trong hệ SI: độ dịch chuyển (m), vận tốc (m/s), gia tốc (m/s vuông), thời gian (s).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có $v_0 = 2$ m/s, $a = 5$ m/s vuông. Sau 4 s, vận tốc của vật là", "options": ["A. 22 m/s.", "B. 7 m/s.", "C. 40 m/s.", "D. 20 m/s."], "answer": "A", "explain": "$v = 2 + 5 \\times 4 = 22$ m/s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong tình huống trên, độ dịch chuyển của vật sau 4 s là", "options": ["A. 48 m.", "B. 22 m.", "C. 88 m.", "D. 8 m."], "answer": "A", "explain": "$d = 2 \\times 4 + \\frac{1}{2} \\times 5 \\times 4^2 = 8 + 40 = 48$ m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một xe đang chạy 25 m/s thì phanh với gia tốc -5 m/s vuông (chiều dương là chiều chuyển động). Thời gian để xe dừng hẳn là", "options": ["A. 5 s.", "B. 25 s.", "C. 125 s.", "D. 0,2 s."], "answer": "A", "explain": "$0 = 25 - 5t$, suy ra $t = 5$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Quãng đường xe đi được cho đến khi dừng hẳn trong tình huống trên là", "options": ["A. 62,5 m.", "B. 125 m.", "C. 25 m.", "D. 5 m."], "answer": "A", "explain": "$0 - 625 = 2 \\times (-5) \\times d$, suy ra $d = 62,5$ m.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $v_0$ là vận tốc của vật lúc $t = 0$.", "b) Trong hệ SI, $d$ (m), $v_0$ (m/s), $a$ (m/s vuông), $t$ (s).", "c) Vật ($v_0 = 2$ m/s, $a = 5$ m/s vuông) sau 4 s có vận tốc 22 m/s.", "d) Độ dịch chuyển của vật trên sau 4 s là 88 m."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $d = 48$ m.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xe chạy 25 m/s phanh với $a = -5$ m/s vuông thì dừng sau 5 s.", "b) Quãng đường phanh của xe trên là 62,5 m.", "c) Khi phanh, nên dùng công thức $v^2 - v_0^2 = 2ad$ để tính quãng đường.", "d) Gia tốc khi phanh cùng chiều với chuyển động."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: khi phanh, gia tốc ngược chiều chuyển động.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có $v_0 = 3$ m/s, $a = 6$ m/s vuông. Sau 2 s, vận tốc của vật là bao nhiêu m/s? (ghi số)", "answer": "15", "explain": "$v = 3 + 6 \\times 2 = 15$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật khởi hành từ trạng thái đứng yên với $a = 6$ m/s vuông, khi đạt vận tốc 24 m/s thì độ dịch chuyển là bao nhiêu m? (ghi số)", "answer": "48", "explain": "$24^2 - 0 = 2 \\times 6 \\times d$, suy ra $d = 48$ m.", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trên đồ thị $v$ – $t$, đường thẳng dốc lên có nghĩa là vật chuyển động", "options": ["A. nhanh dần.", "B. chậm dần.", "C. thẳng đều.", "D. đứng yên."], "answer": "A", "explain": "Dốc lên: $v$ tăng theo $t$, vật nhanh dần.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trên đồ thị $v$ – $t$, đường thẳng dốc xuống có nghĩa là vật chuyển động", "options": ["A. chậm dần.", "B. nhanh dần.", "C. thẳng đều.", "D. tròn đều."], "answer": "A", "explain": "Dốc xuống: độ lớn $v$ giảm theo $t$ (khi $v$ dương), vật chậm dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có $v_0 = 12$ m/s, $a = -4$ m/s vuông (ngược chiều chuyển động). Sau 3 s, vận tốc của vật là", "options": ["A. 0.", "B. 24 m/s.", "C. 12 m/s.", "D. -12 m/s."], "answer": "A", "explain": "$v = 12 - 4 \\times 3 = 0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong tình huống trên, độ dịch chuyển của vật sau 3 s là", "options": ["A. 18 m.", "B. 36 m.", "C. 0.", "D. 12 m."], "answer": "A", "explain": "$d = 12 \\times 3 + \\frac{1}{2} \\times (-4) \\times 3^2 = 36 - 18 = 18$ m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một máy bay khởi hành từ trạng thái đứng yên với $a = 5$ m/s vuông, cất cánh khi đạt vận tốc 80 m/s. Thời gian chạy trên đường băng là", "options": ["A. 16 s.", "B. 400 s.", "C. 85 s.", "D. 0,0625 s."], "answer": "A", "explain": "$80 = 0 + 5t$, suy ra $t = 16$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Độ dài tối thiểu của đường băng trong tình huống trên là", "options": ["A. 640 m.", "B. 1280 m.", "C. 80 m.", "D. 16 m."], "answer": "A", "explain": "$80^2 - 0 = 2 \\times 5 \\times d$, suy ra $d = 640$ m.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị $v$ – $t$ dốc lên nghĩa là vật nhanh dần.", "b) Đồ thị $v$ – $t$ dốc xuống nghĩa là vật chậm dần.", "c) Vật ($v_0 = 12$ m/s, $a = -4$ m/s vuông) sau 3 s dừng lại.", "d) Độ dịch chuyển của vật trên sau 3 s là 36 m."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $d = 18$ m.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Máy bay ($a = 5$ m/s vuông) đạt 80 m/s sau 16 s.", "b) Đường băng tối thiểu dài 640 m.", "c) Độ dốc của đồ thị $v$ – $t$ là gia tốc.", "d) Diện tích dưới đồ thị $v$ – $t$ là vận tốc."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: diện tích là độ dịch chuyển.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có $v_0 = 10$ m/s, $a = 5$ m/s vuông. Sau 2 s, độ dịch chuyển của vật là bao nhiêu m? (ghi số)", "answer": "30", "explain": "$d = 10 \\times 2 + \\frac{1}{2} \\times 5 \\times 2^2 = 20 + 10 = 30$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật khởi hành từ trạng thái đứng yên, khi đạt vận tốc 20 m/s thì độ dịch chuyển là 50 m. Gia tốc của vật là bao nhiêu m/s vuông? (ghi số)", "answer": "4", "explain": "$400 - 0 = 2 \\times a \\times 50$, suy ra $a = 4$ m/s vuông.", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Khi sử dụng các công thức của chuyển động thẳng biến đổi đều, cần chú ý", "options": ["A. chọn chiều dương và các đại lượng mang dấu theo chiều đã chọn.", "B. mọi đại lượng đều lấy giá trị dương.", "C. không cần quan tâm đến dấu.", "D. gia tốc luôn dương."], "answer": "A", "explain": "$v_0, v, a, d$ là các đại lượng có dấu theo chiều dương đã chọn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một vật có gia tốc dương nhưng vận tốc âm thì vật chuyển động", "options": ["A. chậm dần.", "B. nhanh dần.", "C. thẳng đều.", "D. đứng yên."], "answer": "A", "explain": "$a$ và $v$ trái dấu nên vật chậm dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có $v_0 = 7$ m/s, $a = 3$ m/s vuông. Sau 5 s, vận tốc của vật là", "options": ["A. 22 m/s.", "B. 12 m/s.", "C. 35 m/s.", "D. 15 m/s."], "answer": "A", "explain": "$v = 7 + 3 \\times 5 = 22$ m/s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong tình huống trên, độ dịch chuyển của vật sau 5 s là", "options": ["A. 72,5 m.", "B. 35 m.", "C. 110 m.", "D. 22 m."], "answer": "A", "explain": "$d = 7 \\times 5 + \\frac{1}{2} \\times 3 \\times 5^2 = 35 + 37,5 = 72,5$ m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một ô tô đang chạy 54 km/h (biết 54 km/h = 15 m/s) thì phanh với gia tốc -3 m/s vuông (chiều dương là chiều chuyển động). Thời gian để ô tô dừng hẳn là", "options": ["A. 5 s.", "B. 18 s.", "C. 45 s.", "D. 0,2 s."], "answer": "A", "explain": "$0 = 15 - 3t$, suy ra $t = 5$ s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Quãng đường ô tô đi được cho đến khi dừng hẳn trong tình huống trên là", "options": ["A. 37,5 m.", "B. 75 m.", "C. 15 m.", "D. 5 m."], "answer": "A", "explain": "$0 - 225 = 2 \\times (-3) \\times d$, suy ra $d = 37,5$ m.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Các đại lượng $v_0, v, a, d$ mang dấu theo chiều dương đã chọn.", "b) Gia tốc dương, vận tốc âm thì vật chậm dần.", "c) Vật ($v_0 = 7$ m/s, $a = 3$ m/s vuông) sau 5 s có vận tốc 22 m/s.", "d) Độ dịch chuyển của vật trên sau 5 s là 35 m."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $d = 72,5$ m.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ô tô chạy 54 km/h phanh với $a = -3$ m/s vuông thì dừng sau 5 s.", "b) Quãng đường phanh của ô tô trên là 37,5 m.", "c) 54 km/h = 15 m/s.", "d) Khi phanh gấp, quãng đường phanh không phụ thuộc vào tốc độ đầu."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quãng đường phanh tỉ lệ với bình phương tốc độ đầu.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có $v_0 = 9$ m/s, $a = 3$ m/s vuông. Sau 3 s, vận tốc của vật là bao nhiêu m/s? (ghi số)", "answer": "18", "explain": "$v = 9 + 3 \\times 3 = 18$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật có $v_0 = 15$ m/s, $a = -5$ m/s vuông (ngược chiều chuyển động). Sau 3 s, độ dịch chuyển của vật là bao nhiêu m? (ghi số)", "answer": "22.5", "explain": "$d = 15 \\times 3 + \\frac{1}{2} \\times (-5) \\times 3^2 = 45 - 22,5 = 22,5$ m.", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Công thức nào sau đây KHÔNG phải của chuyển động thẳng biến đổi đều?", "options": ["A. $v_{tb} = \\frac{s}{t}$.", "B. $v = v_0 + at$.", "C. $d = v_0t + \\frac{1}{2}at^2$.", "D. $v^2 - v_0^2 = 2ad$."], "answer": "A", "explain": "$v_{tb} = s/t$ là công thức tính tốc độ trung bình, không phải công thức đặc trưng của chuyển động thẳng biến đổi đều.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong ba công thức của chuyển động thẳng biến đổi đều, công thức nào không chứa thời gian $t$?", "options": ["A. $v^2 - v_0^2 = 2ad$.", "B. $v = v_0 + at$.", "C. $d = v_0t + \\frac{1}{2}at^2$.", "D. Cả ba công thức đều chứa $t$."], "answer": "A", "explain": "$v^2 - v_0^2 = 2ad$ không chứa $t$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật khởi hành từ trạng thái đứng yên với $a = 10$ m/s vuông. Sau 2 s, vận tốc của vật là", "options": ["A. 20 m/s.", "B. 10 m/s.", "C. 40 m/s.", "D. 5 m/s."], "answer": "A", "explain": "$v = 0 + 10 \\times 2 = 20$ m/s.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong tình huống trên, độ dịch chuyển của vật sau 2 s là", "options": ["A. 20 m.", "B. 40 m.", "C. 10 m.", "D. 200 m."], "answer": "A", "explain": "$d = \\frac{1}{2} \\times 10 \\times 2^2 = 20$ m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một viên bi lăn với $v_0 = 2$ m/s, gia tốc $a = 1$ m/s vuông. Sau 6 s, vận tốc của viên bi là", "options": ["A. 8 m/s.", "B. 3 m/s.", "C. 12 m/s.", "D. 36 m/s."], "answer": "A", "explain": "$v = 2 + 1 \\times 6 = 8$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong tình huống trên, độ dịch chuyển của viên bi sau 6 s là", "options": ["A. 30 m.", "B. 8 m.", "C. 48 m.", "D. 12 m."], "answer": "A", "explain": "$d = 2 \\times 6 + \\frac{1}{2} \\times 1 \\times 6^2 = 12 + 18 = 30$ m.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $v_{tb} = \\frac{s}{t}$ không phải công thức đặc trưng của chuyển động thẳng biến đổi đều.", "b) $v^2 - v_0^2 = 2ad$ không chứa thời gian.", "c) Vật khởi hành từ 0 với $a = 10$ m/s vuông thì sau 2 s vận tốc là 20 m/s.", "d) Độ dịch chuyển của vật trên sau 2 s là 40 m."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $d = 20$ m.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Viên bi ($v_0 = 2$ m/s, $a = 1$ m/s vuông) sau 6 s có vận tốc 8 m/s.", "b) Độ dịch chuyển của viên bi sau 6 s là 30 m.", "c) Đồ thị $a$ – $t$ là đường nằm ngang.", "d) Đồ thị $v$ – $t$ dốc xuống nghĩa là vật nhanh dần."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: dốc xuống (v dương) nghĩa là chậm dần.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có $v_0 = 4$ m/s, $a = 8$ m/s vuông. Sau 1 s, vận tốc của vật là bao nhiêu m/s? (ghi số)", "answer": "12", "explain": "$v = 4 + 8 \\times 1 = 12$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong tình huống trên, độ dịch chuyển của vật sau 1 s là bao nhiêu m? (ghi số)", "answer": "8", "explain": "$d = 4 \\times 1 + \\frac{1}{2} \\times 8 \\times 1^2 = 4 + 4 = 8$ m.", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Đồ thị $v$ – $t$ của chuyển động thẳng biến đổi đều đi qua gốc tọa độ $O$ có nghĩa là", "options": ["A. vận tốc đầu $v_0 = 0$.", "B. gia tốc bằng 0.", "C. vật đứng yên.", "D. thời gian bằng 0."], "answer": "A", "explain": "Đồ thị qua gốc tọa độ: tại $t = 0$, $v = 0$ nên $v_0 = 0$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đồ thị $v$ – $t$ cắt trục tung (trục $v$) tại điểm $v_0$ có nghĩa là", "options": ["A. vận tốc đầu của vật bằng $v_0$.", "B. gia tốc của vật bằng $v_0$.", "C. thời gian đầu bằng $v_0$.", "D. độ dịch chuyển bằng $v_0$."], "answer": "A", "explain": "Giao điểm với trục $v$ (tại $t = 0$) cho biết vận tốc đầu $v_0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có $v_0 = 20$ m/s, $a = -5$ m/s vuông (ngược chiều chuyển động). Sau 4 s, vận tốc của vật là", "options": ["A. 0.", "B. 40 m/s.", "C. 20 m/s.", "D. -20 m/s."], "answer": "A", "explain": "$v = 20 - 5 \\times 4 = 0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong tình huống trên, độ dịch chuyển của vật sau 4 s là", "options": ["A. 40 m.", "B. 80 m.", "C. 0.", "D. 20 m."], "answer": "A", "explain": "$d = 20 \\times 4 + \\frac{1}{2} \\times (-5) \\times 4^2 = 80 - 40 = 40$ m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một xe khởi hành từ trạng thái đứng yên với $a = 4$ m/s vuông, sau khi đi được 32 m thì vận tốc của xe là", "options": ["A. 16 m/s.", "B. 8 m/s.", "C. 128 m/s.", "D. 32 m/s."], "answer": "A", "explain": "$v^2 - 0 = 2 \\times 4 \\times 32$, suy ra $v^2 = 256$, $v = 16$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong tình huống trên, thời gian để xe đi được 32 m là", "options": ["A. 4 s.", "B. 8 s.", "C. 16 s.", "D. 2 s."], "answer": "A", "explain": "$v = v_0 + at$: $16 = 0 + 4t$, suy ra $t = 4$ s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị $v$ – $t$ qua gốc tọa độ nghĩa là $v_0 = 0$.", "b) Giao điểm của đồ thị $v$ – $t$ với trục $v$ là vận tốc đầu.", "c) Vật ($v_0 = 20$ m/s, $a = -5$ m/s vuông) sau 4 s dừng lại.", "d) Độ dịch chuyển của vật trên sau 4 s là 80 m."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $d = 40$ m.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xe ($v_0 = 0$, $a = 4$ m/s vuông) đi 32 m thì đạt vận tốc 16 m/s.", "b) Thời gian để xe đi được 32 m là 4 s.", "c) Đồ thị $v$ – $t$ càng dốc thì gia tốc càng lớn.", "d) Chuyển động thẳng biến đổi đều có gia tốc thay đổi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: gia tốc không đổi.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có $v_0 = 11$ m/s, $a = 2$ m/s vuông. Sau 4 s, vận tốc của vật là bao nhiêu m/s? (ghi số)", "answer": "19", "explain": "$v = 11 + 2 \\times 4 = 19$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong tình huống trên, độ dịch chuyển của vật sau 4 s là bao nhiêu m? (ghi số)", "answer": "60", "explain": "$d = 11 \\times 4 + \\frac{1}{2} \\times 2 \\times 4^2 = 44 + 16 = 60$ m.", "points": 0.5}]},
{"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Chuyển động thẳng nhanh dần đều có đồ thị $v$ – $t$ là", "options": ["A. đường thẳng dốc lên.", "B. đường thẳng dốc xuống.", "C. đường thẳng nằm ngang.", "D. đường parabol."], "answer": "A", "explain": "Nhanh dần (v dương): $v$ tăng theo $t$ nên đồ thị dốc lên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chuyển động thẳng chậm dần đều (vận tốc dương) có đồ thị $v$ – $t$ là", "options": ["A. đường thẳng dốc xuống.", "B. đường thẳng dốc lên.", "C. đường thẳng nằm ngang.", "D. đường parabol."], "answer": "A", "explain": "Chậm dần (v dương): độ lớn $v$ giảm theo $t$ nên đồ thị dốc xuống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một vật có $v_0 = 30$ m/s, $a = -6$ m/s vuông (ngược chiều chuyển động). Sau 5 s, vận tốc của vật là", "options": ["A. 0.", "B. 60 m/s.", "C. 30 m/s.", "D. -30 m/s."], "answer": "A", "explain": "$v = 30 - 6 \\times 5 = 0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong tình huống trên, độ dịch chuyển của vật sau 5 s là", "options": ["A. 75 m.", "B. 150 m.", "C. 0.", "D. 30 m."], "answer": "A", "explain": "$d = 30 \\times 5 + \\frac{1}{2} \\times (-6) \\times 5^2 = 150 - 75 = 75$ m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật khởi hành từ trạng thái đứng yên với $a = 2$ m/s vuông. Sau 8 s, độ dịch chuyển của vật là", "options": ["A. 64 m.", "B. 16 m.", "C. 128 m.", "D. 8 m."], "answer": "A", "explain": "$d = \\frac{1}{2} \\times 2 \\times 8^2 = 64$ m.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong tình huống trên, vận tốc của vật sau 8 s là", "options": ["A. 16 m/s.", "B. 8 m/s.", "C. 64 m/s.", "D. 4 m/s."], "answer": "A", "explain": "$v = 0 + 2 \\times 8 = 16$ m/s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhanh dần đều (v dương) có đồ thị $v$ – $t$ dốc lên.", "b) Chậm dần đều (v dương) có đồ thị $v$ – $t$ dốc xuống.", "c) Vật ($v_0 = 30$ m/s, $a = -6$ m/s vuông) sau 5 s dừng lại.", "d) Độ dịch chuyển của vật trên sau 5 s là 150 m."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $d = 75$ m.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật ($v_0 = 0$, $a = 2$ m/s vuông) sau 8 s đi được 64 m.", "b) Vận tốc của vật trên sau 8 s là 16 m/s.", "c) Quãng đường phanh tỉ lệ với bình phương tốc độ đầu.", "d) Công thức $v = v_0 + at$ dùng khi không biết độ dịch chuyển."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: công thức $v = v_0 + at$ dùng khi biết $v_0, a, t$; khi không biết $d$ thì vẫn dùng được nếu biết $t$.", "points": 1}, {"type": "short", "level": "VD", "q": "Một vật có $v_0 = 5$ m/s, $a = 10$ m/s vuông. Sau 2 s, vận tốc của vật là bao nhiêu m/s? (ghi số)", "answer": "25", "explain": "$v = 5 + 10 \\times 2 = 25$ m/s.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong tình huống trên, độ dịch chuyển của vật sau 2 s là bao nhiêu m? (ghi số)", "answer": "30", "explain": "$d = 5 \\times 2 + \\frac{1}{2} \\times 10 \\times 2^2 = 10 + 20 = 30$ m.", "points": 0.5}]}]}
