rt{\\frac{2h}{g}}$ chỉ phụ thuộc $v_0$, $h$, $g$; khối lượng của vật không ảnh hưởng (khi bỏ qua sức cản không khí).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét một vật được ném ngang từ độ cao $h = 5$ m (bỏ qua sức cản không khí). Phát biểu nào sau đây đúng?", "options": ["A. Theo phương thẳng đứng, vật chuyển động chậm dần đều", "B. Theo phương thẳng đứng, vật chuyển động rơi tự do (nhanh dần đều)", "C. Theo phương ngang, vật chuyển động rơi tự do", "D. Quỹ đạo chuyển động của vật là một đường tròn"], "answer": "B", "explain": "Chuyển động ném ngang được phân tích thành hai thành phần độc lập: theo phương ngang là chuyển động thẳng đều, theo phương thẳng đứng là chuyển động rơi tự do; hợp lại cho quỹ đạo là một nhánh parabol.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một viên bi lăn khỏi mép bàn cao 125 m với vận tốc ban đầu theo phương ngang (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Thời gian từ lúc vật bắt đầu chuyển động đến khi chạm đất là:", "options": ["A. $3.54$ s", "B. $12.5$ s", "C. $5$ s", "D. $25$ s"], "answer": "C", "explain": "Thời gian rơi của chuyển động ném ngang: $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 125}{10}} = 5$ s. Thời gian này không phụ thuộc vận tốc ném ban đầu $v_0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một chiếc xe đồ chơi chạy khỏi mép bàn cao 12 m với vận tốc 125 m/s theo phương ngang (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Tầm xa của vật là:", "options": ["A. $42.43$ m", "B. $150$ m", "C. $120$ m", "D. $60$ m"], "answer": "D", "explain": "Thời gian rơi $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 125}{10}} = 5$ s. Tầm xa $L = v_0 t = 12 \\cdot 5 = 60$ m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật được ném ngang từ độ cao 20 m với vận tốc ban đầu $v_0 = 48$ m/s (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Vận tốc của vật ngay khi chạm đất có độ lớn bằng:", "options": ["A. $52$ m/s", "B. $68$ m/s", "C. $48.21$ m/s", "D. $48$ m/s"], "answer": "A", "explain": "Khi chạm đất: $v_x = v_0 = 48$ m/s; $v_y = gt = 10 \\cdot 2 = 20$ m/s. Độ lớn vận tốc $v = \\sqrt{v_x^2 + v_y^2} = \\sqrt{48^2 + 20^2} = 52$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ở cùng một độ cao, vật A được ném ngang với vận tốc $v_0$, vật B được ném ngang với vận tốc $2.5 v_0$ (bỏ qua sức cản không khí). Tỉ số tầm xa $\\frac{L_B}{L_A}$ bằng:", "options": ["A. 6.25", "B. 2.5", "C. 1", "D. $\\sqrt{2.5}$"], "answer": "B", "explain": "Tầm xa $L = v_0\\sqrt{\\frac{2h}{g}}$ tỉ lệ thuận với $v_0$ (cùng $h$, $g$) nên $\\frac{L_B}{L_A} = \\frac{2.5 v_0}{v_0} = 2.5$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Một vật được ném ngang từ độ cao $h = 5$ m (bỏ qua sức cản không khí). Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Thời gian vật chạm đất là $t = \\sqrt{\\frac{2h}{g}} = 1$ s (với $h = 5$ m, $g = 10$ m/s$^2$).", "b) Tầm xa của vật tỉ lệ thuận với vận tốc ném ban đầu $v_0$.", "c) Khối lượng của vật ảnh hưởng đến tầm xa của chuyển động ném ngang.", "d) Theo phương ngang, vật chuyển động thẳng đều với vận tốc $v_0$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $t = \\sqrt{\\frac{2 \\cdot 5}{10}} = 1$ s. b) Đúng: $L = v_0\\sqrt{\\frac{2h}{g}}$ tỉ lệ thuận với $v_0$ (hoặc $t = \\sqrt{\\frac{2h}{g}}$ nên $h$ tăng 4 lần thì $t$ tăng $\\sqrt{4} = 2$ lần). c) Sai: thời gian rơi chỉ phụ thuộc $h$ (và $g$), không phụ thuộc $v_0$ hay khối lượng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật được ném ngang với vận tốc $v_0 = 15$ m/s từ độ cao $h = 5$ m (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Thời gian chuyển động của vật là $1$ s.", "b) Tầm xa của vật là $15$ m.", "c) Nếu tính theo công thức $L = v_0\\sqrt{\\frac{h}{g}}$ thì được $10.61$ m.", "d) Khi tăng vận tốc ném ban đầu lên gấp đôi thì tầm xa tăng lên gấp 4 lần."], "answer": ["T", "T", "F", "F"], "explain": "$t = \\sqrt{\\ ân tích thành hai thành phần độc lập: theo phương ngang là chuyển động thẳng đều, theo phương thẳng đứng là chuyển động rơi tự do; hợp lại cho quỹ đạo là một nhánh parabol.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một gói hàng trượt khỏi băng chuyền nằm ngang ở độ cao 180 m (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Thời gian từ lúc vật bắt đầu chuyển động đến khi chạm đất là:", "options": ["A. $4.24$ s", "B. $18$ s", "C. $36$ s", "D. $6$ s"], "answer": "D", "explain": "Thời gian rơi của chuyển động ném ngang: $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 180}{10}} = 6$ s. Thời gian này không phụ thuộc vận tốc ném ban đầu $v_0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một quả bóng được đá mạnh lăn khỏi sân thượng cao 25 m với tốc độ ban đầu 180 m/s theo phương ngang (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Tầm xa của vật là:", "options": ["A. $150$ m", "B. $106.07$ m", "C. $450$ m", "D. $300$ m"], "answer": "A", "explain": "Thời gian rơi $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 180}{10}} = 6$ s. Tầm xa $L = v_0 t = 25 \\cdot 6 = 150$ m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật được ném ngang từ độ cao 80 m với vận tốc ban đầu $v_0 = 96$ m/s (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Vận tốc của vật ngay khi chạm đất có độ lớn bằng:", "options": ["A. $136$ m/s", "B. $104$ m/s", "C. $96.21$ m/s", "D. $96$ m/s"], "answer": "B", "explain": "Khi chạm đất: $v_x = v_0 = 96$ m/s; $v_y = gt = 10 \\cdot 4 = 40$ m/s. Độ lớn vận tốc $v = \\sqrt{v_x^2 + v_y^2} = \\sqrt{96^2 + 40^2} = 104$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Từ độ cao $h = 80$ m, muốn vật ném ngang đạt tầm xa $L = 240$ m thì phải ném vật với vận tốc ban đầu $v_0$ bằng bao nhiêu? (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí)", "options": ["A. $84.85$ m/s", "B. $30$ m/s", "C. $60$ m/s", "D. $64$ m/s"], "answer": "C", "explain": "Thời gian rơi $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot  m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật được ném ngang từ độ cao 180 m với vận tốc ban đầu $v_0 = 80$ m/s (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Vận tốc của vật ngay khi chạm đất có độ lớn bằng:", "options": ["A. $140$ m/s", "B. $80.37$ m/s", "C. $80$ m/s", "D. $100$ m/s"], "answer": "D", "explain": "Khi chạm đất: $v_x = v_0 = 80$ m/s; $v_y = gt = 10 \\cdot 6 = 60$ m/s. Độ lớn vận tốc $v = \\sqrt{v_x^2 + v_y^2} = \\sqrt{80^2 + 60^2} = 100$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Từ độ cao $h = 125$ m, muốn vật ném ngang đạt tầm xa $L = 375$ m thì phải ném vật với vận tốc ban đầu $v_0$ bằng bao nhiêu? (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí)", "options": ["A. $75$ m/s", "B. $106.07$ m/s", "C. $37.5$ m/s", "D. $80$ m/s"], "answer": "A", "explain": "Thời gian rơi $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 125}{10}} = 5$ s. Từ $L = v_0 t$ suy ra $v_0 = \\frac{L}{t} = \\frac{375}{5} = 75$ m/s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Một vật được ném ngang từ độ cao $h = 320$ m (bỏ qua sức cản không khí). Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Thời gian vật chạm đất là $t = \\sqrt{\\frac{2h}{g}} = 8$ s (với $h = 320$ m, $g = 10$ m/s$^2$).", "b) Nếu tăng độ cao $h$ lên 4 lần thì thời gian rơi tăng lên 2 lần.", "c) Vận tốc ban đầu $v_0$ càng lớn thì vật chạm đất càng chậm.", "d) Quỹ đạo của vật ném ngang là một nhánh parabol."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $t = \\sqrt{\\frac{2 \\cdot 320}{10}} = 8$ s. b) Đúng: $L = v_0\\sqrt{\\frac{2h}{g}}$ tỉ lệ thuận với $v_0$ (hoặc $t = \\sqrt{\\frac{2h}{g}}$ nên $h$ tăng 4 lần thì $t$ tăng $\\sqrt{4} = 2$ lần). c) Sai: thời gian rơi chỉ phụ thuộc $h$ (và $g$), không phụ thuộc $v_0$ hay khối lượng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật được ném ngang với vận tốc $v_0 = 16$ m/s từ độ cao $h = 320$ m (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Thời gian chuyển động của vật là $8$ s.", "b) Tầm xa của vật là $128$ m.", "c) Nếu tính theo công thức $L = v_0\\sqrt{\\frac{h}{g}}$ thì được $90.51$ m.", "d) Khi tăng vận tốc ném ban đầu lên gấp đôi thì tầm xa tăng lên gấp 4 lần."], "answer": ["T", "T", "F", "F"], "explain": "$t = \\sqrt{\\frac{2 \\cdot 320}{10}} = 8$ s nên a) đúng. $L = v_0 t = 16 \\cdot 8 = 128$ m nên b) đúng. c) Sai: công thức đúng phải có số 2, $L = v_0\\sqrt{\\frac{2h}{g}}$. d) Sai: $L$ tỉ lệ thuận (bậc nhất) với $v_0$ nên $v_0$ tăng 2 lần thì $L$ tăng 2 lần.", "points": 1}, {"type": "short", "level": "VD", "q": "Một chiếc xe đồ chơi chạy khỏi mép bàn cao 48 m với vận tốc 320 m/s theo phương ngang. Tính tầm xa $L$ của vật (đơn vị: m; lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí).", "answer": "384", "explain": "Thời gian rơi: $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 320}{10}} = 8$ s. Tầm xa: $L = v_0 t = 48 \\cdot 8 = 384$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vật được ném ngang với vận tốc ban đầu $v_0 = 40$ m/s và đạt tầm xa $L = 200$ m. Tính độ cao nơi ném vật (đơn vị: m; lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí).", "answer": "125", "explain": "Thời gian chuyển động $t = \\frac{L}{v_0} = \\frac{200}{40} = 5$ s. Từ $h = \\frac{1}{2}gt^2$ suy ra $h = \\frac{1}{2} \\cdot 10 \\cdot 5^2 = 125$ m.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật được ném ngang từ độ cao $h = 405$ m với vận tốc ban đầu $v_0 = 54$ m/s. Đại lượng nào sau đây KHÔNG ảnh hưởng đến tầm xa của vật?", "options": ["A. Khối lượng của vật", "B. Vận tốc ban đầu $v_0$", "C. Độ cao $h$ nơi ném", "D. Gia tốc rơi tự do $g$"], "answer": "A", "explain": "Tầm xa $L = v_0\\sqrt{\\frac{2h}{g}}$ chỉ phụ thuộc $v_0$, $h$, $g$; khối lượng của vật không ảnh hưởng (khi bỏ qua sức cản không khí).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét một vật được ném ngang từ độ cao $h = 405$ m (bỏ qua sức cản không khí). Phát biểu nào sau đây đúng?", "options": ["A. Quỹ đạo chuyển động của vật là một đường thẳng xiên", "B. Quỹ đạo chuyển động của vật là một nhánh parabol", "C. Theo phương ngang, gia tốc của vật bằng $g$", "D. Theo phương thẳng đứng, vận tốc của vật không đổi"], "answer": "B", "explain": "Chuyển động ném ngang được phân tích thành hai thành phần độc lập: theo phương ngang là chuyển động thẳng đều, theo phương thẳng đứng là chuyển động rơi tự do; hợp lại cho quỹ đạo là một nhánh parabol.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một gói hàng trượt khỏi băng chuyền nằm ngang ở độ cao 405 m (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Thời gian từ lúc vật bắt đầu chuyển động đến khi chạm đất là:", "options": ["A. $6.36$ s", "B. $40.5$ s", "C. $9$ s", "D. $81$ s"], "answer": "C", "explain": "Thời gian rơi của chuyển động ném ngang: $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 405}{10}} = 9$ s. Thời gian này không phụ thuộc vận tốc ném ban đầu $v_0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một quả bóng được đá mạnh lăn khỏi sân thượng cao 22 m với tốc độ ban đầu 405 m/s theo phương ngang (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Tầm xa của vật là:", "options": ["A. $140.01$ m", "B. $891$ m", "C. $396$ m", "D. $198$ m"], "answer": "D", "explain": "Thời gian rơi $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 405}{10}} = 9$ s. Tầm xa $L = v_0 t = 22 \\cdot 9 = 198$ m.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vật được ném ngang từ độ cao 80 m với vận tốc ban đầu $v_0 = 9$ m/s (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Vận tốc của vật ngay khi chạm đất có độ lớn bằng:", "options": ["A. $41$ m/s", "B. $49$ m/s", "C. $11$ m/s", "D. $9$ m/s"], "answer": "A", "explain": "Khi chạm đất: $v_x = v_0 = 9$ m/s; $v_y = gt = 10 \\cdot 4 = 40$ m/s. Độ lớn vận tốc $v = \\sqrt{v_x^2 + v_y^2} = \\sqrt{9^2 + 40^2} = 41$ m/s.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ở cùng một độ cao, vật A được ném ngang với vận tốc $v_0$, vật B được ném ngang với vận tốc $4 v_0$ (bỏ qua sức cản không khí). Tỉ số tầm xa $\\frac{L_B}{L_A}$ bằng:", "options": ["A. 16", "B. 4", "C. 1", "D. $\\sqrt{4}$"], "answer": "B", "explain": "Tầm xa $L = v_0\\sqrt{\\frac{2h}{g}}$ tỉ lệ thuận với $v_0$ (cùng $h$, $g$) nên $\\frac{L_B}{L_A} = \\frac{4 v_0}{v_0} = 4$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Một vật được ném ngang từ độ cao $h = 405$ m (bỏ qua sức cản không khí). Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Thời gian vật chạm đất là $t = \\sqrt{\\frac{2h}{g}} = 9$ s (với $h = 405$ m, $g = 10$ m/s$^2$).", "b) Tầm xa của vật tỉ lệ thuận với vận tốc ném ban đầu $v_0$.", "c) Khối lượng của vật ảnh hưởng đến tầm xa của chuyển động ném ngang.", "d) Theo phương ngang, vật chuyển động thẳng đều với vận tốc $v_0$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $t = \\sqrt{\\frac{2 \\cdot 405}{10}} = 9$ s. b) Đúng: $L = v_0\\sqrt{\\frac{2h}{g}}$ tỉ lệ thuận với $v_0$ (hoặc $t = \\sqrt{\\frac{2h}{g}}$ nên $h$ tăng 4 lần thì $t$ tăng $\\sqrt{4} = 2$ lần). c) Sai: thời gian rơi chỉ phụ thuộc $h$ (và $g$), không phụ thuộc $v_0$ hay khối lượng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Một vật được ném ngang với vận tốc $v_0 = 24$ m/s từ độ cao $h = 405$ m (lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí). Xét tính đúng sai của các phát biểu sau:", "statements": ["a) Thời gian chuyển động của vật là $9$ s.", "b) Tầm xa của vật là $216$ m.", "c) Nếu tính theo công thức $L = v_0\\sqrt{\\frac{h}{g}}$ thì được $152.74$ m.", "d) Khi tăng vận tốc ném ban đầu lên gấp đôi thì tầm xa tăng lên gấp 4 lần."], "answer": ["T", "T", "F", "F"], "explain": "$t = \\sqrt{\\frac{2 \\cdot 405}{10}} = 9$ s nên a) đúng. $L = v_0 t = 24 \\cdot 9 = 216$ m nên b) đúng. c) Sai: công thức đúng phải có số 2, $L = v_0\\sqrt{\\frac{2h}{g}}$. d) Sai: $L$ tỉ lệ thuận (bậc nhất) với $v_0$ nên $v_0$ tăng 2 lần thì $L$ tăng 2 lần.", "points": 1}, {"type": "short", "level": "VD", "q": "Một quả bóng được đá mạnh lăn khỏi sân thượng cao 54 m với tốc độ ban đầu 405 m/s theo phương ngang. Tính tầm xa $L$ của vật (đơn vị: m; lấy $g = 10$ m/s$^2$, bỏ qua sức cản không khí).", "answer": "486", "explain": "Thời gian rơi: $t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 405}{10}} = 9$ s. Tầm xa: $L = v_0 t = 54 \\cdot 9 = 486$ m.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Từ độ cao 5 m, một vật được ném ngang và chạm đất cách chân đường thẳng đứng qua vị trí ném 25 m theo phương ngang. Tính vận tốc ném ban đầu $v_0$ của vật (đơn vị: m/s; lấy $g = 10$ m/s$^2$, bỏ qua sức cản).", "answer": "25", "explain": "$t = \\sqrt{\\frac{2h}{g}} = \\sqrt{\\frac{2 \\cdot 5}{10}} = 1$ s. $v_0 = \\frac{L}{t} = \\frac{25}{1} = 25$ m/s.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Một vật được ném ngang từ độ cao $h = 500$ m với vận tốc ban đầu $v_0 = 60$ m/s. Đại lượng nào sau đây KHÔNG ảnh hưởng đến tầm xa của vật?", "options": ["A. Vận tốc ban đầu $v_0$", "B. Khối lượng của vật", "C. Độ cao $h$ nơi ném", "D. Gia tốc rơi tự do $g$"], "answer": "B", "explain": "Tầm xa $L = v_0\\sqrt{\\frac{2h}{g}}$ chỉ phụ thuộc $v_0$, $h$, $g$; khối lượng của vật không ảnh hưởng (khi bỏ qua sức cản không khí).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xét một vật được ném ngang từ độ cao $h = 500$ m (bỏ qua sức cản không khí). Phát biểu nào sau đây đúng?", "options": ["A. Theo phương ngang, vật chuyển động nhanh dần đều", "B. Theo phương thẳng đứng, vật chuyển động thẳng đều", "C. Theo phương ngang, vật chuyển động thẳng đều với vận tốc $v_0$", "D. Quỹ đạo chuyển động của vật là một đường thẳng"], "answer": "C", "explain": "Chuyển động ném ngang được phân tích thành hai thành phần độc lập: theo phương ngang là chuyển động thẳng đều, theo phương thẳng đứng là chuyển động rơi tự do; hợp lại cho quỹ đạo là một nhánh parabol.", "points": 0.25}, {"type": "mcq
