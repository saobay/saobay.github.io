ruefalse", "level": "VD", "q": "Về nước ở cây xanh:", "statements": ["a) Thoát hơi nước tạo lực hút nước lên lá", "b) Rễ hút nước và muối khoáng cho cây", "c) Cây héo do tế bào mất sức trương", "d) Trời râm mát cây không cần nước"], "answer": ["T", "T", "T", "F"], "explain": "Cây luôn cần nước cho quang hợp và trao đổi chất dù trời râm.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Tình huống mất nước ở người:", "statements": ["a) Vận động viên cần bù nước và điện giải", "b) Mất nước làm giảm thể tích máu", "c) Uống nước thay hoàn toàn được bữa ăn khi đói", "d) Thận điều hoà cân bằng nước của cơ thể"], "answer": ["T", "T", "F", "T"], "explain": "Nước không thay thế được năng lượng và chất dinh dưỡng của bữa ăn.", "points": 1}, {"type": "short", "level": "VD", "q": "Luộc trứng làm lòng trắng đông do hiện tượng gì?", "answer": "Biến tính protein", "explain": "Nhiệt làm protein biến tính, đông tụ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vận động viên mất nhiều mồ hôi cần bù gì ngoài nước?", "answer": "Điện giải", "explain": "Cần bù điện giải Na+, K+ mất qua mồ hôi.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Liên kết giữa các phân tử nước là", "options": ["A. Liên kết ion", "B. Liên kết peptide", "C. Liên kết cộng hoá trị", "D. Liên kết hydrogen"], "answer": "D", "explain": "Các phân tử nước hút nhau bằng liên kết hydrogen.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tính đặc hiệu của enzyme có nghĩa là", "options": ["A. Tác dụng mọi chất", "B. Mỗi enzyme chỉ xúc tác cho cơ chất phù hợp", "C. Bị hao mòn", "D. Hoạt động ở mọi pH"], "answer": "B", "explain": "Trung tâm hoạt động của enzyme chỉ vừa với cơ chất nhất định.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Glycogen được dự trữ chủ yếu ở", "options": ["A. Lá cây", "B. Gan và cơ của động vật", "C. Hạt lúa", "D. Củ khoai"], "answer": "B", "explain": "Động vật dự trữ đường dưới dạng glycogen ở gan và cơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Căn cứ phân biệt nguyên tố đa lượng và vi lượng là", "options": ["A. Màu sắc", "B. Lượng cơ thể cần", "C. Khối lượng nguyên tử", "D. Nguồn gốc"], "answer": "B", "explain": "Đa lượng cần nhiều, vi lượng cần ít.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thành phần chính của màng tế bào là", "options": ["A. Cellulose", "B. Tinh bột", "C. Phospholipid", "D. Glycogen"], "answer": "C", "explain": "Lớp kép phospholipid tạo khung màng tế bào.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vai trò chính của carbohydrate là", "options": ["A. Xúc tác", "B. Cung cấp và dự trữ năng lượng", "C. Miễn dịch", "D. Vận chuyển oxygen"], "answer": "B", "explain": "Đường là nguồn năng lượng chính của tế bào.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Nhận xét tổng hợp về nước và nguyên tố:", "statements": ["a) Nước chiếm khoảng 70 phần trăm khối lượng tế bào", "b) Cacbon là nguyên tố đa lượng", "c) Sắt là nguyên tố đa lượng", "d) Công thức hoá học của nước là H₂O"], "answer": ["T", "T", "F", "T"], "explain": "Sắt là nguyên tố vi lượng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về vai trò của nước:", "statements": ["a) Nhiệt dung riêng lớn giúp nước điều hoà nhiệt", "b) Mồ hôi bay hơi mang nhiệt ra khỏi cơ thể", "c) Nước đá chìm xuống đáy hồ vào mùa đông", "d) Nước tham gia vận chuyển chất trong cây"], "answer": ["T", "T", "F", "T"], "explain": "Nước đá nhẹ hơn nước nên nổi trên mặt.", "points": 1}, {"type": "short", "level": "NB", "q": "Nguyên tố nào tạo khung cho hợp chất hữu cơ?", "answer": "Cacbon", "explain": "Cacbon tạo 4 liên kết cộng hoá trị làm khung hữu cơ.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Thiếu sắt gây bệnh gì?", "answer": "Thiếu máu", "explain": "Thiếu sắt giảm hemoglobin gây thiếu máu.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Đơn phân cấu tạo protein là", "options": ["A. Glucose", "B. Amino acid", "C. Nucleotide", "D. Acid béo"], "answer": "B", "explain": "Protein là chuỗi các amino acid.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cacbon có vai trò đặc biệt với sự sống?", "options": ["A. Vì nhẹ nhất", "B. Vì tạo 4 liên kết cộng hoá trị, làm khung cho hợp chất hữu cơ đa dạng", "C. Vì tan trong nước", "D. Vì là kim loại"], "answer": "B", "explain": "4 liên kết cộng hoá trị giúp C tạo vô số hợp chất hữu cơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tố nào sau đây là nguyên tố đa lượng?", "options": ["A. Kẽm", "B. Đồng", "C. Cacbon", "D. Iốt"], "answer": "C", "explain": "Cacbon là nguyên tố đa lượng, khung của hợp chất hữu cơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nitơ là thành phần của", "options": ["A. Nước", "B. Protein và nucleic acid", "C. Đường", "D. Mỡ"], "answer": "B", "explain": "N có trong amino acid và base nitơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Công thức hoá học của nước là", "options": ["A. H₂O", "B. CO₂", "C. O₂", "D. NaCl"], "answer": "A", "explain": "Phân tử nước gồm 2 nguyên tử H và 1 nguyên tử O.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chức năng của mRNA là", "options": ["A. Mang thông tin từ DNA để tổng hợp protein", "B. Dự trữ năng lượng", "C. Cấu tạo màng", "D. Xúc tác"], "answer": "A", "explain": "mRNA là bản sao thông tin, làm khuôn dịch mã.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Nhận xét về các đơn phân:", "statements": ["a) Amino acid là đơn phân của protein", "b) Glucose là đường đơn", "c) Lipid tan tốt trong nước", "d) DNA gồm 2 mạch xoắn kép"], "answer": ["T", "T", "F", "T"], "explain": "Lipid kỵ nước, không tan trong nước.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Phân biệt đa lượng và vi lượng:", "statements": ["a) Đa lượng cần lượng lớn, vi lượng cần lượng nhỏ", "b) Vi lượng kém quan trọng hơn đa lượng", "c) Thiếu vi lượng cũng gây bệnh nghiêm trọng", "d) Cơ thể tự tạo được mọi nguyên tố cần thiết"], "answer": ["T", "F", "T", "F"], "explain": "Vi lượng quan trọng không kém; cơ thể không tự tạo nguyên tố.", "points": 1}, {"type": "short", "level": "NB", "q": "Viết công thức hoá học của nước.", "answer": "H₂O", "explain": "Phân tử nước gồm 2 H và 1 O.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nguyên tố nào có trong diệp lục?", "answer": "Magiê", "explain": "Magiê ở trung tâm phân tử diệp lục.", "points": 0.5}]}]}
