"NB", "q": "Nhờ đặc điểm nào mà nước giúp cơ thể điều hoà thân nhiệt hiệu quả?", "options": ["A. Nhiệt dung riêng lớn", "B. Khối lượng riêng nhỏ", "C. Không màu", "D. Không mùi"], "answer": "A", "explain": "Nước có nhiệt dung riêng lớn nên hấp thụ hay toả nhiệt mà nhiệt độ thay đổi ít.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ngoài cấu tạo xương, canxi còn tham gia", "options": ["A. Quang hợp", "B. Đông máu, co cơ và dẫn truyền thần kinh", "C. Vận chuyển oxygen", "D. Tổng hợp diệp lục"], "answer": "B", "explain": "Ion Ca2+ cần cho đông máu, co cơ và truyền tín hiệu thần kinh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Giải thích vì sao tinh thể muối ăn tan nhanh hơn trong nước ấm so với nước nguội?", "options": ["A. Vì nước ấm làm muối bay hơi", "B. Vì chuyển động nhiệt mạnh giúp phân tử nước tách các ion khỏi tinh thể nhanh hơn", "C. Vì muối biến thành đường", "D. Vì nước ấm không phân cực"], "answer": "B", "explain": "Nhiệt độ cao làm phân tử nước chuyển động mạnh, va chạm và hydrat hoá các ion nhanh hơn nên muối tan nhanh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ruộng lúa lá vàng úa từ lá già, cây còi cọc. Dấu hiệu này gợi ý cây thiếu nguyên tố đa lượng nào?", "options": ["A. Nitơ", "B. Sắt", "C. Kẽm", "D. Đồng"], "answer": "A", "explain": "N linh động trong cây; thiếu N cây huy động N từ lá già nuôi lá non nên lá già vàng trước, cây còi cọc.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Giải thích sự hoà tan:", "statements": ["a) Muối ăn tan vì các ion được phân tử nước bao quanh", "b) Đường tan vì tạo liên kết hydrogen với nước", "c) Dầu ăn tan trong nước tạo dung dịch đồng nhất", "d) Chất không phân cực khó tan trong nước"], "answer": ["T", "T", "F", "T"], "explain": "Chất phân cực và ion tan tốt trong nước; dầu không phân cực nên không tan.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Về nước tự do và nước liên kết:", "statements": ["a) Nước tự do là môi trường của phản ứng sinh hoá", "b) Nước liên kết gắn chặt với protein", "c) Hạt khô nảy mầm cần hút nước tự do", "d) Sấy khô loại bỏ được mọi dạng nước trong hạt"], "answer": ["T", "T", "T", "F"], "explain": "Nước liên kết khó bị mất khi sấy; hạt nảy mầm cần hút nước tự do.", "points": 1}, {"type": "short", "level": "VD", "q": "Chất tan tốt trong nước thường có đặc điểm cấu tạo nào?", "answer": "Phân cực", "explain": "Chất phân cực hoặc chất ion tan tốt trong nước phân cực.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cây còi cọc, lá vàng úa do thiếu nguyên tố đa lượng nào phổ biến nhất?", "answer": "Nitơ", "explain": "Thiếu nitơ cây không tổng hợp đủ protein và diệp lục.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Iốt là thành phần không thể thiếu của", "options": ["A. Xương và răng", "B. Hormone tuyến giáp", "C. Diệp lục", "D. Enzyme tiêu hoá"], "answer": "B", "explain": "Iốt tham gia cấu tạo hormone tuyến giáp (thyroxine) điều hoà trao đổi chất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Natri và kali trong cơ thể có vai trò quan trọng trong", "options": ["A. Cấu tạo xương", "B. Cân bằng thẩm thấu và dẫn truyền xung thần kinh", "C. Quang hợp", "D. Vận chuyển oxygen"], "answer": "B", "explain": "Na+, K+ duy trì cân bằng nước, điện giải và tạo điện thế hoạt động của tế bào thần kinh, tế bào cơ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Người bị mất nước nặng (tiêu chảy, nôn) thường mệt lả, rối loạn tim mạch vì", "options": ["A. Thiếu vitamin", "B. Nước là môi trường của phản ứng sinh hoá và duy trì thể tích máu; mất nước làm máu cô đặc, tuần hoàn kém", "C. Thiếu đường", "D. Thừa muối"], "answer": "B", "explain": "Mất nước làm giảm thể tích huyết tương, máu khó lưu thông, phản ứng trao đổi chất rối loạn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Người ta gọi nước là dung môi của sự sống vì", "options": ["A. Nước chiếm thể tích lớn nhất", "B. Nước hoà tan và vận chuyển chất, là môi trường và tham gia phản ứng sinh hoá, điều hoà nhiệt", "C. Nước có màu đẹp", "D. Nước rẻ tiền"], "answer": "B", "explain": "Tổng hợp mọi vai trò: dung môi, môi trường phản ứng, chất tham gia phản ứng, vận chuyển, điều hoà nhiệt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phốt pho là thành phần của các chất nào sau đây?", "options": ["A. Đường và mỡ", "B. ATP, DNA và phospholipid", "C. Tinh bột và cellulose", "D. Nước và muối ăn"], "answer": "B", "explain": "P có trong ATP (dự trữ năng lượng), nucleic acid và phospholipid màng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng thuỷ phân, nước có vai trò", "options": ["A. Làm chất xúc tác", "B. Cung cấp nhóm H và OH để cắt đứt liên kết hoá học", "C. Chỉ làm dung môi", "D. Ức chế phản ứng"], "answer": "B", "explain": "Thuỷ phân là phản ứng dùng nước để phá vỡ liên kết, ví dụ tiêu hoá tinh bột thành đường.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Nhận xét về phân tử nước:", "statements": ["a) Công thức hoá học của nước là H₂O", "b) Phân tử nước không có tính phân cực", "c) Nguyên tử O mang điện tích âm một phần", "d) Giữa các phân tử nước tồn tại liên kết hydrogen"], "answer": ["T", "F", "T", "T"], "explain": "Nước phân cực: đầu O âm, đầu H dương; các phân tử nước liên kết với nhau bằng liên kết hydrogen.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về hậu quả thiếu nguyên tố:", "statements": ["a) Thiếu sắt gây thiếu máu", "b) Thiếu iốt gây bướu cổ", "c) Thiếu canxi gây còi xương ở trẻ em", "d) Thừa nguyên tố nào cũng vô hại với cơ thể"], "answer": ["T", "T", "T", "F"], "explain": "Thiếu Fe, I, Ca đều gây bệnh; thừa nguyên tố cũng có thể gây độc.", "points": 1}, {"type": "short", "level": "NB", "q": "Tuyến giáp cần nguyên tố vi lượng nào để tạo hormone?", "answer": "Iốt", "explain": "Iốt tham gia cấu tạo hormone tuyến giáp thyroxine.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nước được gọi là gì đối với các chất tan phân cực?", "answer": "Dung môi", "explain": "Nhờ tính phân cực, nước là dung môi hoà tan nhiều chất.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "VD", "q": "Khi cắm ống thuỷ tinh nhỏ vào cốc nước, nước dâng lên trong ống. Hiện tượng này chủ yếu do", "options": ["A. Áp suất khí quyển đẩy nước lên", "B. Lực bám dính giữa nước và thành ống kết hợp liên kết hydrogen giữa các phân tử nước", "C. Nước sôi", "D. Trọng lực kéo nước lên"], "answer": "B", "explain": "Đó là hiện tượng mao dẫn: nước bám vào thành ống và các phân tử nước kéo nhau lên cao.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "So sánh vai trò của nước ở thực vật và động vật, điểm chung quan trọng nhất là", "options": ["A. Đều dùng nước để quang hợp", "B. Đều cần nước làm môi trường cho phản ứng sinh hoá và vận chuyển chất", "C. Đều uống nước", "D. Đều sống trong nước"], "answer": "B", "explain": "Dù khác nhau về cách lấy nước, mọi sinh vật đều cần nước làm môi trường phản ứng và vận chuyển chất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lưu huỳnh là thành phần của", "options": ["A. Mọi loại đường", "B. Một số amino acid và protein", "C. Nước", "D. Muối ăn"], "answer": "B", "explain": "S có trong một số amino acid như cysteine, methionine, giúp tạo cầu nối disulfide của protein.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nước hoà tan tốt muối ăn (NaCl)?", "options": ["A. Vì nước không phân cực", "B. Vì các đầu phân cực của nước hút và bao quanh các ion Na+ và Cl-", "C. Vì muối ăn nhẹ hơn nước", "D. Vì nước sôi ở 100 độ C"], "answer": "B", "explain": "Đầu O âm hút Na+, đầu H dương hút Cl-, tách các ion ra khỏi tinh thể muối (sự hydrat hoá).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cây bị héo rũ khi thiếu nước kéo dài chủ yếu vì", "options": ["A. Lá bị sâu ăn", "B. Tế bào mất sức trương do thiếu nước, khí khổng đóng lại", "C. Rễ bị thối", "D. Thiếu ánh sáng"], "answer": "B", "explain": "Nước tạo sức trương giữ tế bào căng; thiếu nước tế bào mềm nhũn, cây héo.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nước trong cơ thể tồn tại ở hai dạng là", "options": ["A. Nước mưa và nước giếng", "B. Nước tự do và nước liên kết", "C. Nước nóng và nước lạnh", "D. Nước ngọt và nước mặn"], "answer": "B", "explain": "Nước tự do làm dung môi, môi trường phản ứng; nước liên kết gắn chặt với protein, khó mất khi sấy.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Về cân bằng nước của cơ thể:", "statements": ["a) Mất nước làm giảm thể tích máu", "b) Tiêu chảy cần bù nước và điện giải", "c) Uống càng nhiều nước càng tốt, không có giới hạn", "d) Thận giúp điều hoà lượng nước trong cơ thể"], "answer": ["T", "T", "F", "T"], "explain": "Mất nước giảm thể tích máu; cần bù điện giải; uống quá nhiều cũng gây hại; thận điều hoà nước.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Tình huống cây thiếu magiê:", "statements": ["a) Cây bị vàng lá do thiếu diệp lục", "b) Bón phân chứa Mg có thể khắc phục hiện tượng trên", "c) Thiếu magiê làm giảm quang hợp của cây", "d) Magiê là nguyên tố vi lượng"], "answer": ["T", "T", "T", "F"], "explain": "Mg là thành phần diệp lục (đa lượng); thiếu Mg vàng lá, quang hợp kém; bón Mg khắc phục được.", "points": 1}, {"type": "short", "level": "VD", "q": "Cơ thể thải nhiệt qua da chủ yếu nhờ quá trình nào của mồ hôi?", "answer": "Bay hơi mồ hôi", "explain": "Bay hơi mồ hôi lấy đi lượng nhiệt lớn làm mát cơ thể.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vận động viên mất nhiều mồ hôi cần bù thêm gì ngoài nước?", "answer": "Điện giải", "explain": "Mồ hôi mất muối khoáng nên cần bù điện giải như Na+, K+.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Magiê là thành phần cấu tạo của", "options": ["A. Hemoglobin", "B. Diệp lục ở cây xanh", "C. Xương", "D. Hormone tuyến giáp"], "answer": "B", "explain": "Mg nằm ở trung tâm phân tử diệp lục giúp cây quang hợp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nước vận chuyển các chất trong thân cây một phần nhờ", "options": ["A. Sức căng bề mặt và hiện tượng mao dẫn", "B. Trọng lực", "C. Gió thổi", "D. Ánh sáng"], "answer": "A", "explain": "Liên kết hydrogen tạo sức căng bề mặt và lực bám dính giúp nước leo lên trong mạch gỗ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kẽm trong cơ thể chủ yếu tham gia", "options": ["A. Cấu tạo xương", "B. Cấu tạo và hoạt hoá nhiều loại enzyme", "C. Cấu tạo hồng cầu", "D. Cấu tạo diệp lục"], "answer": "B", "explain": "Zn là thành phần hoặc chất hoạt hoá của nhiều enzyme trong cơ thể.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Căn cứ chủ yếu để phân biệt nguyên tố đa lượng và nguyên tố vi lượng là", "options": ["A. Khối lượng nguyên tử", "B. Lượng mà cơ thể sinh vật cần", "C. Trạng thái tồn tại", "D. Màu sắc"], "answer": "B", "explain": "Đa lượng là nhóm cơ thể cần với lượng lớn, vi lượng chỉ cần lượng rất nhỏ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Liên kết được hình thành giữa các phân tử nước với nhau là", "options": ["A. Liên kết ion", "B. Liên kết cộng hoá trị", "C. Liên kết hydrogen", "D. Liên kết peptide"], "answer": "C", "explain": "Đầu O âm của phân tử này hút đầu H dương của phân tử kia tạo liên kết hydrogen.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nước giúp cơ thể điều hoà thân nhiệt chủ yếu nhờ", "options": ["A. Nhiệt dung riêng lớn và bay hơi mang theo nhiệt", "B. Có màu trong suốt", "C. Dẫn điện tốt", "D. Nhẹ hơn không khí"], "answer": "A", "explain": "Nước hấp thụ nhiều nhiệt mà ít tăng nhiệt độ; mồ hôi bay hơi lấy đi lượng nhiệt lớn làm mát cơ thể.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Nhận xét về các nguyên tố đa lượng:", "statements": ["a) C, H, O, N chiếm phần lớn khối lượng khô của tế bào", "b) Nguyên tố đa lượng là nguyên tố cơ thể cần với lượng rất nhỏ", "c) Phốt pho là nguyên tố đa lượng", "d) Lưu huỳnh tham gia cấu tạo một số amino acid"], "answer": ["T", "F", "T", "T"], "explain": "C, H, O, N chiếm khoảng 96 phần trăm khối lượng khô; P, S là đa lượng; đa lượng là nhóm cần lượng lớn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về nước với các phản ứng hoá học:", "statements": ["a) Phản ứng thuỷ phân cần có nước", "b) Nước là nguyên liệu của quang hợp", "c) Nước chỉ là môi trường, không tham gia phản ứng hoá học", "d) Hô hấp tế bào tạo ra nước"], "answer": ["T", "T", "F", "T"], "explain": "Nước vừa là môi trường, vừa là nguyên liệu (quang hợp, thuỷ phân) và sản phẩm (hô hấp).", "points": 1}, {"type": "short", "level": "NB", "q": "Nguyên tố nào tạo nên khung xương của các hợp chất hữu cơ?", "answer": "Cacbon", "explain": "Cacbon tạo 4 liên kết cộng hoá trị, làm khung cho mọi hợp chất hữu cơ.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nhóm nguyên tố mà cơ thể cần với lượng lớn được gọi là gì?", "answer": "Nguyên tố đa lượng", "explain": "Đa lượng gồm C, H, O, N, P, S và một số nguyên tố khác.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên tố nào được coi là khung xương của các hợp chất hữu cơ?", "options": ["A. Oxygen", "B. Cacbon", "C. Nitơ", "D. Hydrogen"], "answer": "B", "explain": "Cacbon tạo 4 liên kết cộng hoá trị nên làm khung xương cho mọi hợp chất hữu cơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cacbon được coi là nguyên tố có vai trò đặc biệt quan trọng với sự sống?", "options": ["A. Vì cacbon nhẹ nhất", "B. Vì cacbon tạo được 4 liên kết cộng hoá trị bền vững, làm khung cho phân tử hữu cơ đa dạng", "C. Vì cacbon tan trong nước", "D. Vì cacbon là kim loại"], "answer": "B", "explain": "Khả năng tạo 4 liên kết cộng hoá trị giúp C tạo nên vô số hợp chất hữu cơ với cấu trúc đa dạng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Công thức hoá học của phân tử nước là", "options": ["A. CO₂", "B. O₂", "C. H₂O", "D. C₆H₁₂O₆"], "answer": "C", "explain": "Phân tử nước gồm 2 nguyên tử H liên kết với 1 nguyên tử O: H₂O.", "points": 0.25}, {"type": "mcq", "
