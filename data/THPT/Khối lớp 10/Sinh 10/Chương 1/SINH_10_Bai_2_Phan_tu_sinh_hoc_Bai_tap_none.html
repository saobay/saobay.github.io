 dưỡng và năng lượng:", "statements": ["a) 1g lipid cho năng lượng gấp hơn 2 lần 1g đường", "b) Ăn thừa đường được chuyển thành mỡ dự trữ", "c) Thiếu protein gây suy dinh dưỡng ở trẻ em", "d) Chỉ cần ăn đủ đường là cơ thể khoẻ mạnh"], "answer": ["T", "T", "T", "F"], "explain": "Cơ thể cần đủ các nhóm chất, chỉ ăn đường gây thiếu protein, vitamin, khoáng.", "points": 1}, {"type": "short", "level": "VD", "q": "Vì sao luộc trứng làm lòng trắng đông đặc?", "answer": "Biến tính protein", "explain": "Nhiệt làm protein biến tính, đông tụ lại.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Quá trình tổng hợp protein từ mRNA được gọi là gì?", "answer": "Dịch mã", "explain": "Dịch mã: thông tin trên mRNA được dịch thành chuỗi amino acid.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Chất cấu tạo nên thành tế bào thực vật là", "options": ["A. Tinh bột", "B. Glycogen", "C. Cellulose", "D. Kitin"], "answer": "C", "explain": "Cellulose là polysaccharide cấu trúc tạo thành tế bào thực vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vai trò của cellulose đối với thực vật là", "options": ["A. Dự trữ năng lượng", "B. Cấu trúc, tạo thành tế bào", "C. Xúc tác", "D. Vận chuyển chất"], "answer": "B", "explain": "Cellulose là polysaccharide cấu trúc tạo độ cứng cho thành tế bào thực vật.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao phospholipid tự sắp xếp thành lớp kép trong môi trường nước?", "options": ["A. Do ngẫu nhiên", "B. Đầu ưa nước quay ra tiếp xúc nước, đuôi kỵ nước quay vào trong tránh nước", "C. Do nhiệt độ", "D. Do ánh sáng"], "answer": "B", "explain": "Cấu trúc lưỡng tính giúp phospholipid tự tạo màng kép ổn định trong môi trường nước.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sốt cao kéo dài rất nguy hiểm vì", "options": ["A. Cơ thể mất nước nhẹ", "B. Nhiệt cao làm biến tính protein, enzyme, rối loạn mọi hoạt động sống", "C. Tim đập nhanh", "D. Da đỏ"], "answer": "B", "explain": "Protein và enzyme chỉ ổn định ở khoảng nhiệt nhất định; sốt cao gây biến tính hàng loạt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Base nitơ nào chỉ có ở DNA mà không có ở RNA?", "options": ["A. Uracil", "B. Thymine", "C. Adenine", "D. Cytosine"], "answer": "B", "explain": "DNA chứa thymine (T), còn RNA chứa uracil (U).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chức năng của mRNA là", "options": ["A. Mang thông tin từ DNA để tổng hợp protein", "B. Dự trữ năng lượng", "C. Xúc tác", "D. Cấu tạo ribosome"], "answer": "A", "explain": "mRNA sao chép thông tin từ DNA (phiên mã) rồi làm khuôn tổng hợp protein (dịch mã).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Nhận xét về protein:", "statements": ["a) Đơn phân của protein là amino acid", "b) Có 20 loại amino acid cấu tạo protein", "c) Protein chỉ có một bậc cấu trúc", "d) Liên kết peptide nối các amino acid với nhau"], "answer": ["T", "T", "F", "T"], "explain": "Protein có 4 bậc cấu trúc; các amino acid nối nhau bằng liên kết peptide.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về cấu tạo nucleotide:", "statements": ["a) Nucleotide gồm đường 5 carbon", "b) Nucleotide gồm base nitơ", "c) Nucleotide gồm nhóm phosphate", "d) ATP không phải là một nucleotide"], "answer": ["T", "T", "T", "F"], "explain": "ATP (adenosine triphosphate) chính là một nucleotide.", "points": 1}, {"type": "short", "level": "NB", "q": "Base nitơ nào chỉ có ở RNA?", "answer": "Uracil", "explain": "RNA chứa uracil (U) thay cho thymine (T).", "points": 0.5}, {"type": "short", "level": "TH", "q": "Protein nào vận chuyển oxygen trong máu?", "answer": "Hemoglobin", "explain": "Hemoglobin trong hồng cầu vận chuyển O₂.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "VD", "q": "Trâu, bò tiêu hoá được cellulose trong cỏ nhờ", "options": ["A. Răng chắc khoẻ", "B. Vi sinh vật cộng sinh trong dạ cỏ tiết enzyme cellulase", "C. Dạ dày to", "D. Nhai kĩ"], "answer": "B", "explain": "Vi sinh vật dạ cỏ phân giải cellulose thành chất đơn giản mà trâu bò hấp thụ được.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "DNA của vi khuẩn sống ở suối nước nóng thường giàu cặp G-C vì", "options": ["A. G-C đẹp hơn", "B. Cặp G-C có 3 liên kết hydrogen nên DNA bền nhiệt hơn", "C. G-C nhẹ hơn", "D. Ngẫu nhiên"], "answer": "B", "explain": "3 liên kết hydrogen giữa G-C giữ 2 mạch chặt hơn, chịu được nhiệt độ cao.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chất nào sau đây thuộc nhóm lipid?", "options": ["A. Tinh bột", "B. Mỡ động vật", "C. Protein", "D. DNA"], "answer": "B", "explain": "Mỡ, dầu, phospholipid, steroid đều thuộc nhóm lipid.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Protein có chức năng rất đa dạng vì", "options": ["A. Protein rất nhẹ", "B. Protein được cấu tạo từ 20 loại amino acid với vô số cách sắp xếp và 4 bậc cấu trúc", "C. Protein tan trong nước", "D. Protein có màu sắc"], "answer": "B", "explain": "Sự đa dạng của trình tự và cấu trúc tạo nên sự đa dạng chức năng của protein.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trên cùng một khối lượng, lipid cung cấp năng lượng gấp khoảng 2 lần carbohydrate vì", "options": ["A. Lipid chứa nhiều oxygen hơn", "B. Lipid giàu C và H, ít O nên khi oxi hoá hoàn toàn giải phóng nhiều năng lượng hơn", "C. Lipid nặng hơn", "D. Lipid ngọt hơn"], "answer": "B", "explain": "Carbohydrate đã bị oxi hoá một phần (nhiều O), còn lipid giàu liên kết C-H giàu năng lượng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Kĩ thuật PCR nhân bản DNA cần enzyme Taq polymerase vì", "options": ["A. Enzyme này rẻ", "B. Enzyme chịu được nhiệt độ cao của các chu kì biến tính DNA", "C. Enzyme có màu đẹp", "D. Enzyme nhẹ"], "answer": "B", "explain": "Taq polymerase từ vi khuẩn suối nước nóng không bị biến tính ở 94 độ C của PCR.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Về cấu trúc màng tế bào:", "statements": ["a) Lớp kép phospholipid là khung của màng tế bào", "b) Protein màng giúp vận chuyển các chất", "c) Cholesterol giúp màng tế bào động vật ổn định", "d) Màng tế bào cho mọi chất thấm qua tự do"], "answer": ["T", "T", "T", "F"], "explain": "Màng tế bào thấm có chọn lọc, không cho mọi chất qua tự do.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Tình huống bệnh lí liên quan enzyme và hormone:", "statements": ["a) Thiếu lactase gây khó tiêu khi uống sữa", "b) Tiểu đường type 1 do thiếu insulin", "c) Bổ sung enzyme tiêu hoá giúp giảm triệu chứng khó tiêu", "d) Mọi bệnh tiêu hoá đều do thiếu enzyme"], "answer": ["T", "T", "T", "F"], "explain": "Nhiều bệnh tiêu hoá do nguyên nhân khác như nhiễm khuẩn, viêm loét.", "points": 1}, {"type": "short", "level": "VD", "q": "Giữa G và C có mấy liên kết hydrogen?", "answer": "Ba", "explain": "Cặp G-C có 3 liên kết hydrogen nên bền hơn cặp A-T.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Người không dung nạp đường sữa (lactose) thiếu enzyme nào?", "answer": "Lactase", "explain": "Thiếu lactase không tiêu hoá được lactose trong sữa.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Base nitơ nào chỉ có ở RNA mà không có ở DNA?", "options": ["A. Adenine", "B. Thymine", "C. Guanine", "D. Uracil"], "answer": "D", "explain": "RNA chứa uracil (U) thay cho thymine (T) của DNA.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau cơ bản giữa DNA và RNA là", "options": ["A. DNA có 2 mạch, chứa T và đường deoxyribose; RNA có 1 mạch, chứa U và đường ribose", "B. Không có điểm khác", "C. DNA ở ngoài tế bào", "D. RNA dài hơn DNA"], "answer": "A", "explain": "DNA: 2 mạch, base A-T-G-C, đường deoxyribose; RNA: 1 mạch, base A-U-G-C, đường ribose.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phospholipid là thành phần chính cấu tạo nên", "options": ["A. Thành tế bào", "B. Màng tế bào", "C. Nhân tế bào", "D. Ti thể"], "answer": "B", "explain": "Lớp kép phospholipid là khung cơ bản của mọi màng tế bào.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vai trò chính của carbohydrate đối với tế bào là", "options": ["A. Lưu trữ thông tin di truyền", "B. Cung cấp và dự trữ năng lượng", "C. Xúc tác phản ứng", "D. Vận chuyển oxygen"], "answer": "B", "explain": "Carbohydrate là nguồn năng lượng chính và dạng dự trữ năng lượng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Có bao nhiêu loại amino acid tham gia cấu tạo protein?", "options": ["A. 4", "B. 10", "C. 20", "D. 64"], "answer": "C", "explain": "Có 20 loại amino acid khác nhau cấu tạo nên protein.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Các amino acid trong chuỗi polypeptide nối với nhau bằng", "options": ["A. Liên kết hydrogen", "B. Liên kết ion", "C. Liên kết peptide", "D. Liên kết disulfide"], "answer": "C", "explain": "Liên kết peptide nối nhóm carboxyl của amino acid này với nhóm amin của amino acid kia.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Nhận xét về carbohydrate:", "statements": ["a) Đơn phân của carbohydrate là đường đơn", "b) Glucose là một loại đường đơn", "c) Cellulose là đường đôi", "d) Tinh bột là dạng dự trữ đường ở thực vật"], "answer": ["T", "T", "F", "T"], "explain": "Cellulose là đường đa (polysaccharide) cấu trúc, không phải đường đôi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Về chức năng của protein:", "statements": ["a) Enzyme xúc tác các phản ứng sinh hoá", "b) Keratin là protein cấu trúc của tóc, móng", "c) Insulin là hormone có bản chất protein", "d) Protein không tham gia bảo vệ cơ thể"], "answer": ["T", "T", "T", "F"], "explain": "Protein tham gia bảo vệ cơ thể qua kháng thể.", "points": 1}, {"type": "short", "level": "NB", "q": "Đơn phân cấu tạo nên protein là gì?", "answer": "Amino acid", "explain": "Protein là chuỗi các amino acid nối bằng liên kết peptide.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Liên kết nào nối các amino acid trong chuỗi polypeptide?", "answer": "Liên kết peptide", "explain": "Liên kết peptide nối nhóm carboxyl với nhóm amin.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Chất nào sau đây là đường đơn?", "options": ["A. Saccharose", "B. Tinh bột", "C. Glucose", "D. Cellulose"], "answer": "C", "explain": "Glucose là đường đơn (monosaccharide) phổ biến nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tiêu chí phân biệt đường đơn, đường đôi và đường đa là", "options": ["A. Màu sắc", "B. Số lượng đơn phân đường cấu tạo nên", "C. Độ ngọt", "D. Nguồn gốc"], "answer": "B", "explain": "Đường đơn có 1 đơn phân, đường đôi có 2 đơn phân, đường đa có nhiều đơn phân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Glycogen là dạng dự trữ đường ở", "options": ["A. Thực vật", "B. Động vật (gan và cơ)", "C. Vi khuẩn", "D. Nấm"], "answer": "B", "explain": "Động vật dự trữ đường dưới dạng glycogen ở gan và cơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao lipid là dạng dự trữ năng lượng hiệu quả hơn carbohydrate?", "options": ["A. Vì lipid nhẹ hơn", "B. Vì lipid giàu liên kết C-H, khi oxi hoá giải phóng nhiều năng lượng hơn", "C. Vì lipid tan trong nước", "D. Vì lipid có màu vàng"], "answer": "B", "explain": "1g lipid cho khoảng 9 kcal, gấp hơn 2 lần 1g carbohydrate (4 kcal).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đơn phân cấu tạo nên carbohydrate là", "options": ["A. Amino acid", "B. Đường đơn", "C. Nucleotide", "D. Acid béo"], "answer": "B", "explain": "Carbohydrate được cấu tạo từ các đơn phân đường đơn (monosaccharide).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một nucleotide được cấu tạo gồm", "options": ["A. Đường 5 carbon, base nitơ và nhóm phosphate", "B. 3 amino acid", "C. 2 phân tử đường", "D. Glycerol và acid béo"], "answer": "A", "explain": "Mỗi nucleotide gồm đường pentose, một base nitơ và một nhóm phosphate.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Nhận xét về lipid:", "statements": ["a) Lipid tan tốt trong nước", "b) Mỡ động vật là một loại lipid", "c) Phospholipid cấu tạo nên màng tế bào", "d) Dầu thực vật thuộc nhóm lipid"], "answer": ["F", "T", "T", "T"], "explain": "Lipid kỵ nước, không tan trong nước; mỡ, dầu, phospholipid đều là lipid.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Phân loại các loại đường:", "statements": ["a) Saccharose là đường đôi", "b) Fructose là đường đơn", "c) Glycogen là đường đơn", "d) Lactose là đường đôi có trong sữa"], "answer": ["T", "T", "F", "T"], "explain": "Glycogen là đường đa dự trữ ở động vật.", "points": 1}, {"type": "short", "level": "NB", "q": "Kể tên một loại đường đơn.", "answer": "Glucose", "explain": "Glucose là đường đơn phổ biến nhất.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Dạng dự trữ đường ở động vật là gì?", "answer": "Glycogen", "explain": "Glycogen dự trữ ở gan và cơ của động vật.", "points": 0.5}]}]}
