<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1","questions": [{"answer": "C","explain": "ATP gồm adenine + ribose + 3 nhóm phosphate.","level": "NB","options": ["A. Adenine + deoxyribose + 1 phosphate","B. Guanine + ribose + 3 phosphate","C. Adenine + ribose + 3 nhóm phosphate","D. Thymine + ribose + 2 phosphate"],"points": 0.25,"q": "Phân tử ATP được cấu tạo từ","type": "mcq"},{"answer": "B","explain": "Enzyme là chất xúc tác sinh học, tăng tốc độ phản ứng, không bị biến đổi sau phản ứng.","level": "NB","options": ["A. Chất cung cấp năng lượng","B. Chất xúc tác sinh học","C. Chất dự trữ năng lượng","D. Chất tham gia cấu tạo màng"],"points": 0.25,"q": "Enzyme là","type": "mcq"},{"answer": "D","explain": "Trung tâm hoạt động là nơi cơ chất liên kết tạm thời.","level": "TH","options": ["A. Nơi dự trữ năng lượng","B. Nơi tổng hợp protein","C. Nơi chứa DNA","D. Nơi cơ chất liên kết tạm thời để thực hiện phản ứng"],"points": 0.25,"q": "Trung tâm hoạt động của enzyme là","type": "mcq"},{"answer": "C","explain": "Đồng hóa: tổng hợp chất phức tạp, tích lũy năng lượng (quang hợp).","level": "VD","options": ["A. Phân giải chất phức tạp, giải phóng năng lượng","B. Tổng hợp chất phức tạp, giải phóng năng lượng","C. Tổng hợp chất phức tạp từ chất đơn giản, tích lũy năng lượng","D. Phân giải chất đơn giản, tích lũy năng lượng"],"points": 0.25,"q": "Quá trình đồng hóa là","type": "mcq"},{"answer": "B","explain": "Nhiệt độ cao phá vỡ cấu trúc không gian của protein enzyme → biến tính, mất hoạt tính.","level": "VD","options": ["A. Tăng hoạt tính vô hạn","B. Phá vỡ cấu trúc không gian làm enzyme biến tính, mất hoạt tính","C. Không ảnh hưởng","D. Làm enzyme hoạt động mạnh hơn"],"points": 0.25,"q": "Vì sao đun sôi làm mất hoạt tính của enzyme?","type": "mcq"},{"answer": "D","explain": "Pepsin hoạt động ở dạ dày pH ≈ 2; pH 7 làm giảm mạnh hoạt tính.","level": "VDC","options": ["A. Tăng mạnh","B. Không đổi","C. Tăng nhẹ","D. Giảm mạnh, gần như mất hoạt tính"],"points": 0.25,"q": "Enzyme pepsin có pH tối ưu khoảng 2. Nếu chuyển sang môi trường pH = 7, hoạt tính của nó sẽ","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: cần năng lượng để gắn Pi vào ADP tạo ATP. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về ATP:","statements": ["a) ATP được ví như đồng tiền năng lượng của tế bào.","b) ATP cung cấp năng lượng cho các hoạt động sống.","c) ATP được tạo ra từ ADP mà không cần năng lượng.","d) Liên kết giữa các nhóm phosphate là liên kết cao năng."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: enzyme không bị biến đổi. c) Đúng. d) Sai: một số là ARN (ribozyme).","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về enzyme:","statements": ["a) Enzyme làm tăng tốc độ phản ứng sinh hóa.","b) Enzyme bị biến đổi sau khi tham gia phản ứng.","c) Enzyme có tính đặc hiệu cao với cơ chất.","d) Mọi enzyme đều có bản chất là protein."],"type": "truefalse"},{"answer": "Catalase","explain": "Catalase phân giải H2O2 thành nước và O2.","level": "NB","points": 0.5,"q": "Enzyme phân giải H2O2 trong tế bào có tên là gì?","type": "short"},{"answer": "Amylase","explain": "Amylase trong nước bọt phân giải tinh bột thành đường.","level": "TH","points": 0.5,"q": "Enzyme trong nước bọt phân giải tinh bột có tên là gì?","type": "short"}]},{"name": "Đề 2","questions": [{"answer": "B","explain": "Dị hóa: phân giải chất phức tạp → đơn giản, giải phóng năng lượng (hô hấp).","level": "NB","options": ["A. Tổng hợp chất phức tạp, tích lũy năng lượng","B. Phân giải chất phức tạp thành chất đơn giản, giải phóng năng lượng","C. Tổng hợp chất đơn giản, tích lũy năng lượng","D. Không liên quan đến năng lượng"],"points": 0.25,"q": "Quá trình dị hóa là","type": "mcq"},{"answer": "D","explain": "Đa số enzyme là protein; một số là ARN (ribozyme).","level": "NB","options": ["A. Lipid","B. Carbohydrate","C. Axit nucleic duy nhất","D. Protein (một số là ARN)"],"points": 0.25,"q": "Bản chất hóa học của đa số enzyme là","type": "mcq"},{"answer": "B","explain": "Chìa khóa – ổ khóa: trung tâm hoạt động vừa khít với cơ chất → tính đặc hiệu.","level": "TH","options": ["A. Enzyme biến đổi hoàn toàn sau phản ứng","B. Trung tâm hoạt động vừa khít đặc hiệu với cơ chất","C. Mọi enzyme xúc tác mọi phản ứng","D. Enzyme cung cấp năng lượng cho phản ứng"],"points": 0.25,"q": "Thuyết chìa khóa – ổ khóa giải thích","type": "mcq"},{"answer": "C","explain": "Nhai cơm lâu: amylase phân giải tinh bột → đường (vị ngọt).","level": "VD","options": ["A. Cơm bị chua","B. Cơm bị đắng","C. Tinh bột được amylase phân giải thành đường","D. Enzyme bị biến tính"],"points": 0.25,"q": "Vì sao nhai cơm lâu thấy có vị ngọt?","type": "mcq"},{"answer": "A","explain": "Tăng cơ chất → tăng tốc độ đến ngưỡng bão hòa (enzyme đã làm việc tối đa).","level": "VD","options": ["A. Tăng đến ngưỡng bão hòa rồi không tăng nữa","B. Tăng mãi không giới hạn","C. Giảm dần","D. Không thay đổi"],"points": 0.25,"q": "Khi tăng nồng độ cơ chất, tốc độ phản ứng do enzyme xúc tác sẽ","type": "mcq"},{"answer": "C","explain": "Khoai sống có catalase → sủi bọt O2; khoai chín enzyme biến tính → không sủi bọt.","level": "VDC","options": ["A. Cả hai đều sủi bọt","B. Cả hai đều không sủi bọt","C. Khoai sống sủi bọt, khoai chín không sủi bọt","D. Khoai chín sủi bọt, khoai sống không"],"points": 0.25,"q": "Nhỏ H2O2 vào lát khoai tây sống và lát khoai đã luộc chín. Hiện tượng quan sát được là","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: ADP + Pi + năng lượng → ATP. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về ATP và hô hấp:","statements": ["a) Mọi hoạt động sống của tế bào đều cần ATP.","b) ATP được tái tạo từ ADP mà không cần năng lượng.","c) Quang hợp tạo ATP cho tế bào thực vật.","d) Hô hấp tế bào tạo ATP."],"type": "truefalse"},{"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng. c) Sai: nhiệt độ tối ưu thường 30–40°C. d) Sai: enzyme không bị tiêu hao.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về năng lượng hoạt hóa và nhiệt độ:","statements": ["a) Enzyme làm giảm năng lượng hoạt hóa của phản ứng.","b) Mỗi enzyme có nhiệt độ tối ưu riêng.","c) Mọi enzyme đều hoạt động tốt nhất ở 100°C.","d) Enzyme bị tiêu hao sau mỗi lần xúc tác."],"type": "truefalse"},{"answer": "Đồng hóa","explain": "Quang hợp tổng hợp chất hữu cơ, tích lũy năng lượng: đồng hóa.","level": "NB","points": 0.5,"q": "Quá trình tổng hợp chất hữu cơ, tích lũy năng lượng (như quang hợp) được gọi là gì?","type": "short"},{"answer": "Dị hóa","explain": "Hô hấp phân giải chất hữu cơ, giải phóng năng lượng: dị hóa.","level": "TH","points": 0.5,"q": "Quá trình phân giải chất hữu cơ, giải phóng năng lượng (như hô hấp) được gọi là gì?","type": "short"}]},{"name": "Đề 3","questions": [{"answer": "C","explain": "Năng lượng trong liên kết hóa học là thế năng (dự trữ).","level": "NB","options": ["A. Động năng","B. Nhiệt năng","C. Thế năng","D. Cơ năng"],"points": 0.25,"q": "Năng lượng dự trữ trong các liên kết hóa học thuộc dạng","type": "mcq"},{"answer": "A","explain": "Cơ chất là chất chịu tác động của enzyme.","level": "NB","options": ["A. Chất chịu sự tác động của enzyme","B. Sản phẩm của phản ứng","C. Chất ức chế enzyme","D. Enzyme thứ hai"],"points": 0.25,"q": "Cơ chất là","type": "mcq"},{"answer": "D","explain": "Enzyme + cơ chất → phức hợp E–S → sản phẩm + enzyme.","level": "TH","options": ["A. Enzyme + sản phẩm → cơ chất","B. Cơ chất tự biến đổi","C. Enzyme bị phân hủy","D. Enzyme + cơ chất → phức hợp E–S → sản phẩm + enzyme"],"points": 0.25,"q": "Trình tự hoạt động của enzyme là","type": "mcq"},{"answer": "B","explain": "Ức chế: giảm hoạt tính; hoạt hóa: tăng hoạt tính.","level": "VD","options": ["A. Đều làm tăng hoạt tính","B. Ức chế làm giảm, hoạt hóa làm tăng hoạt tính","C. Đều làm giảm hoạt tính","D. Không ảnh hưởng"],"points": 0.25,"q": "Chất ức chế và chất hoạt hóa ảnh hưởng đến enzyme như thế nào?","type": "mcq"},{"answer": "D","explain": "Tăng enzyme → tăng tốc độ (khi cơ chất dư thừa).","level": "VD","options": ["A. Giảm","B. Không đổi","C. Giảm rồi tăng","D. Tăng"],"points": 0.25,"q": "Khi tăng nồng độ enzyme (cơ chất dư thừa), tốc độ phản ứng sẽ","type": "mcq"},{"answer": "B","explain": "Sốt cao kéo dài làm enzyme biến tính → rối loạn chuyển hóa.","level": "VDC","options": ["A. Tăng cường miễn dịch","B. Enzyme bị biến tính, rối loạn chuyển hóa","C. Không ảnh hưởng","D. Tăng tốc độ phản ứng có lợi"],"points": 0.25,"q": "Vì sao sốt cao kéo dài (trên 41°C) nguy hiểm đến tính mạng?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: pH tối ưu khác nhau. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về yếu tố ảnh hưởng:","statements": ["a) Nhiệt độ quá cao làm enzyme biến tính.","b) Pepsin hoạt động tốt ở pH ≈ 2.","c) Mọi enzyme đều có pH tối ưu bằng 7.","d) Nồng độ cơ chất ảnh hưởng đến tốc độ phản ứng."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: enzyme là chất xúc tác. b) Đúng. c) Đúng. d) Sai: đồng hóa tích lũy năng lượng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về vai trò năng lượng của enzyme:","statements": ["a) Enzyme cung cấp năng lượng cho phản ứng.","b) Dị hóa giải phóng năng lượng.","c) Năng lượng dị hóa được dùng cho đồng hóa.","d) Đồng hóa giải phóng năng lượng."],"type": "truefalse"},{"answer": "Ribosome","explain": "Ribosome tổng hợp protein (trong đó có enzyme).","level": "NB","points": 0.5,"q": "Bào quan nào tổng hợp protein (kể cả enzyme)?","type": "short"},{"answer": "Pepsin","explain": "Pepsin ở dạ dày phân giải protein, pH tối ưu ≈ 2.","level": "TH","points": 0.5,"q": "Enzyme phân giải protein ở dạ dày có tên là gì?","type": "short"}]},{"name": "Đề 4","questions": [{"answer": "B","explain": "Động năng: năng lượng của vật đang chuyển động.","level": "NB","options": ["A. Thế năng","B. Động năng","C. Hóa năng","D. Quang năng"],"points": 0.25,"q": "Năng lượng của các phân tử đang chuyển động nhiệt là","type": "mcq"},{"answer": "C","explain": "Phức hợp enzyme–cơ chất (E–S) là trung gian.","level": "NB","options": ["A. Phức hợp enzyme–sản phẩm","B. Phức hợp cơ chất–năng lượng","C. Phức hợp enzyme–cơ chất","D. Phức hợp ATP–ADP"],"points": 0.25,"q": "Enzyme liên kết tạm thời với cơ chất tạo thành","type": "mcq"},{"answer": "A","explain": "ATP → ADP + Pi + năng lượng cho hoạt động sống.","level": "TH","options": ["A. ATP → ADP + Pi + năng lượng","B. ADP → ATP + năng lượng","C. ATP → AMP + năng lượng","D. ADP + Pi → cơ chất"],"points": 0.25,"q": "Khi cung cấp năng lượng cho tế bào, ATP biến đổi thành","type": "mcq"},{"answer": "D","explain": "Tính đặc hiệu: mỗi enzyme chỉ xúc tác phản ứng nhất định.","level": "VD","options": ["A. Tính đa năng","B. Tính phổ biến","C. Tính bền nhiệt","D. Tính đặc hiệu"],"points": 0.25,"q": "Amylase chỉ phân giải tinh bột mà không phân giải protein thể hiện","type": "mcq"},{"answer": "B","explain": "Sữa chua: vi khuẩn lactic lên men đường → acid lactic (enzyme xúc tác).","level": "VD","options": ["A. Quang hợp","B. Enzyme của vi khuẩn lactic lên men đường","C. Hô hấp của nấm men","D. Enzyme amylase"],"points": 0.25,"q": "Quá trình làm sữa chua ứng dụng hoạt động của","type": "mcq"},{"answer": "A","explain": "Ức chế cạnh tranh: chất ức chế chiếm trung tâm hoạt động → thêm cơ chất (tăng cạnh tranh) có thể khắc phục.","level": "VDC","options": ["A. Tăng nồng độ cơ chất","B. Giảm nhiệt độ","C. Tăng pH","D. Loại bỏ enzyme"],"points": 0.25,"q": "Khi enzyme bị chất ức chế cạnh tranh chiếm trung tâm hoạt động, biện pháp nào có thể khôi phục hoạt tính?","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: enzyme không bị biến đổi. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về cơ chế enzyme:","statements": ["a) Cơ chất liên kết vào trung tâm hoạt động.","b) Enzyme bị phân hủy sau phản ứng."," ương là do","type": "mcq"},{"answer": "B","explain": "Sốt cao làm enzyme biến tính → rối loạn chuyển hóa.","level": "VDC","options": ["A. Miễn dịch tăng","B. Enzyme biến tính, rối loạn chuyển hóa","C. Không sao","D. Phản ứng nhanh hơn"],"points": 0.25,"q": "Sốt cao kéo dài nguy hiểm vì","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: pH tối ưu khác nhau. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nhiệt độ, pH và nồng độ:","statements": ["a) Nhiệt độ cao làm enzyme mất hoạt tính.","b) Pepsin hoạt động tốt ở pH acid.","c) Mọi enzyme có cùng pH tối ưu.","d) Nồng độ enzyme ảnh hưởng tốc độ phản ứng."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: enzyme là xúc tác. b) Đúng. c) Đúng. d) Sai: đồng hóa tích lũy.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về vai trò của enzyme trong chuyển hóa:","statements": ["a) Enzyme cung cấp năng lượng cho phản ứng.","b) Dị hóa giải phóng năng lượng.","c) Năng lượng dị hóa dùng cho đồng hóa.","d) Đồng hóa giải phóng năng lượng."],"type": "truefalse"},{"answer": "Cơ chất","explain": "Cơ chất là chất chịu tác động của enzyme.","level": "NB","points": 0.5,"q": "Chất chịu sự tác động của enzyme gọi là gì?","type": "short"},{"answer": "Đặc hiệu","explain": "Mỗi enzyme chỉ xúc tác phản ứng nhất định: tính đặc hiệu.","level": "TH","points": 0.5,"q": "Mỗi enzyme chỉ xúc tác một số phản ứng nhất định thể hiện tính gì?","type": "short"}]},{"name": "Đề 8","questions": [{"answer": "A","explain": "Đồng hóa: tổng hợp, tích lũy năng lượng.","level": "NB","options": ["A. Tổng hợp chất phức tạp, tích lũy năng lượng","B. Phân giải chất phức tạp","C. Giải phóng năng lượng","D. Không liên quan năng lượng"],"points": 0.25,"q": "Đồng hóa là quá trình","type": "mcq"},{"answer": "B","explain": "Dị hóa: phân giải, giải phóng năng lượng.","level": "NB","options": ["A. Tổng hợp chất phức tạp","B. Phân giải chất phức tạp, giải phóng năng lượng","C. Tích lũy năng lượng","D. Tổng hợp ATP trực tiếp"],"points": 0.25,"q": "Dị hóa là quá trình","type": "mcq"},{"answer": "C","explain": "Enzyme giảm năng lượng hoạt hóa.","level": "TH","options": ["A. Tăng năng lượng hoạt hóa","B. Cung cấp năng lượng","C. Giảm năng lượng hoạt hóa","D. Đổi sản phẩm"],"points": 0.25,"q": "Enzyme tăng tốc phản ứng bằng cách","type": "mcq"},{"answer": "D","explain": "Mỗi enzyme có tính đặc hiệu riêng.","level": "VD","options": ["A. Đa năng","B. Phổ biến","C. Bền nhiệt","D. Đặc hiệu"],"points": 0.25,"q": "Protease chỉ phân giải protein thể hiện tính","type": "mcq"},{"answer": "B","explain": "Sữa chua nhờ vi khuẩn lactic lên men.","level": "VD","options": ["A. Quang hợp","B. Lên men lactic của vi khuẩn","C. Hô hấp nấm men","D. Amylase"],"points": 0.25,"q": "Làm sữa chua ứng dụng","type": "mcq"},{"answer": "B","explain": "pH tối ưu khác nhau phù hợp môi trường hoạt động.","level": "VDC","options": ["A. Cùng pH tối ưu","B. pH tối ưu khác nhau","C. Cùng một phản ứng","D. Không đặc hiệu"],"points": 0.25,"q": "Pepsin và trypsin đều phân giải protein nhưng khác nhau ở","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: không bị biến đổi. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về bản chất và cơ chế của enzyme:","statements": ["a) Enzyme là chất xúc tác sinh học.","b) Enzyme liên kết cơ chất tại trung tâm hoạt động.","c) Enzyme bị biến đổi sau phản ứng.","d) Enzyme được tái sử dụng."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: glucose không phải. c) Đúng. d) Sai: đồng hóa tích lũy.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về ATP và đồng hóa:","statements": ["a) ATP là đồng tiền năng lượng.","b) Glucose là đồng tiền năng lượng.","c) Đồng hóa và dị hóa liên quan nhau.","d) Đồng hóa giải phóng năng lượng."],"type": "truefalse"},{"answer": "Quang hợp","explain": "Quang hợp là quá trình đồng hóa ở thực vật.","level": "NB","points": 0.5,"q": "Quá trình tổng hợp chất hữu cơ ở thực vật nhờ ánh sáng là gì?","type": "short"},{"answer": "Hô hấp","explain": "Hô hấp là quá trình dị hóa phân giải glucose.","level": "TH","points": 0.5,"q": "Quá trình phân giải glucose tạo ATP ở tế bào là gì?","type": "short"}]},{"name": "Đề 9","questions": [{"answer": "D","explain": "ATP từ ADP + Pi nhờ hô hấp/quang hợp.","level": "NB","options": ["A. Từ glucose","B. Từ DNA","C. Từ protein","D. Từ ADP + Pi nhờ hô hấp/quang hợp"],"points": 0.25,"q": "ATP được tái tạo từ","type": "mcq"},{"answer": "A","explain": "Một số ít enzyme có bản chất là ARN được gọi là ribozyme.","level": "NB","options": ["A. Ribozyme","B. Amylase","C. Catalase","D. Pepsin"],"points": 0.25,"q": "Tên gọi của loại enzyme có bản chất là ARN là","type": "mcq"},{"answer": "A","explain": "ATP → ADP + Pi + năng lượng.","level": "TH","options": ["A. ATP thành ADP + Pi + năng lượng","B. ADP thành ATP","C. ATP thành AMP","D. ADP + Pi thành cơ chất"],"points": 0.25,"q": "ATP cung cấp năng lượng bằng cách biến thành","type": "mcq"},{"answer": "C","explain": "Bột giặt sinh học chứa enzyme phân giải vết bẩn.","level": "VD","options": ["A. Chất tẩy","B. Nước hoa","C. Enzyme","D. Chất làm mềm"],"points": 0.25,"q": "Thành phần quan trọng của bột giặt sinh học là","type": "mcq"},{"answer": "A","explain": "Nhai cơm: amylase → đường.","level": "VD","options": ["A. Amylase phân giải tinh bột thành đường","B. Cơm bị chua","C. Cơm bị đắng","D. Enzyme biến tính"],"points": 0.25,"q": "Nhai cơm lâu thấy ngọt vì","type": "mcq"},{"answer": "C","explain": "Khoai sống có catalase; khoai chín enzyme biến tính.","level": "VDC","options": ["A. Cả hai sủi bọt","B. Cả hai không sủi","C. Sống sủi bọt, chín không","D. Chín sủi bọt, sống không"],"points": 0.25,"q": "Nhỏ H2O2 vào khoai sống và khoai chín thì","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: không bị phân hủy. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về cơ chế tác động của enzyme:","statements": ["a) Cơ chất gắn vào trung tâm hoạt động.","b) Enzyme bị phân hủy sau phản ứng.","c) Sản phẩm tách ra, enzyme phục hồi.","d) Enzyme chỉ xúc tác phản ứng nhất định."],"type": "truefalse"},{"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng. c) Sai: 30–40°C. d) Sai: tái sử dụng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nhiệt độ tối ưu của enzyme:","statements": ["a) Nhiệt độ tối ưu của enzyme khoảng 30–40°C.","b) pH ảnh hưởng hoạt tính enzyme.","c) Enzyme hoạt động tốt ở 100°C.","d) Mỗi enzyme chỉ xúc tác một lần."],"type": "truefalse"},{"answer": "ADP","explain": "ATP → ADP khi cung cấp năng lượng.","level": "NB","points": 0.5,"q": "ATP sau khi cho năng lượng biến thành gì?","type": "short"},{"answer": "Chìa khóa – ổ khóa","explain": "Thuyết chìa khóa – ổ khóa giải thích tính đặc hiệu.","level": "TH","points": 0.5,"q": "Thuyết giải thích tính đặc hiệu của enzyme có tên là gì?","type": "short"}]},{"name": "Đề 10","questions": [{"answer": "B","explain": "Động năng: vật chuyển động.","level": "NB","options": ["A. Thế năng","B. Động năng","C. Hóa năng","D. Quang năng"],"points": 0.25,"q": "Năng lượng của phân tử đang chuyển động là","type": "mcq"},{"answer": "C","explain": "E + S → phức hợp E–S.","level": "NB","options": ["A. E + P","B. S + năng lượng","C. Phức hợp enzyme–cơ chất","D. ATP–ADP"],"points": 0.25,"q": "Enzyme và cơ chất tạo thành","type": "mcq"},{"answer": "B","explain": "Ức chế giảm, hoạt hóa tăng hoạt tính.","level": "TH","options": ["A. Đều tăng","B. Ức chế giảm, hoạt hóa tăng","C. Đều giảm","D. Không ảnh hưởng"],"points": 0.25,"q": "Chất ức chế và chất hoạt hóa","type": "mcq"},{"answer": "D","explain": "Tăng enzyme → tăng tốc độ.","level": "VD","options": ["A. Giảm","B. Không đổi","C. Giảm rồi tăng","D. Tăng"],"points": 0.25,"q": "Tăng nồng độ enzyme thì tốc độ phản ứng","type": "mcq"},{"answer": "B","explain": "Tăng cơ chất
