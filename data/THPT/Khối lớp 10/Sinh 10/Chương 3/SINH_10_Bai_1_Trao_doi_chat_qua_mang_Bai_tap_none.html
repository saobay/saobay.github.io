<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1","questions": [{"answer": "B","explain": "Màng tế bào có tính thấm chọn lọc: chỉ cho một số chất nhất định đi qua.","level": "NB","options": ["A. Cho mọi chất đi qua tự do","B. Chỉ cho một số chất nhất định đi qua","C. Không cho chất nào đi qua","D. Chỉ cho nước đi qua"],"points": 0.25,"q": "Màng tế bào có đặc tính","type": "mcq"},{"answer": "C","explain": "Vận chuyển thụ động: theo chiều gradient nồng độ, không tốn năng lượng.","level": "NB","options": ["A. Ngược chiều gradient nồng độ","B. Tiêu tốn nhiều ATP","C. Theo chiều gradient nồng độ, không tốn năng lượng","D. Chỉ xảy ra với protein"],"points": 0.25,"q": "Vận chuyển thụ động có đặc điểm","type": "mcq"},{"answer": "B","explain": "O2, CO2 (nhỏ, không phân cực) khuếch tán đơn giản qua lớp phospholipid kép.","level": "TH","options": ["A. Qua protein kênh","B. Qua lớp phospholipid kép","C. Qua bơm protein","D. Nhờ biến dạng màng"],"points": 0.25,"q": "Oxygen và carbon dioxide đi qua màng tế bào bằng cách","type": "mcq"},{"answer": "C","explain": "Nước di chuyển từ nơi nồng độ chất tan thấp đến nơi cao (nhược trương → ưu trương).","level": "VD","options": ["A. Từ nơi nồng độ chất tan cao đến nơi thấp","B. Từ môi trường ưu trương vào tế bào","C. Từ nơi nồng độ chất tan thấp đến nơi nồng độ chất tan cao","D. Chỉ từ trong tế bào ra ngoài"],"points": 0.25,"q": "Trong quá trình thẩm thấu, nước di chuyển theo chiều","type": "mcq"},{"answer": "B","explain": "Môi trường ưu trương làm nước đi ra khỏi tế bào → co nguyên sinh.","level": "VD","options": ["A. Nhược trương","B. Ưu trương","C. Đẳng trương","D. Trung tính"],"points": 0.25,"q": "Đặt tế bào biểu bì vảy hành vào dung dịch muối đậm đặc sẽ xảy ra hiện tượng co nguyên sinh vì môi trường này là","type": "mcq"},{"answer": "D","explain": "Bạch cầu thực bào vi khuẩn là nhập bào (thực bào) — tốn ATP, nhờ biến dạng màng.","level": "VDC","options": ["A. Khuếch tán đơn giản","B. Vận chuyển chủ động","C. Thẩm thấu","D. Thực bào"],"points": 0.25,"q": "Bạch cầu bắt và tiêu diệt vi khuẩn bằng hình thức","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: thụ động không tốn năng lượng. d) Đúng: chủ động ngược gradient.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về vận chuyển qua màng:","statements": ["a) Vận chuyển thụ động diễn ra theo chiều gradient nồng độ.","b) Khuếch tán đơn giản không cần protein màng hỗ trợ.","c) Vận chuyển thụ động tiêu tốn năng lượng ATP.","d) Vận chuyển chủ động diễn ra ngược chiều gradient nồng độ."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: tế bào động vật sẽ vỡ. c) Đúng. d) Sai: nhập bào tốn năng lượng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về hồng cầu trong các môi trường:","statements": ["a) Tế bào thực vật trong môi trường nhược trương sẽ trương nước.","b) Tế bào hồng cầu trong môi trường nhược trương sẽ teo lại.","c) Dung dịch muối sinh lí 0,9% là môi trường đẳng trương với hồng cầu.","d) Nhập bào là hình thức vận chuyển không tốn năng lượng."],"type": "truefalse"},{"answer": "Thẩm thấu","explain": "Thẩm thấu là sự khuếch tán của nước qua màng tế bào.","level": "NB","points": 0.5,"q": "Sự khuếch tán của các phân tử nước qua màng tế bào được gọi là gì?","type": "short"},{"answer": "Aquaporin","explain": "Nước qua màng chủ yếu qua kênh protein aquaporin.","level": "TH","points": 0.5,"q": "Kênh protein trên màng tế bào chuyên vận chuyển nước có tên là gì?","type": "short"}]},{"name": "Đề 2","questions": [{"answer": "C","explain": "Vận chuyển chủ động: ngược gradient, tốn ATP, qua bơm protein.","level": "NB","options": ["A. Theo chiều gradient, không tốn năng lượng","B. Không cần protein màng","C. Ngược chiều gradient, tốn năng lượng ATP","D. Chỉ vận chuyển nước"],"points": 0.25,"q": "Vận chuyển chủ động có đặc điểm","type": "mcq"},{"answer": "B","explain": "Nhập bào: màng biến dạng bọc lấy vật tạo bóng đưa vào trong; xuất bào: đưa chất ra ngoài.","level": "NB","options": ["A. Khuếch tán và thẩm thấu","B. Nhập bào và xuất bào","C. Thực bào và ẩm bào","D. Chủ động và thụ động"],"points": 0.25,"q": "Vận chuyển vật chất nhờ biến dạng màng gồm","type": "mcq"},{"answer": "D","explain": "Ion không qua được lớp lipid nên cần protein kênh hoặc protein mang.","level": "TH","options": ["A. Khuếch tán đơn giản qua lipid","B. Thẩm thấu","C. Biến dạng màng","D. Khuếch tán tăng cường qua protein kênh hoặc protein mang"],"points": 0.25,"q": "Các ion như Na+, K+ đi qua màng tế bào bằng cách","type": "mcq"},{"answer": "B","explain": "Ưu trương: chất tan ngoài cao hơn → nước từ tế bào ra ngoài → co nguyên sinh.","level": "VD","options": ["A. Nước đi vào tế bào làm tế bào trương lên","B. Nước đi ra khỏi tế bào làm tế bào chất co lại","C. Không có sự di chuyển của nước","D. Tế bào vỡ ra"],"points": 0.25,"q": "Khi đặt tế bào thực vật vào môi trường ưu trương, điều gì xảy ra?","type": "mcq"},{"answer": "C","explain": "Muối tạo môi trường ưu trương, nước trong rau thẩm thấu ra ngoài.","level": "VD","options": ["A. Muối diệt vi khuẩn bằng kháng sinh","B. Muối làm tăng nhiệt độ","C. Muối tạo môi trường ưu trương làm nước trong rau thoát ra","D. Muối cung cấp chất dinh dưỡng"],"points": 0.25,"q": "Vì sao khi muối dưa, rau trở nên héo và giòn?","type": "mcq"},{"answer": "A","explain": "Nhược trương: nước ồ ạt vào tế bào động vật (không có thành) → vỡ.","level": "VDC","options": ["A. Nước ồ ạt đi vào làm tế bào vỡ","B. Nước đi ra làm tế bào teo","C. Không có gì xảy ra","D. Tế bào co nguyên sinh"],"points": 0.25,"q": "Đặt tế bào hồng cầu vào nước cất (môi trường nhược trương), hiện tượng xảy ra là","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: protein mang thay đổi cấu hình. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về protein màng:","statements": ["a) Protein kênh tạo lỗ cho các chất có kích thước phù hợp đi qua.","b) Protein kênh phải thay đổi cấu hình khi vận chuyển.","c) Tế bào điều chỉnh đóng, mở kênh để kiểm soát chất ra vào.","d) Protein mang vận chuyển glucose qua màng."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: ẩm bào lấy giọt dịch chứa chất tan. d) Đúng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về thực bào và xuất bào:","statements": ["a) Thực bào là hình thức nhập bào lấy các chất rắn kích thước lớn.","b) Bạch cầu thực bào vi khuẩn để bảo vệ cơ thể.","c) Ẩm bào là hình thức lấy các chất rắn.","d) Xuất bào đưa sản phẩm tiết và chất thải ra ngoài."],"type": "truefalse"},{"answer": "Ưu trương","explain": "Môi trường có nồng độ chất tan cao hơn trong tế bào là ưu trương.","level": "NB","points": 0.5,"q": "Môi trường có nồng độ chất tan cao hơn nồng độ chất tan trong tế bào được gọi là môi trường gì?","type": "short"},{"answer": "Co nguyên sinh","explain": "Ưu trương làm nước ra khỏi tế bào thực vật → co nguyên sinh.","level": "TH","points": 0.5,"q": "Hiện tượng tế bào chất co lại, màng tách khỏi thành tế bào khi đặt trong môi trường ưu trương gọi là gì?","type": "short"}]},{"name": "Đề 3","questions": [{"answer": "B","explain": "Thực bào lấy chất rắn lớn; ẩm bào lấy giọt dịch.","level": "NB","options": ["A. Thực bào lấy chất lỏng, ẩm bào lấy chất rắn","B. Thực bào lấy chất rắn, ẩm bào lấy giọt dịch","C. Cả hai đều lấy chất rắn","D. Cả hai đều không tốn năng lượng"],"points": 0.25,"q": "Phân biệt thực bào và ẩm bào","type": "mcq"},{"answer": "D","explain": "Xuất bào: bóng chứa chất liên kết với màng, giải phóng chất ra ngoài.","level": "NB","options": ["A. Đưa chất rắn vào tế bào","B. Lấy giọt dịch vào tế bào","C. Vận chuyển ion qua kênh","D. Đưa chất có kích thước lớn ra khỏi tế bào"],"points": 0.25,"q": "Xuất bào là hình thức","type": "mcq"},{"answer": "C","explain": "Bơm Na+/K+ đưa K+ vào, đẩy Na+ ra — ngược gradient, tốn ATP.","level": "TH","options": ["A. Khuếch tán đơn giản","B. Thẩm thấu","C. Vận chuyển chủ động qua bơm protein","D. Nhập bào"],"points": 0.25,"q": "Bơm Na+/K+ vận chuyển các ion bằng hình thức","type": "mcq"},{"answer": "A","explain": "Nhược trương (nước cất): nước đi vào → phản co nguyên sinh (trương trở lại).","level": "VD","options": ["A. Nước đi vào tế bào làm tế bào trương trở lại","B. Nước đi ra làm tế bào co thêm","C. Tế bào vỡ ra","D. Không có gì xảy ra"],"points": 0.25,"q": "Sau khi co nguyên sinh, nhỏ nước cất lên tiêu bản tế bào hành sẽ thấy","type": "mcq"},{"answer": "D","explain": "Tế bào thận tái hấp thu glucose ngược gradient, tốn tới 90% năng lượng.","level": "VD","options": ["A. Khuếch tán đơn giản","B. Thẩm thấu","C. Thực bào","D. Vận chuyển chủ động"],"points": 0.25,"q": "Tế bào thận tái hấp thu glucose từ nước tiểu về máu bằng hình thức","type": "mcq"},{"answer": "B","explain": "Nồng độ trong = ngoài → đẳng trương → hồng cầu giữ nguyên hình dạng.","level": "VDC","options": ["A. Hồng cầu vỡ","B. Hồng cầu giữ nguyên hình dạng","C. Hồng cầu teo lại","D. Hồng cầu co nguyên sinh"],"points": 0.25,"q": "Nhỏ một giọt máu vào dung dịch NaCl 0,9%. Hiện tượng xảy ra với hồng cầu là","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: thẩm thấu là sự khuếch tán của nước. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về thẩm thấu:","statements": ["a) Thẩm thấu là sự khuếch tán của nước qua màng.","b) Tốc độ thẩm thấu phụ thuộc áp suất thẩm thấu.","c) Thẩm thấu là sự khuếch tán của chất tan qua màng.","d) Áp suất thẩm thấu phụ thuộc nồng độ chất tan."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: thụ động không tốn ATP. b) Đúng. c) Đúng. d) Sai: xuất bào tốn năng lượng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về năng lượng trong vận chuyển:","statements": ["a) Mọi hình thức vận chuyển qua màng đều tốn ATP.","b) Chất tan trong lipid đi qua màng bằng khuếch tán đơn giản.","c) Protein mang thay đổi cấu hình khi vận chuyển chất.","d) Xuất bào là hình thức không tốn năng lượng."],"type": "truefalse"},{"answer": "Nhược trương","explain": "Môi trường có nồng độ chất tan thấp hơn trong tế bào là nhược trương.","level": "NB","points": 0.5,"q": "Môi trường có nồng độ chất tan thấp hơn trong tế bào gọi là môi trường gì?","type": "short"},{"answer": "Phản co nguyên sinh","explain": "Nhược trương làm nước đi vào, tế bào trương trở lại: phản co nguyên sinh.","level": "TH","points": 0.5,"q": "Hiện tượng tế bào trương trở lại khi chuyển từ môi trường ưu trương sang nhược trương gọi là gì?","type": "short"}]},{"name": "Đề 4","questions": [{"answer": "C","explain": "Khuếch tán tăng cường cần protein màng (kênh hoặc mang).","level": "NB","options": ["A. Khuếch tán đơn giản","B. Thẩm thấu","C. Khuếch tán tăng cường","D. Xuất bào"],"points": 0.25,"q": "Hình thức vận chuyển cần protein màng hỗ trợ nhưng không tốn năng lượng là","type": "mcq"},{"answer": "A","explain": "Đẳng trương: nồng độ trong = ngoài, nước cân bằng.","level": "NB","options": ["A. Nồng độ chất tan trong và ngoài tế bào bằng nhau","B. Nồng độ chất tan ngoài cao hơn","C. Nồng độ chất tan ngoài thấp hơn","D. Không có chất tan"],"points": 0.25,"q": "Môi trường đẳng trương là môi trường","type": "mcq"},{"answer": "B","explain": "Glucose phân cực, cần protein mang để qua màng.","level": "TH","options": ["A. Khuếch tán đơn giản","B. Khuếch tán tăng cường qua protein mang","C. Thẩm thấu","D. Thực bào"],"points": 0.25,"q": "Glucose đi vào tế bào bằng cách","type": "mcq"},{"answer": "D","explain": "Chất kích thước lớn (protein, polysaccharide) cần biến dạng màng.","level": "VD","options": ["A. Khuếch tán đơn giản","B. Vận chuyển chủ động","C. Thẩm thấu","D. Nhập bào nhờ biến dạng màng"],"points": 0.25,"q": "Protein có kích thước lớn được đưa vào tế bào bằng cách","type": "mcq"},{"answer": "C","explain": "Nước chạy theo chất tan: từ nơi chất tan thấp đến nơi cao.","level": "VD","options": ["A. Từ nơi chất tan cao đến nơi thấp","B. Từ tế bào ra ngoài trong mọi trường hợp","C. Từ ) Sai: ẩm bào lấy giọt dịch. c) Đúng. d) Sai: xuất bào tốn năng lượng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về biến dạng màng:","statements": ["a) Thực bào lấy các vật rắn kích thước lớn.","b) Ẩm bào lấy các vật rắn kích thước lớn.","c) Nhập bào tạo bóng nhập bào đưa vào trong.","d) Xuất bào không tốn năng lượng."],"type": "truefalse"},{"answer": "Thực bào","explain": "Bạch cầu thực bào vi khuẩn.","level": "NB","points": 0.5,"q": "Hình thức nhập bào lấy các chất rắn có kích thước lớn gọi là gì?","type": "short"},{"answer": "Ẩm bào","explain": "Ẩm bào lấy giọt dịch chứa chất tan.","level": "TH","points": 0.5,"q": "Hình thức nhập bào lấy các giọt dịch chứa chất tan gọi là gì?","type": "short"}]},{"name": "Đề 6","questions": [{"answer": "C","explain": "Thẩm thấu: nước qua màng, phụ thuộc áp suất thẩm thấu.","level": "NB","options": ["A. Khuếch tán chất tan","B. Vận chuyển ion","C. Sự khuếch tán của nước qua màng","D. Nhập bào"],"points": 0.25,"q": "Thẩm thấu là","type": "mcq"},{"answer": "A","explain": "Xuất bào đưa chất ra ngoài: sản phẩm tiết, chất thải.","level": "NB","options": ["A. Đưa chất ra khỏi tế bào","B. Lấy chất rắn vào","C. Vận chuyển ion","D. Khuếch tán nước"],"points": 0.25,"q": "Chức năng của xuất bào là","type": "mcq"},{"answer": "D","explain": "Protein mang gắn chất, thay đổi cấu hình để đưa qua màng.","level": "TH","options": ["A. Tạo lỗ cố định","B. Bơm ngược gradient","C. Biến dạng màng","D. Gắn chất và thay đổi cấu hình để đưa qua màng"],"points": 0.25,"q": "Cơ chế hoạt động của protein mang là","type": "mcq"},{"answer": "B","explain": "Tế bào động vật nhược trương → nước vào → vỡ.","level": "VD","options": ["A. Co nguyên sinh","B. Trương và vỡ","C. Teo lại","D. Bình thường"],"points": 0.25,"q": "Hồng cầu đặt trong nước cất sẽ","type": "mcq"},{"answer": "C","explain": "Ưu trương: nước ra khỏi tế bào.","level": "VD","options": ["A. Nhược trương","B. Đẳng trương","C. Ưu trương","D. Trung tính"],"points": 0.25,"q": "Môi trường làm nước đi ra khỏi tế bào là","type": "mcq"},{"answer": "D","explain": "Thực bào tốn ATP; khuếch tán, thẩm thấu, kênh ion đều thụ động.","level": "VDC","options": ["A. O2 qua màng","B. Nước qua aquaporin","C. K+ qua kênh","D. Bạch cầu bắt vi khuẩn"],"points": 0.25,"q": "Quá trình nào cần năng lượng ATP?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: ngược gradient, tốn ATP. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về vận chuyển chủ động:","statements": ["a) Vận chuyển chủ động diễn ra ngược chiều gradient nồng độ.","b) Vận chuyển chủ động tiêu tốn ATP.","c) Vận chuyển chủ động không cần protein màng.","d) Bơm Na+/K+ là ví dụ về vận chuyển chủ động."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: ẩm bào lấy giọt dịch. c) Đúng. d) Sai: xuất bào tốn ATP.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về thực bào của bạch cầu:","statements": ["a) Nhập bào vận chuyển chất kích thước lớn.","b) Ẩm bào lấy các vật rắn lớn.","c) Thực bào giúp bạch cầu tiêu diệt vi khuẩn.","d) Xuất bào không tiêu tốn năng lượng."],"type": "truefalse"},{"answer": "Xuất bào","explain": "Xuất bào đưa sản phẩm tiết, chất thải ra ngoài.","level": "NB","points": 0.5,"q": "Hình thức đưa các chất có kích thước lớn ra khỏi tế bào gọi là gì?","type": "short"},{"answer": "Nhập bào","explain": "Nhập bào đưa chất kích thước lớn vào trong nhờ biến dạng màng.","level": "TH","points": 0.5,"q": "Hình thức đưa các chất kích thước lớn vào trong tế bào nhờ biến dạng màng gọi là gì?","type": "short"}]},{"name": "Đề 7","questions": [{"answer": "B","explain": "Khuếch tán đơn giản: qua lớp lipid, không cần protein.","level": "NB","options": ["A. Cần protein kênh","B. Không cần protein, qua lớp lipid","C. Tốn ATP","D. Cần biến dạng màng"],"points": 0.25,"q": "Khuếch tán đơn giản","type": "mcq"},{"answer": "D","explain": "Khuếch tán tăng cường: qua protein kênh/mang, không tốn ATP.","level": "NB","options": ["A. Tốn ATP","B. Qua lớp lipid","C. Ngược gradient","D. Qua protein kênh hoặc protein mang, không tốn ATP"],"points": 0.25,"q": "Khuếch tán tăng cường","type": "mcq"},{"answer": "A","explain": "Ion phân cực không qua được lipid nên cần protein.","level": "TH","options": ["A. Vì ion phân cực không qua được lớp lipid","B. Vì ion quá nhỏ","C. Vì ion không cần năng lượng","D. Vì màng không có lipid"],"points": 0.25,"q": "Vì sao ion cần protein màng để đi qua?","type": "mcq"},{"answer": "C","explain": "Nước cất là nhược trương → nước vào → phản co nguyên sinh.","level": "VD","options": ["A. Co nguyên sinh","B. Tế bào vỡ","C. Phản co nguyên sinh","D. Không đổi"],"points": 0.25,"q": "Nhỏ nước cất lên tế bào hành đang co nguyên sinh sẽ thấy","type": "mcq"},{"answer": "A","explain": "Muối ưu trương → nước trong rau ra ngoài.","level": "VD","options": ["A. Nước trong rau thẩm thấu ra ngoài","B. Muối thấm vào làm rau giòn","C. Vi khuẩn bị diệt","D. Rau quang hợp mạnh"],"points": 0.25,"q": "Khi muối dưa, hiện tượng xảy ra ở tế bào rau là","type": "mcq"},{"answer": "B","explain": "Nồng độ trong = ngoài → đẳng trương.","level": "VDC","options": ["A. Hồng cầu vỡ","B. Hồng cầu bình thường","C. Hồng cầu teo","D. Hồng cầu co nguyên sinh"],"points": 0.25,"q": "Hồng cầu trong dung dịch NaCl 0,9% sẽ","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: qua aquaporin. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nước qua màng:","statements": ["a) Nước qua màng bằng thẩm thấu.","b) Nước qua màng bằng khuếch tán đơn giản qua lipid.","c) Kênh aquaporin chuyên vận chuyển nước.","d) Nước di chuyển từ nơi chất tan thấp đến nơi cao."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: thụ động không tốn. b) Đúng. c) Đúng. d) Sai: xuất bào tốn ATP.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về năng lượng ATP trong vận chuyển:","statements": ["a) Mọi vận chuyển qua màng đều tốn ATP.","b) Chất tan trong lipid qua màng dễ dàng.","c) Protein mang thay đổi cấu hình khi hoạt động.","d) Nhập bào và xuất bào không tốn năng lượng."],"type": "truefalse"},{"answer": "Khuếch tán đơn giản","explain": "O2 qua lớp lipid bằng khuếch tán đơn giản.","level": "NB","points": 0.5,"q": "O2 đi qua màng tế bào bằng hình thức nào?","type": "short"},{"answer": "Khuếch tán tăng cường","explain": "Glucose qua protein mang bằng khuếch tán tăng cường.","level": "TH","points": 0.5,"q": "Glucose đi qua màng nhờ protein mang bằng hình thức nào?","type": "short"}]},{"name": "Đề 8","questions": [{"answer": "C","explain": "Chủ động: ngược gradient, tốn ATP, qua bơm.","level": "NB","options": ["A. Theo gradient","B. Không tốn ATP","C. Ngược gradient, tốn ATP","D. Qua lipid"],"points": 0.25,"q": "Đặc điểm của vận chuyển chủ động là","type": "mcq"},{"answer": "B","explain": "Thụ động: theo gradient, không tốn ATP.","level": "NB","options": ["A. Ngược gradient","B. Theo gradient, không tốn ATP","C. Tốn ATP","D. Cần biến dạng màng"],"points": 0.25,"q": "Đặc điểm của vận chuyển thụ động là","type": "mcq"},{"answer": "B","explain": "Bơm Na+/K+: K+ vào, Na+ ra, tốn ATP.","level": "TH","options": ["A. Đưa Na+ vào, K+ ra","B. Đưa K+ vào, đẩy Na+ ra","C. Đưa cả hai vào","D. Đẩy cả hai ra"],"points": 0.25,"q": "Bơm Na+/K+ hoạt động như thế nào?","type": "mcq"},{"answer": "D","explain": "Ưu trương → nước ra → co nguyên sinh.","level": "VD","options": ["A. Trương nước","B. Vỡ","C. Phân chia","D. Co nguyên sinh"],"points": 0.25,"q": "Tế bào thực vật trong dung dịch đường đậm đặc sẽ","type": "mcq"},{"answer": "A","explain": "Động vật không thành → nhược trương gây vỡ.","level": "VD","options": ["A. Vỡ do nước ồ ạt đi vào","B. Co nguyên sinh","C. Teo lại","D. Bình thường"],"points": 0.25,"q": "Khi đặt tế bào động vật vào môi trường nhược trương, hiện tượng nào xảy ra?","type": "mcq"},{"answer": "C","explain": "Đẳng trương → hồng cầu nguyên vẹn.","level": "VDC","options": ["A. Cung cấp năng lượng","B. Diệt khuẩn","C. Giữ hồng cầu nguyên vẹn","D. Tăng tuần hoàn"],"points": 0.25,"q": "Dịch truyền đẳng trương có ý nghĩa","type": "mcq"},{"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng. c) Sai: chất tan thấp → cao. d) Sai: đẳng trương thì cân bằng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về các môi trường:","statements": ["a) Ưu trương: chất tan ngoài cao hơn trong tế bào.","b) Nhược trương: chất tan ngoài thấp hơn trong tế bào.","c) Nước di chuyển từ nơi chất tan cao đến nơi thấp.","d) Trong môi trường đẳng trương, nước chỉ đi vào tế bào."],"type": "truefalse"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: thực bào lấy chất rắn. c) Đúng. d) Đúng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về thực bào và ẩm bào:","statements": ["a) Thực bào là một dạng nhập bào.","b) Ẩm bào lấy các chất rắn lớn.","c) Xuất bào đưa enzyme ra ngoài.","d) Nhập bào tốn năng lượng ATP."],"type": "truefalse"},{"answer": "Vận chuyển chủ động","explain": "Tế bào thận tái hấp thu glucose bằng vận chuyển chủ động.","level": "NB","points": 0.5,"q": "Tế bào thận tái hấp thu glucose ngược gradient bằng hình thức nào?","type": "short"},{"answer": "Gradient nồng độ","explain": "Vận chuyển thụ động diễn ra theo chiều gradient nồng độ.","level": "TH","points": 0.5,"q": "Vận chuyển thụ động diễn ra theo chiều nào? (Ghi: Gradient nồng độ / Ngược gradient)","type": "short"}]},{"name": "Đề 9","questions": [{"answer": "A","explain": "Màng có tính thấm chọn lọc.","level": "NB","options": ["A. Tính thấm chọn lọc","B. Tính thấm hoàn toàn","C. Không thấm","D. Chỉ thấm nước"],"points": 0.25,"q": "Màng tế bào có","type": "mcq"},{"answer": "D","explain": "Aquaporin là kênh nước.","level": "NB","options": ["A. Kênh Na+","B. Kênh K+","C. Protein mang","D. Kênh nước aquaporin"],"points": 0.25,"q": "Nước qua màng chủ yếu qua","type": "mcq"},{"answer": "C","explain": "Protein kênh tạo lỗ; protein mang thay đổi cấu hình.","level": "TH","options": ["A. Đều tạo lỗ cố định","B. Đều thay đổi cấu hình","C. Kênh tạo lỗ, mang thay đổi cấu hình","D. Đều tốn ATP"],"points": 0.25,"q": "Khác nhau giữa protein kênh và protein mang là","type": "mcq"},{"answer": "B","explain": "Nước cất nhược trương → nước vào → trương trở lại.","level": "VD","options": ["A. Co thêm","B. Trương trở lại","C. Vỡ","D. Không đổi"],"points": 0.25,"q": "Tế bào hành co nguyên sinh được nhỏ nước cất sẽ","type": "mcq"},{"answer": "D","explain": "Muối tạo ưu trương → nước ra.","level": "VD","options": ["A. Nhược trương","B. Đẳng trương","C. Trung tính","D. Ưu trương"],"points": 0.25,"q": "Rắc muối lên rau tạo môi trường","type": "mcq"},{"answer": "A","explain": "Thực bào vi khuẩn tốn ATP.","level": "VDC","options": ["A. Bạch cầu thực bào vi khuẩn","B. O2 khuếch tán","C. Nước thẩm thấu","D. K+ qua kênh"],"points": 0.25,"q": "Quá trình tốn ATP là","type": "mcq"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: nhập bào tốn ATP. c) Đúng. d) Sai: qua aquaporin.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nhập bào và nước qua màng:","statements": ["a) Nhập bào vận chuyển chất kích thước lớn.","b) Nhập bào không tốn năng lượng.","c) Xuất bào đưa chất thải ra ngoài.","d) Nước qua màng bằng khuếch tán qua lipid."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: cần protein. d) Đúng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về O2, ion qua màng:","statements": ["a) O2 qua màng bằng khuếch tán đơn giản.","b) Na+ qua màng nhờ protein kênh.","c) Ion qua được lớp lipid dễ dàng.","d) Chất tan trong lipid qua màng dễ dàng."],"type": "truefalse"},{"answer": "Thụ động","explain": "O2, CO2 qua màng bằng vận chuyển thụ động.","level": "NB","points": 0.5,"q": "O2 và CO2 qua màng bằng hình thức vận chuyển nào? (Ghi: Thụ động / Chủ động)","type": "short"},{"answer": "Chủ động","explain": "Bơm Na+/K+ là vận chuyển chủ động.","level": "TH","points": 0.5,"q": "Bơm Na+/K+ thuộc hình thức vận chuyển nào? (Ghi: Thụ động / Chủ động)","type": "short"}]},{"name": "Đề 10","questions": [{"answer": "B","explain": "Thực bào: chất rắn lớn; ẩm bào: giọt dịch.","level": "NB","options": ["A. Thực bào lấy dịch, ẩm bào lấy rắn","B. Thực bào lấy rắn, ẩm bào lấy dịch","C. Cả hai lấy rắn","D. Cả hai không tốn ATP"],"points": 0.25,"q": "Thực bào và ẩm bào khác nhau ở","type": "mcq"},{"answer": "C","explain": "Xuất bào đưa chất ra ngoài.","level": "NB","options": ["A. Lấy rắn vào","B. Lấy dịch vào","C. Đưa chất ra ngoài","D. Vận chuyển ion"],"points": 0.25,"q": "Xuất bào là","type": "mcq"},{"answer": "A","explain": "Aquaporin chuyên vận chuyển nước.","level": "TH","options": ["A. Qua aquaporin","B. Qua lipid","C. Qua bơm","D. Bằng thực bào"],"points": 0.25,"q": "Nước qua màng chủ yếu","type": "mcq"},{"answer": "C","explain": "Nước từ chất tan thấp đến cao.","level": "VD","options": ["A. Từ cao đến thấp","B. Chỉ ra ngoài","C. Từ nơi chất tan thấp đến nơi cao","D. Chỉ vào trong"],"points": 0.25,"q": "Chiều di chuyển của nước khi thẩm thấu là","type": "mcq"},{"answer": "B","explain": "Nhược trương → vỡ ở tế bào động vật.","level": "VD","options": ["A. Co nguyên sinh","B. Vỡ","C. Teo","D. Bình thường"],"points": 0.25,"q": "Hồng cầu trong nước cất sẽ","type": "mcq"},{"answer": "D","explain": "Thực bào tốn ATP.","level": "VDC","options": ["A. O2 qua màng","B. Nước qua màng","C. K+ qua kênh","D. Bạch cầu bắt vi khuẩn"],"points": 0.25,"q": "Quá trình cần ATP là","type": "mcq"},{"answer": ["F","T","T","T"],"explain": "a) Sai: theo gradient. b) Đúng. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về thực bào, ẩm bào và xuất bào:","statements": ["a) Thụ động diễn ra ngược gradient.","b) Chủ động cần bơm protein.","c) Thẩm thấu là di chuyển của nước.","d) Màng có tính thấm chọn lọc."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: ẩm bào lấy dịch. c) Đúng. d) Sai: xuất bào tốn ATP.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nhập bào, ẩm bào và xuất bào:","statements": ["a) Thực bào lấy vật rắn lớn.","b) Ẩm bào lấy vật rắn lớn.","c) Nhập bào tạo bóng nhập bào.","d) Xuất bào không tốn năng lượng."],"type": "truefalse"},{"answer": "Thực bào","explain": "Bạch cầu bắt vi khuẩn bằng thực bào.","level": "NB","points": 0.5,"q": "Bạch cầu bắt vi khuẩn bằng hình thức nào?","type": "short"},{"answer": "Thẩm thấu","explain": "Nước qua màng là thẩm thấu.","level": "TH","points": 0.5,"q": "Sự di chuyển của nước qua màng gọi là gì?","type": "short"}]}]}
