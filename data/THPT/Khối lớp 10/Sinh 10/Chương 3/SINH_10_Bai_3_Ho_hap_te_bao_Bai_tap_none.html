<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1","questions": [{"answer": "B","explain": "Hô hấp: phân giải glucose thành CO2 + H2O, tạo ATP.","level": "NB","options": ["A. Tổng hợp glucose từ CO2 và nước","B. Phân giải glucose tạo CO2, H2O và ATP","C. Tổng hợp protein","D. Phân giải protein"],"points": 0.25,"q": "Hô hấp tế bào là quá trình","type": "mcq"},{"answer": "C","explain": "Ti thể là nơi hô hấp (đường phân ở tế bào chất).","level": "NB","options": ["A. Lục lạp","B. Nhân","C. Ti thể","D. Lysosome"],"points": 0.25,"q": "Hô hấp tế bào ở tế bào nhân thực diễn ra chủ yếu ở","type": "mcq"},{"answer": "B","explain": "Đường phân: glucose → 2 pyruvate, ở tế bào chất, không cần O2.","level": "TH","options": ["A. Chất nền ti thể, cần O2","B. Tế bào chất, không cần O2","C. Màng trong ti thể, cần O2","D. Lục lạp, cần ánh sáng"],"points": 0.25,"q": "Quá trình đường phân diễn ra ở đâu và có cần O2 không?","type": "mcq"},{"answer": "D","explain": "Chuỗi truyền electron tạo nhiều ATP nhất (~34 ATP).","level": "VD","options": ["A. Đường phân","B. Chu trình Krebs","C. Lên men","D. Chuỗi truyền electron"],"points": 0.25,"q": "Giai đoạn nào của hô hấp tạo ra nhiều ATP nhất?","type": "mcq"},{"answer": "C","explain": "O2 nhận electron cuối cùng tạo H2O; thiếu O2 chuỗi ngừng.","level": "VD","options": ["A. Nhận electron đầu tiên","B. Tạo glucose","C. Nhận electron cuối cùng tạo H2O","D. Phân giải pyruvate"],"points": 0.25,"q": "Vai trò của O2 trong hô hấp tế bào là","type": "mcq"},{"answer": "B","explain": "Thiếu O2 → cơ lên men lactic tạo acid lactic gây mỏi.","level": "VDC","options": ["A. Cơ hô hấp hiếu khí mạnh hơn","B. Cơ chuyển sang lên men lactic tạo acid lactic","C. Cơ ngừng hoạt động","D. Cơ tổng hợp thêm ATP"],"points": 0.25,"q": "Vì sao vận động mạnh kéo dài gây mỏi cơ?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: đường phân không cần O2. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về hô hấp:","statements": ["a) Hô hấp tế bào phân giải glucose tạo ATP.","b) Hô hấp tế bào là quá trình dị hóa.","c) Mọi giai đoạn hô hấp đều cần O2.","d) Ti thể là nơi diễn ra hô hấp ở tế bào nhân thực."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: hiếu khí tạo ~36–38 ATP. c) Đúng. d) Sai: lên men chỉ ở tế bào chất.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về hô hấp hiếu khí và lên men:","statements": ["a) Lên men tạo ít ATP hơn hô hấp hiếu khí.","b) Hô hấp hiếu khí tạo 2 ATP từ 1 glucose.","c) Lên men rượu tạo rượu ethylic và CO2.","d) Lên men diễn ra trong ti thể."],"type": "truefalse"},{"answer": "Pyruvate","explain": "Đường phân biến glucose thành 2 pyruvate.","level": "NB","points": 0.5,"q": "Sản phẩm của quá trình đường phân (từ glucose) là chất nào?","type": "short"},{"answer": "Krebs","explain": "Chu trình Krebs diễn ra ở chất nền ti thể.","level": "TH","points": 0.5,"q": "Chu trình diễn ra ở chất nền ti thể, tạo CO2 và NADH có tên là gì?","type": "short"}]},{"name": "Đề 2","questions": [{"answer": "D","explain": "1 glucose → ~36–38 ATP qua hô hấp hiếu khí.","level": "NB","options": ["A. 2 ATP","B. 4 ATP","C. 20 ATP","D. 36–38 ATP"],"points": 0.25,"q": "Một phân tử glucose qua hô hấp hiếu khí tạo khoảng bao nhiêu ATP?","type": "mcq"},{"answer": "A","explain": "Lên men chỉ tạo 2 ATP (từ đường phân).","level": "NB","options": ["A. 2 ATP","B. 36 ATP","C. 38 ATP","D. 10 ATP"],"points": 0.25,"q": "Lên men từ 1 glucose tạo bao nhiêu ATP?","type": "mcq"},{"answer": "C","explain": "Chu trình Krebs ở chất nền (matrix) ti thể.","level": "TH","options": ["A. Tế bào chất","B. Màng trong ti thể","C. Chất nền ti thể","D. Màng ngoài ti thể"],"points": 0.25,"q": "Chu trình Krebs diễn ra ở","type": "mcq"},{"answer": "B","explain": "Nấm men lên men rượu: glucose → rượu ethylic + CO2 (bánh nở).","level": "VD","options": ["A. Lên men lactic","B. Lên men rượu","C. Hô hấp hiếu khí","D. Quang hợp"],"points": 0.25,"q": "Bánh mì nở xốp nhờ quá trình nào của nấm men?","type": "mcq"},{"answer": "D","explain": "Vi khuẩn lactic lên men tạo acid lactic (sữa chua).","level": "VD","options": ["A. Nấm men","B. Vi khuẩn E. coli","C. Tảo","D. Vi khuẩn lactic"],"points": 0.25,"q": "Sữa chua được tạo ra nhờ hoạt động của","type": "mcq"},{"answer": "C","explain": "Ngập úng thiếu O2 → hạt chỉ lên men, ít ATP → sinh trưởng kém.","level": "VDC","options": ["A. Hạt hô hấp hiếu khí mạnh","B. Hạt quang hợp","C. Hạt thiếu O2 chỉ lên men tạo ít ATP","D. Hạt bị úng nước"],"points": 0.25,"q": "Vì sao hạt nảy mầm kém khi bị ngập úng?","type": "mcq"},{"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tạo H2O.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về chuỗi truyền electron:","statements": ["a) Diễn ra trên màng trong ti thể.","b) Tạo nhiều ATP nhất trong hô hấp.","c) Cần O2 để hoạt động.","d) O2 kết hợp tạo CO2 ở giai đoạn này."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: đường phân không cần O2. b) Đúng. c) Đúng. d) Sai: acid lactic.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về pyruvate và acid lactic:","statements": ["a) Đường phân cần O2.","b) Pyruvate từ đường phân đi vào ti thể.","c) Tế bào cơ thiếu O2 lên men tạo acid lactic.","d) Lên men lactic tạo rượu ethylic."],"type": "truefalse"},{"answer": "CO2","explain": "Chu trình Krebs thải CO2.","level": "NB","points": 0.5,"q": "Khí được thải ra trong chu trình Krebs là gì?","type": "short"},{"answer": "NADH","explain": "NADH mang điện tử đến chuỗi truyền electron.","level": "TH","points": 0.5,"q": "Chất mang điện tử từ chu trình Krebs đến chuỗi truyền electron là gì?","type": "short"}]},{"name": "Đề 3","questions": [{"answer": "B","explain": "Đường phân: glucose (6C) → 2 pyruvate (3C).","level": "NB","options": ["A. 1 glucose","B. 2 pyruvate","C. 2 CO2","D. 2 ATP"],"points": 0.25,"q": "Sản phẩm chính của đường phân là","type": "mcq"},{"answer": "C","explain": "Chuỗi truyền electron ở màng trong ti thể.","level": "NB","options": ["A. Tế bào chất","B. Chất nền ti thể","C. Màng trong ti thể","D. Lục lạp"],"points": 0.25,"q": "Chuỗi truyền electron diễn ra ở","type": "mcq"},{"answer": "A","explain": "O2 + H+ + electron → H2O.","level": "TH","options": ["A. H2O","B. CO2","C. ATP","D. Glucose"],"points": 0.25,"q": "O2 kết hợp với H+ và electron ở cuối chuỗi truyền electron tạo thành","type": "mcq"},{"answer": "D","explain": "Hiếu khí ~36–38 ATP, lên men chỉ 2 ATP.","level": "VD","options": ["A. Bằng nhau","B. Lên men nhiều hơn","C. Hiếu khí gấp đôi","D. Hiếu khí nhiều hơn rất nhiều"],"points": 0.25,"q": "So sánh hiệu quả năng lượng giữa hô hấp hiếu khí và lên men","type": "mcq"},{"answer": "B","explain": "Nấm men lên men rượu tạo CO2 làm bột nở.","level": "VD","options": ["A. Vi khuẩn lactic","B. Nấm men","C. Vi khuẩn E. coli","D. Tảo lục"],"points": 0.25,"q": "Sinh vật nào được dùng để ủ bột làm bánh mì?","type": "mcq"},{"answer": "A","explain": "Thiếu O2 → chuỗi truyền electron ngừng → tế bào chuyển sang lên men.","level": "VDC","options": ["A. Chuỗi truyền electron ngừng, tế bào chuyển sang lên men","B. Đường phân ngừng","C. Ti thể vỡ","D. Không ảnh hưởng"],"points": 0.25,"q": "Khi tế bào thiếu O2, điều gì xảy ra với hô hấp?","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: 2 ATP. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về đường phân:","statements": ["a) Đường phân diễn ra ở tế bào chất.","b) Đường phân tạo 36 ATP.","c) Đường phân không cần O2.","d) Sản phẩm đường phân là pyruvate."],"type": "truefalse"},{"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng. c) Sai: ở chất nền. d) Sai: tạo H2O.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về chu trình Krebs và NADH:","statements": ["a) Chu trình Krebs tạo CO2.","b) NADH mang điện tử tới màng trong.","c) Chu trình Krebs diễn ra ở màng trong.","d) O2 tạo CO2 ở chuỗi truyền electron."],"type": "truefalse"},{"answer": "Hiếu khí","explain": "Hô hấp có O2 là hô hấp hiếu khí.","level": "NB","points": 0.5,"q": "Hô hấp diễn ra khi có O2 được gọi là hô hấp gì?","type": "short"},{"answer": "Lên men","explain": "Không có O2, tế bào chuyển sang lên men.","level": "TH","points": 0.5,"q": "Quá trình phân giải glucose không cần O2, chỉ tạo 2 ATP gọi là gì?","type": "short"}]},{"name": "Đề 4","questions": [{"answer": "D","explain": "Hô hấp: C6H12O6 + 6O2 → 6CO2 + 6H2O + ATP.","level": "NB","options": ["A. CO2 + H2O → glucose + O2","B. Glucose → rượu + CO2","C. Glucose → acid lactic","D. Glucose + O2 → CO2 + H2O + ATP"],"points": 0.25,"q": "Phương trình tổng quát của hô hấp tế bào là","type": "mcq"},{"answer": "B","explain": "Lên men lactic: glucose → acid lactic.","level": "NB","options": ["A. Rượu ethylic + CO2","B. Acid lactic","C. CO2 + H2O","D. Glucose"],"points": 0.25,"q": "Sản phẩm của lên men lactic là","type": "mcq"},{"answer": "C","explain": "Lên men rượu: glucose → rượu ethylic + CO2.","level": "TH","options": ["A. Acid lactic","B. CO2 + H2O","C. Rượu ethylic + CO2","D. ATP"],"points": 0.25,"q": "Sản phẩm của lên men rượu là","type": "mcq"},{"answer": "A","explain": "CO2 từ Krebs thải qua hô hấp cơ thể.","level": "VD","options": ["A. CO2 thải ra qua hô hấp","B. O2 được tạo ra","C. Glucose được tổng hợp","D. Nước được giữ lại"],"points": 0.25,"q": "CO2 tạo ra trong hô hấp tế bào được xử lí thế nào?","type": "mcq"},{"answer": "D","explain": "Năng lượng còn lại tỏa dạng nhiệt, duy trì thân nhiệt.","level": "VD","options": ["A. Dự trữ trong DNA","B. Thải hết ra ngoài","C. Biến thành ánh sáng","D. Tỏa ra dạng nhiệt duy trì thân nhiệt"],"points": 0.25,"q": "Phần năng lượng glucose không chuyển thành ATP sẽ","type": "mcq"},{"answer": "B","explain": "Tế bào ung thư/vùng thiếu O2 dùng lên men nên hiệu quả thấp, cần nhiều glucose.","level": "VDC","options": ["A. Vì chúng quang hợp","B. Vì lên men tạo ít ATP nên cần nhiều glucose","C. Vì chúng không hô hấp","D. Vì chúng dự trữ ATP"],"points": 0.25,"q": "Vì sao tế bào thiếu O2 cần tiêu thụ nhiều glucose hơn?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: ở tế bào chất. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về lên men:","statements": ["a) Lên men không cần O2.","b) Lên men tạo 2 ATP từ 1 glucose.","c) Lên men diễn ra trong ti thể.","d) Nấm men thực hiện lên men rượu."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: hiếu khí hiệu quả hơn. b) Đúng. c) Đúng. d) Sai: ở màng trong.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về O2 và ATP:","statements": ["a) Lên men hiệu quả hơn hô hấp hiếu khí.","b) O2 là chất nhận electron cuối cùng.","c) Thiếu O2, chuỗi truyền electron ngừng.","d) ATP chủ yếu tạo ở chu trình Krebs."],"type": "truefalse"},{"answer": "Ti thể","explain": "Ti thể là nhà máy năng lượng.","level": "NB","points": 0.5,"q": "Bào quan được ví như nhà máy năng lượng của tế bào là gì?","type": "short"},{"answer": "Mỏi cơ","explain": "Acid lactic gây mỏi cơ khi vận động mạnh.","level": "TH","points": 0.5,"q": "Hiện tượng cơ bị đau, cứng sau vận động mạnh do acid lactic gọi là gì?","type": "short"}]},{"name": "Đề 5","questions": [{"answer": "A","explain": "Hô hấp là dị hóa: phân giải, giải phóng năng lượng.","level": "NB","options": ["A. Dị hóa","B. Đồng hóa","C. Quang hợp","D. Tổng hợp protein"],"points": 0.25,"q": "Hô hấp tế bào thuộc quá trình","type": "mcq"},{"answer": "C","explain": "Đường phân ở tế bào chất, xảy ra ở mọi tế bào.","level": "NB","options": ["A. Ti thể","B. Lục lạp","C. Tế bào chất","D. Nhân"],"points": 0.25,"q": "Đường phân diễn ra ở","type": "mcq"},{"answer": "B","explain": "Pyruvate từ đường phân đi vào ti thể vào Krebs.","level": "TH","options": ["A. Thải ra ngoài","B. Đi vào ti thể tham gia chu trình Krebs","C. Biến thành glucose","D. Đi vào nhân"],"points": 0.25,"q": "Số phận của pyruvate sau đường phân (có O2) là","type": "mcq"},{"answer": "D","explain": "Màng trong gấp thành mào tăng diện tích chuỗi truyền electron.","level": "VD","options": ["A. Bảo vệ DNA","B. Chứa enzyme Krebs","C. Dự trữ Ca2+","D. Tăng diện tích cho chuỗi truyền electron"],"points": 0.25,"q": "Màng trong ti thể gấp nếp có ý nghĩa với hô hấp là","type": "mcq"},{"answer": "A","explain": "Vi khuẩn không có ti thể; hô hấp trên màng tế bào.","level": "VD","options": ["A. Trên màng tế bào","B. Trong ti thể","C. Trong lục lạp","D. Trong nhân"],"points": 0.25,"q": "Vi khuẩn hiếu khí hô hấp ở đâu?","type": "mcq"},{"answer": "D","explain": "Hô hấp tạo CO2 thải ra; quang hợp dùng CO2.","level": "VDC","options": ["A. Cả hai đều tạo O2","B. Cả hai đều cần ánh sáng","C. Cả hai đều ở ti thể","D. Hô hấp thải CO2, quang hợp dùng CO2"],"points": 0.25,"q": "Mối quan hệ giữa hô hấp và quang hợp là","type": "mcq"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: đường phân ở tế bào chất. c) Đúng. d) Sai: tạo ít ATP.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về 3 giai đoạn hô hấp:","statements": ["a) Hô hấp gồm 3 giai đoạn chính.","b) Cả 3 giai đoạn đều trong ti thể.","c) Chuỗi truyền electron cần O2.","d) Lên men tạo nhiều ATP."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: lên men lactic. d) Đúng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về sữa chua và bánh mì:","statements": ["a) Sữa chua nhờ vi khuẩn lactic.","b) Bánh mì nở nhờ CO2 từ lên men rượu.","c) Sữa chua nhờ nấm men lên men rượu.","d) Mỏi cơ do acid lactic."],"type": "truefalse"},{"answer": "Dị hóa","explain": "Hô hấp là quá trình dị hóa.","level": "NB","points": 0.5,"q": "Hô hấp tế bào thuộc kiểu chuyển hóa nào? (Ghi: Đồng hóa / Dị hóa)","type": "short"},{"answer": "Acid lactic","explain": "Lên men lactic tạo acid lactic.","level": "TH","points": 0.5,"q": "Chất gây mỏi cơ khi vận động mạnh có tên là gì?","type": "short"}]},{"name": "Đề 6","questions": [{"answer": "B","explain": "Ti thể hô hấp tạo ATP.","level": "NB","options": ["A. Lục lạp","B. Ti thể","C. Nhân","D. Ribosome"],"points": 0.25,"q": "Bào quan thực hiện hô hấp tế bào là","type": "mcq"},{"answer": "D","explain": "Lên men: 2 ATP.","level": "NB","options": ["A. 38 ATP","B. 36 ATP","C. 10 ATP","D. 2 ATP"],"points": 0.25,"q": "Năng lượng từ lên men 1 glucose là","type": "mcq"},{"answer": "C","explain": "Krebs ở chất nền ti thể.","level": "TH","options": ["A. Tế bào chất","B. Màng trong","C. Chất nền ti thể","D. Màng ngoài"],"points": 0.25,"q": "Nơi diễn ra chu trình Krebs là","type": "mcq"},{"answer": "A","explain": "O2 nhận e- cuối tạo H2O.","level": "VD","options": ["A. Nhận electron cuối cùng tạo H2O","B. Tạo glucose","C. Phân giải pyruvate","D. Nhận electron đầu tiên"],"points": 0.25,"q": "O2 trong hô hấp có vai trò","type": "mcq"},{"answer": "B","explain": "Nấm men lên men rượu làm bánh nở.","level": "VD","options": ["A. Lên men lactic","B. Lên men rượu tạo CO2","C. Hô hấp hiếu khí","D. Quang hợp"],"points": 0.25,"q": "Vì sao bột bánh mì nở khi ủ với nấm men?","type": "mcq"},{"answer": "C","explain": "Ngập úng thiếu O2 → chỉ lên men, ít ATP.","level": "VDC","options": ["A. Hô hấp mạnh","B. Quang hợp","C. Thiếu O2, chỉ lên men","D. Úng nước"],"points": 0.25,"q": "Hạt ngập úng nảy mầm kém vì","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: ở tế bào chất. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về các giai đoạn:","statements": ["a) Đường phân tạo pyruvate.","b) Krebs tạo CO2.","c) Đường phân diễn ra trong ti thể.","d) Chuỗi truyền electron tạo nhiều ATP nhất."],"type": "truefalse"},{"answer": ["F","T","F","T"],"explain": "a) Sai: không cần O2. b) Đúng. c) Sai: acid lactic. d) Đúng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về lên men và O2:","statements": ["a) Lên men cần O2.","b) Cơ thiếu O2 tạo acid lactic.","c) Lên men lacti
