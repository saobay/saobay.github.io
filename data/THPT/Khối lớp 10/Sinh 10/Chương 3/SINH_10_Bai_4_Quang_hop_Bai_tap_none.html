ang hợp diễn ra ở lục lạp."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: ở thylakoid. c) Đúng. d) Sai: pha tối ở stroma.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về pha sáng và pha tối:","statements": ["a) Pha sáng cần ánh sáng trực tiếp.","b) Pha sáng diễn ra ở stroma.","c) Pha tối cố định CO2 thành đường.","d) Pha tối diễn ra ở thylakoid."],"type": "truefalse"},{"answer": "Diệp lục","explain": "Diệp lục hấp thụ năng lượng ánh sáng.","level": "NB","points": 0.5,"q": "Sắc tố hấp thụ năng lượng ánh sáng trong quang hợp là gì?","type": "short"},{"answer": "Calvin","explain": "Pha tối thực hiện chu trình Calvin cố định CO2.","level": "TH","points": 0.5,"q": "Chu trình cố định CO2 trong pha tối có tên là gì?","type": "short"}]},{"name": "Đề 2","questions": [{"answer": "D","explain": "6CO2 + 12H2O → C6H12O6 + 6O2 + 6H2O (ánh sáng, diệp lục).","level": "NB","options": ["A. Glucose + O2 → CO2 + H2O","B. CO2 + H2O → glucose (không cần sáng)","C. Glucose → rượu + CO2","D. 6CO2 + 12H2O → C6H12O6 + 6O2 + 6H2O"],"points": 0.25,"q": "Phương trình tổng quát của quang hợp là","type": "mcq"},{"answer": "A","explain": "Quang hợp là đồng hóa: tổng hợp, tích lũy năng lượng.","level": "NB","options": ["A. Đồng hóa","B. Dị hóa","C. Lên men","D. Hô hấp"],"points": 0.25,"q": "Quang hợp thuộc quá trình","type": "mcq"},{"answer": "C","explain": "Quang phân li nước: 2H2O → 4H+ + 4e- + O2.","level": "TH","options": ["A. CO2","B. ATP","C. O2","D. Glucose"],"points": 0.25,"q": "Sản phẩm của quá trình quang phân li nước là","type": "mcq"},{"answer": "B","explain": "Vàng lá mất diệp lục → giảm hấp thụ sáng → giảm quang hợp.","level": "VD","options": ["A. Tăng quang hợp","B. Giảm quang hợp do mất diệp lục","C. Không ảnh hưởng","D. Tăng hô hấp"],"points": 0.25,"q": "Lá cây bị vàng sẽ quang hợp thế nào?","type": "mcq"},{"answer": "D","explain": "Bón CO2 tăng nguyên liệu pha tối → tăng quang hợp (đến ngưỡng).","level": "VD","options i là","type": "mcq"},{"answer": "A","explain": "Thylakoid chứa diệp lục hấp thụ sáng.","level": "TH","options": ["A. Chứa diệp lục hấp thụ ánh sáng","B. Cố định CO2","C. Dự trữ tinh bột","D. Tổng hợp protein"],"points": 0.25,"q": "Vai trò của màng thylakoid là","type": "mcq"},{"answer": "C","explain": "Thiếu nước → đóng khí khổng → thiếu CO2 → giảm quang hợp.","level": "VD","options": ["A. Tăng quang hợp","B. Không ảnh hưởng","C. Giảm quang hợp do thiếu nguyên liệu và đóng khí khổng","D. Tăng hô hấp"],"points": 0.25,"q": "Cây thiếu nước sẽ quang hợp thế nào?","type": "mcq"},{"answer": "B","explain": "Rừng quang hợp thải O2, hấp thụ CO2.","level": "VD","options": ["A. Lá phổi đen","B. Lá phổi xanh của Trái Đất","C. Nhà máy năng lượng","D. Kho carbon"],"points": 0.25,"q": "Rừng được ví như","type": "mcq"},{"answer": "A","explain": "Tăng CO2 đến ngưỡng tăng quang hợp; quá ngưỡng không tăng nữa.","level": "VDC","options": ["A. Tăng đến ngưỡng rồi không tăng nữa","B. Tăng vô hạn","C. Giảm","D. Không đổi"],"points": 0.25,"q": "Khi tăng nồng độ CO2, cường độ quang hợp sẽ","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: cũng cần nước. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về yếu tố ảnh hưởng:","statements": ["a) Ánh sáng ảnh hưởng đến pha sáng.","b) CO2 là nguyên liệu của pha tối.","c) Nước không ảnh hưởng đến quang hợp.","d) Nhiệt độ ảnh hưởng đến enzyme quang hợp."],"type": "truefalse"},{"answer": ["T","F","F","T"],"explain": "a) Đúng. b) Sai: thực vật, tảo, vi khuẩn lam. c) Sai: ở lục lạp. d) Đúng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về đối tượng quang hợp:","statements": ["a) Mọi sinh vật đều cần chất hữu cơ từ quang hợp.","b) Chỉ thực vật mới quang hợp.","c) Quang hợp ở thực vật diễn ra trong ti thể.","d) Quang hợp giúp điều hòa khí hậu."],"type": "truefalse"},{"answer": "Thylakoid","explain": "Pha sáng diễn ra trên màng thylakoid.","level": "NB","point
