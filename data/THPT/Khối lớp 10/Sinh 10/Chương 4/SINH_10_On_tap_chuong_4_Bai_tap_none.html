{"sets": [{"name": "Đề 1","questions": [{"answer": "C","explain": "Ba giai đoạn: tiếp nhận, truyền tin, đáp ứng.","level": "NB","options": ["A. tiết tín hiệu - tiếp nhận - đáp ứng.","B. truyền tin - đáp ứng - tiếp nhận.","C. tiếp nhận - truyền tin - đáp ứng.","D. đáp ứng - tiếp nhận - truyền tin."],"points": 0.25,"q": "Trình tự các giai đoạn của truyền tin tế bào là","type": "mcq"},{"answer": "B","explain": "Kì giữa: NST kép co xoắn cực đại, xếp 1 hàng trên mặt phẳng xích đạo.","level": "NB","options": ["A. kì đầu.","B. kì giữa.","C. kì sau.","D. kì cuối."],"points": 0.25,"q": "Trong nguyên phân, kì nào có NST kép xếp thành 1 hàng trên mặt phẳng xích đạo?","type": "mcq"},{"answer": "D","explain": "1 tế bào (2n) qua giảm phân tạo 4 tế bào con (n).","level": "NB","options": ["A. 1","B. 2","C. 3","D. 4"],"points": 0.25,"q": "Từ 1 tế bào mẹ, qua giảm phân tạo ra bao nhiêu tế bào con?","type": "mcq"},{"answer": "B","explain": "Insulin đi theo máu đến tế bào đích ở xa là truyền tin nội tiết.","level": "TH","options": ["A. cận tiết.","B. nội tiết.","C. tự tiết.","D. tiếp xúc trực tiếp."],"points": 0.25,"q": "Insulin do tuyến tụy tiết vào máu điều hòa đường huyết thuộc kiểu truyền tin","type": "mcq"},{"answer": "A","explain": "Kì giữa (NP): NST kép xếp 1 hàng; kì giữa I (GP): NST kép xếp 2 hàng.","level": "TH","options": ["A. Kì giữa xếp 1 hàng, kì giữa I xếp 2 hàng.","B. Kì giữa xếp 2 hàng, kì giữa I xếp 1 hàng.","C. Cả hai đều xếp 1 hàng.","D. Cả hai đều xếp 2 hàng."],"points": 0.25,"q": "Điểm khác nhau giữa kì giữa của nguyên phân và kì giữa I của giảm phân là","type": "mcq"},{"answer": "C","explain": "Tách tâm động xảy ra ở kì sau của nguyên phân và kì sau II; kì sau I NST kép đi nguyên vẹn về cực nên không thể là kì sau I.","level": "VDC","options": ["A. Chắc chắn là kì sau I.","B. Chắc chắn là kì cuối.","C. Là kì sau của nguyên phân (hoặc kì sau II), không phải kì sau I.","D. Không xác định được."],"points": 0.25,"q": "Quan sát một tế bào đang ở kì sau, thấy các NST kép tách ở tâm động thành NST đơn. Có thể kết luận gì?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: nhân đôi ADN ở pha S. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về chu kì tế bào:","statements": ["a) Kì trung gian gồm 3 pha G1, S, G2.","b) Điểm G1/S quyết định tế bào có nhân đôi ADN hay không.","c) Pha G1 diễn ra sự nhân đôi ADN.","d) Pha M là quá trình nguyên phân."],"type": "truefalse"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: nguyên phân tạo 2 TB con 2n. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về kết quả phân bào:","statements": ["a) Nguyên phân giữ nguyên bộ NST qua các thế hệ tế bào.","b) Nguyên phân từ 1 tế bào mẹ tạo 4 tế bào con.","c) Giảm phân làm giảm một nửa số lượng NST.","d) Tế bào con của giảm phân khác nhau về tổ hợp NST."],"type": "truefalse"},{"answer": "S","explain": "Pha S diễn ra sự nhân đôi ADN.","level": "VD","points": 0.5,"q": "Sự nhân đôi ADN diễn ra ở pha nào của kì trung gian? (trả lời 1 kí tự)","type": "short"},{"answer": "10","explain": "Kì sau nguyên phân: mỗi NST kép tách thành 2 NST đơn, mỗi cực nhận 2n NST đơn = 10.","level": "VDC","points": 0.5,"q": "Tế bào có 2n = 10 đang ở kì sau của nguyên phân. Mỗi cực có bao nhiêu NST đơn? (trả lời bằng số)","type": "short"}]},{"name": "Đề 2","questions": [{"answer": "A","explain": "Thụ thể là protein đặc hiệu nhận biết và gắn với phân tử tín hiệu.","level": "NB","options": ["A. protein đặc hiệu nhận biết phân tử tín hiệu.","B. phân tử tín hiệu.","C. chất truyền tin thứ hai.","D. enzyme phân giải tín hiệu."],"points": 0.25,"q": "Thụ thể trong truyền tin tế bào là","type": "mcq"},{"answer": "C","explain": "Pha S: nhân đôi ADN, NST nhân đôi thành NST kép.","level": "NB","options": ["A. tổng hợp bào quan.","B. phân chia nhân.","C. nhân đôi ADN.","D. hình thành thoi phân bào."],"points": 0.25,"q": "Sự kiện chính của pha S là","type": "mcq"},{"answer": "B","explain": "Trao đổi chéo xảy ra ở kì đầu I sau khi các NST tương đồng tiếp hợp.","level": "NB","options": ["A. kì giữa I.","B. kì đầu I.","C. kì sau I.","D. kì sau II."],"points": 0.25,"q": "Trao đổi chéo giữa các NST tương đồng xảy ra ở","type": "mcq"},{"answer": "D","explain": "Tín hiệu đi qua cầu nối giữa 2 tế bào kề nhau là tiếp xúc trực tiếp.","level": "TH","options": ["A. nội tiết.","B. cận tiết.","C. tự tiết.","D. tiếp xúc trực tiếp."],"points": 0.25,"q": "Tín hiệu truyền qua khe nối giữa các tế bào cơ tim kề nhau thuộc kiểu","type": "mcq"},{"answer": "C","explain": "Kì sau I: mỗi NST kép (nguyên vẹn) đi về 1 cực, không tách tâm động.","level": "TH","options": ["A. NST kép tách ở tâm động.","B. NST xếp 2 hàng ở xích đạo.","C. mỗi NST kép đi nguyên vẹn về 1 cực.","D. màng nhân xuất hiện trở lại."],"points": 0.25,"q": "Đặc điểm của kì sau I là","type": "mcq"},{"answer": "A","explain": "Giảm phân có tiếp hợp, trao đổi chéo (kì đầu I) và phân li độc lập (kì sau I) tạo tổ hợp NST mới; nguyên phân không có các hiện tượng này.","level": "VDC","options": ["A. Giảm phân có tiếp hợp, trao đổi chéo và phân li độc lập; nguyên phân không có.","B. Giảm phân nhân đôi ADN 2 lần.","C. Nguyên phân tạo 4 tế bào con.","D. Giảm phân không tạo giao tử."],"points": 0.25,"q": "Vì sao giảm phân tạo biến dị tổ hợp còn nguyên phân thì không?","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: tín hiệu tan trong lipid gắn thụ thể trong tế bào chất. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về truyền tin tế bào:","statements": ["a) Phân tử tín hiệu và thụ thể có tính đặc hiệu.","b) Mọi phân tử tín hiệu đều gắn vào thụ thể trên màng.","c) cAMP là chất truyền tin thứ hai.","d) Khuếch đại tín hiệu diễn ra ở giai đoạn truyền tin."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: tế bào ung thư phân chia mất kiểm soát. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về điều hòa chu kì tế bào:","statements": ["a) Các điểm kiểm soát giúp phát hiện sai hỏng của chu kì.","b) Sai hỏng không sửa được có thể khiến tế bào chết theo chương trình.","c) Tế bào ung thư tuân thủ nghiêm các điểm kiểm soát.","d) Hỏng cơ chế kiểm soát có thể dẫn đến ung thư."],"type": "truefalse"},{"answer": "8","explain": "2^3 = 8 tế bào con.","level": "VD","points": 0.5,"q": "Một tế bào nguyên phân 3 lần liên tiếp tạo ra bao nhiêu tế bào con? (trả lời bằng số)","type": "short"},{"answer": "7","explain": "Đậu Hà Lan 2n = 14, giao tử n = 7.","level": "VDC","points": 0.5,"q": "Giao tử của đậu Hà Lan (2n = 14) có bao nhiêu NST? (trả lời bằng số)","type": "short"}]},{"name": "Đề 3","questions": [{"answer": "B","explain": "cAMP và ion Ca2+ là chất truyền tin thứ hai.","level": "NB","options": ["A. Hormone.","B. cAMP.","C. Acetylcholine.","D. Auxin."],"points": 0.25,"q": "Chất nào sau đây là chất truyền tin thứ hai?","type": "mcq"},{"answer": "A","explain": "Tế bào động vật phân chia tế bào chất bằng cách thắt eo màng.","level": "NB","options": ["A. thắt eo màng tế bào.","B. hình thành vách ngăn.","C. tiêu biến màng nhân.","D. nhân đôi trung thể."],"points": 0.25,"q": "Phân chia tế bào chất ở tế bào động vật diễn ra bằng cách","type": "mcq"},{"answer": "C","explain": "Giảm phân II diễn ra giống nguyên phân.","level": "NB","options": ["A. giảm phân I.","B. trực phân.","C. nguyên phân.","D. phân đôi."],"points": 0.25,"q": "Giảm phân II có diễn biến giống với","type": "mcq"},{"answer": "D","explain": "Chất truyền tin thứ hai giúp khuếch đại: 1 tín hiệu ban đầu tạo hàng loạt đáp ứng.","level": "TH","options": ["A. Vì thụ thể rất nhiều.","B. Vì tín hiệu được nhân lên ngoài tế bào.","C. Vì tế bào tự tạo thêm tín hiệu.","D. Vì chuỗi truyền tin có bước khuếch đại nhờ chất truyền tin thứ hai."],"points": 0.25,"q": "Vì sao tín hiệu ban đầu yếu vẫn gây đáp ứng mạnh trong tế bào?","type": "mcq"},{"answer": "B","explain": "Điểm kiểm soát thoi phân bào rà soát mọi NST đã gắn đúng vào thoi chưa.","level": "TH","options": ["A. ADN đã nhân đôi xong chưa.","B. mọi NST đã gắn đúng vào thoi phân bào chưa.","C. tế bào đã đủ lớn chưa.","D. màng nhân đã tiêu biến chưa."],"points": 0.25,"q": "Điểm kiểm soát thoi phân bào kiểm tra","type": "mcq"},{"answer": "C","explain": "Colchicine phá thoi phân bào nên NST không gắn được vào thoi, tế bào dừng ở kì giữa (điểm kiểm soát thoi phân bào).","level": "VDC","options": ["A. Tế bào dừng ở kì đầu.","B. Tế bào dừng ở kì sau.","C. Tế bào dừng ở kì giữa do NST không gắn được vào thoi.","D. Tế bào phân chia bình thường."],"points": 0.25,"q": "Xử lí tế bào đang nguyên phân bằng colchicine (phá thoi phân bào). Dự đoán:","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: kì giữa I xếp 2 hàng. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về giảm phân I:","statements": ["a) Kì đầu I có tiếp hợp và trao đổi chéo.","b) Kì giữa I: NST kép xếp 1 hàng.","c) Kì sau I: NST kép đi nguyên vẹn về 2 cực.","d) Kết thúc giảm phân I tạo 2 tế bào (n kép)."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: giảm phân tạo 4 TB con n. b) Đúng. c) Đúng. d) Sai: tự tiết là tác động lên chính mình.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau:","statements": ["a) Giảm phân từ 1 tế bào mẹ tạo 2 tế bào con.","b) Nguyên phân giúp lành vết thương.","c) Cùng một hormone có thể gây đáp ứng khác nhau ở các tế bào.","d) Tế bào ung thư tự kích thích mình là truyền tin cận tiết."],"type": "truefalse"},{"answer": "Qua synapse","explain": "Acetylcholine đi qua khe synapse là truyền tin qua synapse.","level": "VD","points": 0.5,"q": "Acetylcholine tại synapse thần kinh - cơ thuộc kiểu truyền tin nào?","type": "short"},{"answer": "8","explain": "2n = 8, kì giữa I có 8 NST kép.","level": "VDC","points": 0.5,"q": "Tế bào (2n = 8) ở kì giữa I có bao nhiêu NST kép? (trả lời bằng số)","type": "short"}]},{"name": "Đề 4","questions": [{"answer": "D","explain": "Tiếp nhận: tín hiệu gắn thụ thể; truyền tin: chuỗi phân tử trong TB; đáp ứng: thay đổi hoạt động.","level": "NB","options": ["A. tiết tín hiệu.","B. tiếp nhận.","C. đáp ứng.","D. truyền tin."],"points": 0.25,"q": "Giai đoạn có sự tham gia của chất truyền tin thứ hai là","type": "mcq"},{"answer": "B","explain": "2n → 2n: nguyên phân giữ nguyên bộ NST.","level": "NB","options": ["A. 2n thành n.","B. 2n thành 2n.","C. n thành 2n.","D. n thành n."],"points": 0.25,"q": "Sự thay đổi bộ NST qua nguyên phân là","type": "mcq"},{"answer": "C","explain": "Phân li độc lập ở kì sau I tạo các tổ hợp NST khác nhau.","level": "NB","options": ["A. kì đầu I.","B. kì giữa I.","C. kì sau I.","D. kì sau II."],"points": 0.25,"q": "Sự phân li độc lập của các cặp NST tương đồng diễn ra ở","type": "mcq"},{"answer": "A","explain": "Yếu tố sinh trưởng tác động lên tế bào lân cận là cận tiết.","level": "TH","options": ["A. cận tiết.","B. nội tiết.","C. tự tiết.","D. qua synapse."],"points": 0.25,"q": "Yếu tố sinh trưởng kích thích tế bào xung quanh phân chia thuộc kiểu truyền tin","type": "mcq"},{"answer": "C","explain": "Kì đầu: NST kép đóng xoắn hiện rõ, màng nhân tiêu biến, thoi hình thành.","level": "TH","options": ["A. NST xếp 1 hàng ở xích đạo.","B. NST kép tách ở tâm động.","C. màng nhân tiêu biến, NST kép hiện rõ.","D. màng nhân xuất hiện trở lại."],"points": 0.25,"q": "Dấu hiệu nhận biết kì đầu của nguyên phân là","type": "mcq"},{"answer": "B","explain": "Cùng thụ thể nhưng chuỗi truyền tin trong mỗi loại tế bào khác nhau nên đáp ứng khác nhau.","level": "VDC","options": ["A. Vì lượng hormone đến gan và cơ khác nhau.","B. Vì chuỗi truyền tin bên trong mỗi loại tế bào khác nhau.","C. Vì gan to hơn cơ.","D. Vì thụ thể ở gan và cơ hoàn toàn khác nhau."],"points": 0.25,"q": "Cùng một hormone nhưng tế bào gan và tế bào cơ đáp ứng khác nhau. Nguyên nhân sâu xa là","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: kì sau NST kép tách thành NST đơn. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về NST trong nguyên phân:","statements": ["a) Sau pha S, mỗi NST gồm 2 chromatid.","b) Kì giữa: NST co xoắn cực đại.","c) Kì giữa: mỗi NST kép đã tách thành 2 NST đơn.","d) Kì cuối: NST tháo xoắn."],"type": "truefalse"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: tự tiết là tác động lên chính mình. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về các kiểu truyền tin:","statements": ["a) Nội tiết: hormone theo máu đến tế bào đích ở xa.","b) Tự tiết: tín hiệu tác động lên tế bào lân cận.","c) Tiếp xúc trực tiếp: tín hiệu qua cầu nối giữa 2 tế bào kề nhau.","d) Qua synapse: chất dẫn truyền đi qua khe hẹp."],"type": "truefalse"},{"answer": "Nội tiết","explain": "Hormone theo máu đi xa là truyền tin nội tiết.","level": "VD","points": 0.5,"q": "Tuyến giáp tiết thyroxine vào máu điều hòa trao đổi chất khắp cơ thể. Đây là kiểu truyền tin nào?","type": "short"},{"answer": "16","explain": "2^4 = 16 tế bào con.","level": "VDC","points": 0.5,"q": "Từ 1 tế bào qua 4 lần nguyên phân liên tiếp tạo ra bao nhiêu tế bào con? (trả lời bằng số)","type": "short"}]},{"name": "Đề 5","questions": [{"answer": "A","explain": "Không có thụ thể đặc hiệu thì không có tiếp nhận, không có đáp ứng.","level": "NB","options": ["A. không đáp ứng với tín hiệu đó.","B. vẫn đáp ứng bình thường.","C. tự tạo ra thụ thể mới ngay.","D. đáp ứng mạnh hơn."],"points": 0.25,"q": "Tế bào không có thụ thể đặc hiệu với một tín hiệu thì khi gặp tín hiệu đó sẽ","type": "mcq"},{"answer": "C","explain": "G0: tế bào tạm dừng phân chia, thực hiện chức năng chuyên hóa.","level": "NB","options": ["A. G1.","B. S.","C. G0.","D. M."],"points": 0.25,"q": "Tế bào tạm dừng phân chia để thực hiện chức năng chuyên hóa đang ở pha","type": "mcq"},{"answer": "D","explain": "Sau GP I: 2 TB (n kép); sau GP II: 4 TB (n đơn).","level": "NB","options": ["A. 2 tế bào (2n).","B. 4 tế bào (2n).","C. 2 tế bào (n).","D. 4 tế bào (n)."],"points": 0.25,"q": "Kết thúc giảm phân II, số tế bào con và bộ NST là","type": "mcq"},{"answer": "B","explain": "Kì sau: NST kép tách ở tâm động, 2 nhóm NST đơn về 2 cực.","level": "TH","options": ["A. NST kép xếp 1 hàng.","B. 2 nhóm NST đơn đang về 2 cực.","C. màng nhân xuất hiện lại.","D. NST bắt đầu đóng xoắn."],"points": 0.25,"q": "Quan sát thấy 2 nhóm NST đơn đang di chuyển về 2 cực. Tế bào đang ở kì nào của nguyên phân?","type": "mcq"},{"answer": "A","explain": "Giảm phân tạo giao tử n, thụ tinh khôi phục 2n.","level": "TH","options": ["A. tạo giao tử và duy trì bộ NST qua sinh sản hữu tính.","B. giúp cơ thể sinh trưởng.","C. tái sinh mô tổn thương.","D. tạo tế bào sinh dưỡng."],"points": 0.25,"q": "Ý nghĩa quan trọng nhất của giảm phân là","type": "mcq"},{"answer": "D","explain": "Kì sau I NST kép nguyên vẹn về cực (không tách tâm động); kì sau II tách tâm động như nguyên phân.","level": "VDC","options": ["A. Cả hai đều tách tâm động.","B. Cả hai đều không tách tâm động.","C. Kì sau I tách tâm động, kì sau II không.","D. Kì sau I không tách tâm động, kì sau II tách tâm động."],"points": 0.25,"q": "So sánh kì sau I và kì sau II về sự tách tâm động:","type": "mcq"},{"answer": ["F","T","T","T"],"explain": "a) Sai: tế bào đích phải có thụ thể đặc hiệu. b) Đúng. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về tính đặc hiệu:","statements": ["a) Mọi tế bào đều đáp ứng giống nhau với cùng một hormone.","b) Thụ thể chỉ gắn với phân tử tín hiệu đặc hiệu.","c) Tế bào mất thụ thể sẽ không đáp ứng với tín hiệu tương ứng.","d) Cùng một tín hiệu có thể gây đáp ứng khác nhau ở các tế bào."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: nhân đôi ADN ở pha S. c) Đúng. d) Sai: thắt eo ở tế bào động vật.","type": "truefalse","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về kì trung gian và phân chia tế bào chất:","statements": ["a) Kì trung gian chiếm phần lớn thời gian chu kì.","b) Pha G2 diễn ra nhân đôi ADN.","c) Tế bào thực vật phân chia tế bào chất bằng vách ngăn.","d) Tế bào động vật phân chia tế bào chất bằng vách ngăn."]},{"type": "short","level": "VD","q": "Kể tên cầu nối giúp truyền tin tiếp xúc trực tiếp ở tế bào thực vật.","answer": "Cầu sinh chất","explain": "Cầu sinh chất (plasmodesmata) nối tế bào chất hai tế bào thực vật kề nhau.","points": 0.5},{"type": "short","level": "VDC","q": "Tế bào có 2n = 20 đang ở kì giữa của nguyên phân. Tế bào này có bao nhiêu chromatid? (trả lời bằng số)","answer": "40","explain": "Kì giữa mỗi NST là NST kép gồm 2 chromatid: 20 x 2 = 40.","points": 0.5}]},{"name": "Đề 6","questions": [{"type": "mcq","level": "NB","q": "Phân tử tín hiệu được tế bào tiết ra có tên gọi khác là","options": ["A. thụ thể.","B. phối tử (ligand).","C. enzyme.","D. kháng thể."],"answer": "B","explain": "Phân tử tín hiệu còn gọi là phối tử (ligand).","points": 0.25},{"type": "mcq","level": "NB","q": "Trong nguyên phân, thoi phân bào có vai trò","options": ["A. giúp NST đóng xoắn.","B. kéo các NST về 2 cực của tế bào.","C. giúp màng nhân tiêu biến.","D. tổng hợp ADN."],"answer": "B","explain": "Thoi phân bào gắn vào tâm động và kéo NST về 2 cực ở kì sau.","points": 0.25},{"type": "mcq","level": "NB","q": "Hiện tượng các NST kép bắt cặp theo từng cặp tương đồng ở kì đầu I được gọi là","options": ["A. tiếp hợp.","B. phân li.","C. tháo xoắn.","D. đóng xoắn."],"answer": "A","explain": "Tiếp hợp là sự bắt cặp của các NST tương đồng ở kì đầu I.","points": 0.25},{"type": "mcq","level": "TH","q": "Hormone steroid tan trong lipid sẽ gắn vào thụ thể nằm ở","options": ["A. trên màng sinh chất.","B. trong tế bào chất.","C. trong máu.","D. trên thành mạch."],"answer": "B","explain": "Tín hiệu tan trong lipid đi xuyên màng, gắn thụ thể trong tế bào chất.","points": 0.25},{"type": "mcq","level": "TH","q": "Vì sao sau pha S, hàm lượng ADN trong tế bào tăng gấp đôi?","options": ["A. Vì tế bào hấp thụ thêm ADN từ ngoài.","B. Vì mỗi phân tử ADN được nhân đôi thành 2 phân tử.","C. Vì NST đóng xoắn lại.","D. Vì tế bào phân chia."],"answer": "B","explain": "Pha S nhân đôi ADN: mỗi phân tử ADN tạo 2 phân tử giống hệt.","points": 0.25},{"type": "mcq","level": "VDC","q": "Một cặp vợ chồng bình thường sinh con mắc hội chứng Down (thừa 1 NST 21). Nguyên nhân có thể là","options": ["A. NST không phân li trong giảm phân tạo giao tử thừa NST 21.","B. NST không phân li trong nguyên phân của hợp tử.","C. ADN không nhân đôi ở pha S.","D. Thoi phân bào không hình thành trong nguyên phân."],"answer": "A","explain": "Rối loạn phân li NST trong giảm phân tạo giao tử thừa/thiếu NST, gây hội chứng NST như Down.","points": 0.25},{"type": "truefalse","level": "TH","q": "Xét tính đúng, sai của các phát biểu sau về giảm phân II:","statements": ["a) Giảm phân II diễn ra giống nguyên phân.","b) Trước giảm phân II không có nhân đôi ADN.","c) Kì sau II: NST kép tách ở tâm động.","d) Kết thúc giảm phân II tạo 2 tế bào con."],"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tạo 4 tế bào con (tính từ đầu giảm phân).","points": 1},{"type": "truefalse","level": "VD","q": "Xét tính đúng, sai của các phát biểu sau về vai trò phân bào:","statements": ["a) Nguyên phân giúp cơ thể sinh trưởng.","b) Giảm phân tạo giao tử cho sinh sản hữu tính.","c) Giảm phân giúp lành vết thương.","d) Nguyên phân là cơ sở của sinh sản vô tính."],"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: lành vết thương nhờ nguyên phân. d) Đúng.","points": 1},{"type": "short","level": "VD","q": "Đáp ứng của tế bào sau khi nhận tín hiệu có thể là mở kênh ion, hoạt hóa enzyme hoặc thay đổi gì liên quan đến gen?","answer": "Biểu hiện gen","explain": "Đáp ứng gồm mở/đóng kênh ion, hoạt hóa enzyme, biểu hiện gen.","points": 0.5},{"type": "short","level": "VDC","q": "Tế bào người (2n = 46) ở kì sau I của giảm phân. Mỗi cực tế bào có bao nhiêu NST kép? (trả lời bằng số)","answer": "23","explain": "Kì sau I mỗi cực nhận n = 23 NST kép.","points": 0.5}]},{"name": "Đề 7","questions": [{"answer": "B","explain": "Đáp ứng: mở/đóng kênh ion, hoạt hóa enzyme, biểu hiện gen.","level": "NB","options": ["A. tiếp nhận.","B. đáp ứng.","C. truyền tin.","D. tiết tín hiệu."],"points": 0.25,"q": "Mở kênh ion và hoạt hóa enzyme là hoạt động thuộc giai đoạn nào của truyền tin?","type": "mcq"},{"answer": "C","explain": "2n → 2n: nguyên phân giữ nguyên bộ NST.","level": "NB","options": ["A. 2n thành n.","B. n thành 2n.","C. 2n thành 2n.","D. 2n thành 4n."],"points": 0.25,"q": "Sau nguyên phân, bộ NST của tế bào con so với tế bào mẹ là","type": "mcq"},{"answer": "A","explain": "Kì đầu I: tiếp hợp và trao đổi chéo.","level": "NB","options": ["A. kì đầu I.","B. kì giữa I.","C. kì sau I.","D. kì giữa II."],"points": 0.25,"q": "Tiếp hợp và trao đổi chéo xảy ra ở kì nào?","type": "mcq"},{"answer": "B","explain": "Thụ thể hỏng thì không tiếp nhận được tín hiệu.","level": "TH","options": ["A. Tế bào vẫn đáp ứng bình thường.","B. Tế bào không tiếp nhận được tín hiệu.","C. Tín hiệu tự đi vào tế bào.","D. Tế bào tạo thụ thể mới ngay."],"points": 0.25,"q": "Nếu thụ thể của tế bào bị phá hủy thì điều gì xảy ra?","type": "mcq"},{"answer": "D","explain": "Kì giữa NST co xoắn cực đại nên quan sát rõ nhất.","level": "TH","options": ["A. kì đầu.","B. kì giữa.","C. kì sau.","D. kì cuối."],"points": 0.25,"q": "Muốn quan sát hình dạng NST rõ nhất nên chọn tế bào ở kì nào của nguyên phân?","type": "mcq"},{"answer": "A","explain": "Kì sau I làm giảm số NST (mỗi cực nhận n NST kép); các kì sau có tách tâm động (NP, GP II) không làm giảm số NST.","level": "VDC","options": ["A. Kì sau I làm giảm số NST, kì sau của nguyên phân không.","B. Cả hai đều làm giảm số NST.","C. Cả hai đều không làm giảm số NST.","D. Kì sau của nguyên phân làm giảm số NST."],"points": 0.25,"q": "So sánh kì sau I của giảm phân với kì sau của nguyên phân về số lượng NST:","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: tín hiệu tan trong lipid gắn thụ thể trong tế bào chất. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về thụ thể:","statements": ["a) Thụ thể chỉ gắn với phân tử tín hiệu đặc hiệu.","b) Mọi thụ thể đều nằm trên màng sinh chất.","c) Thụ thể quyết định tế bào nào đáp ứng với tín hiệu nào.","d) Mất thụ thể làm tế bào mất khả năng đáp ứng."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: kì sau I NST kép nguyên vẹn về cực. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về kì sau:","statements": ["a) Kì sau (nguyên phân): NST kép tách ở tâm động.","b) Kì sau II: NST kép tách ở tâm động.","c) Kì sau I: NST kép tách ở tâm động.","d) Kì sau I: mỗi cực nhận n NST kép."],"type": "truefalse"},{"answer": "Tiếp nhận","explain": "Tiếp nhận là giai đoạn đầu tiên: tín hiệu gắn thụ thể.","level": "VD","points": 0.5,"q": "Giai đoạn đầu tiên của quá trình truyền tin tế bào là gì?","type": "short"},{"answer": "46","explain": "Nguyên phân giữ nguyên 2n = 46.","level": "VDC","points": 0.5,"q": "Tế bào người (2n = 46) nguyên phân một lần, mỗi tế bào con có bao nhiêu NST? (trả lời bằng số)","type": "short"}]},{"name": "Đề 8","questions": [{"answer": "D","explain": "Tín hiệu nội tiết đi theo máu nên chậm; qua synapse chỉ qua khe hẹp nên nhanh.","level": "NB","options": ["A. nội tiết nhanh hơn.","B. hai kiểu nhanh như nhau.","C. cận tiết nhanh nhất.","D. qua synapse nhanh hơn."],"points": 0.25,"q": "So sánh tốc độ truyền tin nội tiết và qua synapse:","type": "mcq"},{"answer": "A","explain": "Pha G1: tế bào lớn lên, tổng hợp bào quan.","level": "NB","options": ["A. tăng kích thước và tổng hợp bào quan.","B. nhân đôi ADN.","C. phân chia nhân.","D. hình thành thoi phân bào."],"points": 0.25,"q": "Sự kiện chính của pha G1 là","type": "mcq"},{"answer": "B","explain": "n kép: số NST giảm một nửa nhưng vẫn ở dạng kép.","level": "NB","options": ["A. 2n kép.","B. n kép.","C. n đơn.","D. 2n đơn."],"points": 0.25,"q": "Sau giảm phân I, mỗi tế bào con có bộ NST","type": "mcq"},{"answer": "C","explain": "Khuếch đại ở giai đoạn truyền tin nhờ chất truyền tin thứ hai.","level": "TH","options": ["A. tiếp nhận.","B. đáp ứng.","C. truyền tin.","D. tiết tín hiệu."],"points": 0.25,"q": "Hiện tượng khuếch đại tín hiệu diễn ra ở giai đoạn nào?","type": "mcq"},{"answer": "A","explain": "Kì cuối: NST tháo xoắn, màng nhân xuất hiện lại, thoi tiêu biến.","level": "TH","options": ["A. NST tháo xoắn, màng nhân xuất hiện lại.","B. NST kép tách ở tâm động.","C. NST xếp 1 hàng ở xích đạo.","D. màng nhân tiêu biến."],"points": 0.25,"q": "Diễn biến của kì cuối trong nguyên phân là","type": "mcq"},{"answer": "C","explain": "Tế bào con mang đột biến hỏng điểm kiểm soát nên tiếp tục phân chia mất kiểm soát, khối u lớn dần.","level": "VDC","options": ["A. Vì tế bào ung thư không cần dinh dưỡng.","B. Vì hệ miễn dịch nuôi khối u.","C. Vì đột biến hỏng kiểm soát được truyền cho tế bào con.","D. Vì tế bào ung thư phân chia rất chậm."],"points": 0.25,"q": "Vì sao khối u ung thư ngày càng lớn theo thời gian?","type": "mcq"},{"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: nguyên phân tạo 2 TB con 2n.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về số lượng sản phẩm phân bào:","statements": ["a) 1 tế bào qua 1 lần nguyên phân tạo 2 tế bào con.","b) 1 tế bào qua giảm phân tạo 4 tế bào con.","c) 1 tế bào qua 2 lần nguyên phân tạo 4 tế bào con.","d) 1 tế bào qua giảm phân tạo 2 tế bào con."],"type": "truefalse"},{"answer": ["F","T","T","T"],"explain": "a) Sai: 2n = 8 thì n = 4. b) Đúng. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về ruồi giấm (2n = 8):","statements": ["a) Mỗi giao tử có 8 NST.","b) Kì giữa I có 8 NST kép.","c) Kì sau I mỗi cực nhận 4 NST kép.","d) Kì sau II mỗi cực nhận 4 NST đơn."],"type": "truefalse"},{"answer": "Kì giữa","explain": "Kì giữa NST co xoắn cực đại, quan sát rõ nhất.","level": "VD","points": 0.5,"q": "Kì nào của nguyên phân quan sát NST rõ nhất?","type": "short"},{"answer": "Kì sau II","explain": "Kì sau II: NST kép tách ở tâm động thành NST đơn.","level": "VDC","points": 0.5,"q": "Trong giảm phân, NST kép tách ở tâm động tại kì nào?","type": "short"}]},{"name": "Đề 9","questions": [{"answer": "C","explain": "Cận tiết: tín hiệu tác động lên tế bào lân cận.","level": "NB","options": ["A. nội tiết.","B. tự tiết.","C. cận tiết.","D. qua synapse."],"points": 0.25,"q": "Tín hiệu tác động lên tế bào nằm ngay bên cạnh thuộc kiểu","type": "mcq"},{"answer": "B","explain": "Tâm động là nơi 2 chromatid dính nhau.","level": "NB","options": ["A. đầu mút NST.","B. tâm động.","C. eo thứ cấp.","D. vệ tinh."],"points": 0.25,"q": "Hai chromatid của NST kép dính nhau ở","type": "mcq"},{"answer": "D","explain": "Thụ tinh: n + n → 2n, khôi phục bộ NST lưỡng bội.","level": "NB","options": ["A. tạo biến dị tổ hợp.","B. làm tăng số giao tử.","C. giảm số NST của hợp tử.","D. khôi phục bộ NST lưỡng bội cho hợp tử."],"points": 0.25,"q": "Vai trò của thụ tinh phối hợp với giảm phân là","type": "mcq"},{"answer": "A","explain": "Không có điểm kiểm soát, sai hỏng tích lũy và tế bào phân chia mất kiểm soát.","level": "TH","options": ["A. Sai hỏng không được sửa, tế bào có thể phân chia mất kiểm soát.","B. Tế bào không bao giờ phân chia.","C. Tế bào phân chia nhanh hơn.","D. Tế bào luôn chết ngay."],"points": 0.25,"q": "Nếu các điểm kiểm soát chu kì tế bào bị hỏng thì","type": "mcq"},{"answer": "B","explain": "Kì sau II tách tâm động như kì sau nguyên phân.","level": "TH","options": ["A. kì đầu I.","B. kì sau II.","C. kì giữa I.","D. kì cuối I."],"points": 0.25,"q": "Kì nào của giảm phân có diễn biến giống kì sau của nguyên phân nhất?","type": "mcq"},{"answer": "B","explain": "2n = 14 → kì giữa I có 14 NST kép; kì sau I mỗi cực 7 NST kép.","level": "VDC","options": ["A. 14 và 14.","B. 14 và 7.","C. 7 và 7.","D. 28 và 14."],"points": 0.25,"q": "Tế bào đậu Hà Lan (2n = 14). Số NST kép ở kì giữa I và ở mỗi cực tại kì sau I lần lượt là","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: auxin tác động lên chồi bên ở gần là cận tiết. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về ví dụ truyền tin:","statements": ["a) Insulin là ví dụ truyền tin nội tiết.","b) Auxin từ chồi ngọn ức chế chồi bên là truyền tin nội tiết.","c) Acetylcholine ở synapse là truyền tin qua synapse.","d) Khe nối ở cơ tim là truyền tin tiếp xúc trực tiếp."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: NST kép tách ở tâm động ở kì sau II. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về giảm phân ở người (2n = 46):","statements": ["a) Mỗi tinh trùng có 23 NST.","b) Kì đầu I có tiếp hợp và trao đổi chéo.","c) NST kép tách ở tâm động tại kì sau I.","d) Thụ tinh tạo hợp tử có 46 NST."],"type": "truefalse"},{"answer": "Tự tiết","explain": "Tế bào tiết tín hiệu tác động lên chính nó là tự tiết.","level": "VD","points": 0.5,"q": "Tế bào tiết tín hiệu rồi chính nó đáp ứng với tín hiệu đó thuộc kiểu truyền tin nào?","type": "short"},{"answer": "7","explain": "2n = 14, kì sau I mỗi cực nhận n = 7 NST kép.","level": "VDC","points": 0.5,"q": "Tế bào đậu Hà Lan (2n = 14) ở kì sau I, mỗi cực có bao nhiêu NST kép? (trả lời bằng số)","type": "short"}]},{"name": "Đề 10","questions": [{"answer": "A","explain": "Chất đối kháng chiếm thụ thể nhưng không kích hoạt truyền tin.","level": "NB","options": ["A. gắn vào thụ thể nhưng ngăn đáp ứng.","B. kích hoạt đáp ứng mạnh.","C. phá hủy thụ thể.","D. thay thế phân tử tín hiệu."],"points": 0.25,"q": "Chất đối kháng thụ thể có tác dụng","type": "mcq"},{"answer": "D","explain": "Hợp tử nguyên phân tạo cơ thể; tế bào sinh dục chín giảm phân tạo giao tử.","level": "NB","options": ["A. giảm phân - giảm phân.","B. giảm phân - nguyên phân.","C. nguyên phân - nguyên phân.","D. nguyên phân - giảm phân."],"points": 0.25,"q": "Hợp tử phát triển thành cơ thể nhờ (1); tế bào sinh dục chín tạo giao tử nhờ (2). (1), (2) là","type": "mcq"},{"answer": "C","explain": "Trao đổi chéo, phân li độc lập, thụ tinh ngẫu nhiên tạo biến dị tổ hợp.","level": "NB","options": ["A. đột biến gen.","B. nguyên phân.","C. trao đổi chéo, phân li độc lập, thụ tinh ngẫu nhiên.","D. thường biến."],"points": 0.25,"q": "Biến dị tổ hợp được tạo ra nhờ","type": "mcq"},{"answer": "B","explain": "Cùng thụ thể nhưng chuỗi truyền tin trong mỗi tế bào khác nhau.","level": "TH","options": ["A. Vì lượng tín hiệu khác nhau.","B. Vì chuỗi truyền tin trong mỗi tế bào khác nhau.","C. Vì kích thước tế bào khác nhau.","D. Vì thụ thể hoàn toàn khác nhau."],"points": 0.25,"q": "Cùng một tín hiệu nhưng các tế bào đáp ứng khác nhau vì","type": "mcq"},{"answer": "C","explain": "Nguyên phân: 1 lần, 2 TB 2n giống mẹ; giảm phân: 2 lần, 4 TB n khác nhau.","level": "TH","options": ["A. Số lần nhân đôi ADN.","B. Có hay không có thoi phân bào.","C. Số lần phân bào và bộ NST của tế bào con.","D. Có hay không có kì trung gian."],"points": 0.25,"q": "Điểm khác nhau cơ bản giữa nguyên phân và giảm phân là","type": "mcq"},{"answer": "D","explain": "Kì sau I: NST kép nguyên vẹn về cực; kì sau II: tách tâm động.","level": "VDC","options": ["A. Đều tách tâm động.","B. Đều không tách tâm động.","C. Kì sau I tách, kì sau II không.","D. Kì sau I không tách, kì sau II tách."],"points": 0.25,"q": "So sánh sự tách tâm động ở kì sau I và kì sau II:","type": "mcq"},{"answer": ["F","T","T","T"],"explain": "a) Sai: nội tiết đi theo máu nên chậm. b) Đúng. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về tốc độ và phạm vi truyền tin:","statements": ["a) Truyền tin nội tiết nhanh hơn qua synapse.","b) Truyền tin qua synapse chỉ tác động tại chỗ hẹp.","c) Hormone tác động rộng khắp cơ thể.","d) Cận tiết chỉ tác động lên tế bào lân cận."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: giảm phân tạo 4 TB con n. c) Đúng. d) Sai: nguyên phân tạo 2 TB con 2n giống mẹ.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về sản phẩm phân bào:","statements": ["a) Nguyên phân: 1 tế bào mẹ tạo 2 tế bào con.","b) Giảm phân: 1 tế bào mẹ tạo 2 tế bào con.","c) Tế bào con của giảm phân có n NST.","d) Tế bào con của nguyên phân có n NST."],"type": "truefalse"},{"answer": "4","explain": "1 tế bào mẹ qua giảm phân tạo 4 tế bào con.","level": "VD","points": 0.5,"q": "Từ 1 tế bào mẹ qua giảm phân tạo ra bao nhiêu tế bào con? (trả lời bằng số)","type": "short"},{"answer": "Khuếch đại tín hiệu","explain": "Một tín hiệu nhỏ gây đáp ứng lớn nhờ khuếch đại tín hiệu ở giai đoạn truyền tin.","level": "VDC","points": 0.5,"q": "Hiện tượng một phân tử tín hiệu ban đầu tạo ra hàng loạt đáp ứng trong tế bào được gọi là gì?","type": "short"}]}]}
