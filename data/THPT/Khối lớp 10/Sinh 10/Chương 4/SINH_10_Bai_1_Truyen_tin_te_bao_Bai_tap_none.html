<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1","questions": [{"answer": "B","explain": "Truyền tin tế bào là quá trình truyền thông tin từ tế bào này sang tế bào khác (hoặc từ môi trường vào trong tế bào) thông qua các phân tử tín hiệu.","level": "NB","options": ["A. Trao đổi chất giữa tế bào và môi trường.","B. Truyền thông tin từ tế bào này sang tế bào khác qua phân tử tín hiệu.","C. Phân chia tế bào tạo ra các tế bào con.","D. Vận chuyển các chất qua màng sinh chất."],"points": 0.25,"q": "Truyền tin tế bào là quá trình nào sau đây?","type": "mcq"},{"answer": "A","explain": "Phân tử tín hiệu (còn gọi là phối tử - ligand) như hormone, chất dẫn truyền thần kinh mang thông tin từ tế bào tiết đến tế bào đích.","level": "NB","options": ["A. phân tử tín hiệu (phối tử).","B. enzyme.","C. kháng thể.","D. nucleic acid."],"points": 0.25,"q": "Phân tử mang thông tin trong quá trình truyền tin tế bào được gọi là","type": "mcq"},{"answer": "B","explain": "Thụ thể nhận biết và gắn đặc hiệu với phân tử tín hiệu của nó, giống như ổ khóa chỉ mở bằng đúng chìa khóa.","level": "NB","options": ["A. tổng hợp phân tử tín hiệu.","B. nhận biết và gắn đặc hiệu với phân tử tín hiệu.","C. phân giải phân tử tín hiệu.","D. vận chuyển tín hiệu trong máu."],"points": 0.25,"q": "Thụ thể (receptor) trong truyền tin tế bào có chức năng","type": "mcq"},{"answer": "B","explain": "Tiếp nhận là giai đoạn đầu tiên: phân tử tín hiệu gắn vào thụ thể đặc hiệu trên màng hoặc trong tế bào đích.","level": "TH","options": ["A. tế bào thay đổi hoạt động.","B. phân tử tín hiệu gắn vào thụ thể đặc hiệu của tế bào đích.","C. chất truyền tin thứ hai được tạo ra.","D. tín hiệu được khuếch đại lên nhiều lần."],"points": 0.25,"q": "Giai đoạn tiếp nhận trong truyền tin tế bào diễn ra khi","type": "mcq"},{"answer": "B","explain": "cAMP và ion Ca2+ là các chất truyền tin thứ hai phổ biến, giúp chuyển tiếp và khuếch đại tín hiệu trong tế bào.","level": "TH","options": ["A. Glucose.","B. cAMP.","C. ATP.","D. Amino acid."],"points": 0.25,"q": "Chất nào sau đây là chất truyền tin thứ hai phổ biến trong tế bào?","type": "mcq"},{"answer": "B","explain": "Cùng một phân tử tín hiệu nhưng đáp ứng khác nhau vì mỗi loại tế bào đích có thụ thể và chuỗi truyền tin riêng.","level": "VDC","options": ["A. adrenaline có nhiều loại khác nhau.","B. đáp ứng của tế bào phụ thuộc vào loại thụ thể và con đường truyền tin trong mỗi tế bào đích.","C. tim và da nhận được lượng adrenaline khác nhau.","D. thụ thể ở tim và ở da hoàn toàn giống nhau."],"points": 0.25,"q": "Trong cùng một cơ thể, adrenaline làm tim đập nhanh hơn nhưng lại làm mạch máu ở da co lại. Điều này chứng tỏ","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: thụ thể chỉ gắn đặc hiệu với phân tử tín hiệu của nó. c) Đúng. d) Đúng: một tín hiệu ban đầu tạo ra hàng loạt đáp ứng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về truyền tin tế bào:","statements": ["a) Truyền tin tế bào giúp các tế bào trong cơ thể phối hợp hoạt động với nhau.","b) Một phân tử tín hiệu có thể gắn với bất kì thụ thể nào trên màng tế bào.","c) Giai đoạn đáp ứng là khi tế bào thay đổi hoạt động sau khi nhận tín hiệu.","d) Chất truyền tin thứ hai giúp khuếch đại tín hiệu trong tế bào."],"type": "truefalse"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: cận tiết là tín hiệu tác động lên tế bào lân cận, không qua máu đi xa. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về các kiểu truyền tin tế bào:","statements": ["a) Truyền tin nội tiết: hormone đi theo máu tới tế bào đích ở xa.","b) Truyền tin cận tiết: tín hiệu đi theo máu tác động lên tế bào ở xa.","c) Khe nối (gap junction) là cầu nối cho truyền tin tiếp xúc trực tiếp ở tế bào động vật.","d) Acetylcholine tại synapse thần kinh - cơ là ví dụ truyền tin qua synapse."],"type": "truefalse"},{"answer": "Khuếch đại tín hiệu","explain": "Chuỗi truyền tin với sự tham gia của chất truyền tin thứ hai giúp khuếch đại tín hiệu: một phân tử ban đầu tạo ra hàng loạt đáp ứng.","level": "VD","points": 0.5,"q": "Một phân tử adrenaline gắn vào thụ thể có thể dẫn đến giải phóng hàng nghìn phân tử glucose từ glycogen trong tế bào gan. Hiện tượng một tín hiệu nhỏ gây đáp ứng lớn này được gọi là gì?","type": "short"},{"answer": "Không đáp ứng","explain": "Không có thụ thể thì giai đoạn tiếp nhận không xảy ra, tín hiệu không được truyền vào tế bào nên tế bào không đáp ứng.","level": "VDC","points": 0.5,"q": "Một tế bào bị đột biến làm mất hoàn toàn thụ thể đặc hiệu của hormone X. Dự đoán khả năng đáp ứng của tế bào này khi gặp hormone X.","type": "short"}]},{"name": "Đề 2","questions": [{"answer": "A","explain": "Đáp ứng gồm: mở/đóng kênh ion, hoạt hóa enzyme, thay đổi hình dạng tế bào, biểu hiện gen.","level": "NB","options": ["A. mở kênh ion, hoạt hóa enzyme hoặc biểu hiện gen.","B. phân chia ngay lập tức trong mọi trường hợp.","C. chết theo chương trình trong mọi trường hợp.","D. ngừng mọi hoạt động trao đổi chất."],"points": 0.25,"q": "Đáp ứng của tế bào đích sau khi nhận tín hiệu có thể là","type": "mcq"},{"answer": "A","explain": "Hormone, chất dẫn truyền thần kinh, yếu tố sinh trưởng là các phân tử tín hiệu; cellulose, tinh bột, glycogen là chất dự trữ/cấu trúc.","level": "NB","options": ["A. Hormone.","B. Cellulose.","C. Tinh bột.","D. Glycogen."],"points": 0.25,"q": "Trong các phân tử sau, phân tử nào có thể đóng vai trò phân tử tín hiệu?","type": "mcq"},{"answer": "B","explain": "Tín hiệu không qua được màng thì gắn vào thụ thể trên màng sinh chất; tín hiệu tan trong lipid mới đi xuyên màng vào gắn thụ thể trong tế bào chất.","level": "NB","options": ["A. trong nhân tế bào.","B. trên màng sinh chất.","C. trong ti thể.","D. trong lục lạp."],"points": 0.25,"q": "Tín hiệu không đi qua được màng sinh chất (ví dụ hormone peptide) sẽ gắn vào thụ thể nằm ở","type": "mcq"},{"answer": "C","explain": "Cầu sinh chất là cầu nối giữa hai tế bào thực vật kề nhau, cho tín hiệu đi qua trực tiếp.","level": "TH","options": ["A. nội tiết.","B. cận tiết.","C. tiếp xúc trực tiếp.","D. tự tiết."],"points": 0.25,"q": "Cầu sinh chất (plasmodesmata) ở tế bào thực vật có vai trò trong kiểu truyền tin","type": "mcq"},{"answer": "B","explain": "Chất truyền tin thứ hai như cAMP giúp một phân tử tín hiệu ban đầu tạo ra hàng loạt phân tử đáp ứng.","level": "TH","options": ["A. Vì thụ thể trên màng rất nhiều.","B. Vì chuỗi truyền tin có bước khuếch đại nhờ chất truyền tin thứ hai.","C. Vì tín hiệu được nhân lên ở bên ngoài tế bào.","D. Vì tế bào tự sản sinh thêm phân tử tín hiệu."],"points": 0.25,"q": "Vì sao một tín hiệu ban đầu yếu vẫn có thể gây đáp ứng mạnh trong tế bào?","type": "mcq"},{"answer": "B","explain": "Có thêm thụ thể đặc hiệu thì tế bào mới đáp ứng được, chứng tỏ thụ thể quyết định tế bào nào đáp ứng với tín hiệu nào.","level": "VDC","options": ["A. hormone X tự đi vào tế bào mà không cần thụ thể.","B. thụ thể quyết định tính đáp ứng đặc hiệu của tế bào với tín hiệu.","C. mọi tế bào đều có sẵn mọi loại thụ thể.","D. hormone X không cần thụ thể để gây đáp ứng."],"points": 0.25,"q": "Người ta chuyển gen mã hóa thụ thể của hormone X vào một tế bào vốn không đáp ứng với X. Kết quả tế bào này bắt đầu đáp ứng với X. Thí nghiệm chứng tỏ","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: đáp ứng phụ thuộc loại thụ thể và con đường truyền tin của mỗi tế bào. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về thụ thể và các giai đoạn truyền tin:","statements": ["a) Thụ thể trên màng chỉ gắn với phân tử tín hiệu đặc hiệu của nó.","b) Mọi tế bào trong cơ thể đều đáp ứng giống nhau với cùng một hormone.","c) Giai đoạn truyền tin diễn ra bên trong tế bào đích.","d) Biểu hiện gen là một dạng đáp ứng của tế bào sau khi nhận tín hiệu."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: hormone steroid tan trong lipid, đi xuyên màng và gắn thụ thể trong tế bào chất. b) Đúng. c) Đúng: qua khe synapse hẹp nhanh hơn đi theo máu đường dài. d) Sai: tự tiết là tác động lên chính tế bào tiết ra nó.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về thụ thể, chất truyền tin thứ hai và các kiểu truyền tin:","statements": ["a) Hormone steroid gắn vào thụ thể trên màng sinh chất.","b) cAMP và ion Ca2+ là các chất truyền tin thứ hai.","c) Truyền tin qua synapse nhanh hơn truyền tin nội tiết.","d) Truyền tin tự tiết là tế bào gửi tín hiệu cho tế bào lân cận."],"type": "truefalse"},{"answer": "cAMP và Ca2+","explain": "cAMP và ion Ca2+ là hai chất truyền tin thứ hai phổ biến, giúp chuyển tiếp và khuếch đại tín hiệu trong tế bào.","level": "VD","points": 0.5,"q": "Kể tên hai chất truyền tin thứ hai phổ biến trong tế bào.","type": "short"},{"answer": "Chất đối kháng","explain": "Chất đối kháng cạnh tranh vị trí gắn trên thụ thể với phân tử tín hiệu thật nhưng không kích hoạt truyền tin, nên ngăn được đáp ứng.","level": "VDC","points": 0.5,"q": "Chất X gắn được vào thụ thể của hormone Y nhưng không kích hoạt chuỗi truyền tin, khiến hormone Y không còn gây đáp ứng. Chất X được gọi là chất gì?","type": "short"}]},{"name": "Đề 3","questions": [{"answer": "C","explain": "Thứ tự ba giai đoạn: tiếp nhận (tín hiệu gắn thụ thể), truyền tin (chuỗi phân tử trong tế bào), đáp ứng (tế bào thay đổi hoạt động).","level": "NB","options": ["A. Đáp ứng.","B. Truyền tin.","C. Tiếp nhận.","D. Khuếch đại."],"points": 0.25,"q": "Giai đoạn nào diễn ra đầu tiên trong quá trình truyền tin tế bào?","type": "mcq"},{"answer": "A","explain": "Acetylcholine được giải phóng vào khe synapse rồi gắn vào thụ thể trên tế bào đích (ví dụ tế bào cơ).","level": "NB","options": ["A. khe synapse.","B. trong máu.","C. trong nhân tế bào.","D. trên màng ti thể."],"points": 0.25,"q": "Chất dẫn truyền thần kinh acetylcholine được giải phóng tại","type": "mcq"},{"answer": "A","explain": "Tính đặc hiệu giữa thụ thể và phân tử tín hiệu đảm bảo tế bào chỉ đáp ứng với tín hiệu dành cho mình.","level": "NB","options": ["A. Mỗi thụ thể chỉ gắn đặc hiệu với một loại phân tử tín hiệu nhất định.","B. Mọi thụ thể đều nằm trong nhân tế bào.","C. Thụ thể tự tổng hợp phân tử tín hiệu.","D. Thụ thể có ở mọi tế bào với số lượng như nhau."],"points": 0.25,"q": "Phát biểu nào sau đây đúng về thụ thể?","type": "mcq"},{"answer": "B","explain": "Adrenaline báo hiệu cơ thể cần năng lượng khẩn cấp nên tế bào gan phân giải glycogen giải phóng glucose vào máu.","level": "TH","options": ["A. tổng hợp glycogen dự trữ.","B. phân giải glycogen thành glucose.","C. ngừng hô hấp tế bào.","D. phân chia tế bào ồ ạt."],"points": 0.25,"q": "Khi adrenaline gắn vào thụ thể trên tế bào gan, chuỗi truyền tin trong tế bào dẫn đến","type": "mcq"},{"answer": "B","explain": "Tín hiệu đi qua khe nối (gap junction) giữa các tế bào cơ tim kề nhau là truyền tin tiếp xúc trực tiếp.","level": "TH","options": ["A. Nội tiết.","B. Tiếp xúc trực tiếp.","C. Cận tiết.","D. Tự tiết."],"points": 0.25,"q": "Kiểu truyền tin nào giúp các tế bào cơ tim co bóp đồng bộ nhờ tín hiệu đi qua khe nối giữa các tế bào kề nhau?","type": "mcq"},{"answer": "B","explain": "Thuốc đóng vai trò chất chủ vận: gắn vào thụ thể và kích hoạt chuỗi truyền tin như tín hiệu thật.","level": "VDC","options": ["A. Ngăn hoàn toàn mọi đáp ứng của tế bào.","B. Kích hoạt đáp ứng giống như tín hiệu tự nhiên.","C. Phá hủy thụ thể trên màng.","D. Không gây tác dụng gì vì là chất lạ."],"points": 0.25,"q": "Một loại thuốc được thiết kế để bắt chước phân tử tín hiệu tự nhiên và gắn vào đúng thụ thể của nó. Dự đoán tác dụng của thuốc này:","type": "mcq"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: nhiều tín hiệu chỉ gắn thụ thể trên màng, thông tin được truyền tiếp vào trong. c) Đúng. d) Sai: tế bào thực vật cũng truyền tin, ví dụ auxin, qua cầu sinh chất.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về các giai đoạn và kiểu truyền tin:","statements": ["a) Truyền tin tế bào gồm ba giai đoạn: tiếp nhận, truyền tin, đáp ứng.","b) Phân tử tín hiệu luôn phải đi vào trong tế bào mới gây được đáp ứng.","c) Insulin là hormone, ví dụ của truyền tin nội tiết.","d) Tế bào thực vật không có truyền tin tế bào."],"type": "truefalse"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: đáp ứng phụ thuộc thụ thể và con đường truyền tin riêng của mỗi tế bào. c) Đúng. d) Đúng: không tiếp nhận được thì không có đáp ứng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về tính đặc hiệu và khuếch đại tín hiệu:","statements": ["a) Một tế bào có thể vừa tiết tín hiệu vừa là tế bào đích của tín hiệu khác.","b) Cùng một phân tử tín hiệu luôn gây đáp ứng giống nhau ở mọi tế bào đích.","c) Chất truyền tin thứ hai được tạo ra ở giai đoạn truyền tin.","d) Phá hủy thụ thể làm tế bào mất khả năng đáp ứng với tín hiệu tương ứng."],"type": "truefalse"},{"answer": "Nội tiết","explain": "Hormone đi theo máu đến tế bào đích ở xa là truyền tin nội tiết.","level": "VD","points": 0.5,"q": "Insulin do tuyến tụy tiết vào máu rồi đến điều hòa đường huyết ở gan và cơ. Đây là kiểu truyền tin nào?","type": "short"},{"answer": "Tự tiết","explain": "Tế bào tiết tín hiệu tác động lên chính nó là truyền tin tự tiết.","level": "VDC","points": 0.5,"q": "Tế bào ung thư tiết yếu tố sinh trưởng kích thích chính nó phân chia liên tục. Đây là kiểu truyền tin nào?","type": "short"}]},{"name": "Đề 4","questions": [{"answer": "D","explain": "Ba giai đoạn nối tiếp: tiếp nhận, truyền tin, đáp ứng.","level": "NB","options": ["A. 2","B. 4","C. 5","D. 3"],"points": 0.25,"q": "Quá trình truyền tin tế bào gồm bao nhiêu giai đoạn?","type": "mcq"},{"answer": "C","explain": "Thụ thể có thể nằm trên màng sinh chất hoặc trong tế bào chất/nhân tùy loại tín hiệu.","level": "NB","options": ["A. trong ti thể.","B. trong lục lạp.","C. trên màng sinh chất hoặc trong tế bào chất.","D. trong thành tế bào."],"points": 0.25,"q": "Thụ thể của tế bào có thể nằm ở","type": "mcq"},{"answer": "B","explain": "Phối tử (ligand) là tên gọi khác của phân tử tín hiệu.","level": "NB","options": ["A. enzyme.","B. phối tử (ligand).","C. hormone duy nhất.","D. kháng nguyên."],"points": 0.25,"q": "Phân tử tín hiệu còn được gọi là","type": "mcq"},{"answer": "A","explain": "Yếu tố sinh trưởng tác động lên tế bào lân cận là truyền tin cận tiết.","level": "TH","options": ["A. cận tiết.","B. nội tiết.","C. tự tiết.","D. qua synapse."],"points": 0.25,"q": "Yếu tố sinh trưởng do một tế bào tiết ra kích thích các tế bào xung quanh phân chia. Đây là kiểu truyền tin","type": "mcq"},{"answer": "D","explain": "Tín hiệu nội tiết đi theo máu đường dài nên chậm; tín hiệu qua synapse chỉ qua khe hẹp nên rất nhanh.","level": "TH","options": ["A. nội tiết nhanh hơn qua synapse.","B. hai kiểu nhanh như nhau.","C. cận tiết là nhanh nhất.","D. qua synapse nhanh hơn nội tiết."],"points": 0.25,"q": "So sánh tốc độ của truyền tin nội tiết và truyền tin qua synapse:","type": "mcq"},{"answer": "A","explain": "Khuếch đại làm đáp ứng mạnh dần qua các bước, nếu không tắt kịp thời có thể gây đáp ứng quá mức; tế bào có cơ chế phản hồi để dừng.","level": "VDC","options": ["A. Cơ thể cần cơ chế tắt tín hiệu kịp thời để tránh đáp ứng quá mức.","B. Khuếch đại tín hiệu là có hại và cần loại bỏ.","C. Tế bào không bao giờ cần tắt tín hiệu.","D. Đáp ứng quá mức không bao giờ xảy ra."],"points": 0.25,"q": "Nhờ khuếch đại, một tín hiệu nhỏ tạo đáp ứng rất lớn trong tế bào. Điều này gợi ý","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng: ví dụ mở kênh ion. c) Sai: truyền tin diễn ra giữa các tế bào của cùng một cơ thể đa bào, không phải giữa các loài. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về giai đoạn tiếp nhận và thụ thể:","statements": ["a) Giai đoạn tiếp nhận xảy ra khi phân tử tín hiệu gắn vào thụ thể.","b) Đáp ứng của tế bào có thể là mở kênh ion trên màng.","c) Truyền tin tế bào chỉ xảy ra giữa các tế bào của hai loài khác nhau.","d) Thụ thể quyết định tế bào nào sẽ đáp ứng với tín hiệu nào."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng: gap junction nối trực tiếp tế bào chất hai tế bào. b) Đúng. c) Sai: tự tiết là tác động lên chính mình. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về các kiểu truyền tin:","statements": ["a) Khe nối cho phép ion và phân tử nhỏ đi trực tiếp giữa hai tế bào kề nhau.","b) Hormone đi theo máu nên tác động được lên tế bào đích ở xa.","c) Truyền tin tự tiết là tín hiệu tác động lên tế bào lân cận.","d) Chất dẫn truyền thần kinh đi qua khe synapse tới tế bào đích."],"type": "truefalse"},{"answer": "Tiếp nhận","explain": "Tiếp nhận là giai đoạn đầu tiên: phân tử tín hiệu gắn vào thụ thể đặc hiệu.","level": "VD","points": 0.5,"q": "Giai đoạn nào của truyền tin tế bào diễn ra đầu tiên?","type": "short"},{"answer": "3","explain": "Ba giai đoạn: tiếp nhận, truyền tin, đáp ứng.","level": "VDC","points": 0.5,"q": "Quá trình truyền tin tế bào gồm mấy giai đoạn? (trả lời bằng số)","type": "short"}]},{"name": "Đề 5","questions": [{"answer": "B","explain": "Nhờ tính đặc hiệu của thụ thể, mỗi tế bào chỉ đáp ứng với tín hiệu dành cho mình.","level": "NB","options": ["A. tế bào phân chia nhanh.","B. tế bào chỉ đáp ứng với tín hiệu đặc hiệu dành cho mình.","C. tín hiệu lan truyền khắp cơ thể.","D. mọi tế bào đều giống nhau."],"points": 0.25,"q": "Ý nghĩa của tính đặc hiệu giữa thụ thể và phân tử tín hiệu là","type": "mcq"},{"answer": "D","explain": "Khuếch đại tín hiệu là vai trò của chuỗi truyền tin với chất truyền tin thứ hai.","level": "NB","options": ["A. Tiếp nhận.","B. Đáp ứng.","C. Tiết tín hiệu.","D. Khuếch đại tín hiệu."],"points": 0.25,"q": "Một phân tử tín hiệu ban đầu tạo ra hàng nghìn phân tử đáp ứng trong tế bào. Hiện tượng này thể hiện vai trò nào của giai đoạn truyền tin?","type": "mcq"},{"answer": "A","explain": "Adrenaline là hormone tuyến thượng thận, đi theo máu: truyền tin nội tiết.","level": "NB","options": ["A. nội tiết.","B. cận tiết.","C. tự tiết.","D. tiếp xúc trực tiếp."],"points": 0.25,"q": "Adrenaline do tuyến thượng thận tiết vào máu làm tim đập nhanh khi gặp nguy hiểm. Đây là kiểu truyền tin","type": "mcq"},{"answer": "C","explain": "Auxin là hormone thực vật, vận chuyển đến chồi bên ở gần: cận tiết.","level": "TH","options": ["A. nội tiết.","B. qua synapse.","C. cận tiết.","D. tiếp xúc trực tiếp."],"points": 0.25,"q": "Auxin do chồi ngọn tiết ra ức chế sự phát triển của các chồi bên ở gần. Đây là kiểu truyền tin","type": "mcq"},{"answer": "B","explain": "Hormone steroid tan trong lipid nên đi xuyên màng, gắn thụ thể trong tế bào chất/nhân.","level": "TH","options": ["A. Vì thụ thể của nó nằm trên màng.","B. Vì nó tan trong lipid nên đi xuyên qua màng sinh chất.","C. Vì nó được vận chuyển chủ động vào tế bào.","D. Vì màng tế bào có kênh dành riêng cho nó."],"points": 0.25,"q": "Vì sao hormone steroid có thể gắn vào thụ thể nằm trong tế bào chất?","type": "mcq"},{"answer": "C","explain": "Tín hiệu chỉ qua khe synapse hẹp trong phần nghìn giây, còn hormone phải đi theo máu khắp cơ thể.","level": "VDC","options": ["A. Vì chất dẫn truyền thần kinh mạnh hơn hormone.","B. Vì synapse có nhiều thụ thể hơn.","C. Vì tín hiệu chỉ đi qua khe synapse hẹp, còn hormone phải theo máu đi đường dài.","D. Vì tế bào thần kinh to hơn tế bào nội tiết."],"points": 0.25,"q": "Phản xạ rụt tay khi chạm vật nóng xảy ra trong tích tắc, nhanh hơn nhiều so với tác dụng của hormone. Nguyên nhân là","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: tín hiệu tan trong lipid gắn thụ thể trong tế bào chất. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về thụ thể và chất truyền tin thứ hai:","statements": ["a) Thụ thể trên màng sinh chất đón nhận tín hiệu không đi qua được màng.","b) Mọi phân tử tín hiệu đều gắn vào thụ thể trên màng sinh chất.","c) Sau khi nhận tín hiệu, tế bào có thể thay đổi biểu hiện gen.","d) Truyền tin tế bào giúp duy trì cân bằng nội môi của cơ thể."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: insulin đi theo máu là nội tiết. b) Đúng. c) Đúng. d) Sai: cận tiết tác động lên tế bào lân cận, không qua máu.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về insulin và các kiểu truyền tin:","statements": ["a) Insulin là ví dụ của truyền tin cận tiết.","b) Tế bào đích phải có thụ thể đặc hiệu mới đáp ứng được với tín hiệu.","c) Khuếch đại tín hiệu giúp đáp ứng mạnh từ tín hiệu ban đầu yếu.","d) Truyền tin cận tiết là tín hiệu đi theo máu đến tế bào ở xa."],"type": "truefalse"},{"answer": "Cầu sinh chất","explain": "Cầu sinh chất (plasmodesmata) là cầu nối cho truyền tin tiếp xúc trực tiếp ở tế bào thực vật.","level": "VD","points": 0.5,"q": "Kể tên cầu nối giúp truyền tin tiếp xúc trực tiếp ở tế bào thực vật.","type": "short"},{"answer": "Acetylcholine","explain": "Acetylcholine là chất dẫn truyền thần kinh tại synapse thần kinh - cơ.","level": "VDC","points": 0.5,"q": "Chất dẫn truyền thần kinh tại synapse giữa neuron vận động và tế bào cơ là chất nào?","type": "short"}]},{"name": "Đề 6","questions": [{"answer": "C","explain": "Thụ thể là protein đặc hiệu nhận biết phân tử tín hiệu.","level": "NB","options": ["A. enzyme phân giải tín hiệu.","B. kênh vận chuyển glucose.","C. protein đặc hiệu nhận biết phân tử tín hiệu.","D. phân tử tín hiệu thứ hai."],"points": 0.25,"q": "Thụ thể trong truyền tin tế bào bản chất là","type": "mcq"},{"answer": "A","explain": "Tế bào đích là tế bào có thụ thể đặc hiệu và đáp ứng với tín hiệu.","level": "NB","options": ["A. tế bào có thụ thể đặc hiệu và đáp ứng với tín hiệu.","B. tế bào tiết ra phân tử tín hiệu.","C. mọi tế bào trong cơ thể.","D. tế bào đang phân chia."],"points": 0.25,"q": "Tế bào đích trong truyền tin tế bào là","type": "mcq"},{"answer": "D","explain": "Hormone, chất dẫn truyền thần kinh, yếu tố sinh trưởng đều là phân tử tín hiệu.","level": "NB","options": ["A. hormone.","B. chất dẫn truyền thần kinh.","C. yếu tố sinh trưởng.","D. tất cả các phân tử trên."],"points": 0.25,"q": "Phân tử nào sau đây có thể là phân tử tín hiệu?","type": "mcq"},{"answer": "B","explain": "Đường huyết tăng kích thích tụy tiết insulin: tín hiệu nội tiết giúp ổn định đường huyết.","level": "TH","options": ["A. Tế bào tụy tự phân chia.","B. Duy trì đường huyết ổn định.","C. Tăng tiết glucagon liên tục.","D. Ức chế mọi hoạt động của gan."],"points": 0.25,"q": "Khi đường huyết tăng, tuyến tụy tiết insulin làm đường huyết giảm về mức bình thường. Vai trò của truyền tin trong trường hợp này là","type": "mcq"},{"answer": "A","explain": "Chất truyền tin thứ hai (cAMP, Ca2+) được tạo ra ở giai đoạn truyền tin, sau tiếp nhận.","level": "TH","options": ["A. truyền tin.","B. tiếp nhận.","C. đáp ứng.","D. tiết tín hiệu."],"points": 0.25,"q": "Chất truyền tin thứ hai được tạo ra ở giai đoạn nào?","type": "mcq"},{"answer": "D","explain": "Thụ thể hỏng thì giai đoạn tiếp nhận không xảy ra, toàn bộ quá trình truyền tin bị chặn đứng.","level": "VDC","options": ["A. Tế bào vẫn đáp ứng bình thường.","B. Tín hiệu đi vào tế bào bằng con đường khác.","C. Tế bào tự tạo ra tín hiệu mới.","D. Tế bào không tiếp nhận được tín hiệu nên không có đáp ứng."],"points": 0.25,"q": "Một tế bào có thụ thể bị biến đổi cấu trúc, không còn gắn được với phân tử tín hiệu. Dự đoán điều gì xảy ra?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: đáp ứng rất đa dạng tùy tế bào. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về phân tử tín hiệu và tế bào đích:","statements": ["a) Phân tử tín hiệu được tế bào tiết ra vào môi trường xung quanh.","b) Tế bào đích nhận tín hiệu nhờ thụ thể đặc hiệu.","c) Mọi đáp ứng của tế bào sau khi nhận tín hiệu đều là phân chia tế bào.","d) Cùng một tín hiệu có thể gây đáp ứng khác nhau ở các tế bào khác nhau."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng: ion Ca2+ là chất truyền tin thứ hai. b) Sai: đó là truyền tin qua synapse. c) Đúng. d) Sai: tiếp xúc trực tiếp qua cầu nối giữa hai tế bào kề nhau, không qua máu.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về chất truyền tin thứ hai và kiểu truyền tin:","statements": ["a) Ion Ca2+ có thể đóng vai trò chất truyền tin thứ hai.","b) Acetylcholine đi theo máu đến cơ là truyền tin nội tiết.","c) Tín hiệu yếu được khuếch đại thành đáp ứng mạnh trong tế bào.","d) Truyền tin tiếp xúc trực tiếp là tín hiệu đi theo máu giữa hai tế bào kề nhau."],"type": "truefalse"},{"answer": "Đáp ứng","explain": "Đáp ứng là giai đoạn cuối cùng: tế bào thay đổi hoạt động.","level": "VD","points": 0.5,"q": "Giai đoạn cuối cùng của quá trình truyền tin tế bào là gì?","type": "short"},{"answer": "Thụ thể","explain": "Thụ thể hỏng thì tế bào không tiếp nhận được tín hiệu, toàn bộ quá trình bị chặn đứng.","level": "VDC","points": 0.5,"q": "Thành phần nào của tế bào đích bị hỏng sẽ làm toàn bộ quá trình truyền tin bị chặn đứng ngay từ đầu?","type": "short"}]},{"name": "Đề 7","questions": [{"answer": "A","explain": "Đáp ứng là giai đoạn tế bào thay đổi hoạt động sau khi nhận và truyền tín hiệu.","level": "NB","options": ["A. đáp ứng.","B. tiếp nhận.","C. truyền tin.","D. tiết tín hiệu."],"points": 0.25,"q": "Mở kênh ion, hoạt hóa enzyme, biểu hiện gen là các hoạt động thuộc giai đoạn nào?","type": "mcq"},{"answer": "B","explain": "Tín hiệu chỉ gắn được với thụ thể đặc hiệu của nó.","level": "NB","options": ["A. mọi thụ thể trên màng.","B. thụ thể đặc hiệu của nó.","C. bất kì protein màng nào.","D. trực tiếp vào nhân tế bào."],"points": 0.25,"q": "Phân tử tín hiệu chỉ gắn được với","type": "mcq"},{"answer": "C","explain": "Nội tiết: hormone theo máu đến tế bào đích ở xa.","level": "NB","options": ["A. cận tiết.","B. tự tiết.","C. nội tiết.","D. tiếp xúc trực tiếp."],"points": 0.25,"q": "Hormone sinh dục do tuyến sinh dục tiết vào máu tác động lên nhiều cơ quan ở xa thuộc kiểu truyền tin","type": "mcq"},{"answer": "D","explain": "Khuếch đại xảy ra ở giai đoạn truyền tin nhờ chuỗi phân tử và chất truyền tin thứ hai.","level": "TH","options": ["A. tiếp nhận.","B. đáp ứng.","C. tiết tín hiệu.","D. truyền tin."],"points": 0.25,"q": "Hiện tượng khuếch đại tín hiệu diễn ra chủ yếu ở giai đoạn nào?","type": "mcq"},{"answer": "A","explain": "Tín hiệu nội tiết đi theo máu nên chậm và kéo dài; tín hiệu synapse qua khe hẹp nên rất nhanh.","level": "TH","options": ["A. Chậm nhưng kéo dài.","B. Nhanh nhưng ngắn.","C. Nhanh và kéo dài.","D. Không gây đáp ứng."],"points": 0.25,"q": "So với truyền tin qua synapse, tác dụng của truyền tin nội tiết thường","type": "mcq"},{"answer": "C","explain": "Thụ thể hỏng ở một số tế bào thì chỉ những tế bào đó không đáp ứng; các tế bào khác có thụ thể bình thường vẫn đáp ứng.","level": "VDC","options": ["A. Mọi tế bào đều mất đáp ứng.","B. Tín hiệu tự tìm đường khác vào tế bào.","C. Chỉ những tế bào có thụ thể hỏng mất đáp ứng, các tế bào khác vẫn đáp ứng.","D. Cơ thể ngừng tiết tín hiệu."],"points": 0.25,"q": "Một đột biến làm hỏng thụ thể của hormone X ở một số tế bào. Dự đoán ảnh hưởng:","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: nhiều tín hiệu gắn thụ thể trên màng, không cần vào trong. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về trình tự các giai đoạn:","statements": ["a) Truyền tin tế bào diễn ra theo trình tự: tiếp nhận, truyền tin, đáp ứng.","b) Mọi phân tử tín hiệu đều phải đi vào trong tế bào.","c) Chất truyền tin thứ hai giúp chuyển tiếp tín hiệu trong tế bào.","d) Tế bào không có thụ thể đặc hiệu sẽ không đáp ứng với tín hiệu đó."],"type": "truefalse"},{"answer": ["F","T","T","T"],"explain": "a) Sai: auxin tác động lên chồi bên ở gần là cận tiết. b) Đúng. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về auxin và khuếch đại tín hiệu:","statements": ["a) Auxin từ chồi ngọn ức chế chồi bên ở gần là truyền tin nội tiết.","b) Khe nối ở tế bào động vật tương ứng với cầu sinh chất ở tế bào thực vật.","c) Một tín hiệu nhỏ có thể gây đáp ứng lớn nhờ khuếch đại.","d) Đáp ứng của tế bào có thể là thay đổi biểu hiện gen."],"type": "truefalse"},{"answer": "Truyền tin","explain": "Chất truyền tin thứ hai (cAMP, Ca2+) được tạo ra ở giai đoạn truyền tin.","level": "VD","points": 0.5,"q": "cAMP được tạo ra ở giai đoạn nào của quá trình truyền tin tế bào?","type": "short"},{"answer": "Nội tiết","explain": "Đi theo máu đến tế bào đích ở xa là truyền tin nội tiết.","level": "VDC","points": 0.5,"q": "Tuyến giáp tiết thyroxine vào máu điều hòa trao đổi chất khắp cơ thể. Đây là kiểu truyền tin nào?","type": "short"}]},{"name": "Đề 8","questions": [{"answer": "D","explain": "Tín hiệu từ môi trường (ánh sáng, nhiệt độ...) cũng được tế bào tiếp nhận và đáp ứng.","level": "NB","options": ["A. từ tế bào khác.","B. từ hormone.","C. từ chất dẫn truyền thần kinh.","D. từ tế bào khác hoặc từ môi trường."],"points": 0.25,"q": "Tín hiệu trong truyền tin tế bào có thể đến","type": "mcq"},{"answer": "A","explain": "Tiếp nhận: tín hiệu gắn thụ thể; truyền tin: chuỗi phân tử trong tế bào; đáp ứng: thay đổi hoạt động.","level": "NB","options": ["A. tiếp nhận - truyền tin - đáp ứng.","B. truyền tin - tiếp nhận - đáp ứng.","C. đáp ứng - tiếp nhận - truyền tin.","D. tiếp nhận - đáp ứng - truyền tin."],"points": 0.25,"q": "Trình tự đúng các giai đoạn truyền tin tế bào là","type": "mcq"},{"answer": "B","explain": "Tự tiết: tế bào tiết tín hiệu tác động lên chính nó.","level": "NB","options": ["A. nội tiết.","B. tự tiết.","C. cận tiết.","D. qua synapse."],"points": 0.25,"q": "Tế bào tiết ra tín hiệu rồi chính nó đáp ứng với tín hiệu đó thuộc kiểu truyền tin","type": "mcq"},{"answer": "C","explain": "Tế bào cơ tim nối với nhau bằng khe nối, tín hiệu truyền trực tiếp giúp co bóp đồng bộ.","level": "TH","options": ["A. nội tiết.","B. cận tiết.","C. tiếp xúc trực tiếp.","D. qua synapse."],"points": 0.25,"q": "Tín hiệu giúp các tế bào cơ tim co bóp đồng bộ được truyền qua khe nối giữa các tế bào kề nhau. Đây là kiểu truyền tin","type": "mcq"},{"answer": "B","explain": "Không có thụ thể đặc hiệu thì không có tiếp nhận, không có đáp ứng.","level": "TH","options": ["A. Tế bào vẫn đáp ứng bình thường.","B. Tế bào không đáp ứng với tín hiệu đó.","C. Tế bào tự tổng hợp thụ thể mới ngay lập tức.","D. Tín hiệu chuyển sang tế bào khác."],"points": 0.25,"q": "Một tế bào không có thụ thể đặc hiệu với hormone X thì khi gặp hormone X sẽ","type": "mcq"},{"answer": "A","explain": "Chất chủ vận gắn thụ thể và kích hoạt truyền tin như tín hiệu thật; chất đối kháng gắn nhưng chặn truyền tin.","level": "VDC","options": ["A. Chất chủ vận kích hoạt đáp ứng, chất đối kháng ngăn đáp ứng.","B. Cả hai đều phá hủy thụ thể.","C. Cả hai đều không gắn được vào thụ thể.","D. Chất đối kháng kích hoạt đáp ứng mạnh hơn."],"points": 0.25,"q": "Thuốc chủ vận (agonist) và thuốc đối kháng (antagonist) đều gắn vào thụ thể của tín hiệu. Phân biệt tác dụng của chúng:","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng: ví dụ mở kênh ion. c) Sai: thụ thể hỏng thì không tiếp nhận được. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về đáp ứng và truyền tin cận tiết:","statements": ["a) Phân tử tín hiệu và thụ thể có tính đặc hiệu với nhau.","b) Đáp ứng của tế bào có thể là đóng hoặc mở kênh ion.","c) Tế bào có thụ thể hỏng vẫn đáp ứng bình thường với tín hiệu.","d) Truyền tin cận tiết tác động lên tế bào lân cận."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: steroid tan trong lipid, gắn thụ thể trong tế bào chất. c) Đúng. d) Sai: tự tiết là tác động lên chính mình.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về hormone và kiểu tự tiết:","statements": ["a) Hormone peptide gắn vào thụ thể trên màng sinh chất.","b) Hormone steroid gắn vào thụ thể trên màng sinh chất.","c) Khuếch đại tín hiệu diễn ra ở giai đoạn truyền tin.","d) Tế bào ung thư tự kích thích mình phân chia là truyền tin cận tiết."],"type": "truefalse"},{"answer": "Khe nối","explain": "Khe nối (gap junction) là cầu nối cho truyền tin tiếp xúc trực tiếp ở tế bào động vật.","level": "VD","points": 0.5,"q": "Cầu nối giúp truyền tin tiếp xúc trực tiếp giữa các tế bào động vật kề nhau có tên là gì?","type": "short"},{"answer": "Đặc hiệu","explain": "Thụ thể chỉ gắn với phân tử tín hiệu đặc hiệu của nó.","level": "VDC","points": 0.5,"q": "Tính chất nào của thụ thể đảm bảo tế bào chỉ đáp ứng với đúng tín hiệu dành cho mình? (trả lời 1 từ)","type": "short"}]},{"name": "Đề 9","questions": [{"answer": "B","explain": "Giai đoạn truyền tin chuyển tiếp thông tin từ thụ thể vào sâu trong tế bào.","level": "NB","options": ["A. tiếp nhận.","B. truyền tin.","C. đáp ứng.","D. tiết tín hiệu."],"points": 0.25,"q": "Chuỗi các phân tử chuyển tiếp thông tin từ thụ thể vào trong tế bào thuộc giai đoạn","type": "mcq"},{"answer": "D","explain": "Chất truyền tin thứ hai (cAMP, Ca2+) hoạt động bên trong tế bào ở giai đoạn truyền tin.","level": "NB","options": ["A. hormone trong máu.","B. chất dẫn truyền ở khe synapse.","C. phân tử tín hiệu ban đầu.","D. chất truyền tin thứ hai."],"points": 0.25,"q": "cAMP và ion Ca2+ được xếp vào nhóm","type": "mcq"},{"answer": "A","explain": "Khe synapse là khoảng hẹp giữa neuron và tế bào đích.","level": "NB","options": ["A. qua synapse.","B. nội tiết.","C. cận tiết.","D. tự tiết."],"points": 0.25,"q": "Chất dẫn truyền thần kinh đi qua khe hẹp giữa neuron và tế bào cơ thuộc kiểu truyền tin","type": "mcq"},{"answer": "B","explain": "Glucagon báo cạn năng lượng nên gan phân giải glycogen; sau ăn, insulin báo dư năng lượng nên gan tổng hợp glycogen dự trữ.","level": "TH","options": ["A. Cả hai đều kích thích phân giải glycogen.","B. Glucagon kích thích phân giải glycogen, insulin kích thích tổng hợp glycogen.","C. Cả hai đều kích thích tổng hợp glycogen.","D. Glucagon kích thích tổng hợp glycogen, insulin kích thích phân giải."],"points": 0.25,"q": "Glucagon và insulin đều tác động lên tế bào gan nhưng gây đáp ứng ngược nhau. Giải thích đúng là","type": "mcq"},{"answer": "D","explain": "Tín hiệu nội tiết đi theo máu đến mọi nơi có tế bào đích, tác dụng chậm và kéo dài.","level": "TH","options": ["A. nhanh và ngắn.","B. chỉ tác dụng tại chỗ.","C. cần tiếp xúc trực tiếp.","D. chậm nhưng kéo dài và tác động rộng."],"points": 0.25,"q": "Đặc điểm tác dụng của hormone (truyền tin nội tiết) là","type": "mcq"},{"answer": "B","explain": "Tín hiệu thật gắn thụ thể kích hoạt đáp ứng; chất đối kháng chiếm chỗ thụ thể nhưng không kích hoạt, nên đáp ứng bị ngăn.","level": "VDC","options": ["A. Tăng số lượng thụ thể trên màng.","B. Cạnh tranh vị trí gắn trên thụ thể với tín hiệu thật nhưng không kích hoạt truyền tin.","C. Phá hủy phân tử tín hiệu trong máu.","D. Kích hoạt đáp ứng mạnh hơn tín hiệu thật."],"points": 0.25,"q": "Cơ chế của chất đối kháng thụ thể (antagonist) là","type": "mcq"},{"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng: khuếch đại qua chất truyền tin thứ hai. d) Sai: đáp ứng có thể chỉ là thay đổi hoạt động, không nhất thiết phân chia.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về ba giai đoạn truyền tin:","statements": ["a) Tiếp nhận là giai đoạn phân tử tín hiệu gắn vào thụ thể.","b) Truyền tin là giai đoạn chuyển tiếp thông tin trong tế bào.","c) Một tín hiệu ban đầu có thể tạo ra nhiều phân tử đáp ứng.","d) Mọi đáp ứng của tế bào đều là phân chia tế bào."],"type": "truefalse"},{"answer": ["F","T","F","T"],"explain": "a) Sai: tế bào cơ tim dùng khe nối là tiếp xúc trực tiếp. b) Đúng. c) Sai: đó là tự tiết. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về khe nối và cầu sinh chất:","statements": ["a) Tế bào cơ tim co bóp đồng bộ nhờ truyền tin nội tiết.","b) Cầu sinh chất giúp truyền tin giữa các tế bào thực vật kề nhau.","c) Tế bào tiết tín hiệu kích thích chính nó là truyền tin cận tiết.","d) Phản xạ nhanh của cơ thể chủ yếu dùng truyền tin qua synapse."],"type": "truefalse"},{"answer": "5","explain": "Năm kiểu: nội tiết, cận tiết, tự tiết, tiếp xúc trực tiếp, qua synapse.","level": "VD","points": 0.5,"q": "Có bao nhiêu kiểu truyền tin tế bào được học trong bài? (trả lời bằng số)","type": "short"},{"answer": "Qua synapse","explain": "Phản xạ rụt tay dùng truyền tin qua synapse: tín hiệu chỉ qua khe hẹp nên rất nhanh.","level": "VDC","points": 0.5,"q": "Phản xạ rụt tay khi chạm phải vật nóng chủ yếu dùng kiểu truyền tin nào?","type": "short"}]},{"name": "Đề 10","questions": [{"answer": "C","explain": "Ion Ca2+ là chất truyền tin thứ hai phổ biến bên trong tế bào.","level": "NB","options": ["A. hormone.","B. acetylcholine.","C. ion Ca2+.","D. auxin."],"points": 0.25,"q": "Phân tử nào sau đây là chất truyền tin thứ hai?","type": "mcq"},{"answer": "A","explain": "Thụ thể hỏng thì không tiếp nhận được tín hiệu.","level": "NB","options": ["A. tế bào không tiếp nhận được tín hiệu.","B. tín hiệu mạnh lên gấp đôi.","C. tế bào tự tạo tín hiệu mới.","D. thụ thể khác thay thế ngay."],"points": 0.25,"q": "Nếu thụ thể của tế bào bị phá hủy thì","type": "mcq"},{"answer": "B","explain": "Cận tiết: tín hiệu tác động lên tế bào lân cận.","level": "NB","options": ["A. nội tiết.","B. cận tiết.","C. tự tiết.","D. qua synapse."],"points": 0.25,"q": "Tín hiệu tác động lên các tế bào nằm ngay bên cạnh tế bào tiết thuộc kiểu truyền tin","type": "mcq"},{"answer": "A","explain": "Tín hiệu thật: gắn và kích hoạt; chất đối kháng: gắn nhưng chặn.","level": "TH","options": ["A. Tín hiệu thật kích hoạt đáp ứng, chất đối kháng ngăn đáp ứng.","B. Cả hai đều kích hoạt đáp ứng như nhau.","C. Cả hai đều ngăn đáp ứng.","D. Chất đối kháng phá hủy tín hiệu thật."],"points": 0.25,"q": "Phân biệt tác dụng của phân tử tín hiệu thật và chất đối kháng thụ thể:","type": "mcq"},{"answer": "C","explain": "Cùng thụ thể nhưng chuỗi truyền tin trong mỗi tế bào khác nhau nên đáp ứng khác nhau.","level": "TH","options": ["A. Vì tín hiệu ở gan mạnh hơn ở cơ.","B. Vì gan to hơn cơ.","C. Vì chuỗi truyền tin bên trong mỗi loại tế bào khác nhau.","D. Vì thụ thể ở gan và cơ hoàn toàn khác nhau."],"points": 0.25,"q": "Cùng một hormone nhưng tế bào gan và tế bào cơ đáp ứng khác nhau. Nguyên nhân sâu xa là","type": "mcq"},{"answer": "D","explain": "Mất thụ thể ở tế bào đích làm đứt giai đoạn tiếp nhận, toàn bộ quá trình truyền tin ở tế bào đó bị chặn.","level": "VDC","options": ["A. Giai đoạn truyền tin vẫn diễn ra bình thường.","B. Tế bào tự tổng hợp thụ thể mới ngay lập tức.","C. Tín hiệu đi vào tế bào bằng con đường khác.","D. Giai đoạn tiếp nhận không xảy ra nên không có đáp ứng."],"points": 0.25,"q": "Bệnh nhân mất thụ thể của một loại hormone do đột biến gen. Giải thích vì sao việc tiêm thêm hormone đó không có tác dụng:","type": "mcq"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: thụ thể chỉ gắn tín hiệu đặc hiệu. c) Đúng. d) Sai: tự tiết là tác động lên chính mình.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về thụ thể và khuếch đại tín hiệu:","statements": ["a) Mỗi kiểu truyền tin phù hợp với một nhu cầu đáp ứng khác nhau của cơ thể.","b) Thụ thể có thể gắn với nhiều loại tín hiệu khác nhau.","c) Khuếch đại tín hiệu giúp tế bào đáp ứng mạnh với tín hiệu yếu.","d) Truyền tin tự tiết là tín hiệu từ tế bào này sang tế bào khác."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: nội tiết đi theo máu nên chậm hơn synapse. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về insulin, auxin và tế bào đích:","statements": ["a) Insulin và glucagon đều là ví dụ truyền tin nội tiết.","b) Auxin ở thực vật là ví dụ truyền tin bằng hormone.","c) Truyền tin nội tiết nhanh hơn truyền tin qua synapse.","d) Tế bào đích không có thụ thể đặc hiệu thì không đáp ứng."],"type": "truefalse"},{"answer": "Tiếp nhận, truyền tin, đáp ứng","explain": "Ba giai đoạn theo đúng thứ tự: tiếp nhận, truyền tin, đáp ứng.","level": "VD","points": 0.5,"q": "Kể tên ba giai đoạn của quá trình truyền tin tế bào theo đúng thứ tự.","type": "short"},{"answer": "Insulin","explain": "Insulin do tuyến tụy tiết vào máu điều hòa đường huyết là hormone nội tiết.","level": "VDC","points": 0.5,"q": "Hormone nào do tuyến tụy tiết ra khi đường huyết tăng để đưa đường huyết về mức bình thường?","type": "short"}]}]}
