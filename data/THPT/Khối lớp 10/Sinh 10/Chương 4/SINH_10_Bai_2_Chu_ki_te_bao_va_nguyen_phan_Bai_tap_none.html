{"sets": [{"name": "Đề 1","questions": [{"answer": "B","explain": "Chu kì tế bào là khoảng thời gian từ khi tế bào được sinh ra, lớn lên và phân chia thành hai tế bào con.","level": "NB","options": ["A. từ khi tế bào chết đến khi được thay thế.","B. từ khi tế bào được sinh ra, lớn lên và phân chia thành hai tế bào con.","C. từ pha G1 đến pha G2.","D. từ kì đầu đến kì cuối của nguyên phân."],"points": 0.25,"q": "Chu kì tế bào là khoảng thời gian","type": "mcq"},{"answer": "C","explain": "Kì trung gian gồm 3 pha: G1, S, G2.","level": "NB","options": ["A. G1, G2, M.","B. S, M, G0.","C. G1, S, G2.","D. G1, S, M."],"points": 0.25,"q": "Kì trung gian gồm các pha nào sau đây?","type": "mcq"},{"answer": "B","explain": "Pha S diễn ra sự nhân đôi ADN, NST nhân đôi thành NST kép.","level": "NB","options": ["A. Pha G1.","B. Pha S.","C. Pha G2.","D. Pha M."],"points": 0.25,"q": "Sự nhân đôi ADN diễn ra ở pha nào của kì trung gian?","type": "mcq"},{"answer": "A","explain": "Điểm G1/S quyết định tế bào có nhân đôi ADN để bước vào phân bào hay không.","level": "TH","options": ["A. quyết định tế bào có nhân đôi ADN để bước vào phân bào hay không.","B. kiểm tra NST đã gắn vào thoi phân bào chưa.","C. kiểm tra ADN đã nhân đôi xong chưa.","D. kích thích tế bào phân chia ngay lập tức."],"points": 0.25,"q": "Điểm kiểm soát G1/S có vai trò","type": "mcq"},{"answer": "D","explain": "Kì giữa: NST kép co xoắn cực đại, xếp 1 hàng trên mặt phẳng xích đạo.","level": "TH","options": ["A. NST tháo xoắn, màng nhân xuất hiện lại.","B. NST kép tách ở tâm động về 2 cực.","C. Màng nhân tiêu biến, thoi phân bào hình thành.","D. NST kép xếp thành 1 hàng trên mặt phẳng xích đạo."],"points": 0.25,"q": "Đặc điểm của kì giữa trong nguyên phân là","type": "mcq"},{"answer": "C","explain": "Colchicine phá thoi phân bào nên NST không gắn được vào thoi, điểm kiểm soát thoi phân bào giữ tế bào dừng ở kì giữa.","level": "VDC","options": ["A. Kì đầu.","B. Kì sau.","C. Kì giữa.","D. Kì cuối."],"points": 0.25,"q": "T nh của tế bào.","b) Pha G1 diễn ra sự nhân đôi ADN.","c) Sau pha S, mỗi NST gồm 2 chromatid dính nhau ở tâm động.","d) Pha G2 tổng hợp các chất chuẩn bị cho phân bào."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: thắt eo ở tế bào động vật, vách ngăn ở tế bào thực vật. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về phân chia tế bào chất và ý nghĩa nguyên phân:","statements": ["a) Tế bào động vật phân chia tế bào chất bằng cách thắt eo màng.","b) Nguyên phân giúp cơ thể sinh trưởng và tái sinh mô tổn thương.","c) Tế bào thực vật phân chia tế bào chất bằng cách thắt eo màng.","d) Nguyên phân giữ ổn định bộ NST qua các thế hệ tế bào."],"type": "truefalse"},{"answer": "Kì trung gian","explain": "Kì trung gian (G1 + S + G2) chiếm phần lớn thời gian của chu kì tế bào.","level": "VD","points": 0.5,"q": "Giai đoạn nào chiếm phần lớn thời gian của chu kì tế bào?","type": "short"},{"answer": "24","explain": "Kì giữa mỗi NST vẫn là NST kép nên số NST kép bằng 2n = 24.","level": "VDC","points": 0.5,"q": "Một tế bào có 2n = 24 đang ở kì giữa của nguyên phân. Tế bào này có bao nhiêu NST kép? (trả lời bằng số)","type": "short"}]},{"name": "Đề 3","questions": [{"answer": "B","explain": "Nguyên phân xảy ra ở tế bào sinh dưỡng và tế bào sinh dục sơ khai.","level": "NB","options": ["A. tế bào sinh dục chín.","B. tế bào sinh dưỡng và tế bào sinh dục sơ khai.","C. giao tử.","D. hợp tử mới thụ tinh."],"points": 0.25,"q": "Nguyên phân xảy ra ở loại tế bào nào sau đây?","type": "mcq"},{"answer": "C","explain": "Kì cuối: NST tháo xoắn, màng nhân và hạch nhân xuất hiện lại, thoi phân bào tiêu biến.","level": "NB","options": ["A. NST kép tách ở tâm động.","B. thoi phân bào hình thành.","C. màng nhân xuất hiện trở lại.","D. NST xếp 1 hàng ở xích đạo."],"points": 0.25,"q": "Đặc điểm của kì cuối trong nguyên phân là","type": "mcq"},{"answer": "A","explain": "Điểm kiểm soát thoi phân bào rà soát xem mọi NST đã gắn đúng vào thoi phân bào chưa.","level": "NB","options": ["A. mọi NST đã gắn đúng vào thoi phân bào chưa.","B. ADN đã nhân đôi xong chưa.","C. tế bào đã đủ lớn chưa.","D. màng nhân đã tiêu biến chưa."],"points": 0.25,"q": "Điểm kiểm soát thoi phân bào kiểm tra","type": "mcq"},{"answer": "D","explain": "Sau pha S nhân đôi ADN, mỗi NST gồm 2 chromatid (NST kép).","level": "TH","options": ["A. 1 chromatid.","B. 3 chromatid.","C. 4 chromatid.","D. 2 chromatid."],"points": 0.25,"q": "Sau pha S của kì trung gian, mỗi NST gồm bao nhiêu chromatid?","type": "mcq"},{"answer": "C","explain": "Nguyên phân giúp sinh trưởng, tái sinh mô tổn thương và là hình thức sinh sản vô tính.","level": "TH","options": ["A. tạo ra giao tử.","B. làm giảm số lượng NST.","C. giúp cơ thể sinh trưởng và tái sinh mô bị tổn thương.","D. tạo ra biến dị tổ hợp."],"points": 0.25,"q": "Ý nghĩa của nguyên phân đối với cơ thể đa bào là","type": "mcq"},{"answer": "B","explain": "Tế bào ung thư bỏ qua các điểm kiểm soát nên phân chia liên tục không ngừng.","level": "VDC","options": ["A. Tế bào ung thư dừng ở pha G0 vĩnh viễn.","B. Tế bào ung thư bỏ qua các điểm kiểm soát nên phân chia liên tục.","C. Tế bào ung thư không có kì trung gian.","D. Tế bào ung thư chỉ thực hiện giảm phân."],"points": 0.25,"q": "Tế bào ung thư khác tế bào bình thường ở điểm nào của chu kì tế bào?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: kì giữa NST kép xếp 1 hàng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về diễn biến nguyên phân:","statements": ["a) Phân chia nhân trong nguyên phân gồm 4 kì: đầu, giữa, sau, cuối.","b) Kì đầu: NST kép bắt đầu đóng xoắn và hiện rõ.","c) Kì giữa: các NST đơn xếp thành 2 hàng trên mặt phẳng xích đạo.","d) Kì sau: 2 nhóm NST đơn phân li về 2 cực tế bào."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: nguyên phân tạo 2 tế bào con 2n giống mẹ. b) Đúng. c) Đúng. d) Sai: vách ngăn ở tế bào thực vật.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về kết quả nguyên phân:","statements": ["a) Từ 1 tế bào mẹ (2n) qua nguyên phân tạo 4 tế bào con (n).","b) Tế bào con có bộ NST giống hệt tế bào mẹ.","c) Lành vết thương ở da nhờ nguyên phân của tế bào da.","d) Tế bào động vật phân chia tế bào chất bằng vách ngăn."],"type": "truefalse"},{"answer": "8","explain": "Kì sau mỗi NST kép đã tách thành 2 NST đơn, mỗi cực nhận một bộ đơn bội bằng n nhân đôi trước đó, tức 8 NST đơn.","level": "VD","points": 0.5,"q": "Tế bào ruồi giấm có 2n = 8 đang ở kì sau của nguyên phân. Mỗi cực tế bào có bao nhiêu NST đơn? (trả lời bằng số)","type": "short"},{"answer": "16","explain": "Số tế bào con sau k lần nguyên phân là 2^k = 2^4 = 16.","level": "VDC","points": 0.5,"q": "Từ 1 tế bào mẹ qua 4 lần nguyên phân liên tiếp tạo ra bao nhiêu tế bào con? (trả lời bằng số)","type": "short"}]},{"name": "Đề 4","questions": [{"answer": "D","explain": "Nguyên phân (pha M) gồm phân chia nhân và phân chia tế bào chất.","level": "NB","options": ["A. G1.","B. S.","C. G2.","D. M."],"points": 0.25,"q": "Pha nào sau đây thuộc quá trình nguyên phân?","type": "mcq"},{"answer": "A","explain": "Pha G1: tế bào tăng kích thước, tổng hợp bào quan và tích lũy chất.","level": "NB","options": ["A. tăng kích thước tế bào và tổng hợp bào quan.","B. nhân đôi ADN.","C. phân chia nhân.","D. hình thành thoi phân bào."],"points": 0.25,"q": "Sự kiện chính của pha G1 là","type": "mcq"},{"answer": "B","explain": "Thoi phân bào hình thành ở kì đầu và tiêu biến ở kì cuối.","level": "NB","options": ["A. kì giữa.","B. kì đầu.","C. kì sau.","D. kì cuối."],"points": 0.25,"q": "Thoi phân bào bắt đầu hình thành ở kì nào của nguyên phân?","type": "mcq"},{"answer": "C","explain": "Điểm G2/M rà soát ADN đã nhân đôi hoàn tất và sai sót đã sửa chữa chưa.","level": "TH","options": ["A. tế bào có đủ dinh dưỡng không.","B. NST đã gắn vào thoi phân bào chưa.","C. ADN đã nhân đôi hoàn tất và sai sót đã được sửa chữa chưa.","D. màng nhân đã tiêu biến chưa."],"points": 0.25,"q": "Điểm kiểm soát G2/M rà soát","type": "mcq"},{"answer": "A","explain": "Kì giữa là lúc NST co xoắn cực đại, quan sát rõ nhất và đếm được số lượng NST.","level": "TH","options": ["A. kì giữa.","B. kì đầu.","C. kì sau.","D. kì cuối."],"points": 0.25,"q": "Khi làm tiêu bản quan sát NST, người ta thường chọn tế bào đang ở kì nào vì NST hiện rõ nhất?","type": "mcq"},{"answer": "D","explain": "Colchicine ngăn hình thành thoi phân bào nên NST không phân li, tế bào có bộ NST tăng gấp đôi (tứ bội).","level": "VDC","options": ["A. Tế bào chết ngay lập tức.","B. Tế bào phân chia bình thường.","C. Tế bào giảm một nửa số NST.","D. Tế bào có bộ NST tăng gấp đôi do NST không phân li."],"points": 0.25,"q": "Xử lí colchicine ngăn cản sự hình thành thoi phân bào. Hậu quả đối với tế bào đang nguyên phân là","type": "mcq"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: nhân đôi ADN ở pha S. c) Đúng. d) Sai: G0 là tạm dừng phân chia.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về các pha của kì trung gian:","statements": ["a) Pha G1: tế bào lớn lên và tổng hợp các bào quan.","b) Pha G2: diễn ra sự nhân đôi ADN.","c) Pha S: NST nhân đôi tạo thành NST kép.","d) Tế bào ở pha G0 đang phân chia mạnh."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: rãnh phân cắt thắt eo ở tế bào động vật. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nguyên phân ở động vật và thực vật:","statements": ["a) Diễn biến phân chia nhân ở tế bào động vật và thực vật cơ bản giống nhau.","b) Tế bào thực vật hình thành vách ngăn khi phân chia tế bào chất.","c) Tế bào thực vật phân chia tế bào chất bằng rãnh phân cắt thắt eo.","d) Kết quả nguyên phân ở cả hai đều là 2 tế bào con 2n."],"type": "truefalse"},{"answer": "Kì giữa","explain": "Kì giữa NST co xoắn cực đại nên quan sát và đếm NST rõ nhất.","level": "VD","points": 0.5,"q": "Muốn quan sát hình dạng và đếm số lượng NST rõ nhất, nên chọn tế bào đang ở kì nào của nguyên phân?","type": "short"},{"answer": "32","explain": "2^5 = 32 tế bào con.","level": "VDC","points": 0.5,"q": "Một tế bào nguyên phân 5 lần liên tiếp tạo ra bao nhiêu tế bào con? (trả lời bằng số)","type": "short"}]},{"name": "Đề 5","questions": [{"answer": "C","explain": "Nguyên phân giữ nguyên bộ NST 2n qua các thế hệ tế bào.","level": "NB","options": ["A. làm tăng gấp đôi bộ NST.","B. làm giảm một nửa bộ NST.","C. giữ ổn định bộ NST qua các thế hệ tế bào.","D. tạo ra bộ NST hoàn toàn mới."],"points": 0.25,"q": "Vai trò của nguyên phân đối với bộ NST là","type": "mcq"},{"answer": "B","explain": "Tế bào thần kinh đã biệt hóa, ở pha G0, không phân chia nữa.","level": "NB","options": ["A. pha G1.","B. pha G0.","C. pha S.","D. pha M."],"points": 0.25,"q": "Tế bào thần kinh trưởng thành không phân chia nữa, chúng đang ở pha nào?","type": "mcq"},{"answer": "A","explain": "Màng nhân tiêu biến ở kì đầu và xuất hiện lại ở kì cuối.","level": "NB","options": ["A. tiêu biến ở kì đầu, xuất hiện lại ở kì cuối.","B. xuất hiện ở kì đầu, tiêu biến ở kì cuối.","C. luôn tồn tại suốt nguyên phân.","D. tiêu biến hoàn toàn sau nguyên phân."],"points": 0.25,"q": "Màng nhân trong quá trình nguyên phân","type": "mcq"},{"answer": "D","explain": "Kì sau: NST kép tách ở tâm động, mỗi chromatid thành NST đơn về 2 cực.","level": "TH","options": ["A. 1 hàng NST kép ở xích đạo.","B. 2 hàng NST đơn ở xích đạo.","C. NST tháo xoắn trong nhân mới.","D. 2 nhóm NST đơn đang về 2 cực."],"points": 0.25,"q": "Quan sát thấy 2 nhóm NST đơn đang di chuyển về 2 cực tế bào. Tế bào đang ở kì nào?","type": "mcq"},{"answer": "B","explain": "Nhân đôi ADN ở pha S đảm bảo mỗi tế bào con nhận đủ bộ NST 2n.","level": "TH","options": ["A. giúp tế bào lớn lên.","B. đảm bảo mỗi tế bào con nhận đủ bộ NST giống mẹ.","C. giúp hình thành thoi phân bào.","D. giúp màng nhân tiêu biến."],"points": 0.25,"q": "Vì sao pha S (nhân đôi ADN) là điều kiện để nguyên phân tạo ra tế bào con giống mẹ?","type": "mcq"},{"answer": "A","explain": "Tế bào con của ung thư vẫn mang đột biến hỏng điểm kiểm soát nên tiếp tục phân chia mất kiểm soát.","level": "VDC","options": ["A. Vì đột biến hỏng cơ chế kiểm soát được di truyền cho tế bào con.","B. Vì tế bào ung thư không có ADN.","C. Vì tế bào ung thư không trải qua kì trung gian.","D. Vì thuốc không thể tác động lên tế bào ung thư."],"points": 0.25,"q": "Vì sao khối u ung thư ngày càng lớn dần theo thời gian?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: NST kép tách thành NST đơn ở kì sau. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về NST trong nguyên phân:","statements": ["a) Đầu kì trung gian, NST ở dạng sợi mảnh.","b) Kì giữa, NST co xoắn cực đại.","c) Kì giữa, mỗi NST kép tách thành 2 NST đơn.","d) Kì cuối, NST tháo xoắn trở lại dạng sợi mảnh."],"type": "truefalse"},{"answer": ["F","T","T","T"],"explain": "a) Sai: G1/S quyết định nhân đôi ADN. b) Đúng. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về điều hòa chu kì tế bào:","statements": ["a) Điểm G1/S kiểm tra NST đã gắn vào thoi phân bào chưa.","b) Sai hỏng không sửa được có thể khiến tế bào chết theo chương trình.","c) Chu kì tế bào được kiểm soát chặt chẽ ở các điểm kiểm soát.","d) Hỏng cơ chế kiểm soát có thể dẫn đến ung thư."],"type": "truefalse"},{"answer": "2","explain": "Kì sau mỗi NST kép tách thành 2 NST đơn nên số NST đơn tạm thời gấp đôi 2n.","level": "VD","points": 0.5,"q": "Tế bào có 2n = 14 đang ở kì sau nguyên phân thì có bao nhiêu NST đơn trong tế bào? (trả lời bằng số)","type": "short"},{"answer": "46","explain": "Nguyên phân giữ nguyên bộ NST nên tế bào con vẫn có 2n = 46.","level": "VDC","points": 0.5,"q": "Tế bào người có 2n = 46 nguyên phân một lần. Mỗi tế bào con có bao nhiêu NST? (trả lời bằng số)","type": "short"}]},{"name": "Đề 6","questions": [{"answer": "D","explain": "2n → 2n: nguyên phân giữ nguyên bộ NST lưỡng bội.","level": "NB","options": ["A. 2n → n.","B. n → 2n.","C. n → n.","D. 2n → 2n."],"points": 0.25,"q": "Sự thay đổi bộ NST qua nguyên phân là","type": "mcq"},{"answer": "B","explain": "Sinh sản vô tính (giâm cành, chiết cành...) dựa trên nguyên phân.","level": "NB","options": ["A. sinh sản hữu tính.","B. sinh sản vô tính ở nhiều loài.","C. tạo giao tử.","D. thụ tinh."],"points": 0.25,"q": "Nguyên phân là cơ sở của hình thức sinh sản nào sau đây?","type": "mcq"},{"answer": "C","explain": "Thứ tự: kì đầu → kì giữa → kì sau → kì cuối.","level": "NB","options": ["A. kì đầu - kì sau - kì giữa - kì cuối.","B. kì giữa - kì đầu - kì sau - kì cuối.","C. kì đầu - kì giữa - kì sau - kì cuối.","D. kì đầu - kì giữa - kì cuối - kì sau."],"points": 0.25,"q": "Trình tự đúng các kì của phân chia nhân trong nguyên phân là","type": "mcq"},{"answer": "A","explain": "Sau 1 lần nguyên phân: 2 tế bào; sau 2 lần: 4 tế bào.","level": "TH","options": ["A. 4","B. 2","C. 8","D. 6"],"points": 0.25,"q": "Từ 1 tế bào mẹ qua 2 lần nguyên phân liên tiếp tạo ra bao nhiêu tế bào con?","type": "mcq"},{"answer": "C","explain": "Tâm động là nơi 2 chromatid dính nhau và là nơi NST kép tách ra ở kì sau.","level": "TH","options": ["A. nơi NST bắt đầu đóng xoắn.","B. nơi màng nhân bám vào.","C. nơi 2 chromatid dính nhau và NST kép tách ra ở kì sau.","D. nơi thoi phân bào tiêu biến."],"points": 0.25,"q": "Tâm động có vai trò gì trong nguyên phân?","type": "mcq"},{"answer": "B","explain": "Rễ hành có mô phân sinh, tế bào đang phân chia mạnh nên dễ quan sát các kì nguyên phân.","level": "VDC","options": ["A. Vì rễ hành to dễ quan sát.","B. Vì đầu rễ hành có mô phân sinh với nhiều tế bào đang nguyên phân.","C. Vì tế bào rễ hành không có màng nhân.","D. Vì rễ hành có NST rất lớn."],"points": 0.25,"q": "Vì sao bài thực hành quan sát nguyên phân thường dùng đầu rễ hành?","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: phân chia nhân trước, rồi đến phân chia tế bào chất. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về trình tự nguyên phân:","statements": ["a) Nguyên phân gồm phân chia nhân và phân chia tế bào chất.","b) Phân chia tế bào chất diễn ra trước phân chia nhân.","c) Kì trung gian diễn ra trước pha M.","d) Sau nguyên phân, tế bào con lớn lên rồi tiếp tục chu kì mới."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: tế bào con giống hệt mẹ về bộ NST. c) Đúng: 2^3 = 8. d) Sai: thắt eo ở động vật.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về số tế bào con và phân chia tế bào chất:","statements": ["a) Nguyên phân tạo ra 2 tế bào con từ 1 tế bào mẹ.","b) Tế bào con sau nguyên phân có bộ NST khác tế bào mẹ.","c) 1 tế bào qua 3 lần nguyên phân tạo 8 tế bào con.","d) Tế bào thực vật phân chia tế bào chất bằng cách thắt eo."],"type": "truefalse"},{"answer": "4","explain": "2^2 = 4 tế bào con.","level": "VD","points": 0.5,"q": "Từ 1 tế bào mẹ qua 2 lần nguyên phân liên tiếp tạo ra bao nhiêu tế bào con? (trả lời bằng số)","type": "short"},{"answer": "Thoi phân bào","explain": "Thoi phân bào kéo NST về 2 cực; phá thoi thì NST không phân li được.","level": "VDC","points": 0.5,"q": "Colchicine ngăn cản sự hình thành cấu trúc nào của tế bào?","type": "short"}]},{"name": "Đề 7","questions": [{"answer": "A","explain": "Kì trung gian là giai đoạn sinh trưởng chính, chuẩn bị mọi điều kiện cho phân bào.","level": "NB","options": ["A. sinh trưởng và chuẩn bị cho phân bào.","B. phân chia nhân.","C. phân chia tế bào chất.","D. hình thành thoi phân bào."],"points": 0.25,"q": "Vai trò của kì trung gian trong chu kì tế bào là","type": "mcq"},{"answer": "C","explain": "2n = 8 → mỗi tế bào con sau nguyên phân vẫn 2n = 8.","level": "NB","options": ["A. 4","B. 16","C. 8","D. 2"],"points": 0.25,"q": "Tế bào ruồi giấm có 2n = 8. Sau nguyên phân, mỗi tế bào con có bao nhiêu NST?","type": "mcq"},{"answer": "B","explain": "Rãnh phân cắt thắt eo màng là cách phân chia tế bào chất ở động vật.","level": "NB","options": ["A. hình thành vách ngăn.","B. màng thắt lại ở giữa (rãnh phân cắt).","C. tiêu biến màng nhân.","D. nhân đôi trung thể."],"points": 0.25,"q": "Phân chia tế bào chất ở tế bào động vật diễn ra bằng cách","type": "mcq"},{"answer": "D","explain": "Kì đầu: NST kép đóng xoắn hiện rõ, màng nhân tiêu biến, thoi phân bào xuất hiện.","level": "TH","options": ["A. màng nhân xuất hiện, NST tháo xoắn.","B. NST xếp 1 hàng ở xích đạo.","C. NST kép tách ở tâm động.","D. màng nhân tiêu biến, NST kép hiện rõ."],"points": 0.25,"q": "Quan sát thấy màng nhân đã tiêu biến, các NST kép hiện rõ trong tế bào. Tế bào đang ở kì nào?","type": "mcq"},{"answer": "A","explain": "Không nhân đôi ADN thì không đủ vật chất di truyền chia đều cho 2 tế bào con.","level": "TH","options": ["A. Không đủ vật chất di truyền để chia đều cho 2 tế bào con.","B. Thoi phân bào không hình thành.","C. Màng nhân không tiêu biến.","D. Tế bào chất không phân chia."],"points": 0.25,"q": "Nếu pha S bị ức chế (không nhân đôi ADN), điều gì xảy ra khi tế bào bước vào nguyên phân?","type": "mcq"},{"answer": "C","explain": "Điểm kiểm soát phát hiện sai hỏng sẽ dừng chu kì để sửa chữa, đảm bảo ADN được truyền nguyên vẹn.","level": "VDC","options": ["A. Tăng tốc độ phân chia tế bào.","B. Làm tế bào phân chia nhiều hơn.","C. Dừng chu kì để sửa chữa sai hỏng, đảm bảo ADN truyền đạt nguyên vẹn.","D. Kích thích tế bào chết ngay lập tức."],"points": 0.25,"q": "Ý nghĩa của các điểm kiểm soát chu kì tế bào là","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: kì sau tách ở tâm động. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về các kì nguyên phân:","statements": ["a) Kì đầu: thoi phân bào bắt đầu hình thành.","b) Kì giữa: NST kép xếp 1 hàng trên mặt phẳng xích đạo.","c) Kì sau: NST kép tách ở đầu mút.","d) Kì cuối: thoi phân bào tiêu biến."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: nguyên phân tạo 2 tế bào con 2n. b) Đúng. c) Đúng. d) Sai: 2^4 = 16.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về số lượng tế bào và NST:","statements": ["a) 1 tế bào (2n) qua nguyên phân tạo 4 tế bào con (n).","b) Tế bào có 2n = 20, tế bào con sau nguyên phân cũng có 2n = 20.","c) Tế bào ở kì giữa nguyên phân có số NST kép bằng 2n.","d) 1 tế bào qua 4 lần nguyên phân tạo 8 tế bào con."],"type": "truefalse"},{"answer": "2n","explain": "Nguyên phân giữ nguyên bộ NST lưỡng bội 2n.","level": "VD","points": 0.5,"q": "Tế bào mẹ có bộ NST 2n, sau nguyên phân tế bào con có bộ NST là bao nhiêu? (trả lời dạng 2n)","type": "short"},{"answer": "Kì sau","explain": "Kì sau: NST kép tách ở tâm động thành 2 NST đơn phân li về 2 cực.","level": "VDC","points": 0.5,"q": "Kì nào của nguyên phân có sự tách tâm động của NST kép?","type": "short"}]},{"name": "Đề 8","questions": [{"answer": "B","explain": "Kì trung gian gồm G1, S, G2; pha M là nguyên phân.","level": "NB","options": ["A. G1, S, M.","B. G1, S, G2.","C. S, G2, M.","D. G1, G2, M."],"points": 0.25,"q": "Các pha thuộc kì trung gian là","type": "mcq"},{"answer": "D","explain": "Sau nguyên phân, 2 tế bào con lớn lên (G1) rồi tiếp tục chu kì mới.","level": "NB","options": ["A. chết ngay.","B. dừng phân chia vĩnh viễn.","C. hợp nhất trở lại.","D. lớn lên rồi tiếp tục chu kì mới."],"points": 0.25,"q": "Sau khi nguyên phân kết thúc, các tế bào con sẽ","type": "mcq"},{"answer": "A","explain": "Nguyên phân diễn ra ở tế bào nhân thực.","level": "NB","options": ["A. tế bào nhân thực.","B. tế bào nhân sơ.","C. virus.","D. vi khuẩn."],"points": 0.25,"q": "Nguyên phân là hình thức phân bào của","type": "mcq"},{"answer": "C","explain": "NST kép tách ở tâm động là đặc trưng của kì sau.","level": "TH","options": ["A. kì đầu.","B. kì giữa.","C. kì sau.","D. kì cuối."],"points": 0.25,"q": "Kì nào có hiện tượng NST kép tách nhau ở tâm động?","type": "mcq"},{"answer": "B","explain": "Tế bào con cần lớn lên và tổng hợp bào quan trước khi phân chia tiếp.","level": "TH","options": ["A. Để NST tháo xoắn hoàn toàn.","B. Để tế bào lớn lên và tổng hợp đủ bào quan, chất cần thiết.","C. Để màng nhân tiêu biến.","D. Để thoi phân bào hình thành."],"points": 0.25,"q": "Vì sao sau nguyên phân, tế bào con cần trải qua kì trung gian trước khi phân chia tiếp?","type": "mcq"},{"answer": "A","explain": "Màng nhân xuất hiện lại bao lấy 2 nhóm NST ở 2 cực tạo 2 nhân mới là dấu hiệu kì cuối.","level": "VDC","options": ["A. kì cuối.","B. kì đầu.","C. kì giữa.","D. kì sau."],"points": 0.25,"q": "Quan sát thấy màng nhân đang xuất hiện trở lại bao quanh 2 nhóm NST ở 2 cực tế bào. Tế bào đang ở kì nào?","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: phân chia nhân gồm 4 kì. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về cấu trúc chu kì tế bào:","statements": ["a) Chu kì tế bào gồm kì trung gian và pha M.","b) Phân chia nhân trong nguyên phân gồm 3 kì.","c) Phân chia tế bào chất diễn ra sau phân chia nhân.","d) Kì trung gian gồm các pha G1, S, G2."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: ở kì giữa NST kép chưa tách. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về NST kép:","statements": ["a) NST kép gồm 2 chromatid dính nhau ở tâm động.","b) NST kép được tạo ra sau pha S.","c) Ở kì giữa, mỗi NST kép đã tách thành 2 NST đơn.","d) Ở kì sau, số NST đơn trong tế bào tạm thời gấp đôi 2n."],"type": "truefalse"},{"answer": "G1","explain": "Pha G1: tế bào tăng kích thước, tổng hợp bào quan.","level": "VD","points": 0.5,"q": "Pha nào của kì trung gian có sự tăng kích thước tế bào và tổng hợp bào quan?","type": "short"},{"answer": "Kì đầu","explain": "Kì đầu: màng nhân và hạch nhân tiêu biến, thoi phân bào hình thành.","level": "VDC","points": 0.5,"q": "Màng nhân bắt đầu tiêu biến ở kì nào của nguyên phân?","type": "short"}]},{"name": "Đề 9","questions": [{"answer": "C","explain": "Tâm động là nơi 2 chromatid dính nhau.","level": "NB","options": ["A. đầu mút NST.","B. eo thứ cấp.","C. tâm động.","D. vệ tinh."],"points": 0.25,"q": "Hai chromatid của NST kép dính nhau ở","type": "mcq"},{"answer": "A","explain": "Điểm G2/M rà soát nhân đôi ADN trước khi vào phân bào.","level": "NB","options": ["A. ADN đã nhân đôi hoàn tất chưa.","B. NST đã gắn vào thoi chưa.","C. tế bào đã đủ lớn chưa.","D. màng nhân đã hình thành chưa."],"points": 0.25,"q": "Điểm kiểm soát G2/M kiểm tra","type": "mcq"},{"answer": "D","explain": "Kết quả: 2 tế bào con 2n giống nhau và giống mẹ.","level": "NB","options": ["A. 4 tế bào con n.","B. 2 tế bào con n.","C. 4 tế bào con 2n.","D. 2 tế bào con 2n giống mẹ."],"points": 0.25,"q": "Kết quả của một lần nguyên phân là","type": "mcq"},{"answer": "B","explain": "Thoi phân bào có vai trò kéo NST về 2 cực ở kì sau.","level": "TH","options": ["A. giúp NST đóng xoắn.","B. kéo các NST về 2 cực của tế bào.","C. giúp màng nhân tiêu biến.","D. tổng hợp ADN mới."],"points": 0.25,"q": "Vai trò của thoi phân bào trong nguyên phân là","type": "mcq"},{"answer": "D","explain": "Kì cuối: NST tháo xoắn, màng nhân xuất hiện lại, thoi tiêu biến.","level": "TH","options": ["A. NST kép tách ở tâm động.","B. NST xếp 1 hàng ở xích đạo.","C. màng nhân tiêu biến.","D. NST tháo xoắn, màng nhân xuất hiện lại."],"points": 0.25,"q": "Diễn biến của kì cuối trong nguyên phân là","type": "mcq"},{"answer": "B","explain": "Số NST đơn ở kì sau gấp đôi 2n vì mỗi NST kép tách thành 2 NST đơn: 2 x 14 = 28.","level": "VDC","options": ["A. 14","B. 28","C. 7","D. 56"],"points": 0.25,"q": "Tế bào đậu Hà Lan có 2n = 14 đang ở kì sau của nguyên phân. Tế bào này có bao nhiêu NST đơn?","type": "mcq"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: tế bào thần kinh ở G0 không phân chia. c) Đúng. d) Sai: nguyên phân giữ nguyên 2n.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về phân chia tế bào:","statements": ["a) Tế bào da khi bị thương tăng cường nguyên phân để lành vết thương.","b) Tế bào thần kinh trưởng thành nguyên phân mạnh.","c) Giâm cành dựa trên khả năng nguyên phân của tế bào thực vật.","d) Nguyên phân làm tăng gấp đôi bộ NST của tế bào con."],"type": "truefalse"},{"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng: 2^2 = 4. d) Sai: NST kép tách thành NST đơn ở kì sau.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về kì đầu, kì giữa và số NST:","statements": ["a) Kì đầu và kì cuối có diễn biến màng nhân ngược nhau.","b) Kì giữa và kì sau đều có NST co xoắn.","c) 1 tế bào qua 2 lần nguyên phân tạo 4 tế bào con.","d) NST kép tách thành 2 NST đơn ở kì giữa."],"type": "truefalse"},{"answer": "S","explain": "Pha S diễn ra sự nhân đôi ADN.","level": "VD","points": 0.5,"q": "Nhân đôi ADN diễn ra ở pha nào của kì trung gian? (trả lời 1 kí tự)","type": "short"},{"answer": "28","explain": "Kì sau: mỗi NST kép (14) tách thành 2 NST đơn, tổng 28 NST đơn.","level": "VDC","points": 0.5,"q": "Tế bào đậu Hà Lan (2n = 14) ở kì sau nguyên phân có bao nhiêu NST đơn? (trả lời bằng số)","type": "short"}]},{"name": "Đề 10","questions": [{"answer": "B","explain": "Hạch nhân tiêu biến cùng màng nhân ở kì đầu.","level": "NB","options": ["A. kì giữa.","B. kì đầu.","C. kì sau.","D. kì cuối."],"points": 0.25,"q": "Hạch nhân tiêu biến ở kì nào của nguyên phân?","type": "mcq"},{"answer": "D","explain": "Chromatid là mỗi nhánh của NST kép.","level": "NB","options": ["A. NST đơn.","B. tâm động.","C. thoi phân bào.","D. mỗi nhánh của NST kép."],"points": 0.25,"q": "Chromatid là","type": "mcq"},{"answer": "A","explain": "NST kép gồm 2 chromatid nên sau tách mỗi cực nhận 1 chromatid (thành NST đơn).","level": "NB","options": ["A. 1 chromatid của mỗi NST kép.","B. cả NST kép nguyên vẹn.","C. 2 chromatid của mỗi NST kép.","D. ngẫu nhiên chromatid."],"points": 0.25,"q": "Mỗi cực tế bào ở kì sau nhận được","type": "mcq"},{"answer": "C","explain": "Không có điểm kiểm soát, sai hỏng ADN tích lũy và tế bào phân chia mất kiểm soát.","level": "TH","options": ["A. Tế bào phân chia nhanh hơn bình thường.","B. Tế bào không bao giờ phân chia.","C. Sai hỏng không được sửa chữa, tế bào có thể phân chia mất kiểm soát.","D. Tế bào luôn chết ngay lập tức."],"points": 0.25,"q": "Nếu các điểm kiểm soát chu kì tế bào bị hỏng, điều gì có thể xảy ra?","type": "mcq"},{"answer": "A","explain": "Pha G2 tổng hợp protein, enzyme cần cho phân bào (ví dụ protein thoi phân bào).","level": "TH","options": ["A. tổng hợp các protein và enzyme cần cho phân bào.","B. nhân đôi ADN.","C. phân chia nhân.","D. tháo xoắn NST."],"points": 0.25,"q": "Vai trò chính của pha G2 là","type": "mcq"},{"answer": "D","explain": "Tế bào con mang đột biến ở gen kiểm soát chu kì nên cũng bỏ qua điểm kiểm soát, phân chia liên tục tạo khối u lớn dần.","level": "VDC","options": ["A. Vì tế bào ung thư không cần dinh dưỡng.","B. Vì hệ miễn dịch kích thích khối u.","C. Vì tế bào ung thư phân chia chậm nhưng sống lâu.","D. Vì đột biến hỏng kiểm soát được truyền cho tế bào con, chúng tiếp tục phân chia mất kiểm soát."],"points": 0.25,"q": "Giải thích vì sao khối u ác tính có khả năng di căn và phát triển nhanh:","type": "mcq"},{"answer": ["F","T","T","T"],"explain": "a) Sai: kì trung gian chiếm phần lớn thời gian. b) Đúng. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về thời gian và sự kiện chu kì:","statements": ["a) Pha M chiếm phần lớn thời gian chu kì tế bào.","b) Pha S làm hàm lượng ADN trong tế bào tăng gấp đôi.","c) Kì giữa là lúc NST hiện rõ nhất.","d) Phân chia tế bào chất hoàn tất quá trình nguyên phân."],"type": "truefalse"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: kì sau NST đơn về 2 cực. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về sự phân li NST:","statements": ["a) Thoi phân bào gắn vào tâm động của NST kép.","b) Ở kì giữa, các NST đơn đã phân li về 2 cực.","c) Mỗi tế bào con nhận 1 chromatid từ mỗi NST kép của mẹ.","d) Nguyên phân phân phối đều vật chất di truyền cho 2 tế bào con."],"type": "truefalse"},{"answer": "2","explain": "Mỗi NST kép gồm 2 chromatid.","level": "VD","points": 0.5,"q": "Mỗi NST kép gồm bao nhiêu chromatid? (trả lời bằng số)","type": "short"},{"answer": "G2","explain": "Pha G2 tổng hợp các chất chuẩn bị cho phân bào.","level": "VDC","points": 0.5,"q": "Pha nào của kì trung gian trực tiếp chuẩn bị cho quá trình phân bào?","type": "short"}]}]}
