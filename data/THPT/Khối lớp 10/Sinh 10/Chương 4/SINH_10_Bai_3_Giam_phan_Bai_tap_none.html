<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1","questions": [{"answer": "B","explain": "Giảm phân gồm 2 lần phân bào liên tiếp: giảm phân I và giảm phân II.","level": "NB","options": ["A. 1","B. 2","C. 3","D. 4"],"points": 0.25,"q": "Giảm phân gồm bao nhiêu lần phân bào liên tiếp?","type": "mcq"},{"answer": "A","explain": "ADN chỉ nhân đôi 1 lần ở kì trung gian trước giảm phân I.","level": "NB","options": ["A. 1 lần.","B. 2 lần.","C. 3 lần.","D. 4 lần."],"points": 0.25,"q": "Trong giảm phân, ADN nhân đôi bao nhiêu lần?","type": "mcq"},{"answer": "C","explain": "Từ 1 tế bào mẹ (2n) qua giảm phân tạo 4 tế bào con (n).","level": "NB","options": ["A. 2 tế bào con (2n).","B. 2 tế bào con (n).","C. 4 tế bào con (n).","D. 4 tế bào con (2n)."],"points": 0.25,"q": "Kết quả của giảm phân là","type": "mcq"},{"answer": "B","explain": "Kì đầu I: các NST kép tiếp hợp theo cặp tương đồng và có thể trao đổi chéo.","level": "TH","options": ["A. kì giữa I.","B. kì đầu I.","C. kì sau II.","D. kì cuối I."],"points": 0.25,"q": "Hiện tượng trao đổi chéo giữa các NST xảy ra ở kì nào?","type": "mcq"},{"answer": "D","explain": "Kì giữa I: các NST kép xếp thành 2 hàng trên mặt phẳng xích đạo.","level": "TH","options": ["A. 1 hàng NST đơn.","B. 1 hàng NST kép.","C. 2 hàng NST đơn.","D. 2 hàng NST kép."],"points": 0.25,"q": "Ở kì giữa I, các NST sắp xếp như thế nào trên mặt phẳng xích đạo?","type": "mcq"},{"answer": "A","explain": "Phân li độc lập ở kì sau I và trao đổi chéo ở kì đầu I tạo ra các tổ hợp NST khác nhau ở mỗi giao tử.","level": "VDC","options": ["A. Do trao đổi chéo và sự phân li độc lập của các cặp NST tương đồng.","B. Do ADN nhân đôi 2 lần.","C. Do NST không phân li ở kì sau II.","D. Do các giao tử có số lượng NST khác nhau."],"points": 0.25,"q": "Vì sao các giao tử được tạo ra từ cùng một tế bào mẹ lại khác nhau về tổ hợp NST?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: ADN chỉ nhân đôi 1 lần. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về khái niệm giảm phân:","statements": ["a) Giảm phân là hình thức phân bào của tế bào sinh dục chín.","b) Giảm phân gồm 2 lần phân bào liên tiếp.","c) Trong giảm phân, ADN nhân đôi 2 lần.","d) Kết quả giảm phân là 4 tế bào con có bộ NST n."],"type": "truefalse"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: kì sau I NST kép đi nguyên vẹn về cực, không tách tâm động. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về diễn biến giảm phân I:","statements": ["a) Kì đầu I: các NST kép tiếp hợp theo từng cặp tương đồng.","b) Kì sau I: mỗi NST kép tách ở tâm động thành 2 NST đơn.","c) Kì giữa I: NST kép xếp thành 2 hàng trên mặt phẳng xích đạo.","d) Kì cuối I: tạo 2 tế bào con có bộ NST n kép."],"type": "truefalse"},{"answer": "4","explain": "Giảm phân từ 1 tế bào mẹ tạo ra 4 tế bào con.","level": "VD","points": 0.5,"q": "Một tế bào sinh tinh (2n = 46) giảm phân tạo ra bao nhiêu tinh trùng? (trả lời bằng số)","type": "short"},{"answer": "8","explain": "Kì giữa I NST vẫn ở dạng kép nên số NST kép bằng 2n = 8.","level": "VDC","points": 0.5,"q": "Tế bào có 2n = 8 đang ở kì giữa I. Tế bào này có bao nhiêu NST kép? (trả lời bằng số)","type": "short"}]},{"name": "Đề 2","questions": [{"answer": "B","explain": "Giảm phân xảy ra ở tế bào sinh dục chín (tế bào sinh tinh, tế bào sinh trứng).","level": "NB","options": ["A. tế bào sinh dưỡng.","B. tế bào sinh dục chín.","C. tế bào sinh dục sơ khai.","D. hợp tử."],"points": 0.25,"q": "Giảm phân xảy ra ở loại tế bào nào?","type": "mcq"},{"answer": "C","explain": "Kì sau I: mỗi NST kép (nguyên vẹn, không tách tâm động) đi về 1 cực.","level": "NB","options": ["A. tách ở tâm động thành NST đơn.","B. xếp 2 hàng ở xích đạo.","C. đi nguyên vẹn về 1 cực, không tách tâm động.","D. tháo xoắn hoàn toàn."],"points": 0.25,"q": "Ở kì sau I, mỗi NST kép","type": "mcq"},{"answer": "A","explain": "Giảm phân II diễn ra giống nguyên phân: kì sau II mới tách tâm động.","level": "NB","options": ["A. nguyên phân.","B. giảm phân I.","C. trực phân.","D. phân đôi."],"points": 0.25,"q": "Giảm phân II có diễn biến cơ bản giống với","type": "mcq"},{"answer": "D","explain": "Kì sau I: các cặp NST tương đồng phân li độc lập về 2 cực.","level": "TH","options": ["A. kì đầu I.","B. kì giữa I.","C. kì sau II.","D. kì sau I."],"points": 0.25,"q": "Sự phân li độc lập của các cặp NST tương đồng diễn ra ở kì nào?","type": "mcq"},{"answer": "B","explain": "Giảm phân tạo giao tử n, qua thụ tinh khôi phục 2n, duy trì ổn định bộ NST loài.","level": "TH","options": ["A. giúp cơ thể sinh trưởng.","B. tạo giao tử và duy trì ổn định bộ NST qua sinh sản hữu tính.","C. tái sinh mô bị tổn thương.","D. tạo ra tế bào sinh dưỡng mới."],"points": 0.25,"q": "Ý nghĩa của giảm phân đối với sinh sản hữu tính là","type": "mcq"},{"answer": "C","explain": "Kì sau I: NST kép nguyên vẹn về cực (giảm số NST); kì sau II: tách tâm động thành NST đơn (như nguyên phân).","level": "VDC","options": ["A. Cả hai đều tách tâm động.","B. Cả hai đều không tách tâm động.","C. Kì sau I: NST kép nguyên vẹn về cực; kì sau II: tách tâm động thành NST đơn.","D. Kì sau I: tách tâm động; kì sau II: NST kép nguyên vẹn về cực."],"points": 0.25,"q": "Phân biệt kì sau I và kì sau II của giảm phân:","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: nguyên phân tạo 2 TB con 2n giống mẹ. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau khi so sánh nguyên phân và giảm phân:","statements": ["a) Nguyên phân gồm 1 lần phân bào, giảm phân gồm 2 lần.","b) Nguyên phân tạo 4 tế bào con đơn bội.","c) Giảm phân tạo 4 tế bào con đơn bội.","d) Nguyên phân giữ nguyên bộ NST, giảm phân làm giảm một nửa."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng: 2n = 46 → n = 23. b) Đúng. c) Sai: kì giữa II xếp 1 hàng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về số lượng NST ở người (2n = 46):","statements": ["a) Mỗi tinh trùng có 23 NST.","b) Sau giảm phân I, mỗi tế bào con có 23 NST kép.","c) Ở kì giữa II, các NST kép xếp thành 2 hàng.","d) Ở kì sau II, mỗi cực nhận 23 NST đơn."],"type": "truefalse"},{"answer": "n kép","explain": "Sau giảm phân I, mỗi tế bào con có bộ NST n nhưng NST vẫn ở dạng kép.","level": "VD","points": 0.5,"q": "Sau giảm phân I, mỗi tế bào con có bộ NST như thế nào? (trả lời dạng n kép)","type": "short"},{"answer": "12","explain": "Kì sau I: mỗi cực nhận một nửa số NST kép, tức n = 12 NST kép.","level": "VDC","points": 0.5,"q": "Tế bào có 2n = 24 đang ở kì sau I. Mỗi cực tế bào có bao nhiêu NST kép? (trả lời bằng số)","type": "short"}]},{"name": "Đề 3","questions": [{"answer": "A","explain": "Tiếp hợp là hiện tượng các NST kép bắt cặp với nhau theo từng cặp tương đồng ở kì đầu I.","level": "NB","options": ["A. các NST kép bắt cặp theo từng cặp tương đồng.","B. NST kép tách ở tâm động.","C. NST xếp 1 hàng ở xích đạo.","D. màng nhân xuất hiện trở lại."],"points": 0.25,"q": "Tiếp hợp trong giảm phân là hiện tượng","type": "mcq"},{"answer": "B","explain": "Kết thúc giảm phân I tạo 2 tế bào con (n kép).","level": "NB","options": ["A. 1","B. 2","C. 4","D. 8"],"points": 0.25,"q": "Kết thúc giảm phân I, từ 1 tế bào mẹ tạo ra bao nhiêu tế bào con?","type": "mcq"},{"answer": "D","explain": "Sau giảm phân, tế bào con có bộ NST đơn bội n.","level": "NB","options": ["A. 2n kép.","B. 2n đơn.","C. n kép.","D. n đơn."],"points": 0.25,"q": "Bộ NST của tế bào con sau khi kết thúc giảm phân là","type": "mcq"},{"answer": "C","explain": "Gọi là giảm phân vì số lượng NST giảm đi một nửa (2n → n).","level": "TH","options": ["A. Vì số tế bào con giảm đi.","B. Vì kích thước tế bào giảm đi.","C. Vì số lượng NST giảm đi một nửa.","D. Vì thời gian phân bào ngắn lại."],"points": 0.25,"q": "Vì sao hình thức phân bào này được gọi là giảm phân?","type": "mcq"},{"answer": "D","explain": "Biến dị tổ hợp do trao đổi chéo (kì đầu I), phân li độc lập (kì sau I) và thụ tinh ngẫu nhiên.","level": "TH","options": ["A. đột biến gen.","B. đột biến NST.","C. nguyên phân.","D. trao đổi chéo, phân li độc lập và thụ tinh ngẫu nhiên."],"points": 0.25,"q": "Biến dị tổ hợp được tạo ra nhờ","type": "mcq"},{"answer": "B","explain": "Không có trao đổi chéo và phân li độc lập thì mỗi cặp NST luôn cho cùng một tổ hợp, các giao tử giống nhau về NST.","level": "VDC","options": ["A. Các giao tử vẫn khác nhau do đột biến.","B. Các giao tử giống nhau hoàn toàn về tổ hợp NST.","C. Số lượng giao tử tăng gấp đôi.","D. Không tạo được giao tử."],"points": 0.25,"q": "Nếu không có trao đổi chéo ở kì đầu I và phân li độc lập ở kì sau I, các giao tử tạo ra sẽ","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: kì sau II mới tách tâm động. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về giảm phân II:","statements": ["a) Giảm phân II diễn ra giống nguyên phân.","b) Trước giảm phân II, ADN không nhân đôi nữa.","c) Ở kì sau I, NST kép tách ở tâm động.","d) Kết thúc giảm phân II tạo 4 tế bào con (n)."],"type": "truefalse"},{"answer": ["F","T","T","T"],"explain": "a) Sai: nguyên phân không có tiếp hợp. b) Đúng. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về điểm khác nhau giữa nguyên phân và giảm phân:","statements": ["a) Cả nguyên phân và giảm phân đều có tiếp hợp NST.","b) Kì giữa nguyên phân xếp 1 hàng, kì giữa I xếp 2 hàng.","c) Nguyên phân tạo 2 tế bào 2n, giảm phân tạo 4 tế bào n.","d) Giảm phân tạo biến dị tổ hợp, nguyên phân thì không."],"type": "truefalse"},{"answer": "Kì giữa I","explain": "Kì giữa I: các NST kép xếp thành 2 hàng trên mặt phẳng xích đạo.","level": "VD","points": 0.5,"q": "Kì nào của giảm phân có hiện tượng NST kép xếp thành 2 hàng trên mặt phẳng xích đạo?","type": "short"},{"answer": "4","explain": "Ruồi giấm 2n = 8, giao tử có n = 4 NST.","level": "VDC","points": 0.5,"q": "Tế bào ruồi giấm có 2n = 8 giảm phân. Mỗi giao tử tạo ra có bao nhiêu NST? (trả lời bằng số)","type": "short"}]},{"name": "Đề 4","questions": [{"answer": "D","explain": "Giảm phân I làm giảm số NST (2n thành n); giảm phân II chỉ tách chromatid.","level": "NB","options": ["A. Giảm phân II.","B. Kì trung gian.","C. Nguyên phân.","D. Giảm phân I."],"points": 0.25,"q": "Lần phân bào nào làm giảm số lượng NST đi một nửa?","type": "mcq"},{"answer": "B","explain": "Trao đổi chéo: đoạn chromatid giữa 2 NST tương đồng đổi chỗ cho nhau.","level": "NB","options": ["A. NST kép tách ở tâm động.","B. đoạn chromatid giữa 2 NST trong cặp tương đồng đổi chỗ cho nhau.","C. NST xếp 2 hàng ở xích đạo.","D. màng nhân xuất hiện trở lại."],"points": 0.25,"q": "Trao đổi chéo là hiện tượng","type": "mcq"},{"answer": "A","explain": "Kì giữa II: NST kép xếp 1 hàng (giống kì giữa nguyên phân).","level": "NB","options": ["A. 1 hàng NST kép.","B. 2 hàng NST kép.","C. 1 hàng NST đơn.","D. 2 hàng NST đơn."],"points": 0.25,"q": "Ở kì giữa II, các NST sắp xếp như thế nào?","type": "mcq"},{"answer": "C","explain": "Kì sau II: NST kép tách ở tâm động thành NST đơn về 2 cực.","level": "TH","options": ["A. kì sau I.","B. kì giữa II.","C. kì sau II.","D. kì đầu II."],"points": 0.25,"q": "Sự tách tâm động của NST kép trong giảm phân xảy ra ở kì nào?","type": "mcq"},{"answer": "B","explain": "Thụ tinh: giao tử đực (n) + giao tử cái (n) → hợp tử (2n), khôi phục bộ NST lưỡng bội.","level": "TH","options": ["A. tạo ra biến dị tổ hợp.","B. khôi phục bộ NST lưỡng bội (2n) cho hợp tử.","C. làm tăng số lượng giao tử.","D. giảm số NST của hợp tử."],"points": 0.25,"q": "Vai trò của thụ tinh phối hợp với giảm phân là","type": "mcq"},{"answer": "D","explain": "Trao đổi chéo tạo chromatid tái tổ hợp; phân li độc lập tạo tổ hợp NST mới; thụ tinh ngẫu nhiên kết hợp các giao tử khác nhau.","level": "VDC","options": ["A. Đột biến gen và đột biến NST.","B. Nguyên phân và trực phân.","C. Nhân đôi ADN 2 lần.","D. Trao đổi chéo, phân li độc lập và sự kết hợp ngẫu nhiên của giao tử."],"points": 0.25,"q": "Ba nguồn gốc tạo nên sự đa dạng di truyền ở sinh sản hữu tính là","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: kì đầu I NST vẫn ở dạng kép. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về kì đầu I:","statements": ["a) Kì đầu I: NST kép tiếp hợp theo từng cặp tương đồng.","b) Kì đầu I: mỗi NST kép tách thành 2 NST đơn.","c) Trao đổi chéo làm tăng biến dị tổ hợp.","d) Kì đầu I là kì dài nhất của giảm phân."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: kì sau I NST kép nguyên vẹn về cực. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về kì sau của giảm phân:","statements": ["a) Kì sau I: mỗi NST kép đi về 1 cực tế bào.","b) Kì sau II: các NST đơn phân li về 2 cực.","c) Kì sau I: NST kép tách ở tâm động.","d) Kì sau II diễn ra giống kì sau của nguyên phân."],"type": "truefalse"},{"answer": "Kì đầu I","explain": "Trao đổi chéo xảy ra ở kì đầu I của giảm phân.","level": "VD","points": 0.5,"q": "Trao đổi chéo giữa các NST tương đồng xảy ra ở kì nào?","type": "short"},{"answer": "2","explain": "Kì giữa II mỗi tế bào có n NST kép; kì sau II tách thành 2n NST đơn, mỗi cực nhận n NST đơn.","level": "VDC","points": 0.5,"q": "Tế bào có 2n = 10 đang ở kì sau II. Mỗi cực tế bào có bao nhiêu NST đơn? (trả lời bằng số)","type": "short"}]},{"name": "Đề 5","questions": [{"answer": "C","explain": "Tinh trùng và trứng là giao tử đơn bội được tạo ra nhờ giảm phân.","level": "NB","options": ["A. tế bào sinh dưỡng.","B. tế bào máu.","C. giao tử (tinh trùng, trứng).","D. tế bào thần kinh."],"points": 0.25,"q": "Sản phẩm trực tiếp của giảm phân ở động vật là","type": "mcq"},{"answer": "A","explain": "Phân li độc lập: các cặp NST tương đồng phân li ngẫu nhiên về 2 cực.","level": "NB","options": ["A. các cặp NST tương đồng phân li ngẫu nhiên về 2 cực.","B. NST kép tách ở tâm động.","C. NST xếp 1 hàng ở xích đạo.","D. ADN nhân đôi."],"points": 0.25,"q": "Phân li độc lập là hiện tượng","type": "mcq"},{"answer": "D","explain": "n = 23: mỗi giao tử người có 23 NST.","level": "NB","options": ["A. 46","B. 92","C. 69","D. 23"],"points": 0.25,"q": "Người có 2n = 46. Mỗi giao tử có bao nhiêu NST?","type": "mcq"},{"answer": "A","explain": "Giảm phân tạo giao tử n khác nhau về tổ hợp NST → biến dị tổ hợp.","level": "TH","options": ["A. tạo ra các giao tử khác nhau về tổ hợp NST.","B. giữ nguyên tổ hợp NST của bố mẹ.","C. làm tăng số lượng NST.","D. nhân đôi ADN nhiều lần."],"points": 0.25,"q": "Cơ sở tế bào học của biến dị tổ hợp là","type": "mcq"},{"answer": "C","explain": "Nguyên phân: 2 TB con 2n giống mẹ; giảm phân: 4 TB con n khác nhau.","level": "TH","options": ["A. Số tế bào con tạo ra.","B. Số lần nhân đôi ADN.","C. Cả số tế bào con và bộ NST của chúng.","D. Kì trung gian."],"points": 0.25,"q": "Điểm khác nhau cơ bản nhất về kết quả giữa nguyên phân và giảm phân là","type": "mcq"},{"answer": "B","explain": "Kì giữa I xếp 2 hàng là đặc điểm riêng của giảm phân I, không có ở nguyên phân.","level": "VDC","options": ["A. kì đầu.","B. kì giữa I.","C. kì sau II.","D. kì cuối II."],"points": 0.25,"q": "Quan sát thấy các NST kép xếp thành 2 hàng trên mặt phẳng xích đạo. Có thể kết luận tế bào đang ở kì nào?","type": "mcq"},{"answer": ["F","T","T","T"],"explain": "a) Sai: giảm phân II không có nhân đôi ADN. b) Đúng. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nhân đôi ADN trong giảm phân:","statements": ["a) ADN nhân đôi 1 lần trước mỗi lần phân bào của giảm phân.","b) Kì trung gian trước giảm phân I có pha S nhân đôi ADN.","c) Sau nhân đôi, NST ở dạng NST kép.","d) Giảm phân II không có sự nhân đôi ADN."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: kì sau I NST kép nguyên vẹn về cực. c) Đúng. d) Sai: giảm phân tạo 4 TB con.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau:","statements": ["a) Kì giữa I khác kì giữa của nguyên phân ở cách xếp hàng NST.","b) Kì sau I: NST kép tách ở tâm động thành NST đơn.","c) Giảm phân II kết thúc tạo 4 tế bào con đơn bội.","d) Giảm phân tạo 2 tế bào con lưỡng bội."],"type": "truefalse"},{"answer": "4","explain": "1 tế bào mẹ qua giảm phân tạo 4 tế bào con.","level": "VD","points": 0.5,"q": "Từ 1 tế bào sinh trứng qua giảm phân tạo ra bao nhiêu trứng? (trả lời bằng số)","type": "short"},{"answer": "23","explain": "Người 2n = 46, giao tử n = 23 NST.","level": "VDC","points": 0.5,"q": "Mỗi tinh trùng của người có bao nhiêu NST? (trả lời bằng số)","type": "short"}]},{"name": "Đề 6","questions": [{"answer": "B","explain": "Cặp NST tương đồng: 2 NST giống nhau về hình dạng, kích thước, một có nguồn gốc từ bố, một từ mẹ.","level": "NB","options": ["A. 2 chromatid của một NST kép.","B. 2 NST giống nhau về hình dạng, một từ bố một từ mẹ.","C. 2 NST đơn ở 2 cực tế bào.","D. 2 NST kép xếp 1 hàng."],"points": 0.25,"q": "Cặp NST tương đồng là","type": "mcq"},{"answer": "D","explain": "Sau giảm phân II, NST ở dạng đơn, mỗi tế bào con có n NST đơn.","level": "NB","options": ["A. 2n kép.","B. 2n đơn.","C. n kép.","D. n đơn."],"points": 0.25,"q": "Trạng thái NST của tế bào con sau khi kết thúc giảm phân II là","type": "mcq"},{"answer": "A","explain": "Thụ tinh khôi phục 2n nên bộ NST loài ổn định qua các thế hệ.","level": "NB","options": ["A. duy trì ổn định bộ NST của loài qua các thế hệ.","B. làm tăng gấp đôi bộ NST mỗi thế hệ.","C. tạo ra loài mới ngay lập tức.","D. làm giảm dần bộ NST qua các thế hệ."],"points": 0.25,"q": "Nhờ giảm phân kết hợp với thụ tinh, bộ NST của loài được","type": "mcq"},{"answer": "C","explain": "Không tách tâm động ở kì sau I nên mỗi cực nhận nguyên NST kép.","level": "TH","options": ["A. NST kép tách ở tâm động.","B. NST tháo xoắn hoàn toàn.","C. mỗi NST kép đi nguyên vẹn về 1 cực.","D. NST xếp 1 hàng ở xích đạo."],"points": 0.25,"q": "Vì sao sau giảm phân I, NST ở tế bào con vẫn ở dạng kép?","type": "mcq"},{"answer": "B","explain": "Cùng là phân bào nhưng số lần phân bào, cách xếp NST và kết quả khác nhau.","level": "TH","options": ["A. Vì cả hai đều có 4 kì phân chia nhân.","B. Vì số lần phân bào và bộ NST của tế bào con khác nhau.","C. Vì cả hai đều tạo giao tử.","D. Vì cả hai đều có tiếp hợp NST."],"points": 0.25,"q": "Vì sao không thể coi giảm phân I là một lần nguyên phân?","type": "mcq"},{"answer": "A","explain": "Kì sau I NST kép nguyên vẹn về cực làm số NST mỗi tế bào con giảm một nửa nhưng vẫn ở dạng kép.","level": "VDC","options": ["A. Kì sau I: NST kép đi nguyên vẹn về cực nên số NST giảm một nửa nhưng vẫn ở dạng kép.","B. Kì sau II: NST kép đi nguyên vẹn về cực.","C. Kì giữa I: NST tách ở tâm động.","D. Kì đầu II: NST nhân đôi."],"points": 0.25,"q": "Giải thích vì sao sau giảm phân I, số lượng NST giảm một nửa nhưng NST vẫn ở dạng kép:","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: giảm phân tạo giao tử phục vụ sinh sản hữu tính. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về ý nghĩa giảm phân:","statements": ["a) Giảm phân tạo ra giao tử đơn bội.","b) Giảm phân tạo nguồn biến dị tổ hợp.","c) Giảm phân giúp cơ thể sinh trưởng.","d) Giảm phân cùng thụ tinh duy trì bộ NST loài."],"type": "truefalse"},{"answer": ["F","T","T","T"],"explain": "a) Sai: 2n = 14 → n = 7. b) Đúng. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về đậu Hà Lan (2n = 14):","statements": ["a) Mỗi giao tử có 14 NST.","b) Sau giảm phân I, mỗi tế bào con có 7 NST kép.","c) Ở kì giữa I có 14 NST kép xếp 2 hàng.","d) Ở kì sau II, mỗi cực nhận 7 NST đơn."],"type": "truefalse"},{"answer": "Kì sau I","explain": "Phân li độc lập diễn ra ở kì sau I.","level": "VD","points": 0.5,"q": "Hiện tượng các cặp NST tương đồng phân li ngẫu nhiên về 2 cực diễn ra ở kì nào?","type": "short"},{"answer": "7","explain": "Đậu Hà Lan 2n = 14, giao tử n = 7 NST.","level": "VDC","points": 0.5,"q": "Giao tử của đậu Hà Lan (2n = 14) có bao nhiêu NST? (trả lời bằng số)","type": "short"}]},{"name": "Đề 7","questions": [{"answer": "B","explain": "Kì cuối I tạo 2 tế bào con (n kép), chưa phải 4 tế bào n.","level": "NB","options": ["A. kì đầu I.","B. kì cuối I.","C. kì cuối II.","D. kì sau II."],"points": 0.25,"q": "Kết thúc giảm phân I tạo ra 2 tế bào con. Các tế bào này đang ở trạng thái nào?","type": "mcq"},{"answer": "D","explain": "Giao tử khác nhau về tổ hợp NST nhờ trao đổi chéo và phân li độc lập.","level": "NB","options": ["A. Đột biến luôn xảy ra.","B. Số NST của giao tử khác nhau.","C. ADN nhân đôi nhiều lần.","D. Trao đổi chéo và phân li độc lập tạo tổ hợp NST mới."],"points": 0.25,"q": "Nguyên nhân tạo ra sự khác nhau giữa các giao tử là","type": "mcq"},{"answer": "A","explain": "Kì đầu II ngắn, NST kép co xoắn, thoi phân bào hình thành trở lại.","level": "NB","options": ["A. kì đầu II.","B. kì giữa I.","C. kì sau I.","D. kì cuối I."],"points": 0.25,"q": "Kì nào mở đầu cho giảm phân II?","type": "mcq"},{"answer": "D","explain": "Kì giữa II giống kì giữa nguyên phân: NST kép xếp 1 hàng.","level": "TH","options": ["A. kì giữa I.","B. kì đầu I.","C. kì sau I.","D. kì giữa II."],"points": 0.25,"q": "Kì nào của giảm phân có diễn biến giống kì giữa của nguyên phân nhất?","type": "mcq"},{"answer": "A","explain": "Giảm phân I: 2n → n (giảm số lượng); giảm phân II: tách chromatid, số NST không đổi.","level": "TH","options": ["A. Giảm phân I làm giảm số NST, giảm phân II tách chromatid.","B. Giảm phân I tách chromatid, giảm phân II giảm số NST.","C. Cả hai đều làm giảm một nửa số NST.","D. Cả hai đều không làm thay đổi số NST."],"points": 0.25,"q": "Phân biệt vai trò của giảm phân I và giảm phân II đối với số lượng NST:","type": "mcq"},{"answer": "C","explain": "2n = 20 → kì giữa I có 20 NST kép; mỗi cực ở kì sau I nhận n = 10 NST kép.","level": "VDC","options": ["A. 20 và 20.","B. 10 và 10.","C. 20 và 10.","D. 40 và 20."],"points": 0.25,"q": "Tế bào ngô có 2n = 20. Số NST kép ở kì giữa I và số NST kép ở mỗi cực tại kì sau I lần lượt là","type": "mcq"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: kì sau I không tách tâm động. c) Đúng. d) Sai: nguyên phân không có trao đổi chéo.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về đặc điểm các kì:","statements": ["a) Kì đầu I: NST tiếp hợp và trao đổi chéo.","b) Kì sau I: NST kép tách ở tâm động.","c) Kì giữa II: NST kép xếp 1 hàng.","d) Nguyên phân cũng có trao đổi chéo như giảm phân."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: giảm phân tạo 4 TB con n. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về kết quả phân bào:","statements": ["a) Nguyên phân: 1 tế bào (2n) tạo 2 tế bào (2n).","b) Giảm phân: 1 tế bào (2n) tạo 4 tế bào (n).","c) Giảm phân: 1 tế bào (2n) tạo 2 tế bào (n).","d) Tế bào con của giảm phân khác nhau về tổ hợp NST."],"type": "truefalse"},{"answer": "2","explain": "Giảm phân gồm 2 lần phân bào liên tiếp.","level": "VD","points": 0.5,"q": "Giảm phân gồm mấy lần phân bào liên tiếp? (trả lời bằng số)","type": "short"},{"answer": "10","explain": "Ngô 2n = 20, kì sau I mỗi cực nhận n = 10 NST kép.","level": "VDC","points": 0.5,"q": "Tế bào ngô (2n = 20) ở kì sau I, mỗi cực có bao nhiêu NST kép? (trả lời bằng số)","type": "short"}]},{"name": "Đề 8","questions": [{"answer": "C","explain": "Thụ tinh kết hợp 2 giao tử n tạo hợp tử 2n.","level": "NB","options": ["A. 2n.","B. 4n.","C. n.","D. 3n."],"points": 0.25,"q": "Bộ NST của giao tử sau giảm phân là","type": "mcq"},{"answer": "B","explain": "Noãn (trứng) là giao tử cái đơn bội.","level": "NB","options": ["A. tế bào sinh dưỡng.","B. giao tử cái đơn bội.","C. tế bào sinh dục sơ khai.","D. hợp tử."],"points": 0.25,"q": "Tế bào trứng được tạo ra từ giảm phân là","type": "mcq"},{"answer": "D","explain": "Kì cuối II: 4 tế bào con n, NST tháo xoắn, màng nhân xuất hiện.","level": "NB","options": ["A. kì cuối I.","B. kì giữa II.","C. kì sau I.","D. kì cuối II."],"points": 0.25,"q": "Kì nào kết thúc toàn bộ quá trình giảm phân?","type": "mcq"},{"answer": "A","explain": "Không có kì trung gian nhân đôi ADN giữa GP I và GP II.","level": "TH","options": ["A. Không có sự nhân đôi ADN giữa giảm phân I và II.","B. Có sự nhân đôi ADN giữa giảm phân I và II.","C. NST kép tách ở tâm động ở kì sau I.","D. Kì giữa I xếp NST thành 1 hàng."],"points": 0.25,"q": "Điểm khác nhau giữa khoảng nghỉ của giảm phân I-II với kì trung gian trước nguyên phân là","type": "mcq"},{"answer": "C","explain": "Giảm phân tạo giao tử n, thụ tinh khôi phục 2n nên bộ NST loài không đổi qua các thế hệ.","level": "TH","options": ["A. Số NST tăng gấp đôi mỗi thế hệ.","B. Số NST giảm một nửa mỗi thế hệ.","C. Số NST được duy trì ổn định qua các thế hệ.","D. Số NST thay đổi ngẫu nhiên."],"points": 0.25,"q": "Nhờ giảm phân kết hợp thụ tinh, qua nhiều thế hệ sinh sản hữu tính thì bộ NST của loài","type": "mcq"},{"answer": "B","explain": "n = 12 → kì giữa II có 12 NST kép; kì sau II tách thành 24 NST đơn, mỗi cực 12.","level": "VDC","options": ["A. 12 và 6.","B. 12 và 12.","C. 24 và 12.","D. 6 và 6."],"points": 0.25,"q": "Tế bào có 2n = 24. Số NST kép ở kì giữa II và số NST đơn ở mỗi cực tại kì sau II lần lượt là","type": "mcq"},{"answer": ["F","T","T","T"],"explain": "a) Sai: tiếp hợp chỉ có ở kì đầu I của giảm phân. b) Đúng. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về tiếp hợp:","statements": ["a) Tiếp hợp xảy ra ở kì đầu của nguyên phân.","b) Tiếp hợp là sự bắt cặp của các NST tương đồng.","c) Tiếp hợp tạo điều kiện cho trao đổi chéo.","d) Trao đổi chéo chỉ xảy ra sau khi đã tiếp hợp."],"type": "truefalse"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: nguyên phân tạo TB con giống hệt mẹ. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về biến dị:","statements": ["a) Giảm phân là cơ sở tạo biến dị tổ hợp.","b) Nguyên phân cũng tạo biến dị tổ hợp như giảm phân.","c) Trao đổi chéo làm tăng biến dị tổ hợp.","d) Thụ tinh ngẫu nhiên góp phần tạo biến dị tổ hợp."],"type": "truefalse"},{"answer": "n","explain": "Giao tử có bộ NST đơn bội n.","level": "VD","points": 0.5,"q": "Bộ NST của giao tử là bao nhiêu? (trả lời dạng n)","type": "short"},{"answer": "12","explain": "2n = 24, kì sau II mỗi cực nhận n = 12 NST đơn.","level": "VDC","points": 0.5,"q": "Tế bào (2n = 24) ở kì sau II, mỗi cực có bao nhiêu NST đơn? (trả lời bằng số)","type": "short"}]},{"name": "Đề 9","questions": [{"answer": "A","explain": "Kì đầu I dài và phức tạp với tiếp hợp và trao đổi chéo.","level": "NB","options": ["A. kì đầu I.","B. kì giữa I.","C. kì sau I.","D. kì giữa II."],"points": 0.25,"q": "Kì nào dài nhất và phức tạp nhất trong giảm phân?","type": "mcq"},{"answer": "D","explain": "Giảm phân tạo giao tử phục vụ sinh sản hữu tính.","level": "NB","options": ["A. sinh trưởng.","B. tái sinh mô.","C. sinh sản vô tính.","D. sinh sản hữu tính."],"points": 0.25,"q": "Giảm phân có vai trò trực tiếp trong hình thức sinh sản nào?","type": "mcq"},{"answer": "B","explain": "4 tế bào con n khác nhau về tổ hợp NST.","level": "NB","options": ["A. 2 tế bào 2n giống nhau.","B. 4 tế bào n khác nhau về tổ hợp NST.","C. 4 tế bào 2n giống nhau.","D. 2 tế bào n giống nhau."],"points": 0.25,"q": "Sản phẩm của giảm phân gồm","type": "mcq"},{"answer": "C","explain": "Nguyên phân: NST kép xếp 1 hàng rồi tách tâm động; GP I: xếp 2 hàng, NST kép nguyên vẹn về cực.","level": "TH","options": ["A. Số lần phân bào.","B. Có hay không có kì trung gian.","C. Cách xếp hàng NST ở kì giữa và cách phân li ở kì sau.","D. Có hay không có thoi phân bào."],"points": 0.25,"q": "Điểm khác nhau rõ nhất giữa nguyên phân và giảm phân I là","type": "mcq"},{"answer": "A","explain": "Rối loạn phân li ở GP I làm giao tử thừa/thiếu NST → hội chứng NST.","level": "TH","options": ["A. NST không phân li ở kì sau I gây thừa/thiếu NST ở giao tử.","B. ADN không nhân đôi.","C. NST không đóng xoắn.","D. Tế bào chất không phân chia."],"points": 0.25,"q": "Rối loạn giảm phân có thể gây hậu quả gì?","type": "mcq"},{"answer": "D","explain": "Kì sau I: NST kép nguyên vẹn về cực; kì sau II: tách tâm động như nguyên phân.","level": "VDC","options": ["A. Đều tách tâm động.","B. Đều không tách tâm động.","C. Kì sau nguyên phân không tách tâm động.","D. Kì sau I không tách tâm động, kì sau nguyên phân có tách tâm động."],"points": 0.25,"q": "So sánh kì sau I của giảm phân với kì sau của nguyên phân:","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: NST kép xếp 2 hàng ở kì giữa I. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về kì giữa các loại phân bào:","statements": ["a) Kì giữa nguyên phân: NST kép xếp 1 hàng.","b) Kì giữa I: NST kép xếp 2 hàng.","c) Kì giữa II: NST kép xếp 2 hàng.","d) Kì giữa là lúc NST co xoắn cực đại."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: 2n = 8 → n = 4. b) Đúng. c) Đúng. d) Sai: giảm phân tạo 4 TB con.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về ruồi giấm (2n = 8):","statements": ["a) Mỗi giao tử có 8 NST.","b) Kì giữa I có 8 NST kép xếp 2 hàng.","c) Kì sau I mỗi cực nhận 4 NST kép.","d) 1 tế bào qua giảm phân tạo 2 giao tử."],"type": "truefalse"},{"answer": "Kì sau II","explain": "Kì sau II: NST kép tách ở tâm động thành NST đơn.","level": "VD","points": 0.5,"q": "Trong giảm phân, NST kép tách ở tâm động tại kì nào?","type": "short"},{"answer": "4","explain": "Ruồi giấm 2n = 8, giao tử n = 4 NST.","level": "VDC","points": 0.5,"q": "Mỗi giao tử của ruồi giấm (2n = 8) có bao nhiêu NST? (trả lời bằng số)","type": "short"}]},{"name": "Đề 10","questions": [{"answer": "C","explain": "Hợp tử 2n nguyên phân tạo cơ thể; tế bào sinh dục giảm phân tạo giao tử.","level": "NB","options": ["A. nguyên phân - nguyên phân.","B. giảm phân - giảm phân.","C. nguyên phân - giảm phân.","D. giảm phân - nguyên phân."],"points": 0.25,"q": "Hợp tử phát triển thành cơ thể nhờ (1), tế bào sinh dục chín tạo giao tử nhờ (2). (1), (2) lần lượt là","type": "mcq"},{"answer": "B","explain": "Chọn giống dựa trên biến dị tổ hợp do giảm phân và thụ tinh tạo ra.","level": "NB","options": ["A. đột biến nhân tạo.","B. biến dị tổ hợp do giảm phân và thụ tinh.","C. nguyên phân.","D. thường biến."],"points": 0.25,"q": "Công tác chọn giống cây trồng, vật nuôi chủ yếu dựa vào nguồn biến dị nào?","type": "mcq"},{"answer": "A","explain": "n kép: số NST đã giảm một nửa nhưng vẫn ở dạng kép.","level": "NB","options": ["A. n kép.","B. 2n kép.","C. n đơn.","D. 2n đơn."],"points": 0.25,"q": "Sau giảm phân I, bộ NST của mỗi tế bào con là","type": "mcq"},{"answer": "D","explain": "NST kép nguyên vẹn về cực ở kì sau I là đặc trưng của giảm phân I.","level": "TH","options": ["A. kì sau của nguyên phân.","B. kì sau II.","C. kì giữa I.","D. kì sau I."],"points": 0.25,"q": "Hiện tượng NST kép đi nguyên vẹn về 2 cực (không tách tâm động) xảy ra ở","type": "mcq"},{"answer": "B","explain": "Thụ tinh khôi phục 2n từ 2 giao tử n nên bộ NST loài ổn định.","level": "TH","options": ["A. Giảm phân tạo giao tử 2n.","B. Thụ tinh kết hợp 2 giao tử n thành hợp tử 2n.","C. Nguyên phân tạo giao tử.","D. Giảm phân nhân đôi bộ NST."],"points": 0.25,"q": "Cơ chế duy trì bộ NST lưỡng bội qua sinh sản hữu tính là","type": "mcq"},{"answer": "A","explain": "Kì sau I mỗi cực nhận n NST kép; kì sau II tách thành 2n NST đơn, mỗi cực n NST đơn.","level": "VDC","options": ["A. 7 NST kép và 7 NST đơn.","B. 14 NST kép và 14 NST đơn.","C. 7 NST kép và 14 NST đơn.","D. 14 NST kép và 7 NST đơn."],"points": 0.25,"q": "Tế bào đậu Hà Lan (2n = 14). Số NST ở mỗi cực tại kì sau I và tại kì sau II lần lượt là","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: giảm phân II không nhân đôi ADN. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về trình tự giảm phân:","statements": ["a) Giảm phân I diễn ra trước giảm phân II.","b) ADN nhân đôi trước mỗi lần phân bào của giảm phân.","c) Tế bào con của giảm phân I tiếp tục bước vào giảm phân II.","d) Kì cuối II tạo 4 tế bào con đơn bội."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: n = 23. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về người (2n = 46):","statements": ["a) Tế bào sinh tinh giảm phân tạo 4 tinh trùng.","b) Kì đầu I có hiện tượng tiếp hợp và trao đổi chéo.","c) Mỗi trứng có 46 NST.","d) Thụ tinh tạo hợp tử có 46 NST."],"type": "truefalse"},{"answer": "Giảm phân I","explain": "Giảm phân I làm giảm số lượng NST từ 2n xuống n.","level": "VD","points": 0.5,"q": "Lần phân bào nào của giảm phân làm giảm số lượng NST?","type": "short"},{"answer": "n kép","explain": "Sau giảm phân I, mỗi tế bào con có bộ NST n kép.","level": "VDC","points": 0.5,"q": "Tế bào con sau giảm phân I có bộ NST như thế nào? (trả lời dạng n kép)","type": "short"}]}]}
