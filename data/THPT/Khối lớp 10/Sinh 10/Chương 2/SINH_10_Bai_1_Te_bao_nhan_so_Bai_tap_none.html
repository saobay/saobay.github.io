<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1","questions": [{"answer": "A","explain": "Tế bào nhân sơ chưa có nhân hoàn chỉnh (chỉ có vùng nhân không màng bao bọc), chưa có hệ nội màng và bào quan có màng.","level": "NB","options": ["A. Chưa có nhân hoàn chỉnh, vật chất di truyền nằm trong vùng nhân","B. Có đầy đủ ti thể, lục lạp và hệ nội màng","C. DNA được màng nhân bao bọc","D. Có nhiều nhiễm sắc thể trong nhân"],"points": 0.25,"q": "Dấu hiệu cơ bản nhất để nhận biết tế bào nhân sơ là","type": "mcq"},{"answer": "A","explain": "Vùng nhân chứa một phân tử DNA vòng, kép, trần (không liên kết histon), không có màng bao bọc.","level": "NB","options": ["A. Một phân tử DNA vòng, kép, không liên kết với protein histon","B. Nhiều nhiễm sắc thể dạng thẳng","C. DNA liên kết chặt với protein histon","D. Nhân con và dịch nhân"],"points": 0.25,"q": "Vùng nhân của tế bào nhân sơ chứa","type": "mcq"},{"answer": "C","explain": "Tế bào nhân sơ không có bào quan có màng bao bọc; ribosome (loại 70S) là bào quan duy nhất, làm nhiệm vụ tổng hợp protein.","level": "NB","options": ["A. Ti thể","B. Lục lạp","C. Ribosome","D. Bộ máy Golgi"],"points": 0.25,"q": "Bào quan duy nhất có trong tế bào nhân sơ là","type": "mcq"},{"answer": "C","explain": "Thành tế bào vi khuẩn cấu tạo chủ yếu từ peptidoglycan (chuỗi carbohydrate liên kết với đoạn peptide ngắn).","level": "TH","options": ["A. Cellulose","B. Kitin","C. Peptidoglycan","D. Phospholipid"],"points": 0.25,"q": "Thành tế bào của vi khuẩn được cấu tạo chủ yếu từ","type": "mcq"},{"answer": "C","explain": "Vi khuẩn Gram dương có thành peptidoglycan dày nên giữ màu tím; Gram âm có thành mỏng và thêm màng ngoài, bắt màu hồng/đỏ.","level": "TH","options": ["A. Có thành peptidoglycan mỏng và màng ngoài","B. Không có thành tế bào","C. Có thành peptidoglycan dày, bắt màu tím khi nhuộm Gram","D. Có màng nhân bao bọc DNA"],"points": 0.25,"q": "Vi khuẩn Gram dương khác vi khuẩn Gram âm ở đặc điểm nào sau đây?","type": "mcq"},{"answer": "B","explain": "Tế bào càng nhỏ thì tỉ lệ S/V càng lớn, diện tích trao đổi chất trên mỗi đơn vị thể tích càng nhiều nên trao đổi chất nhanh.","level": "VD","options": ["A. Vì có nhiều ti thể cung cấp năng lượng","B. Vì tỉ lệ diện tích bề mặt trên thể tích (S/V) lớn","C. Vì kích thước tế bào rất lớn","D. Vì có hệ thống nội màng phát triển"],"points": 0.25,"q": "Vì sao tế bào vi khuẩn có tốc độ trao đổi chất với môi trường rất nhanh?","type": "mcq"},{"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng: vi khuẩn không có ti thể nên enzyme hô hấp nằm trên màng tế bào gấp nếp. d) Sai: vi khuẩn không có lục lạp (vi khuẩn lam quang hợp nhờ hệ sắc tố trên màng).","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về đặc điểm chung của tế bào nhân sơ:","statements": ["a) Tế bào nhân sơ có vùng nhân chứa DNA dạng vòng.","b) Ribosome của vi khuẩn là loại 70S, làm nhiệm vụ tổng hợp protein.","c) Ở vi khuẩn hiếu khí, màng tế bào gấp nếp là nơi diễn ra hô hấp.","d) Tế bào vi khuẩn có lục lạp để quang hợp."],"type": "truefalse"},{"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng. c) Sai: roi giúp di chuyển, lông giúp bám vào bề mặt. d) Sai: DNA vùng nhân trần, không liên kết histon.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về các thành phần của tế bào vi khuẩn:","statements": ["a) Plasmid là DNA vòng nhỏ nằm ngoài vùng nhân, có thể mang gene kháng thuốc kháng sinh.","b) Vỏ nhầy giúp vi khuẩn gây bệnh tránh bị bạch cầu thực bào.","c) Lông của vi khuẩn có chức năng giúp vi khuẩn di chuyển.","d) DNA ở vùng nhân liên kết với protein histon như ở tế bào nhân thực."],"type": "truefalse"},{"answer": "Vùng nhân","explain": "Vùng nhân (nucleoid) chứa một phân tử DNA vòng, kép mang thông tin di truyền chính; gọi là vùng nhân vì không có màng bao bọc.","level": "TH","points": 0.5,"q": "Cấu trúc nào của vi khuẩn chứa phân tử DNA vòng mang thông tin di truyền chính của tế bào?","type": "short"},{"answer": "64","explain": "2 giờ = 120 phút, số lần phân đôi n = 120/20 = 6. Số tế bào = 2^6 = 64.","level": "VDC","points": 0.5,"q": "Một vi khuẩn phân đôi mỗi 20 phút trong điều kiện thuận lợi. Sau 2 giờ, từ 1 tế bào ban đầu sẽ tạo ra bao nhiêu tế bào con? (Chỉ ghi số)","type": "short"}]},{"name": "Đề 2","questions": [{"answer": "C","explain": "Vi khuẩn E. coli là tế bào nhân sơ; các ví dụ còn lại đều là tế bào nhân thực.","level": "NB","options": ["A. Tế bào biểu bì vảy hành","B. Tế bào cơ của người","C. Vi khuẩn E. coli","D. Tế bào nấm men"],"points": 0.25,"q": "Ví dụ nào sau đây là tế bào nhân sơ?","type": "mcq"},{"answer": "B","explain": "Thành tế bào (peptidoglycan) bảo vệ tế bào, giữ hình dạng ổn định và chống áp suất thẩm thấu từ bên trong.","level": "NB","options": ["A. Tổng hợp protein cho tế bào","B. Bảo vệ tế bào và giữ hình dạng ổn định","C. Chứa thông tin di truyền","D. Thực hiện quang hợp"],"points": 0.25,"q": "Chức năng chủ yếu của thành tế bào vi khuẩn là","type": "mcq"},{"answer": "C","explain": "Roi dài, giúp vi khuẩn di chuyển; lông (ngắn, nhiều) giúp bám vào bề mặt.","level": "NB","options": ["A. Giúp vi khuẩn bám vào bề mặt","B. Tổng hợp ATP cho tế bào","C. Giúp vi khuẩn di chuyển","D. Bảo vệ vi khuẩn khỏi kháng sinh"],"points": 0.25,"q": "Roi của vi khuẩn có chức năng","type": "mcq"},{"answer": "B","explain": "Lông ngắn, nhiều, giúp vi khuẩn bám vào bề mặt, tế bào chủ; một số loại tham gia tiếp hợp.","level": "TH","options": ["A. Giúp vi khuẩn di chuyển nhanh","B. Giúp vi khuẩn bám vào bề mặt hoặc tế bào chủ","C. Thực hiện quá trình hô hấp","D. Tổng hợp protein"],"points": 0.25,"q": "Lông (pili) của vi khuẩn có vai trò chủ yếu là","type": "mcq"},{"answer": "B","explain": "DNA vùng nhân là một phân tử kép, dạng vòng, trần (không liên kết histon), không có màng bao bọc.","level": "TH","options": ["A. Dạng thẳng, liên kết với protein histon","B. Dạng vòng, kép, không liên kết với protein histon","C. Được màng nhân kép bao bọc","D. Nằm trong nhân con"],"points": 0.25,"q": "DNA ở vùng nhân của tế bào vi khuẩn có đặc điểm","type": "mcq"},{"answer": "C","explain": "Vùng nhân chứa DNA nhưng không có màng nhân bao bọc nên chưa phải là nhân hoàn chỉnh, vì vậy gọi là vùng nhân.","level": "VD","options": ["A. Vì không chứa vật chất di truyền","B. Vì nằm bên ngoài tế bào chất","C. Vì không có màng nhân bao bọc","D. Vì chứa nhiều nhân con"],"points": 0.25,"q": "Vì sao người ta gọi là vùng nhân mà không gọi là nhân tế bào?","type": "mcq"},{"answer": ["F","T","T","F"],"explain": "a) Sai: chỉ một số vi khuẩn (thường gây bệnh) có vỏ nhầy. b) Đúng. c) Đúng. d) Sai: Gram âm có thành mỏng, Gram dương có thành dày.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về cấu tạo tế bào vi khuẩn:","statements": ["a) Mọi tế bào vi khuẩn đều có vỏ nhầy bao bọc bên ngoài.","b) Ribosome 70S của vi khuẩn là nơi tổng hợp protein.","c) Màng tế bào vi khuẩn có cấu tạo từ lớp kép phospholipid xen kẽ protein.","d) Vi khuẩn Gram âm có thành peptidoglycan dày hơn vi khuẩn Gram dương."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng: vi khuẩn lam quang hợp nhờ hệ sắc tố trên màng tế bào. b) Sai: vi khuẩn sinh sản bằng phân đôi (trực phân). c) Đúng. d) Sai: kích thước chỉ khoảng 0,5–5 micromet.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về vi khuẩn lam và plasmid:","statements": ["a) Vi khuẩn lam là tế bào nhân sơ có khả năng quang hợp.","b) Vi khuẩn sinh sản bằng hình thức nguyên phân.","c) Plasmid có thể được truyền từ vi khuẩn này sang vi khuẩn khác.","d) Kích thước tế bào nhân sơ khoảng 10–100 micromet."],"type": "truefalse"},{"answer": "Peptidoglycan","explain": "Thành tế bào vi khuẩn cấu tạo chủ yếu từ peptidoglycan.","level": "TH","points": 0.5,"q": "Hợp chất cấu tạo nên thành tế bào của vi khuẩn có tên là gì?","type": "short"},{"answer": "1600","explain": "Số lần phân đôi n = 120/30 = 4. Số tế bào = 100 × 2^4 = 1600.","level": "VDC","points": 0.5,"q": "Một quần thể có 100 tế bào vi khuẩn, mỗi tế bào phân đôi sau mỗi 30 phút. Sau 2 giờ, quần thể có bao nhiêu tế bào? (Chỉ ghi số)","type": "short"}]},{"name": "Đề 3","questions": [{"answer": "B","explain": "Tế bào nhân sơ có màng tế bào, tế bào chất và ribosome nhưng chưa có nhân hoàn chỉnh (chỉ có vùng nhân).","level": "NB","options": ["A. Màng tế bào","B. Nhân hoàn chỉnh có màng bao bọc","C. Tế bào chất","D. Ribosome"],"points": 0.25,"q": "Tế bào nhân sơ chưa có thành phần nào sau đây?","type": "mcq"},{"answer": "B","explain": "Tế bào nhân sơ không có bào quan có màng bao bọc nên không có ti thể.","level": "NB","options": ["A. Ribosome","B. Ti thể","C. Vùng nhân","D. Bào tương"],"points": 0.25,"q": "Tế bào chất của tế bào nhân sơ KHÔNG chứa thành phần nào?","type": "mcq"},{"answer": "B","explain": "Màng tế bào là ranh giới có tính thấm chọn lọc, kiểm soát các chất ra vào tế bào.","level": "TH","options": ["A. Bảo vệ khỏi thuốc kháng sinh","B. Trao đổi chất có chọn lọc với môi trường","C. Tổng hợp DNA vùng nhân","D. Thực hiện quang hợp"],"points": 0.25,"q": "Chức năng chính của màng tế bào ở vi khuẩn là","type": "mcq"},{"answer": "C","explain": "Vi khuẩn không có ti thể; enzyme hô hấp nằm trên màng tế bào (gấp nếp vào trong để tăng diện tích).","level": "TH","options": ["A. Ti thể","B. Lục lạp","C. Trên màng tế bào gấp nếp vào trong","D. Trong vùng nhân"],"points": 0.25,"q": "Ở vi khuẩn hiếu khí, quá trình hô hấp tế bào diễn ra chủ yếu ở","type": "mcq"},{"answer": "B","explain": "Vỏ nhầy (capsule) giúp vi khuẩn tránh bị bạch cầu thực bào và bám dính tốt hơn vào tế bào chủ.","level": "VD","options": ["A. Mất khả năng di chuyển","B. Khó bị bạch cầu thực bào hơn","C. Không sinh sản được","D. Ngừng trao đổi chất"],"points": 0.25,"q": "Vi khuẩn gây bệnh có lớp vỏ nhầy bên ngoài sẽ","type": "mcq"},{"answer": "C","explain": "Peptidoglycan là thành phần chính của thành tế bào vi khuẩn; ức chế tổng hợp nó làm thành tế bào không hoàn chỉnh, vi khuẩn dễ vỡ và chết.","level": "VDC","options": ["A. Ngăn vi khuẩn tổng hợp protein","B. Phá hủy DNA của vi khuẩn","C. Làm vi khuẩn không hình thành được thành tế bào nên dễ bị vỡ","D. Ức chế quá trình quang hợp"],"points": 0.25,"q": "Một loại kháng sinh ức chế quá trình tổng hợp peptidoglycan. Tác dụng của nó là","type": "mcq"},{"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng: phân đôi (trực phân). c) Sai: chưa có hệ nội màng. d) Sai: phân bố rộng khắp (đất, nước, không khí, cơ thể sinh vật).","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về kích thước và sinh sản của vi khuẩn:","statements": ["a) Tế bào nhân sơ có kích thước khoảng 0,5–5 micromet.","b) Tế bào nhân sơ sinh sản bằng hình thức phân đôi.","c) Tế bào nhân sơ có hệ thống nội màng phát triển.","d) Tế bào nhân sơ chỉ phân bố trong đất."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng (trong điều kiện thuận lợi). c) Sai: Gram dương bắt màu tím, Gram âm bắt màu hồng/đỏ. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về tỉ lệ S/V và nhuộm Gram:","statements": ["a) Tỉ lệ S/V càng lớn thì tế bào trao đổi chất với môi trường càng nhanh.","b) Tế bào có kích thước càng nhỏ thì sinh trưởng, phân chia càng nhanh.","c) Vi khuẩn Gram dương bắt màu hồng khi nhuộm Gram.","d) Thành tế bào giúp vi khuẩn chống lại áp suất thẩm thấu từ bên trong."],"type": "truefalse"},{"answer": "Ribosome","explain": "Ribosome (70S) là bào quan duy nhất của tế bào nhân sơ, làm nhiệm vụ tổng hợp protein.","level": "NB","points": 0.5,"q": "Bào quan duy nhất có trong tế bào nhân sơ có tên là gì?","type": "short"},{"answer": "70S","explain": "Tế bào nhân sơ có ribosome loại 70S (nhỏ hơn ribosome 80S của tế bào nhân thực).","level": "VDC","points": 0.5,"q": "Kí hiệu loại ribosome có trong tế bào nhân sơ là gì? (Ví dụ: 80S)","type": "short"}]},{"name": "Đề 4","questions": [{"answer": "B","explain": "Tế bào nhân sơ có vùng nhân chứa DNA vòng, không màng bao bọc; không có ti thể, lục lạp, hệ nội màng.","level": "NB","options": ["A. Có màng nhân bao bọc DNA","B. Có vùng nhân chứa DNA dạng vòng","C. Có đầy đủ ti thể và lục lạp","D. Có hệ thống nội màng"],"points": 0.25,"q": "Phát biểu nào sau đây đúng về tế bào nhân sơ?","type": "mcq"},{"answer": "B","explain": "Plasmid là DNA vòng nhỏ ngoài vùng nhân, mang một số gene (ví dụ gene kháng kháng sinh), có thể truyền giữa các vi khuẩn.","level": "TH","options": ["A. Một loại ribosome đặc biệt","B. DNA vòng nhỏ nằm ngoài vùng nhân","C. Lớp màng bao quanh vùng nhân","D. Thành phần cấu tạo của thành tế bào"],"points": 0.25,"q": "Plasmid ở tế bào vi khuẩn là","type": "mcq"},{"answer": "B","explain": "Kích thước nhỏ, cấu tạo đơn giản, trao đổi chất nhanh, sinh sản nhanh giúp vi khuẩn thích nghi và phân bố rộng khắp.","level": "TH","options": ["A. Có nhân hoàn chỉnh và hệ nội màng","B. Kích thước nhỏ, cấu tạo đơn giản, sinh sản nhanh","C. Kích thước rất lớn","D. Sống cố định một chỗ"],"points": 0.25,"q": "Những đặc điểm giúp vi khuẩn phân bố rộng khắp trong tự nhiên là","type": "mcq"},{"answer": "D","explain": "Điểm khác biệt cơ bản: tế bào nhân thực có nhân hoàn chỉnh (màng nhân) và hệ nội màng với bào quan có màng; nhân sơ thì chưa có.","level": "VD","options": ["A. Có màng tế bào hay không","B. Có tế bào chất hay không","C. Kích thước tế bào","D. Mức độ hoàn chỉnh của nhân và hệ thống màng trong tế bào"],"points": 0.25,"q": "Điểm khác biệt cơ bản nhất giữa tế bào nhân sơ và tế bào nhân thực là","type": "mcq"},{"answer": "C","explain": "Nhuộm Gram phân biệt vi khuẩn Gram dương (thành dày, màu tím) và Gram âm (thành mỏng, màu hồng) dựa vào cấu tạo thành tế bào.","level": "VD","options": ["A. Quan sát virus gây bệnh","B. Đếm số lượng nhiễm sắc thể","C. Phân biệt vi khuẩn dựa vào cấu tạo thành tế bào","D. Đo kích thước tế bào"],"points": 0.25,"q": "Phương pháp nhuộm Gram được dùng để","type": "mcq"},{"answer": "C","explain": "Thành tế bào giữ hình dạng ổn định; không có thành, tế bào dễ biến dạng và cần sống trong môi trường đẳng trương.","level": "VDC","options": ["A. Chúng không có màng tế bào","B. Chúng là tế bào nhân thực","C. Chúng có hình dạng không ổn định, dễ biến dạng","D. Chúng không thể sinh sản"],"points": 0.25,"q": "Vi khuẩn Mycoplasma không có thành tế bào. Dự đoán nào sau đây đúng về chúng?","type": "mcq"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: ribosome tổng hợp protein. c) Đúng. d) Sai: lông giúp bám, roi giúp di chuyển.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về vùng nhân và ribosome:","statements": ["a) DNA ở vùng nhân là phân tử kép, dạng vòng.","b) Ribosome của vi khuẩn làm nhiệm vụ tổng hợp lipid.","c) Màng tế bào vi khuẩn có tính thấm chọn lọc.","d) Roi của vi khuẩn giúp chúng bám vào tế bào chủ."],"type": "truefalse"},{"answer": ["F","T","F","T"],"explain": "a) Sai: vi khuẩn Gram âm có màng ngoài cản trở thuốc nên kém hiệu quả hơn. b) Đúng. c) Sai: vùng nhân chỉ có một DNA vòng. d) Đúng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về kháng sinh và plasmid:","statements": ["a) Penicillin ức chế tổng hợp thành tế bào nên diệt vi khuẩn Gram âm và Gram dương hiệu quả như nhau.","b) Vi khuẩn có thể nhận gene kháng thuốc từ vi khuẩn khác qua plasmid.","c) Vùng nhân chứa nhiều phân tử DNA dạng thẳng như nhiễm sắc thể.","d) Vi khuẩn lam vừa là tế bào nhân sơ vừa có khả năng quang hợp."],"type": "truefalse"},{"answer": "Roi","explain": "Roi (flagella) dài giúp vi khuẩn di chuyển.","level": "TH","points": 0.5,"q": "Cấu trúc nào giúp vi khuẩn di chuyển trong môi trường lỏng?","type": "short"},{"answer": "Lông","explain": "Lông (pili/fimbriae) ngắn, nhiều, giúp vi khuẩn bám vào bề mặt.","level": "VD","points": 0.5,"q": "Cấu trúc nào giúp vi khuẩn bám vào bề mặt hoặc tế bào chủ?","type": "short"}]},{"name": "Đề 5","questions": [{"answer": "C","explain": "Tế bào nhân sơ gồm thành tế bào, màng tế bào và tế bào chất (bào tương chứa ribosome, vùng nhân chứa DNA vòng).","level": "NB","options": ["A. Nhân hoàn chỉnh, ti thể, lục lạp","B. Màng nhân, nhiễm sắc thể, nhân con","C. Thành tế bào, màng tế bào, tế bào chất (vùng nhân, ribosome)","D. Thành cellulose, không bào lớn, lục lạp"],"points": 0.25,"q": "Các thành phần chính của tế bào nhân sơ gồm","type": "mcq"},{"answer": "B","explain": "Ribosome là nơi tổng hợp protein của tế bào.","level": "NB","options": ["A. Tổng hợp lipid","B. Tổng hợp protein","C. Thực hiện hô hấp","D. Thực hiện quang hợp"],"points": 0.25,"q": "Chức năng của ribosome trong tế bào vi khuẩn là","type": "mcq"},{"answer": "C","explain": "Tỉ lệ S/V lớn giúp tế bào nhỏ trao đổi chất nhanh với môi trường.","level": "TH","options": ["A. Vì có nhiều bào quan có màng","B. Vì nhân có kích thước lớn","C. Vì tỉ lệ diện tích bề mặt trên thể tích lớn","D. Vì thành tế bào rất dày"],"points": 0.25,"q": "Vì sao tế bào vi khuẩn có tốc độ trao đổi chất rất nhanh?","type": "mcq"},{"answer": "C","explain": "Vỏ nhầy giúp vi khuẩn gây bệnh tránh bị bạch cầu thực bào và bám dính tốt hơn.","level": "TH","options": ["A. Giúp vi khuẩn di chuyển","B. Thực hiện quang hợp","C. Chống bị thực bào và giúp bám dính","D. Tổng hợp protein"],"points": 0.25,"q": "Vỏ nhầy (capsule) ở một số vi khuẩn có vai trò","type": "mcq"},{"answer": "C","explain": "Môi trường nhược trương làm nước đi vào tế bào; thành tế bào cứng chắc chống lại áp suất này, ngăn tế bào bị vỡ.","level": "VD","options": ["A. Đẩy nước ra khỏi tế bào","B. Ngăn không cho chất nào đi vào","C. Chống vỡ tế bào do nước ồ ạt đi vào","D. Làm tăng tốc độ phân chia"],"points": 0.25,"q": "Khi đặt vi khuẩn vào môi trường nhược trương, thành tế bào có vai trò","type": "mcq"},{"answer": "C","explain": "Vùng nhân (không màng) + DNA vòng + ribosome 70S + không bào quan có màng là đặc điểm của tế bào nhân sơ.","level": "VDC","options": ["A. Tế bào thực vật","B. Tế bào động vật","C. Tế bào nhân sơ","D. Tế bào nấm"],"points": 0.25,"q": "Quan sát một tế bào thấy: DNA dạng vòng nằm trong vùng không có màng bao bọc, có ribosome 70S, không có ti thể. Đây là","type": "mcq"},{"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng. c) Sai: nhân sơ nhỏ hơn nhiều (0,5–5 micromet). d) Sai: không có bào quan có màng.","level": "NB","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về tế bào nhân sơ:","statements": ["a) Tế bào nhân sơ là tế bào chưa có nhân hoàn chỉnh.","b) Vi khuẩn là ví dụ điển hình về tế bào nhân sơ.","c) Tế bào nhân sơ có kích thước lớn hơn tế bào nhân thực.","d) Tế bào nhân sơ có lục lạp."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: chỉ roi giúp di chuyển, lông giúp bám. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về thành tế bào và màng tế bào:","statements": ["a) Thành tế bào vi khuẩn cấu tạo chủ yếu từ peptidoglycan.","b) Màng tế bào vi khuẩn gồm lớp kép phospholipid xen kẽ protein.","c) Lông và roi của vi khuẩn đều có chức năng giúp di chuyển.","d) Tế bào chất gồm bào tương và vùng nhân."],"type": "truefalse"},{"answer": "Vùng nhân","explain": "DNA vòng mang thông tin di truyền chính nằm ở vùng nhân.","level": "TH","points": 0.5,"q": "Phân tử mang thông tin di truyền chính của vi khuẩn nằm ở cấu trúc nào?","type": "short"},{"answer": "80","explain": "Số lần phân đôi n = 60/20 = 3. Số tế bào = 10 × 2^3 = 80.","level": "VDC","points": 0.5,"q": "Có 10 tế bào vi khuẩn, mỗi tế bào phân đôi sau mỗi 20 phút. Sau 1 giờ sẽ thu được bao nhiêu tế bào? (Chỉ ghi số)","type": "short"}]},{"name": "Đề 6","questions": [{"answer": "D","explain": "Vi khuẩn là tế bào nhân sơ: chưa có nhân hoàn chỉnh, không bào quan có màng.","level": "NB","options": ["A. Tế bào nấm men","B. Tế bào lá cây","C. Tế bào hồng cầu người","D. Tế bào vi khuẩn lactic"],"points": 0.25,"q": "Trong các tế bào sau, tế bào nào là tế bào nhân sơ?","type": "mcq"},{"answer": "B","explain": "Ribosome 70S tổng hợp protein; các bào quan còn lại đều có màng bao bọc, chỉ có ở tế bào nhân thực.","level": "NB","options": ["A. Lysosome","B. Ribosome","C. Bộ máy Golgi","D. Lưới nội chất"],"points": 0.25,"q": "Bào quan nào sau đây có trong tế bào vi khuẩn?","type": "mcq"},{"answer": "B","explain": "Thành tế bào peptidoglycan bảo vệ và giữ hình dạng tế bào.","level": "TH","options": ["A. Trao đổi chất có chọn lọc","B. Bảo vệ và giữ hình dạng tế bào","C. Tổng hợp protein","D. Chứa DNA"],"points": 0.25,"q": "Thành phần nào giúp vi khuẩn giữ được hình dạng ổn định?","type": "mcq"},{"answer": "C","explain": "Màng tế bào có tính thấm chọn lọc, kiểm soát các chất ra vào tế bào.","level": "TH","options": ["A. Màng nhân","B. Thành tế bào","C. Màng tế bào","D. Vỏ nhầy"],"points": 0.25,"q": "Cấu trúc nào kiểm soát các chất ra, vào tế bào vi khuẩn một cách chọn lọc?","type": "mcq"},{"answer": "C","explain": "DNA vòng của vi khuẩn nằm trực tiếp trong tế bào chất (vùng nhân), không có màng nhân ngăn cách.","level": "VD","options": ["A. Trong nhân có màng kép bao bọc","B. Trong ti thể","C. Trực tiếp trong tế bào chất tại vùng nhân","D. Trong nhân con"],"points": 0.25,"q": "Vật chất di truyền của vi khuẩn nằm ở đâu trong tế bào?","type": "mcq"},{"answer": "B","explain": "Tỉ lệ S/V lớn là lợi thế của kích thước nhỏ, giúp trao đổi chất nhanh, sinh trưởng nhanh.","level": "VDC","options": ["A. Dự trữ được nhiều chất hơn","B. Trao đổi chất nhanh nhờ tỉ lệ S/V lớn","C. Chống chịu tốt hơn với kháng sinh","D. Quang hợp hiệu quả hơn"],"points": 0.25,"q": "Lợi thế lớn nhất của kích thước nhỏ ở tế bào vi khuẩn là","type": "mcq"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: vi khuẩn quang hợp (vi khuẩn lam) dùng hệ sắc tố trên màng, không có lục lạp. c) Đúng. d) Sai: chỉ một số vi khuẩn gây bệnh có vỏ nhầy.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về hệ nội màng và quang hợp ở vi khuẩn:","statements": ["a) Tế bào nhân sơ chưa có hệ thống nội màng.","b) Mọi vi khuẩn quang hợp đều có lục lạp.","c) DNA vùng nhân là phân tử kép dạng vòng.","d) Tất cả vi khuẩn đều có vỏ nhầy."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng: thành mỏng, có màng ngoài. c) Sai: đó là lông. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về sinh sản và nhuộm Gram của vi khuẩn:","statements": ["a) Vi khuẩn sinh sản nhanh nhờ kích thước nhỏ và cấu tạo đơn giản.","b) Vi khuẩn Gram âm có thành peptidoglycan mỏng và màng ngoài.","c) Roi của vi khuẩn có chức năng bám vào bề mặt.","d) Plasmid mang gene có thể truyền giữa các vi khuẩn."],"type": "truefalse"},{"answer": "Màng tế bào","explain": "Ở vi khuẩn hiếu khí, enzyme hô hấp nằm trên màng tế bào gấp nếp vào trong.","level": "TH","points": 0.5,"q": "Ở vi khuẩn hiếu khí, quá trình hô hấp diễn ra chủ yếu trên cấu trúc nào?","type": "short"},{"answer": "21","explain": "7 giờ = 420 phút, số lần phân đôi n = 420/20 = 21. Số tế bào = 2^21 = 2097152 (chỉ cần ghi số lần phân đôi: 21).","level": "VDC","points": 0.5,"q": "Vi khuẩn E. coli phân đôi mỗi 20 phút. Sau 7 giờ, từ 1 tế bào ban đầu đã trải qua bao nhiêu lần phân đôi? (Chỉ ghi số)","type": "short"}]},{"name": "Đề 7","questions": [{"answer": "A","explain": "Tế bào nhân sơ: chưa có nhân hoàn chỉnh (chỉ vùng nhân), không bào quan có màng.","level": "NB","options": ["A. Chưa có nhân hoàn chỉnh và chưa có bào quan có màng bao bọc","B. Có đầy đủ các bào quan như tế bào động vật","C. DNA nằm trong nhân có màng kép","D. Kích thước rất lớn"],"points": 0.25,"q": "Đặc điểm nào sau đây đúng với tế bào nhân sơ?","type": "mcq"},{"answer": "D","explain": "Tế bào nhân sơ chỉ có ribosome; ti thể, lục lạp, trung thể đều là bào quan có màng của tế bào nhân thực.","level": "NB","options": ["A. Ribosome","B. Vùng nhân","C. Màng tế bào","D. Ti thể"],"points": 0.25,"q": "Thành phần nào sau đây KHÔNG có trong tế bào vi khuẩn?","type": "mcq"},{"answer": "D","explain": "DNA vùng nhân không liên kết với protein histon (trần), khác với NST của tế bào nhân thực.","level": "TH","options": ["A. Dạng thẳng, liên kết histon","B. Được màng nhân bao bọc","C. Nằm trong nhân con","D. "C. Kitin","D. Tinh bột"],"points": 0.25,"q": "Kháng sinh penicillin tác động lên thành phần nào của tế bào vi khuẩn?","type": "mcq"},{"answer": "B","explain": "Vi khuẩn lam quang hợp nhờ hệ sắc tố trên màng tế bào (màng thylakoid), không có lục lạp.","level": "VDC","options": ["A. Có lục lạp như tế bào thực vật","B. Nhờ hệ sắc tố quang hợp trên màng tế bào","C. Nhờ ti thể","D. Nhờ vùng nhân"],"points": 0.25,"q": "Vi khuẩn lam là tế bào nhân sơ nhưng vẫn quang hợp được nhờ","type": "mcq"},{"answer": "D","explain": "Tất cả đều là đặc điểm chung của tế bào nhân sơ.","level": "VD","options": ["A. Kích thước nhỏ","B. Sinh sản nhanh bằng phân đôi","C. Chưa có nhân hoàn chỉnh","D. Cả A, B và C"],"points": 0.25,"q": "Đặc điểm chung của tế bào nhân sơ là","type": "mcq"},{"answer": ["T","F","F","T"],"explain": "a) Đúng. b) Sai: DNA vùng nhân trần, không liên kết histon. c) Sai: lông giúp bám, roi giúp di chuyển. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về DNA vùng nhân và ribosome:","statements": ["a) Vùng nhân chứa một phân tử DNA vòng, kép.","b) DNA vùng nhân liên kết chặt với protein histon.","c) Lông và roi của vi khuẩn có chức năng giống nhau.","d) Ribosome của vi khuẩn làm nhiệm vụ tổng hợp protein."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: còn tùy thuộc màng ngoài của Gram âm. c) Đúng. d) Sai: kích thước chỉ 0,5–5 micromet.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về kháng sinh và phân bố của vi khuẩn:","statements": ["a) Nhuộm Gram giúp lựa chọn kháng sinh phù hợp.","b) Kháng sinh ức chế tổng hợp peptidoglycan diệt mọi vi khuẩn hiệu quả như nhau.","c) Vi khuẩn phân bố rộng khắp nhờ thích nghi cao.","d) Tế bào vi khuẩn có đường kính 50–100 micromet."],"type": "truefalse"},{"answer": "Gram dương","explain": "Vi khuẩn có thành peptidoglycan dày, bắt màu tím khi nhuộm Gram là Gram dương.","level": "TH","points": 0.5,"q": "Vi khuẩn có thành peptidoglycan dày, bắt màu tím khi nhuộm Gram thuộc loại Gram nào? (Ghi: Gram dương / Gram âm)","type": "short"},{"answer": "Gram âm","explain": "Vi khuẩn có thành peptidoglycan mỏng và màng ngoài, bắt màu hồng/đỏ là Gram âm.","level": "VD","points": 0.5,"q": "Vi khuẩn có thành peptidoglycan mỏng, có màng ngoài, bắt màu hồng khi nhuộm Gram thuộc loại Gram nào?","type": "short"}]},{"name": "Đề 9","questions": [{"answer": "A","explain": "Vi khuẩn là tế bào nhân sơ điển hình.","level": "NB","options": ["A. Vi khuẩn","B. Nấm men","C. Tảo lục đơn bào","D. Động vật nguyên sinh"],"points": 0.25,"q": "Sinh vật nào sau đây có tế bào nhân sơ?","type": "mcq"},{"answer": "D","explain": "Màng tế bào vi khuẩn: lớp kép phospholipid xen kẽ protein.","level": "NB","options": ["A. Lớp kép cellulose","B. Lớp kép kitin","C. Lớp đơn protein","D. Lớp kép phospholipid xen kẽ protein"],"points": 0.25,"q": "Màng tế bào của vi khuẩn có cấu tạo","type": "mcq"},{"answer": "B","explain": "Vùng nhân không có màng bao bọc nên DNA tiếp xúc trực tiếp với tế bào chất.","level": "TH","options": ["A. Được màng nhân ngăn cách với tế bào chất","B. Tiếp xúc trực tiếp với tế bào chất","C. Nằm trong ti thể","D. Nằm trong lục lạp"],"points": 0.25,"q": "Do không có màng nhân nên vùng nhân của vi khuẩn","type": "mcq"},{"answer": "C","explain": "Ribosome 70S nhỏ hơn ribosome 80S của tế bào nhân thực; nhiều kháng sinh khai thác điểm khác biệt này.","level": "TH","options": ["A. 80S","B. 60S","C. 70S","D. 100S"],"points": 0.25,"q": "Ribosome trong tế bào vi khuẩn thuộc loại","type": "mcq"},{"answer": "D","explain": "Màng tế bào kiểm soát chọn lọc các chất ra vào; thành tế bào bảo vệ cơ học.","level": "VD","options": ["A. Vùng nhân","B. Ribosome","C. Plasmid","D. Màng tế bào"],"points": 0.25,"q": "Cấu trúc nào quyết định tính thấm chọn lọc của tế bào vi khuẩn?","type": "mcq"},{"type": "mcq","level": "VD","q": "Khi quan sát tiêu bản vi khuẩn dưới kính hiển vi, thấy các tế bào hình que đứng riêng lẻ, có roi. Có thể kết luận","options": ["A. Đây là cầu khuẩn Gram dương","B. Đây là trực khuẩn có khả năng di chuyển","C. Đây là tế bào nhân thực","D. Đây là virus"],"answer": "B","explain": "Hình que = trực khuẩn; có roi = có khả năng di chuyển.","points": 0.25},{"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng. c) Sai: chỉ có ở một số vi khuẩn gây bệnh. d) Sai: vi khuẩn sinh sản bằng phân đôi.","level": "NB","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về kích thước và thành phần tế bào vi khuẩn:","statements": ["a) Tế bào nhân sơ có kích thước nhỏ, khoảng 0,5–5 micromet.","b) Tế bào vi khuẩn có thành tế bào, màng tế bào và tế bào chất.","c) Mọi vi khuẩn đều có vỏ nhầy.","d) Vi khuẩn sinh sản bằng nguyên phân."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: đó là chức năng của lông. b) Đúng. c) Đúng. d) Sai: plasmid nằm ngoài vùng nhân.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về roi, vùng nhân và thành tế bào:","statements": ["a) Roi của vi khuẩn giúp chúng bám vào bề mặt.","b) Vùng nhân chứa thông tin di truyền chính của vi khuẩn.","c) Thành tế bào vi khuẩn cấu tạo từ peptidoglycan.","d) Plasmid nằm bên trong vùng nhân."],"type": "truefalse"},{"answer": "E. coli","explain": "E. coli là vi khuẩn đường ruột, tế bào nhân sơ điển hình, phân đôi mỗi 20 phút.","level": "VD","points": 0.5,"q": "Tên vi khuẩn đường ruột thường dùng làm ví dụ về tế bào nhân sơ, phân đôi mỗi 20 phút là gì?","type": "short"},{"answer": "100","explain": "200 / 2 = 100 lần. Tế bào nhân sơ nhỏ hơn tế bào nhân thực khoảng 10–100 lần.","level": "VDC","points": 0.5,"q": "Một tế bào vi khuẩn dài 2 micromet, một tế bào biểu bì vảy hành dài 200 micromet. Tế bào vi khuẩn nhỏ hơn bao nhiêu lần? (Chỉ ghi số)","type": "short"}]},{"name": "Đề 10","questions": [{"answer": "B","explain": "Chưa có nhân hoàn chỉnh (vùng nhân), chưa có hệ nội màng và bào quan có màng là đặc trưng của tế bào nhân sơ.","level": "NB","options": ["A. Có nhân hoàn chỉnh","B. Chưa có nhân hoàn chỉnh và bào quan có màng bao bọc","C. Có hệ thống nội màng","D. Có nhiều ti thể"],"points": 0.25,"q": "Tế bào nhân sơ khác tế bào nhân thực ở điểm cơ bản là","type": "mcq"},{"answer": "B","explain": "Bào tương chứa ribosome 70S và các hạt dự trữ; vùng nhân chứa DNA vòng.","level": "TH","options": ["A. Nhân và hệ nội màng","B. Bào tương, ribosome và vùng nhân","C. Ti thể và lục lạp","D. Không bào và lysosome"],"points": 0.25,"q": "Tế bào chất của vi khuẩn chứa","type": "mcq"},{"answer": "A","explain": "Lông ngắn giúp bám vào bề mặt, giá thể hoặc tế bào chủ.","level": "TH","options": ["A. Bám vào bề mặt","B. Di chuyển","C. Hô hấp","D. Quang hợp"],"points": 0.25,"q": "Chức năng chính của lông ở vi khuẩn là","type": "mcq"},{"answer": "D","explain": "Vùng nhân: DNA vòng, kép, trần; không màng bao bọc.","level": "VD","options": ["A. Có màng kép bao bọc","B. Chứa nhiều NST dạng thẳng","C. DNA liên kết với histon","D. DNA dạng vòng, không có màng bao bọc"],"points": 0.25,"q": "Đặc điểm của vùng nhân ở tế bào vi khuẩn là","type": "mcq"},{"answer": "A","explain": "Tỉ lệ S/V lớn → trao đổi chất nhanh → sinh trưởng và phân chia nhanh.","level": "VD","options": ["A. Tỉ lệ S/V lớn giúp trao đổi chất nhanh","B. Có nhiều bào quan","C. Nhân có kích thước lớn","D. Thành tế bào dày"],"points": 0.25,"q": "Giải thích vì sao vi khuẩn sinh trưởng rất nhanh trong điều kiện thuận lợi","type": "mcq"},{"answer": "B","explain": "Màng ngoài của Gram âm cản trở thuốc; kháng sinh ức chế thành tế bào thường hiệu quả hơn với Gram dương.","level": "VDC","options": ["A. Vì Gram âm không có thành tế bào","B. Vì màng ngoài của Gram âm cản trở kháng sinh thấm vào","C. Vì Gram dương không có màng tế bào","D. Vì Gram âm sinh sản nhanh hơn"],"points": 0.25,"q": "Kháng sinh ức chế tổng hợp peptidoglycan thường kém hiệu quả hơn với vi khuẩn Gram âm vì","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: vi khuẩn lam quang hợp không cần lục lạp. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về cấu tạo đơn giản của tế bào nhân sơ:","statements": ["a) Tế bào nhân sơ có cấu tạo đơn giản.","b) Mọi tế bào quang hợp đều có lục lạp.","c) Màng tế bào vi khuẩn có tính thấm chọn lọc.","d) Ribosome là nơi tổng hợp protein."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: chỉ một số có vỏ nhầy. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về phân bố và đặc điểm của vi khuẩn:","statements": ["a) Vi khuẩn phân bố rộng khắp trong tự nhiên.","b) Kích thước nhỏ giúp vi khuẩn trao đổi chất hiệu quả.","c) Mọi vi khuẩn gây bệnh đều có vỏ nhầy.","d) Vùng nhân không có màng bao bọc."],"type": "truefalse"},{"answer": "Trực phân","explain": "Phân đôi ở vi khuẩn còn gọi là trực phân (không qua các kì như nguyên phân).","level": "VD","points": 0.5,"q": "Hình thức phân đôi của vi khuẩn còn được gọi là gì?","type": "short"},{"answer": "Peptidoglycan","explain": "Thành tế bào vi khuẩn cấu tạo từ peptidoglycan; ức chế tổng hợp nó làm vi khuẩn chết.","level": "VDC","points": 0.5,"q": "Penicillin ức chế tổng hợp hợp chất nào ở thành tế bào vi khuẩn?","type": "short"}]}]}
