) Lưới nội chất trơn tổng hợp protein.","d) Lysosome tổng hợp lipid."],"type": "truefalse"},{"answer": "Nhân thực","explain": "Nấm men, động vật, thực vật đều có tế bào nhân thực.","level": "NB","points": 0.5,"q": "Tế bào nấm men thuộc loại tế bào nào? (Ghi: Nhân sơ / Nhân thực)","type": "short"},{"answer": "Matrix","explain": "Chất nền ti thể (matrix) chứa DNA, ribosome 70S và enzyme hô hấp.","level": "TH","points": 0.5,"q": "Chất nền bên trong ti thể có tên tiếng Anh là gì?","type": "short"}]},{"name": "Đề 7","questions": [{"answer": "A","explain": "Nhân con tổng hợp rARN.","level": "NB","options": ["A. ARN ribosome","B. DNA","C. ATP","D. Lipid"],"points": 0.25,"q": "Nhân con tổng hợp","type": "mcq"},{"answer": "C","explain": "Lưới nội chất trơn: tổng hợp lipid, khử độc.","level": "NB","options": ["A. Lưới nội chất hạt","B. Ribosome","C. Lưới nội chất trơn","D. Lysosome"],"points": 0.25,"q": "Bào quan tổng hợp lipid là","type": "mcq"},{"answer": "B","explain": "Lỗ nhân cho ARN ra, protein vào.","level": "TH","options": ["A. DNA","B. ARN và protein","C. Ribosome","D. Ti thể"],"points": 0.25,"q": "Chất trao đổi qua lỗ nhân là","type": "mcq"},{"answer": "D","explain": "Grana chứa diệp lục hấp thụ ánh sáng.","level": "VD","options": ["A. Chứa DNA","B. Dự trữ nước","C. Tổng hợp protein","D. Hấp thụ năng lượng ánh sáng"],"points": 0.25,"q": "Vai trò của grana trong lục lạp là","type": "mcq"},{"answer": "B","explain": "Màng ngoài Gram âm cản trở kháng sinh.","level": "VD","options": ["A. Không có thành tế bào","B. Có màng ngoài cản trở kháng sinh","C. Không có màng tế bào","D. Kích thước quá lớn"],"points": 0.25,"q": "Vì sao vi khuẩn Gram âm khó bị diệt bởi nhiều kháng sinh?","type": "mcq"},{"answer": "B","explain": "Ribosome 70S trong ti thể/lục lạp giống vi khuẩn — bằng chứng nội cộng sinh.","level": "VDC","options": ["A. Đều là 80S","B. Đều là 70S giống vi khuẩn","C. Không có ribosome","D. Đều là 60S"],"points": 0.25,"q": "Ribosome trong ti thể và lục lạp thuộc loại", thành cellulose, lục lạp, không bào lớn; động vật: trung thể, lysosome.","level": "VD","options": ["A. Có ti thể","B. Có nhân","C. Có thành cellulose và lục lạp","D. Có màng tế bào"],"points": 0.25,"q": "Tế bào thực vật khác tế bào động vật ở điểm","type": "mcq"},{"answer": "A","explain": "Tế bào lá quang hợp → nhiều lục lạp; tế bào rễ không quang hợp.","level": "VD","options": ["A. Tế bào lá có nhiều lục lạp hơn","B. Tế bào rễ có nhiều lục lạp hơn","C. Hai tế bào giống nhau","D. Tế bào rễ không có ti thể"],"points": 0.25,"q": "So sánh tế bào lá và tế bào rễ của một cây","type": "mcq"},{"answer": "D","explain": "Mất nhân → không điều khiển, không phân chia.","level": "VDC","options": ["A. Vẫn phân chia","B. Sống rất lâu","C. Tự tạo nhân mới","D. Không phân chia, tuổi thọ ngắn"],"points": 0.25,"q": "Hệ quả của việc hồng cầu người mất nhân là","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: nhân sơ 70S. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về ribosome:","statements": ["a) Ribosome gồm 2 tiểu đơn vị.","b) Mọi ribosome đều là 80S.","c) Ribosome cấu tạo từ rARN và protein.","d) Ribosome là nơi tổng hợp protein."],"type": "truefalse"},{"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng. c) Sai: lông bám, roi di chuyển. d) Sai: plasmid ngoài vùng nhân.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về ribosome và vùng nhân:","statements": ["a) DNA vùng nhân dạng vòng, kép.","b) Màng tế bào vi khuẩn có tính thấm chọn lọc.","c) Lông và roi đều giúp vi khuẩn di chuyển.","d) Plasmid nằm trong vùng nhân."],"type": "truefalse"},{"answer": "Lỗ nhân","explain": "Lỗ nhân trao đổi chất giữa nhân và tế bào chất.","level": "NB","points": 0.5,"q": "Cấu trúc nào trên màng nhân giúp trao đổi chất với tế bào chất?","type": "short"},{"answer": "Grana","explain": "Thylakoid xếp chồng thành grana.","level": "TH","points": 0.5,"q": "Chồng thylakoid trong lục lạp gọi là gì?","type": "short"}]},{"name": "Đề 9","questions": [{"answer": "D","explain": "Chất nhiễm sắc = DNA + histon.","level": "NB","options": ["A. Protein và lipid","B. DNA và cellulose","C. ARN và lipid","D. DNA và protein histon"],"points": 0.25,"q": "Chất nhiễm sắc gồm","type": "mcq"},{"answer": "C","explain": "Khi phân chia, chất nhiễm sắc co xoắn thành NST.","level": "NB","options": ["A. Ribosome","B. Plasmid","C. Nhiễm sắc thể","D. Trung thể"],"points": 0.25,"q": "Chất nhiễm sắc co xoắn khi phân chia tạo thành","type": "mcq"},{"answer": "A","explain": "Glycoprotein giúp nhận biết tế bào.","level": "TH","options": ["A. Nhận biết tế bào","B. Vận chuyển oxygen","C. Tổng hợp ATP","D. Dự trữ đường"],"points": 0.25,"q": "Dấu chuẩn trên màng tế bào giúp","type": "mcq"},{"answer": "B","explain": "Lysosome phân giải bào quan già — hệ dọn dẹp.","level": "VD","options": ["A. Tổng hợp protein","B. Phân giải bào quan già, tế bào tổn thương","C. Quang hợp","D. Dự trữ nước"],"points": 0.25,"q": "Vì sao lysosome được ví như hệ dọn dẹp của tế bào?","type": "mcq"},{"answer": "C","explain": "Tế bào cơ cần nhiều ATP → nhiều ti thể.","level": "VD","options": ["A. Tế bào biểu bì","B. Tế bào hồng cầu","C. Tế bào cơ","D. Tế bào mỡ"],"points": 0.25,"q": "Tế bào nào cần nhiều ti thể nhất?","type": "mcq"},{"answer": "A","explain": "Protein tiết: lưới nội chất hạt → Golgi → xuất bào.","level": "VDC","options": ["A. Lưới nội chất hạt → Golgi → xuất bào","B. Lysosome → nhân","C. Ti thể → màng","D. Nhân → lysosome"],"points": 0.25,"q": "Con đường của protein được tiết ra ngoài tế bào là","type": "mcq"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: động vật không có thành. c) Đúng. d) Sai: động vật không có lục lạp.","level": "TH","points": 1,"q": "Xét tính đúng, sai khi so sánh tế bào thực vật và động vật:","statements": ["a) Thực vật có thành cellulose.","b) Động vật có thành kitin.","c) Thực vật có lục lạp.","d) Động vật có lục lạp."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: khung xương có ở mọi tế bào nhân thực. c) Đúng. d) Sai: peroxisome phân giải H2O2.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về khung xương tế bào và peroxisome:","statements": ["a) Khung xương gồm vi ống, vi sợi, sợi trung gian.","b) Chỉ tế bào động vật có khung xương.","c) Trung thể có ở tế bào động vật.","d) Peroxisome tổng hợp protein."],"type": "truefalse"},{"answer": "Nhiễm sắc thể","explain": "Chất nhiễm sắc co xoắn thành nhiễm sắc thể (NST).","level": "NB","points": 0.5,"q": "Cấu trúc do chất nhiễm sắc co xoắn tạo thành khi phân chia có tên là gì?","type": "short"},{"answer": "Mào","explain": "Màng trong ti thể gấp nếp thành mào.","level": "TH","points": 0.5,"q": "Nếp gấp của màng trong ti thể gọi là gì?","type": "short"}]},{"name": "Đề 10","questions": [{"answer": "B","explain": "Golgi: túi dẹp xếp chồng.","level": "NB","options": ["A. Túi tròn","B. Túi dẹp xếp chồng","C. Màng kép có lỗ","D. Sợi dài"],"points": 0.25,"q": "Bộ máy Golgi có cấu tạo","type": "mcq"},{"answer": "A","explain": "Lưới nội chất tạo hệ nội màng.","level": "NB","options": ["A. Lưới nội chất","B. Màng tế bào","C. Thành tế bào","D. Màng nhân"],"points": 0.25,"q": "Hệ nội màng chủ yếu do bào quan nào tạo nên?","type": "mcq"},{"answer": "C","explain": "Cholesterol giúp màng ổn định.","level": "TH","options": ["A. Tăng tính thấm","B. Nhận biết tế bào","C. Ổn định màng, điều hòa độ lỏng","D. Tổng hợp ATP"],"points": 0.25,"q": "Vai trò của cholesterol trong màng tế bào động vật là","type": "mcq"},{"answer": "B","explain": "Tế bào gan khử độc → lưới nội chất trơn phát triển.","level": "VD","options": ["A. Nhiều lục lạp","B. Lưới nội chất trơn phát triển","C. Nhiều lysosome","D. Thành dày"],"points": 0.25,"q": "Tế bào gan phù hợp chức năng khử độc nhờ","type": "mcq"},{"answer": "D","explain": "Mất diệp lục → giảm hấp thụ sáng → giảm quang hợp.","level": "VD","options": ["A. Tăng quang hợp","B. Không ảnh hưởng","C. Tăng hô hấp","D. Giảm hấp thụ ánh sáng, giảm quang hợp"],"points": 0.25,"q": "Lá vàng do mất diệp lục ảnh hưởng đến tế bào lá thế nào?","type": "mcq"},{"answer": "B","explain": "Vi khuẩn lam quang hợp nhờ sắc tố trên màng.","level": "VDC","options": ["A. Có lục lạp","B. Nhờ sắc tố quang hợp trên màng","C. Nhờ ti thể","D. Nhờ vùng nhân"],"points": 0.25,"q": "Vi khuẩn lam quang hợp được vì","type": "mcq"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: nhân sơ không có ti thể. c) Đúng. d) Sai: thực vật không có trung thể.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về ti thể và trung thể:","statements": ["a) Mọi tế bào nhân thực đều có ti thể.","b) Tế bào nhân sơ có ti thể.","c) Tế bào thực vật có cả ti thể và lục lạp.","d) Tế bào thực vật có trung thể."],"type": "truefalse"},{"answer": ["F","T","F","T"],"explain": "a) Sai: vùng nhân không có màng. b) Đúng. c) Sai: 70S ở nhân sơ. d) Đúng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về vùng nhân và ribosome:","statements": ["a) Vùng nhân được màng bao bọc.","b) Tế bào nhân thực lớn hơn tế bào nhân sơ.","c) Ribosome nhân sơ là 80S.","d) Tế bào nhân sơ phân bố rộng khắp."],"type": "truefalse"},{"answer": "Trung thể","explain": "Trung thể hình thành thoi phân bào ở tế bào động vật.","level": "NB","points": 0.5,"q": "Bào quan hình thành thoi phân bào ở tế bào động vật là gì?","type": "short"},{"answer": "Histon","explain": "Chất nhiễm sắc gồm DNA và protein histon.","level": "TH","points": 0.5,"q": "Protein kết hợp với DNA tạo chất nhiễm sắc là gì?","type": "short"}]}]}
