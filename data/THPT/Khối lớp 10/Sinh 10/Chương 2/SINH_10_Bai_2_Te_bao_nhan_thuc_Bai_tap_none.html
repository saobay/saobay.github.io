<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1","questions": [{"answer": "B","explain": "Tế bào nhân thực có nhân hoàn chỉnh (màng nhân bao bọc DNA), hệ nội màng và các bào quan có màng.","level": "NB","options": ["A. Chưa có nhân hoàn chỉnh","B. Có nhân hoàn chỉnh được màng bao bọc","C. Không có bào quan có màng","D. Chỉ có ribosome là bào quan"],"points": 0.25,"q": "Đặc điểm nổi bật nhất của tế bào nhân thực là","type": "mcq"},{"answer": "C","explain": "Cấu trúc chung của tế bào nhân thực gồm màng tế bào, tế bào chất và nhân.","level": "NB","options": ["A. Thành tế bào, vùng nhân, roi","B. Màng nhân, plasmid, lông","C. Màng tế bào, tế bào chất, nhân","D. Vỏ nhầy, vùng nhân, ribosome 70S"],"points": 0.25,"q": "Tế bào nhân thực gồm 3 phần chính là","type": "mcq"},{"answer": "B","explain": "Mô hình khảm động: protein khảm trong lớp kép phospholipid và chuyển động tạo tính linh hoạt.","level": "TH","options": ["A. Lớp kép cellulose xen kẽ protein","B. Lớp kép phospholipid xen kẽ protein, cholesterol và carbohydrate","C. Lớp đơn lipid","D. Lớp kép protein"],"points": 0.25,"q": "Theo mô hình khảm động, màng tế bào được cấu tạo từ","type": "mcq"},{"answer": "D","explain": "Nhân chứa DNA (thông tin di truyền) và điều khiển mọi hoạt động sống của tế bào.","level": "VD","options": ["A. Tổng hợp ATP","B. Thực hiện quang hợp","C. Tiêu hóa nội bào","D. Lưu giữ thông tin di truyền và điều khiển hoạt động tế bào"],"points": 0.25,"q": "Chức năng quan trọng nhất của nhân tế bào là","type": "mcq"},{"answer": "C","explain": "Ti thể có màng trong gấp nếp thành mào làm tăng diện tích cho chuỗi truyền electron tạo ATP.","level": "VD","options": ["A. Bảo vệ DNA của tế bào","B. Tăng diện tích quang hợp","C. Tăng diện tích cho quá trình hô hấp tạo ATP","D. Chứa enzyme tiêu hóa"],"points": 0.25,"q": "Màng trong của ti thể gấp nếp thành mào có ý nghĩa","type": "mcq"},{"answer": "B","explain": "Lỗ nhân là nơi trao đổi chất giữa nhân và tế bào chất (ARN đi ra, protein đi vào).","level": "VDC","options": ["A. Nơi DNA đi ra tế bào chất","B. Nơi trao đổi chất (ARN, protein...) giữa nhân và tế bào chất","C. Nơi tổng hợp ATP","D. Nơi gắn ribosome"],"points": 0.25,"q": "Trên màng nhân có nhiều lỗ nhân. Chức năng của lỗ nhân là","type": "mcq"},{"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng. c) Sai: màng tế bào vi khuẩn không chứa cholesterol. d) Sai: màng có tính thấm chọn lọc, cho nhiều chất qua một cách chọn lọc.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về màng tế bào:","statements": ["a) Màng tế bào có cấu trúc khảm động gồm phospholipid kép và protein.","b) Glycoprotein trên màng làm nhiệm vụ nhận biết tế bào.","c) Màng tế bào của vi khuẩn cũng chứa cholesterol như tế bào động vật.","d) Màng tế bào chỉ cho nước đi qua."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: nhân con tổng hợp rARN. c) Đúng. d) Sai: tế bào mất nhân không phân chia được.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nhân tế bào:","statements": ["a) Màng nhân là màng kép có nhiều lỗ nhân.","b) Nhân con là nơi tổng hợp DNA.","c) Chất nhiễm sắc gồm DNA liên kết với protein histon.","d) Tế bào hồng cầu người trưởng thành mất nhân vẫn phân chia bình thường."],"type": "truefalse"},{"answer": "Nhân thực","explain": "Động vật, thực vật, nấm có tế bào nhân thực.","level": "NB","points": 0.5,"q": "Tế bào của động vật và thực vật thuộc loại tế bào nào? (Ghi: Nhân sơ / Nhân thực)","type": "short"},{"answer": "Khảm động","explain": "Singer và Nicolson (1972) đề xuất mô hình khảm động của màng tế bào.","level": "TH","points": 0.5,"q": "Mô hình cấu tạo màng tế bào do Singer và Nicolson đề xuất có tên là gì?","type": "short"}]},{"name": "Đề 2","questions": [{"answer": "C","explain": "Ribosome 80S (lớn hơn 70S của nhân sơ) là nơi tổng hợp protein.","level": "NB","options": ["A. Ti thể","B. Lục lạp","C. Ribosome","D. Trung thể"],"points": 0.25,"q": "Bào quan nào làm nhiệm vụ tổng hợp protein trong tế bào nhân thực?","type": "mcq"},{"answer": "B","explain": "Ti thể là nơi hô hấp tế bào, tạo phần lớn ATP — ví như nhà máy năng lượng.","level": "NB","options": ["A. Lục lạp","B. Ti thể","C. Lysosome","D. Không bào"],"points": 0.25,"q": "Bào quan được ví như nhà máy năng lượng của tế bào là","type": "mcq"},{"answer": "C","explain": "Lưới nội chất hạt có ribosome bám, tổng hợp protein (tiết, màng, lysosome).","level": "TH","options": ["A. Tổng hợp lipid","B. Khử độc","C. Tổng hợp protein","D. Quang hợp"],"points": 0.25,"q": "Lưới nội chất hạt có chức năng","type": "mcq"},{"answer": "D","explain": "Bộ máy Golgi tiếp nhận sản phẩm từ lưới nội chất rồi chế biến, đóng gói, phân phối.","level": "VD","options": ["A. Tổng hợp protein","B. Hô hấp tế bào","C. Quang hợp","D. Chế biến, đóng gói và phân phối protein, lipid"],"points": 0.25,"q": "Chức năng của bộ máy Golgi là","type": "mcq"},{"answer": "B","explain": "Lục lạp: màng kép, thylakoid xếp thành grana chứa diệp lục, stroma chứa enzyme quang hợp.","level": "VD","options": ["A. Màng đơn, không có hệ sắc tố","B. Màng kép, thylakoid xếp thành grana, stroma chứa enzyme","C. Màng kép, mào gấp nếp","D. Không có DNA"],"points": 0.25,"q": "Cấu tạo của lục lạp gồm","type": "mcq"},{"answer": "D","explain": "Mất nhân = mất trung tâm điều khiển và khả năng phân chia; hồng cầu chỉ sống ~120 ngày.","level": "VDC","options": ["A. Vẫn phân chia bình thường","B. Sống lâu hơn bình thường","C. Tự tổng hợp DNA mới","D. Không phân chia được và tuổi thọ ngắn"],"points": 0.25,"q": "Tế bào hồng cầu người trưởng thành không có nhân. Hệ quả là","type": "mcq"},{"answer": ["T","T","T","F"],"explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ribosome nhân thực là 80S.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về các bào quan:","statements": ["a) Ribosome là nơi tổng hợp protein của tế bào.","b) Ti thể là nơi diễn ra hô hấp tế bào tạo ATP.","c) Lục lạp là nơi diễn ra quang hợp ở tế bào thực vật.","d) Ribosome trong tế bào chất của tế bào nhân thực là loại 70S."],"type": "truefalse"},{"answer": ["T","F","F","T"],"explain": "a) Đúng. b) Sai: đó là lưới nội chất trơn. c) Sai: Golgi không tổng hợp protein. d) Đúng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về lưới nội chất và bộ máy Golgi:","statements": ["a) Lưới nội chất hạt tổng hợp protein nhờ ribosome bám trên màng.","b) Lưới nội chất hạt tổng hợp lipid cho tế bào.","c) Bộ máy Golgi là nơi tổng hợp protein của tế bào.","d) Protein sau khi tổng hợp được Golgi đóng gói và phân phối."],"type": "truefalse"},{"answer": "Lysosome","explain": "Lysosome chứa enzyme thủy phân, tiêu hóa nội bào.","level": "NB","points": 0.5,"q": "Bào quan chứa enzyme thủy phân, làm nhiệm vụ tiêu hóa nội bào có tên là gì?","type": "short"},{"answer": "Quang hợp","explain": "Lục lạp là nơi diễn ra quang hợp ở tế bào thực vật.","level": "TH","points": 0.5,"q": "Quá trình diễn ra ở lục lạp, tổng hợp chất hữu cơ nhờ năng lượng ánh sáng có tên là gì?","type": "short"}]},{"name": "Đề 3","questions": [{"answer": "B","explain": "Lưới nội chất trơn tổng hợp lipid, chuyển hóa đường, khử độc.","level": "NB","options": ["A. Lưới nội chất hạt","B. Lưới nội chất trơn","C. Bộ máy Golgi","D. Ribosome"],"points": 0.25,"q": "Bào quan nào tổng hợp lipid cho tế bào?","type": "mcq"},{"answer": "D","explain": "Nhân con là nơi tổng hợp ARN ribosome (rARN).","level": "NB","options": ["A. Tổng hợp DNA","B. Tổng hợp ATP","C. Tổng hợp protein","D. Tổng hợp ARN ribosome"],"points": 0.25,"q": "Nhân con trong nhân tế bào có chức năng","type": "mcq"},{"answer": "B","explain": "Lysosome chứa enzyme thủy phân để tiêu hóa nội bào.","level": "TH","options": ["A. Ti thể","B. Lysosome","C. Lục lạp","D. Không bào"],"points": 0.25,"q": "Bào quan nào chứa enzyme thủy phân để phân giải các chất?","type": "mcq"},{"answer": "C","explain": "Thực vật có thành cellulose, lục lạp, không bào lớn; động vật có trung thể, lysosome.","level": "VD","options": ["A. Lục lạp và không bào lớn","B. Thành cellulose","C. Trung thể và lysosome","D. Không bào lớn"],"points": 0.25,"q": "Tế bào động vật có mà tế bào thực vật thường không có (hoặc rất ít)","type": "mcq"},{"answer": "B","explain": "Không bào lớn chứa dịch tế bào giúp tế bào hút nước, giữ trương.","level": "VD","options": ["A. Chứa diệp lục để quang hợp","B. Chứa dịch tế bào, giúp hút nước và giữ trương","C. Tổng hợp protein","D. Hình thành thoi phân bào"],"points": 0.25,"q": "Không bào lớn ở tế bào thực vật có vai trò","type": "mcq"},{"answer": "C","explain": "Chất nhiễm sắc = DNA + histon; khi phân chia co xoắn thành NST.","level": "VDC","options": ["A. DNA + cellulose","B. ARN + lipid","C. DNA + protein histon","D. DNA + peptidoglycan"],"points": 0.25,"q": "Chất nhiễm sắc trong nhân tế bào được cấu tạo từ","type": "mcq"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: thực vật có thành cellulose, động vật không. c) Đúng. d) Sai: trung thể chỉ có ở tế bào động vật.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau khi so sánh tế bào thực vật và động vật:","statements": ["a) Tế bào thực vật có lục lạp, tế bào động vật không có.","b) Cả tế bào thực vật và động vật đều có thành tế bào.","c) Tế bào thực vật có không bào lớn, tế bào động vật có không bào nhỏ.","d) Cả hai loại tế bào đều có trung thể."],"type": "truefalse"},{"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng. c) Sai: khung xương còn làm đường vận chuyển bào quan. d) Sai: nhân sơ không có hệ nội màng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về khung xương tế bào và trung thể:","statements": ["a) Khung xương tế bào giúp nâng đỡ và giữ hình dạng tế bào.","b) Trung thể tham gia hình thành thoi phân bào.","c) Khung xương tế bào chỉ có chức năng nâng đỡ.","d) Tế bào nhân sơ cũng có hệ thống nội màng như tế bào nhân thực."],"type": "truefalse"},{"answer": "80S","explain": "Ribosome trong tế bào chất của tế bào nhân thực là loại 80S.","level": "NB","points": 0.5,"q": "Ribosome trong tế bào chất của tế bào nhân thực thuộc loại nào? (Ví dụ: 70S)","type": "short"},{"answer": "ATP","explain": "Ti thể tạo phần lớn ATP cung cấp năng lượng cho tế bào qua hô hấp.","level": "TH","points": 0.5,"q": "Phân tử mang năng lượng được ti thể tạo ra chủ yếu qua hô hấp tế bào là gì?","type": "short"}]},{"name": "Đề 4","questions": [{"answer": "A","explain": "Màng nhân là màng kép, có lỗ nhân để trao đổi chất.","level": "NB","options": ["A. Màng kép có lỗ nhân","B. Màng đơn không có lỗ","C. Lớp kép phospholipid trơn","D. Thành cellulose"],"points": 0.25,"q": "Màng nhân của tế bào nhân thực có đặc điểm","type": "mcq"},{"answer": "C","explain": "Khi phân chia, chất nhiễm sắc co xoắn lại thành nhiễm sắc thể.","level": "NB","options": ["A. Ribosome","B. Plasmid","C. Nhiễm sắc thể","D. Trung thể"],"points": 0.25,"q": "Khi tế bào phân chia, chất nhiễm sắc co xoắn thành","type": "mcq"},{"answer": "D","explain": "Glycoprotein/glycolipid mặt ngoài màng làm nhiệm vụ nhận biết tế bào.","level": "TH","options": ["A. Trao đổi chất","B. Tổng hợp protein","C. Dự trữ năng lượng","D. Nhận biết tế bào và thu nhận tín hiệu"],"points": 0.25,"q": "Các thụ thể và dấu chuẩn (glycoprotein) trên màng tế bào có vai trò","type": "mcq"},{"answer": "B","explain": "Ti thể và lục lạp đều có DNA vòng, ribosome 70S — bằng chứng nguồn gốc nội cộng sinh.","level": "VD","options": ["A. Đều có màng đơn","B. Đều có DNA vòng và ribosome 70S","C. Đều không có màng","D. Đều chỉ có ở tế bào động vật"],"points": 0.25,"q": "Điểm giống nhau đặc biệt giữa ti thể và lục lạp là","type": "mcq"},{"answer": "A","explain": "Tế bào cơ vận động nhiều cần nhiều ATP nên có nhiều ti thể.","level": "VD","options": ["A. Tế bào cơ","B. Tế bào biểu bì","C. Tế bào hồng cầu","D. Tế bào thần kinh nghỉ ngơi"],"points": 0.25,"q": "Loại tế bào nào sau đây có nhiều ti thể nhất?","type": "mcq"},{"answer": "D","explain": "Lưới nội chất là hệ thống màng gấp nếp nối thông với màng nhân, chia tế bào chất thành các xoang.","level": "VDC","options": ["A. Màng tế bào","B. Màng nhân","C. Thành tế bào","D. Lưới nội chất"],"points": 0.25,"q": "Hệ thống nội màng trong tế bào chất chủ yếu được tạo nên bởi","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: nhân sơ có 70S. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về ribosome:","statements": ["a) Ribosome gồm 2 tiểu đơn vị lớn và nhỏ.","b) Mọi tế bào đều có ribosome loại 80S.","c) Ribosome được cấu tạo từ rARN và protein.","d) Ribosome tự do tổng hợp protein cho tế bào chất."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: tế bào nhân sơ không có nhân hoàn chỉnh. b) Đúng. c) Đúng. d) Sai: tế bào nhân thực lớn hơn (~10–100 micromet).","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau khi so sánh tế bào nhân sơ và nhân thực:","statements": ["a) Cả hai loại tế bào đều có nhân hoàn chỉnh.","b) Tế bào nhân thực có hệ nội màng, tế bào nhân sơ không có.","c) Ribosome của tế bào nhân sơ là 70S, của nhân thực là 80S.","d) Tế bào nhân sơ có kích thước lớn hơn tế bào nhân thực."],"type": "truefalse"},{"answer": "Màng nhân","explain": "Vật chất di truyền của tế bào nhân thực được màng nhân bao bọc.","level": "NB","points": 0.5,"q": "Cấu trúc nào bao bọc vật chất di truyền trong tế bào nhân thực?","type": "short"},{"answer": "Diệp lục","explain": "Thylakoid của lục lạp chứa diệp lục hấp thụ năng lượng ánh sáng.","level": "TH","points": 0.5,"q": "Sắc tố quang hợp nằm trên màng thylakoid của lục lạp có tên là gì?","type": "short"}]},{"name": "Đề 5","questions": [{"answer": "D","explain": "Peroxisome chứa enzyme oxy hóa, phân giải H2O2.","level": "NB","options": ["A. Ti thể","B. Lục lạp","C. Lysosome","D. Peroxisome"],"points": 0.25,"q": "Bào quan chứa enzyme phân giải H2O2 độc hại là","type": "mcq"},{"answer": "B","explain": "Khung xương tế bào: vi ống, vi sợi, sợi trung gian.","level": "NB","options": ["A. Peptidoglycan và cellulose","B. Vi ống, vi sợi và sợi trung gian","C. Phospholipid và protein","D. DNA và histon"],"points": 0.25,"q": "Khung xương tế bào được cấu tạo từ","type": "mcq"},{"answer": "C","explain": "Cholesterol xen giữa phospholipid giúp màng ổn định, bớt lỏng lẻo.","level": "TH","options": ["A. Tăng tính thấm của màng","B. Nhận biết tế bào","C. Giúp màng ổn định, điều hòa độ lỏng","D. Tổng hợp ATP"],"points": 0.25,"q": "Cholesterol trong màng tế bào động vật có vai trò","type": "mcq"},{"answer": "A","explain": "Lysosome phân giải bào quan già, tế bào tổn thương — ví như hệ thống tiêu hóa/dọn dẹp.","level": "VD","options": ["A. Phân giải các bào quan già và tế bào bị tổn thương","B. Tổng hợp protein","C. Quang hợp","D. Dự trữ nước"],"points": 0.25,"q": "Vì sao lysosome được ví như hệ thống dọn dẹp của tế bào?","type": "mcq"},{"answer": "D","explain": "Grana chứa diệp lục hấp thụ ánh sáng cho pha sáng của quang hợp.","level": "VD","options": ["A. Chứa DNA của lục lạp","B. Dự trữ tinh bột","C. Tổng hợp protein","D. Chứa diệp lục hấp thụ năng lượng ánh sáng"],"points": 0.25,"q": "Các hạt grana trong lục lạp có vai trò","type": "mcq"},{"answer": "B","explain": "Tế bào gan khử độc nhiều nên lưới nội chất trơn phát triển; tế bào tuyến tụy tiết protein nên lưới nội chất hạt và Golgi phát triển.","level": "VDC","options": ["A. Tế bào gan có nhiều lysosome hơn","B. Tế bào gan có lưới nội chất trơn phát triển hơn","C. Tế bào tụy có nhiều lục lạp hơn","D. Hai tế bào có số bào quan như nhau"],"points": 0.25,"q": "So với tế bào tuyến tụy (tiết enzyme tiêu hóa), tế bào gan (khử độc) khác biệt ở","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: stroma là chất nền chứa enzyme, không phải màng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về ti thể và lục lạp:","statements": ["a) Ti thể có màng trong gấp nếp thành mào.","b) Lục lạp có thylakoid xếp chồng thành grana.","c) Stroma là hệ thống màng trong lục lạp.","d) Cả ti thể và lục lạp đều có DNA riêng."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: thực vật không có trung thể. c) Đúng. d) Sai: động vật không có thành tế bào.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về thành tế bào, trung thể và lysosome:","statements": ["a) Tế bào thực vật có thành tế bào bằng cellulose.","b) Tế bào thực vật có trung thể như tế bào động vật.","c) Tế bào động vật có lysosome để tiêu hóa nội bào.","d) Tế bào động vật có thành tế bào bảo vệ."],"type": "truefalse"},{"answer": "Trung thể","explain": "Trung thể (2 trung tử) tham gia hình thành thoi phân bào ở tế bào động vật.","level": "NB","points": 0.5,"q": "Bào quan tham gia hình thành thoi phân bào ở tế bào động vật có tên là gì?","type": "short"},{"answer": "Stroma","explain": "Stroma là chất nền của lục lạp, chứa DNA, ribosome và enzyme quang hợp.","level": "TH","points": 0.5,"q": "Chất nền bên trong lục lạp, nơi chứa enzyme quang hợp có tên là gì?","type": "short"}]},{"name": "Đề 6","questions": [{"answer": "B","explain": "Tế bào chất gồm bào tương (dịch keo) và các bào quan.","level": "NB","options": ["A. Màng nhân và chất nhiễm sắc","B. Bào tương và các bào quan","C. Thành tế bào và màng tế bào","D. Vùng nhân và plasmid"],"points": 0.25,"q": "Tế bào chất của tế bào nhân thực gồm","type": "mcq"},{"answer": "C","explain": "Không bào lớn chứa dịch tế bào, giúp hút nước, giữ trương và dự trữ chất.","level": "NB","options": ["A. Ti thể","B. Trung thể","C. Không bào lớn","D. Ribosome"],"points": 0.25,"q": "Tế bào thực vật có không bào lớn với chức năng","type": "mcq"},{"answer": "C","explain": "Protein xuyên màng tạo kênh cho các chất đi qua; protein bề mặt làm thụ thể, enzyme.","level": "TH","options": ["A. Chỉ làm khung cho màng","B. Chỉ tổng hợp lipid","C. Tạo kênh vận chuyển, làm thụ thể và enzyme","D. Dự trữ năng lượng"],"points": 0.25,"q": "Protein màng tế bào có vai trò","type": "mcq"},{"answer": "B","explain": "Lưới nội chất trơn: tổng hợp lipid, chuyển hóa đường, khử độc, dự trữ Ca2+.","level": "VD","options": ["A. Tổng hợp protein tiết","B. Tổng hợp lipid và khử độc","C. Đóng gói protein","D. Tiêu hóa nội bào"],"points": 0.25,"q": "Tế bào gan có lưới nội chất trơn rất phát triển vì","type": "mcq"},{"answer": "D","explain": "Thực vật: thành cellulose, lục lạp, không bào lớn; không có trung thể.","level": "VD","options": ["A. Trung thể","B. Lysosome lớn","C. Thành kitin","D. Thành cellulose và lục lạp"],"points": 0.25,"q": "Đặc điểm chỉ có ở tế bào thực vật mà không có ở tế bào động vật là","type": "mcq"},{"answer": "A","explain": "Tế bào tiết nhiều protein cần lưới nội chất hạt (tổng hợp) và Golgi (đóng gói) phát triển.","level": "VDC","options": ["A. Lưới nội chất hạt và bộ máy Golgi phát triển","B. Nhiều lục lạp","C. Nhiều lysosome","D. Thành tế bào dày"],"points": 0.25,"q": "Tế bào tuyến tụy tiết ra nhiều enzyme tiêu hóa (bản chất protein). Dự đoán bào quan nào phát triển mạnh ở tế bào này?","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: protein màng cũng chuyển động. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về mô hình khảm động:","statements": ["a) Các phân tử phospholipid chuyển động làm màng mềm dẻo.","b) Protein màng đứng yên, không chuyển động.","c) Cholesterol giúp màng tế bào động vật ổn định.","d) Carbohydrate trên màng tham gia nhận biết tế bào."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: tế bào nhân sơ không có hệ nội màng. d) Đúng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nhân và nhiễm sắc thể:","statements": ["a) Nhân điều khiển mọi hoạt động sống của tế bào.","b) Chất nhiễm sắc co xoắn thành NST khi tế bào phân chia.","c) Tế bào nhân sơ cũng có màng nhân bao bọc DNA.","d) Tế bào nhân thực có kích thước lớn hơn tế bào nhân sơ."],"type": "truefalse"},{"answer": "Màng tế bào","explain": "Màng tế bào là ranh giới, trao đổi chất chọn lọc với môi trường.","level": "NB","points": 0.5,"q": "Cấu trúc nào là ranh giới giữa tế bào và môi trường bên ngoài?","type": "short"},{"answer": "Histon","explain": "Chất nhiễm sắc gồm DNA liên kết với protein histon.","level": "TH","points": 0.5,"q": "Protein liên kết với DNA tạo nên chất nhiễm sắc có tên là gì?","type": "short"}]},{"name": "Đề 7","questions": [{"answer": "D","explain": "Trung thể (2 trung tử) tham gia hình thành thoi phân bào ở tế bào động vật.","level": "NB","options": ["A. Lysosome","B. Không bào","C. Lục lạp","D. Trung thể"],"points": 0.25,"q": "Bào quan tham gia hình thành thoi phân bào là","type": "mcq"},{"answer": "A","explain": "Màng tế bào có tính thấm chọn lọc.","level": "NB","options": ["A. Có tính thấm chọn lọc","B. Cho mọi chất đi qua tự do","C. Không cho chất nào đi qua","D. Chỉ cho protein đi qua"],"points": 0.25,"q": "Màng tế bào có đặc tính","type": "mcq"},{"answer": "B","explain": "Thylakoid xếp thành grana chứa diệp lục; stroma chứa enzyme pha tối.","level": "TH","options": ["A. Mào và chất nền","B. Thylakoid xếp thành grana và stroma","C. Túi dẹp và không bào","D. Màng đơn và enzyme"],"points": 0.25,"q": "Lục lạp gồm các thành phần","type": "mcq"},{"answer": "C","explain": "Matrix (chất nền) chứa DNA vòng, ribosome 70S và enzyme của chu trình Krebs.","level": "VD","options": ["A. Màng ngoài","B. Màng trong","C. Chất nền (matrix)","D. Mào"],"points": 0.25,"q": "DNA vòng và ribosome 70S của ti thể nằm ở","type": "mcq"},{"answer": "A","explain": "Không bào lớn mất nước → tế bào mất trương, cây héo.","level": "VD","options": ["A. Không bào mất nước làm tế bào mất sức trương","B. Lục lạp ngừng quang hợp ngay","C. Thành tế bào bị phá hủy","D. Nhân bị phân hủy"],"points": 0.25,"q": "Khi cây bị héo do thiếu nước, điều gì xảy ra ở cấp tế bào?","type": "mcq"},{"answer": "C","explain": "Ribosome ti thể/lục lạp là 70S giống vi khuẩn — bằng chứng thuyết nội cộng sinh.","level": "VDC","options": ["A. Đều là 80S","B. Đều là 60S","C. Đều là 70S giống ribosome của vi khuẩn","D. Không có ribosome"],"points": 0.25,"q": "Ribosome trong ti thể và lục lạp có đặc điểm","type": "mcq"},{"answer": ["T","T","F","F"],"explain": "a) Đúng. b) Đúng. c) Sai: thực vật có thành cellulose. d) Sai: động vật không có lục lạp.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về thành tế bào thực vật và động vật:","statements": ["a) Tế bào thực vật có thành tế bào bằng cellulose.","b) Tế bào động vật không có thành tế bào.","c) Tế bào thực vật không có thành tế bào.","d) Tế bào động vật có lục lạp để quang hợp."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: Golgi đóng gói, không tổng hợp. b) Đúng. c) Đúng. d) Sai: lysosome tiêu hóa nội bào.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về bộ máy Golgi và lysosome:","statements": ["a) Bộ máy Golgi là nơi tổng hợp protein.","b) Protein từ lưới nội chất được chuyển đến Golgi để chế biến.","c) Lưới nội chất trơn tham gia khử độc ở tế bào gan.","d) Lysosome làm nhiệm vụ tổng hợp protein."],"type": "truefalse"},{"answer": "Nhân","explain": "Nhân lưu giữ thông tin di truyền và điều khiển hoạt động tế bào.","level": "NB","points": 0.5,"q": "Bào quan nào được ví như trung tâm điều khiển của tế bào?","type": "short"},{"answer": "Tiêu hóa nội bào","explain": "Lysosome chứa enzyme thủy phân để tiêu hóa nội bào.","level": "TH","points": 0.5,"q": "Quá trình phân giải các bào quan già bằng enzyme của lysosome được gọi là gì?","type": "short"}]},{"name": "Đề 8","questions": [{"answer": "B","explain": "Nhân con tổng hợp rARN để tạo ribosome.","level": "NB","options": ["A. DNA","B. ARN ribosome","C. ATP","D. Protein màng"],"points": 0.25,"q": "Nhân con tổng hợp","type": "mcq"},{"answer": "D","explain": "Khung xương: vi ống, vi sợi, sợi trung gian — nâng đỡ, vận chuyển bào quan.","level": "NB","options": ["A. Dự trữ năng lượng","B. Tổng hợp protein","C. Quang hợp","D. Nâng đỡ tế bào và vận chuyển các bào quan"],"points": 0.25,"q": "Chức năng của khung xương tế bào là","type": "mcq"},{"answer": "A","explain": "Màng trong ti thể gấp nếp thành mào tăng diện tích hô hấp.","level": "TH","options": ["A. Màng trong gấp nếp thành mào","B. Màng ngoài trơn","C. Có DNA vòng","D. Có ribosome 70S"],"points": 0.25,"q": "Đặc điểm cấu tạo giúp ti thể tăng hiệu quả hô hấp là","type": "mcq"},{"answer": "D","explain": "Tế bào nhân thực: nhân hoàn chỉnh, hệ nội màng, bào quan có màng, kích thước lớn.","level": "VD","options": ["A. Có vùng nhân","B. Ribosome 70S","C. Không có hệ nội màng","D. Có nhân hoàn chỉnh và hệ nội màng"],"points": 0.25,"q": "Tế bào của nấm men khác tế bào vi khuẩn ở điểm","type": "mcq"},{"answer": "C","explain": "Lỗ nhân cho ARN ra và protein vào; DNA không ra khỏi nhân.","level": "VD","options": ["A. DNA","B. Nhiễm sắc thể","C. ARN và protein","D. Ribosome nguyên vẹn"],"points": 0.25,"q": "Các chất được trao đổi qua lỗ nhân là","type": "mcq"},{"answer": "B","explain": "Mất diệp lục (vàng lá) → giảm hấp thụ ánh sáng → giảm quang hợp.","level": "VDC","options": ["A. Tăng quang hợp","B. Giảm khả năng hấp thụ ánh sáng, giảm quang hợp","C. Không ảnh hưởng","D. Tăng hô hấp"],"points": 0.25,"q": "Lá cây bị vàng (mất diệp lục) do thiếu dinh dưỡng. Hệ quả đối với tế bào lá là","type": "mcq"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: chỉ có ở tế bào thực vật. c) Đúng. d) Sai: không bào động vật nhỏ.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về lục lạp và không bào:","statements": ["a) Lục lạp chỉ có ở tế bào thực vật.","b) Mọi tế bào nhân thực đều có lục lạp.","c) Không bào lớn giúp tế bào thực vật giữ trương.","d) Tế bào động vật có không bào lớn như tế bào thực vật."],"type": "truefalse"},{"answer": ["T","F","F","T"],"explain": "a) Đúng. b) Sai: nhân sơ không có màng nhân. c) Sai: nhân sơ có 70S. d) Đúng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về điểm khác nhau giữa tế bào nhân sơ và nhân thực:","statements": ["a) Tế bào nhân thực có DNA kết hợp với histon.","b) Tế bào nhân sơ có màng nhân bao bọc DNA.","c) Ribosome của tế bào nhân sơ là loại 80S.","d) Tế bào nhân sơ nhỏ hơn tế bào nhân thực."],"type": "truefalse"},{"answer": "Lỗ nhân","explain": "Lỗ nhân trên màng nhân là nơi trao đổi chất giữa nhân và tế bào chất.","level": "NB","points": 0.5,"q": "Cấu trúc nào trên màng nhân cho phép trao đổi chất giữa nhân và tế bào chất?","type": "short"},{"answer": "Grana","explain": "Thylakoid xếp chồng thành các hạt grana chứa diệp lục.","level": "TH","points": 0.5,"q": "Các chồng thylakoid trong lục lạp được gọi là gì?","type": "short"}]},{"name": "Đề 9","questions": [{"answer": "C","explain": "Chất nhiễm sắc = DNA + histon; khi phân chia co xoắn thành NST.","level": "NB","options": ["A. Protein và lipid","B. DNA và cellulose","C. DNA và protein histon","D. ARN và protein"],"points": 0.25,"q": "Chất nhiễm sắc được cấu tạo từ","type": "mcq"},{"answer": "A","explain": "Lưới nội chất là hệ thống màng tạo nên hệ nội màng.","level": "NB","options": ["A. Lưới nội chất","B. Màng tế bào","C. Thành tế bào","D. Màng nhân"],"points": 0.25,"q": "Hệ thống nội màng của tế bào chủ yếu do bào quan nào tạo nên?","type": "mcq"},{"answer": "D","explain": "Glycoprotein mặt ngoài màng giúp nhận biết tế bào (quan trọng khi ghép mô).","level": "TH","options": ["A. Vận chuyển oxygen","B. Tổng hợp ATP","C. Dự trữ đường","D. Nhận biết tế bào"],"points": 0.25,"q": "Dấu chuẩn glycoprotein trên màng tế bào có vai trò","type": "mcq"},{"answer": "B","explain": "Tế bào mất nhân không tổng hợp được protein mới, không phân chia.","level": "VD","options": ["A. Vẫn tổng hợp protein bình thường","B. Không phân chia và không tổng hợp được protein mới","C. Tự tạo nhân mới","D. Chuyển thành tế bào nhân sơ"],"points": 0.25,"q": "Vì sao tế bào bị mất nhân thì không thể phân chia?","type": "mcq"},{"answer": "C","explain": "Ti thể tạo ATP; tế bào hoạt động mạnh cần nhiều năng lượng nên có nhiều ti thể.","level": "VD","options": ["A. Lục lạp","B. Không bào","C. Ti thể","D. Trung thể"],"points": 0.25,"q": "Tế bào nào sau đây cần nhiều năng lượng nhất nên có nhiều ti thể?","type": "mcq"},{"answer": "D","explain": "Tất cả đều đúng: màng kép, DNA vòng, ribosome 70S ở cả hai.","level": "VDC","options": ["A. Đều có màng kép","B. Đều có DNA vòng","C. Đều có ribosome 70S","D. Cả A, B và C"],"points": 0.25,"q": "Bằng chứng cho thấy ti thể và lục lạp có nguồn gốc nội cộng sinh là","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: đó là lưới nội chất trơn. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về lưới nội chất:","statements": ["a) Lưới nội chất hạt có ribosome bám trên màng.","b) Lưới nội chất là một phần của hệ nội màng.","c) Lưới nội chất hạt tổng hợp lipid.","d) Lưới nội chất trơn tham gia khử độc."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: khung xương có ở mọi tế bào nhân thực. c) Đúng. d) Sai: peroxisome phân giải H2O2.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về khung xương tế bào và peroxisome:","statements": ["a) Khung xương tế bào gồm vi ống, vi sợi, sợi trung gian.","b) Chỉ tế bào động vật mới có khung xương tế bào.","c) Trung thể có ở tế bào động vật.","d) Peroxisome tổng hợp protein cho tế bào."],"type": "truefalse"},{"answer": "Nhiễm sắc thể","explain": "Khi phân chia, chất nhiễm sắc co xoắn thành nhiễm sắc thể (NST).","level": "NB","points": 0.5,"q": "Chất nhiễm sắc co xoắn lại khi tế bào phân chia tạo thành cấu trúc nào? (Viết tắt: NST)","type": "short"},{"answer": "Mào","explain": "Màng trong ti thể gấp nếp thành mào.","level": "TH","points": 0.5,"q": "Nếp gấp của màng trong ti thể được gọi là gì?","type": "short"}]},{"name": "Đề 10","questions": [{"answer": "B","explain": "Bộ máy Golgi: túi dẹp xếp chồng, chế biến, đóng gói, phân phối.","level": "NB","options": ["A. Túi tròn chứa enzyme tiêu hóa","B. Các túi dẹp xếp chồng lên nhau","C. Màng kép có lỗ","D. Sợi dài xoắn"],"points": 0.25,"q": "Bộ máy Golgi có cấu tạo","type": "mcq"},{"answer": "C","explain": "Lysosome: enzyme thủy phân, tiêu hóa nội bào.","level": "NB","options": ["A. Quang hợp","B. Hô hấp","C. Tiêu hóa nội bào","D. Tổng hợp lipid"],"points": 0.25,"q": "Chức năng của lysosome là","type": "mcq"},{"answer": "A","explain": "Thành cellulose cứng bảo vệ và giữ hình dạng tế bào thực vật.","level": "TH","options": ["A. Bảo vệ và giữ hình dạng tế bào","B. Quang hợp","C. Hô hấp","D. Tổng hợp protein"],"points": 0.25,"q": "Thành tế bào bằng cellulose ở tế bào thực vật có vai trò","type": "mcq"},{"answer": "C","explain": "Không bào mất nước → tế bào co nguyên sinh, mất trương.","level": "VD","options": ["A. Tế bào trương nước","B. Tế bào vỡ ra","C. Tế bào mất trương, co nguyên sinh","D. Không có gì xảy ra"],"points": 0.25,"q": "Khi tế bào thực vật mất nước, không bào lớn sẽ","type": "mcq"},{"answer": "B","explain": "Tế bào rễ không quang hợp nên ít/không có lục lạp; tế bào lá có nhiều lục lạp.","level": "VD","options": ["A. Tế bào rễ có nhiều lục lạp hơn","B. Tế bào lá có nhiều lục lạp hơn","C. Hai tế bào giống nhau","D. Tế bào rễ có nhiều ti thể hơn"],"points": 0.25,"q": "So sánh tế bào lá và tế bào rễ của cùng một cây","type": "mcq"},{"answer": "A","explain": "Protein tiết: lưới nội chất hạt tổng hợp → Golgi đóng gói → xuất bào.","level": "VDC","options": ["A. Lưới nội chất hạt → bộ máy Golgi → xuất bào","B. Lysosome → Golgi → nhân","C. Ti thể → lưới nội chất → màng","D. Nhân → ribosome tự do → màng"],"points": 0.25,"q": "Con đường đi của một protein được tế bào tiết ra ngoài là","type": "mcq"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: nhân sơ không có ti thể. c) Đúng. d) Sai: thực vật không có trung thể.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về ti thể và các bào quan:","statements": ["a) Mọi tế bào nhân thực đều có ti thể.","b) Tế bào nhân sơ cũng có ti thể để hô hấp.","c) Tế bào thực vật có cả ti thể và lục lạp.","d) Tế bào thực vật có trung thể."],"type": "truefalse"},{"answer": ["F","T","F","T"],"explain": "a) Sai: màng nhân là màng kép. b) Đúng. c) Sai: rARN được tổng hợp ở nhân con. d) Đúng.","level": "VDC","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nhân:","statements": ["a) Màng nhân là màng đơn.","b) Lỗ nhân là nơi trao đổi chất giữa nhân và tế bào chất.","c) DNA được tổng hợp ở nhân con.","d) Nhân điều khiển hoạt động sống của tế bào."],"type": "truefalse"},{"answer": "Golgi","explain": "Bộ máy Golgi chế biến, đóng gói và phân phối protein, lipid.","level": "NB","points": 0.5,"q": "Bào quan nào đóng gói và phân phối protein trong tế bào? (Ghi tên ngắn gọn)","type": "short"},{"answer": "Matrix","explain": "Chất nền của ti thể (matrix) chứa DNA, ribosome và enzyme hô hấp.","level": "TH","points": 0.5,"q": "Chất nền bên trong ti thể có tên tiếng Anh là gì?","type": "short"}]}]}
