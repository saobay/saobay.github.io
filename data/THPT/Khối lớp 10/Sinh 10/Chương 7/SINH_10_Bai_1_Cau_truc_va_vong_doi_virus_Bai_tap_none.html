{"sets": [{"name": "Đề 1","questions": [{"answer": "B","explain": "Virus là thực thể chưa có cấu tạo tế bào, kí sinh nội bào bắt buộc.","level": "NB","options": ["A. sinh vật nhân sơ đơn bào.","B. thực thể chưa có cấu tạo tế bào, kí sinh nội bào bắt buộc.","C. sinh vật nhân thực đa bào.","D. tế bào có nhân hoàn chỉnh."],"points": 0.25,"q": "Virus là","type": "mcq"},{"answer": "C","explain": "Virus gồm lõi nucleic acid và vỏ capsid protein.","level": "NB","options": ["A. tế bào chất và nhân.","B. màng sinh chất và thành tế bào.","C. lõi nucleic acid và vỏ capsid.","D. ti thể và lục lạp."],"points": 0.25,"q": "Cấu trúc cơ bản của virus gồm","type": "mcq"},{"answer": "A","explain": "Vỏ capsid được cấu tạo từ protein.","level": "NB","options": ["A. protein.","B. lipid.","C. cellulose.","D. tinh bột."],"points": 0.25,"q": "Vỏ capsid của virus được cấu tạo từ","type": "mcq"},{"answer": "D","explain": "Virus không có cấu tạo tế bào, không tự trao đổi chất và không tự sinh sản độc lập.","level": "TH","options": ["A. Vì virus quá nhỏ.","B. Vì virus không có vật chất di truyền.","C. Vì virus không gây bệnh.","D. Vì virus không có cấu tạo tế bào và không tự sinh sản độc lập."],"points": 0.25,"q": "Vì sao virus không được coi là sinh vật sống theo nghĩa đầy đủ?","type": "mcq"},{"answer": "B","explain": "Gai glycoprotein giúp virus nhận biết và bám vào tế bào chủ đặc hiệu.","level": "TH","options": ["A. bảo vệ lõi nucleic acid.","B. giúp virus nhận biết và bám vào tế bào chủ.","C. tổng hợp protein cho virus.","D. giúp virus di chuyển."],"points": 0.25,"q": "Vai trò của gai glycoprotein trên vỏ virus là","type": "mcq"},{"answer": "C","explain": "Kháng sinh nhắm vào cấu trúc và quá trình sống của vi khuẩn (thành tế bào, ribosome...); virus không có các mục tiêu này.","level": "VDC","options": ["A. Vì virus quá nhỏ.","B. Vì virus không gây bệnh.","C. Vì virus không có cấu tạo tế bào và quá trình trao đổi chất mà kháng sinh nhắm tới.","D. Vì kháng sinh chỉ dùng cho cây trồng."],"points": 0.25,"q": "Vì sao kháng sinh không có tác dụng diệt virus?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: virus có DNA hoặc RNA, chỉ một trong hai. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về virus:","statements": ["a) Virus chưa có cấu tạo tế bào.","b) Virus có kích thước siêu hiển vi.","c) Mỗi virus vừa có DNA vừa có RNA.","d) Virus chỉ nhân lên trong tế bào chủ sống."],"type": "truefalse"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: tiềm tan không làm chết tế bào ngay. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về chu trình virus:","statements": ["a) Chu trình tan gồm 5 giai đoạn.","b) Chu trình tiềm tan làm tan tế bào chủ ngay.","c) Chu trình tan kết thúc bằng phá vỡ tế bào chủ.","d) Virus tiềm tan có thể chuyển sang chu trình tan."],"type": "truefalse"},{"answer": "Hấp phụ","explain": "Hấp phụ: virus bám vào thụ thể đặc hiệu trên tế bào chủ.","level": "VD","points": 0.5,"q": "Giai đoạn đầu tiên của chu trình tan, khi virus bám vào tế bào chủ, có tên là gì?","type": "short"},{"answer": "Tiềm tan","explain": "Chu trình tiềm tan: virus cài gen vào NST tế bào chủ.","level": "VDC","points": 0.5,"q": "Chu trình nào của virus cài hệ gen vào NST của tế bào chủ?","type": "short"}]},{"name": "Đề 2","questions": [{"answer": "D","explain": "Lõi virus chứa DNA hoặc RNA (chỉ một trong hai).","level": "NB","options": ["A. DNA và RNA.","B. protein.","C. lipid.","D. DNA hoặc RNA."],"points": 0.25,"q": "Lõi của virus chứa","type": "mcq"},{"answer": "B","explain": "Virus cúm, SARS-CoV-2 có vỏ ngoài (envelope).","level": "NB","options": ["A. virus khảm thuốc lá.","B. virus cúm.","C. virus đậu mùa.","D. phage."],"points": 0.25,"q": "Virus nào sau đây có vỏ ngoài?","type": "mcq"},{"answer": "C","explain": "Chu trình tan: virus nhân lên nhanh và làm tan (chết) tế bào chủ.","level": "NB","options": ["A. nuôi dưỡng tế bào chủ.","B. giúp tế bào chủ phân chia.","C. làm tan (chết) tế bào chủ.","D. bảo vệ tế bào chủ."],"points": 0.25,"q": "Kết quả của chu trình tan đối với tế bào chủ là","type": "mcq"},{"answer": "D","explain": "Phân loại virus dựa vào loại nucleic acid và có/không có vỏ ngoài.","level": "TH","options": ["A. kích thước và màu sắc.","B. nơi sống và thức ăn.","C. số lượng gai.","D. loại nucleic acid và có hay không có vỏ ngoài."],"points": 0.25,"q": "Virus được phân loại dựa vào","type": "mcq"},{"answer": "A","explain": "Tiền virus là hệ gen virus đã cài vào NST tế bào chủ.","level": "TH","options": ["A. hệ gen virus đã cài vào NST tế bào chủ.","B. virus hoàn chỉnh mới lắp ráp.","C. vỏ capsid rỗng.","D. tế bào chủ bị nhiễm."],"points": 0.25,"q": "Tiền virus (provirus) là","type": "mcq"},{"answer": "B","explain": "Virus đã cài gen vào tế bào chủ rất khó loại bỏ; phòng ngừa bằng vaccine hiệu quả và kinh tế hơn.","level": "VDC","options": ["A. Vì vaccine rẻ hơn.","B. Vì virus kí sinh trong tế bào, đã cài gen vào tế bào chủ nên khó tiêu diệt triệt để.","C. Vì thuốc không thể vào cơ thể.","D. Vì virus không gây bệnh nặng."],"points": 0.25,"q": "Vì sao với bệnh do virus, phòng bệnh bằng vaccine thường hiệu quả hơn chữa bệnh bằng thuốc?","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: vỏ ngoài là lớp lipid. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về cấu trúc virus:","statements": ["a) Lõi virus mang thông tin di truyền.","b) Vỏ ngoài của virus được cấu tạo từ protein.","c) Vỏ capsid bảo vệ lõi nucleic acid.","d) Một số virus có thêm vỏ ngoài và gai glycoprotein."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: tiềm tan nhân lên cùng tế bào chủ. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về chu trình tiềm tan:","statements": ["a) Virus cài hệ gen vào NST tế bào chủ.","b) Hệ gen virus nhân lên cùng tế bào chủ.","c) Chu trình tiềm tan làm chết tế bào chủ ngay.","d) Virus tiềm tan có thể chuyển sang chu trình tan."],"type": "truefalse"},{"answer": "Capsid","explain": "Vỏ protein bao ngoài lõi virus gọi là capsid.","level": "VD","points": 0.5,"q": "Vỏ protein bao bọc lõi nucleic acid của virus có tên là gì?","type": "short"},{"answer": "Phóng thích","explain": "Phóng thích: virus phá vỡ tế bào chủ thoát ra ngoài.","level": "VDC","points": 0.5,"q": "Giai đoạn virus phá vỡ tế bào chủ để thoát ra ngoài có tên là gì?","type": "short"}]},{"name": "Đề 3","questions": [{"answer": "B","explain": "Virus có kích thước siêu hiển vi, chỉ thấy được bằng kính hiển vi điện tử.","level": "NB","options": ["A. mắt thường.","B. kính hiển vi điện tử.","C. kính lúp.","D. kính hiển vi quang học."],"points": 0.25,"q": "Để quan sát virus, người ta dùng","type": "mcq"},{"answer": "C","explain": "Virus kí sinh nội bào bắt buộc, chỉ nhân lên trong tế bào chủ sống.","level": "NB","options": ["A. trong đất.","B. trong nước.","C. trong tế bào chủ sống.","D. trên đĩa thạch dinh dưỡng."],"points": 0.25,"q": "Virus nhân lên ở","type": "mcq"},{"answer": "A","explain": "Tiềm tan: cài gen vào NST chủ, nhân lên cùng tế bào, chưa giết tế bào.","level": "NB","options": ["A. cài gen vào NST chủ, chưa làm chết tế bào.","B. làm tan tế bào chủ ngay.","C. không nhân lên.","D. rời khỏi tế bào chủ."],"points": 0.25,"q": "Đặc điểm của chu trình tiềm tan là","type": "mcq"},{"answer": "D","explain": "Thứ tự: hấp phụ → xâm nhập → tổng hợp → lắp ráp → phóng thích.","level": "TH","options": ["A. xâm nhập - hấp phụ - tổng hợp - lắp ráp - phóng thích.","B. hấp phụ - tổng hợp - xâm nhập - lắp ráp - phóng thích.","C. tổng hợp - lắp ráp - hấp phụ - xâm nhập - phóng thích.","D. hấp phụ - xâm nhập - tổng hợp - lắp ráp - phóng thích."],"points": 0.25,"q": "Trình tự đúng các giai đoạn của chu trình tan là","type": "mcq"},{"answer": "B","explain": "Mỗi virus chỉ chứa DNA hoặc RNA, không có cả hai.","level": "TH","options": ["A. Mỗi virus vừa có DNA vừa có RNA.","B. Mỗi ợp protein.","D. phá vỡ tế bào chủ."],"points": 0.25,"q": "Giai đoạn hấp phụ là khi virus","type": "mcq"},{"answer": "C","explain": "Xâm nhập: virus đưa nucleic acid vào trong tế bào chủ.","level": "NB","options": ["A. bám vào tế bào chủ.","B. lắp ráp virus mới.","C. đưa nucleic acid vào tế bào chủ.","D. phá vỡ tế bào chủ."],"points": 0.25,"q": "Giai đoạn xâm nhập là khi virus","type": "mcq"},{"answer": "B","explain": "Tổng hợp: tế bào chủ tổng hợp nucleic acid và protein virus.","level": "NB","options": ["A. bám vào tế bào chủ.","B. tế bào chủ tổng hợp thành phần của virus.","C. lắp ráp virus hoàn chỉnh.","D. phóng thích virus."],"points": 0.25,"q": "Giai đoạn tổng hợp là khi","type": "mcq"},{"answer": "D","explain": "Virus bám vào thụ thể đặc hiệu nên chỉ xâm nhập được tế bào chủ phù hợp.","level": "TH","options": ["A. Vì virus quá yếu.","B. Vì virus không di chuyển được.","C. Vì tế bào chủ quá nhỏ.","D. Vì virus chỉ bám được vào thụ thể đặc hiệu của tế bào chủ phù hợp."],"points": 0.25,"q": "Vì sao mỗi loại virus thường chỉ gây bệnh cho một số loại tế bào nhất định?","type": "mcq"},{"answer": "A","explain": "Virus dùng bộ máy của tế bào chủ để tổng hợp thành phần của mình.","level": "TH","options": ["A. Vì virus không có hệ enzyme và bào quan riêng để tổng hợp.","B. Vì virus lười biếng.","C. Vì tế bào chủ tự nguyện giúp.","D. Vì virus không có nucleic acid."],"points": 0.25,"q": "Vì sao virus phải dùng bộ máy tổng hợp của tế bào chủ?","type": "mcq"},{"answer": "B","explain": "Virus đã cài gen vào NST tế bào chủ, thuốc khó loại bỏ hết mà không hại tế bào chủ.","level": "VDC","options": ["A. Vì HIV quá nhỏ.","B. Vì HIV cài hệ gen vào NST tế bào chủ, khó loại bỏ triệt để.","C. Vì HIV không gây bệnh.","D. Vì không có thuốc nào."],"points": 0.25,"q": "Vì sao bệnh do virus HIV rất khó chữa khỏi hoàn toàn?","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: vỏ capsid là protein. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về thành phần virus:","statements": ["a) Lõi virus chứa DNA hoặc RNA.","b) Vỏ capsid được cấu tạo từ lipid.","c) Vỏ ngoài (nếu có) là lớp lipid.","d) Gai glycoprotein chứa protein và đường."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: chu trình tan làm chết tế bào. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về hậu quả nhiễm virus:","statements": ["a) Chu trình tiềm tan chưa làm chết tế bào chủ.","b) Virus tiềm tan nhân lên cùng tế bào chủ.","c) Chu trình tan giúp tế bào chủ sống lâu hơn.","d) Tiềm tan có thể chuyển thành chu trình tan."],"type": "truefalse"},{"answer": "Xâm nhập","explain": "Xâm nhập: virus đưa nucleic acid vào tế bào chủ.","level": "VD","points": 0.5,"q": "Giai đoạn virus đưa nucleic acid vào trong tế bào chủ có tên là gì?","type": "short"},{"answer": "Lắp ráp","explain": "Lắp ráp: các thành phần tạo thành virus hoàn chỉnh.","level": "VDC","points": 0.5,"q": "Giai đoạn các thành phần virus kết hợp thành virus hoàn chỉnh có tên là gì?","type": "short"}]},{"name": "Đề 5","questions": [{"answer": "D","explain": "Virus cúm có vỏ ngoài và gai glycoprotein.","level": "NB","options": ["A. virus khảm thuốc lá.","B. phage.","C. virus đậu mùa.","D. virus cúm."],"points": 0.25,"q": "Virus nào sau đây có vỏ ngoài và gai?","type": "mcq"},{"answer": "B","explain": "Phage (thể thực khuẩn) là virus kí sinh vi khuẩn.","level": "NB","options": ["A. virus kí sinh thực vật.","B. virus kí sinh vi khuẩn.","C. virus kí sinh động vật.","D. virus kí sinh nấm."],"points": 0.25,"q": "Phage là","type": "mcq"},{"answer": "A","explain": "Virus khảm thuốc lá là virus RNA.","level": "NB","options": ["A. virus RNA.","B. virus DNA.","C. virus có cả DNA và RNA.","D. virus không có nucleic acid."],"points": 0.25,"q": "Virus khảm thuốc lá là","type": "mcq"},{"answer": "C","explain": "Virus DNA dùng DNA làm vật chất di truyền.","level": "TH","options": ["A. virus không có vỏ.","B. virus có vỏ ngoài.","C. virus có DNA làm vật chất di truyền.","D. virus có RNA làm vật chất di truyền."],"points": 0.25,"q": "Virus DNA là","type": "mcq"},{"answer": "B","explain": "Virus RNA dùng RNA làm vật chất di truyền (cúm, SARS-CoV-2, HIV).","level": "TH","options": ["A. virus không có vỏ.","B. virus có RNA làm vật chất di truyền.","C. virus có DNA làm vật chất di truyền.","D. virus kí sinh thực vật."],"points": 0.25,"q": "Virus RNA là","type": "mcq"},{"answer": "D","explain": "Virus RNA dễ đột biến hơn vì enzyme sao chép RNA ít chính xác, tạo biến thể mới nhanh.","level": "VDC","options": ["A. Vì virus RNA to hơn.","B. Vì virus RNA sống lâu hơn.","C. Vì virus RNA không gây bệnh.","D. Vì enzyme sao chép RNA kém chính xác, dễ tạo biến thể mới."],"points": 0.25,"q": "Vì sao virus RNA (như cúm, SARS-CoV-2) thường biến đổi tạo biến thể mới nhanh?","type": "mcq"},{"answer": ["F","T","T","T"],"explain": "a) Sai: virus chưa có cấu tạo tế bào. b) Đúng. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về bản chất virus:","statements": ["a) Virus là cơ thể sống hoàn chỉnh.","b) Virus không tự trao đổi chất.","c) Virus không tự sinh sản độc lập.","d) Virus cần tế bào chủ để nhân lên."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: hấp phụ là bám vào tế bào. c) Đúng. d) Sai: phóng thích phá vỡ tế bào.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về các giai đoạn:","statements": ["a) Hấp phụ xảy ra trước xâm nhập.","b) Hấp phụ là đưa nucleic acid vào tế bào.","c) Tổng hợp nhờ bộ máy của tế bào chủ.","d) Phóng thích giúp tế bào chủ sống sót."],"type": "truefalse"},{"answer": "Tổng hợp","explain": "Tổng hợp: tế bào chủ tổng hợp thành phần virus.","level": "VD","points": 0.5,"q": "Giai đoạn tế bào chủ tổng hợp nucleic acid và protein của virus có tên là gì?","type": "short"},{"answer": "Kí sinh nội bào bắt buộc","explain": "Virus chỉ nhân lên trong tế bào chủ sống: kí sinh nội bào bắt buộc.","level": "VDC","points": 0.5,"q": "Virus chỉ sống và nhân lên trong tế bào chủ được gọi là gì?","type": "short"}]},{"name": "Đề 6","questions": [{"answer": "C","explain": "Virus có kích thước siêu hiển vi (20-300 nm).","level": "NB","options": ["A. kích thước lớn.","B. kích thước hiển vi thường.","C. kích thước siêu hiển vi.","D. nhìn thấy bằng mắt thường."],"points": 0.25,"q": "Kích thước của virus thuộc loại","type": "mcq"},{"answer": "A","explain": "Vỏ ngoài là lớp lipid kép (envelope).","level": "NB","options": ["A. lipid.","B. protein.","C. cellulose.","D. nucleic acid."],"points": 0.25,"q": "Vỏ ngoài của virus được cấu tạo chủ yếu từ","type": "mcq"},{"answer": "D","explain": "Gai giúp bám vào thụ thể tế bào chủ.","level": "NB","options": ["A. di chuyển.","B. quang hợp.","C. hô hấp.","D. bám vào tế bào chủ."],"points": 0.25,"q": "Chức năng của gai glycoprotein là","type": "mcq"},{"answer": "B","explain": "Lõi mang thông tin di truyền (DNA hoặc RNA).","level": "TH","options": ["A. bảo vệ virus.","B. mang thông tin di truyền.","C. giúp virus di chuyển.","D. tổng hợp năng lượng."],"points": 0.25,"q": "Vai trò của lõi nucleic acid là","type": "mcq"},{"answer": "C","explain": "Capsid bảo vệ lõi và giúp bám vào tế bào chủ.","level": "TH","options": ["A. mang thông tin di truyền.","B. tổng hợp protein.","C. bảo vệ lõi và giúp bám tế bào chủ.","D. tạo năng lượng."],"points": 0.25,"q": "Vai trò của vỏ capsid là","type": "mcq"},{"answer": "A","explain": "Kháng sinh diệt vi khuẩn; virus không có thành tế bào/ribosome vi khuẩn nên kháng sinh vô tác dụng, thậm chí gây hại do loạn khuẩn.","level": "VDC","options": ["A. Kháng sinh không diệt được virus mà còn gây tác dụng phụ.","B. Kháng sinh diệt được mọi virus.","C. Kháng sinh giúp virus mạnh lên.","D. Kháng sinh chỉ dùng cho virus."],"points": 0.25,"q": "Bệnh nhân cúm (do virus) tự ý uống kháng sinh. Điều gì xảy ra?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: mỗi virus chỉ có DNA hoặc RNA. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nucleic acid virus:","statements": ["a) Lõi virus chứa vật chất di truyền.","b) Virus DNA dùng DNA làm gen.","c) Mọi virus đều chứa cả DNA và RNA.","d) Virus RNA dùng RNA làm gen."],"type": "truefalse"},{"answer": ["F","T","T","T"],"explain": "a) Sai: tiềm tan chưa giết tế bào. b) Đúng. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nhiễm virus và chu trình:","statements": ["a) Mọi nhiễm virus đều làm chết tế bào chủ ngay.","b) Virus có thể tồn tại dạng tiềm tan lâu dài.","c) Tia UV có thể kích hoạt virus tiềm tan.","d) Chu trình tan gồm 5 giai đoạn."],"type": "truefalse"},{"answer": "DNA hoặc RNA","explain": "Lõi virus chứa DNA hoặc RNA.","level": "VD","points": 0.5,"q": "Lõi virus chứa loại nucleic acid nào? (trả lời: DNA hoặc RNA)","type": "short"},{"answer": "5","explain": "Chu trình tan gồm 5 giai đoạn.","level": "VDC","points": 0.5,"q": "Chu trình tan của virus gồm mấy giai đoạn? (trả lời bằng số)","type": "short"}]},{"name": "Đề 7","questions": [{"answer": "B","explain": "Tiềm tan: virus cài gen vào NST chủ, nhân lên cùng tế bào.","level": "NB","options": ["A. chu trình tan.","B. chu trình tiềm tan.","C. chu trình sinh trưởng.","D. chu trình phân bào."],"points": 0.25,"q": "Virus HIV cài hệ gen vào NST tế bào lympho T thuộc","type": "mcq"},{"answer": "D","explain": "Phóng thích: virus phá vỡ tế bào chủ thoát ra.","level": "NB","options": ["A. hấp phụ.","B. xâm nhập.","C. tổng hợp.","D. phóng thích."],"points": 0.25,"q": "Giai đoạn virus phá vỡ tế bào chủ để thoát ra là","type": "mcq"},{"answer": "A","explain": "Lắp ráp: các thành phần tạo thành virus hoàn chỉnh.","level": "NB","options": ["A. lắp ráp.","B. hấp phụ.","C. xâm nhập.","D. tổng hợp."],"points": 0.25,"q": "Giai đoạn tạo thành virus hoàn chỉnh là","type": "mcq"},{"answer": "C","explain": "Virus dùng ribosome, enzyme của tế bào chủ vì không có hệ thống riêng.","level": "TH","options": ["A. Vì virus không có nucleic acid.","B. Vì virus thích nhờ vả.","C. Vì virus không có ribosome và hệ enzyme riêng.","D. Vì tế bào chủ tự tổng hợp giúp."],"points": 0.25,"q": "Vì sao virus phải sử dụng ribosome của tế bào chủ?","type": "mcq"},{"answer": "B","explain": "Thụ thể đặc hiệu quyết định virus nào xâm nhập tế bào nào.","level": "TH","options": ["A. kích thước virus.","B. thụ thể đặc hiệu trên tế bào chủ.","C. nhiệt độ môi trường.","D. số lượng virus."],"points": 0.25,"q": "Yếu tố quyết định virus xâm nhập được vào tế bào nào là","type": "mcq"},{"answer": "D","explain": "Virus bám thụ thể đặc hiệu; tế bào không có thụ thể phù hợp thì virus không xâm nhập được.","level": "VDC","options": ["A. Vì virus cúm quá yếu.","B. Vì tế bào thực vật quá nhỏ.","C. Vì virus cúm sợ ánh sáng.","D. Vì tế bào thực vật không có thụ thể đặc hiệu cho virus cúm."],"points": 0.25,"q": "Vì sao virus cúm người không gây bệnh cho cây trồng?","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: virus chưa có cấu tạo tế bào. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về đặc điểm virus:","statements": ["a) Virus kí sinh nội bào bắt buộc.","b) Virus có cấu tạo tế bào nhân sơ.","c) Virus có kích thước siêu hiển vi.","d) Virus cần tế bào chủ để nhân lên."],"type": "truefalse"},{"answer": ["F","T","T","T"],"explain": "a) Sai: chu trình tan có 5 giai đoạn. b) Đúng. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về số giai đoạn:","statements": ["a) Chu trình tan gồm 4 giai đoạn.","b) Trình tự: hấp phụ, xâm nhập, tổng hợp, lắp ráp, phóng thích.","c) Tiềm tan: cài gen vào NST chủ.","d) Virus tiềm tan nhân lên cùng tế bào chủ."],"type": "truefalse"},{"answer": "Thụ thể","explain": "Virus bám vào thụ thể đặc hiệu trên tế bào chủ.","level": "VD","points": 0.5,"q": "Virus bám vào cấu trúc nào trên bề mặt tế bào chủ?","type": "short"},{"answer": "Tế bào chủ","explain": "Virus dùng bộ máy của tế bào chủ để tổng hợp thành phần.","level": "VDC","points": 0.5,"q": "Virus sử dụng bộ máy tổng hợp của đối tượng nào?","type": "short"}]},{"name": "Đề 8","questions": [{"answer": "A","explain": "Virus sởi là virus RNA có vỏ ngoài.","level": "NB","options": ["A. virus RNA.","B. virus DNA.","C. vi khuẩn.","D. nấm."],"points": 0.25,"q": "Virus sởi là","type": "mcq"},{"answer": "C","explain": "Virus đậu mùa là virus DNA.","level": "NB","options": ["A. virus RNA.","B. vi khuẩn.","C. virus DNA.","D. nấm."],"points": 0.25,"q": "Virus đậu mùa là","type": "mcq"},{"answer": "B","explain": "Virus dại là virus RNA.","level": "NB","options": ["A. virus DNA.","B. virus RNA.","C. vi khuẩn.","D. ký sinh trùng."],"points": 0.25,"q": "Virus dại là","type": "mcq"},{"answer": "D","explain": "Vaccine giúp cơ thể tạo kháng thể, phòng ngừa nhiễm virus.","level": "TH","options": ["A. diệt virus trong tế bào.","B. nuôi cấy virus.","C. phân lập virus.","D. giúp cơ thể tạo miễn dịch phòng bệnh."],"points": 0.25,"q": "Vai trò của vaccine phòng bệnh do virus là","type": "mcq"},{"answer": "A","explain": "Virus bám thụ thể đặc hiệu nên mỗi virus chỉ xâm nhập một số tế bào nhất định.","level": "TH","options": ["A. Virus chỉ bám được vào thụ thể đặc hiệu.","B. Virus quá lớn.","C. Tế bào chủ quá nhỏ.","D. Virus không di chuyển được."],"points": 0.25,"q": "Vì sao virus có tính đặc hiệu với tế bào chủ?","type": "mcq"},{"answer": "C","explain": "Virus trong tế bào nên hệ miễn dịch khó tiếp cận; virus tiềm tan cài gen vào NST càng khó loại bỏ.","level": "VDC","options": ["A. Vì virus quá to.","B. Vì virus không gây bệnh.","C. Vì virus sống trong tế bào và cài gen vào NST chủ.","D. Vì không có thuốc."],"points": 0.25,"q": "Vì sao cơ thể khó tiêu diệt hoàn toàn virus đã xâm nhập tế bào?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: tiềm tan chưa làm chết tế bào. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về hai chu trình:","statements": ["a) Chu trình tan làm chết tế bào chủ.","b) Chu trình tiềm tan cài gen vào NST chủ.","c) Chu trình tiềm tan làm chết tế bào chủ ngay.","d) Tiềm tan có thể chuyển sang tan."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: virus chưa có cấu tạo TB. b) Đúng. c) Đúng. d) Sai: virus chỉ có DNA hoặc RNA.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về phân loại:","statements": ["a) Virus là sinh vật nhân sơ.","b) Có virus DNA và virus RNA.","c) Có virus có vỏ ngoài và không có vỏ ngoài.","d) Mỗi virus chứa cả DNA và RNA."],"type": "truefalse"},{"answer": "Vaccine","explain": "Vaccine giúp cơ thể tạo miễn dịch phòng bệnh do virus.","level": "VD","points": 0.5,"q": "Biện pháp hiệu quả nhất để phòng bệnh do virus là gì?","type": "short"},{"answer": "Kháng thể","explain": "Vaccine giúp cơ thể tạo kháng thể chống virus.","level": "VDC","points": 0.5,"q": "Vaccine giúp cơ thể tạo ra chất gì để chống lại virus?","type": "short"}]},{"name": "Đề 9","questions": [{"answer": "D","explain": "HIV là virus RNA.","level": "NB","options": ["A. virus DNA.","B. vi khuẩn.","C. nấm.","D. virus RNA."],"points": 0.25,"q": "Virus HIV là","type": "mcq"},{"answer": "B","explain": "SARS-CoV-2 là virus RNA có vỏ ngoài.","level": "NB","options": ["A. virus DNA.","B. virus RNA có vỏ ngoài.","C. vi khuẩn.","D. nấm."],"points": 0.25,"q": "Virus SARS-CoV-2 là","type": "mcq"},{"answer": "C","explain": "Virus viêm gan B là virus DNA.","level": "NB","options": ["A. virus RNA.","B. vi khuẩn.","C. virus DNA.","D. nấm."],"points": 0.25,"q": "Virus viêm gan B là","type": "mcq"},{"answer": "A","explain": "Virus dùng năng lượng và nguyên liệu của tế bào chủ.","level": "TH","options": ["A. Vì virus không có hệ trao đổi chất riêng.","B. Vì virus tiết kiệm năng lượng.","C. Vì tế bào chủ dư thừa năng lượng.","D. Vì virus không có nucleic acid."],"points": 0.25,"q": "Vì sao virus sử dụng năng lượng của tế bào chủ?","type": "mcq"},{"answer": "D","explain": "Lõi mang gen; capsid bảo vệ và giúp bám.","level": "TH","options": ["A. Lõi bảo vệ, capsid mang gen.","B. Cả hai đều mang gen.","C. Cả hai đều bảo vệ.","D. Lõi mang gen, capsid bảo vệ và giúp bám."],"points": 0.25,"q": "Phân biệt vai trò của lõi và vỏ capsid:","type": "mcq"},{"answer": "B","explain": "Virus đã vào tế bào và cài gen thì kháng sinh (diệt vi khuẩn) vô tác dụng.","level": "VDC","options": ["A. Vì kháng sinh quá đắt.","B. Vì kháng sinh chỉ tác động lên vi khuẩn, không tác động lên virus trong tế bào.","C. Vì virus sợ kháng sinh.","D. Vì kháng sinh giúp virus mạnh lên."],"points": 0.25,"q": "Bệnh nhân nhiễm virus uống kháng sinh không khỏi vì","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: vỏ ngoài là lipid. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về vỏ virus:","statements": ["a) Vỏ capsid là protein.","b) Vỏ ngoài là protein.","c) Gai glycoprotein giúp bám tế bào chủ.","d) Không phải virus nào cũng có vỏ ngoài."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: chu trình tan làm chết tế bào. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về ứng dụng kiến thức virus:","statements": ["a) Hiểu chu trình giúp tìm thuốc ức chế virus.","b) Vaccine phòng được nhiều bệnh do virus.","c) Chu trình tan giúp tế bào chủ sống lâu.","d) Kháng sinh không chữa được bệnh do virus."],"type": "truefalse"},{"answer": "RNA","explain": "HIV là virus RNA.","level": "VD","points": 0.5,"q": "Virus HIV chứa loại nucleic acid nào?","type": "short"},{"answer": "DNA","explain": "Virus viêm gan B là virus DNA.","level": "VDC","points": 0.5,"q": "Virus viêm gan B chứa loại nucleic acid nào?","type": "short"}]},{"name": "Đề 10","questions": [{"answer": "A","explain": "Virus chưa có cấu tạo TB nên không phải sinh vật sống đầy đủ.","level": "NB","options": ["A. chưa có cấu tạo tế bào.","B. có kích thước lớn.","C. không gây bệnh.","D. không có vật chất di truyền."],"points": 0.25,"q": "Virus khác sinh vật sống ở điểm","type": "mcq"},{"answer": "C","explain": "Virus nhân lên nhờ bộ máy tế bào chủ.","level": "NB","options": ["A. tự tổng hợp.","B. phân đôi.","C. nhờ bộ máy của tế bào chủ.","D. nảy chồi."],"points": 0.25,"q": "Virus nhân lên bằng cách","type": "mcq"},{"answer": "B","explain": "Virus kí sinh trong tế bào sống.","level": "NB","options": ["A. hoại sinh.","B. kí sinh nội bào bắt buộc.","C. cộng sinh.","D. tự dưỡng."],"points": 0.25,"q": "Phương thức sống của virus là","type": "mcq"},{"answer": "D","explain": "Tiền virus: gen virus cài vào NST chủ.","level": "TH","options": ["A. virus hoàn chỉnh.","B. vỏ capsid rỗng.","C. tế bào chủ.","D. gen virus cài vào NST chủ."],"points": 0.25,"q": "Tiền virus là","type": "mcq"},{"answer": "A","explain": "Tia UV gây đột biến, kích hoạt virus tiềm tan.","level": "TH","options": ["A. tia UV, hóa chất.","B. nhiệt độ thấp.","C. bóng tối.","D. khô hạn."],"points": 0.25,"q": "Yếu tố có thể kích hoạt virus tiềm tan chuyển sang chu trình tan là","type": "mcq"},{"answer": "C","explain": "Virus bám thụ thể đặc hiệu; không có thụ thể phù hợp thì không xâm nhập.","level": "VDC","options": ["A. Vì virus quá yếu.","B. Vì tế bào quá nhỏ.","C. Vì tế bào không có thụ thể đặc hiệu cho virus đó.","D. Vì virus không di chuyển."],"points": 0.25,"q": "Một loại virus gây bệnh cho người nhưng không gây bệnh cho gà. Giải thích:","type": "mcq"},{"answer": ["F","T","T","T"],"explain": "a) Sai: virus chưa có cấu tạo TB. b) Đúng. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về virus và tế bào:","statements": ["a) Virus có cấu tạo tế bào hoàn chỉnh.","b) Virus nhỏ hơn nhiều so với vi khuẩn.","c) Virus cần tế bào chủ để nhân lên.","d) Virus có tính đặc hiệu với tế bào chủ."],"type": "truefalse"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: chu trình tan có 5 giai đoạn. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về các giai đoạn chu trình tan:","statements": ["a) Hấp phụ là giai đoạn đầu tiên.","b) Chu trình tan gồm 4 giai đoạn.","c) Phóng thích là giai đoạn cuối cùng.","d) Chu trình tan làm chết tế bào chủ."],"type": "truefalse"},{"answer": "Hấp phụ","explain": "Hấp phụ: virus bám vào tế bào chủ.","level": "VD","points": 0.5,"q": "Giai đoạn virus bám vào thụ thể tế bào chủ có tên là gì?","type": "short"},{"answer": "Tiềm tan","explain": "Tiềm tan: cài gen vào NST chủ.","level": "VDC","points": 0.5,"q": "HIV tồn tại lâu dài trong cơ thể nhờ chu trình nào?","type": "short"}]}]}
