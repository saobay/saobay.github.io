.","d) Virus NPV diệt được sâu hại."],"type": "truefalse"},{"answer": "Muỗi vằn","explain": "Sốt xuất huyết lây qua muỗi vằn đốt.","level": "VD","points": 0.5,"q": "Côn trùng nào truyền bệnh sốt xuất huyết?","type": "short"},{"answer": "Vaccine","explain": "Vaccine là chế phẩm từ virus suy yếu giúp phòng bệnh.","level": "VDC","points": 0.5,"q": "Chế phẩm từ virus đã suy yếu dùng để phòng bệnh có tên là gì?","type": "short"}]},{"name": "Đề 4","questions": [{"answer": "B","explain": "Quai bị là bệnh do virus ở người.","level": "NB","options": ["A. lao.","B. quai bị.","C. tả.","D. uốn ván."],"points": 0.25,"q": "Bệnh nào sau đây do virus gây ra ở người?","type": "mcq"},{"answer": "C","explain": "Rubella lây qua đường hô hấp.","level": "NB","options": ["A. tiêu hóa.","B. muỗi đốt.","C. hô hấp.","D. vết thương."],"points": 0.25,"q": "Bệnh rubella lây qua đường","type": "mcq"},{"answer": "A","explain": "Viêm não Nhật Bản lây qua muỗi đốt.","level": "NB","options": ["A. muỗi đốt.","B. hô hấp.","C. tiêu hóa.","D. vết thương."],"points": 0.25,"q": "Viêm não Nhật Bản lây qua","type": "mcq"},{"answer": "D","explain": "Ăn chín uống sôi phòng bệnh lây qua tiêu hóa (viêm gan A, bại liệt).","level": "TH","options": ["A. cúm.","B. sởi.","C. sốt xuất huyết.","D. viêm gan A."],"points": 0.25,"q": "Ăn chín, uống sôi giúp phòng bệnh nào?","type": "mcq"},{"answer": "B","explain": "Không dùng chung bơm kim tiêm phòng lây HIV, viêm gan B, C qua máu.","level": "TH","options": ["A. cúm.","B. HIV.","C. sởi.","D. dại."],"points": 0.25,"q": "Không dùng chung bơm kim tiêm giúp phòng bệnh nào?","type": "mcq"},{"answer": "A","explain": "Virus trong tế bào, kháng sinh chỉ diệt vi khuẩn nên không khỏi mà còn gây loạn khuẩn.","level": "VDC","options": ["A. Bệnh không khỏi vì kháng sinh không diệt được virus.","B. Bệnh khỏi nhanh hơn.","C. Virus biến thành vi khuẩn.","D. Không có ảnh hưởng gì."],"points": 0.25,"q": "Bệnh nhân sốt virus tự uống kháng sinh. Hậu quả là","type": "mcq"},{"answer": ["T","T ,"T"],"explain": "a) Đúng. b) Sai: dại lây qua vết cắn. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về đường lây truyền virus:","statements": ["a) Cúm lây qua hô hấp.","b) Dại lây qua hô hấp.","c) Sốt xuất huyết lây qua muỗi.","d) HIV lây qua máu."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: chu trình tan làm chết tế bào. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về kiến thức virus:","statements": ["a) Hiểu chu trình giúp tìm thuốc ức chế virus.","b) Vaccine phòng được nhiều bệnh do virus.","c) Chu trình tan giúp tế bào chủ sống lâu.","d) Kháng sinh không chữa được bệnh do virus."],"type": "truefalse"},{"answer": "Khẩu trang","explain": "Đeo khẩu trang ngăn giọt bắn chứa virus.","level": "VD","points": 0.5,"q": "Vật dụng nào giúp ngăn giọt bắn chứa virus lây qua hô hấp?","type": "short"},{"answer": "Muỗi","explain": "Bọ gậy là ấu trùng của muỗi; diệt bọ gậy ngăn muỗi sinh sản.","level": "VDC","points": 0.5,"q": "Diệt bọ gậy (ấu trùng muỗi) nhằm ngăn loài côn trùng nào sinh sản?","type": "short"}]},{"name": "Đề 10","questions": [{"answer": "B","explain": "COVID-19 do virus SARS-CoV-2 gây ra.","level": "NB","options": ["A. vi khuẩn.","B. virus.","C. nấm.","D. ký sinh trùng."],"points": 0.25,"q": "COVID-19 do tác nhân nào gây ra?","type": "mcq"},{"answer": "D","explain": "Virus gây bệnh cho người, vật nuôi, cây trồng.","level": "NB","options": ["A. người.","B. vật nuôi.","C. cây trồng.","D. cả người, vật nuôi và cây trồng."],"points": 0.25,"q": "Virus gây bệnh cho","type": "mcq"},{"answer": "A","explain": "Vaccine từ virus suy yếu/bất hoạt giúp tạo miễn dịch.","level": "NB","options": ["A. virus đã suy yếu hoặc bất hoạt.","B. vi khuẩn gây bệnh.","C. hóa chất độc.","D. kháng sinh."],"points": 0.25,"q": "Vaccine được sản xuất từ","type": "mcq"},{"answer": "C","explain": "Quan hệ tình dục an toàn phòng HIV, viêm gan B lây qua đường này.","level": "TH","options": ["A. cúm.","B. sởi.","C. HIV.","D. dại."],"points": 0.25,"q": "Quan hệ tình dục an toàn giúp phòng bệnh nào?","type": "mcq"},{"answer": "B","explain": "Tiêm phòng cho chó, mèo tạo miễn dịch, ngăn bệnh dại.","level": "TH","options": ["A. chữa bệnh dại.","B. tạo miễn dịch phòng bệnh dại.","C. diệt virus trong môi trường.","D. thay thế cách li."],"points": 0.25,"q": "Mục đích tiêm phòng dại cho chó, mèo là","type": "mcq"},{"answer": "D","explain": "Virus cúm biến đổi nhanh tạo biến thể mới nên vaccine cần cập nhật.","level": "VDC","options": ["A. Vì vaccine hết hạn.","B. Vì người dân không tiêm.","C. Vì cúm không còn nguy hiểm.","D. Vì virus cúm biến đổi nhanh tạo biến thể mới."],"points": 0.25,"q": "Vì sao phải tiêm vaccine cúm nhắc lại hằng năm?","type": "mcq"},{"answer": ["F","T","T","T"],"explain": "a) Sai: virus chưa có cấu tạo TB. b) Đúng. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về bản chất virus:","statements": ["a) Virus có cấu tạo tế bào hoàn chỉnh.","b) Virus nhỏ hơn nhiều so với vi khuẩn.","c) Virus cần tế bào chủ để nhân lên.","d) Virus có tính đặc hiệu với tế bào chủ."],"type": "truefalse"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: viêm gan B lây qua máu. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về bệnh do virus:","statements": ["a) Cúm lây qua hô hấp.","b) Viêm gan B lây qua hô hấp.","c) Sốt xuất huyết lây qua muỗi.","d) Dại lây qua vết cắn."],"type": "truefalse"},{"answer": "SARS-CoV-2","explain": "COVID-19 do virus SARS-CoV-2 gây ra.","level": "VD","points": 0.5,"q": "Virus gây bệnh COVID-19 có tên là gì?","type": "short"},{"answer": "Biến đổi","explain": "Virus cúm biến đổi nhanh nên vaccine cần cập nhật.","level": "VDC","points": 0.5,"q": "Khả năng nào giúp virus cúm tạo ra biến thể mới? (trả lời 1 từ)","type": "short"}]}]}
