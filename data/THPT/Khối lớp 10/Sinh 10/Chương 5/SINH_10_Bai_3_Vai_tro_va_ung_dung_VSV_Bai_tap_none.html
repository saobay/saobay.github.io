{"sets": [{"name": "Đề 1","questions": [{"answer": "B","explain": "VSV phân hủy xác sinh vật thành chất vô cơ, trả lại môi trường.","level": "NB","options": ["A. quang hợp tạo oxygen.","B. phân hủy xác sinh vật.","C. cố định carbon.","D. thụ phấn cho cây."],"points": 0.25,"q": "Vai trò quan trọng nhất của vi sinh vật trong tự nhiên là","type": "mcq"},{"answer": "C","explain": "Penicillin là kháng sinh đầu tiên, chiết từ nấm Penicillium.","level": "NB","options": ["A. vi khuẩn lactic.","B. nấm men.","C. nấm Penicillium.","D. vi khuẩn Bt."],"points": 0.25,"q": "Kháng sinh penicillin được sản xuất từ","type": "mcq"},{"answer": "D","explain": "Vi khuẩn Bt tạo độc tố diệt sâu hại, dùng làm thuốc trừ sâu sinh học.","level": "NB","options": ["A. E. coli.","B. nấm men.","C. vi khuẩn lam.","D. vi khuẩn Bt."],"points": 0.25,"q": "Thuốc trừ sâu sinh học được sản xuất từ","type": "mcq"},{"answer": "A","explain": "Vi khuẩn nốt sần cộng sinh trong rễ cây họ Đậu, cố định nitơ khí quyển thành đạm.","level": "TH","options": ["A. cố định nitơ khí quyển thành đạm cho cây họ Đậu.","B. quang hợp tạo oxygen.","C. phân hủy xác động vật.","D. gây bệnh bạc lá lúa."],"points": 0.25,"q": "Vi khuẩn nốt sần sống trong rễ cây họ Đậu có vai trò","type": "mcq"},{"answer": "B","explain": "VSV phân hủy chất hữu cơ trong nước thải thành chất vô cơ vô hại.","level": "TH","options": ["A. lọc cặn bẩn bằng màng lọc.","B. phân hủy chất hữu cơ thành chất vô cơ.","C. diệt hết mọi sinh vật trong nước.","D. làm bay hơi nước thải."],"points": 0.25,"q": "Vi sinh vật xử lí nước thải bằng cách","type": "mcq"},{"answer": "C","explain": "VSV phân hủy dầu thành chất vô hại, không để lại tồn dư độc hại như hóa chất.","level": "VDC","options": ["A. Vì VSV rẻ hơn hóa chất.","B. Vì VSV làm dầu bay hơi nhanh.","C. Vì VSV phân hủy dầu triệt để thành chất vô hại, không gây ô nhiễm thứ cấp.","D. Vì VSV hút dầu vào cơ thể."],"points": 0.25,"q": "Ưu điểm của dùng vi sinh vật xử lí dầu loang so với dùng hóa chất là","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: VSV tham gia chu trình vật chất. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về vai trò của VSV trong tự nhiên:","statements": ["a) VSV phân hủy xác sinh vật thành chất vô cơ.","b) Vi khuẩn lam góp phần tạo oxygen cho khí quyển.","c) VSV không tham gia chu trình vật chất trong tự nhiên.","d) Vi khuẩn nốt sần cố định đạm cho cây họ Đậu."],"type": "truefalse"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: sữa chua nhờ vi khuẩn lactic. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về ứng dụng VSV trong thực phẩm:","statements": ["a) Nấm men dùng để ủ rượu, làm bánh mì.","b) Sữa chua được làm nhờ nấm men.","c) Dưa muối nhờ vi khuẩn lactic lên men.","d) Nước mắm có sự tham gia của VSV phân giải protein."],"type": "truefalse"},{"answer": "Penicillin","explain": "Penicillin là kháng sinh đầu tiên từ nấm Penicillium.","level": "VD","points": 0.5,"q": "Kháng sinh đầu tiên được phát hiện có tên là gì?","type": "short"},{"answer": "Nốt sần rễ","explain": "Vi khuẩn cố định đạm sống cộng sinh trong nốt sần rễ cây họ Đậu.","level": "VDC","points": 0.5,"q": "Vi khuẩn cố định đạm sống cộng sinh ở bộ phận nào của cây họ Đậu?","type": "short"}]},{"name": "Đề 2","questions": [{"answer": "A","explain": "Sữa chua được làm nhờ vi khuẩn lactic lên men đường thành acid lactic.","level": "NB","options": ["A. vi khuẩn lactic.","B. nấm men.","C. virus.","D. trùng giày."],"points": 0.25,"q": "Sữa chua được sản xuất nhờ","type": "mcq"},{"answer": "D","explain": "VSV gây bệnh cho người, vật nuôi, cây trồng và làm hỏng thực phẩm.","level": "NB","options": ["A. quang hợp.","B. cố định đạm.","C. sản xuất kháng sinh.","D. gây bệnh và làm hỏng thực phẩm."],"points": 0.25,"q": "Tác hại của vi sinh vật là","type": "mcq"},{"answer": "B","explain": "Ethanol sinh học được sản xuất nhờ nấm men lên men đường.","level": "NB","options": ["A. xăng dầu.","B. ethanol sinh học.","C. than đá.","D. khí gas."],"points": 0.25,"q": "Nhiên liệu sinh học được sản xuất nhờ vi sinh vật là","type": "mcq"},{"answer": "C","explain": "Phân bón vi sinh chứa VSV cố định đạm, phân giải lân... cung cấp dinh dưỡng cho cây.","level": "TH","options": ["A. hóa chất độc hại.","B. xác động vật.","C. vi sinh vật có ích cho cây trồng.","D. thuốc kháng sinh."],"points": 0.25,"q": "Phân bón vi sinh chứa thành phần chính là","type": "mcq"},{"answer": "A","explain": "Một số VSV dùng hydrocarbon trong dầu làm nguồn carbon, phân hủy chúng.","level": "TH","options": ["A. một số VSV dùng hydrocarbon trong dầu làm thức ăn.","B. VSV hút dầu vào cơ thể dự trữ.","C. VSV làm dầu bay hơi.","D. VSV biến dầu thành nước."],"points": 0.25,"q": "Vì sao vi sinh vật phân hủy được dầu loang?","type": "mcq"},{"answer": "D","explain": "Thuốc trừ sâu sinh học đặc hiệu với sâu hại, phân hủy nhanh, không tồn dư độc hại.","level": "VDC","options": ["A. Vì rẻ hơn thuốc hóa học.","B. Vì diệt được mọi loài côn trùng.","C. Vì tác dụng nhanh hơn.","D. Vì đặc hiệu, không tồn dư độc hại trong môi trường."],"points": 0.25,"q": "Ưu điểm của thuốc trừ sâu sinh học so với thuốc hóa học là","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: rượu vang nhờ nấm men. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về VSV trong y dược:","statements": ["a) Penicillin là kháng sinh từ nấm.","b) VSV được dùng để sản xuất vaccine.","c) Rượu vang được sản xuất nhờ vi khuẩn lactic.","d) VSV được dùng sản xuất vitamin, enzyme."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: VSV có cả lợi và hại. b) Đúng. c) Đúng. d) Sai: cần phân biệt lợi/hại.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về hai mặt của VSV:","statements": ["a) Mọi vi sinh vật đều có hại.","b) Vi sinh vật gây bệnh lao, tả ở người.","c) Vi sinh vật làm hỏng thực phẩm dự trữ.","d) Nên tiêu diệt tất cả vi sinh vật."],"type": "truefalse"},{"answer": "Penicillium","explain": "Penicillin chiết từ nấm Penicillium.","level": "VD","points": 0.5,"q": "Nấm dùng để sản xuất kháng sinh penicillin có tên là gì?","type": "short"},{"answer": "Độc tố Bt","explain": "Vi khuẩn Bt tạo độc tố (tinh thể độc) diệt sâu hại.","level": "VDC","points": 0.5,"q": "Vi khuẩn Bt diệt sâu hại nhờ tạo ra chất gì?","type": "short"}]},{"name": "Đề 3","questions": [{"answer": "B","explain": "Rượu vang được ủ nhờ nấm men lên men đường thành rượu.","level": "NB","options": ["A. vi khuẩn lactic.","B. nấm men.","C. virus.","D. vi tảo."],"points": 0.25,"q": "Rượu vang được sản xuất nhờ","type": "mcq"},{"answer": "D","explain": "Vaccine được sản xuất từ VSV đã làm suy yếu hoặc kháng nguyên của chúng.","level": "NB","options": ["A. hóa chất.","B. cây thuốc.","C. khoáng chất.","D. vi sinh vật đã làm suy yếu."],"points": 0.25,"q": "Vaccine phòng bệnh được sản xuất từ","type": "mcq"},{"answer": "A","explain": "VSV tham gia chu trình nitơ, carbon... trong tự nhiên.","level": "NB","options": ["A. chu trình nitơ và carbon.","B. quang hợp của cây.","C. hô hấp của động vật.","D. sự hình thành mưa."],"points": 0.25,"q": "Vi sinh vật tham gia vào","type": "mcq"},{"answer": "C","explain": "Nấm men lên men sinh khí CO2 làm bánh mì nở xốp.","level": "TH","options": ["A. vi khuẩn phân hủy bột.","B. nấm mốc sinh nhiệt.","C. nấm men sinh khí CO2.","D. virus làm bột nở."],"points": 0.25,"q": "Bánh mì nở xốp khi nướng nhờ","type": "mcq"},{"answer": "A","explain": "Dưa muối nhờ vi khuẩn lactic lên men đường thành acid lactic.","level": "TH","options": ["A. vi khuẩn lactic.","B. nấm men.","C. virus.","D. trùng giày."],"points": 0.25,"q": "Dưa cải muối chua nhờ hoạt động của","type": "mcq"},{"answer": "B","explain": "Nhiệt độ thấp làm enzyme của VSV kém hoạt động, VSV sinh trưởng chậm lại.","level": "VDC","options": ["A. Vì lạnh diệt hết VSV.","B. Vì nhiệt độ thấp làm VSV sinh trưởng chậm lại.","C. Vì lạnh làm thực phẩm khô đi.","D. Vì VSV không chịu được ánh sáng."],"points": 0.25,"q": "Vì sao bảo quản lạnh hạn chế vi sinh vật làm hỏng thực phẩm?","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: VSV phân hủy xác sinh vật. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về VSV trong nông nghiệp:","statements": ["a) Phân bón vi sinh cung cấp VSV có ích cho cây.","b) Vi sinh vật làm xác sinh vật tồn tại mãi không phân hủy.","c) Thuốc trừ sâu sinh học an toàn hơn thuốc hóa học.","d) Vi khuẩn nốt sần giúp cây họ Đậu có thêm đạm."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: VSV phân hủy dầu loang. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về VSV và môi trường:","statements": ["a) VSV được dùng xử lí nước thải.","b) VSV phân hủy rác thải hữu cơ.","c) VSV làm dầu loang lan rộng hơn.","d) Dùng VSV xử lí ô nhiễm không gây ô nhiễm thứ cấp."],"type": "truefalse"},{"answer": "Vi khuẩn lactic","explain": "Sữa chua nhờ vi khuẩn lactic lên men.","level": "VD","points": 0.5,"q": "Vi khuẩn nào được dùng để làm sữa chua?","type": "short"},{"answer": "CO2","explain": "Nấm men lên men sinh khí CO2 làm bánh nở xốp.","level": "VDC","points": 0.5,"q": "Khí nào do nấm men sinh ra làm bánh mì nở xốp?","type": "short"}]},{"name": "Đề 4","questions": [{"answer": "C","explain": "Bánh mì nhờ nấm men lên men sinh CO2.","level": "NB","options": ["A. vi khuẩn lactic.","B. virus.","C. nấm men.","D. vi tảo."],"points": 0.25,"q": "Bánh mì được làm xốp nhờ","type": "mcq"},{"answer": "A","explain": "Ethanol sinh học từ nấm men lên men đường.","level": "NB","options": ["A. nấm men lên men đường.","B. vi khuẩn quang hợp.","C. virus.","D. trùng giày."],"points": 0.25,"q": "Nhiên liệu ethanol sinh học được sản xuất nhờ","type": "mcq"},{"answer": "D","explain": "VSV gây bệnh cho người, vật nuôi, cây trồng.","level": "NB","options": ["A. chỉ gây bệnh cho người.","B. chỉ gây bện Đối tượng bị vi sinh vật gây bệnh gồm","type": "mcq"},{"answer": "A","explain": "Vi khuẩn nốt sần cố định nitơ cho cây họ Đậu.","level": "TH","options": ["A. vi khuẩn nốt sần cố định đạm.","B. nấm men lên men.","C. virus gây bệnh.","D. tảo độc."],"points": 0.25,"q": "Cây họ Đậu tốt tươi trên đất nghèo dinh dưỡng nhờ","type": "mcq"},{"answer": "D","explain": "VSV phân hủy dầu loang thành chất vô hại.","level": "TH","options": ["A. hút dầu vào cơ thể.","B. làm dầu bay hơi.","C. biến dầu thành nước.","D. phân hủy dầu thành chất vô hại."],"points": 0.25,"q": "Vi sinh vật xử lí dầu loang bằng cách","type": "mcq"},{"answer": "B","explain": "Nhiệt độ thấp ức chế enzyme, VSV sinh trưởng chậm nên thực phẩm lâu hỏng.","level": "VDC","options": ["A. Vì lạnh diệt hết VSV.","B. Vì nhiệt độ thấp làm VSV sinh trưởng chậm lại.","C. Vì lạnh làm thực phẩm khô.","D. Vì VSV sợ ánh sáng."],"points": 0.25,"q": "Giải thích cơ sở khoa học của bảo quản lạnh thực phẩm:","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: thuốc sinh học an toàn với người. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nông nghiệp:","statements": ["a) Phân bón vi sinh chứa VSV có ích.","b) Thuốc trừ sâu sinh học độc với người như thuốc hóa học.","c) Vi khuẩn Bt diệt sâu hại.","d) Trồng cây họ Đậu cải tạo đất."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: VSV phân hủy dầu loang. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về môi trường:","statements": ["a) VSV xử lí nước thải sinh hoạt.","b) VSV phân hủy rác hữu cơ.","c) VSV làm dầu loang lan rộng.","d) Xử lí bằng VSV không gây ô nhiễm thứ cấp."],"type": "truefalse"},{"answer": "Phân hủy","explain": "VSV phân hủy xác sinh vật.","level": "VD","points": 0.5,"q": "Vi sinh vật làm gì với xác động, thực vật trong tự nhiên?","type": "short"},{"answer": "Cố định đạm","explain": "Vi khuẩn nốt sần cố định đạm cho cây họ Đậu.","level": "VDC","points": 0.5,"q": "Vi khuẩn nốt sần cung cấp cho cây họ Đậu chất gì? (trả lời: cố định đạm/hấp thụ đạm)","type": "short"}]},{"name": "Đề 9","questions": [{"answer": "A","explain": "VSV phân hủy chất hữu cơ trong nước thải.","level": "NB","options": ["A. phân hủy chất hữu cơ.","B. lọc cặn bằng màng.","C. đun sôi nước.","D. pha loãng nước."],"points": 0.25,"q": "Bể sinh học xử lí nước thải hoạt động nhờ VSV","type": "mcq"},{"answer": "C","explain": "Ethanol sinh học từ nấm men lên men.","level": "NB","options": ["A. xăng.","B. dầu diesel.","C. ethanol sinh học.","D. than."],"points": 0.25,"q": "Nhiên liệu tái tạo từ vi sinh vật là","type": "mcq"},{"answer": "B","explain": "Enzyme từ VSV dùng trong bột giặt, thực phẩm.","level": "NB","options": ["A. kháng sinh.","B. enzyme.","C. vaccine.","D. độc tố."],"points": 0.25,"q": "Chất tẩy rửa sinh học có nguồn gốc từ VSV là","type": "mcq"},{"answer": "D","explain": "Ủ phân hữu cơ cần VSV phân hủy trong điều kiện ẩm, thoáng.","level": "TH","options": ["A. đốt rác.","B. chôn lấp kín.","C. phơi khô hoàn toàn.","D. ủ với vi sinh vật."],"points": 0.25,"q": "Biến rác hữu cơ thành phân bón nhờ","type": "mcq"},{"answer": "A","explain": "Acid lactic ức chế VSV gây hại, tạo vị chua đặc trưng.","level": "TH","options": ["A. acid lactic ức chế VSV gây hại.","B. vi khuẩn diệt hết VSV.","C. sữa tự đặc lại.","D. nhiệt độ cao."],"points": 0.25,"q": "Vì sao sữa chua bảo quản được lâu hơn sữa tươi?","type": "mcq"},{"answer": "C","explain": "Tiệt trùng nhiệt độ cao diệt VSV gây hại nên thực phẩm giữ lâu.","level": "VDC","options": ["A. Vì nhiệt độ cao làm thực phẩm ngon.","B. Vì đun sôi thêm dinh dưỡng.","C. Vì nhiệt độ cao tiêu diệt VSV gây hại.","D. Vì đun sôi làm bay hơi nước."],"points": 0.25,"q": "Cơ sở của phương pháp tiệt trùng thực phẩm bằng nhiệt là","type": "mcq"},{"answer": ["F","T","T","F"],"explain": "a) Sai: có cả lợi và hại. b) Đúng. c) Đúng. d) Sai: cần phân biệt.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về hai mặt VSV:","statements": ["a) Mọi VSV đều có lợi.","b) VSV gây bệnh cho người và vật nuôi.","c) VSV làm hỏng thực phẩm.","d) Nên giữ lại tất cả VSV."],"type": "truefalse"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: dưa muối nhờ vi khuẩn lactic. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về thực phẩm lên men:","statements": ["a) Rượu nhờ nấm men.","b) Dưa muối nhờ nấm men.","c) Bánh mì xốp nhờ CO2 của nấm men.","d) Sữa chua nhờ vi khuẩn lactic."],"type": "truefalse"},{"answer": "Xử lí nước thải","explain": "Bể sinh học dùng VSV xử lí nước thải.","level": "VD","points": 0.5,"q": "Bể sinh học trong nhà máy dùng để làm gì?","type": "short"},{"answer": "Tiêu diệt VSV gây hại","explain": "Tiệt trùng bằng nhiệt độ cao tiêu diệt VSV gây hại.","level": "VDC","points": 0.5,"q": "Tiệt trùng thực phẩm bằng nhiệt nhằm mục đích gì?","type": "short"}]},{"name": "Đề 10","questions": [{"answer": "D","explain": "VSV: phân hủy, chu trình vật chất, cố định đạm.","level": "NB","options": ["A. quang hợp.","B. hô hấp.","C. sinh sản.","D. phân hủy và chu trình vật chất."],"points": 0.25,"q": "Vai trò của VSV trong tự nhiên là","type": "mcq"},{"answer": "B","explain": "VSV ứng dụng trong thực phẩm, y dược, nông nghiệp, môi trường, công nghiệp.","level": "NB","options": ["A. chỉ thực phẩm.","B. thực phẩm, y dược, nông nghiệp, môi trường, công nghiệp.","C. chỉ y dược.","D. chỉ nông nghiệp."],"points": 0.25,"q": "Vi sinh vật được ứng dụng trong các lĩnh vực","type": "mcq"},{"answer": "C","explain": "VSV gây ôi thiu, nấm mốc làm hỏng thực phẩm.","level": "NB","options": ["A. quang hợp.","B. cố định đạm.","C. gây ôi thiu, nấm mốc.","D. sản xuất kháng sinh."],"points": 0.25,"q": "Tác hại của VSV đối với thực phẩm là","type": "mcq"},{"answer": "A","explain": "Cây họ Đậu nhờ vi khuẩn nốt sần cố định đạm.","level": "TH","options": ["A. vi khuẩn nốt sần cố định đạm.","B. nấm men lên men.","C. virus.","D. tảo."],"points": 0.25,"q": "Vì sao đất trồng cây họ Đậu giàu đạm hơn?","type": "mcq"},{"answer": "D","explain": "Thuốc sinh học đặc hiệu, phân hủy nhanh, không tồn dư độc.","level": "TH","options": ["A. rẻ hơn.","B. diệt mọi côn trùng.","C. tác dụng nhanh hơn.","D. đặc hiệu và không tồn dư độc hại."],"points": 0.25,"q": "Ưu điểm của thuốc trừ sâu sinh học là","type": "mcq"},{"answer": "A","explain": "VSV phân hủy dầu thành chất vô hại, không ô nhiễm thứ cấp.","level": "VDC","options": ["A. VSV phân hủy dầu triệt để, không gây ô nhiễm thứ cấp.","B. VSV rẻ hơn hóa chất.","C. VSV làm dầu bay hơi.","D. VSV hút dầu dự trữ."],"points": 0.25,"q": "Vì sao xử lí dầu loang bằng VSV tốt hơn hóa chất?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: VSV có cả lợi và hại. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về ứng dụng:","statements": ["a) VSV sản xuất được kháng sinh.","b) VSV sản xuất được vaccine.","c) VSV chỉ có hại.","d) VSV xử lí được ô nhiễm môi trường."],"type": "truefalse"},{"answer": ["F","T","T","T"],"explain": "a) Sai: VSV có ở khắp nơi. b) Đúng. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về VSV trong không khí và đời sống:","statements": ["a) Không khí hoàn toàn không có VSV.","b) VSV phân hủy được xác sinh vật.","c) VSV tham gia chu trình nitơ.","d) Nấm men dùng làm bánh mì."],"type": "truefalse"},{"answer": "Kháng sinh","explain": "Penicillin là kháng sinh từ nấm.","level": "VD","points": 0.5,"q": "Penicillin thuộc nhóm thuốc nào?","type": "short"},{"answer": "Không tồn dư độc hại","explain": "Thuốc sinh học phân hủy nhanh, không tồn dư độc hại.","level": "VDC","points": 0.5,"q": "Ưu điểm môi trường của thuốc trừ sâu sinh học là gì?","type": "short"}]}]}
