at hóa thuộc kiểu dinh dưỡng nào?","type": "short"},{"answer": "1024","explain": "2^10 = 1024 tế bào.","level": "VDC","points": 0.5,"q": "Một tế bào vi khuẩn phân đôi 10 lần tạo ra bao nhiêu tế bào? (trả lời bằng số)","type": "short"}]},{"name": "Đề 3","questions": [{"answer": "D","explain": "Nấm men dùng chất hữu cơ: hóa dị dưỡng.","level": "NB","options": ["A. quang tự dưỡng.","B. hóa tự dưỡng.","C. quang dị dưỡng.","D. hóa dị dưỡng."],"points": 0.25,"q": "Nấm men rượu thuộc kiểu dinh dưỡng","type": "mcq"},{"answer": "B","explain": "Pha cân bằng: số tế bào sinh ra bằng số tế bào chết đi.","level": "NB","options": ["A. số lượng tăng theo cấp số nhân.","B. số tế bào sinh ra bằng số tế bào chết.","C. số lượng chưa tăng.","D. số lượng giảm dần."],"points": 0.25,"q": "Đặc điểm của pha cân bằng là","type": "mcq"},{"answer": "C","explain": "Nảy chồi: chồi nhỏ mọc từ tế bào mẹ rồi tách ra — ở nấm men.","level": "NB","options": ["A. vi khuẩn.","B. nấm mốc.","C. nấm men.","D. vi tảo."],"points": 0.25,"q": "Sinh sản bằng nảy chồi gặp ở","type": "mcq"},{"answer": "A","explain": "Quang dị dưỡng: năng lượng ánh sáng, carbon từ chất hữu cơ.","level": "TH","options": ["A. ánh sáng và chất hữu cơ.","B. chất hữu cơ và ánh sáng.","C. chất vô cơ và CO2.","D. chất hữu cơ và CO2."],"points": 0.25,"q": "Kiểu dinh dưỡng quang dị dưỡng sử dụng nguồn năng lượng và nguồn carbon lần lượt là","type": "mcq"},{"answer": "D","explain": "Nội bào tử có vỏ dày, giúp vi khuẩn tồn tại qua khô hạn, nhiệt độ cao...","level": "TH","options": ["A. sinh sản nhanh.","B. phát tán đi xa.","C. tăng kích thước.","D. tồn tại qua điều kiện khắc nghiệt."],"points": 0.25,"q": "Vai trò của nội bào tử ở vi khuẩn là","type": "mcq"},{"answer": "B","explain": "VSV đang ở pha lũy thừa đã thích nghi sẵn nên khi cấy sang môi trường mới sẽ rút ngắn pha tiềm phát.","level": "VDC","options": ["A. Cấy VSV đang ở pha suy vong.","B. Cấy VSV đang ở pha lũy thừa.","C. Cấy VSV đang ở pha tiềm phát.","D. Để môi trường thật lạnh."],"points": 0.25,"q": "Muốn rút ngắn pha tiềm phát khi cấy VSV sang môi trường mới, nên","type": "mcq"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: số lượng chưa tăng ở pha tiềm phát. c) Đúng. d) Sai: pha lũy thừa.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về các pha sinh trưởng:","statements": ["a) Pha tiềm phát: VSV tổng hợp enzyme thích nghi.","b) Pha tiềm phát: số lượng tăng theo cấp số nhân.","c) Pha suy vong: số lượng quần thể giảm dần.","d) Pha cân bằng: VSV phân chia mạnh nhất."],"type": "truefalse"},{"answer": ["F","T","T","T"],"explain": "a) Sai: quang tự dưỡng dùng CO2. b) Đúng. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nguồn dinh dưỡng:","statements": ["a) Sinh vật quang tự dưỡng lấy carbon từ chất hữu cơ.","b) Sinh vật dị dưỡng lấy carbon từ chất hữu cơ.","c) Vi khuẩn sulfur là hóa tự dưỡng.","d) Tảo lục đơn bào là quang tự dưỡng."],"type": "truefalse"},{"answer": "Lũy thừa","explain": "Pha lũy thừa VSV phân chia mạnh nhất, thu được nhiều sinh khối.","level": "VD","points": 0.5,"q": "Muốn thu sinh khối vi sinh vật, nên thu ở pha nào?","type": "short"},{"answer": "32","explain": "2^5 = 32 tế bào.","level": "VDC","points": 0.5,"q": "Một tế bào vi khuẩn phân đôi 5 lần tạo ra bao nhiêu tế bào? (trả lời bằng số)","type": "short"}]},{"name": "Đề 4","questions": [{"answer": "B","explain": "Hóa tự dưỡng: năng lượng từ chất vô cơ, carbon từ CO2.","level": "NB","options": ["A. chất hữu cơ và CO2.","B. chất vô cơ và CO2.","C. ánh sáng và chất hữu cơ.","D. ánh sáng và CO2."],"points": 0.25,"q": "Kiểu dinh dưỡng hóa tự dưỡng sử dụng nguồn năng lượng và nguồn carbon lần lượt là","type": "mcq"},{"answer": "C","explain": "Quang dị dưỡng: ánh sáng + chất hữu cơ, ví dụ vi khuẩn lưu huỳnh màu tía.","level": "NB","options": ["A. vi khuẩn lam.","B. tảo lục.","C. vi khuẩn lưu huỳnh màu tía.","D. nấm men."],"points": 0.25,"q": "Vi khuẩn lưu huỳnh màu tía thuộc kiểu dinh dưỡng","ty
