<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1","questions": [{"answer": "B","explain": "VSV là sinh vật có kích thước hiển vi, chỉ quan sát được dưới kính hiển vi.","level": "NB","options": ["A. sinh vật có kích thước lớn.","B. sinh vật có kích thước hiển vi.","C. sinh vật đa bào lớn.","D. sinh vật không có vật chất di truyền."],"points": 0.25,"q": "Vi sinh vật là những sinh vật","type": "mcq"},{"answer": "C","explain": "Nhờ tỉ lệ S/V lớn, VSV hấp thụ nhiều và chuyển hóa nhanh.","level": "NB","options": ["A. kích thước lớn, chuyển hóa chậm.","B. sinh trưởng chậm.","C. hấp thụ nhiều, chuyển hóa nhanh.","D. phân bố hẹp."],"points": 0.25,"q": "Đặc điểm nổi bật của vi sinh vật là","type": "mcq"},{"answer": "A","explain": "Vi khuẩn là sinh vật nhân sơ; vi nấm, vi tảo, động vật nguyên sinh là nhân thực.","level": "NB","options": ["A. vi khuẩn.","B. vi nấm.","C. vi tảo.","D. động vật nguyên sinh."],"points": 0.25,"q": "Nhóm vi sinh vật nào sau đây thuộc sinh vật nhân sơ?","type": "mcq"},{"answer": "D","explain": "Kích thước nhỏ → tỉ lệ diện tích bề mặt/thể tích (S/V) lớn → trao đổi chất mạnh.","level": "TH","options": ["A. Vì VSV có nhiều ti thể.","B. Vì VSV sống thành tập đoàn.","C. Vì VSV có kích thước lớn.","D. Vì tỉ lệ diện tích bề mặt/thể tích (S/V) lớn."],"points": 0.25,"q": "Vì sao vi sinh vật có tốc độ chuyển hóa vật chất rất nhanh?","type": "mcq"},{"answer": "B","explain": "Virus quá nhỏ, chỉ quan sát được bằng kính hiển vi điện tử.","level": "TH","options": ["A. kính lúp.","B. kính hiển vi điện tử.","C. mắt thường.","D. kính hiển vi quang học thông thường."],"points": 0.25,"q": "Để quan sát virus, người ta dùng","type": "mcq"},{"answer": "C","explain": "2 giờ = 120 phút, số lần phân đôi = 120/20 = 6, số tế bào = 2^6 = 64.","level": "VDC","options": ["A. 6","B. 12","C. 64","D. 120"],"points": 0.25,"q": "Vi khuẩn E. coli phân đôi 20 phút/lần. Sau 2 giờ, từ 1 tế bào ban đầu tạo ra bao nhiêu tế bào?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: VSV phân bố rộng khắp nơi. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về vi sinh vật:","statements": ["a) Vi sinh vật có kích thước hiển vi.","b) Vi sinh vật hấp thụ nhiều, chuyển hóa nhanh.","c) Vi sinh vật chỉ sống trong cơ thể sinh vật.","d) Vi sinh vật sinh trưởng rất nhanh."],"type": "truefalse"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: vi khuẩn là nhân sơ. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về các nhóm vi sinh vật:","statements": ["a) Virus chưa có cấu tạo tế bào.","b) Vi khuẩn là sinh vật nhân thực.","c) Nấm men thuộc nhóm vi nấm.","d) Trùng giày thuộc nhóm động vật nguyên sinh."],"type": "truefalse"},{"answer": "Virus","explain": "Virus chưa có cấu tạo tế bào, chỉ nhân lên trong tế bào chủ.","level": "VD","points": 0.5,"q": "Nhóm vi sinh vật nào chưa có cấu tạo tế bào?","type": "short"},{"answer": "1","explain": "Mỗi khuẩn lạc thường phát triển từ 1 tế bào ban đầu.","level": "VDC","points": 0.5,"q": "Mỗi khuẩn lạc trên đĩa thạch thường phát triển từ bao nhiêu tế bào ban đầu? (trả lời bằng số)","type": "short"}]},{"name": "Đề 2","questions": [{"answer": "D","explain": "VSV phân bố rộng: đất, nước, không khí, cơ thể sinh vật, nơi khắc nghiệt.","level": "NB","options": ["A. chỉ trong đất.","B. chỉ trong nước.","C. chỉ trong cơ thể người.","D. khắp nơi: đất, nước, không khí, cơ thể sinh vật."],"points": 0.25,"q": "Vi sinh vật phân bố ở","type": "mcq"},{"answer": "B","explain": "Vi nấm gồm nấm men (đơn bào) và nấm mốc (đa bào dạng sợi).","level": "NB","options": ["A. vi khuẩn và virus.","B. nấm men và nấm mốc.","C. tảo lục và tảo đỏ.","D. trùng roi và trùng giày."],"points": 0.25,"q": "Nhóm vi nấm gồm","type": "mcq"},{"answer": "C","explain": "Môi trường nuôi cấy cung cấp chất dinh dưỡng cho VSV sinh trưởng.","level": "NB","options": ["A. môi trường sống tự nhiên của VSV.","B. cơ thể vật chủ.","C. môi trường cung cấp dinh dưỡng để nuôi VSV.","D. thuốc kháng sinh."],"points": 0.25,"q": "Môi trường nuôi cấy vi sinh vật là","type": "mcq"},{"answer": "A","explain": "VSV dễ phát sinh đột biến và trao đổi gen nên thích ứng nhanh với môi trường mới.","level": "TH","options": ["A. dễ phát sinh đột biến và trao đổi gen.","B. có kích thước lớn.","C. sinh trưởng chậm.","D. không có vật chất di truyền."],"points": 0.25,"q": "Vì sao vi sinh vật thích ứng nhanh với môi trường mới?","type": "mcq"},{"answer": "D","explain": "Phân lập tách riêng từng loài từ mẫu hỗn hợp để thu dòng thuần.","level": "TH","options": ["A. nhân nhanh số lượng VSV.","B. tiêu diệt VSV gây bệnh.","C. quan sát hình dạng VSV.","D. thu được dòng VSV thuần khiết."],"points": 0.25,"q": "Mục đích của phương pháp phân lập vi sinh vật là","type": "mcq"},{"answer": "B","explain": "Vi khuẩn dễ đột biến, trao đổi gen và sinh sản nhanh nên gen kháng nhanh chóng lan rộng dưới áp lực chọn lọc của kháng sinh.","level": "VDC","options": ["A. Vì kháng sinh làm vi khuẩn đột biến nhanh hơn.","B. Vì vi khuẩn dễ đột biến, trao đổi gen và sinh sản nhanh.","C. Vì kháng sinh không có tác dụng với vi khuẩn.","D. Vì vi khuẩn có kích thước lớn."],"points": 0.25,"q": "Vì sao vi khuẩn kháng kháng sinh xuất hiện ngày càng nhanh?","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: VSV gồm cả nhân sơ và nhân thực. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về đặc điểm vi sinh vật:","statements": ["a) Vi sinh vật có thời gian thế hệ ngắn.","b) Mọi vi sinh vật đều là sinh vật nhân sơ.","c) Vi sinh vật dễ phát sinh biến dị.","d) Vi sinh vật có mặt ở cả nơi khắc nghiệt."],"type": "truefalse"},{"answer": ["F","T","T","T"],"explain": "a) Sai: cần điều kiện vô trùng. b) Đúng. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về phương pháp nghiên cứu vi sinh vật:","statements": ["a) Nuôi cấy vi sinh vật không cần điều kiện vô trùng.","b) Kính hiển vi quang học dùng quan sát vi khuẩn.","c) Mỗi khuẩn lạc thường từ 1 tế bào ban đầu phát triển thành.","d) Định danh dựa vào đặc điểm hình thái, sinh hóa và trình tự gen."],"type": "truefalse"},{"answer": "Micromet","explain": "Kích thước VSV thường đo bằng micromet (µm).","level": "VD","points": 0.5,"q": "Đơn vị thường dùng để đo kích thước vi sinh vật là gì?","type": "short"},{"answer": "8","explain": "1 giờ = 60 phút, số lần phân đôi = 3, số tế bào = 2^3 = 8.","level": "VDC","points": 0.5,"q": "Vi khuẩn phân đôi 20 phút/lần. Sau 1 giờ, từ 1 tế bào tạo ra bao nhiêu tế bào? (trả lời bằng số)","type": "short"}]},{"name": "Đề 3","questions": [{"answer": "C","explain": "Virus có kích thước hiển vi nên được xếp vào nhóm VSV dù chưa có cấu tạo tế bào.","level": "NB","options": ["A. có cấu tạo tế bào hoàn chỉnh.","B. có kích thước lớn.","C. có kích thước hiển vi.","D. là sinh vật nhân thực."],"points": 0.25,"q": "Virus được xếp vào nhóm vi sinh vật vì","type": "mcq"},{"answer": "D","explain": "Trùng roi, trùng giày, amip thuộc nhóm động vật nguyên sinh.","level": "NB","options": ["A. E. coli.","B. nấm men rượu.","C. tảo lục.","D. trùng giày."],"points": 0.25,"q": "Sinh vật nào sau đây thuộc nhóm động vật nguyên sinh?","type": "mcq"},{"answer": "D","explain": "Định danh dựa vào hình thái, sinh lí, sinh hóa và trình tự gen.","level": "NB","options": ["A. màu sắc khuẩn lạc.","B. mùi của môi trường.","C. kích thước đĩa petri.","D. đặc điểm hình thái, sinh hóa và trình tự gen."],"points": 0.25,"q": "Định danh vi sinh vật dựa vào","type": "mcq"},{"answer": "A","explain": "Vi khuẩn lam là vi khuẩn (nhân sơ) có khả năng quang hợp.","level": "TH","options": ["A. vi khuẩn.","B. vi tảo.","C. vi nấm.","D. động vật nguyên sinh."],"points": 0.25,"q": "Vi khuẩn lam thuộc nhóm vi sinh vật nào?","type": "mcq"},{"answer": "B","explain": "Nuôi cấy cần vô trùng để tránh nhiễm VSV lạ từ môi trường.","level": "TH","options": ["A. nhiệt độ thật cao.","B. điều kiện vô trùng.","C. ánh sáng mạnh.","D. môi trường khô hoàn toàn."],"points": 0.25,"q": "Khi nuôi cấy vi sinh vật, điều kiện bắt buộc là","type": "mcq"},{"answer": "C","explain": "Pha loãng để các tế bào rời nhau, mỗi tế bào tạo 1 khuẩn lạc riêng, dễ đếm và phân lập.","level": "VDC","options": ["A. Để vi khuẩn chết bớt.","B. Để tiết kiệm môi trường.","C. Để các khuẩn lạc mọc rời nhau, dễ đếm và phân lập.","D. Để vi khuẩn sinh trưởng nhanh hơn."],"points": 0.25,"q": "Vì sao phải pha loãng mẫu trước khi cấy lên đĩa thạch?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: vi tảo quang hợp. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về dinh dưỡng các nhóm VSV:","statements": ["a) Vi khuẩn là sinh vật nhân sơ đơn bào.","b) Nấm mốc là vi nấm đa bào dạng sợi.","c) Vi tảo là sinh vật dị dưỡng.","d) Virus chỉ nhân lên được trong tế bào chủ."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: S/V lớn. c) Đúng. d) Sai: có cả đơn bào và tập đoàn.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về tỉ lệ S/V và thời gian thế hệ:","statements": ["a) Kích thước nhỏ giúp VSV trao đổi chất mạnh với môi trường.","b) Vi sinh vật có tỉ lệ S/V nhỏ.","c) Vi khuẩn E. coli có thời gian thế hệ khoảng 20 phút.","d) Mọi vi sinh vật đều sống đơn bào."],"type": "truefalse"},{"answer": "Vi nấm","explain": "Nấm men rượu thuộc nhóm vi nấm.","level": "VD","points": 0.5,"q": "Nấm men dùng để ủ rượu thuộc nhóm vi sinh vật nào?","type": "short"},{"answer": "20 phút","explain": "E. coli có thời gian thế hệ khoảng 20 phút trong điều kiện lí tưởng.","level": "VDC","points": 0.5,"q": "Thời gian thế hệ của vi khuẩn E. coli trong điều kiện lí tưởng là bao nhiêu?","type": "short"}]},{"name": "Đề 4","questions": [{"answer": "B","explain": "Tảo lục đơn bào quang hợp thuộc nhóm vi tảo.","level": "NB","options": ["A. vi khuẩn.","B. vi tảo.","C. vi nấm.","D. virus."],"points": 0.25,"q": "Tảo lục đơn bào thuộc nhóm vi sinh vật nào?","type": "mcq"},{"answer": "D","explain": "Amip là động vật nguyên sinh điển hình.","level": "NB","options": ["A. vi khuẩn.","B. vi nấm.","C. virus.","D. động vật nguyên sinh."],"points": 0.25,"q": "Amip thuộc nhóm","type": "mcq"},{"answer": "A","explain": "Khuẩn lạc là tập hợp tế bào VSV mọc trên môi trường đặc, nhìn thấy bằng mắt thường.","level": "NB","options": ["A. tập hợp tế bào VSV nhìn thấy được bằng mắt thường.","B. một tế bào vi khuẩn đơn lẻ.","C. môi trường nuôi cấy.","D. bào tử của vi khuẩn."],"points": 0.25,"q": "Khuẩn lạc là","type": "mcq"},{"answer": "C","explain": "VSV có ở suối nước nóng, băng tuyết, miệng núi lửa... nhờ khả năng thích ứng cao.","level": "TH","options": ["A. kích thước lớn.","B. sinh trưởng chậm.","C. khả năng thích ứng cao với môi trường.","D. không cần dinh dưỡng."],"points": 0.25,"q": "Vi sinh vật sống được ở nơi khắc nghiệt (suối nước nóng, băng tuyết) nhờ","type": "mcq"},{"answer": "B","explain": "Kính hiển vi điện tử có độ phóng đại rất lớn, quan sát được virus.","level": "TH","options": ["A. Vì virus có kích thước lớn.","B. Vì virus quá nhỏ, kính quang học không thấy được.","C. Vì virus không có hình dạng.","D. Vì virus chỉ sống trong cơ thể."],"points": 0.25,"q": "Vì sao phải dùng kính hiển vi điện tử để quan sát virus?","type": "mcq"},{"answer": "D","explain": "Sinh trưởng nhanh + dễ đột biến giúp VSV nhanh chóng thích nghi, gây khó khăn cho kiểm soát dịch bệnh và kháng thuốc.","level": "VDC","options": ["A. VSV có kích thước lớn khó tiêu diệt.","B. VSV không gây bệnh.","C. VSV sinh trưởng chậm.","D. VSV sinh trưởng nhanh và dễ phát sinh biến dị thích nghi."],"points": 0.25,"q": "Đặc điểm nào của vi sinh vật gây khó khăn cho việc phòng chống dịch bệnh?","type": "mcq"},{"answer": ["F","T","T","T"],"explain": "a) Sai: VSV gồm cả nhân sơ và nhân thực. b) Đúng. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về cấu tạo vi sinh vật:","statements": ["a) Mọi vi sinh vật đều là sinh vật nhân sơ.","b) Vi khuẩn có cấu tạo tế bào nhân sơ.","c) Nấm men có cấu tạo tế bào nhân thực.","d) Virus chưa có cấu tạo tế bào."],"type": "truefalse"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: khuẩn lạc nhìn thấy bằng mắt thường. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nuôi cấy vi sinh vật:","statements": ["a) Môi trường nuôi cấy cung cấp dinh dưỡng cho VSV.","b) Khuẩn lạc chỉ nhìn thấy dưới kính hiển vi.","c) Nuôi cấy cần thực hiện trong điều kiện vô trùng.","d) Từ khuẩn lạc có thể phân lập dòng thuần."],"type": "truefalse"},{"answer": "Kính hiển vi","explain": "VSV có kích thước hiển vi nên cần kính hiển vi để quan sát.","level": "VD","points": 0.5,"q": "Dụng cụ bắt buộc để quan sát vi sinh vật là gì?","type": "short"},{"answer": "64","explain": "Số lần phân đôi = 120/20 = 6, số tế bào = 2^6 = 64.","level": "VDC","points": 0.5,"q": "Vi khuẩn phân đôi 20 phút/lần. Sau 2 giờ từ 1 tế bào được bao nhiêu tế bào? (trả lời bằng số)","type": "short"}]},{"name": "Đề 5","questions": [{"answer": "C","explain": "Nấm mốc đa bào dạng sợi thuộc nhóm vi nấm (nhân thực).","level": "NB","options": ["A. vi khuẩn.","B. virus.","C. vi nấm.","D. vi tảo."],"points": 0.25,"q": "Nấm mốc thuộc nhóm vi sinh vật nào?","type": "mcq"},{"answer": "B","explain": "Trùng roi vừa quang hợp vừa dị dưỡng, thuộc động vật nguyên sinh.","level": "NB","options": ["A. vi khuẩn.","B. động vật nguyên sinh.","C. vi nấm.","D. vi tảo."],"points": 0.25,"q": "Trùng roi xanh thuộc nhóm","type": "mcq"},{"answer": "D","explain": "Dòng thuần là quần thể VSV chỉ gồm các tế bào giống nhau về di truyền.","level": "NB","options": ["A. nhiều loài VSV khác nhau.","B. VSV gây bệnh.","C. VSV có lợi.","D. quần thể VSV thuần khiết, giống nhau về di truyền."],"points": 0.25,"q": "Dòng thuần vi sinh vật là","type": "mcq"},{"answer": "A","explain": "S/V lớn → trao đổi chất mạnh → hấp thụ nhiều, chuyển hóa nhanh.","level": "TH","options": ["A. tỉ lệ diện tích bề mặt/thể tích lớn.","B. có nhiều bào quan.","C. sống thành tập đoàn.","D. có nhân hoàn chỉnh."],"points": 0.25,"q": "Cơ sở của đặc điểm hấp thụ nhiều, chuyển hóa nhanh ở VSV là","type": "mcq"},{"answer": "C","explain": "Môi trường đặc (thạch) giúp khuẩn lạc mọc riêng rẽ, dễ đếm và phân lập.","level": "TH","options": ["A. môi trường lỏng.","B. môi trường tự nhiên.","C. môi trường đặc (thạch).","D. cơ thể vật chủ."],"points": 0.25,"q": "Để đếm số lượng vi khuẩn trong mẫu, người ta thường cấy lên","type": "mcq"},{"answer": "B","explain": "Số lần phân đôi = 180/20 = 9, số tế bào = 2^9 = 512.","level": "VDC","options": ["A. 256","B. 512","C. 1024","D. 180"],"points": 0.25,"q": "Vi khuẩn phân đôi 20 phút/lần. Sau 3 giờ, từ 1 tế bào tạo ra bao nhiêu tế bào?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: vi khuẩn lam quang hợp thuộc nhóm vi khuẩn. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về vi khuẩn:","statements": ["a) Vi khuẩn là sinh vật nhân sơ.","b) E. coli sống trong ruột người.","c) Vi khuẩn lam thuộc nhóm vi tảo.","d) Vi khuẩn sinh sản chủ yếu bằng phân đôi."],"type": "truefalse"},{"answer": ["F","T","F","T"],"explain": "a) Sai: VSV có cả lợi và hại. b) Đúng. c) Sai: virus quá nhỏ. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về lợi ích và tác hại của VSV:","statements": ["a) Mọi vi sinh vật đều gây bệnh cho người.","b) Nấm men được dùng trong sản xuất rượu, bánh mì.","c) Kính hiển vi quang học quan sát được virus.","d) Vi sinh vật phân hủy xác sinh vật trong tự nhiên."],"type": "truefalse"},{"answer": "Phân đôi","explain": "Vi khuẩn sinh sản chủ yếu bằng phân đôi.","level": "VD","points": 0.5,"q": "Hình thức sinh sản chủ yếu của vi khuẩn là gì?","type": "short"},{"answer": "512","explain": "3 giờ = 180 phút, 9 lần phân đôi, 2^9 = 512.","level": "VDC","points": 0.5,"q": "Vi khuẩn phân đôi 20 phút/lần. Sau 3 giờ từ 1 tế bào được bao nhiêu tế bào? (trả lời bằng số)","type": "short"}]},{"name": "Đề 6","questions": [{"answer": "A","explain": "VSV gồm nhân sơ (vi khuẩn), nhân thực (vi nấm, vi tảo, ĐVNS) và virus.","level": "NB","options": ["A. nhân sơ, nhân thực và virus.","B. chỉ nhân sơ.","C. chỉ nhân thực.","D. chỉ virus."],"points": 0.25,"q": "Vi sinh vật gồm các nhóm sinh vật","type": "mcq"},{"answer": "D","explain": "Tảo đơn bào quang hợp thuộc nhóm vi tảo.","level": "NB","options": ["A. vi khuẩn.","B. vi nấm.","C. động vật nguyên sinh.","D. vi tảo."],"points": 0.25,"q": "Tảo silic (diatom) đơn bào thuộc nhóm","type": "mcq"},{"answer": "B","explain": "Vô trùng tránh nhiễm VSV lạ làm sai kết quả nghiên cứu.","level": "NB","options": ["A. để VSV chết bớt.","B. để tránh nhiễm vi sinh vật lạ.","C. để VSV sinh trưởng chậm lại.","D. để tiết kiệm hóa chất."],"points": 0.25,"q": "Mục đích của vô trùng trong nuôi cấy vi sinh vật là","type": "mcq"},{"answer": "D","explain": "Virus kí sinh bắt buộc trong tế bào sống nên không thể nuôi trên môi trường nhân tạo.","level": "TH","options": ["A. Vì virus quá lớn.","B. Vì virus không có vật chất di truyền.","C. Vì virus không cần dinh dưỡng.","D. Vì virus chỉ nhân lên trong tế bào chủ sống."],"points": 0.25,"q": "Vì sao không thể nuôi virus trên môi trường dinh dưỡng nhân tạo?","type": "mcq"},{"answer": "C","explain": "Môi trường lỏng (canh thang) dùng nhân sinh khối VSV số lượng lớn.","level": "TH","options": ["A. môi trường đặc.","B. đĩa petri.","C. môi trường lỏng.","D. lam kính."],"points": 0.25,"q": "Để thu sinh khối vi sinh vật số lượng lớn, người ta nuôi trong","type": "mcq"},{"answer": "A","explain": "Số lần phân đôi = 60/20 = 3, nhưng mỗi khuẩn lạc từ 1 tế bào: 100 tế bào tạo 100 khuẩn lạc.","level": "VDC","options": ["A. 100","B. 300","C. 800","D. 1000"],"points": 0.25,"q": "Cấy 100 tế bào vi khuẩn lên đĩa thạch, ủ 1 giờ (phân đôi 20 phút/lần). Số khuẩn lạc tạo thành là","type": "mcq"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: nấm men là nhân thực. c) Đúng. d) Sai: vi tảo quang hợp.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về cấu tạo tế bào VSV:","statements": ["a) Vi khuẩn chưa có nhân hoàn chỉnh.","b) Nấm men là sinh vật nhân sơ.","c) Trùng giày có nhân hoàn chỉnh.","d) Vi tảo sống dị dưỡng."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: VSV có lợi nhiều (lên men, kháng sinh...). d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về vai trò VSV:","statements": ["a) Vi sinh vật tham gia phân hủy xác sinh vật.","b) Vi khuẩn lam góp phần tạo oxygen cho khí quyển.","c) Vi sinh vật chỉ có hại cho con người.","d) Nấm men dùng sản xuất bánh mì, rượu."],"type": "truefalse"},{"answer": "Vô trùng","explain": "Nuôi cấy VSV bắt buộc trong điều kiện vô trùng.","level": "VD","points": 0.5,"q": "Điều kiện bắt buộc khi nuôi cấy vi sinh vật là gì?","type": "short"},{"answer": "100","explain": "Mỗi tế bào tạo 1 khuẩn lạc nên 100 tế bào tạo 100 khuẩn lạc.","level": "VDC","points": 0.5,"q": "Cấy 100 tế bào vi khuẩn lên đĩa thạch sẽ tạo ra bao nhiêu khuẩn lạc? (trả lời bằng số)","type": "short"}]},{"name": "Đề 7","questions": [{"answer": "C","explain": "Vi tảo quang hợp thuộc nhóm vi tảo (nhân thực).","level": "NB","options": ["A. vi khuẩn.","B. vi nấm.","C. vi tảo.","D. virus."],"points": 0.25,"q": "Rong rêu đơn bào quang hợp thuộc nhóm","type": "mcq"},{"answer": "B","explain": "Nấm men đơn bào, sinh sản bằng nảy chồi.","level": "NB","options": ["A. vi khuẩn.","B. vi nấm đơn bào.","C. vi tảo.","D. động vật nguyên sinh."],"points": 0.25,"q": "Nấm men là","type": "mcq"},{"answer": "D","explain": "VSV có ở đất, nước, không khí, cơ thể sinh vật...","level": "NB","options": ["A. đất.","B. nước.","C. không khí.","D. tất cả các môi trường trên."],"points": 0.25,"q": "Có thể tìm thấy vi sinh vật ở","type": "mcq"},{"answer": "A","explain": "Khuẩn lạc từ 1 tế bào nên các tế bào trong khuẩn lạc giống nhau về di truyền.","level": "TH","options": ["A. các tế bào trong khuẩn lạc giống nhau về di truyền.","B. khuẩn lạc gồm nhiều loài khác nhau.","C. khuẩn lạc không nhìn thấy được.","D. khuẩn lạc chỉ có 1 tế bào."],"points": 0.25,"q": "Vì sao từ một khuẩn lạc có thể thu được dòng thuần?","type": "mcq"},{"answer": "D","explain": "Đếm khuẩn lạc trên đĩa đã pha loãng cho biết mật độ VSV trong mẫu gốc.","level": "TH","options": ["A. quan sát hình dạng virus.","B. đo kích thước vi khuẩn.","C. xác định trình tự gen.","D. ước tính mật độ vi sinh vật trong mẫu."],"points": 0.25,"q": "Đếm số khuẩn lạc trên đĩa thạch nhằm mục đích","type": "mcq"},{"answer": "C","explain": "Số lần phân đôi = 40/20 = 2, số tế bào = 10 x 2^2 = 40.","level": "VDC","options": ["A. 20","B. 30","C. 40","D. 80"],"points": 0.25,"q": "Cấy 10 tế bào vi khuẩn (phân đôi 20 phút/lần), sau 40 phút thu được bao nhiêu tế bào?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: virus chưa có cấu tạo tế bào. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về virus:","statements": ["a) Virus có kích thước hiển vi.","b) Virus được xếp vào nhóm vi sinh vật.","c) Virus có cấu tạo tế bào nhân sơ.","d) Virus cần tế bào chủ để nhân lên."],"type": "truefalse"},{"answer": ["F","T","T","F"],"explain": "a) Sai: S/V lớn. b) Đúng. c) Đúng. d) Sai: VSV phân bố rộng khắp.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về đặc điểm chung của VSV:","statements": ["a) Vi sinh vật có tỉ lệ S/V nhỏ nên chuyển hóa chậm.","b) Vi sinh vật hấp thụ nhiều, chuyển hóa nhanh.","c) Vi sinh vật sinh trưởng nhanh.","d) Vi sinh vật chỉ sống ở môi trường giàu dinh dưỡng."],"type": "truefalse"},{"answer": "Dòng thuần","explain": "Phân lập nhằm thu được dòng thuần (quần thể VSV thuần khiết).","level": "VD","points": 0.5,"q": "Sản phẩm của phương pháp phân lập vi sinh vật được gọi là gì?","type": "short"},{"answer": "40","explain": "40 phút = 2 lần phân đôi, 10 x 4 = 40 tế bào.","level": "VDC","points": 0.5,"q": "Cấy 10 tế bào (phân đôi 20 phút/lần), sau 40 phút được bao nhiêu tế bào? (trả lời bằng số)","type": "short"}]},{"name": "Đề 8","questions": [{"answer": "B","explain": "Vi khuẩn E. coli sống cộng sinh trong ruột người.","level": "NB","options": ["A. trong đất khô cằn.","B. trong ruột người và động vật.","C. trong không khí lạnh.","D. trong suối nước nóng."],"points": 0.25,"q": "Vi khuẩn E. coli thường sống ở","type": "mcq"},{"answer": "C","explain": "Nấm mốc đa bào dạng sợi thuộc vi nấm.","level": "NB","options": ["A. vi khuẩn.","B. virus.","C. vi nấm đa bào dạng sợi.","D. vi tảo."],"points": 0.25,"q": "Nấm mốc bánh mì là","type": "mcq"},{"answer": "A","explain": "Trùng biến hình (amip) di chuyển bằng chân giả.","level": "NB","options": ["A. động vật nguyên sinh.","B. vi khuẩn.","C. vi nấm.","D. virus."],"points": 0.25,"q": "Amip (trùng biến hình) thuộc nhóm vi sinh vật nào?","type": "mcq"},{"answer": "D","explain": "Nhiệt độ, pH, độ ẩm, dinh dưỡng... đều ảnh hưởng sinh trưởng VSV.","level": "TH","options": ["A. nhiệt độ.","B. độ pH.","C. chất dinh dưỡng.","D. tất cả các yếu tố trên."],"points": 0.25,"q": "Yếu tố môi trường nào ảnh hưởng đến sinh trưởng của vi sinh vật?","type": "mcq"},{"answer": "B","explain": "Trình tự gen (16S rRNA ở vi khuẩn) là căn cứ chính xác nhất để định danh.","level": "TH","options": ["A. màu sắc khuẩn lạc.","B. trình tự gen.","C. mùi môi trường.","D. kích thước đĩa cấy."],"points": 0.25,"q": "Căn cứ chính xác nhất để định danh vi khuẩn hiện nay là","type": "mcq"},{"answer": "A","explain": "Ủ ấm ở nhiệt độ thích hợp giúp VSV sinh trưởng nhanh tạo khuẩn lạc.","level": "VDC","options": ["A. Vì nhiệt độ thích hợp giúp VSV sinh trưởng nhanh.","B. Vì nhiệt độ cao diệt hết VSV lạ.","C. Vì lạnh làm VSV chết.","D. Vì ánh sáng cần cho mọi VSV."],"points": 0.25,"q": "Vì sao đĩa cấy vi khuẩn thường được ủ ở 37 độ C?","type": "mcq"},{"answer": ["T","F","T","T"],"explain": "a) Đúng. b) Sai: nấm men là vi nấm nhân thực. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nấm men:","statements": ["a) Nấm men là vi sinh vật đơn bào.","b) Nấm men thuộc nhóm vi khuẩn.","c) Nấm men sinh sản bằng nảy chồi.","d) Nấm men được dùng trong làm bánh mì."],"type": "truefalse"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: virus không nuôi được trên môi trường nhân tạo. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nuôi cấy virus và khuẩn lạc:","statements": ["a) Vi khuẩn nuôi được trên môi trường dinh dưỡng nhân tạo.","b) Nấm men nuôi được trên môi trường thạch.","c) Virus nuôi được trên đĩa thạch dinh dưỡng.","d) Nuôi cấy thành công khi thấy khuẩn lạc mọc."],"type": "truefalse"},{"answer": "Khuẩn lạc","explain": "Tập hợp tế bào VSV nhìn thấy bằng mắt thường gọi là khuẩn lạc.","level": "VD","points": 0.5,"q": "Tập hợp tế bào vi sinh vật mọc trên môi trường đặc, nhìn thấy bằng mắt thường được gọi là gì?","type": "short"},{"answer": "37 độ C","explain": "37 độ C là nhiệt độ cơ thể người, thích hợp cho nhiều vi khuẩn.","level": "VDC","points": 0.5,"q": "Đĩa cấy vi khuẩn gây bệnh ở người thường được ủ ở nhiệt độ nào?","type": "short"}]},{"name": "Đề 9","questions": [{"answer": "D","explain": "Cả 3 đều là VSV: vi khuẩn (nhân sơ), nấm men (vi nấm), trùng giày (ĐVNS).","level": "NB","options": ["A. cây lúa.","B. con gà.","C. cây đậu.","D. trùng giày."],"points": 0.25,"q": "Sinh vật nào sau đây là vi sinh vật?","type": "mcq"},{"answer": "A","explain": "VSV nhân sơ: vi khuẩn; nhân thực: vi nấm, vi tảo, ĐVNS.","level": "NB","options": ["A. vi khuẩn.","B. vi nấm.","C. vi tảo.","D. trùng roi."],"points": 0.25,"q": "Nhóm vi sinh vật nào thuộc sinh vật nhân sơ?","type": "mcq"},{"answer": "C","explain": "VSV dễ đột biến và trao đổi gen nên thích nghi nhanh.","level": "NB","options": ["A. kích thước lớn.","B. sinh trưởng chậm.","C. dễ phát sinh đột biến và trao đổi gen.","D. không sinh sản."],"points": 0.25,"q": "Vi sinh vật thích nghi nhanh với môi trường mới nhờ","type": "mcq"},{"answer": "B","explain": "Vô trùng loại bỏ VSV lạ, đảm bảo kết quả nghiên cứu chính xác.","level": "TH","options": ["A. diệt hết VSV cần nghiên cứu.","B. tránh nhiễm vi sinh vật lạ từ môi trường.","C. làm VSV sinh trưởng nhanh hơn.","D. tiết kiệm môi trường."],"points": 0.25,"q": "Ý nghĩa của vô trùng trong nghiên cứu vi sinh vật là","type": "mcq"},{"answer": "D","explain": "Mẫu nước ao chứa nhiều loài nên cần phân lập để tách từng loài.","level": "TH","options": ["A. quan sát trực tiếp.","B. đếm số lượng.","C. nuôi cấy chung.","D. phân lập để tách từng loài."],"points": 0.25,"q": "Muốn nghiên cứu riêng từng loài vi khuẩn trong mẫu nước ao, cần","type": "mcq"},{"answer": "C","explain": "Ủ lâu, dinh dưỡng cạn và chất thải tích lũy làm khuẩn lạc ngừng phát triển, thậm chí tàn lụi.","level": "VDC","options": ["A. Khuẩn lạc tiếp tục to ra mãi.","B. Vi khuẩn biến thành virus.","C. Khuẩn lạc ngừng phát triển do hết dinh dưỡng.","D. Xuất hiện thêm nhiều loài mới."],"points": 0.25,"q": "Đĩa thạch cấy vi khuẩn để lâu nhiều ngày sẽ thế nào?","type": "mcq"},{"answer": ["F","T","T","T"],"explain": "a) Sai: VSV có ở khắp nơi. b) Đúng. c) Đúng. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nơi sống của VSV:","statements": ["a) Vi sinh vật chỉ sống trong phòng thí nghiệm.","b) Vi sinh vật có trong đất, nước, không khí.","c) Vi sinh vật sống được ở suối nước nóng.","d) Vi sinh vật sống trong cơ thể sinh vật."],"type": "truefalse"},{"answer": ["T","F","T","F"],"explain": "a) Đúng. b) Sai: virus chưa có cấu tạo tế bào. c) Đúng. d) Sai: có cả đơn bào và tập đoàn.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về nơi sống và cấu tạo VSV:","statements": ["a) Vi khuẩn lam vừa là vi khuẩn vừa quang hợp.","b) Virus có cấu tạo tế bào nhân sơ.","c) Nấm mốc là vi sinh vật đa bào.","d) Mọi vi sinh vật đều sống đơn bào."],"type": "truefalse"},{"answer": "Động vật nguyên sinh","explain": "Trùng roi, trùng giày, amip thuộc nhóm động vật nguyên sinh.","level": "VD","points": 0.5,"q": "Trùng giày thuộc nhóm vi sinh vật nào?","type": "short"},{"answer": "Pha loãng mẫu","explain": "Pha loãng để khuẩn lạc mọc rời nhau, dễ đếm và phân lập.","level": "VDC","points": 0.5,"q": "Để khuẩn lạc mọc rời nhau dễ đếm, trước khi cấy cần làm gì với mẫu?","type": "short"}]},{"name": "Đề 10","questions": [{"answer": "B","explain": "VSV: kích thước hiển vi, hấp thụ nhiều, chuyển hóa nhanh.","level": "NB","options": ["A. kích thước lớn, chuyển hóa chậm.","B. kích thước hiển vi, chuyển hóa nhanh.","C. kích thước hiển vi, chuyển hóa chậm.","D. kích thước lớn, chuyển hóa nhanh."],"points": 0.25,"q": "Đặc điểm chung nhất của vi sinh vật là","type": "mcq"},{"answer": "D","explain": "Vi khuẩn, nấm men, trùng giày đều là VSV.","level": "NB","options": ["A. cây ngô.","B. con cá.","C. cây bàng.","D. nấm men."],"points": 0.25,"q": "Trong các sinh vật sau, sinh vật nào là vi sinh vật?","type": "mcq"},{"answer": "A","explain": "Kính hiển vi quang học quan sát vi khuẩn, nấm men...","level": "NB","options": ["A. kính hiển vi quang học.","B. kính lúp.","C. mắt thường.","D. kính thiên văn."],"points": 0.25,"q": "Để quan sát hình dạng vi khuẩn, người ta dùng","type": "mcq"},{"answer": "C","explain": "Môi trường cung cấp C, N, khoáng... cho VSV sinh trưởng.","level": "TH","options": ["A. để diệt VSV lạ.","B. để quan sát virus.","C. để cung cấp dinh dưỡng cho VSV sinh trưởng.","D. để bảo quản VSV lâu dài."],"points": 0.25,"q": "Vai trò của môi trường nuôi cấy là","type": "mcq"},{"answer": "B","explain": "Mỗi tế bào tạo 1 khuẩn lạc nên đếm khuẩn lạc cho biết số tế bào ban đầu.","level": "TH","options": ["A. đo kích thước tế bào.","B. ước tính số tế bào vi sinh vật trong mẫu.","C. xác định loài virus.","D. đo tốc độ sinh trưởng."],"points": 0.25,"q": "Phương pháp đếm khuẩn lạc cho biết","type": "mcq"},{"answer": "D","explain": "Số lần phân đôi = 80/20 = 4, số tế bào = 5 x 2^4 = 80.","level": "VDC","options": ["A. 20","B. 40","C. 60","D. 80"],"points": 0.25,"q": "Cấy 5 tế bào vi khuẩn (phân đôi 20 phút/lần), sau 80 phút thu được bao nhiêu tế bào?","type": "mcq"},{"answer": ["T","T","F","T"],"explain": "a) Đúng. b) Đúng. c) Sai: có cả lợi và hại. d) Đúng.","level": "TH","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về vai trò của VSV trong tự nhiên và đời sống:","statements": ["a) Vi sinh vật phân hủy xác sinh vật.","b) Vi sinh vật tham gia chu trình vật chất trong tự nhiên.","c) Vi sinh vật chỉ gây hại.","d) Vi sinh vật được ứng dụng trong thực phẩm."],"type": "truefalse"},{"answer": ["F","T","T","T"],"explain": "a) Sai: virus chưa có cấu tạo tế bào. b) Đúng. c) Đúng. d) Đúng.","level": "VD","points": 1,"q": "Xét tính đúng, sai của các phát biểu sau về phân loại theo cấu tạo tế bào:","statements": ["a) Virus là sinh vật nhân sơ.","b) Vi khuẩn là sinh vật nhân sơ.","c) Vi nấm là sinh vật nhân thực.","d) Động vật nguyên sinh là sinh vật nhân thực."],"type": "truefalse"},{"answer": "Vi khuẩn","explain": "Vi khuẩn là nhóm VSV nhân sơ.","level": "VD","points": 0.5,"q": "Nhóm vi sinh vật nào có cấu tạo tế bào nhân sơ?","type": "short"},{"answer": "80","explain": "80 phút = 4 lần phân đôi, 5 x 16 = 80 tế bào.","level": "VDC","points": 0.5,"q": "Cấy 5 tế bào (phân đôi 20 phút/lần), sau 80 phút được bao nhiêu tế bào? (trả lời bằng số)","type": "short"}]}]}
