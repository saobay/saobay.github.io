<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"answer":"A","explain":"Sử học là ngành khoa học nghiên cứu về toàn bộ đời sống của loài người trong quá khứ: chính trị, quân sự, kinh tế, văn hóa, xã hội.","level":"NB","options":["A. Toàn bộ đời sống của loài người trong quá khứ.","B. Chỉ các cuộc chiến tranh trong lịch sử nhân loại.","C. Chỉ sự phát triển của khoa học và kĩ thuật.","D. Chỉ đời sống văn hóa tinh thần của con người."],"points":0.25,"q":"Sử học là ngành khoa học nghiên cứu về vấn đề nào sau đây?","type":"mcq"},{"answer":"B","explain":"Đối tượng nghiên cứu của sử học rất rộng lớn, phức tạp nên cần phối hợp thông tin và phương pháp của nhiều ngành khoa học khác nhau; đó chính là tính liên ngành của sử học.","level":"NB","options":["A. Vì sử học là ngành khoa học ra đời sớm nhất.","B. Vì trong nghiên cứu, sử học phải phối hợp thông tin và phương pháp của nhiều ngành khoa học khác nhau.","C. Vì sử học không có đối tượng nghiên cứu riêng.","D. Vì sử học chỉ sử dụng duy nhất phương pháp liên ngành."],"points":0.25,"q":"Vì sao sử học được coi là môn khoa học có tính liên ngành?","type":"mcq"},{"answer":"A","explain":"Lịch sử đời sống xã hội chính là chất liệu, là nguồn cảm hứng đưa đến sự ra đời của các công trình, tác phẩm thuộc các ngành khoa học xã hội và nhân văn.","level":"NB","options":["A. Là chất liệu, nguồn cảm hứng đưa đến sự ra đời của các công trình, tác phẩm.","B. Quyết định phương pháp nghiên cứu của mọi ngành khoa học.","C. Thay thế hoàn toàn vai trò của các ngành khoa học khác.","D. Là tiêu chí duy nhất để đánh giá mọi công trình khoa học."],"points":0.25,"q":"Lịch sử đời sống xã hội có vai trò nào sau đây đối với các ngành khoa học xã hội và nhân văn?","type":"mcq"},{"answer":"C","explain":"\"Bình Ngô đại cáo\" là tác phẩm văn học ra đời trong bối cảnh cuộc kháng chiến chống quân Minh thắng lợi; muốn hiểu sâu giá trị của nó phải đặt trong bối cảnh lịch sử cụ thể.","level":"TH","options":["A. Toán học.","B. Hóa học.","C. Văn học.","D. Địa lí học."],"points":0.25,"q":"\"Bình Ngô đại cáo\" của Nguyễn Trãi là ví dụ tiêu biểu cho mối liên hệ giữa sử học với ngành khoa học nào?","type":"mcq"},{"answer":"B","explain":"Hóa học cung cấp phương pháp đồng vị phóng xạ các-bon (C14) giúp xác định niên đại các mẫu di vật khảo cổ một cách khoa học.","level":"TH","options":["A. Văn học.","B. Hóa học.","C. Toán học.","D. Dân tộc học."],"points":0.25,"q":"Việc xác định niên đại các mẫu di vật khai quật được tại các di chỉ khảo cổ cho thấy sử học có mối liên hệ mật thiết với ngành khoa học nào?","type":"mcq"},{"answer":"B","explain":"Công nghệ số hóa, thực tế ảo giúp xây dựng bảo tàng ảo 3D, đưa hiện vật lịch sử đến gần hơn với công chúng.","level":"VD","options":["A. Văn học.","B. Công nghệ.","C. Toán học.","D. Triết học."],"points":0.25,"q":"Bảo tàng ảo 3D trưng bày các hiện vật lịch sử là thành tựu của việc kết hợp sử học với lĩnh vực nào?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: sử học có tính liên ngành, luôn cần phối hợp tri thức, phương pháp của nhiều ngành khoa học khác.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về mối liên hệ giữa sử học với các ngành khoa học xã hội và nhân văn:","statements":["a) Lịch sử đời sống xã hội là chất liệu, nguồn cảm hứng đưa đến sự ra đời của các công trình khoa học xã hội và nhân văn.","b) Tri thức lịch sử là tấm gương phản chiếu giá trị của các công trình khoa học xã hội và nhân văn với cuộc sống.","c) Các ngành khoa học xã hội và nhân văn hỗ trợ đắc lực cho việc tìm hiểu, phục dựng quá khứ.","d) Sử học hoàn toàn độc lập, không cần đến tri thức của bất kì ngành khoa học nào khác."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: công nghệ giúp số hóa tư liệu, xây dựng bảo tàng ảo 3D, phục vụ nghiên cứu và quảng bá lịch sử.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về mối liên hệ giữa sử học với khoa học tự nhiên và công nghệ:","statements":["a) Khoa học tự nhiên và công nghệ cũng là đối tượng nghiên cứu của lịch sử khi xem xét ở góc độ lịch sử.","b) Lịch sử giúp nhà khoa học đi sau kế thừa tri thức và tránh lặp lại sai lầm của người đi trước.","c) Phương pháp đồng vị phóng xạ các-bon C14 của hóa học giúp xác định niên đại di vật khảo cổ.","d) Công nghệ số hóa, thực tế ảo không có vai trò gì trong nghiên cứu và quảng bá lịch sử."],"type":"truefalse"},{"answer":"C14","explain":"Đó là phương pháp đồng vị phóng xạ các-bon C14 do hóa học cung cấp, giúp xác định niên đại các mẫu di vật hữu cơ.","level":"VD","points":0.5,"q":"Phương pháp xác định niên đại di vật khảo cổ bằng đồng vị phóng xạ của nguyên tố các-bon được kí hiệu là gì?","type":"short"},{"answer":"dân tộc học","explain":"Theo SGK, nhà sàn của người Mường ở Phú Thọ là ví dụ về sự kết hợp giữa lịch sử và dân tộc học trong tìm hiểu đời sống cư dân.","level":"VDC","points":0.5,"q":"Nhà sàn của người Mường ở Phú Thọ là tư liệu quý cho ngành khoa học nào nghiên cứu đời sống cư dân?","type":"short"}]},{"name":"Đề 2","questions":[{"answer":"A","explain":"Sử học sử dụng tri thức, phương pháp, thành tựu của các ngành khoa học xã hội và nhân văn để phục dựng, giải thích, chứng minh, khái quát; nhờ đó nhận thức lịch sử chính xác, đầy đủ, sâu sắc hơn.","level":"NB","options":["A. Giúp nhận thức lịch sử trở nên chính xác, đầy đủ và sâu sắc.","B. Phục dựng lại quá trình hình thành và phát triển của sử học.","C. Là nguồn gốc duy nhất của mọi nhận thức lịch sử.","D. Là nền tảng tiếp cận duy nhất khi nghiên cứu lịch sử."],"points":0.25,"q":"Nhận định nào sau đây phản ánh đúng vai trò của các ngành khoa học xã hội và nhân văn đối với sử học?","type":"mcq"},{"answer":"A","explain":"Tri thức lịch sử đồng thời là tấm gương phản chiếu giá trị của các công trình, tác phẩm thuộc ngành khoa học xã hội và nhân văn với cuộc sống.","level":"NB","options":["A. Là tấm gương phản chiếu giá trị của các công trình đó với cuộc sống.","B. Quyết định nội dung của mọi công trình khoa học.","C. Làm thay đổi phương pháp của các ngành khoa học.","D. Xóa bỏ ranh giới giữa các ngành khoa học."],"points":0.25,"q":"Tri thức lịch sử có vai trò nào sau đây đối với các công trình thuộc lĩnh vực khoa học xã hội và nhân văn?","type":"mcq"},{"answer":"A","explain":"Khoa học tự nhiên và công nghệ là đối tượng nghiên cứu của lịch sử khi xem xét ở góc độ lịch sử: bối cảnh ra đời, điều kiện lịch sử, tác dụng, ý nghĩa với sự phát triển xã hội.","level":"NB","options":["A. Bối cảnh ra đời, điều kiện lịch sử, tác dụng và ý nghĩa của chúng với sự phát triển xã hội.","B. Cấu tạo vật chất của mọi phát minh kĩ thuật.","C. Công thức hóa học của các vật liệu mới.","D. Quy luật vận động của tự nhiên."],"points":0.25,"q":"Khoa học tự nhiên và công nghệ được nghiên cứu ở góc độ lịch sử nhằm làm rõ vấn đề nào sau đây?","type":"mcq"},{"answer":"C","explain":"Việc vẽ lược đồ phân bố các di chỉ cần đến bản đồ, hệ thống định vị, GIS của địa lí học kết hợp với tri thức khảo cổ, lịch sử.","level":"TH","options":["A. Hóa học.","B. Toán học.","C. Địa lí học.","D. Văn học."],"points":0.25,"q":"Lược đồ nơi tìm thấy dấu tích của người nguyên thủy ở Đông Nam Á là ví dụ về sự kết hợp giữa sử học với ngành khoa học nào?","type":"mcq"},{"answer":"B","explain":"Lập bảng thống kê tỉ lệ ruộng đất cần đến phương pháp thống kê, tính toán của toán học.","level":"TH","options":["A. Văn học.","B. Toán học.","C. Hóa học.","D. Sinh học."],"points":0.25,"q":"Bảng thống kê tỉ lệ phân bố ruộng đất công và tư ở một số địa phương dưới thời Nguyễn cho thấy sử học đã sử dụng tri thức của ngành nào?","type":"mcq"},{"answer":"A","explain":"Lịch sử giúp các nhà khoa học đi sau không lặp lại sai lầm của người đi trước, kế thừa tri thức, kinh nghiệm để ứng phó tốt hơn.","level":"VD","options":["A. Sử học cung cấp bài học kinh nghiệm để người đi sau tránh lặp lại sai lầm, ứng phó tốt hơn.","B. Sử học thay thế hoàn toàn vai trò của y học.","C. Sử học quyết định phương pháp chữa bệnh hiện đại.","D. Sử học chỉ có giá trị với khoa học xã hội, không liên quan y học."],"points":0.25,"q":"Nghiên cứu lịch sử các trận dịch trong quá khứ giúp y học hiện đại chủ động phòng chống dịch bệnh. Điều này thể hiện vai trò nào của sử học?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: tính liên ngành nghĩa là sử học phối hợp thêm tri thức, phương pháp của các ngành khác, chứ không phải không có phương pháp riêng.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sử học là ngành khoa học nghiên cứu toàn bộ đời sống loài người trong quá khứ.","b) Vì đối tượng rộng lớn, phức tạp nên sử học cần phối hợp thông tin, phương pháp của nhiều ngành khoa học.","c) Sử học là bộ môn khoa học có tính liên ngành.","d) Tính liên ngành có nghĩa là sử học không có phương pháp nghiên cứu riêng."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo bảng ví dụ SGK. d) Sai: nhà sàn người Mường là ví dụ về mối liên hệ giữa lịch sử và dân tộc học.","level":"VDC","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về các ví dụ liên ngành trong SGK:","statements":["a) \"Hoàng Lê nhất thống chí\" của Ngô gia văn phái là ví dụ về mối liên hệ giữa lịch sử và văn học.","b) Công cụ đá ghè đẽo một mặt ở An Khê (Gia Lai) là ví dụ về mối liên hệ giữa lịch sử và khảo cổ học.","c) Khai thác giá trị khu di tích Hoàng thành Thăng Long cần phối hợp lịch sử, khảo cổ học, địa lí học, kiến trúc, điêu khắc.","d) Nhà sàn người Mường ở Phú Thọ là ví dụ về mối liên hệ giữa lịch sử và hóa học."],"type":"truefalse"},{"answer":"quân Minh","explain":"\"Bình Ngô đại cáo\" (1428) tổng kết thắng lợi của cuộc kháng chiến chống quân Minh do Lê Lợi lãnh đạo.","level":"VD","points":0.5,"q":"Tác phẩm \"Bình Ngô đại cáo\" của Nguyễn Trãi ra đời trong bối cảnh thắng lợi của cuộc kháng chiến chống quân xâm lược nào?","type":"short"},{"answer":"đá Rosetta","explain":"Phiến đá Rosetta được tìm thấy năm 1799; nhờ nó, Champollion đã giải mã thành công chữ tượng hình Ai Cập năm 1822.","level":"VDC","points":0.5,"q":"Phiến đá giúp con người giải mã được chữ tượng hình Ai Cập cổ đại, được tìm thấy năm 1799, có tên gọi là gì?","type":"short"}]},{"name":"Đề 3","questions":[{"answer":"A","explain":"Lịch sử đời sống xã hội là chất liệu, nguồn cảm hứng đưa đến sự ra đời của các công trình, tác phẩm thuộc các ngành khoa học xã hội và nhân văn.","level":"NB","options":["A. Là nguồn cảm hứng đưa tới sự ra đời của các công trình khoa học.","B. Luôn biệt lập và tách rời với các ngành khoa học xã hội và nhân văn.","C. Cung cấp toàn diện kiến thức chuyên ngành của các ngành khoa học.","D. Là cơ sở dẫn tới sự ra đời của mọi ngành khoa học xã hội và nhân văn."],"points":0.25,"q":"Nội dung nào sau đây là một trong những vai trò của sử học đối với các ngành khoa học xã hội và nhân văn?","type":"mcq"},{"answer":"A","explain":"Tri thức của các ngành khoa học xã hội và nhân văn hỗ trợ đắc lực cho việc tìm hiểu, phục dựng quá khứ.","level":"NB","options":["A. Tìm hiểu, phục dựng quá khứ.","B. Sáng tác các tác phẩm văn học.","C. Chế tạo công cụ lao động.","D. Dự báo thời tiết."],"points":0.25,"q":"Các ngành khoa học xã hội và nhân văn hỗ trợ sử học trong việc nào sau đây?","type":"mcq"},{"answer":"A","explain":"Các ngành khoa học tự nhiên và công nghệ cung cấp cho sử học phương pháp, công cụ, kĩ thuật hiện đại, giúp nghiên cứu lịch sử ngày càng chính xác.","level":"NB","options":["A. Phương pháp, công cụ, kĩ thuật nghiên cứu hiện đại.","B. Đối tượng nghiên cứu duy nhất của sử học.","C. Toàn bộ tri thức lịch sử nhân loại.","D. Hệ thống lí luận của sử học."],"points":0.25,"q":"Khoa học tự nhiên và công nghệ cung cấp cho sử học điều nào sau đây?","type":"mcq"},{"answer":"A","explain":"\"Hoàng Lê nhất thống chí\" của Ngô gia văn phái phản ánh xã hội Đàng Ngoài cuối thế kỉ XVIII; tách khỏi bối cảnh lịch sử thì không hiểu đúng giá trị tác phẩm.","level":"TH","options":["A. Bối cảnh xã hội Đàng Ngoài cuối thế kỉ XVIII.","B. Bối cảnh thời kì Bắc thuộc.","C. Bối cảnh kháng chiến chống Pháp.","D. Bối cảnh công cuộc đổi mới hiện nay."],"points":0.25,"q":"Muốn hiểu sâu sắc giá trị của \"Hoàng Lê nhất thống chí\", người đọc cần đặt tác phẩm trong bối cảnh nào?","type":"mcq"},{"answer":"B","explain":"Sinh học (di truyền học) với kĩ thuật phân tích ADN cổ giúp xác định nguồn gốc, quan hệ huyết thống và quá trình di cư của các tộc người.","level":"TH","options":["A. Văn học.","B. Sinh học.","C. Toán học.","D. Triết học."],"points":0.25,"q":"Việc truy tìm nguồn gốc, quá trình di cư của các tộc người cổ nhờ phân tích ADN cổ cho thấy sử học kết hợp với ngành nào?","type":"mcq"},{"answer":"B","explain":"Theo bảng ví dụ SGK, khai thác giá trị khu di tích Hoàng thành Thăng Long cần phối hợp lịch sử, khảo cổ học, địa lí học, kiến trúc, điêu khắc.","level":"VD","options":["A. Chỉ cần lịch sử.","B. Lịch sử, khảo cổ học, địa lí học, kiến trúc, điêu khắc.","C. Chỉ cần kiến trúc và điêu khắc.","D. Lịch sử và văn học."],"points":0.25,"q":"Một nhà nghiên cứu muốn phục dựng diện mạo khu di tích Hoàng thành Thăng Long thời Lý. Theo SGK, ông cần phối hợp những ngành nào?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: khoa học tự nhiên và công nghệ vừa là đối tượng nghiên cứu của lịch sử, vừa cung cấp công cụ hiện đại cho sử học.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Không tác phẩm văn học, nghệ thuật nào thoát li khỏi bối cảnh lịch sử của thời đại nó ra đời.","b) Sử học dùng tri thức các ngành khoa học xã hội và nhân văn để giải thích, chứng minh, khái quát và rút ra bài học lịch sử.","c) Công nghệ giúp số hóa tư liệu, xây dựng bảo tàng ảo phục vụ nghiên cứu lịch sử.","d) Sử học chỉ nghiên cứu quá khứ nên không liên quan gì đến khoa học tự nhiên và công nghệ."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo bảng ví dụ SGK. d) Sai: văn học và sử học gắn bó mật thiết, tác phẩm văn học là chất liệu và cũng cần bối cảnh lịch sử để hiểu đúng.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Địa lí học hỗ trợ sử học qua bản đồ, lược đồ phân bố các di chỉ khảo cổ.","b) Toán học hỗ trợ sử học qua thống kê, tính toán số liệu lịch sử.","c) Hóa học hỗ trợ sử học qua phương pháp xác định niên đại C14.","d) Văn học không có mối liên hệ nào với sử học vì hai ngành hoàn toàn tách biệt."],"type":"truefalse"},{"answer":"Champollion","explain":"Jean-Francois Champollion đã giải mã chữ tượng hình Ai Cập năm 1822 nhờ phiến đá Rosetta, mở ra ngành Ai Cập học hiện đại.","level":"TH","points":0.5,"q":"Nhà bác học người Pháp nào đã giải mã thành công chữ tượng hình Ai Cập cổ đại vào năm 1822?","type":"short"},{"answer":"Willard Libby","explain":"Willard Libby phát minh phương pháp hẹn giờ bằng các-bon phóng xạ (C14) năm 1949, tạo bước ngoặt cho khảo cổ học.","level":"VDC","points":0.5,"q":"Phương pháp xác định niên đại bằng đồng vị phóng xạ các-bon C14 do nhà hóa học nào phát minh vào năm 1949?","type":"short"}]},{"name":"Đề 4","questions":[{"answer":"A","explain":"Nhờ tri thức các ngành khoa học xã hội và nhân văn, sử học mô tả, phục dựng đối tượng nghiên cứu rồi giải thích, chứng minh, khái quát để rút ra bài học, quy luật lịch sử.","level":"NB","options":["A. Mô tả, phục dựng đối tượng nghiên cứu; giải thích, chứng minh, khái quát để rút ra bài học lịch sử.","B. Sáng tác thêm nhiều tác phẩm văn học mới.","C. Chế tạo các công cụ nghiên cứu hiện đại.","D. Xây dựng hệ thống lí luận cho các ngành khoa học tự nhiên."],"points":0.25,"q":"Sử học sử dụng tri thức của các ngành khoa học xã hội và nhân văn để làm gì?","type":"mcq"},{"answer":"A","explain":"Địa lí học cung cấp bản đồ, hệ thống định vị (GPS), GIS giúp xác định vị trí, vẽ lược đồ phân bố các di chỉ khảo cổ.","level":"NB","options":["A. Địa lí học.","B. Hóa học.","C. Văn học.","D. Toán học."],"points":0.25,"q":"Ngành khoa học nào hỗ trợ sử học vẽ lược đồ nơi tìm thấy dấu tích người nguyên thủy ở Đông Nam Á?","type":"mcq"},{"answer":"A","explain":"Khảo cổ học là ngành nghiên cứu quá khứ qua các di tích, di vật vật chất; công cụ đá An Khê là di vật khảo cổ tiêu biểu.","level":"NB","options":["A. Khảo cổ học.","B. Thiên văn học.","C. Triết học.","D. Luật học."],"points":0.25,"q":"Công cụ đá ghè đẽo một mặt và rìu tay ở Gò Đá (An Khê, Gia Lai) là tư liệu của ngành khoa học nào?","type":"mcq"},{"answer":"A","explain":"\"Bình Ngô đại cáo\" (1428) là áng thiên cổ hùng văn tổng kết thắng lợi kháng chiến chống Minh; tách khỏi bối cảnh đó thì không hiểu đúng giá trị tác phẩm.","level":"TH","options":["A. Cuộc kháng chiến chống quân Minh thắng lợi.","B. Công cuộc mở rộng lãnh thổ về phía Nam.","C. Thời kì Trịnh - Nguyễn phân tranh.","D. Cuộc kháng chiến chống quân Thanh."],"points":0.25,"q":"\"Bình Ngô đại cáo\" chỉ bộc lộ hết giá trị khi được đặt trong bối cảnh lịch sử nào?","type":"mcq"},{"answer":"B","explain":"Dân tộc học nghiên cứu đời sống vật chất, tinh thần của các tộc người; nhà sàn người Mường là tư liệu dân tộc học quý.","level":"TH","options":["A. Hóa học.","B. Dân tộc học.","C. Toán học.","D. Vật lí học."],"points":0.25,"q":"Nhà sàn của người Mường ở Phú Thọ là ví dụ về mối liên hệ giữa sử học với ngành nào?","type":"mcq"},{"answer":"C","explain":"Muốn xác định niên đại di vật hữu cơ, nhà khảo cổ phải nhờ đến phương pháp đồng vị phóng xạ các-bon C14 của hóa học — ví dụ điển hình của nghiên cứu liên ngành.","level":"VD","options":["A. Văn học để sáng tác truyện về di chỉ.","B. Toán học để đếm số lượng di vật.","C. Hóa học để xác định niên đại di vật bằng C14.","D. Triết học để bàn về ý nghĩa di chỉ."],"points":0.25,"q":"Một nhà khảo cổ muốn biết chính xác chiếc rìu đá tìm được có niên đại bao nhiêu năm. Theo SGK, ông cần đến sự hỗ trợ của ngành nào?","type":"mcq"},{"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai: văn học vừa lấy chất liệu từ lịch sử, vừa cần bối cảnh lịch sử để hiểu đúng tác phẩm — quan hệ hai chiều. c), d) Đúng theo SGK.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sử học có tính liên ngành vì phải phối hợp thông tin, phương pháp của nhiều ngành khoa học.","b) Văn học chỉ lấy chất liệu từ lịch sử chứ không cần đến tri thức lịch sử để hiểu tác phẩm.","c) Lịch sử giúp nhà khoa học đi sau kế thừa kinh nghiệm, tránh lặp lại sai lầm.","d) Khoa học tự nhiên và công nghệ vừa là đối tượng nghiên cứu của lịch sử, vừa cung cấp công cụ cho sử học."],"type":"truefalse"},{"answer":["T","T","F","T"],"explain":"a), b), d) Đúng theo bảng ví dụ SGK. c) Sai: bảng thống kê ruộng đất thời Nguyễn là ví dụ về mối liên hệ giữa lịch sử và toán học (thống kê).","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về các ví dụ trong SGK:","statements":["a) Lược đồ dấu tích người nguyên thủy ở Đông Nam Á thể hiện mối liên hệ giữa lịch sử và địa lí học.","b) Bảo tàng ảo 3D thể hiện mối liên hệ giữa lịch sử và công nghệ.","c) Bảng thống kê ruộng đất thời Nguyễn thể hiện mối liên hệ giữa lịch sử và văn học.","d) Khai thác Hoàng thành Thăng Long cần phối hợp nhiều ngành: lịch sử, khảo cổ, địa lí, kiến trúc, điêu khắc."],"type":"truefalse"},{"answer":"1428","explain":"\"Bình Ngô đại cáo\" của Nguyễn Trãi được công bố năm 1428, sau thắng lợi của cuộc kháng chiến chống quân Minh.","level":"VD","points":0.5,"q":"\"Bình Ngô đại cáo\" của Nguyễn Trãi được công bố vào năm nào?","type":"short"},{"answer":"An Khê","explain":"Theo SGK, công cụ đá ghè đẽo một mặt và rìu tay được tìm thấy ở Gò Đá, An Khê (Gia Lai) — dấu tích của người nguyên thủy.","level":"VDC","points":0.5,"q":"Di chỉ Gò Đá với công cụ đá ghè đẽo của người nguyên thủy nằm ở huyện nào của tỉnh Gia Lai?","type":"short"}]},{"name":"Đề 5","questions":[{"answer":"A","explain":"Khoa học tự nhiên và công nghệ là đối tượng nghiên cứu của lịch sử khi xem xét ở góc độ lịch sử: bối cảnh ra đời, điều kiện lịch sử, tác dụng, ý nghĩa với sự phát triển xã hội.","level":"NB","options":["A. Chúng cũng là đối tượng nghiên cứu của lịch sử ở góc độ lịch sử.","B. Chúng không liên quan gì đến lịch sử.","C. Chúng quyết định mọi nội dung của sử học.","D. Chúng chỉ phục vụ khoa học tự nhiên."],"points":0.25,"q":"Nhận định nào sau đây đúng về mối liên hệ giữa sử học với khoa học tự nhiên và công nghệ?","type":"mcq"},{"answer":"A","explain":"Nhờ tri thức các ngành khoa học xã hội và nhân văn mà nhận thức lịch sử trở nên chính xác, đầy đủ và sâu sắc hơn.","level":"NB","options":["A. Chính xác, đầy đủ và sâu sắc.","B. Phiến diện và nông cạn.","C. Hoàn toàn chủ quan.","D. Không thể kiểm chứng."],"points":0.25,"q":"Nhờ sự hỗ trợ của các ngành khoa học xã hội và nhân văn, nhận thức lịch sử trở nên như thế nào?","type":"mcq"},{"answer":"A","explain":"Không một tác phẩm nào thoát li khỏi bối cảnh xuất hiện của nó với những nhân vật, sự kiện, vấn đề cụ thể của thời đại.","level":"NB","options":["A. Bối cảnh lịch sử với những nhân vật, sự kiện cụ thể của thời đại.","B. Sở thích cá nhân của tác giả.","C. Nhu cầu thị trường sách.","D. Yêu cầu của nhà xuất bản."],"points":0.25,"q":"Mọi công trình thuộc lĩnh vực khoa học xã hội và nhân văn đều không thể thoát li khỏi yếu tố nào sau đây?","type":"mcq"},{"answer":"B","explain":"Các tác phẩm văn học lớn đều lấy chất liệu từ hiện thực lịch sử: chiến tranh, xã hội, con người của thời đại.","level":"TH","options":["A. Hóa học.","B. Hiện thực lịch sử của thời đại.","C. Toán học.","D. Vật lí học."],"points":0.25,"q":"Nhiều tác phẩm văn học lớn lấy chất liệu sáng tác chủ yếu từ đâu?","type":"mcq"},{"answer":"B","explain":"Lịch sử nghiên cứu bối cảnh ra đời của máy hơi nước (nước Anh cuối thế kỉ XVIII) giúp kĩ sư hiểu điều kiện lịch sử làm nên cách mạng công nghiệp.","level":"TH","options":["A. Cấu tạo chi tiết của máy hơi nước.","B. Bối cảnh lịch sử ra đời của máy hơi nước.","C. Công thức vật lí của hơi nước.","D. Giá thành sản xuất máy hơi nước."],"points":0.25,"q":"Tìm hiểu lịch sử phát triển của máy hơi nước giúp kĩ sư hiện đại hiểu rõ điều gì?","type":"mcq"},{"answer":"C","explain":"GIS (hệ thống thông tin địa lí) của địa lí học kết hợp với tri thức khảo cổ, lịch sử giúp vẽ lược đồ phân bố di chỉ chính xác.","level":"VD","options":["A. Hóa học với phương pháp C14.","B. Văn học với các tác phẩm cổ.","C. Địa lí học với bản đồ, GIS và hệ thống định vị.","D. Toán học với phương pháp thống kê."],"points":0.25,"q":"Để vẽ được lược đồ nơi tìm thấy dấu tích người nguyên thủy ở Đông Nam Á, các nhà nghiên cứu cần đến sự hỗ trợ của ngành nào?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: ngược lại, sử học luôn sử dụng tri thức, phương pháp, thành tựu của các ngành khoa học xã hội và nhân văn.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lịch sử đời sống xã hội là chất liệu, nguồn cảm hứng của các công trình khoa học xã hội và nhân văn.","b) Tri thức lịch sử là tấm gương phản chiếu giá trị các công trình đó với cuộc sống.","c) Sử học dùng tri thức các ngành để phục dựng, giải thích, chứng minh, khái quát và rút ra bài học lịch sử.","d) Sử học không sử dụng bất kì tri thức nào của các ngành khoa học xã hội và nhân văn."],"type":"truefalse"},{"answer":["T","F","T","T"],"explain":"a), c), d) Đúng theo SGK. b) Sai: công nghệ số hóa, thực tế ảo (bảo tàng ảo 3D) có vai trò quan trọng trong nghiên cứu và quảng bá lịch sử.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hóa học giúp sử học xác định niên đại di vật bằng phương pháp C14.","b) Công nghệ không có vai trò gì trong nghiên cứu lịch sử.","c) Sinh học giúp sử học truy tìm nguồn gốc các tộc người qua phân tích ADN cổ.","d) Sử học giúp nhà khoa học đi sau tránh lặp lại sai lầm của người đi trước."],"type":"truefalse"},{"answer":"Nguyễn Trãi","explain":"\"Bình Ngô đại cáo\" (1428) là tác phẩm của Nguyễn Trãi, được coi là bản tuyên ngôn độc lập thứ hai của dân tộc.","level":"TH","points":0.5,"q":"Tác giả của \"Bình Ngô đại cáo\" — ví dụ tiêu biểu về mối liên hệ giữa sử học và văn học — là ai?","type":"short"},{"answer":"Hoàng thành Thăng Long","explain":"Theo SGK, khai thác giá trị khu di tích Trung tâm Hoàng thành Thăng Long cần phối hợp lịch sử, khảo cổ học, địa lí học, kiến trúc, điêu khắc.","level":"VDC","points":0.5,"q":"Khu di tích nào ở Hà Nội được SGK nêu làm ví dụ cần phối hợp nhiều ngành khoa học (lịch sử, khảo cổ, địa lí, kiến trúc, điêu khắc) để khai thác giá trị?","type":"short"}]},{"name":"Đề 6","questions":[{"answer":"A","explain":"Sử học nghiên cứu toàn bộ đời sống loài người trong quá khứ, bao gồm chính trị, quân sự, kinh tế, văn hóa, xã hội.","level":"NB","options":["A. Chính trị, quân sự, kinh tế, văn hóa, xã hội.","B. Chỉ chính trị và quân sự.","C. Chỉ kinh tế và văn hóa.","D. Chỉ khoa học và công nghệ."],"points":0.25,"q":"Sử học nghiên cứu những lĩnh vực nào của đời sống loài người trong quá khứ?","type":"mcq"},{"answer":"A","explain":"Tri thức lịch sử là tấm gương phản chiếu giá trị của các công trình, tác phẩm thuộc ngành khoa học xã hội và nhân văn với cuộc sống.","level":"NB","options":["A. Các công trình, tác phẩm thuộc ngành khoa học xã hội và nhân văn với cuộc sống.","B. Mọi phát minh của khoa học tự nhiên.","C. Giá trị của các công trình toán học.","D. Hiệu quả của các ứng dụng công nghệ."],"points":0.25,"q":"Tri thức lịch sử là \"tấm gương\" phản chiếu giá trị của đối tượng nào sau đây?","type":"mcq"},{"answer":"A","explain":"Công nghệ số hóa, thực tế ảo giúp xây dựng bảo tàng ảo 3D trưng bày hiện vật lịch sử, phục vụ nghiên cứu và quảng bá.","level":"NB","options":["A. Số hóa tư liệu, xây dựng bảo tàng ảo 3D.","B. Sáng tác các tác phẩm văn học.","C. Xác định niên đại bằng C14.","D. Vẽ bản đồ phân bố di chỉ."],"points":0.25,"q":"Công nghệ hỗ trợ sử học trong việc nào sau đây?","type":"mcq"},{"answer":"B","explain":"Xem xét khoa học – công nghệ ở góc độ lịch sử là làm rõ bối cảnh ra đời, điều kiện lịch sử, tác dụng và ý nghĩa của chúng với sự phát triển xã hội.","level":"TH","options":["A. Vì mọi phát minh đều do nhà sử học tạo ra.","B. Vì cần hiểu bối cảnh ra đời, điều kiện lịch sử, tác dụng và ý nghĩa của chúng với xã hội.","C. Vì sử học quyết định hướng phát triển của công nghệ.","D. Vì không có ngành nào khác nghiên cứu được công nghệ."],"points":0.25,"q":"Vì sao khoa học tự nhiên và công nghệ cũng cần được nghiên cứu ở góc độ lịch sử?","type":"mcq"},{"answer":"B","explain":"Sinh học (di truyền học) với kĩ thuật phân tích ADN cổ giúp truy tìm nguồn gốc, quan hệ huyết thống và quá trình di cư của các tộc người.","level":"TH","options":["A. Hóa học.","B. Sinh học.","C. Toán học.","D. Văn học."],"points":0.25,"q":"Phân tích ADN cổ để truy tìm nguồn gốc các tộc người cho thấy sử học kết hợp với ngành nào?","type":"mcq"},{"answer":"C","explain":"Bảo tàng ảo 3D là ví dụ SGK về sự kết hợp giữa lịch sử và công nghệ, giúp hiện vật đến gần công chúng, nhất là giới trẻ.","level":"VD","options":["A. Lịch sử và văn học qua sáng tác truyện.","B. Lịch sử và toán học qua thống kê vé.","C. Lịch sử và công nghệ qua bảo tàng ảo 3D.","D. Lịch sử và hóa học qua bảo quản hiện vật."],"points":0.25,"q":"Một bảo tàng muốn thu hút giới trẻ bằng hình thức tham quan trực tuyến các hiện vật. Theo SGK, đây là ví dụ về sự kết hợp giữa sử học với lĩnh vực nào?","type":"mcq"},{"answer":["T","T","F","T"],"explain":"a), b), d) Đúng theo SGK. c) Sai: sử học phối hợp thông tin, phương pháp của NHIỀU ngành khoa học khác nhau chứ không chỉ một ngành.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sử học là ngành khoa học nghiên cứu toàn bộ đời sống loài người trong quá khứ.","b) Tính liên ngành là đặc trưng quan trọng của sử học.","c) Sử học chỉ phối hợp với duy nhất một ngành khoa học khác.","d) Nhờ tính liên ngành, việc nghiên cứu lịch sử ngày càng toàn diện và khoa học."],"type":"truefalse"},{"answer":["T","F","T","T"],"explain":"a), c), d) Đúng theo SGK. b) Sai: niên đại di vật được xác định bằng phương pháp C14 của hóa học, không phải bằng văn học.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Công cụ đá ở An Khê (Gia Lai) cho thấy mối liên hệ giữa lịch sử và khảo cổ học.","b) Niên đại di vật khảo cổ được xác định bằng các tác phẩm văn học.","c) Nhà sàn người Mường (Phú Thọ) cho thấy mối liên hệ giữa lịch sử và dân tộc học.","d) Hoàng thành Thăng Long là ví dụ về nghiên cứu cần phối hợp nhiều ngành khoa học."],"type":"truefalse"},{"answer":"Ngô gia văn phái","explain":"\"Hoàng Lê nhất thống chí\" là tác phẩm của Ngô gia văn phái, phản ánh xã hội Đàng Ngoài cuối thế kỉ XVIII.","level":"VD","points":0.5,"q":"Tác phẩm \"Hoàng Lê nhất thống chí\" — ví dụ về mối liên hệ giữa sử học và văn học — là của nhóm tác giả nào?","type":"short"},{"answer":"Ai Cập","explain":"Năm 1822, Champollion giải mã chữ tượng hình Ai Cập nhờ phiến đá Rosetta (tìm thấy năm 1799).","level":"VDC","points":0.5,"q":"Năm 1822, Champollion đã giải mã thành công chữ tượng hình của nền văn minh cổ đại nào?","type":"short"}]},{"name":"Đề 7","questions":[{"answer":"A","explain":"Sử học là ngành khoa học nghiên cứu toàn bộ đời sống loài người trong quá khứ.","level":"NB","options":["A. Toàn bộ đời sống loài người trong quá khứ.","B. Chỉ các triều đại phong kiến.","C. Chỉ các cuộc cách mạng khoa học.","D. Chỉ lịch sử các cuộc chiến tranh."],"points":0.25,"q":"Đối tượng nghiên cứu của sử học là gì?","type":"mcq"},{"answer":"A","explain":"Các ngành khoa học xã hội và nhân văn hỗ trợ đắc lực cho việc tìm hiểu, phục dựng quá khứ.","level":"NB","options":["A. Hỗ trợ đắc lực cho việc tìm hiểu, phục dựng quá khứ.","B. Quyết định mọi kết luận của sử học.","C. Thay thế hoàn toàn phương pháp sử học.","D. Không có vai trò gì với sử học."],"points":0.25,"q":"Vai trò của các ngành khoa học xã hội và nhân văn đối với sử học là gì?","type":"mcq"},{"answer":"A","explain":"Lịch sử giúp các nhà khoa học đi sau không lặp lại sai lầm của người đi trước, kế thừa tri thức, kinh nghiệm của người đi trước.","level":"NB","options":["A. Giúp người đi sau tránh lặp lại sai lầm, kế thừa tri thức của người đi trước.","B. Quyết định mọi phát minh khoa học trong tương lai.","C. Thay thế vai trò của phòng thí nghiệm.","D. Làm chậm sự phát triển của khoa học."],"points":0.25,"q":"Sử học có vai trò nào sau đây đối với các nhà khoa học tự nhiên và công nghệ?","type":"mcq"},{"answer":"B","explain":"GIS là hệ thống thông tin địa lí — công cụ của địa lí học, hỗ trợ vẽ bản đồ, lược đồ phân bố di chỉ.","level":"TH","options":["A. Hóa học.","B. Địa lí học.","C. Văn học.","D. Toán học."],"points":0.25,"q":"Hệ thống thông tin địa lí (GIS) hỗ trợ vẽ lược đồ di chỉ khảo cổ là công cụ của ngành nào?","type":"mcq"},{"answer":"A","explain":"Muốn giải mã, đối chiếu văn bản Hán – Nôm cổ, nhà nghiên cứu cần đến tri thức ngôn ngữ học và văn học.","level":"TH","options":["A. Ngôn ngữ học và văn học.","B. Hóa học và vật lí.","C. Toán học và tin học.","D. Sinh học và địa lí."],"points":0.25,"q":"Một nhà nghiên cứu muốn giải mã các văn bản Hán – Nôm cổ để tìm hiểu lịch sử. Ông cần đến sự hỗ trợ của ngành nào?","type":"mcq"},{"answer":"C","explain":"Lịch sử nghiên cứu quá trình phát triển của khoa học – công nghệ: bối cảnh ra đời, điều kiện lịch sử, ý nghĩa với xã hội của mỗi phát minh.","level":"VD","options":["A. Cấu tạo kĩ thuật của từng phát minh.","B. Công thức khoa học đằng sau phát minh.","C. Bối cảnh ra đời, điều kiện lịch sử và ý nghĩa xã hội của phát minh.","D. Giá trị thương mại của phát minh."],"points":0.25,"q":"Khi nghiên cứu lịch sử một phát minh khoa học, nhà sử học quan tâm chủ yếu đến khía cạnh nào?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: mối quan hệ là hai chiều — sử học vừa cung cấp chất liệu, vừa tiếp nhận tri thức, phương pháp từ các ngành khác.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lịch sử đời sống xã hội là chất liệu, nguồn cảm hứng của các công trình khoa học xã hội và nhân văn.","b) Sử học sử dụng tri thức các ngành để phục dựng, giải thích, khái quát và rút ra quy luật lịch sử.","c) Khoa học tự nhiên và công nghệ cung cấp công cụ hiện đại cho nghiên cứu lịch sử.","d) Mối quan hệ giữa sử học và các ngành khoa học là một chiều, chỉ các ngành khác hỗ trợ sử học."],"type":"truefalse"},{"answer":["T","T","F","T"],"explain":"a), b), d) Đúng theo SGK. c) Sai: văn học và sử học gắn bó mật thiết — tác phẩm văn học lấy chất liệu từ lịch sử và cần bối cảnh lịch sử để hiểu đúng.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phương pháp C14 giúp xác định niên đại các mẫu di vật hữu cơ.","b) Công nghệ thực tế ảo giúp xây dựng bảo tàng ảo 3D trưng bày hiện vật.","c) Văn học hoàn toàn tách biệt với sử học.","d) Địa lí học giúp xác định vị trí, vẽ lược đồ phân bố các di chỉ."],"type":"truefalse"},{"answer":"các-bon","explain":"C14 là đồng vị phóng xạ của nguyên tố các-bon, được hóa học dùng để xác định niên đại di vật khảo cổ.","level":"VD","points":0.5,"q":"Phương pháp C14 xác định niên đại di vật dựa trên đồng vị phóng xạ của nguyên tố nào?","type":"short"},{"answer":"1799","explain":"Phiến đá Rosetta được tìm thấy năm 1799; đến năm 1822, Champollion giải mã thành công chữ tượng hình Ai Cập.","level":"VDC","points":0.5,"q":"Phiến đá Rosetta — chìa khóa giải mã chữ tượng hình Ai Cập — được tìm thấy vào năm nào?","type":"short"}]},{"name":"Đề 8","questions":[{"answer":"A","explain":"Sử học nghiên cứu toàn bộ đời sống loài người trong quá khứ nên đối tượng rộng lớn, phức tạp, đòi hỏi phối hợp nhiều ngành khoa học.","level":"NB","options":["A. Đối tượng nghiên cứu rộng lớn, phức tạp.","B. Đối tượng nghiên cứu quá hẹp.","C. Không có phương pháp nghiên cứu riêng.","D. Chỉ nghiên cứu một giai đoạn lịch sử."],"points":0.25,"q":"Nguyên nhân sâu xa khiến sử học mang tính liên ngành là gì?","type":"mcq"},{"answer":"A","explain":"Lịch sử đời sống xã hội là chất liệu, nguồn cảm hứng đưa đến sự ra đời của các công trình, tác phẩm thuộc các ngành khoa học xã hội và nhân văn.","level":"NB","options":["A. Chất liệu và nguồn cảm hứng sáng tác.","B. Phương pháp nghiên cứu duy nhất.","C. Nguồn tài trợ cho các công trình.","D. Tiêu chuẩn đánh giá duy nhất."],"points":0.25,"q":"Lịch sử đời sống xã hội là gì đối với các ngành khoa học xã hội và nhân văn?","type":"mcq"},{"answer":"A","explain":"Các ngành khoa học tự nhiên và công nghệ cung cấp cho sử học phương pháp, công cụ, kĩ thuật hiện đại.","level":"NB","options":["A. Phương pháp, công cụ, kĩ thuật hiện đại.","B. Toàn bộ nội dung nghiên cứu.","C. Hệ thống lí luận duy nhất.","D. Đối tượng nghiên cứu duy nhất."],"points":0.25,"q":"Sử học tiếp nhận điều gì từ các ngành khoa học tự nhiên và công nghệ?","type":"mcq"},{"answer":"C","explain":"Muốn lí giải nguyên nhân sâu xa của khởi nghĩa nông dân cần đến tri thức kinh tế học, xã hội học về đời sống nhân dân, mâu thuẫn xã hội.","level":"TH","options":["A. Hóa học và sinh học.","B. Toán học và vật lí.","C. Kinh tế học và xã hội học.","D. Thiên văn học và địa chất học."],"points":0.25,"q":"Để lí giải nguyên nhân sâu xa của các cuộc khởi nghĩa nông dân trong lịch sử, nhà sử học cần đến tri thức của ngành nào?","type":"mcq"},{"answer":"B","explain":"Bảo tàng ảo 3D trưng bày hiện vật lịch sử là ví dụ SGK về sự kết hợp giữa lịch sử và công nghệ (số hóa, thực tế ảo).","level":"TH","options":["A. Văn học.","B. Công nghệ.","C. Toán học.","D. Triết học."],"points":0.25,"q":"Bảo tàng ảo 3D trưng bày các hiện vật lịch sử thể hiện mối liên hệ giữa sử học với lĩnh vực nào?","type":"mcq"},{"answer":"A","explain":"Nhờ phương pháp C14 của hóa học, niên đại di vật được xác định chính xác, giúp nhận thức lịch sử chính xác, đầy đủ, sâu sắc hơn — giá trị của nghiên cứu liên ngành.","level":"VD","options":["A. Nhờ hóa học (C14), niên đại di vật được xác định chính xác, giúp nhận thức lịch sử sâu sắc hơn.","B. Nhờ văn học, di vật trở thành tác phẩm nghệ thuật.","C. Nhờ toán học, di vật được đếm chính xác số lượng.","D. Nhờ triết học, di vật có thêm ý nghĩa trừu tượng."],"points":0.25,"q":"Việc xác định được niên đại chính xác của các di vật khảo cổ chứng tỏ giá trị nào của nghiên cứu liên ngành?","type":"mcq"},{"answer":["T","F","T","T"],"explain":"a), c), d) Đúng theo SGK. b) Sai: \"Hoàng Lê nhất thống chí\" là ví dụ về mối liên hệ giữa lịch sử và văn học, không phải hóa học.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sử học phối hợp thông tin, phương pháp của nhiều ngành để nghiên cứu quá khứ toàn diện, khoa học.","b) \"Hoàng Lê nhất thống chí\" là ví dụ về mối liên hệ giữa lịch sử và hóa học.","c) Sinh học (ADN cổ) giúp truy tìm nguồn gốc, di cư của các tộc người.","d) Lịch sử các trận dịch trong quá khứ giúp y học hiện đại phòng chống dịch bệnh."],"type":"truefalse"},{"answer":["F","T","T","T"],"explain":"b), c), d) Đúng theo SGK. a) Sai: ngược lại — lịch sử đời sống xã hội là chất liệu, nguồn cảm hứng cho các công trình khoa học xã hội và nhân văn.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Các ngành khoa học xã hội và nhân văn hoàn toàn không cần đến tri thức lịch sử.","b) Tri thức các ngành khoa học xã hội và nhân văn giúp sử học phục dựng quá khứ chính xác hơn.","c) Địa lí học hỗ trợ sử học qua bản đồ, GIS và hệ thống định vị.","d) Công nghệ giúp số hóa tư liệu và quảng bá di sản lịch sử đến công chúng."],"type":"truefalse"},{"answer":"1428","explain":"\"Bình Ngô đại cáo\" được Nguyễn Trãi thay lời Lê Lợi công bố năm 1428 sau thắng lợi kháng chiến chống quân Minh.","level":"TH","points":0.5,"q":"\"Bình Ngô đại cáo\" — áng thiên cổ hùng văn của Nguyễn Trãi — được công bố vào năm nào?","type":"short"},{"answer":"Nguyễn Trãi","explain":"Nguyễn Trãi là tác giả \"Bình Ngô đại cáo\" (1428), ví dụ tiêu biểu về mối liên hệ giữa sử học và văn học.","level":"VDC","points":0.5,"q":"Ai là tác giả của \"Bình Ngô đại cáo\" — tác phẩm được SGK nêu làm ví dụ về mối liên hệ giữa sử học và văn học?","type":"short"}]},{"name":"Đề 9","questions":[{"answer":"A","explain":"Sử học là ngành khoa học nghiên cứu toàn bộ đời sống của loài người trong quá khứ.","level":"NB","options":["A. Toàn bộ đời sống của loài người trong quá khứ.","B. Chỉ lịch sử các triều đại vua chúa.","C. Chỉ lịch sử chiến tranh và quân sự.","D. Chỉ lịch sử văn hóa nghệ thuật."],"points":0.25,"q":"Sử học nghiên cứu quá khứ của đối tượng nào sau đây?","type":"mcq"},{"answer":"B","explain":"Xác định niên đại di vật bằng phương pháp đồng vị phóng xạ các-bon C14 là ví dụ về sự kết hợp giữa sử học và hóa học.","level":"NB","options":["A. Vẽ lược đồ phân bố di chỉ.","B. Xác định niên đại di vật bằng C14.","C. Sáng tác \"Bình Ngô đại cáo\".","D. Thống kê ruộng đất thời Nguyễn."],"points":0.25,"q":"Ví dụ nào sau đây thể hiện mối liên hệ giữa sử học với hóa học?","type":"mcq"},{"answer":"A","explain":"Lược đồ nơi tìm thấy dấu tích người nguyên thủy ở Đông Nam Á cần đến bản đồ, hệ thống định vị của địa lí học.","level":"NB","options":["A. Lược đồ nơi tìm thấy dấu tích người nguyên thủy ở Đông Nam Á.","B. Xác định niên đại di vật bằng C14.","C. Sáng tác \"Hoàng Lê nhất thống chí\".","D. Xây dựng bảo tàng ảo 3D."],"points":0.25,"q":"Ví dụ nào sau đây thể hiện mối liên hệ giữa sử học với địa lí học?","type":"mcq"},{"answer":"A","explain":"Không một tác phẩm văn học, nghệ thuật nào thoát li khỏi bối cảnh xuất hiện của nó với những nhân vật, sự kiện cụ thể của thời đại.","level":"TH","options":["A. Vì không tác phẩm nào thoát li khỏi bối cảnh lịch sử của thời đại nó ra đời.","B. Vì tác phẩm văn học nào cũng viết về vua chúa.","C. Vì lịch sử quyết định mọi chi tiết trong tác phẩm.","D. Vì tác phẩm văn học không có giá trị độc lập."],"points":0.25,"q":"Vì sao muốn hiểu sâu sắc một tác phẩm văn học cần đặt nó trong bối cảnh lịch sử?","type":"mcq"},{"answer":"C","explain":"Công nghệ số hóa, thực tế ảo giúp xây dựng bảo tàng ảo 3D, đưa hiện vật lịch sử đến gần công chúng qua tham quan trực tuyến.","level":"TH","options":["A. Sáng tác thêm hiện vật mới.","B. Thay thế hoàn toàn bảo tàng thật.","C. Trưng bày hiện vật trực tuyến qua bảo tàng ảo 3D.","D. Định giá các hiện vật cổ."],"points":0.25,"q":"Công nghệ thực tế ảo giúp các bảo tàng lịch sử làm được điều nào sau đây?","type":"mcq"},{"answer":"B","explain":"Bảng thống kê tỉ lệ ruộng đất công – tư dưới thời Nguyễn cần đến phương pháp thống kê, tính toán của toán học.","level":"VD","options":["A. Sáng tác thơ văn về ruộng đất.","B. Thống kê số liệu, lập bảng tỉ lệ ruộng đất.","C. Xác định niên đại của ruộng đất.","D. Vẽ tranh về cảnh đồng ruộng."],"points":0.25,"q":"Một nhà sử học muốn làm rõ tình hình ruộng đất dưới thời Nguyễn qua các con số cụ thể. Ông cần đến tri thức của ngành nào?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: sử học và các ngành khoa học có quan hệ hai chiều, hỗ trợ lẫn nhau.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sử học là bộ môn khoa học có tính liên ngành.","b) Lịch sử đời sống xã hội là chất liệu, nguồn cảm hứng của các công trình khoa học xã hội và nhân văn.","c) Tri thức các ngành giúp nhận thức lịch sử chính xác, đầy đủ, sâu sắc hơn.","d) Chỉ có sử học hỗ trợ các ngành khác, các ngành khác không hỗ trợ sử học."],"type":"truefalse"},{"answer":["T","F","T","T"],"explain":"a), c), d) Đúng theo SGK. b) Sai: công nghệ (bảo tàng ảo 3D) có vai trò quan trọng trong nghiên cứu và quảng bá lịch sử.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hóa học giúp xác định niên đại di vật khảo cổ bằng phương pháp C14.","b) Công nghệ không liên quan gì đến việc nghiên cứu lịch sử.","c) Văn học lấy chất liệu từ hiện thực lịch sử của thời đại.","d) Sử học giúp nhà khoa học đi sau kế thừa kinh nghiệm, tránh lặp lại sai lầm."],"type":"truefalse"},{"answer":"18","explain":"\"Hoàng Lê nhất thống chí\" của Ngô gia văn phái phản ánh xã hội Đàng Ngoài cuối thế kỉ XVIII (thế kỉ 18).","level":"VD","points":0.5,"q":"Tác phẩm \"Hoàng Lê nhất thống chí\" phản ánh xã hội Đàng Ngoài vào cuối thế kỉ bao nhiêu (ghi bằng chữ số)?","type":"short"},{"answer":"1949","explain":"Willard Libby phát minh phương pháp hẹn giờ bằng các-bon phóng xạ (C14) năm 1949.","level":"VDC","points":0.5,"q":"Phương pháp xác định niên đại bằng đồng vị phóng xạ các-bon C14 được phát minh vào năm nào?","type":"short"}]},{"name":"Đề 10","questions":[{"answer":"A","explain":"Sử học phải phối hợp sử dụng thông tin và phương pháp của nhiều ngành khoa học khác nhau để nghiên cứu quá khứ toàn diện, khoa học — đó là tính liên ngành.","level":"NB","options":["A. Phối hợp thông tin và phương pháp của nhiều ngành khoa học khác nhau.","B. Chỉ sử dụng một phương pháp duy nhất.","C. Không cần đến bất kì ngành khoa học nào.","D. Chỉ nghiên cứu trong phạm vi một ngành hẹp."],"points":0.25,"q":"Tính liên ngành của sử học thể hiện ở điểm nào sau đây?","type":"mcq"},{"answer":"A","explain":"Tri thức lịch sử là tấm gương phản chiếu giá trị của các công trình, tác phẩm thuộc ngành khoa học xã hội và nhân văn với cuộc sống.","level":"NB","options":["A. Các công trình, tác phẩm thuộc ngành khoa học xã hội và nhân văn.","B. Các định luật của khoa học tự nhiên.","C. Các công thức toán học.","D. Các phần mềm công nghệ."],"points":0.25,"q":"Tri thức lịch sử là \"tấm gương\" phản chiếu giá trị của đối tượng nào với cuộc sống?","type":"mcq"},{"answer":"A","explain":"Khoa học tự nhiên và công nghệ cũng là đối tượng nghiên cứu của lịch sử khi xem xét ở góc độ lịch sử.","level":"NB","options":["A. Cũng là đối tượng nghiên cứu của lịch sử ở góc độ lịch sử.","B. Hoàn toàn tách biệt với lịch sử.","C. Không có quá trình hình thành và phát triển.","D. Chỉ thuộc về hiện tại, không có quá khứ."],"points":0.25,"q":"Khoa học tự nhiên và công nghệ có mối liên hệ nào sau đây với sử học?","type":"mcq"},{"answer":"B","explain":"Khảo cổ học nghiên cứu quá khứ thông qua các di tích, di vật vật chất như công cụ đá, đồ gốm, phế tích kiến trúc.","level":"TH","options":["A. Các tác phẩm văn học.","B. Các di tích, di vật vật chất.","C. Các con số thống kê.","D. Các bản đồ địa lí."],"points":0.25,"q":"Khảo cổ học giúp sử học nghiên cứu quá khứ thông qua nguồn tư liệu nào?","type":"mcq"},{"answer":"A","explain":"Dân tộc học nghiên cứu đời sống vật chất, tinh thần của các tộc người; nhà sàn người Mường là tư liệu dân tộc học quý về cư dân Việt cổ.","level":"TH","options":["A. Đời sống vật chất, tinh thần của các tộc người.","B. Thành phần hóa học của đất đai.","C. Cấu trúc địa chất của lãnh thổ.","D. Quỹ đạo chuyển động của các hành tinh."],"points":0.25,"q":"Dân tộc học hỗ trợ sử học tìm hiểu về vấn đề nào sau đây?","type":"mcq"},{"answer":"C","explain":"\"Bình Ngô đại cáo\" (1428) tổng kết thắng lợi của cuộc kháng chiến chống quân Minh; chỉ khi biết bối cảnh này mới hiểu đúng giá trị tác phẩm.","level":"VD","options":["A. Tiểu sử chi tiết của Nguyễn Trãi.","B. Thể loại văn học của tác phẩm.","C. Bối cảnh thắng lợi của cuộc kháng chiến chống quân Minh.","D. Số lượng bản in của tác phẩm."],"points":0.25,"q":"Để hiểu đúng giá trị của \"Bình Ngô đại cáo\", điều quan trọng nhất người đọc cần biết là gì?","type":"mcq"},{"answer":["T","T","F","T"],"explain":"a), b), d) Đúng theo SGK. c) Sai: bảo tàng ảo 3D là ví dụ về mối liên hệ giữa lịch sử và công nghệ, không phải toán học.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sử học nghiên cứu toàn bộ đời sống loài người trong quá khứ.","b) Các ngành khoa học xã hội và nhân văn hỗ trợ sử học phục dựng quá khứ.","c) Bảo tàng ảo 3D là ví dụ về mối liên hệ giữa lịch sử và toán học.","d) Phương pháp C14 giúp xác định niên đại di vật khảo cổ."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: sử học có tính liên ngành, luôn cần phối hợp tri thức, phương pháp của nhiều ngành khoa học.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lịch sử là chất liệu, nguồn cảm hứng của các công trình khoa học xã hội và nhân văn.","b) Công nghệ số hóa giúp quảng bá di sản lịch sử đến công chúng.","c) Địa lí học giúp vẽ lược đồ phân bố các di chỉ khảo cổ.","d) Sử học là ngành khép kín, không cần liên hệ với ngành khoa học nào."],"type":"truefalse"},{"answer":"Đông Nam Á","explain":"Theo SGK, lược đồ nơi tìm thấy dấu tích của người nguyên thủy ở Đông Nam Á là ví dụ về sự kết hợp giữa lịch sử và địa lí học.","level":"VD","points":0.5,"q":"Lược đồ nơi tìm thấy dấu tích của người nguyên thủy ở khu vực nào được SGK nêu làm ví dụ về sự kết hợp giữa sử học và địa lí học?","type":"short"},{"answer":"Gia Lai","explain":"Theo SGK, công cụ đá ghè đẽo một mặt và rìu tay được tìm thấy ở Gò Đá, An Khê, tỉnh Gia Lai.","level":"VDC","points":0.5,"q":"Di chỉ Gò Đá (An Khê) với công cụ đá của người nguyên thủy thuộc tỉnh nào?","type":"short"}]}]}
