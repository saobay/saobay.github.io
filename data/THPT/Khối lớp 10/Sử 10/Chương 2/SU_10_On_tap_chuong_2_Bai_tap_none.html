ng tác thêm nhiều tác phẩm văn học.", "C. Chế tạo các công cụ nghiên cứu.", "D. Xây dựng lí luận cho khoa học tự nhiên."], "points": 0.25, "q": "Sử học sử dụng tri thức của các ngành khoa học xã hội và nhân văn để làm gì?", "type": "mcq"}, {"answer": "A", "explain": "Công nghệ số hóa, thực tế ảo giúp xây dựng bảo tàng ảo 3D trưng bày hiện vật lịch sử, phục vụ nghiên cứu và quảng bá.", "level": "NB", "options": ["A. Số hóa tư liệu, xây dựng bảo tàng ảo 3D.", "B. Sáng tác các tác phẩm văn học.", "C. Xác định niên đại bằng C14.", "D. Vẽ bản đồ phân bố di chỉ."], "points": 0.25, "q": "Công nghệ hỗ trợ sử học trong việc nào?", "type": "mcq"}, {"answer": "A", "explain": "Giáo dục lịch sử trong nhà trường góp phần bồi dưỡng lòng yêu nước, ý thức giữ gìn bản sắc văn hóa cho học sinh.", "level": "NB", "options": ["A. Bồi dưỡng lòng yêu nước, giữ gìn bản sắc văn hóa.", "B. Chỉ để học thuộc lòng sự kiện.", "C. Chỉ để thi cử.", "D. Không có vai trò đặc biệt."], "points": 0.25, "q": "Giáo dục lịch sử trong nhà trường có vai trò nào?", "type": "mcq"}, {"answer": "A", "explain": "Sinh học (di truyền học) với kĩ thuật phân tích ADN cổ giúp truy tìm nguồn gốc, quan hệ huyết thống và quá trình di cư của các tộc người.", "level": "TH", "options": ["A. Sinh học.", "B. Hóa học.", "C. Toán học.", "D. Văn học."], "points": 0.25, "q": "Phân tích ADN cổ để truy tìm nguồn gốc các tộc người cho thấy sử học kết hợp với ngành nào?", "type": "mcq"}, {"answer": "A", "explain": "Người làm nghề liên quan đến sử học cần đam mê lịch sử, tư duy phản biện, kĩ năng sưu tầm – phân tích tư liệu, ngoại ngữ và công nghệ.", "level": "TH", "options": ["A. Đam mê lịch sử, tư duy phản biện, kĩ năng nghiên cứu.", "B. Chỉ cần học thuộc lòng.", "C. Chỉ cần ngoại hình đẹp.", "D. Không cần kĩ năng đặc biệt."], "points": 0.25, "q": "Phẩm chất, kĩ năng cần thiết với người làm nghề liên quan đến sử học là gì?", "type": "mcq"}, {"answer": "B", "explain": "Nhà báo có nền tảng lịch sử sẽ bình luận thời sự, giải mã vấn đề thời đại có chiều sâu, tránh phiến diện.", "level": "VD", "options": ["A. Viết tin giật gân câu khách.", "B. Bình luận thời sự có chiều sâu nhờ tri thức lịch sử.", "C. Chỉ đưa tin giải trí.", "D. Sao chép tin nước ngoài."], "points": 0.25, "q": "Vì sao cơ quan báo chí đánh giá cao phóng viên có nền tảng lịch sử vững?", "type": "mcq"}, {"answer": ["T", "F", "T", "T"], "explain": "a), c), d) Đúng theo SGK. b) Sai: \"Hoàng Lê nhất thống chí\" là ví dụ về mối liên hệ giữa lịch sử và văn học, không phải hóa học.", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sử học phối hợp thông tin, phương pháp của nhiều ngành khoa học.", "b) \"Hoàng Lê nhất thống chí\" là ví dụ về mối liên hệ giữa lịch sử và hóa học.", "c) Sinh học (ADN cổ) giúp truy tìm nguồn gốc, di cư của các tộc người.", "d) Lịch sử các trận dịch giúp y học hiện đại phòng chống dịch bệnh."], "type": "truefalse"}, {"answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo SGK: vật lí (niên đại C14), hóa học (phân tích vật liệu), sinh học (ADN cổ) đều hỗ trợ sử học. d) Sai: sử học mang tính liên ngành, cần phối hợp nhiều ngành khoa học tự nhiên.", "level": "VDC", "points": 1, "q": "Về mối quan hệ giữa sử học và các ngành khoa học tự nhiên, xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vật lí học giúp sử học xác định niên đại di vật bằng phương pháp đồng vị phóng xạ.", "b) Hóa học giúp phân tích thành phần vật liệu của hiện vật khảo cổ.", "c) Sinh học hỗ trợ phân tích ADN cổ để tìm hiểu nguồn gốc cư dân xưa.", "d) Sử học hoàn toàn không cần đến tri thức của bất kì ngành khoa học tự nhiên nào."], "type": "truefalse"}, {"answer": "Ngô gia văn phái", "explain": "\"Hoàng Lê nhất thống chí\" là tác phẩm của Ngô gia văn phái, phản ánh xã hội Đàng Ngoài cuối thế kỉ XVIII.", "level": "TH", "points": 0.5, "q": "Tác phẩm \"Hoàng Lê nhất thống chí\" là của nhóm tác giả nào?", "type": "short"}, {"answer": "Sinh học", "explain": "Sinh học, đặc biệt là di truyền học với kĩ thuật phân tích ADN cổ trong di cốt, giúp nhà sử học xác định quan hệ huyết thống, nguồn gốc và quá trình di cư của cư dân xưa.", "level": "VDC", "points": 0.5, "q": "Phương pháp phân tích vật chất di truyền trong di cốt cổ để xác định quan hệ huyết thống và nguồn gốc cư dân xưa thuộc sự hỗ trợ của ngành khoa học nào?", "type": "short"}]}, {"name": "Đề 7", "questions": [{"answer": "A", "explain": "Di tích lịch sử, di sản văn hóa là tài nguyên đặc biệt để phát triển du lịch văn hóa, du lịch tâm linh, du lịch về nguồn.", "level": "NB", "options": ["A. Di tích lịch sử, di sản văn hóa.", "B. Tài nguyên khoáng sản.", "C. Các khu công nghiệp.", "D. Các trung tâm thương mại."], "points": 0.25, "q": "\"Tài nguyên\" đặc biệt để phát triển du lịch văn hóa là gì?", "type": "mcq"}, {"answer": "A", "explain": "Lịch sử đời sống xã hội là chất liệu, nguồn cảm hứng đưa đến sự ra đời của các công trình, tác phẩm thuộc các ngành khoa học xã hội và nhân văn.", "level": "NB", "options": ["A. Là nguồn cảm hứng đưa tới sự ra đời của các công trình khoa học.", "B. Luôn biệt lập với các ngành khoa học xã hội và nhân văn.", "C. Cung cấp toàn diện kiến thức chuyên ngành.", "D. Là cơ sở ra đời của mọi ngành khoa học."], "points": 0.25, "q": "Vai trò của sử học đối với các ngành khoa học xã hội và nhân văn là gì?", "type": "mcq"}, {"answer": "A", "explain": "Học sử giúp hiểu quá khứ để hành động đúng đắn trong hiện tại và định hướng tương lai.", "level": "NB", "options": ["A. Hiểu quá khứ để hành động đúng trong hiện tại, định hướng tương lai.", "B. Chỉ để kể chuyện quá khứ.", "C. Chỉ để thi đỗ đại học.", "D. Không có ý nghĩa thực tiễn."], "points": 0.25, "q": "Ý nghĩa thiết thực nhất của việc học sử ngày nay là gì?", "type": "mcq"}, {"answer": "B", "explain": "Bảo tàng ảo 3D là ví dụ SGK về sự kết hợp giữa lịch sử và công nghệ (số hóa, thực tế ảo).", "level": "TH", "options": ["A. Văn học.", "B. Công nghệ.", "C. Toán học.", "D. Triết học."], "points": 0.25, "q": "Bảo tàng ảo 3D trưng bày hiện vật lịch sử thể hiện mối liên hệ giữa sử học với lĩnh vực nào?", "type": "mcq"}, {"answer": "A", "explain": "Trò chơi điện tử, truyện tranh về đề tài lịch sử giúp giới trẻ tiếp cận lịch sử một cách sinh động, hấp dẫn.", "level": "TH", "options": ["A. Giúp giới trẻ tiếp cận lịch sử sinh động.", "B. Làm giới trẻ chán ghét lịch sử.", "C. Không liên quan đến lịch sử.", "D. Chỉ phục vụ người lớn tuổi."], "points": 0.25, "q": "Trò chơi điện tử, truyện tranh về đề tài lịch sử có tác dụng nào?", "type": "mcq"}, {"answer": "A", "explain": "Nhờ phương pháp C14 của hóa học, niên đại di vật được xác định chính xác, giúp nhận thức lịch sử chính xác, đầy đủ, sâu sắc hơn.", "level": "VD", "options": ["A. Nhờ hóa học (C14), niên đại di vật được xác định chính xác, giúp nhận thức lịch sử sâu sắc hơn.", "B. Nhờ văn học, di vật trở thành tác phẩm nghệ thuật.", "C. Nhờ toán học, di vật được đếm chính xác số lượng.", "D. Nhờ triết học, di vật có thêm ý nghĩa trừu tượng."], "points": 0.25, "q": "Việc xác định chính xác niên đại di vật khảo cổ chứng tỏ giá trị nào của nghiên cứu liên ngành?", "type": "mcq"}, {"answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng theo SGK: sử học khai thác địa lí học, văn học và mang tính liên ngành do đối tượng nghiên cứu rộng lớn, phức tạp. c) Sai: sử học phải phối hợp thông tin, phương pháp của nhiều ngành khoa học.", "level": "VDC", "points": 1, "q": "Về tính liên ngành của sử học, xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Địa lí học cung cấp bản đồ, GIS và GPS giúp xác định vị trí di chỉ khảo cổ.", "b) Tác phẩm văn học phản ánh xã hội đương thời nên là nguồn sử liệu quý của sử học.", "c) Sử học chỉ cần phương pháp của chính mình, không cần đến ngành khoa học nào khác.", "d) Tính liên ngành của sử học xuất phát từ đối tượng nghiên cứu rộng lớn, phức tạp."], "type": "truefalse"}, {"answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng theo SGK. c) Sai: giáo viên dạy sử cần vững chuyên môn, phương pháp sư phạm và khả năng truyền cảm hứng để giáo dục truyền thống cho học sinh.", "level": "VDC", "points": 1, "q": "Về các ngành nghề liên quan đến sử học, xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chuyên viên bảo tàng sưu tầm, bảo quản, nghiên cứu và trưng bày hiện vật.", "b) Hướng dẫn viên du lịch cần tri thức lịch sử để thuyết minh cho du khách.", "c) Giáo viên dạy sử chỉ cần thuộc lòng sự kiện, không cần phương pháp sư phạm.", "d) Nhà báo dùng tri thức lịch sử để viết bài về văn hóa có chiều sâu."], "type": "truefalse"}, {"answer": "18", "explain": "\"Hoàng Lê nhất thống chí\" của Ngô gia văn phái phản ánh xã hội Đàng Ngoài cuối thế kỉ XVIII (thế kỉ 18).", "level": "VD", "points": 0.5, "q": "\"Hoàng Lê nhất thống chí\" phản ánh xã hội Đàng Ngoài vào cuối thế kỉ bao nhiêu (ghi bằng chữ số)?", "type": "short"}, {"answer": "Chuyên viên bảo tàng", "explain": "Chuyên viên bảo tàng là nghề làm công tác sưu tầm, bảo quản, nghiên cứu, trưng bày hiện vật và tổ chức các hoạt động giáo dục lịch sử trong bảo tàng.", "level": "VDC", "points": 0.5, "q": "Người chuyên sưu tầm, bảo quản, nghiên cứu và trưng bày hiện vật trong bảo tàng được gọi là gì?", "type": "short"}]}, {"name": "Đề 8", "questions": [{"answer": "A", "explain": "Vật lí học cung cấp phương pháp xác định niên đại bằng đồng vị phóng xạ (như C14), giúp nhà khảo cổ biết tuổi của di vật hữu cơ như gỗ, than, xương.", "level": "NB", "options": ["A. Vật lí học.", "B. Sinh học.", "C. Thiên văn học.", "D. Y học."], "points": 0.25, "q": "Ngành khoa học tự nhiên nào giúp sử học xác định niên đại di vật khảo cổ bằng phương pháp đồng vị phóng xạ C14?", "type": "mcq"}, {"answer": "A", "explain": "Địa lí học cung cấp bản đồ, hệ thống định vị toàn cầu GPS và hệ thống thông tin địa lí GIS, giúp xác định vị trí và vẽ lược đồ phân bố các di chỉ khảo cổ.", "level": "NB", "options": ["A. Địa lí học.", "B. Hóa học.", "C. Toán học.", "D. Văn học."], "points": 0.25, "q": "Ngành khoa học nào cung cấp bản đồ, hệ thống định vị toàn cầu (GPS) và hệ thống thông tin địa lí (GIS) hỗ trợ sử học xác định vị trí di chỉ khảo cổ?", "type": "mcq"}, {"answer": "A", "explain": "Chuyên viên bảo tàng làm công tác sưu tầm, bảo quản, nghiên cứu, trưng bày hiện vật và tổ chức hoạt động giáo dục trong bảo tàng.", "level": "NB", "options": ["A. Chuyên viên bảo tàng.", "B. Cán bộ lưu trữ.", "C. Hướng dẫn viên du lịch.", "D. Nhà ngoại giao."], "points": 0.25, "q": "Người chuyên sưu tầm, bảo quản, nghiên cứu và trưng bày hiện vật trong bảo tàng được gọi là gì?", "type": "mcq"}, {"answer": "A", "explain": "Học sử rèn kĩ năng đặt câu hỏi, kiểm chứng nguồn tin, phân tích đa chiều — nền tảng của tư duy phản biện, cần cho mọi nghề nghiệp.", "level": "TH", "options": ["A. Đặt câu hỏi, kiểm chứng nguồn tin, phân tích đa chiều.", "B. Học thuộc lòng mọi sự kiện.", "C. Chép lại sách giáo khoa.", "D. Đoán mò đáp án."], "points": 0.25, "q": "Học sử rèn luyện cho người học kĩ năng nào?", "type": "mcq"}, {"answer": "C", "explain": "Sáng tạo nội dung số về lịch sử, du lịch thông minh, quản trị di sản là những nghề mới cần nền tảng tri thức lịch sử vững chắc.", "level": "TH", "options": ["A. Chỉ nghề nông.", "B. Chỉ nghề thủ công.", "C. Sáng tạo nội dung số về lịch sử, du lịch thông minh, quản trị di sản.", "D. Không có nghề mới nào."], "points": 0.25, "q": "Những nghề mới nào cần nền tảng tri thức lịch sử?", "type": "mcq"}, {"answer": "A", "explain": "Lịch sử nghiên cứu bối cảnh ra đời của máy hơi nước (nước Anh cuối thế kỉ XVIII) giúp kĩ sư hiểu điều kiện lịch sử làm nên cách mạng công nghiệp.", "level": "VD", "options": ["A. Bối cảnh lịch sử ra đời của máy hơi nước.", "B. Cấu tạo chi tiết của máy hơi nước.", "C. Công thức vật lí của hơi nước.", "D. Giá thành sản xuất máy hơi nước."], "points": 0.25, "q": "Tìm hiểu lịch sử phát triển của máy hơi nước giúp kĩ sư hiện đại hiểu rõ điều gì?", "type": "mcq"}, {"answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo SGK. d) Sai: sử học có tính liên ngành, luôn cần phối hợp tri thức, phương pháp của nhiều ngành khoa học khác.", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sử học là ngành khoa học nghiên cứu toàn bộ đời sống loài người trong quá khứ.", "b) Tính liên ngành là đặc trưng quan trọng của sử học.", "c) Sử học hiện diện trong nhiều lĩnh vực của đời sống hiện đại.", "d) Sử học hoàn toàn độc lập, không cần ngành khoa học nào khác."], "type": "truefalse"}, {"answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng theo SGK: nghề liên quan đến sử học đòi hỏi đam mê, tư duy phản biện, kĩ năng nghiên cứu, ngoại ngữ, công nghệ thông tin. c) Sai: học sử rèn tư duy phản biện, kĩ năng nghiên cứu rất cần cho công việc.", "level": "VDC", "points": 1, "q": "Về yêu cầu đối với người làm nghề liên quan đến sử học, xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Người làm nghề cần có đam mê lịch sử và tư duy phản biện.", "b) Ngoại ngữ và công nghệ thông tin giúp khai thác tư liệu nước ngoài, số hóa di sản.", "c) Học sử không rèn luyện được kĩ năng nào phục vụ công việc hiện đại.", "d) Kĩ năng nghiên cứu, kiểm chứng nguồn tin là hành trang quý cho nhiều nghề nghiệp."], "type": "truefalse"}, {"answer": "Hướng dẫn viên du lịch", "explain": "Hướng dẫn viên du lịch là nghề cần tri thức lịch sử vững để thuyết minh về di tích, danh lam cho du khách, góp phần phát triển du lịch văn hóa.", "level": "VDC", "points": 0.5, "q": "Người giới thiệu, thuyết minh về di tích lịch sử, danh lam thắng cảnh cho du khách tại điểm tham quan được gọi là gì?", "type": "short"}, {"answer": "Báo chí", "explain": "Báo chí là một trong những nghề hiện đại cần nền tảng lịch sử: nhà báo dùng tri thức lịch sử để viết bài, bình luận thời sự, văn hóa có chiều sâu.", "level": "VDC", "points": 0.5, "q": "Lĩnh vực nghề nghiệp nào ứng dụng tri thức lịch sử để viết bài, bình luận các sự kiện thời sự có chiều sâu văn hóa?", "type": "short"}]}, {"name": "Đề 9", "questions": [{"answer": "A", "explain": "Sử học là ngành khoa học nghiên cứu toàn bộ đời sống của loài người trong quá khứ.", "level": "NB", "options": ["A. Toàn bộ đời sống của loài người trong quá khứ.", "B. Chỉ các triều đại phong kiến.", "C. Chỉ các cuộc cách mạng khoa học.", "D. Chỉ lịch sử các cuộc chiến tranh."], "points": 0.25, "q": "Đối tượng nghiên cứu của sử học là gì?", "type": "mcq"}, {"answer": "A", "explain": "Xác định niên đại di vật bằng phương pháp đồng vị phóng xạ các-bon C14 là ví dụ về sự kết hợp giữa sử học và hóa học.", "level": "NB", "options": ["A. Xác định niên đại di vật bằng C14.", "B. Vẽ lược đồ phân bố di chỉ.", "C. Sáng tác \"Hoàng Lê nhất thống chí\".", "D. Thống kê ruộng đất thời Nguyễn."], "points": 0.25, "q": "Ví dụ nào thể hiện mối liên hệ giữa sử học với hóa học?", "type": "mcq"}, {"answer": "A", "explain": "Quần thể Hoàng thành Thăng Long, Cố đô Huế, Phố cổ Hội An, Thánh địa Mỹ Sơn thu hút hàng triệu lượt khách nhờ giá trị lịch sử – văn hóa.", "level": "NB", "options": ["A. Hoàng thành Thăng Long, Cố đô Huế, Phố cổ Hội An, Thánh địa Mỹ Sơn.", "B. Các khu công nghiệp, nhà máy.", "C. Các trung tâm thương mại.", "D. Các sân vận động."], "points": 0.25, "q": "Những địa danh nào là điểm đến tiêu biểu của du lịch văn hóa Việt Nam?", "type": "mcq"}, {"answer": "A", "explain": "Nghệ thuật (điện ảnh) cần dựa trên tri thức lịch sử chính xác về kiến trúc, trang phục, phong tục thời đại để tái hiện chân thực quá khứ; đó là biểu hiện của mối quan hệ gắn bó giữa sử học và nghệ thuật.", "level": "VDC", "options": ["A. Tham khảo kết quả nghiên cứu lịch sử về kiến trúc, trang phục, phong tục thời Lê sơ để dựng cảnh.", "B. Tự tưởng tượng bối cảnh sao cho đẹp mắt, không cần căn cứ lịch sử.", "C. Sao chép nguyên bối cảnh của một bộ phim cổ trang nước ngoài.", "D. Chỉ cần mời diễn viên nổi tiếng, bối cảnh thế nào cũng được."], "points": 0.25, "q": "Một đoàn làm phim muốn dựng lại bối cảnh kinh thành Thăng Long thế kỉ XV một cách chân thực. Việc làm nào sau đây thể hiện đúng nhất mối quan hệ giữa sử học và nghệ thuật?", "type": "mcq"}, {"answer": "B", "explain": "Học sử giúp kiểm chứng nguồn tin, phân tích đa chiều — kĩ năng cốt lõi để nhận diện tin giả, tin sai sự thật.", "level": "TH", "options": ["A. Tin vào mọi thông tin trên mạng.", "B. Kiểm chứng nguồn tin, phân tích đa chiều.", "C. Chia sẻ tin chưa kiểm chứng.", "D. Bỏ qua mọi nguồn tin."], "points": 0.25, "q": "Trong thời đại bùng nổ tin giả, học sử giúp người học kĩ năng nào?", "type": "mcq"}, {"answer": "A", "explain": "Tri thức lịch sử giúp xây dựng tour tuyến, bài thuyết minh hấp dẫn, làm tăng giá trị trải nghiệm của du khách — yếu tố quyết định thành công của tour văn hóa.", "level": "VD", "options": ["A. Tri thức lịch sử về Cố đô Huế để xây dựng tour tuyến, bài thuyết minh hấp dẫn.", "B. Chỉ cần xe đưa đón hiện đại.", "C. Chỉ cần giảm giá vé tham quan.", "D. Chỉ cần quảng cáo rầm rộ trên mạng."], "points": 0.25, "q": "Một công ty lữ hành muốn mở tour mới về Cố đô Huế. Để tour thành công, điều công ty cần đầu tư nhất là gì?", "type": "mcq"}, {"answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng theo SGK: sử học khai thác kinh tế học, dân tộc học, văn học; đồng thời tri thức lịch sử cũng làm giàu cho văn học, nghệ thuật. c) Sai: tác phẩm văn học phản ánh xã hội đương thời nên là nguồn sử liệu quý.", "level": "VDC", "points": 1, "q": "Về mối quan hệ giữa sử học và các ngành khoa học xã hội, nhân văn, xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kinh tế học giúp sử học phân tích đời sống kinh tế của các thời kì lịch sử.", "b) Dân tộc học giúp sử học hiểu phong tục, tín ngưỡng của các cộng đồng xưa.", "c) Văn học và sử học hoàn toàn tách biệt, không có mối liên hệ nào.", "d) Tri thức lịch sử làm phong phú thêm cho nghiên cứu văn học, nghệ thuật."], "type": "truefalse"}, {"answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo SGK: tri thức lịch sử hiện diện trong du lịch, bảo tồn di sản, công nghiệp văn hóa. d) Sai: ngược lại, tri thức lịch sử gắn bó mật th
