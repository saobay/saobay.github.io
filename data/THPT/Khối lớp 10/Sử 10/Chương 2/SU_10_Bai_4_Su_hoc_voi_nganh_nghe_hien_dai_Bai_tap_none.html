<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"answer":"A","explain":"Các di tích lịch sử, di sản văn hóa là tài nguyên đặc biệt để phát triển du lịch văn hóa, du lịch tâm linh, du lịch về nguồn.","level":"NB","options":["A. Di tích lịch sử, di sản văn hóa.","B. Tài nguyên khoáng sản.","C. Các khu công nghiệp.","D. Các trung tâm thương mại."],"points":0.25,"q":"\"Tài nguyên\" đặc biệt để phát triển du lịch văn hóa, du lịch về nguồn là gì?","type":"mcq"},{"answer":"A","explain":"Tri thức lịch sử giúp xây dựng các tour tuyến, bài thuyết minh hấp dẫn, làm tăng giá trị trải nghiệm của du khách.","level":"NB","options":["A. Xây dựng tour tuyến, bài thuyết minh hấp dẫn.","B. Giảm giá vé tham quan.","C. Xây thêm khách sạn.","D. Quảng cáo trên mạng xã hội."],"points":0.25,"q":"Tri thức lịch sử giúp phát triển du lịch bằng cách nào sau đây?","type":"mcq"},{"answer":"A","explain":"Đề tài lịch sử là nguồn cảm hứng vô tận cho điện ảnh, truyền hình, âm nhạc, trò chơi điện tử, truyện tranh.","level":"NB","options":["A. Điện ảnh, truyền hình, trò chơi điện tử, truyện tranh.","B. Công nghiệp nặng và khai khoáng.","C. Nông nghiệp công nghệ cao.","D. Công nghiệp đóng tàu."],"points":0.25,"q":"Đề tài lịch sử là nguồn cảm hứng cho những lĩnh vực nào của công nghiệp văn hóa?","type":"mcq"},{"answer":"A","explain":"Công tác bảo tồn, trùng tu di tích, sưu tầm hiện vật đều phải dựa trên nghiên cứu lịch sử chính xác.","level":"TH","options":["A. Vì mọi hoạt động bảo tồn, trùng tu đều phải dựa trên nghiên cứu lịch sử chính xác.","B. Vì sử học quyết định kinh phí trùng tu.","C. Vì chỉ nhà sử học mới được trùng tu di tích.","D. Vì di tích nào cũng do nhà sử học xây dựng."],"points":0.25,"q":"Vì sao công tác bảo tồn, trùng tu di tích cần đến tri thức lịch sử?","type":"mcq"},{"answer":"A","explain":"Chuyên viên bảo tàng làm công việc sưu tầm, bảo quản, trưng bày hiện vật — nghề gắn trực tiếp với tri thức lịch sử.","level":"TH","options":["A. Chuyên viên bảo tàng.","B. Kĩ sư xây dựng.","C. Kế toán.","D. Lập trình viên."],"points":0.25,"q":"Nghề nào sau đây gắn trực tiếp với việc sưu tầm, bảo quản và trưng bày hiện vật lịch sử?","type":"mcq"},{"answer":"C","explain":"Báo chí dùng tri thức lịch sử để bình luận thời sự, giải mã các vấn đề thời đại một cách có chiều sâu, tránh cái nhìn phiến diện.","level":"VD","options":["A. Viết tin giật gân câu khách.","B. Sao chép tin tức nước ngoài.","C. Bình luận thời sự, giải mã vấn đề thời đại một cách có chiều sâu.","D. Chỉ đưa tin về giải trí."],"points":0.25,"q":"Một nhà báo có nền tảng lịch sử vững chắc sẽ có lợi thế nào khi bình luận thời sự?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: tri thức lịch sử hiện diện trong nhiều lĩnh vực hiện đại và mở ra nhiều nghề nghiệp.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Di tích lịch sử, di sản văn hóa là tài nguyên để phát triển du lịch văn hóa, du lịch về nguồn.","b) Đề tài lịch sử là nguồn cảm hứng cho điện ảnh, trò chơi điện tử, truyện tranh.","c) Bảo tồn, trùng tu di tích phải dựa trên nghiên cứu lịch sử chính xác.","d) Học lịch sử chỉ có thể làm giáo viên, không có nghề nghiệp nào khác."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo bảng nghề nghiệp SGK. d) Sai: cán bộ lưu trữ quản lí, khai thác tài liệu lưu trữ tại các trung tâm lưu trữ, cơ quan nhà nước.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về các ngành nghề liên quan đến sử học:","statements":["a) Nhà nghiên cứu lịch sử công bố các công trình về vấn đề lịch sử.","b) Hướng dẫn viên du lịch thuyết minh về di tích, di sản cho du khách.","c) Chuyên viên bảo tàng sưu tầm, bảo quản, trưng bày hiện vật.","d) Cán bộ lưu trữ chỉ làm việc tại các công ty du lịch."],"type":"truefalse"},{"answer":"Dinh Độc Lập","explain":"Các tour về nguồn thường đến Địa đạo Củ Chi, Dinh Độc Lập, Nghĩa trang Trường Sơn để giáo dục truyền thống yêu nước.","level":"VD","points":0.5,"q":"Di tích nào ở Thành phố Hồ Chí Minh thường có trong các tour du lịch \"về nguồn\" giáo dục truyền thống?","type":"short"},{"answer":"Hồ Chí Minh","explain":"Câu nói \"Dân ta phải biết sử ta, cho tường gốc tích nước nhà Việt Nam\" là của Chủ tịch Hồ Chí Minh.","level":"VDC","points":0.5,"q":"Câu nói \"Dân ta phải biết sử ta, cho tường gốc tích nước nhà Việt Nam\" là của ai?","type":"short"}]},{"name":"Đề 2","questions":[{"answer":"A","explain":"Các tour về nguồn như thăm Địa đạo Củ Chi, Dinh Độc Lập, Nghĩa trang Trường Sơn giáo dục truyền thống yêu nước cho thế hệ trẻ.","level":"NB","options":["A. Giáo dục truyền thống yêu nước cho thế hệ trẻ.","B. Chỉ để giải trí đơn thuần.","C. Chỉ để mua sắm.","D. Chỉ để nghỉ dưỡng."],"points":0.25,"q":"Các tour du lịch \"về nguồn\" thăm di tích cách mạng có ý nghĩa nào sau đây?","type":"mcq"},{"answer":"A","explain":"Giáo dục lịch sử trong nhà trường góp phần bồi dưỡng lòng yêu nước, ý thức giữ gìn bản sắc văn hóa cho học sinh.","level":"NB","options":["A. Bồi dưỡng lòng yêu nước, ý thức giữ gìn bản sắc văn hóa.","B. Chỉ để học thuộc lòng sự kiện.","C. Chỉ để thi cử.","D. Không có vai trò gì đặc biệt."],"points":0.25,"q":"Giáo dục lịch sử trong nhà trường có vai trò nào sau đây?","type":"mcq"},{"answer":"A","explain":"Nhà báo, biên tập viên viết về đề tài lịch sử, văn hóa tại các báo, đài, nhà xuất bản — nghề cần nền tảng lịch sử.","level":"NB","options":["A. Nhà báo, biên tập viên.","B. Phi công.","C. Thủy thủ.","D. Kiến trúc sư."],"points":0.25,"q":"Nghề nào sau đây cần nền tảng tri thức lịch sử để viết về đề tài lịch sử, văn hóa?","type":"mcq"},{"answer":"A","explain":"Cán bộ lưu trữ quản lí, khai thác tài liệu lưu trữ tại trung tâm lưu trữ quốc gia, cơ quan nhà nước — công việc đòi hỏi hiểu biết lịch sử.","level":"TH","options":["A. Quản lí, khai thác tài liệu lưu trữ.","B. Lái xe cho cơ quan.","C. Bảo vệ kho hàng.","D. Nấu ăn cho cán bộ."],"points":0.25,"q":"Công việc chính của cán bộ lưu trữ là gì?","type":"mcq"},{"answer":"A","explain":"Người làm nghề liên quan đến sử học cần đam mê lịch sử, tư duy phản biện, kĩ năng sưu tầm – phân tích tư liệu, cùng ngoại ngữ và công nghệ.","level":"TH","options":["A. Đam mê lịch sử, tư duy phản biện, kĩ năng sưu tầm – phân tích tư liệu.","B. Chỉ cần học thuộc lòng.","C. Chỉ cần ngoại hình đẹp.","D. Không cần kĩ năng gì đặc biệt."],"points":0.25,"q":"Phẩm chất, kĩ năng nào sau đây cần thiết với người làm nghề liên quan đến sử học?","type":"mcq"},{"answer":"B","explain":"Chuyên gia di sản, ngoại giao văn hóa tư vấn bảo tồn và quảng bá văn hóa dân tộc ra thế giới — vai trò của tri thức lịch sử trong đối ngoại.","level":"VD","options":["A. Chỉ dịch tài liệu.","B. Tư vấn bảo tồn di sản, quảng bá văn hóa dân tộc ra thế giới.","C. Chỉ tổ chức lễ hội ẩm thực.","D. Chỉ đón tiếp khách du lịch."],"points":0.25,"q":"Trong hoạt động đối ngoại, tri thức lịch sử giúp Việt Nam làm được điều nào sau đây?","type":"mcq"},{"answer":["T","T","F","T"],"explain":"a), b), d) Đúng theo SGK. c) Sai: nghề liên quan đến sử học rất đa dạng: nghiên cứu, giảng dạy, du lịch, bảo tàng, lưu trữ, báo chí, ngoại giao văn hóa.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tri thức lịch sử giúp xây dựng tour tuyến, bài thuyết minh du lịch hấp dẫn.","b) Phim về Quang Trung, Trần Hưng Đạo vừa giải trí vừa lan tỏa niềm tự hào dân tộc.","c) Học sử chỉ có thể làm giáo viên dạy sử.","d) Giáo dục lịch sử bồi dưỡng lòng yêu nước cho học sinh."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: học sử rèn tư duy phản biện, kĩ năng kiểm chứng nguồn tin, phân tích đa chiều — rất cần cho mọi nghề.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hướng dẫn viên du lịch cần tri thức lịch sử để thuyết minh về di tích.","b) Chuyên gia di sản tư vấn bảo tồn và quảng bá văn hóa dân tộc.","c) Báo chí dùng tri thức lịch sử để bình luận thời sự có chiều sâu.","d) Học sử không rèn luyện được kĩ năng nào cho nghề nghiệp hiện đại."],"type":"truefalse"},{"answer":"Hội An","explain":"Phố cổ Hội An (Quảng Nam) là di sản văn hóa thế giới, điểm đến tiêu biểu của du lịch văn hóa Việt Nam.","level":"TH","points":0.5,"q":"Phố cổ nào ở Quảng Nam là di sản văn hóa thế giới, thu hút đông đảo du khách nhờ giá trị lịch sử?","type":"short"},{"answer":"Mỹ Sơn","explain":"Thánh địa Mỹ Sơn (Quảng Nam) là di sản văn hóa thế giới của vương quốc Champa, điểm đến du lịch văn hóa nổi tiếng.","level":"VDC","points":0.5,"q":"Thánh địa nào ở Quảng Nam là di sản của vương quốc Champa, thu hút khách du lịch tìm hiểu lịch sử?","type":"short"}]},{"name":"Đề 3","questions":[{"answer":"A","explain":"Hướng dẫn viên du lịch thuyết minh về di tích, di sản cho du khách tại các công ty lữ hành, khu di tích — nghề cần tri thức lịch sử.","level":"NB","options":["A. Hướng dẫn viên du lịch.","B. Công nhân may.","C. Nhân viên ngân hàng.","D. Tài xế taxi."],"points":0.25,"q":"Nghề nào sau đây thuyết minh về di tích, di sản cho du khách?","type":"mcq"},{"answer":"A","explain":"Nhà sử học/nghiên cứu lịch sử công bố các công trình nghiên cứu tại viện nghiên cứu, trường đại học.","level":"NB","options":["A. Viện nghiên cứu, trường đại học.","B. Công trường xây dựng.","C. Sàn giao dịch chứng khoán.","D. Cảng biển."],"points":0.25,"q":"Nhà nghiên cứu lịch sử thường làm việc ở đâu?","type":"mcq"},{"answer":"A","explain":"Học sử giúp hiểu quá khứ để hành động đúng đắn trong hiện tại và định hướng tương lai.","level":"NB","options":["A. Hiểu quá khứ để hành động đúng đắn trong hiện tại, định hướng tương lai.","B. Chỉ để kể chuyện quá khứ.","C. Chỉ để thi đỗ đại học.","D. Không có ý nghĩa thực tiễn."],"points":0.25,"q":"Ý nghĩa thiết thực nhất của việc học sử trong thời đại ngày nay là gì?","type":"mcq"},{"answer":"A","explain":"Học sử rèn kĩ năng đặt câu hỏi, kiểm chứng nguồn tin, phân tích đa chiều — nền tảng của tư duy phản biện, cần cho mọi nghề nghiệp.","level":"TH","options":["A. Đặt câu hỏi, kiểm chứng nguồn tin, phân tích đa chiều.","B. Học thuộc lòng mọi sự kiện.","C. Chép lại sách giáo khoa.","D. Đoán mò đáp án."],"points":0.25,"q":"Học sử rèn luyện cho người học kĩ năng nào sau đây?","type":"mcq"},{"answer":"A","explain":"Nhiều ngành nghề mới như sáng tạo nội dung số về lịch sử, du lịch thông minh, quản trị di sản đều cần nền tảng tri thức lịch sử vững chắc.","level":"TH","options":["A. Sáng tạo nội dung số về lịch sử, du lịch thông minh, quản trị di sản.","B. Chỉ các nghề thủ công truyền thống.","C. Chỉ các nghề không cần tri thức.","D. Không có nghề mới nào cần lịch sử."],"points":0.25,"q":"Trong kinh tế tri thức, những ngành nghề mới nào cần nền tảng tri thức lịch sử?","type":"mcq"},{"answer":"C","explain":"Bài thuyết minh tour về nguồn cần tri thức lịch sử về di tích cách mạng (Địa đạo Củ Chi, Dinh Độc Lập...) để giáo dục truyền thống, không chỉ liệt kê địa điểm.","level":"VD","options":["A. Chỉ liệt kê tên các địa điểm.","B. Chỉ báo giá vé tham quan.","C. Tri thức lịch sử về các di tích cách mạng để thuyết minh, giáo dục truyền thống.","D. Chỉ giới thiệu món ăn địa phương."],"points":0.25,"q":"Một hướng dẫn viên xây dựng bài thuyết minh cho tour du lịch \"về nguồn\". Điều quan trọng nhất anh cần chuẩn bị là gì?","type":"mcq"},{"answer":["T","F","T","T"],"explain":"a), c), d) Đúng theo SGK. b) Sai: bảo tồn, trùng tu di tích phải dựa trên nghiên cứu lịch sử chính xác, không thể làm tùy tiện.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Di sản văn hóa là tài nguyên phát triển du lịch văn hóa, tâm linh.","b) Trùng tu di tích có thể làm tùy tiện, không cần nghiên cứu lịch sử.","c) Giáo viên dạy sử giáo dục truyền thống cho học sinh.","d) Học sử bồi đắp lòng yêu nước, ý thức trách nhiệm với cộng đồng."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: học sử rèn tư duy phản biện, kĩ năng nghiên cứu — hành trang cho nhiều nghề nghiệp hiện đại.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phim, game về đề tài lịch sử giúp giới trẻ tiếp cận lịch sử sinh động.","b) Cán bộ lưu trữ quản lí, khai thác tài liệu lưu trữ.","c) Ngoại giao văn hóa cần tri thức lịch sử để quảng bá đất nước.","d) Kiến thức lịch sử không có giá trị gì trong thời đại công nghệ."],"type":"truefalse"},{"answer":"Củ Chi","explain":"Địa đạo Củ Chi (Thành phố Hồ Chí Minh) là di tích cách mạng nổi tiếng, điểm đến của các tour về nguồn.","level":"VD","points":0.5,"q":"Địa đạo nào ở Thành phố Hồ Chí Minh là di tích cách mạng nổi tiếng trong các tour \"về nguồn\"?","type":"short"},{"answer":"Trần Hưng Đạo","explain":"Trần Hưng Đạo (Trần Quốc Tuấn) là anh hùng dân tộc với chiến thắng Bạch Đằng năm 1288, nguồn cảm hứng của nhiều tác phẩm điện ảnh.","level":"VDC","points":0.5,"q":"Vị anh hùng dân tộc nào với chiến thắng Bạch Đằng năm 1288 là nguồn cảm hứng của nhiều bộ phim lịch sử?","type":"short"}]},{"name":"Đề 4","questions":[{"answer":"A","explain":"Quần thể Hoàng thành Thăng Long, Cố đô Huế, Phố cổ Hội An, Thánh địa Mỹ Sơn thu hút hàng triệu lượt khách nhờ giá trị lịch sử – văn hóa.","level":"NB","options":["A. Hoàng thành Thăng Long, Cố đô Huế, Phố cổ Hội An, Thánh địa Mỹ Sơn.","B. Các khu công nghiệp, nhà máy.","C. Các trung tâm thương mại.","D. Các sân vận động."],"points":0.25,"q":"Những địa danh nào sau đây là điểm đến tiêu biểu của du lịch văn hóa Việt Nam?","type":"mcq"},{"answer":"A","explain":"Giáo viên dạy Lịch sử giảng dạy, giáo dục truyền thống cho học sinh tại trường phổ thông, trung tâm giáo dục.","level":"NB","options":["A. Giảng dạy, giáo dục truyền thống cho học sinh.","B. Xây dựng cầu đường.","C. Khám chữa bệnh.","D. Lập trình phần mềm."],"points":0.25,"q":"Công việc chính của giáo viên dạy Lịch sử là gì?","type":"mcq"},{"answer":"A","explain":"Người làm nghề liên quan đến sử học cần ngoại ngữ và công nghệ bên cạnh đam mê lịch sử, tư duy phản biện, kĩ năng nghiên cứu.","level":"NB","options":["A. Ngoại ngữ và công nghệ.","B. Chỉ cần sức khỏe.","C. Chỉ cần ngoại hình.","D. Không cần thêm gì."],"points":0.25,"q":"Ngoài tri thức lịch sử, người làm nghề liên quan đến sử học trong thời đại ngày nay còn cần gì?","type":"mcq"},{"answer":"B","explain":"Phim về Quang Trung, Trần Hưng Đạo, Hai Bà Trưng vừa giải trí vừa lan tỏa niềm tự hào dân tộc — vai trò của sử học với công nghiệp văn hóa.","level":"TH","options":["A. Chỉ để kiếm tiền.","B. Vừa giải trí vừa lan tỏa niềm tự hào dân tộc.","C. Chỉ để quảng cáo du lịch.","D. Không có giá trị gì."],"points":0.25,"q":"Các bộ phim về Quang Trung, Trần Hưng Đạo, Hai Bà Trưng có vai trò nào sau đây?","type":"mcq"},{"answer":"A","explain":"Chuyên gia di sản, ngoại giao văn hóa tư vấn bảo tồn, quảng bá văn hóa dân tộc ra thế giới tại UNESCO, cơ quan văn hóa, ngoại giao.","level":"TH","options":["A. Tư vấn bảo tồn di sản, quảng bá văn hóa dân tộc ra thế giới.","B. Buôn bán đồ cổ.","C. Xây dựng nhà cao tầng.","D. Khai thác khoáng sản."],"points":0.25,"q":"Chuyên gia di sản làm công việc nào sau đây?","type":"mcq"},{"answer":"B","explain":"Nhà báo có nền tảng lịch sử sẽ bình luận thời sự, giải mã vấn đề thời đại có chiều sâu, tránh phiến diện — thay vì chỉ đưa tin giật gân.","level":"VD","options":["A. Viết tin giật gân để câu khách.","B. Bình luận thời sự có chiều sâu nhờ tri thức lịch sử.","C. Chỉ đưa tin giải trí.","D. Sao chép tin nước ngoài."],"points":0.25,"q":"Vì sao các cơ quan báo chí đánh giá cao phóng viên có nền tảng lịch sử vững?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: học sử mở ra nhiều nghề: nghiên cứu, giảng dạy, du lịch, bảo tàng, lưu trữ, báo chí, ngoại giao văn hóa.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sử học hiện diện trong nhiều lĩnh vực của đời sống hiện đại.","b) Du lịch văn hóa góp phần phát triển kinh tế – xã hội.","c) Công nghiệp văn hóa lấy cảm hứng từ đề tài lịch sử.","d) Học giỏi sử thì chỉ có một nghề duy nhất để lựa chọn."],"type":"truefalse"},{"answer":["F","T","T","T"],"explain":"b), c), d) Đúng theo SGK. a) Sai: ngược lại, học sử rèn tư duy phản biện, kĩ năng kiểm chứng nguồn tin — rất cần trong thời đại tin giả.","level":"VDC","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Học sử không giúp ích gì cho việc nhận diện tin giả trên mạng.","b) Nhà nghiên cứu lịch sử công bố công trình tại viện nghiên cứu, trường đại học.","c) Hướng dẫn viên du lịch cần tri thức lịch sử để thuyết minh.","d) Nhiều nghề mới như nội dung số về lịch sử cần nền tảng lịch sử vững."],"type":"truefalse"},{"answer":"Huế","explain":"Quần thể di tích Cố đô Huế (Thừa Thiên Huế) là di sản văn hóa thế giới, điểm đến du lịch văn hóa hàng đầu Việt Nam.","level":"TH","points":0.5,"q":"Quần thể di tích Cố đô nào là di sản văn hóa thế giới, thu hút hàng triệu du khách mỗi năm?","type":"short"},{"answer":"Hai Bà Trưng","explain":"Hai Bà Trưng lãnh đạo cuộc khởi nghĩa năm 40 chống ách đô hộ nhà Hán, là nguồn cảm hứng của nhiều tác phẩm nghệ thuật.","level":"VDC","points":0.5,"q":"Hai nữ anh hùng nào lãnh đạo cuộc khởi nghĩa năm 40 chống ách đô hộ phương Bắc, là nguồn cảm hứng của nhiều bộ phim lịch sử?","type":"short"}]},{"name":"Đề 5","questions":[{"answer":"A","explain":"Du lịch tâm linh, du lịch về nguồn phát triển dựa trên các di tích lịch sử, di sản văn hóa — tài nguyên đặc biệt của du lịch.","level":"NB","options":["A. Di tích lịch sử, di sản văn hóa.","B. Các mỏ khoáng sản.","C. Các nhà máy công nghiệp.","D. Các tòa nhà văn phòng."],"points":0.25,"q":"Du lịch tâm linh, du lịch về nguồn phát triển dựa trên loại tài nguyên nào?","type":"mcq"},{"answer":"A","explain":"Báo chí – truyền thông dùng tri thức lịch sử để bình luận thời sự, giải mã các vấn đề thời đại một cách có chiều sâu.","level":"NB","options":["A. Bình luận thời sự, giải mã các vấn đề thời đại.","B. Chỉ đưa tin thể thao.","C. Chỉ quảng cáo sản phẩm.","D. Chỉ đưa tin giải trí."],"points":0.25,"q":"Báo chí – truyền thông sử dụng tri thức lịch sử để làm gì?","type":"mcq"},{"answer":"A","explain":"Học sử rèn tư duy phản biện, kĩ năng nghiên cứu: đặt câu hỏi, kiểm chứng nguồn tin, phân tích đa chiều.","level":"NB","options":["A. Tư duy phản biện, kĩ năng nghiên cứu.","B. Khả năng học thuộc lòng.","C. Kĩ năng sao chép.","D. Khả năng đoán mò."],"points":0.25,"q":"Học lịch sử rèn luyện cho người học phẩm chất, kĩ năng nào sau đây?","type":"mcq"},{"answer":"A","explain":"Trò chơi điện tử, truyện tranh về đề tài lịch sử giúp giới trẻ tiếp cận lịch sử một cách sinh động, hấp dẫn.","level":"TH","options":["A. Giúp giới trẻ tiếp cận lịch sử một cách sinh động.","B. Làm giới trẻ chán ghét lịch sử.","C. Không liên quan đến lịch sử.","D. Chỉ phục vụ người lớn tuổi."],"points":0.25,"q":"Trò chơi điện tử, truyện tranh về đề tài lịch sử có tác dụng nào sau đây?","type":"mcq"},{"answer":"B","explain":"Cán bộ lưu trữ quản lí, khai thác tài liệu lưu trữ tại trung tâm lưu trữ quốc gia, cơ quan nhà nước.","level":"TH","options":["A. Công ty du lịch.","B. Trung tâm lưu trữ quốc gia, cơ quan nhà nước.","C. Sàn chứng khoán.","D. Bến cảng."],"points":0.25,"q":"Cán bộ lưu trữ thường làm việc ở đâu?","type":"mcq"},{"answer":"A","explain":"Muốn trùng tu đúng với nguyên gốc lịch sử, phải nghiên cứu tài liệu, hiện vật gốc — nếu làm tùy tiện sẽ phá hỏng giá trị di tích.","level":"VD","options":["A. Nghiên cứu tài liệu, hiện vật gốc để trùng tu đúng với nguyên gốc lịch sử.","B. Phá bỏ hoàn toàn để xây mới.","C. Sơn phết tùy ý theo sở thích.","D. Thuê người không chuyên về làm."],"points":0.25,"q":"Một địa phương muốn trùng tu ngôi đình cổ 300 năm tuổi. Việc đầu tiên cần làm theo đúng chuyên môn là gì?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: bảo tồn, trùng tu di tích phải dựa trên nghiên cứu lịch sử chính xác.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tri thức lịch sử giúp xây dựng bài thuyết minh du lịch hấp dẫn.","b) Đề tài lịch sử là nguồn cảm hứng của công nghiệp văn hóa.","c) Giáo dục lịch sử bồi dưỡng lòng yêu nước cho học sinh.","d) Trùng tu di tích không cần đến tri thức lịch sử."],"type":"truefalse"},{"answer":["T","F","T","T"],"explain":"a), c), d) Đúng theo SGK. b) Sai: chuyên viên bảo tàng sưu tầm, bảo quản, trưng bày hiện vật tại bảo tàng, khu di tích.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhà báo cần nền tảng lịch sử để viết về đề tài lịch sử, văn hóa.","b) Chuyên viên bảo tàng chỉ làm việc tại các ngân hàng.","c) Ngoại giao văn hóa cần tri thức lịch sử để quảng bá đất nước.","d) Học sử giúp hiểu quá khứ để hành động đúng trong hiện tại."],"type":"truefalse"},{"answer":"Thăng Long","explain":"Quần thể di tích Trung tâm Hoàng thành Thăng Long (Hà Nội) là di sản văn hóa thế giới, điểm đến du lịch văn hóa tiêu biểu.","level":"VD","points":0.5,"q":"Quần thể di tích Trung tâm Hoàng thành nào ở Hà Nội là di sản văn hóa thế giới?","type":"short"},{"answer":"1288","explain":"Trần Hưng Đạo lãnh đạo quân dân Đại Việt đánh thắng quân Nguyên trên sông Bạch Đằng năm 1288.","level":"VDC","points":0.5,"q":"Chiến thắng Bạch Đằng của Trần Hưng Đạo trước quân Nguyên diễn ra vào năm nào?","type":"short"}]},{"name":"Đề 6","questions":[{"answer":"A","explain":"Các di tích lịch sử, di sản văn hóa là tài nguyên đặc biệt để phát triển du lịch văn hóa, du lịch tâm linh, du lịch về nguồn.","level":"NB","options":["A. Phát triển du lịch văn hóa, tâm linh, về nguồn.","B. Khai thác khoáng sản.","C. Xây dựng khu công nghiệp.","D. Phát triển nông nghiệp."],"points":0.25,"q":"Di tích lịch sử, di sản văn hóa có vai trò nào sau đây trong phát triển kinh tế?","type":"mcq"},{"answer":"A","explain":"Nhà nghiên cứu lịch sử nghiên cứu, công bố công trình về các vấn đề lịch sử tại viện nghiên cứu, trường đại học.","level":"NB","options":["A. Nghiên cứu, công bố công trình về các vấn đề lịch sử.","B. Điều khiển máy móc công nghiệp.","C. Buôn bán bất động sản.","D. Lái máy bay."],"points":0.25,"q":"Công việc chính của nhà nghiên cứu lịch sử là gì?","type":"mcq"},{"answer":"A","explain":"Người làm nghề liên quan đến sử học cần đam mê lịch sử, tư duy phản biện, kĩ năng sưu tầm – phân tích tư liệu, ngoại ngữ và công nghệ.","level":"NB","options":["A. Đam mê lịch sử và kĩ năng nghiên cứu.","B. Chỉ cần bằng cấp cao.","C. Chỉ cần quan hệ rộng.","D. Không cần phẩm chất gì."],"points":0.25,"q":"Yếu tố nào sau đây quan trọng nhất với người theo nghề liên quan đến sử học?","type":"mcq"},{"answer":"B","explain":"Học sử giúp kiểm chứng nguồn tin, phân tích đa chiều — kĩ năng cốt lõi để nhận diện tin giả, tin sai sự thật.","level":"TH","options":["A. Tin vào mọi thông tin trên mạng.","B. Kiểm chứng nguồn tin, phân tích đa chiều.","C. Chia sẻ tin chưa kiểm chứng.","D. Bỏ qua mọi nguồn tin."],"points":0.25,"q":"Trong thời đại bùng nổ tin giả, học sử giúp người học kĩ năng nào sau đây?","type":"mcq"},{"answer":"A","explain":"Chuyên gia di sản tư vấn bảo tồn di sản, quảng bá văn hóa dân tộc ra thế giới tại UNESCO, cơ quan văn hóa, ngoại giao.","level":"TH","options":["A. UNESCO, cơ quan văn hóa, ngoại giao.","B. Mỏ than, mỏ dầu.","C. Công trường xây dựng.","D. Chợ đầu mối."],"points":0.25,"q":"Chuyên gia di sản, ngoại giao văn hóa thường làm việc ở đâu?","type":"mcq"},{"answer":"C","explain":"Bài thuyết minh về Hoàng thành Thăng Long cần tri thức lịch sử về các triều đại, sự kiện gắn với di tích — không thể chỉ đọc tên địa điểm.","level":"VD","options":["A. Chỉ đọc tên các địa điểm.","B. Chỉ kể chuyện cười cho khách.","C. Tri thức lịch sử về các triều đại, sự kiện gắn với Hoàng thành.","D. Chỉ giới thiệu nhà hàng gần đó."],"points":0.25,"q":"Một hướng dẫn viên chuẩn bị bài thuyết minh về Hoàng thành Thăng Long. Nội dung cốt lõi của bài thuyết minh là gì?","type":"mcq"},{"answer":["T","T","F","T"],"explain":"a), b), d) Đúng theo SGK. c) Sai: nghề liên quan đến sử học rất đa dạng, không bó hẹp trong dạy học và nghiên cứu.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sử học hiện diện trong nhiều lĩnh vực của đời sống hiện đại.","b) Du lịch văn hóa góp phần giữ gìn bản sắc văn hóa dân tộc.","c) Học sử chỉ có hai nghề để chọn: dạy học và nghiên cứu.","d) Công nghiệp văn hóa lấy cảm hứng từ đề tài lịch sử."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: học sử rèn tư duy phản biện, kĩ năng nghiên cứu — hành trang quý cho nhiều nghề nghiệp.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bảo tồn di tích phải dựa trên nghiên cứu lịch sử chính xác.","b) Báo chí dùng tri thức lịch sử để bình luận thời sự có chiều sâu.","c) Nhiều nghề mới như nội dung số về lịch sử cần nền tảng lịch sử vững.","d) Học sử không rèn luyện được kĩ năng nào cho công việc."],"type":"truefalse"},{"answer":"Trường Sơn","explain":"Nghĩa trang liệt sĩ Trường Sơn (Quảng Trị) là địa chỉ đỏ trong các tour về nguồn giáo dục truyền thống.","level":"TH","points":0.5,"q":"Nghĩa trang liệt sĩ nào ở Quảng Trị là địa chỉ đỏ trong các tour du lịch \"về nguồn\"?","type":"short"},{"answer":"40","explain":"Hai Bà Trưng phất cờ khởi nghĩa năm 40, lật đổ ách đô hộ của nhà Hán, xưng vương định đô ở Mê Linh.","level":"VDC","points":0.5,"q":"Cuộc khởi nghĩa của Hai Bà Trưng chống ách đô hộ nhà Hán bùng nổ vào năm nào?","type":"short"}]},{"name":"Đề 7","questions":[{"answer":"A","explain":"Tri thức lịch sử giúp xây dựng các tour tuyến, bài thuyết minh hấp dẫn, làm tăng giá trị trải nghiệm của du khách.","level":"NB","options":["A. Tour tuyến, bài thuyết minh hấp dẫn.","B. Giá vé rẻ.","C. Khách sạn sang trọng.","D. Quà lưu niệm đắt tiền."],"points":0.25,"q":"Yếu tố nào sau đây làm tăng giá trị trải nghiệm của du khách khi thăm di tích?","type":"mcq"},{"answer":"A","explain":"Công tác bảo tồn, trùng tu di tích, sưu tầm hiện vật đều phải dựa trên nghiên cứu lịch sử chính xác.","level":"NB","options":["A. Nghiên cứu lịch sử chính xác.","B. Sở thích của nhà đầu tư.","C. Ý kiến của du khách.","D. Phong trào thời thượng."],"points":0.25,"q":"Công tác bảo tồn, trùng tu di tích phải dựa trên cơ sở nào?","type":"mcq"},{"answer":"A","explain":"Giáo dục lịch sử trong nhà trường góp phần bồi dưỡng lòng yêu nước, ý thức giữ gìn bản sắc văn hóa cho học sinh.","level":"NB","options":["A. Lòng yêu nước, ý thức giữ gìn bản sắc văn hóa.","B. Tính vị kỉ cá nhân.","C. Thái độ thờ ơ với đất nước.","D. Tư tưởng sính ngoại."],"points":0.25,"q":"Giáo dục lịch sử trong nhà trường bồi dưỡng cho học sinh phẩm chất nào?","type":"mcq"},{"answer":"A","explain":"Phim về Quang Trung, Trần Hưng Đạo, Hai Bà Trưng vừa giải trí vừa lan tỏa niềm tự hào dân tộc.","level":"TH","options":["A. Vừa giải trí vừa lan tỏa niềm tự hào dân tộc.","B. Chỉ nhằm mục đích thương mại.","C. Làm sai lệch lịch sử.","D. Không có tác dụng giáo dục."],"points":0.25,"q":"Phim lịch sử về các anh hùng dân tộc có tác dụng nào sau đây với khán giả trẻ?","type":"mcq"},{"answer":"B","explain":"Hướng dẫn viên du lịch thuyết minh về di tích, di sản cho du khách — công việc đòi hỏi tri thức lịch sử vững.","level":"TH","options":["A. Kĩ sư cầu đường.","B. Hướng dẫn viên du lịch.","C. Nhân viên ngân hàng.","D. Công nhân vệ sinh."],"points":0.25,"q":"Ai là người trực tiếp truyền tải tri thức lịch sử đến du khách tại các di tích?","type":"mcq"},{"answer":"B","explain":"Quảng bá văn hóa dân tộc ra thế giới (ngoại giao văn hóa) cần tri thức lịch sử sâu sắc về đất nước, con người Việt Nam.","level":"VD","options":["A. Chỉ cần biết ngoại ngữ.","B. Tri thức lịch sử sâu sắc về đất nước, con người Việt Nam.","C. Chỉ cần quan hệ cá nhân.","D. Chỉ cần kinh phí lớn."],"points":0.25,"q":"Một cán bộ ngoại giao được giao nhiệm vụ quảng bá văn hóa Việt Nam ra thế giới. Hành trang quan trọng nhất của anh là gì?","type":"mcq"},{"answer":["F","T","T","T"],"explain":"b), c), d) Đúng theo SGK. a) Sai: ngược lại, tri thức lịch sử hiện diện trong nhiều lĩnh vực hiện đại: du lịch, phim ảnh, báo chí, giáo dục.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tri thức lịch sử chỉ nằm trong sách vở, không liên quan đời sống hiện đại.","b) Di tích lịch sử là tài nguyên phát triển du lịch.","c) Giáo viên dạy sử giáo dục truyền thống cho học sinh.","d) Học sử bồi đắp ý thức trách nhiệm với cộng đồng."],"type":"truefalse"},{"answer":["T","T","F","T"],"explain":"a), b), d) Đúng theo SGK. c) Sai: cán bộ lưu trữ quản lí, khai thác tài liệu lưu trữ tại trung tâm lưu trữ, cơ quan nhà nước.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chuyên viên bảo tàng sưu tầm, bảo quản, trưng bày hiện vật.","b) Nhà nghiên cứu lịch sử công bố công trình tại viện nghiên cứu.","c) Cán bộ lưu trữ làm việc tại các khu vui chơi giải trí.","d) Nhà báo cần nền tảng lịch sử để viết về đề tài văn hóa."],"type":"truefalse"},{"answer":"Quang Trung","explain":"Quang Trung (Nguyễn Huệ) với chiến thắng Ngọc Hồi – Đống Đa năm 1789 là nguồn cảm hứng của nhiều bộ phim lịch sử.","level":"VD","points":0.5,"q":"Vị anh hùng nào với chiến thắng Ngọc Hồi – Đống Đa năm 1789 là nguồn cảm hứng của nhiều bộ phim lịch sử?","type":"short"},{"answer":"1789","explain":"Quang Trung đại phá quân Thanh trong chiến thắng Ngọc Hồi – Đống Đa vào Tết Kỉ Dậu 1789.","level":"VDC","points":0.5,"q":"Chiến thắng Ngọc Hồi – Đống Đa của Quang Trung trước quân Thanh diễn ra vào năm nào?","type":"short"}]},{"name":"Đề 8","questions":[{"answer":"A","explain":"Đề tài lịch sử là nguồn cảm hứng vô tận cho điện ảnh, truyền hình, âm nhạc, trò chơi điện tử, truyện tranh.","level":"NB","options":["A. Nguồn cảm hứng vô tận cho sáng tạo nghệ thuật.","B. Nguồn vốn đầu tư duy nhất.","C. Kịch bản có sẵn không cần sáng tạo.","D. Không có vai trò gì."],"points":0.25,"q":"Đề tài lịch sử có vai trò nào sau đây với công nghiệp văn hóa?","type":"mcq"},{"answer":"A","explain":"Hướng dẫn viên du lịch thuyết minh về di tích, di sản cho du khách tại công ty lữ hành, khu di tích.","level":"NB","options":["A. Thuyết minh về di tích, di sản cho du khách.","B. Bán vé máy bay.","C. Nấu ăn cho đoàn khách.","D. Sửa chữa ô tô."],"points":0.25,"q":"Công việc chính của hướng dẫn viên du lịch là gì?","type":"mcq"},{"answer":"A","explain":"Chuyên viên bảo tàng sưu tầm, bảo quản, trưng bày hiện vật tại bảo tàng, khu di tích.","level":"NB","options":["A. Sưu tầm, bảo quản, trưng bày hiện vật.","B. Trồng cây cảnh.","C. Chăn nuôi gia súc.","D. Khai thác mỏ."],"points":0.25,"q":"Chuyên viên bảo tàng làm công việc nào sau đây?","type":"mcq"},{"answer":"A","explain":"Học sử giúp hiểu quá khứ để hành động đúng đắn trong hiện tại và định hướng tương lai — ý nghĩa thiết thực nhất.","level":"TH","options":["A. Hiểu quá khứ để hành động đúng trong hiện tại, định hướng tương lai.","B. Biết mọi chuyện đã qua.","C. Khoe kiến thức với bạn bè.","D. Tránh phải học các môn khác."],"points":0.25,"q":"Vì sao nói \"học sử để hiểu quá khứ, sống tốt hiện tại\"?","type":"mcq"},{"answer":"B","explain":"Nhiều nghề mới như sáng tạo nội dung số về lịch sử, du lịch thông minh, quản trị di sản đều cần nền tảng tri thức lịch sử vững chắc.","level":"TH","options":["A. Chỉ các nghề truyền thống.","B. Sáng tạo nội dung số về lịch sử, du lịch thông minh, quản trị di sản.","C. Chỉ các nghề chân tay.","D. Không nghề mới nào cần lịch sử."],"points":0.25,"q":"Kinh tế tri thức mở ra những nghề mới nào cần tri thức lịch sử?","type":"mcq"},{"answer":"A","explain":"Nhà báo có nền tảng lịch sử bình luận thời sự, giải mã vấn đề thời đại có chiều sâu — lợi thế cạnh tranh trong nghề báo.","level":"VD","options":["A. Bình luận thời sự có chiều sâu nhờ tri thức lịch sử.","B. Viết tin nhanh nhưng thiếu chính xác.","C. Chỉ viết về quá khứ.","D. Tránh xa các vấn đề thời sự."],"points":0.25,"q":"Một tòa soạn tuyển phóng viên chuyên trách mảng thời sự – văn hóa. Vì sao ứng viên giỏi lịch sử được ưu tiên?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: ngược lại, học sử mở ra nhiều nghề: nghiên cứu, giảng dạy, du lịch, bảo tàng, lưu trữ, báo chí, ngoại giao văn hóa.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Di tích lịch sử là tài nguyên phát triển du lịch văn hóa.","b) Phim lịch sử vừa giải trí vừa giáo dục truyền thống.","c) Bảo tồn di tích phải dựa trên nghiên cứu lịch sử.","d) Học sử chỉ có thể làm giáo viên."],"type":"truefalse"},{"answer":["T","F","T","T"],"explain":"a), c), d) Đúng theo SGK. b) Sai: người làm nghề cần đam mê lịch sử, tư duy phản biện, kĩ năng nghiên cứu, ngoại ngữ, công nghệ.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hướng dẫn viên du lịch cần tri thức lịch sử để thuyết minh.","b) Làm nghề liên quan đến sử học không cần kĩ năng gì đặc biệt.","c) Ngoại giao văn hóa quảng bá văn hóa dân tộc ra thế giới.","d) Học sử rèn kĩ năng kiểm chứng nguồn tin, phân tích đa chiều."],"type":"truefalse"},{"answer":"Thăng Long","explain":"Hoàng thành Thăng Long (Hà Nội) là di sản văn hóa thế giới, trung tâm quyền lực của nhiều triều đại phong kiến Việt Nam.","level":"TH","points":0.5,"q":"Hoàng thành nào ở Hà Nội là di sản văn hóa thế giới, gắn với nhiều triều đại phong kiến Việt Nam?","type":"short"},{"answer":"Ngọc Hồi","explain":"Chiến thắng Ngọc Hồi – Đống Đa (Tết Kỉ Dậu 1789) của Quang Trung đánh tan quân Thanh.","level":"VDC","points":0.5,"q":"Cùng với Đống Đa, địa danh nào gắn với chiến thắng Tết Kỉ Dậu 1789 của Quang Trung trước quân Thanh?","type":"short"}]},{"name":"Đề 9","questions":[{"answer":"A","explain":"Các tour về nguồn thăm Địa đạo Củ Chi, Dinh Độc Lập, Nghĩa trang Trường Sơn giáo dục truyền thống yêu nước cho thế hệ trẻ.","level":"NB","options":["A. Giáo dục truyền thống yêu nước.","B. Mua sắm hàng hiệu.","C. Nghỉ dưỡng cao cấp.","D. Chơi thể thao mạo hiểm."],"points":0.25,"q":"Mục đích chính của các tour du lịch \"về nguồn\" là gì?","type":"mcq"},{"answer":"A","explain":"Trò chơi điện tử, truyện tranh về đề tài lịch sử giúp giới trẻ tiếp cận lịch sử một cách sinh động.","level":"NB","options":["A. Trò chơi điện tử, truyện tranh.","B. Máy cày, máy gặt.","C. Tàu hỏa, máy bay.","D. Lò luyện thép."],"points":0.25,"q":"Sản phẩm công nghiệp văn hóa nào sau đây giúp giới trẻ tiếp cận lịch sử sinh động?","type":"mcq"},{"answer":"A","explain":"Cán bộ lưu trữ quản lí, khai thác tài liệu lưu trữ tại trung tâm lưu trữ quốc gia, cơ quan nhà nước.","level":"NB","options":["A. Quản lí, khai thác tài liệu lưu trữ.","B. Bán hàng online.","C. Chạy xe ôm công nghệ.","D. Làm nail."],"points":0.25,"q":"Cán bộ lưu trữ làm công việc nào sau đây?","type":"mcq"},{"answer":"B","explain":"Không tác phẩm nào thoát li khỏi bối cảnh xuất hiện của nó với những nhân vật, sự kiện cụ thể của thời đại.","level":"TH","options":["A. Sở thích của tác giả.","B. Bối cảnh lịch sử của thời đại tác phẩm ra đời.","C. Giá bán của tác phẩm.","D. Số trang của tác phẩm."],"points":0.25,"q":"Muốn đánh giá đúng giá trị một tác phẩm văn học, điều không thể bỏ qua là gì?","type":"mcq"},{"answer":"A","explain":"Chuyên gia di sản, ngoại giao văn hóa tư vấn bảo tồn, quảng bá văn hóa dân tộc ra thế giới.","level":"TH","options":["A. Tư vấn bảo tồn di sản, quảng bá văn hóa dân tộc.","B. Khai thác cát sỏi.","C. Buôn bán đồ cổ trái phép.","D. Phá dỡ di tích cũ."],"points":0.25,"q":"Vai trò của chuyên gia di sản trong xã hội hiện đại là gì?","type":"mcq"},{"answer":"C","explain":"Học sử rèn kĩ năng kiểm chứng nguồn tin, phân tích đa chiều — vũ khí chống tin giả; tin vào mọi thứ hoặc chia sẻ bừa bãi đều sai.","level":"VD","options":["A. Tin vào mọi thông tin đọc được.","B. Chia sẻ ngay tin giật gân.","C. Kiểm chứng nguồn tin, phân tích đa chiều trước khi tin.","D. Không đọc tin tức nữa."],"points":0.25,"q":"Trước một tin đồn thất thiệt lan truyền trên mạng về một sự kiện lịch sử, người học sử sẽ ứng xử thế nào?","type":"mcq"},{"answer":["T","T","F","T"],"explain":"a), b), d) Đúng theo SGK. c) Sai: học sử rèn tư duy phản biện, kĩ năng nghiên cứu — rất cần cho nghề nghiệp hiện đại.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sử học hiện diện trong nhiều lĩnh vực của đời sống hiện đại.","b) Tri thức lịch sử giúp bài thuyết minh du lịch hấp dẫn hơn.","c) Học sử không mang lại kĩ năng nào cho công việc.","d) Giáo dục lịch sử bồi dưỡng lòng yêu nước."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: bảo tồn, trùng tu di tích phải dựa trên nghiên cứu lịch sử chính xác.","level":"VDC","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhà nghiên cứu lịch sử làm việc tại viện nghiên cứu, trường đại học.","b) Hướng dẫn viên du lịch thuyết minh về di tích cho du khách.","c) Báo chí dùng tri thức lịch sử để bình luận thời sự có chiều sâu.","d) Có thể trùng tu di tích tùy tiện mà không cần nghiên cứu lịch sử."],"type":"truefalse"},{"answer":"Đống Đa","explain":"Chiến thắng Ngọc Hồi – Đống Đa năm 1789 của Quang Trung đánh tan quân Thanh xâm lược.","level":"VD","points":0.5,"q":"Cùng với Ngọc Hồi, địa danh nào ở Hà Nội gắn với chiến thắng năm 1789 của Quang Trung trước quân Thanh?","type":"short"},{"answer":"Mê Linh","explain":"Hai Bà Trưng xưng vương, định đô ở Mê Linh sau thắng lợi của cuộc khởi nghĩa năm 40.","level":"VDC","points":0.5,"q":"Sau thắng lợi của cuộc khởi nghĩa năm 40, Hai Bà Trưng xưng vương và định đô ở đâu?","type":"short"}]},{"name":"Đề 10","questions":[{"answer":"A","explain":"Tri thức lịch sử hiện diện trong nhiều lĩnh vực hiện đại: du lịch, công nghiệp văn hóa, báo chí, bảo tồn di sản, giáo dục, ngoại giao.","level":"NB","options":["A. Nhiều lĩnh vực: du lịch, phim ảnh, báo chí, giáo dục, ngoại giao.","B. Chỉ trong nhà trường.","C. Chỉ trong viện nghiên cứu.","D. Không ở lĩnh vực nào."],"points":0.25,"q":"Tri thức lịch sử hiện diện trong những lĩnh vực nào của đời sống hiện đại?","type":"mcq"},{"answer":"A","explain":"Người làm nghề liên quan đến sử học cần đam mê lịch sử, tư duy phản biện, kĩ năng sưu tầm – phân tích tư liệu, ngoại ngữ và công nghệ.","level":"NB","options":["A. Đam mê lịch sử, tư duy phản biện, kĩ năng nghiên cứu.","B. Chỉ cần học thuộc lòng.","C. Chỉ cần khéo ăn nói.","D. Không cần học gì thêm."],"points":0.25,"q":"Hành trang nghề nghiệp của người làm việc liên quan đến sử học là gì?","type":"mcq"},{"answer":"A","explain":"Học sử giúp hiểu quá khứ để hành động đúng đắn trong hiện tại và định hướng tương lai.","level":"NB","options":["A. Hiểu quá khứ để sống tốt hiện tại, định hướng tương lai.","B. Sống mãi với quá khứ.","C. Quên đi hiện tại.","D. Không cần hướng tới tương lai."],"points":0.25,"q":"Mối quan hệ giữa quá khứ – hiện tại – tương lai trong việc học sử là gì?","type":"mcq"},{"answer":"A","explain":"Học sử rèn kĩ năng đặt câu hỏi, kiểm chứng nguồn tin, phân tích đa chiều — nền tảng của tư duy phản biện.","level":"TH","options":["A. Đặt câu hỏi, kiểm chứng nguồn tin, phân tích đa chiều.","B. Tin ngay mọi điều đọc được.","C. Học vẹt không cần hiểu.","D. Tránh mọi tranh luận."],"points":0.25,"q":"Tư duy phản biện được rèn luyện qua học sử thể hiện ở kĩ năng nào?","type":"mcq"},{"answer":"C","explain":"Sáng tạo nội dung số về lịch sử, du lịch thông minh, quản trị di sản là những nghề mới cần nền tảng tri thức lịch sử vững chắc.","level":"TH","options":["A. Chỉ nghề nông.","B. Chỉ nghề thủ công.","C. Sáng tạo nội dung số về lịch sử, du lịch thông minh, quản trị di sản.","D. Không có nghề mới nào."],"points":0.25,"q":"Những nghề mới nào sau đây cần nền tảng tri thức lịch sử?","type":"mcq"},{"answer":"B","explain":"Bài thuyết minh cần tri thức lịch sử về di tích (Cố đô Huế: các triều Nguyễn, kiến trúc cung đình...) kết hợp kĩ năng truyền đạt hấp dẫn.","level":"VD","options":["A. Chỉ cần giọng nói hay.","B. Tri thức lịch sử về Cố đô Huế kết hợp kĩ năng truyền đạt.","C. Chỉ cần thuộc giá vé.","D. Chỉ cần biết đường đi."],"points":0.25,"q":"Một hướng dẫn viên được giao dẫn tour Cố đô Huế cho đoàn khách quốc tế. Yếu tố quyết định thành công của anh là gì?","type":"mcq"},{"answer":["T","F","T","T"],"explain":"a), c), d) Đúng theo SGK. b) Sai: chuyên viên bảo tàng sưu tầm, bảo quản, trưng bày hiện vật tại bảo tàng, khu di tích.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Di sản văn hóa là tài nguyên phát triển du lịch.","b) Chuyên viên bảo tàng chỉ làm việc tại ngân hàng.","c) Cán bộ lưu trữ quản lí tài liệu lưu trữ.","d) Ngoại giao văn hóa cần tri thức lịch sử."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: học sử rèn tư duy phản biện, kĩ năng nghiên cứu — hành trang cho nhiều nghề nghiệp.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phim, game lịch sử giúp giới trẻ tiếp cận lịch sử sinh động.","b) Bảo tồn di tích phải dựa trên nghiên cứu lịch sử chính xác.","c) Nhiều nghề mới cần nền tảng tri thức lịch sử vững.","d) Học sử không có ý nghĩa thực tiễn nào trong thời đại số."],"type":"truefalse"},{"answer":"Bạch Đằng","explain":"Trần Hưng Đạo lãnh đạo quân dân Đại Việt đánh thắng quân Nguyên trên sông Bạch Đằng năm 1288.","level":"VD","points":0.5,"q":"Dòng sông nào gắn với chiến thắng năm 1288 của Trần Hưng Đạo trước quân Nguyên?","type":"short"},{"answer":"Nguyễn Huệ","explain":"Quang Trung tên thật là Nguyễn Huệ, anh hùng áo vải với chiến thắng Ngọc Hồi – Đống Đa năm 1789.","level":"VDC","points":0.5,"q":"Quang Trung — anh hùng với chiến thắng Ngọc Hồi – Đống Đa năm 1789 — tên thật là gì?","type":"short"}]}]}
