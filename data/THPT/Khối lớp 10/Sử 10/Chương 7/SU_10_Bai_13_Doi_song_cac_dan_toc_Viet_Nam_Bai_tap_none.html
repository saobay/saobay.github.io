<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Cộng đồng các dân tộc Việt Nam hiện nay có bao nhiêu dân tộc?","options":["A. 54 dân tộc.","B. 53 dân tộc.","C. 55 dân tộc.","D. 50 dân tộc."],"answer":"A","explain":"Việt Nam có 54 dân tộc anh em cùng sinh sống: 1 dân tộc đa số (Kinh) và 53 dân tộc thiểu số.","points":0.25},{"type":"mcq","level":"NB","q":"Dân tộc đa số ở Việt Nam là","options":["A. dân tộc Kinh.","B. dân tộc Tày.","C. dân tộc Thái.","D. dân tộc Mường."],"answer":"A","explain":"Dân tộc Kinh là dân tộc đa số, chiếm khoảng 85–86% dân số cả nước.","points":0.25},{"type":"mcq","level":"TH","q":"54 dân tộc Việt Nam thuộc bao nhiêu ngữ hệ, bao nhiêu nhóm ngôn ngữ?","options":["A. 5 ngữ hệ, 8 nhóm ngôn ngữ.","B. 8 ngữ hệ, 5 nhóm ngôn ngữ.","C. 4 ngữ hệ, 4 nhóm ngôn ngữ.","D. 6 ngữ hệ, 10 nhóm ngôn ngữ."],"answer":"A","explain":"SGK nêu 54 dân tộc thuộc 5 ngữ hệ, 8 nhóm ngôn ngữ: Nam Á, Thái–Kađai, Mông–Dao, Nam Đảo, Hán–Tạng.","points":0.25},{"type":"mcq","level":"TH","q":"Nhóm ngôn ngữ Việt – Mường thuộc ngữ hệ nào?","options":["A. Ngữ hệ Nam Á.","B. Ngữ hệ Thái – Kađai.","C. Ngữ hệ Mông – Dao.","D. Ngữ hệ Nam Đảo."],"answer":"A","explain":"Ngữ hệ Nam Á gồm nhóm Việt – Mường (Kinh, Mường) và nhóm Môn – Khơme.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao nói văn hóa Việt Nam “thống nhất trong đa dạng”?","options":["A. Vì 54 dân tộc có bản sắc riêng nhưng cùng chung nền văn hóa dân tộc.","B. Vì chỉ có một nền văn hóa duy nhất.","C. Vì các dân tộc không giao lưu.","D. Vì văn hóa các dân tộc hoàn toàn giống nhau."],"answer":"A","explain":"Mỗi dân tộc có nét văn hóa riêng, nhưng tất cả cùng tạo nên nền văn hóa Việt Nam thống nhất, đậm đà bản sắc.","points":0.25},{"type":"mcq","level":"VDC","q":"Việc phân loại dân tộc theo ngữ hệ có ý nghĩa khoa học vì","options":["A. phản ánh nguồn gốc, quan hệ gần gũi về ngôn ngữ giữa các tộc người.","B. để chia rẽ các dân tộc.","C. không có ý nghĩa gì.","D. để xóa bỏ ngôn ngữ các dân tộc."],"answer":"A","explain":"Ngữ hệ cho thấy các ngôn ngữ cùng nguồn gốc, giúp hiểu quan hệ lịch sử, văn hóa giữa các tộc người.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Việt Nam có 54 dân tộc.","b) Dân tộc Kinh là dân tộc đa số.","c) Có 53 dân tộc thiểu số.","d) Việt Nam chỉ có một dân tộc duy nhất."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Việt Nam là quốc gia đa dân tộc với 54 dân tộc.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) 54 dân tộc thuộc 5 ngữ hệ, 8 nhóm ngôn ngữ.","b) Nhóm Việt – Mường thuộc ngữ hệ Nam Á.","c) Dân tộc Chăm thuộc ngữ hệ Nam Đảo.","d) Dân tộc Hoa thuộc ngữ hệ Nam Á."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: dân tộc Hoa thuộc nhóm Hán, ngữ hệ Hán – Tạng.","points":1},{"type":"short","level":"VD","q":"Cộng đồng các dân tộc Việt Nam có bao nhiêu dân tộc (ghi số)?","answer":"54","explain":"Việt Nam có 54 dân tộc anh em cùng sinh sống.","points":0.5},{"type":"short","level":"VDC","q":"Ngữ hệ nào gồm nhóm ngôn ngữ Tày – Thái và Kađai (ghi 3 chữ)?","answer":"Thái – Kađai","explain":"Ngữ hệ Thái – Kađai gồm nhóm Tày – Thái và nhóm Kađai.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Hoạt động kinh tế chính của cộng đồng các dân tộc Việt Nam là","options":["A. nông nghiệp.","B. công nghiệp nặng.","C. khai thác dầu khí.","D. dịch vụ tài chính."],"answer":"A","explain":"Nông nghiệp (trồng lúa nước, lúa nương, chăn nuôi...) là hoạt động kinh tế chính của các dân tộc.","points":0.25},{"type":"mcq","level":"NB","q":"Loại nhà ở chủ yếu của đồng bào các dân tộc thiểu số là","options":["A. nhà sàn.","B. nhà cao tầng.","C. chung cư.","D. biệt thự."],"answer":"A","explain":"Đồng bào các dân tộc thiểu số chủ yếu ở nhà sàn; một số ở nhà trệt hoặc nửa sàn nửa trệt.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm chung trong bữa ăn của các dân tộc Việt Nam là","options":["A. cơm là lương thực chính, ăn kèm rau, cá, thịt.","B. chỉ ăn thịt.","C. không ăn cơm.","D. chỉ ăn đồ hộp."],"answer":"A","explain":"Dù có khác biệt vùng miền, cơm vẫn là lương thực chính trong bữa ăn của các dân tộc.","points":0.25},{"type":"mcq","level":"TH","q":"Trang phục của đồng bào các dân tộc thiểu số thường được may từ","options":["A. vải bông, vải lanh, tơ tằm.","B. vải nilon công nghiệp duy nhất.","C. da thú.","D. lá cây."],"answer":"A","explain":"Trang phục các dân tộc thiểu số thường may từ vải bông, vải lanh, tơ tằm với kiểu dáng, màu sắc đa dạng.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao nhà sàn phù hợp với điều kiện sống của đồng bào miền núi?","options":["A. Vì tránh ẩm thấp, thú dữ và tận dụng không gian dưới sàn.","B. Vì rẻ hơn nhà trệt.","C. Vì không biết xây nhà trệt.","D. Vì bị ép buộc."],"answer":"A","explain":"Nhà sàn giúp tránh ẩm thấp, lũ lụt, thú dữ; không gian dưới sàn để chăn nuôi, để dụng cụ – phù hợp miền núi.","points":0.25},{"type":"mcq","level":"VDC","q":"Xu hướng biến đổi trong đời sống vật chất của các dân tộc hiện nay là","options":["A. hiện đại hóa, tiện nghi hơn nhưng vẫn giữ bản sắc.","B. từ bỏ hoàn toàn truyền thống.","C. không có thay đổi gì.","D. quay lại thời nguyên thủy."],"answer":"A","explain":"Đời sống vật chất ngày càng hiện đại (nhà tầng, xe máy, điện...) nhưng các dân tộc vẫn giữ gìn nét văn hóa riêng.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nông nghiệp là hoạt động kinh tế chính của các dân tộc.","b) Đồng bào thiểu số chủ yếu ở nhà sàn.","c) Cơm là lương thực chính trong bữa ăn.","d) Các dân tộc không có nghề thủ công."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nghề thủ công (gốm, dệt, rèn...) phát triển đa dạng ở các dân tộc.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Người Kinh hiện nay thường mặc âu phục.","b) Trang phục thiểu số đa dạng về chất liệu, màu sắc.","c) Đồng bào miền núi chủ yếu đi bộ và gùi hàng.","d) Mọi dân tộc đều ở nhà sàn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: người Kinh ở nhà trệt, nhà tầng; chỉ đồng bào thiểu số chủ yếu ở nhà sàn.","points":1},{"type":"short","level":"VD","q":"Lương thực chính trong bữa ăn của các dân tộc Việt Nam là gì (ghi 1 chữ)?","answer":"Cơm","explain":"Cơm (từ lúa gạo) là lương thực chính của cộng đồng các dân tộc Việt Nam.","points":0.5},{"type":"short","level":"VDC","q":"Đồng bào miền núi thường dùng vật dụng nào để gùi hàng trên lưng khi đi nương (ghi 1 chữ)?","answer":"Gùi","explain":"Gùi là vật dụng đan bằng tre, nứa để mang vác nông sản, rất phổ biến ở miền núi.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Tín ngưỡng phổ biến của cộng đồng các dân tộc Việt Nam là","options":["A. thờ cúng tổ tiên, đa thần.","B. chỉ theo một tôn giáo duy nhất.","C. không có tín ngưỡng.","D. chỉ thờ thần tài."],"answer":"A","explain":"Tín ngưỡng đa thần, vạn vật hữu linh, thờ cúng tổ tiên, Thành hoàng làng, thờ Mẫu rất phổ biến.","points":0.25},{"type":"mcq","level":"NB","q":"Lễ hội Lồng Tồng là của dân tộc nào?","options":["A. Tày – Nùng.","B. Kinh.","C. Chăm.","D. Khmer."],"answer":"A","explain":"Hội Lồng Tồng (lễ xuống đồng) là lễ hội của đồng bào Tày – Nùng, cầu mùa màng bội thu.","points":0.25},{"type":"mcq","level":"TH","q":"Các tôn giáo lớn được tiếp thu ở Việt Nam gồm","options":["A. Phật giáo, Đạo giáo, Công giáo, Tin Lành, Hồi giáo.","B. chỉ có Phật giáo.","C. chỉ có Công giáo.","D. không có tôn giáo nào."],"answer":"A","explain":"Việt Nam tiếp thu nhiều tôn giáo lớn: Phật giáo, Đạo giáo, Công giáo, Tin Lành, Hồi giáo... hòa hợp với tín ngưỡng bản địa.","points":0.25},{"type":"mcq","level":"TH","q":"Lễ hội Ka-tê là của dân tộc nào?","options":["A. Chăm.","B. Kinh.","C. Dao.","D. Mông."],"answer":"A","explain":"Lễ hội Ka-tê của đồng bào Chăm để tưởng nhớ tổ tiên, cầu phúc.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao lễ hội của người Kinh có quy mô lớn hơn lễ hội các dân tộc thiểu số?","options":["A. Vì dân số đông, điều kiện kinh tế – giao thông thuận lợi hơn.","B. Vì lễ hội thiểu số không có giá trị.","C. Vì người Kinh cấm lễ hội khác.","D. Vì thiểu số không có lễ hội."],"answer":"A","explain":"Lễ hội người Kinh có quy mô từ làng đến quốc gia nhờ dân số đông, kinh tế phát triển; lễ hội thiểu số chủ yếu ở quy mô làng, bản.","points":0.25},{"type":"mcq","level":"VDC","q":"Thái độ đúng đắn trong giao lưu văn hóa hiện nay là","options":["A. giữ gìn bản sắc, tiếp thu có chọn lọc, xóa bỏ hủ tục.","B. từ bỏ hoàn toàn văn hóa truyền thống.","C. giữ nguyên mọi hủ tục.","D. từ chối mọi giao lưu."],"answer":"A","explain":"Trong hội nhập, các dân tộc giữ gìn bản sắc, tiếp thu văn hóa tiến bộ và xóa bỏ hủ tục (tảo hôn, mê tín...).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thờ cúng tổ tiên là tín ngưỡng phổ biến.","b) Lễ hội Lồng Tồng của người Tày – Nùng.","c) Lễ hội Ka-tê của người Chăm.","d) Việt Nam không có lễ hội nào."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Việt Nam có hệ thống lễ hội đa dạng, phong phú.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Các tôn giáo lớn hòa hợp với tín ngưỡng bản địa.","b) Cần xóa bỏ các hủ tục như tảo hôn.","c) Nên giữ nguyên mọi phong tục dù lạc hậu.","d) Giao lưu văn hóa cần có chọn lọc."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần xóa bỏ hủ tục, giữ gìn nét đẹp truyền thống.","points":1},{"type":"short","level":"VD","q":"Lễ hội đua ghe Ngo là của dân tộc nào (ghi 1 chữ)?","answer":"Khmer","explain":"Đua ghe Ngo là lễ hội truyền thống của đồng bào Khmer Nam Bộ.","points":0.5},{"type":"short","level":"VDC","q":"Lễ trưởng thành của nam giới người Dao có tên là gì (ghi 2 chữ)?","answer":"Cấp sắc","explain":"Lễ cấp sắc là nghi lễ trưởng thành quan trọng của nam giới người Dao.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"“Dân tộc” theo nghĩa tộc người là","options":["A. cộng đồng có chung ngôn ngữ, văn hóa và ý thức tự giác.","B. toàn thể cư dân của một quốc gia.","C. một dòng họ.","D. một làng."],"answer":"A","explain":"Dân tộc – tộc người là cộng đồng người có chung ngôn ngữ, văn hóa và ý thức tự giác dân tộc.","points":0.25},{"type":"mcq","level":"NB","q":"Hội Lim nổi tiếng với loại hình nghệ thuật nào?","options":["A. Hát quan họ.","B. Hát chèo.","C. Hát tuồng.","D. Hát ca trù."],"answer":"A","explain":"Hội Lim (Bắc Ninh) nổi tiếng với hát quan họ – di sản văn hóa phi vật thể của nhân loại.","points":0.25},{"type":"mcq","level":"TH","q":"Dân tộc Chăm thuộc ngữ hệ nào?","options":["A. Ngữ hệ Nam Đảo.","B. Ngữ hệ Nam Á.","C. Ngữ hệ Mông – Dao.","D. Ngữ hệ Hán – Tạng."],"answer":"A","explain":"Dân tộc Chăm (cùng Gia Rai, Ê Đê...) thuộc ngữ hệ Nam Đảo.","points":0.25},{"type":"mcq","level":"TH","q":"Nghề thủ công nào KHÔNG phổ biến ở các dân tộc?","options":["A. Luyện thép công nghiệp.","B. Dệt vải.","C. Đan lát.","D. Rèn."],"answer":"A","explain":"Dệt, đan, rèn, gốm, mộc... là nghề thủ công truyền thống; luyện thép công nghiệp là ngành hiện đại.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao cần bảo tồn ngôn ngữ của các dân tộc thiểu số?","options":["A. Vì ngôn ngữ mang bản sắc, tri thức dân gian của mỗi tộc người.","B. Vì ngôn ngữ không quan trọng.","C. Vì để chia rẽ.","D. Vì ngôn ngữ gây mâu thuẫn."],"answer":"A","explain":"Ngôn ngữ lưu giữ tri thức, văn hóa của tộc người; mất ngôn ngữ là mất một phần di sản văn hóa.","points":0.25},{"type":"mcq","level":"VDC","q":"Chính sách dân tộc đúng đắn cần","options":["A. bình đẳng, đoàn kết, giúp nhau cùng phát triển.","B. ưu tiên một dân tộc duy nhất.","C. đồng hóa các dân tộc.","D. chia rẽ các dân tộc."],"answer":"A","explain":"Đảng và Nhà nước thực hiện chính sách bình đẳng, đoàn kết, tương trợ giữa các dân tộc cùng phát triển.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dân tộc Chăm thuộc ngữ hệ Nam Đảo.","b) Hội Lim nổi tiếng với hát quan họ.","c) Dệt, đan, rèn là nghề thủ công truyền thống.","d) Các dân tộc thiểu số không có ngôn ngữ riêng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mỗi dân tộc đều có ngôn ngữ (tiếng nói) riêng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cần bảo tồn ngôn ngữ các dân tộc.","b) Chính sách dân tộc là bình đẳng, đoàn kết.","c) Nên đồng hóa mọi dân tộc thành một.","d) Các dân tộc giúp nhau cùng phát triển."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: phải tôn trọng bản sắc của mỗi dân tộc, không đồng hóa.","points":1},{"type":"short","level":"VD","q":"Dân tộc nào là chủ nhân của lễ hội Ka-tê (ghi 1 chữ)?","answer":"Chăm","explain":"Lễ hội Ka-tê là của đồng bào Chăm.","points":0.5},{"type":"short","level":"VDC","q":"Loại hình nghệ thuật nào được trình diễn ở hội Lim, Bắc Ninh (ghi 2 chữ)?","answer":"Quan họ","explain":"Hát quan họ là di sản văn hóa phi vật thể đại diện của nhân loại (UNESCO 2009).","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Ngữ hệ Hán – Tạng gồm các nhóm ngôn ngữ nào?","options":["A. Nhóm Hán và nhóm Tạng – Miến.","B. Nhóm Việt – Mường và Môn – Khơme.","C. Nhóm Tày – Thái và Kađai.","D. Chỉ nhóm Mông – Dao."],"answer":"A","explain":"Ngữ hệ Hán – Tạng gồm nhóm Hán (Hoa, Sán Dìu, Ngái) và nhóm Tạng – Miến (Hà Nhì, La Hủ...).","points":0.25},{"type":"mcq","level":"NB","q":"Tín ngưỡng “vạn vật hữu linh” có nghĩa là","options":["A. mọi vật đều có linh hồn.","B. chỉ con người có linh hồn.","C. không có linh hồn.","D. chỉ thờ một vị thần."],"answer":"A","explain":"Vạn vật hữu linh là quan niệm mọi sự vật (cây cối, sông núi...) đều có linh hồn, phổ biến ở các dân tộc.","points":0.25},{"type":"mcq","level":"TH","q":"Dân tộc Mông thuộc ngữ hệ nào?","options":["A. Ngữ hệ Mông – Dao.","B. Ngữ hệ Nam Á.","C. Ngữ hệ Nam Đảo.","D. Ngữ hệ Thái – Kađai."],"answer":"A","explain":"Dân tộc Mông (cùng dân tộc Dao) thuộc ngữ hệ Mông – Dao.","points":0.25},{"type":"mcq","level":"TH","q":"Phương tiện vận chuyển phổ biến của đồng bào miền núi là","options":["A. gùi.","B. xe tải lớn.","C. máy bay.","D. tàu hỏa."],"answer":"A","explain":"Do địa hình dốc, đồng bào miền núi chủ yếu đi bộ và vận chuyển hàng bằng gùi.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao trang phục các dân tộc thiểu số đa dạng về màu sắc, hoa văn?","options":["A. Vì mỗi tộc người thể hiện bản sắc, quan niệm thẩm mĩ riêng.","B. Vì không có vải trơn.","C. Vì bị ép buộc.","D. Vì để phân biệt giàu nghèo duy nhất."],"answer":"A","explain":"Hoa văn, màu sắc trang phục phản ánh quan niệm vũ trụ, tín ngưỡng và bản sắc của từng tộc người.","points":0.25},{"type":"mcq","level":"VDC","q":"Để phát triển du lịch văn hóa ở vùng dân tộc, cần","options":["A. bảo tồn bản sắc, phát triển bền vững, người dân hưởng lợi.","B. thương mại hóa mọi lễ hội.","C. xóa bỏ phong tục.","D. ngăn khách du lịch."],"answer":"A","explain":"Du lịch văn hóa phải gắn với bảo tồn bản sắc, bảo vệ môi trường và nâng cao đời sống đồng bào.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dân tộc Mông thuộc ngữ hệ Mông – Dao.","b) Gùi là phương tiện vận chuyển ở miền núi.","c) Vạn vật hữu linh nghĩa là mọi vật đều có linh hồn.","d) Trang phục các dân tộc đều giống hệt nhau."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: trang phục đa dạng theo từng tộc người.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hoa văn trang phục thể hiện bản sắc tộc người.","b) Du lịch văn hóa cần bảo tồn bản sắc.","c) Nên thương mại hóa mọi lễ hội.","d) Người dân địa phương cần được hưởng lợi từ du lịch."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: thương mại hóa quá mức làm mất giá trị văn hóa của lễ hội.","points":1},{"type":"short","level":"VD","q":"Dân tộc nào thuộc nhóm ngôn ngữ Tày – Thái, nổi tiếng với lễ hội Lồng Tồng (ghi 1 chữ)?","answer":"Tày","explain":"Dân tộc Tày (cùng Nùng) tổ chức lễ hội Lồng Tồng đầu xuân.","points":0.5},{"type":"short","level":"VDC","q":"Quan niệm “mọi vật đều có linh hồn” trong tín ngưỡng dân gian gọi là gì (ghi 4 chữ)?","answer":"Vạn vật hữu linh","explain":"Vạn vật hữu linh là tín ngưỡng phổ biến của cộng đồng các dân tộc Việt Nam.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Dân tộc Thái thuộc nhóm ngôn ngữ nào?","options":["A. Nhóm Tày – Thái.","B. Nhóm Việt – Mường.","C. Nhóm Môn – Khơme.","D. Nhóm Hán."],"answer":"A","explain":"Dân tộc Thái (cùng Tày, Nùng...) thuộc nhóm ngôn ngữ Tày – Thái, ngữ hệ Thái – Kađai.","points":0.25},{"type":"mcq","level":"NB","q":"Thờ Thành hoàng làng là tín ngưỡng của","options":["A. người Kinh ở làng xã Bắc Bộ.","B. chỉ người Chăm.","C. chỉ người Khmer.","D. không dân tộc nào."],"answer":"A","explain":"Thờ Thành hoàng làng – vị thần bảo hộ làng – là tín ngưỡng phổ biến của người Kinh ở đồng bằng Bắc Bộ.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm giống nhau trong đời sống tinh thần của các dân tộc là","options":["A. đều coi trọng tình cảm gia đình, làng xóm và thờ cúng tổ tiên.","B. đều theo một tôn giáo duy nhất.","C. không có lễ hội.","D. không có tín ngưỡng."],"answer":"A","explain":"Dù khác nhau về hình thức, các dân tộc đều coi trọng gia đình, cộng đồng và nhớ về cội nguồn.","points":0.25},{"type":"mcq","level":"TH","q":"Lễ xuống đồng của người Tày – Nùng nhằm mục đích","options":["A. cầu cho mùa màng bội thu.","B. cầu mưa duy nhất.","C. vui chơi.","D. tưởng nhớ vua."],"answer":"A","explain":"Lễ xuống đồng (Lồng Tồng) đầu xuân cầu cho một năm mưa thuận gió hòa, mùa màng bội thu.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao tín ngưỡng thờ cúng tổ tiên có sức sống bền vững?","options":["A. Vì thể hiện đạo lí uống nước nhớ nguồn của dân tộc.","B. Vì bị ép buộc.","C. Vì mang lại giàu sang.","D. Vì là tôn giáo ngoại lai."],"answer":"A","explain":"Thờ cúng tổ tiên thể hiện đạo lí uống nước nhớ nguồn, gắn kết các thế hệ – giá trị bền vững của văn hóa Việt.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong thời đại số, việc giữ gìn văn hóa các dân tộc cần","options":["A. số hóa di sản, quảng bá trên mạng nhưng giữ bản chất.","B. đưa tất cả lên mạng xã hội không chọn lọc.","C. cấm sử dụng công nghệ.","D. chỉ lưu trữ, không quảng bá."],"answer":"A","explain":"Công nghệ giúp số hóa, lưu trữ và quảng bá di sản rộng rãi, nhưng phải giữ đúng bản chất văn hóa.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dân tộc Thái thuộc nhóm Tày – Thái.","b) Thờ Thành hoàng làng phổ biến ở người Kinh.","c) Lễ xuống đồng cầu mùa màng bội thu.","d) Các dân tộc đều coi trọng thờ cúng tổ tiên."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng theo SGK.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thờ cúng tổ tiên thể hiện đạo lí uống nước nhớ nguồn.","b) Công nghệ giúp bảo tồn di sản văn hóa.","c) Nên đưa di sản lên mạng một cách tùy tiện.","d) Giữ gìn văn hóa cần sự tham gia của cộng đồng."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần quảng bá có chọn lọc, giữ đúng bản chất văn hóa.","points":1},{"type":"short","level":"VD","q":"Vị thần được thờ làm thần bảo hộ của làng người Kinh gọi là gì (ghi 2 chữ)?","answer":"Thành hoàng","explain":"Thành hoàng làng là vị thần bảo hộ của mỗi làng quê Bắc Bộ.","points":0.5},{"type":"short","level":"VDC","q":"Đạo lí “uống nước nhớ nguồn” được thể hiện qua tín ngưỡng nào (ghi 4 chữ)?","answer":"Thờ cúng tổ tiên","explain":"Tín ngưỡng thờ cúng tổ tiên thể hiện đạo lí uống nước nhớ nguồn của dân tộc Việt Nam.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Dân tộc Mường thuộc nhóm ngôn ngữ nào?","options":["A. Nhóm Việt – Mường.","B. Nhóm Tày – Thái.","C. Nhóm Mông – Dao.","D. Nhóm Kađai."],"answer":"A","explain":"Dân tộc Mường (cùng Kinh) thuộc nhóm ngôn ngữ Việt – Mường, ngữ hệ Nam Á.","points":0.25},{"type":"mcq","level":"NB","q":"Tôn giáo nào du nhập vào Việt Nam sớm nhất?","options":["A. Phật giáo.","B. Công giáo.","C. Tin Lành.","D. Hồi giáo."],"answer":"A","explain":"Phật giáo du nhập vào Việt Nam từ những thế kỉ đầu Công nguyên qua con đường thương mại.","points":0.25},{"type":"mcq","level":"TH","q":"Đặc điểm nhà ở của người Kinh hiện nay là","options":["A. nhà trệt, nhà tầng với kiến trúc hiện đại.","B. chỉ ở nhà sàn.","C. chỉ ở hang động.","D. không có nhà ở."],"answer":"A","explain":"Người Kinh hiện nay ở nhà trệt (nông thôn), nhà tầng, chung cư (đô thị) với kiến trúc hiện đại, tiện dụng.","points":0.25},{"type":"mcq","level":"TH","q":"Hủ tục cần xóa bỏ trong đời sống các dân tộc là","options":["A. tảo hôn, hôn nhân cận huyết, mê tín dị đoan.","B. lễ hội truyền thống.","C. trang phục dân tộc.","D. tiếng nói dân tộc."],"answer":"A","explain":"Tảo hôn, hôn nhân cận huyết, cúng bái mê tín là hủ tục cần xóa bỏ; lễ hội, trang phục, tiếng nói cần bảo tồn.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao Phật giáo hòa hợp được với tín ngưỡng bản địa Việt Nam?","options":["A. Vì có nhiều điểm tương đồng: hướng thiện, từ bi, gần gũi đời sống.","B. Vì bị ép buộc.","C. Vì xóa bỏ tín ngưỡng bản địa.","D. Vì chỉ dành cho vua quan."],"answer":"A","explain":"Phật giáo với tinh thần từ bi, hướng thiện dễ hòa hợp với tín ngưỡng thờ cúng tổ tiên, tâm linh của người Việt.","points":0.25},{"type":"mcq","level":"VDC","q":"Bài học cho học sinh từ Bài 13 là","options":["A. tôn trọng, tìm hiểu văn hóa các dân tộc anh em.","B. chỉ quan tâm văn hóa dân tộc mình.","C. chê bai văn hóa khác.","D. từ bỏ bản sắc."],"answer":"A","explain":"Học sinh cần tôn trọng sự đa dạng văn hóa, tìm hiểu và góp phần bảo tồn văn hóa các dân tộc anh em.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dân tộc Mường thuộc nhóm Việt – Mường.","b) Phật giáo du nhập vào Việt Nam sớm nhất.","c) Người Kinh hiện nay ở nhà tầng, nhà trệt.","d) Tảo hôn là hủ tục cần xóa bỏ."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phật giáo hòa hợp với tín ngưỡng bản địa.","b) Cần tôn trọng văn hóa các dân tộc.","c) Nên chê bai văn hóa dân tộc khác.","d) Học sinh cần tìm hiểu văn hóa các dân tộc anh em."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: phải tôn trọng, không chê bai văn hóa của dân tộc khác.","points":1},{"type":"short","level":"VD","q":"Tôn giáo nào du nhập vào Việt Nam sớm nhất (ghi 2 chữ)?","answer":"Phật giáo","explain":"Phật giáo du nhập từ những thế kỉ đầu Công nguyên, hòa hợp với văn hóa bản địa.","points":0.5},{"type":"short","level":"VDC","q":"Hủ tục hôn nhân nào cần xóa bỏ, khi trai gái kết hôn quá sớm (ghi 2 chữ)?","answer":"Tảo hôn","explain":"Tảo hôn (kết hôn sớm) là hủ tục ảnh hưởng sức khỏe, cần xóa bỏ.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Dân tộc Khmer thuộc nhóm ngôn ngữ nào?","options":["A. Nhóm Môn – Khơme.","B. Nhóm Việt – Mường.","C. Nhóm Tày – Thái.","D. Nhóm Hán."],"answer":"A","explain":"Dân tộc Khmer (cùng Ba Na, Xơ Đăng...) thuộc nhóm ngôn ngữ Môn – Khơme, ngữ hệ Nam Á.","points":0.25},{"type":"mcq","level":"NB","q":"Lễ hội nào sau đây của người Kinh?","options":["A. Hội Lim.","B. Lễ Ka-tê.","C. Đua ghe Ngo.","D. Lễ cấp sắc."],"answer":"A","explain":"Hội Lim (Bắc Ninh) là lễ hội của người Kinh; Ka-tê (Chăm), đua ghe Ngo (Khmer), cấp sắc (Dao).","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao bữa ăn của người Kinh ngày càng đa dạng?","options":["A. Vì đời sống nâng cao, giao lưu văn hóa ẩm thực mở rộng.","B. Vì không còn gạo.","C. Vì bị ép buộc.","D. Vì từ bỏ món truyền thống."],"answer":"A","explain":"Đời sống nâng cao và giao lưu vùng miền, quốc tế khiến thực đơn bữa ăn đa dạng hơn, dù cơm vẫn là chính.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác nhau về quy mô lễ hội giữa người Kinh và các dân tộc thiểu số là","options":["A. lễ hội Kinh quy mô từ làng đến quốc gia; thiểu số chủ yếu ở làng, bản.","B. thiểu số không có lễ hội.","C. Kinh không có lễ hội.","D. hoàn toàn giống nhau."],"answer":"A","explain":"SGK nêu lễ hội người Kinh quy mô đa dạng (làng, vùng, quốc gia, quốc tế); lễ hội thiểu số chủ yếu ở làng, bản.","points":0.25},{"type":"mcq","level":"VD","q":"Ẩm thực các vùng miền khác nhau thể hiện","options":["A. sự sáng tạo và thích ứng với điều kiện tự nhiên của mỗi vùng.","B. sự chia rẽ.","C. không có ý nghĩa.","D. sự nghèo nàn."],"answer":"A","explain":"Mỗi vùng miền sáng tạo món ăn phù hợp với sản vật, khí hậu địa phương – nét đẹp của văn hóa ẩm thực Việt.","points":0.25},{"type":"mcq","level":"VDC","q":"Để lễ hội truyền thống không bị mai một, cần","options":["A. tổ chức thường niên, truyền dạy cho thế hệ trẻ.","B. cấm tổ chức.","C. chỉ ghi chép, không tổ chức.","D. để tự nhiên, không quan tâm."],"answer":"A","explain":"Duy trì tổ chức lễ hội và truyền dạy cho thế hệ trẻ là cách bảo tồn sống động nhất.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dân tộc Khmer thuộc nhóm Môn – Khơme.","b) Hội Lim là lễ hội của người Kinh.","c) Ẩm thực vùng miền thể hiện sự sáng tạo.","d) Cần truyền dạy lễ hội cho thế hệ trẻ."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lễ hội Kinh có quy mô lớn hơn lễ hội thiểu số.","b) Lễ hội thiểu số chủ yếu ở làng, bản.","c) Mọi lễ hội đều có quy mô quốc gia.","d) Cần duy trì tổ chức lễ hội thường niên."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: chỉ một số lễ hội lớn có quy mô quốc gia.","points":1},{"type":"short","level":"VD","q":"Dân tộc nào ở Nam Bộ nổi tiếng với lễ hội đua ghe Ngo (ghi 1 chữ)?","answer":"Khmer","explain":"Đồng bào Khmer Nam Bộ tổ chức lễ hội đua ghe Ngo hằng năm.","points":0.5},{"type":"short","level":"VDC","q":"Lễ hội đầu xuân của người Kinh ở Bắc Ninh, nổi tiếng với hát quan họ, có tên là gì (ghi 2 chữ)?","answer":"Hội Lim","explain":"Hội Lim (Tiên Du, Bắc Ninh) là lễ hội quan họ nổi tiếng.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Dân tộc Dao thuộc ngữ hệ nào?","options":["A. Ngữ hệ Mông – Dao.","B. Ngữ hệ Nam Á.","C. Ngữ hệ Nam Đảo.","D. Ngữ hệ Hán – Tạng."],"answer":"A","explain":"Dân tộc Dao (cùng Mông) thuộc ngữ hệ Mông – Dao.","points":0.25},{"type":"mcq","level":"NB","q":"Thờ Mẫu là tín ngưỡng phổ biến ở","options":["A. người Kinh.","B. chỉ người nước ngoài.","C. không dân tộc nào.","D. chỉ giới trẻ."],"answer":"A","explain":"Tín ngưỡng thờ Mẫu (Mẫu Thượng Thiên, Mẫu Thượng Ngàn, Mẫu Thoải) phổ biến trong đời sống người Kinh.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các dân tộc thiểu số ưa dùng trang sức?","options":["A. Vì trang sức thể hiện vẻ đẹp, địa vị và bản sắc tộc người.","B. Vì không có quần áo.","C. Vì bị ép buộc.","D. Vì để khoe của duy nhất."],"answer":"A","explain":"Trang sức (bạc, vàng) vừa làm đẹp, vừa thể hiện địa vị xã hội và bản sắc văn hóa của tộc người.","points":0.25},{"type":"mcq","level":"TH","q":"Hoạt động trao đổi, mua bán của đồng bào thiểu số chủ yếu ở phạm vi","options":["A. làng, bản và khu vực lân cận.","B. quốc tế.","C. toàn quốc.","D. không buôn bán."],"answer":"A","explain":"SGK nêu trao đổi, mua bán của đồng bào chủ yếu trong quy mô làng, bản hoặc vài làng trong khu vực.","points":0.25},{"type":"mcq","level":"VD","q":"Tô-tem giáo là tín ngưỡng","options":["A. thờ vật tổ (con vật, cây cối) của thị tộc.","B. thờ một vị thần duy nhất.","C. không thờ gì.","D. thờ tiền bạc."],"answer":"A","explain":"Tô-tem giáo là hình thức tín ngưỡng nguyên thủy thờ vật tổ (tô-tem) của thị tộc, còn dấu vết ở một số dân tộc.","points":0.25},{"type":"mcq","level":"VDC","q":"Ý nghĩa của việc tìm hiểu đời sống các dân tộc đối với đoàn kết dân tộc là","options":["A. hiểu nhau hơn, tôn trọng nhau, củng cố khối đoàn kết.","B. để phân biệt đối xử.","C. không có ý nghĩa.","D. để chia rẽ."],"answer":"A","explain":"Hiểu biết văn hóa lẫn nhau giúp các dân tộc tôn trọng, gần gũi, củng cố khối đại đoàn kết.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dân tộc Dao thuộc ngữ hệ Mông – Dao.","b) Thờ Mẫu phổ biến ở người Kinh.","c) Tô-tem giáo thờ vật tổ của thị tộc.","d) Tìm hiểu văn hóa giúp đoàn kết dân tộc."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trang sức thể hiện bản sắc tộc người.","b) Buôn bán của đồng bào chủ yếu ở làng, bản.","c) Mọi dân tộc đều buôn bán quốc tế.","d) Hiểu biết văn hóa giúp tôn trọng lẫn nhau."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: trao đổi chủ yếu trong phạm vi làng, bản.","points":1},{"type":"short","level":"VD","q":"Tín ngưỡng thờ vật tổ của thị tộc gọi là gì (ghi 3 chữ)?","answer":"Tô-tem giáo","explain":"Tô-tem giáo là tín ngưỡng thờ vật tổ (tô-tem) của thị tộc.","points":0.5},{"type":"short","level":"VDC","q":"Nghi lễ trưởng thành của nam giới người Dao có tên là gì (ghi 2 chữ)?","answer":"Cấp sắc","explain":"Lễ cấp sắc là nghi lễ công nhận sự trưởng thành của nam giới người Dao.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Nhóm ngôn ngữ Kađai thuộc ngữ hệ nào?","options":["A. Ngữ hệ Thái – Kađai.","B. Ngữ hệ Nam Á.","C. Ngữ hệ Mông – Dao.","D. Ngữ hệ Nam Đảo."],"answer":"A","explain":"Ngữ hệ Thái – Kađai gồm nhóm Tày – Thái và nhóm Kađai (La Chí, Pu Péo...).","points":0.25},{"type":"mcq","level":"NB","q":"Công giáo du nhập vào Việt Nam từ","options":["A. thế kỉ XVI.","B. thế kỉ XX.","C. thời nguyên thủy.","D. thời Văn Lang."],"answer":"A","explain":"Công giáo (Thiên Chúa giáo) du nhập vào Việt Nam từ thế kỉ XVI qua các giáo sĩ phương Tây.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm chung của các tôn giáo ở Việt Nam là","options":["A. đều hướng con người đến chân – thiện – mĩ.","B. đều giống hệt nhau.","C. đều cấm tín ngưỡng bản địa.","D. không có điểm chung."],"answer":"A","explain":"Các tôn giáo đều có giá trị đạo đức, hướng con người đến điều tốt đẹp và hòa hợp với văn hóa Việt.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói “54 dân tộc là 54 bông hoa trong vườn hoa văn hóa Việt Nam”?","options":["A. Vì mỗi dân tộc góp một sắc màu riêng làm rực rỡ văn hóa dân tộc.","B. Vì chỉ có hoa, không có văn hóa.","C. Vì các dân tộc giống hệt nhau.","D. Vì văn hóa không quan trọng."],"answer":"A","explain":"Mỗi dân tộc với bản sắc riêng cùng tạo nên vườn hoa văn hóa Việt Nam đa sắc, thống nhất.","points":0.25},{"type":"mcq","level":"VD","q":"So sánh đời sống vật chất và tinh thần, điểm nào KHÔNG đúng?","options":["A. Đời sống tinh thần không phụ thuộc vào vật chất.","B. Đời sống vật chất là nền tảng của đời sống tinh thần.","C. Cả hai đều mang bản sắc tộc người.","D. Cả hai đều biến đổi theo thời gian."],"answer":"A","explain":"Đời sống vật chất là nền tảng; khi vật chất phát triển, đời sống tinh thần cũng phong phú hơn.","points":0.25},{"type":"mcq","level":"VDC","q":"Trách nhiệm của học sinh trong bảo tồn văn hóa các dân tộc là","options":["A. tìm hiểu, tôn trọng, quảng bá và không làm tổn hại di sản.","B. không quan tâm.","C. phá hoại di tích.","D. chỉ học văn hóa nước ngoài."],"answer":"A","explain":"Học sinh cần tìm hiểu, tôn trọng văn hóa các dân tộc anh em và tham gia bảo tồn di sản.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhóm Kađai thuộc ngữ hệ Thái – Kađai.","b) Công giáo du nhập từ thế kỉ XVI.","c) Mỗi dân tộc góp sắc màu riêng cho văn hóa Việt.","d) Học sinh cần tham gia bảo tồn văn hóa."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đời sống vật chất là nền tảng của đời sống tinh thần.","b) Văn hóa các dân tộc đều biến đổi theo thời gian.","c) Đời sống tinh thần tách rời hoàn toàn vật chất.","d) Cần giữ gìn bản sắc trong hội nhập."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: vật chất và tinh thần có mối quan hệ gắn bó.","points":1},{"type":"short","level":"VD","q":"Tôn giáo nào du nhập vào Việt Nam từ thế kỉ XVI qua các giáo sĩ phương Tây (ghi 2 chữ)?","answer":"Công giáo","explain":"Công giáo du nhập từ thế kỉ XVI, phát triển mạnh ở nhiều vùng.","points":0.5},{"type":"short","level":"VDC","q":"Cộng đồng các dân tộc Việt Nam có bao nhiêu ngữ hệ (ghi số)?","answer":"5","explain":"54 dân tộc thuộc 5 ngữ hệ: Nam Á, Thái – Kađai, Mông – Dao, Nam Đảo, Hán – Tạng.","points":0.5}]}]}</script>
