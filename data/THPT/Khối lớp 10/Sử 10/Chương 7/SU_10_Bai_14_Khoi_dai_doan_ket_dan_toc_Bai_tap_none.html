<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Khối đại đoàn kết dân tộc Việt Nam hình thành từ thời kì nào?","options":["A. Thời Văn Lang – Âu Lạc.","B. Thời Pháp thuộc.","C. Thời đổi mới.","D. Thế kỉ XXI."],"answer":"A","explain":"SGK nêu khối đoàn kết dân tộc đã hình thành từ rất sớm, từ thời dựng nước Văn Lang – Âu Lạc.","points":0.25},{"type":"mcq","level":"NB","q":"Hội nghị Diên Hồng được tổ chức năm nào?","options":["A. Năm 1284.","B. Năm 938.","C. Năm 1930.","D. Năm 1945."],"answer":"A","explain":"Năm 1284, vua Trần Nhân Tông mở Hội nghị Diên Hồng hỏi ý kiến các bô lão về kế đánh giặc Nguyên – Mông.","points":0.25},{"type":"mcq","level":"TH","q":"Cơ sở hình thành khối đại đoàn kết dân tộc KHÔNG bao gồm","options":["A. sự chia rẽ giữa các dân tộc.","B. tình yêu quê hương, đất nước.","C. yêu cầu trị thủy, làm thủy lợi.","D. yêu cầu chống ngoại xâm."],"answer":"A","explain":"Ba cơ sở hình thành là: yêu nước, trị thủy và chống ngoại xâm; sự chia rẽ không phải cơ sở.","points":0.25},{"type":"mcq","level":"TH","q":"Hội Phản đế đồng minh được thành lập ngày nào?","options":["A. 18/11/1930.","B. 3/2/1930.","C. 2/9/1945.","D. 19/5/1941."],"answer":"A","explain":"Ngày 18/11/1930, Hội Phản đế đồng minh – tổ chức tiền thân của Mặt trận Tổ quốc Việt Nam – được thành lập.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao yêu cầu trị thủy góp phần hình thành tinh thần đoàn kết?","options":["A. Vì đắp đê, làm thủy lợi đòi hỏi sức mạnh tập thể của cả cộng đồng.","B. Vì trị thủy là việc của một người.","C. Vì không cần đoàn kết vẫn trị thủy được.","D. Vì trị thủy gây chia rẽ."],"answer":"A","explain":"Nghề lúa nước cần thủy lợi; đắp đê, đào kênh là công việc lớn, buộc cộng đồng phải “chung lưng đấu cật”.","points":0.25},{"type":"mcq","level":"VDC","q":"Câu nói “đoàn kết, đoàn kết, đại đoàn kết; thành công, thành công, đại thành công” nhấn mạnh","options":["A. vai trò quyết định của đoàn kết đối với thắng lợi.","B. đoàn kết chỉ cần trong chiến tranh.","C. không cần đoàn kết.","D. đoàn kết gây thất bại."],"answer":"A","explain":"Đây là lời dạy của Chủ tịch Hồ Chí Minh, khẳng định đoàn kết là nhân tố quyết định mọi thắng lợi.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Khối đoàn kết hình thành từ thời Văn Lang – Âu Lạc.","b) Hội nghị Diên Hồng tổ chức năm 1284.","c) Hội Phản đế đồng minh thành lập 18/11/1930.","d) Khối đoàn kết chỉ hình thành sau năm 1945."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: khối đoàn kết đã hình thành từ thời dựng nước.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Yêu cầu trị thủy góp phần hình thành đoàn kết.","b) Chống ngoại xâm đòi hỏi tập hợp lực lượng.","c) Tình yêu quê hương là cơ sở của đoàn kết.","d) Đoàn kết không có vai trò trong lịch sử."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: đoàn kết có vai trò to lớn trong lịch sử dân tộc.","points":1},{"type":"short","level":"VD","q":"Hội nghị nào năm 1284 thể hiện ý chí đoàn kết toàn dân đánh giặc Nguyên – Mông (ghi 2 chữ)?","answer":"Diên Hồng","explain":"Hội nghị Diên Hồng (1284): các bô lão đồng thanh hô “đánh” – ý chí quyết chiến của toàn dân.","points":0.5},{"type":"short","level":"VDC","q":"Tổ chức tiền thân của Mặt trận Tổ quốc Việt Nam, thành lập 18/11/1930, có tên là gì (ghi 4 chữ)?","answer":"Hội Phản đế đồng minh","explain":"Hội Phản đế đồng minh (18/11/1930) là tổ chức tiền thân của Mặt trận Tổ quốc Việt Nam.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Vai trò của khối đại đoàn kết trong chống ngoại xâm là","options":["A. nhân tố quan trọng, quyết định thắng lợi.","B. không có vai trò gì.","C. nhân tố gây thất bại.","D. chỉ có vai trò nhỏ."],"answer":"A","explain":"SGK khẳng định khối đại đoàn kết là nhân tố quan trọng, quyết định thắng lợi của các cuộc chống ngoại xâm.","points":0.25},{"type":"mcq","level":"NB","q":"Khối đại đoàn kết các dân tộc hiện nay tập trung trong tổ chức nào?","options":["A. Mặt trận Tổ quốc Việt Nam.","B. Hội Nông dân.","C. Đoàn Thanh niên.","D. Hội Phụ nữ."],"answer":"A","explain":"Khối đại đoàn kết được thể hiện tập trung trong Mặt trận Tổ quốc Việt Nam.","points":0.25},{"type":"mcq","level":"TH","q":"Thời phong kiến, các triều đại xây dựng khối đoàn kết bằng cách","options":["A. phong tước, gả công chúa cho thủ lĩnh miền núi.","B. đàn áp các dân tộc.","C. cấm giao lưu.","D. chia rẽ các dân tộc."],"answer":"A","explain":"Các triều đại phong tước, gả công chúa cho thủ lĩnh người dân tộc vùng biên giới để củng cố đoàn kết.","points":0.25},{"type":"mcq","level":"TH","q":"Từ khi Đảng Cộng sản Việt Nam thành lập (1930), khối đoàn kết","options":["A. ngày càng được củng cố, mở rộng.","B. bị xóa bỏ.","C. không thay đổi.","D. bị chia rẽ."],"answer":"A","explain":"Từ 1930, Đảng lãnh đạo củng cố, mở rộng khối đại đoàn kết toàn dân tộc.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao nói đoàn kết là “sức mạnh vô địch” của dân tộc?","options":["A. Vì đã nhiều lần giúp dân tộc thắng kẻ thù mạnh hơn.","B. Vì đoàn kết chỉ là khẩu hiệu.","C. Vì không cần vũ khí.","D. Vì đoàn kết gây yếu đuối."],"answer":"A","explain":"Lịch sử chứng minh: đoàn kết toàn dân đã giúp ta thắng các đế quốc hùng mạnh (Nguyên – Mông, Pháp, Mỹ...).","points":0.25},{"type":"mcq","level":"VDC","q":"Kẻ thù luôn tìm cách chia rẽ khối đoàn kết vì","options":["A. đoàn kết làm nên sức mạnh, chia rẽ làm suy yếu dân tộc.","B. chia rẽ giúp dân tộc mạnh.","C. không có lí do.","D. chia rẽ mang lại hòa bình."],"answer":"A","explain":"“Chia để trị” là thủ đoạn của kẻ thù vì chúng hiểu sức mạnh của khối đoàn kết dân tộc.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đoàn kết là nhân tố quyết định thắng lợi chống ngoại xâm.","b) Mặt trận Tổ quốc là nơi tập hợp khối đoàn kết.","c) Từ 1930, khối đoàn kết được củng cố, mở rộng.","d) Kẻ thù không bao giờ chia rẽ dân tộc ta."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: kẻ thù luôn dùng thủ đoạn “chia để trị”.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thời phong kiến có chính sách đoàn kết các dân tộc.","b) Hội nghị Diên Hồng thể hiện ý chí toàn dân.","c) Đoàn kết giúp thắng kẻ thù mạnh hơn.","d) Chia rẽ làm dân tộc mạnh lên."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chia rẽ làm suy yếu dân tộc.","points":1},{"type":"short","level":"VD","q":"Tổ chức nào hiện nay là nơi tập hợp khối đại đoàn kết toàn dân tộc (ghi 5 chữ)?","answer":"Mặt trận Tổ quốc Việt Nam","explain":"Mặt trận Tổ quốc Việt Nam là tổ chức tập hợp khối đại đoàn kết toàn dân tộc.","points":0.5},{"type":"short","level":"VDC","q":"Năm nào Đảng Cộng sản Việt Nam được thành lập (ghi số)?","answer":"1930","explain":"Đảng Cộng sản Việt Nam thành lập ngày 3/2/1930, lãnh đạo khối đại đoàn kết dân tộc.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Trong hơn 1000 năm Bắc thuộc, khối đoàn kết dân tộc","options":["A. ngày càng được củng cố qua đấu tranh.","B. bị xóa bỏ hoàn toàn.","C. không tồn tại.","D. chỉ có ở miền Nam."],"answer":"A","explain":"SGK nêu khối đoàn kết ngày càng được củng cố qua cuộc đấu tranh bền bỉ trong hơn 1000 năm Bắc thuộc.","points":0.25},{"type":"mcq","level":"NB","q":"Vai trò của đoàn kết trong sự nghiệp hiện nay là","options":["A. cơ sở huy động sức mạnh toàn dân tộc.","B. không còn cần thiết.","C. chỉ cần trong chiến tranh.","D. gây cản trở phát triển."],"answer":"A","explain":"Ngày nay, đoàn kết là cơ sở huy động sức mạnh toàn dân tộc trong phát triển kinh tế – văn hóa, bảo vệ Tổ quốc.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu hiện của đoàn kết trong lao động sản xuất là","options":["A. cùng nhau trị thủy, khai hoang, xây dựng quê hương.","B. làm việc riêng lẻ.","C. tranh giành đất đai.","D. không giúp đỡ nhau."],"answer":"A","explain":"Trong lao động, nhân dân cùng nhau đắp đê, đào kênh, khai hoang – biểu hiện sinh động của tinh thần đoàn kết.","points":0.25},{"type":"mcq","level":"TH","q":"Chính sách dân tộc của Đảng và Nhà nước là","options":["A. bình đẳng, đoàn kết, giúp nhau cùng phát triển.","B. ưu tiên một dân tộc.","C. đồng hóa các dân tộc.","D. bỏ mặc vùng dân tộc."],"answer":"A","explain":"Chính sách dân tộc: bình đẳng, đoàn kết, tương trợ, giúp nhau cùng phát triển.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao các chương trình xóa đói giảm nghèo vùng dân tộc góp phần củng cố đoàn kết?","options":["A. Vì nâng cao đời sống, củng cố niềm tin của đồng bào.","B. Vì làm giàu cho một nhóm.","C. Vì không cần thiết.","D. Vì gây chia rẽ."],"answer":"A","explain":"Đời sống được cải thiện, đồng bào thêm tin tưởng vào Đảng, Nhà nước, gắn bó với cộng đồng dân tộc.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong thời đại toàn cầu hóa, đoàn kết dân tộc cần gắn với","options":["A. hội nhập quốc tế nhưng giữ vững độc lập, bản sắc.","B. đóng cửa với thế giới.","C. từ bỏ bản sắc.","D. phụ thuộc nước ngoài."],"answer":"A","explain":"Đoàn kết trong hội nhập: mở cửa, hợp tác nhưng giữ vững độc lập, chủ quyền và bản sắc dân tộc.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đoàn kết được củng cố qua 1000 năm Bắc thuộc.","b) Ngày nay đoàn kết là cơ sở huy động sức mạnh toàn dân.","c) Chính sách dân tộc là bình đẳng, đoàn kết.","d) Không cần chính sách với vùng dân tộc."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cần đầu tư phát triển vùng đồng bào dân tộc.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cùng trị thủy là biểu hiện đoàn kết trong lao động.","b) Xóa đói giảm nghèo củng cố niềm tin của đồng bào.","c) Hội nhập cần giữ vững bản sắc.","d) Đoàn kết chỉ cần trong quá khứ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đoàn kết luôn cần thiết, cả hiện tại và tương lai.","points":1},{"type":"short","level":"VD","q":"Chính sách của Đảng đối với các dân tộc là bình đẳng, đoàn kết và gì nữa (ghi 2 chữ)?","answer":"Cùng phát triển","explain":"Chính sách dân tộc: bình đẳng, đoàn kết, tương trợ, giúp nhau cùng phát triển.","points":0.5},{"type":"short","level":"VDC","q":"Hội nghị Diên Hồng năm 1284 được triệu tập để bàn kế đánh giặc nào (ghi 2 chữ)?","answer":"Nguyên – Mông","explain":"Hội nghị Diên Hồng (1284) bàn kế chống quân Nguyên – Mông xâm lược lần thứ hai.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Truyền thuyết nào thể hiện ý thức về cội nguồn chung của dân tộc?","options":["A. Con Rồng cháu Tiên.","B. Thánh Gióng.","C. Sơn Tinh – Thủy Tinh.","D. An Dương Vương."],"answer":"A","explain":"Truyền thuyết con Rồng cháu Tiên (Lạc Long Quân – Âu Cơ) thể hiện ý thức về cội nguồn chung của dân tộc Việt Nam.","points":0.25},{"type":"mcq","level":"NB","q":"Thắng lợi nào sau đây gắn với sức mạnh đoàn kết toàn dân tộc?","options":["A. Chiến thắng Bạch Đằng (1288).","B. Thất bại ở mọi mặt trận.","C. Sự chia rẽ đất nước.","D. Đầu hàng ngoại xâm."],"answer":"A","explain":"Chiến thắng Bạch Đằng (1288) và mọi thắng lợi lớn đều gắn với sức mạnh đoàn kết toàn dân tộc.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Hội nghị Diên Hồng là biểu tượng của khối đại đoàn kết?","options":["A. Vì thể hiện ý chí thống nhất của toàn dân từ vua đến bô lão.","B. Vì chỉ có vua quyết định.","C. Vì không ai tham dự.","D. Vì bàn việc đầu hàng."],"answer":"A","explain":"Diên Hồng hỏi ý kiến các bô lão cả nước, tất cả đồng thanh “đánh” – ý chí đoàn kết từ triều đình đến nhân dân.","points":0.25},{"type":"mcq","level":"TH","q":"Trong kháng chiến chống Pháp và chống Mỹ, sức mạnh nào là quyết định?","options":["A. Sức mạnh đoàn kết toàn dân tộc.","B. Viện trợ nước ngoài duy nhất.","C. Vũ khí hiện đại duy nhất.","D. Địa hình duy nhất."],"answer":"A","explain":"Dù vũ khí thô sơ, nhờ đoàn kết toàn dân tộc, ta đã thắng hai đế quốc hùng mạnh.","points":0.25},{"type":"mcq","level":"VD","q":"So sánh vai trò đoàn kết thời phong kiến và hiện nay:","options":["A. đều là nhân tố quyết định, nhưng hiện nay mở rộng sang xây dựng đất nước.","B. hiện nay không cần đoàn kết.","C. thời phong kiến không cần đoàn kết.","D. hoàn toàn khác nhau."],"answer":"A","explain":"Xưa đoàn kết để chống ngoại xâm; nay đoàn kết vừa bảo vệ Tổ quốc, vừa phát triển kinh tế – văn hóa, hội nhập.","points":0.25},{"type":"mcq","level":"VDC","q":"Học sinh thể hiện tinh thần đoàn kết bằng việc","options":["A. giúp đỡ bạn bè, tôn trọng sự khác biệt, tham gia hoạt động tập thể.","B. chia bè phái.","C. kì thị bạn khác dân tộc.","D. chỉ lo cho bản thân."],"answer":"A","explain":"Đoàn kết bắt đầu từ những việc nhỏ: giúp đỡ, tôn trọng, sẻ chia trong học tập và cuộc sống.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Truyền thuyết con Rồng cháu Tiên thể hiện cội nguồn chung.","b) Mọi thắng lợi lớn đều gắn với đoàn kết toàn dân.","c) Diên Hồng thể hiện ý chí thống nhất toàn dân.","d) Đoàn kết không liên quan đến thắng lợi."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đoàn kết là nhân tố quyết định thắng lợi.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đoàn kết xưa để chống ngoại xâm, nay để xây dựng đất nước.","b) Học sinh cần giúp đỡ, tôn trọng bạn bè.","c) Chia bè phái là biểu hiện đoàn kết.","d) Kì thị dân tộc khác là sai."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: chia bè phái đi ngược tinh thần đoàn kết.","points":1},{"type":"short","level":"VD","q":"Truyền thuyết nào kể về nguồn gốc “con Rồng cháu Tiên” của dân tộc (ghi 5 chữ)?","answer":"Con Rồng cháu Tiên","explain":"Truyền thuyết Lạc Long Quân – Âu Cơ sinh ra bọc trăm trứng – nguồn gốc con Rồng cháu Tiên.","points":0.5},{"type":"short","level":"VDC","q":"Ai là người đã dạy: “Đoàn kết, đoàn kết, đại đoàn kết; thành công, thành công, đại thành công” (ghi 3 chữ)?","answer":"Hồ Chí Minh","explain":"Chủ tịch Hồ Chí Minh luôn nhấn mạnh vai trò quyết định của khối đại đoàn kết toàn dân tộc.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Ngày nay, đoàn kết dân tộc góp phần vào lĩnh vực nào?","options":["A. Phát triển kinh tế, giữ vững an ninh, bảo vệ chủ quyền.","B. Chỉ trong lễ hội.","C. Không lĩnh vực nào.","D. Chỉ trong thể thao."],"answer":"A","explain":"Đoàn kết là cơ sở huy động sức mạnh toàn dân tộc trong phát triển kinh tế – văn hóa, an ninh quốc phòng.","points":0.25},{"type":"mcq","level":"NB","q":"Biểu hiện đoàn kết trong đời sống cộng đồng hiện nay là","options":["A. ủng hộ đồng bào khó khăn, thiên tai.","B. thờ ơ với người khác.","C. tranh giành lợi ích.","D. kì thị vùng miền."],"answer":"A","explain":"Phong trào ủng hộ đồng bào lũ lụt, khó khăn; hội đồng hương, hội phụ nữ... là biểu hiện sinh động của đoàn kết.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải củng cố địa bàn chiến lược, vùng biên giới?","options":["A. Vì đó là phên dậu của Tổ quốc, cần sức mạnh toàn dân bảo vệ.","B. Vì không quan trọng.","C. Vì chỉ để phát triển du lịch.","D. Vì biên giới không cần bảo vệ."],"answer":"A","explain":"Vùng biên giới, hải đảo là địa bàn chiến lược; đoàn kết các dân tộc nơi đây góp phần giữ vững chủ quyền.","points":0.25},{"type":"mcq","level":"TH","q":"Việc bảo tồn văn hóa các dân tộc góp phần","options":["A. củng cố đoàn kết, làm phong phú văn hóa dân tộc.","B. gây chia rẽ.","C. làm nghèo văn hóa.","D. không có tác dụng."],"answer":"A","explain":"Tôn trọng, bảo tồn văn hóa mỗi dân tộc làm các dân tộc thêm gắn bó, văn hóa dân tộc thêm rực rỡ.","points":0.25},{"type":"mcq","level":"VD","q":"Mối quan hệ giữa phát triển kinh tế vùng dân tộc và đoàn kết là","options":["A. kinh tế phát triển, đời sống nâng cao thì đoàn kết càng bền vững.","B. không liên quan.","C. kinh tế phát triển gây chia rẽ.","D. chỉ cần kinh tế, không cần đoàn kết."],"answer":"A","explain":"Xóa đói giảm nghèo, nâng cao đời sống đồng bào củng cố niềm tin, gắn bó – nền tảng của đoàn kết.","points":0.25},{"type":"mcq","level":"VDC","q":"Trước luận điệu chia rẽ dân tộc, mỗi công dân cần","options":["A. tỉnh táo, không nghe theo, bảo vệ khối đoàn kết.","B. tin theo ngay.","C. thờ ơ.","D. chia sẻ luận điệu đó."],"answer":"A","explain":"Cần cảnh giác trước các luận điệu chia rẽ, xuyên tạc; tin tưởng vào chính sách dân tộc của Đảng, Nhà nước.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đoàn kết góp phần phát triển kinh tế, bảo vệ chủ quyền.","b) Ủng hộ đồng bào khó khăn là biểu hiện đoàn kết.","c) Cần củng cố vùng biên giới, hải đảo.","d) Bảo tồn văn hóa gây chia rẽ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: bảo tồn văn hóa củng cố đoàn kết.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Kinh tế phát triển củng cố đoàn kết.","b) Cần cảnh giác luận điệu chia rẽ.","c) Nên tin theo luận điệu xuyên tạc.","d) Đoàn kết cần đi đôi với phát triển."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: phải tỉnh táo, không nghe theo luận điệu chia rẽ.","points":1},{"type":"short","level":"VD","q":"Vùng nào được coi là “phên dậu” của Tổ quốc, cần củng cố đoàn kết để bảo vệ (ghi 2 chữ)?","answer":"Biên giới","explain":"Vùng biên giới, hải đảo là địa bàn chiến lược, phên dậu của Tổ quốc.","points":0.5},{"type":"short","level":"VDC","q":"Phong trào nào thể hiện đoàn kết khi đồng bào gặp thiên tai, khó khăn (ghi 4 chữ)?","answer":"Ủng hộ đồng bào","explain":"Phong trào ủng hộ đồng bào bị thiên tai, khó khăn là biểu hiện sinh động của tinh thần đoàn kết.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Câu ca dao “Nhiễu điều phủ lấy giá gương / Người trong một nước phải thương nhau cùng” nói về","options":["A. tinh thần đoàn kết, tương thân tương ái.","B. nghề dệt vải.","C. buôn bán.","D. chiến tranh."],"answer":"A","explain":"Câu ca dao thể hiện truyền thống đoàn kết, tương thân tương ái của dân tộc Việt Nam.","points":0.25},{"type":"mcq","level":"NB","q":"Ngày thành lập Hội Phản đế đồng minh là","options":["A. 18/11/1930.","B. 3/2/1930.","C. 2/9/1945.","D. 19/8/1945."],"answer":"A","explain":"Ngày 18/11/1930 – ngày truyền thống của Mặt trận Tổ quốc Việt Nam.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Đảng Cộng sản Việt Nam coi đoàn kết là chiến lược?","options":["A. Vì đoàn kết tạo nên sức mạnh vô địch của cách mạng.","B. Vì không có đường lối khác.","C. Vì đoàn kết chỉ là hình thức.","D. Vì muốn tập trung quyền lực."],"answer":"A","explain":"Đảng xác định đại đoàn kết toàn dân tộc là đường lối chiến lược, tạo sức mạnh để thắng lợi.","points":0.25},{"type":"mcq","level":"TH","q":"Mặt trận Tổ quốc Việt Nam có nhiệm vụ","options":["A. tập hợp, đoàn kết mọi tầng lớp nhân dân.","B. chỉ tập hợp công nhân.","C. chỉ hoạt động ở thành phố.","D. thay thế chính quyền."],"answer":"A","explain":"Mặt trận Tổ quốc là tổ chức liên minh chính trị, tập hợp mọi tổ chức, cá nhân yêu nước.","points":0.25},{"type":"mcq","level":"VD","q":"So sánh Hội Phản đế đồng minh (1930) và Mặt trận Tổ quốc (nay):","options":["A. cùng là tổ chức mặt trận đoàn kết, tên gọi thay đổi theo thời kì.","B. hoàn toàn khác nhau.","C. không liên quan.","D. đối lập nhau."],"answer":"A","explain":"Từ Hội Phản đế đồng minh (1930) qua các thời kì đổi tên, nay là Mặt trận Tổ quốc – mạch nguồn đoàn kết liên tục.","points":0.25},{"type":"mcq","level":"VDC","q":"Để xây dựng khối đoàn kết trong lớp học đa dân tộc, cần","options":["A. tôn trọng, giúp đỡ nhau, không kì thị.","B. chia nhóm theo dân tộc.","C. chỉ chơi với cùng dân tộc.","D. chê bai văn hóa bạn."],"answer":"A","explain":"Đoàn kết bắt đầu từ lớp học: tôn trọng sự khác biệt, giúp đỡ nhau cùng tiến bộ.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ca dao “Nhiễu điều...” nói về đoàn kết.","b) 18/11/1930 là ngày truyền thống Mặt trận Tổ quốc.","c) Đảng coi đoàn kết là đường lối chiến lược.","d) Mặt trận Tổ quốc tập hợp mọi tầng lớp nhân dân."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mặt trận Tổ quốc kế thừa Hội Phản đế đồng minh.","b) Trong lớp học cần tôn trọng, giúp đỡ nhau.","c) Nên chia nhóm theo dân tộc.","d) Kì thị bạn khác dân tộc là sai."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: chia nhóm theo dân tộc đi ngược tinh thần đoàn kết.","points":1},{"type":"short","level":"VD","q":"Ngày 18/11 hằng năm là ngày truyền thống của tổ chức nào (ghi 5 chữ)?","answer":"Mặt trận Tổ quốc Việt Nam","explain":"18/11/1930 – ngày thành lập Hội Phản đế đồng minh, nay là ngày truyền thống Mặt trận Tổ quốc.","points":0.5},{"type":"short","level":"VDC","q":"Hoàn thành câu ca dao: “Nhiễu điều phủ lấy giá gương / ...” (ghi 9 chữ)?","answer":"Người trong một nước phải thương nhau cùng","explain":"Câu ca dao thể hiện truyền thống đoàn kết, tương thân tương ái của dân tộc.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Trong lịch sử, khi nào khối đoàn kết phát huy cao nhất?","options":["A. Khi đất nước bị xâm lược, cần tập hợp lực lượng.","B. Khi hòa bình, không cần đoàn kết.","C. Khi các dân tộc chia rẽ.","D. Không bao giờ."],"answer":"A","explain":"Trước họa ngoại xâm, tinh thần đoàn kết toàn dân tộc được phát huy cao nhất để bảo vệ Tổ quốc.","points":0.25},{"type":"mcq","level":"NB","q":"Ai là người sáng lập Đảng Cộng sản Việt Nam?","options":["A. Nguyễn Ái Quốc – Hồ Chí Minh.","B. Trần Phú.","C. Lê Hồng Phong.","D. Nguyễn Văn Cừ."],"answer":"A","explain":"Nguyễn Ái Quốc (Hồ Chí Minh) sáng lập Đảng Cộng sản Việt Nam ngày 3/2/1930.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói “giặc đến nhà đàn bà cũng đánh” thể hiện đoàn kết?","options":["A. Vì mọi người dân, không phân biệt, đều tham gia bảo vệ Tổ quốc.","B. Vì chỉ phụ nữ đánh giặc.","C. Vì đàn ông không đánh giặc.","D. Vì câu nói không có ý nghĩa."],"answer":"A","explain":"Câu nói thể hiện toàn dân đánh giặc – sức mạnh đoàn kết không phân biệt giới tính, tuổi tác.","points":0.25},{"type":"mcq","level":"TH","q":"Chính sách nào thể hiện sự quan tâm đến đồng bào dân tộc?","options":["A. Đầu tư trường học, y tế, xóa đói giảm nghèo vùng cao.","B. Bỏ mặc vùng cao.","C. Cấm đồng bào đi học.","D. Thu thuế nặng vùng dân tộc."],"answer":"A","explain":"Nhà nước đầu tư phát triển kinh tế – xã hội vùng đồng bào dân tộc thiểu số, miền núi.","points":0.25},{"type":"mcq","level":"VD","q":"Phân tích mối quan hệ giữa độc lập dân tộc và đoàn kết:","options":["A. đoàn kết để giành độc lập; độc lập để đoàn kết bền vững.","B. không liên quan.","C. độc lập gây chia rẽ.","D. đoàn kết làm mất độc lập."],"answer":"A","explain":"Đoàn kết là sức mạnh giành độc lập; nền độc lập vững chắc lại củng cố khối đoàn kết – quan hệ biện chứng.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong bối cảnh hiện nay, thanh niên góp phần đoàn kết bằng cách","options":["A. học tập tốt, tôn trọng đa dạng văn hóa, tham gia tình nguyện.","B. sống ích kỉ.","C. kì thị người khác.","D. không quan tâm xã hội."],"answer":"A","explain":"Thanh niên góp phần bằng học tập, tình nguyện, tôn trọng văn hóa các dân tộc anh em.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Khi bị xâm lược, đoàn kết phát huy cao nhất.","b) Nguyễn Ái Quốc sáng lập Đảng Cộng sản Việt Nam.","c) Nhà nước đầu tư phát triển vùng dân tộc.","d) Thanh niên cần tham gia tình nguyện."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) “Giặc đến nhà đàn bà cũng đánh” thể hiện toàn dân đánh giặc.","b) Độc lập và đoàn kết có quan hệ gắn bó.","c) Thanh niên nên sống ích kỉ.","d) Cần tôn trọng đa dạng văn hóa."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: thanh niên cần sống có trách nhiệm với cộng đồng.","points":1},{"type":"short","level":"VD","q":"Đảng Cộng sản Việt Nam được thành lập ngày mấy tháng 2 năm 1930 (ghi dạng: 3/2/1930)?","answer":"3/2/1930","explain":"Ngày 3/2/1930, Đảng Cộng sản Việt Nam được thành lập.","points":0.5},{"type":"short","level":"VDC","q":"Câu nói “Giặc đến nhà đàn bà cũng đánh” thể hiện sức mạnh nào của dân tộc (ghi 2 chữ)?","answer":"Đoàn kết","explain":"Toàn dân đánh giặc – biểu hiện cao nhất của khối đại đoàn kết dân tộc.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Nội dung nào phản ánh đúng vai trò của đoàn kết hiện nay?","options":["A. Là cơ sở huy động sức mạnh toàn dân tộc.","B. Là nền tảng liên minh với láng giềng.","C. Là cơ sở xóa bỏ mọi mâu thuẫn.","D. Là cơ sở tiếp thu văn hóa ngoại."],"answer":"A","explain":"SGK nêu: đoàn kết là cơ sở huy động sức mạnh toàn dân tộc trong phát triển kinh tế – văn hóa, bảo vệ Tổ quốc.","points":0.25},{"type":"mcq","level":"NB","q":"Một trong những nhân tố quyết định thắng lợi của sự nghiệp giải phóng dân tộc là","options":["A. sức mạnh của khối đại đoàn kết dân tộc.","B. sự viện trợ duy nhất.","C. xu thế toàn cầu hóa.","D. cục diện đa cực."],"answer":"A","explain":"Sức mạnh đoàn kết toàn dân tộc là nhân tố quan trọng quyết định thắng lợi của cách mạng Việt Nam.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao thời phong kiến các vua quan tâm đến các dân tộc miền núi?","options":["A. Vì miền núi là phên dậu, cần đoàn kết để bảo vệ biên cương.","B. Vì muốn bóc lột.","C. Vì không quan tâm.","D. Vì muốn chia rẽ."],"answer":"A","explain":"Vùng biên giới là phên dậu; các triều đại phong tước, gả công chúa cho thủ lĩnh để củng cố đoàn kết, giữ yên biên cương.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu hiện nào KHÔNG phải của tinh thần đoàn kết?","options":["A. Kì thị dân tộc.","B. Giúp đỡ nhau lúc khó khăn.","C. Tôn trọng văn hóa nhau.","D. Cùng nhau bảo vệ Tổ quốc."],"answer":"A","explain":"Kì thị dân tộc đi ngược lại tinh thần đoàn kết; các biểu hiện còn lại đều đúng.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao các thế lực thù địch luôn chống phá khối đoàn kết?","options":["A. Vì đoàn kết làm nên sức mạnh, khó bị đánh bại.","B. Vì đoàn kết gây yếu.","C. Vì không có lí do.","D. Vì đoàn kết gây chiến tranh."],"answer":"A","explain":"Kẻ thù hiểu “chia để trị” sẽ làm suy yếu dân tộc nên luôn tìm cách chia rẽ khối đoàn kết.","points":0.25},{"type":"mcq","level":"VDC","q":"Để bảo vệ khối đoàn kết trên không gian mạng, cần","options":["A. tỉnh táo trước tin giả, không chia sẻ luận điệu chia rẽ.","B. chia sẻ mọi tin chưa kiểm chứng.","C. tin mọi luận điệu trên mạng.","D. không dùng mạng xã hội."],"answer":"A","explain":"Cần cảnh giác tin giả, luận điệu xuyên tạc chia rẽ dân tộc trên mạng xã hội.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đoàn kết là cơ sở huy động sức mạnh toàn dân.","b) Miền núi là phên dậu của Tổ quốc.","c) Kì thị dân tộc đi ngược đoàn kết.","d) Kẻ thù luôn muốn chia rẽ dân tộc ta."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cần tỉnh táo trước tin giả chia rẽ.","b) Không nên chia sẻ luận điệu xuyên tạc.","c) Nên tin mọi tin trên mạng.","d) Bảo vệ đoàn kết là trách nhiệm công dân."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: phải kiểm chứng, không tin theo tin giả.","points":1},{"type":"short","level":"VD","q":"Thủ đoạn “chia để trị” của kẻ thù nhằm vào khối nào của dân tộc (ghi 4 chữ)?","answer":"Đại đoàn kết dân tộc","explain":"Kẻ thù dùng “chia để trị” để phá hoại khối đại đoàn kết dân tộc.","points":0.5},{"type":"short","level":"VDC","q":"Theo SGK, trong chống ngoại xâm, đoàn kết là nhân tố quan trọng và gì nữa (ghi 2 chữ)?","answer":"Quyết định","explain":"SGK: khối đại đoàn kết là nhân tố quan trọng, quyết định thắng lợi của chống ngoại xâm.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Khối đại đoàn kết dân tộc có truyền thống từ","options":["A. nhà nước Văn Lang – Âu Lạc.","B. thời Pháp thuộc.","C. thời đổi mới.","D. thế kỉ XXI."],"answer":"A","explain":"Truyền thống đoàn kết có từ nhà nước Văn Lang – Âu Lạc, phát triển qua các cuộc chiến tranh bảo vệ Tổ quốc.","points":0.25},{"type":"mcq","level":"NB","q":"Việc trồng lúa nước đòi hỏi nhân dân","options":["A. “chung lưng đấu cật” làm thủy lợi.","B. làm việc riêng lẻ.","C. không cần hợp tác.","D. tranh giành nước."],"answer":"A","explain":"SGK nêu việc trồng lúa nước yêu cầu nhân dân cùng nhau “chung lưng đấu cật” xây dựng thủy lợi, đê điều.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói đoàn kết là truyền thống quý báu?","options":["A. Vì được hun đúc qua hàng nghìn năm, nhiều lần cứu nước.","B. Vì mới xuất hiện.","C. Vì không có giá trị.","D. Vì chỉ là khẩu hiệu."],"answer":"A","explain":"Truyền thống đoàn kết được hun đúc qua hàng nghìn năm dựng nước, giữ nước và nhiều lần phát huy tác dụng.","points":0.25},{"type":"mcq","level":"TH","q":"Trong thời bình, đoàn kết thể hiện ở","options":["A. cùng nhau xây dựng quê hương, giúp đỡ nhau.","B. không cần thiết.","C. chỉ lo việc riêng.","D. tranh chấp."],"answer":"A","explain":"Thời bình, đoàn kết thể hiện trong lao động sản xuất, xây dựng quê hương, tương trợ cộng đồng.","points":0.25},{"type":"mcq","level":"VD","q":"Mối quan hệ giữa đoàn kết dân tộc và bảo vệ chủ quyền là","options":["A. đoàn kết tạo sức mạnh bảo vệ chủ quyền; chủ quyền vững chắc củng cố đoàn kết.","B. không liên quan.","C. đoàn kết làm mất chủ quyền.","D. chỉ cần quân đội."],"answer":"A","explain":"Toàn dân đoàn kết là nền tảng của thế trận quốc phòng toàn dân, bảo vệ vững chắc chủ quyền.","points":0.25},{"type":"mcq","level":"VDC","q":"Từ Bài 14, thông điệp gửi đến thế hệ trẻ là","options":["A. phát huy truyền thống đoàn kết, xây dựng và bảo vệ Tổ quốc.","B. quên truyền thống.","C. sống ích kỉ.","D. không cần học lịch sử."],"answer":"A","explain":"Thế hệ trẻ cần tiếp nối truyền thống đoàn kết, góp sức xây dựng và bảo vệ Tổ quốc.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Truyền thống đoàn kết có từ Văn Lang – Âu Lạc.","b) Trồng lúa nước cần “chung lưng đấu cật”.","c) Thời bình vẫn cần đoàn kết.","d) Đoàn kết là truyền thống quý báu."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đoàn kết tạo sức mạnh bảo vệ chủ quyền.","b) Thế hệ trẻ cần phát huy truyền thống đoàn kết.","c) Thời bình không cần đoàn kết.","d) Đoàn kết chỉ cần khi có chiến tranh."],"answer":["T","T","F","F"],"explain":"a), b) Đúng. c), d) Sai: đoàn kết luôn cần thiết trong mọi thời kì.","points":1},{"type":"short","level":"VD","q":"Cụm từ nào diễn tả việc nhân dân cùng nhau làm thủy lợi, đắp đê (ghi 4 chữ)?","answer":"Chung lưng đấu cật","explain":"“Chung lưng đấu cật” – cùng nhau gánh vác công việc lớn như trị thủy, làm thủy lợi.","points":0.5},{"type":"short","level":"VDC","q":"Truyền thống nào của dân tộc được hun đúc qua hàng nghìn năm dựng nước, giữ nước (ghi 2 chữ)?","answer":"Đoàn kết","explain":"Truyền thống đoàn kết – sức mạnh to lớn của dân tộc Việt Nam.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Bài 14 có tên là","options":["A. Khối đại đoàn kết dân tộc trong lịch sử Việt Nam.","B. Đời sống vật chất và tinh thần.","C. Văn minh Đại Việt.","D. Các nền văn minh cổ."],"answer":"A","explain":"Bài 14: Khối đại đoàn kết dân tộc trong lịch sử Việt Nam.","points":0.25},{"type":"mcq","level":"NB","q":"Chương 7 trên web SAOBAY có tên là","options":["A. Cộng đồng các dân tộc Việt Nam.","B. Văn minh Đại Việt.","C. Cách mạng tư sản.","D. Chiến tranh bảo vệ Tổ quốc."],"answer":"A","explain":"Chương 7 (Chủ đề 7 SGK): Cộng đồng các dân tộc Việt Nam gồm Bài 13 và Bài 14.","points":0.25},{"type":"mcq","level":"TH","q":"Tổng kết Bài 14, nội dung trọng tâm là","options":["A. sự hình thành, vai trò của khối đại đoàn kết dân tộc.","B. đời sống vật chất các dân tộc.","C. các nền văn minh cổ.","D. cách mạng công nghiệp."],"answer":"A","explain":"Bài 14 tập trung vào sự hình thành và vai trò của khối đại đoàn kết dân tộc trong lịch sử và hiện nay.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải học về khối đại đoàn kết dân tộc?","options":["A. Để hiểu sức mạnh dân tộc và có trách nhiệm phát huy.","B. Để thi cử.","C. Không cần thiết.","D. Để chê bai quá khứ."],"answer":"A","explain":"Hiểu truyền thống đoàn kết giúp mỗi người tự hào và có trách nhiệm góp phần xây dựng khối đoàn kết.","points":0.25},{"type":"mcq","level":"VD","q":"Liên hệ giữa Bài 13 và Bài 14 là","options":["A. hiểu văn hóa các dân tộc (Bài 13) là cơ sở để đoàn kết (Bài 14).","B. hai bài không liên quan.","C. Bài 13 phủ định Bài 14.","D. Bài 14 phủ định Bài 13."],"answer":"A","explain":"Hiểu biết, tôn trọng văn hóa các dân tộc là nền tảng để củng cố khối đại đoàn kết.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong tương lai, khối đoàn kết dân tộc sẽ","options":["A. tiếp tục được củng cố, phát huy trong xây dựng và bảo vệ Tổ quốc.","B. mất đi.","C. không cần thiết.","D. bị thay thế."],"answer":"A","explain":"Đoàn kết là quy luật, là sức mạnh trường tồn của dân tộc Việt Nam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bài 14: Khối đại đoàn kết dân tộc trong lịch sử Việt Nam.","b) Chương 7: Cộng đồng các dân tộc Việt Nam.","c) Bài 13 và Bài 14 có liên hệ với nhau.","d) Không cần học về đoàn kết dân tộc."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cần học để hiểu và phát huy truyền thống.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hiểu văn hóa giúp củng cố đoàn kết.","b) Đoàn kết là sức mạnh trường tồn.","c) Tương lai không cần đoàn kết.","d) Mỗi người đều có trách nhiệm với khối đoàn kết."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: đoàn kết luôn cần thiết.","points":1},{"type":"short","level":"VD","q":"Bài 14 thuộc chương nào của SGK Lịch sử 10 (ghi số)?","answer":"7","explain":"Theo cách đánh số trên web SAOBAY, Bài 13 – 14 thuộc Chương 7 (Chủ đề 7 SGK).","points":0.5},{"type":"short","level":"VDC","q":"Sức mạnh nào được coi là “vô địch” của dân tộc Việt Nam (ghi 2 chữ)?","answer":"Đoàn kết","explain":"Đoàn kết toàn dân tộc – sức mạnh vô địch giúp ta thắng mọi kẻ thù.","points":0.5}]}]}</script>
