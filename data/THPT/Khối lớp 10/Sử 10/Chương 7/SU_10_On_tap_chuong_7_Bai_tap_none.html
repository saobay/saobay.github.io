{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Chương 7 gồm những bài nào?","options":["A. Bài 13 và Bài 14.","B. Bài 11 và Bài 12.","C. Bài 9 và Bài 10.","D. Bài 7 và Bài 8."],"answer":"A","explain":"Chương 7 (Cộng đồng các dân tộc Việt Nam) gồm Bài 13 (đời sống các dân tộc) và Bài 14 (khối đại đoàn kết).","points":0.25},{"type":"mcq","level":"NB","q":"Số dân tộc trong cộng đồng các dân tộc Việt Nam là","options":["A. 54.","B. 53.","C. 55.","D. 50."],"answer":"A","explain":"Việt Nam có 54 dân tộc anh em cùng sinh sống.","points":0.25},{"type":"mcq","level":"TH","q":"Mối liên hệ giữa Bài 13 và Bài 14 là","options":["A. hiểu văn hóa các dân tộc là cơ sở để đoàn kết.","B. hai bài không liên quan.","C. Bài 13 phủ định Bài 14.","D. Bài 14 không cần Bài 13."],"answer":"A","explain":"Hiểu biết, tôn trọng văn hóa các dân tộc (Bài 13) là nền tảng củng cố khối đại đoàn kết (Bài 14).","points":0.25},{"type":"mcq","level":"TH","q":"Khối đoàn kết dân tộc hình thành trên cơ sở nào?","options":["A. Yêu nước, trị thủy, chống ngoại xâm.","B. Chia rẽ các dân tộc.","C. Bóc lột lẫn nhau.","D. Đồng hóa văn hóa."],"answer":"A","explain":"Ba cơ sở: tình yêu quê hương, yêu cầu trị thủy làm thủy lợi, yêu cầu chống ngoại xâm.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao chính sách “bình đẳng giữa các dân tộc” củng cố đoàn kết?","options":["A. Vì tạo sự công bằng, tin tưởng lẫn nhau giữa các dân tộc.","B. Vì làm mất bản sắc.","C. Vì gây chia rẽ.","D. Vì không cần thiết."],"answer":"A","explain":"Bình đẳng xóa bỏ mặc cảm, tạo niềm tin – nền tảng của khối đoàn kết bền vững.","points":0.25},{"type":"mcq","level":"VDC","q":"Tổng kết chương 7, bài học lớn nhất là","options":["A. đa dạng văn hóa là sức mạnh khi có đoàn kết.","B. nên đồng nhất mọi văn hóa.","C. đa dạng gây chia rẽ.","D. không cần đoàn kết."],"answer":"A","explain":"54 dân tộc với văn hóa đa dạng, khi đoàn kết lại tạo nên sức mạnh vô địch của dân tộc Việt Nam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chương 7 gồm Bài 13 và Bài 14.","b) Việt Nam có 54 dân tộc.","c) Đoàn kết hình thành từ yêu nước, trị thủy, chống ngoại xâm.","d) Các dân tộc Việt Nam không có quan hệ gì."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: các dân tộc gắn bó trong cộng đồng thống nhất.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hiểu văn hóa giúp củng cố đoàn kết.","b) Bình đẳng tạo niềm tin giữa các dân tộc.","c) Đa dạng văn hóa là sức mạnh khi đoàn kết.","d) Nên đồng nhất mọi nền văn hóa."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cần tôn trọng sự đa dạng, không đồng nhất.","points":1},{"type":"short","level":"VD","q":"Cộng đồng các dân tộc Việt Nam thuộc bao nhiêu ngữ hệ (ghi số)?","answer":"5","explain":"54 dân tộc thuộc 5 ngữ hệ: Nam Á, Thái – Kađai, Mông – Dao, Nam Đảo, Hán – Tạng.","points":0.5},{"type":"short","level":"VDC","q":"Ba cơ sở hình thành khối đoàn kết là yêu nước, chống ngoại xâm và gì (ghi 2 chữ)?","answer":"Trị thủy","explain":"Ba cơ sở: tình yêu quê hương, yêu cầu trị thủy làm thủy lợi, yêu cầu chống ngoại xâm.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Dân tộc nào chiếm đa số dân số Việt Nam?","options":["A. Kinh.","B. Tày.","C. Thái.","D. Hoa."],"answer":"A","explain":"Dân tộc Kinh chiếm khoảng 85–86% dân số, là dân tộc đa số.","points":0.25},{"type":"mcq","level":"NB","q":"Hội nghị Diên Hồng diễn ra năm nào?","options":["A. 1284.","B. 938.","C. 1930.","D. 1945."],"answer":"A","explain":"Hội nghị Diên Hồng (1284) bàn kế đánh giặc Nguyên – Mông.","points":0.25},{"type":"mcq","level":"TH","q":"Lễ hội nào sau đây KHÔNG phải của đồng bào dân tộc thiểu số?","options":["A. Hội Lim.","B. Lồng Tồng.","C. Ka-tê.","D. Đua ghe Ngo."],"answer":"A","explain":"Hội Lim là lễ hội của người Kinh (Bắc Ninh); các lễ hội còn lại của Tày – Nùng, Chăm, Khmer.","points":0.25},{"type":"mcq","level":"TH","q":"Tổ chức tiền thân của Mặt trận Tổ quốc Việt Nam là","options":["A. Hội Phản đế đồng minh.","B. Hội Nông dân.","C. Đoàn Thanh niên.","D. Hội Phụ nữ."],"answer":"A","explain":"Hội Phản đế đồng minh (18/11/1930) là tiền thân của Mặt trận Tổ quốc Việt Nam.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao lễ hội vừa mang tính văn hóa, vừa củng cố đoàn kết?","options":["A. Vì lễ hội là dịp cộng đồng sum họp, giao lưu, thắt chặt tình cảm.","B. Vì lễ hội chỉ để vui chơi.","C. Vì lễ hội gây tốn kém.","D. Vì lễ hội không có ý nghĩa."],"answer":"A","explain":"Lễ hội là không gian văn hóa cộng đồng, nơi mọi người gặp gỡ, sẻ chia – thắt chặt tình đoàn kết.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong thời kì hội nhập, thách thức lớn nhất với khối đoàn kết là","options":["A. các luận điệu chia rẽ, xuyên tạc của thế lực thù địch.","B. không có thách thức.","C. kinh tế phát triển.","D. giao lưu văn hóa."],"answer":"A","explain":"Các thế lực thù địch lợi dụng vấn đề dân tộc, tôn giáo để chia rẽ – cần cảnh giác.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dân tộc Kinh là đa số.","b) Diên Hồng diễn ra năm 1284.","c) Hội Lim là lễ hội người Kinh.","d) Hội Phản đế đồng minh là tiền thân Mặt trận Tổ quốc."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lễ hội thắt chặt tình đoàn kết cộng đồng.","b) Cần cảnh giác luận điệu chia rẽ.","c) Hội nhập không có thách thức với đoàn kết.","d) Đoàn kết cần được bảo vệ."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: hội nhập đặt ra thách thức cần cảnh giác.","points":1},{"type":"short","level":"VD","q":"Lễ hội của người Kinh ở Bắc Ninh, nổi tiếng với hát quan họ, tên là gì (ghi 2 chữ)?","answer":"Hội Lim","explain":"Hội Lim (Tiên Du, Bắc Ninh) – lễ hội quan họ nổi tiếng.","points":0.5},{"type":"short","level":"VDC","q":"Ngày 18/11/1930, tổ chức mặt trận đầu tiên được thành lập có tên là gì (ghi 4 chữ)?","answer":"Hội Phản đế đồng minh","explain":"Hội Phản đế đồng minh – tiền thân của Mặt trận Tổ quốc Việt Nam.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Nhà ở chủ yếu của đồng bào dân tộc thiểu số là","options":["A. nhà sàn.","B. chung cư.","C. biệt thự.","D. nhà cao tầng."],"answer":"A","explain":"Đồng bào các dân tộc thiểu số chủ yếu ở nhà sàn.","points":0.25},{"type":"mcq","level":"NB","q":"Vai trò của đoàn kết trong chống ngoại xâm là","options":["A. nhân tố quan trọng, quyết định thắng lợi.","B. không quan trọng.","C. gây thất bại.","D. chỉ có tính hình thức."],"answer":"A","explain":"SGK khẳng định đoàn kết là nhân tố quan trọng, quyết định thắng lợi chống ngoại xâm.","points":0.25},{"type":"mcq","level":"TH","q":"Tín ngưỡng chung của các dân tộc Việt Nam là","options":["A. thờ cúng tổ tiên.","B. chỉ thờ một vị thần duy nhất.","C. không có tín ngưỡng.","D. chỉ theo tôn giáo ngoại lai."],"answer":"A","explain":"Thờ cúng tổ tiên là tín ngưỡng phổ biến, thể hiện đạo lí uống nước nhớ nguồn.","points":0.25},{"type":"mcq","level":"TH","q":"Chính sách dân tộc của Nhà nước ta là","options":["A. bình đẳng, đoàn kết, giúp nhau cùng phát triển.","B. phân biệt đối xử.","C. đồng hóa.","D. bỏ mặc."],"answer":"A","explain":"Chính sách dân tộc: bình đẳng, đoàn kết, tương trợ, giúp nhau cùng phát triển.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao nhà sàn phù hợp với đồng bào miền núi?","options":["A. Vì tránh ẩm thấp, thú dữ, tận dụng không gian.","B. Vì rẻ nhất.","C. Vì không biết xây nhà khác.","D. Vì bị ép buộc."],"answer":"A","explain":"Nhà sàn tránh ẩm thấp, lũ lụt, thú dữ; gầm sàn để chăn nuôi, chứa dụng cụ.","points":0.25},{"type":"mcq","level":"VDC","q":"Bài học từ chính sách đoàn kết thời phong kiến (gả công chúa, phong tước) là","options":["A. dùng biện pháp mềm dẻo, tôn trọng để gắn kết các dân tộc.","B. dùng vũ lực.","C. chia rẽ.","D. bỏ mặc biên giới."],"answer":"A","explain":"Các triều đại dùng hôn nhân, phong tước để gắn kết thủ lĩnh miền núi – biện pháp khôn khéo.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đồng bào thiểu số chủ yếu ở nhà sàn.","b) Đoàn kết quyết định thắng lợi chống ngoại xâm.","c) Thờ cúng tổ tiên là tín ngưỡng chung.","d) Chính sách dân tộc là bình đẳng, đoàn kết."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhà sàn tránh ẩm thấp, thú dữ.","b) Thời phong kiến có chính sách gắn kết dân tộc.","c) Nên dùng vũ lực với đồng bào miền núi.","d) Tôn trọng giúp gắn kết các dân tộc."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần biện pháp mềm dẻo, tôn trọng.","points":1},{"type":"short","level":"VD","q":"Tín ngưỡng chung thể hiện đạo lí “uống nước nhớ nguồn” là gì (ghi 4 chữ)?","answer":"Thờ cúng tổ tiên","explain":"Thờ cúng tổ tiên – tín ngưỡng phổ biến của cộng đồng các dân tộc.","points":0.5},{"type":"short","level":"VDC","q":"Để gắn kết thủ lĩnh miền núi, các triều đại phong kiến đã gả gì cho họ (ghi 2 chữ)?","answer":"Công chúa","explain":"Các triều đại gả công chúa, phong tước cho thủ lĩnh dân tộc miền núi.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Ngữ hệ nào có nhóm ngôn ngữ Việt – Mường?","options":["A. Nam Á.","B. Thái – Kađai.","C. Mông – Dao.","D. Nam Đảo."],"answer":"A","explain":"Ngữ hệ Nam Á gồm nhóm Việt – Mường và nhóm Môn – Khơme.","points":0.25},{"type":"mcq","level":"NB","q":"Khối đoàn kết dân tộc hình thành sớm nhất từ thời","options":["A. Văn Lang – Âu Lạc.","B. nhà Nguyễn.","C. Pháp thuộc.","D. đổi mới."],"answer":"A","explain":"Khối đoàn kết đã hình thành từ thời dựng nước Văn Lang – Âu Lạc.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm chung trong đời sống tinh thần các dân tộc là","options":["A. coi trọng gia đình, cộng đồng và cội nguồn.","B. không có lễ hội.","C. mỗi dân tộc một tôn giáo riêng biệt, không giao lưu.","D. không có tín ngưỡng."],"answer":"A","explain":"Các dân tộc đều coi trọng tình cảm gia đình, làng xóm và nhớ về cội nguồn.","points":0.25},{"type":"mcq","level":"TH","q":"Trong kháng chiến chống Mỹ, sức mạnh quyết định là","options":["A. sức mạnh đoàn kết toàn dân tộc.","B. vũ khí hiện đại.","C. viện trợ duy nhất.","D. địa hình duy nhất."],"answer":"A","explain":"Nhờ đoàn kết toàn dân tộc, ta đã thắng đế quốc Mỹ hùng mạnh.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao ngôn ngữ là yếu tố quan trọng để phân loại dân tộc?","options":["A. Vì ngôn ngữ phản ánh nguồn gốc, quan hệ lịch sử giữa các tộc người.","B. Vì ngôn ngữ không quan trọng.","C. Vì mọi dân tộc cùng một ngôn ngữ.","D. Vì ngôn ngữ gây chia rẽ."],"answer":"A","explain":"Ngữ hệ cho thấy các ngôn ngữ cùng nguồn gốc, phản ánh quan hệ gần gũi giữa các tộc người.","points":0.25},{"type":"mcq","level":"VDC","q":"Để góp phần bảo vệ chủ quyền biển đảo, mỗi công dân cần","options":["A. hiểu biết, tuyên truyền và sẵn sàng bảo vệ Tổ quốc.","B. thờ ơ.","C. chỉ lo việc riêng.","D. tin theo luận điệu xuyên tạc."],"answer":"A","explain":"Bảo vệ chủ quyền là trách nhiệm của toàn dân tộc, trong đó có thế hệ trẻ.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhóm Việt – Mường thuộc ngữ hệ Nam Á.","b) Đoàn kết hình thành từ Văn Lang – Âu Lạc.","c) Các dân tộc coi trọng gia đình, cội nguồn.","d) Chống Mỹ không cần đoàn kết."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đoàn kết là nhân tố quyết định thắng lợi.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ngôn ngữ phản ánh quan hệ giữa các tộc người.","b) Mỗi công dân có trách nhiệm bảo vệ chủ quyền.","c) Bảo vệ chủ quyền chỉ là việc của quân đội.","d) Cần tuyên truyền về chủ quyền biển đảo."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: bảo vệ Tổ quốc là trách nhiệm toàn dân.","points":1},{"type":"short","level":"VD","q":"Dân tộc nào thuộc nhóm Việt – Mường cùng với người Kinh (ghi 1 chữ)?","answer":"Mường","explain":"Dân tộc Mường cùng Kinh thuộc nhóm ngôn ngữ Việt – Mường.","points":0.5},{"type":"short","level":"VDC","q":"Cuộc kháng chiến nào (1954 – 1975) thể hiện sức mạnh đoàn kết toàn dân tộc (ghi 2 chữ)?","answer":"Chống Mỹ","explain":"Kháng chiến chống Mỹ (1954 – 1975) thắng lợi nhờ sức mạnh đoàn kết toàn dân tộc.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Lương thực chính của các dân tộc Việt Nam là","options":["A. cơm.","B. bánh mì.","C. khoai tây.","D. mì ống."],"answer":"A","explain":"Cơm (từ lúa gạo) là lương thực chính trong bữa ăn của các dân tộc.","points":0.25},{"type":"mcq","level":"NB","q":"Ngày truyền thống của Mặt trận Tổ quốc Việt Nam là","options":["A. 18/11.","B. 3/2.","C. 2/9.","D. 19/5."],"answer":"A","explain":"18/11/1930 – ngày thành lập Hội Phản đế đồng minh, nay là ngày truyền thống Mặt trận Tổ quốc.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao cần xóa bỏ hủ tục trong đời sống các dân tộc?","options":["A. Vì hủ tục kìm hãm phát triển, ảnh hưởng sức khỏe, hạnh phúc.","B. Vì hủ tục là văn hóa đẹp.","C. Vì không cần thiết.","D. Vì hủ tục giúp phát triển."],"answer":"A","explain":"Tảo hôn, mê tín dị đoan... kìm hãm sự phát triển, cần xóa bỏ để đời sống tiến bộ.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu hiện đoàn kết trong thời bình là","options":["A. cùng nhau xây dựng quê hương, tương trợ cộng đồng.","B. không cần thiết.","C. chỉ lo việc riêng.","D. tranh chấp lợi ích."],"answer":"A","explain":"Thời bình, đoàn kết thể hiện trong lao động, xây dựng quê hương và giúp đỡ lẫn nhau.","points":0.25},{"type":"mcq","level":"VD","q":"So sánh vai trò đoàn kết trong chiến tranh và hòa bình:","options":["A. đều quan trọng: chiến tranh để thắng giặc, hòa bình để phát triển.","B. hòa bình không cần đoàn kết.","C. chiến tranh không cần đoàn kết.","D. hoàn toàn khác nhau."],"answer":"A","explain":"Đoàn kết luôn cần thiết: khi có giặc để chiến đấu, khi hòa bình để xây dựng đất nước.","points":0.25},{"type":"mcq","level":"VDC","q":"Thông điệp của chương 7 gửi đến học sinh là","options":["A. tự hào đa dạng văn hóa, góp phần củng cố khối đoàn kết.","B. chỉ quan tâm dân tộc mình.","C. chê bai văn hóa khác.","D. không cần học lịch sử."],"answer":"A","explain":"Học sinh cần tự hào về sự đa dạng văn hóa và có trách nhiệm với khối đại đoàn kết dân tộc.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cơm là lương thực chính.","b) 18/11 là ngày truyền thống Mặt trận Tổ quốc.","c) Cần xóa bỏ hủ tục.","d) Thời bình không cần đoàn kết."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: thời bình vẫn cần đoàn kết để xây dựng đất nước.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đoàn kết cần trong cả chiến tranh và hòa bình.","b) Học sinh cần tự hào về đa dạng văn hóa.","c) Chỉ cần đoàn kết khi có chiến tranh.","d) Mỗi người đều có trách nhiệm với đoàn kết."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: đoàn kết luôn cần thiết.","points":1},{"type":"short","level":"VD","q":"Hủ tục nào cần xóa bỏ khi trai gái kết hôn quá sớm (ghi 2 chữ)?","answer":"Tảo hôn","explain":"Tảo hôn là hủ tục ảnh hưởng sức khỏe, hạnh phúc, cần xóa bỏ.","points":0.5},{"type":"short","level":"VDC","q":"Ngày 18 tháng 11 hằng năm là ngày truyền thống của tổ chức nào (ghi 5 chữ)?","answer":"Mặt trận Tổ quốc Việt Nam","explain":"18/11 – ngày truyền thống Mặt trận Tổ quốc Việt Nam.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Trong các dân tộc sau, dân tộc nào cùng ngữ hệ Nam Đảo với dân tộc Gia Rai?","options":["A. Chăm.","B. Mường.","C. Dao.","D. Hoa."],"answer":"A","explain":"Dân tộc Chăm cùng với Gia Rai, Ê Đê thuộc ngữ hệ Nam Đảo; Mường thuộc Nam Á, Dao thuộc Mông – Dao, Hoa thuộc Hán – Tạng.","points":0.25},{"type":"mcq","level":"NB","q":"Câu nói “Đoàn kết, đoàn kết, đại đoàn kết...” là của ai?","options":["A. Hồ Chí Minh.","B. Trần Hưng Đạo.","C. Quang Trung.","D. Lê Lợi."],"answer":"A","explain":"Chủ tịch Hồ Chí Minh: “Đoàn kết, đoàn kết, đại đoàn kết; thành công, thành công, đại thành công”.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Phật giáo hòa hợp với tín ngưỡng bản địa?","options":["A. Vì có điểm tương đồng: hướng thiện, từ bi.","B. Vì bị ép buộc.","C. Vì xóa bỏ tín ngưỡng bản địa.","D. Vì chỉ dành cho vua quan."],"answer":"A","explain":"Phật giáo với tinh thần từ bi, hướng thiện dễ hòa hợp với văn hóa, tín ngưỡng người Việt.","points":0.25},{"type":"mcq","level":"TH","q":"Trong hơn 1000 năm Bắc thuộc, khối đoàn kết","options":["A. ngày càng được củng cố.","B. bị xóa bỏ.","C. không tồn tại.","D. chỉ ở miền Nam."],"answer":"A","explain":"Qua đấu tranh bền bỉ giành độc lập, khối đoàn kết ngày càng được củng cố.","points":0.25},{"type":"mcq","level":"VD","q":"Phân tích tác dụng của việc giữ gìn tiếng nói các dân tộc:","options":["A. bảo tồn bản sắc, tri thức dân gian của mỗi tộc người.","B. không có tác dụng.","C. gây chia rẽ.","D. làm nghèo văn hóa."],"answer":"A","explain":"Tiếng nói lưu giữ tri thức, văn hóa của tộc người; mất tiếng nói là mất một phần di sản.","points":0.25},{"type":"mcq","level":"VDC","q":"Để phát triển bền vững vùng dân tộc thiểu số, cần","options":["A. kết hợp phát triển kinh tế với bảo tồn văn hóa, bảo vệ môi trường.","B. chỉ khai thác tài nguyên.","C. bỏ mặc.","D. đồng hóa văn hóa."],"answer":"A","explain":"Phát triển bền vững: kinh tế đi đôi với bảo tồn văn hóa và bảo vệ môi trường sinh thái.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dân tộc Chăm thuộc ngữ hệ Nam Đảo.","b) Hồ Chí Minh đề cao đoàn kết.","c) Phật giáo hòa hợp với tín ngưỡng bản địa.","d) Khối đoàn kết được củng cố thời Bắc thuộc."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cần giữ gìn tiếng nói các dân tộc.","b) Phát triển cần gắn với bảo tồn văn hóa.","c) Chỉ cần khai thác tài nguyên vùng dân tộc.","d) Bảo vệ môi trường là cần thiết."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần phát triển bền vững, không khai thác cạn kiệt.","points":1},{"type":"short","level":"VD","q":"Dân tộc nào ở miền Trung thuộc ngữ hệ Nam Đảo, nổi tiếng với lễ hội Ka-tê (ghi 1 chữ)?","answer":"Chăm","explain":"Đồng bào Chăm thuộc ngữ hệ Nam Đảo, có lễ hội Ka-tê truyền thống.","points":0.5},{"type":"short","level":"VDC","q":"Hoàn thành câu nói của Hồ Chí Minh: “Đoàn kết, đoàn kết, đại đoàn kết; ...” (ghi 6 chữ)?","answer":"Thành công, thành công, đại thành công","explain":"“Đoàn kết, đoàn kết, đại đoàn kết; thành công, thành công, đại thành công”.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Trang phục các dân tộc thiểu số thường may từ","options":["A. vải bông, vải lanh, tơ tằm.","B. nhựa.","C. kim loại.","D. giấy."],"answer":"A","explain":"Trang phục thường may từ vải bông, vải lanh, tơ tằm với hoa văn đa dạng.","points":0.25},{"type":"mcq","level":"NB","q":"Từ năm 1930, khối đoàn kết dân tộc","options":["A. ngày càng được củng cố, mở rộng.","B. bị giải tán.","C. không đổi.","D. bị chia rẽ."],"answer":"A","explain":"Từ khi Đảng ra đời (1930), khối đại đoàn kết được củng cố, mở rộng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao trang phục các dân tộc đa dạng về hoa văn?","options":["A. Vì thể hiện bản sắc, quan niệm thẩm mĩ riêng.","B. Vì không có vải trơn.","C. Vì bị ép buộc.","D. Vì ngẫu nhiên."],"answer":"A","explain":"Hoa văn trang phục phản ánh quan niệm vũ trụ, tín ngưỡng và bản sắc tộc người.","points":0.25},{"type":"mcq","level":"TH","q":"Thời phong kiến, vua quan gắn kết dân tộc miền núi bằng","options":["A. gả công chúa, phong tước.","B. vũ lực.","C. bỏ mặc.","D. chia rẽ."],"answer":"A","explain":"Các triều đại gả công chúa, phong tước cho thủ lĩnh miền núi để củng cố đoàn kết.","points":0.25},{"type":"mcq","level":"VD","q":"So sánh lễ hội của người Kinh và dân tộc thiểu số:","options":["A. đều phong phú; Kinh quy mô lớn hơn, thiểu số chủ yếu ở làng bản.","B. thiểu số không có lễ hội.","C. Kinh không có lễ hội.","D. hoàn toàn giống nhau."],"answer":"A","explain":"Cả hai đều có lễ hội phong phú; quy mô khác nhau do điều kiện dân số, kinh tế.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong lớp học có nhiều dân tộc, em cần","options":["A. tôn trọng, giúp đỡ bạn, không kì thị.","B. chỉ chơi cùng dân tộc mình.","C. chê bai bạn khác.","D. chia bè phái."],"answer":"A","explain":"Đoàn kết bắt đầu từ những việc nhỏ trong lớp học.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trang phục thiểu số may từ vải bông, lanh, tơ tằm.","b) Từ 1930, khối đoàn kết được củng cố.","c) Hoa văn thể hiện bản sắc tộc người.","d) Thời phong kiến gả công chúa cho thủ lĩnh miền núi."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lễ hội Kinh và thiểu số đều phong phú.","b) Trong lớp cần tôn trọng, giúp đỡ nhau.","c) Nên chia bè phái theo dân tộc.","d) Kì thị bạn khác dân tộc là sai."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: chia bè phái đi ngược đoàn kết.","points":1},{"type":"short","level":"VD","q":"Để gắn kết, các triều đại đã gả ai cho thủ lĩnh miền núi (ghi 2 chữ)?","answer":"Công chúa","explain":"Gả công chúa, phong tước cho thủ lĩnh dân tộc miền núi, biên giới.","points":0.5},{"type":"short","level":"VDC","q":"Trong lớp học đa dân tộc, điều cần tránh nhất là gì (ghi 2 chữ)?","answer":"Kì thị","explain":"Kì thị dân tộc đi ngược lại tinh thần đoàn kết; cần tôn trọng, giúp đỡ nhau.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Hoạt động kinh tế chính của các dân tộc là","options":["A. nông nghiệp.","B. công nghiệp nặng.","C. khai thác dầu.","D. tài chính."],"answer":"A","explain":"Nông nghiệp là hoạt động kinh tế chính của cộng đồng các dân tộc.","points":0.25},{"type":"mcq","level":"NB","q":"Truyền thuyết con Rồng cháu Tiên thể hiện","options":["A. ý thức về cội nguồn chung.","B. nghề nông.","C. chiến tranh.","D. buôn bán."],"answer":"A","explain":"Truyền thuyết con Rồng cháu Tiên thể hiện ý thức về cội nguồn chung của dân tộc.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm giống nhau về kinh tế giữa người Kinh và đồng bào thiểu số là","options":["A. đều lấy nông nghiệp làm chính.","B. đều làm công nghiệp.","C. không ai làm nông nghiệp.","D. hoàn toàn khác nhau."],"answer":"A","explain":"Dù hình thức khác nhau (lúa nước, lúa nương), nông nghiệp vẫn là hoạt động chính của các dân tộc.","points":0.25},{"type":"mcq","level":"TH","q":"Ý nghĩa của Hội nghị Diên Hồng là","options":["A. thể hiện ý chí đoàn kết toàn dân đánh giặc.","B. quyết định đầu hàng.","C. không có ý nghĩa.","D. chỉ là hình thức."],"answer":"A","explain":"Diên Hồng (1284): các bô lão đồng thanh “đánh” – ý chí quyết chiến của toàn dân tộc.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao nông nghiệp gắn liền với tinh thần đoàn kết?","options":["A. Vì thủy lợi, đê điều đòi hỏi sức mạnh tập thể.","B. Vì nông nghiệp làm một mình được.","C. Vì không cần hợp tác.","D. Vì nông nghiệp gây chia rẽ."],"answer":"A","explain":"Trị thủy, làm thủy lợi là việc lớn, buộc cộng đồng phải đoàn kết “chung lưng đấu cật”.","points":0.25},{"type":"mcq","level":"VDC","q":"Từ chương 7, em rút ra trách nhiệm nào?","options":["A. Tìm hiểu, tôn trọng văn hóa các dân tộc; góp phần đoàn kết.","B. Không quan tâm.","C. Chê bai văn hóa khác.","D. Chỉ lo cho mình."],"answer":"A","explain":"Mỗi học sinh cần hiểu, tôn trọng và góp phần bảo tồn văn hóa, củng cố đoàn kết dân tộc.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nông nghiệp là kinh tế chính của các dân tộc.","b) Con Rồng cháu Tiên thể hiện cội nguồn chung.","c) Diên Hồng thể hiện ý chí toàn dân.","d) Nông nghiệp không cần đoàn kết."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nông nghiệp (thủy lợi) đòi hỏi sức mạnh tập thể.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thủy lợi đòi hỏi đoàn kết cộng đồng.","b) Học sinh cần tôn trọng văn hóa các dân tộc.","c) Chỉ lo cho bản thân là đủ.","d) Cần góp phần củng cố đoàn kết."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần sống có trách nhiệm với cộng đồng.","points":1},{"type":"short","level":"VD","q":"Cụm từ diễn tả cùng nhau gánh vác việc trị thủy có mấy chữ “chung lưng ...” (ghi 4 chữ)?","answer":"Chung lưng đấu cật","explain":"“Chung lưng đấu cật” – cùng nhau làm thủy lợi, đắp đê.","points":0.5},{"type":"short","level":"VDC","q":"Hội nghị năm 1284 bàn kế đánh giặc Nguyên – Mông có tên là gì (ghi 2 chữ)?","answer":"Diên Hồng","explain":"Hội nghị Diên Hồng (1284) – biểu tượng của khối đại đoàn kết dân tộc.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Tín ngưỡng “vạn vật hữu linh” nghĩa là","options":["A. mọi vật đều có linh hồn.","B. không có linh hồn.","C. chỉ người có linh hồn.","D. chỉ thờ một thần."],"answer":"A","explain":"Vạn vật hữu linh: quan niệm mọi sự vật đều có linh hồn.","points":0.25},{"type":"mcq","level":"NB","q":"Vai trò hiện nay của khối đoàn kết là","options":["A. cơ sở huy động sức mạnh toàn dân tộc.","B. không cần thiết.","C. chỉ trong chiến tranh.","D. gây cản trở."],"answer":"A","explain":"Ngày nay, đoàn kết là cơ sở huy động sức mạnh toàn dân tộc trong xây dựng và bảo vệ Tổ quốc.","points":0.25},{"type":"mcq","level":"TH","q":"Các tôn giáo ở Việt Nam có điểm chung là","options":["A. hướng con người đến điều tốt đẹp.","B. hoàn toàn giống nhau.","C. cấm tín ngưỡng bản địa.","D. không có điểm chung."],"answer":"A","explain":"Các tôn giáo đều có giá trị đạo đức, hướng con người đến chân – thiện – mĩ.","points":0.25},{"type":"mcq","level":"TH","q":"Để bảo vệ khối đoàn kết trên mạng xã hội, cần","options":["A. tỉnh táo trước tin giả, không chia sẻ luận điệu chia rẽ.","B. chia sẻ mọi tin.","C. tin mọi luận điệu.","D. không dùng mạng."],"answer":"A","explain":"Cần cảnh giác tin giả, luận điệu xuyên tạc chia rẽ dân tộc trên mạng.","points":0.25},{"type":"mcq","level":"VD","q":"Mối quan hệ giữa bảo tồn văn hóa và phát triển kinh tế vùng dân tộc là","options":["A. gắn bó: văn hóa là nguồn lực phát triển du lịch, kinh tế.","B. đối lập nhau.","C. không liên quan.","D. chỉ cần kinh tế."],"answer":"A","explain":"Bảo tồn văn hóa tạo nguồn lực cho du lịch, kinh tế; kinh tế phát triển lại có điều kiện bảo tồn văn hóa.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong bối cảnh đất nước hội nhập sâu rộng, khối đại đoàn kết dân tộc cần được","options":["A. tiếp tục củng cố, phát huy đi đôi với giữ vững bản sắc.","B. nới lỏng dần.","C. thay bằng liên kết quốc tế.","D. duy trì hình thức."],"answer":"A","explain":"Hội nhập càng sâu càng cần củng cố đoàn kết, giữ vững bản sắc và độc lập dân tộc.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vạn vật hữu linh: mọi vật đều có linh hồn.","b) Đoàn kết là cơ sở huy động sức mạnh toàn dân.","c) Các tôn giáo hướng con người đến điều tốt đẹp.","d) Không cần cảnh giác tin giả."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cần tỉnh táo trước tin giả chia rẽ.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Văn hóa là nguồn lực phát triển kinh tế.","b) Đoàn kết là sức mạnh trường tồn.","c) Bảo tồn văn hóa cản trở phát triển.","d) Tương lai vẫn cần đoàn kết."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: bảo tồn văn hóa gắn với phát triển bền vững.","points":1},{"type":"short","level":"VD","q":"Quan niệm “mọi vật đều có linh hồn” gọi là gì (ghi 4 chữ)?","answer":"Vạn vật hữu linh","explain":"Vạn vật hữu linh – tín ngưỡng phổ biến của các dân tộc.","points":0.5},{"type":"short","level":"VDC","q":"Sức mạnh nào giúp dân tộc ta thắng mọi kẻ thù (ghi 2 chữ)?","answer":"Đoàn kết","explain":"Đoàn kết toàn dân tộc – sức mạnh vô địch.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Bài 13 có tên đầy đủ là","options":["A. Đời sống vật chất và tinh thần của cộng đồng các dân tộc Việt Nam.","B. Khối đại đoàn kết dân tộc.","C. Văn minh Đại Việt.","D. Các nền văn minh cổ."],"answer":"A","explain":"Bài 13: Đời sống vật chất và tinh thần của cộng đồng các dân tộc Việt Nam.","points":0.25},{"type":"mcq","level":"NB","q":"Bài 14 có tên đầy đủ là","options":["A. Khối đại đoàn kết dân tộc trong lịch sử Việt Nam.","B. Đời sống vật chất và tinh thần.","C. Văn minh Đại Việt.","D. Văn minh Đông Nam Á."],"answer":"A","explain":"Bài 14: Khối đại đoàn kết dân tộc trong lịch sử Việt Nam.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung trọng tâm của chương 7 là","options":["A. cộng đồng các dân tộc và khối đại đoàn kết.","B. các nền văn minh cổ.","C. cách mạng công nghiệp.","D. chiến tranh thế giới."],"answer":"A","explain":"Chương 7: Cộng đồng các dân tộc Việt Nam – đời sống và khối đại đoàn kết.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải học chương 7?","options":["A. Để hiểu, tự hào và góp phần đoàn kết dân tộc.","B. Để thi cử.","C. Không cần thiết.","D. Để chê bai."],"answer":"A","explain":"Hiểu văn hóa, truyền thống đoàn kết để tự hào và có trách nhiệm phát huy.","points":0.25},{"type":"mcq","level":"VD","q":"Tổng kết hai chương 5 và 6, điểm chung là","options":["A. đều về văn hóa, con người Việt Nam qua các thời kì.","B. không liên quan.","C. chỉ về chiến tranh.","D. chỉ về kinh tế."],"answer":"A","explain":"Chương 5 (văn minh) và chương 7 (cộng đồng dân tộc) đều khắc họa văn hóa, con người Việt Nam.","points":0.25},{"type":"mcq","level":"VDC","q":"Là học sinh, em sẽ giới thiệu văn hóa dân tộc mình bằng cách","options":["A. tìm hiểu, thuyết trình, tham gia lễ hội.","B. giấu đi.","C. chê bai.","D. không quan tâm."],"answer":"A","explain":"Mỗi học sinh có thể góp phần quảng bá văn hóa dân tộc mình bằng việc tìm hiểu và chia sẻ.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bài 13: đời sống vật chất và tinh thần.","b) Bài 14: khối đại đoàn kết dân tộc.","c) Chương 7 về cộng đồng các dân tộc.","d) Không cần học chương 7."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cần học để hiểu và phát huy.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chương 5, 6 đều về văn hóa, con người Việt Nam.","b) Học sinh cần quảng bá văn hóa dân tộc mình.","c) Nên giấu văn hóa dân tộc mình.","d) Mỗi người đều góp phần vào đoàn kết."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần tự hào và chia sẻ văn hóa dân tộc mình.","points":1},{"type":"short","level":"VD","q":"Chương 7 trên web SAOBAY có tên là gì (ghi 6 chữ)?","answer":"Cộng đồng các dân tộc Việt Nam","explain":"Chương 7 (Chủ đề 7 SGK): Cộng đồng các dân tộc Việt Nam.","points":0.5},{"type":"short","level":"VDC","q":"Hai bài 13, 14 cùng thuộc chương nào (ghi số)?","answer":"7","explain":"Bài 13, 14 thuộc Chương 7 (theo đánh số trên web SAOBAY).","points":0.5}]}]}</script>
