{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Ba trung tâm văn minh cổ hình thành trên đất nước Việt Nam là","options":["A. Văn Lang – Âu Lạc, Chăm-pa, Phù Nam.","B. Văn Lang, Đại Việt, Chăm-pa.","C. Âu Lạc, Phù Nam, Đại Việt.","D. Lâm Ấp, Chân Lạp, Văn Lang."],"answer":"A","explain":"SGK nêu rõ ba trung tâm văn minh cổ là Văn Lang – Âu Lạc (miền Bắc), Chăm-pa (miền Trung) và Phù Nam (miền Nam).","points":0.25},{"type":"mcq","level":"NB","q":"Kinh đô của nhà nước Văn Lang đặt ở","options":["A. Phong Châu.","B. Cổ Loa.","C. Hoa Lư.","D. Thăng Long."],"answer":"A","explain":"Nhà nước Văn Lang đóng đô ở Phong Châu (nay thuộc Phú Thọ), do các vua Hùng đứng đầu.","points":0.25},{"type":"mcq","level":"TH","q":"Nhà nước Âu Lạc tồn tại trong khoảng thời gian nào?","options":["A. Khoảng thế kỉ VII TCN – 208 TCN.","B. 208 – 179 TCN.","C. 179 TCN – năm 43.","D. Năm 192 – thế kỉ VII."],"answer":"B","explain":"Sau khi An Dương Vương (Thục Phán) đánh bại Hùng Vương năm 208 TCN, nhà nước Âu Lạc ra đời và tồn tại đến năm 179 TCN.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác biệt cơ bản của văn minh Văn Lang – Âu Lạc so với văn minh Chăm-pa và Phù Nam là","options":["A. không chịu ảnh hưởng của văn minh Ấn Độ.","B. không có nhà nước.","C. không biết trồng lúa nước.","D. không có chữ viết riêng."],"answer":"A","explain":"Văn minh Văn Lang – Âu Lạc là văn minh bản địa thuần khiết, không chịu ảnh hưởng của văn minh Ấn Độ, trong khi Chăm-pa và Phù Nam chịu ảnh hưởng sâu sắc của Ấn Độ.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao trống đồng Đông Sơn được coi là thành tựu tiêu biểu nhất của văn minh Văn Lang – Âu Lạc?","options":["A. Vì nó phản ánh trình độ đúc đồng cao và đời sống sinh hoạt của cư dân.","B. Vì nó được dùng làm tiền tệ duy nhất.","C. Vì nó có nguồn gốc từ Ấn Độ.","D. Vì mọi trống đồng đều được đúc bằng vàng."],"answer":"A","explain":"Trống đồng (tiêu biểu là trống Ngọc Lũ) thể hiện kĩ thuật luyện kim, mĩ thuật tinh xảo và phản ánh sinh động đời sống của cư dân Đông Sơn.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định nào sau đây đúng về tổ chức nhà nước thời Văn Lang – Âu Lạc?","options":["A. Đã là nhà nước quân chủ chuyên chế trung ương tập quyền hoàn chỉnh.","B. Tổ chức nhà nước còn đơn giản, sơ khai.","C. Vua cai trị bằng cả vương quyền và thần quyền như Phù Nam.","D. Đứng đầu là vua theo chế độ cha truyền con nối tuyệt đối."],"answer":"B","explain":"SGK khẳng định tổ chức nhà nước Văn Lang – Âu Lạc còn đơn giản, sơ khai, chưa hoàn chỉnh như các nhà nước Chăm-pa, Phù Nam sau này.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về văn minh Văn Lang – Âu Lạc:","statements":["a) Kinh đô của nhà nước Văn Lang đặt ở Phong Châu.","b) An Dương Vương là người đứng đầu nhà nước Âu Lạc.","c) Văn minh Văn Lang – Âu Lạc chịu ảnh hưởng sâu sắc của văn minh Ấn Độ.","d) Thành Cổ Loa được xây dựng theo hình xoáy ốc."],"answer":["T","T","F","T"],"explain":"a) Đúng: kinh đô Văn Lang ở Phong Châu. b) Đúng: An Dương Vương (Thục Phán) lập ra Âu Lạc. c) Sai: đây là nền văn minh bản địa, không chịu ảnh hưởng Ấn Độ. d) Đúng: thành Cổ Loa có cấu trúc xoáy ốc độc đáo.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về văn minh Chăm-pa:","statements":["a) Năm 192, nhà nước Lâm Ấp ra đời.","b) Đến thế kỉ VII, Lâm Ấp đổi tên thành Chăm-pa.","c) Kinh đô đầu tiên của Chăm-pa là Vi-ja-ya (Đồ Bàn).","d) Khu đền tháp Mỹ Sơn được UNESCO công nhận Di sản văn hóa thế giới năm 1999."],"answer":["T","T","F","T"],"explain":"a) Đúng: năm 192, Khu Liên lãnh đạo khởi nghĩa lập ra Lâm Ấp. b) Đúng theo SGK. c) Sai: kinh đô đầu tiên là Sin-ha-pu-ra (Trà Kiệu); Vi-ja-ya (Đồ Bàn) là kinh đô về sau. d) Đúng: Mỹ Sơn được công nhận năm 1999.","points":1},{"type":"short","level":"VD","q":"Nhà nước Lâm Ấp – tiền thân của Chăm-pa – ra đời vào năm nào (ghi số)?","answer":"192","explain":"Năm 192, Khu Liên lãnh đạo nhân dân nổi dậy, lập ra nhà nước Lâm Ấp ở miền Trung.","points":0.5},{"type":"short","level":"VDC","q":"Khu đền tháp tiêu biểu của văn minh Chăm-pa ở Quảng Nam, được UNESCO công nhận năm 1999, có tên là gì?","answer":"Mỹ Sơn","explain":"Khu đền tháp Mỹ Sơn (Quảng Nam) là trung tâm tôn giáo của Chăm-pa, nổi tiếng với kĩ thuật xây gạch độc đáo.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Nền văn hóa vật chất của cư dân Văn Lang – Âu Lạc là","options":["A. văn hóa Đông Sơn.","B. văn hóa Sa Huỳnh.","C. văn hóa Óc Eo.","D. văn hóa Hòa Bình."],"answer":"A","explain":"Văn hóa Đông Sơn (tiếp nối Phùng Nguyên, Đồng Đậu, Gò Mun) là nền văn hóa vật chất của cư dân Văn Lang – Âu Lạc.","points":0.25},{"type":"mcq","level":"NB","q":"Nhà nước Phù Nam ra đời vào","options":["A. thế kỉ I.","B. năm 192.","C. thế kỉ VII TCN.","D. năm 208 TCN."],"answer":"A","explain":"Nhà nước Phù Nam ra đời vào thế kỉ I ở Nam Bộ và phát triển mạnh mẽ trong các thế kỉ III – V.","points":0.25},{"type":"mcq","level":"TH","q":"Thương cảng nào là trung tâm buôn bán quốc tế sầm uất của văn minh Phù Nam?","options":["A. Óc Eo.","B. Hội An.","C. Phố Hiến.","D. Vân Đồn."],"answer":"A","explain":"Óc Eo (nay thuộc An Giang) là thương cảng quốc tế sầm uất bậc nhất thời bấy giờ của Phù Nam.","points":0.25},{"type":"mcq","level":"TH","q":"Tôn giáo chủ yếu của cư dân Chăm-pa là","options":["A. Ấn Độ giáo (thờ thần Si-va) và Phật giáo.","B. Nho giáo và Đạo giáo.","C. Công giáo và Tin Lành.","D. Hồi giáo."],"answer":"A","explain":"Do ảnh hưởng sâu sắc của văn minh Ấn Độ, cư dân Chăm-pa chủ yếu theo Ấn Độ giáo (thờ thần Si-va) và Phật giáo.","points":0.25},{"type":"mcq","level":"VD","q":"Điểm giống nhau cơ bản của ba nền văn minh Văn Lang – Âu Lạc, Chăm-pa, Phù Nam là","options":["A. đều lấy nông nghiệp lúa nước làm chủ đạo và tổ chức theo làng.","B. đều chịu ảnh hưởng sâu sắc của văn minh Ấn Độ.","C. đều có chữ viết riêng từ rất sớm.","D. đều xây dựng nhà nước quân chủ chuyên chế hoàn chỉnh ngay từ đầu."],"answer":"A","explain":"Cả ba nền văn minh đều có nền nông nghiệp lúa nước chủ đạo, cư dân sống theo làng và cư dân bản địa là chủ thể sáng tạo.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao Phù Nam và Chăm-pa phát triển mạnh buôn bán đường biển hơn Văn Lang – Âu Lạc?","options":["A. Do có đường bờ biển dài và vị trí trên tuyến thương mại biển quốc tế.","B. Do không biết trồng lúa nước.","C. Do bị Ấn Độ đô hộ về kinh tế.","D. Do không có nghề thủ công."],"answer":"A","explain":"Chăm-pa có đường bờ biển dài ở miền Trung, Phù Nam nằm trên tuyến hải thương quốc tế với thương cảng Óc Eo, nên thương mại đường biển rất phát triển.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về văn minh Phù Nam:","statements":["a) Phù Nam hình thành trên nền văn hóa Óc Eo ở Nam Bộ.","b) Phù Nam phát triển mạnh mẽ nhất trong các thế kỉ III – V.","c) Cư dân Phù Nam có tục hỏa táng, thủy táng, điểu táng.","d) Nghệ thuật kim hoàn của Phù Nam đạt trình độ cao."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng theo SGK: nền văn hóa Óc Eo, cực thịnh thế kỉ III – V, các tục táng độc đáo và nghệ thuật kim hoàn tinh xảo.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhà nước Văn Lang tồn tại từ khoảng thế kỉ VII TCN đến năm 208 TCN.","b) Kinh đô của Âu Lạc đặt ở Cổ Loa.","c) Cư dân Văn Lang – Âu Lạc ở nhà trệt xây bằng gạch nung.","d) Lương thực chính của cả ba nền văn minh cổ đều là lúa gạo."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng: Cổ Loa (Đông Anh, Hà Nội). c) Sai: cư dân Văn Lang – Âu Lạc ở nhà sàn; nhà trệt gạch nung là của Chăm-pa. d) Đúng: lúa gạo là lương thực chính của cả ba.","points":1},{"type":"short","level":"VD","q":"Nhà nước Văn Lang tồn tại đến năm nào (ghi số, TCN)?","answer":"208 TCN","explain":"Năm 208 TCN, An Dương Vương đánh bại Hùng Vương, nhà nước Văn Lang kết thúc, mở đầu thời Âu Lạc.","points":0.5},{"type":"short","level":"VDC","q":"Thương cảng quốc tế sầm uất nhất của Phù Nam, nay thuộc tỉnh An Giang, có tên là gì?","answer":"Óc Eo","explain":"Óc Eo là thương cảng và trung tâm văn hóa lớn của Phù Nam, nơi phát hiện nhiều hiện vật kim hoàn tinh xảo.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Người đứng đầu nhà nước Văn Lang được gọi là","options":["A. Hùng Vương.","B. An Dương Vương.","C. Khu Liên.","D. Lý Công Uẩn."],"answer":"A","explain":"Nhà nước Văn Lang do các vua Hùng đứng đầu, truyền thuyết kể có 18 đời Hùng Vương.","points":0.25},{"type":"mcq","level":"NB","q":"Văn minh Chăm-pa chịu ảnh hưởng sâu sắc của nền văn minh nào?","options":["A. Văn minh Ấn Độ.","B. Văn minh Trung Hoa.","C. Văn minh Ai Cập.","D. Văn minh La Mã."],"answer":"A","explain":"Thông qua các thương nhân đường biển, Chăm-pa tiếp thu chữ viết, tôn giáo, kiến trúc, mô hình nhà nước của văn minh Ấn Độ.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào phản ánh đúng về kinh tế của Văn Lang – Âu Lạc?","options":["A. Nông nghiệp lúa nước là chủ đạo, kết hợp thủ công nghiệp và thương nghiệp.","B. Chỉ sống bằng săn bắn, hái lượm.","C. Thương mại đường biển phát triển vượt Chăm-pa.","D. Kinh tế hoàn toàn phụ thuộc vào Ấn Độ."],"answer":"A","explain":"Cư dân Văn Lang – Âu Lạc trồng lúa nước là chính, đồng thời phát triển chăn nuôi, đánh cá, nghề đúc đồng và có trao đổi thương mại.","points":0.25},{"type":"mcq","level":"TH","q":"Nhà nước Chăm-pa được tổ chức theo thể chế nào?","options":["A. Quân chủ chuyên chế trung ương tập quyền.","B. Dân chủ cộng hòa.","C. Liên minh các bộ lạc lỏng lẻo.","D. Chế độ nô lệ."],"answer":"A","explain":"Nhà nước Chăm-pa tổ chức theo chế độ quân chủ chuyên chế trung ương tập quyền, vua có quyền lực tối cao, cha truyền con nối.","points":0.25},{"type":"mcq","level":"VD","q":"Hiện vật nào sau đây là minh chứng tiêu biểu cho trình độ luyện kim của cư dân Đông Sơn?","options":["A. Trống đồng Ngọc Lũ.","B. Đài thờ Trà Kiệu.","C. Bình gốm Ken-đi.","D. Tháp Chăm Mỹ Sơn."],"answer":"A","explain":"Trống đồng Ngọc Lũ (Hà Nam) với hoa văn tinh xảo là đỉnh cao kĩ thuật đúc đồng và mĩ thuật của văn hóa Đông Sơn.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao nói cư dân bản địa là chủ thể chính sáng tạo nên các nền văn minh cổ trên đất nước Việt Nam?","options":["A. Vì các thành tựu đều do cư dân bản địa tạo ra trên cơ sở điều kiện tự nhiên, xã hội của mình, chỉ tiếp thu có chọn lọc yếu tố bên ngoài.","B. Vì không có bất kì ảnh hưởng nào từ bên ngoài.","C. Vì các nhà nước cổ đều do người nước ngoài lập ra.","D. Vì cư dân bản địa không biết tiếp thu văn minh khác."],"answer":"A","explain":"Các nền văn minh cổ hình thành từ lao động, sáng tạo của cư dân bản địa; yếu tố Ấn Độ (ở Chăm-pa, Phù Nam) chỉ được tiếp thu có chọn lọc.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Văn hóa Sa Huỳnh là nền văn hóa của cư dân Chăm-pa.","b) Văn hóa Óc Eo là nền văn hóa của cư dân Phù Nam.","c) Văn hóa Đông Sơn là nền văn hóa của cư dân Văn Lang – Âu Lạc.","d) Cả ba nền văn hóa trên đều thuộc thời đại đồ đá."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: đây là các nền văn hóa thời đại kim khí (đồ đồng, đồ sắt), không phải đồ đá.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về đời sống của cư dân các nền văn minh cổ:","statements":["a) Cư dân Văn Lang – Âu Lạc và Phù Nam đều ở nhà sàn.","b) Cư dân Chăm-pa xây nhà trệt bằng gạch nung.","c) Phương tiện đi lại chủ yếu của cả ba nền văn minh đều là thuyền bè.","d) Cư dân Phù Nam không biết trồng lúa nước."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: sông nước nhiều nên thuyền bè là phương tiện chính. d) Sai: lúa gạo vẫn là lương thực chính của Phù Nam.","points":1},{"type":"short","level":"VD","q":"Kinh đô của nhà nước Âu Lạc có tên là gì?","answer":"Cổ Loa","explain":"An Dương Vương dời đô về Cổ Loa (nay thuộc Đông Anh, Hà Nội) và cho xây thành Cổ Loa hình xoáy ốc.","points":0.5},{"type":"short","level":"VDC","q":"Vị vua đầu tiên của nhà nước Lâm Ấp (năm 192) có tên là gì?","answer":"Khu Liên","explain":"Năm 192, Khu Liên lãnh đạo nhân dân vùng Tượng Lâm nổi dậy, lập ra nhà nước Lâm Ấp.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Kinh đô đầu tiên của nhà nước Chăm-pa là","options":["A. Sin-ha-pu-ra (Trà Kiệu).","B. Vi-ja-ya (Đồ Bàn).","C. Cổ Loa.","D. Phong Châu."],"answer":"A","explain":"Kinh đô đầu tiên của Lâm Ấp/Chăm-pa là Sin-ha-pu-ra (Trà Kiệu, Quảng Nam), sau mới dời về Vi-ja-ya (Đồ Bàn, Bình Định).","points":0.25},{"type":"mcq","level":"NB","q":"Tín ngưỡng phổ biến của cư dân Văn Lang – Âu Lạc là","options":["A. thờ cúng tổ tiên, sùng bái tự nhiên.","B. thờ thần Si-va.","C. theo Nho giáo.","D. theo Công giáo."],"answer":"A","explain":"Cư dân Văn Lang – Âu Lạc có tín ngưỡng thờ cúng tổ tiên và sùng bái các lực lượng tự nhiên.","points":0.25},{"type":"mcq","level":"TH","q":"Nhà nước Phù Nam cai trị bằng","options":["A. cả vương quyền và thần quyền.","B. chỉ bằng pháp luật thành văn.","C. hội đồng các bô lão.","D. chế độ dân chủ trực tiếp."],"answer":"A","explain":"Vua Phù Nam có quyền lực cao nhất, cai trị bằng cả vương quyền và thần quyền, có hệ thống quan lại nhiều cấp.","points":0.25},{"type":"mcq","level":"TH","q":"Di sản nào sau đây thuộc văn minh Phù Nam?","options":["A. Di chỉ Óc Eo với nhiều hiện vật kim hoàn.","B. Trống đồng Ngọc Lũ.","C. Thành Cổ Loa.","D. Đền tháp Mỹ Sơn."],"answer":"A","explain":"Di chỉ Óc Eo (An Giang) với đồ kim hoàn tinh xảo là di sản tiêu biểu của văn minh Phù Nam.","points":0.25},{"type":"mcq","level":"VD","q":"Nguyên nhân sâu xa dẫn đến sự ra đời của các nhà nước cổ trên đất nước Việt Nam là","options":["A. nhu cầu trị thủy, chống ngoại xâm và sự phân hóa xã hội.","B. sự xâm lược của Ấn Độ.","C. sự truyền bá của Phật giáo.","D. nhu cầu buôn bán với Trung Hoa."],"answer":"A","explain":"Nhu cầu liên kết trị thủy, làm thủy lợi, đấu tranh chống ngoại xâm cùng sự phân hóa giàu nghèo đã thúc đẩy sự ra đời của nhà nước.","points":0.25},{"type":"mcq","level":"VDC","q":"Điểm tương đồng về tổ chức nhà nước giữa Chăm-pa và Phù Nam là","options":["A. đều theo chế độ quân chủ, vua có quyền lực cao nhất.","B. đều do hội đồng tăng lữ đứng đầu.","C. đều là nhà nước liên bang.","D. đều không có bộ máy quan lại."],"answer":"A","explain":"Cả Chăm-pa và Phù Nam đều tổ chức theo chế độ quân chủ (tập quyền ở Chăm-pa; vương quyền kết hợp thần quyền ở Phù Nam), vua có quyền lực tối cao.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhà nước Văn Lang do Hùng Vương đứng đầu.","b) Nhà nước Âu Lạc do An Dương Vương đứng đầu.","c) Nhà nước Lâm Ấp do Khu Liên sáng lập.","d) Nhà nước Phù Nam do Ngô Quyền sáng lập."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Ngô Quyền là người sáng lập nhà Ngô (thế kỉ X), không liên quan đến Phù Nam.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về ảnh hưởng của văn minh Ấn Độ:","statements":["a) Chăm-pa tiếp thu chữ viết, tôn giáo, kiến trúc của Ấn Độ.","b) Phù Nam chịu ảnh hưởng của Ấn Độ qua thương mại biển.","c) Văn Lang – Âu Lạc chịu ảnh hưởng sâu sắc của văn minh Ấn Độ.","d) Ấn Độ giáo thờ thần Si-va phổ biến ở Chăm-pa."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: Văn Lang – Âu Lạc không chịu ảnh hưởng của văn minh Ấn Độ.","points":1},{"type":"short","level":"VD","q":"Nhà nước Văn Lang ra đời vào khoảng thế kỉ nào (ghi dạng: TK VII TCN)?","answer":"TK VII TCN","explain":"Nhà nước Văn Lang ra đời khoảng thế kỉ VII TCN trên lưu vực sông Hồng.","points":0.5},{"type":"short","level":"VDC","q":"Phiên bản trống đồng nào được Việt Nam chọn làm quà tặng Liên hợp quốc nhân kỉ niệm 50 năm thành lập tổ chức này?","answer":"Trống đồng Ngọc Lũ","explain":"Trống đồng Ngọc Lũ là chiếc trống điển hình nhất của văn hóa Đông Sơn, được chọn làm quà tặng Liên hợp quốc.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Địa bàn chủ yếu của văn minh Chăm-pa là","options":["A. miền Trung và một phần Tây Nguyên.","B. đồng bằng sông Hồng.","C. đồng bằng sông Cửu Long.","D. vùng Đông Bắc."],"answer":"A","explain":"Văn minh Chăm-pa hình thành ở miền Trung (từ Quảng Nam đến Bình Thuận) và một phần Tây Nguyên.","points":0.25},{"type":"mcq","level":"NB","q":"Hoạt động kinh tế nổi bật nhất của Phù Nam là","options":["A. buôn bán qua đường biển.","B. chăn nuôi du mục.","C. khai thác dầu mỏ.","D. trồng cây công nghiệp."],"answer":"A","explain":"Phù Nam là trung tâm buôn bán thương mại quốc tế sầm uất qua đường biển với thương cảng Óc Eo.","points":0.25},{"type":"mcq","level":"TH","q":"Kĩ thuật nào làm nên sự độc đáo của kiến trúc đền tháp Chăm-pa?","options":["A. Xây gạch không cần chất kết dính mà vẫn bền vững.","B. Đúc đồng nguyên khối.","C. Chạm khắc trên đá hoa cương duy nhất.","D. Dựng nhà sàn bằng gỗ lim."],"answer":"A","explain":"Tháp Chăm được xây bằng gạch nung xếp khít không cần vữa kết dính mà vẫn bền vững hàng nghìn năm.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao cư dân Văn Lang – Âu Lạc sống quần tụ thành làng?","options":["A. Để cùng trị thủy, làm thủy lợi và chống ngoại xâm.","B. Để buôn bán với Ấn Độ.","C. Để tránh thú dữ duy nhất.","D. Do bị ép buộc di cư."],"answer":"A","explain":"Nhu cầu trị thủy, làm thủy lợi phục vụ nông nghiệp lúa nước và đấu tranh chống ngoại xâm khiến cư dân quần tụ thành làng.","points":0.25},{"type":"mcq","level":"VD","q":"Nhận xét nào đúng về vai trò của thương mại đường biển đối với Chăm-pa và Phù Nam?","options":["A. Là động lực quan trọng thúc đẩy kinh tế và giao lưu văn hóa.","B. Không có vai trò gì.","C. Chỉ phục vụ nhu cầu đánh cá.","D. Làm cho hai quốc gia bị lệ thuộc hoàn toàn."],"answer":"A","explain":"Buôn bán đường biển mang lại sự giàu có, đồng thời là con đường tiếp thu văn minh Ấn Độ của Chăm-pa và Phù Nam.","points":0.25},{"type":"mcq","level":"VDC","q":"So với Văn Lang – Âu Lạc, nhà nước Chăm-pa và Phù Nam có tổ chức","options":["A. hoàn chỉnh, chặt chẽ hơn với chế độ quân chủ.","B. lỏng lẻo và sơ khai hơn.","C. hoàn toàn giống nhau.","D. không có vua đứng đầu."],"answer":"A","explain":"SGK nhận xét tổ chức nhà nước Văn Lang – Âu Lạc còn đơn giản, sơ khai; trong khi Chăm-pa, Phù Nam đã có chế độ quân chủ với bộ máy quan lại.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cư dân Chăm-pa giỏi buôn bán bằng đường biển.","b) Cư dân Phù Nam phát triển mạnh thương mại đường biển.","c) Thương mại đường biển của Văn Lang – Âu Lạc kém phát triển hơn.","d) Óc Eo là thương cảng của Chăm-pa."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: Óc Eo là thương cảng của Phù Nam, không phải Chăm-pa.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về thành Cổ Loa:","statements":["a) Thành Cổ Loa là kinh đô của nhà nước Âu Lạc.","b) Thành Cổ Loa được xây theo hình xoáy ốc.","c) Thành Cổ Loa nay thuộc Đông Anh, Hà Nội.","d) Thành Cổ Loa do vua Hùng cho xây dựng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: thành Cổ Loa do An Dương Vương cho xây dựng, không phải vua Hùng.","points":1},{"type":"short","level":"VD","q":"Chữ viết cổ của người Chăm được sáng tạo trên cơ sở tiếp thu chữ viết nào của Ấn Độ?","answer":"Chữ Phạn","explain":"Người Chăm tiếp thu chữ Phạn (Sanskrit) của Ấn Độ để sáng tạo ra chữ Chăm cổ.","points":0.5},{"type":"short","level":"VDC","q":"Nhà nước Chăm-pa chính thức mang tên Chăm-pa từ thế kỉ nào (ghi dạng: TK VII)?","answer":"TK VII","explain":"Nhà nước Lâm Ấp (ra đời năm 192) đến thế kỉ VII đổi tên thành Chăm-pa.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Nền kinh tế chủ đạo của các nền văn minh cổ trên đất nước Việt Nam là","options":["A. nông nghiệp trồng lúa nước.","B. công nghiệp nặng.","C. chăn nuôi du mục.","D. khai thác khoáng sản."],"answer":"A","explain":"Cả ba nền văn minh Văn Lang – Âu Lạc, Chăm-pa, Phù Nam đều lấy nông nghiệp lúa nước làm kinh tế chủ đạo.","points":0.25},{"type":"mcq","level":"NB","q":"Di sản văn hóa thế giới nào thuộc văn minh Chăm-pa?","options":["A. Khu đền tháp Mỹ Sơn.","B. Hoàng thành Thăng Long.","C. Cố đô Hoa Lư.","D. Phố cổ Hội An."],"answer":"A","explain":"Khu đền tháp Mỹ Sơn (Quảng Nam) được UNESCO công nhận Di sản văn hóa thế giới năm 1999.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm chung về đời sống tinh thần của cư dân Văn Lang – Âu Lạc là","options":["A. thờ cúng tổ tiên, sùng bái tự nhiên, nhiều lễ hội.","B. chỉ theo một tôn giáo duy nhất.","C. không có đời sống tinh thần.","D. hoàn toàn theo văn hóa Ấn Độ."],"answer":"A","explain":"Cư dân Văn Lang – Âu Lạc có tín ngưỡng thờ cúng tổ tiên, sùng bái tự nhiên, âm nhạc nghệ thuật phát triển và nhiều lễ hội truyền thống.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Phù Nam trở thành trung tâm thương mại quốc tế?","options":["A. Do vị trí trên tuyến hải thương nối Ấn Độ với Trung Hoa.","B. Do có nhiều vàng bạc trong lòng đất.","C. Do được La Mã bảo hộ.","D. Do không có chiến tranh."],"answer":"A","explain":"Phù Nam nằm trên tuyến đường biển huyết mạch nối Ấn Độ Dương với Đông Á, nên Óc Eo trở thành thương cảng quốc tế sầm uất.","points":0.25},{"type":"mcq","level":"VD","q":"Việc tiếp thu văn minh Ấn Độ của Chăm-pa và Phù Nam thể hiện trên những lĩnh vực nào?","options":["A. Chữ viết, tôn giáo, kiến trúc, mô hình nhà nước.","B. Chỉ trong lĩnh vực quân sự.","C. Chỉ trong lĩnh vực ẩm thực.","D. Không thể hiện ở lĩnh vực nào."],"answer":"A","explain":"SGK nêu Chăm-pa, Phù Nam tiếp thu văn minh Ấn Độ về chữ viết, tôn giáo, mô hình tổ chức nhà nước, pháp luật, kiến trúc.","points":0.25},{"type":"mcq","level":"VDC","q":"Ý nghĩa của việc nghiên cứu các nền văn minh cổ đối với hiện nay là","options":["A. hiểu cội nguồn dân tộc, bảo tồn và phát huy di sản văn hóa.","B. để phục dựng lại các nhà nước cổ.","C. để chứng minh Việt Nam chịu ảnh hưởng hoàn toàn từ bên ngoài.","D. không có ý nghĩa thực tiễn."],"answer":"A","explain":"Nghiên cứu các nền văn minh cổ giúp hiểu cội nguồn dân tộc, từ đó bảo tồn, phát huy giá trị di sản trong phát triển đất nước.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nông nghiệp lúa nước là kinh tế chủ đạo của Văn Lang – Âu Lạc.","b) Lúa gạo là lương thực chính của cư dân Chăm-pa.","c) Cư dân Phù Nam chủ yếu sống bằng nghề buôn bán nô lệ.","d) Nghề đúc đồng của cư dân Đông Sơn đạt trình độ cao."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: kinh tế Phù Nam gồm nông nghiệp, thủ công nghiệp và thương mại chân chính, không phải buôn bán nô lệ.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trống đồng là hiện vật tiêu biểu của văn hóa Đông Sơn.","b) Đài thờ Trà Kiệu gắn với văn minh Chăm-pa.","c) Bình gốm Ken-đi gắn với văn minh Phù Nam.","d) Cả ba hiện vật trên đều thuộc văn minh Văn Lang – Âu Lạc."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng (SGK tr.93 nêu ba hiện vật tiêu biểu). d) Sai: mỗi hiện vật thuộc một nền văn minh khác nhau.","points":1},{"type":"short","level":"VD","q":"Nhà nước Phù Nam phát triển mạnh mẽ nhất trong các thế kỉ nào (ghi dạng: III – V)?","answer":"III – V","explain":"Phù Nam ra đời thế kỉ I và phát triển mạnh mẽ trong các thế kỉ III – V.","points":0.5},{"type":"short","level":"VDC","q":"Tôn giáo mà cư dân Chăm-pa thờ thần Si-va có nguồn gốc từ đâu?","answer":"Ấn Độ","explain":"Ấn Độ giáo (thờ thần Si-va) được người Chăm tiếp thu từ văn minh Ấn Độ qua con đường thương mại biển.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Cư dân chủ nhân của văn minh Chăm-pa thuộc nền văn hóa nào?","options":["A. Văn hóa Sa Huỳnh.","B. Văn hóa Đông Sơn.","C. Văn hóa Óc Eo.","D. Văn hóa Hòa Bình."],"answer":"A","explain":"Cư dân văn hóa Sa Huỳnh là chủ nhân của văn minh Chăm-pa ở miền Trung.","points":0.25},{"type":"mcq","level":"NB","q":"Cư dân chủ nhân của văn minh Phù Nam thuộc nền văn hóa nào?","options":["A. Văn hóa Óc Eo.","B. Văn hóa Đông Sơn.","C. Văn hóa Sa Huỳnh.","D. Văn hóa Phùng Nguyên."],"answer":"A","explain":"Văn hóa Óc Eo là nền văn hóa vật chất của cư dân Phù Nam ở Nam Bộ.","points":0.25},{"type":"mcq","level":"TH","q":"Nhà nước Văn Lang ra đời trong bối cảnh nào?","options":["A. Nhu cầu trị thủy, chống ngoại xâm và sự phân hóa xã hội.","B. Sự xâm lược của nhà Hán.","C. Sự truyền bá Phật giáo từ Ấn Độ.","D. Sự giúp đỡ của các thương nhân Ả Rập."],"answer":"A","explain":"Nhu cầu liên kết trị thủy, làm thủy lợi, đấu tranh chống ngoại xâm cùng sự phân hóa giàu nghèo đã dẫn đến sự ra đời của nhà nước Văn Lang.","points":0.25},{"type":"mcq","level":"TH","q":"Đặc điểm tổ chức xã hội của cư dân Chăm-pa thời kì đầu là","options":["A. cụm làng và liên minh cụm làng.","B. công xã thị tộc mẫu hệ duy nhất.","C. chế độ phong kiến hoàn chỉnh.","D. xã hội chiếm hữu nô lệ."],"answer":"A","explain":"Xã hội Chăm-pa thời kì đầu có cơ cấu dạng lãnh địa hay liên minh cụm làng, sau mới phát triển thành nhà nước quân chủ tập quyền.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao nói văn minh Phù Nam có tính chất “mở” về văn hóa?","options":["A. Vì tiếp thu có chọn lọc văn minh Ấn Độ qua thương mại biển và giao lưu với nhiều tộc người.","B. Vì không có bản sắc riêng.","C. Vì bị đồng hóa hoàn toàn.","D. Vì từ chối mọi ảnh hưởng bên ngoài."],"answer":"A","explain":"Phù Nam hình thành từ nhiều tộc người, nhiều tiểu quốc, nằm trên tuyến thương mại quốc tế nên văn hóa có tính giao lưu, tiếp biến mạnh mẽ.","points":0.25},{"type":"mcq","level":"VDC","q":"Bài học lịch sử rút ra từ sự phát triển của các nền văn minh cổ là","options":["A. phát huy nội lực dân tộc, đồng thời tiếp thu có chọn lọc tinh hoa văn minh nhân loại.","B. đóng cửa, từ chối giao lưu.","C. chỉ trông chờ vào viện trợ bên ngoài.","D. từ bỏ bản sắc để hội nhập."],"answer":"A","explain":"Các nền văn minh cổ phát triển rực rỡ nhờ sức sáng tạo của cư dân bản địa kết hợp với việc tiếp thu có chọn lọc (Chăm-pa, Phù Nam) tinh hoa bên ngoài.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Văn minh Văn Lang – Âu Lạc hình thành ở Bắc Bộ và Bắc Trung Bộ.","b) Văn minh Chăm-pa hình thành ở miền Trung.","c) Văn minh Phù Nam hình thành ở Nam Bộ.","d) Cả ba nền văn minh đều hình thành ở đồng bằng sông Hồng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: chỉ Văn Lang – Âu Lạc ở lưu vực sông Hồng; Chăm-pa ở miền Trung, Phù Nam ở Nam Bộ.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lưỡi cày đồng là bước tiến trong nông nghiệp của cư dân Đông Sơn.","b) Người Chăm xây nhà trệt bằng gạch nung.","c) Người Phù Nam có nghệ thuật kim hoàn phát triển cao.","d) Người Việt cổ thời Đông Sơn đã biết làm đường sắt."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: thời Đông Sơn chưa có đường sắt; đây là thành tựu của cách mạng công nghiệp sau này.","points":1},{"type":"short","level":"VD","q":"Vị vua nào đã đánh bại Hùng Vương, lập ra nhà nước Âu Lạc (ghi tên)?","answer":"An Dương Vương","explain":"Năm 208 TCN, Thục Phán (An Dương Vương) đánh bại Hùng Vương, sáp nhập Văn Lang, lập ra nhà nước Âu Lạc.","points":0.5},{"type":"short","level":"VDC","q":"Theo SGK, nhà nước Văn Lang xuất hiện cách ngày nay khoảng bao nhiêu năm (ghi số năm)?","answer":"2700 năm","explain":"SGK nêu nhà nước Văn Lang xuất hiện cách ngày nay khoảng 2700 năm (khoảng thế kỉ VII TCN).","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Quốc gia cổ nào ra đời sớm nhất trên đất nước Việt Nam?","options":["A. Văn Lang.","B. Chăm-pa.","C. Phù Nam.","D. Đại Việt."],"answer":"A","explain":"Nhà nước Văn Lang (khoảng thế kỉ VII TCN) ra đời sớm nhất, trước Phù Nam (thế kỉ I) và Lâm Ấp/Chăm-pa (năm 192).","points":0.25},{"type":"mcq","level":"NB","q":"Tục táng nào KHÔNG phải của cư dân Phù Nam?","options":["A. Địa táng trong quan tài đá.","B. Hỏa táng.","C. Thủy táng.","D. Điểu táng."],"answer":"A","explain":"Cư dân Phù Nam có tục hỏa táng, thủy táng, điểu táng (chịu ảnh hưởng văn hóa Ấn Độ).","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào KHÔNG phản ánh đúng thành tựu của văn minh Văn Lang – Âu Lạc?","options":["A. Xây dựng nhiều đền tháp bằng gạch theo phong cách Ấn Độ.","B. Đúc trống đồng đạt trình độ cao.","C. Xây thành Cổ Loa hình xoáy ốc.","D. Trồng lúa nước với lưỡi cày đồng."],"answer":"A","explain":"Đền tháp gạch phong cách Ấn Độ là thành tựu của Chăm-pa; Văn Lang – Âu Lạc không chịu ảnh hưởng Ấn Độ.","points":0.25},{"type":"mcq","level":"TH","q":"Con đường chủ yếu đưa văn minh Ấn Độ đến Chăm-pa và Phù Nam là","options":["A. thương mại biển.","B. chiến tranh xâm lược.","C. truyền giáo đường bộ duy nhất.","D. di cư ồ ạt."],"answer":"A","explain":"Văn minh Ấn Độ đến Chăm-pa, Phù Nam chủ yếu qua các thương nhân trên tuyến đường biển, mang tính hòa bình, tiếp biến.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao các nhà nước cổ Chăm-pa, Phù Nam đều theo chế độ quân chủ?","options":["A. Do nhu cầu tập trung quyền lực để quản lí thủy lợi, thương mại và quốc phòng.","B. Do bị Ấn Độ ép buộc.","C. Do học theo Trung Hoa hoàn toàn.","D. Do không có tầng lớp quý tộc."],"answer":"A","explain":"Quản lí một quốc gia nông nghiệp – thương nghiệp với nhiều tộc người, tiểu quốc đòi hỏi quyền lực tập trung ở vua.","points":0.25},{"type":"mcq","level":"VDC","q":"Điểm tiến bộ của nhà nước Âu Lạc so với Văn Lang thể hiện ở","options":["A. lãnh thổ mở rộng, thành Cổ Loa kiên cố, quân đội mạnh với nỏ thần.","B. từ bỏ nông nghiệp lúa nước.","C. chuyển sang theo Ấn Độ giáo.","D. dời đô vào Nam Bộ."],"answer":"A","explain":"Âu Lạc kế thừa Văn Lang, mở rộng lãnh thổ, xây thành Cổ Loa kiên cố, tổ chức quân đội mạnh (truyền thuyết nỏ thần).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhà nước Văn Lang ra đời trước nhà nước Phù Nam.","b) Nhà nước Âu Lạc ra đời sau nhà nước Văn Lang.","c) Nhà nước Lâm Ấp ra đời sau nhà nước Phù Nam.","d) Nhà nước Đại Việt ra đời trước nhà nước Văn Lang."],"answer":["T","T","T","F"],"explain":"a) Đúng: Văn Lang (TK VII TCN) trước Phù Nam (TK I). b) Đúng: Âu Lạc (208 TCN) sau Văn Lang. c) Đúng: Lâm Ấp (192) sau Phù Nam (TK I). d) Sai: Đại Việt (TK X) ra đời sau Văn Lang rất lâu.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Kinh tế Chăm-pa có khai thác lâm sản và buôn bán đường biển.","b) Kinh tế Phù Nam có nông nghiệp, thủ công nghiệp và thương mại.","c) Kinh tế Văn Lang – Âu Lạc chỉ có săn bắn hái lượm.","d) Cả ba nền văn minh đều biết đúc đồng."],"answer":["T","T","F","T"],"explain":"a), b) Đúng. c) Sai: Văn Lang – Âu Lạc có nông nghiệp lúa nước phát triển. d) Đúng: kĩ thuật luyện kim đồng đều phát triển ở cả ba.","points":1},{"type":"short","level":"VD","q":"Khu đền tháp Mỹ Sơn của người Chăm hiện nay thuộc tỉnh nào?","answer":"Quảng Nam","explain":"Khu đền tháp Mỹ Sơn nằm ở huyện Duy Xuyên, tỉnh Quảng Nam.","points":0.5},{"type":"short","level":"VDC","q":"Di chỉ văn hóa Óc Eo – trung tâm của văn minh Phù Nam – hiện nay thuộc tỉnh nào?","answer":"An Giang","explain":"Di chỉ Óc Eo nằm ở huyện Thoại Sơn, tỉnh An Giang, là thương cảng quốc tế của Phù Nam xưa.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Nhà nước Âu Lạc do ai đứng đầu?","options":["A. An Dương Vương.","B. Hùng Vương.","C. Khu Liên.","D. Ngô Quyền."],"answer":"A","explain":"An Dương Vương (Thục Phán) là người sáng lập và đứng đầu nhà nước Âu Lạc (208 – 179 TCN).","points":0.25},{"type":"mcq","level":"NB","q":"Văn minh Phù Nam chịu ảnh hưởng của văn minh nào?","options":["A. Văn minh Ấn Độ.","B. Văn minh Trung Hoa.","C. Văn minh Hi Lạp.","D. Văn minh Ai Cập."],"answer":"A","explain":"Phù Nam chịu ảnh hưởng của văn minh Ấn Độ thông qua con đường thương mại biển.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói nông nghiệp lúa nước là cơ sở kinh tế của các nền văn minh cổ Việt Nam?","options":["A. Vì điều kiện sông ngòi, phù sa thuận lợi và lúa gạo là lương thực chính.","B. Vì không biết nghề nào khác.","C. Vì bị ép buộc trồng lúa.","D. Vì lúa gạo dùng để xuất khẩu duy nhất."],"answer":"A","explain":"Lưu vực sông lớn, đồng bằng phù sa màu mỡ tạo điều kiện trồng lúa nước; lúa gạo là lương thực chính của cư dân.","points":0.25},{"type":"mcq","level":"TH","q":"Tổ chức nhà nước Văn Lang gồm các chức quan nào?","options":["A. Vua (Hùng Vương), Lạc hầu, Lạc tướng, Bồ chính.","B. Vua, tể tướng, thượng thư.","C. Vua, giáo hoàng, tăng lữ.","D. Vua, hội đồng bô lão."],"answer":"A","explain":"Nhà nước Văn Lang đứng đầu là Hùng Vương, giúp việc có Lạc hầu, Lạc tướng; Bồ chính đứng đầu các chiềng, chạ.","points":0.25},{"type":"mcq","level":"VD","q":"Sự ra đời của nhà nước là bước ngoặt vì","options":["A. đánh dấu xã hội có giai cấp, có tổ chức quyền lực công cộng.","B. đánh dấu sự xuất hiện của chữ viết.","C. đánh dấu sự biến mất của làng xã.","D. đánh dấu sự phụ thuộc vào nước ngoài."],"answer":"A","explain":"Nhà nước ra đời khi xã hội phân hóa giai cấp, cần một tổ chức quyền lực công cộng để quản lí xã hội, trị thủy và chống ngoại xâm.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định nào KHÔNG đúng về văn minh Chăm-pa?","options":["A. Là nền văn minh bản địa thuần khiết, không chịu ảnh hưởng bên ngoài.","B. Chịu ảnh hưởng sâu sắc của văn minh Ấn Độ.","C. Có chữ viết riêng (chữ Chăm cổ).","D. Có kiến trúc đền tháp độc đáo."],"answer":"A","explain":"Chăm-pa chịu ảnh hưởng sâu sắc của văn minh Ấn Độ; nhận định “bản địa thuần khiết” là sai (đó là đặc điểm của Văn Lang – Âu Lạc).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trống đồng Đông Sơn phản ánh đời sống của cư dân Văn Lang – Âu Lạc.","b) Tháp Chăm phản ánh ảnh hưởng của văn minh Ấn Độ.","c) Đồ kim hoàn Óc Eo phản ánh sự phát triển của Phù Nam.","d) Cả ba di sản trên đều thuộc cùng một nền văn minh."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mỗi di sản thuộc một nền văn minh khác nhau.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhà nước là sản phẩm của xã hội có giai cấp.","b) Làng là tế bào xã hội của các nền văn minh cổ Việt Nam.","c) Cư dân bản địa là chủ thể sáng tạo văn minh.","d) Các nền văn minh cổ Việt Nam đều do người nước ngoài xây dựng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: cư dân bản địa là chủ thể chính sáng tạo nên các nền văn minh.","points":1},{"type":"short","level":"VD","q":"Thành Cổ Loa – kinh đô của Âu Lạc – được xây dựng theo hình gì?","answer":"Hình xoáy ốc","explain":"Thành Cổ Loa có cấu trúc gồm nhiều vòng thành xoáy ốc độc đáo, thể hiện trình độ xây dựng cao.","points":0.5},{"type":"short","level":"VDC","q":"Ba nền văn minh cổ trên đất nước Việt Nam đều lấy ngành kinh tế nào làm chủ đạo (ghi 4 chữ)?","answer":"Nông nghiệp lúa nước","explain":"Nông nghiệp trồng lúa nước là kinh tế chủ đạo của cả Văn Lang – Âu Lạc, Chăm-pa và Phù Nam.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Thời gian tồn tại của nhà nước Văn Lang là","options":["A. khoảng thế kỉ VII TCN – 208 TCN.","B. 208 – 179 TCN.","C. thế kỉ I – VII.","D. năm 192 – thế kỉ VII."],"answer":"A","explain":"Nhà nước Văn Lang tồn tại từ khoảng thế kỉ VII TCN đến năm 208 TCN.","points":0.25},{"type":"mcq","level":"NB","q":"Vua của Phù Nam cai trị dựa trên","options":["A. cả vương quyền và thần quyền.","B. chỉ pháp luật thành văn.","C. sự bầu cử của dân.","D. sự chỉ định của Ấn Độ."],"answer":"A","explain":"Vua Phù Nam có quyền lực cao nhất, cai trị bằng cả vương quyền và thần quyền.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm chung về cơ sở hình thành của ba nền văn minh cổ là","options":["A. đều gắn với lưu vực sông, biển và cư dân bản địa.","B. đều do người Ấn Độ trực tiếp xây dựng.","C. đều hình thành trên núi cao.","D. đều không có nông nghiệp."],"answer":"A","explain":"Cả ba nền văn minh đều hình thành trên các lưu vực sông, vùng ven biển thuận lợi, với cư dân bản địa là chủ thể.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao trống đồng Ngọc Lũ được chọn làm quà tặng Liên hợp quốc?","options":["A. Vì là hiện vật tiêu biểu cho văn hóa Đông Sơn – văn hóa bản địa lâu đời của người Việt cổ.","B. Vì được đúc bằng vàng ròng.","C. Vì có nguồn gốc nước ngoài.","D. Vì là trống đồng duy nhất còn lại."],"answer":"A","explain":"Trống đồng Ngọc Lũ điển hình, hài hòa, tiêu biểu cho nền văn hóa Đông Sơn bản địa lâu đời nên được chọn làm quà tặng LHQ.","points":0.25},{"type":"mcq","level":"VD","q":"Mối quan hệ giữa điều kiện tự nhiên và sự hình thành văn minh cổ thể hiện ở","options":["A. sông ngòi, phù sa, khoáng sản, biển tạo điều kiện cho nông nghiệp, luyện kim, thương mại.","B. điều kiện tự nhiên không ảnh hưởng gì.","C. chỉ có khoáng sản là quan trọng.","D. văn minh chỉ hình thành ở vùng núi cao."],"answer":"A","explain":"Lưu vực sông lớn cho nông nghiệp lúa nước, khoáng sản cho luyện kim, bờ biển dài cho thương mại – tất cả thúc đẩy văn minh ra đời.","points":0.25},{"type":"mcq","level":"VDC","q":"Từ sự phát triển của Phù Nam, có thể rút ra bài học nào cho phát triển kinh tế biển hiện nay?","options":["A. Khai thác lợi thế vị trí địa lí, mở cửa giao thương quốc tế.","B. Đóng cửa biên giới biển.","C. Chỉ phát triển đánh bắt gần bờ.","D. Từ bỏ thương mại biển."],"answer":"A","explain":"Phù Nam thịnh vượng nhờ khai thác vị trí trên tuyến hải thương quốc tế – bài học về phát triển kinh tế biển mở, hội nhập.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Văn Lang – Âu Lạc: văn hóa Đông Sơn.","b) Chăm-pa: văn hóa Sa Huỳnh.","c) Phù Nam: văn hóa Óc Eo.","d) Đại Việt: văn hóa Hòa Bình."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: văn hóa Hòa Bình thuộc thời nguyên thủy, không phải của văn minh Đại Việt.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Năm 192: nhà nước Lâm Ấp ra đời.","b) Năm 208 TCN: nhà nước Âu Lạc ra đời.","c) Thế kỉ I: nhà nước Phù Nam ra đời.","d) Năm 938: nhà nước Văn Lang ra đời."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: năm 938 là chiến thắng Bạch Đằng, mở đầu thời Ngô (Đại Việt), không phải Văn Lang.","points":1},{"type":"short","level":"VD","q":"Nền văn hóa nào là cơ sở vật chất của văn minh Văn Lang – Âu Lạc (ghi 2 chữ)?","answer":"Đông Sơn","explain":"Văn hóa Đông Sơn là nền văn hóa vật chất rực rỡ của cư dân Văn Lang – Âu Lạc thời đại kim khí.","points":0.5},{"type":"short","level":"VDC","q":"Theo SGK, ba nền văn minh cổ trên đất nước Việt Nam có điểm chung về tổ chức cư trú là sống theo đơn vị nào (ghi 1 chữ)?","answer":"Làng","explain":"Cư dân cả ba nền văn minh đều quần tụ thành làng (liên minh cụm làng) – tế bào cơ bản của xã hội.","points":0.5}]}]}</script>
