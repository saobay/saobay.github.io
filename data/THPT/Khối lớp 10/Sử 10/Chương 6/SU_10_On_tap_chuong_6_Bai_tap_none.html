<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Nền văn minh nào KHÔNG thuộc chương 6?","options":["A. Văn minh Ai Cập.","B. Văn minh Văn Lang – Âu Lạc.","C. Văn minh Chăm-pa.","D. Văn minh Phù Nam."],"answer":"A","explain":"Chương 6 gồm Văn Lang – Âu Lạc, Chăm-pa, Phù Nam và Đại Việt; văn minh Ai Cập thuộc văn minh phương Đông cổ đại.","points":0.25},{"type":"mcq","level":"NB","q":"Nhà nước Đại Việt ra đời sau chiến thắng nào?","options":["A. Bạch Đằng (938).","B. Như Nguyệt (1077).","C. Đống Đa (1789).","D. Điện Biên Phủ (1954)."],"answer":"A","explain":"Chiến thắng Bạch Đằng năm 938 của Ngô Quyền mở đầu thời kì độc lập, hình thành văn minh Đại Việt.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm chung của ba nền văn minh cổ Văn Lang – Âu Lạc, Chăm-pa, Phù Nam là","options":["A. nông nghiệp lúa nước, tổ chức làng, cư dân bản địa là chủ thể.","B. đều chịu ảnh hưởng Ấn Độ.","C. đều có chữ viết từ đầu.","D. đều theo chế độ dân chủ."],"answer":"A","explain":"Cả ba đều lấy nông nghiệp lúa nước làm chủ đạo, cư dân sống theo làng và là chủ thể sáng tạo văn minh.","points":0.25},{"type":"mcq","level":"TH","q":"Văn minh Đại Việt kế thừa trực tiếp từ","options":["A. các nền văn minh cổ trên đất nước Việt Nam.","B. văn minh Trung Hoa nguyên xi.","C. văn minh phương Tây.","D. không kế thừa gì."],"answer":"A","explain":"SGK nêu văn minh Đại Việt có cội nguồn từ những nền văn minh cổ trên đất nước Việt Nam.","points":0.25},{"type":"mcq","level":"VD","q":"Sắp xếp đúng trình tự thời gian các nhà nước: (1) Âu Lạc, (2) Phù Nam, (3) Lâm Ấp, (4) Văn Lang.","options":["A. (4) – (1) – (2) – (3).","B. (1) – (4) – (3) – (2).","C. (2) – (3) – (4) – (1).","D. (3) – (2) – (1) – (4)."],"answer":"A","explain":"Văn Lang (TK VII TCN) → Âu Lạc (208 TCN) → Phù Nam (TK I) → Lâm Ấp (192).","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao văn minh Đại Việt phát triển rực rỡ hơn các nền văn minh cổ trước đó?","options":["A. Vì có quốc gia phong kiến độc lập, ổn định lâu dài và tiếp thu có chọn lọc.","B. Vì diện tích nhỏ hơn.","C. Vì không có chiến tranh nào.","D. Vì từ bỏ nông nghiệp."],"answer":"A","explain":"Nền độc lập lâu dài (TK X – giữa TK XIX), nhà nước tập quyền hoàn chỉnh và sự tiếp thu có chọn lọc giúp văn minh Đại Việt vượt trội.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chương 6 gồm Bài 11 (văn minh cổ) và Bài 12 (văn minh Đại Việt).","b) Văn minh Đại Việt bắt đầu từ thế kỉ X.","c) Văn Lang – Âu Lạc thuộc văn minh Đại Việt.","d) Chăm-pa chịu ảnh hưởng sâu sắc của văn minh Ấn Độ."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: Văn Lang – Âu Lạc là nền văn minh cổ, trước văn minh Đại Việt.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Năm 938: chiến thắng Bạch Đằng.","b) Năm 1010: dời đô về Thăng Long.","c) Năm 1428: nhà Lê sơ thành lập.","d) Năm 192: nhà Nguyễn thành lập."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: năm 192 là nhà nước Lâm Ấp ra đời; nhà Nguyễn thành lập năm 1802.","points":1},{"type":"short","level":"VD","q":"Kể tên một di sản văn hóa thế giới thuộc văn minh Chăm-pa (ghi 2 chữ)?","answer":"Mỹ Sơn","explain":"Khu đền tháp Mỹ Sơn (Quảng Nam) được UNESCO công nhận năm 1999.","points":0.5},{"type":"short","level":"VDC","q":"Bộ luật hoàn chỉnh thời Lê sơ, ban hành năm 1483, có tên gọi phổ biến là gì (ghi 3 chữ)?","answer":"Luật Hồng Đức","explain":"Quốc triều hình luật (1483) được sử gọi là Luật Hồng Đức, đỉnh cao pháp luật phong kiến.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Kinh đô đầu tiên của nhà nước phong kiến độc lập (thời Ngô) đặt ở","options":["A. Cổ Loa.","B. Thăng Long.","C. Hoa Lư.","D. Phú Xuân."],"answer":"A","explain":"Ngô Quyền xưng vương, đóng đô ở Cổ Loa sau chiến thắng Bạch Đằng 938.","points":0.25},{"type":"mcq","level":"NB","q":"Thương cảng Óc Eo thuộc nền văn minh nào?","options":["A. Phù Nam.","B. Chăm-pa.","C. Văn Lang.","D. Đại Việt."],"answer":"A","explain":"Óc Eo (An Giang) là thương cảng quốc tế sầm uất của văn minh Phù Nam.","points":0.25},{"type":"mcq","level":"TH","q":"Nhà nước Văn Lang – Âu Lạc khác nhà nước Đại Việt ở điểm nào?","options":["A. Tổ chức còn đơn giản, sơ khai; chưa có luật pháp thành văn hoàn chỉnh.","B. Có quân đội hiện đại hơn.","C. Lãnh thổ rộng lớn hơn.","D. Tồn tại lâu hơn."],"answer":"A","explain":"Nhà nước Văn Lang – Âu Lạc còn sơ khai; nhà nước Đại Việt là quân chủ tập quyền hoàn chỉnh với luật pháp thành văn.","points":0.25},{"type":"mcq","level":"TH","q":"Yếu tố nào KHÔNG phải cơ sở hình thành văn minh Đại Việt?","options":["A. Sự đô hộ của thực dân Pháp.","B. Cội nguồn văn minh cổ.","C. Đấu tranh giành độc lập.","D. Tiếp thu có chọn lọc văn minh bên ngoài."],"answer":"A","explain":"Thực dân Pháp xâm lược (giữa TK XIX) là nguyên nhân suy thoái văn minh Đại Việt, không phải cơ sở hình thành.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao trống đồng được coi là biểu tượng chung của văn minh nông nghiệp Đông Nam Á cổ?","options":["A. Vì phản ánh trình độ luyện kim và đời sống cư dân nông nghiệp lúa nước.","B. Vì chỉ Việt Nam có trống đồng.","C. Vì trống đồng làm bằng vàng.","D. Vì trống đồng dùng để chiến đấu."],"answer":"A","explain":"Trống đồng thể hiện đỉnh cao kĩ thuật đúc đồng và phản ánh sinh động đời sống của cư dân nông nghiệp lúa nước.","points":0.25},{"type":"mcq","level":"VDC","q":"Bài học từ việc bảo tồn các di sản như Mỹ Sơn, Hoàng thành Thăng Long là","options":["A. di sản là cầu nối quá khứ – hiện tại, cần bảo tồn và phát huy.","B. chỉ nên giữ di sản của một triều đại.","C. di sản không có giá trị kinh tế.","D. nên thay thế di sản bằng công trình mới."],"answer":"A","explain":"Di sản văn hóa là bằng chứng lịch sử, niềm tự hào dân tộc và nguồn lực phát triển (du lịch, giáo dục).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Óc Eo là thương cảng của Phù Nam.","b) Mỹ Sơn là di sản của Chăm-pa.","c) Trống đồng là di sản của Văn Lang – Âu Lạc.","d) Văn Miếu là di sản của Phù Nam."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Văn Miếu (1070) là công trình thời Lý, thuộc văn minh Đại Việt.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhà nước Văn Lang – Âu Lạc còn sơ khai.","b) Nhà nước Đại Việt là quân chủ tập quyền hoàn chỉnh.","c) Cả hai nhà nước đều có luật pháp thành văn từ đầu.","d) Vua là người đứng đầu trong cả hai nhà nước."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: Văn Lang – Âu Lạc chưa có luật pháp thành văn; Đại Việt mới có (từ Hình thư 1042).","points":1},{"type":"short","level":"VD","q":"Vị vua dời đô về Thăng Long năm 1010 là ai (ghi tên)?","answer":"Lý Công Uẩn","explain":"Lý Công Uẩn (Lý Thái Tổ) dời đô năm 1010, mở kỉ nguyên mới của văn minh Đại Việt.","points":0.5},{"type":"short","level":"VDC","q":"Năm 192, nhà nước nào ra đời ở miền Trung (ghi 2 chữ)?","answer":"Lâm Ấp","explain":"Năm 192, Khu Liên lập ra nhà nước Lâm Ấp – tiền thân của Chăm-pa.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Văn minh Đại Việt tồn tại trong khoảng","options":["A. thế kỉ X – giữa thế kỉ XIX.","B. thế kỉ VII TCN – 179 TCN.","C. thế kỉ I – VII.","D. năm 192 – thế kỉ XIX."],"answer":"A","explain":"Văn minh Đại Việt là sáng tạo từ thế kỉ X đến giữa thế kỉ XIX.","points":0.25},{"type":"mcq","level":"NB","q":"Cư dân Văn Lang – Âu Lạc ở loại nhà nào?","options":["A. Nhà sàn.","B. Nhà trệt gạch nung.","C. Nhà tầng bê tông.","D. Hang động."],"answer":"A","explain":"Cư dân Văn Lang – Âu Lạc ở nhà sàn, đi lại bằng thuyền bè.","points":0.25},{"type":"mcq","level":"TH","q":"Chính sách đối ngoại nổi bật của các triều đại phong kiến là","options":["A. vừa giữ quan hệ hòa hiếu, vừa kiên quyết chống xâm lược.","B. hoàn toàn thần phục ngoại bang.","C. đóng cửa tuyệt đối.","D. gây chiến liên tục."],"answer":"A","explain":"Các triều đại vừa bang giao hòa hiếu, vừa kiên quyết chống ngoại xâm để bảo vệ độc lập.","points":0.25},{"type":"mcq","level":"TH","q":"Tôn giáo nào phổ biến ở Chăm-pa do ảnh hưởng Ấn Độ?","options":["A. Ấn Độ giáo.","B. Nho giáo.","C. Công giáo.","D. Tin Lành."],"answer":"A","explain":"Người Chăm chủ yếu theo Ấn Độ giáo (thờ thần Si-va) và Phật giáo do ảnh hưởng Ấn Độ.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao nông nghiệp là cơ sở kinh tế của mọi nền văn minh trong chương 6?","options":["A. Vì điều kiện tự nhiên thuận lợi và nhu cầu lương thực của đông đảo dân cư.","B. Vì không biết buôn bán.","C. Vì bị cấm làm nghề khác.","D. Vì chỉ trồng lúa để xuất khẩu."],"answer":"A","explain":"Sông ngòi, phù sa thuận lợi cho lúa nước; lúa gạo nuôi sống đại đa số dân cư nên nông nghiệp là nền tảng.","points":0.25},{"type":"mcq","level":"VDC","q":"So sánh vai trò của thương mại đường biển ở Phù Nam và Văn Lang – Âu Lạc:","options":["A. Phù Nam rất phát triển; Văn Lang – Âu Lạc kém phát triển hơn.","B. Cả hai đều không buôn bán.","C. Văn Lang – Âu Lạc phát triển hơn Phù Nam.","D. Cả hai đều chỉ buôn bán đường bộ."],"answer":"A","explain":"Phù Nam có Óc Eo – trung tâm mậu dịch quốc tế; thương mại đường biển của Văn Lang – Âu Lạc kém phát triển hơn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cư dân Văn Lang – Âu Lạc ở nhà sàn.","b) Cư dân Chăm-pa xây nhà trệt gạch nung.","c) Lúa gạo là lương thực chính của cả ba nền văn minh cổ.","d) Cư dân Phù Nam ở nhà tầng bê tông."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: thời cổ chưa có nhà bê tông; người Phù Nam ở nhà sàn.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Người Chăm theo Ấn Độ giáo do ảnh hưởng Ấn Độ.","b) Người Việt thời Lý – Trần theo tam giáo cộng tồn.","c) Thời Lê sơ độc tôn Nho giáo.","d) Mọi thời kì phong kiến đều có chung chính sách tôn giáo."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mỗi thời kì có đặc trưng riêng.","points":1},{"type":"short","level":"VD","q":"Năm 1076, trường đại học đầu tiên của Việt Nam được mở có tên là gì (ghi 3 chữ)?","answer":"Quốc Tử Giám","explain":"Quốc Tử Giám mở năm 1076 dưới thời Lý Nhân Tông.","points":0.5},{"type":"short","level":"VDC","q":"Thành Cổ Loa – kinh đô của Âu Lạc và nhà Ngô – được xây theo hình gì (ghi 4 chữ)?","answer":"Hình xoáy ốc","explain":"Thành Cổ Loa có cấu trúc nhiều vòng thành xoáy ốc độc đáo.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Bộ luật thành văn đầu tiên của Đại Việt là","options":["A. Hình thư (1042).","B. Luật Hồng Đức (1483).","C. Luật Gia Long (1815).","D. Bộ luật Dân sự."],"answer":"A","explain":"Hình thư (1042, thời Lý Thái Tông) là bộ luật thành văn đầu tiên của nhà nước phong kiến Việt Nam.","points":0.25},{"type":"mcq","level":"NB","q":"Nền văn hóa của cư dân Chăm-pa là","options":["A. văn hóa Sa Huỳnh.","B. văn hóa Đông Sơn.","C. văn hóa Óc Eo.","D. văn hóa Hòa Bình."],"answer":"A","explain":"Văn hóa Sa Huỳnh là nền văn hóa của cư dân Chăm-pa.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các triều đại phong kiến quan tâm đắp đê, trị thủy?","options":["A. Vì nông nghiệp lúa nước phụ thuộc vào thủy lợi, đê điều.","B. Vì thích xây dựng.","C. Vì để ngăn quân địch duy nhất.","D. Vì để làm cảnh quan."],"answer":"A","explain":"Nông nghiệp lúa nước cần thủy lợi; đê điều còn bảo vệ mùa màng, tính mạng nhân dân trước lũ lụt.","points":0.25},{"type":"mcq","level":"TH","q":"Chữ viết nào do người Việt sáng tạo để ghi tiếng nói dân tộc?","options":["A. Chữ Nôm.","B. Chữ Phạn.","C. Chữ La-tinh.","D. Chữ Ả Rập."],"answer":"A","explain":"Chữ Nôm được sáng tạo trên cơ sở chữ Hán để ghi tiếng Việt (văn học Nôm: Truyện Kiều...).","points":0.25},{"type":"mcq","level":"VD","q":"Mối liên hệ giữa văn minh cổ và văn minh Đại Việt thể hiện ở","options":["A. kế thừa và phát triển lên trình độ cao hơn.","B. hoàn toàn đứt đoạn.","C. Đại Việt xóa bỏ mọi thành tựu cũ.","D. không có liên hệ gì."],"answer":"A","explain":"Văn minh Đại Việt có cội nguồn từ các nền văn minh cổ, kế thừa và phát triển lên đỉnh cao mới.","points":0.25},{"type":"mcq","level":"VDC","q":"Điểm giống nhau về tinh thần yêu nước giữa các thời kì thể hiện ở","options":["A. kiên cường chống ngoại xâm, bảo vệ độc lập dân tộc.","B. chỉ lo làm giàu.","C. thần phục ngoại bang.","D. từ bỏ truyền thống."],"answer":"A","explain":"Từ Văn Lang – Âu Lạc đến Đại Việt, tinh thần chống ngoại xâm, bảo vệ độc lập là sợi chỉ đỏ xuyên suốt.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hình thư (1042) là bộ luật thành văn đầu tiên.","b) Chữ Nôm do người Việt sáng tạo.","c) Văn minh Đại Việt kế thừa văn minh cổ.","d) Các triều đại phong kiến không quan tâm thủy lợi."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: các triều đại rất coi trọng đắp đê, trị thủy.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Năm 208 TCN: Âu Lạc ra đời.","b) Năm 179 TCN: Âu Lạc kết thúc.","c) Năm 938: Ngô Quyền xưng vương.","d) Năm 1010: nhà Trần dời đô."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: năm 1010 nhà Lý (Lý Công Uẩn) dời đô.","points":1},{"type":"short","level":"VD","q":"Tác giả Truyện Kiều là ai (ghi tên)?","answer":"Nguyễn Du","explain":"Nguyễn Du (1765 – 1820), tác giả Truyện Kiều – đỉnh cao văn học Nôm.","points":0.5},{"type":"short","level":"VDC","q":"Nền văn hóa của cư dân Phù Nam có tên là gì (ghi 2 chữ)?","answer":"Óc Eo","explain":"Văn hóa Óc Eo là nền văn hóa của cư dân Phù Nam ở Nam Bộ.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Thời gian tồn tại của nhà nước Âu Lạc là","options":["A. 208 – 179 TCN.","B. TK VII TCN – 208 TCN.","C. TK I – VII.","D. 938 – 1010."],"answer":"A","explain":"Nhà nước Âu Lạc tồn tại từ 208 đến 179 TCN.","points":0.25},{"type":"mcq","level":"NB","q":"Vị vua nào ban hành Luật Hồng Đức (1483)?","options":["A. Lê Thánh Tông.","B. Lý Thái Tông.","C. Gia Long.","D. Quang Trung."],"answer":"A","explain":"Vua Lê Thánh Tông ban hành Quốc triều hình luật (Luật Hồng Đức) năm 1483.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Phù Nam suy yếu từ thế kỉ VII?","options":["A. Do sự cạnh tranh của các trung tâm thương mại mới và biến động chính trị.","B. Do bị Văn Lang xâm lược.","C. Do không biết trồng lúa.","D. Do thiên tai duy nhất."],"answer":"A","explain":"Từ thế kỉ VII, tuyến thương mại thay đổi, các thế lực mới (Chân Lạp) nổi lên khiến Phù Nam suy yếu.","points":0.25},{"type":"mcq","level":"TH","q":"Đặc trưng kinh tế thời Mạc – Lê trung hưng là","options":["A. kinh tế hướng ngoại.","B. kinh tế tự cấp hoàn toàn.","C. không có thương mại.","D. chỉ có nông nghiệp."],"answer":"A","explain":"Thế kỉ XVI – XVIII, thương mại với nước ngoài phát triển mạnh (Phố Hiến, Hội An) nên kinh tế mang tính hướng ngoại.","points":0.25},{"type":"mcq","level":"VD","q":"So sánh tổ chức nhà nước Chăm-pa và Đại Việt thời Lê sơ:","options":["A. đều là quân chủ tập quyền; Đại Việt hoàn chỉnh hơn.","B. Chăm-pa dân chủ hơn.","C. Đại Việt không có vua.","D. hoàn toàn giống nhau."],"answer":"A","explain":"Cả hai đều theo chế độ quân chủ; nhưng Đại Việt thời Lê sơ có bộ máy hoàn chỉnh từ trung ương đến địa phương.","points":0.25},{"type":"mcq","level":"VDC","q":"Ý nghĩa của việc học về các nền văn minh Việt Nam đối với học sinh là","options":["A. hiểu cội nguồn, tự hào và có trách nhiệm bảo vệ di sản.","B. để chê bai quá khứ.","C. không có ý nghĩa.","D. để sao chép nguyên xi."],"answer":"A","explain":"Hiểu lịch sử dân tộc giúp học sinh tự hào, trân trọng di sản và có trách nhiệm phát huy trong hiện tại.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Âu Lạc tồn tại 208 – 179 TCN.","b) Luật Hồng Đức do Lê Thánh Tông ban hành.","c) Kinh tế thời Mạc hướng ngoại.","d) Phù Nam tồn tại đến thế kỉ XIX."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Phù Nam suy yếu từ thế kỉ VII.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chăm-pa và Đại Việt đều là nhà nước quân chủ.","b) Đại Việt thời Lê sơ có bộ máy hoàn chỉnh hơn Chăm-pa.","c) Văn Lang – Âu Lạc có luật pháp hoàn chỉnh như Đại Việt.","d) Vua đứng đầu trong mọi nhà nước phong kiến Việt Nam."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: Văn Lang – Âu Lạc chưa có luật pháp thành văn hoàn chỉnh.","points":1},{"type":"short","level":"VD","q":"Năm 1789, Quang Trung đại phá quân xâm lược nào (ghi 2 chữ)?","answer":"Quân Thanh","explain":"Tết Kỷ Dậu 1789, Quang Trung đại phá 29 vạn quân Thanh.","points":0.5},{"type":"short","level":"VDC","q":"Khu đền tháp Mỹ Sơn hiện thuộc tỉnh nào (ghi 2 chữ)?","answer":"Quảng Nam","explain":"Mỹ Sơn ở huyện Duy Xuyên, tỉnh Quảng Nam.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Di sản nào thuộc văn minh Văn Lang – Âu Lạc?","options":["A. Trống đồng Đông Sơn.","B. Đền tháp Mỹ Sơn.","C. Chùa Một Cột.","D. Hoàng thành Huế."],"answer":"A","explain":"Trống đồng Đông Sơn là di sản tiêu biểu của văn minh Văn Lang – Âu Lạc.","points":0.25},{"type":"mcq","level":"NB","q":"Ai là người sáng lập nhà Nguyễn (1802)?","options":["A. Nguyễn Ánh (Gia Long).","B. Nguyễn Huệ.","C. Lê Lợi.","D. Lý Công Uẩn."],"answer":"A","explain":"Nguyễn Ánh lên ngôi năm 1802, lấy niên hiệu Gia Long, sáng lập nhà Nguyễn.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói văn minh Đại Việt có tính thống nhất trong đa dạng?","options":["A. Vì là sáng tạo chung của cộng đồng các dân tộc với bản sắc riêng.","B. Vì chỉ có một dân tộc.","C. Vì không có sự khác biệt vùng miền.","D. Vì sao chép một khuôn mẫu."],"answer":"A","explain":"Văn minh Đại Việt là sáng tạo của cộng đồng các dân tộc, thống nhất trong nền văn hóa dân tộc nhưng đa dạng bản sắc vùng miền.","points":0.25},{"type":"mcq","level":"TH","q":"Nghề thủ công nào đạt đỉnh cao ở Phù Nam?","options":["A. Kim hoàn.","B. Đóng tàu vũ trụ.","C. Luyện thép hiện đại.","D. Dệt vải công nghiệp."],"answer":"A","explain":"Nghệ thuật kim hoàn của Phù Nam đạt trình độ cao với nhiều hiện vật vàng tinh xảo ở Óc Eo.","points":0.25},{"type":"mcq","level":"VD","q":"Phân tích vai trò của sông ngòi đối với các nền văn minh trong chương 6:","options":["A. cung cấp phù sa, thủy lợi, giao thông – nền tảng của nông nghiệp và thương mại.","B. không có vai trò gì.","C. chỉ gây lũ lụt.","D. chỉ để đánh cá."],"answer":"A","explain":"Sông Hồng, sông Mã, sông Cửu Long... mang phù sa, cung cấp thủy lợi và là đường giao thông huyết mạch.","points":0.25},{"type":"mcq","level":"VDC","q":"Từ chương 6, rút ra quy luật nào của lịch sử Việt Nam?","options":["A. Dựng nước luôn đi đôi với giữ nước; văn hóa phát triển trên nền độc lập.","B. Chỉ cần phát triển kinh tế.","C. Văn hóa không liên quan đến chính trị.","D. Ngoại xâm giúp văn hóa phát triển."],"answer":"A","explain":"Xuyên suốt các nền văn minh là quá trình vừa lao động sáng tạo, vừa đấu tranh bảo vệ độc lập – nền tảng của văn hóa dân tộc.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trống đồng Đông Sơn thuộc văn minh Văn Lang – Âu Lạc.","b) Nhà Nguyễn do Nguyễn Ánh sáng lập.","c) Nghề kim hoàn Phù Nam đạt trình độ cao.","d) Sông ngòi không có vai trò với văn minh cổ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: sông ngòi có vai trò nền tảng (phù sa, thủy lợi, giao thông).","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Văn minh Đại Việt là sáng tạo của cộng đồng các dân tộc.","b) Mỗi dân tộc đều có bản sắc văn hóa riêng.","c) Văn minh Đại Việt chỉ của người Kinh.","d) Tính thống nhất và đa dạng là đặc điểm của văn hóa Việt Nam."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: văn minh Đại Việt là của cộng đồng các dân tộc.","points":1},{"type":"short","level":"VD","q":"Năm 1010, Lý Công Uẩn dời đô từ Hoa Lư ra đâu (ghi 2 chữ)?","answer":"Thăng Long","explain":"Năm 1010, Lý Công Uẩn dời đô ra Thăng Long (Hà Nội ngày nay).","points":0.5},{"type":"short","level":"VDC","q":"Nghệ thuật nào của Phù Nam đạt trình độ cao, với nhiều hiện vật bằng vàng ở Óc Eo (ghi 2 chữ)?","answer":"Kim hoàn","explain":"Nghệ thuật kim hoàn Phù Nam tinh xảo, nhiều hiện vật vàng tìm thấy ở Óc Eo.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Nhà nước Chăm-pa ra đời với tên gọi đầu tiên là","options":["A. Lâm Ấp.","B. Phù Nam.","C. Âu Lạc.","D. Đại Việt."],"answer":"A","explain":"Năm 192, nhà nước Lâm Ấp ra đời; đến thế kỉ VII đổi tên thành Chăm-pa.","points":0.25},{"type":"mcq","level":"NB","q":"Khoa thi đầu tiên của Việt Nam được mở năm nào?","options":["A. Năm 1075.","B. Năm 1076.","C. Năm 1070.","D. Năm 1042."],"answer":"A","explain":"Năm 1075, vua Lý Nhân Tông mở khoa thi đầu tiên.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các nền văn minh cổ đều hình thành ở lưu vực sông, ven biển?","options":["A. Vì thuận lợi cho nông nghiệp, giao thông và sinh hoạt.","B. Vì thích nước.","C. Vì bị ép buộc.","D. Vì trên núi không có đất."],"answer":"A","explain":"Lưu vực sông, ven biển có phù sa màu mỡ, nguồn nước, giao thông thuận lợi cho nông nghiệp và thương mại.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm tiến bộ của chữ Nôm so với việc chỉ dùng chữ Hán là","options":["A. ghi được tiếng nói của người Việt, phát triển văn học dân tộc.","B. khó học hơn.","C. chỉ dùng trong cung đình.","D. không có giá trị."],"answer":"A","explain":"Chữ Nôm ghi được tiếng Việt, tạo điều kiện cho văn học dân tộc phát triển (Truyện Kiều...).","points":0.25},{"type":"mcq","level":"VD","q":"So sánh ảnh hưởng văn minh bên ngoài ở Chăm-pa và Đại Việt:","options":["A. Chăm-pa: Ấn Độ sâu sắc; Đại Việt: tiếp thu có chọn lọc nhiều nguồn.","B. Cả hai đều không tiếp thu.","C. Đại Việt sao chép Trung Hoa hoàn toàn.","D. Chăm-pa không chịu ảnh hưởng nào."],"answer":"A","explain":"Chăm-pa chịu ảnh hưởng sâu sắc của Ấn Độ; Đại Việt tiếp thu có chọn lọc (Ấn Độ, Trung Hoa...) và Việt hóa.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao nói “văn hóa còn thì dân tộc còn” qua lịch sử chương 6?","options":["A. Vì văn hóa là sức mạnh tinh thần giúp dân tộc tồn tại qua mọi thử thách.","B. Vì văn hóa chỉ để giải trí.","C. Vì văn hóa không thay đổi.","D. Vì văn hóa tách rời đời sống."],"answer":"A","explain":"Hơn 1000 năm Bắc thuộc, văn hóa Việt vẫn được bảo tồn – đó là nền tảng để giành lại độc lập và phát triển.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lâm Ấp là tên gọi đầu tiên của Chăm-pa.","b) Khoa thi đầu tiên mở năm 1075.","c) Chữ Nôm ghi được tiếng Việt.","d) Văn hóa Việt bị đồng hóa hoàn toàn thời Bắc thuộc."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nhân dân ta kiên trì bảo tồn văn hóa dân tộc trong hơn 1000 năm Bắc thuộc.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chăm-pa chịu ảnh hưởng Ấn Độ sâu sắc.","b) Đại Việt tiếp thu có chọn lọc văn minh bên ngoài.","c) Văn Lang – Âu Lạc không chịu ảnh hưởng Ấn Độ.","d) Mọi nền văn minh Việt Nam đều sao chép Trung Hoa."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: các nền văn minh đều có bản sắc riêng, tiếp thu có chọn lọc.","points":1},{"type":"short","level":"VD","q":"Công trình thờ Khổng Tử được dựng năm 1070 ở Thăng Long có tên là gì (ghi 2 chữ)?","answer":"Văn Miếu","explain":"Văn Miếu dựng năm 1070, biểu tượng truyền thống hiếu học.","points":0.5},{"type":"short","level":"VDC","q":"Nhà nước Lâm Ấp ra đời năm 192; đến thế kỉ nào thì đổi tên thành Chăm-pa (ghi dạng: TK VII)?","answer":"TK VII","explain":"Nhà nước Lâm Ấp (192) đến thế kỉ VII đổi tên thành Chăm-pa.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Nhà nước Phù Nam phát triển mạnh nhất trong","options":["A. các thế kỉ III – V.","B. thế kỉ X – XV.","C. thế kỉ VII TCN.","D. thế kỉ XIX."],"answer":"A","explain":"Phù Nam ra đời thế kỉ I, phát triển mạnh mẽ trong các thế kỉ III – V.","points":0.25},{"type":"mcq","level":"NB","q":"Hoàng Việt luật lệ (1815) là bộ luật của triều đại nào?","options":["A. Nhà Nguyễn.","B. Nhà Lê sơ.","C. Nhà Lý.","D. Nhà Trần."],"answer":"A","explain":"Năm 1815, vua Gia Long ban hành Hoàng Việt luật lệ (Luật Gia Long).","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói thời Lý – Trần là thời kì vàng son của văn minh Đại Việt?","options":["A. Vì kinh tế, văn hóa phát triển rực rỡ, ba lần thắng Nguyên – Mông.","B. Vì không có chiến tranh.","C. Vì lãnh thổ nhỏ.","D. Vì từ bỏ Nho giáo."],"answer":"A","explain":"Thời Lý – Trần, Thăng Long phồn thịnh, văn hóa tam giáo rực rỡ, dân tộc ba lần đánh bại Nguyên – Mông.","points":0.25},{"type":"mcq","level":"TH","q":"Tục táng nào là của cư dân Phù Nam?","options":["A. Hỏa táng, thủy táng, điểu táng.","B. Địa táng trong hang động duy nhất.","C. Ướp xác.","D. Thả trôi sông duy nhất."],"answer":"A","explain":"Cư dân Phù Nam có tục hỏa táng, thủy táng, điểu táng chịu ảnh hưởng văn hóa Ấn Độ.","points":0.25},{"type":"mcq","level":"VD","q":"Ý nghĩa của chiến thắng Bạch Đằng (938) đối với văn minh Việt Nam là","options":["A. mở đầu thời kì độc lập, hình thành văn minh Đại Việt.","B. kết thúc văn minh Đại Việt.","C. mở đầu thời Bắc thuộc.","D. không có ý nghĩa."],"answer":"A","explain":"Bạch Đằng 938 chấm dứt hơn 1000 năm Bắc thuộc, mở ra kỉ nguyên độc lập và văn minh Đại Việt.","points":0.25},{"type":"mcq","level":"VDC","q":"Từ sự suy thoái của văn minh Đại Việt giữa thế kỉ XIX, bài học cho hiện nay là","options":["A. phải đổi mới, hội nhập kịp thời, tránh bảo thủ, trì trệ.","B. nên đóng cửa.","C. từ bỏ truyền thống.","D. chỉ phát triển quân sự."],"answer":"A","explain":"Sự bảo thủ, trì trệ của nhà Nguyễn khiến đất nước lạc hậu – bài học về đổi mới và hội nhập.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phù Nam cực thịnh thế kỉ III – V.","b) Luật Gia Long ban hành năm 1815.","c) Bạch Đằng 938 mở đầu văn minh Đại Việt.","d) Thời Lý – Trần không có thành tựu văn hóa."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: thời Lý – Trần văn hóa phát triển rực rỡ.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Người Phù Nam có tục hỏa táng.","b) Người Chăm xây tháp bằng gạch.","c) Người Việt cổ đúc trống đồng.","d) Cả ba đều dùng chữ quốc ngữ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chữ quốc ngữ ra đời muộn, thời cổ chưa có.","points":1},{"type":"short","level":"VD","q":"Chiến thắng nào năm 938 mở đầu thời kì độc lập của dân tộc (ghi 2 chữ)?","answer":"Bạch Đằng","explain":"Chiến thắng Bạch Đằng (938) của Ngô Quyền chấm dứt hơn 1000 năm Bắc thuộc.","points":0.5},{"type":"short","level":"VDC","q":"Vị tướng chỉ huy trận Bạch Đằng 1288 chống Nguyên – Mông là ai (ghi 3 chữ)?","answer":"Trần Hưng Đạo","explain":"Trần Hưng Đạo (Trần Quốc Tuấn) chỉ huy chiến thắng Bạch Đằng 1288.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Cư dân bản địa có vai trò gì trong các nền văn minh cổ?","options":["A. Là chủ thể chính sáng tạo nên văn minh.","B. Không có vai trò gì.","C. Chỉ làm thuê.","D. Bị đồng hóa hoàn toàn."],"answer":"A","explain":"SGK khẳng định cư dân bản địa là những người chủ yếu đóng góp, xây dựng nên nền văn minh của họ.","points":0.25},{"type":"mcq","level":"NB","q":"Thăng Long hiện nay là thành phố nào?","options":["A. Hà Nội.","B. Huế.","C. Đà Nẵng.","D. Hồ Chí Minh."],"answer":"A","explain":"Thăng Long là tên gọi của Hà Nội thời phong kiến (từ 1010).","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nhân dân ta bảo tồn được văn hóa dân tộc trong hơn 1000 năm Bắc thuộc?","options":["A. Nhờ tinh thần yêu nước, ý chí kiên cường và sức sống của văn hóa bản địa.","B. Nhờ được kẻ đô hộ cho phép.","C. Nhờ không có văn hóa riêng.","D. Nhờ từ bỏ tiếng nói."],"answer":"A","explain":"Dù bị đô hộ, nhân dân ta kiên trì giữ gìn tiếng nói, phong tục – đó là cơ sở để giành lại độc lập.","points":0.25},{"type":"mcq","level":"TH","q":"Di sản nào sau đây thuộc văn minh Đại Việt?","options":["A. Văn Miếu – Quốc Tử Giám.","B. Đền tháp Mỹ Sơn.","C. Trống đồng Đông Sơn.","D. Di chỉ Óc Eo."],"answer":"A","explain":"Văn Miếu – Quốc Tử Giám (thời Lý) thuộc văn minh Đại Việt; các di sản còn lại thuộc các nền văn minh cổ.","points":0.25},{"type":"mcq","level":"VD","q":"Mối quan hệ giữa kinh tế và văn hóa trong các nền văn minh chương 6 là","options":["A. kinh tế phát triển là nền tảng cho văn hóa rực rỡ.","B. kinh tế và văn hóa không liên quan.","C. văn hóa phát triển khi kinh tế suy thoái.","D. chỉ cần văn hóa, không cần kinh tế."],"answer":"A","explain":"Nông nghiệp, thương mại phát triển tạo của cải vật chất – điều kiện để văn hóa, nghệ thuật, giáo dục thăng hoa.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao chương 6 lấy mốc “trước năm 1858”?","options":["A. Vì 1858 thực dân Pháp xâm lược, chấm dứt thời phong kiến độc lập.","B. Vì 1858 là năm thành lập nhà Nguyễn.","C. Vì 1858 văn minh Đại Việt ra đời.","D. Không có ý nghĩa."],"answer":"A","explain":"Năm 1858, Pháp nổ súng xâm lược Đà Nẵng, mở đầu thời kì thuộc địa – văn minh phong kiến suy tàn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cư dân bản địa là chủ thể sáng tạo văn minh.","b) Thăng Long nay là Hà Nội.","c) Văn hóa Việt được bảo tồn thời Bắc thuộc.","d) Năm 1858 Pháp xâm lược Việt Nam."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng theo SGK và kiến thức lịch sử.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Kinh tế phát triển là nền tảng của văn hóa.","b) Văn minh Đại Việt suy thoái từ giữa thế kỉ XIX.","c) Nhà Nguyễn bảo thủ, trì trệ.","d) Văn minh Đại Việt phát triển mạnh nhất thời Nguyễn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đỉnh cao là thời Lý – Trần và Lê sơ; thời Nguyễn đã suy thoái.","points":1},{"type":"short","level":"VD","q":"Năm 1858, thực dân Pháp nổ súng xâm lược Việt Nam tại đâu (ghi 2 chữ)?","answer":"Đà Nẵng","explain":"Tháng 9/1858, Pháp tấn công Đà Nẵng, mở đầu cuộc xâm lược Việt Nam.","points":0.5},{"type":"short","level":"VDC","q":"Theo SGK, văn minh Đại Việt là sáng tạo của cộng đồng các dân tộc Việt Nam từ thế kỉ X đến khi nào (ghi 4 chữ)?","answer":"Giữa thế kỉ XIX","explain":"Văn minh Đại Việt tồn tại từ thế kỉ X đến giữa thế kỉ XIX.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Số lượng nền văn minh cổ được học trong Bài 11 là","options":["A. 3.","B. 2.","C. 4.","D. 5."],"answer":"A","explain":"Bài 11 học ba nền văn minh cổ: Văn Lang – Âu Lạc, Chăm-pa, Phù Nam.","points":0.25},{"type":"mcq","level":"NB","q":"Triều đại phong kiến cuối cùng của Việt Nam là","options":["A. Nhà Nguyễn.","B. Nhà Lê.","C. Nhà Trần.","D. Nhà Lý."],"answer":"A","explain":"Nhà Nguyễn (1802 – 1945) là triều đại phong kiến cuối cùng của Việt Nam.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác biệt lớn nhất giữa văn minh Đại Việt và văn minh Văn Lang – Âu Lạc là","options":["A. trình độ nhà nước và văn hóa cao hơn, có luật pháp thành văn.","B. không có nông nghiệp.","C. không có chữ viết.","D. diện tích nhỏ hơn."],"answer":"A","explain":"Đại Việt có nhà nước tập quyền hoàn chỉnh, luật pháp, giáo dục, văn học phát triển vượt bậc so với thời sơ khai.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao gọi thế kỉ X là “bản lề” của lịch sử dân tộc?","options":["A. Vì chấm dứt Bắc thuộc, mở ra kỉ nguyên độc lập, văn minh Đại Việt.","B. Vì không có sự kiện gì.","C. Vì bắt đầu Bắc thuộc.","D. Vì văn minh suy tàn."],"answer":"A","explain":"Thế kỉ X (Ngô – Đinh – Tiền Lê) khép lại hơn 1000 năm Bắc thuộc, mở ra thời đại phong kiến độc lập.","points":0.25},{"type":"mcq","level":"VD","q":"Tổng kết chương 6, thành tựu lớn nhất của dân tộc ta là","options":["A. xây dựng nền văn hóa đậm đà bản sắc trên nền độc lập dân tộc.","B. mở rộng lãnh thổ bằng chiến tranh.","C. sao chép văn minh khác.","D. phát triển quân sự duy nhất."],"answer":"A","explain":"Thành tựu lớn nhất là nền văn minh Việt Nam đậm đà bản sắc, được xây dựng và bảo vệ qua hàng nghìn năm.","points":0.25},{"type":"mcq","level":"VDC","q":"Vận dụng kiến thức chương 6, em sẽ làm gì để bảo vệ di sản văn hóa?","options":["A. Tìm hiểu, tuyên truyền và không xâm hại di tích.","B. Khắc tên lên di tích.","C. Lấy hiện vật về nhà.","D. Không quan tâm."],"answer":"A","explain":"Mỗi học sinh cần tìm hiểu, trân trọng, tuyên truyền và bảo vệ di sản văn hóa dân tộc.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bài 11 học 3 nền văn minh cổ.","b) Nhà Nguyễn là triều đại phong kiến cuối cùng.","c) Thế kỉ X mở ra kỉ nguyên độc lập.","d) Văn minh Đại Việt không có thành tựu văn hóa."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: văn minh Đại Việt có nhiều thành tựu văn hóa rực rỡ.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đại Việt có trình độ nhà nước cao hơn Văn Lang – Âu Lạc.","b) Đại Việt có luật pháp thành văn.","c) Văn Lang – Âu Lạc chưa có chữ viết riêng.","d) Cả hai đều không biết đúc đồng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cả hai đều có kĩ thuật đúc đồng (trống đồng Đông Sơn...).","points":1},{"type":"short","level":"VD","q":"Triều đại phong kiến cuối cùng của Việt Nam tồn tại đến năm nào (ghi số)?","answer":"1945","explain":"Nhà Nguyễn tồn tại đến năm 1945 (Bảo Đại thoái vị sau Cách mạng tháng Tám).","points":0.5},{"type":"short","level":"VDC","q":"Ba nền văn minh cổ trong Bài 11 đều có chung đơn vị cư trú cơ bản là gì (ghi 1 chữ)?","answer":"Làng","explain":"Làng (liên minh cụm làng) là tế bào xã hội của cả ba nền văn minh cổ.","points":0.5}]}]}</script>
