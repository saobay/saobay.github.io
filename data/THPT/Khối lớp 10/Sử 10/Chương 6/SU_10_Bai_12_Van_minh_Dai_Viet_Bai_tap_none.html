<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Văn minh Đại Việt là sáng tạo của cộng đồng các dân tộc Việt Nam trong khoảng thời gian nào?","options":["A. Từ thế kỉ X đến giữa thế kỉ XIX.","B. Từ thế kỉ VII TCN đến năm 208 TCN.","C. Từ năm 192 đến thế kỉ VII.","D. Từ thế kỉ I đến thế kỉ VII."],"answer":"A","explain":"SGK định nghĩa: văn minh Đại Việt là những sáng tạo vật chất và tinh thần tiêu biểu từ thế kỉ X đến giữa thế kỉ XIX.","points":0.25},{"type":"mcq","level":"NB","q":"Sau chiến thắng Bạch Đằng (938), Ngô Quyền đã","options":["A. xưng vương, đóng đô ở Cổ Loa.","B. dời đô về Thăng Long.","C. đặt quốc hiệu là Đại Việt.","D. ban hành Luật Hồng Đức."],"answer":"A","explain":"Năm 938, sau chiến thắng Bạch Đằng, Ngô Quyền xưng vương, đóng đô ở Cổ Loa, khôi phục nền độc lập dân tộc.","points":0.25},{"type":"mcq","level":"TH","q":"Năm 1010, Lý Công Uẩn đã thực hiện quyết định quan trọng nào?","options":["A. Dời đô từ Hoa Lư ra Thăng Long.","B. Ban hành Hình thư.","C. Mở khoa thi đầu tiên.","D. Đánh bại quân Minh."],"answer":"A","explain":"Năm 1010, Lý Công Uẩn dời đô từ Hoa Lư (Ninh Bình) ra Thăng Long (Hà Nội), mở đầu kỉ nguyên mới của văn minh Đại Việt.","points":0.25},{"type":"mcq","level":"TH","q":"Đặc trưng nổi bật của văn minh Đại Việt thời Lý – Trần – Hồ là","options":["A. tam giáo cộng tồn (Nho – Phật – Đạo).","B. độc tôn Nho giáo.","C. chỉ theo Phật giáo.","D. bài trừ mọi tôn giáo."],"answer":"A","explain":"Thời Lý – Trần – Hồ, Nho giáo, Phật giáo, Đạo giáo cùng tồn tại hòa hợp, gọi là tam giáo cộng tồn (đồng nguyên).","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao nói nền độc lập, tự chủ là cơ sở quan trọng nhất hình thành văn minh Đại Việt?","options":["A. Vì môi trường hòa bình, ổn định tạo điều kiện cho nhân dân xây dựng văn hóa rực rỡ.","B. Vì không cần tiếp thu văn minh bên ngoài.","C. Vì độc lập làm mất đi bản sắc dân tộc.","D. Vì chỉ cần độc lập là đủ, không cần lao động."],"answer":"A","explain":"Nền độc lập, tự chủ được bảo vệ vững chắc tạo môi trường hòa bình, ổn định để các tầng lớp nhân dân sáng tạo văn hóa.","points":0.25},{"type":"mcq","level":"VDC","q":"Điểm khác nhau cơ bản giữa văn minh Đại Việt và các nền văn minh cổ (Văn Lang – Âu Lạc, Chăm-pa, Phù Nam) là","options":["A. văn minh Đại Việt phát triển trên cơ sở quốc gia phong kiến độc lập, tự chủ.","B. văn minh Đại Việt không có chữ viết.","C. văn minh Đại Việt không có nhà nước.","D. văn minh Đại Việt hoàn toàn sao chép Trung Hoa."],"answer":"A","explain":"Văn minh Đại Việt hình thành trong thời kì phong kiến độc lập (TK X – giữa TK XIX) với nhà nước quân chủ tập quyền, khác với các quốc gia cổ trước đó.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Văn minh Đại Việt tồn tại từ thế kỉ X đến giữa thế kỉ XIX.","b) Chiến thắng Bạch Đằng năm 938 mở đầu thời kì độc lập.","c) Năm 1010, Lý Công Uẩn dời đô ra Thăng Long.","d) Nhà Nguyễn được thành lập năm 1428."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: năm 1428 là nhà Lê sơ thành lập; nhà Nguyễn thành lập năm 1802.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về cơ sở hình thành văn minh Đại Việt:","statements":["a) Văn minh Đại Việt có cội nguồn từ các nền văn minh cổ trên đất nước Việt Nam.","b) Cuộc đấu tranh hơn 1000 năm Bắc thuộc góp phần hình thành văn minh Đại Việt.","c) Văn minh Đại Việt tiếp thu có chọn lọc thành tựu văn minh Ấn Độ, Trung Hoa.","d) Văn minh Đại Việt hoàn toàn không tiếp thu yếu tố bên ngoài."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: văn minh Đại Việt tiếp thu có chọn lọc tinh hoa văn minh bên ngoài.","points":1},{"type":"short","level":"VD","q":"Bộ luật thành văn đầu tiên của Đại Việt, ban hành năm 1042, có tên là gì?","answer":"Hình thư","explain":"Năm 1042, vua Lý Thái Tông ban hành Hình thư – bộ luật thành văn đầu tiên của nhà nước phong kiến Việt Nam.","points":0.5},{"type":"short","level":"VDC","q":"Năm 1070, vua Lý Thánh Tông cho dựng công trình giáo dục nào ở Thăng Long?","answer":"Văn Miếu","explain":"Văn Miếu được dựng năm 1070 để thờ Khổng Tử và các bậc hiền triết, là biểu tượng của truyền thống hiếu học.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Nhà Lê sơ được thành lập vào năm nào?","options":["A. Năm 1428.","B. Năm 938.","C. Năm 1010.","D. Năm 1802."],"answer":"A","explain":"Năm 1428, sau thắng lợi của khởi nghĩa Lam Sơn, Lê Lợi lên ngôi, nhà Lê sơ được thành lập.","points":0.25},{"type":"mcq","level":"NB","q":"Quốc Tử Giám – trường đại học đầu tiên của Việt Nam – được mở vào năm nào?","options":["A. Năm 1076.","B. Năm 1070.","C. Năm 1042.","D. Năm 1483."],"answer":"A","explain":"Năm 1076, vua Lý Nhân Tông cho mở Quốc Tử Giám ở Thăng Long, là trường đại học đầu tiên của nước ta.","points":0.25},{"type":"mcq","level":"TH","q":"Chính sách văn hóa nổi bật của nhà Lê sơ là","options":["A. độc tôn Nho giáo.","B. tam giáo cộng tồn.","C. chỉ phát triển Phật giáo.","D. cấm mọi tôn giáo."],"answer":"A","explain":"Thời Lê sơ, Nho giáo được đề cao tuyệt đối (độc tôn Nho giáo): coi trọng giáo dục Nho học, tuyển quan qua thi cử.","points":0.25},{"type":"mcq","level":"TH","q":"Bộ luật Quốc triều hình luật (Luật Hồng Đức) được ban hành năm nào?","options":["A. Năm 1483.","B. Năm 1042.","C. Năm 1815.","D. Năm 1428."],"answer":"A","explain":"Năm 1483, vua Lê Thánh Tông ban hành Quốc triều hình luật (sử gọi là Luật Hồng Đức), bộ luật hoàn chỉnh của thời Lê sơ.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao thời Lê sơ, Đại Việt được coi là cường quốc trong khu vực Đông Nam Á?","options":["A. Vì kinh tế, quân sự hùng mạnh, lãnh thổ mở rộng, văn hóa rực rỡ.","B. Vì được Trung Hoa bảo hộ.","C. Vì không có chiến tranh.","D. Vì dân số đông nhất thế giới."],"answer":"A","explain":"Dưới thời Lê Thánh Tông, Đại Việt có bộ máy hoàn chỉnh, kinh tế phát triển, quân đội mạnh, văn hóa đạt đỉnh cao nên trở thành cường quốc khu vực.","points":0.25},{"type":"mcq","level":"VDC","q":"So sánh chính sách tôn giáo thời Lý – Trần với thời Lê sơ, điểm khác nhau là","options":["A. Lý – Trần: tam giáo cộng tồn; Lê sơ: độc tôn Nho giáo.","B. cả hai thời đều độc tôn Nho giáo.","C. cả hai thời đều chỉ theo Phật giáo.","D. Lê sơ cấm Nho giáo."],"answer":"A","explain":"Thời Lý – Trần – Hồ, ba tôn giáo Nho – Phật – Đạo cùng tồn tại hòa hợp; sang thời Lê sơ, Nho giáo được đề cao tuyệt đối.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Năm 1428, nhà Lê sơ được thành lập.","b) Thời Lê sơ thực hiện chính sách độc tôn Nho giáo.","c) Luật Hồng Đức được ban hành năm 1483.","d) Thời Lê sơ, Phật giáo bị cấm hoàn toàn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Nho giáo được đề cao nhưng các tôn giáo khác vẫn tồn tại, không bị cấm hoàn toàn.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hình thư (1042) là bộ luật thành văn đầu tiên của Đại Việt.","b) Hoàng Việt luật lệ (1815) là bộ luật thời Nguyễn.","c) Quốc triều hình luật là bộ luật thời Trần.","d) Cả ba bộ luật đều thể hiện nhà nước quân chủ tập quyền."],"answer":["T","T","F","T"],"explain":"a), b) Đúng. c) Sai: Quốc triều hình luật (Luật Hồng Đức) là của thời Lê sơ (1483). d) Đúng: luật pháp là công cụ quản lí của nhà nước tập quyền.","points":1},{"type":"short","level":"VD","q":"Tác phẩm “thiên cổ hùng văn” của Nguyễn Trãi, ra đời năm 1428, có tên là gì?","answer":"Bình Ngô đại cáo","explain":"Bình Ngô đại cáo (1428) của Nguyễn Trãi tổng kết thắng lợi của khởi nghĩa Lam Sơn, được coi là bản tuyên ngôn độc lập thứ hai.","points":0.5},{"type":"short","level":"VDC","q":"Khoa thi đầu tiên trong lịch sử Việt Nam được tổ chức năm nào (ghi số)?","answer":"1075","explain":"Năm 1075, vua Lý Nhân Tông mở khoa thi đầu tiên, lấy đỗ 10 người, mở đầu truyền thống thi cử tuyển chọn nhân tài.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Chùa Một Cột (Diên Hựu) được dựng vào năm nào?","options":["A. Năm 1049.","B. Năm 1070.","C. Năm 1076.","D. Năm 1010."],"answer":"A","explain":"Chùa Một Cột được vua Lý Thái Tông cho dựng năm 1049, là công trình kiến trúc độc đáo thời Lý.","points":0.25},{"type":"mcq","level":"NB","q":"Nhà Nguyễn được thành lập năm nào?","options":["A. Năm 1802.","B. Năm 1789.","C. Năm 1428.","D. Năm 1527."],"answer":"A","explain":"Năm 1802, Nguyễn Ánh lên ngôi (Gia Long), nhà Nguyễn được thành lập, thống nhất đất nước.","points":0.25},{"type":"mcq","level":"TH","q":"Thương cảng nào sau đây KHÔNG phải là trung tâm buôn bán quốc tế thời phong kiến?","options":["A. Vân Đồn.","B. Phố Hiến.","C. Hội An.","D. Hải Phòng."],"answer":"D","explain":"Vân Đồn (thời Lý – Trần), Phố Hiến (thế kỉ XVI – XVII), Hội An (thế kỉ XVI – XVIII) là các thương cảng quốc tế sầm uất; Hải Phòng là cảng hiện đại sau này.","points":0.25},{"type":"mcq","level":"TH","q":"Chữ Nôm được sáng tạo trên cơ sở","options":["A. chữ Hán để ghi tiếng nói của người Việt.","B. chữ Phạn để ghi tiếng Chăm.","C. chữ La-tinh để ghi tiếng Việt.","D. chữ Ả Rập để ghi kinh Phật."],"answer":"A","explain":"Người Việt dựa vào chữ Hán để sáng tạo ra chữ Nôm, dùng ghi chép tiếng nói dân tộc (văn học Nôm như Truyện Kiều).","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao kinh tế thời Mạc – Lê trung hưng có đặc trưng “hướng ngoại”?","options":["A. Vì thương mại với nước ngoài phát triển mạnh qua các thương cảng.","B. Vì chỉ sản xuất để xuất khẩu nông sản.","C. Vì bị nước ngoài đô hộ về kinh tế.","D. Vì từ bỏ nông nghiệp."],"answer":"A","explain":"Thế kỉ XVI – XVIII, các thương cảng Phố Hiến, Hội An buôn bán tấp nập với Nhật Bản, Trung Hoa, phương Tây nên kinh tế mang tính hướng ngoại.","points":0.25},{"type":"mcq","level":"VDC","q":"Ý nghĩa của việc dựng Văn Miếu (1070) và mở Quốc Tử Giám (1076) là","options":["A. khẳng định vai trò của giáo dục, đào tạo nhân tài cho đất nước.","B. chỉ để thờ cúng Khổng Tử.","C. để hạn chế người đi học.","D. để phục vụ nhu cầu tôn giáo duy nhất."],"answer":"A","explain":"Văn Miếu – Quốc Tử Giám thể hiện sự coi trọng giáo dục, đào tạo nhân tài – truyền thống hiếu học của dân tộc.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chùa Một Cột được dựng năm 1049 thời Lý.","b) Văn Miếu được dựng năm 1070.","c) Quốc Tử Giám được mở năm 1076.","d) Cả ba công trình đều thuộc thời Trần."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: cả ba công trình đều thuộc thời Lý, không phải thời Trần.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về kinh tế Đại Việt:","statements":["a) Nhà nước phong kiến quan tâm đắp đê, trị thủy, khai hoang.","b) Nghề gốm Chu Đậu đạt trình độ cao.","c) Thăng Long có 36 phố phường sầm uất.","d) Thời phong kiến, Việt Nam không có thương mại với nước ngoài."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: thương mại với nước ngoài phát triển qua Vân Đồn, Phố Hiến, Hội An.","points":1},{"type":"short","level":"VD","q":"Bộ luật thời Nguyễn, ban hành năm 1815, có tên là gì?","answer":"Hoàng Việt luật lệ","explain":"Năm 1815, vua Gia Long ban hành Hoàng Việt luật lệ (sử gọi là Luật Gia Long).","points":0.5},{"type":"short","level":"VDC","q":"Tác giả của Truyện Kiều – kiệt tác văn học Nôm đầu thế kỉ XIX – là ai?","answer":"Nguyễn Du","explain":"Nguyễn Du (1765 – 1820) là tác giả Truyện Kiều, đỉnh cao của văn học Nôm Việt Nam.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Triều đại nào dời đô từ Hoa Lư ra Thăng Long năm 1010?","options":["A. Nhà Lý.","B. Nhà Trần.","C. Nhà Lê sơ.","D. Nhà Nguyễn."],"answer":"A","explain":"Năm 1010, Lý Công Uẩn (Lý Thái Tổ) dời đô từ Hoa Lư ra Thăng Long.","points":0.25},{"type":"mcq","level":"NB","q":"Nhà Mạc được thành lập năm nào?","options":["A. Năm 1527.","B. Năm 1428.","C. Năm 1802.","D. Năm 938."],"answer":"A","explain":"Năm 1527, Mạc Đăng Dung lên ngôi, nhà Mạc được thành lập.","points":0.25},{"type":"mcq","level":"TH","q":"Nhà nước phong kiến Đại Việt được tổ chức theo thể chế nào?","options":["A. Quân chủ chuyên chế trung ương tập quyền.","B. Dân chủ cộng hòa.","C. Quân chủ lập hiến.","D. Liên bang."],"answer":"A","explain":"Nhà nước Đại Việt là nhà nước quân chủ chuyên chế trung ương tập quyền: vua đứng đầu, nắm mọi quyền hành.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các cuộc kháng chiến sau, cuộc nào diễn ra thời Trần?","options":["A. Kháng chiến chống Nguyên – Mông (1258, 1285, 1287 – 1288).","B. Kháng chiến chống Tống (1075 – 1077).","C. Kháng chiến chống Minh (1418 – 1427).","D. Đại phá quân Thanh (1789)."],"answer":"A","explain":"Ba lần kháng chiến chống Nguyên – Mông diễn ra dưới thời Trần (Trần Thái Tông, Trần Nhân Tông, Trần Hưng Đạo).","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao nhà Minh (1407 – 1427) thực hiện chính sách hủy diệt văn minh Đại Việt?","options":["A. Nhằm đồng hóa, xóa bỏ bản sắc văn hóa dân tộc ta.","B. Để bảo tồn văn hóa Việt Nam.","C. Để phát triển giáo dục Việt Nam.","D. Do thiếu sách vở ở Trung Hoa."],"answer":"A","explain":"Nhà Minh thu gom sách vở, phá hủy công trình văn hóa nhằm đồng hóa dân tộc ta, nhưng thất bại trước sức sống của văn hóa Việt.","points":0.25},{"type":"mcq","level":"VDC","q":"Bài học từ chính sách “tiếp thu có chọn lọc” văn minh bên ngoài của Đại Việt là","options":["A. hội nhập nhưng giữ vững bản sắc dân tộc.","B. sao chép nguyên xi văn minh khác.","C. từ chối mọi ảnh hưởng bên ngoài.","D. chỉ tiếp thu về quân sự."],"answer":"A","explain":"Đại Việt tiếp thu Nho giáo, Phật giáo, kĩ thuật... nhưng Việt hóa cho phù hợp – bài học hội nhập gắn với giữ gìn bản sắc.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhà nước Đại Việt là nhà nước quân chủ chuyên chế trung ương tập quyền.","b) Vua là người đứng đầu nhà nước, nắm mọi quyền hành.","c) Đại Việt chưa từng có luật pháp thành văn.","d) Quân đội Đại Việt nhiều lần đánh bại ngoại xâm."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: Đại Việt có nhiều bộ luật thành văn (Hình thư, Luật Hồng Đức, Luật Gia Long).","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Khởi nghĩa Lam Sơn thắng lợi dẫn đến nhà Lê sơ ra đời (1428).","b) Quang Trung đại phá quân Thanh năm 1789.","c) Nhà Nguyễn thống nhất đất nước năm 1802.","d) Nhà Mạc thành lập năm 1428."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nhà Mạc thành lập năm 1527.","points":1},{"type":"short","level":"VD","q":"Vị vua nào dời đô từ Hoa Lư ra Thăng Long năm 1010 (ghi tên)?","answer":"Lý Công Uẩn","explain":"Lý Công Uẩn (Lý Thái Tổ) dời đô năm 1010, mở ra thời kì phát triển rực rỡ của Thăng Long – Hà Nội.","points":0.5},{"type":"short","level":"VDC","q":"Trận thủy chiến lừng lẫy năm 1288 trên sông Bạch Đằng do vị tướng nào chỉ huy?","answer":"Trần Hưng Đạo","explain":"Trần Quốc Tuấn (Trần Hưng Đạo) chỉ huy trận Bạch Đằng 1288, đánh tan quân Nguyên – Mông.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Kinh đô của triều Đinh – Tiền Lê đặt ở đâu?","options":["A. Hoa Lư (Ninh Bình).","B. Thăng Long.","C. Phú Xuân.","D. Cổ Loa."],"answer":"A","explain":"Triều Đinh và Tiền Lê đóng đô ở Hoa Lư (Ninh Bình), xây dựng chính quyền buổi đầu độc lập.","points":0.25},{"type":"mcq","level":"NB","q":"Tác phẩm Truyện Kiều ra đời vào","options":["A. đầu thế kỉ XIX.","B. thế kỉ XI.","C. thế kỉ XV.","D. thế kỉ X."],"answer":"A","explain":"Truyện Kiều của Nguyễn Du ra đời đầu thế kỉ XIX, là đỉnh cao văn học Nôm.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào phản ánh đúng về nông nghiệp Đại Việt?","options":["A. Nhà nước quan tâm đắp đê, khai hoang; nông nghiệp lúa nước phát triển.","B. Nông nghiệp bị bỏ mặc hoàn toàn.","C. Chỉ trồng cây công nghiệp.","D. Không biết làm thủy lợi."],"answer":"A","explain":"Các triều đại phong kiến đều coi trọng nông nghiệp: đắp đê, trị thủy, khai hoang, lập đồn điền.","points":0.25},{"type":"mcq","level":"TH","q":"Loại hình nghệ thuật nào sau đây phát triển thời phong kiến?","options":["A. Chèo, tuồng, ca trù, múa rối nước.","B. Điện ảnh, truyền hình.","C. Nhạc pop, rock.","D. Kịch nói hiện đại."],"answer":"A","explain":"Chèo, tuồng, ca trù, múa rối nước, quan họ là các loại hình nghệ thuật dân gian, bác học phát triển rực rỡ thời phong kiến.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao Thăng Long trở thành trung tâm kinh tế, văn hóa lớn?","options":["A. Vì là kinh đô lâu dài, vị trí địa lí thuận lợi, hội tụ nhân tài, thợ giỏi.","B. Vì gần biển để đánh cá.","C. Vì được nước ngoài đầu tư.","D. Vì không có chiến tranh bao giờ."],"answer":"A","explain":"Thăng Long là kinh đô nhiều triều đại, nằm ở trung tâm đồng bằng sông Hồng, thuận giao thương, hội tụ tinh hoa cả nước.","points":0.25},{"type":"mcq","level":"VDC","q":"Điểm tiến bộ của bộ máy nhà nước thời Lê sơ so với trước là","options":["A. hoàn chỉnh, chặt chẽ từ trung ương đến địa phương với luật pháp đầy đủ.","B. đơn giản, sơ khai.","C. không có luật pháp.","D. giao quyền cho địa phương hoàn toàn."],"answer":"A","explain":"Thời Lê Thánh Tông, bộ máy được cải cách hoàn chỉnh (6 bộ, 13 đạo thừa tuyên...) cùng Luật Hồng Đức – đỉnh cao của chế độ quân chủ tập quyền.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Triều Đinh – Tiền Lê đóng đô ở Hoa Lư.","b) Nhà Lý dời đô ra Thăng Long năm 1010.","c) Nhà Nguyễn đóng đô ở Phú Xuân (Huế).","d) Nhà Trần đóng đô ở Hoa Lư."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nhà Trần đóng đô ở Thăng Long.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chữ Nôm được sáng tạo trên cơ sở chữ Hán.","b) Truyện Kiều được viết bằng chữ Nôm.","c) Bình Ngô đại cáo được viết bằng chữ quốc ngữ.","d) Chữ Nôm góp phần phát triển văn học dân tộc."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: Bình Ngô đại cáo viết bằng chữ Hán; chữ quốc ngữ ra đời muộn hơn nhiều.","points":1},{"type":"short","level":"VD","q":"Vị anh hùng nào lãnh đạo phong trào Tây Sơn, đại phá quân Thanh năm 1789 (ghi tên)?","answer":"Quang Trung","explain":"Nguyễn Huệ (Quang Trung) lãnh đạo phong trào Tây Sơn, đại phá 29 vạn quân Thanh Tết Kỷ Dậu 1789.","points":0.5},{"type":"short","level":"VDC","q":"Hoàng thành Thăng Long – trung tâm quyền lực nhiều triều đại – hiện nay nằm ở thành phố nào?","answer":"Hà Nội","explain":"Hoàng thành Thăng Long ở Hà Nội, được UNESCO công nhận Di sản văn hóa thế giới năm 2010.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Thời kì nào sau đây thuộc tiến trình văn minh Đại Việt?","options":["A. Thời Lý – Trần – Hồ (thế kỉ XI – XV).","B. Thời Văn Lang (thế kỉ VII TCN).","C. Thời Phù Nam (thế kỉ I – VII).","D. Thời Bắc thuộc (179 TCN – 938)."],"answer":"A","explain":"Văn minh Đại Việt tính từ thế kỉ X (Ngô – Đinh – Tiền Lê) đến giữa thế kỉ XIX; thời Lý – Trần – Hồ nằm trong giai đoạn này.","points":0.25},{"type":"mcq","level":"NB","q":"Ai là tác giả của Bình Ngô đại cáo (1428)?","options":["A. Nguyễn Trãi.","B. Nguyễn Du.","C. Lê Thánh Tông.","D. Trần Hưng Đạo."],"answer":"A","explain":"Nguyễn Trãi viết Bình Ngô đại cáo năm 1428, tổng kết thắng lợi của khởi nghĩa Lam Sơn.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói văn minh Đại Việt mang tính dân tộc sâu sắc?","options":["A. Vì do cộng đồng các dân tộc Việt Nam sáng tạo, mang bản sắc riêng.","B. Vì sao chép hoàn toàn văn minh Trung Hoa.","C. Vì không có sáng tạo nào.","D. Vì chỉ của riêng người Kinh."],"answer":"A","explain":"Văn minh Đại Việt là sáng tạo của cộng đồng các dân tộc trên lãnh thổ Việt Nam, được Việt hóa, mang đậm bản sắc dân tộc.","points":0.25},{"type":"mcq","level":"TH","q":"Thủ công nghiệp Đại Việt phát triển với các làng nghề như","options":["A. gốm Chu Đậu, dệt lụa Vạn Phúc.","B. đóng tàu thủy hiện đại.","C. luyện thép công nghiệp.","D. sản xuất ô tô."],"answer":"A","explain":"Gốm Chu Đậu (Hải Dương), lụa Vạn Phúc (Hà Đông)... là những làng nghề thủ công nổi tiếng thời phong kiến.","points":0.25},{"type":"mcq","level":"VD","q":"Mối quan hệ giữa đấu tranh chống ngoại xâm và phát triển văn minh Đại Việt là","options":["A. giữ vững độc lập tạo môi trường hòa bình để văn minh phát triển rực rỡ.","B. chiến tranh làm văn minh lụi tàn hoàn toàn.","C. hai quá trình không liên quan.","D. chỉ phát triển văn minh khi có chiến tranh."],"answer":"A","explain":"Mỗi thắng lợi chống ngoại xâm (Bạch Đằng, Chi Lăng, Đống Đa...) đều củng cố độc lập, mở ra thời kì hòa bình để văn hóa phát triển.","points":0.25},{"type":"mcq","level":"VDC","q":"Từ sự phát triển của văn minh Đại Việt, bài học cho xây dựng văn hóa hiện nay là","options":["A. phát huy truyền thống, tiếp thu có chọn lọc tinh hoa nhân loại.","B. từ bỏ hoàn toàn truyền thống.","C. đóng cửa với thế giới.","D. chỉ phát triển văn hóa ngoại lai."],"answer":"A","explain":"Bài học: giữ gìn, phát huy bản sắc dân tộc đồng thời hội nhập, tiếp thu có chọn lọc tinh hoa văn hóa thế giới.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Văn minh Đại Việt kế thừa các nền văn minh cổ trên đất nước Việt Nam.","b) Hơn 1000 năm Bắc thuộc là một cơ sở hình thành văn minh Đại Việt.","c) Văn minh Đại Việt ra đời trước văn minh Văn Lang – Âu Lạc.","d) Văn minh Đại Việt tồn tại đến giữa thế kỉ XIX."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: văn minh Đại Việt (từ TK X) ra đời sau văn minh Văn Lang – Âu Lạc rất lâu.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thời Lý – Trần – Hồ: tam giáo cộng tồn.","b) Thời Lê sơ: độc tôn Nho giáo.","c) Thời Mạc: kinh tế hướng ngoại.","d) Cả ba thời kì đều có chung đặc trưng văn hóa."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: mỗi thời kì có đặc trưng riêng (tam giáo cộng tồn, độc tôn Nho giáo, kinh tế hướng ngoại).","points":1},{"type":"short","level":"VD","q":"Năm 1407 – 1427, triều đại phong kiến nào của Trung Hoa đô hộ Đại Việt?","answer":"Nhà Minh","explain":"Nhà Minh đô hộ Đại Việt từ 1407 đến 1427, thực hiện chính sách hủy diệt văn minh Đại Việt.","points":0.5},{"type":"short","level":"VDC","q":"Vị vua thời Lê sơ ban hành Quốc triều hình luật (1483) là ai (ghi tên)?","answer":"Lê Thánh Tông","explain":"Vua Lê Thánh Tông (trị vì 1460 – 1497) ban hành Quốc triều hình luật năm 1483, đưa Đại Việt thành cường quốc khu vực.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Cơ sở nào là quan trọng nhất hình thành văn minh Đại Việt?","options":["A. Nền độc lập, tự chủ của quốc gia Đại Việt.","B. Sự viện trợ của nước ngoài.","C. Sự di cư của người Hán.","D. Sự phát triển của thương mại nô lệ."],"answer":"A","explain":"Nền độc lập, tự chủ được bảo vệ vững chắc tạo môi trường hòa bình, ổn định – cơ sở quan trọng nhất để văn minh phát triển.","points":0.25},{"type":"mcq","level":"NB","q":"Kiến trúc nào sau đây thuộc thời Lý?","options":["A. Chùa Một Cột.","B. Hoàng thành Huế.","C. Tháp Chăm Mỹ Sơn.","D. Thành nhà Hồ."],"answer":"A","explain":"Chùa Một Cột (1049) là công trình thời Lý; Hoàng thành Huế thời Nguyễn; Mỹ Sơn của Chăm-pa; thành nhà Hồ thời Hồ.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các triều đại phong kiến đều coi trọng nông nghiệp?","options":["A. Vì nông nghiệp là nguồn sống chính, nguồn thu thuế chủ yếu.","B. Vì không biết nghề khác.","C. Vì bị ép buộc.","D. Vì chỉ để xuất khẩu."],"answer":"A","explain":"Nông nghiệp lúa nước nuôi sống đại đa số dân cư, là nguồn lương thực và thuế khóa chính của nhà nước phong kiến.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào KHÔNG thuộc thành tựu văn hóa Đại Việt?","options":["A. Chữ La-tinh được dùng phổ biến từ thế kỉ X.","B. Chữ Nôm ra đời.","C. Văn Miếu – Quốc Tử Giám được xây dựng.","D. Truyện Kiều ra đời."],"answer":"A","explain":"Chữ quốc ngữ (La-tinh) ra đời muộn (thế kỉ XVII) và phổ biến muộn hơn; các thành tựu còn lại đều thuộc văn minh Đại Việt.","points":0.25},{"type":"mcq","level":"VD","q":"Việc tổ chức thi cử thời phong kiến có tác dụng","options":["A. tuyển chọn nhân tài, khuyến khích học tập.","B. hạn chế người tài.","C. chỉ phục vụ vui chơi.","D. làm giàu cho quan lại."],"answer":"A","explain":"Thi cử (từ khoa thi 1075) là con đường tuyển chọn quan lại, nhân tài, khuyến khích truyền thống hiếu học.","points":0.25},{"type":"mcq","level":"VDC","q":"Điểm nổi bật của văn minh Đại Việt thời Tây Sơn là","options":["A. đề cao chữ Nôm, chấn hưng văn hóa dân tộc.","B. độc tôn Nho giáo như Lê sơ.","C. từ bỏ chữ Nôm.","D. cấm đoán văn học."],"answer":"A","explain":"Quang Trung đề cao chữ Nôm (dùng trong chiếu chỉ, thi cử), chấn hưng văn hóa dân tộc sau thời kì chia cắt.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Các triều đại phong kiến đều coi trọng nông nghiệp.","b) Thi cử được tổ chức để tuyển chọn nhân tài.","c) Chữ Nôm ra đời góp phần phát triển văn học dân tộc.","d) Thời phong kiến không có trường học nào."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đã có Văn Miếu – Quốc Tử Giám và nhiều trường học ở địa phương.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Quang Trung đề cao chữ Nôm.","b) Nhà Nguyễn ban hành Hoàng Việt luật lệ (1815).","c) Thời Nguyễn, văn minh Đại Việt tiếp tục phát triển rực rỡ như Lê sơ.","d) Giữa thế kỉ XIX, văn minh Đại Việt bước vào suy thoái trước thách thức mới."],"answer":["T","T","F","T"],"explain":"a), b) Đúng. c) Sai: thời Nguyễn văn hóa có phát triển nhưng trì trệ, bảo thủ. d) Đúng: trước nguy cơ thực dân, chế độ phong kiến bộc lộ lạc hậu.","points":1},{"type":"short","level":"VD","q":"Thương cảng quốc tế thời Lý – Trần ở Quảng Ninh có tên là gì?","answer":"Vân Đồn","explain":"Vân Đồn là thương cảng quốc tế sầm uất thời Lý – Trần, nơi giao thương với nhiều nước.","points":0.5},{"type":"short","level":"VDC","q":"Phố Hiến – thương cảng sầm uất thế kỉ XVI – XVII – hiện nay thuộc tỉnh nào?","answer":"Hưng Yên","explain":"Phố Hiến (Hưng Yên) từng là thương cảng quốc tế sầm uất bậc nhất Đàng Ngoài thế kỉ XVI – XVII.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Giai đoạn nào KHÔNG thuộc văn minh Đại Việt?","options":["A. Thời Bắc thuộc (179 TCN – 938).","B. Thời Ngô – Đinh – Tiền Lê.","C. Thời Lý – Trần – Hồ.","D. Thời Lê sơ."],"answer":"A","explain":"Văn minh Đại Việt tính từ thế kỉ X; thời Bắc thuộc (trước 938) là giai đoạn đấu tranh giành độc lập, chưa phải văn minh Đại Việt.","points":0.25},{"type":"mcq","level":"NB","q":"Vị vua đầu tiên của nhà Nguyễn là","options":["A. Gia Long.","B. Minh Mạng.","C. Quang Trung.","D. Lê Lợi."],"answer":"A","explain":"Nguyễn Ánh lên ngôi năm 1802, lấy niên hiệu Gia Long, mở đầu triều Nguyễn.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói thời Lê sơ là đỉnh cao của chế độ quân chủ tập quyền?","options":["A. Vì bộ máy hoàn chỉnh từ trung ương đến địa phương, luật pháp đầy đủ.","B. Vì vua không nắm quyền.","C. Vì địa phương cát cứ.","D. Vì không có luật pháp."],"answer":"A","explain":"Thời Lê Thánh Tông, bộ máy 6 bộ, 13 đạo thừa tuyên... cùng Luật Hồng Đức tạo nên nhà nước tập quyền hoàn chỉnh nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Hoạt động thương nghiệp Đại Việt phát triển với biểu hiện","options":["A. chợ búa, phố phường sầm uất; thương cảng giao thương quốc tế.","B. chỉ buôn bán trong làng.","C. cấm thương nhân nước ngoài.","D. không có tiền tệ."],"answer":"A","explain":"Thăng Long 36 phố phường, các thương cảng Vân Đồn, Phố Hiến, Hội An buôn bán tấp nập trong và ngoài nước.","points":0.25},{"type":"mcq","level":"VD","q":"Nguyên nhân khiến văn minh Đại Việt suy thoái từ giữa thế kỉ XIX là","options":["A. chế độ phong kiến trì trệ, bảo thủ trước thách thức của chủ nghĩa thực dân.","B. thiên tai liên miên duy nhất.","C. dân số giảm sút.","D. không còn chữ viết."],"answer":"A","explain":"Trước nguy cơ xâm lược của thực dân phương Tây, nhà Nguyễn bảo thủ, không cải cách kịp thời khiến đất nước lạc hậu, văn minh suy thoái.","points":0.25},{"type":"mcq","level":"VDC","q":"So với các nền văn minh cổ, thành tựu nổi bật riêng của văn minh Đại Việt về chính trị là","options":["A. nhà nước quân chủ tập quyền hoàn chỉnh với luật pháp thành văn.","B. không có nhà nước.","C. nhà nước sơ khai, đơn giản.","D. không có pháp luật."],"answer":"A","explain":"Khác với nhà nước sơ khai thời Văn Lang – Âu Lạc, Đại Việt có nhà nước quân chủ tập quyền hoàn chỉnh và nhiều bộ luật thành văn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thời Bắc thuộc chưa thuộc văn minh Đại Việt.","b) Văn minh Đại Việt bắt đầu từ thế kỉ X.","c) Giữa thế kỉ XIX, văn minh Đại Việt suy thoái.","d) Văn minh Đại Việt kéo dài đến nay không thay đổi."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: từ giữa thế kỉ XIX, xã hội Việt Nam bước vào thời kì thuộc địa, văn minh phong kiến suy tàn.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thăng Long là kinh đô của nhiều triều đại phong kiến.","b) Hoa Lư là kinh đô của triều Đinh – Tiền Lê.","c) Phú Xuân là kinh đô của nhà Nguyễn.","d) Cổ Loa là kinh đô của nhà Lý."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Cổ Loa là kinh đô của Ngô Quyền và An Dương Vương; nhà Lý đóng đô ở Thăng Long.","points":1},{"type":"short","level":"VD","q":"Niên hiệu của vua Nguyễn Ánh khi lên ngôi năm 1802 là gì?","answer":"Gia Long","explain":"Nguyễn Ánh lên ngôi năm 1802, lấy niên hiệu Gia Long, mở đầu triều Nguyễn.","points":0.5},{"type":"short","level":"VDC","q":"Cuộc kháng chiến chống quân Minh (1418 – 1427) do ai lãnh đạo (ghi tên)?","answer":"Lê Lợi","explain":"Lê Lợi lãnh đạo khởi nghĩa Lam Sơn (1418 – 1427), đánh đuổi quân Minh, lập ra nhà Lê sơ.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"“Tam giáo cộng tồn” là đặc trưng của thời kì nào?","options":["A. Thời Lý – Trần – Hồ.","B. Thời Lê sơ.","C. Thời Nguyễn.","D. Thời Văn Lang."],"answer":"A","explain":"Tam giáo cộng tồn (Nho – Phật – Đạo cùng tồn tại) là đặc trưng nổi bật của văn minh Đại Việt thời Lý – Trần – Hồ.","points":0.25},{"type":"mcq","level":"NB","q":"“Độc tôn Nho giáo” là chính sách của thời kì nào?","options":["A. Thời Lê sơ.","B. Thời Lý.","C. Thời Trần.","D. Thời Hồ."],"answer":"A","explain":"Thời Lê sơ, Nho giáo được đề cao tuyệt đối (độc tôn Nho giáo), khác với tam giáo cộng tồn thời Lý – Trần.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nhà Lý – Trần coi trọng cả ba tôn giáo Nho, Phật, Đạo?","options":["A. Để đoàn kết các tầng lớp nhân dân, củng cố khối thống nhất.","B. Vì vua không có chính kiến.","C. Vì bị ép buộc.","D. Vì muốn xóa bỏ Nho giáo."],"answer":"A","explain":"Chính sách tam giáo cộng tồn giúp hòa hợp các lực lượng xã hội, củng cố khối đoàn kết dân tộc trong xây dựng và bảo vệ đất nước.","points":0.25},{"type":"mcq","level":"TH","q":"Thành tựu nào thể hiện sự phát triển của kĩ thuật thời phong kiến?","options":["A. Súng thần công, thuyền chiến, nghề đúc đồng.","B. Máy hơi nước, đầu máy xe lửa.","C. Điện thoại, internet.","D. Máy bay, tàu ngầm."],"answer":"A","explain":"Thời phong kiến, kĩ thuật quân sự (súng thần công thời Hồ, thuyền chiến) và nghề đúc đồng, gốm sứ đạt trình độ cao.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao các công trình như Văn Miếu, chùa Một Cột tồn tại đến nay?","options":["A. Nhờ giá trị lịch sử, văn hóa to lớn và sự gìn giữ của các thế hệ.","B. Vì được xây bằng bê tông cốt thép.","C. Vì không ai biết đến.","D. Vì được nước ngoài bảo vệ."],"answer":"A","explain":"Các công trình có giá trị lịch sử, văn hóa, kiến trúc đặc sắc nên được các triều đại và nhân dân gìn giữ, trùng tu qua các thời kì.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định nào đúng về vai trò của văn minh Đại Việt trong lịch sử dân tộc?","options":["A. Là nền tảng văn hóa, hun đúc bản sắc và sức mạnh dân tộc.","B. Không có vai trò gì.","C. Làm mất bản sắc dân tộc.","D. Chỉ phục vụ tầng lớp vua quan."],"answer":"A","explain":"Văn minh Đại Việt hun đúc bản sắc, lòng yêu nước, ý chí độc lập – sức mạnh tinh thần giúp dân tộc vượt qua mọi thử thách.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tam giáo cộng tồn là đặc trưng thời Lý – Trần – Hồ.","b) Độc tôn Nho giáo là chính sách thời Lê sơ.","c) Thời Nguyễn tiếp tục chính sách tam giáo cộng tồn.","d) Phật giáo phát triển mạnh thời Lý – Trần."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: thời Nguyễn đề cao Nho giáo, hạn chế Phật giáo, Đạo giáo.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Súng thần công đã xuất hiện thời Hồ.","b) Nghề đúc đồng tiếp tục phát triển thời phong kiến.","c) Kĩ thuật in ấn, làm giấy đã có thời phong kiến.","d) Thời phong kiến đã có máy hơi nước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: kĩ thuật quân sự, thủ công, in ấn phát triển. d) Sai: máy hơi nước là thành tựu cách mạng công nghiệp châu Âu.","points":1},{"type":"short","level":"VD","q":"Ba tôn giáo cùng tồn tại thời Lý – Trần – Hồ gồm Nho giáo, Phật giáo và tôn giáo nào?","answer":"Đạo giáo","explain":"Tam giáo là Nho giáo, Phật giáo và Đạo giáo cùng tồn tại hòa hợp (tam giáo cộng tồn).","points":0.5},{"type":"short","level":"VDC","q":"Vị vua nhà Hồ cho đúc súng thần công, xây thành nhà Hồ là ai (ghi tên)?","answer":"Hồ Quý Ly","explain":"Hồ Quý Ly (trị vì 1400 – 1401, thực quyền đến 1407) có nhiều cải cách: đúc súng thần công, phát hành tiền giấy, xây thành nhà Hồ.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Văn minh Đại Việt chịu ảnh hưởng có chọn lọc của các nền văn minh nào?","options":["A. Ấn Độ, Trung Hoa.","B. Ai Cập, Hi Lạp.","C. La Mã, Ả Rập.","D. Anh, Pháp."],"answer":"A","explain":"SGK nêu văn minh Đại Việt tiếp thu có chọn lọc thành tựu của văn minh Ấn Độ, Trung Hoa về tư tưởng, chính trị, giáo dục, văn hóa, kĩ thuật.","points":0.25},{"type":"mcq","level":"NB","q":"Làng nghề gốm Chu Đậu nổi tiếng hiện nay thuộc tỉnh nào?","options":["A. Hải Dương.","B. Quảng Nam.","C. An Giang.","D. Ninh Bình."],"answer":"A","explain":"Gốm Chu Đậu (huyện Nam Sách, Hải Dương) nổi tiếng từ thế kỉ XIV – XVII với kĩ thuật men tinh xảo.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm chung của các bộ luật thời phong kiến là","options":["A. bảo vệ quyền lực của vua và trật tự phong kiến.","B. bảo vệ quyền lợi của nông dân hoàn toàn.","C. xóa bỏ chế độ quân chủ.","D. ban hành bởi nhân dân."],"answer":"A","explain":"Các bộ luật phong kiến (Hình thư, Luật Hồng Đức, Luật Gia Long) đều nhằm bảo vệ vương quyền và trật tự xã hội phong kiến.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói thế kỉ XV (thời Lê sơ) là thời kì hoàng kim của văn minh Đại Việt?","options":["A. Vì mọi lĩnh vực chính trị, kinh tế, văn hóa đều đạt đỉnh cao.","B. Vì không có chiến tranh.","C. Vì dân số đông nhất.","D. Vì được Trung Hoa công nhận."],"answer":"A","explain":"Dưới thời Lê Thánh Tông, bộ máy hoàn chỉnh, kinh tế thịnh vượng, văn hóa rực rỡ – Đại Việt thành cường quốc khu vực.","points":0.25},{"type":"mcq","level":"VD","q":"Mối quan hệ giữa văn minh Đại Việt và văn minh Trung Hoa là","options":["A. tiếp thu có chọn lọc, Việt hóa cho phù hợp.","B. sao chép hoàn toàn.","C. từ chối hoàn toàn.","D. bị đồng hóa hoàn toàn."],"answer":"A","explain":"Người Việt tiếp thu Nho giáo, chữ Hán, kĩ thuật... nhưng cải biến cho phù hợp, giữ vững bản sắc dân tộc.","points":0.25},{"type":"mcq","level":"VDC","q":"Từ lịch sử văn minh Đại Việt, thế hệ trẻ cần","options":["A. tự hào, giữ gìn di sản và phát huy trong thời đại mới.","B. quên đi quá khứ.","C. chỉ học văn hóa nước ngoài.","D. phá bỏ di tích cũ."],"answer":"A","explain":"Hiểu và tự hào về văn minh dân tộc để có trách nhiệm bảo tồn di sản, phát huy giá trị trong phát triển đất nước.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Văn minh Đại Việt tiếp thu có chọn lọc văn minh Ấn Độ, Trung Hoa.","b) Người Việt đã Việt hóa các yếu tố tiếp thu.","c) Văn minh Đại Việt là bản sao của văn minh Trung Hoa.","d) Bản sắc dân tộc được giữ vững suốt thời phong kiến."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: Đại Việt tiếp thu có chọn lọc và Việt hóa, không sao chép.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Gốm Chu Đậu là làng nghề nổi tiếng thời phong kiến.","b) Lụa Vạn Phúc là làng nghề dệt lụa truyền thống.","c) Thời phong kiến không có làng nghề thủ công.","d) Thủ công nghiệp góp phần phát triển kinh tế Đại Việt."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: làng nghề thủ công phát triển khắp nơi thời phong kiến.","points":1},{"type":"short","level":"VD","q":"Hội An – thương cảng sầm uất thế kỉ XVI – XVIII – hiện nay thuộc tỉnh nào?","answer":"Quảng Nam","explain":"Hội An (Quảng Nam) từng là thương cảng quốc tế sầm uất, nay là Di sản văn hóa thế giới.","points":0.5},{"type":"short","level":"VDC","q":"Theo SGK, văn minh Đại Việt là sáng tạo của cộng đồng các dân tộc Việt Nam từ thế kỉ X đến thời gian nào (ghi 4 chữ)?","answer":"Giữa thế kỉ XIX","explain":"Văn minh Đại Việt tồn tại từ thế kỉ X đến giữa thế kỉ XIX (khi thực dân Pháp xâm lược).","points":0.5}]}]}</script>
