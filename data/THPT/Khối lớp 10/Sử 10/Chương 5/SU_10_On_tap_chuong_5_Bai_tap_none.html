{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Quốc gia khởi đầu cho cách mạng công nghiệp trên thế giới là","options":["A. Anh.","B. Pháp.","C. Đức.","D. Nga."],"answer":"A","explain":"Cách mạng công nghiệp diễn ra đầu tiên ở Anh vào cuối thế kỉ XVIII.","points":0.25},{"type":"mcq","level":"NB","q":"Chiếc máy kéo sợi Gien-ni ra đời gắn với tên tuổi","options":["A. Giêm Ha-gri-vơ.","B. Giêm Oát.","C. Ri-chác Ác-rai.","D. Giôn Cay."],"answer":"A","explain":"Năm 1764, Giêm Ha-gri-vơ chế tạo máy kéo sợi Gien-ni.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên nhân sâu xa khiến Anh bùng nổ cách mạng công nghiệp trước tiên là","options":["A. cách mạng tư sản thành công sớm, tích lũy tư bản dồi dào.","B. dân số ít.","C. khí hậu thuận lợi.","D. không có thuộc địa."],"answer":"A","explain":"Cách mạng tư sản sớm giúp Anh tích lũy tư bản (buôn bán, thuộc địa), có than sắt, lao động tự do.","points":0.25},{"type":"mcq","level":"TH","q":"Máy móc thay thế lao động thủ công trước hết trong lĩnh vực","options":["A. kéo sợi, dệt vải.","B. khai thác dầu.","C. điện tử.","D. hàng không."],"answer":"A","explain":"Ngành dệt (kéo sợi, dệt vải) được cơ khí hóa đầu tiên do nhu cầu vải vóc lớn.","points":0.25},{"type":"mcq","level":"VD","q":"Việc phát minh máy hơi nước có ý nghĩa then chốt vì","options":["A. cung cấp động lực chung cho mọi máy móc, không phụ thuộc thiên nhiên.","B. chỉ dùng trong dệt.","C. làm giảm năng suất.","D. không ứng dụng được."],"answer":"A","explain":"Máy hơi nước tạo nguồn động lực chủ động, dùng cho mọi ngành – bước ngoặt cơ khí hóa.","points":0.25},{"type":"mcq","level":"VDC","q":"Từ kinh nghiệm nước Anh, điều kiện tiên quyết để một nước công nghiệp hóa thành công là","options":["A. có thị trường, vốn, lao động và chính sách phù hợp.","B. chỉ cần tài nguyên.","C. chỉ cần dân đông.","D. đóng cửa tự cấp."],"answer":"A","explain":"Cần đồng bộ: vốn, thị trường, lao động, tài nguyên và thể chế phù hợp – không chỉ một yếu tố.","points":0.25},{"type":"truefalse","level":"NB","q":"Nhận định sau đúng hay sai:","statements":["a) Cách mạng công nghiệp bắt đầu ở Anh.","b) Máy Gien-ni do Ha-gri-vơ chế tạo.","c) Dệt là ngành cơ khí hóa đầu tiên.","d) Máy hơi nước không có ý nghĩa."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: máy hơi nước là bước ngoặt, cung cấp động lực chung.","points":1},{"type":"truefalse","level":"TH","q":"Nhận định sau đúng hay sai:","statements":["a) Cách mạng tư sản sớm giúp Anh tích lũy tư bản.","b) Công nghiệp hóa cần đồng bộ nhiều điều kiện.","c) Chỉ cần tài nguyên là công nghiệp hóa được.","d) Máy hơi nước dùng cho mọi ngành."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần vốn, thị trường, lao động, thể chế nữa.","points":1},{"type":"short","level":"VD","q":"Nhà phát minh máy hơi nước cải tiến năm 1784 tên là gì (ghi 2 chữ)?","answer":"Giêm Oát","explain":"Giêm Oát cải tiến máy hơi nước năm 1784.","points":0.5},{"type":"short","level":"VDC","q":"Ngành nào được cơ khí hóa đầu tiên trong cách mạng công nghiệp (ghi 1 chữ)?","answer":"Dệt","explain":"Ngành dệt (kéo sợi, dệt vải) đi đầu cơ khí hóa.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Động cơ đốt trong là phát minh của thời kì","options":["A. lần thứ hai.","B. lần thứ nhất.","C. lần thứ ba.","D. lần thứ tư."],"answer":"A","explain":"Động cơ đốt trong ra đời trong cách mạng công nghiệp lần thứ hai.","points":0.25},{"type":"mcq","level":"NB","q":"Phương pháp luyện thép Put-đinh do ai phát minh?","options":["A. Hen-ri Cớt.","B. Giêm Oát.","C. Tô-mát Ê-đi-xơn.","D. A-lếch-xan-đơ Graham Ben."],"answer":"A","explain":"Năm 1784, Hen-ri Cớt phát minh lò luyện quặng phương pháp Put-đinh.","points":0.25},{"type":"mcq","level":"TH","q":"Điện thoại ra đời dựa trên cơ sở khoa học nào?","options":["A. Lí thuyết điện từ.","B. Cơ học cổ điển.","C. Thuyết tương đối.","D. Thuyết tiến hóa."],"answer":"A","explain":"Điện thoại, động cơ điện dựa trên những khám phá về điện từ  nhuộm, phân bón thời lần thứ hai là công nghiệp gì (ghi 2 chữ)?","answer":"Hóa chất","explain":"Công nghiệp hóa chất.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Robot công nghiệp xuất hiện phổ biến từ cuộc cách mạng nào?","options":["A. Lần thứ ba.","B. Lần thứ nhất.","C. Lần thứ hai.","D. Lần thứ tư."],"answer":"A","explain":"Robot, dây chuyền tự động là thành tựu của lần thứ ba.","points":0.25},{"type":"mcq","level":"NB","q":"Kĩ thuật gen thuộc lĩnh vực","options":["A. công nghệ sinh học.","B. luyện kim.","C. dệt may.","D. khai mỏ."],"answer":"A","explain":"Kĩ thuật gen là thành tựu công nghệ sinh học của lần thứ ba.","points":0.25},{"type":"mcq","level":"TH","q":"Máy tính điện tử thay đổi sản xuất vì","options":["A. xử lí thông tin, điều khiển tự động nhanh, chính xác.","B. chỉ để chơi game.","C. làm chậm sản xuất.","D. không ứng dụng được."],"answer":"A","explain":"Máy tính giúp tính toán, điều khiển tự động nhanh chính xác – nâng cao năng suất.","points":0.25},{"type":"mcq","level":"TH","q":"Năng lượng hạt nhân được ứng dụng từ","options":["A. lần thứ ba.","B. lần thứ nhất.","C. lần thứ hai.","D. thời cổ đại."],"answer":"A","explain":"Năng lượng hạt nhân là nguồn năng lượng mới của lần thứ ba.","points":0.25},{"type":"mcq","level":"VD","q":"Kinh tế tri thức khác kinh tế công nghiệp ở","options":["A. lấy tri thức, thông tin làm nguồn lực chính.","B. không cần lao động.","C. chỉ dựa vào tài nguyên.","D. không cần công nghệ."],"answer":"A","explain":"Kinh tế tri thức: tri thức, thông tin là nguồn lực quan trọng nhất, khác với dựa vào tài nguyên, lao động giản đơn.","points":0.25},{"type":"mcq","level":"VDC","q":"Để xây dựng kinh tế tri thức, quốc gia cần ưu tiên","options":["A. giáo dục, nghiên cứu khoa học, hạ tầng thông tin.","B. khai thác tài nguyên cạn kiệt.","C. đóng cửa.","D. chỉ phát triển du lịch."],"answer":"A","explain":"Kinh tế tri thức cần con người có tri thức, hạ tầng thông tin, môi trường nghiên cứu.","points":0.25},{"type":"truefalse","level":"NB","q":"Nhận định sau đúng hay sai:","statements":["a) Robot công nghiệp thuộc lần thứ ba.","b) Kĩ thuật gen thuộc công nghệ sinh học.","c) Năng lượng hạt nhân thuộc lần thứ ba.","d) Máy tính không ứng dụng trong sản xuất."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: máy tính điều khiển tự động, nâng cao năng suất.","points":1},{"type":"truefalse","level":"TH","q":"Nhận định sau đúng hay sai:","statements":["a) Kinh tế tri thức lấy tri thức làm chính.","b) Cần ưu tiên giáo dục, nghiên cứu.","c) Chỉ cần khai thác tài nguyên.","d) Hạ tầng thông tin rất quan trọng."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: kinh tế tri thức dựa vào tri thức, không chỉ tài nguyên.","points":1},{"type":"short","level":"VD","q":"Thiết bị tự động thay sức người trong nhà máy lần thứ ba gọi là gì (ghi 1 chữ)?","answer":"Robot","explain":"Robot công nghiệp.","points":0.5},{"type":"short","level":"VDC","q":"Nguồn năng lượng mới từ phản ứng hạt nhân có tên là năng lượng gì (ghi 2 chữ)?","answer":"Hạt nhân","explain":"Năng lượng hạt nhân.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Trợ lí ảo trên điện thoại là ứng dụng của","options":["A. trí tuệ nhân tạo.","B. máy hơi nước.","C. động cơ đốt trong.","D. lò cao."],"answer":"A","explain":"Trợ lí ảo (nhận diện giọng nói, trả lời) là ứng dụng AI.","points":0.25},{"type":"mcq","level":"NB","q":"Công nghệ in tạo vật thể từ mô hình số gọi là","options":["A. in 3D.","B. in lụa.","C. in báo.","D. in tiền."],"answer":"A","explain":"In 3D tạo vật thể ba chiều từ mô hình số.","points":0.25},{"type":"mcq","level":"TH","q":"Dữ liệu lớn giúp doanh nghiệp","options":["A. hiểu khách hàng, dự báo thị trường chính xác hơn.","B. không có ích gì.","C. làm mất dữ liệu.","D. tăng chi phí vô ích."],"answer":"A","explain":"Phân tích Big Data giúp hiểu hành vi khách hàng, dự báo xu hướng.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm vượt trội của nhà máy thông minh 4.0 là","options":["A. máy móc tự kết nối, tự điều chỉnh theo thời gian thực.","B. không cần điện.","C. công nhân làm tay hoàn toàn.","D. không có máy móc."],"answer":"A","explain":"Nhà máy thông minh: IoT kết nối, AI điều chỉnh sản xuất thời gian thực.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao in 3D được coi là cách mạng trong sản xuất?","options":["A. Vì sản xuất đơn chiếc, phức tạp mà không cần khuôn mẫu đắt tiền.","B. Vì chỉ in được giấy.","C. Vì chậm hơn thủ công.","D. Vì không tạo được vật thể."],"answer":"A","explain":"In 3D bỏ qua khuôn mẫu, sản xuất linh hoạt chi tiết phức tạp, cá thể hóa.","points":0.25},{"type":"mcq","level":"VDC","q":"Doanh nghiệp Việt Nam muốn tham gia chuỗi cung ứng 4.0 cần","options":["A. số hóa quy trình, nâng chất lượng, đạt chuẩn quốc tế.","B. giữ sản xuất thủ công.","C. không cần thay đổi.","D. chỉ giảm giá."],"answer":"A","explain":"Tham gia chuỗi 4.0 cần số hóa, chuẩn hóa chất lượng theo yêu cầu toàn cầu.","points":0.25},{"type":"truefalse","level":"NB","q":"Nhận định sau đúng hay sai:","statements":["a) Trợ lí ảo là ứng dụng AI.","b) In 3D tạo vật thể từ mô hình số.","c) Big Data giúp dự báo thị trường.","d) Nhà máy 4.0 không cần kết nối."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nhà máy 4.0 dựa trên kết nối IoT.","points":1},{"type":"truefalse","level":"TH","q":"Nhận định sau đúng hay sai:","statements":["a) In 3D không cần khuôn mẫu.","b) Doanh nghiệp cần số hóa.","c) Nên giữ sản xuất thủ công.","d) Máy móc tự điều chỉnh thời gian thực."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần số hóa để tham gia chuỗi 4.0.","points":1},{"type":"short","level":"VD","q":"Nhà máy mà máy móc tự kết nối, tự điều chỉnh gọi là nhà máy gì (ghi 2 chữ)?","answer":"Thông minh","explain":"Nhà máy thông minh (smart factory).","points":0.5},{"type":"short","level":"VDC","q":"Việc phân tích khối lượng dữ liệu khổng lồ có tên là dữ liệu gì (ghi 1 chữ)?","answer":"Lớn","explain":"Dữ liệu lớn (Big Data).","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Hệ quả xã hội đầu tiên của cách mạng công nghiệp là sự ra đời của","options":["A. giai cấp tư sản và vô sản.","B. giai cấp nông nô.","C. tầng lớp tăng lữ.","D. chế độ phong kiến."],"answer":"A","explain":"Công nghiệp hóa hình thành hai giai cấp mới: tư sản (chủ nhà máy) và vô sản (công nhân).","points":0.25},{"type":"mcq","level":"NB","q":"Đô thị hóa gắn liền với","options":["A. nhà máy mọc lên, dân đổ về thành phố.","B. nông thôn phát triển.","C. dân về quê.","D. không liên quan công nghiệp."],"answer":"A","explain":"Nhà máy tập trung ở thành phố, thu hút lao động – thúc đẩy đô thị hóa.","points":0.25},{"type":"mcq","level":"TH","q":"Mâu thuẫn cơ bản trong xã hội tư bản công nghiệp là","options":["A. giữa tư sản và vô sản.","B. giữa nông dân với nhau.","C. giữa các nước.","D. không có mâu thuẫn."],"answer":"A","explain":"Tư sản bóc lột vô sản – mâu thuẫn cơ bản dẫn đến đấu tranh công nhân.","points":0.25},{"type":"mcq","level":"TH","q":"Cuộc sống công nhân thời kì đầu công nghiệp đặc trưng bởi","options":["A. giờ làm dài, lương thấp, điều kiện mất an toàn.","B. lương cao, nhàn hạ.","C. được nghỉ nhiều.","D. không phải làm việc."],"answer":"A","explain":"Ngày làm 14–16 giờ, lương rẻ mạt, nhà ở chật chội, mất an toàn.","points":0.25},{"type":"mcq","level":"VD","q":"Phong trào công nhân buộc giai cấp tư sản phải","options":["A. nhượng bộ: giảm giờ làm, ban hành luật lao động.","B. tăng bóc lột.","C. đóng cửa nhà máy.","D. không thay đổi gì."],"answer":"A","explain":"Đấu tranh kiên trì buộc tư sản nhượng bộ: ngày làm 8 giờ, luật bảo vệ lao động.","points":0.25},{"type":"mcq","level":"VDC","q":"Giá trị thời đại của phong trào công nhân thế kỉ XIX là","options":["A. khẳng định sức mạnh đoàn kết của người lao động.","B. chỉ có ý nghĩa quá khứ.","C. gây chia rẽ.","D. không có giá trị."],"answer":"A","explain":"Bài học đoàn kết, tổ chức để bảo vệ quyền lợi chính đáng còn nguyên giá trị.","points":0.25},{"type":"truefalse","level":"NB","q":"Nhận định sau đúng hay sai:","statements":["a) Ra đời giai cấp tư sản, vô sản.","b) Đô thị hóa do nhà máy mọc lên.","c) Mâu thuẫn cơ bản là tư sản – vô sản.","d) Công nhân sống sung sướng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: công nhân bị bóc lột nặng nề.","points":1},{"type":"truefalse","level":"TH","q":"Nhận định sau đúng hay sai:","statements":["a) Đấu tranh mang lại ngày làm 8 giờ.","b) Đoàn kết là sức mạnh.","c) Tư sản tự nguyện giảm bóc lột.","d) Luật lao động ra đời từ đấu tranh."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: nhượng bộ là kết quả đấu tranh.","points":1},{"type":"short","level":"VD","q":"Giai cấp sở hữu nhà máy, bóc lột công nhân có tên là gì (ghi 2 chữ)?","answer":"Tư sản","explain":"Giai cấp tư sản.","points":0.5},{"type":"short","level":"VDC","q":"Quá trình dân đổ về thành phố theo nhà máy gọi là gì (ghi 2 chữ)?","answer":"Đô thị hóa","explain":"Đô thị hóa.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Nguồn năng lượng chủ yếu của lần thứ nhất là","options":["A. hơi nước.","B. điện.","C. hạt nhân.","D. mặt trời."],"answer":"A","explain":"Hơi nước là năng lượng trung tâm của lần thứ nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Nguồn năng lượng chủ yếu của lần thứ hai là","options":["A. điện.","B. hơi nước.","C. gió.","D. củi."],"answer":"A","explain":"Điện năng là năng lượng trung tâm của lần thứ hai.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao điện thay thế hơi nước trong lần thứ hai?","options":["A. Vì sạch, dễ truyền tải xa, sử dụng linh hoạt.","B. Vì hơi nước rẻ hơn.","C. Vì điện khó sản xuất.","D. Vì không có lí do."],"answer":"A","explain":"Điện sạch, truyền tải xa qua dây dẫn, bật tắt linh hoạt – ưu việt hơn hơi nước.","points":0.25},{"type":"mcq","level":"TH","q":"Giao thông vận tải thời cận đại phát triển nhờ","options":["A. đầu máy xe lửa, tàu thủy hơi nước.","B. máy bay phản lực.","C. ô tô điện.","D. tàu vũ trụ."],"answer":"A","explain":"Đầu máy xe lửa, tàu thủy hơi nước làm thay đổi giao thông thời cận đại.","points":0.25},{"type":"mcq","level":"VD","q":"So sánh động lực: lần thứ nhất dựa nhiều vào kinh nghiệm, lần thứ hai dựa vào","options":["A. lí thuyết khoa học (điện từ, hóa học).","B. may rủi.","C. mê tín.","D. không dựa vào gì."],"answer":"A","explain":"Lần hai: phát minh dựa trên lí thuyết khoa học – bước tiến về trình độ.","points":0.25},{"type":"mcq","level":"VDC","q":"Từ so sánh hai lần cận đại, xu thế phát triển công nghệ là","options":["A. ngày càng dựa vào khoa học, quy mô ngày càng lớn.","B. ngày càng lạc hậu.","C. đứng yên.","D. quay lại thủ công."],"answer":"A","explain":"Xu thế: khoa học dẫn dắt, quy mô công nghiệp ngày càng lớn.","points":0.25},{"type":"truefalse","level":"NB","q":"Nhận định sau đúng hay sai:","statements":["a) Lần thứ nhất dùng hơi nước.","b) Lần thứ hai dùng điện.","c) Điện ưu việt hơn hơi nước.","d) Giao thông không phát triển."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đường sắt, tàu thủy phát triển mạnh.","points":1},{"type":"truefalse","level":"TH","q":"Nhận định sau đúng hay sai:","statements":["a) Lần thứ hai dựa vào khoa học.","b) Công nghệ ngày càng hiện đại.","c) Nên quay lại thủ công.","d) Quy mô công nghiệp ngày càng lớn."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: xu thế là tiến lên, không quay lại.","points":1},{"type":"short","level":"VD","q":"Phương tiện đường sắt chạy bằng hơi nước thời cận đại gọi là gì (ghi 4 chữ)?","answer":"Đầu máy xe lửa","explain":"Đầu máy xe lửa – mở ra kỉ nguyên đường sắt.","points":0.5},{"type":"short","level":"VDC","q":"Lần thứ hai được mệnh danh là thế kỉ của thép và gì (ghi 1 chữ)?","answer":"Điện","explain":"Thế kỉ của thép và điện.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Thiết bị kết nối con người toàn cầu trong lần thứ ba là","options":["A. internet.","B. điện thoại cố định duy nhất.","C. thư tay.","D. bồ câu."],"answer":"A","explain":"Internet kết nối toàn cầu, thông tin tức thì.","points":0.25},{"type":"mcq","level":"NB","q":"Vật liệu compozit có đặc tính","options":["A. nhẹ, bền, chịu nhiệt.","B. nặng, dễ vỡ.","C. không có ưu điểm.","D. chỉ để trang trí."],"answer":"A","explain":"Vật liệu mới (compozit, polyme) nhẹ, bền, chịu nhiệt – ứng dụng rộng.","points":0.25},{"type":"mcq","level":"TH","q":"Tự động hóa giúp con người","options":["A. thoát khỏi công việc nặng nhọc, nguy hiểm.","B. thất nghiệp hoàn toàn.","C. không làm gì.","D. vất vả hơn."],"answer":"A","explain":"Máy móc đảm nhận việc nặng nhọc, nguy hiểm; con người làm việc trí óc.","points":0.25},{"type":"mcq","level":"TH","q":"Cuộc chạy đua vũ trụ tác động đến lần thứ ba vì","options":["A. thúc đẩy nghiên cứu khoa học – kĩ thuật.","B. cản trở khoa học.","C. không liên quan.","D. làm nghèo các nước."],"answer":"A","explain":"Chạy đua vũ trang, chinh phục vũ trụ thúc đẩy đầu tư nghiên cứu, cho ra nhiều phát minh.","points":0.25},{"type":"mcq","level":"VD","q":"Mặt trái của chạy đua vũ trang trong lần thứ ba là","options":["A. công nghệ bị dùng cho vũ khí hủy diệt.","B. không có mặt trái.","C. chỉ có lợi.","D. khoa học ngừng phát triển."],"answer":"A","explain":"Nhiều thành tựu bị quân sự hóa, nguy cơ vũ khí hủy diệt – mặt trái của tiến bộ.","points":0.25},{"type":"mcq","level":"VDC","q":"Bài học sử dụng thành tựu khoa học là","options":["A. phục vụ hòa bình, phát triển, không quân sự hóa.","B. dùng cho chiến tranh.","C. giữ bí mật tuyệt đối.","D. không nghiên cứu nữa."],"answer":"A","explain":"Khoa học phải phục vụ hòa bình, đời sống – chống quân sự hóa, vũ khí hủy diệt.","points":0.25},{"type":"truefalse","level":"NB","q":"Nhận định sau đúng hay sai:","statements":["a) Internet kết nối toàn cầu.","b) Compozit nhẹ, bền.","c) Tự động hóa giảm việc nặng nhọc.","d) Chạy đua vũ trụ không tác động."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chạy đua vũ trụ thúc đẩy nghiên cứu.","points":1},{"type":"truefalse","level":"TH","q":"Nhận định sau đúng hay sai:","statements":["a) Công nghệ có thể bị quân sự hóa.","b) Khoa học phục vụ hòa bình.","c) Nên dùng khoa học cho chiến tranh.","d) Cần chống vũ khí hủy diệt."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: khoa học phục vụ hòa bình, phát triển.","points":1},{"type":"short","level":"VD","q":"Vật liệu mới nhẹ, bền, chịu nhiệt thời lần thứ ba có tên là gì (ghi 1 chữ)?","answer":"Compozit","explain":"Vật liệu compozit.","points":0.5},{"type":"short","level":"VDC","q":"Cuộc chạy đua nào sau WWII đã thúc đẩy nghiên cứu khoa học (ghi 2 chữ)?","answer":"Vũ trụ","explain":"Chạy đua vũ trụ (chinh phục vũ trụ).","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Xã hội số là xã hội mà","options":["A. mọi hoạt động gắn với công nghệ số.","B. không dùng công nghệ.","C. sống trong rừng.","D. không có internet."],"answer":"A","explain":"Xã hội số: học tập, làm việc, giao tiếp đều qua nền tảng số.","points":0.25},{"type":"mcq","level":"NB","q":"Học trực tuyến là biểu hiện của","options":["A. xã hội số.","B. xã hội nông nghiệp.","C. không liên quan công nghệ.","D. quay lại quá khứ."],"answer":"A","explain":"Học trực tuyến qua internet là biểu hiện của xã hội số.","points":0.25},{"type":"mcq","level":"TH","q":"Lợi ích của học trực tuyến là","options":["A. chủ động thời gian, tiếp cận tri thức rộng.","B. không cần học.","C. kém hiệu quả hoàn toàn.","D. tốn kém vô ích."],"answer":"A","explain":"Học trực tuyến: chủ động, kho tri thức mở, tiết kiệm đi lại.","points":0.25},{"type":"mcq","level":"TH","q":"Hạn chế của học trực tuyến là","options":["A. thiếu tương tác trực tiếp, cần tự giác cao.","B. không có hạn chế.","C. quá dễ.","D. không cần thiết bị."],"answer":"A","explain":"Học trực tuyến đòi hỏi tự giác, thiết bị, mạng ổn định; thiếu tương tác trực tiếp.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao khoảng cách số đáng lo ngại?","options":["A. Vì người không tiếp cận công nghệ bị tụt hậu.","B. Vì không ai dùng công nghệ.","C. Vì công nghệ rẻ.","D. Vì không có chênh lệch."],"answer":"A","explain":"Không tiếp cận số thì mất cơ hội học tập, việc làm – tụt hậu, bất bình đẳng gia tăng.","points":0.25},{"type":"mcq","level":"VDC","q":"Để thu hẹp khoảng cách số, cần","options":["A. phổ cập internet, hỗ trợ thiết bị, dạy kĩ năng số.","B. cấm internet.","C. không làm gì.","D. chỉ phát triển thành phố."],"answer":"A","explain":"Phổ cập hạ tầng, hỗ trợ thiết bị vùng khó, dạy kĩ năng số cho mọi người.","points":0.25},{"type":"truefalse","level":"NB","q":"Nhận định sau đúng hay sai:","statements":["a) Xã hội số gắn với công nghệ số.","b) Học trực tuyến là biểu hiện xã hội số.","c) Học trực tuyến cần tự giác.","d) Không có khoảng cách số."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: khoảng cách số là thách thức thật.","points":1},{"type":"truefalse","level":"TH","q":"Nhận định sau đúng hay sai:","statements":["a) Cần phổ cập internet.","b) Dạy kĩ năng số cho mọi người.","c) Nên cấm internet vùng khó.","d) Khoảng cách số gây tụt hậu."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần phổ cập, không cấm.","points":1},{"type":"short","level":"VD","q":"Hình thức học qua mạng internet gọi là học gì (ghi 2 chữ)?","answer":"Trực tuyến","explain":"Học trực tuyến.","points":0.5},{"type":"short","level":"VDC","q":"Xã hội mà mọi hoạt động gắn với công nghệ số gọi là xã hội gì (ghi 1 chữ)?","answer":"Số","explain":"Xã hội số.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Bốn cuộc cách mạng công nghiệp diễn ra theo trình tự","options":["A. 1 – 2 – 3 – 4.","B. 4 – 3 – 2 – 1.","C. 2 – 1 – 4 – 3.","D. 1 – 3 – 2 – 4."],"answer":"A","explain":"Trình tự lịch sử: lần 1, 2 (cận đại), lần 3, 4 (hiện đại).","points":0.25},{"type":"mcq","level":"NB","q":"Cuộc cách mạng gắn với máy hơi nước là lần thứ mấy?","options":["A. Lần thứ nhất.","B. Lần thứ hai.","C. Lần thứ ba.","D. Lần thứ tư."],"answer":"A","explain":"Máy hơi nước – lần thứ nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Cuộc cách mạng gắn với internet là lần thứ mấy?","options":["A. Lần thứ ba.","B. Lần thứ nhất.","C. Lần thứ hai.","D. Lần thứ tư."],"answer":"A","explain":"Internet ra đời trong lần thứ ba.","points":0.25},{"type":"mcq","level":"TH","q":"Cuộc cách mạng gắn với AI là lần thứ mấy?","options":["A. Lần thứ tư.","B. Lần thứ nhất.","C. Lần thứ hai.","D. Lần thứ ba."],"answer":"A","explain":"AI là công nghệ trung tâm của lần thứ tư.","points":0.25},{"type":"mcq","level":"VD","q":"Điểm chung xuyên suốt bốn cuộc cách mạng là","options":["A. đều nâng cao năng suất, giải phóng sức lao động.","B. đều dùng hơi nước.","C. đều không thay đổi xã hội.","D. đều chỉ ở một nước."],"answer":"A","explain":"Cả bốn đều cơ khí/tự động/trí tuệ hóa, nâng cao năng suất, biến đổi xã hội.","points":0.25},{"type":"mcq","level":"VDC","q":"Quy luật phát triển qua bốn cuộc cách mạng là","options":["A. công nghệ ngày càng cao, chu kì ngày càng rút ngắn.","B. ngày càng chậm.","C. đứng yên.","D. quay vòng."],"answer":"A","explain":"Từ thế kỉ (lần 1–2) đến vài thập kỉ (lần 3–4): công nghệ cao hơn, chu kì ngắn hơn.","points":0.25},{"type":"truefalse","level":"NB","q":"Nhận định sau đúng hay sai:","statements":["a) Trình tự: 1 – 2 – 3 – 4.","b) Máy hơi nước thuộc lần 1.","c) Internet thuộc lần 3.","d) AI thuộc lần 4."],"answer":["T","T","T","T"],"explain":"Cả bốn nhận định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Nhận định sau đúng hay sai:","statements":["a) Bốn lần đều nâng cao năng suất.","b) Chu kì cách mạng ngày càng ngắn.","c) Công nghệ ngày càng lạc hậu.","d) Cả bốn đều biến đổi xã hội."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: công nghệ ngày càng cao.","points":1},{"type":"short","level":"VD","q":"Chương 5 gồm tất cả mấy cuộc cách mạng công nghiệp (ghi số)?","answer":"4","explain":"Bốn cuộc cách mạng công nghiệp.","points":0.5},{"type":"short","level":"VDC","q":"Cuộc cách mạng gắn với động cơ điện, thép là lần thứ mấy (ghi số)?","answer":"2","explain":"Lần thứ hai – thế kỉ của thép và điện.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Chương 5 gồm các bài","options":["A. Bài 7 và Bài 8.","B. Bài 1 và Bài 2.","C. Bài 11 và Bài 12.","D. Bài 13 và Bài 14."],"answer":"A","explain":"Chương 5: Bài 7 (cận đại) và Bài 8 (hiện đại).","points":0.25},{"type":"mcq","level":"NB","q":"Bài 7 nghiên cứu thời kì","options":["A. cận đại.","B. hiện đại.","C. cổ đại.","D. nguyên thủy."],"answer":"A","explain":"Bài 7: thời kì cận đại (lần 1, 2).","points":0.25},{"type":"mcq","level":"TH","q":"Bài 8 nghiên cứu thời kì","options":["A. hiện đại.","B. cận đại.","C. cổ đại.","D. trung đại."],"answer":"A","explain":"Bài 8: thời kì hiện đại (lần 3, 4).","points":0.25},{"type":"mcq","level":"TH","q":"Ý nghĩa của việc ôn tập Chương 5 là","options":["A. hệ thống, so sánh bốn cuộc cách mạng, rút bài học.","B. học thuộc lòng.","C. không có ý nghĩa.","D. để thi cử duy nhất."],"answer":"A","explain":"Ôn tập giúp hệ thống, so sánh, rút bài học phát triển cho đất nước.","points":0.25},{"type":"mcq","level":"VD","q":"Bài học chung cho Việt Nam từ Chương 5 là","options":["A. chủ động nắm bắt công nghệ, phát triển bền vững.","B. đóng cửa tự cấp.","C. chờ đợi.","D. chỉ nhập khẩu."],"answer":"A","explain":"Chủ động tiếp thu, làm chủ công nghệ, phát triển bền vững, không tụt hậu.","points":0.25},{"type":"mcq","level":"VDC","q":"Là học sinh, em vận dụng Chương 5 vào thực tiễn bằng cách","options":["A. học tốt, rèn kĩ năng số, sáng tạo, có trách nhiệm.","B. nghiện game.","C. không học.","D. phá hoại thiết bị."],"answer":"A","explain":"Học tập, kĩ năng số, sáng tạo, dùng công nghệ có trách nhiệm – hành trang 4.0.","points":0.25},{"type":"truefalse","level":"NB","q":"Nhận định sau đúng hay sai:","statements":["a) Chương 5 gồm Bài 7, 8.","b) Bài 7 thời cận đại.","c) Bài 8 thời hiện đại.","d) Ôn tập không có ý nghĩa."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ôn tập giúp hệ thống, rút bài học.","points":1},{"type":"truefalse","level":"TH","q":"Nhận định sau đúng hay sai:","statements":["a) Việt Nam cần chủ động công nghệ.","b) Học sinh cần kĩ năng số.","c) Nên đóng cửa tự cấp.","d) Phát triển phải bền vững."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần chủ động hội nhập.","points":1},{"type":"short","level":"VD","q":"Bài 7 và Bài 8 cùng thuộc chương mấy (ghi số)?","answer":"5","explain":"Chương 5.","points":0.5},{"type":"short","level":"VDC","q":"Thế hệ trẻ cần làm chủ cái gì để đưa đất nước tiến lên (ghi 2 chữ)?","answer":"Công nghệ","explain":"Làm chủ công nghệ.","points":0.5}]}]}</script>
