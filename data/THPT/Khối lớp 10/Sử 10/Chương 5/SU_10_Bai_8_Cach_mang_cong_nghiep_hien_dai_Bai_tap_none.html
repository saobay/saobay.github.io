<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Cách mạng công nghiệp lần thứ ba diễn ra vào","options":["A. nửa sau thế kỉ XX.","B. cuối thế kỉ XVIII.","C. đầu thế kỉ XXI.","D. thế kỉ XIX."],"answer":"A","explain":"Lần thứ ba diễn ra từ nửa sau thế kỉ XX.","points":0.25},{"type":"mcq","level":"NB","q":"Lần thứ ba còn được gọi là","options":["A. cách mạng khoa học – kĩ thuật.","B. cách mạng hơi nước.","C. cách mạng điện khí.","D. cách mạng nông nghiệp."],"answer":"A","explain":"Lần thứ ba còn gọi là cách mạng khoa học – kĩ thuật hay cách mạng công nghệ thông tin.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao lần thứ ba bùng nổ sau Chiến tranh thế giới thứ hai?","options":["A. Vì khoa học phát triển nhảy vọt, nhu cầu khôi phục kinh tế cấp thiết.","B. Vì chiến tranh còn tiếp diễn.","C. Vì các nước không cần phát triển.","D. Vì khoa học bị cấm."],"answer":"A","explain":"Sau WWII, vật lí hạt nhân, sinh học phân tử, điện tử học phát triển mạnh; nhu cầu khôi phục kinh tế thúc đẩy ứng dụng.","points":0.25},{"type":"mcq","level":"TH","q":"Thành tựu nào thuộc lần thứ ba?","options":["A. Máy tính điện tử.","B. Máy hơi nước.","C. Động cơ điện.","D. Con thoi bay."],"answer":"A","explain":"Máy tính điện tử là thành tựu tiêu biểu của lần thứ ba; các đáp án còn lại thuộc hai lần trước.","points":0.25},{"type":"mcq","level":"VD","q":"Khoa học trở thành lực lượng sản xuất trực tiếp trong lần thứ ba vì","options":["A. phát minh dựa trực tiếp trên lí thuyết khoa học mới.","B. khoa học bị loại bỏ.","C. chỉ dựa vào kinh nghiệm.","D. không cần nghiên cứu."],"answer":"A","explain":"Các phát minh (hạt nhân, gen, điều khiển học) đều xuất phát từ lí thuyết khoa học mới – khoa học dẫn dắt sản xuất.","points":0.25},{"type":"mcq","level":"VDC","q":"Từ lần thứ ba, bài học cho phát triển kinh tế tri thức là","options":["A. đầu tư cho giáo dục, nghiên cứu khoa học là then chốt.","B. chỉ cần tài nguyên.","C. không cần tri thức.","D. sao chép là đủ."],"answer":"A","explain":"Kinh tế tri thức lấy tri thức, thông tin làm nguồn lực quan trọng nhất – phải đầu tư giáo dục, nghiên cứu.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lần thứ ba diễn ra nửa sau thế kỉ XX.","b) Máy tính điện tử thuộc lần thứ ba.","c) Lần thứ ba còn gọi là cách mạng khoa học – kĩ thuật.","d) Lần thứ ba dùng hơi nước làm chủ yếu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: lần thứ ba dựa trên tự động hóa, công nghệ thông tin, năng lượng mới.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Khoa học thành lực lượng sản xuất trực tiếp.","b) Cần đầu tư giáo dục, nghiên cứu.","c) Chỉ cần tài nguyên là đủ phát triển.","d) Tri thức thành nguồn lực quan trọng nhất."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: kinh tế tri thức cần tri thức, không chỉ tài nguyên.","points":1},{"type":"short","level":"VD","q":"Lần thứ ba còn được gọi là cách mạng khoa học và gì (ghi 2 chữ)?","answer":"Kĩ thuật","explain":"Cách mạng khoa học – kĩ thuật là tên gọi khác của lần thứ ba.","points":0.5},{"type":"short","level":"VDC","q":"Nền kinh tế lấy tri thức, thông tin làm nguồn lực quan trọng nhất có tên là kinh tế gì (ghi 2 chữ)?","answer":"Tri thức","explain":"Kinh tế tri thức – đặc trưng của thời kì sau lần thứ ba.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Internet ra đời là thành tựu của lần thứ mấy?","options":["A. Lần thứ ba.","B. Lần thứ nhất.","C. Lần thứ hai.","D. Lần thứ tư."],"answer":"A","explain":"Internet ra đời trong lần thứ ba, làm thay đổi thông tin liên lạc toàn cầu.","points":0.25},{"type":"mcq","level":"NB","q":"Năng lượng mới thời kì lần thứ ba gồm","options":["A. hạt nhân, mặt trời, gió.","B. than đá duy nhất.","C. dầu mỏ duy nhất.","D. củi duy nhất."],"answer":"A","explain":"Năng lượng hạt nhân, mặt trời, gió là các nguồn năng lượng mới của lần thứ ba.","points":0.25},{"type":"mcq","level":"TH","q":"Vai trò của tự động hóa trong lần thứ ba là","options":["A. thay sức người trong nhiều khâu, nâng cao năng suất.","B. không có vai trò.","C. làm giảm năng suất.","D. chỉ để trưng bày."],"answer":"A","explain":"Robot, dây chuyền tự động thay con người trong các khâu nặng nhọc, nguy hiểm, nâng cao năng suất.","points":0.25},{"type":"mcq","level":"TH","q":"Công nghệ sinh học lần thứ ba ứng dụng trong","options":["A. y học và nông nghiệp.","B. quân sự duy nhất.","C. không ứng dụng được.","D. thể thao duy nhất."],"answer":"A","explain":"Kĩ thuật gen, công nghệ tế bào ứng dụng trong chữa bệnh, tạo giống cây trồng, vật nuôi.","points":0.25},{"type":"mcq","level":"VD","q":"Internet đã thay đổi xã hội loài người như thế nào?","options":["A. thông tin lan truyền tức thì, thế giới thành “ngôi làng toàn cầu”.","B. không thay đổi gì.","C. làm con người cô lập.","D. chỉ phục vụ quân đội."],"answer":"A","explain":"Internet rút ngắn khoảng cách, thông tin tức thì toàn cầu – tiền đề của toàn cầu hóa sâu rộng.","points":0.25},{"type":"mcq","level":"VDC","q":"Từ sự phát triển internet, bài học cho Việt Nam là","options":["A. phổ cập internet, phát triển chính phủ số, kinh tế số.","B. hạn chế internet.","C. không cần công nghệ.","D. chỉ dùng thư tay."],"answer":"A","explain":"Việt Nam đang đẩy mạnh chuyển đổi số: phổ cập internet, phát triển chính phủ số, kinh tế số.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Internet là thành tựu lần thứ ba.","b) Năng lượng mới gồm hạt nhân, mặt trời, gió.","c) Tự động hóa nâng cao năng suất.","d) Công nghệ sinh học không có ứng dụng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: công nghệ sinh học ứng dụng rộng trong y học, nông nghiệp.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Internet tạo nên ngôi làng toàn cầu.","b) Việt Nam cần phổ cập internet.","c) Nên hạn chế internet.","d) Tự động hóa thay việc nặng nhọc."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần phổ cập và phát triển, không hạn chế.","points":1},{"type":"short","level":"VD","q":"Mạng lưới kết nối toàn cầu ra đời trong lần thứ ba có tên là gì (ghi 1 chữ)?","answer":"Internet","explain":"Internet – thành tựu công nghệ thông tin tiêu biểu của lần thứ ba.","points":0.5},{"type":"short","level":"VDC","q":"Kĩ thuật nào ứng dụng trong y học, nông nghiệp thời lần thứ ba (ghi 4 chữ, bắt đầu bằng “công nghệ”)?","answer":"Công nghệ sinh học","explain":"Công nghệ sinh học: kĩ thuật gen, công nghệ tế bào.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Cách mạng công nghiệp lần thứ tư bắt đầu từ","options":["A. đầu thế kỉ XXI.","B. cuối thế kỉ XVIII.","C. nửa sau thế kỉ XX.","D. thế kỉ XIX."],"answer":"A","explain":"Lần thứ tư bùng nổ từ đầu thế kỉ XXI với công nghệ số.","points":0.25},{"type":"mcq","level":"NB","q":"Thuật ngữ “Công nghiệp 4.0” được nêu ra lần đầu ở","options":["A. Đức năm 2011.","B. Anh năm 1769.","C. Mỹ năm 1945.","D. Pháp năm 1789."],"answer":"A","explain":"Thuật ngữ “Công nghiệp 4.0” ra đời tại Đức năm 2011.","points":0.25},{"type":"mcq","level":"TH","q":"Công nghệ nào KHÔNG thuộc lần thứ tư?","options":["A. Máy hơi nước.","B. Trí tuệ nhân tạo.","C. In 3D.","D. Chuỗi khối."],"answer":"A","explain":"Máy hơi nước thuộc lần thứ nhất; AI, in 3D, blockchain thuộc lần thứ tư.","points":0.25},{"type":"mcq","level":"TH","q":"Internet vạn vật (IoT) có nghĩa là","options":["A. mọi thiết bị kết nối internet, trao đổi dữ liệu với nhau.","B. internet chỉ cho máy tính.","C. không có kết nối.","D. internet bị cấm."],"answer":"A","explain":"IoT: mọi thiết bị (tủ lạnh, ô tô, nhà máy...) kết nối internet và trao đổi dữ liệu.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao lần thứ tư được gọi là cuộc cách mạng số?","options":["A. Vì mọi quy trình được số hóa, kết nối, thông minh hóa.","B. Vì chỉ dùng số học.","C. Vì không có công nghệ.","D. Vì quay lại thủ công."],"answer":"A","explain":"Số hóa toàn bộ, kết nối vạn vật, AI thông minh – nên gọi là cách mạng số.","points":0.25},{"type":"mcq","level":"VDC","q":"Đặc trưng hợp nhất ba thế giới trong lần thứ tư là","options":["A. thực – số – sinh học.","B. đất – nước – lửa.","C. quá khứ – hiện tại – tương lai.","D. nông – công – dịch vụ."],"answer":"A","explain":"Lần thứ tư hợp nhất thế giới thực, thế giới số và thế giới sinh học.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lần thứ tư bắt đầu đầu thế kỉ XXI.","b) Công nghiệp 4.0 ra đời ở Đức năm 2011.","c) AI, in 3D thuộc lần thứ tư.","d) Máy hơi nước thuộc lần thứ tư."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: máy hơi nước thuộc lần thứ nhất.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) IoT kết nối mọi thiết bị qua internet.","b) Lần thứ tư số hóa, kết nối, thông minh hóa.","c) Ba thế giới hợp nhất: thực – số – sinh học.","d) Lần thứ tư không có công nghệ mới."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: lần thứ tư có nhiều công nghệ mới (AI, IoT, Big Data...).","points":1},{"type":"short","level":"VD","q":"Công nghệ giúp máy móc học hỏi, nhận diện hình ảnh, giọng nói có tên viết tắt là gì (ghi 2 chữ cái)?","answer":"AI","explain":"AI (trí tuệ nhân tạo) – công nghệ trung tâm của lần thứ tư.","points":0.5},{"type":"short","level":"VDC","q":"Thuật ngữ “Công nghiệp 4.0” được nêu ra lần đầu tại nước nào (ghi 1 chữ)?","answer":"Đức","explain":"Đức nêu ra thuật ngữ “Công nghiệp 4.0” năm 2011.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Dữ liệu lớn (Big Data) được dùng để","options":["A. phân tích, dự báo, tối ưu sản xuất.","B. lưu trữ không dùng.","C. xóa bỏ dữ liệu.","D. làm chậm máy tính."],"answer":"A","explain":"Big Data giúp phân tích khối lượng dữ liệu khổng lồ để dự báo xu hướng, tối ưu.","points":0.25},{"type":"mcq","level":"NB","q":"In 3D có ưu điểm","options":["A. sản xuất linh hoạt, cá thể hóa sản phẩm.","B. chỉ sản xuất hàng loạt.","C. không tạo được vật thể.","D. tốn kém vô ích."],"answer":"A","explain":"In 3D tạo vật thể từ mô hình số, sản xuất linh hoạt theo đơn chiếc, cá thể hóa.","points":0.25},{"type":"mcq","level":"TH","q":"Robot thông minh khác robot lần thứ ba ở","options":["A. có AI, cộng tác với con người, xử lí tình huống phức tạp.","B. không khác gì.","C. kém thông minh hơn.","D. không hoạt động được."],"answer":"A","explain":"Robot 4.0 tích hợp AI, học hỏi, cộng tác với con người trong môi trường phức tạp.","points":0.25},{"type":"mcq","level":"TH","q":"Chuỗi khối (Blockchain) ứng dụng trong","options":["A. tài chính, logistics với giao dịch an toàn, minh bạch.","B. nông nghiệp duy nhất.","C. không ứng dụng được.","D. thể thao duy nhất."],"answer":"A","explain":"Blockchain lưu trữ, giao dịch an toàn, minh bạch – ứng dụng trong tài chính, logistics.","points":0.25},{"type":"mcq","level":"VD","q":"Công nghệ nano là công nghệ","options":["A. chế tạo ở cấp độ phân tử, nguyên tử.","B. chế tạo đồ vật khổng lồ.","C. không có thật.","D. chỉ trong phim ảnh."],"answer":"A","explain":"Công nghệ nano thao tác ở cấp độ phân tử, nguyên tử, tạo vật liệu tính năng vượt trội.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong lần thứ tư, vai trò của con người chuyển sang","options":["A. sáng tạo, quản lí, làm việc cùng máy thông minh.","B. biến mất hoàn toàn.","C. chỉ làm việc chân tay.","D. không cần học tập."],"answer":"A","explain":"Máy làm việc lặp lại; con người tập trung sáng tạo, quản lí – cần học tập suốt đời.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Big Data dùng để phân tích, dự báo.","b) In 3D sản xuất linh hoạt.","c) Robot 4.0 có AI.","d) Blockchain không có ứng dụng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: blockchain ứng dụng trong tài chính, logistics.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Công nghệ nano ở cấp phân tử.","b) Con người cần sáng tạo, học suốt đời.","c) Con người sẽ biến mất.","d) Blockchain giao dịch minh bạch."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: con người chuyển sang vai trò sáng tạo, quản lí.","points":1},{"type":"short","level":"VD","q":"Công nghệ tạo vật thể ba chiều từ mô hình số có tên là in gì (ghi 1 chữ)?","answer":"3D","explain":"In 3D – công nghệ sản xuất linh hoạt của lần thứ tư.","points":0.5},{"type":"short","level":"VDC","q":"Công nghệ lưu trữ, giao dịch an toàn, minh bạch trong tài chính có tên là chuỗi gì (ghi 1 chữ)?","answer":"Khối","explain":"Chuỗi khối (Blockchain).","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Tác động tích cực của cách mạng công nghiệp hiện đại là","options":["A. năng suất vượt bậc, đời sống nâng cao.","B. năng suất giảm.","C. đời sống thụt lùi.","D. không có tác động."],"answer":"A","explain":"Năng suất tăng vượt bậc, đời sống vật chất tinh thần được nâng cao.","points":0.25},{"type":"mcq","level":"NB","q":"Thất nghiệp cơ cấu xảy ra vì","options":["A. robot, AI thay thế lao động giản đơn.","B. công nhân lười biếng.","C. không có nhà máy.","D. dân số giảm."],"answer":"A","explain":"Tự động hóa, AI thay thế lao động giản đơn – người lao động phải học nghề mới.","points":0.25},{"type":"mcq","level":"TH","q":"Khoảng cách số là","options":["A. chênh lệch tiếp cận công nghệ giữa các nước, nhóm dân cư.","B. khoảng cách địa lí.","C. không tồn tại.","D. chênh lệch giàu nghèo duy nhất."],"answer":"A","explain":"Khoảng cách số: chênh lệch trong tiếp cận, sử dụng công nghệ số.","points":0.25},{"type":"mcq","level":"TH","q":"Thách thức an ninh mạng gồm","options":["A. tội phạm công nghệ cao, rò rỉ dữ liệu, tin giả.","B. không có thách thức.","C. chỉ mất điện.","D. chỉ hỏng máy."],"answer":"A","explain":"Tội phạm mạng, rò rỉ dữ liệu cá nhân, tin giả là thách thức an ninh mạng.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao cách mạng công nghiệp thúc đẩy toàn cầu hóa?","options":["A. Vì công nghệ thông tin, giao thông rút ngắn khoảng cách.","B. Vì các nước đóng cửa.","C. Vì không giao lưu.","D. Vì chiến tranh."],"answer":"A","explain":"Internet, giao thông hiện đại giúp giao lưu kinh tế, văn hóa toàn cầu sâu rộng.","points":0.25},{"type":"mcq","level":"VDC","q":"Để hạn chế tác động tiêu cực, các nước cần","options":["A. phát triển bền vững, đào tạo lại lao động, bảo đảm an ninh mạng.","B. từ chối công nghệ.","C. đóng cửa biên giới.","D. không cần làm gì."],"answer":"A","explain":"Phát triển bền vững, đào tạo lại lao động, an ninh mạng – ứng phó tác động tiêu cực.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Năng suất tăng vượt bậc.","b) Thất nghiệp cơ cấu do robot thay lao động.","c) Có thách thức an ninh mạng.","d) Không có tác động tiêu cực."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: có thất nghiệp cơ cấu, khoảng cách số, an ninh mạng...","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Công nghệ thúc đẩy toàn cầu hóa.","b) Cần đào tạo lại lao động.","c) Nên từ chối công nghệ.","d) Cần bảo đảm an ninh mạng."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần chủ động ứng dụng, không từ chối.","points":1},{"type":"short","level":"VD","q":"Chênh lệch tiếp cận công nghệ giữa các nước, nhóm dân cư gọi là khoảng cách gì (ghi 1 chữ)?","answer":"Số","explain":"Khoảng cách số (digital divide).","points":0.5},{"type":"short","level":"VDC","q":"Hiện tượng robot thay thế lao động giản đơn gây ra loại thất nghiệp nào (ghi 2 chữ)?","answer":"Cơ cấu","explain":"Thất nghiệp cơ cấu – thách thức của tự động hóa.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Kinh tế số là","options":["A. nền kinh tế dựa trên công nghệ số, dữ liệu.","B. nền kinh tế không dùng công nghệ.","C. nền kinh tế nông nghiệp.","D. nền kinh tế đóng cửa."],"answer":"A","explain":"Kinh tế số: các hoạt động kinh tế dựa trên công nghệ số, dữ liệu (thương mại điện tử...).","points":0.25},{"type":"mcq","level":"NB","q":"Việt Nam đang đẩy mạnh","options":["A. chuyển đổi số quốc gia.","B. từ chối công nghệ.","C. đóng cửa internet.","D. quay lại thủ công."],"answer":"A","explain":"Việt Nam đẩy mạnh chuyển đổi số: chính phủ số, kinh tế số, xã hội số.","points":0.25},{"type":"mcq","level":"TH","q":"Cơ hội của Việt Nam trong lần thứ tư là","options":["A. thu hút đầu tư công nghệ cao, phát triển kinh tế số.","B. không có cơ hội.","C. chỉ làm gia công.","D. tụt hậu chắc chắn."],"answer":"A","explain":"Chuyển đổi số mở cơ hội thu hút đầu tư công nghệ cao, phát triển kinh tế số, nâng vị thế.","points":0.25},{"type":"mcq","level":"TH","q":"Thách thức lớn nhất của Việt Nam là","options":["A. nguồn nhân lực chất lượng cao còn hạn chế.","B. dân số quá ít.","C. không có điện.","D. không có nhu cầu."],"answer":"A","explain":"Trình độ công nghệ, nhân lực chất lượng cao còn hạn chế – thách thức không tụt hậu.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao học sinh cần học tập suốt đời trong thời đại 4.0?","options":["A. Vì công nghệ thay đổi nhanh, nghề nghiệp biến đổi liên tục.","B. Vì không cần học.","C. Vì trường học biến mất.","D. Vì máy làm hết."],"answer":"A","explain":"Công nghệ thay đổi nhanh, nhiều nghề mất đi, nghề mới xuất hiện – phải học suốt đời.","points":0.25},{"type":"mcq","level":"VDC","q":"Bài học phát triển cho Việt Nam từ các cuộc cách mạng công nghiệp là","options":["A. chủ động hội nhập, phát triển nhanh gắn bền vững, công bằng.","B. đóng cửa bảo hộ.","C. chỉ trông chờ nước ngoài.","D. phát triển bằng mọi giá."],"answer":"A","explain":"Chủ động hội nhập, đầu tư giáo dục – khoa học, phát triển bền vững, công bằng, bảo vệ môi trường.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Kinh tế số dựa trên công nghệ số.","b) Việt Nam đẩy mạnh chuyển đổi số.","c) Việt Nam từ chối công nghệ.","d) Nhân lực chất lượng cao còn hạn chế."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: Việt Nam chủ động chuyển đổi số.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cần học tập suốt đời thời 4.0.","b) Phát triển phải gắn bền vững.","c) Nên đóng cửa bảo hộ.","d) Chuyển đổi số là cơ hội."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần chủ động hội nhập.","points":1},{"type":"short","level":"VD","q":"Chương trình quốc gia Việt Nam đang đẩy mạnh có tên là chuyển đổi gì (ghi 1 chữ)?","answer":"Số","explain":"Chuyển đổi số quốc gia: chính phủ số, kinh tế số, xã hội số.","points":0.5},{"type":"short","level":"VDC","q":"Trong thời đại 4.0, người lao động cần học tập như thế nào (ghi 2 chữ)?","answer":"Suốt đời","explain":"Học tập suốt đời – yêu cầu của thời đại công nghệ thay đổi nhanh.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Điểm khác biệt lớn nhất giữa lần thứ tư và các lần trước là","options":["A. số hóa, kết nối, thông minh dựa trên dữ liệu.","B. dùng hơi nước.","C. không có công nghệ.","D. quay lại thủ công."],"answer":"A","explain":"Lần thứ tư: số hóa toàn bộ, kết nối vạn vật, AI thông minh – khác hẳn cơ khí hóa trước đây.","points":0.25},{"type":"mcq","level":"NB","q":"Thiết bị nào thể hiện IoT trong đời sống?","options":["A. Nhà thông minh điều khiển qua điện thoại.","B. Bàn ghế gỗ.","C. Xe đạp thường.","D. Đèn dầu."],"answer":"A","explain":"Nhà thông minh: các thiết bị kết nối internet, điều khiển từ xa – ví dụ IoT.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao dữ liệu được gọi là “dầu mỏ mới”?","options":["A. Vì là nguồn lực quý giá của kinh tế số.","B. Vì dùng để đốt.","C. Vì không có giá trị.","D. Vì gây ô nhiễm."],"answer":"A","explain":"Dữ liệu là nguồn lực trung tâm tạo giá trị trong kinh tế số – như dầu mỏ với công nghiệp.","points":0.25},{"type":"mcq","level":"TH","q":"AI ứng dụng trong đời sống qua","options":["A. trợ lí ảo, nhận diện khuôn mặt, gợi ý nội dung.","B. không ứng dụng được.","C. chỉ trong phim.","D. thay con người hoàn toàn."],"answer":"A","explain":"Trợ lí ảo, nhận diện khuôn mặt, gợi ý phim/nhạc – AI hiện diện trong đời sống.","points":0.25},{"type":"mcq","level":"VD","q":"Mối quan hệ giữa lần thứ ba và lần thứ tư là","options":["A. lần thứ tư kế thừa, phát triển từ nền tảng số của lần thứ ba.","B. không liên quan.","C. lần thứ tư phủ nhận lần thứ ba.","D. lần thứ ba cao hơn."],"answer":"A","explain":"Máy tính, internet (lần 3) là nền tảng để AI, IoT, Big Data (lần 4) bùng nổ.","points":0.25},{"type":"mcq","level":"VDC","q":"Từ quan hệ kế thừa giữa các lần, bài học đổi mới là","options":["A. nắm vững nền tảng cũ để sáng tạo cái mới.","B. bỏ hết cái cũ.","C. không cần nền tảng.","D. chỉ sao chép."],"answer":"A","explain":"Đổi mới phải trên nền tảng tri thức, công nghệ đã có – kế thừa để phát triển.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lần thứ tư số hóa, kết nối, thông minh.","b) Nhà thông minh là ví dụ IoT.","c) Dữ liệu là nguồn lực kinh tế số.","d) AI không ứng dụng trong đời sống."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: AI hiện diện qua trợ lí ảo, nhận diện khuôn mặt...","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lần thứ tư kế thừa lần thứ ba.","b) Cần nắm nền tảng để sáng tạo.","c) Nên bỏ hết cái cũ.","d) Internet là nền tảng của AI, IoT."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: đổi mới trên nền tảng kế thừa.","points":1},{"type":"short","level":"VD","q":"Dữ liệu được ví là loại “dầu mỏ” như thế nào (ghi 1 chữ)?","answer":"Mới","explain":"Dữ liệu – “dầu mỏ mới” của kinh tế số.","points":0.5},{"type":"short","level":"VDC","q":"Mạng lưới các thiết bị kết nối internet có tên viết tắt là gì (ghi 3 chữ cái)?","answer":"IoT","explain":"IoT (Internet of Things) – Internet vạn vật.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Chính phủ số là","options":["A. chính quyền ứng dụng công nghệ số phục vụ người dân.","B. chính quyền không dùng công nghệ.","C. chính quyền đóng cửa.","D. chính quyền trên giấy."],"answer":"A","explain":"Chính phủ số: dịch vụ công trực tuyến, phục vụ người dân nhanh, minh bạch.","points":0.25},{"type":"mcq","level":"NB","q":"Thương mại điện tử thuộc","options":["A. kinh tế số.","B. kinh tế nông nghiệp.","C. kinh tế đóng cửa.","D. không thuộc kinh tế."],"answer":"A","explain":"Thương mại điện tử là bộ phận quan trọng của kinh tế số.","points":0.25},{"type":"mcq","level":"TH","q":"Lợi ích của dịch vụ công trực tuyến là","options":["A. nhanh, minh bạch, giảm phiền hà cho dân.","B. chậm hơn.","C. tốn kém hơn.","D. không có lợi ích."],"answer":"A","explain":"Dịch vụ công trực tuyến giúp người dân làm thủ tục nhanh, minh bạch, giảm đi lại.","points":0.25},{"type":"mcq","level":"TH","q":"Nguy cơ của tin giả trên mạng là","options":["A. gây hoang mang, mất niềm tin xã hội.","B. không có nguy cơ.","C. chỉ gây cười.","D. có lợi cho xã hội."],"answer":"A","explain":"Tin giả lan nhanh gây hoang mang, chia rẽ – cần kĩ năng kiểm chứng thông tin.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao cần bảo vệ dữ liệu cá nhân?","options":["A. Vì rò rỉ dữ liệu dẫn đến lừa đảo, xâm phạm riêng tư.","B. Vì dữ liệu không quan trọng.","C. Vì ai cũng công khai.","D. Vì không có rủi ro."],"answer":"A","explain":"Rò rỉ dữ liệu cá nhân bị lợi dụng lừa đảo, xâm phạm riêng tư – phải bảo vệ.","points":0.25},{"type":"mcq","level":"VDC","q":"Là học sinh thời 4.0, em cần","options":["A. dùng công nghệ thông minh, an toàn, có trách nhiệm.","B. nghiện mạng xã hội.","C. tin mọi tin trên mạng.","D. công khai mọi thông tin cá nhân."],"answer":"A","explain":"Dùng công nghệ phục vụ học tập, kiểm chứng tin, bảo vệ dữ liệu cá nhân.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chính phủ số phục vụ dân trực tuyến.","b) Thương mại điện tử thuộc kinh tế số.","c) Dịch vụ công trực tuyến nhanh, minh bạch.","d) Tin giả không gây hại."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: tin giả gây hoang mang, mất niềm tin.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cần bảo vệ dữ liệu cá nhân.","b) Dùng công nghệ có trách nhiệm.","c) Nên tin mọi tin trên mạng.","d) Cần kiểm chứng thông tin."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: phải kiểm chứng, không tin mù quáng.","points":1},{"type":"short","level":"VD","q":"Hình thức mua bán qua mạng thuộc kinh tế số có tên là thương mại gì (ghi 2 chữ)?","answer":"Điện tử","explain":"Thương mại điện tử.","points":0.5},{"type":"short","level":"VDC","q":"Thông tin sai sự thật lan truyền trên mạng gọi là tin gì (ghi 1 chữ)?","answer":"Giả","explain":"Tin giả (fake news) – cần kiểm chứng trước khi tin, chia sẻ.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Bài 8 học về các cuộc cách mạng công nghiệp thời kì nào?","options":["A. Hiện đại.","B. Cận đại.","C. Cổ đại.","D. Nguyên thủy."],"answer":"A","explain":"Bài 8: Các cuộc cách mạng công nghiệp thời kì hiện đại (lần thứ ba và thứ tư).","points":0.25},{"type":"mcq","level":"NB","q":"Thành tựu nào KHÔNG thuộc lần thứ ba?","options":["A. Trí tuệ nhân tạo.","B. Máy tính điện tử.","C. Internet.","D. Công nghệ sinh học."],"answer":"A","explain":"AI thuộc lần thứ tư; máy tính, internet, công nghệ sinh học thuộc lần thứ ba.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm giống nhau của lần thứ ba và thứ tư là","options":["A. đều dựa trên khoa học, nâng cao năng suất vượt bậc.","B. đều dùng hơi nước.","C. đều không dùng điện.","D. đều thủ công."],"answer":"A","explain":"Cả hai đều dựa trên thành tựu khoa học, tự động hóa, nâng cao năng suất.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải học về cách mạng công nghiệp hiện đại?","options":["A. Để chủ động thích ứng, không tụt hậu thời 4.0.","B. Để thi cử.","C. Không cần thiết.","D. Để sống ảo."],"answer":"A","explain":"Hiểu thời đại 4.0 giúp mỗi người chủ động học tập, thích ứng, nắm cơ hội.","points":0.25},{"type":"mcq","level":"VD","q":"Tổng kết Bài 8, động lực của hai cuộc cách mạng hiện đại là","options":["A. nhu cầu phát triển kinh tế tri thức, nâng cao năng lực cạnh tranh.","B. sở thích cá nhân.","C. chiến tranh duy nhất.","D. ngẫu nhiên."],"answer":"A","explain":"Nhu cầu phát triển kinh tế tri thức, cạnh tranh toàn cầu thúc đẩy đổi mới không ngừng.","points":0.25},{"type":"mcq","level":"VDC","q":"Việt Nam cần làm gì để không tụt hậu trong lần thứ tư?","options":["A. đầu tư giáo dục, khoa học, chuyển đổi số toàn diện.","B. đóng cửa.","C. chờ nước khác.","D. chỉ phát triển du lịch."],"answer":"A","explain":"Đầu tư giáo dục – khoa học – công nghệ, chuyển đổi số toàn diện là con đường không tụt hậu.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bài 8 học thời kì hiện đại.","b) AI thuộc lần thứ tư.","c) Hai lần đều dựa trên khoa học.","d) Cần học để thích ứng 4.0."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Động lực là kinh tế tri thức.","b) Việt Nam cần chuyển đổi số.","c) Nên đóng cửa.","d) Cần đầu tư giáo dục, khoa học."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần chủ động hội nhập.","points":1},{"type":"short","level":"VD","q":"Bài 8 gồm hai cuộc cách mạng công nghiệp lần thứ ba và thứ mấy (ghi số)?","answer":"4","explain":"Bài 8: lần thứ ba và lần thứ tư thời kì hiện đại.","points":0.5},{"type":"short","level":"VDC","q":"Nền kinh tế dựa trên công nghệ số, dữ liệu có tên là kinh tế gì (ghi 1 chữ)?","answer":"Số","explain":"Kinh tế số.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Ôn tập Chương 5 gồm các bài nào?","options":["A. Bài 7 và Bài 8.","B. Bài 5 và Bài 6.","C. Bài 1 và Bài 2.","D. Bài 11 và Bài 12."],"answer":"A","explain":"Chương 5 gồm Bài 7 (cận đại) và Bài 8 (hiện đại).","points":0.25},{"type":"mcq","level":"NB","q":"Sắp xếp đúng trình tự các cuộc cách mạng công nghiệp:","options":["A. Hơi nước – điện – tự động hóa – số hóa.","B. Số hóa – hơi nước – điện – tự động hóa.","C. Điện – hơi nước – số hóa – tự động hóa.","D. Tự động hóa – số hóa – hơi nước – điện."],"answer":"A","explain":"Trình tự: hơi nước (1), điện (2), tự động hóa (3), số hóa – AI (4).","points":0.25},{"type":"mcq","level":"TH","q":"Năng lượng đặc trưng của từng lần là","options":["A. hơi nước – điện – đa dạng – số hóa năng lượng.","B. đều là hơi nước.","C. đều là điện.","D. không cần năng lượng."],"answer":"A","explain":"Lần 1: hơi nước; lần 2: điện; lần 3: năng lượng mới đa dạng; lần 4: năng lượng thông minh, xanh.","points":0.25},{"type":"mcq","level":"TH","q":"Xu hướng chung của bốn cuộc cách mạng là","options":["A. năng suất ngày càng cao, con người ngày càng rảnh tay sáng tạo.","B. năng suất giảm dần.","C. con người vất vả hơn.","D. không có xu hướng."],"answer":"A","explain":"Máy móc thay dần lao động chân tay, con người chuyển sang sáng tạo, quản lí.","points":0.25},{"type":"mcq","level":"VD","q":"So sánh vai trò khoa học qua bốn lần, nhận xét đúng là","options":["A. khoa học ngày càng trở thành lực lượng sản xuất trực tiếp.","B. khoa học ngày càng mờ nhạt.","C. khoa học không thay đổi.","D. khoa học bị loại bỏ."],"answer":"A","explain":"Từ kinh nghiệm (lần 1) đến lí thuyết dẫn dắt (lần 2, 3) rồi hợp nhất với sản xuất (lần 4).","points":0.25},{"type":"mcq","level":"VDC","q":"Thông điệp lớn nhất của Chương 5 với thế hệ trẻ Việt Nam là","options":["A. học tập, sáng tạo, làm chủ công nghệ để đưa đất nước tiến lên.","B. công nghệ là việc của người khác.","C. không cần học.","D. chỉ hưởng thụ thành quả."],"answer":"A","explain":"Thế hệ trẻ phải học tập, sáng tạo, làm chủ công nghệ – đưa đất nước tiến lên trong 4.0.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chương 5 gồm Bài 7, Bài 8.","b) Trình tự: hơi nước – điện – tự động hóa – số hóa.","c) Xu hướng: năng suất ngày càng cao.","d) Khoa học ngày càng mờ nhạt."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: khoa học ngày càng thành lực lượng sản xuất trực tiếp.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trẻ em cần học tập, sáng tạo.","b) Làm chủ công nghệ đưa đất nước tiến lên.","c) Công nghệ là việc của người khác.","d) Cần thích ứng thời 4.0."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: công nghệ là việc của mọi người, nhất là thế hệ trẻ.","points":1},{"type":"short","level":"VD","q":"Chương 5 có tất cả mấy cuộc cách mạng công nghiệp (ghi số)?","answer":"4","explain":"Bốn cuộc: lần 1 (hơi nước), 2 (điện), 3 (tự động hóa), 4 (số hóa, AI).","points":0.5},{"type":"short","level":"VDC","q":"Cuộc cách mạng gắn với trí tuệ nhân tạo, dữ liệu lớn là lần thứ mấy (ghi số)?","answer":"4","explain":"Lần thứ tư – cách mạng số.","points":0.5}]}]}</script>
