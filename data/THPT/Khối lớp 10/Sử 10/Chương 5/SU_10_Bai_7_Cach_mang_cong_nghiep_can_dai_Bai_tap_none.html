<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Cách mạng công nghiệp lần thứ nhất diễn ra đầu tiên ở nước nào?","options":["A. Anh.","B. Pháp.","C. Đức.","D. Mỹ."],"answer":"A","explain":"Cách mạng công nghiệp lần thứ nhất diễn ra đầu tiên ở Anh vào cuối thế kỉ XVIII, sau đó lan ra châu Âu và Bắc Mỹ.","points":0.25},{"type":"mcq","level":"NB","q":"Ai là người phát minh ra máy hơi nước năm 1784?","options":["A. Giêm Oát.","B. Giôn Cay.","C. Hen-ri Cớt.","D. Rô-bớt Phon-tơn."],"answer":"A","explain":"Năm 1784, Giêm Oát (James Watt) phát minh ra máy hơi nước – thành tựu quan trọng nhất của cách mạng công nghiệp lần thứ nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Tiền đề nào KHÔNG dẫn đến cách mạng công nghiệp lần thứ nhất ở Anh?","options":["A. Nước Anh nghèo tài nguyên thiên nhiên.","B. Cách mạng tư sản thành công, tích lũy tư bản lớn.","C. Tiến bộ kĩ thuật nông nghiệp, thủ công nghiệp.","D. Nhu cầu cơ khí hóa ngành dệt."],"answer":"A","explain":"Nước Anh giàu tài nguyên (than đá, quặng sắt) – đó là điều kiện thuận lợi, không phải khó khăn.","points":0.25},{"type":"mcq","level":"TH","q":"Năm 1804, Ri-chác Tơ-re-vi-thích chế tạo thành công","options":["A. đầu máy xe lửa chạy trên đường ray.","B. máy bay.","C. điện thoại.","D. máy tính."],"answer":"A","explain":"Năm 1804, Ri-chác Tơ-re-vi-thích chế tạo thành công đầu máy xe lửa chạy trên đường ray đầu tiên.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao máy hơi nước được coi là thành tựu quan trọng nhất của cách mạng công nghiệp lần thứ nhất?","options":["A. Vì giúp nhà máy thoát khỏi phụ thuộc vào sức nước, sức gió, đặt ở nhiều nơi.","B. Vì chỉ dùng trong giao thông.","C. Vì rẻ nhất.","D. Vì không cần nhiên liệu."],"answer":"A","explain":"Nhờ máy hơi nước, nhà máy có thể xây dựng ở nhiều nơi, sản xuất không còn phụ thuộc vào vị trí sông suối hay sức gió.","points":0.25},{"type":"mcq","level":"VDC","q":"Điểm khác nhau cơ bản giữa sản xuất công trường thủ công và nhà máy cơ khí là","options":["A. nhà máy dùng máy móc, phân công lao động sâu, năng suất vượt trội.","B. không có khác nhau.","C. công trường thủ công năng suất cao hơn.","D. nhà máy không cần công nhân."],"answer":"A","explain":"Nhà máy cơ khí thay sức người bằng máy móc, tổ chức sản xuất quy mô lớn, năng suất vượt trội so với thủ công.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cách mạng công nghiệp lần thứ nhất diễn ra đầu tiên ở Anh.","b) Giêm Oát phát minh máy hơi nước năm 1784.","c) Cách mạng công nghiệp lần thứ nhất bắt đầu từ ngành dệt.","d) Máy hơi nước ra đời ở Pháp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: máy hơi nước của Giêm Oát ra đời ở Anh.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Năm 1733, Giôn Cay sáng tạo con thoi bay.","b) Năm 1764, Giêm Ha-gri-vơ sáng tạo máy kéo sợi Gien-ni.","c) Năm 1807, Rô-bớt Phon-tơn chế tạo tàu thủy hơi nước.","d) Năm 1784, Hen-ri Cớt phát minh điện thoại."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: năm 1784 Hen-ri Cớt phát minh lò luyện quặng phương pháp Put-đinh; điện thoại ra đời muộn hơn.","points":1},{"type":"short","level":"VD","q":"Phát minh nào năm 1784 được coi là biểu tượng của cách mạng công nghiệp lần thứ nhất (ghi 3 chữ)?","answer":"Máy hơi nước","explain":"Máy hơi nước của Giêm Oát (1784) – thành tựu quan trọng nhất của cách mạng công nghiệp lần thứ nhất.","points":0.5},{"type":"short","level":"VDC","q":"Ngành công nghiệp nào đặt ra nhu cầu cơ khí hóa, mở đầu cách mạng công nghiệp ở Anh (ghi 2 chữ)?","answer":"Ngành dệt","explain":"Sự phát triển của ngành dệt đặt ra nhu cầu cải tiến kĩ thuật, cơ khí hóa – khởi đầu cách mạng công nghiệp.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Cách mạng công nghiệp lần thứ hai diễn ra trong khoảng thời gian nào?","options":["A. Giữa thế kỉ XIX đến năm 1914.","B. Cuối thế kỉ XVIII.","C. Nửa sau thế kỉ XX.","D. Đầu thế kỉ XXI."],"answer":"A","explain":"Cách mạng công nghiệp lần thứ hai diễn ra từ giữa thế kỉ XIX đến khi Chiến tranh thế giới thứ nhất bùng nổ (1914).","points":0.25},{"type":"mcq","level":"NB","q":"Nguồn năng lượng chủ yếu của cách mạng công nghiệp lần thứ hai là","options":["A. điện năng.","B. hơi nước.","C. sức gió.","D. sức nước."],"answer":"A","explain":"Nếu lần thứ nhất dùng hơi nước thì lần thứ hai ứng dụng rộng rãi điện năng vào sản xuất và đời sống.","points":0.25},{"type":"mcq","level":"TH","q":"Thành tựu nào thuộc cách mạng công nghiệp lần thứ hai?","options":["A. Động cơ điện, điện thoại, vô tuyến điện.","B. Máy kéo sợi Gien-ni.","C. Con thoi bay.","D. Máy dệt chạy bằng hơi nước."],"answer":"A","explain":"Những khám phá về điện dẫn đến động cơ điện, điện thoại, vô tuyến điện – thành tựu của lần thứ hai.","points":0.25},{"type":"mcq","level":"TH","q":"Bối cảnh dẫn đến cách mạng công nghiệp lần thứ hai KHÔNG bao gồm","options":["A. các cuộc cách mạng tư sản bắt đầu bùng nổ ở châu Âu.","B. Anh tiếp tục đẩy mạnh công nghiệp hóa.","C. các nước tư bản có nhiều điều kiện thuận lợi.","D. khoa học Vật lí, Hóa học, Sinh học đạt nhiều thành tựu."],"answer":"A","explain":"Đến giữa thế kỉ XIX, các cuộc cách mạng tư sản cơ bản đã hoàn thành; các điều kiện còn lại đều đúng theo SGK.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao khoa học gắn chặt với sản xuất trong cách mạng công nghiệp lần thứ hai?","options":["A. Vì các phát minh đều dựa trên thành tựu khoa học (điện, hóa học...).","B. Vì khoa học không liên quan.","C. Vì chỉ dựa vào kinh nghiệm.","D. Vì khoa học bị cấm."],"answer":"A","explain":"Khác với lần thứ nhất (chủ yếu từ thợ thủ công), lần thứ hai dựa trên các khám phá khoa học về điện, hóa học, vật lí.","points":0.25},{"type":"mcq","level":"VDC","q":"So sánh động lực của hai cuộc cách mạng công nghiệp cận đại:","options":["A. lần 1: hơi nước – cơ khí; lần 2: điện – khoa học.","B. cả hai đều dùng hơi nước.","C. cả hai đều dùng điện.","D. không có động lực."],"answer":"A","explain":"Lần thứ nhất: máy hơi nước, cơ khí hóa; lần thứ hai: điện năng và các thành tựu khoa học.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cách mạng công nghiệp lần thứ hai diễn ra từ giữa thế kỉ XIX đến 1914.","b) Điện năng là nguồn năng lượng chủ yếu của lần thứ hai.","c) Lò cao trong luyện kim tạo ra nguyên liệu mới.","d) Lần thứ hai vẫn dùng hơi nước là chủ yếu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: lần thứ hai chủ yếu dùng điện năng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Động cơ đốt trong là thành tựu của lần thứ hai.","b) Khoa học Vật lí, Hóa học phát triển mạnh trước lần thứ hai.","c) Lần thứ hai không có thành tựu nào về điện.","d) Các nước tư bản có điều kiện thuận lợi cho công nghiệp hóa."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: điện là thành tựu trung tâm của lần thứ hai.","points":1},{"type":"short","level":"VD","q":"Cách mạng công nghiệp lần thứ hai kết thúc khi sự kiện nào bùng nổ năm 1914 (ghi 6 chữ)?","answer":"Chiến tranh thế giới thứ nhất","explain":"Lần thứ hai diễn ra đến khi Chiến tranh thế giới thứ nhất bùng nổ (1914).","points":0.5},{"type":"short","level":"VDC","q":"Phương pháp luyện kim nào trong lần thứ hai đã tạo ra các nguyên liệu mới như thép (ghi 2 chữ)?","answer":"Lò cao","explain":"Phương pháp dùng lò cao trong luyện kim dẫn đến sự ra đời của các nguyên liệu mới.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Hai giai cấp đối kháng hình thành từ cách mạng công nghiệp là","options":["A. tư sản công nghiệp và vô sản làm thuê.","B. địa chủ và nông dân.","C. tăng lữ và quý tộc.","D. thương nhân và thợ thủ công."],"answer":"A","explain":"Cách mạng công nghiệp hình thành hai giai cấp đối kháng: tư sản công nghiệp (nắm tư liệu sản xuất) và vô sản làm thuê.","points":0.25},{"type":"mcq","level":"NB","q":"Trung tâm công nghiệp – đô thị nào hình thành thời cận đại?","options":["A. Man-chét-xtơ.","B. La Mã.","C. A-ten.","D. Ba-bi-lon."],"answer":"A","explain":"Man-chét-xtơ (cùng Luân Đôn, Pa-ri...) là trung tâm công nghiệp – đô thị đông dân hình thành từ cách mạng công nghiệp.","points":0.25},{"type":"mcq","level":"TH","q":"Ý nghĩa của cách mạng công nghiệp đối với sản xuất là","options":["A. thay đổi cách tổ chức sản xuất, nâng cao năng suất lao động.","B. giữ nguyên sản xuất thủ công.","C. làm giảm năng suất.","D. không ảnh hưởng gì."],"answer":"A","explain":"Cách mạng công nghiệp chuyển sản xuất từ thủ công sang cơ khí, tạo nguyên liệu mới, nâng cao năng suất.","points":0.25},{"type":"mcq","level":"TH","q":"Hạn chế nào KHÔNG phải của cách mạng công nghiệp thời cận đại?","options":["A. Phát triển nông nghiệp bền vững.","B. Ô nhiễm môi trường.","C. Bóc lột lao động phụ nữ, trẻ em.","D. Tranh giành thuộc địa."],"answer":"A","explain":"Ba hạn chế theo SGK: ô nhiễm môi trường, bóc lột lao động, xâm chiếm và tranh giành thuộc địa.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao mâu thuẫn tư sản – vô sản dẫn đến đấu tranh?","options":["A. Vì tư sản bóc lột, vô sản bị áp bức nên đứng lên đấu tranh.","B. Vì hai giai cấp hợp tác tốt.","C. Vì không có mâu thuẫn.","D. Vì vô sản giàu có."],"answer":"A","explain":"Tư sản nắm tư liệu sản xuất, bóc lột sức lao động; vô sản bị áp bức nên đấu tranh đòi quyền lợi.","points":0.25},{"type":"mcq","level":"VDC","q":"Tác động tích cực và tiêu cực của cách mạng công nghiệp cho thấy","options":["A. tiến bộ kĩ thuật cần đi đôi với công bằng xã hội và bảo vệ môi trường.","B. chỉ cần phát triển kĩ thuật.","C. không cần quan tâm xã hội.","D. tiến bộ luôn chỉ có mặt tốt."],"answer":"A","explain":"Bài học: phát triển công nghiệp phải gắn với công bằng xã hội, bảo vệ môi trường và hòa bình.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cách mạng công nghiệp hình thành hai giai cấp tư sản và vô sản.","b) Man-chét-xtơ là trung tâm công nghiệp thời cận đại.","c) Cách mạng công nghiệp nâng cao năng suất lao động.","d) Cách mạng công nghiệp không gây ô nhiễm."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: ô nhiễm môi trường là hạn chế lớn.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tư sản nắm tư liệu sản xuất, vô sản làm thuê.","b) Mâu thuẫn giai cấp dẫn đến đấu tranh.","c) Cách mạng công nghiệp chỉ có tác động tích cực.","d) Các nước đế quốc tranh giành thuộc địa."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: còn có các mặt tiêu cực (ô nhiễm, bóc lột, chiến tranh).","points":1},{"type":"short","level":"VD","q":"Giai cấp nào nắm tư liệu sản xuất trong xã hội công nghiệp cận đại (ghi 2 chữ)?","answer":"Tư sản","explain":"Tư sản công nghiệp nắm tư liệu sản xuất; vô sản phải làm thuê.","points":0.5},{"type":"short","level":"VDC","q":"Trung tâm công nghiệp nào của Anh, nổi tiếng với ngành dệt, được nhắc trong SGK (ghi 2 chữ)?","answer":"Man-chét-xtơ","explain":"Man-chét-xtơ là trung tâm công nghiệp dệt lớn của Anh thời cận đại.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Năm 1764, Giêm Ha-gri-vơ sáng tạo ra","options":["A. máy kéo sợi Gien-ni.","B. máy hơi nước.","C. con thoi bay.","D. đầu máy xe lửa."],"answer":"A","explain":"Năm 1764, Giêm Ha-gri-vơ sáng tạo ra máy kéo sợi Gien-ni với nhiều cọc sợi.","points":0.25},{"type":"mcq","level":"NB","q":"Năm 1807, Rô-bớt Phon-tơn chế tạo thành công tàu thủy hơi nước ở nước nào?","options":["A. Mỹ.","B. Anh.","C. Pháp.","D. Đức."],"answer":"A","explain":"Ở Mỹ, năm 1807, Rô-bớt Phon-tơn chế tạo thành công tàu thủy chở khách chạy bằng hơi nước đầu tiên.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao cách mạng công nghiệp lan từ Anh sang châu Âu, Bắc Mỹ?","options":["A. Vì các nước học tập kĩ thuật, có điều kiện tương tự.","B. Vì Anh ép buộc.","C. Vì tự phát hoàn toàn.","D. Vì không có nguyên nhân."],"answer":"A","explain":"Kĩ thuật mới lan truyền; các nước châu Âu, Bắc Mỹ có điều kiện (vốn, tài nguyên, thị trường) nên nhanh chóng tiếp thu.","points":0.25},{"type":"mcq","level":"TH","q":"Đời sống văn hóa thời cận đại có điểm mới nào?","options":["A. Xuất hiện điện thoại, ra-đi-ô, điện ảnh.","B. Không có gì mới.","C. Mọi người không giao lưu.","D. Văn hóa bị xóa bỏ."],"answer":"A","explain":"Đời sống tinh thần phong phú hơn với điện thoại, ra-đi-ô, điện ảnh; giao lưu văn hóa quốc tế được đẩy mạnh.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao các nước đế quốc tranh giành thuộc địa thời cận đại?","options":["A. Vì cần nguyên liệu, thị trường và nơi đầu tư tư bản.","B. Vì thích chiến tranh.","C. Vì không có nhu cầu.","D. Vì muốn giúp thuộc địa."],"answer":"A","explain":"Công nghiệp phát triển cần nguyên liệu, thị trường tiêu thụ và nơi đầu tư – động lực của chủ nghĩa thực dân.","points":0.25},{"type":"mcq","level":"VDC","q":"Từ hạn chế “bóc lột lao động trẻ em” thời cận đại, bài học hiện nay là","options":["A. bảo vệ quyền trẻ em, cấm lao động trẻ em.","B. sử dụng trẻ em vì rẻ.","C. không cần luật lao động.","D. bóc lột là cần thiết."],"answer":"A","explain":"Bài học: cần pháp luật bảo vệ người lao động, đặc biệt cấm bóc lột lao động trẻ em.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Năm 1764: máy kéo sợi Gien-ni.","b) Năm 1807: tàu thủy hơi nước ở Mỹ.","c) Điện ảnh xuất hiện thời cận đại.","d) Các nước đế quốc không tranh giành thuộc địa."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: tranh giành thuộc địa là hạn chế lớn.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Công nghiệp cần nguyên liệu và thị trường.","b) Cần bảo vệ quyền trẻ em.","c) Bóc lột lao động là tiến bộ.","d) Kĩ thuật mới lan từ Anh sang các nước."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: bóc lột là mặt tiêu cực cần xóa bỏ.","points":1},{"type":"short","level":"VD","q":"Ai sáng tạo ra máy kéo sợi Gien-ni năm 1764 (ghi 3 chữ)?","answer":"Giêm Ha-gri-vơ","explain":"Giêm Ha-gri-vơ sáng tạo máy kéo sợi Gien-ni năm 1764.","points":0.5},{"type":"short","level":"VDC","q":"Năm 1807, tàu thủy hơi nước đầu tiên ra đời ở nước nào (ghi 1 chữ)?","answer":"Mỹ","explain":"Rô-bớt Phon-tơn (Mỹ) chế tạo tàu thủy hơi nước năm 1807.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Lối sống mới hình thành từ cách mạng công nghiệp là","options":["A. lối sống công nghiệp.","B. lối sống nông nghiệp.","C. lối sống du mục.","D. không có lối sống mới."],"answer":"A","explain":"SGK nêu lối sống và văn hóa công nghiệp ngày càng trở nên phổ biến.","points":0.25},{"type":"mcq","level":"NB","q":"Năm 1785, Ét-mơn Các-rai chế tạo ra","options":["A. máy dệt chạy bằng hơi nước.","B. máy hơi nước.","C. con thoi bay.","D. điện thoại."],"answer":"A","explain":"Năm 1785, Ét-mơn Các-rai chế tạo máy dệt chạy bằng hơi nước, hoàn thiện cơ khí hóa ngành dệt.","points":0.25},{"type":"mcq","level":"TH","q":"Tác động của giao thông vận tải mới (xe lửa, tàu thủy) là","options":["A. rút ngắn khoảng cách, thúc đẩy giao lưu kinh tế – văn hóa.","B. không có tác động.","C. làm các nước xa nhau hơn.","D. chỉ phục vụ quân sự."],"answer":"A","explain":"Xe lửa, tàu thủy hơi nước rút ngắn thời gian di chuyển, thúc đẩy buôn bán và giao lưu văn hóa.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nông nghiệp cũng chuyển biến trong cách mạng công nghiệp?","options":["A. Vì có máy móc, phân bón và nhu cầu lương thực đô thị tăng.","B. Vì nông nghiệp biến mất.","C. Vì không ai làm nông.","D. Vì nông nghiệp lạc hậu mãi."],"answer":"A","explain":"Máy nông nghiệp, phân bón hóa học nâng cao năng suất; đô thị đông dân cần nhiều lương thực.","points":0.25},{"type":"mcq","level":"VD","q":"Mối quan hệ giữa cách mạng công nghiệp và đô thị hóa là","options":["A. công nghiệp thu hút lao động, hình thành đô thị đông dân.","B. không liên quan.","C. công nghiệp làm đô thị biến mất.","D. đô thị ngăn cản công nghiệp."],"answer":"A","explain":"Nhà máy cần lao động; nông dân rời quê ra thành phố làm thuê – hình thành các đô thị công nghiệp.","points":0.25},{"type":"mcq","level":"VDC","q":"Từ quá trình đô thị hóa ồ ạt thời cận đại, bài học cho hiện nay là","options":["A. quy hoạch đô thị, bảo đảm việc làm, nhà ở, môi trường.","B. để đô thị tự phát.","C. ngăn cấm di cư.","D. không cần quy hoạch."],"answer":"A","explain":"Đô thị hóa tự phát gây quá tải, ô nhiễm – cần quy hoạch đồng bộ, bền vững.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lối sống công nghiệp trở nên phổ biến.","b) Năm 1785: máy dệt hơi nước.","c) Xe lửa rút ngắn khoảng cách.","d) Nông nghiệp không thay đổi gì."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nông nghiệp cũng có chuyển biến mạnh mẽ.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Công nghiệp thu hút lao động về đô thị.","b) Cần quy hoạch đô thị bền vững.","c) Đô thị hóa tự phát không gây hệ lụy.","d) Giao thông mới thúc đẩy giao lưu."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: đô thị hóa tự phát gây quá tải, ô nhiễm.","points":1},{"type":"short","level":"VD","q":"Ai chế tạo máy dệt chạy bằng hơi nước năm 1785 (ghi 3 chữ)?","answer":"Ét-mơn Các-rai","explain":"Ét-mơn Các-rai chế tạo máy dệt hơi nước năm 1785.","points":0.5},{"type":"short","level":"VDC","q":"Quá trình dân cư tập trung về các trung tâm công nghiệp gọi là gì (ghi 3 chữ)?","answer":"Đô thị hóa","explain":"Đô thị hóa – hình thành các thành phố công nghiệp đông dân.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Năm 1733, Giôn Cay sáng tạo ra","options":["A. con thoi bay.","B. máy hơi nước.","C. đầu máy xe lửa.","D. điện thoại."],"answer":"A","explain":"Năm 1733, Giôn Cay sáng tạo ra con thoi bay, mở đầu các phát minh trong ngành dệt.","points":0.25},{"type":"mcq","level":"NB","q":"Phát minh nào thúc đẩy giao thông đường sắt thời cận đại?","options":["A. Đầu máy xe lửa.","B. Máy bay.","C. Ô tô.","D. Tàu ngầm."],"answer":"A","explain":"Đầu máy xe lửa (1804) mở ra kỉ nguyên đường sắt, thúc đẩy giao thông và buôn bán.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao ngành dệt đi đầu trong cách mạng công nghiệp lần thứ nhất?","options":["A. Vì nhu cầu vải vóc lớn, dễ cơ khí hóa từng công đoạn.","B. Vì dệt là ngành duy nhất.","C. Vì các ngành khác bị cấm.","D. Vì dệt không cần vốn."],"answer":"A","explain":"Nhu cầu vải vóc tăng mạnh; các công đoạn kéo sợi, dệt vải dễ cải tiến máy móc nên dệt đi đầu.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm chung của các phát minh thời cận đại là","options":["A. đều nhằm tăng năng suất, thay sức người bằng máy.","B. đều không có tác dụng.","C. đều chỉ dùng trong quân sự.","D. đều bị lãng quên."],"answer":"A","explain":"Các phát minh (thoi bay, máy hơi nước, động cơ điện...) đều nhằm cơ khí hóa, tăng năng suất lao động.","points":0.25},{"type":"mcq","level":"VD","q":"Vì sao nước Anh hội đủ điều kiện bùng nổ cách mạng công nghiệp đầu tiên?","options":["A. Vì có đồng thời vốn, tài nguyên, lao động, thị trường và kĩ thuật.","B. Vì là nước duy nhất trên thế giới.","C. Vì không có nông nghiệp.","D. Vì được các nước giúp đỡ."],"answer":"A","explain":"Anh có cách mạng tư sản sớm, tích lũy tư bản, than sắt dồi dào, lao động tự do và nhu cầu thị trường – hội đủ tiền đề.","points":0.25},{"type":"mcq","level":"VDC","q":"Từ việc Anh đi đầu cách mạng công nghiệp, bài học cho các nước đi sau là","options":["A. chủ động tiếp thu, cải tiến kĩ thuật thay vì đóng cửa.","B. đóng cửa với kĩ thuật mới.","C. chờ nước khác phát triển.","D. chỉ trông vào tài nguyên."],"answer":"A","explain":"Các nước châu Âu, Mỹ đã nhanh chóng học tập kĩ thuật Anh để công nghiệp hóa – bài học về mở cửa, tiếp thu.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Năm 1733: con thoi bay.","b) Đầu máy xe lửa thúc đẩy đường sắt.","c) Ngành dệt đi đầu cơ khí hóa.","d) Mọi phát minh đều vô dụng."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: các phát minh đều tăng năng suất, thay sức người.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Anh hội đủ vốn, tài nguyên, lao động, thị trường.","b) Các nước đi sau học tập kĩ thuật Anh.","c) Nên đóng cửa với kĩ thuật mới.","d) Tiếp thu kĩ thuật giúp công nghiệp hóa nhanh."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần mở cửa, chủ động tiếp thu.","points":1},{"type":"short","level":"VD","q":"Phát minh nào năm 1733 mở đầu các cải tiến trong ngành dệt Anh (ghi 3 chữ)?","answer":"Con thoi bay","explain":"Con thoi bay của Giôn Cay (1733) mở đầu loạt phát minh cơ khí hóa ngành dệt.","points":0.5},{"type":"short","level":"VDC","q":"Nước nào đi đầu cách mạng công nghiệp lần thứ nhất (ghi 1 chữ)?","answer":"Anh","explain":"Nước Anh đi đầu cách mạng công nghiệp cuối thế kỉ XVIII.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Năm 1769, Ri-chác Ác-rai chế tạo ra","options":["A. máy kéo sợi chạy bằng sức nước.","B. máy hơi nước.","C. con thoi bay.","D. máy dệt hơi nước."],"answer":"A","explain":"Năm 1769, Ri-chác Ác-rai chế tạo máy kéo sợi chạy bằng sức nước.","points":0.25},{"type":"mcq","level":"NB","q":"Năm 1784, Hen-ri Cớt phát minh ra","options":["A. lò luyện quặng phương pháp Put-đinh.","B. máy hơi nước.","C. điện thoại.","D. vô tuyến điện."],"answer":"A","explain":"Năm 1784, Hen-ri Cớt phát minh lò luyện quặng theo phương pháp Put-đinh, thúc đẩy ngành luyện kim.","points":0.25},{"type":"mcq","level":"TH","q":"Vai trò của ngành luyện kim trong cách mạng công nghiệp là","options":["A. cung cấp máy móc, nguyên liệu cho các ngành khác.","B. không có vai trò.","C. chỉ để trang trí.","D. cản trở công nghiệp."],"answer":"A","explain":"Luyện kim cung cấp sắt thép chế tạo máy móc, đường ray, tàu thủy – nền tảng của công nghiệp.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao gọi thế kỉ XIX là “thế kỉ của thép và điện”?","options":["A. Vì thép lò cao và điện năng là hai thành tựu trung tâm.","B. Vì chỉ có thép.","C. Vì không có phát minh.","D. Vì thép và điện biến mất."],"answer":"A","explain":"Lần thứ hai nổi bật với thép (lò cao) và điện (động cơ điện, điện thoại) – hai trụ cột công nghiệp.","points":0.25},{"type":"mcq","level":"VD","q":"Mối quan hệ giữa khoa học và kĩ thuật trong lần thứ hai thể hiện ở","options":["A. phát minh dựa trên lí thuyết khoa học (điện từ, hóa học).","B. không liên quan.","C. kĩ thuật đi trước khoa học.","D. khoa học bị cấm."],"answer":"A","explain":"Động cơ điện dựa trên lí thuyết điện từ; công nghiệp hóa chất dựa trên hóa học – khoa học dẫn dắt kĩ thuật.","points":0.25},{"type":"mcq","level":"VDC","q":"So với lần thứ nhất, trình độ của lần thứ hai cao hơn ở","options":["A. dựa trên khoa học, năng lượng mới, quy mô lớn hơn.","B. thấp hơn.","C. ngang bằng.","D. không so sánh được."],"answer":"A","explain":"Lần thứ hai dựa trên thành tựu khoa học, dùng điện năng, quy mô công nghiệp lớn hơn nhiều.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Năm 1769: máy kéo sợi sức nước.","b) Năm 1784: lò Put-đinh.","c) Luyện kim cung cấp nguyên liệu cho công nghiệp.","d) Thế kỉ XIX là thế kỉ của thép và điện."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phát minh lần 2 dựa trên khoa học.","b) Lần 2 có trình độ cao hơn lần 1.","c) Khoa học không liên quan đến kĩ thuật.","d) Điện từ là cơ sở của động cơ điện."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: khoa học dẫn dắt kĩ thuật trong lần thứ hai.","points":1},{"type":"short","level":"VD","q":"Ai chế tạo máy kéo sợi chạy bằng sức nước năm 1769 (ghi 3 chữ)?","answer":"Ri-chác Ác-rai","explain":"Ri-chác Ác-rai chế tạo máy kéo sợi sức nước năm 1769.","points":0.5},{"type":"short","level":"VDC","q":"Hai thành tựu trung tâm làm nên tên gọi “thế kỉ của thép và điện” là thép và gì (ghi 1 chữ)?","answer":"Điện","explain":"Thép (lò cao) và điện (động cơ điện, điện thoại) là trụ cột của lần thứ hai.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Thông tin liên lạc thời cận đại có bước tiến với","options":["A. điện thoại, vô tuyến điện.","B. thư tay duy nhất.","C. bồ câu đưa thư duy nhất.","D. không có tiến bộ."],"answer":"A","explain":"Điện thoại, vô tuyến điện ra đời từ các khám phá về điện, làm thay đổi thông tin liên lạc.","points":0.25},{"type":"mcq","level":"NB","q":"Động cơ đốt trong thúc đẩy ngành nào?","options":["A. Giao thông vận tải (ô tô, máy bay).","B. Nông nghiệp duy nhất.","C. Dệt may duy nhất.","D. Khai thác mỏ duy nhất."],"answer":"A","explain":"Động cơ đốt trong là tiền đề cho ô tô, máy bay – cách mạng giao thông thế kỉ XX.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao điện năng ưu việt hơn hơi nước?","options":["A. Vì sạch, dễ truyền tải đi xa, dùng linh hoạt.","B. Vì rẻ hơn duy nhất.","C. Vì không cần sản xuất.","D. Vì hơi nước tốt hơn."],"answer":"A","explain":"Điện sạch, truyền tải xa qua dây dẫn, bật tắt linh hoạt – ưu việt hơn hơi nước cồng kềnh.","points":0.25},{"type":"mcq","level":"TH","q":"Công nghiệp hóa chất thời cận đại sản xuất","options":["A. thuốc nhuộm, phân bón, chất dẻo.","B. lương thực.","C. quần áo.","D. máy móc duy nhất."],"answer":"A","explain":"Công nghiệp hóa chất cho ra thuốc nhuộm, phân bón, chất dẻo... phục vụ nhiều ngành.","points":0.25},{"type":"mcq","level":"VD","q":"Tác động của điện thoại đến xã hội là","options":["A. rút ngắn khoảng cách liên lạc, thúc đẩy giao lưu.","B. không có tác động.","C. làm con người xa nhau.","D. chỉ phục vụ quân sự."],"answer":"A","explain":"Điện thoại giúp liên lạc tức thì qua khoảng cách lớn – tiền đề của xã hội thông tin.","points":0.25},{"type":"mcq","level":"VDC","q":"Từ việc ứng dụng điện vào đời sống, bài học cho chuyển đổi số hiện nay là","options":["A. công nghệ mới cần được phổ cập để mọi người hưởng lợi.","B. giữ công nghệ cho số ít.","C. không cần phổ cập.","D. công nghệ gây hại."],"answer":"A","explain":"Điện chỉ phát huy khi đến mọi nhà, mọi xưởng – bài học phổ cập công nghệ số hiện nay.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Điện thoại, vô tuyến điện ra đời thời cận đại.","b) Động cơ đốt trong thúc đẩy giao thông.","c) Điện ưu việt hơn hơi nước.","d) Hóa chất không phát triển thời cận đại."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: công nghiệp hóa chất phát triển mạnh.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Điện thoại rút ngắn khoảng cách liên lạc.","b) Công nghệ mới cần được phổ cập.","c) Nên giữ công nghệ cho số ít.","d) Điện sạch và linh hoạt hơn hơi nước."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần phổ cập để mọi người hưởng lợi.","points":1},{"type":"short","level":"VD","q":"Nguồn năng lượng nào ưu việt hơn hơi nước, là trụ cột của lần thứ hai (ghi 1 chữ)?","answer":"Điện","explain":"Điện năng – sạch, dễ truyền tải, linh hoạt – là năng lượng chủ yếu của lần thứ hai.","points":0.5},{"type":"short","level":"VDC","q":"Phát minh nào là tiền đề cho ô tô, máy bay thế kỉ XX (ghi 4 chữ)?","answer":"Động cơ đốt trong","explain":"Động cơ đốt trong thúc đẩy giao thông vận tải hiện đại.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Giai cấp vô sản hình thành từ","options":["A. nông dân mất ruộng phải làm thuê trong nhà máy.","B. quý tộc phong kiến.","C. tăng lữ.","D. thương nhân giàu."],"answer":"A","explain":"Nông dân mất ruộng (phong trào rào đất) phải vào nhà máy làm thuê – hình thành giai cấp vô sản.","points":0.25},{"type":"mcq","level":"NB","q":"Cuộc đấu tranh nào của vô sản thời cận đại?","options":["A. Phong trào Hiến chương ở Anh.","B. Khởi nghĩa nông dân.","C. Chiến tranh tôn giáo.","D. Nổi dậy của nô lệ La Mã."],"answer":"A","explain":"Phong trào Hiến chương (Chartism) ở Anh những năm 1830–1840 là cuộc đấu tranh chính trị của công nhân.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao công nhân đấu tranh thời cận đại?","options":["A. Vì bị bóc lột, làm việc cực nhọc, lương thấp.","B. Vì lương cao.","C. Vì được đối xử tốt.","D. Vì không có mâu thuẫn."],"answer":"A","explain":"Ngày làm 14–16 giờ, lương rẻ mạt, điều kiện mất an toàn – công nhân đứng lên đòi quyền lợi.","points":0.25},{"type":"mcq","level":"TH","q":"Kết quả của đấu tranh công nhân là","options":["A. ngày làm 8 giờ, luật bảo vệ lao động dần ra đời.","B. không có gì thay đổi.","C. công nhân bị xóa sổ.","D. tư sản thắng tuyệt đối."],"answer":"A","explain":"Đấu tranh buộc tư sản nhượng bộ: giảm giờ làm, cải thiện điều kiện, luật lao động ra đời.","points":0.25},{"type":"mcq","level":"VD","q":"Mối quan hệ giữa phát triển công nghiệp và phong trào công nhân là","options":["A. công nghiệp càng phát triển, giai cấp công nhân càng lớn mạnh.","B. không liên quan.","C. công nghiệp triệt tiêu công nhân.","D. công nhân ngăn cản công nghiệp."],"answer":"A","explain":"Nhà máy mọc lên thì đội ngũ công nhân đông đảo, tổ chức chặt chẽ – lực lượng đấu tranh.","points":0.25},{"type":"mcq","level":"VDC","q":"Bài học từ đấu tranh công nhân thời cận đại cho người lao động nay là","options":["A. đoàn kết, hiểu biết pháp luật để bảo vệ quyền lợi.","B. chấp nhận mọi bất công.","C. không cần tổ chức.","D. bạo lực là duy nhất."],"answer":"A","explain":"Người lao động cần tổ chức công đoàn, hiểu luật để bảo vệ quyền lợi chính đáng.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vô sản hình thành từ nông dân mất ruộng.","b) Phong trào Hiến chương là đấu tranh của công nhân Anh.","c) Công nhân bị bóc lột nặng nề.","d) Đấu tranh mang lại ngày làm 8 giờ."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Công nghiệp phát triển thì công nhân lớn mạnh.","b) Cần tổ chức để bảo vệ quyền lợi.","c) Nên chấp nhận mọi bất công.","d) Luật lao động ra đời từ đấu tranh."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần đấu tranh bảo vệ quyền lợi chính đáng.","points":1},{"type":"short","level":"VD","q":"Phong trào đấu tranh chính trị của công nhân Anh những năm 1830–1840 có tên là gì (ghi 2 chữ)?","answer":"Hiến chương","explain":"Phong trào Hiến chương (Chartism) đòi quyền bầu cử phổ thông cho công nhân.","points":0.5},{"type":"short","level":"VDC","q":"Ngày làm việc tiêu chuẩn mà công nhân đấu tranh giành được là mấy giờ (ghi số)?","answer":"8","explain":"Ngày làm 8 giờ – thành quả đấu tranh của giai cấp công nhân.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Bài 7 học về các cuộc cách mạng công nghiệp thời kì nào?","options":["A. Cận đại.","B. Hiện đại.","C. Cổ đại.","D. Nguyên thủy."],"answer":"A","explain":"Bài 7: Các cuộc cách mạng công nghiệp thời kì cận đại (lần thứ nhất và thứ hai).","points":0.25},{"type":"mcq","level":"NB","q":"Thành tựu nào KHÔNG thuộc lần thứ nhất?","options":["A. Động cơ điện.","B. Máy hơi nước.","C. Con thoi bay.","D. Đầu máy xe lửa."],"answer":"A","explain":"Động cơ điện thuộc lần thứ hai; các thành tựu còn lại thuộc lần thứ nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm giống nhau của hai cuộc cách mạng công nghiệp cận đại là","options":["A. đều nâng cao năng suất, thay đổi xã hội sâu sắc.","B. đều dùng hơi nước.","C. đều không có tác động.","D. đều chỉ ở Anh."],"answer":"A","explain":"Cả hai đều cơ khí hóa sản xuất, nâng cao năng suất và làm biến đổi xã hội.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải học về cách mạng công nghiệp?","options":["A. Để hiểu nguồn gốc xã hội hiện đại và bài học phát triển.","B. Để thi cử.","C. Không cần thiết.","D. Để quay lại quá khứ."],"answer":"A","explain":"Hiểu cách mạng công nghiệp giúp hiểu xã hội hiện đại và rút bài học công nghiệp hóa.","points":0.25},{"type":"mcq","level":"VD","q":"Tổng kết Bài 7, động lực chung của hai cuộc cách mạng là","options":["A. nhu cầu tăng năng suất và lợi nhuận của sản xuất tư bản.","B. sở thích phát minh.","C. chiến tranh duy nhất.","D. ngẫu nhiên."],"answer":"A","explain":"Nhu cầu tăng năng suất, giảm chi phí, mở rộng thị trường thúc đẩy không ngừng cải tiến kĩ thuật.","points":0.25},{"type":"mcq","level":"VDC","q":"Việt Nam cần rút bài học nào từ cách mạng công nghiệp?","options":["A. chủ động công nghiệp hóa, hiện đại hóa gắn với công bằng, môi trường.","B. từ chối công nghiệp hóa.","C. chỉ phát triển nông nghiệp.","D. sao chép nguyên xi mô hình Anh."],"answer":"A","explain":"Bài học: công nghiệp hóa phải đi đôi với công bằng xã hội, bảo vệ môi trường, phù hợp điều kiện đất nước.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bài 7 học về thời kì cận đại.","b) Động cơ điện thuộc lần thứ hai.","c) Hai cuộc cách mạng đều nâng cao năng suất.","d) Cần học để hiểu xã hội hiện đại."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Động lực chung là tăng năng suất, lợi nhuận.","b) Việt Nam cần công nghiệp hóa bền vững.","c) Nên sao chép nguyên xi mô hình Anh.","d) Công nghiệp hóa cần gắn với môi trường."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: cần phù hợp điều kiện đất nước.","points":1},{"type":"short","level":"VD","q":"Bài 7 gồm hai cuộc cách mạng công nghiệp lần thứ nhất và thứ mấy (ghi số)?","answer":"2","explain":"Bài 7: cách mạng công nghiệp lần thứ nhất và lần thứ hai thời kì cận đại.","points":0.5},{"type":"short","level":"VDC","q":"Nước đi đầu cách mạng công nghiệp lần thứ nhất cũng là nơi khởi nguồn của môn bóng đá hiện đại, tên là gì (ghi 1 chữ)?","answer":"Anh","explain":"Nước Anh – cái nôi của cách mạng công nghiệp và bóng đá hiện đại.","points":0.5}]}]}</script>
