<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Cảng thị Óc Eo từng là trung tâm kinh tế sầm uất của quốc gia cổ nào ở Đông Nam Á?", "options": ["A. Lâm Ấp.", "B. Phù Nam.", "C. Pa-gan.", "D. Lan Xang."], "answer": "B", "explain": "Óc Eo là cảng thị, trung tâm kinh tế – văn hóa của vương quốc Phù Nam (thế kỉ I – VII), minh chứng cho vai trò cầu nối giao thương đường biển của Đông Nam Á.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đền Bô-rô-bu-đua ở In-đô-nê-xi-a là công trình kiến trúc tôn giáo tiêu biểu của tôn giáo nào?", "options": ["A. Hin-đu giáo.", "B. Phật giáo.", "C. Hồi giáo.", "D. Thiên Chúa giáo."], "answer": "B", "explain": "Bô-rô-bu-đua (xây dựng khoảng thế kỉ VIII – IX trên đảo Gia-va) là ngôi đền tháp Phật giáo lớn, thể hiện sự tiếp thu sáng tạo văn minh Ấn Độ của cư dân In-đô-nê-xi-a.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thánh địa Mỹ Sơn (Quảng Nam) từng là trung tâm tôn giáo của vương quốc nào?", "options": ["A. Phù Nam.", "B. Chân Lạp.", "C. Champa.", "D. Đại Việt."], "answer": "C", "explain": "Mỹ Sơn là thánh địa Hin-đu giáo của vương quốc Champa, nơi thờ các vị thần và các vua Champa, được UNESCO công nhận Di sản văn hóa thế giới năm 1999.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điểm giống nhau cơ bản nhất giữa đền Bô-rô-bu-đua (In-đô-nê-xi-a) và đền Ăng-co Vát (Campuchia) là gì?", "options": ["A. Đều là thành tựu kiến trúc tôn giáo thể hiện sự tiếp thu sáng tạo văn minh Ấn Độ của cư dân bản địa.", "B. Đều là đền thờ thần Vi-snu của Hin-đu giáo.", "C. Đều được xây dựng trên các đảo thuộc In-đô-nê-xi-a.", "D. Đều từng là kinh đô của một vương quốc phong kiến."], "answer": "A", "explain": "Bô-rô-bu-đua là đền tháp Phật giáo, Ăng-co Vát thờ thần Vi-snu (Hin-đu giáo) — khác nhau về tôn giáo, nhưng cùng là minh chứng cho việc cư dân Đông Nam Á tiếp thu văn minh Ấn Độ một cách sáng tạo, tạo nên bản sắc riêng chứ không à thương cảng của Phù Nam.", "c) Lâm Ấp ra đời năm 192.", "d) Phù Nam tồn tại đến thế kỉ XIII."], "type": "truefalse"}, {"type": "short", "level": "VDC", "q": "Đền Bô-rô-bu-đua được xây dựng vào khoảng thế kỉ nào? (ghi chữ số La Mã, ví dụ VIII-IX)", "answer": "VIII-IX", "explain": "Theo SGK, đền Bô-rô-bu-đua trên đảo Gia-va (In-đô-nê-xi-a) được xây dựng khoảng thế kỉ VIII – IX.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vương quốc Lan Xang của Lào chấm dứt tồn tại vào năm nào? (ghi chữ số)", "answer": "1707", "explain": "Vương quốc Lan Xang (1353 – 1707) là vương quốc phong kiến của Lào, có nghĩa là vương quốc Triệu Voi.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"answer": "A", "explain": "ĐNA là ngã tư đường nối Ấn Độ Dương với Thái Bình Dương, cầu nối văn minh Ấn – Trung.", "level": "NB", "options": ["A. Ngã tư đường nối Ấn Độ Dương với Thái Bình Dương.", "B. Nơi tận cùng của thế giới.", "C. Vùng đất biệt lập.", "D. Chỉ là đường đi của thám hiểm."], "points": 0.25, "q": "Vị trí địa lí của Đông Nam Á được ví như gì?", "type": "mcq"}, {"type": "mcq", "level": "NB", "q": "Vị vua nào đã dời đô về Thăng Long năm 1010?", "options": ["A. Lý Thái Tổ.", "B. Lý Thánh Tông.", "C. Trần Thái Tông.", "D. Lê Lợi."], "answer": "A", "explain": "Năm 1010, vua Lý Thái Tổ dời đô từ Hoa Lư về Đại La, đổi tên thành Thăng Long — kinh đô lâu dài của Đại Việt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vương quốc Sri-vi-giay-a (thế kỉ VII – XIII) đặt trung tâm trên đảo nào của In-đô-nê-xi-a?", "options": ["A. Gia-va.", "B. Ba-li.", "C. Xumatra.", "D. Xu-la-ve-si."], "answer": "C", "explain": "Sri-vi-giay-a là vương quốc hùng mạnh trên đảo Xumatra, kiểm soát eo biển Ma-lác-ca từ thế kỉ VII đến XIII.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vương quốc Sri-vi-giay-a được coi là một mắt xích quan trọng của con đường tơ lụa trên biển vì lí do nào?", "options": ["A. Sở hữu đội quân bộ binh hùng mạnh nhất Đông Nam Á.", "B. Kiểm soát eo biển Ma-lác-ca, làm trung gian buôn bán giữa Ấn Độ Dương và Biển Đông.", "C. Là nơi khởi nguồn và truyền bá Phật giáo ra toàn châu Á.", "D. Sáng tạo ra chữ viết riêng đầu tiên ở Đông Nam Á."], "answer": "B", "explain": "Nhờ vị trí trên đảo Xumatra án ngữ eo biển Ma-lác-ca, Sri-vi-giay-a khống chế tuyến đường biển nối Ấn Độ Dương với Biển Đông, thu thuế và trung chuyển hàng hóa nên trở nên giàu mạnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phật giáo được truyền bá rộng rãi ở Đông Nam Á thời cổ – trung đại chủ yếu vì", "options": ["A. các vua chúa bắt buộc dân chúng phải cải đạo theo Phật giáo.", "B. giáo lí từ bi, hướng thiện phù hợp với đời sống tinh thần của cư dân.", "C. thương nhân Ả Rập tích cực truyền bá Phật giáo.", "D. người châu Âu mang Phật giáo đến cùng với Thiên Chúa giáo."], "answer": "B", "explain": "Giáo lí từ bi, hỉ xả, hướng thiện của Phật giáo phù hợp với đời sống tinh thần của cư dân nông nghiệp Đông Nam Á nên được đón nhận rộng rãi; nhiều vương quốc như Pa-gan, Sri-vi-giay-a lấy Phật giáo làm chỗ dựa tinh thần.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Việc hầu hết các quốc gia Đông Nam Á đều lấy nông nghiệp lúa nước làm nền tảng kinh tế đã dẫn đến hệ quả văn hóa – xã hội nào?", "options": ["A. Hình thành chế độ chiếm hữu nô lệ điển hình.", "B. Thúc đẩy công nghiệp nặng phát triển vượt bậc.", "C. Hình thành tổ chức làng, xóm và nhiều phong tục, lễ hội nông nghiệp tương đồng nhau.", "D. Xóa bỏ hoàn toàn tín ngưỡng bản địa của cư dân."], "answer": "C", "explain": "Nông nghiệp lúa nước cần thủy lợi và lao động tập thể nên cư dân quần tụ thành làng; từ đó hình thành nhiều phong tục, lễ hội cầu mùa, thờ thần nông nghiệp tương đồng khắp khu vực — nét chung nổi bật của văn minh Đông Nam Á.", "points": 0.25}, {"answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng theo SGK. c) Sai: làng là tổ chức xã hội phổ biến nhất ở ĐNA.", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đông Nam Á là khu vực đa tộc người.", "b) Cư dân ĐNA quần tụ thành các tổ chức xã hội đầu tiên.", "c) Thành phố là tổ chức xã hội phổ biến nhất ở ĐNA cổ – trung đại.", "d) Các quốc gia đầu tiên ra đời tạo nền tảng cho văn minh ĐNA."], "type": "truefalse"}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về thành tựu văn minh Đông Nam Á:", "statements": ["a) Đền Bô-rô-bu-đua và đền Ăng-co Vát đều là công trình kiến trúc Phật giáo.", "b) Chữ viết của người Chăm và người Khơ-me được sáng tạo trên cơ sở chữ viết Ấn Độ.", "c) Hồi giáo du nhập vào Đông Nam Á muộn hơn Thiên Chúa giáo.", "d) Thánh địa Mỹ Sơn đã được UNESCO công nhận là Di sản văn hóa thế giới."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai: Bô-rô-bu-đua là đền tháp Phật giáo, còn Ăng-co Vát thờ thần Vi-snu của Hin-đu giáo. b) Đúng: trên cơ sở chữ Ấn Độ, cư dân sáng tạo ra chữ viết riêng như chữ Chăm, chữ Khơ-me. c) Sai: Hồi giáo du nhập từ thế kỉ XIII, sớm hơn Thiên Chúa giáo (thế kỉ XVI). d) Đúng: Mỹ Sơn được UNESCO công nhận năm 1999.", "points": 1}, {"type": "short", "level": "TH", "q": "Đền Bô-rô-bu-đua tọa lạc trên đảo nào của In-đô-nê-xi-a? (ghi tên đảo)", "answer": "Gia-va", "explain": "Đền Bô-rô-bu-đua nằm ở trung tâm đảo Gia-va (In-đô-nê-xi-a), được xây dựng khoảng thế kỉ VIII – IX.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vương quốc Sri-vi-giay-a tồn tại đến thế kỉ nào? (ghi chữ số La Mã)", "answer": "XIII", "explain": "Vương quốc Sri-vi-giay-a tồn tại từ thế kỉ VII đến thế kỉ XIII, kiểm soát eo biển Ma-lác-ca.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Thiên Chúa giáo được truyền vào Đông Nam Á từ thế kỉ nào?", "options": ["A. Thế kỉ X.", "B. Thế kỉ XIII.", "C. Thế kỉ XVI.", "D. Thế kỉ XIX."], "answer": "C", "explain": "Theo SGK, Hồi giáo du nhập vào Đông Nam Á từ thế kỉ XIII, còn Thiên Chúa giáo được truyền vào từ thế kỉ XVI theo chân các nhà truyền giáo phương Tây.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vị vua Chân Lạp nào đã cho xây dựng đền Ăng-co Vát?", "options": ["A. Chế Bồng Nga.", "B. Xu-ry-a-var-man II.", "C. Fa Ngum.", "D. Hayam Wuruk."], "answer": "B", "explain": "Vua Xu-ry-a-var-man II (trị vì đầu thế kỉ XII) cho xây dựng Ăng-co Vát để thờ thần Vi-snu — vị thần bảo hộ mà nhà vua tôn thờ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sử thi Ra-ma-ya-na được cư dân Đông Nam Á tiếp thu từ nền văn minh nào?", "options": ["A. Trung Hoa.", "B. Ả Rập.", "C. Ấn Độ.", "D. Ba Tư."], "answer": "C", "explain": "Cùng với Phật giáo, Hin-đu giáo và chữ viết, các sử thi Ấn Độ như Ra-ma-ya-na, Ma-ha-bha-ra-ta được cư dân Đông Nam Á tiếp thu, trở thành nguồn cảm hứng cho văn học và nghệ thuật điêu khắc (như phù điêu ở Ăng-co Vát).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Các tháp Chăm ở thánh địa Mỹ Sơn chủ yếu thờ vị thần nào của Hin-đu giáo?", "options": ["A. Đức Phật Thích Ca.", "B. Thánh A-la.", "C. Thần Shiva.", "D. Thần Mặt Trời."], "answer": "C", "explain": "Người Chăm theo Hin-đu giáo, tôn thờ thần Shiva là vị thần tối cao; các tháp Chăm ở Mỹ Sơn là đền thờ Shiva với biểu tượng linga – yoni, thể hiện sự tiếp thu sáng tạo văn minh Ấn Độ.", "points": 0.25}, {"answer": "B", "explain": "Thiên Chúa giáo được truyền vào ĐNA từ thế kỉ XVI theo chân người Bồ Đào Nha.", "level": "TH", "options": ["A. Thế kỉ XIII.", "B. Thế kỉ XVI.", "C. Thế kỉ I.", "D. Thế kỉ VI TCN."], "points": 0.25, "q": "Thiên Chúa giáo được truyền vào Đông Nam Á từ thế kỉ nào?", "type": "mcq"}, {"type": "mcq", "level": "VDC", "q": "Một học giả nhận định: Văn minh Đông Nam Á không phải là bản sao của văn minh Ấn Độ hay Trung Hoa. Dẫn chứng nào sau đây chứng minh nhận định đó là đúng?", "options": ["A. Cư dân Đông Nam Á sử dụng nguyên xi chữ Hán trong mọi văn bản hành chính.", "B. Cư dân sáng tạo chữ Chăm, chữ Khơ-me trên cơ sở chữ Ấn; kiến trúc tháp Chăm, Ăng-co Vát mang bản sắc riêng.", "C. Mọi đền tháp ở Đông Nam Á đều sao chép y nguyên mẫu từ Ấn Độ.", "D. Cư dân Đông Nam Á từ bỏ hoàn toàn văn hóa bản địa để theo văn hóa ngoại lai."], "answer": "B", "explain": "Cư dân Đông Nam Á tiếp thu văn minh Ấn Độ, Trung Hoa một cách có chọn lọc và sáng tạo: từ chữ Ấn Độ sáng tạo ra chữ viết riêng, từ mô típ kiến trúc Ấn Độ tạo nên tháp Chăm, Ăng-co Vát mang đậm bản sắc dân tộc — đó là sức sống của văn minh bản địa.", "points": 0.25}, {"answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo SGK. d) Sai: biển là đường giao thương, cầu nối ĐNA với thế giới.", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đông Nam Á là ngã tư đường nối Ấn Độ Dương với Thái Bình Dương.", "b) Văn minh lúa nước là nền văn minh bản địa của ĐNA.", "c) Làng là tổ chức xã hội phổ biến nhất ở ĐNA.", "d) Biển ngăn cách ĐNA với thế giới bên ngoài."], "type": "truefalse"}, {"answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo SGK. d) Sai: chữ Nôm trở thành văn tự chính thức dưới thời Quang Trung.", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phật giáo, Hin-đu giáo được du nhập vào ĐNA.", "b) Nhiều dân tộc ĐNA sáng tạo chữ viết riêng từ chữ Ấn Độ.", "c) Người Việt sáng tạo chữ Nôm từ chữ Hán.", "d) Chữ Nôm trở thành văn tự chính thức dưới thời nhà Nguyễn."], "type": "truefalse"}, {"type": "short", "level": "TH", "q": "Quốc gia Lâm Ấp (ra đời năm 192) là tiền thân của vương quốc nào? (ghi tên vương quốc)", "answer": "Champa", "explain": "Lâm Ấp ra đời năm 192 ở miền Trung Việt Nam, là tiền thân của vương quốc Champa (192 – 1832).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thánh địa Mỹ Sơn được UNESCO công nhận Di sản văn hóa thế giới vào năm nào? (ghi chữ số)", "answer": "1999", "explain": "Thánh địa Mỹ Sơn (Quảng Nam) — trung tâm Hin-đu giáo của vương quốc Champa — được UNESCO công nhận Di sản văn hóa thế giới năm 1999.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Vương quốc Pa-gan (My-an-ma) nổi tiếng với đặc điểm nào?", "options": ["A. Kinh đô được xây dựng trên mặt biển.", "B. Sử dụng chữ tượng hình của Ai Cập.", "C. Xây dựng kim tự tháp bằng đá.", "D. Có hàng nghìn đền tháp Phật giáo."], "answer": "D", "explain": "Pa-gan (thế kỉ IX – XIII) là vương quốc phong kiến của My-an-ma, nổi tiếng với hàng nghìn ngôi đền tháp Phật giáo — thành tựu kiến trúc tiêu biểu của văn minh Đông Nam Á.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vương quốc Champa tồn tại chủ yếu trên địa bàn nào của Việt Nam ngày nay?", "options": ["A. Đồng bằng sông Hồng.", "B. Duyên hải miền Trung.", "C. Vùng Tây Nguyên.", "D. Đồng bằng sông Cửu Long."], "answer": "B", "explain": "Champa (192 – 1832) là vương quốc của người Chăm, tồn tại chủ yếu trên dải đất duyên hải miền Trung Việt Nam ngày nay.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hồi giáo phát triển mạnh nhất ở những quốc gia Đông Nam Á nào?", "options": ["A. Việt Nam và Lào.", "B. In-đô-nê-xi-a và Ma-lai-xi-a.", "C. Thái Lan và Campuchia.", "D. Phi-líp-pin và Xin-ga-po."], "answer": "B", "explain": "Hồi giáo du nhập vào Đông Nam Á từ thế kỉ XIII và phát triển mạnh nhất ở In-đô-nê-xi-a, Ma-lai-xi-a — nơi Hồi giáo trở thành tôn giáo chủ yếu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong xã hội các vương quốc phong kiến Đông Nam Á, tầng lớp nào là lực lượng sản xuất chính?", "options": ["A. Tăng lữ.", "B. Nông dân.", "C. Thương nhân.", "D. Quý tộc."], "answer": "B", "explain": "Nền kinh tế các vương quốc phong kiến Đông Nam Á dựa trên nông nghiệp lúa nước nên nông dân là lực lượng sản xuất chính, đông đảo nhất trong xã hội.", "points": 0.25}, {"answer": "A", "explain": "Trên cơ sở tiếp thu văn minh Trung Hoa, Đại Việt xây dựng thể chế quân chủ trung ương tập quyền.", "level": "TH", "options": ["A. Thể chế quân chủ trung ương tập quyền.", "B. Chế độ dân chủ cộng hòa.", "C. Chế độ phong kiến phân quyền.", "D. Chế độ nô lệ."], "points": 0.25, "q": "Đại Việt tiếp thu thể chế chính trị nào của Trung Hoa?", "type": "mcq"}, {"type": "mcq", "level": "VDC", "q": "Điểm khác biệt cơ bản giữa ảnh hưởng của văn minh Ấn Độ và văn minh Trung Hoa đối với Đông Nam Á thời cổ – trung đại là", "options": ["A. Trung Hoa ảnh hưởng sâu rộng toàn khu vực còn Ấn Độ chỉ ảnh hưởng ở Việt Nam.", "B. Ấn Độ ảnh hưởng sâu rộng trên toàn khu vực về tôn giáo, chữ viết, kiến trúc; Trung Hoa ảnh hưởng đậm nét nhất ở Việt Nam về Nho giáo, thể chế.", "C. Ấn Độ chỉ ảnh hưởng về quân sự, Trung Hoa chỉ ảnh hưởng về kinh tế.", "D. Hai nền văn minh có phạm vi và lĩnh vực ảnh hưởng hoàn toàn giống nhau."], "answer": "B", "explain": "Văn minh Ấn Độ đến sớm và tác động sâu rộng khắp Đông Nam Á (Phật giáo, Hin-đu giáo, chữ viết, kiến trúc, sử thi); văn minh Trung Hoa ảnh hưởng chủ yếu ở Việt Nam (Nho giáo, chữ Hán, thể chế quân chủ trung ương tập quyền, kiến trúc cung đình) do hơn một nghìn năm tiếp xúc trực tiếp.", "points": 0.25}, {"answer": ["T", "F", "T", "T"], "explain": "a), c), d) Đúng theo SGK. b) Sai: ĐNA là khu vực đa tộc người.", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Văn minh lúa nước hình thành trên cơ sở điều kiện tự nhiên thuận lợi.", "b) Đông Nam Á chỉ có một tộc người duy nhất.", "c) Làng là tổ chức xã hội phổ biến ở ĐNA.", "d) Các quốc gia đầu tiên ra đời từ sự phát triển của các tổ chức xã hội."], "type": "truefalse"}, {"answer": ["F", "T", "T", "T"], "explain": "b), c), d) Đúng theo SGK. a) Sai: văn minh Ấn Độ ảnh hưởng đến ĐNA trên nhiều lĩnh vực.", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Văn minh Ấn Độ chỉ ảnh hưởng đến ĐNA về tôn giáo.", "b) Chữ viết của nhiều dân tộc ĐNA có nguồn gốc từ chữ Ấn Độ.", "c) Văn minh Trung Hoa ảnh hưởng đến Việt Nam nhiều hơn cả.", "d) Người Việt tiếp thu thể loại cáo, hịch, chiếu, biểu của Trung Hoa."], "type": "truefalse"}, {"type": "short", "level": "VDC", "q": "Kinh đô Thăng Long được thành lập vào .5, "q": "Ăng-co Vát được xây dựng dưới thời vị vua Khơ-me nào?", "type": "short"}, {"type": "short", "level": "VDC", "q": "Các tháp Chăm ở miền Trung Việt Nam (Mỹ Sơn, Pô Nagar...) chủ yếu được xây dựng để thờ vị thần nào của Hin-đu giáo (ghi tên thần)?", "answer": "Shiva", "explain": "Các tháp Chăm chủ yếu thờ thần Shiva — vị thần được vương quốc Champa tôn thờ trong Hin-đu giáo; thánh địa Mỹ Sơn là trung tâm thờ Shiva tiêu biểu.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"answer": "A", "explain": "Vương triều Xai-len-đra xây dựng Bô-rô-bu-đua (thế kỉ VIII – IX) trên đảo Giava của In-đô-nê-xi-a; đây là ngọn tháp Phật giáo lớn nhất thế giới.", "level": "NB", "options": ["A. Giava.", "B. Xumatra.", "C. Bali.", "D. Kalimantan."], "points": 0.25, "q": "Vương triều Xai-len-đra đã xây dựng Bô-rô-bu-đua trên đảo nào của In-đô-nê-xi-a?", "type": "mcq"}, {"answer": "A", "explain": "Năm 1054, vua Lý Thánh Tông đổi quốc hiệu từ Đại Cồ Việt thành Đại Việt.", "level": "NB", "options": ["A. Năm 1054.", "B. Năm 1010.", "C. Năm 192.", "D. Năm 802."], "points": 0.25, "q": "Quốc hiệu Đại Việt ra đời vào năm nào?", "type": "mcq"}, {"answer": "A", "explain": "Người Chăm theo Hin-đu giáo, thờ thần Si-va; thánh địa Mỹ Sơn là trung tâm tôn giáo Hin-đu giáo của vương quốc Champa.", "level": "NB", "options": ["A. Hin-đu giáo.", "B. Phật giáo.", "C. Hồi giáo.", "D. Nho giáo."], "points": 0.25, "q": "Tôn giáo nào chiếm vị trí chủ đạo trong đời sống tinh thần của vương quốc Champa?", "type": "mcq"}, {"answer": "A", "explain": "Thánh địa Mỹ Sơn (Quảng Nam) – trung tâm tôn giáo của vương quốc Champa – được UNESCO công nhận là Di sản văn hóa thế giới năm 1999.", "level": "TH", "options": ["A. Thánh địa Mỹ Sơn.", "B. Chùa Một Cột.", "C. Văn Miếu – Quốc Tử Giám.", "D. Hoàng thành Thăng Long."], "points": 0.25, "q": "Di sản văn hóa thế giới nào sau đây là thành tựu của nền văn minh Champa?", "type": "mcq"}, {"answer": "A", "explain": "Đông Nam Á nằm trên tuyến đường biển nối Ấn Độ Dương v
