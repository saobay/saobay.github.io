<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"answer":"A","explain":"Văn minh là trạng thái phát triển cao của xã hội loài người, xuất hiện khi có nhà nước, chữ viết, đô thị; là tổng thể giá trị vật chất, tinh thần do con người sáng tạo.","level":"NB","options":["A. Trạng thái phát triển cao của xã hội loài người khi xuất hiện nhà nước, chữ viết, đô thị.","B. Mọi hoạt động sinh hoạt của con người.","C. Chỉ các công trình kiến trúc cổ.","D. Chỉ các tác phẩm nghệ thuật."],"points":0.25,"q":"Văn minh được hiểu là gì?","type":"mcq"},{"answer":"A","explain":"Văn hóa là toàn bộ giá trị vật chất, tinh thần (rộng, mọi thời đại); văn minh chỉ trình độ phát triển cao của văn hóa, gắn với xã hội có nhà nước.","level":"NB","options":["A. Văn hóa rộng hơn văn minh; văn minh là trình độ phát triển cao của văn hóa.","B. Văn minh rộng hơn văn hóa.","C. Văn hóa và văn minh hoàn toàn giống nhau.","D. Văn hóa và văn minh không liên quan nhau."],"points":0.25,"q":"Mối quan hệ giữa văn hóa và văn minh là gì?","type":"mcq"},{"answer":"A","explain":"Các tiêu chí của văn minh: nhà nước, chữ viết, đô thị, phân hóa giai cấp, tôn giáo có tổ chức.","level":"NB","options":["A. Nhà nước, chữ viết, đô thị, phân hóa giai cấp.","B. Hang động, công cụ đá, săn bắt.","C. Lều trại, chăn nuôi du mục.","D. Làng xóm, công cụ đồng."],"points":0.25,"q":"Những tiêu chí nào sau đây đánh dấu sự xuất hiện của văn minh?","type":"mcq"},{"answer":"A","explain":"Văn minh Ai Cập hình thành bên lưu vực sông Nin từ khoảng thiên niên kỉ IV TCN, với nhà nước thống nhất dưới Pha-ra-ông.","level":"TH","options":["A. Sông Nin.","B. Sông Ti-gơ.","C. Sông Hằng.","D. Sông Hoàng Hà."],"points":0.25,"q":"Nền văn minh Ai Cập cổ đại hình thành bên lưu vực dòng sông nào?","type":"mcq"},{"answer":"B","explain":"Chữ hình nêm của người Xu-me ở Lưỡng Hà được viết trên đất sét nung bằng que vót nhọn.","level":"TH","options":["A. Giấy.","B. Đất sét nung.","C. Da thú.","D. Tre, gỗ."],"points":0.25,"q":"Chữ hình nêm của cư dân Lưỡng Hà cổ đại được viết trên chất liệu nào?","type":"mcq"},{"answer":"C","explain":"Tứ đại phát minh của Trung Hoa: giấy, kĩ thuật in, la bàn, thuốc súng — cống hiến lớn cho văn minh nhân loại.","level":"VD","options":["A. Giấy, điện thoại, máy tính, internet.","B. La bàn, xe hơi, máy bay, tàu thủy.","C. Giấy, kĩ thuật in, la bàn, thuốc súng.","D. Thuốc súng, súng thần công, tàu chiến, máy bay."],"points":0.25,"q":"\"Tứ đại phát minh\" của văn minh Trung Hoa gồm những thành tựu nào?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: văn hóa rộng hơn văn minh; mọi nền văn minh đều là văn hóa nhưng không phải mọi văn hóa đều đạt trình độ văn minh.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Văn minh là trạng thái phát triển cao của xã hội loài người.","b) Xuất hiện nhà nước, chữ viết, đô thị là những tiêu chí của văn minh.","c) Văn minh phương Đông ra đời sớm, gắn với các dòng sông lớn.","d) Văn hóa hẹp hơn văn minh."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: chữ số 0 do Ấn Độ sáng tạo (khoảng thế kỉ V), không phải Ai Cập.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ai Cập sáng tạo chữ tượng hình và lịch 365 ngày.","b) Lưỡng Hà sáng tạo chữ hình nêm và hệ đếm 60.","c) Trung Hoa sáng tạo chữ Hán và giấy.","d) Chữ số 0 do người Ai Cập cổ đại sáng tạo."],"type":"truefalse"},{"answer":"2560 TCN","explain":"Kim tự tháp Gi-da (của Pha-ra-ông Khufu) được xây dựng khoảng năm 2560 TCN.","level":"VD","points":0.5,"q":"Kim tự tháp lớn nhất ở Gi-da (Ai Cập) được xây dựng vào khoảng thời gian nào?","type":"short"},{"answer":"Hammurabi","explain":"Bộ luật Hammurabi (khoảng 1754 TCN) là bộ luật thành văn cổ nhất, được khắc trên trụ đá.","level":"VDC","points":0.5,"q":"Bộ luật thành văn cổ nhất của Lưỡng Hà (khoảng 1754 TCN) mang tên vị vua nào?","type":"short"}]},{"name":"Đề 2","questions":[{"answer":"A","explain":"Văn minh phương Đông (Ai Cập, Lưỡng Hà, Ấn Độ, Trung Hoa) ra đời sớm nhất, gắn với các dòng sông lớn và nền nông nghiệp trồng lúa.","level":"NB","options":["A. Ra đời sớm nhất, gắn với các dòng sông lớn và nông nghiệp trồng lúa.","B. Ra đời muộn nhất trong lịch sử nhân loại.","C. Không gắn với điều kiện tự nhiên nào.","D. Chỉ phát triển thương nghiệp, không làm nông nghiệp."],"points":0.25,"q":"Đặc điểm chung về sự ra đời của các nền văn minh phương Đông là gì?","type":"mcq"},{"answer":"A","explain":"Chữ tượng hình Ai Cập là loại chữ viết cổ nhất của nhân loại; được Champollion giải mã năm 1822 nhờ phiến đá Rosetta.","level":"NB","options":["A. Chữ tượng hình.","B. Chữ hình nêm.","C. Chữ Phạn.","D. Chữ Hán."],"points":0.25,"q":"Loại chữ viết cổ nhất của nhân loại do người Ai Cập sáng tạo là gì?","type":"mcq"},{"answer":"A","explain":"Người Xu-me ở Lưỡng Hà sáng tạo chữ hình nêm — một trong những chữ viết cổ nhất.","level":"NB","options":["A. Người Xu-me.","B. Người Ai Cập.","C. Người Ấn Độ.","D. Người Trung Hoa."],"points":0.25,"q":"Chữ hình nêm là sáng tạo của cư dân nào ở Lưỡng Hà?","type":"mcq"},{"answer":"A","explain":"Ấn Độ sáng tạo chữ số 0 khoảng thế kỉ V (nhà toán học Aryabhata) — cống hiến vĩ đại cho toán học nhân loại.","level":"TH","options":["A. Ấn Độ.","B. Ai Cập.","C. Lưỡng Hà.","D. Hi Lạp."],"points":0.25,"q":"Chữ số 0 là sáng tạo vĩ đại của nền văn minh nào?","type":"mcq"},{"answer":"B","explain":"Phật giáo ra đời ở Ấn Độ vào thế kỉ VI TCN do Thích Ca Mâu Ni sáng lập, sau lan tỏa khắp châu Á.","level":"TH","options":["A. Thế kỉ X TCN.","B. Thế kỉ VI TCN.","C. Thế kỉ III.","D. Thế kỉ X."],"points":0.25,"q":"Phật giáo ra đời ở Ấn Độ vào thời gian nào?","type":"mcq"},{"answer":"C","explain":"Nho giáo do Khổng Tử sáng lập (551 – 479 TCN) trở thành hệ tư tưởng chính thống của Trung Hoa phong kiến.","level":"VD","options":["A. Phật giáo.","B. Đạo giáo.","C. Nho giáo.","D. Hin-đu giáo."],"points":0.25,"q":"Hệ tư tưởng nào do Khổng Tử sáng lập, trở thành chính thống của Trung Hoa phong kiến?","type":"mcq"},{"answer":["T","T","F","T"],"explain":"a), b), d) Đúng theo SGK. c) Sai: kim tự tháp là lăng mộ của các Pha-ra-ông, biểu tượng quyền lực, không phải nhà ở của dân thường.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sông Nin là cơ sở hình thành văn minh Ai Cập.","b) Bộ luật Hammurabi được khắc trên trụ đá.","c) Kim tự tháp là nhà ở của dân thường Ai Cập.","d) Chữ Hán là chữ viết tượng hình còn dùng đến ngày nay."],"type":"truefalse"},{"answer":["T","F","T","T"],"explain":"a), c), d) Đúng theo SGK. b) Sai: hệ đếm 60 là sáng tạo của Lưỡng Hà (còn dùng trong đo thời gian, góc).","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ấn Độ là quê hương của Phật giáo và Hin-đu giáo.","b) Hệ đếm 60 là sáng tạo của người Ai Cập.","c) Giấy do Thái Luân (Trung Hoa) phát minh năm 105.","d) Văn minh phương Đông gắn với nhà nước quân chủ chuyên chế."],"type":"truefalse"},{"answer":"Khổng Tử","explain":"Khổng Tử (551 – 479 TCN) là người sáng lập Nho giáo, hệ tư tưởng chính thống của Trung Hoa phong kiến.","level":"TH","points":0.5,"q":"Người sáng lập Nho giáo, sống vào khoảng 551 – 479 TCN, là ai?","type":"short"},{"answer":"105","explain":"Thái Luân (nhà Hán, Trung Hoa) cải tiến kĩ thuật làm giấy vào năm 105.","level":"VDC","points":0.5,"q":"Thái Luân (Trung Hoa) cải tiến kĩ thuật làm giấy vào năm nào?","type":"short"}]},{"name":"Đề 3","questions":[{"answer":"A","explain":"Nhà nước, chữ viết, đô thị, phân hóa giai cấp, tôn giáo có tổ chức là các tiêu chí của văn minh.","level":"NB","options":["A. Xuất hiện nhà nước và chữ viết.","B. Con người biết dùng lửa.","C. Con người biết làm công cụ đá.","D. Con người sống trong hang động."],"points":0.25,"q":"Dấu hiệu nào sau đây chứng tỏ xã hội loài người đã bước vào thời đại văn minh?","type":"mcq"},{"answer":"A","explain":"Kim tự tháp Gi-da (khoảng 2560 TCN) là lăng mộ của Pha-ra-ông, biểu tượng quyền lực và trình độ kiến trúc Ai Cập.","level":"NB","options":["A. Lăng mộ của các Pha-ra-ông.","B. Cung điện của quan lại.","C. Kho thóc của nhà nước.","D. Nơi ở của thợ thủ công."],"points":0.25,"q":"Kim tự tháp ở Ai Cập cổ đại là công trình nào sau đây?","type":"mcq"},{"answer":"A","explain":"Bộ luật Hammurabi (khoảng 1754 TCN) khắc trên trụ đá là bộ luật thành văn cổ nhất của nhân loại.","level":"NB","options":["A. Bộ luật thành văn cổ nhất của nhân loại.","B. Tác phẩm văn học đầu tiên.","C. Bản hiến pháp hiện đại.","D. Cuốn sách dạy nấu ăn."],"points":0.25,"q":"Bộ luật Hammurabi của Lưỡng Hà có vị trí nào trong lịch sử?","type":"mcq"},{"answer":"B","explain":"Người Ấn Độ sáng tạo chữ Phạn (Sanskrit) — chữ viết cổ của Ấn Độ, dùng ghi chép kinh điển.","level":"TH","options":["A. Chữ tượng hình.","B. Chữ Phạn (Sanskrit).","C. Chữ hình nêm.","D. Chữ Latin."],"points":0.25,"q":"Chữ viết cổ của Ấn Độ có tên gọi là gì?","type":"mcq"},{"answer":"A","explain":"Vạn Lí Trường Thành là công trình phòng thủ vĩ đại của Trung Hoa, được xây dựng qua nhiều triều đại.","level":"TH","options":["A. Vạn Lí Trường Thành.","B. Kim tự tháp.","C. Đấu trường Cô-lô-sê.","D. Tháp nghiêng Pi-da."],"points":0.25,"q":"Công trình phòng thủ vĩ đại nào là biểu tượng của văn minh Trung Hoa?","type":"mcq"},{"answer":"D","explain":"Hệ đếm 60 của Lưỡng Hà còn được dùng trong đo thời gian (60 giây/phút, 60 phút/giờ) và đo góc (360 độ).","level":"VD","options":["A. Đo khối lượng hàng hóa.","B. Đo chiều dài ruộng đất.","C. Đo nhiệt độ không khí.","D. Đo thời gian và góc."],"points":0.25,"q":"Hệ đếm 60 của Lưỡng Hà còn được sử dụng trong lĩnh vực nào đến ngày nay?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: văn minh Trung Hoa hình thành bên lưu vực sông Hoàng Hà và Trường Giang.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Văn minh là trạng thái phát triển cao của xã hội loài người.","b) Ai Cập cổ đại có nhà nước thống nhất dưới Pha-ra-ông.","c) Lưỡng Hà nằm giữa hai sông Ti-gơ và Ơ-phrát.","d) Văn minh Trung Hoa hình thành bên lưu vực sông Nin."],"type":"truefalse"},{"answer":["F","T","T","T"],"explain":"b), c), d) Đúng theo SGK. a) Sai: Phật giáo ra đời ở Ấn Độ vào thế kỉ VI TCN, không phải Trung Hoa.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phật giáo ra đời ở Trung Hoa vào thế kỉ VI TCN.","b) Chữ số 0 do Ấn Độ sáng tạo khoảng thế kỉ V.","c) Tứ đại phát minh gồm giấy, kĩ thuật in, la bàn, thuốc súng.","d) Nho giáo trở thành hệ tư tưởng chính thống của Trung Hoa phong kiến."],"type":"truefalse"},{"answer":"Nin","explain":"Văn minh Ai Cập hình thành bên lưu vực sông Nin — dòng sông mang phù sa và sự sống cho Ai Cập.","level":"TH","points":0.5,"q":"Dòng sông nào được coi là \"món quà\" làm nên văn minh Ai Cập cổ đại?","type":"short"},{"answer":"Thái Luân","explain":"Thái Luân (nhà Hán) cải tiến kĩ thuật làm giấy năm 105 — một trong tứ đại phát minh của Trung Hoa.","level":"VDC","points":0.5,"q":"Người cải tiến kĩ thuật làm giấy của Trung Hoa vào năm 105 là ai?","type":"short"}]},{"name":"Đề 4","questions":[{"answer":"A","explain":"Văn minh là tổng thể những giá trị vật chất và tinh thần do con người sáng tạo ra trong tiến trình lịch sử, ở trình độ phát triển cao.","level":"NB","options":["A. Tổng thể giá trị vật chất, tinh thần do con người sáng tạo ở trình độ phát triển cao.","B. Chỉ những giá trị vật chất.","C. Chỉ những giá trị tinh thần.","D. Chỉ các di tích còn tồn tại."],"points":0.25,"q":"Văn minh bao gồm những giá trị nào do con người sáng tạo?","type":"mcq"},{"answer":"A","explain":"Người Ai Cập giỏi toán học, y học (thuật ướp xác), thiên văn học và sáng tạo lịch 365 ngày.","level":"NB","options":["A. Lịch 365 ngày, toán học, y học, thiên văn học.","B. Chữ hình nêm và hệ đếm 60.","C. Chữ số 0 và Phật giáo.","D. Giấy và la bàn."],"points":0.25,"q":"Những thành tựu khoa học nào là của văn minh Ai Cập?","type":"mcq"},{"answer":"A","explain":"Chữ hình nêm, luật Hammurabi, hệ đếm 60 là những thành tựu tiêu biểu của văn minh Lưỡng Hà.","level":"NB","options":["A. Chữ hình nêm, luật Hammurabi, hệ đếm 60.","B. Chữ tượng hình và kim tự tháp.","C. Chữ Phạn và số 0.","D. Chữ Hán và giấy."],"points":0.25,"q":"Những thành tựu nào là của văn minh Lưỡng Hà?","type":"mcq"},{"answer":"C","explain":"Hai sử thi Mahabharata và Ramayana là di sản văn học vĩ đại của Ấn Độ cổ đại, có ảnh hưởng sâu rộng ở châu Á.","level":"TH","options":["A. Iliad và Odyssey.","B. Trường ca Đam San.","C. Mahabharata và Ramayana.","D. Truyện Kiều."],"points":0.25,"q":"Hai bộ sử thi nổi tiếng của Ấn Độ cổ đại là gì?","type":"mcq"},{"answer":"A","explain":"Kiến trúc chùa hang A-gian-ta là di sản kiến trúc, điêu khắc nổi tiếng của Ấn Độ cổ đại.","level":"TH","options":["A. Chùa hang A-gian-ta.","B. Kim tự tháp Gi-da.","C. Đấu trường Cô-lô-sê.","D. Đền Pác-tê-nông."],"points":0.25,"q":"Công trình kiến trúc chùa hang nổi tiếng của Ấn Độ cổ đại là gì?","type":"mcq"},{"answer":"B","explain":"La bàn giúp định hướng khi đi biển; thuốc súng thay đổi kĩ thuật quân sự; kĩ thuật in và giấy thúc đẩy truyền bá tri thức.","level":"VD","options":["A. Chỉ dùng để trang trí.","B. Thúc đẩy hàng hải, quân sự và truyền bá tri thức.","C. Chỉ phục vụ nông nghiệp.","D. Không có ý nghĩa thực tiễn."],"points":0.25,"q":"Tứ đại phát minh của Trung Hoa có ý nghĩa nào với văn minh nhân loại?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: chữ tượng hình Ai Cập được giải mã năm 1822 nhờ phiến đá Rosetta, không phải năm 1799 (năm tìm thấy đá).","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Văn minh phương Đông ra đời sớm nhất trong lịch sử nhân loại.","b) Xã hội phương Đông cổ đại có sự phân hóa giai cấp rõ rệt.","c) Tôn giáo, tín ngưỡng của phương Đông đậm nét, có tổ chức.","d) Chữ tượng hình Ai Cập được giải mã vào năm 1799."],"type":"truefalse"},{"answer":["T","T","F","T"],"explain":"a), b), d) Đúng theo SGK. c) Sai: ướp xác là thành tựu y học của Ai Cập, không phải Lưỡng Hà.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ai Cập sáng tạo lịch 365 ngày dựa trên quan sát thiên văn.","b) Luật Hammurabi điều chỉnh các quan hệ xã hội Lưỡng Hà.","c) Thuật ướp xác là thành tựu y học của Lưỡng Hà.","d) Chữ Hán của Trung Hoa là chữ tượng hình còn dùng đến nay."],"type":"truefalse"},{"answer":"Xu-me","explain":"Người Xu-me là cư dân đầu tiên ở Lưỡng Hà, sáng tạo chữ hình nêm.","level":"VD","points":0.5,"q":"Cư dân đầu tiên ở Lưỡng Hà, sáng tạo ra chữ hình nêm, là người nào?","type":"short"},{"answer":"Aryabhata","explain":"Nhà toán học Aryabhata (Ấn Độ, thế kỉ V) có công lớn trong việc sáng tạo, sử dụng chữ số 0.","level":"VDC","points":0.5,"q":"Nhà toán học Ấn Độ (thế kỉ V) có công lớn trong việc sáng tạo chữ số 0 là ai?","type":"short"}]},{"name":"Đề 5","questions":[{"answer":"A","explain":"Các nền văn minh phương Đông đều gắn với nhà nước quân chủ chuyên chế (Pha-ra-ông, vua Hammurabi, hoàng đế Trung Hoa...).","level":"NB","options":["A. Nhà nước quân chủ chuyên chế.","B. Nhà nước dân chủ cộng hòa.","C. Nhà nước liên bang.","D. Không có nhà nước."],"points":0.25,"q":"Hình thức nhà nước phổ biến của các nền văn minh phương Đông cổ đại là gì?","type":"mcq"},{"answer":"A","explain":"Thuật ướp xác thể hiện trình độ y học, hóa học cao của người Ai Cập cổ đại.","level":"NB","options":["A. Y học (thuật ướp xác).","B. Thiên văn học.","C. Toán học.","D. Vật lí học."],"points":0.25,"q":"Thuật ướp xác của người Ai Cập cổ đại thể hiện trình độ của ngành khoa học nào?","type":"mcq"},{"answer":"A","explain":"Người Lưỡng Hà giỏi thiên văn, làm ra lịch; hệ đếm 60 còn dùng trong đo thời gian, góc.","level":"NB","options":["A. Thiên văn học và hệ đếm 60.","B. Chữ tượng hình và kim tự tháp.","C. Chữ số 0 và Phật giáo.","D. Giấy và thuốc súng."],"points":0.25,"q":"Người Lưỡng Hà có những thành tựu nào về thiên văn và toán học?","type":"mcq"},{"answer":"A","explain":"Y học A-du-vê-đa là hệ thống y học cổ truyền của Ấn Độ, có ảnh hưởng lâu dài.","level":"TH","options":["A. Y học A-du-vê-đa.","B. Thuật ướp xác.","C. Châm cứu.","D. Phẫu thuật hiện đại."],"points":0.25,"q":"Hệ thống y học cổ truyền nổi tiếng của Ấn Độ có tên gọi là gì?","type":"mcq"},{"answer":"B","explain":"Đạo giáo do Lão Tử sáng lập, đề cao sống thuận theo tự nhiên (vô vi) — một trong những tư tưởng lớn của Trung Hoa.","level":"TH","options":["A. Nho giáo.","B. Đạo giáo.","C. Phật giáo.","D. Hin-đu giáo."],"points":0.25,"q":"Tư tưởng nào của Trung Hoa do Lão Tử sáng lập, đề cao sống thuận theo tự nhiên?","type":"mcq"},{"answer":"A","explain":"Văn minh phương Đông ra đời sớm, gắn với sông lớn, nông nghiệp lúa nước; phương Tây (Hi Lạp, La Mã) phát triển rực rỡ sau, gắn với thương nghiệp, biển cả.","level":"VD","options":["A. Phương Đông ra đời sớm, gắn với sông lớn và nông nghiệp; phương Tây phát triển sau, gắn với biển và thương nghiệp.","B. Phương Tây ra đời sớm hơn phương Đông.","C. Hai khu vực không có điểm khác biệt nào.","D. Phương Đông không có nhà nước, phương Tây có nhà nước."],"points":0.25,"q":"Điểm khác biệt cơ bản về điều kiện ra đời giữa văn minh phương Đông và phương Tây cổ đại là gì?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: chữ Phạn (Sanskrit) là chữ viết cổ của Ấn Độ.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sông Hằng là một trong những cái nôi của văn minh Ấn Độ.","b) Sử thi Ramayana có ảnh hưởng sâu rộng ở nhiều nước châu Á.","c) Nho giáo do Khổng Tử sáng lập.","d) Chữ Phạn là chữ viết cổ của Ai Cập."],"type":"truefalse"},{"answer":["T","F","T","T"],"explain":"a), c), d) Đúng theo SGK. b) Sai: kim tự tháp Gi-da được xây dựng khoảng 2560 TCN.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Luật Hammurabi ra đời khoảng 1754 TCN.","b) Kim tự tháp Gi-da được xây dựng vào khoảng 1560 TCN.","c) Giấy được phát minh ở Trung Hoa năm 105.","d) Chữ số 0 do Ấn Độ sáng tạo khoảng thế kỉ V."],"type":"truefalse"},{"answer":"Sanskrit","explain":"Chữ Phạn (Sanskrit) là chữ viết cổ của Ấn Độ, dùng để ghi chép kinh điển.","level":"VD","points":0.5,"q":"Chữ Phạn — chữ viết cổ của Ấn Độ — còn có tên gọi khác là gì?","type":"short"},{"answer":"Lão Tử","explain":"Lão Tử là người sáng lập Đạo giáo, tư tưởng lớn của Trung Hoa cổ đại.","level":"VDC","points":0.5,"q":"Người sáng lập Đạo giáo của Trung Hoa cổ đại là ai?","type":"short"}]},{"name":"Đề 6","questions":[{"answer":"A","explain":"Văn minh phương Đông gắn với nền kinh tế nông nghiệp trồng lúa, dựa vào các dòng sông lớn.","level":"NB","options":["A. Nông nghiệp trồng lúa.","B. Công nghiệp nặng.","C. Thương nghiệp đường biển.","D. Chăn nuôi du mục."],"points":0.25,"q":"Nền kinh tế chủ yếu của các nền văn minh phương Đông cổ đại là gì?","type":"mcq"},{"answer":"A","explain":"Pha-ra-ông là vua chuyên chế, được coi là thần thánh ở Ai Cập cổ đại.","level":"NB","options":["A. Pha-ra-ông.","B. Hoàng đế.","C. Quốc vương.","D. Thiên hoàng."],"points":0.25,"q":"Người đứng đầu nhà nước Ai Cập cổ đại được gọi là gì?","type":"mcq"},{"answer":"A","explain":"Chữ tượng hình Ai Cập được Champollion giải mã năm 1822 nhờ phiến đá Rosetta (tìm thấy 1799).","level":"NB","options":["A. Năm 1822.","B. Năm 1799.","C. Năm 1949.","D. Năm 105."],"points":0.25,"q":"Chữ tượng hình Ai Cập được giải mã vào năm nào?","type":"mcq"},{"answer":"B","explain":"Hin-đu giáo là tôn giáo lớn ra đời ở Ấn Độ, thờ nhiều thần (Brahma, Shiva, Vishnu...).","level":"TH","options":["A. Phật giáo.","B. Hin-đu giáo.","C. Nho giáo.","D. Đạo giáo."],"points":0.25,"q":"Tôn giáo nào ra đời ở Ấn Độ, thờ các thần Brahma, Shiva, Vishnu?","type":"mcq"},{"answer":"A","explain":"Kĩ thuật in bằng chữ rời do Tất Thăng (nhà Tống, Trung Hoa) phát minh khoảng thế kỉ XI.","level":"TH","options":["A. Tất Thăng.","B. Thái Luân.","C. Trương Hành.","D. Tổ Xung Chi."],"points":0.25,"q":"Kĩ thuật in bằng chữ rời — một trong tứ đại phát minh — do ai phát minh?","type":"mcq"},{"answer":"C","explain":"Chữ số 0 giúp hệ đếm thập phân hoàn chỉnh, làm nền tảng cho toán học và khoa học hiện đại.","level":"VD","options":["A. Chỉ để trang trí.","B. Không có ý nghĩa gì.","C. Làm hệ đếm thập phân hoàn chỉnh, nền tảng của toán học hiện đại.","D. Chỉ dùng trong tôn giáo."],"points":0.25,"q":"Sáng tạo chữ số 0 của Ấn Độ có ý nghĩa nào với văn minh nhân loại?","type":"mcq"},{"answer":["T","T","F","T"],"explain":"a), b), d) Đúng theo SGK. c) Sai: hệ đếm 60 là sáng tạo của Lưỡng Hà.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ai Cập cổ đại có nhà nước thống nhất dưới Pha-ra-ông.","b) Lưỡng Hà sáng tạo chữ hình nêm viết trên đất sét.","c) Hệ đếm 60 là sáng tạo của người Ai Cập.","d) Trung Hoa sáng tạo chữ Hán và kĩ thuật làm giấy."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: Nho giáo do Khổng Tử sáng lập; Lão Tử sáng lập Đạo giáo.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ấn Độ là quê hương của Phật giáo (thế kỉ VI TCN).","b) Chùa hang A-gian-ta là di sản kiến trúc của Ấn Độ.","c) Vạn Lí Trường Thành là công trình phòng thủ của Trung Hoa.","d) Nho giáo do Lão Tử sáng lập."],"type":"truefalse"},{"answer":"Mahabharata","explain":"Mahabharata và Ramayana là hai bộ sử thi vĩ đại của Ấn Độ cổ đại.","level":"TH","points":0.5,"q":"Cùng với Ramayana, bộ sử thi nào là di sản văn học vĩ đại của Ấn Độ cổ đại?","type":"short"},{"answer":"Tất Thăng","explain":"Tất Thăng (nhà Tống) phát minh kĩ thuật in bằng chữ rời khoảng thế kỉ XI.","level":"VDC","points":0.5,"q":"Người phát minh kĩ thuật in bằng chữ rời của Trung Hoa (nhà Tống) là ai?","type":"short"}]},{"name":"Đề 7","questions":[{"answer":"A","explain":"Tiêu chí văn minh: nhà nước, chữ viết, đô thị, phân hóa giai cấp, tôn giáo có tổ chức.","level":"NB","options":["A. Nhà nước, chữ viết, đô thị, phân hóa giai cấp.","B. Hang động, lửa, công cụ đá.","C. Lều trại, săn bắt, hái lượm.","D. Bộ lạc, thị tộc, công xã."],"points":0.25,"q":"Những yếu tố nào đánh dấu xã hội loài người bước vào thời đại văn minh?","type":"mcq"},{"answer":"A","explain":"Sông Nin mang phù sa bồi đắp đồng ruộng, là cơ sở của nền nông nghiệp và văn minh Ai Cập.","level":"NB","options":["A. Mang phù sa bồi đắp, tạo cơ sở cho nông nghiệp.","B. Chỉ để giao thông.","C. Chỉ để đánh cá.","D. Không có vai trò gì."],"points":0.25,"q":"Sông Nin có vai trò nào với văn minh Ai Cập?","type":"mcq"},{"answer":"A","explain":"Luật Hammurabi khắc trên trụ đá điều chỉnh các quan hệ xã hội — bộ luật thành văn cổ nhất.","level":"NB","options":["A. Điều chỉnh các quan hệ xã hội.","B. Ghi chép văn học.","C. Tính toán thiên văn.","D. Ghi công thức nấu ăn."],"points":0.25,"q":"Bộ luật Hammurabi có nội dung chính là gì?","type":"mcq"},{"answer":"A","explain":"Thích Ca Mâu Ni (Tất Đạt Đa) sáng lập Phật giáo ở Ấn Độ vào thế kỉ VI TCN.","level":"TH","options":["A. Thích Ca Mâu Ni.","B. Khổng Tử.","C. Lão Tử.","D. Hammurabi."],"points":0.25,"q":"Người sáng lập Phật giáo là ai?","type":"mcq"},{"answer":"B","explain":"La bàn giúp xác định phương hướng khi đi biển, thúc đẩy hàng hải và giao lưu văn minh.","level":"TH","options":["A. Giấy.","B. La bàn.","C. Thuốc súng.","D. Kĩ thuật in."],"points":0.25,"q":"Phát minh nào của Trung Hoa giúp định hướng khi đi biển?","type":"mcq"},{"answer":"D","explain":"Văn minh phương Đông: quân chủ chuyên chế, nông nghiệp lúa nước, tư tưởng tôn giáo đậm nét; khác với dân chủ Hi Lạp hay cộng hòa La Mã.","level":"VD","options":["A. Không có nhà nước.","B. Không có chữ viết.","C. Không có tôn giáo.","D. Nhà nước quân chủ chuyên chế, kinh tế nông nghiệp, tư tưởng tôn giáo đậm nét."],"points":0.25,"q":"Nét đặc trưng nổi bật của các nền văn minh phương Đông cổ đại là gì?","type":"mcq"},{"answer":["T","F","T","T"],"explain":"a), c), d) Đúng theo SGK. b) Sai: chữ hình nêm được viết trên đất sét nung, không phải trên giấy.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Văn minh là trình độ phát triển cao của văn hóa.","b) Chữ hình nêm được viết trên giấy.","c) Ai Cập sáng tạo lịch 365 ngày.","d) Ấn Độ sáng tạo chữ số 0 khoảng thế kỉ V."],"type":"truefalse"},{"answer":["F","T","T","T"],"explain":"b), c), d) Đúng theo SGK. a) Sai: Phật giáo ra đời ở Ấn Độ (thế kỉ VI TCN), sau mới lan sang Trung Hoa.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phật giáo ra đời ở Trung Hoa.","b) Tứ đại phát minh đều là sáng tạo của Trung Hoa.","c) Kim tự tháp Gi-da xây dựng khoảng 2560 TCN.","d) Chữ Hán là chữ tượng hình còn dùng đến ngày nay."],"type":"truefalse"},{"answer":"Ramayana","explain":"Ramayana là một trong hai bộ sử thi vĩ đại của Ấn Độ, có ảnh hưởng sâu rộng ở Đông Nam Á.","level":"VD","points":0.5,"q":"Bộ sử thi Ấn Độ nào có ảnh hưởng sâu rộng đến văn học nhiều nước Đông Nam Á?","type":"short"},{"answer":"Thích Ca Mâu Ni","explain":"Thích Ca Mâu Ni (Thái tử Tất Đạt Đa) sáng lập Phật giáo ở Ấn Độ vào thế kỉ VI TCN.","level":"VDC","points":0.5,"q":"Người sáng lập Phật giáo ở Ấn Độ (thế kỉ VI TCN) là ai?","type":"short"}]},{"name":"Đề 8","questions":[{"answer":"A","explain":"Văn minh là trạng thái phát triển cao của xã hội loài người, xuất hiện khi có nhà nước, chữ viết, đô thị.","level":"NB","options":["A. Trạng thái phát triển cao của xã hội loài người.","B. Giai đoạn đầu của xã hội nguyên thủy.","C. Mọi hoạt động của con người.","D. Chỉ các lễ hội dân gian."],"points":0.25,"q":"Văn minh ra đời khi xã hội loài người đạt đến trình độ nào?","type":"mcq"},{"answer":"A","explain":"Chữ tượng hình là chữ viết cổ nhất của nhân loại do người Ai Cập sáng tạo.","level":"NB","options":["A. Chữ tượng hình.","B. Chữ hình nêm.","C. Chữ Latin.","D. Chữ Ả Rập."],"points":0.25,"q":"Người Ai Cập cổ đại sáng tạo loại chữ viết nào?","type":"mcq"},{"answer":"A","explain":"Chữ hình nêm do người Xu-me ở Lưỡng Hà sáng tạo — một trong những chữ viết cổ nhất.","level":"NB","options":["A. Chữ hình nêm.","B. Chữ tượng hình.","C. Chữ Phạn.","D. Chữ Hán."],"points":0.25,"q":"Người Lưỡng Hà cổ đại sáng tạo loại chữ viết nào?","type":"mcq"},{"answer":"C","explain":"Số 0 do Ấn Độ sáng tạo khoảng thế kỉ V — cống hiến vĩ đại cho toán học nhân loại.","level":"TH","options":["A. Ai Cập.","B. Lưỡng Hà.","C. Ấn Độ.","D. Trung Hoa."],"points":0.25,"q":"Nền văn minh nào sáng tạo ra chữ số 0?","type":"mcq"},{"answer":"A","explain":"Giấy do Thái Luân cải tiến năm 105; kĩ thuật in, la bàn, thuốc súng hợp thành tứ đại phát minh.","level":"TH","options":["A. Giấy.","B. La bàn.","C. Thuốc súng.","D. Kĩ thuật in."],"points":0.25,"q":"Phát minh nào của Trung Hoa ra đời sớm nhất trong tứ đại phát minh?","type":"mcq"},{"answer":"B","explain":"Thuốc súng ban đầu dùng làm pháo, sau ứng dụng trong quân sự, làm thay đổi kĩ thuật chiến tranh.","level":"VD","options":["A. Chỉ để đốt pháo ngày Tết.","B. Ứng dụng trong quân sự, thay đổi kĩ thuật chiến tranh.","C. Chỉ dùng trong y học.","D. Không có ứng dụng thực tế."],"points":0.25,"q":"Thuốc súng — một trong tứ đại phát minh — có ứng dụng quan trọng nào?","type":"mcq"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: văn minh Trung Hoa hình thành bên lưu vực sông Hoàng Hà và Trường Giang, không phải sông Nin.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Văn minh phương Đông gắn với các dòng sông lớn.","b) Nhà nước quân chủ chuyên chế phổ biến ở phương Đông cổ đại.","c) Chữ viết là một trong những tiêu chí của văn minh.","d) Văn minh Trung Hoa hình thành bên sông Nin."],"type":"truefalse"},{"answer":["T","T","F","T"],"explain":"a), b), d) Đúng theo SGK. c) Sai: ướp xác là thành tựu của Ai Cập.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lưỡng Hà sáng tạo hệ đếm 60 còn dùng đến ngày nay.","b) Ấn Độ sáng tạo chữ Phạn và chữ số 0.","c) Thuật ướp xác là thành tựu y học của Lưỡng Hà.","d) Nho giáo trở thành tư tưởng chính thống của Trung Hoa phong kiến."],"type":"truefalse"},{"answer":"Ti-gơ","explain":"Lưỡng Hà nghĩa là \"vùng đất giữa hai sông\" Ti-gơ và Ơ-phrát.","level":"VD","points":0.5,"q":"Cùng với sông Ơ-phrát, dòng sông nào tạo nên vùng Lưỡng Hà?","type":"short"},{"answer":"Ơ-phrát","explain":"Lưỡng Hà là vùng đất giữa hai sông Ti-gơ và Ơ-phrát.","level":"VDC","points":0.5,"q":"Cùng với sông Ti-gơ, dòng sông nào tạo nên vùng Lưỡng Hà?","type":"short"}]},{"name":"Đề 9","questions":[{"answer":"A","explain":"Văn hóa là toàn bộ giá trị vật chất, tinh thần (rộng); văn minh là trình độ phát triển cao của văn hóa.","level":"NB","options":["A. Văn hóa rộng hơn văn minh.","B. Văn minh rộng hơn văn hóa.","C. Hai khái niệm hoàn toàn giống nhau.","D. Hai khái niệm đối lập nhau."],"points":0.25,"q":"So sánh phạm vi của hai khái niệm văn hóa và văn minh, nhận định nào đúng?","type":"mcq"},{"answer":"A","explain":"Kim tự tháp là lăng mộ của các Pha-ra-ông, biểu tượng quyền lực và trình độ kiến trúc Ai Cập.","level":"NB","options":["A. Lăng mộ của Pha-ra-ông.","B. Nhà ở của nông dân.","C. Trường học.","D. Bệnh viện."],"points":0.25,"q":"Kim tự tháp Ai Cập có chức năng chính là gì?","type":"mcq"},{"answer":"A","explain":"Bộ luật Hammurabi (khoảng 1754 TCN) khắc trên trụ đá là bộ luật thành văn cổ nhất.","level":"NB","options":["A. Bộ luật thành văn cổ nhất.","B. Bộ luật hiện đại nhất.","C. Tác phẩm thơ ca.","D. Cuốn sách thiên văn."],"points":0.25,"q":"Vị trí của bộ luật Hammurabi trong lịch sử pháp luật là gì?","type":"mcq"},{"answer":"A","explain":"Phật giáo (thế kỉ VI TCN) và Hin-đu giáo đều ra đời ở Ấn Độ.","level":"TH","options":["A. Phật giáo và Hin-đu giáo.","B. Nho giáo và Đạo giáo.","C. Thiên Chúa giáo và Hồi giáo.","D. Thần đạo và Khổng giáo."],"points":0.25,"q":"Những tôn giáo nào ra đời ở Ấn Độ cổ đại?","type":"mcq"},{"answer":"B","explain":"Kĩ thuật in (chữ rời của Tất Thăng) giúp nhân bản sách vở nhanh, thúc đẩy truyền bá tri thức.","level":"TH","options":["A. Giấy.","B. Kĩ thuật in.","C. La bàn.","D. Thuốc súng."],"points":0.25,"q":"Phát minh nào của Trung Hoa thúc đẩy việc truyền bá tri thức qua sách vở?","type":"mcq"},{"answer":"A","explain":"Chữ Hán tượng hình, qua hàng nghìn năm vẫn được dùng (có cải tiến) — sức sống bền bỉ của văn minh Trung Hoa.","level":"VD","options":["A. Sức sống bền bỉ, khả năng thích ứng của văn minh Trung Hoa.","B. Sự bảo thủ, không thay đổi.","C. Sự du nhập từ phương Tây.","D. Ngẫu nhiên, không có ý nghĩa."],"points":0.25,"q":"Việc chữ Hán còn được sử dụng đến ngày nay chứng tỏ điều gì?","type":"mcq"},{"answer":["T","F","T","T"],"explain":"a), c), d) Đúng theo SGK. b) Sai: kim tự tháp là lăng mộ Pha-ra-ông, không phải nhà ở dân thường.","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sông Nin mang phù sa, tạo cơ sở cho nông nghiệp Ai Cập.","b) Kim tự tháp là nhà ở của dân thường Ai Cập.","c) Chữ hình nêm được viết trên đất sét nung.","d) Chữ số 0 do Ấn Độ sáng tạo khoảng thế kỉ V."],"type":"truefalse"},{"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo SGK. d) Sai: Nho giáo do Khổng Tử sáng lập; Lão Tử sáng lập Đạo giáo.","level":"VDC","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tứ đại phát minh đều là sáng tạo của Trung Hoa.","b) Kim tự tháp Gi-da xây dựng khoảng 2560 TCN.","c) Luật Hammurabi ra đời khoảng 1754 TCN.","d) Nho giáo do Lão Tử sáng lập."],"type":"truefalse"},{"answer":"Hằng","explain":"Văn minh Ấn Độ hình thành bên lưu vực sông Ấn và sông Hằng.","level":"TH","points":0.5,"q":"Cùng với sông Ấn, dòng sông nào là cái nôi của văn minh Ấn Độ?","type":"short"},{"answer":"Hoàng Hà","explain":"Văn minh Trung Hoa hình thành bên lưu vực sông Hoàng Hà và Trường Giang.","level":"VDC","points":0.5,"q":"Dòng sông nào được coi là cái nôi của văn minh Trung Hoa?","type":"short"}]},{"name":"Đề 10","questions":[{"answer":"A","explain":"Văn minh là tổng thể những giá trị vật chất và tinh thần do con người sáng tạo ở trình độ phát triển cao.","level":"NB","options":["A. Giá trị vật chất và tinh thần ở trình độ phát triển cao.","B. Chỉ giá trị vật chất.","C. Chỉ giá trị tinh thần.","D. Chỉ các công trình còn tồn tại."],"points":0.25,"q":"Văn minh là tổng thể những giá trị nào do con người sáng tạo?","type":"mcq"},{"answer":"A","explain":"Người Ai Cập sáng tạo lịch 365 ngày dựa trên quan sát thiên văn (chu kì lũ sông Nin).","level":"NB","options":["A. 365 ngày.","B. 360 ngày.","C. 354 ngày.","D. 366 ngày."],"points":0.25,"q":"Người Ai Cập cổ đại sáng tạo loại lịch bao nhiêu ngày?","type":"mcq"},{"answer":"A","explain":"Người Xu-me là cư dân đầu tiên ở Lưỡng Hà, sáng tạo chữ hình nêm.","level":"NB","options":["A. Người Xu-me.","B. Người A-ry-an.","C. Người Mông Cổ.","D. Người Ả Rập."],"points":0.25,"q":"Cư dân đầu tiên sáng tạo chữ hình nêm ở Lưỡng Hà là người nào?","type":"mcq"},{"answer":"B","explain":"Vạn Lí Trường Thành là công trình phòng thủ vĩ đại, biểu tượng của văn minh Trung Hoa.","level":"TH","options":["A. Kim tự tháp.","B. Vạn Lí Trường Thành.","C. Đấu trường Cô-lô-sê.","D. Tháp Eiffel."],"points":0.25,"q":"Công trình phòng thủ nào là biểu tượng của Trung Hoa?","type":"mcq"},{"answer":"A","explain":"Chùa hang A-gian-ta là di sản kiến trúc, điêu khắc Phật giáo nổi tiếng của Ấn Độ.","level":"TH","options":["A. Chùa hang A-gian-ta.","B. Kim tự tháp Gi-da.","C. Đền Pác-tê-nông.","D. Nhà thờ Đức Bà."],"points":0.25,"q":"Di sản chùa hang nổi tiếng của Ấn Độ cổ đại là gì?","type":"mcq"},{"answer":"C","explain":"Chữ số 0 làm hệ đếm thập phân hoàn chỉnh, là nền tảng của toán học và khoa học hiện đại.","level":"VD","options":["A. Chỉ để ghi số điện thoại.","B. Không có ý nghĩa thực tiễn.","C. Làm hệ đếm thập phân hoàn chỉnh, nền tảng của toán học hiện đại.","D. Chỉ dùng trong chiêm tinh."],"points":0.25,"q":"Ý nghĩa lớn nhất của sáng tạo chữ số 0 là gì?","type":"mcq"},{"answer":["T","T","F","T"],"explain":"a), b), d) Đúng theo SGK. c) Sai: chữ tượng hình Ai Cập được giải mã năm 1822 (năm 1799 là năm tìm thấy phiến đá Rosetta).","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Văn minh là trạng thái phát triển cao của xã hội loài người.","b) Phân hóa giai cấp là một tiêu chí của văn minh.","c) Chữ tượng hình Ai Cập được giải mã năm 1799.","d) Đô thị là trung tâm chính trị, kinh tế, văn hóa."],"type":"truefalse"},{"answer":["F","T","T","T"],"explain":"b), c), d) Đúng theo SGK. a) Sai: Phật giáo ra đời ở Ấn Độ vào thế kỉ VI TCN.","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phật giáo ra đời ở Trung Hoa vào thế kỉ VI TCN.","b) Chữ Phạn là chữ viết cổ của Ấn Độ.","c) Giấy do Thái Luân phát minh năm 105.","d) Đạo giáo do Lão Tử sáng lập."],"type":"truefalse"},{"answer":"Khufu","explain":"Kim tự tháp lớn nhất ở Gi-da là lăng mộ của Pha-ra-ông Khufu (Kê-ốp), xây dựng khoảng 2560 TCN.","level":"VD","points":0.5,"q":"Kim tự tháp lớn nhất ở Gi-da là lăng mộ của vị Pha-ra-ông nào?","type":"short"},{"answer":"551","explain":"Khổng Tử (551 – 479 TCN) sáng lập Nho giáo, hệ tư tưởng chính thống của Trung Hoa phong kiến.","level":"VDC","points":0.5,"q":"Khổng Tử — người sáng lập Nho giáo — sinh vào năm bao nhiêu TCN (ghi chữ số)?","type":"short"}]}]}
