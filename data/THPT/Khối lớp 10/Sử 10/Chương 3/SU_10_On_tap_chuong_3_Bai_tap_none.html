guyên thủy.", "B. Do nhu cầu trị thủy, làm thủy lợi trên các dòng sông lớn đòi hỏi huy động sức người với quy mô lớn.", "C. Do dân số quá ít nên phải tập trung quyền lực.", "D. Do học theo mô hình tổ chức của Hi Lạp cổ đại."], "points": 0.25, "q": "Vì sao các nhà nước phương Đông cổ đại đều mang tính quân chủ chuyên chế với quyền lực tập trung cao độ?", "type": "mcq"}, {"answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo SGK. d) Sai: chữ tượng hình là sáng tạo của người Ai Cập; người La Mã dùng chữ Latin.", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Người Ấn Độ cổ đại sáng tạo ra hệ chữ số thập phân, trong đó có số 0.", "b) Vạn Lí Trường Thành được xây dựng từ thời nhà Tần để chống ngoại xâm phương Bắc.", "c) Sparta là thành bang Hi Lạp nổi tiếng về truyền thống quân sự.", "d) Người La Mã cổ đại sáng tạo ra chữ tượng hình."], "type": "truefalse"}, {"answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo SGK. d) Sai: kim tự tháp là lăng mộ của các Pha-ra-ông Ai Cập.", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nho giáo trở thành hệ tư tưởng chính thống của nhà nước phong kiến Trung Hoa.", "b) Trong những thế kỉ đầu, Thiên Chúa giáo từng bị chính quyền La Mã đàn áp.", "c) Chữ Latin là cơ sở hình thành nhiều ngôn ngữ châu Âu hiện đại.", "d) Kim tự tháp là công trình kiến trúc của người Lưỡng Hà cổ đại."], "type": "truefalse"}, {"answer": "Pô-lít", "explain": "Pô-lít (thành bang, polis) là hình thức tổ chức chính trị đặc trưng của Hi Lạp cổ đại, tiêu biểu là Athena và Sparta.", "level": "VD", "points": 0.5, "q": "Người Hi Lạp cổ đại gọi các quốc gia thành thị độc lập của mình là gì?", "type": "short"}, {"answer": "Herodotus", "explain": "Hê-rô-đốt (Herodotus) được coi là cha đẻ của sử học.", "level": "VDC", "points": 0.5, "q": "Nhà sử học Hi Lạp được mệnh danh là cha đẻ của sử học có tên phiên âm quốc tế là gì?", "type": "short"}]}, {"name": "Đề 6", "questions": [{"answer": "A", "explain": "Ai Cập và Lưỡng Hà là hai nền văn minh hình thành sớm nhất, vào khoảng thiên niên kỉ IV – III TCN.", "level": "NB", "options": ["A. Ai Cập và Lưỡng Hà.", "B. Trung Hoa và Ấn Độ.", "C. Hi Lạp và La Mã.", "D. Ba Tư và Ả Rập."], "points": 0.25, "q": "Trong các nền văn minh phương Đông cổ đại, những nền văn minh nào hình thành sớm nhất?", "type": "mcq"}, {"answer": "B", "explain": "Tần Thủy Hoàng (Doanh Chính) là vua đầu tiên của nhà Tần, người thống nhất Trung Hoa năm 221 TCN.", "level": "NB", "options": ["A. Nhà Hán.", "B. Nhà Tần.", "C. Nhà Đường.", "D. Nhà Minh."], "points": 0.25, "q": "Tần Thủy Hoàng là vị vua nổi tiếng của triều đại nào trong lịch sử Trung Hoa?", "type": "mcq"}, {"answer": "C", "explain": "Năm 395, đế quốc La Mã chính thức chia thành Đông La Mã và Tây La Mã; năm 476 Tây La Mã sụp đổ.", "level": "NB", "options": ["A. Năm 27 TCN.", "B. Năm 476.", "C. Năm 395.", "D. Năm 1453."], "points": 0.25, "q": "Đế quốc La Mã bị chia thành hai phần Đông và Tây vào năm nào?", "type": "mcq"}, {"answer": "C", "explain": "Ma-ha-bha-ra-ta và Ra-ma-y-a-na là hai bộ sử thi nổi tiếng của Ấn Độ cổ đại, có ảnh hưởng sâu rộng ở nhiều nước châu Á.", "level": "TH", "options": ["A. Trung Hoa.", "B. Ai Cập.", "C. Ấn Độ.", "D. Hi Lạp."], "points": 0.25, "q": "Hai bộ sử thi Ma-ha-bha-ra-ta và Ra-ma-y-a-na là thành tựu văn học của nền văn minh nào?", "type": "mcq"}, {"answer": "B", "explain": "Điêu khắc Hi Lạp – La Mã chú trọng miêu tả chân thực, tôn vinh vẻ đẹp và sức mạnh con người, khác với phong cách ước lệ, tôn nghiêm của nghệ thuật phương Đông.", "level": "TH", "options": ["A. Ai Cập.", "B. Hi Lạp – La Mã.", "C. Ấn Độ.", "D. Trung Hoa."], "points": 0.25, "q": "Nghệ thuật điêu khắc tả thực, tôn vinh vẻ đẹp con người là thành tựu nổi bật của nền văn minh nào?", "type": "mcq"}, {"answer": "D", "explain": "La bàn giúp tàu thuyền xác định phương hướng trên biển, thúc đẩy các cuộc phát kiến địa lí và giao lưu hàng hải giữa các châu lục từ thế kỉ XV.", "level": "VD", "options": ["A. Dùng để đo thời gian trong ngày.", "B. Dùng trong y học châm cứu.", "C. Chỉ dùng để xem hướng xây nhà.", "D. Thúc đẩy các cuộc phát kiến địa lí và giao lưu hàng hải."], "points": 0.25, "q": "La bàn — một trong tứ đại phát minh của Trung Hoa — có ý nghĩa quan trọng nào đối với lịch sử thế giới?", "type": "mcq"}, {"answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng theo SGK. c) Sai: cả phương Đông và phương Tây đều sáng tạo chữ viết (tượng hình, hình nêm, alphabet, Latin...).", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về văn minh phương Đông và phương Tây:", "statements": ["a) Văn minh phương Đông ra đời sớm hơn văn minh phương Tây.", "b) Phương Đông gắn với sông lớn và nông nghiệp, phương Tây gắn với biển và thương nghiệp.", "c) Cả phương Đông và phương Tây đều không sáng tạo ra chữ viết.", "d) Luật pháp là thành tựu chung của cả phương Đông (Hammurabi) và phương Tây (La Mã)."], "type": "truefalse"}, {"answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng theo SGK. c) Sai: thời cộng hòa, La Mã do các chấp chính quan đứng đầu; chế độ hoàng đế chỉ xuất hiện từ thời đế chế (27 TCN).", "level": "VD", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trương Hành thời nhà Hán đã chế tạo địa động nghi để dự báo động đất.", "b) Phật giáo từ Ấn Độ được truyền bá rộng rãi sang nhiều nước châu Á.", "c) Nhà nước La Mã thời cộng hòa do một hoàng đế đứng đầu.", "d) Hệ thống đường sá quy mô lớn của La Mã góp phần quản lí đế chế rộng lớn."], "type": "truefalse"}, {"answer": "Tần Thủy Hoàng", "explain": "Năm 221 TCN, Tần Thủy Hoàng (Doanh Chính) thống nhất Trung Hoa, lập ra nhà Tần — triều đại phong kiến tập quyền đầu tiên trong lịch sử Trung Hoa.", "level": "TH", "points": 0.5, "q": "Người thống nhất Trung Hoa, lập ra nhà Tần vào năm 221 TCN là ai?", "type": "short"}, {"answer": "Champollion", "explain": "Năm 1822, học giả người Pháp Săm-po-li-ông (  Lạp cổ đại, được tôn vinh là cha đẻ của y học.", "level": "VD", "points": 0.5, "q": "Thầy thuốc Hy Lạp cổ đại được tôn vinh là cha đẻ của y học có tên phiên âm quốc tế là gì?", "type": "short"}, {"answer": "Herodotus", "explain": "Hê-rô-đốt (Herodotus) là sử gia vĩ đại của Hy Lạp cổ đại, được mệnh danh là cha đẻ của sử học với bộ Lịch sử về các cuộc chiến tranh Hy Lạp — Ba Tư.", "level": "VDC", "points": 0.5, "q": "Sử gia Hy Lạp được mệnh danh là cha đẻ của sử học có tên phiên âm quốc tế là gì?", "type": "short"}]}, {"name": "Đề 8", "questions": [{"answer": "A", "explain": "Lưỡng Hà nghĩa là vùng đất giữa hai con sông Ti-gơ và Ơ-phrát — cái nôi của văn minh Lưỡng Hà.", "level": "NB", "options": ["A. Sông Ti-gơ và sông Ơ-phrát.", "B. Sông Nin và sông Công-gô.", "C. Sông Ấn và sông Hằng.", "D. Sông Hoàng Hà và sông Trường Giang."], "points": 0.25, "q": "Hai dòng sông nào tạo nên vùng Lưỡng Hà?", "type": "mcq"}, {"answer": "A", "explain": "Rô-ma vừa là tên thành phố vừa là kinh đô của nhà nước La Mã cổ đại.", "level": "NB", "options": ["A. Rô-ma.", "B. A-ten.", "C. Ba-bi-lon.", "D. Trường An."], "points": 0.25, "q": "Kinh đô của nhà nước La Mã cổ đại là thành phố nào?", "type": "mcq"}, {"answer": "A", "explain": "Nho giáo do Khổng Tử sáng lập, từ thời nhà Hán trở thành hệ tư tưởng chính thống của chế độ phong kiến Trung Hoa.", "level": "NB", "options": ["A. Nho giáo.", "B. Phật giáo.", "C. Hin-đu giáo.", "D. Ki-tô giáo."], "points": 0.25, "q": "Học thuyết nào do Khổng Tử sáng lập, trở thành hệ tư tưởng chính thống của Trung Hoa phong kiến?", "type": "mcq"}, {"answer": "A", "explain": "Người Ấn Độ cổ đại sáng tạo ra chữ Phạn (Sanskrit) — chữ viết cổ có ảnh hưởng sâu rộng ở Nam Á và Đông Nam Á.", "level": "TH", "options": ["A. Chữ Phạn.", "B. Chữ tượng hình.", "C. Chữ hình nêm.", "D. Chữ Latin."], "points": 0.25, "q": "Người Ấn Độ cổ đại sáng tạo ra loại chữ viết nào?", "type": "mcq"}, {"answer": "A", "explain": "Người Lưỡng Hà sáng tạo hệ đếm 60; đến nay nhân loại vẫn : "VD", "points": 0.5, "q": "Khu vườn nổi tiếng được coi là kì quan của văn minh Lưỡng Hà có tên gọi là gì?", "type": "short"}, {"answer": "Pythagoras", "explain": "Pi-ta-go (Pythagoras) là nhà toán học vĩ đại của Hy Lạp cổ đại, nổi tiếng với định lí về tam giác vuông mang tên ông.", "level": "VDC", "points": 0.5, "q": "Nhà toán học Hy Lạp nổi tiếng với định lí về tam giác vuông có tên phiên âm quốc tế là gì?", "type": "short"}]}, {"name": "Đề 9", "questions": [{"answer": "A", "explain": "Nhà Hạ là triều đại đầu tiên trong lịch sử Trung Hoa, mở đầu thời kì nhà nước chiếm hữu nô lệ ở Trung Hoa.", "level": "NB", "options": ["A. Nhà Hạ.", "B. Nhà Thương.", "C. Nhà Chu.", "D. Nhà Tần."], "points": 0.25, "q": "Triều đại đầu tiên trong lịch sử Trung Hoa là triều đại nào?", "type": "mcq"}, {"answer": "A", "explain": "Ai Cập cổ đại nằm ở vùng Đông Bắc châu Phi, bên lưu vực sông Nin.", "level": "NB", "options": ["A. Đông Bắc châu Phi.", "B. Tây Nam châu Á.", "C. Nam Âu.", "D. Đông Nam Á."], "points": 0.25, "q": "Ai Cập cổ đại nằm ở khu vực nào?", "type": "mcq"}, {"answer": "A", "explain": "Kim tự tháp — lăng mộ của các Pha-ra-ông — là biểu tượng rực rỡ nhất của văn minh Ai Cập cổ đại.", "level": "NB", "options": ["A. Kim tự tháp.", "B. Đền Pác-tê-nông.", "C. Đấu trường Cô-lô-sê.", "D. Vạn Lí Trường Thành."], "points": 0.25, "q": "Công trình kiến trúc nào là biểu tượng của văn minh Ai Cập cổ đại?", "type": "mcq"}, {"answer": "A", "explain": "Nho giáo (Khổng Tử), Đạo giáo (Lão Tử), Pháp gia (Hàn Phi)... đều ra đời ở Trung Hoa, tạo nên thời kì trăm hoa đua nở về tư tưởng.", "level": "TH", "options": ["A. Trung Hoa.", "B. Ấn Độ.", "C. Ai Cập.", "D. La Mã."], "points": 0.25, "q": "Nho giáo, Đạo giáo, Pháp gia đều là các học thuyết ra đời ở nền văn minh nào?", "type": "mcq"}, {"answer": "A", "explain": "Người Hy Lạp cổ đại sáng tạo ra chữ cái (an-pha-bê); chữ Latin của La Mã phát triển trên cơ sở đó.", "level": "TH", "options": ["A. Chữ cái.", "B. Chữ tượng hình.", "C. Chữ hình nê
