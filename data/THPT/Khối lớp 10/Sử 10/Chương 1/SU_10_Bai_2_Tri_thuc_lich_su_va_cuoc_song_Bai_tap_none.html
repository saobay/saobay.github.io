 ["A. Quang Trung – Nguyễn Huệ", "B. Trần Hưng Đạo", "C. Lê Lợi", "D. Ngô Quyền"], "answer": "A", "explain": "Lễ hội Đống Đa kỷ niệm chiến thắng của Quang Trung – Nguyễn Huệ trước quân Thanh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngày 22/12 hằng năm là ngày", "options": ["B. Quốc khánh", "A. thành lập Quân đội nhân dân Việt Nam", "C. Nhà giáo Việt Nam", "D. Giải phóng miền Nam"], "answer": "A", "explain": "Ngày 22/12/1944 là ngày thành lập Quân đội nhân dân Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tri thức lịch sử của mỗi người được hình thành chủ yếu qua", "options": ["A. học tập và trải nghiệm từ nhiều nguồn khác nhau", "B. học thuộc lòng sách giáo khoa", "C. xem phim giải trí", "D. nghe nhạc"], "answer": "A", "explain": "Tri thức lịch sử hình thành qua học tập và trải nghiệm từ nhiều nguồn khác nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung của các vai trò của tri thức lịch sử là", "options": ["B. đều chỉ liên quan đến quá khứ", "A. đều hướng tới phục vụ cuộc sống con người hôm nay và mai sau", "C. đều mang tính lí thuyết suông", "D. đều không thể kiểm chứng"], "answer": "A", "explain": "Mọi vai trò của tri thức lịch sử đều hướng tới phục vụ cuộc sống con người hôm nay và mai sau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói lễ hội là nơi tri thức lịch sử được lưu truyền sống động?", "options": ["A. Vì qua lễ hội, cộng đồng cùng ôn lại và truyền cho nhau hiểu biết về quá khứ", "B. Vì lễ hội rất đông vui", "C. Vì lễ hội có nhiều món ăn ngon", "D. Vì lễ hội được tổ chức hằng năm"], "answer": "A", "explain": "Qua lễ hội, cộng đồng cùng ôn lại và truyền cho nhau hiểu biết về quá khứ một cách sống động.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một du khách nước ngoài muốn tìm hiểu về kinh đô của Việt Nam thời Lý – Trần. Em nên giới thiệu địa điểm nào?", "options": ["B. Cố đô Huế", "A. Hoàng thành Thăng Long", "C. Phố cổ Hội An", "D. Thánh địa Mỹ Sơn"], "answer": "A", "explain": "Hoàng thành Thăng Long là kinh đô của Việt Nam thời Lý – Trần.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho các nhận định về nguồn hình thành tri thức lịch sử. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Tri thức lịch sử chỉ dành cho học sinh.", "b) Mọi người đều có thể có tri thức lịch sử từ nhiều nguồn.", "c) Nghe ông bà kể chuyện xưa giúp hình thành tri thức lịch sử.", "d) Phim ảnh không thể cung cấp tri thức lịch sử."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai vì mọi người đều có thể có tri thức lịch sử. d) Sai vì phim ảnh, đặc biệt là phim tư liệu, cũng cung cấp tri thức lịch sử.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho các nhận định về bảo tồn di sản. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Hiểu giá trị di sản giúp con người trân trọng và bảo vệ di sản.", "b) Quảng bá di sản góp phần giới thiệu hình ảnh đất nước với bạn bè quốc tế.", "c) Bảo tồn di sản là trách nhiệm của riêng nhà nước.", "d) Mỗi người dân đều có thể góp phần bảo tồn di sản văn hóa."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai vì bảo tồn di sản là trách nhiệm chung của toàn xã hội, trong đó có mỗi người dân.", "points": 1}, {"type": "short", "level": "VD", "q": "Ngày lễ nào được gọi là Quốc lễ của Việt Nam?", "answer": "Giỗ Tổ Hùng Vương", "explain": "Ngày Giỗ Tổ Hùng Vương (10/3 âm lịch) được công nhận là Quốc lễ của Việt Nam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hoàn thành câu: \"Mỗi di tích là một ...\", kể câu chuyện về một thời đại.", "answer": "trang sử bằng đá", "explain": "Mỗi di tích là một \"trang sử bằng đá\", kể câu chuyện về một thời đại.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Câu nào sau đây là tri thức lịch sử?", "options": ["B. Biết giải phương trình bậc hai", "A. Biết về Cách mạng tháng Tám năm 1945", "C. Biết công thức tính diện tích", "D. Biết tên các hành tinh"], "answer": "A", "explain": "Biết về Cách mạng tháng Tám năm 1945 là hiểu biết về quá khứ, tức là tri thức lịch sử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thành nhà Hồ, Di sản văn hóa thế giới, thuộc tỉnh nào?", "options": ["A. Thanh Hóa", "B. Nghệ An", "C. Hà Tĩnh", "D. Ninh Bình"], "answer": "A", "explain": "Thành nhà Hồ thuộc tỉnh Thanh Hóa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Di sản nào sau đây là Di sản văn hóa thế giới ở miền Trung Việt Nam?", "options": ["B. Hoàng thành Thăng Long", "C. Vịnh Hạ Long", "A. Cố đô Huế", "D. Nhà thờ Đức Bà"], "answer": "A", "explain": "Cố đô Huế là Di sản văn hóa thế giới ở miền Trung Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Học sinh tham gia dọn vệ sinh, bảo vệ di tích ở địa phương thể hiện vai trò nào của tri thức lịch sử?", "options": ["A. Bảo tồn và phát huy di sản văn hóa", "B. Rút bài học kinh nghiệm", "C. Giáo dục truyền thống yêu nước", "D. Định hướng cho tương lai"], "answer": "A", "explain": "Tham gia bảo vệ di tích là góp phần bảo tồn và phát huy di sản văn hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao tri thức lịch sử có thể giúp rút ra bài học kinh nghiệm?", "options": ["B. Vì quá khứ luôn đúng", "A. Vì quá khứ chứa đựng cả thành công và sai lầm để thế hệ sau kế thừa, tránh lặp lại", "C. Vì tương lai lặp lại y hệt quá khứ", "D. Vì không cần suy ngẫm"], "answer": "A", "explain": "Quá khứ chứa đựng cả thành công và sai lầm; hiểu quá khứ giúp kế thừa thành công và tránh lặp lại sai lầm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong giờ học, cô giáo kể chuyện anh hùng Nguyễn Văn Trỗi rồi hỏi: \"Em học được gì từ tấm gương đó?\" Câu hỏi của cô hướng tới vai trò nào của tri thức lịch sử?", "options": ["A. Giáo dục truyền thống yêu nước", "B. Rút bài học kinh nghiệm", "C. Bảo tồn di sản văn hóa", "D. Đoàn kết các dân tộc"], "answer": "A", "explain": "Học tập tấm gương anh hùng để bồi dưỡng lòng yêu nước thuộc vai trò giáo dục truyền thống yêu nước.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho các nhận định về tri thức lịch sử. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Biết về truyền thuyết Thánh Gióng là có tri thức lịch sử về thời Hùng Vương.", "b) Tri thức lịch sử giúp con người hiểu cội nguồn dân tộc.", "c) Người không học lịch sử vẫn có thể có tri thức lịch sử từ đời sống.", "d) Tri thức lịch sử làm con người bi quan về tương lai."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai vì tri thức lịch sử giúp con người có định hướng đúng đắn và niềm tin vào tương lai.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho các nhận định về ngày Giỗ Tổ Hùng Vương. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Ngày Giỗ Tổ Hùng Vương là ngày 10/3 âm lịch.", "b) Câu ca về ngày Giỗ Tổ thể hiện đạo lí \"uống nước nhớ nguồn\".", "c) Lễ hội Đền Hùng không liên quan đến tri thức lịch sử.", "d) Mọi người Việt đều có trách nhiệm nhớ về cội nguồn dân tộc."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai vì lễ hội Đền Hùng là nơi tri thức lịch sử về thời đại Hùng Vương được lưu truyền sống động.", "points": 1}, {"type": "short", "level": "VDC", "q": "Ngày 2/9 hằng năm kỷ niệm ngày lễ nào của dân tộc?", "answer": "Quốc khánh", "explain": "Ngày 2/9 là ngày Quốc khánh của nước Cộng hòa xã hội chủ nghĩa Việt Nam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hoàn thành câu: \"Tri thức lịch sử giúp con người ...\", biết điều gì nên làm, điều gì nên tránh.", "answer": "rút ra bài học kinh nghiệm", "explain": "Tri thức lịch sử giúp con người rút ra bài học kinh nghiệm từ quá khứ.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Tri thức về quá khứ của dân tộc, đất nước được gọi là", "options": ["A. tri thức lịch sử", "B. tri thức toán học", "C. tri thức vật lí", "D. tri thức sinh học"], "answer": "A", "explain": "Tri thức về quá khứ của dân tộc, đất nước chính là tri thức lịch sử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thánh địa Mỹ Sơn là di sản của nền văn hóa nào?", "options": ["B. Văn hóa Đông Sơn", "A. Văn hóa Chăm-pa", "C. Văn hóa Óc Eo", "D. Văn hóa Sa Huỳnh"], "answer": "A", "explain": "Thánh địa Mỹ Sơn là di sản tiêu biểu của nền văn hóa Chăm-pa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phố cổ Hội An, Di sản văn hóa thế giới, thuộc tỉnh nào?", "options": ["A. Quảng Nam", "B. Quảng Ngãi", "C. Bình Định", "D. Thừa Thiên Huế"], "answer": "A", "explain": "Phố cổ Hội An thuộc tỉnh Quảng Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nào sau đây không phải là vai trò của tri thức lịch sử?", "options": ["B. Rút bài học kinh nghiệm", "C. Giáo dục truyền thống yêu nước", "A. Giúp con người quên đi quá khứ đau thương", "D. Bảo tồn di sản văn hóa"], "answer": "A", "explain": "Tri thức lịch sử giúp con người nhớ và hiểu đúng quá khứ chứ không giúp quên đi quá khứ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một học sinh nói: \"Em yêu quê hương hơn sau khi tìm hiểu về lịch sử quê mình.\" Đây là vai trò nào của tri thức lịch sử?", "options": ["A. Giáo dục truyền thống yêu nước", "B. Rút bài học kinh nghiệm", "C. Bảo tồn di sản văn hóa", "D. Định hướng cho tương lai"], "answer": "A", "explain": "Hiểu biết về lịch sử quê hương bồi dưỡng tình yêu quê hương, đất nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Để giới thiệu với bạn bè quốc tế về văn hóa Việt Nam, em nên", "options": ["B. chỉ nói về ẩm thực", "A. giới thiệu các di sản văn hóa như Cố đô Huế, Hội An", "C. chỉ nói về kinh tế", "D. không cần giới thiệu gì"], "answer": "A", "explain": "Di sản văn hóa như Cố đô Huế, Hội An là những hình ảnh tiêu biểu để giới thiệu văn hóa Việt Nam.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho các nhận định về cầu nối của tri thức lịch sử. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Tri thức lịch sử là cầu nối giữa quá khứ, hiện tại và tương lai.", "b) Hiểu quá khứ giúp sống tốt hơn trong hiện tại.", "c) Tri thức lịch sử chỉ có ích cho quá khứ, không ích gì cho tương lai.", "d) Định hướng tương lai cần dựa trên hiểu biết về quá khứ và hiện tại."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai vì tri thức lịch sử giúp định hướng cho hiện tại và tương lai.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho các nhận định về bảo tàng và ngày lễ. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Bảo tàng Hồ Chí Minh trưng bày về cuộc đời, sự nghiệp của Chủ tịch Hồ Chí Minh.", "b) Tham quan bảo tàng giúp học sinh học sử trực quan.", "c) Di tích lịch sử chỉ có giá trị tham quan, du lịch.", "d) Ngày 30/4 là dịp tri ân các thế hệ cha anh."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai vì di tích còn là \"trang sử bằng đá\", nơi giáo dục truyền thống cho thế hệ trẻ.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu tên một di sản văn hóa thế giới ở Thủ đô Hà Nội.", "answer": "Hoàng thành Thăng Long", "explain": "Hoàng thành Thăng Long ở Hà Nội được UNESCO công nhận là Di sản văn hóa thế giới.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hoàn thành câu: \"Hiểu biết về lịch sử, văn hóa các dân tộc khác giúp tăng cường ...\"", "answer": "đoàn kết, hữu nghị", "explain": "Hiểu biết lẫn nhau giúp tăng cường tình đoàn kết, hữu nghị giữa các dân tộc.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Nguồn nào sau đây giúp hình thành tri thức lịch sử?", "options": ["B. Chỉ sách giáo khoa", "C. Chỉ internet", "A. Tất cả các nguồn: sách vở, bảo tàng, lời kể của người lớn tuổi", "D. Chỉ phim ảnh"], "answer": "A", "explain": "Tri thức lịch sử hình thành từ nhiều nguồn: sách vở, bảo tàng, di tích, lời kể của người lớn tuổi...", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cố đô Huế gắn với triều đại nào?", "options": ["A. Nhà Nguyễn", "B. Nhà Trần", "C. Nhà Lê", "D. Nhà Lý"], "answer": "A", "explain": "Cố đô Huế là kinh đô của triều Nguyễn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lễ hội Lim nổi tiếng ở tỉnh nào?", "options": ["B. Bắc Giang", "A. Bắc Ninh", "C. Hải Dương", "D. Hưng Yên"], "answer": "A", "explain": "Hội Lim là lễ hội của vùng quan họ Bắc Ninh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cần giáo dục truyền thống yêu nước cho thế hệ trẻ?", "options": ["A. Để bồi dưỡng lòng tự hào dân tộc và ý thức trách nhiệm với đất nước", "B. Để các em chỉ biết về quá khứ", "C. Để các em quên đi hiện tại", "D. Để thay thế các môn học khác"], "answer": "A", "explain": "Giáo dục truyền thống yêu nước bồi dưỡng lòng tự hào dân tộc và ý thức trách nhiệm với đất nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tri thức lịch sử góp phần bảo tồn di sản bằng cách nào?", "options": ["B. Bằng cách cấm mọi người đến di tích", "A. Giúp con người hiểu giá trị di sản để trân trọng, bảo vệ và phát huy", "C. Bằng cách xây dựng lại hoàn toàn di tích", "D. Bằng cách giữ bí mật về di tích"], "answer": "A", "explain": "Hiểu giá trị di sản, con người mới trân trọng, bảo vệ và phát huy giá trị của di sản.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Xã em có ngôi đình cổ đang xuống cấp. Là học sinh hiểu biết về giá trị di sản, em nên", "options": ["A. tuyên truyền, vận động mọi người cùng bảo vệ, tu bổ đình", "B. mặc kệ vì đó là việc của người lớn", "C. đề nghị phá bỏ để xây mới", "D. không quan tâm"], "answer": "A", "explain": "Hiểu giá trị di sản, học sinh nên tuyên truyền và vận động mọi người cùng bảo vệ di tích.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho các nhận định về lễ hội truyền thống. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Lễ hội Đền Gióng gắn với truyền thuyết Thánh Gióng.", "b) Hội Lim là lễ hội của vùng quan họ Bắc Ninh.", "c) Lễ hội không chứa đựng tri thức lịch sử.", "d) Tham gia lễ hội giúp hiểu thêm về truyền thống dân tộc."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai vì lễ hội là nơi tri thức lịch sử được lưu truyền sống động trong cộng đồng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho các nhận định nâng cao. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Tri thức lịch sử của mỗi người chỉ hình thành ở nhà trường.", "b) Đời sống hằng ngày cũng là nguồn tri thức lịch sử phong phú.", "c) Người hiểu biết lịch sử thường có ý thức trách nhiệm hơn với cộng đồng.", "d) Tri thức lịch sử càng nhiều thì con người càng xa rời thực tế."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai vì tri thức lịch sử hình thành từ nhiều nguồn trong đời sống. d) Sai vì tri thức lịch sử giúp con người sống tốt hơn trong thực tế.", "points": 1}, {"type": "short", "level": "VDC", "q": "Lễ hội Đền Gióng được tổ chức để tưởng nhớ ai?", "answer": "Thánh Gióng", "explain": "Lễ hội Đền Gióng tưởng nhớ Thánh Gióng, anh hùng chống giặc ngoại xâm thời Hùng Vương.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Di tích nào được xem là kinh đô của triều Nguyễn?", "answer": "Cố đô Huế", "explain": "Cố đô Huế là kinh đô của triều Nguyễn và là Di sản văn hóa thế giới.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Câu nào sau đây thể hiện tri thức lịch sử?", "options": ["B. \"Nước sôi ở 100 độ C\"", "A. \"Năm 1945, Cách mạng tháng Tám thành công\"", "C. \"Diện tích hình tròn bằng pi nhân r bình phương\"", "D. \"Trái Đất quay quanh Mặt Trời\""], "answer": "A", "explain": "\"Năm 1945, Cách mạng tháng Tám thành công\" là hiểu biết về quá khứ, tức là tri thức lịch sử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bảo tàng Lịch sử quốc gia trưng bày nhiều hiện vật của", "options": ["A. văn hóa Đông Sơn và các triều đại phong kiến", "B. thời hiện đại", "C. nước ngoài", "D. tương lai"], "answer": "A", "explain": "Bảo tàng Lịch sử quốc gia trưng bày nhiều hiện vật từ văn hóa Đông Sơn đến các triều đại phong kiến.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngày Quốc khánh Việt Nam là ngày", "options": ["B. 30/4", "A. 2/9", "C. 22/12", "D. 27/7"], "answer": "A", "explain": "Ngày 2/9/1945 là ngày Quốc khánh của Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa tri thức lịch sử và cuộc sống là", "options": ["B. tri thức lịch sử tách rời cuộc sống", "A. tri thức lịch sử bắt nguồn từ cuộc sống và phục vụ cuộc sống", "C. cuộc sống không cần tri thức lịch sử", "D. tri thức lịch sử cản trở cuộc sống"], "answer": "A", "explain": "Tri thức lịch sử bắt nguồn từ cuộc sống và phục vụ cuộc sống con người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Học sinh cần làm gì để góp phần bảo tồn di sản văn hóa?", "options": ["A. Tìm hiểu giá trị di sản, tuyên truyền và tham gia bảo vệ di sản", "B. Không quan tâm đến di sản", "C. Xả rác ở khu di tích", "D. Vẽ bậy lên di tích"], "answer": "A", "explain": "Học sinh góp phần bảo tồn di sản bằng cách tìm hiểu giá trị, tuyên truyền và tham gia bảo vệ di sản.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một bạn nước ngoài hỏi về Tết Nguyên đán của Việt Nam. Em giải thích dựa trên tri thức nào?", "options": ["B. Tri thức toán học", "A. Tri thức lịch sử – văn hóa về phong tục truyền thống dân tộc", "C. Tri thức vật lí", "D. Không cần tri thức gì"], "answer": "A", "explain": "Tết Nguyên đán là phong tục truyền thống nên cần tri thức lịch sử – văn hóa để giải thích.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho các nhận định về ý nghĩa của tri thức lịch sử. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Tri thức lịch sử giúp con người nhận thức sâu sắc về cội nguồn dân tộc.", "b) Tri thức lịch sử hun đúc ý chí vươn lên cho thế hệ trẻ.", "c) Tri thức lịch sử khiến con người sống hoài niệm, không hướng tới tương lai.", "d) Tri thức lịch sử là hành trang tinh thần của mỗi người."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai vì tri thức lịch sử giúp con người định hướng cho hiện tại và tương lai.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho các nhận định về lễ hội và di sản. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Lễ hội c."], "answer": ["T", "F", "T", "T"], "explain": "b) Sai vì thông tin trên mạng xã hội cần được kiểm chứng, không phải tất cả đều đáng tin cậy.", "points": 1}, {"type": "short", "level": "VDC", "q": "Di sản thế giới gồm hai loại chính là di sản văn hóa và di sản ...", "answer": "thiên nhiên", "explain": "Di sản thế giới gồm di sản văn hóa và di sản thiên nhiên.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hoàn thành câu: \"Bảo tàng là ... tri thức lịch sử trực quan.\"", "answer": "kho", "explain": "Bảo tàng được ví như \"kho\" tri thức lịch sử trực quan.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Cầu nối giữa quá khứ, hiện tại và tương lai là", "options": ["B. tri thức toán học", "A. tri thức lịch sử", "C. tri thức vật lí", "D. tri thức văn học"], "answer": "A", "explain": "Tri thức lịch sử là cầu nối giữa quá khứ, hiện tại và tương lai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Truyền thống tốt đẹp nào được nhắc đến qua câu chuyện Thánh Gióng?", "options": ["A. Tinh thần chống giặc ngoại xâm", "B. Tinh thần hiếu học", "C. Tinh thần cần cù lao động", "D. Tinh thần thương người"], "answer": "A", "explain": "Thánh Gióng là biểu tượng của tinh thần chống giặc ngoại xâm của dân tộc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngày 27/7 hằng năm là ngày", "options": ["A. Thương binh – Liệt sĩ", "B. Quốc khánh", "C. Nhà giáo Việt Nam", "D. Phụ nữ Việt Nam"], "answer": "A", "explain": "Ngày 27/7 là ngày Thương binh – Liệt sĩ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vai trò quan trọng nhất của tri thức lịch sử đối với học sinh là", "options": ["B. giúp các em giải trí", "A. giúp các em hiểu cội nguồn, bồi dưỡng lòng yêu nước và định hướng tương lai", "C. giúp các em kiếm tiền", "D. giúp các em nổi tiếng"], "answer": "A", "explain": "Với học sinh, tri thức lịch sử giúp hiểu cội nguồn, bồi dưỡng lòng yêu nước và định hướng tương lai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận định nào sau đây sai về tri thức lịch sử?", "options": ["A. \"Tri thức lịch sử chỉ có giá trị trong quá khứ\"", "B. \"Tri thức lịch sử giúp rút bài học kinh nghiệm\"", "C. \"Tri thức lịch sử giáo dục truyền thống yêu nước\"", "D. \"Tri thức lịch sử giúp định hướng tương lai\""], "answer": "A", "explain": "Nhận định sai vì tri thức lịch sử có giá trị với hiện tại và tương lai, không chỉ với quá khứ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong buổi sinh hoạt lớp về chủ đề \"Uống nước nhớ nguồn\", em nên chia sẻ", "options": ["B. chuyện phim ảnh giải trí", "A. những hiểu biết về truyền thống đấu tranh và đạo lí của dân tộc", "C. chuyện đời tư của bạn bè", "D. tin tức thể thao"], "answer": "A", "explain": "Chủ đề \"Uống nước nhớ nguồn\" phù hợp với những hiểu biết về truyền thống và đạo lí dân tộc.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho các nhận định tổng hợp về Bài 2. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Tri thức lịch sử gồm hiểu biết về sự kiện, nhân vật và quá trình phát triển của xã hội.", "b) Tri thức lịch sử có vai trò to lớn với mỗi cá nhân và dân tộc.", "c) Tri thức lịch sử làm con người thụ động, ỷ lại vào quá khứ.", "d) Học sử tốt giúp công dân có trách nhiệm hơn với đất nước."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai vì tri thức lịch sử giúp con người chủ động rút kinh nghiệm và định hướng hành động.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho các nhận định về vận dụng tri thức lịch sử. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Di tích, lễ hội, bảo tàng đều là những \"địa chỉ\" của tri thức lịch sử.", "b) Chỉ cần học thuộc lòng sự kiện là đã có tri thức lịch sử đầy đủ.", "c) Tri thức lịch sử phải gắn với suy ngẫm và vận dụng vào cuộc sống.", "d) Quên lịch sử dân tộc là có lỗi với các thế hệ cha anh."], "answer": ["T", "F", "T", "T"], "explain": "b) Sai vì tri thức lịch sử cần sự hiểu biết sâu sắc, suy ngẫm và vận dụng chứ không chỉ học thuộc
