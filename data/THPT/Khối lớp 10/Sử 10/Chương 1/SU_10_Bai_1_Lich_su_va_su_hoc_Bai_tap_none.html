 viết nên thuộc sử liệu chữ viết.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu ba chức năng của sử học.", "answer": "Nhận thức, giáo dục và dự báo", "explain": "Ba chức năng cơ bản của sử học là nhận thức, giáo dục và dự báo, gắn bó chặt chẽ với nhau.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Nhiệm vụ của sử học là", "options": ["A. tái hiện quá khứ một cách khách quan, trung thực", "B. sáng tạo thêm các sự kiện cho hấp dẫn", "C. ca ngợi mọi nhân vật trong quá khứ", "D. dự đoán chính xác tương lai"], "answer": "A", "explain": "Nhiệm vụ của sử học là tái hiện quá khứ một cách khách quan, trung thực và phát hiện quy luật phát triển.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Di chỉ khảo cổ, công cụ lao động của người xưa thuộc loại sử liệu nào?", "options": ["B. Sử liệu chữ viết", "A. Sử liệu hiện vật", "C. Sử liệu truyền miệng", "D. Sử liệu âm thanh"], "answer": "A", "explain": "Di chỉ khảo cổ và công cụ lao động là những đồ vật còn sót lại nên thuộc sử liệu hiện vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phương pháp phân tích, tổng hợp, khái quát hóa để tìm ra bản chất, quy luật của lịch sử là", "options": ["A. phương pháp lô-gíc", "B. phương pháp lịch sử", "C. phương pháp điều tra", "D. phương pháp thống kê"], "answer": "A", "explain": "Phương pháp lô-gíc phân tích, tổng hợp, khái quát hóa để tìm ra bản chất và quy luật vận động của lịch sử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây thể hiện chức năng dự báo của sử học?", "options": ["B. Học về Hai Bà Trưng để bồi dưỡng lòng yêu nước", "A. Từ quy luật phát triển của lịch sử, con người định hướng đúng đắn cho tương lai", "C. Tìm hiểu thời Bắc thuộc để hiểu truyền thống đấu tranh", "D. Sưu tầm sử liệu để tái hiện quá khứ"], "answer": "A", "explain": "Chức năng dự báo là trên cơ sở nhận thức quy luật lịch sử để định hướng cho tương lai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhà sử học không thể trực tiếp quan sát quá khứ nên phải dựa vào", "options": ["A. các sử liệu, tức là dấu tích của quá khứ còn lưu giữ đến nay", "B. trí tưởng tượng của bản thân", "C. các câu chuyện được thêu dệt thêm", "D. ý kiến chủ quan của người đương thời"], "answer": "A", "explain": "Nhà sử học dựa vào các sử liệu, tức là dấu tích của quá khứ còn lưu giữ đến nay, để tái hiện lịch sử.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một bảo tàng trưng bày các bức ảnh chụp về Hà Nội những năm kháng chiến chống Pháp. Những bức ảnh này thuộc loại sử liệu nào?", "options": ["A. Sử liệu truyền miệng", "C. Sử liệu chữ viết", "B. Sử liệu hình ảnh", "D. Sử liệu hiện vật"], "answer": "B", "explain": "Ảnh chụp thuộc nhóm sử liệu hình ảnh, âm thanh.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho các nhận định về chức năng của sử học. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Chức năng giáo dục bồi dưỡng lòng yêu nước, niềm tự hào dân tộc.", "b) Chức năng nhận thức giúp con người hiểu biết về quá khứ.", "c) Ba chức năng của sử học tồn tại tách rời, không liên quan đến nhau.", "d) Chức năng dự báo dựa trên việc nhận thức quy luật phát triển của lịch sử."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai vì ba chức năng của sử học gắn bó chặt chẽ và bổ sung cho nhau.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho các nhận định về các loại sử liệu. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Bia đá, sắc phong thuộc sử liệu chữ viết.", "b) Tiền cổ, vũ khí của người xưa thuộc sử liệu hiện vật.", "c) Dân ca quan họ thuộc sử liệu hiện vật.", "d) Băng ghi âm lời kể của nhân chứng lịch sử thuộc sử liệu hình ảnh, âm thanh."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai vì dân ca quan họ được lưu truyền qua lời ca nên thuộc sử liệu truyền miệng.", "points": 1}, {"type": "short", "level": "VD", "q": "Tên gọi của phương pháp nghiên cứu đòi hỏi đặt sự kiện vào đúng bối cảnh thời gian của nó là gì?", "answer": "Phương pháp lịch sử", "explain": "Phương pháp lịch sử xem xét sự kiện trong bối cảnh lịch sử cụ thể, theo trình tự thời gian.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao nhà sử học phải kiểm chứng, đối chiếu nhiều nguồn sử liệu khi nghiên cứu?", "answer": "Để đảm bảo tính khách quan, trung thực của kết quả nghiên cứu", "explain": "Mỗi nguồn sử liệu có thể phiến diện nên cần kiểm chứng, đối chiếu nhiều nguồn để đảm bảo khách quan, trung thực.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Lịch sử bao gồm những lĩnh vực nào của đời sống xã hội?", "options": ["B. Chỉ lĩnh vực chính trị", "A. Mọi mặt: kinh tế, chính trị, văn hóa, tư tưởng, đời sống thường ngày", "C. Chỉ lĩnh vực văn hóa", "D. Chỉ lĩnh vực kinh tế"], "answer": "A", "explain": "Lịch sử bao gồm mọi mặt của đời sống xã hội loài người qua các thời đại.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ai là người nghiên cứu, tái hiện quá khứ dựa trên các sử liệu?", "options": ["A. Nhà sử học", "B. Nhà văn", "C. Nhà báo", "D. Nghệ sĩ"], "answer": "A", "explain": "Nhà sử học là người nghiên cứu, tái hiện quá khứ dựa trên các sử liệu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cụm từ \"toàn bộ quá khứ của xã hội loài người\" dùng để chỉ", "options": ["B. nhiệm vụ của sử học", "A. đối tượng nghiên cứu của sử học", "C. chức năng của sử học", "D. phương pháp của sử học"], "answer": "A", "explain": "Đối tượng nghiên cứu của sử học là toàn bộ quá khứ của xã hội loài người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận định nào sau đây đúng về mối quan hệ giữa Lịch sử và Sử học?", "options": ["A. Lịch sử là đối tượng, Sử học là khoa học nghiên cứu về đối tượng đó", "B. Lịch sử và Sử học là một", "C. Sử học là đối tượng của Lịch sử", "D. Hai khái niệm không liên quan đến nhau"], "answer": "A", "explain": "Lịch sử là quá khứ đã diễn ra (đối tượng), Sử học là khoa học nghiên cứu về đối tượng đó.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi sử dụng sử liệu, nhà sử học cần", "options": ["B. chỉ dùng một nguồn sử liệu duy nhất", "A. kiểm chứng, đối chiếu nhiều nguồn để đảm bảo khách quan, trung thực", "C. tin tuyệt đối vào mọi sử liệu", "D. bỏ qua các sử liệu truyền miệng"], "answer": "A", "explain": "Cần kiểm chứng, đối chiếu nhiều nguồn sử liệu để đảm bảo tính khách quan, trung thực.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong giờ học, cô giáo cho xem phim tư liệu về Cách mạng tháng Tám 1945 rồi yêu cầu rút ra bài học về nghệ thuật chớp thời cơ. Việc khái quát thành bài học này thuộc phương pháp nào?", "options": ["A. Phương pháp lịch sử", "B. Phương pháp lô-gíc", "C. Phương pháp thực nghiệm", "D. Phương pháp quan sát"], "answer": "B", "explain": "Rút ra bài học, khái quát thành quy luật từ các sự kiện cụ thể là phương pháp lô-gíc.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho các nhận định về đối tượng của sử học. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Đối tượng của sử học bao gồm các sự kiện lịch sử.", "b) Đối tượng của sử học bao gồm các nhân vật lịch sử.", "c) Đời sống thường ngày của người dân bình thường không thuộc đối tượng của sử học.", "d) Đối tượng của sử học chỉ giới hạn trong quá khứ của một quốc gia."], "answer": ["T", "T", "F", "F"], "explain": "c) Sai vì đời sống thường ngày của con người cũng thuộc đối tượng của sử học. d) Sai vì đối tượng của sử học là toàn bộ quá khứ của xã hội loài người.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho các nhận định về phương pháp nghiên cứu. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Nghiên cứu Cách mạng tháng Tám cần đặt trong bối cảnh Việt Nam và thế giới năm 1945.", "b) Đánh giá nhân vật lịch sử phải dựa trên bối cảnh lịch sử cụ thể của thời đại họ sống.", "c) Phương pháp lô-gíc chỉ dùng cho khoa học tự nhiên, không dùng trong sử học.", "d) Từ các sự kiện cụ thể có thể khái quát thành bài học, quy luật."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai vì phương pháp lô-gíc là một trong hai phương pháp nghiên cứu cơ bản của sử học.", "points": 1}, {"type": "short", "level": "VD", "q": "Kể tên loại sử liệu gồm ca dao, dân ca, truyền thuyết.", "answer": "Sử liệu truyền miệng", "explain": "Ca dao, dân ca, truyền thuyết được lưu truyền qua lời kể nên thuộc sử liệu truyền miệng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hoàn thành câu: \"Lịch sử là ... của xã hội loài người.\"", "answer": "quá khứ", "explain": "Lịch sử là quá khứ của xã hội loài người.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Cụm từ nào sau đây là định nghĩa đúng về Sử học?", "options": ["B. Quá khứ của xã hội loài người", "A. Khoa học nghiên cứu về lịch sử", "C. Những dấu tích của quá khứ", "D. Các phương pháp khai quật khảo cổ"], "answer": "A", "explain": "Sử học là khoa học nghiên cứu về lịch sử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sử liệu truyền miệng bao gồm", "options": ["A. truyền thuyết, thần thoại, ca dao, dân ca", "B. công cụ lao động, đồ gốm, tiền cổ", "C. bia đá, chiếu chỉ, nhật ký", "D. ảnh chụp, phim tư liệu"], "answer": "A", "explain": "Truyền thuyết, thần thoại, ca dao, dân ca được lưu truyền qua lời kể nên thuộc sử liệu truyền miệng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sử liệu hiện vật bao gồm", "options": ["B. truyền thuyết, ca dao", "A. công cụ lao động, đồ dùng, vũ khí, tiền cổ, di tích", "C. sách vở, văn bản", "D. phim ảnh, băng ghi âm"], "answer": "A", "explain": "Công cụ lao động, đồ dùng, vũ khí, tiền cổ, di tích là những đồ vật còn sót lại nên thuộc sử liệu hiện vật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau cơ bản giữa phương pháp lịch sử và phương pháp lô-gíc là", "options": ["A. phương pháp lịch sử xem xét sự kiện theo trình tự thời gian, phương pháp lô-gíc khái quát tìm quy luật", "B. phương pháp lịch sử tìm quy luật, phương pháp lô-gíc xem xét theo thời gian", "C. hai phương pháp hoàn toàn giống nhau", "D. phương pháp lịch sử không cần sử liệu"], "answer": "A", "explain": "Phương pháp lịch sử xem xét sự kiện trong bối cảnh cụ thể theo trình tự thời gian, còn phương pháp lô-gíc phân tích, khái quát để tìm quy luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao chức năng giáo dục của sử học có ý nghĩa quan trọng với thế hệ trẻ?", "options": ["B. Vì nó giúp dự báo tương lai", "A. Vì nó bồi dưỡng lòng yêu nước, niềm tự hào dân tộc và ý thức trách nhiệm", "C. Vì nó giúp kiếm tiền", "D. Vì nó thay thế các môn học khác"], "answer": "A", "explain": "Chức năng giáo dục bồi dưỡng tư tưởng, tình cảm, lòng yêu nước và ý thức trách nhiệm cho thế hệ trẻ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn Minh muốn tìm hiểu đời sống người Việt cổ thời Hùng Vương. Nguồn sử liệu nào sau đây phù hợp nhất?", "options": ["A. Truyền thuyết và trống đồng Đông Sơn", "B. Phim tư liệu về kháng chiến chống Mỹ", "C. Báo chí hiện nay", "D. Sách giáo khoa Vật lí"], "answer": "A", "explain": "Truyền thuyết (sử liệu truyền miệng) và trống đồng Đông Sơn (sử liệu hiện vật) là những nguồn phù hợp để tìm hiểu thời Hùng Vương.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho các nhận định về Lịch sử. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Lịch sử là khách quan, đã diễn ra và không thể thay đổi.", "b) Con người có thể thay đổi các sự kiện đã diễn ra trong quá khứ.", "c) Sử học giúp con người nhận thức đúng đắn về quá khứ.", "d) Mọi câu chuyện về quá khứ đều là sử liệu đáng tin cậy."], "answer": ["T", "F", "T", "F"], "explain": "b) Sai vì lịch sử đã diễn ra thì không thể thay đổi. d) Sai vì sử liệu cần được kiểm chứng, không phải câu chuyện nào cũng đáng tin cậy.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho các nhận định về chức năng của sử học. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Tìm hiểu thời Bắc thuộc giúp hiểu truyền thống đấu tranh là chức năng nhận thức.", "b) Noi gương Trần Hưng Đạo để rèn luyện bản thân là chức năng giáo dục.", "c) Từ bài học lịch sử mà định hướng hành động hôm nay là chức năng dự báo.", "d) Chức năng dự báo giúp dự đoán chính xác từng sự kiện cụ thể trong tương lai."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai vì chức năng dự báo là dự báo xu hướng phát triển trên cơ sở quy luật, không phải dự đoán chính xác từng sự kiện.", "points": 1}, {"type": "short", "level": "VDC", "q": "Hoàn thành câu: \"Đối tượng nghiên cứu của sử học là ...\"", "answer": "toàn bộ quá khứ của xã hội loài người", "explain": "Đối tượng nghiên cứu của sử học là toàn bộ quá khứ của xã hội loài người.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tên gọi loại sử liệu gồm tranh vẽ, ảnh chụp, phim tư liệu là gì?", "answer": "Sử liệu hình ảnh, âm thanh", "explain": "Tranh vẽ, ảnh chụp, phim tư liệu thuộc loại sử liệu hình ảnh, âm thanh.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Câu nào sau đây là định nghĩa đúng về Lịch sử?", "options": ["B. Khoa học nghiên cứu về quá khứ", "C. Những câu chuyện tưởng tượng", "A. Những gì đã diễn ra và đã qua đi trong xã hội loài người", "D. Tương lai của xã hội loài người"], "answer": "A", "explain": "Lịch sử là những gì đã diễn ra và đã qua đi trong đời sống của xã hội loài người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhà sử học tái hiện quá khứ dựa vào", "options": ["A. các sử liệu", "B. trí tưởng tượng", "C. lời đồn đại", "D. giấc mơ"], "answer": "A", "explain": "Nhà sử học dựa vào các sử liệu, tức là dấu tích của quá khứ còn lưu giữ đến nay, để tái hiện lịch sử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sắc phong, chiếu chỉ của vua chúa thuộc loại sử liệu nào?", "options": ["A. Sử liệu truyền miệng", "B. Sử liệu hiện vật", "C. Sử liệu chữ viết", "D. Sử liệu hình ảnh"], "answer": "C", "explain": "Sắc phong, chiếu chỉ là văn bản chữ viết nên thuộc sử liệu chữ viết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nào sau đây không phải là chức năng của sử học?", "options": ["B. Chức năng nhận thức", "A. Chức năng giải trí", "C. Chức năng giáo dục", "D. Chức năng dự báo"], "answer": "A", "explain": "Ba chức năng cơ bản của sử học là nhận thức, giáo dục và dự báo; không có chức năng giải trí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc học lịch sử giúp em hiểu cội nguồn dân tộc. Đây là biểu hiện của chức năng", "options": ["A. nhận thức", "B. giáo dục", "C. dự báo", "D. lưu trữ"], "answer": "A", "explain": "Hiểu biết về cội nguồn dân tộc là tri thức về quá khứ, thuộc chức năng nhận thức.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nhóm học sinh phỏng vấn các cụ cao niên về phong tục đón Tết xưa của làng. Đây là khai thác loại sử liệu nào?", "options": ["B. Sử liệu hiện vật", "A. Sử liệu truyền miệng", "C. Sử liệu chữ viết", "D. Sử liệu hình ảnh"], "answer": "A", "explain": "Lời kể của các cụ cao niên được lưu truyền qua lời nói nên thuộc sử liệu truyền miệng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho các nhận định về sử liệu. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Sử liệu là cơ sở để nhà sử học tái hiện lịch sử.", "b) Mọi sử liệu đều phản ánh đúng hoàn toàn sự thật lịch sử.", "c) Sử liệu chữ viết ra đời sớm nhất trong các loại sử liệu.", "d) Cần đối chiếu nhiều nguồn sử liệu khi nghiên cứu."], "answer": ["T", "F", "F", "T"], "explain": "b) Sai vì sử liệu cần được kiểm chứng, không phải sử liệu nào cũng phản ánh đúng hoàn toàn. c) Sai vì sử liệu truyền miệng và hiện vật ra đời sớm hơn sử liệu chữ viết.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho các nhận định tổng hợp về Bài 1. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Lịch sử là đối tượng nghiên cứu của sử học.", "b) Đối tượng của sử học là toàn bộ quá khứ của xã hội loài người.", "c) Chức năng giáo dục giúp con người hiểu biết về quá khứ.", "d) Phương pháp lô-gíc xem xét sự kiện theo trình tự thời gian."], "answer": ["T", "T", "F", "F"], "explain": "c) Sai vì giúp hiểu biết về quá khứ là chức năng nhận thức. d) Sai vì xem xét sự kiện theo trình tự thời gian là phương pháp lịch sử.", "points": 1}, {"type": "short", "level": "VDC", "q": "Hoàn thành câu: \"Sử liệu truyền miệng và sử liệu hiện vật ra đời ... sử liệu chữ viết.\"", "answer": "sớm hơn", "explain": "Sử liệu truyền miệng và hiện vật hình thành từ buổi đầu của xã hội loài người, sớm hơn nhiều so với sử liệu chữ viết.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hoàn thành câu: \"Sử học là khoa học nghiên cứu về ...\"", "answer": "lịch sử", "explain": "Sử học là khoa học nghiên cứu về lịch sử.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Quá khứ của xã hội loài người được gọi là", "options": ["A. Lịch sử", "B. Sử học", "C. Sử liệu", "D. Truyền thuyết"], "answer": "A", "explain": "Lịch sử chính là quá khứ của xã hội loài người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khoa học nghiên cứu về lịch sử được gọi là", "options": ["B. Khảo cổ học", "A. Sử học", "C. Dân tộc học", "D. Văn học"], "answer": "A", "explain": "Sử học là khoa học nghiên cứu về lịch sử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Băng ghi âm, phim tư liệu thuộc loại sử liệu nào?", "options": ["A. Sử liệu truyền miệng", "B. Sử liệu hiện vật", "C. Sử liệu hình ảnh, âm thanh", "D. Sử liệu chữ viết"], "answer": "C", "explain": "Băng ghi âm, phim tư liệu thuộc loại sử liệu hình ảnh, âm thanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận định nào đúng về chức năng dự báo của sử học?", "options": ["B. Dự báo giúp biết trước chính xác mọi sự kiện", "A. Dựa trên quy luật phát triển của lịch sử để định hướng tương lai", "C. Dự báo không cần dựa vào quá khứ", "D. Dự báo chỉ dành cho nhà tiên tri"], "answer": "A", "explain": "Chức năng dự báo dựa trên việc nhận thức quy luật phát triển của lịch sử để định hướng cho tương lai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Học sinh tìm hiểu về các anh hùng dân tộc để noi theo. Đây là chức năng nào của sử học?", "options": ["A. Chức năng nhận thức", "C. Chức năng dự báo", "B. Chức năng giáo dục", "D. Chức năng lưu trữ"], "answer": "B", "explain": "Noi theo tấm gương anh hùng để rèn luyện bản thân thuộc chức năng giáo dục.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Để nghiên cứu về đời sống người nguyên thủy, nhà khảo cổ khai quật được rìu đá, đồ gốm. Đây là loại sử liệu nào?", "options": ["A. Sử liệu hiện vật", "B. Sử liệu truyền miệng", "C. Sử liệu chữ viết", "D. Sử liệu hình ảnh"], "answer": "A", "explain": "Rìu đá, đồ gốm là đồ vật do người xưa tạo ra và còn sót lại nên thuộc sử liệu hiện vật.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho các nhận định về phương pháp nghiên cứu. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Phương pháp lịch sử xem xét sự kiện theo trình tự thời gian.", "b) Phương pháp lô-gíc giúp tìm ra bản chất, quy luật của lịch sử.", "c) Hai phương pháp này loại trừ lẫn nhau.", "d) Chỉ cần dùng một trong hai phương pháp là đủ."], "answer": ["T", "T", "F", "F"], "explain": "c) và d) Sai vì hai phương pháp bổ sung cho nhau và thường được sử dụng kết hợp.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho các nhận định nâng cao về nghiên cứu lịch sử. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Mọi hiểu biết về quá khứ đều là tri thức khoa học chính xác.", "b) Sử liệu truyền miệng cần được kiểm chứng bằng các nguồn khác.", "c) Nhà sử học có thể tự ý thêm bớt sự kiện cho câu chuyện hấp dẫn.", "d) Tính khách quan, trung thực là yêu cầu hàng đầu của nghiên cứu lịch sử."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai vì hiểu biết về quá khứ cần được kiểm chứng mới thành tri thức khoa học. c) Sai vì thêm bớt sự kiện là vi phạm tính trung thực.", "points": 1}, {"type": "short", "level": "VDC", "q": "Hoàn thành câu: \"Nhiệm vụ của sử học là tái hiện quá khứ một cách ...\"", "answer": "khách quan, trung thực", "explain": "Nhiệm vụ của sử học là tái hiện quá khứ một cách khách quan, trung thực.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Loại sử liệu nào ra đời muộn nhất: truyền miệng, hiện vật, chữ viết hay hình ảnh, âm thanh?", "answer": "Sử liệu hình ảnh, âm thanh", "explain": "Sử liệu hình ảnh, âm thanh gắn với kĩ thuật ghi hình, ghi âm hiện đại nên ra đời muộn nhất.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Từ khi con người xuất hiện đến nay, toàn bộ những gì đã diễn ra được gọi là", "options": ["B. Sử học", "A. Lịch sử", "C. Văn hóa", "D. Văn minh"], "answer": "A", "explain": "Lịch sử là toàn bộ quá khứ của xã hội loài người từ khi con người xuất hiện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đối tượng nghiên cứu của sử học không bao gồm", "options": ["B. các sự kiện lịch sử", "C. các nhân vật lịch sử", "A. tương lai của xã hội loài người", "D. đời sống thường ngày của con người"], "answer": "A", "explain": "Đối tượng của sử học là quá khứ, không bao gồm tương lai của xã hội loài người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhật ký, thư từ của người xưa thuộc loại sử liệu nào?", "options": ["A. Sử liệu chữ viết", "B. Sử liệu truyền miệng", "C. Sử liệu hiện vật", "D. Sử liệu hình ảnh"], "answer": "A", "explain": "Nhật ký, thư từ là văn bản chữ viết nên thuộc sử liệu chữ viết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nói \"Dân ta phải biết sử ta\" của Chủ tịch Hồ Chí Minh nhấn mạnh chức năng nào của sử học?", "options": ["B. Chỉ chức năng nhận thức", "C. Chỉ chức năng dự báo", "A. Cả ba chức năng: nhận thức, giáo dục và dự báo", "D. Chức năng lưu trữ"], "answer": "A", "explain": "Biết sử ta vừa giúp hiểu quá khứ (nhận thức), vừa bồi dưỡng lòng yêu nước (giáo dục), vừa định hướng tương lai (dự báo).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một học sinh cho rằng: \"Học sử chỉ để biết chuyện xưa, không có ích gì cho hiện tại.\" Nhận định này", "options": ["A. sai, vì tri thức lịch sử giúp định hướng cho hiện tại và tương lai", "B. đúng, vì quá khứ đã qua đi", "C. đúng, vì hiện tại không liên quan đến quá khứ", "D. sai, vì chuyện xưa rất hấp dẫn"], "answer": "A", "explain": "Nhận định sai vì tri thức lịch sử giúp con người rút kinh nghiệm và định hướng cho hiện tại, tương lai.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Khi đánh giá một nhân vật lịch sử, việc làm nào sau đây đúng với phương pháp lịch sử?", "options": ["B. Đánh giá bằng tiêu chuẩn của ngày hôm nay", "A. Đặt nhân vật trong bối cảnh lịch sử cụ thể của thời đại họ sống", "C. Chỉ khen ngợi, không phê phán", "D. Bỏ qua bối cảnh thời đại"], "answer": "A", "explain": "Phương pháp lịch sử đòi hỏi đặt nhân vật trong bối cảnh lịch sử cụ thể của thời đại họ sống.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho các nhận định tổng hợp. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Lịch sử và Sử học là một.", "b) Sử học có ba chức năng cơ bản.", "c) Có bốn loại sử liệu cơ bản.", "d) Sử học có hai phương pháp nghiên cứu cơ bản."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai vì Lịch sử là đối tượng còn Sử học là khoa học nghiên cứu về đối tượng đó.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho các nhận định về giá trị của sử liệu. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Truyền thuyết hoàn toàn không có giá trị đối với nghiên cứu lịch sử.", "b) Truyền thuyết phản ánh nhận thức, ước mơ của người xưa về quá khứ nên vẫn là sử liệu quý.", "c) Sử liệu chữ viết luôn phản ánh đúng sự thật khách quan.", "d) Người ghi chép sử liệu chữ viết có thể chịu ảnh hưởng bởi quan điểm chủ quan."], "answer": ["F", "T", "F", "T"], "explain": "a) Sai vì truyền thuyết vẫn có giá trị khi được kiểm chứng. c) Sai vì người ghi chép có thể chịu ảnh hưởng chủ quan.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu tên phương pháp nghiên cứu giúp khái quát thành bài học, quy luật từ các sự kiện cụ thể.", "answer": "Phương pháp lô-gíc", "explain": "Phương pháp lô-gíc phân tích, tổng hợp, khái quát hóa để tìm ra bản chất và quy luật của lịch sử.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sử liệu nào ra đời sớm nhất: chữ viết hay truyền miệng?", "answer": "Truyền miệng", "explain": "Sử liệu truyền miệng hình thành từ khi con người biết dùng lời nói, sớm hơn nhiều so với chữ viết.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Khoa học nào nghiên cứu về quá khứ của xã hội loài người?", "options": ["A. Sử học", "B. Toán học", "C. Vật lí học", "D. Hóa học"], "answer": "A", "explain": "Sử học là khoa học nghiên cứu về quá khứ của xã hội loài người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Truyền thuyết Sơn Tinh – Thủy Tinh thuộc loại sử liệu nào?", "options": ["B. Sử liệu hiện vật", "A. Sử liệu truyền miệng", "C. Sử liệu chữ viết", "D. Sử liệu hình ảnh"], "answer": "A", "explain": "Truyền thuyết Sơn Tinh – Thủy Tinh được lưu truyền qua lời kể nên thuộc sử liệu truyền miệng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chức năng giúp con người dự báo xu hướng phát triển trong tương lai là", "options": ["A. chức năng dự báo", "B. chức năng nhận thức", "C. chức năng giáo dục", "D. chức năng phản ánh"], "answer": "A", "explain": "Chức năng dự báo giúp con người dự báo xu hướng phát triển trong tương lai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không được đánh giá sự kiện quá khứ bằng tiêu chuẩn của ngày hôm nay một cách máy móc?", "options": ["B. Vì tiêu chuẩn ngày nay luôn đúng", "A. Vì mỗi sự kiện cần được xem xét trong bối cảnh lịch sử cụ thể của nó", "C. Vì quá khứ không quan trọng", "D. Vì không ai quan tâm đến quá khứ"], "answer": "A", "explain": "Theo phương pháp lịch sử, mỗi sự kiện cần được xem xét trong bối cảnh lịch sử cụ thể của nó.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nào sau đây thể hiện đầy đủ nhất đối tượng nghiên cứu của sử học?", "options": ["B. Các triều đại phong kiến", "A. Toàn bộ quá khứ của xã hội loài người trên mọi lĩnh vực", "C. Các cuộc chiến tranh", "D. Các nhân vật nổi tiếng"], "answer": "A", "explain": "Đối tượng của sử học là toàn bộ quá khứ của xã hội loài người trên mọi lĩnh vực.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhà trường tổ chức cho học sinh tham quan di tích lịch sử để bồi dưỡng lòng yêu nước. Hoạt động này phát huy chức năng nào của sử học?", "options": ["A. Chức năng nhận thức", "C. Chức năng dự báo", "B. Chức năng giáo dục", "D. Chức năng giải trí"], "answer": "B", "explain": "Tham quan di tích để bồi dưỡng lòng yêu nước thuộc chức năng giáo dục của sử học.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho các nhận định về Bài 1. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Sử học là một khoa học.", "b) Đối tượng của sử học là toàn bộ quá khứ của xã hội loài người.", "c) Chức năng nhận thức và chức năng giáo dục không liên quan đến nhau.", "d) Học lịch sử giúp con người sống tốt hơn trong hiện tại."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai vì ba chức năng của sử học gắn bó chặt chẽ, bổ sung cho nhau.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho các nhận định về sử liệu. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Mọi di tích lịch sử đều tự động trở thành sử liệu mà không cần nghiên cứu.", "b) Di tích chỉ trở thành sử liệu khi được nhà nghiên cứu khai thác, giải mã.", "c) Một sử liệu có thể vừa là hiện vật vừa mang giá trị chữ viết, như bia đá.", "d) Sử liệu càng cổ thì càng đáng tin cậy tuyệt đối."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai vì di tích cần được khai thác, giải mã mới trở thành sử liệu. d) Sai vì sử liệu nào cũng cần kiểm chứng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Hoàn thành câu: \"Sử liệu là những ... của quá khứ còn lưu giữ đến ngày nay.\"", "answer": "dấu tích", "explain": "Sử liệu là những dấu tích của quá khứ còn lưu giữ đến ngày nay.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sử học có bao nhiêu loại sử liệu cơ bản?", "answer": "4", "explain": "Sử học có bốn loại sử liệu cơ bản: truyền miệng, hiện vật, chữ viết, hình ảnh và âm thanh.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Câu nào sau đây đúng về Lịch sử?", "options": ["B. Lịch sử là khoa học nghiên cứu quá khứ", "A. Lịch sử là quá khứ của xã hội loài người", "C. Lịch sử là những câu chuyện tưởng tượng", "D. Lịch sử là tương lai của xã hội loài người"], "answer": "A", "explain": "Lịch sử là quá khứ của xã hội loài người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Câu nào sau đây đúng về Sử học?", "options": ["A. Sử học là khoa học nghiên cứu về lịch sử", "B. Sử học là quá khứ của xã hội loài người", "C. Sử học là những dấu tích của quá khứ", "D. Sử học là nghệ thuật kể chuyện"], "answer": "A", "explain": "Sử học là khoa học nghiên cứu về lịch sử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phim tư liệu, ảnh chụp về quá khứ thuộc loại sử liệu", "options": ["A. hình ảnh, âm thanh", "B. truyền miệng", "C. hiện vật", "D. chữ viết"], "answer": "A", "explain": "Phim tư liệu, ảnh chụp thuộc loại sử liệu hình ảnh, âm thanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ba chức năng của sử học có mối quan hệ với nhau như thế nào?", "options": ["B. Tồn tại độc lập, không liên quan", "A. Gắn bó chặt chẽ, bổ sung cho nhau", "C. Loại trừ lẫn nhau", "D. Chỉ có một chức năng quan trọng"], "answer": "A", "explain": "Ba chức năng nhận thức, giáo dục, dự báo gắn bó chặt chẽ và bổ sung cho nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận định nào sau đây sai?", "options": ["A. Sử học chỉ dành cho nhà nghiên cứu chuyên nghiệp, học sinh không cần học sử", "B. Sử học giúp con người hiểu biết về quá khứ", "C. Sử học có chức năng giáo dục", "D. Sử học giúp định hướng cho tương lai"], "answer": "A", "explain": "Nhận định sai vì học sinh cũng cần học sử để hiểu cội nguồn và bồi dưỡng nhân cách.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Em hãy cho biết việc làm nào sau đây vận dụng chức năng dự báo của sử học?", "options": ["B. Sưu tầm ca dao để tìm hiểu quá khứ", "A. Từ bài học giữ nước trong lịch sử, thế hệ trẻ xác định trách nhiệm bảo vệ Tổ quốc hôm nay", "C. Tham quan bảo tàng để biết về hiện vật xưa", "D. Đọc truyện lịch sử để giải trí"], "answer": "A", "explain": "Từ bài học lịch sử mà xác định trách nhiệm, định hướng hành động hôm nay là vận dụng chức năng dự báo.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho các nhận định tổng hợp. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Lịch sử là những gì đã diễn ra trong quá khứ.", "b) Sử học nghiên cứu toàn bộ quá khứ của xã hội loài người.", "c) Học sử giúp bồi dưỡng lòng yêu nước.", "d) Sử liệu duy nhất đáng tin cậy là sử liệu chữ viết."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai vì mỗi loại sử liệu đều có giá trị khi được kiểm chứng, không loại nào là duy nhất đáng tin cậy.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho các nhận định về vai trò của sử học. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Phương pháp lịch sử và phương pháp lô-gíc đều nhằm tái hiện quá khứ khách quan.", "b) Kết quả nghiên cứu lịch sử không bao giờ cần kiểm chứng lại.", "c) Hiểu đúng quá khứ giúp con người tránh lặp lại sai lầm.", "d) Sử học không có vai trò gì đối với sự phát triển kinh tế."], "answer": ["T", "F", "T", "F"], "explain": "b) Sai vì kết quả nghiên cứu cần được kiểm chứng khi có sử liệu mới. d) Sai vì hiểu quy luật phát triển giúp định hướng phát triển kinh tế.", "points": 1}, {"type": "short", "level": "VDC", "q": "Hoàn thành câu nói của Chủ tịch Hồ Chí Minh: \"Dân ta phải biết ...\"", "answer": "sử ta", "explain": "Câu nói đầy đủ là: \"Dân ta phải biết sử ta, cho tường gốc tích nước nhà Việt Nam\".", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hai Bà Trưng là nhân vật lịch sử thuộc thời kỳ nào của dân tộc?",
