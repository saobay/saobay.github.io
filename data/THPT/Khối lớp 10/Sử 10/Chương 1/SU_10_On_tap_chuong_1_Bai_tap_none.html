g con người.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Để tìm hiểu văn hóa Chăm-pa, nên đến di tích nào?", "options": ["A. Thánh địa Mỹ Sơn", "B. Hoàng thành Thăng Long", "C. Cố đô Huế", "D. Phố cổ Hội An"], "answer": "A", "explain": "Thánh địa Mỹ Sơn là di sản tiêu biểu của văn hóa Chăm-pa.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho các nhận định về phương pháp. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Phương pháp lịch sử xem xét sự kiện theo trình tự thời gian.", "b) Phương pháp lô-gíc tìm ra bản chất, quy luật.", "c) Hai phương pháp loại trừ lẫn nhau.", "d) Nên kết hợp cả hai phương pháp."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai vì hai phương pháp bổ sung cho nhau và thường được sử dụng kết hợp.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho các nhận định về thông tin lịch sử. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Mọi thông tin về quá khứ trên mạng đều đáng tin.", "b) Cần kiểm chứng thông tin lịch sử từ nhiều nguồn tin cậy.", "c) Hiểu đúng lịch sử giúp tránh xuyên tạc sự thật.", "d) Tri thức lịch sử vững vàng góp phần bảo vệ nền tảng tư tưởng dân tộc."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai vì thông tin trên mạng cần được kiểm chứng, không phải tất cả đều đáng tin cậy.", "points": 1}, {"type": "short", "level": "VDC", "q": "Hoàn thành câu: \"Nhiệm vụ của sử học là tái hiện quá khứ một cách ...\"", "answer": "khách quan, trung thực", "explain": "Nhiệm vụ của sử học là tái hiện quá khứ một cách khách quan, trung thực.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Lễ hội nào tưởng nhớ Thánh Gióng?", "answer": "Lễ hội Đền Gióng", "explain": "Lễ hội Đền Gióng được tổ chức để tưởng nhớ Thánh Gióng.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Toàn bộ những gì đã diễn ra từ khi con người xuất hiện được gọi là", "options": ["A. Lịch sử", "B. Sử học", "C. Văn hóa", "D. Kinh tế"], "answer": "A", "explain": "Lịch sử là toàn bộ quá khứ của xã hội loài người từ khi con người xuất hiện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đối tượng nghiên cứu của sử học không bao gồm", "options": ["B. các sự kiện lịch sử", "C. các nhân vật lịch sử", "D. đời sống thường ngày", "A. tương lai của xã hội loài người"], "answer": "A", "explain": "Đối tượng của sử học là quá khứ, không bao gồm tương lai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngày 22/12 là ngày", "options": ["A. thành lập Quân đội nhân dân Việt Nam", "B. Quốc khánh", "C. Nhà giáo Việt Nam", "D. Giải phóng miền Nam"], "answer": "A", "explain": "Ngày 22/12/1944 là ngày thành lập Quân đội nhân dân Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ba chức năng của sử học quan hệ với nhau", "options": ["B. độc lập, không liên quan", "A. gắn bó chặt chẽ, bổ sung cho nhau", "C. loại trừ lẫn nhau", "D. mâu thuẫn nhau"], "answer": "A", "explain": "Ba chức năng nhận thức, giáo dục, dự báo gắn bó chặt chẽ và bổ sung cho nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vai trò quan trọng nhất của tri thức lịch sử với học sinh", "options": ["A. hiểu cội nguồn, bồi dưỡng lòng yêu nước, định hướng tương lai", "B. giúp giải trí", "C. giúp kiếm tiền", "D. giúp nổi tiếng"], "answer": "A", "explain": "Với học sinh, tri thức lịch sử giúp hiểu cội nguồn, bồi dưỡng lòng yêu nước và định hướng tương lai.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Du khách muốn tìm hiểu kinh đô thời Lý – Trần nên đến", "options": ["B. Cố đô Huế", "C. Hội An", "A. Hoàng thành Thăng Long", "D. Mỹ Sơn"], "answer": "A", "explain": "Hoàng thành Thăng Long là kinh đô của Việt Nam thời Lý – Trần.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho các nhận định tổng hợp. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Lịch sử là những gì đã diễn ra.", "b) Sử học nghiên cứu toàn bộ quá khứ loài người.", "c) Học sử bồi dưỡng lòng yêu nước.", "d) Chỉ sử liệu chữ viết mới đáng tin."], "answer": ["T", "T", "T", "F"], "explain": "d) Sai vì mỗi loại sử liệu đều có giá trị khi được kiểm chứng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho các nhận định về lễ hội và di sản. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Lễ hội truyền thống là hình thức lưu truyền tri thức lịch sử trong cộng đồng.", "b) Thương mại hóa quá mức có thể làm mai một giá trị lịch sử của lễ hội.", "c) Bảo tồn di sản chỉ là việc của nhà nước.", "d) Phát huy di sản góp phần phát triển du lịch địa phương."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai vì bảo tồn di sản là trách nhiệm chung của toàn xã hội.", "points": 1}, {"type": "short", "level": "VDC", "q": "Ngày Giỗ Tổ Hùng Vương được công nhận là gì?", "answer": "Quốc lễ", "explain": "Ngày Giỗ Tổ Hùng Vương (10/3 âm lịch) được công nhận là Quốc lễ của Việt Nam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sử liệu nào ra đời sớm nhất: truyền miệng hay chữ viết?", "answer": "Truyền miệng", "explain": "Sử liệu truyền miệng hình thành từ khi con người biết dùng lời nói, sớm hơn chữ viết.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Nhận định nào sau đây đúng về Lịch sử?", "options": ["B. Lịch sử là khoa học nghiên cứu quá khứ", "C. Lịch sử là chuyện tưởng tượng", "A. \"Lịch sử là quá khứ của xã hội loài người\"", "D. Lịch sử là tương lai của xã hội"], "answer": "A", "explain": "Lịch sử là quá khứ của xã hội loài người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhận định nào sau đây đúng về Sử học?", "options": ["A. \"Sử học là khoa học nghiên cứu về lịch sử\"", "B. \"Sử học là quá khứ của xã hội loài người\"", "C. \"Sử học là những dấu tích quá khứ\"", "D. \"Sử học là nghệ thuật kể chuyện\""], "answer": "A", "explain": "Sử học là khoa học nghiên cứu về lịch sử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tri thức về Cách mạng tháng Tám 1945 là tri thức", "options": ["A. lịch sử", "B. toán học", "C. vật lí", "D. hóa học"], "answer": "A", "explain": "Hiểu biết về Cách mạng tháng Tám 1945 là hiểu biết về quá khứ, tức là tri thức lịch sử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không đánh giá sự kiện xưa bằng tiêu chuẩn nay một cách máy móc?", "options": ["A. Mỗi sự kiện cần đặt trong bối cảnh lịch sử cụ thể", "B. Tiêu chuẩn ngày nay luôn đúng", "C. Quá khứ không quan trọng", "D. Không ai quan tâm quá khứ"], "answer": "A", "explain": "Theo phương pháp lịch sử, mỗi sự kiện cần được xem xét trong bối cảnh lịch sử cụ thể của nó.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao các ngày lễ lớn có ý nghĩa giáo dục?", "options": ["B. Vì được nghỉ học", "A. Là dịp toàn dân ôn truyền thống và tri ân cha anh", "C. Vì có nhiều trò vui", "D. Vì tổ chức hoành tráng"], "answer": "A", "explain": "Các ngày lễ lớn là dịp toàn dân ôn lại truyền thống hào hùng và tri ân các thế hệ cha anh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Em viết báo tường giới thiệu quê hương, nên", "options": ["A. đưa vào câu chuyện, di tích lịch sử của quê hương", "B. chỉ viết về cảnh đẹp", "C. chép bài của bạn", "D. viết thật ngắn"], "answer": "A", "explain": "Đưa câu chuyện và di tích lịch sử của quê hương vào bài viết làm bài sinh động, giàu tri thức lịch sử.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho các nhận định về ý nghĩa của tri thức lịch sử. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Tri thức lịch sử giúp nhận thức sâu sắc về cội nguồn.", "b) Tri thức lịch sử hun đúc ý chí vươn lên.", "c) Tri thức lịch sử khiến con người chỉ sống hoài niệm.", "d) Tri thức lịch sử là hành trang tinh thần."], "answer": ["T", "T", "F", "T"], "explain": "c) Sai vì tri thức lịch sử giúp con người định hướng cho hiện tại và tương lai.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho các nhận định về vận dụng tri thức lịch sử. Xác định Đúng (T) hay Sai (F):", "statements": ["a) Di tích, lễ hội, bảo tàng đều là \"địa chỉ\" của tri thức lịch sử.", "
