:"A","explain":"strip xóa dấu cách hai đầu.","points":0.25},{"type":"mcq","level":"NB","q":"Chỉ số đầu tiên của danh sách trong Python là?","options":["A. 0","B. 1","C. -1","D. Tùy ý"],"answer":"A","explain":"Python đánh chỉ số từ 0.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: a = [7, 2, 9, 4]; in sorted(a)[1]. Kết quả là?","options":["A. 4","B. 2","C. 7","D. 9"],"answer":"A","explain":"Sắp xếp: [2,4,7,9]; phần tử chỉ số 1 là 4.","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: x = 0; for i in range(5): for j in range(i): x = x + 1; in x. Kết quả là?","options":["A. 10","B. 15","C. 25","D. 5"],"answer":"A","explain":"0+1+2+3+4 = 10 lần tăng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét đoạn lệnh: s = \"python\"; in s[1:4]. Các phát biểu sau đúng hay sai?","statements":["Cắt lát từ chỉ số 1.","Dừng trước chỉ số 4.","Kết quả là yth.","Kết quả là pyt."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh Euclid: a = 48; b = 18; while b != 0: a, b = b, a % b. Các phát biểu sau đúng hay sai?","statements":["Đây là thuật toán Euclid.","Kết quả a = 6.","Vòng lặp dừng khi b = 0.","Kết quả a = 18."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"short","level":"TH","q":"Tổng 1 + 2 + 3 + 4 bằng bao nhiêu?","answer":"10","explain":"Dùng vòng lặp for.","points":0.5},{"type":"short","level":"VDC","q":"Loại trùng [5, 2, 5, 3, 2] giữ thứ tự được gì? (viết dạng danh sách)","answer":"[5, 2, 3]","explain":"Giữ lần xuất hiện đầu.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Lệnh break trong vòng lặp có tác dụng gì?","options":["A. Thoát khỏi vòng lặp ngay","B. Bỏ qua lần lặp hiện tại","C. Dừng chương trình","D. Không tác dụng"],"answer":"A","explain":"break thoát vòng lặp; continue bỏ qua lần lặp hiện tại.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: a = \"4\"; b = 5; in int(a) + b. Kết quả là?","options":["A. 9","B. 45","C. Báo lỗi","D. 54"],"answer":"A","explain":"int(\"4\") = 4; 4 + 5 = 9.","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: def f(x): return x * f(x - 1) nếu x lớn hơn 1 ngược lại 1; in f(5). Kết quả là?","options":["A. 120","B. 15","C. 25","D. Báo lỗi"],"answer":"A","explain":"Đệ quy giai thừa: 5! = 120.","points":0.25},{"type":"mcq","level":"NB","q":"Câu lệnh rẽ nhánh trong Python là?","options":["A. if","B. for","C. while","D. def"],"answer":"A","explain":"if/elif/else thực hiện rẽ nhánh theo điều kiện.","points":0.25},{"type":"mcq","level":"VD","q":"Chương trình tính tổng các số lẻ từ 1 đến 9: s = 0; for i in range(1, 10, 2): s = s + i; in s. Kết quả là?","options":["A. 25","B. 20","C. 30","D. 45"],"answer":"A","explain":"1+3+5+7+9 = 25.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: x = True; y = False; in x and y. Kết quả là?","options":["A. False","B. True","C. Báo lỗi","D. None"],"answer":"A","explain":"True and False = False.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét đoạn lệnh: def f(n): nếu n == 1: trả về 1; ngược lại: trả về n + f(n - 1). Các phát biểu sau đúng hay sai?","statements":["Đây là hàm đệ quy.","n == 1 là điểm dừng.","f(4) cho 10.","Đệ quy không cần điểm dừng."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về điều khiển.","statements":["if dùng để rẽ nhánh.","for lặp số lần biết trước.","while lặp khi điều kiện đúng.","def dùng để lặp."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: def định nghĩa hàm.","points":1},{"type":"short","level":"NB","q":"Lệnh xuất dữ liệu ra màn hình là gì?","answer":"print","explain":"print().","points":0.5},{"type":"short","level":"VD","q":"Tổng các số chẵn từ 2 đến 10 bằng bao nhiêu?","answer":"30","explain":"2+4+6+8+10.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"VDC","q":"Đoạn lệnh: n = 28; tong = 0; for i in range(1, n): nếu n % i == 0: tong = tong + i; in tong == n. Kết quả là?","options":["A. True","B. False","C. Báo lỗi","D. 28"],"answer":"A","explain":"1+2+4+7+14 = 28: số hoàn hảo.","points":0.25},{"type":"mcq","level":"NB","q":"Kiểm thử chương trình là gì?","options":["A. Chạy với dữ liệu mẫu để phát hiện lỗi","B. Viết chương trình","C. Xóa chương trình","D. Tắt máy"],"answer":"A","explain":"Kiểm thử giúp phát hiện lỗi logic và ngoại lệ.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: a = [5, 1, 8]; a.sort(); in a. Kết quả là?","options":["A. [1, 5, 8]","B. [8, 5, 1]","C. [5, 1, 8]","D. Báo lỗi"],"answer":"A","explain":"sort sắp tăng dần.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: a = \"Tin học\"; in len(a). Kết quả là?","options":["A. 7","B. 6","C. 8","D. Báo lỗi"],"answer":"A","explain":"\"Tin học\" có 7 kí tự (kể cả dấu cách).","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: def f(n): nếu n == 1: trả về 1; ngược lại: trả về n + f(n - 1); in f(4). Kết quả là?","options":["A. 10","B. 4","C. 24","D. Báo lỗi"],"answer":"A","explain":"Đệ quy tính tổng 1..4 = 10.","points":0.25},{"type":"mcq","level":"NB","q":"Biến toàn cục là biến được khai báo ở đâu?","options":["A. Ngoài mọi hàm","B. Trong hàm","C. Trong vòng lặp","D. Trong if"],"answer":"A","explain":"Biến ngoài mọi hàm là toàn cục, dùng được ở khắp nơi.","points":0.25},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh: x = 0; for i in range(5): for j in range(i): x = x + 1. Các phát biểu sau đúng hay sai?","statements":["Vòng trong chạy i lần.","Tổng số lần tăng là 10.","x cuối bằng 10.","x cuối bằng 15."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: 0+1+2+3+4 = 10.","points":1},{"type":"truefalse","level":"TH","q":"Xét đoạn lệnh: s = 0; for i in range(1, 5): s = s + i. Các phát biểu sau đúng hay sai?","statements":["Tổng tính từ 1 đến 4.","Kết quả là 10.","range(1, 5) có 4 giá trị.","Kết quả là 15."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: 1+2+3+4 = 10.","points":1},{"type":"short","level":"VDC","q":"Cắt lát [1, 2, 3, 4, 5][1:4:2] được gì? (viết dạng danh sách)","answer":"[2, 4]","explain":"Chỉ số 1, 3 bước 2.","points":0.5},{"type":"short","level":"TH","q":"int(\"4\") + 5 bằng bao nhiêu?","answer":"9","explain":"4 + 5 = 9.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"VDC","q":"Đoạn lệnh: a = 48; b = 18; while b != 0: a, b = b, a % b; in a. Kết quả là?","options":["A. 6","B. 18","C. 12","D. 48"],"answer":"A","explain":"Thuật toán Euclid: ƯCLN = 6.","points":0.25},{"type":"mcq","level":"NB","q":"Hàm range(5) sinh ra dãy nào?","options":["A. 0, 1, 2, 3, 4","B. 1, 2, 3, 4, 5","C. 0, 1, 2, 3, 4, 5","D. 5"],"answer":"A","explain":"range(5) từ 0 đến 4.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: for i in range(3): nếu i == 1: tiếp tục (continue); in i. Kết quả là?","options":["A. 0 2","B. 0 1 2","C. 1","D. 0"],"answer":"A","explain":"Bỏ qua i = 1, in 0 và 2.","points":0.25},{"type":"mcq","level":"NB","q":"Vòng lặp với số lần chưa biết trước trong Python là?","options":["A. while","B. for","C. if","D. def"],"answer":"A","explain":"while lặp khi điều kiện còn đúng, số lần chưa biết trước.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: n = int(\"12\") + int(\"8\"); in n. Kết quả là?","options":["A. 20","B. 128","C. Báo lỗi","D. 12"],"answer":"A","explain":"12 + 8 = 20.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: x = 8; y = 3; in x % y, x // y (hai giá trị). Kết quả là?","options":["A. 2 2","B. 2 3","C. 3 2","D. 2.6 2"],"answer":"A","explain":"8 % 3 = 2; 8 // 3 = 2.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét đoạn lệnh: s = \"abcba\"; in s == s[::-1]. Các phát biểu sau đúng hay sai?","statements":["s[::-1] đảo ngược xâu.","So sánh bằng ==.","Kết quả True.","abcba không đối xứng."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: abcba đối xứng.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về dữ liệu.","statements":["list lưu nhiều phần tử có thứ tự.","Chỉ số đầu tiên là 0.","Xâu bất biến.","int lưu được xâu."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"[x * x for x in [2, 4, 6]] cho kết quả gì? (viết dạng danh sách)","answer":"[4, 16, 36]","explain":"Bình phương từng phần tử.","points":0.5},{"type":"short","level":"NB","q":"Từ khóa định nghĩa hàm là gì?","answer":"def","explain":"def.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Đoạn lệnh: s = \"python\"; in s[1:4]. Kết quả là?","options":["A. yth","B. pyt","C. pyth","D. ytho"],"answer":"A","explain":"Cắt lát từ chỉ số 1 đến trước 4: yth.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: s = \"a,b,c\"; in s.split(\",\"). Kết quả là?","options":["A. ['a', 'b', 'c']","B. \"abc\"","C. ['a,b,c']","D. Báo lỗi"],"answer":"A","explain":"split(\",\") tách thành 3 phần tử.","points":0.25},{"type":"mcq","level":"NB","q":"Lệnh nào dùng để in dữ liệu ra màn hình?","options":["A. print()","B. input()","C. show()","D. display()"],"answer":"A","explain":"print() xuất dữ liệu ra màn hình.","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: n = 13; la_nt = True; for i in range(2, n): nếu n % i == 0: la_nt = False; in la_nt. Kết quả là?","options":["A. True","B. False","C. Báo lỗi","D. 13"],"answer":"A","explain":"13 nguyên tố.","points":0.25},{"type":"mcq","level":"NB","q":"Lệnh continue trong vòng lặp có tác dụng gì?","options":["A. Bỏ qua phần còn lại, sang lần lặp tiếp","B. Thoát vòng lặp","C. Dừng chương trình","D. Lặp lại từ đầu"],"answer":"A","explain":"continue nhảy sang lần lặp kế tiếp.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: a = [2, 4, 6]; b = [x * x for x in a]; in b. Kết quả là?","options":["A. [4, 16, 36]","B. [2, 4, 6]","C. [4, 8, 12]","D. Báo lỗi"],"answer":"A","explain":"Bình phương từng phần tử.","points":0.25},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh: a = [5, 2, 5, 3, 2]; b = []; for x in a: nếu x chưa trong b: b.append(x). Các phát biểu sau đúng hay sai?","statements":["Loại phần tử trùng.","Giữ thứ tự xuất hiện.","b là [5, 2, 3].","b là [2, 3, 5]."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: thứ tự 5, 2, 3.","points":1},{"type":"truefalse","level":"TH","q":"Xét đoạn lệnh: def f(a, b): return a * b; in f(3, 4). Các phát biểu sau đúng hay sai?","statements":["Hàm nhận hai tham số.","Kết quả là 12.","return trả giá trị về.","Hàm không có giá trị trả về."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: có return.","points":1},{"type":"short","level":"VDC","q":"28 có phải số hoàn hảo không? (trả lời: có/không)","answer":"có","explain":"1+2+4+7+14 = 28.","points":0.5},{"type":"short","level":"TH","q":"Tính: 7 + 3 * 2 bằng bao nhiêu?","answer":"13","explain":"Nhân trước: 7 + 6.","points":0.5}]}]}</script>
