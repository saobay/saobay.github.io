{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"VDC","q":"Phát biểu nào đúng về hằng số trong Python?","options":["A. Python không có từ khóa khai báo hằng; quy ước đặt tên hằng bằng chữ IN HOA","B. Hằng khai báo bằng từ khóa const","C. Hằng không tồn tại trong Python","D. Hằng luôn là số"],"answer":"A","explain":"Python không có cơ chế hằng thực sự; lập trình viên quy ước tên IN HOA (ví dụ PI = 3.14) và tự không gán lại.","points":0.25},{"type":"mcq","level":"NB","q":"Trong Python, tên biến có phân biệt chữ hoa chữ thường không?","options":["A. Có, Diem và diem là hai biến khác nhau","B. Không, hai tên đó là một","C. Tùy máy tính","D. Chỉ phân biệt với số"],"answer":"A","explain":"Python phân biệt chữ hoa chữ thường: Diem và diem là hai biến hoàn toàn khác nhau.","points":0.25},{"type":"mcq","level":"VD","q":"Biểu thức (2 nhỏ hơn 5) == True có giá trị gì?","options":["A. True","B. False","C. 2","D. Báo lỗi"],"answer":"A","explain":"(2 nhỏ hơn 5) là True; True == True cho True.","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = 4; b = 3. Giá trị của biểu thức a * b - a là bao nhiêu?","options":["A. 8","B. 9","C. 0","D. 12"],"answer":"A","explain":"a * b = 12; 12 - a = 12 - 4 = 8.","points":0.25},{"type":"mcq","level":"NB","q":"Sau hai lệnh a = 5; a = 10 (viết trên hai dòng), biến a có giá trị nào?","options":["A. 10","B. 5","C. 15","D. 0"],"answer":"A","explain":"Lệnh gán sau ghi đè giá trị cũ: a nhận giá trị mới nhất là 10.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị của biểu thức \"a\" == \"a\" trong Python là gì?","options":["A. True","B. False","C. a","D. Báo lỗi"],"answer":"A","explain":"Hai xâu giống hệt nhau nên phép == cho True.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về lệnh gán.","statements":["Lệnh gán trong Python dùng dấu =.","Trong a = 5, máy tính giá trị vế phải rồi gán cho biến vế trái.","Lệnh a = a + 1 làm tăng giá trị của a thêm 1.","Dấu = trong lệnh gán có nghĩa là bằng nhau trong toán học."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: = trong lập trình là phép gán (đưa giá trị vào biến), khác với dấu bằng trong toán học.","points":1},{"type":"truefalse","level":"VD","q":"Cho a = 7; b = 2. Xét các phát biểu.","statements":["a // b cho 3.","a / b cho 3.5.","(a // b) == (a / b) cho False.","a % b cho 1."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng: chia nguyên 3, chia thực 3.5, 3 != 3.5, dư 1.","points":1},{"type":"short","level":"VD","q":"Biểu thức not (6 nhỏ hơn 6) and (2 != 3) có giá trị là gì?","answer":"True","explain":"not False = True; True and True = True.","points":0.5},{"type":"short","level":"NB","q":"Sau lệnh tuoi = 16, biến tuoi lưu giá trị nào?","answer":"16","explain":"Lệnh gán đưa giá trị 16 vào biến tuoi.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"TH","q":"Kiểu dữ liệu của biến x sau lệnh x = (5 lớn hơn 3) là gì?","options":["A. bool","B. int","C. str","D. float"],"answer":"A","explain":"5 lớn hơn 3 là biểu thức so sánh cho giá trị True, kiểu bool.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho s = \"12a\"; x = int(s) sẽ xảy ra điều gì?","options":["A. Báo lỗi vì xâu chứa kí tự không phải số","B. x = 12","C. x = 12a","D. x = 0"],"answer":"A","explain":"int() chỉ chuyển được xâu toàn kí số (có thể kèm dấu); \"12a\" gây lỗi ValueError.","points":0.25},{"type":"mcq","level":"NB","q":"Kiểu số nguyên trong Python kí hiệu là gì?","options":["A. int","B. str","C. float","D. bool"],"answer":"A","explain":"int (integer) là kiểu số nguyên; str là xâu, float là số thực, bool là lôgic.","points":0.25},{"type":"mcq","level":"TH","q":"Đâu là cách đặt tên biến tốt (gợi nhớ) cho điểm môn Toán?","options":["A. diem_toan","B. x","C. aaaaa","D. qwerty"],"answer":"A","explain":"Tên biến nên gợi nhớ ý nghĩa: diem_toan rõ nghĩa hơn x hay các tên vô nghĩa.","points":0.25},{"type":"mcq","level":"NB","q":"Giá trị của biểu thức 2 + 3 * 4 trong Python là bao nhiêu?","options":["A. 14","B. 20","C. 24","D. 9"],"answer":"A","explain":"Nhân trước cộng sau: 3 * 4 = 12, 2 + 12 = 14.","points":0.25},{"type":"mcq","level":"VD","q":"Tên biến nào sau đây hợp lệ và gợi nhớ tốt nhất cho tổng số học sinh?","options":["A. tong_so_hs","B. TongSoHS","C. tsh","D. biến1"],"answer":"A","explain":"tong_so_hs vừa hợp lệ (chữ thường, gạch dưới) vừa gợi nhớ rõ nghĩa nhất.","points":0.25},{"type":"truefalse","level":"TH","q":"Cho a = 4; b = 6. Xét các phát biểu.","statements":["Biểu thức a + b cho 10.","Biểu thức a lớn hơn b cho False.","Biểu thức a != b cho True.","Biểu thức a == b cho True."],"answer":["T","F","T","F"],"explain":"a) 4+6=10 đúng. b) 4 lớn hơn 6 là sai. c) 4!=6 đúng. d) 4==6 sai.","points":1},{"type":"truefalse","level":"VDC","q":"Xét các phát biểu về lỗi liên quan đến biến.","statements":["Dùng biến chưa gán giá trị gây lỗi.","Gán nhầm = thành == trong lệnh gán gây lỗi cú pháp.","Đặt tên biến trùng từ khóa gây lỗi cú pháp.","Mọi lỗi về biến đều được phát hiện trước khi chạy."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: lỗi dùng biến chưa gán chỉ phát hiện khi chạy tới lệnh đó (lỗi ngoại lệ).","points":1},{"type":"short","level":"TH","q":"Cho a = 6; b = a - 2. Giá trị của b là bao nhiêu?","answer":"4","explain":"b = 6 - 2 = 4.","points":0.5},{"type":"short","level":"VDC","q":"Cho a = 5; b = 12; a = a + b; b = a - b; a = a - b. Giá trị cuối của a là bao nhiêu?","answer":"12","explain":"Hoán đổi không biến phụ: a=17, b=5, a=12.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"TH","q":"Cho n = 7; n = n // 2. Giá trị của n là bao nhiêu?","options":["A. 3","B. 3.5","C. 4","D. 1"],"answer":"A","explain":"7 // 2 = 3 (chia lấy phần nguyên), gán lại cho n.","points":0.25},{"type":"mcq","level":"VD","q":"Cho m = 8; m = m / 2; m = m + 1. Giá trị cuối của m và kiểu của m là gì?","options":["A. 5.0, kiểu float","B. 5, kiểu int","C. 4.0, kiểu float","D. 5, kiểu float"],"answer":"A","explain":"m / 2 = 4.0 (float); 4.0 + 1 = 5.0. Một khi đã thành float, cộng số nguyên vẫn ra float.","points":0.25},{"type":"mcq","level":"NB","q":"Lệnh nào sau đây gán xâu \"An\" cho biến ten?","options":["A. ten = \"An\"","B. ten == \"An\"","C. \"An\" = ten","D. ten := An"],"answer":"A","explain":"Lệnh gán dùng dấu = đơn: tên biến ở trái, giá trị ở phải.","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh nào hoán đổi giá trị hai biến a, b mà không dùng biến phụ trong Python?","options":["A. a, b = b, a","B. a = b; b = a","C. a == b; b == a","D. swap(a, b)"],"answer":"A","explain":"Gán đồng thời a, b = b, a là cách hoán đổi chuẩn trong Python.","points":0.25},{"type":"mcq","level":"TH","q":"Cho s = \"Tin\"; s = s + \" học\". Giá trị của s là gì?","options":["A. Tin học","B. Tin","C. học","D. Báo lỗi"],"answer":"A","explain":"Phép + nối xâu: s mới = \"Tin\" + \" học\" = \"Tin học\".","points":0.25},{"type":"mcq","level":"NB","q":"Kiểu dữ liệu của giá trị 3.14 trong Python là gì?","options":["A. Số thực (float)","B. Số nguyên (int)","C. Xâu kí tự (str)","D. Lôgic (bool)"],"answer":"A","explain":"3.14 có phần thập phân nên là số thực, kiểu float.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu sau.","statements":["Hằng là đại lượng không đổi giá trị.","Biểu thức 2 + 3 * 4 cho giá trị 14.","Python yêu cầu khai báo kiểu biến trước khi dùng.","Một biến có thể lưu giá trị kiểu khác nhau ở các thời điểm khác nhau."],"answer":["T","T","F","T"],"explain":"a,b,d) Đúng. c) Sai: Python tự xác định kiểu theo giá trị gán, không cần khai báo trước.","points":1},{"type":"truefalse","level":"VD","q":"Cho x = 5; y = x; x = 9. Xét các phát biểu.","statements":["Sau lệnh y = x, y = 5.","Sau lệnh x = 9, y vẫn là 5.","x và y luôn bằng nhau.","Mỗi biến có ô nhớ riêng."],"answer":["T","T","F","T"],"explain":"a,b,d) Đúng: y sao chép giá trị của x tại thời điểm gán. c) Sai: sau đó x đổi nhưng y không đổi theo.","points":1},{"type":"short","level":"NB","q":"Dấu dùng trong lệnh gán của Python là dấu gì?","answer":"=","explain":"Lệnh gán dùng dấu = đơn.","points":0.5},{"type":"short","level":"VD","q":"Cho a = \"7\"; b = int(a) * 2 + 1. Giá trị của b là bao nhiêu?","answer":"15","explain":"int(\"7\") = 7; 7 * 2 + 1 = 15.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Sau lệnh a = 5, biến a lưu giá trị nào?","options":["A. 5","B. a","C. 0","D. Không lưu gì"],"answer":"A","explain":"Lệnh a = 5 gán giá trị 5 cho biến a.","points":0.25},{"type":"mcq","level":"VDC","q":"Biểu thức (3 lớn hơn 2) + (5 lớn hơn 10) trong Python cho kết quả gì?","options":["A. 1","B. True","C. 0","D. Báo lỗi"],"answer":"A","explain":"True/False khi tham gia phép số học được coi là 1/0: True + False = 1.","points":0.25},{"type":"mcq","level":"VD","q":"Cho a = 10; b = 3; a, b = b, a + b. Giá trị cuối của a và b là gì?","options":["A. a = 3, b = 13","B. a = 10, b = 3","C. a = 3, b = 10","D. a = 13, b = 3"],"answer":"A","explain":"Vế phải tính trước với giá trị cũ: (3, 13), rồi gán đồng thời: a = 3, b = 13.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào sau đây đúng về lệnh gán?","options":["A. Máy tính giá trị vế phải trước rồi gán cho biến ở vế trái","B. Máy tính giá trị vế trái trước","C. Hai vế được tính đồng thời","D. Lệnh gán không tính toán gì"],"answer":"A","explain":"Quy tắc lệnh gán: tính giá trị của biểu thức vế phải, rồi lưu vào biến ở vế trái.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu thức so sánh \"10 lớn hơn hoặc bằng 10\" trong Python có giá trị gì?","options":["A. True","B. False","C. 10","D. Báo lỗi"],"answer":"A","explain":"10 lớn hơn hoặc bằng 10 là đúng, giá trị True.","points":0.25},{"type":"mcq","level":"NB","q":"Biến trong lập trình là gì?","options":["A. Đại lượng được đặt tên, dùng để lưu trữ giá trị và giá trị có thể thay đổi","B. Một con số cố định không bao giờ đổi","C. Tên của máy tính","D. Một loại virus"],"answer":"A","explain":"Biến là đại lượng được đặt tên, dùng để lưu trữ giá trị; giá trị của biến có thể thay đổi trong quá trình thực ":"A","explain":"Lệnh thứ hai lấy giá trị cũ của x (10) cộng 3 rồi gán lại: x = 13.","points":0.25},{"type":"mcq","level":"NB","q":"Hằng trong lập trình là gì?","options":["A. Đại lượng có giá trị không thay đổi trong chương trình","B. Biến thay đổi liên tục","C. Lỗi chương trình","D. Tên tệp"],"answer":"A","explain":"Hằng là đại lượng giữ nguyên giá trị suốt quá trình chạy chương trình, ngược với biến.","points":0.25},{"type":"mcq","level":"VD","q":"Cho x = 5; y = 2; z = x ** y + y ** x. Giá trị của z là bao nhiêu?","options":["A. 57","B. 32","C. 25","D. 35"],"answer":"A","explain":"x ** y = 25; y ** x = 32; z = 25 + 32 = 57.","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = 2; b = 5; c = a; a = b; b = c. Giá trị cuối của a và b là gì?","options":["A. a = 5, b = 2","B. a = 2, b = 5","C. a = 5, b = 5","D. a = 2, b = 2"],"answer":"A","explain":"Dùng biến trung gian c để hoán đổi: sau cùng a = 5, b = 2.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về quy ước đặt tên.","statements":["Nên đặt tên biến gợi nhớ ý nghĩa.","Tên hằng thường viết IN HOA.","Tên biến nên viết bằng tiếng Việt có dấu.","tong_diem tốt hơn x khi lưu tổng điểm."],"answer":["T","T","F","T"],"explain":"a,b,d) Đúng. c) Sai: tên biến không dùng dấu tiếng Việt để tránh lỗi font và khó gõ.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về tên biến.","statements":["diem_toan là tên biến hợp lệ.","2diem là tên biến không hợp lệ.","if không được dùng làm tên biến.","Tên biến được phép chứa dấu cách."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng: không bắt đầu bằng số, không trùng từ khóa. d) Sai: tên biến không chứa dấu cách.","points":1},{"type":"short","level":"VD","q":"Cho a = 9; b = 4; c = a // b + a % b. Giá trị của c là bao nhiêu?","answer":"3","explain":"9 // 4 = 2; 9 % 4 = 1; 2 + 1 = 3.","points":0.5},{"type":"short","level":"NB","q":"Hai giá trị của kiểu lôgic (bool) trong Python là gì? (viết cách nhau bởi dấu phẩy)","answer":"True, False" "q":"Kiểu dữ liệu của 2026 trong Python là gì?","options":["A. Số nguyên (int)","B. Số thực (float)","C. Xâu kí tự (str)","D. Lôgic (bool)"],"answer":"A","explain":"2026 là số nguyên không có phần thập phân, kiểu int.","points":0.25},{"type":"mcq","level":"TH","q":"Câu lệnh a, b = 3, 4 có tác dụng gì?","options":["A. Gán a = 3 và b = 4 cùng lúc","B. Báo lỗi","C. Gán a = b = 3","D. Gán a = 4, b = 3"],"answer":"A","explain":"Python cho phép gán đồng thời nhiều biến: a nhận 3, b nhận 4.","points":0.25},{"type":"truefalse","level":"VDC","q":"Cho p = (2 nhỏ hơn 5); q = (8 nhỏ hơn 3). Xét các phát biểu.","statements":["p là True, kiểu bool.","q là False, kiểu bool.","p and q cho False.","p or q cho True."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Cho x = 10; x = x - 4. Xét các phát biểu.","statements":["Lệnh thứ hai dùng giá trị cũ của x để tính.","Giá trị mới của x là 6.","Biến x giữ đồng thời hai giá trị 10 và 6.","Lệnh x = x - 4 là vô nghĩa trong toán học nhưng hợp lệ trong lập trình."],"answer":["T","T","F","T"],"explain":"a,b,d) Đúng. c) Sai: sau lệnh gán, x chỉ còn giá trị mới 6.","points":1},{"type":"short","level":"TH","q":"Cho s = \"Py\"; s = s + \"thon\". Giá trị của s là gì?","answer":"Python","explain":"Nối xâu được \"Python\".","points":0.5},{"type":"short","level":"VDC","q":"Biểu thức (10 lớn hơn 5) + (3 lớn hơn 8) + (7 == 7) cho kết quả bao nhiêu?","answer":"2","explain":"True + False + True = 1 + 0 + 1 = 2.","points":0.5}]}]}</script>
