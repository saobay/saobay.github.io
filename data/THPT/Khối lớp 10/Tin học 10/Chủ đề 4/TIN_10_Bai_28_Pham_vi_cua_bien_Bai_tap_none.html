","statements":["Tham số là biến cục bộ.","Tham số chỉ dùng trong hàm.","Tham số dùng được ngoài hàm.","Mỗi lần gọi, tham số nhận giá trị mới."],"answer":["T","T","F","T"],"explain":"a,b,d) Đúng. c) Sai.","points":1},{"type":"truefalse","level":"VD","q":"Xét đoạn lệnh: x = 5; def f(): y = x + 1; x = 10; return y. Các phát biểu sau đúng hay sai?","statements":["x là biến cục bộ trong cả hàm f.","Dòng y = x + 1 gây lỗi.","Nguyên nhân: x cục bộ chưa được gán.","Hàm trả về 6."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng: Python xác định phạm vi khi định nghĩa. d) Sai: lỗi trước khi return.","points":1},{"type":"short","level":"NB","q":"Biến định nghĩa trong hàm gọi là biến gì?","answer":"cục bộ","explain":"Biến cục bộ (local).","points":0.5},{"type":"short","level":"VD","q":"Trong hàm, tên biến cục bộ và toàn cục trùng nhau thì dùng biến nào?","answer":"cục bộ","explain":"Biến cục bộ che khuất toàn cục.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Đoạn lệnh: def f(): x = 1; def g(): x = 2; in x; rồi gọi g(). In ra bao nhiêu?","options":["A. 2","B. 1","C. 3","D. Báo lỗi"],"answer":"A","explain":"x trong g là biến cục bộ của g, in ra 2.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: x = 7; def f(): x = 8; def g(): in x; rồi gọi f(); gọi g(). In ra bao nhiêu?","options":["A. 7","B. 8","C. Báo lỗi","D. 15"],"answer":"A","explain":"x trong f là cục bộ, không ảnh hưởng x toàn cục; g in x toàn cục = 7.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nên hạn chế biến toàn cục?","options":["A. Vì mọi hàm đều đổi được, khó theo dõi và dễ gây lỗi","B. Vì chạy chậm","C. Vì tốn bộ nhớ","D. Vì bị cấm"],"answer":"A","explain":"Biến toàn cục tạo phụ thuộc ẩn giữa các hàm, khó bảo trì.","points":0.25},{"type":"mcq","level":"VDC","q":"Phát biểu nào đúng về quy tắc xác định phạm vi?","options":["A. Python quyết định biến là cục bộ hay toàn cục khi ĐỊNH NGHĨA hàm (dựa vào có gán không), không phải khi chạy","B. Quyết định khi chạy", ":"a,b,c) Đúng. d) Sai: y mất khi hàm kết thúc.","points":1},{"type":"short","level":"VD","q":"Sửa lỗi trên bằng một từ khóa, từ khóa đó là gì?","answer":"global","explain":"Thêm global x trong hàm.","points":0.5},{"type":"short","level":"NB","q":"Từ khóa cho phép hàm gán biến toàn cục là gì?","answer":"global","explain":"Khai báo global trong hàm.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Đoạn lệnh: def f(): y = 5; rồi gọi f(); in y. Điều gì xảy ra?","options":["A. Báo lỗi vì y là biến cục bộ, ngoài hàm không dùng được","B. In ra 5","C. In ra 0","D. Không có gì"],"answer":"A","explain":"y chỉ tồn tại trong f; ngoài hàm không nhận biết y.","points":0.25},{"type":"mcq","level":"TH","q":"Nếu bỏ từ khóa global trong hàm tăng() trên, điều gì xảy ra?","options":["A. Báo lỗi khi chạy","B. dem thành 3","C. Không có gì","D. dem thành 1"],"answer":"A","explain":"dem = dem + 1 với dem cục bộ chưa gán gây lỗi.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: dem = 0; def tăng(): global dem; dem = dem + 1; rồi gọi tăng() 3 lần; in dem. In ra bao nhiêu?","options":["A. 3","B. 0","C. 1","D. 4"],"answer":"A","explain":"Mỗi lần gọi tăng 1: dem = 3.","points":0.25},{"type":"mcq","level":"NB","q":"Nếu trong hàm chỉ ĐỌC biến toàn cục mà không gán, có cần global không?","options":["A. Không cần","B. Cần","C. Tùy","D. Luôn cần"],"answer":"A","explain":"Chỉ khi gán (thay đổi) mới cần khai báo global.","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: def ngoài(): x = 1; def trong(): nonlocal x; x = 2; rồi gọi trong(); in x; rồi gọi ngoài(). In ra bao nhiêu?","options":["A. 2","B. 1","C. Báo lỗi","D. Không in gì"],"answer":"A","explain":"nonlocal cho phép gán x của hàm bao ngoài: in 2.","points":0.25},{"type":"mcq","level":"VD","q":"Sửa đoạn lệnh trên để hàm trả về 6 và x toàn cục thành 6:","options":["A. def f(): global x; x = x + 1; return x","B. def f(): x = 6","C. def f(x): x = x + 1","D. Không sửa được"],"answer":"A","explain":"Khai báo global để gán cho biến toàn cục.","points":0.25},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh: def ngoài(): x = 1; def trong(): nonlocal x; x = 2. Các phát biểu sau đúng hay sai?","statements":["nonlocal cho phép gán x của hàm ngoài.","Sau khi gọi trong(), x ngoài thành 2.","nonlocal dùng cho biến toàn cục.","global và nonlocal khác nhau."],"answer":["T","T","F","T"],"explain":"a,b,d) Đúng. c) Sai: nonlocal cho hàm bao ngoài, không phải toàn cục.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về hạn chế biến toàn cục.","statements":["Nên hạn chế biến toàn cục.","Biến toàn cục khó theo dõi.","Nên truyền qua tham số/return.","Càng nhiều biến toàn cục càng tốt."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"short","level":"TH","q":"Đoạn lệnh: x = 1; def f(): x = 2; rồi gọi f(); in x. In ra bao nhiêu?","answer":"1","explain":"x trong hàm là cục bộ, x ngoài không đổi.","points":0.5},{"type":"short","level":"VDC","q":"Từ khóa cho phép gán biến của hàm bao ngoài là gì?","answer":"nonlocal","explain":"nonlocal cho phạm vi enclosing.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"VD","q":"Phát biểu nào đúng về che khuất (shadowing)?","options":["A. Biến cục bộ cùng tên che khuất biến toàn cục trong hàm","B. Gây lỗi ngay","C. Hai biến tự cộng lại","D. Biến toàn cục luôn thắng"],"answer":"A","explain":"Trong hàm, tên cục bộ được ưu tiên.","points":0.25},{"type":"mcq","level":"TH","q":"Sau đoạn lệnh trên, in x thì được bao nhiêu?","options":["A. 100","B. 6","C. 5","D. Báo lỗi"],"answer":"A","explain":"x toàn cục không bị ảnh hưởng: 100.","points":0.25},{"type":"mcq","level":"TH","q":"Cách viết hàm tốt thay cho dùng biến toàn cục là?","options":["A. Truyền dữ liệu qua tham số, trả kết quả qua return","B. Dùng thật nhiều biến toàn cục","C. Viết tất cả trong một hàm","D. Không cần dữ liệu"],"answer":"A","explain":"Hàm độc lập với tham số/return dễ hiểu, dễ kiểm thử.","points":0.25},{"type":"mcq","level":"NB","q":"Phạm vi (scope) của biến là gì?","options":["A. Vùng của chương trình mà ở đó biến được nhận biết và sử dụng được","B. Giá trị của biến","C. Kiểu của biến","D. Tên của biến"],"answer":"A","explain":"Phạm vi xác định nơi biến tồn tại và dùng được.","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: x = 1; def f(): print(x); x = 2. Khi gọi f(), lệnh in nào chạy?","options":["A. Không in gì vì lỗi xảy ra trước khi in","B. In 1","C. In 2","D. In 1 rồi lỗi"],"answer":"A","explain":"x là cục bộ (do có gán sau); print(x) dùng x cục bộ chưa gán nên lỗi ngay, không in gì.","points":0.25},{"type":"mcq","level":"NB","q":"Đoạn lệnh: x = 10; def f(): in x; rồi gọi f(). In ra gì?","options":["A. 10","B. Báo lỗi","C. Không in gì","D. 0"],"answer":"A","explain":"Hàm đọc được biến toàn cục x.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về thiết kế.","statements":["Hàm tốt ít phụ thuộc biến toàn cục.","Tham số/return làm hàm độc lập.","Hàm độc lập dễ kiểm thử.","Dùng global mọi nơi là tốt."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về phạm vi biến.","statements":["Biến toàn cục định nghĩa ngoài mọi hàm.","Biến cục bộ định nghĩa trong hàm.","Biến toàn cục dùng được trong hàm.","Biến cục bộ dùng được ngoài hàm."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: cục bộ chỉ trong hàm.","points":1},{"type":"short","level":"VD","q":"Đoạn lệnh: x = [1]; def f(): x.append(2); rồi gọi f(); in x. In ra gì? (viết dạng danh sách)","answer":"[1, 2]","explain":"Đổi nội dung danh sách không cần global.","points":0.5},{"type":"short","level":"NB","q":"Biến định nghĩa ngoài mọi hàm gọi là biến gì?","answer":"toàn cục","explain":"Biến toàn cục (global).","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"VD","q":"Muốn viết hàm hoán đổi hai biến toàn cục a, b, cách đúng là?","options":["A. def hoán(): global a, b; a, b = b, a","B. def hoán(): a, b = b, a","C. Không hoán đổi được","D. a, b = b, a ngoài hàm"],"answer":"A","explain":"Cần global để gán cho biến toàn cục; B chỉ đổi biến cục bộ.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: x = 5; def f(): global x; x = x * 2; rồi gọi f(); gọi f(); in x. In ra bao nhiêu?","options":["A. 20","B. 10","C. 5","D. 40"],"answer":"A","explain":"Mỗi lần gọi nhân đôi: 5→10→20.","points":0.25},{"type":"mcq","level":"VDC","q":"Phân biệt global và nonlocal:","options":["A. global: biến cấp chương trình; nonlocal: biến của hàm bao ngoài","B. Hai từ giống nhau","C. nonlocal cho biến toàn cục","D. global cho hàm bao ngoài"],"answer":"A","explain":"Đúng theo định nghĩa.","points":0.25},{"type":"mcq","level":"NB","q":"Biến định nghĩa trong thân hàm là biến gì?","options":["A. Biến cục bộ","B. Biến toàn cục","C. Tham số mặc định","D. Hằng số"],"answer":"A","explain":"Đó là biến cục bộ của hàm.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: x = 10; def f(): x = x + 1; rồi gọi f(). Điều gì xảy ra?","options":["A. Báo lỗi vì x cục bộ chưa có giá trị mà đã dùng","B. x thành 11","C. In ra 11","D. Không có gì"],"answer":"A","explain":"Gán x trong hàm làm x thành biến cục bộ; đọc x+1 khi x cục bộ chưa gán gây lỗi.","points":0.25},{"type":"mcq","level":"NB","q":"Quy tắc LEGB trong Python là gì? (gợi ý: thứ tự tìm biến)","options":["A. Local → Enclosing → Global → Built-in","B. Global trước","C. Ngẫu nhiên","D. Chỉ tìm trong hàm"],"answer":"A","explain":"Python tìm biến từ cục bộ, ra hàm bao ngoài, ra toàn cục, rồi đến dựng sẵn.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét đoạn lệnh: x = 1; def f(): x = 2. Các phát biểu sau đúng hay sai?","statements":["x trong hàm là biến cục bộ.","Gọi f() không đổi x ngoài.","Sau khi gọi, x ngoài vẫn là 1.","x trong hàm che khuất x ngoài."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"truefalse","level":"VDC","q":"Xét các phát biểu về LEGB.","statements":["Python tìm biến từ phạm vi hẹp ra rộng.","Thứ tự: Local, Enclosing, Global, Built-in.","Tên dựng sẵn như len thuộc Built-in.","Biến luôn tìm ở Global trước."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: Local trước.","points":1},{"type":"short","level":"VDC","q":"Đoạn lệnh: x = 0; def f(): global x; x = 7; rồi gọi f() 2 lần; in x. In ra bao nhiêu?","answer":"7","explain":"Mỗi lần gán 7, không cộng dồn.","points":0.5},{"type":"short","level":"TH","q":"Đoạn lệnh: def f(): y = 9; rồi gọi f(); in y. Điều gì xảy ra? (trả lời: lỗi/không lỗi)","answer":"lỗi","explain":"y cục bộ, ngoài hàm không dùng được.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"VD","q":"Phát biểu nào đúng về hàm và biến toàn cục trong dự án lớn?","options":["A. Lạm dụng biến toàn cục làm code khó bảo trì","B. Càng nhiều biến toàn cục càng tốt","C. Biến toàn cục chạy nhanh hơn","D. Không ảnh hưởng gì"],"answer":"A","explain":"Biến toàn cục tạo phụ thuộc ẩn, khó kiểm thử và bảo trì.","points":0.25},{"type":"mcq","level":"NB","q":"Phát biểu nào đúng về biến toàn cục?","options":["A. Nên hạn chế dùng vì dễ gây lỗi khó kiểm soát","B. Nên dùng càng nhiều càng tốt","C. Không bao giờ dùng được","D. Chỉ dùng trong hàm"],"answer":"A","explain":"Biến toàn cục bị mọi hàm thay đổi được nên khó theo dõi; nên truyền qua tham số.","points":0.25},{"type":"mcq","level":"NB","q":"Tham số của hàm là biến toàn cục hay cục bộ?","options":["A. Cục bộ","B. Toàn cục","C. Tùy lúc","D. Không phải biến"],"answer":"A","explain":"Tham số là biến cục bộ của hàm.","points":0.25},{"type":"mcq","level":"TH","q":"Hàm lồng nhau: def ngoài(): x = 1; def trong(): in x; rồi gọi trong(). Biến x trong hàm trong là gì?","options":["A. Biến của hàm bao ngoài (enclosing), đọc được","B. Biến toàn cục","C. Biến cục bộ của hàm trong","D. Báo lỗi"],"answer":"A","explain":"Hàm trong đọc được biến của hàm bao ngoài (phạm vi enclosing).","points":0.25},{"type":"mcq","level":"TH","q":"Từ khóa nonlocal dùng để làm gì?","options":["A. Gán cho biến của hàm bao ngoài (không phải toàn cục)","B. Tạo biến toàn cục","C. Xóa biến","D. Tạo hằng số"],"answer":"A","explain":"nonlocal tương tự global nhưng cho phạm vi hàm bao ngoài.","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: x = 0; def f(): global x; x = 1; def g(): x = 2; rồi gọi f(); gọi g(); in x. In ra bao nhiêu?","options":["A. 1","B. 2","C. 0","D. 3"],"answer":"A","explain":"f gán x toàn cục = 1; g chỉ tạo x cục bộ của g; x toàn cục vẫn 1.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về che khuất.","statements":["Biến cục bộ cùng tên che khuất toàn cục.","Trong hàm ưu tiên tên cục bộ.","Che khuất gây lỗi ngay.","Ngoài hàm vẫn dùng biến toàn cục."],"answer":["T","T","F","T"],"explain":"a,b,d) Đúng. c) Sai: che khuất hợp lệ, không lỗi.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về global.","statements":["global cho phép hàm gán biến toàn cục.","Đọc biến toàn cục không cần global.","Gán biến toàn cục trong hàm cần global.","global dùng ngoài hàm."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: global khai báo trong hàm.","points":1},{"type":"short","level":"NB","q":"Biến cục bộ tồn tại khi nào?","answer":"khi hàm đang chạy","explain":"Tạo khi gọi hàm, hủy khi hàm xong.","points":0.5},{"type":"short","level":"VD","q":"Đoạn lệnh: x = 10; def f(): x = x + 1; rồi gọi f(). Có lỗi không? (trả lời: có/không)","answer":"có","explain":"x cục bộ chưa gán đã dùng ở vế phải.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"TH","q":"Đoạn lệnh: a = 1; b = 2; def f(): a = 10; return a + b; rồi in f(); in a. In ra gì?","options":["A. 12 rồi 1","B. 12 rồi 10","C. 3 rồi 1","D. 3 rồi 10"],"answer":"A","explain":"Trong hàm: a cục bộ = 10, b toàn cục = 2: 12; a ngoài vẫn 1.","points":0.25},{"type":"mcq","level":"NB","q":"Từ khóa nào cho phép hàm thay đổi biến toàn cục?","options":["A. global","B. local","C. public","D. var"],"answer":"A","explain":"Khai báo global x trong hàm để gán được cho biến toàn cục x.","points":0.25},{"type":"mcq","level":"NB","q":"Đoạn lệnh: x = 5; def f(): in x + 1; rồi gọi f(). In ra bao nhiêu?","options":["A. 6","B. 5","C. Báo lỗi","D. 1"],"answer":"A","explain":"Đọc x toàn cục: 5 + 1 = 6.","points":0.25},{"type":"mcq","level":"VDC","q":"Thiết kế nào tốt nhất cho hàm cần dùng chung bộ đếm?","options":["A. Đóng gói bộ đếm trong tham số/return hoặc lớp, tránh global","B. Dùng biến toàn cục","C. Dùng biến cục bộ","D. Không cần bộ đếm"],"answer":"A","explain":"Tránh global giúp hàm độc lập, dễ kiểm thử và tái sử dụng.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: x = [1, 2]; def f(): x.append(3); rồi gọi f(); in x. In ra gì?","options":["A. [1, 2, 3]","B. [1, 2]","C. Báo lỗi","D. [3]"],"answer":"A","explain":"Không cần global vì không GÁN x mà chỉ gọi phương thức đổi nội dung danh sách.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào đúng về đọc và ghi biến toàn cục trong hàm?","options":["A. Đọc thì không cần global; gán thì cần global","B. Lúc nào cũng cần global","C. Không bao giờ cần global","D. Đọc cần, gán không cần"],"answer":"A","explain":"Quy tắc: chỉ khi gán mới cần khai báo global.","points":0.25},{"type":"truefalse","level":"VDC","q":"Xét các phát biểu tổng kết.","statements":["Chỉ dùng global khi thật sự cần.","Ưu tiên tham số và return.","Biến cục bộ giúp tránh xung đột tên.","Biến toàn cục không bao giờ được dùng."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: vẫn có trường hợp chính đáng (như hằng số cấu hình).","points":1},{"type":"truefalse","level":"TH","q":"Xét đoạn lệnh: x = 10; def f(): x = x + 1. Các phát biểu sau đúng hay sai?","statements":["x trong hàm là biến cục bộ.","Dòng x = x + 1 gây lỗi.","Nguyên nhân: dùng biến cục bộ chưa gán.","Sửa bằng cách thêm global x."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"short","level":"TH","q":"Muốn hàm đổi biến đếm toàn cục dem, trong hàm cần khai báo gì?","answer":"global dem","explain":"Khai báo global dem trước khi gán.","points":0.5},{"type":"short","level":"VDC","q":"Đoạn lệnh: x = 5; def f(): y = x + 1; x = 10; return y; rồi gọi f(). Kết quả là gì? (trả lời: lỗi/số)","answer":"lỗi","explain":"x là cục bộ trong cả hàm nên y = x + 1 lỗi.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Đoạn lệnh: x = 1; def f(): global x; x = 2; rồi gọi f(); in x. In ra bao nhiêu?","options":["A. 2","B. 1","C. 3","D. Báo lỗi"],"answer":"A","explain":"global x cho phép gán thẳng vào biến toàn cục.","points":0.25},{"type":"mcq","level":"NB","q":"Đoạn lệnh: def f(): return 10; rồi in f(). Có biến nào toàn cục không?","options":["A. Không","B. Có, f","C. Có, 10","D. Có, return"],"answer":"A","explain":"f là tên hàm toàn cục nhưng không có biến dữ liệu toàn cục nào.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: x = 3; def f(): y = x * 2; return y; rồi in f(). In ra bao nhiêu?","options":["A. 6","B. 3","C. Báo lỗi","D. 9"],"answer":"A","explain":"Đọc x toàn cục: y = 6, trả về 6.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: n = 0; def tạo(): n = n + 1; return n. Để mỗi lần gọi tạo() trả về số tăng dần (1, 2, 3...), cần sửa gì?","options":["A. Thêm global n trong hàm","B. Không cần sửa","C. Đổi n = 1","D. Bỏ return"],"answer":"A","explain":"Hiện tại lỗi vì gán n cục bộ; cần global để dùng n toàn cục làm bộ đếm.","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: a = 5; def f(a): a = a + 1; return a; rồi in f(a); in a. In ra gì?","options":["A. 6 rồi 5","B. 6 rồi 6","C. 5 rồi 5","D. 5 rồi 6"],"answer":"A","explain":"Tham số a che khuất a toàn cục; a ngoài không đổi.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào SAI?","options":["A. Biến cục bộ dùng được ngoài hàm","B. Biến toàn cục đọc được trong hàm","C. Tham số là biến cục bộ","D. global cho phép gán biến toàn cục"],"answer":"A","explain":"A sai: biến cục bộ chỉ dùng trong hàm.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét đoạn lệnh: x = 10; def f(): in x. Các phát biểu sau đúng hay sai?","statements":["x là biến toàn cục.","Hàm f đọc được x.","Gọi f() in ra 10.","Cần khai báo global x mới in được."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: chỉ đọc thì không cần global.","points":1},{"type":"truefalse","level":"VD","q":"Xét đoạn lệnh: x = [1, 2]; def f(): x.append(3). Các phát biểu sau đúng hay sai?","statements":["Không cần global vì không gán lại x.","Sau khi gọi, x = [1, 2, 3].","append đổi nội dung danh sách.","Mọi thay đổi trong hàm đều cần global."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: chỉ khi gán lại tên mới cần.","points":1},{"type":"short","level":"VD","q":"Đoạn lệnh: x = 3; def f(): y = x * 2; return y; rồi in f(). In ra bao nhiêu?","answer":"6","explain":"Đọc x toàn cục: 3 * 2 = 6.","points":0.5},{"type":"short","level":"NB","q":"Hàm có đọc được biến toàn cục không? (trả lời: có/không)","answer":"có","explain":"Đọc thì được, không cần global.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Biến cục bộ tồn tại trong thời gian nào?","options":["A. Chỉ khi hàm đang chạy","B. Suốt chương trình","C. Mãi mãi","D. Một giây"],"answer":"A","explain":"Biến cục bộ được tạo khi gọi hàm và hủy khi hàm kết thúc.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: x = 100; def f(x): return x + 1; rồi in f(5). In ra bao nhiêu?","options":["A. 6","B. 101","C. 100","D. 5"],"answer":"A","explain":"Tham số x che khuất x toàn cục: 5 + 1 = 6.","points":0.25},{"type":"mcq","level":"NB","q":"Biến cục bộ (local) là gì?","options":["A. Biến định nghĩa trong hàm, chỉ dùng được trong hàm đó","B. Biến dùng khắp chương trình","C. Biến ngoài hàm","D. Biến không dùng được"],"answer":"A","explain":"Biến cục bộ (kể cả tham số) chỉ tồn tại trong hàm chứa nó.","points":0.25},{"type":"mcq","level":"VDC","q":"Phát biểu nào SAI?","options":["A. Biến toàn cục luôn tốt hơn biến cục bộ","B. Biến cục bộ giúp hàm độc lập","C. global cần khi gán biến toàn cục","D. Tham số là biến cục bộ"],"answer":"A","explain":"A sai: lạm dụng toàn cục gây khó bảo trì.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: x = 1; y = 2; def f(): x = 10; y = 20; rồi gọi f(); in x + y. In ra bao nhiêu?","options":["A. 3","B. 30","C. 12","D. 21"],"answer":"A","explain":"Gán trong hàm tạo biến cục bộ; x, y toàn cục vẫn 1, 2: tổng 3.","points":0.25},{"type":"mcq","level":"TH","q":"Biến toàn cục và biến cục bộ trùng tên thì sao?","options":["A. Trong hàm dùng biến cục bộ (che khuất toàn cục)","B. Báo lỗi","C. Dùng biến toàn cục","D. Cộng hai biến"],"answer":"A","explain":"Biến cục bộ che khuất (shadow) biến toàn cục cùng tên trong hàm.","points":0.25},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh: x = 1; def f(): print(x); x = 2. Các phát biểu sau đúng hay sai?","statements":["x là cục bộ trong f.","Lệnh in gây lỗi.","Không in gì cả.","Sửa bằng global x ở đầu hàm."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét đoạn lệnh: x = 1; def f(): global x; x = 2. Các phát biểu sau đúng hay sai?","statements":["Khai báo global x trong hàm.","Gán x là gán biến toàn cục.","Sau khi gọi, x ngoài thành 2.","Không cần global vẫn đổi được."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: không global thì tạo biến cục bộ.","points":1},{"type":"short","level":"TH","q":"Đoạn lệnh: x = 1; def f(): global x; x = 2; rồi gọi f(); in x. In ra bao nhiêu?","answer":"2","explain":"global cho gán biến toàn cục.","points":0.5},{"type":"short","level":"VDC","q":"Có nên lạm dụng biến toàn cục không? (trả lời: có/không)","answer":"không","explain":"Khó theo dõi, dễ lỗi, khó bảo trì.","points":0.5}]}]}</script>
