},{"type":"short","level":"TH","q":"Cho a = [4, 1, 4, 9], lệnh a.count(4) cho kết quả bao nhiêu?","answer":"2","explain":"Số 4 xuất hiện 2 lần.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"VD","q":"Cho a = [3, 6, 9, 12, 15]. Muốn xóa các phần tử ở vị trí lẻ (chỉ số 1, 3), cách an toàn là?","options":["A. del a[3]; del a[1] (xóa từ cuối lên đầu)","B. del a[1]; del a[3]","C. a.remove(1); a.remove(3)","D. a.pop(1); a.pop(1)"],"answer":"A","explain":"Xóa từ chỉ số lớn trước để các chỉ số nhỏ không bị lệch. B sai vì sau khi xóa chỉ số 1 thì 12 tụt về chỉ số 2.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn xóa TẤT CẢ các phần tử có giá trị 2 khỏi a = [2, 5, 2, 8, 2], cách đúng là?","options":["A. while 2 in a: a.remove(2)","B. a.remove(2)","C. del a[0]","D. a.pop(2)"],"answer":"A","explain":"remove chỉ xóa một lần gặp; lặp chừng nào còn 2 thì xóa hết.","points":0.25},{"type":"mcq","level":"NB","q":"Điều gì xảy ra khi gọi a.remove(99) mà 99 không có trong a?","options":["A. Báo lỗi","B. Không làm gì","C. Xóa phần tử cuối","D. Thêm 99 vào"],"answer":"A","explain":"remove giá trị không tồn tại gây lỗi ValueError.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho a = [5, 2, 9, 1, 7]. Đoạn lệnh: for i in range(len(a)): m = i; for j in range(i + 1, len(a)): nếu a[j] nhỏ hơn a[m] thì m = j; đổi a[i], a[m]. Đây là thuật toán gì và kết quả?","options":["A. Sắp xếp chọn, a = [1, 2, 5, 7, 9]","B. Sắp xếp nổi bọt, a = [1, 2, 5, 7, 9]","C. Tìm kiếm, a không đổi","D. Đảo ngược, a = [7, 1, 9, 2, 5]"],"answer":"A","explain":"Mỗi vòng chọn phần tử nhỏ nhất đưa về đầu: sắp xếp chọn (selection sort).","points":0.25},{"type":"mcq","level":"NB","q":"Điều gì xảy ra khi gọi a.index(99) mà 99 không có trong a?","options":["A. Báo lỗi","B. Trả về -1","C. Trả về 0","D. Không làm gì"],"answer":"A","explain":"index của giá trị không tồn tại gây lỗi ValueError.","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [10, 20, 30, 40]. Sau lệnh x = a.pop(), x và a là gì?","options":["A. x = 40, a = [10, 20, 30]","B. x = 10, a = [20, 30, 40]","C. x = 40, a = [10, 20, 30, 40]","D. Báo lỗi"],"answer":"A","explain":"pop() không đối số lấy phần tử cuối: x = 40, a còn 3 phần tử.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về xóa phần tử.","statements":["remove(x) xóa phần tử đầu tiên có giá trị x.","pop(i) xóa và trả về phần tử vị trí i.","del a[i] xóa phần tử vị trí i.","remove(x) xóa mọi phần tử có giá trị x."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: remove chỉ xóa lần gặp đầu tiên.","points":1},{"type":"truefalse","level":"VD","q":"Muốn xóa phần tử ở vị trí lẻ của a = [3, 6, 9, 12, 15]. Xét các phát biểu.","statements":["Nên xóa từ chỉ số lớn về nhỏ.","del a[3]; del a[1] cho [3, 9, 15].","del a[1]; del a[3] sẽ xóa sai.","Không thể xóa nhiều phần tử."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: xóa được nhưng phải cẩn thận thứ tự.","points":1},{"type":"short","level":"VD","q":"Cho a = [10, 20, 30], lệnh a.pop() trả về bao nhiêu?","answer":"30","explain":"pop() lấy phần tử cuối.","points":0.5},{"type":"short","level":"NB","q":"Lệnh xóa phần tử đầu tiên có giá trị x là lệnh gì?","answer":"remove","explain":"a.remove(x) xóa lần gặp đầu tiên của x.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Cho a = [1, 2, 3, 2]. Sau lệnh a.remove(2), a bằng gì?","options":["A. [1, 3, 2]","B. [1, 3]","C. [1, 2, 3]","D. [2, 3, 2]"],"answer":"A","explain":"remove xóa phần tử 2 ĐẦU TIÊN gặp: [1, 3, 2].","points":0.25},{"type":"mcq","level":"VD","q":"Cho a = [5, 3, 8, 1]. Muốn chèn 6 vào đúng vị trí để danh sách đã xếp tăng dần [1, 3, 5, 8] vẫn có thứ tự, dùng lệnh nào?","options":["A. a.insert(3, 6)","B. a.append(6)","C. a.insert(0, 6)","D. a[3] = 6"],"answer":"A","explain":"Danh sách đã xếp: [1,3,5,8]; 6 nằm giữa 5 (chỉ số 2) và 8 (chỉ số 3) nên chèn tại vị trí 3.","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: a = [1, 2, 3]; b = a; c = a.copy(); b.append(4); c.append(5). Giá trị a, b, c là gì?","options":["A. a = [1,2,3,4], b = [1,2,3,4], c = [1,2,3,5]","B. a = [1,2,3], b = [1,2,3,4], c = [1,2,3,5]","C. a = [1,2,3,4,5], b = [1,2,3,4], c = [1,2,3,5]","D. Báo lỗi"],"answer":"A","explain":"b cùng trỏ với a nên a đổi theo b; c là bản sao độc lập.","points":0.25},{"type":"mcq","level":"TH","q":"Lệnh a.clear() có tác dụng gì?","options":["A. Xóa hết phần tử, a thành []","B. Xóa biến a","C. Sắp xếp a","D. Không làm gì"],"answer":"A","explain":"clear() làm rỗng danh sách nhưng biến a vẫn tồn tại.","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [4, 9, 2, 7]. Sau lệnh a.sort(), phần tử đầu và cuối là gì?","options":["A. 2 và 9","B. 4 và 7","C. 9 và 2","D. 4 và 9"],"answer":"A","explain":"Sắp xếp: [2, 4, 7, 9]; đầu 2, cuối 9.","points":0.25},{"type":"mcq","level":"NB","q":"Cho a = [1, 3]. Sau lệnh a.insert(1, 2), a bằng gì?","options":["A. [1, 2, 3]","B. [2, 1, 3]","C. [1, 3, 2]","D. [1, 3]"],"answer":"A","explain":"Chèn 2 vào vị trí 1: [1, 2, 3].","points":0.25},{"type":"truefalse","level":"TH","q":"Cho a = [4, 9, 2, 7]. Xét các phát biểu.","statements":["a.sort() cho [2, 4, 7, 9].","a.reverse() sau đó cho [9, 7, 4, 2].","sorted(a) không đổi a.","a.sort() trả về danh sách đã xếp."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: sort() trả về None.","points":1},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh: a = [5, 9, 2]; i = 0; while i != len(a): nếu a[i] % 2 == 1 thì del a[i] ngược lại i = i + 1. Các phát biểu sau đúng hay sai?","statements":["Khi xóa thì i giữ nguyên để xét phần tử mới tụt về.","Số chẵn thì i tăng.","Sau vòng lặp a = [2].","Cách này an toàn hơn for khi xóa."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"short","level":"TH","q":"Cho a = [4, 1, 4, 9], lệnh a.index(9) cho kết quả bao nhiêu?","answer":"3","explain":"9 ở chỉ số 3.","points":0.5},{"type":"short","level":"VDC","q":"[8, 8, 8].count(8) + [8, 8, 8].index(8) bằng bao nhiêu?","answer":"3"
