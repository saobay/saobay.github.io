u thành tệp để chạy lại nhiều lần và dễ sửa; chế độ gõ trực tiếp chỉ hợp để thử từng lệnh ngắn.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét đoạn lệnh: print(2 + 3 * 4 ** 2). Các phát biểu sau đúng hay sai?","statements":["Lũy thừa được tính trước tiên: 4 ** 2 = 16.","Tiếp theo tính 3 * 16 = 48.","Cuối cùng 2 + 48 = 50.","Kết quả in ra là 32."],"answer":["T","T","T","F"],"explain":"Thứ tự: ** rồi * rồi +: 4**2=16, 3*16=48, 2+48=50. Vậy kết quả là 50, phát biểu d) sai.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về môi trường Python.","statements":["IDLE là môi trường lập trình Python.","Dấu nhắc gồm ba dấu lớn hơn là của chế độ gõ lệnh trực tiếp.","Tệp chương trình Python có đuôi .py.","Chế độ soạn thảo thực hiện ngay từng lệnh sau khi nhấn Enter."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: thực hiện ngay từng lệnh là đặc điểm của chế độ gõ lệnh trực tiếp, còn chế độ soạn thảo chạy cả tệp.","points":1},{"type":"short","level":"NB","q":"Câu lệnh Python dùng để in dữ liệu ra màn hình là lệnh gì? (viết tên lệnh, không kèm ngoặc)","answer":"print","explain":"Lệnh print() dùng để đưa dữ liệu ra màn hình.","points":0.5},{"type":"short","level":"VD","q":"Muốn in ra màn hình đúng 4 dấu sao ****, câu lệnh print đầy đủ là gì?","answer":"print(\"*\" * 4)","explain":"\"*\" * 4 lặp dấu * 4 lần thành \"****\".","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Người viết chương trình máy tính được gọi là gì?","options":["A. Lập trình viên","B. Kế toán","C. Họa sĩ","D. Nhà văn"],"answer":"A","explain":"Người sử dụng ngôn ngữ lập trình để viết chương trình gọi là lập trình viên.","points":0.25},{"type":"mcq","level":"TH","q":"Kết quả của lệnh print(2 ** 3) là gì?","options":["A. 8","B. 6","C. 5","D. 23"],"answer":"A","explain":"Toán tử ** là lũy thừa: 2 ** 3 = 8.","points":0.25},{"type":"mcq","level":"NB","q":"Hợp ngữ là gì?","options":["A. Ngôn ngữ dùng các từ viết tắt gợi nhớ thay cho mã máy","B. Ngôn ngữ nói của con người","C. Ngôn ngữ lập trình bậc cao","D. Ngôn ngữ của trình duyệt web"],"answer":"A","explain":"Hợp ngữ (assembly) dùng các kí hiệu, từ viết tắt gợi nhớ thay cho các lệnh mã máy, vẫn là ngôn ngữ bậc thấp.","points":0.25},{"type":"mcq","level":"VDC","q":"Phát biểu nào sau đây SAI?","options":["A. Mọi ngôn ngữ bậc cao đều phải được dịch sang ngôn ngữ máy mới chạy được","B. Chương trình thông dịch dịch từng lệnh và chạy ngay","C. Python vừa biên dịch vừa thông dịch tùy phiên bản","D. Ngôn ngữ máy gồm các lệnh mà CPU thực hiện trực tiếp"],"answer":"C","explain":"Python chuẩn (CPython) là ngôn ngữ thông dịch. Phát biểu C sai vì gây hiểu nhầm: Python không phải ngôn ngữ biên dịch.","points":0.25},{"type":"mcq","level":"VD","q":"Phát biểu nào sau đây đúng khi so sánh biên dịch và thông dịch?","options":["A. Biên dịch dịch cả chương trình trước khi chạy nên chương trình đích chạy nhanh hơn","B. Thông dịch luôn nhanh hơn biên dịch","C. Biên dịch không phát hiện được lỗi","D. Thông dịch không cần chương trình dịch"],"answer":"A","explain":"Biên dịch tạo sẵn mã máy nên khi chạy không tốn thời gian dịch, thường nhanh hơn thông dịch (vừa dịch vừa chạy).","points":0.25},{"type":"mcq","level":"TH","q":"Kết quả của lệnh print(7 // 2) là gì?","options":["A. 3","B. 3.5","C. 4","D. 1"],"answer":"A","explain":"Toán tử // là phép chia lấy phần nguyên: 7 // 2 = 3.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về phép toán trong Python.","statements":["print(2 ** 3) in ra 8.","print(7 // 2) in ra 3.","print(7 % 2) in ra 1.","print(20 / 4) in ra 5 (số nguyên)."],"answer":["T","T","T","F"],"explain":"a) Đúng: ** là lũy thừa. b) Đúng: // chia lấy phần nguyên. c) Đúng: % chia lấy dư. d) Sai: phép / luôn cho số thực 5.0.","points":1},{"type":"truefalse","level":"VDC","q":"Xét lệnh print(2 ** 3 ** 2). Các phát biểu sau đúng hay sai?","statements":["Lũy thừa kết hợp từ phải sang trái.","Tính 3 ** 2 = 9 trước.","Tiếp theo 2 ** 9 = 512.","Kết quả in ra là 64."],"answer":["T","T","T","F"],"explain":"** có tính kết hợp phải: 2**(3**2) = 2**9 = 512, không phải (2**3)**2 = 64.","points":1},{"type":"short","level":"TH","q":"Kết quả của lệnh print(9 // 2) là bao nhiêu?","answer":"4","explain":"Phép // chia lấy phần nguyên: 9 // 2 = 4.","points":0.5},{"type":"short","level":"VDC","q":"Kết quả của lệnh print(2 ** 2 ** 3) là bao nhiêu?","answer":"256","explain":"Lũy thừa kết hợp từ phải sang: 2 ** 3 = 8, rồi 2 ** 8 = 256.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Phần mềm nào sau đây dùng để lập trình Python?","options":["A. Microsoft Word","B. IDLE","C. Paint","D. PowerPoint"],"answer":"B","explain":"IDLE là môi trường phát triển tích hợp đi kèm Python, dùng để soạn thảo và chạy chương trình Python.","points":0.25},{"type":"mcq","level":"NB","q":"Chương trình dịch có nhiệm vụ gì?","options":["A. Dịch chương trình viết bằng ngôn ngữ bậc cao sang ngôn ngữ máy","B. Dịch văn bản tiếng Anh sang tiếng Việt","C. Sửa lỗi chính tả trong chương trình","D. Vẽ giao diện cho phần mềm"],"answer":"A","explain":"Chương trình dịch chuyển chương trình nguồn (viết bằng ngôn ngữ bậc cao) thành chương trình mà máy tính thực hiện được (ngôn ngữ máy).","points":0.25},{"type":"mcq","level":"TH","q":"Nhược điểm của cách thông dịch so với biên dịch là gì?","options":["A. Chương trình chạy chậm hơn vì vừa dịch vừa chạy","B. Không chạy được chương trình dài","C. Không phát hiện được lỗi","D. Tốn nhiều bộ nhớ đĩa hơn"],"answer":"A","explain":"Thông dịch dịch và chạy xen kẽ từng lệnh nên thường chậm hơn chương trình đã biên dịch sẵn thành mã máy.","points":0.25},{"type":"mcq","level":"VD","q":"Kết quả của lệnh print(9 % 2 + 8 // 3) là gì?","options":["A. 3","B. 4","C. 2","D. 5"],"answer":"A","explain":"9 % 2 = 1; 8 // 3 = 2; 1 + 2 = 3.","points":0.25},{"type":"mcq","level":"VDC","q":"Kết quả của lệnh print(-3 ** 2) là gì?","options":["A. -9","B. 9","C. -6","D. 6"],"answer":"A","explain":"Lũy thừa ưu tiên hơn dấu trừ 1.","points":0.25},{"type":"mcq","level":"NB","q":"Dấu nhắc của chế độ gõ lệnh trực tiếp trong Python gồm ba kí tự nào?","options":["A. Ba dấu lớn hơn","B. Ba dấu nhỏ hơn","C. Ba dấu thăng","D. Ba dấu đô-la"],"answer":"A","explain":"Ở chế độ gõ lệnh trực tiếp (interactive), Python hiện dấu nhắc gồm ba dấu lớn hơn viết liền nhau, chờ người dùng gõ lệnh.","points":0.25},{"type":"mcq","level":"VDC","q":"Kết quả của lệnh print(100 % 7 * 2) là gì?","options":["A. 4","B. 200","C. 14","D. 2"],"answer":"A","explain":"% và * cùng mức, tính từ trái sang: 100 % 7 = 2; 2 * 2 = 4.","points":0.25},{"type":"mcq","level":"NB","q":"Python được thực hiện bằng cách nào?","options":["A. Biên dịch toàn bộ rồi mới chạy","B. Thông dịch: dịch và thực hiện từng lệnh","C. Máy tính hiểu trực tiếp không cần dịch","D. Dịch bằng tay"],"answer":"B","explain":"Python là ngôn ngữ thông dịch: mỗi câu lệnh được dịch và thực hiện ngay, từng lệnh một.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về xâu kí tự.","statements":["\"a\" + \"b\" cho \"ab\" (nối xâu).","\"ab\" * 3 cho \"ababab\" (lặp xâu).","print(\"a\", \"b\") in ra a b.","\"5\" + \"6\" cho \"56\"."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng: + nối xâu, * lặp xâu, print nhiều giá trị cách nhau bởi dấu cách, \"5\",\"6\" là xâu nên nối thành \"56\".","points":1},{"type":"truefalse","level":"VDC","q":"Xét các phát biểu về tính tương thích của Python.","statements":["Cùng một chương trình Python có thể chạy trên nhiều hệ điều hành khác nhau.","Mã nguồn Python dễ đọc nên dễ bảo trì.","Python chỉ dùng để học, không dùng làm sản phẩm thật.","Nhiều công ty lớn dùng Python trong sản phẩm thực tế."],"answer":["T","T","F","T"],"explain":"a,b,d) Đúng. c) Sai: Python được dùng rộng rãi trong thực tế (web, AI, khoa học dữ liệu...).","points":1},{"type":"short","level":"VDC","q":"Kết quả của lệnh print(81 % 9 + 81 // 9) là bao nhiêu?","answer":"9","explain":"81 % 9 = 0; 81 // 9 = 9; 0 + 9 = 9.","points":0.5},{"type":"s hon chạy trực tiếp bằng trình thông dịch, không cần biên dịch ra .exe.","points":1},{"type":"short","level":"VDC","q":"Kết quả của lệnh print(7 + 12 // 5 * 2) là bao nhiêu?","answer":"11","explain":"12 // 5 = 2; 2 * 2 = 4; 7 + 4 = 11.","points":0.5},{"type":"short","level":"TH","q":"Kết quả của lệnh print(\"Tin\" + \"10\") là gì?","answer":"Tin10","explain":"Phép + nối hai xâu: \"Tin10\".","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"TH","q":"Câu lệnh print(1 + 2 * 3) cho kết quả nào?","options":["A. 7","B. 9","C. 6","D. 5"],"answer":"A","explain":"Python ưu tiên nhân trước cộng sau: 2 * 3 = 6, rồi 1 + 6 = 7.","points":0.25},{"type":"mcq","level":"VDC","q":"Kết quả của lệnh print(\"a\" + \"b\" * 2 + \"c\" * 3) là gì?","options":["A. abbccc","B. abcabc","C. aabbcc","D. abcc"],"answer":"A","explain":"* ưu tiên hơn +: \"b\" * 2 = \"bb\", \"c\" * 3 = \"ccc\", nối lại: \"a\" + \"bb\" + \"ccc\" = \"abbccc\".","points":0.25},{"type":"mcq","level":"TH","q":"Kết quả của lệnh print(\"Tin\" + \" học\") là gì?","options":["A. Tin học","B. Tin + học","C. Báo lỗi","D. Tin học "],"answer":"A","explain":"Phép + giữa hai xâu kí tự là phép nối xâu: \"Tin\" + \" học\" = \"Tin học\".","points":0.25},{"type":"mcq","level":"NB","q":"Câu lệnh nào in dòng chữ Xin chào ra màn hình trong Python?","options":["A. print(Xin chào)","B. print(\"Xin chào\")","C. in Xin chào","D. echo \"Xin chào\""],"answer":"B","explain":"Lệnh print() dùng để đưa dữ liệu ra màn hình. Xâu kí tự phải đặt trong cặp dấu nháy kép.","points":0.25},{"type":"mcq","level":"VD","q":"Muốn in ra màn hình dòng: Em học \"Python\" rất vui (giữ nguyên dấu nháy kép), câu lệnh đúng là?","options":["A. print('Em học \"Python\" rất vui')","B. print(Em học \"Python\" rất vui)","C. print(\"Em học \"Python\" rất vui\")","D. in Em học Python rất vui"],"answer":"A","explain":"Dùng nháy đơn bao ngoài để bên trong chứa được nháy kép: 'Em học \"Python\" rất vui'. Phương án C bị lỗi vì nháy kép đóng sớm.","points":0.25},{"type":"mcq","level":"NB","q":"Chương trình viết bằng ngôn ngữ lập trình bậc cao được gọi là gì?","options":["A. Chương trình nguồn","B. Chương trình đích","C. Hệ điều hành","D. Phần mềm diệt virus"],"answer":"A","explain":"Chương trình viết bằng ngôn ngữ bậc cao gọi là chương trình nguồn (source); sau khi dịch thành ngôn ngữ máy gọi là chương trình đích.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về chương trình dịch.","statements":["Chương trình dịch chuyển chương trình nguồn thành chương trình máy hiểu được.","Biên dịch là dịch toàn bộ chương trình trước rồi mới chạy.","Thông dịch là dịch từng lệnh và thực hiện ngay.","Python dùng cách biên dịch."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng theo định nghĩa. d) Sai: Python là ngôn ngữ thông dịch.","points":1},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về ứng dụng của hai chế độ làm việc.","statements":["Thử nhanh print(2**10) nên dùng chế độ gõ lệnh trực tiếp.","Viết chương trình dài nên dùng chế độ soạn thảo.","Chế độ trực tiếp không lưu được chương trình thành tệp.","Chế độ soạn thảo không thể chạy thử từng lệnh."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: vẫn có thể chạy cả tệp và xem kết quả từng phần bằng cách thêm lệnh in trung gian.","points":1},{"type":"short","level":"VD","q":"Kết quả của lệnh print(20 - 6 // 4 * 2) là bao nhiêu?","answer":"18","explain":"6 // 4 = 1; 1 * 2 = 2; 20 - 2 = 18.","points":0.5},{"type":"short","level":"NB","q":"Chương trình viết bằng ngôn ngữ lập trình bậc cao được gọi là chương trình gì?","answer":"chương trình nguồn","explain":"Chương trình do lập trình viên viết bằng ngôn ngữ bậc cao gọi là chương trình nguồn.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Ở chế độ gõ lệnh trực tiếp, sau khi gõ xong một lệnh và nhấn Enter thì điều gì xảy ra?","options":["A. Lệnh được thực hiện ngay","B. Máy tính tắt nguồn","C. Lệnh được lưu vào tệp","D. Không có gì xảy ra"],"answer":"A","explain":"Chế độ gõ lệnh trực tiếp thực hiện ngay từng lệnh sau khi nhấn Enter, rất tiện để thử nghiệm.","points":0.25},{"type":"mcq","level":"VDC","q":"Kết quả của lệnh print(2 ** 3 ** 2) là gì?","options":["A. 512","B. 64","C. 36","D. 12"],"answer":"A","explain":"Lũy thừa trong Python kết hợp từ phải sang trái: 3 ** 2 = 9, rồi 2 ** 9 = 512.","points":0.25},{"type":"mcq","level":"NB","q":"Biên dịch (compile) là cách dịch như thế nào?","options":["A. Dịch toàn bộ chương trình nguồn thành chương trình đích trước, rồi mới thực hiện","B. Dịch từng lệnh rồi thực hiện ngay","C. Dịch bằng từ điển","D. Không cần dịch"],"answer":"A","explain":"Biên dịch dịch hết toàn bộ chương trình nguồn thành chương trình đích một lần, sau đó mới chạy chương trình đích.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào sau đây đúng về chương trình nguồn và chương trình đích?","options":["A. Chương trình nguồn do lập trình viên viết, chương trình đích do chương trình dịch tạo ra","B. Hai khái niệm này giống nhau","C. Chương trình đích viết bằng ngôn ngữ bậc cao","D. Chương trình nguồn máy tính thực hiện trực tiếp"],"answer":"A","explain":"Lập trình viên viết chương trình nguồn bằng ngôn ngữ bậc cao; chương trình dịch chuyển nó thành chương trình đích (mã máy) để máy thực hiện.","points":0.25},{"type":"mcq","level":"VD","q":"Lệnh nào sau đây in ra đúng xâu: C:\\nam?","options":["A. print(\"C:\\\\nam\")","B. print(\"C:\\nam\")","C. print(C:\\nam)","D. print('C:\\nam')"],"answer":"A","explain":"Trong xâu Python, muốn hiện một dấu \\ phải viết \\\\ (escape). Phương án B sẽ hiểu \\n là kí tự xuống dòng.","points":0.25},{"type":"mcq","level":"TH","q":"Kết quả của lệnh print(20 / 4) trong Python là gì?","options":["A. 5.0","B. 5","C. 4","D. Báo lỗi"],"answer":"A","explain":"Phép / trong Python luôn cho kết quả số thực: 20 / 4 = 5.0.","points":0.25},{"type":"truefalse","level":"VDC","q":"Xét các phát biểu về bản chất dịch chương trình.","statements":["Mục đích cuối cùng của dịch là tạo mã máy cho CPU.","Biên dịch phát hiện lỗi cú pháp trước khi chạy.","Thông dịch phát hiện lỗi khi đang chạy tới lệnh đó.","Ngôn ngữ thông dịch không bao giờ báo lỗi cú pháp."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: thông dịch vẫn kiểm tra cú pháp từng lệnh và báo lỗi.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu so sánh biên dịch và thông dịch.","statements":["Cả hai đều cần chương trình dịch.","Biên dịch tạo ra chương trình đích trước khi chạy.","Thông dịch vừa dịch vừa chạy từng lệnh.","Chương trình thông dịch chạy nhanh hơn chương trình đã biên dịch."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: thông dịch thường chậm hơn vì tốn thời gian dịch trong lúc chạy.","points":1},{"type":"short","level":"VDC","q":"Kết quả của lệnh print(\"py\" + \"thon\" * 2) là gì?","answer":"pythonthon","explain":"\"thon\" * 2 = \"thonthon\", nối \"py\" được \"pythonthon\".","points":0.5},{"type":"short","level":"TH","q":"Kết quả của lệnh print(2 ** 4) là bao nhiêu?","answer":"16","explain":"2 ** 4 = 16.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"VDC","q":"Kết quả của lệnh print(10 + 5 // 2 * 3) là gì?","options":["A. 16","B. 22","C. 37","D. 15"],"answer":"A","explain":"// và * cùng mức ưu tiên, tính từ trái sang: 5 // 2 = 2; 2 * 3 = 6; 10 + 6 = 16.","points":0.25},{"type":"mcq","level":"NB","q":"Python là ngôn ngữ lập trình thuộc loại nào?","options":["A. Ngôn ngữ máy","B. Ngôn ngữ lập trình bậc cao","C. Hợp ngữ","D. Ngôn ngữ tự nhiên"],"answer":"B","explain":"Python là ngôn ngữ lập trình bậc cao, có cú pháp đơn giản, gần với ngôn ngữ tự nhiên.","points":0.25},{"type":"mcq","level":"TH","q":"Điều gì xảy ra khi gõ lệnh print \"Xin chào\" (thiếu cặp ngoặc đơn)?","options":["A. Báo lỗi cú pháp","B. In ra Xin chào","C. Không có gì xảy ra","D. Máy tính tắt"],"answer":"A","explain":"Trong Python, print là hàm nên bắt buộc có cặp ngoặc đơn; thiếu ngoặc sẽ báo lỗi cú pháp (SyntaxError).","points":0.25},{"type":"mcq","level":"TH","q":"Kết quả của lệnh print(10 - 4) là gì?","options":["A. 6","B. 10 - 4","C. 104","D. 14"],"answer":"A","explain":"print(10 - 4) tính 10 - 4 = 6 rồi in ra: 6.","points":0.25},{"type":"mcq","level":"NB","q":"Kết quả của lệnh print(2 + 3) là gì?","options":["A. 5","B. 2 + 3","C. 23","D. Báo lỗi"],"answer":"A","explain":"print(2 + 3) tính giá trị biểu thức 2 + 3 = 5 rồi in ra màn hình: 5.","points":0.25},{"type":"mcq","level":"VD","q":"Kết quả của lệnh print(2 + 3 * 4 ** 2) là gì?","options":["A. 50","B. 32","C. 400","D. 20"],"answer":"A","explain":"Thứ tự ưu tiên: lũy thừa trước (4 ** 2 = 16), rồi nhân (3 * 16 = 48), rồi cộng (2 + 48 = 50).","points":0.25},{"type":"truefalse","level":"VD","q":"Xét lệnh print(-3 ** 2). Các phát biểu sau đúng hay sai?","statements":["Lũy thừa ưu tiên hơn dấu trừ.","Biểu thức được hiểu là -(3 ** 2).","Kết quả in ra là -9.","Kết quả in ra là 9."],"answer":["T","T","T","F"],"explain":"Dấu ** ưu tiên hơn dấu trừ một ngôi nên -3**2 = -(9) = -9.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về ngôn ngữ lập trình.","statements":["Python là ngôn ngữ lập trình bậc cao.","Ngôn ngữ máy chỉ gồm hai kí hiệu 0 và 1.","Hợp ngữ dễ đọc hơn ngôn ngữ máy.","Mọi chương trình Python đều phải biên dịch trước khi chạy."],"answer":["T","T","T","F"],"explain":"a) Đúng: Python là ngôn ngữ bậc cao. b) Đúng: ngôn ngữ máy là dãy bit 0/1. c) Đúng: hợp ngữ dùng từ gợi nhớ nên dễ đọc hơn mã máy. d) Sai: Python được thông dịch, không cần biên dịch trước.","points":1},{"type":"short","level":"NB","q":"Python được thực hiện bằng cách biên dịch hay thông dịch?","answer":"thông dịch","explain":"Python là ngôn ngữ thông dịch: dịch và thực hiện từng câu lệnh.","points":0.5},{"type":"short","level":"VD","q":"Kết quả của lệnh print(2 * (3 + 4) - 5) là bao nhiêu?","answer":"9","explain":"(3 + 4) = 7; 2 * 7 = 14; 14 - 5 = 9.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"VD","q":"Kết quả của lệnh print(100 - 4 * 5 ** 2) là gì?","options":["A. 0","B. 2400","C. 96","D. -1900"],"answer":"A","explain":"5 ** 2 = 25; 4 * 25 = 100; 100 - 100 = 0.","points":0.25},{"type":"mcq","level":"TH","q":"Lệnh print(\"a\", \"b\", \"c\") in ra kết quả nào?","options":["A. a b c","B. abc","C. a,b,c","D. \"a\" \"b\" \"c\""],"answer":"A","explain":"print với nhiều giá trị cách nhau bởi dấu phẩy sẽ in các giá trị cách nhau một dấu cách: a b c.","points":0.25},{"type":"mcq","level":"NB","q":"Ngôn ngữ lập trình bậc cao có đặc điểm nào sau đây?","options":["A. Gần với ngôn ngữ tự nhiên của con người, dễ đọc dễ hiểu","B. Chỉ gồm các số 0 và 1","C. Máy tính thực hiện trực tiếp không cần dịch","D. Khó học hơn hợp ngữ"],"answer":"A","explain":"Ngôn ngữ lập trình bậc cao gần với ngôn ngữ tự nhiên, có các từ khóa gợi nhớ nên con người dễ đọc, dễ hiểu, dễ lập trình.","points":0.25},{"type":"mcq","level":"TH","q":"Khi gặp lỗi cú pháp ở chế độ gõ lệnh trực tiếp, Python sẽ làm gì?","options":["A. Báo lỗi ngay tại lệnh đó","B. Tự động sửa lỗi","C. Bỏ qua và chạy tiếp","D. Tắt chương trình"],"answer":"A","explain":"Chế độ thông dịch kiểm tra từng lệnh nên phát hiện và báo lỗi ngay khi gặp lệnh sai cú pháp.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao nói Python thích hợp cho người mới học lập trình?","options":["A. Cú pháp đơn giản, gần ngôn ngữ tự nhiên; chế độ trực tiếp giúp thử lệnh nhanh; có sẵn nhiều thư viện","B. Vì Python chạy nhanh nhất","C. Vì Python không bao giờ báo lỗi","D. Vì Python không cần máy tính"],"answer":"A","explain":"Python có cú pháp gọn, dễ đọc; chế độ gõ lệnh trực tiếp cho phản hồi ngay; cộng đồng và thư viện phong phú nên rất hợp cho người mới học.","points":0.25},{"type":"mcq","level":"NB","q":"Thông dịch (interpret) là cách dịch như thế nào?","options":["A. Dịch từng câu lệnh và thực hiện ngay câu lệnh đó","B. Dịch cả chương trình rồi mới chạy","C. Dịch ngược từ máy sang người","D. Không dịch gì cả"],"answer":"A","explain":"Thông dịch: đọc từng câu lệnh, dịch sang ngôn ngữ máy và thực hiện ngay rồi mới sang lệnh tiếp theo.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về lỗi chương trình.","statements":["Thiếu ngoặc đơn trong print gây lỗi cú pháp.","Chế độ trực tiếp báo lỗi ngay tại lệnh sai.","Mọi lỗi đều do máy tính gây ra.","Lỗi cú pháp được phát hiện khi dịch chương trình."],"answer":["T","T","F","T"],"explain":"a,b,d) Đúng. c) Sai: lỗi thường do lập trình viên viết sai.","points":1},{"type":"truefalse","level":"VDC","q":"Xét các phát biểu nâng cao.","statements":["print(10 + 5 // 2 * 3) cho 16.","// và * cùng mức ưu tiên, tính từ trái sang.","print(100 % 7 * 2) cho 4.","Thứ tự ưu tiên không ảnh hưởng kết quả."],"answer":["T","T","T","F"],"explain":"a) 5//2=2, 2*3=6, 10+6=16 đúng. c) 100%7=2, 2*2=4 đúng. d) Sai: thứ tự ưu tiên quyết định kết quả.","points":1},{"type":"short","level":"VDC","q":"Kết quả của lệnh print(50 - 4 * 3 ** 2) là bao nhiêu?","answer":"14","explain":"3 ** 2 = 9; 4 * 9 = 36; 50 - 36 = 14.","points":0.5},{"type":"short","level":"TH","q":"Kết quả của lệnh print(9 % 2) là bao nhiêu?","answer":"1","explain":"Phép % chia lấy phần dư: 9 chia 2 dư 1.","points":0.5}]}]}</script>
