ú thích chỗ khó.","Không cần kiểm thử."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Bài toán nhập đến khi gặp 0. Xét các phát biểu.","statements":["Nên dùng while.","Chưa biết trước số lần nhập.","Dùng for với số lần cố định cũng đúng.","Điều kiện dừng là nhập 0."],"answer":["T","T","F","T"],"explain":"a,b,d) Đúng. c) Sai: for cố định không hợp.","points":1},{"type":"short","level":"TH","q":"Đảo ngược xâu \"abc\" được gì?","answer":"cba","explain":"\"cba\".","points":0.5},{"type":"short","level":"VDC","q":"Nguyên tắc quan trọng nhất khi thực hành là gì? (3 từ)","answer":"hiểu thiết kế kiểm thử","explain":"Hiểu bài toán, thiết kế thuật toán, kiểm thử chương trình.","points":0.5}]}]}</script>
