trị nào sau đây được coi là False khi làm điều kiện trong Python?","options":["A. 0","B. 1","C. \"a\"","D. 5"],"answer":"A","explain":"Số 0 (và xâu rỗng, danh sách rỗng...) được coi là False; các giá trị còn lại là True.","points":0.25},{"type":"mcq","level":"NB","q":"Cho x = 3. Đoạn lệnh: nếu x == 10 thì in \"đúng rồi\", ngược lại in \"sai rồi\". In ra gì?","options":["A. sai rồi","B. đúng rồi","C. Không in gì","D. 3"],"answer":"A","explain":"x == 10 sai nên chạy nhánh else: in \"sai rồi\".","points":0.25},{"type":"mcq","level":"TH","q":"Cho x = -5. Đoạn lệnh: nếu x != 0 thì in \"âm hoặc dương\", ngược lại in \"bằng 0\". In ra gì?","options":["A. âm hoặc dương","B. bằng 0","C. Không in gì","D. -5"],"answer":"A","explain":"-5 != 0 đúng nên in \"âm hoặc dương\".","points":0.25},{"type":"truefalse","level":"TH","q":"Cho x = 4, y = 4. Đoạn lệnh: nếu x != y in \"khác\", ngược lại in \"bằng\". Xét các phát biểu.","statements":["Điều kiện x != y là False.","Nhánh else được thực hiện.","Chương trình in \"bằng\".","Chương trình không in gì."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: nhánh else in \"bằng\".","points":1},{"type":"truefalse","level":"VDC","q":"Một chương trình xếp loại học lực. Xét các phát biểu.","statements":["Nên dùng chuỗi if/elif/else vì các mức loại trừ nhau.","Thứ tự xét từ mức cao xuống thấp là hợp lí.","Dùng nhiều if độc lập vẫn đúng nếu điều kiện loại trừ nhau.","Không cần nhánh else khi đã liệt kê đủ mọi trường hợp."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"short","level":"TH","q":"Cho a = 0. Đoạn lệnh: nếu a != 0 thì in \"có\", ngược lại in \"không\". In ra gì?","answer":"không","explain":"0 != 0 sai nên chạy nhánh else: in \"không\".","points":0.5},{"type":"short","level":"VDC","q":"Cho a = 4, b = 9. Đoạn lệnh: nếu a != b thì nếu a + b == 13 thì in \"đúng\", ngược lại in \"sai\"; ngược lại in \"bằng\". In ra gì?","answer":"đúng","explain":"a != b đúng; a + b = 13 đúng nên in \"đúng\".","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"VD","q":"Cho n = 20. Đoạn lệnh: nếu n % 2 == 0 thì in \"chẵn\", ngược lại in \"lẻ\"; sau đó in \"xong\". In ra gì?","options":["A. chẵn rồi xong (hai dòng)","B. Chỉ chẵn","C. lẻ rồi xong","D. Chỉ xong"],"answer":"A","explain":"20 % 2 == 0 đúng nên in \"chẵn\"; lệnh in \"xong\" ngoài khối nên luôn chạy.","points":0.25},{"type":"mcq","level":"TH","q":"Cho y = 2. Biểu thức (y == 5) or (y == 2) làm điều kiện if thì khối if có chạy không?","options":["A. Có","B. Không","C. Báo lỗi","D. Tùy máy"],"answer":"A","explain":"Vế sau True nên or cho True, khối if chạy.","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = 6, b = 6. Đoạn lệnh: nếu a != b thì in \"khác\", ngược lại in \"bằng\". In ra gì?","options":["A. bằng","B. khác","C. Không in gì","D. Báo lỗi"],"answer":"A","explain":"a != b sai nên chạy nhánh else: in \"bằng\".","points":0.25},{"type":"mcq","level":"NB","q":"Cho a = 0. Đoạn lệnh: nếu a khác 0 thì in \"khác 0\". Chương trình in ra gì?","options":["A. Không in gì","B. khác 0","C. 0","D. Báo lỗi"],"answer":"A","explain":"0 != 0 sai nên khối if bị bỏ qua, không in gì.","points":0.25},{"type":"mcq","level":"NB","q":"Cấu trúc if...else hoạt động thế nào?","options":["A. Điều kiện đúng thì chạy khối if, sai thì chạy khối else","B. Chạy cả hai khối","C. Không chạy khối nào","D. Chỉ chạy khối else"],"answer":"A","explain":"if...else rẽ hai nhánh: đúng đi nhánh if, sai đi nhánh else.","points":0.25},{"type":"mcq","level":"VDC","q":"Phát biểu nào SAI?","options":["A. else có thể đứng một mình không cần if","B. elif phải đứng sau if","C. Một if có thể có nhiều elif","D. else là nhánh cuối cùng, không có điều kiện"],"answer":"A","explain":"else/elif không bao giờ đứng một mình, chúng luôn phải đi kèm với if phía trước.","points":0.25},{"type":"truefalse","level":"NB","q":"Cho a = 5. Đoạn lệnh: nếu a == 5 thì in \"năm\". Xét các phát biểu.","statements":["Điều kiện a == 5 có giá trị True.","Khối if được thực hiện.","Chương trình in ra \"năm\".","Nếu a = 6 thì vẫn in \"năm\"."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: a = 6 thì điều kiện sai, không in.","points":1},{"type":"truefalse","level":"VD","q":"Cho năm = 2024. Đoạn lệnh: nếu năm % 4 == 0 in \"nhuận\", ngược lại in \"thường\". Xét các phát biểu.","statements":["2024 % 4 == 0 là True.","Chương trình in \"nhuận\".","Với năm = 2025 sẽ in \"thường\".","Mọi năm chia hết cho 4 đều nhuận trong thực tế."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: năm tròn thế kỉ phải chia hết cho 400 mới nhuận (quy tắc đầy đủ).","points":1},{"type":"short","level":"NB","q":"Từ khóa bắt đầu câu lệnh điều kiện trong Python là gì?","answer":"if","explain":"Câu lệnh điều kiện bắt đầu bằng từ khóa if.","points":0.5},{"type":"short","level":"VD","q":"Cho a = 14. Đoạn lệnh: nếu a % 2 == 0 thì in a // 2, ngược lại in a * 2. In ra bao nhiêu?","answer":"7","explain":"14 chẵn; in 14 // 2 = 7.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Cho a = 4, b = 4. Đoạn lệnh: nếu a == b thì in \"bằng nhau\". In ra gì?","options":["A. bằng nhau","B. Không in gì","C. 4","D. Báo lỗi"],"answer":"A","explain":"4 == 4 đúng nên in \"bằng nhau\".","points":0.25},{"type":"mcq","level":"NB","q":"Từ khóa nào dùng cho nhánh ngược lại của if?","options":["A. else","B. otherwise","C. endif","D. then"],"answer":"A","explain":"else đánh dấu khối lệnh thực hiện khi điều kiện của if sai.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào đúng về elif?","options":["A. elif chỉ được xét khi các điều kiện if/elif phía trước đều sai","B. elif luôn được xét bất kể phía trước","C. elif thay thế hoàn toàn else","D. Một lệnh if chỉ có đúng một elif"],"answer":"A","explain":"Các nhánh if/elif/else được xét lần lượt từ trên xuống; gặp nhánh đúng đầu tiên thì chạy và bỏ qua các nhánh còn lại.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu thức điều kiện nào sau đây có giá trị False?","options":["A. 3 != 3","B. 3 == 3","C. \"x\" == \"x\"","D. 5 != 2"],"answer":"A","explain":"3 != 3 sai vì hai vế bằng nhau.","points":0.25},{"type":"mcq","level":"VDC","q":"Với a = 3, b = 3, đoạn lệnh trên in ra gì?","options":["A. C","B. A","C. B","D. Không in gì"],"answer":"A","explain":"a != b sai nên chạy nhánh else ngoài cùng: in \"C\".","points":0.25},{"type":"mcq","level":"VD","q":"Với nam = 2023, đoạn lệnh trên in ra gì?","options":["A. không nhuận","B. nhuận","C. 2023","D. Báo lỗi"],"answer":"A","explain":"2023 % 4 = 3 khác 0 nên chạy nhánh else.","points":0.25},{"type":"truefalse","level":"VDC","q":"Cho a = 3, b = 7. Đoạn lệnh: nếu a != b thì nếu a == 3 in \"A\" ngược lại in \"B\"; ngược lại in \"C\". Xét các phát biểu.","statements":["Điều kiện ngoài a != b là True.","Điều kiện trong a == 3 là True.","Chương trình in \"A\".","Nếu b = 3 thì chương trình in \"C\"."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Cho d = 9. Đoạn lệnh: nếu d == 10 in \"A\", nếu không nếu d == 9 in \"B\", ngược lại in \"C\". Xét các phát biểu.","statements":["Nhánh if đầu bị bỏ qua.","Nhánh elif được thực hiện.","Chương trình in \"B\".","Nhánh else cũng được thực hiện."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: đã vào nhánh elif thì bỏ qua else.","points":1},{"type":"short","level":"VDC","q":"Cho x = 0. Đoạn lệnh: nếu x thì in \"T\", ngược lại in \"F\". In ra gì?","answer":"F","explain":"x = 0 là False nên chạy nhánh else: in \"F\".","points":0.5},{"type":"short","level":"TH","q":"Cho x = 9. Đoạn lệnh: nếu x == 9 thì in \"chín\". Có in ra gì không?","answer":"chín","explain":"Điều kiện đúng nên in \"chín\".","points":0.5}]}]}</script>
