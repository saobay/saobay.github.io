?","options":["A. 3","B. 9","C. 10","D. 1"],"answer":"A","explain":"i = 1, 2 thỏa; i = 3 thì i % 3 == 0 nên break: in 3.","points":0.25},{"type":"mcq","level":"NB","q":"Lệnh break trong vòng lặp có tác dụng gì?","options":["A. Thoát khỏi vòng lặp ngay lập tức","B. Bỏ qua lần lặp hiện tại","C. Dừng chương trình","D. Không có tác dụng"],"answer":"A","explain":"break thoát hẳn khỏi vòng lặp gần nhất, bỏ qua các lần lặp còn lại.","points":0.25},{"type":"mcq","level":"NB","q":"Cú pháp câu lệnh while trong Python là gì?","options":["A. while điều_kiện: rồi khối lệnh thụt vào","B. while (điều_kiện) { }","C. lặp while điều_kiện","D. while điều_kiện then"],"answer":"A","explain":"Cú pháp: while điều_kiện: rồi các lệnh lặp viết thụt vào trong.","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: i = 0; while i != 5: i = i + 1; nếu i % 2 == 0 thì continue; nếu i == 5 thì break; in i. In ra gì?","options":["A. 1, 3 (mỗi số một dòng)","B. 1, 3, 5","C. 2, 4","D. Không in gì"],"answer":"A","explain":"i=1 in; i=2 bỏ qua; i=3 in; i=4 bỏ qua; i=5 break trước khi in: in 1, 3.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về nguy cơ lặp vô hạn.","statements":["i = 2; while i != 7: i = i + 2 gây lặp vô hạn.","n = 10; while n != 0: n = n - 3 gây lặp vô hạn.","Mọi vòng while đều có nguy cơ lặp vô hạn.","Kiểm tra logic điều kiện giúp tránh lặp vô hạn."],"answer":["T","T","F","T"],"explain":"a) i chẵn mãi không bằng 7. b) n nhảy qua 0. c) Sai: while viết đúng thì dừng bình thường. d) Đúng.","points":1},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh đảo số: n = 123; s = 0; while n != 0: s = s * 10 + n % 10; n = n // 10. Các phát biểu sau đúng hay sai?","statements":["Mỗi lần lặp lấy chữ số cuối của n đưa lên đầu s.","Sau 3 lần lặp n = 0.","s cuối cùng bằng 321.","Thuật toán này đúng với mọi số nguyên dương."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"short","level":"VDC","q":"Bắt đầu từ n = 6, dãy Collatz (chẵn chia 2, o giờ dừng vì điều kiện luôn đúng","B. Vòng lặp chạy rất nhanh","C. Vòng lặp không có thân","D. Vòng lặp chỉ chạy một lần"],"answer":"A","explain":"Nếu điều kiện while luôn đúng (và không có lệnh thoát), vòng lặp chạy mãi không dừng.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về while...else.","statements":["Python cho phép while đi kèm else.","Khối else chạy khi vòng lặp kết thúc tự nhiên.","Nếu bị break thì khối else bị bỏ qua.","Khối else của while luôn chạy."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: bị break thì else không chạy.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về vòng lặp vô hạn.","statements":["Vòng lặp vô hạn là vòng lặp không bao giờ dừng.","Quên cập nhật điều kiện có thể gây lặp vô hạn.","while True: là vòng lặp vô hạn nếu không có break.","Vòng lặp vô hạn là mong muốn trong mọi chương trình."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: lặp vô hạn thường là lỗi, trừ chương trình phục vụ liên tục có cơ chế thoát.","points":1},{"type":"short","level":"VD","q":"Đảo ngược số 456 được số nào?","answer":"654","explain":"Thuật toán đảo số cho 654.","points":0.5},{"type":"short","level":"NB","q":"Từ khóa của câu lệnh lặp không xác định số lần trong Python là gì?","answer":"while","explain":"Vòng lặp while lặp chừng nào điều kiện còn đúng.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"TH","q":"Đoạn lệnh: n = 1; while n != 10: n = n * 2 lặp bao nhiêu lần?","options":["A. Lặp vô hạn","B. 4 lần","C. 3 lần","D. 10 lần"],"answer":"A","explain":"n = 1, 2, 4, 8, 16, ... không bao giờ bằng 10: lặp vô hạn.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh tính tổng chữ số trên với n = 472 cho s bằng bao nhiêu?","options":["A. 13","B. 11","C. 472","D. 4"],"answer":"A","explain":"4 + 7 + 2 = 13.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: n = 10; while n != 0: n = n - 3 lặp bao nhiêu lần?","options":["A. Lặp vô hạn","B. 4 lần","C. 3 lần","D. 10 lần"],"answer":"A","explain":"n = 10, 7, 4, 1, -2, ... nhảy qua 0 nên không bao giờ bằng 0: lặp vô hạn! Nên chọn điều kiện an toàn hơn, ví dụ kiểm tra n còn là số dương.","points":0.25},{"type":"mcq","level":"NB","q":"Lệnh continue trong vòng lặp có tác dụng gì?","options":["A. Bỏ qua phần còn lại của lần lặp hiện tại, sang lần lặp tiếp theo","B. Thoát khỏi vòng lặp","C. Dừng chương trình","D. Lặp lại từ đầu chương trình"],"answer":"A","explain":"continue bỏ qua các lệnh còn lại trong thân vòng của lần lặp hiện tại và sang lần lặp kế tiếp.","points":0.25},{"type":"mcq","level":"NB","q":"Khi nào vòng lặp while dừng lại?","options":["A. Khi điều kiện trở thành False","B. Khi điều kiện đúng","C. Sau đúng 10 lần","D. Không bao giờ dừng"],"answer":"A","explain":"while kiểm tra điều kiện trước mỗi lần lặp; điều kiện sai thì dừng.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao vòng for ít gây lặp vô hạn hơn while?","options":["A. Vì for duyệt dãy hữu hạn có sẵn (range), hết dãy tự dừng","B. Vì for chạy nhanh hơn","C. Vì for không có điều kiện","D. Vì while bị cấm"],"answer":"A","explain":"for gắn với dãy hữu hạn nên chắc chắn kết thúc; while phụ thuộc điều kiện do người viết kiểm soát.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu so sánh for và while.","statements":["for biết trước số lần lặp qua range.","while lặp theo điều kiện, chưa biết trước số lần.","Mọi vòng for đều viết lại được bằng while.","while luôn thay thế được for một cách gọn hơn."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: với số lần xác định, for gọn và an toàn hơn.","points":1},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh: s = 0; i = 1; while i != 50: s = s + i; i = i + 1; nếu s lớn hơn 100 thì break. Các phát biểu sau đúng hay sai?","statements":["break dừng vòng lặp khi s vượt 100.","Khi break thì i = 14, s = 105.","Nếu không có break, vòng lặp chạy 49 lần.","break giúp tiết kiệm số lần lặp."],"answer":["T","T","T","T"],"explain":" 3 thì continue; in i. Các phát biểu sau đúng hay sai?","statements":["Khi i = 3 thì bỏ qua lệnh in.","In ra 1, 2, 4, 5.","continue sang lần lặp tiếp theo.","Vòng lặp chạy 5 lần."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"short","level":"TH","q":"Đoạn lệnh: i = 2; while i != 7: i = i + 2 có dừng không? (trả lời: có/không)","answer":"không","explain":"i chẵn mãi không bằng 7: lặp vô hạn.","points":0.5},{"type":"short","level":"VDC","q":"Đoạn lệnh: n = 5; gt = 1; i = 1; while i != n + 1: gt = gt * i; i = i + 1; sau vòng lặp in gt. In ra bao nhiêu?","answer":"120","explain":"5! = 120.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"VDC","q":"Đoạn lệnh tìm ước chung lớn nhất: a = 48; b = 18; while b != 0: a, b = b, a % b; sau vòng lặp in a. In ra bao nhiêu?","options":["A. 6","B. 18","C. 12","D. 48"],"answer":"A","explain":"Thuật toán Euclid: (48,18)→(18,12)→(12,6)→(6,0): a = 6.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: i = 1; while i != 4: nếu i % 2 == 1 thì in i; i = i + 1. In ra gì?","options":["A. 1, 3 (mỗi số một dòng)","B. 1, 2, 3","C. 2, 4","D. 1, 3, 5"],"answer":"A","explain":"i = 1, 2, 3; chỉ in các số lẻ: 1, 3.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào đúng khi so sánh for và while?","options":["A. for cho lặp xác định số lần; while cho lặp không xác định","B. for và while hoàn toàn giống nhau","C. while luôn tốt hơn for","D. for không có điều kiện"],"answer":"A","explain":"Điểm khác cốt lõi: for biết trước số lần (qua range), while lặp theo điều kiện.","points":0.25},{"type":"mcq","level":"NB","q":"Điều gì xảy ra nếu điều kiện của while sai ngay từ đầu?","options":["A. Thân vòng lặp không chạy lần nào","B. Thân vòng lặp chạy một lần","C. Báo lỗi","D. Lặp vô hạn"],"answer":"A","explain":"while kiểm tra điều kiện trước nên nếu sai ngay từ đầu thì không lặp lần nào.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: i = 5; while i != 0: print(i); i = i - 1; print(\"hết\") in ra gì?","options":["A. 5, 4, 3, 2, 1 rồi \"hết\"","B. 5, 4, 3, 2, 1, 0 rồi \"hết\"","C. Chỉ in \"hết\"","D. Lặp vô hạn"],"answer":"A","explain":"Đếm ngược từ 5 về 1; khi i = 0 dừng; print(\"hết\") ngoài vòng lặp chạy sau.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các tình huống sau, tình huống nào NÊN dùng while thay vì for?","options":["A. Nhập điểm cho đến khi điểm hợp lệ (chưa biết nhập mấy lần)","B. In bảng cửu chương 2","C. Tính tổng 1 đến 100","D. In 10 dấu *"],"answer":"A","explain":"Không biết trước số lần nhập nên dùng while; các trường hợp còn lại biết trước số lần nên dùng for.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét đoạn lệnh: i = 5; while i != 0: print(i); i = i - 1; print(\"hết\"). Các phát biểu sau đúng hay sai?","statements":["In ra 5, 4, 3, 2, 1 mỗi số một dòng.","Lệnh in \"hết\" nằm ngoài vòng lặp.","Tổng cộng in 6 dòng.","Khi i = 0 thì dừng lặp."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"truefalse","level":"NB","q":"Xét đoạn lệnh: i = 1; while i != 4: print(i); i = i + 1. Các phát biểu sau đúng hay sai?","statements":["Vòng lặp chạy 3 lần.","In ra 1, 2, 3 mỗi số một dòng.","Khi i = 4 thì dừng.","Nếu bỏ i = i + 1 sẽ lặp vô hạn."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"short","level":"VD","q":"Tổng các chữ số của 538 bằng bao nhiêu?","answer":"16","explain":"5 + 3 + 8 = 16.","points":0.5},{"type":"short","level":"NB","q":"Vòng lặp while dừng khi điều kiện có giá trị gì?","answer":"False","explain":"Điều kiện False thì while dừng.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"TH","q":"Sửa đoạn lệnh trên thế nào để lặp đúng 3 lần rồi dừng?","options":["A. while i != 8:","B. while i != 6:","C. Bỏ i = i + 2","D. while True:"],"answer":"A","explain":"i = 2, 4, 6 thỏa i != 8; khi i = 8 thì dừng: lặp đúng 3 lần.","points":0.25},{"type":"mcq","level":"NB","q":"while True: tạo ra vòng lặp như thế nào?","options":["A. Vòng lặp vô hạn (phải có break mới thoát được)","B. Vòng lặp không chạy","C. Vòng lặp chạy một lần","D. Báo lỗi"],"answer":"A","explain":"Điều kiện True luôn đúng nên lặp vô hạn; thường kết hợp với break để thoát khi gặp điều kiện nào đó.","points":0.25},{"type":"mcq","level":"NB","q":"Đoạn lệnh trên lặp bao nhiêu lần?","options":["A. 3 lần","B. 4 lần","C. 1 lần","D. Vô hạn"],"answer":"A","explain":"i nhận 1, 2, 3: lặp 3 lần.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: n = 100; dem = 0; while n != 0: n = n // 10; dem = dem + 1; sau vòng lặp in dem. In ra bao nhiêu?","options":["A. 3","B. 2","C. 4","D. 100"],"answer":"A","explain":"100 → 10 → 1 → 0: lặp 3 lần, dem = 3 (100 có 3 chữ số).","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: s = 0; i = 1; while i != 50: s = s + i; i = i + 1; nếu s lớn hơn 100 thì break; sau vòng lặp in i, s. In ra gì?","options":["A. 14 và 105","B. 13 và 91","C. 14 và 91","D. 15 và 120"],"answer":"A","explain":"s cộng dồn 1+2+...; khi i=14 thì s=105 lớn hơn 100 nên break: in 14 và 105.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn nhập số n cho đến khi n khác 0, đoạn lệnh đúng là?","options":["A. n = 0; while n == 0: n = int(input(\"Nhập n khác 0: \"))","B. n = int(input()); while n != 0: n = int(input())","C. while n != 0: n = 1","D. for i in range(3): n = int(input())"],"answer":"A","explain":"Khởi tạo n = 0 để vào vòng lặp; lặp chừng nào n còn bằng 0.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét đoạn lệnh đếm chữ số: n = 2026; dem = 0; while n != 0: n = n // 10; dem = dem + 1. Các phát biểu sau đúng hay sai?","statements":["Mỗi lần lặp bỏ một chữ số của n.","Vòng lặp chạy 4 lần.","dem = 4 sau vòng lặp.","Ý tưởng này không áp dụng được cho n = 0."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng (n = 0 thì vòng lặp không chạy, dem = 0 là sai nên cần xử lí riêng).","points":1},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh: i = 1; while i != 100: i = i * 2 + 1. Các phát biểu sau đúng hay sai?","statements":["i luôn là số lẻ.","i không bao giờ bằng 100.","Vòng lặp này lặp vô hạn.","Mọi vòng while đều có thể sửa để dừng được."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng: i lẻ mãi nên không chạm 100.","points":1},{"type":"short","level":"TH","q":"Đoạn lệnh: i = 0; while i != 4: i = i + 1; nếu i == 2 thì break; sau vòng lặp in i. In ra bao nhiêu?","answer":"2","explain":"break khi i = 2: in 2.","points":0.5},{"type":"short","level":"VDC","q":"Đoạn lệnh: a = 48; b = 18; while b != 0: a, b = b, a % b; sau vòng lặp in a. In ra bao nhiêu?","answer":"6","explain":"ƯCLN(48, 18) = 6.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"TH","q":"Đoạn lệnh: tong = 0; i = 1; while i != 11: tong = tong + i; i = i + 1; sau vòng lặp in tong. In ra bao nhiêu?","options":["A. 55","B. 45","C. 66","D. 10"],"answer":"A","explain":"Tổng 1 đến 10 = 55.","points":0.25},{"type":"mcq","level":"NB","q":"Đoạn lệnh: i = 1; while i != 4: print(i); i = i + 1 in ra gì?","options":["A. 1, 2, 3 (mỗi số một dòng)","B. 1, 2, 3, 4","C. 4, 3, 2, 1","D. Lặp vô hạn"],"answer":"A","explain":"i = 1, 2, 3 thỏa i != 4; khi i = 4 thì dừng.","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: n = 2; while n != 1: nếu n % 2 == 0 thì n = n // 2 ngược lại n = 3 * n + 1; với n ban đầu bằng 6 thì vòng lặp chạy mấy lần? (bài toán Collatz)","options":["A. 8","B. 6","C. 7","D. Vô hạn"],"answer":"A","explain":"6→3→10→5→16→8→4→2→1: 8 lần biến đổi thì n = 1 và dừng.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào đúng về nguy cơ của while?","options":["A. Dễ gây lặp vô hạn nếu điều kiện không bao giờ sai","B. Không bao giờ lặp vô hạn","C. Luôn chạy nhanh hơn for","D. Không cần điều kiện"],"answer":"A","explain":"Lập trình while phải đảm bảo điều kiện sẽ sai sau một số lần lặp hữu hạn.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: i = 0; s = 0; while i != 10: i = i + 1; nếu i % 2 == 1 thì continue; s = s + i; sau vòng lặp in s. In ra bao nhiêu?","options":["A. 30","B. 25","C. 55","D. 20"],"answer":"A","explain":"Bỏ qua số lẻ, cộng các số chẵn 2+4+6+8+10 = 30.","points":0.25},{"type":"mcq","level":"NB","q":"Đoạn lệnh: s = 0; i = 1; while i != 6: s = s + i; i = i + 1; sau vòng lặp in s. In ra bao nhiêu?","options":["A. 15","B. 10","C. 21","D. 5"],"answer":"A","explain":"s = 1+2+3+4+5 = 15.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về cú pháp while.","statements":["Cú pháp: while điều_kiện: rồi khối lệnh thụt vào.","Sau điều kiện phải có dấu hai chấm.","Khối lệnh của while phải thụt đầu dòng.","Điều kiện của while không cần là biểu thức lôgic."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: điều kiện phải là biểu thức lôgic.","points":1},{"type":"truefalse","level":"VD","q":"Xét đoạn lệnh: a = 48; b = 18; while b != 0: a, b = b, a % b. Các phát biểu sau đúng hay sai? (thuật toán Euclid)","statements":["Mỗi lần lặp thay (a, b) thành (b, a % b).","Vòng lặp dừng khi b = 0.","Sau vòng lặp a = 6.","a cuối cùng là ước chung lớn nhất của 48 và 18."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"short","level":"VD","q":"Đoạn lệnh: i = 1; s = 0; while i != 10: s = s + i; i = i + 3; sau vòng lặp in s. In ra bao nhiêu?","answer":"12","explain":"i = 1, 4, 7; s = 12... ","points":0.5},{"type":"short","level":"NB","q":"Đoạn lệnh: i = 1; while i != 4: i = i + 1 lặp bao nhiêu lần?","answer":"3","explain":"i = 1, 2, 3: lặp 3 lần.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Đoạn lệnh: i = 2; while i != 7: i = i + 2 lặp bao nhiêu lần?","options":["A. Lặp vô hạn","B. 3 lần","C. 2 lần","D. 5 lần"],"answer":"A","explain":"i = 2, 4, 6, 8, ... luôn là số chẵn nên không bao giờ bằng 7: lặp vô hạn! Đây là lỗi logic cần tránh.","points":0.25},{"type":"mcq","level":"NB","q":"Nếu quên lệnh i = i + 1 trong thân vòng while i != 4 ở trên, điều gì xảy ra?","options":["A. Lặp vô hạn vì i mãi bằng 1","B. Vẫn dừng bình thường","C. Báo lỗi","D. Chỉ lặp một lần"],"answer":"A","explain":"i không thay đổi nên điều kiện i != 4 luôn đúng: lặp vô hạn.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: i = 1; s = 0; while i != 8: s = s + i; i = i + 2; sau vòng lặp in s, i. In ra gì?","options":["A. 16 và 9","B. 9 và 16","C. 15 và 7","D. 16 và 7"],"answer":"A","explain":"i = 1,3,5,7; s = 1+3+5+7 = 16; khi i = 9 thì dừng.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: x = 7; while x != 7: print(x) chạy mấy lần?","options":["A. 0 lần","B. 1 lần","C. Vô hạn","D. 7 lần"],"answer":"A","explain":"Điều kiện sai ngay từ đầu nên thân không chạy lần nào.","points":0.25},{"type":"mcq","level":"NB","q":"Đoạn lệnh: i = 0; while i != 3: i = i + 1; print(i) in ra gì? (print ngoài vòng lặp)","options":["A. 3","B. 0","C. 1 2 3","D. Lặp vô hạn"],"answer":"A","explain":"Vòng lặp tăng i đến 3 rồi dừng; print ngoài vòng lặp in 3 một lần.","points":0.25},{"type":"mcq","level":"VDC","q":"Phát biểu nào SAI?","options":["A. while ... else: khối else chạy khi vòng lặp bị break","B. while kiểm tra điều kiện trước mỗi lần lặp","C. break thoát vòng lặp ngay","D. Quên cập nhật điều kiện gây lặp vô hạn"],"answer":"A","explain":"Khối else của while chạy khi vòng lặp kết thúc TỰ NHIÊN (không bị break); bị break thì bỏ qua else.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét đoạn lệnh: i = 0; while i != 5: i = i + 1; nếu i == 3 thì break. Các phát biểu sau đúng hay sai?","statements":["Vòng lặp dừng khi i = 3.","break thoát vòng lặp ngay.","Các lần lặp còn lại bị bỏ qua.","i cuối cùng bằng 5."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: break khi i = 3 nên i = 3.","points":1},{"type":"truefalse","level":"VDC","q":"Xét các phát biểu về an toàn của điều kiện lặp.","statements":["Nên chọn điều kiện chắc chắn tiến tới False.","Giảm đúng 1 mỗi lần thì while n != 0 chắc chắn dừng.","Nhảy cóc có thể bỏ qua giá trị dừng gây lặp vô hạn.","Lặp vô hạn luôn phát hiện được ngay khi viết."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: lặp vô hạn đôi khi chỉ phát hiện khi chạy thử.","points":1},{"type":"short","level":"TH","q":"Đoạn lệnh: i = 1; s = 0; while i != 5: s = s + i; i = i + 1; sau vòng lặp in s. In ra bao nhiêu?","answer":"10","explain":"Tổng 1 đến 4 bằng 10.","points":0.5},{"type":"short","level":"VDC","q":"Đoạn lệnh: x = 1; while x != 8: x = x * 2 lặp bao nhiêu lần?","answer":"3","explain":"x = 1, 2, 4: lặp 3 lần rồi x = 8 thì dừng.","points":0.5}]}]}</script>
