n trả về str; muốn số phải chuyển kiểu tường minh bằng int()/float().","points":0.25},{"type":"mcq","level":"TH","q":"Để nhập họ tên (có dấu cách) từ bàn phím, dùng lệnh nào?","options":["A. hoten = input()","B. hoten = int(input())","C. hoten = float(input())","D. input(hoten)"],"answer":"A","explain":"Họ tên là xâu nên dùng input() thuần, không chuyển kiểu.","points":0.25},{"type":"mcq","level":"NB","q":"Lệnh print(1, 2, 3, sep = \"-\") in ra kết quả nào?","options":["A. 1-2-3","B. 1 2 3","C. 1,2,3","D. 123"],"answer":"A","explain":"sep = \"-\" nên các giá trị ngăn cách bởi dấu gạch ngang: 1-2-3.","points":0.25},{"type":"truefalse","level":"VDC","q":"Xét hai lệnh: print(\"a\", \"b\", sep=\"-\", end=\"#\"); print(\"c\", end=\"#\"). Các phát biểu sau đúng hay sai?","statements":["Lệnh 1 in ra a-b#.","Lệnh 2 in nối tiếp thành a-b#c#.","Cả hai lệnh đều không xuống dòng.","Kết quả cuối cùng là a-b#c#."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét lệnh print(\"a\", \"b\", sep = \"-\", end = \"!\"). Các phát biểu sau đúng hay sai?","statements":["Kết quả in ra là a-b!.","sep đã đổi dấu cách thành dấu -.","end đã đổi xuống dòng thành dấu !.","Nếu bỏ sep và end sẽ in ra a b xuống dòng."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"short","level":"TH","q":"Kết quả của float(\"2\") là bao nhiêu?","answer":"2.0","explain":"float(\"2\") = 2.0.","points":0.5},{"type":"short","level":"VDC","q":"Lệnh print(\"p\", \"q\", sep = \"-\", end = \"#\"); print(\"r\", end = \"#\") in ra gì?","answer":"p-q#r#","explain":"Lệnh 1: p-q#; lệnh 2 nối tiếp: r#. Kết quả: p-q#r#.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"TH","q":"Thứ tự đúng để viết chương trình tính chu vi hình chữ nhật khi biết dài, rộng nhập từ bàn phím là?","options":["A. Nhập dài, rộng → tính chu vi → in kết quả","B. Tính chu vi → nhập dài, rộng → in","C. In kết quả → nhập → tính","D. Nhập dài → in → nhập rộng → tính"],"answer":"A","explain":"Phải có dữ liệu đầu vào trước mới tính toán và đưa ra kết quả: đúng quy trình nhập - xử lí - xuất.","points":0.25},{"type":"mcq","level":"NB","q":"Lệnh input(\"Nhập tên của bạn: \") có tác dụng gì?","options":["A. Hiện lời nhắc rồi chờ người dùng gõ dữ liệu","B. In ra màn hình mà không chờ nhập","C. Báo lỗi","D. Tắt chương trình"],"answer":"A","explain":"Xâu trong input() là lời nhắc hiện ra trước để hướng dẫn người dùng nhập.","points":0.25},{"type":"mcq","level":"VD","q":"Để tính trung bình hai số thực nhập từ bàn phím, dãy lệnh đúng là?","options":["A. a = float(input()); b = float(input()); print((a + b) / 2)","B. a = input(); b = input(); print((a + b) / 2)","C. a = int(input()); b = int(input()); print((a + b) / 2)","D. print((a + b) / 2); a = float(input())"],"answer":"A","explain":"Số thực phải dùng float(input()); B lỗi vì cộng xâu; C mất phần thập phân; D dùng biến trước khi nhập.","points":0.25},{"type":"mcq","level":"NB","q":"Kết quả của str(100) là gì?","options":["A. \"100\"","B. 100","C. 100.0","D. Báo lỗi"],"answer":"A","explain":"str(100) chuyển số thành xâu \"100\".","points":0.25},{"type":"mcq","level":"VDC","q":"Cho a = input(); b = int(a); c = float(a). Với dữ liệu nhập \"6\", kiểu của a, b, c lần lượt là?","options":["A. str, int, float","B. int, int, float","C. str, str, str","D. int, float, str"],"answer":"A","explain":"a = \"6\" (str); b = 6 (int); c = 6.0 (float).","points":0.25},{"type":"mcq","level":"TH","q":"Người dùng nhập lần lượt 4 và 5 cho hai lệnh a = int(input()); b = int(input()). Lệnh print(a + b) in ra gì?","options":["A. 9","B. 45","C. 4 + 5","D. Báo lỗi"],"answer":"A","explain":"a = 4, b = 5 (số nguyên); a + b = 9.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về chuyển kiểu.","statements":["int(\"25\") cho số nguyên 25.","float(\"3.5\") cho số thực 3.5.","str(100) cho xâu \"100\".","int(\"abc\") cho số nguyên 0."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: int(\"abc\") báo lỗi.","points":1},{"type":"truefalse","level":"VD","q":"Cho x = float(input()) với dữ liệu nhập 7. Xét các phát biểu.","statements":["x = 7.0 (số thực).","print(x * 2) in ra 14.0.","Nếu nhập \"bảy\" sẽ báo lỗi.","float(input()) dùng được cho cả số nguyên."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng: nhập 7 được 7.0; 7.0*2=14.0; xâu chữ báo lỗi; số nguyên vẫn chuyển được thành thực.","points":1},{"type":"short","level":"VD","q":"Kết quả của int(7.99) là bao nhiêu?","answer":"7","explain":"int() cắt bỏ phần thập phân: 7.","points":0.5},{"type":"short","level":"NB","q":"Tham số nào của print() quy định kí tự kết thúc sau khi in?","answer":"end","explain":"end là kí tự kết thúc, mặc định là xuống dòng.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Muốn in ba số 1 2 3 trên cùng một dòng, mỗi số cách nhau một dấu cách, dùng lệnh nào?","options":["A. print(1, 2, 3)","B. print(1); print(2); print(3)","C. input(1, 2, 3)","D. print(\"123\")"],"answer":"A","explain":"print(1, 2, 3) in ba giá trị cách nhau dấu cách trên cùng dòng.","points":0.25},{"type":"mcq","level":"TH","q":"Lệnh print(2, 4, 6, sep = \" + \") in ra gì?","options":["A. 2 + 4 + 6","B. 12","C. 2, 4, 6","D. 2 4 6"],"answer":"A","explain":"Các giá trị ngăn cách bởi \" + \": 2 + 4 + 6 (chỉ là hiển thị, không tính tổng).","points":0.25},{"type":"mcq","level":"NB","q":"Câu lệnh nào nhập số thực từ bàn phím?","options":["A. x = float(input())","B. x = int(input())","C. x = input()","D. x = str(input())"],"answer":"A","explain":"Bọc input() trong float() để được số thực.","points":0.25},{"type":"mcq","level":"NB","q":"Lệnh print(\"a\", \"b\", \"c\") in các giá trị cách nhau bởi gì (mặc định)?","options":["A. Một dấu cách","B. Dấu phẩy","C. Dấu chấm phẩy","D. Không có gì ngăn cách"],"answer":"A","explain":"Mặc định, print ngăn cách các giá trị bởi một dấu cách (tham số sep mặc định là dấu cách).","points":0.25},{"type":"mcq","level":"VD","q":"Lệnh print(\"*\", \"*\", \"*\", sep = \"\\n\") in ra kết quả nào?","options":["A. Ba dấu * mỗi dấu một dòng","B. * * * trên một dòng","C. ***","D. Báo lỗi"],"answer":"A","explain":"sep = \"\\n\" (xuống dòng) nên mỗi giá trị in trên một dòng riêng.","points":0.25},{"type":"mcq","level":"VDC","q":"Lệnh print(*[1, 2, 3], sep = \"-\") in ra gì? (gợi ý: dấu * tách danh sách thành các đối số)","options":["A. 1-2-3","B. [1, 2, 3]","C. Báo lỗi","D. 1 2 3"],"answer":"A","explain":"*[1, 2, 3] tách thành ba đối số 1, 2, 3; sep = \"-\" cho 1-2-3.","points":0.25},{"type":"truefalse","level":"VDC","q":"Xét các phát biểu về quy trình làm chương trình tính tiền điện.","statements":["Cần nhập số kWh đã dùng (số thực hoặc nguyên).","Phải chuyển kiểu dữ liệu nhập sang số mới tính được tiền.","Nên in kết quả kèm đơn vị (đồng) cho rõ ràng.","Có thể tính tiền trước khi nhập số kWh."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: phải nhập trước, tính sau.","points":1},{"type":"truefalse","level":"TH","q":"Người dùng nhập 4 và 6 cho a = int(input()); b = int(input()). Xét các phát biểu.","statements":["a + b cho 10.","a * b cho 24.","str(a) + str(b) cho \"46\".","a / b cho 0 (số nguyên)."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: phép / cho 4/6 = 0.666... (số thực).","points":1},{"type":"short","level":"TH","q":"Lệnh print(\"a\", \"b\", \"c\", sep = \"\") in ra gì?","answer":"abc","explain":"sep rỗng nên ba xâu dính liền: abc.","points":0.5},{"type":"short","level":"VDC","q":"Muốn in 3 dấu # trên 3 dòng riêng (dùng sep), lệnh print đầy đủ là gì?","answer":"print(\"#\", \"#\", \"#\", sep = \"\\n\")","explain":"sep = \"\\n\" xuống dòng giữa các giá trị.","points":0.5}]}]}</script>
