 là lỗi logic.","Điều kiện ngược là lỗi logic.","Mọi sai ý đồ máy đều báo."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"short","level":"NB","q":"Loại lỗi nào khó phát hiện nhất?","answer":"logic","explain":"Lỗi logic không có thông báo.","points":0.5},{"type":"short","level":"VD","q":"Đoạn lệnh tính giai thừa nhưng dùng s = s + i (thay vì nhân). Đây là lỗi gì?","answer":"logic","explain":"Sai thuật toán.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Chương trình bị dừng đột ngột giữa chừng kèm thông báo lỗi, đó là lỗi gì?","options":["A. Lỗi ngoại lệ","B. Lỗi cú pháp","C. Lỗi logic","D. Hết pin"],"answer":"A","explain":"Dừng khi đang chạy với thông báo: lỗi ngoại lệ.","points":0.25},{"type":"mcq","level":"VDC","q":"Phát biểu nào đúng về thời điểm phát hiện lỗi?","options":["A. Cú pháp: khi dịch; ngoại lệ: khi chạy tới; logic: không tự báo","B. Mọi lỗi báo cùng lúc","C. Logic báo trước","D. Ngoại lệ báo khi dịch"],"answer":"A","explain":"Đúng theo bản chất ba loại lỗi.","points":0.25},{"type":"mcq","level":"NB","q":"Thông báo lỗi của Python thường cho biết gì?","options":["A. Loại lỗi, dòng lỗi và mô tả ngắn","B. Cách sửa chi tiết","C. Ai gây lỗi","D. Không cho biết gì"],"answer":"A","explain":"Traceback chỉ ra loại lỗi, dòng gây lỗi giúp định vị.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: def f(a, b): return a + b; rồi gọi f(3). Đây là lỗi gì?","options":["A. Lỗi ngoại lệ (thiếu đối số)","B. Lỗi cú pháp","C. Lỗi logic","D. Không lỗi"],"answer":"A","explain":"Thiếu đối số gây TypeError khi chạy.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh tìm max: lon = 0; for x in [-5, -2, -8]: nếu x lớn hơn lon thì lon = x; in lon. Lỗi gì?","options":["A. Lỗi logic (khởi tạo 0 sai khi mọi số âm)","B. Lỗi cú pháp","C. Lỗi ngoại lệ","D. Không lỗi"],"answer":"A","explain":"Kết quả ra 0 sai; phải khởi tạo lon = phần tử đầu.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào đúng về phát hiện lỗi?","options":["A. Lỗi cú pháp: máy báo ngay; lỗi logic: phải tự kiểm tra kết quả","B. Mọi lỗi máy đều tự sửa","C. Lỗi logic máy báo ngay","D. Không phát hiện được lỗi nào"],"answer":"A","explain":"Máy chỉ báo cú pháp và ngoại lệ; logic phải do người kiểm tra.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét đoạn lệnh: s = 0; for i in range(1, 6): s = s - i (muốn tính tổng). Các phát biểu sau đúng hay sai?","statements":["Chương trình chạy không báo lỗi.","Kết quả ra -15 thay vì 15.","Đây là lỗi logic.","Đây là lỗi cú pháp."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh: def f(a): return a + b; b = 5; f(3). Các phát biểu sau đúng hay sai?","statements":["Không có lỗi, kết quả 8.","b toàn cục đọc được trong hàm.","Nếu gọi trước khi gán b sẽ lỗi.","Định nghĩa hàm đã chạy thân hàm."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: định nghĩa chưa chạy thân.","points":1},{"type":"short","level":"VDC","q":"Lỗi trong thân hàm được phát hiện khi nào?","answer":"khi gọi hàm","explain":"Định nghĩa chưa chạy thân hàm.","points":0.5},{"type":"short","level":"TH","q":"Dùng biến chưa gán gây lỗi gì?","answer":"ngoại lệ","explain":"NameError khi chạy.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"VDC","q":"Đoạn lệnh: x = 5; y = 2; z = x // y; in z (muốn chia thực). Lỗi gì?","options":["A. Lỗi logic (dùng // thay vì /)","B. Lỗi cú pháp","C. Lỗi ngoại lệ","D. Không lỗi"],"answer":"A","explain":"Chạy ra 2 thay vì 2.5: sai ý đồ.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: print(\"kết quả: \" + 5). Đây là lỗi gì?","options":["A. Lỗi ngoại lệ (không cộng xâu với số)","B. Lỗi cú pháp","C. Lỗi logic","D. Không lỗi"],"answer":"A","explain":"Cộng str với int gây TypeError khi chạy.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: n = 5; s = 1; for i in range(1, n + 1): s = s + i; in s (muốn tính giai thừa). Đây là lỗi gì?","options":["A. Lỗi logic (dùng cộng thay vì nhân, khởi tạo sai)","B. Lỗi cú pháp","C. Lỗi ngoại lệ","D. Không lỗi"],"answer":"A","explain":"Giai thừa cần nhân dồn từ 1: s = s * i.","points":0.25},{"type":"mcq","level":"NB","q":"Lỗi cú pháp (syntax error) là gì?","options":["A. Lỗi do viết sai quy tắc ngôn ngữ, bị phát hiện khi dịch","B. Lỗi khi chạy chương trình","C. Lỗi cho kết quả sai","D. Lỗi máy tính hỏng"],"answer":"A","explain":"Lỗi cú pháp: sai chính tả, thiếu dấu, sai cấu trúc; trình dịch phát hiện ngay.","points":0.25},{"type":"mcq","level":"VD","q":"Trong các lỗi sau, lỗi nào máy KHÔNG báo?","options":["A. Tính tổng nhưng dùng nhầm công thức","B. Thiếu dấu hai chấm","C. Chia cho 0","D. Biến chưa gán"],"answer":"A","explain":"Sai công thức là lỗi logic, máy không báo.","points":0.25},{"type":"mcq","level":"NB","q":"Vòng lặp vô hạn thuộc loại lỗi nào?","options":["A. Lỗi logic","B. Lỗi cú pháp","C. Lỗi ngoại lệ","D. Không phải lỗi"],"answer":"A","explain":"Chương trình không báo lỗi nhưng không bao giờ xong: lỗi thuật toán (logic).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về ba loại lỗi.","statements":["Lỗi cú pháp do viết sai quy tắc ngôn ngữ.","Lỗi ngoại lệ xảy ra khi đang chạy.","Lỗi logic cho kết quả sai mà không báo lỗi.","Cả ba loại đều được máy báo."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: lỗi logic máy không báo.","points":1},{"type":"truefalse","level":"VD","q":"Xét đoạn lệnh: n = int(\"abc\"). Các phát biểu sau đúng hay sai?","statements":["Đây là lỗi ngoại lệ.","Thông báo là ValueError.","Lỗi lộ ngay khi chạy tới.","Đây là lỗi cú pháp."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"short","level":"NB","q":"Loại lỗi nào được phát hiện ngay khi dịch?","answer":"cú pháp","explain":"Lỗi cú pháp.","points":0.5},{"type":"short","level":"VD","q":"Đoạn lệnh: s = 0; for i in range(1, 6): s = s - i (muốn tính tổng). Đây là lỗi gì?","answer":"logic","explain":"Chạy được nhưng sai: lỗi logic.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Ví dụ nào sau đây gây lỗi cú pháp trong Python?","options":["A. print \"xin chào\" (thiếu ngoặc đơn)","B. print(\"xin chào\")","C. x = 5","D. for i in range(3):"],"answer":"A","explain":"print là hàm nên thiếu ngoặc đơn là lỗi cú pháp.","points":0.25},{"type":"mcq","level":"NB","q":"Lỗi do quên chuyển kiểu khi nhập số để tính toán thuộc loại nào?","options":["A. Lỗi ngoại lệ hoặc cho kết quả sai (tùy trường hợp)","B. Lỗi cú pháp","C. Không phải lỗi","D. Lỗi máy"],"answer":"A","explain":"Ví dụ int(\"abc\") gây ngoại lệ; \"4\"+\"5\" cho \"45\" là lỗi logic.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: for i in range(3): in i; in \"xong\" (lệnh sau không thụt). Nếu muốn \"xong\" in 3 lần thì đây là lỗi gì?","options":["A. Lỗi logic (thụt đầu dòng sai ý đồ)","B. Lỗi cú pháp","C. Lỗi ngoại lệ","D. Không lỗi"],"answer":"A","explain":"Chương trình chạy đúng cú pháp nhưng không đúng ý đồ: lỗi logic.","points":0.25},{"type":"mcq","level":"TH","q":"Kết quả đúng của giai thừa 5 là bao nhiêu (đoạn trên cho 16)?","options":["A. 120","B. 16","C. 15","D. 25"],"answer":"A","explain":"5! = 120; đoạn sai cho 1+1+2+3+4+5 = 16.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: a = [5, 2, 8]; x = a[3]; in x. Lỗi gì và sửa thế nào?","options":["A. Lỗi ngoại lệ; chỉ số lớn nhất là 2, sửa thành a[2]","B. Lỗi cú pháp","C. Lỗi logic","D. Không lỗi"],"answer":"A","explain":"IndexError: a có 3 phần tử, chỉ số 0..2.","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: for i in range(10): nếu i % 2 == 0 thì in i (muốn in số lẻ). Lỗi gì?","options":["A. Lỗi logic (điều kiện ngược)","B. Lỗi cú pháp","C. Lỗi ngoại lệ","D. Không lỗi"],"answer":"A","explain":"In ra số chẵn thay vì số lẻ: sai điều kiện.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về gỡ lỗi cơ bản.","statements":["Khi có thông báo lỗi, đọc kĩ nó trước.","Xác định dòng gây lỗi từ traceback.","Sửa ngay mà không cần hiểu.","Lỗi logic cần kiểm tra kết quả."],"answer":["T","T","F","T"],"explain":"a,b,d) Đúng. c) Sai: phải hiểu nguyên nhân mới sửa đúng.","points":1},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh đệ quy không có điểm dừng. Các phát biểu sau đúng hay sai?","statements":["Gây lỗi khi chạy.","Lỗi là tràn ngăn xếp.","Định nghĩa đã báo lỗi.","Thiếu điểm dừng là lỗi thuật toán."],"answer":["T","T","F","T"],"explain":"a,b,d) Đúng. c) Sai: định nghĩa không báo.","points":1},{"type":"short","level":"VDC","q":"Đệ quy không có điểm dừng gây lỗi gì khi chạy?","answer":"tràn ngăn xếp","explain":"RecursionError: gọi mãi không dừng.","points":0.5},{"type":"short","level":"TH","q":"Đoạn lệnh print(10 / 0) gây lỗi gì? (cú pháp/ngoại lệ/logic)","answer":"ngoại lệ","explain":"Chia cho 0 khi chạy.","points":0.5}]}]}</script>
