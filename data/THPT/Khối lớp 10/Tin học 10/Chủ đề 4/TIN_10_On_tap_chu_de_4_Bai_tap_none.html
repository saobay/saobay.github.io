{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Một file ảnh có kích thước 1920×1080 điểm ảnh thuộc loại đồ họa nào?","options":["A. Đồ họa raster","B. Đồ họa vector","C. Đồ họa 3D","D. Không thuộc loại nào"],"answer":"A","explain":"Kích thước tính bằng điểm ảnh (pixel) là đặc trưng của ảnh raster.","points":0.25},{"type":"mcq","level":"NB","q":"Phần mềm Inkscape được phát triển theo mô hình nào?","options":["A. Mã nguồn mở, miễn phí","B. Thương mại, trả phí theo tháng","C. Chỉ dùng nội bộ","D. Phần mềm hệ thống"],"answer":"A","explain":"Inkscape là phần mềm mã nguồn mở, miễn phí cho mọi người sử dụng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao khi thiết kế biển quảng cáo ngoài trời, người ta thường chọn đồ họa vector?","options":["A. Vì in khổ lớn vẫn sắc nét, không bị vỡ hạt","B. Vì file vector luôn đẹp hơn","C. Vì vector rẻ hơn","D. Vì raster không in được"],"answer":"A","explain":"Biển quảng cáo khổ lớn cần phóng to nhiều lần; vector phóng to không vỡ nên phù hợp.","points":0.25},{"type":"mcq","level":"TH","q":"Trong Inkscape, để thay đổi màu tô của nhiều hình cùng lúc, cách nhanh nhất là","options":["A. Chọn tất cả các hình rồi bấm màu một lần","B. Tô từng hình một","C. Vẽ lại các hình","D. Khởi động lại phần mềm"],"answer":"A","explain":"Chọn đồng thời nhiều đối tượng rồi áp màu một lần sẽ tô đồng loạt.","points":0.25},{"type":"mcq","level":"VD","q":"Một học sinh cần nộp bài vẽ cho giáo viên để chấm và góp ý chỉnh sửa. Em nên khuyên bạn nộp file nào?","options":["A. File SVG gốc để giáo viên mở và sửa trực tiếp","B. Ảnh chụp màn hình điện thoại","C. File nhạc","D. Không nộp gì"],"answer":"A","explain":"File gốc SVG giữ nguyên đối tượng để giáo viên chỉnh sửa, góp ý trực tiếp.","points":0.25},{"type":"mcq","level":"VDC","q":"Một cửa hàng cần logo dùng cho: biển hiệu lớn, card visit, ảnh đại diện mạng xã hội. Phương án tối ưu nhất là","options":["A. Thiết kế một logo vector gốc, rồi xuất các phiên bản kích cỡ, định dạng phù hợp từng mục đích","B. Vẽ ba logo khác nhau cho ba mục đích","C. Chụp ảnh logo vẽ tay","D. Tải logo miễn phí trên mạng"],"answer":"A","explain":"Một logo vector gốc đáp ứng mọi kích cỡ; xuất PNG cho mạng xã hội, PDF cho in ấn.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["Đồ họa raster cấu tạo từ các điểm ảnh.","Đồ họa vector phóng to không bị vỡ.","Inkscape là phần mềm đồ họa vector miễn phí.","File SVG không thể mở bằng trình duyệt web."],"answer":["T","T","T","F"],"explain":"SVG là chuẩn mở nên trình duyệt web hiển thị được.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về quy trình làm việc.","statements":["Nên lưu file thường xuyên khi đang vẽ.","Nên giữ file SVG gốc để chỉnh sửa về sau.","Xuất PNG là đủ, không cần giữ file gốc.","Trước khi gửi in nên kiểm tra chính tả và bố cục."],"answer":["T","T","F","T"],"explain":"Luôn giữ file gốc SVG; file xuất chỉ là thành phẩm.","points":1},{"type":"short","level":"NB","q":"Đơn vị cấu tạo nên ảnh raster có tên tiếng Anh là (viết thường)","answer":"pixel","explain":"Pixel là điểm ảnh, đơn vị nhỏ nhất của ảnh raster.","points":0.5},{"type":"short","level":"VDC","q":"Để xuất bản vẽ Inkscape thành ảnh PNG, tổ hợp phím tắt là","answer":"Ctrl+Shift+E","explain":"Ctrl+Shift+E mở hộp thoại Export PNG Image.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Công cụ nào trong Inkscape dùng để vẽ hình vuông?","options":["A. Công cụ hình chữ nhật (F4) kết hợp giữ phím Ctrl","B. Công cụ văn bản","C. Công cụ tô màu","D. Không vẽ được hình vuông"],"answer":"A","explain":"Chọn công cụ hình chữ nhật rồi giữ Ctrl khi kéo để được hình vuông.","points":0.25},{"type":"mcq","level":"NB","q":"Phím tắt nào dùng để tách một nhóm đối tượng thành các đối tượng độc lập?","options":["A. Ctrl+Shift+G","B. Ctrl+G","C. Ctrl+S","D. Ctrl+Z"],"answer":"A","explain":"Ctrl+Shift+G tách nhóm; Ctrl+G tạo nhóm.","points":0.25},{"type":"mcq","level":"TH","q":"Khi hai đối tượng chồng lấp nhau, đối tượng nào sẽ hiển thị phía trên?","options":["A. Đối tượng được vẽ sau (hoặc được đưa lên trên)","B. Đối tượng được vẽ trước","C. Đối tượng có màu đậm hơn","D. Ngẫu nhiên"],"answer":"A","explain":"Thứ tự mặc định: vẽ sau nằm trên; có thể điều chỉnh bằng PageUp/PageDown/Home/End.","points":0.25},{"type":"mcq","level":"TH","q":"Mục đích của việc nhóm (group) các đối tượng là","options":["A. Thao tác đồng loạt (di chuyển, co giãn) nhiều đối tượng như một khối","B. Làm cho đối tượng đẹp hơn","C. Giảm dung lượng file","D. Đổi màu tự động"],"answer":"A","explain":"Nhóm giúp quản lí và thao tác đồng loạt các bộ phận liên quan.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn cần xếp 6 hình tròn thành một hàng ngang đều nhau. Công cụ nào giúp bạn làm nhanh và chính xác nhất?","options":["A. Align and Distribute (Ctrl+Shift+A)","B. Kéo bằng tay","C. Đoán bằng mắt","D. Vẽ lại"],"answer":"A","explain":"Align căn thẳng hàng, Distribute phân bố khoảng cách đều nhau tự động.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn vẽ sơ đồ phòng học với 30 chiếc bàn giống nhau. Để sau này đổi màu tất cả các bàn cùng lúc nhanh nhất, ngay từ đầu bạn nên","options":["A. Vẽ một bàn mẫu, nhân bản ra 30 bàn (chúng là đối tượng độc lập dễ chọn đồng loạt)","B. Vẽ 30 bàn hoàn toàn khác nhau","C. Vẽ tất cả dính liền thành một hình","D. Không cần chuẩn bị gì"],"answer":"A","explain":"Nhân bản từ mẫu cho các đối tượng đồng nhất, dễ chọn đồng loạt để đổi màu.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["F4 là công cụ vẽ hình chữ nhật.","F5 là công cụ vẽ ellipse.","Giữ Ctrl khi vẽ giúp tạo hình đều.","Không thể bo tròn góc hình chữ nhật."],"answer":["T","T","T","F"],"explain":"Hình chữ nhật bo được góc bằng nút tròn ở góc hoặc thông số Rx, Ry.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau.","statements":["Nhân bản (Ctrl+D) tạo bản sao độc lập với bản gốc.","Nhóm (Ctrl+G) giúp di chuyển nhiều đối tượng cùng lúc.","Thứ tự chồng lấp có thể thay đổi bằng Home/End.","Đối tượng đã nhóm không thể tách ra."],"answer":["T","T","T","F"],"explain":"Nhóm tách được bằng Ctrl+Shift+G bất cứ lúc nào.","points":1},{"type":"short","level":"NB","q":"Màu đường viền của đối tượng trong Inkscape gọi là (tiếng Anh, viết thường)","answer":"stroke","explain":"Stroke là màu viền; Fill là màu tô bên trong.","points":0.5},{"type":"short","level":"VDC","q":"Hộp thoại căn chỉnh và phân bố đều đối tượng mở bằng tổ hợp phím","answer":"Ctrl+Shift+A","explain":"Ctrl+Shift+A mở Align and Distribute.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Đường cong mượt mà trong Inkscape được tạo ra nhờ loại nút nào?","options":["A. Nút trơn (smooth) có tay cầm điều khiển","B. Nút góc","C. Điểm ảnh","D. Không cần nút"],"answer":"A","explain":"Nút trơn với tay cầm điều khiển tạo đoạn cong mượt; nút góc tạo góc nhọn.","points":0.25},{"type":"mcq","level":"NB","q":"Để đặt dòng chữ chạy vòng quanh một hình tròn, ta sử dụng lệnh nào?","options":["A. Text → Put on Path","B. File → Save","C. Edit → Undo","D. Object → Group"],"answer":"A","explain":"Put on Path đặt văn bản bám theo đường dẫn (đường tròn, đường cong).","points":0.25},{"type":"mcq","level":"TH","q":"Tại sao trước khi gửi file thiết kế có chữ cho nhà in, người ta thường chuyển chữ thành đường?","options":["A. Vì máy nhà in có thể thiếu font chữ, chuyển thành đường thì hiển thị đúng mọi máy","B. Vì chữ thành đường sẽ đẹp hơn","C. Vì file nhẹ hơn","D. Vì nhà in yêu cầu xóa chữ"],"answer":"A","explain":"Chữ thành đường không còn phụ thuộc font, tránh lỗi hiển thị khi máy khác thiếu font.","points":0.25},{"type":"mcq","level":"TH","q":"Phép toán nào trong Inkscape dùng để tạo hình vành khăn từ hai hình tròn đồng tâm?","options":["A. Difference (trừ hình nhỏ khỏi hình lớn)","B. Union (gộp)","C. Copy (sao chép)","D. Group (nhóm)"],"answer":"A","explain":"Difference trừ phần chồng lấp của hình trên khỏi hình dưới, tạo hình khuyết.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ đường viền trang trí nhưng một đoạn bị gãy khúc. Thao tác sửa đúng là","options":["A. Dùng công cụ Node chuyển nút bị gãy thành nút trơn và chỉnh tay cầm","B. Tô màu đậm che đi","C. Vẽ thêm đường khác đè lên","D. Bỏ qua"],"answer":"A","explain":"Chuyển nút góc thành nút trơn và chỉnh tay cầm cho đường cong mượt.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn cần tạo chữ kí điện tử mô phỏng chữ kí tay của mình để chèn vào văn bằng khen. Cách tốt nhất là","options":["A. Dùng công cụ Bézier vẽ nét chữ kí rồi chỉnh nút cho mượt mà","B. Gõ tên bằng font chữ thường","C. Chụp ảnh chữ kí trên giấy rồi chèn (ảnh raster dễ vỡ khi phóng)","D. Không cần chữ kí"],"answer":"A","explain":"Vẽ vector bằng Bézier cho nét chữ kí sắc nét mọi kích cỡ, chuyên nghiệp hơn ảnh chụp.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["Công cụ Bézier vẽ được cả đường thẳng và đường cong.","Nhấn Enter kết thúc đường Bézier đang vẽ.","Công cụ Node (F2) chỉnh sửa từng nút của đường.","Đường hở (chưa khép kín) vẫn tô được màu nền."],"answer":["T","T","T","F"],"explain":"Chỉ đường khép kín mới tô được màu nền (Fill).","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau.","statements":["Chữ sau khi chuyển thành đường không gõ sửa nội dung được.","Nên kiểm tra chính tả trước khi chuyển chữ thành đường.","Nên giữ một bản chưa chuyển chữ để sửa sau này.","Chữ đã chuyển thành đường vẫn phụ thuộc font chữ."],"answer":["T","T","T","F"],"explain":"Chữ thành đường là hình vector thuần túy, không còn phụ thuộc font.","points":1},{"type":"short","level":"NB","q":"Công cụ vẽ đường cong trong Inkscape có tên là (viết đúng: Bézier)","answer":"Bézier","explain":"Công cụ Bézier (Shift+F6) vẽ đường thẳng và đường cong.","points":0.5},{"type":"short","level":"VDC","q":"Phép toán gộp nhiều hình chồng lấp thành một có tên tiếng Anh là (viết thường)","answer":"union","explain":"Union gộp; Difference trừ; Intersection lấy giao.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Hiệu ứng chuyển màu mượt mà từ màu này sang màu khác gọi là","options":["A. Gradient","B. Fill","C. Stroke","D. Layer"],"answer":"A","explain":"Gradient là dải chuyển sắc; Fill là màu phẳng, Stroke là viền, Layer là lớp.","points":0.25},{"type":"mcq","level":"NB","q":"Trong bảng Layers, lớp nào hiển thị trên cùng của bản vẽ?","options":["A. Lớp nằm trên cùng trong danh sách","B. Lớp nằm dưới cùng trong danh sách","C. Lớp có tên dài nhất","D. Ngẫu nhiên"],"answer":"A","explain":"Thứ tự lớp trong bảng Layers quyết định thứ tự hiển thị: trên cùng hiển thị trên cùng.","points":0.25},{"type":"mcq","level":"TH","q":"Khi nào nên dùng độ phân giải 300 DPI khi xuất ảnh?","options":["A. Khi ảnh dùng để in ấn chất lượng cao","B. Khi ảnh chỉ xem trên điện thoại","C. Khi muốn file nhẹ nhất","D. Khi đăng story mạng xã hội"],"answer":"A","explain":"In ấn cần DPI cao (khoảng 300); ảnh web chỉ cần 72–96 DPI.","points":0.25},{"type":"mcq","level":"TH","q":"Tác dụng của việc khóa (lock) một lớp là","options":["A. Tránh chỉnh sửa nhầm vào các đối tượng trên lớp đó","B. Xóa lớp đó","C. Ẩn lớp đó vĩnh viễn","D. Đổi tên lớp"],"answer":"A","explain":"Khóa lớp bảo vệ phần đã hoàn thiện khi làm việc với các lớp khác.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn thiết kế 5 poster cùng chủ đề cho chuỗi sự kiện. Để 5 poster đồng bộ phong cách, bạn nên","options":["A. Xây dựng một bộ mẫu chung (màu sắc, font chữ, bố cục) rồi phát triển từng poster","B. Thiết kế mỗi poster một phong cách khác nhau","C. Sao chép y hệt một poster cho 5 sự kiện","D. Nhờ 5 người thiết kế"],"answer":"A","explain":"Bộ mẫu chung (template) đảm bảo đồng bộ thương hiệu chuỗi sự kiện.","points":0.25},{"type":"mcq","level":"VDC","q":"Khách hàng yêu cầu logo vừa in được một màu lên đồng phục, vừa có bản đủ màu cho website. Bạn xử lí thế nào?","options":["A. Thiết kế logo vector gốc, xuất bản một màu cho đồng phục và bản đủ màu cho website","B. Vẽ hai logo khác nhau","C. Chỉ làm bản đủ màu","D. Từ chối yêu cầu"],"answer":"A","explain":"Một file vector gốc linh hoạt xuất nhiều phiên bản màu sắc theo nhu cầu sử dụng.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["Gradient có hai kiểu: tuyến tính và xuyên tâm.","Có thể thêm nhiều điểm dừng màu trên dải gradient.","Bộ lọc Drop Shadow tạo bóng đổ cho đối tượng.","Không nên lạm dụng quá nhiều hiệu ứng."],"answer":["T","T","T","T"],"explain":"Hiệu ứng dùng vừa phải, có chủ đích thì sản phẩm mới đẹp.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau.","statements":["Nên đặt tên lớp gợi nhớ để dễ quản lí.","Nên khóa lớp đã hoàn thiện.","Ẩn lớp giúp tập trung làm việc với lớp khác.","Thứ tự các lớp không thể thay đổi."],"answer":["T","T","T","F"],"explain":"Thứ tự lớp thay đổi được bằng cách kéo thả trong bảng Layers.","points":1},{"type":"short","level":"NB","q":"Công cụ tạo màu chuyển sắc có phím tắt là","answer":"Ctrl+F1","explain":"Ctrl+F1 (hoặc G) là công cụ Gradient.","points":0.5},{"type":"short","level":"VDC","q":"Khi dùng ảnh của người khác trong thiết kế mà không xin phép, ta có thể vi phạm điều gì? (điền: bản quyền)","answer":"bản quyền","explain":"Phải tôn trọng bản quyền: dùng tài nguyên được phép, ghi nguồn khi cần.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Thanh công cụ (toolbox) của Inkscape thường được bố trí ở đâu?","options":["A. Bên trái màn hình","B. Bên phải màn hình","C. Phía trên cùng","D. Ở giữa vùng vẽ"],"answer":"A","explain":"Thanh công cụ nằm dọc bên trái, chứa các công cụ vẽ và chỉnh sửa.","points":0.25},{"type":"mcq","level":"NB","q":"Tổ hợp phím nào tạo tài liệu vẽ mới trong Inkscape?","options":["A. Ctrl+N","B. Ctrl+S","C. Ctrl+O","D. Ctrl+Q"],"answer":"A","explain":"Ctrl+N tạo mới; Ctrl+S lưu; Ctrl+O mở; Ctrl+Q thoát.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác nhau cơ bản giữa lệnh Save và Export trong Inkscape là","options":["A. Save giữ file làm việc để sửa tiếp, Export tạo thành phẩm để dùng ngay","B. Hai lệnh giống nhau","C. Export nhanh hơn","D. Save chỉ dùng một lần"],"answer":"A","explain":"Save lưu SVG chỉnh sửa được; Export tạo PNG/PDF thành phẩm.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn vẽ hình tròn có tâm đúng tại vị trí bắt đầu kéo chuột, ta","options":["A. Chọn công cụ ellipse, giữ Ctrl+Shift rồi kéo","B. Vẽ tự do không giữ phím nào","C. Vẽ hình chữ nhật","D. Dùng công cụ văn bản"],"answer":"A","explain":"Ctrl cho hình tròn đều, Shift vẽ từ tâm; kết hợp được hình tròn vẽ từ tâm.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ thiệp có chữ 'Mừng sinh nhật' nhưng chữ bị hình nền che mất. Cách sửa nhanh nhất là","options":["A. Chọn chữ rồi nhấn Home để đưa lên trên cùng","B. Xóa hình nền","C. Vẽ lại chữ","D. Đổi màu nền"],"answer":"A","explain":"Đưa chữ lên trên cùng (Home) để chữ hiển thị đè lên hình nền.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn làm video giới thiệu lớp cần ảnh nền 1920×1080. Bạn có logo vector của lớp. Cách tạo ảnh nền tốt nhất là","options":["A. Thiết kế trên trang đúng kích thước rồi xuất PNG đủ phân giải","B. Vẽ nhỏ rồi phóng to ảnh PNG","C. Chụp màn hình","D. Dùng ảnh mờ trên mạng"],"answer":"A","explain":"Thiết kế đúng kích thước từ đầu rồi xuất đủ phân giải cho chất lượng tốt nhất.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["Thanh palette giúp chọn nhanh màu tô và viền.","Ctrl+Z hoàn tác thao tác vừa làm.","File SVG giữ nguyên đối tượng để chỉnh sửa tiếp.","File PNG xuất ra vẫn sửa được từng đối tượng vector."],"answer":["T","T","T","F"],"explain":"PNG là ảnh raster thành phẩm, không sửa từng đối tượng vector được.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về làm việc nhóm.","statements":["Nên thống nhất kích thước trang và bảng màu khi làm chung.","Đặt tên lớp rõ ràng giúp ghép file dễ dàng.","Mỗi người nên giữ file gốc phần mình làm.","Làm nhóm không cần quy ước gì."],"answer":["T","T","T","F"],"explain":"Làm nhóm cần quy ước chung về kích thước, màu sắc, đặt tên lớp.","points":1},{"type":"short","level":"NB","q":"Định dạng file gốc của Inkscape có đuôi là (gồm dấu chấm)","answer":".svg","explain":"File gốc Inkscape lưu định dạng SVG.","points":0.5},{"type":"short","level":"VDC","q":"Để đưa đối tượng lên trên cùng trong thứ tự chồng lấp, nhấn phím","answer":"Home","explain":"Home lên trên cùng; End xuống dưới cùng.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Đâu là phần mềm đồ họa vector miễn phí?","options":["A. Inkscape","B. Paint","C. Notepad","D. Calculator"],"answer":"A","explain":"Inkscape là phần mềm vector miễn phí; Paint là raster; hai phần còn lại không phải đồ họa.","points":0.25},{"type":"mcq","level":"NB","q":"Khi lưu file trong Inkscape, định dạng mặc định là gì?","options":["A. SVG","B. MP3","C. DOCX","D. EXE"],"answer":"A","explain":"Inkscape lưu mặc định định dạng SVG để giữ nguyên đối tượng vector.","points":0.25},{"type":"mcq","level":"TH","q":"Một ảnh JPEG khi phóng to nhiều lần bị vỡ hạt. Giải thích đúng là","options":["A. Vì JPEG là ảnh raster có số điểm ảnh cố định","B. Vì JPEG là ảnh vector","C. Vì máy tính bị lỗi","D. Vì chưa lưu file"],"answer":"A","explain":"Ảnh raster có số pixel cố định nên phóng to quá mức sẽ lộ pixel, bị vỡ.","points":0.25},{"type":"mcq","level":"TH","q":"Trong Inkscape, công cụ Select (F1) KHÔNG dùng để","options":["A. Gõ văn bản","B. Chọn đối tượng","C. Di chuyển đối tượng","D. Thay đổi kích thước đối tượng"],"answer":"A","explain":"Gõ văn bản dùng công cụ Text (F8); Select dùng để chọn, di chuyển, co giãn.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn cần vẽ quốc kì gồm nền chữ nhật và ngôi sao ở giữa sao cho sao nằm chính giữa. Cách chính xác nhất là","options":["A. Dùng Align căn giữa ngôi sao theo cả chiều ngang và dọc so với nền","B. Kéo ngôi sao bằng mắt","C. Vẽ lại nhiều lần","D. Đoán vị trí"],"answer":"A","explain":"Align căn giữa ngang và dọc cho vị trí chính xác tuyệt đối.","points":0.25},{"type":"mcq","level":"VDC","q":"Trường bạn tổ chức cuộc thi vẽ tranh cổ động bằng Inkscape. Để bài dự thi đạt chất lượng tốt, bạn nên chú ý điều nào NHẤT?","options":["A. Bố cục rõ ràng, màu sắc hài hòa, thông điệp dễ hiểu, xuất đúng định dạng","B. Dùng càng nhiều hiệu ứng càng tốt","C. Vẽ càng nhiều chi tiết càng tốt","D. Chỉ cần đẹp là đủ, không cần thông điệp"],"answer":"A","explain":"Tranh cổ động cần thông điệp rõ, bố cục đẹp và file đúng chuẩn để sử dụng.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["Ảnh raster phù hợp với ảnh chụp.","Ảnh vector phù hợp với logo, biểu tượng.","Phóng to ảnh vector không bị vỡ.","Paint là phần mềm đồ họa vector."],"answer":["T","T","T","F"],"explain":"Paint là phần mềm raster đơn giản của Windows.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau.","statements":["Nên vẽ đối tượng nền trước, chi tiết sau.","Chữ cần đọc được phải nằm ở lớp trên.","Có thể điều chỉnh thứ tự chồng lấp của đối tượng.","Thứ tự vẽ ban đầu là cố định, không đổi được."],"answer":["T","T","T","F"],"explain":"Thứ tự chồng lấp luôn điều chỉnh được bằng các lệnh Raise/Lower.","points":1},{"type":"short","level":"NB","q":"Trang web chính thức để tải Inkscape là (viết liền)","answer":"inkscape.org","explain":"inkscape.org là trang chủ của dự án Inkscape.","points":0.5},{"type":"short","level":"VDC","q":"Để mở hộp thoại thiết lập trang giấy (kích thước, đơn vị), tổ hợp phím là","answer":"Ctrl+Shift+D","explain":"Ctrl+Shift+D mở Document Properties thiết lập trang giấy.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Công cụ vẽ ngôi sao trong Inkscape mở bằng phím nào?","options":["A. Phím *","B. Phím F1","C. Phím F8","D. Phím Delete"],"answer":"A","explain":"Phím * mở công cụ vẽ ngôi sao và đa giác đều.","points":0.25},{"type":"mcq","level":"NB","q":"Để nhân bản nhanh một đối tượng tại chỗ, ta nhấn","options":["A. Ctrl+D","B. Ctrl+S","C. Ctrl+N","D. Ctrl+Q"],"answer":"A","explain":"Ctrl+D nhân bản chồng khít lên bản gốc.","points":0.25},{"type":"mcq","level":"TH","q":"Khi thiết kế, việc sao chép kiểu (Paste Style) từ đối tượng mẫu giúp","options":["A. Đồng nhất màu sắc, kiểu dáng nhanh chóng","B. Làm file nhẹ hơn","C. Tăng tốc máy tính","D. Tự động vẽ thêm"],"answer":"A","explain":"Paste Style dán kiểu fill, stroke từ mẫu sang đối tượng khác.","points":0.25},{"type":"mcq","level":"TH","q":"Đường viền nét đứt trong Inkscape thường được dùng để biểu thị","options":["A. Đường gấp, đường ẩn hoặc trang trí","B. Đường biên quốc gia","C. Không có ý nghĩa","D. Lỗi phần mềm"],"answer":"A","explain":"Nét đứt thường biểu thị đường gấp khúc, đường ẩn trong kĩ thuật.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ mặt đồng hồ gồm 12 vạch số đều nhau quanh mặt. Cách làm nhanh nhất là","options":["A. Vẽ một vạch mẫu, nhân bản và xoay đều quanh tâm","B. Vẽ 12 vạch bằng tay","C. Vẽ một vạch thật dài","D. Dùng văn bản"],"answer":"A","explain":"Vạch mẫu + nhân bản + xoay đều quanh tâm cho 12 vạch chính xác.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn nhận thiết kế banner nhưng khách hàng liên tục yêu cầu đổi màu. Để đáp ứng nhanh mà không làm lại từ đầu, điều quan trọng nhất là","options":["A. Giữ file SVG gốc được tổ chức tốt (lớp, nhóm rõ ràng)","B. Vẽ lại mỗi lần khách yêu cầu","C. Từ chối khách hàng","D. Xuất PNG rồi tô đè"],"answer":"A","explain":"File gốc tổ chức tốt cho phép đổi màu nhanh nhiều lần.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["Ctrl+D nhân bản đối tượng tại chỗ.","Ctrl+G nhóm các đối tượng đang chọn.","Ctrl+Z hoàn tác thao tác vừa làm.","Ctrl+S là phím tắt thoát phần mềm."],"answer":["T","T","T","F"],"explain":"Ctrl+S là lưu file; Ctrl+Q mới là thoát phần mềm.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau.","statements":["Bézier là công cụ vẽ đường cong chính trong Inkscape.","Có thể chuyển văn bản thành đường để tránh lỗi font.","Nên kiểm tra chính tả trước khi chuyển chữ thành đường.","Văn bản trên đường cong không thể chỉnh sửa."],"answer":["T","T","T","F"],"explain":"Văn bản trên đường cong vẫn gõ sửa, đổi font được bình thường.","points":1},{"type":"short","level":"NB","q":"Phím tắt nhóm các đối tượng trong Inkscape là","answer":"Ctrl+G","explain":"Ctrl+G nhóm; Ctrl+Shift+G tách nhóm.","points":0.5},{"type":"short","level":"VDC","q":"Lệnh đặt văn bản theo đường cong trong menu Text có tên là (viết đúng: Put on Path)","answer":"Put on Path","explain":"Text → Put on Path đặt chữ bám theo đường dẫn.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Màu tô bên trong đối tượng được gọi là","options":["A. Fill","B. Stroke","C. Canvas","D. Pixel"],"answer":"A","explain":"Fill là màu tô nền bên trong; Stroke là màu viền.","points":0.25},{"type":"mcq","level":"NB","q":"Công cụ lấy màu từ đối tượng có sẵn có phím tắt là","options":["A. F7","B. F1","C. F4","D. F5"],"answer":"A","explain":"F7 là công cụ Dropper lấy màu từ đối tượng bất kì.","points":0.25},{"type":"mcq","level":"TH","q":"Khi áp dụng hiệu ứng đổ bóng cho chữ trên poster, chữ sẽ","options":["A. Nổi bật hơn, có chiều sâu","B. Biến mất","C. Nhỏ lại","D. Mờ không đọc được"],"answer":"A","explain":"Bóng đổ tạo chiều sâu giúp chữ nổi bật trên nền.","points":0.25},{"type":"mcq","level":"TH","q":"Để tạo dải màu chuyển từ đỏ sang vàng, ta cần ít nhất mấy điểm dừng màu?","options":["A. 2 điểm (một đỏ, một vàng)","B. 1 điểm","C. 10 điểm","D. 100 điểm"],"answer":"A","explain":"Hai stop xác định hai đầu màu; Inkscape nội suy màu ở giữa.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ quả cam: muốn phần trên sáng, phần dưới tối dần. Kĩ thuật phù hợp là","options":["A. Dùng radial gradient với stop sáng ở tâm trên","B. Tô một màu cam phẳng","C. Vẽ hai nửa quả cam","D. Dùng ảnh chụp"],"answer":"A","explain":"Radial gradient tạo khối tròn tự nhiên cho quả cam.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn thiết kế giao diện ứng dụng cần 20 nút bấm cùng phong cách. Để đảm bảo đồng nhất và dễ chỉnh sửa hàng loạt, bạn nên","options":["A. Thiết kế một nút mẫu hoàn chỉnh rồi nhân bản, dùng Paste Style đồng bộ","B. Vẽ 20 nút độc lập tùy hứng","C. Vẽ một nút rồi chụp màn hình 19 lần","D. Tải nút trên mạng"],"answer":"A","explain":"Nút mẫu + nhân bản + Paste Style đảm bảo đồng nhất và sửa hàng loạt dễ dàng.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["Gradient giúp sản phẩm sinh động hơn màu phẳng.","Drop Shadow tạo bóng đổ cho đối tượng.","Nên dùng hiệu ứng vừa phải, có chủ đích.","Càng nhiều hiệu ứng càng đẹp."],"answer":["T","T","T","F"],"explain":"Lạm dụng hiệu ứng gây rối mắt; dùng vừa phải mới đẹp.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau.","statements":["File gốc SVG nên được giữ lại để chỉnh sửa.","Ảnh đăng web chỉ cần DPI 72–96.","Ảnh in cần DPI khoảng 300.","DPI càng cao càng tốt cho mọi mục đích."],"answer":["T","T","T","F"],"explain":"DPI cao không cần thiết cho web, chỉ làm file nặng tải chậm.","points":1},{"type":"short","level":"NB","q":"Kiểu chuyển sắc tỏa từ tâm ra ngoài gọi là (tiếng Anh, viết thường)","answer":"radial","explain":"Radial gradient tỏa từ tâm; linear theo hướng thẳng.","points":0.5},{"type":"short","level":"VDC","q":"Để dán kiểu dáng đã sao chép sang đối tượng khác, nhấn tổ hợp phím","answer":"Ctrl+Shift+V","explain":"Ctrl+Shift+V là Paste Style dán kiểu fill, stroke.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Vùng làm việc trung tâm của Inkscape nơi đặt trang giấy gọi là","options":["A. Vùng vẽ (canvas)","B. Thanh menu","C. Thùng rác","D. Màn hình nền"],"answer":"A","explain":"Canvas là vùng vẽ trung tâm hiển thị trang giấy và đối tượng.","points":0.25},{"type":"mcq","level":"NB","q":"Lệnh xuất bản vẽ thành ảnh PNG nằm trong menu nào?","options":["A. File","B. Edit","C. View","D. Help"],"answer":"A","explain":"File → Export PNG Image (Ctrl+Shift+E) xuất ảnh.","points":0.25},{"type":"mcq","level":"TH","q":"Một file PNG có nền trong suốt khi chèn lên slide sẽ","options":["A. Để lộ nền slide ở phần trong suốt","B. Hiện nền đen","C. Không chèn được","D. Thành video"],"answer":"A","explain":"PNG hỗ trợ kênh trong suốt; phần trong suốt để lộ nền phía dưới.","points":0.25},{"type":"mcq","level":"TH","q":"Khi vẽ nhiều đối tượng, nên sắp xếp chúng thành nhóm theo","options":["A. Chức năng, bộ phận liên quan để dễ quản lí","B. Màu sắc ngẫu nhiên","C. Thứ tự vẽ","D. Không cần sắp xếp"],"answer":"A","explain":"Nhóm theo chức năng/bộ phận giúp tìm và sửa từng phần dễ dàng.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn cần in poster A3 từ bản vẽ. Thao tác nào sau đây là ĐÚNG?","options":["A. Xuất PNG với DPI 300 rồi mang file ảnh đi in","B. Chụp màn hình rồi in","C. In trực tiếp ở chế độ xem thu nhỏ","D. Gửi file Word"],"answer":"A","explain":"Xuất PNG 300 DPI cho bản in sắc nét.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn được giao làm mới logo cũ của trường (đang là ảnh JPEG mờ). Phương án đúng là","options":["A. Vẽ lại logo bằng vector dựa trên mẫu cũ để có bản sắc nét mọi kích cỡ","B. Phóng to ảnh JPEG cũ","C. Dùng bộ lọc làm nét ảnh cũ","D. Giữ nguyên ảnh mờ"],"answer":"A","explain":"Ảnh raster mờ không phục hồi được bằng phóng to; vẽ lại vector là cách đúng.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["Nên lưu file thường xuyên khi làm việc.","Đặt tên file gợi nhớ giúp dễ tìm.","Vẽ xong nên xuất thêm PNG để xem nhanh.","Chỉ cần file PNG là đủ cho mọi việc."],"answer":["T","T","T","F"],"explain":"Cần giữ file SVG gốc để chỉnh sửa; PNG chỉ là thành phẩm.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau.","statements":["Tôn trọng bản quyền khi dùng ảnh, font của người khác.","Tác phẩm tự vẽ thì mình là chủ sở hữu.","Sao chép ý tưởng người khác không xin phép là vi phạm.","Bản quyền không áp dụng cho đồ họa."],"answer":["T","T","T","F"],"explain":"Sản phẩm đồ họa được pháp luật bảo hộ bản quyền.","points":1},{"type":"short","level":"NB","q":"Để lưu file trong Inkscape, nhấn tổ hợp phím","answer":"Ctrl+S","explain":"Ctrl+S lưu file (định dạng SVG mặc định).","points":0.5},{"type":"short","level":"VDC","q":"Chế độ tự động hút đối tượng vào lưới trong Inkscape gọi là (tiếng Anh, viết thường)","answer":"snap","explain":"Snap (bắt dính) giúp đặt đối tượng chính xác vào lưới, đường gióng.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Trong các định dạng sau, đâu là định dạng của đồ họa vector?","options":["A. SVG","B. JPEG","C. PNG","D. BMP"],"answer":"A","explain":"SVG là định dạng vector; JPEG, PNG, BMP là raster.","points":0.25},{"type":"mcq","level":"NB","q":"Phím tắt mở hộp thoại tô màu và viền chi tiết (Fill and Stroke) là","options":["A. Ctrl+Shift+F","B. Ctrl+Shift+S","C. Alt+F4","D. Ctrl+Alt+Delete"],"answer":"A","explain":"Ctrl+Shift+F mở Fill and Stroke chỉnh màu tô, viền, độ dày nét.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao file vector thường nhẹ hơn file raster?","options":["A. Vì chỉ lưu mô tả đối tượng bằng công thức, không lưu từng điểm ảnh","B. Vì vector ít màu","C. Vì vector nén mạnh hơn","D. Vì vector không lưu chữ"],"answer":"A","explain":"Vector lưu tham số hình học thay vì màu từng pixel nên file nhẹ.","points":0.25},{"type":"mcq","level":"TH","q":"Khi co giãn một đối tượng vector, chất lượng hình ảnh sẽ","options":["A. Không đổi, vẫn sắc nét","B. Bị vỡ","C. Bị mất màu","D. Bị nhòe"],"answer":"A","explain":"Vector vẽ lại từ công thức ở mọi kích cỡ nên không vỡ, không nhòe.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn thiết kế thiệp 20/11 tặng thầy cô. Để thiệp trang trọng, bạn nên chú ý","options":["A. Bố cục cân đối, màu sắc hài hòa, lời chúc đúng chính tả","B. Dùng thật nhiều màu sặc sỡ","C. Nhồi nhét nhiều hình","D. Viết chữ thật nhỏ"],"answer":"A","explain":"Thiệp trang trọng cần bố cục cân đối, màu hài hòa và không lỗi chính tả.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nhóm 4 bạn cùng thiết kế một poster, mỗi bạn làm một phần rồi ghép lại. Để ghép thuận lợi, điều quan trọng nhất cần thống nhất từ đầu là","options":["A. Kích thước trang, bảng màu, font chữ và quy ước đặt tên lớp","B. Mỗi người dùng một phần mềm khác nhau","C. Không cần thống nhất gì","D. Ai làm xong trước thì quyết định"],"answer":"A","explain":"Thống nhất quy ước từ đầu giúp ghép các phần trơn tru, đồng bộ.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["Mỗi đối tượng vector có thể chỉnh sửa độc lập.","Thay đổi kích thước vector không làm vỡ hình.","Xóa một đối tượng không ảnh hưởng đối tượng khác.","Vector không thể chứa văn bản."],"answer":["T","T","T","F"],"explain":"Inkscape làm việc tốt với văn bản như một đối tượng vector.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau.","statements":["Logo nên thiết kế bằng đồ họa vector.","Ảnh chụp nên lưu dạng raster như JPEG.","Có thể kết hợp vector và raster trong một sản phẩm.","Inkscape là phần mềm duy nhất làm được vector."],"answer":["T","T","T","F"],"explain":"Ngoài Inkscape còn Illustrator, CorelDRAW... cũng làm đồ họa vector.","points":1},{"type":"short","level":"NB","q":"Phần mềm Paint của Windows thuộc loại đồ họa nào? (viết thường)","answer":"raster","explain":"Paint là phần mềm vẽ ảnh raster đơn giản.","points":0.5},{"type":"short","level":"VDC","q":"Bảng quản lí các lớp trong Inkscape mở bằng tổ hợp phím","answer":"Ctrl+Shift+L","explain":"Ctrl+Shift+L mở bảng Layers.","points":0.5}]}]}
