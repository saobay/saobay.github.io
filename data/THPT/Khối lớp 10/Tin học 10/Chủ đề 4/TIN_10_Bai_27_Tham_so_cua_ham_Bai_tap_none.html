 mặc định giúp lời gọi ngắn gọn.","Mọi tham số đều nên có mặc định."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: chỉ tham số hay dùng giá trị chung mới nên mặc định.","points":1},{"type":"short","level":"VD","q":"Đoạn lệnh: def f(a, b): return a * 10 + b; rồi in f(b = 2, a = 5). In ra bao nhiêu?","answer":"52","explain":"5*10 + 2 = 52.","points":0.5},{"type":"short","level":"NB","q":"Đoạn lệnh: def f(a, b = 5): return a + b; rồi in f(3). In ra bao nhiêu?","answer":"8","explain":"3 + 5 = 8.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Đoạn lệnh: def chào(ten = \"bạn\"): in \"Chào \" + ten; rồi gọi chào(). In ra gì?","options":["A. Chào bạn","B. Chào ten","C. Báo lỗi","D. Không in gì"],"answer":"A","explain":"Không truyền thì ten lấy mặc định \"bạn\".","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh trên, gọi f(4, c = 5) thì in ra bao nhiêu?","options":["A. 13","B. 11","C. 25","D. 40"],"answer":"A","explain":"4*2 + 5 = 13.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: def in_dòng(s, n = 1): for i in range(n): in s; rồi gọi in_dòng(\"hi\", 3). In ra mấy dòng?","options":["A. 3","B. 1","C. 0","D. Báo lỗi"],"answer":"A","explain":"n = 3 nên in 3 dòng.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào SAI?","options":["A. Có thể đặt tham số mặc định đứng trước tham số bắt buộc","B. Tham số mặc định giúp lời gọi ngắn gọn","C. Truyền theo từ khóa không cần đúng thứ tự","D. Thiếu đối số bắt buộc gây lỗi"],"answer":"A","explain":"A sai vì vi phạm quy tắc vị trí.","points":0.25},{"type":"mcq","level":"NB","q":"Lợi ích của tham số mặc định là gì?","options":["A. Gọi hàm linh hoạt: có thể bỏ qua đối số quen thuộc","B. Chạy nhanh hơn","C. Ít tốn bộ nhớ","D. Không có lợi ích"],"answer":"A","explain":"Tham số mặc định giúp lời gọi ngắn gọn khi dùng giá trị thông dụng.","points":0.25},{"type":"mcq","level":"VDC","q":"Cách tránh bẫy trên là?","options":["A. def f(a, b = None): nếu b == None thì b = []", :0.5},{"type":"short","level":"VD","q":"Đoạn lệnh: def f(a, b = 2, c = 3): return a * b + c; rồi in f(4, c = 5). In ra bao nhiêu?","answer":"13","explain":"4*2 + 5 = 13.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"VDC","q":"Đoạn lệnh: def f(a, *args, b = 5): return (a, args, b); rồi in f(1, 2, 3, b = 9). In ra gì?","options":["A. (1, (2, 3), 9)","B. (1, (2, 3), 5)","C. Báo lỗi","D. (1, 2, 3, 9)"],"answer":"A","explain":"b = 9 theo từ khóa.","points":0.25},{"type":"mcq","level":"NB","q":"Đoạn lệnh trên, gọi f(3, 10) thì in ra bao nhiêu?","options":["A. 13","B. 8","C. 3","D. Báo lỗi"],"answer":"A","explain":"Truyền đủ thì mặc định bị thay: 3 + 10 = 13.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh trên, gọi f(5, 1) thì in ra bao nhiêu?","options":["A. 9","B. 10","C. 6","D. Báo lỗi"],"answer":"A","explain":"a = 5, b = 1, c = 3: 5 + 1 + 3 = 9.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: def f(a, b = 1, c = 1): return a + b + c; rồi in f(10, b = 20). In ra bao nhiêu?","options":["A. 31","B. 12","C. 30","D. 11"],"answer":"A","explain":"10 + 20 + 1 = 31.","points":0.25},{"type":"mcq","level":"NB","q":"Đoạn lệnh: def f(a): return a * 2; rồi in f(5, 6). Điều gì xảy ra?","options":["A. Báo lỗi thừa đối số","B. In ra 10","C. In ra 22","D. Bỏ qua 6"],"answer":"A","explain":"Thừa đối số cũng gây lỗi.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: def f(a, b = 2, c = 3): return a + b + c; rồi in f(5). In ra bao nhiêu?","options":["A. 10","B. 5","C. 7","D. Báo lỗi"],"answer":"A","explain":"5 + 2 + 3 = 10.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét đoạn lệnh: def f(a, b = 2, c = 3): return a + b + c. Các phát biểu sau đúng hay sai?","statements":["f(5) cho 10.","f(5, 1) cho 9.","f(5, c = 10) cho 17.","f(c = 10, b = 1, a = 5) cho 16."],"answer":["T","T","T","T"],"explain":"a) 5+2+3=10. b) 5+1+3=9. c) 5+2+10=17. d) 5+1+10=16.","points":1},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh: def f(**kwargs): return kwargs. Các phát biểu sau đúng hay sai?","statements":["f(a = 1, b = 2) cho {\"a\": 1, \"b\": 2}.","**kwargs gom đối số từ khóa thành từ điển.","Dùng khi tùy chọn không biết trước.","f(1, 2) hợp lệ."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: **kwargs chỉ nhận đối số từ khóa.","points":1},{"type":"short","level":"VDC","q":"Vì sao không nên dùng danh sách làm giá trị mặc định? (trả lời ngắn gọn)","answer":"dùng chung","explain":"Danh sách mặc định dùng chung cho mọi lần gọi.","points":0.5},{"type":"short","level":"TH","q":"Đoạn lệnh trên, gọi f(b = 3, a = 10) thì in ra bao nhiêu?","answer":"7","explain":"Theo từ khóa: a = 10, b = 3.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Tên tham số trong định nghĩa có vai trò gì khi truyền theo từ khóa?","options":["A. Là cầu nối để gán đúng đối số","B. Không có vai trò","C. Chỉ để trang trí","D. Làm hàm chạy nhanh"],"answer":"A","explain":"Tên tham số giúp xác định đối số gán cho tham số nào.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao truyền theo từ khóa làm code rõ nghĩa hơn?","options":["A. Vì đọc lời gọi biết ngay đối số nào cho tham số nào","B. Vì chạy nhanh hơn","C. Vì ngắn hơn","D. Không rõ hơn"],"answer":"A","explain":"f(diem = 9) rõ nghĩa hơn f(9).","points":0.25},{"type":"mcq","level":"TH","q":"Khi nào nên dùng tham số mặc định?","options":["A. Khi tham số thường nhận một giá trị thông dụng","B. Luôn luôn","C. Không bao giờ","D. Khi muốn gây lỗi"],"answer":"A","explain":"Ví dụ bước nhảy mặc định, giá trị khởi đầu thông dụng.","points":0.25},{"type":"mcq","level":"NB","q":"Truyền đối số theo từ khóa nghĩa là gì?","options":["A. Chỉ rõ tên tham số khi truyền: f(b = 4, a = 3)","B. Truyền không cần tên","C. Truyền ngẫu nhiên","D. Không truyền được"],"answer":"A","explain":"Viết tên tham số khi gọi giúp không phụ thuộc thứ tự.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: def f(a, *, b): return a + b; rồi in f(1, b = 2). In ra bao nhiêu? (dấu * buộc b truyền theo từ khóa)","options":["A. 3","B. Báo lỗi","C. 12","D. 21"],"answer":"A","explain":"b buộc truyền theo từ khóa: 1 + 2 = 3.","points":0.25},{"type":"mcq","level":"VDC","q":"Khi nào dùng **kwargs?","options":["A. Khi hàm cần nhận các tùy chọn đặt tên không biết trước","B. Luôn luôn","C. Không bao giờ","D. Khi muốn gây lỗi"],"answer":"A","explain":"Ví dụ hàm vẽ nhận màu sắc, kích thước... tùy ý.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét đoạn lệnh: def f(a, b = 2, c = 3): return a * b + c. Các phát biểu sau đúng hay sai?","statements":["f(4) cho 11.","f(4, c = 5) cho 13.","f(c = 5, a = 4) cho 13.","f(4, 3, 2) cho 14."],"answer":["T","T","T","T"],"explain":"a) 4*2+3=11. b) 4*2+5=13. c) 4*2+5=13. d) 4*3+2=14.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về cú pháp.","statements":["def f(a = 1, b): sai cú pháp.","Đối số vị trí phải đứng trước đối số từ khóa.","f(a = 3, 4) sai cú pháp.","Thiếu đối số bắt buộc gây lỗi."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"short","level":"NB","q":"Cách truyền chỉ rõ tên tham số khi gọi hàm gọi là gì?","answer":"theo từ khóa","explain":"Truyền theo từ khóa (keyword).","points":0.5},{"type":"short","level":"VD","q":"Đoạn lệnh: def tong(*args): s = 0; for x in args: s = s + x; return s; rồi in tong(2, 3, 5). In ra bao nhiêu?","answer":"10","explain":"2 + 3 + 5 = 10.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Đoạn lệnh: def f(x, y = 10): return x - y; rồi in f(25). In ra bao nhiêu?","options":["A. 15","B. -15","C. 35","D. 25"],"answer":"A","explain":"25 - 10 = 15.","points":0.25},{"type":"mcq","level":"NB","q":"Đoạn lệnh trên, gọi chào(\"An\") thì in ra gì?","options":["A. Chào An","B. Chào bạn","C. Báo lỗi","D. An"],"answer":"A","explain":"Truyền \"An\" thay giá trị mặc định.","points":0.25},{"type":"mcq","level":"NB","q":"Đoạn lệnh trên, gọi f(1, 2, 3) thì in ra bao nhiêu?","options":["A. 6","B. 3","C. 5","D. Báo lỗi"],"answer":"A","explain":"1 + 2 + 3 = 6.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: def tong(*args): s = 0; for x in args: s = s + x; return s; rồi in tong(1, 2, 3, 4). In ra bao nhiêu?","options":["A. 10","B. 4","C. 24","D. Báo lỗi"],"answer":"A","explain":"args = (1,2,3,4); tổng = 10.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào đúng về thứ tự truyền?","options":["A. Đối số vị trí đứng trước đối số từ khóa","B. Đối số từ khóa đứng trước vị trí","C. Thứ tự tùy ý","D. Không được trộn"],"answer":"A","explain":"Quy tắc Python: positional trước, keyword sau.","points":0.25},{"type":"mcq","level":"VDC","q":"Phát biểu nào SAI về *args?","options":["A. *args phải đứng sau mọi tham số khác","B. *args gom đối số vị trí dư thành tuple","C. Có thể kết hợp *args với tham số từ khóa","D. *args nhận số lượng tùy ý"],"answer":"A","explain":"A sai: *args đứng sau tham số vị trí nhưng có thể đứng trước tham số chỉ-truyền-theo-từ-khóa.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về khi nào dùng mặc định.","statements":["Nên dùng khi tham số thường nhận giá trị chung.","Giúp lời gọi ngắn gọn.","Mọi tham số đều bắt buộc có mặc định.","Đặt tham số ổn định ra sau."],"answer":["T","T","F","T"],"explain":"a,b,d) Đúng. c) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh: def f(a, b = 2): return a + b. Các phát biểu sau đúng hay sai?","statements":["f(a = 5, b = 6) cho 11.","f(5) cho 7.","f(b = 6, a = 5) cho 11.","f() cho 2."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: thiếu a bắt buộc.","points":1},{"type":"short","level":"VDC","q":"Đoạn lệnh: def f(a, *args, b = 5): return a + len(args) + b; rồi in f(1, 2, 3). In ra bao nhiêu?","answer":"8","explain":"1 + 2 + 5 = 8.","points":0.5},{"type":"short","level":"TH","q":"Lời gọi f(a = 3, 4) đúng hay sai cú pháp? (trả lời: đúng/sai)","answer":"sai","explain":"Đối số vị trí không được đứng sau đối số từ khóa.","points":0.5}]}]}</script>
