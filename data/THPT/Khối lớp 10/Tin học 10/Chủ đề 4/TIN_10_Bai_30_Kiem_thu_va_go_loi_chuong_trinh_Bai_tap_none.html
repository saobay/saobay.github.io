n trung gian.","statements":["In biến đếm mỗi lần lặp để kiểm tra.","In giúp thu hẹp chỗ sai.","In quá nhiều làm rối.","Không bao giờ nên in khi gỡ lỗi."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: in là kĩ thuật hữu ích.","points":1},{"type":"truefalse","level":"VDC","q":"Xét các phát biểu về lỗi hiếm theo mẫu.","statements":["Lỗi chỉ sai với n chính phương cần test nhắm vào.","Test ngẫu nhiên có thể bỏ sót.","Test có chủ đích hiệu quả hơn.","Mọi lỗi đều dễ phát hiện."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"short","level":"TH","q":"Sau khi sửa lỗi nên làm gì?","answer":"chạy lại kiểm thử","explain":"Kiểm thử hồi quy.","points":0.5},{"type":"short","level":"VDC","q":"Kĩ thuật giải thích code cho người khác để tự tìm lỗi gọi là gì?","answer":"vịt cao su","explain":"Rubber duck debugging.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"TH","q":"Hàm tính tổng 1..n: def tong(n): s = 0; for i in range(1, n + 1): s = s + i; return s. Bộ test nào tốt?","options":["A. n = 0, 1, 5, 100","B. n = 5","C. n = 50","D. n = -1"],"answer":"A","explain":"Bao gồm biên (0, 1) và thường (5, 100).","points":0.25},{"type":"mcq","level":"VD","q":"Muốn test hàm tách họ tên, test biên nào quan trọng?","options":["A. Tên một từ (\"An\"), tên nhiều dấu cách thừa","B. Tên dài","C. Tên ngắn","D. Không cần biên"],"answer":"A","explain":"Tên một từ (không có họ) và dấu cách thừa dễ gây sai.","points":0.25},{"type":"mcq","level":"TH","q":"Khi nào nên dùng debugger thay vì print?","options":["A. Khi chương trình phức tạp, cần xem nhiều biến từng bước","B. Không bao giờ","C. Chỉ khi rảnh","D. Khi muốn chậm"],"answer":"A","explain":"Debugger mạnh hơn cho chương trình lớn.","points":0.25},{"type":"mcq","level":"NB","q":"Phát biểu nào đúng về gỡ lỗi?","options":["A. Gỡ lỗi là kĩ năng quan trọng của lập trình viên","B. Chỉ người mới cần gỡ lỗi","C. Gỡ lỗi là lãng phí","D. Máy tự gỡ lỗi hết"],"answer":"A","explain":"Mọi lập trình viên đều phải gỡ lỗi thường xuyên.","points":0.25},{"type":"mcq","level":"VDC","q":"Kĩ thuật kiểm thử hộp trắng là gì?","options":["A. Test dựa vào cấu trúc code bên trong (bao phủ nhánh, dòng)","B. Test không cần code","C. Test màu trắng","D. Không test"],"answer":"A","explain":"Hộp trắng: thiết kế test để chạy qua mọi nhánh code.","points":0.25},{"type":"mcq","level":"NB","q":"Sau khi sửa lỗi, nên làm gì?","options":["A. Chạy lại toàn bộ kiểm thử để chắc không gây lỗi mới","B. Xóa test","C. Không cần làm gì","D. Tắt máy"],"answer":"A","explain":"Sửa chỗ này có thể hỏng chỗ khác (hồi quy) nên phải test lại.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét đoạn lệnh: def f(n): s = 0; i = 1; while i != n: s = s + i; i = i + 1; return s. Các phát biểu sau đúng hay sai?","statements":["Test n = 5 mong đợi 15.","Thực tế cho 10.","Lỗi: thiếu lần lặp cuối.","Sửa: while i != n + 1."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về dữ liệu biên.","statements":["Dữ liệu biên là ngưỡng đặc biệt.","Ví dụ: 0, rỗng, số âm.","Lỗi hay ẩn ở biên.","Biên không cần test."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Test dựa vào đặc tả mà không cần biết code gọi là kiểm thử gì?","answer":"hộp đen","explain":"Kiểm thử hộp đen.","points":0.5},{"type":"short","level":"NB","q":"Việc tìm nguyên nhân và sửa lỗi gọi là gì?","answer":"gỡ lỗi","explain":"Gỡ lỗi (debug).","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"TH","q":"Khi bí không tìm ra lỗi, nên làm gì?","options":["A. Nghỉ ngơi, nhờ người khác xem, giải thích lại bài toán","B. Bỏ cuộc","C. Xóa hết","D. Đổ lỗi"],"answer":"A","explain":"Đổi góc nhìn giúp phát hiện lỗi dễ hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Nên lưu bộ test lại để làm gì?","options":["A. Chạy lại sau mỗi lần sửa (kiểm thử hồi quy)","B. Để trưng","C. Xóa đi","D. Không để làm gì"],"ans q":"Xét các phát biểu về sửa lỗi.","statements":["Phải hiểu nguyên nhân rồi mới sửa.","Sửa xong chạy lại kiểm thử.","Sửa bừa dễ gây lỗi mới.","Sửa xong là xong, không cần test."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: phải test hồi quy.","points":1},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về hiệu năng.","statements":["Test với dữ liệu lớn giúp phát hiện chậm.","Công thức toán thường nhanh hơn vòng lặp.","Hiệu năng không cần quan tâm.","n = 10**7 vòng lặp có thể chậm."],"answer":["T","T","F","T"],"explain":"a,b,d) Đúng. c) Sai.","points":1},{"type":"short","level":"NB","q":"Việc chạy chương trình với dữ liệu mẫu để tìm lỗi gọi là gì?","answer":"kiểm thử","explain":"Kiểm thử (test).","points":0.5},{"type":"short","level":"VD","q":"Với n = 5, hàm tong(1..n) đúng phải cho bao nhiêu?","answer":"15","explain":"Tổng 1 đến 5.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Ai chịu trách nhiệm kiểm thử chương trình?","options":["A. Chính lập trình viên (và người kiểm thử chuyên nghiệp)","B. Máy tính","C. Không ai","D. Người dùng cuối"],"answer":"A","explain":"Lập trình viên phải tự test trước khi giao.","points":0.25},{"type":"mcq","level":"TH","q":"Hàm kiểm tra số nguyên tố với n = 1. Kết quả mong đợi là?","options":["A. False (1 không phải số nguyên tố)","B. True","C. Báo lỗi","D. 1"],"answer":"A","explain":"1 không phải số nguyên tố; biên hay bị sai.","points":0.25},{"type":"mcq","level":"VD","q":"Hàm tong(n) đúng. Muốn test hiệu năng với n lớn (10**7), điều cần chú ý là?","options":["A. Vòng lặp 10 triệu lần có thể chậm; cân nhắc công thức","B. Không vấn đề gì","C. Máy sẽ hỏng","D. Không test được"],"answer":"A","explain":"Test hiệu năng cũng quan trọng; công thức n*(n+1)//2 nhanh hơn.","points":0.25},{"type":"mcq","level":"VDC","q":"Kĩ thuật kiểm thử hộp đen là gì?","options":["A. Test dựa vào đặc tả (input/output) mà không cần biết code","B. Test dựa vào code","C. Không test","D. Test ngẫu nhiên"],"answer":"A","explain":"Hộp đen: chỉ quan tâm hành vi ngoài.","points":0.25},{"type":"mcq","level":"TH","q":"Chiến lược gỡ lỗi \"chia để trị\" là gì?","options":["A. Thu hẹp dần vùng nghi ngờ bằng cách kiểm tra từng phần","B. Xóa một nửa code","C. Viết lại","D. Đoán"],"answer":"A","explain":"Cô lập từng phần để xác định chỗ sai.","points":0.25},{"type":"mcq","level":"NB","q":"Kiểm thử (test) chương trình là gì?","options":["A. Chạy chương trình với các dữ liệu mẫu để phát hiện lỗi","B. Viết chương trình","C. Xóa chương trình","D. Tắt máy tính"],"answer":"A","explain":"Kiểm thử: cho chương trình chạy với bộ dữ liệu kiểm thử để tìm lỗi.","points":0.25},{"type":"truefalse","level":"VDC","q":"Xét các phát biểu tổng kết.","statements":["Phòng bệnh hơn chữa bệnh.","Test sớm, test thường xuyên.","Ghi lại kinh nghiệm gỡ lỗi.","Gỡ lỗi giỏi nên không cần test."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét hàm kiểm tra số nguyên tố. Các phát biểu sau đúng hay sai?","statements":["n = 2 mong đợi True.","n = 1 mong đợi False.","n = 2 và n = 1 là biên quan trọng.","Chỉ test số lớn là đủ."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"short","level":"TH","q":"Với hàm tính tổng 1..n, n = 0 là dữ liệu gì? (thường/biên)","answer":"biên","explain":"n = 0 là biên.","points":0.5},{"type":"short","level":"VDC","q":"Lỗi chỉ sai khi n là số chính phương thì test thế nào?","answer":"test nhắm vào","explain":"Test có chủ đích n = 4, 9, 16...","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"VD","q":"Nếu assert tong(5) == 15 báo lỗi, kết luận gì?","options":["A. Hàm tong sai với n = 5","B. assert sai","C. Python hỏng","D. Bỏ qua"],"answer":"A","explain":"Điều kiện sai nghĩa là hàm chưa đúng.","points":0.25},{"type":"mcq","level":"TH","q":"Với n = 0, kết quả mong đợi của hàm tong trên là bao nhiêu?","options":["A. 0","B. 1","C. Báo lỗi","D. -1"],"answer":"A","explain":"Tổng rỗng = 0; vòng lặp không chạy.","points":0.25},{"type":"mcq","level":"VDC","q":"Sửa lỗi trên thế nào?","options":["A. while i != n + 1: (hoặc dùng for)","B. s = 0 thành s = 1","C. i = 0","D. Không sửa được"],"answer":"A","explain":"Bao gồm cả n vào tổng.","points":0.25},{"type":"mcq","level":"NB","q":"Khi sửa lỗi, nguyên tắc quan trọng nhất là gì?","options":["A. Hiểu nguyên nhân rồi mới sửa","B. Sửa bừa cho chạy được","C. Xóa đoạn lỗi","D. Giấu lỗi đi"],"answer":"A","explain":"Sửa không hiểu nguyên nhân dễ gây lỗi mới.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào đúng về tài liệu khi gỡ lỗi?","options":["A. Ghi lại lỗi và cách sửa giúp lần sau nhanh hơn","B. Không cần ghi","C. Ghi làm chậm","D. Chỉ ghi lỗi nặng"],"answer":"A","explain":"Kinh nghiệm gỡ lỗi nên được ghi lại.","points":0.25},{"type":"mcq","level":"NB","q":"Gỡ lỗi (debug) là gì?","options":["A. Tìm nguyên nhân và sửa lỗi của chương trình","B. Xóa chương trình","C. Viết thêm lỗi","D. Tắt máy"],"answer":"A","explain":"Debug: xác định vị trí, nguyên nhân lỗi rồi sửa.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về dữ liệu kiểm thử.","statements":["Nên test dữ liệu thường.","Nên test dữ liệu biên.","Nên test dữ liệu đặc biệt.","Chỉ cần một test duy nhất."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về test tự động.","statements":["Test tự động chạy nhanh.","Viết vòng lặp sinh test ngẫu nhiên được.","Test tự động thay người nghĩ test.","Test tự động tốt cho hồi quy."],"answer":["T","T","F","T"],"explain":"a,b,d) Đúng. c) Sai: người vẫn phải thiết kế.","points":1},{"type":"short","level":"NB","q":"Cặp dữ liệu vào và kết quả mong đợi gọi là gì?","answer":"test case","explain":"Bộ dữ liệu kiểm thử (test case).","points":0.5},{"type":"short","level":"VD","q":"Muốn test hàm với nhiều dữ liệu ngẫu nhiên, nên làm gì?","answer":"viết vòng lặp sinh test","explain":"Tự động hóa việc sinh test.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Kĩ thuật in trung gian: muốn biết vòng lặp chạy mấy lần, in gì?","options":["A. In biến đếm hoặc một dấu hiệu mỗi lần lặp","B. In toàn bộ code","C. Không in gì","D. In tên chương trình"],"answer":"A","explain":"Ví dụ in i mỗi lần lặp để thấy dãy giá trị.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao test n = 1 quan trọng với hàm nguyên tố?","options":["A. Vì nhiều thuật toán sai ở biên nhỏ","B. Vì 1 đặc biệt","C. Không quan trọng","D. Vì 1 là số nguyên tố"],"answer":"A","explain":"Vòng lặp kiểm tra ước có thể xử lí sai n = 1.","points":0.25},{"type":"mcq","level":"VDC","q":"Chương trình đúng với mọi test đã có nhưng sai trong thực tế. Nguyên nhân có thể là?","options":["A. Bộ test chưa bao phủ trường hợp thực tế đó","B. Máy tính sai","C. Python sai","D. Không có nguyên nhân"],"answer":"A","explain":"Thiếu test case cho tình huống thực tế.","points":0.25},{"type":"mcq","level":"NB","q":"Vì sao phải kiểm thử chương trình?","options":["A. Vì chương trình có thể còn lỗi logic mà máy không báo","B. Vì thích","C. Để tốn thời gian","D. Không cần kiểm thử"],"answer":"A","explain":"Kiểm thử giúp phát hiện lỗi logic và lỗi ngoại lệ với dữ liệu đặc biệt.","points":0.25},{"type":"mcq","level":"NB","q":"Phát biểu nào đúng về kiểm thử?","options":["A. Kiểm thử giúp phát hiện lỗi chứ không chứng minh hết lỗi","B. Kiểm thử xong là hết mọi lỗi","C. Không cần kiểm thử","D. Kiểm thử gây thêm lỗi"],"answer":"A","explain":"Không thể thử mọi dữ liệu nên kiểm thử không đảm bảo hết lỗi.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh kiểm thử: assert tong(5) == 15. Lệnh assert làm gì?","options":["A. Kiểm tra điều kiện, báo lỗi nếu sai","B. In kết quả","C. Tính tổng","D. Không làm gì"],"answer":"A","explain":"assert dùng để kiểm thử nhanh trong code.","points":0.25},{"type":"truefalse","level":"VDC","q":"Chương trình đúng với mọi test cũ nhưng sai thực tế. Các phát biểu sau đúng hay sai?","statements":["Bộ test chưa bao phủ trường hợp đó.","Cần bổ sung test mới.","Máy tính bị sai.","Test cũ vô dụng."],"answer":["T","T","F","F"],"explain":"a,b) Đúng. c,d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về debugger.","statements":["Debugger không tự sửa lỗi.","Debugger xem được giá trị biến.","Breakpoint dừng đúng chỗ cần.","Debugger thay thế được kiểm thử."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng: debugger chỉ hỗ trợ quan sát, người vẫn phải sửa. d) Sai: kiểm thử vẫn cần.","points":1},{"type":"short","level":"VDC","q":"Mục tiêu của kiểm thử là tìm lỗi hay chứng minh đúng?","answer":"tìm lỗi","explain":"Tư duy tìm lỗi cho test tốt hơn.","points":0.5},{"type":"short","level":"TH","q":"Lệnh Python dùng để kiểm tra nhanh điều kiện là gì?","answer":"assert","explain":"assert điều_kiện.","points":0.5}]}]}</script>
