í chẵn.","kq = \"abc\".","range bước 2 duyệt 0, 2, 4.","kq = \"123\"."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biệt về tính bất biến.","statements":["Xâu không gán được qua chỉ số.","s[0] = \"A\" báo lỗi.","Muốn đổi phải tạo xâu mới.","Danh sách cũng bất biến như xâu."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: danh sách thay đổi được (mutable).","points":1},{"type":"short","level":"NB","q":"Hàm cho biết số kí tự của xâu là hàm gì?","answer":"len","explain":"len(xâu) trả về số kí tự.","points":0.5},{"type":"short","level":"VD","q":"Đoạn lệnh: dem = 0; for ch in \"programming\": nếu ch == \"m\" thì dem = dem + 1; sau vòng lặp in dem. In ra bao nhiêu?","answer":"2","explain":"\"programming\" có 2 chữ m.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"VDC","q":"Đoạn lệnh: s = \"12321\"; đúng = True; for i in range(len(s) // 2): nếu s[i] != s[len(s)-1-i] thì đúng = False; sau vòng lặp in đúng. In ra gì?","options":["A. True","B. False","C. Báo lỗi","D. 12321"],"answer":"A","explain":"Kiểm tra xâu đối xứng: \"12321\" đọc xuôi ngược như nhau nên True.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: s = \"a1b2c3\"; kq = \"\"; for i in range(0, len(s), 2): kq = kq + s[i]; sau vòng lặp in kq. In ra gì?","options":["A. abc","B. 123","C. a1b2c3","D. cba"],"answer":"A","explain":"Lấy kí tự chỉ số chẵn 0, 2, 4: \"a\", \"b\", \"c\".","points":0.25},{"type":"mcq","level":"NB","q":"Kí tự xuống dòng trong xâu Python được viết thế nào?","options":["A. \\n","B. /n","C. Xuống dòng thật trong code","D. Không viết được"],"answer":"A","explain":"\\n là kí tự escape biểu diễn xuống dòng.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh đếm nguyên âm: s = \"tin hoc\"; dem = 0; for ch in s: nếu ch trong \"aeiou\" thì dem = dem + 1; sau vòng lặp in dem. In ra bao nhiêu?","options":["A. 2","B. 3","C. 7","D. 0"],"answer":"A","explain":"Các nguyên âm trong "name":"Đề 8","questions":[{"type":"mcq","level":"VDC","q":"Phát biểu nào SAI?","options":["A. Xâu trong Python có thể chứa mọi kí tự Unicode","B. len() đếm số byte của xâu","C. Xâu hỗ trợ cắt lát như danh sách","D. Có thể nối xâu bằng +"],"answer":"B","explain":"len() đếm số KÍ TỰ, không phải số byte (một kí tự Unicode có thể chiếm nhiều byte).","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: s = \"Hello\"; kq = s[0]; for i in range(1, len(s)): kq = kq + \"-\" + s[i]; sau vòng lặp in kq. In ra gì?","options":["A. H-e-l-l-o","B. Hello","C. -Hello","D. H--e--l--l--o"],"answer":"A","explain":"Chèn dấu - giữa các kí tự.","points":0.25},{"type":"mcq","level":"TH","q":"Cho s = \"abcabc\". Biểu thức s[3:6] cho gì?","options":["A. abc","B. bca","C. cab","D. abcabc"],"answer":"A","explain":"Kí tự chỉ số 3, 4, 5 là \"a\", \"b\", \"c\".","points":0.25},{"type":"mcq","level":"NB","q":"Mỗi kí tự trong xâu có vị trí xác định gọi là gì?","options":["A. Chỉ số (index)","B. Giá trị","C. Độ dài","D. Tên"],"answer":"A","explain":"Kí tự trong xâu được đánh chỉ số từ 0 như danh sách.","points":0.25},{"type":"mcq","level":"NB","q":"Có thể duyệt từng kí tự của xâu bằng vòng lặp for không?","options":["A. Có, ví dụ for ch in s:","B. Không","C. Chỉ với while","D. Chỉ duyệt được số"],"answer":"A","explain":"for ch in s: lần lượt gán ch bằng từng kí tự của s.","points":0.25},{"type":"mcq","level":"TH","q":"So sánh \"a\" và \"b\" trong Python (theo mã kí tự), biểu thức \"a\" == \"b\" cho gì?","options":["A. False","B. True","C. a","D. Báo lỗi"],"answer":"A","explain":"Hai xâu khác nhau nên False.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về toán tử với xâu.","statements":["\"a\" + \"b\" nối thành \"ab\".","\"ab\" * 3 lặp thành \"ababab\".","\"an\" in \"bánh\" cho True.","\"12\" + \"34\" bằng \"1234\"."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"truefalse","level":"VDC","q":"Xét các phát biểu về len().","statements":["l A. Nguyen Van An","B. NGUYEN VAN AN","C. nguyen van an","D. Nguyen van an"],"answer":"A","explain":"Chuẩn hóa tên riêng: viết hoa chữ cái đầu mỗi từ.","points":0.25},{"type":"mcq","level":"NB","q":"Có thể dùng dấu nháy đơn để tạo xâu không?","options":["A. Có, ví dụ s = 'Tin học'","B. Không, chỉ dùng nháy kép","C. Chỉ dùng ngoặc vuông","D. Không tạo được xâu"],"answer":"A","explain":"Python chấp nhận cả nháy đơn và nháy kép để tạo xâu.","points":0.25},{"type":"mcq","level":"TH","q":"Cho s = \"hello world\". Giá trị của s[6] là gì?","options":["A. w","B. dấu cách","C. h","D. d"],"answer":"A","explain":"Chỉ số: h0 e1 l2 l3 o4 (cách)5 w6: s[6] = \"w\".","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về tạo xâu mới từ xâu cũ.","statements":["s = \"T\" + s[1:] đổi kí tự đầu.","Không thể sửa trực tiếp s[0].","Nối xâu tạo ra xâu mới.","Xâu cũ tự thay đổi khi nối."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: xâu bất biến, xâu cũ không đổi.","points":1},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh: kq = \"\"; for i in range(len(\"abc\")): kq = \"abc\"[i] * (i + 1) + kq. Các phát biểu sau đúng hay sai?","statements":["i = 0 cho \"a\", i = 1 cho \"bb\", i = 2 cho \"ccc\".","Mỗi phần đặt lên đầu kq.","kq = \"cccbba\".","kq = \"abbccc\"."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"short","level":"VDC","q":"Xâu \"abracadabra\" có bao nhiêu kí tự \"a\"?","answer":"5","explain":"Các a ở vị trí 0, 3, 5, 7, 10.","points":0.5},{"type":"short","level":"TH","q":"Cho s = \"abcdef\", giá trị của s[1:4] là gì?","answer":"bcd","explain":"Kí tự chỉ số 1, 2, 3.","points":0.5}]}]}</script>
