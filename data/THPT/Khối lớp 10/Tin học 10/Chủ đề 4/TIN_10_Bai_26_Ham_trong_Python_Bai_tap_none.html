 12.","Có thể lồng lời gọi hàm.","gấp() không đối số vẫn chạy."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: thiếu đối số báo lỗi.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về tham số và đối số.","statements":["Tham số là biến trong định nghĩa hàm.","Đối số là giá trị truyền khi gọi hàm.","Số đối số phải khớp số tham số.","Tham số và đối số là một."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: khác nhau như trên.","points":1},{"type":"short","level":"VD","q":"Đoạn lệnh: def f(a, b): return a - b; rồi in f(b = 10, a = 3). In ra bao nhiêu?","answer":"-7","explain":"3 - 10 = -7.","points":0.5},{"type":"short","level":"NB","q":"Biến ghi trong ngoặc đơn khi định nghĩa hàm gọi là gì?","answer":"tham số","explain":"Tham số là biến hình thức của hàm.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"TH","q":"Tham số mặc định (default) trong định nghĩa hàm là gì?","options":["A. Tham số có giá trị sẵn nếu khi gọi không truyền đối số","B. Tham số bắt buộc","C. Tham số không dùng được","D. Tên của hàm"],"answer":"A","explain":"Ví dụ def f(a, b = 5): b mặc định 5.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: def dt(a, b): return a * b; rồi in dt(4, 5). In ra bao nhiêu?","options":["A. 20","B. 9","C. 45","D. 16"],"answer":"A","explain":"Diện tích hình chữ nhật 4 x 5 = 20.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: def dao(s): kq = \"\"; for ch in s: kq = ch + kq; return kq; rồi in dao(\"abc\"). In ra gì?","options":["A. cba","B. abc","C. a","D. Báo lỗi"],"answer":"A","explain":"Hàm đảo ngược xâu.","points":0.25},{"type":"mcq","level":"NB","q":"Đoạn lệnh: def cộng(a, b): return a + b; rồi in cộng(3, 4). In ra bao nhiêu?","options":["A. 7","B. 34","C. 12","D. Báo lỗi"],"answer":"A","explain":"Gọi cộng(3, 4) trả về 7; in ra 7.","points":0.25},{"type":"mcq","level":"NB","q":"Hàm do lập trình viên tự định nghĩa gọi là gì?","options":["A. Hàm tự định nghĩa","B. Hàm có sẵn","C. Hàm  ra bao nhiêu?","answer":"2","explain":"Số 2 xuất hiện 2 lần.","points":0.5},{"type":"short","level":"NB","q":"Đoạn lệnh: def f(): return 7; rồi in f(). In ra bao nhiêu?","answer":"7","explain":"Hàm trả về 7.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Từ khóa nào dùng để định nghĩa hàm trong Python?","options":["A. def","B. function","C. func","D. define"],"answer":"A","explain":"Cú pháp: def tên_hàm(tham_số): rồi khối lệnh thụt vào.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: def dem(a, x): d = 0; for v in a: nếu v == x thì d = d + 1; return d; rồi in dem([1, 2, 1, 3, 1], 1). In ra bao nhiêu?","options":["A. 3","B. 5","C. 1","D. 0"],"answer":"A","explain":"Số 1 xuất hiện 3 lần.","points":0.25},{"type":"mcq","level":"NB","q":"Hàm không có lệnh return thì trả về giá trị gì khi gọi?","options":["A. None (không có giá trị)","B. 0","C. Báo lỗi","D. \"\""],"answer":"A","explain":"Hàm không return trả về None.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: def chào(ten): in \"Chào \" + ten; rồi gọi chào(\"An\"). In ra gì?","options":["A. Chào An","B. Chào ten","C. An","D. Báo lỗi"],"answer":"A","explain":"Đối số \"An\" gán cho tham số ten; in \"Chào \" + \"An\".","points":0.25},{"type":"mcq","level":"VDC","q":"Phát biểu nào SAI về tham số mặc định?","options":["A. Tham số mặc định phải đứng sau tham số bắt buộc","B. def f(a = 1, b): là sai cú pháp","C. Tham số mặc định giúp gọi hàm linh hoạt hơn","D. Tham số mặc định phải đứng trước tham số bắt buộc"],"answer":"D","explain":"Quy tắc: tham số có mặc định đứng SAU tham số bắt buộc; D nói ngược nên sai.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: def kiem(n): nếu n % 2 == 0 thì return \"chẵn\" ngược lại return \"lẻ\"; rồi in kiem(7). In ra gì?","options":["A. lẻ","B. chẵn","C. 7","D. True"],"answer":"A","explain":"7 % 2 = 1 khác 0 nên trả về \"lẻ\".","points":0.25},{"type":"truefalse","level":"TH","q":"Xét đoạn lệnh: def kiem(n): nếu n % 2 == 0 thì r ) kết thúc hàm ngay nên lệnh in \"B\" không chạy.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn hàm tính chu vi hình vuông cạnh a, định nghĩa đúng là?","options":["A. def chuvi(a): return 4 * a","B. def chuvi(): return 4 * a","C. chuvi(a) = 4 * a","D. def 4*a():"],"answer":"A","explain":"Hàm nhận cạnh a và trả về 4 * a.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: def nto(n): nếu n != 2 và ... (kiểm tra). Với n = 7, hàm đếm ước cho 2 ước. return True hay False?","options":["A. True","B. False","C. 7","D. Báo lỗi"],"answer":"A","explain":"7 là số nguyên tố nên True.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về hàm.","statements":["Hàm định nghĩa bằng từ khóa def.","Thân hàm thụt vào sau dòng def.","Gọi hàm bằng tên kèm cặp ngoặc đơn.","Định nghĩa hàm là thực hiện hàm ngay."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: phải gọi hàm thì thân mới chạy.","points":1},{"type":"truefalse","level":"VD","q":"Xét đoạn lệnh: def gt(n): kq = 1; for i in range(1, n + 1): kq = kq * i; return kq. Các phát biểu sau đúng hay sai?","statements":["gt(5) cho 120.","gt(0) cho 1.","Vòng lặp trong hàm chạy n lần.","Hàm này tính sai giai thừa."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: hàm đúng.","points":1},{"type":"short","level":"NB","q":"Từ khóa trả về giá trị từ hàm là gì?","answer":"return","explain":"return trả giá trị về nơi gọi.","points":0.5},{"type":"short","level":"VD","q":"Đoạn lệnh: def dao(s): kq = \"\"; for ch in s: kq = ch + kq; return kq; rồi in dao(\"abcd\"). In ra gì?","answer":"dcba","explain":"Đảo ngược xâu.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"VD","q":"Đoạn lệnh: def tongchan(n): s = 0; for i in range(2, n + 1, 2): s = s + i; return s; rồi in tongchan(10). In ra bao nhiêu?","options":["A. 30","B. 20","C. 55","D. 25"],"answer":"A","explain":"Tổng số chẵn 2+4+6+8+10 = 30.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: def f(a, b = 5): return a + b; rồi in f(3, 7). In ra bao nhiêu?","options":["A. 10","B. 8","C. 12","D. Báo lỗi"],"answer":"A","explain":"Truyền đủ đối số thì giá trị mặc định bị thay: 3 + 7 = 10.","points":0.25},{"type":"mcq","level":"NB","q":"Cú pháp định nghĩa hàm đúng trong Python là?","options":["A. def tên_hàm(): rồi khối lệnh thụt vào","B. function tên_hàm()","C. def tên_hàm();","D. tạo hàm tên_hàm"],"answer":"A","explain":"def tên_hàm(): kết thúc bằng dấu hai chấm, thân hàm thụt vào trong.","points":0.25},{"type":"mcq","level":"NB","q":"Từ khóa nào dùng để trả về giá trị từ hàm?","options":["A. return","B. back","C. give","D. out"],"answer":"A","explain":"return giá_trị: kết thúc hàm và trả giá trị về nơi gọi.","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: def f(x): x.append(9); return x; rồi a = [1, 2]; in f(a); in a. In ra gì?","options":["A. [1, 2, 9] rồi [1, 2, 9]","B. [1, 2, 9] rồi [1, 2]","C. [1, 2] rồi [1, 2]","D. Báo lỗi"],"answer":"A","explain":"Danh sách truyền vào hàm theo tham chiếu nên append trong hàm đổi cả a ngoài.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: def f(x): return x + 10; rồi in f(f(1)). In ra bao nhiêu?","options":["A. 21","B. 11","C. 12","D. Báo lỗi"],"answer":"A","explain":"f(1) = 11; f(11) = 21: hàm lồng nhau tính từ trong ra ngoài.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét đoạn lệnh: def mu(a): return a * a. Các phát biểu sau đúng hay sai?","statements":["mu(5) cho 25.","mu(0) cho 0.","Gọi mu(3, 4) báo lỗi.","mu là hàm có sẵn."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: mu do người dùng định nghĩa.","points":1},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh: def f(x): x.append(9); a = [1, 2]; f(a). Các phát biểu sau đúng hay sai?","statements":["Danh sách truyền vào hàm theo tham chiếu.","Sau khi gọi, a = [1, 2, 9].","Số và xâu cũng bị hàm sửa như vậy.","Muốn an toàn nên sao chép trước khi truyền."],"answer":["T","T","F","T"],"explain":"a,b,d) Đúng. c) Sai: số/xâu bất biến nên không bị sử ngược lại False","B. return True luôn","C. Kiểm tra n % 2 == 0","D. Không viết được bằng hàm"],"answer":"A","explain":"Số nguyên tố có đúng 2 ước (1 và chính nó).","points":0.25},{"type":"mcq","level":"TH","q":"Số lượng đối số khi gọi hàm phải thế nào so với tham số?","options":["A. Khớp nhau (trừ khi có tham số mặc định)","B. Tùy ý","C. Luôn nhiều hơn","D. Luôn ít hơn"],"answer":"A","explain":"Thừa/thiếu đối số gây lỗi, trừ khi hàm có tham số mặc định.","points":0.25},{"type":"mcq","level":"NB","q":"Đối số của hàm là gì?","options":["A. Giá trị cụ thể truyền cho hàm khi gọi","B. Biến trong định nghĩa hàm","C. Tên hàm","D. Lệnh return"],"answer":"A","explain":"Đối số là giá trị thực tế đưa vào hàm lúc gọi, ví dụ 3, 4 trong cộng(3, 4).","points":0.25},{"type":"truefalse","level":"VDC","q":"Xét các phát biểu tổng kết về hàm.","statements":["Hàm giúp chia nhỏ bài toán (chia để trị).","Hàm tốt dễ kiểm thử và tái sử dụng.","Nên tách code dùng lại thành hàm.","Chương trình tốt không cần dùng hàm."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về gọi hàm.","statements":["Phải định nghĩa hàm trước khi gọi.","Gọi hàm trước khi định nghĩa báo lỗi.","Có thể gọi hàm nhiều lần.","Hàm gọi xong thì biến trong hàm còn dùng được ngoài."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: biến trong hàm là cục bộ.","points":1},{"type":"short","level":"TH","q":"Đoạn lệnh: def f(x): return x * 3; rồi in f(f(2)). In ra bao nhiêu?","answer":"18","explain":"f(2) = 6; f(6) = 18.","points":0.5},{"type":"short","level":"VDC","q":"Đoạn lệnh: a = [1]; def f(x): x.append(2); rồi gọi f(a); in a. In ra gì? (viết dạng danh sách)","answer":"[1, 2]","explain":"Danh sách truyền theo tham chiếu nên bị sửa.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"VDC","q":"Đoạn lệnh: def f(a, b = 2, c = 3): return a * b * c; rồi in f(2, c = 4). In ra bao nhiêu?","options":["A. 16","B. 12","C. 24","D. Báo lỗi"],"answer":"A","explain":"a = 2, b mặc định 2, c = 4: 2*2*4 = 16.","points":0.25},{"type":"mcq","level":"NB","q":"Lợi ích chính của việc dùng hàm là gì?","options":["A. Tái sử dụng code, tránh viết lặp lại","B. Chương trình chạy nhanh hơn","C. Không bao giờ bị lỗi","D. Tốn ít điện hơn"],"answer":"A","explain":"Hàm giúp tái sử dụng: viết một lần, gọi nhiều lần, code gọn và dễ bảo trì.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: def f(a, b): return a - b; rồi in f(b = 10, a = 3) (truyền theo tên). In ra bao nhiêu?","options":["A. -7","B. 7","C. 13","D. Báo lỗi"],"answer":"A","explain":"Truyền theo từ khóa: a = 3, b = 10; 3 - 10 = -7.","points":0.25},{"type":"mcq","level":"NB","q":"Có thể định nghĩa hàm bên trong hàm khác không?","options":["A. Có","B. Không","C. Chỉ trong Python 2","D. Chỉ hàm có sẵn"],"answer":"A","explain":"Python cho phép định nghĩa hàm lồng nhau.","points":0.25},{"type":"mcq","level":"TH","q":"Điều gì xảy ra khi gọi cộng(3) mà hàm cộng(a, b) cần 2 tham số?","options":["A. Báo lỗi thiếu đối số","B. Tự lấy b = 0","C. Vẫn chạy bình thường","D. Trả về 3"],"answer":"A","explain":"Thiếu đối số gây lỗi TypeError.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào SAI về hàm?","options":["A. Hàm phải được gọi trước khi định nghĩa","B. Hàm định nghĩa trước, gọi sau","C. Hàm có thể có nhiều tham số","D. Hàm có thể không có tham số"],"answer":"A","explain":"Phải định nghĩa hàm trước khi gọi; gọi trước định nghĩa gây lỗi.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về return.","statements":["return trả giá trị về nơi gọi.","Gặp return, hàm kết thúc ngay.","Hàm không return thì trả về None.","Mọi hàm đều bắt buộc có return."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: return không bắt buộc.","points":1},{"type":"truefalse","level":"VD","q":"Xét đoạn lệnh: def f(a, b): return a - b. Các phát biểu sau đúng hay sai?","statements":["f(3, 10) cho -7.","f(b = 10, a = 3) cho -7.","f(a = 3, b = 10) cho -7.","f(3) cho -7."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: thiếu đối số b.","points":1},{"type":"short","level":"VD","q":"Đoạn lệnh: def gt(n): kq = 1; for i in range(1, n + 1): kq = kq * i; return kq; rồi in gt(4). In ra bao nhiêu?","answer":"24","explain":"4! = 24.","points":0.5},{"type":"short","level":"NB","q":"Giá trị cụ thể truyền vào hàm khi gọi gọi là gì?","answer":"đối số","explain":"Đối số là giá trị thực tế truyền vào.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"VD","q":"Truyền đối số theo từ khóa (keyword) có lợi ích gì?","options":["A. Không cần nhớ đúng thứ tự tham số, code rõ nghĩa hơn","B. Chạy nhanh hơn","C. Ít lỗi cú pháp hơn","D. Không có lợi ích"],"answer":"A","explain":"Gọi f(b = 10, a = 3) rõ ràng và không phụ thuộc thứ tự.","points":0.25},{"type":"mcq","level":"VDC","q":"Phát biểu nào đúng về truyền tham số trong Python?","options":["A. Số, xâu truyền theo giá trị (không đổi ngoài); danh sách truyền theo tham chiếu (đổi được ngoài)","B. Mọi thứ đều truyền theo giá trị","C. Mọi thứ đều truyền theo tham chiếu","D. Không truyền được danh sách"],"answer":"A","explain":"Kiểu bất biến (int, str) an toàn; kiểu thay đổi được (list) có thể bị hàm sửa.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: def gấp(x): return x * 2; rồi in gấp(gấp(3)). In ra bao nhiêu?","options":["A. 12","B. 6","C. 9","D. Báo lỗi"],"answer":"A","explain":"gấp(3) = 6; gấp(6) = 12.","points":0.25},{"type":"mcq","level":"NB","q":"Tên hàm nên đặt thế nào?","options":["A. Gợi nhớ chức năng, viết thường, theo quy tắc tên biến","B. Tùy ý, càng khó hiểu càng tốt","C. Phải viết hoa","D. Phải là tiếng Anh"],"answer":"A","explain":"Tên hàm tuân quy tắc đặt tên như biến và nên gợi nhớ việc hàm làm.","points":0.25},{"type":"mcq","level":"NB","q":"Tham số của hàm là gì?","options":["A. Biến ghi trong ngoặc đơn khi định nghĩa hàm, nhận giá trị khi gọi","B. Giá trị cụ thể truyền vào khi gọi","C. Tên của hàm","D. Kết quả trả về"],"answer":"A","explain":"Tham số (parameter) là biến hình thức trong định nghĩa; đối số (argument) là giá trị thật truyền vào khi gọi.","points":0.25},{"type":"mcq","level":"TH","q":"Lợi ích của hàm khi cần tính tổng nhiều lần là gì?","options":["A. Viết một lần, gọi nhiều lần với n khác nhau","B. Không có lợi ích","C. Chạy nhanh hơn vòng lặp","D. Tốn ít bộ nhớ hơn"],"answer":"A","explain":"Đóng gói logic vào hàm giúp tái sử dụng linh hoạt.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét đoạn lệnh: def f(x): x = x + 1; return x; a = 5. Các phát biểu sau đúng hay sai?","statements":["f(a) cho 6.","Sau khi gọi, a vẫn là 5.","Tham số x là biến riêng trong hàm.","Gọi f(a) làm a thành 6."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: số truyền theo giá trị, a ngoài không đổi.","points":1},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh đệ quy: def f(n): nếu n == 0 thì return 0 ngược lại return n + f(n - 1). Các phát biểu sau đúng hay sai?","statements":["f(4) cho 10.","Điều kiện n == 0 là điểm dừng.","Thiếu điểm dừng sẽ đệ quy vô hạn.","Đệ quy luôn tốt hơn vòng lặp."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: đệ quy tốn bộ nhớ ngăn xếp, không phải lúc nào cũng tốt hơn.","points":1},{"type":"short","level":"VDC","q":"Đoạn lệnh: def f(a, b = 2, c = 3): return a * b * c; rồi in f(2, c = 4). In ra bao nhiêu?","answer":"16","explain":"2 * 2 * 4 = 16.","points":0.5},{"type":"short","level":"TH","q":"Đoạn lệnh: def mu(a): return a * a; rồi in mu(6). In ra bao nhiêu?","answer":"36","explain":"6 * 6 = 36.","points":0.5}]}]}</script>
