"],"answer":"A","explain":"a[1] là [3, 4]; [3, 4][0] = 3.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn in các phần tử của a = [5, 6, 7] mỗi phần tử một dòng, dùng lệnh nào?","options":["A. for x in a: print(x)","B. print(a)","C. print(a[0])","D. in a"],"answer":"A","explain":"Duyệt và in từng phần tử.","points":0.25},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh loại trùng: a = [2, 7, 1, 8, 2, 8]; b = []; for x in a: nếu x không trong b thì b = b + [x]. Các phát biểu sau đúng hay sai?","statements":["b chỉ nhận các giá trị xuất hiện lần đầu.","Thứ tự xuất hiện được giữ nguyên.","b = [2, 7, 1, 8].","len(b) bằng len(a)."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: b ngắn hơn vì đã loại trùng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về toán tử với danh sách.","statements":["[1, 2] + [3] bằng [1, 2, 3].","[0] * 3 bằng [0, 0, 0].","5 in [2, 5, 8] cho True.","7 in [2, 5, 8] cho True."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: 7 không có trong danh sách.","points":1},{"type":"short","level":"VDC","q":"Đoạn lệnh: s = 0; for i in range(0, 10, 3): s = s + i; sau vòng lặp in s. In ra bao nhiêu?","answer":"18","explain":"0 + 3 + 6 + 9 = 18.","points":0.5},{"type":"short","level":"TH","q":"Cho a = [2, 4, 6, 8], giá trị của a[1:3] là gì? (viết dạng danh sách)","answer":"[4, 6]","explain":"Lấy từ chỉ số 1 đến trước 3.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"TH","q":"Cho a = [5, 6, 7]. Lệnh print(a) in ra gì?","options":["A. [5, 6, 7]","B. 5 6 7","C. 567","D. Báo lỗi"],"answer":"A","explain":"print danh sách in nguyên dạng ngoặc vuông.","points":0.25},{"type":"mcq","level":"NB","q":"Danh sách (list) trong Python là gì?","options":["A. Kiểu dữ liệu lưu trữ dãy có thứ tự các phần tử","B. Một số nguyên duy nhất","C. Một xâu kí tự","D. Một lệnh lặp"],"answer":"A","explain":"List là dãy có thứ tự các phần tử, mỗi phần tử có một vị trí (chỉ số) xác định.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho a = [5, 2, 8, 1, 9]. Đoạn lệnh: for i in range(len(a)): for j in range(i + 1, len(a)): nếu a[i] lớn hơn a[j] thì đổi chỗ. Sau vòng lặp in a. In ra gì?","options":["A. [1, 2, 5, 8, 9]","B. [9, 8, 5, 2, 1]","C. [5, 2, 8, 1, 9]","D. [1, 5, 2, 8, 9]"],"answer":"A","explain":"Sắp xếp chọn: mỗi lần đưa phần tử nhỏ nhất về đầu: [1, 2, 5, 8, 9].","points":0.25},{"type":"mcq","level":"NB","q":"Chỉ số hợp lệ của danh sách có n phần tử là khoảng nào?","options":["A. Từ 0 đến n - 1","B. Từ 1 đến n","C. Từ 0 đến n","D. Từ -1 đến n"],"answer":"A","explain":"Chỉ số bắt đầu từ 0 nên phần tử cuối có chỉ số n - 1.","points":0.25},{"type":"mcq","level":"VD","q":"Cho a = [10, 20, 30]. Lệnh a[1:2] = [25, 26] cho a bằng gì?","options":["A. [10, 25, 26, 30]","B. [10, 20, 30]","C. [25, 26]","D. Báo lỗi"],"answer":"A","explain":"Gán lát cắt thay đoạn [20] bằng [25, 26].","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: a = [2, 9, 4, 7]; lon = a[0]; for x in a: nếu x lớn hơn lon thì lon = x; sau vòng lặp in lon. In ra bao nhiêu?","options":["A. 9","B. 7","C. 4","D. 2"],"answer":"A","explain":"Giá trị lớn nhất trong danh sách là 9.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét đoạn lệnh đảo ngược: a = [5, 1, 4]; for i in range(len(a) // 2): đổi a[i] và a[len(a)-1-i]. Các phát biểu sau đúng hay sai?","statements":["Vòng lặp chạy 1 lần (3 // 2 = 1).","Đổi a[0] và a[2].","Sau vòng lặp a = [4, 1, 5].","Phần tử giữa không cần đổi."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biểu sau.","statements":["Gán a[1] = 8 thay đổi phần tử thứ hai.","Chỉ số âm đếm từ cuối danh sách.","a[-1] là phần tử cuối cùng.","Truy cập chỉ số vượt phạm vi báo lỗi."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"short","level":"NB","q":"Cho a = [4, 9, 2], giá trị của a[-1] là bao nhiêu?","answer":"2","explain":"a[-1] là phần tử cuối: 2.","points":0.5},{"type":"short","level":"VD","q":"Đoạn lệnh: s = 0; for x in [4, 8, 2]: s = s + x; sau vòng lặp in s. In ra bao nhiêu?","answer":"14","explain":"4 + 8 + 2 = 14.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"TH","q":"Muốn sao chép danh sách a thành danh sách mới độc lập, cách đúng là?","options":["A. b = a.copy() hoặc b = a[:]","B. b = a","C. b = [a]","D. Không sao chép được"],"answer":"A","explain":"a.copy() (hoặc cắt a[:]) tạo danh sách mới độc lập; b = a chỉ tạo thêm tên trỏ cùng vùng nhớ.","points":0.25},{"type":"mcq","level":"NB","q":"len([4, 7, 2, 9]) bằng bao nhiêu?","options":["A. 4","B. 22","C. 3","D. 0"],"answer":"A","explain":"Danh sách có 4 phần tử.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho a = [2, 7, 1, 8, 2, 8]. Đoạn lệnh loại trùng giữ thứ tự: b = []; for x in a: nếu x không trong b thì b = b + [x]; sau vòng lặp in b. In ra gì?","options":["A. [2, 7, 1, 8]","B. [2, 7, 1, 8, 2, 8]","C. [1, 2, 7, 8]","D. [8, 2, 1, 7]"],"answer":"A","explain":"Chỉ thêm x chưa có trong b: [2, 7, 1, 8].","points":0.25},{"type":"mcq","level":"TH","q":"Biểu thức 7 in [2, 5, 8] cho giá trị gì?","options":["A. False","B. True","C. 7","D. Báo lỗi"],"answer":"A","explain":"7 không có trong danh sách nên False.","points":0.25},{"type":"mcq","level":"NB","q":"Cú pháp tạo danh sách trong Python dùng cặp dấu nào?","options":["A. Dấu ngoặc vuông [ ]","B. Dấu ngoặc đơn ( )","C. Dấu ngoặc nhọn { }","D. Dấu nháy kép"],"answer":"A","explain":"Danh sách viết trong cặp ngoặc vuông, các phần tử cách nhau bởi dấu phẩy: [1, 2, 3].","points":0.25},{"type":"mcq","level":"VD","q":"Cho a = [3, 6, 9, 12]. Giá trị của a[-3] là gì?","options":["A. 6","B. 9","C. 3","D. 12"],"answer":"A","explain":"a[-3] là phần tử thứ ba từ cuối: 6.","points":0.25},{"type":"truefalse","level":"TH","q":"Cho a = [4, 8, 15, 16]. Xét các phát biểu.","statements":["a[1] + a[3] bằng 24.","len(a) bằng 4.","a[1:3] bằng [8, 15].","a[4] bằng 0."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: chỉ số 4 v ưa có phần tử nào).","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [1, 2, 3]. Lệnh a[3] = 4 sẽ thế nào?","options":["A. Báo lỗi vì chỉ số 3 vượt phạm vi","B. Thêm 4 vào cuối","C. a thành [1, 2, 3, 4]","D. Không có gì"],"answer":"A","explain":"Gán qua chỉ số chỉ sửa phần tử đã có; muốn thêm phải dùng append().","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: a = [8, 3, 10, 2]; nho = a[0]; for x in a: nếu x nhỏ hơn nho thì nho = x; sau vòng lặp in nho. In ra bao nhiêu?","options":["A. 2","B. 10","C. 8","D. 3"],"answer":"A","explain":"Giá trị nhỏ nhất là 2.","points":0.25},{"type":"mcq","level":"TH","q":"Cho a = [2, 4, 6, 8]. Đoạn lệnh: s = 0; for i in range(len(a)): s = s + a[i]; sau vòng lặp in s. In ra bao nhiêu?","options":["A. 20","B. 10","C. 2468","D. 4"],"answer":"A","explain":"Duyệt theo chỉ số 0..3, cộng dồn: 2+4+6+8 = 20.","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: a = [10, 20, 30, 40, 50]; s = 0; for i in range(len(a)): s = s + a[i] * i; sau vòng lặp in s. In ra bao nhiêu?","options":["A. 400","B. 300","C. 150","D. 200"],"answer":"A","explain":"s = 10*0+20*1+30*2+40*3+50*4 = 0+20+60+120+200 = 400.","points":0.25},{"type":"mcq","level":"NB","q":"Chỉ số của phần tử đầu tiên trong danh sách Python là gì?","options":["A. 0","B. 1","C. -1","D. Tùy ý"],"answer":"A","explain":"Python đánh chỉ số từ 0: phần tử đầu tiên có chỉ số 0.","points":0.25},{"type":"truefalse","level":"VD","q":"Cho m = [[1, 2], [3, 4]]. Xét các phát biểu.","statements":["m[0] là [1, 2].","m[1][1] bằng 4.","len(m) bằng 2.","Danh sách có thể chứa danh sách."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về danh sách.","statements":["Danh sách viết trong cặp ngoặc vuông.","Các phần tử cách nhau bởi dấu phẩy.","Phần tử đầu tiên có chỉ số 0.","len() cho biết số phần tử của danh sách."],"answer":["T","T","T","T"],"explain":"Cả bốn đều đúng.","points":1},{"type":"short","level":"VD","q":"Cho a = [5, 5, 5], biểu thức a[0] + a[1] + a[2] bằng bao nhiêu?","answer":"15","explain":"5 + 5 + 5 = 15.","points":0.5},{"type":"short","level":"NB","q":"Chỉ số của phần tử đầu tiên trong danh sách là bao nhiêu?","answer":"0","explain":"Python đánh chỉ số từ 0.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"TH","q":"Khi viết đoạn lệnh tìm giá trị lớn nhất của danh sách a, cách khởi tạo biến lon nào sau đây đúng nhất?","options":["A. lon = a[0]","B. lon = 0","C. lon = 999","D. lon = \"\""],"answer":"A","explain":"Khởi tạo bằng phần tử đầu tiên rồi so sánh với các phần tử còn lại (đúng cả khi mọi số đều âm).","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: a = [3, 1, 4, 1, 5, 9, 2, 6]; s = 0; for i in range(0, len(a), 2): s = s + a[i]; sau vòng lặp in s. In ra bao nhiêu?","options":["A. 14","B. 21","C. 10","D. 35"],"answer":"A","explain":"Các phần tử chỉ số chẵn: 3, 4, 5, 2; tổng = 14.","points":0.25},{"type":"mcq","level":"NB","q":"Đoạn lệnh: s = 0; for x in [2, 5, 3]: s = s + x; sau vòng lặp in s. In ra bao nhiêu?","options":["A. 10","B. 6","C. 253","D. 0"],"answer":"A","explain":"s = 2 + 5 + 3 = 10.","points":0.25},{"type":"mcq","level":"NB","q":"Danh sách trong Python là kiểu dữ liệu có thể thay đổi được (mutable) nghĩa là gì?","options":["A. Có thể thêm, sửa, xóa phần tử sau khi tạo","B. Không bao giờ thay đổi","C. Chỉ đọc một lần","D. Tự xóa sau khi dùng"],"answer":"A","explain":"List là mutable: cho phép thay đổi nội dung (gán qua chỉ số, thêm, xóa...).","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: a = [2, 4, 6]; b = [1, 3]; c = a + b; sau đó in len(c). In ra bao nhiêu?","options":["A. 5","B. 6","C. 2","D. 21"],"answer":"A","explain":"c = [2, 4, 6, 1, 3] có 5 phần tử.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: a = [1, 2, 3]; b = a; b[0] = 99. Giá trị của a[0] là gì?","options":["A. 99","B. 1","C. 0","D. Báo lỗi"],"answer":"A","explain":"b = a làm hai tên cùng trỏ tới một danh sách nên đổi qua b cũng đổi a.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét đoạn lệnh: s = 0; for x in [3, 1, 4]: s = s + x. Các phát biểu sau đúng hay sai?","statements":["x lần lượt là 3, 1, 4.","s cộng dồn các phần tử.","Sau vòng lặp s = 8.","Vòng lặp chạy 4 lần."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: danh sách có 3 phần tử nên lặp 3 lần.","points":1},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh: a = [[0] * 3] * 2; a[0][0] = 5. Các phát biểu sau đúng hay sai?","statements":["Hai hàng cùng trỏ tới một danh sách.","Sửa a[0][0] làm cả hai hàng đổi.","a thành [[5, 0, 0], [5, 0, 0]].","Cách tạo này an toàn cho ma trận."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: đây là bẫy tham chiếu kinh điển, nên dùng list comprehension.","points":1},{"type":"short","level":"TH","q":"len([1, 2, 3, 4, 5, 6]) bằng bao nhiêu?","answer":"6","explain":"Danh sách có 6 phần tử.","points":0.5},{"type":"short","level":"VDC","q":"Cho a = [3, 1, 4, 1, 5], sau khi sắp xếp tăng dần thì a[0] bằng bao nhiêu?","answer":"1","explain":"Sắp xếp: [1, 1, 3, 4, 5], phần tử đầu là 1.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"TH","q":"Biểu thức 5 in [2, 5, 8] cho giá trị gì?","options":["A. True","B. False","C. 5","D. Báo lỗi"],"answer":"A","explain":"Toán tử in kiểm tra sự tồn tại: 5 có trong danh sách nên True.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho a = [4, 1, 7, 3]. Muốn chèn số 5 vào đúng vị trí để danh sách đã sắp xếp [1, 3, 4, 7] vẫn có thứ tự, vị trí chèn là chỉ số nào?","options":["A. 3","B. 2","C. 4","D. 1"],"answer":"A","explain":"Danh sách sắp xếp [1,3,4,7]; 5 nằm giữa 4 (chỉ số 2) và 7 (chỉ số 3) nên chèn tại chỉ số 3.","points":0.25},{"type":"mcq","level":"NB","q":"Danh sách [3, 1, 4, 1, 5] có bao nhiêu phần tử?","options":["A. 5","B. 4","C. 3","D. 15"],"answer":"A","explain":"Đếm các phần tử cách nhau bởi dấu phẩy: có 5 phần tử.","points":0.25},{"type":"mcq","level":"TH","q":"Danh sách a = [1, 2, 3]; lệnh a = a + [4, 5] cho a bằng gì?","options":["A. [1, 2, 3, 4, 5]","B. [1, 2, 3, [4, 5]]","C. 15","D. Báo lỗi"],"answer":"A","explain":"Phép + nối hai danh sách thành một.","points":0.25},{"type":"mcq","level":"NB","q":"Cho a = [\"An\", \"Bình\", \"Chi\"]. Giá trị của a[1] là gì?","options":["A. Bình","B. An","C. Chi","D. 1"],"answer":"A","explain":"Phần tử chỉ số 1 là \"Bình\".","points":0.25},{"type":"mcq","level":"VD","q":"Cho a = [5, 1, 4]. Đoạn lệnh đảo ngược: for i in range(len(a) // 2): đổi a[i] và a[len(a)-1-i]; sau vòng lặp in a. In ra gì?","options":["A. [4, 1, 5]","B. [1, 4, 5]","C. [5, 1, 4]","D. [4, 5, 1]"],"answer":"A","explain":"Đổi cặp đối xứng qua tâm: [4, 1, 5].","points":0.25},{"type":"truefalse","level":"NB","q":"Cho a = [10, 20, 30]. Xét các phát biểu.","statements":["a[0] bằng 10.","a[2] bằng 30.","a[-1] bằng 30.","a[3] bằng 40."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: chỉ số 3 vượt phạm vi (báo lỗi).","points":1},{"type":"truefalse","level":"VD","q":"Cho a = [10, 20, 30, 40]. Xét các phát biểu.","statements":["a[-2] bằng 30.","a[::2] bằng [10, 30].","a[::-1] đảo ngược danh sách.","a[-5] hợp lệ."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: chỉ số -5 vượt phạm vi.","points":1},{"type":"short","level":"VD","q":"Cho a = [[1, 2], [3, 4]], giá trị của a[0][1] là bao nhiêu?","answer":"2","explain":"Hàng 0 là [1, 2], phần tử 1 là 2.","points":0.5},{"type":"short","level":"NB","q":"Danh sách trong Python được viết trong cặp dấu nào?","answer":"ngoặc vuông","explain":"Danh sách viết trong cặp ngoặc vuông [ ].","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"VD","q":"Cho a = [1, 2, 3, 4, 5]. Lệnh b = a[::-1] cho b bằng gì?","options":["A. [5, 4, 3, 2, 1]","B. [1, 2, 3, 4, 5]","C. [1, 3, 5]","D. Báo lỗi"],"answer":"A","explain":"Bước -1 đảo ngược danh sách.","points":0.25},{"type":"mcq","level":"NB","q":"Các phần tử của một danh sách có bắt buộc cùng kiểu dữ liệu không?","options":["A. Không, có thể trộn nhiều kiểu","B. Có, bắt buộc cùng kiểu","C. Chỉ được số","D. Chỉ được xâu"],"answer":"A","explain":"Python cho phép danh sách chứa phần tử nhiều kiểu khác nhau, ví dụ [1, \"a\", 2.5].","points":0.25},{"type":"mcq","level":"NB","q":"Sau lệnh a[1] = 8 với a = [5, 7, 9], danh sách a là gì?","options":["A. [5, 8, 9]","B. [8, 7, 9]","C. [5, 7, 8]","D. [5, 7, 9, 8]"],"answer":"A","explain":"Phần tử chỉ số 1 (số 7) được thay bằng 8.","points":0.25},{"type":"mcq","level":"VDC","q":"Phát biểu nào đúng về danh sách lồng nhau?","options":["A. Phần tử của danh sách có thể là danh sách khác","B. Danh sách không chứa được danh sách","C. Chỉ lồng được 2 tầng","D. Danh sách lồng nhau báo lỗi"],"answer":"A","explain":"List có thể chứa list, tạo cấu trúc nhiều chiều như ma trận.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: a = [3, 1, 4]; s = 0; for x in a: s = s + x; sau vòng lặp in s. In ra bao nhiêu?","options":["A. 8","B. 7","C. 314","D. 3"],"answer":"A","explain":"Tổng các phần tử: 3+1+4 = 8.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu thức [0] * 4 cho kết quả gì?","options":["A. [0, 0, 0, 0]","B. [0]","C. 0","D. Báo lỗi"],"answer":"A","explain":"Phép * lặp danh sách 4 lần.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về cắt lát danh sách.","statements":["a[1:3] lấy từ chỉ số 1 đến trước 3.","a[:2] lấy hai phần tử đầu.","a[2:] lấy từ chỉ số 2 đến hết.","a[1:3] bao gồm cả phần tử chỉ số 3."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: lát cắt dừng trước chỉ số cuối.","points":1},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh sắp xếp chọn: a = [5, 2, 8, 1, 9]; for i in range(len(a)): for j in range(i+1, len(a)): nếu a[i] lớn hơn a[j] thì đổi chỗ. Các phát biểu sau đúng hay sai?","statements":["Sau vòng lặp a tăng dần.","Mỗi i đưa phần tử nhỏ nhất về vị trí i.","Kết quả a = [1, 2, 5, 8, 9].","Thuật toán này gọi là sắp xếp nổi bọt."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: đây là sắp xếp chọn (selection sort), không phải nổi bọt.","points":1},{"type":"short","level":"TH","q":"Cho a = [3, 6, 9], sau lệnh a[0] = 30 thì a[0] bằng bao nhiêu?","answer":"30","explain":"Phần tử đầu được thay bằng 30.","points":0.5},{"type":"short","level":"VDC","q":"Cho a = [2, 4], b = a; b = b + [6]. Giá trị của a là gì? (viết dạng danh sách)","answer":"[2, 4]","explain":"b + [6] tạo danh sách MỚI gán cho b, a không đổi.","points":0.5}]}]}</script>
