{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Để kết nối điện thoại với mạng wifi, cần","options":["A. Bật wifi, chọn tên mạng và nhập mật khẩu","B. Tắt nguồn điện thoại","C. Tháo sim ra","D. Gọi tổng đài"],"answer":"A","explain":"Các bước kết nối wifi: bật wifi → chọn tên mạng (SSID) → nhập mật khẩu → kết nối.","points":0.25},{"type":"mcq","level":"NB","q":"Bluetooth dùng để","options":["A. Kết nối không dây ở cự li gần giữa các thiết bị","B. Nấu ăn","C. Sạc pin nhanh","D. Gọi điện thoại"],"answer":"A","explain":"Bluetooth kết nối không dây tầm gần: tai nghe, loa, chia sẻ file giữa điện thoại.","points":0.25},{"type":"mcq","level":"NB","q":"Khi điện thoại báo đầy bộ nhớ, cách xử lí hợp lí là","options":["A. Xóa ảnh, video không cần thiết hoặc chuyển lên đám mây","B. Đập máy mua máy mới","C. Tắt nguồn","D. Tháo pin ra"],"answer":"A","explain":"Giải phóng bộ nhớ bằng cách xóa dữ liệu thừa hoặc sao lưu lên đám mây.","points":0.25},{"type":"mcq","level":"TH","q":"Để bảo vệ dữ liệu quan trọng trên điện thoại, nên","options":["A. Sao lưu định kì lên đám mây hoặc máy tính","B. Không bao giờ sạc pin","C. Để máy hết pin","D. Xóa hết dữ liệu"],"answer":"A","explain":"Sao lưu định kì giúp khôi phục dữ liệu khi mất máy hoặc hỏng máy.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn An muốn gửi một video 500 MB cho bạn qua ứng dụng nhắn tin nhưng bị giới hạn 100 MB. Cách tốt nhất là","options":["A. Chia nhỏ video thành nhiều phần","B. Nén video hoặc tải lên đám mây rồi gửi liên kết","C. Bỏ không gửi","D. Gửi từng ảnh chụp màn hình"],"answer":"B","explain":"Nén video giảm dung lượng; tải lên đám mây rồi chia sẻ link là cách phổ biến và tiện lợi.","points":0.25},{"type":"mcq","level":"VDC","q":"Máy tính của bạn chạy chậm, hay hiện quảng cáo lạ. Nguyên nhân có thể nhất và cách xử lí là","options":["A. Máy cũ, nên mua máy mới","B. Có thể nhiễm phần mềm độc hại: quét virus bằng phần mềm diệt virus uy tín, gỡ ứng dụng lạ","C. Do mạng yếu","D. Do hết pin"],"a ng, nên","options":["A. Cài ngay không cần xem","B. Xem đánh giá, lượt tải và quyền ứng dụng yêu cầu","C. Tắt mạng","D. Xóa hết ứng dụng khác"],"answer":"B","explain":"Kiểm tra đánh giá và quyền truy cập giúp tránh ứng dụng độc hại.","points":0.25},{"type":"mcq","level":"TH","q":"Khi ứng dụng yêu cầu quyền truy cập danh bạ, vị trí một cách bất thường, nên","options":["A. Đồng ý ngay","B. Từ chối hoặc gỡ ứng dụng, tìm ứng dụng thay thế uy tín","C. Tắt máy","D. Cho mượn điện thoại"],"answer":"B","explain":"Ứng dụng xin quyền quá mức có thể thu thập dữ liệu trái phép.","points":0.25},{"type":"mcq","level":"VDC","q":"Điện thoại của bạn hết dung lượng nhưng có nhiều ảnh kỉ niệm không muốn xóa. Giải pháp tối ưu là","options":["A. Xóa bớt ảnh","B. Sao lưu ảnh gốc lên đám mây, giữ bản nhẹ trên máy hoặc xóa bản trên máy","C. Mua điện thoại mới","D. Không chụp ảnh nữa"],"answer":"B","explain":"Sao lưu đám mây giữ ảnh gốc an toàn, giải phóng bộ nhớ máy.","points":0.25},{"type":"mcq","level":"TH","q":"Để tìm một file đã tải về trên điện thoại Android, mở ứng dụng","options":["A. Quản lí file (File Manager)","B. Máy tính","C. Đồng hồ","D. Danh bạ"],"answer":"A","explain":"Ứng dụng quản lí file giúp tìm, sắp xếp, xóa file trên thiết bị.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về cài đặt ứng dụng an toàn:","statements":["a) Nên tải ứng dụng từ cửa hàng chính thức","b) Nên đọc đánh giá trước khi cài","c) Ứng dụng lạ xin nhiều quyền nên cảnh giác","d) Càng cài nhiều ứng dụng lạ càng tốt"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Máy tính xuất hiện nhiều quảng cáo dù không mở trình duyệt. Các phát biểu:","statements":["a) Có thể máy đã nhiễm phần mềm quảng cáo","b) Nên quét bằng phần mềm diệt virus uy tín","c) Nên gỡ các chương trình lạ mới cài gần đây","d) Cứ để vậy cũng không sao"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cần xử lí để t :"Chuẩn bị pin, file offline và thử kết nối tránh sự cố khi thuyết trình.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nhóm học sinh cần cộng tác làm video dự án. Cách làm việc hiệu quả là","options":["A. Mỗi người làm riêng rồi ghép","B. Dùng thư mục chia sẻ trên đám mây, phân công rõ ràng và cập nhật tiến độ","C. Chỉ một người làm","D. Gửi file qua tin nhắn từng phần"],"answer":"B","explain":"Thư mục chia sẻ giúp mọi người cùng truy cập, tránh nhầm phiên bản.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về sử dụng điện thoại:","statements":["a) Nên sạc bằng sạc chính hãng","b) Tránh vừa sạc vừa dùng để bảo vệ pin","c) Có thể dùng sạc không rõ nguồn gốc thoải mái","d) Nên giảm độ sáng màn hình để tiết kiệm pin"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: sạc kém chất lượng gây nguy hiểm. d) Đúng.","points":1},{"type":"truefalse","level":"VD","q":"Bạn Lan làm mất điện thoại. Các phát biểu:","statements":["a) Nếu đã sao lưu đám mây thì dữ liệu vẫn an toàn","b) Có thể dùng tính năng tìm thiết bị từ xa","c) Nên đổi mật khẩu các tài khoản quan trọng","d) Không cần làm gì vì máy có mật khẩu"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: định vị, khóa, xóa từ xa. c) Đúng: phòng kẻ gian. d) Sai: cần chủ động bảo vệ.","points":1},{"type":"short","level":"TH","q":"Chế độ tắt mọi kết nối không dây khi đi máy bay gọi là chế độ gì?","answer":"chế độ máy bay","explain":"Chế độ máy bay (airplane mode).","points":0.5},{"type":"short","level":"VD","q":"Tính năng giúp tìm, khóa hoặc xóa dữ liệu điện thoại từ xa khi bị mất gọi là gì?","answer":"tìm thiết bị","explain":"Tính năng tìm thiết bị (Find My Device) giúp bảo vệ dữ liệu khi mất máy.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Để tra cứu đường đi, người dùng có thể dùng","options":["A. Ứng dụng bản đồ số","B. Máy tính bỏ túi","C. Đồng hồ","D. Đèn pin"],"answer":"A","explain":"Ứng dụng bản đồ số chỉ đường, tìm địa điểm, ước tính el":"VDC","q":"Một lớp tổ chức dã ngoại, cần dùng thiết bị số hỗ trợ. Các phát biểu:","statements":["a) Bản đồ offline giúp di chuyển khi mất sóng","b) Nên mang sạc dự phòng","c) Chia sẻ vị trí giúp nhóm không bị lạc","d) Không cần chuẩn bị gì về thiết bị"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cần chuẩn bị kĩ.","points":1},{"type":"short","level":"NB","q":"Ứng dụng giúp tìm đường, xem bản đồ trên điện thoại thường được gọi là gì?","answer":"bản đồ số","explain":"Bản đồ số (digital map).","points":0.5},{"type":"short","level":"VDC","q":"Loại file tài liệu giữ nguyên định dạng trên mọi thiết bị, thường dùng để nộp bài, có tên là gì?","answer":"PDF","explain":"PDF giữ nguyên bố cục trên mọi thiết bị.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Mật khẩu mạnh nên","options":["A. Dài, gồm chữ hoa, chữ thường, số và kí tự đặc biệt","B. Là ngày sinh","C. Là tên mình","D. Là “123456”"],"answer":"A","explain":"Mật khẩu mạnh khó đoán, chống dò tìm.","points":0.25},{"type":"mcq","level":"NB","q":"Xác thực hai yếu tố (2FA) là","options":["A. Đăng nhập bằng hai mật khẩu","B. Ngoài mật khẩu còn cần mã xác nhận gửi về điện thoại","C. Đăng nhập hai lần","D. Dùng hai điện thoại"],"answer":"B","explain":"2FA thêm một lớp bảo vệ: mã OTP gửi về điện thoại hoặc ứng dụng.","points":0.25},{"type":"mcq","level":"TH","q":"Khi dùng chung máy tính ở quán net, sau khi xong việc nên","options":["A. Đăng xuất mọi tài khoản và xóa lịch sử duyệt web","B. Để nguyên cho tiện lần sau","C. Lưu mật khẩu trên máy","D. Tắt màn hình là đủ"],"answer":"A","explain":"Đăng xuất và xóa dữ liệu tránh người khác truy cập tài khoản của mình.","points":0.25},{"type":"mcq","level":"TH","q":"Dấu hiệu của một trang web lừa đảo có thể là","options":["A. Tên miền lạ, yêu cầu nhập thông tin cá nhân, ngân hàng","B. Giao diện đẹp","C. Tải nhanh","D. Có nhiều ảnh"],"answer":"A","explain":"Trang giả mạo thường có tên miền gần giống trang thật và dụ nhập thông tin nhạy cảm.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn nhận tin nhắn “tài khoản ngân hàng bị khóa, bấm link để mở”. Hành động đúng là","options":["A. Bấm link ngay","B. Không bấm link; liên hệ ngân hàng qua kênh chính thức để kiểm tra","C. Chuyển tiền cho người gửi","D. Cung cấp mã OTP"],"answer":"B","explain":"Ngân hàng không bao giờ yêu cầu thông tin qua link lạ; đây là lừa đảo.","points":0.25},{"type":"mcq","level":"VDC","q":"Một bạn dùng chung một mật khẩu cho mọi tài khoản. Rủi ro lớn nhất là","options":["A. Khó nhớ","B. Một tài khoản bị lộ thì mọi tài khoản đều bị đe dọa","C. Mật khẩu quá dài","D. Không có rủi ro"],"answer":"B","explain":"Dùng chung mật khẩu khiến một vụ rò rỉ ảnh hưởng dây chuyền mọi tài khoản.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về mật khẩu:","statements":["a) Mật khẩu mạnh gồm chữ hoa, chữ thường, số và kí tự đặc biệt","b) Không nên dùng ngày sinh làm mật khẩu","c) Nên dùng chung một mật khẩu cho mọi tài khoản","d) Nên đổi mật khẩu định kì"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về an toàn khi dùng mạng:","statements":["a) Không bấm vào liên kết lạ trong tin nhắn","b) Kiểm tra kĩ tên miền trang web trước khi nhập mật khẩu","c) Wifi công cộng không an toàn cho giao dịch ngân hàng","d) Mọi wifi miễn phí đều an toàn"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: dễ bị nghe lén. d) Sai.","points":1},{"type":"short","level":"TH","q":"Mã xác nhận một lần gửi về điện thoại khi đăng nhập thường được gọi là mã gì?","answer":"OTP","explain":"OTP (One-Time Password) là mã dùng một lần.","points":0.5},{"type":"short","level":"VD","q":"Hình thức đăng nhập cần cả mật khẩu và mã xác nhận gửi về điện thoại gọi là gì?","answer":"xác thực hai yếu tố","explain":"Xác thực hai yếu tố (2FA) tăng cường bảo mật.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Để chia sẻ ảnh cho nhiều người cùng xem, cách tiện lợi là","options":["A. Tạo album chia sẻ trên đám mây và gửi liên kết","B. Gửi từng ảnh qua tin nhắn cho từng người","C. In ảnh ra giấy","D. Đọc mô tả ảnh"],"answer":"A","explain":"Album chia sẻ trên đám mây giúp nhiều người cùng xem, tiết kiệm thời gian.","points":0.25},{"type":"mcq","level":"TH","q":"Khi học nhóm trực tuyến, cần chuẩn bị","options":["A. Không cần gì","B. Thiết bị có camera, micro, mạng ổn định và tài liệu","C. Chỉ cần điện thoại hết pin","D. Ngồi nơi ồn ào"],"answer":"B","explain":"Học trực tuyến cần thiết bị đầy đủ, mạng ổn định và môi trường yên tĩnh.","points":0.25},{"type":"mcq","level":"TH","q":"Để ghi lại ý tưởng nhanh khi đang di chuyển, có thể","options":["A. Dùng ứng dụng ghi chú hoặc ghi âm trên điện thoại","B. Nhớ trong đầu","C. Viết lên tay","D. Để hôm sau"],"answer":"A","explain":"Ứng dụng ghi chú, ghi âm giúp lưu ý tưởng nhanh chóng mọi lúc.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn cần nộp bài tập là file Word cho thầy cô qua email. Thao tác đúng là","options":["A. Soạn email, đính kèm file, kiểm tra lại rồi gửi","B. Chụp ảnh màn hình bài làm","C. Gửi link trang web bất kì","D. Nhắn tin báo đã làm xong"],"answer":"A","explain":"Đính kèm file vào email, kiểm tra đúng file và địa chỉ người nhận trước khi gửi.","points":0.25},{"type":"mcq","level":"VDC","q":"Một sự kiện của trường cần livestream cho phụ huynh xem. Nhóm kĩ thuật cần chuẩn bị","options":["A. Điện thoại là đủ","B. Thiết bị quay, mạng ổn định, pin/sạc dự phòng, thử nghiệm trước và người điều phối","C. Không cần thử trước","D. Chỉ cần micro"],"answer":"B","explain":"Livestream cần đồng bộ nhiều yếu tố: thiết bị, mạng, nguồn điện và diễn tập.","points":0.25},{"type":"mcq","level":"VDC","q":"Ổ cứng máy tính gần đầy, máy chạy chậm. Cách xử lí toàn diện là","options":["A. Xóa hết mọi thứ","B. Dọn file rác, gỡ phần mềm không dùng, chuyển dữ liệu ít dùng lên đám mây hoặc ổ ngoài","C. Mua máy mới ngay","D. Cài thêm nhiều phần mềm"],"answer":"B","explain":"Dọn dẹp có chọn lọc và chuyển dữ liệu ít dùng đi nơi khác giúp máy nhẹ mà không mất dữ liệu.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về học tập với thiết bị số:","statements":["a) Có thể tra cứu tài liệu nhanh bằng điện thoại","b) Có thể ghi âm bài giảng để ôn lại","c) Có thể học trực tuyến với thầy cô ở xa","d) Thiết bị số không giúp ích cho học tập"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về chia sẻ file:","statements":["a) Nên kiểm tra nội dung file trước khi chia sẻ","b) File lớn nên nén hoặc dùng liên kết đám mây","c) Có thể chia sẻ mọi file cho mọi người","d) Cần tôn trọng bản quyền khi chia sẻ"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: file riêng tư, có bản quyền không được chia sẻ bừa. d) Đúng.","points":1},{"type":"short","level":"NB","q":"Thao tác đính kèm file vào thư điện tử thường được gọi là gì?","answer":"đính kèm","explain":"Đính kèm (attach) file vào email.","points":0.5},{"type":"short","level":"VDC","q":"Việc phát video trực tiếp lên mạng cho nhiều người xem cùng lúc gọi là gì?","answer":"livestream","explain":"Livestream là phát trực tiếp.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Khi điện thoại bị đơ, cách xử lí đầu tiên nên thử là","options":["A. Khởi động lại máy","B. Đập máy","C. Tháo sim","D. Mang đi sửa ngay"],"answer":"A","explain":"Khởi động lại giải phóng bộ nhớ, khắc phục hầu hết lỗi treo tạm thời.","points":0.25},{"type":"mcq","level":"TH","q":"Ứng dụng bị treo liên tục, cách xử lí là","options":["A. Xóa ứng dụng ngay","B. Xóa bộ nhớ đệm của ứng dụng hoặc cập nhật/gỡ cài đặt lại","C. Mua điện thoại mới","D. Tắt nguồn vĩnh viễn"],"answer":"B","explain":"Xóa cache hoặc cài đặt lại thường khắc phục lỗi ứng dụng.","points":0.25},{"type":"mcq","level":"VD","q":"Wifi nhà bạn yếu ở phòng học trên tầng. Cách cải thiện là","options":["A. Chịu đựng","B. Đặt router ở vị trí trung tâm, thoáng; có thể dùng bộ kích sóng","C. Tắt wifi","D. Dùng dữ liệu di động mãi"],"answer":"B","explain":"Vị trí router ảnh hưởng lớn đến sóng; bộ kích sóng mở rộng vùng phủ.","points":0.25},{"type":"mcq","level":"TH","q":"Bạn quên mật khẩu wifi nhà mình. Cách lấy lại hợp lí là","options":["A. Đoán mò","B. Xem mật khẩu đã lưu trên thiết bị từng kết nối hoặc hỏi người quản trị mạng","C. Hack wifi","D. Dùng chùa wifi hàng xóm"],"answer":"B","explain":"Thiết bị đã kết nối có thể xem lại mật khẩu đã lưu; hoặc hỏi chủ mạng.","points":0.25},{"type":"mcq","level":"VDC","q":"Một cửa hàng cần wifi ổn định cho 50 khách cùng lúc. Giải pháp đúng là","options":["A. Dùng một router gia đình cũ","B. Dùng thiết bị phát wifi chuyên dụng chịu tải cao, đặt mật khẩu và giới hạn băng thông","C. Không đặt mật khẩu","D. Tắt wifi giờ cao điểm"],"answer":"B","explain":"Môi trường đông người cần thiết bị chuyên dụng, quản lí băng thông và bảo mật.","points":0.25},{"type":"mcq","level":"VDC","q":"Để bảo vệ trẻ nhỏ khi dùng thiết bị số, phụ huynh nên","options":["A. Cấm hoàn toàn","B. Bật chế độ kiểm soát của phụ huynh, giới hạn thời gian và hướng dẫn sử dụng an toàn","C. Cho dùng thoải mái","D. Không quan tâm"],"answer":"B","explain":"Kiểm soát của phụ huynh lọc nội dung, giới hạn thời gian; kết hợp hướng dẫn mới hiệu quả.","points":0.25},{"type":"truefalse","level":"VD","q":"Điện thoại nhanh hết pin bất thường. Các phát biểu:","statements":["a) Có thể do ứng dụng chạy ngầm nhiều","b) Có thể do pin đã chai","c) Nên kiểm tra mức tiêu thụ pin của từng ứng dụng","d) Cách duy nhất là mua máy mới"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: có nhiều cách khắc phục.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về khắc phục sự cố đơn giản:","statements":["a) Khởi động lại khắc phục nhiều lỗi tạm thời","b) Cập nhật phần mềm giúp sửa lỗi","c) Mọi sự cố đều phải mang ra tiệm","d) Nên tìm hiểu hướng dẫn trước khi tự sửa phần cứng"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: nhiều lỗi tự xử lí được. d) Đúng.","points":1},{"type":"short","level":"TH","q":"Thao tác tắt máy rồi bật lại để khắc phục lỗi tạm thời gọi là gì?","answer":"khởi động lại","explain":"Khởi động lại (restart) thiết bị.","points":0.5},{"type":"short","level":"VD","q":"Thiết bị giúp mở rộng vùng phủ sóng wifi trong nhà gọi là gì?","answer":"bộ kích sóng","explain":"Bộ kích sóng (repeater) mở rộng vùng phủ wifi.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Để xem lại mật khẩu wifi đã lưu trên điện thoại, cần","options":["A. Vào cài đặt wifi, chọn mạng và xem chi tiết","B. Gọi tổng đài","C. Không thể xem lại","D. Đặt lại máy"],"answer":"A","explain":"Điện thoại cho phép xem lại mật khẩu của mạng đã kết nối trong phần cài đặt.","points":0.25},{"type":"mcq","level":"NB","q":"Khi mua điện thoại cũ, cần kiểm tra","options":["A. Chỉ cần giá rẻ","B. Ngoại hình, pin, các chức năng cơ bản và tài khoản đã đăng xuất","C. Màu sắc","D. Hộp đựng"],"answer":"B","explain":"Kiểm tra kĩ phần cứng, pin và đảm bảo máy đã thoát tài khoản chủ cũ tránh bị khóa.","points":0.25},{"type":"mcq","level":"TH","q":"Để điện thoại phát wifi cho laptop dùng (phát điểm truy cập), cần","options":["A. Bật tính năng điểm phát sóng trên điện thoại và kết nối laptop vào","B. Gọi tổng đài","C. Tắt dữ liệu di động","D. Không thể thực hiện"],"answer":"A","explain":"Điện thoại có thể chia sẻ mạng di động qua điểm phát sóng (hotspot).","points":0.25},{"type":"mcq","level":"VD","q":"Bạn cần in tài liệu từ điện thoại. Cách làm là","options":["A. Kết nối điện thoại với máy in qua wifi hoặc cáp rồi chọn in","B. Chép tay","C. Gửi cho bạn in hộ là cách duy nhất","D. Không in được từ điện thoại"],"answer":"A","explain":"Điện thoại hiện đại in trực tiếp qua máy in có wifi.","points":0.25},{"type":"mcq","level":"VD","q":"Để họp trực tuyến không bị gián đoạn, nên","options":["A. Dùng mạng ổn định, sạc đầy pin, tắt ứng dụng nặng","B. Vừa họp vừa tải phim","C. Ngồi nơi sóng yếu","D. Để pin sắp hết"],"answer":"A","explain":"Mạng, pin và tài nguyên máy là ba yếu tố quyết định chất lượng cuộc họp.","points":0.25},{"type":"mcq","level":"VDC","q":"Một văn phòng nhỏ cần chia sẻ máy in cho 10 máy tính. Cách hiệu quả là","options":["A. Mỗi máy một máy in","B. Kết nối máy in vào mạng nội bộ để mọi máy cùng dùng","C. Chép file sang USB rồi in","D. Không dùng máy in"],"answer":"B","explain":"Máy in mạng cho phép nhiều máy tính chia sẻ, tiết kiệm chi phí.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về kết nối thiết bị:","statements":["a) Điện thoại có thể in qua máy in wifi","b) Nhiều máy tính có thể dùng chung một máy in mạng","c) Bluetooth kết nối được ở khoảng cách hàng km","d) Cáp USB truyền file giữa điện thoại và máy tính"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: bluetooth chỉ tầm gần. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về sử dụng thiết bị hiệu quả:","statements":["a) Nên sắp xếp file vào thư mục gọn gàng","b) Nên đặt tên file rõ ràng, dễ tìm","c) Nên xóa file rác định kì","d) Cứ để file lung tung cũng không sao"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: khó tìm, tốn bộ nhớ.","points":1},{"type":"short","level":"NB","q":"Tên mạng wifi mà điện thoại hiển thị để người dùng chọn gọi là gì?","answer":"SSID","explain":"SSID là tên của mạng wifi.","points":0.5},{"type":"short","level":"VD","q":"Nhiều máy tính cùng dùng chung một máy in qua hệ thống dây dẫn trong văn phòng gọi là mạng gì?","answer":"mạng nội bộ","explain":"Mạng nội bộ (LAN) kết nối các thiết bị trong một khu vực.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Để tăng dung lượng lưu trữ cho điện thoại, có thể","options":["A. Gắn thêm thẻ nhớ ngoài","B. Xóa hệ điều hành","C. Tháo pin","D. Tắt nguồn"],"answer":"A","explain":"Thẻ nhớ ngoài (microSD) mở rộng bộ nhớ cho điện thoại hỗ trợ.","points":0.25},{"type":"mcq","level":"TH","q":"Sao lưu dữ liệu lên đám mây có ưu điểm","options":["A. Truy cập mọi lúc mọi nơi, không sợ mất khi hỏng máy","B. Không cần mạng","C. Miễn phí không giới hạn","D. Không ai xem được"],"answer":"A","explain":"Dữ liệu trên đám mây an toàn khi mất máy và truy cập linh hoạt.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn có 15 GB ảnh cần sao lưu, gói đám mây miễn phí 5 GB. Cách xử lí là","options":["A. Bỏ không sao lưu","B. Nén ảnh, chọn ảnh quan trọng nhất hoặc dùng thêm dịch vụ khác","C. Xóa hết ảnh","D. Mua ngay gói đắt nhất"],"answer":"B","explain":"Ưu tiên ảnh quan trọng, nén bớt hoặc kết hợp nhiều dịch vụ miễn phí.","points":0.25},{"type":"mcq","level":"VD","q":"Điện thoại báo “không đủ dung lượng để cập nhật”. Xử lí đúng là","options":["A. Bỏ cập nhật","B. Giải phóng bộ nhớ (xóa cache, file thừa, chuyển ảnh lên đám mây) rồi cập nhật lại","C. Đặt lại máy ngay","D. Tắt nguồn"],"answer":"B","explain":"Cập nhật cần dung lượng trống; dọn dẹp rồi thử lại.","points":0.25},{"type":"mcq","level":"VDC","q":"Một studio cần lưu trữ 2 TB video. Giải pháp an toàn và kinh tế là","options":["A. Chỉ lưu trên một ổ cứng","B. Lưu trên ổ cứng ngoài và sao lưu thêm một bản trên đám mây hoặc ổ khác","C. Lưu trên USB","D. Không cần sao lưu"],"answer":"B","explain":"Nguyên tắc 3-2-1: nhiều bản sao ở nhiều nơi tránh mất dữ liệu.","points":0.25},{"type":"mcq","level":"VDC","q":"Khi thanh lí điện thoại cũ, để bảo vệ dữ liệu cá nhân cần","options":["A. Xóa vài ảnh là đủ","B. Đăng xuất mọi tài khoản, sao lưu rồi đặt lại máy về cài đặt gốc","C. Cho luôn không cần làm gì","D. Tháo sim là đủ"],"answer":"B","explain":"Đặt lại về cài đặt gốc xóa sạch dữ liệu, tránh lộ thông tin cá nhân.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về sao lưu dữ liệu:","statements":["a) Nên sao lưu dữ liệu quan trọng ở ít nhất hai nơi","b) Đám mây giúp truy cập dữ liệu mọi lúc mọi nơi","c) Thẻ nhớ ngoài giúp mở rộng bộ nhớ","d) Không bao giờ cần sao lưu"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về bảo vệ thiết bị:","statements":["a) Nên dùng ốp lưng và dán màn hình","b) Tránh để máy nơi ẩm ướt, nhiệt độ cao","c) Rơi vỡ không ảnh hưởng gì","d) Vệ sinh cổng sạc định kì"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai. d) Đúng.","points":1},{"type":"short","level":"TH","q":"Thẻ nhớ gắn thêm vào điện thoại để mở rộng bộ nhớ thường có tên là gì?","answer":"microSD","explain":"Thẻ microSD mở rộng bộ nhớ ngoài.","points":0.5},{"type":"short","level":"VD","q":"Thao tác đưa thiết bị về trạng thái như lúc mới mua, xóa sạch dữ liệu, gọi là gì?","answer":"đặt lại về cài đặt gốc","explain":"Factory reset xóa toàn bộ dữ liệu người dùng.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Để bảo vệ mắt khi dùng thiết bị số lâu, nên","options":["A. Dùng liên tục không nghỉ","B. Nghỉ ngơi mỗi 20-30 phút, giữ khoảng cách hợp lí với màn hình","C. Để độ sáng tối đa","D. Dùng trong bóng tối"],"answer":"B","explain":"Nghỉ ngơi định kì và giữ khoảng cách giúp bảo vệ mắt.","points":0.25},{"type":"mcq","level":"TH","q":"Tư thế ngồi đúng khi dùng máy tính là","options":["A. Ngồi gù lưng, dí sát màn hình","B. Lưng thẳng, màn hình ngang tầm mắt, chân chạm đất","C. Nằm dùng máy tính","D. Ngồi xổm"],"answer":"B","explain":"Tư thế đúng tránh đau lưng, mỏi cổ khi dùng máy tính lâu.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn cần gửi file 2 GB cho thầy cô nhưng email chỉ cho đính kèm 25 MB. Cách tốt nhất là","options":["A. Chia thành 80 email","B. Tải file lên đám mây và gửi liên kết qua email","C. Bỏ không nộp","D. Nén còn 25 MB bằng mọi giá"],"answer":"B","explain":"Đám mây không giới hạn bởi mức đính kèm email.","points":0.25},{"type":"mcq","level":"VD","q":"Một file quan trọng bị xóa nhầm khỏi điện thoại. Việc nên làm đầu tiên là","options":["A. Ngừng ghi thêm dữ liệu và kiểm tra thùng rác hoặc bản sao lưu","B. Đặt lại máy ngay","C. Xóa thêm file khác","D. Bỏ cuộc"],"answer":"A","explain":"Ngừng ghi dữ liệu mới tránh ghi đè; khôi phục từ thùng rác hoặc sao lưu.","points":0.25},{"type":"mcq","level":"VDC","q":"Gia đình bạn có người lớn tuổi hay bị lừa qua điện thoại. Biện pháp phòng ngừa hiệu quả là","options":["A. Cấm dùng điện thoại","B. Hướng dẫn nhận biết cuộc gọi lừa đảo, không cung cấp mã OTP, chặn số lạ","C. Để người lớn tự xử lí","D. Tắt máy vĩnh viễn"],"answer":"B","explain":"Giáo dục kĩ năng nhận biết lừa đảo là biện pháp bền vững nhất.","points":0.25},{"type":"mcq","level":"VDC","q":"Một lớp học có 40 học sinh cần nộp bài tập video. Giáo viên nên","options":["A. Nhận qua tin nhắn từng bạn","B. Tạo thư mục chung trên đám mây, quy định tên file rõ ràng và hạn nộp","C. Thu USB từng bạn","D. Không cần quy định gì"],"answer":"B","explain":"Thư mục chung giúp thu bài có tổ chức, dễ quản lí và chấm.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về sức khỏe khi dùng thiết bị số:","statements":["a) Nên nghỉ ngơi mắt sau mỗi 20-30 phút","b) Nên ngồi đúng tư thế khi dùng máy tính","c) Dùng thiết bị trong bóng tối tốt cho mắt","d) Vận động thể chất giúp cân bằng khi dùng thiết bị nhiều"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: gây mỏi mắt. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về sử dụng thiết bị có trách nhiệm:","statements":["a) Không dùng điện thoại khi đang lái xe","b) Tắt tiếng điện thoại trong lớp học","c) Có thể vừa sạc vừa dùng thoải mái","d) Tôn trọng quyền riêng tư của người khác khi chụp ảnh"],"answer":["T","T","F","T"],"explain":"a) Đúng: nguy hiểm. b) Đúng. c) Sai: gây nóng máy, chai pin. d) Đúng.","points":1},{"type":"short","level":"TH","q":"Thao tác sao chép toàn bộ dữ liệu quan trọng sang nơi khác để phòng mất mát gọi là gì?","answer":"sao lưu","explain":"Sao lưu (backup) dữ liệu.","points":0.5},{"type":"short","level":"VD","q":"Kẻ gian giả danh người quen để lừa lấy thông tin, tiền bạc qua mạng gọi là gì?","answer":"lừa đảo","explain":"Lừa đảo trực tuyến ngày càng tinh vi, cần cảnh giác.","points":0.5}]}]}
