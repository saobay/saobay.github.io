{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Âm thanh trong tự nhiên tồn tại dưới dạng","options":["A. Sóng âm","B. Dãy bit","C. Chữ viết","D. Hình vẽ"],"answer":"A","explain":"Âm thanh là sóng lan truyền trong môi trường (không khí, nước...).","points":0.25},{"type":"mcq","level":"NB","q":"Để lưu trữ âm thanh trong máy tính, cần","options":["A. Số hóa: lấy mẫu sóng âm và mã hóa thành dãy bit","B. Vẽ lại sóng âm","C. Ghi âm bằng tay","D. Chụp ảnh sóng âm"],"answer":"A","explain":"Số hóa âm thanh là lấy mẫu tín hiệu sóng âm tại các thời điểm rời rạc rồi mã hóa thành dãy bit.","points":0.25},{"type":"mcq","level":"TH","q":"Tần số lấy mẫu càng cao thì chất lượng âm thanh số","options":["A. Càng thấp","B. Càng cao, nhưng dung lượng file càng lớn","C. Không thay đổi","D. Bị mất tiếng"],"answer":"B","explain":"Lấy mẫu càng dày thì tái tạo sóng âm càng trung thực, nhưng dữ liệu càng nhiều.","points":0.25},{"type":"mcq","level":"NB","q":"Đơn vị đo tần số lấy mẫu âm thanh là","options":["A. Hz","B. Pixel","C. Byte","D. Dpi"],"answer":"A","explain":"Tần số lấy mẫu đo bằng Hz (số mẫu mỗi giây), ví dụ 44100 Hz.","points":0.25},{"type":"mcq","level":"VD","q":"Một đoạn nhạc dài 60 giây, tần số lấy mẫu 8000 Hz, mỗi mẫu 8 bit, 1 kênh. Dung lượng là","options":["A. 480000 bit","B. 3840000 bit","C. 48000 bit","D. 64000 bit"],"answer":"B","explain":"60 × 8000 × 8 × 1 = 3840000 bit.","points":0.25},{"type":"mcq","level":"VDC","q":"Một bản nhạc CD dài 3 phút, tần số lấy mẫu 44100 Hz, mỗi mẫu 16 bit, 2 kênh (stereo). Dung lượng xấp xỉ","options":["A. 5 MB","B. 10 MB","C. 30 MB","D. 1 MB"],"answer":"C","explain":"180 × 44100 × 16 × 2 = 254016000 bit = 31752000 byte ≈ 30,3 MB.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về âm thanh số:","statements":["a) Âm thanh tự nhiên là sóng âm liên tục","b) Máy tính lưu trữ âm thanh dưới dạng dãy bit","c) Số hóa âm thanh gồm lấy mẫu và mã hóa","d) Âm thanh không thể lưu trong máy tính"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về chất lượng âm thanh số:","statements":["a) Tần số lấy mẫu càng cao, âm thanh càng trung thực","b) Độ sâu bit càng lớn, âm thanh càng chi tiết","c) Chất lượng càng cao thì file càng nặng","d) File MP3 nén nên nhẹ hơn file WAV cùng nội dung"],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng: MP3 dùng nén mất dữ liệu nên nhẹ hơn WAV.","points":1},{"type":"short","level":"NB","q":"Quá trình biến sóng âm liên tục thành dãy bit rời rạc gọi là gì?","answer":"số hóa âm thanh","explain":"Số hóa âm thanh gồm lấy mẫu và mã hóa.","points":0.5},{"type":"short","level":"TH","q":"Định dạng file nhạc nén phổ biến, dung lượng nhẹ, thường dùng để nghe nhạc trực tuyến là gì?","answer":"MP3","explain":"MP3 là định dạng nén âm thanh phổ biến.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Điểm ảnh (pixel) là","options":["A. Đơn vị nhỏ nhất của hình ảnh số","B. Một loại máy ảnh","C. Phần mềm chỉnh ảnh","D. Khung hình"],"answer":"A","explain":"Pixel là điểm ảnh nhỏ nhất tạo nên hình ảnh số.","points":0.25},{"type":"mcq","level":"NB","q":"Độ phân giải của ảnh cho biết","options":["A. Số điểm ảnh theo chiều ngang và chiều dọc","B. Độ sáng màn hình","C. Tốc độ mạng","D. Dung lượng pin"],"answer":"A","explain":"Độ phân giải ví dụ 800×600 nghĩa là 800 pixel ngang và 600 pixel dọc.","points":0.25},{"type":"mcq","level":"TH","q":"Ảnh có độ phân giải 800×600 gồm bao nhiêu điểm ảnh?","options":["A. 1400 điểm ảnh","B. 480000 điểm ảnh","C. 800 điểm ảnh","D. 600 điểm ảnh"],"answer":"B","explain":"800 × 600 = 480000 điểm ảnh.","points":0.25},{"type":"mcq","level":"TH","q":"Độ sâu màu (độ sâu bit) của ảnh cho biết","options":["A. Số bit dùng để mã hóa màu của mỗi điểm ảnh","B. Độ dày của ảnh","C. Kích thước file","D. Tốc độ chụp"],"answer":"A","explain":"Độ sâu bit càng lớn thì mỗi pixel biểu diễn được càng nhiều màu.","points":0.25},{"type":"mcq","level":"VDC","q":"Một ảnh 800×600, độ sâu màu 24 bit. Dung lượng ảnh (chưa nén) là","options":["A. 480000 byte","B. 1440000 byte","C. 11520000 byte","D. 1406 byte"],"answer":"B","explain":"800 × 600 × 24 = 11520000 bit = 1440000 byte.","points":0.25},{"type":"mcq","level":"TH","q":"Ảnh đen trắng (mỗi pixel 1 bit) có độ phân giải 100×100 chiếm","options":["A. 10000 bit","B. 10000 byte","C. 100 bit","D. 20000 bit"],"answer":"A","explain":"100 × 100 × 1 = 10000 bit.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về ảnh số:","statements":["a) Ảnh số gồm các điểm ảnh (pixel)","b) Độ phân giải càng cao, ảnh càng sắc nét","c) Độ sâu màu càng lớn, ảnh càng nhiều màu","d) Mọi ảnh số đều có dung lượng như nhau"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: dung lượng phụ thuộc độ phân giải và độ sâu màu.","points":1},{"type":"truefalse","level":"VDC","q":"Xét các phát biểu về mô hình màu RGB:","statements":["a) RGB gồm ba màu cơ bản đỏ, xanh lá, xanh dương","b) Mỗi kênh màu thường dùng 8 bit","c) Ảnh 24 bit có thể hiển thị khoảng 16,7 triệu màu","d) Trộn ba kênh ở mức tối đa cho màu đen"],"answer":["T","T","T","F"],"explain":"a) Đúng: Red, Green, Blue. b) Đúng. c) Đúng: 256 mũ 3 = 16777216. d) Sai: ba kênh tối đa cho màu trắng.","points":1},{"type":"short","level":"NB","q":"Ba màu cơ bản trong mô hình màu của màn hình máy tính là đỏ, xanh lá và màu gì?","answer":"xanh dương","explain":"Mô hình RGB: Red, Green, Blue.","points":0.5},{"type":"short","level":"VDC","q":"Ảnh 24 bit có thể hiển thị tối đa bao nhiêu màu (làm tròn triệu)?","answer":"16,7 triệu","explain":"256 × 256 × 256 = 16777216 ≈ 16,7 triệu màu.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Video số thực chất là","options":["A. Dãy các ảnh tĩnh hiển thị liên tiếp","B. Một bức ảnh duy nhất","C. Dòng chữ chạy","D. Âm thanh"],"answer":"A","explain":"Video gồm nhiều khung hình (ảnh tĩnh) hiển thị liên tiếp, thường 24–30 khung mỗi giây.","points":0.25},{"type":"mcq","level":"NB","q":"Định dạng file ảnh phổ biến nào sau đây?","options":["A. JPG","B. MP3","C. DOC","D. TXT"],"answer":"A","explain":"JPG là định dạng ảnh nén phổ biến; MP3 là nhạc; DOC, TXT là văn bản.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của định dạng PNG so với JPG là","options":["A. Hỗ trợ nền trong suốt và giữ chất lượng tốt hơn","B. File luôn nhẹ hơn","C. Chỉ dùng cho ảnh đen trắng","D. Không mở được trên điện thoại"],"answer":"A","explain":"PNG nén không mất dữ liệu, hỗ trợ trong suốt, phù hợp logo, đồ họa.","points":0.25},{"type":"mcq","level":"NB","q":"Khi phóng to ảnh bitmap quá mức, ảnh bị","options":["A. Vỡ hạt (rỗ)","B. Đẹp hơn","C. Nhỏ lại","D. Đổi màu"],"answer":"A","explain":"Ảnh bitmap gồm pixel cố định nên phóng to quá mức sẽ thấy rõ các ô vuông (vỡ hạt).","points":0.25},{"type":"mcq","level":"VD","q":"Một ảnh 1024×768, độ sâu màu 24 bit. Dung lượng ảnh (chưa nén) xấp xỉ","options":["A. 2,25 MB","B. 786 KB","C. 18 MB","D. 768 KB"],"answer":"A","explain":"1024 × 768 × 24 = 18874368 bit = 2359296 byte = 2304 KB = 2,25 MB.","points":0.25},{"type":"mcq","level":"VDC","q":"Một video dài 10 giây, 30 khung hình mỗi giây, mỗi khung là ảnh 640×480 độ sâu 24 bit. Dung lượng video (chưa nén) xấp xỉ","options":["A. 27 MB","B. 264 MB","C. 2,6 GB","D. 9 MB"],"answer":"B","explain":"Mỗi khung: 640×480×24 bit = 7372800 bit = 921600 byte. 300 khung = 276480000 byte ≈ 263,7 MB.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về ảnh số:","statements":["a) JPG là định dạng ảnh phổ biến","b) PNG hỗ trợ nền trong suốt","c) Ảnh bitmap phóng to quá mức sẽ bị vỡ hạt","d) Mọi định dạng ảnh đều giống nhau"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: mỗi định dạng có đặc điểm riêng.","points":1},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về video số:","statements":["a) Video gồm nhiều khung hình hiển thị liên tiếp","b) Số khung hình mỗi giây càng cao, chuyển động càng mượt","c) Video chưa nén có dung lượng rất lớn","d) Nén video giúp giảm dung lượng"],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng.","points":1},{"type":"short","level":"TH","q":"Ảnh được tạo từ các điểm ảnh (pixel) gọi là ảnh gì?","answer":"ảnh bitmap","explain":"Ảnh bitmap (raster) gồm lưới các điểm ảnh.","points":0.5},{"type":"short","level":"VD","q":"Một ảnh 640×480 gồm bao nhiêu điểm ảnh?","answer":"307200","explain":"640 × 480 = 307200 điểm ảnh.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Độ sâu bit của âm thanh cho biết","options":["A. Số bit dùng để mã hóa mỗi mẫu âm thanh","B. Độ to của loa","C. Thời lượng bài hát","D. Tốc độ mạng"],"answer":"A","explain":"Độ sâu bit càng lớn thì mỗi mẫu âm thanh càng chi tiết.","points":0.25},{"type":"mcq","level":"NB","q":"File WAV khác file MP3 ở điểm","options":["A. WAV ít hoặc không nén nên chất lượng cao nhưng nặng; MP3 nén nên nhẹ","B. WAV là file ảnh","C. MP3 không phát được","D. Không khác nhau"],"answer":"A","explain":"WAV lưu gần như nguyên bản nên nặng; MP3 nén mất dữ liệu nên nhẹ, tiện chia sẻ.","points":0.25},{"type":"mcq","level":"TH","q":"Tần số lấy mẫu 44100 Hz nghĩa là","options":["A. Lấy 44100 mẫu âm thanh mỗi giây","B. Bài hát dài 44100 giây","C. File nặng 44100 byte","D. Nghe được 44100 lần"],"answer":"A","explain":"44100 Hz = 44100 mẫu mỗi giây, chuẩn của đĩa CD.","points":0.25},{"type":"mcq","level":"TH","q":"Để ghi âm giọng nói làm file nhẹ gửi qua tin nhắn, nên","options":["A. Dùng tần số lấy mẫu thấp và định dạng nén như MP3","B. Dùng chất lượng cao nhất","C. Ghi âm thật dài","D. Không nén"],"answer":"A","explain":"Giọng nói không cần chất lượng quá cao; nén giúp file nhẹ, gửi nhanh.","points":0.25},{"type":"mcq","level":"VDC","q":"Một file ghi âm 5 phút, 11025 Hz, 8 bit, 1 kênh. Dung lượng là","options":["A. Khoảng 3,15 MB","B. Khoảng 31,5 MB","C. Khoảng 315 KB","D. Khoảng 3,15 KB"],"answer":"A","explain":"300 × 11025 × 8 × 1 = 26460000 bi er":"frames per second","explain":"fps = frames per second: số khung hình mỗi giây.","points":0.5},{"type":"short","level":"VD","q":"Một video 10 giây, 30 fps có tổng cộng bao nhiêu khung hình?","answer":"300","explain":"10 × 30 = 300 khung hình.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Để giảm dung lượng ảnh mà vẫn giữ chất lượng chấp nhận được, người ta","options":["A. Xóa ảnh","B. Nén ảnh","C. Vẽ lại ảnh","D. Chụp lại"],"answer":"B","explain":"Nén ảnh giảm dung lượng lưu trữ và dễ chia sẻ.","points":0.25},{"type":"mcq","level":"TH","q":"Chia sẻ ảnh lên mạng xã hội, ảnh thường được","options":["A. Tự động nén để tải lên nhanh","B. Giữ nguyên 100%","C. Phóng to gấp đôi","D. Chuyển thành video"],"answer":"A","explain":"Mạng xã hội tự nén ảnh để tiết kiệm băng thông và tải nhanh.","points":0.25},{"type":"mcq","level":"VD","q":"Một ảnh gốc 6 MB được nén còn 1,5 MB. Tỉ lệ nén là","options":["A. 2:1","B. 4:1","C. 1:4","D. 6:1"],"answer":"B","explain":"6 ÷ 1,5 = 4 nên tỉ lệ nén 4:1.","points":0.25},{"type":"mcq","level":"VD","q":"Muốn in ảnh khổ lớn sắc nét, cần ảnh có","options":["A. Độ phân giải cao","B. Dung lượng nhỏ","C. Màu sắc ít","D. Định dạng GIF"],"answer":"A","explain":"In khổ lớn cần nhiều điểm ảnh để không bị vỡ hạt.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nhiếp ảnh gia chụp 200 ảnh, mỗi ảnh RAW 25 MB. Thẻ nhớ tối thiểu (trong các loại sau) đủ chứa là","options":["A. 4 GB","B. 5 GB","C. 8 GB","D. 2 GB"],"answer":"B","explain":"200 × 25 = 5000 MB ≈ 4,88 GB. Thẻ 4 GB không đủ; thẻ 5 GB là loại nhỏ nhất đủ chứa.","points":0.25},{"type":"mcq","level":"VDC","q":"Một video 4K (3840×2160) có số điểm ảnh gấp bao nhiêu lần video Full HD (1920×1080)?","options":["A. 2 lần","B. 4 lần","C. 8 lần","D. Bằng nhau"],"answer":"B","explain":"Cả hai chiều đều gấp đôi nên số điểm ảnh gấp 2 × 2 = 4 lần.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về lưu trữ ảnh:","statements":["a) Ảnh RAW chất lượng cao, dung lượng lớn","b) Nên sao lưu ảnh quan trọng ở nhiều nơi","c) Xóa ảnh gốc sau khi nén là an toàn","d) Đám mây giúp lưu trữ và chia sẻ ảnh"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: nên giữ bản gốc. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về chụp và chia sẻ ảnh:","statements":["a) Chụp ảnh là thu nhận thông tin hình ảnh","b) Chỉnh sửa ảnh là xử lí thông tin","c) Đăng ảnh lên mạng là truyền thông tin","d) Ảnh số không phải là dữ liệu"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: ảnh số là dữ liệu.","points":1},{"type":"short","level":"TH","q":"Định dạng ảnh động đơn giản thường dùng làm sticker có tên là gì?","answer":"GIF","explain":"GIF hỗ trợ ảnh động đơn giản.","points":0.5},{"type":"short","level":"VD","q":"Một ảnh 400×300, mỗi pixel 8 bit chiếm bao nhiêu byte?","answer":"120000","explain":"400 × 300 × 8 = 960000 bit = 120000 byte.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Đơn vị nhỏ nhất của hình ảnh số là","options":["A. Pixel","B. Frame","C. Sample","D. Byte"],"answer":"A","explain":"Pixel (điểm ảnh) là đơn vị nhỏ nhất của ảnh số.","points":0.25},{"type":"mcq","level":"TH","q":"Một ảnh 1600×1200 có số điểm ảnh gấp mấy lần ảnh 800×600?","options":["A. 2 lần","B. 4 lần","C. 8 lần","D. Bằng nhau"],"answer":"B","explain":"Cả hai chiều đều gấp đôi nên số điểm ảnh gấp 4 lần.","points":0.25},{"type":"mcq","level":"VD","q":"Một ảnh 500×400, 24 bit. Dung lượng ảnh (chưa nén) là","options":["A. 600000 byte","B. 4800000 bit","C. 200000 byte","D. 480000 bit"],"answer":"A","explain":"500 × 400 × 24 = 4800000 bit = 600000 byte.","points":0.25},{"type":"mcq","level":"VD","q":"Một đoạn nhạc 45 giây, 11025 Hz, 8 bit, 1 kênh. Dung lượng là","options":["A. 3969000 bit","B. 496125 bit","C. 992250 bit","D. 396900 bit"],"answer":"A","explain":"45 × 11025 × 8 × 1 = 3969000 bit.","points":0.25},{"type":"mcq","level":"VDC","q":"Một video 1 giây, 30 fps, mỗi khung 320×240, 24 bit. Dung lượng (chưa nén) xấp xỉ","options":["A. 6,6 MB","B. 2,2 MB","C. 66 MB","D. 660 KB"],"answer":"A","explain":"Mỗi khung: 320×240×24 = 1843200 bit = 230400 byte. 30 khung = 6912000 byte ≈ 6,59 MB.","points":0.25},{"type":"mcq","level":"VDC","q":"Để lưu trữ lâu dài các bức ảnh kỉ niệm gia đình với chất lượng tốt nhất, nên","options":["A. Chỉ giữ bản nén nhẹ trên mạng xã hội","B. Giữ file gốc chất lượng cao và sao lưu ở nhiều nơi","C. Xóa sau khi đăng","D. Chỉ lưu trên một USB"],"answer":"B","explain":"Giữ file gốc và sao lưu nhiều nơi (máy tính, đám mây) đảm bảo an toàn dữ liệu.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về dung lượng:","statements":["a) Ảnh độ phân giải gấp đôi thì dung lượng gấp khoảng 4 lần","b) Tăng độ sâu bit làm tăng dung lượng ảnh","c) Video dài gấp đôi thì dung lượng gấp đôi","d) Nén không làm thay đổi dung lượng file"],"answer":["T","T","T","F"],"explain":"a) Đúng: số pixel gấp 4. b) Đúng. c) Đúng. d) Sai: nén làm giảm dung lượng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về âm thanh và hình ảnh số:","statements":["a) Cả âm thanh và hình ảnh đều được số hóa thành dãy bit","b) Chất lượng càng cao thì file càng nặng","c) Nén giúp chia sẻ dễ dàng hơn","d) File gốc chất lượng cao nên được giữ lại"],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng.","points":1},{"type":"short","level":"TH","q":"Quá trình biến tín hiệu liên tục (âm thanh, hình ảnh) thành dãy bit rời rạc gọi là gì?","answer":"số hóa","explain":"Số hóa là biến đổi tín hiệu tương tự thành tín hiệu số.","points":0.5},{"type":"short","level":"VD","q":"Một ảnh 1000×800, mỗi pixel 8 bit chiếm bao nhiêu byte?","answer":"800000","explain":"1000 × 800 × 8 = 6400000 bit = 800000 byte.","points":0.5}]}]}
