 = 1.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Giá trị sai trong tin học thường được biểu diễn bằng bit","options":["A. 0","B. 1","C. 2","D. 10"],"answer":"A","explain":"Quy ước: bit 0 = sai (false).","points":0.25},{"type":"mcq","level":"NB","q":"Phép phủ định của “Trời đang mưa” là","options":["A. “Trời đang mưa to”","B. “Trời không mưa”","C. “Trời sắp mưa”","D. “Trời mưa nhỏ”"],"answer":"B","explain":"Phủ định là khẳng định ngược lại: trời không mưa.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu thức sai OR (đúng AND đúng) có giá trị là","options":["A. Sai","B. Đúng","C. Không xác định","D. Bằng 2"],"answer":"B","explain":"(đúng AND đúng) = đúng; sai OR đúng = đúng.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu thức NOT (sai AND sai) có giá trị là","options":["A. Sai","B. Đúng","C. Không xác định","D. Bằng 0"],"answer":"B","explain":"(sai AND sai) = sai; NOT sai = đúng.","points":0.25},{"type":"mcq","level":"VD","q":"Đèn báo “hết pin” sáng khi (pin yếu) AND (đang không sạc). Muốn đèn tắt, cần","options":["A. Pin đầy hoặc đang sạc","B. Pin yếu và không sạc","C. Tháo pin ra","D. Tắt nguồn"],"answer":"A","explain":"Đèn tắt khi NOT ((pin yếu) AND (không sạc)), tức pin đầy OR đang sạc (quy tắc De Morgan).","points":0.25},{"type":"mcq","level":"VDC","q":"Biểu thức (A AND B) OR (NOT A AND NOT B) với A = đúng, B = sai có giá trị là","options":["A. Đúng","B. Sai","C. Không xác định","D. Bằng 1"],"answer":"B","explain":"(đúng AND sai) = sai; (sai AND đúng) = sai; sai OR sai = sai.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về mệnh đề:","statements":["a) “Hà Nội là thủ đô Việt Nam” là mệnh đề đúng","b) “5 là số chẵn” là mệnh đề sai","c) “Bạn tên gì?” là mệnh đề","d) Mệnh đề phải xác định được đúng hoặc sai"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: câu hỏi không phải mệnh đề. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về ứng dụng phép toán lôgic:","statements":["a) Mạch nối tiếp mô hình phép AND","b) Mạch song song mô hình phép OR","c) Công tắc đảo mô hình phép NOT","d) Phép toán lôgic không có ứng dụng thực tế"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: đảo trạng thái. d) Sai: dùng trong mạch điện, lập trình.","points":1},{"type":"short","level":"TH","q":"Trong mạch điện nối tiếp, bóng đèn sáng khi cả hai công tắc đều đóng. Đây là mô hình của phép toán nào?","answer":"AND","explain":"Mạch nối tiếp tương ứng phép AND.","points":0.5},{"type":"short","level":"VD","q":"Tính giá trị của biểu thức: NOT (1 OR 0) (với 1 = đúng, 0 = sai).","answer":"0","explain":"(1 OR 0) = 1; NOT 1 = 0.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Bảng chân trị là bảng","options":["A. Liệt kê giá trị của biểu thức lôgic với mọi tổ hợp giá trị của biến","B. Bảng cửu chương","C. Bảng tuần hoàn","D. Bảng điểm"],"answer":"A","explain":"Bảng chân trị liệt kê đầy đủ các trường hợp đúng/sai của biểu thức lôgic.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu thức có 2 biến lôgic thì bảng chân trị có bao nhiêu hàng?","options":["A. 2 hàng","B. 3 hàng","C. 4 hàng","D. 8 hàng"],"answer":"C","explain":"2 biến, mỗi biến 2 giá trị nên có 2 mũ 2 = 4 tổ hợp.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu thức đúng AND sai OR đúng có giá trị là","options":["A. Sai","B. Đúng","C. Không xác định","D. Bằng 0"],"answer":"B","explain":"AND trước: đúng AND sai = sai; rồi sai OR đúng = đúng.","points":0.25},{"type":"mcq","level":"VD","q":"Biểu thức NOT đúng AND sai OR đúng có giá trị là","options":["A. Sai","B. Đúng","C. Không xác định","D. Bằng 2"],"answer":"B","explain":"NOT đúng = sai; sai AND sai = sai; sai OR đúng = đúng.","points":0.25},{"type":"mcq","level":"VDC","q":"Biểu thức A AND NOT B với A = sai, B = sai có giá trị là","options":["A. Đúng","B. Sai","C. Không xác định","D. Bằng 1"],"answer":"B","explain":"NOT B = đúng; A AND đúng = sai AND đúng = sai.","points":0.25},{"type":"mcq","level":"VDC","q":"Có 3 biến lôgic. Bảng chân trị của biểu thức tạo bởi 3 biến có bao nhiêu hàng?","options":["A. 6 hàng","B. 8 hàng","C. 9 hàng","D. 3 hàng"],"answer":"B","explain":"3 biến, mỗi biến 2 giá trị nên có 2 mũ 3 = 8 tổ hợp.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về giá trị lôgic:","statements":["a) Đúng AND sai = sai","b) Đúng OR sai = đúng","c) NOT đúng = sai","d) Sai AND sai = đúng"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: sai AND sai = sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về biểu thức lôgic:","statements":["a) Biểu thức lôgic cho kết quả đúng hoặc sai","b) Có thể kết hợp nhiều phép NOT, AND, OR","c) Dấu ngoặc làm thay đổi thứ tự thực hiện","d) Biểu thức lôgic không dùng trong lập trình"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: điều kiện rẽ nhánh dùng biểu thức lôgic.","points":1},{"type":"short","level":"NB","q":"Biểu thức có 1 biến lôgic thì bảng chân trị có bao nhiêu hàng?","answer":"2","explain":"1 biến có 2 giá trị đúng/sai nên 2 hàng.","points":0.5},{"type":"short","level":"VDC","q":"Tính giá trị của biểu thức: (NOT 1) OR (NOT 0) (với 1 = đúng, 0 = sai).","answer":"1","explain":"NOT 1 = 0; NOT 0 = 1; 0 OR 1 = 1.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Trong lập trình, câu lệnh rẽ nhánh thực hiện dựa trên","options":["A. Giá trị đúng/sai của điều kiện (biểu thức lôgic)","B. Màu sắc","C. Âm thanh","D. Ngẫu nhiên"],"answer":"A","explain":"Rẽ nhánh kiểm tra điều kiện: đúng thì làm việc này, sai thì làm việc khác.","points":0.25},{"type":"mcq","level":"TH","q":"Điều kiện “điểm trung bình từ 8 trở lên” có dạng lôgic là","options":["A. Điểm nhỏ hơn 8","B. Điểm lớn hơn hoặc bằng 8","C. Điểm bằng 8","D. Điểm khác 8"],"answer":"B","explain":"“Từ 8 trở lên” nghĩa là lớn hơn hoặc bằng 8.","points":0.25},{"type":"mcq","level":"VD","q":"Học sinh được khen thưởng khi (điểm trung bình từ 8 trở lên) AND (không vi phạm kỉ luật). Bạn An điểm 8.5 nhưng vi phạm kỉ luật. Kết luận","options":["A. An được khen thưởng","B. An không được khen thưởng","C. Chưa kết luận được","D. Cần thêm điều kiện"],"answer":"B","explain":"(đúng) AND (sai) = sai nên không đạt điều kiện khen thưởng.","points":0.25},{"type":"mcq","level":"VD","q":"Cửa hàng giảm giá khi (mua từ 5 sản phẩm trở lên) OR (là thành viên). Khách mua 3 sản phẩm và là thành viên. Kết luận","options":["A. Không được giảm giá","B. Được giảm giá","C. Chưa kết luận được","D. Phải mua thêm"],"answer":"B","explain":"(sai) OR (đúng) = đúng nên được giảm giá.","points":0.25},{"type":"mcq","level":"VDC","q":"Hệ thống báo cháy kêu khi (có khói AND nhiệt độ cao) OR (nhấn nút khẩn cấp). Hiện tại có khói nhưng nhiệt độ bình thường, không ai nhấn nút. Hệ thống","options":["A. Kêu báo động","B. Không kêu","C. Kêu ngắt quãng","D. Chưa xác định"],"answer":"B","explain":"(đúng AND sai) = sai; sai OR sai = sai nên không báo động.","points":0.25},{"type":"mcq","level":"VDC","q":"Biểu thức (NOT A) AND (NOT B) với A = đúng, B = đúng tương đương với","options":["A. NOT (A AND B)","B. NOT (A OR B)","C. A OR B","D. A AND B"],"answer":"B","explain":"Theo quy tắc De Morgan: (NOT A) AND (NOT B) = NOT (A OR B). Giá trị: sai AND sai = sai.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét điều kiện vào lớp 10 chuyên: (điểm thi từ 7 trở lên) AND (hạnh kiểm tốt). Các phát biểu:","statements":["a) Bạn điểm 8, hạnh kiểm tốt thì đạt","b) Bạn điểm 6.5, hạnh kiểm tốt thì không đạt","c) Bạn điểm 9, hạnh kiểm trung bình thì không đạt","d) Chỉ cần một trong hai điều kiện là đạt"],"answer":["T","T","T","F"],"explain":"a) Đúng: đúng AND đúng. b) Đúng: sai AND đúng = sai. c) Đúng: đúng AND sai = sai. d) Sai: cần cả hai (AND).","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về điều kiện trong đời sống:","statements":["a) “Trời mưa” là một điều kiện có giá trị đúng/sai","b) Có thể kết hợp nhiều điều kiện bằng AND, OR","c) “Nếu trời mưa thì mang ô” là một quy tắc rẽ nhánh","d) Điều kiện không thể phủ định"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: có phép NOT để phủ định.","points":1},{"type":"short","level":"TH","q":"Trong lập trình, cấu trúc cho phép chương trình chọn việc cần làm dựa vào điều kiện đúng/sai gọi là gì?","answer":"rẽ nhánh","explain":"Rẽ nhánh (if) thực hiện công việc khác nhau tùy điều kiện.","points":0.5},{"type":"short","level":"VD","q":"Một bóng đèn sáng khi công tắc A đóng HOẶC công tắc B đóng. Đây là mô hình của phép toán nào?","answer":"OR","explain":"Mạch song song tương ứng phép OR.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Kết quả của phép NOT NOT đúng là","options":["A. Đúng","B. Sai","C. Không xác định","D. Bằng 2"],"answer":"A","explain":"Phủ định hai lần trở về giá trị ban đầu: NOT NOT đúng = đúng.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu thức sai AND sai OR đúng có giá trị là","options":["A. Sai","B. Đúng","C. Không xác định","D. Bằng 0"],"answer":"B","explain":"AND trước: sai AND sai = sai; sai OR đúng = đúng.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu thức NOT (đúng AND đúng) có giá trị là","options":["A. Đúng","B. Sai","C. Không xác định","D. Bằng 1"],"answer":"B","explain":"(đúng AND đúng) = đúng; NOT đúng = sai.","points":0.25},{"type":"mcq","level":"VD","q":"Biểu thức (đúng OR sai) AND NOT sai có giá trị là","options":["A. Sai","B. Đúng","C. Không xác định","D. Bằng 2"],"answer":"B","explain":"(đúng OR sai) = đúng; NOT sai = đúng; đúng AND đúng = đúng.","points":0.25},{"type":"mcq","level":"VD","q":"Trong các biểu thức sau, biểu thức nào luôn đúng với mọi A?","options":["A. A AND NOT A","B. A OR NOT A","C. A AND A","D. NOT A"],"answer":"B","explain":"A OR NOT A luôn đúng (một trong hai phải đúng) — quy luật loại trừ.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong các biểu thức sau, biểu thức nào luôn sai với mọi A?","options":["A. A OR NOT A","B. A AND NOT A","C. A OR A","D. NOT NOT A"],"answer":"B","explain":"A AND NOT A luôn sai (không thể vừa đúng vừa sai) — quy luật mâu thuẫn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về phép NOT:","statements":["a) NOT đúng = sai","b) NOT sai = đúng","c) NOT NOT đúng = đúng","d) NOT có thể áp dụng cho biểu thức phức tạp"],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về kết hợp phép toán:","statements":["a) đúng AND đúng OR sai = đúng","b) sai OR sai AND đúng = sai","c) NOT sai AND đúng = đúng","d) đúng OR sai AND sai = đúng"],"answer":["T","T","T","T"],"explain":"a) Đúng. b) Đúng: AND trước. c) Đúng: NOT trước. d) Đúng: sai AND sai = sai, đúng OR sai = đúng.","points":1},{"type":"short","level":"NB","q":"Phép toán lôgic nào có kí hiệu là dấu “và”, chỉ đúng khi cả hai đều đúng?","answer":"AND","explain":"Phép AND.","points":0.5},{"type":"short","level":"VD","q":"Biểu thức A OR NOT A luôn có giá trị là gì?","answer":"đúng","explain":"Luôn đúng với mọi giá trị của A.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Hai giá trị của dữ liệu lôgic trong tiếng Anh là","options":["A. true và false","B. yes và no","C. on và off","D. in và out"],"answer":"A","explain":"true (đúng) và false (sai).","points":0.25},{"type":"mcq","level":"TH","q":"Biểu thức (1 OR 0) AND (0 OR 1) với 1 = đúng, 0 = sai có giá trị","options":["A. 0","B. 1","C. Không xác định","D. 2"],"answer":"B","explain":"(1 OR 0) = 1; (0 OR 1) = 1; 1 AND 1 = 1.","points":0.25},{"type":"mcq","level":"VD","q":"Biểu thức NOT (0 OR 0) AND 1 có giá trị","options":["A. 0","B. 1","C. Không xác định","D. 2"],"answer":"B","explain":"(0 OR 0) = 0; NOT 0 = 1; 1 AND 1 = 1.","points":0.25},{"type":"mcq","level":"VD","q":"Một thang máy chỉ chạy khi (cửa đóng) AND (quá tải là sai). Hiện tại cửa đóng và không quá tải. Thang máy","options":["A. Không chạy","B. Chạy","C. Báo lỗi","D. Chưa xác định"],"answer":"B","explain":"(đúng) AND (NOT sai = đúng) = đúng nên thang máy chạy.","points":0.25},{"type":"mcq","level":"VDC","q":"Biểu thức ((A OR B) AND NOT (A AND B)) với A = đúng, B = đúng có giá trị là","options":["A. Đúng","B. Sai","C. Không xác định","D. Bằng 1"],"answer":"B","explain":"(đúng OR đúng) = đúng; (đúng AND đúng) = đúng; NOT đúng = sai; đúng AND sai = sai. Đây là phép XOR.","points":0.25},{"type":"mcq","level":"VDC","q":"Phép XOR cho kết quả đúng khi","options":["A. Cả hai đều đúng","B. Hai giá trị khác nhau","C. Cả hai đều sai","D. Luôn sai"],"answer":"B","explain":"XOR (hoặc loại trừ) đúng khi hai giá trị khác nhau.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét hệ thống tưới cây tự động: tưới khi (đất khô) AND (trời không mưa). Các phát biểu:","statements":["a) Đất khô, trời mưa thì không tưới","b) Đất ẩm, trời không mưa thì không tưới","c) Đất khô, trời không mưa thì tưới","d) Hệ thống tưới khi một trong hai điều kiện đúng"],"answer":["T","T","T","F"],"explain":"a) Đúng: đúng AND sai = sai. b) Đúng: sai AND đúng = sai. c) Đúng: đúng AND đúng = đúng. d) Sai: cần cả hai (AND).","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về bit và lôgic:","statements":["a) Bit 1 thường biểu diễn giá trị đúng","b) Bit 0 thường biểu diễn giá trị sai","c) Phép AND trên bit giống phép nhân số học với 0 và 1","d) Phép OR trên bit luôn cho kết quả 1"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: 1×1=1, còn lại 0. d) Sai: 0 OR 0 = 0.","points":1},{"type":"short","level":"TH","q":"Mạch điện song song (đèn sáng khi một trong hai công tắc đóng) là mô hình của phép toán nào?","answer":"OR","explain":"Mạch song song tương ứng phép OR.","points":0.5},{"type":"short","level":"VD","q":"Biểu thức A AND NOT A luôn có giá trị là gì?","answer":"sai","explain":"Luôn sai với mọi giá trị của A.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Phép toán lôgic nào đảo ngược giá trị đúng thành sai?","options":["A. AND","B. OR","C. NOT","D. XOR"],"answer":"C","explain":"Phép NOT đảo ngược giá trị.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu thức (sai OR đúng) AND đúng có giá trị là","options":["A. Sai","B. Đúng","C. Không xác định","D. Bằng 0"],"answer":"B","explain":"(sai OR đúng) = đúng; đúng AND đúng = đúng.","points":0.25},{"type":"mcq","level":"VD","q":"Biểu thức NOT sai AND NOT đúng có giá trị là","options":["A. Đúng","B. Sai","C. Không xác định","D. Bằng 2"],"answer":"B","explain":"NOT sai = đúng; NOT đúng = sai; đúng AND sai = sai.","points":0.25},{"type":"mcq","level":"VD","q":"Một máy bán hàng tự động nhả hàng khi (đủ tiền) AND (còn hàng). Hiện tại đủ tiền nhưng hết hàng. Máy sẽ","options":["A. Nhả hàng","B. Không nhả hàng và báo hết hàng","C. Nhả một nửa","D. Trả lại tiền thừa"],"answer":"B","explain":"(đúng) AND (sai) = sai nên không nhả hàng.","points":0.25},{"type":"mcq","level":"VDC","q":"Biểu thức NOT (A OR B) với A = sai, B = sai có giá trị là","options":["A. Đúng","B. Sai","C. Không xác định","D. Bằng 0"],"answer":"A","explain":"(sai OR sai) = sai; NOT sai = đúng.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho biểu thức (A AND B) OR (A AND NOT B). Với A = đúng, B = sai, giá trị là","options":["A. Đúng","B. Sai","C. Không xác định","D. Bằng 1"],"answer":"A","explain":"(đúng AND sai) = sai; (đúng AND đúng) = đúng; sai OR đúng = đúng.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét mạch đèn cầu thang: đèn sáng khi (công tắc tầng 1 bật) XOR (công tắc tầng 2 bật). Các phát biểu:","statements":["a) Cả hai cùng tắt thì đèn tắt","b) Một bật một tắt thì đèn sáng","c) Cả hai cùng bật thì đèn tắt","d) XOR cho đúng khi hai giá trị khác nhau"],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng: XOR đúng khi hai đầu vào khác nhau.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về thứ tự tính biểu thức NOT A AND B OR C:","statements":["a) Tính NOT A trước","b) Tính (NOT A) AND B tiếp theo","c) Tính OR cuối cùng","d) Tính OR trước AND"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: AND trước OR.","points":1},{"type":"short","level":"TH","q":"Biểu thức lôgic chỉ sai khi cả hai giá trị đều sai là phép nào?","answer":"OR","explain":"Phép OR.","points":0.5},{"type":"short","level":"VD","q":"Tính giá trị của biểu thức: (NOT sai) OR (đúng AND sai).","answer":"đúng","explain":"NOT sai = đúng; đúng AND sai = sai; đúng OR sai = đúng.","points":0.5}]}]}
