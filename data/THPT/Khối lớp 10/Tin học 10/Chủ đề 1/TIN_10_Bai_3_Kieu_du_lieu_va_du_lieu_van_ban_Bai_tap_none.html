","level":"NB","q":"Bảng mã dùng 8 bit, mã hóa được 256 kí tự, thường dùng cho văn bản tiếng Anh có tên là gì?","answer":"ASCII","explain":"ASCII (American Standard Code for Information Interchange).","points":0.5},{"type":"short","level":"VDC","q":"Bảng mã ASCII mở rộng mã hóa được tối đa bao nhiêu kí tự khác nhau?","answer":"256","explain":"8 bit tạo ra 2 mũ 8 = 256 tổ hợp.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Kí tự là","options":["A. Đơn vị nhỏ nhất của dữ liệu văn bản: chữ cái, chữ số, dấu câu","B. Một từ","C. Một câu","D. Một đoạn văn"],"answer":"A","explain":"Kí tự là đơn vị nhỏ nhất của văn bản, gồm chữ cái, chữ số, dấu câu và kí tự đặc biệt.","points":0.25},{"type":"mcq","level":"NB","q":"Số thực là số","options":["A. Có phần thập phân, ví dụ 3.5","B. Không có phần thập phân","C. Chỉ số âm","D. Chỉ số dương"],"answer":"A","explain":"Số thực có thể có phần thập phân, ví dụ 3.5, -0.25.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các giá trị sau, giá trị nào thuộc kiểu số thực?","options":["A. 100","B. -7","C. 2.5","D. “2.5”"],"answer":"C","explain":"2.5 có phần thập phân nên là số thực. “2.5” trong ngoặc kép là văn bản.","points":0.25},{"type":"mcq","level":"NB","q":"Phép “nối xâu” thực hiện điều gì?","options":["A. Ghép hai xâu kí tự thành một xâu dài hơn","B. Cộng hai số","C. Xóa xâu","D. Đảo ngược xâu"],"answer":"A","explain":"Nối xâu là ghép hai xâu thành một, ví dụ “Tin” + “ học” = “Tin học”.","points":0.25},{"type":"mcq","level":"TH","q":"Kết quả của phép nối xâu “20” + “24” là","options":["A. 44","B. “2024”","C. 2024","D. Lỗi"],"answer":"B","explain":"Đây là nối hai xâu kí tự nên kết quả là xâu “2024”, không phải phép cộng số học.","points":0.25},{"type":"mcq","level":"VDC","q":"Một chương trình cần lưu “số điện thoại” để hiển thị và tìm kiếm, không tính toán. Chọn kiểu dữ liệu và giải thích đúng là","options":["A. Kiểu số vì toàn chữ số","B. Kiểu văn bản vì số điện thoại có thể bắt đầu bằng số 0 và không tham gia tính toán","C. Kiểu lôgic","D. Kiểu ngày tháng"],"answer":"B","explain":"Số điện thoại bắt đầu bằng 0 (số 0 đầu sẽ mất nếu lưu kiểu số) và không tính toán nên dùng kiểu văn bản.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về dữ liệu văn bản:","statements":["a) Văn bản gồm các kí tự","b) Dấu cách cũng là một kí tự","c) Chữ số trong văn bản không dùng để tính toán","d) Văn bản không thể lưu trong máy tính"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: dấu cách có mã riêng. c) Đúng: khi là văn bản thì chỉ để hiển thị. d) Sai: văn bản được mã hóa và lưu bình thường.","points":1},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về kiểu dữ liệu trong bảng tính:","statements":["a) Cột họ tên nên dùng kiểu văn bản","b) Cột điểm số nên dùng kiểu số để tính trung bình","c) Cột ngày sinh nên dùng kiểu ngày tháng","d) Mọi cột đều nên dùng kiểu văn bản cho đơn giản"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: chọn đúng kiểu mới tính toán, sắp xếp đúng được.","points":1},{"type":"short","level":"TH","q":"Bảng mã có thể biểu diễn kí tự của mọi ngôn ngữ trên thế giới, gồm cả tiếng Việt có dấu, tên là gì?","answer":"Unicode","explain":"Unicode là bảng mã thống nhất cho mọi ngôn ngữ.","points":0.5},{"type":"short","level":"VD","q":"Một mật khẩu văn bản gồm 10 kí tự, mỗi kí tự mã hóa bằng 1 byte. Hỏi mật khẩu chiếm bao nhiêu byte?","answer":"10","explain":"10 kí tự × 1 byte = 10 byte.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Dữ liệu số gồm","options":["A. Số nguyên và số thực","B. Chữ cái và chữ số","C. Hình ảnh và âm thanh","D. Đúng và sai"],"answer":"A","explain":"Dữ liệu số gồm số nguyên (không phần thập phân) và số thực (có phần thập phân).","points":0.25},{"type":"mcq","level":"NB","q":"Trong tin học, số thực thường được viết với","options":["A. Dấu phẩy","B. Dấu chấm","C. Dấu hai chấm","D. Dấu chấm phẩy"],"answer":"B","explain":"Trong tin học, phần thập phân của số thực viết bằng dấu chấm, ví dụ 3.14.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị nào sau đây KHÔNG phải số nguyên?","options":["A. 0","B. -100","C. 25","D. 4.0"],"answer":"D","explain":"4.0 có phần thập phân nên được xem là số thực, không phải số nguyên.","points":0.25},{"type":"mcq","level":"TH","q":"Khi soạn thảo văn bản, việc chọn phông chữ Unicode giúp","options":["A. Hiển thị đúng chữ có dấu tiếng Việt","B. Văn bản chạy nhanh hơn","C. File nhẹ hơn","D. Tự động sửa lỗi chính tả"],"answer":"A","explain":"Phông Unicode chứa đầy đủ kí tự có dấu tiếng Việt nên hiển thị đúng.","points":0.25},{"type":"mcq","level":"VDC","q":"Một cơ sở dữ liệu lưu điểm thi. Trường “Điểm” để kiểu số thực, trường “Xếp loại” (Giỏi, Khá...) để kiểu văn bản. Lí do đúng là","options":["A. Để tiết kiệm bộ nhớ","B. Điểm cần tính toán nên dùng kiểu số; xếp loại là nhãn phân loại nên dùng văn bản","C. Để đẹp mắt","D. Không có lí do"],"answer":"B","explain":"Chọn kiểu dữ liệu phải phù hợp với bản chất và phép xử lí: điểm tính toán, xếp loại chỉ để phân loại.","points":0.25},{"type":"mcq","level":"VD","q":"Biết mã ASCII của kí tự “A” là 65 và “a” là 97. Mã của “B” là","options":["A. 66","B. 98","C. 65","D. 97"],"answer":"A","explain":"Chữ in hoa liên tiếp có mã liên tiếp: B = A + 1 = 66.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về số trong tin học:","statements":["a) Số nguyên không có phần thập phân","b) Số thực có thể có phần thập phân","c) Trong tin học, số thực viết phần thập phân bằng dấu chấm","d) Số 0 không phải là số nguyên"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: 0 là số nguyên.","points":1},{"type":"truefalse","level":"VDC","q":"Một bạn nhập điểm “9.5” nhưng máy tính báo lỗi định dạng. Các phát biểu:","statements":["a) Có thể do ô nhập yêu cầu kiểu số nguyên","b) Có thể do nhập dấu phẩy thay vì dấu chấm","c) Lỗi này không thể khắc phục","d) Cần nhập đúng định dạng mà phần mềm yêu cầu"],"answer":["T","T","F","T"],"explain":"a) Đúng: số nguyên không nhận phần thập phân. b) Đúng: tin học dùng dấu chấm. c) Sai: sửa định dạng là được. d) Đúng.","points":1},{"type":"short","level":"NB","q":"Trong bảng mã ASCII, kí tự “0” đến “9” là các kí tự thuộc nhóm nào?","answer":"chữ số","explain":"Các kí tự từ 0 đến 9 là chữ số.","points":0.5},{"type":"short","level":"VDC","q":"Một đoạn văn bản có 500 kí tự ASCII. Nếu chuyển sang mã hóa mỗi kí tự 2 byte thì đoạn văn bản chiếm bao nhiêu byte?","answer":"1000","explain":"500 × 2 = 1000 byte.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Kiểu dữ liệu lôgic gồm các giá trị","options":["A. Đúng và sai","B. 0 đến 9","C. A đến Z","D. Âm và dương"],"answer":"A","explain":"Kiểu lôgic chỉ nhận hai giá trị: đúng (true) và sai (false).","points":0.25},{"type":"mcq","level":"NB","q":"Ví dụ nào sau đây là dữ liệu kiểu lôgic?","options":["A. “Hà Nội”","B. 100","C. Đúng","D. 3.14"],"answer":"C","explain":"“Đúng” là giá trị lôgic; các đáp án còn lại là văn bản hoặc số.","points":0.25},{"type":"mcq","level":"NB","q":"Kiểu lôgic thường dùng để","options":["A. Lưu trạng thái bật/tắt, có/không của một điều kiện","B. Lưu văn bản dài","C. Lưu hình ảnh","D. Tính diện tích"],"answer":"A","explain":"Kiểu lôgic lưu các trạng thái hai giá trị như bật/tắt, đã nộp/chưa nộp.","points":0.25},{"type":"mcq","level":"TH","q":"Trong bảng điểm, cột “Đạt/Không đạt” nên dùng kiểu dữ liệu nào?","options":["A. Số nguyên","B. Lôgic","C. Hình ảnh","D. Âm thanh"],"answer":"B","explain":"Đạt/Không đạt là hai trạng thái đối lập, phù hợp kiểu lôgic.","points":0.25},{"type":"mcq","level":"VD","q":"Một form đăng kí có ô “Đã đọc điều khoản” dạng tích chọn. Kiểu dữ liệu phù hợp là","options":["A. Văn bản","B. Số thực","C. Lôgic","D. Ngày tháng"],"answer":"C","explain":"Tích chọn chỉ có hai trạng thái chọn/không chọn nên dùng kiểu lôgic.","points":0.25},{"type":"mcq","level":"VDC","q":"Một hệ thống điểm danh ghi “Có mặt” hoặc “Vắng mặt” cho từng học sinh mỗi buổi. Để thống kê số buổi vắng nhanh nhất, nên lưu dưới dạng","options":["A. Văn bản “Có mặt/Vắng mặt”","B. Kiểu lôgic (ví dụ đúng = có mặt)","C. Hình ảnh","D. Ghi tay ra giấy"],"answer":"B","explain":"Kiểu lôgic gọn nhẹ và máy tính đếm các giá trị đúng/sai rất nhanh, thuận tiện thống kê.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về kiểu lôgic:","statements":["a) Kiểu lôgic có hai giá trị đúng và sai","b) Có thể dùng kiểu lôgic để lưu trạng thái bật/tắt","c) Kiểu lôgic dùng để lưu văn bản dài","d) Kết quả của một phép so sánh là giá trị lôgic"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: văn bản dùng kiểu xâu kí tự. d) Đúng: so sánh cho kết quả đúng hoặc sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về chọn kiểu dữ liệu:","statements":["a) Nên chọn kiểu dữ liệu phù hợp với bản chất thông tin","b) Điểm số nên dùng kiểu số","c) Họ tên nên dùng kiểu văn bản","d) Kiểu dữ liệu không ảnh hưởng đến việc xử lí"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: chọn sai kiểu sẽ không tính toán, sắp xếp đúng được.","points":1},{"type":"short","level":"TH","q":"Hai giá trị của kiểu dữ liệu lôgic trong tiếng Anh thường viết là gì?","answer":"true false","explain":"Kiểu lôgic nhận giá trị true (đúng) hoặc false (sai).","points":0.5},{"type":"short","level":"VD","q":"Một lớp có 40 học sinh, mỗi bạn được ghi nhận “đạt” hoặc “không đạt” (1 bit). Hỏi cần bao nhiêu bit để lưu kết quả cả lớp?","answer":"40","explain":"Mỗi bạn 1 bit, 40 bạn cần 40 bit.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Bảng mã là","options":["A. Quy ước mã hóa mỗi kí tự thành một dãy bit xác định","B. Một loại bàn phím","C. Một phần mềm gõ tiếng Việt","D. Một loại phông chữ"],"answer":"A","explain":"Bảng mã là bảng quy ước tương ứng giữa kí tự và dãy bit mã hóa nó.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác nhau cơ bản giữa ASCII và Unicode là","options":["A. ASCII chỉ mã hóa được 256 kí tự, Unicode mã hóa được mọi kí tự của mọi ngôn ngữ","B. ASCII mới hơn Unicode","C. Unicode chỉ dùng cho tiếng Anh","D. Không có điểm khác nhau"],"answer":"A","explain":"ASCII giới hạn 256 kí tự, còn Unicode bao phủ mọi ngôn ngữ trên thế giới.","points":0.25},{"type":"mcq","level":"NB","q":"Khi soạn văn bản tiếng Việt, cần","options":["A. Bộ gõ tiếng Việt và phông chữ hỗ trợ Unicode","B. Chỉ cần bàn phím","C. Máy in màu","D. Mạng Internet"],"answer":"A","explain":"Gõ tiếng Việt có dấu cần bộ gõ (như Unikey) và phông Unicode để hiển thị đúng.","points":0.25},{"type":"mcq","level":"VD","q":"Một email gõ tiếng Việt nhưng người nhận thấy chữ lạ. Nguyên nhân có thể nhất là","options":["A. Email bị virus","B. Sai bảng mã hoặc thiếu phông Unicode ở máy người nhận","C. Mạng yếu","D. Email quá dài"],"answer":"B","explain":"Chữ lạ khi hiển thị tiếng Việt thường do lệch bảng mã hoặc thiếu phông chữ phù hợp.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty lưu trữ 1 triệu bản ghi khách hàng, mỗi bản ghi có trường “Họ tên” trung bình 30 kí tự. Nếu dùng mã 1 byte mỗi kí tự thay vì 2 byte thì tiết kiệm được","options":["A. 30 MB","B. 30 byte","C. 60 MB","D. 15 MB"],"answer":"A","explain":"Mỗi bản ghi tiết kiệm 30 byte. 1 triệu bản ghi tiết kiệm 30 triệu byte ≈ 30 MB (làm tròn).","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao các hệ thống hiện đại ưu tiên dùng Unicode (UTF-8) thay vì ASCII?","options":["A. Vì ASCII đã lỗi thời hoàn toàn","B. Vì UTF-8 tương thích ngược với ASCII và mã hóa được mọi ngôn ngữ","C. Vì UTF-8 luôn nhẹ hơn ASCII","D. Vì ASCII không mã hóa được chữ số"],"answer":"B","explain":"UTF-8 mã hóa 128 kí tự đầu giống hệt ASCII (tương thích ngược) đồng thời mở rộng cho mọi ngôn ngữ.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về bảng mã:","statements":["a) Bảng mã quy định cách mã hóa kí tự thành dãy bit","b) ASCII là một bảng mã","c) Unicode là một bảng mã","d) Không có bảng mã thì máy tính vẫn lưu được văn bản"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: phải có bảng mã mới mã hóa được kí tự.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về gõ tiếng Việt:","statements":["a) Cần bộ gõ tiếng Việt để gõ có dấu","b) Phông chữ phải hỗ trợ Unicode mới hiển thị đúng","c) Gõ tiếng Việt không cần quan tâm bảng mã","d) Kiểu gõ Telex và VNI là hai kiểu gõ phổ biến"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: sai bảng mã gây lỗi chữ. d) Đúng.","points":1},{"type":"short","level":"NB","q":"Phần mềm gõ tiếng Việt phổ biến nhất ở Việt Nam có tên là gì?","answer":"Unikey","explain":"Unikey là bộ gõ tiếng Việt miễn phí, phổ biến nhất.","points":0.5},{"type":"short","level":"VDC","q":"Chuẩn mã hóa biến đổi dùng 1 đến 4 byte cho mỗi kí tự, tương thích ngược với ASCII, có tên là gì?","answer":"UTF-8","explain":"UTF-8 là cách mã hóa Unicode phổ biến nhất trên Internet.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Dữ liệu văn bản được máy tính xử lí dưới dạng","options":["A. Dãy bit theo bảng mã","B. Hình vẽ","C. Âm thanh","D. Sóng điện"],"answer":"A","explain":"Văn bản được mã hóa thành dãy bit theo bảng mã để máy tính lưu trữ và xử lí.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các phép sau, phép nào thực hiện được trên xâu kí tự?","options":["A. Nối xâu","B. Chia xâu","C. Khai căn xâu","D. Lũy thừa xâu"],"answer":"A","explain":"Xâu kí tự có phép nối xâu, so sánh, trích kí tự; không có phép chia, khai căn như số học.","points":0.25},{"type":"mcq","level":"VD","q":"Sắp xếp danh sách họ tên theo thứ tự từ điển (A đến Z) là phép xử lí trên kiểu dữ liệu","options":["A. Số nguyên","B. Văn bản","C. Lôgic","D. Hình ảnh"],"answer":"B","explain":"Sắp xếp họ tên là so sánh xâu kí tự theo thứ tự từ điển.","points":0.25},{"type":"mcq","level":"TH","q":"Một xâu “Tin10” có độ dài","options":["A. 4","B. 5","C. 6","D. 10"],"answer":"B","explain":"Xâu “Tin10” gồm các kí tự T, i, n, 1, 0 — tổng 5 kí tự.","points":0.25},{"type":"mcq","level":"VDC","q":"Một hệ thống yêu cầu mật khẩu dài từ 8 đến 16 kí tự. Kiểm tra “độ dài mật khẩu có hợp lệ không” cho kết quả kiểu dữ liệu nào?","options":["A. Số nguyên","B. Văn bản","C. Lôgic","D. Số thực"],"answer":"C","explain":"Kết quả kiểm tra chỉ có hợp lệ hoặc không hợp lệ — hai giá trị nên dùng kiểu lôgic.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong bảng mã ASCII, thứ tự mã của các kí tự số “0” đến “9” là","options":["A. Ngẫu nhiên","B. Liên tiếp tăng dần","C. Liên tiếp giảm dần","D. Giống hệt chữ cái"],"answer":"B","explain":"Các chữ số 0–9 có mã ASCII liên tiếp tăng dần từ 48 đến 57.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về xử lí văn bản:","statements":["a) Có thể đếm số kí tự của một xâu","b) Có thể nối hai xâu thành một","c) Có thể so sánh hai xâu theo thứ tự từ điển","d) Có thể cộng hai xâu như cộng hai số"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: “cộng” hai xâu thực chất là nối xâu, không phải cộng số học.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về lưu trữ văn bản:","statements":["a) Văn bản ASCII mỗi kí tự chiếm 1 byte","b) Văn bản càng dài thì dung lượng càng lớn","c) Nén văn bản giúp giảm dung lượng lưu trữ","d) Văn bản không thể gửi qua email"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: văn bản gửi qua email bình thường.","points":1},{"type":"short","level":"TH","q":"Phép ghép hai xâu kí tự thành một xâu dài hơn gọi là phép gì?","answer":"nối xâu","explain":"Phép nối xâu ghép hai xâu thành một.","points":0.5},{"type":"short","level":"VD","q":"Xâu “Sào Báy” (kể cả dấu cách) có độ dài bao nhiêu kí tự?","answer":"7","explain":"Các kí tự: S, à, o, dấu cách, B, á, y — tổng 7 kí tự.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Kiểu dữ liệu ngày tháng dùng để","options":["A. Lưu các mốc thời gian như ngày sinh, ngày thi","B. Tính diện tích","C. Lưu hình ảnh","D. Phát nhạc"],"answer":"A","explain":"Kiểu ngày tháng lưu các giá trị thời gian: ngày sinh, ngày thi, hạn nộp bài.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của việc lưu ngày sinh dạng kiểu ngày tháng thay vì văn bản là","options":["A. Đẹp hơn","B. Tính được tuổi, sắp xếp và lọc theo thời gian chính xác","C. Nhẹ hơn","D. Không cần nhập năm"],"answer":"B","explain":"Kiểu ngày tháng cho phép tính toán (tuổi, số ngày) và sắp xếp đúng theo thời gian.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các kiểu dữ liệu sau, kiểu nào KHÔNG phải kiểu cơ bản trong bài học?","options":["A. Số nguyên","B. Số thực","C. Xâu kí tự","D. Video"],"answer":"D","explain":"Các kiểu cơ bản gồm số nguyên, số thực, kí tự, xâu kí tự, lôgic. Video là dữ liệu đa phương tiện phức tạp.","points":0.25},{"type":"mcq","level":"VD","q":"Một bảng quản lí mượn sách có các trường: Mã sách, Tên sách, Ngày mượn, Đã trả. Kiểu dữ liệu phù hợp lần lượt là","options":["A. Văn bản, văn bản, ngày tháng, lôgic","B. Số, số, số, số","C. Văn bản, văn bản, văn bản, văn bản","D. Lôgic, lôgic, lôgic, lôgic"],"answer":"A","explain":"Mã sách và tên sách là văn bản; ngày mượn là ngày tháng; đã trả chỉ có hai trạng thái nên dùng lôgic.","points":0.25},{"type":"mcq","level":"VD","q":"Nhập ngày “30/02/2024” vào ô kiểu ngày tháng, máy báo lỗi vì","options":["A. Máy bị hỏng","B. Tháng 2 không có ngày 30 — dữ liệu không hợp lệ với kiểu ngày tháng","C. Chưa kết nối mạng","D. Thiếu dấu cách"],"answer":"B","explain":"Kiểu ngày tháng kiểm tra tính hợp lệ: tháng 2 năm 2024 chỉ có 29 ngày.","points":0.25},{"type":"mcq","level":"VDC","q":"Một phần mềm cần tính số ngày nghỉ phép còn lại = 12 − số ngày đã nghỉ. Các trường dữ liệu nên dùng kiểu","options":["A. Văn bản","B. Số nguyên","C. Lôgic","D. Hình ảnh"],"answer":"B","explain":"Số ngày là số đếm được, cần phép trừ số học nên dùng kiểu số nguyên.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét bảng quản lí học sinh với các trường: Họ tên, Điểm trung bình, Ngày sinh, Đoàn viên. Các phát biểu:","statements":["a) Họ tên nên dùng kiểu văn bản","b) Điểm trung bình nên dùng kiểu số thực","c) Ngày sinh nên dùng kiểu ngày tháng","d) Đoàn viên (có/không) nên dùng kiểu lôgic"],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng: chọn kiểu phù hợp với bản chất từng trường dữ liệu.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về kiểu dữ liệu:","statements":["a) Cùng một thông tin có thể chọn kiểu dữ liệu khác nhau tùy mục đích","b) Chọn đúng kiểu giúp xử lí chính xác và hiệu quả","c) Kiểu văn bản có thể lưu được chữ số","d) Kiểu số có thể lưu được chữ cái"],"answer":["T","T","T","F"],"explain":"a) Đúng: ví dụ số điện thoại. b) Đúng. c) Đúng: chữ số là kí tự. d) Sai: kiểu số không lưu chữ cái.","points":1},{"type":"short","level":"NB","q":"Kiểu dữ liệu dùng để lưu các mốc thời gian như ngày sinh có tên là gì?","answer":"ngày tháng","explain":"Kiểu ngày tháng (date/time) lưu các giá trị thời gian.","points":0.5},{"type":"short","level":"VD","q":"Năm 2024 là năm nhuận, tháng 2 có bao nhiêu ngày?","answer":"29","explain":"Năm nhuận tháng 2 có 29 ngày.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Mỗi kí tự trong bảng mã ASCII mở rộng được biểu diễn bằng","options":["A. 1 byte","B. 1 bit","C. 2 byte","D. 4 byte"],"answer":"A","explain":"ASCII mở rộng dùng 8 bit = 1 byte cho mỗi kí tự.","points":0.25},{"type":"mcq","level":"TH","q":"Một file văn bản ASCII có 2048 kí tự thì dung lượng là","options":["A. 2048 byte","B. 2 byte","C. 2048 bit","D. 16 KB"],"answer":"A","explain":"Mỗi kí tự 1 byte nên 2048 kí tự chiếm 2048 byte.","points":0.25},{"type":"mcq","level":"VD","q":"Đổi 2048 byte ra KB được","options":["A. 2 KB","B. 20 KB","C. 2048 KB","D. 1 KB"],"answer":"A","explain":"2048 ÷ 1024 = 2 KB.","points":0.25},{"type":"mcq","level":"VD","q":"Một trang web hiển thị đúng tiếng Việt trên mọi trình duyệt hiện đại chủ yếu nhờ","options":["A. Dùng bảng mã Unicode (UTF-8)","B. Dùng phông chữ đẹp","C. Tốc độ mạng nhanh","D. Máy chủ mạnh"],"answer":"A","explain":"UTF-8 là chuẩn mã hóa web toàn cầu, hiển thị đúng mọi ngôn ngữ.","points":0.25},{"type":"mcq","level":"VDC","q":"Một tin nhắn SMS dùng bảng mã 7 bit chứa tối đa 160 kí tự. Nếu dùng bảng mã 16 bit thì với cùng dung lượng chứa được","options":["A. 160 kí tự","B. 80 kí tự","C. 70 kí tự","D. 320 kí tự"],"answer":"C","explain":"Dung lượng = 160 × 7 = 1120 bit. Với 16 bit mỗi kí tự: 1120 ÷ 16 = 70 kí tự.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai file văn bản có nội dung giống hệt nhau nhưng dung lượng khác nhau. Nguyên nhân hợp lí nhất là","options":["A. Hai file dùng bảng mã khác nhau","B. Một file bị virus","C. Tên file khác nhau","D. Lưu ở ổ đĩa khác nhau"],"answer":"A","explain":"Cùng nội dung nhưng mã hóa khác nhau (ví dụ ASCII 1 byte so với UTF-16 2 byte) cho dung lượng khác nhau.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về ASCII:","statements":["a) ASCII dùng 8 bit cho mỗi kí tự (bản mở rộng)","b) ASCII mã hóa được 256 kí tự","c) ASCII đủ để biểu diễn tiếng Việt có dấu","d) ASCII phù hợp với văn bản tiếng Anh"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về Unicode:","statements":["a) Unicode mã hóa được kí tự mọi ngôn ngữ","b) UTF-8 là một cách mã hóa Unicode","c) Tiếng Việt có dấu cần Unicode mới hiển thị đúng","d) Unicode chỉ dùng cho các ngôn ngữ châu Á"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: Unicode cho mọi ngôn ngữ.","points":1},{"type":"short","level":"TH","q":"Số bit dùng để mã hóa một kí tự trong bảng mã ASCII mở rộng là bao nhiêu?","answer":"8","explain":"ASCII mở rộng dùng 8 bit mỗi kí tự.","points":0.5},{"type":"short","level":"VD","q":"Một văn bản ASCII dài 3 KB có khoảng bao nhiêu kí tự?","answer":"3072","explain":"3 KB = 3072 byte, mỗi kí tự 1 byte nên khoảng 3072 kí tự.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Trong các giá trị sau, giá trị nào là xâu kí tự?","options":["A. 2024","B. “2024”","C. 20.24","D. Đúng"],"answer":"B","explain":"“2024” đặt trong ngoặc kép là xâu kí tự.","points":0.25},{"type":"mcq","level":"TH","q":"Kết quả của phép nối xâu “Học” + “ tốt” là","options":["A. “Học tốt”","B. “Họctốt”","C. “Học + tốt”","D. Lỗi"],"answer":"A","explain":"Nối xâu ghép nguyên văn hai xâu, giữ nguyên dấu cách: “Học” + “ tốt” = “Học tốt”.","points":0.25},{"type":"mcq","level":"VD","q":"Một xâu có độ dài 12 kí tự ASCII chiếm bao nhiêu byte?","options":["A. 12 byte","B. 12 bit","C. 24 byte","D. 96 byte"],"answer":"A","explain":"Mỗi kí tự ASCII 1 byte nên 12 kí tự chiếm 12 byte.","points":0.25},{"type":"mcq","level":"VD","q":"Trong bảng mã ASCII, biết mã của “0” là 48. Mã của “5” là","options":["A. 48","B. 53","C. 55","D. 58"],"answer":"B","explain":"Các chữ số có mã liên tiếp: “5” = 48 + 5 = 53.","points":0.25},{"type":"mcq","level":"VDC","q":"Một hệ thống lưu mã PIN gồm 6 chữ số, mỗi chữ số mã hóa 4 bit (dạng BCD). Mã PIN chiếm","options":["A. 6 byte","B. 24 bit","C. 48 bit","D. 6 bit"],"answer":"B","explain":"6 chữ số × 4 bit = 24 bit.","points":0.25},{"type":"mcq","level":"VDC","q":"Một file văn bản tiếng Việt UTF-8 có 1000 kí tự, trong đó 600 kí tự có dấu (2 byte) và 400 kí tự không dấu (1 byte). Dung lượng file là","options":["A. 1000 byte","B. 1600 byte","C. 2000 byte","D. 1400 byte"],"answer":"B","explain":"600 × 2 + 400 × 1 = 1200 + 400 = 1600 byte.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về độ dài xâu:","statements":["a) Độ dài xâu là số kí tự của xâu","b) Dấu cách được tính là một kí tự","c) Xâu rỗng có độ dài bằng 1","d) Kí tự có dấu tiếng Việt cũng được tính là kí tự"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: xâu rỗng có độ dài 0. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về chọn bảng mã:","statements":["a) Văn bản chỉ có tiếng Anh có thể dùng ASCII","b) Văn bản tiếng Việt nên dùng Unicode","c) Trang web hiện đại thường dùng UTF-8","d) Dùng bảng mã nào cũng hiển thị đúng mọi ngôn ngữ"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: ASCII không đủ cho tiếng Việt.","points":1},{"type":"short","level":"TH","q":"Xâu không chứa kí tự nào được gọi là xâu gì?","answer":"xâu rỗng","explain":"Xâu rỗng có độ dài bằng 0.","points":0.5},{"type":"short","level":"VD","q":"Trong bảng mã ASCII, kí tự “A” có mã 65. Hỏi kí tự “E” có mã bao nhiêu?","answer":"69","explain":"65 + 4 = 69.","points":0.5}]}]}
