<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Thông tin là gì?","options":["A. Những hiểu biết của con người về thế giới xung quanh và về chính mình","B. Các con số được lưu trong máy tính","C. Tín hiệu điện trong dây dẫn","D. Các chương trình chạy trên máy tính"],"answer":"A","explain":"Thông tin là những hiểu biết của con người về thế giới xung quanh và về chính mình, thu nhận được qua quan sát, học tập và trải nghiệm.","points":0.25},{"type":"mcq","level":"NB","q":"Đơn vị nhỏ nhất dùng để đo lượng thông tin là","options":["A. Byte","B. Bit","C. Kilobyte","D. Megabyte"],"answer":"B","explain":"Bit là đơn vị nhỏ nhất để đo lượng thông tin, chỉ nhận một trong hai giá trị 0 hoặc 1.","points":0.25},{"type":"mcq","level":"NB","q":"Một byte bằng bao nhiêu bit?","options":["A. 2 bit","B. 4 bit","C. 8 bit","D. 16 bit"],"answer":"C","explain":"Theo quy ước, 1 byte = 8 bit.","points":0.25},{"type":"mcq","level":"TH","q":"1 KB bằng bao nhiêu byte?","options":["A. 1000 byte","B. 1024 byte","C. 8000 byte","D. 1024 bit"],"answer":"B","explain":"Trong tin học, 1 KB = 1024 byte (2 mũ 10 byte).","points":0.25},{"type":"mcq","level":"TH","q":"Hoạt động nào sau đây KHÔNG thuộc quá trình xử lí thông tin?","options":["A. Thu nhận thông tin từ micro","B. Lưu trữ bài hát vào thẻ nhớ","C. In văn bản ra giấy","D. Ngắt điện máy tính"],"answer":"D","explain":"Xử lí thông tin gồm thu nhận, lưu trữ, xử lí và truyền thông tin. Ngắt điện máy tính không phải hoạt động xử lí thông tin.","points":0.25},{"type":"mcq","level":"TH","q":"Khi em nghe thầy cô giảng bài và ghi nhớ kiến thức, em đang thực hiện hoạt động nào?","options":["A. Thu nhận và lưu trữ thông tin","B. Truyền thông tin","C. Mã hóa chương trình","D. Xóa thông tin"],"answer":"A","explain":"Nghe giảng là thu nhận thông tin qua thính giác, ghi nhớ là lưu trữ thông tin trong trí nhớ.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về thông tin và dữ liệu:","statements":["a) Dữ liệu là thông tin đã được ghi lại bằng các kí hiệu, có thể lưu trữ và xử lí được","b) Thông tin và dữ liệu là hai khái niệm hoàn toàn giống nhau","c) Cùng một dữ liệu có thể mang thông tin khác nhau đối với những người khác nhau","d) Âm thanh, hình ảnh, chữ viết đều có thể là dạng thể hiện của dữ liệu"],"answer":["T","F","T","T"],"explain":"a) Đúng: dữ liệu là dạng vật chất của thông tin. b) Sai: thông tin là nội dung hiểu biết, dữ liệu là dạng ghi lại của thông tin. c) Đúng: ví dụ bảng điểm mang thông tin khác nhau với học sinh và giáo viên. d) Đúng: dữ liệu có nhiều dạng thể hiện.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về đơn vị đo thông tin:","statements":["a) Bit chỉ nhận hai giá trị 0 và 1","b) 1 byte = 8 bit","c) 1 MB = 1000 KB","d) Kí hiệu của bit là b viết thường, của byte là B viết hoa"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: 1 MB = 1024 KB. d) Đúng: quy ước quốc tế viết bit là b thường, byte là B hoa.","points":1},{"type":"short","level":"VD","q":"Một bức ảnh có dung lượng 3 MB. Hỏi bức ảnh đó có dung lượng bao nhiêu KB?","answer":"3072","explain":"1 MB = 1024 KB nên 3 MB = 3 × 1024 = 3072 KB.","points":0.5},{"type":"short","level":"VDC","q":"Một đoạn văn bản gồm 2000 kí tự, mỗi kí tự được mã hóa bằng 1 byte. Hỏi đoạn văn bản chiếm bao nhiêu bit?","answer":"16000","explain":"2000 kí tự × 1 byte = 2000 byte. 2000 byte × 8 = 16000 bit.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Con người thu nhận thông tin từ thế giới xung quanh chủ yếu bằng","options":["A. Các giác quan: mắt, tai, mũi, lưỡi, da","B. Máy đo chuyên dụng","C. Sách vở","D. Internet"],"answer":"A","explain":"Con người thu nhận thông tin bằng các giác quan: thị giác, thính giác, khứu giác, vị giác và xúc giác.","points":0.25},{"type":"mcq","level":"NB","q":"Bộ phận nào của máy tính thực hiện việc xử lí thông tin?","options":["A. Màn hình","B. Bộ xử lí trung tâm (CPU)","C. Loa","D. Máy in"],"answer":"B","explain":"CPU (Central Processing Unit) là bộ xử lí trung tâm, thực hiện các phép tính và xử lí dữ liệu.","points":0.25},{"type":"mcq","level":"NB","q":"Thiết bị nào sau đây dùng để ĐƯA thông tin vào máy tính?","options":["A. Màn hình","B. Máy in","C. Bàn phím","D. Loa"],"answer":"C","explain":"Bàn phím là thiết bị nhập, dùng để đưa thông tin vào máy tính. Màn hình, máy in, loa là thiết bị xuất.","points":0.25},{"type":"mcq","level":"TH","q":"Sắp xếp đúng trình tự các hoạt động xử lí thông tin của máy tính:","options":["A. Xử lí → Thu nhận → Lưu trữ → Xuất","B. Thu nhận → Xử lí → Lưu trữ → Xuất","C. Thu nhận → Lưu trữ → Xuất → Xử lí","D. Lưu trữ → Thu nhận → Xử lí → Xuất"],"answer":"B","explain":"Mô hình xử lí thông tin: thu nhận (input) → xử lí (process) → lưu trữ (storage) → xuất/truyền (output).","points":0.25},{"type":"mcq","level":"TH","q":"1 GB bằng bao nhiêu MB?","options":["A. 1000 MB","B. 1024 MB","C. 1024 KB","D. 8 MB"],"answer":"B","explain":"1 GB = 1024 MB.","points":0.25},{"type":"mcq","level":"VDC","q":"Một USB 16 GB đã dùng hết 25% dung lượng. Phần còn trống có thể lưu tối đa bao nhiêu file nhạc, mỗi file 4 MB?","options":["A. 4096 file","B. 3072 file","C. 2048 file","D. 1024 file"],"answer":"B","explain":"Còn trống 16 × 75% = 12 GB = 12 × 1024 = 12288 MB. 12288 ÷ 4 = 3072 file.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về xử lí thông tin:","statements":["a) Máy tính thu nhận thông tin qua các thiết bị nhập như bàn phím, chuột, camera","b) Con người xử lí thông tin bằng não bộ","c) Máy tính không thể lưu trữ thông tin","d) Loa và máy in là thiết bị đưa thông tin ra khỏi máy tính"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng: não bộ là trung tâm xử lí thông tin của con người. c) Sai: máy tính lưu trữ trên RAM, ổ cứng, SSD. d) Đúng: loa, máy in là thiết bị xuất.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biểu sau:","statements":["a) Thông tin giúp con người ra quyết định đúng đắn","b) Thông tin chỉ tồn tại dưới dạng chữ viết","c) Tin học là ngành khoa học nghiên cứu về xử lí thông tin tự động bằng máy tính","d) Máy tính là công cụ hỗ trợ đắc lực cho việc xử lí thông tin"],"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai: thông tin tồn tại dưới nhiều dạng: âm thanh, hình ảnh, chữ viết, mùi vị. c) Đúng: đó là định nghĩa ngành tin học. d) Đúng.","points":1},{"type":"short","level":"VD","q":"Đổi 2,5 KB ra byte.","answer":"2560","explain":"1 KB = 1024 byte nên 2,5 KB = 2,5 × 1024 = 2560 byte.","points":0.5},{"type":"short","level":"VDC","q":"Một thẻ nhớ 32 GB đã dùng hết 3/4 dung lượng. Hỏi còn trống bao nhiêu MB?","answer":"8192","explain":"Dung lượng trống = 32 × 1/4 = 8 GB = 8 × 1024 = 8192 MB.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Thông tin trước khi đưa vào máy tính cần được","options":["A. Mã hóa thành dữ liệu","B. In ra giấy","C. Đọc to lên","D. Vẽ thành tranh"],"answer":"A","explain":"Thông tin cần được mã hóa thành dữ liệu (dạng số nhị phân) thì máy tính mới lưu trữ và xử lí được.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các dạng sau, dạng nào KHÔNG phải là dạng thể hiện của thông tin?","options":["A. Văn bản","B. Âm thanh","C. Hình ảnh","D. Chân không"],"answer":"D","explain":"Thông tin được thể hiện qua văn bản, âm thanh, hình ảnh, video... Chân không không phải dạng thể hiện thông tin.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao máy tính chỉ làm việc với hai kí hiệu 0 và 1?","options":["A. Vì 0 và 1 dễ nhớ","B. Vì linh kiện điện tử dễ dàng thể hiện hai trạng thái có điện và không có điện","C. Vì con người chỉ đếm được đến 1","D. Vì 0 và 1 là hai số nguyên tố"],"answer":"B","explain":"Linh kiện điện tử có hai trạng thái vật lí ổn định là có dòng điện và không có dòng điện, tương ứng với 1 và 0, nên máy tính dùng hệ nhị phân.","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào sau đây đúng về vai trò của thông tin?","options":["A. Thông tin chỉ phục vụ giải trí","B. Thông tin là nguồn lực quan trọng, giúp con người nhận thức thế giới và ra quyết định","C. Thông tin không có giá trị kinh tế","D. Thông tin chỉ cần thiết cho nhà khoa học"],"answer":"B","explain":"Thông tin là nguồn lực quan trọng của xã hội: giúp nhận thức thế giới, ra quyết định, sản xuất kinh doanh và phát triển.","points":0.25},{"type":"mcq","level":"NB","q":"1 TB bằng bao nhiêu GB?","options":["A. 1000 GB","B. 1024 GB","C. 1024 MB","D. 8 GB"],"answer":"B","explain":"1 TB = 1024 GB.","points":0.25},{"type":"mcq","level":"VD","q":"Một video dài 10 phút, mỗi giây video chiếm khoảng 2 MB. Dung lượng video xấp xỉ","options":["A. 20 MB","B. 120 MB","C. 1200 MB","D. 600 MB"],"answer":"C","explain":"10 phút = 600 giây. 600 × 2 = 1200 MB.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về mã hóa thông tin:","statements":["a) Mọi thông tin đưa vào máy tính đều được mã hóa thành dãy bit 0 và 1","b) Mã hóa giúp thông tin được lưu trữ lâu dài và truyền đi xa","c) Con người không cần mã hóa thông tin khi giao tiếp với nhau","d) Chữ viết là một cách mã hóa thông tin của con người"],"answer":["T","T","F","T"],"explain":"a) Đúng: máy tính chỉ hiểu dãy bit. b) Đúng. c) Sai: ngôn ngữ, chữ viết chính là mã hóa thông tin để giao tiếp. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về thiết bị máy tính:","statements":["a) Camera là thiết bị thu nhận hình ảnh vào máy tính","b) Màn hình cảm ứng vừa là thiết bị nhập vừa là thiết bị xuất","c) Ổ cứng dùng để xử lí dữ liệu","d) Micro là thiết bị thu nhận âm thanh"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng: nhận chạm (nhập) và hiển thị (xuất). c) Sai: ổ cứng dùng để lưu trữ, CPU mới xử lí. d) Đúng.","points":1},{"type":"short","level":"VD","q":"Một file văn bản có dung lượng 5120 byte. Hỏi file đó có dung lượng bao nhiêu KB?","answer":"5","explain":"5120 ÷ 1024 = 5 KB.","points":0.5},{"type":"short","level":"VDC","q":"Cần truyền một file 24 MB qua đường truyền tốc độ 3 MB mỗi giây. Hỏi mất ít nhất bao nhiêu giây?","answer":"8","explain":"Thời gian = dung lượng ÷ tốc độ = 24 ÷ 3 = 8 giây.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Dãy bit là","options":["A. Dãy các kí hiệu chỉ gồm 0 và 1","B. Dãy các chữ cái","C. Dãy các số từ 0 đến 9","D. Dãy các câu văn"],"answer":"A","explain":"Dãy bit là dãy chỉ gồm hai kí hiệu 0 và 1, là dạng dữ liệu cơ bản trong máy tính.","points":0.25},{"type":"mcq","level":"VD","q":"Với 2 bit có thể biểu diễn tối đa bao nhiêu trạng thái khác nhau?","options":["A. 2 trạng thái","B. 3 trạng thái","C. 4 trạng thái","D. 8 trạng thái"],"answer":"C","explain":"2 bit tạo ra 2 mũ 2 = 4 tổ hợp: 00, 01, 10, 11.","points":0.25},{"type":"mcq","level":"NB","q":"Hoạt động “gửi email cho bạn” thuộc khâu nào của quá trình xử lí thông tin?","options":["A. Thu nhận","B. Lưu trữ","C. Xử lí","D. Truyền thông tin"],"answer":"D","explain":"Gửi email là truyền thông tin từ người này đến người khác qua mạng.","points":0.25},{"type":"mcq","level":"TH","q":"Trong quá trình học trực tuyến, máy tính của em đồng thời thực hiện các hoạt động nào?","options":["A. Chỉ thu nhận","B. Chỉ lưu trữ","C. Thu nhận, xử lí, lưu trữ và truyền thông tin","D. Chỉ truyền thông tin"],"answer":"C","explain":"Học trực tuyến cần camera/micro thu nhận, CPU xử lí, ổ cứng lưu trữ và mạng truyền thông tin hai chiều.","points":0.25},{"type":"mcq","level":"VDC","q":"Một quyển sách dày 300 trang, mỗi trang khoảng 2000 kí tự, mỗi kí tự mã Unicode chiếm 2 byte. Dung lượng sách khi số hóa xấp xỉ","options":["A. 586 KB","B. 1172 KB","C. 2344 KB","D. 1200 KB"],"answer":"B","explain":"300 × 2000 × 2 = 1200000 byte. 1200000 ÷ 1024 ≈ 1171,9 KB, xấp xỉ 1172 KB.","points":0.25},{"type":"mcq","level":"VD","q":"Với 1 byte có thể biểu diễn được bao nhiêu giá trị khác nhau?","options":["A. 8 giá trị","B. 100 giá trị","C. 256 giá trị","D. 1024 giá trị"],"answer":"C","explain":"1 byte = 8 bit, tạo ra 2 mũ 8 = 256 tổ hợp khác nhau (từ 00000000 đến 11111111).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về bit và byte:","statements":["a) Bit là đơn vị nhỏ nhất đo lượng thông tin","b) Byte gồm 8 bit","c) 1 KB = 1024 byte","d) Bit có thể nhận các giá trị 0, 1, 2"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: bit chỉ nhận 0 hoặc 1.","points":1},{"type":"truefalse","level":"VD","q":"Một nhóm học sinh bàn về xử lí thông tin, các phát biểu:","statements":["a) An nói: quét mã QR để lấy thông tin là hoạt động thu nhận","b) Bình nói: tính điểm trung bình bằng bảng tính là hoạt động xử lí","c) Chi nói: chép bài vào vở là hoạt động lưu trữ","d) Dũng nói: máy tính không tham gia vào việc truyền thông tin"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: vở là vật mang tin lưu trữ. d) Sai: máy tính truyền thông tin qua mạng rất hiệu quả.","points":1},{"type":"short","level":"TH","q":"Với 3 bit có thể biểu diễn tối đa bao nhiêu trạng thái khác nhau?","answer":"8","explain":"3 bit tạo ra 2 mũ 3 = 8 tổ hợp khác nhau.","points":0.5},{"type":"short","level":"VDC","q":"Một ổ cứng 1 TB có thể chứa tối đa bao nhiêu file, mỗi file 256 MB (bỏ qua hao hụt)?","answer":"4096","explain":"1 TB = 1024 GB = 1048576 MB. 1048576 ÷ 256 = 4096 file.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Thông tin có thể tồn tại ở những dạng nào?","options":["A. Chỉ dạng văn bản","B. Văn bản, âm thanh, hình ảnh và nhiều dạng khác","C. Chỉ dạng số","D. Chỉ dạng hình ảnh"],"answer":"B","explain":"Thông tin tồn tại ở nhiều dạng: văn bản, âm thanh, hình ảnh, video, mùi, vị...","points":0.25},{"type":"mcq","level":"NB","q":"Thiết bị nào sau đây là thiết bị lưu trữ?","options":["A. Chuột","B. USB","C. Bàn phím","D. Máy quét"],"answer":"B","explain":"USB là thiết bị lưu trữ dữ liệu. Chuột, bàn phím, máy quét là thiết bị nhập.","points":0.25},{"type":"mcq","level":"TH","q":"Khi em chụp ảnh bằng điện thoại và gửi cho bạn qua Zalo, điện thoại đã thực hiện các khâu nào?","options":["A. Thu nhận và truyền","B. Thu nhận, lưu trữ và truyền","C. Chỉ lưu trữ","D. Chỉ xử lí"],"answer":"B","explain":"Camera thu nhận hình ảnh, máy lưu ảnh vào bộ nhớ, rồi truyền qua mạng cho bạn.","points":0.25},{"type":"mcq","level":"NB","q":"1 PB bằng bao nhiêu TB?","options":["A. 1000 TB","B. 1024 TB","C. 1024 GB","D. 8 TB"],"answer":"B","explain":"1 PB = 1024 TB.","points":0.25},{"type":"mcq","level":"VDC","q":"Một camera quay video 4K, mỗi phút video chiếm 400 MB. Thẻ nhớ 64 GB đã dùng 10%. Hỏi quay được tối đa bao nhiêu phút nữa?","options":["A. 163 phút","B. 160 phút","C. 147 phút","D. 150 phút"],"answer":"C","explain":"Còn trống 64 × 90% = 57,6 GB = 57,6 × 1024 = 58982,4 MB. 58982,4 ÷ 400 = 147,456 nên tối đa 147 phút.","points":0.25},{"type":"mcq","level":"NB","q":"Câu nào sau đây nói đúng về mối quan hệ giữa thông tin và quyết định?","options":["A. Thông tin đầy đủ, chính xác giúp ra quyết định đúng","B. Càng ít thông tin càng dễ quyết định đúng","C. Thông tin không ảnh hưởng đến quyết định","D. Chỉ cần cảm tính, không cần thông tin"],"answer":"A","explain":"Thông tin đầy đủ, chính xác, kịp thời là cơ sở để ra quyết định đúng đắn.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về vai trò của tin học:","statements":["a) Tin học giúp tự động hóa việc xử lí thông tin","b) Máy tính xử lí thông tin nhanh và chính xác hơn con người trong nhiều việc","c) Tin học chỉ ứng dụng trong trường học","d) Tin học góp phần hình thành xã hội tri thức"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng: máy tính tính toán nhanh, lưu trữ lớn. c) Sai: tin học ứng dụng trong mọi lĩnh vực. d) Đúng.","points":1},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về vật mang tin:","statements":["a) Giấy, đĩa CD, USB đều là vật mang tin","b) Sóng điện từ có thể mang thông tin đi xa","c) Không khí không thể truyền thông tin","d) Bộ nhớ máy tính là vật mang tin"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng: sóng vô tuyến, wifi truyền thông tin. c) Sai: âm thanh truyền qua không khí. d) Đúng.","points":1},{"type":"short","level":"VD","q":"Một bộ phim có dung lượng 1,5 GB. Hỏi bộ phim chiếm bao nhiêu MB?","answer":"1536","explain":"1,5 × 1024 = 1536 MB.","points":0.5},{"type":"short","level":"VDC","q":"Một trung tâm dữ liệu lưu trữ 5 PB dữ liệu. Hỏi tương đương bao nhiêu TB?","answer":"5120","explain":"5 × 1024 = 5120 TB.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Quá trình xử lí thông tin của con người diễn ra ở đâu?","options":["A. Ở mắt","B. Ở não bộ","C. Ở tay","D. Ở tim"],"answer":"B","explain":"Não bộ là trung tâm xử lí thông tin của con người: tiếp nhận từ giác quan, suy nghĩ, ghi nhớ và ra quyết định.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm giống nhau giữa xử lí thông tin của con người và máy tính là","options":["A. Đều gồm các khâu thu nhận, xử lí, lưu trữ và truyền thông tin","B. Đều dùng điện","C. Đều cần bàn phím","D. Đều lưu trên ổ cứng"],"answer":"A","explain":"Cả con người và máy tính đều thực hiện 4 khâu: thu nhận, xử lí, lưu trữ và truyền thông tin, chỉ khác công cụ thực hiện.","points":0.25},{"type":"mcq","level":"NB","q":"Kí hiệu 1 KB, 1 MB, 1 GB dùng để đo","options":["A. Tốc độ mạng","B. Lượng thông tin (dung lượng)","C. Kích thước màn hình","D. Tốc độ CPU"],"answer":"B","explain":"KB, MB, GB là các đơn vị đo lượng thông tin, dùng để chỉ dung lượng lưu trữ.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các thiết bị sau, thiết bị nào vừa nhập vừa xuất thông tin?","options":["A. Máy in","B. Màn hình cảm ứng","C. Loa","D. Máy chiếu"],"answer":"B","explain":"Màn hình cảm ứng vừa hiển thị (xuất) vừa nhận thao tác chạm (nhập).","points":0.25},{"type":"mcq","level":"VDC","q":"Tải hai bài hát MP3 có dung lượng 5 MB và 7 MB với tốc độ 500 KB mỗi giây. Tổng thời gian tải xong xấp xỉ","options":["A. 10 giây","B. 15 giây","C. 25 giây","D. 35 giây"],"answer":"C","explain":"Tổng 12 MB = 12 × 1024 = 12288 KB. 12288 ÷ 500 = 24,576 giây, xấp xỉ 25 giây.","points":0.25},{"type":"mcq","level":"VDC","q":"Một hệ thống camera gồm 4 camera, mỗi camera ghi 2 GB mỗi giờ. Ổ cứng 2 TB lưu được tối đa bao nhiêu giờ?","options":["A. 256 giờ","B. 250 giờ","C. 1024 giờ","D. 128 giờ"],"answer":"A","explain":"4 camera ghi 8 GB mỗi giờ. 2 TB = 2048 GB. 2048 ÷ 8 = 256 giờ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về thông tin trong đời sống:","statements":["a) Dự báo thời tiết là thông tin giúp con người chủ động trong sản xuất","b) Bảng điểm là dữ liệu mang thông tin về kết quả học tập","c) Biển báo giao thông truyền thông tin đến người tham gia giao thông","d) Thông tin sai lệch không gây hại gì"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: thông tin sai lệch có thể gây thiệt hại lớn, cần kiểm chứng.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biểu sau:","statements":["a) 1 byte gồm 8 bit","b) Máy tính lưu trữ mọi dữ liệu dưới dạng dãy bit","c) Bit là đơn vị lớn hơn byte","d) 1 MB = 1024 KB"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: bit nhỏ hơn byte. d) Đúng.","points":1},{"type":"short","level":"TH","q":"Một tin nhắn văn bản dài 500 kí tự (mỗi kí tự 1 byte) có dung lượng bao nhiêu byte?","answer":"500","explain":"500 kí tự × 1 byte = 500 byte.","points":0.5},{"type":"short","level":"VDC","q":"Một file 40 MB được nén còn 3/4 dung lượng. Hỏi sau khi nén file còn bao nhiêu MB?","answer":"30","explain":"40 × 3/4 = 30 MB.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Thông tin được con người thu nhận chủ yếu qua","options":["A. Sách giáo khoa","B. Các giác quan","C. Ti vi","D. Điện thoại"],"answer":"B","explain":"Các giác quan (mắt, tai, mũi, lưỡi, da) là kênh thu nhận thông tin trực tiếp và chủ yếu của con người.","points":0.25},{"type":"mcq","level":"NB","q":"Dữ liệu là","options":["A. Thông tin đã được ghi lại bằng các kí hiệu","B. Suy nghĩ trong đầu","C. Giấc mơ","D. Cảm xúc"],"answer":"A","explain":"Dữ liệu là thông tin đã được ghi lại (mã hóa) bằng các kí hiệu như chữ, số, hình ảnh, âm thanh để lưu trữ và xử lí.","points":0.25},{"type":"mcq","level":"TH","q":"Trong câu “Hà Nội là thủ đô của Việt Nam”, thông tin được thể hiện dưới dạng","options":["A. Âm thanh","B. Văn bản","C. Hình ảnh","D. Video"],"answer":"B","explain":"Câu văn là dạng văn bản của thông tin.","points":0.25},{"type":"mcq","level":"NB","q":"Đơn vị nào sau đây lớn nhất?","options":["A. 1 MB","B. 1 GB","C. 1024 KB","D. 1 TB"],"answer":"D","explain":"Thứ tự tăng dần: KB → MB → GB → TB → PB. 1 TB là lớn nhất trong các đáp án.","points":0.25},{"type":"mcq","level":"NB","q":"Máy tính điện tử ra đời nhằm mục đích chính là","options":["A. Chơi game","B. Hỗ trợ con người xử lí thông tin tự động","C. Nghe nhạc","D. Vẽ tranh"],"answer":"B","explain":"Máy tính ra đời để hỗ trợ con người xử lí thông tin một cách tự động, nhanh chóng và chính xác.","points":0.25},{"type":"mcq","level":"VDC","q":"Một thư viện số hóa 10000 quyển sách, mỗi quyển trung bình 2 MB và cần dự phòng thêm 10% dung lượng. Cần ổ cứng tối thiểu bao nhiêu GB (làm tròn lên số nguyên)?","options":["A. 20 GB","B. 21 GB","C. 22 GB","D. 25 GB"],"answer":"C","explain":"20000 MB × 110% = 22000 MB = 22000 ÷ 1024 ≈ 21,48 GB, làm tròn lên 22 GB.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về đơn vị đo:","statements":["a) 2 KB = 2048 byte","b) 1 GB = 1048576 KB","c) Nửa MB bằng 500 KB","d) 1 bit có thể lưu được một kí tự"],"answer":["T","T","F","F"],"explain":"a) Đúng: 2 × 1024 = 2048. b) Đúng: 1024 × 1024 = 1048576. c) Sai: nửa MB = 512 KB. d) Sai: 1 kí tự thường cần 1 byte = 8 bit.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về quá trình xử lí thông tin:","statements":["a) Thu nhận là khâu đầu tiên của quá trình xử lí thông tin","b) Kết quả xử lí có thể được lưu trữ để dùng sau","c) Truyền thông tin giúp chia sẻ hiểu biết giữa con người","d) Xử lí thông tin chỉ diễn ra trong máy tính"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: con người cũng xử lí thông tin hằng ngày.","points":1},{"type":"short","level":"VD","q":"Một mật khẩu gồm 8 kí tự, mỗi kí tự 1 byte. Hỏi mật khẩu chiếm bao nhiêu bit?","answer":"64","explain":"8 byte × 8 = 64 bit.","points":0.5},{"type":"short","level":"VDC","q":"Đường truyền tải được 10 MB mỗi giây. Hỏi tải file 2 GB mất ít nhất bao nhiêu giây?","answer":"205","explain":"2 GB = 2048 MB. 2048 ÷ 10 = 204,8 giây, làm tròn lên 205 giây.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Trong các hoạt động sau, hoạt động nào là XỬ LÍ thông tin?","options":["A. Chụp ảnh","B. Tính tổng điểm các môn","C. Lưu ảnh vào máy","D. Gửi ảnh cho bạn"],"answer":"B","explain":"Tính tổng điểm là biến đổi dữ liệu đầu vào thành kết quả mới, tức là xử lí thông tin.","points":0.25},{"type":"mcq","level":"TH","q":"Thông tin và dữ liệu khác nhau ở điểm nào?","options":["A. Không khác nhau","B. Thông tin là nội dung hiểu biết, dữ liệu là dạng ghi lại của thông tin","C. Dữ liệu quan trọng hơn thông tin","D. Thông tin chỉ có trong máy tính"],"answer":"B","explain":"Thông tin là nội dung, ý nghĩa; dữ liệu là dạng vật chất ghi lại thông tin bằng kí hiệu.","points":0.25},{"type":"mcq","level":"NB","q":"Bit là viết tắt của","options":["A. Binary digit (chữ số nhị phân)","B. Big unit","C. Byte information","D. Binary text"],"answer":"A","explain":"Bit là viết tắt của binary digit, nghĩa là chữ số nhị phân (0 hoặc 1).","points":0.25},{"type":"mcq","level":"TH","q":"Một số điện thoại gồm 10 chữ số, mỗi chữ số lưu bằng 1 byte thì chiếm","options":["A. 10 bit","B. 10 byte","C. 80 byte","D. 1 KB"],"answer":"B","explain":"10 chữ số × 1 byte = 10 byte.","points":0.25},{"type":"mcq","level":"VDC","q":"Mỗi học sinh trong lớp 20 bạn được cấp một mã nhị phân 5 bit, sau đó thêm 1 bit kiểm tra lỗi vào cuối mỗi mã. Tổng cộng cần bao nhiêu bit để mã hóa cả lớp?","options":["A. 100 bit","B. 120 bit","C. 140 bit","D. 160 bit"],"answer":"B","explain":"Mỗi mã dài 5 + 1 = 6 bit. 20 học sinh cần 20 × 6 = 120 bit.","points":0.25},{"type":"mcq","level":"VDC","q":"Một file nhạc 8 MB được chia thành các gói tin 512 KB để truyền. Cần bao nhiêu gói tin?","options":["A. 8 gói","B. 16 gói","C. 14 gói","D. 32 gói"],"answer":"B","explain":"8 MB = 8192 KB. 8192 ÷ 512 = 16 gói.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về thông tin:","statements":["a) Thông tin có thể giúp dự báo tương lai","b) Thông tin chính xác, kịp thời có giá trị cao","c) Mọi thông tin trên mạng đều đáng tin cậy","d) Cần kiểm chứng thông tin trước khi sử dụng"],"answer":["T","T","F","T"],"explain":"a) Đúng: ví dụ dự báo thời tiết. b) Đúng. c) Sai: mạng có nhiều tin giả. d) Đúng.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về máy tính:","statements":["a) Bàn phím là thiết bị nhập","b) Màn hình là thiết bị xuất","c) CPU xử lí thông tin","d) Ổ cứng là thiết bị nhập"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: ổ cứng là thiết bị lưu trữ.","points":1},{"type":"short","level":"TH","q":"Đổi 3 GB ra MB.","answer":"3072","explain":"3 × 1024 = 3072 MB.","points":0.5},{"type":"short","level":"VDC","q":"Một mã vạch cần phân biệt 100 mặt hàng khác nhau. Hỏi cần ít nhất bao nhiêu bit để mã hóa?","answer":"7","explain":"6 bit biểu diễn được 64 trạng thái, chưa đủ 100. 7 bit được 128 trạng thái, đủ dùng.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Hoạt động nào sau đây là THU NHẬN thông tin?","options":["A. Đọc báo","B. Viết nhật kí","C. Tính nhẩm","D. Kể chuyện"],"answer":"A","explain":"Đọc báo là tiếp nhận thông tin từ bên ngoài vào, tức thu nhận thông tin.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các thiết bị sau, thiết bị nào dùng để XUẤT thông tin?","options":["A. Bàn phím","B. Chuột","C. Máy in","D. Máy quét"],"answer":"C","explain":"Máy in đưa thông tin từ máy tính ra giấy, là thiết bị xuất.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói “thông tin là nguồn lực” của xã hội hiện đại?","options":["A. Vì thông tin có thể bán được","B. Vì ai nắm được thông tin đầy đủ, chính xác sẽ có lợi thế trong sản xuất và ra quyết định","C. Vì thông tin rất nặng","D. Vì thông tin chỉ dành cho người giàu"],"answer":"B","explain":"Thông tin đầy đủ, chính xác tạo lợi thế cạnh tranh và giúp ra quyết định đúng, nên được coi là nguồn lực quan trọng.","points":0.25},{"type":"mcq","level":"NB","q":"Trong tin học, tiền tố “kilo” (K) có giá trị","options":["A. 1000","B. 1024","C. 100","D. 8"],"answer":"B","explain":"Trong đo lượng thông tin, K = 1024 (2 mũ 10), khác với 1000 trong hệ đo lường thông thường.","points":0.25},{"type":"mcq","level":"TH","q":"Một bức thư điện tử (email) có thể chứa những dạng thông tin nào?","options":["A. Chỉ văn bản","B. Văn bản, hình ảnh, âm thanh, tệp đính kèm","C. Chỉ hình ảnh","D. Chỉ âm thanh"],"answer":"B","explain":"Email hiện đại chứa được văn bản, hình ảnh, âm thanh và tệp đính kèm nhiều định dạng.","points":0.25},{"type":"mcq","level":"VDC","q":"Ổ cứng 500 GB, hệ điều hành và phần mềm chiếm 60 GB. Mỗi video 700 MB cần thêm 5% dung lượng cho siêu dữ liệu. Lưu được tối đa bao nhiêu video?","options":["A. 643 video","B. 613 video","C. 600 video","D. 620 video"],"answer":"B","explain":"Còn trống 440 GB = 450560 MB. Mỗi video thực chiếm 700 × 105% = 735 MB. 450560 ÷ 735 ≈ 613,0 nên tối đa 613 video.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về xử lí thông tin tự động:","statements":["a) Máy tính xử lí thông tin theo chương trình của con người","b) Máy tính có thể tự suy nghĩ như con người","c) Tự động hóa xử lí thông tin giúp tăng năng suất lao động","d) Robot trong nhà máy là ví dụ về xử lí thông tin tự động"],"answer":["T","F","T","T"],"explain":"a) Đúng: máy tính làm theo chương trình. b) Sai: máy tính chưa có tư duy như con người. c) Đúng. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về đơn vị đo thông tin:","statements":["a) 1 KB = 1024 byte","b) 1 MB = 1024 KB","c) 1 GB = 1024 MB","d) 1 TB = 1000 GB"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: 1 TB = 1024 GB.","points":1},{"type":"short","level":"VD","q":"Một bài kiểm tra trực tuyến gồm 40 câu hỏi, mỗi câu hỏi (cả đáp án) chiếm khoảng 2 KB. Hỏi cả bài kiểm tra chiếm khoảng bao nhiêu KB?","answer":"80","explain":"40 × 2 = 80 KB.","points":0.5},{"type":"short","level":"VDC","q":"Một trung tâm lưu trữ có 10 ổ cứng, mỗi ổ 4 TB. Tổng dung lượng là bao nhiêu TB?","answer":"40","explain":"10 × 4 = 40 TB.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Câu nào sau đây là ví dụ về LƯU TRỮ thông tin?","options":["A. Ghi chép bài học vào vở","B. Nghe nhạc","C. Xem phim","D. Nói chuyện"],"answer":"A","explain":"Ghi chép vào vở là ghi lại thông tin để dùng về sau, tức lưu trữ thông tin.","points":0.25},{"type":"mcq","level":"TH","q":"Máy tính xử lí thông tin nhanh hơn con người chủ yếu nhờ","options":["A. Màn hình to","B. Tốc độ tính toán của CPU và khả năng lưu trữ lớn","C. Có nhiều màu sắc","D. Có loa"],"answer":"B","explain":"CPU tính toán hàng tỉ phép mỗi giây và bộ nhớ lưu trữ khổng lồ giúp máy tính vượt trội con người.","points":0.25},{"type":"mcq","level":"TH","q":"Dãy bit 10110011 có bao nhiêu bit?","options":["A. 6 bit","B. 7 bit","C. 8 bit","D. 1 byte"],"answer":"C","explain":"Đếm các kí hiệu 0, 1 trong dãy: có 8 kí hiệu nên dãy có 8 bit.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các đơn vị sau, đơn vị nào dùng để đo tốc độ truyền tin?","options":["A. Mbps (megabit mỗi giây)","B. MB (megabyte)","C. GB","D. TB"],"answer":"A","explain":"Mbps (megabit/giây) đo tốc độ truyền tin. MB, GB, TB đo lượng thông tin (dung lượng).","points":0.25},{"type":"mcq","level":"VD","q":"Một ảnh chụp màn hình có dung lượng 2 MB. Thẻ nhớ còn trống 1 GB chứa được tối đa bao nhiêu ảnh như vậy?","options":["A. 500 ảnh","B. 512 ảnh","C. 1000 ảnh","D. 1024 ảnh"],"answer":"B","explain":"1 GB = 1024 MB. 1024 ÷ 2 = 512 ảnh.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty cần lưu 2 TB dữ liệu lên đám mây. Gói cước cho phép tải lên 50 GB mỗi ngày. Cần ít nhất bao nhiêu ngày?","options":["A. 20 ngày","B. 40 ngày","C. 41 ngày","D. 42 ngày"],"answer":"C","explain":"2 TB = 2048 GB. 2048 ÷ 50 = 40,96 ngày, cần ít nhất 41 ngày.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về thông tin:","statements":["a) Thông tin tồn tại khách quan xung quanh ta","b) Con người là chủ thể sáng tạo và sử dụng thông tin","c) Động vật không trao đổi thông tin","d) Thông tin giúp con người hiểu biết thế giới"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: động vật cũng trao đổi thông tin bằng tiếng kêu, mùi, điệu bộ. d) Đúng.","points":1},{"type":"truefalse","level":"VD","q":"Xét tình huống: Bạn Lan dùng điện thoại quay video thí nghiệm, lưu vào máy rồi gửi cho cô giáo. Các phát biểu:","statements":["a) Quay video là thu nhận thông tin","b) Lưu video vào máy là lưu trữ thông tin","c) Gửi video cho cô giáo là truyền thông tin","d) Điện thoại không thực hiện xử lí thông tin trong tình huống này"],"answer":["T","T","T","F"],"explain":"a) Đúng: camera thu nhận. b) Đúng. c) Đúng. d) Sai: máy đã mã hóa, nén video tức có xử lí.","points":1},{"type":"short","level":"VD","q":"Đổi 1,25 MB ra KB.","answer":"1280","explain":"1,25 × 1024 = 1280 KB.","points":0.5},{"type":"short","level":"VDC","q":"Một video 600 MB được tải với tốc độ 25 MB mỗi giây. Hỏi mất bao nhiêu giây?","answer":"24","explain":"600 ÷ 25 = 24 giây.","points":0.5}]}]}
