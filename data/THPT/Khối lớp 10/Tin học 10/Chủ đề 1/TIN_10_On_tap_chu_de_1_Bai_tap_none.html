{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Đâu là ví dụ đúng nhất về “thông tin”?","options":["A. Chiếc điện thoại trên bàn","B. Bản tin dự báo thời tiết tối nay có mưa","C. Cục pin dự phòng","D. Sợi cáp sạc"],"answer":"B","explain":"Bản tin dự báo thời tiết là hiểu biết về thế giới xung quanh, tức thông tin. Các đáp án còn lại là vật dụng.","points":0.25},{"type":"mcq","level":"NB","q":"Thiết bị nào vừa thu nhận vừa xuất thông tin?","options":["A. Máy in","B. Điện thoại thông minh","C. Loa","D. Máy chiếu"],"answer":"B","explain":"Điện thoại có micro, camera (thu nhận) và màn hình, loa (xuất).","points":0.25},{"type":"mcq","level":"TH","q":"Một video 2 GB được ghi vào USB 8 GB. Tỉ lệ dung lượng đã dùng là","options":["A. 1/8","B. 1/4","C. 1/2","D. 3/4"],"answer":"B","explain":"2 ÷ 8 = 1/4.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các thiết bị sau, đâu là thiết bị của Internet vạn vật?","options":["A. Bóng đèn tự bật khi có người qua","B. Bóng đèn sợi đốt thường","C. Công tắc cơ","D. Ổ cắm điện thường"],"answer":"A","explain":"Bóng đèn có cảm biến, kết nối mạng và xử lí tự động là thiết bị IoT.","points":0.25},{"type":"mcq","level":"VD","q":"Số nhị phân 11010 có giá trị thập phân bằng","options":["A. 24","B. 26","C. 28","D. 22"],"answer":"B","explain":"11010 = 16 + 8 + 2 = 26.","points":0.25},{"type":"mcq","level":"VDC","q":"Một ảnh 640×480, mỗi pixel 16 bit. Dung lượng ảnh (chưa nén) bằng","options":["A. 614400 byte","B. 307200 byte","C. 1228800 byte","D. 61440 byte"],"answer":"A","explain":"640 × 480 × 16 = 4915200 bit = 614400 byte.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu tổng hợp:","statements":["a) Bit là đơn vị nhỏ nhất đo lượng thông tin","b) 1 byte gồm 8 bit","c) Hệ nhị phân chỉ dùng 0 và 1","d) Dữ liệu lôgic có ba giá trị"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: chỉ đúng và sai.","points":1},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về mã hóa:","statements":["a) ASCII mở rộng mã hóa được 256 kí tự","b) Unicode mã hóa được tiếng Việt có dấu","c) Số 27 viết nhị phân là 11011","d) 1 KB = 1000 byte trong tin học"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: 16+8+2+1. d) Sai: 1 KB = 1024 byte.","points":1},{"type":"short","level":"NB","q":"Viết số thập phân 5 dưới dạng nhị phân.","answer":"101","explain":"5 = 4 + 1 nên là 101.","points":0.5},{"type":"short","level":"TH","q":"Một file 4 GB bằng bao nhiêu MB?","answer":"4096","explain":"4 × 1024 = 4096 MB.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Hoạt động nào là “truyền thông tin”?","options":["A. Đọc sách","B. Gọi điện thoại cho bạn","C. Ghi chép bài","D. Tính nhẩm"],"answer":"B","explain":"Gọi điện là truyền thông tin đến người khác.","points":0.25},{"type":"mcq","level":"NB","q":"Kiểu dữ liệu của giá trị “19.5” (không có ngoặc kép) là","options":["A. Số nguyên","B. Số thực","C. Văn bản","D. Lôgic"],"answer":"B","explain":"19.5 có phần thập phân nên là số thực.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu thức (sai AND đúng) OR (đúng AND đúng) có giá trị","options":["A. Đúng","B. Sai","C. Không xác định","D. Vừa đúng vừa sai"],"answer":"A","explain":"(sai AND đúng) = sai; (đúng AND đúng) = đúng; sai OR đúng = đúng.","points":0.25},{"type":"mcq","level":"TH","q":"Khi soạn email xin việc, điều quan trọng là","options":["A. Viết tắt thật nhiều","B. Tiêu đề rõ ràng, nội dung lịch sự, đính kèm hồ sơ","C. Gửi cho càng nhiều người càng tốt","D. Không cần kiểm tra chính tả"],"answer":"B","explain":"Email công việc cần chuyên nghiệp: tiêu đề rõ, nội dung lịch sự, file đính kèm đầy đủ.","points":0.25},{"type":"mcq","level":"VDC","q":"Một đoạn âm thanh 15 giây, 22050 Hz, 16 bit, 2 kênh. Dung lượng bằng","options":["A. 10584000 bit","B. 5292000 bit","C. 21168000 bit","D. 2646000 bit"],"answer":"A","explain":"15 × 22050 × 16 × 2 = 10584000 bit.","points":0.25},{"type":"mcq","level":"VD","q":"Biết mã ASCII của “a” là 97. Mã của “d” là","options":["A. 99","B. 100","C. 101","D. 98"],"answer":"B","explain":"Các chữ cái liên tiếp có mã liên tiếp: d = 97 + 3 = 100.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về thiết bị thông minh:","statements":["a) Có cảm biến thu nhận thông tin môi trường","b) Có thể kết nối Internet","c) Có thể hoạt động tự động theo chương trình","d) Không thể điều khiển từ xa"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: điều khiển từ xa là đặc điểm nổi bật.","points":1},{"type":"truefalse","level":"VDC","q":"Một trường lắp hệ thống điểm danh bằng thẻ từ. Các phát biểu:","statements":["a) Thẻ từ lưu mã định danh của học sinh","b) Hệ thống tự ghi nhận giờ vào lớp","c) Dữ liệu điểm danh cần được bảo mật","d) Hệ thống này không liên quan đến xử lí thông tin"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: đây là hệ thống xử lí thông tin tự động.","points":1},{"type":"short","level":"NB","q":"Phép toán lôgic cho kết quả đúng khi cả hai đầu vào đều đúng có tên là gì?","answer":"AND","explain":"Phép AND.","points":0.5},{"type":"short","level":"VDC","q":"Một xâu có 25 kí tự ASCII chiếm bao nhiêu byte?","answer":"25","explain":"Mỗi kí tự ASCII 1 byte nên 25 kí tự chiếm 25 byte.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Dữ liệu là","options":["A. Suy nghĩ trong đầu chưa nói ra","B. Thông tin đã được ghi lại bằng kí hiệu","C. Giấc mơ ban đêm","D. Cảm xúc vui buồn"],"answer":"B","explain":"Dữ liệu là dạng vật chất ghi lại của thông tin.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các số sau, số nào KHÔNG phải số nhị phân?","options":["A. 101","B. 111","C. 1000","D. 102"],"answer":"D","explain":"102 chứa kí hiệu 2 nên không phải số nhị phân.","points":0.25},{"type":"mcq","level":"TH","q":"Một cửa hàng trực tuyến nên làm gì để tạo niềm tin cho khách?","options":["A. Giấu thông tin liên hệ","B. Công khai địa chỉ, chính sách đổi trả và đá s":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Xã hội tri thức coi trọng nhất nguồn lực nào?","options":["A. Tài nguyên thiên nhiên","B. Tri thức và thông tin","C. Sức lao động chân tay","D. Vốn tiền mặt"],"answer":"B","explain":"Trong xã hội tri thức, tri thức và thông tin là nguồn lực then chốt.","points":0.25},{"type":"mcq","level":"NB","q":"Phép toán OR cho kết quả sai khi nào?","options":["A. Khi cả hai đều đúng","B. Khi cả hai đều sai","C. Khi một đúng một sai","D. Không bao giờ sai"],"answer":"B","explain":"OR chỉ sai khi tất cả đều sai.","points":0.25},{"type":"mcq","level":"TH","q":"Một học sinh muốn tìm tài liệu ôn thi đáng tin cậy. Nên ưu tiên nguồn nào?","options":["A. Trang web của nhà xuất bản, thầy cô giới thiệu","B. Tin nhắn lan truyền không rõ nguồn","C. Bình luận ẩn danh","D. Quảng cáo"],"answer":"A","explain":"Nguồn chính thống, được kiểm chứng đáng tin cậy hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Trong hệ nhị phân, 10 + 10 bằng","options":["A. 20","B. 100","C. 101","D. 11"],"answer":"B","explain":"10 (2) + 10 (2) = 100 (4) trong hệ nhị phân.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trung tâm dữ liệu có 20 máy chủ, mỗi máy 8 TB. Tổng dung lượng bằng","options":["A. 160 TB","B. 28 TB","C. 160 GB","D. 200 TB"],"answer":"A","explain":"20 × 8 = 160 TB.","points":0.25},{"type":"mcq","level":"VD","q":"Ảnh 24 bit mỗi pixel dùng bao nhiêu byte cho mỗi pixel?","options":["A. 24 byte","B. 8 byte","C. 3 byte","D. 1 byte"],"answer":"C","explain":"24 bit = 3 byte.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về kiểu dữ liệu:","statements":["a) Điểm số nên dùng kiểu số để tính toán","b) Họ tên nên dùng kiểu văn bản","c) Trạng thái đạt/không đạt phù hợp kiểu lôgic","d) Số điện thoại nên dùng kiểu số thực"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: số điện thoại dùng kiểu văn bản.","points":1},{"type":"truefalse","level":"VDC","q":"Một công ty cho nhân viên làm việc từ xa. Các phát biểu:","statements":["a) Cần hạ tầng mạng và phần mềm cộng tác","b) An toàn thông tin trở nên quan trọng","c) Không cần kĩ năng số","d) Dữ liệu nên được sao lưu"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: rất cần kĩ năng số. d) Đúng.","points":1},{"type":"short","level":"NB","q":"Mô hình màu dùng ba kênh đỏ, xanh lá, xanh dương có tên là gì?","answer":"RGB","explain":"RGB: Red, Green, Blue.","points":0.5},{"type":"short","level":"VDC","q":"Giá trị thập phân của số nhị phân 10111 là bao nhiêu?","answer":"23","explain":"10111 = 16 + 4 + 2 + 1 = 23.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Đâu là khâu cuối cùng trong mô hình xử lí thông tin của máy tính?","options":["A. Thu nhận","B. Xử lí","C. Xuất (truyền) thông tin","D. Lưu trữ"],"answer":"C","explain":"Trình tự: thu nhận → xử lí → lưu trữ → xuất.","points":0.25},{"type":"mcq","level":"NB","q":"Kí tự “@” thuộc nhóm kí tự nào?","options":["A. Chữ cái","B. Chữ số","C. Kí tự đặc biệt","D. Dấu cách"],"answer":"C","explain":"@ là kí tự đặc biệt.","points":0.25},{"type":"mcq","level":"TH","q":"Một bạn chia sẻ vị trí theo thời gian thực công khai trên mạng. Đánh giá đúng là","options":["A. Tiện lợi, không có rủi ro","B. Tiện nhưng tiềm ẩn nguy cơ bị kẻ xấu theo dõi","C. Giúp điện thoại nhanh hơn","D. Nên làm thường xuyên"],"answer":"B","explain":"Chia sẻ vị trí công khai có thể bị kẻ xấu lợi dụng.","points":0.25},{"type":"mcq","level":"TH","q":"Số nhị phân 1000000 có giá trị thập phân bằng","options":["A. 100","B. 64","C. 32","D. 1000000"],"answer":"B","explain":"1000000 = 2 mũ 6 = 64.","points":0.25},{"type":"mcq","level":"VD","q":"Một file văn bản 1 MB (mỗi kí tự 1 byte) có khoảng bao nhiêu kí tự?","options":["A. 1000 kí tự","B. 1048576 kí tự","C. 1024 kí tự","D. 1 triệu kí tự chẵn"],"answer":"B","explain":"1 MB = 1048576 byte nên khoảng 1048576 kí tự.","points":0.25},{"type":"mcq","level":"VDC","q":"Biểu thức (A OR B) AND (A OR NOT B) luôn tương đương với","options":["A. A","B. B","C. NOT A","D. Luôn sai"],"answer":"A","explain":"Khai triển: (A OR B) AND (A OR NOT B) = A OR (B AND NOT B) = A OR sai = A.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về đơn vị đo:","statements":["a) 1 KB = 1024 byte","b) 1 MB = 1024 KB","c) 1 GB = 1024 MB","d) 1 TB = 1000 GB"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: 1 TB = 1024 GB.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về sử dụng mạng có trách nhiệm:","statements":["a) Nên kiểm chứng thông tin trước khi chia sẻ","b) Nên tôn trọng bản quyền","c) Có thể dùng ảnh người khác tùy ý","d) Nên ứng xử văn minh"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai. d) Đúng.","points":1},{"type":"short","level":"TH","q":"Biểu diễn số thập phân 8 dưới dạng nhị phân.","answer":"1000","explain":"8 = 1000 trong hệ nhị phân.","points":0.5},{"type":"short","level":"VD","q":"Một mật khẩu dài 12 kí tự, mỗi kí tự 1 byte. Hỏi mật khẩu chiếm bao nhiêu bit?","answer":"96","explain":"12 × 8 = 96 bit.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Thiết bị thông minh khác thiết bị thường ở điểm","options":["A. Giá đắt hơn","B. Có khả năng xử lí thông tin và kết nối mạng","C. To hơn","D. Nặng hơn"],"answer":"B","explain":"Điểm cốt lõi là khả năng xử lí thông tin và kết nối.","points":0.25},{"type":"mcq","level":"NB","q":"Giá trị nào sau đây là số nguyên?","options":["A. 7.5","B. -3","C. “3”","D. Đúng"],"answer":"B","explain":"-3 là số nguyên; 7.5 là số thực; “3” là văn bản.","points":0.25},{"type":"mcq","level":"TH","q":"Một ảnh 320×200, mỗi pixel 24 bit chiếm bao nhiêu byte?","options":["A. 64000 byte","B. 192000 byte","C. 1536000 byte","D. 6400 byte"],"answer":"B","explain":"320 × 200 × 24 = 1536000 bit = 192000 byte.","points":0.25},{"type":"mcq","level":"TH","q":"Để tránh bị lừa khi mua hàng trực tuyến, người mua nên","options":["A. Chọn shop uy tín, đọc đánh giá, không chuyển tiền trước cho người lạ","B. Mua ở shop rẻ nhất không cần kiểm tra","C. Cung cấp mã OTP cho người bán","D. Không đọc đánh giá"],"answer":"A","explain":"Cảnh giác và kiểm tra uy tín giúp tránh lừa đảo.","points":0.25},{"type":"mcq","level":"VD","q":"Số thập phân 150 viết dưới dạng nhị phân là","options":["A. 10010110","B. 10011010","C. 10100110","D. 10001110"],"answer":"A","explain":"150 = 128 + 16 + 4 + 2 nên là 10010110.","points":0.25},{"type":"mcq","level":"VDC","q":"Một hệ thống cần lưu 5000 bản ghi, mỗi bản ghi 2 KB. Dung lượng cần xấp xỉ","options":["A. 10 MB","B. 9,8 MB","C. 5 MB","D. 100 MB"],"answer":"B","explain":"5000 × 2 = 10000 KB = 10000 ÷ 1024 ≈ 9,77 MB.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về xử lí thông tin:","statements":["a) Con người xử lí thông tin bằng não bộ","b) Máy tính xử lí thông tin bằng CPU","c) Cả hai đều có các khâu thu nhận, xử lí, lưu trữ, truyền","d) Máy tính không thể lưu trữ thông tin"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về hệ nhị phân:","statements":["a) Số 111 trong hệ nhị phân bằng 7","b) Số 1000 trong hệ nhị phân bằng 8","c) 1 + 1 = 10 trong hệ nhị phân","d) Số nhị phân 1010 bằng 12"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: 1010 = 10.","points":1},{"type":"short","level":"NB","q":"Tên gọi của mạng lưới các thiết bị kết nối Internet là gì (viết tắt)?","answer":"IoT","explain":"IoT — Internet vạn vật.","points":0.5},{"type":"short","level":"VDC","q":"Tính giá trị của biểu thức: NOT (sai AND đúng) OR sai.","answer":"đúng","explain":"(sai AND đúng) = sai; NOT sai = đúng; đúng OR sai = đúng.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Bảng mã Unicode dùng để","options":["A. Mã hóa kí tự của mọi ngôn ngữ","B. Tính toán số học","C. Nén file","D. Phát nhạc"],"answer":"A","explain":"Unicode là bảng mã thống nhất cho mọi ngôn ngữ.","points":0.25},{"type":"mcq","level":"NB","q":"Trong ba phép NOT, AND, OR, phép nào ưu tiên nhất?","options":["A. AND","B. OR","C. NOT","D. Như nhau"],"answer":"C","explain":"Thứ tự ưu tiên: NOT, AND, OR.","points":0.25},{"type":"mcq","level":"TH","q":"Một đoạn văn bản 2000 kí tự Unicode (mỗi kí tự 2 byte) chiếm","options":["A. 2000 byte","B. 4000 byte","C. 1000 byte","D. 16000 byte"],"answer":"B","explain":"2000 × 2 = 4000 byte.","points":0.25},{"type":"mcq","level":"TH","q":"Khi thấy bạn đăng tin sai sự thật lên mạng, em nên","options":["A. Chia sẻ tiếp cho vui","B. Nhắc bạn kiểm chứng và gỡ tin sai","C. Bình luận chê bai","D. Mặc kệ"],"answer":"B","explain":"Nhắc nhở bạn kiểm chứng, tránh lan truyền tin giả.","points":0.25},{"type":"mcq","level":"VD","q":"Một video 8 giây, 25 fps có bao nhiêu khung hình?","options":["A. 33 khung","B. 200 khung","C. 25 khung","D. 8 khung"],"answer":"B","explain":"8 × 25 = 200 khung hình.","points":0.25},{"type":"mcq","level":"VDC","q":"Một file ghi âm 2 phút, 44100 Hz, 16 bit, 1 kênh. Dung lượng xấp xỉ","options":["A. 5 MB","B. 10 MB","C. 20 MB","D. 2 MB"],"answer":"B","explain":"120 × 44100 × 16 × 1 = 84672000 bit = 10584000 byte ≈ 10,1 MB.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về vai trò của tin học:","statements":["a) Hỗ trợ học trực tuyến","b) Giúp khám chữa bệnh từ xa","c) Hỗ trợ bản đồ chỉ đường","d) Chỉ dùng để chơi game"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về ảnh số:","statements":["a) Ảnh vector phóng to không vỡ hạt","b) Ảnh bitmap phóng to quá mức bị vỡ hạt","c) JPG là định dạng ảnh phổ biến","d) Độ phân giải không ảnh hưởng dung lượng"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"short","level":"TH","q":"Độ phân giải 3840×2160 thường được gọi là gì?","answer":"4K","explain":"4K ≈ 3840×2160.","points":0.5},{"type":"short","level":"VD","q":"Một USB 4 GB có thể chứa tối đa bao nhiêu file 512 MB?","answer":"8","explain":"4 GB = 4096 MB. 4096 ÷ 512 = 8 file.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Cảm biến trên thiết bị thông minh có chức năng","options":["A. Thu nhận thông tin từ môi trường","B. Phát nhạc","C. Sạc pin","D. Hiển thị hình ảnh"],"answer":"A","explain":"Cảm biến “cảm nhận” ánh sáng, nhiệt độ, chuyển động...","points":0.25},{"type":"mcq","level":"NB","q":"Số 0 trong hệ thập phân viết sang hệ nhị phân là","options":["A. 10","B. 0","C. 00","D. Không viết được"],"answer":"B","explain":"Số 0 viết là 0 trong mọi hệ đếm.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu thức đúng OR (sai AND sai) có giá trị","options":["A. Sai","B. Đúng","C. Không xác định","D. Bằng 0"],"answer":"B","explain":"(sai AND sai) = sai; đúng OR sai = đúng.","points":0.25},{"type":"mcq","level":"TH","q":"Một trường muốn quản lí điểm danh hiệu quả. Giải pháp công nghệ phù hợp là","options":["A. Điểm danh bằng giấy","B. Hệ thống điểm danh tự động (thẻ từ, nhận diện) kết nối phần mềm","C. Gọi điện từng phụ huynh","D. Không điểm danh"],"answer":"B","explain":"Điểm danh tự động nhanh, chính xác và dễ thống kê.","points":0.25},{"type":"mcq","level":"VD","q":"Số nhị phân 11110 có giá trị thập phân bằng","options":["A. 28","B. 30","C. 32","D. 26"],"answer":"B","explain":"11110 = 16 + 8 + 4 + 2 = 30.","points":0.25},{"type":"mcq","level":"VDC","q":"Một ảnh 1920×1080, 16 bit mỗi pixel. Dung lượng ảnh (chưa nén) xấp xỉ","options":["A. 4 MB","B. 6 MB","C. 2 MB","D. 8 MB"],"answer":"A","explain":"1920 × 1080 × 16 = 33177600 bit = 4147200 byte = 4050 KB ≈ 3,96 MB.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về số nguyên trong máy tính:","statements":["a) 8 bit biểu diễn được 256 số nguyên không dấu","b) Số không dấu 8 bit lớn nhất là 255","c) Bit cao nhất làm bit dấu cho số có dấu","d) 4 bit biểu diễn được 20 giá trị"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: 4 bit cho 16 giá trị.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về bảo vệ thông tin cá nhân:","statements":["a) Đặt mật khẩu mạnh cho thiết bị","b) Không chia sẻ mã OTP","c) Cẩn thận khi đăng ảnh cá nhân","d) Nên công khai vị trí mọi lúc"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"short","level":"NB","q":"Thiết bị đeo tay đo nhịp tim, đếm bước chân gọi là gì?","answer":"đồng hồ thông minh","explain":"Đồng hồ thông minh (smartwatch).","points":0.5},{"type":"short","level":"VD","q":"Tính giá trị thập phân của số nhị phân 11001.","answer":"25","explain":"11001 = 16 + 8 + 1 = 25.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Đâu là ví dụ về dữ liệu văn bản?","options":["A. Bản nhạc","B. Bài thơ","C. Bức ảnh","D. Tiếng chim hót"],"answer":"B","explain":"Bài thơ là văn bản (dãy kí tự).","points":0.25},{"type":"mcq","level":"TH","q":"Một bạn học sinh dùng điện thoại để tra từ điển, xem bài giảng và làm bài tập. Đây là","options":["A. Lạm dụng công nghệ","B. Sử dụng thiết bị thông minh hiệu quả cho học tập","C. Chơi game","D. Lãng phí thời gian"],"answer":"B","explain":"Dùng thiết bị đúng mục đích học tập.","points":0.25},{"type":"mcq","level":"VDC","q":"Thực hiện phép cộng nhị phân 1101 + 101, kết quả là","options":["A. 10010","B. 1111","C. 10100","D. 1202"],"answer":"A","explain":"1101 (13) + 101 (5) = 18, viết nhị phân là 10010.","points":0.25},{"type":"mcq","level":"VD","q":"Một đoạn nhạc 30 giây, 8000 Hz, 8 bit, 2 kênh. Dung lượng bằng","options":["A. 3840000 bit","B. 1920000 bit","C. 960000 bit","D. 7680000 bit"],"answer":"A","explain":"30 × 8000 × 8 × 2 = 3840000 bit.","points":0.25},{"type":"mcq","level":"VDC","q":"Cần mã hóa 50 đối tượng khác nhau bằng mã nhị phân. Số bit tối thiểu là","options":["A. 5 bit","B. 6 bit","C. 7 bit","D. 50 bit"],"answer":"B","explain":"5 bit cho 32 trạng thái (không đủ), 6 bit cho 64 trạng thái (đủ).","points":0.25},{"type":"mcq","level":"VDC","q":"Biểu thức (NOT A) OR (A AND B) với A = đúng, B = sai có giá trị là","options":["A. Đúng","B. Sai","C. Không xác định","D. Vừa đúng vừa sai"],"answer":"B","explain":"NOT A = sai; A AND B = đúng AND sai = sai; sai OR sai = sai.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về Internet vạn vật:","statements":["a) Các thiết bị IoT kết nối Internet","b) Cảm biến thu thập dữ liệu môi trường","c) Thiết bị IoT có thể điều khiển từ xa","d) IoT không ứng dụng trong nông nghiệp"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: có nông nghiệp thông minh.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về văn bản số:","statements":["a) Mỗi kí tự được mã hóa thành dãy bit","b) Tiếng Việt cần Unicode","c) Sai bảng mã gây lỗi chữ","d) ASCII đủ cho mọi ngôn ngữ"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"short","level":"TH","q":"Phép ghép hai xâu kí tự thành một gọi là phép gì?","answer":"nối xâu","explain":"Phép nối xâu.","points":0.5},{"type":"short","level":"VD","q":"Một tin nhắn dài 160 kí tự ASCII chiếm bao nhiêu byte?","answer":"160","explain":"Mỗi kí tự 1 byte nên 160 byte.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Đơn vị nào sau đây lớn nhất?","options":["A. 1 MB","B. 1024 KB","C. 1 GB","D. 8000 bit"],"answer":"C","explain":"1 GB = 1024 MB là lớn nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Một người dùng tai nghe Bluetooth để nghe nhạc từ điện thoại. Đây là kết nối","options":["A. Có dây","B. Không dây tầm gần","C. Vệ tinh","D. Cáp quang"],"answer":"B","explain":"Bluetooth là kết nối không dây tầm gần.","points":0.25},{"type":"mcq","level":"VD","q":"Số thập phân 77 viết dưới dạng nhị phân là","options":["A. 1001101","B. 1010101","C. 1001110","D. 1100100"],"answer":"A","explain":"77 = 64 + 8 + 4 + 1 nên là 1001101.","points":0.25},{"type":"mcq","level":"VD","q":"Một ảnh 800×600, 8 bit mỗi pixel chiếm","options":["A. 480000 byte","B. 3840000 byte","C. 480000 bit","D. 48000 byte"],"answer":"A","explain":"800 × 600 × 8 = 3840000 bit = 480000 byte.","points":0.25},{"type":"mcq","level":"VDC","q":"Một máy chủ lưu 10000 file, mỗi file 2,5 MB. Dung lượng cần xấp xỉ","options":["A. 25 GB","B. 24,4 GB","C. 10 GB","D. 250 GB"],"answer":"B","explain":"10000 × 2,5 = 25000 MB = 25000 ÷ 1024 ≈ 24,4 GB.","points":0.25},{"type":"mcq","level":"VDC","q":"Biểu thức NOT (A OR (B AND NOT C)) với A = sai, B = đúng, C = đúng có giá trị là","options":["A. Đúng","B. Sai","C. Không xác định","D. Bằng 0"],"answer":"A","explain":"NOT C = sai; B AND sai = sai; A OR sai = sai; NOT sai = đúng.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu tổng hợp về số:","statements":["a) Số 10101 trong hệ nhị phân bằng 21","b) Số 11011 trong hệ nhị phân bằng 27","c) Số 100 trong hệ thập phân viết nhị phân là 1100100","d) 8 bit biểu diễn được 255 giá trị"],"answer":["T","T","T","F"],"explain":"a) Đúng: 16+4+1. b) Đúng: 16+8+2+1. c) Đúng: 64+32+4. d) Sai: 8 bit cho 256 giá trị.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về xã hội tri thức:","statements":["a) Tri thức là nguồn lực quan trọng","b) Cần học tập suốt đời","c) Kĩ năng số ngày càng cần thiết","d) Công nghệ không ảnh hưởng việc làm"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: tự động hóa thay đổi việc làm.","points":1},{"type":"short","level":"TH","q":"Viết số thập phân 12 dưới dạng nhị phân.","answer":"1100","explain":"12 = 8 + 4 nên là 1100.","points":0.5},{"type":"short","level":"VD","q":"Một đoạn văn bản 5 KB (mỗi kí tự 1 byte) có khoảng bao nhiêu kí tự?","answer":"5120","explain":"5 × 1024 = 5120 kí tự.","points":0.5}]}]}
