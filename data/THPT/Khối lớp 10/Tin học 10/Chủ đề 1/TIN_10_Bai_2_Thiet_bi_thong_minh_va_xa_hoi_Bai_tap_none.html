<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Thiết bị thông minh là","options":["A. Thiết bị điện tử có khả năng thu nhận, xử lí, lưu trữ thông tin và kết nối mạng","B. Thiết bị chỉ dùng để nghe gọi","C. Thiết bị chạy bằng pin","D. Thiết bị có màn hình lớn"],"answer":"A","explain":"Thiết bị thông minh là thiết bị điện tử có khả năng thu nhận, xử lí, lưu trữ, truyền thông tin và kết nối mạng để tương tác với người dùng.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các thiết bị sau, thiết bị nào là thiết bị thông minh?","options":["A. Quạt điện cơ","B. Điện thoại thông minh","C. Bàn ủi","D. Xe đạp"],"answer":"B","explain":"Điện thoại thông minh có CPU, cảm biến, kết nối mạng và chạy ứng dụng nên là thiết bị thông minh.","points":0.25},{"type":"mcq","level":"TH","q":"Đặc điểm nào sau đây KHÔNG phải của thiết bị thông minh?","options":["A. Có cảm biến thu nhận thông tin môi trường","B. Kết nối Internet","C. Chỉ hoạt động khi có người điều khiển trực tiếp","D. Xử lí thông tin tự động theo chương trình"],"answer":"C","explain":"Thiết bị thông minh có thể hoạt động tự động theo chương trình hoặc điều khiển từ xa, không nhất thiết cần người điều khiển trực tiếp.","points":0.25},{"type":"mcq","level":"TH","q":"Đồng hồ thông minh (smartwatch) có thể làm gì?","options":["A. Đo nhịp tim, đếm bước chân, nhận thông báo từ điện thoại","B. Chỉ xem giờ","C. Nấu ăn","D. Phát wifi cho cả thành phố"],"answer":"A","explain":"Smartwatch có cảm biến đo nhịp tim, gia tốc đếm bước chân và kết nối với điện thoại để nhận thông báo.","points":0.25},{"type":"mcq","level":"VD","q":"Một gia đình lắp hệ thống nhà thông minh: đèn tự bật khi trời tối, điều hòa tự điều chỉnh theo nhiệt độ. Hệ thống này thể hiện đặc điểm nào của thiết bị thông minh?","options":["A. Chỉ dùng để trang trí","B. Thu nhận thông tin từ cảm biến và xử lí tự động","C. Tốn nhiều điện hơn","D. Không cần mạng"],"answer":"B","explain":"Cảm biến ánh sáng và nhiệt độ thu nhận thông tin môi trường, bộ điều khiển xử lí và tự động bật/tắt thiết bị.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trang trại dùng cảm biến độ ẩm đất kết nối Internet: khi đất khô, hệ thống tự bật máy bơm; nông dân theo dõi và điều khiển qua điện thoại. Đây là ứng dụng của","options":["A. Mạng xã hội","B. Internet vạn vật (IoT) trong nông nghiệp thông minh","C. Trò chơi điện tử","D. Máy tính để bàn"],"answer":"B","explain":"Các cảm biến kết nối Internet, thu thập dữ liệu và điều khiển tự động, giám sát từ xa — đó là IoT ứng dụng trong nông nghiệp thông minh.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về thiết bị thông minh:","statements":["a) Điện thoại thông minh là một thiết bị thông minh","b) Thiết bị thông minh có khả năng kết nối mạng","c) Ti vi thông minh có thể cài thêm ứng dụng","d) Mọi thiết bị điện đều là thiết bị thông minh"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: smart TV chạy hệ điều hành và cài ứng dụng. d) Sai: thiết bị thông minh phải có khả năng xử lí thông tin và kết nối.","points":1},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về Internet vạn vật (IoT):","statements":["a) IoT là mạng lưới các thiết bị được kết nối Internet, thu thập và trao đổi dữ liệu","b) Cảm biến trong IoT chỉ thu nhận mà không truyền dữ liệu","c) IoT được ứng dụng trong nhà thông minh, y tế, giao thông","d) Thiết bị IoT hoạt động hoàn toàn không cần phần mềm"],"answer":["T","F","T","F"],"explain":"a) Đúng: định nghĩa IoT. b) Sai: cảm biến truyền dữ liệu về trung tâm. c) Đúng. d) Sai: thiết bị IoT cần phần mềm/phần sụn để hoạt động.","points":1},{"type":"short","level":"NB","q":"Cụm từ viết tắt của mạng lưới các thiết bị kết nối Internet là gì?","answer":"IoT","explain":"IoT là viết tắt của Internet of Things — Internet vạn vật.","points":0.5},{"type":"short","level":"TH","q":"Bộ phận giúp thiết bị thông minh “cảm nhận” môi trường xung quanh (ánh sáng, nhiệt độ, chuyển động) gọi là gì?","answer":"cảm biến","explain":"Cảm biến (sensor) thu nhận thông tin từ môi trường như ánh sáng, nhiệt độ, độ ẩm, chuyển động.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Tin học có vai trò gì trong giáo dục?","options":["A. Hỗ trợ học trực tuyến, thư viện số, phần mềm mô phỏng","B. Thay thế hoàn toàn giáo viên","C. Chỉ dùng để chơi game","D. Không có vai trò gì"],"answer":"A","explain":"Tin học hỗ trợ dạy và học qua lớp học trực tuyến, thư viện điện tử, phần mềm mô phỏng thí nghiệm.","points":0.25},{"type":"mcq","level":"NB","q":"Ứng dụng tin học trong y tế là","options":["A. Hồ sơ bệnh án điện tử, khám chữa bệnh từ xa","B. Trồng rau","C. Xây nhà","D. Nấu ăn"],"answer":"A","explain":"Tin học giúp quản lí hồ sơ bệnh án điện tử, chẩn đoán hình ảnh và khám chữa bệnh từ xa.","points":0.25},{"type":"mcq","level":"NB","q":"Thương mại điện tử mang lại lợi ích nào?","options":["A. Mua bán mọi lúc mọi nơi, tiết kiệm thời gian đi lại","B. Không cần mạng Internet","C. Hàng hóa tự bay đến nhà","D. Không cần thanh toán"],"answer":"A","explain":"Thương mại điện tử cho phép mua bán trực tuyến mọi lúc mọi nơi, tiết kiệm thời gian và chi phí.","points":0.25},{"type":"mcq","level":"TH","q":"Chính phủ số là","options":["A. Việc ứng dụng công nghệ thông tin để cung cấp dịch vụ công trực tuyến cho người dân","B. Chính phủ họp qua điện thoại","C. Chính phủ không dùng giấy","D. Chính phủ trên mạng xã hội"],"answer":"A","explain":"Chính phủ số ứng dụng công nghệ thông tin để cung cấp dịch vụ công trực tuyến, giúp người dân làm thủ tục nhanh gọn.","points":0.25},{"type":"mcq","level":"VDC","q":"Một bệnh viện tuyến huyện kết nối với bệnh viện tuyến trung ương để hội chẩn từ xa qua video và chia sẻ kết quả chụp CT. Điều này thể hiện vai trò nào của tin học?","options":["A. Giải trí","B. Nâng cao chất lượng khám chữa bệnh, rút ngắn khoảng cách địa lí","C. Thay thế bác sĩ","D. Giảm số lượng bệnh nhân"],"answer":"B","explain":"Hội chẩn từ xa giúp bệnh nhân ở xa được tiếp cận chuyên gia tuyến trên, nâng cao chất lượng điều trị.","points":0.25},{"type":"mcq","level":"VD","q":"Trong sản xuất, robot công nghiệp giúp","options":["A. Tăng năng suất, làm việc liên tục và chính xác trong môi trường nguy hiểm","B. Thay thế mọi hoạt động của con người","C. Giảm chất lượng sản phẩm","D. Tốn nhiều nhân công hơn"],"answer":"A","explain":"Robot làm việc liên tục, chính xác, thay con người trong môi trường độc hại, nguy hiểm, giúp tăng năng suất.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về vai trò của tin học:","statements":["a) Tin học hỗ trợ học trực tuyến và thư viện số","b) Tin học giúp quản lí hồ sơ bệnh án điện tử","c) Tin học chỉ ứng dụng trong lĩnh vực giáo dục","d) Bản đồ số giúp người tham gia giao thông tìm đường thuận tiện"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: tin học ứng dụng trong mọi lĩnh vực. d) Đúng.","points":1},{"type":"truefalse","level":"VDC","q":"Một trường học triển khai: điểm danh bằng nhận diện khuôn mặt, sổ liên lạc điện tử, học liệu số. Các phát biểu:","statements":["a) Đây là ứng dụng tin học trong quản lí giáo dục","b) Sổ liên lạc điện tử giúp phụ huynh nắm tình hình học tập kịp thời","c) Ứng dụng này làm giảm vai trò của giáo viên","d) Dữ liệu điểm danh cần được bảo mật"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: công nghệ hỗ trợ chứ không thay thế giáo viên. d) Đúng: dữ liệu cá nhân phải bảo mật.","points":1},{"type":"short","level":"NB","q":"Hình thức mua bán hàng hóa qua mạng Internet gọi là gì?","answer":"thương mại điện tử","explain":"Thương mại điện tử là hoạt động mua bán hàng hóa, dịch vụ qua mạng Internet.","points":0.5},{"type":"short","level":"VDC","q":"Mô hình nông nghiệp sử dụng cảm biến, máy bay không người lái và phân tích dữ liệu để tưới tiêu, bón phân chính xác gọi là nông nghiệp gì?","answer":"nông nghiệp thông minh","explain":"Nông nghiệp thông minh ứng dụng IoT, dữ liệu lớn để sản xuất chính xác, tiết kiệm tài nguyên.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Xã hội tri thức là xã hội mà","options":["A. Tri thức và thông tin là nguồn lực quan trọng nhất cho phát triển","B. Ai cũng có bằng đại học","C. Không cần lao động chân tay","D. Chỉ có nhà khoa học"],"answer":"A","explain":"Trong xã hội tri thức, tri thức và thông tin trở thành nguồn lực then chốt thúc đẩy phát triển kinh tế xã hội.","points":0.25},{"type":"mcq","level":"NB","q":"Tác động tích cực của thiết bị thông minh đối với đời sống là","options":["A. Liên lạc nhanh chóng, tiếp cận tri thức dễ dàng","B. Gây nghiện","C. Lộ thông tin cá nhân","D. Tốn tiền mua thiết bị"],"answer":"A","explain":"Thiết bị thông minh giúp liên lạc tức thì, học tập và tiếp cận tri thức mọi lúc mọi nơi.","points":0.25},{"type":"mcq","level":"TH","q":"Biện pháp nào giúp sử dụng thiết bị thông minh lành mạnh?","options":["A. Dùng điện thoại liên tục cả ngày","B. Sắp xếp thời gian hợp lí, ưu tiên học tập và vận động","C. Tin mọi thông tin trên mạng","D. Chia sẻ mật khẩu cho bạn bè"],"answer":"B","explain":"Sử dụng thiết bị có kế hoạch, cân bằng với học tập, vận động và giao tiếp trực tiếp mới lành mạnh.","points":0.25},{"type":"mcq","level":"TH","q":"Nguy cơ nào sau đây khi chia sẻ quá nhiều thông tin cá nhân lên mạng xã hội?","options":["A. Được nhiều người biết đến","B. Bị kẻ xấu lợi dụng, lừa đảo","C. Điện thoại nhanh hơn","D. Không có nguy cơ gì"],"answer":"B","explain":"Thông tin cá nhân bị lộ có thể bị kẻ xấu lợi dụng để lừa đảo, quấy rối.","points":0.25},{"type":"mcq","level":"VD","q":"Một học sinh dành 6 giờ mỗi ngày chơi game trên điện thoại, sao nhãng học tập. Đây là biểu hiện của","options":["A. Sử dụng thiết bị thông minh hiệu quả","B. Nghiện thiết bị số — mặt trái cần khắc phục","C. Học tập tích cực","D. Rèn luyện sức khỏe"],"answer":"B","explain":"Lạm dụng thiết bị gây nghiện, ảnh hưởng sức khỏe và học tập — là mặt trái của công nghệ cần được điều chỉnh.","points":0.25},{"type":"mcq","level":"VDC","q":"Tự động hóa thay thế nhiều công việc lặp đi lặp lại. Để thích ứng, người lao động cần","options":["A. Ngừng học tập","B. Học tập suốt đời, trang bị kĩ năng số và chuyển đổi nghề nghiệp","C. Chỉ làm việc chân tay","D. Từ chối công nghệ"],"answer":"B","explain":"Trong xã hội tri thức, người lao động cần học tập suốt đời, nâng cao kĩ năng số để thích ứng với thay đổi việc làm.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về tác động của công nghệ:","statements":["a) Thiết bị thông minh giúp liên lạc nhanh chóng","b) Học trực tuyến giúp học mọi lúc mọi nơi","c) Công nghệ chỉ có tác động tích cực","d) Lạm dụng thiết bị có thể gây hại sức khỏe"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: công nghệ có cả mặt trái. d) Đúng: ảnh hưởng mắt, cột sống, giấc ngủ.","points":1},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về an toàn khi dùng thiết bị thông minh:","statements":["a) Nên đặt mật khẩu mạnh cho thiết bị và tài khoản","b) Có thể thoải mái chia sẻ vị trí theo thời gian thực","c) Không nên bấm vào liên kết lạ trong tin nhắn","d) Nên cập nhật phần mềm thường xuyên để vá lỗi bảo mật"],"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai: chia sẻ vị trí công khai gây nguy hiểm. c) Đúng: liên kết lạ có thể chứa mã độc. d) Đúng.","points":1},{"type":"short","level":"TH","q":"Để bảo vệ tài khoản, người dùng nên đặt loại mật khẩu như thế nào?","answer":"mật khẩu mạnh","explain":"Mật khẩu mạnh (dài, gồm chữ hoa, chữ thường, số và kí tự đặc biệt) giúp bảo vệ tài khoản.","points":0.5},{"type":"short","level":"VD","q":"Hiện tượng dành quá nhiều thời gian cho thiết bị số, khó kiểm soát, ảnh hưởng học tập và sức khỏe gọi là gì?","answer":"nghiện thiết bị số","explain":"Nghiện thiết bị số là tình trạng lệ thuộc vào thiết bị, cần được nhận biết và điều chỉnh.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Ví dụ nào sau đây là ứng dụng tin học trong giao thông?","options":["A. Bản đồ số chỉ đường","B. Cày ruộng","C. Nấu cơm","D. May áo"],"answer":"A","explain":"Bản đồ số, ứng dụng gọi xe, đèn tín hiệu điều khiển tự động là ứng dụng tin học trong giao thông.","points":0.25},{"type":"mcq","level":"NB","q":"Dịch vụ công trực tuyến giúp người dân","options":["A. Làm thủ tục hành chính nhanh gọn, không cần xếp hàng","B. Không cần giấy tờ tùy thân","C. Được miễn mọi loại phí","D. Không cần đến cơ quan bao giờ"],"answer":"A","explain":"Dịch vụ công trực tuyến giúp khai báo, nộp hồ sơ qua mạng, tiết kiệm thời gian đi lại, xếp hàng.","points":0.25},{"type":"mcq","level":"TH","q":"Trong nông nghiệp, tin học được ứng dụng để","options":["A. Tưới tiêu tự động theo độ ẩm đất, dự báo sâu bệnh","B. Thay thế hoàn toàn nông dân","C. Làm cho cây mọc nhanh gấp 10 lần","D. Không cần đất trồng"],"answer":"A","explain":"Cảm biến và phân tích dữ liệu giúp tưới tiêu chính xác, dự báo thời tiết, sâu bệnh trong nông nghiệp thông minh.","points":0.25},{"type":"mcq","level":"NB","q":"Học liệu số (sách điện tử, bài giảng video) có ưu điểm gì?","options":["A. Dễ dàng chia sẻ, cập nhật và học mọi lúc mọi nơi","B. Không cần thiết bị để đọc","C. Tự động làm bài tập hộ","D. Thay thế sách giấy hoàn toàn"],"answer":"A","explain":"Học liệu số dễ lưu trữ, chia sẻ, cập nhật và truy cập linh hoạt qua thiết bị thông minh.","points":0.25},{"type":"mcq","level":"VDC","q":"Thành phố lắp camera AI đếm lưu lượng xe và tự điều chỉnh đèn tín hiệu theo giờ cao điểm. Lợi ích chính là","options":["A. Giám sát người dân","B. Giảm ùn tắc, tối ưu luồng giao thông","C. Tăng số lượng xe","D. Thay thế cảnh sát giao thông"],"answer":"B","explain":"Đèn tín hiệu thích ứng theo lưu lượng thực tế giúp giảm ùn tắc và tiết kiệm thời gian di chuyển.","points":0.25},{"type":"mcq","level":"VD","q":"Một cửa hàng dùng phần mềm quản lí bán hàng: quét mã vạch tính tiền, thống kê doanh thu tự động. Điều này giúp chủ cửa hàng","options":["A. Giảm sai sót, tiết kiệm thời gian và quản lí hiệu quả","B. Không cần khách hàng","C. Tăng giá bán","D. Đóng cửa sớm"],"answer":"A","explain":"Phần mềm tự động hóa tính tiền, thống kê, giúp giảm nhầm lẫn và quản lí hiệu quả.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về ứng dụng tin học:","statements":["a) Phần mềm kế toán giúp doanh nghiệp quản lí tài chính","b) Mô phỏng trên máy tính giúp học sinh thí nghiệm an toàn","c) Tin học không có ứng dụng trong nông nghiệp","d) Đặt vé xe, vé máy bay trực tuyến tiết kiệm thời gian"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng: mô phỏng thay thí nghiệm nguy hiểm. c) Sai: có nông nghiệp thông minh. d) Đúng.","points":1},{"type":"truefalse","level":"VDC","q":"Một công ty chuyển sang làm việc trực tuyến hoàn toàn. Các phát biểu:","statements":["a) Nhân viên cần kĩ năng số để làm việc hiệu quả","b) Công ty tiết kiệm chi phí văn phòng","c) Làm việc trực tuyến không có thách thức gì","d) An toàn thông tin trở nên quan trọng hơn"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: có thách thức về kết nối, bảo mật, gắn kết. d) Đúng: dữ liệu truyền qua mạng cần bảo vệ.","points":1},{"type":"short","level":"NB","q":"Ứng dụng chỉ đường, tìm địa điểm trên điện thoại thường được gọi là gì?","answer":"bản đồ số","explain":"Bản đồ số là ứng dụng dẫn đường, tìm kiếm địa điểm phổ biến trên thiết bị thông minh.","points":0.5},{"type":"short","level":"VDC","q":"Việc cung cấp các thủ tục hành chính qua mạng Internet cho người dân được gọi là dịch vụ gì?","answer":"dịch vụ công trực tuyến","explain":"Dịch vụ công trực tuyến là biểu hiện của chính phủ số.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Loa thông minh có thể","options":["A. Nghe lệnh bằng giọng nói và điều khiển thiết bị trong nhà","B. Nấu cơm","C. Giặt quần áo","D. Tự di chuyển"],"answer":"A","explain":"Loa thông minh nhận lệnh giọng nói để phát nhạc, tra cứu thông tin và điều khiển thiết bị nhà thông minh.","points":0.25},{"type":"mcq","level":"NB","q":"Tin học góp phần bảo vệ môi trường bằng cách","options":["A. Họp trực tuyến, giảm đi lại và tiết kiệm giấy","B. Xả rác điện tử","C. In nhiều tài liệu","D. Dùng nhiều điện"],"answer":"A","explain":"Họp trực tuyến giảm đi lại, văn bản điện tử tiết kiệm giấy, góp phần bảo vệ môi trường.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói thiết bị thông minh làm thay đổi cách con người giao tiếp?","options":["A. Vì ai cũng có điện thoại","B. Vì cho phép liên lạc tức thì bằng nhiều hình thức: nhắn tin, gọi video, mạng xã hội","C. Vì điện thoại đẹp","D. Vì không cần gặp mặt nữa"],"answer":"B","explain":"Thiết bị thông minh đa dạng hóa giao tiếp: tin nhắn, gọi video, mạng xã hội, rút ngắn khoảng cách địa lí.","points":0.25},{"type":"mcq","level":"TH","q":"Khi mua hàng trực tuyến, người mua cần lưu ý gì?","options":["A. Chọn shop uy tín, kiểm tra đánh giá, không chuyển tiền trước cho người lạ","B. Mua càng nhiều càng tốt","C. Cung cấp mật khẩu ngân hàng cho người bán","D. Không cần kiểm tra hàng"],"answer":"A","explain":"Mua hàng trực tuyến cần chọn nơi uy tín, đọc đánh giá và cảnh giác với lừa đảo.","points":0.25},{"type":"mcq","level":"VD","q":"Một người cao tuổi học cách gọi video cho con cháu ở xa. Điều này cho thấy thiết bị thông minh","options":["A. Chỉ dành cho người trẻ","B. Giúp gắn kết gia đình, rút ngắn khoảng cách thế hệ","C. Làm người già lười biếng","D. Không phù hợp với người cao tuổi"],"answer":"B","explain":"Công nghệ giúp người cao tuổi liên lạc dễ dàng với con cháu, tăng gắn kết gia đình.","points":0.25},{"type":"mcq","level":"VDC","q":"Để xây dựng xã hội tri thức, mỗi học sinh cần","options":["A. Chỉ học thuộc lòng","B. Rèn năng lực tự học, kĩ năng số và tư duy phản biện","C. Dùng điện thoại càng nhiều càng tốt","D. Không cần học tin học"],"answer":"B","explain":"Xã hội tri thức đòi hỏi năng lực tự học suốt đời, kĩ năng số và khả năng đánh giá thông tin.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu:","statements":["a) Gọi video giúp người thân ở xa nhìn thấy nhau","b) Sách điện tử có thể đọc trên điện thoại","c) Thiết bị thông minh không thể kết nối Internet","d) Ứng dụng học tiếng Anh trên điện thoại hỗ trợ học tập"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: kết nối mạng là đặc điểm của thiết bị thông minh. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về sử dụng công nghệ có trách nhiệm:","statements":["a) Nên kiểm chứng thông tin trước khi chia sẻ","b) Tôn trọng bản quyền khi sử dụng tài liệu trên mạng","c) Có thể dùng ảnh của người khác mà không cần xin phép","d) Ứng xử văn minh trên mạng xã hội"],"answer":["T","T","F","T"],"explain":"a) Đúng: tránh lan truyền tin giả. b) Đúng. c) Sai: cần tôn trọng quyền riêng tư, xin phép. d) Đúng.","points":1},{"type":"short","level":"NB","q":"Thiết bị đeo tay có thể đo nhịp tim, đếm bước chân gọi là gì?","answer":"đồng hồ thông minh","explain":"Đồng hồ thông minh (smartwatch) là thiết bị đeo tay tích hợp cảm biến sức khỏe.","points":0.5},{"type":"short","level":"VD","q":"Xã hội mà tri thức và thông tin là nguồn lực quan trọng nhất cho phát triển được gọi là xã hội gì?","answer":"xã hội tri thức","explain":"Xã hội tri thức lấy tri thức, thông tin làm động lực phát triển.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Nhà thông minh là ngôi nhà","options":["A. Được trang bị các thiết bị thông minh tự động điều khiển","B. Xây bằng vật liệu đắt tiền","C. Có nhiều tầng","D. Có bể bơi"],"answer":"A","explain":"Nhà thông minh tích hợp các thiết bị IoT tự động điều khiển đèn, điều hòa, an ninh.","points":0.25},{"type":"mcq","level":"TH","q":"Robot hút bụi thông minh hoạt động dựa trên","options":["A. Sức người đẩy","B. Cảm biến dò đường và chương trình điều khiển tự động","C. Dây điện dài","D. May mắn"],"answer":"B","explain":"Robot hút bụi dùng cảm biến tránh vật cản, lập bản đồ và chương trình để dọn dẹp tự động.","points":0.25},{"type":"mcq","level":"TH","q":"Lợi ích của hồ sơ sức khỏe điện tử là","options":["A. Bác sĩ tra cứu nhanh lịch sử khám bệnh, tránh trùng lặp xét nghiệm","B. Bệnh nhân không cần đi khám","C. Tự chữa bệnh tại nhà","D. Không cần bác sĩ"],"answer":"A","explain":"Hồ sơ điện tử giúp liên thông dữ liệu giữa các cơ sở y tế, hỗ trợ chẩn đoán chính xác.","points":0.25},{"type":"mcq","level":"VD","q":"Một siêu thị dùng camera AI đếm khách và cảnh báo khi quá tải. Mục đích chính là","options":["A. Theo dõi khách hàng","B. Đảm bảo an toàn, phục vụ tốt hơn trong giờ cao điểm","C. Tăng giá bán","D. Giảm nhân viên"],"answer":"B","explain":"Đếm khách tự động giúp điều tiết, đảm bảo an toàn và chất lượng phục vụ.","points":0.25},{"type":"mcq","level":"VDC","q":"Xe tự lái sử dụng công nghệ nào để nhận biết môi trường xung quanh?","options":["A. Cảm biến, camera, radar kết hợp trí tuệ nhân tạo","B. Chỉ dùng bản đồ giấy","C. Người lái điều khiển từ xa","D. Đi theo vạch kẻ đường duy nhất"],"answer":"A","explain":"Xe tự lái tổng hợp dữ liệu từ nhiều cảm biến và xử lí bằng AI để ra quyết định lái.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong tương lai, ngành nghề nào có thể bị tự động hóa thay thế nhiều nhất?","options":["A. Nghề sáng tạo nghệ thuật","B. Các công việc lặp đi lặp lại, theo quy trình cố định","C. Nghề chăm sóc sức khỏe","D. Nghề giáo dục"],"answer":"B","explain":"Công việc mang tính lặp lại, quy trình cố định dễ bị robot và phần mềm thay thế nhất.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về nhà thông minh:","statements":["a) Đèn tự bật khi có người là thiết bị thông minh","b) Khóa cửa vân tay là thiết bị thông minh","c) Điều hòa hẹn giờ qua điện thoại là thiết bị thông minh","d) Công tắc cơ thông thường là thiết bị thông minh"],"answer":["T","T","T","F"],"explain":"a) Đúng: có cảm biến và xử lí tự động. b) Đúng. c) Đúng: điều khiển từ xa qua mạng. d) Sai: công tắc cơ không xử lí thông tin.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về vai trò của tin học trong đời sống:","statements":["a) Họp trực tuy o ngay","D. Bỏ qua, không quan tâm"],"answer":"B","explain":"Tin sức khỏe cần kiểm chứng từ nguồn uy tín (bác sĩ, cơ quan y tế) để tránh tin giả gây hại.","points":0.25},{"type":"mcq","level":"VDC","q":"Một thành phố xây dựng trung tâm điều hành thông minh tích hợp dữ liệu giao thông, y tế, môi trường. Mục tiêu là","options":["A. Giám sát người dân","B. Quản lí đô thị hiệu quả, nâng cao chất lượng sống","C. Tăng thuế","D. Giảm dân số"],"answer":"B","explain":"Đô thị thông minh dùng dữ liệu để điều hành giao thông, ứng phó sự cố, phục vụ người dân tốt hơn.","points":0.25},{"type":"mcq","level":"VDC","q":"Để không bị thay thế bởi tự động hóa, học sinh cần rèn luyện năng lực nào nhất?","options":["A. Học thuộc lòng","B. Tư duy sáng tạo, giải quyết vấn đề và kĩ năng số","C. Làm việc lặp đi lặp lại","D. Tránh dùng công nghệ"],"answer":"B","explain":"Máy móc thay thế việc lặp lại; con người cần sáng tạo, giải quyết vấn đề phức tạp và làm chủ công nghệ.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về tin giả trên mạng:","statements":["a) Tin giả có thể gây hoang mang dư luận","b) Nên kiểm chứng thông tin từ nhiều nguồn uy tín","c) Chia sẻ tin chưa kiểm chứng là hành vi thiếu trách nhiệm","d) Mọi tin trên mạng xã hội đều là tin giả"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: có nhiều thông tin hữu ích, cần phân biệt.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về thiết bị thông minh trong học tập:","statements":["a) Từ điển trực tuyến giúp tra cứu nhanh","b) Phần mềm mô phỏng giúp hiểu bài sâu hơn","c) Nên dùng điện thoại trong giờ kiểm tra","d) Học liệu số cần được chọn lọc phù hợp"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: gian lận trong kiểm tra. d) Đúng.","points":1},{"type":"short","level":"TH","q":"Phần mềm biến văn bản thành giọng nói giúp người khiếm thị đọc sách có tên gọi chung là gì?","answer":"chuyển văn bản thành giọng nói","explain":"Công nghệ text-to-speech hỗ trợ người khiếm thị tiếp cận thông tin.","points":0.5},{"type":"short","level":"VD","q":"Đô thị ứng dụng công nghệ thông tin để quản lí giao thông, môi trường, an ninh hiệu quả được gọi là đô thị gì?","answer":"đô thị thông minh","explain":"Đô thị thông minh (smart city) dùng dữ liệu và IoT để vận hành hiệu quả.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Cảm biến vân tay trên điện thoại dùng để","options":["A. Mở khóa và bảo mật thiết bị","B. Chụp ảnh","C. Nghe nhạc","D. Sạc pin"],"answer":"A","explain":"Cảm biến vân tay nhận dạng sinh trắc học để mở khóa an toàn.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các thiết bị thông minh cần được cập nhật phần mềm thường xuyên?","options":["A. Để vá lỗi bảo mật và bổ sung tính năng mới","B. Để máy nặng hơn","C. Để tốn pin","D. Không cần cập nhật"],"answer":"A","explain":"Cập nhật phần mềm giúp vá lỗ hổng bảo mật và cải thiện tính năng.","points":0.25},{"type":"mcq","level":"NB","q":"Thanh toán không dùng tiền mặt qua điện thoại có ưu điểm gì?","options":["A. Nhanh chóng, không cần mang tiền mặt, dễ quản lí chi tiêu","B. Không cần tài khoản ngân hàng","C. Không bao giờ mất tiền","D. Không cần mạng"],"answer":"A","explain":"Thanh toán số nhanh gọn, lưu lịch sử giao dịch giúp quản lí chi tiêu.","points":0.25},{"type":"mcq","level":"VD","q":"Một bạn học sinh dùng ứng dụng ghi chép và nhắc việc học tập hằng ngày. Đây là cách","options":["A. Lạm dụng công nghệ","B. Sử dụng thiết bị thông minh hiệu quả để quản lí thời gian","C. Trốn học","D. Chơi game"],"answer":"B","explain":"Dùng ứng dụng để lập kế hoạch, nhắc việc là sử dụng công nghệ đúng mục đích.","points":0.25},{"type":"mcq","level":"TH","q":"Gia đình bạn An lắp camera an ninh kết nối điện thoại để trông nhà khi đi vắng. Lợi ích và lưu ý là","options":["A. Giám sát từ xa tiện lợi, nhưng cần đặt mật khẩu và bảo mật","B. Không có lợi ích","C. Chỉ để khoe với hàng xóm","D. Nên chia sẻ tài khoản camera công khai"],"answer":"A","explain":"Camera giúp trông nhà từ xa, nhưng phải bảo mật tài khoản để tránh bị xem trộm.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nhà máy “thông minh” trong công nghiệp 4.0 có đặc điểm nào?","options":["A. Máy móc kết nối mạng, tự điều phối sản xuất theo dữ liệu thời gian thực","B. Không có công nhân","C. Sản xuất không cần điện","D. Chỉ sản xuất một loại sản phẩm"],"answer":"A","explain":"Nhà máy thông minh dùng IoT và dữ liệu để tự động điều phối, tối ưu sản xuất.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về ứng dụng tin học:","statements":["a) Đặt vé máy bay trực tuyến tiết kiệm thời gian","b) Học trực tuyến cần thiết bị và mạng Internet","c) Robot không được dùng trong sản xuất","d) Phần mềm dịch thuật hỗ trợ giao tiếp đa ngôn ngữ"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: robot dùng phổ biến trong sản xuất. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về bảo vệ thông tin cá nhân:","statements":["a) Không chia sẻ mật khẩu cho người khác","b) Cẩn thận khi đăng ảnh cá nhân lên mạng","c) Nên dùng chung tài khoản với bạn thân","d) Đăng xuất tài khoản sau khi dùng máy tính công cộng"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: mỗi người nên có tài khoản riêng. d) Đúng.","points":1},{"type":"short","level":"NB","q":"Công nghệ giúp máy tính “học” và xử lí như con người, viết tắt là gì?","answer":"AI","explain":"AI — trí tuệ nhân tạo.","points":0.5},{"type":"short","level":"VD","q":"Cuộc cách mạng ứng dụng IoT, dữ liệu lớn và trí tuệ nhân tạo vào sản xuất được gọi là công nghiệp gì?","answer":"công nghiệp 4.0","explain":"Công nghiệp 4.0 là cuộc cách mạng công nghiệp lần thứ tư dựa trên số hóa.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Mạng xã hội giúp con người","options":["A. Kết nối, chia sẻ thông tin với bạn bè khắp nơi","B. Học giỏi tự động","C. Kiếm tiền không cần làm việc","D. Không cần gặp mặt trực tiếp nữa"],"answer":"A","explain":"Mạng xã hội là công cụ kết nối, chia sẻ thông tin nhanh chóng.","points":0.25},{"type":"mcq","level":"TH","q":"Khi tham gia mạng xã hội, em cần","options":["A. Đăng mọi suy nghĩ lên mạng","B. Ứng xử văn minh, tôn trọng người khác và bảo vệ thông tin cá nhân","C. Kết bạn với người lạ","D. Chia sẻ mật khẩu"],"answer":"B","explain":"Tham gia mạng xã hội cần văn minh, tôn trọng và cẩn trọng với thông tin cá nhân.","points":0.25},{"type":"mcq","level":"VD","q":"Một bạn nhận được tin nhắn “trúng thưởng 100 triệu, bấm link nhận ngay”. Hành động đúng là","options":["A. Bấm link ngay","B. Không bấm link, xóa tin nhắn và báo cho người lớn","C. Chuyển tiếp cho bạn bè","D. Cung cấp thông tin cá nhân để nhận thưởng"],"answer":"B","explain":"Đây là thủ đoạn lừa đảo phổ biến; không bấm link lạ, không cung cấp thông tin.","points":0.25},{"type":"mcq","level":"VD","q":"Để học tốt với thiết bị thông minh, em nên","options":["A. Tắt thông báo khi học, dùng ứng dụng học tập có chọn lọc","B. Vừa học vừa lướt mạng xã hội","C. Chơi game giữa giờ học","D. Dùng điện thoại suốt buổi học"],"answer":"A","explain":"Tập trung khi học: tắt thông báo gây xao nhãng, chọn ứng dụng học tập phù hợp.","points":0.25},{"type":"mcq","level":"VDC","q":"Một quốc gia đầu tư mạnh vào giáo dục STEM và hạ tầng số. Mục tiêu dài hạn là","options":["A. Tốn ngân sách","B. Xây dựng nguồn nhân lực chất lượng cao cho xã hội tri thức","C. Giảm số lượng học sinh","D. Thay thế trường học"],"answer":"B","explain":"Nguồn nhân lực số chất lượng cao là nền tảng của xã hội tri thức và kinh tế số.","points":0.25},{"type":"mcq","level":"VDC","q":"Thách thức lớn nhất của xã hội tri thức đối với mỗi cá nhân là","options":["A. Thiếu thông tin","B. Phải học tập suốt đời để không bị tụt hậu","C. Thừa thời gian","D. Không cần làm việc"],"answer":"B","explain":"Tri thức thay đổi nhanh nên mỗi người phải học tập suốt đời, cập nhật kĩ năng liên tục.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về mạng xã hội:","statements":["a) Mạng xã hội giúp liên lạc nhanh chóng","b) Có thể học hỏi nhiều điều bổ ích trên mạng xã hội","c) Nên tin mọi thông tin trên mạng xã hội","d) Cần ứng xử văn minh khi bình luận"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: cần kiểm chứng. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về công nghệ và việc làm:","statements":["a) Tự động hóa có thể thay thế một số công việc đơn giản","b) Công nghệ cũng tạo ra nhiều nghề mới","c) Người lao động cần học kĩ năng mới để thích ứng","d) Công nghệ làm mọi người thất nghiệp hoàn toàn"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: nghề phân tích dữ liệu, an ninh mạng... c) Đúng. d) Sai: không phải tất cả.","points":1},{"type":"short","level":"TH","q":"Nền kinh tế dựa trên công nghệ số và dữ liệu được gọi là kinh tế gì?","answer":"kinh tế số","explain":"Kinh tế số là nền kinh tế vận hành dựa trên công nghệ số.","points":0.5},{"type":"short","level":"VD","q":"Việc học tập liên tục trong suốt cuộc đời để thích ứng với thay đổi được gọi là gì?","answer":"học tập suốt đời","explain":"Học tập suốt đời là yêu cầu tất yếu trong xã hội tri thức.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Thiết bị nào sau đây KHÔNG phải thiết bị thông minh?","options":["A. Điện thoại thông minh","B. Đồng hồ cơ lên dây cót","C. Loa thông minh","D. Ti vi thông minh"],"answer":"B","explain":"Đồng hồ cơ không có khả năng xử lí thông tin và kết nối mạng nên không phải thiết bị thông minh.","points":0.25},{"type":"mcq","level":"TH","q":"Khi đi du lịch nước ngoài, thiết bị thông minh giúp em","options":["A. Dịch ngôn ngữ, chỉ đường, đặt phòng trực tuyến","B. Tự đi thay em","C. Không cần mang hộ chiếu","D. Miễn phí mọi dịch vụ"],"answer":"A","explain":"Ứng dụng dịch thuật, bản đồ số và đặt dịch vụ trực tuyến hỗ trợ du lịch rất nhiều.","points":0.25},{"type":"mcq","level":"VD","q":"Một lớp học dùng bảng tương tác thay bảng phấn. Lợi ích chính là","options":["A. Giáo viên không cần giảng","B. Bài giảng sinh động, lưu trữ và chia sẻ dễ dàng","C. Học sinh không cần ghi chép","D. Phòng học đẹp hơn"],"answer":"B","explain":"Bảng tương tác giúp trình chiếu đa phương tiện, lưu bài giảng và chia sẻ cho học sinh.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn Minh muốn mua một chiếc điện thoại cũ qua mạng. Để tránh lừa đảo, Minh nên","options":["A. Chuyển tiền trước để giữ hàng","B. Giao dịch trực tiếp, kiểm tra máy kĩ và chọn nơi uy tín","C. Mua của người không rõ danh tính vì rẻ","D. Cung cấp mã OTP cho người bán"],"answer":"B","explain":"Giao dịch trực tiếp, kiểm tra kĩ và chọn nơi uy tín giúp tránh lừa đảo khi mua hàng cũ.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty áp dụng làm việc kết hợp (vừa trực tiếp vừa trực tuyến). Thách thức lớn nhất về công nghệ là","options":["A. Thiếu máy tính","B. Đảm bảo an toàn thông tin và hạ tầng kết nối ổn định","C. Nhân viên lười","D. Tốn điện"],"answer":"B","explain":"Làm việc phân tán đòi hỏi hệ thống kết nối ổn định và bảo mật dữ liệu khi truy cập từ nhiều nơi.","points":0.25},{"type":"mcq","level":"VDC","q":"Để trở thành công dân số có trách nhiệm, học sinh cần nhất","options":["A. Dùng mạng xã hội thật nhiều","B. Kĩ năng tìm kiếm, đánh giá thông tin và ứng xử văn minh trên mạng","C. Mua thiết bị đắt tiền","D. Chơi game giỏi"],"answer":"B","explain":"Công dân số cần năng lực số: tìm kiếm, kiểm chứng thông tin và hành xử có trách nhiệm trên môi trường số.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về mua sắm trực tuyến an toàn:","statements":["a) Nên mua ở gian hàng uy tín, có đánh giá tốt","b) Có thể cung cấp mã OTP cho người bán để được giảm giá","c) Nên kiểm tra kĩ thông tin sản phẩm trước khi đặt","d) Không nên chuyển tiền trước cho người lạ"],"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai: tuyệt đối không chia sẻ mã OTP. c) Đúng. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về học tập với công nghệ:","statements":["a) Video bài giảng giúp ôn tập linh hoạt","b) Nhóm học trực tuyến giúp trao đổi dễ dàng","c) Công nghệ thay thế hoàn toàn việc tự học","d) Nên chọn lọc nguồn học liệu uy tín"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: công nghệ hỗ trợ, tự học vẫn là cốt lõi. d) Đúng.","points":1},{"type":"short","level":"TH","q":"Người sử dụng công nghệ số một cách an toàn, văn minh và có trách nhiệm được gọi là gì?","answer":"công dân số","explain":"Công dân số là người có năng lực số và hành xử có trách nhiệm trên môi trường số.","points":0.5},{"type":"short","level":"VD","q":"Hành vi tung tin sai sự thật gây hoang mang trên mạng có thể bị xử lí theo quy định của điều gì?","answer":"pháp luật","explain":"Tung tin giả, xuyên tạc trên mạng là hành vi vi phạm pháp luật.","points":0.5}]}]}
