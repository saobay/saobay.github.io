oints":0.25},{"type":"mcq","level":"NB","q":"Muốn lấy kí tự cuối cùng của xâu s, cách viết nào đúng?","options":["A. s[-1]","B. s[0]","C. s[len(s)]","D. s[1]"],"answer":"A","explain":"Chỉ số -1 trỏ tới kí tự cuối; s[len(s)] vượt phạm vi.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: def f(x): return x % 2 == 0; in f(8). Kết quả là?","options":["A. True","B. False","C. 0","D. 8"],"answer":"A","explain":"8 % 2 = 0 nên điều kiện đúng.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: a = [4, 5, 4]; a.remove(4); in a. Kết quả là?","options":["A. [5, 4]","B. [4, 5]","C. [5]","D. [4, 4]"],"answer":"A","explain":"Xóa số 4 đầu tiên, còn [5, 4].","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: x = 0; def f(): global x; x = x + 2; f(); f(); in x. Kết quả là?","options":["A. 4","B. 2","C. 0","D. Báo lỗi"],"answer":"A","explain":"Mỗi lần gọi tăng 2; hai lần gọi: 4.","points":0.25},{"type":"mcq","level":"NB","q":"Toán tử in khi dùng với danh sách có ý nghĩa gì?","options":["A. Kiểm tra một giá trị có nằm trong danh sách không","B. In danh sách ra màn hình","C. Nhập danh sách","D. Xóa danh sách"],"answer":"A","explain":"x in a cho True nếu x là phần tử của a.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét đoạn lệnh: def f(a, b = 2): return a + b. Các phát biểu sau đúng hay sai?","statements":["b có giá trị mặc định.","f(5) cho 7.","f(5, 1) cho 6.","Tham số mặc định phải đứng trước."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: mặc định đứng sau.","points":1},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về danh sách.","statements":["Danh sách lưu nhiều phần tử.","Chỉ số bắt đầu từ 0.","len() đếm số phần tử.","Danh sách không có thứ tự."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: danh sách có thứ tự.","points":1},{"type":"short","level":"VD","q":"Hàm có *args thì gọi với bao nhiêu đối số cũng được đúng hay sai? (trả lời: đúng/sai)","answer":"đúng","explain":"*args gom số lượng tùy ý.","points":0. ","points":1},{"type":"truefalse","level":"TH","q":"Xét đoạn lệnh: for i in range(1, 8, 3). Các phát biểu sau đúng hay sai?","statements":["i nhận các giá trị 1, 4, 7.","Vòng lặp chạy 3 lần.","Bước lặp là 3.","i nhận giá trị 8."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: dừng trước 8.","points":1},{"type":"short","level":"TH","q":"Thêm phần tử 7 vào cuối danh sách a, viết lệnh nào?","answer":"a.append(7)","explain":"append thêm vào cuối.","points":0.5},{"type":"short","level":"VDC","q":"\"a1b2c3\" có bao nhiêu kí tự là chữ số?","answer":"3","explain":"Các kí tự 1, 2, 3.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"VDC","q":"Đoạn lệnh: a = 1; b = 1; while a + b nhỏ hơn 20: a, b = b, a + b; in a, b. Kết quả là?","options":["A. 8 13","B. 5 8","C. 13 21","D. 1 1"],"answer":"A","explain":"Dãy Fibonacci dừng khi tổng đạt 21: a = 8, b = 13.","points":0.25},{"type":"mcq","level":"NB","q":"Tên biến nào sau đây đặt ĐÚNG quy tắc trong Python?","options":["A. diem_trung_binh","B. 2diem","C. diem-trung-binh","D. diem trung binh"],"answer":"A","explain":"Tên biến bắt đầu bằng chữ cái hoặc gạch dưới, không chứa dấu cách, dấu gạch ngang.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: x = 12; y = x // 5; in y. Kết quả là?","options":["A. 2","B. 2.4","C. 3","D. 7"],"answer":"A","explain":"// chia lấy phần nguyên: 12 // 5 = 2.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: def f(*args): return sum(args); in f(2, 3, 5). Kết quả là?","options":["A. 10","B. 235","C. 6","D. Báo lỗi"],"answer":"A","explain":"*args gom thành (2,3,5); tổng 10.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: n = int(input()) với dữ liệu nhập là \"7\"; in n * 3. Kết quả là?","options":["A. 21","B. 777","C. 73","D. Báo lỗi"],"answer":"A","explain":"n = 7 (số); 7 * 3 = 21.","points":0.25},{"type":"mcq","level":"NB","q":"Khi có nhiều điều kiện loại trừ nhau, nên dùng cấu trúc nào?","options":["A. if/elif/else","B. Nhiều vòng lặp for","C. Nhiều hàm","D. Nhiều lệnh print"],"answer":"A","explain":"elif xét tiếp các điều kiện còn lại khi điều kiện trước sai.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về ngôn ngữ lập trình.","statements":["Python là ngôn ngữ bậc cao.","Python chạy bằng trình thông dịch.","Ngôn ngữ máy gồm 0 và 1.","Python không cần dịch mà máy chạy trực tiếp."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: vẫn cần trình thông dịch.","points":1},{"type":"truefalse","level":"VD","q":"Xét đoạn lệnh: s = \"a b c\"; in \"-\".join(s.split()). Các phát biểu sau đúng hay sai?","statements":["split() tách thành 3 từ.","join nối bằng dấu -.","Kết quả là a-b-c.","Kết quả giữ nguyên dấu cách."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"short","level":"NB","q":"Python là ngôn ngữ bậc cao hay bậc thấp?","answer":"bậc cao","explain":"Python gần ngôn ngữ con người.","points":0.5},{"type":"short","level":"VD","q":"ƯCLN của 24 và 36 bằng bao nhiêu?","answer":"12","explain":"Thuật toán Euclid.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Biến trong lập trình được ví như gì?","options":["A. Một ô nhớ có tên để lưu trữ giá trị","B. Một con số cố định","C. Một lệnh của máy","D. Một loại lỗi"],"answer":"A","explain":"Biến là vùng nhớ có tên, giá trị có thể thay đổi khi gán lại.","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: a = [3, 1, 2]; a.sort(reverse = True); in a. Kết quả là?","options":["A. [3, 2, 1]","B. [1, 2, 3]","C. [3, 1, 2]","D. Báo lỗi"],"answer":"A","explain":"reverse = True sắp giảm dần.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: in \"1,2,3\".split(\",\"). Kết quả là?","options":["A. ['1', '2', '3']","B. ['1,2,3']","C. 123","D. Báo lỗi"],"answer":"A","explain":"Tách theo dấu phẩy thành 3 xâu.","points":0.25},{"type":"mcq","level":"TH","q":"Biểu thức \"abc\" * 3 cho kết quả gì?","options":["A. abcabcabc","B. abc3","C. 3abc","D. Báo lỗi"],"answer":"A","explain":"Nhân xâu với số nguyên lặp lại xâu.","points":0.25},{"type":"mcq","level":"VD","q":"Muốn in hình vuông n dòng, mỗi dòng n dấu *, cấu trúc phù hợp là?","options":["A. Vòng lặp for lồng nhau","B. Một lệnh if","C. Một vòng while đơn","D. Đệ quy"],"answer":"A","explain":"Vòng ngoài duyệt dòng, vòng trong in n dấu * mỗi dòng.","points":0.25},{"type":"mcq","level":"NB","q":"Dãy số do range(3) sinh ra là dãy nào?","options":["A. 0, 1, 2","B. 1, 2, 3","C. 3, 2, 1","D. 0, 1, 2, 3"],"answer":"A","explain":"range(3) từ 0 đến trước 3.","points":0.25},{"type":"truefalse","level":"VDC","q":"Xét các phát biểu về biên dịch và thông dịch.","statements":["Python là ngôn ngữ thông dịch.","Thông dịch dễ gỡ lỗi từng dòng.","Thông dịch thường chậm hơn biên dịch.","Biên dịch không cần dịch trước khi chạy."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: biên dịch phải dịch hết trước.","points":1},{"type":"truefalse","level":"TH","q":"Xét đoạn lệnh: n = 1; while n != 4: n = n + 1. Các phát biểu sau đúng hay sai?","statements":["Điều kiện dừng là n = 4.","Vòng lặp chạy 3 lần.","Phải cập nhật n trong thân.","Vòng lặp không bao giờ dừng."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: n tăng nên dừng.","points":1},{"type":"short","level":"TH","q":"\"Python\".upper() cho kết quả gì?","answer":"PYTHON","explain":"Đổi thành chữ hoa.","points":0.5},{"type":"short","level":"VDC","q":"f(6) với f đệ quy tính giai thừa bằng bao nhiêu?","answer":"720","explain":"6! = 720.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Lệnh print(1, 2, 3, sep = \"-\") (dấu phân cách là gạch ngang) in ra gì?","options":["A. 1-2-3","B. 1 2 3","C. 123","D. 1, 2, 3"],"answer":"A","explain":"sep quy định dấu ngăn giữa các giá trị.","points":0.25},{"type":"mcq","level":"VD","q":"Đoạn lệnh: def f(a, b = 2, c = 3): return a + b + c; in f(1) + f(1, 10). Kết quả là?","options":["A. 20","B. 14","C. 17","D. Báo lỗi"],"answer":"A","explain":"f(1) = 1+2+3 = 6; f(1,10) = 1+10+3 = 14; tổng 20.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: s = \"hello\"; in s[0] + s[4]. Kết quả là?","options":["A. ho","B. he","C. hl","D. oo"],"answer":"A","explain":"s[0] = h, s[4] = o; nối xâu được \"ho\".","points":0.25},{"type":"mcq","level":"VDC","q":"So với chương trình biên dịch, chương trình thông dịch (như Python) có đặc điểm nào?","options":["A. Dễ gỡ lỗi từng dòng nhưng thường chạy chậm hơn","B. Chạy nhanh hơn hẳn","C. Không cần dịch","D. Không bao giờ có lỗi"],"answer":"A","explain":"Thông dịch dịch và chạy từng lệnh nên chậm hơn nhưng dễ theo dõi, gỡ lỗi.","points":0.25},{"type":"mcq","level":"NB","q":"Điểm khác biệt lớn nhất của ngôn ngữ lập trình bậc cao so với ngôn ngữ máy là gì?","options":["A. Gần với ngôn ngữ tự nhiên, con người dễ đọc hiểu","B. Máy chạy trực tiếp không cần dịch","C. Chỉ gồm các số 0 và 1","D. Không cần chương trình dịch"],"answer":"A","explain":"NNLT bậc cao gần ngôn ngữ con người; cần chương trình dịch mới chạy được.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: a = [1, 2, 3]; a.insert(0, 9); in a. Kết quả là?","options":["A. [9, 1, 2, 3]","B. [1, 2, 3, 9]","C. [1, 9, 2, 3]","D. [9]"],"answer":"A","explain":"insert(0, 9) chèn 9 vào đầu.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về rẽ nhánh.","statements":["if kiểm tra điều kiện.","Khối lệnh sau if thụt đầu dòng.","elif xét điều kiện tiếp theo.","Mọi lệnh đều cần if."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VD","q":"Xét đoạn lệnh: a = [3, 1, 2]; a.sort(reverse = True). Các phát biểu sau đúng hay sai?","statements":["Sắp xếp giảm dần.","a thành [3, 2, 1].","sort() đổi trực tiếp danh sách.","Phải gán lại a = a.sort()."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: sort() trả None, không gán.","points":1},{"type":"short","level":"NB","q":"Dãy các bước rõ ràng và hữu hạn để giải một bài toán gọi là gì?","answer":"thuật toán","explain":"Thuật toán: các bước xác định, cho kết quả sau số bước hữu hạn.","points":0.5},{"type":"short","level":"VD","q":"Đảo ngược xâu \"abcd\" được gì?","answer":"dcba","explain":"Dùng cắt lát bước -1.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"VD","q":"Đoạn lệnh: s = 1; for i in range(1, 4): s = s + i; in s (mục đích tính tích 1*2*3). Đây là lỗi gì?","options":["A. Lỗi logic (dùng cộng thay vì nhân)","B. Lỗi cú pháp","C. Lỗi ngoại lệ","D. Không lỗi"],"answer":"A","explain":"Chạy ra 7 thay vì 6: sai thuật toán.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: n = 1; while n != 4: n = n + 1; in n. Các giá trị được in là?","options":["A. 2 3 4","B. 1 2 3 4","C. 1 2 3","D. 4"],"answer":"A","explain":"Mỗi lần tăng rồi in: 2, 3, 4; dừng khi n = 4.","points":0.25},{"type":"mcq","level":"VDC","q":"Đoạn lệnh: a = [[1, 2], [3, 4]]; in a[1][0]. Kết quả là?","options":["A. 3","B. 1","C. 2","D. 4"],"answer":"A","explain":"a[1] là [3, 4]; phần tử 0 là 3.","points":0.25},{"type":"mcq","level":"TH","q":"Đoạn lệnh: s = 0; for i in range(5): s = s + 2 * i; in s. Kết quả là?","options":["A. 20","B. 10","C. 15","D. 8"],"answer":"A","explain":"0+2+4+6+8 = 20.","points":0.25},{"type":"mcq","level":"NB","q":"Phương thức lower() của xâu có tác dụng gì?","options":["A. Đổi tất cả thành chữ thường","B. Đổi tất cả thành chữ hoa","C. Xóa dấu cách","D. Đảo ngược xâu"],"answer":"A","explain":"lower() thành chữ thường; upper() thành chữ hoa.","points":0.25},{"type":"mcq","level":"NB","q":"Muốn chương trình Python chạy được trên máy tính, cần có gì?","options":["A. Trình thông dịch Python","B. Máy in","C. Màn hình cảm ứng","D. Kết nối mạng"],"answer":"A","explain":"Code Python được trình thông dịch dịch và chạy từng lệnh.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về tính bất biến của xâu.","statements":["Không gán được qua chỉ số xâu.","Muốn đổi phải tạo xâu mới.","Xâu vẫn cắt lát được.","Danh sách cũng bất biến."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: danh sách khả biến.","points":1},{"type":"truefalse","level":"VDC","q":"Xét đoạn lệnh đệ quy: def f(n): trả về 1 nếu n không lớn hơn 1, ngược lại n * f(n - 1). Các phát biểu sau đúng hay sai?","statements":["Đây là hàm đệ quy.","Điểm dừng là n không lớn hơn 1.","f(6) cho 720.","Thiếu điểm dừng vẫn chạy được."],"answer":["T","T","T","F"],"explain":"a,b,c) Đúng. d) Sai: thiếu điểm dừng gây tràn.","points":1},{"type":"short","level":"VDC","q":"Phần tử a[1][0] của [[1, 2], [3, 4]] bằng bao nhiêu?","answer":"3","explain":"Hàng 1, cột 0.","points":0.5},{"type":"short","level":"TH","q":"range(3) sinh ra dãy nào? (viết cách nhau bởi dấu cách)","answer":"0 1 2","explain":"Từ 0 đến trước 3.","points":0.5}]}]}</script>
