<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Người làm nghề thiết kế đồ họa máy tính chủ yếu tạo ra sản phẩm nào?","options":["A. Logo, poster, banner, bao bì, giao diện ứng dụng","B. Máy tính và linh kiện","C. Phần mềm diệt virus","D. Hệ điều hành"],"answer":"A","explain":"Nhà thiết kế đồ họa tạo ra các ấn phẩm trực quan: logo, poster, banner, bao bì, giao diện...","points":0.25},{"type":"mcq","level":"NB","q":"Phần mềm nào sau đây thường được người thiết kế đồ họa sử dụng?","options":["A. Photoshop, Illustrator, Inkscape, Figma","B. Unikey, Calculator","C. Windows Media Player","D. Notepad"],"answer":"A","explain":"Đây là các phần mềm đồ họa phổ biến trong nghề thiết kế.","points":0.25},{"type":"mcq","level":"TH","q":"Kĩ năng quan trọng nhất của người thiết kế đồ họa là","options":["A. Óc thẩm mỹ và tư duy sáng tạo","B. Khả năng sửa phần cứng","C. Tốc độ đánh máy","D. Khả năng lập trình hệ thống"],"answer":"A","explain":"Thẩm mỹ và sáng tạo là nền tảng của nghề thiết kế; kĩ năng phần mềm là công cụ thể hiện.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao người thiết kế đồ họa cần thành thạo phần mềm đồ họa?","options":["A. Vì phần mềm là công cụ chính để biến ý tưởng thành sản phẩm","B. Vì phần mềm tự thiết kế hộ","C. Vì không cần ý tưởng","D. Vì khách hàng yêu cầu"],"answer":"A","explain":"Ý tưởng cần công cụ để hiện thực hóa; thành thạo phần mềm giúp thể hiện ý tưởng nhanh và đẹp.","points":0.25},{"type":"mcq","level":"VD","q":"Một bạn học sinh thích vẽ và muốn theo nghề thiết kế đồ họa. Lời khuyên phù hợp là","options":["A. Rèn luyện thẩm mỹ, học phần mềm đồ họa và xây dựng bộ sưu tập tác phẩm (portfolio)","B. Chỉ cần chơi game giỏi","C. Không cần học gì thêm","D. Bỏ học vẽ"],"answer":"A","explain":"Portfolio thể hiện năng lực thực tế, là yếu tố quan trọng khi xin việc thiết kế.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nhà thiết kế nhận thấy khách hàng thường yêu cầu sửa đi sửa lại nhiều lần. Cách làm việc chuyên nghiệp là","options":["A. Thỏa thuận rõ số lần chỉnh sửa, phạm vi công việc và chi phí ngay từ đầu","B. Làm theo mọi yêu cầu vô hạn không cần thỏa thuận","C. Từ chối mọi yêu cầu sửa","D. Giao sản phẩm dở dang"],"answer":"A","explain":"Thỏa thuận rõ ràng từ đầu giúp tránh tranh chấp và bảo vệ quyền lợi cả hai bên.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về nghề thiết kế đồ họa.","statements":["Công việc gồm thiết kế logo, poster, bao bì, giao diện.","Cần có óc thẩm mỹ và tư duy sáng tạo.","Chỉ cần biết vẽ tay là đủ, không cần học phần mềm.","Có thể làm việc tại công ty quảng cáo hoặc tự do."],"answer":["T","T","F","T"],"explain":"Thiết kế hiện đại gắn với máy tính nên phải thành thạo phần mềm đồ họa.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về yêu cầu nghề nghiệp.","statements":["Cần cập nhật xu hướng thiết kế mới.","Cần kĩ năng giao tiếp để hiểu ý khách hàng.","Cần quản lí thời gian để giao sản phẩm đúng hẹn.","Làm thiết kế thì không cần làm việc nhóm."],"answer":["T","T","T","F"],"explain":"Thiết kế thường làm theo nhóm (với khách hàng, lập trình viên, marketing) nên cần kĩ năng phối hợp.","points":1},{"type":"short","level":"NB","q":"Bộ sưu tập các tác phẩm tiêu biểu của nhà thiết kế, dùng để xin việc, trong tiếng Anh gọi là (viết thường)","answer":"portfolio","explain":"Portfolio là hồ sơ năng lực bằng tác phẩm thực tế, rất quan trọng trong nghề thiết kế.","points":0.5},{"type":"short","level":"VDC","q":"Người làm thiết kế đồ họa tự do, nhận dự án từ nhiều khách hàng, trong tiếng Anh gọi là (viết thường)","answer":"freelancer","explain":"Freelancer là người làm việc tự do, chủ động về thời gian và dự án.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Nhà thiết kế đồ họa có thể làm việc ở đâu?","options":["A. Công ty quảng cáo, studio thiết kế, tòa soạn báo, phòng marketing","B. Chỉ ở nhà máy","C. Chỉ ở bệnh viện","D. Không có nơi làm việc"],"answer":"A","explain":"Nghề thiết kế có nhu cầu rộng: quảng cáo, truyền thông, báo chí, marketing doanh nghiệp...","points":0.25},{"type":"mcq","level":"NB","q":"Sản phẩm nào sau đây KHÔNG phải của nghề thiết kế đồ họa?","options":["A. Hệ điều hành máy tính","B. Logo công ty","C. Poster quảng cáo","D. Bao bì sản phẩm"],"answer":"A","explain":"Hệ điều hành là sản phẩm của nghề phát triển phần mềm; ba sản phẩm còn lại là của thiết kế đồ họa.","points":0.25},{"type":"mcq","level":"TH","q":"Khi thiết kế logo cho khách hàng, điều quan trọng cần tìm hiểu trước là","options":["A. Lĩnh vực kinh doanh, đối tượng khách hàng và thông điệp thương hiệu","B. Món ăn yêu thích của khách","C. Thời tiết hôm nay","D. Không cần tìm hiểu gì"],"answer":"A","explain":"Logo phải phản ánh đúng thương hiệu nên cần hiểu lĩnh vực, khách hàng mục tiêu và thông điệp.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nhà thiết kế cần tôn trọng bản quyền?","options":["A. Vì sao chép tác phẩm người khác là vi phạm pháp luật và đạo đức nghề nghiệp","B. Vì bản quyền không quan trọng","C. Vì khách hàng không quan tâm","D. Vì sao chép nhanh hơn"],"answer":"A","explain":"Tôn trọng bản quyền là yêu cầu đạo đức và pháp lí của mọi nghề sáng tạo.","points":0.25},{"type":"mcq","level":"VD","q":"Một công ty thực phẩm muốn thiết kế bao bì mới. Nhà thiết kế cần chú ý đặc biệt đến","options":["A. Màu sắc bắt mắt, thông tin sản phẩm rõ ràng, phù hợp đối tượng mua hàng","B. Chỉ cần đẹp là đủ","C. Càng nhiều chữ càng tốt","D. Sao chép bao bì đối thủ"],"answer":"A","explain":"Bao bì vừa thu hút vừa cung cấp thông tin (thành phần, hạn dùng) và phù hợp khách hàng mục tiêu.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nhà thiết kế trẻ có portfolio đẹp nhưng thiếu kinh nghiệm làm việc nhóm. Khi ứng tuyển vào công ty lớn, em nên","options":["A. Thể hiện portfolio tốt và sẵn sàng học hỏi, phối hợp trong môi trường nhóm","B. Giấu portfolio đi","C. Chỉ xin làm freelancer","D. Từ bỏ ứng tuyển"],"answer":"A","explain":"Portfolio tốt là lợi thế; thái độ sẵn sàng học hỏi và phối hợp giúp hòa nhập môi trường công ty.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về môi trường làm việc.","statements":["Có thể làm tại công ty quảng cáo, truyền thông.","Có thể làm freelancer nhận dự án tự do.","Có thể làm trong phòng marketing của doanh nghiệp.","Nghề thiết kế chỉ làm được ở nước ngoài."],"answer":["T","T","T","F"],"explain":"Nhu cầu thiết kế trong nước rất lớn: quảng cáo, marketing, báo chí, startup...","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về đạo đức nghề nghiệp.","statements":["Không sao chép ý tưởng của người khác.","Bảo mật thông tin, ý tưởng của khách hàng.","Trung thực về năng lực của bản thân.","Có thể dùng ảnh có bản quyền mà không xin phép."],"answer":["T","T","T","F"],"explain":"Dùng tài nguyên có bản quyền mà không được phép là vi phạm pháp luật.","points":1},{"type":"short","level":"NB","q":"Phần mềm thiết kế giao diện (UI) phổ biến mà nhà thiết kế hiện đại thường dùng, tên là (viết đúng: Figma)","answer":"Figma","explain":"Figma là công cụ thiết kế giao diện phổ biến, làm việc trực tuyến theo nhóm.","points":0.5},{"type":"short","level":"VDC","q":"Thiết kế giao diện người dùng trong tiếng Anh viết tắt là (viết hoa)","answer":"UI","explain":"UI (User Interface) là thiết kế giao diện; UX (User Experience) là trải nghiệm người dùng.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Để trở thành nhà thiết kế đồ họa, con đường học tập nào là phù hợp?","options":["A. Học đại học/cao đẳng ngành thiết kế, mĩ thuật hoặc tự học bài bản","B. Không cần học gì","C. Chỉ cần biết chơi game","D. Học sửa xe máy"],"answer":"A","explain":"Có thể học chính quy ngành thiết kế/mĩ thuật hoặc tự học bài bản kết hợp portfolio tốt.","points":0.25},{"type":"mcq","level":"NB","q":"Xu hướng nào đang mở rộng cơ hội cho nghề thiết kế đồ họa?","options":["A. Thiết kế giao diện ứng dụng, web (UI/UX) và đồ họa chuyển động","B. Vẽ tranh tường duy nhất","C. Không có xu hướng mới","D. Nghề đang biến mất"],"answer":"A","explain":"Bùng nổ ứng dụng, website, mạng xã hội tạo nhu cầu lớn về UI/UX và motion graphics.","points":0.25},{"type":"mcq","level":"TH","q":"Portfolio của nhà thiết kế nên chứa","options":["A. Các tác phẩm tiêu biểu nhất thể hiện kĩ năng và phong cách","B. Mọi bản nháp chưa hoàn thiện","C. Ảnh cá nhân","D. Bài tập toán"],"answer":"A","explain":"Portfolio chọn lọc tác phẩm tốt nhất để chứng minh năng lực với nhà tuyển dụng.","points":0.25},{"type":"mcq","level":"TH","q":"Khi khách hàng nói 'tôi muốn logo sang trọng', nhà thiết kế nên","options":["A. Hỏi kĩ thêm về màu sắc, phong cách, ví dụ mẫu để hiểu đúng ý","B. Tự đoán ý khách hàng","C. Làm đại một logo","D. Từ chối"],"answer":"A","explain":"Giao tiếp để làm rõ yêu cầu mơ hồ giúp sản phẩm đúng ý khách hàng, tránh sửa nhiều lần.","points":0.25},{"type":"mcq","level":"VD","q":"Một nhà thiết kế được giao làm bộ nhận diện cho quán trà sữa hướng tới học sinh. Phong cách phù hợp là","options":["A. Trẻ trung, màu sắc tươi sáng, hình ảnh gần gũi","B. Nghiêm túc, màu tối","C. Cổ điển, phức tạp","D. Đơn sắc đen trắng"],"answer":"A","explain":"Phong cách phải phù hợp đối tượng khách hàng mục tiêu (học sinh: trẻ trung, tươi sáng).","points":0.25},{"type":"mcq","level":"VDC","q":"Một freelancer thiết kế nhận cùng lúc 3 dự án với deadline gần nhau. Cách xử lí chuyên nghiệp là","options":["A. Sắp xếp độ ưu tiên, thương lượng deadline hợp lí và chỉ nhận việc trong khả năng","B. Nhận hết rồi làm ẩu","C. Bỏ một dự án không báo trước","D. Thức trắng nhiều đêm liên tục"],"answer":"A","explain":"Quản lí thời gian và thương lượng rõ ràng giúp giữ uy tín và chất lượng công việc.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về con đường vào nghề.","statements":["Có thể học đại học, cao đẳng ngành thiết kế đồ họa.","Có thể tự học qua khóa học trực tuyến nếu kiên trì.","Portfolio tốt có thể bù đắp cho bằng cấp.","Nhất thiết phải du học mới làm được nghề."],"answer":["T","T","T","F"],"explain":"Nhiều nhà thiết kế giỏi tự học trong nước; quan trọng là kĩ năng và portfolio.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về kĩ năng mềm.","statements":["Giao tiếp tốt giúp hiểu đúng yêu cầu khách hàng.","Quản lí thời gian giúp giao sản phẩm đúng hẹn.","Chịu được góp ý giúp cải thiện sản phẩm.","Nhà thiết kế giỏi không cần nghe góp ý."],"answer":["T","T","T","F"],"explain":"Lắng nghe góp ý và chỉnh sửa là một phần quan trọng của quy trình thiết kế.","points":1},{"type":"short","level":"NB","q":"Lĩnh vực thiết kế giao diện và trải nghiệm người dùng viết tắt trong tiếng Anh là (viết hoa, có dấu gạch chéo)","answer":"UI/UX","explain":"UI/UX là lĩnh vực thiết kế giao diện và trải nghiệm, nhu cầu tuyển dụng lớn.","points":0.5},{"type":"short","level":"VDC","q":"Đồ họa chuyển động (làm logo, chữ chuyển động trong video) trong tiếng Anh gọi là (viết thường, có dấu cách)","answer":"motion graphics","explain":"Motion graphics là xu hướng mở rộng cơ hội cho nhà thiết kế đồ họa.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Công việc đầu tiên khi nhận một dự án thiết kế là","options":["A. Tìm hiểu yêu cầu, mong muốn của khách hàng","B. Mở phần mềm vẽ ngay","C. Gửi hóa đơn","D. Đăng lên mạng xã hội"],"answer":"A","explain":"Hiểu đúng yêu cầu (brief) là bước đầu tiên quyết định sự thành công của dự án.","points":0.25},{"type":"mcq","level":"NB","q":"Thu nhập của nhà thiết kế đồ họa phụ thuộc chủ yếu vào","options":["A. Kĩ năng, kinh nghiệm, uy tín và chất lượng sản phẩm","B. Tuổi tác","C. Chiều cao","D. May mắn duy nhất"],"answer":"A","explain":"Nghề sáng tạo trả công theo năng lực và uy tín; portfolio tốt, khách hàng hài lòng thì thu nhập cao.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nhà thiết kế cần cập nhật xu hướng thường xuyên?","options":["A. Vì thị hiếu thẩm mỹ thay đổi, sản phẩm lỗi thời sẽ kém thu hút","B. Vì phần mềm bắt buộc","C. Vì khách hàng yêu cầu học","D. Không cần cập nhật"],"answer":"A","explain":"Xu hướng thiết kế thay đổi theo thời gian; cập nhật giúp sản phẩm hiện đại, cạnh tranh.","points":0.25},{"type":"mcq","level":"TH","q":"Khi bàn giao sản phẩm cho khách hàng, nhà thiết kế chuyên nghiệp sẽ","options":["A. Giao file đúng định dạng đã thỏa thuận kèm hướng dẫn sử dụng cần thiết","B. Chỉ gửi ảnh chụp màn hình","C. Giữ file không giao","D. Giao muộn không báo trước"],"answer":"A","explain":"Bàn giao đúng hẹn, đúng định dạng (file gốc, bản xem nhanh) kèm hướng dẫn là tác phong chuyên nghiệp.","points":0.25},{"type":"mcq","level":"VD","q":"Một nhà hàng muốn thiết kế menu. Nhà thiết kế cần đặc biệt chú ý","options":["A. Chữ dễ đọc, hình ảnh món ăn hấp dẫn, bố cục rõ ràng theo nhóm món","B. Chữ càng nhỏ càng tốt","C. Dùng một màu duy nhất","D. Không cần hình ảnh"],"answer":"A","explain":"Menu phải dễ đọc, kích thích vị giác và tìm món nhanh: chữ rõ, ảnh đẹp, nhóm món logic.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty khởi nghiệp ngân sách thấp muốn có logo chuyên nghiệp. Nhà thiết kế trẻ có thể đề xuất","options":["A. Gói thiết kế tinh gọn với số lần chỉnh sửa giới hạn, phù hợp ngân sách","B. Từ chối vì ngân sách thấp","C. Sao chép logo có sẵn","D. Làm miễn phí không thỏa thuận"],"answer":"A","explain":"Đề xuất gói phù hợp ngân sách với phạm vi rõ ràng: đôi bên cùng có lợi, vẫn chuyên nghiệp.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về quy trình làm việc.","statements":["Bước đầu là tìm hiểu yêu cầu khách hàng.","Sau đó lên ý tưởng và phác thảo.","Tiếp theo thiết kế chi tiết trên máy tính.","Không cần cho khách hàng xem trước khi bàn giao."],"answer":["T","T","T","F"],"explain":"Nên cho khách xem bản thảo và chỉnh sửa theo góp ý trước khi bàn giao cuối.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về phát triển bản thân.","statements":["Nên học thêm về marketing để hiểu khách hàng.","Nên rèn kĩ năng thuyết trình ý tưởng.","Nên xây dựng thương hiệu cá nhân qua mạng xã hội.","Học xong là đủ, không cần học thêm."],"answer":["T","T","T","F"],"explain":"Nghề sáng tạo đòi hỏi học hỏi liên tục: xu hướng, công cụ, kĩ năng mềm.","points":1},{"type":"short","level":"NB","q":"Bước đầu tiên khi nhận dự án thiết kế là tìm hiểu yêu cầu của ai? (điền: khách hàng)","answer":"khách hàng","explain":"Hiểu yêu cầu khách hàng (brief) là bước khởi đầu của mọi dự án thiết kế.","points":0.5},{"type":"short","level":"VDC","q":"Tài liệu mô tả yêu cầu thiết kế mà khách hàng đưa cho nhà thiết kế thường gọi là (tiếng Anh, viết thường)","answer":"brief","explain":"Brief là bản mô tả yêu cầu: mục tiêu, đối tượng, phong cách, deadline.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Nhà thiết kế đồ họa cần có kiến thức về","options":["A. Màu sắc, bố cục, typography (chữ) và phần mềm đồ họa","B. Sửa chữa điện tử","C. Nấu ăn","D. Lái xe"],"answer":"A","explain":"Kiến thức nền tảng: màu sắc, bố cục, chữ (typography) và công cụ phần mềm.","points":0.25},{"type":"mcq","level":"NB","q":"Typography trong thiết kế đồ họa là","options":["A. Nghệ thuật sắp xếp và trình bày chữ","B. Một loại máy in","C. Một phần mềm diệt virus","D. Kĩ thuật chụp ảnh"],"answer":"A","explain":"Typography là nghệ thuật dùng chữ: chọn font, cỡ, khoảng cách để truyền tải thông điệp đẹp.","points":0.25},{"type":"mcq","level":"TH","q":"Màu sắc trong thiết kế có vai trò","options":["A. Gợi cảm xúc, thu hút sự chú ý và truyền tải thông điệp","B. Chỉ để cho đẹp","C. Không có vai trò gì","D. Chỉ để phân biệt các phần"],"answer":"A","explain":"Màu sắc là ngôn ngữ cảm xúc: đỏ năng động, xanh tin cậy... ảnh hưởng cảm nhận thương hiệu.","points":0.25},{"type":"mcq","level":"TH","q":"Bố cục (layout) tốt trong thiết kế giúp","options":["A. Người xem dễ dàng tiếp nhận thông tin theo thứ tự ưu tiên","B. Che giấu thông tin","C. Làm rối mắt","D. Không có tác dụng"],"answer":"A","explain":"Bố cục dẫn dắt mắt người xem từ thông tin quan trọng nhất đến chi tiết.","points":0.25},{"type":"mcq","level":"VD","q":"Một poster tuyển thành viên câu lạc bộ cần làm nổi bật nhất yếu tố nào?","options":["A. Tên câu lạc bộ và cách thức đăng kí","B. Màu nền","C. Tên nhà thiết kế","D. Ngày thành lập trường"],"answer":"A","explain":"Thông điệp chính (tên CLB, cách đăng kí) phải nổi bật nhất theo thứ tự ưu tiên thông tin.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai poster cùng nội dung: một dùng 10 màu sặc sỡ, một dùng 3 màu hài hòa. Đánh giá của nhà thiết kế chuyên nghiệp là","options":["A. Poster 3 màu hài hòa thường hiệu quả hơn vì dễ nhìn, có điểm nhấn","B. Poster 10 màu luôn đẹp hơn","C. Màu sắc không quan trọng","D. Càng nhiều màu càng sang"],"answer":"A","explain":"Hạn chế số màu, tạo tương phản và điểm nhấn là nguyên tắc phối màu chuyên nghiệp.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về kiến thức nền tảng.","statements":["Cần hiểu về màu sắc và cảm xúc màu sắc.","Cần hiểu về bố cục dẫn dắt mắt người xem.","Cần hiểu về typography (nghệ thuật dùng chữ).","Chỉ cần biết dùng phần mềm là đủ."],"answer":["T","T","T","F"],"explain":"Phần mềm là công cụ; kiến thức mĩ thuật mới tạo nên sản phẩm đẹp.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về thiết kế hiệu quả.","statements":["Thông điệp chính phải nổi bật nhất.","Nên hạn chế số lượng màu sắc.","Chữ phải dễ đọc, phù hợp đối tượng.","Càng nhồi nhét nhiều chi tiết càng tốt."],"answer":["T","T","T","F"],"explain":"Thiết kế tốt là sự tiết chế: ít mà tinh, rõ ràng, có điểm nhấn.","points":1},{"type":"short","level":"NB","q":"Nghệ thuật sắp xếp và trình bày chữ trong thiết kế gọi là (viết thường, tiếng Anh)","answer":"typography","explain":"Typography là nghệ thuật dùng chữ trong thiết kế.","points":0.5},{"type":"short","level":"VDC","q":"Cách sắp xếp các thành phần trên ấn phẩm thiết kế gọi là bố cục, tiếng Anh là (viết thường)","answer":"layout","explain":"Layout (bố cục) dẫn dắt mắt người xem theo thứ tự ưu tiên thông tin.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Đâu là công việc điển hình của nhà thiết kế đồ họa?","options":["A. Thiết kế poster quảng cáo cho chiến dịch","B. Sửa chữa máy in","C. Lắp đặt mạng máy tính","D. Viết phần mềm kế toán"],"answer":"A","explain":"Thiết kế poster là công việc điển hình; các việc còn lại thuộc nghề khác.","points":0.25},{"type":"mcq","level":"NB","q":"Nhà thiết kế đồ họa làm việc với khách hàng qua hình thức nào?","options":["A. Cả trực tiếp tại công ty và trực tuyến (freelancer)","B. Chỉ gặp trực tiếp","C. Chỉ qua thư tay","D. Không làm việc với khách hàng"],"answer":"A","explain":"Có thể làm tại công ty hoặc freelancer làm việc trực tuyến với khách hàng khắp nơi.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nhiều nhà thiết kế xây dựng thương hiệu cá nhân trên mạng xã hội?","options":["A. Để quảng bá tác phẩm, thu hút khách hàng và cơ hội việc làm","B. Để khoe khoang","C. Để chơi game","D. Không có lợi ích gì"],"answer":"A","explain":"Mạng xã hội là kênh portfolio trực tuyến giúp tiếp cận khách hàng và nhà tuyển dụng.","points":0.25},{"type":"mcq","level":"TH","q":"Khi nhận xét bản thiết kế của đồng nghiệp, thái độ đúng là","options":["A. Góp ý xây dựng, cụ thể để cùng cải thiện sản phẩm","B. Chê bai thậm tệ","C. Im lặng không nói gì","D. Sao chép ý tưởng của họ"],"answer":"A","explain":"Góp ý xây dựng, tôn trọng đồng nghiệp là văn hóa làm việc nhóm lành mạnh.","points":0.25},{"type":"mcq","level":"VD","q":"Một shop online nhỏ cần ảnh sản phẩm đẹp để đăng bán. Nhà thiết kế có thể giúp bằng cách","options":["A. Chụp/chỉnh ảnh sản phẩm, thiết kế banner, ảnh bìa đồng bộ phong cách shop","B. Viết phần mềm bán hàng","C. Giao hàng hộ shop","D. Không giúp được gì"],"answer":"A","explain":"Hình ảnh đẹp, đồng bộ giúp shop online thu hút khách và tăng uy tín.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nhà thiết kế phát hiện đồng nghiệp sao chép tác phẩm của người khác cho dự án công ty. Hành động đúng là","options":["A. Nhắc nhở đồng nghiệp và báo cáo quản lí để thay bằng sản phẩm gốc","B. Im lặng cho qua","C. Cùng sao chép theo","D. Đăng lên mạng bêu xấu"],"answer":"A","explain":"Bảo vệ bản quyền là trách nhiệm; xử lí nội bộ qua nhắc nhở và báo cáo quản lí.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về cơ hội nghề nghiệp.","statements":["Nhu cầu thiết kế tăng cùng sự phát triển của quảng cáo, mạng xã hội.","Có thể làm việc trong nước với nhiều vị trí khác nhau.","Freelancer có thể nhận dự án từ khách hàng nước ngoài.","Nghề thiết kế không có tương lai."],"answer":["T","T","T","F"],"explain":"Nghề thiết kế đang phát triển mạnh cùng kinh tế số và thương mại điện tử.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về làm việc với khách hàng.","statements":["Nên tìm hiểu kĩ yêu cầu trước khi thiết kế.","Nên thỏa thuận rõ phạm vi và chi phí.","Nên cho khách xem bản thảo để góp ý.","Nên làm theo mọi yêu cầu vô điều kiện, không cần thỏa thuận."],"answer":["T","T","T","F"],"explain":"Thỏa thuận rõ ràng bảo vệ cả hai bên; không nên nhận yêu cầu vô hạn.","points":1},{"type":"short","level":"NB","q":"Công việc thiết kế logo, poster, bao bì thuộc nghề nào? (điền: thiết kế đồ họa)","answer":"thiết kế đồ họa","explain":"Đó là các sản phẩm điển hình của nghề thiết kế đồ họa máy tính.","points":0.5},{"type":"short","level":"VDC","q":"Kênh phổ biến để nhà thiết kế quảng bá tác phẩm và tìm khách hàng là (điền: mạng xã hội)","answer":"mạng xã hội","explain":"Mạng xã hội là kênh portfolio trực tuyến và tìm kiếm cơ hội việc làm.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Yếu tố nào tạo nên phong cách riêng của nhà thiết kế?","options":["A. Cách dùng màu sắc, bố cục, ý tưởng sáng tạo đặc trưng","B. Chiều cao","C. Quê quán","D. Tuổi tác"],"answer":"A","explain":"Phong cách thể hiện qua ngôn ngữ thị giác đặc trưng: màu sắc, bố cục, ý tưởng.","points":0.25},{"type":"mcq","level":"NB","q":"Nhà thiết kế đồ họa cần sử dụng thành thạo","options":["A. Máy tính và phần mềm đồ họa","B. Máy cày","C. Lò vi sóng","D. Máy may"],"answer":"A","explain":"Máy tính và phần mềm đồ họa là công cụ lao động chính của nghề.","points":0.25},{"type":"mcq","level":"TH","q":"Một sinh viên mới ra trường muốn xin việc thiết kế. Điều nhà tuyển dụng quan tâm nhất thường là","options":["A. Portfolio thể hiện năng lực thực tế","B. Chiều cao cân nặng","C. Quê quán","D. Sở thích cá nhân"],"answer":"A","explain":"Nghề sáng tạo đánh giá qua tác phẩm thực tế (portfolio) hơn bằng cấp đơn thuần.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nhà thiết kế nên học thêm kiến thức marketing?","options":["A. Để hiểu khách hàng, thị trường và thiết kế đúng mục tiêu kinh doanh","B. Để chuyển nghề","C. Vì bắt buộc","D. Không cần thiết"],"answer":"A","explain":"Thiết kế phục vụ mục tiêu kinh doanh; hiểu marketing giúp sản phẩm hiệu quả hơn.","points":0.25},{"type":"mcq","level":"VD","q":"Một trường học muốn làm bộ nhận diện (logo, banner, giấy khen) đồng bộ. Nhà thiết kế nên bắt đầu từ","options":["A. Tìm hiểu giá trị, đặc trưng của trường rồi xây dựng ý tưởng chủ đạo","B. Sao chép của trường khác","C. Vẽ ngay không cần tìm hiểu","D. Hỏi học sinh thích gì rồi làm theo ý một em"],"answer":"A","explain":"Bộ nhận diện phải phản ánh đúng giá trị và đặc trưng riêng của trường.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nhà thiết kế giỏi chuyên môn nhưng thường xuyên trễ deadline. Hậu quả có thể là","options":["A. Mất uy tín, mất khách hàng dù tay nghề tốt","B. Không ảnh hưởng gì","C. Được tăng lương","D. Được khen thưởng"],"answer":"A","explain":"Trong nghề dịch vụ, đúng hẹn quan trọng không kém tay nghề; trễ hẹn làm mất uy tín.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về phẩm chất nghề nghiệp.","statements":["Cần kiên trì vì ý tưởng hay cần nhiều lần thử.","Cần đúng hẹn để giữ uy tín.","Cần trung thực về năng lực bản thân.","Trễ deadline là chuyện bình thường."],"answer":["T","T","T","F"],"explain":"Đúng hẹn là yêu cầu cơ bản của tác phong chuyên nghiệp.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về xây dựng sự nghiệp.","statements":["Portfolio tốt mở ra nhiều cơ hội việc làm.","Thương hiệu cá nhân giúp thu hút khách hàng.","Học hỏi liên tục giúp không bị tụt hậu.","Chỉ cần giỏi chuyên môn, không cần kĩ năng mềm."],"answer":["T","T","T","F"],"explain":"Kĩ năng mềm (giao tiếp, quản lí thời gian) quan trọng không kém chuyên môn.","points":1},{"type":"short","level":"NB","q":"Công cụ lao động chính của nhà thiết kế đồ họa máy tính là (điền: máy tính)","answer":"máy tính","explain":"Máy tính cùng phần mềm đồ họa là công cụ lao động chính của nghề.","points":0.5},{"type":"short","level":"VDC","q":"Bản mô tả yêu cầu thiết kế do khách hàng cung cấp thường được gọi là (tiếng Anh, viết thường)","answer":"brief","explain":"Brief giúp nhà thiết kế hiểu đúng mục tiêu, đối tượng và phạm vi dự án.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Thiết kế đồ họa chuyển động (motion graphics) là","options":["A. Đồ họa có chuyển động trong video, quảng cáo","B. Ảnh tĩnh","C. Tranh vẽ tay","D. Chữ viết tay"],"answer":"A","explain":"Motion graphics là đồ họa chuyển động dùng trong video, quảng cáo, intro.","points":0.25},{"type":"mcq","level":"NB","q":"Nhà thiết kế UI/UX làm việc chủ yếu với","options":["A. Giao diện và trải nghiệm người dùng của ứng dụng, website","B. Máy móc công nghiệp","C. Thiết kế thời trang","D. Xây dựng nhà cửa"],"answer":"A","explain":"UI/UX thiết kế giao diện và tối ưu trải nghiệm người dùng số.","points":0.25},{"type":"mcq","level":"TH","q":"Sự khác nhau giữa thiết kế in ấn và thiết kế cho màn hình là","options":["A. In ấn cần độ phân giải cao (300 DPI), màn hình chỉ cần 72–96 DPI","B. Không có gì khác nhau","C. In ấn không cần màu sắc","D. Màn hình cần in ra giấy"],"answer":"A","explain":"In ấn đòi hỏi DPI cao để sắc nét; màn hình hiển thị ở mật độ điểm ảnh thấp hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Khi thiết kế cho người khiếm thị màu (mù màu), nhà thiết kế nên","options":["A. Không chỉ dùng màu sắc để truyền tải thông tin quan trọng, kết hợp thêm hình dạng, chữ","B. Dùng thật nhiều màu","C. Bỏ qua đối tượng này","D. Chỉ dùng màu đỏ xanh"],"answer":"A","explain":"Thiết kế bao hàm (inclusive design) quan tâm đến mọi đối tượng người dùng.","points":0.25},{"type":"mcq","level":"VD","q":"Một ứng dụng học tập cho học sinh tiểu học cần giao diện phù hợp. Nhà thiết kế UI nên","options":["A. Dùng màu tươi sáng, nút bấm to, hình minh họa sinh động, chữ lớn dễ đọc","B. Dùng giao diện như phần mềm kế toán","C. Dùng chữ thật nhỏ","D. Không cần thiết kế"],"answer":"A","explain":"Giao diện phải phù hợp lứa tuổi người dùng: tiểu học cần trực quan, sinh động, dễ thao tác.","points":0.25},{"type":"mcq","level":"VDC","q":"Một startup công nghệ muốn tuyển nhà thiết kế vừa làm được thương hiệu vừa làm được giao diện app. Ứng viên lí tưởng là người","options":["A. Có kiến thức nền tảng thiết kế vững và khả năng học công cụ mới nhanh","B. Chỉ biết một mảng duy nhất","C. Không cần học thêm","D. Chỉ cần đẹp trai"],"answer":"A","explain":"Nền tảng vững + khả năng học nhanh giúp đáp ứng đa dạng yêu cầu của startup.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về các mảng thiết kế.","statements":["Thiết kế in ấn cần chú ý độ phân giải cao.","Thiết kế UI/UX quan tâm trải nghiệm người dùng.","Motion graphics là đồ họa chuyển động.","Mọi mảng thiết kế đều giống hệt nhau."],"answer":["T","T","T","F"],"explain":"Mỗi mảng có yêu cầu kĩ thuật và tư duy riêng.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về thiết kế vì cộng đồng.","statements":["Nên quan tâm đến người khiếm thị màu khi thiết kế.","Chữ cần đủ lớn và tương phản tốt để dễ đọc.","Thiết kế tốt phục vụ được nhiều đối tượng.","Chỉ cần đẹp là đủ, không cần quan tâm người dùng."],"answer":["T","T","T","F"],"explain":"Thiết kế tốt phải đẹp và hữu ích cho người dùng thực tế.","points":1},{"type":"short","level":"NB","q":"Đồ họa có chuyển động dùng trong video, quảng cáo gọi là (tiếng Anh, viết thường)","answer":"motion graphics","explain":"Motion graphics là mảng mở rộng đầy tiềm năng của nghề thiết kế.","points":0.5},{"type":"short","level":"VDC","q":"Khi in ấn, độ phân giải ảnh thường cần khoảng bao nhiêu DPI? (chỉ ghi số)","answer":"300","explain":"In ấn chất lượng cao cần khoảng 300 DPI.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Nghề thiết kế đồ họa máy tính thuộc nhóm nghề nào?","options":["A. Nhóm nghề sáng tạo, công nghệ","B. Nhóm nghề nông nghiệp","C. Nhóm nghề khai thác mỏ","D. Nhóm nghề vận tải"],"answer":"A","explain":"Thiết kế đồ họa là nghề sáng tạo gắn với công nghệ số.","points":0.25},{"type":"mcq","level":"NB","q":"Sản phẩm thiết kế tốt cần đảm bảo","options":["A. Đẹp, đúng yêu cầu và truyền tải được thông điệp","B. Càng đắt càng tốt","C. Càng phức tạp càng tốt","D. Chỉ cần lạ"],"answer":"A","explain":"Thiết kế tốt cân bằng thẩm mỹ, yêu cầu và hiệu quả truyền thông.","points":0.25},{"type":"mcq","level":"TH","q":"Một bạn học sinh lớp 10 muốn thử sức với thiết kế đồ họa. Bước khởi đầu hợp lí là","options":["A. Học một phần mềm miễn phí như Inkscape và thực hành các dự án nhỏ","B. Mua ngay phần mềm đắt tiền","C. Chờ đến khi ra trường","D. Chỉ xem video không thực hành"],"answer":"A","explain":"Bắt đầu với công cụ miễn phí và dự án nhỏ là cách tiếp cận thực tế, ít tốn kém.","points":0.25},{"type":"mcq","level":"TH","q":"Tham gia các cuộc thi thiết kế giúp học sinh","options":["A. Rèn kĩ năng, xây dựng portfolio và tự tin hơn","B. Mất thời gian vô ích","C. Chỉ để giải trí","D. Không có lợi ích"],"answer":"A","explain":"Cuộc thi là môi trường rèn luyện, cọ xát và tích lũy tác phẩm cho portfolio.","points":0.25},{"type":"mcq","level":"VD","q":"Lớp bạn cần thiết kế áo lớp. Để có mẫu áo đẹp và được nhiều bạn đồng ý, nhóm thiết kế nên","options":["A. Lấy ý kiến số đông về màu sắc, hình ảnh rồi thiết kế vài mẫu để bình chọn","B. Một bạn tự quyết định","C. Sao chép mẫu lớp khác","D. Chọn mẫu đắt nhất"],"answer":"A","explain":"Thiết kế cho tập thể cần lắng nghe ý kiến và bình chọn dân chủ.","points":0.25},{"type":"mcq","level":"VDC","q":"Một bạn trẻ đam mê thiết kế nhưng gia đình muốn bạn học nghề 'ổn định' khác. Lời khuyên cân bằng là","options":["A. Tìm hiểu kĩ nghề thiết kế (cơ hội, thu nhập), trao đổi thẳng thắn với gia đình và có kế hoạch học tập rõ ràng","B. Nghe theo gia đình bỏ đam mê","C. Bỏ nhà đi theo đam mê","D. Không cần trao đổi gì"],"answer":"A","explain":"Hướng nghiệp cần dựa trên hiểu biết thực tế về nghề và sự đồng thuận của gia đình.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về bắt đầu với nghề.","statements":["Học sinh có thể bắt đầu với phần mềm miễn phí.","Thực hành dự án nhỏ giúp tiến bộ nhanh.","Cuộc thi thiết kế là cơ hội rèn luyện tốt.","Phải đợi có bằng đại học mới được thiết kế."],"answer":["T","T","T","F"],"explain":"Có thể bắt đầu từ sớm với công cụ miễn phí và dự án thực tế.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau (tổng hợp bài 33).","statements":["Nghề thiết kế cần thẩm mỹ, sáng tạo và kĩ năng phần mềm.","Portfolio quan trọng khi xin việc thiết kế.","Cần tôn trọng bản quyền và đạo đức nghề nghiệp.","Nghề thiết kế không cần giao tiếp với khách hàng."],"answer":["T","T","T","F"],"explain":"Giao tiếp để hiểu yêu cầu khách hàng là kĩ năng không thể thiếu.","points":1},{"type":"short","level":"NB","q":"Phần mềm đồ họa vector miễn phí phù hợp cho học sinh bắt đầu học thiết kế là (viết đúng: Inkscape)","answer":"Inkscape","explain":"Inkscape miễn phí, mã nguồn mở, phù hợp cho học sinh làm quen thiết kế vector.","points":0.5},{"type":"short","level":"VDC","q":"Nghệ thuật sắp xếp chữ trong thiết kế gọi là (tiếng Anh, viết thường)","answer":"typography","explain":"Typography là kiến thức nền tảng quan trọng của nhà thiết kế.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Khách hàng của nhà thiết kế đồ họa có thể là","options":["A. Doanh nghiệp, tổ chức, cá nhân có nhu cầu quảng bá, truyền thông","B. Chỉ có chính phủ","C. Chỉ có trường học","D. Không có khách hàng"],"answer":"A","explain":"Bất kì ai có nhu cầu truyền thông, quảng bá đều có thể là khách hàng của thiết kế.","points":0.25},{"type":"mcq","level":"NB","q":"Công việc nào sau đây thuộc về nhà thiết kế đồ họa?","options":["A. Thiết kế bao bì cho sản phẩm mới","B. Sửa điều hòa","C. Lái xe tải","D. Trồng rau"],"answer":"A","explain":"Thiết kế bao bì là công việc điển hình của nghề thiết kế đồ họa.","points":0.25},{"type":"mcq","level":"TH","q":"Để logo dễ nhớ, nhà thiết kế thường","options":["A. Đơn giản hóa hình ảnh, tạo điểm nhấn đặc trưng","B. Vẽ càng phức tạp càng tốt","C. Dùng nhiều chữ nhỏ","D. Sao chép logo nổi tiếng"],"answer":"A","explain":"Logo hiệu quả thường đơn giản, đặc trưng và dễ nhận diện.","points":0.25},{"type":"mcq","level":"TH","q":"Khi thiết kế cho trẻ em, cần chú ý","options":["A. Màu sắc tươi sáng, hình ảnh ngộ nghĩnh, chữ lớn dễ đọc","B. Màu tối, nghiêm túc","C. Chữ thật nhỏ","D. Không cần hình ảnh"],"answer":"A","explain":"Thiết kế phải phù hợp tâm lí lứa tuổi của đối tượng sử dụng.","points":0.25},{"type":"mcq","level":"VD","q":"Một quán cà phê muốn thu hút giới trẻ check-in. Nhà thiết kế nên đề xuất","options":["A. Không gian và ấn phẩm có góc chụp ảnh đẹp, màu sắc bắt mắt, logo ấn tượng","B. Chỉ cần cà phê ngon","C. Không cần thiết kế gì","D. Treo biển cấm chụp ảnh"],"answer":"A","explain":"Thiết kế trải nghiệm (không gian check-in, ấn phẩm đẹp) là chiến lược marketing hiệu quả.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nhà thiết kế được yêu cầu làm logo 'giống hệt' logo thương hiệu nổi tiếng. Ứng xử đúng là","options":["A. Từ chối và đề xuất thiết kế logo gốc có bản sắc riêng","B. Đồng ý sao chép","C. Sao chép rồi sửa chút ít","D. Làm ngơ"],"answer":"A","explain":"Sao chép logo nổi tiếng vi phạm bản quyền; nhà thiết kế có trách nhiệm từ chối và đề xuất phương án gốc.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về nguyên tắc thiết kế logo.","statements":["Logo nên đơn giản, dễ nhớ.","Logo nên có điểm nhấn đặc trưng.","Logo tốt hiển thị đẹp ở nhiều kích cỡ.","Logo càng phức tạp càng chuyên nghiệp."],"answer":["T","T","T","F"],"explain":"Đơn giản và đặc trưng là nguyên tắc vàng của thiết kế logo.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về ứng xử nghề nghiệp.","statements":["Từ chối yêu cầu sao chép tác phẩm có bản quyền.","Đề xuất phương án sáng tạo gốc thay cho sao chép.","Tư vấn cho khách hàng hiểu giá trị của thiết kế gốc.","Chiều theo mọi yêu cầu của khách hàng kể cả vi phạm pháp luật."],"answer":["T","T","T","F"],"explain":"Nhà thiết kế chuyên nghiệp không tiếp tay cho hành vi vi phạm bản quyền.","points":1},{"type":"short","level":"NB","q":"Để logo dễ nhớ, nhà thiết kế thường đơn giản hóa hình ảnh và tạo điểm gì? (điền: điểm nhấn)","answer":"điểm nhấn","explain":"Điểm nhấn đặc trưng giúp logo dễ nhận diện và ghi nhớ.","points":0.5},{"type":"short","level":"VDC","q":"Người làm nghề thiết kế đồ họa cần có óc thẩm mỹ và tư duy gì? (điền: sáng tạo)","answer":"sáng tạo","explain":"Thẩm mỹ và sáng tạo là hai phẩm chất cốt lõi của nghề thiết kế.","points":0.5}]}]}
