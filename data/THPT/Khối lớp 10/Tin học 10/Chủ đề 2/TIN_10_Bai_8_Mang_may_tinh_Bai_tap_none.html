{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Mạng máy tính là","options":["A. Một chiếc máy tính duy nhất","B. Các máy tính và thiết bị được kết nối để chia sẻ tài nguyên và trao đổi thông tin","C. Dây điện trong nhà","D. Màn hình máy tính"],"answer":"B","explain":"Mạng máy tính là hệ thống các máy tính và thiết bị kết nối với nhau để chia sẻ tài nguyên và trao đổi thông tin.","points":0.25},{"type":"mcq","level":"NB","q":"Lợi ích của mạng máy tính là","options":["A. Chia sẻ tài nguyên, trao đổi thông tin nhanh chóng","B. Làm máy tính nặng hơn","C. Tốn nhiều điện","D. Máy tính chạy chậm hơn"],"answer":"A","explain":"Mạng giúp dùng chung máy in, file, trao đổi thông tin và làm việc nhóm hiệu quả.","points":0.25},{"type":"mcq","level":"TH","q":"Trong phòng tin học của trường, các máy tính kết nối với nhau thành mạng. Loại mạng này là","options":["A. Mạng diện rộng (WAN)","B. Mạng cục bộ (LAN)","C. Internet","D. Mạng vệ tinh"],"answer":"B","explain":"Mạng trong một phòng, tòa nhà là mạng cục bộ LAN.","points":0.25},{"type":"mcq","level":"TH","q":"Internet là","options":["A. Mạng máy tính toàn cầu kết nối hàng tỉ thiết bị","B. Một trang web","C. Một phần mềm","D. Một chiếc máy tính lớn"],"answer":"A","explain":"Internet là hệ thống mạng toàn cầu liên kết các mạng máy tính trên khắp thế giới.","points":0.25},{"type":"mcq","level":"VD","q":"Một công ty có 3 chi nhánh ở ba tỉnh, cần kết nối mạng dùng chung dữ liệu. Giải pháp phù hợp là","options":["A. Mạng LAN","B. Mạng diện rộng (WAN) hoặc kết nối qua Internet","C. Bluetooth","D. Không cần mạng"],"answer":"B","explain":"Các chi nhánh ở xa nhau cần mạng diện rộng WAN hoặc đường truyền Internet.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trường học muốn học sinh nộp bài và giáo viên chấm bài trực tuyến. Hệ thống cần có","options":["A. Chỉ cần máy tính","B. Mạng nội bộ hoặc Internet, máy chủ lưu trữ và phần mềm quản lí","C. Chỉ cần USB","D. Chỉ cần máy in"],"answer":"B","explain":"Hệ thống nộp bài trực tuyến cần hạ tầng mạng, máy chủ và phần mềm.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về mạng máy tính:","statements":["a) Mạng máy tính gồm các thiết bị được kết nối với nhau","b) Mạng giúp chia sẻ tài nguyên như máy in","c) Mạng giúp trao đổi thông tin nhanh chóng","d) Máy tính đơn lẻ không kết nối cũng là mạng máy tính"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cần ít nhất hai thiết bị kết nối.","points":1},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về LAN và WAN:","statements":["a) LAN là mạng trong phạm vi hẹp như phòng, tòa nhà","b) WAN kết nối các mạng ở phạm vi rộng","c) Internet là mạng diện rộng lớn nhất","d) LAN có phạm vi rộng hơn WAN"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: WAN rộng hơn LAN.","points":1},{"type":"short","level":"NB","q":"Mạng máy tính trong phạm vi một phòng học, tòa nhà gọi là mạng gì?","answer":"LAN","explain":"LAN (Local Area Network) — mạng cục bộ.","points":0.5},{"type":"short","level":"TH","q":"Mạng máy tính toàn cầu, kết nối hàng tỉ thiết bị trên thế giới gọi là gì?","answer":"Internet","explain":"Internet là mạng toàn cầu.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Thiết bị nào dùng để phát sóng wifi trong gia đình?","options":["A. Router wifi","B. Máy in","C. Loa","D. Chuột"],"answer":"A","explain":"Router wifi phát sóng không dây cho các thiết bị kết nối Internet.","points":0.25},{"type":"mcq","level":"NB","q":"Nhà cung cấp dịch vụ Internet viết tắt là","options":["A. ISP","B. USB","C. CPU","D. LAN"],"answer":"A","explain":"ISP (Internet Service Provider) là nhà cung cấp dịch vụ Internet.","points":0.25},{"type":"mcq","level":"TH","q":"Địa chỉ IP dùng để","options":["A. Định danh duy nhất cho mỗi thiết bị trên mạng","B. Lưu trữ file","C. Tăng tốc độ mạng","D. Chặn virus"],"answer":"A","explain":"Mỗi thiết bị trên mạng có một địa chỉ IP duy nhất để nhận diện và giao tiếp.","points":0.25},{"type":"mcq","level":"TH","q":"Tên miền (domain) có vai trò","options":["A. Thay cho địa chỉ IP bằng tên dễ nhớ","B. Tăng tốc độ mạng","C. Diệt virus","D. Lưu trữ dữ liệu"],"answer":"A","explain":"Tên miền như saobay.github.io dễ nhớ hơn dãy số IP.","points":0.25},{"type":"mcq","level":"VDC","q":"Khi gõ tên miền vào trình duyệt, máy tính cần làm gì trước khi tải trang?","options":["A. Tải ngay không cần gì","B. Hỏi máy chủ DNS để đổi tên miền thành địa chỉ IP","C. Gọi điện cho chủ web","D. Khởi động lại"],"answer":"B","explain":"Hệ thống DNS phân giải tên miền thành địa chỉ IP để trình duyệt kết nối.","points":0.25},{"type":"mcq","level":"VD","q":"Một văn phòng có 20 máy tính cần truy cập Internet qua một đường truyền. Thiết bị cần thiết là","options":["A. 20 đường truyền riêng","B. Router để chia sẻ một đường truyền cho nhiều máy","C. 20 chiếc điện thoại","D. Không cần thiết bị gì"],"answer":"B","explain":"Router chia sẻ kết nối Internet cho nhiều thiết bị trong mạng nội bộ.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về thành phần mạng:","statements":["a) Thiết bị đầu cuối gồm máy tính, điện thoại","b) Router giúp kết nối các mạng với nhau","c) Đường truyền có thể là cáp hoặc sóng không dây","d) Mạng máy tính không cần đường truyền"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: cáp quang, wifi... d) Sai: phải có đường truyền.","points":1},{"type":"truefalse","level":"VDC","q":"Một gia đình lắp Internet cáp quang. Các phát biểu:","statements":["a) Nhà mạng (ISP) cung cấp đường truyền Internet","b) Router phát wifi cho các thiết bị trong nhà","c) Mỗi thiết bị kết nối được cấp một địa chỉ IP","d) Không cần thiết bị nào vẫn dùng được Internet"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cần modem/router.","points":1},{"type":"short","level":"NB","q":"Hệ thống giúp đổi tên miền thành địa chỉ IP có tên là gì?","answer":"DNS","explain":"DNS (Domain Name System) phân giải tên miền.","points":0.5},{"type":"short","level":"VDC","q":"Mô hình mạng trong đó các máy tính bình đẳng, chia sẻ trực tiếp với nhau gọi là mô hình gì?","answer":"ngang hàng","explain":"Mô hình ngang hàng (peer-to-peer): các máy bình đẳng.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Trong mô hình khách-chủ (client-server), máy chủ có vai trò","options":["A. Cung cấp tài nguyên, dịch vụ cho các máy khách","B. Chỉ để trang trí","C. Tắt luôn","D. Chơi game"],"answer":"A","explain":"Máy chủ (server) cung cấp dịch vụ, lưu trữ; máy khách (client) yêu cầu và sử dụng.","points":0.25},{"type":"mcq","level":"NB","q":"Ví dụ về mô hình khách-chủ là","options":["A. Hai điện thoại gửi file qua bluetooth","B. Truy cập website: trình duyệt (khách) yêu cầu, máy chủ web đáp ứng","C. Hai máy tính nối cáp trực tiếp","D. Một máy tính đơn"],"answer":"B","explain":"Duyệt web là mô hình client-server điển hình.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của mô hình khách-chủ là","options":["A. Dữ liệu tập trung, dễ quản lí và bảo mật","B. Không cần máy chủ","C. Rẻ hơn","D. Không cần mạng"],"answer":"A","explain":"Dữ liệu tập trung trên máy chủ nên dễ quản lí, sao lưu và bảo mật.","points":0.25},{"type":"mcq","level":"TH","q":"Nhược điểm của mô hình khách-chủ là","options":["A. Không có nhược điểm","B. Máy chủ hỏng thì cả hệ thống ngừng hoạt động","C. Quá rẻ","D. Dữ liệu phân tán"],"answer":"B","explain":"Phụ thuộc vào máy chủ trung tâm là điểm yếu của mô hình này.","points":0.25},{"type":"mcq","level":"VD","q":"Một lớp học chia sẻ file bài tập trực tiếp giữa các máy tính không qua máy chủ. Đây là mô hình","options":["A. Khách-chủ","B. Ngang hàng (peer-to-peer)","C. Không phải mạng","D. Internet"],"answer":"B","explain":"Các máy bình đẳng, chia sẻ trực tiếp là mô hình ngang hàng.","points":0.25},{"type":"mcq","level":"VDC","q":"Một hệ thống ngân hàng cần bảo mật cao, dữ liệu tập trung. Nên chọn mô hình","options":["A. Ngang hàng","B. Khách-chủ với máy chủ được bảo vệ nghiêm ngặt","C. Không dùng mạng","D. Mỗi máy tự quản lí"],"answer":"B","explain":"Ngân hàng cần quản lí tập trung, phân quyền và bảo mật nên dùng client-server.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về mô hình khách-chủ:","statements":["a) Máy chủ cung cấp dịch vụ cho máy khách","b) Trình duyệt web là một máy khách","c) Máy chủ web là một máy chủ","d) Mô hình khách-chủ không cần mạng"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cần mạng để giao tiếp.","points":1},{"type":"truefalse","level":"VD","q":"So sánh hai mô hình mạng. Các phát biểu:","statements":["a) Khách-chủ: dữ liệu tập trung trên máy chủ","b) Ngang hàng: các máy bình đẳng","c) Ngang hàng phù hợp mạng nhỏ, đơn giản","d) Khách-chủ không bao giờ bị lỗi"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: vẫn có thể lỗi, nhất là ở máy chủ.","points":1},{"type":"short","level":"TH","q":"Trong mô hình khách-chủ, máy tính yêu cầu dịch vụ gọi là gì?","answer":"máy khách","explain":"Máy khách (client) yêu cầu, máy chủ (server) đáp ứng.","points":0.5},{"type":"short","level":"VD","q":"Trong mô hình khách-chủ, máy tính cung cấp dịch vụ gọi là gì?","answer":"máy chủ","explain":"Máy chủ (server).","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Mạng không dây dùng để truyền dữ liệu bằng","options":["A. Dây cáp","B. Sóng điện từ (wifi, bluetooth...)","C. Thư tay","D. Chim bồ câu"],"answer":"B","explain":"Mạng không dây dùng sóng điện từ để truyền dữ liệu.","points":0.25},{"type":"mcq","level":"NB","q":"Ưu điểm của mạng không dây là","options":["A. Linh hoạt, không cần đi dây","B. Luôn nhanh hơn mạng có dây","C. Không bao giờ mất sóng","D. Rẻ hơn mọi trường hợp"],"answer":"A","explain":"Mạng không dây tiện lợi, di chuyển tự do nhưng có thể kém ổn định hơn mạng dây.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các hoạt động sau, hoạt động nào cần tốc độ mạng cao và ổn định nhất?","options":["A. Đọc tin nhắn văn bản","B. Họp trực tuyến có video","C. Gửi email văn bản","D. Xem giờ"],"answer":"B","explain":"Video trực tuyến cần băng thông lớn và ổn định.","points":0.25},{"type":"mcq","level":"TH","q":"Băng thông mạng là","options":["A. Lượng dữ liệu truyền được trong một đơn vị thời gian","B. Chiều rộng của dây cáp","C. Kích thước router","D. Số lượng máy tính"],"answer":"A","explain":"Băng thông (bandwidth) đo bằng bit mỗi giây, ví dụ Mbps.","points":0.25},{"type":"mcq","level":"VDC","q":"Một gia đình 5 người cùng xem video trực tuyến, mỗi video cần 5 Mbps. Gói cước tối thiểu nên chọn là","options":["A. 10 Mbps","B. 25 Mbps","C. 100 Mbps","D. 5 Mbps"],"answer":"B","explain":"5 người × 5 Mbps = 25 Mbps, nên chọn gói tối thiểu 25 Mbps.","points":0.25},{"type":"mcq","level":"TH","q":"Đơn vị đo tốc độ mạng thường dùng là","options":["A. Mbps","B. MB","C. GB","D. Hz"],"answer":"A","explain":"Mbps (megabit mỗi giây) đo tốc độ truyền dữ liệu.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về mạng có dây và không dây:","statements":["a) Mạng có dây thường ổn định hơn","b) Mạng không dây linh hoạt, dễ di chuyển","c) Wifi là mạng không dây","d) Mạng có dây không cần dây cáp"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Một quán cà phê cung cấp wifi miễn phí. Các phát biểu:","statements":["a) Khách có thể truy cập Internet thuận tiện","b) Wifi công cộng tiềm ẩn nguy cơ mất an toàn thông tin","c) Nên hạn chế giao dịch ngân hàng qua wifi công cộng","d) Wifi công cộng luôn an toàn tuyệt đối"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"short","level":"NB","q":"Đại lượng đo lượng dữ liệu truyền được trong một giây, đơn vị Mbps, gọi là gì?","answer":"băng thông","explain":"Băng thông (bandwidth).","points":0.5},{"type":"short","level":"VDC","q":"Một đường truyền 100 Mbps tải file 25 MB mất ít nhất bao nhiêu giây (1 byte = 8 bit)?","answer":"2","explain":"25 MB = 200 Mb. 200 ÷ 100 = 2 giây.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Trình duyệt web dùng để","options":["A. Soạn văn bản","B. Truy cập và hiển thị các trang web","C. Chơi game offline","D. Nghe nhạc"],"answer":"B","explain":"Trình duyệt (Chrome, Edge, Firefox) hiển thị các trang web.","points":0.25},{"type":"mcq","level":"NB","q":"Địa chỉ của một trang web (ví dụ https://saobay.github.io) gọi là","options":["A. URL","B. IP","C. USB","D. LAN"],"answer":"A","explain":"URL là địa chỉ của tài nguyên trên Internet.","points":0.25},{"type":"mcq","level":"NB","q":"Phần “https” ở đầu địa chỉ web cho biết","options":["A. Trang web dùng kết nối được mã hóa, an toàn hơn","B. Trang web rất nhanh","C. Trang web miễn phí","D. Trang web của chính phủ"],"answer":"A","explain":"HTTPS mã hóa dữ liệu truyền giữa trình duyệt và máy chủ.","points":0.25},{"type":"mcq","level":"NB","q":"Công cụ tìm kiếm trên Internet dùng để","options":["A. Tìm kiếm thông tin theo từ khóa","B. Diệt virus","C. Tăng tốc độ mạng","D. Sửa lỗi máy tính"],"answer":"A","explain":"Công cụ tìm kiếm (Google, Bing) tìm thông tin theo từ khóa.","points":0.25},{"type":"mcq","level":"VD","q":"Muốn tìm tài liệu về “an toàn mạng” dưới dạng file PDF, từ khóa tìm kiếm hiệu quả là","options":["A. an toàn mạng","B. an toàn mạng filetype:pdf","C. pdf","D. tài liệu"],"answer":"B","explain":"Thêm filetype:pdf giúp lọc kết quả là file PDF.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trang web ngân hàng thật có địa chỉ đúng, nhưng email gửi link có tên miền gần giống. Đây là dấu hiệu của","options":["A. Khuyến mãi","B. Lừa đảo giả mạo (phishing)","C. Lỗi mạng","D. Quảng cáo"],"answer":"B","explain":"Giả mạo tên miền gần giống để lừa nhập thông tin là phishing.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về web:","statements":["a) Trình duyệt dùng để xem các trang web","b) URL là địa chỉ của trang web"  nhện","D. Đường dây điện thoại"],"answer":"A","explain":"Mạng xã hội là nền tảng trực tuyến kết nối con người.","points":0.25},{"type":"mcq","level":"NB","q":"Hội nghị trực tuyến giúp","options":["A. Họp từ xa qua mạng, tiết kiệm đi lại","B. Gặp mặt trực tiếp","C. Không cần mạng","D. Chỉ họp một người"],"answer":"A","explain":"Hội nghị trực tuyến kết nối nhiều người ở xa qua video.","points":0.25},{"type":"mcq","level":"TH","q":"Lợi ích của học trực tuyến là","options":["A. Học mọi lúc mọi nơi, xem lại bài giảng","B. Không cần học","C. Tự động đỗ","D. Không cần giáo viên"],"answer":"A","explain":"Học trực tuyến linh hoạt về thời gian, địa điểm.","points":0.25},{"type":"mcq","level":"TH","q":"Khi tham gia hội nghị trực tuyến, cần","options":["A. Bật micro suốt buổi","B. Tắt micro khi không phát biểu, mạng ổn định","C. Vừa họp vừa xem phim","D. Không cần chuẩn bị"],"answer":"B","explain":"Tắt micro tránh ồn; mạng ổn định đảm bảo chất lượng.","points":0.25},{"type":"mcq","level":"VD","q":"Một nhóm bạn ở ba tỉnh cùng làm dự án. Công cụ hỗ trợ tốt nhất là","options":["A. Gặp mặt trực tiếp mỗi ngày","B. Nhóm chat, thư mục chia sẻ và họp trực tuyến","C. Gửi thư tay","D. Mỗi người làm riêng"],"answer":"B","explain":"Công cụ trực tuyến giúp cộng tác từ xa hiệu quả.","points":0.25},{"type":"mcq","level":"VDC","q":"Một doanh nghiệp chuyển sang họp trực tuyến hoàn toàn. Thách thức lớn nhất là","options":["A. Thiếu máy tính","B. Đảm bảo an toàn thông tin và gắn kết nhân viên","C. Tốn giấy","D. Đi lại nhiều"],"answer":"B","explain":"Làm việc từ xa đặt ra thách thức về bảo mật và văn hóa gắn kết.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về ứng dụng Internet:","statements":["a) Mạng xã hội giúp kết nối bạn bè","b) Hội nghị trực tuyến giúp họp từ xa","c) Học trực tuyến linh hoạt thời gian","d) Internet chỉ dùng để giải trí"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: nhiều ứng dụng hữu ích.","points":1},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về làm việc nhóm trực tuyến:","statements":["a) Cần phân công rõ ràng","b) Nên dùng thư mục chia sẻ chung","c) Cần thống nhất thời gian họp","d) Không cần trao đổi gì"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cần trao đổi thường xuyên.","points":1},{"type":"short","level":"VD","q":"Hình thức họp qua mạng video, không cần gặp trực tiếp gọi là gì?","answer":"hội nghị trực tuyến","explain":"Hội nghị trực tuyến (video conference).","points":0.5},{"type":"short","level":"VDC","q":"Nền tảng trực tuyến để kết nối và chia sẻ thông tin với cộng đồng gọi là gì?","answer":"mạng xã hội","explain":"Mạng xã hội (social network).","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Cáp quang được dùng để","options":["A. Truyền dữ liệu tốc độ cao bằng ánh sáng","B. Treo quần áo","C. Dẫn điện","D. Dẫn nước"],"answer":"A","explain":"Cáp quang truyền tín hiệu ánh sáng, tốc độ rất cao.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của cáp quang so với cáp đồng là","options":["A. Rẻ hơn","B. Tốc độ cao hơn, ít nhiễu hơn","C. Dễ đấu nối hơn","D. Nhẹ hơn"],"answer":"B","explain":"Cáp quang cho băng thông lớn và ít bị nhiễu điện từ.","points":0.25},{"type":"mcq","level":"TH","q":"Khi mạng chậm vào giờ cao điểm, nguyên nhân có thể là","options":["A. Máy tính hỏng","B. Nhiều người dùng chung băng thông","C. Trời mưa","D. Hết pin"],"answer":"B","explain":"Giờ cao điểm nhiều người dùng làm nghẽn băng thông.","points":0.25},{"type":"mcq","level":"VD","q":"Để kiểm tra tốc độ mạng thực tế, có thể","options":["A. Đoán mò","B. Dùng trang web đo tốc độ mạng","C. Nhìn router","D. Hỏi hàng xóm"],"answer":"B","explain":"Các trang đo tốc độ cho biết tốc độ tải lên/xuống thực tế.","points":0.25},{"type":"mcq","level":"VD","q":"Một gia đình dùng gói 50 Mbps nhưng đo được 48 Mbps. Đánh giá là","options":["A. Bất thường, cần khiếu nại","B. Bình thường do hao hụt đường truyền","C. Mạng bị hack","D. Router ":"Chuẩn giao thức chung giúp thiết bị khác hãng tương thích.","points":0.25},{"type":"mcq","level":"VD","q":"Khi gửi file qua mạng, dữ liệu được chia thành các gói tin. Lợi ích là","options":["A. Làm file nặng hơn","B. Truyền hiệu quả, gói lỗi chỉ cần gửi lại gói đó","C. Làm chậm mạng","D. Không có lợi ích"],"answer":"B","explain":"Chia gói giúp truyền song song, kiểm soát lỗi hiệu quả.","points":0.25},{"type":"mcq","level":"VD","q":"Một gói tin bị lỗi khi truyền. Hệ thống sẽ","options":["A. Bỏ qua luôn","B. Yêu cầu gửi lại gói tin đó","C. Dừng toàn bộ","D. Báo hỏng máy"],"answer":"B","explain":"Giao thức đảm bảo gửi lại gói lỗi để dữ liệu đầy đủ.","points":0.25},{"type":"mcq","level":"VDC","q":"Một cuộc gọi video bị giật, hình đứng. Nguyên nhân liên quan đến gói tin có thể là","options":["A. Màn hình hỏng","B. Nhiều gói tin bị mất hoặc đến trễ do mạng kém","C. Loa hỏng","D. Hết pin"],"answer":"B","explain":"Mất gói hoặc trễ gói gây giật hình, đứng hình khi gọi video.","points":0.25},{"type":"mcq","level":"VDC","q":"Để đảm bảo email đến đúng người nhận trên toàn thế giới, cần","options":["A. Hệ thống địa chỉ duy nhất và giao thức chuẩn toàn cầu","B. Gửi thật nhanh","C. Viết thật dài","D. Đính kèm nhiều file"],"answer":"A","explain":"Địa chỉ email duy nhất và giao thức chuẩn giúp định tuyến chính xác.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về truyền dữ liệu:","statements":["a) Dữ liệu được chia thành các gói tin để truyền","b) Gói tin lỗi sẽ được gửi lại","c) Các gói tin có thể đi theo đường khác nhau","d) Dữ liệu truyền đi là gửi nguyên cả file một lần"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: chia thành gói tin.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về giao thức:","statements":["a) Giao thức là quy tắc giao tiếp trên mạng","b) Nhờ giao thức chuẩn mà thiết bị khác hãng kết nối được","c) HTTP là giao thức truyền trang web","d) Mỗi thiết bị dùng giao thức riêng tùy ý"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: phải theo chuẩn chung.","points":1},{"type":"short","level":"TH","q":"Tập hợp các quy tắc giúp các thiết bị giao tiếp được với nhau trên mạng gọi là gì?","answer":"giao thức","explain":"Giao thức (protocol).","points":0.5},{"type":"short","level":"VD","q":"Đơn vị dữ liệu nhỏ được chia ra để truyền trên mạng gọi là gì?","answer":"gói tin","explain":"Gói tin (packet).","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Thiết bị nào sau đây là thiết bị đầu cuối của mạng?","options":["A. Máy tính","B. Dây cáp","C. Sóng wifi","D. Giao thức"],"answer":"A","explain":"Máy tính, điện thoại là thiết bị đầu cuối; cáp, sóng là đường truyền.","points":0.25},{"type":"mcq","level":"TH","q":"Một gia đình muốn các thiết bị dùng chung một máy in. Cách đơn giản là","options":["A. Mỗi người một máy in","B. Kết nối máy in vào mạng wifi gia đình","C. Chép file sang USB để in","D. Không dùng máy in"],"answer":"B","explain":"Máy in mạng cho phép mọi thiết bị dùng chung.","points":0.25},{"type":"mcq","level":"VD","q":"Hai máy tính ở hai phòng muốn chia sẻ file nhanh và ổn định. Cách tốt là","options":["A. Gửi qua mạng nội bộ (LAN)","B. Chép ra giấy","C. Đọc to cho nhau nghe","D. Gửi thư tay"],"answer":"A","explain":"Mạng LAN nội bộ chia sẻ file nhanh, ổn định.","points":0.25},{"type":"mcq","level":"VD","q":"Để truy cập Internet, gia đình cần đăng kí với","options":["A. Cửa hàng điện thoại","B. Nhà cung cấp dịch vụ Internet (ISP)","C. Trường học","D. Ủy ban nhân dân"],"answer":"B","explain":"ISP cung cấp đường truyền Internet.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty có máy chủ đặt tại trụ sở, nhân viên ở nhà truy cập qua Internet. Để an toàn, công ty nên","options":["A. Mở toàn bộ cho Internet","B. Dùng kết nối được mã hóa và phân quyền truy cập","C. Không cho truy cập","D. Chia sẻ mật khẩu chung"],"answer":"B","explain":"Truy cập từ xa cần mã hóa và phân quyền để bảo vệ dữ liệu.","points":0.25},{"type":"mcq","level":"VDC","q":"Khi một website quá tải do quá nhiều người truy cập, hiện tượng này cho thấy","options":["A. Mạng bị hack","B. Máy chủ không đáp ứng kịp số lượng yêu cầu","C. Trình duyệt hỏng","D. Hết pin"],"answer":"B","explain":"Quá tải yêu cầu vượt khả năng máy chủ gây chậm hoặc sập.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về chia sẻ tài nguyên:","statements":["a) Nhiều máy tính có thể dùng chung một máy in mạng","b) Chia sẻ file qua mạng nhanh hơn chép tay","c) Chia sẻ tài nguyên giúp tiết kiệm chi phí","d) Mạng máy tính không thể chia sẻ tài nguyên"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về Internet:","statements":["a) Internet kết nối hàng tỉ thiết bị toàn cầu","b) Cần đăng kí với ISP để dùng Internet","c) Trình duyệt dùng để xem trang web","d) Internet chỉ có ở thành phố"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: Internet phủ khắp nơi.","points":1},{"type":"short","level":"TH","q":"Nhà cung cấp dịch vụ Internet viết tắt là gì?","answer":"ISP","explain":"ISP (Internet Service Provider).","points":0.5},{"type":"short","level":"TH","q":"Mạng trong phạm vi một trường học gọi là mạng gì?","answer":"LAN","explain":"Mạng cục bộ LAN.","points":0.5}]}]}
