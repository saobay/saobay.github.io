ọc đánh giá; đặt qua kênh uy tín","C. Đi không cần chuẩn bị","D. Nghe theo quảng cáo"],"answer":"B","explain":"Lập kế hoạch dựa trên thông tin đối chiếu giúp chuyến đi tốt.","points":0.25},{"type":"mcq","level":"VDC","q":"Khi thấy hai nguồn đưa tin trái ngược về một sự kiện, cách xử lí của công dân số là","options":["A. Tin nguồn mình thích","B. Tìm thêm nguồn chính thống, đối chiếu trước khi kết luận","C. Chia sẻ cả hai","D. Bỏ qua"],"answer":"B","explain":"Đối chiếu nguồn chính thống là cách của công dân số có trách nhiệm.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét việc tra cứu thông tin đời sống. Các phát biểu:","statements":["a) Nên dùng nguồn chính thức khi cần thông tin quan trọng","b) Nên so sánh giá trước khi mua hàng trực tuyến","c) Nên đọc đánh giá của người dùng trước","d) Quảng cáo luôn đưa thông tin đầy đủ"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: quảng cáo có thể phóng đại.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về khai thác Internet đời sống:","statements":["a) Có thể tra cứu thời tiết, bản đồ","b) Có thể so sánh giá khi mua sắm","c) Có thể đặt vé, phòng trực tuyến","d) Mọi thông tin trên mạng đều chính xác"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cần kiểm chứng.","points":1},{"type":"short","level":"TH","q":"Việc mua bán hàng hóa qua mạng Internet gọi là gì?","answer":"thương mại điện tử","explain":"Thương mại điện tử.","points":0.5},{"type":"short","level":"VD","q":"Khi mua hàng trực tuyến, nên đọc gì của những người mua trước?","answer":"đánh giá","explain":"Đánh giá của người dùng giúp quyết định đúng.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Khi cần tìm nhanh một thông tin, việc đầu tiên nên làm là","options":["A. Hỏi bạn bè","B. Xác định từ khóa và dùng công cụ tìm kiếm","C. Đoán mò","D. Chờ người khác tìm hộ"],"answer":"B","explain":"Xác định từ khóa rồi tìm kiếm là cách chủ động nhất.","points":0. ","q":"Xét các phát biểu về sử dụng tài nguyên mạng:","statements":["a) Nên ghi nguồn khi dùng tài liệu của người khác","b) Nên tôn trọng bản quyền","c) Nên kiểm chứng thông tin quan trọng","d) Có thể phát tán mọi thứ tìm được"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"short","level":"TH","q":"Kí hiệu nào giúp tìm chính xác một cụm từ theo đúng thứ tự?","answer":"ngoặc kép","explain":"Đặt cụm từ trong ngoặc kép.","points":0.5},{"type":"short","level":"VD","q":"Toán tử nào giúp chỉ tìm file có định dạng PDF?","answer":"filetype:pdf","explain":"Ví dụ: đề thi filetype:pdf.","points":0.5}]}]}
