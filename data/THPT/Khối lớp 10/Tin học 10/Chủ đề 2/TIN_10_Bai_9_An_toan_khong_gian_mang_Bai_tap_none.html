{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Không gian mạng là","options":["A. Khoảng trống trong nhà","B. Môi trường số trên Internet nơi con người giao tiếp, làm việc","C. Bầu trời","D. Phòng máy tính"],"answer":"B","explain":"Không gian mạng là môi trường số được tạo bởi Internet và các thiết bị kết nối.","points":0.25},{"type":"mcq","level":"NB","q":"Virus máy tính là","options":["A. Vi khuẩn gây bệnh","B. Phần mềm độc hại có khả năng tự lây lan, phá hoại dữ liệu","C. Một loại thuốc","D. Thiết bị phần cứng"],"answer":"B","explain":"Virus là mã độc tự nhân bản và lây lan, gây hại cho hệ thống.","points":0.25},{"type":"mcq","level":"NB","q":"Dấu hiệu máy tính có thể nhiễm virus là","options":["A. Chạy chậm bất thường, hiện quảng cáo lạ, file bị mất","B. Màn hình sáng đẹp","C. Loa to","D. Pin đầy"],"answer":"A","explain":"Chạy chậm, quảng cáo lạ, file biến mất là dấu hiệu nhiễm mã độc.","points":0.25},{"type":"mcq","level":"NB","q":"Để phòng chống virus, nên","options":["A. Cài phần mềm diệt virus uy tín và cập nhật thường xuyên","B. Không bao giờ dùng Internet","C. Tắt máy tính","D. Xóa hết file"],"answer":"A","explain":"Phần mềm diệt virus cập nhật giúp phát hiện mã độc mới.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn nhận được file “diemthi.exe” từ người lạ qua tin nhắn. Hành động đúng là","options":["A. Mở ngay xem điểm","B. Không mở, xóa tin nhắn vì file lạ có thể chứa virus","C. Chuyển cho bạn bè","D. Cài đặt ngay"],"answer":"B","explain":"File thực thi từ người lạ rất nguy hiểm, có thể là mã độc.","points":0.25},{"type":"mcq","level":"VDC","q":"Một USB lạ nhặt được ngoài sân trường. Xử lí an toàn nhất là","options":["A. Cắm vào máy tính xem có gì","B. Không cắm vào máy, giao cho thầy cô hoặc bỏ đi","C. Cắm vào máy trường","D. Mang về nhà cắm thử"],"answer":"B","explain":"USB lạ có thể chứa mã độc tự chạy; không cắm vào bất kì máy nào.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về virus máy tính:","statements":["a) Virus là phần mềm độc hại","b) Virus có thể lây qua USB, email, file tải về","c) Phần mềm diệt virus giúp phòng chống","d) Virus chỉ lây qua không khí"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: lây qua dữ liệu số.","points":1},{"type":"truefalse","level":"VD","q":"Máy tính của bạn An chạy chậm, hay hiện cửa sổ lạ. Các phát biểu:","statements":["a) Có thể máy đã nhiễm mã độc","b) Nên quét bằng phần mềm diệt virus","c) Nên gỡ các phần mềm lạ mới cài","d) Nên tiếp tục dùng bình thường"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cần xử lí ngay.","points":1},{"type":"short","level":"NB","q":"Phần mềm độc hại có khả năng tự lây lan, phá hoại dữ liệu gọi là gì?","answer":"virus","explain":"Virus máy tính.","points":0.5},{"type":"short","level":"TH","q":"Phần mềm giúp phát hiện và loại bỏ mã độc gọi là gì?","answer":"phần mềm diệt virus","explain":"Phần mềm diệt virus (antivirus).","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Lừa đảo qua mạng (phishing) là","options":["A. Câu cá","B. Giả mạo để lừa lấy thông tin, tiền bạc của nạn nhân","C. Chơi game","D. Mua sắm"],"answer":"B","explain":"Phishing giả danh người quen, tổ chức uy tín để lừa đảo.","points":0.25},{"type":"mcq","level":"NB","q":"Tin giả trên mạng là","options":["A. Tin tức chính thống","B. Thông tin sai sự thật được lan truyền","C. Tin dự báo thời tiết","D. Tin thể thao"],"answer":"B","explain":"Tin giả là thông tin bịa đặt, sai lệch gây hoang mang.","points":0.25},{"type":"mcq","level":"NB","q":"Dấu hiệu của tin nhắn lừa đảo là","options":["A. Giục giã khẩn cấp, yêu cầu bấm link hoặc cung cấp thông tin cá nhân","B. Lời chào lịch sự","C. Không có link","D. Gửi từ người quen đã xác minh"],"answer":"A","explain":"Tạo sự khẩn cấp giả là thủ đoạn phổ biến của lừa đảo.","points":0.25},{"type":"mcq","level":"NB","q":"Khi thấy tin giật gân trên mạng, nên","options":["A. Chia sẻ ngay","B. Kiểm chứng từ nguồn u các phát biểu về thông tin cá nhân:","statements":["a) Họ tên, số điện thoại là thông tin cá nhân","b) Không nên đăng giấy tờ tùy thân lên mạng","c) Nên cài đặt quyền riêng tư cho tài khoản","d) Có thể chia sẻ mật khẩu cho bạn thân"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VD","q":"Bạn Minh bị một tài khoản lạ nhắn tin đe dọa. Các phát biểu:","statements":["a) Nên lưu lại tin nhắn làm bằng chứng","b) Nên chặn tài khoản đó","c) Nên báo cho bố mẹ, thầy cô","d) Nên hẹn gặp người đó để giải quyết"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: rất nguy hiểm.","points":1},{"type":"short","level":"TH","q":"Hành vi dùng mạng để đe dọa, xúc phạm người khác gọi là gì?","answer":"bắt nạt trực tuyến","explain":"Bắt nạt trực tuyến (cyberbullying).","points":0.5},{"type":"short","level":"VD","q":"Khi bị quấy rối trên mạng, việc đầu tiên nên làm là lưu giữ gì?","answer":"bằng chứng","explain":"Lưu bằng chứng (ảnh chụp tin nhắn) để báo cáo.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Mật khẩu mạnh là mật khẩu","options":["A. Ngắn gọn dễ nhớ","B. Dài, gồm chữ hoa, chữ thường, số và kí tự đặc biệt","C. Là ngày sinh","D. Là tên mình"],"answer":"B","explain":"Mật khẩu mạnh khó bị đoán hoặc dò tìm.","points":0.25},{"type":"mcq","level":"NB","q":"Xác thực hai yếu tố giúp","options":["A. Đăng nhập nhanh hơn","B. Tăng cường bảo mật tài khoản","C. Quên mật khẩu dễ hơn","D. Không cần mật khẩu"],"answer":"B","explain":"2FA thêm lớp bảo vệ bằng mã xác nhận.","points":0.25},{"type":"mcq","level":"TH","q":"Thói quen tốt để bảo vệ tài khoản là","options":["A. Dùng một mật khẩu cho mọi tài khoản","B. Đặt mật khẩu khác nhau cho tài khoản quan trọng, đổi định kì","C. Ghi mật khẩu dán lên màn hình","D. Chia sẻ mật khẩu cho bạn"],"answer":"B","explain":"Mật khẩu riêng cho từng tài khoản quan trọng giảm rủi ro dây chuyền.","points":0.25},{"type":"mcq","level":"TH","q":"Khi đăng nhập trên máy tính công cộng, sau khi xong cần","options":["A. Để nguyên","B. Đăng xuất và xóa lịch sử duyệt web","C. Lưu mật khẩu","D. Tắt màn hình"],"answer":"B","explain":"Đăng xuất tránh người khác truy cập tài khoản.","points":0.25},{"type":"mcq","level":"VDC","q":"Một bạn dùng mật khẩu “123456” cho email, mạng xã hội và ngân hàng. Đánh giá đúng là","options":["A. Tiện lợi, an toàn","B. Rất nguy hiểm: mật khẩu yếu và dùng chung, một chỗ lộ là mất hết","C. Mật khẩu mạnh","D. Không vấn đề gì"],"answer":"B","explain":"Mật khẩu yếu + dùng chung là hai lỗi nghiêm trọng.","points":0.25},{"type":"mcq","level":"VD","q":"Nhận được email yêu cầu đổi mật khẩu qua link. Cách kiểm tra an toàn là","options":["A. Bấm link ngay","B. Tự gõ địa chỉ trang chính thức vào trình duyệt để đổi","C. Nhờ bạn bấm hộ","D. Bỏ qua mọi email"],"answer":"B","explain":"Tự truy cập trang chính thức tránh link giả mạo.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về bảo vệ tài khoản:","statements":["a) Mật khẩu mạnh gồm nhiều loại kí tự","b) Nên bật xác thực hai yếu tố","c) Không dùng chung mật khẩu cho tài khoản quan trọng","d) Có thể lưu mật khẩu trên máy tính công cộng"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"VDC","q":"Tài khoản mạng xã hội của bạn bị đăng nhập lạ. Các phát biểu:","statements":["a) Nên đổi mật khẩu ngay","b) Nên kiểm tra và đăng xuất các phiên lạ","c) Nên bật xác thực hai yếu tố","d) Nên chia sẻ cho bạn bè cùng dùng"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"short","level":"NB","q":"Mã xác nhận một lần gửi về điện thoại khi đăng nhập gọi là mã gì?","answer":"OTP","explain":"OTP (One-Time Password).","points":0.5},{"type":"short","level":"VDC","q":"Biện pháp đăng nhập cần cả mật khẩu và mã xác nhận gọi là gì?","answer":"xác thực hai yếu tố","explain":"Xác thực hai yếu tố (2FA).","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Ứng xử văn minh trên mạng là","options":["A. Bình luận lịch sự, tôn trọng người khác","B. Chửi bới, xúc phạm","C. Tung tin đồn","D. Quấy rối"],"answer":"A","explain":"Văn minh mạng: lịch sự, tôn trọng, có trách nhiệm.","points":0.25},{"type":"mcq","level":"NB","q":"Khi bình luận trên mạng, cần tránh","options":["A. Ngôn từ tục tĩu, xúc phạm người khác","B. Góp ý chân thành","C. Chia sẻ kiến thức","D. Động viên bạn bè"],"answer":"A","explain":"Ngôn từ xúc phạm vi phạm quy tắc ứng xử và có thể vi phạm pháp luật.","points":0.25},{"type":"mcq","level":"TH","q":"Trước khi chia sẻ một thông tin, cần","options":["A. Chia sẻ ngay cho nóng","B. Kiểm chứng tính xác thực","C. Thêm thắt cho hấp dẫn","D. Xóa nguồn"],"answer":"B","explain":"Kiểm chứng tránh lan truyền tin giả.","points":0.25},{"type":"mcq","level":"TH","q":"Khi dùng ảnh của người khác, cần","options":["A. Cứ dùng tự do","B. Xin phép và ghi nguồn","C. Xóa logo","D. Nhận là của mình"],"answer":"B","explain":"Tôn trọng quyền của người khác, tránh vi phạm bản quyền.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn thấy bạn mình bị trêu chọc ác ý trong nhóm chat lớp. Nên","options":["A. Hùa theo cho vui","B. Can ngăn, động viên bạn và báo thầy cô nếu nghiêm trọng","C. Rời nhóm","D. Chụp màn hình đăng công khai"],"answer":"B","explain":"Can ngăn bắt nạt, bảo vệ bạn là hành xử đúng.","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh lập trang giả mạo trường để đăng tin sai sự thật. Hành vi này","options":["A. Vô hại, chỉ đùa","B. Vi phạm pháp luật, có thể bị xử lí","C. Được khen sáng tạo","D. Không ai quan tâm"],"answer":"B","explain":"Giả mạo tổ chức, tung tin giả là hành vi vi phạm pháp luật.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về ứng xử trên mạng:","statements":["a) Nên bình luận lịch sự","b) Nên tôn trọng người khác","c) Nên kiểm chứng trước khi chia sẻ","d) Có thể xúc phạm người khác thoải mái"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về trách nhiệm trên mạng:","statements":["a) Chịu trách nhiệm về những gì mình đăng","b) Không lan truyền tin chưa kiểm chứng","c) Tôn trọng bản quyền tác giả","d) Ẩn danh nên không cần chịu trách nhiệm"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: vẫn phải chịu trách nhiệm.","points":1},{"type":"short","level":"TH","q":"Việc dùng mạng để đe dọa, làm nhục người khác có thể bị xử lí theo quy định của điều gì?","answer":"pháp luật","explain":"Hành vi vi phạm trên mạng bị xử lí theo pháp luật.","points":0.5},{"type":"short","level":"VD","q":"Trước khi chia sẻ thông tin, việc kiểm tra tính đúng đắn của thông tin gọi là gì?","answer":"kiểm chứng","explain":"Kiểm chứng thông tin.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Sao lưu dữ liệu giúp","options":["A. Khôi phục dữ liệu khi bị mất hoặc hỏng","B. Tăng tốc độ mạng","C. Diệt virus","D. Chơi game mượt hơn"],"answer":"A","explain":"Sao lưu (backup) là copy dữ liệu ra nơi khác để khôi phục khi cần.","points":0.25},{"type":"mcq","level":"TH","q":"Cập nhật phần mềm thường xuyên giúp","options":["A. Vá lỗi bảo mật và cải thiện tính năng","B. Máy nặng hơn","C. Tốn pin","D. Mất dữ liệu"],"answer":"A","explain":"Bản cập nhật vá lỗ hổng bảo mật mà kẻ xấu có thể lợi dụng.","points":0.25},{"type":"mcq","level":"TH","q":"Khi tải file từ Internet, nên","options":["A. Tải từ trang chính thức, quét virus sau khi tải","B. Tải từ mọi trang","C. Tắt phần mềm diệt virus","D. Mở ngay không cần kiểm tra"],"answer":"A","explain":"Nguồn chính thức và quét virus giảm nguy cơ mã độc.","points":0.25},{"type":"mcq","level":"TH","q":"Một file quan trọng bị mã độc mã hóa đòi tiền chuộc. Nếu đã sao lưu định kì thì","options":["A. Phải trả tiền","B. Có thể khôi phục từ bản sao lưu mà không cần trả tiền","C. Mất vĩnh viễn","D. Mua máy mới"],"answer":"B","explain":"Sao lưu là “phao cứu sinh” trước mã độc tống tiền.","points":0.25},{"type":"mcq","level":"VDC","q":"Một doanh nghiệp bị tấn công mạng làm gián đoạn dịch vụ. Biện pháp phòng ngừa toàn diện gồm","options":["A. Chỉ cài phần mềm diệt virus","B. Sao lưu định kì, cập nhật hệ thống, phân quyền truy cập, đào tạo nhân viên","C. Ngắt mạng vĩnh viễn","D. Không cần làm gì"],"answer":"B","explain":"An toàn thông tin cần nhiều lớp: kĩ thuật, quy trình và con người.","points":0.25},{"type":"mcq","level":"VDC","q":"Nguyên tắc “không tin tưởng tuyệt đối” khi dùng mạng nghĩa là","options":["A. Không dùng mạng","B. Luôn cảnh giác, kiểm chứng trước khi tin và hành động","C. Tin mọi thứ","D. Chỉ dùng một trang web"],"answer":"B","explain":"Cảnh giác và kiểm chứng là nguyên tắc vàng an toàn mạng.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về phòng vệ trên mạng:","statements":["a) Nên sao lưu dữ liệu quan trọng","b) Nên cập nhật phần mềm thường xuyên","c) Nên tải file từ nguồn uy tín","d) Không cần biện pháp bảo vệ nào"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về thói quen an toàn:","statements":["a) Kiểm tra kĩ link trước khi bấm","b) Không mở file lạ từ người không quen","c) Đăng xuất sau khi dùng máy công cộng","d) Chia sẻ mật khẩu wifi nhà cho người lạ"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"short","level":"NB","q":"Việc copy dữ liệu ra nơi khác để phòng mất mát gọi là gì?","answer":"sao lưu","explain":"Sao lưu (backup).","points":0.5},{"type":"short","level":"VDC","q":"Mã độc mã hóa dữ liệu rồi đòi tiền chuộc để mở khóa gọi là gì?","answer":"mã độc tống tiền","explain":"Ransomware — mã độc tống tiền.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Khi phát hiện tài khoản của mình bị đăng nhập lạ, cần","options":["A. Đổi mật khẩu ngay và kiểm tra hoạt động","B. Để yên","C. Xóa tài khoản","D. Chia sẻ cho bạn bè"],"answer":"A","explain":"Đổi mật khẩu ngay để ngăn kẻ xấu.","points":0.25},{"type":"mcq","level":"TH","q":"Để nhận biết email lừa đảo, chú ý","options":["A. Địa chỉ người gửi lạ, giục giã, yêu cầu thông tin nhạy cảm","B. Email dài","C. Email có ảnh","D. Email tiếng Việt"],"answer":"A","explain":"Đó là các dấu hiệu điển hình của phishing.","points":0.25},{"type":"mcq","level":"TH","q":"Bạn click nhầm vào link lạ và trang yêu cầu nhập mật khẩu. Nên","options":["A. Nhập mật khẩu","B. Đóng trang ngay, không nhập gì; đổi mật khẩu nếu đã nhập","C. Tải thêm","D. Chia sẻ link"],"answer":"B","explain":"Không nhập thông tin vào trang đáng ngờ.","points":0.25},{"type":"mcq","level":"VD","q":"Một ứng dụng ngân hàng giả yêu cầu cấp quyền đọc tin nhắn. Nên","options":["A. Cấp quyền ngay","B. Không cài, tải app chính thức từ cửa hàng uy tín","C. Nhờ bạn cài hộ","D. Tắt mạng rồi cài"],"answer":"B","explain":"App giả mạo đánh cắp mã OTP qua quyền đọc tin nhắn.","points":0.25},{"type":"mcq","level":"VDC","q":"Kẻ xấu gọi điện giả danh shipper yêu cầu chuyển khoản trước để nhận hàng. Đây là","options":["A. Dịch vụ tốt","B. Lừa đảo giả danh","C. Khuyến mãi","D. Giao hàng nhanh"],"answer":"B","explain":"Giả danh shipper lừa chuyển khoản là thủ đoạn phổ biến.","points":0.25},{"type":"mcq","level":"VDC","q":"Để giúp người thân lớn tuổi tránh bị lừa qua điện thoại, cần","options":["A. Cấm dùng điện thoại","B. Hướng dẫn nhận biết dấu hiệu lừa đảo và quy tắc không chuyển tiền, không cung cấp OTP","C. Để tự xoay xở","D. Tắt máy"],"answer":"B","explain":"Trang bị kiến thức là cách bảo vệ bền vững.","points":0.25},{"type":"truefalse","level":"VD","q":"Bạn Hoa nhận tin nhắn trúng thưởng. Các phát biểu:","statements":["a) Không nên bấm vào link","b) Không cung cấp thông tin cá nhân","c) Nên xóa tin nhắn","d) Nên chuyển tiếp cho nhiều người"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về xử lí sự cố:","statements":["a) Phát hiện đăng nhập lạ thì đổi mật khẩu ngay","b) Lỡ bấm link lạ thì không nhập thông tin","c) Nên báo cho người lớn khi nghi bị lừa","d) Bị lừa thì giấu không nói với ai"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cần báo để được giúp.","points":1},{"type":"short","level":"TH","q":"Email giả mạo nhằm lừa lấy thông tin cá nhân gọi là email gì?","answer":"email lừa đảo","explain":"Email phishing.","points":0.5},{"type":"short","level":"VD","q":"Khi nghi ngờ bị lừa đảo qua mạng, nên báo cho ai?","answer":"người lớn","explain":"Báo cho bố mẹ, thầy cô hoặc cơ quan chức năng.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Hành vi nào sau đây bị cấm trên không gian mạng?","options":["A. Học trực tuyến","B. Tung tin giả, xúc phạm người khác","C. Gọi video cho bạn","D. Đọc báo"],"answer":"B","explain":"Tung tin giả, xúc phạm là hành vi vi phạm pháp luật.","points":0.25},{"type":"mcq","level":"TH","q":"Khi vô tình xem được nội dung xấu trên mạng, nên","options":["A. Chia sẻ cho bạn bè xem","B. Tắt đi, không lan truyền và báo cáo nếu cần","C. Lưu lại xem tiếp","D. Bình luận khen"],"answer":"B","explain":"Không tiếp tay lan truyền nội dung xấu.","points":0.25},{"type":"mcq","level":"TH","q":"Để xây dựng môi trường mạng lành mạnh, mỗi người nên","options":["A. Chỉ trích người khác","B. Chia sẻ thông tin hữu ích, ứng xử văn minh","C. Đăng tin giật gân","D. Ẩn danh quấy rối"],"answer":"B","explain":"Mỗi người góp phần bằng hành xử văn minh.","points":0.25},{"type":"mcq","level":"VD","q":"Một bạn quay lén bạn khác trong nhà vệ sinh rồi đăng lên mạng. Hành vi này","options":["A. Vô hại","B. Xâm phạm quyền riêng tư, vi phạm pháp luật nghiêm trọng","C. Được phép nếu xóa sau","D. Chỉ bị nhắc nhở"],"answer":"B","explain":"Quay lén và phát tán là hành vi vi phạm pháp luật nghiêm trọng.","points":0.25},{"type":"mcq","level":"VD","q":"Khi bạn bè rủ tham gia “thử thách” nguy hiểm trên mạng, nên","options":["A. Tham gia cho vui","B. Từ chối và khuyên bạn không làm theo","C. Quay video đăng lên","D. Rủ thêm người"],"answer":"B","explain":"Thử thách nguy hiểm gây hại sức khỏe, tính mạng.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nhóm học sinh lập fanpage trường đăng tin chính thống, tuyên truyền an toàn mạng. Đây là","options":["A. Việc làm vô ích","B. Cách dùng mạng tích cực, có trách nhiệm","C. Vi phạm quy định","D. Lãng phí thời gian"],"answer":"B","explain":"Dùng mạng để lan tỏa điều tốt là công dân số có trách nhiệm.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về pháp luật trên mạng:","statements":["a) Tung tin giả là vi phạm pháp luật","b) Xúc phạm người khác trên mạng có thể bị xử lí","c) Mọi hành vi trên mạng đều được phép","d) Cần chịu trách nhiệm về những gì mình đăng"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về môi trường mạng lành mạnh:","statements":["a) Nên chia sẻ thông tin hữu ích","b) Nên báo cáo nội dung xấu","c) Nên giúp đỡ người bị bắt nạt","d) Nên lan truyền tin giật gân chưa kiểm chứng"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"short","level":"NB","q":"Người dùng mạng một cách an toàn, văn minh và có trách nhiệm được gọi là gì?","answer":"công dân số","explain":"Công dân số (digital citizen).","points":0.5},{"type":"short","level":"VD","q":"Hành vi tung tin sai sự thật gây hoang mang có thể bị xử lí theo quy định nào?","answer":"pháp luật","explain":"Vi phạm pháp luật về an ninh mạng.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Phần mềm độc hại lây qua USB thường tự chạy khi","options":["A. Cắm USB vào máy tính","B. Nhìn vào USB","C. Cầm USB trên tay","D. Để USB trong cặp"],"answer":"A","explain":"Mã độc có thể tự chạy khi USB được cắm vào máy.","points":0.25},{"type":"mcq","level":"TH","q":"Để dùng USB an toàn, nên","options":["A. Cắm vào mọi máy","B. Quét virus USB trước khi mở file","C. Không bao giờ dùng USB","D. Cho người lạ mượn"],"answer":"B","explain":"Quét virus giúp phát hiện mã độc trong USB.","points":0.25},{"type":"mcq","level":"VD","q":"Máy tính ở phòng tin báo có virus. Học sinh nên","options":["A. Tự ý sửa","B. Báo thầy cô và không cắm USB cá nhân vào","C. Cắm USB vào chép bài","D. Tắt hết các máy"],"answer":"B","explain":"Báo thầy cô xử lí; tránh lây lan qua USB.","points":0.25},{"type":"mcq","level":"VD","q":"Một file Word tải về yêu cầu “bật macro” mới xem được. Nên","options":["A. Bật ngay","B. Cảnh giác: macro có thể chứa mã độc, chỉ bật với file tin cậy","C. Xóa Word","D. In ra giấy"],"answer":"B","explain":"Macro là kênh lây mã độc phổ biến trong file văn phòng.","points":0.25},{"type":"mcq","level":"VDC","q":"Kẻ xấu gửi file “luong.exe” giả danh bảng lương công ty. Nhân viên mất cảnh giác mở file. Hậu quả có thể là","options":["A. Không sao","B. Mã độc xâm nhập, đánh cắp dữ liệu công ty","C. Được tăng lương","D. Máy chạy nhanh hơn"],"answer":"B","explain":"File thực thi giả danh là cách phát tán mã độc điển hình.","points":0.25},{"type":"mcq","level":"VDC","q":"Để bảo vệ hệ thống của trường học, cần","options":["A. Cấm học sinh dùng máy tính","B. Phần mềm diệt virus, cập nhật hệ thống, hướng dẫn học sinh an toàn mạng","C. Ngắt mạng vĩnh viễn","D. Không cần làm gì"],"answer":"B","explain":"Bảo vệ nhiều lớp: kĩ thuật và giáo dục người dùng.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về mã độc:","statements":["a) File .exe từ người lạ có thể chứa mã độc","b) USB lạ có thể lây virus","c) Macro trong file văn phòng có thể chứa mã độc","d) Mọi file tải về đều an toàn"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về sử dụng USB an toàn:","statements":["a) Nên quét virus USB trước khi dùng","b) Không cắm USB không rõ nguồn gốc","c) Nên sao lưu dữ liệu trong USB","d) USB không bao giờ lây virus"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"short","level":"TH","q":"Chức năng tự động chạy khi cắm USB có thể bị lợi dụng để phát tán mã độc. Nên làm gì với USB lạ?","answer":"quét virus","explain":"Quét virus trước khi mở file trong USB lạ.","points":0.5},{"type":"short","level":"VD","q":"Loại file thực thi trong Windows thường có đuôi gì?","answer":"exe","explain":"File .exe là file thực thi, cần cẩn trọng.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Khi lướt web thấy cửa sổ hiện “máy bạn trúng virus, bấm để sửa”, nên","options":["A. Bấm ngay","B. Tắt cửa sổ, không bấm vì đây là chiêu lừa","C. Gọi số điện thoại hiện trên đó","D. Tải phần mềm theo yêu cầu"],"answer":"B","explain":"Cửa sổ dọa virus giả là chiêu lừa cài mã độc.","points":0.25},{"type":"mcq","level":"TH","q":"Một người bạn nhờ “cho mượn mã OTP để nhận quà”. Nên","options":["A. Cho mượn ngay","B. Từ chối vì OTP là bí mật cá nhân","C. Hỏi thêm mã khác","D. Gửi kèm mật khẩu"],"answer":"B","explain":"OTP tuyệt đối không chia sẻ cho bất kì ai.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vô tình đăng nhập tài khoản mạng xã hội trên máy tính của quán net rồi ra về. Việc cần làm ngay là","options":["A. Mặc kệ","B. Đổi mật khẩu từ thiết bị của mình và đăng xuất mọi phiên","C. Xóa ứng dụng","D. Đợi hôm sau quay lại"],"answer":"B","explain":"Đổi mật khẩu và đăng xuất từ xa ngăn người khác dùng tài khoản.","points":0.25},{"type":"mcq","level":"VD","q":"Một trang web yêu cầu cài “plugin” mới xem được video. Nên","options":["A. Cài ngay","B. Cảnh giác: chỉ cài từ nguồn chính thức, kiểm tra kĩ","C. Nhờ bạn cài hộ","D. Tắt phần mềm diệt virus rồi cài"],"answer":"B","explain":"Plugin lạ có thể là mã độc trá hình.","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh bị lộ ảnh riêng tư do bạn bè chia sẻ. Để phòng ngừa, học sinh cần","options":["A. Không chụp ảnh","B. Cẩn trọng khi chia sẻ ảnh riêng tư, chỉ gửi cho người tin cậy","C. Đăng công khai cho mọi người","D. Xóa hết ảnh"],"answer":"B","explain":"Ảnh đã gửi đi khó thu hồi; cần cẩn trọng từ đầu.","points":0.25},{"type":"mcq","level":"VDC","q":"Trường học tổ chức buổi tuyên truyền an toàn mạng. Nội dung quan trọng nhất là","options":["A. Cách chơi game","B. Nhận biết nguy cơ, kĩ năng tự bảo vệ và ứng xử có trách nhiệm","C. Cách hack","D. Cách ẩn danh quấy rối"],"answer":"B","explain":"Giáo dục kĩ năng an toàn mạng là nội dung cốt lõi.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về chiêu trò lừa đảo:","statements":["a) Cửa sổ dọa virus giả là chiêu lừa phổ biến","b) Không nên bấm vào cảnh báo lạ trên web","c) Nên gọi số điện thoại hiện trong cảnh báo","d) Phần mềm diệt virus uy tín không dọa dẫm kiểu đó"],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: số đó của kẻ lừa đảo. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về bảo vệ bản thân trên mạng:","statements":["a) Không chia sẻ mã OTP","b) Cảnh giác với yêu cầu chuyển tiền qua điện thoại","c) Kiểm chứng thông tin trước khi tin","d) Có thể tin mọi cuộc gọi tự xưng cơ quan chức năng"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"short","level":"TH","q":"Chiêu trò dọa máy nhiễm virus để lừa cài mã độc thường xuất hiện dưới dạng gì?","answer":"cửa sổ quảng cáo","explain":"Cửa sổ pop-up dọa virus giả.","points":0.5},{"type":"short","level":"VD","q":"Khi tài khoản bị đăng nhập lạ, việc cần làm ngay là gì?","answer":"đổi mật khẩu","explain":"Đổi mật khẩu ngay để bảo vệ tài khoản.","points":0.5}]}]}
