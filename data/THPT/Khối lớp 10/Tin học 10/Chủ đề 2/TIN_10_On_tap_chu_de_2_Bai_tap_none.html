in":"100 ÷ 4 = 25 Mbps.","points":0.25},{"type":"mcq","level":"VDC","q":"Một tổ chức bị rò rỉ dữ liệu do nhân viên bấm link lạ. Biện pháp căn cơ là","options":["A. Cấm dùng email","B. Đào tạo nhận thức an toàn mạng kết hợp biện pháp kĩ thuật","C. Sa thải nhân viên","D. Tắt Internet"],"answer":"B","explain":"Con người là mắt xích quan trọng; cần đào tạo + kĩ thuật.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về Internet:","statements":["a) Internet kết nối toàn cầu","b) Cần ISP để truy cập Internet","c) Có nhiều dịch vụ: web, email, mạng xã hội","d) Internet chỉ dành cho người lớn"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về chia sẻ trên mạng:","statements":["a) Nên cài đặt quyền chia sẻ phù hợp","b) Không chia sẻ thông tin nhạy cảm","c) Tôn trọng bản quyền","d) Có thể chia sẻ mọi thứ"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"short","level":"TH","q":"Đơn vị đo lượng dữ liệu truyền được mỗi giây trên đường truyền mạng là gì?","answer":"băng thông","explain":"Băng thông thường đo bằng Mbps.","points":0.5},{"type":"short","level":"VD","q":"Tập hợp quy tắc giúp thiết bị các hãng khác nhau giao tiếp được gọi là gì?","answer":"giao thức","explain":"Giao thức (protocol).","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Nhà cung cấp dịch vụ Internet viết tắt là","options":["A. ISP","B. USB","C. CPU","D. GPS"],"answer":"A","explain":"ISP (Internet Service Provider).","points":0.25},{"type":"mcq","level":"NB","q":"Mã OTP là","options":["A. Mật khẩu dùng một lần gửi về điện thoại","B. Tên một trò chơi","C. Loại virus","D. Tên wifi"],"answer":"A","explain":"OTP (One-Time Password) dùng một lần.","points":0.25},{"type":"mcq","level":"TH","q":"Một bạn thấy quảng cáo “việc nhẹ lương cao, chỉ cần chuyển khoản đặt cọc”. Đây là","options":["A. Cơ hội tốt","B. Dấu hiệu lừa đảo","C. Việc làm thật","D. Khuyến mãi"],"answer":"B","explain":"Yêu cầu đặt cọc trước là chiêu lừa phổ biến.","points":0.25},{"type":"mcq","level":"TH","q":"Để họp nhóm trực tuyến hiệu quả, cần","options":["A. Mạng ổn định, tắt micro khi không nói","B. Vừa họp vừa chơi game","C. Không cần chuẩn bị","D. Bật micro suốt"],"answer":"A","explain":"Chuẩn bị kĩ giúp họp suôn sẻ.","points":0.25},{"type":"mcq","level":"VD","q":"Một đường truyền 50 Mbps cần tải file 200 MB. Thời gian ít nhất là","options":["A. 4 giây","B. 32 giây","C. 200 giây","D. 50 giây"],"answer":"B","explain":"200 MB = 1600 Mb. 1600 ÷ 50 = 32 giây.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trường xây dựng hệ thống học trực tuyến cho 1000 học sinh. Yếu tố quan trọng nhất là","options":["A. Giao diện đẹp","B. Hạ tầng máy chủ, băng thông đáp ứng đồng thời và bảo mật","C. Nhiều màu sắc","D. Quảng cáo"],"answer":"B","explain":"Hệ thống lớn cần hạ tầng mạnh và an toàn.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về công dân số:","statements":["a) Sử dụng công nghệ an toàn","b) Ứng xử văn minh trên mạng","c) Tôn trọng bản quyền","d) Có thể ẩn danh làm mọi việc"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: vẫn chịu trách nhiệm.","points":1},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về bảo vệ tài khoản:","statements":["a) Mật khẩu mạnh khó bị đoán","b) Nên bật xác thực hai yếu tố","c) Không lưu mật khẩu trên máy lạ","d) Dùng chung mật khẩu cho tiện"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"short","level":"NB","q":"Hệ thống mạng toàn cầu kết nối hàng tỉ thiết bị gọi là gì?","answer":"Internet","explain":"Internet là mạng máy tính toàn cầu.","points":0.5},{"type":"short","level":"VDC","q":"Toán tử tìm kiếm giúp loại bỏ từ không mong muốn là kí hiệu nào?","answer":"-","explain":"Dấu trừ.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Trình duyệt web dùng để","options":["A. Xem các trang web","B. Soạn văn bản","C. Vẽ tranh","D. Nghe nhạc offline"],"answer":"A","explain":"Trình duyệt hiển thị trang web.","points":0.25},{"type":"mcq","level":"NB","q":"Khi phát hiện bạn bị lộ thông tin cá nhân, nên khuyên bạn","options":["A. Mặc kệ","B. Đổi mật khẩu, cảnh giác và báo người lớn","C. Xóa hết tài khoản","D. Đăng thêm thông tin"],"answer":"B","explain":"Xử lí kịp thời giảm thiệt hại.","points":0.25},{"type":"mcq","level":"TH","q":"Một học sinh muốn tìm hiểu về robot. Kênh nào phù hợp nhất?","options":["A. Video hướng dẫn từ kênh giáo dục uy tín","B. Tin nhắn rác","C. Quảng cáo","D. Bình luận ẩn danh"],"answer":"A","explain":"Kênh giáo dục uy tín cho kiến thức đúng.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của cáp quang là","options":["A. Tốc độ cao, ít nhiễu","B. Rẻ nhất","C. Không cần bảo trì","D. Dùng cho điện thoại"],"answer":"A","explain":"Cáp quang truyền bằng ánh sáng, nhanh và ổn định.","points":0.25},{"type":"mcq","level":"TH","q":"Một email quan trọng gửi nhầm người. Cần","options":["A. Thu hồi nếu được, xin lỗi và thông báo","B. Mặc kệ","C. Xóa email mình","D. Đổ lỗi"],"answer":"A","explain":"Xử lí nhanh giảm hậu quả.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nhóm làm phim ngắn cần nhạc nền hợp pháp. Lựa chọn đúng là","options":["A. Nhạc nổi tiếng bất kì","B. Nhạc miễn phí bản quyền hoặc tự sáng tác","C. Nhạc lậu","D. Không cần nhạc"],"answer":"B","explain":"Tôn trọng bản quyền âm nhạc.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét các phát biểu về khai thác Internet:","statements":["a) Có thể học trực tuyến","b) Có thể tra cứu tài liệu","c) Có thể làm việc cộng tác","d) Internet không giúp học tập"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về đạo đức số:","statements":["a) Ghi nguồn khi dùng tài liệu người khác","b) Tôn trọng bản quyền","c) Không đạo văn","d) Sao chép tự do không cần ghi nguồn"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"short","level":"TH","q":"Từ nhập vào công cụ tìm kiếm để tìm thông tin gọi là gì?","answer":"từ khóa","explain":"Từ khóa.","points":0.5},{"type":"short","level":"VD","q":"Kho tài liệu điện tử truy cập qua mạng gọi là gì?","answer":"thư viện số","explain":"Thư viện số.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Đâu là mạng diện rộng?","options":["A. Wifi gia đình","B. Mạng kết nối các tỉnh","C. Bluetooth","D. Mạng phòng học"],"answer":"B","explain":"Mạng diện rộng (WAN) phủ phạm vi lớn.","points":0.25},{"type":"mcq","level":"TH","q":"Khi mạng chậm bất thường vào buổi tối, nguyên nhân thường là","options":["A. Máy hỏng","B. Nhiều người dùng chung","C. Hết pin","D. Trời tối"],"answer":"B","explain":"Giờ cao điểm nghẽn băng thông.","points":0.25},{"type":"mcq","level":"VD","q":"Một bạn gửi 5 ảnh, mỗi ảnh 4 MB qua email giới hạn đính kèm 25 MB. Kết luận đúng là","options":["A. Gửi được vì tổng 20 MB nhỏ hơn 25 MB","B. Không gửi được vì vượt giới hạn","C. Phải chia làm 2 lần gửi","D. Email không gửi được ảnh"],"answer":"A","explain":"5 × 4 = 20 MB nhỏ hơn giới hạn 25 MB nên gửi được một lần.","points":0.25},{"type":"mcq","level":"VD","q":"Một video 3 phút, mỗi giây 2 MB. Dung lượng video là","options":["A. 6 MB","B. 360 MB","C. 60 MB","D. 5 MB"],"answer":"B","explain":"180 × 2 = 360 MB.","points":0.25},{"type":"mcq","level":"VDC","q":"Một thư viện số phục vụ 500 người cùng lúc. Để đảm bảo, cần","options":["A. Máy chủ đủ mạnh và băng thông lớn","B. Một máy tính thường","C. Không cần gì","D. Tắt bớt người dùng"],"answer":"A","explain":"Phục vụ đồng thời cần hạ tầng tương xứng.","points":0.25},{"type":"mcq","level":"VDC","q":"Phát hiện trang web giả mạo trường để thu thập thông tin học sinh. Cần","options":["A. Mặc kệ","B. Báo nhà trường và cơ quan chức năng, cảnh báo mọi người","C. Nhập thông tin thử","D. Chia sẻ cho bạn bè"],"answer":"B","explain":"Báo cáo kịp thời ngăn thiệt hại lan rộng.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về đường truyền:","statements":["a) Cáp quang nhanh và ít nhiễu","b) Wifi tiện lợi nhưng có thể kém ổn định","c) Tốc độ thực tế có thể thấp hơn gói cước","d) Mọi đường truyền đều như nhau"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về email an toàn:","statements":["a) Kiểm tra người nhận trước khi gửi","b) Cảnh giác với file đính kèm lạ","c) Không bấm link trong email đáng ngờ","d) Email nào cũng an toàn"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"short","level":"NB","q":"Phần mềm hiển thị các trang web gọi là gì?","answer":"trình duyệt","explain":"Trình duyệt web.","points":0.5},{"type":"short","level":"VD","q":"Địa chỉ của một trang web trên Internet gọi là gì?","answer":"URL","explain":"URL.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Hành vi nào thể hiện công dân số có trách nhiệm?","options":["A. Chia sẻ tin chưa kiểm chứng","B. Kiểm chứng thông tin trước khi chia sẻ","C. Xúc phạm người khác","D. Tung tin giả"],"answer":"B","explain":"Công dân số có trách nhiệm với thông tin mình chia sẻ.","points":0.25},{"type":"mcq","level":"TH","q":"Một bạn bị mất điện thoại. Dữ liệu vẫn an toàn nếu","options":["A. Đã sao lưu đám mây và đặt mật khẩu máy","B. Không làm gì","C. Máy hết pin","D. Tắt nguồn"],"answer":"A","explain":"Sao lưu + mật khẩu bảo vệ dữ liệu.","points":0.25},{"type":"mcq","level":"VDC","q":"Một lớp 40 học sinh cần nộp video bài tập, mỗi video 100 MB. Giáo viên nên","options":["A. Nhận qua tin nhắn","B. Tạo thư mục đám mây chung để nộp","C. Thu USB","D. Không thu"],"answer":"B","explain":"Thư mục chung tiện quản lí.","points":0.25},{"type":"mcq","level":"VD","q":"Một file 50 MB nén còn 10 MB. Tỉ lệ nén là","options":["A. 5:1","B. 1:5","C.
