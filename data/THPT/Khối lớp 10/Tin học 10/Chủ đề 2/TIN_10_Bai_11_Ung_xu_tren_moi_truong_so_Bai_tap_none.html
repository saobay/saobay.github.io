":"Môi trường số cũng cần đạo đức và pháp luật.","points":0.25},{"type":"mcq","level":"TH","q":"Một bạn nhận được tin nhắn đe dọa trên mạng. Nên","options":["A. Đáp trả","B. Lưu bằng chứng, chặn và báo người lớn","C. Hẹn gặp","D. Im lặng chịu đựng"],"answer":"B","explain":"Xử lí an toàn khi bị đe dọa.","points":0.25},{"type":"mcq","level":"VD","q":"Một học sinh dùng ảnh của ca sĩ làm poster câu lạc bộ không xin phép. Nên","options":["A. Tiếp tục","B. Xin phép hoặc thay bằng ảnh miễn phí bản quyền","C. Giấu nguồn","D. Nhận là của mình"],"answer":"B","explain":"Tôn trọng bản quyền hình ảnh.","points":0.25},{"type":"mcq","level":"VD","q":"Một bạn đăng video bạn học bị ngã để câu like. Đây là","options":["A. Vui vẻ","B. Xâm phạm quyền riêng tư, thiếu văn hoá","C. Sáng tạo","D. Không sao"],"answer":"B","explain":"Đăng video nhạy cảm của người khác là sai.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nền tảng mạng xã hội cần chính sách bản quyền. Nội dung quan trọng nhất là","options":["A. Màu sắc giao diện","B. Cơ chế khiếu nại, gỡ nội dung vi phạm và bảo vệ tác giả","C. Quảng cáo","D. Số lượng người dùng"],"answer":"B","explain":"Chính sách bản quyền bảo vệ cả tác giả và nền tảng.","points":0.25},{"type":"mcq","level":"VDC","q":"Để xây dựng văn hoá số lành mạnh trong trường học, cần","options":["A. Cấm dùng mạng","B. Giáo dục kĩ năng số, quy tắc ứng xử và xử lí vi phạm công bằng","C. Mặc kệ học sinh","D. Chỉ phạt nặng"],"answer":"B","explain":"Giáo dục kết hợp quản lí xây dựng văn hoá số.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về quyền riêng tư số:","statements":["a) Không đăng thông tin nhạy cảm của người khác","b) Xin phép trước khi đăng ảnh người khác","c) Tôn trọng không gian riêng tư","d) Có thể đăng mọi thứ về người khác"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về trách nhiệm khi chia sẻ:","statements":["a) Chịu trách nhiệm về nội dung mình đăng","b) Không đổ lỗi cho người khác","c) Sửa sai khi đăng nhầm","d) Xóa dấu vết khi sai"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cần nhận lỗi và sửa.","points":1},{"type":"short","level":"TH","q":"Người dùng công nghệ an toàn, văn minh, có trách nhiệm gọi là gì?","answer":"công dân số","explain":"Công dân số.","points":0.5},{"type":"short","level":"VD","q":"Hành vi sao chép bài làm của người khác không ghi nguồn trong học tập gọi là gì?","answer":"đạo văn","explain":"Đạo văn.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Khi dùng mạng xã hội, điều đầu tiên cần nhớ là","options":["A. Tuân thủ quy tắc ứng xử văn minh","B. Đăng mọi thứ","C. Ẩn danh phá hoại","D. Không cần trách nhiệm"],"answer":"A","explain":"Ứng xử văn minh là yêu cầu cơ bản.","points":0.25},{"type":"mcq","level":"VDC","q":"Một bạn thấy ảnh đẹp trên mạng muốn dùng làm hình nền điện thoại cá nhân. Đánh giá đúng là","options":["A. Vi phạm nghiêm trọng","B. Dùng cá nhân không công khai thường được chấp nhận","C. Phải mua bản quyền","D. Không được dùng"],"answer":"B","explain":"Dùng cá nhân, không phân phối thường không vi phạm.","points":0.25},{"type":"mcq","level":"VD","q":"Một học sinh làm bài thuyết trình trích 2 câu thơ có ghi tên tác giả. Đánh giá là","options":["A. Vi phạm bản quyền","B. Trích dẫn hợp lí, đúng quy cách","C. Đạo văn","D. Không được trích"],"answer":"B","explain":"Trích dẫn ngắn có ghi nguồn là hợp lí.","points":0.25},{"type":"mcq","level":"VD","q":"Một bạn bình luận khiếm nhã dưới bài viết của người khác. Lời khuyên đúng là","options":["A. Tiếp tục","B. Xóa bình luận, xin lỗi và rút kinh nghiệm","C. Đổ lỗi cho người khác","D. Tạo tài khoản mới"],"answer":"B","explain":"Nhận lỗi và sửa sai là ứng xử văn minh.","points":0.25},{"type":"mcq","level":"VDC","q":"Một tác giả phát hiện tác phẩm của mình bị dùng trái phép trên nhiều trang. Cách xử lí hiệu quả là","options":["A. Bỏ qua","B. Thu thập bằng chứng, gửi yêu cầu gỡ bỏ và nhờ pháp luật khi cần","C. Tấn công các trang đó","D. Đăng bài chửi bới"],"answer":"B","explain":"Xử lí theo trình tự pháp lí.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trường muốn giáo dục học sinh về bản quyền. Hoạt động hiệu quả nhất là","options":["A. Chỉ phạt","B. Tổ chức tìm hiểu, thảo luận tình huống thực tế và cam kết thực hiện","C. Cấm dùng mạng","D. Không cần làm gì"],"answer":"B","explain":"Giáo dục qua tình huống thực tế hiệu quả nhất.","points":0.25},{"type":"truefalse","level":"VD","q":"Xét các phát biểu về ứng xử khi mắc lỗi trên mạng:","statements":["a) Nên nhận lỗi","b) Nên xóa hoặc sửa nội dung sai","c) Nên xin lỗi người bị ảnh hưởng","d) Nên đổ lỗi cho người khác"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Xét các phát biểu về sử dụng hình ảnh trên mạng:","statements":["a) Ảnh của người khác cần xin phép khi đăng","b) Nên dùng ảnh miễn phí bản quyền","c) Ghi nguồn khi được yêu cầu","d) Ảnh nào trên mạng cũng dùng tự do"],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"short","level":"TH","q":"Khi phát hiện nội dung vi phạm trên mạng xã hội, người dùng nên dùng chức năng nào?","answer":"báo cáo","explain":"Chức năng báo cáo (report).","points":0.5},{"type":"short","level":"VD","q":"Việc sử dụng tác phẩm trong phạm vi hợp lí cho học tập, nghiên cứu mà không cần xin phép gọi là gì?","answer":"sử dụng hợp lí","explain":"Sử dụng hợp lí (fair use).","points":0.5}]}]}
