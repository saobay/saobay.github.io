{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Phím tắt của công cụ vẽ hình chữ nhật trong Inkscape là","options":["A. F1","B. F4","C. F8","D. F2"],"answer":"B","explain":"F4 là phím tắt công cụ vẽ hình chữ nhật và hình vuông; F1 là chọn, F8 là văn bản, F2 là chỉnh nút.","points":0.25},{"type":"mcq","level":"NB","q":"Để chọn một đối tượng trên vùng vẽ, ta dùng công cụ","options":["A. Select (phím tắt F1)","B. Vẽ hình chữ nhật","C. Văn bản","D. Tô màu"],"answer":"A","explain":"Công cụ Select (F1) dùng để chọn, di chuyển, thay đổi kích thước đối tượng.","points":0.25},{"type":"mcq","level":"TH","q":"Khi đang vẽ hình chữ nhật, giữ phím Ctrl sẽ","options":["A. Vẽ được hình vuông (các cạnh bằng nhau)","B. Xóa hình vừa vẽ","C. Đổi màu hình","D. Vẽ từ tâm hình"],"answer":"A","explain":"Giữ Ctrl khi vẽ giúp tạo hình đều: hình chữ nhật thành hình vuông, ellipse thành hình tròn.","points":0.25},{"type":"mcq","level":"TH","q":"Màu tô bên trong một đối tượng trong Inkscape được gọi là","options":["A. Fill","B. Stroke","C. Canvas","D. Palette"],"answer":"A","explain":"Fill là màu tô nền bên trong đối tượng; Stroke là màu viền bao quanh đối tượng.","points":0.25},{"type":"mcq","level":"VD","q":"Muốn vẽ một hình tròn đều (không méo), thao tác đúng là","options":["A. Chọn công cụ ellipse (F5), giữ Ctrl rồi kéo chuột","B. Chọn công cụ ellipse rồi kéo chuột tự do","C. Vẽ hình chữ nhật rồi xóa góc","D. Dùng công cụ văn bản"],"answer":"A","explain":"Công cụ ellipse vẽ hình elip; giữ Ctrl ép thành hình tròn đều.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn vẽ ngôi nhà gồm mái, tường, cửa sổ (nhiều hình rời). Muốn di chuyển cả ngôi nhà đi chỗ khác mà không lệch vị trí các phần, cách tốt nhất là","options":["A. Nhóm các hình thành một nhóm (Ctrl+G) rồi di chuyển cả nhóm","B. Di chuyển từng hình một","C. Xóa đi vẽ lại ở vị trí mới","D. Chụp màn hình rồi dán lại"],"answer":"A","explain":"Nhóm (Group) biến nhiều đối tượng thành một khối thống nhất để di chuyển, :"Trong Inkscape, đối tượng nào vẽ sau sẽ","options":["A. Nằm trên (che) đối tượng vẽ trước","B. Nằm dưới đối tượng vẽ trước","C. Tự động bị xóa","D. Biến mất"],"answer":"A","explain":"Thứ tự vẽ quyết định thứ tự chồng lấp: đối tượng vẽ sau nằm trên đối tượng vẽ trước.","points":0.25},{"type":"mcq","level":"TH","q":"Để đưa một đối tượng lên trên cùng (nằm trên mọi đối tượng khác), ta dùng","options":["A. Phím Home","B. Phím End","C. Phím Delete","D. Phím Insert"],"answer":"A","explain":"Home đưa đối tượng lên trên cùng; End đưa xuống dưới cùng; PageUp/PageDown nâng hạ một bậc.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ mặt trời (hình tròn vàng) rồi vẽ đám mây đè lên nhưng mặt trời lại che mất mây. Cách khắc phục là","options":["A. Chọn mặt trời rồi nhấn End (hoặc Lower) để đưa xuống dưới","B. Xóa đám mây vẽ lại","C. Đổi màu mặt trời","D. Tắt máy vẽ lại"],"answer":"A","explain":"Đưa mặt trời xuống dưới (End/Lower) thì đám mây sẽ nằm trên, đúng ý đồ.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn cần tạo 5 ngôi sao giống hệt nhau xếp thành hàng ngang đều nhau. Cách hiệu quả nhất là","options":["A. Vẽ một ngôi sao, nhân bản (Ctrl+D) 4 lần rồi dùng Align căn hàng và phân bố đều","B. Vẽ thủ công 5 ngôi sao","C. Vẽ một ngôi sao rồi chụp màn hình 4 lần","D. In ra rồi photocopy"],"answer":"A","explain":"Nhân bản giữ nguyên hình dạng, công cụ Align and Distribute giúp xếp hàng và giãn cách đều nhau nhanh chóng.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về tô màu và viền.","statements":["Fill là màu tô bên trong đối tượng.","Stroke là màu đường viền của đối tượng.","Có thể chỉnh độ dày của nét viền (stroke width).","Nét viền chỉ có một kiểu duy nhất là đường liền."],"answer":["T","T","T","F"],"explain":"Nét viền có nhiều kiểu: liền, đứt nét, chấm... và chỉnh được độ dày trong Fill and Stroke.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về nhóm đối tượng.","statements":["Ctrl+G nhóm các +V dán; hoặc Ctrl+D nhân bản nhanh tại chỗ.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ ba hình tròn lệch nhau, muốn chúng thẳng hàng ngang và cách đều nhau. Công cụ phù hợp là","options":["A. Align and Distribute (Ctrl+Shift+A)","B. Công cụ văn bản","C. Công cụ tô màu","D. Xóa vẽ lại"],"answer":"A","explain":"Align and Distribute căn thẳng hàng và phân bố khoảng cách đều nhau tự động, chính xác.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn vẽ logo gồm chữ và hình, sau đó muốn phóng to cả logo gấp đôi mà tỉ lệ các phần không đổi. Cách đúng là","options":["A. Chọn tất cả (Ctrl+A), nhóm lại (Ctrl+G) rồi kéo góc giữ Ctrl để co giãn đồng đều","B. Phóng to từng phần riêng","C. Vẽ lại logo to hơn","D. Xuất PNG rồi phóng ảnh"],"answer":"A","explain":"Nhóm rồi co giãn cả nhóm giữ đúng tỉ lệ tương đối giữa các thành phần của logo.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về thứ tự đối tượng.","statements":["Đối tượng vẽ sau nằm trên đối tượng vẽ trước.","PageUp nâng đối tượng lên một bậc.","PageDown hạ đối tượng xuống một bậc.","Không thể thay đổi thứ tự chồng lấp của các đối tượng."],"answer":["T","T","T","F"],"explain":"Thứ tự chồng lấp thay đổi được bằng PageUp/PageDown (một bậc) hoặc Home/End (lên trên cùng/xuống dưới cùng).","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về nhân bản và sao chép.","statements":["Ctrl+D tạo bản sao chồng khít lên đối tượng gốc.","Ctrl+C rồi Ctrl+V dán bản sao vào vị trí con trỏ.","Nhân bản giữ nguyên mọi thuộc tính (màu, kích thước) của bản gốc.","Bản sao sau khi nhân bản không thể chỉnh sửa độc lập."],"answer":["T","T","T","F"],"explain":"Bản sao là đối tượng độc lập, chỉnh sửa thoải mái mà không ảnh hưởng bản gốc.","points":1},{"type":"short","level":"NB","q":"Phím tắt của công cụ chọn (Select) trong Inkscape là (chỉ ghi phím)","answer":"F1","explain":"F1 chọn công cụ Select để chọn, di chuyển, co giãn đối tượng.","points":0.5},{"type":"short","level":"VDC","q":"Để đưa đối tượng đang chọn xuống dưới cùng (dưới mọi đối tượng khác), nhấn phím nào? (chỉ ghi tên phím)","answer":"End","explain":"End đưa xuống dưới cùng; Home đưa lên trên cùng.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Công cụ vẽ ngôi sao và đa giác trong Inkscape có phím tắt là","options":["A. Phím *","B. Phím #","C. Phím @","D. Phím $"],"answer":"A","explain":"Phím * (dấu sao) mở công cụ vẽ ngôi sao và đa giác; có thể chỉnh số cánh, số đỉnh.","points":0.25},{"type":"mcq","level":"NB","q":"Để xóa một đối tượng đang chọn trong Inkscape, ta nhấn phím","options":["A. Delete","B. Insert","C. Home","D. Tab"],"answer":"A","explain":"Phím Delete (hoặc Backspace) xóa đối tượng đang được chọn.","points":0.25},{"type":"mcq","level":"TH","q":"Khi bấm chuột vào một đối tượng đang chọn lần thứ hai (vẫn dùng công cụ Select), tay cầm quanh đối tượng sẽ chuyển sang chế độ","options":["A. Xoay và nghiêng đối tượng","B. Xóa đối tượng","C. Đổi màu đối tượng","D. Nhân bản đối tượng"],"answer":"A","explain":"Bấm lần hai vào đối tượng đang chọn hiện tay cầm xoay/nghiêng; bấm lần nữa trở về chế độ co giãn.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn di chuyển đối tượng từng chút một thật chính xác, ta có thể","options":["A. Dùng các phím mũi tên trên bàn phím","B. Chỉ kéo bằng chuột","C. Khởi động lại máy","D. Đổi màu đối tượng"],"answer":"A","explain":"Phím mũi tên di chuyển đối tượng từng bước nhỏ chính xác; giữ Shift+mũi tên di chuyển bước lớn.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ hình chữ nhật nhưng muốn bo tròn các góc. Cách làm là","options":["A. Kéo nút tròn ở góc hình (hoặc chỉnh Rx, Ry trên thanh thuộc tính)","B. Xóa vẽ lại hình tròn","C. Đổi màu viền","D. Không thể bo góc trong Inkscape"],"answer":"A","explain":"Hình chữ nhật trong Inkscape có nút điều khiển bo góc; kéo nút hoặc nhập Rx/Ry để bo tròn.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn cần vẽ đường ray xe lửa gồm nhiều thanh tà vẹt giống nhau, đều nhau. Quy trình nhanh nhất là","options":["A. Vẽ một thanh, nhân bản nhiều lần rồi dùng Align phân bố đều theo chiều dọc","B. Vẽ từng thanh một bằng tay","C. Vẽ một thanh thật dài","D. Dùng công cụ văn bản"],"answer":"A","explain":"Nhân bản + Align phân bố đều là cách chuyên nghiệp để tạo dãy đối tượng lặp lại đều nhau.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về vẽ hình đều và từ tâm.","statements":["Giữ Ctrl khi vẽ hình chữ nhật được hình vuông.","Giữ Ctrl khi vẽ ellipse được hình tròn.","Giữ Shift khi vẽ giúp vẽ từ tâm ra ngoài.","Có thể kết hợp Ctrl+Shift để vừa vẽ hình đều vừa vẽ từ tâm."],"answer":["T","T","T","T"],"explain":"Ctrl khóa tỉ lệ thành hình đều, Shift vẽ từ tâm; kết hợp cả hai được hình đều vẽ từ tâm.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về chỉnh sửa đối tượng.","statements":["Kéo tay cầm ở góc giúp thay đổi kích thước đối tượng.","Kéo tay cầm ở cạnh giữa giúp kéo giãn theo một chiều.","Giữ Ctrl khi kéo tay cầm giữ đúng tỉ lệ gốc.","Mọi thay đổi kích thước đối tượng vector đều làm vỡ hình."],"answer":["T","T","T","F"],"explain":"Co giãn vector không vỡ hình; giữ Ctrl khi kéo giữ tỉ lệ để hình không méo.","points":1},{"type":"short","level":"NB","q":"Phím tắt mở công cụ vẽ ellipse trong Inkscape là (chỉ ghi phím)","answer":"F5","explain":"F5 là công cụ ellipse; giữ Ctrl khi kéo để được hình tròn đều.","points":0.5},{"type":"short","level":"VDC","q":"Để nâng đối tượng đang chọn lên một bậc trong thứ tự chồng lấp, nhấn phím nào? (chỉ ghi tên phím)","answer":"PageUp","explain":"PageUp nâng một bậc, PageDown hạ một bậc trong thứ tự chồng lấp.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Trong Inkscape, để chọn nhiều đối tượng cùng lúc bằng chuột, ta","options":["A. Kéo một khung bao quanh các đối tượng","B. Bấm đúp vào màn hình","C. Nhấn phím Delete","D. Tắt phần mềm"],"answer":"A","explain":"Kéo khung chọn (rubber band) bao quanh các đối tượng để chọn đồng thời nhiều đối tượng.","points":0.25},{"type":"mcq","level":"NB","q":"Thanh thuộc tính của công cụ (tool controls bar) trong Inkscape nằm ở","options":["A. Phía trên vùng vẽ, dưới thanh menu","B. Bên trái màn hình","C. Phía dưới cùng","D. Trong thùng rác"],"answer":"A","explain":"Thanh thuộc tính nằm ngang phía trên vùng vẽ, hiển thị các tùy chọn của công cụ đang dùng.","points":0.25},{"type":"mcq","level":"TH","q":"Khi vẽ ngôi sao bằng công cụ Star, ta có thể tùy chỉnh","options":["A. Số cánh (đỉnh) của ngôi sao","B. Mùi hương của ngôi sao","C. Âm thanh của ngôi sao","D. Không tùy chỉnh được gì"],"answer":"A","explain":"Thanh thuộc tính của công cụ Star cho phép chỉnh số đỉnh/cánh, tỉ lệ, độ bo của ngôi sao.","points":0.25},{"type":"mcq","level":"TH","q":"Một đối tượng sau khi nhóm (Group) thì","options":["A. Các thành phần di chuyển, co giãn đồng loạt như một khối","B. Không thể chọn được nữa","C. Tự động đổi màu","D. Bị khóa vĩnh viễn"],"answer":"A","explain":"Nhóm biến nhiều đối tượng thành một khối thống nhất để thao tác đồng loạt; vẫn tách nhóm được.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ nút áo (hình tròn nhỏ) muốn đặt chính giữa thân áo (hình chữ nhật). Cách căn chính xác nhất là","options":["A. Chọn cả hai rồi dùng Align căn giữa theo chiều ngang và dọc","B. Kéo bằng mắt cho vừa","C. Đo bằng thước kẻ trên màn hình","D. Vẽ lại từ đầu"],"answer":"A","explain":"Align căn giữa ngang và dọc cho vị trí chính xác tuyệt đối, nhanh hơn căn bằng mắt.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn thiết kế thiệp có khung viền trang trí lặp lại quanh mép thiệp. Để khung đều và đẹp, bạn nên","options":["A. Vẽ một họa tiết góc, nhân bản và dùng Align phân bố đều quanh khung","B. Vẽ từng họa tiết bằng tay","C. Bỏ khung viền","D. Dùng bút vẽ tự do"],"answer":"A","explain":"Nhân bản họa tiết mẫu rồi phân bố đều cho khung viền đồng đều, chuyên nghiệp và nhanh.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về công cụ vẽ.","statements":["Công cụ hình chữ nhật vẽ được cả hình vuông (giữ Ctrl).","Công cụ ellipse vẽ được cả hình tròn (giữ Ctrl).","Công cụ Star vẽ được cả đa giác đều.","Inkscape có công cụ vẽ đường xoắn ốc (spiral)."],"answer":["T","T","T","T"],"explain":"Inkscape có đầy đủ công cụ vẽ hình cơ bản: chữ nhật, ellipse, sao/đa giác, xoắn ốc.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về thao tác với nhóm.","statements":["Nhóm nhiều đối tượng giúp quản lí bản vẽ phức tạp dễ hơn.","Có thể nhóm các nhóm nhỏ thành nhóm lớn hơn.","Tách nhóm (Ctrl+Shift+G) trả lại các đối tượng độc lập.","Sau khi tách nhóm, màu sắc các đối tượng bị mất."],"answer":["T","T","T","F"],"explain":"Nhóm có thể lồng nhau nhiều cấp; tách nhóm không làm mất thuộc tính của đối tượng.","points":1},{"type":"short","level":"NB","q":"Để chọn tất cả đối tượng trên vùng vẽ, tổ hợp phím tắt là","answer":"Ctrl+A","explain":"Ctrl+A chọn tất cả; sau đó có thể nhóm, di chuyển hoặc xóa đồng loạt.","points":0.5},{"type":"short","level":"VDC","q":"Phím tắt để hạ đối tượng đang chọn xuống một bậc trong thứ tự chồng lấp là (chỉ ghi tên phím)","answer":"PageDown","explain":"PageDown hạ một bậc; End đưa xuống dưới cùng.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Công cụ lấy màu từ một đối tượng có sẵn (dropper) trong Inkscape có phím tắt là","options":["A. F7","B. F1","C. F4","D. F9"],"answer":"A","explain":"F7 là công cụ Dropper: bấm vào đối tượng bất kì để lấy màu của nó tô cho đối tượng đang chọn.","points":0.25},{"type":"mcq","level":"NB","q":"Khi đối tượng đang được chọn, xung quanh nó xuất hiện","options":["A. Các tay cầm (handles) để co giãn, xoay","B. Một video quảng cáo","C. Bảng tính Excel","D. Không có gì"],"answer":"A","explain":"Tay cầm (handles) quanh đối tượng cho phép kéo để thay đổi kích thước, xoay, nghiêng.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn tô cho nhiều đối tượng khác nhau cùng một màu nhanh nhất, ta","options":["A. Chọn tất cả rồi bấm màu trên thanh palette một lần","B. Tô từng đối tượng một","C. Vẽ lại tất cả","D. Đổi màu màn hình"],"answer":"A","explain":"Chọn nhiều đối tượng rồi bấm màu một lần sẽ tô đồng loạt, tiết kiệm thời gian.","points":0.25},{"type":"mcq","level":"TH","q":"Độ dày nét viền của đối tượng được chỉnh ở","options":["A. Hộp thoại Fill and Stroke (mục Stroke width)","B. Thanh menu File","C. Thùng rác","D. Không chỉnh được"],"answer":"A","explain":"Trong Fill and Stroke, mục Stroke width (độ rộng nét) chỉnh độ dày viền.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ biểu đồ cột gồm 5 cột, muốn các cột có cùng chiều rộng và cách đều nhau. Cách làm là","options":["A. Vẽ một cột chuẩn, nhân bản 4 cột rồi dùng Align phân bố đều","B. Vẽ 5 cột ước chừng bằng mắt","C. Vẽ một cột rồi kéo giãn tùy ý","D. Dùng công cụ văn bản"],"answer":"A","explain":"Nhân bản giữ kích thước chuẩn, Align phân bố đều khoảng cách: biểu đồ đều và chuyên nghiệp.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn vẽ hình người gồm đầu, thân, tay, chân. Sau này muốn đổi màu áo (thân) mà không ảnh hưởng các phần khác, bạn nên làm gì NGAY TỪ ĐẦU?","options":["A. Vẽ thân áo thành đối tượng riêng (không gộp dính với các phần khác)","B. Vẽ tất cả dính liền nhau","C. Vẽ xong thì xóa","D. Không cần chuẩn bị gì"],"answer":"A","explain":"Tư duy thiết kế theo đối tượng: mỗi bộ phận là đối tượng riêng thì sau này sửa màu, sửa hình từng phần dễ dàng.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về tay cầm và biến đổi.","statements":["Kéo tay cầm ở góc thay đổi cả chiều rộng và chiều cao.","Giữ Shift khi kéo tay cầm góc giúp co giãn đều từ tâm.","Bấm lần hai vào đối tượng đang chọn hiện tay cầm xoay.","Xoay đối tượng vector làm vỡ hình."],"answer":["T","T","T","F"],"explain":"Xoay, co giãn vector không vỡ hình; Shift+góc co giãn đều từ tâm.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về quy trình vẽ hiệu quả.","statements":["Nên vẽ các đối tượng đơn giản trước rồi mới trang trí chi tiết.","Nhân bản giúp tạo nhanh nhiều đối tượng giống nhau.","Align giúp căn chỉnh chính xác hơn căn bằng mắt.","Càng nhiều đối tượng rời rạc không nhóm thì càng dễ quản lí."],"answer":["T","T","T","F"],"explain":"Bản vẽ phức tạp nên nhóm và đặt tên đối tượng để dễ quản lí, không nên để rời rạc.","points":1},{"type":"short","level":"NB","q":"Màu tô bên trong đối tượng trong Inkscape được gọi là (viết thường, tiếng Anh)","answer":"fill","explain":"Fill là màu tô nền; Stroke là màu viền.","points":0.5},{"type":"short","level":"VDC","q":"Phím tắt đưa đối tượng đang chọn lên trên cùng (trên mọi đối tượng khác) là (chỉ ghi tên phím)","answer":"Home","explain":"Home lên trên cùng; End xuống dưới cùng.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Trong Inkscape, nút tròn nhỏ ở góc hình chữ nhật dùng để","options":["A. Bo tròn góc của hình chữ nhật","B. Xóa hình","C. Đổi màu hình","D. Xoay hình 360 độ"],"answer":"A","explain":"Kéo nút tròn ở góc để bo tròn góc hình chữ nhật; cũng có thể nhập giá trị Rx, Ry.","points":0.25},{"type":"mcq","level":"NB","q":"Để bỏ chọn tất cả đối tượng đang chọn, ta nhấn phím","options":["A. Esc","B. Enter","C. Space","D. Tab"],"answer":"A","explain":"Esc bỏ chọn; Enter thường để kết thúc nhập liệu hoặc xác nhận.","points":0.25},{"type":"mcq","level":"TH","q":"Khi đã chọn một đối tượng, bấm thêm đối tượng khác trong khi giữ Shift thì","options":["A. Đối tượng mới được thêm vào vùng chọn","B. Đối tượng cũ bị xóa","C. Phần mềm bị treo","D. Không có gì xảy ra"],"answer":"A","explain":"Shift+bấm thêm vào vùng chọn; bấm lại vào đối tượng đã chọn khi giữ Shift sẽ loại nó khỏi vùng chọn.","points":0.25},{"type":"mcq","level":"TH","q":"Kiểu nét viền đứt nét (dashed) thường dùng để vẽ","options":["A. Đường gấp khúc, đường ẩn, đường trang trí","B. Chỉ dùng cho văn bản","C. Không dùng được trong Inkscape","D. Chỉ dùng cho ảnh raster"],"answer":"A","explain":"Nét đứt thường biểu thị đường gấp, đường ẩn trong kĩ thuật hoặc tạo hiệu ứng trang trí.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ sơ đồ lớp học gồm các bàn giống nhau xếp thành 4 hàng. Cách nhanh và đều nhất là","options":["A. Vẽ một bàn mẫu, nhân bản rồi dùng Align xếp hàng, phân bố đều","B. Vẽ từng bàn bằng tay","C. Vẽ một bàn thật to","D. Chụp ảnh bàn thật"],"answer":"A","explain":"Mẫu + nhân bản + Align là bộ ba thao tác chuẩn cho các dãy đối tượng lặp lại.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn cần vẽ 20 bông hoa giống nhau nhưng mỗi bông một màu khác nhau. Quy trình tối ưu là","options":["A. Vẽ một bông mẫu, nhân bản 19 bông rồi đổi màu Fill từng bông","B. Vẽ 20 bông từ đầu","C. Vẽ một bông rồi tô 20 màu chồng lên","D. Tải ảnh hoa trên mạng"],"answer":"A","explain":"Nhân bản giữ nguyên hình dạng, chỉ đổi màu Fill từng bản sao: nhanh và đồng đều.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về màu sắc.","statements":["Một đối tượng có thể vừa có màu tô (Fill) vừa có màu viền (Stroke).","Có thể để đối tượng không tô màu (None) chỉ còn viền.","Có thể để đối tượng không viền chỉ còn màu tô.","Mỗi đối tượng chỉ được dùng đúng một màu duy nhất."],"answer":["T","T","T","F"],"explain":"Đối tượng có thể có cả Fill và Stroke, hoặc chỉ một trong hai, hoặc không màu (trong suốt).","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về sắp xếp đối tượng.","statements":["Nên vẽ đối tượng nền trước, đối tượng chi tiết sau.","Muốn chữ nằm trên hình thì chữ phải ở lớp trên.","Dùng Home/End thay đổi nhanh thứ tự trên cùng/dưới cùng.","Thứ tự vẽ ban đầu không bao giờ thay đổi được."],"answer":["T","T","T","F"],"explain":"Vẽ từ nền đến chi tiết là thói quen tốt; thứ tự luôn điều chỉnh được bằng Raise/Lower.","points":1},{"type":"short","level":"NB","q":"Màu viền của đối tượng trong Inkscape được gọi là (viết thường, tiếng Anh)","answer":"stroke","explain":"Stroke là màu và kiểu đường viền; Fill là màu tô bên trong.","points":0.5},{"type":"short","level":"VDC","q":"Hộp thoại căn chỉnh và phân bố đều đối tượng được mở bằng tổ hợp phím","answer":"Ctrl+Shift+A","explain":"Ctrl+Shift+A mở Align and Distribute: căn lề, căn giữa, phân bố khoảng cách đều.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Phím tắt nhân bản (Duplicate) đối tượng trong Inkscape là","options":["A. Ctrl+D","B. Ctrl+S","C. Ctrl+P","D. Ctrl+X"],"answer":"A","explain":"Ctrl+D nhân bản đối tượng chồng khít lên bản gốc; Ctrl+X là cắt.","points":0.25},{"type":"mcq","level":"NB","q":"Công cụ vẽ đường xoắn ốc (spiral) trong Inkscape có phím tắt là","options":["A. F9","B. F1","C. F5","D. F4"],"answer":"A","explain":"F9 là công cụ vẽ đường xoắn ốc; có thể chỉnh số vòng, độ mở trên thanh thuộc tính.","points":0.25},{"type":"mcq","level":"TH","q":"Khi kéo tay cầm ở giữa cạnh của đối tượng, đối tượng sẽ","options":["A. Bị kéo giãn theo một chiều (ngang hoặc dọc)","B. Bị xoay","C. Bị xóa","D. Bị nhân đôi"],"answer":"A","explain":"Tay cầm giữa cạnh kéo giãn một chiều; tay cầm góc thay đổi cả hai chiều.","points":0.25},{"type":"mcq","level":"TH","q":"Để di chuyển đối tượng đi một khoảng lớn nhanh chóng, ta có thể","options":["A. Giữ Shift rồi nhấn phím mũi tên","B. Nhấn phím mũi tên từng lần một","C. Khởi động lại máy","D. Đổi màu đối tượng"],"answer":"A","explain":"Shift + mũi tên di chuyển bước lớn; mũi tên thường di chuyển bước nhỏ chính xác.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ cờ Việt Nam: nền đỏ hình chữ nhật và ngôi sao vàng ở giữa. Để sao nằm chính giữa nền cờ, bạn","options":["A. Chọn cả hai rồi Align căn giữa ngang và dọc","B. Kéo sao bằng mắt","C. Vẽ lại nhiều lần","D. Đổi màu nền"],"answer":"A","explain":"Align căn giữa ngang + dọc cho vị trí chính xác tuyệt đối.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn thiết kế bộ icon gồm 10 biểu tượng cùng phong cách (cùng độ dày viền, cùng kiểu bo góc). Để đồng nhất nhanh nhất, bạn nên","options":["A. Thiết lập sẵn Fill/Stroke mẫu rồi vẽ các icon, hoặc sao chép thuộc tính từ icon mẫu","B. Vẽ mỗi icon một kiểu tùy hứng","C. Vẽ xong rồi sửa từng cái","D. Nhờ người khác vẽ hộ"],"answer":"A","explain":"Thống nhất thuộc tính từ đầu (hoặc sao chép style) giúp bộ icon đồng bộ, chuyên nghiệp.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về phím tắt.","statements":["F1 là công cụ chọn (Select).","F4 là công cụ vẽ hình chữ nhật.","F5 là công cụ vẽ ellipse.","F8 là công cụ chỉnh sửa nút."],"answer":["T","T","T","F"],"explain":"F8 là công cụ văn bản (Text); F2 mới là công cụ chỉnh sửa nút (Node).","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về thiết kế theo đối tượng.","statements":["Chia bản vẽ thành nhiều đối tượng nhỏ giúp sửa từng phần dễ dàng.","Đặt tên cho nhóm đối tượng giúp quản lí bản vẽ phức tạp.","Nên nhóm các bộ phận liên quan thành từng cụm.","Vẽ mọi thứ dính liền nhau là cách tốt nhất."],"answer":["T","T","T","F"],"explain":"Thiết kế theo đối tượng rời rạc, có nhóm và đặt tên là thói quen chuyên nghiệp.","points":1},{"type":"short","level":"NB","q":"Phím tắt để nhóm các đối tượng đang chọn trong Inkscape là","answer":"Ctrl+G","explain":"Ctrl+G nhóm; Ctrl+Shift+G tách nhóm.","points":0.5},{"type":"short","level":"VDC","q":"Công cụ lấy màu từ đối tượng có sẵn có phím tắt là (chỉ ghi phím)","answer":"F7","explain":"F7 (Dropper): bấm vào đối tượng bất kì để lấy màu của nó.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Trong Inkscape, để vẽ đa giác đều (ví dụ lục giác), ta dùng công cụ","options":["A. Star/Polygon (phím *) rồi chọn chế độ đa giác","B. Công cụ văn bản","C. Công cụ tô màu","D. Không vẽ được"],"answer":"A","explain":"Công cụ Star/Polygon vẽ được cả ngôi sao và đa giác đều; chỉnh số đỉnh trên thanh thuộc tính.","points":0.25},{"type":"mcq","level":"NB","q":"Khi muốn hoàn tác thao tác vừa thực hiện sai, ta nhấn","options":["A. Ctrl+Z","B. Ctrl+S","C. Ctrl+N","D. Ctrl+Q"],"answer":"A","explain":"Ctrl+Z hoàn tác; Ctrl+Shift+Z làm lại thao tác vừa hoàn tác.","points":0.25},{"type":"mcq","level":"TH","q":"Một nhóm (group) sau khi tạo thì","options":["A. Vẫn có thể tách ra (Ctrl+Shift+G) để sửa riêng từng đối tượng","B. Không bao giờ tách được","C. Tự động bị xóa sau khi lưu","D. Không di chuyển được"],"answer":"A","explain":"Nhóm chỉ là cách quản lí tạm thời; tách nhóm bất cứ lúc nào để sửa riêng.","points":0.25},{"type":"mcq","level":"TH","q":"Để thay đổi kích thước đối tượng mà không làm méo hình, khi kéo tay cầm ở góc ta nên","options":["A. Giữ phím Ctrl","B. Giữ phím Delete","C. Nhấn phím Esc","D. Tắt màn hình"],"answer":"A","explain":"Giữ Ctrl khi kéo tay cầm góc giữ đúng tỉ lệ gốc, hình không bị méo.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ thiệp sinh nhật có nhiều bóng bay giống nhau. Để các bóng bay có kích thước bằng nhau tuyệt đối, bạn nên","options":["A. Vẽ một quả bóng mẫu rồi nhân bản (Ctrl+D)","B. Vẽ từng quả bằng tay","C. Vẽ một quả rồi kéo giãn tùy ý","D. Đo bằng thước"],"answer":"A","explain":"Nhân bản cho các bản sao kích thước bằng nhau tuyệt đối, nhanh hơn vẽ tay.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn làm poster có tiêu đề, hình minh họa và khung viền. Để sau này dễ thay hình minh họa mà không xô lệch bố cục, bạn nên","options":["A. Đặt hình minh họa thành đối tượng (nhóm) riêng, các phần khác thành nhóm riêng","B. Vẽ tất cả dính liền nhau","C. Gộp tất cả thành một hình duy nhất","D. Không cần tổ chức gì"],"answer":"A","explain":"Tổ chức bản vẽ thành các nhóm độc lập theo chức năng giúp thay thế, sửa từng phần dễ dàng.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về vẽ hình.","statements":["Có thể vẽ hình chữ nhật bo góc trong Inkscape.","Có thể chỉnh số cánh của ngôi sao khi vẽ.","Đường xoắn ốc vẽ xong có thể chỉnh số vòng.","Mọi hình vẽ xong đều không thể thay đổi."],"answer":["T","T","T","F"],"explain":"Các hình cơ bản đều có tham số chỉnh được trên thanh thuộc tính ngay cả sau khi vẽ.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về sao chép.","statements":["Ctrl+C, Ctrl+V sao chép đối tượng sang vị trí mới.","Ctrl+D nhân bản nhanh tại chỗ.","Đối tượng được sao chép là độc lập với bản gốc.","Xóa bản gốc sẽ làm mất luôn các bản sao."],"answer":["T","T","T","F"],"explain":"Bản sao độc lập hoàn toàn; xóa bản gốc không ảnh hưởng bản sao.","points":1},{"type":"short","level":"NB","q":"Phím tắt của công cụ vẽ ngôi sao và đa giác là (chỉ ghi kí tự)","answer":"*","explain":"Phím * mở công cụ Star/Polygon để vẽ sao và đa giác đều.","points":0.5},{"type":"short","level":"VDC","q":"Để vẽ hình từ tâm ra ngoài (tâm hình nằm đúng điểm bắt đầu kéo chuột), giữ phím nào khi vẽ? (ghi tên phím, viết hoa chữ S)","answer":"Shift","explain":"Giữ Shift khi vẽ: hình mở rộng từ tâm; kết hợp Ctrl được hình đều từ tâm.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Đối tượng được vẽ sau trong Inkscape sẽ nằm ở vị trí nào so với đối tượng vẽ trước?","options":["A. Nằm trên (che phủ)","B. Nằm dưới","C. Biến mất","D. Nằm cạnh bên"],"answer":"A","explain":"Thứ tự chồng lấp mặc định: vẽ sau nằm trên, vẽ trước nằm dưới.","points":0.25},{"type":"mcq","level":"NB","q":"Phím tắt mở hộp thoại Fill and Stroke là","options":["A. Ctrl+Shift+F","B. Ctrl+Shift+S","C. Ctrl+Alt+F","D. Alt+F4"],"answer":"A","explain":"Ctrl+Shift+F mở Fill and Stroke để chỉnh màu tô, màu viền, độ dày và kiểu nét.","points":0.25},{"type":"mcq","level":"TH","q":"Khi bấm chuột vào đối tượng đang chọn lần thứ hai, các tay cầm chuyển sang cho phép","options":["A. Xoay và nghiêng đối tượng","B. Xóa đối tượng","C. Nhân bản đối tượng","D. Đổi màu đối tượng"],"answer":"A","explain":"Chế độ tay cầm thứ hai cho phép xoay và nghiêng (skew) đối tượng.","points":0.25},{"type":"mcq","level":"TH","q":"Trong hộp thoại Align and Distribute, nhóm nút Align dùng để","options":["A. Căn thẳng hàng các đối tượng (trái, phải, giữa, trên, dưới)","B. Tô màu đối tượng","C. Vẽ hình mới","D. Xóa đối tượng"],"answer":"A","explain":"Align căn thẳng hàng; Distribute phân bố khoảng cách đều nhau giữa các đối tượng.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ con cá gồm thân, vây, đuôi, mắt. Muốn lật ngược con cá (đổi hướng bơi) mà giữ nguyên hình dạng các bộ phận, bạn nên","options":["A. Nhóm con cá lại rồi dùng lệnh lật ngang (flip horizontal)","B. Vẽ lại con cá mới","C. Xóa từng bộ phận","D. Xoay từng bộ phận một"],"answer":"A","explain":"Nhóm rồi lật cả nhóm giữ nguyên quan hệ vị trí giữa các bộ phận.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn thiết kế banner có dòng chữ khẩu hiệu đè lên hình nền. Để chữ luôn nổi bật dù đổi hình nền, giải pháp bền vững là","options":["A. Đặt chữ ở lớp trên cùng và thêm viền (stroke) hoặc bóng cho chữ","B. Vẽ chữ dính liền vào hình nền","C. Dùng chữ màu giống màu nền","D. Xóa chữ đi"],"answer":"A","explain":"Chữ ở trên cùng + viền/bóng giúp chữ đọc được trên mọi nền; vẽ dính liền sẽ khó thay nền sau này.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về di chuyển đối tượng.","statements":["Kéo chuột di chuyển đối tượng nhanh nhưng kém chính xác.","Phím mũi tên di chuyển từng bước nhỏ chính xác.","Shift + phím mũi tên di chuyển bước lớn hơn.","Không thể di chuyển đối tượng đã vẽ."],"answer":["T","T","T","F"],"explain":"Kết hợp kéo chuột (nhanh) và phím mũi tên (chính xác) tùy nhu cầu.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về thứ tự và lớp phủ.","statements":["Chữ muốn đọc được phải nằm trên hình nền.","Dùng PageUp/PageDown điều chỉnh nhanh thứ tự một bậc.","Home/End đưa đối tượng lên trên cùng/xuống dưới cùng.","Đối tượng ở dưới cùng thì không bao giờ nhìn thấy được."],"answer":["T","T","T","F"],"explain":"Đối tượng dưới cùng vẫn thấy được ở phần không bị che; thứ tự chỉ quyết định chỗ chồng lấp.","points":1},{"type":"short","level":"NB","q":"Để xóa đối tượng đang chọn trong Inkscape, nhấn phím nào? (ghi tên phím, viết hoa chữ D)","answer":"Delete","explain":"Delete xóa đối tượng đang chọn; Ctrl+Z hoàn tác nếu xóa nhầm.","points":0.5},{"type":"short","level":"VDC","q":"Kể tên một phím tắt để mở công cụ vẽ đường xoắn ốc (chỉ ghi phím)","answer":"F9","explain":"F9 là công cụ Spiral vẽ đường xoắn ốc, chỉnh được số vòng trên thanh thuộc tính.","points":0.5}]}]}
