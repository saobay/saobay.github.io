<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Công cụ tạo màu chuyển sắc (Gradient) trong Inkscape có phím tắt là","options":["A. Ctrl+F1","B. F4","C. F8","D. F2"],"answer":"A","explain":"Ctrl+F1 (hoặc G) là công cụ Gradient tạo màu chuyển sắc tuyến tính hoặc xuyên tâm.","points":0.25},{"type":"mcq","level":"NB","q":"Màu chuyển sắc tuyến tính (linear gradient) là kiểu chuyển màu","options":["A. Theo một hướng thẳng (ví dụ từ trái sang phải)","B. Từ tâm tỏa ra ngoài","C. Ngẫu nhiên","D. Chỉ có hai màu đen trắng"],"answer":"A","explain":"Linear gradient chuyển màu dọc theo một đường thẳng; radial gradient tỏa từ tâm ra ngoài.","points":0.25},{"type":"mcq","level":"TH","q":"Các 'điểm dừng màu' (stop) trên thanh gradient dùng để","options":["A. Xác định màu sắc tại từng vị trí trên dải chuyển sắc","B. Dừng phần mềm","C. Xóa đối tượng","D. Tắt máy"],"answer":"A","explain":"Mỗi stop giữ một màu tại một vị trí; Inkscape nội suy màu giữa các stop tạo dải chuyển mượt.","points":0.25},{"type":"mcq","level":"TH","q":"Để tạo hiệu ứng đổ bóng cho đối tượng trong Inkscape, ta có thể dùng","options":["A. Filters → Shadows and Glows → Drop Shadow","B. File → New","C. Edit → Copy","D. View → Zoom"],"answer":"A","explain":"Bộ lọc Drop Shadow tạo bóng đổ giúp đối tượng nổi khối, có chiều sâu.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn muốn vẽ bầu trời chuyển từ xanh nhạt (chân trời) sang xanh đậm (đỉnh). Cách làm là","options":["A. Tô hình chữ nhật bằng linear gradient từ xanh nhạt đến xanh đậm theo chiều dọc","B. Tô một màu xanh duy nhất","C. Vẽ nhiều hình chữ nhật chồng nhau","D. Dùng ảnh chụp"],"answer":"A","explain":"Linear gradient theo chiều dọc với hai stop màu xanh nhạt/đậm tạo bầu trời tự nhiên.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn thiết kế nút bấm 3D cho website. Để nút trông nổi lên, bạn nên kết hợp","options":["A. Radial gradient sáng ở tâm + đổ bóng (drop shadow) dưới nút","B. Chỉ tô một màu phẳng","C. Xóa nút đi","D. Vẽ nút bằng nét đứt"],"answer":"A","explain":"Gradient xuyên tâm tạo khối tròn, bóng đổ tạo chiều sâu: hai hiệu ứng kết hợp cho cảm giác 3D.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về gradient.","statements":["Gradient giúp màu chuyển mượt mà giữa các màu.","Linear gradient chuyển màu theo một hướng thẳng.","Radial gradient tỏa màu từ tâm ra ngoài.","Có thể thêm nhiều điểm dừng màu (stop) trên một dải gradient."],"answer":["T","T","T","T"],"explain":"Hai loại gradient cơ bản là tuyến tính và xuyên tâm; thêm nhiều stop tạo dải màu phong phú.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về bộ lọc.","statements":["Bộ lọc Drop Shadow tạo bóng đổ cho đối tượng.","Bộ lọc làm mờ (blur) giúp tạo chiều sâu, hiệu ứng mềm mại.","Lạm dụng quá nhiều bộ lọc có thể làm file nặng và rối mắt.","Bộ lọc trong Inkscape không bao giờ dùng được."],"answer":["T","T","T","F"],"explain":"Bộ lọc (Filters) là công cụ mạnh nhưng nên dùng vừa phải, có chủ đích.","points":1},{"type":"short","level":"NB","q":"Phím tắt của công cụ tạo màu chuyển sắc (Gradient) là","answer":"Ctrl+F1","explain":"Ctrl+F1 (hoặc phím G) mở công cụ Gradient.","points":0.5},{"type":"short","level":"VDC","q":"Kiểu chuyển sắc tỏa màu từ tâm ra ngoài có tên tiếng Anh là (viết thường)","answer":"radial","explain":"Radial gradient tỏa từ tâm; linear gradient theo hướng thẳng.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Hộp thoại quản lí các lớp (Layers) trong Inkscape mở bằng phím tắt","options":["A. Ctrl+Shift+L","B. Ctrl+Shift+F","C. Ctrl+Shift+A","D. Ctrl+Shift+E"],"answer":"A","explain":"Ctrl+Shift+L mở bảng Layers để thêm, ẩn, khóa, sắp xếp các lớp.","points":0.25},{"type":"mcq","level":"NB","q":"Lớp (layer) trong đồ họa có thể hình dung như","options":["A. Các tờ giấy trong chồng lên nhau, mỗi tờ chứa một nhóm đối tượng","B. Một loại virus","C. Thùng rác","D. Màn hình máy tính"],"answer":"A","explain":"Layer như các tờ giấy trong: lớp trên che lớp dưới ở chỗ chồng lấp; quản lí riêng từng lớp.","points":0.25},{"type":"mcq","level":"TH","q":"Khóa (lock) một lớp trong Inkscape có tác dụng","options":["A. Không cho chỉnh sửa nhầm các đối tượng trên lớp đó","B. Xóa lớp đó","C. Đổi màu lớp đó","D. Tắt máy tính"],"answer":"A","explain":"Khóa lớp để bảo vệ phần đã hoàn thiện khỏi bị sửa nhầm khi làm việc với lớp khác.","points":0.25},{"type":"mcq","level":"TH","q":"Ẩn (hide) một lớp trong Inkscape giúp","options":["A. Tạm thời không hiển thị lớp đó để dễ thao tác với lớp khác","B. Xóa vĩnh viễn lớp đó","C. Tăng dung lượng file","D. Đổi tên lớp"],"answer":"A","explain":"Ẩn lớp để tập trung làm việc; bấm hiện lại khi cần, không mất dữ liệu.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ truyện tranh nhiều khung hình trên một trang. Để dễ quản lí, bạn nên","options":["A. Đặt mỗi khung hình (hoặc mỗi nhân vật) trên một lớp riêng, đặt tên rõ ràng","B. Vẽ tất cả lên một lớp duy nhất","C. Vẽ mỗi khung một file riêng","D. Không cần tổ chức"],"answer":"A","explain":"Mỗi khung/nhân vật một lớp, đặt tên rõ ràng giúp tìm, sửa, ẩn hiện dễ dàng.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn làm poster có nền, hình minh họa, tiêu đề, logo. Khi in thử, logo bị hình minh họa che mất. Cách sửa triệt để và quản lí lâu dài là","options":["A. Tổ chức các lớp riêng (nền dưới cùng, logo lớp trên cùng) và đưa logo lên lớp trên","B. Xóa hình minh họa","C. Vẽ lại logo to hơn","D. Đổi màu logo"],"answer":"A","explain":"Tổ chức lớp theo thứ tự logic (nền → nội dung → tiêu đề/logo) giúp kiểm soát chồng lấp lâu dài.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về lớp (layer).","statements":["Mỗi lớp có thể chứa nhiều đối tượng.","Có thể đặt tên cho từng lớp để dễ quản lí.","Lớp trên sẽ che lớp dưới ở vị trí chồng lấp.","Không thể thay đổi thứ tự các lớp."],"answer":["T","T","T","F"],"explain":"Thứ tự lớp thay đổi được bằng cách kéo thả trong bảng Layers.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về hoàn thiện sản phẩm.","statements":["Trước khi xuất bản nên kiểm tra chính tả văn bản.","Nên kiểm tra căn chỉnh, màu sắc tổng thể trước khi xuất.","Nên giữ file SVG gốc để chỉnh sửa về sau.","Xuất bản xong thì xóa ngay file gốc cho nhẹ máy."],"answer":["T","T","T","F"],"explain":"Luôn giữ file gốc SVG; chỉ xóa khi chắc chắn không cần chỉnh sửa nữa.","points":1},{"type":"short","level":"NB","q":"Phím tắt mở bảng quản lí các lớp (Layers) trong Inkscape là","answer":"Ctrl+Shift+L","explain":"Ctrl+Shift+L mở bảng Layers: thêm, xóa, ẩn, khóa, sắp xếp lớp.","points":0.5},{"type":"short","level":"VDC","q":"Kiểu chuyển sắc theo một hướng thẳng có tên tiếng Anh là (viết thường)","answer":"linear","explain":"Linear gradient chuyển theo hướng thẳng; radial tỏa từ tâm.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Để sao chép kiểu (màu sắc, viền) từ đối tượng này sang đối tượng khác, ta dùng","options":["A. Edit → Copy rồi Edit → Paste Style (Ctrl+Shift+V)","B. Phím Delete","C. File → New","D. Không thể sao chép kiểu"],"answer":"A","explain":"Copy đối tượng mẫu rồi Paste Style dán kiểu (fill, stroke) sang đối tượng khác.","points":0.25},{"type":"mcq","level":"NB","q":"Công cụ Dropper (F7) trong Inkscape dùng để","options":["A. Lấy màu từ đối tượng có sẵn","B. Vẽ đường thẳng","C. Gõ văn bản","D. Xóa đối tượng"],"answer":"A","explain":"Bấm Dropper vào đối tượng bất kì để lấy màu của nó áp cho đối tượng đang chọn.","points":0.25},{"type":"mcq","level":"TH","q":"Khi áp dụng bộ lọc làm mờ (blur) cho một đối tượng, đối tượng sẽ","options":["A. Mờ dần, mềm mại hơn","B. Sắc nét hơn","C. Biến mất","D. Đổi thành màu đỏ"],"answer":"A","explain":"Blur làm mờ viền và chi tiết, tạo hiệu ứng chiều sâu, bóng mềm.","points":0.25},{"type":"mcq","level":"TH","q":"Để tạo thêm điểm dừng màu (stop) trên thanh gradient, ta","options":["A. Bấm đúp lên thanh gradient tại vị trí muốn thêm","B. Nhấn phím Delete","C. Tắt phần mềm","D. Không thể thêm"],"answer":"A","explain":"Bấm đúp lên dải gradient để thêm stop; chọn stop rồi Delete để xóa bớt.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn thiết kế logo có 5 hình dùng chung một kiểu màu gradient. Cách đồng nhất nhanh nhất là","options":["A. Tạo gradient mẫu cho một hình rồi sao chép kiểu (Paste Style) sang các hình còn lại","B. Tạo gradient riêng cho từng hình","C. Tô màu phẳng cho nhanh","D. Bỏ gradient"],"answer":"A","explain":"Paste Style sao chép kiểu giúp đồng nhất nhanh và chính xác.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn vẽ quả bóng với radial gradient nhưng tâm sáng lệch sang một bên trông không tự nhiên. Cách sửa là","options":["A. Dùng công cụ Gradient kéo lại vị trí tâm và điều chỉnh các stop","B. Xóa quả bóng vẽ lại","C. Đổi màu quả bóng","D. Phóng to quả bóng"],"answer":"A","explain":"Công cụ Gradient cho phép kéo tâm, chỉnh hướng và vị trí các stop trực tiếp trên vùng vẽ.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về sao chép thuộc tính.","statements":["Paste Style sao chép kiểu dáng (màu, viền) sang đối tượng khác.","Dropper (F7) lấy màu từ đối tượng có sẵn.","Sao chép kiểu giúp các đối tượng đồng nhất nhanh chóng.","Mỗi đối tượng bắt buộc phải tạo kiểu riêng từ đầu."],"answer":["T","T","T","F"],"explain":"Có thể sao chép kiểu từ đối tượng mẫu, không cần tạo lại từ đầu.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về xuất bản sản phẩm.","statements":["Ảnh đăng web, mạng xã hội nên xuất PNG với DPI vừa phải (72–96).","Ảnh gửi nhà in nên xuất với DPI cao (khoảng 300).","Nên xuất đúng kích thước cần dùng để file không quá nặng.","Cứ xuất DPI càng cao càng tốt cho mọi mục đích."],"answer":["T","T","T","F"],"explain":"DPI cao không cần thiết cho web (làm file nặng, tải chậm); chọn DPI phù hợp mục đích.","points":1},{"type":"short","level":"NB","q":"Để dán kiểu dáng đã sao chép sang đối tượng khác, tổ hợp phím tắt là","answer":"Ctrl+Shift+V","explain":"Ctrl+Shift+V (Paste Style) dán kiểu fill, stroke từ đối tượng mẫu.","points":0.5},{"type":"short","level":"VDC","q":"Bộ lọc tạo bóng đổ cho đối tượng trong menu Filters có tên tiếng Anh là (viết đúng: Drop Shadow)","answer":"Drop Shadow","explain":"Filters → Shadows and Glows → Drop Shadow tạo bóng đổ.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Quy trình thiết kế đồ họa hợp lí thường theo thứ tự","options":["A. Lên ý tưởng → phác thảo → vẽ → tô màu, hiệu ứng → kiểm tra → xuất bản","B. Xuất bản trước rồi mới vẽ","C. Tô màu trước rồi mới lên ý tưởng","D. Không cần quy trình"],"answer":"A","explain":"Quy trình chuẩn: ý tưởng, phác thảo, vẽ chi tiết, màu sắc/hiệu ứng, kiểm tra, xuất bản.","points":0.25},{"type":"mcq","level":"NB","q":"Định dạng file phù hợp nhất để gửi nhà in ấn poster là","options":["A. PDF hoặc PNG với DPI cao","B. File nhạc MP3","C. File văn bản TXT","D. File cài đặt phần mềm"],"answer":"A","explain":"PDF giữ vector sắc nét khi in; PNG DPI cao cũng được chấp nhận ở nhiều nhà in.","points":0.25},{"type":"mcq","level":"TH","q":"Trước khi xuất bản sản phẩm đồ họa, cần kiểm tra","options":["A. Chính tả, căn chỉnh, màu sắc, bố cục tổng thể","B. Tốc độ mạng","C. Dung lượng pin","D. Nhiệt độ CPU"],"answer":"A","explain":"Kiểm tra lỗi chính tả, căn chỉnh lệch, màu sắc, bố cục trước khi xuất bản thành phẩm.","points":0.25},{"type":"mcq","level":"TH","q":"Khi thiết kế thiệp, việc chừa lề (margin) xung quanh nội dung giúp","options":["A. Bố cục thoáng, khi in cắt xén không bị mất nội dung","B. Tốn giấy hơn","C. Làm thiệp xấu đi","D. Không có tác dụng"],"answer":"A","explain":"Chừa lề an toàn tránh nội dung bị cắt khi in ấn, bố cục thoáng đãng hơn.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn thiết kế poster cho sự kiện của trường. Để poster thu hút người xem từ xa, bạn nên","options":["A. Tiêu đề lớn, màu sắc tương phản, bố cục rõ ràng, ít chữ","B. Nhồi nhét thật nhiều chữ nhỏ","C. Dùng màu nhạt nhòa","D. Để trống poster"],"answer":"A","explain":"Poster xem từ xa cần tiêu đề lớn, tương phản cao, thông điệp ngắn gọn.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn nhận thiết kế banner cho câu lạc bộ. Khách hàng yêu cầu sửa màu sắc 3 lần. Để sửa nhanh và không lỗi, bạn nên","options":["A. Giữ file SVG gốc có tổ chức lớp rõ ràng để đổi màu nhanh","B. Mỗi lần sửa vẽ lại từ đầu","C. Từ chối sửa","D. Xuất PNG rồi tô đè màu lên ảnh"],"answer":"A","explain":"File gốc có tổ chức tốt cho phép sửa đổi nhanh nhiều lần; sửa trên ảnh xuất ra kém chất lượng.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về quy trình thiết kế.","statements":["Nên lên ý tưởng và phác thảo trước khi vẽ chi tiết.","Nên kiểm tra tổng thể trước khi xuất bản.","Nên giữ file gốc để chỉnh sửa khi có yêu cầu thay đổi.","Vẽ xong là xuất bản ngay, không cần kiểm tra."],"answer":["T","T","T","F"],"explain":"Kiểm tra kĩ trước khi xuất bản tránh phải làm lại; giữ file gốc để sửa đổi.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về lựa chọn định dạng xuất.","statements":["Chia sẻ lên mạng xã hội: xuất PNG hoặc JPEG.","Gửi nhà in: xuất PDF hoặc PNG DPI cao.","Lưu trữ để chỉnh sửa sau: giữ file SVG gốc.","Mọi mục đích đều chỉ cần một file PNG duy nhất."],"answer":["T","T","T","F"],"explain":"Mỗi mục đích cần định dạng phù hợp; luôn giữ file gốc SVG.","points":1},{"type":"short","level":"NB","q":"Trong quy trình thiết kế, bước đầu tiên trước khi vẽ chi tiết là gì? (điền: lên ý tưởng)","answer":"lên ý tưởng","explain":"Lên ý tưởng và phác thảo giúp định hướng rõ ràng trước khi vẽ chi tiết.","points":0.5},{"type":"short","level":"VDC","q":"Khi in poster khổ lớn, ngoài file vector, ảnh raster cần có độ phân giải khoảng bao nhiêu DPI? (chỉ ghi số)","answer":"300","explain":"In ấn chất lượng cao thường cần khoảng 300 DPI.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Màu chuyển sắc (gradient) là","options":["A. Dải màu chuyển mượt mà từ màu này sang màu khác","B. Một màu đơn sắc","C. Màu đen trắng","D. Không có màu"],"answer":"A","explain":"Gradient tạo dải chuyển màu mượt mà giữa các điểm dừng màu, sinh động hơn màu phẳng.","points":0.25},{"type":"mcq","level":"NB","q":"Để thêm một lớp mới trong Inkscape, ta vào","options":["A. Layer → Add Layer","B. File → New","C. Edit → Copy","D. View → Zoom"],"answer":"A","explain":"Layer → Add Layer tạo lớp mới; quản lí trong bảng Layers (Ctrl+Shift+L).","points":0.25},{"type":"mcq","level":"TH","q":"Khi di chuyển thanh trượt độ trong suốt (opacity) của một stop về 0, vị trí đó sẽ","options":["A. Trở nên trong suốt hoàn toàn","B. Đậm đặc hơn","C. Biến thành màu đen","D. Không thay đổi"],"answer":"A","explain":"Opacity 0 là trong suốt hoàn toàn; kết hợp với gradient tạo hiệu ứng mờ dần.","points":0.25},{"type":"mcq","level":"TH","q":"Hiệu ứng đổ bóng (drop shadow) giúp đối tượng","options":["A. Trông nổi lên, có chiều sâu như đặt trên mặt phẳng","B. Biến mất","C. Nhỏ lại","D. Đổi màu"],"answer":"A","explain":"Bóng đổ mô phỏng ánh sáng thực, tạo cảm giác đối tượng nổi khỏi nền.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ nút bấm trên giao diện: muốn nút trông như đang được nhấn (lõm xuống). Bạn có thể","options":["A. Dùng gradient tối ở tâm và bóng đổ phía trong","B. Tô màu phẳng","C. Xóa nút","D. Vẽ nút to hơn"],"answer":"A","explain":"Gradient tối ở tâm + bóng trong tạo cảm giác lõm xuống; ngược lại với nút nổi.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn thiết kế ảnh bìa Facebook cho lớp. Kích thước chuẩn khoảng 820×312 pixel. Để ảnh hiển thị sắc nét trên mọi thiết bị, bạn nên","options":["A. Thiết kế vector rồi xuất PNG đúng tỉ lệ, kiểm tra hiển thị trên điện thoại và máy tính","B. Vẽ bừa kích thước nào cũng được","C. Dùng ảnh chụp màn hình nhỏ phóng to","D. Chỉ cần đẹp trên máy mình"],"answer":"A","explain":"Thiết kế đúng tỉ lệ, xuất đủ phân giải và kiểm tra đa thiết bị là quy trình chuyên nghiệp.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về hiệu ứng.","statements":["Gradient tạo cảm giác chuyển màu tự nhiên, sinh động.","Drop shadow tạo chiều sâu cho đối tượng.","Blur làm mềm mại chi tiết, tạo hiệu ứng xa gần.","Hiệu ứng càng nhiều càng đẹp, không cần tiết chế."],"answer":["T","T","T","F"],"explain":"Hiệu ứng nên dùng có chủ đích, vừa phải; lạm dụng gây rối mắt.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về làm việc chuyên nghiệp.","statements":["Đặt tên lớp và nhóm rõ ràng giúp dễ bàn giao file.","Giữ file gốc có tổ chức giúp sửa đổi nhanh khi khách yêu cầu.","Xuất nhiều định dạng phục vụ các mục đích khác nhau.","File càng rối, càng nhiều lớp trùng tên càng chuyên nghiệp."],"answer":["T","T","T","F"],"explain":"Tổ chức file gọn gàng, đặt tên rõ ràng là dấu hiệu làm việc chuyên nghiệp.","points":1},{"type":"short","level":"NB","q":"Điểm xác định màu sắc tại từng vị trí trên dải chuyển sắc được gọi là điểm dừng màu, tiếng Anh là (viết thường)","answer":"stop","explain":"Stop là điểm dừng màu trên gradient; mỗi stop giữ một màu và độ trong suốt.","points":0.5},{"type":"short","level":"VDC","q":"Để tạo lớp mới trong Inkscape, lệnh trong menu Layer có tên tiếng Anh là (viết đúng: Add Layer)","answer":"Add Layer","explain":"Layer → Add Layer tạo lớp mới để tổ chức đối tượng.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Bộ lọc (Filter) trong Inkscape là","options":["A. Các hiệu ứng áp lên đối tượng như mờ, bóng đổ, biến dạng nghệ thuật","B. Bộ lọc nước","C. Phần mềm diệt virus","D. Thùng rác"],"answer":"A","explain":"Menu Filters chứa nhiều hiệu ứng: mờ, bóng đổ, ánh sáng, biến dạng... làm sản phẩm sinh động.","points":0.25},{"type":"mcq","level":"NB","q":"Độ trong suốt (opacity) của đối tượng được tính theo thang","options":["A. Từ 0 (trong suốt hoàn toàn) đến 100 (đậm đặc)","B. Chỉ có 0 và 1","C. Từ 100 đến 200","D. Không có thang đo"],"answer":"A","explain":"Opacity 0 là trong suốt, 100 là đậm đặc; giá trị giữa tạo mờ dần.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn tạo hiệu ứng chữ mờ dần (fade) ở cuối dòng tiêu đề, ta có thể","options":["A. Áp gradient có stop cuối với opacity bằng 0 lên chữ","B. Xóa chữ","C. Đổi font chữ","D. Tắt màn hình"],"answer":"A","explain":"Gradient mờ dần (stop cuối trong suốt) tạo hiệu ứng fade chuyên nghiệp.","points":0.25},{"type":"mcq","level":"TH","q":"Khi áp quá nhiều bộ lọc nặng lên bản vẽ, có thể xảy ra","options":["A. File nặng, hiển thị chậm và rối mắt","B. File nhẹ hơn","C. Máy chạy nhanh hơn","D. Không có gì xảy ra"],"answer":"A","explain":"Bộ lọc tốn tài nguyên; dùng vừa phải, có chủ đích.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ giọt nước: muốn phần trên trong suốt, phần dưới xanh đậm. Cách làm là","options":["A. Tô giọt nước bằng linear gradient từ trong suốt (trên) đến xanh đậm (dưới)","B. Tô một màu xanh duy nhất","C. Vẽ hai giọt nước chồng nhau","D. Dùng ảnh chụp"],"answer":"A","explain":"Gradient kết hợp độ trong suốt của stop tạo hiệu ứng giọt nước tự nhiên.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn thiết kế logo cho quán cà phê: cần vừa in được lên ly giấy (một màu), vừa dùng bản màu cho biển hiệu. Cách chuẩn bị tốt nhất là","options":["A. Thiết kế bản vector gốc, từ đó xuất bản một màu và bản màu đầy đủ","B. Vẽ hai logo hoàn toàn khác nhau","C. Chỉ làm bản màu","D. Chụp ảnh logo vẽ tay"],"answer":"A","explain":"Một file vector gốc xuất ra nhiều phiên bản (một màu, đủ màu) đảm bảo đồng nhất thương hiệu.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về độ trong suốt.","statements":["Opacity 0 nghĩa là trong suốt hoàn toàn.","Opacity 100 nghĩa là đậm đặc.","Có thể chỉnh opacity cho từng điểm dừng màu.","Mọi đối tượng đều phải để opacity bằng 100."],"answer":["T","T","T","F"],"explain":"Opacity chỉnh linh hoạt từ 0 đến 100 tùy hiệu ứng mong muốn.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về hoàn thiện thiệp mời.","statements":["Nên kiểm tra chính tả trước khi xuất bản.","Nên xem thử thiệp ở kích thước thật (100%).","Nên nhờ người khác đọc thử để phát hiện lỗi.","Xuất bản xong không cần giữ file gốc."],"answer":["T","T","T","F"],"explain":"Kiểm tra kĩ và giữ file gốc là thói quen tốt khi hoàn thiện sản phẩm.","points":1},{"type":"short","level":"NB","q":"Menu chứa các hiệu ứng như mờ, bóng đổ trong Inkscape là menu nào? (viết hoa chữ F)","answer":"Filters","explain":"Menu Filters chứa các bộ lọc hiệu ứng: Blur, Shadows and Glows...","points":0.5},{"type":"short","level":"VDC","q":"Thuộc tính điều chỉnh độ trong suốt của đối tượng trong tiếng Anh là (viết thường)","answer":"opacity","explain":"Opacity từ 0 (trong suốt) đến 100 (đậm đặc).","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Khi bản vẽ có nhiều lớp, để chỉnh sửa đối tượng trên một lớp cụ thể, ta nên","options":["A. Chọn đúng lớp đó trong bảng Layers (và khóa các lớp khác nếu cần)","B. Xóa các lớp khác","C. Tắt máy","D. Vẽ lại"],"answer":"A","explain":"Chọn đúng lớp đang làm việc; khóa lớp khác tránh sửa nhầm.","points":0.25},{"type":"mcq","level":"NB","q":"Biểu tượng con mắt bên cạnh tên lớp trong bảng Layers dùng để","options":["A. Ẩn hoặc hiện lớp đó","B. Xóa lớp","C. Đổi tên lớp","D. Khóa lớp"],"answer":"A","explain":"Bấm con mắt để ẩn/hiện lớp; biểu tượng ổ khóa để khóa lớp.","points":0.25},{"type":"mcq","level":"TH","q":"Thứ tự các lớp trong bảng Layers quy định","options":["A. Lớp nào ở trên sẽ hiển thị đè lên lớp ở dưới","B. Kích thước các lớp","C. Màu sắc các lớp","D. Tên file"],"answer":"A","explain":"Lớp trên cùng trong bảng Layers hiển thị trên cùng của bản vẽ.","points":0.25},{"type":"mcq","level":"TH","q":"Để di chuyển một đối tượng từ lớp này sang lớp khác, ta có thể","options":["A. Cắt (Ctrl+X) rồi chọn lớp đích và dán (Ctrl+V)","B. Không thể di chuyển","C. Xóa đối tượng vẽ lại","D. Đổi tên lớp"],"answer":"A","explain":"Cắt rồi chọn lớp đích và dán để chuyển đối tượng sang lớp khác.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ sơ đồ trường học: nền bản đồ, các tòa nhà, chú thích. Khi in thử, chữ chú thích bị nền che. Cách sửa là","options":["A. Đưa lớp chú thích lên trên cùng trong bảng Layers","B. Xóa nền bản đồ","C. Viết chữ to hơn","D. In lại nhiều lần"],"answer":"A","explain":"Lớp chú thích phải ở trên cùng để luôn hiển thị; tổ chức lớp hợp lí tránh lỗi chồng lấp.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhóm 4 bạn cùng thiết kế một poster, mỗi bạn phụ trách một phần. Để ghép file của nhau không bị lộn xộn, các bạn nên thống nhất","options":["A. Quy ước đặt tên lớp, kích thước trang và bảng màu chung từ đầu","B. Mỗi người làm tùy ý","C. Ghép bằng cách chụp màn hình","D. Chỉ một người làm"],"answer":"A","explain":"Thống nhất quy ước (tên lớp, kích thước, màu sắc) từ đầu giúp ghép file nhóm trơn tru.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về quản lí lớp.","statements":["Nên đặt tên lớp gợi nhớ (nền, tiêu đề, logo...).","Nên khóa lớp đã hoàn thiện để tránh sửa nhầm.","Có thể ẩn lớp để tập trung làm việc với lớp khác.","Càng nhiều lớp không tên càng tốt."],"answer":["T","T","T","F"],"explain":"Lớp cần đặt tên rõ ràng; lớp không tên gây khó quản lí.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về bàn giao sản phẩm.","statements":["Bàn giao file gốc SVG có tổ chức lớp rõ ràng là chuyên nghiệp.","Nên xuất thêm PNG/PDF để khách xem nhanh.","Ghi chú ngắn về font chữ đã dùng giúp người nhận xử lí khi thiếu font.","Chỉ cần gửi ảnh chụp màn hình là đủ."],"answer":["T","T","T","F"],"explain":"Bàn giao chuyên nghiệp gồm file gốc + bản xem nhanh + ghi chú cần thiết.","points":1},{"type":"short","level":"NB","q":"Biểu tượng nào bên cạnh tên lớp dùng để khóa lớp? (điền: ổ khóa)","answer":"ổ khóa","explain":"Biểu tượng ổ khóa để khóa lớp, bảo vệ khỏi chỉnh sửa nhầm.","points":0.5},{"type":"short","level":"VDC","q":"Trong bảng Layers, lớp nằm ở vị trí nào sẽ hiển thị trên cùng của bản vẽ? (điền: trên cùng / dưới cùng)","answer":"trên cùng","explain":"Lớp trên cùng trong bảng Layers hiển thị đè lên các lớp dưới.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Khi xuất PNG từ Inkscape, tùy chọn nào quyết định độ sắc nét của ảnh?","options":["A. Độ phân giải (DPI)","B. Tên file","C. Thư mục lưu","D. Màu nền Windows"],"answer":"A","explain":"DPI càng cao ảnh càng sắc nét (và file càng nặng); chọn DPI phù hợp mục đích.","points":0.25},{"type":"mcq","level":"NB","q":"File PDF xuất từ Inkscape thường được dùng để","options":["A. In ấn và chia sẻ tài liệu giữ nguyên bố cục","B. Nghe nhạc","C. Xem phim","D. Chơi game"],"answer":"A","explain":"PDF giữ nguyên bố cục, font chữ và vector, phù hợp in ấn và chia sẻ.","points":0.25},{"type":"mcq","level":"TH","q":"Một poster in khổ A0 (rất lớn) từ file vector thì","options":["A. Vẫn sắc nét vì vector vẽ lại ở mọi kích cỡ","B. Bị vỡ như ảnh raster","C. Không in được","D. Tự động nhỏ lại"],"answer":"A","explain":"Ưu điểm của vector: in khổ lớn vẫn sắc nét, không phụ thuộc DPI file gốc.","points":0.25},{"type":"mcq","level":"TH","q":"Khi gửi file SVG cho người khác mà họ không cài Inkscape, để họ xem được ngay, bạn nên","options":["A. Xuất thêm bản PNG hoặc PDF gửi kèm","B. Chỉ gửi file SVG","C. Gửi file cài đặt Inkscape","D. Không gửi gì"],"answer":"A","explain":"PNG/PDF xem được trên mọi thiết bị; SVG gốc giữ lại để chỉnh sửa.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn cần in 100 tờ rơi. Nhà in yêu cầu file PDF. Bạn sẽ","options":["A. Hoàn thiện bản vẽ rồi xuất (hoặc in) ra PDF kiểm tra kĩ trước khi gửi","B. Gửi file Word","C. Chụp màn hình gửi","D. Mang máy tính đến nhà in"],"answer":"A","explain":"Xuất PDF và kiểm tra kĩ (chính tả, lề, màu) trước khi in số lượng lớn.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn thiết kế bộ thiệp gồm 3 mẫu cùng phong cách. Để 3 mẫu đồng nhất và dễ sửa hàng loạt, bạn nên","options":["A. Tạo một file mẫu với bảng màu, font chữ, kiểu dáng chuẩn rồi nhân bản phát triển","B. Thiết kế mỗi mẫu một phong cách","C. Vẽ 3 mẫu hoàn toàn độc lập","D. Nhờ 3 người vẽ"],"answer":"A","explain":"File mẫu chuẩn (template) với bảng màu, font thống nhất giúp bộ sản phẩm đồng bộ.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về in ấn.","statements":["In khổ lớn từ vector luôn sắc nét.","In từ ảnh raster cần DPI cao (khoảng 300).","Nên in thử một bản trước khi in số lượng lớn.","Màu trên màn hình luôn giống hệt màu in ra."],"answer":["T","T","T","F"],"explain":"Màu in có thể lệch so với màn hình nên cần in thử và hiệu chỉnh.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về lưu trữ file thiết kế.","statements":["Nên lưu file gốc SVG theo từng phiên bản khi có thay đổi lớn.","Nên đặt tên file có số phiên bản (v1, v2...).","Nên sao lưu file quan trọng ra USB hoặc đám mây.","Chỉ cần lưu một file duy nhất, không cần phiên bản."],"answer":["T","T","T","F"],"explain":"Quản lí phiên bản và sao lưu giúp khôi phục khi cần, tránh mất công làm lại.","points":1},{"type":"short","level":"NB","q":"Định dạng file nào giữ nguyên bố cục và thường dùng để gửi nhà in? (viết hoa)","answer":"PDF","explain":"PDF giữ nguyên bố cục, phù hợp in ấn và chia sẻ tài liệu.","points":0.5},{"type":"short","level":"VDC","q":"Trước khi in số lượng lớn, nên làm gì để kiểm tra chất lượng? (điền: in thử)","answer":"in thử","explain":"In thử một bản giúp phát hiện lỗi màu sắc, lề, chính tả trước khi in hàng loạt.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Trong Inkscape, để xem bản vẽ ở kích thước thật khi in (100%), ta","options":["A. Chọn mức thu phóng 100% (hoặc nhấn phím 1)","B. Tắt màn hình","C. In ra giấy","D. Không thể xem"],"answer":"A","explain":"Thu phóng 100% hiển thị đúng kích thước thật, giúp đánh giá bố cục trước khi in.","points":0.25},{"type":"mcq","level":"NB","q":"Lưới (grid) và đường gióng (guide) trong Inkscape giúp","options":["A. Căn chỉnh đối tượng thẳng hàng, đều nhau","B. Tăng tốc máy","C. Đổi màu","D. Xóa đối tượng"],"answer":"A","explain":"Grid và guide là công cụ hỗ trợ căn chỉnh chính xác khi thiết kế.","points":0.25},{"type":"mcq","level":"TH","q":"Chế độ bắt dính (snap) trong Inkscape có tác dụng","options":["A. Tự động hút đối tượng vào lưới, đường gióng hoặc mép đối tượng khác","B. Dán keo đối tượng","C. Khóa file","D. Tắt phần mềm"],"answer":"A","explain":"Snap giúp đặt đối tượng khít vào vị trí chuẩn nhanh chóng, chính xác.","points":0.25},{"type":"mcq","level":"TH","q":"Khi thiết kế cần sự chính xác cao (ví dụ sơ đồ kĩ thuật), nên kết hợp","options":["A. Lưới, đường gióng và chế độ bắt dính","B. Vẽ tự do bằng tay","C. Đoán bằng mắt","D. Không cần công cụ hỗ trợ"],"answer":"A","explain":"Grid + guide + snap là bộ công cụ căn chỉnh chính xác trong thiết kế.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ hàng rào gồm nhiều thanh dọc đều nhau. Ngoài Align, công cụ nào giúp đặt các thanh khít đều nhanh?","options":["A. Chế độ bắt dính (snap) vào lưới","B. Công cụ văn bản","C. Công cụ tô màu","D. Xóa vẽ lại"],"answer":"A","explain":"Snap vào lưới giúp đặt các thanh đều nhau nhanh chóng và chính xác.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn được giao thiết kế lại logo cũ của trường cho sắc nét hơn. Logo cũ là ảnh JPEG mờ. Cách làm đúng là","options":["A. Vẽ lại logo bằng vector dựa trên mẫu cũ (đồ lại nét), không phóng to ảnh JPEG","B. Phóng to ảnh JPEG rồi lưu lại","C. Dùng bộ lọc làm nét ảnh JPEG","D. Giữ nguyên ảnh mờ"],"answer":"A","explain":"Ảnh JPEG mờ không thể phục hồi chi tiết bằng cách phóng to; vẽ lại vector cho logo sắc nét mọi kích cỡ.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về công cụ hỗ trợ.","statements":["Lưới (grid) giúp căn chỉnh đối tượng.","Đường gióng (guide) có thể kéo từ thước ra.","Chế độ bắt dính (snap) hút đối tượng vào vị trí chuẩn.","Các công cụ này chỉ dùng cho trang trí."],"answer":["T","T","T","F"],"explain":"Grid, guide, snap phục vụ căn chỉnh chính xác trong mọi thiết kế.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về cải tạo sản phẩm cũ.","statements":["Ảnh raster mờ không nên phóng to để dùng lại.","Vẽ lại bằng vector là cách tốt nhất để làm sắc nét logo cũ.","Có thể đặt ảnh cũ mờ bên dưới để đồ lại nét (trace).","Mọi ảnh cũ đều phải xóa bỏ, không tận dụng được."],"answer":["T","T","T","F"],"explain":"Đặt ảnh mẫu mờ làm nền để đồ lại vector là kĩ thuật phổ biến khi làm mới logo.","points":1},{"type":"short","level":"NB","q":"Chế độ tự động hút đối tượng vào lưới hoặc đường gióng trong Inkscape gọi là chế độ bắt dính, tiếng Anh là (viết thường)","answer":"snap","explain":"Snap giúp đặt đối tượng chính xác vào lưới, đường gióng, mép đối tượng.","points":0.5},{"type":"short","level":"VDC","q":"Để xem bản vẽ đúng kích thước thật (100%), nhấn phím số nào? (chỉ ghi số)","answer":"1","explain":"Phím 1 chuyển về thu phóng 100%, xem đúng kích thước thật khi in.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Sản phẩm đồ họa hoàn thiện cần đảm bảo yếu tố nào?","options":["A. Đúng yêu cầu, đẹp, không lỗi chính tả và xuất đúng định dạng","B. Càng nhiều hiệu ứng càng tốt","C. Càng nhiều màu càng tốt","D. Không cần kiểm tra"],"answer":"A","explain":"Sản phẩm tốt đáp ứng yêu cầu, thẩm mỹ, không lỗi và đúng định dạng sử dụng.","points":0.25},{"type":"mcq","level":"NB","q":"Khi sử dụng hình ảnh, font chữ của người khác trong thiết kế, cần","options":["A. Tôn trọng bản quyền: dùng ảnh, font miễn phí hoặc được cho phép","B. Cứ lấy tự do","C. Xóa tên tác giả","D. Không cần quan tâm"],"answer":"A","explain":"Thiết kế cũng phải tôn trọng bản quyền: dùng tài nguyên miễn phí/được cấp phép, ghi nguồn khi cần.","points":0.25},{"type":"mcq","level":"TH","q":"Một thiết kế đẹp nhưng sao chép ý tưởng của người khác mà không xin phép thì","options":["A. Vi phạm đạo đức và pháp luật về bản quyền","B. Là chuyện bình thường","C. Được khen ngợi","D. Không ai quan tâm"],"answer":"A","explain":"Tôn trọng bản quyền là nghĩa vụ; sao chép trái phép vi phạm pháp luật.","points":0.25},{"type":"mcq","level":"TH","q":"Để tìm ảnh, font chữ miễn phí dùng cho thiết kế, nên","options":["A. Tìm trên các kho tài nguyên miễn phí có giấy phép rõ ràng","B. Lấy ảnh bất kì trên mạng","C. Chụp ảnh sách","D. Quét ảnh tạp chí"],"answer":"A","explain":"Các kho tài nguyên miễn phí (giấy phép rõ ràng) cho phép dùng hợp pháp trong thiết kế.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn thiết kế poster dùng ảnh nền tải trên mạng không rõ bản quyền. Rủi ro có thể gặp là","options":["A. Vi phạm bản quyền, bị yêu cầu gỡ bỏ hoặc phạt","B. Không có rủi ro gì","C. Ảnh đẹp hơn","D. Được tặng thưởng"],"answer":"A","explain":"Dùng ảnh không rõ bản quyền có thể bị khiếu nại, yêu cầu gỡ bỏ, thậm chí phạt.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn làm freelancer nhận thiết kế logo cho khách. Để bảo vệ quyền lợi cả hai bên, bạn nên","options":["A. Thỏa thuận rõ phạm vi sử dụng, chi phí, bàn giao file gốc và quyền sở hữu","B. Làm xong gửi luôn không cần thỏa thuận","C. Giữ file gốc không giao","D. Dùng logo của người khác giao cho khách"],"answer":"A","explain":"Thỏa thuận rõ ràng về quyền sở hữu, phạm vi dùng và bàn giao giúp tránh tranh chấp.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về bản quyền trong thiết kế.","statements":["Nên dùng ảnh, font có giấy phép miễn phí hoặc được cho phép.","Tự vẽ, tự chụp thì mình là chủ sở hữu tác phẩm.","Sao chép tác phẩm người khác là vi phạm bản quyền.","Bản quyền không áp dụng cho sản phẩm đồ họa."],"answer":["T","T","T","F"],"explain":"Sản phẩm đồ họa được pháp luật bảo hộ bản quyền như các tác phẩm khác.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về tác phong nghề nghiệp.","statements":["Thỏa thuận rõ với khách hàng trước khi làm.","Bàn giao đúng hẹn, đúng định dạng đã thỏa thuận.","Giữ file gốc cẩn thận để sửa khi khách yêu cầu.","Hứa bừa tiến độ dù không làm kịp."],"answer":["T","T","T","F"],"explain":"Uy tín nghề nghiệp đến từ thỏa thuận rõ ràng và giữ đúng cam kết.","points":1},{"type":"short","level":"NB","q":"Khi dùng ảnh, font của người khác trong thiết kế, ta phải tôn trọng điều gì? (điền: bản quyền)","answer":"bản quyền","explain":"Tôn trọng bản quyền: dùng tài nguyên được phép, ghi nguồn khi cần.","points":0.5},{"type":"short","level":"VDC","q":"Người làm thiết kế đồ họa tự do (không thuộc công ty nào) được gọi là (viết thường, tiếng Anh)","answer":"freelancer","explain":"Freelancer là người làm việc tự do, nhận dự án từ nhiều khách hàng.","points":0.5}]}]}
