<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Ảnh raster (bitmap) được cấu tạo từ những thành phần nào?","options":["A. Các điểm ảnh (pixel) xếp thành lưới","B. Các đường cong toán học","C. Các đối tượng hình học","D. Các khung hình video"],"answer":"A","explain":"Ảnh raster gồm một lưới các điểm ảnh (pixel); mỗi pixel lưu một màu sắc. Càng nhiều pixel thì ảnh càng chi tiết nhưng dung lượng càng lớn.","points":0.25},{"type":"mcq","level":"NB","q":"Inkscape là phần mềm gì?","options":["A. Phần mềm soạn thảo văn bản","B. Phần mềm thiết kế đồ họa vector miễn phí, mã nguồn mở","C. Phần mềm chỉnh sửa video trả phí","D. Phần mềm diệt virus"],"answer":"B","explain":"Inkscape là phần mềm thiết kế đồ họa vector miễn phí, mã nguồn mở, chạy được trên Windows, macOS và Linux.","points":0.25},{"type":"mcq","level":"TH","q":"Khi phóng to một ảnh raster lên nhiều lần, hiện tượng quan sát được là","options":["A. Ảnh bị vỡ, xuất hiện các răng cưa","B. Ảnh trở nên sắc nét hơn","C. Dung lượng file tự giảm","D. Màu sắc tự động đẹp hơn"],"answer":"A","explain":"Ảnh raster có số pixel cố định; phóng to quá mức làm lộ từng ô pixel nên ảnh bị vỡ, răng cưa.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm nổi bật của đồ họa vector so với đồ họa raster là","options":["A. Màu sắc luôn phong phú hơn","B. Chụp ảnh thực tế tốt hơn","C. Phóng to, thu nhỏ không bị vỡ và dung lượng thường nhỏ","D. Không cần phần mềm để mở"],"answer":"C","explain":"Vector chỉ lưu mô tả đối tượng bằng công thức toán học nên phóng to bao nhiêu cũng không vỡ, file thường nhẹ.","points":0.25},{"type":"mcq","level":"VD","q":"Một công ty cần in logo lên biển quảng cáo khổ rất lớn mà vẫn sắc nét. Lựa chọn hợp lí là","options":["A. Vẽ logo bằng đồ họa vector (ví dụ Inkscape) rồi xuất đúng kích thước cần in","B. Chụp ảnh logo bằng điện thoại rồi phóng to","C. Vẽ bằng Paint rồi kéo giãn ảnh","D. Lưu logo dạng JPEG chất lượng thấp rồi in"],"answer":"A","explain":"Logo vector phóng to mọi kích cỡ vẫn sắc nét, sau đó xuất ra kích thước in thực tế nên cho chất lượng tốt nhất.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn chỉ được vẽ logo một lần nhưng phải dùng cho cả card visit nhỏ và biển hiệu lớn. Cách làm tối ưu là","options":["A. Vẽ logo dạng vector một lần, sau đó xuất ra nhiều kích cỡ khác nhau","B. Vẽ riêng một logo cho mỗi kích cỡ cần dùng","C. Vẽ thật to rồi khi cần nhỏ thì chụp màn hình lại","D. Vẽ nhỏ rồi dùng phần mềm phóng to dần khi cần"],"answer":"A","explain":"Vẽ vector một lần rồi xuất nhiều kích cỡ tận dụng đúng ưu điểm của vector: một file gốc, mọi kích thước đều sắc nét.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về phần mềm Inkscape.","statements":["Inkscape là phần mềm miễn phí, mã nguồn mở.","Inkscape chỉ chạy được trên hệ điều hành Windows.","File lưu mặc định của Inkscape có đuôi .svg.","Inkscape có thể xuất bản vẽ thành ảnh PNG."],"answer":["T","F","T","T"],"explain":"Inkscape miễn phí, mã nguồn mở, chạy đa nền tảng (Windows, macOS, Linux); định dạng gốc là SVG và xuất được PNG, PDF.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về hai loại đồ họa.","statements":["Ảnh raster phóng to nhiều lần sẽ bị vỡ hạt, răng cưa.","Ảnh vector được định nghĩa bằng các công thức toán học của đối tượng hình học.","File vector thường có dung lượng lớn hơn file raster cùng nội dung.","Muốn chỉnh sửa từng chi tiết của ảnh vector, ta thao tác trên từng đối tượng độc lập."],"answer":["T","T","F","T"],"explain":"Vector lưu mô tả toán học nên nhẹ và không vỡ khi phóng to; mỗi đối tượng vector độc lập nên sửa riêng từng cái được.","points":1},{"type":"short","level":"NB","q":"Đơn vị nhỏ nhất tạo nên một ảnh raster được gọi là gì? (viết thường, tiếng Anh)","answer":"pixel","explain":"Pixel (điểm ảnh) là đơn vị nhỏ nhất của ảnh raster; ảnh gồm hàng nghìn đến hàng triệu pixel xếp thành lưới.","points":0.5},{"type":"short","level":"VDC","q":"Một hình vẽ vector khi phóng to gấp 50 lần thì độ sắc nét so với ban đầu sẽ thế nào? (điền: tăng lên / giảm đi / không đổi)","answer":"không đổi","explain":"Vector được vẽ lại từ công thức toán học ở mọi tỉ lệ nên phóng to bao nhiêu độ sắc nét cũng không đổi.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Vùng làm việc chính giữa màn hình Inkscape, nơi ta vẽ các đối tượng, được gọi là","options":["A. Vùng vẽ (canvas)","B. Thanh menu","C. Thanh trạng thái","D. Thanh màu"],"answer":"A","explain":"Vùng vẽ (canvas) là khu vực trung tâm hiển thị trang giấy và các đối tượng đồ họa để người dùng thao tác.","points":0.25},{"type":"mcq","level":"NB","q":"Thanh chứa các công cụ vẽ (chọn, vẽ hình, văn bản...) trong Inkscape thường nằm ở","options":["A. Phía trên cửa sổ","B. Bên trái màn hình","C. Bên phải màn hình","D. Phía dưới vùng vẽ"],"answer":"B","explain":"Thanh công cụ (toolbox) của Inkscape được bố trí dọc bên trái màn hình, chứa các công cụ chọn, vẽ hình, vẽ đường, văn bản...","points":0.25},{"type":"mcq","level":"TH","q":"Thanh màu (palette) trong Inkscape có tác dụng","options":["A. Chọn nhanh màu tô và màu viền cho đối tượng","B. Chỉnh độ sáng màn hình máy tính","C. Chọn font chữ cho văn bản","D. Phóng to, thu nhỏ vùng vẽ"],"answer":"A","explain":"Thanh palette phía dưới vùng vẽ cho phép bấm chọn nhanh màu tô (fill) và màu viền (stroke) cho đối tượng đang chọn.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn thay đổi kích thước trang giấy vẽ (ví dụ sang khổ A4), ta vào","options":["A. File → Document Properties","B. Edit → Undo","C. View → Zoom","D. Help → About"],"answer":"A","explain":"File → Document Properties (Ctrl+Shift+D) mở hộp thoại thiết lập tài liệu: kích thước trang, đơn vị đo, hướng giấy.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ xong poster và cần gửi cho nhà in dưới dạng ảnh. Thao tác đúng là","options":["A. File → Export PNG Image, chọn độ phân giải rồi xuất","B. Chụp màn hình bằng điện thoại","C. Sao chép rồi dán vào Word","D. Đổi tên file .svg thành .png"],"answer":"A","explain":"Xuất ảnh đúng cách là File → Export PNG Image, chọn vùng và độ phân giải phù hợp rồi xuất; đổi tên đuôi file không chuyển được định dạng.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn lưu bản vẽ Inkscape rồi gửi file .svg cho bạn khác, nhưng máy bạn kia mở ra bị lỗi font chữ. Nguyên nhân hợp lí nhất là","options":["A. Máy bạn kia thiếu font chữ đã dùng trong bản vẽ","B. File .svg bị nhiễm virus","C. Inkscape không lưu được chữ","D. File .svg quá nhẹ nên mất chữ"],"answer":"A","explain":"File SVG chỉ tham chiếu tên font; máy mở thiếu font đó sẽ hiển thị sai. Khắc phục: chuyển chữ thành đường (path) hoặc gửi kèm font.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về màn hình làm việc của Inkscape.","statements":["Thanh menu chứa các lệnh như File, Edit, View, Object.","Thanh trạng thái hiển thị gợi ý thao tác và tọa độ con trỏ.","Mọi công cụ vẽ đều nằm trong thanh menu, không có thanh công cụ riêng.","Vùng vẽ là nơi hiển thị trang giấy và các đối tượng đồ họa."],"answer":["T","T","F","T"],"explain":"Inkscape có thanh công cụ riêng bên trái; thanh menu, thanh trạng thái và vùng vẽ có chức năng như các phát biểu đúng.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về thao tác với file trong Inkscape.","statements":["Ctrl+N tạo một tài liệu vẽ mới.","Ctrl+S lưu đè lên file đang mở với định dạng SVG mặc định.","Muốn có file ảnh PNG phải dùng lệnh xuất (export), không thể lưu trực tiếp.","Đóng Inkscape mà chưa lưu thì phần mềm luôn tự lưu hộ, không mất dữ liệu."],"answer":["T","T","T","F"],"explain":"Phải xuất (export) mới có PNG; đóng phần mềm khi chưa lưu sẽ mất dữ liệu nên cần lưu thường xuyên.","points":1},{"type":"short","level":"NB","q":"Trang web chính thức để tải phần mềm Inkscape là gì? (viết liền, không có www)","answer":"inkscape.org","explain":"Trang chủ của dự án Inkscape là inkscape.org, nơi tải bộ cài miễn phí cho các hệ điều hành.","points":0.5},{"type":"short","level":"VDC","q":"Muốn in poster khổ A3 sắc nét từ bản vẽ vector, khi xuất PNG nên chọn độ phân giải tối thiểu bao nhiêu DPI? (chỉ ghi số)","answer":"300","explain":"In ấn chất lượng cao thường dùng 300 DPI; ảnh hiển thị trên màn hình/web chỉ cần 72–96 DPI.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Đồ họa vector định nghĩa hình ảnh dựa trên","options":["A. Lưới điểm ảnh","B. Các đối tượng hình học và công thức toán học","C. Các khung hình video","D. Các lớp màu chồng ngẫu nhiên"],"answer":"B","explain":"Đồ họa vector mô tả hình bằng các đối tượng hình học (điểm, đường, đa giác, đường cong) và công thức toán học.","points":0.25},{"type":"mcq","level":"NB","q":"Phần mềm nào sau đây là phần mềm đồ họa vector?","options":["A. Paint","B. Inkscape","C. Windows Media Player","D. Notepad"],"answer":"B","explain":"Inkscape là phần mềm đồ họa vector; Paint làm việc với ảnh raster; hai phần mềm còn lại không phải đồ họa.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao file vector thường có dung lượng nhỏ hơn file raster?","options":["A. Vì vector chỉ lưu mô tả đối tượng bằng công thức, không lưu từng điểm ảnh","B. Vì vector tự nén ảnh mạnh hơn","C. Vì vector luôn ít màu hơn","D. Vì vector không lưu được chữ"],"answer":"A","explain":"Thay vì lưu màu từng pixel, vector chỉ lưu các tham số hình học nên file rất nhẹ.","points":0.25},{"type":"mcq","level":"TH","q":"Để thoát khỏi phần mềm Inkscape, cách làm đúng là","options":["A. File → Quit (hoặc nhấn Ctrl+Q)","B. Rút dây nguồn máy tính","C. Tắt màn hình","D. Nhấn giữ nút nguồn"],"answer":"A","explain":"Thoát đúng cách là File → Quit hoặc Ctrl+Q sau khi đã lưu file; rút nguồn đột ngột dễ mất dữ liệu.","points":0.25},{"type":"mcq","level":"VD","q":"Một bạn cần làm ảnh đại diện tròn cho nhóm lớp từ logo hình vuông đã vẽ bằng Inkscape. Cách hợp lí nhất là","options":["A. Xuất PNG rồi cắt tròn, hoặc vẽ khung tròn và dùng mặt nạ trong Inkscape","B. Vẽ lại logo từ đầu","C. Chụp màn hình logo","D. In logo ra giấy rồi cắt tròn"],"answer":"A","explain":"Tận dụng file vector gốc: xuất PNG rồi cắt, hoặc xử lý khung tròn ngay trong Inkscape cho chất lượng tốt nhất.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai bạn cùng vẽ một bức tranh: bạn A dùng Paint (raster), bạn B dùng Inkscape (vector). Sau đó cả hai cùng phóng to gấp 10 lần để in poster. Kết quả là","options":["A. Tranh của B vẫn sắc nét, tranh của A bị vỡ hạt","B. Cả hai đều sắc nét như nhau","C. Cả hai đều bị vỡ như nhau","D. Tranh của A sắc nét hơn tranh của B"],"answer":"A","explain":"Đây chính là khác biệt cốt lõi: vector phóng to không vỡ, raster phóng to quá mức sẽ vỡ hạt.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["Logo, biểu tượng, sơ đồ nên vẽ bằng đồ họa vector.","Ảnh chụp phong cảnh thường lưu dưới dạng raster như JPEG.","Đồ họa vector phóng to bao nhiêu cũng không bị vỡ.","Phần mềm Paint là phần mềm đồ họa vector."],"answer":["T","T","T","F"],"explain":"Paint là phần mềm raster; các phát biểu còn lại đúng với đặc trưng của từng loại đồ họa.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về Inkscape.","statements":["Inkscape chạy được trên Windows, macOS và Linux.","Inkscape là phần mềm thương mại, bắt buộc mua bản quyền.","Có thể mở file SVG bằng trình duyệt web.","Inkscape không thể làm việc với văn bản."],"answer":["T","F","T","F"],"explain":"Inkscape miễn phí, đa nền tảng, làm việc tốt với văn bản; SVG là chuẩn mở nên trình duyệt hiển thị được.","points":1},{"type":"short","level":"NB","q":"Để lưu bản vẽ đang làm trong Inkscape, ta dùng tổ hợp phím tắt nào?","answer":"Ctrl+S","explain":"Ctrl+S là phím tắt lưu file quen thuộc trong Inkscape và hầu hết phần mềm khác.","points":0.5},{"type":"short","level":"VDC","q":"Viết tắt DPI có nghĩa là số điểm ảnh trên mỗi (điền từ tiếng Anh, viết thường)","answer":"inch","explain":"DPI = Dots Per Inch: số điểm ảnh trên mỗi inch; DPI càng cao, ảnh in càng sắc nét.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Để mở một file bản vẽ đã lưu trước đó trong Inkscape, ta dùng","options":["A. File → Open (Ctrl+O)","B. File → New","C. File → Quit","D. Edit → Copy"],"answer":"A","explain":"File → Open (Ctrl+O) dùng để mở file đã lưu; File → New tạo file mới.","points":0.25},{"type":"mcq","level":"NB","q":"Đơn vị đo kích thước trong Inkscape có thể là","options":["A. Chỉ tính bằng cm","B. px, mm, cm, inch... tùy thiết lập","C. Chỉ tính bằng pixel","D. Không có đơn vị đo"],"answer":"B","explain":"Inkscape cho phép chọn nhiều đơn vị đo (px, mm, cm, inch...) trong Document Properties tùy mục đích sử dụng.","points":0.25},{"type":"mcq","level":"TH","q":"Một file SVG có thể mở và xem được bằng","options":["A. Trình duyệt web như Chrome, Edge","B. Chỉ duy nhất bằng Inkscape","C. Máy nghe nhạc","D. Không mở được ở đâu"],"answer":"A","explain":"SVG là chuẩn mở dựa trên XML nên các trình duyệt web hiện đại đều hiển thị được.","points":0.25},{"type":"mcq","level":"TH","q":"Trong Inkscape, mỗi hình vẽ là một đối tượng độc lập nên ta có thể","options":["A. Chọn, di chuyển, thay đổi từng hình riêng mà không ảnh hưởng hình khác","B. Chỉ xóa được cả trang một lúc","C. Không thể tô màu riêng","D. Phải vẽ lại từ đầu khi muốn sửa"],"answer":"A","explain":"Đặc trưng của đồ họa vector: mỗi đối tượng độc lập, chọn và chỉnh sửa riêng từng đối tượng.","points":0.25},{"type":"mcq","level":"VD","q":"Nhóm bạn làm dự án, mỗi người vẽ một phần rồi ghép lại thành sản phẩm chung. Định dạng nào thuận tiện nhất để ghép và chỉnh sửa tiếp?","options":["A. SVG (giữ nguyên đối tượng vector)","B. JPEG chất lượng thấp","C. Ảnh chụp màn hình","D. File nhạc MP3"],"answer":"A","explain":"SVG giữ nguyên từng đối tượng vector nên ghép các phần và chỉnh sửa tiếp rất thuận lợi.","points":0.25},{"type":"mcq","level":"VDC","q":"Giáo viên yêu cầu nộp bài thiết kế thiệp 20/11 dưới dạng file để cô mở xem và góp ý chỉnh sửa tiếp. Định dạng nộp hợp lí nhất là","options":["A. SVG (giữ nguyên đối tượng để sửa tiếp)","B. MP3","C. File cài đặt phần mềm","D. Ảnh chụp màn hình bị mờ"],"answer":"A","explain":"Nộp file gốc SVG để giáo viên mở bằng Inkscape và chỉnh sửa trực tiếp từng đối tượng; có thể kèm PNG để xem nhanh.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về thao tác cơ bản.","statements":["Kéo chuột trên vùng vẽ sau khi chọn công cụ hình chữ nhật sẽ tạo ra hình chữ nhật.","Nhấn Delete khi đang chọn đối tượng sẽ xóa đối tượng đó.","Không thể hoàn tác (undo) thao tác vẽ sai trong Inkscape.","Ctrl+Z dùng để hoàn tác thao tác vừa thực hiện."],"answer":["T","T","F","T"],"explain":"Inkscape hỗ trợ hoàn tác bằng Ctrl+Z; Delete xóa đối tượng đang chọn.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về lựa chọn loại đồ họa.","statements":["Thiết kế logo công ty nên dùng đồ họa vector.","Chỉnh sửa ảnh chụp chân dung thường dùng đồ họa raster.","Đồ họa vector không thể hiển thị màu chuyển sắc (gradient).","In ấn khổ lớn ưu tiên dùng file vector hoặc ảnh raster độ phân giải cao."],"answer":["T","T","F","T"],"explain":"Vector hỗ trợ gradient tốt; logo nên vector, ảnh chụp nên raster; in khổ lớn cần vector hoặc raster DPI cao.","points":1},{"type":"short","level":"NB","q":"Tổ hợp phím tắt để mở file bản vẽ có sẵn trong Inkscape là","answer":"Ctrl+O","explain":"Ctrl+O (Open) mở file đã lưu; phân biệt với Ctrl+N tạo mới và Ctrl+S lưu.","points":0.5},{"type":"short","level":"VDC","q":"Ảnh raster kích thước 800×600 pixel, in ở mật độ 200 DPI thì chiều rộng bản in là bao nhiêu inch? (chỉ ghi số)","answer":"4","explain":"800 pixel / 200 DPI = 4 inch. Công thức: kích thước in = số pixel chia cho DPI.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Inkscape thuộc loại phần mềm nào?","options":["A. Phần mềm hệ thống","B. Phần mềm ứng dụng đồ họa","C. Phần mềm diệt virus","D. Trình điều khiển thiết bị"],"answer":"B","explain":"Inkscape là phần mềm ứng dụng phục vụ thiết kế đồ họa, chạy trên hệ điều hành.","points":0.25},{"type":"mcq","level":"NB","q":"Khi lưu file trong Inkscape bằng Ctrl+S, định dạng mặc định là","options":["A. PNG","B. SVG","C. MP4","D. PDF"],"answer":"B","explain":"Inkscape lưu file làm việc mặc định ở định dạng SVG để giữ nguyên các đối tượng vector.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác biệt cơ bản giữa Save và Export trong Inkscape là","options":["A. Save lưu file làm việc (SVG) để chỉnh sửa tiếp, Export tạo file thành phẩm (PNG, PDF...) để sử dụng","B. Hai lệnh hoàn toàn giống nhau","C. Export lưu nhanh hơn Save","D. Save chỉ dùng được một lần duy nhất"],"answer":"A","explain":"Save giữ file gốc chỉnh sửa được; Export tạo bản thành phẩm dùng ngay (ảnh, PDF) nhưng không sửa từng đối tượng được.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao khi thiết kế logo người ta khuyên dùng phần mềm vector như Inkscape thay vì Paint?","options":["A. Vì logo cần phóng to thu nhỏ nhiều kích cỡ mà không vỡ, dễ chỉnh sửa","B. Vì Paint không có màu sắc","C. Vì Inkscape vẽ nhanh hơn","D. Vì Paint không lưu được file"],"answer":"A","explain":"Logo dùng ở nhiều kích cỡ (card visit đến biển hiệu) nên cần vector để luôn sắc nét và dễ chỉnh sửa.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ sơ đồ tư duy bằng Inkscape gồm nhiều hình và chữ. Muốn gửi cho cô giáo xem trên điện thoại mà không cần cài Inkscape, bạn nên","options":["A. Xuất ra PNG hoặc PDF rồi gửi","B. Gửi file .svg nguyên bản","C. Gửi file cài đặt Inkscape","D. Chỉ đọc mô tả bằng lời"],"answer":"A","explain":"Xuất PNG/PDF để người nhận xem được ngay trên mọi thiết bị; giữ file SVG gốc để chỉnh sửa.","points":0.25},{"type":"mcq","level":"VDC","q":"Một studio cần thiết kế bộ nhận diện thương hiệu gồm logo, card visit, biển hiệu lớn. Quy trình hợp lí với Inkscape là","options":["A. Thiết kế logo dạng vector một lần, dùng lại với mọi kích cỡ và xuất theo nhu cầu in ấn","B. Vẽ riêng một logo cho mỗi kích cỡ","C. Chụp ảnh logo vẽ tay để dùng","D. Tải logo có sẵn trên mạng về dùng"],"answer":"A","explain":"Một file vector gốc dùng cho mọi ấn phẩm là quy trình chuyên nghiệp: tiết kiệm công sức, đồng nhất thương hiệu, sắc nét mọi kích cỡ.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về lưu và xuất file.","statements":["File SVG lưu được toàn bộ đối tượng để mở ra chỉnh sửa tiếp.","File PNG xuất ra không chỉnh sửa từng đối tượng vector được nữa.","Có thể xuất một phần vùng chọn ra PNG thay vì cả trang.","Lệnh Save As dùng để lưu file với tên hoặc định dạng khác."],"answer":["T","T","T","T"],"explain":"SVG giữ đối tượng để sửa tiếp; PNG là ảnh raster thành phẩm; Export cho phép chọn vùng xuất; Save As đổi tên hoặc định dạng.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về ứng dụng thực tế.","statements":["Biển quảng cáo ngoài trời cần file đồ họa độ phân giải cao hoặc vector.","Ảnh đại diện mạng xã hội nên tải trực tiếp file vector SVG.","Thiết kế thiệp mời nên xuất PNG hoặc PDF để gửi nhà in.","File vector gửi cho người không có Inkscape thì nên xuất thêm PNG hoặc PDF."],"answer":["T","F","T","T"],"explain":"Mạng xã hội thường chỉ nhận ảnh raster (PNG/JPEG) làm ảnh đại diện; các phát biểu còn lại đúng.","points":1},{"type":"short","level":"NB","q":"Trong Inkscape, vùng trang giấy hình chữ nhật nơi chứa bản vẽ được gọi là vùng vẽ, tiếng Anh là (viết thường)","answer":"canvas","explain":"Canvas là vùng vẽ trung tâm của Inkscape, nơi đặt trang giấy và các đối tượng đồ họa.","points":0.5},{"type":"short","level":"VDC","q":"Trường tổ chức cuộc thi thiết kế logo, yêu cầu nộp file gốc để in nhiều kích cỡ và chỉnh sửa. Ngoài bản PNG xem trước, bạn nên nộp thêm file định dạng nào? (viết thường, gồm dấu chấm)","answer":".svg","explain":"Nộp file gốc .svg để ban tổ chức chỉnh sửa và xuất mọi kích cỡ; kèm PNG để xem nhanh.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Phần mềm đồ họa vector thương mại nổi tiếng, tính năng tương tự Inkscape nhưng phải trả phí, là","options":["A. Adobe Illustrator","B. Notepad","C. Calculator","D. Paint"],"answer":"A","explain":"Adobe Illustrator là phần mềm vector thương mại; Inkscape là lựa chọn miễn phí tương đương cho học tập.","points":0.25},{"type":"mcq","level":"NB","q":"Đối tượng trong đồ họa vector khi di chuyển hoặc thay đổi kích thước thì","options":["A. Chất lượng hình ảnh không đổi","B. Bị vỡ ngay lập tức","C. Bị mất màu","D. Tự biến thành ảnh raster"],"answer":"A","explain":"Vector vẽ lại từ công thức ở mọi trạng thái nên di chuyển, co giãn không làm giảm chất lượng.","points":0.25},{"type":"mcq","level":"TH","q":"Một ảnh raster có kích thước 100×100 pixel. Khi in với mật độ 100 DPI thì ảnh in ra có kích thước","options":["A. 1×1 inch","B. 10×10 inch","C. 100×100 inch","D. Không in được"],"answer":"A","explain":"100 pixel / 100 DPI = 1 inch mỗi chiều. Đây là cách tính kích thước in từ pixel và DPI.","points":0.25},{"type":"mcq","level":"TH","q":"Trong Inkscape, để quan sát chi tiết nhỏ của bản vẽ ở tỉ lệ lớn hơn, ta dùng","options":["A. Công cụ thu phóng (Zoom) hoặc Ctrl + lăn chuột","B. Tăng độ sáng màn hình","C. Đổi font chữ","D. Khởi động lại máy"],"answer":"A","explain":"Zoom chỉ thay đổi tỉ lệ hiển thị để quan sát, không làm thay đổi kích thước thật của đối tượng.","points":0.25},{"type":"mcq","level":"VD","q":"Một file PNG xuất từ Inkscape có nền trong suốt. Khi chèn lên slide PowerPoint thì","options":["A. Hiện đúng hình, phần nền trong suốt để lộ nền slide","B. Hiện thêm nền đen","C. Không chèn được vào slide","D. Tự động thành video"],"answer":"A","explain":"PNG hỗ trợ kênh trong suốt (alpha); phần nền trong suốt sẽ để lộ nền phía dưới khi chèn.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn nói: 'File vector nhẹ nên chất lượng luôn kém file raster nặng'. Nhận xét này","options":["A. Sai, dung lượng không quyết định chất lượng theo cách đó; vector sắc nét ở mọi tỉ lệ","B. Đúng hoàn toàn","C. Đúng với mọi trường hợp","D. Không thể kết luận"],"answer":"A","explain":"Vector nhẹ vì chỉ lưu công thức nhưng vẽ lại sắc nét ở mọi tỉ lệ; raster nặng vì lưu từng pixel nhưng phóng to sẽ vỡ.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về thu phóng và hiển thị.","statements":["Công cụ Zoom giúp quan sát chi tiết nhỏ của bản vẽ.","Thu phóng chỉ thay đổi cách hiển thị, không làm thay đổi kích thước thật của đối tượng.","Phím tắt Ctrl + lăn chuột dùng để thu phóng nhanh.","Thu nhỏ bản vẽ sẽ làm giảm dung lượng file SVG."],"answer":["T","T","T","F"],"explain":"Thu phóng là thao tác hiển thị, không ảnh hưởng kích thước thật hay dung lượng file.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về lựa chọn phần mềm.","statements":["Vẽ truyện tranh minh họa sách nên cân nhắc phần mềm vector.","Dựng phim hoạt hình 3D nên dùng Inkscape.","Thiết kế banner website có thể dùng Inkscape rồi xuất PNG.","Soạn thảo văn bản dài nên dùng phần mềm đồ họa vector."],"answer":["T","F","T","F"],"explain":"Inkscape là đồ họa vector 2D, không dựng phim 3D; văn bản dài nên dùng phần mềm soạn thảo chuyên dụng.","points":1},{"type":"short","level":"NB","q":"Tên tiếng Anh của thanh chứa bảng màu nhanh phía dưới vùng vẽ Inkscape là (viết thường)","answer":"palette","explain":"Palette là thanh màu nhanh phía dưới vùng vẽ, bấm để chọn màu tô hoặc màu viền.","points":0.5},{"type":"short","level":"VDC","q":"Một ảnh JPEG chụp phong cảnh muốn in khổ lớn sắc nét thì cần có đặc điểm gì về độ phân giải? (điền: cao / thấp)","answer":"cao","explain":"Ảnh raster in khổ lớn cần độ phân giải cao (nhiều pixel, DPI lớn); ngược lại vector không phụ thuộc điều này.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"File ảnh JPEG thường thuộc loại đồ họa nào?","options":["A. Vector","B. Raster","C. Đồ họa 3D","D. Văn bản"],"answer":"B","explain":"JPEG là định dạng ảnh raster phổ biến, lưu dưới dạng lưới điểm ảnh.","points":0.25},{"type":"mcq","level":"NB","q":"Khi cài đặt Inkscape, người dùng cần","options":["A. Tải bộ cài từ trang chủ inkscape.org và làm theo hướng dẫn","B. Mua đĩa CD duy nhất","C. Đăng ký thẻ tín dụng","D. Có máy in mới cài được"],"answer":"A","explain":"Inkscape miễn phí, chỉ cần tải bộ cài từ trang chủ và cài đặt theo hướng dẫn.","points":0.25},{"type":"mcq","level":"TH","q":"Trong thiết kế đồ họa, 'độ phân giải' của ảnh raster càng cao thì","options":["A. Ảnh càng sắc nét nhưng dung lượng càng lớn","B. Ảnh càng mờ","C. File càng nhẹ","D. Màu sắc càng ít"],"answer":"A","explain":"Độ phân giải cao nghĩa là nhiều pixel hơn: ảnh chi tiết hơn nhưng file nặng hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Một ưu điểm của phần mềm mã nguồn mở như Inkscape đối với học sinh là","options":["A. Miễn phí, được cộng đồng hỗ trợ, sử dụng hợp pháp","B. Chạy nhanh hơn mọi phần mềm trả phí","C. Không bao giờ gặp lỗi","D. Tự động vẽ hộ người dùng"],"answer":"A","explain":"Phần mềm mã nguồn mở miễn phí và hợp pháp, phù hợp cho học tập; vẫn có thể gặp lỗi như phần mềm khác.","points":0.25},{"type":"mcq","level":"VD","q":"Khi xuất PNG từ Inkscape, việc chọn vùng xuất (Page, Drawing, Selection) giúp","options":["A. Quyết định phần nào của bản vẽ được xuất thành ảnh","B. Đổi màu toàn bộ bản vẽ","C. Tăng tốc máy tính","D. Tự động gửi email bản vẽ"],"answer":"A","explain":"Tùy chọn vùng xuất cho phép xuất cả trang, cả bản vẽ hoặc chỉ vùng đang chọn.","points":0.25},{"type":"mcq","level":"VDC","q":"Ảnh dùng cho web thường chỉ cần 72–96 DPI, ảnh in offset cần khoảng 300 DPI. Giải thích hợp lí là","options":["A. Màn hình hiển thị ở mật độ điểm ảnh thấp, còn in ấn cần mật độ cao mới sắc nét","B. Web không cần ảnh đẹp","C. Máy in không đọc được DPI thấp","D. DPI cao làm web tải nhanh hơn"],"answer":"A","explain":"Màn hình hiển thị khoảng 72–96 PPI nên ảnh web không cần DPI cao; in ấn cần 300 DPI để bản in sắc nét.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về cài đặt và sử dụng.","statements":["Inkscape có phiên bản miễn phí cho học sinh sử dụng học tập.","Cần kết nối Internet liên tục mới vẽ được trong Inkscape.","Có thể cài Inkscape trên nhiều hệ điều hành khác nhau.","Inkscape hỗ trợ giao diện tiếng Việt."],"answer":["T","F","T","T"],"explain":"Inkscape vẽ offline, đa nền tảng, miễn phí và có bản dịch tiếng Việt.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về độ phân giải và in ấn.","statements":["Ảnh dùng cho web thường chỉ cần 72–96 DPI.","Ảnh in offset chất lượng cao thường cần khoảng 300 DPI.","Tăng DPI khi xuất PNG làm file ảnh nặng hơn.","Đồ họa vector khi in không phụ thuộc vào DPI của file gốc."],"answer":["T","T","T","T"],"explain":"DPI cao cho bản in sắc nét nhưng file nặng; vector in ở mọi DPI đều sắc nét vì vẽ lại từ công thức.","points":1},{"type":"short","level":"NB","q":"Phần mềm Paint của Windows chủ yếu làm việc với loại đồ họa nào? (raster hay vector, viết thường)","answer":"raster","explain":"Paint là phần mềm vẽ ảnh raster (bitmap) đơn giản có sẵn trên Windows.","points":0.5},{"type":"short","level":"VDC","q":"Để hoàn tác thao tác vừa làm sai trong Inkscape, nhấn tổ hợp phím nào?","answer":"Ctrl+Z","explain":"Ctrl+Z hoàn tác thao tác vừa thực hiện; Ctrl+Shift+Z hoặc Ctrl+Y làm lại.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Thao tác vẽ hình trong Inkscape luôn bắt đầu bằng việc","options":["A. Chọn công cụ vẽ phù hợp trên thanh công cụ","B. Tắt máy tính","C. Mở trình duyệt web","D. In trang giấy"],"answer":"A","explain":"Muốn vẽ hình gì thì chọn đúng công cụ đó trên thanh công cụ rồi thao tác trên vùng vẽ.","points":0.25},{"type":"mcq","level":"NB","q":"Để tạo tài liệu vẽ mới hoàn toàn trong Inkscape, ta chọn","options":["A. File → New","B. File → Open","C. Edit → Paste","D. View → Zoom"],"answer":"A","explain":"File → New (Ctrl+N) tạo tài liệu mới; File → Open mở file đã có.","points":0.25},{"type":"mcq","level":"TH","q":"Khi làm việc với bản vẽ có nhiều đối tượng, việc đặt tên và sắp xếp chúng giúp","options":["A. Dễ quản lý, tìm và chỉnh sửa","B. Tăng dung lượng file","C. Làm máy chạy nhanh hơn","D. Tự động đổi màu"],"answer":"A","explain":"Quản lý đối tượng gọn gàng giúp tìm và sửa nhanh, đặc biệt với bản vẽ phức tạp.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao file SVG có thể mở bằng trình duyệt web?","options":["A. Vì SVG là chuẩn mở dựa trên XML, trình duyệt hỗ trợ hiển thị","B. Vì trình duyệt nào cũng cài sẵn Inkscape","C. Vì SVG là file video","D. Vì trình duyệt tự vẽ lại hình"],"answer":"A","explain":"SVG là chuẩn mở dạng văn bản XML mô tả đồ họa vector nên trình duyệt hiển thị trực tiếp được.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn cần in poster từ bản vẽ Inkscape nhưng máy in ở quán chỉ nhận file ảnh. Bạn nên","options":["A. Xuất PNG với DPI cao (ví dụ 300) rồi mang file ảnh đi in","B. Mang file .svg đến và yêu cầu quán cài Inkscape","C. Chụp màn hình bản vẽ bằng điện thoại","D. In trực tiếp từ chế độ xem thu nhỏ"],"answer":"A","explain":"Xuất PNG 300 DPI cho bản in sắc nét; giữ file SVG gốc để chỉnh sửa khi cần.","points":0.25},{"type":"mcq","level":"VDC","q":"Một bạn thiết kế thiệp bằng Inkscape, xuất PNG gửi nhà in thì bị báo ảnh mờ. Nguyên nhân có thể và cách khắc phục là","options":["A. Xuất ở DPI thấp; xuất lại với DPI cao hơn (ví dụ 300)","B. Do dùng Inkscape nên phải vẽ lại bằng Paint","C. Do file SVG quá nhẹ","D. Do chưa tắt máy tính"],"answer":"A","explain":"Ảnh mờ khi in thường do DPI thấp; xuất lại PNG với DPI cao hơn sẽ cho bản in sắc nét.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về thói quen làm việc tốt.","statements":["Nên lưu file thường xuyên trong quá trình vẽ để tránh mất dữ liệu.","Đặt tên file gợi nhớ giúp dễ tìm lại bài làm.","Vẽ xong nên xuất thêm bản PNG để xem nhanh trên điện thoại.","Chỉ cần lưu file SVG là đủ cho mọi mục đích sử dụng."],"answer":["T","T","T","F"],"explain":"Nên giữ file SVG gốc và xuất thêm PNG/PDF tùy mục đích chia sẻ, in ấn.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau khi so sánh phần mềm.","statements":["Cả Inkscape và Adobe Illustrator đều là phần mềm đồ họa vector.","GIMP là phần mềm chỉnh sửa ảnh raster miễn phí.","Muốn vẽ logo sắc nét mọi kích cỡ thì Inkscape phù hợp hơn Paint.","Phần mềm trả phí luôn cho bản vẽ đẹp hơn phần mềm miễn phí."],"answer":["T","T","T","F"],"explain":"Chất lượng bản vẽ phụ thuộc kĩ năng người thiết kế chứ không phụ thuộc giá tiền phần mềm.","points":1},{"type":"short","level":"NB","q":"Tổ hợp phím tắt để tạo file mới trong Inkscape là","answer":"Ctrl+N","explain":"Ctrl+N (New) tạo tài liệu vẽ mới trong Inkscape.","points":0.5},{"type":"short","level":"VDC","q":"Trong Inkscape, để mở hộp thoại thiết lập trang giấy (kích thước, đơn vị), tổ hợp phím tắt là","answer":"Ctrl+Shift+D","explain":"Ctrl+Shift+D mở Document Properties để thiết lập kích thước trang, đơn vị đo, hướng giấy.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Đồ họa máy tính được chia thành hai loại chính là","options":["A. Đồ họa raster và đồ họa vector","B. Đồ họa 2D và đồ họa 4D","C. Đồ họa màu và đồ họa đen trắng","D. Đồ họa tĩnh và đồ họa động"],"answer":"A","explain":"Hai loại đồ họa cơ bản là raster (điểm ảnh) và vector (đối tượng hình học).","points":0.25},{"type":"mcq","level":"NB","q":"Phần mềm nào sau đây KHÔNG phải phần mềm đồ họa?","options":["A. Inkscape","B. Photoshop","C. CorelDRAW","D. Unikey"],"answer":"D","explain":"Unikey là phần mềm gõ tiếng Việt; ba phần mềm còn lại đều là phần mềm đồ họa.","points":0.25},{"type":"mcq","level":"TH","q":"Khi lưu bản vẽ Inkscape lần đầu, hộp thoại hiện ra yêu cầu","options":["A. Chọn nơi lưu và đặt tên file","B. Nhập mật khẩu ngân hàng","C. Kết nối máy in","D. Tắt máy tính"],"answer":"A","explain":"Lần lưu đầu tiên cần chọn thư mục và đặt tên file; các lần sau Ctrl+S sẽ lưu đè.","points":0.25},{"type":"mcq","level":"TH","q":"Thanh trạng thái trong Inkscape nằm ở vị trí nào?","options":["A. Phía dưới cùng của cửa sổ","B. Phía trên cùng","C. Giữa vùng vẽ","D. Trong menu File"],"answer":"A","explain":"Thanh trạng thái nằm dưới cùng, hiển thị gợi ý thao tác và thông tin đối tượng đang chọn.","points":0.25},{"type":"mcq","level":"VD","q":"Một bạn muốn thiết kế banner cho website lớp. Quy trình hợp lí với Inkscape là","options":["A. Vẽ banner dạng vector rồi xuất PNG đúng kích thước website","B. Chụp ảnh màn hình máy tính làm banner","C. Vẽ banner bằng Word","D. Tải đại một ảnh trên mạng về dùng"],"answer":"A","explain":"Vẽ vector rồi xuất PNG đúng kích thước cho web vừa sắc nét vừa nhẹ, tải nhanh.","points":0.25},{"type":"mcq","level":"VDC","q":"Trường tổ chức cuộc thi thiết kế logo, yêu cầu nộp file gốc để ban tổ chức in nhiều kích cỡ và chỉnh sửa. Bạn nên nộp","options":["A. File SVG gốc kèm bản PNG xem trước","B. Chỉ nộp ảnh chụp màn hình","C. Nộp file Word","D. Nộp link video giới thiệu"],"answer":"A","explain":"File gốc SVG để chỉnh sửa và xuất mọi kích cỡ; kèm PNG để xem nhanh không cần phần mềm.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về đối tượng vector.","statements":["Mỗi đối tượng vector có thể di chuyển độc lập.","Thay đổi kích thước đối tượng vector không làm vỡ hình.","Xóa một đối tượng không ảnh hưởng các đối tượng khác.","Đồ họa vector không thể chứa văn bản."],"answer":["T","T","T","F"],"explain":"Vector gồm các đối tượng độc lập, co giãn không vỡ; Inkscape làm việc tốt với văn bản.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau.","statements":["Cần ảnh nền máy tính chi tiết từ ảnh chụp: nên dùng ảnh raster gốc độ phân giải cao.","Cần icon ứng dụng hiển thị đẹp từ 16px đến 512px: nên dùng vector.","Muốn giảm dung lượng ảnh JPEG mà giữ nguyên kích thước hiển thị: giảm chất lượng nén.","Phóng to ảnh JPEG gấp 20 lần rồi in khổ lớn vẫn sắc nét như vector."],"answer":["T","T","T","F"],"explain":"Icon đa kích cỡ hợp với vector; ảnh raster phóng to quá mức sẽ vỡ, không thể sắc nét như vector.","points":1},{"type":"short","level":"NB","q":"Phần mềm Photoshop của Adobe chủ yếu làm việc với loại đồ họa nào? (raster hay vector, viết thường)","answer":"raster","explain":"Photoshop là phần mềm chỉnh sửa ảnh raster (bitmap) nổi tiếng của Adobe.","points":0.5},{"type":"short","level":"VDC","q":"Để xuất bản vẽ thành ảnh PNG trong Inkscape, tổ hợp phím tắt mở hộp thoại xuất là","answer":"Ctrl+Shift+E","explain":"Ctrl+Shift+E mở hộp thoại Export PNG Image để chọn vùng và độ phân giải xuất.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Biểu tượng của công cụ vẽ trong Inkscape thường gợi nhớ đến","options":["A. Hình dạng chức năng của công cụ đó","B. Các món ăn","C. Con vật ngẫu nhiên","D. Không có biểu tượng nào"],"answer":"A","explain":"Biểu tượng công cụ được thiết kế gợi nhớ chức năng, giúp người dùng đoán và nhớ cách dùng.","points":0.25},{"type":"mcq","level":"NB","q":"Ngôn ngữ giao diện của Inkscape","options":["A. Chỉ có tiếng Anh","B. Có nhiều ngôn ngữ, trong đó có tiếng Việt","C. Chỉ có tiếng Pháp","D. Không hiển thị chữ"],"answer":"B","explain":"Inkscape được cộng đồng dịch ra nhiều ngôn ngữ, có cả tiếng Việt, thuận tiện cho học sinh.","points":0.25},{"type":"mcq","level":"TH","q":"Khi vẽ trong Inkscape, con trỏ chuột biến thành hình dạng khác nhau tùy công cụ đang chọn. Điều này giúp người dùng","options":["A. Biết mình đang dùng công cụ nào","B. Tăng tốc độ máy tính","C. Đổi màu màn hình","D. Tự động lưu file"],"answer":"A","explain":"Hình dạng con trỏ phản ánh công cụ đang hoạt động, giúp tránh nhầm lẫn khi thao tác.","points":0.25},{"type":"mcq","level":"TH","q":"Màu nền trang giấy vẽ trong Inkscape mặc định là","options":["A. Màu trắng","B. Màu đen","C. Màu đỏ","D. Trong suốt"],"answer":"A","explain":"Trang giấy mặc định màu trắng giống giấy vẽ thông thường, có thể đổi trong Document Properties.","points":0.25},{"type":"mcq","level":"VD","q":"Một bạn thiết kế thiệp bằng Inkscape để gửi qua Zalo cho bạn bè. Định dạng xuất phù hợp nhất là","options":["A. PNG (xem được ngay trên điện thoại)","B. SVG gốc","C. File cài đặt Inkscape","D. File Word"],"answer":"A","explain":"PNG xem được ngay trên điện thoại không cần phần mềm chuyên dụng, phù hợp chia sẻ qua Zalo.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn cần vừa giữ bản vẽ để chỉnh sửa lâu dài, vừa có bản để gửi nhà in, vừa có bản xem nhanh trên điện thoại. Cách quản lí file hợp lí là","options":["A. Giữ file SVG gốc, xuất thêm PDF cho nhà in và PNG để xem nhanh","B. Chỉ giữ một file PNG duy nhất","C. Xóa file gốc sau khi xuất","D. In ra giấy rồi chụp lại"],"answer":"A","explain":"SVG gốc để chỉnh sửa, PDF/PNG 300 DPI cho in ấn, PNG nhẹ để xem nhanh: mỗi định dạng phục vụ một mục đích.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về xuất bản sản phẩm.","statements":["Xuất PNG giúp chia sẻ bản vẽ với người không cài Inkscape.","Có thể xuất bản vẽ thành file PDF để in ấn.","File xuất ra (PNG/PDF) vẫn giữ nguyên các đối tượng vector để sửa.","Nên giữ lại file SVG gốc để chỉnh sửa về sau."],"answer":["T","T","F","T"],"explain":"File xuất là thành phẩm không sửa từng đối tượng được; luôn giữ file SVG gốc.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau (tổng hợp).","statements":["Đồ họa vector phù hợp cho logo, biểu tượng, sơ đồ, chữ nghệ thuật.","Đồ họa raster phù hợp cho ảnh chụp, tranh vẽ chi tiết màu sắc phức tạp.","Một sản phẩm thiết kế có thể kết hợp cả đối tượng vector và ảnh raster.","Inkscape là lựa chọn duy nhất để làm đồ họa vector."],"answer":["T","T","T","F"],"explain":"Mỗi loại đồ họa có thế mạnh riêng và có thể kết hợp; ngoài Inkscape còn Illustrator, CorelDRAW...","points":1},{"type":"short","level":"NB","q":"Đuôi mở rộng của file ảnh vector gốc Inkscape là (gồm dấu chấm, viết thường)","answer":".svg","explain":"File gốc của Inkscape có đuôi .svg, là chuẩn mở của đồ họa vector.","points":0.5},{"type":"short","level":"VDC","q":"Để đóng phần mềm Inkscape, tổ hợp phím tắt là","answer":"Ctrl+Q","explain":"Ctrl+Q thoát Inkscape; nhớ lưu file trước khi đóng để không mất dữ liệu.","points":0.5}]}]}
