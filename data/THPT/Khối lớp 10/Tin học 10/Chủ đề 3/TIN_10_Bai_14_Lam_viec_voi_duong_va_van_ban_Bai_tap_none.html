 sửa đường cong bị gãy chuyên nghiệp.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về công cụ Bézier.","statements":["Bézier vẽ được cả đường thẳng và đường cong.","Bấm chuột đơn tạo nút góc nối bằng đoạn thẳng.","Bấm-kéo chuột tạo nút trơn có tay cầm điều khiển.","Nhấn Esc sẽ kết thúc và giữ lại đường đang vẽ."],"answer":["T","T","T","F"],"explain":"Esc hủy đường đang vẽ; Enter mới kết thúc và giữ lại đường.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về chỉnh sửa nút.","statements":["Công cụ Node (F2) dùng để di chuyển các nút trên đường.","Bấm đúp lên đường sẽ thêm một nút mới.","Chọn nút rồi nhấn Delete sẽ xóa nút đó.","Không thể thay đổi loại nút sau khi đã vẽ."],"answer":["T","T","T","F"],"explain":"Có thể chuyển đổi loại nút (góc/trơn) bất cứ lúc nào bằng công cụ Node.","points":1},{"type":"short","level":"NB","q":"Phím tắt của công cụ vẽ đường Bézier trong Inkscape là","answer":"Shift+F6","explain":"Shift+F6 (hoặc phím B) mở công cụ Bézier vẽ đường thẳng và đường cong.","points":0.5},{"type":"short","level":"VDC","q":"Để chuyển một đối tượng (ví dụ hình chữ nhật) thành đường để chỉnh sửa từng nút, tổ hợp phím tắt là","answer":"Ctrl+Shift+C","explain":"Ctrl+Shift+C (Path → Object to Path) chuyển đối tượng thành đường, cho phép chỉnh từng nút.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Công cụ văn bản (Text) trong Inkscape có phím tắt là","options":["A. F8","B. F4","C. F2","D. F6"],"answer":"A","explain":"F8 (hoặc T) là công cụ văn bản; bấm lên vùng vẽ rồi gõ chữ.","points":0.25},{"type":"mcq","level":"NB","q":"Đường trong Inkscape được cấu tạo từ các thành phần cơ bản nào?","options":["A. Các nút (node) nối với nhau bằng đoạn thẳng hoặc cong","B. Các điểm ảnh","C. Các khung hình","D. Các lớp màu"],"answer":"A","explain":"Đường (path) gồm các nút nối nhau; mỗi nút có thể là nút góc hoặc nút trơn.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn thêm một c phát biểu sau về chuyển đối tượng thành đường.","statements":["Ctrl+Shift+C chuyển đối tượng thành đường (path).","Sau khi chuyển, có thể chỉnh sửa từng nút của đối tượng.","Chữ sau khi chuyển thành đường vẫn gõ sửa nội dung được.","Chuyển chữ thành đường giúp file hiển thị đúng khi máy khác thiếu font."],"answer":["T","T","F","T"],"explain":"Chữ đã chuyển thành đường không còn là văn bản nên không gõ sửa được; bù lại không phụ thuộc font.","points":1},{"type":"short","level":"NB","q":"Phím tắt của công cụ chỉnh sửa nút (Node) trong Inkscape là (chỉ ghi phím)","answer":"F2","explain":"F2 mở công cụ Node để chọn, di chuyển, thêm, xóa nút trên đường.","points":0.5},{"type":"short","level":"VDC","q":"Lệnh đặt văn bản chạy dọc theo một đường cong trong menu Text có tên tiếng Anh là (viết đúng: Put on Path)","answer":"Put on Path","explain":"Text → Put on Path: chọn cả văn bản và đường rồi thực hiện, chữ sẽ bám theo đường.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Nút trơn (smooth node) trên đường Bézier có đặc điểm là","options":["A. Có tay cầm điều khiển độ cong, tạo đoạn cong mượt","B. Chỉ nối bằng đoạn thẳng","C. Không thể di chuyển","D. Tự động biến mất"],"answer":"A","explain":"Nút trơn có tay cầm hai phía giúp uốn cong mượt; nút góc nối thẳng, tạo góc nhọn.","points":0.25},{"type":"mcq","level":"NB","q":"Để hủy bỏ đường Bézier đang vẽ dở, ta nhấn phím","options":["A. Esc","B. Enter","C. Shift","D. Ctrl"],"answer":"A","explain":"Esc hủy đường đang vẽ; Enter kết thúc và giữ lại đường.","points":0.25},{"type":"mcq","level":"TH","q":"Khi dùng công cụ Node, kéo tay cầm điều khiển của nút trơn sẽ","options":["A. Thay đổi độ cong của đoạn đường tại nút đó","B. Xóa nút","C. Đổi màu đường","D. Nhân bản nút"],"answer":"A","explain":"Tay cầm điều khiển hướng và độ cong của đoạn đường đi qua nút trơn.","points":0.25},{"type":"mcq","level":"TH","q":"Phép toán đường Union (hợp) trong Inkscape dùng để","options":["A. Gộp nhiều đối tượng chồng lấp thành một hình duy nhất","B. Tách đối tượng thành nhiều phần","C. Xóa đối tượng","D. Đổi màu đối tượng"],"answer":"A","explain":"Union gộp các hình chồng lấp thành một đường duy nhất; Difference trừ, Intersection lấy phần giao.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn muốn tạo hình mặt trăng khuyết từ hai hình tròn chồng lấp. Cách làm là","options":["A. Đặt hai hình tròn chồng nhau rồi dùng Path → Difference để trừ","B. Vẽ hình tròn rồi xóa một nửa bằng tay","C. Dùng công cụ văn bản","D. Tô màu đen một nửa hình tròn"],"answer":"A","explain":"Difference trừ hình trên khỏi hình dưới, tạo hình khuyết chính xác.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn vẽ chiếc lá bằng hai đường cong nhưng mép lá chưa khít nhau tạo khe hở. Cách sửa tốt nhất là","options":["A. Dùng công cụ Node kéo các nút đầu mút khít vào nhau rồi nối lại","B. Tô màu đậm để che khe hở","C. Vẽ thêm đường khác đè lên","D. Xóa vẽ lại từ đầu"],"answer":"A","explain":"Chỉnh nút để khép kín đường là cách sửa triệt để; che bằng màu chỉ là tạm bợ.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về nút trên đường.","statements":["Nút góc tạo ra góc nhọn tại vị trí nút.","Nút trơn tạo đoạn cong mượt mà.","Có thể chuyển đổi qua lại giữa nút góc và nút trơn.","Mỗi đường chỉ có đúng hai nút."],"answer":["T","T","T","F"],"explain":"Đường có thể có nhiều nút; loại nút chuyển đổi linh hoạt bằng công cụ Node.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về phép toán đường.","statements":["Union gộp nhiều hình chồng lấp thành một.","Difference trừ hình trên khỏi hình dưới.","Intersection giữ lại phần giao nhau của các hình.","Các phép toán đường áp dụng được cho văn bản chưa chuyển thành đường."],"answer":["T","T","T","F"],"explain":"Phép toán đường chỉ làm việc với đối tượng dạng đường (path); văn bản cần chuyển thành đường trước.","points":1},{"type":"short","level":"NB","q":"Phím tắt của công cụ văn bản (Text) trong Inkscape là (chỉ ghi phím)","answer":"F8","explain":"F8 (hoặc T) là công cụ Text; bấm lên vùng vẽ rồi gõ nội dung.","points":0.5},{"type":"short","level":"VDC","q":"Phép toán đường nào dùng để gộp nhiều hình chồng lấp thành một hình duy nhất? (viết thường, tiếng Anh)","answer":"union","explain":"Union (hợp) gộp các hình; Difference (trừ), Intersection (giao) là các phép toán khác.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Văn bản sau khi được gõ trong Inkscape thì","options":["A. Là một đối tượng có thể di chuyển, tô màu, thay đổi như các đối tượng khác","B. Bị dính chặt không di chuyển được","C. Tự động biến mất khi lưu","D. Không thể chọn"],"answer":"A","explain":"Văn bản là đối tượng độc lập: di chuyển, co giãn, tô màu Fill/Stroke như hình vẽ.","points":0.25},{"type":"mcq","level":"NB","q":"Trên thanh thuộc tính của công cụ Text, ta có thể chỉnh","options":["A. Font chữ, cỡ chữ, kiểu chữ (đậm, nghiêng)","B. Độ phân giải màn hình","C. Tốc độ mạng","D. Dung lượng RAM"],"answer":"A","explain":"Thanh thuộc tính của Text cho phép chọn font, cỡ, kiểu đậm/nghiêng/gạch chân, căn lề.","points":0.25},{"type":"mcq","level":"TH","q":"Để xóa một nút trên đường mà vẫn giữ đường liền mạch, ta","options":["A. Chọn nút bằng công cụ Node rồi nhấn Delete","B. Xóa cả đường vẽ lại","C. Đổi màu nút","D. Không thể xóa nút"],"answer":"A","explain":"Xóa nút bằng Delete khi đang chọn bằng công cụ Node; đường sẽ nối lại qua các nút còn lại.","points":0.25},{"type":"mcq","level":"TH","q":"Khi chuyển văn bản thành đường (Object to Path), điều gì xảy ra?","options":["A. Chữ thành hình vector, không gõ sửa nội dung được nữa nhưng hiển thị đúng mọi máy","B. Chữ biến mất","C. Chữ thành ảnh raster","D. Không có gì thay đổi"],"answer":"A","explain":"Chữ thành đường nét vector: mất khả năng soạn thảo nhưng không còn phụ thuộc font chữ.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn cần làm con dấu tròn có chữ chạy vòng quanh. Các bước đúng là","options":["A. Vẽ đường tròn, gõ chữ, chọn cả hai rồi Text → Put on Path","B. Gõ chữ thẳng rồi bẻ cong bằng tay","C. Viết chữ ra giấy rồi chụp ảnh","D. Dùng WordArt của Word"],"answer":"A","explain":"Put on Path đặt chữ bám theo đường tròn, tạo con dấu, logo tròn chuyên nghiệp.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn vẽ đường viền trang trí nhưng nét vẽ bị răng cưa ở chỗ cong. Nguyên nhân và cách khắc phục là","options":["A. Các nút ở chỗ cong là nút góc; chuyển thành nút trơn và chỉnh tay cầm","B. Do màn hình bị hỏng","C. Do chưa lưu file","D. Do dùng sai màu"],"answer":"A","explain":"Nút góc tạo góc nhọn gây cảm giác gãy khúc; chuyển sang nút trơn cho đường cong mượt.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về đường Bézier.","statements":["Đường Bézier gồm các nút nối với nhau.","Đoạn nối hai nút góc là đoạn thẳng.","Đoạn qua nút trơn là đường cong mượt.","Đường Bézier không thể khép kín thành hình."],"answer":["T","T","T","F"],"explain":"Đường Bézier có thể khép kín (nối nút cuối với nút đầu) để tạo hình kín tô màu được.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về văn bản trên đường.","statements":["Cần có sẵn một đường dẫn trước khi đặt chữ lên.","Chữ sẽ chạy dọc theo hình dạng của đường dẫn.","Sau khi Put on Path vẫn có thể chỉnh sửa nội dung chữ.","Đường dẫn sau khi đặt chữ lên sẽ tự động bị xóa."],"answer":["T","T","T","F"],"explain":"Đường dẫn vẫn tồn tại (có thể ẩn viền); chữ vẫn gõ sửa được sau khi đặt lên đường.","points":1},{"type":"short","level":"NB","q":"Để kết thúc việc vẽ đường Bézier và giữ lại đường đã vẽ, nhấn phím nào? (ghi tên phím, viết hoa chữ E)","answer":"Enter","explain":"Enter kết thúc và giữ đường; Esc hủy bỏ đường đang vẽ.","points":0.5},{"type":"short","level":"VDC","q":"Phép toán đường nào giữ lại phần giao nhau của các hình chồng lấp? (viết thường, tiếng Anh)","answer":"intersection","explain":"Intersection (giao) giữ phần chung; Union gộp, Difference trừ.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Lệnh chuyển đối tượng thành đường (Object to Path) nằm trong menu","options":["A. Path","B. File","C. View","D. Help"],"answer":"A","explain":"Path → Object to Path (Ctrl+Shift+C) chuyển đối tượng/hình/chữ thành đường để chỉnh nút.","points":0.25},{"type":"mcq","level":"NB","q":"Tay cầm điều khiển (control handle) của nút trơn dùng để","options":["A. Điều chỉnh hướng và độ cong của đoạn đường","B. Xóa nút","C. Đổi màu đường","D. Nhân bản nút"],"answer":"A","explain":"Kéo tay cầm để uốn cong đoạn đường theo ý muốn; tay cầm càng dài, cong càng mạnh.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn vẽ một đường thẳng đứng hoàn toàn bằng công cụ Bézier, ta nên","options":["A. Giữ Ctrl khi bấm điểm thứ hai để khóa theo phương thẳng đứng","B. Bấm bừa hai điểm","C. Vẽ cong rồi nắn thẳng","D. Dùng công cụ văn bản"],"answer":"A","explain":"Giữ Ctrl khi vẽ Bézier khóa hướng theo các góc chuẩn (ngang, dọc, chéo 45 độ).","points":0.25},{"type":"mcq","level":"TH","q":"Sau khi dùng Text → Put on Path, nếu muốn chữ thẳng lại như cũ thì","options":["A. Tách văn bản khỏi đường (Text → Remove from Path)","B. Xóa chữ gõ lại","C. Không thể hoàn tác","D. Tắt phần mềm"],"answer":"A","explain":"Text → Remove from Path tách chữ khỏi đường, chữ trở lại dạng thẳng bình thường.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ trái tim bằng hai đường cong nhưng hai nửa không đối xứng. Cách sửa là","options":["A. Dùng công cụ Node chỉnh tay cầm hai bên đối xứng nhau","B. Vẽ thêm trái tim khác đè lên","C. Đổi màu trái tim","D. Xoay trái tim"],"answer":"A","explain":"Chỉnh tay cầm đối xứng hai bên cho đường cong cân đối; có thể dùng lưới hoặc đường gióng hỗ trợ.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn thiết kế thiệp cưới cần chữ nghệ thuật uốn lượn mà nhà in không có font chữ đó. Quy trình an toàn nhất là","options":["A. Thiết kế chữ trên đường cong rồi chuyển toàn bộ thành đường trước khi gửi file","B. Gửi file kèm lời nhắn 'máy anh thiếu font kệ anh'","C. Chụp màn hình chữ gửi đi","D. Bỏ chữ khỏi thiệp"],"answer":"A","explain":"Chữ trên đường cong + chuyển thành đường: vừa giữ hiệu ứng nghệ thuật vừa hiển thị đúng mọi máy.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về vẽ đường.","statements":["Giữ Ctrl khi vẽ Bézier khóa hướng theo phương chuẩn.","Đường vẽ xong có thể tô màu viền (Stroke).","Đường khép kín có thể tô màu nền (Fill).","Mọi đường vẽ đều tự động khép kín."],"answer":["T","T","T","F"],"explain":"Đường hở không khép kín thì chỉ có viền, không tô nền được; đường kín mới tô Fill được.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về ứng dụng đường cong.","statements":["Vẽ logo, biểu tượng thường dùng đường Bézier.","Vẽ đường viền trang trí uốn lượn dùng nút trơn.","Chữ nghệ thuật có thể tạo bằng văn bản trên đường cong.","Đường Bézier chỉ dùng để vẽ đường thẳng."],"answer":["T","T","T","F"],"explain":"Bézier là công cụ vẽ đường cong chủ lực trong thiết kế vector.","points":1},{"type":"short","level":"NB","q":"Lệnh chuyển đối tượng thành đường nằm trong menu nào? (viết hoa chữ P)","answer":"Path","explain":"Menu Path chứa các lệnh về đường: Object to Path, Union, Difference, Intersection...","points":0.5},{"type":"short","level":"VDC","q":"Phép toán đường nào trừ hình nằm trên khỏi hình nằm dưới? (viết thường, tiếng Anh)","answer":"difference","explain":"Difference (hiệu) trừ phần chồng lấp; dùng tạo hình khuyết như mặt trăng khuyết.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Đường (path) trong Inkscape là","options":["A. Đối tượng gồm các nút nối với nhau bằng đoạn thẳng hoặc cong","B. Một loại virus","C. Đường truyền mạng","D. Thư mục chứa file"],"answer":"A","explain":"Path là đối tượng vector cơ bản gồm các nút (node) nối nhau; mọi hình đều có thể chuyển thành path.","points":0.25},{"type":"mcq","level":"NB","q":"Để di chuyển một nút trên đường sang vị trí khác, ta","options":["A. Dùng công cụ Node (F2) bấm vào nút rồi kéo","B. Dùng công cụ văn bản","C. Nhấn phím Delete","D. Không thể di chuyển nút"],"answer":"A","explain":"Công cụ Node cho phép kéo từng nút để thay đổi hình dạng đường.","points":0.25},{"type":"mcq","level":"TH","q":"Sự khác nhau giữa nút góc và nút trơn là","options":["A. Nút góc tạo góc nhọn, nút trơn tạo cong mượt có tay cầm","B. Không có gì khác nhau","C. Nút góc to hơn nút trơn","D. Nút trơn không di chuyển được"],"answer":"A","explain":"Nút góc nối thẳng tạo góc; nút trơn có tay cầm điều khiển tạo cong mượt.","points":0.25},{"type":"mcq","level":"TH","q":"Văn bản trong Inkscape sau khi gõ thì","options":["A. Có thể tô màu Fill và viền Stroke như đối tượng thường","B. Không thể tô màu","C. Tự động biến thành ảnh","D. Không thể di chuyển"],"answer":"A","explain":"Văn bản là đối tượng vector: tô màu, viền, co giãn, xoay đều được.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn muốn tạo chữ 'CHÚC MỪNG' cong theo hình vòng cung trên thiệp. Thao tác nào KHÔNG cần thiết?","options":["A. Chuyển chữ thành ảnh raster trước","B. Vẽ đường cong làm đường dẫn","C. Gõ văn bản","D. Dùng Text → Put on Path"],"answer":"A","explain":"Không cần chuyển raster; chỉ cần đường dẫn + văn bản + Put on Path.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn vẽ biểu tượng đám mây bằng đường cong nhưng chỗ nối đầu-cuối bị hở khiến không tô màu nền được. Cách sửa là","options":["A. Dùng công cụ Node chọn hai nút đầu mút rồi nối khép kín đường","B. Tô màu đậm che chỗ hở","C. Vẽ thêm nét đè lên chỗ hở","D. Bỏ tô màu nền"],"answer":"A","explain":"Đường phải khép kín mới tô Fill được; nối hai nút đầu mút để khép kín là cách sửa đúng.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về phím tắt đường và văn bản.","statements":["Shift+F6 là công cụ Bézier.","F2 là công cụ chỉnh nút.","F8 là công cụ văn bản.","Ctrl+Shift+C chuyển đối tượng thành đường."],"answer":["T","T","T","T"],"explain":"Đây là bốn phím tắt quan trọng của bài: vẽ đường, chỉnh nút, văn bản, chuyển thành đường.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về xử lí chữ nghệ thuật.","statements":["Chữ nghệ thuật nên chuyển thành đường trước khi gửi nhà in.","Chữ đã chuyển thành đường không còn gõ sửa được.","Chuyển chữ thành đường làm tăng dung lượng file chút ít.","Không bao giờ nên chuyển chữ thành đường."],"answer":["T","T","T","F"],"explain":"Nên chuyển chữ thành đường khi gửi in để tránh lỗi font; chỉ không sửa nội dung được nữa.","points":1},{"type":"short","level":"NB","q":"Thành phần nhỏ nhất cấu tạo nên đường (path), tiếng Anh là (viết thường)","answer":"node","explain":"Node (nút) là điểm nối trên đường; đường gồm các node nối bằng đoạn thẳng hoặc cong.","points":0.5},{"type":"short","level":"VDC","q":"Để thêm một nút mới vào đường đã vẽ, với công cụ Node ta thực hiện thao tác nào lên đường? (điền: bấm đúp)","answer":"bấm đúp","explain":"Bấm đúp lên đường bằng công cụ Node sẽ chèn thêm nút tại vị trí đó.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Khi bấm chuột đơn (không kéo) bằng công cụ Bézier, ta tạo ra","options":["A. Nút góc nối với nút trước bằng đoạn thẳng","B. Nút trơn","C. Hình tròn","D. Đoạn văn bản"],"answer":"A","explain":"Bấm đơn tạo nút góc (corner) nối thẳng; bấm-kéo tạo nút trơn (smooth) cong mượt.","points":0.25},{"type":"mcq","level":"NB","q":"Để chọn nhiều nút cùng lúc trên một đường, ta","options":["A. Dùng công cụ Node kéo khung bao quanh các nút","B. Dùng công cụ văn bản","C. Nhấn phím F4","D. Không thể chọn nhiều nút"],"answer":"A","explain":"Kéo khung bằng công cụ Node để chọn nhiều nút rồi di chuyển, xóa đồng loạt.","points":0.25},{"type":"mcq","level":"TH","q":"Đường hở (chưa khép kín) thì","options":["A. Chỉ có viền (Stroke), không tô được màu nền (Fill)","B. Vẫn tô được màu nền bình thường","C. Tự động biến mất","D. Không vẽ được"],"answer":"A","explain":"Chỉ đường khép kín mới có vùng trong để tô Fill; đường hở chỉ hiển thị viền.","points":0.25},{"type":"mcq","level":"TH","q":"Muốn đường cong thêm mượt mà, chi tiết hơn, ta có thể","options":["A. Thêm nút và chỉnh tay cầm cẩn thận","B. Xóa bớt nút","C. Đổi màu đường","D. Phóng to màn hình"],"answer":"A","explain":"Nhiều nút đặt hợp lí + tay cầm chỉnh tốt cho đường cong mượt và chi tiết.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn cần vẽ đường diềm trang trí lượn sóng đều nhau dài khắp thiệp. Cách hiệu quả là","options":["A. Vẽ một đoạn sóng mẫu bằng nút trơn rồi nhân bản nối tiếp nhau","B. Vẽ tự do cả đường dài","C. Vẽ đường thẳng","D. Dùng công cụ tô màu"],"answer":"A","explain":"Vẽ mẫu một đoạn sóng chuẩn rồi nhân bản ghép nối cho sóng đều nhau.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn thiết kế icon chiếc lá: vẽ nửa lá rồi muốn nửa còn lại đối xứng hoàn hảo. Cách tốt nhất là","options":["A. Vẽ nửa lá, nhân bản rồi lật ngang (flip) và ghép khít","B. Vẽ nửa còn lại bằng tay","C. Vẽ cả lá một lần","D. Dùng ảnh lá thật"],"answer":"A","explain":"Nhân bản + lật ngang cho đối xứng tuyệt đối, nhanh và chính xác hơn vẽ tay.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về đường khép kín và đường hở.","statements":["Đường khép kín nối nút cuối với nút đầu.","Đường khép kín tô được màu nền (Fill).","Đường hở chỉ hiển thị đường viền (Stroke).","Đường hở không bao giờ dùng được."],"answer":["T","T","T","F"],"explain":"Đường hở vẫn hữu ích để vẽ đường viền, đường trang trí, chữ trên đường cong.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về kĩ thuật vẽ logo.","statements":["Logo thường được vẽ bằng đường Bézier để có nét cong chuẩn.","Chữ trong logo nên chuyển thành đường trước khi gửi in.","Nên giữ bản logo chưa chuyển chữ để sửa nội dung sau này.","Gửi logo cho khách hàng nên gửi file SVG gốc duy nhất."],"answer":["T","T","T","F"],"explain":"Nên giữ bản gốc sửa được và xuất thêm PNG/PDF cho khách xem; không chỉ gửi SVG.","points":1},{"type":"short","level":"NB","q":"Để hủy bỏ đường Bézier đang vẽ dở, nhấn phím nào? (ghi tên phím, viết hoa chữ E)","answer":"Esc","explain":"Esc hủy đường đang vẽ; Enter kết thúc và giữ lại đường.","points":0.5},{"type":"short","level":"VDC","q":"Thao tác bấm chuột rồi kéo khi vẽ Bézier sẽ tạo ra loại nút nào? (điền: nút trơn / nút góc)","answer":"nút trơn","explain":"Bấm-kéo tạo nút trơn (smooth) có tay cầm; bấm đơn tạo nút góc.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Văn bản đặt trên đường cong (Put on Path) thì","options":["A. Các kí tự chạy dọc theo hình dạng đường cong","B. Biến thành đường thẳng","C. Biến mất","D. Thành ảnh raster"],"answer":"A","explain":"Put on Path xếp các kí tự bám theo đường dẫn: cong, tròn, lượn sóng tùy đường.","points":0.25},{"type":"mcq","level":"NB","q":"Sau khi Put on Path, đường dẫn gốc","options":["A. Vẫn tồn tại, có thể ẩn viền của nó đi","B. Tự động bị xóa","C. Biến thành văn bản","D. Không thể chọn lại"],"answer":"A","explain":"Đường dẫn vẫn còn; thường ẩn viền (stroke none) để chỉ còn chữ cong.","points":0.25},{"type":"mcq","level":"TH","q":"Để tách văn bản ra khỏi đường cong, trở về dạng chữ thẳng, ta dùng","options":["A. Text → Remove from Path","B. File → Close","C. Edit → Undo","D. Nhấn Delete"],"answer":"A","explain":"Text → Remove from Path tách chữ khỏi đường; chữ trở lại thẳng hàng bình thường.","points":0.25},{"type":"mcq","level":"TH","q":"Khi tăng số nút trên một đoạn cong, đường cong sẽ","options":["A. Dễ điều chỉnh chi tiết hơn nhưng khó mượt mà nếu đặt nút bừa bãi","B. Luôn mượt hơn","C. Bị xóa","D. Không thay đổi gì"],"answer":"A","explain":"Nút đặt đúng chỗ giúp chi tiết; quá nhiều nút bừa bãi làm đường gãy khúc khó mượt.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn làm banner có dòng chữ khẩu hiệu uốn lượn theo đường sóng. Sau khi Put on Path, chữ bị ngược. Nguyên nhân có thể là","options":["A. Hướng vẽ của đường dẫn bị ngược, cần đảo hướng đường","B. Do chọn sai font","C. Do chưa lưu file","D. Do màn hình hỏng"],"answer":"A","explain":"Chữ chạy theo hướng của đường dẫn; đường vẽ ngược hướng thì chữ bị ngược, cần đảo hướng path.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn cần tạo chữ kí số (signature) mô phỏng chữ kí tay để đóng lên văn bằng. Công cụ phù hợp nhất là","options":["A. Công cụ Bézier vẽ nét chữ kí rồi chỉnh nút cho mượt","B. Công cụ vẽ hình chữ nhật","C. Công cụ tô màu","D. Gõ văn bản thường"],"answer":"A","explain":"Bézier vẽ được nét chữ kí tự do, uốn lượn như chữ kí tay; chữ gõ thường không có nét cá nhân.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về văn bản.","statements":["Có thể thay đổi font, cỡ, kiểu chữ sau khi gõ.","Có thể co giãn, xoay khối văn bản như đối tượng thường.","Văn bản có thể đặt chạy theo đường cong.","Văn bản trong Inkscape mặc định là ảnh raster."],"answer":["T","T","T","F"],"explain":"Văn bản là đối tượng vector, chỉnh sửa linh hoạt như các đối tượng khác.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về thiết kế chữ.","statements":["Chữ cong tạo điểm nhấn nghệ thuật cho thiệp, logo.","Chữ sau khi chuyển thành đường vẫn giữ nguyên hình dạng.","Nên kiểm tra chính tả trước khi chuyển chữ thành đường.","Chữ đã chuyển thành đường vẫn gõ sửa lỗi chính tả được."],"answer":["T","T","T","F"],"explain":"Phải kiểm tra chính tả trước khi chuyển vì sau đó không sửa nội dung được nữa.","points":1},{"type":"short","level":"NB","q":"Lệnh đặt văn bản lên đường cong nằm trong menu nào? (viết hoa chữ T)","answer":"Text","explain":"Menu Text chứa Put on Path, Remove from Path và các lệnh về văn bản.","points":0.5},{"type":"short","level":"VDC","q":"Để tách văn bản khỏi đường cong, lệnh trong menu Text có tên là (viết đúng: Remove from Path)","answer":"Remove from Path","explain":"Text → Remove from Path tách chữ khỏi đường dẫn.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Phép toán đường Difference (trừ) trong Inkscape dùng để","options":["A. Trừ hình nằm trên khỏi hình nằm dưới","B. Gộp hai hình thành một","C. Lấy phần giao nhau","D. Nhân bản hình"],"answer":"A","explain":"Difference trừ phần chồng lấp của hình trên khỏi hình dưới; dùng tạo hình khuyết.","points":0.25},{"type":"mcq","level":"NB","q":"Phép toán đường Intersection (giao) trong Inkscape dùng để","options":["A. Giữ lại phần giao nhau của các hình","B. Gộp hai hình","C. Trừ hai hình","D. Xóa hai hình"],"answer":"A","explain":"Intersection chỉ giữ lại phần chung (giao) của các hình chồng lấp.","points":0.25},{"type":"mcq","level":"TH","q":"Trước khi áp dụng các phép toán đường (Union, Difference, Intersection), các đối tượng cần","options":["A. Được chọn đồng thời (chọn nhiều đối tượng)","B. Được nhóm lại","C. Được chuyển thành ảnh","D. Được xóa"],"answer":"A","explain":"Chọn đồng thời các đối tượng rồi áp dụng phép toán đường trong menu Path.","points":0.25},{"type":"mcq","level":"TH","q":"Kết quả của phép Union là","options":["A. Một đối tượng đường duy nhất gộp từ các hình","B. Nhiều đối tượng rời rạc","C. Một ảnh raster","D. Một đoạn văn bản"],"answer":"A","explain":"Union gộp các hình chồng lấp thành một path duy nhất, gọn nhẹ.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn muốn tạo hình vành khăn (hình tròn có lỗ tròn ở giữa). Cách làm là","options":["A. Vẽ hai hình tròn đồng tâm rồi dùng Difference trừ hình nhỏ khỏi hình lớn","B. Vẽ một hình tròn rồi tô hai màu","C. Vẽ hình chữ nhật","D. Dùng công cụ văn bản"],"answer":"A","explain":"Difference trừ hình tròn nhỏ khỏi hình tròn lớn tạo vành khăn chính xác.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn cần tạo icon 'cấm' (vòng tròn đỏ có gạch chéo). Cách làm gọn nhất bằng phép toán đường là","options":["A. Vẽ vòng tròn (Difference tạo lỗ), vẽ thanh chéo rồi Union gộp thành một","B. Vẽ ba hình rời để nguyên","C. Chụp ảnh biển cấm","D. Vẽ bằng tay tự do"],"answer":"A","explain":"Kết hợp Difference tạo vành tròn và Union gộp thanh chéo thành một đối tượng gọn.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về các phép toán đường.","statements":["Union gộp các hình chồng lấp thành một.","Difference trừ hình trên khỏi hình dưới.","Intersection giữ lại phần giao nhau.","Muốn dùng phép toán đường phải chọn nhiều đối tượng."],"answer":["T","T","T","T"],"explain":"Ba phép toán cơ bản trong menu Path đều yêu cầu chọn đồng thời các đối tượng.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về ứng dụng phép toán đường.","statements":["Tạo hình khuyết (mặt trăng) dùng Difference.","Tạo hình gộp từ nhiều mảnh dùng Union.","Lấy phần chung của hai hình dùng Intersection.","Phép toán đường làm việc tốt với ảnh raster."],"answer":["T","T","T","F"],"explain":"Phép toán đường chỉ áp dụng cho đối tượng vector dạng đường, không áp dụng cho ảnh raster.","points":1},{"type":"short","level":"NB","q":"Tổ hợp phím tắt chuyển đối tượng thành đường (Object to Path) là","answer":"Ctrl+Shift+C","explain":"Ctrl+Shift+C chuyển hình, chữ thành đường để chỉnh sửa từng nút.","points":0.5},{"type":"short","level":"VDC","q":"Muốn gộp hai hình tròn chồng lấp thành một hình duy nhất, dùng phép toán đường nào? (viết thường, tiếng Anh)","answer":"union","explain":"Union gộp các hình chồng lấp thành một path duy nhất.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Công cụ Bézier còn có tên phím tắt đơn là phím","options":["A. B","B. V","C. X","D. Z"],"answer":"A","explain":"Phím B là phím tắt nhanh của công cụ Bézier (tương đương Shift+F6).","points":0.25},{"type":"mcq","level":"NB","q":"Nút trên đường Bézier hiển thị dưới dạng","options":["A. Các điểm vuông/tròn nhỏ trên đường khi dùng công cụ Node","B. Các ngôi sao","C. Các dòng chữ","D. Không hiển thị"],"answer":"A","explain":"Khi dùng công cụ Node (F2), các nút hiện ra dưới dạng điểm nhỏ để chọn và kéo.","points":0.25},{"type":"mcq","level":"TH","q":"Để vẽ một hình khép kín bằng Bézier (ví dụ outline chiếc lá), ta","options":["A. Bấm điểm cuối trùng vào điểm đầu để khép kín đường","B. Vẽ đường hở là đủ","C. Không thể khép kín","D. Dùng công cụ tô màu"],"answer":"A","explain":"Bấm điểm cuối vào điểm đầu để khép kín; đường kín mới tô được màu nền.","points":0.25},{"type":"mcq","level":"TH","q":"Chữ sau khi Put on Path thì","options":["A. Vẫn có thể di chuyển dọc theo đường và chỉnh nội dung","B. Bị khóa cứng không chỉnh được","C. Biến thành ảnh","D. Biến mất"],"answer":"A","explain":"Chữ trên đường vẫn là văn bản: gõ sửa, đổi font, di chuyển dọc đường đều được.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn vẽ đường viền thiệp bằng Bézier nhưng nét vẽ không đều tay. Cách cải thiện là","options":["A. Giảm số nút, dùng nút trơn và chỉnh tay cầm cẩn thận","B. Thêm thật nhiều nút bừa bãi","C. Đổi màu viền","D. Vẽ to hơn"],"answer":"A","explain":"Ít nút đặt đúng chỗ + nút trơn + tay cầm chỉnh tốt cho đường cong mượt, đều.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn cần vẽ logo hình giọt nước đối xứng. Quy trình tối ưu là","options":["A. Vẽ nửa giọt nước bằng Bézier, nhân bản, lật ngang rồi Union gộp khép kín","B. Vẽ cả giọt nước một lần bằng tay","C. Vẽ hình tròn","D. Dùng ảnh giọt nước có sẵn"],"answer":"A","explain":"Nửa + nhân bản + lật + Union cho đối xứng hoàn hảo và thành một đường khép kín.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về kĩ thuật vẽ Bézier.","statements":["Nên đặt nút tại các điểm đổi hướng của đường cong.","Tay cầm càng dài thì đoạn cong càng mạnh.","Đường cong đẹp thường dùng ít nút nhưng đặt đúng chỗ.","Càng nhiều nút thì đường cong càng đẹp."],"answer":["T","T","T","F"],"explain":"Chất lượng đường cong phụ thuộc vị trí nút và tay cầm, không phụ thuộc số lượng nút.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau (tổng hợp bài 14).","statements":["Bézier là công cụ vẽ đường cong chủ lực trong Inkscape.","Node (F2) chỉnh sửa chi tiết từng nút của đường.","Văn bản có thể đặt theo đường cong bằng Put on Path.","Mọi đối tượng muốn chỉnh nút đều phải chuyển thành đường trước."],"answer":["T","T","T","T"],"explain":"Hình cơ bản muốn chỉnh từng nút phải qua Object to Path (Ctrl+Shift+C).","points":1},{"type":"short","level":"NB","q":"Phím tắt nhanh (một phím) của công cụ Bézier là (viết hoa)","answer":"B","explain":"Phím B mở nhanh công cụ Bézier; tương đương Shift+F6.","points":0.5},{"type":"short","level":"VDC","q":"Để khép kín một đường Bézier đang vẽ, ta bấm điểm cuối vào đâu? (điền: điểm đầu)","answer":"điểm đầu","explain":"Bấm điểm cuối trùng điểm đầu để khép kín đường, tạo hình kín tô màu được.","points":0.5}]}]}
