{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Người làm nghề phát triển phần mềm chủ yếu tạo ra sản phẩm nào?","options":["A. Các phần mềm, ứng dụng chạy trên máy tính, điện thoại","B. Máy tính và linh kiện","C. Bàn ghế văn phòng","D. Thực phẩm"],"answer":"A","explain":"Nghề phát triển phần mềm tạo ra phần mềm, ứng dụng phục vụ nhu cầu người dùng.","points":0.25},{"type":"mcq","level":"NB","q":"Vai trò nào trực tiếp viết mã lệnh (code) tạo ra phần mềm?","options":["A. Lập trình viên (developer)","B. Kế toán","C. Bảo vệ","D. Lái xe"],"answer":"A","explain":"Lập trình viên (developer) là người trực tiếp viết mã lệnh xây dựng phần mềm.","points":0.25},{"type":"mcq","level":"TH","q":"Kĩ năng quan trọng nhất của người phát triển phần mềm là","options":["A. Tư duy logic và khả năng giải quyết vấn đề","B. Khả năng hát hay","C. Sức khỏe thể chất","D. Khả năng nấu ăn"],"answer":"A","explain":"Lập trình là quá trình giải quyết vấn đề bằng logic; tư duy logic là nền tảng cốt lõi.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao người phát triển phần mềm cần học tiếng Anh?","options":["A. Vì tài liệu, ngôn ngữ lập trình và cộng đồng công nghệ chủ yếu dùng tiếng Anh","B. Vì bắt buộc đi nước ngoài","C. Vì sếp yêu cầu","D. Không cần thiết"],"answer":"A","explain":"Tài liệu kĩ thuật, từ khóa ngôn ngữ lập trình và diễn đàn công nghệ đều dùng tiếng Anh.","points":0.25},{"type":"mcq","level":"VD","q":"Một bạn học sinh giỏi Toán và thích tìm tòi máy tính. Nghề nào sau đây phù hợp để bạn tìm hiểu?","options":["A. Nghề phát triển phần mềm","B. Nghề đầu bếp","C. Nghề thợ mộc","D. Nghề lái tàu"],"answer":"A","explain":"Giỏi Toán (tư duy logic) và đam mê máy tính là tố chất phù hợp với nghề phát triển phần mềm.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nhóm bạn muốn làm ứng dụng quản lí chi tiêu cho học sinh. Để dự án thành công, điều quan trọng nhất lúc bắt đầu là","options":["A. Xác định rõ nhu cầu người dùng và phạm vi chức năng của ứng dụng","B. Viết code ngay lập tức","C. Thuê văn phòng đẹp","D. Mua máy tính đắt tiền"],"answer":"A","explain":"Phân tích yêu cầu rõ ràng từ đầu giúp dự án đi đúng hướng, tránh làm lại.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về nghề phát triển phần mềm.","statements":["Sản phẩm của nghề là các phần mềm, ứng dụng.","Lập trình viên là người trực tiếp viết mã lệnh.","Cần có tư duy logic và khả năng giải quyết vấn đề.","Nghề này không cần học hỏi thêm sau khi ra trường."],"answer":["T","T","T","F"],"explain":"Công nghệ thay đổi nhanh nên người làm phần mềm phải học hỏi liên tục.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về quy trình phát triển phần mềm.","statements":["Bước đầu là phân tích yêu cầu người dùng.","Sau đó thiết kế rồi mới lập trình.","Cần kiểm thử trước khi bàn giao sản phẩm.","Viết code xong là kết thúc, không cần bảo trì."],"answer":["T","T","T","F"],"explain":"Sau bàn giao vẫn cần bảo trì, sửa lỗi và nâng cấp phần mềm.","points":1},{"type":"short","level":"NB","q":"Người trực tiếp viết mã lệnh tạo ra phần mềm được gọi là lập trình viên, tiếng Anh là (viết thường)","answer":"developer","explain":"Developer là lập trình viên, người trực tiếp cài đặt phần mềm từ thiết kế.","points":0.5},{"type":"short","level":"VDC","q":"Giai đoạn tìm và sửa lỗi của phần mềm trong tiếng Anh gọi là (viết thường)","answer":"debugging","explain":"Debugging là quá trình gỡ lỗi; testing là kiểm thử.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Vai trò nào chịu trách nhiệm tìm lỗi của phần mềm trước khi bàn giao?","options":["A. Kiểm thử viên (tester)","B. Kế toán","C. Nhân viên bán hàng","D. Bảo vệ"],"answer":"A","explain":"Tester/QA kiểm thử phần mềm, tìm lỗi để lập trình viên sửa trước khi ra mắt.","points":0.25},{"type":"mcq","level":"NB","q":"Giai đoạn nào trong phát triển phần mềm diễn ra ĐẦU TIÊN?","options":["A. Phân tích yêu cầu","B. Viết mã lệnh","C. Kiểm thử","D. Bảo trì"],"answer":"A","explain":"Quy trình: phân tích yêu cầu → thiết kế → lập trình → kiểm thử → triển khai → bảo trì.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải kiểm thử phần mềm kĩ trước khi ra mắt?","options":["A. Vì phần mềm lỗi gây thiệt hại cho người dùng và uy tín công ty","B. Vì kiểm thử cho vui","C. Vì luật bắt buộc kiểm thử 100 lần","D. Không cần kiểm thử"],"answer":"A","explain":"Lỗi phần mềm có thể gây mất dữ liệu, thiệt hại kinh tế; kiểm thử đảm bảo chất lượng.","points":0.25},{"type":"mcq","level":"TH","q":"Bảo trì phần mềm là công việc","options":["A. Sửa lỗi phát sinh và nâng cấp tính năng sau khi bàn giao","B. Lau chùi máy tính","C. Cài lại Windows","D. Bán phần mềm"],"answer":"A","explain":"Bảo trì gồm sửa lỗi, cập nhật, nâng cấp tính năng trong suốt vòng đời phần mềm.","points":0.25},{"type":"mcq","level":"VD","q":"Một ứng dụng ngân hàng bị lỗi hiển thị sai số dư. Vai trò nào chịu trách nhiệm chính trong việc phát hiện lỗi này trước khi ra mắt?","options":["A. Kiểm thử viên (tester)","B. Nhân viên marketing","C. Kế toán ngân hàng","D. Khách hàng"],"answer":"A","explain":"Tester có nhiệm vụ tìm lỗi trước khi sản phẩm đến tay người dùng.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty phần mềm nhận dự án với deadline rất gấp. Quản lí dự án nên","options":["A. Thương lượng phạm vi hợp lí, phân công rõ ràng và theo dõi tiến độ chặt chẽ","B. Ép nhân viên làm ngày đêm không nghỉ","C. Bỏ qua kiểm thử cho kịp","D. Giao hết cho một người"],"answer":"A","explain":"Quản lí tốt: phạm vi hợp lí, phân công rõ, theo dõi tiến độ; bỏ kiểm thử gây rủi ro lớn.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về các vai trò.","statements":["Lập trình viên viết mã lệnh tạo phần mềm.","Kiểm thử viên tìm lỗi của phần mềm.","Phân tích viên tìm hiểu yêu cầu người dùng.","Một dự án phần mềm chỉ cần một người làm mọi việc."],"answer":["T","T","T","F"],"explain":"Dự án phần mềm thường cần nhiều vai trò phối hợp: phân tíc cùng xây dựng, cần phối hợp","B. Vì không ai làm một mình được","C. Vì sếp bắt buộc","D. Không cần thiết"],"answer":"A","explain":"Dự án phần mềm có nhiều module do nhiều người đảm nhận; phối hợp tốt quyết định thành công.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn viết một chương trình quản lí thư viện cho trường nhưng thầy cô dùng thử thấy khó dùng. Bạn nên","options":["A. Lắng nghe góp ý, cải thiện giao diện cho dễ dùng hơn","B. Bỏ dự án","C. Đổ lỗi cho thầy cô","D. Giữ nguyên"],"answer":"A","explain":"Lắng nghe người dùng và cải tiến là cách làm sản phẩm tốt lên.","points":0.25},{"type":"mcq","level":"VDC","q":"Một lập trình viên phát hiện phần mềm công ty thu thập dữ liệu người dùng trái phép. Hành động đúng đắn là","options":["A. Báo cáo cấp trên và từ chối tham gia hành vi vi phạm","B. Im lặng tiếp tục làm","C. Tự ý xóa dữ liệu","D. Đăng lên mạng xã hội"],"answer":"A","explain":"Bảo vệ dữ liệu người dùng là đạo đức nghề nghiệp; báo cáo qua kênh chính thức.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về tố chất nghề nghiệp.","statements":["Cần tư duy logic tốt.","Cần kiên trì vì gỡ lỗi tốn nhiều thời gian.","Cần học hỏi liên tục vì công nghệ thay đổi nhanh.","Học một lần là đủ cho cả sự nghiệp."],"answer":["T","T","T","F"],"explain":"Công nghệ thay đổi liên tục nên phải học hỏi suốt đời.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về đạo đức nghề nghiệp.","statements":["Không viết mã độc, virus máy tính.","Tôn trọng bản quyền phần mềm.","Bảo vệ dữ liệu cá nhân của người dùng.","Có thể sao chép phần mềm có bản quyền để dùng."],"answer":["T","T","T","F"],"explain":"Tôn trọng bản quyền và bảo vệ người dùng là đạo đức cốt lõi của nghề.","points":1},{"type":"short","level":"NB","q":"Ngôn ngữ lập trình được học trong Tin học 10 là (viết đúng: Python)","answer":"Python","explain":"Python là ngôn ngữ lập trình được học trong Chủ đề 5 Tin học 10.","points":0.5},{"type":"short","level":"VDC","q":"Quá trình kiểm tra phần mềm để tìm lỗi trong tiếng Anh gọi là (viết thường)","answer":"testing","explain":"Testing là kiểm thử; debugging là gỡ lỗi.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Sản phẩm nào sau đây là phần mềm?","options":["A. Ứng dụng Zalo trên điện thoại","B. Chiếc điện thoại","C. Cục sạc","D. Tai nghe"],"answer":"A","explain":"Zalo là phần mềm ứng dụng; điện thoại, sạc, tai nghe là phần cứng.","points":0.25},{"type":"mcq","level":"NB","q":"Ai là người quyết định phần mềm cần có những chức năng gì?","options":["A. Phân tích viên nghiệp vụ (làm việc với khách hàng, người dùng)","B. Nhân viên bảo vệ","C. Người dùng tự quyết định","D. Máy tính tự quyết định"],"answer":"A","explain":"Phân tích viên (BA) tìm hiểu nhu cầu và xác định yêu cầu chức năng của phần mềm.","points":0.25},{"type":"mcq","level":"TH","q":"Thiết kế phần mềm (trước khi viết code) có vai trò","options":["A. Vạch ra kiến trúc, cấu trúc dữ liệu giúp viết code đúng hướng","B. Làm cho có","C. Tốn thời gian vô ích","D. Chỉ để trang trí"],"answer":"A","explain":"Thiết kế tốt giúp code có cấu trúc rõ ràng, dễ bảo trì và mở rộng.","points":0.25},{"type":"mcq","level":"TH","q":"Một phần mềm có nhiều lỗi khi ra mắt sẽ gây hậu quả","options":["A. Mất uy tín, mất khách hàng và tốn chi phí sửa chữa","B. Không ảnh hưởng gì","C. Được khen ngợi","D. Tự hết lỗi"],"answer":"A","explain":"Lỗi phần mềm gây thiệt hại thực tế; chất lượng là uy tín của công ty.","points":0.25},{"type":"mcq","level":"VD","q":"Trường bạn muốn có website quản lí điểm. Là người phát triển, việc đầu tiên bạn làm là","options":["A. Gặp gỡ giáo viên, học sinh để tìm hiểu nhu cầu sử dụng thực tế","B. Viết code ngay","C. Mua tên miền đắt tiền","D. Thuê văn phòng"],"answer":"A","explain":"Phân tích yêu cầu người dùng thực tế là bước đầu tiên của mọi dự án phần mềm.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai ứng dụng cùng chức năng: một dễ dùng, một khó dùng. Người dùng sẽ chọn ứng dụng nào và bài học cho người phát triển là","options":["A. Chọn ứng dụng dễ dùng; phải quan tâm trải nghiệm người dùng (UX)","B. Chọn ứng dụng khó dùng","C. Không quan tâm","D. Chọn ngẫu nhiên"],"answer":"A","explain":"Trải nghiệm người dùng quyết định sự thành công của phần mềm.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về vòng đời phần mềm.","statements":["Phân tích yêu cầu là bước đầu tiên.","Thiết kế giúp code đúng hướng.","Kiểm thử giúp phát hiện lỗi trước khi ra mắt.","Bảo trì là không cần thiết."],"answer":["T","T","T","F"],"explain":"Bảo trì (sửa lỗi, nâng cấp) là giai đoạn kéo dài suốt vòng đời phần mềm.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về làm sản phẩm tốt.","statements":["Phải lắng nghe nhu cầu người dùng thực tế.","Giao diện dễ dùng quan trọng không kém chức năng.","Cần kiểm thử kĩ trước khi ra mắt.","Cứ viết code xong là có sản phẩm tốt."],"answer":["T","T","T","F"],"explain":"Sản phẩm tốt cần đúng nhu cầu, dễ dùng và ít lỗi.","points":1},{"type":"short","level":"NB","q":"Người tìm hiểu nhu cầu và xác định chức năng phần mềm gọi là phân tích viên, tiếng Anh viết tắt là (viết hoa)","answer":"BA","explain":"BA (Business Analyst) là phân tích viên nghiệp vụ.","points":0.5},{"type":"short","level":"VDC","q":"Trải nghiệm người dùng trong tiếng Anh viết tắt là (viết hoa)","answer":"UX","explain":"UX (User Experience) là trải nghiệm người dùng; UI là giao diện.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Nghề phát triển phần mềm thuộc lĩnh vực nào?","options":["A. Công nghệ thông tin","B. Nông nghiệp","C. Y tế","D. Xây dựng"],"answer":"A","explain":"Phát triển phần mềm là nghề cốt lõi của lĩnh vực công nghệ thông tin.","points":0.25},{"type":"mcq","level":"NB","q":"Đâu là ví dụ về phần mềm ứng dụng?","options":["A. Phần mềm quản lí bán hàng của cửa hàng","B. Bàn phím máy tính","C. Màn hình máy tính","D. Chuột máy tính"],"answer":"A","explain":"Phần mềm quản lí bán hàng là phần mềm ứng dụng; các đáp án còn lại là phần cứng.","points":0.25},{"type":"mcq","level":"TH","q":"Một bạn trẻ muốn trở thành lập trình viên giỏi. Ngoài học ngôn ngữ lập trình, bạn cần","options":["A. Rèn tư duy thuật toán, làm nhiều dự án thực tế","B. Chỉ học lí thuyết","C. Chỉ xem video","D. Không cần thực hành"],"answer":"A","explain":"Tư duy thuật toán + thực hành dự án thực tế mới tạo nên lập trình viên giỏi.","points":0.25},{"type":"mcq","level":"TH","q":"Tham gia các cuộc thi lập trình (Olympic Tin học) giúp học sinh","options":["A. Rèn tư duy thuật toán và là lợi thế khi theo nghề phần mềm","B. Mất thời gian","C. Chỉ để vui","D. Không liên quan đến nghề"],"answer":"A","explain":"Thi lập trình rèn tư duy và là điểm cộng lớn khi ứng tuyển ngành công nghệ.","points":0.25},{"type":"mcq","level":"VD","q":"Lớp bạn muốn làm app điểm danh. Bạn phụ trách viết code nhưng chưa biết cách lưu dữ liệu. Bạn nên","options":["A. Tìm hiểu về cơ sở dữ liệu và hỏi ý kiến thầy cô, bạn bè","B. Bỏ cuộc","C. Lưu dữ liệu vào giấy","D. Đoán mò"],"answer":"A","explain":"Học hỏi kiến thức mới và nhờ hỗ trợ là cách giải quyết vấn đề trong nghề lập trình.","points":0.25},{"type":"mcq","level":"VDC","q":"Một startup muốn tuyển lập trình viên. Ngoài kĩ năng code, yếu tố nào cũng rất được coi trọng?","options":["A. Khả năng tự học, giải quyết vấn đề và phối hợp nhóm","B. Ngoại hình","C. Quê quán","D. Tuổi tác"],"answer":"A","explain":"Startup cần người tự học nhanh, giải quyết vấn đề độc lập và phối hợp tốt.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về học lập trình.","statements":["Học sinh có thể bắt đầu học lập trình từ phổ thông.","Thực hành dự án nhỏ giúp tiến bộ nhanh.","Thi Olympic Tin học rèn tư duy thuật toán.","Phải đợi đi làm mới được học lập trình."],"answer":["T","T","T","F"],"explain":"Có thể bắt đầu học lập trình từ sớm với Python và các dự án nhỏ.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về môi trường làm việc công nghệ.","statements":["Có thể làm tại công ty phần mềm trong nước.","Có thể làm việc từ xa (remote) cho công ty nước ngoài.","Có thể khởi nghiệp với sản phẩm của mình.","Nghề phần mềm chỉ làm được ở nước ngoài."],"answer":["T","T","T","F"],"explain":"Ngành phần mềm Việt Nam phát triển mạnh với nhiều cơ hội trong nước và làm việc từ xa.","points":1},{"type":"short","level":"NB","q":"Lĩnh vực công nghệ thông tin viết tắt trong tiếng Anh là (viết hoa)","answer":"IT","explain":"IT (Information Technology) là lĩnh vực của nghề phát triển phần mềm.","points":0.5},{"type":"short","level":"VDC","q":"Hình thức làm việc từ xa qua mạng trong tiếng Anh gọi là (viết thường)","answer":"remote","explain":"Remote work là làm việc từ xa, phổ biến trong ngành phần mềm.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Công việc của lập trình viên là","options":["A. Viết mã lệnh để tạo ra phần mềm theo thiết kế","B. Sửa chữa phần cứng","C. Bán máy tính","D. Dạy học"],"answer":"A","explain":"Lập trình viên cài đặt (viết code) phần mềm dựa trên bản thiết kế và yêu cầu.","points":0.25},{"type":"mcq","level":"NB","q":"Sau khi phần mềm được bàn giao cho khách hàng, công việc nào vẫn tiếp tục?","options":["A. Bảo trì: sửa lỗi và nâng cấp","B. Không còn việc gì","C. Xóa phần mềm","D. Bán công ty"],"answer":"A","explain":"Bảo trì kéo dài suốt vòng đời phần mềm: sửa lỗi phát sinh, cập nhật tính năng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các công ty phần mềm coi trọng khả năng tự học của ứng viên?","options":["A. Vì công nghệ thay đổi nhanh, phải liên tục cập nhật kiến thức mới","B. Vì không ai dạy việc","C. Vì tiết kiệm chi phí đào tạo","D. Không coi trọng"],"answer":"A","explain":"Công nghệ thay đổi liên tục; khả năng tự học giúp thích ứng với công cụ, ngôn ngữ mới.","points":0.25},{"type":"mcq","level":"TH","q":"Khi gặp lỗi khó trong lúc lập trình, cách xử lí tốt là","options":["A. Đọc kĩ thông báo lỗi, tìm kiếm tài liệu và thử từng cách khắc phục","B. Xóa hết code viết lại","C. Bỏ cuộc ngay","D. Đổ lỗi cho máy tính"],"answer":"A","explain":"Gỡ lỗi là kĩ năng cốt lõi: đọc thông báo lỗi, tra tài liệu, thử nghiệm có phương pháp.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn làm website cho câu lạc bộ nhưng khi nhiều người truy cập cùng lúc thì web chậm. Vấn đề này thuộc khía cạnh nào của chất lượng phần mềm?","options":["A. Hiệu năng (performance) và khả năng chịu tải","B. Màu sắc website","C. Tên miền","D. Không phải vấn đề"],"answer":"A","explain":"Chịu tải kém là vấn đề hiệu năng; phần mềm tốt phải đáp ứng được lượng người dùng thực tế.","points":0.25},{"type":"mcq","level":"VDC","q":"Một bạn sinh viên tạo ra ứng dụng học tập được nhiều người dùng nhưng bị một công ty lớn sao chép ý tưởng. Bài học về bảo vệ sản phẩm là","options":["A. Cần tìm hiểu về bản quyền, sở hữu trí tuệ để bảo vệ sản phẩm của mình","B. Không nên sáng tạo nữa","C. Tặng ý tưởng cho công ty lớn","D. Bỏ ứng dụng"],"answer":"A","explain":"Hiểu biết về bản quyền, sở hữu trí tuệ giúp bảo vệ thành quả sáng tạo.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về kĩ năng nghề nghiệp.","statements":["Khả năng tự học rất quan trọng vì công nghệ thay đổi nhanh.","Kĩ năng gỡ lỗi giúp giải quyết sự cố hiệu quả.","Làm việc nhóm tốt giúp dự án thành công.","Lập trình viên giỏi không bao giờ gặp lỗi."],"answer":["T","T","T","F"],"explain":"Ai cũng gặp lỗi khi lập trình; quan trọng là khả năng tìm và sửa lỗi.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về bảo vệ sản phẩm.","statements":["Nên tìm hiểu về bản quyền phần mềm.","Sở hữu trí tuệ bảo vệ thành quả sáng tạo.","Có thể đăng kí bảo hộ cho sản phẩm của mình.","Ý tưởng phần mềm không cần được bảo vệ."],"answer":["T","T","T","F"],"explain":"Sản phẩm phần mềm được pháp luật bảo hộ; cần chủ động bảo vệ.","points":1},{"type":"short","level":"NB","q":"Công việc viết mã lệnh tạo ra phần mềm trong tiếng Anh gọi là (viết thường)","answer":"coding","explain":"Coding là viết mã lệnh; lập trình viên thực hiện công việc coding.","points":0.5},{"type":"short","level":"VDC","q":"Người quản lí dự án phần mềm trong tiếng Anh viết tắt là (viết hoa)","answer":"PM","explain":"PM (Project Manager) quản lí tiến độ, nhân sự và chất lượng dự án.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Phần mềm hệ thống (ví dụ hệ điều hành) khác phần mềm ứng dụng ở điểm nào?","options":["A. Phần mềm hệ thống quản lí phần cứng, phần mềm ứng dụng phục vụ nhu cầu người dùng","B. Không có gì khác nhau","C. Phần mềm ứng dụng đắt hơn","D. Phần mềm hệ thống không cần lập trình"],"answer":"A","explain":"Hệ điều hành quản lí tài nguyên máy tính; ứng dụng (Zalo, game) phục vụ nhu cầu cụ thể.","points":0.25},{"type":"mcq","level":"NB","q":"Đâu là phần mềm mã nguồn mở nổi tiếng?","options":["A. Hệ điều hành Linux","B. Hệ điều hành Windows","C. Phần mềm Word","D. Phần mềm Excel"],"answer":"A","explain":"Linux là hệ điều hành mã nguồn mở; Windows, Word, Excel là thương mại.","points":0.25},{"type":"mcq","level":"TH","q":"Phần mềm mã nguồn mở có lợi ích gì cho người học lập trình?","options":["A. Được xem mã nguồn để học hỏi cách người khác viết chương trình","B. Không có lợi ích","C. Chỉ để dùng miễn phí","D. Không được xem code"],"answer":"A","explain":"Mã nguồn mở là kho học liệu quý: đọc code của dự án lớn để học kĩ thuật lập trình.","points":0.25},{"type":"mcq","level":"TH","q":"Khi sử dụng thư viện mã nguồn mở trong dự án của mình, cần","options":["A. Tuân thủ giấy phép của thư viện (ghi nguồn, giữ nguyên điều khoản...)","B. Xóa tên tác giả","C. Không cần quan tâm","D. Bán lại thư viện"],"answer":"A","explain":"Mã nguồn mở vẫn có giấy phép; phải tuân thủ điều khoản khi sử dụng.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn muốn làm ứng dụng di động nhưng chỉ biết Python. Bạn nên","options":["A. Tìm hiểu thêm ngôn ngữ, công cụ phù hợp cho di động (ví dụ Dart/Flutter, Kotlin...)","B. Dùng Python làm mọi thứ kể cả khi không phù hợp","C. Bỏ ý định","D. Thuê người khác làm hết"],"answer":"A","explain":"Mỗi nền tảng có công cụ phù hợp; người phát triển phần mềm luôn sẵn sàng học công nghệ mới.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty giao cho nhóm bạn dự án lớn với nhiều module. Để phối hợp hiệu quả, nhóm nên","options":["A. Chia module rõ ràng, thống nhất cách viết code và thường xuyên trao đổi tiến độ","B. Mỗi người làm tùy ý","C. Không cần trao đổi","D. Làm xong mới ghép"],"answer":"A","explain":"Chia việc rõ ràng, quy ước chung và giao tiếp thường xuyên là chìa khóa của làm việc nhóm.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về phần mềm.","statements":["Hệ điều hành là phần mềm hệ thống.","Zalo, game là phần mềm ứng dụng.","Linux là hệ điều hành mã nguồn mở.","Phần mềm không cần con người tạo ra."],"answer":["T","T","T","F"],"explain":"Mọi phần mềm đều do con người (lập trình viên) tạo ra.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về làm việc nhóm.","statements":["Nên chia công việc thành các module rõ ràng.","Nên thống nhất quy ước viết code chung.","Nên trao đổi tiến độ thường xuyên.","Mỗi người làm tùy ý, cuối cùng ghép lại."],"answer":["T","T","T","F"],"explain":"Phối hợp có quy ước từ đầu giúp ghép các module trơn tru.","points":1},{"type":"short","level":"NB","q":"Hệ điều hành mã nguồn mở nổi tiếng là (viết đúng: Linux)","answer":"Linux","explain":"Linux là hệ điều hành mã nguồn mở được dùng rộng rãi cho máy chủ.","points":0.5},{"type":"short","level":"VDC","q":"Thuật ngữ chỉ việc viết mã lệnh theo quy ước chung của nhóm gọi là (tiếng Anh, viết thường, có dấu cách)","answer":"coding convention","explain":"Coding convention là quy ước viết code giúp code đồng nhất, dễ đọc.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Để trở thành lập trình viên, môn học nào ở phổ thông là nền tảng quan trọng?","options":["A. Toán và Tin học","B. Chỉ môn Thể dục","C. Chỉ môn Âm nhạc","D. Không cần môn nào"],"answer":"A","explain":"Toán rèn tư duy logic, Tin học cung cấp kiến thức lập trình nền tảng.","points":0.25},{"type":"mcq","level":"NB","q":"Nghề phát triển phần mềm có thể làm việc ở đâu?","options":["A. Công ty công nghệ, ngân hàng, startup, làm việc từ xa","B. Chỉ ở nông trại","C. Chỉ ở công trường","D. Không có nơi làm việc"],"answer":"A","explain":"Nhu cầu phần mềm có ở mọi ngành: công nghệ, tài chính, startup... và làm việc từ xa.","points":0.25},{"type":"mcq","level":"TH","q":"Một lập trình viên mới ra trường nên ưu tiên","options":["A. Tích lũy kinh nghiệm qua dự án thực tế và học hỏi từ đồng nghiệp","B. Đòi lương cao ngay","C. Chỉ làm việc một mình","D. Không cần học thêm"],"answer":"A","explain":"Kinh nghiệm thực tế và học hỏi là con đường thăng tiến bền vững cho người mới.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nhiều công ty tổ chức đào tạo nội bộ cho lập trình viên?","options":["A. Vì công nghệ mới ra liên tục, cần cập nhật cho nhân viên","B. Vì nhân viên rảnh rỗi","C. Vì luật bắt buộc","D. Để quảng cáo"],"answer":"A","explain":"Đào tạo liên tục giúp đội ngũ theo kịp công nghệ, nâng cao chất lượng sản phẩm.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn được giao viết chương trình nhưng yêu cầu của khách hàng còn mơ hồ. Bạn nên","options":["A. Hỏi lại khách hàng để làm rõ trước khi viết code","B. Tự đoán ý khách hàng","C. Viết đại một chương trình","D. Từ chối dự án"],"answer":"A","explain":"Làm rõ yêu cầu trước khi code tránh lãng phí công sức làm lại.","points":0.25},{"type":"mcq","level":"VDC","q":"Một phần mềm y tế tính sai liều thuốc cho bệnh nhân. Điều này cho thấy","options":["A. Kiểm thử phần mềm quan trọng đến mức ảnh hưởng tính mạng con người","B. Lỗi phần mềm là bình thường","C. Không cần kiểm thử","D. Lỗi do bệnh nhân"],"answer":"A","explain":"Trong lĩnh vực quan trọng (y tế, hàng không), lỗi phần mềm có hậu quả nghiêm trọng nên kiểm thử phải cực kĩ.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về phát triển sự nghiệp.","statements":["Người mới nên tích lũy kinh nghiệm qua dự án thực tế.","Nên học hỏi từ đồng nghiệp có kinh nghiệm.","Công nghệ mới đòi hỏi học tập liên tục.","Ra trường là không cần học nữa."],"answer":["T","T","T","F"],"explain":"Học tập suốt đời là yêu cầu của nghề công nghệ.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về trách nhiệm nghề nghiệp.","statements":["Phần mềm quan trọng (y tế, ngân hàng) phải kiểm thử cực kĩ.","Lỗi phần mềm có thể gây hậu quả nghiêm trọng.","Người phát triển phải có trách nhiệm với sản phẩm.","Lỗi phần mềm không bao giờ gây hại."],"answer":["T","T","T","F"],"explain":"Trách nhiệm với sản phẩm là đạo đức cốt lõi của người làm phần mềm.","points":1},{"type":"short","level":"NB","q":"Hai môn học phổ thông là nền tảng quan trọng cho nghề lập trình là Toán và (điền: Tin học)","answer":"Tin học","explain":"Toán rèn logic, Tin học dạy lập trình: nền tảng của nghề phát triển phần mềm.","points":0.5},{"type":"short","level":"VDC","q":"Kì thi chọn học sinh giỏi môn Tin học cấp quốc gia trong tiếng Anh thường gọi là (viết đúng: OI)","answer":"OI","explain":"OI (Olympiad in Informatics) là kì thi Olympic Tin học.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Ai là người sử dụng cuối cùng của phần mềm?","options":["A. Người dùng (user)","B. Lập trình viên","C. Máy tính","D. Không ai"],"answer":"A","explain":"Người dùng cuối là đối tượng phục vụ của phần mềm; mọi thiết kế hướng tới họ.","points":0.25},{"type":"mcq","level":"NB","q":"Giao diện (UI) của phần mềm là","options":["A. Phần người dùng nhìn thấy và tương tác","B. Phần cứng máy tính","C. Dây điện","D. Không tồn tại"],"answer":"A","explain":"UI là những gì người dùng thấy và thao tác: nút bấm, menu, màn hình.","points":0.25},{"type":"mcq","level":"TH","q":"Một phần mềm có đầy đủ chức năng nhưng giao diện rối rắm. Đánh giá đúng là","options":["A. Chưa tốt vì người dùng khó sử dụng","B. Đã hoàn hảo","C. Không cần giao diện","D. Càng rối càng tốt"],"answer":"A","explain":"Dễ dùng là tiêu chí chất lượng quan trọng không kém đầy đủ chức năng.","points":0.25},{"type":"mcq","level":"TH","q":"Phản hồi của người dùng sau khi dùng thử phần mềm giúp","options":["A. Cải thiện sản phẩm cho phù hợp thực tế","B. Không có tác dụng","C. Làm chậm tiến độ","D. Nên bỏ qua"],"answer":"A","explain":"Phản hồi người dùng là nguồn cải tiến sản phẩm quý giá.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn làm app học từ vựng cho bạn cùng lớp. Để app được yêu thích, bạn nên","options":["A. Hỏi bạn bè muốn tính năng gì, làm thử rồi lấy ý kiến cải thiện","B. Tự làm theo ý mình","C. Sao chép app khác","D. Không cần ý kiến ai"],"answer":"A","explain":"Phát triển hướng người dùng: lắng nghe, thử nghiệm, cải thiện liên tục.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty có hai đội: đội A code nhanh nhưng nhiều lỗi, đội B code chậm hơn nhưng ít lỗi. Về lâu dài, đội nào hiệu quả hơn và vì sao?","options":["A. Đội B, vì ít lỗi giúp tiết kiệm chi phí sửa chữa và giữ uy tín","B. Đội A, vì nhanh là quan trọng nhất","C. Hai đội như nhau","D. Không thể so sánh"],"answer":"A","explain":"Chi phí sửa lỗi sau ra mắt rất cao; code chất lượng từ đầu hiệu quả hơn về lâu dài.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về người dùng.","statements":["Người dùng là đối tượng phục vụ của phần mềm.","Giao diện dễ dùng giúp người dùng hài lòng.","Phản hồi người dùng giúp cải thiện sản phẩm.","Không cần quan tâm người dùng nghĩ gì."],"answer":["T","T","T","F"],"explain":"Lấy người dùng làm trung tâm là triết lí phát triển phần mềm hiện đại.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau (tổng hợp bài 34).","statements":["Nghề phát triển phần mềm cần tư duy logic và học hỏi liên tục.","Quy trình gồm: yêu cầu, thiết kế, code, kiểm thử, bảo trì.","Cần tôn trọng bản quyền và bảo vệ dữ liệu người dùng.","Viết code xong là hết trách nhiệm."],"answer":["T","T","T","F"],"explain":"Trách nhiệm kéo dài qua bảo trì và đảm bảo chất lượng sản phẩm.","points":1},{"type":"short","level":"NB","q":"Phần người dùng nhìn thấy và tương tác của phần mềm gọi là giao diện, tiếng Anh viết tắt là (viết hoa)","answer":"UI","explain":"UI (User Interface) là giao diện người dùng.","points":0.5},{"type":"short","level":"VDC","q":"Triết lí lấy người dùng làm trung tâm trong phát triển phần mềm nhấn mạnh vai trò của ai? (điền: người dùng)","answer":"người dùng","explain":"Mọi quyết định thiết kế đều hướng tới phục vụ người dùng tốt nhất.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Trong các nghề sau, nghề nào thuộc lĩnh vực công nghệ thông tin?","options":["A. Phát triển phần mềm","B. Trồng lúa","C. Chăn nuôi","D. Khai thác than"],"answer":"A","explain":"Phát triển phần mềm là nghề đặc trưng của công nghệ thông tin.","points":0.25},{"type":"mcq","level":"NB","q":"Sản phẩm của nghề phát triển phần mềm được dùng để","options":["A. Phục vụ nhu cầu học tập, làm việc, giải trí của con người","B. Trang trí","C. Làm thức ăn","D. Không dùng vào việc gì"],"answer":"A","explain":"Phần mềm phục vụ mọi mặt đời sống: học tập, làm việc, giải trí, y tế...","points":0.25},{"type":"mcq","level":"TH","q":"Học sinh phổ thông có thể bắt đầu tiếp cận nghề phát triển phần mềm bằng cách","options":["A. Học lập trình Python, làm các dự án nhỏ, tham gia câu lạc bộ Tin học","B. Chờ đến đại học","C. Chỉ đọc sách không thực hành","D. Không thể bắt đầu sớm"],"answer":"A","explain":"Bắt đầu sớm với Python và dự án nhỏ là lợi thế lớn khi theo nghề.","points":0.25},{"type":"mcq","level":"TH","q":"Khi làm dự án phần mềm theo nhóm ở lớp, vai trò nào KHÔNG cần thiết?","options":["A. Người chỉ ngồi xem không làm gì","B. Người phân tích yêu cầu","C. Người viết code","D. Người kiểm thử"],"answer":"A","explain":"Mọi thành viên đều cần đóng góp; các vai trò phân tích, code, kiểm thử đều cần thiết.","points":0.25},{"type":"mcq","level":"VD","q":"Nhóm bạn được giao làm website giới thiệu trường. Để website đẹp và hữu ích, nhóm nên phân công","options":["A. Người tìm hiểu nội dung, người thiết kế giao diện, người viết code, người kiểm thử","B. Một người làm tất cả","C. Không phân công","D. Thuê người ngoài làm"],"answer":"A","explain":"Phân công theo vai trò giúp mỗi người phát huy sở trường, sản phẩm chất lượng hơn.","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh đam mê lập trình nhưng học Toán chưa tốt. Lời khuyên đúng đắn là","options":["A. Cố gắng cải thiện môn Toán vì tư duy logic rất cần cho lập trình, đồng thời vẫn thực hành code","B. Bỏ lập trình vì Toán kém","C. Chỉ học code, bỏ Toán","D. Toán không liên quan đến lập trình"],"answer":"A","explain":"Toán rèn tư duy logic nền tảng cho lập trình; cải thiện Toán song song với thực hành code.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau về hướng nghiệp.","statements":["Học sinh có thể bắt đầu học lập trình từ phổ thông.","Dự án nhỏ giúp tích lũy kinh nghiệm thực tế.","Câu lạc bộ Tin học là môi trường tốt để rèn luyện.","Đam mê công nghệ là chưa đủ, cần rèn tư duy và kĩ năng."],"answer":["T","T","T","T"],"explain":"Đam mê cần đi cùng rèn luyện bài bản mới thành nghề.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về làm dự án nhóm.","statements":["Nên phân công vai trò rõ ràng.","Mọi thành viên đều cần đóng góp.","Nên kiểm thử sản phẩm trước khi nộp.","Một người làm hết là cách tốt nhất."],"answer":["T","T","T","F"],"explain":"Phân công và phối hợp giúp dự án nhóm hiệu quả hơn một người gánh hết.","points":1},{"type":"short","level":"NB","q":"Ngôn ngữ lập trình mà học sinh lớp 10 đã học là (viết đúng: Python)","answer":"Python","explain":"Python được học trong Chủ đề 5 Tin học 10.","points":0.5},{"type":"short","level":"VDC","q":"Người dùng cuối của phần mềm trong tiếng Anh gọi là (viết thường)","answer":"user","explain":"User là người dùng cuối, đối tượng phục vụ của phần mềm.","points":0.5}]}]}
