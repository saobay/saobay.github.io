{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Chủ đề 6 của Tin học 10 giúp học sinh tìm hiểu về","options":["A. Các nghề nghiệp liên quan đến Tin học","B. Cách sửa máy tính","C. Cách nấu ăn","D. Cách lái xe"],"answer":"A","explain":"Chủ đề 6 hướng nghiệp: tìm hiểu nghề thiết kế đồ họa máy tính và nghề phát triển phần mềm.","points":0.25},{"type":"mcq","level":"NB","q":"Sản phẩm nào thuộc về nghề thiết kế đồ họa?","options":["A. Poster quảng cáo","B. Hệ điều hành","C. Ứng dụng ngân hàng","D. Trình duyệt web"],"answer":"A","explain":"Poster là sản phẩm thiết kế đồ họa; các đáp án còn lại là sản phẩm phần mềm.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm chung của hai nghề thiết kế đồ họa và phát triển phần mềm là","options":["A. Đều cần sáng tạo, học hỏi liên tục và làm việc với máy tính","B. Đều không cần học","C. Đều chỉ làm một mình","D. Đều không cần giao tiếp"],"answer":"A","explain":"Cả hai nghề đều gắn với máy tính, đòi hỏi sáng tạo/tư duy và cập nhật liên tục.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao cả hai nghề đều cần kĩ năng giao tiếp?","options":["A. Vì phải hiểu yêu cầu của khách hàng, người dùng và phối hợp nhóm","B. Vì phải nói nhiều","C. Không cần thiết","D. Vì sếp yêu cầu"],"answer":"A","explain":"Hiểu đúng yêu cầu và phối hợp nhóm quyết định sự thành công của dự án.","points":0.25},{"type":"mcq","level":"VD","q":"Một bạn vừa thích vẽ đẹp vừa thích lập trình. Gợi ý nghề nghiệp phù hợp là","options":["A. Thiết kế giao diện UI/UX — kết hợp thẩm mỹ và công nghệ","B. Chỉ chọn một, bỏ hẳn sở thích còn lại","C. Không có nghề nào phù hợp","D. Nghề không liên quan công nghệ"],"answer":"A","explain":"UI/UX kết hợp cả hai đam mê: thẩm mỹ của thiết kế và công nghệ của phần mềm.","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh lớp 10 muốn sau này làm việc trong ngành công nghệ. Kế hoạch hợp lí nhất từ bây giờ là","options":["A. Học tốt Toán, Tin học; thực hành dự án nhỏ; tìm hiểu các nghề để chọn hướng đi","B. Chờ đến đại học mới bắt đầu","C. Chỉ chơi game để 'làm quen công nghệ'","D. Không cần chuẩn bị gì"],"answer":"A","explain":"Chuẩn bị sớm với nền tảng vững và trải nghiệm thực tế là lợi thế lớn.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["Thiết kế đồ họa tạo ra các sản phẩm trực quan.","Phát triển phần mềm tạo ra các ứng dụng.","Cả hai nghề đều cần học hỏi liên tục.","Hai nghề này không liên quan gì đến nhau."],"answer":["T","T","T","F"],"explain":"Hai nghề đều thuộc lĩnh vực công nghệ số và thường phối hợp trong dự án.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về chọn nghề.","statements":["Nên chọn nghề phù hợp sở thích và năng lực.","Nên tìm hiểu kĩ về nghề trước khi quyết định.","Cần chuẩn bị kiến thức, kĩ năng từ sớm.","Chọn nghề chỉ cần theo phong trào."],"answer":["T","T","T","F"],"explain":"Hướng nghiệp cần dựa trên hiểu biết thực tế, sở thích và năng lực bản thân.","points":1},{"type":"short","level":"NB","q":"Nghề tạo ra logo, poster, banner gọi là nghề (điền: thiết kế đồ họa)","answer":"thiết kế đồ họa","explain":"Đó là các sản phẩm điển hình của nghề thiết kế đồ họa máy tính.","points":0.5},{"type":"short","level":"VDC","q":"Nghề tạo ra phần mềm, ứng dụng gọi là nghề (điền: phát triển phần mềm)","answer":"phát triển phần mềm","explain":"Nghề phát triển phần mềm tạo ra các phần mềm, ứng dụng.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Người viết mã lệnh tạo ra phần mềm được gọi là","options":["A. Lập trình viên","B. Nhà thiết kế thời trang","C. Đầu bếp","D. Thợ điện"],"answer":"A","explain":"Lập trình viên (developer) trực tiếp viết code xây dựng phần mềm.","points":0.25},{"type":"mcq","level":"NB","q":"Bộ sưu tập tác phẩm của nhà thiết kế dùng khi xin việc gọi là","options":["A. Portfolio","B. Nhật kí","C. Sổ điểm","D. Hóa đơn"],"answer":"A","explain":"Portfolio chứng minh năng lực thực tế, rất quan trọng khi xin việc thiết kế.","points":0.25},{"type":"mcq","level":"TH","q":"Trong một dự án phần mềm, ai là người tìm lỗi trước khi bàn giao?","options":["A. Kiểm thử viên","B. Khách hàng","C. Người dùng cuối","D. Nhân viên bảo vệ"],"answer":"A","explain":"Tester tìm lỗi để sửa trước khi sản phẩm đến tay người dùng.","points":0.25},{"type":"mcq","level":"TH","q":"Nhà thiết kế đồ họa cần làm gì để sản phẩm đúng ý khách hàng?","options":["A. Tìm hiểu kĩ yêu cầu và cho khách xem bản thảo để góp ý","B. Tự làm theo ý mình","C. Sao chép mẫu có sẵn","D. Không cần quan tâm khách hàng"],"answer":"A","explain":"Tìm hiểu yêu cầu và lấy góp ý qua bản thảo giúp sản phẩm đúng ý.","points":0.25},{"type":"mcq","level":"VD","q":"Một công ty muốn làm ứng dụng bán hàng gồm cả giao diện đẹp và chức năng tốt. Công ty cần","options":["A. Cả nhà thiết kế (giao diện) và lập trình viên (chức năng) phối hợp","B. Chỉ cần lập trình viên","C. Chỉ cần nhà thiết kế","D. Không cần ai"],"answer":"A","explain":"Ứng dụng tốt cần cả giao diện đẹp và chức năng tốt: hai nghề phối hợp.","points":0.25},{"type":"mcq","level":"VDC","q":"Một bạn trẻ làm freelancer cả thiết kế và lập trình web cơ bản. Lợi thế của bạn là","options":["A. Có thể nhận trọn gói dự án nhỏ, chủ động về công việc","B. Không có lợi thế gì","C. Bị coi là không chuyên","D. Thu nhập thấp hơn"],"answer":"A","explain":"Kĩ năng đa dạng giúp freelancer nhận trọn gói, tăng cơ hội và thu nhập.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["Lập trình viên viết mã lệnh tạo phần mềm.","Kiểm thử viên tìm lỗi phần mềm.","Portfolio quan trọng với nghề thiết kế.","Nghề công nghệ không cần làm việc nhóm."],"answer":["T","T","T","F"],"explain":"Dự án công nghệ thường làm theo nhóm, cần phối hợp chặt chẽ.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về phối hợp nghề nghiệp.","statements":["Ứng dụng tốt cần cả thiết kế đẹp và code tốt.","Nhà thiết kế và lập trình viên thường phối hợp trong dự án.","Giao tiếp tốt giúp hai bên hiểu nhau.","Mỗi nghề làm riêng, không cần phối hợp."],"answer":["T","T","T","F"],"explain":"Sản phẩm số là kết quả phối hợp của nhiều vai trò.","points":1},{"type":"short","level":"NB","q":"Người tìm lỗi phần mềm trong tiếng Anh gọi là (viết thường)","answer":"tester","explain":"Tester là kiểm thử viên, người tìm lỗi của phần mềm.","points":0.5},{"type":"short","level":"VDC","q":"Người làm việc tự do, nhận dự án từ nhiều khách hàng, trong tiếng Anh gọi là (viết thường)","answer":"freelancer","explain":"Freelancer phổ biến trong cả thiết kế và lập trình.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Giai đoạn đầu tiên khi phát triển một phần mềm là","options":["A. Phân tích yêu cầu người dùng","B. Viết mã lệnh","C. Bán sản phẩm","D. Bảo trì"],"answer":"A","explain":"Phải hiểu nhu cầu trước khi thiết kế và viết code.","points":0.25},{"type":"mcq","level":"NB","q":"Yếu tố nào giúp nhà thiết kế được khách hàng tin tưởng?","options":["A. Sản phẩm đẹp, đúng hẹn và thái độ chuyên nghiệp","B. Giá rẻ nhất","C. Nói nhiều","D. Quen biết"],"answer":"A","explain":"Uy tín đến từ chất lượng, đúng hẹn và tác phong chuyên nghiệp.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao người làm công nghệ phải học hỏi liên tục?","options":["A. Vì công nghệ, công cụ và xu hướng thay đổi rất nhanh","B. Vì thích học","C. Vì bị ép buộc","D. Không cần học liên tục"],"answer":"A","explain":"Công nghệ thay đổi liên tục; ngừng học là tụt hậu.","points":0.25},{"type":"mcq","level":"TH","q":"Đạo đức nghề nghiệp chung của cả hai nghề bao gồm","options":["A. Tôn trọng bản quyền và trung thực với khách hàng","B. Sao chép thoải mái","C. Lừa dối khách hàng","D. Không cần đạo đức"],"answer":"A","explain":"Tôn trọng bản quyền và trung thực là nền tảng đạo đức mọi nghề.","points":0.25},{"type":"mcq","level":"VD","q":"Một học sinh sao chép bài thiết kế của bạn khác để nộp thi. Đây là hành vi","options":["A. Vi phạm đạo đức, thiếu trung thực trong oints":0.25},{"type":"mcq","level":"NB","q":"Nhà thiết kế đồ họa cần có phẩm chất nào?","options":["A. Óc thẩm mỹ và tư duy sáng tạo","B. Sức khỏe phi thường","C. Giọng hát hay","D. Khả năng chạy nhanh"],"answer":"A","explain":"Thẩm mỹ và sáng tạo là phẩm chất cốt lõi của nghề thiết kế.","points":0.25},{"type":"mcq","level":"TH","q":"Học sinh phổ thông muốn thử sức với lập trình nên","options":["A. Học Python và thực hành qua các dự án nhỏ","B. Đợi đến đại học","C. Chỉ đọc lí thuyết","D. Không thể bắt đầu sớm"],"answer":"A","explain":"Bắt đầu sớm với Python và dự án nhỏ là lợi thế lớn.","points":0.25},{"type":"mcq","level":"TH","q":"Học sinh phổ thông muốn thử sức với thiết kế đồ họa nên","options":["A. Học phần mềm miễn phí như Inkscape và thực hành dự án nhỏ","B. Mua phần mềm đắt tiền ngay","C. Chỉ xem không làm","D. Đợi ra trường"],"answer":"A","explain":"Bắt đầu với công cụ miễn phí và dự án nhỏ: thực tế, ít tốn kém.","points":0.25},{"type":"mcq","level":"VD","q":"Lớp bạn cần người thiết kế poster và người làm website cho sự kiện. Cách phân công hợp lí là","options":["A. Bạn khéo vẽ làm poster, bạn giỏi Tin học làm website, phối hợp với nhau","B. Một người làm hết","C. Bốc thăm ngẫu nhiên","D. Thuê ngoài"],"answer":"A","explain":"Phân công theo sở trường và phối hợp cho hiệu quả tốt nhất.","points":0.25},{"type":"mcq","level":"VDC","q":"Một bạn giỏi cả vẽ và Toán nhưng phân vân chọn nghề. Cách giúp bạn quyết định là","options":["A. Tìm hiểu kĩ từng nghề, thử làm dự án nhỏ cả hai mảng rồi so sánh","B. Chọn ngẫu nhiên","C. Nghe theo bạn bè","D. Bỏ cả hai"],"answer":"A","explain":"Trải nghiệm thực tế qua dự án nhỏ là cách tốt nhất để hiểu mình hợp nghề nào.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["Học sinh có thể bắt đầu học lập trình từ phổ thông.","Học sinh có thể bắt đầu học thiết kế từ phổ thông.","Dự án nhỏ giúp tích lũy kinh nghiệm.","Phải đợi đi làm mới được tiếp cận nghề."],"answer":["T","T","T","F"], A","explain":"Cập nhật giúp sửa lỗi, thêm tính năng và vá lỗ hổng bảo mật.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao ấn phẩm quảng cáo cần được thiết kế lại sau một thời gian?","options":["A. Vì thị hiếu thẩm mỹ thay đổi, cần làm mới để thu hút","B. Vì thích thay đổi","C. Vì bắt buộc","D. Không cần thiết kế lại"],"answer":"A","explain":"Xu hướng thẩm mỹ thay đổi; làm mới giúp thương hiệu luôn tươi mới, thu hút.","points":0.25},{"type":"mcq","level":"VD","q":"Một cửa hàng có website cũ, khách hàng phàn nàn khó dùng. Chủ cửa hàng nên","options":["A. Thuê đội ngũ cải thiện giao diện và chức năng dựa trên phản hồi khách","B. Bỏ website","C. Đổ lỗi cho khách hàng","D. Giữ nguyên"],"answer":"A","explain":"Lắng nghe phản hồi và cải thiện là cách nâng cao chất lượng sản phẩm.","points":0.25},{"type":"mcq","level":"VDC","q":"Một thương hiệu lớn thay đổi logo sau 20 năm. Lí do hợp lí nhất là","options":["A. Làm mới hình ảnh phù hợp với thời đại và đối tượng khách hàng mới","B. Logo cũ bị hỏng","C. Thích thì đổi","D. Bắt chước đối thủ"],"answer":"A","explain":"Thương hiệu làm mới nhận diện để phù hợp xu hướng và thế hệ khách hàng mới.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["Phần mềm cần cập nhật để sửa lỗi và bảo mật.","Ấn phẩm cần làm mới theo xu hướng thẩm mỹ.","Phản hồi người dùng giúp cải thiện sản phẩm.","Sản phẩm làm một lần dùng mãi mãi."],"answer":["T","T","T","F"],"explain":"Sản phẩm số cần được duy trì, cải tiến liên tục.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về duy trì sản phẩm.","statements":["Bảo trì phần mềm là công việc lâu dài.","Làm mới thương hiệu giúp thu hút khách hàng.","Lắng nghe người dùng giúp sản phẩm tốt hơn.","Ra mắt xong là hết trách nhiệm."],"answer":["T","T","T","F"],"explain":"Trách nhiệm với sản phẩm kéo dài sau khi ra mắt.","points":1},{"type":"short","level":"NB","q":"Trong dự án phần mềm, người chịu trách nhiệm quản lí tiến độ và phân công công việc viết tắt trong tiếng Anh là (viết hoa)","answer":"PM","explain":"PM (Project Manager) quản lí tiến độ, nhân sự và chất lượng dự án.","points":0.5},{"type":"short","level":"VDC","q":"Nghệ thuật sắp xếp chữ trong thiết kế trong tiếng Anh gọi là (viết thường)","answer":"typography","explain":"Typography là kiến thức nền tảng của nhà thiết kế.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Kĩ năng nào cần thiết cho cả hai nghề thiết kế đồ họa và phát triển phần mềm?","options":["A. Làm việc nhóm và giao tiếp","B. Bơi lội","C. Đá bóng","D. Nấu ăn"],"answer":"A","explain":"Cả hai nghề đều làm theo nhóm dự án nên cần giao tiếp, phối hợp.","points":0.25},{"type":"mcq","level":"NB","q":"Thái độ nào cần có ở người làm nghề công nghệ?","options":["A. Ham học hỏi và kiên trì","B. Lười biếng","C. Bảo thủ","D. Thờ ơ"],"answer":"A","explain":"Công nghệ thay đổi nhanh nên cần ham học hỏi; gỡ lỗi, hoàn thiện sản phẩm cần kiên trì.","points":0.25},{"type":"mcq","level":"TH","q":"Một nhóm dự án gồm 2 nhà thiết kế và 3 lập trình viên. Để dự án suôn sẻ, nhóm cần","options":["A. Thống nhất mục tiêu, phân công rõ và họp trao đổi định kì","B. Mỗi người tự làm","C. Không cần trao đổi","D. Tranh cãi ai quan trọng hơn"],"answer":"A","explain":"Mục tiêu chung, phân công rõ và giao tiếp định kì là nền tảng của nhóm hiệu quả.","points":0.25},{"type":"mcq","level":"TH","q":"Khi có bất đồng ý kiến trong nhóm dự án, cách giải quyết tốt là","options":["A. Thảo luận dựa trên mục tiêu chung và dữ liệu thực tế","B. Cãi nhau to tiếng","C. Bỏ dự án","D. Nghe theo người to tiếng nhất"],"answer":"A","explain":"Giải quyết bất đồng bằng thảo luận lí trí hướng tới mục tiêu chung.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn là trưởng nhóm làm app cho trường. Một thành viên chậm tiến độ ảnh hưởng cả nhóm. Bạn nên","options":["A. Trao đổi riêng, tìm hiểu khó khăn và hỗ trợ hoặc điều chỉnh phân công","B. Mắng mỏ trước cả nhóm","C. Loại khỏi nhóm ngay","D. Làm hộ hết phần của bạn ấy"],"answer":"A","explain":"Lãnh đạo nhóm tốt là hỗ trợ thành viên vượt khó khăn, điều chỉnh hợp lí.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty khởi nghiệp công nghệ chỉ có 5 người nhưng tạo ra sản phẩm thành công. Yếu tố then chốt có thể là","options":["A. Đội ngũ đa năng, phối hợp tốt và tập trung vào nhu cầu người dùng","B. Số lượng nhân viên đông","C. Văn phòng đẹp","D. May mắn duy nhất"],"answer":"A","explain":"Startup thành công nhờ đội ngũ tinh gọn, đa năng và tập trung đúng nhu cầu thị trường.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["Làm việc nhóm cần phân công rõ ràng.","Trao đổi thường xuyên giúp nhóm hiệu quả.","Nên giải quyết bất đồng bằng thảo luận.","Trưởng nhóm tốt biết hỗ trợ thành viên."],"answer":["T","T","T","T"],"explain":"Đây là các nguyên tắc của làm việc nhóm hiệu quả.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về khởi nghiệp.","statements":["Đội ngũ nhỏ nhưng phối hợp tốt có thể thành công.","Tập trung vào nhu cầu người dùng là then chốt.","Ham học hỏi giúp thích ứng với thay đổi.","Thành công chỉ nhờ may mắn."],"answer":["T","T","T","F"],"explain":"Thành công đến từ năng lực, nỗ lực và chiến lược đúng, không chỉ may mắn.","points":1},{"type":"short","level":"NB","q":"Kĩ năng phối hợp với người khác trong công việc gọi là kĩ năng làm việc (điền: nhóm)","answer":"nhóm","explain":"Kĩ năng làm việc nhóm cần thiết cho mọi nghề hiện đại.","points":0.5},{"type":"short","level":"VDC","q":"Công ty mới thành lập trong lĩnh vực công nghệ thường gọi là (tiếng Anh, viết thường)","answer":"startup","explain":"Startup là công ty khởi nghiệp, môi trường năng động của ngành công nghệ.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Hành vi nào vi phạm đạo đức nghề thiết kế?","options":["A. Sao chép tác phẩm của người khác làm sản phẩm của mình","B. Tự sáng tạo tác phẩm gốc","C. Dùng ảnh miễn phí có ghi nguồn","D. Xin phép trước khi dùng tài nguyên"],"answer":"A","explain":"Sao chép tác phẩm người khác là vi phạm bản quyền và đạo đức nghề nghiệp.","points":0.25},{"type":"mcq","level":"NB","q":"Hành vi nào vi phạm đạo đức nghề phát triển phần mềm?","options":["A. Viết mã độc đánh cắp dữ liệu người dùng","B. Viết phần mềm hữu ích","C. Sửa lỗi cho phần mềm","D. Cập nhật tính năng mới"],"answer":"A","explain":"Viết mã độc, đánh cắp dữ liệu là vi phạm pháp luật và đạo đức nghề nghiệp nghiêm trọng.","points":0.25},{"type":"mcq","level":"TH","q":"Một nhà thiết kế dùng ảnh có bản quyền mà không xin phép cho dự án thương mại. Hậu quả có thể là","options":["A. Bị kiện, phải bồi thường và mất uy tín","B. Không sao cả","C. Được khen","D. Được thưởng"],"answer":"A","explain":"Vi phạm bản quyền trong thương mại có thể bị kiện và bồi thường thiệt hại.","points":0.25},{"type":"mcq","level":"TH","q":"Một lập trình viên bán dữ liệu người dùng cho bên thứ ba. Đây là hành vi","options":["A. Vi phạm pháp luật về bảo vệ dữ liệu cá nhân","B. Bình thường trong nghề","C. Được phép","D. Không ai quan tâm"],"answer":"A","explain":"Dữ liệu cá nhân được pháp luật bảo vệ; mua bán trái phép là vi phạm.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn phát hiện website của trường bị lộ thông tin học sinh. Là người học Tin học, bạn nên","options":["A. Báo ngay cho thầy cô, nhà trường để xử lí","B. Khai thác lỗ hổng để nghịch","C. Chia sẻ thông tin cho bạn bè xem","D. Im lặng"],"answer":"A","explain":"Phát hiện sự cố bảo mật thì báo cáo cho người có trách nhiệm, không lợi dụng.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty yêu cầu lập trình viên chèn 'cửa hậu' vào phần mềm để theo dõi người dùng trái phép. Lập trình viên nên","options":["A. Từ chối vì vi phạm pháp luật và đạo đức nghề nghiệp","B. Làm theo vì được trả lương","C. Làm nhưng giấu kín","D. Nghỉ việc trong im lặng"],"answer":"A","explain":"Người làm nghề phải từ chối yêu cầu vi phạm pháp luật, bảo vệ người dùng.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["Sao chép tác phẩm người khác là vi phạm bản quyền.","Viết mã độc là vi phạm pháp luật.","Bán dữ liệu người dùng là vi phạm.","Người làm công nghệ không cần quan tâm đạo đức."],"answer":["T","T","T","F"],"explain":"Đạo đức nghề nghiệp là yêu cầu bắt buộc với người làm công nghệ.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau về ứng xử đúng.","statements":["Phát hiện lỗ hổng bảo mật thì báo cáo người có trách nhiệm.","Từ chối yêu cầu vi phạm pháp luật.","Tôn trọng bản quyền trong mọi sản phẩm.","Lợi dụng lỗ hổng để trục lợi là thông minh."],"answer":["T","T","T","F"],"explain":"Lợi dụng lỗ hổng để trục lợi là hành vi vi phạm pháp luật.","points":1},{"type":"short","level":"NB","q":"Hành vi sao chép tác phẩm của người khác mà không xin phép vi phạm điều gì? (điền: bản quyền)","answer":"bản quyền","explain":"Tôn trọng bản quyền là nghĩa vụ của mọi nghề sáng tạo.","points":0.5},{"type":"short","level":"VDC","q":"Phần mềm độc hại nhằm đánh cắp dữ liệu, phá hoại hệ thống gọi chung là (điền: mã độc)","answer":"mã độc","explain":"Viết mã độc là hành vi vi phạm pháp luật nghiêm trọng.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Để thành công trong nghề công nghệ, yếu tố nào quan trọng nhất?","options":["A. Năng lực thực tế và thái độ học hỏi không ngừng","B. Quen biết rộng","C. May mắn","D. Ngoại hình"],"answer":"A","explain":"Ngành công nghệ đánh giá qua năng lực thực tế; học hỏi liên tục để không tụt hậu.","points":0.25},{"type":"mcq","level":"NB","q":"Học sinh lớp 10 có thể chuẩn bị cho nghề công nghệ bằng cách","options":["A. Học tốt các môn, thực hành dự án nhỏ và tham gia hoạt động Tin học","B. Chờ đến khi ra trường","C. Chỉ học lí thuyết","D. Không cần chuẩn bị"],"answer":"A","explain":"Chuẩn bị sớm với nền tảng vững và trải nghiệm thực tế tạo lợi thế lớn.","points":0.25},{"type":"mcq","level":"TH","q":"Tham gia câu lạc bộ Tin học ở trường giúp học sinh","options":["A. Rèn kĩ năng, giao lưu và định hướng nghề nghiệp","B. Mất thời gian","C. Chỉ để vui chơi","D. Không có ích lợi"],"answer":"A","explain":"CLB là môi trường rèn kĩ năng, giao lưu và khám phá đam mê công nghệ.","points":0.25},{"type":"mcq","level":"TH","q":"Khi chọn nghề nghiệp tương lai, học sinh nên dựa vào","options":["A. Sở thích, năng lực bản thân và nhu cầu xã hội","B. Phong trào của bạn bè","C. Ngẫu nhiên","D. Ý kiến người lạ"],"answer":"A","explain":"Chọn nghề cần cân bằng đam mê, năng lực và cơ hội việc làm thực tế.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn A thích vẽ, bạn B thích lập trình. Cả hai muốn cùng làm một sản phẩm số. Gợi ý phù hợp là","options":["A. Cùng làm website: A thiết kế giao diện, B viết code chức năng","B. Mỗi người làm riêng","C. Chỉ một người làm","D. Bỏ ý định"],"answer":"A","explain":"Phối hợp theo sở trường: thiết kế + lập trình tạo sản phẩm hoàn chỉnh.","points":0.25},{"type":"mcq","level":"VDC","q":"Sau khi học xong Chủ đề 6, một học sinh vẫn chưa biết mình hợp nghề nào. Bước tiếp theo tốt nhất là","options":["A. Tiếp tục thử sức qua các dự án nhỏ, trao đổi với thầy cô và người trong nghề","B. Từ bỏ tìm hiểu","C. Chọn đại một nghề","D. Đợi đến năm cuối cấp"],"answer":"A","explain":"Hướng nghiệp là quá trình: trải nghiệm, trao đổi và điều chỉnh dần.","points":0.25},{"type":"truefalse","level":"TH","q":"Nhận xét các phát biểu sau.","statements":["Nên chọn nghề phù hợp sở thích và năng lực.","Nên tìm hiểu nhu cầu việc làm của xã hội.","Trải nghiệm thực tế giúp hiểu rõ bản thân.","Chọn nghề không cần suy nghĩ."],"answer":["T","T","T","F"],"explain":"Chọn nghề là quyết định quan trọng cần suy nghĩ và tìm hiểu kĩ.","points":1},{"type":"truefalse","level":"VD","q":"Nhận xét các phát biểu sau (tổng hợp chủ đề 6).","statements":["Công nghệ số mở ra nhiều nghề nghiệp mới.","Cần chuẩn bị kiến thức, kĩ năng từ sớm.","Đạo đức nghề nghiệp quan trọng không kém chuyên môn.","Chỉ cần giỏi chuyên môn là đủ thành công."],"answer":["T","T","T","F"],"explain":"Thành công cần cả chuyên môn, kĩ năng mềm và đạo đức nghề nghiệp.","points":1},{"type":"short","level":"NB","q":"Yếu tố giúp người làm nghề công nghệ không bị tụt hậu là học hỏi (điền: liên tục)","answer":"liên tục","explain":"Học hỏi liên tục là yêu cầu sống còn trong ngành công nghệ.","points":0.5},{"type":"short","level":"VDC","q":"Quá trình tìm hiểu bản thân để chọn nghề phù hợp gọi là (điền: hướng nghiệp)","answer":"hướng nghiệp","explain":"Hướng nghiệp giúp chọn nghề phù hợp sở thích, năng lực và nhu cầu xã hội.","points":0.5}]}]}
