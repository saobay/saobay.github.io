{"sets":[{"name":"Đề 1","questions":[{"type":"short","level":"VDC","q":"Vì sao Chính phủ được gọi là cơ quan chấp hành của Quốc hội?","answer":"Vì Chính phủ do Quốc hội bầu ra và tổ chức thi hành Hiến pháp, luật, nghị quyết của Quốc hội","explain":"Theo Điều 94, Chính phủ là cơ quan chấp hành của Quốc hội: do Quốc hội thành lập, chịu trách nhiệm và báo cáo công tác trước Quốc hội, tổ chức thi hành Hiến pháp, luật, nghị quyết của Quốc hội.","lesson":"Bài 21: Quốc hội, Chủ tịch nước, Chính phủ nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.5},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau về đặc điểm của pháp luật:","statements":["a) Tính quy phạm phổ biến nghĩa là pháp luật áp dụng chung cho mọi người.","b) Pháp luật có tính xác định chặt chẽ về mặt hình thức.","c) Pháp luật chỉ điều chỉnh các quan hệ kinh tế.","d) Người vi phạm pháp luật thì không phải chịu hậu quả gì."],"answer":["T","T","F","F"],"explain":"a, b đúng. c sai vì pháp luật điều chỉnh mọi lĩnh vực của đời sống xã hội. d sai vì vi phạm pháp luật phải chịu trách nhiệm pháp lí.","lesson":"Bài 11: Khái niệm, đặc điểm và vai trò của pháp luật","points":1},{"type":"mcq","level":"TH","q":"Vì sao nói pháp luật có tính quy phạm phổ biến?","options":["A. Vì pháp luật là khuôn mẫu chung, bắt buộc mọi người phải tuân theo.","B. Vì pháp luật chỉ áp dụng đối với cán bộ, công chức.","C. Vì pháp luật do mọi người tự đặt ra cho mình.","D. Vì pháp luật không mang tính bắt buộc."],"answer":"A","explain":"Tính quy phạm phổ biến nghĩa là pháp luật là khuôn mẫu, chuẩn mực chung cho mọi cá nhân, tổ chức phải tuân theo.","lesson":"Bài 11: Khái niệm, đặc điểm và vai trò của pháp luật","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau:","statements":["a) Ở nước ta, các quyền con người, quyền công dân được công nhận, tôn trọng, bảo vệ, bảo đảm (Điều 14).","b) Mọi người đều bình đẳng trước pháp luật (Điều 16).","c) Công dân có quyền khiếu nại, tố cáo với cơ quan nhà nước.","d) Công dân chỉ có quyền mà không có nghĩa vụ."],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Chương II Hiến pháp 2013. d sai vì công dân vừa có quyền vừa có nghĩa vụ cơ bản.","lesson":"Bài 16: Quyền con người, quyền và nghĩa vụ cơ bản của công dân trong Hiến pháp","points":1},{"type":"short","level":"VD","q":"Cấp chính quyền địa phương gồm những cơ quan nào?","answer":"Hội đồng nhân dân và Ủy ban nhân dân","explain":"Điều 111 Hiến pháp 2013: Cấp chính quyền địa phương gồm có Hội đồng nhân dân và Ủy ban nhân dân.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5},{"type":"mcq","level":"VDC","q":"Kinh tế nhà nước giữ vai trò chủ đạo trong nền kinh tế thị trường định hướng xã hội chủ nghĩa. Biểu hiện của vai trò chủ đạo là:","options":["A. Nắm giữ các ngành, lĩnh vực then chốt của nền kinh tế.","B. Chiếm 100% GDP của đất nước.","C. Loại bỏ hoàn toàn kinh tế tư nhân.","D. Không cần thể hiện vai trò gì trong thực tế."],"answer":"A","explain":"Theo Điều 51, kinh tế nhà nước giữ vai trò chủ đạo, biểu hiện ở việc nắm giữ các ngành, lĩnh vực then chốt, chi phối các thành phần kinh tế khác.","lesson":"Bài 17: Nội dung cơ bản của Hiến pháp về kinh tế, văn hóa, xã hội, giáo dục, khoa học, công nghệ, môi trường","points":0.25},{"type":"mcq","level":"VD","q":"Nghị định của Chính phủ có hiệu lực pháp lí như thế nào so với luật của Quốc hội?","options":["A. Thấp hơn luật và phải phù hợp với luật.","B. Cao hơn luật.","C. Ngang bằng với Hiến pháp.","D. Không có mối liên hệ gì với luật."],"answer":"A","explain":"Trong thứ bậc hiệu lực, nghị định của Chính phủ thấp hơn luật của Quốc hội nên phải phù hợp, không được trái với luật.","lesson":"Bài 12: Hệ thống pháp luật và văn bản pháp luật Việt Nam","points":0.25},{"type":"mcq","level":"NB","q":"Hệ thống chính trị nước Cộng hòa xã hội chủ nghĩa Việt Nam gồm những thành tố nào?","options":["A. Đảng Cộng sản Việt Nam, Nhà nước, Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị – xã hội.","B. Chỉ có Đảng Cộng sản Việt Nam.","C. Chỉ có Nhà nước.","D. Các đảng phái thay nhau cầm quyền."],"answer":"A","explain":"Hệ thống chính trị Việt Nam gồm: Đảng Cộng sản Việt Nam, Nhà nước CHXHCN Việt Nam, Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị – xã hội.","lesson":"Bài 19: Đặc điểm, cấu trúc và nguyên tắc hoạt động của hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"mcq","level":"TH","q":"Theo Điều 27 Hiến pháp 2013, công dân đủ bao nhiêu tuổi thì có quyền bầu cử, đủ bao nhiêu tuổi thì có quyền ứng cử?","options":["A. Đủ 18 tuổi có quyền bầu cử, đủ 21 tuổi có quyền ứng cử.","B. Đủ 16 tuổi có quyền bầu cử, đủ 18 tuổi có quyền ứng cử.","C. Đủ 21 tuổi có quyền bầu cử, đủ 25 tuổi có quyền ứng cử.","D. Đủ 14 tuổi có quyền bầu cử, đủ 18 tuổi có quyền ứng cử."],"answer":"A","explain":"Điều 27: Công dân đủ mười tám tuổi trở lên có quyền bầu cử và đủ hai mươi mốt tuổi trở lên có quyền ứng cử vào Quốc hội, Hội đồng nhân dân.","lesson":"Bài 16: Quyền con người, quyền và nghĩa vụ cơ bản của công dân trong Hiến pháp","points":0.25},{"type":"mcq","level":"NB","q":"Người đứng đầu Nhà nước, thay mặt nước Cộng hòa xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại là ai?","options":["A. Chủ tịch nước.","B. Thủ tướng Chính phủ.","C. Chủ tịch Quốc hội.","D. Chánh án Tòa án nhân dân tối cao."],"answer":"A","explain":"Điều 86 Hiến pháp 2013: Chủ tịch nước là người đứng đầu Nhà nước, thay mặt nước Cộng hòa xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại.","lesson":"Bài 21: Quốc hội, Chủ tịch nước, Chính phủ nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25}]},{"name":"Đề 2","questions":[{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau về Hiến pháp:","statements":["a) Hiến pháp là đạo luật cơ bản của Nhà nước.","b) Việt Nam đã có 5 bản Hiến pháp: 1946, 1959, 1980, 1992 và 2013.","c) Hiến pháp 2013 là bản Hiến pháp đầu tiên của Việt Nam.","d) Hiến pháp quy định những vấn đề cơ bản nhất của đất nước."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai vì bản Hiến pháp đầu tiên của Việt Nam là Hiến pháp 1946.","lesson":"Bài 14: Giới thiệu về Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":1},{"type":"mcq","level":"VD","q":"Theo Điều 94 Hiến pháp 2013, Chính phủ là cơ quan nào?","options":["A. Cơ quan hành chính nhà nước cao nhất, thực hiện quyền hành pháp, là cơ quan chấp hành của Quốc hội.","B. Cơ quan quyền lực nhà nước cao nhất.","C. Cơ quan xét xử của Nhà nước.","D. Cơ quan thực hiện quyền lập pháp."],"answer":"A","explain":"Điều 94: Chính phủ là cơ quan hành chính nhà nước cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam, thực hiện quyền hành pháp, là cơ quan chấp hành của Quốc hội.","lesson":"Bài 21: Quốc hội, Chủ tịch nước, Chính phủ nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"mcq","level":"NB","q":"Thực hiện pháp luật được hiểu là gì?","options":["A. Hành vi của chủ thể phù hợp với quy định của pháp luật.","B. Hành vi trái với quy định của pháp luật.","C. Hành vi không liên quan đến pháp luật.","D. Chỉ là việc ban hành pháp luật của Nhà nước."],"answer":"A","explain":"Thực hiện pháp luật là hành vi (hành động hoặc không hành động) của chủ thể phù hợp với quy định của pháp luật.","lesson":"Bài 13: Thực hiện pháp luật","points":0.25},{"type":"short","level":"VD","q":"Nêu hai đặc điểm cơ bản của pháp luật.","answer":"Tính quy phạm phổ biến; tính được bảo đảm thực hiện bằng Nhà nước","explain":"Ba đặc điểm cơ bản của pháp luật: tính quy phạm phổ biến; tính xác định chặt chẽ về mặt hình thức; tính được bảo đảm thực hiện bằng Nhà nước.","lesson":"Bài 11: Khái niệm, đặc điểm và vai trò của pháp luật","points":0.5},{"type":"mcq","level":"TH","q":"Nhiệm kỳ của Quốc hội là bao nhiêu năm?","options":["A. 5 năm.","B. 4 năm.","C. 3 năm.","D. 6 năm."],"answer":"A","explain":"Nhiệm kỳ của Quốc hội là 5 năm, cùng nhiệm kỳ với HĐND các cấp.","lesson":"Bài 21: Quốc hội, Chủ tịch nước, Chính phủ nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"short","level":"VDC","q":"Vì sao quyền bầu cử, ứng cử được xem là quyền chính trị cơ bản của công dân?","answer":"Vì đó là hình thức để Nhân dân tham gia quản lí nhà nước, thực hiện quyền làm chủ","explain":"Thông qua bầu cử, ứng cử, Nhân dân trực tiếp tham gia vào việc thành lập các cơ quan quyền lực nhà nước, thực hiện quyền làm chủ của mình.","lesson":"Bài 16: Quyền con người, quyền và nghĩa vụ cơ bản của công dân trong Hiến pháp","points":0.5},{"type":"mcq","level":"NB","q":"Theo Điều 16 Hiến pháp 2013:","options":["A. Mọi người đều bình đẳng trước pháp luật.","B. Chỉ cán bộ, công chức mới bình đẳng trước pháp luật.","C. Người giàu có nhiều quyền hơn người nghèo.","D. Không ai được bình đẳng trước pháp luật."],"answer":"A","explain":"Điều 16: Mọi người đều bình đẳng trước pháp luật. Không ai bị phân biệt đối xử trong đời sống chính trị, dân sự, kinh tế, văn hóa, xã hội.","lesson":"Bài 16: Quyền con người, quyền và nghĩa vụ cơ bản của công dân trong Hiến pháp","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên tắc xét xử của Tòa án nhân dân là:","options":["A. Thẩm phán, Hội thẩm xét xử độc lập và chỉ tuân theo pháp luật.","B. Xét xử theo ý chí chủ quan của cá nhân.","C. Chịu sự chỉ đạo của Ủy ban nhân dân.","D. Không cần tuân theo pháp luật."],"answer":"A","explain":"Nguyên tắc hiến định: Thẩm phán, Hội thẩm xét xử độc lập và chỉ tuân theo pháp luật; nghiêm cấm cơ quan, tổ chức, cá nhân can thiệp vào việc xét xử.","lesson":"Bài 22: Tòa án nhân dân và Viện kiểm sát nhân dân","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau:","statements":["a) Tính thống nhất của bộ máy nhà nước thể hiện ở sự thống nhất của quyền lực nhà nước thuộc về Nhân dân.","b) Nguyên tắc pháp chế đòi hỏi xử lí nghiêm mọi hành vi vi phạm pháp luật.","c) Cơ quan nhà nước cấp dưới không phải chấp hành quyết định của cơ quan cấp trên.","d) Nhân dân có quyền giám sát hoạt động của bộ máy nhà nước."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai vì theo nguyên tắc tập trung dân chủ, cấp dưới phải phục tùng cấp trên.","lesson":"Bài 20: Đặc điểm, nguyên tắc tổ chức và hoạt động của bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":1},{"type":"mcq","level":"VDC","q":"Quốc hội thực hiện quyền giám sát tối cao đối với toàn bộ hoạt động của Nhà nước. Biểu hiện cụ thể là:","options":["A. Chất vấn, xem xét báo cáo công tác của Chủ tịch nước, Chính phủ, Tòa án, Viện kiểm sát; bỏ phiếu tín nhiệm.","B. Trực tiếp điều hành công việc của Chính phủ.","C. Xét xử các vụ án lớn.","D. Ban hành nghị định thay Chính phủ."],"answer":"A","explain":"Giám sát tối cao của Quốc hội thể hiện qua: xem xét báo cáo công tác, chất vấn, bỏ phiếu tín nhiệm đối với người giữ chức vụ do Quốc hội bầu hoặc phê chuẩn.","lesson":"Bài 21: Quốc hội, Chủ tịch nước, Chính phủ nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Pháp luật là hệ thống các quy tắc xử sự chung do ai ban hành và bảo đảm thực hiện?","options":["A. Nhà nước.","B. Tổ chức xã hội.","C. Dòng họ.","D. Cá nhân."],"answer":"A","explain":"Pháp luật là hệ thống các quy tắc xử sự chung do Nhà nước ban hành (hoặc thừa nhận) và được bảo đảm thực hiện bằng quyền lực nhà nước.","lesson":"Bài 11: Khái niệm, đặc điểm và vai trò của pháp luật","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau:","statements":["a) Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát (Điều 2).","b) Quốc hội thực hiện quyền lập pháp, Chính phủ thực hiện quyền hành pháp, Tòa án thực hiện quyền tư pháp.","c) Mọi quyền lực nhà nước đều tập trung vào Chính phủ.","d) Nhân dân thực hiện quyền lực nhà nước bằng hình thức dân chủ trực tiếp và dân chủ đại diện."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai vì quyền lực nhà nước thuộc về Nhân dân và được phân công, phối hợp, kiểm soát giữa các cơ quan.","lesson":"Bài 15: Nội dung cơ bản của Hiến pháp về chế độ chính trị","points":1},{"type":"mcq","level":"TH","q":"Nguyên tắc tổ chức và hoạt động của bộ máy nhà nước ta theo Hiến pháp 2013 là:","options":["A. Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước.","B. Phân lập quyền lực tuyệt đối giữa các cơ quan.","C. Mỗi cơ quan hoạt động hoàn toàn độc lập, không phối hợp.","D. Không có nguyên tắc tổ chức chung nào."],"answer":"A","explain":"Điều 2 khoản 3 Hiến pháp 2013: Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp.","lesson":"Bài 18: Nội dung cơ bản của Hiến pháp về bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"mcq","level":"VD","q":"So sánh pháp luật với đạo đức, điểm khác biệt cơ bản nhất là:","options":["A. Pháp luật được bảo đảm thực hiện bằng quyền lực nhà nước, mang tính bắt buộc chung.","B. Đạo đức có tính bắt buộc cao hơn pháp luật.","C. Pháp luật không điều chỉnh các quan hệ xã hội.","D. Đạo đức do Nhà nước ban hành."],"answer":"A","explain":"Điểm khác biệt cơ bản: pháp luật do Nhà nước ban hành và được bảo đảm thực hiện bằng quyền lực nhà nước (cưỡng chế), còn đạo đức được điều chỉnh bằng dư luận xã hội và lương tâm.","lesson":"Bài 11: Khái niệm, đặc điểm và vai trò của pháp luật","points":0.25},{"type":"mcq","level":"TH","q":"Nhiệm kỳ của Hội đồng nhân dân các cấp là bao nhiêu năm?","options":["A. 5 năm.","B. 4 năm.","C. 3 năm.","D. 2 năm."],"answer":"A","explain":"Nhiệm kỳ của Hội đồng nhân dân là 5 năm.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"short","level":"VDC","q":"Nêu nội dung cơ bản của Điều 2 Hiến pháp 2013 về bản chất Nhà nước ta.","answer":"Nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân; tất cả quyền lực nhà nước thuộc về Nhân dân","explain":"Điều 2: Nhà nước CHXHCN Việt Nam là Nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân; tất cả quyền lực nhà nước thuộc về Nhân dân.","lesson":"Bài 15: Nội dung cơ bản của Hiến pháp về chế độ chính trị","points":0.5},{"type":"mcq","level":"NB","q":"Văn bản quy phạm pháp luật là văn bản do ai ban hành?","options":["A. Cơ quan nhà nước có thẩm quyền.","B. Tổ chức xã hội.","C. Doanh nghiệp.","D. Cá nhân."],"answer":"A","explain":"Văn bản quy phạm pháp luật là văn bản do cơ quan nhà nước có thẩm quyền ban hành theo trình tự, thủ tục luật định, trong đó có các quy tắc xử sự chung.","lesson":"Bài 12: Hệ thống pháp luật và văn bản pháp luật Việt Nam","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau:","statements":["a) HĐND là cơ quan quyền lực nhà nước ở địa phương (Điều 113).","b) UBND là cơ quan hành chính nhà nước ở địa phương (Điều 114).","c) HĐND do UBND cùng cấp bầu ra.","d) UBND gồm Chủ tịch, Phó Chủ tịch và các Ủy viên."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai vì HĐND do Nhân dân địa phương bầu ra; UBND mới do HĐND cùng cấp bầu ra.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1},{"type":"mcq","level":"VDC","q":"Vì sao Hiến pháp 2013 quy định Đảng Cộng sản Việt Nam chịu trách nhiệm trước Nhân dân về những quyết định của mình?","options":["A. Vì Đảng là lực lượng lãnh đạo Nhà nước và xã hội nên phải chịu sự giám sát và chịu trách nhiệm trước Nhân dân.","B. Vì Đảng không có vai trò gì trong hệ thống chính trị.","C. Vì Nhân dân là lực lượng lãnh đạo Đảng.","D. Quy định này chỉ mang tính hình thức, không có ý nghĩa."],"answer":"A","explain":"Điều 4 quy định Đảng lãnh đạo Nhà nước và xã hội; đồng thời Đảng chịu trách nhiệm trước Nhân dân về những quyết định của mình — thể hiện sự kiểm soát quyền lực và bản chất nhân dân của chế độ.","lesson":"Bài 15: Nội dung cơ bản của Hiến pháp về chế độ chính trị","points":0.25},{"type":"short","level":"VD","q":"Kể tên bốn cơ quan trong bộ máy nhà nước theo Hiến pháp 2013.","answer":"Quốc hội, Chủ tịch nước, Chính phủ, Tòa án nhân dân","explain":"Bộ máy nhà nước gồm: Quốc hội, Chủ tịch nước, Chính phủ, Tòa án nhân dân, Viện kiểm sát nhân dân, chính quyền địa phương, Hội đồng bầu cử quốc gia, Kiểm toán nhà nước.","lesson":"Bài 18: Nội dung cơ bản của Hiến pháp về bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.5}]},{"name":"Đề 4","questions":[{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau:","statements":["a) Vi phạm pháp luật là hành vi trái pháp luật, có lỗi.","b) Người chưa thành niên thì không bao giờ phải chịu trách nhiệm pháp lí.","c) Trách nhiệm hình sự là một loại trách nhiệm pháp lí.","d) Mọi hành vi trái đạo đức đều là vi phạm pháp luật."],"answer":["T","F","T","F"],"explain":"a, c đúng. b sai vì người chưa thành niên trong một số trường hợp vẫn phải chịu trách nhiệm pháp lí theo luật định. d sai vì vi phạm đạo đức chưa hẳn là vi phạm pháp luật.","lesson":"Bài 13: Thực hiện pháp luật","points":1},{"type":"short","level":"VD","q":"Nêu bốn hình thức thực hiện pháp luật.","answer":"Tuân thủ, thi hành, sử dụng và áp dụng pháp luật","explain":"Bốn hình thức thực hiện pháp luật: tuân thủ pháp luật, thi hành pháp luật, sử dụng pháp luật và áp dụng pháp luật.","lesson":"Bài 13: Thực hiện pháp luật","points":0.5},{"type":"mcq","level":"VD","q":"Vì sao mọi văn bản pháp luật khác đều phải phù hợp với Hiến pháp?","options":["A. Vì Hiến pháp là đạo luật cơ bản, có hiệu lực pháp lí cao nhất.","B. Vì Hiến pháp do chính quyền địa phương ban hành.","C. Vì Hiến pháp không phải là văn bản quan trọng.","D. Vì mọi văn bản pháp luật đều ngang bằng nhau."],"answer":"A","explain":"Hiến pháp có hiệu lực pháp lí cao nhất nên mọi văn bản quy phạm pháp luật khác đều phải phù hợp, không được trái với Hiến pháp.","lesson":"Bài 14: Giới thiệu về Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"mcq","level":"NB","q":"Theo Điều 113 Hiến pháp 2013, HĐND là cơ quan quyền lực nhà nước ở cấp nào?","options":["A. Ở địa phương.","B. Ở trung ương.","C. Ở nước ngoài.","D. Không xác định cấp."],"answer":"A","explain":"Điều 113: Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương, đại diện cho ý chí, nguyện vọng và quyền làm chủ của Nhân dân.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"TH","q":"Theo Điều 53 Hiến pháp 2013, đất đai thuộc sở hữu của ai?","options":["A. Sở hữu toàn dân, do Nhà nước đại diện chủ sở hữu và thống nhất quản lí.","B. Sở hữu tư nhân của người đang sử dụng.","C. Sở hữu của tổ chức, cá nhân nào đăng ký trước.","D. Không thuộc sở hữu của ai."],"answer":"A","explain":"Điều 53: Đất đai là tài nguyên đặc biệt của quốc gia; đất đai thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu và thống nhất quản lí.","lesson":"Bài 17: Nội dung cơ bản của Hiến pháp về kinh tế, văn hóa, xã hội, giáo dục, khoa học, công nghệ, môi trường","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao các văn bản quy phạm pháp luật phải được sắp xếp theo thứ bậc hiệu lực pháp lí?","options":["A. Để bảo đảm tính thống nhất của hệ thống pháp luật: văn bản dưới không được trái với văn bản trên.","B. Để văn bản dưới có thể thay thế văn bản trên.","C. Chỉ để thuận tiện cho việc tra cứu.","D. Không có ý nghĩa thực tiễn."],"answer":"A","explain":"Thứ bậc hiệu lực bảo đảm tính thống nhất, đồng bộ của hệ thống pháp luật: văn bản của cơ quan cấp dưới, văn bản có hiệu lực thấp hơn không được trái với văn bản của cơ quan cấp trên, văn bản có hiệu lực cao hơn.","lesson":"Bài 12: Hệ thống pháp luật và văn bản pháp luật Việt Nam","points":0.25},{"type":"short","level":"VDC","q":"Nêu ý nghĩa của quy định đất đai thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu.","answer":"Bảo đảm đất đai được quản lí, sử dụng hiệu quả vì lợi ích chung của quốc gia","explain":"Quy định này bảo đảm đất đai — tài nguyên đặc biệt của quốc gia — được quản lí thống nhất, sử dụng hiệu quả vì lợi ích chung, ngăn ngừa tư nhân hóa tài nguyên quốc gia.","lesson":"Bài 17: Nội dung cơ bản của Hiến pháp về kinh tế, văn hóa, xã hội, giáo dục, khoa học, công nghệ, môi trường","points":0.5},{"type":"mcq","level":"TH","q":"Theo Điều 4 Hiến pháp 2013, lực lượng lãnh đạo Nhà nước và xã hội là:","options":["A. Đảng Cộng sản Việt Nam.","B. Mặt trận Tổ quốc Việt Nam.","C. Đoàn Thanh niên Cộng sản Hồ Chí Minh.","D. Tổng Liên đoàn Lao động Việt Nam."],"answer":"A","explain":"Điều 4 Hiến pháp 2013: Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Nhà nước và xã hội.","lesson":"Bài 15: Nội dung cơ bản của Hiến pháp về chế độ chính trị","points":0.25},{"type":"mcq","level":"NB","q":"Bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam là:","options":["A. Hệ thống các cơ quan nhà nước từ trung ương đến địa phương.","B. Chỉ gồm Quốc hội.","C. Chỉ gồm Chính phủ.","D. Hệ thống các doanh nghiệp nhà nước."],"answer":"A","explain":"Bộ máy nhà nước là hệ thống các cơ quan nhà nước từ trung ương đến địa phương được tổ chức và hoạt động theo những nguyên tắc thống nhất.","lesson":"Bài 20: Đặc điểm, nguyên tắc tổ chức và hoạt động của bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau:","statements":["a) Hiến pháp 2013 được thông qua ngày 28/11/2013 và có hiệu lực từ 01/01/2014.","b) Hiến pháp chỉ quy định về tổ chức bộ máy nhà nước.","c) Mọi văn bản quy phạm pháp luật đều không được trái với Hiến pháp.","d) Hiến pháp có hiệu lực pháp lí thấp hơn luật."],"answer":["T","F","T","F"],"explain":"a, c đúng. b sai vì Hiến pháp còn quy định chế độ chính trị, quyền con người, quyền và nghĩa vụ công dân... d sai vì Hiến pháp có hiệu lực pháp lí cao nhất.","lesson":"Bài 14: Giới thiệu về Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Hiến pháp được hiểu là gì?","options":["A. Đạo luật cơ bản của Nhà nước, có hiệu lực pháp lí cao nhất.","B. Một loại nghị định của Chính phủ.","C. Văn bản quy phạm pháp luật của địa phương.","D. Hương ước của làng, xã."],"answer":"A","explain":"Hiến pháp là đạo luật cơ bản của Nhà nước, có hiệu lực pháp lí cao nhất, quy định những vấn đề cơ bản nhất của đất nước.","lesson":"Bài 14: Giới thiệu về Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"mcq","level":"NB","q":"Theo Điều 51 Hiến pháp 2013, nền kinh tế nước ta là nền kinh tế nào?","options":["A. Nền kinh tế thị trường định hướng xã hội chủ nghĩa với nhiều hình thức sở hữu, nhiều thành phần kinh tế.","B. Nền kinh tế kế hoạch hóa tập trung bao cấp.","C. Nền kinh tế thị trường tự do hoàn toàn.","D. Nền kinh tế chỉ có sở hữu tư nhân."],"answer":"A","explain":"Điều 51: Nền kinh tế Việt Nam là nền kinh tế thị trường định hướng xã hội chủ nghĩa với nhiều hình thức sở hữu, nhiều thành phần kinh tế.","lesson":"Bài 17: Nội dung cơ bản của Hiến pháp về kinh tế, văn hóa, xã hội, giáo dục, khoa học, công nghệ, môi trường","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác biệt giữa sử dụng pháp luật và thi hành pháp luật là:","options":["A. Sử dụng pháp luật là thực hiện quyền của mình; thi hành pháp luật là thực hiện nghĩa vụ của mình.","B. Hai hình thức này hoàn toàn giống nhau.","C. Sử dụng pháp luật chỉ dành cho cơ quan nhà nước.","D. Thi hành pháp luật là không làm gì cả."],"answer":"A","explain":"Sử dụng pháp luật: chủ thể thực hiện quyền của mình (làm những việc pháp luật cho phép). Thi hành pháp luật: chủ thể chủ động thực hiện nghĩa vụ (làm những việc pháp luật yêu cầu).","lesson":"Bài 13: Thực hiện pháp luật","points":0.25},{"type":"short","level":"VDC","q":"Kể tên ba loại văn bản quy phạm pháp luật do Quốc hội, Ủy ban Thường vụ Quốc hội và Chính phủ ban hành.","answer":"Luật, pháp lệnh, nghị định","explain":"Quốc hội ban hành luật, bộ luật, nghị quyết; Ủy ban Thường vụ Quốc hội ban hành pháp lệnh, nghị quyết; Chính phủ ban hành nghị định.","lesson":"Bài 12: Hệ thống pháp luật và văn bản pháp luật Việt Nam","points":0.5},{"type":"mcq","level":"TH","q":"Theo Điều 86 Hiến pháp 2013, Chủ tịch nước là:","options":["A. Người đứng đầu Nhà nước, thay mặt nước Cộng hòa xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại.","B. Người đứng đầu Chính phủ.","C. Người đứng đầu Quốc hội.","D. Người đứng đầu Tòa án nhân dân tối cao."],"answer":"A","explain":"Điều 86: Chủ tịch nước là người đứng đầu Nhà nước, thay mặt nước Cộng hòa xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại.","lesson":"Bài 21: Quốc hội, Chủ tịch nước, Chính phủ nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau:","statements":["a) Quốc hội thực hiện quyền lập hiến, lập pháp.","b) Chính phủ gồm Thủ tướng, các Phó Thủ tướng, các Bộ trưởng và Thủ trưởng cơ quan ngang bộ.","c) Chủ tịch nước là người đứng đầu Chính phủ.","d) Quốc hội quyết định các vấn đề quan trọng của đất nước."],"answer":["T","T","F","T"],"explain":"a, b, d đúng theo Hiến pháp 2013. c sai vì người đứng đầu Chính phủ là Thủ tướng Chính phủ; Chủ tịch nước là người đứng đầu Nhà nước.","lesson":"Bài 21: Quốc hội, Chủ tịch nước, Chính phủ nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":1},{"type":"mcq","level":"VD","q":"Mặt trận Tổ quốc Việt Nam có vai trò gì trong hệ thống chính trị?","options":["A. Tập hợp, đoàn kết Nhân dân; thực hiện giám sát, phản biện xã hội; tham gia xây dựng Đảng, Nhà nước.","B. Lãnh đạo Nhà nước thay cho Đảng.","C. Xét xử các vụ án.","D. Ban hành luật."],"answer":"A","explain":"Mặt trận Tổ quốc Việt Nam là tổ chức liên minh chính trị, tập hợp, đoàn kết Nhân dân; thực hiện dân chủ, tăng cường đồng thuận xã hội; giám sát, phản biện xã hội; tham gia xây dựng Đảng, Nhà nước.","lesson":"Bài 19: Đặc điểm, cấu trúc và nguyên tắc hoạt động của hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao Hiến pháp 2013 quy định Thẩm phán xét xử độc lập và chỉ tuân theo pháp luật?","options":["A. Để bảo đảm tính khách quan, công bằng của hoạt động xét xử, không bị can thiệp trái pháp luật.","B. Để Thẩm phán muốn xử thế nào cũng được.","C. Để Tòa án đứng trên pháp luật.","D. Quy định này không có ý nghĩa thực tiễn."],"answer":"A","explain":"Xét xử độc lập, chỉ tuân theo pháp luật là bảo đảm quan trọng để Tòa án xét xử khách quan, công bằng, đúng pháp luật, bảo vệ công lí.","lesson":"Bài 22: Tòa án nhân dân và Viện kiểm sát nhân dân","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau về hệ thống chính trị:","statements":["a) Đảng Cộng sản Việt Nam là lực lượng duy nhất lãnh đạo Nhà nước và xã hội.","b) Nhà nước là trụ cột của hệ thống chính trị, thực hiện quản lí xã hội bằng pháp luật.","c) Các tổ chức chính trị – xã hội hoạt động độc lập, không liên quan đến sự lãnh đạo của Đảng.","d) Nhân dân là chủ thể của quyền lực nhà nước trong hệ thống chính trị."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai vì các tổ chức chính trị – xã hội hoạt động dưới sự lãnh đạo của Đảng.","lesson":"Bài 19: Đặc điểm, cấu trúc và nguyên tắc hoạt động của hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam","points":1},{"type":"short","level":"VD","q":"Nêu hai nghĩa vụ cơ bản của công dân theo Hiến pháp 2013.","answer":"Trung thành với Tổ quốc; bảo vệ Tổ quốc","explain":"Các nghĩa vụ cơ bản của công dân: trung thành với Tổ quốc (Điều 44), bảo vệ Tổ quốc (Điều 45), học tập (Điều 39), nộp thuế theo luật định (Điều 47)...","lesson":"Bài 16: Quyền con người, quyền và nghĩa vụ cơ bản của công dân trong Hiến pháp","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"VD","q":"Quyền lực nhà nước ở Việt Nam được tổ chức theo nguyên tắc nào?","options":["A. Thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp.","B. Phân lập tuyệt đối ba quyền lập pháp, hành pháp, tư pháp.","C. Tập trung toàn bộ vào một cơ quan duy nhất.","D. Không theo nguyên tắc tổ chức nào."],"answer":"A","explain":"Điều 2 khoản 3 Hiến pháp 2013: Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp.","lesson":"Bài 15: Nội dung cơ bản của Hiến pháp về chế độ chính trị","points":0.25},{"type":"short","level":"VDC","q":"Nêu ba nội dung cơ bản mà Hiến pháp 2013 quy định.","answer":"Chế độ chính trị; quyền con người, quyền và nghĩa vụ cơ bản của công dân; tổ chức và hoạt động của bộ máy nhà nước","explain":"Hiến pháp 2013 quy định những vấn đề cơ bản nhất: chế độ chính trị; quyền con người, quyền và nghĩa vụ cơ bản của công dân; tổ chức và hoạt động của bộ máy nhà nước.","lesson":"Bài 14: Giới thiệu về Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.5},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau về văn bản pháp luật:","statements":["a) Hiến pháp là văn bản có hiệu lực pháp lí cao nhất.","b) Mọi cơ quan, tổ chức đều có quyền ban hành văn bản quy phạm pháp luật.","c) Nghị quyết của HĐND là văn bản quy phạm pháp luật ở địa phương.","d) Thông tư do Bộ trưởng ban hành."],"answer":["T","F","T","T"],"explain":"a, c, d đúng. b sai vì chỉ cơ quan nhà nước có thẩm quyền theo luật định mới được ban hành văn bản quy phạm pháp luật.","lesson":"Bài 12: Hệ thống pháp luật và văn bản pháp luật Việt Nam","points":1},{"type":"mcq","level":"TH","q":"Việc Quốc hội chất vấn Chính phủ tại các kỳ họp thể hiện nguyên tắc nào trong tổ chức bộ máy nhà nước?","options":["A. Kiểm soát quyền lực giữa các cơ quan nhà nước.","B. Tập trung dân chủ.","C. Phân lập quyền lực tuyệt đối.","D. Không thể hiện nguyên tắc nào."],"answer":"A","explain":"Chất vấn là hình thức giám sát tối cao của Quốc hội đối với Chính phủ, thể hiện sự kiểm soát quyền lực giữa các cơ quan nhà nước.","lesson":"Bài 20: Đặc điểm, nguyên tắc tổ chức và hoạt động của bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"mcq","level":"NB","q":"Cơ quan quyền lực nhà nước cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam là:","options":["A. Quốc hội.","B. Chính phủ.","C. Tòa án nhân dân tối cao.","D. Chủ tịch nước."],"answer":"A","explain":"Điều 69 Hiến pháp 2013: Quốc hội là cơ quan đại biểu cao nhất của Nhân dân, cơ quan quyền lực nhà nước cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam.","lesson":"Bài 18: Nội dung cơ bản của Hiến pháp về bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"mcq","level":"VDC","q":"Đánh giá nhận định: HĐND và UBND là hai cơ quan hoàn toàn độc lập, không có quan hệ gì với nhau.","options":["A. Sai, vì UBND do HĐND cùng cấp bầu ra, tổ chức thực hiện nghị quyết của HĐND và chịu sự giám sát của HĐND.","B. Đúng, hai cơ quan hoạt động riêng rẽ.","C. Đúng một phần, chỉ liên quan về mặt hành chính.","D. Không xác định được vì thiếu căn cứ."],"answer":"A","explain":"HĐND và UBND có mối quan hệ chặt chẽ: HĐND bầu ra UBND; UBND chấp hành, chịu trách nhiệm, báo cáo trước HĐND; HĐND giám sát UBND (Điều 113, 114).","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"short","level":"VD","q":"Kể tên ba tổ chức chính trị – xã hội trong hệ thống chính trị Việt Nam.","answer":"Công đoàn, Đoàn Thanh niên Cộng sản Hồ Chí Minh, Hội Liên hiệp Phụ nữ","explain":"Các tổ chức chính trị – xã hội: Tổng Liên đoàn Lao động Việt Nam, Đoàn TNCS Hồ Chí Minh, Hội Nông dân Việt Nam, Hội Liên hiệp Phụ nữ Việt Nam, Hội Cựu chiến binh Việt Nam...","lesson":"Bài 19: Đặc điểm, cấu trúc và nguyên tắc hoạt động của hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam","points":0.5},{"type":"mcq","level":"TH","q":"Vai trò của Đảng Cộng sản Việt Nam trong hệ thống chính trị là:","options":["A. Lực lượng lãnh đạo Nhà nước và xã hội.","B. Lực lượng đối lập với Nhà nước.","C. Không có vai trò gì.","D. Chỉ lãnh đạo lĩnh vực kinh tế."],"answer":"A","explain":"Theo Điều 4 Hiến pháp 2013, Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Nhà nước và xã hội.","lesson":"Bài 19: Đặc điểm, cấu trúc và nguyên tắc hoạt động của hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"mcq","level":"NB","q":"Theo Điều 2 Hiến pháp 2013, Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam là Nhà nước pháp quyền xã hội chủ nghĩa của ai, do ai, vì ai?","options":["A. Của Nhân dân, do Nhân dân, vì Nhân dân.","B. Của giai cấp tư sản.","C. Của một nhóm người có đặc quyền.","D. Của các thế lực bên ngoài."],"answer":"A","explain":"Điều 2 Hiến pháp 2013: Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam là Nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân.","lesson":"Bài 15: Nội dung cơ bản của Hiến pháp về chế độ chính trị","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau về pháp luật:","statements":["a) Pháp luật là hệ thống các quy tắc xử sự chung do Nhà nước ban hành.","b) Pháp luật được bảo đảm thực hiện bằng quyền lực nhà nước.","c) Mọi quy tắc đạo đức đều là pháp luật.","d) Pháp luật điều chỉnh các quan hệ xã hội."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai vì chỉ những quy tắc được Nhà nước ban hành (hoặc thừa nhận) và bảo đảm thực hiện mới là pháp luật.","lesson":"Bài 11: Khái niệm, đặc điểm và vai trò của pháp luật","points":1}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"TH","q":"Anh A đủ 18 tuổi đi bầu cử đại biểu Quốc hội. Đây là hình thức thực hiện pháp luật nào?","options":["A. Sử dụng pháp luật.","B. Tuân thủ pháp luật.","C. Thi hành pháp luật.","D. Áp dụng pháp luật."],"answer":"A","explain":"Bầu cử là quyền chính trị của công dân; thực hiện quyền bầu cử là hình thức sử dụng pháp luật.","lesson":"Bài 13: Thực hiện pháp luật","points":0.25},{"type":"short","level":"VDC","q":"Nêu hai biểu hiện của nguyên tắc tất cả quyền lực nhà nước thuộc về Nhân dân trong tổ chức bộ máy nhà nước.","answer":"Các cơ quan nhà nước do Nhân dân hoặc cơ quan đại diện của Nhân dân lập ra; hoạt động vì lợi ích của Nhân dân","explain":"Biểu hiện: Quốc hội, HĐND do Nhân dân trực tiếp bầu ra; các cơ quan khác do cơ quan đại diện của Nhân dân lập ra; mọi hoạt động của bộ máy nhà nước đều vì lợi ích của Nhân dân và chịu sự giám sát của Nhân dân.","lesson":"Bài 18: Nội dung cơ bản của Hiến pháp về bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.5},{"type":"mcq","level":"VDC","q":"Mối quan hệ Đảng lãnh đạo, Nhà nước quản lí, Nhân dân làm chủ thể hiện đặc điểm nào của hệ thống chính trị Việt Nam?","options":["A. Tính thống nhất và tính nhân dân sâu sắc.","B. Tính phân tán, cát cứ.","C. Tính đối lập giữa các thành tố.","D. Không thể hiện đặc điểm nào."],"answer":"A","explain":"Hệ thống chính trị Việt Nam có tính thống nhất (dưới sự lãnh đạo của Đảng) và tính nhân dân sâu sắc (tất cả vì lợi ích của Nhân dân, Nhân dân làm chủ).","lesson":"Bài 19: Đặc điểm, cấu trúc và nguyên tắc hoạt động của hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"short","level":"VD","q":"Nêu ba chức năng cơ bản của Quốc hội.","answer":"Lập hiến, lập pháp; quyết định các vấn đề quan trọng của đất nước; giám sát tối cao","explain":"Ba chức năng của Quốc hội: thực hiện quyền lập hiến, lập pháp; quyết định các vấn đề quan trọng của đất nước; giám sát tối cao đối với hoạt động của Nhà nước.","lesson":"Bài 21: Quốc hội, Chủ tịch nước, Chính phủ nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.5},{"type":"mcq","level":"NB","q":"Hiến pháp năm 2013 có hiệu lực thi hành từ thời điểm nào?","options":["A. Ngày 01/01/2014.","B. Ngày 28/11/2013.","C. Ngày 01/01/2013.","D. Ngày 02/9/2014."],"answer":"A","explain":"Hiến pháp 2013 được thông qua ngày 28/11/2013 và có hiệu lực thi hành từ ngày 01/01/2014.","lesson":"Bài 14: Giới thiệu về Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau về các hình thức thực hiện pháp luật:","statements":["a) Áp dụng pháp luật là hình thức đặc trưng của cơ quan nhà nước có thẩm quyền.","b) Công dân nộp thuế đầy đủ là thi hành pháp luật.","c) Người dân không làm điều pháp luật cấm là tuân thủ pháp luật.","d) Sử dụng pháp luật là nghĩa vụ bắt buộc của mọi công dân."],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai vì sử dụng pháp luật là việc thực hiện quyền của chủ thể, không phải nghĩa vụ bắt buộc.","lesson":"Bài 13: Thực hiện pháp luật","points":1},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau về chế độ chính trị theo Hiến pháp 2013:","statements":["a) Nước Cộng hòa xã hội chủ nghĩa Việt Nam do Nhân dân làm chủ.","b) Tất cả quyền lực nhà nước thuộc về Nhân dân.","c) Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Nhà nước và xã hội.","d) Việt Nam thực hiện chế độ đa đảng thay nhau cầm quyền."],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 2 và Điều 4 Hiến pháp 2013. d sai vì Việt Nam do Đảng Cộng sản Việt Nam lãnh đạo.","lesson":"Bài 15: Nội dung cơ bản của Hiến pháp về chế độ chính trị","points":1},{"type":"mcq","level":"VD","q":"Quốc hội ban hành luật, Chính phủ tổ chức thi hành luật, Tòa án xét xử các vụ án theo luật. Điều này thể hiện nguyên tắc nào trong tổ chức bộ máy nhà nước?","options":["A. Phân công, phối hợp, kiểm soát trong thực hiện các quyền lập pháp, hành pháp, tư pháp.","B. Phân lập quyền lực tuyệt đối.","C. Tập trung toàn bộ quyền lực vào một cơ quan.","D. Không thể hiện nguyên tắc tổ chức nào."],"answer":"A","explain":"Quốc hội (lập pháp), Chính phủ (hành pháp), Tòa án (tư pháp) mỗi cơ quan thực hiện một quyền nhưng trong sự thống nhất, phân công, phối hợp, kiểm soát lẫn nhau.","lesson":"Bài 18: Nội dung cơ bản của Hiến pháp về bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên tắc tập trung dân chủ trong tổ chức và hoạt động của bộ máy nhà nước được hiểu là:","options":["A. Kết hợp sự lãnh đạo tập trung với việc phát huy dân chủ: thiểu số phục tùng đa số, cấp dưới phục tùng cấp trên.","B. Chỉ tập trung mà không cần dân chủ.","C. Chỉ dân chủ mà không cần tập trung.","D. Mỗi cá nhân tự quyết định, không cần tổ chức."],"answer":"A","explain":"Tập trung dân chủ là nguyên tắc kết hợp chặt chẽ giữa tập trung và dân chủ: thiểu số phục tùng đa số, cấp dưới phục tùng cấp trên, đồng thời phát huy dân chủ trong thảo luận, quyết định.","lesson":"Bài 20: Đặc điểm, nguyên tắc tổ chức và hoạt động của bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"mcq","level":"NB","q":"Quyền con người, quyền và nghĩa vụ cơ bản của công dân được quy định tại chương nào của Hiến pháp 2013?","options":["A. Chương II.","B. Chương I.","C. Chương III.","D. Chương XI."],"answer":"A","explain":"Chương II Hiến pháp 2013 (từ Điều 14 đến Điều 49) quy định về quyền con người, quyền và nghĩa vụ cơ bản của công dân.","lesson":"Bài 16: Quyền con người, quyền và nghĩa vụ cơ bản của công dân trong Hiến pháp","points":0.25}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Theo Điều 107 Hiến pháp 2013, Viện kiểm sát nhân dân có chức năng:","options":["A. Thực hành quyền công tố, kiểm sát hoạt động tư pháp.","B. Xét xử các vụ án hình sự.","C. Ban hành luật.","D. Quản lí hành chính nhà nước."],"answer":"A","explain":"Điều 107: Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp.","lesson":"Bài 22: Tòa án nhân dân và Viện kiểm sát nhân dân","points":0.25},{"type":"mcq","level":"TH","q":"Đặc điểm nào sau đây thể hiện tính nhân dân của bộ máy nhà nước ta?","options":["A. Các cơ quan nhà nước đều do Nhân dân hoặc cơ quan đại diện của Nhân dân lập ra, hoạt động vì lợi ích của Nhân dân.","B. Cán bộ nhà nước có nhiều đặc quyền, đặc lợi.","C. Nhân dân không được tham gia vào hoạt động của bộ máy nhà nước.","D. Bộ máy nhà nước phục vụ lợi ích của một nhóm người."],"answer":"A","explain":"Tính nhân dân thể hiện ở chỗ các cơ quan nhà nước do Nhân dân hoặc cơ quan đại diện của Nhân dân lập ra và hoạt động vì lợi ích của Nhân dân.","lesson":"Bài 20: Đặc điểm, nguyên tắc tổ chức và hoạt động của bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"mcq","level":"TH","q":"Theo Hiến pháp 2013, tất cả quyền lực nhà nước thuộc về ai?","options":["A. Nhân dân.","B. Quốc hội.","C. Chính phủ.","D. Đảng Cộng sản Việt Nam."],"answer":"A","explain":"Điều 2: Nước Cộng hòa xã hội chủ nghĩa Việt Nam do Nhân dân làm chủ; tất cả quyền lực nhà nước thuộc về Nhân dân.","lesson":"Bài 15: Nội dung cơ bản của Hiến pháp về chế độ chính trị","points":0.25},{"type":"mcq","level":"VD","q":"UBND xã tổ chức thực hiện nghị quyết của HĐND xã về xây dựng đường giao thông nông thôn. Điều này thể hiện UBND là:","options":["A. Cơ quan chấp hành của HĐND.","B. Cơ quan quyền lực nhà nước ở địa phương.","C. Cơ quan xét xử.","D. Cơ quan độc lập với HĐND."],"answer":"A","explain":"Tổ chức thực hiện nghị quyết của HĐND là biểu hiện của tính chất cơ quan chấp hành của HĐND của UBND (Điều 114).","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau:","statements":["a) Ngành luật là tổng thể các quy phạm pháp luật điều chỉnh một lĩnh vực quan hệ xã hội nhất định.","b) Hệ thống pháp luật chỉ gồm một ngành luật duy nhất.","c) Văn bản của UBND không được trái với văn bản của cơ quan nhà nước cấp trên.","d) Pháp lệnh do Chính phủ ban hành."],"answer":["T","F","T","F"],"explain":"a, c đúng. b sai vì hệ thống pháp luật gồm nhiều ngành luật (dân sự, hình sự, hành chính...). d sai vì pháp lệnh do Ủy ban Thường vụ Quốc hội ban hành.","lesson":"Bài 12: Hệ thống pháp luật và văn bản pháp luật Việt Nam","points":1},{"type":"short","level":"VDC","q":"Phân biệt chức năng của Tòa án nhân dân và Viện kiểm sát nhân dân.","answer":"TAND xét xử, thực hiện quyền tư pháp; VKSND thực hành quyền công tố, kiểm sát hoạt động tư pháp","explain":"TAND là cơ quan xét xử, thực hiện quyền tư pháp (Điều 102); VKSND thực hành quyền công tố, kiểm sát hoạt động tư pháp (Điều 107).","lesson":"Bài 22: Tòa án nhân dân và Viện kiểm sát nhân dân","points":0.5},{"type":"mcq","level":"NB","q":"Theo Điều 102 Hiến pháp 2013, Tòa án nhân dân là:","options":["A. Cơ quan xét xử của nước Cộng hòa xã hội chủ nghĩa Việt Nam, thực hiện quyền tư pháp.","B. Cơ quan hành chính nhà nước.","C. Cơ quan thực hiện quyền lập pháp.","D. Cơ quan thực hành quyền công tố."],"answer":"A","explain":"Điều 102: Tòa án nhân dân là cơ quan xét xử của nước Cộng hòa xã hội chủ nghĩa Việt Nam, thực hiện quyền tư pháp.","lesson":"Bài 22: Tòa án nhân dân và Viện kiểm sát nhân dân","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau:","statements":["a) Phát triển giáo dục là quốc sách hàng đầu (Điều 61).","b) Phát triển khoa học và công nghệ là quốc sách hàng đầu (Điều 62).","c) Mọi người có quyền được sống trong môi trường trong lành và có nghĩa vụ bảo vệ môi trường (Điều 43).","d) Nhà nước không quan tâm đến phát triển giáo dục."],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Hiến pháp 2013. d sai vì phát triển giáo dục là quốc sách hàng đầu, Nhà nước ưu tiên đầu tư cho giáo dục.","lesson":"Bài 17: Nội dung cơ bản của Hiến pháp về kinh tế, văn hóa, xã hội, giáo dục, khoa học, công nghệ, môi trường","points":1},{"type":"short","level":"VD","q":"Nêu ba nguyên tắc tổ chức và hoạt động của bộ máy nhà nước ta.","answer":"Quyền lực nhà nước thuộc về Nhân dân; tập trung dân chủ; pháp chế xã hội chủ nghĩa","explain":"Các nguyên tắc: tất cả quyền lực nhà nước thuộc về Nhân dân; quyền lực nhà nước thống nhất, phân công, phối hợp, kiểm soát; tập trung dân chủ; pháp chế xã hội chủ nghĩa.","lesson":"Bài 20: Đặc điểm, nguyên tắc tổ chức và hoạt động của bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.5},{"type":"mcq","level":"VDC","q":"Hiến pháp 2013 vừa ghi nhận quyền vừa ghi nhận nghĩa vụ cơ bản của công dân. Ý nghĩa của việc này là:","options":["A. Quyền và nghĩa vụ là hai mặt thống nhất: công dân vừa được hưởng quyền vừa phải thực hiện nghĩa vụ với Nhà nước và xã hội.","B. Quyền quan trọng hơn nghĩa vụ nên chỉ cần thực hiện quyền.","C. Nghĩa vụ không cần phải thực hiện.","D. Chỉ cần ghi nhận quyền là đủ, không cần nghĩa vụ."],"answer":"A","explain":"Quyền và nghĩa vụ cơ bản của công dân là hai mặt thống nhất, không tách rời: công dân được hưởng quyền đồng thời phải thực hiện nghĩa vụ.","lesson":"Bài 16: Quyền con người, quyền và nghĩa vụ cơ bản của công dân trong Hiến pháp","points":0.25}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Hành vi nào sau đây là hình thức tuân thủ pháp luật?","options":["A. Không buôn bán ma túy vì pháp luật cấm.","B. Nộp thuế thu nhập cá nhân đầy đủ.","C. Khởi kiện ra Tòa án để đòi bồi thường.","D. Cảnh sát giao thông xử phạt người vi phạm."],"answer":"A","explain":"Tuân thủ pháp luật là hình thức kiềm chế, không làm những điều pháp luật cấm. Không buôn bán ma túy là tuân thủ pháp luật.","lesson":"Bài 13: Thực hiện pháp luật","points":0.25},{"type":"short","level":"VDC","q":"Nêu hai nguyên tắc hoạt động của hệ thống chính trị Việt Nam.","answer":"Đảng lãnh đạo; Nhân dân làm chủ","explain":"Nguyên tắc hoạt động: Đảng Cộng sản Việt Nam lãnh đạo; Nhà nước quản lí; Nhân dân làm chủ; bảo đảm sự lãnh đạo của Đảng đối với toàn bộ hệ thống.","lesson":"Bài 19: Đặc điểm, cấu trúc và nguyên tắc hoạt động của hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam","points":0.5},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau về kinh tế theo Hiến pháp 2013:","statements":["a) Nền kinh tế thị trường định hướng xã hội chủ nghĩa có nhiều thành phần kinh tế.","b) Kinh tế nhà nước giữ vai trò chủ đạo (Điều 51).","c) Đất đai thuộc sở hữu tư nhân của người đang sử dụng.","d) Công dân có nghĩa vụ bảo vệ môi trường."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai vì đất đai thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu (Điều 53).","lesson":"Bài 17: Nội dung cơ bản của Hiến pháp về kinh tế, văn hóa, xã hội, giáo dục, khoa học, công nghệ, môi trường","points":1},{"type":"mcq","level":"TH","q":"Theo Điều 114 Hiến pháp 2013, UBND do ai bầu ra và có vị trí như thế nào?","options":["A. Do HĐND cùng cấp bầu ra; là cơ quan chấp hành của HĐND, cơ quan hành chính nhà nước ở địa phương.","B. Do Nhân dân trực tiếp bầu ra; là cơ quan quyền lực nhà nước.","C. Do Quốc hội bầu ra; là cơ quan xét xử.","D. Do Chính phủ bổ nhiệm; là cơ quan thực hành quyền công tố."],"answer":"A","explain":"Điều 114: Ủy ban nhân dân do HĐND cùng cấp bầu ra là cơ quan chấp hành của HĐND, cơ quan hành chính nhà nước ở địa phương.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"VD","q":"Tòa án ra bản án tuyên phạt bị cáo 2 năm tù về tội trộm cắp tài sản. Đây là hình thức thực hiện pháp luật nào? Vì sao?","options":["A. Áp dụng pháp luật, vì cơ quan nhà nước có thẩm quyền ra quyết định áp dụng quy phạm pháp luật đối với chủ thể cụ thể.","B. Sử dụng pháp luật.","C. Tuân thủ pháp luật.","D. Thi hành pháp luật."],"answer":"A","explain":"Áp dụng pháp luật là hình thức đặc trưng của cơ quan nhà nước có thẩm quyền: ra quyết định áp dụng quy phạm pháp luật đối với chủ thể cụ thể (bản án của Tòa án).","lesson":"Bài 13: Thực hiện pháp luật","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau:","statements":["a) Tất cả quyền lực nhà nước thuộc về Nhân dân là nguyên tắc tổ chức bộ máy nhà nước.","b) Bộ máy nhà nước hoạt động theo nguyên tắc tập trung dân chủ.","c) Cán bộ nhà nước được phép làm trái pháp luật.","d) Mọi cơ quan nhà nước đều phải tuân thủ Hiến pháp và pháp luật."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai vì theo nguyên tắc pháp chế, mọi cán bộ, công chức đều phải tuân thủ pháp luật.","lesson":"Bài 20: Đặc điểm, nguyên tắc tổ chức và hoạt động của bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":1},{"type":"mcq","level":"VDC","q":"Vì sao bộ máy nhà nước ta được tổ chức theo nguyên tắc quyền lực nhà nước thống nhất mà không phân lập quyền lực như một số nước?","options":["A. Vì tất cả quyền lực nhà nước thuộc về Nhân dân, cần sự thống nhất để bảo đảm quyền làm chủ của Nhân dân, đồng thời phân công, phối hợp, kiểm soát để tránh lạm quyền.","B. Vì không cần kiểm soát quyền lực nhà nước.","C. Vì muốn tập trung quyền lực vào tay một người.","D. Không có lí do cụ thể nào."],"answer":"A","explain":"Nguyên tắc này xuất phát từ bản chất: tất cả quyền lực nhà nước thuộc về Nhân dân nên quyền lực phải thống nhất; đồng thời phải phân công, phối hợp, kiểm soát để quyền lực được thực hiện hiệu quả và không bị lạm dụng.","lesson":"Bài 18: Nội dung cơ bản của Hiến pháp về bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"short","level":"VD","q":"Nêu hai nguyên tắc hoạt động của Tòa án nhân dân.","answer":"Xét xử độc lập, chỉ tuân theo pháp luật; xét xử công khai","explain":"Các nguyên tắc: Thẩm phán, Hội thẩm xét xử độc lập và chỉ tuân theo pháp luật; Tòa án xét xử công khai; bảo đảm quyền bào chữa của bị can, bị cáo; có Hội thẩm nhân dân tham gia xét xử.","lesson":"Bài 22: Tòa án nhân dân và Viện kiểm sát nhân dân","points":0.5},{"type":"mcq","level":"NB","q":"Hiến pháp năm 2013 được Quốc hội nước ta thông qua vào thời gian nào?","options":["A. Ngày 28/11/2013.","B. Ngày 02/9/1945.","C. Ngày 30/4/1975.","D. Ngày 01/01/2020."],"answer":"A","explain":"Hiến pháp năm 2013 được Quốc hội khóa XIII thông qua ngày 28/11/2013.","lesson":"Bài 14: Giới thiệu về Hiến pháp nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"mcq","level":"TH","q":"Chị B năm nay 20 tuổi, muốn ứng cử đại biểu HĐND xã. Theo Hiến pháp 2013, chị B có đủ điều kiện về độ tuổi không?","options":["A. Không, vì ứng cử cần đủ 21 tuổi trở lên.","B. Có, vì đã đủ 18 tuổi.","C. Có, vì 20 tuổi đã được coi là thành niên.","D. Không, vì ứng cử cần đủ 25 tuổi."],"answer":"A","explain":"Theo Điều 27, công dân đủ 21 tuổi trở lên mới có quyền ứng cử. Chị B mới 20 tuổi nên chưa đủ điều kiện (nhưng đã có quyền bầu cử).","lesson":"Bài 16: Quyền con người, quyền và nghĩa vụ cơ bản của công dân trong Hiến pháp","points":0.25}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Trong hệ thống văn bản quy phạm pháp luật, văn bản nào có hiệu lực pháp lí cao nhất?","options":["A. Hiến pháp.","B. Luật.","C. Nghị định.","D. Thông tư."],"answer":"A","explain":"Hiến pháp là đạo luật cơ bản của Nhà nước, có hiệu lực pháp lí cao nhất; mọi văn bản khác đều phải phù hợp, không được trái với Hiến pháp.","lesson":"Bài 12: Hệ thống pháp luật và văn bản pháp luật Việt Nam","points":0.25},{"type":"mcq","level":"VD","q":"Trong phiên tòa hình sự, Kiểm sát viên thực hành quyền công tố, đề nghị mức hình phạt đối với bị cáo. Điều này thể hiện chức năng nào của Viện kiểm sát nhân dân?","options":["A. Thực hành quyền công tố, bảo đảm việc truy tố, xét xử đúng người, đúng tội, đúng pháp luật.","B. Chức năng xét xử.","C. Chức năng bào chữa cho bị cáo.","D. Chức năng thi hành án."],"answer":"A","explain":"Thực hành quyền công tố là chức năng buộc tội của Nhà nước đối với người phạm tội, bảo đảm truy tố đúng người, đúng tội, đúng pháp luật.","lesson":"Bài 22: Tòa án nhân dân và Viện kiểm sát nhân dân","points":0.25},{"type":"mcq","level":"NB","q":"Đặc điểm nào sau đây của pháp luật thể hiện việc pháp luật được bảo đảm thực hiện bằng quyền lực nhà nước?","options":["A. Tính được bảo đảm thực hiện bằng Nhà nước.","B. Tính quy phạm phổ biến.","C. Tính xác định chặt chẽ về mặt hình thức.","D. Tính tự nguyện, không bắt buộc."],"answer":"A","explain":"Tính được bảo đảm thực hiện bằng Nhà nước là đặc điểm thể hiện pháp luật được Nhà nước bảo đảm thực hiện bằng các biện pháp cưỡng chế khi cần thiết.","lesson":"Bài 11: Khái niệm, đặc điểm và vai trò của pháp luật","points":0.25},{"type":"short","level":"VD","q":"Theo Hiến pháp 2013, phát triển giáo dục và phát triển khoa học, công nghệ được xác định là gì?","answer":"Quốc sách hàng đầu","explain":"Điều 61: Phát triển giáo dục là quốc sách hàng đầu. Điều 62: Phát triển khoa học và công nghệ là quốc sách hàng đầu.","lesson":"Bài 17: Nội dung cơ bản của Hiến pháp về kinh tế, văn hóa, xã hội, giáo dục, khoa học, công nghệ, môi trường","points":0.5},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau về bộ máy nhà nước:","statements":["a) Bộ máy nhà nước gồm các cơ quan nhà nước từ trung ương đến địa phương.","b) Quốc hội, Chính phủ, Tòa án nhân dân đều thuộc bộ máy nhà nước.","c) Mặt trận Tổ quốc Việt Nam là một cơ quan nhà nước.","d) Chính quyền địa phương là một bộ phận của bộ máy nhà nước."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai vì Mặt trận Tổ quốc là tổ chức chính trị – xã hội, thuộc hệ thống chính trị, không phải cơ quan nhà nước.","lesson":"Bài 18: Nội dung cơ bản của Hiến pháp về bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":1},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau:","statements":["a) Tòa án nhân dân thực hiện quyền tư pháp, xét xử độc lập và chỉ tuân theo pháp luật.","b) Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp.","c) UBND có quyền can thiệp vào hoạt động xét xử của Tòa án.","d) Hội thẩm nhân dân tham gia xét xử cùng Thẩm phán."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai vì nghiêm cấm cơ quan, tổ chức, cá nhân can thiệp vào việc xét xử của Thẩm phán, Hội thẩm.","lesson":"Bài 22: Tòa án nhân dân và Viện kiểm sát nhân dân","points":1},{"type":"mcq","level":"VDC","q":"Vì sao nói pháp chế xã hội chủ nghĩa là nguyên tắc hoạt động của bộ máy nhà nước?","options":["A. Vì mọi cơ quan, cán bộ, công chức nhà nước đều phải tuân thủ Hiến pháp và pháp luật; mọi vi phạm đều bị xử lí nghiêm.","B. Vì pháp luật không quan trọng trong quản lí nhà nước.","C. Vì cán bộ nhà nước được đứng trên pháp luật.","D. Vì chỉ Nhân dân mới phải tuân thủ pháp luật."],"answer":"A","explain":"Nguyên tắc pháp chế XHCN đòi hỏi mọi cơ quan nhà nước, cán bộ, công chức phải tuân thủ nghiêm chỉnh Hiến pháp, pháp luật; kiên quyết xử lí mọi hành vi vi phạm.","lesson":"Bài 20: Đặc điểm, nguyên tắc tổ chức và hoạt động của bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"mcq","level":"NB","q":"Theo Hiến pháp 2013, cơ quan nào sau đây thuộc bộ máy nhà nước?","options":["A. Quốc hội.","B. Đảng Cộng sản Việt Nam.","C. Mặt trận Tổ quốc Việt Nam.","D. Đoàn Thanh niên Cộng sản Hồ Chí Minh."],"answer":"A","explain":"Bộ máy nhà nước gồm các cơ quan nhà nước: Quốc hội, Chủ tịch nước, Chính phủ, Tòa án nhân dân, Viện kiểm sát nhân dân, chính quyền địa phương... Đảng và các đoàn thể thuộc hệ thống chính trị, không phải cơ quan nhà nước.","lesson":"Bài 18: Nội dung cơ bản của Hiến pháp về bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam","points":0.25},{"type":"mcq","level":"TH","q":"Hành vi nào sau đây thể hiện vai trò của pháp luật trong việc bảo vệ quyền, lợi ích hợp pháp của công dân?","options":["A. Người lao động khởi kiện đòi tiền lương theo quy định của Bộ luật Lao động.","B. Học sinh đi học muộn giờ.","C. Người dân tự ý lấn chiếm vỉa hè để buôn bán.","D. Doanh nghiệp tìm cách trốn thuế."],"answer":"A","explain":"Khởi kiện đòi quyền lợi theo pháp luật là biểu hiện của vai trò bảo vệ quyền, lợi ích hợp pháp của công dân của pháp luật.","lesson":"Bài 11: Khái niệm, đặc điểm và vai trò của pháp luật","points":0.25},{"type":"short","level":"VDC","q":"Vì sao nói HĐND là cơ quan quyền lực nhà nước ở địa phương?","answer":"Vì HĐND do Nhân dân địa phương bầu ra, đại diện cho ý chí, nguyện vọng và quyền làm chủ của Nhân dân","explain":"Theo Điều 113, HĐND do Nhân dân địa phương bầu ra, đại diện cho ý chí, nguyện vọng và quyền làm chủ của Nhân dân địa phương, quyết định các vấn đề của địa phương theo luật định nên được gọi là cơ quan quyền lực nhà nước ở địa phương.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5}]}]}
