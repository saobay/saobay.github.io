<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam gồm những thành tố nào sau đây?","options":["A. Đảng Cộng sản Việt Nam, Nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam, Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị – xã hội.","B. Đảng Cộng sản Việt Nam, Chính phủ, Tòa án nhân dân, Viện kiểm sát nhân dân.","C. Quốc hội, Chính phủ, Mặt trận Tổ quốc Việt Nam, Hội Khuyến học Việt Nam.","D. Đảng Cộng sản Việt Nam, Nhà nước, các doanh nghiệp và tổ chức xã hội nghề nghiệp."],"answer":"A","explain":"Theo SGK, hệ thống chính trị nước ta gồm ba bộ phận: Đảng Cộng sản Việt Nam, Nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam, Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị – xã hội.","points":0.25},{"type":"mcq","level":"NB","q":"Theo Điều 4 Hiến pháp năm 2013, tổ chức nào là lực lượng lãnh đạo Nhà nước và xã hội?","options":["A. Quốc hội.","B. Đảng Cộng sản Việt Nam.","C. Mặt trận Tổ quốc Việt Nam.","D. Chính phủ."],"answer":"B","explain":"Điều 4 Hiến pháp năm 2013 khẳng định: Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Nhà nước và xã hội.","points":0.25},{"type":"mcq","level":"TH","q":"Tổ chức nào sau đây là tổ chức chính trị – xã hội?","options":["A. Mặt trận Tổ quốc Việt Nam.","B. Đoàn Thanh niên Cộng sản Hồ Chí Minh.","C. Hội Khuyến học Việt Nam.","D. Liên minh Hợp tác xã Việt Nam."],"answer":"B","explain":"Đoàn Thanh niên Cộng sản Hồ Chí Minh là tổ chức chính trị – xã hội của thanh niên Việt Nam. Mặt trận Tổ quốc Việt Nam là tổ chức liên minh chính trị, liên hiệp tự nguyện; Hội Khuyến học là tổ chức xã hội.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào sau đây KHÔNG phải là nguyên tắc hoạt động của hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam?","options":["A. Đảm bảo sự lãnh đạo của Đảng Cộng sản Việt Nam.","B. Phát huy quyền làm chủ của Nhân dân.","C. Hoạt động trong khuôn khổ Hiến pháp và pháp luật.","D. Thực hiện đa nguyên chính trị, đa đảng đối lập."],"answer":"D","explain":"Ba nguyên tắc hoạt động của hệ thống chính trị nước ta là: đảm bảo sự lãnh đạo của Đảng, phát huy quyền làm chủ của Nhân dân, hoạt động trong khuôn khổ Hiến pháp và pháp luật. Việt Nam không thực hiện đa đảng đối lập.","points":0.25},{"type":"mcq","level":"VD","q":"Ở thôn A, chi bộ Đảng lãnh đạo nhân dân đóng góp ngày công và kinh phí làm đường giao thông nông thôn, được nhân dân đồng tình hưởng ứng. Việc làm này thể hiện nguyên tắc hoạt động nào của hệ thống chính trị?","options":["A. Phát huy quyền làm chủ của Nhân dân.","B. Đảm bảo sự lãnh đạo của Đảng Cộng sản Việt Nam.","C. Hoạt động trong khuôn khổ Hiến pháp và pháp luật.","D. Tập trung dân chủ trong tổ chức Đảng."],"answer":"B","explain":"Chi bộ Đảng đề ra chủ trương, lãnh đạo nhân dân thực hiện là biểu hiện trực tiếp của nguyên tắc đảm bảo sự lãnh đạo của Đảng Cộng sản Việt Nam đối với hệ thống chính trị và xã hội.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định nào sau đây là đúng về mối quan hệ giữa Đảng Cộng sản Việt Nam với Nhà nước trong hệ thống chính trị?","options":["A. Đảng trực tiếp thay thế Nhà nước ban hành văn bản quy phạm pháp luật.","B. Đảng lãnh đạo Nhà nước bằng đường lối, chủ trương và thông qua tổ chức đảng, đảng viên hoạt động trong các cơ quan nhà nước.","C. Đảng đứng trên Hiến pháp, không chịu sự điều chỉnh của pháp luật.","D. Đảng và Nhà nước hoạt động độc lập, không có mối quan hệ với nhau."],"answer":"B","explain":"Đảng lãnh đạo Nhà nước và xã hội bằng cương lĩnh, chiến lược, đường lối, chủ trương; bằng công tác tuyên truyền, thuyết phục, vận động, tổ chức, kiểm tra và bằng hành động gương mẫu của đảng viên. Đảng không làm thay, không đứng trên pháp luật.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam:","statements":["a) Hệ thống chính trị gồm Đảng Cộng sản Việt Nam, Nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam, Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị – xã hội.","b) Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Nhà nước và xã hội.","c) Mặt trận Tổ quốc Việt Nam là một tổ chức chính trị – xã hội.","d) Hệ thống chính trị nước ta hoạt động theo nguyên tắc đa đảng cạnh tranh."],"answer":["T","T","F","F"],"explain":"a) Đúng, b) Đúng theo SGK và Điều 4 Hiến pháp 2013. c) Sai: Mặt trận Tổ quốc Việt Nam là tổ chức liên minh chính trị, liên hiệp tự nguyện, không xếp vào nhóm tổ chức chính trị – xã hội. d) Sai: hệ thống chính trị nước ta do một đảng duy nhất là Đảng Cộng sản Việt Nam lãnh đạo.","points":1},{"type":"truefalse","level":"VD","q":"Ở khu phố B, nhân dân tích cực tham gia góp ý vào dự thảo hương ước, quy ước của khu phố; mọi ý kiến đều được tổ dân phố tổng hợp, báo cáo cấp có thẩm quyền. Xét tính đúng, sai của các nhận định sau:","statements":["a) Việc người dân góp ý vào hương ước, quy ước thể hiện nguyên tắc phát huy quyền làm chủ của Nhân dân.","b) Hương ước, quy ước của khu phố do nhân dân tự đặt ra nên không cần phù hợp với Hiến pháp và pháp luật.","c) Tổ chức Đảng ở cơ sở có trách nhiệm lãnh đạo việc xây dựng đời sống văn hoá ở khu dân cư.","d) Nhân dân chỉ có quyền thực hiện, không có quyền tham gia bàn bạc các công việc của khu phố."],"answer":["T","F","T","F"],"explain":"a) Đúng, c) Đúng. b) Sai: mọi hương ước, quy ước đều phải phù hợp với Hiến pháp và pháp luật. d) Sai: nhân dân có quyền bàn bạc, quyết định trực tiếp những công việc của cộng đồng dân cư theo quy định của pháp luật.","points":1},{"type":"short","level":"NB","q":"Theo Điều 4 Hiến pháp năm 2013, lực lượng lãnh đạo Nhà nước và xã hội là tổ chức nào? (Trả lời bằng tên tổ chức)","answer":"Đảng Cộng sản Việt Nam","explain":"Điều 4 Hiến pháp năm 2013 quy định: Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Nhà nước và xã hội.","points":0.5},{"type":"short","level":"VDC","q":"Điền cụm từ còn thiếu trong Điều 4 Hiến pháp năm 2013: Đảng Cộng sản Việt Nam là đội tiên phong của giai cấp công nhân, đồng thời là đội tiên phong của nhân dân lao động và của ... Việt Nam.","answer":"dân tộc","explain":"Nguyên văn Điều 4 Hiến pháp năm 2013: Đảng Cộng sản Việt Nam là đội tiên phong của giai cấp công nhân, đồng thời là đội tiên phong của nhân dân lao động và của dân tộc Việt Nam.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Tổ chức nào giữ vai trò trung tâm trong hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam?","options":["A. Đảng Cộng sản Việt Nam.","B. Nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam.","C. Mặt trận Tổ quốc Việt Nam.","D. Tổng Liên đoàn Lao động Việt Nam."],"answer":"B","explain":"Nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam là trung tâm của hệ thống chính trị, là công cụ chủ yếu để nhân dân thực hiện quyền lực của mình.","points":0.25},{"type":"mcq","level":"NB","q":"Tổ chức chính trị – xã hội nào đại diện, chăm lo và bảo vệ quyền, lợi ích hợp pháp, chính đáng của người lao động?","options":["A. Hội Liên hiệp Phụ nữ Việt Nam.","B. Tổng Liên đoàn Lao động Việt Nam.","C. Hội Nông dân Việt Nam.","D. Hội Cựu chiến binh Việt Nam."],"answer":"B","explain":"Tổng Liên đoàn Lao động Việt Nam là tổ chức chính trị – xã hội của giai cấp công nhân và người lao động, đại diện, chăm lo, bảo vệ quyền, lợi ích hợp pháp, chính đáng của đoàn viên, người lao động.","points":0.25},{"type":"mcq","level":"TH","q":"Theo Hiến pháp năm 2013, các tổ chức của Đảng và đảng viên Đảng Cộng sản Việt Nam hoạt động","options":["A. trong khuôn khổ Hiến pháp và pháp luật.","B. độc lập, không chịu sự điều chỉnh của pháp luật.","C. theo ý chí chủ quan của người đứng đầu tổ chức đảng.","D. chỉ tuân theo Điều lệ Đảng mà không cần tuân theo pháp luật."],"answer":"A","explain":"Khoản 3 Điều 4 Hiến pháp năm 2013 quy định: Các tổ chức của Đảng và đảng viên Đảng Cộng sản Việt Nam hoạt động trong khuôn khổ Hiến pháp và pháp luật.","points":0.25},{"type":"mcq","level":"TH","q":"Việc công dân tham gia góp ý vào dự thảo Luật Đất đai (sửa đổi) thể hiện nguyên tắc hoạt động nào của hệ thống chính trị?","options":["A. Đảm bảo sự lãnh đạo của Đảng Cộng sản Việt Nam.","B. Phát huy quyền làm chủ của Nhân dân.","C. Hoạt động trong khuôn khổ Hiến pháp và pháp luật.","D. Nguyên tắc tập trung dân chủ trong Đảng."],"answer":"B","explain":"Nhân dân tham gia góp ý xây dựng pháp luật là hình thức trực tiếp thực hiện quyền làm chủ, thể hiện nguyên tắc phát huy quyền làm chủ của Nhân dân.","points":0.25},{"type":"mcq","level":"VD","q":"Anh K là đảng viên được chi bộ phân công phụ trách công tác dân vận ở khu phố. Trong quá trình thực hiện nhiệm vụ, anh luôn báo cáo, xin ý kiến chi bộ và chấp hành nghiêm nghị quyết của chi bộ. Việc làm của anh K thể hiện","options":["A. nguyên tắc đảm bảo sự lãnh đạo của Đảng trong hệ thống chính trị.","B. quyền tự do hành động của cá nhân đảng viên.","C. sự độc lập tuyệt đối của tổ chức Đoàn thanh niên.","D. nguyên tắc đa đảng cạnh tranh trong hệ thống chính trị."],"answer":"A","explain":"Đảng viên chấp hành sự lãnh đạo, phân công của tổ chức đảng là biểu hiện của nguyên tắc đảm bảo sự lãnh đạo của Đảng Cộng sản Việt Nam.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong các nhận định sau, nhận định nào thể hiện đúng vai trò của Mặt trận Tổ quốc Việt Nam trong hệ thống chính trị?","options":["A. Mặt trận Tổ quốc Việt Nam là lực lượng duy nhất được lãnh đạo Nhà nước và xã hội.","B. Mặt trận Tổ quốc Việt Nam là cơ sở chính trị của chính quyền nhân dân; thực hiện giám sát, phản biện xã hội, góp phần xây dựng Đảng, Nhà nước.","C. Mặt trận Tổ quốc Việt Nam là cơ quan quyền lực nhà nước cao nhất.","D. Mặt trận Tổ quốc Việt Nam trực tiếp xét xử các vụ án."],"answer":"B","explain":"Theo Hiến pháp 2013 và SGK, Mặt trận Tổ quốc Việt Nam là cơ sở chính trị của chính quyền nhân dân; đại diện, bảo vệ quyền và lợi ích hợp pháp, chính đáng của Nhân dân; thực hiện dân chủ, tăng cường đồng thuận xã hội; thực hiện giám sát, phản biện xã hội; tham gia xây dựng Đảng, Nhà nước.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về vị trí, vai trò của Đảng Cộng sản Việt Nam:","statements":["a) Đảng Cộng sản Việt Nam do Chủ tịch Hồ Chí Minh sáng lập và rèn luyện.","b) Đảng là lực lượng lãnh đạo Nhà nước và xã hội theo Điều 4 Hiến pháp năm 2013.","c) Các tổ chức của Đảng và đảng viên hoạt động ngoài khuôn khổ Hiến pháp và pháp luật.","d) Đảng Cộng sản Việt Nam gắn bó mật thiết với Nhân dân, chịu sự giám sát của Nhân dân."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng theo SGK và Điều 4 Hiến pháp 2013. c) Sai: các tổ chức của Đảng và đảng viên hoạt động trong khuôn khổ Hiến pháp và pháp luật.","points":1},{"type":"truefalse","level":"VD","q":"Xã M tổ chức lấy ý kiến nhân dân về phương án đặt tên đường phố mới. Ông T cho rằng việc đặt tên đường là việc của chính quyền, người dân không cần tham gia. Xét tính đúng, sai của các nhận định sau:","statements":["a) Việc lấy ý kiến nhân dân thể hiện nguyên tắc phát huy quyền làm chủ của Nhân dân.","b) Quan điểm của ông T là đúng vì quản lí nhà nước là công việc riêng của cơ quan nhà nước.","c) Mọi tổ chức trong hệ thống chính trị khi hoạt động đều phải tuân theo Hiến pháp và pháp luật.","d) Nhân dân có quyền tham gia quản lí nhà nước và xã hội theo quy định của pháp luật."],"answer":["T","F","T","T"],"explain":"a), c), d) Đúng. b) Sai: nhân dân có quyền tham gia quản lí nhà nước, quản lí xã hội; việc lấy ý kiến nhân dân về những vấn đề ở cơ sở là thực hiện quyền làm chủ của Nhân dân.","points":1},{"type":"short","level":"NB","q":"Tổ chức chính trị – xã hội của thanh niên Việt Nam, do Đảng Cộng sản Việt Nam và Chủ tịch Hồ Chí Minh sáng lập, lãnh đạo và rèn luyện là tổ chức nào? (Trả lời bằng tên tổ chức)","answer":"Đoàn Thanh niên Cộng sản Hồ Chí Minh","explain":"Đoàn Thanh niên Cộng sản Hồ Chí Minh là tổ chức chính trị – xã hội của thanh niên Việt Nam, do Đảng Cộng sản Việt Nam và Chủ tịch Hồ Chí Minh sáng lập, lãnh đạo và rèn luyện.","points":0.5},{"type":"short","level":"VDC","q":"Điền từ còn thiếu: Hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam do ... lãnh đạo là đặc điểm cơ bản, bao trùm nhất.","answer":"Đảng Cộng sản Việt Nam","explain":"Đặc điểm cơ bản, bao trùm nhất của hệ thống chính trị nước ta là do Đảng Cộng sản Việt Nam lãnh đạo.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam hoạt động dựa trên cơ sở nào sau đây?","options":["A. Ý chí chủ quan của người đứng đầu mỗi tổ chức.","B. Hiến pháp và pháp luật.","C. Phong tục, tập quán của từng địa phương.","D. Thỏa thuận riêng giữa các tổ chức với nhau."],"answer":"B","explain":"Một trong những nguyên tắc hoạt động của hệ thống chính trị nước ta là mọi tổ chức đều hoạt động trong khuôn khổ Hiến pháp và pháp luật.","points":0.25},{"type":"mcq","level":"NB","q":"Tổ chức nào sau đây KHÔNG thuộc hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam?","options":["A. Đảng Cộng sản Việt Nam.","B. Nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam.","C. Mặt trận Tổ quốc Việt Nam.","D. Hội Doanh nghiệp nhỏ và vừa Việt Nam."],"answer":"D","explain":"Hệ thống chính trị gồm: Đảng Cộng sản Việt Nam, Nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam, Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị – xã hội. Hội Doanh nghiệp nhỏ và vừa là tổ chức xã hội nghề nghiệp, không thuộc hệ thống chính trị.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác biệt cơ bản của Mặt trận Tổ quốc Việt Nam so với các tổ chức chính trị – xã hội là","options":["A. Mặt trận Tổ quốc Việt Nam là tổ chức liên minh chính trị, liên hiệp tự nguyện của các tổ chức chính trị, tổ chức chính trị – xã hội, tổ chức xã hội và cá nhân tiêu biểu.","B. Mặt trận Tổ quốc Việt Nam do Chính phủ trực tiếp quản lí, điều hành.","C. Mặt trận Tổ quốc Việt Nam không tham gia giám sát, phản biện xã hội.","D. Mặt trận Tổ quốc Việt Nam chỉ hoạt động trong lĩnh vực kinh tế."],"answer":"A","explain":"Theo Hiến pháp 2013, Mặt trận Tổ quốc Việt Nam là tổ chức liên minh chính trị, liên hiệp tự nguyện của tổ chức chính trị, các tổ chức chính trị – xã hội, tổ chức xã hội và cá nhân tiêu biểu trong các giai cấp, tầng lớp xã hội, dân tộc, tôn giáo.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào sau đây thể hiện đúng vai trò lãnh đạo của Đảng Cộng sản Việt Nam đối với Nhà nước?","options":["A. Đảng đề ra đường lối, chủ trương lớn; lãnh đạo Nhà nước thể chế hoá thành Hiến pháp, pháp luật và tổ chức thực hiện.","B. Đảng trực tiếp điều hành mọi công việc hằng ngày của các cơ quan nhà nước.","C. Đảng thay thế Nhà nước ban hành văn bản quy phạm pháp luật.","D. Đảng đứng trên Hiến pháp và pháp luật."],"answer":"A","explain":"Đảng lãnh đạo Nhà nước bằng cương lĩnh, chiến lược, đường lối, chủ trương; lãnh đạo việc thể chế hoá thành Hiến pháp, pháp luật; lãnh đạo thông qua tổ chức đảng và đảng viên hoạt động trong các cơ quan nhà nước.","points":0.25},{"type":"mcq","level":"VD","q":"Trong đợt bầu cử đại biểu Quốc hội, Mặt trận Tổ quốc các cấp tổ chức hội nghị hiệp thương để lựa chọn, giới thiệu người ứng cử. Hoạt động này thể hiện","options":["A. vai trò lãnh đạo của Đảng đối với công tác bầu cử.","B. chức năng tập hợp nhân dân, phát huy quyền làm chủ của Nhân dân của Mặt trận Tổ quốc.","C. quyền xét xử của Tòa án nhân dân.","D. chức năng quản lí hành chính nhà nước của Chính phủ."],"answer":"B","explain":"Tổ chức hiệp thương, giới thiệu người ứng cử là hoạt động thể hiện chức năng tập hợp, phát huy dân chủ, quyền làm chủ của Nhân dân của Mặt trận Tổ quốc Việt Nam trong hệ thống chính trị.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao nói sự lãnh đạo của Đảng Cộng sản Việt Nam là đặc điểm cơ bản, bao trùm nhất của hệ thống chính trị nước ta?","options":["A. Vì Đảng nắm giữ toàn bộ các chức vụ trong bộ máy nhà nước.","B. Vì Đảng đề ra cương lĩnh, đường lối lãnh đạo toàn bộ hệ thống chính trị và xã hội; mọi tổ chức trong hệ thống đều đặt dưới sự lãnh đạo của Đảng.","C. Vì Đảng trực tiếp quản lí, điều hành nền kinh tế.","D. Vì Đảng có số lượng đảng viên đông nhất trong các tổ chức."],"answer":"B","explain":"Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Nhà nước và xã hội; Đảng đề ra đường lối lãnh đạo toàn bộ hoạt động của hệ thống chính trị, nên sự lãnh đạo của Đảng là đặc điểm cơ bản, bao trùm nhất.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị – xã hội:","statements":["a) Mặt trận Tổ quốc Việt Nam là cơ sở chính trị của chính quyền nhân dân.","b) Tổng Liên đoàn Lao động Việt Nam là tổ chức chính trị – xã hội của giai cấp công nhân và người lao động.","c) Hội Liên hiệp Phụ nữ Việt Nam chỉ được phép hoạt động ở cấp trung ương.","d) Các tổ chức chính trị – xã hội hoạt động độc lập, không chịu sự lãnh đạo của Đảng Cộng sản Việt Nam."],"answer":["T","T","F","F"],"explain":"a), b) Đúng. c) Sai: Hội Liên hiệp Phụ nữ Việt Nam được tổ chức từ trung ương đến cơ sở. d) Sai: các tổ chức chính trị – xã hội đều đặt dưới sự lãnh đạo của Đảng Cộng sản Việt Nam.","points":1},{"type":"truefalse","level":"VD","q":"Trong buổi sinh hoạt chi bộ thôn X, các đảng viên thảo luận, biểu quyết thông qua nghị quyết về xây dựng nông thôn mới; đảng viên được phân công nhiệm vụ cụ thể và báo cáo kết quả trước chi bộ. Xét tính đúng, sai của các nhận định sau:","statements":["a) Việc đảng viên thảo luận, biểu quyết thể hiện nguyên tắc tập trung dân chủ trong tổ chức Đảng.","b) Đảng viên phải chấp hành nghị quyết của chi bộ là biểu hiện của sự lãnh đạo của Đảng.","c) Tổ chức đảng ở cơ sở không có vai trò gì đối với đời sống xã hội ở địa phương.","d) Mọi hoạt động của tổ chức đảng đều phải tuân theo Điều lệ Đảng, Hiến pháp và pháp luật."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: tổ chức đảng ở cơ sở là hạt nhân chính trị, lãnh đạo thực hiện đường lối, chủ trương của Đảng ở địa phương, cơ sở.","points":1},{"type":"short","level":"NB","q":"Hội nào là tổ chức chính trị – xã hội của phụ nữ Việt Nam? (Trả lời bằng tên tổ chức)","answer":"Hội Liên hiệp Phụ nữ Việt Nam","explain":"Hội Liên hiệp Phụ nữ Việt Nam là tổ chức chính trị – xã hội của phụ nữ Việt Nam, đại diện, chăm lo, bảo vệ quyền, lợi ích hợp pháp, chính đáng của phụ nữ.","points":0.5},{"type":"short","level":"VDC","q":"Điền từ còn thiếu vào nguyên tắc hoạt động của hệ thống chính trị: Mọi tổ chức trong hệ thống chính trị đều hoạt động trong khuôn khổ ... và pháp luật.","answer":"Hiến pháp","explain":"Nguyên tắc: hệ thống chính trị hoạt động trong khuôn khổ Hiến pháp và pháp luật; mọi tổ chức, cá nhân đều phải tuân theo Hiến pháp và pháp luật.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Hội Nông dân Việt Nam là tổ chức chính trị – xã hội của","options":["A. giai cấp công nhân.","B. giai cấp nông dân.","C. đội ngũ trí thức.","D. lực lượng vũ trang."],"answer":"B","explain":"Hội Nông dân Việt Nam là tổ chức chính trị – xã hội của giai cấp nông dân Việt Nam.","points":0.25},{"type":"mcq","level":"NB","q":"Hội Cựu chiến binh Việt Nam là tổ chức chính trị – xã hội của","options":["A. cựu chiến binh Việt Nam.","B. thanh niên Việt Nam.","C. phụ nữ Việt Nam.","D. nông dân Việt Nam."],"answer":"A","explain":"Hội Cựu chiến binh Việt Nam là tổ chức chính trị – xã hội của các cựu chiến binh.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào sau đây thuộc chức năng của Mặt trận Tổ quốc Việt Nam?","options":["A. Ban hành Hiến pháp và luật.","B. Thực hiện giám sát và phản biện xã hội; tham gia xây dựng Đảng, Nhà nước.","C. Xét xử các vụ án hình sự, dân sự.","D. Tổ chức thi hành án phạt tù."],"answer":"B","explain":"Mặt trận Tổ quốc Việt Nam thực hiện giám sát, phản biện xã hội; tham gia xây dựng Đảng, xây dựng chính quyền; đại diện, bảo vệ quyền và lợi ích hợp pháp, chính đáng của Nhân dân.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các tổ chức trong hệ thống chính trị phải hoạt động trong khuôn khổ Hiến pháp và pháp luật?","options":["A. Vì Hiến pháp và pháp luật là công cụ để các tổ chức cạnh tranh quyền lực với nhau.","B. Vì Hiến pháp là đạo luật cơ bản, có hiệu lực pháp lí cao nhất; mọi tổ chức, cá nhân đều phải tuân theo để bảo đảm kỉ cương, trật tự xã hội.","C. Vì các tổ chức trong hệ thống chính trị không có Điều lệ riêng.","D. Vì pháp luật chỉ điều chỉnh hoạt động của công dân, không điều chỉnh tổ chức."],"answer":"B","explain":"Hiến pháp có hiệu lực pháp lí cao nhất; nguyên tắc pháp chế đòi hỏi mọi tổ chức trong hệ thống chính trị và mọi công dân đều phải tuân theo Hiến pháp và pháp luật.","points":0.25},{"type":"mcq","level":"VD","q":"Chị H là công nhân, bị công ty nợ lương 3 tháng. Chị đã đến tổ chức công đoàn cơ sở nhờ can thiệp, bảo vệ quyền lợi. Việc làm của chị H thể hiện vai trò nào của tổ chức chính trị – xã hội?","options":["A. Vai trò lãnh đạo Nhà nước và xã hội.","B. Vai trò đại diện, chăm lo, bảo vệ quyền, lợi ích hợp pháp, chính đáng của đoàn viên, người lao động.","C. Vai trò xét xử, giải quyết tranh chấp lao động.","D. Vai trò ban hành chính sách tiền lương."],"answer":"B","explain":"Công đoàn đại diện, chăm lo, bảo vệ quyền, lợi ích hợp pháp, chính đáng của đoàn viên và người lao động; việc chị H nhờ công đoàn can thiệp là thực hiện đúng vai trò này.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định nào sau đây là SAI về hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam?","options":["A. Hệ thống chính trị do Đảng Cộng sản Việt Nam lãnh đạo.","B. Nhà nước là trung tâm của hệ thống chính trị.","C. Mặt trận Tổ quốc Việt Nam là tổ chức chính trị – xã hội lớn nhất.","D. Các tổ chức trong hệ thống chính trị phối hợp chặt chẽ với nhau."],"answer":"C","explain":"C sai: Mặt trận Tổ quốc Việt Nam là tổ chức liên minh chính trị, liên hiệp tự nguyện, không phải tổ chức chính trị – xã hội. Các nhận định còn lại đều đúng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về nguyên tắc hoạt động của hệ thống chính trị:","statements":["a) Đảm bảo sự lãnh đạo của Đảng Cộng sản Việt Nam là nguyên tắc hoạt động của hệ thống chính trị.","b) Phát huy quyền làm chủ của Nhân dân là nguyên tắc hoạt động của hệ thống chính trị.","c) Hệ thống chính trị hoạt động trong khuôn khổ Hiến pháp và pháp luật.","d) Các tổ chức trong hệ thống chính trị được phép hoạt động trái với Hiến pháp nếu vì lợi ích của tổ chức mình."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: đó là ba nguyên tắc hoạt động của hệ thống chính trị nước ta. d) Sai: không tổ chức nào được hoạt động trái Hiến pháp và pháp luật.","points":1},{"type":"truefalse","level":"VD","q":"Đoàn Thanh niên Cộng sản Hồ Chí Minh phường Y tổ chức chiến dịch Mùa hè xanh, thu hút hàng trăm đoàn viên, thanh niên tham gia dọn vệ sinh môi trường, giúp đỡ gia đình chính sách. Xét tính đúng, sai của các nhận định sau:","statements":["a) Hoạt động của Đoàn Thanh niên thể hiện vai trò xung kích của tổ chức chính trị – xã hội trong đời sống xã hội.","b) Đoàn Thanh niên Cộng sản Hồ Chí Minh hoạt động độc lập, không chịu sự lãnh đạo của Đảng.","c) Thanh niên tham gia hoạt động tình nguyện là thực hiện trách nhiệm của công dân đối với cộng đồng.","d) Chỉ đoàn viên Đoàn Thanh niên mới có trách nhiệm bảo vệ môi trường."],"answer":["T","F","T","F"],"explain":"a), c) Đúng. b) Sai: Đoàn Thanh niên Cộng sản Hồ Chí Minh do Đảng Cộng sản Việt Nam lãnh đạo. d) Sai: bảo vệ môi trường là trách nhiệm của mọi công dân, mọi tổ chức.","points":1},{"type":"short","level":"NB","q":"Tổ chức chính trị – xã hội của giai cấp nông dân Việt Nam là tổ chức nào? (Trả lời bằng tên tổ chức)","answer":"Hội Nông dân Việt Nam","explain":"Hội Nông dân Việt Nam là tổ chức chính trị – xã hội của giai cấp nông dân Việt Nam.","points":0.5},{"type":"short","level":"VDC","q":"Điền cụm từ còn thiếu: Mặt trận Tổ quốc Việt Nam là ... chính trị của chính quyền nhân dân.","answer":"cơ sở","explain":"Theo Hiến pháp năm 2013, Mặt trận Tổ quốc Việt Nam là cơ sở chính trị của chính quyền nhân dân.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Cơ quan nào sau đây thuộc bộ phận Nhà nước trong hệ thống chính trị?","options":["A. Quốc hội.","B. Mặt trận Tổ quốc Việt Nam.","C. Đoàn Thanh niên Cộng sản Hồ Chí Minh.","D. Tổng Liên đoàn Lao động Việt Nam."],"answer":"A","explain":"Quốc hội là cơ quan thuộc bộ máy nhà nước, tức thuộc bộ phận Nhà nước trong hệ thống chính trị. Các phương án còn lại thuộc bộ phận Mặt trận Tổ quốc và các tổ chức chính trị – xã hội.","points":0.25},{"type":"mcq","level":"NB","q":"Đảng Cộng sản Việt Nam lãnh đạo Nhà nước và xã hội bằng phương thức chủ yếu nào sau đây?","options":["A. Trực tiếp ra mệnh lệnh hành chính cho mọi cơ quan nhà nước.","B. Cương lĩnh, chiến lược, đường lối, chủ trương, chính sách; công tác tuyên truyền, vận động, tổ chức, kiểm tra và sự gương mẫu của đảng viên.","C. Nắm giữ toàn bộ quyền lập pháp, hành pháp, tư pháp.","D. Ban hành các bản án thay cho Tòa án."],"answer":"B","explain":"Đảng lãnh đạo bằng cương lĩnh, chiến lược, đường lối, chủ trương; bằng công tác tuyên truyền, thuyết phục, vận động, tổ chức, kiểm tra, giám sát và bằng hành động gương mẫu của đảng viên.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa Đảng Cộng sản Việt Nam với Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị – xã hội là mối quan hệ","options":["A. đối lập, cạnh tranh quyền lực.","B. lãnh đạo của Đảng và sự phối hợp hoạt động vì mục tiêu chung.","C. độc lập tuyệt đối, không liên quan đến nhau.","D. cấp trên – cấp dưới trong bộ máy hành chính nhà nước."],"answer":"B","explain":"Đảng Cộng sản Việt Nam lãnh đạo Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị – xã hội; các tổ chức này phối hợp chặt chẽ với nhau dưới sự lãnh đạo của Đảng vì mục tiêu chung.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào sau đây thể hiện quyền làm chủ của Nhân dân trong hệ thống chính trị?","options":["A. Nhân dân bầu cử đại biểu Quốc hội và đại biểu Hội đồng nhân dân.","B. Nhân dân phải tuyệt đối phục tùng mọi quyết định của cơ quan nhà nước mà không được góp ý.","C. Chỉ cán bộ, công chức mới được tham gia quản lí nhà nước.","D. Nhân dân không được giám sát hoạt động của cơ quan nhà nước."],"answer":"A","explain":"Bầu cử, ứng cử vào Quốc hội và Hội đồng nhân dân là hình thức cơ bản để nhân dân thực hiện quyền làm chủ, tham gia quản lí nhà nước.","points":0.25},{"type":"mcq","level":"VD","q":"Gia đình ông S có tranh chấp đất đai với hàng xóm. Ông được Hội Nông dân xã tư vấn pháp luật miễn phí và hòa giải thành công. Hoạt động này của Hội Nông dân thể hiện","options":["A. chức năng xét xử của cơ quan nhà nước.","B. vai trò đại diện, chăm lo, bảo vệ quyền, lợi ích hợp pháp của hội viên, nông dân.","C. quyền ban hành văn bản quy phạm pháp luật.","D. chức năng quản lí đất đai của chính quyền."],"answer":"B","explain":"Tư vấn pháp luật, hòa giải, bảo vệ quyền lợi hội viên là biểu hiện vai trò đại diện, chăm lo, bảo vệ quyền, lợi ích hợp pháp, chính đáng của Hội Nông dân Việt Nam.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong hệ thống chính trị nước ta, vì sao Nhà nước được xác định là trung tâm?","options":["A. Vì Nhà nước có quyền lực cưỡng chế mạnh nhất.","B. Vì Nhà nước là công cụ chủ yếu để nhân dân thực hiện quyền lực của mình, thể chế hoá đường lối của Đảng thành pháp luật và tổ chức quản lí mọi mặt đời sống xã hội.","C. Vì Nhà nước có số lượng cán bộ đông nhất.","D. Vì Nhà nước nắm toàn bộ tài sản công."],"answer":"B","explain":"Nhà nước là trung tâm của hệ thống chính trị vì là tổ chức quyền lực công, là công cụ chủ yếu để nhân dân thực hiện quyền lực; thể chế hoá đường lối của Đảng thành Hiến pháp, pháp luật và tổ chức quản lí xã hội.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về vai trò của các tổ chức trong hệ thống chính trị:","statements":["a) Đảng Cộng sản Việt Nam đề ra đường lối, chủ trương lãnh đạo sự nghiệp cách mạng Việt Nam.","b) Nhà nước thể chế hoá đường lối, chủ trương của Đảng thành Hiến pháp, pháp luật.","c) Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị – xã hội là cầu nối giữa Đảng, Nhà nước với Nhân dân.","d) Các tổ chức trong hệ thống chính trị hoạt động tách rời, không phối hợp với nhau."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: các tổ chức trong hệ thống chính trị có quan hệ gắn bó, phối hợp chặt chẽ với nhau dưới sự lãnh đạo của Đảng.","points":1},{"type":"truefalse","level":"VD","q":"Chị M là hội viên Hội Liên hiệp Phụ nữ phường, tích cực tham gia các buổi tuyên truyền pháp luật về phòng, chống bạo lực gia đình do Hội tổ chức. Xét tính đúng, sai của các nhận định sau:","statements":["a) Hoạt động của Hội Phụ nữ góp phần bảo vệ quyền, lợi ích hợp pháp của phụ nữ và trẻ em.","b) Hội Liên hiệp Phụ nữ Việt Nam là tổ chức chính trị – xã hội do Đảng Cộng sản Việt Nam lãnh đạo.","c) Tuyên truyền pháp luật là nhiệm vụ riêng của cơ quan nhà nước, Hội Phụ nữ không được tham gia.","d) Hội viên tham gia hoạt động Hội là thực hiện quyền làm chủ của mình trong tổ chức chính trị – xã hội."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: tuyên truyền, phổ biến pháp luật là nhiệm vụ chung của cả hệ thống chính trị, trong đó có các tổ chức chính trị – xã hội.","points":1},{"type":"short","level":"NB","q":"Tổ chức nào là cơ sở chính trị của chính quyền nhân dân, thực hiện giám sát và phản biện xã hội? (Trả lời bằng tên tổ chức)","answer":"Mặt trận Tổ quốc Việt Nam","explain":"Mặt trận Tổ quốc Việt Nam là cơ sở chính trị của chính quyền nhân dân; thực hiện giám sát, phản biện xã hội; tham gia xây dựng Đảng, Nhà nước.","points":0.5},{"type":"short","level":"VDC","q":"Điền từ còn thiếu trong nguyên tắc hoạt động của hệ thống chính trị: Đảm bảo sự ... của Đảng Cộng sản Việt Nam.","answer":"lãnh đạo","explain":"Ba nguyên tắc hoạt động của hệ thống chính trị: đảm bảo sự lãnh đạo của Đảng Cộng sản Việt Nam; phát huy quyền làm chủ của Nhân dân; hoạt động trong khuôn khổ Hiến pháp và pháp luật.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Hiến pháp năm 2013 quy định về Đảng Cộng sản Việt Nam tại điều nào?","options":["A. Điều 2.","B. Điều 4.","C. Điều 6.","D. Điều 9."],"answer":"B","explain":"Điều 4 Hiến pháp năm 2013 quy định về Đảng Cộng sản Việt Nam: là lực lượng lãnh đạo Nhà nước và xã hội.","points":0.25},{"type":"mcq","level":"NB","q":"Tổ chức chính trị – xã hội nào sau đây tập hợp cựu chiến binh Việt Nam?","options":["A. Hội Cựu chiến binh Việt Nam.","B. Đoàn Thanh niên Cộng sản Hồ Chí Minh.","C. Hội Nông dân Việt Nam.","D. Tổng Liên đoàn Lao động Việt Nam."],"answer":"A","explain":"Hội Cựu chiến binh Việt Nam là tổ chức chính trị – xã hội của các cựu chiến binh.","points":0.25},{"type":"mcq","level":"TH","q":"Đặc điểm nào sau đây là đặc điểm của hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam?","options":["A. Do nhiều đảng phái thay nhau cầm quyền.","B. Do Đảng Cộng sản Việt Nam lãnh đạo; các tổ chức phối hợp chặt chẽ; hoạt động trong khuôn khổ Hiến pháp, pháp luật.","C. Nhà nước đứng ngoài và đứng trên hệ thống chính trị.","D. Các tổ chức chính trị – xã hội độc lập với Đảng và Nhà nước."],"answer":"B","explain":"Đặc điểm của hệ thống chính trị nước ta: do Đảng Cộng sản Việt Nam lãnh đạo; các tổ chức có quan hệ gắn bó, phối hợp với nhau; hoạt động trong khuôn khổ Hiến pháp và pháp luật.","points":0.25},{"type":"mcq","level":"TH","q":"Việc Quốc hội ban hành luật thể chế hoá đường lối, chủ trương của Đảng thể hiện mối quan hệ nào trong hệ thống chính trị?","options":["A. Đảng lãnh đạo Nhà nước; Nhà nước thể chế hoá đường lối của Đảng thành pháp luật.","B. Nhà nước lãnh đạo Đảng.","C. Đảng và Nhà nước độc lập với nhau.","D. Quốc hội lãnh đạo Đảng."],"answer":"A","explain":"Đảng đề ra đường lối, chủ trương; Nhà nước thể chế hoá thành Hiến pháp, pháp luật — đó là biểu hiện của sự lãnh đạo của Đảng đối với Nhà nước.","points":0.25},{"type":"mcq","level":"VD","q":"Trong cuộc họp lấy ý kiến nhân dân về xây dựng nông thôn mới, bà con thôn X đã thẳng thắn góp ý, phê bình những hạn chế của cán bộ thôn. Việc làm này thể hiện","options":["A. nguyên tắc phát huy quyền làm chủ của Nhân dân và quyền giám sát của nhân dân đối với cán bộ.","B. sự thiếu tôn trọng cán bộ của người dân.","C. nguyên tắc đa đảng đối lập.","D. quyền bất khả xâm phạm về thân thể của công dân."],"answer":"A","explain":"Nhân dân góp ý, phê bình cán bộ là thực hiện quyền làm chủ, quyền giám sát — thể hiện nguyên tắc phát huy quyền làm chủ của Nhân dân trong hệ thống chính trị.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định nào sau đây đúng về tính thống nhất của hệ thống chính trị nước ta?","options":["A. Các tổ chức trong hệ thống chính trị có mục tiêu, lợi ích đối lập nhau.","B. Dù có chức năng, nhiệm vụ khác nhau, các tổ chức trong hệ thống chính trị đều thống nhất dưới sự lãnh đạo của Đảng, vì mục tiêu độc lập dân tộc và chủ nghĩa xã hội.","C. Mỗi tổ chức trong hệ thống chính trị theo đuổi mục tiêu riêng, không liên quan đến nhau.","D. Hệ thống chính trị không có sự phân công chức năng giữa các tổ chức."],"answer":"B","explain":"Tính thống nhất của hệ thống chính trị thể hiện ở sự lãnh đạo thống nhất của Đảng Cộng sản Việt Nam và mục tiêu chung: độc lập dân tộc gắn liền với chủ nghĩa xã hội, vì lợi ích của Nhân dân.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về hệ thống chính trị nước ta:","statements":["a) Hệ thống chính trị nước ta chỉ bao gồm Đảng Cộng sản Việt Nam và Nhà nước.","b) Mặt trận Tổ quốc Việt Nam tập hợp, xây dựng khối đại đoàn kết toàn dân tộc.","c) Đoàn Thanh niên Cộng sản Hồ Chí Minh là đội dự bị tin cậy của Đảng Cộng sản Việt Nam.","d) Đảng Cộng sản Việt Nam chịu sự giám sát của Nhân dân."],"answer":["F","T","T","T"],"explain":"a) Sai: hệ thống chính trị còn có Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị – xã hội. b), c), d) Đúng theo SGK và Điều 4 Hiến pháp 2013.","points":1},{"type":"truefalse","level":"VD","q":"Phường Z triển khai mô hình chính quyền thân thiện: công khai thủ tục hành chính, lắng nghe ý kiến người dân, cán bộ, đảng viên gương mẫu đi đầu. Xét tính đúng, sai của các nhận định sau:","statements":["a) Mô hình trên thể hiện nguyên tắc phát huy quyền làm chủ của Nhân dân.","b) Cán bộ, đảng viên gương mẫu là biểu hiện sự lãnh đạo của Đảng trong hệ thống chính trị.","c) Công khai thủ tục hành chính giúp nhân dân giám sát hoạt động của cơ quan nhà nước.","d) Người dân không có quyền góp ý về cách thức phục vụ của chính quyền phường."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: nhân dân có quyền tham gia quản lí nhà nước, góp ý, giám sát hoạt động của cơ quan nhà nước và cán bộ, công chức.","points":1},{"type":"short","level":"NB","q":"Điều 4 Hiến pháp năm 2013 khẳng định Đảng Cộng sản Việt Nam là lực lượng lãnh đạo ... và xã hội. (Điền từ còn thiếu)","answer":"Nhà nước","explain":"Điều 4 Hiến pháp năm 2013: Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Nhà nước và xã hội.","points":0.5},{"type":"short","level":"VDC","q":"Điền cụm từ còn thiếu: Các tổ chức của Đảng và đảng viên Đảng Cộng sản Việt Nam hoạt động trong khuôn khổ ... và pháp luật.","answer":"Hiến pháp","explain":"Khoản 3 Điều 4 Hiến pháp năm 2013 quy định các tổ chức của Đảng và đảng viên hoạt động trong khuôn khổ Hiến pháp và pháp luật.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Trong hệ thống chính trị, Đảng Cộng sản Việt Nam giữ vị trí nào?","options":["A. Lực lượng lãnh đạo Nhà nước và xã hội.","B. Cơ quan quyền lực nhà nước cao nhất.","C. Tổ chức liên minh chính trị, liên hiệp tự nguyện.","D. Cơ quan hành chính nhà nước cao nhất."],"answer":"A","explain":"Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Nhà nước và xã hội — giữ vị trí lãnh đạo trong hệ thống chính trị.","points":0.25},{"type":"mcq","level":"NB","q":"Tổ chức nào sau đây là thành viên của Mặt trận Tổ quốc Việt Nam?","options":["A. Tổng Liên đoàn Lao động Việt Nam.","B. Quốc hội.","C. Chính phủ.","D. Tòa án nhân dân tối cao."],"answer":"A","explain":"Các tổ chức chính trị – xã hội như Tổng Liên đoàn Lao động Việt Nam là thành viên của Mặt trận Tổ quốc Việt Nam. Quốc hội, Chính phủ, Tòa án thuộc bộ máy nhà nước, không phải thành viên Mặt trận.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói Đảng Cộng sản Việt Nam gắn bó mật thiết với Nhân dân?","options":["A. Vì mọi đảng viên đều là cán bộ nhà nước.","B. Vì Đảng phục vụ Nhân dân, chịu sự giám sát của Nhân dân và chịu trách nhiệm trước Nhân dân về những quyết định của mình.","C. Vì Đảng nắm toàn bộ tài sản của đất nước.","D. Vì Nhân dân phải tuyệt đối phục tùng Đảng."],"answer":"B","explain":"Theo Điều 4 Hiến pháp 2013, Đảng Cộng sản Việt Nam gắn bó mật thiết với Nhân dân, phục vụ Nhân dân, chịu sự giám sát của Nhân dân, chịu trách nhiệm trước Nhân dân về những quyết định của mình.","points":0.25},{"type":"mcq","level":"TH","q":"Hoạt động nào sau đây của Mặt trận Tổ quốc Việt Nam thể hiện chức năng giám sát, phản biện xã hội?","options":["A. Tổ chức hiệp thương giới thiệu người ứng cử đại biểu Quốc hội.","B. Tham gia góp ý, phản biện đối với dự thảo chính sách, pháp luật của Nhà nước.","C. Tổ chức xét xử các vụ án.","D. Trực tiếp quản lí ngân sách nhà nước."],"answer":"B","explain":"Góp ý, phản biện đối với dự thảo chính sách, pháp luật là hoạt động thể hiện chức năng giám sát, phản biện xã hội của Mặt trận Tổ quốc Việt Nam.","points":0.25},{"type":"mcq","level":"VD","q":"Thấy đoạn đường trước nhà bị hư hỏng, ông V đã viết đơn kiến nghị gửi Ủy ban nhân dân phường và được giải quyết kịp thời. Hành động của ông V thể hiện","options":["A. quyền kiến nghị và quyền tham gia quản lí nhà nước của công dân.","B. sự can thiệp vào hoạt động của cơ quan nhà nước.","C. nghĩa vụ nộp thuế của công dân.","D. quyền bất khả xâm phạm về chỗ ở."],"answer":"A","explain":"Công dân kiến nghị với cơ quan nhà nước về những vấn đề ở địa phương là thực hiện quyền tham gia quản lí nhà nước, thể hiện nguyên tắc phát huy quyền làm chủ của Nhân dân.","points":0.25},{"type":"mcq","level":"VDC","q":"Một bạn học sinh cho rằng: Hệ thống chính trị chỉ là việc của người lớn, học sinh không liên quan. Nhận xét nào sau đây là đúng?","options":["A. Đúng, vì học sinh chưa đủ 18 tuổi nên không có quyền gì trong hệ thống chính trị.","B. Sai, vì học sinh có thể tham gia tổ chức Đội, Đoàn; thực hiện quyền làm chủ trong nhà trường; tìm hiểu, tuyên truyền pháp luật và chuẩn bị trở thành công dân tích cực.","C. Đúng, vì hệ thống chính trị chỉ gồm các cơ quan nhà nước.","D. Sai, vì học sinh được trực tiếp bầu cử đại biểu Quốc hội."],"answer":"B","explain":"Học sinh tham gia Đội Thiếu niên Tiền phong, Đoàn Thanh niên, thực hiện dân chủ trong trường học, tìm hiểu pháp luật là những hình thức tham gia vào đời sống chính trị – xã hội, chuẩn bị hành trang công dân.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về tổ chức và hoạt động của Đảng Cộng sản Việt Nam:","statements":["a) Đảng Cộng sản Việt Nam tổ chức và hoạt động theo nguyên tắc tập trung dân chủ.","b) Đảng viên Đảng Cộng sản Việt Nam phải gương mẫu chấp hành Hiến pháp, pháp luật.","c) Tổ chức đảng các cấp được phép ban hành văn bản trái với Hiến pháp.","d) Đảng lãnh đạo hệ thống chính trị thông qua cương lĩnh, đường lối, chủ trương và công tác cán bộ."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: mọi văn bản, hoạt động của tổ chức đảng đều phải phù hợp với Hiến pháp và pháp luật.","points":1},{"type":"truefalse","level":"VD","q":"Lớp 10A tổ chức thảo luận về chủ đề Thanh niên với việc xây dựng hệ thống chính trị. Các bạn đưa ra nhiều ý kiến khác nhau. Xét tính đúng, sai của các nhận định sau:","statements":["a) Học sinh tìm hiểu về hệ thống chính trị là thực hiện quyền và nghĩa vụ học tập, chuẩn bị trở thành công dân tốt.","b) Học sinh không được phép bày tỏ quan điểm về các vấn đề chính trị – xã hội.","c) Tham gia tổ chức Đoàn Thanh niên Cộng sản Hồ Chí Minh là hình thức thanh niên tham gia hệ thống chính trị.","d) Mọi công dân từ đủ 18 tuổi trở lên đều có quyền bầu cử, không phân biệt giới tính, dân tộc, tôn giáo."],"answer":["T","F","T","T"],"explain":"a), c), d) Đúng. b) Sai: công dân có quyền tự do ngôn luận, bày tỏ quan điểm theo quy định của pháp luật.","points":1},{"type":"short","level":"NB","q":"Ai là người sáng lập và rèn luyện Đảng Cộng sản Việt Nam? (Trả lời bằng tên)","answer":"Chủ tịch Hồ Chí Minh","explain":"Đảng Cộng sản Việt Nam do Chủ tịch Hồ Chí Minh sáng lập và rèn luyện.","points":0.5},{"type":"short","level":"VDC","q":"Điền từ còn thiếu: Đảng Cộng sản Việt Nam ... với Nhân dân, phục vụ Nhân dân, chịu sự giám sát của Nhân dân.","answer":"gắn bó mật thiết","explain":"Điều 4 Hiến pháp 2013: Đảng Cộng sản Việt Nam gắn bó mật thiết với Nhân dân, phục vụ Nhân dân, chịu sự giám sát của Nhân dân, chịu trách nhiệm trước Nhân dân về những quyết định của mình.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam trong hệ thống chính trị có vai trò","options":["A. lãnh đạo toàn bộ hệ thống chính trị.","B. là trung tâm, là công cụ chủ yếu để nhân dân thực hiện quyền lực.","C. là tổ chức liên minh chính trị, liên hiệp tự nguyện.","D. là tổ chức chính trị – xã hội của thanh niên."],"answer":"B","explain":"Nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam là trung tâm của hệ thống chính trị, là công cụ chủ yếu để nhân dân thực hiện quyền lực của mình.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các tổ chức sau, tổ chức nào KHÔNG phải là tổ chức chính trị – xã hội?","options":["A. Tổng Liên đoàn Lao động Việt Nam.","B. Hội Liên hiệp Phụ nữ Việt Nam.","C. Hội Nông dân Việt Nam.","D. Hội Khuyến học Việt Nam."],"answer":"D","explain":"Theo SGK, các tổ chức chính trị – xã hội gồm: Tổng Liên đoàn Lao động, Đoàn Thanh niên Cộng sản Hồ Chí Minh, Hội Liên hiệp Phụ nữ, Hội Cựu chiến binh, Hội Nông dân Việt Nam. Hội Khuyến học là tổ chức xã hội.","points":0.25},{"type":"mcq","level":"TH","q":"Sự lãnh đạo của Đảng Cộng sản Việt Nam đối với Nhà nước được thể hiện trước hết ở việc","options":["A. Đảng giới thiệu đảng viên ưu tú để bầu, bổ nhiệm giữ các chức vụ lãnh đạo trong bộ máy nhà nước thông qua công tác cán bộ.","B. Đảng ra mệnh lệnh trực tiếp cho từng cơ quan nhà nước mỗi ngày.","C. Đảng quyết định mọi bản án của Tòa án.","D. Đảng trực tiếp thu thuế của nhân dân."],"answer":"A","explain":"Đảng lãnh đạo Nhà nước thông qua việc đề ra đường lối, chủ trương và công tác cán bộ: giới thiệu đảng viên ưu tú để bầu, bổ nhiệm giữ các chức vụ trong bộ máy nhà nước.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên tắc hoạt động trong khuôn khổ Hiến pháp và pháp luật đòi hỏi","options":["A. chỉ công dân phải tuân theo pháp luật, tổ chức trong hệ thống chính trị thì không cần.","B. mọi tổ chức trong hệ thống chính trị và mọi công dân đều phải tuân theo Hiến pháp và pháp luật.","C. Hiến pháp chỉ có giá trị tham khảo đối với các tổ chức chính trị.","D. các tổ chức được phép làm trái pháp luật khi cần thiết."],"answer":"B","explain":"Nguyên tắc pháp chế đòi hỏi mọi tổ chức trong hệ thống chính trị và mọi công dân đều phải tuân theo Hiến pháp và pháp luật; không tổ chức, cá nhân nào đứng trên pháp luật.","points":0.25},{"type":"mcq","level":"VD","q":"Hằng năm, Ủy ban nhân dân xã tổ chức hội nghị để nhân dân bàn và quyết định mức đóng góp xây dựng công trình phúc lợi ở thôn. Việc làm này thể hiện","options":["A. nguyên tắc phát huy quyền làm chủ trực tiếp của Nhân dân ở cơ sở.","B. sự buông lỏng quản lí của chính quyền xã.","C. nguyên tắc đa đảng cạnh tranh.","D. quyền tự do kinh doanh của công dân."],"answer":"A","explain":"Nhân dân bàn bạc, quyết định trực tiếp những công việc của cộng đồng dân cư là hình thức thực hiện quyền làm chủ trực tiếp ở cơ sở.","points":0.25},{"type":"mcq","level":"VDC","q":"Điểm chung cơ bản nhất giữa các tổ chức trong hệ thống chính trị nước ta là","options":["A. đều là cơ quan nhà nước.","B. đều đặt dưới sự lãnh đạo của Đảng Cộng sản Việt Nam, hoạt động vì mục tiêu độc lập dân tộc và chủ nghĩa xã hội.","C. đều có quyền ban hành văn bản quy phạm pháp luật.","D. đều được ngân sách nhà nước bao cấp toàn bộ kinh phí."],"answer":"B","explain":"Điểm chung cơ bản nhất: tất cả các tổ chức trong hệ thống chính trị đều đặt dưới sự lãnh đạo của Đảng Cộng sản Việt Nam, thống nhất vì mục tiêu độc lập dân tộc gắn liền với chủ nghĩa xã hội.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về hệ thống chính trị:","statements":["a) Đảng Cộng sản Việt Nam là một bộ phận của hệ thống chính trị và giữ vai trò lãnh đạo.","b) Nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam là trung tâm của hệ thống chính trị.","c) Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị – xã hội là cầu nối giữa Đảng, Nhà nước với Nhân dân.","d) Hệ thống chính trị nước ta không cần sự lãnh đạo của bất kì đảng phái nào."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: hệ thống chính trị nước ta do Đảng Cộng sản Việt Nam lãnh đạo — đó là đặc điểm cơ bản, bao trùm nhất.","points":1},{"type":"truefalse","level":"VD","q":"Trong đợt vận động ủng hộ đồng bào bị lũ lụt, Mặt trận Tổ quốc phường phối hợp với Đoàn Thanh niên, Hội Phụ nữ, Hội Cựu chiến binh tổ chức quyên góp, phân phát quà kịp thời, công khai. Xét tính đúng, sai của các nhận định sau:","statements":["a) Hoạt động trên thể hiện sự phối hợp giữa các tổ chức trong hệ thống chính trị vì lợi ích của Nhân dân.","b) Mặt trận Tổ quốc và các tổ chức chính trị – xã hội có vai trò tập hợp, vận động nhân dân.","c) Việc công khai quyên góp thể hiện tính minh bạch, chịu sự giám sát của Nhân dân.","d) Chỉ cơ quan nhà nước mới được tổ chức hoạt động từ thiện, các tổ chức chính trị – xã hội không được tham gia."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: các tổ chức chính trị – xã hội có quyền và trách nhiệm vận động, tổ chức các hoạt động xã hội, từ thiện theo quy định của pháp luật.","points":1},{"type":"short","level":"NB","q":"Hiến pháp hiện hành của nước Cộng hoà xã hội chủ nghĩa Việt Nam được Quốc hội thông qua vào năm nào? (Trả lời bằng số)","answer":"2013","explain":"Hiến pháp hiện hành của nước Cộng hoà xã hội chủ nghĩa Việt Nam được Quốc hội thông qua năm 2013.","points":0.5},{"type":"short","level":"VDC","q":"Điền từ còn thiếu: Phát huy quyền ... của Nhân dân là nguyên tắc hoạt động của hệ thống chính trị.","answer":"làm chủ","explain":"Ba nguyên tắc hoạt động của hệ thống chính trị: đảm bảo sự lãnh đạo của Đảng; phát huy quyền làm chủ của Nhân dân; hoạt động trong khuôn khổ Hiến pháp và pháp luật.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Theo SGK, hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam là","options":["A. hệ thống các cơ quan nhà nước từ trung ương đến địa phương.","B. hệ thống các tổ chức chính trị bao gồm Đảng Cộng sản Việt Nam, Nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam, Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị – xã hội.","C. hệ thống các đảng phái chính trị cạnh tranh nhau.","D. hệ thống các tổ chức kinh tế, doanh nghiệp trong cả nước."],"answer":"B","explain":"Theo SGK, hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam là hệ thống các tổ chức chính trị, bao gồm: Đảng Cộng sản Việt Nam, Nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam, Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị – xã hội.","points":0.25},{"type":"mcq","level":"NB","q":"Chức năng cơ bản của các tổ chức chính trị – xã hội là","options":["A. ban hành Hiến pháp, pháp luật.","B. tập hợp, đoàn kết hội viên, đoàn viên; đại diện, chăm lo, bảo vệ quyền, lợi ích hợp pháp của hội viên; tham gia quản lí nhà nước, quản lí xã hội.","C. xét xử các vụ án.","D. thực hành quyền công tố."],"answer":"B","explain":"Các tổ chức chính trị – xã hội có chức năng tập hợp, đoàn kết hội viên, đoàn viên; đại diện, chăm lo, bảo vệ quyền, lợi ích hợp pháp, chính đáng của hội viên, đoàn viên; tham gia quản lí nhà nước, quản lí xã hội.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Mặt trận Tổ quốc Việt Nam được gọi là cơ sở chính trị của chính quyền nhân dân?","options":["A. Vì Mặt trận trực tiếp bầu ra Chính phủ.","B. Vì Mặt trận tập hợp rộng rãi các tầng lớp nhân dân, tạo sự đồng thuận xã hội, làm chỗ dựa chính trị vững chắc cho chính quyền nhân dân.","C. Vì Mặt trận có quyền bãi nhiệm đại biểu Quốc hội.","D. Vì Mặt trận quản lí toàn bộ ngân sách nhà nước."],"answer":"B","explain":"Mặt trận Tổ quốc tập hợp, xây dựng khối đại đoàn kết toàn dân tộc, tạo đồng thuận xã hội, qua đó làm cơ sở chính trị vững chắc cho chính quyền nhân dân.","points":0.25},{"type":"mcq","level":"TH","q":"Đảng Cộng sản Việt Nam chịu sự giám sát của Nhân dân thể hiện ở việc","options":["A. nhân dân trực tiếp bãi nhiệm Tổng Bí thư.","B. nhân dân góp ý, phê bình tổ chức đảng, đảng viên; Mặt trận Tổ quốc và các tổ chức chính trị – xã hội thực hiện giám sát, phản biện xã hội đối với hoạt động của tổ chức đảng.","C. nhân dân quyết định mọi chủ trương của Đảng.","D. Đảng phải xin phép nhân dân trước khi họp."],"answer":"B","explain":"Theo Điều 4 Hiến pháp 2013, Đảng chịu sự giám sát của Nhân dân; nhân dân, Mặt trận Tổ quốc và các tổ chức chính trị – xã hội góp ý, phê bình, giám sát hoạt động của tổ chức đảng và đảng viên.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn A 16 tuổi tích cực tham gia sinh hoạt Đoàn ở trường, tuyên truyền phòng, chống ma túy trong khu phố. Việc làm của bạn A thể hiện","options":["A. bạn A đã tham gia vào hệ thống chính trị với tư cách đoàn viên Đoàn Thanh niên Cộng sản Hồ Chí Minh.","B. bạn A đang thực hiện chức năng quản lí nhà nước.","C. bạn A đã đủ điều kiện ứng cử đại biểu Quốc hội.","D. bạn A đang thay thế vai trò của chính quyền."],"answer":"A","explain":"Đoàn Thanh niên Cộng sản Hồ Chí Minh là tổ chức chính trị – xã hội trong hệ thống chính trị; đoàn viên tích cực tham gia hoạt động Đoàn là hình thức tham gia hệ thống chính trị của thanh niên.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định nào sau đây đúng về nguyên tắc tập trung dân chủ trong hệ thống chính trị?","options":["A. Nguyên tắc tập trung dân chủ chỉ áp dụng trong Đảng, không áp dụng trong các tổ chức khác.","B. Tập trung dân chủ là nguyên tắc tổ chức và hoạt động của Đảng và các tổ chức trong hệ thống chính trị: dân chủ trong thảo luận, tập trung trong hành động, thiểu số phục tùng đa số.","C. Tập trung dân chủ có nghĩa là mọi việc đều do tập thể quyết định, cá nhân không có trách nhiệm.","D. Tập trung dân chủ đồng nghĩa với đa đảng đối lập."],"answer":"B","explain":"Tập trung dân chủ là nguyên tắc cơ bản trong tổ chức và hoạt động của Đảng Cộng sản Việt Nam và các tổ chức trong hệ thống chính trị: phát huy dân chủ trong thảo luận, bảo đảm tập trung thống nhất trong hành động.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về vai trò lãnh đạo của Đảng Cộng sản Việt Nam:","statements":["a) Đảng Cộng sản Việt Nam là đảng duy nhất lãnh đạo Nhà nước và xã hội ở nước ta.","b) Đảng hoạt động theo Điều lệ Đảng và trong khuôn khổ Hiến pháp, pháp luật.","c) Mọi đảng viên đều phải gương mẫu trong cuộc sống và công tác.","d) Đảng không cần lắng nghe ý kiến góp ý của Nhân dân."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Đảng gắn bó mật thiết với Nhân dân, lắng nghe ý kiến góp ý, chịu sự giám sát của Nhân dân.","points":1},{"type":"truefalse","level":"VD","q":"Trước kì họp Hội đồng nhân dân xã, cử tri thôn X đã gửi nhiều ý kiến kiến nghị về việc sửa chữa đường giao thông, xây dựng nhà văn hoá thôn. Xét tính đúng, sai của các nhận định sau:","statements":["a) Việc cử tri gửi ý kiến kiến nghị là thực hiện quyền tham gia quản lí nhà nước.","b) Hội đồng nhân dân có trách nhiệm tiếp thu, xem xét ý kiến, kiến nghị của cử tri.","c) Cử tri chỉ được kiến nghị những việc liên quan trực tiếp đến bản thân mình.","d) Mọi kiến nghị của cử tri đều phải được cơ quan nhà nước giải quyết ngay lập tức."],"answer":["T","T","F","F"],"explain":"a), b) Đúng. c) Sai: cử tri có quyền kiến nghị về mọi vấn đề của địa phương, đất nước. d) Sai: cơ quan nhà nước xem xét, giải quyết theo thẩm quyền và quy định của pháp luật, không phải mọi kiến nghị đều được giải quyết ngay.","points":1},{"type":"short","level":"NB","q":"Hệ thống chính trị nước ta gồm ba bộ phận: Đảng Cộng sản Việt Nam, Nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam và ... (Điền cụm từ còn thiếu)","answer":"Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị – xã hội","explain":"Ba bộ phận của hệ thống chính trị: Đảng Cộng sản Việt Nam; Nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam; Mặt trận Tổ quốc Việt Nam và các tổ chức chính trị – xã hội.","points":0.5},{"type":"short","level":"VDC","q":"Điền từ còn thiếu trong nhận định: Đảng Cộng sản Việt Nam là ... lãnh đạo Nhà nước và xã hội.","answer":"lực lượng","explain":"Điều 4 Hiến pháp năm 2013: Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Nhà nước và xã hội.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Tổ chức nào sau đây vừa là tổ chức chính trị – xã hội, vừa do Đảng Cộng sản Việt Nam sáng lập, lãnh đạo và rèn luyện?","options":["A. Đoàn Thanh niên Cộng sản Hồ Chí Minh.","B. Quốc hội.","C. Chính phủ.","D. Tòa án nhân dân tối cao."],"answer":"A","explain":"Đoàn Thanh niên Cộng sản Hồ Chí Minh là tổ chức chính trị – xã hội do Đảng Cộng sản Việt Nam sáng lập, lãnh đạo và rèn luyện.","points":0.25},{"type":"mcq","level":"NB","q":"Quyền làm chủ của Nhân dân được thực hiện thông qua hình thức nào sau đây?","options":["A. Chỉ thông qua người đại diện duy nhất là trưởng thôn.","B. Dân chủ trực tiếp và dân chủ gián tiếp (thông qua bầu cử, ứng cử vào các cơ quan đại diện).","C. Chỉ thông qua việc nộp thuế đầy đủ.","D. Chỉ thông qua việc chấp hành pháp luật."],"answer":"B","explain":"Nhân dân thực hiện quyền làm chủ bằng hình thức dân chủ trực tiếp (bàn bạc, quyết định trực tiếp) và dân chủ gián tiếp (thông qua bầu cử, ứng cử đại biểu vào Quốc hội, Hội đồng nhân dân).","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào sau đây KHÔNG thuộc vai trò của Nhà nước trong hệ thống chính trị?","options":["A. Thể chế hoá đường lối, chủ trương của Đảng thành Hiến pháp, pháp luật.","B. Tổ chức quản lí mọi mặt đời sống xã hội bằng pháp luật.","C. Lãnh đạo tư tưởng, đề ra cương lĩnh chính trị cho toàn xã hội.","D. Bảo đảm quyền làm chủ của Nhân dân bằng pháp luật."],"answer":"C","explain":"Lãnh đạo tư tưởng, đề ra cương lĩnh chính trị là vai trò của Đảng Cộng sản Việt Nam, không phải của Nhà nước.","points":0.25},{"type":"mcq","level":"TH","q":"Mặt trận Tổ quốc Việt Nam tổ chức hiệp thương, giới thiệu người ứng cử đại biểu Quốc hội nhằm","options":["A. thay thế quyền bầu cử của công dân.","B. bảo đảm việc lựa chọn, giới thiệu người ứng cử dân chủ, đúng pháp luật, phát huy quyền làm chủ của Nhân dân trong bầu cử.","C. quyết định thay nhân dân ai sẽ trúng cử.","D. hạn chế quyền ứng cử của công dân."],"answer":"B","explain":"Hiệp thương của Mặt trận Tổ quốc nhằm bảo đảm dân chủ trong việc lựa chọn, giới thiệu người ứng cử, phát huy quyền làm chủ của Nhân dân trong bầu cử.","points":0.25},{"type":"mcq","level":"VD","q":"Ông P phát hiện cán bộ địa chính xã có hành vi vòi vĩnh tiền khi làm thủ tục cấp giấy chứng nhận quyền sử dụng đất. Ông P nên làm gì để thực hiện quyền giám sát của nhân dân?","options":["A. Im lặng vì sợ bị trù dập.","B. Tố cáo hành vi vi phạm đến cơ quan, người có thẩm quyền theo quy định của pháp luật.","C. Tự ý đến nhà cán bộ đó để đòi lại công bằng.","D. Đăng tin bịa đặt về cán bộ đó lên mạng xã hội."],"answer":"B","explain":"Công dân thực hiện quyền giám sát, tố cáo hành vi vi phạm pháp luật đến cơ quan, người có thẩm quyền theo đúng trình tự pháp luật — đó là thực hiện quyền làm chủ của Nhân dân.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong các ý kiến sau, ý kiến nào đúng về trách nhiệm của học sinh đối với hệ thống chính trị?","options":["A. Học sinh chỉ cần học giỏi, không cần quan tâm đến hệ thống chính trị.","B. Học sinh cần tích cực học tập, rèn luyện; tìm hiểu Hiến pháp, pháp luật; tham gia các tổ chức Đội, Đoàn; thực hiện dân chủ trong nhà trường; sống có trách nhiệm với cộng đồng.","C. Học sinh phải tham gia lãnh đạo các tổ chức chính trị – xã hội ở địa phương.","D. Học sinh được miễn mọi nghĩa vụ công dân cho đến khi đủ 18 tuổi."],"answer":"B","explain":"Học sinh có trách nhiệm học tập, rèn luyện đạo đức; tìm hiểu Hiến pháp, pháp luật; tham gia Đội, Đoàn; thực hiện tốt dân chủ trong nhà trường và trách nhiệm công dân — góp phần xây dựng hệ thống chính trị vững mạnh.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về bản chất của hệ thống chính trị:","statements":["a) Hệ thống chính trị nước Cộng hoà xã hội chủ nghĩa Việt Nam mang bản chất của giai cấp công nhân và nhân dân lao động.","b) Mọi tổ chức trong hệ thống chính trị đều hoạt động vì lợi ích của Nhân dân.","c) Đảng Cộng sản Việt Nam ở ngoài vòng pháp luật, không ai được giám sát Đảng.","d) Phát huy quyền làm chủ của Nhân dân vừa là mục tiêu, vừa là nguyên tắc hoạt động của hệ thống chính trị."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: Đảng hoạt động trong khuôn khổ Hiến pháp và pháp luật, chịu sự giám sát của Nhân dân.","points":1},{"type":"truefalse","level":"VD","q":"Nhân dịp kỉ niệm ngày thành lập Đoàn, Đoàn trường THPT X tổ chức diễn đàn Tuổi trẻ với quê hương, đoàn viên, thanh niên sôi nổi hiến kế xây dựng địa phương. Xét tính đúng, sai của các nhận định sau:","statements":["a) Diễn đàn là hình thức để đoàn viên, thanh niên tham gia đóng góp ý kiến vào sự phát triển của địa phương.","b) Đoàn Thanh niên Cộng sản Hồ Chí Minh là trường học xã hội chủ nghĩa của thanh niên.","c) Chỉ cán bộ Đoàn mới được tham gia hiến kế, đoàn viên thường không có quyền.","d) Thanh niên hiến kế xây dựng quê hương là thực hiện trách nhiệm công dân."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng: Đoàn là trường học xã hội chủ nghĩa của thanh niên; mọi đoàn viên đều có quyền tham gia. c) Sai: mọi đoàn viên, thanh niên đều có quyền đóng góp ý kiến.","points":1},{"type":"short","level":"NB","q":"Ba nguyên tắc hoạt động của hệ thống chính trị nước ta là: đảm bảo sự lãnh đạo của Đảng Cộng sản Việt Nam; phát huy quyền làm chủ của Nhân dân và ... (Điền cụm từ còn thiếu)","answer":"hoạt động trong khuôn khổ Hiến pháp và pháp luật","explain":"Ba nguyên tắc: đảm bảo sự lãnh đạo của Đảng Cộng sản Việt Nam; phát huy quyền làm chủ của Nhân dân; hoạt động trong khuôn khổ Hiến pháp và pháp luật.","points":0.5},{"type":"short","level":"VDC","q":"Điền từ còn thiếu: Đảng Cộng sản Việt Nam là đội tiên phong của ... , đồng thời là đội tiên phong của nhân dân lao động và của dân tộc Việt Nam.","answer":"giai cấp công nhân","explain":"Điều 4 Hiến pháp năm 2013: Đảng Cộng sản Việt Nam là đội tiên phong của giai cấp công nhân, đồng thời là đội tiên phong của nhân dân lao động và của dân tộc Việt Nam.","points":0.5}]}]}
