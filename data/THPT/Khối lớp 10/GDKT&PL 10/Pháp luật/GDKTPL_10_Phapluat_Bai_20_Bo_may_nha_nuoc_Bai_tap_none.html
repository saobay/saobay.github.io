<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Quốc hội nước Cộng hoà xã hội chủ nghĩa Việt Nam là","options":["A. cơ quan quyền lực nhà nước cao nhất; cơ quan đại biểu cao nhất của Nhân dân.","B. cơ quan hành chính nhà nước cao nhất.","C. cơ quan xét xử cao nhất.","D. cơ quan lãnh đạo duy nhất của hệ thống chính trị."],"answer":"A","explain":"Theo Hiến pháp 2013, Quốc hội là cơ quan đại biểu cao nhất của Nhân dân, cơ quan quyền lực nhà nước cao nhất của nước Cộng hoà xã hội chủ nghĩa Việt Nam.","points":0.25},{"type":"mcq","level":"NB","q":"Chủ tịch nước Cộng hoà xã hội chủ nghĩa Việt Nam là","options":["A. người đứng đầu Chính phủ.","B. nguyên thủ quốc gia, thay mặt nước Cộng hoà xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại.","C. người đứng đầu Quốc hội.","D. người đứng đầu Tòa án nhân dân tối cao."],"answer":"B","explain":"Chủ tịch nước là nguyên thủ quốc gia, thay mặt nước Cộng hoà xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại.","points":0.25},{"type":"mcq","level":"TH","q":"Chính phủ nước Cộng hoà xã hội chủ nghĩa Việt Nam là","options":["A. cơ quan hành chính nhà nước cao nhất, thực hiện quyền hành pháp; cơ quan chấp hành của Quốc hội.","B. cơ quan quyền lực nhà nước cao nhất.","C. cơ quan xét xử các vụ án.","D. cơ quan thực hành quyền công tố."],"answer":"A","explain":"Chính phủ là cơ quan hành chính nhà nước cao nhất của nước Cộng hoà xã hội chủ nghĩa Việt Nam, thực hiện quyền hành pháp, là cơ quan chấp hành của Quốc hội.","points":0.25},{"type":"mcq","level":"TH","q":"Tòa án nhân dân là cơ quan","options":["A. xét xử, thực hiện quyền tư pháp.","B. thực hành quyền công tố.","C. hành chính nhà nước cao nhất.","D. quyền lực nhà nước ở địa phương."],"answer":"A","explain":"Tòa án nhân dân là cơ quan xét xử của nước Cộng hoà xã hội chủ nghĩa Việt Nam, thực hiện quyền tư pháp.","points":0.25},{"type":"mcq","level":"VD","q":"Ủy ban nhân dân phường ra quyết định xử phạt vi phạm hành chính đối với hộ kinh doanh lấn chiếm vỉa hè. Việc làm này thể hiện Ủy ban nhân dân là","options":["A. cơ quan quyền lực nhà nước ở địa phương.","B. cơ quan chấp hành của Hội đồng nhân dân, cơ quan hành chính nhà nước ở địa phương.","C. cơ quan xét xử ở địa phương.","D. cơ quan kiểm sát ở địa phương."],"answer":"B","explain":"Ủy ban nhân dân do Hội đồng nhân dân cùng cấp bầu, là cơ quan chấp hành của Hội đồng nhân dân, cơ quan hành chính nhà nước ở địa phương; việc xử phạt vi phạm hành chính là hoạt động quản lí hành chính.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong các nhận định sau, nhận định nào đúng về nguyên tắc bảo đảm tính pháp chế xã hội chủ nghĩa trong tổ chức và hoạt động của bộ máy nhà nước?","options":["A. Chỉ công dân phải tuân theo pháp luật, cơ quan nhà nước thì không cần.","B. Mọi cơ quan, tổ chức, cá nhân đều phải tuân theo Hiến pháp và pháp luật; cơ quan nhà nước chỉ được làm những gì pháp luật cho phép.","C. Cơ quan nhà nước được phép làm trái pháp luật khi vì lợi ích quốc gia.","D. Pháp chế xã hội chủ nghĩa chỉ áp dụng trong hoạt động xét xử."],"answer":"B","explain":"Nguyên tắc pháp chế xã hội chủ nghĩa đòi hỏi mọi cơ quan, tổ chức, cá nhân đều phải tuân theo Hiến pháp và pháp luật; cơ quan nhà nước, cán bộ, công chức chỉ được làm những việc pháp luật cho phép.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về vị trí, chức năng của Quốc hội:","statements":["a) Quốc hội là cơ quan quyền lực nhà nước cao nhất của nước Cộng hoà xã hội chủ nghĩa Việt Nam.","b) Quốc hội thực hiện quyền lập hiến, quyền lập pháp.","c) Quốc hội quyết định những vấn đề quan trọng của đất nước và giám sát tối cao đối với hoạt động của Nhà nước.","d) Quốc hội là cơ quan hành chính nhà nước cao nhất."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo Hiến pháp 2013. d) Sai: cơ quan hành chính nhà nước cao nhất là Chính phủ.","points":1},{"type":"truefalse","level":"VD","q":"Thấy quyết định xử phạt vi phạm hành chính của Ủy ban nhân dân phường có dấu hiệu trái pháp luật, ông N đã làm đơn khiếu nại đến Chủ tịch Ủy ban nhân dân phường. Xét tính đúng, sai của các nhận định sau:","statements":["a) Ông N thực hiện quyền khiếu nại theo quy định của pháp luật.","b) Ủy ban nhân dân phường có trách nhiệm xem xét, giải quyết khiếu nại của ông N.","c) Công dân không có quyền khiếu nại quyết định hành chính của cơ quan nhà nước.","d) Việc khiếu nại của ông N là hình thức nhân dân tham gia giám sát hoạt động của bộ máy nhà nước."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: công dân có quyền khiếu nại quyết định hành chính, hành vi hành chính khi có căn cứ cho rằng trái pháp luật, xâm phạm quyền, lợi ích hợp pháp của mình.","points":1},{"type":"short","level":"NB","q":"Cơ quan quyền lực nhà nước cao nhất của nước Cộng hoà xã hội chủ nghĩa Việt Nam là cơ quan nào? (Trả lời bằng tên cơ quan)","answer":"Quốc hội","explain":"Quốc hội là cơ quan đại biểu cao nhất của Nhân dân, cơ quan quyền lực nhà nước cao nhất của nước Cộng hoà xã hội chủ nghĩa Việt Nam.","points":0.5},{"type":"short","level":"VDC","q":"Điền từ còn thiếu: Tòa án nhân dân là cơ quan ..., thực hiện quyền tư pháp.","answer":"xét xử","explain":"Theo Hiến pháp 2013, Tòa án nhân dân là cơ quan xét xử của nước Cộng hoà xã hội chủ nghĩa Việt Nam, thực hiện quyền tư pháp.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Hội đồng nhân dân là","options":["A. cơ quan quyền lực nhà nước ở địa phương, đại diện cho ý chí, nguyện vọng của Nhân dân địa phương.","B. cơ quan hành chính nhà nước cao nhất.","C. cơ quan xét xử ở địa phương.","D. cơ quan lãnh đạo của Đảng ở địa phương."],"answer":"A","explain":"Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương, đại diện cho ý chí, nguyện vọng của Nhân dân địa phương, do Nhân dân địa phương bầu ra.","points":0.25},{"type":"mcq","level":"NB","q":"Ủy ban nhân dân là","options":["A. cơ quan quyền lực nhà nước ở địa phương.","B. cơ quan chấp hành của Hội đồng nhân dân, cơ quan hành chính nhà nước ở địa phương.","C. cơ quan xét xử ở địa phương.","D. tổ chức chính trị – xã hội ở địa phương."],"answer":"B","explain":"Ủy ban nhân dân do Hội đồng nhân dân cùng cấp bầu, là cơ quan chấp hành của Hội đồng nhân dân, cơ quan hành chính nhà nước ở địa phương, chịu trách nhiệm trước Hội đồng nhân dân và cơ quan hành chính nhà nước cấp trên.","points":0.25},{"type":"mcq","level":"TH","q":"Viện kiểm sát nhân dân có chức năng","options":["A. xét xử các vụ án hình sự.","B. thực hành quyền công tố, kiểm sát hoạt động tư pháp.","C. ban hành Hiến pháp và luật.","D. quản lí, điều hành nền kinh tế."],"answer":"B","explain":"Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp của nước Cộng hoà xã hội chủ nghĩa Việt Nam.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào sau đây KHÔNG phải là nguyên tắc tổ chức và hoạt động của bộ máy nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam?","options":["A. Đảng Cộng sản Việt Nam lãnh đạo.","B. Bảo đảm tính pháp chế xã hội chủ nghĩa.","C. Tập trung dân chủ.","D. Tam quyền phân lập tuyệt đối."],"answer":"D","explain":"Các nguyên tắc tổ chức và hoạt động của bộ máy nhà nước ta: Đảng Cộng sản Việt Nam lãnh đạo; bảo đảm tính pháp chế xã hội chủ nghĩa; tập trung dân chủ; nhân dân tham gia quản lí nhà nước và xã hội. Việt Nam không áp dụng tam quyền phân lập tuyệt đối mà thực hiện phân công, phối hợp, kiểm soát quyền lực.","points":0.25},{"type":"mcq","level":"VD","q":"Trong cuộc họp cơ quan, mọi cán bộ, công chức được tự do phát biểu ý kiến; sau khi thảo luận, tập thể biểu quyết theo đa số và mọi người nghiêm túc chấp hành. Cách làm việc này thể hiện nguyên tắc","options":["A. tập trung dân chủ.","B. pháp chế xã hội chủ nghĩa.","C. Đảng lãnh đạo tuyệt đối.","D. phân quyền tuyệt đối."],"answer":"A","explain":"Dân chủ trong thảo luận, tập trung trong hành động, thiểu số phục tùng đa số — đó là biểu hiện của nguyên tắc tập trung dân chủ.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao Hiến pháp năm 2013 quy định quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan trong việc thực hiện quyền lập pháp, hành pháp, tư pháp?","options":["A. Để các cơ quan nhà nước cạnh tranh quyền lực với nhau.","B. Để bảo đảm quyền lực nhà nước thuộc về Nhân dân, các cơ quan phối hợp hiệu quả và kiểm soát lẫn nhau, tránh lạm quyền.","C. Để giảm bớt số lượng cơ quan nhà nước.","D. Để mọi cơ quan đều có quyền ban hành luật."],"answer":"B","explain":"Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp nhằm bảo đảm quyền lực thuộc về Nhân dân và tránh lạm quyền.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về Chính phủ và Chủ tịch nước:","statements":["a) Chính phủ là cơ quan hành chính nhà nước cao nhất, thực hiện quyền hành pháp.","b) Chính phủ là cơ quan chấp hành của Quốc hội.","c) Chủ tịch nước là nguyên thủ quốc gia, thay mặt nước Cộng hoà xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại.","d) Chủ tịch nước là người đứng đầu Chính phủ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo Hiến pháp 2013. d) Sai: người đứng đầu Chính phủ là Thủ tướng Chính phủ.","points":1},{"type":"truefalse","level":"VD","q":"Tại phiên tòa xét xử vụ án trộm cắp tài sản, Kiểm sát viên thực hành quyền công tố, đề nghị mức hình phạt; Hội đồng xét xử tuyên án theo quy định của pháp luật. Xét tính đúng, sai của các nhận định sau:","statements":["a) Viện kiểm sát nhân dân thực hành quyền công tố tại phiên tòa.","b) Tòa án nhân dân là cơ quan xét xử, thực hiện quyền tư pháp.","c) Viện kiểm sát nhân dân có quyền tuyên án thay cho Tòa án.","d) Mọi hoạt động tố tụng đều phải tuân theo quy định của pháp luật."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: chỉ Tòa án nhân dân mới có quyền xét xử, tuyên án; Viện kiểm sát thực hành quyền công tố và kiểm sát hoạt động tư pháp.","points":1},{"type":"short","level":"NB","q":"Cơ quan hành chính nhà nước cao nhất của nước Cộng hoà xã hội chủ nghĩa Việt Nam là cơ quan nào? (Trả lời bằng tên cơ quan)","answer":"Chính phủ","explain":"Chính phủ là cơ quan hành chính nhà nước cao nhất của nước Cộng hoà xã hội chủ nghĩa Việt Nam, thực hiện quyền hành pháp.","points":0.5},{"type":"short","level":"VDC","q":"Điền cụm từ còn thiếu: Viện kiểm sát nhân dân thực hành quyền ..., kiểm sát hoạt động tư pháp.","answer":"công tố","explain":"Theo Hiến pháp 2013, Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Kiểm toán nhà nước có chức năng","options":["A. kiểm toán việc quản lí, sử dụng tài chính, tài sản công.","B. xét xử các vụ án tham nhũng.","C. ban hành luật về ngân sách.","D. thực hành quyền công tố."],"answer":"A","explain":"Kiểm toán nhà nước là cơ quan kiểm toán việc quản lí, sử dụng tài chính, tài sản công do Quốc hội thành lập, hoạt động độc lập và chỉ tuân theo pháp luật.","points":0.25},{"type":"mcq","level":"NB","q":"Trong bộ máy nhà nước, cơ quan nào thực hiện quyền lập pháp?","options":["A. Quốc hội.","B. Chính phủ.","C. Tòa án nhân dân tối cao.","D. Viện kiểm sát nhân dân tối cao."],"answer":"A","explain":"Quốc hội thực hiện quyền lập hiến, quyền lập pháp — là cơ quan duy nhất có quyền ban hành Hiến pháp và luật.","points":0.25},{"type":"mcq","level":"TH","q":"Hội đồng nhân dân và Ủy ban nhân dân có mối quan hệ nào sau đây?","options":["A. Ủy ban nhân dân là cơ quan chấp hành của Hội đồng nhân dân, do Hội đồng nhân dân cùng cấp bầu ra.","B. Hội đồng nhân dân là cơ quan chấp hành của Ủy ban nhân dân.","C. Hai cơ quan độc lập, không có quan hệ với nhau.","D. Ủy ban nhân dân lãnh đạo Hội đồng nhân dân."],"answer":"A","explain":"Ủy ban nhân dân do Hội đồng nhân dân cùng cấp bầu, là cơ quan chấp hành của Hội đồng nhân dân, chịu trách nhiệm và báo cáo công tác trước Hội đồng nhân dân.","points":0.25},{"type":"mcq","level":"TH","q":"Mọi cơ quan, tổ chức, cá nhân đều phải tuân theo Hiến pháp và pháp luật là nội dung của nguyên tắc","options":["A. Đảng Cộng sản Việt Nam lãnh đạo.","B. bảo đảm tính pháp chế xã hội chủ nghĩa.","C. tập trung dân chủ.","D. nhân dân tham gia quản lí nhà nước."],"answer":"B","explain":"Nguyên tắc bảo đảm tính pháp chế xã hội chủ nghĩa đòi hỏi mọi cơ quan, tổ chức, cá nhân đều phải tuân theo Hiến pháp và pháp luật.","points":0.25},{"type":"mcq","level":"VD","q":"Người dân xã Y phát hiện cán bộ xã thu tiền làm giấy tờ cao hơn mức quy định. Người dân đã phản ánh đến Hội đồng nhân dân xã. Việc làm này thể hiện","options":["A. quyền giám sát của Nhân dân đối với hoạt động của cơ quan nhà nước.","B. sự can thiệp trái phép vào hoạt động của chính quyền.","C. quyền tự do kinh doanh của công dân.","D. nghĩa vụ bảo vệ Tổ quốc."],"answer":"A","explain":"Nhân dân phản ánh, kiến nghị với Hội đồng nhân dân về vi phạm của cán bộ là thực hiện quyền giám sát của Nhân dân đối với bộ máy nhà nước.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định nào sau đây đúng về vị trí của Chủ tịch nước trong bộ máy nhà nước?","options":["A. Chủ tịch nước là người đứng đầu Quốc hội.","B. Chủ tịch nước là nguyên thủ quốc gia, do Quốc hội bầu trong số đại biểu Quốc hội; có nhiệm vụ, quyền hạn theo quy định của Hiến pháp.","C. Chủ tịch nước là người đứng đầu Chính phủ.","D. Chủ tịch nước do Thủ tướng Chính phủ bổ nhiệm."],"answer":"B","explain":"Chủ tịch nước do Quốc hội bầu trong số đại biểu Quốc hội, là nguyên thủ quốc gia, thay mặt nước Cộng hoà xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về Hội đồng nhân dân và Ủy ban nhân dân:","statements":["a) Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương.","b) Ủy ban nhân dân là cơ quan hành chính nhà nước ở địa phương.","c) Hội đồng nhân dân do Ủy ban nhân dân cùng cấp bầu ra.","d) Ủy ban nhân dân chịu trách nhiệm trước Hội đồng nhân dân cùng cấp và cơ quan hành chính nhà nước cấp trên."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: Ủy ban nhân dân do Hội đồng nhân dân cùng cấp bầu ra; Hội đồng nhân dân do Nhân dân địa phương bầu ra.","points":1},{"type":"truefalse","level":"VD","q":"Kiểm toán nhà nước tiến hành kiểm toán việc sử dụng ngân sách tại một dự án giao thông và phát hiện nhiều sai phạm, kiến nghị xử lí theo quy định. Xét tính đúng, sai của các nhận định sau:","statements":["a) Kiểm toán nhà nước có chức năng kiểm toán việc quản lí, sử dụng tài chính, tài sản công.","b) Kiểm toán nhà nước do Quốc hội thành lập, hoạt động độc lập và chỉ tuân theo pháp luật.","c) Kiểm toán nhà nước có quyền tuyên án đối với các sai phạm phát hiện được.","d) Kết quả kiểm toán góp phần tăng cường kỉ luật tài chính và phòng, chống tham nhũng."],"answer":["T","T","F","T"],"explain":"a), b), d) Đúng. c) Sai: Kiểm toán nhà nước không có quyền xét xử, tuyên án; cơ quan này kiến nghị xử lí theo quy định của pháp luật.","points":1},{"type":"short","level":"NB","q":"Cơ quan nào thực hành quyền công tố, kiểm sát hoạt động tư pháp? (Trả lời bằng tên cơ quan)","answer":"Viện kiểm sát nhân dân","explain":"Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp của nước Cộng hoà xã hội chủ nghĩa Việt Nam.","points":0.5},{"type":"short","level":"VDC","q":"Điền cụm từ còn thiếu: Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, ... giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp.","answer":"kiểm soát","explain":"Điều 2 Hiến pháp năm 2013: Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Bộ máy nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam gồm các cơ quan nào sau đây?","options":["A. Quốc hội, Chủ tịch nước, Chính phủ, Tòa án nhân dân, Viện kiểm sát nhân dân, Hội đồng nhân dân, Ủy ban nhân dân, Kiểm toán nhà nước.","B. Đảng, Nhà nước, Mặt trận Tổ quốc và các đoàn thể.","C. Quốc hội, Chính phủ, Đảng Cộng sản Việt Nam, Đoàn Thanh niên.","D. Tòa án, Viện kiểm sát, Công an, Quân đội."],"answer":"A","explain":"Bộ máy nhà nước gồm: Quốc hội, Chủ tịch nước, Chính phủ, Tòa án nhân dân, Viện kiểm sát nhân dân, Hội đồng nhân dân, Ủy ban nhân dân và Kiểm toán nhà nước.","points":0.25},{"type":"mcq","level":"NB","q":"Cơ quan nào sau đây thuộc nhóm cơ quan quyền lực nhà nước?","options":["A. Quốc hội và Hội đồng nhân dân.","B. Chính phủ và Ủy ban nhân dân.","C. Tòa án nhân dân các cấp.","D. Viện kiểm sát nhân dân các cấp."],"answer":"A","explain":"Quốc hội là cơ quan quyền lực nhà nước cao nhất; Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương.","points":0.25},{"type":"mcq","level":"TH","q":"Cơ quan nào sau đây thuộc nhóm cơ quan hành chính nhà nước?","options":["A. Quốc hội và Hội đồng nhân dân.","B. Chính phủ và Ủy ban nhân dân.","C. Tòa án nhân dân và Viện kiểm sát nhân dân.","D. Kiểm toán nhà nước và Mặt trận Tổ quốc."],"answer":"B","explain":"Chính phủ là cơ quan hành chính nhà nước cao nhất; Ủy ban nhân dân là cơ quan hành chính nhà nước ở địa phương.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên tắc tập trung dân chủ trong tổ chức và hoạt động của bộ máy nhà nước được hiểu là","options":["A. mọi việc đều do một người quyết định.","B. dân chủ trong thảo luận, tập trung trong hành động; thiểu số phục tùng đa số, cấp dưới phục tùng cấp trên.","C. mọi cơ quan đều độc lập tuyệt đối với nhau.","D. nhân dân quyết định mọi công việc của Nhà nước mà không cần cơ quan đại diện."],"answer":"B","explain":"Tập trung dân chủ: phát huy dân chủ trong thảo luận, bảo đảm tập trung thống nhất trong hành động; thiểu số phục tùng đa số, cấp dưới phục tùng cấp trên, cá nhân phục tùng tổ chức.","points":0.25},{"type":"mcq","level":"VD","q":"Tòa án nhân dân huyện X xét xử công khai vụ án cố ý gây thương tích và tuyên phạt bị cáo theo đúng quy định của Bộ luật Hình sự. Việc làm này thể hiện","options":["A. Tòa án là cơ quan xét xử, thực hiện quyền tư pháp; mọi hoạt động xét xử tuân theo pháp luật.","B. Tòa án là cơ quan hành chính ở địa phương.","C. Tòa án có quyền ban hành luật.","D. Tòa án thực hành quyền công tố."],"answer":"A","explain":"Xét xử công khai, tuyên án theo đúng pháp luật là biểu hiện Tòa án nhân dân thực hiện quyền tư pháp — nguyên tắc pháp chế trong hoạt động xét xử.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong các ý kiến sau, ý kiến nào đúng về mối quan hệ giữa Quốc hội với Chính phủ?","options":["A. Chính phủ là cơ quan chấp hành của Quốc hội, chịu trách nhiệm và báo cáo công tác trước Quốc hội.","B. Chính phủ độc lập tuyệt đối với Quốc hội.","C. Quốc hội là cơ quan chấp hành của Chính phủ.","D. Chính phủ có quyền giải tán Quốc hội."],"answer":"A","explain":"Chính phủ là cơ quan chấp hành của Quốc hội, chịu trách nhiệm trước Quốc hội và báo cáo công tác trước Quốc hội, Ủy ban Thường vụ Quốc hội, Chủ tịch nước.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về phân loại cơ quan nhà nước:","statements":["a) Quốc hội và Hội đồng nhân dân là cơ quan quyền lực nhà nước.","b) Chính phủ và Ủy ban nhân dân là cơ quan hành chính nhà nước.","c) Tòa án nhân dân là cơ quan xét xử, thực hiện quyền tư pháp.","d) Viện kiểm sát nhân dân là cơ quan quyền lực nhà nước cao nhất."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp; cơ quan quyền lực nhà nước cao nhất là Quốc hội.","points":1},{"type":"truefalse","level":"VD","q":"Cử tri kiến nghị với đại biểu Hội đồng nhân dân tỉnh về việc đầu tư nâng cấp trường học ở xã miền núi; đại biểu đã chuyển kiến nghị đến cơ quan có thẩm quyền và trả lời cử tri. Xét tính đúng, sai của các nhận định sau:","statements":["a) Đại biểu Hội đồng nhân dân có trách nhiệm tiếp thu, chuyển kiến nghị của cử tri đến cơ quan có thẩm quyền.","b) Việc cử tri kiến nghị là hình thức nhân dân tham gia quản lí nhà nước.","c) Đại biểu Hội đồng nhân dân không cần trả lời cử tri về kết quả giải quyết kiến nghị.","d) Mọi kiến nghị của cử tri đều phải được giải quyết theo ý muốn của cử tri."],"answer":["T","T","F","F"],"explain":"a), b) Đúng. c) Sai: đại biểu có trách nhiệm báo cáo, trả lời cử tri về kết quả giải quyết kiến nghị. d) Sai: kiến nghị được xem xét, giải quyết theo quy định của pháp luật và điều kiện thực tế.","points":1},{"type":"short","level":"NB","q":"Cơ quan xét xử của nước Cộng hoà xã hội chủ nghĩa Việt Nam, thực hiện quyền tư pháp là cơ quan nào? (Trả lời bằng tên cơ quan)","answer":"Tòa án nhân dân","explain":"Tòa án nhân dân là cơ quan xét xử của nước Cộng hoà xã hội chủ nghĩa Việt Nam, thực hiện quyền tư pháp.","points":0.5},{"type":"short","level":"VDC","q":"Điền từ còn thiếu: Chính phủ là cơ quan hành chính nhà nước cao nhất, thực hiện quyền ..., là cơ quan chấp hành của Quốc hội.","answer":"hành pháp","explain":"Theo Hiến pháp 2013, Chính phủ là cơ quan hành chính nhà nước cao nhất của nước Cộng hoà xã hội chủ nghĩa Việt Nam, thực hiện quyền hành pháp, là cơ quan chấp hành của Quốc hội.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Ai là người đứng đầu Chính phủ nước Cộng hoà xã hội chủ nghĩa Việt Nam?","options":["A. Chủ tịch nước.","B. Thủ tướng Chính phủ.","C. Chủ tịch Quốc hội.","D. Chánh án Tòa án nhân dân tối cao."],"answer":"B","explain":"Thủ tướng Chính phủ là người đứng đầu Chính phủ, chịu trách nhiệm trước Quốc hội về hoạt động của Chính phủ.","points":0.25},{"type":"mcq","level":"NB","q":"Đại biểu Quốc hội và đại biểu Hội đồng nhân dân do ai bầu ra?","options":["A. Do Nhân dân trực tiếp bầu ra theo nguyên tắc phổ thông, bình đẳng, trực tiếp và bỏ phiếu kín.","B. Do Chính phủ bổ nhiệm.","C. Do Tòa án nhân dân chỉ định.","D. Do Mặt trận Tổ quốc cử ra."],"answer":"A","explain":"Đại biểu Quốc hội và đại biểu Hội đồng nhân dân do cử tri cả nước, cử tri địa phương trực tiếp bầu ra theo nguyên tắc phổ thông, bình đẳng, trực tiếp và bỏ phiếu kín.","points":0.25},{"type":"mcq","level":"TH","q":"Thẩm phán Tòa án nhân dân khi xét xử phải tuân theo","options":["A. ý chí của người đứng đầu địa phương.","B. Hiến pháp và pháp luật; xét xử độc lập và chỉ tuân theo pháp luật.","C. dư luận xã hội.","D. yêu cầu của đương sự."],"answer":"B","explain":"Thẩm phán, Hội thẩm xét xử độc lập và chỉ tuân theo pháp luật; nghiêm cấm cơ quan, tổ chức, cá nhân can thiệp vào việc xét xử của Thẩm phán, Hội thẩm.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào sau đây thể hiện nguyên tắc nhân dân tham gia quản lí nhà nước và xã hội?","options":["A. Công dân đủ 18 tuổi trở lên có quyền bầu cử, ứng cử vào Quốc hội, Hội đồng nhân dân.","B. Mọi công việc của Nhà nước đều do cơ quan nhà nước quyết định, nhân dân chỉ chấp hành.","C. Nhân dân không được góp ý vào dự thảo văn bản pháp luật.","D. Chỉ cán bộ, công chức mới được tham gia quản lí nhà nước."],"answer":"A","explain":"Quyền bầu cử, ứng cử là hình thức cơ bản để nhân dân tham gia quản lí nhà nước và xã hội.","points":0.25},{"type":"mcq","level":"VD","q":"Phát hiện một cơ sở sản xuất xả thải chưa qua xử lí ra sông, người dân đã báo cho Ủy ban nhân dân xã và cơ quan chức năng. Hành động này thể hiện","options":["A. nhân dân tham gia quản lí nhà nước, bảo vệ môi trường và giám sát việc chấp hành pháp luật.","B. sự can thiệp trái phép vào hoạt động sản xuất kinh doanh.","C. quyền tự do kinh doanh của công dân.","D. nghĩa vụ nộp thuế của công dân."],"answer":"A","explain":"Công dân phát hiện, tố giác hành vi vi phạm pháp luật về môi trường là thực hiện quyền tham gia quản lí nhà nước, giám sát việc chấp hành pháp luật và nghĩa vụ bảo vệ môi trường.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao nói Đảng Cộng sản Việt Nam lãnh đạo là nguyên tắc bao trùm trong tổ chức và hoạt động của bộ máy nhà nước?","options":["A. Vì mọi cán bộ nhà nước đều phải là đảng viên.","B. Vì Đảng đề ra đường lối, chủ trương; lãnh đạo công tác cán bộ và kiểm tra việc thực hiện, bảo đảm bộ máy nhà nước hoạt động đúng định hướng xã hội chủ nghĩa.","C. Vì Đảng trực tiếp điều hành mọi hoạt động của các cơ quan nhà nước.","D. Vì Hiến pháp quy định Đảng đứng trên bộ máy nhà nước."],"answer":"B","explain":"Đảng lãnh đạo bộ máy nhà nước bằng đường lối, chủ trương, công tác cán bộ và kiểm tra, giám sát — bảo đảm bộ máy nhà nước hoạt động đúng định hướng, vì lợi ích của Nhân dân. Đảng không làm thay, không đứng trên pháp luật.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về Chủ tịch nước và Chính phủ:","statements":["a) Chủ tịch nước do Quốc hội bầu trong số đại biểu Quốc hội.","b) Thủ tướng Chính phủ là người đứng đầu Chính phủ.","c) Chính phủ chịu trách nhiệm và báo cáo công tác trước Quốc hội.","d) Chủ tịch nước có quyền bãi nhiệm Thủ tướng Chính phủ mà không cần Quốc hội."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo Hiến pháp 2013. d) Sai: việc bãi nhiệm Thủ tướng thuộc thẩm quyền của Quốc hội.","points":1},{"type":"truefalse","level":"VD","q":"Trong đợt tiếp xúc cử tri, đại biểu Quốc hội đã lắng nghe ý kiến về chính sách hỗ trợ học sinh nghèo, giải trình những vấn đề thuộc thẩm quyền và hứa chuyển kiến nghị đến Chính phủ. Xét tính đúng, sai của các nhận định sau:","statements":["a) Tiếp xúc cử tri là nhiệm vụ của đại biểu Quốc hội.","b) Đại biểu Quốc hội có trách nhiệm lắng nghe, chuyển kiến nghị của cử tri đến cơ quan có thẩm quyền.","c) Cử tri không có quyền kiến nghị với đại biểu Quốc hội.","d) Mọi kiến nghị của cử tri đều phải được Quốc hội thông qua thành luật."],"answer":["T","T","F","F"],"explain":"a), b) Đúng. c) Sai: cử tri có quyền kiến nghị với đại biểu Quốc hội. d) Sai: kiến nghị được xem xét theo trình tự, thủ tục luật định.","points":1},{"type":"short","level":"NB","q":"Người đứng đầu Chính phủ, chịu trách nhiệm trước Quốc hội về hoạt động của Chính phủ là ai? (Trả lời bằng chức danh)","answer":"Thủ tướng Chính phủ","explain":"Thủ tướng Chính phủ là người đứng đầu Chính phủ, lãnh đạo công tác của Chính phủ, chịu trách nhiệm trước Quốc hội về hoạt động của Chính phủ.","points":0.5},{"type":"short","level":"VDC","q":"Điền cụm từ còn thiếu: Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương, đại diện cho ý chí, ... của Nhân dân địa phương.","answer":"nguyện vọng","explain":"Theo Hiến pháp 2013, Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương, đại diện cho ý chí, nguyện vọng của Nhân dân địa phương.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Tòa án nhân dân tối cao là","options":["A. cơ quan xét xử cao nhất của nước Cộng hoà xã hội chủ nghĩa Việt Nam.","B. cơ quan hành chính nhà nước cao nhất.","C. cơ quan quyền lực nhà nước cao nhất.","D. cơ quan thực hành quyền công tố cao nhất."],"answer":"A","explain":"Tòa án nhân dân tối cao là cơ quan xét xử cao nhất của nước Cộng hoà xã hội chủ nghĩa Việt Nam.","points":0.25},{"type":"mcq","level":"NB","q":"Viện kiểm sát nhân dân tối cao thực hiện chức năng","options":["A. xét xử các vụ án.","B. thực hành quyền công tố, kiểm sát hoạt động tư pháp trong phạm vi cả nước.","C. ban hành luật.","D. quản lí hành chính nhà nước."],"answer":"B","explain":"Viện kiểm sát nhân dân tối cao thực hành quyền công tố, kiểm sát hoạt động tư pháp trong phạm vi cả nước.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác nhau cơ bản giữa Quốc hội với Hội đồng nhân dân là","options":["A. Quốc hội là cơ quan quyền lực nhà nước cao nhất ở trung ương; Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương.","B. Quốc hội do nhân dân bầu, Hội đồng nhân dân do Chính phủ bổ nhiệm.","C. Quốc hội có quyền xét xử, Hội đồng nhân dân không có.","D. Không có điểm khác nhau."],"answer":"A","explain":"Quốc hội hoạt động ở phạm vi cả nước với tư cách cơ quan quyền lực nhà nước cao nhất; Hội đồng nhân dân hoạt động ở phạm vi địa phương với tư cách cơ quan quyền lực nhà nước ở địa phương.","points":0.25},{"type":"mcq","level":"TH","q":"Ủy ban nhân dân cấp tỉnh chịu trách nhiệm trước","options":["A. Hội đồng nhân dân cùng cấp và cơ quan hành chính nhà nước cấp trên.","B. Tòa án nhân dân cùng cấp.","C. Viện kiểm sát nhân dân cùng cấp.","D. Mặt trận Tổ quốc cùng cấp."],"answer":"A","explain":"Ủy ban nhân dân chịu trách nhiệm trước Hội đồng nhân dân cùng cấp và cơ quan hành chính nhà nước cấp trên; báo cáo công tác trước Hội đồng nhân dân cùng cấp.","points":0.25},{"type":"mcq","level":"VD","q":"Gia đình bà L có đơn khiếu nại về việc cấp giấy chứng nhận quyền sử dụng đất. Chủ tịch Ủy ban nhân dân huyện đã thụ lí, xác minh và ra quyết định giải quyết khiếu nại đúng thời hạn luật định. Việc làm này thể hiện","options":["A. nguyên tắc bảo đảm tính pháp chế xã hội chủ nghĩa trong hoạt động của cơ quan hành chính nhà nước.","B. quyền xét xử của Ủy ban nhân dân.","C. sự can thiệp của chính quyền vào quyền sử dụng đất của công dân.","D. nguyên tắc đa đảng cạnh tranh."],"answer":"A","explain":"Cơ quan hành chính giải quyết khiếu nại đúng thẩm quyền, đúng thời hạn luật định là biểu hiện của nguyên tắc pháp chế xã hội chủ nghĩa.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong các nhận định sau, nhận định nào đúng về sự phân công, phối hợp, kiểm soát quyền lực nhà nước?","options":["A. Quốc hội, Chính phủ, Tòa án hoạt động độc lập tuyệt đối, không phối hợp với nhau.","B. Quyền lực nhà nước là thống nhất; Quốc hội, cơ quan hành pháp, cơ quan tư pháp phân công thực hiện quyền lập pháp, hành pháp, tư pháp, đồng thời phối hợp và kiểm soát lẫn nhau theo quy định của Hiến pháp.","C. Mọi cơ quan nhà nước đều có quyền lập pháp, hành pháp, tư pháp như nhau.","D. Tòa án nhân dân chịu sự lãnh đạo trực tiếp của Chính phủ trong hoạt động xét xử."],"answer":"B","explain":"Theo Điều 2 Hiến pháp 2013, quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về Tòa án nhân dân và Viện kiểm sát nhân dân:","statements":["a) Tòa án nhân dân là cơ quan xét xử, thực hiện quyền tư pháp.","b) Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp.","c) Thẩm phán, Hội thẩm xét xử độc lập và chỉ tuân theo pháp luật.","d) Viện kiểm sát nhân dân có quyền xét xử thay cho Tòa án khi cần thiết."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo Hiến pháp 2013. d) Sai: quyền xét xử thuộc về Tòa án nhân dân; Viện kiểm sát không có quyền xét xử.","points":1},{"type":"truefalse","level":"VD","q":"Ủy ban nhân dân thành phố ban hành quyết định thu hồi đất để thực hiện dự án công cộng; một số hộ dân không đồng ý với phương án bồi thường và đã khởi kiện ra Tòa án. Xét tính đúng, sai của các nhận định sau:","statements":["a) Ủy ban nhân dân có thẩm quyền thu hồi đất theo quy định của pháp luật về đất đai.","b) Người dân có quyền khởi kiện quyết định hành chính ra Tòa án khi cho rằng quyền lợi của mình bị xâm phạm.","c) Tòa án có thẩm quyền xét xử vụ kiện hành chính theo quy định của pháp luật.","d) Người dân phải chấp hành mọi quyết định của Ủy ban nhân dân mà không được khiếu kiện."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: công dân có quyền khiếu nại, khởi kiện quyết định hành chính, hành vi hành chính khi có căn cứ cho rằng trái pháp luật.","points":1},{"type":"short","level":"NB","q":"Cơ quan kiểm toán việc quản lí, sử dụng tài chính, tài sản công do Quốc hội thành lập là cơ quan nào? (Trả lời bằng tên cơ quan)","answer":"Kiểm toán nhà nước","explain":"Kiểm toán nhà nước do Quốc hội thành lập, là cơ quan kiểm toán việc quản lí, sử dụng tài chính, tài sản công.","points":0.5},{"type":"short","level":"VDC","q":"Điền từ còn thiếu: Thẩm phán, Hội thẩm xét xử ... và chỉ tuân theo pháp luật.","answer":"độc lập","explain":"Theo Hiến pháp 2013, Thẩm phán, Hội thẩm xét xử độc lập và chỉ tuân theo pháp luật; nghiêm cấm cơ quan, tổ chức, cá nhân can thiệp vào việc xét xử.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Quốc hội thực hiện những quyền nào sau đây?","options":["A. Quyền lập hiến, quyền lập pháp.","B. Quyền hành pháp.","C. Quyền tư pháp.","D. Quyền công tố."],"answer":"A","explain":"Quốc hội thực hiện quyền lập hiến, quyền lập pháp; quyết định những vấn đề quan trọng của đất nước và giám sát tối cao đối với hoạt động của Nhà nước.","points":0.25},{"type":"mcq","level":"NB","q":"Chính phủ gồm","options":["A. Thủ tướng Chính phủ, các Phó Thủ tướng, các Bộ trưởng và Thủ trưởng cơ quan ngang bộ.","B. Chủ tịch nước và các Phó Chủ tịch nước.","C. Chủ tịch Quốc hội và các Phó Chủ tịch Quốc hội.","D. Chánh án và các Thẩm phán Tòa án nhân dân tối cao."],"answer":"A","explain":"Chính phủ gồm Thủ tướng Chính phủ, các Phó Thủ tướng Chính phủ, các Bộ trưởng và Thủ trưởng cơ quan ngang bộ.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Quốc hội được gọi là cơ quan đại biểu cao nhất của Nhân dân?","options":["A. Vì Quốc hội có trụ sở to đẹp nhất.","B. Vì đại biểu Quốc hội do cử tri cả nước trực tiếp bầu ra, đại diện cho ý chí, nguyện vọng của Nhân dân cả nước.","C. Vì Quốc hội có số lượng đại biểu đông nhất.","D. Vì Quốc hội họp nhiều nhất trong năm."],"answer":"B","explain":"Đại biểu Quốc hội do cử tri cả nước bầu ra theo nguyên tắc phổ thông, bình đẳng, trực tiếp, bỏ phiếu kín; Quốc hội đại diện cho ý chí, nguyện vọng của Nhân dân cả nước nên là cơ quan đại biểu cao nhất của Nhân dân.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào sau đây thể hiện sự kiểm soát quyền lực nhà nước?","options":["A. Quốc hội giám sát tối cao đối với hoạt động của Nhà nước; đại biểu Quốc hội có quyền chất vấn.","B. Mọi cơ quan nhà nước hoạt động độc lập, không ai được giám sát.","C. Chính phủ có quyền bãi nhiệm đại biểu Quốc hội.","D. Tòa án chịu sự chỉ đạo của Ủy ban nhân dân trong xét xử."],"answer":"A","explain":"Quốc hội thực hiện giám sát tối cao; đại biểu Quốc hội chất vấn Chủ tịch nước, Thủ tướng, Bộ trưởng là biểu hiện của kiểm soát quyền lực nhà nước.","points":0.25},{"type":"mcq","level":"VD","q":"Tại kì họp Quốc hội, đại biểu A đã chất vấn Bộ trưởng về tình trạng ô nhiễm môi trường tại khu công nghiệp và yêu cầu trả lời rõ trách nhiệm, giải pháp. Việc làm này thể hiện","options":["A. quyền giám sát tối cao của Quốc hội đối với hoạt động của Nhà nước.","B. sự can thiệp của Quốc hội vào hoạt động của Chính phủ.","C. quyền hành pháp của Quốc hội.","D. sự đối lập giữa Quốc hội và Chính phủ."],"answer":"A","explain":"Đại biểu Quốc hội chất vấn thành viên Chính phủ là hình thức thực hiện quyền giám sát tối cao của Quốc hội — biểu hiện của kiểm soát quyền lực nhà nước.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định nào sau đây đúng về nguyên tắc nhân dân tham gia quản lí nhà nước và xã hội?","options":["A. Nhân dân chỉ tham gia quản lí nhà nước thông qua việc nộp thuế.","B. Nhà nước bảo đảm và phát huy quyền làm chủ của Nhân dân; nhân dân tham gia quản lí nhà nước bằng nhiều hình thức: bầu cử, ứng cử, góp ý, giám sát, khiếu nại, tố cáo.","C. Chỉ công dân từ 21 tuổi trở lên mới được tham gia quản lí nhà nước.","D. Nhân dân tham gia quản lí nhà nước bằng cách trực tiếp điều hành các cơ quan nhà nước."],"answer":"B","explain":"Nhà nước bảo đảm và phát huy quyền làm chủ của Nhân dân; nhân dân tham gia quản lí nhà nước và xã hội bằng các hình thức: bầu cử, ứng cử, thảo luận, góp ý, giám sát, khiếu nại, tố cáo theo quy định của pháp luật.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về tổ chức, hoạt động của Quốc hội:","statements":["a) Quốc hội là cơ quan duy nhất có quyền ban hành Hiến pháp và luật.","b) Quốc hội quyết định mục tiêu, chính sách phát triển kinh tế - xã hội của đất nước.","c) Quốc hội bầu Chủ tịch nước, Thủ tướng Chính phủ, Chánh án Tòa án nhân dân tối cao.","d) Mọi công dân đều có quyền ứng cử đại biểu Quốc hội mà không cần điều kiện gì."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo Hiến pháp 2013. d) Sai: công dân ứng cử đại biểu Quốc hội phải đáp ứng các tiêu chuẩn, điều kiện theo quy định của pháp luật về bầu cử.","points":1},{"type":"truefalse","level":"VD","q":"Xã A tổ chức hội nghị nhân dân bàn việc xây dựng nhà văn hoá thôn; sau khi thảo luận dân chủ, hội nghị biểu quyết mức đóng góp và cử ban giám sát. Xét tính đúng, sai của các nhận định sau:","statements":["a) Việc nhân dân bàn bạc, quyết định mức đóng góp là thực hiện quyền làm chủ trực tiếp ở cơ sở.","b) Cách làm trên thể hiện nguyên tắc tập trung dân chủ: dân chủ trong bàn bạc, tập trung trong thực hiện.","c) Ban giám sát do nhân dân cử ra thể hiện quyền giám sát của Nhân dân.","d) Mọi công việc ở thôn đều do trưởng thôn tự quyết định, không cần hỏi ý kiến nhân dân."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: những công việc của cộng đồng dân cư phải được nhân dân bàn bạc, quyết định theo quy định của pháp luật về thực hiện dân chủ ở cơ sở.","points":1},{"type":"short","level":"NB","q":"Ai là nguyên thủ quốc gia, thay mặt nước Cộng hoà xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại? (Trả lời bằng chức danh)","answer":"Chủ tịch nước","explain":"Chủ tịch nước là nguyên thủ quốc gia, thay mặt nước Cộng hoà xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại.","points":0.5},{"type":"short","level":"VDC","q":"Điền cụm từ còn thiếu: Nhà nước bảo đảm và phát huy quyền ... của Nhân dân.","answer":"làm chủ","explain":"Theo Hiến pháp 2013, Nhà nước bảo đảm và phát huy quyền làm chủ của Nhân dân; công nhận, tôn trọng, bảo vệ và bảo đảm quyền con người, quyền công dân.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Trong bộ máy nhà nước, cơ quan nào thực hiện quyền hành pháp?","options":["A. Chính phủ.","B. Quốc hội.","C. Tòa án nhân dân tối cao.","D. Viện kiểm sát nhân dân tối cao."],"answer":"A","explain":"Chính phủ thực hiện quyền hành pháp — là cơ quan hành chính nhà nước cao nhất, tổ chức thi hành Hiến pháp, luật.","points":0.25},{"type":"mcq","level":"NB","q":"Trong bộ máy nhà nước, cơ quan nào thực hiện quyền tư pháp?","options":["A. Tòa án nhân dân.","B. Quốc hội.","C. Chính phủ.","D. Hội đồng nhân dân."],"answer":"A","explain":"Tòa án nhân dân thực hiện quyền tư pháp — là cơ quan xét xử của nước Cộng hoà xã hội chủ nghĩa Việt Nam.","points":0.25},{"type":"mcq","level":"TH","q":"Sự khác nhau cơ bản giữa cơ quan quyền lực nhà nước với cơ quan hành chính nhà nước là","options":["A. cơ quan quyền lực do nhân dân bầu ra và quyết định những vấn đề quan trọng; cơ quan hành chính tổ chức thi hành, quản lí, điều hành.","B. cơ quan quyền lực do Chính phủ bổ nhiệm; cơ quan hành chính do nhân dân bầu.","C. không có sự khác nhau.","D. cơ quan hành chính có quyền ban hành luật."],"answer":"A","explain":"Cơ quan quyền lực (Quốc hội, Hội đồng nhân dân) do nhân dân bầu ra, quyết định những vấn đề quan trọng; cơ quan hành chính (Chính phủ, Ủy ban nhân dân) tổ chức thi hành pháp luật, quản lí, điều hành các mặt đời sống xã hội.","points":0.25},{"type":"mcq","level":"TH","q":"Khi phát hiện văn bản của Ủy ban nhân dân tỉnh trái với Hiến pháp, luật, việc xử lí được thực hiện theo nguyên tắc nào?","options":["A. Hội đồng nhân dân tỉnh bãi bỏ văn bản trái pháp luật của Ủy ban nhân dân cùng cấp; cơ quan nhà nước cấp trên đình chỉ, bãi bỏ theo thẩm quyền.","B. Tòa án nhân dân tỉnh tự ý hủy bỏ.","C. Viện kiểm sát nhân dân tỉnh tự ý hủy bỏ.","D. Không cơ quan nào có quyền xử lí."],"answer":"A","explain":"Theo Hiến pháp 2013, Hội đồng nhân dân bãi bỏ văn bản trái pháp luật của Ủy ban nhân dân cùng cấp; cơ quan nhà nước cấp trên có thẩm quyền đình chỉ, bãi bỏ — đó là biểu hiện của kiểm soát quyền lực nhà nước.","points":0.25},{"type":"mcq","level":"VD","q":"Anh B điều khiển xe máy vượt đèn đỏ và bị Cảnh sát giao thông lập biên bản xử phạt. Anh B cho rằng mình không vi phạm vì đường vắng. Ý kiến nào sau đây là đúng?","options":["A. Anh B nói đúng vì đường vắng thì được vượt đèn đỏ.","B. Anh B đã vi phạm pháp luật về giao thông; việc xử phạt thể hiện nguyên tắc pháp chế: mọi cá nhân đều phải tuân theo pháp luật.","C. Cảnh sát giao thông không có quyền xử phạt.","D. Chỉ ô tô vượt đèn đỏ mới bị phạt, xe máy thì không."],"answer":"B","explain":"Vượt đèn đỏ là vi phạm pháp luật giao thông dù đường vắng hay đông; mọi cá nhân đều phải tuân theo pháp luật — nguyên tắc pháp chế xã hội chủ nghĩa.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong các nhận định sau, nhận định nào đúng về vai trò của pháp luật đối với bộ máy nhà nước?","options":["A. Pháp luật chỉ để điều chỉnh công dân, không điều chỉnh cơ quan nhà nước.","B. Pháp luật là công cụ để Nhà nước quản lí xã hội; đồng thời pháp luật cũng điều chỉnh tổ chức và hoạt động của chính bộ máy nhà nước, bảo đảm bộ máy hoạt động đúng chức năng, nhiệm vụ.","C. Cơ quan nhà nước càng to thì càng ít phải tuân theo pháp luật.","D. Pháp luật cản trở hoạt động của bộ máy nhà nước."],"answer":"B","explain":"Pháp luật vừa là công cụ quản lí xã hội của Nhà nước, vừa là chuẩn mực điều chỉnh tổ chức và hoạt động của chính bộ máy nhà nước — bảo đảm tính pháp chế xã hội chủ nghĩa.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về nguyên tắc tổ chức và hoạt động của bộ máy nhà nước:","statements":["a) Bộ máy nhà nước đặt dưới sự lãnh đạo của Đảng Cộng sản Việt Nam.","b) Mọi cơ quan nhà nước đều phải hoạt động theo Hiến pháp và pháp luật.","c) Bộ máy nhà nước tổ chức và hoạt động theo nguyên tắc tập trung dân chủ.","d) Nhân dân không có quyền tham gia vào tổ chức và hoạt động của bộ máy nhà nước."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: đó là các nguyên tắc tổ chức và hoạt động của bộ máy nhà nước. d) Sai: nhân dân tham gia quản lí nhà nước và xã hội là một trong những nguyên tắc cơ bản.","points":1},{"type":"truefalse","level":"VD","q":"Người dân phát hiện một cán bộ xã có hành vi tham nhũng và đã gửi đơn tố cáo đến cơ quan có thẩm quyền; cơ quan chức năng đã vào cuộc xác minh, xử lí. Xét tính đúng, sai của các nhận định sau:","statements":["a) Tố cáo hành vi tham nhũng là quyền và trách nhiệm của công dân.","b) Cơ quan có thẩm quyền phải xem xét, giải quyết tố cáo theo quy định của pháp luật.","c) Người tố cáo được pháp luật bảo vệ, giữ bí mật khi có yêu cầu.","d) Công dân chỉ được tố cáo khi bản thân bị thiệt hại trực tiếp."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo Luật Tố cáo. d) Sai: công dân có quyền tố cáo hành vi vi phạm pháp luật của bất kì cơ quan, tổ chức, cá nhân nào, không phụ thuộc vào việc bản thân có bị thiệt hại hay không.","points":1},{"type":"short","level":"NB","q":"Chức danh nào là người đứng đầu Quốc hội? (Trả lời bằng chức danh)","answer":"Chủ tịch Quốc hội","explain":"Chủ tịch Quốc hội là người đứng đầu Quốc hội, lãnh đạo công tác của Quốc hội.","points":0.5},{"type":"short","level":"VDC","q":"Điền từ còn thiếu: Quyền lực nhà nước là ..., có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước.","answer":"thống nhất","explain":"Điều 2 Hiến pháp năm 2013: Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Hội đồng nhân dân cấp tỉnh do ai bầu ra?","options":["A. Do cử tri ở địa phương trực tiếp bầu ra.","B. Do Quốc hội bầu ra.","C. Do Chính phủ bổ nhiệm.","D. Do Ủy ban nhân dân cấp trên chỉ định."],"answer":"A","explain":"Đại biểu Hội đồng nhân dân các cấp do cử tri ở địa phương trực tiếp bầu ra theo nguyên tắc phổ thông, bình đẳng, trực tiếp và bỏ phiếu kín.","points":0.25},{"type":"mcq","level":"NB","q":"Nhiệm kì của Quốc hội và Hội đồng nhân dân các cấp là","options":["A. 3 năm.","B. 4 năm.","C. 5 năm.","D. 6 năm."],"answer":"C","explain":"Nhiệm kì của Quốc hội là 5 năm; nhiệm kì của Hội đồng nhân dân mỗi cấp cũng là 5 năm.","points":0.25},{"type":"mcq","level":"TH","q":"Đại biểu Quốc hội có quyền chất vấn","options":["A. Chủ tịch nước, Chủ tịch Quốc hội, Thủ tướng Chính phủ, Bộ trưởng và các thành viên khác của Chính phủ, Chánh án Tòa án nhân dân tối cao, Viện trưởng Viện kiểm sát nhân dân tối cao.","B. mọi công dân.","C. Tổng Bí thư.","D. người đứng đầu các doanh nghiệp."],"answer":"A","explain":"Đại biểu Quốc hội có quyền chất vấn Chủ tịch nước, Chủ tịch Quốc hội, Thủ tướng Chính phủ, Bộ trưởng, các thành viên khác của Chính phủ, Chánh án Tòa án nhân dân tối cao, Viện trưởng Viện kiểm sát nhân dân tối cao.","points":0.25},{"type":"mcq","level":"TH","q":"Ủy ban nhân dân xã có nhiệm vụ, quyền hạn nào sau đây?","options":["A. Ban hành luật.","B. Tổ chức thi hành Hiến pháp, luật, văn bản của cơ quan nhà nước cấp trên và nghị quyết của Hội đồng nhân dân cùng cấp; quản lí các mặt đời sống xã hội ở địa phương.","C. Xét xử các vụ án hình sự.","D. Thực hành quyền công tố."],"answer":"B","explain":"Ủy ban nhân dân tổ chức thi hành Hiến pháp, luật, văn bản của cơ quan nhà nước cấp trên và nghị quyết của Hội đồng nhân dân cùng cấp; thực hiện quản lí hành chính nhà nước ở địa phương.","points":0.25},{"type":"mcq","level":"VD","q":"Trước khi thông qua Luật Giáo dục (sửa đổi), Quốc hội đã tổ chức lấy ý kiến rộng rãi của nhân dân, trong đó có nhiều ý kiến của giáo viên, học sinh được tiếp thu. Việc làm này thể hiện","options":["A. nguyên tắc nhân dân tham gia quản lí nhà nước; Quốc hội là cơ quan đại biểu của Nhân dân.","B. Quốc hội không đủ năng lực làm luật.","C. luật do nhân dân trực tiếp ban hành.","D. sự can thiệp của nhân dân vào hoạt động lập pháp."],"answer":"A","explain":"Lấy ý kiến nhân dân khi xây dựng luật là hình thức nhân dân tham gia quản lí nhà nước; Quốc hội thể chế hoá ý chí, nguyện vọng của Nhân dân thành pháp luật.","points":0.25},{"type":"mcq","level":"VDC","q":"Một học sinh thắc mắc: Vì sao Hiến pháp quy định Đảng Cộng sản Việt Nam lãnh đạo Nhà nước mà Đảng không phải là cơ quan nhà nước? Câu trả lời đúng là","options":["A. Vì Đảng không có vai trò gì đối với Nhà nước.","B. Vì Đảng là tổ chức chính trị lãnh đạo bằng đường lối, chủ trương và công tác cán bộ; Nhà nước là bộ máy thực hiện quyền lực nhà nước — hai tổ chức có vị trí, chức năng khác nhau nhưng thống nhất dưới sự lãnh đạo của Đảng.","C. Vì Đảng đứng ngoài hệ thống chính trị.","D. Vì Hiến pháp quy định sai."],"answer":"B","explain":"Đảng là tổ chức chính trị giữ vai trò lãnh đạo; Nhà nước là bộ máy thực hiện quyền lực nhà nước. Đảng lãnh đạo Nhà nước bằng đường lối, chủ trương, công tác cán bộ và kiểm tra — không làm thay chức năng của các cơ quan nhà nước.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về hoạt động của Quốc hội:","statements":["a) Quốc hội họp mỗi năm hai kì; trường hợp cần thiết có thể họp bất thường.","b) Mọi quyết định của Quốc hội đều phải được 100% đại biểu tán thành.","c) Đại biểu Quốc hội chịu sự giám sát của cử tri; cử tri có quyền bãi nhiệm đại biểu không còn xứng đáng.","d) Quốc hội làm việc theo chế độ hội nghị và quyết định theo đa số."],"answer":["T","F","T","T"],"explain":"a), c), d) Đúng. b) Sai: Quốc hội quyết định theo đa số, không đòi hỏi 100% tán thành.","points":1},{"type":"truefalse","level":"VD","q":"Công ty X xả nước thải chưa qua xử lí ra môi trường bị Ủy ban nhân dân tỉnh ra quyết định xử phạt vi phạm hành chính và buộc khắc phục hậu quả. Xét tính đúng, sai của các nhận định sau:","statements":["a) Ủy ban nhân dân tỉnh có thẩm quyền xử phạt vi phạm hành chính theo quy định của pháp luật.","b) Công ty X có quyền khiếu nại, khởi kiện quyết định xử phạt nếu cho rằng không đúng.","c) Mọi tổ chức, cá nhân hoạt động sản xuất kinh doanh đều phải tuân theo pháp luật về bảo vệ môi trường.","d) Vì là doanh nghiệp đóng thuế nhiều nên công ty X được miễn chấp hành pháp luật về môi trường."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: mọi tổ chức, cá nhân đều bình đẳng trước pháp luật, không ai được miễn trừ nghĩa vụ chấp hành pháp luật.","points":1},{"type":"short","level":"NB","q":"Nhiệm kì của Quốc hội nước Cộng hoà xã hội chủ nghĩa Việt Nam là mấy năm? (Trả lời bằng số)","answer":"5","explain":"Theo Hiến pháp 2013, nhiệm kì của Quốc hội là 5 năm.","points":0.5},{"type":"short","level":"VDC","q":"Điền cụm từ còn thiếu: Đại biểu Quốc hội, đại biểu Hội đồng nhân dân ... sự giám sát của cử tri.","answer":"chịu","explain":"Theo Hiến pháp 2013, đại biểu Quốc hội, đại biểu Hội đồng nhân dân chịu sự giám sát của cử tri; khi không còn xứng đáng với sự tín nhiệm của Nhân dân thì bị cử tri bãi nhiệm.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Cơ quan nào sau đây có quyền giám sát tối cao đối với hoạt động của Nhà nước?","options":["A. Quốc hội.","B. Chính phủ.","C. Tòa án nhân dân tối cao.","D. Kiểm toán nhà nước."],"answer":"A","explain":"Quốc hội thực hiện quyền giám sát tối cao đối với hoạt động của Nhà nước.","points":0.25},{"type":"mcq","level":"NB","q":"Trong các cơ quan, tổ chức sau, tổ chức nào KHÔNG thuộc bộ máy nhà nước?","options":["A. Quốc hội.","B. Chính phủ.","C. Mặt trận Tổ quốc Việt Nam.","D. Tòa án nhân dân."],"answer":"C","explain":"Mặt trận Tổ quốc Việt Nam thuộc hệ thống chính trị nhưng không phải là cơ quan nhà nước; Mặt trận là tổ chức liên minh chính trị, liên hiệp tự nguyện.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa Tòa án nhân dân với Viện kiểm sát nhân dân trong hoạt động tố tụng là","options":["A. phối hợp và kiểm soát lẫn nhau theo quy định của pháp luật: Viện kiểm sát thực hành quyền công tố, kiểm sát hoạt động tư pháp; Tòa án xét xử độc lập.","B. Viện kiểm sát lãnh đạo Tòa án.","C. Tòa án lãnh đạo Viện kiểm sát.","D. hai cơ quan độc lập tuyệt đối, không liên quan."],"answer":"A","explain":"Trong tố tụng, Viện kiểm sát thực hành quyền công tố, kiểm sát hoạt động tư pháp; Tòa án xét xử độc lập và chỉ tuân theo pháp luật; hai cơ quan phối hợp và kiểm soát lẫn nhau theo luật định.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào sau đây thể hiện trách nhiệm của công dân trong việc xây dựng bộ máy nhà nước trong sạch, vững mạnh?","options":["A. Tích cực học tập, tìm hiểu pháp luật; thực hiện quyền bầu cử, ứng cử; giám sát, tố cáo hành vi vi phạm của cán bộ, công chức.","B. Không quan tâm đến hoạt động của bộ máy nhà nước.","C. Bao che cho hành vi vi phạm của người thân làm cán bộ.","D. Từ chối thực hiện nghĩa vụ quân sự."],"answer":"A","explain":"Công dân xây dựng bộ máy nhà nước trong sạch, vững mạnh bằng cách: học tập, tìm hiểu pháp luật; thực hiện quyền bầu cử, ứng cử; tham gia giám sát, đấu tranh chống tham nhũng, tiêu cực.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn T đủ 18 tuổi, lần đầu đi bầu cử đại biểu Quốc hội. Bạn T phân vân không biết chọn ai. Lời khuyên đúng nhất dành cho bạn T là","options":["A. bầu theo số đông, ai cũng được.","B. tìm hiểu kĩ tiểu sử, chương trình hành động của người ứng cử rồi tự mình quyết định, bỏ phiếu kín.","C. nhờ người khác bỏ phiếu hộ.","D. không đi bầu vì một phiếu không quan trọng."],"answer":"B","explain":"Cử tri cần tìm hiểu kĩ người ứng cử và tự mình bỏ phiếu kín — đó là thực hiện quyền bầu cử một cách có trách nhiệm, thể hiện quyền làm chủ của Nhân dân.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong các ý kiến sau, ý kiến nào đúng về học sinh với việc tìm hiểu bộ máy nhà nước?","options":["A. Học sinh chưa đủ 18 tuổi nên không cần tìm hiểu về bộ máy nhà nước.","B. Học sinh cần chủ động tìm hiểu về bộ máy nhà nước, Hiến pháp, pháp luật để trở thành công dân có hiểu biết, thực hiện tốt quyền và nghĩa vụ công dân.","C. Chỉ học sinh chuyên Sử mới cần tìm hiểu về bộ máy nhà nước.","D. Tìm hiểu bộ máy nhà nước là việc riêng của cán bộ, công chức."],"answer":"B","explain":"Mọi học sinh đều cần tìm hiểu về bộ máy nhà nước, Hiến pháp, pháp luật — đó là hành trang để trở thành công dân có trách nhiệm, góp phần xây dựng Nhà nước pháp quyền xã hội chủ nghĩa.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Tất cả quyền lực nhà nước thuộc về Nhân dân.","b) Nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam là Nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân.","c) Công dân có quyền tham gia quản lí nhà nước và xã hội theo quy định của pháp luật.","d) Quyền lực nhà nước chỉ thuộc về các cơ quan nhà nước, không thuộc về Nhân dân."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo Hiến pháp 2013. d) Sai: tất cả quyền lực nhà nước thuộc về Nhân dân; các cơ quan nhà nước được Nhân dân ủy quyền thực hiện quyền lực.","points":1},{"type":"truefalse","level":"VD","q":"Phường A triển khai ứng dụng dịch vụ công trực tuyến; người dân ngồi nhà vẫn nộp hồ sơ, nhận kết quả; mọi thủ tục, thời gian giải quyết đều công khai. Xét tính đúng, sai của các nhận định sau:","statements":["a) Dịch vụ công trực tuyến giúp người dân thực hiện quyền, nghĩa vụ thuận tiện hơn.","b) Công khai thủ tục, thời gian giải quyết giúp nhân dân giám sát hoạt động của cơ quan hành chính.","c) Chuyển đổi số trong cơ quan nhà nước góp phần xây dựng nền hành chính dân chủ, hiện đại.","d) Người dân không có quyền yêu cầu cơ quan nhà nước giải quyết thủ tục đúng thời hạn đã công khai."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: người dân có quyền yêu cầu cơ quan nhà nước giải quyết công việc đúng thời hạn, đúng pháp luật và khiếu nại khi bị gây khó khăn, phiền hà.","points":1},{"type":"short","level":"NB","q":"Theo Hiến pháp năm 2013, tất cả quyền lực nhà nước thuộc về ai? (Trả lời ngắn gọn)","answer":"Nhân dân","explain":"Điều 2 Hiến pháp năm 2013: Tất cả quyền lực nhà nước thuộc về Nhân dân.","points":0.5},{"type":"short","level":"VDC","q":"Điền cụm từ còn thiếu: Nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam là Nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, ... Nhân dân.","answer":"vì","explain":"Điều 2 Hiến pháp 2013: Nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam là Nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân.","points":0.5}]}]}
