<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Theo Điều 1 Hiến pháp năm 2013, nước Cộng hòa xã hội chủ nghĩa Việt Nam là một nước như thế nào?","options":["A. liên bang gồm các bang có chủ quyền riêng","B. độc lập, có chủ quyền, thống nhất và toàn vẹn lãnh thổ","C. quân chủ lập hiến do vua đứng đầu","D. trung lập vĩnh viễn, không tham gia bất kì liên minh nào"],"answer":"B","explain":"Điều 1 Hiến pháp 2013: Nước Cộng hòa xã hội chủ nghĩa Việt Nam là một nước độc lập, có chủ quyền, thống nhất và toàn vẹn lãnh thổ, bao gồm đất liền, hải đảo, vùng biển và vùng trời.","points":0.25},{"type":"mcq","level":"NB","q":"Theo khoản 1 Điều 2 Hiến pháp năm 2013, Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam là Nhà nước","options":["A. quân chủ chuyên chế của giai cấp phong kiến","B. thần quyền do các chức sắc tôn giáo điều hành","C. pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân","D. tư sản do giai cấp tư sản nắm quyền"],"answer":"C","explain":"Khoản 1 Điều 2: Nhà nước ta là Nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân.","points":0.25},{"type":"mcq","level":"TH","q":"Cụm từ của Nhân dân, do Nhân dân, vì Nhân dân trong Điều 2 Hiến pháp 2013 thể hiện điều gì?","options":["A. Nhà nước chỉ bảo vệ lợi ích của tầng lớp giàu có trong xã hội","B. Nhân dân không có vai trò gì trong việc tổ chức bộ máy nhà nước","C. Nhà nước thuộc về Nhân dân, do Nhân dân tổ chức nên và hoạt động vì lợi ích của Nhân dân","D. Nhà nước đứng trên Nhân dân và không chịu sự giám sát của Nhân dân"],"answer":"C","explain":"Ba cụm từ này khẳng định: quyền lực nhà nước thuộc về Nhân dân (của Nhân dân), bộ máy nhà nước do Nhân dân lập nên (do Nhân dân) và mọi hoạt động của Nhà nước đều vì lợi ích của Nhân dân (vì Nhân dân).","points":0.25},{"type":"mcq","level":"TH","q":"Theo Điều 6 Hiến pháp năm 2013, Nhân dân thực hiện quyền lực nhà nước bằng những hình thức nào?","options":["A. Bằng dân chủ trực tiếp và bằng dân chủ đại diện thông qua Quốc hội, Hội đồng nhân dân","B. Chỉ bằng hình thức dân chủ trực tiếp","C. Chỉ thông qua các tổ chức xã hội, đoàn thể","D. Thông qua các tổ chức quốc tế và chính phủ nước ngoài"],"answer":"A","explain":"Điều 6: Nhân dân thực hiện quyền lực nhà nước bằng dân chủ trực tiếp, bằng dân chủ đại diện thông qua Quốc hội, Hội đồng nhân dân và thông qua các cơ quan khác của Nhà nước.","points":0.25},{"type":"mcq","level":"VD","q":"Trong cuộc họp thôn, bà con trực tiếp giơ tay biểu quyết việc đóng góp kinh phí làm đường bê tông. Đây là biểu hiện của hình thức dân chủ nào theo Điều 6 Hiến pháp 2013?","options":["A. Dân chủ trực tiếp","B. Dân chủ ủy quyền","C. Dân chủ đại diện","D. Dân chủ tập trung"],"answer":"A","explain":"Người dân trực tiếp bàn bạc và biểu quyết công việc của cộng đồng là dân chủ trực tiếp, một trong hai hình thức Nhân dân thực hiện quyền lực nhà nước theo Điều 6.","points":0.25},{"type":"mcq","level":"VDC","q":"Có ý kiến cho rằng: Vì quyền lực nhà nước là thống nhất nên không cần phân công giữa các cơ quan nhà nước. Ý kiến này","options":["A. sai, vì khoản 3 Điều 2 quy định quyền lực nhà nước thống nhất nhưng có sự phân công, phối hợp, kiểm soát giữa các cơ quan","B. đúng, vì phân công quyền lực làm suy yếu sự thống nhất của Nhà nước","C. đúng, vì thống nhất nghĩa là mọi quyền lực tập trung vào một cơ quan duy nhất","D. sai, vì quyền lực nhà nước thuộc về các cơ quan chứ không thuộc về Nhân dân"],"answer":"A","explain":"Khoản 3 Điều 2: Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp. Thống nhất và phân công là hai mặt thống nhất, không mâu thuẫn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau về bầu cử theo Hiến pháp 2013:","statements":["a) Việc bầu cử đại biểu Quốc hội được tiến hành theo nguyên tắc phổ thông, bình đẳng, trực tiếp và bỏ phiếu kín","b) Mọi công dân đều có quyền bầu cử mà không cần đáp ứng điều kiện độ tuổi do luật định","c) Đại biểu Quốc hội bị bãi nhiệm khi không còn xứng đáng với sự tín nhiệm của Nhân dân","d) Các nguyên tắc bầu cử được quy định tại Điều 7 Hiến pháp 2013"],"answer":["T","F","T","T"],"explain":"a, c, d đúng theo Điều 7. b sai: quyền bầu cử, ứng cử phải đáp ứng điều kiện độ tuổi do luật định (Điều 27: đủ 18 tuổi được bầu cử, đủ 21 tuổi được ứng cử).","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về vai trò của Đảng Cộng sản Việt Nam:","statements":["a) Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Nhà nước và xã hội","b) Các tổ chức của Đảng hoạt động ngoài khuôn khổ Hiến pháp và pháp luật","c) Đảng gắn bó mật thiết với Nhân dân, chịu sự giám sát của Nhân dân","d) Nền tảng tư tưởng của Đảng là chủ nghĩa Mác – Lênin và tư tưởng Hồ Chí Minh"],"answer":["T","F","T","T"],"explain":"a, c, d đúng theo Điều 4. b sai: khoản 3 Điều 4 quy định các tổ chức của Đảng và đảng viên hoạt động trong khuôn khổ Hiến pháp và pháp luật.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Theo khoản 3 Điều 2 Hiến pháp 2013, quyền lực nhà nước là thống nhất, có sự phân công, ..., kiểm soát giữa các cơ quan nhà nước.","answer":"phối hợp","explain":"Khoản 3 Điều 2: Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp.","points":0.5},{"type":"short","level":"VDC","q":"Theo Điều 6 Hiến pháp 2013, ngoài Quốc hội và Hội đồng nhân dân, Nhân dân còn thực hiện quyền lực nhà nước thông qua chủ thể nào? (Trả lời ngắn gọn)","answer":"các cơ quan khác của Nhà nước","explain":"Điều 6: Nhân dân thực hiện quyền lực nhà nước bằng dân chủ đại diện thông qua Quốc hội, Hội đồng nhân dân và thông qua các cơ quan khác của Nhà nước.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Theo Điều 4 Hiến pháp năm 2013, lực lượng lãnh đạo Nhà nước và xã hội là","options":["A. Hội đồng nhân dân các cấp","B. Mặt trận Tổ quốc Việt Nam","C. Tổng Liên đoàn Lao động Việt Nam","D. Đảng Cộng sản Việt Nam"],"answer":"D","explain":"Khoản 1 Điều 4: Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Nhà nước và xã hội.","points":0.25},{"type":"mcq","level":"NB","q":"Việc bầu cử đại biểu Quốc hội và đại biểu Hội đồng nhân dân được tiến hành theo nguyên tắc nào?","options":["A. Bình đẳng, gián tiếp qua nhiều cấp","B. Phổ thông, công khai và bỏ phiếu mở","C. Phổ thông, bình đẳng, trực tiếp và bỏ phiếu kín","D. Tự nguyện, không bắt buộc và công khai"],"answer":"C","explain":"Khoản 1 Điều 7: Việc bầu cử đại biểu Quốc hội và đại biểu Hội đồng nhân dân được tiến hành theo nguyên tắc phổ thông, bình đẳng, trực tiếp và bỏ phiếu kín.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung thống nhất và toàn vẹn lãnh thổ trong Điều 1 Hiến pháp 2013 được hiểu là","options":["A. vùng biển và hải đảo không thuộc chủ quyền Việt Nam","B. mỗi địa phương có quyền tách ra thành quốc gia riêng","C. lãnh thổ Việt Nam là một khối thống nhất, không thể chia cắt, bao gồm đất liền, hải đảo, vùng biển và vùng trời","D. chỉ đất liền mới được coi là lãnh thổ quốc gia"],"answer":"C","explain":"Điều 1 khẳng định Việt Nam là nước thống nhất và toàn vẹn lãnh thổ, bao gồm đất liền, hải đảo, vùng biển và vùng trời. Mọi hành vi chia cắt lãnh thổ đều vi phạm Hiến pháp và bị nghiêm trị.","points":0.25},{"type":"mcq","level":"TH","q":"Theo khoản 2 Điều 4 Hiến pháp 2013, mối quan hệ giữa Đảng Cộng sản Việt Nam với Nhân dân được thể hiện ở điểm nào?","options":["A. Đảng gắn bó mật thiết với Nhân dân, phục vụ Nhân dân, chịu sự giám sát của Nhân dân","B. Đảng đứng trên Nhân dân và không chịu sự giám sát nào","C. Đảng và Nhân dân không có mối quan hệ gì với nhau","D. Nhân dân phải phục tùng tuyệt đối mọi quyết định mà không được góp ý"],"answer":"A","explain":"Khoản 2 Điều 4: Đảng Cộng sản Việt Nam gắn bó mật thiết với Nhân dân, phục vụ Nhân dân, chịu sự giám sát của Nhân dân, chịu trách nhiệm trước Nhân dân về những quyết định của mình.","points":0.25},{"type":"mcq","level":"VD","q":"Chị Lan năm nay 20 tuổi, có hộ khẩu thường trú tại địa phương. Theo Hiến pháp 2013, chị Lan có quyền nào sau đây trong đợt bầu cử đại biểu Quốc hội sắp tới?","options":["A. Không có quyền bầu cử cũng không có quyền ứng cử","B. Quyền bầu cử","C. Quyền ứng cử đại biểu Quốc hội","D. Cả quyền bầu cử và quyền ứng cử"],"answer":"B","explain":"Điều 27: công dân đủ 18 tuổi trở lên có quyền bầu cử, đủ 21 tuổi trở lên có quyền ứng cử. Chị Lan 20 tuổi nên có quyền bầu cử nhưng chưa đủ tuổi ứng cử.","points":0.25},{"type":"mcq","level":"VDC","q":"Một đảng viên có hành vi vi phạm pháp luật. Theo khoản 3 Điều 4 Hiến pháp 2013, việc xử lý đảng viên này phải dựa trên nguyên tắc nào?","options":["A. Chỉ tổ chức Đảng mới có quyền xử lý, pháp luật không được can thiệp","B. Mọi đảng viên đều hoạt động trong khuôn khổ Hiến pháp và pháp luật nên phải bị xử lý theo pháp luật như mọi công dân","C. Đảng viên được miễn trừ trách nhiệm pháp lý vì là người của Đảng","D. Đảng viên vi phạm thì tự kiểm điểm là đủ, không cần xử lý theo luật"],"answer":"B","explain":"Khoản 3 Điều 4: Các tổ chức của Đảng và đảng viên Đảng Cộng sản Việt Nam hoạt động trong khuôn khổ Hiến pháp và pháp luật. Không ai đứng trên pháp luật; đảng viên vi phạm pháp luật cũng bị xử lý theo quy định của pháp luật.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau về bản chất Nhà nước ta:","statements":["a) Tất cả quyền lực nhà nước thuộc về Nhân dân","b) Nền tảng của quyền lực nhà nước là liên minh giữa giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức","c) Nhà nước ta là Nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân","d) Quyền lực nhà nước ở Việt Nam bị chia cắt thành nhiều phần độc lập, không liên quan nhau"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 2. d sai: khoản 3 Điều 2 khẳng định quyền lực nhà nước là thống nhất.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về các hình thức thực hiện quyền lực nhà nước của Nhân dân:","statements":["a) Bầu cử đại biểu Quốc hội là hình thức dân chủ đại diện","b) Người dân trực tiếp biểu quyết công việc của thôn, xóm là hình thức dân chủ trực tiếp","c) Nhân dân chỉ thực hiện quyền lực nhà nước thông qua Quốc hội","d) Trưng cầu ý dân là một hình thức dân chủ trực tiếp"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: theo Điều 6, Nhân dân thực hiện quyền lực nhà nước bằng cả dân chủ trực tiếp và dân chủ đại diện (qua Quốc hội, Hội đồng nhân dân và các cơ quan khác của Nhà nước).","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Theo Điều 6 Hiến pháp 2013, Nhân dân thực hiện quyền lực nhà nước bằng dân chủ trực tiếp và bằng dân chủ ...","answer":"đại diện","explain":"Điều 6: Nhân dân thực hiện quyền lực nhà nước bằng dân chủ trực tiếp, bằng dân chủ đại diện thông qua Quốc hội, Hội đồng nhân dân và thông qua các cơ quan khác của Nhà nước.","points":0.5},{"type":"short","level":"VDC","q":"Theo khoản 2 Điều 7 Hiến pháp 2013, đại biểu Quốc hội bị bãi nhiệm trong trường hợp nào? (Trả lời ngắn gọn)","answer":"Không còn xứng đáng với sự tín nhiệm của Nhân dân","explain":"Khoản 2 Điều 7: Đại biểu Quốc hội, đại biểu Hội đồng nhân dân bị cử tri hoặc Quốc hội, Hội đồng nhân dân bãi nhiệm khi không còn xứng đáng với sự tín nhiệm của Nhân dân.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Theo Điều 6 Hiến pháp năm 2013, Nhân dân thực hiện quyền lực nhà nước bằng dân chủ đại diện chủ yếu thông qua các cơ quan nào?","options":["A. Quốc hội, Hội đồng nhân dân","B. Viện kiểm sát nhân dân các cấp","C. Các doanh nghiệp nhà nước","D. Tòa án nhân dân các cấp"],"answer":"A","explain":"Điều 6: Nhân dân thực hiện quyền lực nhà nước bằng dân chủ đại diện thông qua Quốc hội, Hội đồng nhân dân và thông qua các cơ quan khác của Nhà nước.","points":0.25},{"type":"mcq","level":"NB","q":"Theo Điều 1 Hiến pháp 2013, lãnh thổ nước Cộng hòa xã hội chủ nghĩa Việt Nam bao gồm các bộ phận nào?","options":["A. Đất liền, hải đảo, vùng biển và vùng trời","B. Chỉ đất liền và hải đảo","C. Chỉ vùng biển và vùng trời","D. Đất liền và các công trình trên biển"],"answer":"A","explain":"Điều 1: Nước ta thống nhất và toàn vẹn lãnh thổ, bao gồm đất liền, hải đảo, vùng biển và vùng trời.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên tắc bỏ phiếu kín trong bầu cử có nghĩa là","options":["A. kết quả bầu cử được giữ bí mật tuyệt đối, không công bố","B. chỉ một số ít người được phép đi bỏ phiếu","C. mọi người đều biết cử tri bầu cho ai","D. cử tri tự mình viết phiếu và bỏ phiếu mà không ai được biết nội dung lựa chọn của mình"],"answer":"D","explain":"Bỏ phiếu kín bảo đảm cử tri tự do thể hiện ý chí của mình, không bị ai theo dõi hay gây sức ép về lựa chọn của mình. Đây là một trong bốn nguyên tắc bầu cử tại khoản 1 Điều 7.","points":0.25},{"type":"mcq","level":"TH","q":"Theo khoản 2 Điều 2 Hiến pháp 2013, nền tảng của quyền lực nhà nước thuộc về Nhân dân là","options":["A. sự ủng hộ của các tổ chức quốc tế","B. sức mạnh của lực lượng vũ trang","C. liên minh giữa các doanh nghiệp lớn trong nước","D. liên minh giữa giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức"],"answer":"D","explain":"Khoản 2 Điều 2: tất cả quyền lực nhà nước thuộc về Nhân dân mà nền tảng là liên minh giữa giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức.","points":0.25},{"type":"mcq","level":"VD","q":"Anh Hùng đi bầu cử đại biểu Hội đồng nhân dân nhưng có người đứng cạnh yêu cầu anh phải bầu cho ứng cử viên X. Hành vi này vi phạm nguyên tắc bầu cử nào?","options":["A. Bình đẳng","B. Bỏ phiếu kín","C. Phổ thông","D. Trực tiếp"],"answer":"B","explain":"Nguyên tắc bỏ phiếu kín (khoản 1 Điều 7) bảo đảm cử tri tự do lựa chọn, không ai được theo dõi hay gây sức ép về nội dung lá phiếu của cử tri.","points":0.25},{"type":"mcq","level":"VDC","q":"Khẳng định nào sau đây thể hiện đúng mối quan hệ giữa Điều 1 và Điều 2 Hiến pháp 2013?","options":["A. Điều 2 phủ định nội dung của Điều 1","B. Điều 1 và Điều 2 mâu thuẫn nhau về bản chất nhà nước","C. Điều 1 quy định về quyền công dân, Điều 2 quy định về nghĩa vụ công dân","D. Điều 1 khẳng định vị thế của quốc gia, Điều 2 khẳng định bản chất của Nhà nước; hai điều bổ sung cho nhau tạo nên chế độ chính trị Việt Nam"],"answer":"D","explain":"Điều 1 xác định Việt Nam là quốc gia độc lập, có chủ quyền, thống nhất và toàn vẹn lãnh thổ; Điều 2 xác định bản chất Nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân. Hai điều cùng thuộc Chương I, tạo nền tảng của chế độ chính trị.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau về Điều 1 Hiến pháp 2013:","statements":["a) Việt Nam là một nước độc lập, có chủ quyền","b) Việt Nam là quốc gia thống nhất và toàn vẹn lãnh thổ","c) Lãnh thổ Việt Nam bao gồm đất liền, hải đảo, vùng biển và vùng trời","d) Việt Nam là quốc gia liên bang gồm nhiều nước thành viên"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 1. d sai: Việt Nam là quốc gia đơn nhất, thống nhất, không phải liên bang.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về quyền lực nhà nước:","statements":["a) Quyền lực nhà nước là thống nhất","b) Có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước","c) Các quyền lập pháp, hành pháp, tư pháp được thực hiện thống nhất, có phân công","d) Quyền lực nhà nước thuộc về các cơ quan nhà nước chứ không thuộc về Nhân dân"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo khoản 3 Điều 2. d sai: khoản 2 Điều 2 khẳng định tất cả quyền lực nhà nước thuộc về Nhân dân.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Theo Điều 1 Hiến pháp 2013, nước Cộng hòa xã hội chủ nghĩa Việt Nam là một nước độc lập, có chủ quyền, ... và toàn vẹn lãnh thổ.","answer":"thống nhất","explain":"Điều 1: Nước Cộng hòa xã hội chủ nghĩa Việt Nam là một nước độc lập, có chủ quyền, thống nhất và toàn vẹn lãnh thổ.","points":0.5},{"type":"short","level":"VDC","q":"Theo khoản 1 Điều 4 Hiến pháp 2013, Đảng Cộng sản Việt Nam được xác định là đội tiên phong của giai cấp công nhân, đồng thời là đội tiên phong của những lực lượng nào? (Trả lời ngắn gọn)","answer":"nhân dân lao động và dân tộc Việt Nam","explain":"Khoản 1 Điều 4: Đảng là Đội tiên phong của giai cấp công nhân, đồng thời là đội tiên phong của nhân dân lao động và của dân tộc Việt Nam.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Theo khoản 3 Điều 2 Hiến pháp 2013, quyền lực nhà nước","options":["A. do các tổ chức nước ngoài giám sát","B. bị chia thành nhiều phần độc lập, không liên quan đến nhau","C. là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước","D. chỉ tập trung ở cơ quan hành pháp"],"answer":"C","explain":"Khoản 3 Điều 2: Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp.","points":0.25},{"type":"mcq","level":"NB","q":"Nền tảng tư tưởng của Đảng Cộng sản Việt Nam theo Điều 4 Hiến pháp 2013 là","options":["A. tư tưởng phong kiến và Nho giáo","B. chủ nghĩa Mác – Lênin và tư tưởng Hồ Chí Minh","C. chủ nghĩa dân túy cực đoan","D. chủ nghĩa tư bản và kinh tế thị trường tự do"],"answer":"B","explain":"Khoản 1 Điều 4: Đảng lấy chủ nghĩa Mác – Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng.","points":0.25},{"type":"mcq","level":"TH","q":"Việc người dân góp ý vào dự thảo luật trên cổng thông tin điện tử của Quốc hội là biểu hiện của hình thức dân chủ nào?","options":["A. Dân chủ hình thức","B. Dân chủ tập trung","C. Dân chủ đại diện","D. Dân chủ trực tiếp"],"answer":"D","explain":"Người dân trực tiếp tham gia ý kiến vào công việc của Nhà nước mà không qua trung gian đại biểu là dân chủ trực tiếp theo Điều 6.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên tắc phổ thông trong bầu cử được hiểu là","options":["A. chỉ nam giới mới được quyền bầu cử","B. chỉ những người có trình độ đại học mới được bầu cử","C. chỉ cán bộ, công chức mới được bầu cử","D. mọi công dân đủ điều kiện theo luật định đều có quyền bầu cử, không phân biệt"],"answer":"D","explain":"Phổ thông nghĩa là quyền bầu cử được mở rộng cho mọi công dân đủ điều kiện theo luật định, không phân biệt dân tộc, giới tính, tôn giáo, trình độ.","points":0.25},{"type":"mcq","level":"VD","q":"Quốc hội ban hành luật, Chính phủ tổ chức thi hành luật, Tòa án xét xử các vụ án. Sự phân công này thể hiện nội dung nào của Điều 2 Hiến pháp 2013?","options":["A. Chia cắt quyền lực nhà nước thành các phần độc lập","B. Tập trung mọi quyền lực vào Quốc hội","C. Giao toàn bộ quyền lực cho Chính phủ","D. Phân công thực hiện các quyền lập pháp, hành pháp, tư pháp giữa các cơ quan nhà nước"],"answer":"D","explain":"Đây là biểu hiện của sự phân công trong khoản 3 Điều 2: Quốc hội thực hiện quyền lập pháp, Chính phủ thực hiện quyền hành pháp, Tòa án thực hiện quyền tư pháp; thống nhất nhưng có phân công, phối hợp, kiểm soát.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định: Dân chủ trực tiếp và dân chủ đại diện là hai hình thức đối lập, chỉ nên áp dụng một trong hai. Nhận định này","options":["A. đúng, vì dân chủ trực tiếp đã lỗi thời","B. đúng, vì hai hình thức này mâu thuẫn nhau","C. sai, vì Điều 6 quy định Nhân dân thực hiện quyền lực nhà nước bằng cả hai hình thức, bổ sung cho nhau","D. sai, vì Hiến pháp chỉ quy định dân chủ đại diện"],"answer":"C","explain":"Điều 6: Nhân dân thực hiện quyền lực nhà nước bằng dân chủ trực tiếp, bằng dân chủ đại diện. Hai hình thức bổ sung cho nhau: dân chủ đại diện là chủ yếu, dân chủ trực tiếp phát huy sự tham gia trực tiếp của Nhân dân.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Đảng Cộng sản Việt Nam chịu sự giám sát của Nhân dân","b) Đảng chịu trách nhiệm trước Nhân dân về những quyết định của mình","c) Đảng viên được phép hoạt động ngoài khuôn khổ pháp luật","d) Đảng Cộng sản Việt Nam phục vụ Nhân dân"],"answer":["T","T","F","T"],"explain":"a, b, d đúng theo khoản 2 Điều 4. c sai: khoản 3 Điều 4 quy định đảng viên hoạt động trong khuôn khổ Hiến pháp và pháp luật.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về nguyên tắc bầu cử:","statements":["a) Nguyên tắc trực tiếp nghĩa là cử tri trực tiếp bầu ra đại biểu của mình","b) Nguyên tắc bình đẳng nghĩa là mỗi cử tri có giá trị lá phiếu ngang nhau","c) Nguyên tắc phổ thông cho phép mọi công dân không phân biệt độ tuổi đều được bầu cử","d) Bốn nguyên tắc bầu cử được quy định tại khoản 1 Điều 7"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: nguyên tắc phổ thông vẫn đòi hỏi công dân phải đủ điều kiện theo luật định, trong đó có điều kiện về độ tuổi (Điều 27).","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu theo khoản 1 Điều 2: Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam là Nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, ... Nhân dân, vì Nhân dân.","answer":"do","explain":"Khoản 1 Điều 2: Nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân.","points":0.5},{"type":"short","level":"VDC","q":"Theo khoản 2 Điều 2 Hiến pháp 2013, tất cả quyền lực nhà nước thuộc về ai? (Trả lời ngắn gọn)","answer":"Nhân dân","explain":"Khoản 2 Điều 2: tất cả quyền lực nhà nước thuộc về Nhân dân.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Theo khoản 2 Điều 7 Hiến pháp 2013, đại biểu Quốc hội bị bãi nhiệm khi","options":["A. xin chuyển công tác sang cơ quan khác","B. hết nhiệm kỳ công tác","C. đủ 60 tuổi","D. không còn xứng đáng với sự tín nhiệm của Nhân dân"],"answer":"D","explain":"Khoản 2 Điều 7: đại biểu bị cử tri hoặc Quốc hội, Hội đồng nhân dân bãi nhiệm khi không còn xứng đáng với sự tín nhiệm của Nhân dân.","points":0.25},{"type":"mcq","level":"NB","q":"Theo Điều 2 Hiến pháp 2013, nước Cộng hòa xã hội chủ nghĩa Việt Nam do ai làm chủ?","options":["A. Các tổ chức quốc tế","B. Nhân dân","C. Giai cấp tư sản","D. Tầng lớp quý tộc"],"answer":"B","explain":"Khoản 2 Điều 2: Nước Cộng hòa xã hội chủ nghĩa Việt Nam do Nhân dân làm chủ; tất cả quyền lực nhà nước thuộc về Nhân dân.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Hiến pháp 2013 khẳng định Việt Nam thống nhất và toàn vẹn lãnh thổ?","options":["A. Để cho phép các địa phương tách ra thành lập quốc gia riêng","B. Để sáp nhập với các quốc gia láng giềng","C. Để khẳng định chủ quyền quốc gia; mọi hành vi chia cắt, xâm phạm lãnh thổ đều vi phạm Hiến pháp và bị nghiêm trị","D. Để từ bỏ chủ quyền đối với hải đảo và vùng biển"],"answer":"C","explain":"Điều 1 khẳng định Việt Nam là nước thống nhất và toàn vẹn lãnh thổ. Đây là cơ sở pháp lý để bảo vệ chủ quyền quốc gia; mọi hành vi chia cắt, xâm phạm lãnh thổ đều bị nghiêm trị.","points":0.25},{"type":"mcq","level":"TH","q":"Theo Điều 4 Hiến pháp 2013, Đảng Cộng sản Việt Nam đồng thời là đội tiên phong của","options":["A. giới tăng lữ tôn giáo","B. giai cấp công nhân, nhân dân lao động và dân tộc Việt Nam","C. giai cấp tư sản và tầng lớp trung lưu","D. tầng lớp địa chủ phong kiến"],"answer":"B","explain":"Khoản 1 Điều 4: Đảng là Đội tiên phong của giai cấp công nhân, đồng thời là đội tiên phong của nhân dân lao động và của dân tộc Việt Nam.","points":0.25},{"type":"mcq","level":"VD","q":"Trong ngày bầu cử, ông Tuấn tự tay viết phiếu và bỏ vào thùng phiếu mà không cho ai xem. Ông Tuấn đã thực hiện đúng nguyên tắc bầu cử nào?","options":["A. Bình đẳng","B. Bỏ phiếu kín","C. Phổ thông","D. Trực tiếp"],"answer":"B","explain":"Tự mình viết phiếu, không ai được biết nội dung lựa chọn là thực hiện nguyên tắc bỏ phiếu kín theo khoản 1 Điều 7.","points":0.25},{"type":"mcq","level":"VDC","q":"Có người cho rằng Nhà nước pháp quyền xã hội chủ nghĩa chỉ cần quản lý xã hội bằng pháp luật là đủ, không cần của Nhân dân, do Nhân dân, vì Nhân dân. Quan điểm này","options":["A. đúng, vì Nhân dân không liên quan đến nhà nước pháp quyền","B. sai, vì Việt Nam không phải là nhà nước pháp quyền","C. sai, vì Điều 2 xác định bản chất Nhà nước ta là của Nhân dân, do Nhân dân, vì Nhân dân; pháp luật là phương thức tổ chức và hoạt động","D. đúng, vì pháp luật là yếu tố duy nhất của nhà nước pháp quyền"],"answer":"C","explain":"Khoản 1 Điều 2 khẳng định Nhà nước ta là Nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân. Tính pháp quyền và bản chất của Nhân dân, do Nhân dân, vì Nhân dân là thống nhất, không thể tách rời.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Nhân dân thực hiện quyền lực nhà nước bằng dân chủ trực tiếp","b) Nhân dân thực hiện quyền lực nhà nước bằng dân chủ đại diện thông qua Quốc hội, Hội đồng nhân dân","c) Nội dung trên được quy định tại Điều 6 Hiến pháp 2013","d) Nhân dân không có quyền lực gì trong Nhà nước ta"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 6. d sai: khoản 2 Điều 2 khẳng định tất cả quyền lực nhà nước thuộc về Nhân dân.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Điều 1 và Điều 2 đều thuộc Chương I Hiến pháp 2013 về chế độ chính trị","b) Điều 1 khẳng định Việt Nam là nước độc lập, có chủ quyền","c) Điều 2 khẳng định Nhà nước ta là nhà nước pháp quyền xã hội chủ nghĩa","d) Chương I Hiến pháp 2013 quy định về quyền và nghĩa vụ cơ bản của công dân"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: quyền và nghĩa vụ cơ bản của công dân được quy định tại Chương II Hiến pháp 2013.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Việc bầu cử đại biểu Quốc hội được tiến hành theo nguyên tắc phổ thông, bình đẳng, ... và bỏ phiếu kín.","answer":"trực tiếp","explain":"Khoản 1 Điều 7: Việc bầu cử được tiến hành theo nguyên tắc phổ thông, bình đẳng, trực tiếp và bỏ phiếu kín.","points":0.5},{"type":"short","level":"VDC","q":"Điền cụm từ còn thiếu theo khoản 1 Điều 4: Đảng Cộng sản Việt Nam lấy chủ nghĩa Mác – Lênin và ... làm nền tảng tư tưởng.","answer":"tư tưởng Hồ Chí Minh","explain":"Khoản 1 Điều 4: Đảng lấy chủ nghĩa Mác – Lênin và tư tưởng Hồ Chí Minh làm nền tảng tư tưởng.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Theo khoản 3 Điều 4 Hiến pháp 2013, các tổ chức của Đảng và đảng viên hoạt động","options":["A. theo ý chí chủ quan của từng đảng viên","B. ngoài sự điều chỉnh của pháp luật","C. trong khuôn khổ Hiến pháp và pháp luật","D. chỉ theo Điều lệ Đảng mà không cần tuân theo pháp luật"],"answer":"C","explain":"Khoản 3 Điều 4: Các tổ chức của Đảng và đảng viên Đảng Cộng sản Việt Nam hoạt động trong khuôn khổ Hiến pháp và pháp luật.","points":0.25},{"type":"mcq","level":"NB","q":"Ba quyền lập pháp, hành pháp, tư pháp được nhắc đến trong khoản 3 Điều 2 Hiến pháp 2013 thể hiện","options":["A. sự chia cắt quyền lực nhà nước","B. sự tập trung quyền lực vào một cá nhân","C. sự phụ thuộc của Việt Nam vào nước ngoài","D. sự phân công thực hiện quyền lực nhà nước giữa các cơ quan"],"answer":"D","explain":"Khoản 3 Điều 2: quyền lực nhà nước thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Hiến pháp quy định đại biểu Quốc hội có thể bị bãi nhiệm?","options":["A. Để bảo đảm đại biểu luôn xứng đáng với sự tín nhiệm của Nhân dân, chịu trách nhiệm trước cử tri","B. Để thay đổi đại biểu theo ý thích của một số cá nhân","C. Để tăng quyền lực cho cơ quan hành pháp","D. Để giảm số lượng đại biểu Quốc hội"],"answer":"A","explain":"Khoản 2 Điều 7: đại biểu bị bãi nhiệm khi không còn xứng đáng với sự tín nhiệm của Nhân dân. Quy định này thể hiện nguyên tắc đại biểu chịu trách nhiệm trước cử tri và Nhân dân.","points":0.25},{"type":"mcq","level":"TH","q":"Hội đồng nhân dân các cấp trong hệ thống chính trị Việt Nam là","options":["A. cơ quan điều tra tội phạm","B. cơ quan xét xử ở địa phương","C. cơ quan quyền lực nhà nước ở địa phương, do Nhân dân địa phương bầu ra","D. tổ chức xã hội tự nguyện"],"answer":"C","explain":"Theo Điều 6, Nhân dân thực hiện quyền lực nhà nước bằng dân chủ đại diện thông qua Quốc hội, Hội đồng nhân dân. Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương do Nhân dân địa phương trực tiếp bầu ra.","points":0.25},{"type":"mcq","level":"VD","q":"Một nhóm người có hành vi tuyên truyền chia cắt đất nước, đòi thành lập quốc gia riêng. Hành vi này vi phạm nội dung nào của Điều 1 Hiến pháp 2013?","options":["A. Nguyên tắc bầu cử phổ thông","B. Quyền tự do ngôn luận của công dân","C. Nghĩa vụ nộp thuế của công dân","D. Nguyên tắc Việt Nam là nước thống nhất và toàn vẹn lãnh thổ"],"answer":"D","explain":"Điều 1 khẳng định Việt Nam là nước thống nhất và toàn vẹn lãnh thổ. Mọi hành vi chia cắt đất nước đều vi phạm Hiến pháp và bị nghiêm trị.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định: Đảng lãnh đạo Nhà nước và xã hội nên mọi quyết định của Đảng đều tự động trở thành pháp luật. Nhận định này","options":["A. đúng, vì Đảng lãnh đạo toàn diện nên quyết định của Đảng chính là luật","B. sai, vì Đảng lãnh đạo bằng đường lối, chủ trương; pháp luật do cơ quan nhà nước có thẩm quyền ban hành theo trình tự luật định","C. sai, vì Đảng không có vai trò lãnh đạo Nhà nước","D. đúng, vì Nhân dân không tham gia xây dựng pháp luật"],"answer":"B","explain":"Điều 4 khẳng định vai trò lãnh đạo của Đảng đối với Nhà nước và xã hội; đồng thời khoản 3 Điều 4 yêu cầu tổ chức Đảng hoạt động trong khuôn khổ Hiến pháp và pháp luật. Đảng lãnh đạo Nhà nước bằng cương lĩnh, đường lối, chủ trương; việc thể chế hóa thành pháp luật thuộc thẩm quyền của các cơ quan nhà nước theo trình tự luật định.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Bầu cử đại biểu Hội đồng nhân dân cũng tiến hành theo nguyên tắc phổ thông, bình đẳng, trực tiếp và bỏ phiếu kín","b) Cử tri có quyền bãi nhiệm đại biểu không còn xứng đáng với sự tín nhiệm của mình","c) Nguyên tắc bầu cử chỉ áp dụng cho bầu cử đại biểu Quốc hội","d) Điều 7 Hiến pháp 2013 quy định về bầu cử"],"answer":["T","T","F","T"],"explain":"a, b, d đúng theo Điều 7 (khoản 1 áp dụng cho cả đại biểu Quốc hội và đại biểu Hội đồng nhân dân; khoản 2 về bãi nhiệm). c sai: nguyên tắc bầu cử áp dụng cho cả hai loại bầu cử.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Nhà nước ta được tổ chức và hoạt động theo Hiến pháp và pháp luật","b) Mọi cơ quan nhà nước đều phải tuân theo Hiến pháp và pháp luật","c) Nhà nước pháp quyền xã hội chủ nghĩa không cần đến pháp luật","d) Cụm từ của Nhân dân, do Nhân dân, vì Nhân dân thể hiện bản chất của Nhà nước ta"],"answer":["T","T","F","T"],"explain":"a, b, d đúng theo khoản 1 Điều 2 và nguyên tắc nhà nước pháp quyền. c sai: nhà nước pháp quyền chính là nhà nước tổ chức và hoạt động trong khuôn khổ Hiến pháp, pháp luật.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Theo Điều 4 Hiến pháp 2013, Đảng Cộng sản Việt Nam là ... lãnh đạo Nhà nước và xã hội.","answer":"lực lượng","explain":"Khoản 1 Điều 4: Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Nhà nước và xã hội.","points":0.5},{"type":"short","level":"VDC","q":"Theo Hiến pháp 2013, Nhân dân thực hiện quyền lực nhà nước bằng hai hình thức dân chủ nào? (Trả lời đầy đủ)","answer":"Dân chủ trực tiếp và dân chủ đại diện","explain":"Điều 6: Nhân dân thực hiện quyền lực nhà nước bằng dân chủ trực tiếp, bằng dân chủ đại diện thông qua Quốc hội, Hội đồng nhân dân và thông qua các cơ quan khác của Nhà nước.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Theo Điều 6 Hiến pháp 2013, hình thức dân chủ mà Nhân dân trực tiếp quyết định công việc của mình được gọi là","options":["A. dân chủ trực tiếp","B. dân chủ tập trung","C. dân chủ gián tiếp","D. dân chủ đại diện"],"answer":"A","explain":"Điều 6: Nhân dân thực hiện quyền lực nhà nước bằng dân chủ trực tiếp, bằng dân chủ đại diện. Dân chủ trực tiếp là hình thức Nhân dân trực tiếp bàn bạc, quyết định công việc.","points":0.25},{"type":"mcq","level":"NB","q":"Cụm từ nào sau đây KHÔNG thuộc bốn nguyên tắc bầu cử theo Điều 7 Hiến pháp 2013?","options":["A. Bỏ phiếu công khai","B. Phổ thông","C. Bình đẳng","D. Trực tiếp"],"answer":"A","explain":"Khoản 1 Điều 7 quy định bốn nguyên tắc: phổ thông, bình đẳng, trực tiếp và bỏ phiếu kín. Bỏ phiếu công khai trái với nguyên tắc bỏ phiếu kín.","points":0.25},{"type":"mcq","level":"TH","q":"Khẳng định tất cả quyền lực nhà nước thuộc về Nhân dân có nghĩa là","options":["A. cơ quan nhà nước không có quyền lực gì","B. Nhân dân trực tiếp điều hành mọi công việc của đất nước hằng ngày","C. mỗi người dân đều có thể tự mình ban hành luật","D. Nhân dân là chủ thể tối cao của quyền lực nhà nước; các cơ quan nhà nước do Nhân dân lập nên và chịu sự giám sát của Nhân dân"],"answer":"D","explain":"Khoản 2 Điều 2: tất cả quyền lực nhà nước thuộc về Nhân dân. Nhân dân là chủ thể tối cao của quyền lực; các cơ quan nhà nước do Nhân dân bầu ra, hoạt động theo sự ủy quyền và chịu sự giám sát của Nhân dân.","points":0.25},{"type":"mcq","level":"TH","q":"Việc Đảng Cộng sản Việt Nam chịu sự giám sát của Nhân dân (khoản 2 Điều 4) được hiểu là","options":["A. Nhân dân có quyền giám sát, góp ý, phê bình đối với tổ chức Đảng và đảng viên","B. Nhân dân không được góp ý với Đảng","C. chỉ cơ quan nhà nước mới được giám sát Đảng","D. Đảng không cần lắng nghe ý kiến của Nhân dân"],"answer":"A","explain":"Khoản 2 Điều 4: Đảng gắn bó mật thiết với Nhân dân, phục vụ Nhân dân, chịu sự giám sát của Nhân dân, chịu trách nhiệm trước Nhân dân về những quyết định của mình.","points":0.25},{"type":"mcq","level":"VD","q":"Lớp 10A tổ chức lấy ý kiến học sinh về việc trang trí lớp học bằng hình thức bỏ phiếu kín rồi thực hiện theo ý kiến đa số. Việc làm này gần nhất với hình thức dân chủ nào?","options":["A. Không phải hình thức dân chủ","B. Dân chủ trực tiếp","C. Dân chủ tập trung trong Đảng","D. Dân chủ đại diện"],"answer":"B","explain":"Học sinh trực tiếp bày tỏ ý chí và quyết định công việc chung của tập thể là biểu hiện của dân chủ trực tiếp ở phạm vi tập thể, tương đồng với hình thức dân chủ trực tiếp trong Điều 6.","points":0.25},{"type":"mcq","level":"VDC","q":"Tại một điểm bầu cử, do số cử tri đông, tổ bầu cử đề nghị cử tri ghi phiếu tập thể theo hộ gia đình để nhanh gọn. Cách làm này vi phạm nguyên tắc nào?","options":["A. Không vi phạm nguyên tắc nào","B. Bình đẳng","C. Phổ thông","D. Trực tiếp và bỏ phiếu kín"],"answer":"D","explain":"Nguyên tắc trực tiếp đòi hỏi cử tri tự mình bầu, không qua trung gian; nguyên tắc bỏ phiếu kín đòi hỏi không ai được biết nội dung lựa chọn của cử tri. Ghi phiếu tập thể theo hộ gia đình vi phạm cả hai nguyên tắc này theo khoản 1 Điều 7.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Nhà nước ta là Nhà nước pháp quyền xã hội chủ nghĩa","b) Nhà nước ta hoạt động vì lợi ích của Nhân dân","c) Quyền lực nhà nước thuộc về một nhóm người đặc biệt","d) Nội dung trên được quy định tại Điều 2 Hiến pháp 2013"],"answer":["T","T","F","T"],"explain":"a, b, d đúng theo Điều 2. c sai: tất cả quyền lực nhà nước thuộc về Nhân dân.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về Đảng Cộng sản Việt Nam:","statements":["a) Đảng là đội tiên phong của giai cấp công nhân","b) Đảng đồng thời là đội tiên phong của nhân dân lao động và của dân tộc Việt Nam","c) Đảng là đại biểu trung thành lợi ích của giai cấp công nhân, nhân dân lao động và của dân tộc","d) Đảng Cộng sản Việt Nam không có nền tảng tư tưởng"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo khoản 1 Điều 4. d sai: nền tảng tư tưởng của Đảng là chủ nghĩa Mác – Lênin và tư tưởng Hồ Chí Minh.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Theo khoản 2 Điều 4, Đảng Cộng sản Việt Nam gắn bó mật thiết với Nhân dân, ... Nhân dân, chịu sự giám sát của Nhân dân.","answer":"phục vụ","explain":"Khoản 2 Điều 4: Đảng Cộng sản Việt Nam gắn bó mật thiết với Nhân dân, phục vụ Nhân dân, chịu sự giám sát của Nhân dân.","points":0.5},{"type":"short","level":"VDC","q":"Theo Hiến pháp 2013, việc bầu cử đại biểu Quốc hội và đại biểu Hội đồng nhân dân được quy định tại điều nào? (Chỉ ghi số điều)","answer":"Điều 7","explain":"Điều 7 Hiến pháp 2013 quy định về bầu cử đại biểu Quốc hội và đại biểu Hội đồng nhân dân.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Theo Hiến pháp 2013, bản chất của Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam được quy định tại điều nào?","options":["A. Điều 7","B. Điều 6","C. Điều 1","D. Điều 2"],"answer":"D","explain":"Điều 2 quy định bản chất Nhà nước ta: Nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân.","points":0.25},{"type":"mcq","level":"NB","q":"Cụm từ có chủ quyền trong Điều 1 Hiến pháp 2013 được hiểu là","options":["A. Việt Nam không có quyền quyết định vận mệnh của mình","B. Việt Nam có quyền tối cao, độc lập trong việc quyết định các vấn đề của đất nước","C. chủ quyền của Việt Nam do tổ chức quốc tế nắm giữ","D. Việt Nam phụ thuộc vào sự chỉ đạo của nước ngoài"],"answer":"B","explain":"Có chủ quyền nghĩa là quốc gia có quyền tối cao, độc lập, tự quyết định mọi vấn đề đối nội và đối ngoại của mình, không chịu sự chi phối của bất kì thế lực bên ngoài nào.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác nhau cơ bản giữa dân chủ trực tiếp và dân chủ đại diện là","options":["A. dân chủ đại diện không cần bầu cử","B. hai hình thức này hoàn toàn giống nhau","C. dân chủ trực tiếp: Nhân dân trực tiếp quyết định; dân chủ đại diện: Nhân dân quyết định thông qua người đại diện do mình bầu ra","D. dân chủ trực tiếp chỉ áp dụng ở trung ương"],"answer":"C","explain":"Theo Điều 6, dân chủ trực tiếp là Nhân dân trực tiếp thực hiện quyền lực (bầu cử, trưng cầu ý dân, biểu quyết); dân chủ đại diện là Nhân dân thực hiện quyền lực thông qua Quốc hội, Hội đồng nhân dân và các cơ quan nhà nước khác do mình bầu ra.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên tắc bình đẳng trong bầu cử được hiểu là","options":["A. mỗi cử tri đều có một lá phiếu với giá trị ngang nhau, không phân biệt","B. cán bộ có giá trị phiếu cao hơn người dân thường","C. người giàu có nhiều phiếu hơn người nghèo","D. nam giới có hai phiếu, nữ giới có một phiếu"],"answer":"A","explain":"Bình đẳng trong bầu cử nghĩa là mọi cử tri đều có quyền bầu cử như nhau, mỗi người một phiếu với giá trị ngang nhau, không có sự phân biệt đối xử.","points":0.25},{"type":"mcq","level":"VD","q":"Chi bộ thôn X tổ chức cho đảng viên và nhân dân đóng góp ý kiến vào dự thảo nghị quyết phát triển kinh tế của thôn. Việc làm này thể hiện nội dung nào của Điều 4?","options":["A. Đảng chỉ lãnh đạo mà không cần lắng nghe nhân dân","B. Đảng gắn bó mật thiết với Nhân dân, chịu sự giám sát của Nhân dân","C. Nhân dân không được tham gia ý kiến với Đảng","D. Đảng đứng ngoài và không liên quan đến nhân dân"],"answer":"B","explain":"Khoản 2 Điều 4: Đảng gắn bó mật thiết với Nhân dân, phục vụ Nhân dân, chịu sự giám sát của Nhân dân. Việc lấy ý kiến nhân dân là biểu hiện sinh động của mối quan hệ gắn bó đó.","points":0.25},{"type":"mcq","level":"VDC","q":"Một bài viết trên mạng xã hội cho rằng vùng biển và hải đảo không phải là bộ phận lãnh thổ của Việt Nam. Nhận định này","options":["A. đúng, vì vùng biển thuộc sở hữu chung của thế giới","B. đúng, vì Hiến pháp chỉ công nhận đất liền","C. sai, vì hải đảo thuộc quyền quản lý của tổ chức quốc tế","D. sai, vì Điều 1 khẳng định lãnh thổ Việt Nam bao gồm đất liền, hải đảo, vùng biển và vùng trời"],"answer":"D","explain":"Điều 1: Nước ta thống nhất và toàn vẹn lãnh thổ, bao gồm đất liền, hải đảo, vùng biển và vùng trời. Hoàng Sa, Trường Sa là bộ phận không thể tách rời của lãnh thổ Việt Nam.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Điều 1 Hiến pháp 2013 thuộc Chương I về chế độ chính trị","b) Điều 7 Hiến pháp 2013 thuộc Chương I về chế độ chính trị","c) Chương I Hiến pháp 2013 gồm các điều từ Điều 1 đến Điều 13","d) Điều 1 quy định về nguyên tắc bầu cử"],"answer":["T","T","T","F"],"explain":"a, b, c đúng: Chương I (Chế độ chính trị) gồm Điều 1 đến Điều 13. d sai: nguyên tắc bầu cử được quy định tại Điều 7; Điều 1 khẳng định Việt Nam là nước độc lập, có chủ quyền, thống nhất và toàn vẹn lãnh thổ.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Quốc hội là cơ quan thông qua đó Nhân dân thực hiện quyền lực nhà nước bằng dân chủ đại diện","b) Hội đồng nhân dân các cấp do Nhân dân địa phương trực tiếp bầu ra","c) Mọi công việc của Nhà nước đều do Nhân dân trực tiếp quyết định, không cần cơ quan đại diện","d) Dân chủ đại diện là hình thức chủ yếu để Nhân dân thực hiện quyền lực nhà nước"],"answer":["T","T","F","T"],"explain":"a, b, d đúng theo Điều 6. c sai: trong nhà nước hiện đại, Nhân dân chủ yếu thực hiện quyền lực thông qua các cơ quan đại diện do mình bầu ra; dân chủ trực tiếp áp dụng trong những trường hợp luật định.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Theo khoản 3 Điều 2, các cơ quan nhà nước thực hiện các quyền lập pháp, ..., tư pháp.","answer":"hành pháp","explain":"Khoản 3 Điều 2: các cơ quan nhà nước thực hiện các quyền lập pháp, hành pháp, tư pháp.","points":0.5},{"type":"short","level":"VDC","q":"Theo Điều 4 Hiến pháp 2013, Đảng Cộng sản Việt Nam chịu trách nhiệm trước ai về những quyết định của mình? (Trả lời ngắn gọn)","answer":"Nhân dân","explain":"Khoản 2 Điều 4: Đảng chịu trách nhiệm trước Nhân dân về những quyết định của mình.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Theo Điều 6 Hiến pháp 2013, Nhân dân KHÔNG thực hiện quyền lực nhà nước thông qua chủ thể nào sau đây?","options":["A. Các tổ chức phi chính phủ nước ngoài","B. Quốc hội","C. Các cơ quan khác của Nhà nước","D. Hội đồng nhân dân"],"answer":"A","explain":"Điều 6: Nhân dân thực hiện quyền lực nhà nước bằng dân chủ trực tiếp, bằng dân chủ đại diện thông qua Quốc hội, Hội đồng nhân dân và thông qua các cơ quan khác của Nhà nước.","points":0.25},{"type":"mcq","level":"NB","q":"Theo Điều 4 Hiến pháp 2013, Đảng Cộng sản Việt Nam là đội tiên phong của giai cấp nào?","options":["A. Giai cấp tư sản","B. Giai cấp nông dân","C. Giai cấp công nhân","D. Tầng lớp tiểu thương"],"answer":"C","explain":"Khoản 1 Điều 4: Đảng là Đội tiên phong của giai cấp công nhân, đồng thời là đội tiên phong của nhân dân lao động và của dân tộc Việt Nam.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói Nhà nước ta là Nhà nước của Nhân dân?","options":["A. Vì Nhân dân phải phục vụ tuyệt đối cho bộ máy nhà nước","B. Vì nhà nước thuộc sở hữu riêng của một số cá nhân","C. Vì tất cả quyền lực nhà nước thuộc về Nhân dân, bộ máy nhà nước do Nhân dân tổ chức nên","D. Vì nhà nước không cần đến pháp luật"],"answer":"C","explain":"Khoản 2 Điều 2: Nước Cộng hòa xã hội chủ nghĩa Việt Nam do Nhân dân làm chủ; tất cả quyền lực nhà nước thuộc về Nhân dân. Đây là cơ sở để khẳng định Nhà nước ta là Nhà nước của Nhân dân.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào sau đây KHÔNG thuộc Điều 1 Hiến pháp 2013?","options":["A. Quy định về nguyên tắc bầu cử đại biểu Quốc hội","B. Việt Nam có chủ quyền","C. Việt Nam là nước độc lập","D. Việt Nam thống nhất và toàn vẹn lãnh thổ"],"answer":"A","explain":"Điều 1 khẳng định Việt Nam là nước độc lập, có chủ quyền, thống nhất và toàn vẹn lãnh thổ. Nguyên tắc bầu cử được quy định tại Điều 7.","points":0.25},{"type":"mcq","level":"VD","q":"Anh Minh đủ 18 tuổi nhưng đang đi làm ăn xa, không về địa phương bỏ phiếu được. Theo nguyên tắc bầu cử, anh Minh","options":["A. có thể ủy quyền cho tổ trưởng dân phố bầu thay","B. có thể gửi phiếu bầu qua đường bưu điện cho bất kì ai","C. không thể nhờ người khác bỏ phiếu thay vì bầu cử phải trực tiếp","D. có thể nhờ người nhà bỏ phiếu thay"],"answer":"C","explain":"Nguyên tắc bầu cử trực tiếp (khoản 1 Điều 7) đòi hỏi cử tri phải tự mình đi bầu, không được nhờ người bầu thay. Trường hợp đi xa, cử tri có thể làm thủ tục để bầu ở nơi tạm trú theo quy định của Luật Bầu cử.","points":0.25},{"type":"mcq","level":"VDC","q":"Mối quan hệ giữa Điều 2 và Điều 4 Hiến pháp 2013 được hiểu đúng là","options":["A. Điều 2 và Điều 4 mâu thuẫn nhau, không thể cùng tồn tại","B. Điều 4 phủ định nội dung Điều 2","C. Điều 2 quy định Đảng lãnh đạo, Điều 4 quy định quyền lực thuộc về Nhân dân","D. Điều 2 xác định Nhà nước của Nhân dân, do Nhân dân, vì Nhân dân; Điều 4 xác định Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Nhà nước và xã hội; sự lãnh đạo của Đảng bảo đảm bản chất nhà nước của Nhân dân"],"answer":"D","explain":"Điều 2 và Điều 4 thống nhất với nhau: sự lãnh đạo của Đảng bảo đảm Nhà nước thực sự là của Nhân dân, do Nhân dân, vì Nhân dân; đồng thời Đảng chịu sự giám sát của Nhân dân và hoạt động trong khuôn khổ Hiến pháp, pháp luật (khoản 2, 3 Điều 4).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Lực lượng lãnh đạo Nhà nước và xã hội là Đảng Cộng sản Việt Nam","b) Nội dung này được quy định tại Điều 4 Hiến pháp 2013","c) Ngoài Đảng Cộng sản Việt Nam còn có nhiều đảng khác cùng lãnh đạo Nhà nước","d) Đảng Cộng sản Việt Nam do Chủ tịch Hồ Chí Minh sáng lập và rèn luyện"],"answer":["T","T","F","T"],"explain":"a, b, d đúng (d được ghi nhận trong Lời nói đầu Hiến pháp 2013). c sai: Hiến pháp 2013 khẳng định Đảng Cộng sản Việt Nam là lực lượng lãnh đạo Nhà nước và xã hội.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Do Nhân dân nghĩa là bộ máy nhà nước do Nhân dân bầu ra và tổ chức nên","b) Vì Nhân dân nghĩa là mọi hoạt động của Nhà nước đều hướng tới lợi ích của Nhân dân","c) Của Nhân dân nghĩa là quyền lực nhà nước thuộc về Nhân dân","d) Cụm từ của Nhân dân, do Nhân dân, vì Nhân dân được quy định tại Điều 4"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo khoản 1, 2 Điều 2. d sai: cụm từ này được quy định tại khoản 1 Điều 2, không phải Điều 4.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Nước Cộng hòa xã hội chủ nghĩa Việt Nam do Nhân dân ... (khoản 2 Điều 2).","answer":"làm chủ","explain":"Khoản 2 Điều 2: Nước Cộng hòa xã hội chủ nghĩa Việt Nam do Nhân dân làm chủ.","points":0.5},{"type":"short","level":"VDC","q":"Theo Hiến pháp 2013, chế độ chính trị của nước ta được quy định tập trung tại chương nào? (Trả lời ngắn gọn)","answer":"Chương I","explain":"Chế độ chính trị được quy định tại Chương I Hiến pháp 2013 (từ Điều 1 đến Điều 13).","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Bốn nguyên tắc bầu cử theo khoản 1 Điều 7 Hiến pháp 2013 là","options":["A. tự nguyện, bình đẳng, trực tiếp và công khai","B. phổ thông, tập trung, trực tiếp và bỏ phiếu kín","C. phổ thông, công khai, gián tiếp và bỏ phiếu mở","D. phổ thông, bình đẳng, trực tiếp và bỏ phiếu kín"],"answer":"D","explain":"Khoản 1 Điều 7: Việc bầu cử được tiến hành theo nguyên tắc phổ thông, bình đẳng, trực tiếp và bỏ phiếu kín.","points":0.25},{"type":"mcq","level":"NB","q":"Theo Điều 1 Hiến pháp 2013, Việt Nam là một nước","options":["A. không có chủ quyền","B. độc lập","C. bị chia cắt","D. phụ thuộc"],"answer":"B","explain":"Điều 1: Nước Cộng hòa xã hội chủ nghĩa Việt Nam là một nước độc lập, có chủ quyền, thống nhất và toàn vẹn lãnh thổ.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung các tổ chức của Đảng và đảng viên hoạt động trong khuôn khổ Hiến pháp và pháp luật (khoản 3 Điều 4) thể hiện","options":["A. đảng viên được miễn trừ mọi trách nhiệm pháp lý","B. tổ chức Đảng không cần tuân theo pháp luật","C. Đảng đứng trên pháp luật","D. không một tổ chức, cá nhân nào đứng trên Hiến pháp và pháp luật, kể cả tổ chức Đảng và đảng viên"],"answer":"D","explain":"Khoản 3 Điều 4 khẳng định nguyên tắc pháp quyền: mọi tổ chức, cá nhân đều bình đẳng trước pháp luật và hoạt động trong khuôn khổ Hiến pháp, pháp luật.","points":0.25},{"type":"mcq","level":"TH","q":"Trưng cầu ý dân là hình thức","options":["A. dân chủ trực tiếp, trong đó Nhân dân trực tiếp biểu quyết về những vấn đề quan trọng của đất nước","B. hình thức không được Hiến pháp quy định","C. dân chủ đại diện thông qua Quốc hội","D. hoạt động của cơ quan hành pháp"],"answer":"A","explain":"Trưng cầu ý dân là hình thức dân chủ trực tiếp để Nhân dân trực tiếp quyết định những vấn đề quan trọng của đất nước theo Điều 6.","points":0.25},{"type":"mcq","level":"VD","q":"Khi phát hiện cán bộ xã có hành vi tham nhũng, người dân làm đơn tố cáo gửi cơ quan có thẩm quyền. Việc làm này thể hiện","options":["A. sự can thiệp trái phép vào công việc của cơ quan nhà nước","B. hành vi vi phạm pháp luật của người dân","C. quyền làm chủ của Nhân dân và nguyên tắc Nhà nước chịu sự giám sát của Nhân dân","D. quyền lực nhà nước thuộc về cán bộ xã"],"answer":"C","explain":"Khoản 2 Điều 2 khẳng định tất cả quyền lực nhà nước thuộc về Nhân dân; Nhân dân có quyền giám sát hoạt động của cơ quan nhà nước, cán bộ, công chức. Tố cáo hành vi tham nhũng là thực hiện quyền làm chủ của Nhân dân.","points":0.25},{"type":"mcq","level":"VDC","q":"Để bảo đảm nguyên tắc bình đẳng trong bầu cử, pháp luật quy định","options":["A. cử tri nào cũng được bỏ nhiều phiếu","B. cử tri ở thành phố được ưu tiên hơn cử tri ở nông thôn","C. người có chức vụ được bỏ hai phiếu","D. mỗi cử tri chỉ được ghi tên vào danh sách cử tri ở một nơi và bỏ một phiếu bầu"],"answer":"D","explain":"Bình đẳng trong bầu cử nghĩa là mỗi cử tri có một phiếu với giá trị ngang nhau; việc ghi tên hai nơi để bỏ hai phiếu là vi phạm nguyên tắc bình đẳng theo khoản 1 Điều 7.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Bầu cử đại biểu Quốc hội là hình thức dân chủ đại diện","b) Trưng cầu ý dân là hình thức dân chủ trực tiếp","c) Cả hai hình thức trên đều là cách Nhân dân thực hiện quyền lực nhà nước theo Điều 6","d) Nhân dân chỉ được thực hiện quyền lực nhà nước bằng một hình thức duy nhất"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 6. d sai: Điều 6 quy định Nhân dân thực hiện quyền lực nhà nước bằng cả dân chủ trực tiếp và dân chủ đại diện.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Điều 1, Điều 2, Điều 4 đều thuộc Chương I Hiến pháp 2013","b) Điều 1 khẳng định vị thế quốc gia, Điều 2 khẳng định bản chất nhà nước, Điều 4 khẳng định vai trò lãnh đạo của Đảng","c) Các điều trên tạo nên nền tảng của chế độ chính trị Việt Nam","d) Chế độ chính trị Việt Nam được quy định tại Chương II Hiến pháp 2013"],"answer":["T","T","T","F"],"explain":"a, b, c đúng. d sai: chế độ chính trị được quy định tại Chương I; Chương II quy định về quyền con người, quyền và nghĩa vụ cơ bản của công dân.","points":1},{"type":"short","level":"VD","q":"Điền từ còn thiếu: Theo khoản 1 Điều 7, việc bầu cử được tiến hành theo nguyên tắc phổ thông, ..., trực tiếp và bỏ phiếu kín.","answer":"bình đẳng","explain":"Khoản 1 Điều 7: Việc bầu cử được tiến hành theo nguyên tắc phổ thông, bình đẳng, trực tiếp và bỏ phiếu kín.","points":0.5},{"type":"short","level":"VDC","q":"Theo khoản 3 Điều 2, quyền lực nhà nước là thống nhất nhưng có sự phân công, phối hợp, kiểm soát giữa các cơ quan trong việc thực hiện ba quyền nào? (Liệt kê đầy đủ)","answer":"Lập pháp, hành pháp, tư pháp","explain":"Khoản 3 Điều 2: các cơ quan nhà nước thực hiện các quyền lập pháp, hành pháp, tư pháp.","points":0.5}]}]}
