<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Quyền con người, quyền và nghĩa vụ cơ bản của công dân được quy định tập trung tại chương nào của Hiến pháp 2013?","options":["A. Chương III","B. Chương V","C. Chương II","D. Chương I"],"answer":"C","explain":"Chương II Hiến pháp 2013 (từ Điều 14 đến Điều 49) quy định về quyền con người, quyền và nghĩa vụ cơ bản của công dân.","points":0.25},{"type":"mcq","level":"NB","q":"Theo Điều 20 Hiến pháp 2013, mọi người có quyền","options":["A. tự ý bắt giữ người khác","B. xâm phạm danh dự của người khác","C. bất khả xâm phạm về thân thể","D. tra tấn người phạm tội"],"answer":"C","explain":"Khoản 1 Điều 20: Mọi người có quyền bất khả xâm phạm về thân thể, được pháp luật bảo hộ về sức khoẻ, danh dự và nhân phẩm.","points":0.25},{"type":"mcq","level":"TH","q":"Theo Điều 25 Hiến pháp 2013, công dân có các quyền nào sau đây?","options":["A. Tự do làm bất cứ việc gì mình muốn mà không cần tuân theo pháp luật","B. Tự do xâm phạm lợi ích của người khác","C. Tự do ngôn luận, tự do báo chí, tiếp cận thông tin, hội họp, lập hội, biểu tình","D. Tự do không thực hiện nghĩa vụ công dân"],"answer":"C","explain":"Điều 25: Công dân có quyền tự do ngôn luận, tự do báo chí, tiếp cận thông tin, hội họp, lập hội, biểu tình. Việc thực hiện các quyền này do pháp luật quy định.","points":0.25},{"type":"mcq","level":"TH","q":"Theo Điều 27 Hiến pháp 2013, độ tuổi để công dân có quyền bầu cử và quyền ứng cử là","options":["A. không quy định về độ tuổi","B. đủ 20 tuổi được bầu cử, đủ 25 tuổi được ứng cử","C. đủ 18 tuổi trở lên được bầu cử, đủ 21 tuổi trở lên được ứng cử","D. đủ 16 tuổi được bầu cử, đủ 18 tuổi được ứng cử"],"answer":"C","explain":"Điều 27: Công dân đủ mười tám tuổi trở lên có quyền bầu cử và đủ hai mươi mốt tuổi trở lên có quyền ứng cử vào Quốc hội, Hội đồng nhân dân.","points":0.25},{"type":"mcq","level":"VD","q":"Anh K có hành vi cung cấp bí mật nhà nước cho tổ chức phản động ở nước ngoài. Hành vi của anh K vi phạm nghĩa vụ nào theo Điều 44 Hiến pháp 2013?","options":["A. Nghĩa vụ tuân theo pháp luật về giao thông","B. Nghĩa vụ nộp thuế","C. Nghĩa vụ bảo vệ môi trường","D. Nghĩa vụ trung thành với Tổ quốc"],"answer":"D","explain":"Điều 44: Công dân có nghĩa vụ trung thành với Tổ quốc. Phản bội Tổ quốc là tội nặng nhất. Cung cấp bí mật nhà nước cho thế lực thù địch là hành vi phản bội Tổ quốc.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định: Bảo vệ Tổ quốc chỉ là nghĩa vụ của lực lượng vũ trang, công dân bình thường không liên quan. Nhận định này","options":["A. sai, vì Điều 45 khẳng định bảo vệ Tổ quốc là nghĩa vụ thiêng liêng và quyền cao quý của mọi công dân","B. sai, vì bảo vệ Tổ quốc là quyền chứ không phải nghĩa vụ","C. đúng, vì công dân chỉ cần lo làm ăn kinh tế","D. đúng, vì Hiến pháp không quy định nghĩa vụ này với công dân"],"answer":"A","explain":"Khoản 1 Điều 45: Bảo vệ Tổ quốc là nghĩa vụ thiêng liêng và quyền cao quý của công dân. Mọi công dân đều có nghĩa vụ tham gia bảo vệ Tổ quốc theo khả năng và quy định của pháp luật.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau về nghĩa vụ của công dân:","statements":["a) Công dân có nghĩa vụ tuân theo Hiến pháp và pháp luật","b) Công dân phải tham gia bảo vệ an ninh quốc gia, trật tự, an toàn xã hội","c) Công dân phải chấp hành những quy tắc sinh hoạt công cộng","d) Các nghĩa vụ trên được quy định tại Điều 46 Hiến pháp 2013"],"answer":["T","T","T","T"],"explain":"Cả bốn nhận định đều đúng theo Điều 46: Công dân có nghĩa vụ tuân theo Hiến pháp và pháp luật; tham gia bảo vệ an ninh quốc gia, trật tự, an toàn xã hội và chấp hành những quy tắc sinh hoạt công cộng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau về nghĩa vụ nộp thuế:","statements":["a) Mọi người có nghĩa vụ nộp thuế theo luật định","b) Trốn thuế là hành vi vi phạm pháp luật","c) Nghĩa vụ nộp thuế được quy định tại Điều 47 Hiến pháp 2013","d) Chỉ doanh nghiệp mới phải nộp thuế, cá nhân không phải nộp"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 47. d sai: mọi người, bao gồm cá nhân có thu nhập đến mức chịu thuế, đều có nghĩa vụ nộp thuế theo luật định.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Theo khoản 2 Điều 14, quyền con người, quyền công dân chỉ có thể bị hạn chế theo quy định của ... trong trường hợp cần thiết.","answer":"luật","explain":"Khoản 2 Điều 14: Quyền con người, quyền công dân chỉ có thể bị hạn chế theo quy định của luật trong trường hợp cần thiết.","points":0.5},{"type":"short","level":"VDC","q":"Theo khoản 2 Điều 20 Hiến pháp 2013, không ai bị bắt nếu không có quyết định của Tòa án nhân dân, quyết định hoặc phê chuẩn của Viện kiểm sát nhân dân, trừ trường hợp nào? (Trả lời ngắn gọn)","answer":"Phạm tội quả tang","explain":"Khoản 2 Điều 20: Không ai bị bắt nếu không có quyết định của Tòa án nhân dân, quyết định hoặc phê chuẩn của Viện kiểm sát nhân dân, trừ trường hợp phạm tội quả tang.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Theo Điều 25 Hiến pháp 2013, quyền nào sau đây KHÔNG được liệt kê?","options":["A. Quyền tự do báo chí","B. Quyền tự do kinh doanh không cần đăng ký","C. Quyền hội họp, lập hội, biểu tình","D. Quyền tự do ngôn luận"],"answer":"B","explain":"Điều 25 liệt kê: tự do ngôn luận, tự do báo chí, tiếp cận thông tin, hội họp, lập hội, biểu tình. Tự do kinh doanh không cần đăng ký không có trong Điều 25.","points":0.25},{"type":"mcq","level":"NB","q":"Theo Điều 27 Hiến pháp 2013, công dân đủ bao nhiêu tuổi trở lên thì có quyền ứng cử vào Quốc hội, Hội đồng nhân dân?","options":["A. Đủ 18 tuổi trở lên","B. Đủ 21 tuổi trở lên","C. Đủ 25 tuổi trở lên","D. Đủ 30 tuổi trở lên"],"answer":"B","explain":"Điều 27: Công dân đủ hai mươi mốt tuổi trở lên có quyền ứng cử vào Quốc hội, Hội đồng nhân dân.","points":0.25},{"type":"mcq","level":"TH","q":"Câu Phản bội Tổ quốc là tội nặng nhất (Điều 44 Hiến pháp 2013) thể hiện","options":["A. tội phản bội Tổ quốc chỉ bị phạt hành chính","B. mọi tội phạm đều có mức án như nhau","C. mức độ nghiêm trọng đặc biệt của hành vi phản bội Tổ quốc, bị xử lý nghiêm khắc nhất","D. công dân được phép phản bội Tổ quốc trong một số trường hợp"],"answer":"C","explain":"Điều 44 khẳng định nghĩa vụ trung thành với Tổ quốc và xác định phản bội Tổ quốc là tội nặng nhất, thể hiện sự nghiêm trị của pháp luật đối với hành vi này.","points":0.25},{"type":"mcq","level":"TH","q":"Theo Điều 45 Hiến pháp 2013, công dân phải thực hiện nghĩa vụ nào sau đây?","options":["A. Không cần tham gia bảo vệ Tổ quốc","B. Thực hiện nghĩa vụ quân sự và tham gia xây dựng nền quốc phòng toàn dân","C. Chỉ cần nộp thuế là đủ","D. Tự ý rời khỏi đất nước khi có chiến tranh"],"answer":"B","explain":"Khoản 2 Điều 45: Công dân phải thực hiện nghĩa vụ quân sự và tham gia xây dựng nền quốc phòng toàn dân.","points":0.25},{"type":"mcq","level":"VD","q":"Anh T thường xuyên vượt đèn đỏ, lạng lách trên đường phố. Hành vi của anh T vi phạm nghĩa vụ nào theo Điều 46?","options":["A. Chấp hành những quy tắc sinh hoạt công cộng và tuân theo pháp luật","B. Nghĩa vụ quân sự","C. Nghĩa vụ trung thành với Tổ quốc","D. Nghĩa vụ nộp thuế"],"answer":"A","explain":"Điều 46: công dân có nghĩa vụ tuân theo Hiến pháp và pháp luật và chấp hành những quy tắc sinh hoạt công cộng. Vi phạm luật giao thông là vi phạm nghĩa vụ này.","points":0.25},{"type":"mcq","level":"VDC","q":"Có ý kiến: Nộp thuế là tự nguyện, ai muốn nộp thì nộp. Ý kiến này","options":["A. sai, vì chỉ người giàu mới phải nộp thuế","B. đúng, vì thuế là khoản đóng góp từ thiện","C. đúng, vì Nhà nước không cần nguồn thu từ thuế","D. sai, vì Điều 47 quy định mọi người có nghĩa vụ nộp thuế theo luật định"],"answer":"D","explain":"Điều 47: Mọi người có nghĩa vụ nộp thuế theo luật định. Nộp thuế là nghĩa vụ pháp lý bắt buộc, không phải việc tự nguyện; thuế là nguồn thu chủ yếu của ngân sách nhà nước.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Các quyền con người, quyền công dân được công nhận, tôn trọng, bảo vệ, bảo đảm theo Hiến pháp và pháp luật","b) Quyền con người, quyền công dân không bao giờ bị hạn chế trong mọi trường hợp","c) Việc hạn chế quyền chỉ được thực hiện theo quy định của luật trong trường hợp cần thiết","d) Nội dung trên được quy định tại Điều 14 Hiến pháp 2013"],"answer":["T","F","T","T"],"explain":"a, c, d đúng theo Điều 14. b sai: khoản 2 Điều 14 cho phép hạn chế quyền theo quy định của luật trong trường hợp cần thiết (quốc phòng, an ninh quốc gia, trật tự an toàn xã hội, đạo đức xã hội, sức khỏe cộng đồng).","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Mọi người có quyền bất khả xâm phạm về thân thể","b) Không ai bị tra tấn, bạo lực, truy bức, nhục hình","c) Công an được phép bắt giữ bất kì ai mà không cần quyết định của cơ quan có thẩm quyền","d) Việc bắt, giam, giữ người do luật định"],"answer":["T","T","F","T"],"explain":"a, b, d đúng theo Điều 20. c sai: khoản 2 Điều 20 quy định không ai bị bắt nếu không có quyết định của Tòa án, quyết định hoặc phê chuẩn của Viện kiểm sát, trừ trường hợp phạm tội quả tang.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Theo Điều 25, công dân có quyền tự do ngôn luận, tự do báo chí, tiếp cận thông tin, hội họp, lập hội, ...","answer":"biểu tình","explain":"Điều 25: Công dân có quyền tự do ngôn luận, tự do báo chí, tiếp cận thông tin, hội họp, lập hội, biểu tình.","points":0.5},{"type":"short","level":"VDC","q":"Theo Điều 27 Hiến pháp 2013, công dân đủ 18 tuổi trở lên có quyền bầu cử; vậy muốn ứng cử vào Hội đồng nhân dân thì phải đủ bao nhiêu tuổi trở lên? (Chỉ ghi số)","answer":"21","explain":"Điều 27: Công dân đủ hai mươi mốt tuổi trở lên có quyền ứng cử vào Quốc hội, Hội đồng nhân dân.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Theo Điều 44 Hiến pháp 2013, công dân có nghĩa vụ","options":["A. không cần bảo vệ Tổ quốc","B. trung thành với Tổ quốc","C. từ bỏ quốc tịch Việt Nam","D. phản bội Tổ quốc khi có lợi"],"answer":"B","explain":"Điều 44: Công dân có nghĩa vụ trung thành với Tổ quốc. Phản bội Tổ quốc là tội nặng nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Theo khoản 1 Điều 45 Hiến pháp 2013, bảo vệ Tổ quốc là","options":["A. việc riêng của quân đội, không liên quan đến công dân","B. nghĩa vụ thiêng liêng và quyền cao quý của công dân","C. quyền lợi chỉ dành cho cán bộ nhà nước","D. nghĩa vụ nặng nề mà công dân nên trốn tránh"],"answer":"B","explain":"Khoản 1 Điều 45: Bảo vệ Tổ quốc là nghĩa vụ thiêng liêng và quyền cao quý của công dân.","points":0.25},{"type":"mcq","level":"TH","q":"Hành vi nào sau đây thể hiện công dân thực hiện tốt nghĩa vụ theo Điều 46?","options":["A. Chấp hành luật giao thông, giữ gìn trật tự nơi công cộng","B. Xả rác bừa bãi nơi công cộng","C. Tàng trữ pháo nổ trái phép","D. Gây rối trật tự tại khu dân cư"],"answer":"A","explain":"Điều 46 yêu cầu công dân tuân theo Hiến pháp, pháp luật và chấp hành quy tắc sinh hoạt công cộng. Chấp hành luật giao thông, giữ gìn trật tự là biểu hiện đúng; các hành vi còn lại đều vi phạm.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao công dân phải nộp thuế theo luật định?","options":["A. Vì thuế chỉ dùng để trả lương cho người nộp thuế","B. Vì thuế là nguồn thu chủ yếu của ngân sách nhà nước, dùng để chi cho các công việc chung của đất nước","C. Vì không nộp thuế sẽ được khen thưởng","D. Vì nộp thuế giúp cá nhân giàu lên nhanh chóng"],"answer":"B","explain":"Điều 47 quy định nghĩa vụ nộp thuế. Thuế là nguồn thu chủ yếu, ổn định của ngân sách nhà nước để chi cho quốc phòng, an ninh, giáo dục, y tế, xây dựng cơ sở hạ tầng và các công việc chung khác.","points":0.25},{"type":"mcq","level":"VD","q":"Trong thời gian có dịch bệnh nguy hiểm, Nhà nước yêu cầu người dân hạn chế tụ tập đông người. Việc hạn chế quyền hội họp trong trường hợp này phù hợp với quy định nào?","options":["A. Người dân có quyền từ chối mọi yêu cầu của Nhà nước","B. Khoản 2 Điều 14: quyền công dân có thể bị hạn chế theo luật trong trường hợp cần thiết vì sức khỏe của cộng đồng","C. Nhà nước được tùy ý hạn chế mọi quyền của công dân","D. Quyền hội họp không bao giờ được phép hạn chế"],"answer":"B","explain":"Khoản 2 Điều 14 cho phép hạn chế quyền theo quy định của luật trong trường hợp cần thiết, trong đó có sức khỏe của cộng đồng. Hạn chế tụ tập để phòng chống dịch là áp dụng đúng quy định này.","points":0.25},{"type":"mcq","level":"VDC","q":"Anh P bị một nhóm người bắt giữ trái phép và đánh đập để đòi nợ. Hành vi của nhóm người này vi phạm quyền nào theo Điều 20?","options":["A. Quyền bất khả xâm phạm về thân thể; đồng thời việc bắt giữ trái phép vi phạm khoản 2 Điều 20","B. Quyền bầu cử, ứng cử","C. Không vi phạm quyền nào vì anh P nợ tiền","D. Quyền tự do ngôn luận"],"answer":"A","explain":"Khoản 1 Điều 20: mọi người có quyền bất khả xâm phạm về thân thể, không bị bạo lực; khoản 2: không ai bị bắt nếu không có quyết định của Tòa án, quyết định hoặc phê chuẩn của Viện kiểm sát, trừ phạm tội quả tang. Việc đòi nợ không cho phép bất kì ai xâm phạm thân thể hay bắt giữ người khác trái pháp luật.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Công dân có quyền tự do ngôn luận","b) Công dân có quyền tự do báo chí","c) Công dân có quyền tiếp cận thông tin","d) Việc thực hiện các quyền trên do pháp luật quy định"],"answer":["T","T","T","T"],"explain":"Cả bốn nhận định đều đúng theo Điều 25 Hiến pháp 2013.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Công dân đủ 18 tuổi trở lên có quyền bầu cử","b) Công dân đủ 21 tuổi trở lên có quyền ứng cử","c) Người 17 tuổi có quyền bầu cử đại biểu Quốc hội","d) Việc thực hiện quyền bầu cử, ứng cử do luật định"],"answer":["T","T","F","T"],"explain":"a, b, d đúng theo Điều 27. c sai: phải đủ 18 tuổi trở lên mới có quyền bầu cử.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Theo Điều 44 Hiến pháp 2013, công dân có nghĩa vụ ... với Tổ quốc.","answer":"trung thành","explain":"Điều 44: Công dân có nghĩa vụ trung thành với Tổ quốc.","points":0.5},{"type":"short","level":"VDC","q":"Điền cụm từ còn thiếu theo khoản 2 Điều 45: Công dân phải thực hiện nghĩa vụ quân sự và tham gia xây dựng nền ...","answer":"quốc phòng toàn dân","explain":"Khoản 2 Điều 45: Công dân phải thực hiện nghĩa vụ quân sự và tham gia xây dựng nền quốc phòng toàn dân.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Theo Điều 46 Hiến pháp 2013, công dân có nghĩa vụ nào sau đây?","options":["A. Được phép vi phạm pháp luật khi có lý do","B. Chỉ tuân theo pháp luật khi có người giám sát","C. Không cần tuân theo pháp luật","D. Tuân theo Hiến pháp và pháp luật"],"answer":"D","explain":"Điều 46: Công dân có nghĩa vụ tuân theo Hiến pháp và pháp luật.","points":0.25},{"type":"mcq","level":"NB","q":"Theo Điều 47 Hiến pháp 2013, ai có nghĩa vụ nộp thuế theo luật định?","options":["A. Chỉ doanh nghiệp nhà nước","B. Chỉ cán bộ, công chức","C. Chỉ người nước ngoài","D. Mọi người"],"answer":"D","explain":"Điều 47: Mọi người có nghĩa vụ nộp thuế theo luật định.","points":0.25},{"type":"mcq","level":"TH","q":"Theo khoản 2 Điều 14, quyền con người, quyền công dân có thể bị hạn chế trong trường hợp cần thiết vì các lý do nào?","options":["A. Quốc phòng, an ninh quốc gia, trật tự an toàn xã hội, đạo đức xã hội, sức khỏe cộng đồng","B. Không có trường hợp nào được phép hạn chế","C. Lợi ích riêng của một nhóm người","D. Sở thích của người đứng đầu cơ quan nhà nước"],"answer":"A","explain":"Khoản 2 Điều 14 liệt kê đầy đủ: trong trường hợp cần thiết vì lý do quốc phòng, an ninh quốc gia, trật tự, an toàn xã hội, đạo đức xã hội, sức khỏe của cộng đồng.","points":0.25},{"type":"mcq","level":"TH","q":"Theo khoản 2 Điều 20, việc bắt người phải tuân theo quy định nào?","options":["A. Phải có quyết định của Tòa án nhân dân, quyết định hoặc phê chuẩn của Viện kiểm sát nhân dân, trừ trường hợp phạm tội quả tang","B. Không cần bất kì quyết định nào","C. Ai cũng có quyền bắt người khi nghi ngờ","D. Chỉ cần quyết định của trưởng thôn là đủ"],"answer":"A","explain":"Khoản 2 Điều 20: Không ai bị bắt nếu không có quyết định của Tòa án nhân dân, quyết định hoặc phê chuẩn của Viện kiểm sát nhân dân, trừ trường hợp phạm tội quả tang. Việc bắt, giam, giữ người do luật định.","points":0.25},{"type":"mcq","level":"VD","q":"Chị Q viết bài đăng trên mạng xã hội bịa đặt, vu khống lãnh đạo địa phương tham nhũng. Hành vi của chị Q","options":["A. là thực hiện đúng quyền tự do ngôn luận theo Điều 25","B. là lạm dụng quyền tự do ngôn luận, vi phạm pháp luật và xâm phạm quyền của người khác","C. được pháp luật bảo vệ tuyệt đối","D. không vi phạm gì vì mạng xã hội là không gian tự do tuyệt đối"],"answer":"B","explain":"Điều 25 ghi nhận quyền tự do ngôn luận nhưng việc thực hiện các quyền này do pháp luật quy định. Bịa đặt, vu khống là hành vi vi phạm pháp luật, xâm phạm danh dự, nhân phẩm của người khác, không được coi là thực hiện quyền tự do ngôn luận.","points":0.25},{"type":"mcq","level":"VDC","q":"Bạn An sinh ngày 20/5/2007. Cuộc bầu cử đại biểu Quốc hội diễn ra ngày 15/3/2026. Theo Điều 27, bạn An","options":["A. không có quyền bầu cử nhưng có quyền ứng cử","B. chưa có quyền bầu cử vì chưa đủ 18 tuổi","C. có cả quyền bầu cử và quyền ứng cử","D. có quyền bầu cử vì đã đủ 18 tuổi"],"answer":"D","explain":"Bạn An sinh 20/5/2007, đến ngày bầu cử 15/3/2026 đã 18 tuổi 10 tháng nên đủ 18 tuổi trở lên, có quyền bầu cử theo Điều 27; nhưng chưa đủ 21 tuổi nên chưa có quyền ứng cử.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Công dân có nghĩa vụ trung thành với Tổ quốc","b) Phản bội Tổ quốc là tội nặng nhất","c) Nội dung trên được quy định tại Điều 44 Hiến pháp 2013","d) Công dân được phép phản bội Tổ quốc trong trường hợp đặc biệt"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 44. d sai: không có trường hợp nào cho phép phản bội Tổ quốc.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Bảo vệ Tổ quốc là nghĩa vụ thiêng liêng của công dân","b) Bảo vệ Tổ quốc cũng là quyền cao quý của công dân","c) Công dân phải thực hiện nghĩa vụ quân sự theo luật định","d) Nghĩa vụ bảo vệ Tổ quốc chỉ áp dụng với nam giới"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 45. d sai: Điều 45 quy định nghĩa vụ bảo vệ Tổ quốc là của công dân nói chung, không phân biệt nam nữ.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Theo Điều 46, công dân có nghĩa vụ tuân theo ... và pháp luật.","answer":"Hiến pháp","explain":"Điều 46: Công dân có nghĩa vụ tuân theo Hiến pháp và pháp luật.","points":0.5},{"type":"short","level":"VDC","q":"Điền cụm từ còn thiếu theo Điều 47 Hiến pháp 2013: Mọi người có nghĩa vụ nộp thuế theo ...","answer":"luật định","explain":"Điều 47: Mọi người có nghĩa vụ nộp thuế theo luật định.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Theo khoản 1 Điều 20 Hiến pháp 2013, mọi người được pháp luật bảo hộ về","options":["A. quyền xâm phạm người khác","B. sức khỏe, danh dự và nhân phẩm","C. quyền tự ý xử phạt người khác","D. quyền trốn tránh pháp luật"],"answer":"B","explain":"Khoản 1 Điều 20: Mọi người được pháp luật bảo hộ về sức khoẻ, danh dự và nhân phẩm.","points":0.25},{"type":"mcq","level":"NB","q":"Chương II Hiến pháp 2013 gồm các điều từ","options":["A. Điều 14 đến Điều 49","B. Điều 1 đến Điều 13","C. Điều 50 đến Điều 60","D. Điều 69 đến Điều 83"],"answer":"A","explain":"Chương II (Quyền con người, quyền và nghĩa vụ cơ bản của công dân) gồm các điều từ Điều 14 đến Điều 49.","points":0.25},{"type":"mcq","level":"TH","q":"Việc thực hiện quyền tự do ngôn luận, báo chí, hội họp, biểu tình theo Điều 25 phải","options":["A. chỉ cần đa số đồng ý là được","B. không chịu bất kì giới hạn nào","C. tuân theo quy định của pháp luật","D. tùy ý cá nhân, không cần tuân theo pháp luật"],"answer":"C","explain":"Điều 25: Việc thực hiện các quyền này do pháp luật quy định. Quyền tự do không phải là tự do tuyệt đối; việc thực hiện quyền không được xâm phạm lợi ích quốc gia, quyền và lợi ích hợp pháp của người khác.","points":0.25},{"type":"mcq","level":"TH","q":"Hành vi nào sau đây thể hiện lòng trung thành với Tổ quốc?","options":["A. Cung cấp thông tin mật cho thế lực thù địch","B. Tuyên truyền chống phá Nhà nước","C. Tích cực học tập, lao động, sẵn sàng bảo vệ Tổ quốc khi cần thiết","D. Trốn tránh nghĩa vụ quân sự"],"answer":"C","explain":"Điều 44 quy định nghĩa vụ trung thành với Tổ quốc. Tích cực học tập, lao động xây dựng và sẵn sàng bảo vệ Tổ quốc là biểu hiện của lòng trung thành; các hành vi còn lại đều vi phạm.","points":0.25},{"type":"mcq","level":"VD","q":"Anh S đủ 18 tuổi, có đủ tiêu chuẩn sức khỏe nhưng tìm cách trốn tránh nghĩa vụ quân sự. Hành vi của anh S vi phạm","options":["A. khoản 2 Điều 45 Hiến pháp 2013","B. quyền tự do cá nhân của công dân","C. không vi phạm gì vì đó là quyền lựa chọn","D. chỉ vi phạm nội quy địa phương"],"answer":"A","explain":"Khoản 2 Điều 45: Công dân phải thực hiện nghĩa vụ quân sự. Trốn tránh nghĩa vụ quân sự là vi phạm Hiến pháp và bị xử lý theo Luật Nghĩa vụ quân sự.","points":0.25},{"type":"mcq","level":"VDC","q":"Chị H năm nay 22 tuổi, muốn ứng cử đại biểu Hội đồng nhân dân xã. Theo Điều 27, chị H","options":["A. chỉ được bầu cử chứ không được ứng cử","B. đủ điều kiện về độ tuổi để ứng cử","C. chưa đủ tuổi ứng cử","D. phải chờ đến 25 tuổi mới được ứng cử"],"answer":"B","explain":"Điều 27: công dân đủ hai mươi mốt tuổi trở lên có quyền ứng cử vào Quốc hội, Hội đồng nhân dân. Chị H 22 tuổi nên đủ điều kiện về độ tuổi; việc ứng cử còn phải đáp ứng các tiêu chuẩn khác do luật định.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Tuổi bầu cử và tuổi ứng cử được quy định tại Điều 27 Hiến pháp 2013","b) Độ tuổi bầu cử thấp hơn độ tuổi ứng cử","c) Mọi công dân Việt Nam không phân biệt độ tuổi đều có quyền ứng cử","d) Công dân đủ 21 tuổi trở lên có quyền ứng cử"],"answer":["T","T","F","T"],"explain":"a, b, d đúng theo Điều 27 (18 tuổi bầu cử, 21 tuổi ứng cử). c sai: phải đủ 21 tuổi trở lên mới có quyền ứng cử.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Quyền con người là những quyền tự nhiên, vốn có của mỗi người","b) Quyền công dân gắn với quốc tịch của một quốc gia","c) Ở Việt Nam, quyền con người, quyền công dân được Hiến pháp và pháp luật công nhận, tôn trọng, bảo vệ, bảo đảm","d) Quyền con người và quyền công dân là hai khái niệm hoàn toàn giống nhau"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo khoản 1 Điều 14 và kiến thức cơ bản. d sai: quyền con người là quyền của mọi người; quyền công dân gắn với công dân của một quốc gia cụ thể. Hai khái niệm có nội hàm khác nhau.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Theo khoản 1 Điều 20, mọi người có quyền bất khả xâm phạm về ...","answer":"thân thể","explain":"Khoản 1 Điều 20: Mọi người có quyền bất khả xâm phạm về thân thể.","points":0.5},{"type":"short","level":"VDC","q":"Điền cụm từ còn thiếu theo Điều 25: Việc thực hiện các quyền tự do ngôn luận, báo chí, hội họp, biểu tình do ... quy định.","answer":"pháp luật","explain":"Điều 25: Việc thực hiện các quyền này do pháp luật quy định.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Theo Điều 27 Hiến pháp 2013, công dân có quyền bầu cử vào Quốc hội, Hội đồng nhân dân khi","options":["A. đủ 21 tuổi trở lên","B. đủ 18 tuổi trở lên","C. không cần đủ tuổi","D. đủ 16 tuổi trở lên"],"answer":"B","explain":"Điều 27: Công dân đủ mười tám tuổi trở lên có quyền bầu cử.","points":0.25},{"type":"mcq","level":"NB","q":"Tội nặng nhất theo Điều 44 Hiến pháp 2013 là tội","options":["A. gây rối trật tự công cộng","B. phản bội Tổ quốc","C. trốn thuế","D. trộm cắp tài sản"],"answer":"B","explain":"Điều 44: Phản bội Tổ quốc là tội nặng nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào sau đây KHÔNG thuộc Điều 45 Hiến pháp 2013?","options":["A. Công dân phải thực hiện nghĩa vụ quân sự","B. Bảo vệ Tổ quốc là quyền cao quý của công dân","C. Bảo vệ Tổ quốc là nghĩa vụ thiêng liêng của công dân","D. Công dân có nghĩa vụ nộp thuế theo luật định"],"answer":"D","explain":"Nghĩa vụ nộp thuế được quy định tại Điều 47. Điều 45 quy định về nghĩa vụ bảo vệ Tổ quốc và nghĩa vụ quân sự.","points":0.25},{"type":"mcq","level":"TH","q":"Tham gia bảo vệ an ninh quốc gia, trật tự, an toàn xã hội là nghĩa vụ được quy định tại","options":["A. Điều 44 Hiến pháp 2013","B. Điều 14 Hiến pháp 2013","C. Điều 47 Hiến pháp 2013","D. Điều 46 Hiến pháp 2013"],"answer":"D","explain":"Điều 46: Công dân có nghĩa vụ tuân theo Hiến pháp và pháp luật; tham gia bảo vệ an ninh quốc gia, trật tự, an toàn xã hội và chấp hành những quy tắc sinh hoạt công cộng.","points":0.25},{"type":"mcq","level":"VD","q":"Gia đình ông V có cửa hàng kinh doanh nhưng nhiều năm không kê khai, nộp thuế. Hành vi này vi phạm","options":["A. quyền tự do kinh doanh của công dân","B. chỉ vi phạm đạo đức kinh doanh","C. không vi phạm gì vì kinh doanh nhỏ","D. Điều 47 Hiến pháp 2013 về nghĩa vụ nộp thuế"],"answer":"D","explain":"Điều 47: Mọi người có nghĩa vụ nộp thuế theo luật định. Không kê khai, nộp thuế là hành vi trốn thuế, vi phạm pháp luật.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong tình trạng khẩn cấp về an ninh quốc gia, cơ quan có thẩm quyền tạm thời hạn chế quyền đi lại của công dân ở một khu vực theo đúng trình tự luật định. Việc này","options":["A. phù hợp với khoản 2 Điều 14 vì lý do an ninh quốc gia","B. là hành vi tùy tiện của cơ quan nhà nước","C. vi phạm Hiến pháp vì quyền công dân là tuyệt đối","D. chỉ được thực hiện khi có chiến tranh"],"answer":"A","explain":"Khoản 2 Điều 14 cho phép hạn chế quyền theo quy định của luật trong trường hợp cần thiết vì lý do quốc phòng, an ninh quốc gia. Việc hạn chế đúng trình tự luật định trong tình trạng khẩn cấp là phù hợp Hiến pháp.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Điều 44 thuộc Chương II Hiến pháp 2013","b) Điều 44 quy định nghĩa vụ trung thành với Tổ quốc","c) Phản bội Tổ quốc là tội nặng nhất","d) Điều 44 quy định về nghĩa vụ nộp thuế"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 44. d sai: nghĩa vụ nộp thuế được quy định tại Điều 47.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Tự do ngôn luận là quyền của công dân theo Điều 25","b) Lợi dụng tự do ngôn luận để vu khống người khác là vi phạm pháp luật","c) Mọi thông tin đều được phép đăng tải tự do, không có giới hạn","d) Nhà nước bảo đảm để công dân thực hiện quyền tiếp cận thông tin theo pháp luật"],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai: việc thực hiện các quyền tự do theo Điều 25 do pháp luật quy định; thông tin bịa đặt, xâm phạm an ninh quốc gia, thuần phong mỹ tục đều bị cấm.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Công dân đủ mười tám tuổi trở lên có quyền ... vào Quốc hội, Hội đồng nhân dân.","answer":"bầu cử","explain":"Điều 27: Công dân đủ mười tám tuổi trở lên có quyền bầu cử.","points":0.5},{"type":"short","level":"VDC","q":"Điều 44 Hiến pháp 2013 thuộc chương nào? (Trả lời ngắn gọn)","answer":"Chương II","explain":"Điều 44 thuộc Chương II Hiến pháp 2013 về quyền con người, quyền và nghĩa vụ cơ bản của công dân.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Theo khoản 1 Điều 14 Hiến pháp 2013, các quyền con người, quyền công dân được","options":["A. do các tổ chức nước ngoài quyết định","B. tùy ý công nhận hoặc không","C. công nhận, tôn trọng, bảo vệ, bảo đảm theo Hiến pháp và pháp luật","D. chỉ ghi nhận trên giấy mà không bảo đảm thực hiện"],"answer":"C","explain":"Khoản 1 Điều 14: các quyền con người, quyền công dân về chính trị, dân sự, kinh tế, văn hóa, xã hội được công nhận, tôn trọng, bảo vệ, bảo đảm theo Hiến pháp và pháp luật.","points":0.25},{"type":"mcq","level":"NB","q":"Chấp hành những quy tắc sinh hoạt công cộng là nghĩa vụ được quy định tại điều nào?","options":["A. Điều 45","B. Điều 44","C. Điều 46","D. Điều 27"],"answer":"C","explain":"Điều 46: Công dân chấp hành những quy tắc sinh hoạt công cộng.","points":0.25},{"type":"mcq","level":"TH","q":"Hành vi tra tấn, truy bức, nhục hình người khác bị nghiêm cấm tại","options":["A. khoản 1 Điều 20 Hiến pháp 2013","B. Điều 44 Hiến pháp 2013","C. Điều 25 Hiến pháp 2013","D. không có điều luật nào cấm"],"answer":"A","explain":"Khoản 1 Điều 20: Mọi người không bị tra tấn, bạo lực, truy bức, nhục hình hay bất kỳ hình thức đối xử nào khác xâm phạm thân thể, sức khỏe, xúc phạm danh dự, nhân phẩm.","points":0.25},{"type":"mcq","level":"TH","q":"Thuế có vai trò gì đối với Nhà nước?","options":["A. Là khoản tiền phạt đối với công dân","B. Không có vai trò gì","C. Chỉ dùng để chi cho cá nhân người nộp thuế","D. Là nguồn thu chủ yếu của ngân sách nhà nước để thực hiện các chức năng, nhiệm vụ chung"],"answer":"D","explain":"Thuế là nguồn thu chủ yếu, ổn định của ngân sách nhà nước, là cơ sở vật chất để Nhà nước thực hiện chức năng quản lý, bảo đảm quốc phòng, an ninh, phúc lợi xã hội. Vì vậy Điều 47 quy định nghĩa vụ nộp thuế.","points":0.25},{"type":"mcq","level":"VD","q":"Nhóm bạn trẻ tổ chức buổi thảo luận công khai về vấn đề bảo vệ môi trường tại địa phương và mời mọi người tham gia. Đây là thực hiện quyền nào theo Điều 25?","options":["A. Quyền ứng cử","B. Quyền hội họp và tự do ngôn luận","C. Quyền bầu cử","D. Quyền khiếu nại, tố cáo"],"answer":"B","explain":"Tổ chức thảo luận công khai, mọi người tham gia bày tỏ ý kiến là thực hiện quyền hội họp và quyền tự do ngôn luận theo Điều 25.","points":0.25},{"type":"mcq","level":"VDC","q":"Anh T 19 tuổi, chị L 23 tuổi, cùng muốn tham gia cuộc bầu cử đại biểu Hội đồng nhân dân xã sắp tới. Theo Điều 27","options":["A. chị L chỉ có quyền bầu cử","B. cả hai đều có quyền bầu cử, nhưng chỉ chị L có quyền ứng cử","C. anh T không có quyền nào","D. cả hai đều có cả quyền bầu cử và ứng cử"],"answer":"B","explain":"Điều 27: đủ 18 tuổi trở lên có quyền bầu cử; đủ 21 tuổi trở lên có quyền ứng cử. Anh T 19 tuổi có quyền bầu cử, chưa có quyền ứng cử. Chị L 23 tuổi có cả hai quyền.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Bảo vệ Tổ quốc là nghĩa vụ thiêng liêng của công dân","b) Bảo vệ Tổ quốc là quyền cao quý của công dân","c) Nội dung trên được quy định tại khoản 1 Điều 45","d) Bảo vệ Tổ quốc chỉ là nghĩa vụ, không phải là quyền"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo khoản 1 Điều 45. d sai: Điều 45 khẳng định bảo vệ Tổ quốc vừa là nghĩa vụ thiêng liêng, vừa là quyền cao quý của công dân.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Bắt người phạm tội quả tang không cần quyết định của Tòa án","b) Mọi trường hợp bắt người đều phải có quyết định của Tòa án mà không có ngoại lệ","c) Việc bắt, giam, giữ người do luật định","d) Không ai bị tra tấn, truy bức, nhục hình"],"answer":["T","F","T","T"],"explain":"a, c, d đúng theo Điều 20. b sai: khoản 2 Điều 20 quy định ngoại lệ trừ trường hợp phạm tội quả tang.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Theo khoản 1 Điều 45, bảo vệ Tổ quốc là nghĩa vụ ... và quyền cao quý của công dân.","answer":"thiêng liêng","explain":"Khoản 1 Điều 45: Bảo vệ Tổ quốc là nghĩa vụ thiêng liêng và quyền cao quý của công dân.","points":0.5},{"type":"short","level":"VDC","q":"Điền cụm từ còn thiếu theo Điều 46: Công dân tham gia bảo vệ an ninh quốc gia, trật tự, an toàn xã hội và chấp hành những ...","answer":"quy tắc sinh hoạt công cộng","explain":"Điều 46: Công dân tham gia bảo vệ an ninh quốc gia, trật tự, an toàn xã hội và chấp hành những quy tắc sinh hoạt công cộng.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Theo khoản 2 Điều 45, công dân phải","options":["A. trốn tránh nghĩa vụ quân sự","B. chỉ lo làm kinh tế, không quan tâm đến quốc phòng","C. ra nước ngoài sinh sống để tránh nghĩa vụ","D. thực hiện nghĩa vụ quân sự và tham gia xây dựng nền quốc phòng toàn dân"],"answer":"D","explain":"Khoản 2 Điều 45: Công dân phải thực hiện nghĩa vụ quân sự và tham gia xây dựng nền quốc phòng toàn dân.","points":0.25},{"type":"mcq","level":"NB","q":"Quyền biểu tình của công dân được quy định tại điều nào của Hiến pháp 2013?","options":["A. Điều 47","B. Điều 20","C. Điều 25","D. Điều 44"],"answer":"C","explain":"Điều 25: Công dân có quyền tự do ngôn luận, tự do báo chí, tiếp cận thông tin, hội họp, lập hội, biểu tình.","points":0.25},{"type":"mcq","level":"TH","q":"Việc thực hiện quyền bầu cử, ứng cử của công dân","options":["A. không cần điều kiện gì","B. tùy ý mỗi người, không cần luật","C. do luật định","D. do tổ chức xã hội quyết định"],"answer":"C","explain":"Điều 27: Việc thực hiện các quyền này do luật định. Luật Bầu cử đại biểu Quốc hội và đại biểu Hội đồng nhân dân quy định cụ thể điều kiện, trình tự, thủ tục.","points":0.25},{"type":"mcq","level":"TH","q":"Pháp luật bảo hộ mọi người về sức khỏe, danh dự và nhân phẩm được quy định tại","options":["A. khoản 1 Điều 20","B. Điều 47","C. Điều 44","D. Điều 25"],"answer":"A","explain":"Khoản 1 Điều 20: Mọi người được pháp luật bảo hộ về sức khoẻ, danh dự và nhân phẩm.","points":0.25},{"type":"mcq","level":"VD","q":"Trong giờ học Giáo dục quốc phòng, thầy giáo yêu cầu học sinh tìm hiểu về nghĩa vụ trung thành với Tổ quốc. Học sinh cần căn cứ vào điều nào của Hiến pháp?","options":["A. Điều 44","B. Điều 25","C. Điều 47","D. Điều 20"],"answer":"A","explain":"Điều 44 quy định: Công dân có nghĩa vụ trung thành với Tổ quốc. Phản bội Tổ quốc là tội nặng nhất.","points":0.25},{"type":"mcq","level":"VDC","q":"Khu phố tổ chức phong trào Toàn dân bảo vệ an ninh Tổ quốc, vận động người dân tố giác tội phạm. Phong trào này thể hiện nghĩa vụ nào của công dân theo Điều 46?","options":["A. Tham gia bảo vệ an ninh quốc gia, trật tự, an toàn xã hội","B. Nghĩa vụ trung thành với Tổ quốc","C. Nghĩa vụ quân sự","D. Nghĩa vụ nộp thuế"],"answer":"A","explain":"Điều 46: công dân có nghĩa vụ tham gia bảo vệ an ninh quốc gia, trật tự, an toàn xã hội. Tố giác tội phạm, tham gia phong trào toàn dân bảo vệ an ninh Tổ quốc chính là thực hiện nghĩa vụ này.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Điều 14 là điều mở đầu Chương II Hiến pháp 2013","b) Điều 14 quy định nguyên tắc chung về quyền con người, quyền công dân","c) Quyền con người, quyền công dân chỉ bị hạn chế theo luật trong trường hợp cần thiết","d) Công dân được thực hiện quyền mà không cần tuân theo pháp luật"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 14. d sai: việc thực hiện quyền phải tuân theo Hiến pháp và pháp luật (Điều 46).","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Tuân theo Hiến pháp và pháp luật là nghĩa vụ của mọi công dân","b) Chấp hành quy tắc sinh hoạt công cộng là nghĩa vụ của công dân","c) Tham gia bảo vệ an ninh quốc gia là nghĩa vụ của công dân","d) Công dân chỉ có quyền mà không có nghĩa vụ"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 46. d sai: quyền công dân không tách rời nghĩa vụ công dân.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Theo khoản 2 Điều 14, quyền công dân có thể bị hạn chế trong trường hợp cần thiết vì lý do quốc phòng, ... quốc gia.","answer":"an ninh","explain":"Khoản 2 Điều 14: trong trường hợp cần thiết vì lý do quốc phòng, an ninh quốc gia, trật tự, an toàn xã hội, đạo đức xã hội, sức khỏe của cộng đồng.","points":0.5},{"type":"short","level":"VDC","q":"Theo Điều 47 Hiến pháp 2013, chủ thể có nghĩa vụ nộp thuế là ai? (Trả lời ngắn gọn)","answer":"Mọi người","explain":"Điều 47: Mọi người có nghĩa vụ nộp thuế theo luật định.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Theo Điều 27, công dân có quyền ứng cử vào cơ quan nào?","options":["A. Tòa án nhân dân","B. Chính phủ","C. Viện kiểm sát nhân dân","D. Quốc hội, Hội đồng nhân dân"],"answer":"D","explain":"Điều 27: Công dân có quyền ứng cử vào Quốc hội, Hội đồng nhân dân.","points":0.25},{"type":"mcq","level":"NB","q":"Các quyền về chính trị, dân sự, kinh tế, văn hóa, xã hội của con người, công dân được đề cập tại","options":["A. Điều 20","B. Điều 44","C. Điều 47","D. khoản 1 Điều 14"],"answer":"D","explain":"Khoản 1 Điều 14: các quyền con người, quyền công dân về chính trị, dân sự, kinh tế, văn hóa, xã hội được công nhận, tôn trọng, bảo vệ, bảo đảm theo Hiến pháp và pháp luật.","points":0.25},{"type":"mcq","level":"TH","q":"Lòng trung thành với Tổ quốc của công dân được thể hiện qua hành động nào?","options":["A. Thờ ơ trước vận mệnh của đất nước","B. Chống đối chính quyền nhân dân","C. Yêu nước, sẵn sàng cống hiến, bảo vệ độc lập, chủ quyền của đất nước","D. Vụ lợi cá nhân, bất chấp lợi ích quốc gia"],"answer":"C","explain":"Điều 44 quy định nghĩa vụ trung thành với Tổ quốc. Yêu nước, cống hiến, bảo vệ độc lập chủ quyền là biểu hiện của lòng trung thành; các hành vi còn lại đều đi ngược lại.","points":0.25},{"type":"mcq","level":"TH","q":"Tự do báo chí theo Điều 25 có nghĩa là","options":["A. báo chí không chịu sự quản lý của pháp luật","B. công dân được sáng tạo tác phẩm báo chí, tiếp cận thông tin báo chí theo quy định của pháp luật","C. báo chí được đăng mọi thông tin kể cả bịa đặt","D. ai cũng được tự ý xuất bản báo mà không cần phép"],"answer":"B","explain":"Điều 25 ghi nhận quyền tự do báo chí nhưng việc thực hiện các quyền này do pháp luật quy định. Tự do báo chí phải trong khuôn khổ pháp luật, không được đăng tin bịa đặt, xâm phạm an ninh quốc gia.","points":0.25},{"type":"mcq","level":"VD","q":"Thấy một người đang bị nhóm côn đồ đánh đập, anh B đã can ngăn và gọi công an. Hành động của anh B thể hiện","options":["A. sự tò mò cá nhân","B. vi phạm quyền tự do của nhóm côn đồ","C. hành vi can thiệp trái phép","D. ý thức bảo vệ quyền bất khả xâm phạm về thân thể của người khác theo tinh thần Điều 20"],"answer":"D","explain":"Điều 20 bảo hộ quyền bất khả xâm phạm về thân thể của mọi người. Can ngăn hành vi bạo lực, báo cho cơ quan chức năng là hành động đúng đắn, thể hiện ý thức tôn trọng và bảo vệ quyền con người.","points":0.25},{"type":"mcq","level":"VDC","q":"Một doanh nghiệp kê khai đúng, nộp đủ thuế theo quy định. Việc làm này thể hiện","options":["A. hành vi không cần thiết","B. chỉ là nghĩa vụ đạo đức, không phải nghĩa vụ pháp lý","C. sự thiệt thòi của doanh nghiệp","D. thực hiện tốt nghĩa vụ nộp thuế theo Điều 47, góp phần xây dựng đất nước"],"answer":"D","explain":"Điều 47: Mọi người có nghĩa vụ nộp thuế theo luật định. Kê khai đúng, nộp đủ thuế là thực hiện nghiêm túc nghĩa vụ pháp lý, góp phần tạo nguồn lực xây dựng và bảo vệ đất nước.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Điều 20 thuộc Chương II Hiến pháp 2013","b) Mọi người có quyền bất khả xâm phạm về thân thể","c) Không ai bị tra tấn, bạo lực, truy bức, nhục hình","d) Ai cũng có quyền tự ý bắt giữ người khác"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 20. d sai: việc bắt, giam, giữ người do luật định (khoản 2 Điều 20).","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Nghĩa vụ quân sự là một nội dung của Điều 45","b) Xây dựng nền quốc phòng toàn dân là trách nhiệm của mọi công dân","c) Thanh niên đến tuổi theo luật định phải thực hiện nghĩa vụ quân sự","d) Nghĩa vụ quân sự là hình thức xử phạt đối với thanh niên"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 45 và Luật Nghĩa vụ quân sự. d sai: nghĩa vụ quân sự là nghĩa vụ vẻ vang, vừa là trách nhiệm vừa là quyền cao quý của công dân, không phải hình thức xử phạt.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Theo Điều 25, công dân có quyền tự do ngôn luận, ..., tiếp cận thông tin, hội họp, lập hội, biểu tình.","answer":"tự do báo chí","explain":"Điều 25: Công dân có quyền tự do ngôn luận, tự do báo chí, tiếp cận thông tin, hội họp, lập hội, biểu tình.","points":0.5},{"type":"short","level":"VDC","q":"Điền cụm từ còn thiếu theo Điều 46: Công dân có nghĩa vụ tham gia bảo vệ an ninh quốc gia, trật tự, ... xã hội.","answer":"an toàn","explain":"Điều 46: Công dân tham gia bảo vệ an ninh quốc gia, trật tự, an toàn xã hội.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Nghĩa vụ tuân theo Hiến pháp và pháp luật được quy định tại điều nào?","options":["A. Điều 45","B. Điều 14","C. Điều 46","D. Điều 44"],"answer":"C","explain":"Điều 46: Công dân có nghĩa vụ tuân theo Hiến pháp và pháp luật.","points":0.25},{"type":"mcq","level":"NB","q":"Theo Điều 20, hành vi nào sau đây bị nghiêm cấm?","options":["A. Tôn trọng danh dự, nhân phẩm của người khác","B. Bảo vệ sức khỏe của người khác","C. Giúp đỡ người bị nạn","D. Tra tấn, bạo lực, truy bức, nhục hình"],"answer":"D","explain":"Khoản 1 Điều 20 nghiêm cấm tra tấn, bạo lực, truy bức, nhục hình hay bất kỳ hình thức đối xử nào khác xâm phạm thân thể, sức khỏe, xúc phạm danh dự, nhân phẩm.","points":0.25},{"type":"mcq","level":"TH","q":"Cụm từ nghĩa vụ thiêng liêng trong khoản 1 Điều 45 được hiểu là","options":["A. nghĩa vụ nặng nề, bắt buộc một cách miễn cưỡng","B. nghĩa vụ chỉ mang tính hình thức","C. nghĩa vụ cao cả, vẻ vang mà mỗi công dân tự hào thực hiện vì Tổ quốc","D. nghĩa vụ có thể thay thế bằng tiền"],"answer":"C","explain":"Thiêng liêng thể hiện tính cao cả, vẻ vang của nghĩa vụ bảo vệ Tổ quốc, vừa là trách nhiệm, vừa là niềm tự hào và quyền cao quý của công dân (khoản 1 Điều 45).","points":0.25},{"type":"mcq","level":"TH","q":"Hành vi trốn thuế, gian lận thuế sẽ","options":["A. được khuyến khích","B. bị xử lý theo quy định của pháp luật","C. được khen thưởng","D. không bị xử lý gì"],"answer":"B","explain":"Điều 47 quy định nghĩa vụ nộp thuế theo luật định. Trốn thuế, gian lận thuế là hành vi vi phạm pháp luật và bị xử lý theo quy định của pháp luật về thuế.","points":0.25},{"type":"mcq","level":"VD","q":"Tổ chức X tổ chức tuần hành phản đối việc xây dựng nhà máy gây ô nhiễm môi trường, có xin phép và được cơ quan có thẩm quyền chấp thuận. Việc làm này","options":["A. bị pháp luật nghiêm cấm trong mọi trường hợp","B. là lạm dụng quyền tự do","C. là hành vi gây rối trật tự công cộng","D. là thực hiện quyền biểu tình theo Điều 25 và đúng quy định pháp luật"],"answer":"D","explain":"Điều 25 ghi nhận quyền biểu tình của công dân; việc thực hiện do pháp luật quy định. Tổ chức tuần hành có xin phép, được chấp thuận, vì mục đích chính đáng là thực hiện đúng quyền và đúng pháp luật.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định: Vì quyền con người là thiêng liêng nên Nhà nước không bao giờ được hạn chế bất kì quyền nào. Nhận định này","options":["A. đúng, vì quyền con người là tuyệt đối","B. sai, vì Việt Nam không công nhận quyền con người","C. đúng, vì Hiến pháp không quy định việc hạn chế quyền","D. sai, vì khoản 2 Điều 14 cho phép hạn chế quyền theo luật trong trường hợp cần thiết"],"answer":"D","explain":"Khoản 2 Điều 14: Quyền con người, quyền công dân chỉ có thể bị hạn chế theo quy định của luật trong trường hợp cần thiết vì lý do quốc phòng, an ninh quốc gia, trật tự, an toàn xã hội, đạo đức xã hội, sức khỏe của cộng đồng. Không có quyền nào là tuyệt đối, không giới hạn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Điều 25 thuộc Chương II Hiến pháp 2013","b) Công dân có quyền hội họp, lập hội","c) Công dân có quyền biểu tình","d) Công dân được tự do ngôn luận mà không cần tuân theo pháp luật"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 25. d sai: việc thực hiện quyền tự do ngôn luận do pháp luật quy định.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các nhận định sau:","statements":["a) Điều 45 quy định về nghĩa vụ bảo vệ Tổ quốc","b) Nghĩa vụ quân sự được quy định tại khoản 2 Điều 45","c) Xây dựng nền quốc phòng toàn dân là sự nghiệp của toàn dân","d) Công dân không cần tham gia xây dựng nền quốc phòng toàn dân"],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 45. d sai: khoản 2 Điều 45 quy định công dân phải tham gia xây dựng nền quốc phòng toàn dân.","points":1},{"type":"short","level":"VD","q":"Điền cụm từ còn thiếu: Theo Điều 27, công dân đủ hai mươi mốt tuổi trở lên có quyền ... vào Quốc hội, Hội đồng nhân dân.","answer":"ứng cử","explain":"Điều 27: Công dân đủ hai mươi mốt tuổi trở lên có quyền ứng cử vào Quốc hội, Hội đồng nhân dân.","points":0.5},{"type":"short","level":"VDC","q":"Theo khoản 2 Điều 20, cơ quan nào có thẩm quyền phê chuẩn quyết định bắt người? (Trả lời ngắn gọn)","answer":"Viện kiểm sát nhân dân","explain":"Khoản 2 Điều 20: Không ai bị bắt nếu không có quyết định của Tòa án nhân dân, quyết định hoặc phê chuẩn của Viện kiểm sát nhân dân.","points":0.5}]}]}
