 HĐND bầu, chịu sự giám sát của HĐND, đồng thời chịu trách nhiệm trước cơ quan hành chính nhà nước cấp trên. Đây là biểu hiện của nguyên tắc phân công, phối hợp, kiểm soát quyền lực.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau về vị trí của Hội đồng nhân dân:","statements":["a) HĐND vừa là cơ quan quyền lực nhà nước ở địa phương vừa là cơ quan hành chính nhà nước ở địa phương.","b) Tính đại diện của HĐND thể hiện ở việc các đại biểu do Nhân dân địa phương bầu ra.","c) HĐND chịu trách nhiệm trước cơ quan nhà nước cấp trên.","d) HĐND có thể quyết định mọi vấn đề mà không cần căn cứ vào luật."],"answer":["F","T","T","F"],"explain":"b, c đúng theo Điều 113. a sai vì cơ quan hành chính nhà nước ở địa phương là UBND. d sai vì HĐND chỉ quyết định các vấn đề của địa phương do luật định.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1},{"type":"short","level":"VD","q":"Trong các đơn vị: quận, phường, tỉnh — đơn vị nào thuộc cấp huyện?","answer":"Quận","explain":"Theo Điều 110, quận là đơn vị hành chính cấp huyện; phường thuộc cấp xã; tỉnh thuộc cấp tỉnh.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5},{"type":"mcq","level":"VD","q":"Ông X là đại biểu HĐND huyện. Khi cử tri chất vấn về việc thực hiện lời hứa lúc tranh cử, ông X cần làm gì?","options":["A. Báo cáo, giải trình trước cử tri vì đại biểu HĐND chịu trách nhiệm trước cử tri.","B. Không cần trả lời vì đã trúng cử.","C. Đổ trách nhiệm cho UBND.","D. Chỉ báo cáo với cấp trên, không cần báo cáo cử tri."],"answer":"A","explain":"Theo Điều 115, đại biểu HĐND liên hệ chặt chẽ với cử tri, chịu sự giám sát của cử tri, thực hiện chế độ tiếp xúc, báo cáo với cử tri và trả lời yêu cầu, kiến nghị của cử tri.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"NB","q":"Ai là người đứng đầu UBND, lãnh đạo và điều hành công việc của UBND?","options":["A. Chủ tịch Ủy ban nhân dân.","B. Chủ tịch Hội đồng nhân dân.","C. Bí thư Đảng ủy.","D. Chánh Văn phòng UBND."],"answer":"A","explain":"Chủ tịch UBND là người đứng đầu UBND, lãnh đạo và điều hành công việc của UBND, chịu trách nhiệm cá nhân về quyết định của mình.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"TH","q":"Hoạt động giám sát của HĐND đối với UBND cùng cấp thể hiện qua việc nào sau đây?","options":["A. Nghe báo cáo công tác của UBND, chất vấn Chủ tịch UBND và các thành viên UBND.","B. Trực tiếp điều hành công việc của UBND.","C. Bổ nhiệm Chủ tịch UBND.","D. Thay UBND ban hành quyết định hành chính."],"answer":"A","explain":"HĐND giám sát UBND thông qua việc nghe báo cáo công tác, chất vấn, xem xét việc trả lời chất vấn và bỏ phiếu tín nhiệm đối với người giữ chức vụ do HĐND bầu.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"NB","q":"UBND thực hiện chức năng quản lí nhà nước trên những lĩnh vực nào?","options":["A. Mọi lĩnh vực của đời sống xã hội trên địa bàn theo quy định của pháp luật.","B. Chỉ lĩnh vực kinh tế.","C. Chỉ lĩnh vực giáo dục.","D. Chỉ lĩnh vực an ninh trật tự."],"answer":"A","explain":"Với tư cách là cơ quan hành chính nhà nước ở địa phương, UBND thực hiện quản lí nhà nước trên mọi lĩnh vực của đời sống xã hội ở địa phương theo quy định của pháp luật.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"VDC","q":"Đánh giá nhận định: UBND chỉ thi hành nghị quyết của HĐND nên không có quyền chủ động ban hành văn bản quản lí.","options":["A. Sai, vì trong phạm vi nhiệm vụ, quyền hạn, UBND được ban hành quyết định, chỉ thị để quản lí địa phương nhưng không được trái Hiến pháp, pháp luật và nghị quyết của HĐND.","B. Đúng, UBND không được ban hành bất kì văn bản nào.","C. Đúng một phần, UBND chỉ được ban hành văn bản khi HĐND cho phép từng trường hợp.","D. Không xác định được vì thiếu căn cứ pháp luật."],"answer":"A","explain":"Ngoài việc tổ chức thực hiện nghị quyết của HĐND, UBND còn thực hiện chức năng quản lí hành chính nhà nước nên được ban hành quyết định, chỉ thị trong phạm vi thẩm quyền, nhưng không được trái Hiến pháp, pháp luật và nghị quyết của HĐND.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"VD","q":"Khi xảy ra lũ lụt trên địa bàn, UBND huyện huy động lực lượng cứu hộ, hỗ trợ người dân khắc phục hậu quả. Việc này thể hiện chức năng nào của UBND?","options":["A. Quản lí hành chính nhà nước, bảo đảm đời sống Nhân dân trên địa bàn.","B. Chức năng xét xử.","C. Chức năng lập pháp.","D. Chức năng thực hành quyền công tố."],"answer":"A","explain":"Tổ chức phòng, chống thiên tai, cứu hộ, bảo đảm đời sống Nhân dân là nội dung của chức năng quản lí hành chính nhà nước ở địa phương của UBND.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"NB","q":"Nhận định nào sau đây đúng về vị trí pháp lí của Hội đồng nhân dân?","options":["A. HĐND là cơ quan hành chính nhà nước ở địa phương.","B. HĐND là cơ quan quyền lực nhà nước ở địa phương.","C. HĐND là cơ quan xét xử ở địa phương.","D. HĐND là cơ quan chấp hành của UBND."],"answer":"B","explain":"Theo Điều 113 Hiến pháp 2013, HĐND là cơ quan quyền lực nhà nước ở địa phương. Cơ quan hành chính nhà nước ở địa phương là UBND (Điều 114).","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau:","statements":["a) HĐND và UBND cùng cấp hoạt động hoàn toàn độc lập, không phối hợp với nhau.","b) UBND phải tuân thủ Hiến pháp, pháp luật khi tổ chức thực hiện nghị quyết của HĐND.","c) HĐND giám sát việc UBND thực hiện nghị quyết của HĐND.","d) UBND cấp dưới chịu sự chỉ đạo của UBND cấp trên."],"answer":["F","T","T","T"],"explain":"b, c, d đúng. a sai vì HĐND và UBND có mối quan hệ chặt chẽ: bầu ra, chấp hành, giám sát, chịu trách nhiệm.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1},{"type":"mcq","level":"TH","q":"Trong quản lí ngân sách địa phương, UBND có nhiệm vụ:","options":["A. Lập dự toán ngân sách địa phương trình HĐND quyết định và tổ chức thực hiện dự toán đã được quyết định.","B. Tự ý quyết định ngân sách mà không cần HĐND.","C. Không có nhiệm vụ gì liên quan đến ngân sách.","D. Chỉ thu thuế, không thực hiện chi ngân sách."],"answer":"A","explain":"UBND lập dự toán ngân sách địa phương trình HĐND cùng cấp quyết định và tổ chức thực hiện dự toán ngân sách sau khi được quyết định.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"short","level":"VDC","q":"Vì sao Chủ tịch UBND phải chịu trách nhiệm cá nhân về quyết định của mình?","answer":"Vì Chủ tịch là người đứng đầu, trực tiếp lãnh đạo và điều hành hoạt động của UBND","explain":"Chủ tịch UBND là người đứng đầu, lãnh đạo và điều hành công việc của UBND nên phải chịu trách nhiệm cá nhân về các quyết định của mình.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5},{"type":"mcq","level":"NB","q":"Theo Điều 114 Hiến pháp 2013, Ủy ban nhân dân là cơ quan nào?","options":["A. Cơ quan chấp hành của HĐND, cơ quan hành chính nhà nước ở địa phương.","B. Cơ quan quyền lực nhà nước ở địa phương.","C. Cơ quan xét xử ở địa phương.","D. Cơ quan quyền lực nhà nước cao nhất."],"answer":"A","explain":"Điều 114 Hiến pháp 2013: Ủy ban nhân dân do HĐND cùng cấp bầu ra là cơ quan chấp hành của HĐND, cơ quan hành chính nhà nước ở địa phương.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"TH","q":"UBND chịu trách nhiệm và báo cáo công tác trước những cơ quan nào?","options":["A. HĐND cùng cấp và cơ quan hành chính nhà nước cấp trên.","B. Chỉ trước Nhân dân địa phương.","C. Chỉ trước Quốc hội.","D. Không phải báo cáo trước cơ quan nào."],"answer":"A","explain":"Điều 114: UBND chịu trách nhiệm trước HĐND và cơ quan hành chính nhà nước cấp trên; báo cáo công tác trước HĐND cùng cấp và UBND cấp trên.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau về tổ chức của HĐND:","statements":["a) Nhiệm kỳ của HĐND là 5 năm.","b) Đại biểu HĐND do Nhân dân địa phương bầu ra.","c) Đại biểu HĐND không phải chịu trách nhiệm trước bất kì ai.","d) Thường trực HĐND là cơ quan thường trực của HĐND giữa hai kỳ họp."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai vì theo Điều 115, đại biểu HĐND chịu trách nhiệm trước cử tri và trước HĐND.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1},{"type":"short","level":"VD","q":"Hoàn thành nhận định theo Điều 113 Hiến pháp 2013: Hội đồng nhân dân là cơ quan ... ở địa phương.","answer":"quyền lực nhà nước","explain":"Điều 113 Hiến pháp 2013: Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương, đại diện cho ý chí, nguyện vọng và quyền làm chủ của Nhân dân.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Theo Điều 113 Hiến pháp năm 2013, Hội đồng nhân dân là cơ quan nào sau đây?","options":["A. Cơ quan quyền lực nhà nước ở địa phương.","B. Cơ quan hành chính nhà nước ở địa phương.","C. Cơ quan xét xử ở địa phương.","D. Cơ quan kiểm sát hoạt động tư pháp ở địa phương."],"answer":"A","explain":"Điều 113 Hiến pháp 2013 quy định: Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương, đại diện cho ý chí, nguyện vọng và quyền làm chủ của Nhân dân.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau về quan hệ giữa HĐND và UBND:","statements":["a) HĐND bầu ra UBND cùng cấp.","b) UBND tổ chức thực hiện nghị quyết của HĐND cùng cấp.","c) HĐND giám sát hoạt động của UBND cùng cấp.","d) UBND bầu ra HĐND cùng cấp."],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 113, 114. d sai vì UBND do HĐND cùng cấp bầu ra, không có chiều ngược lại.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1},{"type":"mcq","level":"TH","q":"Vì sao UBND được gọi là cơ quan chấp hành của HĐND?","options":["A. Vì UBND do HĐND cùng cấp bầu ra và tổ chức thi hành nghị quyết của HĐND.","B. Vì UBND ban hành nghị quyết thay HĐND.","C. Vì UBND giám sát hoạt động của HĐND.","D. Vì UBND bầu ra HĐND."],"answer":"A","explain":"UBND do HĐND cùng cấp bầu ra, có nhiệm vụ tổ chức thực hiện nghị quyết của HĐND nên được gọi là cơ quan chấp hành của HĐND.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"VD","q":"Có ý kiến cho rằng: vì HĐND là cơ quan quyền lực nhà nước ở địa phương nên có quyền quyết định mọi vấn đề, kể cả những vấn đề thuộc thẩm quyền của Quốc hội. Ý kiến này đúng hay sai? Vì sao?","options":["A. Sai, vì HĐND chỉ quyết định các vấn đề của địa phương do luật định, trong phạm vi Hiến pháp và pháp luật.","B. Đúng, vì HĐND là cơ quan quyền lực cao nhất ở địa phương.","C. Đúng, vì HĐND do Nhân dân bầu ra nên muốn quyết định gì cũng được.","D. Sai, vì HĐND không có quyền quyết định vấn đề gì."],"answer":"A","explain":"Điều 113 quy định HĐND quyết định các vấn đề của địa phương do luật định và phải giám sát việc tuân theo Hiến pháp, pháp luật. HĐND không thể vượt quá thẩm quyền luật định hay quyết định vấn đề thuộc thẩm quyền của Quốc hội.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"TH","q":"Đơn vị hành chính cấp huyện gồm những đơn vị nào?","options":["A. Huyện, quận, thị xã, thành phố thuộc tỉnh, thành phố thuộc thành phố trực thuộc trung ương.","B. Tỉnh, thành phố trực thuộc trung ương.","C. Xã, phường, thị trấn.","D. Thôn, bản, tổ dân phố."],"answer":"A","explain":"Điều 110 Hiến pháp 2013 quy định đơn vị hành chính cấp huyện gồm: huyện, quận, thị xã, thành phố thuộc tỉnh, thành phố thuộc thành phố trực thuộc trung ương.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"short","level":"VDC","q":"Nêu hai nguyên tắc hoạt động cơ bản của Ủy ban nhân dân.","answer":"Tập trung dân chủ; chịu trách nhiệm trước HĐND cùng cấp và cơ quan hành chính cấp trên","explain":"UBND hoạt động theo nguyên tắc tập trung dân chủ, đồng thời chịu trách nhiệm trước HĐND cùng cấp và cơ quan hành chính nhà nước cấp trên (Điều 114).","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5},{"type":"mcq","level":"NB","q":"Hội đồng nhân dân các cấp do ai bầu ra?","options":["A. Quốc hội bầu.","B. Nhân dân địa phương bầu ra.","C. Ủy ban nhân dân cùng cấp bầu.","D. Chính phủ bổ nhiệm."],"answer":"B","explain":"Theo Điều 113 Hiến pháp 2013, Hội đồng nhân dân do Nhân dân địa phương bầu ra. Đây là cơ sở của tính đại diện của HĐND.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"VDC","q":"Đánh giá nhận định: Đại biểu HĐND chỉ chịu trách nhiệm trước cử tri nơi mình ứng cử, không chịu trách nhiệm trước HĐND.","options":["A. Sai, vì theo Điều 115 đại biểu HĐND chịu trách nhiệm trước cử tri và trước HĐND.","B. Đúng, vì đại biểu do cử tri bầu ra.","C. Sai, vì đại biểu chỉ chịu trách nhiệm trước UBND.","D. Đúng, vì HĐND không có quyền giám sát đại biểu."],"answer":"A","explain":"Điều 115 khoản 3 Hiến pháp 2013 quy định rõ đại biểu HĐND chịu trách nhiệm trước cử tri và trước HĐND về việc thực hiện nhiệm vụ, quyền hạn đại biểu của mình.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"short","level":"VD","q":"Kể tên ba thành phần cơ cấu của Ủy ban nhân dân.","answer":"Chủ tịch, Phó Chủ tịch và các Ủy viên","explain":"Ủy ban nhân dân gồm Chủ tịch, Phó Chủ tịch và các Ủy viên.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau:","statements":["a) Kết quả bầu Chủ tịch UBND cấp tỉnh phải được Thủ tướng Chính phủ phê chuẩn.","b) UBND hoạt động theo nguyên tắc tập trung dân chủ.","c) Chủ tịch UBND không phải chịu trách nhiệm cá nhân về quyết định của mình.","d) Các thành viên UBND chịu trách nhiệm tập thể về hoạt động của UBND."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai vì Chủ tịch UBND là người đứng đầu, phải chịu trách nhiệm cá nhân về quyết định của mình.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"VDC","q":"Mối quan hệ giữa tính đại diện và tính chịu trách nhiệm của HĐND được hiểu như thế nào?","options":["A. Vì do Nhân dân địa phương bầu ra nên HĐND phải chịu trách nhiệm trước Nhân dân địa phương và báo cáo công tác trước cử tri.","B. Hai tính chất này mâu thuẫn và triệt tiêu lẫn nhau.","C. Tính đại diện làm mất đi tính chịu trách nhiệm của HĐND.","D. HĐND chỉ chịu trách nhiệm trước cấp trên, không chịu trách nhiệm trước Nhân dân."],"answer":"A","explain":"Chính vì do Nhân dân địa phương bầu ra (tính đại diện) nên HĐND phải chịu trách nhiệm trước Nhân dân địa phương và cơ quan nhà nước cấp trên (Điều 113).","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau về tính chất của UBND:","statements":["a) Tính chấp hành của UBND thể hiện ở việc tổ chức thực hiện nghị quyết của HĐND cùng cấp.","b) Tính hành chính nhà nước của UBND thể hiện ở việc quản lí các lĩnh vực đời sống xã hội trên địa bàn.","c) UBND chỉ chịu trách nhiệm trước HĐND mà không chịu trách nhiệm trước cơ quan hành chính cấp trên.","d) UBND có thể ban hành văn bản trái với nghị quyết của HĐND cùng cấp."],"answer":["T","T","F","F"],"explain":"a, b đúng. c sai vì UBND chịu trách nhiệm trước cả HĐND cùng cấp và cơ quan hành chính nhà nước cấp trên. d sai vì văn bản của UBND không được trái với nghị quyết của HĐND cùng cấp.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1},{"type":"mcq","level":"VD","q":"Có ý kiến: HĐND chỉ nên tập trung quyết định các vấn đề kinh tế, không cần giám sát UBND vì đã tin tưởng khi bầu ra. Em đánh giá thế nào?","options":["A. Không đồng tình, vì giám sát là chức năng hiến định của HĐND, bảo đảm UBND hoạt động đúng pháp luật và đúng nghị quyết của HĐND.","B. Đồng tình, vì giám sát gây mất đoàn kết.","C. Đồng tình một phần, chỉ cần giám sát khi có vi phạm.","D. Không thể đánh giá vì thiếu thông tin."],"answer":"A","explain":"Giám sát là chức năng hiến định của HĐND (Điều 113). Dù UBND do HĐND bầu ra, cơ chế giám sát vẫn cần thiết để kiểm soát quyền lực, bảo đảm UBND chấp hành đúng pháp luật và nghị quyết của HĐND.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"NB","q":"Theo Hiến pháp 2013, cấp chính quyền địa phương gồm những cơ quan nào?","options":["A. Hội đồng nhân dân và Ủy ban nhân dân.","B. Quốc hội và Chính phủ.","C. Tòa án nhân dân và Viện kiểm sát nhân dân.","D. Đảng ủy và Ủy ban nhân dân."],"answer":"A","explain":"Điều 111 Hiến pháp 2013: Cấp chính quyền địa phương gồm có Hội đồng nhân dân và Ủy ban nhân dân.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"TH","q":"Nhận định nào sau đây đúng về vị trí của UBND?","options":["A. UBND vừa là cơ quan chấp hành của HĐND vừa là cơ quan hành chính nhà nước ở địa phương.","B. UBND là cơ quan quyền lực nhà nước ở địa phương.","C. UBND do Nhân dân trực tiếp bầu ra.","D. UBND không chịu trách nhiệm trước cơ quan nào."],"answer":"A","explain":"Điều 114 xác định UBND có tính chất kép: cơ quan chấp hành của HĐND và cơ quan hành chính nhà nước ở địa phương.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"short","level":"VD","q":"Theo Điều 115 Hiến pháp 2013, đại biểu Hội đồng nhân dân chịu trách nhiệm trước những ai?","answer":"Cử tri và Hội đồng nhân dân","explain":"Điều 115 khoản 3: Đại biểu Hội đồng nhân dân chịu trách nhiệm trước cử tri và trước Hội đồng nhân dân về việc thực hiện nhiệm vụ, quyền hạn đại biểu của mình.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5},{"type":"short","level":"VDC","q":"Khi Chủ tịch UBND ban hành quyết định trái pháp luật thì phải chịu hậu quả gì?","answer":"Quyết định bị bãi bỏ và phải chịu trách nhiệm trước pháp luật","explain":"Văn bản trái pháp luật của UBND, Chủ tịch UBND có thể bị HĐND cùng cấp hoặc cơ quan nhà nước cấp trên bãi bỏ; người ban hành phải chịu trách nhiệm trước pháp luật.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5},{"type":"mcq","level":"TH","q":"Khi phát hiện văn bản của UBND cùng cấp trái pháp luật, HĐND có quyền gì?","options":["A. Bãi bỏ một phần hoặc toàn bộ văn bản trái pháp luật đó.","B. Không có quyền gì đối với văn bản của UBND.","C. Chỉ được kiến nghị lên Quốc hội.","D. Trực tiếp sửa chữa văn bản của UBND."],"answer":"A","explain":"Theo Luật Tổ chức chính quyền địa phương, HĐND có quyền bãi bỏ một phần hoặc toàn bộ văn bản trái pháp luật của UBND, Chủ tịch UBND cùng cấp. Đây là biểu hiện của chức năng giám sát.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"NB","q":"Nhiệm vụ cơ bản của UBND ở địa phương là:","options":["A. Tổ chức thi hành Hiến pháp, pháp luật và nghị quyết của HĐND ở địa phương.","B. Ban hành Hiến pháp.","C. Xét xử các vụ án.","D. Thực hành quyền công tố."],"answer":"A","explain":"Theo Điều 114, UBND tổ chức việc thi hành Hiến pháp và pháp luật ở địa phương; tổ chức thực hiện nghị quyết của HĐND.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau về Hội đồng nhân dân:","statements":["a) Nhiệm kỳ của Hội đồng nhân dân là 5 năm.","b) HĐND chịu trách nhiệm trước Nhân dân địa phương.","c) HĐND do UBND cùng cấp bầu ra.","d) HĐND quyết định các vấn đề của địa phương theo luật định."],"answer":["T","T","F","T"],"explain":"a, b, d đúng: nhiệm kỳ HĐND là 5 năm; HĐND chịu trách nhiệm trước Nhân dân địa phương và quyết định các vấn đề của địa phương do luật định (Điều 113). c sai vì HĐND do Nhân dân địa phương bầu ra, còn UBND mới do HĐND cùng cấp bầu ra.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Nhiệm kỳ của Hội đồng nhân dân là bao nhiêu năm?","options":["A. 3 năm.","B. 4 năm.","C. 5 năm.","D. 6 năm."],"answer":"C","explain":"Nhiệm kỳ của Hội đồng nhân dân là 5 năm, giống nhiệm kỳ của Quốc hội.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"NB","q":"Ủy ban nhân dân các cấp do cơ quan nào bầu ra?","options":["A. Hội đồng nhân dân cùng cấp.","B. Nhân dân địa phương trực tiếp bầu.","C. Quốc hội.","D. Chính phủ."],"answer":"A","explain":"Điều 114: Ủy ban nhân dân do Hội đồng nhân dân cùng cấp bầu ra.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"TH","q":"Theo Điều 115 Hiến pháp 2013, đại biểu HĐND chịu trách nhiệm trước ai về việc thực hiện nhiệm vụ, quyền hạn của mình?","options":["A. Cử tri và Hội đồng nhân dân.","B. Chỉ trước cử tri.","C. Chỉ trước Ủy ban nhân dân.","D. Chỉ trước Quốc hội."],"answer":"A","explain":"Điều 115 khoản 3 Hiến pháp 2013: Đại biểu Hội đồng nhân dân chịu trách nhiệm trước cử tri và trước Hội đồng nhân dân về việc thực hiện nhiệm vụ, quyền hạn đại biểu của mình.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"short","level":"VDC","q":"Nêu hai biểu hiện cụ thể của việc đại biểu HĐND chịu trách nhiệm trước cử tri.","answer":"Thường xuyên tiếp xúc cử tri; báo cáo và trả lời kiến nghị của cử tri","explain":"Theo Điều 115, đại biểu HĐND liên hệ chặt chẽ với cử tri, chịu sự giám sát của cử tri, thực hiện chế độ tiếp xúc, báo cáo với cử tri về hoạt động của mình và của HĐND, trả lời những yêu cầu, kiến nghị của cử tri.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa HĐND và UBND cùng cấp được thể hiện như thế nào?","options":["A. HĐND bầu ra UBND; UBND tổ chức thực hiện nghị quyết của HĐND và chịu sự giám sát của HĐND.","B. UBND bầu ra HĐND.","C. Hai cơ quan hoàn toàn độc lập, không liên quan đến nhau.","D. HĐND chấp hành quyết định của UBND."],"answer":"A","explain":"HĐND bầu ra UBND cùng cấp; UBND là cơ quan chấp hành của HĐND, tổ chức thực hiện nghị quyết của HĐND, chịu trách nhiệm và báo cáo trước HĐND, đồng thời chịu sự giám sát của HĐND.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"VDC","q":"Có ý kiến: vì UBND do HĐND bầu ra nên UBND chỉ cần nghe theo HĐND, không cần chấp hành pháp luật của Nhà nước. Đánh giá của em:","options":["A. Sai, vì UBND vừa là cơ quan chấp hành của HĐND vừa là cơ quan hành chính nhà nước, phải tuân thủ Hiến pháp, pháp luật và chịu trách nhiệm trước cơ quan hành chính nhà nước cấp trên.","B. Đúng, UBND chỉ cần nghe theo HĐND.","C. Đúng một phần, UBND chỉ cần chấp hành nghị quyết của HĐND.","D. Không xác định được vì thiếu căn cứ."],"answer":"A","explain":"UBND có tính chất kép (Điều 114): vừa là cơ quan chấp hành của HĐND, vừa là cơ quan hành chính nhà nước ở địa phương. Do đó UBND phải tuân thủ Hiến pháp, pháp luật và chịu trách nhiệm trước cả cơ quan hành chính nhà nước cấp trên.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"VD","q":"Ông B được HĐND tỉnh bầu làm Chủ tịch UBND tỉnh. Theo quy định, kết quả bầu Chủ tịch UBND cấp tỉnh phải được cơ quan nào phê chuẩn?","options":["A. Thủ tướng Chính phủ phê chuẩn.","B. Quốc hội phê chuẩn.","C. Chủ tịch nước phê chuẩn.","D. Không cần cơ quan nào phê chuẩn."],"answer":"A","explain":"Theo Luật Tổ chức chính quyền địa phương, kết quả bầu Chủ tịch, Phó Chủ tịch UBND cấp tỉnh phải được Thủ tướng Chính phủ phê chuẩn.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"short","level":"VD","q":"Nêu hai chức năng cơ bản của Hội đồng nhân dân theo Hiến pháp 2013.","answer":"Quyết định và giám sát","explain":"Theo Điều 113, HĐND có hai chức năng cơ bản: quyết định các vấn đề của địa phương do luật định; giám sát việc tuân theo Hiến pháp và pháp luật ở địa phương, việc thực hiện nghị quyết của HĐND (bao gồm giám sát UBND cùng cấp).","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau về chức năng của UBND:","statements":["a) UBND tổ chức thi hành Hiến pháp và pháp luật ở địa phương.","b) UBND tổ chức thực hiện nghị quyết của HĐND cùng cấp.","c) UBND báo cáo công tác trước HĐND cùng cấp.","d) UBND có quyền ban hành luật."],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 114. d sai vì quyền lập pháp thuộc về Quốc hội.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau:","statements":["a) UBND chịu trách nhiệm trước HĐND cùng cấp về việc thực hiện nhiệm vụ.","b) HĐND có quyền bãi bỏ văn bản trái pháp luật của UBND cùng cấp.","c) UBND không phải báo cáo công tác trước HĐND.","d) Quan hệ giữa HĐND và UBND là quan hệ giữa cơ quan quyền lực và cơ quan chấp hành, hành chính ở địa phương."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai vì UBND phải báo cáo công tác trước HĐND cùng cấp.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"VD","q":"UBND tỉnh ban hành quyết định xử phạt vi phạm hành chính đối với cơ sở kinh doanh gây ô nhiễm môi trường. Việc này thể hiện tính chất nào của UBND?","options":["A. Cơ quan hành chính nhà nước ở địa phương.","B. Cơ quan quyền lực nhà nước ở địa phương.","C. Cơ quan xét xử.","D. Cơ quan lập pháp."],"answer":"A","explain":"Xử phạt vi phạm hành chính là hoạt động quản lí hành chính nhà nước, thể hiện tính chất cơ quan hành chính nhà nước ở địa phương của UBND.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"short","level":"VDC","q":"Vì sao khi HĐND hết nhiệm kỳ mà HĐND khóa mới chưa được bầu thì HĐND khóa cũ vẫn tiếp tục hoạt động?","answer":"Để bảo đảm tính liên tục của cơ quan quyền lực nhà nước ở địa phương","explain":"Quy định này nhằm tránh khoảng trống quyền lực nhà nước ở địa phương, bảo đảm bộ máy chính quyền địa phương hoạt động liên tục, thông suốt.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau về Hội đồng nhân dân theo Hiến pháp 2013:","statements":["a) Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương.","b) Hội đồng nhân dân do Nhân dân địa phương bầu ra.","c) Hội đồng nhân dân là cơ quan hành chính nhà nước ở địa phương.","d) Hội đồng nhân dân đại diện cho ý chí, nguyện vọng và quyền làm chủ của Nhân dân địa phương."],"answer":["T","T","F","T"],"explain":"a, b, d đúng theo Điều 113 Hiến pháp 2013. c sai vì cơ quan hành chính nhà nước ở địa phương là UBND (Điều 114).","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1},{"type":"mcq","level":"TH","q":"UBND cấp xã có nhiệm vụ nào sau đây?","options":["A. Tổ chức thực hiện các văn bản của cơ quan nhà nước cấp trên và nghị quyết của HĐND cùng cấp.","B. Ban hành luật.","C. Quyết định vấn đề chiến tranh và hòa bình.","D. Phê chuẩn điều ước quốc tế."],"answer":"A","explain":"UBND cấp xã tổ chức thi hành Hiến pháp, pháp luật, các văn bản của cơ quan nhà nước cấp trên và nghị quyết của HĐND cùng cấp trên địa bàn xã.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"NB","q":"Ủy ban nhân dân gồm những thành phần nào?","options":["A. Chủ tịch, Phó Chủ tịch và các Ủy viên.","B. Chủ tịch, các Phó Chủ tịch và Hội thẩm nhân dân.","C. Viện trưởng, Phó Viện trưởng và Kiểm sát viên.","D. Bí thư, Phó Bí thư và các Ủy viên."],"answer":"A","explain":"UBND gồm Chủ tịch, Phó Chủ tịch và các Ủy viên.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"short","level":"VD","q":"Nêu hai nhiệm vụ cơ bản của Ủy ban nhân dân ở địa phương.","answer":"Tổ chức thi hành Hiến pháp, pháp luật; tổ chức thực hiện nghị quyết của HĐND","explain":"Theo Điều 114, UBND tổ chức việc thi hành Hiến pháp và pháp luật ở địa phương; tổ chức thực hiện nghị quyết của HĐND cùng cấp.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau về đại biểu HĐND:","statements":["a) Đại biểu HĐND chịu trách nhiệm trước cử tri và trước HĐND (Điều 115).","b) Khi HĐND hết nhiệm kỳ mà khóa mới chưa được bầu, HĐND khóa cũ tiếp tục hoạt động.","c) Thường trực HĐND do UBND bầu ra.","d) Các ban của HĐND giúp HĐND thực hiện chức năng, nhiệm vụ."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai vì Thường trực HĐND do HĐND bầu ra trong số các đại biểu HĐND.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1},{"type":"mcq","level":"TH","q":"Vì sao UBND được gọi là cơ quan hành chính nhà nước ở địa phương?","options":["A. Vì UBND thực hiện chức năng quản lí hành chính nhà nước trên địa bàn theo Hiến pháp và pháp luật.","B. Vì UBND ban hành luật.","C. Vì UBND xét xử các vụ án.","D. Vì UBND thực hành quyền công tố."],"answer":"A","explain":"Với tư cách là cơ quan hành chính nhà nước ở địa phương, UBND thực hiện quản lí nhà nước trên các lĩnh vực của đời sống xã hội ở địa phương.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"NB","q":"Hội đồng nhân dân thực hiện chức năng giám sát đối với hoạt động của cơ quan nào?","options":["A. Ủy ban nhân dân cùng cấp.","B. Quốc hội.","C. Chính phủ.","D. Tòa án nhân dân tối cao."],"answer":"A","explain":"Theo Điều 113, HĐND giám sát việc tuân theo Hiến pháp và pháp luật ở địa phương, việc thực hiện nghị quyết của HĐND, trong đó có giám sát hoạt động của UBND cùng cấp.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"VDC","q":"So sánh tổ chức chính quyền địa phương ở nông thôn và đô thị:","options":["A. Đều gồm HĐND và UBND nhưng được tổ chức phù hợp với đặc điểm nông thôn, đô thị, hải đảo theo luật định.","B. Đô thị không tổ chức HĐND.","C. Nông thôn không tổ chức UBND.","D. Tổ chức hoàn toàn giống nhau, không có điểm khác biệt nào."],"answer":"A","explain":"Điều 111 khoản 2: Cấp chính quyền địa phương gồm HĐND và UBND được tổ chức phù hợp với đặc điểm nông thôn, đô thị, hải đảo, đơn vị hành chính – kinh tế đặc biệt do luật định.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"TH","q":"Cơ quan thường trực của HĐND hoạt động giữa hai kỳ họp là:","options":["A. Thường trực Hội đồng nhân dân.","B. Ủy ban nhân dân.","C. Đoàn đại biểu Quốc hội.","D. Ban Thường vụ cấp ủy."],"answer":"A","explain":"Thường trực HĐND là cơ quan thường trực của HĐND, hoạt động giữa hai kỳ họp HĐND.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"short","level":"VDC","q":"Vì sao văn bản của UBND không được trái với nghị quyết của HĐND cùng cấp?","answer":"Vì UBND là cơ quan chấp hành của HĐND, do HĐND bầu ra và chịu trách nhiệm trước HĐND","explain":"Theo Điều 114, UBND là cơ quan chấp hành của HĐND, do HĐND cùng cấp bầu ra và chịu trách nhiệm trước HĐND, nên văn bản của UBND không được trái với nghị quyết của HĐND cùng cấp.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5},{"type":"short","level":"VD","q":"Nêu hai biểu hiện của mối quan hệ giữa HĐND và UBND cùng cấp.","answer":"HĐND bầu ra UBND; UBND chấp hành nghị quyết và chịu sự giám sát của HĐND","explain":"Mối quan hệ HĐND – UBND: HĐND bầu ra UBND cùng cấp; UBND tổ chức thực hiện nghị quyết của HĐND, chịu trách nhiệm, báo cáo và chịu sự giám sát của HĐND.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau về chức năng giám sát của HĐND:","statements":["a) Khi văn bản của UBND cùng cấp trái pháp luật, HĐND có quyền bãi bỏ.","b) Chức năng giám sát của HĐND chỉ áp dụng với cơ quan nhà nước ở trung ương.","c) HĐND giám sát việc thực hiện nghị quyết của chính mình.","d) HĐND có thể can thiệp trực tiếp vào hoạt động xét xử của Tòa án."],"answer":["T","F","T","F"],"explain":"a, c đúng. b sai vì HĐND giám sát ở địa phương. d sai vì Tòa án xét xử độc lập, chỉ tuân theo pháp luật; HĐND không can thiệp vào xét xử.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1},{"type":"mcq","level":"NB","q":"Theo Hiến pháp 2013, Hội đồng nhân dân quyết định những vấn đề nào?","options":["A. Các vấn đề của địa phương do luật định.","B. Mọi vấn đề của đất nước.","C. Các vấn đề đối ngoại của quốc gia.","D. Việc sửa đổi Hiến pháp."],"answer":"A","explain":"Điều 113 Hiến pháp 2013: Hội đồng nhân dân quyết định các vấn đề của địa phương do luật định.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau về chức năng của HĐND:","statements":["a) HĐND quyết định các vấn đề của địa phương do luật định.","b) HĐND giám sát việc tuân theo Hiến pháp và pháp luật ở địa phương.","c) HĐND giám sát hoạt động của UBND cùng cấp.","d) HĐND có quyền ban hành luật."],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 113 Hiến pháp 2013. d sai vì quyền lập pháp thuộc về Quốc hội.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1},{"type":"mcq","level":"VDC","q":"Phân tích ý nghĩa của việc Chủ tịch UBND cấp tỉnh do HĐND bầu nhưng phải được Thủ tướng Chính phủ phê chuẩn:","options":["A. Vừa bảo đảm quyền làm chủ của Nhân dân địa phương qua HĐND, vừa bảo đảm sự thống nhất quản lí của hệ thống hành chính nhà nước từ trung ương đến địa phương.","B. Làm mất tính dân chủ của chính quyền địa phương.","C. Chỉ là thủ tục hình thức, không có ý nghĩa thực tiễn.","D. Thể hiện HĐND không có thực quyền trong việc bầu UBND."],"answer":"A","explain":"Việc HĐND bầu thể hiện quyền làm chủ của Nhân dân địa phương; việc Thủ tướng phê chuẩn thể hiện UBND đồng thời là một mắt xích trong hệ thống hành chính nhà nước thống nhất từ trung ương đến địa phương.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"VD","q":"Sau kỳ họp HĐND, UBND huyện tổ chức triển khai nghị quyết về xây dựng nông thôn mới trên địa bàn. Việc này thể hiện UBND là:","options":["A. Cơ quan chấp hành của HĐND.","B. Cơ quan quyền lực nhà nước ở địa phương.","C. Cơ quan độc lập với HĐND.","D. Cơ quan xét xử."],"answer":"A","explain":"Tổ chức thực hiện nghị quyết của HĐND là biểu hiện rõ nhất của tính chất cơ quan chấp hành của HĐND của UBND.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"TH","q":"Các Ủy viên UBND gồm những ai?","options":["A. Người đứng đầu các cơ quan chuyên môn thuộc UBND và các Ủy viên phụ trách lĩnh vực theo quy định.","B. Tất cả các đại biểu HĐND.","C. Các Hội thẩm nhân dân.","D. Các đại biểu Quốc hội."],"answer":"A","explain":"Các Ủy viên UBND gồm người đứng đầu các cơ quan chuyên môn thuộc UBND và các Ủy viên phụ trách một số lĩnh vực công tác theo quy định.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"NB","q":"HĐND giám sát việc tuân theo Hiến pháp và pháp luật ở phạm vi nào?","options":["A. Ở địa phương.","B. Trên phạm vi cả nước.","C. Chỉ trong nội bộ cơ quan HĐND.","D. Chỉ đối với các doanh nghiệp."],"answer":"A","explain":"Điều 113: HĐND giám sát việc tuân theo Hiến pháp và pháp luật ở địa phương và việc thực hiện nghị quyết của HĐND.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"HĐND thực hiện chức năng gì đối với UBND cùng cấp?","options":["A. Giám sát hoạt động của UBND cùng cấp.","B. Chấp hành quyết định của UBND.","C. Xét xử các vụ việc của UBND.","D. Thực hành quyền công tố đối với UBND."],"answer":"A","explain":"Theo Điều 113, HĐND giám sát việc tuân theo Hiến pháp và pháp luật ở địa phương, trong đó có giám sát hoạt động của UBND cùng cấp.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"TH","q":"Chủ tịch UBND các cấp do ai bầu ra?","options":["A. HĐND cùng cấp bầu.","B. Nhân dân trực tiếp bầu.","C. Thủ tướng Chính phủ bổ nhiệm.","D. Chủ tịch nước bổ nhiệm."],"answer":"A","explain":"Chủ tịch UBND do HĐND cùng cấp bầu ra trong số các đại biểu HĐND (theo Luật Tổ chức chính quyền địa phương).","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"TH","q":"Trong các nhiệm vụ sau, nhiệm vụ nào thuộc về HĐND cấp tỉnh?","options":["A. Quyết định dự toán ngân sách địa phương và phân bổ ngân sách cấp mình.","B. Xét xử các vụ án hình sự trên địa bàn.","C. Ban hành luật.","D. Quyết định vấn đề chiến tranh và hòa bình."],"answer":"A","explain":"HĐND quyết định các vấn đề của địa phương do luật định, trong đó có việc quyết định dự toán và phân bổ ngân sách địa phương. Xét xử là chức năng của Tòa án, ban hành luật là của Quốc hội.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"VD","q":"Thành phố Hà Nội là đơn vị hành chính thuộc cấp nào?","options":["A. Cấp tỉnh (thành phố trực thuộc trung ương).","B. Cấp huyện.","C. Cấp xã.","D. Không thuộc cấp nào."],"answer":"A","explain":"Theo Điều 110, thành phố trực thuộc trung ương (như Hà Nội, Hải Phòng, Đà Nẵng, Cần Thơ, Huế) là đơn vị hành chính cấp tỉnh.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau về UBND theo Hiến pháp 2013:","statements":["a) UBND là cơ quan chấp hành của HĐND cùng cấp.","b) UBND là cơ quan hành chính nhà nước ở địa phương.","c) UBND do HĐND cùng cấp bầu ra.","d) UBND là cơ quan quyền lực nhà nước ở địa phương."],"answer":["T","T","T","F"],"explain":"a, b, c đúng theo Điều 114. d sai vì cơ quan quyền lực nhà nước ở địa phương là HĐND (Điều 113).","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1},{"type":"short","level":"VDC","q":"Vì sao Hiến pháp quy định cấp chính quyền địa phương được tổ chức phù hợp với đặc điểm nông thôn, đô thị, hải đảo?","answer":"Để bộ máy chính quyền phù hợp với điều kiện quản lí của từng địa bàn, nâng cao hiệu quả quản lí nhà nước","explain":"Điều 111 khoản 2: tổ chức phù hợp với đặc điểm nông thôn, đô thị, hải đảo nhằm nâng cao hiệu quả quản lí nhà nước ở từng loại địa bàn.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5},{"type":"mcq","level":"NB","q":"Ủy ban nhân dân do cơ quan nào bầu ra?","options":["A. Hội đồng nhân dân cùng cấp.","B. Quốc hội.","C. Chính phủ.","D. Nhân dân địa phương trực tiếp bầu."],"answer":"A","explain":"Điều 114 Hiến pháp 2013: Ủy ban nhân dân do Hội đồng nhân dân cùng cấp bầu ra.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"VDC","q":"Phân biệt chức năng quyết định và chức năng giám sát của HĐND:","options":["A. Quyết định là ban hành nghị quyết về các vấn đề của địa phương theo luật định; giám sát là theo dõi, kiểm tra việc tuân theo Hiến pháp, pháp luật và thực hiện nghị quyết, bao gồm giám sát UBND cùng cấp.","B. Hai chức năng này hoàn toàn giống nhau.","C. HĐND chỉ có chức năng quyết định.","D. HĐND chỉ có chức năng giám sát."],"answer":"A","explain":"Chức năng quyết định thể hiện quyền lực của HĐND qua các nghị quyết; chức năng giám sát bảo đảm các nghị quyết, pháp luật được thực hiện đúng, trong đó quan trọng nhất là giám sát UBND cùng cấp.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau:","statements":["a) Mọi công dân Việt Nam đều đương nhiên là đại biểu HĐND.","b) Đại biểu HĐND phải liên hệ chặt chẽ với cử tri, chịu sự giám sát của cử tri.","c) HĐND hoạt động chủ yếu thông qua các kỳ họp.","d) Kỳ họp HĐND do UBND triệu tập."],"answer":["F","T","T","F"],"explain":"b, c đúng theo Điều 115 và Luật Tổ chức chính quyền địa phương. a sai vì đại biểu HĐND phải do Nhân dân bầu ra. d sai vì kỳ họp HĐND do Thường trực HĐND triệu tập.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1},{"type":"short","level":"VD","q":"Ủy ban nhân dân phải báo cáo công tác trước những cơ quan nào?","answer":"HĐND cùng cấp và UBND cấp trên","explain":"UBND báo cáo công tác trước HĐND cùng cấp và Ủy ban nhân dân cấp trên (cơ quan hành chính nhà nước cấp trên).","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Theo Hiến pháp 2013, Hội đồng nhân dân chịu trách nhiệm trước những chủ thể nào?","options":["A. Chỉ trước Nhân dân địa phương.","B. Nhân dân địa phương và cơ quan nhà nước cấp trên.","C. Chỉ trước Quốc hội.","D. Chỉ trước Chính phủ."],"answer":"B","explain":"Điều 113 Hiến pháp 2013: Hội đồng nhân dân chịu trách nhiệm trước Nhân dân địa phương và cơ quan nhà nước cấp trên.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"short","level":"VDC","q":"Giải thích vì sao mối quan hệ HĐND – UBND được xem là biểu hiện của nguyên tắc quyền lực nhà nước thống nhất, có sự phân công, phối hợp, kiểm soát.","answer":"HĐND (quyền lực) bầu, giao nhiệm vụ và giám sát UBND (hành chính); UBND chấp hành và chịu trách nhiệm, bảo đảm quyền lực được kiểm soát","explain":"HĐND thực hiện quyền lực nhà nước ở địa phương thông qua quyết định và giám sát; UBND thực hiện chức năng hành chính, chấp hành và chịu trách nhiệm. Cơ chế bầu ra – chấp hành – giám sát – chịu trách nhiệm chính là sự phân công, phối hợp, kiểm soát quyền lực.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau về cơ cấu tổ chức của UBND:","statements":["a) UBND gồm Chủ tịch, Phó Chủ tịch và các Ủy viên.","b) Chủ tịch UBND là người đứng đầu UBND.","c) Mọi đại biểu HĐND đều đương nhiên là thành viên UBND.","d) Chủ tịch UBND do HĐND cùng cấp bầu ra."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai vì thành viên UBND do HĐND bầu ra trong số đại biểu HĐND, không phải mọi đại biểu đều là thành viên UBND.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1},{"type":"mcq","level":"TH","q":"UBND huyện ban hành quyết định trái với nghị quyết của HĐND huyện. Theo quy định, HĐND huyện có quyền:","options":["A. Bãi bỏ một phần hoặc toàn bộ quyết định trái pháp luật đó.","B. Không có quyền gì, phải chấp nhận.","C. Chỉ được góp ý, không được bãi bỏ.","D. Phải chờ Quốc hội xử lí."],"answer":"A","explain":"Theo Luật Tổ chức chính quyền địa phương, HĐND có quyền bãi bỏ một phần hoặc toàn bộ văn bản trái pháp luật của UBND, Chủ tịch UBND cùng cấp.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"VD","q":"Tại kỳ họp HĐND, đại biểu chất vấn Giám đốc Sở Giáo dục về chất lượng dạy học trên địa bàn. Đây là biểu hiện của chức năng nào của HĐND?","options":["A. Chức năng giám sát.","B. Chức năng lập pháp.","C. Chức năng hành pháp.","D. Chức năng tư pháp."],"answer":"A","explain":"Chất vấn là hình thức giám sát của đại biểu HĐND đối với hoạt động của các cơ quan, cá nhân có liên quan.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"VDC","q":"So sánh vị trí pháp lí của UBND với Chính phủ:","options":["A. Chính phủ là cơ quan hành chính nhà nước cao nhất, thực hiện quyền hành pháp; UBND là cơ quan hành chính nhà nước ở địa phương, chịu trách nhiệm trước cơ quan hành chính nhà nước cấp trên.","B. UBND ngang hàng với Chính phủ.","C. UBND là cơ quan quyền lực nhà nước cao nhất.","D. Chính phủ chịu sự lãnh đạo của UBND."],"answer":"A","explain":"Điều 94: Chính phủ là cơ quan hành chính nhà nước cao nhất, thực hiện quyền hành pháp. Điều 114: UBND là cơ quan hành chính nhà nước ở địa phương, chịu trách nhiệm trước cơ quan hành chính nhà nước cấp trên.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"short","level":"VD","q":"Kể tên ba cấp chính quyền địa phương ở nước ta.","answer":"Cấp tỉnh, cấp huyện, cấp xã","explain":"Chính quyền địa phương được tổ chức ở ba cấp: cấp tỉnh, cấp huyện và cấp xã; mỗi cấp đều có HĐND và UBND.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau:","statements":["a) UBND được ban hành quyết định, chỉ thị trong phạm vi nhiệm vụ, quyền hạn của mình.","b) Văn bản của UBND không được trái với văn bản của cơ quan nhà nước cấp trên.","c) UBND cấp xã không có chức năng quản lí hành chính nhà nước.","d) UBND chịu sự kiểm tra, giám sát của HĐND cùng cấp."],"answer":["T","T","F","T"],"explain":"a, b, d đúng. c sai vì UBND cấp xã vẫn là cơ quan hành chính nhà nước ở địa phương, thực hiện quản lí hành chính trên địa bàn xã.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1},{"type":"mcq","level":"NB","q":"Đại biểu Hội đồng nhân dân do ai bầu ra?","options":["A. Nhân dân địa phương.","B. Quốc hội.","C. Ủy ban nhân dân cùng cấp.","D. Mặt trận Tổ quốc."],"answer":"A","explain":"Đại biểu HĐND do Nhân dân địa phương bầu ra theo nguyên tắc phổ thông, bình đẳng, trực tiếp và bỏ phiếu kín.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"TH","q":"HĐND tỉnh X ban hành nghị quyết quy định mức thu học phí trên địa bàn tỉnh. Việc làm này thể hiện chức năng nào của HĐND?","options":["A. Chức năng quyết định các vấn đề của địa phương theo luật định.","B. Chức năng xét xử.","C. Chức năng hành pháp.","D. Chức năng thực hành quyền công tố."],"answer":"A","explain":"Ban hành nghị quyết về vấn đề của địa phương (mức thu học phí) là biểu hiện của chức năng quyết định các vấn đề của địa phương do luật định của HĐND.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"TH","q":"Vì sao Hiến pháp 2013 quy định HĐND đại diện cho ý chí, nguyện vọng của Nhân dân địa phương?","options":["A. Vì HĐND do Nhân dân địa phương bầu ra để thay mặt họ quyết định các vấn đề của địa phương.","B. Vì HĐND có quyền ban hành Hiến pháp.","C. Vì HĐND thay thế Quốc hội ở địa phương.","D. Vì mọi quyết định của HĐND đều không cần căn cứ pháp luật."],"answer":"A","explain":"Tính đại diện của HĐND bắt nguồn từ việc các đại biểu do Nhân dân địa phương bầu ra, thay mặt Nhân dân quyết định các vấn đề của địa phương theo luật định.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"VD","q":"HĐND tỉnh ra nghị quyết về hỗ trợ học sinh nghèo nhưng UBND tỉnh chậm triển khai. HĐND tỉnh có thể làm gì?","options":["A. Giám sát, chất vấn và yêu cầu UBND báo cáo, khắc phục; nếu văn bản của UBND trái pháp luật thì bãi bỏ.","B. Không thể làm gì vì đã giao cho UBND.","C. Trực tiếp thay UBND tổ chức triển khai.","D. Giải tán UBND tỉnh."],"answer":"A","explain":"HĐND có chức năng giám sát UBND: nghe báo cáo, chất vấn, yêu cầu khắc phục; có quyền bãi bỏ văn bản trái pháp luật của UBND cùng cấp.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"NB","q":"Hội đồng nhân dân đại diện cho ý chí, nguyện vọng và quyền làm chủ của ai?","options":["A. Nhân dân địa phương.","B. Cán bộ, công chức địa phương.","C. Đại biểu Quốc hội.","D. Các doanh nghiệp trên địa bàn."],"answer":"A","explain":"Theo Điều 113 Hiến pháp 2013, Hội đồng nhân dân đại diện cho ý chí, nguyện vọng và quyền làm chủ của Nhân dân địa phương.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"truefalse","level":"TH","q":"Đánh giá các nhận định sau về chính quyền địa phương:","statements":["a) Chính quyền địa phương được tổ chức ở các đơn vị hành chính của nước ta.","b) Cấp chính quyền địa phương gồm HĐND và UBND.","c) Xã, phường, thị trấn là đơn vị hành chính cấp huyện.","d) Thành phố trực thuộc trung ương là đơn vị hành chính cấp tỉnh."],"answer":["T","T","F","T"],"explain":"a, b, d đúng theo Điều 110, 111. c sai vì xã, phường, thị trấn là đơn vị hành chính cấp xã.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1},{"type":"mcq","level":"VDC","q":"UBND tỉnh ban hành quyết định thu hồi đất để thực hiện dự án công. Người dân không đồng ý, cho rằng quyết định trái pháp luật. Người dân có thể làm gì?","options":["A. Khiếu nại đến cơ quan hành chính cấp trên hoặc khởi kiện ra Tòa án theo luật định.","B. Không thể làm gì để bảo vệ quyền lợi.","C. Tự ý chống đối quyết định của UBND.","D. Chỉ được khiếu nại lên HĐND."],"answer":"A","explain":"Công dân có quyền khiếu nại quyết định hành chính, hành vi hành chính theo Luật Khiếu nại; đồng thời có quyền khởi kiện vụ án hành chính ra Tòa án theo Luật Tố tụng hành chính.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"truefalse","level":"NB","q":"Đánh giá các nhận định sau về UBND:","statements":["a) UBND chịu trách nhiệm trước HĐND cùng cấp.","b) UBND chịu trách nhiệm trước cơ quan hành chính nhà nước cấp trên.","c) UBND không phải báo cáo công tác trước HĐND.","d) UBND tổ chức thi hành Hiến pháp và pháp luật ở địa phương."],"answer":["T","T","F","T"],"explain":"a, b, d đúng theo Điều 114. c sai vì UBND phải báo cáo công tác trước HĐND cùng cấp và UBND cấp trên.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":1},{"type":"short","level":"VD","q":"Hoàn thành nhận định theo Điều 114 Hiến pháp 2013: Ủy ban nhân dân là cơ quan chấp hành của Hội đồng nhân dân, cơ quan ... ở địa phương.","answer":"hành chính nhà nước","explain":"Điều 114: Ủy ban nhân dân do HĐND cùng cấp bầu ra là cơ quan chấp hành của HĐND, cơ quan hành chính nhà nước ở địa phương.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5},{"type":"mcq","level":"NB","q":"Ủy ban nhân dân chịu trách nhiệm trước những chủ thể nào?","options":["A. HĐND cùng cấp và cơ quan hành chính nhà nước cấp trên.","B. Chỉ trước HĐND cùng cấp.","C. Chỉ trước Nhân dân địa phương.","D. Chỉ trước Quốc hội."],"answer":"A","explain":"Điều 114: UBND chịu trách nhiệm trước Hội đồng nhân dân và cơ quan hành chính nhà nước cấp trên.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"mcq","level":"TH","q":"Phát biểu nào sau đây thể hiện đúng tính chất đại diện cho quyền làm chủ của Nhân dân địa phương của HĐND?","options":["A. HĐND do Nhân dân địa phương trực tiếp bầu ra và chịu trách nhiệm trước Nhân dân địa phương.","B. HĐND do Chính phủ bổ nhiệm từ trên xuống.","C. HĐND chỉ gồm cán bộ chuyên trách do cấp trên cử về.","D. HĐND hoạt động độc lập, không chịu sự giám sát của ai."],"answer":"A","explain":"Vì do Nhân dân địa phương bầu ra và chịu trách nhiệm trước Nhân dân địa phương nên HĐND đại diện cho ý chí, nguyện vọng và quyền làm chủ của Nhân dân địa phương (Điều 113).","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.25},{"type":"short","level":"VDC","q":"Một thành phố thuộc tỉnh có cả HĐND và UBND không? Vì sao?","answer":"Có, vì thành phố thuộc tỉnh là đơn vị hành chính cấp huyện","explain":"Thành phố thuộc tỉnh là đơn vị hành chính cấp huyện (Điều 110); cấp chính quyền địa phương gồm HĐND và UBND (Điều 111) nên thành phố thuộc tỉnh có cả hai cơ quan này.","lesson":"Bài 23: Hội đồng nhân dân và Ủy ban nhân dân","points":0.5}]}]}
