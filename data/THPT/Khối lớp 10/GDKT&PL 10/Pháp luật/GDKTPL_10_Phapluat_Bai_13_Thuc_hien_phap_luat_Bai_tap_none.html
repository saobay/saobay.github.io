ẳng định sau về áp dụng pháp luật:", "statements": ["a) Áp dụng pháp luật là hoạt động của cơ quan nhà nước có thẩm quyền, ra quyết định làm phát sinh, thay đổi hoặc chấm dứt quan hệ pháp luật cụ thể.", "b) Thi hành pháp luật và tuân thủ pháp luật là một, không có gì khác nhau.", "c) Công dân thực hiện quyền khiếu nại, tố cáo là sử dụng pháp luật.", "d) Vi phạm pháp luật chỉ bao gồm hành động, không bao gồm không hành động."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: theo khái niệm áp dụng pháp luật. b) Sai: thi hành là làm điều bắt buộc, tuân thủ là không làm điều cấm. c) Đúng: khiếu nại, tố cáo là quyền pháp luật cho phép. d) Sai: không hành động (ví dụ không thực hiện nghĩa vụ bắt buộc) cũng có thể là vi phạm pháp luật.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Ông P là cán bộ thuế, lợi dụng chức vụ chiếm đoạt 50 triệu đồng tiền thuế của Nhà nước. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hành vi của ông P là vi phạm pháp luật.", "b) Ông P phải chịu trách nhiệm hình sự về tội tham ô tài sản.", "c) Ông P đồng thời có thể bị xử lý kỷ luật buộc thôi việc.", "d) Ông P chỉ phải chịu một loại trách nhiệm pháp lý duy nhất."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: chiếm đoạt tài sản là hành vi trái pháp luật, có lỗi. b) Đúng: lợi dụng chức vụ chiếm đoạt tài sản là tội tham ô tài sản. c) Đúng: cán bộ vi phạm còn bị xử lý kỷ luật. d) Sai: một hành vi có thể phải gánh chịu nhiều loại trách nhiệm pháp lý cùng lúc.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên loại trách nhiệm pháp lý mà người phạm tội phải gánh chịu. (Viết đầy đủ)", "answer": "Trách nhiệm hình sự", "explain": "Người phạm tội phải chịu trách nhiệm hình sự do Tòa án áp dụng với các chế tài như phạt tù, tử hình.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Có bao nhiêu loại trách nhiệm pháp lý? (Trả lời bằng số)", "answer": "4", "explain": "Có 4 loại trách nhiệm pháp lý: hình sự, hành chính, dân sự và kỷ luật.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Dấu hiệu nào sau đây KHÔNG phải là dấu hiệu của vi phạm pháp luật?", "options": ["A. Hành vi được dư luận đồng tình.", "B. Hành vi trái pháp luật.", "C. Có lỗi.", "D. Do chủ thể có năng lực trách nhiệm pháp lý thực hiện."], "answer": "A", "explain": "Dư luận đồng tình hay không không phải là dấu hiệu pháp lý. Ba dấu hiệu còn lại cùng với việc xâm hại quan hệ xã hội được pháp luật bảo vệ tạo thành vi phạm pháp luật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trách nhiệm pháp lý là gì?", "options": ["A. Nghĩa vụ đặc biệt mà cá nhân, tổ chức phải gánh chịu hậu quả bất lợi do Nhà nước áp đặt khi vi phạm pháp luật.", "B. Mọi nghĩa vụ của công dân trong xã hội.", "C. Hình phạt tù đối với người phạm tội.", "D. Tiền phạt vi phạm giao thông."], "answer": "A", "explain": "Trách nhiệm pháp lý là nghĩa vụ đặc biệt mà cá nhân, tổ chức phải gánh chịu hậu quả bất lợi từ Nhà nước khi vi phạm pháp luật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Có mấy loại trách nhiệm pháp lý?", "options": ["A. 4 loại: hình sự, hành chính, dân sự, kỷ luật.", "B. 2 loại: hình sự và dân sự.", "C. 3 loại: hình sự, hành chính, dân sự.", "D. 5 loại."], "answer": "A", "explain": "Có 4 loại trách nhiệm pháp lý: hình sự, hành chính, dân sự và kỷ luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hành vi nào sau đây là tuân thủ pháp luật?", "options": ["A. Không buôn bán, tàng trữ trái phép chất ma túy.", "B. Nộp thuế đúng thời hạn.", "C. Khởi kiện đòi nợ.", "D. Cảnh sát giao thông xử phạt người vượt đèn đỏ."], "answer": "A", "explain": "Không buôn bán ma túy là không làm điều pháp luật cấm nên là tuân thủ pháp luật. Phương án B là thi hành, C là sử dụng, D là áp dụng pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Người từ đủ 14 tuổi đến dưới 16 tuổi phải chịu trách nhiệm hình sự về", "options": ["A. tội rất nghiêm trọng và tội đặc biệt nghiêm trọng.", "B. mọi tội phạm.", "C. chỉ tội ít nghiêm trọng.", "D. không phải chịu trách nhiệm hình sự về tội nào."], "answer": "A", "explain": "Điều 12 Bộ luật Hình sự 2015 (sửa đổi, bổ sung 2017): người từ đủ 14 tuổi đến dưới 16 tuổi chỉ phải chịu trách nhiệm hình sự về tội rất nghiêm trọng và tội đặc biệt nghiêm trọng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn Q 13 tuổi lấy trộm xe đạp của bạn cùng lớp. Hành vi của Q", "options": ["A. là hành vi trái pháp luật nhưng Q chưa phải chịu trách nhiệm hình sự vì chưa đủ 14 tuổi.", "B. không phải là hành vi trái pháp luật vì Q còn nhỏ tuổi.", "C. phải chịu trách nhiệm hình sự về tội trộm cắp tài sản.", "D. phải chịu trách nhiệm kỷ luật."], "answer": "A", "explain": "Lấy trộm tài sản là hành vi trái pháp luật, nhưng Q mới 13 tuổi, chưa đến tuổi chịu trách nhiệm hình sự (từ đủ 14 tuổi) nên không bị truy cứu trách nhiệm hình sự; Q có thể bị xử lý hành chính hoặc giáo dục tại gia đình, nhà trường.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về trách nhiệm pháp lý:", "statements": ["a) Trách nhiệm hình sự chỉ áp dụng đối với người phạm tội.", "b) Trách nhiệm hành chính áp dụng đối với mọi hành vi vi phạm pháp luật.", "c) Bồi thường thiệt hại là chế tài của trách nhiệm dân sự.", "d) Trách nhiệm kỷ luật áp dụng với cán bộ, công chức, viên chức, người lao động vi phạm kỷ luật."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: chỉ người phạm tội mới phải chịu trách nhiệm hình sự. b) Sai: trách nhiệm hành chính chỉ áp dụng với vi phạm hành chính. c) Đúng: bồi thường thiệt hại là chế tài dân sự tiêu biểu. d) Đúng: theo khái niệm trách nhiệm kỷ luật.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Do mâu thuẫn, anh D đánh anh E gây thương tích. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hành vi của anh D là vi phạm pháp luật hình sự.", "b) Anh D phải chịu trách nhiệm hình sự về tội cố ý gây thương tích.", "c) Anh D còn phải bồi thường chi phí chữa bệnh cho anh E, đó là trách nhiệm dân sự.", "d) Nếu anh D mới 13 tuổi thì vẫn phải chịu trách nhiệm hình sự như người thành niên."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: cố ý gây thương tích là tội phạm. b) Đúng: người đủ tuổi phải chịu trách nhiệm hình sự. c) Đúng: bồi thường thiệt hại là trách nhiệm dân sự. d) Sai: người dưới 14 tuổi không phải chịu trách nhiệm hình sự.", "points": 1}, {"type": "short", "level": "VDC", "q": "Hình thức thực hiện pháp luật nào do cơ quan nhà nước có thẩm quyền tiến hành? (Viết đầy đủ)", "answer": "Áp dụng pháp luật", "explain": "Áp dụng pháp luật là hoạt động của cơ quan nhà nước có thẩm quyền, mang tính quyền lực nhà nước.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Người dưới 14 tuổi thực hiện hành vi nguy hiểm cho xã hội thì có phải chịu trách nhiệm hình sự không? (Trả lời: Có/Không)", "answer": "Không", "explain": "Theo Điều 12 Bộ luật Hình sự 2015 (sửa đổi, bổ sung 2017), chỉ người từ đủ 14 tuổi trở lên mới phải chịu trách nhiệm hình sự.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Lỗi trong vi phạm pháp luật bao gồm", "options": ["A. lỗi cố ý và lỗi vô ý.", "B. chỉ lỗi cố ý.", "C. chỉ lỗi vô ý.", "D. lỗi do hoàn cảnh khách quan."], "answer": "A", "explain": "Lỗi trong vi phạm pháp luật gồm lỗi cố ý (biết rõ hành vi nguy hiểm mà vẫn làm) và lỗi vô ý (do cẩu thả, chủ quan).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trách nhiệm hành chính được áp dụng khi", "options": ["A. cá nhân, tổ chức có hành vi vi phạm hành chính.", "B. cá nhân phạm tội.", "C. cá nhân vi phạm hợp đồng dân sự.", "D. cán bộ vi phạm kỷ luật lao động."], "answer": "A", "explain": "Trách nhiệm hành chính áp dụng đối với hành vi vi phạm hành chính với các chế tài như cảnh cáo, phạt tiền.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chế tài nào sau đây thuộc trách nhiệm hình sự?", "options": ["A. Phạt tù có thời hạn.", "B. Phạt tiền vi phạm giao thông.", "C. Bồi thường thiệt hại.", "D. Khiển trách."], "answer": "A", "explain": "Phạt tù là chế tài hình sự do Tòa án áp dụng với người phạm tội. Phạt tiền vi phạm giao thông là chế tài hành chính.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau cơ bản giữa tuân thủ pháp luật và thi hành pháp luật là", "options": ["A. tuân thủ là không làm điều pháp luật cấm, thi hành là làm điều pháp luật bắt buộc.", "B. tuân thủ do cơ quan nhà nước thực hiện, thi hành do công dân thực hiện.", "C. tuân thủ là tự nguyện, thi hành là bắt buộc.", "D. hai hình thức này không có điểm khác nhau."], "answer": "A", "explain": "Tuân thủ pháp luật: không làm những điều pháp luật cấm. Thi hành pháp luật: làm những việc pháp luật bắt buộc phải làm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hành vi nào sau đây thể hiện áp dụng pháp luật?", "options": ["A. Tòa án nhân dân xét xử vụ án trộm cắp tài sản.", "B. Công dân không sử dụng ma túy.", "C. Người lao động thực hiện đúng hợp đồng lao động.", "D. Học sinh đội mũ bảo hiểm khi đi xe đạp điện."], "answer": "A", "explain": "Tòa án xét xử là hoạt động của cơ quan nhà nước có thẩm quyền ra quyết định nên là áp dụng pháp luật.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Công ty X xả nước thải chưa qua xử lý ra sông gây ô nhiễm môi trường. Công ty X có thể phải chịu", "options": ["A. trách nhiệm hành chính (phạt tiền) và trách nhiệm dân sự (bồi thường thiệt hại).", "B. chỉ trách nhiệm kỷ luật.", "C. chỉ trách nhiệm hình sự.", "D. không phải chịu trách nhiệm pháp lý nào."], "answer": "A", "explain": "Xả thải gây ô nhiễm là vi phạm hành chính về môi trường (bị phạt tiền) và phải bồi thường thiệt hại cho người bị ảnh hưởng (trách nhiệm dân sự).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về dấu hiệu vi phạm pháp luật:", "statements": ["a) Mọi hành vi trái pháp luật đều là vi phạm pháp luật.", "b) Người thực hiện hành vi trong tình trạng mất khả năng nhận thức do bệnh tâm thần không bị coi là vi phạm pháp luật.", "c) Người vi phạm pháp luật phải gánh chịu trách nhiệm pháp lý tương ứng.", "d) Trách nhiệm pháp lý chỉ mang tính trừng phạt, không có tác dụng giáo dục, phòng ngừa."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: còn phải có lỗi và do chủ thể có năng lực trách nhiệm pháp lý thực hiện. b) Đúng: thiếu dấu hiệu chủ thể có năng lực trách nhiệm pháp lý. c) Đúng: vi phạm pháp luật là cơ sở áp dụng trách nhiệm pháp lý. d) Sai: trách nhiệm pháp lý vừa trừng phạt vừa giáo dục, phòng ngừa.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Chị L kinh doanh hàng hóa không rõ nguồn gốc, bị phạt tiền 20 triệu đồng và tịch thu toàn bộ hàng hóa. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hành vi của chị L là vi phạm hành chính.", "b) Phạt tiền và tịch thu tang vật là chế tài hành chính.", "c) Chị L phải chịu trách nhiệm hình sự.", "d) Nếu hàng hóa của chị L là hàng giả với số lượng lớn, chị L có thể bị truy cứu trách nhiệm hình sự."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: kinh doanh hàng không rõ nguồn gốc là vi phạm hành chính. b) Đúng: đây là các hình thức xử phạt vi phạm hành chính. c) Sai: với mức độ này chị L chỉ bị xử phạt hành chính. d) Đúng: buôn bán hàng giả đủ định lượng thì bị truy cứu trách nhiệm hình sự.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hình thức thực hiện pháp luật của hành vi: công dân thực hiện nghĩa vụ quân sự. (Viết đầy đủ)", "answer": "Thi hành pháp luật", "explain": "Nghĩa vụ quân sự là việc pháp luật bắt buộc công dân phải làm nên là thi hành (chấp hành) pháp luật.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hành vi không đội mũ bảo hiểm khi điều khiển xe mô tô bị xử phạt thuộc trách nhiệm pháp lý nào? (Viết đầy đủ)", "answer": "Trách nhiệm hành chính", "explain": "Không đội mũ bảo hiểm là vi phạm hành chính về giao thông nên bị xử phạt vi phạm hành chính.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Năng lực trách nhiệm pháp lý là", "options": ["A. khả năng của chủ thể phải gánh chịu hậu quả bất lợi khi vi phạm pháp luật.", "B. quyền cơ bản của công dân.", "C. nghĩa vụ nộp thuế của công dân.", "D. khả năng lao động của con người."], "answer": "A", "explain": "Năng lực trách nhiệm pháp lý là khả năng của chủ thể phải gánh chịu hậu quả bất lợi khi vi phạm pháp luật; đây là một dấu hiệu bắt buộc của vi phạm pháp luật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trách nhiệm dân sự phát sinh khi", "options": ["A. xâm phạm quan hệ tài sản, nhân thân trong lĩnh vực dân sự như vi phạm hợp đồng, gây thiệt hại ngoài hợp đồng.", "B. cá nhân phạm tội.", "C. cá nhân vi phạm hành chính.", "D. cán bộ vi phạm kỷ luật."], "answer": "A", "explain": "Trách nhiệm dân sự áp dụng khi xâm phạm quan hệ dân sự: vi phạm hợp đồng hoặc gây thiệt hại ngoài hợp đồng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chế tài nào sau đây thuộc trách nhiệm kỷ luật?", "options": ["A. Cảnh cáo, hạ bậc lương, cách chức, buộc thôi việc.", "B. Phạt tù có thời hạn.", "C. Phạt tiền vi phạm giao thông.", "D. Bồi thường thiệt hại."], "answer": "A", "explain": "Khiển trách, cảnh cáo, hạ bậc lương, giáng chức, cách chức, buộc thôi việc là các hình thức kỷ luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói áp dụng pháp luật mang tính quyền lực nhà nước?", "options": ["A. Vì chỉ cơ quan, người có thẩm quyền của Nhà nước mới được tiến hành theo trình tự, thủ tục chặt chẽ do pháp luật quy định.", "B. Vì mọi công dân đều có thể thực hiện.", "C. Vì không cần tuân theo trình tự, thủ tục nào.", "D. Vì mang lại lợi ích kinh tế cho người thực hiện."], "answer": "A", "explain": "Áp dụng pháp luật mang tính quyền lực nhà nước vì chủ thể là cơ quan, người có thẩm quyền và phải tiến hành theo trình tự, thủ tục chặt chẽ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Người điều khiển xe ô tô không sử dụng rượu, bia khi lái xe là thực hiện pháp luật dưới hình thức", "options": ["A. tuân thủ pháp luật.", "B. thi hành pháp luật.", "C. sử dụng pháp luật.", "D. áp dụng pháp luật."], "answer": "A", "explain": "Pháp luật cấm người lái xe sử dụng rượu, bia; không sử dụng là không làm điều pháp luật cấm nên là tuân thủ pháp luật.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Anh B say rượu lái xe gây tai nạn chết người rồi bỏ trốn. Anh B phải chịu", "options": ["A. trách nhiệm hình sự và trách nhiệm dân sự (bồi thường).", "B. chỉ trách nhiệm hành chính.", "C. chỉ trách nhiệm kỷ luật.", "D. không phải chịu trách nhiệm vì đang say rượu."], "answer": "A", "explain": "Say rượu không loại trừ trách nhiệm. Gây chết người rồi bỏ trốn là tội phạm nên chịu trách nhiệm hình sự, đồng thời phải bồi thường cho gia đình nạn nhân (trách nhiệm dân sự).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về các hình thức thực hiện pháp luật:", "statements": ["a) Sử dụng pháp luật là quyền của chủ thể, chủ thể có thể thực hiện hoặc không thực hiện.", "b) Thi hành pháp luật là nghĩa vụ bắt buộc, không thực hiện sẽ bị xử lý.", "c) Tuân thủ pháp luật chỉ áp dụng với công dân, không áp dụng với tổ chức.", "d) Áp dụng pháp luật phải tuân theo trình tự, thủ tục do pháp luật quy định."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: pháp luật cho phép nên chủ thể được quyền lựa chọn thực hiện. b) Đúng: pháp luật bắt buộc nên phải thực hiện. c) Sai: mọi chủ thể (cá nhân, tổ chức) đều phải tuân thủ pháp luật. d) Đúng: đặc điểm của áp dụng pháp luật.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Do bất cẩn, thợ điện C đấu nối sai gây chập điện làm cháy nhà hàng xóm. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hành vi của C là vi phạm pháp luật có lỗi vô ý.", "b) Lỗi vô ý thì không bị coi là vi phạm pháp luật.", "c) C phải bồi thường thiệt hại cho hàng xóm, đó là trách nhiệm dân sự.", "d) Nếu hậu quả đặc biệt nghiêm trọng, C có thể bị truy cứu trách nhiệm hình sự."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: do cẩu thả gây hậu quả là lỗi vô ý. b) Sai: lỗi vô ý vẫn là một dạng lỗi của vi phạm pháp luật. c) Đúng: bồi thường thiệt hại là trách nhiệm dân sự. d) Đúng: tùy mức độ hậu quả có thể bị truy cứu trách nhiệm hình sự.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hình thức thực hiện pháp luật của hành vi: Tòa án tuyên phạt bị cáo 3 năm tù. (Viết đầy đủ)", "answer": "Áp dụng pháp luật", "explain": "Tòa án là cơ quan nhà nước có thẩm quyền ra quyết định xét xử nên là áp dụng pháp luật.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vi phạm nội quy, quy chế của cơ quan, đơn vị thì phải chịu trách nhiệm pháp lý nào? (Viết đầy đủ)", "answer": "Trách nhiệm kỷ luật", "explain": "Vi phạm kỷ luật, nội quy cơ quan, đơn vị thì chịu trách nhiệm kỷ luật.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Pháp luật bắt buộc công dân phải làm gì thì công dân thực hiện dưới hình thức", "options": ["A. thi hành (chấp hành) pháp luật.", "B. tuân thủ pháp luật.", "C. sử dụng pháp luật.", "D. áp dụng pháp luật."], "answer": "A", "explain": "Làm những việc pháp luật bắt buộc phải làm là thi hành (chấp hành) pháp luật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Pháp luật cho phép công dân làm gì thì công dân thực hiện dưới hình thức", "options": ["A. sử dụng pháp luật.", "B. tuân thủ pháp luật.", "C. thi hành pháp luật.", "D. áp dụng pháp luật."], "answer": "A", "explain": "Làm những việc pháp luật cho phép làm là sử dụng pháp luật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Pháp luật cấm công dân làm gì mà công dân không làm, đó là", "options": ["A. tuân thủ pháp luật.", "B. thi hành pháp luật.", "C. sử dụng pháp luật.", "D. áp dụng pháp luật."], "answer": "A", "explain": "Không làm những điều pháp luật cấm là tuân thủ pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các hành vi sau, hành vi nào là vi phạm pháp luật?", "options": ["A. Người có năng lực trách nhiệm pháp lý cố ý hủy hoại tài sản của người khác.", "B. Em bé 3 tuổi làm vỡ lọ hoa của hàng xóm.", "C. Người đang lên cơn tâm thần đập phá đồ đạc.", "D. Người thực hiện hành vi phòng vệ chính đáng."], "answer": "A", "explain": "Phương án A có đủ 4 dấu hiệu vi phạm pháp luật. Phương án B, C thiếu dấu hiệu chủ thể có năng lực trách nhiệm pháp lý; phương án D là trường hợp loại trừ trách nhiệm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trách nhiệm pháp lý có ý nghĩa", "options": ["A. trừng phạt, giáo dục người vi phạm và phòng ngừa vi phạm trong xã hội.", "B. chỉ để trừng phạt người vi phạm.", "C. chỉ để tăng nguồn thu cho ngân sách.", "D. để trả thù người vi phạm."], "answer": "A", "explain": "Trách nhiệm pháp lý vừa trừng phạt người vi phạm, vừa giáo dục họ sửa chữa và phòng ngừa vi phạm chung trong xã hội.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhóm học sinh lớp 10 đánh nhau trong trường gây thương tích nhẹ cho bạn. Việc nhà trường xử lý kỷ luật các em thể hiện", "options": ["A. trách nhiệm kỷ luật.", "B. trách nhiệm hình sự.", "C. trách nhiệm hành chính.", "D. trách nhiệm dân sự."], "answer": "A", "explain": "Học sinh vi phạm nội quy nhà trường thì chịu trách nhiệm kỷ luật của nhà trường.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về vai trò của thực hiện pháp luật:", "statements": ["a) Thực hiện pháp luật giúp bảo vệ quyền và lợi ích hợp pháp của cá nhân, tổ chức.", "b) Chỉ khi vi phạm pháp luật, con người mới thực hiện pháp luật.", "c) Mọi chủ thể trong xã hội đều phải thực hiện pháp luật.", "d) Thực hiện pháp luật là cơ sở để xây dựng nhà nước pháp quyền."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: thực hiện tốt pháp luật thì quyền, lợi ích hợp pháp được bảo vệ. b) Sai: thực hiện pháp luật diễn ra hằng ngày qua tuân thủ, thi hành, sử dụng pháp luật. c) Đúng: mọi cá nhân, tổ chức đều phải thực hiện pháp luật. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Bà V bán hàng rong lấn chiếm lòng đường, bị phạt cảnh cáo. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hành vi của bà V là vi phạm hành chính.", "b) Cảnh cáo là một hình thức xử phạt vi phạm hành chính.", "c) Bà V phải chịu trách nhiệm hình sự.", "d) Việc xử phạt bà V thể hiện tính cưỡng chế của pháp luật."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: lấn chiếm lòng đường là vi phạm hành chính. b) Đúng: cảnh cáo là hình thức xử phạt vi phạm hành chính. c) Sai: mức độ này chỉ bị xử phạt hành chính. d) Đúng: xử phạt thể hiện tính cưỡng chế nhà nước của pháp luật.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hình thức thực hiện pháp luật của hành vi: công dân không sản xuất, buôn bán hàng giả. (Viết đầy đủ)", "answer": "Tuân thủ pháp luật", "explain": "Pháp luật cấm sản xuất, buôn bán hàng giả; không làm điều cấm là tuân thủ pháp luật.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hình thức thực hiện pháp luật của hành vi: công dân gửi đơn tố cáo hành vi tham nhũng. (Viết đầy đủ)", "answer": "Sử dụng pháp luật", "explain": "Tố cáo là quyền mà pháp luật cho phép công dân thực hiện nên là sử dụng pháp luật.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Theo Điều 12 Bộ luật Hình sự 2015 (sửa đổi, bổ sung 2017), người từ đủ bao nhiêu tuổi trở lên phải chịu trách nhiệm hình sự?", "options": ["A. Từ đủ 14 tuổi.", "B. Từ đủ 16 tuổi.", "C. Từ đủ 18 tuổi.", "D. Từ đủ 12 tuổi."], "answer": "A", "explain": "Điều 12 Bộ luật Hình sự 2015 (sửa đổi, bổ sung 2017) quy định người từ đủ 14 tuổi trở lên phải chịu trách nhiệm hình sự.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người từ đủ 16 tuổi trở lên phải chịu trách nhiệm hình sự về", "options": ["A. mọi tội phạm.", "B. chỉ tội rất nghiêm trọng.", "C. chỉ tội đặc biệt nghiêm trọng.", "D. chỉ tội ít nghiêm trọng."], "answer": "A", "explain": "Người từ đủ 16 tuổi trở lên phải chịu trách nhiệm hình sự về mọi tội phạm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việc người có thẩm quyền ra quyết định xử phạt vi phạm hành chính thể hiện hình thức", "options": ["A. áp dụng pháp luật.", "B. tuân thủ pháp luật.", "C. thi hành pháp luật.", "D. sử dụng pháp luật."], "answer": "A", "explain": "Người có thẩm quyền (Chủ tịch UBND, Cảnh sát giao thông...) ra quyết định xử phạt là áp dụng pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân biệt vi phạm hành chính và tội phạm căn cứ chủ yếu vào", "options": ["A. mức độ nguy hiểm cho xã hội của hành vi.", "B. ý thức chủ quan của người vi phạm.", "C. thái độ của dư luận xã hội.", "D. giá trị thiệt hại vật chất."], "answer": "A", "explain": "Tội phạm là hành vi nguy hiểm cho xã hội ở mức độ cao; vi phạm hành chính có mức độ nguy hiểm thấp hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hành vi nào sau đây KHÔNG phải là vi phạm pháp luật?", "options": ["A. Người dân thực hiện hành vi phòng vệ chính đáng.", "B. Người có năng lực trách nhiệm pháp lý cố ý trộm cắp tài sản.", "C. Cán bộ cố ý làm trái gây hậu quả nghiêm trọng.", "D. Người lái xe vượt quá tốc độ quy định."], "answer": "A", "explain": "Phòng vệ chính đáng là trường hợp loại trừ trách nhiệm, không bị coi là vi phạm pháp luật.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Anh N nhặt được ví tiền có 5 triệu đồng và giấy tờ tùy thân nhưng không trả lại mà chiếm đoạt tiêu xài. Hành vi của anh N", "options": ["A. vi phạm pháp luật, có thể bị xử phạt hành chính hoặc truy cứu trách nhiệm hình sự tùy giá trị và tình tiết.", "B. không vi phạm pháp luật vì của nhặt được thì được hưởng.", "C. chỉ vi phạm đạo đức xã hội.", "D. là hình thức sử dụng pháp luật."], "answer": "A", "explain": "Chiếm giữ trái phép tài sản do mình nhặt được là vi phạm pháp luật; tùy giá trị và tình tiết có thể bị xử phạt hành chính hoặc truy cứu trách nhiệm hình sự.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về tuổi chịu trách nhiệm hình sự:", "statements": ["a) Người từ đủ 14 tuổi đến dưới 16 tuổi chỉ phải chịu trách nhiệm hình sự về tội rất nghiêm trọng và tội đặc biệt nghiêm trọng.", "b) Người dưới 14 tuổi thực hiện hành vi nguy hiểm cho xã hội thì không phải chịu trách nhiệm hình sự.", "c) Người từ đủ 16 tuổi trở lên phải chịu trách nhiệm hình sự về mọi tội phạm.", "d) Người từ đủ 16 tuổi chỉ chịu trách nhiệm hình sự về tội đặc biệt nghiêm trọng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo Điều 12 Bộ luật Hình sự 2015 (sửa đổi, bổ sung 2017). d) Sai: từ đủ 16 tuổi phải chịu trách nhiệm hình sự về mọi tội phạm.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Công chức D thường xuyên đi muộn, bỏ việc riêng trong giờ làm và bị cơ quan cảnh cáo. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hành vi của D là vi phạm kỷ luật.", "b) Cảnh cáo là một hình thức kỷ luật.", "c) D đồng thời phải chịu trách nhiệm hình sự.", "d) Nếu D là người lao động trong doanh nghiệp, D cũng có thể bị xử lý kỷ luật lao động."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: vi phạm nội quy cơ quan là vi phạm kỷ luật. b) Đúng: cảnh cáo là hình thức kỷ luật. c) Sai: hành vi này chưa đến mức truy cứu trách nhiệm hình sự. d) Đúng: người lao động vi phạm kỷ luật lao động thì bị xử lý kỷ luật lao động.", "points": 1}, {"type": "short", "level": "VDC", "q": "Người từ đủ 16 tuổi trở lên phải chịu trách nhiệm hình sự về những tội nào? (Trả lời ngắn gọn)", "answer": "Mọi tội phạm", "explain": "Theo Điều 12 Bộ luật Hình sự 2015 (sửa đổi, bổ sung 2017), người từ đủ 16 tuổi trở lên phải chịu trách nhiệm hình sự về mọi tội phạm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu dấu hiệu dùng để phân biệt tội phạm với vi phạm hành chính. (Trả lời ngắn gọn)", "answer": "Mức độ nguy hiểm cho xã hội", "explain": "Tội phạm và vi phạm hành chính phân biệt chủ yếu ở mức độ nguy hiểm cho xã hội của hành vi.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Thực hiện pháp luật bao gồm mấy hình thức?", "options": ["A. 4 hình thức.", "B. 2 hình thức.", "C. 3 hình thức.", "D. 5 hình thức."], "answer": "A", "explain": "Có 4 hình thức thực hiện pháp luật: tuân thủ, thi hành (chấp hành), sử dụng và áp dụng pháp luật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hình thức thực hiện pháp luật nào thể hiện tính quyền lực nhà nước rõ nhất?", "options": ["A. Áp dụng pháp luật.", "B. Tuân thủ pháp luật.", "C. Thi hành pháp luật.", "D. Sử dụng pháp luật."], "answer": "A", "explain": "Áp dụng pháp luật do cơ quan nhà nước có thẩm quyền tiến hành nên thể hiện rõ nhất tính quyền lực nhà nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vi phạm pháp luật là hành vi", "options": ["A. trái pháp luật, có lỗi, do chủ thể có năng lực trách nhiệm pháp lý thực hiện.", "B. trái với chuẩn mực đạo đức.", "C. bị mọi người chê cười.", "D. gây thiệt hại nhỏ cho người khác."], "answer": "A", "explain": "Vi phạm pháp luật là hành vi trái pháp luật, có lỗi, do chủ thể có năng lực trách nhiệm pháp lý thực hiện, xâm hại quan hệ xã hội được pháp luật bảo vệ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nào sau đây nói đúng về mối quan hệ giữa vi phạm pháp luật và trách nhiệm pháp lý?", "options": ["A. Vi phạm pháp luật là cơ sở để áp dụng trách nhiệm pháp lý.", "B. Vi phạm pháp luật và trách nhiệm pháp lý không liên quan đến nhau.", "C. Chỉ vi phạm hình sự mới phải chịu trách nhiệm pháp lý.", "D. Trách nhiệm pháp lý được áp dụng tùy hứng, không cần căn cứ."], "answer": "A", "explain": "Chỉ khi có hành vi vi phạm pháp luật thì Nhà nước mới áp dụng trách nhiệm pháp lý tương ứng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cá nhân, tổ chức thực hiện tốt pháp luật sẽ", "options": ["A. được Nhà nước bảo vệ quyền, lợi ích hợp pháp và có thể được khen thưởng.", "B. không được lợi ích gì.", "C. bị hạn chế các quyền công dân.", "D. phải nộp thêm thuế."], "answer": "A", "explain": "Thực hiện tốt pháp luật thì quyền và lợi ích hợp pháp được Nhà nước bảo vệ; người có thành tích còn được khen thưởng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Thấy bạn cùng lớp bị đánh, em H quay clip đăng lên mạng xã hội kèm lời lẽ xúc phạm nạn nhân. Hành vi của H", "options": ["A. vi phạm pháp luật (xúc phạm danh dự, nhân phẩm người khác), có thể bị xử lý.", "B. là thực hiện quyền tự do ngôn luận nên không vi phạm.", "C. là hình thức sử dụng pháp luật.", "D. không ai xử lý được vì H còn là học sinh."], "answer": "A", "explain": "Xúc phạm danh dự, nhân phẩm người khác trên mạng xã hội là hành vi trái pháp luật, tùy mức độ có thể bị xử phạt hành chính hoặc truy cứu trách nhiệm hình sự.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về thực hiện và vi phạm pháp luật:", "statements": ["a) Pháp luật cấm thì không được làm; pháp luật bắt buộc thì phải làm; pháp luật cho phép thì được làm.", "b) Thực hiện đúng pháp luật là trách nhiệm của mọi công dân, tổ chức.", "c) Áp dụng pháp luật là quyền của mọi công dân.", "d) Vi phạm pháp luật ở mức độ nhỏ thì không phải chịu trách nhiệm pháp lý."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: tương ứng với tuân thủ, thi hành, sử dụng pháp luật. b) Đúng. c) Sai: áp dụng pháp luật chỉ do cơ quan nhà nước có thẩm quyền tiến hành. d) Sai: mọi vi phạm pháp luật đều phải gánh chịu trách nhiệm pháp lý tương ứng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Doanh nghiệp T trốn thuế 2 tỷ đồng. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hành vi trốn thuế của doanh nghiệp T là vi phạm pháp luật.", "b) Doanh nghiệp T có thể bị truy cứu trách nhiệm hình sự về tội trốn thuế.", "c) Ngoài bị phạt tiền, doanh nghiệp còn phải nộp đủ số thuế đã trốn.", "d) Trốn thuế chỉ bị xử phạt hành chính, không bao giờ bị truy cứu trách nhiệm hình sự."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: pháp nhân thương mại phạm tội trốn thuế có thể bị truy cứu trách nhiệm hình sự. c) Đúng: phải khắc phục hậu quả, nộp đủ thuế. d) Sai: trốn thuế đủ định lượng thì bị truy cứu trách nhiệm hình sự.", "points": 1}, {"type": "short", "level": "VDC", "q": "Tuổi chịu trách nhiệm hình sự được quy định tại điều nào của Bộ luật Hình sự 2015? (Trả lời: Điều ...)", "answer": "Điều 12", "explain": "Điều 12 Bộ luật Hình sự 2015 (sửa đổi, bổ sung 2017) quy định về tuổi chịu trách nhiệm hình sự.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Kể tên 4 loại trách nhiệm pháp lý. (Trả lời ngắn gọn)", "answer": "Hình sự, hành chính, dân sự, kỷ luật", "explain": "4 loại trách nhiệm pháp lý: hình sự, hành chính, dân sự và kỷ luật.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Việc thanh niên đủ 18 tuổi đăng ký thực hiện nghĩa vụ quân sự thuộc hình thức", "options": ["A. thi hành (chấp hành) pháp luật.", "B. tuân thủ pháp luật.", "C. sử dụng pháp luật.", "D. áp dụng pháp luật."], "answer": "A", "explain": "Nghĩa vụ quân sự là việc pháp luật bắt buộc công dân phải làm nên là thi hành (chấp hành) pháp luật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người dân không đốt pháo nổ trái phép trong dịp Tết là thực hiện pháp luật dưới hình thức", "options": ["A. tuân thủ pháp luật.", "B. thi hành pháp luật.", "C. sử dụng pháp luật.", "D. áp dụng pháp luật."], "answer": "A", "explain": "Pháp luật cấm đốt pháo nổ trái phép; không đốt là không làm điều pháp luật cấm nên là tuân thủ pháp luật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Công dân thực hiện quyền ứng cử đại biểu Quốc hội là hình thức", "options": ["A. sử dụng pháp luật.", "B. tuân thủ pháp luật.", "C. thi hành pháp luật.", "D. áp dụng pháp luật."], "answer": "A", "explain": "Ứng cử là quyền mà pháp luật cho phép công dân thực hiện nên là sử dụng pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao học sinh cần thực hiện tốt pháp luật?", "options": ["A. Để bảo vệ quyền, lợi ích của bản thân và góp phần xây dựng xã hội kỷ cương.", "B. Để được miễn mọi nghĩa vụ công dân.", "C. Để không bị ai quản lý.", "D. Để được ưu tiên trong mọi việc."], "answer": "A", "explain": "Thực hiện tốt pháp luật giúp học sinh bảo vệ quyền, lợi ích hợp pháp của mình và góp phần xây dựng xã hội kỷ cương, công bằng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong 4 hình thức thực hiện pháp luật, những hình thức nào mọi chủ thể đều có thể thực hiện?", "options": ["A. Tuân thủ, thi hành và sử dụng pháp luật.", "B. Chỉ áp dụng pháp luật.", "C. Chỉ tuân thủ pháp luật.", "D. Không có hình thức nào."], "answer": "A", "explain": "Áp dụng pháp luật chỉ do cơ quan nhà nước có thẩm quyền tiến hành; ba hình thức còn lại mọi cá nhân, tổ chức đều thực hiện được.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bà S mua phải hàng giả, bà làm đơn khiếu nại đến cơ quan bảo vệ người tiêu dùng và được giải quyết, cửa hàng phải bồi thường. Hành vi của bà S là", "options": ["A. sử dụng pháp luật.", "B. áp dụng pháp luật.", "C. thi hành pháp luật.", "D. tuân thủ pháp luật."], "answer": "A", "explain": "Khiếu nại là quyền pháp luật cho phép; bà S thực hiện quyền khiếu nại nên là sử dụng pháp luật.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về quyền và nghĩa vụ của công dân:", "statements": ["a) Nghĩa vụ quân sự là nghĩa vụ bắt buộc, thanh niên thực hiện là thi hành pháp luật.", "b) Quyền bầu cử là quyền mà công dân thực hiện dưới hình thức sử dụng pháp luật.", "c) Không thực hiện nghĩa vụ nộp thuế thì không bị xử lý.", "d) Mọi hành vi vi phạm pháp luật đều bị xử lý bằng hình phạt tù."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: nghĩa vụ quân sự là bắt buộc. b) Đúng: bầu cử là quyền pháp luật cho phép. c) Sai: trốn thuế bị xử phạt hành chính hoặc truy cứu trách nhiệm hình sự. d) Sai: chỉ tội phạm mới bị phạt tù; vi phạm hành chính, dân sự, kỷ luật có chế tài riêng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Anh G mượn xe máy của bạn đi rồi đem cầm cố lấy tiền tiêu xài. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hành vi của G là vi phạm pháp luật.", "b) G có thể bị truy cứu trách nhiệm hình sự về tội lạm dụng tín nhiệm chiếm đoạt tài sản.", "c) G phải trả lại xe hoặc bồi thường cho bạn, đó là trách nhiệm dân sự.", "d) Vì là bạn bè với nhau nên pháp luật không xử lý hành vi của G."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: mượn tài sản rồi chiếm đoạt là tội lạm dụng tín nhiệm chiếm đoạt tài sản. c) Đúng: phải trả lại tài sản hoặc bồi thường. d) Sai: quan hệ bạn bè không loại trừ trách nhiệm pháp lý.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hình thức thực hiện pháp luật của hành vi: người dân thực hiện đúng quy định về phòng cháy, chữa cháy. (Viết đầy đủ)", "answer": "Thi hành pháp luật", "explain": "Thực hiện quy định về phòng cháy, chữa cháy là làm việc pháp luật bắt buộc nên là thi hành (chấp hành) pháp luật.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Người thực hiện hành vi nguy hiểm cho xã hội nhưng đang mắc bệnh tâm thần làm mất khả năng nhận thức thì có bị coi là vi phạm pháp luật không? (Trả lời: Có/Không)", "answer": "Không", "explain": "Người mất khả năng nhận thức không có năng lực trách nhiệm pháp lý nên hành vi của họ không bị coi là vi phạm pháp luật.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Trách nhiệm pháp lý nào áp dụng đối với người phạm tội?", "options": ["A. Trách nhiệm hình sự.", "B. Trách nhiệm hành chính.", "C. Trách nhiệm dân sự.", "D. Trách nhiệm kỷ luật."], "answer": "A", "explain": "Người phạm tội phải chịu trách nhiệm hình sự do Tòa án áp dụng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trách nhiệm pháp lý nào áp dụng khi vi phạm hợp đồng dân sự?", "options": ["A. Trách nhiệm dân sự.", "B. Trách nhiệm hình sự.", "C. Trách nhiệm hành chính.", "D. Trách nhiệm kỷ luật."], "answer": "A", "explain": "Vi phạm hợp đồng dân sự thì phải chịu trách nhiệm dân sự như bồi thường thiệt hại, phạt vi phạm hợp đồng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lỗi cố ý trong vi phạm pháp luật là", "options": ["A. người thực hiện nhận thức rõ hành vi của mình là nguy hiểm cho xã hội mà vẫn thực hiện.", "B. người thực hiện không nhận thức được hành vi của mình.", "C. người thực hiện bị ép buộc phải làm.", "D. người thực hiện không có năng lực trách nhiệm pháp lý."], "answer": "A", "explain": "Lỗi cố ý: nhận thức rõ hành vi nguy hiểm cho xã hội, thấy trước hậu quả mà vẫn thực hiện và mong muốn hoặc để mặc hậu quả xảy ra.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một hành vi vi phạm có thể phải chịu mấy loại trách nhiệm pháp lý?", "options": ["A. Có thể phải chịu nhiều loại trách nhiệm pháp lý cùng lúc, ví dụ vừa trách nhiệm hình sự vừa trách nhiệm dân sự.", "B. Chỉ phải chịu một loại duy nhất.", "C. Không phải chịu loại nào.", "D. Do người vi phạm tự lựa chọn."], "answer": "A", "explain": "Một hành vi vi phạm có thể phải gánh chịu nhiều loại trách nhiệm cùng lúc, ví dụ gây tai nạn chết người vừa chịu trách nhiệm hình sự vừa bồi thường dân sự.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa của việc pháp luật quy định tuổi chịu trách nhiệm hình sự là", "options": ["A. thể hiện chính sách nhân đạo, phù hợp với sự phát triển tâm sinh lý của người chưa thành niên.", "B. để miễn trừ mọi trách nhiệm cho người chưa thành niên.", "C. để tăng nặng hình phạt với người trẻ tuổi.", "D. không có ý nghĩa thực tế."], "answer": "A", "explain": "Quy định tuổi chịu trách nhiệm hình sự thể hiện chính sách nhân đạo, giáo dục là chính đối với người chưa thành niên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Em K 16 tuổi điều khiển xe máy khi chưa có giấy phép lái xe và gây tai nạn. Em K", "options": ["A. vi phạm pháp luật và phải chịu trách nhiệm tương ứng vì đã đủ tuổi chịu trách nhiệm.", "B. không vi phạm pháp luật vì chưa thành niên.", "C. chỉ bị nhắc nhở, không bị xử lý.", "D. cha mẹ phải chịu thay mọi trách nhiệm của K."], "answer": "A", "explain": "K đã 16 tuổi, đủ tuổi chịu trách nhiệm hành chính, dân sự và trách nhiệm hình sự về mọi tội phạm nên phải chịu trách nhiệm tương ứng với hành vi và hậu quả gây ra.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về vi phạm pháp luật:", "statements": ["a) Vi phạm pháp luật có 4 dấu hiệu: hành vi trái pháp luật, có lỗi, do chủ thể có năng lực trách nhiệm pháp lý thực hiện, xâm hại quan hệ xã hội được pháp luật bảo vệ.", "b) Lỗi bao gồm lỗi cố ý và lỗi vô ý.", "c) Không hành động cũng có thể là vi phạm pháp luật.", "d) Trẻ em dưới 6 tuổi vi phạm giao thông thì phải chịu trách nhiệm hành chính."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: đủ 4 dấu hiệu. b) Đúng. c) Đúng: ví dụ không thực hiện nghĩa vụ bắt buộc. d) Sai: trẻ em dưới 6 tuổi không có năng lực trách nhiệm pháp lý.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Thấy tài sản của Nhà nước bị kẻ gian lấy trộm, anh T hô hoán và cùng mọi người bắt giữ kẻ trộm giao cho công an. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hành vi bắt giữ kẻ trộm của anh T là thực hiện pháp luật.", "b) Mọi người dân đều có trách nhiệm đấu tranh phòng, chống vi phạm pháp luật.", "c) Anh T đã thực hiện hình thức áp dụng pháp luật.", "d) Kẻ trộm phải chịu trách nhiệm pháp lý tương ứng."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: bắt quả tang kẻ phạm tội giao công an là hành vi đúng pháp luật. b) Đúng. c) Sai: áp dụng pháp luật chỉ do cơ quan nhà nước có thẩm quyền tiến hành; anh T là công dân. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Lỗi trong vi phạm pháp luật gồm mấy loại? Kể tên. (Trả lời ngắn gọn)", "answer": "2 loại: cố ý và vô ý", "explain": "Lỗi trong vi phạm pháp luật gồm 2 loại: lỗi cố ý và lỗi vô ý.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hình thức thực hiện pháp luật của hành vi: Cảnh sát giao thông lập biên bản xử phạt người không đội mũ bảo hiểm. (Viết đầy đủ)", "answer": "Áp dụng pháp luật", "explain": "Cảnh sát giao thông là người có thẩm quyền ra quyết định xử phạt nên là áp dụng pháp luật.", "points": 0.5}]}]}
