<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Theo Điều 102 Hiến pháp năm 2013, Tòa án nhân dân là cơ quan nào?","options":["A. Cơ quan xét xử của nước Cộng hòa xã hội chủ nghĩa Việt Nam, thực hiện quyền tư pháp.","B. Cơ quan hành chính nhà nước cao nhất.","C. Cơ quan thực hành quyền công tố.","D. Cơ quan lập pháp."],"answer":"A","explain":"Điều 102 Hiến pháp 2013: \"Tòa án nhân dân là cơ quan xét xử của nước Cộng hòa xã hội chủ nghĩa Việt Nam, thực hiện quyền tư pháp.\"","points":0.25},{"type":"mcq","level":"NB","q":"Theo Điều 107 Hiến pháp năm 2013, Viện kiểm sát nhân dân thực hiện chức năng nào?","options":["A. Xét xử các vụ án.","B. Thực hành quyền công tố, kiểm sát hoạt động tư pháp.","C. Ban hành luật.","D. Tổ chức thi hành án."],"answer":"B","explain":"Điều 107 Hiến pháp 2013: \"Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp.\"","points":0.25},{"type":"mcq","level":"TH","q":"Hệ thống Tòa án nhân dân ở nước ta gồm các cấp nào?","options":["A. Tòa án nhân dân tối cao, Tòa án nhân dân cấp cao, Tòa án nhân dân tỉnh, Tòa án nhân dân huyện và Tòa án quân sự.","B. Chỉ có Tòa án nhân dân tối cao.","C. Tòa án nhân dân và Viện kiểm sát nhân dân.","D. Chỉ có Tòa án nhân dân tỉnh và Tòa án nhân dân huyện."],"answer":"A","explain":"Hệ thống Tòa án nhân dân gồm: Tòa án nhân dân tối cao; Tòa án nhân dân cấp cao; Tòa án nhân dân tỉnh, thành phố trực thuộc trung ương; Tòa án nhân dân huyện, quận, thị xã, thành phố thuộc tỉnh; Tòa án quân sự.","points":0.25},{"type":"mcq","level":"TH","q":"Theo Điều 103, Thẩm phán, Hội thẩm khi xét xử phải tuân thủ nguyên tắc nào?","options":["A. Xét xử theo chỉ đạo của cơ quan cấp trên.","B. Xét xử độc lập và chỉ tuân theo pháp luật.","C. Xét xử theo ý kiến của Viện kiểm sát.","D. Xét xử theo dư luận xã hội."],"answer":"B","explain":"Điều 103 Hiến pháp 2013: \"Thẩm phán, Hội thẩm xét xử độc lập và chỉ tuân theo pháp luật; nghiêm cấm cơ quan, tổ chức, cá nhân can thiệp vào việc xét xử của Tòa án.\"","points":0.25},{"type":"mcq","level":"VD","q":"Tình huống: Trong một vụ án hình sự, bị cáo không có điều kiện thuê luật sư bào chữa. Theo Hiến pháp, Tòa án phải làm gì?","options":["A. Xét xử luôn mà không cần người bào chữa.","B. Bảo đảm quyền bào chữa của bị cáo, chỉ định người bào chữa cho bị cáo.","C. Hoãn xử vô thời hạn.","D. Chuyển vụ án cho Viện kiểm sát xét xử."],"answer":"B","explain":"Điều 103 Hiến pháp 2013: quyền bào chữa của bị cáo, quyền bảo vệ quyền và lợi ích hợp pháp của đương sự được bảo đảm. Chỉ Tòa án mới có chức năng xét xử.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định: \"Viện kiểm sát nhân dân là cơ quan xét xử vì Viện kiểm sát tham gia phiên tòa.\" Nhận định này:","options":["A. Đúng.","B. Sai, vì Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp; cơ quan xét xử là Tòa án nhân dân.","C. Đúng một phần.","D. Không xác định được."],"answer":"B","explain":"Theo Điều 102 và Điều 107 Hiến pháp 2013: Tòa án nhân dân là cơ quan xét xử; Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp. Kiểm sát viên tham gia phiên tòa để thực hành quyền công tố, không phải để xét xử.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về Tòa án nhân dân:","statements":["a) Tòa án nhân dân là cơ quan xét xử của nước ta.","b) Tòa án nhân dân tối cao là cơ quan xét xử cao nhất.","c) Tòa án nhân dân thực hiện quyền hành pháp.","d) Việc xét xử sơ thẩm của Tòa án nhân dân có Hội thẩm tham gia."],"answer":["T","T","F","T"],"explain":"a) Đúng (Điều 102). b) Đúng (Điều 102). c) Sai: Tòa án nhân dân thực hiện quyền tư pháp. d) Đúng (Điều 103).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về nguyên tắc xét xử:","statements":["a) Thẩm phán, Hội thẩm xét xử độc lập và chỉ tuân theo pháp luật.","b) Mọi cơ quan, tổ chức, cá nhân đều có quyền can thiệp vào việc xét xử.","c) Nguyên tắc tranh tụng trong xét xử được bảo đảm.","d) Tòa án xét xử tập thể và quyết định theo đa số."],"answer":["T","F","T","T"],"explain":"a) Đúng (Điều 103). b) Sai: nghiêm cấm cơ quan, tổ chức, cá nhân can thiệp vào việc xét xử (Điều 103). c) Đúng (Điều 103). d) Đúng: xét xử tập thể, quyết định theo đa số, trừ trường hợp xét xử theo thủ tục rút gọn (Điều 103).","points":1},{"type":"short","level":"NB","q":"Cơ quan xét xử cao nhất của nước ta có tên gọi là gì?","answer":"Tòa án nhân dân tối cao","explain":"Điều 102 Hiến pháp 2013: Tòa án nhân dân tối cao là cơ quan xét xử cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam.","points":0.5},{"type":"short","level":"VDC","q":"Theo Điều 103, việc xét xử của Tòa án nhân dân được tiến hành công khai; trong trường hợp đặc biệt phải xét xử kín thì việc tuyên án được thực hiện như thế nào?","answer":"Tuyên án công khai","explain":"Điều 103 Hiến pháp 2013: Tòa án xét xử công khai; trong trường hợp đặc biệt cần giữ bí mật nhà nước, thuần phong mỹ tục, bí mật cá nhân thì được xét xử kín nhưng phải tuyên án công khai.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Quyền tư pháp của Nhà nước do cơ quan nào thực hiện?","options":["A. Tòa án nhân dân.","B. Chính phủ.","C. Quốc hội.","D. Viện kiểm sát nhân dân."],"answer":"A","explain":"Điều 102 Hiến pháp 2013: Tòa án nhân dân là cơ quan xét xử, thực hiện quyền tư pháp.","points":0.25},{"type":"mcq","level":"NB","q":"Viện trưởng Viện kiểm sát nhân dân tối cao do cơ quan nào bầu, miễn nhiệm, bãi nhiệm?","options":["A. Chính phủ.","B. Quốc hội.","C. Chủ tịch nước.","D. Tòa án nhân dân tối cao."],"answer":"B","explain":"Điều 107 Hiến pháp 2013: Viện trưởng Viện kiểm sát nhân dân tối cao do Quốc hội bầu, miễn nhiệm, bãi nhiệm; chịu trách nhiệm và báo cáo công tác trước Quốc hội.","points":0.25},{"type":"mcq","level":"TH","q":"Hệ thống Viện kiểm sát nhân dân gồm các cấp nào?","options":["A. Viện kiểm sát nhân dân tối cao, cấp cao, tỉnh, huyện và Viện kiểm sát quân sự.","B. Chỉ có Viện kiểm sát nhân dân tối cao.","C. Chỉ có Viện kiểm sát nhân dân tỉnh và huyện.","D. Viện kiểm sát nhân dân và Tòa án nhân dân."],"answer":"A","explain":"Hệ thống Viện kiểm sát nhân dân gồm: Viện kiểm sát nhân dân tối cao; Viện kiểm sát nhân dân cấp cao; Viện kiểm sát nhân dân tỉnh, thành phố trực thuộc trung ương; Viện kiểm sát nhân dân huyện, quận, thị xã, thành phố thuộc tỉnh; Viện kiểm sát quân sự (Điều 109).","points":0.25},{"type":"mcq","level":"TH","q":"Chánh án Tòa án nhân dân tối cao do cơ quan nào bầu, miễn nhiệm, bãi nhiệm?","options":["A. Chính phủ.","B. Quốc hội.","C. Chủ tịch nước.","D. Ủy ban Thường vụ Quốc hội."],"answer":"B","explain":"Điều 70 Hiến pháp 2013: Quốc hội bầu, miễn nhiệm, bãi nhiệm Chánh án Tòa án nhân dân tối cao.","points":0.25},{"type":"mcq","level":"VD","q":"Tình huống: Một vụ án có tình tiết liên quan đến bí mật nhà nước. Hội đồng xét xử quyết định xét xử kín. Việc làm này có đúng Hiến pháp không?","options":["A. Không, vì mọi phiên tòa đều phải xét xử công khai.","B. Đúng, vì Hiến pháp cho phép xét xử kín trong trường hợp đặc biệt cần giữ bí mật; nhưng việc tuyên án vẫn phải công khai.","C. Đúng, và được tuyên án kín.","D. Sai, phải chuyển vụ án cho Viện kiểm sát xử."],"answer":"B","explain":"Điều 103 Hiến pháp 2013: Tòa án xét xử công khai; trong trường hợp đặc biệt cần giữ bí mật nhà nước, thuần phong mỹ tục, bí mật cá nhân thì được xét xử kín nhưng phải tuyên án công khai.","points":0.25},{"type":"mcq","level":"VDC","q":"Điểm khác nhau cơ bản về nguyên tắc tổ chức giữa Tòa án nhân dân và Viện kiểm sát nhân dân là:","options":["A. Tòa án xét xử độc lập, chỉ tuân theo pháp luật; Viện kiểm sát tổ chức theo nguyên tắc tập trung, thống nhất, Viện trưởng cấp dưới chịu sự lãnh đạo của Viện trưởng cấp trên.","B. Không có điểm khác nhau.","C. Cả hai đều do Viện trưởng lãnh đạo.","D. Cả hai đều xét xử độc lập, không chịu sự lãnh đạo tập trung."],"answer":"A","explain":"Điều 103: Thẩm phán, Hội thẩm xét xử độc lập và chỉ tuân theo pháp luật. Điều 109: Viện kiểm sát nhân dân tổ chức theo nguyên tắc tập trung, thống nhất; Viện trưởng cấp dưới chịu sự lãnh đạo của Viện trưởng cấp trên.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về Viện kiểm sát nhân dân:","statements":["a) Viện kiểm sát nhân dân thực hành quyền công tố.","b) Viện kiểm sát nhân dân kiểm sát hoạt động tư pháp.","c) Viện kiểm sát nhân dân là cơ quan xét xử.","d) Viện kiểm sát quân sự thuộc hệ thống Viện kiểm sát nhân dân."],"answer":["T","T","F","T"],"explain":"a) Đúng (Điều 107). b) Đúng (Điều 107). c) Sai: cơ quan xét xử là Tòa án nhân dân (Điều 102). d) Đúng (Điều 109).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về nhiệm vụ của hai cơ quan:","statements":["a) Tòa án nhân dân có nhiệm vụ bảo vệ công lý, bảo vệ quyền con người, quyền công dân.","b) Viện kiểm sát nhân dân có nhiệm vụ bảo vệ pháp luật, bảo vệ chế độ xã hội chủ nghĩa.","c) Tòa án nhân dân có nhiệm vụ thực hành quyền công tố.","d) Viện kiểm sát nhân dân góp phần bảo đảm pháp luật được chấp hành nghiêm chỉnh và thống nhất."],"answer":["T","T","F","T"],"explain":"a) Đúng (Điều 102). b) Đúng (Điều 107). c) Sai: thực hành quyền công tố là chức năng của Viện kiểm sát nhân dân (Điều 107). d) Đúng (Điều 107).","points":1},{"type":"short","level":"NB","q":"Theo Điều 107, Viện kiểm sát nhân dân thực hành quyền công tố và kiểm sát hoạt động nào?","answer":"Hoạt động tư pháp","explain":"Điều 107 Hiến pháp 2013: \"Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp.\"","points":0.5},{"type":"short","level":"VDC","q":"Ai là người bổ nhiệm, miễn nhiệm, cách chức Thẩm phán Tòa án nhân dân tối cao?","answer":"Chủ tịch nước","explain":"Điều 88 Hiến pháp 2013: Chủ tịch nước bổ nhiệm, miễn nhiệm, cách chức Thẩm phán Tòa án nhân dân tối cao.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Hội thẩm tham gia xét xử ở cấp xét xử nào?","options":["A. Xét xử sơ thẩm.","B. Xét xử phúc thẩm.","C. Giám đốc thẩm.","D. Tái thẩm."],"answer":"A","explain":"Điều 103 Hiến pháp 2013: việc xét xử sơ thẩm của Tòa án nhân dân có Hội thẩm tham gia (trừ trường hợp xét xử theo thủ tục rút gọn).","points":0.25},{"type":"mcq","level":"NB","q":"Tòa án quân sự thuộc hệ thống cơ quan nào?","options":["A. Viện kiểm sát nhân dân.","B. Tòa án nhân dân.","C. Chính phủ.","D. Cơ quan độc lập ngoài hệ thống Tòa án."],"answer":"B","explain":"Tòa án quân sự là một bộ phận trong hệ thống Tòa án nhân dân, xét xử các vụ án thuộc thẩm quyền liên quan đến quân nhân, quốc phòng.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên tắc tranh tụng trong xét xử được hiểu là:","options":["A. Các bên đưa ra chứng cứ, tranh luận công khai tại phiên tòa để bảo vệ quyền, lợi ích hợp pháp của mình.","B. Thẩm phán tranh luận với Hội thẩm.","C. Viện kiểm sát tranh luận với Tòa án.","D. Bị cáo tự bào chữa mà không cần luật sư."],"answer":"A","explain":"Điều 103 Hiến pháp 2013: nguyên tắc tranh tụng trong xét xử được bảo đảm — các bên (Kiểm sát viên, người bào chữa, bị cáo, đương sự) đưa ra chứng cứ và tranh luận tại phiên tòa.","points":0.25},{"type":"mcq","level":"TH","q":"Tòa án nhân dân xét xử và quyết định theo nguyên tắc nào?","options":["A. Thẩm phán quyết định một mình.","B. Xét xử tập thể và quyết định theo đa số, trừ trường hợp xét xử theo thủ tục rút gọn.","C. Mọi quyết định phải được 100% thành viên tán thành.","D. Theo ý kiến của Viện kiểm sát."],"answer":"B","explain":"Điều 103 Hiến pháp 2013: Tòa án nhân dân xét xử tập thể và quyết định theo đa số, trừ trường hợp xét xử theo thủ tục rút gọn.","points":0.25},{"type":"mcq","level":"VD","q":"Tình huống: Tại phiên tòa sơ thẩm, Hội thẩm nhân dân biểu quyết khác với Thẩm phán chủ tọa. Kết quả vụ án được quyết định như thế nào?","options":["A. Theo ý kiến của Thẩm phán chủ tọa.","B. Theo đa số biểu quyết của Hội đồng xét xử.","C. Theo ý kiến của Kiểm sát viên.","D. Hoãn phiên tòa để xin ý kiến cấp trên."],"answer":"B","explain":"Điều 103 Hiến pháp 2013: Tòa án xét xử tập thể và quyết định theo đa số; Hội thẩm nhân dân khi xét xử ngang quyền với Thẩm phán.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao Hiến pháp quy định \"Thẩm phán, Hội thẩm xét xử độc lập và chỉ tuân theo pháp luật\"?","options":["A. Để Thẩm phán không chịu sự giám sát của bất kỳ ai.","B. Để bảo đảm việc xét xử công bằng, khách quan, đúng pháp luật, không bị chi phối bởi bất kỳ sự can thiệp nào.","C. Để Thẩm phán có quyền làm luật.","D. Để tách Tòa án khỏi bộ máy nhà nước."],"answer":"B","explain":"Nguyên tắc xét xử độc lập, chỉ tuân theo pháp luật (Điều 103) nhằm bảo đảm mọi bản án, quyết định đều công bằng, khách quan, đúng pháp luật; nghiêm cấm mọi sự can thiệp vào việc xét xử.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về hệ thống Tòa án:","statements":["a) Tòa án nhân dân cấp cao xét xử phúc thẩm các bản án sơ thẩm chưa có hiệu lực bị kháng cáo, kháng nghị.","b) Tòa án nhân dân huyện xét xử sơ thẩm các vụ việc theo thẩm quyền.","c) Tòa án quân sự xét xử mọi vụ án hình sự trên cả nước.","d) Tòa án nhân dân tối cao giám đốc thẩm, tái thẩm các bản án đã có hiệu lực bị kháng nghị."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: Tòa án quân sự chỉ xét xử các vụ án thuộc thẩm quyền liên quan đến quân nhân, quốc phòng. d) Đúng.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về tổ chức Viện kiểm sát:","statements":["a) Viện trưởng Viện kiểm sát nhân dân cấp dưới chịu sự lãnh đạo của Viện trưởng cấp trên.","b) Viện kiểm sát nhân dân tỉnh chịu sự lãnh đạo của Viện trưởng Viện kiểm sát nhân dân tối cao.","c) Viện kiểm sát nhân dân các cấp hoạt động độc lập, không chịu sự lãnh đạo tập trung.","d) Viện kiểm sát nhân dân thực hành quyền công tố trong điều tra, truy tố, xét xử các vụ án hình sự."],"answer":["T","T","F","T"],"explain":"a) Đúng (Điều 109). b) Đúng: toàn ngành Kiểm sát chịu sự lãnh đạo tập trung, thống nhất của Viện trưởng Viện kiểm sát nhân dân tối cao. c) Sai. d) Đúng.","points":1},{"type":"short","level":"NB","q":"Theo Điều 103, Thẩm phán, Hội thẩm xét xử độc lập và chỉ tuân theo điều gì?","answer":"Pháp luật","explain":"Điều 103 Hiến pháp 2013: \"Thẩm phán, Hội thẩm xét xử độc lập và chỉ tuân theo pháp luật.\"","points":0.5},{"type":"short","level":"VDC","q":"Quyết định truy tố bị can ra trước Tòa án để xét xử là thẩm quyền của cơ quan nào?","answer":"Viện kiểm sát nhân dân","explain":"Viện kiểm sát nhân dân thực hành quyền công tố, trong đó có quyền quyết định truy tố bị can ra trước Tòa án (Điều 107 Hiến pháp 2013).","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Chế độ xét xử nào được Hiến pháp bảo đảm?","options":["A. Chỉ xét xử sơ thẩm.","B. Xét xử sơ thẩm, phúc thẩm.","C. Chỉ xét xử phúc thẩm.","D. Chỉ xét xử kín."],"answer":"B","explain":"Điều 103 Hiến pháp 2013: chế độ xét xử sơ thẩm, phúc thẩm được bảo đảm.","points":0.25},{"type":"mcq","level":"NB","q":"Những chức danh nào sau đây do Quốc hội bầu: (1) Chánh án Tòa án nhân dân tối cao; (2) Viện trưởng Viện kiểm sát nhân dân tối cao?","options":["A. Chỉ (1).","B. Chỉ (2).","C. Cả (1) và (2).","D. Không chức danh nào."],"answer":"C","explain":"Điều 70 Hiến pháp 2013: Quốc hội bầu, miễn nhiệm, bãi nhiệm Chánh án Tòa án nhân dân tối cao; Điều 107: Viện trưởng Viện kiểm sát nhân dân tối cao do Quốc hội bầu, miễn nhiệm, bãi nhiệm.","points":0.25},{"type":"mcq","level":"TH","q":"Viện kiểm sát nhân dân kiểm sát hoạt động của các cơ quan nào?","options":["A. Chỉ kiểm sát Tòa án.","B. Cơ quan điều tra, Tòa án, cơ quan thi hành án và các hoạt động tư pháp khác theo luật định.","C. Chỉ kiểm sát Chính phủ.","D. Chỉ kiểm sát Quốc hội."],"answer":"B","explain":"Viện kiểm sát nhân dân kiểm sát hoạt động tư pháp, trong đó có hoạt động của cơ quan điều tra, Tòa án, cơ quan thi hành án theo luật định (Điều 107).","points":0.25},{"type":"mcq","level":"TH","q":"Quyền bào chữa của bị cáo, quyền bảo vệ quyền và lợi ích hợp pháp của đương sự được:","options":["A. Hạn chế.","B. Bảo đảm.","C. Bãi bỏ trong các vụ án nghiêm trọng.","D. Do Viện kiểm sát quyết định."],"answer":"B","explain":"Điều 103 Hiến pháp 2013: quyền bào chữa của bị cáo, quyền bảo vệ quyền và lợi ích hợp pháp của đương sự được bảo đảm.","points":0.25},{"type":"mcq","level":"VD","q":"Tình huống: Sau phiên tòa sơ thẩm, bị cáo không đồng ý với bản án và làm đơn kháng cáo. Vụ án sẽ được xem xét lại theo thủ tục nào, tại cấp Tòa án nào?","options":["A. Giám đốc thẩm tại Tòa án nhân dân tối cao.","B. Xét xử phúc thẩm tại Tòa án nhân dân cấp trên.","C. Xét xử sơ thẩm lại tại cùng cấp.","D. Viện kiểm sát xét xử lại."],"answer":"B","explain":"Bản án sơ thẩm chưa có hiệu lực bị kháng cáo, kháng nghị được xét xử lại theo thủ tục phúc thẩm tại Tòa án cấp trên trực tiếp (chế độ xét xử sơ thẩm, phúc thẩm được bảo đảm — Điều 103).","points":0.25},{"type":"mcq","level":"VDC","q":"Mối quan hệ giữa Viện kiểm sát nhân dân và Tòa án nhân dân được thể hiện đúng là:","options":["A. Viện kiểm sát lãnh đạo Tòa án.","B. Viện kiểm sát kiểm sát hoạt động tư pháp nhưng không được can thiệp vào việc xét xử độc lập, chỉ tuân theo pháp luật của Thẩm phán, Hội thẩm.","C. Tòa án lãnh đạo Viện kiểm sát.","D. Hai cơ quan hoàn toàn không liên quan đến nhau."],"answer":"B","explain":"Điều 107: Viện kiểm sát kiểm sát hoạt động tư pháp; Điều 103: Thẩm phán, Hội thẩm xét xử độc lập, chỉ tuân theo pháp luật, nghiêm cấm mọi sự can thiệp. Hai chức năng này phối hợp nhưng không can thiệp lẫn nhau.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về việc xét xử:","statements":["a) Tòa án nhân dân xét xử công khai.","b) Mọi phiên tòa đều phải xét xử kín.","c) Khi xét xử kín, việc tuyên án vẫn phải công khai.","d) Bị cáo có quyền tự bào chữa hoặc nhờ người khác bào chữa."],"answer":["T","F","T","T"],"explain":"a) Đúng (Điều 103). b) Sai: Tòa án xét xử công khai, chỉ xét xử kín trong trường hợp đặc biệt. c) Đúng (Điều 103). d) Đúng: quyền bào chữa của bị cáo được bảo đảm (Điều 103).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về thẩm quyền:","statements":["a) Tòa án nhân dân có quyền xét xử và ra bản án, quyết định.","b) Viện kiểm sát nhân dân có quyền ra bản án.","c) Viện kiểm sát nhân dân có quyền kháng nghị bản án, quyết định của Tòa án.","d) Viện kiểm sát nhân dân phê chuẩn các quyết định tố tụng của cơ quan điều tra theo luật định."],"answer":["T","F","T","T"],"explain":"a) Đúng (Điều 102). b) Sai: chỉ Tòa án mới có quyền ra bản án. c) Đúng: kiểm sát hoạt động tư pháp bao gồm quyền kháng nghị (Điều 107). d) Đúng: thực hành quyền công tố trong hoạt động điều tra.","points":1},{"type":"short","level":"NB","q":"Tòa án nhân dân thực hiện quyền nào của Nhà nước?","answer":"Quyền tư pháp","explain":"Điều 102 Hiến pháp 2013: Tòa án nhân dân là cơ quan xét xử, thực hiện quyền tư pháp.","points":0.5},{"type":"short","level":"VDC","q":"Theo Điều 102, Tòa án nhân dân tối cao là cơ quan xét xử như thế nào?","answer":"Cao nhất","explain":"Điều 102 Hiến pháp 2013: Tòa án nhân dân tối cao là cơ quan xét xử cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Nhiệm vụ của Tòa án nhân dân KHÔNG bao gồm nội dung nào?","options":["A. Bảo vệ công lý.","B. Bảo vệ quyền con người, quyền công dân.","C. Thực hành quyền công tố.","D. Bảo vệ chế độ xã hội chủ nghĩa."],"answer":"C","explain":"Điều 102 Hiến pháp 2013 quy định nhiệm vụ của Tòa án nhân dân là bảo vệ công lý, bảo vệ quyền con người, quyền công dân, bảo vệ chế độ xã hội chủ nghĩa. Thực hành quyền công tố là chức năng của Viện kiểm sát nhân dân (Điều 107).","points":0.25},{"type":"mcq","level":"NB","q":"Nhiệm vụ của Viện kiểm sát nhân dân KHÔNG bao gồm nội dung nào?","options":["A. Bảo vệ pháp luật.","B. Thực hành quyền công tố, kiểm sát hoạt động tư pháp.","C. Xét xử các vụ án.","D. Bảo vệ quyền con người, quyền công dân."],"answer":"C","explain":"Điều 107 Hiến pháp 2013: Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp; bảo vệ pháp luật, bảo vệ quyền con người, quyền công dân. Xét xử là chức năng của Tòa án nhân dân (Điều 102).","points":0.25},{"type":"mcq","level":"TH","q":"Tòa án nhân dân tối cao có nhiệm vụ, quyền hạn nào sau đây?","options":["A. Xét xử sơ thẩm mọi vụ án.","B. Giám đốc thẩm, tái thẩm; tổng kết thực tiễn xét xử, bảo đảm áp dụng thống nhất pháp luật.","C. Thực hành quyền công tố.","D. Ban hành luật."],"answer":"B","explain":"Tòa án nhân dân tối cao là cơ quan xét xử cao nhất; thực hiện giám đốc thẩm, tái thẩm các bản án, quyết định đã có hiệu lực bị kháng nghị; tổng kết thực tiễn xét xử, bảo đảm áp dụng thống nhất pháp luật.","points":0.25},{"type":"mcq","level":"TH","q":"Viện kiểm sát nhân dân tối cao do ai lãnh đạo?","options":["A. Chánh án Tòa án nhân dân tối cao.","B. Viện trưởng Viện kiểm sát nhân dân tối cao.","C. Thủ tướng Chính phủ.","D. Chủ tịch nước."],"answer":"B","explain":"Điều 109 Hiến pháp 2013: Viện kiểm sát nhân dân do Viện trưởng lãnh đạo; Viện trưởng Viện kiểm sát nhân dân tối cao lãnh đạo toàn ngành.","points":0.25},{"type":"mcq","level":"VD","q":"Tình huống: Cơ quan điều tra muốn khởi tố bị can trong một vụ án hình sự. Theo luật định, quyết định khởi tố bị can phải được cơ quan nào phê chuẩn?","options":["A. Tòa án nhân dân.","B. Viện kiểm sát nhân dân.","C. Chính phủ.","D. Ủy ban Thường vụ Quốc hội."],"answer":"B","explain":"Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động điều tra (Điều 107); theo Bộ luật Tố tụng hình sự, quyết định khởi tố bị can phải được Viện kiểm sát phê chuẩn.","points":0.25},{"type":"mcq","level":"VDC","q":"So sánh: Tòa án nhân dân và Viện kiểm sát nhân dân đều:","options":["A. Là cơ quan xét xử.","B. Thuộc hệ thống các cơ quan tư pháp, có nhiệm vụ bảo vệ pháp luật, bảo vệ quyền con người, quyền công dân.","C. Do Chính phủ thành lập.","D. Thực hiện quyền hành pháp."],"answer":"B","explain":"Cả Tòa án nhân dân (Điều 102) và Viện kiểm sát nhân dân (Điều 107) đều có nhiệm vụ bảo vệ pháp luật, bảo vệ quyền con người, quyền công dân, bảo vệ chế độ xã hội chủ nghĩa; cùng chịu sự giám sát của Quốc hội.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về nguyên tắc:","statements":["a) Thẩm phán xét xử độc lập nên không chịu sự giám sát của Quốc hội.","b) Nghiêm cấm cơ quan, tổ chức, cá nhân can thiệp vào việc xét xử của Tòa án.","c) Hội thẩm nhân dân khi xét xử ngang quyền với Thẩm phán.","d) Tòa án nhân dân bảo đảm và bảo vệ quyền con người, quyền công dân."],"answer":["F","T","T","T"],"explain":"a) Sai: Quốc hội thực hiện quyền giám sát tối cao đối với toàn bộ hoạt động của Nhà nước; độc lập trong xét xử không có nghĩa là không chịu sự giám sát. b) Đúng (Điều 103). c) Đúng. d) Đúng (Điều 103).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về tổ chức:","statements":["a) Hệ thống Tòa án nhân dân đặt dưới sự lãnh đạo tập trung về mặt tổ chức của Tòa án nhân dân tối cao.","b) Thẩm phán cấp dưới phải tuân theo chỉ đạo xét xử của Thẩm phán cấp trên trong từng vụ án cụ thể.","c) Viện kiểm sát nhân dân do Viện trưởng lãnh đạo.","d) Chánh án Tòa án nhân dân tối cao chịu trách nhiệm và báo cáo công tác trước Quốc hội."],"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai: Thẩm phán, Hội thẩm xét xử độc lập và chỉ tuân theo pháp luật (Điều 103). c) Đúng (Điều 109). d) Đúng (Điều 70).","points":1},{"type":"short","level":"NB","q":"Theo Hiến pháp 2013, việc xét xử sơ thẩm của Tòa án nhân dân có sự tham gia của ai?","answer":"Hội thẩm nhân dân","explain":"Điều 103 Hiến pháp 2013: việc xét xử sơ thẩm của Tòa án nhân dân có Hội thẩm tham gia.","points":0.5},{"type":"short","level":"VDC","q":"Nêu hai chức năng của Viện kiểm sát nhân dân theo Điều 107 Hiến pháp 2013?","answer":"Thực hành quyền công tố, kiểm sát hoạt động tư pháp","explain":"Điều 107 Hiến pháp 2013: \"Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp.\"","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Cơ quan nào có chức năng kiểm sát hoạt động tư pháp?","options":["A. Tòa án nhân dân.","B. Viện kiểm sát nhân dân.","C. Chính phủ.","D. Quốc hội."],"answer":"B","explain":"Điều 107 Hiến pháp 2013: Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp.","points":0.25},{"type":"mcq","level":"NB","q":"Theo Điều 107, Viện kiểm sát nhân dân có nhiệm vụ bảo vệ:","options":["A. Chế độ xã hội chủ nghĩa, lợi ích của Nhà nước, quyền và lợi ích hợp pháp của tổ chức, cá nhân.","B. Quyền lợi riêng của bị cáo.","C. Hoạt động của Chính phủ.","D. Quyền lập pháp của Quốc hội."],"answer":"A","explain":"Điều 107 Hiến pháp 2013: Viện kiểm sát nhân dân có nhiệm vụ bảo vệ pháp luật, bảo vệ quyền con người, quyền công dân, bảo vệ chế độ xã hội chủ nghĩa, bảo vệ lợi ích của Nhà nước, quyền và lợi ích hợp pháp của tổ chức, cá nhân.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm giống nhau giữa Tòa án nhân dân và Viện kiểm sát nhân dân là:","options":["A. Đều là cơ quan xét xử.","B. Đều có nhiệm vụ bảo vệ pháp luật, bảo vệ quyền con người, quyền công dân và chịu sự giám sát của Quốc hội.","C. Đều do Chính phủ lãnh đạo.","D. Đều thực hiện quyền hành pháp."],"answer":"B","explain":"Cả hai cơ quan đều có nhiệm vụ bảo vệ pháp luật, bảo vệ quyền con người, quyền công dân (Điều 102, Điều 107) và đều chịu sự giám sát tối cao của Quốc hội.","points":0.25},{"type":"mcq","level":"TH","q":"Khi phát hiện bản án sơ thẩm có vi phạm pháp luật, Viện kiểm sát nhân dân có quyền:","options":["A. Tự sửa bản án.","B. Kháng nghị theo thủ tục phúc thẩm.","C. Hủy bản án.","D. Xét xử lại vụ án."],"answer":"B","explain":"Kiểm sát hoạt động tư pháp bao gồm quyền kháng nghị bản án, quyết định của Tòa án khi phát hiện vi phạm pháp luật (Điều 107). Viện kiểm sát không có quyền xét xử hay tự sửa, hủy bản án.","points":0.25},{"type":"mcq","level":"VD","q":"Tình huống: Một người dân gọi điện cho Thẩm phán đề nghị xử nhẹ cho người thân. Hành vi này vi phạm quy định nào của Hiến pháp?","options":["A. Không vi phạm quy định nào.","B. Vi phạm quy định nghiêm cấm cơ quan, tổ chức, cá nhân can thiệp vào việc xét xử (Điều 103).","C. Vi phạm quyền bào chữa của bị cáo.","D. Vi phạm nguyên tắc tranh tụng."],"answer":"B","explain":"Điều 103 Hiến pháp 2013: \"Thẩm phán, Hội thẩm xét xử độc lập và chỉ tuân theo pháp luật; nghiêm cấm cơ quan, tổ chức, cá nhân can thiệp vào việc xét xử của Tòa án.\"","points":0.25},{"type":"mcq","level":"VDC","q":"Đánh giá nhận định: \"Vì Thẩm phán xét xử độc lập nên không ai được giám sát hoạt động xét xử của Tòa án.\"","options":["A. Đúng.","B. Sai, vì Quốc hội thực hiện quyền giám sát tối cao đối với toàn bộ hoạt động của Nhà nước, trong đó có hoạt động của Tòa án; độc lập xét xử không có nghĩa là không chịu sự giám sát.","C. Đúng một phần.","D. Không xác định được."],"answer":"B","explain":"Điều 70: Quốc hội giám sát tối cao đối với hoạt động của Nhà nước. Nguyên tắc xét xử độc lập (Điều 103) có nghĩa là không ai được can thiệp vào việc xét xử từng vụ án cụ thể, chứ không có nghĩa Tòa án đứng ngoài sự giám sát của Quốc hội.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về chức năng:","statements":["a) Tòa án nhân dân thực hiện quyền tư pháp.","b) Viện kiểm sát nhân dân thực hành quyền công tố.","c) Chính phủ thực hiện quyền tư pháp.","d) Quốc hội thực hiện quyền giám sát tối cao đối với Tòa án, Viện kiểm sát."],"answer":["T","T","F","T"],"explain":"a) Đúng (Điều 102). b) Đúng (Điều 107). c) Sai: Chính phủ thực hiện quyền hành pháp (Điều 94). d) Đúng (Điều 70).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về phiên tòa:","statements":["a) Phiên tòa xét xử phải bảo đảm nguyên tắc tranh tụng.","b) Kiểm sát viên thực hành quyền công tố tại phiên tòa.","c) Người bào chữa được tham gia tranh tụng tại phiên tòa.","d) Hội đồng xét xử quyết định theo ý kiến của Kiểm sát viên."],"answer":["T","T","T","F"],"explain":"a) Đúng (Điều 103). b) Đúng (Điều 107). c) Đúng: quyền bào chữa được bảo đảm (Điều 103). d) Sai: Hội đồng xét xử quyết định theo đa số (Điều 103).","points":1},{"type":"short","level":"NB","q":"Kể tên hai cấp Tòa án nhân dân ở địa phương?","answer":"Tòa án nhân dân tỉnh và Tòa án nhân dân huyện","explain":"Hệ thống Tòa án nhân dân ở địa phương gồm Tòa án nhân dân tỉnh, thành phố trực thuộc trung ương và Tòa án nhân dân huyện, quận, thị xã, thành phố thuộc tỉnh.","points":0.5},{"type":"short","level":"VDC","q":"Theo Điều 109 Hiến pháp 2013, ai là người lãnh đạo Viện kiểm sát nhân dân tối cao và toàn ngành Kiểm sát?","answer":"Viện trưởng Viện kiểm sát nhân dân tối cao","explain":"Điều 109 Hiến pháp 2013: Viện kiểm sát nhân dân do Viện trưởng lãnh đạo; Viện trưởng Viện kiểm sát nhân dân tối cao lãnh đạo Viện kiểm sát nhân dân các cấp và Viện kiểm sát quân sự.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Theo Điều 102, Tòa án nhân dân có nhiệm vụ bảo vệ:","options":["A. Công lý, quyền con người, quyền công dân, chế độ xã hội chủ nghĩa.","B. Quyền hành pháp.","C. Hoạt động của Chính phủ.","D. Quyền lập pháp."],"answer":"A","explain":"Điều 102 Hiến pháp 2013: Tòa án nhân dân có nhiệm vụ bảo vệ công lý, bảo vệ quyền con người, quyền công dân, bảo vệ chế độ xã hội chủ nghĩa, bảo vệ lợi ích của Nhà nước, quyền và lợi ích hợp pháp của tổ chức, cá nhân.","points":0.25},{"type":"mcq","level":"NB","q":"Viện kiểm sát nhân dân có nhiệm vụ bảo vệ:","options":["A. Pháp luật, quyền con người, quyền công dân, chế độ xã hội chủ nghĩa.","B. Quyền tư pháp khỏi sự kiểm sát.","C. Hoạt động xét xử của Tòa án.","D. Quyền hành pháp."],"answer":"A","explain":"Điều 107 Hiến pháp 2013: Viện kiểm sát nhân dân có nhiệm vụ bảo vệ pháp luật, bảo vệ quyền con người, quyền công dân, bảo vệ chế độ xã hội chủ nghĩa.","points":0.25},{"type":"mcq","level":"TH","q":"Sự khác nhau cơ bản giữa xét xử sơ thẩm và xét xử phúc thẩm là:","options":["A. Sơ thẩm là xét xử lần đầu; phúc thẩm là xét xử lại bản án, quyết định sơ thẩm chưa có hiệu lực bị kháng cáo, kháng nghị.","B. Không có sự khác nhau.","C. Phúc thẩm do Viện kiểm sát tiến hành.","D. Sơ thẩm không có Hội thẩm tham gia."],"answer":"A","explain":"Xét xử sơ thẩm là cấp xét xử lần đầu; xét xử phúc thẩm là cấp xét xử lại vụ án mà bản án, quyết định sơ thẩm chưa có hiệu lực bị kháng cáo hoặc kháng nghị (chế độ xét xử sơ thẩm, phúc thẩm được bảo đảm — Điều 103).","points":0.25},{"type":"mcq","level":"TH","q":"Trong phiên tòa hình sự, người thực hành quyền công tố là:","options":["A. Thẩm phán.","B. Kiểm sát viên.","C. Luật sư.","D. Hội thẩm."],"answer":"B","explain":"Kiểm sát viên là người được Viện trưởng Viện kiểm sát phân công thực hành quyền công tố tại phiên tòa (Điều 107).","points":0.25},{"type":"mcq","level":"VD","q":"Tình huống: Bản án sơ thẩm đã có hiệu lực pháp luật nhưng sau đó phát hiện có vi phạm nghiêm trọng trong việc áp dụng pháp luật. Thủ tục nào được áp dụng để xem xét lại bản án?","options":["A. Phúc thẩm.","B. Giám đốc thẩm.","C. Xét xử sơ thẩm lại.","D. Kháng cáo."],"answer":"B","explain":"Bản án, quyết định đã có hiệu lực pháp luật bị kháng nghị được xem xét lại theo thủ tục giám đốc thẩm tại Tòa án nhân dân tối cao hoặc Tòa án nhân dân cấp cao theo thẩm quyền.","points":0.25},{"type":"mcq","level":"VDC","q":"Hệ thống Tòa án nhân dân và Viện kiểm sát nhân dân đều có Tòa án quân sự và Viện kiểm sát quân sự. Điều này thể hiện:","options":["A. Quân đội đứng ngoài pháp luật.","B. Mọi cơ quan, tổ chức, cá nhân đều bình đẳng trước pháp luật; các vụ việc liên quan đến quân nhân, quốc phòng được xét xử, kiểm sát bởi cơ quan chuyên trách trong hệ thống chung.","C. Tòa án quân sự độc lập hoàn toàn với hệ thống Tòa án nhân dân.","D. Viện kiểm sát quân sự thuộc Bộ Quốc phòng."],"answer":"B","explain":"Tòa án quân sự và Viện kiểm sát quân sự là bộ phận trong hệ thống Tòa án nhân dân và Viện kiểm sát nhân dân, thể hiện nguyên tắc mọi người đều bình đẳng trước pháp luật (Điều 16).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về quyền con người trong tố tụng:","statements":["a) Tòa án nhân dân có nhiệm vụ bảo vệ quyền con người, quyền công dân.","b) Mọi người đều bình đẳng trước pháp luật.","c) Không ai bị coi là có tội khi chưa có bản án kết tội của Tòa án đã có hiệu lực pháp luật.","d) Tòa án có thể kết tội khi chưa có chứng cứ."],"answer":["T","T","T","F"],"explain":"a) Đúng (Điều 102, Điều 103). b) Đúng (Điều 16). c) Đúng (Điều 31). d) Sai: việc kết tội phải căn cứ vào chứng cứ và theo trình tự luật định.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về tranh tụng:","statements":["a) Nguyên tắc tranh tụng bảo đảm các bên được đưa ra chứng cứ, tranh luận tại phiên tòa.","b) Tranh tụng chỉ áp dụng trong vụ án hình sự.","c) Việc bảo đảm tranh tụng giúp phiên tòa khách quan, công bằng hơn.","d) Thẩm phán, Hội thẩm phải lắng nghe ý kiến tranh tụng của các bên trước khi nghị án."],"answer":["T","F","T","T"],"explain":"a) Đúng (Điều 103). b) Sai: nguyên tắc tranh tụng được bảo đảm trong xét xử nói chung. c) Đúng. d) Đúng.","points":1},{"type":"short","level":"NB","q":"Nguyên tắc nào trong xét xử được bảo đảm để các bên đưa ra chứng cứ, tranh luận tại phiên tòa?","answer":"Nguyên tắc tranh tụng","explain":"Điều 103 Hiến pháp 2013: nguyên tắc tranh tụng trong xét xử được bảo đảm.","points":0.5},{"type":"short","level":"VDC","q":"Theo Điều 103, ngoài xét xử độc lập, Tòa án nhân dân còn phải bảo đảm và bảo vệ quyền gì?","answer":"Quyền con người, quyền công dân","explain":"Điều 103 Hiến pháp 2013: Tòa án nhân dân bảo đảm và bảo vệ quyền con người, quyền công dân.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Cơ quan nào sau đây thuộc hệ thống Tòa án nhân dân?","options":["A. Tòa án nhân dân cấp cao.","B. Viện kiểm sát nhân dân cấp cao.","C. Ủy ban Thường vụ Quốc hội.","D. Hội đồng nhân dân."],"answer":"A","explain":"Tòa án nhân dân cấp cao thuộc hệ thống Tòa án nhân dân (tối cao – cấp cao – tỉnh – huyện – Tòa án quân sự).","points":0.25},{"type":"mcq","level":"NB","q":"Cơ quan nào sau đây thuộc hệ thống Viện kiểm sát nhân dân?","options":["A. Tòa án nhân dân tối cao.","B. Viện kiểm sát nhân dân tối cao.","C. Chính phủ.","D. Kiểm toán nhà nước."],"answer":"B","explain":"Viện kiểm sát nhân dân tối cao là cơ quan đứng đầu hệ thống Viện kiểm sát nhân dân (Điều 109).","points":0.25},{"type":"mcq","level":"TH","q":"Thẩm phán, Hội thẩm \"chỉ tuân theo pháp luật\" có nghĩa là:","options":["A. Chỉ áp dụng pháp luật khi xét xử, không bị chi phối bởi bất kỳ sự can thiệp nào.","B. Được tự ý làm luật.","C. Không cần tuân thủ pháp luật tố tụng.","D. Chỉ nghe theo chỉ đạo của cấp trên."],"answer":"A","explain":"Điều 103 Hiến pháp 2013: Thẩm phán, Hội thẩm xét xử độc lập và chỉ tuân theo pháp luật; nghiêm cấm mọi sự can thiệp vào việc xét xử.","points":0.25},{"type":"mcq","level":"TH","q":"Viện kiểm sát nhân dân kiểm sát việc tuân theo pháp luật trong các hoạt động nào?","options":["A. Chỉ trong hoạt động xét xử.","B. Trong hoạt động điều tra, truy tố, xét xử, thi hành án và các hoạt động tư pháp khác.","C. Chỉ trong hoạt động của Chính phủ.","D. Chỉ trong hoạt động của Quốc hội."],"answer":"B","explain":"Viện kiểm sát nhân dân kiểm sát hoạt động tư pháp, bao gồm việc tuân theo pháp luật trong hoạt động điều tra, truy tố, xét xử, thi hành án theo luật định (Điều 107).","points":0.25},{"type":"mcq","level":"VD","q":"Tình huống: Tại phiên tòa, luật sư bào chữa đưa ra chứng cứ mới chứng minh bị cáo ngoại phạm; Kiểm sát viên vẫn giữ quan điểm truy tố. Hội đồng xét xử cần làm gì?","options":["A. Nghe theo Kiểm sát viên.","B. Xem xét, đánh giá toàn diện các chứng cứ và ý kiến tranh tụng của các bên rồi mới nghị án, quyết định.","C. Tuyên bị cáo vô tội ngay lập tức.","D. Hoãn phiên tòa vô thời hạn."],"answer":"B","explain":"Theo nguyên tắc tranh tụng và xét xử độc lập, chỉ tuân theo pháp luật (Điều 103), Hội đồng xét xử phải đánh giá toàn diện chứng cứ, ý kiến các bên rồi quyết định theo đa số.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định: \"Tòa án nhân dân tối cao vừa xét xử, vừa tổng kết thực tiễn xét xử để bảo đảm áp dụng thống nhất pháp luật.\" Nhận định này:","options":["A. Sai, vì Tòa án tối cao chỉ xét xử.","B. Đúng.","C. Sai, vì việc tổng kết thực tiễn xét xử thuộc về Viện kiểm sát.","D. Sai, vì việc bảo đảm áp dụng thống nhất pháp luật thuộc về Quốc hội."],"answer":"B","explain":"Tòa án nhân dân tối cao là cơ quan xét xử cao nhất; đồng thời tổng kết thực tiễn xét xử, bảo đảm áp dụng thống nhất pháp luật trong xét xử.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về tổ chức bộ máy:","statements":["a) Tòa án nhân dân và Viện kiểm sát nhân dân đều chịu sự lãnh đạo của Đảng Cộng sản Việt Nam.","b) Tòa án nhân dân chịu sự quản lý hành chính của Chính phủ.","c) Viện kiểm sát nhân dân chịu sự giám sát của Quốc hội.","d) Chánh án Tòa án nhân dân tối cao do Thủ tướng bổ nhiệm."],"answer":["T","F","T","F"],"explain":"a) Đúng (Điều 4). b) Sai: Tòa án nhân dân là cơ quan xét xử độc lập, không chịu sự quản lý hành chính của Chính phủ. c) Đúng: Quốc hội giám sát tối cao đối với hoạt động của Nhà nước (Điều 70). d) Sai: Chánh án Tòa án nhân dân tối cao do Quốc hội bầu (Điều 70).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về bản án:","statements":["a) Bản án, quyết định của Tòa án đã có hiệu lực pháp luật phải được thi hành.","b) Mọi bản án đều có thể kháng cáo theo thủ tục phúc thẩm.","c) Viện kiểm sát có quyền kháng nghị bản án sơ thẩm chưa có hiệu lực.","d) Đương sự có quyền kháng cáo bản án sơ thẩm chưa có hiệu lực."],"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai: chỉ bản án, quyết định sơ thẩm chưa có hiệu lực mới bị kháng cáo, kháng nghị theo thủ tục phúc thẩm; bản án đã có hiệu lực được xem xét theo thủ tục giám đốc thẩm, tái thẩm. c) Đúng. d) Đúng.","points":1},{"type":"short","level":"NB","q":"Chánh án Tòa án nhân dân tối cao và Viện trưởng Viện kiểm sát nhân dân tối cao do cơ quan nào bầu?","answer":"Quốc hội","explain":"Điều 70 và Điều 107 Hiến pháp 2013: Chánh án Tòa án nhân dân tối cao và Viện trưởng Viện kiểm sát nhân dân tối cao do Quốc hội bầu, miễn nhiệm, bãi nhiệm.","points":0.5},{"type":"short","level":"VDC","q":"Nêu tên đầy đủ của cơ quan thực hành quyền công tố cao nhất ở nước ta?","answer":"Viện kiểm sát nhân dân tối cao","explain":"Viện kiểm sát nhân dân tối cao thực hành quyền công tố, kiểm sát hoạt động tư pháp trong phạm vi cả nước (Điều 107, Điều 109).","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Theo Hiến pháp 2013, xét xử là chức năng của cơ quan nào?","options":["A. Viện kiểm sát nhân dân.","B. Tòa án nhân dân.","C. Chính phủ.","D. Quốc hội."],"answer":"B","explain":"Điều 102 Hiến pháp 2013: Tòa án nhân dân là cơ quan xét xử của nước Cộng hòa xã hội chủ nghĩa Việt Nam.","points":0.25},{"type":"mcq","level":"NB","q":"Theo Hiến pháp 2013, thực hành quyền công tố là chức năng của cơ quan nào?","options":["A. Tòa án nhân dân.","B. Viện kiểm sát nhân dân.","C. Cơ quan điều tra.","D. Luật sư."],"answer":"B","explain":"Điều 107 Hiến pháp 2013: Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các nhận định sau, nhận định nào đúng?","options":["A. Viện kiểm sát nhân dân là cơ quan xét xử.","B. Tòa án nhân dân thực hành quyền công tố.","C. Tòa án nhân dân xét xử; Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp.","D. Cả hai cơ quan đều thực hiện quyền hành pháp."],"answer":"C","explain":"Điều 102: Tòa án nhân dân là cơ quan xét xử, thực hiện quyền tư pháp. Điều 107: Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp.","points":0.25},{"type":"mcq","level":"TH","q":"Hội thẩm nhân dân tham gia xét xử thể hiện bản chất nào của Nhà nước ta?","options":["A. Nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân — Nhân dân tham gia vào hoạt động xét xử.","B. Nhà nước tập quyền.","C. Nhà nước quân chủ.","D. Không thể hiện bản chất gì."],"answer":"A","explain":"Điều 2 Hiến pháp 2013: Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam là Nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân. Việc Hội thẩm nhân dân tham gia xét xử sơ thẩm (Điều 103) là biểu hiện của bản chất đó.","points":0.25},{"type":"mcq","level":"VD","q":"Tình huống: Một bản án sơ thẩm tuyên bị cáo 5 năm tù; bị cáo kháng cáo kêu oan; Viện kiểm sát kháng nghị theo hướng tăng nặng. Tòa án cấp phúc thẩm sẽ:","options":["A. Chỉ xem xét kháng cáo của bị cáo.","B. Xem xét lại toàn bộ vụ án trong phạm vi kháng cáo, kháng nghị.","C. Tuyên giữ nguyên án sơ thẩm.","D. Chuyển vụ án cho Tòa án nhân dân tối cao xử."],"answer":"B","explain":"Xét xử phúc thẩm là việc Tòa án cấp trên trực tiếp xét xử lại vụ án mà bản án sơ thẩm chưa có hiệu lực bị kháng cáo, kháng nghị; phạm vi xét xử phúc thẩm theo nội dung kháng cáo, kháng nghị.","points":0.25},{"type":"mcq","level":"VDC","q":"Tổng hợp kiến thức: Trong bộ máy nhà nước ta, quyền tư pháp do Tòa án nhân dân thực hiện; vậy vai trò của Viện kiểm sát nhân dân đối với hoạt động tư pháp là:","options":["A. Không có vai trò gì.","B. Thực hành quyền công tố và kiểm sát hoạt động tư pháp, góp phần bảo đảm hoạt động tư pháp đúng pháp luật.","C. Thay Tòa án thực hiện quyền tư pháp.","D. Giám sát tối cao hoạt động tư pháp thay Quốc hội."],"answer":"B","explain":"Điều 107 Hiến pháp 2013: Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp; có nhiệm vụ góp phần bảo đảm pháp luật được chấp hành nghiêm chỉnh và thống nhất.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau (ôn tập Bài 22):","statements":["a) Tòa án nhân dân là cơ quan duy nhất có chức năng xét xử.","b) Viện kiểm sát nhân dân có chức năng xét xử.","c) Thẩm phán được bổ nhiệm theo luật định.","d) Kiểm sát viên do Viện trưởng Viện kiểm sát nhân dân tối cao bổ nhiệm theo luật định."],"answer":["T","F","T","T"],"explain":"a) Đúng (Điều 102). b) Sai: Viện kiểm sát thực hành quyền công tố, kiểm sát hoạt động tư pháp (Điều 107). c) Đúng: Thẩm phán Tòa án nhân dân tối cao do Chủ tịch nước bổ nhiệm (Điều 88); các Thẩm phán khác được bổ nhiệm theo Luật Tổ chức Tòa án nhân dân. d) Đúng theo Luật Tổ chức Viện kiểm sát nhân dân.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về độc lập xét xử:","statements":["a) Thẩm phán xét xử độc lập nên Viện kiểm sát không được tham gia phiên tòa.","b) Sự tham gia của Kiểm sát viên tại phiên tòa là thực hành quyền công tố, không phải can thiệp vào việc xét xử.","c) Luật sư tham gia bào chữa là thực hiện quyền bào chữa được Hiến pháp bảo đảm.","d) Mọi hành vi can thiệp vào việc xét xử đều bị nghiêm cấm."],"answer":["F","T","T","T"],"explain":"a) Sai: Kiểm sát viên tham gia phiên tòa để thực hành quyền công tố là hoạt động tố tụng bình thường. b) Đúng (Điều 107). c) Đúng (Điều 103). d) Đúng (Điều 103).","points":1},{"type":"short","level":"NB","q":"Cơ quan nào có nhiệm vụ xét xử các vụ án ở nước ta?","answer":"Tòa án nhân dân","explain":"Điều 102 Hiến pháp 2013: Tòa án nhân dân là cơ quan xét xử của nước Cộng hòa xã hội chủ nghĩa Việt Nam.","points":0.5},{"type":"short","level":"VDC","q":"Tòa án nhân dân tối cao là cơ quan xét xử cao nhất; cơ quan nào thực hành quyền công tố cao nhất?","answer":"Viện kiểm sát nhân dân tối cao","explain":"Viện kiểm sát nhân dân tối cao thực hành quyền công tố, kiểm sát hoạt động tư pháp trong phạm vi cả nước (Điều 107).","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Hiến pháp năm 2013 quy định về Tòa án nhân dân tại điều nào?","options":["A. Điều 102.","B. Điều 69.","C. Điều 94.","D. Điều 86."],"answer":"A","explain":"Chương VIII Hiến pháp 2013: Điều 102 quy định về Tòa án nhân dân.","points":0.25},{"type":"mcq","level":"NB","q":"Hiến pháp năm 2013 quy định về Viện kiểm sát nhân dân tại điều nào?","options":["A. Điều 107.","B. Điều 102.","C. Điều 70.","D. Điều 94."],"answer":"A","explain":"Chương VIII Hiến pháp 2013: Điều 107 quy định về Viện kiểm sát nhân dân.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào sau đây KHÔNG phải là nguyên tắc xét xử của Tòa án nhân dân?","options":["A. Xét xử độc lập, chỉ tuân theo pháp luật.","B. Bảo đảm tranh tụng.","C. Xét xử tập thể, quyết định theo đa số.","D. Xét xử theo chỉ đạo của cơ quan hành chính."],"answer":"D","explain":"Các nguyên tắc xét xử tại Điều 103 gồm: xét xử độc lập, chỉ tuân theo pháp luật; xét xử tập thể, quyết định theo đa số; bảo đảm tranh tụng; xét xử công khai... Việc xét xử theo chỉ đạo của cơ quan hành chính là hành vi can thiệp bị nghiêm cấm.","points":0.25},{"type":"mcq","level":"TH","q":"Nội dung nào sau đây KHÔNG thuộc chức năng của Viện kiểm sát nhân dân?","options":["A. Thực hành quyền công tố.","B. Kiểm sát hoạt động tư pháp.","C. Xét xử và tuyên bản án.","D. Kiểm sát việc tuân theo pháp luật trong tố tụng."],"answer":"C","explain":"Điều 107: Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp. Xét xử và tuyên bản án là chức năng của Tòa án nhân dân (Điều 102).","points":0.25},{"type":"mcq","level":"VD","q":"Tình huống: Người dân A thắc mắc: \"Vụ án của tôi do Tòa án huyện xử sơ thẩm, tôi không đồng ý thì khiếu nại ở đâu?\" Câu trả lời đúng là:","options":["A. Kháng cáo lên Tòa án nhân dân cấp trên để xét xử phúc thẩm.","B. Khiếu nại lên Viện kiểm sát huyện để xử lại.","C. Khiếu nại lên Chính phủ.","D. Không thể khiếu nại."],"answer":"A","explain":"Chế độ xét xử sơ thẩm, phúc thẩm được bảo đảm (Điều 103): đương sự có quyền kháng cáo bản án sơ thẩm chưa có hiệu lực để Tòa án cấp trên xét xử phúc thẩm.","points":0.25},{"type":"mcq","level":"VDC","q":"So sánh toàn diện: Điểm chung lớn nhất giữa Tòa án nhân dân và Viện kiểm sát nhân dân là:","options":["A. Đều do Quốc hội bầu ra toàn bộ thành viên.","B. Đều là cơ quan tiến hành tố tụng, có nhiệm vụ bảo vệ công lý, bảo vệ pháp luật, bảo vệ quyền con người, quyền công dân; chịu sự giám sát của Quốc hội.","C. Đều thực hiện quyền hành pháp.","D. Đều có quyền ban hành luật."],"answer":"B","explain":"Tổng hợp Điều 70, Điều 102, Điều 103, Điều 107 Hiến pháp 2013: cả hai cơ quan đều tiến hành tố tụng, bảo vệ công lý, pháp luật, quyền con người, quyền công dân và chịu sự giám sát tối cao của Quốc hội.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp Bài 22):","statements":["a) Điều 102 Hiến pháp 2013 quy định Tòa án nhân dân là cơ quan xét xử, thực hiện quyền tư pháp.","b) Điều 107 Hiến pháp 2013 quy định Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp.","c) Điều 103 Hiến pháp 2013 quy định các nguyên tắc xét xử của Tòa án nhân dân.","d) Hiến pháp 2013 không quy định về Tòa án quân sự và Viện kiểm sát quân sự."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: Hiến pháp 2013 có quy định Tòa án quân sự trong hệ thống Tòa án nhân dân và Viện kiểm sát quân sự trong hệ thống Viện kiểm sát nhân dân.","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về giám sát:","statements":["a) Quốc hội giám sát tối cao hoạt động của Tòa án nhân dân và Viện kiểm sát nhân dân.","b) Chánh án Tòa án nhân dân tối cao báo cáo công tác trước Quốc hội.","c) Viện trưởng Viện kiểm sát nhân dân tối cao báo cáo công tác trước Quốc hội.","d) Tòa án, Viện kiểm sát không chịu sự giám sát của cơ quan nào."],"answer":["T","T","T","F"],"explain":"a) Đúng (Điều 70). b) Đúng (Điều 70). c) Đúng (Điều 107). d) Sai.","points":1},{"type":"short","level":"NB","q":"Theo Điều 103, khi xét xử, Hội đồng xét xử quyết định theo nguyên tắc nào?","answer":"Theo đa số","explain":"Điều 103 Hiến pháp 2013: Tòa án nhân dân xét xử tập thể và quyết định theo đa số, trừ trường hợp xét xử theo thủ tục rút gọn.","points":0.5},{"type":"short","level":"VDC","q":"Theo Điều 107, Viện trưởng Viện kiểm sát nhân dân tối cao do cơ quan nào bầu, miễn nhiệm, bãi nhiệm?","answer":"Quốc hội","explain":"Điều 107 Hiến pháp 2013: Viện trưởng Viện kiểm sát nhân dân tối cao do Quốc hội bầu, miễn nhiệm, bãi nhiệm.","points":0.5}]}]}
