<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Theo Điều 69 Hiến pháp năm 2013, Quốc hội được xác định là cơ quan nào sau đây?","options":["A. Cơ quan đại biểu cao nhất của Nhân dân, cơ quan quyền lực nhà nước cao nhất.","B. Cơ quan hành chính nhà nước cao nhất.","C. Cơ quan xét xử cao nhất.","D. Cơ quan lãnh đạo cao nhất của hệ thống chính trị."],"answer":"A","explain":"Điều 69 Hiến pháp 2013 quy định: \"Quốc hội là cơ quan đại biểu cao nhất của Nhân dân, cơ quan quyền lực nhà nước cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam.\"","points":0.25},{"type":"mcq","level":"NB","q":"Nhiệm kỳ của mỗi khóa Quốc hội là bao nhiêu năm?","options":["A. 4 năm.","B. 5 năm.","C. 6 năm.","D. 7 năm."],"answer":"B","explain":"Điều 71 Hiến pháp 2013 quy định nhiệm kỳ của mỗi khóa Quốc hội là 5 năm.","points":0.25},{"type":"mcq","level":"TH","q":"Chức năng lập hiến của Quốc hội được hiểu là:","options":["A. Ban hành các đạo luật để điều chỉnh các quan hệ xã hội.","B. Làm Hiến pháp và sửa đổi Hiến pháp.","C. Tổ chức thi hành Hiến pháp, pháp luật.","D. Giải thích Hiến pháp, luật, pháp lệnh."],"answer":"B","explain":"Lập hiến là hoạt động làm Hiến pháp, sửa đổi Hiến pháp; lập pháp là hoạt động làm luật. Việc giải thích Hiến pháp, luật, pháp lệnh thuộc thẩm quyền của Ủy ban Thường vụ Quốc hội (Điều 74), còn tổ chức thi hành là nhiệm vụ của Chính phủ.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các nhiệm vụ, quyền hạn sau đây của Quốc hội, nhiệm vụ nào thể hiện chức năng quyết định những vấn đề quan trọng của đất nước?","options":["A. Làm Hiến pháp và sửa đổi Hiến pháp.","B. Quyết định dự toán ngân sách nhà nước và phân bổ ngân sách trung ương.","C. Giám sát tối cao hoạt động của Nhà nước.","D. Bầu Chủ tịch nước."],"answer":"B","explain":"Theo Điều 70 Hiến pháp 2013, Quốc hội quyết định dự toán ngân sách nhà nước và phân bổ ngân sách trung ương — đây là nội dung thuộc chức năng quyết định những vấn đề quan trọng của đất nước.","points":0.25},{"type":"mcq","level":"VD","q":"Trong thời gian Quốc hội không họp, cơ quan nào có thẩm quyền ban hành pháp lệnh?","options":["A. Chính phủ.","B. Ủy ban Thường vụ Quốc hội.","C. Chủ tịch nước.","D. Hội đồng Dân tộc."],"answer":"B","explain":"Ủy ban Thường vụ Quốc hội là cơ quan thường trực của Quốc hội (Điều 74); trong thời gian Quốc hội không họp, Ủy ban Thường vụ Quốc hội có thẩm quyền ban hành pháp lệnh.","points":0.25},{"type":"mcq","level":"VDC","q":"Ông X là đại biểu Quốc hội và được Quốc hội bầu giữ chức Chủ tịch nước. Nhận định nào sau đây đúng?","options":["A. Ông X không còn là đại biểu Quốc hội nữa.","B. Ông X vẫn là đại biểu Quốc hội vì Chủ tịch nước do Quốc hội bầu trong số đại biểu Quốc hội.","C. Ông X chỉ giữ chức Chủ tịch nước trong 1 năm.","D. Việc bầu ông X là trái Hiến pháp."],"answer":"B","explain":"Điều 87 Hiến pháp 2013 quy định Chủ tịch nước do Quốc hội bầu trong số đại biểu Quốc hội, nên người được bầu vẫn giữ tư cách đại biểu Quốc hội.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về Quốc hội:","statements":["a) Quốc hội là cơ quan quyền lực nhà nước cao nhất.","b) Nhiệm kỳ mỗi khóa Quốc hội là 4 năm.","c) Quốc hội thực hiện quyền giám sát tối cao đối với hoạt động của Nhà nước.","d) Ủy ban Thường vụ Quốc hội là cơ quan thường trực của Chính phủ."],"answer":["T","F","T","F"],"explain":"a) Đúng (Điều 69). b) Sai: nhiệm kỳ mỗi khóa Quốc hội là 5 năm (Điều 71). c) Đúng (Điều 70). d) Sai: Ủy ban Thường vụ Quốc hội là cơ quan thường trực của Quốc hội (Điều 74).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau (chức năng của Quốc hội):","statements":["a) Quốc hội có quyền làm Hiến pháp, sửa đổi Hiến pháp và làm luật.","b) Quốc hội quyết định vấn đề chiến tranh và hòa bình.","c) Quốc hội tổ chức thi hành Hiến pháp, luật, nghị quyết của chính mình.","d) Quốc hội bầu, miễn nhiệm, bãi nhiệm Thủ tướng Chính phủ."],"answer":["T","T","F","T"],"explain":"a) Đúng: chức năng lập hiến, lập pháp (Điều 70). b) Đúng (Điều 70). c) Sai: tổ chức thi hành Hiến pháp, luật là nhiệm vụ của Chính phủ (Điều 96). d) Đúng (Điều 70).","points":1},{"type":"short","level":"NB","q":"Cơ quan thường trực của Quốc hội có tên gọi là gì?","answer":"Ủy ban Thường vụ Quốc hội","explain":"Điều 74 Hiến pháp 2013 quy định Ủy ban Thường vụ Quốc hội là cơ quan thường trực của Quốc hội.","points":0.5},{"type":"short","level":"VDC","q":"Theo Hiến pháp 2013, Chủ tịch nước do cơ quan nào bầu và được bầu trong số những ai?","answer":"Do Quốc hội bầu trong số đại biểu Quốc hội","explain":"Điều 87 Hiến pháp 2013: \"Chủ tịch nước do Quốc hội bầu trong số đại biểu Quốc hội.\"","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Theo Điều 86 Hiến pháp năm 2013, Chủ tịch nước là:","options":["A. Người đứng đầu Chính phủ.","B. Người đứng đầu Nhà nước, thay mặt nước Cộng hòa xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại.","C. Người đứng đầu Quốc hội.","D. Người đứng đầu Tòa án nhân dân tối cao."],"answer":"B","explain":"Điều 86 Hiến pháp 2013: \"Chủ tịch nước là người đứng đầu Nhà nước, thay mặt nước Cộng hòa xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại.\" Chủ tịch nước chính là nguyên thủ quốc gia.","points":0.25},{"type":"mcq","level":"NB","q":"Theo Điều 94 Hiến pháp năm 2013, Chính phủ là:","options":["A. Cơ quan quyền lực nhà nước cao nhất.","B. Cơ quan xét xử cao nhất.","C. Cơ quan hành chính nhà nước cao nhất, thực hiện quyền hành pháp, là cơ quan chấp hành của Quốc hội.","D. Cơ quan thường trực của Quốc hội."],"answer":"C","explain":"Điều 94 Hiến pháp 2013: \"Chính phủ là cơ quan hành chính nhà nước cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam, thực hiện quyền hành pháp, là cơ quan chấp hành của Quốc hội.\"","points":0.25},{"type":"mcq","level":"TH","q":"Nhiệm kỳ của Chính phủ được xác định như thế nào?","options":["A. Theo nhiệm kỳ của Chủ tịch nước.","B. Theo nhiệm kỳ của Quốc hội.","C. Cố định 4 năm.","D. Do Thủ tướng Chính phủ quyết định."],"answer":"B","explain":"Điều 94 Hiến pháp 2013: nhiệm kỳ của Chính phủ theo nhiệm kỳ của Quốc hội; khi Quốc hội hết nhiệm kỳ, Chính phủ tiếp tục làm nhiệm vụ cho đến khi Quốc hội khóa mới thành lập Chính phủ.","points":0.25},{"type":"mcq","level":"TH","q":"Chính phủ gồm những thành viên nào sau đây?","options":["A. Thủ tướng, các Phó Thủ tướng, các Bộ trưởng và Thủ trưởng cơ quan ngang bộ.","B. Chủ tịch nước, Thủ tướng và các Bộ trưởng.","C. Chủ tịch Quốc hội và các đại biểu Quốc hội.","D. Chánh án Tòa án nhân dân tối cao và Viện trưởng Viện kiểm sát nhân dân tối cao."],"answer":"A","explain":"Điều 95 Hiến pháp 2013: Chính phủ gồm Thủ tướng Chính phủ, các Phó Thủ tướng Chính phủ, các Bộ trưởng và Thủ trưởng cơ quan ngang bộ.","points":0.25},{"type":"mcq","level":"VD","q":"Thủ tướng Chính phủ muốn trình Quốc hội một dự án luật mới. Nhận định nào sau đây đúng?","options":["A. Thủ tướng không có quyền trình dự án luật.","B. Chính phủ có quyền trình dự án luật trước Quốc hội.","C. Chỉ đại biểu Quốc hội mới được trình dự án luật.","D. Dự án luật phải do Chủ tịch nước trình."],"answer":"B","explain":"Điều 84 Hiến pháp 2013 quy định Chính phủ có quyền trình dự án luật, dự án pháp lệnh trước Quốc hội, Ủy ban Thường vụ Quốc hội.","points":0.25},{"type":"mcq","level":"VDC","q":"Vì sao Hiến pháp quy định nhiệm kỳ của Chính phủ theo nhiệm kỳ của Quốc hội?","options":["A. Vì Chính phủ là cơ quan chấp hành của Quốc hội, Thủ tướng do Quốc hội bầu.","B. Vì Chính phủ là cơ quan thường trực của Quốc hội.","C. Vì Chính phủ do Chủ tịch nước thành lập.","D. Vì Chính phủ thực hiện quyền lập pháp."],"answer":"A","explain":"Theo Điều 94 và Điều 98 Hiến pháp 2013, Chính phủ là cơ quan chấp hành của Quốc hội, Thủ tướng do Quốc hội bầu nên nhiệm kỳ của Chính phủ gắn với nhiệm kỳ của Quốc hội.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về vị trí của Chủ tịch nước:","statements":["a) Chủ tịch nước là người đứng đầu Nhà nước.","b) Chủ tịch nước do Nhân dân trực tiếp bầu ra.","c) Chủ tịch nước công bố Hiến pháp, luật, pháp lệnh.","d) Nhiệm kỳ của Chủ tịch nước theo nhiệm kỳ của Chính phủ."],"answer":["T","F","T","F"],"explain":"a) Đúng (Điều 86). b) Sai: Chủ tịch nước do Quốc hội bầu trong số đại biểu Quốc hội (Điều 87). c) Đúng (Điều 88). d) Sai: nhiệm kỳ của Chủ tịch nước theo nhiệm kỳ của Quốc hội (Điều 87).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về vị trí, nhiệm vụ của Chính phủ:","statements":["a) Chính phủ là cơ quan hành chính nhà nước cao nhất.","b) Chính phủ thực hiện quyền lập pháp.","c) Chính phủ tổ chức thi hành Hiến pháp, luật, nghị quyết của Quốc hội.","d) Thủ tướng Chính phủ do Chủ tịch nước bổ nhiệm mà không cần Quốc hội."],"answer":["T","F","T","F"],"explain":"a) Đúng (Điều 94). b) Sai: Chính phủ thực hiện quyền hành pháp; quyền lập pháp thuộc Quốc hội. c) Đúng (Điều 96). d) Sai: Thủ tướng do Quốc hội bầu trong số đại biểu Quốc hội (Điều 98).","points":1},{"type":"short","level":"NB","q":"Theo Điều 69, ngoài quyền lập hiến, lập pháp và quyết định những vấn đề quan trọng của đất nước, Quốc hội còn thực hiện quyền gì đối với hoạt động của Nhà nước?","answer":"Giám sát tối cao","explain":"Điều 69 và Điều 70 Hiến pháp 2013: Quốc hội thực hiện quyền giám sát tối cao đối với hoạt động của Nhà nước.","points":0.5},{"type":"short","level":"VDC","q":"Ai là người thống lĩnh lực lượng vũ trang nhân dân và giữ chức Chủ tịch Hội đồng quốc phòng và an ninh?","answer":"Chủ tịch nước","explain":"Điều 88 Hiến pháp 2013 quy định Chủ tịch nước thống lĩnh lực lượng vũ trang nhân dân, giữ chức Chủ tịch Hội đồng quốc phòng và an ninh.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Cơ quan nào có chức năng lập hiến, lập pháp?","options":["A. Quốc hội.","B. Chính phủ.","C. Tòa án nhân dân.","D. Viện kiểm sát nhân dân."],"answer":"A","explain":"Theo Điều 69 và Điều 70 Hiến pháp 2013, Quốc hội thực hiện quyền lập hiến, quyền lập pháp.","points":0.25},{"type":"mcq","level":"NB","q":"Thủ tướng Chính phủ do cơ quan nào bầu?","options":["A. Chính phủ.","B. Quốc hội.","C. Chủ tịch nước.","D. Ủy ban Thường vụ Quốc hội."],"answer":"B","explain":"Điều 98 Hiến pháp 2013: Thủ tướng Chính phủ do Quốc hội bầu trong số đại biểu Quốc hội.","points":0.25},{"type":"mcq","level":"TH","q":"Nhận định nào sau đây đúng về Ủy ban Thường vụ Quốc hội?","options":["A. Là cơ quan hành chính nhà nước cao nhất.","B. Là cơ quan thường trực của Quốc hội, có thẩm quyền ban hành pháp lệnh trong thời gian Quốc hội không họp.","C. Là cơ quan xét xử cao nhất.","D. Do Chính phủ thành lập."],"answer":"B","explain":"Điều 74 Hiến pháp 2013: Ủy ban Thường vụ Quốc hội là cơ quan thường trực của Quốc hội; trong thời gian Quốc hội không họp, Ủy ban Thường vụ Quốc hội ban hành pháp lệnh.","points":0.25},{"type":"mcq","level":"TH","q":"Chính phủ chịu trách nhiệm và báo cáo công tác trước các cơ quan nào?","options":["A. Chỉ trước Quốc hội.","B. Trước Quốc hội, Ủy ban Thường vụ Quốc hội và Chủ tịch nước.","C. Chỉ trước Chủ tịch nước.","D. Trước Tòa án nhân dân tối cao."],"answer":"B","explain":"Điều 96 Hiến pháp 2013: Chính phủ chịu trách nhiệm và báo cáo công tác trước Quốc hội, Ủy ban Thường vụ Quốc hội, Chủ tịch nước.","points":0.25},{"type":"mcq","level":"VD","q":"Địa phương X đề nghị chia tách để thành lập tỉnh mới. Cơ quan nào có thẩm quyền quyết định việc thành lập đơn vị hành chính cấp tỉnh?","options":["A. Chính phủ.","B. Quốc hội.","C. Chủ tịch nước.","D. Ủy ban nhân dân cấp tỉnh."],"answer":"B","explain":"Điều 70 Hiến pháp 2013: Quốc hội quyết định thành lập, giải thể, nhập, chia, điều chỉnh địa giới đơn vị hành chính tỉnh, thành phố trực thuộc trung ương.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong các văn bản sau, văn bản nào do Chính phủ ban hành?","options":["A. Luật.","B. Pháp lệnh.","C. Nghị định.","D. Hiến pháp."],"answer":"C","explain":"Quốc hội ban hành luật, nghị quyết; Ủy ban Thường vụ Quốc hội ban hành pháp lệnh; Chính phủ ban hành nghị quyết, nghị định để thi hành Hiến pháp, luật (Điều 96).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về tổ chức của Quốc hội:","statements":["a) Đại biểu Quốc hội do cử tri bầu ra.","b) Ủy ban Thường vụ Quốc hội gồm Chủ tịch Quốc hội, các Phó Chủ tịch Quốc hội và các Ủy viên.","c) Hội đồng Dân tộc là cơ quan của Chính phủ.","d) Quốc hội làm việc theo chế độ hội nghị và quyết định theo đa số."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng (Điều 74). c) Sai: Hội đồng Dân tộc là cơ quan của Quốc hội. d) Đúng (Điều 78).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về thẩm quyền nhân sự của Chủ tịch nước:","statements":["a) Chủ tịch nước đề nghị Quốc hội bầu, miễn nhiệm, bãi nhiệm Thủ tướng Chính phủ.","b) Chủ tịch nước bổ nhiệm, miễn nhiệm Bộ trưởng theo đề nghị của Quốc hội.","c) Chủ tịch nước quyết định đại xá theo đề nghị của Chính phủ.","d) Chủ tịch nước có quyền phủ quyết các đạo luật do Quốc hội thông qua."],"answer":["T","F","T","F"],"explain":"a) Đúng (Điều 88). b) Sai: Chủ tịch nước bổ nhiệm, miễn nhiệm Bộ trưởng theo đề nghị của Thủ tướng Chính phủ (Điều 88). c) Đúng (Điều 88). d) Sai: Hiến pháp 2013 không quy định quyền phủ quyết luật của Chủ tịch nước; Chủ tịch nước chỉ có quyền đề nghị Ủy ban Thường vụ Quốc hội xem xét lại pháp lệnh.","points":1},{"type":"short","level":"NB","q":"Chính phủ thực hiện quyền nào của Nhà nước?","answer":"Quyền hành pháp","explain":"Điều 94 Hiến pháp 2013: Chính phủ là cơ quan hành chính nhà nước cao nhất, thực hiện quyền hành pháp.","points":0.5},{"type":"short","level":"VDC","q":"Khi Quốc hội hết nhiệm kỳ mà Quốc hội khóa mới chưa thành lập được Chính phủ thì Chính phủ khóa cũ xử lý thế nào?","answer":"Tiếp tục làm nhiệm vụ cho đến khi Quốc hội khóa mới thành lập Chính phủ","explain":"Điều 94 Hiến pháp 2013: khi Quốc hội hết nhiệm kỳ, Chính phủ tiếp tục làm nhiệm vụ cho đến khi Quốc hội khóa mới thành lập Chính phủ.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Ai là người đứng đầu Nhà nước, thay mặt nước ta về đối nội và đối ngoại?","options":["A. Thủ tướng Chính phủ.","B. Chủ tịch Quốc hội.","C. Chủ tịch nước.","D. Tổng Bí thư."],"answer":"C","explain":"Điều 86 Hiến pháp 2013: Chủ tịch nước là người đứng đầu Nhà nước, thay mặt nước Cộng hòa xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại.","points":0.25},{"type":"mcq","level":"NB","q":"Cơ quan nào là cơ quan chấp hành của Quốc hội?","options":["A. Chính phủ.","B. Tòa án nhân dân.","C. Viện kiểm sát nhân dân.","D. Ủy ban Thường vụ Quốc hội."],"answer":"A","explain":"Điều 94 Hiến pháp 2013 xác định Chính phủ là cơ quan chấp hành của Quốc hội.","points":0.25},{"type":"mcq","level":"TH","q":"Chính phủ làm việc theo chế độ nào?","options":["A. Chế độ thủ trưởng, Thủ tướng quyết định mọi việc.","B. Chế độ tập thể, Thủ tướng lãnh đạo công tác của Chính phủ.","C. Chế độ hội nghị giống Quốc hội.","D. Theo sự chỉ đạo trực tiếp của Tòa án nhân dân."],"answer":"B","explain":"Điều 95 Hiến pháp 2013: Chính phủ làm việc theo chế độ tập thể, quyết định theo đa số; Thủ tướng Chính phủ lãnh đạo công tác của Chính phủ.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các quyền sau, quyền nào KHÔNG thuộc thẩm quyền của Quốc hội?","options":["A. Làm Hiến pháp, sửa đổi Hiến pháp.","B. Quyết định dự toán ngân sách nhà nước.","C. Tổ chức thi hành Hiến pháp, luật.","D. Bầu Chủ tịch nước."],"answer":"C","explain":"Tổ chức thi hành Hiến pháp, luật là nhiệm vụ, quyền hạn của Chính phủ (Điều 96), không phải của Quốc hội.","points":0.25},{"type":"mcq","level":"VD","q":"Tại kỳ họp Quốc hội, các đại biểu chất vấn Thủ tướng về việc điều hành ngân sách. Hoạt động này thể hiện chức năng nào của Quốc hội?","options":["A. Lập pháp.","B. Quyết định vấn đề quan trọng của đất nước.","C. Giám sát tối cao.","D. Lập hiến."],"answer":"C","explain":"Chất vấn là hình thức thực hiện quyền giám sát tối cao của Quốc hội đối với hoạt động của Nhà nước (Điều 70).","points":0.25},{"type":"mcq","level":"VDC","q":"Quốc hội khóa cũ hết nhiệm kỳ nhưng vì lý do đặc biệt chưa bầu được Quốc hội khóa mới. Theo Hiến pháp, việc kéo dài nhiệm kỳ Quốc hội phải đáp ứng điều kiện nào?","options":["A. Do Chủ tịch nước quyết định.","B. Được ít nhất hai phần ba tổng số đại biểu Quốc hội biểu quyết tán thành, theo đề nghị của Ủy ban Thường vụ Quốc hội; thời gian kéo dài không quá 12 tháng, trừ trường hợp có chiến tranh.","C. Do Chính phủ quyết định.","D. Tự động kéo dài mà không cần biểu quyết."],"answer":"B","explain":"Điều 71 Hiến pháp 2013: trong trường hợp đặc biệt, nếu được ít nhất hai phần ba tổng số đại biểu Quốc hội biểu quyết tán thành thì Quốc hội quyết định rút ngắn hoặc kéo dài nhiệm kỳ của mình theo đề nghị của Ủy ban Thường vụ Quốc hội; việc kéo dài nhiệm kỳ của một khóa Quốc hội không được quá 12 tháng, trừ trường hợp có chiến tranh.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về thành viên Chính phủ:","statements":["a) Chính phủ là cơ quan hành chính nhà nước cao nhất.","b) Chính phủ thực hiện quyền tư pháp.","c) Các Bộ trưởng do Thủ tướng Chính phủ bổ nhiệm.","d) Chính phủ thống nhất quản lý nền kinh tế quốc dân."],"answer":["T","F","F","T"],"explain":"a) Đúng (Điều 94). b) Sai: Chính phủ thực hiện quyền hành pháp. c) Sai: Bộ trưởng do Chủ tịch nước bổ nhiệm, miễn nhiệm, cách chức theo đề nghị của Thủ tướng (Điều 88). d) Đúng (Điều 96).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau để phân biệt các cơ quan:","statements":["a) Quốc hội là cơ quan quyền lực nhà nước cao nhất.","b) Chính phủ là cơ quan quyền lực nhà nước cao nhất.","c) Chủ tịch nước là người đứng đầu Nhà nước.","d) Ủy ban Thường vụ Quốc hội là cơ quan thường trực của Chính phủ."],"answer":["T","F","T","F"],"explain":"a) Đúng (Điều 69). b) Sai: Chính phủ là cơ quan hành chính nhà nước cao nhất (Điều 94). c) Đúng (Điều 86). d) Sai: Ủy ban Thường vụ Quốc hội là cơ quan thường trực của Quốc hội (Điều 74).","points":1},{"type":"short","level":"NB","q":"Chủ tịch nước được bầu trong số những ai?","answer":"Đại biểu Quốc hội","explain":"Điều 87 Hiến pháp 2013: Chủ tịch nước do Quốc hội bầu trong số đại biểu Quốc hội.","points":0.5},{"type":"short","level":"VDC","q":"Cơ quan nào có thẩm quyền giải thích Hiến pháp, luật, pháp lệnh?","answer":"Ủy ban Thường vụ Quốc hội","explain":"Điều 74 Hiến pháp 2013 quy định Ủy ban Thường vụ Quốc hội có thẩm quyền giải thích Hiến pháp, luật, pháp lệnh.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Theo Hiến pháp 2013, cơ quan nào thực hiện quyền hành pháp?","options":["A. Quốc hội.","B. Chính phủ.","C. Tòa án nhân dân.","D. Chủ tịch nước."],"answer":"B","explain":"Điều 94 Hiến pháp 2013: Chính phủ là cơ quan hành chính nhà nước cao nhất, thực hiện quyền hành pháp.","points":0.25},{"type":"mcq","level":"NB","q":"Ủy ban Thường vụ Quốc hội là cơ quan thường trực của cơ quan nào?","options":["A. Chính phủ.","B. Quốc hội.","C. Chủ tịch nước.","D. Mặt trận Tổ quốc Việt Nam."],"answer":"B","explain":"Điều 74 Hiến pháp 2013: Ủy ban Thường vụ Quốc hội là cơ quan thường trực của Quốc hội.","points":0.25},{"type":"mcq","level":"TH","q":"Chủ tịch nước chịu trách nhiệm và báo cáo công tác trước cơ quan nào?","options":["A. Chính phủ.","B. Quốc hội.","C. Tòa án nhân dân tối cao.","D. Ủy ban Thường vụ Quốc hội."],"answer":"B","explain":"Điều 87 Hiến pháp 2013: Chủ tịch nước chịu trách nhiệm và báo cáo công tác trước Quốc hội.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các nhiệm vụ sau, nhiệm vụ nào thuộc về Chính phủ?","options":["A. Quyết định vấn đề chiến tranh và hòa bình.","B. Bầu Thủ tướng Chính phủ.","C. Hoạch định chính sách và tổ chức thi hành Hiến pháp, luật.","D. Làm luật."],"answer":"C","explain":"Điều 96 Hiến pháp 2013: Chính phủ hoạch định chính sách và tổ chức thi hành Hiến pháp, luật, nghị quyết của Quốc hội. Quyết định chiến tranh và hòa bình, bầu Thủ tướng, làm luật là thẩm quyền của Quốc hội.","points":0.25},{"type":"mcq","level":"VD","q":"Khi Quốc hội không thể họp được, cơ quan nào có thẩm quyền quyết định tuyên bố tình trạng chiến tranh?","options":["A. Chủ tịch nước.","B. Ủy ban Thường vụ Quốc hội.","C. Chính phủ.","D. Hội đồng quốc phòng và an ninh."],"answer":"B","explain":"Điều 74 Hiến pháp 2013: trong trường hợp Quốc hội không thể họp được, Ủy ban Thường vụ Quốc hội quyết định tuyên bố tình trạng chiến tranh; Chủ tịch nước công bố quyết định đó.","points":0.25},{"type":"mcq","level":"VDC","q":"Sắp xếp đúng trình tự thành lập Chính phủ theo Hiến pháp: (1) Quốc hội bầu Thủ tướng; (2) Chủ tịch nước đề nghị Quốc hội bầu Thủ tướng; (3) Chủ tịch nước bổ nhiệm các Bộ trưởng theo đề nghị của Thủ tướng.","options":["A. (1) - (2) - (3).","B. (2) - (1) - (3).","C. (3) - (1) - (2).","D. (2) - (3) - (1)."],"answer":"B","explain":"Theo Điều 88 và Điều 98 Hiến pháp 2013: Chủ tịch nước đề nghị Quốc hội bầu Thủ tướng, sau đó Quốc hội bầu Thủ tướng, rồi Chủ tịch nước bổ nhiệm các Bộ trưởng theo đề nghị của Thủ tướng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về nhiệm vụ của Quốc hội:","statements":["a) Quốc hội thực hiện quyền lập hiến, quyền lập pháp.","b) Quốc hội có quyền quyết định đại xá.","c) Quốc hội bầu Phó Chủ tịch nước theo đề nghị của Chủ tịch nước.","d) Quốc hội phê chuẩn đề nghị bổ nhiệm, miễn nhiệm đại sứ đặc mệnh toàn quyền."],"answer":["T","F","T","T"],"explain":"a) Đúng (Điều 70). b) Sai: Chủ tịch nước quyết định đại xá theo đề nghị của Chính phủ (Điều 88). c) Đúng (Điều 70, Điều 88). d) Đúng (Điều 70).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về nhiệm vụ của Chủ tịch nước:","statements":["a) Chủ tịch nước thống lĩnh lực lượng vũ trang nhân dân.","b) Chủ tịch nước giữ chức Chủ tịch Hội đồng quốc phòng và an ninh.","c) Chủ tịch nước quyết định đặc xá.","d) Chủ tịch nước ban hành luật."],"answer":["T","T","T","F"],"explain":"a) Đúng (Điều 88). b) Đúng (Điều 88). c) Đúng: Chủ tịch nước quyết định đặc xá (Điều 88). d) Sai: Quốc hội làm luật; Chủ tịch nước chỉ công bố luật (Điều 88).","points":1},{"type":"short","level":"NB","q":"Văn bản quy phạm pháp luật do Ủy ban Thường vụ Quốc hội ban hành có tên gọi là gì?","answer":"Pháp lệnh","explain":"Trong thời gian Quốc hội không họp, Ủy ban Thường vụ Quốc hội ban hành pháp lệnh (Điều 74 Hiến pháp 2013).","points":0.5},{"type":"short","level":"VDC","q":"Theo Điều 2 Hiến pháp 2013, quyền lực nhà nước là thống nhất, có sự phân công, phối hợp và kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền nào?","answer":"Lập pháp, hành pháp, tư pháp","explain":"Điều 2 Hiến pháp 2013: quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Chức năng nào sau đây là chức năng cơ bản của Quốc hội?","options":["A. Xét xử các vụ án.","B. Lập hiến, lập pháp.","C. Thực hành quyền công tố.","D. Thi hành án dân sự."],"answer":"B","explain":"Theo Điều 69 và Điều 70 Hiến pháp 2013, Quốc hội thực hiện quyền lập hiến, quyền lập pháp.","points":0.25},{"type":"mcq","level":"NB","q":"Chính phủ là cơ quan chấp hành của cơ quan nào?","options":["A. Chủ tịch nước.","B. Quốc hội.","C. Tòa án nhân dân tối cao.","D. Ủy ban Thường vụ Quốc hội."],"answer":"B","explain":"Điều 94 Hiến pháp 2013 xác định Chính phủ là cơ quan chấp hành của Quốc hội.","points":0.25},{"type":"mcq","level":"TH","q":"Đại biểu Quốc hội có quyền nào sau đây?","options":["A. Quyền chất vấn Chủ tịch nước, Thủ tướng Chính phủ, Bộ trưởng.","B. Quyền bổ nhiệm Bộ trưởng.","C. Quyền xét xử.","D. Quyền công bố luật."],"answer":"A","explain":"Điều 80 Hiến pháp 2013: đại biểu Quốc hội có quyền chất vấn Chủ tịch nước, Chủ tịch Quốc hội, Thủ tướng Chính phủ, Bộ trưởng và các thành viên khác của Chính phủ, Chánh án Tòa án nhân dân tối cao, Viện trưởng Viện kiểm sát nhân dân tối cao.","points":0.25},{"type":"mcq","level":"TH","q":"Ai có quyền trình dự án luật trước Quốc hội?","options":["A. Chỉ có đại biểu Quốc hội.","B. Chính phủ, Tòa án nhân dân tối cao, Viện kiểm sát nhân dân tối cao và các cơ quan, tổ chức theo luật định.","C. Chỉ có Chủ tịch nước.","D. Chỉ có Ủy ban Thường vụ Quốc hội."],"answer":"B","explain":"Điều 84 Hiến pháp 2013 quy định các cơ quan, tổ chức có quyền trình dự án luật, trong đó có Chính phủ, Tòa án nhân dân tối cao, Viện kiểm sát nhân dân tối cao.","points":0.25},{"type":"mcq","level":"VD","q":"Bộ trưởng Bộ Giáo dục và Đào tạo ban hành thông tư hướng dẫn thi hành Luật Giáo dục. Thẩm quyền ban hành văn bản quy phạm pháp luật của Bộ trưởng thuộc hệ thống cơ quan nào?","options":["A. Cơ quan lập pháp.","B. Cơ quan hành chính nhà nước (hệ thống Chính phủ).","C. Cơ quan tư pháp.","D. Cơ quan kiểm sát."],"answer":"B","explain":"Bộ trưởng là thành viên Chính phủ (Điều 95); các bộ, cơ quan ngang bộ thuộc hệ thống hành chính nhà nước do Chính phủ thống nhất quản lý, thực hiện quyền hành pháp.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định: \"Quốc hội là cơ quan quyền lực nhà nước cao nhất vì Quốc hội thực hiện quyền lập hiến, lập pháp; quyết định những vấn đề quan trọng của đất nước; giám sát tối cao và bầu ra các chức danh lãnh đạo cao nhất của Nhà nước.\" Nhận định này:","options":["A. Sai, vì Quốc hội không bầu Chủ tịch nước.","B. Đúng.","C. Sai, vì Quốc hội không có quyền giám sát tối cao.","D. Sai, vì Quốc hội không quyết định vấn đề quan trọng của đất nước."],"answer":"B","explain":"Nhận định đúng và đầy đủ theo Điều 69, Điều 70 Hiến pháp 2013: Quốc hội thực hiện quyền lập hiến, lập pháp; quyết định những vấn đề quan trọng của đất nước; giám sát tối cao đối với hoạt động của Nhà nước; bầu, miễn nhiệm, bãi nhiệm các chức danh cao nhất của Nhà nước.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về hoạt động của Quốc hội:","statements":["a) Quốc hội gồm các đại biểu do cử tri bầu ra.","b) Quốc hội họp mỗi năm hai kỳ.","c) Mọi quyết định của Quốc hội đều phải được 100% đại biểu tán thành.","d) Quốc hội bỏ phiếu tín nhiệm đối với người giữ chức vụ do Quốc hội bầu."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng (Điều 78). c) Sai: Quốc hội quyết định theo đa số. d) Đúng (Điều 70).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về hoạt động của Chính phủ:","statements":["a) Thủ tướng lãnh đạo công tác của Chính phủ.","b) Chính phủ ban hành nghị quyết, nghị định để thi hành Hiến pháp, luật.","c) Chính phủ có quyền sửa đổi Hiến pháp.","d) Chính phủ chịu sự giám sát của Quốc hội."],"answer":["T","T","F","T"],"explain":"a) Đúng (Điều 95). b) Đúng (Điều 96). c) Sai: chỉ Quốc hội mới có quyền sửa đổi Hiến pháp. d) Đúng: Quốc hội giám sát tối cao đối với hoạt động của Nhà nước (Điều 70).","points":1},{"type":"short","level":"NB","q":"Người đứng đầu Chính phủ có chức danh là gì?","answer":"Thủ tướng Chính phủ","explain":"Chính phủ gồm Thủ tướng Chính phủ, các Phó Thủ tướng, các Bộ trưởng và Thủ trưởng cơ quan ngang bộ (Điều 95); Thủ tướng lãnh đạo công tác của Chính phủ.","points":0.5},{"type":"short","level":"VDC","q":"Theo Hiến pháp 2013, ai là người công bố Hiến pháp, luật, pháp lệnh đã được Quốc hội, Ủy ban Thường vụ Quốc hội thông qua?","answer":"Chủ tịch nước","explain":"Điều 88 Hiến pháp 2013: Chủ tịch nước công bố Hiến pháp, luật, pháp lệnh.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Theo Điều 69 Hiến pháp 2013, Quốc hội KHÔNG thực hiện quyền nào sau đây?","options":["A. Quyền lập hiến, quyền lập pháp.","B. Quyết định những vấn đề quan trọng của đất nước.","C. Giám sát tối cao đối với hoạt động của Nhà nước.","D. Quyền hành pháp."],"answer":"D","explain":"Theo Điều 69, Quốc hội thực hiện quyền lập hiến, quyền lập pháp, quyết định những vấn đề quan trọng của đất nước và giám sát tối cao. Quyền hành pháp do Chính phủ thực hiện (Điều 94).","points":0.25},{"type":"mcq","level":"NB","q":"Cơ quan nào quyết định vấn đề chiến tranh và hòa bình?","options":["A. Chính phủ.","B. Quốc hội.","C. Chủ tịch nước.","D. Bộ Quốc phòng."],"answer":"B","explain":"Điều 70 Hiến pháp 2013: Quốc hội quyết định vấn đề chiến tranh và hòa bình.","points":0.25},{"type":"mcq","level":"TH","q":"Chủ tịch nước có nhiệm vụ, quyền hạn nào sau đây?","options":["A. Tổ chức thi hành luật.","B. Công bố Hiến pháp, luật, pháp lệnh; thống lĩnh lực lượng vũ trang nhân dân.","C. Xét xử các vụ án.","D. Ban hành nghị định."],"answer":"B","explain":"Điều 88 Hiến pháp 2013: Chủ tịch nước công bố Hiến pháp, luật, pháp lệnh; thống lĩnh lực lượng vũ trang nhân dân. Tổ chức thi hành luật và ban hành nghị định là nhiệm vụ của Chính phủ; xét xử là chức năng của Tòa án.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa Quốc hội và Chính phủ được thể hiện đúng nhất qua nhận định nào?","options":["A. Chính phủ là cơ quan chấp hành của Quốc hội, chịu sự giám sát của Quốc hội.","B. Chính phủ độc lập hoàn toàn với Quốc hội.","C. Quốc hội là cơ quan chấp hành của Chính phủ.","D. Chính phủ có quyền giải tán Quốc hội."],"answer":"A","explain":"Điều 94 Hiến pháp 2013 xác định Chính phủ là cơ quan chấp hành của Quốc hội; Quốc hội thực hiện quyền giám sát tối cao đối với hoạt động của Nhà nước (Điều 70).","points":0.25},{"type":"mcq","level":"VD","q":"Trong thời gian Quốc hội không họp, một đạo luật cần được giải thích để áp dụng thống nhất. Cơ quan nào có thẩm quyền giải thích luật?","options":["A. Chính phủ.","B. Tòa án nhân dân tối cao.","C. Ủy ban Thường vụ Quốc hội.","D. Chủ tịch nước."],"answer":"C","explain":"Điều 74 Hiến pháp 2013: Ủy ban Thường vụ Quốc hội giải thích Hiến pháp, luật, pháp lệnh.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định nào sau đây đúng về thẩm quyền nhân sự theo Hiến pháp?","options":["A. Chủ tịch nước bầu Thủ tướng Chính phủ.","B. Quốc hội bổ nhiệm các Bộ trưởng.","C. Quốc hội bầu Thủ tướng; Chủ tịch nước bổ nhiệm Bộ trưởng theo đề nghị của Thủ tướng.","D. Thủ tướng bầu Chủ tịch nước."],"answer":"C","explain":"Điều 98: Thủ tướng do Quốc hội bầu; Điều 88: Chủ tịch nước bổ nhiệm, miễn nhiệm, cách chức Bộ trưởng theo đề nghị của Thủ tướng.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về vị trí, nhiệm vụ của Chủ tịch nước:","statements":["a) Chủ tịch nước do Quốc hội bầu trong số đại biểu Quốc hội.","b) Chủ tịch nước là người đứng đầu Chính phủ.","c) Chủ tịch nước tiếp nhận đại sứ đặc mệnh toàn quyền của nước ngoài.","d) Chủ tịch nước quyết định tặng thưởng huân chương, huy chương."],"answer":["T","F","T","T"],"explain":"a) Đúng (Điều 87). b) Sai: người đứng đầu Chính phủ là Thủ tướng; Chủ tịch nước là người đứng đầu Nhà nước (Điều 86). c) Đúng (Điều 88). d) Đúng (Điều 88).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau để so sánh thẩm quyền:","statements":["a) Cả Quốc hội và Chính phủ đều có quyền làm luật.","b) Ủy ban Thường vụ Quốc hội có thể ban hành pháp lệnh.","c) Chính phủ có quyền trình dự án luật.","d) Chủ tịch nước có quyền đề nghị Ủy ban Thường vụ Quốc hội xem xét lại pháp lệnh."],"answer":["F","T","T","T"],"explain":"a) Sai: chỉ Quốc hội mới có quyền làm luật. b) Đúng (Điều 74). c) Đúng (Điều 84). d) Đúng (Điều 88).","points":1},{"type":"short","level":"NB","q":"Theo Điều 71, nhiệm kỳ mỗi khóa Quốc hội là mấy năm?","answer":"5 năm","explain":"Điều 71 Hiến pháp 2013 quy định nhiệm kỳ của mỗi khóa Quốc hội là 5 năm.","points":0.5},{"type":"short","level":"VDC","q":"Cơ quan nào quyết định dự toán ngân sách nhà nước và phân bổ ngân sách trung ương?","answer":"Quốc hội","explain":"Điều 70 Hiến pháp 2013: Quốc hội quyết định dự toán ngân sách nhà nước và phân bổ ngân sách trung ương.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Cơ quan đại biểu cao nhất của Nhân dân là cơ quan nào?","options":["A. Quốc hội.","B. Hội đồng nhân dân.","C. Chính phủ.","D. Mặt trận Tổ quốc Việt Nam."],"answer":"A","explain":"Điều 69 Hiến pháp 2013: Quốc hội là cơ quan đại biểu cao nhất của Nhân dân, cơ quan quyền lực nhà nước cao nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Thủ trưởng cơ quan ngang bộ là thành viên của cơ quan nào?","options":["A. Chính phủ.","B. Quốc hội.","C. Chủ tịch nước.","D. Tòa án nhân dân tối cao."],"answer":"A","explain":"Điều 95 Hiến pháp 2013: Chính phủ gồm Thủ tướng, các Phó Thủ tướng, các Bộ trưởng và Thủ trưởng cơ quan ngang bộ.","points":0.25},{"type":"mcq","level":"TH","q":"Quốc hội thực hiện quyền giám sát tối cao đối với hoạt động của Nhà nước thông qua các hình thức nào?","options":["A. Chất vấn, bỏ phiếu tín nhiệm, xem xét báo cáo công tác.","B. Xét xử các vụ án.","C. Ban hành nghị định.","D. Khởi tố vụ án hình sự."],"answer":"A","explain":"Theo Điều 70 Hiến pháp 2013, Quốc hội giám sát tối cao thông qua việc xem xét báo cáo công tác, chất vấn và bỏ phiếu tín nhiệm đối với người giữ chức vụ do Quốc hội bầu hoặc phê chuẩn.","points":0.25},{"type":"mcq","level":"TH","q":"Nhận định nào đúng về vị trí của Chủ tịch nước?","options":["A. Chủ tịch nước là người đứng đầu Chính phủ.","B. Chủ tịch nước là người đứng đầu Nhà nước, thay mặt nước ta về đối nội và đối ngoại.","C. Chủ tịch nước là người đứng đầu Quốc hội.","D. Chủ tịch nước do Nhân dân trực tiếp bầu."],"answer":"B","explain":"Điều 86 Hiến pháp 2013: Chủ tịch nước là người đứng đầu Nhà nước, thay mặt nước Cộng hòa xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại.","points":0.25},{"type":"mcq","level":"VD","q":"Tình huống: Sau khi Quốc hội thông qua Luật Đất đai (sửa đổi), ai là người công bố luật này để luật được thi hành?","options":["A. Chủ tịch Quốc hội.","B. Thủ tướng Chính phủ.","C. Chủ tịch nước.","D. Tổng Bí thư."],"answer":"C","explain":"Điều 88 Hiến pháp 2013: Chủ tịch nước công bố Hiến pháp, luật, pháp lệnh.","points":0.25},{"type":"mcq","level":"VDC","q":"Tại sao nói quyền lực nhà nước ở nước ta là thống nhất nhưng có sự phân công, phối hợp, kiểm soát giữa các cơ quan?","options":["A. Vì mỗi cơ quan thực hiện một quyền riêng biệt, không liên quan nhau.","B. Vì Quốc hội, Chủ tịch nước, Chính phủ cùng thực hiện quyền lực của Nhân dân, phân công thực hiện quyền lập pháp, hành pháp, tư pháp nhưng phối hợp và kiểm soát lẫn nhau theo Điều 2 Hiến pháp 2013.","C. Vì Chính phủ đứng trên Quốc hội.","D. Vì Chủ tịch nước tập trung mọi quyền lực."],"answer":"B","explain":"Điều 2 Hiến pháp 2013: quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về đại biểu Quốc hội và kỳ họp:","statements":["a) Quốc hội là cơ quan đại biểu cao nhất của Nhân dân.","b) Đại biểu Quốc hội chịu sự giám sát của cử tri.","c) Quốc hội chỉ họp một kỳ mỗi năm.","d) Các kỳ họp Quốc hội được tiến hành công khai."],"answer":["T","T","F","T"],"explain":"a) Đúng (Điều 69). b) Đúng: đại biểu Quốc hội chịu trách nhiệm trước cử tri, chịu sự giám sát của cử tri (Điều 79). c) Sai: Quốc hội họp mỗi năm hai kỳ (Điều 78). d) Đúng (Điều 78).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về cơ cấu và trách nhiệm của Chính phủ:","statements":["a) Chính phủ gồm Thủ tướng, các Phó Thủ tướng, các Bộ trưởng và Thủ trưởng cơ quan ngang bộ.","b) Thủ tướng do Chính phủ bầu ra.","c) Chính phủ là cơ quan chấp hành của Quốc hội.","d) Bộ máy hành chính nhà nước do Chính phủ thống nhất quản lý."],"answer":["T","F","T","T"],"explain":"a) Đúng (Điều 95). b) Sai: Thủ tướng do Quốc hội bầu (Điều 98). c) Đúng (Điều 94). d) Đúng: Chính phủ thống nhất quản lý nền hành chính quốc gia (Điều 96).","points":1},{"type":"short","level":"NB","q":"Theo Điều 94, Chính phủ là cơ quan chấp hành của cơ quan nào?","answer":"Quốc hội","explain":"Điều 94 Hiến pháp 2013: Chính phủ là cơ quan hành chính nhà nước cao nhất, thực hiện quyền hành pháp, là cơ quan chấp hành của Quốc hội.","points":0.5},{"type":"short","level":"VDC","q":"Theo Điều 88, Chủ tịch nước giữ chức Chủ tịch của Hội đồng nào?","answer":"Hội đồng quốc phòng và an ninh","explain":"Điều 88 Hiến pháp 2013: Chủ tịch nước thống lĩnh lực lượng vũ trang nhân dân, giữ chức Chủ tịch Hội đồng quốc phòng và an ninh.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Cơ quan nào có quyền quyết định chính sách cơ bản về tài chính, tiền tệ quốc gia?","options":["A. Ngân hàng Nhà nước Việt Nam.","B. Quốc hội.","C. Chính phủ.","D. Bộ Tài chính."],"answer":"B","explain":"Điều 70 Hiến pháp 2013: Quốc hội quyết định chính sách cơ bản về tài chính, tiền tệ quốc gia; quy định, sửa đổi hoặc bãi bỏ các thứ thuế.","points":0.25},{"type":"mcq","level":"NB","q":"Ai giữ chức Chủ tịch Hội đồng quốc phòng và an ninh?","options":["A. Thủ tướng Chính phủ.","B. Chủ tịch Quốc hội.","C. Chủ tịch nước.","D. Bộ trưởng Bộ Quốc phòng."],"answer":"C","explain":"Điều 88 Hiến pháp 2013: Chủ tịch nước giữ chức Chủ tịch Hội đồng quốc phòng và an ninh.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các hoạt động sau, hoạt động nào thuộc chức năng giám sát tối cao của Quốc hội?","options":["A. Thông qua luật.","B. Nghe báo cáo công tác của Chính phủ và tiến hành chất vấn.","C. Quyết định dự toán ngân sách nhà nước.","D. Bầu Chủ tịch nước."],"answer":"B","explain":"Nghe báo cáo công tác và chất vấn là hình thức thực hiện quyền giám sát tối cao của Quốc hội (Điều 70). Thông qua luật thuộc chức năng lập pháp; quyết định ngân sách thuộc chức năng quyết định vấn đề quan trọng của đất nước.","points":0.25},{"type":"mcq","level":"TH","q":"Chính phủ có nhiệm vụ nào sau đây?","options":["A. Xét xử các vụ án hình sự.","B. Thống nhất quản lý về kinh tế, văn hóa, xã hội, giáo dục, quốc phòng, an ninh.","C. Thực hành quyền công tố.","D. Ban hành Hiến pháp."],"answer":"B","explain":"Điều 96 Hiến pháp 2013: Chính phủ thống nhất quản lý về kinh tế, văn hóa, xã hội, giáo dục, y tế, khoa học, công nghệ, môi trường, quốc phòng, an ninh quốc gia, đối ngoại.","points":0.25},{"type":"mcq","level":"VD","q":"Tình huống: Chính phủ trình Quốc hội quyết định chủ trương đầu tư một công trình trọng điểm quốc gia. Việc Quốc hội xem xét, quyết định thể hiện chức năng nào?","options":["A. Lập pháp.","B. Quyết định những vấn đề quan trọng của đất nước.","C. Giám sát tối cao.","D. Lập hiến."],"answer":"B","explain":"Quyết định chủ trương đầu tư chương trình, dự án quan trọng quốc gia là nội dung thuộc chức năng quyết định những vấn đề quan trọng của đất nước của Quốc hội (Điều 70).","points":0.25},{"type":"mcq","level":"VDC","q":"Đánh giá nhận định: \"Chủ tịch nước vừa là nguyên thủ quốc gia, vừa là người đứng đầu Chính phủ.\"","options":["A. Đúng.","B. Sai, vì người đứng đầu Chính phủ là Thủ tướng; Chủ tịch nước là người đứng đầu Nhà nước.","C. Đúng một phần.","D. Không xác định được."],"answer":"B","explain":"Điều 86: Chủ tịch nước là người đứng đầu Nhà nước (nguyên thủ quốc gia); người đứng đầu Chính phủ, lãnh đạo công tác của Chính phủ là Thủ tướng (Điều 95).","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về nhiệm vụ, quyền hạn của Quốc hội:","statements":["a) Quốc hội quyết định mục tiêu, chính sách phát triển kinh tế - xã hội của đất nước.","b) Quốc hội quy định hàm, cấp trong lực lượng vũ trang nhân dân.","c) Quốc hội trực tiếp chỉ huy các đơn vị quân đội.","d) Quốc hội quyết định chính sách dân tộc, chính sách tôn giáo của Nhà nước."],"answer":["T","T","F","T"],"explain":"a) Đúng (Điều 70). b) Đúng (Điều 70). c) Sai: Quốc hội không trực tiếp chỉ huy quân đội; Chủ tịch nước thống lĩnh lực lượng vũ trang nhân dân (Điều 88). d) Đúng (Điều 70).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về quan hệ giữa các cơ quan:","statements":["a) Chủ tịch nước đề nghị Quốc hội bầu Thủ tướng Chính phủ.","b) Thủ tướng đề nghị Chủ tịch nước bổ nhiệm Bộ trưởng.","c) Quốc hội bầu các Bộ trưởng.","d) Chính phủ chịu trách nhiệm trước Quốc hội về hoạt động của mình."],"answer":["T","T","F","T"],"explain":"a) Đúng (Điều 88). b) Đúng (Điều 88). c) Sai: Bộ trưởng do Chủ tịch nước bổ nhiệm theo đề nghị của Thủ tướng (Điều 88). d) Đúng: Chính phủ báo cáo công tác trước Quốc hội (Điều 96).","points":1},{"type":"short","level":"NB","q":"Theo Điều 87, Chủ tịch nước chịu trách nhiệm và báo cáo công tác trước cơ quan nào?","answer":"Quốc hội","explain":"Điều 87 Hiến pháp 2013: Chủ tịch nước chịu trách nhiệm và báo cáo công tác trước Quốc hội.","points":0.5},{"type":"short","level":"VDC","q":"Hội đồng Dân tộc và các Ủy ban là cơ quan của cơ quan nào?","answer":"Quốc hội","explain":"Hội đồng Dân tộc, các Ủy ban của Quốc hội là các cơ quan của Quốc hội, chịu trách nhiệm và báo cáo công tác trước Quốc hội.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Nhận định nào sau đây đúng về Quốc hội?","options":["A. Quốc hội là cơ quan hành chính nhà nước cao nhất.","B. Quốc hội là cơ quan đại biểu cao nhất của Nhân dân, cơ quan quyền lực nhà nước cao nhất.","C. Quốc hội là cơ quan xét xử cao nhất.","D. Quốc hội do Chính phủ thành lập."],"answer":"B","explain":"Điều 69 Hiến pháp 2013: Quốc hội là cơ quan đại biểu cao nhất của Nhân dân, cơ quan quyền lực nhà nước cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam.","points":0.25},{"type":"mcq","level":"NB","q":"Phó Chủ tịch nước do ai bầu?","options":["A. Quốc hội, theo đề nghị của Chủ tịch nước.","B. Nhân dân trực tiếp bầu.","C. Chính phủ.","D. Chủ tịch nước."],"answer":"A","explain":"Điều 70 và Điều 88 Hiến pháp 2013: Chủ tịch nước đề nghị Quốc hội bầu, miễn nhiệm, bãi nhiệm Phó Chủ tịch nước; Quốc hội là cơ quan bầu.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao Chủ tịch nước được gọi là nguyên thủ quốc gia?","options":["A. Vì Chủ tịch nước đứng đầu Chính phủ.","B. Vì Chủ tịch nước là người đứng đầu Nhà nước, thay mặt nước ta về đối nội và đối ngoại.","C. Vì Chủ tịch nước đứng đầu Quốc hội.","D. Vì Chủ tịch nước do Nhân dân trực tiếp bầu."],"answer":"B","explain":"Điều 86 Hiến pháp 2013: Chủ tịch nước là người đứng đầu Nhà nước, thay mặt nước Cộng hòa xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại — đó chính là vị thế nguyên thủ quốc gia.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các văn bản sau, văn bản nào KHÔNG do Quốc hội ban hành?","options":["A. Hiến pháp.","B. Luật.","C. Nghị quyết.","D. Nghị định."],"answer":"D","explain":"Quốc hội ban hành Hiến pháp, luật, nghị quyết; nghị định do Chính phủ ban hành.","points":0.25},{"type":"mcq","level":"VD","q":"Tình huống: Một cử tri thắc mắc vì sao đại biểu Quốc hội của địa phương mình ít về tiếp xúc cử tri. Theo Hiến pháp, đại biểu Quốc hội có trách nhiệm gì với cử tri?","options":["A. Không có trách nhiệm gì.","B. Chịu trách nhiệm trước cử tri, liên hệ chặt chẽ với cử tri, chịu sự giám sát của cử tri.","C. Chỉ báo cáo với Quốc hội.","D. Chỉ tiếp xúc cử tri khi có bầu cử."],"answer":"B","explain":"Điều 79 Hiến pháp 2013: đại biểu Quốc hội chịu trách nhiệm trước cử tri; phải liên hệ chặt chẽ với cử tri, chịu sự giám sát của cử tri.","points":0.25},{"type":"mcq","level":"VDC","q":"So sánh vị trí pháp lý của ba cơ quan: Quốc hội, Chủ tịch nước, Chính phủ. Nhận định nào đúng?","options":["A. Cả ba đều là cơ quan quyền lực nhà nước cao nhất.","B. Quốc hội là cơ quan quyền lực nhà nước cao nhất; Chủ tịch nước là người đứng đầu Nhà nước; Chính phủ là cơ quan hành chính nhà nước cao nhất, thực hiện quyền hành pháp.","C. Chính phủ là cơ quan quyền lực nhà nước cao nhất.","D. Chủ tịch nước là cơ quan hành chính nhà nước cao nhất."],"answer":"B","explain":"Tổng hợp Điều 69, Điều 86, Điều 94 Hiến pháp 2013: Quốc hội là cơ quan quyền lực nhà nước cao nhất; Chủ tịch nước là người đứng đầu Nhà nước; Chính phủ là cơ quan hành chính nhà nước cao nhất, thực hiện quyền hành pháp.","points":0.25},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp Bài 21):","statements":["a) Quốc hội, Chủ tịch nước, Chính phủ đều là cơ quan trong bộ máy nhà nước ta.","b) Quyền lực nhà nước ở nước ta là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan.","c) Chính phủ thực hiện quyền lập pháp.","d) Chủ tịch nước thực hiện quyền hành pháp."],"answer":["T","T","F","F"],"explain":"a) Đúng. b) Đúng (Điều 2). c) Sai: Chính phủ thực hiện quyền hành pháp; quyền lập pháp thuộc Quốc hội. d) Sai: quyền hành pháp do Chính phủ thực hiện (Điều 94).","points":1},{"type":"truefalse","level":"VD","q":"Xét tính đúng, sai của các khẳng định sau về thẩm quyền:","statements":["a) Quốc hội có quyền sửa đổi Hiến pháp.","b) Ủy ban Thường vụ Quốc hội có quyền sửa đổi Hiến pháp.","c) Chính phủ có quyền ban hành nghị định.","d) Chủ tịch nước có quyền công bố luật."],"answer":["T","F","T","T"],"explain":"a) Đúng: chỉ Quốc hội mới có quyền làm Hiến pháp, sửa đổi Hiến pháp. b) Sai. c) Đúng (Điều 96). d) Đúng (Điều 88).","points":1},{"type":"short","level":"NB","q":"Kể tên cơ quan thực hiện quyền lập pháp ở nước ta?","answer":"Quốc hội","explain":"Quốc hội thực hiện quyền lập hiến, quyền lập pháp (Điều 69 Hiến pháp 2013).","points":0.5},{"type":"short","level":"VDC","q":"Theo Điều 74, Ủy ban Thường vụ Quốc hội gồm những thành phần nào?","answer":"Chủ tịch Quốc hội, các Phó Chủ tịch Quốc hội và các Ủy viên","explain":"Điều 74 Hiến pháp 2013: Ủy ban Thường vụ Quốc hội gồm Chủ tịch Quốc hội, các Phó Chủ tịch Quốc hội và các Ủy viên.","points":0.5}]}]}
