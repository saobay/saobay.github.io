u trách nhiệm trước Quốc hội và báo cáo công tác trước Quốc hội.", "B. Quốc hội chịu trách nhiệm trước Chính phủ.", "C. Chính phủ độc lập tuyệt đối với Quốc hội.", "D. Quốc hội là cơ quan chấp hành của Chính phủ."], "answer": "A", "explain": "Điều 94 Hiến pháp 2013: Chính phủ chịu trách nhiệm trước Quốc hội và báo cáo công tác trước Quốc hội, Ủy ban thường vụ Quốc hội, Chủ tịch nước.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau về Chính phủ:", "statements": ["a) Chính phủ là cơ quan hành chính nhà nước cao nhất (Điều 94).", "b) Chính phủ thực hiện quyền hành pháp.", "c) Chính phủ là cơ quan quyền lực nhà nước cao nhất.", "d) Chính phủ là cơ quan chấp hành của Quốc hội."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng theo Điều 94 Hiến pháp 2013. c sai: cơ quan quyền lực nhà nước cao nhất là Quốc hội (Điều 69).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Thủ tướng Chính phủ do Quốc hội bầu theo đề nghị của Chủ tịch nước.", "b) Chính phủ tổ chức thi hành Hiến pháp, luật (Điều 96).", "c) Chính phủ không phải báo cáo công tác trước bất kỳ cơ quan nào.", "d) Chính phủ thống nhất quản lý về kinh tế, văn hóa, xã hội, giáo dục, y tế, khoa học, công nghệ, môi trường."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng theo Điều 94, 95, 96 Hiến pháp 2013. c sai: Chính phủ báo cáo công tác trước Quốc hội, Ủy ban thường vụ Quốc hội, Chủ tịch nước (Điều 94).", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Theo Điều 94 Hiến pháp 2013, Chính phủ là cơ quan hành chính nhà nước cao nhất, thực hiện quyền ...", "answer": "hành pháp", "explain": "Điều 94 Hiến pháp 2013: Chính phủ thực hiện quyền hành pháp.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Theo Điều 94 Hiến pháp 2013, Chính phủ là cơ quan ... của Quốc hội (điền cụm từ còn thiếu).", "answer": "chấp hành", "explain": "Điều 94 Hiến pháp của các nhận định sau:", "statements": ["a) Thẩm phán, Hội thẩm xét xử độc lập và chỉ tuân theo pháp luật (Điều 103).", "b) Cơ quan, tổ chức, cá nhân được can thiệp vào việc xét xử của Tòa án.", "c) Chánh án Tòa án nhân dân tối cao do Quốc hội bầu.", "d) Viện trưởng Viện kiểm sát nhân dân tối cao do Chính phủ bổ nhiệm."], "answer": ["T", "F", "T", "F"], "explain": "a, c đúng theo Điều 103 và Điều 70 Hiến pháp 2013. b sai: Điều 103 nghiêm cấm can thiệp vào việc xét xử. d sai: Viện trưởng Viện kiểm sát nhân dân tối cao do Quốc hội bầu theo đề nghị của Chủ tịch nước.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Theo Điều 102 Hiến pháp 2013, Tòa án nhân dân là cơ quan xét xử, thực hiện quyền ...", "answer": "tư pháp", "explain": "Điều 102 Hiến pháp 2013: Tòa án nhân dân thực hiện quyền tư pháp.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Theo Điều 107 Hiến pháp 2013, Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát ... (điền cụm từ còn thiếu).", "answer": "hoạt động tư pháp", "explain": "Điều 107 Hiến pháp 2013: Viện kiểm sát nhân dân thực hành quyền công tố, kiểm sát hoạt động tư pháp.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Theo Điều 113 Hiến pháp 2013, Hội đồng nhân dân là cơ quan nào?", "options": ["A. Cơ quan quyền lực nhà nước ở địa phương.", "B. Cơ quan quyền lực nhà nước cao nhất.", "C. Cơ quan hành chính nhà nước cao nhất.", "D. Cơ quan xét xử ở địa phương."], "answer": "A", "explain": "Điều 113 Hiến pháp 2013: Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương, đại diện cho ý chí, nguyện vọng và quyền làm chủ của Nhân dân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Điều 114 Hiến pháp 2013, Ủy ban nhân dân do cơ quan nào bầu ra?", "options": ["A. Hội đồng nhân dân cùng cấp.", "B. Nhân dân trực tiếp bầu.", "C. Chính phủ bổ nhiệm.", "D. Quốc hội bầu."], "answer": "A", "explain": "Điều 114 khoản 1 Hiến pháp 2013: Ủy ban nhân dân ở cấp chính quyền địa phương do Hội đồng nhân dân cùng cấp bầu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Điều 113 Hiến pháp 2013, Hội đồng nhân dân do ai bầu ra?", "options": ["A. Nhân dân địa phương.", "B. Quốc hội.", "C. Chính phủ.", "D. Ủy ban nhân dân cấp trên."], "answer": "A", "explain": "Điều 113 khoản 1 Hiến pháp 2013: Hội đồng nhân dân do Nhân dân địa phương bầu ra.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Điều 114 Hiến pháp 2013, Ủy ban nhân dân là cơ quan nào?", "options": ["A. Cơ quan chấp hành của Hội đồng nhân dân, cơ quan hành chính nhà nước ở địa phương.", "B. Cơ quan quyền lực nhà nước ở địa phương.", "C. Cơ quan xét xử ở địa phương.", "D. Cơ quan thực hiện quyền lập pháp ở địa phương."], "answer": "A", "explain": "Điều 114 khoản 1 Hiến pháp 2013: Ủy ban nhân dân là cơ quan chấp hành của Hội đồng nhân dân, cơ quan hành chính nhà nước ở địa phương.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hội đồng nhân dân tỉnh A ban hành nghị quyết về phí tham quan danh lam thắng cảnh của tỉnh, giao Ủy ban nhân dân tỉnh tổ chức thực hiện. Theo Điều 113 và Điều 114 Hiến pháp 2013, mối quan hệ này thể hiện điều gì?", "options": ["A. HĐND quyết định các vấn đề của địa phương; UBND là cơ quan chấp hành, tổ chức thực hiện nghị quyết của HĐND.", "B. UBND quyết định thay HĐND.", "C. HĐND là cơ quan chấp hành của UBND.", "D. Hai cơ quan hoạt động độc lập, không liên quan đến nhau."], "answer": "A", "explain": "Điều 113: HĐND quyết định các vấn đề của địa phương do luật định; Điều 114: UBND là cơ quan chấp hành của HĐND, tổ chức thực hiện nghị quyết của HĐND.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ủy ban nhân dân xã B ban hành quyết định thu một khoản phí không đúng quy định của pháp luật. Theo Điều 113 Hiến pháp 2013, cơ quan nào có quyền giám sát và yêu cầu xử lý?", "options": ["A. Hội đồng nhân dân xã: giám sát việc tuân theo Hiến pháp và pháp luật ở địa phương.", "B. Tòa án nhân dân tối cao.", "C. Quốc hội trực tiếp xử lý.", "D. Không cơ quan nào có quyền giám sát."], "answer": "A", "explain": "Điều 113 khoản 2 Hiến pháp 2013: Hội đồng nhân dân giám sát việc tuân theo Hiến pháp và pháp luật ở địa phương và việc thực hiện nghị quyết của Hội đồng nhân dân.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương (Điều 113).", "b) Ủy ban nhân dân do Hội đồng nhân dân cùng cấp bầu (Điều 114).", "c) Ủy ban nhân dân là cơ quan quyền lực nhà nước ở địa phương.", "d) Hội đồng nhân dân do Nhân dân địa phương bầu ra."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng theo Điều 113 và Điều 114 Hiến pháp 2013. c sai: cơ quan quyền lực nhà nước ở địa phương là HĐND; UBND là cơ quan chấp hành của HĐND.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) HĐND quyết định các vấn đề của địa phương do luật định; giám sát việc tuân theo Hiến pháp, pháp luật ở địa phương.", "b) UBND tổ chức thi hành Hiến pháp, pháp luật ở địa phương; thực hiện nghị quyết của HĐND.", "c) UBND là cơ quan chấp hành của HĐND.", "d) HĐND chịu trách nhiệm trước UBND cùng cấp."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng theo Điều 113 và Điều 114 Hiến pháp 2013. d sai: UBND chịu trách nhiệm trước HĐND, chứ không phải ngược lại.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: Theo Điều 113 Hiến pháp 2013, Hội đồng nhân dân là cơ quan quyền lực nhà nước ở ...", "answer": "địa phương", "explain": "Điều 113 khoản 1 Hiến pháp 2013: Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Theo Điều 114 Hiến pháp 2013, Ủy ban nhân dân là cơ quan ... của Hội đồng nhân dân (điền cụm từ còn thiếu).", "answer": "chấp hành", "explain": "Điều 114 khoản 1 Hiến pháp 2013: Ủy ban nhân dân là cơ quan chấp hành của Hội đồng nhân dân.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Bộ máy nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam được quy định trong Hiến pháp 2013 từ chương nào đến chương nào?", "options": ["A. Từ Chương VIII đến Chương XI.", "B. Từ Chương I đến Chương III.", "C. Từ Chương IV đến Chương VII.", "D. Chỉ trong Chương VIII."], "answer": "A", "explain": "Hiến pháp 2013 quy định về bộ máy nhà nước từ Chương VIII (Quốc hội) đến Chương XI (Chính quyền địa phương).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cơ quan nào sau đây KHÔNG thuộc bộ máy nhà nước theo Hiến pháp 2013?", "options": ["A. Mặt trận Tổ quốc Việt Nam.", "B. Quốc hội.", "C. Chính phủ.", "D. Tòa án nhân dân."], "answer": "A", "explain": "Bộ máy nhà nước gồm Quốc hội, Chủ tịch nước, Chính phủ, Tòa án nhân dân, Viện kiểm sát nhân dân, chính quyền địa phương; Mặt trận Tổ quốc Việt Nam là tổ chức chính trị - xã hội, không phải cơ quan nhà nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sắp xếp nào sau đây đúng về vị trí pháp lý các cơ quan nhà nước ở trung ương?", "options": ["A. Quốc hội (quyền lực nhà nước cao nhất) - Chính phủ (hành chính nhà nước cao nhất) - Tòa án (xét xử).", "B. Chính phủ - Quốc hội - Tòa án.", "C. Tòa án - Quốc hội - Chính phủ.", "D. Chủ tịch nước - Tòa án - Quốc hội."], "answer": "A", "explain": "Điều 69: Quốc hội là cơ quan quyền lực nhà nước cao nhất; Điều 94: Chính phủ là cơ quan hành chính nhà nước cao nhất; Điều 102: Tòa án nhân dân là cơ quan xét xử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Hiến pháp 2013, các chức danh Chủ tịch nước, Thủ tướng Chính phủ, Chánh án Tòa án nhân dân tối cao, Viện trưởng Viện kiểm sát nhân dân tối cao có điểm chung nào?", "options": ["A. Đều do Quốc hội bầu.", "B. Đều do nhân dân trực tiếp bầu.", "C. Đều do Chính phủ bổ nhiệm.", "D. Đều do Chủ tịch nước bổ nhiệm."], "answer": "A", "explain": "Theo Điều 70 và Điều 87, 88, 95 Hiến pháp 2013, các chức danh này đều do Quốc hội bầu (Thủ tướng, Chánh án, Viện trưởng được bầu theo đề nghị của Chủ tịch nước).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Khi Quốc hội chất vấn Thủ tướng Chính phủ về tình hình kinh tế - xã hội, hoạt động này thể hiện chức năng nào của Quốc hội theo Điều 69 Hiến pháp 2013?", "options": ["A. Giám sát tối cao đối với hoạt động của Nhà nước.", "B. Quyền lập pháp.", "C. Quyền hành pháp.", "D. Quyền tư pháp."], "answer": "A", "explain": "Điều 69 Hiến pháp 2013: Quốc hội giám sát tối cao đối với hoạt động của Nhà nước; hoạt động chất vấn là một hình thức giám sát.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một đạo luật do Quốc hội ban hành, Chính phủ ban hành nghị định hướng dẫn thi hành, Tòa án áp dụng để xét xử. Chuỗi hoạt động này minh họa điều gì?", "options": ["A. Sự phân công thực hiện các quyền lập pháp, hành pháp, tư pháp trong sự thống nhất của quyền lực nhà nước (Điều 2).", "B. Tam quyền phân lập.", "C. Quốc hội làm thay công việc của Chính phủ và Tòa án.", "D. Các cơ quan hoạt động tùy tiện, không theo nguyên tắc nào."], "answer": "A", "explain": "Chuỗi hoạt động minh họa nguyên tắc tại khoản 3 Điều 2 Hiến pháp 2013: Quốc hội lập pháp, Chính phủ hành pháp (tổ chức thi hành luật), Tòa án thực hiện quyền tư pháp, trong sự thống nhất của quyền lực nhà nước.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Quốc hội là cơ quan quyền lực nhà nước cao nhất; Chính phủ là cơ quan hành chính nhà nước cao nhất.", "b) Chủ tịch nước là người đứng đầu Nhà nước.", "c) Tòa án nhân dân thực hiện quyền hành pháp.", "d) Viện kiểm sát nhân dân thực hành quyền công tố."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng theo Điều 69, 86, 94, 107 Hiến pháp 2013. c sai: Tòa án nhân dân thực hiện quyền tư pháp (Điều 102).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Chính phủ chịu trách nhiệm trước Quốc hội (Điều 94).", "b) Chủ tịch nước do Quốc hội bầu (Điều 87).", "c) Thủ tướng Chính phủ do Chủ tịch nước trực tiếp bổ nhiệm mà không qua Quốc hội.", "d) Quốc hội thực hiện quyền lập hiến, quyền lập pháp (Điều 69)."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng theo Hiến pháp 2013. c sai: Thủ tướng Chính phủ do Quốc hội bầu trong số đại biểu Quốc hội theo đề nghị của Chủ tịch nước (Điều 95).", "points": 1}, {"type": "short", "level": "VD", "q": "Theo Điều 69 Hiến pháp 2013, Quốc hội thực hiện giám sát ... đối với hoạt động của Nhà nước (điền cụm từ còn thiếu).", "answer": "tối cao", "explain": "Điều 69 Hiến pháp 2013: Quốc hội giám sát tối cao đối với hoạt động của Nhà nước.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Theo Điều 94 Hiến pháp 2013, Chính phủ chịu trách nhiệm trước ... (điền tên cơ quan còn thiếu).", "answer": "Quốc hội", "explain": "Điều 94 Hiến pháp 2013: Chính phủ chịu trách nhiệm trước Quốc hội.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Theo Hiến pháp 2013, cơ quan nào có quyền làm Hiến pháp và sửa đổi Hiến pháp?", "options": ["A. Quốc hội.", "B. Chính phủ.", "C. Chủ tịch nước.", "D. Tòa án nhân dân tối cao."], "answer": "A", "explain": "Điều 70 Hiến pháp 2013: Quốc hội làm Hiến pháp và sửa đổi Hiến pháp; làm luật và sửa đổi luật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp 2013, nhiệm kỳ của Quốc hội và Hội đồng nhân dân các cấp là bao nhiêu năm?", "options": ["A. 5 năm.", "B. 4 năm.", "C. 3 năm.", "D. 6 năm."], "answer": "A", "explain": "Điều 71 Hiến pháp 2013: Nhiệm kỳ của mỗi khóa Quốc hội là 5 năm; nhiệm kỳ của mỗi khóa Hội đồng nhân dân là 5 năm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ủy ban thường vụ Quốc hội là cơ quan nào?", "options": ["A. Cơ quan thường trực của Quốc hội.", "B. Cơ quan thường trực của Chính phủ.", "C. Cơ quan xét xử thường trực.", "D. Cơ quan công tố thường trực."], "answer": "A", "explain": "Điều 74 Hiến pháp 2013: Ủy ban thường vụ Quốc hội là cơ quan thường trực của Quốc hội.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đại biểu Quốc hội có trách nhiệm như thế nào đối với cử tri?", "options": ["A. Liên hệ chặt chẽ với cử tri, chịu sự giám sát của cử tri; thu thập và phản ánh ý kiến của cử tri với Quốc hội.", "B. Không cần liên hệ với cử tri.", "C. Chỉ báo cáo với Chính phủ.", "D. Chỉ chịu trách nhiệm trước Chủ tịch nước."], "answer": "A", "explain": "Điều 79 Hiến pháp 2013: Đại biểu Quốc hội liên hệ chặt chẽ với cử tri, chịu sự giám sát của cử tri; thu thập và phản ánh trung thực ý kiến, nguyện vọng của cử tri với Quốc hội.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đại biểu Quốc hội X tiếp xúc cử tri, lắng nghe ý kiến của nhân dân về dự án luật rồi phản ánh tại kỳ họp Quốc hội. Hoạt động này thể hiện bản chất nào của Quốc hội theo Điều 69 Hiến pháp 2013?", "options": ["A. Quốc hội là cơ quan đại biểu cao nhất của Nhân dân.", "B. Quốc hội là cơ quan hành pháp.", "C. Quốc hội là cơ quan xét xử.", "D. Quốc hội độc lập với Nhân dân."], "answer": "A", "explain": "Điều 69 xác định Quốc hội là cơ quan đại biểu cao nhất của Nhân dân; hoạt động tiếp xúc cử tri, phản ánh ý kiến nhân dân thể hiện bản chất đại diện này.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Chính phủ trình Quốc hội dự án luật; Quốc hội thảo luận, thông qua; sau đó Chính phủ ban hành nghị định hướng dẫn thi hành. Trình tự này thể hiện mối quan hệ nào?", "options": ["A. Chính phủ là cơ quan chấp hành của Quốc hội; Quốc hội thực hiện quyền lập pháp, Chính phủ tổ chức thi hành luật.", "B. Chính phủ có quyền lập pháp thay Quốc hội.", "C. Quốc hội là cơ quan chấp hành của Chính phủ.", "D. Hai cơ quan không phối hợp với nhau."], "answer": "A", "explain": "Điều 69: Quốc hội thực hiện quyền lập pháp; Điều 94: Chính phủ là cơ quan chấp hành của Quốc hội; Điều 96: Chính phủ tổ chức thi hành Hiến pháp, luật.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Quốc hội có quyền làm luật và sửa đổi luật (Điều 70).", "b) Ủy ban thường vụ Quốc hội là cơ quan thường trực của Quốc hội.", "c) Chính phủ có quyền sửa đổi Hiến pháp.", "d) Chủ tịch nước công bố Hiến pháp, luật, pháp lệnh (Điều 88)."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng theo Hiến pháp 2013. c sai: chỉ Quốc hội mới có quyền làm Hiến pháp và sửa đổi Hiến pháp (Điều 70).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Đại biểu Quốc hội chịu sự giám sát của cử tri.", "b) Quốc hội quyết định mục tiêu, chính sách phát triển kinh tế - xã hội của đất nước.", "c) Mọi quyết định của Chính phủ đều không cần căn cứ vào Hiến pháp, luật.", "d) Tòa án xét xử độc lập và chỉ tuân theo pháp luật."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng theo Điều 79, 70, 103 Hiến pháp 2013. c sai: Chính phủ tổ chức thi hành Hiến pháp, luật; mọi hoạt động của Chính phủ phải tuân theo Hiến pháp, luật.", "points": 1}, {"type": "short", "level": "VD", "q": "Theo Hiến pháp 2013, ... là cơ quan thường trực của Quốc hội (điền tên cơ quan còn thiếu).", "answer": "Ủy ban thường vụ Quốc hội", "explain": "Điều 74 Hiến pháp 2013: Ủy ban thường vụ Quốc hội là cơ quan thường trực của Quốc hội.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nhiệm kỳ của mỗi khóa Quốc hội là ... năm (điền số còn thiếu).", "answer": "5", "explain": "Điều 71 Hiến pháp 2013: Nhiệm kỳ của mỗi khóa Quốc hội là 5 năm.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Theo Điều 115 Hiến pháp 2013, đại biểu Hội đồng nhân dân có quyền chất vấn những ai?", "options": ["A. Chủ tịch UBND, các thành viên khác của UBND, Chánh án TAND, Viện trưởng VKSND cùng cấp và thủ trưởng cơ quan thuộc UBND.", "B. Chỉ Chủ tịch UBND.", "C. Chỉ đại biểu Quốc hội.", "D. Không được chất vấn ai."], "answer": "A", "explain": "Điều 115 khoản 2 Hiến pháp 2013: Đại biểu Hội đồng nhân dân có quyền chất vấn Chủ tịch Ủy ban nhân dân, các thành viên khác của Ủy ban nhân dân, Chánh án Tòa án nhân dân, Viện trưởng Viện kiểm sát nhân dân và Thủ trưởng cơ quan thuộc Ủy ban nhân dân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cấp chính quyền địa phương gồm những cơ quan nào?", "options": ["A. Hội đồng nhân dân và Ủy ban nhân dân.", "B. Quốc hội và Chính phủ.", "C. Tòa án nhân dân và Viện kiểm sát nhân dân.", "D. Chỉ có Ủy ban nhân dân."], "answer": "A", "explain": "Điều 111 Hiến pháp 2013: Cấp chính quyền địa phương gồm có Hội đồng nhân dân và Ủy ban nhân dân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Điều 116 Hiến pháp 2013, HĐND, UBND có trách nhiệm gì đối với Mặt trận Tổ quốc Việt Nam?", "options": ["A. Thông báo tình hình của địa phương, lắng nghe ý kiến, kiến nghị; phối hợp động viên Nhân dân thực hiện nhiệm vụ.", "B. Không có mối quan hệ gì.", "C. Chịu sự lãnh đạo trực tiếp về mọi mặt.", "D. Báo cáo để xin ý kiến trước mọi quyết định."], "answer": "A", "explain": "Điều 116 Hiến pháp 2013: Hội đồng nhân dân, Ủy ban nhân dân thực hiện chế độ thông báo tình hình của địa phương cho Mặt trận Tổ quốc Việt Nam, lắng nghe ý kiến, kiến nghị; phối hợp động viên Nhân dân thực hiện các nhiệm vụ ở địa phương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi người dân khiếu nại về việc cấp Giấy chứng nhận quyền sử dụng đất chậm trễ, cơ quan nào ở địa phương có trách nhiệm tổ chức thi hành pháp luật và giải quyết?", "options": ["A. Ủy ban nhân dân.", "B. Hội đồng nhân dân trực tiếp giải quyết.", "C. Tòa án nhân dân tối cao.", "D. Quốc hội."], "answer": "A", "explain": "Điều 114 khoản 2 Hiến pháp 2013: Ủy ban nhân dân tổ chức việc thi hành Hiến pháp và pháp luật ở địa phương; việc cấp Giấy chứng nhận quyền sử dụng đất thuộc trách nhiệm tổ chức thực hiện của UBND.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ông D bị kết án oan và muốn kêu oan. Theo Hiến pháp 2013, ông D có thể gửi đơn đến cơ quan nào để được xem xét lại bản án theo thủ tục tố tụng?", "options": ["A. Tòa án nhân dân cấp có thẩm quyền (cơ quan xét xử, thực hiện quyền tư pháp).", "B. Quốc hội trực tiếp xét xử lại.", "C. Chính phủ.", "D. Ủy ban nhân dân tỉnh."], "answer": "A", "explain": "Điều 102 Hiến pháp 2013: Tòa án nhân dân là cơ quan xét xử, thực hiện quyền tư pháp; việc xem xét lại bản án thuộc thẩm quyền của Tòa án theo thủ tục tố tụng, không thuộc Quốc hội hay Chính phủ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong một vụ án, Viện kiểm sát rút toàn bộ cáo trạng vì không đủ chứng cứ buộc tội, Tòa án tuyên bị cáo không phạm tội. Diễn biến này thể hiện đúng vai trò nào của hai cơ quan?", "options": ["A. Viện kiểm sát thực hành quyền công tố; Tòa án xét xử độc lập, chỉ tuân theo pháp luật và chứng cứ.", "B. Viện kiểm sát xét xử thay Tòa án.", "C. Tòa án phải xử theo ý của Viện kiểm sát.", "D. Hai cơ quan đã vi phạm pháp luật."], "answer": "A", "explain": "Điều 107: Viện kiểm sát thực hành quyền công tố (buộc tội khi đủ chứng cứ, rút cáo trạng khi không đủ chứng cứ); Điều 102, 103: Tòa án thực hiện quyền tư pháp, xét xử độc lập và chỉ tuân theo pháp luật.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Cấp chính quyền địa phương gồm HĐND và UBND (Điều 111).", "b) Đại biểu HĐND có quyền chất vấn Chủ tịch UBND cùng cấp (Điều 115).", "c) UBND do Nhân dân trực tiếp bầu ra.", "d) HĐND, UBND phối hợp với Mặt trận Tổ quốc động viên Nhân dân thực hiện nhiệm vụ ở địa phương (Điều 116)."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng theo Điều 111, 115, 116 Hiến pháp 2013. c sai: UBND do HĐND cùng cấp bầu (Điều 114).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Khi HĐND hết nhiệm kỳ, UBND vẫn tiếp tục làm nhiệm vụ cho đến khi HĐND khóa mới bầu ra UBND khóa mới.", "b) Mọi quyết định của UBND đều không chịu sự giám sát của HĐND.", "c) Công dân có quyền khiếu nại, tố cáo khi quyền và lợi ích hợp pháp bị xâm phạm.", "d) Tòa án xét xử tập thể và quyết định theo đa số, trừ trường hợp luật định xét xử một Thẩm phán."], "answer": ["T", "F", "T", "T"], "explain": "a đúng theo Luật Tổ chức chính quyền địa phương. b sai: HĐND giám sát việc tuân theo Hiến pháp, pháp luật ở địa phương (Điều 113). c đúng theo Điều 30 Hiến pháp 2013. d đúng theo Điều 103 Hiến pháp 2013.", "points": 1}, {"type": "short", "level": "VD", "q": "Theo Điều 115 Hiến pháp 2013, đại biểu Hội đồng nhân dân có quyền ... Chủ tịch Ủy ban nhân dân cùng cấp (điền động từ còn thiếu).", "answer": "chất vấn", "explain": "Điều 115 khoản 2 Hiến pháp 2013: Đại biểu Hội đồng nhân dân có quyền chất vấn Chủ tịch Ủy ban nhân dân.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cấp chính quyền địa phương gồm Hội đồng nhân dân và ... (điền tên cơ quan còn thiếu).", "answer": "Ủy ban nhân dân", "explain": "Điều 111 Hiến pháp 2013: Cấp chính quyền địa phương gồm có Hội đồng nhân dân và Ủy ban nhân dân.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Hiến pháp 2013 quy định về bộ máy nhà nước trong các chương nào?", "options": ["A. Chương VIII, IX, X, XI.", "B. Chương I, II, III.", "C. Chương V, VI, VII.", "D. Chương XI và XII."], "answer": "A", "explain": "Hiến pháp 2013 (gồm 11 chương) quy định về bộ máy nhà nước từ Chương VIII (Quốc hội) đến Chương XI (Chính quyền địa phương).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tắc tổ chức quyền lực nhà nước được quy định tại điều nào của Hiến pháp 2013?", "options": ["A. Điều 2.", "B. Điều 69.", "C. Điều 94.", "D. Điều 102."], "answer": "A", "explain": "Điều 2 (khoản 3) Hiến pháp 2013 quy định nguyên tắc: Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Hiến pháp 2013, Chủ tịch nước, Thủ tướng Chính phủ, Chánh án Tòa án nhân dân tối cao, Viện trưởng Viện kiểm sát nhân dân tối cao có điểm chung nào?", "options": ["A. Đều do Quốc hội bầu.", "B. Đều do nhân dân trực tiếp bầu.", "C. Đều do Chính phủ bổ nhiệm.", "D. Đều do Chủ tịch nước bổ nhiệm."], "answer": "A", "explain": "Theo Điều 70, 87, 88, 95 Hiến pháp 2013, các chức danh này đều do Quốc hội bầu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân biệt cơ quan quyền lực nhà nước cao nhất và cơ quan quyền lực nhà nước ở địa phương: hai cơ quan đó là?", "options": ["A. Quốc hội và Hội đồng nhân dân.", "B. Chính phủ và Ủy ban nhân dân.", "C. Quốc hội và Chính phủ.", "D. Tòa án nhân dân và Viện kiểm sát nhân dân."], "answer": "A", "explain": "Điều 69: Quốc hội là cơ quan quyền lực nhà nước cao nhất; Điều 113: Hội đồng nhân dân là cơ quan quyền lực nhà nước ở địa phương.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn A nói: Chủ tịch nước là người đứng đầu Chính phủ. Bạn B nói: Thủ tướng Chính phủ là người đứng đầu Chính phủ, Chủ tịch nước là người đứng đầu Nhà nước. Theo Hiến pháp 2013, ai nói đúng?", "options": ["A. Bạn B nói đúng.", "B. Bạn A nói đúng.", "C. Cả hai bạn đều đúng.", "D. Cả hai bạn đều sai."], "answer": "A", "explain": "Điều 86: Chủ tịch nước là người đứng đầu Nhà nước; người đứng đầu Chính phủ là Thủ tướng Chính phủ (Điều 95). Vậy bạn B nói đúng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đánh giá nhận định: Vì quyền lực nhà nước là thống nhất nên chỉ cần một cơ quan duy nhất thực hiện mọi quyền lập pháp, hành pháp, tư pháp. Nhận định này đúng hay sai theo Điều 2 Hiến pháp 2013?", "options": ["A. Sai, vì thống nhất quyền lực đi đôi với phân công, phối hợp, kiểm soát giữa các cơ quan trong thực hiện các quyền lập pháp, hành pháp, tư pháp.", "B. Đúng, vì thống nhất nghĩa là tập trung mọi quyền vào một cơ quan.", "C. Đúng, vì phân công quyền lực gây chồng chéo, kém hiệu quả.", "D. Sai, vì Việt Nam áp dụng nguyên tắc tam quyền phân lập."], "answer": "A", "explain": "Khoản 3 Điều 2 Hiến pháp 2013: Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp; thống nhất không đồng nghĩa với tập trung vào một cơ quan.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Điều 2 quy định nguyên tắc tổ chức quyền lực nhà nước.", "b) Quốc hội thực hiện quyền lập pháp; Chính phủ thực hiện quyền hành pháp; Tòa án thực hiện quyền tư pháp.", "c) Chủ tịch nước là người đứng đầu Chính phủ.", "d) HĐND là cơ quan quyền lực nhà nước ở địa phương; UBND là cơ quan chấp hành của HĐND."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng theo Điều 2, 69, 94, 102, 113, 114 Hiến pháp 2013. c sai: Chủ tịch nước là người đứng đầu Nhà nước (Điều 86).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Mọi quyền lực nhà nước đều thuộc về Nhân dân và do Nhân dân ủy quyền cho các cơ quan nhà nước.", "b) Tòa án xét xử độc lập, chỉ tuân theo pháp luật; nghiêm cấm can thiệp vào việc xét xử.", "c) Chính phủ là cơ quan quyền lực nhà nước cao nhất.", "d) Viện kiểm sát thực hành quyền công tố, kiểm sát hoạt động tư pháp."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng theo Điều 2, 103, 107 Hiến pháp 2013. c sai: cơ quan quyền lực nhà nước cao nhất là Quốc hội (Điều 69).", "points": 1}, {"type": "short", "level": "VD", "q": "Theo Điều 86 Hiến pháp 2013, Chủ tịch nước thay mặt nước Cộng hòa xã hội chủ nghĩa Việt Nam về đối nội và ... (điền từ còn thiếu).", "answer": "đối ngoại", "explain": "Điều 86 Hiến pháp 2013: Chủ tịch nước thay mặt nước Cộng hòa xã hội chủ nghĩa Việt Nam về đối nội và đối ngoại.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Bộ máy nhà nước ta gồm các cơ quan ở trung ương và chính quyền địa phương; cấp chính quyền địa phương gồm ... và ... (điền tên 2 cơ quan còn thiếu).", "answer": "Hội đồng nhân dân, Ủy ban nhân dân", "explain": "Điều 111 Hiến pháp 2013: Cấp chính quyền địa phương gồm có Hội đồng nhân dân và Ủy ban nhân dân.", "points": 0.5}]}]}
