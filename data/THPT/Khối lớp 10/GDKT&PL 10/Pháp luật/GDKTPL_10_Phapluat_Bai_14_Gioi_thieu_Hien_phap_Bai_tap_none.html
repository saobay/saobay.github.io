 pháp 2013, tất cả quyền lực nhà nước thuộc về ai? (Trả lời ngắn gọn)", "answer": "Nhân dân", "explain": "Hiến pháp 2013 khẳng định tất cả quyền lực nhà nước thuộc về Nhân dân.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điều nào của Hiến pháp 2013 quy định mọi văn bản quy phạm pháp luật khác phải phù hợp với Hiến pháp? (Trả lời: Điều ...)", "answer": "Điều 119", "explain": "Điều 119 Hiến pháp 2013 quy định Hiến pháp có hiệu lực pháp lý cao nhất và mọi văn bản pháp luật khác phải phù hợp với Hiến pháp.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Bản Hiến pháp thứ hai của Việt Nam được thông qua năm", "options": ["A. 1959.", "B. 1946.", "C. 1980.", "D. 1992."], "answer": "A", "explain": "Bản Hiến pháp thứ hai là Hiến pháp 1959.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bản Hiến pháp thứ ba của Việt Nam được thông qua năm", "options": ["A. 1980.", "B. 1959.", "C. 1992.", "D. 2013."], "answer": "A", "explain": "Bản Hiến pháp thứ ba là Hiến pháp 1980, ra đời sau khi đất nước hoàn toàn thống nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bản Hiến pháp thứ tư của Việt Nam được thông qua năm", "options": ["A. 1992.", "B. 1980.", "C. 2013.", "D. 1946."], "answer": "A", "explain": "Bản Hiến pháp thứ tư là Hiến pháp 1992, ra đời trong thời kỳ đổi mới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiến pháp 1946 có ý nghĩa lịch sử", "options": ["A. là bản Hiến pháp dân chủ đầu tiên của nước Việt Nam mới, khẳng định độc lập, chủ quyền dân tộc.", "B. là bản Hiến pháp của thời kỳ đổi mới.", "C. là bản Hiến pháp quy định về kinh tế thị trường.", "D. là bản Hiến pháp hiện hành."], "answer": "A", "explain": "Hiến pháp 1946 là bản Hiến pháp đầu tiên, khẳng định độc lập, chủ quyền của nước Việt Nam Dân chủ Cộng hòa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nội dung nào sau đây KHÔNG thuộc nội dung cơ bản của Hiến pháp 2013?", "options": ["A. Quy định chi tiết mức thuế suất của từng mặt hàng.", "B. Chế độ chính trị của đất nước.", "C. Quyền và nghĩa vụ cơ bản của công dân.", "D. Tổ chức và hoạt động của bộ máy nhà nước."], "answer": "A", "explain": "Hiến pháp chỉ quy định những vấn đề cơ bản nhất; mức thuế suất chi tiết do các văn bản dưới luật quy định.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn A cho rằng: Hiến pháp chỉ là văn bản mang tính tuyên ngôn, không bắt buộc phải tuân theo. Ý kiến này", "options": ["A. sai, vì Hiến pháp có hiệu lực pháp lý cao nhất và mọi cá nhân, tổ chức đều phải tuân theo.", "B. đúng hoàn toàn.", "C. đúng một phần.", "D. không thể kết luận được."], "answer": "A", "explain": "Hiến pháp có hiệu lực pháp lý cao nhất; mọi hành vi vi phạm Hiến pháp đều bị xử lý (Điều 119).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về hiệu lực các bản Hiến pháp:", "statements": ["a) Các bản Hiến pháp 1946, 1959, 1980, 1992 đều đã hết hiệu lực.", "b) Hiến pháp 2013 kế thừa và phát triển những giá trị của các bản Hiến pháp trước.", "c) Mỗi bản Hiến pháp đều phản ánh đặc điểm của từng giai đoạn lịch sử đất nước.", "d) Việt Nam chưa bao giờ sửa đổi, thay thế Hiến pháp."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: chỉ Hiến pháp 2013 còn hiệu lực. b) Đúng. c) Đúng. d) Sai: đã có 5 bản Hiến pháp qua các thời kỳ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về Quốc hội:", "statements": ["a) Quốc hội là cơ quan duy nhất có quyền lập hiến, lập pháp.", "b) Hiến pháp 2013 quy định Quốc hội là cơ quan đại biểu cao nhất của Nhân dân, cơ quan quyền lực nhà nước cao nhất.", "c) Chủ tịch nước có quyền ban hành Hiến pháp.", "d) Tòa án nhân dân tối cao có quyền sửa đổi Hiến pháp."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng. b) Đúng: theo Hiến pháp 2013. c) Sai: chỉ Quốc hội mới có quyền ban hành Hiến pháp. d) Sai.", "points": 1}, {"type": "short", "level": "VDC", "q": "Bản Hiến pháp đầu tiên của Việt Nam được thông qua vào năm nào? (Trả lời bằng số)", "answer": "1946", "explain": "Hiến pháp 1946 là bản Hiến pháp đầu tiên của Việt Nam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Quốc hội khóa mấy đã thông qua Hiến pháp 2013? (Trả lời: Khóa ...)", "answer": "Khóa XIII", "explain": "Hiến pháp 2013 được Quốc hội khóa XIII thông qua ngày 28/11/2013.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Theo Hiến pháp 2013, công dân Việt Nam từ đủ bao nhiêu tuổi trở lên có quyền bầu cử?", "options": ["A. Từ đủ 18 tuổi.", "B. Từ đủ 16 tuổi.", "C. Từ đủ 20 tuổi.", "D. Từ đủ 21 tuổi."], "answer": "A", "explain": "Công dân từ đủ 18 tuổi trở lên có quyền bầu cử theo Hiến pháp 2013.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp 2013, công dân từ đủ bao nhiêu tuổi trở lên có quyền ứng cử đại biểu Quốc hội, đại biểu Hội đồng nhân dân?", "options": ["A. Từ đủ 21 tuổi.", "B. Từ đủ 18 tuổi.", "C. Từ đủ 20 tuổi.", "D. Từ đủ 25 tuổi."], "answer": "A", "explain": "Công dân từ đủ 21 tuổi trở lên có quyền ứng cử đại biểu Quốc hội, đại biểu Hội đồng nhân dân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiến pháp 2013 khẳng định nước Việt Nam là", "options": ["A. một nước độc lập, có chủ quyền, thống nhất và toàn vẹn lãnh thổ.", "B. một nước liên bang.", "C. một nước thuộc địa.", "D. một tỉnh của nước khác."], "answer": "A", "explain": "Hiến pháp 2013 khẳng định nước Cộng hòa xã hội chủ nghĩa Việt Nam là một nước độc lập, có chủ quyền, thống nhất và toàn vẹn lãnh thổ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Học sinh lớp 10 tìm hiểu Hiến pháp để", "options": ["A. hiểu quyền, nghĩa vụ của công dân và sống, làm việc theo Hiến pháp, pháp luật.", "B. chỉ để làm bài kiểm tra.", "C. để tranh luận với bạn bè.", "D. vì không có việc gì khác để làm."], "answer": "A", "explain": "Tìm hiểu Hiến pháp giúp học sinh biết quyền, nghĩa vụ của mình và sống theo Hiến pháp, pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc Quốc hội lấy ý kiến rộng rãi của Nhân dân khi xây dựng Hiến pháp 2013 thể hiện", "options": ["A. Hiến pháp thể hiện ý chí, nguyện vọng của Nhân dân.", "B. Hiến pháp do một cá nhân soạn thảo.", "C. Nhân dân trực tiếp ban hành luật.", "D. đó chỉ là thủ tục hình thức."], "answer": "A", "explain": "Hiến pháp là sự thể chế hóa ý chí, nguyện vọng của Nhân dân; việc lấy ý kiến Nhân dân thể hiện bản chất dân chủ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một đạo luật do Quốc hội ban hành có một số điều trái với Hiến pháp 2013. Theo thẩm quyền giám sát, cơ quan nào xem xét, yêu cầu sửa đổi, bãi bỏ?", "options": ["A. Quốc hội và Ủy ban Thường vụ Quốc hội.", "B. Chính phủ tự ý bãi bỏ.", "C. Tòa án nhân dân tối cao bãi bỏ.", "D. Không cơ quan nào có quyền xem xét."], "answer": "A", "explain": "Quốc hội và Ủy ban Thường vụ Quốc hội có quyền giám sát, yêu cầu sửa đổi, bãi bỏ văn bản trái Hiến pháp, pháp luật.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về quyền và nghĩa vụ công dân:", "statements": ["a) Công dân có quyền tham gia quản lý nhà nước, quản lý xã hội.", "b) Công dân có nghĩa vụ tuân theo Hiến pháp và pháp luật.", "c) Người Việt Nam định cư ở nước ngoài không được pháp luật bảo hộ.", "d) Trẻ em được Nhà nước, gia đình và xã hội bảo vệ, chăm sóc, giáo dục."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: tuân theo Hiến pháp, pháp luật là nghĩa vụ của công dân. c) Sai: Nhà nước bảo hộ công dân Việt Nam ở nước ngoài. d) Đúng: theo Hiến pháp 2013.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về chế độ kinh tế trong Hiến pháp 2013:", "statements": ["a) Kinh tế nhà nước giữ vai trò chủ đạo trong nền kinh tế quốc dân.", "b) Đất đai thuộc sở hữu toàn dân do Nhà nước đại diện chủ sở hữu và thống nhất quản lý.", "c) Các thành phần kinh tế đều bình đẳng, hợp tác và cạnh tranh theo pháp luật.", "d) Hiến pháp 2013 không quy định về bảo vệ môi trường."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: Hiến pháp 2013 có quy định về quyền được sống trong môi trường trong lành và nghĩa vụ bảo vệ môi trường.", "points": 1}, {"type": "short", "level": "VDC", "q": "Theo Hiến pháp 2013, công dân từ đủ bao nhiêu tuổi trở lên có quyền bầu cử? (Trả lời bằng số)", "answer": "18", "explain": "Công dân từ đủ 18 tuổi trở lên có quyền bầu cử.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Theo Hiến pháp 2013, công dân từ đủ bao nhiêu tuổi trở lên có quyền ứng cử? (Trả lời bằng số)", "answer": "21", "explain": "Công dân từ đủ 21 tuổi trở lên có quyền ứng cử đại biểu Quốc hội, đại biểu Hội đồng nhân dân.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Hiến pháp 2013 được Quốc hội khóa XIII thông qua vào ngày", "options": ["A. 28/11/2013.", "B. 01/01/2014.", "C. 28/11/2014.", "D. 02/09/2013."], "answer": "A", "explain": "Hiến pháp 2013 được Quốc hội khóa XIII thông qua ngày 28/11/2013.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiến pháp là cơ sở pháp lý cho", "options": ["A. việc xây dựng toàn bộ hệ thống pháp luật Việt Nam.", "B. chỉ hoạt động của Quốc hội.", "C. chỉ hoạt động kinh doanh của doanh nghiệp.", "D. hương ước của làng xã."], "answer": "A", "explain": "Hiến pháp là đạo luật gốc, là cơ sở để xây dựng toàn bộ hệ thống pháp luật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Văn bản quy phạm pháp luật nào sau đây có hiệu lực pháp lý cao nhất?", "options": ["A. Hiến pháp.", "B. Bộ luật.", "C. Luật.", "D. Nghị định."], "answer": "A", "explain": "Hiến pháp có hiệu lực pháp lý cao nhất; luật, bộ luật, nghị định đều phải phù hợp với Hiến pháp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tại sao việc ban hành, sửa đổi Hiến pháp cần trình tự, thủ tục đặc biệt, chặt chẽ?", "options": ["A. Vì Hiến pháp có vị trí đặc biệt quan trọng, hiệu lực pháp lý cao nhất và cần sự ổn định lâu dài.", "B. Vì Hiến pháp ít người đọc.", "C. Vì Hiến pháp do Chính phủ soạn thảo.", "D. Vì Hiến pháp không quan trọng."], "answer": "A", "explain": "Do vị trí đặc biệt và hiệu lực cao nhất, Hiến pháp cần được ban hành, sửa đổi theo trình tự đặc biệt để bảo đảm sự ổn định, trang nghiêm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Học sinh vi phạm nội quy nhà trường nhưng cho rằng Hiến pháp không cấm nên được làm. Suy nghĩ này", "options": ["A. sai, vì ngoài Hiến pháp còn có các văn bản pháp luật khác và nội quy mà học sinh phải tuân theo.", "B. đúng hoàn toàn.", "C. đúng vì Hiến pháp có hiệu lực cao nhất.", "D. không xác định được đúng sai."], "answer": "A", "explain": "Hiến pháp là luật gốc nhưng không điều chỉnh mọi việc chi tiết; học sinh còn phải tuân theo luật, nghị định, nội quy nhà trường phù hợp với Hiến pháp.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong các văn bản sau, văn bản nào phải được xây dựng trên cơ sở Hiến pháp và không được trái với Hiến pháp?", "options": ["A. Tất cả các văn bản quy phạm pháp luật.", "B. Chỉ Bộ luật Hình sự.", "C. Chỉ Luật Đất đai.", "D. Chỉ nghị định của Chính phủ."], "answer": "A", "explain": "Mọi văn bản quy phạm pháp luật (luật, bộ luật, nghị định, thông tư...) đều phải phù hợp với Hiến pháp theo Điều 119.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về hiệu lực của Hiến pháp:", "statements": ["a) Hiến pháp có hiệu lực pháp lý cao nhất trong hệ thống pháp luật Việt Nam.", "b) Luật, bộ luật, nghị định, thông tư đều phải phù hợp với Hiến pháp.", "c) Hiến pháp chỉ điều chỉnh quan hệ giữa các cơ quan nhà nước với nhau.", "d) Tuân thủ Hiến pháp là nghĩa vụ của mọi công dân, tổ chức."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Điều 119. b) Đúng. c) Sai: Hiến pháp điều chỉnh những quan hệ cơ bản nhất của xã hội, bao gồm cả quyền, nghĩa vụ công dân. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về Điều 119 Hiến pháp 2013:", "statements": ["a) Điều 119 khẳng định Hiến pháp là luật cơ bản, có hiệu lực pháp lý cao nhất.", "b) Mọi hành vi vi phạm Hiến pháp đều bị xử lý.", "c) Hiến pháp 2013 gồm 11 chương, 120 điều.", "d) Hiến pháp có thể bị thay thế bằng một nghị định của Chính phủ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: theo Điều 119. c) Đúng. d) Sai: chỉ Quốc hội mới có quyền ban hành, sửa đổi, thay thế Hiến pháp.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu tên cơ quan có thẩm quyền ban hành và sửa đổi Hiến pháp. (Viết đầy đủ)", "answer": "Quốc hội", "explain": "Chỉ Quốc hội mới có quyền ban hành và sửa đổi Hiến pháp.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sửa đổi Hiến pháp cần ít nhất bao nhiêu phần tổng số đại biểu Quốc hội biểu quyết tán thành? (Trả lời theo mẫu: 2/3)", "answer": "2/3", "explain": "Sửa đổi Hiến pháp cần ít nhất hai phần ba tổng số đại biểu Quốc hội biểu quyết tán thành.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Theo Hiến pháp 2013, Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam là nhà nước", "options": ["A. pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân.", "B. quân chủ chuyên chế.", "C. tư sản.", "D. liên bang."], "answer": "A", "explain": "Hiến pháp 2013 khẳng định Nhà nước ta là nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp 2013, tất cả quyền lực nhà nước thuộc về", "options": ["A. Nhân dân.", "B. Chính phủ.", "C. Quốc hội.", "D. Tòa án nhân dân tối cao."], "answer": "A", "explain": "Tất cả quyền lực nhà nước thuộc về Nhân dân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp 2013, Quốc hội là", "options": ["A. cơ quan đại biểu cao nhất của Nhân dân, cơ quan quyền lực nhà nước cao nhất.", "B. cơ quan hành chính nhà nước cao nhất.", "C. cơ quan xét xử cao nhất.", "D. một tổ chức xã hội."], "answer": "A", "explain": "Quốc hội là cơ quan đại biểu cao nhất của Nhân dân, cơ quan quyền lực nhà nước cao nhất của nước Cộng hòa xã hội chủ nghĩa Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiến pháp 2013 gồm 11 chương, trong đó chương quy định về quyền con người, quyền và nghĩa vụ cơ bản của công dân là", "options": ["A. Chương II.", "B. Chương I.", "C. Chương V.", "D. Chương XI."], "answer": "A", "explain": "Chương II Hiến pháp 2013 quy định về quyền con người, quyền và nghĩa vụ cơ bản của công dân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc Hiến pháp 2013 dành cả một chương quy định về quyền con người, quyền công dân thể hiện", "options": ["A. sự tôn trọng, bảo vệ quyền con người, quyền công dân của Nhà nước ta.", "B. sự coi nhẹ quyền của công dân.", "C. đó chỉ là hình thức.", "D. sự sao chép máy móc nước ngoài."], "answer": "A", "explain": "Việc dành Chương II cho quyền con người, quyền công dân thể hiện sự tôn trọng, bảo vệ quyền con người của Nhà nước ta.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ông X cho rằng quyền tự do ngôn luận là tuyệt đối, muốn nói gì cũng được kể cả vu khống người khác. Theo Hiến pháp 2013, ý kiến này", "options": ["A. sai, vì việc thực hiện quyền con người, quyền công dân không được xâm phạm lợi ích quốc gia, dân tộc, quyền và lợi ích hợp pháp của người khác.", "B. đúng hoàn toàn.", "C. đúng một phần.", "D. tùy từng trường hợp."], "answer": "A", "explain": "Hiến pháp 2013 quy định việc thực hiện quyền con người, quyền công dân không được xâm phạm lợi ích quốc gia, dân tộc, quyền và lợi ích hợp pháp của người khác.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về các quyền cơ bản:", "statements": ["a) Công dân bình đẳng trước pháp luật.", "b) Công dân có quyền tự do ngôn luận, tự do báo chí.", "c) Công dân có quyền khiếu nại, tố cáo.", "d) Quyền của công dân là tuyệt đối, không có giới hạn nào."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: việc thực hiện quyền không được xâm phạm lợi ích quốc gia, quyền hợp pháp của người khác.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về quyền và nghĩa vụ:", "statements": ["a) Hiến pháp 2013 bảo đảm quyền học tập của công dân.", "b) Công dân có nghĩa vụ bảo vệ Tổ quốc.", "c) Lao động là quyền và nghĩa vụ của công dân.", "d) Công dân không có nghĩa vụ nộp thuế."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: bảo vệ Tổ quốc là nghĩa vụ thiêng liêng. c) Đúng. d) Sai: mọi người có nghĩa vụ nộp thuế theo luật định.", "points": 1}, {"type": "short", "level": "VDC", "q": "Chương nào của Hiến pháp 2013 quy định về quyền con người, quyền và nghĩa vụ cơ bản của công dân? (Trả lời: Chương ...)", "answer": "Chương II", "explain": "Chương II Hiến pháp 2013 quy định về quyền con người, quyền và nghĩa vụ cơ bản của công dân.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Theo Hiến pháp 2013, lao động là gì của công dân? (Trả lời ngắn gọn)", "answer": "Quyền và nghĩa vụ", "explain": "Hiến pháp 2013 quy định lao động là quyền và nghĩa vụ của công dân.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Hiến pháp 1946 được Quốc hội thông qua trong bối cảnh", "options": ["A. sau Cách mạng tháng Tám 1945, Nhà nước Việt Nam Dân chủ Cộng hòa mới ra đời.", "B. sau công cuộc đổi mới 1986.", "C. sau khi đất nước hoàn toàn thống nhất 1976.", "D. thời kỳ Pháp thuộc."], "answer": "A", "explain": "Hiến pháp 1946 ra đời sau Cách mạng tháng Tám 1945, là bản Hiến pháp đầu tiên của nước Việt Nam mới.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiến pháp 1980 ra đời trong bối cảnh", "options": ["A. đất nước đã hoàn toàn thống nhất, cả nước đi lên chủ nghĩa xã hội.", "B. kháng chiến chống Mỹ cứu nước.", "C. công cuộc đổi mới đất nước.", "D. thời kỳ Pháp thuộc."], "answer": "A", "explain": "Sau khi đất nước hoàn toàn thống nhất (1976), Hiến pháp 1980 ra đời khi cả nước đi lên chủ nghĩa xã hội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiến pháp 1992 ra đời trong bối cảnh", "options": ["A. công cuộc đổi mới toàn diện đất nước.", "B. kháng chiến chống thực dân Pháp.", "C. kháng chiến chống đế quốc Mỹ.", "D. sau Cách mạng tháng Tám 1945."], "answer": "A", "explain": "Hiến pháp 1992 ra đời trong thời kỳ đổi mới toàn diện đất nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung của các bản Hiến pháp Việt Nam là", "options": ["A. đều khẳng định độc lập, chủ quyền của Tổ quốc và quyền làm chủ của Nhân dân.", "B. đều giống nhau hoàn toàn về nội dung.", "C. đều do nước ngoài soạn thảo.", "D. đều không có giá trị pháp lý."], "answer": "A", "explain": "Dù ra đời trong các giai đoạn khác nhau, các bản Hiến pháp đều khẳng định độc lập, chủ quyền và quyền làm chủ của Nhân dân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiến pháp 2013 ra đời nhằm", "options": ["A. thể chế hóa đường lối đổi mới và đáp ứng yêu cầu phát triển đất nước trong thời kỳ mới.", "B. thay đổi chế độ chính trị của đất nước.", "C. xóa bỏ hoàn toàn các bản Hiến pháp trước.", "D. phục vụ lợi ích của một nhóm người."], "answer": "A", "explain": "Hiến pháp 2013 kế thừa các bản Hiến pháp trước, đáp ứng yêu cầu xây dựng, phát triển đất nước trong thời kỳ mới.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "So với Hiến pháp 1992, Hiến pháp 2013 có điểm mới nổi bật là", "options": ["A. khẳng định rõ hơn về quyền con người, kinh tế thị trường định hướng xã hội chủ nghĩa và nhà nước pháp quyền.", "B. giảm số chương của Hiến pháp.", "C. bỏ quy định về tổ chức Quốc hội.", "D. không có điểm mới nào đáng kể."], "answer": "A", "explain": "Hiến pháp 2013 có nhiều điểm mới: hoàn thiện chế định quyền con người, ghi nhận kinh tế thị trường định hướng xã hội chủ nghĩa, khẳng định nhà nước pháp quyền xã hội chủ nghĩa.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về bối cảnh ra đời các bản Hiến pháp:", "statements": ["a) Mỗi bản Hiến pháp đều gắn với một giai đoạn lịch sử cụ thể của đất nước.", "b) Hiến pháp 2013 kế thừa những giá trị của các bản Hiến pháp trước.", "c) Hiến pháp 1946 là Hiến pháp của chế độ phong kiến.", "d) Hiến pháp là văn bản ổn định tuyệt đối, không bao giờ thay đổi."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng. b) Đúng. c) Sai: Hiến pháp 1946 là Hiến pháp dân chủ đầu tiên của nước Việt Nam mới. d) Sai: Hiến pháp được sửa đổi, thay thế cho phù hợp với từng giai đoạn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về bộ máy nhà nước trong Hiến pháp 2013:", "statements": ["a) Hiến pháp 2013 quy định Nhà nước ta là nhà nước pháp quyền xã hội chủ nghĩa.", "b) Hiến pháp 2013 ghi nhận nền kinh tế thị trường định hướng xã hội chủ nghĩa.", "c) Hiến pháp 2013 quy định về Hội đồng bầu cử quốc gia và Kiểm toán nhà nước.", "d) Hiến pháp 2013 không quy định về chính quyền địa phương."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: đây là hai thiết chế mới được Hiến pháp 2013 quy định. d) Sai: Hiến pháp 2013 có chương về chính quyền địa phương.", "points": 1}, {"type": "short", "level": "VDC", "q": "Hiến pháp 1992 được thay thế bằng Hiến pháp năm nào? (Trả lời bằng số)", "answer": "2013", "explain": "Hiến pháp 1992 đã được thay thế bằng Hiến pháp 2013 hiện hành.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tính đến nay, Việt Nam đã ban hành bao nhiêu bản Hiến pháp? (Trả lời bằng số)", "answer": "5", "explain": "Việt Nam đã ban hành 5 bản Hiến pháp: 1946, 1959, 1980, 1992, 2013.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Theo Hiến pháp 2013, ngôn ngữ quốc gia của Việt Nam là", "options": ["A. tiếng Việt.", "B. tiếng Anh.", "C. tiếng Pháp.", "D. Hiến pháp không quy định."], "answer": "A", "explain": "Hiến pháp 2013 quy định ngôn ngữ quốc gia là tiếng Việt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Hiến pháp 2013, Thủ đô của nước Cộng hòa xã hội chủ nghĩa Việt Nam là", "options": ["A. Hà Nội.", "B. Thành phố Hồ Chí Minh.", "C. Huế.", "D. Đà Nẵng."], "answer": "A", "explain": "Hiến pháp 2013 quy định Thủ đô nước Cộng hòa xã hội chủ nghĩa Việt Nam là Hà Nội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quốc kỳ, Quốc huy, Quốc ca của nước ta được quy định tại", "options": ["A. Hiến pháp 2013.", "B. Luật Giao thông đường bộ.", "C. hương ước của làng xã.", "D. không văn bản nào quy định."], "answer": "A", "explain": "Quốc kỳ, Quốc huy, Quốc ca là những vấn đề thiêng liêng, cơ bản của quốc gia nên được Hiến pháp quy định.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc Hiến pháp quy định về Quốc kỳ, Quốc huy, Quốc ca, Thủ đô thể hiện", "options": ["A. Hiến pháp quy định những vấn đề cơ bản nhất, thiêng liêng nhất của quốc gia.", "B. Hiến pháp chỉ quy định về kinh tế.", "C. Hiến pháp không quan trọng.", "D. đó chỉ là quy định hình thức."], "answer": "A", "explain": "Quốc kỳ, Quốc huy, Quốc ca, Thủ đô là những vấn đề cơ bản, thiêng liêng nhất nên do Hiến pháp quy định.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Hiến pháp 2013, công dân có nghĩa vụ trung thành với", "options": ["A. Tổ quốc.", "B. một cá nhân cụ thể.", "C. tổ chức nước ngoài.", "D. không phải trung thành với ai."], "answer": "A", "explain": "Bảo vệ Tổ quốc là nghĩa vụ thiêng liêng và quyền cao quý của công dân; công dân phải trung thành với Tổ quốc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong buổi sinh hoạt lớp, bạn A nói: Em chưa đủ 18 tuổi nên Hiến pháp chưa bảo vệ quyền của em. Ý kiến này", "options": ["A. sai, vì Hiến pháp bảo vệ quyền con người, quyền công dân của mọi người; trẻ em được Nhà nước, gia đình, xã hội bảo vệ đặc biệt.", "B. đúng hoàn toàn.", "C. đúng một phần.", "D. không thể kết luận."], "answer": "A", "explain": "Hiến pháp bảo vệ quyền của mọi người, không phân biệt tuổi tác; trẻ em còn được bảo vệ, chăm sóc, giáo dục đặc biệt.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về biểu tượng quốc gia:", "statements": ["a) Tiếng Việt là ngôn ngữ quốc gia.", "b) Thủ đô của Việt Nam là Hà Nội.", "c) Quốc kỳ, Quốc huy, Quốc ca được Hiến pháp quy định.", "d) Hiến pháp không quy định về bảo vệ Tổ quốc."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: Hiến pháp 2013 có chương về bảo vệ Tổ quốc.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nghĩa vụ công dân:", "statements": ["a) Mọi công dân đều có nghĩa vụ bảo vệ Tổ quốc.", "b) Công dân phải thực hiện nghĩa vụ quân sự theo quy định của pháp luật.", "c) Công dân Việt Nam không thể bị trục xuất, giao nộp cho nhà nước khác.", "d) Người nước ngoài cư trú ở Việt Nam không được pháp luật Việt Nam bảo hộ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: bảo vệ Tổ quốc là nghĩa vụ thiêng liêng. b) Đúng. c) Đúng: theo Hiến pháp 2013. d) Sai: người nước ngoài được pháp luật Việt Nam bảo hộ tính mạng, tài sản và các quyền lợi chính đáng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Theo Hiến pháp 2013, ngôn ngữ quốc gia của Việt Nam là tiếng gì? (Trả lời ngắn gọn)", "answer": "Tiếng Việt", "explain": "Ngôn ngữ quốc gia là tiếng Việt.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Theo Hiến pháp 2013, Thủ đô của nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành phố nào? (Viết đầy đủ)", "answer": "Hà Nội", "explain": "Thủ đô nước Cộng hòa xã hội chủ nghĩa Việt Nam là Hà Nội.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Hiến pháp 2013 có bao nhiêu chương?", "options": ["A. 11 chương.", "B. 10 chương.", "C. 12 chương.", "D. 9 chương."], "answer": "A", "explain": "Hiến pháp 2013 gồm 11 chương, 120 điều.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiến pháp 2013 có bao nhiêu điều?", "options": ["A. 120 điều.", "B. 147 điều.", "C. 100 điều.", "D. 150 điều."], "answer": "A", "explain": "Hiến pháp 2013 gồm 11 chương, 120 điều.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chương XI của Hiến pháp 2013 quy định về", "options": ["A. hiệu lực của Hiến pháp và việc sửa đổi Hiến pháp.", "B. quyền và nghĩa vụ cơ bản của công dân.", "C. tổ chức và hoạt động của Quốc hội.", "D. tổ chức và hoạt động của Chính phủ."], "answer": "A", "explain": "Chương XI quy định về hiệu lực của Hiến pháp và việc sửa đổi Hiến pháp, trong đó có Điều 119.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bạn học sinh nói: Hiến pháp xa vời, không liên quan đến học sinh. Em đánh giá ý kiến này", "options": ["A. Sai, vì Hiến pháp quy định quyền học tập, quyền được bảo vệ của trẻ em và nghĩa vụ tuân theo pháp luật của mọi công dân.", "B. Đúng hoàn toàn.", "C. Đúng một phần.", "D. Không cần quan tâm."], "answer": "A", "explain": "Hiến pháp gắn bó với mọi người, trong đó có học sinh: quyền học tập, được bảo vệ và nghĩa vụ tuân theo pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc tìm hiểu Hiến pháp giúp học sinh", "options": ["A. nâng cao ý thức tôn trọng, chấp hành pháp luật và biết bảo vệ quyền lợi chính đáng của mình.", "B. trốn tránh các nghĩa vụ công dân.", "C. không mang lại ích lợi gì.", "D. vi phạm pháp luật mà không bị xử lý."], "answer": "A", "explain": "Hiểu Hiến pháp giúp học sinh sống theo pháp luật, biết bảo vệ quyền lợi của mình và đấu tranh với hành vi vi phạm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Địa phương X ban hành quy định thu thêm một khoản phí trái với luật và Hiến pháp. Người dân có thể", "options": ["A. khiếu nại, tố cáo và yêu cầu cơ quan có thẩm quyền xem xét, bãi bỏ vì văn bản trái Hiến pháp, pháp luật.", "B. buộc phải nộp khoản phí đó.", "C. tự ý không nộp mà không cần lý do.", "D. bỏ đi nơi khác sinh sống."], "answer": "A", "explain": "Người dân có quyền khiếu nại, tố cáo; văn bản trái Hiến pháp, pháp luật phải bị xem xét, bãi bỏ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng ôn kiến thức):", "statements": ["a) Hiến pháp 2013 là Hiến pháp hiện hành, có hiệu lực pháp lý cao nhất.", "b) Việt Nam đã có 5 bản Hiến pháp: 1946, 1959, 1980, 1992, 2013.", "c) Mọi văn bản pháp luật khác phải phù hợp với Hiến pháp theo Điều 119.", "d) Công dân không cần tìm hiểu Hiến pháp."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: mọi công dân đều cần tìm hiểu, tuân theo Hiến pháp.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau (tổng ôn số liệu):", "statements": ["a) Hiến pháp 2013 được thông qua ngày 28/11/2013 và có hiệu lực từ 01/01/2014.", "b) Hiến pháp 2013 gồm 11 chương, 120 điều.", "c) Sửa đổi Hiến pháp cần ít nhất hai phần ba tổng số đại biểu Quốc hội tán thành.", "d) Chính phủ có quyền ban hành Hiến pháp mới."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: chỉ Quốc hội mới có quyền ban hành, sửa đổi Hiến pháp.", "points": 1}, {"type": "short", "level": "VDC", "q": "Văn bản quy phạm pháp luật trái với Hiến pháp thì có hiệu lực không? (Trả lời: Có/Không)", "answer": "Không", "explain": "Theo Điều 119, mọi văn bản pháp luật khác phải phù hợp với Hiến pháp; văn bản trái Hiến pháp không có hiệu lực.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Học sinh cần làm gì để thể hiện sự tôn trọng Hiến pháp? (Trả lời ngắn gọn)", "answer": "Tìm hiểu, tuân thủ Hiến pháp và pháp luật", "explain": "Tôn trọng Hiến pháp thể hiện qua việc tìm hiểu, tuân thủ Hiến pháp và pháp luật trong đời sống hằng ngày.", "points": 0.5}]}]}
