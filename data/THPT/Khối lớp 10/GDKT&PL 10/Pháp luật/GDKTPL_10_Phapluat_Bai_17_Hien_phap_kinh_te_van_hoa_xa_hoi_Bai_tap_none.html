 trong hoạt động kinh tế - xã hội?", "options": ["A. Thực hành tiết kiệm, chống lãng phí.", "B. Tối đa hóa lợi nhuận bằng mọi giá.", "C. Chi tiêu không cần kế hoạch.", "D. Ưu tiên nhập khẩu hàng xa xỉ."], "answer": "A", "explain": "Điều 56 Hiến pháp 2013 quy định cơ quan, tổ chức, cá nhân phải thực hành tiết kiệm, chống lãng phí, đấu tranh phòng, chống tham nhũng trong hoạt động kinh tế - xã hội.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Điều 52 Hiến pháp 2013, Nhà nước điều tiết nền kinh tế trên cơ sở nào?", "options": ["A. Tôn trọng các quy luật thị trường.", "B. Áp đặt mệnh lệnh hành chính một cách tuyệt đối.", "C. Can thiệp tùy ý vào mọi giao dịch kinh tế.", "D. Xóa bỏ hoàn toàn vai trò của thị trường."], "answer": "A", "explain": "Điều 52 Hiến pháp 2013: Nhà nước xây dựng và hoàn thiện thể chế kinh tế, điều tiết nền kinh tế trên cơ sở tôn trọng các quy luật thị trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Điều 55 Hiến pháp 2013, ngân sách nhà nước phải được quản lý và sử dụng như thế nào?", "options": ["A. Hiệu quả, công bằng, công khai, minh bạch, đúng pháp luật.", "B. Bí mật tuyệt đối, không ai được biết.", "C. Chỉ dùng cho các dự án có quy mô rất lớn.", "D. Do từng địa phương tự quyết, không cần thống nhất."], "answer": "A", "explain": "Điều 55 Hiến pháp 2013: Ngân sách nhà nước do Nhà nước thống nhất quản lý và phải được sử dụng hiệu quả, công bằng, công khai, minh bạch, đúng pháp luật.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Xã A được cấp ngân sách để xây trường học nhưng cán bộ xã lại dùng tiền đó để xây trụ sở khang trang vượt mức cần thiết. Hành vi này vi phạm quy định nào của Hiến pháp 2013?", "options": ["A. Điều 55 và Điều 56: ngân sách phải sử dụng hiệu quả, đúng pháp luật; phải thực hành tiết kiệm, chống lãng phí.", "B. Điều 51: vi phạm chế độ sở hữu.", "C. Điều 62: vi phạm chính sách khoa học, công nghệ.", "D. Không vi phạm điều nào vì đã dùng tiền ngân sách vào việc chung."], "answer": "A", "explain": "Điều 55 yêu cầu ngân sách nhà nước phải được sử dụng hiệu quả, đúng pháp luật; Điều 56 yêu cầu thực hành tiết kiệm, chống lãng phí. Dùng ngân sách sai mục đích, lãng phí là vi phạm cả hai điều này.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một công ty được cấp phép khai thác khoáng sản nhưng khai thác vượt trữ lượng cho phép, gây sụt lún đất đai. Theo Điều 53 Hiến pháp 2013, công ty phải chịu trách nhiệm gì?", "options": ["A. Bị xử lý theo pháp luật và có trách nhiệm khắc phục hậu quả.", "B. Không phải chịu trách nhiệm vì đã được cấp phép khai thác.", "C. Chỉ cần nộp thêm tiền cấp quyền khai thác là xong.", "D. Được tiếp tục khai thác đến khi hết mỏ."], "answer": "A", "explain": "Điều 53 Hiến pháp 2013 quy định tài nguyên khoáng sản là tài sản công thuộc sở hữu toàn dân, do Nhà nước đại diện chủ sở hữu và thống nhất quản lý; việc khai thác vượt phép, gây thiệt hại là vi phạm pháp luật, phải bị xử lý và khắc phục hậu quả.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Việt Nam xây dựng nền kinh tế độc lập, tự chủ (Điều 50).", "b) Tài nguyên thuộc sở hữu toàn dân (Điều 53).", "c) Ngân sách nhà nước do các địa phương tự quản lý, Nhà nước không thống nhất quản lý.", "d) Cơ quan, tổ chức, cá nhân phải thực hành tiết kiệm, chống lãng phí (Điều 56)."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng theo Điều 50, Điều 53 và Điều 56 Hiến pháp 2013. c sai: Điều 55 quy định ngân sách nhà nước do Nhà nước thống nhất quản lý.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Nhà nước xây dựng và hoàn thiện thể chế kinh tế (Điều 52).", "b) Nhà nước điều tiết nền kinh tế bằng mệnh lệnh hành chính, không cần tôn trọng quy luật thị trường.", "c) Đấu tranh phòng, chống tham nhũng trong hoạt động kinh tế - xã hội là yêu cầu của Điều 56.", "d) Ngân sách nhà nước chỉ cần sử dụng hiệu quả, không cần công khai, minh bạch."], "answer": ["T", "F", "T", "F"], "explain": "a, c đúng theo Điều 52 và Điều 56 Hiến pháp 2013. b sai: Điều 52 yêu cầu điều tiết nền kinh tế trên cơ sở tôn trọng các quy luật thị trường. d sai: Điều 55 yêu cầu ngân sách phải được sử dụng hiệu quả, công bằng, công khai, minh bạch, đúng pháp luật.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Theo Điều 53 Hiến pháp 2013, tài nguyên thuộc sở hữu ...", "answer": "toàn dân", "explain": "Điều 53 Hiến pháp 2013: đất đai, tài nguyên nước, tài nguyên khoáng sản và các tài sản do Nhà nước đầu tư, quản lý là tài sản công thuộc sở hữu toàn dân.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Theo Điều 55 Hiến pháp 2013, ngân sách nhà nước do ... thống nhất quản lý (điền từ còn thiếu).", "answer": "Nhà nước", "explain": "Điều 55 Hiến pháp 2013: Ngân sách nhà nước do Nhà nước thống nhất quản lý.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Theo Điều 57 Hiến pháp 2013, Nhà nước có trách nhiệm gì về việc làm?", "options": ["A. Khuyến khích, tạo điều kiện để tổ chức, cá nhân tạo việc làm cho người lao động.", "B. Trực tiếp tuyển dụng mọi công dân vào cơ quan nhà nước.", "C. Cấm người dân tự tạo việc làm.", "D. Chỉ tạo việc làm ở các thành phố lớn."], "answer": "A", "explain": "Điều 57 khoản 1 Hiến pháp 2013: Nhà nước khuyến khích, tạo điều kiện để tổ chức, cá nhân tạo việc làm cho người lao động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Điều 57 Hiến pháp 2013, Nhà nước bảo vệ quyền và lợi ích hợp pháp của những ai?", "options": ["A. Người lao động và người sử dụng lao động.", "B. Chỉ người lao động.", "C. Chỉ người sử dụng lao động.", "D. Chỉ cán bộ, công chức nhà nước."], "answer": "A", "explain": "Điều 57 khoản 2 Hiến pháp 2013: Nhà nước bảo vệ quyền, lợi ích hợp pháp của người lao động, người sử dụng lao động.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Điều 57 Hiến pháp 2013, Nhà nước tạo điều kiện xây dựng quan hệ lao động như thế nào?", "options": ["A. Tiến bộ, hài hòa và ổn định.", "B. Cạnh tranh gay gắt giữa các bên.", "C. Người sử dụng lao động quyết định tất cả.", "D. Người lao động không cần tuân thủ kỷ luật lao động."], "answer": "A", "explain": "Điều 57 khoản 2 Hiến pháp 2013: Nhà nước tạo điều kiện xây dựng quan hệ lao động tiến bộ, hài hòa và ổn định.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chị M làm công nhân nhưng bị công ty nợ lương 3 tháng. Theo Điều 57 Hiến pháp 2013, quyền lợi của chị M được bảo vệ như thế nào?", "options": ["A. Nhà nước bảo vệ quyền và lợi ích hợp pháp của người lao động.", "B. Chị M phải tự chịu vì đã ký hợp đồng lao động.", "C. Nhà nước chỉ bảo vệ người sử dụng lao động.", "D. Không có quy định nào của Hiến pháp bảo vệ chị M."], "answer": "A", "explain": "Điều 57 khoản 2 Hiến pháp 2013 quy định Nhà nước bảo vệ quyền, lợi ích hợp pháp của người lao động; việc nợ lương xâm phạm quyền lợi hợp pháp của chị M.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một doanh nghiệp thường xuyên bắt công nhân làm thêm giờ quá quy định mà không trả lương làm thêm. Hành vi này vi phạm tinh thần của điều luật nào trong Hiến pháp 2013?", "options": ["A. Điều 57: Nhà nước bảo vệ quyền, lợi ích hợp pháp của người lao động.", "B. Điều 51: vi phạm chế độ sở hữu.", "C. Điều 62: vi phạm chính sách khoa học, công nghệ.", "D. Điều 69: vi phạm quyền lập pháp của Quốc hội."], "answer": "A", "explain": "Điều 57 Hiến pháp 2013 quy định Nhà nước bảo vệ quyền, lợi ích hợp pháp của người lao động; bắt làm thêm giờ quá quy định, không trả lương làm thêm là xâm phạm quyền lợi hợp pháp của người lao động.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Huyện X có nhiều lao động nông thôn thiếu việc làm. Theo tinh thần Điều 57 Hiến pháp 2013, giải pháp nào sau đây của chính quyền huyện là phù hợp nhất?", "options": ["A. Khuyến khích, tạo điều kiện để các tổ chức, cá nhân đầu tư, mở xưởng sản xuất, dạy nghề, tạo việc làm tại chỗ.", "B. Cấm người dân đi làm ăn xa.", "C. Chỉ tuyển lao động vào cơ quan nhà nước.", "D. Phát tiền trợ cấp hằng tháng thay cho việc tạo việc làm."], "answer": "A", "explain": "Điều 57 khoản 1 Hiến pháp 2013: Nhà nước khuyến khích, tạo điều kiện để tổ chức, cá nhân tạo việc làm cho người lao động; giải pháp A thể hiện đúng trách nhiệm này.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau về Điều 57 Hiến pháp 2013:", "statements": ["a) Nhà nước khuyến khích, tạo điều kiện để tổ chức, cá nhân tạo việc làm cho người lao động.", "b) Nhà nước chỉ bảo vệ quyền lợi của người sử dụng lao động.", "c) Quan hệ lao động cần được xây dựng tiến bộ, hài hòa và ổn định.", "d) Người lao động không có quyền lợi hợp pháp nào được Nhà nước bảo vệ."], "answer": ["T", "F", "T", "F"], "explain": "a, c đúng theo Điều 57 Hiến pháp 2013. b, d sai: Nhà nước bảo vệ quyền, lợi ích hợp pháp của cả người lao động và người sử dụng lao động.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Tạo việc làm là trách nhiệm riêng của doanh nghiệp, Nhà nước không liên quan.", "b) Nhà nước bảo vệ quyền và lợi ích hợp pháp của cả người lao động và người sử dụng lao động.", "c) Tranh chấp lao động nên được giải quyết trên tinh thần xây dựng quan hệ lao động tiến bộ, hài hòa, ổn định.", "d) Người lao động bị nợ lương có thể yêu cầu cơ quan có thẩm quyền bảo vệ quyền lợi theo pháp luật."], "answer": ["F", "T", "T", "T"], "explain": "a sai: Điều 57 quy định Nhà nước khuyến khích, tạo điều kiện để tổ chức, cá nhân tạo việc làm. b, c, d đúng theo tinh thần Điều 57 Hiến pháp 2013.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Theo Điều 57 Hiến pháp 2013, Nhà nước tạo điều kiện xây dựng quan hệ lao động tiến bộ, hài hòa và ...", "answer": "ổn định", "explain": "Điều 57 khoản 2 Hiến pháp 2013: Nhà nước tạo điều kiện xây dựng quan hệ lao động tiến bộ, hài hòa và ổn định.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Theo Điều 57 Hiến pháp 2013, Nhà nước khuyến khích, tạo điều kiện để tổ chức, cá nhân ... cho người lao động (điền cụm từ còn thiếu).", "answer": "tạo việc làm", "explain": "Điều 57 khoản 1 Hiến pháp 2013: Nhà nước khuyến khích, tạo điều kiện để tổ chức, cá nhân tạo việc làm cho người lao động.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Theo Điều 58 Hiến pháp 2013, Nhà nước thực hiện chính sách nào về bảo hiểm y tế?", "options": ["A. Bảo hiểm y tế toàn dân.", "B. Chỉ người giàu mới được tham gia bảo hiểm y tế.", "C. Bỏ hẳn bảo hiểm y tế.", "D. Bảo hiểm y tế chỉ dành cho cán bộ, công chức."], "answer": "A", "explain": "Điều 58 khoản 1 Hiến pháp 2013 quy định Nhà nước thực hiện bảo hiểm y tế toàn dân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Điều 59 Hiến pháp 2013, Nhà nước thực hiện chính sách ưu đãi đối với ai?", "options": ["A. Người có công với nước.", "B. Người giàu có.", "C. Người nước ngoài.", "D. Người vi phạm pháp luật."], "answer": "A", "explain": "Điều 59 khoản 1 Hiến pháp 2013: Nhà nước, xã hội tôn vinh, khen thưởng, thực hiện chính sách ưu đãi đối với người có công với nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Điều 58 Hiến pháp 2013, Nhà nước ưu tiên chăm sóc sức khỏe cho những đối tượng nào?", "options": ["A. Đồng bào dân tộc thiểu số, đồng bào ở miền núi, hải đảo và vùng có điều kiện kinh tế - xã hội đặc biệt khó khăn.", "B. Người dân ở các thành phố lớn.", "C. Người có thu nhập cao.", "D. Người nước ngoài sinh sống tại Việt Nam."], "answer": "A", "explain": "Điều 58 khoản 1 Hiến pháp 2013 quy định chính sách ưu tiên chăm sóc sức khỏe cho đồng bào dân tộc thiểu số, đồng bào ở miền núi, hải đảo và vùng có điều kiện kinh tế - xã hội đặc biệt khó khăn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Điều 59 Hiến pháp 2013, Nhà nước có chính sách trợ giúp những đối tượng nào?", "options": ["A. Người cao tuổi, người khuyết tật, người nghèo và người có hoàn cảnh khó khăn.", "B. Chỉ người cao tuổi.", "C. Chỉ người khuyết tật.", "D. Mọi công dân đều được trợ cấp như nhau."], "answer": "A", "explain": "Điều 59 khoản 2 Hiến pháp 2013: Nhà nước có chính sách trợ giúp người cao tuổi, người khuyết tật, người nghèo và người có hoàn cảnh khó khăn khác.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Em H là học sinh nghèo vượt khó, bị khuyết tật ở chân. Theo Điều 59 và Điều 61 Hiến pháp 2013, em H được hưởng những chính sách nào của Nhà nước?", "options": ["A. Được trợ giúp theo chính sách an sinh xã hội và được tạo điều kiện học văn hóa, học nghề.", "B. Không được hưởng chính sách nào của Nhà nước.", "C. Chỉ được trợ giúp về y tế.", "D. Chỉ được miễn học phí ở cấp tiểu học."], "answer": "A", "explain": "Điều 59 quy định Nhà nước trợ giúp người khuyết tật, người nghèo và phát triển hệ thống an sinh xã hội; Điều 61 quy định tạo điều kiện để người khuyết tật và người nghèo được học văn hóa và học nghề.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Gia đình bà L là hộ nghèo, có con nhỏ bị bệnh hiểm nghèo. Theo tinh thần Điều 58 và Điều 59 Hiến pháp 2013, Nhà nước có trách nhiệm gì?", "options": ["A. Thực hiện bảo hiểm y tế toàn dân, ưu tiên chăm sóc sức khỏe và có chính sách trợ giúp người nghèo, người có hoàn cảnh khó khăn.", "B. Không có trách nhiệm gì vì đó là việc riêng của gia đình.", "C. Chỉ hỗ trợ khi gia đình có đơn xin đặc biệt.", "D. Chỉ hỗ trợ đối với người có công với nước."], "answer": "A", "explain": "Điều 58 quy định Nhà nước thực hiện bảo hiểm y tế toàn dân và chăm lo sức khỏe nhân dân; Điều 59 quy định Nhà nước trợ giúp người nghèo, người có hoàn cảnh khó khăn và phát triển hệ thống an sinh xã hội.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Nhà nước thực hiện bảo hiểm y tế toàn dân (Điều 58).", "b) Nhà nước thực hiện chính sách ưu đãi đối với ng ển giáo dục là gì?", "options": ["A. Nâng cao dân trí, phát triển nguồn nhân lực, bồi dưỡng nhân tài.", "B. Chỉ để lấy bằng cấp.", "C. Chỉ để phục vụ xuất khẩu lao động.", "D. Chỉ để đào tạo cán bộ nhà nước."], "answer": "A", "explain": "Điều 61 khoản 1 Hiến pháp 2013 xác định mục đích phát triển giáo dục là nâng cao dân trí, phát triển nguồn nhân lực, bồi dưỡng nhân tài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Điều 61 Hiến pháp 2013, cấp học nào là bắt buộc và Nhà nước không thu học phí?", "options": ["A. Giáo dục tiểu học.", "B. Giáo dục mầm non.", "C. Giáo dục trung học cơ sở.", "D. Giáo dục đại học."], "answer": "A", "explain": "Điều 61 khoản 2 Hiến pháp 2013: Nhà nước bảo đảm giáo dục tiểu học là bắt buộc, Nhà nước không thu học phí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Điều 61 Hiến pháp 2013, Nhà nước ưu tiên phát triển giáo dục ở những vùng nào?", "options": ["A. Miền núi, hải đảo, vùng đồng bào dân tộc thiểu số và vùng có điều kiện kinh tế - xã hội đặc biệt khó khăn.", "B. Chỉ ở các thành phố lớn.", "C. Chỉ ở vùng đồng bằng.", "D. Chỉ ở nơi có khu công nghiệp."], "answer": "A", "explain": "Điều 61 khoản 3 Hiến pháp 2013 quy định Nhà nước ưu tiên phát triển giáo dục ở miền núi, hải đảo, vùng đồng bào dân tộc thiểu số và vùng có điều kiện kinh tế - xã hội đặc biệt khó khăn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Em K bị khuyết tật, gia đình có hoàn cảnh khó khăn. Theo Điều 61 Hiến pháp 2013, Nhà nước có chính sách gì đối với em K?", "options": ["A. Tạo điều kiện để người khuyết tật và người nghèo được học văn hóa và học nghề.", "B. Không có chính sách nào dành cho em K.", "C. Chỉ hỗ trợ về y tế.", "D. Chỉ hỗ trợ khi em K đạt học sinh giỏi."], "answer": "A", "explain": "Điều 61 khoản 3 Hiến pháp 2013: Nhà nước tạo điều kiện để người khuyết tật và người nghèo được học văn hóa và học nghề.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trường tiểu học X thu học phí của học sinh lớp 3 với lý do đóng góp tự nguyện nhưng thực chất là bắt buộc. Theo Điều 61 Hiến pháp 2013, việc làm này đúng hay sai?", "options": ["A. Sai, vì giáo dục tiểu học là bắt buộc và Nhà nước không thu học phí.", "B. Đúng, vì nhà trường cần kinh phí hoạt động.", "C. Đúng, nếu đa số phụ huynh đồng ý.", "D. Sai, vì tiểu học không phải là cấp học bắt buộc."], "answer": "A", "explain": "Điều 61 khoản 2 Hiến pháp 2013 quy định giáo dục tiểu học là bắt buộc, Nhà nước không thu học phí; việc thu học phí tiểu học dưới mọi hình thức là trái Hiến pháp.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau về Điều 61 Hiến pháp 2013:", "statements": ["a) Phát triển giáo dục là quốc sách hàng đầu.", "b) Giáo dục tiểu học là bắt buộc, Nhà nước không thu học phí.", "c) Nhà nước từng bước phổ cập giáo dục trung học.", "d) Nhà nước không quan tâm đến giáo dục ở vùng khó khăn."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng theo Điều 61 khoản 1 và khoản 2 Hiến pháp 2013. d sai: khoản 3 quy định Nhà nước ưu tiên phát triển giáo dục ở miền núi, hải đảo, vùng đồng bào dân tộc thiểu số và vùng khó khăn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Nhà nước ưu tiên sử dụng, phát triển nhân tài (Điều 61).", "b) Người khuyết tật và người nghèo được tạo điều kiện học văn hóa và học nghề.", "c) Thực hiện chính sách học bổng, học phí hợp lý là nội dung của Điều 61.", "d) Giáo dục đại học là bắt buộc đối với mọi công dân."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng theo Điều 61 Hiến pháp 2013. d sai: chỉ giáo dục tiểu học là bắt buộc.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: Theo Điều 61 Hiến pháp 2013, phát triển giáo dục là ... nhằm nâng cao dân trí, phát triển nguồn nhân lực, bồi dưỡng nhân tài.", "answer": "quốc sách hàng đầu", "explain": "Điều 61 khoản 1 Hiến pháp 2013: Phát triển giáo dục là quốc sách hàng đầu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Theo Điều 61 Hiến pháp 2013, Nhà nước không thu học phí ở cấp giáo dục ... (điền tên cấp học còn thiếu).", "answer": "tiểu học", "explain": "Điều 61 khoản 2 Hiến pháp 2013: giáo dục tiểu học là bắt buộc, Nhà nước không thu học phí.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Theo Điều 62 Hiến pháp 2013, phát triển khoa học và công nghệ được xác định là gì?", "options": ["A. Quốc sách hàng đầu, giữ vai trò then chốt trong phát triển kinh tế - xã hội.", "B. Nhiệm vụ thứ yếu, làm khi có điều kiện.", "C. Lĩnh vực chỉ dành cho các viện nghiên cứu.", "D. Lĩnh vực không cần đầu tư."], "answer": "A", "explain": "Điều 62 khoản 1 Hiến pháp 2013: Phát triển khoa học và công nghệ là quốc sách hàng đầu, giữ vai trò then chốt trong sự nghiệp phát triển kinh tế - xã hội của đất nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Điều 62 Hiến pháp 2013, Nhà nước bảo hộ quyền nào của các nhà sáng chế, tác giả?", "options": ["A. Quyền sở hữu trí tuệ.", "B. Quyền sở hữu đất đai.", "C. Quyền được miễn thuế tuyệt đối.", "D. Quyền giữ bí mật mọi công trình nghiên cứu."], "answer": "A", "explain": "Điều 62 khoản 2 Hiến pháp 2013: Nhà nước bảo hộ quyền sở hữu trí tuệ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Điều 62 Hiến pháp 2013, Nhà nước có chính sách đầu tư như thế nào đối với khoa học và công nghệ?", "options": ["A. Ưu tiên đầu tư và khuyến khích tổ chức, cá nhân đầu tư nghiên cứu, phát triển, chuyển giao, ứng dụng thành tựu khoa học và công nghệ.", "B. Không đầu tư, để tư nhân tự lo.", "C. Chỉ đầu tư cho khoa học cơ bản.", "D. Cấm tổ chức, cá nhân đầu tư vào khoa học, công nghệ."], "answer": "A", "explain": "Điều 62 khoản 2 Hiến pháp 2013: Nhà nước ưu tiên đầu tư và khuyến khích tổ chức, cá nhân đầu tư nghiên cứu, phát triển, chuyển giao, ứng dụng có hiệu quả thành tựu khoa học và công nghệ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Điều 62 Hiến pháp 2013, ai được tham gia và thụ hưởng lợi ích từ các hoạt động khoa học và công nghệ?", "options": ["A. Mọi người.", "B. Chỉ các nhà khoa học.", "C. Chỉ cán bộ, công chức nhà nước.", "D. Chỉ các doanh nghiệp lớn."], "answer": "A", "explain": "Điều 62 khoản 3 Hiến pháp 2013: Nhà nước tạo điều kiện để mọi người tham gia và được thụ hưởng lợi ích từ các hoạt động khoa học và công nghệ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhà khoa học N có công trình nghiên cứu được cấp bằng sáng chế nhưng bị một công ty sao chép để sản xuất hàng loạt. Theo Điều 62 Hiến pháp 2013, quyền của nhà khoa học N được bảo vệ như thế nào?", "options": ["A. Nhà nước bảo hộ quyền sở hữu trí tuệ, công ty sao chép phải bị xử lý.", "B. Không được bảo vệ vì sáng chế thuộc về toàn xã hội.", "C. Chỉ được bảo vệ nếu công trình có vốn đầu tư của Nhà nước.", "D. Nhà khoa học phải tự thương lượng, pháp luật không can thiệp."], "answer": "A", "explain": "Điều 62 khoản 2 Hiến pháp 2013: Nhà nước bảo hộ quyền sở hữu trí tuệ; hành vi sao chép sáng chế để kinh doanh là xâm phạm quyền sở hữu trí tuệ, phải bị xử lý.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Có ý kiến cho rằng chỉ cần đầu tư cho giáo dục là đủ, không cần đầu tư cho khoa học và công nghệ vì tốn kém. Theo tinh thần Điều 61 và Điều 62 Hiến pháp 2013, ý kiến này đúng hay sai?", "options": ["A. Sai, vì cả giáo dục và khoa học - công nghệ đều là quốc sách hàng đầu; khoa học - công nghệ còn giữ vai trò then chốt trong phát triển kinh tế - xã hội.", "B. Đúng, vì khoa học - công nghệ không quan trọng.", "C. Đúng một phần, vì chỉ giáo dục mới là quốc sách hàng đầu.", "D. Sai, vì chỉ khoa học - công nghệ mới là quốc sách hàng đầu."], "answer": "A", "explain": "Điều 61 xác định phát triển giáo dục là quốc sách hàng đầu; Điều 62 xác định phát triển khoa học và công nghệ là quốc sách hàng đầu, giữ vai trò then chốt trong phát triển kinh tế - xã hội. Cả hai lĩnh vực đều cần được đầu tư.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau về Điều 62 Hiến pháp 2013:", "statements": ["a) Phát triển khoa học và công nghệ là quốc sách hàng đầu.", "b) Khoa học và công nghệ giữ vai trò then chốt trong phát triển kinh tế - xã hội.", "c) Nhà nước bảo đảm quyền nghiên cứu khoa học và công nghệ.", "d) Nhà nước không bảo hộ quyền sở hữu trí tuệ."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng theo Điều 62 Hiến pháp 2013. d sai: khoản 2 quy định Nhà nước bảo hộ quyền sở hữu trí tuệ.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Nhà nước ưu tiên đầu tư cho nghiên cứu, phát triển, chuyển giao, ứng dụng thành tựu khoa học và công nghệ.", "b) Chỉ tổ chức nhà nước mới được đầu tư vào khoa học và công nghệ.", "c) Mọi người đều được tạo điều kiện tham gia và thụ hưởng lợi ích từ hoạt động khoa học và công nghệ.", "d) Sao chép sáng chế của người khác để kinh doanh là hành vi xâm phạm quyền sở hữu trí tuệ."], "answer": ["T", "F", "T", "T"], "explain": "a, c, d đúng theo Điều 62 Hiến pháp 2013. b sai: Nhà nước khuyến khích tổ chức, cá nhân đầu tư vào khoa học và công nghệ.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: Theo Điều 62 Hiến pháp 2013, phát triển khoa học và công nghệ là quốc sách hàng đầu, giữ vai trò ... trong sự nghiệp phát triển kinh tế - xã hội của đất nước.", "answer": "then chốt", "explain": "Điều 62 khoản 1 Hiến pháp 2013: Phát triển khoa học và công nghệ là quốc sách hàng đầu, giữ vai trò then chốt trong sự nghiệp phát triển kinh tế - xã hội của đất nước.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Theo Điều 62 Hiến pháp 2013, Nhà nước bảo hộ quyền ... của các nhà sáng chế, tác giả (điền cụm từ còn thiếu).", "answer": "sở hữu trí tuệ", "explain": "Điều 62 khoản 2 Hiến pháp 2013: Nhà nước bảo hộ quyền sở hữu trí tuệ.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Theo Điều 63 Hiến pháp 2013, Nhà nước có chính sách gì về môi trường?", "options": ["A. Chính sách bảo vệ môi trường.", "B. Không cần chính sách về môi trường.", "C. Chỉ bảo vệ môi trường ở thành phố.", "D. Giao hoàn toàn việc bảo vệ môi trường cho tư nhân."], "answer": "A", "explain": "Điều 63 khoản 1 Hiến pháp 2013: Nhà nước có chính sách bảo vệ môi trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo Điều 63 Hiến pháp 2013, tổ chức, cá nhân gây ô nhiễm môi trường phải chịu trách nhiệm gì?", "options": ["A. Bị xử lý nghiêm và có trách nhiệm khắc phục, bồi thường thiệt hại.", "B. Không phải chịu trách nhiệm gì.", "C. Chỉ cần xin lỗi là đủ.", "D. Chỉ bị nhắc nhở."], "answer": "A", "explain": "Điều 63 khoản 3 Hiến pháp 2013: Tổ chức, cá nhân gây ô nhiễm môi trường, làm suy kiệt tài nguyên thiên nhiên và suy giảm đa dạng sinh học phải bị xử lý nghiêm và có trách nhiệm khắc phục, bồi thường thiệt hại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Điều 63 Hiến pháp 2013, Nhà nước khuyến khích phát triển, sử dụng loại năng lượng nào?", "options": ["A. Năng lượng mới, năng lượng tái tạo.", "B. Chỉ năng lượng hóa thạch.", "C. Các loại năng lượng gây ô nhiễm.", "D. Không khuyến khích loại năng lượng nào."], "answer": "A", "explain": "Điều 63 khoản 2 Hiến pháp 2013: Nhà nước khuyến khích mọi hoạt động bảo vệ môi trường, phát triển, sử dụng năng lượng mới, năng lượng tái tạo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo Điều 63 Hiến pháp 2013, Nhà nước quản lý, sử dụng các nguồn tài nguyên thiên nhiên như thế nào?", "options": ["A. Hiệu quả, bền vững.", "B. Khai thác tối đa, cạn kiệt cũng được.", "C. Để tự nhiên, không quản lý.", "D. Chỉ khai thác để xuất khẩu."], "answer": "A", "explain": "Điều 63 khoản 1 Hiến pháp 2013: Nhà nước quản lý, sử dụng hiệu quả, bền vững các nguồn tài nguyên thiên nhiên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Công ty X xả nước thải chưa qua xử lý ra sông làm cá chết hàng loạt, ảnh hưởng sức khỏe người dân. Theo Điều 63 Hiến pháp 2013, công ty X phải chịu trách nhiệm gì?", "options": ["A. Bị xử lý nghiêm, khắc phục hậu quả và bồi thường thiệt hại.", "B. Chỉ bị phạt hành chính nhẹ là xong.", "C. Không phải bồi thường vì đã nộp thuế đầy đủ.", "D. Được tiếp tục xả thải nếu tạo nhiều việc làm."], "answer": "A", "explain": "Điều 63 khoản 3 Hiến pháp 2013: Tổ chức, cá nhân gây ô nhiễm môi trường phải bị xử lý nghiêm và có trách nhiệm khắc phục, bồi thường thiệt hại.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trước nguy cơ biến đổi khí hậu, theo Điều 63 Hiến pháp 2013, Nhà nước phải chủ động làm gì?", "options": ["A. Phòng, chống thiên tai, ứng phó với biến đổi khí hậu; bảo tồn thiên nhiên, đa dạng sinh học.", "B. Không cần làm gì vì đó là việc của cộng đồng quốc tế.", "C. Chỉ khắc phục sau khi thiên tai xảy ra.", "D. Di dân khỏi các vùng ven biển."], "answer": "A", "explain": "Điều 63 khoản 1 Hiến pháp 2013: Nhà nước bảo tồn thiên nhiên, đa dạng sinh học; chủ động phòng, chống thiên tai, ứng phó với biến đổi khí hậu.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau về Điều 63 Hiến pháp 2013:", "statements": ["a) Nhà nước có chính sách bảo vệ môi trường.", "b) Tổ chức, cá nhân gây ô nhiễm môi trường phải bị xử lý nghiêm và có trách nhiệm khắc phục, bồi thường thiệt hại.", "c) Nhà nước khuyến khích phát triển, sử dụng năng lượng mới, năng lượng tái tạo.", "d) Bảo vệ môi trường là việc riêng của Nhà nước, công dân không liên quan."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng theo Điều 63 Hiến pháp 2013. d sai: bảo vệ môi trường là trách nhiệm của Nhà nước, tổ chức và mọi cá nhân.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Quản lý, sử dụng hiệu quả, bền vững tài nguyên thiên nhiên là nội dung của Điều 63.", "b) Bảo tồn thiên nhiên, đa dạng sinh học là trách nhiệm được Hiến pháp quy định.", "c) Doanh nghiệp gây ô nhiễm chỉ cần nộp phạt là xong, không cần khắc phục hậu quả.", "d) Chủ động phòng, chống thiên tai, ứng phó với biến đổi khí hậu là nhiệm vụ của Nhà nước."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng theo Điều 63 Hiến pháp 2013. c sai: khoản 3 quy định tổ chức, cá nhân gây ô nhiễm phải bị xử lý nghiêm và có trách nhiệm khắc phục, bồi thường thiệt hại.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Theo Điều 63 Hiến pháp 2013, tổ chức, cá nhân gây ô nhiễm môi trường phải bị xử lý nghiêm và có trách nhiệm khắc phục, ... thiệt hại.", "answer": "bồi thường", "explain": "Điều 63 khoản 3 Hiến pháp 2013: có trách nhiệm khắc phục, bồi thường thiệt hại.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Theo Điều 63 Hiến pháp 2013, Nhà nước khuyến khích phát triển, sử dụng năng lượng mới, năng lượng ... (điền từ còn thiếu).", "answer": "tái tạo", "explain": "Điều 63 khoản 2 Hiến pháp 2013: Nhà nước khuyến khích phát triển, sử dụng năng lượng mới, năng lượng tái tạo.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Chương III của Hiến pháp 2013 (từ Điều 50 đến Điều 63) quy định về những lĩnh vực nào?", "options": ["A. Kinh tế, văn hóa, xã hội, giáo dục, khoa học, công nghệ và môi trường.", "B. Chế độ chính trị và quyền con người.", "C. Tổ chức bộ máy nhà nước.", "D. Bảo vệ Tổ quốc."], "answer": "A", "explain": "Chương III Hiến pháp 2013 (Điều 50 đến Điều 63) quy định về kinh tế, văn hóa, xã hội, giáo dục, khoa học, công nghệ và môi trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Điều nào trong Hiến pháp 2013 quy định về bảo vệ môi trường?", "options": ["A. Điều 63.", "B. Điều 51.", "C. Điều 60.", "D. Điều 61."], "answer": "A", "explain": "Điều 63 Hiến pháp 2013 quy định về chính sách bảo vệ môi trường, trách nhiệm của tổ chức, cá nhân gây ô nhiễm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điều nào trong Hiến pháp 2013 quy định phát triển giáo dục là quốc sách hàng đầu?", "options": ["A. Điều 61.", "B. Điều 62.", "C. Điều 63.", "D. Điều 60."], "answer": "A", "explain": "Điều 61 khoản 1 Hiến pháp 2013: Phát triển giáo dục là quốc sách hàng đầu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cả Điều 61 và Điều 62 Hiến pháp 2013 đều xác định lĩnh vực nào là quốc sách hàng đầu?", "options": ["A. Giáo dục và khoa học - công nghệ.", "B. Y tế và thể dục thể thao.", "C. Văn hóa và du lịch.", "D. Quốc phòng và an ninh."], "answer": "A", "explain": "Điều 61 xác định phát triển giáo dục là quốc sách hàng đầu; Điều 62 xác định phát triển khoa học và công nghệ là quốc sách hàng đầu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Học sinh P thắc mắc: vì sao Nhà nước miễn học phí tiểu học nhưng trung học phổ thông vẫn thu học phí? Theo Điều 61 Hiến pháp 2013, giải thích nào đúng?", "options": ["A. Vì Hiến pháp quy định giáo dục tiểu học là bắt buộc và Nhà nước không thu học phí; với trung học, Nhà nước từng bước phổ cập và thực hiện chính sách học phí hợp lý.", "B. Vì ngân sách nhà nước chỉ đủ cho cấp tiểu học.", "C. Vì học sinh trung học đã đủ tuổi đi làm kiếm tiền.", "D. Vì Hiến pháp không quy định gì về học phí."], "answer": "A", "explain": "Điều 61 khoản 2 Hiến pháp 2013: giáo dục tiểu học là bắt buộc, Nhà nước không thu học phí; từng bước phổ cập giáo dục trung học; thực hiện chính sách học bổng, học phí hợp lý.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một địa phương muốn thu hút đầu tư vào khu công nghiệp nhưng có nguy cơ ô nhiễm môi trường. Theo tinh thần Chương III Hiến pháp 2013, địa phương cần làm gì?", "options": ["A. Vừa khuyến khích đầu tư, phát triển kinh tế (Điều 51), vừa yêu cầu doanh nghiệp bảo vệ môi trường; xử lý nghiêm và buộc khắc phục, bồi thường nếu gây ô nhiễm (Điều 63).", "B. Ưu tiên phát triển kinh tế, tạm bỏ qua vấn đề môi trường.", "C. Cấm mọi hoạt động đầu tư để bảo vệ môi trường một cách tuyệt đối.", "D. Để doanh nghiệp tự quyết định vấn đề môi trường."], "answer": "A", "explain": "Chương III Hiến pháp 2013 vừa khuyến khích đầu tư, phát triển kinh tế (Điều 51), vừa yêu cầu bảo vệ môi trường và quy định trách nhiệm khắc phục, bồi thường của tổ chức, cá nhân gây ô nhiễm (Điều 63); phát triển kinh tế phải gắn với bảo vệ môi trường.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Điều 51 quy định về nền kinh tế; Điều 53 quy định về đất đai.", "b) Điều 60 quy định về văn hóa; Điều 61 quy định về giáo dục.", "c) Điều 62 quy định về môi trường; Điều 63 quy định về khoa học, công nghệ.", "d) Điều 57 quy định về việc làm; Điều 59 quy định về an sinh xã hội."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: Điều 62 quy định về khoa học, công nghệ; Điều 63 quy định về môi trường.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Kinh tế nhà nước giữ vai trò chủ đạo nhưng các thành phần kinh tế bình đẳng trước pháp luật.", "b) Tổ chức, cá nhân có quyền sở hữu đất đai tại Việt Nam.", "c) Phát triển giáo dục và phát triển khoa học - công nghệ đều là quốc sách hàng đầu.", "d) Người gây ô nhiễm môi trường chỉ bị xử lý khi gây thiệt hại rất lớn."], "answer": ["T", "F", "T", "F"], "explain": "a đúng theo Điều 51. b sai: đất đai thuộc sở hữu toàn dân, cá nhân chỉ có quyền sử dụng đất (Điều 53). c đúng theo Điều 61, 62. d sai: mọi hành vi gây ô nhiễm môi trường đều phải bị xử lý nghiêm và khắc phục, bồi thường thiệt hại (Điều 63).", "points": 1}, {"type": "short", "level": "VD", "q": "Theo Điều 51 Hiến pháp 2013, nền kinh tế Việt Nam là nền kinh tế thị trường định hướng ... (điền cụm từ còn thiếu).", "answer": "xã hội chủ nghĩa", "explain": "Điều 51 khoản 1 Hiến pháp 2013: Nền kinh tế Việt Nam là nền kinh tế thị trường định hướng xã hội chủ nghĩa.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Chương III Hiến pháp 2013 gồm các điều từ Điều 50 đến Điều ... (điền số còn thiếu).", "answer": "63", "explain": "Chương III Hiến pháp 2013 gồm các điều từ Điều 50 đến Điều 63.", "points": 0.5}]}]}
