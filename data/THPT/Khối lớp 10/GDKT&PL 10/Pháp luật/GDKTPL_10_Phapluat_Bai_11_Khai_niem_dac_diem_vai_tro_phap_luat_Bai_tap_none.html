 xã hội."], "answer": "B", "explain": "Tính xã hội: pháp luật bắt nguồn từ thực tiễn đời sống xã hội, phản ánh nhu cầu, lợi ích chung của xã hội và điều hòa các quan hệ xã hội.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ở Việt Nam, bản chất giai cấp của pháp luật thể hiện qua việc pháp luật", "options": ["A. bảo vệ lợi ích của giai cấp tư sản.", "B. thể hiện và bảo vệ ý chí, lợi ích của nhân dân lao động.", "C. đứng ngoài các giai cấp trong xã hội.", "D. chỉ bảo vệ lợi ích của cán bộ nhà nước."], "answer": "B", "explain": "Ở Việt Nam, nhân dân lao động là lực lượng lãnh đạo xã hội nên pháp luật thể hiện và bảo vệ ý chí, lợi ích của nhân dân lao động.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Việc pháp luật quy định các biện pháp bảo vệ môi trường, bảo đảm an sinh xã hội chủ yếu thể hiện mặt bản chất nào của pháp luật?", "options": ["A. Bản chất giai cấp.", "B. Tính xã hội.", "C. Tính cưỡng chế.", "D. Tính quy phạm."], "answer": "B", "explain": "Bảo vệ môi trường, an sinh xã hội là vì lợi ích chung của toàn xã hội, thể hiện tính xã hội của pháp luật: pháp luật phản ánh nhu cầu, lợi ích chung, điều hòa quan hệ xã hội.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Mối quan hệ giữa bản chất giai cấp và tính xã hội của pháp luật là", "options": ["A. mâu thuẫn, loại trừ lẫn nhau.", "B. độc lập, không liên quan đến nhau.", "C. thống nhất, gắn bó với nhau, không tách rời.", "D. tính xã hội quyết định bản chất giai cấp."], "answer": "C", "explain": "Hai mặt bản chất của pháp luật thống nhất, gắn bó với nhau: bản chất giai cấp cho biết pháp luật thể hiện ý chí của ai, tính xã hội cho biết pháp luật vì lợi ích chung của xã hội như thế nào.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau về bản chất của pháp luật:", "statements": ["a) Pháp luật mang bản chất giai cấp.", "b) Pháp luật có tính xã hội.", "c) Pháp luật chỉ phục vụ giai cấp thống trị, không quan tâm đến lợi ích chung của xã  nhiều lần trong đời sống xã hội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phạm vi áp dụng của quy phạm pháp luật là", "options": ["A. mọi cá nhân, tổ chức khi có đủ điều kiện mà quy phạm đó quy định.", "B. chỉ công dân Việt Nam.", "C. chỉ cơ quan nhà nước.", "D. chỉ những người có chức vụ."], "answer": "A", "explain": "Quy phạm pháp luật là quy tắc xử sự chung, áp dụng nhiều lần đối với mọi cá nhân, tổ chức khi có đủ điều kiện mà quy phạm đó quy định.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ví dụ nào sau đây thể hiện tính quy phạm phổ biến của pháp luật?", "options": ["A. Quyết định bổ nhiệm ông A giữ chức giám đốc sở.", "B. Bản án của tòa án tuyên phạt bị cáo B.", "C. Quy định mọi công dân đủ 18 tuổi trở lên đều có quyền bầu cử.", "D. Hợp đồng mua bán nhà giữa hai cá nhân."], "answer": "C", "explain": "Quy định về quyền bầu cử là quy tắc xử sự chung, áp dụng nhiều lần cho mọi công dân đủ điều kiện. Các phương án còn lại là văn bản áp dụng pháp luật cá biệt, chỉ áp dụng một lần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tính quy phạm trong đặc điểm của pháp luật có nghĩa là pháp luật", "options": ["A. do Nhà nước đặt ra một cách tùy tiện.", "B. nêu ra những quy tắc xử sự chung, làm khuôn mẫu cho hành vi của mọi người.", "C. chỉ mang tính khuyến khích thực hiện.", "D. áp dụng khác nhau cho từng người."], "answer": "B", "explain": "Quy phạm nghĩa là khuôn mẫu, chuẩn mực: pháp luật nêu ra những quy tắc xử sự chung để mọi cá nhân, tổ chức tuân theo.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Quy định mọi người tham gia giao thông phải đi bên phải đường thể hiện đặc điểm nào của pháp luật?", "options": ["A. Tính quy phạm phổ biến.", "B. Tính xác định chặt chẽ về hình thức.", "C. Tính bắt buộc chung.", "D. Tính tự nguyện."], "answer": "A", "explain": "Đây là quy tắc xử sự chung, áp dụng nhiều lần đối với mọi người tham gia giao thông, thể hiện tính quy phạm phổ biến của pháp luật.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao quyết định xử phạt vi phạm hành chính đối với một cá nhân cụ thể KHÔNG thể hiện tính quy phạm phổ biến?", "options": ["A. Vì quyết định xử phạt không do Nhà nước ban hành.", "B. Vì đó là văn bản áp dụng pháp luật cá biệt, chỉ áp dụng một lần đối với chủ thể cụ thể, không phải là quy tắc xử sự chung.", "C. Vì quyết định xử phạt không có tính bắt buộc.", "D. Vì quyết định xử phạt không được ghi trong văn bản."], "answer": "B", "explain": "Quyết định xử phạt cá biệt là văn bản áp dụng pháp luật, chỉ áp dụng một lần đối với cá nhân, tổ chức cụ thể, nên không mang tính quy phạm phổ biến như quy phạm pháp luật.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Pháp luật là những quy tắc xử sự chung.", "b) Quy phạm pháp luật được áp dụng nhiều lần trong đời sống xã hội.", "c) Pháp luật chỉ áp dụng một lần cho một người cụ thể.", "d) Mọi cá nhân, tổ chức đều phải tuân theo pháp luật."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: pháp luật là quy tắc xử sự chung, được áp dụng nhiều lần, không phải chỉ áp dụng một lần.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Quy định về độ tuổi bầu cử áp dụng chung cho mọi công dân đủ điều kiện thể hiện tính quy phạm phổ biến.", "b) Bản án hình sự đối với một bị cáo cụ thể là quy phạm pháp luật.", "c) Tính quy phạm phổ biến có nghĩa pháp luật là khuôn mẫu xử sự chung cho mọi người.", "d) Chỉ cơ quan nhà nước mới phải tuân theo pháp luật."], "answer": ["T", "F", "T", "F"], "explain": "a, c đúng. b sai: bản án là văn bản áp dụng pháp luật cá biệt. d sai: pháp luật bắt buộc chung với mọi cá nhân, tổ chức.", "points": 1}, {"type": "short", "level": "VD", "q": "Quy tắc xử sự do pháp luật đặt ra được áp dụng bao nhiêu lần trong đời sống xã hội?", "answer": "Nhiều lần", "explain": "Tính quy phạm phổ biến: pháp luật là những quy tắc xử sự chung, được áp dụng nhiều lần trong đời sống xã hội.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Văn bản chỉ áp dụng một lần đối với cá nhân, tổ chức cụ thể được gọi là văn bản gì?", "answer": "Văn bản áp dụng pháp luật", "explain": "Văn bản áp dụng pháp luật là văn bản cá biệt, chỉ áp dụng một lần đối với chủ thể cụ thể, khác với văn bản quy phạm pháp luật chứa quy tắc xử sự chung.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Tính xác định chặt chẽ về hình thức của pháp luật thể hiện ở việc", "options": ["A. các quy phạm pháp luật được thể hiện trong các văn bản quy phạm pháp luật với nội dung, hình thức xác định, chặt chẽ.", "B. pháp luật được truyền miệng từ đời này sang đời khác.", "C. mỗi người hiểu pháp luật theo cách riêng của mình.", "D. pháp luật thay đổi tùy theo ý muốn của người áp dụng."], "answer": "A", "explain": "Các quy phạm pháp luật được thể hiện trong các văn bản quy phạm pháp luật với nội dung, hình thức xác định, chặt chẽ, rõ ràng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Các quy phạm pháp luật được chứa đựng trong", "options": ["A. lời nói truyền miệng.", "B. văn bản quy phạm pháp luật.", "C. hương ước của làng xã.", "D. nội quy của công ty tư nhân."], "answer": "B", "explain": "Quy phạm pháp luật được thể hiện trong các văn bản quy phạm pháp luật như Hiến pháp, luật, bộ luật, nghị định, thông tư...", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao pháp luật phải được xác định chặt chẽ về hình thức?", "options": ["A. Để pháp luật trở nên khó hiểu với người dân.", "B. Để mọi người hiểu đúng, thực hiện đúng và tránh sự tùy tiện trong việc áp dụng pháp luật.", "C. Để tăng số lượng văn bản pháp luật.", "D. Để chỉ cán bộ nhà nước mới hiểu được pháp luật."], "answer": "B", "explain": "Hình thức xác định, chặt chẽ giúp mọi người hiểu đúng, thực hiện đúng pháp luật, đồng thời tránh sự tùy tiện, chủ quan khi áp dụng pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Văn bản nào sau đây là văn bản quy phạm pháp luật?", "options": ["A. Công văn hành chính thông thường của sở.", "B. Thư mời họp của ủy ban nhân dân.", "C. Nghị định 100/2019/NĐ-CP của Chính phủ.", "D. Biên bản cuộc họp của cơ quan."], "answer": "C", "explain": "Nghị định 100/2019/NĐ-CP chứa quy phạm pháp luật về xử phạt vi phạm giao thông, do Chính phủ ban hành đúng thẩm quyền nên là văn bản quy phạm pháp luật.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Quy định nội bộ về giờ làm việc của một công ty tư nhân có phải là văn bản quy phạm pháp luật không? Vì sao?", "options": ["A. Phải, vì nó cũng là quy tắc bắt buộc.", "B. Không, vì nó không do cơ quan nhà nước có thẩm quyền ban hành theo trình tự, thủ tục luật định, chỉ có hiệu lực trong nội bộ công ty.", "C. Phải, vì mọi quy tắc đều là pháp luật.", "D. Không, vì công ty tư nhân không được đặt ra quy định."], "answer": "B", "explain": "Văn bản quy phạm pháp luật phải do cơ quan nhà nước có thẩm quyền ban hành theo trình tự, thủ tục luật định. Quy định nội bộ của công ty chỉ có hiệu lực trong phạm vi công ty đó.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ý nghĩa của việc quy phạm pháp luật được diễn đạt chặt chẽ, rõ ràng là", "options": ["A. làm cho pháp luật khó thay đổi.", "B. bảo đảm tính thống nhất trong hiểu và áp dụng pháp luật, hạn chế sự tùy tiện, bảo vệ quyền và lợi ích hợp pháp của công dân.", "C. tăng quyền lực cho người áp dụng pháp luật.", "D. giảm bớt trách nhiệm của Nhà nước."], "answer": "B", "explain": "Nội dung xác định, chặt chẽ giúp pháp luật được hiểu và áp dụng thống nhất, hạn chế tùy tiện, qua đó bảo vệ quyền, lợi ích hợp pháp của công dân.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Quy phạm pháp luật được thể hiện trong văn bản quy phạm pháp luật.", "b) Văn bản quy phạm pháp luật có hình thức, nội dung xác định, chặt chẽ.", "c) Mọi văn bản của cơ quan nhà nước đều là văn bản quy m trật tự, an toàn xã hội của pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Pháp luật điều chỉnh các quan hệ xã hội bằng cách", "options": ["A. đặt ra các quy tắc xử sự chung buộc mọi người phải tuân theo.", "B. khuyến khích mọi người tự xử sự theo ý mình.", "C. đứng ngoài các quan hệ xã hội.", "D. chỉ điều chỉnh khi có tranh chấp xảy ra."], "answer": "A", "explain": "Pháp luật điều chỉnh quan hệ xã hội bằng cách đặt ra các quy tắc xử sự chung, bắt buộc mọi cá nhân, tổ chức tuân theo.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hành vi trộm cắp tài sản bị Bộ luật Hình sự trừng phạt. Điều này thể hiện vai trò nào của pháp luật?", "options": ["A. Thúc đẩy phát triển kinh tế - xã hội.", "B. Là phương tiện quản lí nhà nước.", "C. Điều chỉnh quan hệ xã hội, bảo đảm trật tự, an toàn xã hội.", "D. Bảo vệ môi trường."], "answer": "C", "explain": "Trừng phạt hành vi trộm cắp là điều chỉnh quan hệ xã hội, bảo vệ trật tự, an toàn xã hội.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Mối quan hệ giữa vai trò điều chỉnh quan hệ xã hội và vai trò bảo đảm trật tự, an toàn xã hội là", "options": ["A. mâu thuẫn, loại trừ lẫn nhau.", "B. gắn bó với nhau: khi các quan hệ xã hội được điều chỉnh đúng đắn thì trật tự, an toàn xã hội được bảo đảm.", "C. độc lập, không liên quan đến nhau.", "D. vai trò bảo đảm trật tự quan trọng hơn nên thay thế vai trò điều chỉnh."], "answer": "B", "explain": "Hai vai trò gắn bó: pháp luật điều chỉnh đúng đắn các quan hệ xã hội thì trật tự, kỉ cương, an toàn xã hội được giữ vững.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Pháp luật điều chỉnh các quan hệ xã hội.", "b) Pháp luật góp phần bảo đảm trật tự, an toàn xã hội.", "c) Các quan hệ xã hội tồn tại ngoài sự điều chỉnh của pháp luật.", "d) Xử lí người vi phạm góp phần giữ gìn trật tự xã hội."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: các quan hệ xã hội cơ uật bảo vệ quyền và lợi ích hợp pháp của công dân?", "options": ["A. Bộ luật Lao động 2019 bảo vệ quyền lợi của người lao động về tiền lương, giờ làm việc, bảo hiểm xã hội.", "B. Nhà nước thu thuế của doanh nghiệp.", "C. Cảnh sát xử phạt người vượt đèn đỏ.", "D. Trường học tổ chức kì thi học kì."], "answer": "A", "explain": "Bộ luật Lao động 2019 bảo vệ quyền lợi người lao động là biểu hiện của vai trò bảo vệ quyền, lợi ích hợp pháp của công dân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi quyền, lợi ích hợp pháp của mình bị xâm phạm, công dân có thể", "options": ["A. tự ý dùng vũ lực để đòi lại quyền lợi.", "B. nhờ pháp luật bảo vệ thông qua khiếu nại, tố cáo, khởi kiện.", "C. im lặng chịu đựng, không được làm gì.", "D. chỉ trông chờ vào sự giúp đỡ của người thân."], "answer": "B", "explain": "Pháp luật bảo vệ công dân thông qua các cơ chế khiếu nại, tố cáo, khởi kiện tại tòa án.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Chị H bị công ty sa thải trái pháp luật. Chị khởi kiện ra tòa án và được bồi thường theo quy định của Bộ luật Lao động. Tình huống này thể hiện vai trò nào của pháp luật?", "options": ["A. Là phương tiện quản lí nhà nước.", "B. Bảo vệ quyền và lợi ích hợp pháp của công dân.", "C. Thúc đẩy phát triển kinh tế.", "D. Điều chỉnh quan hệ quốc tế."], "answer": "B", "explain": "Tòa án bảo vệ quyền lợi của chị H theo pháp luật lao động, thể hiện vai trò bảo vệ quyền, lợi ích hợp pháp của công dân.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao bảo vệ quyền con người được coi là vai trò quan trọng của pháp luật?", "options": ["A. Vì con người là trung tâm, là mục tiêu của sự phát triển; pháp luật tạo hành lang pháp lí để mọi người được sống, làm việc và phát triển.", "B. Vì Nhà nước muốn thể hiện quyền lực của mình.", "C. Vì quyền con người chỉ tồn tại trên giấy tờ.", "D. Vì bảo vệ quyền con người giúp tăng thu ngân sách."], "answer": "A", "explain": "Con người vừa là chủ thể vừa là mục tiêu của sự phát triển; pháp luật bảo vệ quyền con người để mọi người được sống, làm việc, phát triển trong môi trường an toàn, công bằng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Pháp luật bảo vệ quyền con người, quyền công dân.", "b) Quyền công dân được Hiến pháp 2013 ghi nhận.", "c) Pháp luật chỉ bảo vệ lợi ích của Nhà nước, không bảo vệ công dân.", "d) Công dân có quyền khiếu nại, tố cáo khi quyền lợi hợp pháp bị xâm phạm."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: pháp luật vừa là công cụ quản lí nhà nước, vừa bảo vệ quyền con người, quyền công dân.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Luật Trẻ em ghi nhận và bảo vệ các quyền của trẻ em.", "b) Người lao động bị nợ lương có thể nhờ pháp luật can thiệp, bảo vệ.", "c) Quyền con người là quyền tự nhiên nên pháp luật không cần ghi nhận, bảo vệ.", "d) Tòa án là cơ quan bảo vệ công lí, bảo vệ quyền con người, quyền công dân."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: quyền con người cần được pháp luật ghi nhận và bảo đảm thực hiện mới trở thành hiện thực.", "points": 1}, {"type": "short", "level": "VD", "q": "Văn bản pháp luật nào ghi nhận các quyền con người, quyền và nghĩa vụ cơ bản của công dân ở Việt Nam?", "answer": "Hiến pháp", "explain": "Hiến pháp 2013 ghi nhận các quyền con người, quyền và nghĩa vụ cơ bản của công dân.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hiến pháp hiện hành của nước Cộng hòa xã hội chủ nghĩa Việt Nam được ban hành vào năm nào?", "answer": "2013", "explain": "Hiến pháp hiện hành của Việt Nam là Hiến pháp năm 2013.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Đối với sự phát triển kinh tế - xã hội, pháp luật có vai trò", "options": ["A. kìm hãm sự phát triển kinh tế.", "B. tạo điều kiện thúc đẩy sự phát triển kinh tế - xã hội.", "C. không có vai trò gì.", "D. chỉ điều chỉnh hoạt động văn hóa."], "answer": "B", "explain": "Pháp luật tạo hành lang pháp lí thuận lợi, thúc đẩy sự phát triển kinh tế - xã hội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Luật Doanh nghiệp, Luật Đầu tư ra đời nhằm", "options": ["A. hạn chế hoạt động sản xuất, kinh doanh.", "B. tạo hành lang pháp lí thúc đẩy sản xuất, kinh doanh phát triển.", "C. tăng thuế đối với doanh nghiệp.", "D. thu hẹp quyền tự do kinh doanh."], "answer": "B", "explain": "Luật Doanh nghiệp, Luật Đầu tư tạo môi trường pháp lí thuận lợi cho sản xuất, kinh doanh, đầu tư phát triển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Pháp luật thúc đẩy phát triển kinh tế bằng cách", "options": ["A. bảo vệ quyền sở hữu, bảo đảm tự do kinh doanh, giữ ổn định môi trường đầu tư.", "B. cấm mọi hoạt động kinh doanh của tư nhân.", "C. áp đặt mức thuế cao đối với mọi doanh nghiệp.", "D. trực tiếp điều hành sản xuất của doanh nghiệp."], "answer": "A", "explain": "Pháp luật bảo vệ quyền sở hữu, tự do kinh doanh và ổn định môi trường đầu tư, từ đó thúc đẩy kinh tế phát triển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm giống nhau giữa pháp luật và đạo đức là", "options": ["A. đều do Nhà nước ban hành.", "B. đều được bảo đảm bằng cưỡng chế nhà nước.", "C. đều là những quy tắc xử sự, chuẩn mực điều chỉnh hành vi của con người.", "D. đều chỉ áp dụng một lần."], "answer": "C", "explain": "Pháp luật, đạo đức, tập quán đều là các quy tắc xử sự, chuẩn mực xã hội điều chỉnh hành vi con người; khác nhau ở chủ thể đặt ra và biện pháp bảo đảm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhà nước ban hành chính sách ưu đãi thuế cho doanh nghiệp đầu tư vào vùng khó khăn. Điều này thể hiện vai trò nào của pháp luật?", "options": ["A. Bảo vệ quyền con người.", "B. Thúc đẩy phát triển kinh tế - xã hội.", "C. Là phương tiện quản lí hành chính.", "D. Bảo đảm trật tự công cộng."], "answer": "B", "explain": "Ưu đãi thuế để thu hút đầu tư vào vùng khó khăn là dùng pháp luật thúc đẩy phát triển kinh tế - xã hội.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "So với đạo đức, ưu thế của pháp luật trong việc điều chỉnh xã hội là", "options": ["A. pháp luật dễ thay đổi hơn đạo đức.", "B. pháp luật có tính bắt buộc chung và được bảo đảm bằng cưỡng chế nhà nước nên hiệu lực điều chỉnh cao hơn, thống nhất hơn.", "C. pháp luật không cần mọi người tự nguyện tuân theo.", "D. pháp luật chỉ điều chỉnh một số ít hành vi."], "answer": "B", "explain": "Nhờ tính bắt buộc chung và cưỡng chế nhà nước, pháp luật có hiệu lực điều chỉnh cao và thống nhất, đó là ưu thế so với đạo đức vốn dựa vào lương tâm, dư luận.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Pháp luật thúc đẩy sự phát triển kinh tế - xã hội.", "b) Pháp luật và đạo đức đều điều chỉnh hành vi của con người.", "c) Đạo đức được bảo đảm thực hiện bằng cưỡng chế nhà nước.", "d) Tập quán là những thói quen đã thành nếp, được mọi người thừa nhận."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: đạo đức được bảo đảm bằng dư luận xã hội và lương tâm, không bằng cưỡng chế nhà nước.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Luật Bảo vệ môi trường góp phần phát triển kinh tế - xã hội bền vững.", "b) Pháp luật kìm hãm sự phát triển của kinh tế thị trường.", "c) Người vi phạm đạo đức bị dư luận xã hội lên án chứ không bị cưỡng chế nhà nước.", "d) Pháp luật, đạo đức, tập quán đều là những quy phạm xã hội."], "answer": ["T", "F", "T", "T"], "explain": "a, c, d đúng. b sai: pháp luật tạo hành lang pháp lí thúc đẩy chứ không kìm hãm phát triển kinh tế.", "points": 1}, {"type": "short", "level": "VD", "q": "Chuẩn mực xã hội nào được bảo đảm thực hiện bằng sức mạnh cưỡng chế của Nhà nước?", "answer": "Pháp luật", "explain": "Trong các chuẩn mực xã hội, chỉ pháp luật được bảo đảm thực hiện bằng sức mạnh cưỡng chế của Nhà nước.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Dư luận xã hội và lương tâm là biện pháp bảo đảm thực hiện của chuẩn mực xã hội nào?", "answer": "Đạo đức", "explain": "Đạo đức được bảo đảm bằng dư luận xã hội và lương tâm của mỗi người, khác với pháp luật được bảo đảm bằng cưỡng chế nhà nước.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Pháp luật có mấy đặc điểm cơ bản?", "options": ["A. Hai đặc điểm.", "B. Ba đặc điểm.", "C. Bốn đặc điểm.", "D. Năm đặc điểm."], "answer": "B", "explain": "Pháp luật có ba đặc điểm cơ bản: tính quy phạm phổ biến, tính xác định chặt chẽ về hình thức, tính bắt buộc chung.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vai trò nào sau đây KHÔNG phải là vai trò của pháp luật?", "options": ["A. Là phương tiện để Nhà nước quản lí xã hội.", "B. Kìm hãm sự phát triển của cá nhân và xã hội.", "C. Bảo vệ quyền con người, quyền công dân.", "D. Thúc đẩy phát triển kinh tế - xã hội."], "answer": "B", "explain": "Pháp luật không kìm hãm mà thúc đẩy sự phát triển của cá nhân và xã hội; các vai trò còn lại đều là vai trò của pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào sau đây thể hiện đầy đủ khái niệm pháp luật?", "options": ["A. Pháp luật là những quy tắc do nhân dân tự đặt ra.", "B. Pháp luật là hệ thống các quy tắc xử sự chung do Nhà nước ban hành hoặc thừa nhận, thể hiện ý chí của nhân dân lao động, được bảo đảm thực hiện bằng cưỡng chế nhà nước.", "C. Pháp luật là những lời khuyên của Nhà nước dành cho công dân.", "D. Pháp luật là tập hợp các phong tục, tập quán tốt đẹp."], "answer": "B", "explain": "Đây là định nghĩa đầy đủ: hệ thống quy tắc xử sự chung, do Nhà nước ban hành hoặc thừa nhận, thể hiện ý chí của nhân dân lao động, bảo đảm bằng cưỡng chế nhà nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các đặc điểm của pháp luật, đặc điểm nào thể hiện rõ nhất sức mạnh của Nhà nước?", "options": ["A. Tính quy phạm phổ biến.", "B. Tính xác định chặt chẽ về hình thức.", "C. Tính bắt buộc chung.", "D. Tính tự nguyện."], "answer": "C", "explain": "Tính bắt buộc chung thể hiện sức mạnh nhà nước: pháp luật bắt buộc với mọi người và được bảo đảm bằng cưỡng chế nhà nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Thôn X đặt ra quy ước bắt mỗi hộ dân đóng tiền làm đường, hộ nào không đóng thì bị cắt điện, cắt nước. Quy ước này có phải là pháp luật không? Vì sao?", "options": ["A. Phải, vì quy ước cũng bắt buộc mọi người thực hiện.", "B. Không, vì quy ước không do cơ quan nhà nước có thẩm quyền ban hành theo trình tự, thủ tục luật định; việc cắt điện, cắt nước cũng trái pháp luật.", "C. Phải, vì đa số người dân trong thôn đồng ý.", "D. Không, vì thôn không được thu tiền của dân."], "answer": "B", "explain": "Pháp luật phải do Nhà nước ban hành hoặc thừa nhận theo trình tự luật định. Quy ước của thôn không phải pháp luật; biện pháp cắt điện, cắt nước cưỡng bức là trái pháp luật.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Mối quan hệ giữa các đặc điểm của pháp luật là", "options": ["A. mâu thuẫn, loại trừ lẫn nhau.", "B. độc lập, tách rời nhau.", "C. thống nhất, gắn bó, bổ sung cho nhau, cùng tạo nên bản sắc của pháp luật.", "D. chỉ cần một đặc điểm là đủ."], "answer": "C", "explain": "Ba đặc điểm của pháp luật thống nhất, gắn bó, bổ sung cho nhau, cùng làm nên bản chất, vai trò của pháp luật trong đời sống xã hội.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Pháp luật có ba đặc điểm cơ bản.", "b) Pháp luật có bốn vai trò cơ bản.", "c) Pháp luật do nhân dân trực tiếp ban hành.", "d) Pháp luật ở Việt Nam thể hiện ý chí của nhân dân lao động."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: pháp luật do Nhà nước ban hành hoặc thừa nhận, không phải do nhân dân trực tiếp ban hành.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Tính quy phạm phổ biến và tính bắt buộc chung đều thể hiện pháp luật áp dụng chung cho mọi người.", "b) Vai trò quản lí nhà nước và vai trò bảo vệ quyền công dân của pháp luật mâu thuẫn nhau.", "c) Pháp luật vừa mang bản chất giai cấp vừa có tính xã hội.", "d) Mọi quy tắc xử sự trong xã hội đều do Nhà nước ban hành."], "answer": ["T", "F", "T", "F"], "explain": "a, c đúng. b sai: các vai trò của pháp luật thống nhất, bổ sung cho nhau. d sai: đạo đức, tập quán không do Nhà nước ban hành.", "points": 1}, {"type": "short", "level": "VD", "q": "Pháp luật có mấy đặc điểm cơ bản?", "answer": "Ba", "explain": "Pháp luật có ba đặc điểm cơ bản: tính quy phạm phổ biến, tính xác định chặt chẽ về hình thức và tính bắt buộc chung.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Pháp luật ở Việt Nam thể hiện ý chí của ai?", "answer": "Nhân dân lao động", "explain": "Ở Việt Nam, pháp luật thể hiện ý chí của nhân dân lao động, vì lợi ích của nhân dân lao động.", "points": 0.5}]}]}
