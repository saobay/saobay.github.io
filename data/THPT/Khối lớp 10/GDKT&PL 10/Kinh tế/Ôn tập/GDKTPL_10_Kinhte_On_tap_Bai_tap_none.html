33,3 phần trăm, làm tròn 33 phần trăm.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Hoạt động «vận chuyển gạo từ vựa về các chợ đầu mối để bán» thuộc khâu nào?", "options": ["A. Phân phối – trao đổi.", "B. Sản xuất.", "C. Tiêu dùng.", "D. Tích lũy."], "answer": "A", "explain": "Vận chuyển, mua bán để đưa sản phẩm đến người tiêu dùng thuộc khâu phân phối – trao đổi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khoản chi trả lương cho cán bộ, công chức thuộc loại chi ngân sách nào?", "options": ["A. Chi thường xuyên.", "B. Chi đầu tư phát triển.", "C. Chi trả nợ.", "D. Chi dự trữ."], "answer": "A", "explain": "Trả lương cán bộ, công chức, nuôi bộ máy là chi thường xuyên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người có 50 triệu đồng nhàn rỗi trong 6 tháng tới và muốn vừa an toàn vừa có lãi. Lựa chọn phù hợp là", "options": ["A. gửi tiết kiệm có kì hạn 6 tháng tại ngân hàng được cấp phép.", "B. cho vay nặng lãi.", "C. giữ tiền mặt ở nhà.", "D. đầu tư vào dự án lãi khủng không rõ nguồn gốc."], "answer": "A", "explain": "Tiền nhàn rỗi 6 tháng nên gửi tiết kiệm có kì hạn tương ứng tại ngân hàng được cấp phép: an toàn và có lãi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi mua một đôi giày, người mua đã gián tiếp nộp loại thuế nào qua giá bán?", "options": ["A. Thuế giá trị gia tăng.", "B. Thuế thu nhập cá nhân.", "C. Thuế thu nhập doanh nghiệp.", "D. Thuế tài sản."], "answer": "A", "explain": "Thuế giá trị gia tăng đã tính trong giá bán: người mua chịu, người bán nộp hộ — thuế gián thu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ông Sáu trồng 2 sào rau, mỗi sào thu hoạch 800 kg, bán giá 12 nghìn đồng mỗi kg. Tổng thu nhập từ rau của ông là", "options": ["A. 19,2 triệu đồng.", "B. 9,6 triệu đồng.", "C. 800 nghìn đồng.", "D. 24 triệu đồng."], "answer": "A", "explain": "Tổng sản lượng = 2 × 800 = 1 600 kg. Thu nhập = 1 600 × 12 = 19 200 nghìn đồng = 19,2 triệu đồng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một địa phương kêu gọi doanh nghiệp đầu tư vào khu công nghiệp sạch, cam kết xử lí môi trường và ưu tiên tuyển lao động địa phương. Cách làm này thể hiện", "options": ["A. kết hợp phát huy thị trường với điều tiết của Nhà nước vì phát triển bền vững.", "B. ngăn cản đầu tư.", "C. buông lỏng quản lí.", "D. chỉ quan tâm lợi nhuận."], "answer": "A", "explain": "Thu hút đầu tư (phát huy thị trường) đi kèm yêu cầu môi trường, việc làm (điều tiết Nhà nước) — phát triển bền vững.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đưa hàng hóa đến người tiêu dùng thuộc phân phối – trao đổi.", "b) Trả lương cán bộ thuộc chi thường xuyên.", "c) Thuế giá trị gia tăng là thuế gián thu.", "d) Gửi tiết kiệm ngân hàng được cấp phép là an toàn."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tiền nhàn rỗi nên gửi tiết kiệm có kì hạn phù hợp.", "b) Người mua chịu thuế gián thu qua giá hàng hóa.", "c) Phát triển bền vững cần hài hòa kinh tế và môi trường.", "d) Thu hút đầu tư thì không cần yêu cầu môi trường."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: phải đi kèm yêu cầu bảo vệ môi trường.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Phân phối – trao đổi là ... giữa sản xuất và tiêu dùng».", "answer": "cầu nối", "explain": "Phân phối – trao đổi là cầu nối giữa sản xuất và tiêu dùng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trồng 2 sào rau, mỗi sào 800 kg, giá 12 nghìn đồng mỗi kg thì tổng thu là bao nhiêu triệu đồng? Viết số (dạng thập phân).", "answer": "19.2", "explain": "1 600 kg × 12 nghìn = 19 200 nghìn đồng = 19,2 triệu đồng.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Người trực tiếp làm ra sản phẩm trong xưởng may thuộc chủ thể nào?", "options": ["A. Chủ thể sản xuất.", "B. Chủ thể tiêu dùng.", "C. Chủ thể trung gian.", "D. Không thuộc chủ thể nào."], "answer": "A", "explain": "Công nhân trực tiếp tạo ra sản phẩm thuộc chủ thể sản xuất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thị trường chứng khoán là thị trường", "options": ["A. vốn, mang tính vô hình.", "B. rau quả hữu hình.", "C. lao động.", "D. bất động sản."], "answer": "A", "explain": "Thị trường chứng khoán mua bán cổ phiếu, trái phiếu — thị trường vốn, vô hình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một cửa hàng treo biển giảm giá nhưng âm thầm nâng giá gốc lên trước đó. Hành vi này", "options": ["A. gian lận, làm méo mó thông tin thị trường.", "B. là chiêu thức kinh doanh hợp pháp.", "C. giúp người mua được lợi.", "D. không ảnh hưởng đến ai."], "answer": "A", "explain": "Gian lận giá cả làm méo mó thông tin thị trường, lừa dối người tiêu dùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để tránh mua phải hàng kém chất lượng khi mua sắm online, người mua nên", "options": ["A. đọc đánh giá, chọn shop uy tín, so sánh giá.", "B. mua ngay không cần xem.", "C. chọn nơi rẻ nhất bất chấp uy tín.", "D. chuyển tiền cho người lạ."], "answer": "A", "explain": "Đọc đánh giá, chọn shop uy tín, so sánh giá là khai thác thông tin thị trường để mua hàng an toàn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bà Năm vay 30 triệu đồng từ người quen với lãi suất 5 phần trăm một tháng, không có hợp đồng. Sau 3 tháng, tiền lãi bà phải trả là", "options": ["A. 4,5 triệu đồng.", "B. 1,5 triệu đồng.", "C. 15 triệu đồng.", "D. 30 triệu đồng."], "answer": "A", "explain": "Lãi mỗi tháng = 30 × 5 phần trăm = 1,5 triệu đồng. 3 tháng = 4,5 triệu đồng. Đây là dấu hiệu tín dụng đen cần tránh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một công ty công nghệ cho nhân viên vay ưu đãi để mua nhà với lãi suất thấp, trừ dần vào lương. Chính sách này", "options": ["A. vừa hỗ trợ đời sống nhân viên vừa giữ chân người tài.", "B. là tín dụng đen.", "C. vi phạm pháp luật.", "D. gây hại cho nhân viên."], "answer": "A", "explain": "Cho vay ưu đãi nội bộ với lãi suất thấp, minh bạch là chính sách phúc lợi tốt của doanh nghiệp.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Công nhân trực tiếp tạo ra sản phẩm thuộc chủ thể sản xuất.", "b) Thị trường chứng khoán là thị trường vốn.", "c) Gian lận giá cả làm méo mó thông tin thị trường.", "d) Mua online không cần tìm hiểu gì."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: cần đọc đánh giá, chọn shop uy tín.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vay lãi cao không hợp đồng là dấu hiệu tín dụng đen.", "b) Cho vay ưu đãi nội bộ minh bạch là phúc lợi tốt.", "c) Người mua nên khai thác thông tin thị trường.", "d) Mọi lời mời vay nhanh đều an toàn."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: cần cảnh giác với lời mời vay mập mờ.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Gian lận giá cả làm ... mó thông tin thị trường».", "answer": "méo", "explain": "Gian lận giá cả làm méo mó thông tin thị trường.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vay 30 triệu đồng, lãi 5 phần trăm một tháng, sau 3 tháng tiền lãi là bao nhiêu triệu đồng? Viết số (dạng thập phân).", "answer": "4.5", "explain": "30 × 5 phần trăm × 3 = 4,5 triệu đồng.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Khi cầu về một mặt hàng tăng đột biến mà cung không đổi, giá cả sẽ", "options": ["A. tăng lên.", "B. giảm xuống.", "C. giữ nguyên.", "D. biến mất."], "answer": "A", "explain": "Cầu vượt cung (thiếu hàng) thì giá có xu hướng tăng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguồn thu nào sau đây KHÔNG thuộc ngân sách nhà nước?", "options": ["A. Tiền lãi gửi tiết kiệm của cá nhân.", "B. Thuế thu nhập doanh nghiệp.", "C. Phí, lệ phí.", "D. Thu từ dầu khí."], "answer": "A", "explain": "Tiền lãi tiết kiệm là thu nhập cá nhân, không phải khoản nộp vào ngân sách.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một hộ gia đình thu nhập 12 triệu đồng mỗi tháng. Theo quy tắc 50/30/20, khoản dành cho nhu cầu thiết yếu là", "options": ["A. 6 triệu đồng.", "B. 3,6 triệu đồng.", "C. 2,4 triệu đồng.", "D. 12 triệu đồng."], "answer": "A", "explain": "50 phần trăm × 12 triệu = 6 triệu đồng cho nhu cầu thiết yếu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Doanh nghiệp bán hàng qua mạng nhưng không xuất hóa đơn, không kê khai thuế. Đây là", "options": ["A. trốn thuế, vi phạm pháp luật.", "B. quyền của doanh nghiệp.", "C. cách tiết kiệm hợp pháp.", "D. không ai phát hiện được."], "answer": "A", "explain": "Kinh doanh có doanh thu mà không kê khai thuế là trốn thuế, vi phạm pháp luật.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Anh Khải góp 300 triệu đồng vào công ty TNHH hai thành viên. Công ty làm ăn thua lỗ, nợ 1 tỉ đồng. Anh Khải phải chịu trách nhiệm tối đa", "options": ["A. 300 triệu đồng đã góp.", "B. 1 tỉ đồng.", "C. 500 triệu đồng.", "D. toàn bộ tài sản."], "answer": "A", "explain": "Thành viên công ty TNHH chỉ chịu trách nhiệm hữu hạn trong phạm vi vốn đã góp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một quốc gia muốn vừa phát triển kinh tế nhanh vừa đảm bảo công bằng xã hội. Định hướng đúng đắn là", "options": ["A. phát huy cơ chế thị trường, đồng thời Nhà nước điều tiết, an sinh xã hội.", "B. xóa bỏ thị trường.", "C. để thị trường tự do tuyệt đối.", "D. Nhà nước làm thay mọi việc."], "answer": "A", "explain": "Kết hợp sức mạnh thị trường với vai trò điều tiết của Nhà nước — như mô hình của Việt Nam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cầu tăng đột biến thì giá có xu hướng tăng.", "b) Tiền lãi tiết kiệm không phải là thu ngân sách.", "c) Thành viên công ty TNHH chịu trách nhiệm hữu hạn.", "d) Trốn thuế là hành vi hợp pháp."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: trốn thuế vi phạm pháp luật.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quy tắc 50/30/20 giúp phân bổ thu nhập hợp lí.", "b) Bán hàng online vẫn phải kê khai thuế.", "c) Kết hợp thị trường và điều tiết Nhà nước là đúng đắn.", "d) Thị trường tự giải quyết mọi vấn đề xã hội."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thị trường có khuyết tật nên cần Nhà nước.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Cầu vượt cung thì giá có xu hướng ...».", "answer": "tăng", "explain": "Cầu lớn hơn cung (thiếu hàng) thì giá có xu hướng tăng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thu nhập 12 triệu đồng, theo quy tắc 50/30/20 thì khoản thiết yếu là bao nhiêu triệu đồng? Viết số.", "answer": "6", "explain": "12 × 50 phần trăm = 6 triệu đồng.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Ai sau đây vừa thuộc chủ thể sản xuất vừa thuộc chủ thể tiêu dùng?", "options": ["A. Người thợ may quần áo để bán và mua gạo về nấu cơm.", "B. Máy may trong xưởng.", "C. Tờ tiền.", "D. Văn bản luật."], "answer": "A", "explain": "May quần áo bán là sản xuất; mua gạo về nấu cơm là tiêu dùng — một người có thể thuộc nhiều chủ thể.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chức năng nào của thị trường giúp người sản xuất biết nên làm ra cái gì?", "options": ["A. Cung cấp thông tin.", "B. In tiền.", "C. Thu thuế.", "D. Ban hành luật."], "answer": "A", "explain": "Thông tin về nhu cầu, giá cả từ thị trường giúp người sản xuất điều chỉnh sản xuất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một công ty bị phát hiện dùng nguyên liệu kém chất lượng nhưng quảng cáo là «nguyên liệu nhập khẩu cao cấp». Công ty vi phạm", "options": ["A. đạo đức kinh doanh và pháp luật về quảng cáo.", "B. quyền tự do quảng cáo.", "C. không vi phạm gì.", "D. nghĩa vụ nộp thuế."], "answer": "A", "explain": "Quảng cáo sai sự thật, dùng nguyên liệu kém chất lượng vi phạm đạo đức kinh doanh và pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Người dân gửi tiền tiết kiệm vào ngân hàng, ngân hàng dùng tiền đó cho doanh nghiệp vay. Trong chuỗi này, ngân hàng là", "options": ["A. chủ thể trung gian về vốn.", "B. chủ thể sản xuất.", "C. chủ thể tiêu dùng.", "D. người cho tặng."], "answer": "A", "explain": "Ngân hàng kết nối người có vốn nhàn rỗi với người cần vốn — chủ thể trung gian.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Dịp lễ, một hãng xe khách tăng giá vé gấp đôi dù chi phí không đổi. Xét theo quan hệ cung – cầu, hiện tượng này", "options": ["A. là biểu hiện cầu vượt cung dịp lễ, nhưng tăng giá quá đáng có thể bị xử lí.", "B. hoàn toàn hợp lí, không cần quan tâm.", "C. do Nhà nước quy định.", "D. không liên quan đến cung cầu."], "answer": "A", "explain": "Dịp lễ cầu vượt cung nên giá tăng là quy luật; nhưng tăng giá quá đáng, «chặt chém» có thể bị xử lí theo pháp luật giá.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một bạn trẻ có 5 triệu đồng, đang phân vân giữa gửi tiết kiệm ngân hàng và «đầu tư» vào dự án hứa lãi 30 phần trăm một tháng. Lời khuyên đúng đắn là", "options": ["A. cảnh giác vì lãi 30 phần trăm một tháng là dấu hiệu lừa đảo; nên gửi tiết kiệm an toàn.", "B. đầu tư hết vào dự án lãi cao.", "C. vay thêm để đầu tư.", "D. không cần tìm hiểu."], "answer": "A", "explain": "«Lãi khủng» 30 phần trăm một tháng là dấu hiệu lừa đảo; lợi nhuận cao đi kèm rủi ro cao.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Một người có thể thuộc nhiều chủ thể kinh tế.", "b) Thông tin thị trường giúp điều chỉnh sản xuất.", "c) Quảng cáo sai sự thật vi phạm pháp luật.", "d) Ngân hàng là chủ thể trung gian về vốn."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dịp lễ cầu tăng có thể đẩy giá vé xe tăng.", "b) Tăng giá «chặt chém» có thể bị xử lí.", "c) «Lãi khủng» thường là dấu hiệu lừa đảo.", "d) Đầu tư không cần tìm hiểu gì."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: đầu tư phải tìm hiểu kĩ.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Ngân hàng kết nối người có vốn nhàn rỗi với người cần vốn nên là chủ thể ...».", "answer": "trung gian", "explain": "Ngân hàng là chủ thể trung gian về vốn.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Dự án hứa lãi 30 phần trăm một tháng, «không rủi ro» thường là dấu hiệu của lừa ... Điền từ còn thiếu.", "answer": "đảo", "explain": "«Lãi khủng, không rủi ro» là dấu hiệu lừa đảo.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Bội chi ngân sách là tình trạng", "options": ["A. chi lớn hơn thu.", "B. thu lớn hơn chi.", "C. thu bằng chi.", "D. không có thu chi."], "answer": "A", "explain": "Bội chi ngân sách là tình trạng chi lớn hơn thu trong một năm ngân sách.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thuế trực thu đánh vào", "options": ["A. thu nhập, tài sản của người nộp.", "B. hàng hóa trong chợ.", "C. dịch vụ cắt tóc.", "D. vé xem phim."], "answer": "A", "explain": "Thuế trực thu đánh trực tiếp vào thu nhập, tài sản của tổ chức, cá nhân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một gia đình thu nhập 8 triệu đồng mỗi tháng, chi tiêu 6 triệu đồng. Tình hình tài chính này", "options": ["A. lành mạnh vì chi nhỏ hơn thu, còn dư 2 triệu đồng.", "B. không lành mạnh.", "C. cần vay thêm.", "D. nên tăng chi tiêu."], "answer": "A", "explain": "Chi 6 triệu nhỏ hơn thu 8 triệu, còn dư 2 triệu (25 phần trăm) để tiết kiệm — lành mạnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hành vi làm hàng nhái thương hiệu nổi tiếng để bán là", "options": ["A. cạnh tranh không lành mạnh, vi phạm pháp luật.", "B. cạnh tranh lành mạnh.", "C. đổi mới sáng tạo.", "D. được khuyến khích."], "answer": "A", "explain": "Làm hàng nhái là cạnh tranh không lành mạnh, xâm phạm sở hữu trí tuệ, vi phạm pháp luật.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Chị Dung mở tiệm tạp hóa, nhập hàng từ đại lí về bán lẻ cho khu phố. Chị Dung thuộc", "options": ["A. chủ thể trung gian.", "B. chủ thể sản xuất.", "C. Nhà nước.", "D. chủ thể tiêu dùng."], "answer": "A", "explain": "Nhập hàng về bán lẻ là mua đi bán lại, kết nối sản xuất với tiêu dùng — chủ thể trung gian.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ngân sách một năm thu 1 800 tỉ đồng, chi 1 950 tỉ đồng. Để bù đắp phần chênh lệch, Nhà nước có thể", "options": ["A. vay nợ trong giới hạn an toàn.", "B. in tiền tùy ý.", "C. ngừng mọi khoản chi.", "D. tăng thuế gấp mười lần ngay."], "answer": "A", "explain": "Bội chi 150 tỉ đồng; bù đắp bằng vay nợ trong giới hạn an toàn là giải pháp tình thế hợp lí.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bội chi là chi lớn hơn thu.", "b) Thuế trực thu đánh vào thu nhập.", "c) Chi nhỏ hơn thu là lành mạnh.", "d) Làm hàng nhái là hợp pháp."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: hàng nhái vi phạm pháp luật.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tiệm tạp hóa bán lẻ thuộc chủ thể trung gian.", "b) Bù bội chi bằng vay nợ trong giới hạn an toàn.", "c) Làm hàng nhái là cạnh tranh không lành mạnh.", "d) Chi tiêu vượt thu nhập là tốt."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: phải chi nhỏ hơn thu.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «... chi ngân sách là chi lớn hơn thu».", "answer": "Bội", "explain": "Bội chi ngân sách là chi lớn hơn thu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thu 1 800 tỉ, chi 1 950 tỉ thì bội chi bao nhiêu tỉ đồng? Viết số.", "answer": "150", "explain": "1 950 − 1 800 = 150 tỉ đồng.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Tín dụng thương mại là quan hệ", "options": ["A. mua chịu, trả chậm giữa các doanh nghiệp.", "B. vay vốn ngân hàng.", "C. phát hành trái phiếu chính phủ.", "D. cho tặng."], "answer": "A", "explain": "Tín dụng thương mại là quan hệ vay mượn giữa các doanh nghiệp: mua hàng trả chậm, bán chịu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo quy tắc 50/30/20, khoản «mong muốn» chiếm", "options": ["A. 30 phần trăm thu nhập.", "B. 50 phần trăm thu nhập.", "C. 20 phần trăm thu nhập.", "D. 100 phần trăm thu nhập."], "answer": "A", "explain": "30 phần trăm thu nhập dành cho mong muốn, sở thích.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người thấy quảng cáo tuyển dụng «việc nhẹ lương cao, đặt cọc trước 5 triệu đồng». Đây có thể là", "options": ["A. lừa đảo chiếm đoạt tiền đặt cọc.", "B. cơ hội việc làm tốt.", "C. chính sách của Nhà nước.", "D. không có gì đáng ngại."], "answer": "A", "explain": "«Việc nhẹ lương cao» kèm yêu cầu đặt cọc trước là thủ đoạn lừa đảo phổ biến.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi phát hiện cửa hàng bán hàng hết hạn sử dụng, người tiêu dùng nên", "options": ["A. báo cơ quan quản lí thị trường.", "B. im lặng bỏ qua.", "C. mua tiếp vì rẻ.", "D. giới thiệu cho người khác."], "answer": "A", "explain": "Báo cơ quan quản lí thị trường là trách nhiệm công dân, góp phần làm lành mạnh thị trường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một xưởng gỗ vay 400 triệu đồng mua máy mới, năng suất tăng 40 phần trăm, đủ trả nợ đúng hạn. Đây là", "options": ["A. sử dụng tín dụng hiệu quả cho sản xuất.", "B. lạm dụng tín dụng.", "C. tín dụng đen.", "D. vi phạm pháp luật."], "answer": "A", "explain": "Vay để đầu tư sản xuất, tăng năng suất, trả nợ đúng hạn — tín dụng phát huy vai trò đòn bẩy.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai doanh nghiệp cùng ngành: một bên đầu tư công nghệ sạch dù tốn kém, một bên xả thải trộm để giảm giá thành. Về lâu dài,", "options": ["A. doanh nghiệp làm ăn chân chính bền vững hơn nhờ uy tín và tuân thủ pháp luật.", "B. doanh nghiệp xả thải luôn thắng.", "C. cả hai như nhau.", "D. không thể kết luận."], "answer": "A", "explain": "Xả thải trộm sớm muộn cũng bị phát hiện, xử phạt nặng và mất uy tín; kinh doanh có đạo đức mới bền vững.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mua chịu giữa doanh nghiệp là tín dụng thương mại.", "b) Khoản «mong muốn» chiếm 30 phần trăm thu nhập.", "c) «Việc nhẹ lương cao» kèm đặt cọc là dấu hiệu lừa đảo.", "d) Bán hàng hết hạn nên báo cơ quan chức năng."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vay đầu tư sản xuất hiệu quả là đòn bẩy.", "b) Kinh doanh chân chính bền vững hơn gian lận.", "c) Xả thải trộm sớm muộn cũng bị xử lí.", "d) Gian lận giúp doanh nghiệp tồn tại lâu dài."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: gian lận bị phát hiện và xử lí.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Mua chịu, trả chậm giữa các doanh nghiệp là tín dụng ...».", "answer": "thương mại", "explain": "Tín dụng thương mại: mua hàng trả chậm, bán chịu giữa các doanh nghiệp.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Theo quy tắc 50/30/20, khoản «mong muốn» chiếm bao nhiêu phần trăm thu nhập? Viết số.", "answer": "30", "explain": "30 phần trăm thu nhập dành cho mong muốn.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Hợp tác xã hoạt động theo nguyên tắc", "options": ["A. tự nguyện, tương trợ, cùng có lợi.", "B. một người độc quyền quyết định.", "C. chỉ vì lợi ích của giám đốc.", "D. không cần điều lệ."], "answer": "A", "explain": "Hợp tác xã hoạt động trên nguyên tắc tự nguyện, tương trợ, dân chủ, cùng có lợi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lãi suất là", "options": ["A. «giá» của vốn vay.", "B. tiền gốc vay.", "C. tiền phạt.", "D. tiền thưởng."], "answer": "A", "explain": "Lãi suất là «giá» của vốn vay: khoản tiền người vay trả thêm ngoài gốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sinh viên dùng tiền tiết kiệm để mua tài liệu học tập, thi đỗ chứng chỉ ngoại ngữ. Đây là", "options": ["A. đầu tư cho bản thân.", "B. lãng phí.", "C. tiêu xài hoang phí.", "D. không phải đầu tư."], "answer": "A", "explain": "Đầu tư vào học tập, kĩ năng là khoản đầu tư sinh lời bền vững nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chi tiêu sau của học sinh, khoản nào là «thiết yếu»?", "options": ["A. Tiền ăn trưa ở trường.", "B. Nạp tiền game.", "C. Mua đồ chơi sưu tầm.", "D. Xem phim rạp mỗi tuần."], "answer": "A", "explain": "Tiền ăn trưa là nhu cầu thiết yếu; các khoản còn lại là «muốn».", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nhóm nông dân góp vốn mua máy gặt đập liên hợp dùng chung, chia chi phí theo diện tích. Mô hình này gần với", "options": ["A. hợp tác xã.", "B. công ty cổ phần.", "C. hộ kinh doanh.", "D. doanh nghiệp tư nhân."], "answer": "A", "explain": "Cùng góp vốn, cùng sử dụng, cùng có lợi, quyết định dân chủ — đặc trưng hợp tác xã.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người có thu nhập 15 triệu đồng mỗi tháng, đang trả góp nhà 6 triệu đồng, chi tiêu 7 triệu đồng. Người này còn dư", "options": ["A. 2 triệu đồng để tiết kiệm, dự phòng.", "B. không còn đồng nào.", "C. âm 2 triệu đồng.", "D. 15 triệu đồng."], "answer": "A", "explain": "15 − 6 − 7 = 2 triệu đồng còn dư để tiết kiệm, dự phòng — tài chính lành mạnh.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hợp tác xã tương trợ, cùng có lợi.", "b) Lãi suất là «giá» của vốn vay.", "c) Đầu tư học tập là đầu tư cho bản thân.", "d) Tiền ăn trưa là chi tiêu thiết yếu."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Góp vốn mua máy dùng chung gần với hợp tác xã.", "b) Còn dư sau chi tiêu thì nên tiết kiệm.", "c) Nạp tiền game là khoản «muốn».", "d) Mọi chi tiêu của học sinh đều thiết yếu."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: cần phân biệt «cần» và «muốn».", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Hợp tác xã: tự nguyện, tương trợ, dân chủ, cùng ...».", "answer": "có lợi", "explain": "Hợp tác xã hoạt động theo nguyên tắc tự nguyện, tương trợ, dân chủ, cùng có lợi.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thu nhập 15 triệu, trả góp 6 triệu, chi tiêu 7 triệu thì còn dư bao nhiêu triệu đồng? Viết số.", "answer": "2", "explain": "15 − 6 − 7 = 2 triệu đồng.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Câu nói «thị trường là người dẫn đường cho sản xuất» nhấn mạnh chức năng", "options": ["A. cung cấp thông tin, điều tiết sản xuất.", "B. in tiền.", "C. thu thuế.", "D. ban hành luật."], "answer": "A", "explain": "Thông tin từ thị trường dẫn dắt, định hướng cho sản xuất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người nộp thuế có nghĩa vụ", "options": ["A. kê khai trung thực, nộp đầy đủ, đúng hạn.", "B. kê khai gian dối.", "C. trốn thuế.", "D. không cần làm gì."], "answer": "A", "explain": "Kê khai trung thực, nộp thuế đầy đủ, đúng hạn là nghĩa vụ của người nộp thuế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bạn học sinh muốn bán đồ handmade online. Việc đầu tiên nên làm là", "options": ["A. tìm hiểu nhu cầu, giá cả sản phẩm tương tự trên thị trường.", "B. nhập thật nhiều hàng về.", "C. đặt giá thật cao.", "D. không cần tìm hiểu."], "answer": "A", "explain": "Tìm hiểu nhu cầu, giá cả là khai thác chức năng cung cấp thông tin của thị trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi nhận được tin nhắn «tài khoản của bạn bị khóa, bấm link để xác thực», nên", "options": ["A. xóa tin nhắn, không bấm link, báo ngân hàng nếu cần.", "B. bấm link ngay.", "C. cung cấp mã OTP.", "D. chuyển tiền theo hướng dẫn."], "answer": "A", "explain": "Đó là thủ đoạn lừa đảo chiếm đoạt tài khoản — không bấm link, không cung cấp thông tin.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Gia đình cô Lan thu nhập 20 triệu đồng mỗi tháng. Áp dụng quy tắc 50/30/20, gia đình nên tiết kiệm", "options": ["A. 4 triệu đồng.", "B. 10 triệu đồng.", "C. 6 triệu đồng.", "D. 20 triệu đồng."], "answer": "A", "explain": "Tiết kiệm = 20 × 20 phần trăm = 4 triệu đồng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tổng kết toàn phần Kinh tế, thông điệp quan trọng nhất đối với học sinh là", "options": ["A. hiểu kinh tế để tiêu dùng thông minh, kinh doanh có trách nhiệm và quản lí tài chính tốt.", "B. càng nhiều tiền càng tốt.", "C. không cần học kinh tế.", "D. kinh tế chỉ dành cho người lớn."], "answer": "A", "explain": "Hiểu kinh tế giúp tiêu dùng thông minh, tôn trọng pháp luật, kinh doanh có đạo đức và quản lí tài chính cá nhân tốt.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thị trường cung cấp thông tin, định hướng sản xuất.", "b) Người nộp thuế phải kê khai trung thực.", "c) Kinh doanh online cần tìm hiểu thị trường.", "d) Nên bấm vào link lạ yêu cầu xác thực tài khoản."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: đó là lừa đảo.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quy tắc 50/30/20 giúp quản lí tài chính.", "b) Hiểu kinh tế giúp tiêu dùng thông minh.", "c) Kinh doanh cần có đạo đức.", "d) Học sinh không cần quản lí tiền bạc."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: học sinh nên tập quản lí tài chính từ sớm.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Thị trường là ... dẫn đường cho sản xuất».", "answer": "người", "explain": "«Thị trường là người dẫn đường cho sản xuất» — chức năng cung cấp thông tin, điều tiết.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thu nhập 20 triệu đồng, theo quy tắc 50/30/20 thì tiết kiệm bao nhiêu triệu đồng? Viết số.", "answer": "4", "explain": "20 × 20 phần trăm = 4 triệu đồng.", "points": 0.5}]}]}
