sai: tiêu dùng là mục đích và động lực của sản xuất, cần tiêu dùng hợp lý chứ không phải hạn chế tối đa.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về vai trò của các hoạt động kinh tế:", "statements": ["a) Các hoạt động kinh tế giúp đáp ứng nhu cầu vật chất và tinh thần của con người.", "b) Hoạt động kinh tế thúc đẩy kinh tế - xã hội phát triển.", "c) Hoạt động kinh tế chỉ phục vụ nhu cầu vật chất, không liên quan đến đời sống tinh thần.", "d) Phát triển kinh tế góp phần cải thiện đời sống nhân dân."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng: hoạt động kinh tế đáp ứng nhu cầu vật chất, tinh thần và thúc đẩy phát triển. c sai: hoạt động kinh tế phục vụ cả nhu cầu vật chất và tinh thần.", "points": 1}, {"type": "short", "level": "VD", "q": "Quá trình tạo ra sản phẩm để tiêu dùng và tích lũy được gọi là hoạt động gì? (Trả lời bằng tên hoạt động)", "answer": "Sản xuất", "explain": "Đó chính là khái niệm của hoạt động sản xuất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Có mấy hoạt động kinh tế cơ bản trong đời sống xã hội? (Trả lời bằng số)", "answer": "3", "explain": "Ba hoạt động kinh tế cơ bản là: sản xuất, phân phối - trao đổi và tiêu dùng.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Hoạt động nào sau đây thuộc khâu phân phối - trao đổi?", "options": ["A. Nông dân trồng lúa.", "B. Công nhân may quần áo.", "C. Tiểu thương bán rau ở chợ.", "D. Học sinh ăn cơm trưa."], "answer": "C", "explain": "Tiểu thương bán rau là người đưa sản phẩm từ nơi sản xuất đến người tiêu dùng, thuộc khâu phân phối - trao đổi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây là đúng?", "options": ["A. Chỉ có sản xuất mới là hoạt động kinh tế.", "B. Mọi hoạt động của con người đều là hoạt động kinh tế.", "C. Hoạt động kinh tế là các hoạt động sản xuất, phân phối - trao đổi, tiêu dùng.", "D. Hoạt động kinh tế chỉ diễn ra ở thành phố."], "answer": "C", "explain": "Hoạt động kinh tế gồm ba khâu cơ bản: sản xuất, phân phối - trao đổi, tiêu dùng, diễn ra ở mọi nơi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phân phối - trao đổi ngày càng có vai trò quan trọng trong nền kinh tế hiện đại?", "options": ["A. Vì nó thay thế hoàn toàn khâu sản xuất.", "B. Vì sản xuất và tiêu dùng ngày càng tách xa nhau về không gian, cần cầu nối lưu thông.", "C. Vì nó tạo ra sản phẩm mới cho xã hội.", "D. Vì nó giúp giảm nhu cầu tiêu dùng."], "answer": "B", "explain": "Sản xuất tập trung ở nơi này, tiêu dùng ở nơi khác nên cần phân phối - trao đổi làm cầu nối lưu thông hàng hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận định nào sau đây sai về các hoạt động kinh tế?", "options": ["A. Sản xuất giữ vai trò quyết định.", "B. Tiêu dùng là mục đích và động lực của sản xuất.", "C. Ba hoạt động kinh tế tồn tại độc lập, không liên quan nhau.", "D. Phân phối - trao đổi là cầu nối giữa sản xuất và tiêu dùng."], "answer": "C", "explain": "Ba hoạt động kinh tế có mối quan hệ chặt chẽ, tác động qua lại lẫn nhau, không tồn tại độc lập.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Công ty sữa thu mua sữa tươi từ các hộ chăn nuôi bò rồi chế biến, đóng hộp bán ra thị trường. Công ty đã tham gia vào những hoạt động kinh tế nào?", "options": ["A. Chỉ tham gia sản xuất.", "B. Chỉ tham gia phân phối - trao đổi.", "C. Tham gia cả sản xuất (chế biến) và phân phối - trao đổi (thu mua, bán hàng).", "D. Chỉ tham gia tiêu dùng."], "answer": "C", "explain": "Thu mua và bán hàng thuộc phân phối - trao đổi; chế biến sữa thành phẩm thuộc sản xuất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nhu cầu dùng điện thoại thông minh của người dân tăng mạnh, các hãng điện thoại liên tục ra mẫu mới, mở rộng nhà máy. Hiện tượng này minh họa rõ nhất cho mối quan hệ nào?", "options": ["A. Sản xuất quyết định phân phối.", "B. Tiêu dùng là động lực thúc đẩy sản xuất phát triển.", "C. Trao đổi quyết định tiêu dùng.", "D. Phân phối quyết định sản xuất."], "answer": "B", "explain": "Nhu cầu tiêu dùng tăng đã kích thích các hãng mở rộng sản xuất, đổi mới sản phẩm: tiêu dùng là động lực của sản xuất.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Nông dân cày cấy, thu hoạch lúa là hoạt động sản xuất.", "b) Người mua hàng ở siêu thị đang tham gia hoạt động trao đổi.", "c) Gia đình sử dụng điện để thắp sáng là hoạt động tiêu dùng.", "d) Vận chuyển hàng hóa từ kho đến cửa hàng là hoạt động sản xuất."], "answer": ["T", "T", "T", "F"], "explain": "a đúng (tạo ra sản phẩm). b đúng (mua bán thuộc trao đổi). c đúng (sử dụng sản phẩm). d sai: vận chuyển thuộc phân phối - trao đổi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Sản xuất càng phát triển thì của cải cung cấp cho tiêu dùng càng dồi dào.", "b) Tiêu dùng hợp lý góp phần định hướng sản xuất phát triển bền vững.", "c) Phân phối - trao đổi kém phát triển sẽ kìm hãm sản xuất và tiêu dùng.", "d) Chỉ cần đẩy mạnh sản xuất, không cần quan tâm đến phân phối - trao đổi."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng thể hiện mối quan hệ tác động qua lại. d sai: bỏ qua phân phối - trao đổi thì sản phẩm không đến được người tiêu dùng, sản xuất bị ứ đọng.", "points": 1}, {"type": "short", "level": "VD", "q": "Việc sử dụng sản phẩm để thỏa mãn nhu cầu của con người được gọi là hoạt động gì? (Trả lời bằng tên hoạt động)", "answer": "Tiêu dùng", "explain": "Đó là khái niệm của hoạt động tiêu dùng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong các hoạt động kinh tế cơ bản, hoạt động nào giữ vai trò quyết định? (Trả lời bằng tên hoạt động)", "answer": "Sản xuất", "explain": "Sản xuất giữ vai trò quyết định đối với phân phối - trao đổi và tiêu dùng.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Phân phối được chia thành", "options": ["A. phân phối cho sản xuất và phân phối cho tiêu dùng.", "B. phân phối trong nước và phân phối ngoài nước.", "C. phân phối trực tiếp và phân phối gián tiếp.", "D. phân phối hàng hóa và phân phối dịch vụ."], "answer": "A", "explain": "Theo SGK, phân phối gồm phân phối cho sản xuất (tư liệu sản xuất) và phân phối cho tiêu dùng (hàng tiêu dùng).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hoạt động kinh tế có vai trò nào sau đây đối với đời sống con người?", "options": ["A. Đáp ứng nhu cầu vật chất và tinh thần của con người.", "B. Chỉ đáp ứng nhu cầu vật chất.", "C. Chỉ đáp ứng nhu cầu tinh thần.", "D. Không ảnh hưởng đến đời sống con người."], "answer": "A", "explain": "Các hoạt động kinh tế tạo ra của cải vật chất và các giá trị tinh thần, đáp ứng nhu cầu ngày càng cao của con người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hành vi nào sau đây thuộc hoạt động tiêu dùng?", "options": ["A. Xưởng gỗ đóng bàn ghế để bán.", "B. Cửa hàng bán lẻ quần áo cho khách.", "C. Học sinh mặc quần áo mới đi học.", "D. Xe tải chở hàng từ nhà máy về kho."], "answer": "C", "explain": "Mặc quần áo là sử dụng sản phẩm để thỏa mãn nhu cầu, thuộc hoạt động tiêu dùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu nào dưới đây thể hiện đúng vai trò quyết định của sản xuất?", "options": ["A. Muốn có gạo để ăn thì phải trồng lúa, thu hoạch và xay xát.", "B. Muốn mua gạo thì phải ra chợ.", "C. Ăn cơm giúp người nông dân có động lực trồng lúa.", "D. Chở gạo từ quê ra thành phố giúp người dân có gạo ăn."], "answer": "A", "explain": "Phải có sản xuất (trồng lúa, xay xát) mới có gạo để phân phối và tiêu dùng: sản xuất quyết định.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Chị Mai mở cửa hàng tạp hóa, nhập hàng từ các đại lý về bán lẻ cho người dân trong xóm. Chị Mai đang thực hiện hoạt động kinh tế nào là chủ yếu?", "options": ["A. Sản xuất.", "B. Phân phối - trao đổi.", "C. Tiêu dùng.", "D. Tích lũy."], "answer": "B", "explain": "Nhập hàng về bán lẻ là đưa hàng hóa từ nơi sản xuất đến tay người tiêu dùng, thuộc phân phối - trao đổi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một địa phương có nghề trồng cam rất phát triển nhưng cam thường bị ép giá, ứ đọng vì không bán được xa. Để giải quyết, biện pháp căn cơ nhất liên quan đến khâu nào?", "options": ["A. Tăng cường khâu phân phối - trao đổi: xây dựng thương hiệu, mở kênh tiêu thụ, logistics.", "B. Ngừng sản xuất cam để tránh ứ đọng.", "C. Khuyến khích người dân ăn nhiều cam hơn.", "D. Giảm diện tích trồng cam một nửa."], "answer": "A", "explain": "Vấn đề là sản phẩm không đến được người tiêu dùng ở xa, tức khâu phân phối - trao đổi yếu; cần tăng cường khâu này.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Hoạt động kinh tế diễn ra trong mọi lĩnh vực của đời sống xã hội.", "b) Chỉ những người làm kinh doanh mới tham gia hoạt động kinh tế.", "c) Học sinh mua bút để học tập là tham gia hoạt động trao đổi.", "d) Người thợ may quần áo để bán là tham gia hoạt động sản xuất."], "answer": ["T", "F", "T", "T"], "explain": "a đúng. b sai: mọi người đều tham gia hoạt động kinh tế với vai trò khác nhau. c đúng (mua bán thuộc trao đổi). d đúng: may quần áo để bán là tạo ra sản phẩm, thuộc sản xuất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Sản xuất phát triển tạo tiền đề cho phân phối - trao đổi mở rộng.", "b) Tiêu dùng xa xỉ, lãng phí sẽ thúc đẩy sản xuất phát triển bền vững.", "c) Ứng dụng khoa học - công nghệ giúp nâng cao hiệu quả của cả ba hoạt động kinh tế.", "d) Hoạt động kinh tế gắn liền với đời sống hằng ngày của mỗi gia đình."], "answer": ["T", "F", "T", "T"], "explain": "a đúng. b sai: tiêu dùng lãng phí gây cạn kiệt tài nguyên, không bền vững. c đúng. d đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Phân phối được chia thành phân phối cho sản xuất và phân phối cho đối tượng nào? (Trả lời bằng cụm từ)", "answer": "Tiêu dùng", "explain": "Phân phối gồm phân phối cho sản xuất và phân phối cho tiêu dùng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cụm từ nào diễn tả vai trò của phân phối - trao đổi trong quá trình hoạt động kinh tế? (Trả lời: khâu ...)", "answer": "Khâu trung gian", "explain": "Phân phối - trao đổi là khâu trung gian nối sản xuất với tiêu dùng.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Đâu là biểu hiện của hoạt động sản xuất trong đời sống?", "options": ["A. Người dân đi chợ mua thực phẩm.", "B. Nhà máy sản xuất xe máy.", "C. Gia đình nấu cơm tối.", "D. Cửa hàng bán vé xem phim."], "answer": "B", "explain": "Nhà máy tạo ra xe máy là quá trình tạo ra sản phẩm, thuộc hoạt động sản xuất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trao đổi trong hoạt động kinh tế được hiểu là", "options": ["A. việc đưa sản phẩm từ người sản xuất đến người tiêu dùng thông qua mua bán.", "B. việc tạo ra sản phẩm mới.", "C. việc sử dụng sản phẩm đã làm ra.", "D. việc cất giữ sản phẩm trong kho."], "answer": "A", "explain": "Trao đổi là khâu đưa sản phẩm từ nơi sản xuất đến tay người tiêu dùng, thường thông qua mua bán.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao tiêu dùng được coi là động lực thúc đẩy sản xuất?", "options": ["A. Vì tiêu dùng tạo ra sản phẩm mới.", "B. Vì nhu cầu tiêu dùng định hướng cho sản xuất về số lượng, chất lượng, mẫu mã sản phẩm.", "C. Vì tiêu dùng làm giảm chi phí sản xuất.", "D. Vì tiêu dùng thay thế được khâu phân phối."], "answer": "B", "explain": "Nhu cầu của người tiêu dùng về số lượng, chất lượng, mẫu mã là tín hiệu để nhà sản xuất điều chỉnh, mở rộng sản xuất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong ba hoạt động kinh tế, hoạt động nào trực tiếp tạo ra của cải vật chất cho xã hội?", "options": ["A. Phân phối.", "B. Trao đổi.", "C. Sản xuất.", "D. Tiêu dùng."], "answer": "C", "explain": "Sản xuất là quá trình tạo ra sản phẩm, của cải vật chất cho xã hội.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hợp tác xã rau sạch ký hợp đồng cung cấp rau hằng ngày cho các bếp ăn trường học. Hợp tác xã đang thực hiện tốt khâu nào?", "options": ["A. Khâu sản xuất.", "B. Khâu phân phối - trao đổi.", "C. Khâu tiêu dùng.", "D. Khâu tích lũy."], "answer": "B", "explain": "Ký hợp đồng cung cấp rau đều đặn cho bếp ăn là tổ chức đưa sản phẩm đến người tiêu dùng, thuộc phân phối - trao đổi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong đợt dịch bệnh, nhu cầu khẩu trang tăng đột biến, nhiều doanh nghiệp chuyển sang sản xuất khẩu trang. Điều này chứng tỏ", "options": ["A. sản xuất luôn đi trước và quyết định mọi nhu cầu.", "B. nhu cầu tiêu dùng có thể định hướng, thúc đẩy sản xuất chuyển hướng kịp thời.", "C. phân phối - trao đổi là khâu quan trọng nhất.", "D. tiêu dùng không ảnh hưởng đến sản xuất."], "answer": "B", "explain": "Nhu cầu tiêu dùng tăng đột biến đã thúc đẩy doanh nghiệp chuyển hướng sản xuất: tiêu dùng là động lực của sản xuất.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Sản xuất, phân phối - trao đổi, tiêu dùng là ba hoạt động kinh tế cơ bản.", "b) Trong ba hoạt động, tiêu dùng giữ vai trò quyết định.", "c) Phân phối - trao đổi là cầu nối giữa sản xuất và tiêu dùng.", "d) Tiêu dùng là mục đích của sản xuất."], "answer": ["T", "F", "T", "T"], "explain": "a, c, d đúng. b sai: vai trò quyết định thuộc về sản xuất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Kinh tế phát triển giúp nâng cao đời sống vật chất và tinh thần của nhân dân.", "b) Mỗi cá nhân, gia đình đều gắn với các hoạt động kinh tế hằng ngày.", "c) Hoạt động kinh tế chỉ có ý nghĩa với doanh nghiệp, không liên quan đến học sinh.", "d) Tiêu dùng tiết kiệm, hợp lý góp phần sử dụng hiệu quả nguồn lực xã hội."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: học sinh cũng tham gia hoạt động kinh tế (mua sắm, tiêu dùng...).", "points": 1}, {"type": "short", "level": "VD", "q": "Hoạt động đưa sản phẩm từ người sản xuất đến người tiêu dùng thông qua mua bán được gọi là gì? (Trả lời bằng tên hoạt động)", "answer": "Trao đổi", "explain": "Đó là khái niệm của hoạt động trao đổi.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sản xuất tạo ra sản phẩm để phục vụ hai mục đích nào? (Trả lời: tiêu dùng và ...)", "answer": "Tích lũy", "explain": "Sản xuất là quá trình tạo ra sản phẩm để tiêu dùng và tích lũy.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Hoạt động sản xuất có đặc điểm nào sau đây?", "options": ["A. Không tạo ra sản phẩm mới cho xã hội.", "B. Là quá trình con người tác động vào tự nhiên để tạo ra sản phẩm.", "C. Chỉ diễn ra trong các nhà máy lớn.", "D. Không cần sức lao động của con người."], "answer": "B", "explain": "Sản xuất là quá trình con người vận dụng sức lao động, tác động vào đối tượng tự nhiên để tạo ra sản phẩm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong đời sống, hoạt động trao đổi thường diễn ra dưới hình thức", "options": ["A. cho tặng miễn phí.", "B. mua bán hàng hóa, dịch vụ.", "C. tích trữ hàng hóa trong kho.", "D. tự sản xuất tự tiêu dùng."], "answer": "B", "explain": "Trao đổi chủ yếu diễn ra qua mua bán hàng hóa, dịch vụ trên thị trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Gia đình bác Tư trồng lúa, một phần để ăn, một phần bán lấy tiền mua phân bón cho vụ sau. Việc dùng tiền bán lúa mua phân bón thể hiện", "options": ["A. phân phối cho tiêu dùng.", "B. phân phối cho sản xuất.", "C. hoạt động tiêu dùng thuần túy.", "D. hoạt động tích lũy tiền tệ."], "answer": "B", "explain": "Mua phân bón là đưa tư liệu sản xuất trở lại quá trình sản xuất, thuộc phân phối cho sản xuất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây không đúng về tiêu dùng?", "options": ["A. Tiêu dùng là mục đích của sản xuất.", "B. Tiêu dùng thúc đẩy sản xuất phát triển.", "C. Tiêu dùng càng nhiều, càng lãng phí thì càng tốt cho nền kinh tế.", "D. Tiêu dùng hợp lý góp phần phát triển bền vững."], "answer": "C", "explain": "Tiêu dùng lãng phí gây cạn kiệt tài nguyên, không tốt cho nền kinh tế; cần tiêu dùng hợp lý, tiết kiệm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Siêu thị tổ chức chương trình giảm giá, người dân đổ xô mua sắm khiến nhiều mặt hàng cháy hàng, siêu thị phải nhập thêm hàng gấp. Tình huống này cho thấy", "options": ["A. sản xuất quyết định hoàn toàn tiêu dùng.", "B. nhu cầu tiêu dùng tăng đột biến đã tác động mạnh trở lại, thúc đẩy phân phối và sản xuất.", "C. phân phối - trao đổi không còn cần thiết.", "D. tiêu dùng không ảnh hưởng đến hoạt động kinh tế khác."], "answer": "B", "explain": "Nhu cầu tiêu dùng tăng đã kéo theo phân phối phải nhập thêm hàng và sản xuất phải tăng cung: tiêu dùng tác động trở lại các khâu khác.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một quốc gia có nền sản xuất hiện đại nhưng hệ thống phân phối - trao đổi lạc hậu, hàng hóa ứ đọng ở nơi sản xuất trong khi nơi khác khan hiếm. Bài học rút ra là", "options": ["A. chỉ cần chú trọng sản xuất là đủ.", "B. các hoạt động kinh tế có quan hệ chặt chẽ, khâu yếu sẽ kìm hãm cả quá trình.", "C. nên giảm sản xuất để phù hợp với phân phối.", "D. tiêu dùng là khâu quan trọng nhất cần ưu tiên."], "answer": "B", "explain": "Ba hoạt động kinh tế tác động qua lại; khâu phân phối - trao đổi yếu sẽ làm ứ đọng sản xuất và thiếu hụt tiêu dùng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Sản xuất tạo ra của cải vật chất nuôi sống xã hội.", "b) Phân phối - trao đổi giúp lưu thông hàng hóa trong nền kinh tế.", "c) Tiêu dùng là khâu cuối cùng, không tác động đến các khâu khác.", "d) Ba hoạt động kinh tế có mối quan hệ mật thiết với nhau."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: tiêu dùng vừa là mục đích vừa là động lực thúc đẩy sản xuất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Người nông dân bán lúa cho thương lái là tham gia hoạt động trao đổi.", "b) Thương lái chở lúa đến nhà máy xay xát là tham gia phân phối.", "c) Nhà máy xay xát lúa thành gạo là hoạt động tiêu dùng.", "d) Người dân nấu cơm ăn là hoạt động tiêu dùng."], "answer": ["T", "T", "F", "T"], "explain": "a, b đúng. c sai: xay xát tạo ra sản phẩm gạo là sản xuất. d đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Khâu kinh tế nào có nhiệm vụ đưa tư liệu sản xuất đến tay người sản xuất và hàng tiêu dùng đến tay người dân? (Trả lời bằng tên khâu)", "answer": "Phân phối", "explain": "Đó là nhiệm vụ của khâu phân phối (phân phối cho sản xuất và phân phối cho tiêu dùng).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao sản xuất được coi là khâu giữ vai trò quyết định? (Trả lời ngắn gọn bằng cụm từ: vì sản xuất tạo ra ...)", "answer": "Sản phẩm", "explain": "Vì sản xuất tạo ra sản phẩm - đối tượng của phân phối, trao đổi, tiêu dùng - nên quyết định các khâu còn lại.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Nhu cầu của con người trong đời sống được đáp ứng nhờ", "options": ["A. các hoạt động kinh tế.", "B. các hoạt động vui chơi.", "C. các hoạt động từ thiện.", "D. các hoạt động tín ngưỡng."], "answer": "A", "explain": "Các hoạt động kinh tế (sản xuất, phân phối - trao đổi, tiêu dùng) tạo ra của cải đáp ứng nhu cầu con người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hoạt động nào sau đây không thuộc ba hoạt động kinh tế cơ bản?", "options": ["A. Sản xuất.", "B. Tín dụng.", "C. Tiêu dùng.", "D. Phân phối - trao đổi."], "answer": "B", "explain": "Tín dụng là một quan hệ kinh tế cụ thể, không phải một trong ba hoạt động kinh tế cơ bản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Người thợ mộc đóng tủ, bàn ghế để bán cho khách hàng. Đây là hoạt động", "options": ["A. tiêu dùng.", "B. sản xuất.", "C. phân phối.", "D. trao đổi."], "answer": "B", "explain": "Đóng tủ, bàn ghế là tạo ra sản phẩm mới, thuộc hoạt động sản xuất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi thu nhập của người dân tăng lên, nhu cầu mua sắm hàng hóa chất lượng cao cũng tăng theo. Điều này thể hiện", "options": ["A. sản xuất quyết định tiêu dùng.", "B. đời sống được cải thiện làm thay đổi nhu cầu tiêu dùng, từ đó định hướng sản xuất.", "C. phân phối quyết định thu nhập.", "D. trao đổi làm tăng thu nhập."], "answer": "B", "explain": "Thu nhập tăng làm nhu cầu tiêu dùng thay đổi theo hướng chất lượng cao hơn, tạo động lực cho sản xuất nâng cao chất lượng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Chợ đầu mối nông sản hoạt động suốt đêm, thu gom rau củ từ các vùng quê rồi phân phối cho các chợ lẻ trong thành phố. Chợ đầu mối đóng vai trò", "options": ["A. khâu sản xuất nông sản.", "B. khâu trung gian trong phân phối - trao đổi.", "C. khâu tiêu dùng cuối cùng.", "D. khâu tích lũy vốn."], "answer": "B", "explain": "Chợ đầu mối tập kết và phân phối hàng hóa từ nơi sản xuất đến nơi tiêu dùng, là khâu trung gian của phân phối - trao đổi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Xã A phát động phong trào mỗi hộ gia đình trồng rau sạch trong vườn nhà để tự cung cấp, giảm chi tiêu. Mô hình này làm mờ ranh giới giữa các hoạt động kinh tế nào?", "options": ["A. Giữa sản xuất và tiêu dùng, vì hộ gia đình vừa sản xuất vừa tiêu dùng sản phẩm mình làm ra.", "B. Giữa phân phối và trao đổi.", "C. Giữa sản xuất và phân phối.", "D. Không liên quan đến hoạt động kinh tế nào."], "answer": "A", "explain": "Tự trồng rau để ăn: hộ gia đình đồng thời là người sản xuất và người tiêu dùng, ranh giới hai khâu mờ đi.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Mọi sản phẩm làm ra đều phải trải qua khâu phân phối - trao đổi mới đến tay người tiêu dùng.", "b) Có những sản phẩm người sản xuất tự tiêu dùng, không qua trao đổi.", "c) Tiêu dùng chỉ bao gồm việc ăn uống.", "d) Sản xuất càng phát triển, đời sống nhân dân càng được cải thiện."], "answer": ["F", "T", "F", "T"], "explain": "a sai: tự sản xuất tự tiêu dùng thì không qua trao đổi. b đúng. c sai: tiêu dùng gồm mọi nhu cầu vật chất và tinh thần. d đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Hoạt động kinh tế giúp con người chinh phục, cải tạo tự nhiên để tạo ra của cải.", "b) Phát triển kinh tế là nền tảng để phát triển văn hóa, giáo dục, y tế.", "c) Hoạt động kinh tế và đời sống xã hội không liên quan đến nhau.", "d) Mỗi người vừa có thể là người sản xuất, vừa có thể là người tiêu dùng."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: hoạt động kinh tế gắn bó mật thiết với đời sống xã hội.", "points": 1}, {"type": "short", "level": "VD", "q": "Người nông dân trồng rau để gia đình ăn thuộc hình thức tự sản xuất tự gì? (Trả lời bằng một từ)", "answer": "Tiêu dùng", "explain": "Tự sản xuất tự tiêu dùng: người sản xuất đồng thời là người tiêu dùng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ba hoạt động kinh tế cơ bản có mối quan hệ với nhau như thế nào? (Trả lời bằng cụm từ: quan hệ ...)", "answer": "Tác động qua lại", "explain": "Ba hoạt động sản xuất, phân phối - trao đổi, tiêu dùng có mối quan hệ chặt chẽ, tác động qua lại lẫn nhau.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Tiêu dùng có vai trò gì đối với sản xuất?", "options": ["A. Là mục đích và động lực thúc đẩy sản xuất.", "B. Không có vai trò gì.", "C. Làm cản trở sản xuất phát triển.", "D. Thay thế hoàn toàn khâu sản xuất."], "answer": "A", "explain": "Tiêu dùng là mục đích của sản xuất, đồng thời nhu cầu tiêu dùng thúc đẩy sản xuất phát triển.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sản xuất giữ vai trò quyết định vì", "options": ["A. sản xuất tạo ra sản phẩm là đối tượng của các hoạt động kinh tế khác.", "B. sản xuất giúp vận chuyển hàng hóa.", "C. sản xuất làm tăng nhu cầu mua sắm.", "D. sản xuất tiêu thụ hết sản phẩm làm ra."], "answer": "A", "explain": "Không có sản phẩm do sản xuất tạo ra thì không có gì để phân phối, trao đổi, tiêu dùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hành vi mua vé xem ca nhạc của khán giả thuộc hoạt động kinh tế nào?", "options": ["A. Sản xuất dịch vụ.", "B. Phân phối dịch vụ.", "C. Tiêu dùng dịch vụ.", "D. Tích lũy dịch vụ."], "answer": "C", "explain": "Mua vé để thưởng thức ca nhạc là sử dụng dịch vụ thỏa mãn nhu cầu tinh thần, thuộc tiêu dùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận định nào sau đây đúng nhất về mối quan hệ giữa ba hoạt động kinh tế?", "options": ["A. Ba hoạt động tồn tại riêng lẻ, không ảnh hưởng nhau.", "B. Sản xuất quyết định, phân phối - trao đổi là cầu nối, tiêu dùng là mục đích và động lực.", "C. Tiêu dùng quyết định tất cả các hoạt động còn lại.", "D. Phân phối - trao đổi là khâu quan trọng nhất."], "answer": "B", "explain": "Đây là cách khái quát đúng nhất mối quan hệ giữa ba hoạt động kinh tế cơ bản.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Dịp Tết, sức mua tăng cao, các doanh nghiệp tăng ca sản xuất bánh kẹo, các siêu thị dự trữ hàng hóa đầy kho. Chuỗi hiện tượng này minh họa", "options": ["A. sản xuất hoàn toàn bị động trước tiêu dùng.", "B. nhu cầu tiêu dùng tác động mạnh đến sản xuất và phân phối.", "C. phân phối quyết định nhu cầu tiêu dùng.", "D. tiêu dùng không liên quan đến sản xuất."], "answer": "B", "explain": "Sức mua Tết tăng kéo theo doanh nghiệp tăng sản xuất, siêu thị tăng dự trữ: tiêu dùng tác động trở lại sản xuất và phân phối.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nhà kinh tế học cho rằng muốn biết một xã hội phát triển đến đâu, hãy nhìn vào trình độ sản xuất của nó. Quan điểm này đề cao vai trò nào của sản xuất?", "options": ["A. Vai trò quyết định của sản xuất đối với các hoạt động kinh tế khác và đời sống xã hội.", "B. Vai trò cầu nối của sản xuất.", "C. Vai trò tiêu thụ sản phẩm của sản xuất.", "D. Vai trò phân phối của sản xuất."], "answer": "A", "explain": "Trình độ sản xuất quyết định trình độ phát triển kinh tế - xã hội, thể hiện vai trò quyết định của sản xuất.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Hoạt động kinh tế chỉ bao gồm sản xuất vật chất.", "b) Dịch vụ giáo dục, y tế cũng là sản phẩm của hoạt động kinh tế.", "c) Người lao động làm dịch vụ sửa xe là tham gia hoạt động sản xuất.", "d) Khách hàng sử dụng dịch vụ sửa xe là tham gia hoạt động tiêu dùng."], "answer": ["F", "T", "T", "T"], "explain": "a sai: hoạt động kinh tế gồm cả sản xuất vật chất và dịch vụ. b, c, d đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Nền kinh tế càng phát triển, phân phối - trao đổi càng có vai trò quan trọng.", "b) Thương mại điện tử giúp rút ngắn khâu phân phối - trao đổi.", "c) Bán hàng online vẫn thuộc hoạt động trao đổi.", "d) Mua hàng online không phải là hoạt động kinh tế."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: mua hàng online là tham gia trao đổi và tiêu dùng, vẫn là hoạt động kinh tế.", "points": 1}, {"type": "short", "level": "VD", "q": "Việc mua vé xem phim, đi du lịch để thỏa mãn nhu cầu tinh thần thuộc hoạt động tiêu dùng loại gì? (Trả lời: tiêu dùng ...)", "answer": "Dịch vụ", "explain": "Đó là tiêu dùng dịch vụ (sử dụng các dịch vụ để thỏa mãn nhu cầu).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Muốn có sản phẩm để phân phối, trao đổi và tiêu dùng thì trước hết phải thực hiện hoạt động nào? (Trả lời bằng tên hoạt động)", "answer": "Sản xuất", "explain": "Sản xuất tạo ra sản phẩm, là tiền đề của mọi hoạt động kinh tế khác.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Đâu là ví dụ về hoạt động phân phối cho sản xuất?", "options": ["A. Cửa hàng bán gạo cho người dân.", "B. Công ty cung cấp máy móc cho nhà máy.", "C. Siêu thị bán quần áo cho khách.", "D. Gia đình mua tivi để xem."], "answer": "B", "explain": "Cung cấp máy móc cho nhà máy là đưa tư liệu sản xuất đến người sản xuất, thuộc phân phối cho sản xuất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đâu là ví dụ về hoạt động phân phối cho tiêu dùng?", "options": ["A. Nhà máy mua nguyên liệu để sản xuất.", "B. Cửa hàng bán lẻ thực phẩm cho người dân.", "C. Công ty nhập khẩu dây chuyền công nghệ.", "D. Xí nghiệp mua xe tải chở hàng."], "answer": "B", "explain": "Bán lẻ thực phẩm cho người dân là đưa hàng tiêu dùng đến tay người dân, thuộc phân phối cho tiêu dùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói hoạt động kinh tế có vai trò quan trọng đối với đời sống con người?", "options": ["A. Vì hoạt động kinh tế tạo ra của cải đáp ứng nhu cầu ngày càng cao của con người.", "B. Vì hoạt động kinh tế chỉ giúp con người kiếm tiền.", "C. Vì hoạt động kinh tế giúp con người tránh lao động.", "D. Vì hoạt động kinh tế chỉ phục vụ nhu cầu của doanh nghiệp."], "answer": "A", "explain": "Hoạt động kinh tế tạo ra của cải vật chất và giá trị tinh thần, đáp ứng nhu cầu vật chất, tinh thần ngày càng cao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các khâu của hoạt động kinh tế, khâu nào trực tiếp đáp ứng nhu cầu của con người?", "options": ["A. Sản xuất.", "B. Phân phối.", "C. Tiêu dùng.", "D. Trao đổi."], "answer": "C", "explain": "Tiêu dùng là khâu con người trực tiếp sử dụng sản phẩm để thỏa mãn nhu cầu của mình.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Anh Bình làm nghề shipper, hằng ngày giao hàng từ các shop đến tay khách hàng. Công việc của anh Bình thuộc", "options": ["A. hoạt động sản xuất.", "B. hoạt động phân phối - trao đổi.", "C. hoạt động tiêu dùng.", "D. không thuộc hoạt động kinh tế nào."], "answer": "B", "explain": "Giao hàng là đưa sản phẩm từ người bán đến người mua, thuộc khâu phân phối - trao đổi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một doanh nghiệp chỉ tập trung sản xuất thật nhiều mà bỏ qua nghiên cứu nhu cầu thị trường, kết quả hàng tồn kho chất đống. Nguyên nhân sâu xa là doanh nghiệp đã", "options": ["A. không thấy được vai trò quyết định của sản xuất.", "B. xem nhẹ mối quan hệ tác động qua lại giữa sản xuất với tiêu dùng và phân phối - trao đổi.", "C. đầu tư quá nhiều cho khâu tiêu dùng.", "D. thực hiện tốt khâu phân phối - trao đổi."], "answer": "B", "explain": "Sản xuất tách rời nhu cầu tiêu dùng và không tổ chức tốt phân phối - trao đổi dẫn đến ứ đọng: xem nhẹ mối quan hệ giữa các khâu.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Sản xuất là hoạt động tạo ra sản phẩm cho xã hội.", "b) Mọi người trong xã hội đều tham gia vào các hoạt động kinh tế.", "c) Hoạt động kinh tế không cần thiết đối với học sinh.", "d) Tiêu dùng hợp lý giúp bảo vệ tài nguyên, môi trường."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: học sinh cũng tham gia hoạt động kinh tế qua mua sắm, tiêu dùng hằng ngày.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Sản xuất phát triển thì phân phối - trao đổi cũng có điều kiện mở rộng.", "b) Khi đời sống nâng cao, cơ cấu tiêu dùng của người dân cũng thay đổi.", "c) Hoạt động kinh tế càng phát triển, con người càng ít phụ thuộc vào tự nhiên.", "d) Bảo vệ môi trường không liên quan đến hoạt động kinh tế."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: hoạt động kinh tế phải gắn với bảo vệ môi trường để phát triển bền vững.", "points": 1}, {"type": "short", "level": "VD", "q": "Việc đưa máy móc, nguyên liệu đến tay người sản xuất thuộc loại phân phối nào? (Trả lời: phân phối cho ...)", "answer": "Sản xuất", "explain": "Đó là phân phối cho sản xuất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Việc đưa hàng hóa tiêu dùng đến tay người dân thuộc loại phân phối nào? (Trả lời: phân phối cho ...)", "answer": "Tiêu dùng", "explain": "Đó là phân phối cho tiêu dùng.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Hoạt động kinh tế cơ bản nào tạo ra thu nhập trực tiếp cho người lao động tham gia vào nó?", "options": ["A. Chỉ có hoạt động sản xuất.", "B. Cả ba hoạt động: sản xuất, phân phối - trao đổi, tiêu dùng đều tạo việc làm, thu nhập.", "C. Chỉ có hoạt động trao đổi.", "D. Không hoạt động nào tạo ra thu nhập."], "answer": "B", "explain": "Cả ba khâu đều cần sức lao động, tạo việc làm và thu nhập cho người tham gia.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mục đích cuối cùng của mọi hoạt động kinh tế là", "options": ["A. tạo ra thật nhiều sản phẩm.", "B. thỏa mãn nhu cầu ngày càng cao của con người.", "C. tích lũy thật nhiều tiền bạc.", "D. mở rộng thị trường ra nước ngoài."], "answer": "B", "explain": "Mọi hoạt động kinh tế suy cho cùng đều nhằm thỏa mãn nhu cầu vật chất và tinh thần ngày càng cao của con người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn An dùng tiền mừng tuổi mua sách vở, đồ dùng học tập. Bạn An đang tham gia vào các hoạt động kinh tế nào?", "options": ["A. Chỉ tham gia tiêu dùng.", "B. Tham gia trao đổi (mua bán) và tiêu dùng (sử dụng).", "C. Chỉ tham gia sản xuất.", "D. Không tham gia hoạt động kinh tế nào."], "answer": "B", "explain": "Mua sách vở là trao đổi; dùng sách vở để học tập là tiêu dùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu tục ngữ nào sau đây phản ánh đúng vai trò của sản xuất?", "options": ["A. Có công mài sắt, có ngày nên kim.", "B. Tay làm hàm nhai, tay quai miệng trễ.", "C. Một miếng khi đói bằng một gói khi no.", "D. Ăn quả nhớ kẻ trồng cây."], "answer": "B", "explain": "\"Tay làm hàm nhai\" nghĩa là có lao động sản xuất thì mới có cái để tiêu dùng, thể hiện vai trò quyết định của sản xuất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nghề livestream bán hàng online phát triển mạnh, người bán giới thiệu sản phẩm trực tiếp, khách đặt mua và được giao tận nhà. Mô hình này cho thấy", "options": ["A. khâu trao đổi được rút ngắn, gắn chặt với phân phối hiện đại.", "B. khâu sản xuất không còn cần thiết.", "C. người tiêu dùng trở thành người sản xuất.", "D. hoạt động kinh tế không cần thị trường."], "answer": "A", "explain": "Livestream bán hàng là hình thức trao đổi hiện đại, kết hợp chặt chẽ với phân phối (giao hàng tận nơi), rút ngắn khâu trung gian.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để phát triển kinh tế bền vững, một địa phương cần chú ý điều gì trong tổ chức các hoạt động kinh tế?", "options": ["A. Chỉ đẩy mạnh sản xuất bằng mọi giá.", "B. Phát triển hài hòa cả ba khâu, gắn sản xuất với nhu cầu tiêu dùng và bảo vệ môi trường.", "C. Hạn chế tiêu dùng để dành nguồn lực cho sản xuất.", "D. Bỏ qua khâu phân phối - trao đổi để tiết kiệm chi phí."], "answer": "B", "explain": "Phát triển bền vững đòi hỏi ba khâu hài hòa, sản xuất gắn với nhu cầu thực và thân thiện môi trường.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Ba hoạt động kinh tế cơ bản là sản xuất, phân phối - trao đổi, tiêu dùng.", "b) Sản xuất giữ vai trò quyết định.", "c) Phân phối - trao đổi là khâu trung gian.", "d) Tiêu dùng không có vai trò gì đối với sản xuất."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: tiêu dùng vừa là mục đích vừa là động lực của sản xuất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau:", "statements": ["a) Học sinh cần có ý thức tiêu dùng tiết kiệm, hợp lý.", "b) Lãng phí trong tiêu dùng gây tổn hại đến nguồn lực của đất nước.", "c) Mua sắm theo nhu cầu thực tế là biểu hiện của tiêu dùng hợp lý.", "d) Tiêu dùng càng nhiều thì càng thể hiện sự văn minh."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: văn minh thể hiện ở tiêu dùng hợp lý, tiết kiệm chứ không phải tiêu dùng nhiều.", "points": 1}, {"type": "short", "level": "VD", "q": "Mọi hoạt động kinh tế suy cho cùng đều nhằm thỏa mãn nhu cầu ngày càng cao của đối tượng nào? (Trả lời bằng một từ)", "answer": "Con người", "explain": "Mục đích cuối cùng của hoạt động kinh tế là thỏa mãn nhu cầu vật chất và tinh thần của con người.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điền từ còn thiếu: Sản xuất giữ vai trò ... đối với các hoạt động kinh tế khác.", "answer": "Quyết định", "explain": "Sản xuất giữ vai trò quyết định đối với phân phối - trao đổi và tiêu dùng.", "points": 0.5}]}]}
