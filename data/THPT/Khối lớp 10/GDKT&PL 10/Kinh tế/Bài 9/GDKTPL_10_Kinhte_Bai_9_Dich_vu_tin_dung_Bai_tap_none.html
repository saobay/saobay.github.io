i sử dụng dịch vụ tín dụng hiệu quả là", "options": ["A. xác định đúng nhu cầu vay.", "B. vay ngay không cần nghĩ.", "C. chọn nơi cho vay nhanh nhất.", "D. vay càng nhiều càng tốt."], "answer": "A", "explain": "Xác định đúng nhu cầu: vay để làm gì, cần bao nhiêu, trong bao lâu — bước đầu tiên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trước khi vay, người đi vay nên", "options": ["A. so sánh lãi suất, phí giữa các ngân hàng.", "B. chọn bừa một nơi.", "C. không cần so sánh.", "D. vay nơi lãi suất cao nhất."], "answer": "A", "explain": "So sánh lãi suất, phí giữa các tổ chức tín dụng giúp chọn được gói vay tốt nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phải đọc kĩ hợp đồng tín dụng trước khi kí?", "options": ["A. Vì hợp đồng có điều khoản về lãi suất, phí phạt, điều khoản ẩn.", "B. Vì hợp đồng chỉ để trang trí.", "C. Vì không ai đọc hợp đồng.", "D. Vì đọc hay không cũng như nhau."], "answer": "A", "explain": "Hợp đồng quy định lãi suất, thời hạn, phí phạt trả chậm, điều khoản ẩn — phải đọc kĩ để tránh rủi ro.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một gia đình thu nhập 15 triệu đồng mỗi tháng, định vay mua nhà trả góp 12 triệu đồng mỗi tháng. Đánh giá nào đúng?", "options": ["A. Khoản trả vượt khả năng, rất rủi ro.", "B. Hoàn toàn hợp lí.", "C. Càng trả nhiều càng tốt.", "D. Không cần tính toán."], "answer": "A", "explain": "Trả góp 12 triệu trên thu nhập 15 triệu là quá sức, dễ vỡ nợ — phải tính khả năng trả nợ trước khi vay.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Gia đình cần vay 300 triệu đồng: ngân hàng A lãi suất 10 phần trăm một năm, ngân hàng B lãi suất 8 phần trăm một năm, điều kiện tương đương. Lựa chọn thông minh là", "options": ["A. chọn ngân hàng B vì lãi suất thấp hơn.", "B. chọn ngân hàng A vì lãi suất cao hơn.", "C. chọn bừa.", "D. vay cả hai ngân hàng."], "answer": "A", "explain": "So sánh lãi suất để chọn gói vay rẻ hơn — tiết kiệm chi phí lãi vay.", "points": 0.25}, {"type": "m  chức tín dụng chính thống được Ngân hàng Nhà nước cấp phép, hoạt động minh bạch.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi gặp khó khăn không trả được nợ đúng hạn, người vay nên", "options": ["A. chủ động liên hệ ngân hàng để được cơ cấu lại nợ.", "B. bỏ trốn.", "C. vay tín dụng đen để trả.", "D. im lặng chờ đợi."], "answer": "A", "explain": "Chủ động liên hệ ngân hàng để được giãn, cơ cấu lại nợ là cách xử lí đúng đắn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hành vi «vay hộ» người khác khi không hiểu rõ trách nhiệm có rủi ro", "options": ["A. phải chịu trách nhiệm trả nợ thay nếu người vay chính không trả.", "B. không có rủi ro gì.", "C. được hưởng lợi.", "D. được miễn trách nhiệm."], "answer": "A", "explain": "Đứng tên vay hộ, bảo lãnh cho người khác mà họ không trả thì mình phải chịu trách nhiệm trả thay.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không nên cung cấp mã OTP cho người lạ?", "options": ["A. Vì kẻ gian dùng mã OTP để chiếm đoạt tiền trong tài khoản.", "B. Vì mã OTP không quan trọng.", "C. Vì ngân hàng yêu cầu cung cấp.", "D. Vì chia sẻ là tốt."], "answer": "A", "explain": "Mã OTP là lớp bảo vệ cuối cùng của giao dịch; cung cấp cho người lạ là tự mở cửa cho kẻ gian.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn Nam được người lạ nhờ đứng tên vay hộ 50 triệu đồng, hứa cho 2 triệu đồng «tiền công». Bạn Nam nên", "options": ["A. từ chối vì rủi ro phải trả nợ thay rất lớn.", "B. đồng ý vì được 2 triệu đồng.", "C. đồng ý vì tin người lạ.", "D. vay hộ nhiều người để kiếm tiền công."], "answer": "A", "explain": "Vay hộ mà người vay chính không trả thì mình phải trả thay 50 triệu đồng — rủi ro quá lớn so với 2 triệu «tiền công».", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người nhận được cuộc gọi tự xưng «công an» yêu cầu chuyển tiền để «phục vụ điều tra». Đây là", "options": ["A. thủ đoạn lừa đảo, cần báo công an thật.", "B. yêu cầu chính đáng của cơ quan chức năng.", "C. nên làm theo ngay.", "D. không có gì đáng ngại."], "answer": "A", "explain": "Cơ quan chức năng không bao giờ yêu cầu chuyển tiền qua điện thoại — đây là lừa đảo, cần báo công an.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chỉ giao dịch với tổ chức tín dụng được cấp phép.", "b) Khó khăn trả nợ nên chủ động liên hệ ngân hàng.", "c) Không cung cấp mã OTP cho người lạ.", "d) Nên vay hộ người lạ để kiếm tiền công."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: vay hộ rất rủi ro, phải chịu trách nhiệm trả thay.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Công an không yêu cầu chuyển tiền qua điện thoại.", "b) Bỏ trốn khi không trả được nợ làm mọi việc tồi tệ hơn.", "c) Cơ cấu lại nợ giúp người vay vượt qua khó khăn.", "d) Tin lời người lạ xưng công an qua điện thoại là đúng."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: đó là thủ đoạn lừa đảo.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Tuyệt đối không cung cấp mã ... cho người lạ».", "answer": "OTP", "explain": "Không cung cấp mã OTP, mật khẩu cho người lạ để tránh bị chiếm đoạt tài khoản.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Khi không trả được nợ đúng hạn, người vay nên chủ động liên hệ ngân hàng để được ... lại nợ. Điền từ còn thiếu.", "answer": "cơ cấu", "explain": "Cơ cấu lại nợ (giãn, giảm) giúp người vay vượt qua khó khăn thay vì bỏ trốn.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Dịch vụ huy động vốn của ngân hàng là", "options": ["A. nhận tiền gửi tiết kiệm của khách hàng.", "B. cho khách hàng vay tiền.", "C. chuyển tiền cho khách.", "D. phát hành thẻ."], "answer": "A", "explain": "Huy động vốn là nhận tiền gửi (tiết kiệm có kì hạn, không kì hạn) của khách hàng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tiết kiệm có kì hạn khác tiết kiệm không kì hạn ở điểm", "options": ["A. lãi suất cao hơn nhưng chỉ được rút khi đến hạn.", "B. lãi suất thấp hơn.", "C. không được hưởng lãi.", "D. không khác gì nhau."], "answer": "A", "explain": "Tiết kiệm có kì hạn lãi suất cao hơn nhưng phải để đủ kì hạn; rút trước hạn thường hưởng lãi không kì hạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người có khoản tiền nhàn rỗi chắc chắn không dùng đến trong 12 tháng nên", "options": ["A. gửi tiết kiệm có kì hạn 12 tháng để hưởng lãi cao.", "B. giữ tiền mặt ở nhà.", "C. gửi không kì hạn.", "D. cho vay nặng lãi."], "answer": "A", "explain": "Tiền nhàn rỗi dài hạn nên gửi có kì hạn tương ứng để hưởng lãi suất cao hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người cần tiền linh hoạt để chi tiêu hằng ngày nên", "options": ["A. gửi không kì hạn hoặc để trong tài khoản thanh toán.", "B. gửi có kì hạn 36 tháng.", "C. mua trái phiếu dài hạn.", "D. cho người lạ vay."], "answer": "A", "explain": "Nhu cầu linh hoạt hằng ngày thì dùng tài khoản thanh toán, tiết kiệm không kì hạn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bà Mai gửi 200 triệu đồng kì hạn 12 tháng, lãi suất 6 phần trăm một năm. Nếu rút đúng hạn, bà nhận được tiền lãi là", "options": ["A. 12 triệu đồng.", "B. 200 triệu đồng.", "C. 212 triệu đồng.", "D. 6 triệu đồng."], "answer": "A", "explain": "Tiền lãi = 200 × 6 phần trăm = 12 triệu đồng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ông Ba gửi 200 triệu đồng kì hạn 12 tháng lãi suất 6 phần trăm nhưng rút sau 6 tháng, chỉ hưởng lãi không kì hạn 1 phần trăm một năm. Tiền lãi ông nhận khoảng", "options": ["A. 1 triệu đồng.", "B. 12 triệu đồng.", "C. 6 triệu đồng.", "D. 200 triệu đồng."], "answer": "A", "explain": "Lãi = 200 × 1 phần trăm × (6/12) = 1 triệu đồng. Rút trước hạn bị mất lãi suất cao.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Huy động vốn là nhận tiền gửi của khách hàng.", "b) Tiết kiệm có kì hạn lãi suất cao hơn không kì hạn.", "c) Rút trước hạn thường chỉ hưởng lãi không kì hạn.", "d) Mọi loại tiền gửi đều có lãi suất như nhau."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: lãi suất khác nhau theo kì hạn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tiền nhàn rỗi dài hạn nên gửi có kì hạn.", "b) Tiền cần linh hoạt nên để tài khoản thanh toán.", "c) Rút trước hạn làm giảm tiền lãi được hưởng.", "d) Gửi tiết kiệm không có rủi ro gì."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai ở mức tuyệt đối: gửi ngân hàng được cấp phép, có bảo hiểm tiền gửi nên an toàn cao nhưng vẫn cần chọn tổ chức uy tín.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Tiết kiệm ... hạn có lãi suất cao hơn không kì hạn».", "answer": "có kì", "explain": "Tiết kiệm có kì hạn lãi suất cao hơn tiết kiệm không kì hạn.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Gửi 200 triệu đồng, lãi suất 6 phần trăm một năm, sau 12 tháng tiền lãi là bao nhiêu triệu đồng? Viết số.", "answer": "12", "explain": "200 × 6 phần trăm = 12 triệu đồng.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Dịch vụ cho vay của ngân hàng gồm", "options": ["A. vay sản xuất, vay tiêu dùng, vay mua nhà...", "B. chỉ cho vay mua nhà.", "C. chỉ cho doanh nghiệp vay.", "D. không cho cá nhân vay."], "answer": "A", "explain": "Ngân hàng cho vay đa dạng: vay sản xuất kinh doanh, vay tiêu dùng, vay mua nhà, vay học tập...", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vay tiêu dùng là", "options": ["A. vay để mua sắm, phục vụ nhu cầu đời sống.", "B. vay để sản xuất.", "C. vay để kinh doanh.", "D. vay để cho vay lại."], "answer": "A", "explain": "Vay tiêu dùng phục vụ nhu cầu đời sống: mua xe, sửa nhà, du lịch, học tập...", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vay sản xuất kinh doanh khác vay tiêu dùng ở điểm", "options": ["A. vốn vay tạo ra thu nhập để trả nợ; vay tiêu dùng thì không.", "B. không có điểm khác nhau.", "C. vay tiêu dùng lãi suất luôn thấp hơn.", "D. vay sản xuất không phải trả lãi."], "answer": "A", "explain": "Vay sản xuất tạo ra thu nhập từ hoạt động kinh doanh để trả nợ; vay tiêu dùng phải trả từ thu nhập sẵn có nên cần cân nhắc kĩ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người vay 500 triệu đồng để mở quán cà phê, quán có lãi đủ trả nợ. Đây là", "options": ["A. vay sản xuất kinh doanh hiệu quả.", "B. vay tiêu dùng.", "C. lạm dụng tín dụng.", "D. tín dụng đen."], "answer": "A", "explain": "Vay để kinh doanh có lãi, đủ khả năng trả nợ là sử dụng vốn vay hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người thu nhập 10 triệu đồng mỗi tháng, vay tiêu dùng trả góp 8 triệu đồng mỗi tháng. Đánh giá nào đúng?", "options": ["A. Khoản trả quá cao so với thu nhập, rất rủi ro.", "B. Hoàn toàn hợp lí.", "C. Càng vay nhiều càng tốt.", "D. Không cần quan tâm."], "answer": "A", "explain": "Trả góp 8 triệu trên thu nhập 10 triệu là quá sức — dễ vỡ nợ, cần cân nhắc lại.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tắc khi vay tiêu dùng là", "options": ["A. chỉ vay cho nhu cầu thật sự cần thiết và trong khả năng trả nợ.", "B. vay để mua sắm theo sở thích bất chấp khả năng.", "C. vay càng nhiều càng tốt.", "D. không cần tính toán."], "answer": "A", "explain": "Vay tiêu dùng không tạo ra thu nhập nên chỉ vay cho nhu cầu thật sự cần thiết và trong khả năng trả nợ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ngân hàng cho vay đa dạng mục đích.", "b) Vay tiêu dùng phục vụ nhu cầu đời sống.", "c) Vay sản xuất tạo thu nhập để trả nợ.", "d) Vay tiêu dùng không cần tính khả năng trả nợ."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: vay tiêu dùng càng cần tính kĩ khả năng trả nợ.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vay sản xuất hiệu quả khi kinh doanh có lãi.", "b) Vay tiêu dùng vượt khả năng rất rủi ro.", "c) Chỉ nên vay tiêu dùng cho nhu cầu thật cần thiết.", "d) Vay để mua sắm hoang phí là thông minh."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: mua sắm hoang phí bằng vốn vay dễ dẫn đến nợ nần.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Vay ... dùng phục vụ nhu cầu đời sống như mua xe, sửa nhà».", "answer": "tiêu", "explain": "Vay tiêu dùng phục vụ nhu cầu đời sống.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vay để mở quán cà phê có lãi đủ trả nợ thuộc loại vay sản xuất kinh ... Điền từ còn thiếu.", "answer": "doanh", "explain": "Vay sản xuất kinh doanh: vốn vay tạo ra thu nhập để trả nợ.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Thẻ ghi nợ khác thẻ tín dụng ở điểm", "options": ["A. thẻ ghi nợ chi tiêu bằng tiền có sẵn trong tài khoản.", "B. không có điểm khác nhau.", "C. thẻ ghi nợ được chi tiêu trước trả sau.", "D. thẻ tín dụng dùng tiền có sẵn."], "answer": "A", "explain": "Thẻ ghi nợ chi tiêu trong số tiền có sẵn trong tài khoản; thẻ tín dụng chi tiêu trước trong hạn mức rồi trả sau.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi quẹt thẻ ghi nợ để thanh toán, tiền được trừ từ", "options": ["A. tài khoản của chủ thẻ.", "B. túi tiền của ngân hàng.", "C. tài khoản của người bán.", "D. không trừ ở đâu."], "answer": "A", "explain": "Thẻ ghi nợ trừ trực tiếp tiền trong tài khoản của chủ thẻ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một học sinh được bố mẹ mở thẻ phụ ghi nợ với hạn mức chi tiêu hằng tháng. Đây là cách", "options": ["A. tập quản lí chi tiêu an toàn vì không thể chi quá số tiền có.", "B. vay nợ ngân hàng.", "C. chi tiêu không kiểm soát.", "D. trốn tránh trách nhiệm."], "answer": "A", "explain": "Thẻ ghi nợ chỉ chi được trong số tiền có sẵn nên an toàn, phù hợp để học sinh tập quản lí chi tiêu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ưu điểm của thanh toán bằng thẻ so với tiền mặt là", "options": ["A. không cần mang nhiều tiền mặt, dễ kiểm soát chi tiêu.", "B. chi tiêu không giới hạn.", "C. không bao giờ mất tiền.", "D. được miễn mọi loại phí."], "answer": "A", "explain": "Thanh toán thẻ an toàn hơn mang tiền mặt, lịch sử giao dịch giúp kiểm soát chi tiêu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn Linh quẹt thẻ tín dụng mua điện thoại 12 triệu đồng trong khi thu nhập chỉ 5 triệu đồng mỗi tháng và không có kế hoạch trả nợ. Đây là", "options": ["A. chi tiêu vượt khả năng, dễ rơi vào nợ thẻ.", "B. sử dụng thẻ thông minh.", "C. không có rủi ro.", "D. được ngân hàng khuyến khích."], "answer": "A", "explain": "Chi tiêu bằng thẻ tín dụng vượt xa khả năng trả nợ dễ dẫn đến nợ lãi cao.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để dùng thẻ an toàn, người dùng KHÔNG nên", "options": ["A. để lộ số thẻ, mã CVV cho người lạ.", "B. đặt mã PIN khó đoán.", "C. kiểm tra sao kê hằng tháng.", "D. khóa thẻ khi bị mất."], "answer": "A", "explain": "Để lộ số thẻ, mã CVV cho người lạ là hành vi mất an toàn, dễ bị chiếm đoạt tiền.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thẻ ghi nợ chi tiêu bằng tiền có sẵn.", "b) Thẻ tín dụng chi tiêu trước, trả sau.", "c) Thanh toán thẻ giúp kiểm soát chi tiêu.", "d) Hai loại thẻ hoàn toàn giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: ghi nợ dùng tiền có sẵn, tín dụng là vay trước trả sau.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Không để lộ số thẻ, mã CVV cho người lạ.", "b) Nên kiểm tra sao kê thẻ hằng tháng.", "c) Mất thẻ cần khóa ngay.", "d) Chi tiêu thẻ vượt khả năng là an toàn."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: chi tiêu vượt khả năng dễ nợ nần.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Thẻ ... chi tiêu bằng tiền có sẵn trong tài khoản».", "answer": "ghi nợ", "explain": "Thẻ ghi nợ chi tiêu bằng tiền có sẵn trong tài khoản của chủ thẻ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Mã số bảo mật in sau thẻ dùng khi thanh toán online gọi là mã ... Điền từ còn thiếu.", "answer": "CVV", "explain": "Mã CVV là mã bảo mật của thẻ, tuyệt đối không để lộ cho người lạ.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Dịch vụ thanh toán của ngân hàng gồm", "options": ["A. chuyển tiền, thu hộ, chi hộ.", "B. cho vay mua nhà.", "C. gửi tiết kiệm.", "D. phát hành cổ phiếu."], "answer": "A", "explain": "Dịch vụ thanh toán: chuyển tiền, thu hộ, chi hộ qua hệ thống ngân hàng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quét mã QR để trả tiền là hình thức", "options": ["A. thanh toán không dùng tiền mặt.", "B. thanh toán bằng tiền mặt.", "C. vay tín dụng đen.", "D. trốn thuế."], "answer": "A", "explain": "Quét mã QR là thanh toán không dùng tiền mặt qua hệ thống ngân hàng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một cửa hàng treo mã QR để khách quét trả tiền. Lợi ích cho cửa hàng là", "options": ["A. nhận tiền nhanh, minh bạch doanh thu.", "B. trốn thuế dễ hơn.", "C. không cần quản lí tiền.", "D. tăng giá bán."], "answer": "A", "explain": "Nhận tiền qua QR nhanh chóng, doanh thu minh bạch qua sao kê.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chuyển tiền qua ứng dụng ngân hàng cần", "options": ["A. kiểm tra kĩ số tài khoản người nhận trước khi xác nhận.", "B. chuyển bừa không cần kiểm tra.", "C. cung cấp mật khẩu cho người lạ.", "D. chuyển cho bất kì ai yêu cầu."], "answer": "A", "explain": "Phải kiểm tra kĩ thông tin người nhận trước khi xác nhận chuyển tiền để tránh chuyển nhầm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Chị Hoa chuyển nhầm 5 triệu đồng cho người lạ. Việc làm đúng là", "options": ["A. liên hệ ngân hàng ngay để được hỗ trợ thu hồi.", "B. bỏ luôn số tiền.", "C. tự tìm đến nhà người lạ đòi.", "D. chuyển thêm để gây chú ý."], "answer": "A", "explain": "Liên hệ ngân hàng ngay để được hỗ trợ thu hồi tiền chuyển nhầm theo quy trình.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một shop online yêu cầu khách chuyển khoản trước cho tài khoản cá nhân lạ, không qua sàn. Rủi ro cho khách là", "options": ["A. có thể bị lừa mất tiền không nhận được hàng.", "B. không có rủi ro gì.", "C. được bảo vệ tuyệt đối.", "D. luôn nhận được hàng tốt."], "answer": "A", "explain": "Chuyển tiền cho tài khoản lạ không qua sàn trung gian rất dễ bị lừa đảo.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quét mã QR là thanh toán không tiền mặt.", "b) Chuyển tiền cần kiểm tra kĩ người nhận.", "c) Chuyển nhầm tiền nên liên hệ ngân hàng.", "d) Nên chuyển tiền cho tài khoản lạ không qua sàn."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: rất dễ bị lừa đảo.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thanh toán không tiền mặt minh bạch doanh thu.", "b) Mua hàng nên qua sàn trung gian để được bảo vệ.", "c) Kiểm tra kĩ trước khi xác nhận chuyển tiền.", "d) Chuyển tiền nhầm thì không thể xử lí."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: liên hệ ngân hàng để được hỗ trợ thu hồi.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Quét mã ... để trả tiền là thanh toán không dùng tiền mặt».", "answer": "QR", "explain": "Quét mã QR để trả tiền là thanh toán không dùng tiền mặt.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Khi chuyển tiền nhầm, cần liên hệ ... để được hỗ trợ thu hồi. Điền từ còn thiếu.", "answer": "ngân hàng", "explain": "Liên hệ ngân hàng ngay khi chuyển tiền nhầm để được hỗ trợ.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Tổ chức tín dụng được cấp phép hoạt động bởi", "options": ["A. Ngân hàng Nhà nước.", "B. Ủy ban nhân dân xã.", "C. nhà trường.", "D. tự cấp phép."], "answer": "A", "explain": "Ngân hàng Nhà nước cấp phép và quản lí hoạt động của các tổ chức tín dụng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dấu hiệu của «tín dụng đen» là", "options": ["A. lãi suất cao bất thường, thủ tục mập mờ.", "B. được cấp phép rõ ràng.", "C. hợp đồng minh bạch.", "D. lãi suất thấp."], "answer": "A", "explain": "Tín dụng đen: lãi suất cao bất thường, không hợp đồng rõ ràng, đe dọa khi đòi nợ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nên chọn tổ chức tín dụng được cấp phép?", "options": ["A. Vì được pháp luật bảo vệ, minh bạch, an toàn.", "B. Vì lãi suất luôn cao nhất.", "C. Vì thủ tục mập mờ.", "D. Vì không cần trả nợ."], "answer": "A", "explain": "Tổ chức được cấp phép hoạt động minh bạch, chịu sự quản lí của Nhà nước, quyền lợi khách hàng được bảo vệ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quảng cáo «vay nhanh 5 phút, không cần giấy tờ, lãi suất thấp» nhưng thực tế lãi cắt cổ là", "options": ["A. thủ đoạn của tín dụng đen.", "B. dịch vụ ngân hàng chính thống.", "C. chính sách của Nhà nước.", "D. không có gì đáng ngại."], "answer": "A", "explain": "Quảng cáo mập mờ, lãi thực tế cắt cổ là thủ đoạn của tín dụng đen.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trên mạng xã hội, nhiều tài khoản rao «cho vay online lãi suất 0 phần trăm». Thực chất đây thường là", "options": ["A. bẫy tín dụng đen với phí, lãi ẩn rất cao.", "B. chính sách nhân đạo.", "C. ngân hàng chính thống.", "D. không có rủi ro."], "answer": "A", "explain": "«Lãi suất 0 phần trăm» thường đi kèm phí, phạt ẩn rất cao — bẫy tín dụng đen online.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người bị tín dụng đen đe dọa khi đòi nợ. Việc làm đúng là", "options": ["A. báo công an để được bảo vệ, xử lí.", "B. im lặng chịu đựng.", "C. vay nơi khác trả cho chúng.", "D. bỏ trốn khỏi địa phương."], "answer": "A", "explain": "Bị đe dọa phải báo công an để được bảo vệ và xử lí theo pháp luật.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tổ chức tín dụng do Ngân hàng Nhà nước cấp phép.", "b) Tín dụng đen có lãi suất cao bất thường.", "c) Nên chọn tổ chức được cấp phép để vay.", "d) «Lãi suất 0 phần trăm» online luôn an toàn."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thường là bẫy với phí, lãi ẩn cao.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tổ chức được cấp phép thì minh bạch, an toàn.", "b) Bị tín dụng đen đe dọa nên báo công an.", "c) Quảng cáo vay mập mờ cần cảnh giác.", "d) Vay tín dụng đen không có rủi ro."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: tín dụng đen rất nguy hiểm.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Ngân hàng ... cấp phép hoạt động cho các tổ chức tín dụng».", "answer": "Nhà nước", "explain": "Ngân hàng Nhà nước cấp phép và quản lí các tổ chức tín dụng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Bị tín dụng đen đe dọa khi đòi nợ thì cần báo ... Điền từ còn thiếu.", "answer": "công an", "explain": "Báo công an để được bảo vệ và xử lí tín dụng đen theo pháp luật.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Hợp đồng tín dụng là", "options": ["A. văn bản thỏa thuận giữa bên vay và bên cho vay.", "B. tờ rơi quảng cáo.", "C. tin nhắn chào mời.", "D. lời hứa miệng."], "answer": "A", "explain": "Hợp đồng tín dụng là văn bản thỏa thuận ghi rõ số tiền vay, lãi suất, thời hạn, quyền và nghĩa vụ các bên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nội dung quan trọng nhất trong hợp đồng tín dụng là", "options": ["A. số tiền vay, lãi suất, thời hạn, phí phạt.", "B. màu sắc của hợp đồng.", "C. chữ kí đẹp hay xấu.", "D. số trang của hợp đồng."], "answer": "A", "explain": "Phải nắm rõ số tiền vay, lãi suất, thời hạn trả, phí phạt trả chậm trước khi kí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phí phạt trả chậm trong hợp đồng tín dụng là", "options": ["A. khoản tiền phạt khi trả nợ trễ hạn.", "B. tiền thưởng trả sớm.", "C. tiền lãi hằng tháng.", "D. tiền gốc vay."], "answer": "A", "explain": "Trả nợ trễ hạn bị phạt theo điều khoản hợp đồng — cần đọc kĩ trước khi kí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người kí hợp đồng vay mà không đọc kĩ, sau đó bị tính phí cao bất ngờ. Bài học là", "options": ["A. phải đọc kĩ mọi điều khoản trước khi kí.", "B. không cần đọc hợp đồng.", "C. kí càng nhanh càng tốt.", "D. hợp đồng không quan trọng."], "answer": "A", "explain": "Phải đọc kĩ, hỏi rõ mọi điều khoản, nhất là lãi suất, phí phạt trước khi kí hợp đồng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hợp đồng ghi «lãi suất 2 phần trăm một tháng». Lãi suất một năm tương đương khoảng", "options": ["A. 24 phần trăm.", "B. 2 phần trăm.", "C. 12 phần trăm.", "D. 36 phần trăm."], "answer": "A", "explain": "2 phần trăm × 12 tháng = 24 phần trăm một năm — cách quy đổi để so sánh các gói vay.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khi so sánh hai gói vay, yếu tố quyết định nhất là", "options": ["A. tổng chi phí vay (lãi và phí) trong suốt thời gian vay.", "B. quảng cáo đẹp hay xấu.", "C. trụ sở ngân hàng to hay nhỏ.", "D. nhân viên nhiệt tình hay không."], "answer": "A", "explain": "So sánh tổng chi phí vay thực tế (lãi suất, phí) mới biết gói nào rẻ hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hợp đồng tín dụng ghi rõ lãi suất, thời hạn.", "b) Phải đọc kĩ hợp đồng trước khi kí.", "c) Trả chậm bị phạt theo hợp đồng.", "d) Kí hợp đồng không cần đọc."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: phải đọc kĩ trước khi kí.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lãi 2 phần trăm một tháng tương đương 24 phần trăm một năm.", "b) So sánh tổng chi phí để chọn gói vay tốt.", "c) Điều khoản ẩn có thể gây rủi ro.", "d) Quảng cáo đẹp thì gói vay tốt."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: phải so sánh chi phí thực tế.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «... đồng tín dụng là văn bản thỏa thuận giữa bên vay và bên cho vay».", "answer": "Hợp", "explain": "Hợp đồng tín dụng là văn bản thỏa thuận giữa bên vay và bên cho vay.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Lãi suất 2 phần trăm một tháng tương đương khoảng bao nhiêu phần trăm một năm? Viết số.", "answer": "24", "explain": "2 × 12 = 24 phần trăm một năm.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Sử dụng dịch vụ tín dụng một cách thông minh giúp", "options": ["A. tận dụng vốn hiệu quả, cải thiện đời sống.", "B. rơi vào nợ nần.", "C. mất uy tín.", "D. vi phạm pháp luật."], "answer": "A", "explain": "Dùng đúng cách, dịch vụ tín dụng là công cụ tài chính hữu ích giúp tận dụng vốn, cải thiện đời sống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thông điệp chính khi sử dụng dịch vụ tín dụng là", "options": ["A. hiểu rõ, so sánh, tính toán và chọn tổ chức chính thống.", "B. vay bừa không cần nghĩ.", "C. chọn nơi cho vay nhanh nhất.", "D. không cần đọc hợp đồng."], "answer": "A", "explain": "Hiểu rõ nhu cầu, so sánh, đọc kĩ hợp đồng, tính khả năng trả nợ, chọn tổ chức được cấp phép.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một gia đình muốn vay mua nhà. Các bước đúng theo thứ tự là", "options": ["A. Xác định nhu cầu – so sánh ngân hàng – đọc kĩ hợp đồng – tính khả năng trả nợ.", "B. Vay ngay – tính sau.", "C. Chọn nơi lãi cao nhất.", "D. Nhờ người lạ vay hộ."], "answer": "A", "explain": "Đúng quy trình 5 bước: nhu cầu, so sánh, đọc kĩ, tính toán, chọn tổ chức chính thống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dịch vụ tín dụng tốt là", "options": ["A. người bạn đồng hành khi dùng đúng cách.", "B. gánh nặng không thể tránh.", "C. cái bẫy nguy hiểm.", "D. không cần thiết."], "answer": "A", "explain": "Dùng đúng cách, dịch vụ tín dụng là người bạn đồng hành giúp phát triển; dùng sai thành gánh nặng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn An muốn mở tài khoản ngân hàng đầu tiên. Lời khuyên đúng là", "options": ["A. chọn ngân hàng uy tín, tìm hiểu phí, bảo mật thông tin.", "B. mở ở nơi không rõ nguồn gốc.", "C. cung cấp mật khẩu cho bạn bè.", "D. không cần tìm hiểu gì."], "answer": "A", "explain": "Chọn ngân hàng uy tín được cấp phép, tìm hiểu phí dịch vụ và bảo mật thông tin cá nhân.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong thời đại số, người dùng dịch vụ tín dụng cần đặc biệt cảnh giác với", "options": ["A. lừa đảo qua mạng, link lạ, cuộc gọi giả danh.", "B. ngân hàng chính thống.", "C. hợp đồng minh bạch.", "D. lãi suất thấp."], "answer": "A", "explain": "Tội phạm công nghệ cao giả danh ngân hàng, công an để lừa đảo — cần cảnh giác cao độ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dùng đúng cách, tín dụng là công cụ hữu ích.", "b) Cần so sánh, tính toán trước khi vay.", "c) Nên chọn tổ chức tín dụng chính thống.", "d) Vay bừa không cần nghĩ là thông minh."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: phải cân nhắc kĩ trước khi vay.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mở tài khoản nên chọn ngân hàng uy tín.", "b) Cần bảo mật thông tin tài khoản.", "c) Cảnh giác với lừa đảo qua mạng.", "d) Tin mọi cuộc gọi tự xưng ngân hàng là đúng."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: ngân hàng không yêu cầu thông tin bảo mật qua điện thoại.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Dịch vụ tín dụng tốt là người ... đồng hành khi dùng đúng cách».", "answer": "bạn", "explain": "Dịch vụ tín dụng tốt là người bạn đồng hành khi dùng đúng cách.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Có 5 bước dùng dịch vụ tín dụng hiệu quả. Bước đầu tiên là xác định ... Điền từ còn thiếu.", "answer": "nhu cầu", "explain": "Bước 1: xác định đúng nhu cầu vay.", "points": 0.5}]}]}
