ơ chế thị trường: Tự điều chỉnh – Cạnh tranh – ...».", "answer": "Hiệu quả", "explain": "Ưu điểm: tự điều chỉnh linh hoạt, thúc đẩy cạnh tranh, phân bổ nguồn lực hiệu quả.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Kể 4 nhược điểm của cơ chế thị trường theo mẹo nhớ «Khủng hoảng – Phân hóa – Ô nhiễm – ...». Điền từ còn thiếu.", "answer": "Gian lận", "explain": "Nhược điểm: khủng hoảng kinh tế, phân hóa giàu nghèo, ô nhiễm môi trường, hàng giả gian lận.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Giá cả thị trường do yếu tố nào quyết định chủ yếu?", "options": ["A. Quan hệ cung – cầu.", "B. Ý muốn chủ quan của một người.", "C. Sự ngẫu nhiên.", "D. Màu sắc của hàng hóa."], "answer": "A", "explain": "Giá cả thị trường do quan hệ cung – cầu quyết định.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi cung bằng cầu thì giá cả", "options": ["A. tăng vọt.", "B. giảm sâu.", "C. ổn định ở mức cân bằng.", "D. biến mất."], "answer": "C", "explain": "Khi cung bằng cầu, giá ổn định ở mức cân bằng, thị trường ổn định.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giá thịt lợn tăng cao kích thích nông dân mở rộng chăn nuôi, sau đó nguồn cung dồi dào làm giá giảm xuống. Điều này thể hiện", "options": ["A. giá cả tác động trở lại cung – cầu, thị trường tự điều chỉnh.", "B. giá cả do Nhà nước ấn định cố định.", "C. nông dân không quan tâm đến giá.", "D. thị trường không có khả năng tự điều chỉnh."], "answer": "A", "explain": "Giá tăng kích thích tăng cung, cung tăng làm giá giảm — thị trường tự điều chỉnh về cân bằng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi giá một mặt hàng tăng cao, người tiêu dùng thường", "options": ["A. mua nhiều hơn.", "B. giảm lượng mua hoặc chuyển sang hàng thay thế.", "C. không thay đổi hành vi.", "D. bán hàng ra."], "answer": "B", "explain": "Giá tăng làm giảm sức mua: người tiêu dùng giảm lượng mua hoặc chuyển sang hàng thay thế rẻ hơn — cầu giảm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Dịp Tết, nhu cầu mua đào, quất tăng đột biến trong khi nguồn cung có hạn nên giá tăng cao. Sau Tết, giá giảm mạnh. Quy luật nào đang vận động?", "options": ["A. Cầu vượt cung dịp Tết đẩy giá tăng; sau Tết cầu giảm nên giá giảm.", "B. Giá cả do người bán tự đặt không theo quy luật.", "C. Cung – cầu không ảnh hưởng đến giá.", "D. Nhà nước ấn định giá đào, quất."], "answer": "A", "explain": "Dịp Tết cầu vượt cung nên giá tăng; sau Tết cầu giảm mạnh nên giá giảm — đúng quy luật cung – cầu.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một mặt hàng có giá cân bằng là 50 nghìn đồng. Khi giá bị đẩy lên 80 nghìn đồng, điều gì sẽ xảy ra theo cơ chế thị trường?", "options": ["A. Người bán tăng cung, người mua giảm cầu, giá có xu hướng giảm về cân bằng.", "B. Giá tiếp tục tăng mãi không dừng.", "C. Không ai mua cũng không ai bán.", "D. Thị trường biến mất."], "answer": "A", "explain": "Giá cao hơn mức cân bằng kích thích người bán tăng cung, đồng thời làm người mua giảm cầu — cung vượt cầu kéo giá giảm về mức cân bằng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giá cả tăng kích thích người bán tăng cung.", "b) Giá cả tăng làm người mua giảm cầu.", "c) Thị trường có khả năng tự điều chỉnh về cân bằng.", "d) Cung – cầu và giá cả không tác động lẫn nhau."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: cung – cầu và giá cả tác động qua lại lẫn nhau.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dịp lễ Tết, cầu tăng thường đẩy giá nhiều mặt hàng tăng.", "b) Được mùa làm cung tăng thường kéo giá giảm.", "c) Giá cả ổn định khi cung bằng cầu.", "d) Giá cả biến động là hiện tượng bất thường của thị trường."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: giá cả lên xuống để tự cân bằng cung – cầu là vận động bình thường của cơ chế thị trường.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Giá cả tăng kích thích tăng cung, ... cầu».", "answer": "giảm", "explain": "Giá tăng kích thích người bán tăng cung, đồng thời làm người mua giảm cầu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một shop bán 200 chiếc túi, giá cân bằng là 150 nghìn đồng. Nếu shop tăng giá lên 250 nghìn đồng thì theo quy luật, lượng cầu sẽ thay đổi thế nào? Trả lời: «cầu ...».", "answer": "cầu giảm", "explain": "Giá tăng cao hơn mức cân bằng làm người mua giảm lượng mua — cầu giảm.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Vai trò của Nhà nước trong cơ chế thị trường là", "options": ["A. khắc phục khuyết tật của thị trường, điều tiết vĩ mô.", "B. thay thế hoàn toàn cơ chế thị trường.", "C. để mặc thị trường tự vận động.", "D. trực tiếp ấn định mọi mức giá."], "answer": "A", "explain": "Nhà nước khắc phục nhược điểm của thị trường bằng pháp luật, điều tiết vĩ mô, an sinh xã hội, bảo vệ môi trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biện pháp nào sau đây thể hiện Nhà nước điều tiết thị trường?", "options": ["A. Xử phạt doanh nghiệp bán hàng giả.", "B. Ra lệnh cấm mọi hoạt động mua bán.", "C. Tự mình sản xuất mọi hàng hóa.", "D. Bỏ mặc hàng giả tràn lan."], "answer": "A", "explain": "Xử phạt hàng giả là Nhà nước dùng pháp luật để làm lành mạnh thị trường — điều tiết thị trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi Nhà nước trợ cấp cho hộ nghèo, cận nghèo, Nhà nước đang", "options": ["A. thực hiện an sinh xã hội, giảm phân hóa giàu nghèo.", "B. can thiệp vào quyền tự do kinh doanh.", "C. làm tăng phân hóa giàu nghèo.", "D. thay thế cơ chế thị trường."], "answer": "A", "explain": "Trợ cấp hộ nghèo là chính sách an sinh xã hội, khắc phục nhược điểm phân hóa giàu nghèo của thị trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Luật Cạnh tranh xử lí hành vi bán phá giá, độc quyền. Điều này cho thấy Nhà nước", "options": ["A. bảo vệ cạnh tranh lành mạnh trên thị trường.", "B. cấm mọi hình thức cạnh tranh.", "C. khuyến khích độc quyền.", "D. không quan tâm đến thị trường."], "answer": "A", "explain": "Luật Cạnh tranh xử lí cạnh tranh không lành mạnh để bảo vệ cạnh tranh lành mạnh — Nhà nước điều tiết thị trường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trước tình trạng giá xăng dầu biến động mạnh ảnh hưởng đời sống, Nhà nước sử dụng quỹ bình ổn giá. Biện pháp này nhằm", "options": ["A. ổn định thị trường, bảo vệ sản xuất và đời sống người dân.", "B. tăng lợi nhuận cho doanh nghiệp xăng dầu.", "C. xóa bỏ cơ chế thị trường.", "D. cấm người dân sử dụng xăng dầu."], "answer": "A", "explain": "Quỹ bình ổn giá giúp ổn định giá xăng dầu, hạn chế tác động tiêu cực của biến động thị trường đến sản xuất và đời sống.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một quốc gia vừa phát huy cơ chế thị trường vừa tăng cường vai trò điều tiết của Nhà nước. Mô hình này được gọi là", "options": ["A. kinh tế thị trường định hướng xã hội chủ nghĩa.", "B. kinh tế kế hoạch hóa tập trung.", "C. kinh tế tự nhiên.", "D. kinh tế bao cấp."], "answer": "A", "explain": "Việt Nam phát triển kinh tế thị trường định hướng xã hội chủ nghĩa: phát huy ưu điểm của thị trường, đồng thời Nhà nước điều tiết, đảm bảo công bằng xã hội.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhà nước cần điều tiết để khắc phục khuyết tật của thị trường.", "b) Pháp luật giúp làm lành mạnh thị trường.", "c) An sinh xã hội giảm phân hóa giàu nghèo.", "d) Nhà nước nên để mặc mọi mặt trái của thị trường."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: Nhà nước phải can thiệp để khắc phục nhược điểm của thị trường.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xử phạt hàng giả là Nhà nước điều tiết thị trường.", "b) Bình ổn giá xăng dầu bảo vệ người tiêu dùng.", "c) Trợ cấp hộ nghèo thể hiện an sinh xã hội.", "d) Điều tiết của Nhà nước làm mất hoàn toàn cơ chế thị trường."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: Nhà nước điều tiết để thị trường vận hành tốt hơn, không xóa bỏ cơ chế thị trường.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Nhà nước ... để khắc phục khuyết tật của thị trường».", "answer": "điều tiết vĩ mô", "explain": "Nhà nước điều tiết vĩ mô: ổn định giá cả, chống độc quyền, chống khủng hoảng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Mô hình kinh tế của Việt Nam hiện nay là kinh tế thị trường định hướng ... Điền từ còn thiếu.", "answer": "xã hội chủ nghĩa", "explain": "Việt Nam phát triển nền kinh tế thị trường định hướng xã hội chủ nghĩa.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Quy luật nào sau đây thuộc cơ chế thị trường?", "options": ["A. Quy luật cung – cầu.", "B. Quy luật rơi tự do.", "C. Quy luật di truyền.", "D. Quy luật tuần hoàn của nước."], "answer": "A", "explain": "Các quy luật kinh tế của cơ chế thị trường gồm quy luật cung – cầu, quy luật giá trị, quy luật cạnh tranh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đặc trưng nổi bật của cơ chế thị trường là", "options": ["A. tính tự điều chỉnh.", "B. mọi thứ do một người ra lệnh.", "C. không có cạnh tranh.", "D. giá cả cố định mãi mãi."], "answer": "A", "explain": "Cơ chế thị trường mang tính tự điều chỉnh: cung, cầu, giá cả, cạnh tranh phối hợp điều tiết mà không cần mệnh lệnh trực tiếp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "«Bàn tay vô hình» điều tiết nền kinh tế thị trường chính là", "options": ["A. cơ chế thị trường tự điều chỉnh qua cung – cầu, giá cả.", "B. mệnh lệnh của một cá nhân.", "C. sự can thiệp tùy tiện.", "D. thiên nhiên quyết định."], "answer": "A", "explain": "«Bàn tay vô hình» là cách nói hình ảnh về cơ chế thị trường tự điều chỉnh thông qua cung – cầu, giá cả, cạnh tranh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong cơ chế thị trường, nguồn lực (vốn, lao động) có xu hướng chảy vào", "options": ["A. nơi sinh lời cao.", "B. nơi thua lỗ nhiều nhất.", "C. nơi không ai cần.", "D. ngẫu nhiên không theo quy luật."], "answer": "A", "explain": "Ưu điểm phân bổ nguồn lực hiệu quả: vốn, lao động chảy vào ngành, nơi sinh lời cao.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Thấy kinh doanh trà sữa sinh lời cao, nhiều người đổ xô mở quán trà sữa khiến thị trường bão hòa, lợi nhuận giảm. Hiện tượng này thể hiện", "options": ["A. nguồn lực tự chảy vào nơi sinh lời cao rồi tự điều chỉnh khi bão hòa.", "B. Nhà nước cấm kinh doanh trà sữa.", "C. người tiêu dùng không thích trà sữa.", "D. cơ chế thị trường không vận động."], "answer": "A", "explain": "Vốn tự chảy vào ngành sinh lời cao (phân bổ nguồn lực), khi bão hòa thì lợi nhuận giảm, thị trường tự điều chỉnh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một doanh nghiệp đầu tư công nghệ mới giúp năng suất tăng gấp đôi, giá thành giảm một nửa, chiếm lĩnh thị trường. Đây là biểu hiện của", "options": ["A. ưu điểm thúc đẩy tiến bộ khoa học – công nghệ của cơ chế thị trường.", "B. nhược điểm gây ô nhiễm của thị trường.", "C. sự can thiệp của Nhà nước.", "D. sự sụp đổ của cơ chế thị trường."], "answer": "A", "explain": "Cạnh tranh thúc đẩy doanh nghiệp đổi mới công nghệ, nâng cao năng suất — ưu điểm của cơ chế thị trường.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cơ chế thị trường có tính tự điều chỉnh.", "b) Quy luật cung – cầu thuộc cơ chế thị trường.", "c) Quy luật cạnh tranh thuộc cơ chế thị trường.", "d) Cơ chế thị trường vận động theo mệnh lệnh hành chính."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: cơ chế thị trường tự điều chỉnh theo quy luật kinh tế, không theo mệnh lệnh hành chính.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vốn có xu hướng chảy vào nơi sinh lời cao.", "b) Cạnh tranh thúc đẩy đổi mới công nghệ.", "c) «Bàn tay vô hình» là cách nói về cơ chế thị trường.", "d) Trong thị trường, nguồn lực phân bổ hoàn toàn ngẫu nhiên."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: nguồn lực phân bổ theo tín hiệu lợi nhuận, giá cả — có quy luật.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «... là cách nói hình ảnh về cơ chế thị trường tự điều chỉnh».", "answer": "Bàn tay vô hình", "explain": "«Bàn tay vô hình» là cách nói hình ảnh về cơ chế thị trường tự điều chỉnh qua cung – cầu, giá cả.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Có 3 quy luật kinh tế được nêu trong bài: quy luật cung – cầu, quy luật giá trị và quy luật ... Điền từ còn thiếu.", "answer": "cạnh tranh", "explain": "Ba quy luật: cung – cầu, giá trị, cạnh tranh.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Khi nói «muốn mua một chiếc xe máy nhưng không có tiền» thì đây", "options": ["A. là cầu về xe máy.", "B. chưa phải là cầu vì thiếu khả năng mua.", "C. là cung về xe máy.", "D. không liên quan đến thị trường."], "answer": "B", "explain": "Cầu đòi hỏi cả «muốn mua» và «có khả năng mua»; thiếu tiền thì chưa phải là cầu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một cửa hàng có 500 chiếc áo muốn bán nhưng chỉ bán được 100 chiếc. Lượng cung của cửa hàng là", "options": ["A. 500 chiếc.", "B. 100 chiếc.", "C. 600 chiếc.", "D. 0 chiếc."], "answer": "A", "explain": "Cung là số lượng hàng người bán muốn bán và có khả năng bán: 500 chiếc. 100 chiếc là lượng bán thực tế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân biệt «lượng cung» và «lượng bán thực tế»: lượng cung là", "options": ["A. lượng hàng người bán muốn và có thể bán.", "B. lượng hàng đã bán được.", "C. lượng hàng bị ế.", "D. lượng hàng nhập kho."], "answer": "A", "explain": "Lượng cung là lượng hàng người bán muốn bán và có khả năng bán; lượng bán thực tế có thể ít hơn nếu cầu thấp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhiều người xếp hàng mua vé xem ca nhạc nhưng vé đã hết. Hiện tượng này cho thấy", "options": ["A. cầu vượt cung.", "B. cung vượt cầu.", "C. cung bằng cầu.", "D. không có cung cầu."], "answer": "A", "explain": "Nhiều người muốn mua (cầu lớn) nhưng vé hết (cung ít) — cầu vượt cung.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một hãng hàng không mở thêm chuyến bay dịp lễ vì dự báo nhu cầu đi lại tăng. Quyết định này dựa trên", "options": ["A. dự báo cầu tăng nên tăng cung.", "B. mệnh lệnh hành chính.", "C. sở thích của phi công.", "D. giá vé cố định."], "answer": "A", "explain": "Dự báo cầu (nhu cầu đi lại) tăng dịp lễ nên hãng tăng cung (thêm chuyến bay) — vận dụng quan hệ cung – cầu.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Chính phủ một nước trợ giá cho nông dân trồng lúa khi giá lúa xuống thấp. Biện pháp này", "options": ["A. là sự điều tiết của Nhà nước để bảo vệ người sản xuất khi thị trường bất lợi.", "B. làm mất hoàn toàn cơ chế thị trường.", "C. khiến nông dân ngừng sản xuất.", "D. không ảnh hưởng gì đến thị trường."], "answer": "A", "explain": "Trợ giá khi giá xuống thấp là Nhà nước điều tiết, bảo vệ người sản xuất trước biến động thị trường — vẫn trong khuôn khổ kinh tế thị trường.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Muốn mua nhưng không có tiền thì chưa phải là cầu.", "b) Muốn bán nhưng không có hàng thì chưa phải là cung.", "c) Cầu bao gồm cả mong muốn và khả năng mua.", "d) Cung bao gồm cả mong muốn và khả năng bán."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng theo định nghĩa cung, cầu trong SGK.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xếp hàng mua vé nhưng hết vé là cầu vượt cung.", "b) Hàng ế ẩm tồn kho là cung vượt cầu.", "c) Dự báo cầu giúp doanh nghiệp điều chỉnh cung.", "d) Cung và cầu không bao giờ thay đổi."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: cung cầu luôn biến động theo mùa vụ, thu nhập, thị hiếu...", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Cầu là số lượng hàng hóa mà người mua muốn mua và có ... mua».", "answer": "khả năng", "explain": "Cầu là số lượng hàng hóa mà người mua muốn mua và có khả năng mua.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một rạp chiếu phim có 300 ghế (cung), 450 người muốn mua vé (cầu). Chênh lệch cầu vượt cung là bao nhiêu người?", "answer": "150", "explain": "Chênh lệch = 450 − 300 = 150 người không mua được vé.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Mặt tích cực của cạnh tranh trên thị trường là", "options": ["A. thúc đẩy đổi mới, nâng cao chất lượng.", "B. loại bỏ hoàn toàn đối thủ.", "C. giữ giá cao mãi mãi.", "D. ngăn cản tiến bộ."], "answer": "A", "explain": "Cạnh tranh lành mạnh thúc đẩy các chủ thể đổi mới, nâng cao chất lượng, hạ giá thành.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mặt tiêu cực của cạnh tranh là", "options": ["A. đổi mới công nghệ.", "B. cạnh tranh không lành mạnh như bán phá giá, hàng giả.", "C. nâng cao chất lượng.", "D. hạ giá thành."], "answer": "B", "explain": "Mặt trái của cạnh tranh là các hành vi không lành mạnh: bán phá giá, hàng giả, gian lận...", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Doanh nghiệp làm hàng nhái thương hiệu nổi tiếng để bán giá rẻ. Đây là", "options": ["A. cạnh tranh lành mạnh.", "B. cạnh tranh không lành mạnh, vi phạm pháp luật.", "C. đổi mới sáng tạo.", "D. quyền tự do kinh doanh."], "answer": "B", "explain": "Làm hàng nhái thương hiệu là cạnh tranh không lành mạnh, xâm phạm sở hữu trí tuệ, vi phạm pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để cạnh tranh lành mạnh, doanh nghiệp nên", "options": ["A. nâng cao chất lượng, cải tiến mẫu mã, phục vụ tốt.", "B. tung tin xấu về đối thủ.", "C. bán phá giá để loại đối thủ.", "D. làm hàng giả giá rẻ."], "answer": "A", "explain": "Cạnh tranh lành mạnh bằng chất lượng, mẫu mã, dịch vụ tốt — được pháp luật bảo vệ và khuyến khích.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai quán cà phê cạnh nhau: quán A nâng cấp không gian, đào tạo nhân viên; quán B thuê người tung tin quán A dùng nguyên liệu bẩn. Hành vi của quán B là", "options": ["A. cạnh tranh lành mạnh.", "B. cạnh tranh không lành mạnh, cần bị xử lí.", "C. quảng cáo hợp pháp.", "D. không ảnh hưởng đến thị trường."], "answer": "B", "explain": "Tung tin sai sự thật về đối thủ là cạnh tranh không lành mạnh, vi phạm pháp luật cạnh tranh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một tập đoàn lớn mua lại toàn bộ đối thủ nhỏ trong ngành rồi tăng giá bán gấp đôi. Nhà nước cần can thiệp vì", "options": ["A. đây là biểu hiện độc quyền gây hại cho người tiêu dùng và thị trường.", "B. tập đoàn có quyền tăng giá tùy ý.", "C. người tiêu dùng luôn được lợi khi độc quyền.", "D. thị trường không cần cạnh tranh."], "answer": "A", "explain": "Thâu tóm để độc quyền rồi tăng giá gây hại cho người tiêu dùng — Nhà nước phải chống độc quyền, bảo vệ cạnh tranh.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cạnh tranh lành mạnh thúc đẩy đổi mới.", "b) Bán phá giá là cạnh tranh không lành mạnh.", "c) Làm hàng giả là vi phạm pháp luật.", "d) Mọi hành vi cạnh tranh đều được khuyến khích."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: chỉ cạnh tranh lành mạnh được khuyến khích; cạnh tranh không lành mạnh bị xử lí.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tung tin xấu về đối thủ là cạnh tranh không lành mạnh.", "b) Nâng cao chất lượng là cách cạnh tranh lành mạnh.", "c) Độc quyền tăng giá gây hại cho người tiêu dùng.", "d) Nhà nước không cần can thiệp vào cạnh tranh."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: Nhà nước phải bảo vệ cạnh tranh lành mạnh, chống độc quyền.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «... lành mạnh thúc đẩy đổi mới, nâng cao chất lượng».", "answer": "Cạnh tranh", "explain": "Cạnh tranh lành mạnh thúc đẩy đổi mới, nâng cao chất lượng, hạ giá thành.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một doanh nghiệp bán phá giá 3 tháng để loại đối thủ. Theo pháp luật cạnh tranh, đây là hành vi cạnh tranh ... Điền từ còn thiếu.", "answer": "không lành mạnh", "explain": "Bán phá giá để loại bỏ đối thủ là cạnh tranh không lành mạnh, bị pháp luật xử lí.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Khủng hoảng kinh tế trong cơ chế thị trường thường biểu hiện ở", "options": ["A. sản xuất thừa, thất nghiệp gia tăng.", "B. mọi người đều giàu có.", "C. hàng hóa luôn khan hiếm.", "D. giá cả ổn định tuyệt đối."], "answer": "A", "explain": "Khủng hoảng thừa: hàng hóa ế ẩm, doanh nghiệp phá sản, công nhân mất việc — nhược điểm của cơ chế thị trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phân hóa giàu – nghèo trong cơ chế thị trường là do", "options": ["A. người giàu luôn may mắn hơn.", "B. cạnh tranh làm kẻ mạnh thắng thế, người yếu bị đào thải.", "C. Nhà nước chia tiền không đều.", "D. người nghèo không muốn làm giàu."], "answer": "B", "explain": "Cạnh tranh khốc liệt làm kẻ mạnh ngày càng mạnh, người yếu bị đào thải — dẫn đến phân hóa giàu nghèo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói cơ chế thị trường không tự giải quyết được vấn đề xã hội?", "options": ["A. Vì thị trường chỉ quan tâm lợi nhuận, bỏ qua người nghèo, vùng khó khăn.", "B. Vì thị trường quá quan tâm đến người nghèo.", "C. Vì Nhà nước cấm thị trường làm từ thiện.", "D. Vì người nghèo không tham gia thị trường."], "answer": "A", "explain": "Thị trường vận động vì lợi nhuận nên không tự đầu tư vào lĩnh vực ít sinh lời như giáo dục, y tế cho người nghèo — cần Nhà nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Doanh nghiệp tư nhân ít đầu tư vào vùng sâu, vùng xa vì", "options": ["A. lợi nhuận thấp, rủi ro cao.", "B. bị pháp luật cấm.", "C. không có người lao động.", "D. người dân không có nhu cầu."], "answer": "A", "explain": "Vùng sâu xa lợi nhuận thấp, rủi ro cao nên tư nhân ít đầu tư — Nhà nước phải có chính sách ưu đãi, đầu tư công.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Để giảm phân hóa giàu nghèo do thị trường gây ra, Nhà nước có thể", "options": ["A. đánh thuế thu nhập cao với người giàu, trợ cấp cho người nghèo.", "B. bỏ mặc người nghèo.", "C. cấm người giàu kinh doanh.", "D. chia đều tài sản của mọi người."], "answer": "A", "explain": "Thuế lũy tiến với người giàu và an sinh xã hội cho người nghèo là cách điều tiết, giảm phân hóa giàu nghèo.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một khu công nghiệp gây ô nhiễm nặng nhưng tạo nhiều việc làm. Để phát triển bền vững, Nhà nước cần", "options": ["A. yêu cầu doanh nghiệp xử lí ô nhiễm, đồng thời hỗ trợ việc làm.", "B. đóng cửa ngay khu công nghiệp, bỏ mặc công nhân.", "C. cho phép ô nhiễm để giữ việc làm.", "D. di dời toàn bộ dân cư đi nơi khác."], "answer": "A", "explain": "Phát triển bền vững: vừa bảo vệ môi trường (xử lí ô nhiễm) vừa đảm bảo việc làm, sinh kế — vai trò điều tiết hài hòa của Nhà nước.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Khủng hoảng thừa là nhược điểm của cơ chế thị trường.", "b) Thị trường làm phân hóa giàu – nghèo.", "c) Thị trường tự đầu tư tốt vào vùng sâu, vùng xa.", "d) Nhà nước cần chính sách để giảm bất bình đẳng."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: tư nhân ít đầu tư vào nơi lợi nhuận thấp nên cần Nhà nước.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thuế lũy tiến góp phần giảm phân hóa giàu nghèo.", "b) An sinh xã hội là trách nhiệm của Nhà nước.", "c) Phát triển bền vững cần hài hòa kinh tế và môi trường.", "d) Vì lợi nhuận, thị trường tự bảo vệ môi trường tốt."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: chạy theo lợi nhuận dễ gây ô nhiễm nên cần Nhà nước quản lí.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Khủng hoảng ..., thất nghiệp gia tăng là biểu hiện của khủng hoảng kinh tế».", "answer": "thừa", "explain": "Khủng hoảng thừa: hàng hóa ế ẩm, doanh nghiệp phá sản, thất nghiệp gia tăng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Để vừa phát triển kinh tế vừa bảo vệ môi trường, Nhà nước hướng tới mục tiêu phát triển ... Điền từ còn thiếu.", "answer": "bền vững", "explain": "Phát triển bền vững: hài hòa tăng trưởng kinh tế, công bằng xã hội và bảo vệ môi trường.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Tín hiệu nào giúp người sản xuất điều chỉnh sản xuất trong cơ chế thị trường?", "options": ["A. Giá cả và nhu cầu thị trường.", "B. Màu sắc yêu thích của giám đốc.", "C. Thời tiết hôm qua.", "D. Tin đồn không kiểm chứng."], "answer": "A", "explain": "Giá cả và nhu cầu thị trường là tín hiệu giúp người sản xuất biết nên sản xuất cái gì, bao nhiêu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong cơ chế thị trường, ai là người ra quyết định sản xuất cái gì?", "options": ["A. Chủ thể sản xuất dựa trên tín hiệu thị trường.", "B. Một người duy nhất ra lệnh cho tất cả.", "C. Không ai ra quyết định.", "D. Thiên nhiên quyết định."], "answer": "A", "explain": "Chủ thể sản xuất tự ra quyết định dựa trên tín hiệu giá cả, nhu cầu thị trường — không có mệnh lệnh hành chính trực tiếp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một nông dân thấy giá cà phê tăng liên tục 3 năm nên mở rộng diện tích trồng. Đây là", "options": ["A. phản ứng hợp lí trước tín hiệu giá của thị trường.", "B. hành vi vi phạm pháp luật.", "C. sự can thiệp của Nhà nước.", "D. hiện tượng ngẫu nhiên."], "answer": "A", "explain": "Giá tăng là tín hiệu thị trường báo nhu cầu cao, nông dân mở rộng sản xuất là phản ứng hợp lí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Rủi ro của việc «chạy theo» tín hiệu giá một cách mù quáng là", "options": ["A. có thể dẫn đến cung vượt cầu, giá rớt khi thu hoạch.", "B. luôn đảm bảo lợi nhuận cao.", "C. không bao giờ bị thua lỗ.", "D. được Nhà nước bao tiêu mọi rủi ro."], "answer": "A", "explain": "Nhiều người cùng chạy theo giá cao dễ gây cung vượt cầu, giá rớt mạnh khi thu hoạch — bài học «được mùa mất giá».", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bài học «giải cứu nông sản» mỗi khi được mùa mất giá cho thấy người sản xuất cần", "options": ["A. nắm thông tin thị trường, liên kết tiêu thụ, tránh chạy theo phong trào.", "B. ngừng sản xuất nông nghiệp.", "C. chỉ trồng một loại cây duy nhất.", "D. chờ Nhà nước mua hết nông sản."], "answer": "A", "explain": "Nắm thông tin, liên kết sản xuất – tiêu thụ, đa dạng cây trồng giúp tránh «được mùa mất giá».", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hợp đồng bao tiêu nông sản giữa doanh nghiệp và nông dân giúp", "options": ["A. ổn định đầu ra, giảm rủi ro biến động giá cho nông dân.", "B. xóa bỏ hoàn toàn cơ chế thị trường.", "C. làm giá nông sản tăng mãi.", "D. khiến nông dân phụ thuộc vĩnh viễn."], "answer": "A", "explain": "Hợp đồng bao tiêu giúp nông dân yên tâm sản xuất, giảm rủi ro giá cả — là liên kết sản xuất – tiêu thụ lành mạnh trong cơ chế thị trường.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giá cả là tín hiệu giúp điều chỉnh sản xuất.", "b) Chủ thể sản xuất tự ra quyết định kinh doanh.", "c) Chạy theo giá mù quáng dễ gây «được mùa mất giá».", "d) Mọi quyết định sản xuất đều do Nhà nước ra lệnh."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: trong cơ chế thị trường, chủ thể sản xuất tự quyết định.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nắm thông tin thị trường giúp giảm rủi ro kinh doanh.", "b) Hợp đồng bao tiêu giúp ổn định đầu ra nông sản.", "c) Liên kết sản xuất – tiêu thụ là cần thiết.", "d) Nông dân nên trồng theo phong trào đám đông."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: chạy theo phong trào dễ gây cung vượt cầu, mất giá.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «... và nhu cầu thị trường là tín hiệu giúp điều chỉnh sản xuất».", "answer": "Giá cả", "explain": "Giá cả và nhu cầu thị trường là tín hiệu giúp người sản xuất điều chỉnh sản xuất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hiện tượng nông sản được mùa nhưng giá rớt mạnh được gọi là «được mùa ...». Điền từ còn thiếu.", "answer": "mất giá", "explain": "«Được mùa mất giá»: cung vượt cầu khi thu hoạch đồng loạt làm giá rớt mạnh.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Mô hình «kinh tế thị trường định hướng xã hội chủ nghĩa» ở Việt Nam có nghĩa là", "options": ["A. phát huy thị trường, Nhà nước điều tiết đảm bảo công bằng xã hội.", "B. xóa bỏ hoàn toàn thị trường.", "C. Nhà nước làm thay mọi việc của thị trường.", "D. thị trường vận động không cần pháp luật."], "answer": "A", "explain": "Vừa phát huy ưu điểm của cơ chế thị trường, vừa tăng cường vai trò điều tiết của Nhà nước để đảm bảo công bằng xã hội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong mô hình của Việt Nam, thành phần kinh tế nào giữ vai trò chủ đạo?", "options": ["A. Kinh tế nhà nước.", "B. Kinh tế tư nhân.", "C. Kinh tế có vốn đầu tư nước ngoài.", "D. Kinh tế tập thể."], "answer": "A", "explain": "Kinh tế nhà nước giữ vai trò chủ đạo trong nền kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc Nhà nước đầu tư xây dựng đường cao tốc, cầu cống ở vùng khó khăn thể hiện", "options": ["A. vai trò điều tiết, tạo điều kiện phát triển mà thị trường không tự làm.", "B. sự thay thế hoàn toàn doanh nghiệp tư nhân.", "C. lãng phí ngân sách.", "D. can thiệp bừa bãi vào thị trường."], "answer": "A", "explain": "Đầu tư công vào hạ tầng vùng khó khăn là việc thị trường (vì lợi nhuận) không tự làm — cần vai trò của Nhà nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chính sách miễn giảm thuế cho doanh nghiệp đầu tư vào vùng khó khăn nhằm", "options": ["A. khuyến khích đầu tư, thu hẹp chênh lệch vùng miền.", "B. tăng thu ngân sách ngay lập tức.", "C. hạn chế phát triển vùng khó khăn.", "D. xóa bỏ cơ chế thị trường."], "answer": "A", "explain": "Ưu đãi thuế khuyến khích doanh nghiệp đầu tư vào vùng khó khăn, góp phần thu hẹp chênh lệch phát triển.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một địa phương vừa thu hút doanh nghiệp đầu tư khu công nghiệp, vừa yêu cầu doanh nghiệp cam kết xử lí chất thải và tuyển lao động địa phương. Cách làm này thể hiện", "options": ["A. kết hợp phát huy thị trường với điều tiết của Nhà nước vì phát triển bền vững.", "B. ngăn cản doanh nghiệp đầu tư.", "C. buông lỏng quản lí thị trường.", "D. chỉ quan tâm đến lợi nhuận."], "answer": "A", "explain": "Thu hút đầu tư (phát huy thị trường) đi kèm yêu cầu môi trường, việc làm (điều tiết của Nhà nước) — đúng định hướng phát triển bền vững.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để nền kinh tế vừa năng động vừa công bằng, cần", "options": ["A. phát huy ưu điểm của thị trường, đồng thời Nhà nước khắc phục khuyết tật của nó.", "B. xóa bỏ thị trường, quay về bao cấp.", "C. để thị trường tự do tuyệt đối không cần Nhà nước.", "D. Nhà nước làm thay mọi hoạt động kinh tế."], "answer": "A", "explain": "Đó chính là bản chất của kinh tế thị trường định hướng xã hội chủ nghĩa: kết hợp sức mạnh của thị trường với vai trò điều tiết của Nhà nước.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Việt Nam phát triển kinh tế thị trường định hướng xã hội chủ nghĩa.", "b) Kinh tế nhà nước giữ vai trò chủ đạo.", "c) Nhà nước điều tiết để đảm bảo công bằng xã hội.", "d) Việt Nam đã xóa bỏ hoàn toàn cơ chế thị trường."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: Việt Nam phát huy cơ chế thị trường, không xóa bỏ nó.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ưu đãi thuế vùng khó khăn thu hẹp chênh lệch vùng miền.", "b) Đầu tư công vào hạ tầng là vai trò của Nhà nước.", "c) Phát triển bền vững cần hài hòa kinh tế – xã hội – môi trường.", "d) Thị trường tự giải quyết được mọi vấn đề nên không cần Nhà nước."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thị trường có khuyết tật nên luôn cần vai trò điều tiết của Nhà nước.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Kinh tế ... giữ vai trò chủ đạo trong nền kinh tế Việt Nam».", "answer": "nhà nước", "explain": "Kinh tế nhà nước giữ vai trò chủ đạo trong nền kinh tế thị trường định hướng xã hội chủ nghĩa.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Việt Nam phát triển nền «kinh tế thị trường định hướng xã hội chủ nghĩa» từ Đại hội Đảng lần thứ mấy? Trả lời bằng số La Mã hoặc số thường.", "answer": "6", "explain": "Đường lối đổi mới, phát triển kinh tế thị trường định hướng xã hội chủ nghĩa được khởi xướng từ Đại hội Đảng lần thứ VI (1986).", "points": 0.5}]}]}
