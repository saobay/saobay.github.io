{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Nền kinh tế gồm bao nhiêu chủ thể cơ bản?", "options": ["A. 2 chủ thể.", "B. 3 chủ thể.", "C. 4 chủ thể.", "D. 5 chủ thể."], "answer": "C", "explain": "Nền kinh tế gồm 4 chủ thể cơ bản: chủ thể sản xuất, chủ thể tiêu dùng, chủ thể trung gian và Nhà nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chủ thể nào trực tiếp tạo ra hàng hóa, dịch vụ cho xã hội?", "options": ["A. Chủ thể sản xuất.", "B. Chủ thể tiêu dùng.", "C. Chủ thể trung gian.", "D. Nhà nước."], "answer": "A", "explain": "Chủ thể sản xuất là những người trực tiếp tạo ra hàng hóa, dịch vụ (nông dân, công nhân, doanh nghiệp sản xuất...).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Anh Kiên làm nghề môi giới bất động sản, kết nối người cần bán nhà với người cần mua nhà để hưởng hoa hồng. Anh Kiên thuộc chủ thể nào?", "options": ["A. Chủ thể sản xuất.", "B. Chủ thể tiêu dùng.", "C. Chủ thể trung gian.", "D. Nhà nước."], "answer": "C", "explain": "Môi giới kết nối bên bán với bên mua, không trực tiếp tạo ra hay tiêu dùng sản phẩm nên thuộc chủ thể trung gian.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận định nào sau đây đúng về chủ thể tiêu dùng?", "options": ["A. Chỉ bao gồm các doanh nghiệp lớn.", "B. Là những người mua và sử dụng hàng hóa, dịch vụ.", "C. Không có vai trò gì với sản xuất.", "D. Là chủ thể quản lí vĩ mô nền kinh tế."], "answer": "B", "explain": "Chủ thể tiêu dùng là những người mua và sử dụng hàng hóa, dịch vụ để thỏa mãn nhu cầu; nhu cầu của họ là động lực thúc đẩy sản xuất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ngân hàng thương mại huy động tiền gửi của người dân rồi cho doanh nghiệp vay để mở rộng sản xuất. Trong ví dụ này, ngân hàng đóng vai trò", "options": ["A. chủ thể sản xuất trực tiếp.", "B. chủ thể tiêu dùng cuối cùng.", "C. chủ thể trung gian kết nối vốn.", "D. cơ quan quản lí vĩ mô."], "answer": "C", "explain": "Ngân hàng kết nối người có vốn nhàn rỗi với người cần vốn, không trực tiếp sản xuất hay tiêu dùng nên là chủ thể trung gian.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khi Nhà nước ban hành quy định về an toàn thực phẩm và xử phạt cơ sở sản xuất dùng hóa chất cấm, Nhà nước đang thực hiện vai trò nào?", "options": ["A. Chủ thể sản xuất hàng hóa.", "B. Chủ thể trung gian phân phối.", "C. Quản lí vĩ mô, bảo vệ người tiêu dùng.", "D. Chủ thể tiêu dùng sản phẩm."], "answer": "C", "explain": "Ban hành quy định và xử phạt là hoạt động quản lí vĩ mô: tạo hành lang pháp lí, bảo vệ quyền lợi người tiêu dùng và điều tiết thị trường.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chủ thể kinh tế là những người, tổ chức tham gia các hoạt động kinh tế.", "b) Nông dân, công nhân thuộc chủ thể sản xuất.", "c) Mọi cá nhân mua hàng để sử dụng đều là chủ thể tiêu dùng.", "d) Nhà nước không phải là chủ thể của nền kinh tế."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: Nhà nước là chủ thể đặc biệt của nền kinh tế, thực hiện quản lí vĩ mô.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chủ thể trung gian kết nối người sản xuất với người tiêu dùng.", "b) Sàn thương mại điện tử là một dạng chủ thể trung gian.", "c) Chủ thể sản xuất quyết định số lượng, chất lượng sản phẩm.", "d) Bốn chủ thể kinh tế tồn tại hoàn toàn tách rời nhau."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: bốn chủ thể phối hợp chặt chẽ, tạo nên sự vận động của nền kinh tế.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «... là những người, tổ chức kết nối người sản xuất với người tiêu dùng trong quá trình trao đổi».", "answer": "Chủ thể trung gian", "explain": "Chủ thể trung gian (thương lái, đại lí, sàn giao dịch, ngân hàng...) kết nối người sản xuất với người tiêu dùng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một người vừa là công nhân may trong xưởng (đi làm), vừa mua gạo về nấu cơm cho gia đình. Người này đồng thời thuộc mấy chủ thể kinh tế?", "answer": "2", "explain": "Khi may quần áo, người này thuộc chủ thể sản xuất; khi mua gạo về nấu cơm, thuộc chủ thể tiêu dùng. Vậy đồng thời thuộc 2 chủ thể.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Chủ thể sản xuất có vai trò", "options": ["A. mua và sử dụng hàng hóa, dịch vụ.", "B. kết nối người bán với người mua.", "C. quyết định số lượng, chất lượng sản phẩm cung ứng.", "D. ban hành pháp luật điều tiết thị trường."], "answer": "C", "explain": "Chủ thể sản xuất trực tiếp tạo ra hàng hóa, dịch vụ nên quyết định số lượng, chất lượng và chủng loại sản phẩm cung ứng cho xã hội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ai sau đây thuộc chủ thể sản xuất?", "options": ["A. Người mua vé xem phim.", "B. Thợ mộc đóng bàn ghế.", "C. Nhân viên môi giới nhà đất.", "D. Cán bộ quản lí thị trường."], "answer": "B", "explain": "Thợ mộc đóng bàn ghế trực tiếp tạo ra sản phẩm nên thuộc chủ thể sản xuất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trách nhiệm nào sau đây thuộc về chủ thể sản xuất?", "options": ["A. Mua hàng có nguồn gốc rõ ràng.", "B. Bảo đảm chất lượng, an toàn sản phẩm và bảo vệ môi trường.", "C. Ban hành chính sách thuế.", "D. Kết nối người bán với người mua."], "answer": "B", "explain": "Chủ thể sản xuất phải sản xuất kinh doanh đúng pháp luật, bảo đảm chất lượng sản phẩm, bảo vệ môi trường và nộp thuế đầy đủ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một doanh nghiệp xả thải chưa qua xử lí ra sông gây ô nhiễm. Hành vi này vi phạm trách nhiệm nào của chủ thể sản xuất?", "options": ["A. Trách nhiệm bảo vệ môi trường.", "B. Trách nhiệm mua hàng tiết kiệm.", "C. Trách nhiệm kết nối thị trường.", "D. Trách nhiệm ban hành pháp luật."], "answer": "A", "explain": "Xả thải gây ô nhiễm vi phạm trách nhiệm bảo vệ môi trường của chủ thể sản xuất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Công ty may mặc X quyết định tăng sản lượng áo chống nắng vì dự báo mùa hè nắng nóng kéo dài. Quyết định này thể hiện vai trò nào của chủ thể sản xuất?", "options": ["A. Quyết định số lượng, chủng loại sản phẩm theo nhu cầu thị trường.", "B. Quản lí vĩ mô nền kinh tế.", "C. Kết nối người sản xuất với người tiêu dùng.", "D. Phân phối thu nhập cho xã hội."], "answer": "A", "explain": "Doanh nghiệp chủ động điều chỉnh số lượng, chủng loại sản phẩm theo nhu cầu thị trường — đúng vai trò quyết định cung ứng của chủ thể sản xuất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một hợp tác xã nông nghiệp vừa trồng rau, vừa thu mua rau của nông dân trong vùng để bán cho siêu thị. Hợp tác xã này đồng thời thuộc các chủ thể nào?", "options": ["A. Chỉ thuộc chủ thể sản xuất.", "B. Chủ thể sản xuất và chủ thể trung gian.", "C. Chỉ thuộc chủ thể trung gian.", "D. Chủ thể tiêu dùng và Nhà nước."], "answer": "B", "explain": "Trồng rau là trực tiếp tạo ra sản phẩm (chủ thể sản xuất); thu mua rau của nông dân khác để bán lại là kết nối (chủ thể trung gian).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về chủ thể sản xuất:", "statements": ["a) Chủ thể sản xuất trực tiếp tạo ra hàng hóa, dịch vụ.", "b) Doanh nghiệp sản xuất thuộc chủ thể sản xuất.", "c) Chủ thể sản xuất phải nộp thuế đầy đủ theo quy định.", "d) Chủ thể sản xuất không cần quan tâm đến chất lượng sản phẩm."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: bảo đảm chất lượng, an toàn sản phẩm là trách nhiệm của chủ thể sản xuất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chủ thể sản xuất tạo việc làm và thu nhập cho người lao động.", "b) Nông dân trồng lúa thuộc chủ thể sản xuất.", "c) Chủ thể sản xuất được phép xả thải tùy ý để giảm chi phí.", "d) Sản xuất kinh doanh phải tuân thủ pháp luật."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: chủ thể sản xuất có trách nhiệm bảo vệ môi trường, không được xả thải tùy ý.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Chủ thể sản xuất quyết định ..., chất lượng và chủng loại sản phẩm cung ứng cho xã hội».", "answer": "số lượng", "explain": "Chủ thể sản xuất quyết định số lượng, chất lượng và chủng loại sản phẩm cung ứng cho xã hội.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một xưởng sản xuất có 25 công nhân, mỗi công nhân mỗi ngày làm ra 40 sản phẩm. Trong 26 ngày làm việc, xưởng làm ra bao nhiêu sản phẩm?", "answer": "26000", "explain": "Tổng sản phẩm = 25 × 40 × 26 = 26 000 sản phẩm.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Chủ thể tiêu dùng là những người", "options": ["A. trực tiếp tạo ra hàng hóa.", "B. mua và sử dụng hàng hóa, dịch vụ.", "C. kết nối người bán với người mua.", "D. ban hành pháp luật kinh tế."], "answer": "B", "explain": "Chủ thể tiêu dùng là những người mua và sử dụng hàng hóa, dịch vụ để thỏa mãn nhu cầu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vai trò của chủ thể tiêu dùng đối với sản xuất là", "options": ["A. không có vai trò gì.", "B. là động lực thúc đẩy sản xuất phát triển.", "C. thay thế hoàn toàn sản xuất.", "D. quản lí hoạt động sản xuất."], "answer": "B", "explain": "Nhu cầu tiêu dùng là động lực thúc đẩy sản xuất phát triển; lựa chọn tiêu dùng còn định hướng sản xuất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hành vi nào sau đây thể hiện tiêu dùng có trách nhiệm?", "options": ["A. Mua hàng giả vì giá rẻ.", "B. Mua hàng có nguồn gốc rõ ràng, nói không với hàng kém chất lượng.", "C. Mua sắm vượt quá khả năng chi trả.", "D. Vứt bỏ thực phẩm còn dùng được."], "answer": "B", "explain": "Tiêu dùng có trách nhiệm là mua hàng có nguồn gốc rõ ràng, tẩy chay hàng giả, hàng kém chất lượng, tiết kiệm tránh lãng phí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi người tiêu dùng đồng loạt tẩy chay sản phẩm chứa chất cấm, các doanh nghiệp buộc phải thay đổi công thức sản xuất. Điều này cho thấy", "options": ["A. tiêu dùng định hướng sản xuất.", "B. sản xuất không cần quan tâm người tiêu dùng.", "C. Nhà nước phải cấm mọi sản phẩm.", "D. chủ thể trung gian quyết định tất cả."], "answer": "A", "explain": "Lựa chọn tẩy chay của người tiêu dùng buộc doanh nghiệp thay đổi sản xuất — minh họa tiêu dùng định hướng sản xuất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Chị Hoa luôn đọc kĩ nhãn mác, hạn sử dụng trước khi mua thực phẩm và ưu tiên hàng Việt Nam chất lượng cao. Chị Hoa đang thực hiện trách nhiệm nào của chủ thể tiêu dùng?", "options": ["A. Tiêu dùng văn minh, có trách nhiệm.", "B. Quản lí vĩ mô nền kinh tế.", "C. Kết nối thị trường.", "D. Sản xuất hàng hóa."], "answer": "A", "explain": "Đọc kĩ nhãn mác, chọn hàng có nguồn gốc rõ ràng là biểu hiện tiêu dùng văn minh, có trách nhiệm của chủ thể tiêu dùng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phong trào «Người Việt Nam ưu tiên dùng hàng Việt Nam» tác động đến nền kinh tế theo cơ chế nào?", "options": ["A. Giảm nhu cầu nên làm sản xuất trong nước đình trệ.", "B. Tăng nhu cầu tiêu dùng hàng nội địa, thúc đẩy sản xuất trong nước phát triển.", "C. Thay thế vai trò quản lí của Nhà nước.", "D. Loại bỏ hoàn toàn chủ thể trung gian."], "answer": "B", "explain": "Ưu tiên dùng hàng Việt Nam làm tăng cầu hàng nội địa, từ đó thúc đẩy sản xuất trong nước mở rộng — đúng vai trò động lực của tiêu dùng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về chủ thể tiêu dùng:", "statements": ["a) Mọi cá nhân, hộ gia đình mua hàng để sử dụng đều là chủ thể tiêu dùng.", "b) Nhu cầu tiêu dùng thúc đẩy sản xuất phát triển.", "c) Chủ thể tiêu dùng nên tẩy chay hàng giả, hàng kém chất lượng.", "d) Chủ thể tiêu dùng là người trực tiếp tạo ra sản phẩm."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: trực tiếp tạo ra sản phẩm là chủ thể sản xuất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lựa chọn tiêu dùng của người dân định hướng sản xuất.", "b) Tiêu dùng lãng phí là hành vi đáng khuyến khích.", "c) Người tiêu dùng thông minh góp phần thúc đẩy sản xuất lành mạnh.", "d) Chủ thể tiêu dùng không có trách nhiệm gì với xã hội."], "answer": ["T", "F", "T", "F"], "explain": "a, c đúng. b sai: cần tiêu dùng tiết kiệm, tránh lãng phí. d sai: chủ thể tiêu dùng có trách nhiệm tiêu dùng văn minh, có trách nhiệm.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Nhu cầu tiêu dùng là ... thúc đẩy sản xuất phát triển».", "answer": "động lực", "explain": "Nhu cầu tiêu dùng là động lực thúc đẩy sản xuất phát triển.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Có bao nhiêu chủ thể cơ bản của nền kinh tế mà trong đó con người vừa có thể là người «tạo ra» vừa có thể là người «sử dụng» sản phẩm? Viết số.", "answer": "2", "explain": "Đó là chủ thể sản xuất (tạo ra) và chủ thể tiêu dùng (sử dụng): một người có thể vừa lao động sản xuất vừa mua hàng tiêu dùng.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Chủ thể trung gian là những người, tổ chức", "options": ["A. trực tiếp tạo ra hàng hóa.", "B. kết nối người sản xuất với người tiêu dùng.", "C. mua hàng về để sử dụng.", "D. ban hành pháp luật."], "answer": "B", "explain": "Chủ thể trung gian kết nối người sản xuất với người tiêu dùng trong quá trình trao đổi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ai sau đây thuộc chủ thể trung gian?", "options": ["A. Nông dân trồng rau.", "B. Người mua rau về ăn.", "C. Thương lái thu mua rau bán cho chợ.", "D. Cán bộ thuế."], "answer": "C", "explain": "Thương lái thu mua rau rồi bán lại, kết nối nông dân với người mua nên thuộc chủ thể trung gian.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vai trò nào sau đây KHÔNG phải của chủ thể trung gian?", "options": ["A. Làm cầu nối đưa hàng hóa đến tay người tiêu dùng.", "B. Cung cấp thông tin thị trường hai chiều.", "C. Trực tiếp tạo ra sản phẩm mới.", "D. Góp phần điều tiết cung – cầu."], "answer": "C", "explain": "Trực tiếp tạo ra sản phẩm là vai trò của chủ thể sản xuất, không phải chủ thể trung gian.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sàn thương mại điện tử giúp shop quảng bá sản phẩm đến khách hàng và giúp khách hàng so sánh giá cả. Điều này thể hiện vai trò nào của chủ thể trung gian?", "options": ["A. Trực tiếp sản xuất hàng hóa.", "B. Cung cấp thông tin thị trường hai chiều.", "C. Ban hành pháp luật.", "D. Tiêu dùng sản phẩm."], "answer": "B", "explain": "Sàn thương mại điện tử cung cấp thông tin cho cả người bán (quảng bá) và người mua (so sánh giá) — đúng vai trò cung cấp thông tin thị trường hai chiều.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đại lí phân phối sữa thu mua từ nhà máy, dự trữ trong kho lạnh rồi giao cho các cửa hàng bán lẻ. Hoạt động «dự trữ trong kho lạnh» của đại lí góp phần", "options": ["A. tạo ra sản phẩm sữa mới.", "B. điều tiết cung – cầu, ổn định nguồn hàng.", "C. quản lí vĩ mô nền kinh tế.", "D. tiêu dùng sản phẩm sữa."], "answer": "B", "explain": "Dự trữ hàng hóa giúp đại lí điều tiết lượng hàng cung ứng theo nhu cầu thị trường, góp phần ổn định cung – cầu.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một ứng dụng gọi xe kết nối tài xế có xe nhàn rỗi với hành khách có nhu cầu đi lại. Mô hình này cho thấy chủ thể trung gian hiện đại", "options": ["A. không cần thiết trong nền kinh tế số.", "B. dùng công nghệ để kết nối cung – cầu hiệu quả hơn.", "C. trực tiếp sản xuất dịch vụ vận tải.", "D. thay thế vai trò của Nhà nước."], "answer": "B", "explain": "Ứng dụng gọi xe là chủ thể trung gian dùng công nghệ để kết nối người có xe với người cần đi lại nhanh chóng, hiệu quả hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về chủ thể trung gian:", "statements": ["a) Đại lí, nhà phân phối thuộc chủ thể trung gian.", "b) Chủ thể trung gian làm cầu nối giữa sản xuất và tiêu dùng.", "c) Ngân hàng là một dạng chủ thể trung gian về vốn.", "d) Chủ thể trung gian trực tiếp tạo ra hàng hóa."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: trực tiếp tạo ra hàng hóa là chủ thể sản xuất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Môi giới bất động sản thuộc chủ thể trung gian.", "b) Chủ thể trung gian giúp hàng hóa đến tay người tiêu dùng thuận tiện hơn.", "c) Mọi hoạt động mua đi bán lại đều thuộc chủ thể trung gian.", "d) Chủ thể trung gian góp phần ổn định giá cả thị trường."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai ở mức tuyệt đối: chủ thể trung gian góp phần điều tiết cung – cầu nhưng không quyết định hoàn toàn giá cả (giá do cung – cầu quyết định).", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Chủ thể trung gian làm ... đưa hàng hóa từ nơi sản xuất đến tay người tiêu dùng».", "answer": "cầu nối", "explain": "Chủ thể trung gian làm cầu nối đưa hàng hóa từ nơi sản xuất đến tay người tiêu dùng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một thương lái mua 500 kg vải thiều giá 20 nghìn đồng mỗi kg rồi bán lại giá 30 nghìn đồng mỗi kg. Số tiền chênh lệch thương lái thu được là bao nhiêu nghìn đồng?", "answer": "5000", "explain": "Chênh lệch mỗi kg = 30 − 20 = 10 nghìn đồng. Tổng = 500 × 10 = 5 000 nghìn đồng.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Nhà nước trong nền kinh tế là chủ thể", "options": ["A. trực tiếp tạo ra mọi hàng hóa.", "B. thực hiện quản lí vĩ mô nền kinh tế.", "C. chỉ tham gia với tư cách người mua hàng.", "D. kết nối người bán với người mua."], "answer": "B", "explain": "Nhà nước là chủ thể đặc biệt, thực hiện chức năng quản lí vĩ mô nền kinh tế.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vai trò nào sau đây thuộc về Nhà nước?", "options": ["A. Trực tiếp may quần áo bán ra thị trường.", "B. Xây dựng và thực thi pháp luật kinh tế.", "C. Mua hàng về sử dụng trong gia đình.", "D. Môi giới mua bán nhà đất."], "answer": "B", "explain": "Xây dựng và thực thi pháp luật, tạo hành lang pháp lí cho hoạt động kinh tế là vai trò của Nhà nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi Nhà nước hỗ trợ người nghèo vay vốn ưu đãi để phát triển sản xuất, Nhà nước đang thực hiện vai trò", "options": ["A. đảm bảo công bằng xã hội.", "B. trực tiếp sản xuất hàng hóa.", "C. kết nối thị trường.", "D. tiêu dùng sản phẩm."], "answer": "A", "explain": "Hỗ trợ người nghèo, thực hiện an sinh xã hội là biểu hiện vai trò đảm bảo công bằng xã hội của Nhà nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc Nhà nước kiểm soát, bình ổn giá xăng dầu thể hiện vai trò", "options": ["A. chủ thể sản xuất xăng dầu.", "B. điều tiết nền kinh tế, ổn định thị trường.", "C. chủ thể trung gian mua bán.", "D. người tiêu dùng lớn nhất."], "answer": "B", "explain": "Bình ổn giá xăng dầu là hoạt động điều tiết vĩ mô nhằm ổn định thị trường, bảo vệ sản xuất và đời sống người dân.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhà nước xử phạt doanh nghiệp bán hàng giả, đồng thời tuyên truyền để người dân không tiếp tay cho hàng giả. Hai hành động này thể hiện vai trò nào của Nhà nước?", "options": ["A. Vừa quản lí, điều tiết thị trường vừa bảo vệ người tiêu dùng.", "B. Trực tiếp tham gia sản xuất hàng hóa.", "C. Thay thế chủ thể trung gian.", "D. Hạn chế quyền tự do kinh doanh hợp pháp."], "answer": "A", "explain": "Xử phạt hàng giả là điều tiết, làm lành mạnh thị trường; tuyên truyền bảo vệ người tiêu dùng — cả hai đều thuộc vai trò quản lí vĩ mô của Nhà nước.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong đợt dịch bệnh, Nhà nước hỗ trợ tiền cho người lao động mất việc làm. Biện pháp này chủ yếu nhằm", "options": ["A. tăng lợi nhuận cho doanh nghiệp.", "B. đảm bảo an sinh xã hội, ổn định đời sống người dân.", "C. thay thế hoạt động của chủ thể trung gian.", "D. trực tiếp tạo ra việc làm mới."], "answer": "B", "explain": "Hỗ trợ người lao động mất việc là chính sách an sinh xã hội, thể hiện vai trò đảm bảo công bằng xã hội và ổn định đời sống của Nhà nước.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về vai trò của Nhà nước:", "statements": ["a) Nhà nước xây dựng pháp luật cho hoạt động kinh tế.", "b) Nhà nước điều tiết nền kinh tế, chống độc quyền.", "c) Nhà nước thực hiện chính sách xóa đói giảm nghèo.", "d) Nhà nước không có vai trò gì trong nền kinh tế thị trường."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: Nhà nước giữ vai trò quản lí vĩ mô, khắc phục khuyết tật của thị trường.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mọi hoạt động kinh tế đều diễn ra trong khuôn khổ pháp luật do Nhà nước quản lí.", "b) Nhà nước định hướng phát triển các ngành, vùng kinh tế.", "c) Nhà nước trực tiếp quyết định mọi hoạt động mua bán của người dân.", "d) Pháp luật kinh tế tạo hành lang pháp lí cho các chủ thể hoạt động."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: trong kinh tế thị trường, người dân tự do kinh doanh trong khuôn khổ pháp luật, Nhà nước không quyết định thay mọi giao dịch.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Nhà nước thực hiện chức năng ... nền kinh tế».", "answer": "quản lí vĩ mô", "explain": "Nhà nước là chủ thể đặc biệt, thực hiện chức năng quản lí vĩ mô nền kinh tế.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Kể tên 4 chủ thể cơ bản của nền kinh tế theo thứ tự: sản xuất, tiêu dùng, trung gian, Nhà nước. Có tất cả bao nhiêu chủ thể?", "answer": "4", "explain": "Bốn chủ thể cơ bản: chủ thể sản xuất, chủ thể tiêu dùng, chủ thể trung gian và Nhà nước.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Mẹo nhận diện nhanh: khi gặp câu hỏi «ai là chủ thể trung gian», nên nghĩ đến những người, tổ chức", "options": ["A. trực tiếp tạo ra sản phẩm.", "B. kết nối người bán với người mua.", "C. mua hàng về sử dụng.", "D. ban hành pháp luật."], "answer": "B", "explain": "Chủ thể trung gian là những người, tổ chức kết nối người bán với người mua: ngân hàng, sàn giao dịch, môi giới, đại lí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cụm từ nào sau đây gắn với chủ thể sản xuất?", "options": ["A. «Tạo ra hàng hóa, dịch vụ».", "B. «Mua và sử dụng sản phẩm».", "C. «Kết nối mua – bán».", "D. «Quản lí vĩ mô»."], "answer": "A", "explain": "«Tạo ra hàng hóa, dịch vụ» là hoạt động đặc trưng của chủ thể sản xuất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bác Tư nuôi cá, mỗi vụ thu hoạch bán cho thương lái. Vợ bác Tư đi chợ mua thực phẩm về nấu ăn. Gia đình bác Tư thuộc các chủ thể nào?", "options": ["A. Chỉ thuộc chủ thể sản xuất.", "B. Chủ thể sản xuất và chủ thể tiêu dùng.", "C. Chỉ thuộc chủ thể trung gian.", "D. Nhà nước và chủ thể tiêu dùng."], "answer": "B", "explain": "Nuôi cá bán là tạo ra sản phẩm (chủ thể sản xuất); mua thực phẩm về nấu ăn là sử dụng sản phẩm (chủ thể tiêu dùng).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Công ty điện lực vừa sản xuất điện, vừa bán điện trực tiếp cho hộ gia đình, đồng thời chịu sự quản lí giá của Nhà nước. Có bao nhiêu chủ thể kinh tế xuất hiện trong ví dụ này?", "options": ["A. 2 chủ thể: sản xuất và tiêu dùng.", "B. 3 chủ thể: sản xuất, tiêu dùng và Nhà nước.", "C. 4 chủ thể.", "D. 1 chủ thể duy nhất."], "answer": "B", "explain": "Công ty điện lực (sản xuất), hộ gia đình mua điện (tiêu dùng), Nhà nước quản lí giá — có 3 chủ thể, không có chủ thể trung gian.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Chị Mai mở xưởng bánh, thuê 5 nhân công, bán bánh qua cửa hàng của mình và qua một sàn thương mại điện tử. Trong mô hình này, sàn thương mại điện tử là", "options": ["A. chủ thể sản xuất.", "B. chủ thể tiêu dùng.", "C. chủ thể trung gian.", "D. cơ quan Nhà nước."], "answer": "C", "explain": "Sàn thương mại điện tử kết nối xưởng bánh của chị Mai với khách hàng nên là chủ thể trung gian.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người nông dân trồng lúa (1), bán lúa cho thương lái (2), thương lái bán gạo cho siêu thị (3), người dân mua gạo về ăn (4), Nhà nước thu thuế các khâu (5). Thứ tự xuất hiện các chủ thể sản xuất – trung gian – tiêu dùng – Nhà nước trong chuỗi trên là", "options": ["A. (1) – (2)(3) – (4) – (5).", "B. (5) – (1) – (2) – (4).", "C. (1) – (4) – (2) – (5).", "D. (2) – (1) – (5) – (4)."], "answer": "A", "explain": "(1) nông dân trồng lúa là sản xuất; (2)(3) thương lái, siêu thị là trung gian; (4) người dân mua gạo là tiêu dùng; (5) Nhà nước thu thuế là quản lí vĩ mô.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Một người có thể đồng thời thuộc nhiều chủ thể kinh tế.", "b) Doanh nghiệp vừa sản xuất vừa bán lẻ thuộc cả chủ thể sản xuất và trung gian.", "c) Chủ thể trung gian bao gồm ngân hàng, sàn giao dịch, môi giới.", "d) Nhà nước vừa sản xuất vừa quản lí nên không phải chủ thể đặc biệt."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: Nhà nước là chủ thể đặc biệt vì thực hiện quản lí vĩ mô nền kinh tế.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hỏi «nhân vật này đang tạo ra, sử dụng, kết nối hay quản lí» giúp xác định đúng chủ thể.", "b) Người bán hàng rong vừa là chủ thể sản xuất vừa là chủ thể trung gian.", "c) Học sinh mua bút để học thuộc chủ thể tiêu dùng.", "d) Cán bộ thuế đi kiểm tra doanh nghiệp là chủ thể sản xuất."], "answer": ["T", "F", "T", "F"], "explain": "a, c đúng. b sai: người bán hàng rong mua đi bán lại thuộc chủ thể trung gian (không trực tiếp tạo ra sản phẩm). d sai: cán bộ thuế thực thi quản lí của Nhà nước.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Bốn chủ thể kinh tế ... chặt chẽ với nhau, tạo nên sự vận động của nền kinh tế».", "answer": "phối hợp", "explain": "Bốn chủ thể không tồn tại tách rời mà phối hợp chặt chẽ với nhau.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các chủ thể theo vai trò trong chuỗi giá trị: (1) Nhà nước, (2) Chủ thể trung gian, (3) Chủ thể sản xuất, (4) Chủ thể tiêu dùng. Viết dãy số đúng, ví dụ 1234.", "answer": "3241", "explain": "Chuỗi giá trị: (3) sản xuất tạo ra sản phẩm, (2) trung gian kết nối phân phối, (4) tiêu dùng sử dụng, trong khuôn khổ quản lí của (1) Nhà nước.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trách nhiệm chung của các chủ thể kinh tế là", "options": ["A. hoạt động đúng pháp luật, trung thực.", "B. tối đa hóa lợi nhuận bằng mọi giá.", "C. trốn thuế để giảm chi phí.", "D. sản xuất hàng giả giá rẻ."], "answer": "A", "explain": "Mọi chủ thể kinh tế đều phải hoạt động đúng pháp luật, trung thực: sản xuất bảo đảm chất lượng, tiêu dùng có trách nhiệm, trung gian công bằng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chủ thể sản xuất có trách nhiệm nộp thuế đầy đủ vì thuế là", "options": ["A. khoản đóng góp bắt buộc vào ngân sách nhà nước.", "B. khoản tiền thưởng của doanh nghiệp.", "C. chi phí quảng cáo sản phẩm.", "D. tiền lương của công nhân."], "answer": "A", "explain": "Thuế là khoản nộp bắt buộc của tổ chức, cá nhân vào ngân sách nhà nước theo quy định pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một cửa hàng bán thực phẩm hết hạn sử dụng nhưng dán nhãn mới để bán tiếp. Hành vi này vi phạm trách nhiệm của chủ thể nào?", "options": ["A. Chủ thể sản xuất.", "B. Chủ thể trung gian.", "C. Chủ thể tiêu dùng.", "D. Nhà nước."], "answer": "B", "explain": "Cửa hàng bán lẻ là chủ thể trung gian; bán hàng hết hạn, gian lận nhãn mác vi phạm trách nhiệm kinh doanh trung thực của chủ thể trung gian.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để bảo vệ quyền lợi của mình, chủ thể tiêu dùng nên", "options": ["A. mua hàng không rõ nguồn gốc vì giá rẻ.", "B. tìm hiểu kĩ thông tin sản phẩm, giữ hóa đơn mua hàng.", "C. tiếp tay tiêu thụ hàng giả.", "D. mua sắm vượt quá khả năng chi trả."], "answer": "B", "explain": "Người tiêu dùng thông minh tìm hiểu kĩ thông tin, chọn hàng có nguồn gốc rõ ràng và giữ hóa đơn để được bảo vệ khi có tranh chấp.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Doanh nghiệp X đầu tư hệ thống xử lí nước thải dù tốn kém, đồng thời công khai chất lượng sản phẩm trên bao bì. Doanh nghiệp đang thực hiện tốt trách nhiệm", "options": ["A. của Nhà nước.", "B. của chủ thể sản xuất.", "C. của chủ thể tiêu dùng.", "D. của chủ thể trung gian."], "answer": "B", "explain": "Bảo vệ môi trường và bảo đảm chất lượng, minh bạch thông tin sản phẩm là trách nhiệm của chủ thể sản xuất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Người tiêu dùng phát hiện cửa hàng bán hàng giả, đã báo cho cơ quan quản lí thị trường. Hành động này thể hiện", "options": ["A. trách nhiệm của công dân trong việc góp phần làm lành mạnh thị trường.", "B. vai trò quản lí vĩ mô của người tiêu dùng.", "C. hoạt động sản xuất của người tiêu dùng.", "D. sự can thiệp vào quyền kinh doanh hợp pháp."], "answer": "A", "explain": "Tố giác hàng giả là trách nhiệm công dân, góp phần bảo vệ người tiêu dùng khác và làm lành mạnh thị trường; quản lí vĩ mô vẫn thuộc về Nhà nước.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về trách nhiệm của các chủ thể:", "statements": ["a) Chủ thể sản xuất phải bảo đảm chất lượng sản phẩm.", "b) Chủ thể tiêu dùng nên mua hàng có nguồn gốc rõ ràng.", "c) Chủ thể trung gian phải kinh doanh trung thực, công bằng.", "d) Các chủ thể được phép vi phạm pháp luật nếu có lợi."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: mọi chủ thể đều phải hoạt động đúng pháp luật.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sản xuất hàng giả là vi phạm trách nhiệm của chủ thể sản xuất.", "b) Tiêu dùng tiết kiệm, tránh lãng phí là trách nhiệm của mỗi công dân.", "c) Gian lận trong mua bán vi phạm trách nhiệm của chủ thể trung gian.", "d) Nộp thuế đầy đủ là trách nhiệm chỉ của Nhà nước."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: nộp thuế là nghĩa vụ của tổ chức, cá nhân (thuộc các chủ thể sản xuất, trung gian, tiêu dùng có thu nhập), không phải trách nhiệm của Nhà nước.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Tiêu dùng ..., có trách nhiệm là nghĩa vụ của mỗi công dân».", "answer": "văn minh", "explain": "Tiêu dùng văn minh, có trách nhiệm: mua hàng rõ nguồn gốc, tẩy chay hàng giả, tiết kiệm tránh lãng phí.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một cơ sở sản xuất bị phạt 50 triệu đồng vì xả thải gây ô nhiễm và 30 triệu đồng vì sản xuất hàng kém chất lượng. Tổng số tiền phạt là bao nhiêu triệu đồng?", "answer": "80", "explain": "Tổng tiền phạt = 50 + 30 = 80 triệu đồng.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Vai trò «cung cấp thông tin thị trường hai chiều» thuộc về chủ thể nào?", "options": ["A. Chủ thể sản xuất.", "B. Chủ thể tiêu dùng.", "C. Chủ thể trung gian.", "D. Người lao động tự do."], "answer": "C", "explain": "Chủ thể trung gian cung cấp thông tin hai chiều: giúp người sản xuất biết nhu cầu, giúp người tiêu dùng biết sản phẩm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vai trò «đảm bảo công bằng xã hội» thuộc về chủ thể nào?", "options": ["A. Chủ thể sản xuất.", "B. Chủ thể tiêu dùng.", "C. Chủ thể trung gian.", "D. Nhà nước."], "answer": "D", "explain": "Đảm bảo công bằng xã hội (xóa đói giảm nghèo, an sinh xã hội) là vai trò của Nhà nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vai trò «tạo việc làm, thu nhập cho người lao động» thuộc về chủ thể nào?", "options": ["A. Chủ thể sản xuất.", "B. Chủ thể tiêu dùng.", "C. Chủ thể trung gian.", "D. Nhà nước."], "answer": "A", "explain": "Hoạt động sản xuất tạo ra việc làm và thu nhập cho người lao động, đóng góp vào tăng trưởng kinh tế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vai trò «định hướng sản xuất» (sản xuất cái gì, bao nhiêu) thuộc về", "options": ["A. nhu cầu của chủ thể tiêu dùng.", "B. mệnh lệnh của chủ thể trung gian.", "C. ý muốn chủ quan của Nhà nước.", "D. sự ngẫu nhiên của thị trường."], "answer": "A", "explain": "Nhu cầu và lựa chọn tiêu dùng của người dân định hướng sản xuất: sản xuất cái gì, sản xuất bao nhiêu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Khi giá thịt lợn tăng cao, nhiều hộ chăn nuôi mở rộng đàn lợn; khi giá giảm, họ thu hẹp quy mô. Hiện tượng này cho thấy vai trò điều tiết của", "options": ["A. thông tin thị trường đến chủ thể sản xuất.", "B. Nhà nước cấm chăn nuôi.", "C. chủ thể tiêu dùng trực tiếp sản xuất.", "D. chủ thể trung gian ngừng hoạt động."], "answer": "A", "explain": "Giá cả (thông tin thị trường) báo hiệu cho người chăn nuôi điều chỉnh quy mô — vai trò điều tiết sản xuất của thông tin thị trường qua trao đổi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một địa phương vận động nông dân liên kết thành hợp tác xã để vừa sản xuất vừa tiêu thụ nông sản, đồng thời chính quyền hỗ trợ vốn và tập huấn kĩ thuật. Mô hình này phát huy vai trò của các chủ thể nào?", "options": ["A. Chỉ chủ thể sản xuất.", "B. Chủ thể sản xuất, chủ thể trung gian và Nhà nước.", "C. Chỉ Nhà nước.", "D. Chỉ chủ thể tiêu dùng."], "answer": "B", "explain": "Hợp tác xã vừa sản xuất vừa tiêu thụ (sản xuất + trung gian), chính quyền hỗ trợ vốn, tập huấn (Nhà nước).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về vai trò các chủ thể:", "statements": ["a) Chủ thể sản xuất quyết định số lượng, chất lượng sản phẩm.", "b) Chủ thể tiêu dùng là động lực thúc đẩy sản xuất.", "c) Chủ thể trung gian làm cầu nối mua – bán.", "d) Nhà nước quản lí vĩ mô nền kinh tế."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn khẳng định đều đúng theo SGK.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thông tin thị trường giúp người sản xuất điều chỉnh sản xuất.", "b) Nhà nước tạo hành lang pháp lí cho hoạt động kinh tế.", "c) Chủ thể trung gian trực tiếp quyết định giá cả mọi mặt hàng.", "d) Tiêu dùng văn minh góp phần thúc đẩy sản xuất lành mạnh."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: giá cả do quan hệ cung – cầu quyết định, chủ thể trung gian chỉ góp phần điều tiết.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Nhà nước tạo ... cho các chủ thể tham gia hoạt động kinh tế».", "answer": "hành lang pháp lí", "explain": "Nhà nước xây dựng và thực thi pháp luật, tạo hành lang pháp lí cho hoạt động kinh tế.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong 4 chủ thể kinh tế, có bao nhiêu chủ thể KHÔNG trực tiếp tạo ra hàng hóa, dịch vụ?", "answer": "3", "explain": "Chỉ chủ thể sản xuất trực tiếp tạo ra hàng hóa, dịch vụ; 3 chủ thể còn lại (tiêu dùng, trung gian, Nhà nước) không trực tiếp tạo ra.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Khái niệm «chủ thể của nền kinh tế» nhấn mạnh yếu tố nào?", "options": ["A. Những người, tổ chức tham gia hoạt động kinh tế.", "B. Những cỗ máy trong nhà xưởng.", "C. Những văn bản pháp luật.", "D. Những loại tiền tệ."], "answer": "A", "explain": "Chủ thể của nền kinh tế là những người, tổ chức tham gia vào các hoạt động sản xuất, phân phối – trao đổi, tiêu dùng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đâu KHÔNG phải là chủ thể của nền kinh tế?", "options": ["A. Chủ thể sản xuất.", "B. Chủ thể tiêu dùng.", "C. Chủ thể trung gian.", "D. Thiên nhiên."], "answer": "D", "explain": "Thiên nhiên là đối tượng tác động của sản xuất, không phải chủ thể kinh tế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Gia đình bạn An mở quán phở: bố mẹ nấu phở bán, An phụ bưng bê, khách đến ăn trả tiền, chính quyền kiểm tra vệ sinh an toàn thực phẩm. Khách đến ăn thuộc chủ thể nào?", "options": ["A. Chủ thể sản xuất.", "B. Chủ thể tiêu dùng.", "C. Chủ thể trung gian.", "D. Nhà nước."], "answer": "B", "explain": "Khách đến quán ăn phở trả tiền là mua và sử dụng dịch vụ ăn uống nên thuộc chủ thể tiêu dùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong ví dụ quán phở trên, chính quyền kiểm tra vệ sinh an toàn thực phẩm thể hiện vai trò nào?", "options": ["A. Chủ thể sản xuất phở.", "B. Quản lí vĩ mô, bảo vệ người tiêu dùng của Nhà nước.", "C. Chủ thể trung gian bán phở.", "D. Chủ thể tiêu dùng phở."], "answer": "B", "explain": "Kiểm tra vệ sinh an toàn thực phẩm là hoạt động quản lí của Nhà nước nhằm bảo vệ sức khỏe người tiêu dùng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một startup công nghệ tạo ra ứng dụng học trực tuyến, thu phí người học, thuê đơn vị quảng cáo để tiếp cận khách hàng. Đơn vị quảng cáo trong mô hình này là", "options": ["A. chủ thể sản xuất.", "B. chủ thể tiêu dùng.", "C. chủ thể trung gian.", "D. Nhà nước."], "answer": "C", "explain": "Đơn vị quảng cáo kết nối startup với khách hàng tiềm năng, cung cấp thông tin thị trường nên là chủ thể trung gian.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nông dân trồng cà phê bán cho công ty thu mua, công ty rang xay đóng gói bán cho siêu thị, siêu thị bán cho người uống cà phê, Nhà nước thu thuế ở các khâu. Chủ thể trung gian trong chuỗi này gồm", "options": ["A. nông dân và người uống cà phê.", "B. công ty thu mua, rang xay và siêu thị.", "C. Nhà nước.", "D. chỉ có siêu thị."], "answer": "B", "explain": "Công ty thu mua, rang xay, đóng gói và siêu thị đều thực hiện mua đi bán lại, kết nối các khâu nên thuộc chủ thể trung gian.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quán phở bán hàng cho khách là chủ thể sản xuất dịch vụ ăn uống.", "b) Khách ăn phở là chủ thể tiêu dùng.", "c) Chính quyền kiểm tra vệ sinh là vai trò của Nhà nước.", "d) Người giao phở thuê cho quán là chủ thể sản xuất."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: người giao hàng thuê kết nối quán với khách (trung gian vận chuyển), không trực tiếp tạo ra món ăn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cùng một người có thể vừa là chủ thể sản xuất vừa là chủ thể tiêu dùng.", "b) Doanh nghiệp không bao giờ thuộc chủ thể tiêu dùng.", "c) Nhà nước là chủ thể đặc biệt của nền kinh tế.", "d) Chủ thể trung gian luôn cần thiết trong mọi giao dịch."], "answer": ["T", "F", "T", "F"], "explain": "a, c đúng. b sai: doanh nghiệp mua văn phòng phẩm, thiết bị để sử dụng cũng là chủ thể tiêu dùng. d sai: mua bán trực tiếp (nông dân bán rau tại chợ) không cần trung gian.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Chủ thể kinh tế là những người, tổ chức tham gia vào các hoạt động ..., phân phối – trao đổi, tiêu dùng».", "answer": "sản xuất", "explain": "Chủ thể kinh tế tham gia vào các hoạt động sản xuất, phân phối – trao đổi, tiêu dùng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một làng có 100 hộ: 60 hộ trồng lúa, 20 hộ buôn bán tạp hóa, 20 hộ còn lại chỉ mua hàng về dùng. Hỏi có bao nhiêu hộ thuộc chủ thể trung gian?", "answer": "20", "explain": "20 hộ buôn bán tạp hóa mua đi bán lại, kết nối người sản xuất với người tiêu dùng nên thuộc chủ thể trung gian.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Bốn chủ thể của nền kinh tế có mối quan hệ với nhau như thế nào?", "options": ["A. Tồn tại tách rời, độc lập.", "B. Phối hợp chặt chẽ, tạo nên sự vận động của nền kinh tế.", "C. Đối đầu, loại trừ lẫn nhau.", "D. Chỉ quan hệ qua Nhà nước."], "answer": "B", "explain": "Bốn chủ thể không tồn tại tách rời mà phối hợp chặt chẽ, tạo nên sự vận động của nền kinh tế.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chủ thể nào được gọi là «chủ thể đặc biệt» của nền kinh tế?", "options": ["A. Chủ thể sản xuất.", "B. Chủ thể tiêu dùng.", "C. Chủ thể trung gian.", "D. Nhà nước."], "answer": "D", "explain": "Nhà nước là chủ thể đặc biệt vì thực hiện chức năng quản lí vĩ mô nền kinh tế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Nhà nước được gọi là chủ thể đặc biệt?", "options": ["A. Vì Nhà nước sản xuất nhiều hàng hóa nhất.", "B. Vì Nhà nước thực hiện quản lí vĩ mô, tạo khuôn khổ pháp luật cho mọi chủ thể.", "C. Vì Nhà nước là người tiêu dùng lớn nhất.", "D. Vì Nhà nước không tham gia hoạt động kinh tế."], "answer": "B", "explain": "Nhà nước đặc biệt ở chỗ không trực tiếp sản xuất kinh doanh như các chủ thể khác mà quản lí vĩ mô, tạo hành lang pháp lí cho toàn bộ nền kinh tế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận định nào sau đây đúng nhất về sự phối hợp giữa các chủ thể?", "options": ["A. Người sản xuất cần người tiêu dùng và ngược lại.", "B. Chủ thể trung gian hoạt động độc lập tuyệt đối.", "C. Nhà nước đứng ngoài mọi hoạt động kinh tế.", "D. Người tiêu dùng không ảnh hưởng đến ai."], "answer": "A", "explain": "Người sản xuất cần người tiêu dùng để tiêu thụ sản phẩm; người tiêu dùng cần người sản xuất để có hàng hóa — các chủ thể phụ thuộc, phối hợp lẫn nhau.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Khi Nhà nước giảm thuế cho doanh nghiệp nhỏ, doanh nghiệp có thêm vốn mở rộng sản xuất, tạo thêm việc làm, người lao động có thu nhập để chi tiêu. Chuỗi tác động này cho thấy", "options": ["A. chính sách của Nhà nước tác động lan tỏa đến các chủ thể khác.", "B. Nhà nước trực tiếp sản xuất thay doanh nghiệp.", "C. người lao động trở thành chủ thể trung gian.", "D. doanh nghiệp không cần người tiêu dùng."], "answer": "A", "explain": "Chính sách thuế của Nhà nước tác động đến doanh nghiệp (sản xuất), đến người lao động (việc làm, thu nhập) và tiêu dùng — thể hiện sự phối hợp, tác động qua lại giữa các chủ thể.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong nền kinh tế thị trường, nếu Nhà nước buông lỏng quản lí, để hàng giả tràn lan thì chủ thể nào chịu thiệt hại trực tiếp nhất và chủ thể nào phải can thiệp?", "options": ["A. Chủ thể tiêu dùng chịu thiệt hại; Nhà nước phải can thiệp quản lí.", "B. Chỉ Nhà nước chịu thiệt hại.", "C. Chủ thể sản xuất chân chính được hưởng lợi.", "D. Không chủ thể nào bị ảnh hưởng."], "answer": "A", "explain": "Hàng giả trực tiếp gây hại cho người tiêu dùng (sức khỏe, tiền bạc) và làm méo mó thị trường; Nhà nước với vai trò quản lí vĩ mô phải can thiệp để lập lại trật tự.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bốn chủ thể phối hợp tạo nên sự vận động của nền kinh tế.", "b) Nhà nước là chủ thể đặc biệt thực hiện quản lí vĩ mô.", "c) Không có chủ thể nào hoạt động tách rời các chủ thể khác.", "d) Chủ thể tiêu dùng không liên quan đến chủ thể sản xuất."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: tiêu dùng là động lực và định hướng cho sản xuất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chính sách kinh tế của Nhà nước ảnh hưởng đến mọi chủ thể.", "b) Chủ thể trung gian giúp các chủ thể khác kết nối thuận lợi hơn.", "c) Người sản xuất và người tiêu dùng phụ thuộc lẫn nhau.", "d) Trong nền kinh tế chỉ cần một chủ thể duy nhất là đủ."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: nền kinh tế cần sự phối hợp của cả bốn chủ thể.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Nhà nước là ... của nền kinh tế».", "answer": "chủ thể đặc biệt", "explain": "Nhà nước là chủ thể đặc biệt của nền kinh tế, thực hiện quản lí vĩ mô.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một nền kinh tế có đầy đủ 4 chủ thể nhưng thiếu sự phối hợp giữa chúng. Theo SGK, điều này ảnh hưởng gì đến sự vận động của nền kinh tế? Trả lời ngắn gọn: «làm ... sự vận động».", "answer": "làm đình trệ", "explain": "Các chủ thể phải phối hợp chặt chẽ mới tạo nên sự vận động trôi chảy của nền kinh tế; thiếu phối hợp sẽ làm đình trệ sự vận động đó.", "points": 0.5}]}]}
