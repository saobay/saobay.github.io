quả) và thị trường độc quyền.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Theo phương thức giao dịch có thị trường truyền thống (hữu hình) và thị trường ... (vô hình)».", "answer": "điện tử", "explain": "Theo phương thức giao dịch: thị trường truyền thống (hữu hình) và thị trường điện tử (vô hình).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Có bao nhiêu yếu tố cơ bản của thị trường theo SGK?", "answer": "4", "explain": "Bốn yếu tố: hàng hóa/dịch vụ, tiền tệ, người mua – người bán, giá cả.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Chức năng nào giúp người sản xuất biết nên sản xuất cái gì, bao nhiêu?", "options": ["A. Cung cấp thông tin.", "B. Thu thuế.", "C. Ban hành luật.", "D. In tiền."], "answer": "A", "explain": "Chức năng cung cấp thông tin giúp người sản xuất nắm được nhu cầu, giá cả thị trường để điều chỉnh sản xuất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "«Hàng hóa có bán được hay không, bán với giá nào do thị trường phán quyết» thể hiện chức năng", "options": ["A. cung cấp thông tin.", "B. thừa nhận giá trị xã hội của hàng hóa.", "C. thu ngân sách.", "D. phân phối thu nhập."], "answer": "B", "explain": "Thị trường «phán quyết» sản phẩm nào được chấp nhận, sản phẩm nào bị đào thải — đó là chức năng thừa nhận giá trị xã hội của hàng hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi thấy giá thanh long tăng cao, nhiều nông dân chuyển sang trồng thanh long. Đây là biểu hiện của chức năng", "options": ["A. điều tiết sản xuất.", "B. thu thuế.", "C. in tiền.", "D. phân phối lại thu nhập."], "answer": "A", "explain": "Thông tin giá cả từ thị trường giúp người sản xuất điều chỉnh mặt hàng, số lượng — chức năng điều tiết sản xuất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Người tiêu dùng so sánh giá cả, chất lượng giữa các cửa hàng trước khi mua. Hành vi này tận dụng chức năng nào của thị trường?", "options": ["A. Chức năng sản xuất.", "B. Chức năng cung cấp thông tin.", "C. Chức năng thu thuế.", "D. Chức năng in tiền."], "answer": "B", "explain": "So sánh giá cả, chất lượng giữa các nơi bán là khai thác thông tin mà thị trường cung cấp để lựa chọn hợp lí.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một làng nghề làm nón lá bị mai một vì nón nhựa rẻ, bền hơn chiếm lĩnh thị trường. Sự «đào thải» này thể hiện chức năng nào?", "options": ["A. Thừa nhận giá trị xã hội của hàng hóa.", "B. Cung cấp vốn cho sản xuất.", "C. Thu ngân sách nhà nước.", "D. Phân phối thu nhập."], "answer": "A", "explain": "Sản phẩm không còn được thị trường chấp nhận thì bị đào thải — đúng chức năng thừa nhận giá trị xã hội của hàng hóa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nhờ cạnh tranh trên thị trường, giá smartphone ngày càng rẻ trong khi cấu hình ngày càng mạnh. Lợi ích này đến từ chức năng", "options": ["A. kích thích cạnh tranh, đổi mới.", "B. thu thuế.", "C. phân phối lại thu nhập.", "D. quản lí vĩ mô của doanh nghiệp."], "answer": "A", "explain": "Cạnh tranh buộc các hãng không ngừng đổi mới, nâng cao chất lượng, hạ giá thành — người tiêu dùng được hưởng lợi.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thị trường có chức năng cung cấp thông tin.", "b) Thị trường có chức năng điều tiết sản xuất và tiêu dùng.", "c) Thị trường có chức năng kích thích cạnh tranh, đổi mới.", "d) Thị trường có chức năng trực tiếp sản xuất hàng hóa."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng là ba trong bốn chức năng. d sai: sản xuất là việc của chủ thể sản xuất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sản phẩm kém chất lượng, giá cao sẽ bị thị trường đào thải.", "b) Thông tin thị trường giúp người tiêu dùng lựa chọn hợp lí.", "c) Cạnh tranh trên thị trường thúc đẩy tiến bộ kinh tế.", "d) Thị trường quyết định thay người sản xuất mọi việc."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thị trường cung cấp thông tin, điều tiết nhưng người sản xuất vẫn là người ra quyết định sản xuất.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Để tồn tại trên thị trường, các chủ thể phải không ngừng nâng cao chất lượng, hạ giá thành, ... mẫu mã».", "answer": "đổi mới", "explain": "Chức năng kích thích cạnh tranh, đổi mới buộc các chủ thể nâng cao chất lượng, hạ giá thành, đổi mới mẫu mã.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Mẹo nhớ 4 chức năng của thị trường là «Thông tin – Thừa nhận – Điều tiết – ...». Điền từ còn thiếu.", "answer": "Thúc đẩy", "explain": "Bốn chức năng: cung cấp thông tin; thừa nhận giá trị xã hội; điều tiết sản xuất – tiêu dùng; kích thích cạnh tranh, đổi mới (thúc đẩy).", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Tiền tệ trên thị trường có vai trò", "options": ["A. đối tượng mua bán duy nhất.", "B. phương tiện trao đổi, thước đo giá trị.", "C. thay thế hoàn toàn hàng hóa.", "D. do người mua tự in ra."], "answer": "B", "explain": "Tiền tệ là phương tiện trao đổi, thước đo giá trị hàng hóa trên thị trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người bán và người mua trên thị trường có quan hệ", "options": ["A. mua bán, trao đổi.", "B. cấp trên – cấp dưới.", "C. không liên quan nhau.", "D. đối đầu loại trừ."], "answer": "A", "explain": "Thị trường là tổng hòa các quan hệ mua bán giữa người bán và người mua.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói thị trường chứng khoán cũng là một loại thị trường dù không có «chợ» cụ thể?", "options": ["A. Vì đó là nơi diễn ra mua bán cổ phiếu giữa người bán và người mua.", "B. Vì đó là nơi sản xuất cổ phiếu.", "C. Vì Nhà nước bắt buộc mọi người tham gia.", "D. Vì không cần tiền tệ để giao dịch."], "answer": "A", "explain": "Thị trường không chỉ là địa điểm cụ thể mà là tổng hòa quan hệ mua bán; thị trường chứng khoán là nơi mua bán cổ phiếu (thị trường vốn vô hình).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giá cả trên thị trường được hình thành chủ yếu do", "options": ["A. ý muốn chủ quan của người bán.", "B. quan hệ cung – cầu.", "C. sự ngẫu nhiên.", "D. thời tiết quyết định."], "answer": "B", "explain": "Giá cả thị trường do quan hệ cung – cầu quyết định (nội dung chi tiết ở Bài 4).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bà Lan bán rau tại chợ, khách hàng trả giá, hai bên thỏa thuận giá mua bán. «Cuộc trả giá» này diễn ra trên", "options": ["A. thị trường hàng hóa hữu hình.", "B. thị trường vốn.", "C. thị trường lao động.", "D. thị trường bất động sản."], "answer": "A", "explain": "Chợ là thị trường hàng hóa hữu hình, nơi diễn ra mua bán rau quả trực tiếp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một nền kinh tế không có thị trường (mọi thứ do Nhà nước phân phối theo kế hoạch cứng nhắc) sẽ thiếu đi điều gì quan trọng nhất?", "options": ["A. Thông tin phản hồi từ người tiêu dùng để điều tiết sản xuất.", "B. Tiền tệ để trao đổi.", "C. Người lao động.", "D. Tài nguyên thiên nhiên."], "answer": "A", "explain": "Không có thị trường thì mất đi kênh thông tin hai chiều giữa sản xuất và tiêu dùng, sản xuất không biết nhu cầu thực tế để điều chỉnh — đó là hạn chế lớn nhất.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thị trường bao gồm cả dạng hữu hình và vô hình.", "b) Chợ truyền thống là thị trường hữu hình.", "c) Sàn giao dịch điện tử là thị trường vô hình.", "d) Thị trường nhất thiết phải có địa điểm cố định."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thị trường vô hình không cần địa điểm cố định, người mua bán không cần gặp mặt trực tiếp.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giá cả là biểu hiện bằng tiền của giá trị hàng hóa.", "b) Người mua và người bán là chủ thể của quan hệ mua bán.", "c) Hàng hóa, dịch vụ là đối tượng mua bán trên thị trường.", "d) Trên thị trường, người mua luôn bị động hoàn toàn."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: người mua chủ động so sánh, lựa chọn; nhu cầu của họ còn định hướng sản xuất.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Thị trường là ... các quan hệ mua bán giữa người bán và người mua».", "answer": "tổng hòa", "explain": "Thị trường là tổng hòa các quan hệ mua bán giữa người bán và người mua.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một cửa hàng niêm yết giá áo là 200 nghìn đồng nhưng khách trả 180 nghìn đồng và chủ cửa hàng đồng ý. Giá thị trường thực tế của chiếc áo trong giao dịch này là bao nhiêu nghìn đồng?", "answer": "180", "explain": "Giá cả thực tế là mức giá hai bên thỏa thuận mua bán thành công: 180 nghìn đồng.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Thị trường lao động là nơi mua bán", "options": ["A. máy móc thiết bị.", "B. sức lao động.", "C. nhà đất.", "D. cổ phiếu."], "answer": "B", "explain": "Trên thị trường lao động, «hàng hóa» được mua bán là sức lao động của người lao động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thị trường bất động sản là nơi mua bán", "options": ["A. sức lao động.", "B. cổ phiếu, trái phiếu.", "C. nhà đất.", "D. rau quả."], "answer": "C", "explain": "Thị trường bất động sản là nơi mua bán nhà đất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sinh viên mới ra trường đăng hồ sơ tìm việc trên trang web tuyển dụng. Bạn sinh viên đang tham gia", "options": ["A. thị trường hàng hóa.", "B. thị trường lao động.", "C. thị trường vốn.", "D. thị trường bất động sản."], "answer": "B", "explain": "Tìm việc làm là tham gia thị trường lao động với tư cách người bán sức lao động.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Doanh nghiệp phát hành cổ phiếu để huy động vốn đang tham gia", "options": ["A. thị trường vốn.", "B. thị trường rau quả.", "C. thị trường lao động.", "D. thị trường bất động sản."], "answer": "A", "explain": "Mua bán cổ phiếu, trái phiếu để huy động vốn diễn ra trên thị trường vốn (thị trường chứng khoán).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Gia đình ông Ba muốn bán mảnh đất để lấy vốn làm ăn, đã nhờ văn phòng môi giới đăng tin. Các chủ thể tham gia thị trường bất động sản trong ví dụ này gồm", "options": ["A. người bán, người mua, chủ thể trung gian.", "B. chỉ có người bán.", "C. chỉ có Nhà nước.", "D. người sản xuất đất đai."], "answer": "A", "explain": "Có người bán (gia đình ông Ba), người mua tiềm năng và văn phòng môi giới (chủ thể trung gian).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khi lãi suất ngân hàng tăng, nhiều người gửi tiết kiệm thay vì đầu tư chứng khoán, khiến thị trường chứng khoán ảm đạm. Hiện tượng này cho thấy", "options": ["A. các thị trường có mối liên hệ, tác động lẫn nhau.", "B. thị trường vốn tồn tại độc lập tuyệt đối.", "C. lãi suất không ảnh hưởng gì đến thị trường.", "D. người dân không quan tâm đến tiền tệ."], "answer": "A", "explain": "Thay đổi trên thị trường tiền tệ (lãi suất) tác động đến thị trường vốn (chứng khoán) — các thị trường liên hệ, tác động lẫn nhau.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thị trường lao động mua bán sức lao động.", "b) Thị trường vốn mua bán cổ phiếu, trái phiếu.", "c) Thị trường bất động sản mua bán nhà đất.", "d) Chỉ có thị trường hàng hóa mới được gọi là thị trường."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thị trường rất đa dạng theo đối tượng mua bán.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trang web tuyển dụng là một dạng thị trường lao động vô hình.", "b) Chợ nông sản là thị trường hàng hóa hữu hình.", "c) Các loại thị trường có thể tác động lẫn nhau.", "d) Mỗi loại thị trường tồn tại hoàn toàn biệt lập."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: các thị trường liên hệ, tác động qua lại lẫn nhau.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Sàn thương mại điện tử là thị trường ... vì người mua và người bán không cần gặp mặt trực tiếp».", "answer": "vô hình", "explain": "Thị trường điện tử là thị trường vô hình.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Theo SGK, thị trường được phân loại theo 4 tiêu chí: đối tượng mua bán, phạm vi, tính chất cạnh tranh và ... Điền tiêu chí còn thiếu.", "answer": "phương thức giao dịch", "explain": "Bốn tiêu chí phân loại: theo đối tượng mua bán, theo phạm vi, theo tính chất cạnh tranh, theo phương thức giao dịch.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Chức năng «điều tiết sản xuất và tiêu dùng» có nghĩa là", "options": ["A. thị trường giúp người sản xuất điều chỉnh sản xuất, người tiêu dùng lựa chọn hợp lí.", "B. thị trường thay người sản xuất ra quyết định.", "C. thị trường cấm người tiêu dùng lựa chọn.", "D. thị trường ấn định mọi thứ thay Nhà nước."], "answer": "A", "explain": "Thông tin từ thị trường giúp người sản xuất điều chỉnh cái gì, bao nhiêu, như thế nào; giúp người tiêu dùng lựa chọn hợp lí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thị trường được ví như «trọng tài» vì", "options": ["A. thị trường phán xét sản phẩm nào được thừa nhận, sản phẩm nào bị đào thải.", "B. thị trường xử phạt vi phạm pháp luật.", "C. thị trường tổ chức thi đấu thể thao.", "D. thị trường ban hành án phạt tù."], "answer": "A", "explain": "Chức năng thừa nhận giá trị xã hội của hàng hóa khiến thị trường như «trọng tài» phán quyết số phận sản phẩm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một cửa hàng treo biển «giảm giá 50%» nhưng thực chất tăng giá gốc lên rồi mới giảm. Hành vi này vi phạm", "options": ["A. chức năng cung cấp thông tin trung thực của thị trường.", "B. quy luật tự nhiên.", "C. quyền được giảm giá của cửa hàng.", "D. chức năng sản xuất của thị trường."], "answer": "A", "explain": "Gian lận giá cả làm méo mó thông tin thị trường, vi phạm nguyên tắc trung thực trong trao đổi và quyền được thông tin đúng của người tiêu dùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để phát huy chức năng cung cấp thông tin của thị trường, người tiêu dùng cần", "options": ["A. mua hàng theo cảm tính, không tìm hiểu.", "B. chủ động tìm hiểu, so sánh giá cả, chất lượng.", "C. chỉ mua ở một cửa hàng duy nhất.", "D. không quan tâm đến giá cả."], "answer": "B", "explain": "Chủ động tìm hiểu, so sánh thông tin giúp người tiêu dùng ra quyết định đúng đắn, phát huy chức năng cung cấp thông tin của thị trường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Thấy nhu cầu thuê trọ của sinh viên tăng, nhiều hộ dân xây thêm phòng trọ cho thuê. Đây là biểu hiện của chức năng", "options": ["A. điều tiết sản xuất (cung ứng dịch vụ).", "B. thu thuế.", "C. phân phối thu nhập.", "D. in tiền."], "answer": "A", "explain": "Nhu cầu thị trường (thông tin) đã điều tiết hoạt động cung ứng dịch vụ trọ — chức năng điều tiết sản xuất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một hãng nước giải khát tung sản phẩm mới nhưng người tiêu dùng chê vị quá ngọt, doanh số thấp, hãng phải cải tiến công thức. Quá trình này thể hiện đồng thời các chức năng nào?", "options": ["A. Cung cấp thông tin và thừa nhận giá trị xã hội của hàng hóa.", "B. Thu thuế và phân phối thu nhập.", "C. In tiền và ban hành luật.", "D. Sản xuất và tiêu dùng trực tiếp."], "answer": "A", "explain": "Phản hồi của người tiêu dùng là thông tin thị trường; việc sản phẩm bị chê, buộc cải tiến thể hiện thị trường thừa nhận/không thừa nhận giá trị sản phẩm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thị trường vừa là nơi mua bán vừa là «trọng tài» phán xét sản phẩm.", "b) Thị trường là «người dẫn đường» cho sản xuất qua thông tin giá cả.", "c) Mọi sản phẩm đưa ra thị trường đều được thừa nhận.", "d) Sản phẩm phù hợp nhu cầu thì được thị trường thừa nhận."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: sản phẩm kém chất lượng, giá cao sẽ bị đào thải.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Gian lận giá cả làm méo mó thông tin thị trường.", "b) Người tiêu dùng chủ động tìm hiểu thông tin giúp thị trường vận hành tốt hơn.", "c) Thị trường tự động đảm bảo mọi giao dịch đều trung thực.", "d) Pháp luật bảo vệ quyền được thông tin đúng của người tiêu dùng."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: vẫn có gian lận nên cần pháp luật và người tiêu dùng thông minh.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Thị trường là ... phán xét sản phẩm và người dẫn đường cho sản xuất».", "answer": "trọng tài", "explain": "Thị trường vừa là nơi mua bán, vừa là «trọng tài» phán xét sản phẩm và «người dẫn đường» cho sản xuất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một chợ có 30 sạp bán rau, 20 sạp bán thịt, 10 sạp bán cá. Tổng số sạp hàng trong chợ là bao nhiêu?", "answer": "60", "explain": "Tổng số sạp = 30 + 20 + 10 = 60 sạp.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Hàng hóa trên thị trường có đặc điểm", "options": ["A. được mua bán, trao đổi.", "B. không bao giờ được mua bán.", "C. chỉ để trưng bày.", "D. tự biến mất khỏi thị trường."], "answer": "A", "explain": "Hàng hóa là đối tượng của quan hệ mua bán, trao đổi trên thị trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dịch vụ nào sau đây được mua bán trên thị trường dịch vụ?", "options": ["A. Dịch vụ cắt tóc, sửa xe.", "B. Không khí để thở.", "C. Ánh nắng mặt trời.", "D. Nước mưa tự nhiên."], "answer": "A", "explain": "Cắt tóc, sửa xe là dịch vụ do con người cung ứng và được mua bán trên thị trường dịch vụ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người thợ sửa xe máy vừa sửa xe cho khách vừa bán phụ tùng thay thế. Người thợ này tham gia", "options": ["A. chỉ thị trường hàng hóa.", "B. chỉ thị trường dịch vụ.", "C. cả thị trường hàng hóa và thị trường dịch vụ.", "D. không tham gia thị trường nào."], "answer": "C", "explain": "Bán phụ tùng là tham gia thị trường hàng hóa; sửa xe cho khách là tham gia thị trường dịch vụ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thị trường nào sau đây thuộc thị trường dịch vụ?", "options": ["A. Thị trường gạo.", "B. Thị trường vận tải hành khách.", "C. Thị trường sắt thép.", "D. Thị trường vải vóc."], "answer": "B", "explain": "Vận tải hành khách là dịch vụ nên thuộc thị trường dịch vụ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Anh Tuấn mở tiệm sửa điện thoại, đồng thời bán ốp lưng, kính cường lực. Để mở rộng, anh nên quan tâm đến thông tin nào của thị trường?", "options": ["A. Nhu cầu sửa chữa và phụ kiện của khách hàng, giá cả của đối thủ.", "B. Thời tiết ngày mai.", "C. Giá vàng thế giới.", "D. Lịch thi đấu bóng đá."], "answer": "A", "explain": "Thông tin thị trường liên quan trực tiếp (nhu cầu khách hàng, giá đối thủ) giúp anh Tuấn ra quyết định kinh doanh đúng đắn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một ứng dụng đặt đồ ăn thu phí chiết khấu từ nhà hàng và phí giao hàng từ khách. Ứng dụng này hoạt động trên thị trường nào và với vai trò gì?", "options": ["A. Thị trường dịch vụ, vai trò chủ thể trung gian.", "B. Thị trường hàng hóa, vai trò chủ thể sản xuất.", "C. Thị trường vốn, vai trò Nhà nước.", "D. Thị trường lao động, vai trò người mua."], "answer": "A", "explain": "Ứng dụng cung cấp dịch vụ kết nối (thị trường dịch vụ) giữa nhà hàng và khách hàng nên là chủ thể trung gian.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thị trường dịch vụ mua bán các hoạt động phục vụ nhu cầu con người.", "b) Cắt tóc, khám bệnh là dịch vụ trên thị trường.", "c) Hàng hóa và dịch vụ đều là đối tượng mua bán.", "d) Dịch vụ không thể được mua bán trên thị trường."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: dịch vụ là đối tượng mua bán của thị trường dịch vụ.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Một người có thể tham gia nhiều loại thị trường cùng lúc.", "b) Thông tin thị trường giúp người kinh doanh ra quyết định đúng.", "c) Chỉ doanh nghiệp lớn mới cần quan tâm thông tin thị trường.", "d) Thị trường dịch vụ ngày càng phát triển trong nền kinh tế hiện đại."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: mọi chủ thể kinh doanh, kể cả hộ nhỏ lẻ, đều cần thông tin thị trường.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Hàng hóa, dịch vụ là ... của quan hệ mua bán trên thị trường».", "answer": "đối tượng", "explain": "Hàng hóa, dịch vụ là đối tượng của quan hệ mua bán trên thị trường.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một cửa hàng bán mỗi ngày 50 ly trà sữa giá 25 nghìn đồng mỗi ly. Doanh thu một ngày của cửa hàng là bao nhiêu nghìn đồng?", "answer": "1250", "explain": "Doanh thu = 50 × 25 = 1 250 nghìn đồng.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Thị trường nội địa là thị trường", "options": ["A. trong phạm vi một quốc gia.", "B. trên toàn thế giới.", "C. chỉ trong một làng.", "D. trên mặt trăng."], "answer": "A", "explain": "Thị trường nội địa là thị trường trong phạm vi một quốc gia.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xuất khẩu hàng hóa là hoạt động tham gia", "options": ["A. thị trường nội địa.", "B. thị trường thế giới.", "C. thị trường lao động nội bộ.", "D. thị trường vốn gia đình."], "answer": "B", "explain": "Xuất khẩu là bán hàng ra nước ngoài, tham gia thị trường thế giới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiệp định thương mại tự do giúp hàng hóa Việt Nam dễ dàng vào thị trường các nước thành viên. Điều này mở rộng", "options": ["A. thị trường khu vực và thế giới cho hàng Việt Nam.", "B. thị trường nội địa duy nhất.", "C. thị trường lao động trong nước.", "D. thị trường vốn gia đình."], "answer": "A", "explain": "Hiệp định thương mại tự do mở rộng phạm vi thị trường từ nội địa ra khu vực và thế giới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một công ty chỉ bán hàng trong nước, chưa xuất khẩu. Công ty đang hoạt động chủ yếu trên", "options": ["A. thị trường nội địa.", "B. thị trường thế giới.", "C. thị trường vốn quốc tế.", "D. thị trường lao động nước ngoài."], "answer": "A", "explain": "Chỉ bán hàng trong nước là hoạt động trên thị trường nội địa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Dịch bệnh làm đứt gãy chuỗi cung ứng toàn cầu, giá nguyên liệu nhập khẩu tăng cao. Điều này ảnh hưởng đến doanh nghiệp trong nước vì", "options": ["A. thị trường nội địa gắn với thị trường thế giới.", "B. doanh nghiệp trong nước không cần nguyên liệu.", "C. giá cả trong nước hoàn toàn độc lập.", "D. thị trường thế giới không tồn tại."], "answer": "A", "explain": "Trong hội nhập, thị trường nội địa gắn chặt với thị trường thế giới nên biến động toàn cầu tác động đến trong nước.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Việt Nam tham gia nhiều hiệp định thương mại tự do thế hệ mới. Lợi ích lớn nhất về thị trường là", "options": ["A. hàng hóa Việt Nam tiếp cận thị trường rộng lớn với thuế suất ưu đãi.", "B. Việt Nam không cần sản xuất gì nữa.", "C. mọi hàng hóa nước ngoài bị cấm vào Việt Nam.", "D. thị trường nội địa bị xóa bỏ."], "answer": "A", "explain": "Hiệp định thương mại tự do giúp hàng Việt Nam vào thị trường các nước với thuế suất ưu đãi, mở rộng thị trường tiêu thụ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thị trường nội địa nằm trong phạm vi một quốc gia.", "b) Xuất khẩu là tham gia thị trường thế giới.", "c) Thị trường khu vực như ASEAN nằm giữa nội địa và thế giới.", "d) Thị trường nội địa tồn tại biệt lập với thế giới."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: trong hội nhập, thị trường nội địa gắn với thị trường khu vực và thế giới.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hội nhập giúp mở rộng thị trường cho hàng hóa Việt Nam.", "b) Biến động thị trường thế giới có thể ảnh hưởng giá cả trong nước.", "c) Doanh nghiệp chỉ cần quan tâm thị trường nội địa là đủ.", "d) Xuất khẩu góp phần tăng thu ngoại tệ cho đất nước."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: trong hội nhập, doanh nghiệp cần quan tâm cả thị trường khu vực, thế giới.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Theo phạm vi có thị trường nội địa, thị trường khu vực và thị trường ...».", "answer": "thế giới", "explain": "Theo phạm vi: thị trường nội địa, thị trường khu vực, thị trường thế giới.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một doanh nghiệp xuất khẩu 3 container hàng, mỗi container trị giá 500 triệu đồng. Tổng giá trị xuất khẩu là bao nhiêu triệu đồng?", "answer": "1500", "explain": "Tổng giá trị = 3 × 500 = 1 500 triệu đồng.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Thị trường cạnh tranh là thị trường", "options": ["A. có nhiều người bán cùng loại hàng hóa.", "B. chỉ có một người bán duy nhất.", "C. không có người mua.", "D. Nhà nước cấm mua bán."], "answer": "A", "explain": "Thị trường cạnh tranh có nhiều người bán cùng loại hàng hóa, cạnh tranh với nhau về giá cả, chất lượng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thị trường độc quyền là thị trường", "options": ["A. có nhiều người bán.", "B. chỉ có một hoặc rất ít người bán chi phối.", "C. không có hàng hóa.", "D. miễn phí mọi thứ."], "answer": "B", "explain": "Thị trường độc quyền chỉ có một hoặc rất ít người bán chi phối thị trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chợ rau quả với hàng trăm tiểu thương cùng bán rau là ví dụ của", "options": ["A. thị trường cạnh tranh.", "B. thị trường độc quyền.", "C. thị trường vốn.", "D. thị trường lao động."], "answer": "A", "explain": "Nhiều người bán cùng loại hàng hóa, cạnh tranh về giá và chất lượng là thị trường cạnh tranh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên thị trường cạnh tranh, người tiêu dùng được hưởng lợi vì", "options": ["A. người bán phải cạnh tranh bằng giá rẻ hơn, chất lượng tốt hơn.", "B. chỉ có một mức giá duy nhất.", "C. không có sự lựa chọn nào.", "D. hàng hóa luôn khan hiếm."], "answer": "A", "explain": "Cạnh tranh buộc người bán hạ giá, nâng chất lượng để thu hút khách — người tiêu dùng được hưởng lợi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một doanh nghiệp lớn dùng giá rẻ bất thường để loại bỏ đối thủ nhỏ, rồi tăng giá khi đã chiếm lĩnh thị trường. Hành vi này", "options": ["A. là cạnh tranh lành mạnh cần khuyến khích.", "B. là cạnh tranh không lành mạnh, cần bị xử lí.", "C. không ảnh hưởng gì đến thị trường.", "D. giúp người tiêu dùng mãi mãi."], "answer": "B", "explain": "Bán phá giá để loại đối thủ rồi tăng giá là cạnh tranh không lành mạnh, vi phạm pháp luật cạnh tranh, gây hại cho thị trường và người tiêu dùng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nhà nước kiểm soát giá điện, không để doanh nghiệp điện lực tự ý tăng giá. Biện pháp này nhằm", "options": ["A. hạn chế mặt trái của thị trường độc quyền, bảo vệ người tiêu dùng.", "B. xóa bỏ hoàn toàn thị trường điện.", "C. tăng lợi nhuận cho doanh nghiệp độc quyền.", "D. khuyến khích độc quyền tăng giá."], "answer": "A", "explain": "Thị trường độc quyền dễ dẫn đến giá cao, chất lượng kém nên Nhà nước phải điều tiết, bảo vệ người tiêu dùng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thị trường cạnh tranh có nhiều người bán.", "b) Thị trường độc quyền do một hoặc ít người bán chi phối.", "c) Cạnh tranh lành mạnh có lợi cho người tiêu dùng.", "d) Mọi hành vi cạnh tranh đều tốt và cần khuyến khích."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: cạnh tranh không lành mạnh (bán phá giá, hàng giả...) gây hại và bị pháp luật xử lí.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bán phá giá để loại đối thủ là cạnh tranh không lành mạnh.", "b) Nhà nước cần điều tiết thị trường độc quyền.", "c) Cạnh tranh thúc đẩy doanh nghiệp đổi mới.", "d) Trên thị trường độc quyền, người mua có nhiều lựa chọn."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thị trường độc quyền ít người bán nên người mua ít lựa chọn.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Theo tính chất cạnh tranh có thị trường cạnh tranh và thị trường ...».", "answer": "độc quyền", "explain": "Theo tính chất cạnh tranh: thị trường cạnh tranh và thị trường độc quyền.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một khu chợ có 5 sạp bán cùng loại bánh mì với giá khác nhau. Đây là biểu hiện của thị trường gì? Trả lời: «thị trường ...».", "answer": "thị trường cạnh tranh", "explain": "Nhiều người bán cùng loại hàng hóa cạnh tranh về giá là thị trường cạnh tranh.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Câu nói «thị trường là người dẫn đường cho sản xuất» muốn nhấn mạnh chức năng", "options": ["A. cung cấp thông tin, điều tiết sản xuất.", "B. thu thuế.", "C. in tiền.", "D. ban hành pháp luật."], "answer": "A", "explain": "Thông tin từ thị trường dẫn dắt, định hướng cho sản xuất — chức năng cung cấp thông tin và điều tiết sản xuất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để thành công trên thị trường, người sản xuất cần", "options": ["A. nắm bắt thông tin thị trường, nâng cao chất lượng, hạ giá thành.", "B. phớt lờ nhu cầu người tiêu dùng.", "C. sản xuất hàng kém chất lượng giá cao.", "D. gian lận trong mua bán."], "answer": "A", "explain": "Nắm thông tin thị trường, nâng chất lượng, hạ giá thành, đổi mới là cách tồn tại và phát triển trên thị trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bạn học sinh muốn mở gian hàng bán đồ handmade online. Việc đầu tiên bạn nên làm theo chức năng thị trường là", "options": ["A. tìm hiểu nhu cầu, giá cả các sản phẩm tương tự trên thị trường.", "B. nhập thật nhiều hàng về bán ngay.", "C. đặt giá thật cao để lãi nhiều.", "D. không cần quan tâm đối thủ."], "answer": "A", "explain": "Tìm hiểu nhu cầu, giá cả là khai thác chức năng cung cấp thông tin của thị trường trước khi kinh doanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi mua hàng online, người tiêu dùng thông minh nên", "options": ["A. đọc đánh giá của người mua trước, so sánh giá giữa các shop.", "B. mua ngay không cần xem gì.", "C. chỉ chọn shop có giá rẻ nhất bất chấp uy tín.", "D. chuyển tiền trước cho người lạ."], "answer": "A", "explain": "Đọc đánh giá, so sánh giá là khai thác thông tin thị trường để mua hàng an toàn, hợp lí.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Làng nghề truyền thống làm gốm đứng trước nguy cơ mai một vì hàng nhựa, inox giá rẻ. Để tồn tại, làng nghề cần", "options": ["A. đổi mới mẫu mã, nâng cao chất lượng, tìm thị trường ngách.", "B. giữ nguyên mọi thứ, chờ thị trường tự thay đổi.", "C. sản xuất hàng kém chất lượng hơn để rẻ hơn.", "D. ngừng quan tâm đến nhu cầu khách hàng."], "answer": "A", "explain": "Đổi mới, nâng chất lượng, tìm thị trường ngách là cách thích ứng với sự «phán quyết» của thị trường, phát huy chức năng kích thích đổi mới.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Chính quyền địa phương tổ chức hội chợ nông sản giúp nông dân bán hàng trực tiếp, đồng thời mời doanh nghiệp kí hợp đồng bao tiêu. Hội chợ này phát huy vai trò nào?", "options": ["A. Tạo thị trường, kết nối cung – cầu, cung cấp thông tin hai chiều.", "B. Thay thế hoàn toàn thị trường tự do.", "C. Ấn định giá cả mọi mặt hàng.", "D. Cấm nông dân bán hàng nơi khác."], "answer": "A", "explain": "Hội chợ tạo không gian thị trường, kết nối nông dân với người mua, doanh nghiệp — cung cấp thông tin và thúc đẩy trao đổi.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Người kinh doanh cần nắm bắt thông tin thị trường.", "b) Người tiêu dùng nên so sánh giá cả, chất lượng trước khi mua.", "c) Thị trường đào thải sản phẩm không phù hợp nhu cầu.", "d) Trên thị trường, ai cũng thành công mà không cần nỗ lực."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: phải nỗ lực nâng chất lượng, đổi mới mới tồn tại được trên thị trường.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hội chợ, triển lãm giúp kết nối cung – cầu.", "b) Đổi mới mẫu mã giúp doanh nghiệp thích ứng với thị trường.", "c) Bỏ qua thông tin thị trường dễ dẫn đến thua lỗ.", "d) Thị trường chỉ có lợi cho người bán."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thị trường mang lại lợi ích cho cả người bán (tiêu thụ) và người mua (lựa chọn, giá tốt).", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Mẹo nhớ 4 chức năng của thị trường: Thông tin – Thừa nhận – Điều tiết – ...».", "answer": "Thúc đẩy", "explain": "Bốn chức năng: cung cấp thông tin; thừa nhận giá trị xã hội; điều tiết sản xuất – tiêu dùng; kích thích cạnh tranh, đổi mới.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Có 4 yếu tố cơ bản và 4 chức năng cơ bản của thị trường. Tổng số «4» này cộng lại bằng bao nhiêu?", "answer": "8", "explain": "4 yếu tố + 4 chức năng = 8.", "points": 0.5}]}]}
