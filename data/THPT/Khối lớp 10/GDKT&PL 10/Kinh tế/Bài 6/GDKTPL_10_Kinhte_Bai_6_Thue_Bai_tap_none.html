vel": "NB", "q": "Vai trò nào sau đây thuộc về thuế?", "options": ["A. Nguồn thu chủ yếu của ngân sách nhà nước.", "B. In tiền cho nền kinh tế.", "C. Trực tiếp sản xuất hàng hóa.", "D. Thay thế pháp luật."], "answer": "A", "explain": "Thuế là nguồn thu chủ yếu, ổn định nhất của ngân sách nhà nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thuế giúp Nhà nước điều tiết vĩ mô bằng cách", "options": ["A. tăng, giảm thuế để khuyến khích hoặc hạn chế ngành nghề.", "B. cấm mọi hoạt động kinh doanh.", "C. in thêm tiền.", "D. không thu thuế của ai."], "answer": "A", "explain": "Tăng/giảm thuế để khuyến khích hoặc hạn chế ngành nghề là vai trò điều tiết vĩ mô của thuế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhà nước đánh thuế cao với thuốc lá, rượu bia nhằm", "options": ["A. hạn chế tiêu dùng có hại cho sức khỏe.", "B. khuyến khích mọi người hút thuốc.", "C. tăng lợi nhuận cho nhà sản xuất.", "D. giảm thu ngân sách."], "answer": "A", "explain": "Thuế cao với hàng hóa có hại là công cụ điều tiết: hạn chế tiêu dùng, bảo vệ sức khỏe cộng đồng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhà nước miễn, giảm thuế cho doanh nghiệp đầu tư vào vùng khó khăn nhằm", "options": ["A. khuyến khích đầu tư, phát triển vùng khó khăn.", "B. làm tăng phân hóa giàu nghèo.", "C. hạn chế đầu tư.", "D. tăng thu ngân sách ngay."], "answer": "A", "explain": "Ưu đãi thuế khuyến khích doanh nghiệp đầu tư vào vùng khó khăn, góp phần phát triển cân bằng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Thuế thu nhập cá nhân lũy tiến (thu nhập càng cao, thuế suất càng cao) góp phần", "options": ["A. điều tiết thu nhập, giảm chênh lệch giàu nghèo.", "B. làm tăng chênh lệch giàu nghèo.", "C. miễn thuế cho người giàu.", "D. không ảnh hưởng đến xã hội."], "answer": "A", "explain": "Thuế lũy tiến đánh nặng hơn vào người thu nhập cao, góp phần điều tiết thu nhập, thực hiện công bằng xã hội.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khi kinh tế suy thoái, Nhà nước giảm thuế cho doanh nghiệp và người dân. Biện pháp này", "options": ["A. kích thích sản xuất, tiêu dùng, phục hồi tăng trưởng.", "B. làm kinh tế suy thoái nặng hơn.", "C. không có tác dụng gì.", "D. chỉ có lợi cho người giàu."], "answer": "A", "explain": "Giảm thuế khi suy thoái giúp doanh nghiệp giảm chi phí, người dân tăng chi tiêu — kích thích phục hồi kinh tế.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về vai trò của thuế:", "statements": ["a) Thuế là nguồn thu chủ yếu của ngân sách.", "b) Thuế là công cụ điều tiết vĩ mô.", "c) Thuế góp phần thực hiện công bằng xã hội.", "d) Thuế không có vai trò gì với nền kinh tế."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thuế có vai trò rất quan trọng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thuế cao với thuốc lá hạn chế tiêu dùng có hại.", "b) Ưu đãi thuế khuyến khích đầu tư vùng khó khăn.", "c) Thuế lũy tiến giảm chênh lệch giàu nghèo.", "d) Giảm thuế khi suy thoái giúp kích thích kinh tế."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng theo vai trò điều tiết của thuế.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Thuế là ... điều tiết vĩ mô của Nhà nước».", "answer": "công cụ", "explain": "Thuế là công cụ điều tiết vĩ mô của Nhà nước.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thuế thu nhập cá nhân áp dụng theo biểu lũy tiến: thu nhập càng cao thì thuế suất càng ... Điền từ còn thiếu.", "answer": "cao", "explain": "Thuế lũy tiến: thu nhập càng cao, thuế suất càng cao.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Thuế trực thu là thuế đánh vào", "options": ["A. thu nhập, tài sản của tổ chức, cá nhân.", "B. hàng hóa khi mua sắm.", "C. dịch vụ vận tải.", "D. tiền mừng tuổi."], "answer": "A", "explain": "Thuế trực thu đánh trực tiếp vào thu nhập, tài sản của tổ chức, cá nhân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thuế gián thu là thuế đánh vào", "options": ["A. thu nhập cá nhân.", "B. hàng hóa, dịch vụ tiêu dùng.", "C. tài sản thừa kế duy nhất.", "D. tiền lương."], "answer": "B", "explain": "Thuế gián thu đánh vào hàng hóa, dịch vụ tiêu dùng; người mua chịu nhưng người bán nộp hộ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Loại thuế nào sau đây là thuế trực thu?", "options": ["A. Thuế thu nhập doanh nghiệp.", "B. Thuế giá trị gia tăng.", "C. Thuế tiêu thụ đặc biệt.", "D. Thuế xuất khẩu."], "answer": "A", "explain": "Thuế thu nhập doanh nghiệp đánh vào thu nhập của doanh nghiệp nên là thuế trực thu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Loại thuế nào sau đây là thuế gián thu?", "options": ["A. Thuế thu nhập cá nhân.", "B. Thuế giá trị gia tăng.", "C. Thuế thu nhập doanh nghiệp.", "D. Thuế tài sản."], "answer": "B", "explain": "Thuế giá trị gia tăng đánh vào hàng hóa, dịch vụ tiêu dùng nên là thuế gián thu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Khi mua một chiếc điện thoại giá 10 triệu đồng đã bao gồm thuế giá trị gia tăng, người mua đã", "options": ["A. chịu thuế gián thu, cửa hàng nộp hộ vào ngân sách.", "B. nộp thuế trực thu.", "C. không phải chịu thuế gì.", "D. được miễn thuế."], "answer": "A", "explain": "Thuế giá trị gia tăng «giấu» trong giá bán: người mua chịu, người bán nộp hộ — thuế gián thu.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một công ty có lợi nhuận 2 tỉ đồng, thuế suất thuế thu nhập doanh nghiệp là 20 phần trăm. Số thuế công ty phải nộp là", "options": ["A. 400 triệu đồng.", "B. 2 tỉ đồng.", "C. 40 triệu đồng.", "D. 4 tỉ đồng."], "answer": "A", "explain": "Thuế = 2 tỉ × 20 phần trăm = 400 triệu đồng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thuế trực thu đánh vào thu nhập, tài sản.", "b) Thuế gián thu đánh vào hàng hóa, dịch vụ.", "c) Thuế thu nhập cá nhân là thuế trực thu.", "d) Thuế giá trị gia tăng là thuế trực thu."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thuế giá trị gia tăng là thuế gián thu.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thuế tiêu thụ đặc biệt là thuế gián thu.", "b) Thuế xuất nhập khẩu là thuế gián thu.", "c) Người mua chịu thuế gián thu qua giá hàng hóa.", "d) Người bán nộp hộ thuế gián thu vào ngân sách."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng theo đặc điểm của thuế gián thu.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Thuế ... thu đánh trực tiếp vào thu nhập, tài sản của người nộp».", "answer": "trực", "explain": "Thuế trực thu đánh trực tiếp vào thu nhập, tài sản của tổ chức, cá nhân.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thuế giá trị gia tăng «giấu» trong giá hàng hóa nên được xếp vào thuế ... thu. Điền từ còn thiếu.", "answer": "gián", "explain": "Thuế giá trị gia tăng là thuế gián thu.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Nghĩa vụ của người nộp thuế là", "options": ["A. kê khai trung thực, nộp thuế đầy đủ, đúng hạn.", "B. kê khai gian dối để nộp ít.", "C. trốn thuế.", "D. không cần quan tâm đến thuế."], "answer": "A", "explain": "Người nộp thuế phải kê khai trung thực, nộp thuế đầy đủ, đúng hạn và chấp hành kiểm tra, thanh tra thuế.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quyền nào sau đây thuộc về người nộp thuế?", "options": ["A. Được hướng dẫn về chính sách thuế; được bảo mật thông tin.", "B. Được miễn mọi loại thuế.", "C. Được tự đặt mức thuế.", "D. Được từ chối nộp thuế."], "answer": "A", "explain": "Người nộp thuế được hướng dẫn, giải đáp chính sách thuế; được bảo mật thông tin; được khiếu nại, tố cáo; được hưởng ưu đãi theo quy định.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi bị cơ quan thuế xử phạt oan, người nộp thuế có quyền", "options": ["A. khiếu nại, tố cáo theo quy định pháp luật.", "B. chống đối bằng bạo lực.", "C. bỏ trốn.", "D. im lặng chịu phạt oan."], "answer": "A", "explain": "Người nộp thuế có quyền khiếu nại, tố cáo khi bị xử lí sai theo quy định pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hành vi trốn thuế, gian lận thuế sẽ", "options": ["A. bị xử phạt hành chính hoặc truy cứu trách nhiệm hình sự.", "B. được khen thưởng.", "C. không bị xử lí.", "D. được giảm thuế."], "answer": "A", "explain": "Trốn thuế, gian lận thuế là vi phạm pháp luật, bị xử phạt hành chính hoặc truy cứu trách nhiệm hình sự.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một hộ kinh doanh kê khai doanh thu thấp hơn thực tế để nộp thuế ít hơn. Hành vi này", "options": ["A. vi phạm nghĩa vụ kê khai trung thực, là gian lận thuế.", "B. là quyền của hộ kinh doanh.", "C. giúp tăng thu ngân sách.", "D. không vi phạm gì."], "answer": "A", "explain": "Kê khai không trung thực để nộp thuế ít hơn là gian lận thuế, vi phạm pháp luật.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Doanh nghiệp được giảm thuế khi đầu tư vào địa bàn khó khăn. Đây là", "options": ["A. quyền được hưởng ưu đãi thuế theo quy định.", "B. hành vi trốn thuế.", "C. sự thiên vị bất hợp pháp.", "D. không liên quan đến thuế."], "answer": "A", "explain": "Được hưởng ưu đãi, miễn giảm thuế theo quy định là quyền của người nộp thuế.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Người nộp thuế phải kê khai trung thực.", "b) Người nộp thuế phải nộp thuế đúng hạn.", "c) Người nộp thuế được bảo mật thông tin.", "d) Người nộp thuế được tự ý không nộp thuế."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: nộp thuế là nghĩa vụ bắt buộc.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trốn thuế bị xử phạt theo pháp luật.", "b) Gian lận thuế có thể bị truy cứu hình sự.", "c) Người nộp thuế được khiếu nại khi bị xử lí sai.", "d) Kê khai gian dối là quyền của doanh nghiệp."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: kê khai trung thực là nghĩa vụ.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Kê khai ..., nộp thuế đầy đủ, đúng hạn là nghĩa vụ của người nộp thuế».", "answer": "trung thực", "explain": "Người nộp thuế phải kê khai trung thực, nộp thuế đầy đủ, đúng hạn.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hành vi cố tình không nộp thuế theo quy định được gọi là trốn ... Điền từ còn thiếu.", "answer": "thuế", "explain": "Trốn thuế là hành vi vi phạm pháp luật, bị xử phạt.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Thuế tiêu thụ đặc biệt đánh vào", "options": ["A. hàng hóa, dịch vụ đặc biệt cần điều tiết như thuốc lá, rượu bia, ô tô.", "B. mọi loại rau quả.", "C. tiền lương của công nhân.", "D. sách giáo khoa."], "answer": "A", "explain": "Thuế tiêu thụ đặc biệt đánh vào hàng hóa, dịch vụ đặc biệt cần điều tiết tiêu dùng như thuốc lá, rượu bia, ô tô, dịch vụ karaoke...", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thuế xuất nhập khẩu đánh vào", "options": ["A. hàng hóa xuất khẩu, nhập khẩu qua biên giới.", "B. hàng hóa bán trong nước.", "C. tiền lương.", "D. dịch vụ cắt tóc."], "answer": "A", "explain": "Thuế xuất nhập khẩu đánh vào hàng hóa xuất khẩu, nhập khẩu qua biên giới quốc gia.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Nhà nước đánh thuế tiêu thụ đặc biệt cao với rượu bia?", "options": ["A. Để hạn chế tiêu dùng có hại, bảo vệ sức khỏe cộng đồng.", "B. Để khuyến khích uống nhiều rượu bia.", "C. Để tăng lợi nhuận cho nhà sản xuất.", "D. Để giảm thu ngân sách."], "answer": "A", "explain": "Thuế tiêu thụ đặc biệt cao với rượu bia, thuốc lá là công cụ điều tiết: hạn chế tiêu dùng có hại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thuế nhập khẩu cao với một số mặt hàng nhằm", "options": ["A. bảo hộ sản xuất trong nước.", "B. cấm hoàn toàn hàng nhập khẩu.", "C. làm hàng nhập khẩu rẻ hơn.", "D. giảm thu ngân sách."], "answer": "A", "explain": "Thuế nhập khẩu cao làm hàng nhập đắt hơn, bảo hộ sản xuất trong nước cạnh tranh được.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một chiếc ô tô nhập khẩu chịu nhiều loại thuế khiến giá bán cao gấp đôi giá gốc. Điều này cho thấy thuế nhập khẩu và tiêu thụ đặc biệt", "options": ["A. điều tiết tiêu dùng hàng xa xỉ, bảo hộ sản xuất trong nước.", "B. không ảnh hưởng đến giá cả.", "C. khuyến khích mua ô tô nhập khẩu.", "D. làm giảm thu ngân sách."], "answer": "A", "explain": "Thuế cao với ô tô nhập khẩu vừa điều tiết tiêu dùng hàng xa xỉ, vừa bảo hộ sản xuất trong nước, vừa tăng thu ngân sách.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khi tham gia hiệp định thương mại tự do, thuế nhập khẩu nhiều mặt hàng giảm về 0 phần trăm. Tác động tích cực là", "options": ["A. người tiêu dùng được mua hàng nhập khẩu giá rẻ hơn.", "B. hàng nhập khẩu bị cấm hoàn toàn.", "C. giá hàng nhập khẩu tăng cao.", "D. doanh nghiệp trong nước không cần cạnh tranh."], "answer": "A", "explain": "Giảm thuế nhập khẩu làm hàng nhập rẻ hơn, người tiêu dùng được lợi; đồng thời thúc đẩy cạnh tranh.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thuế tiêu thụ đặc biệt là thuế gián thu.", "b) Thuế xuất nhập khẩu là thuế gián thu.", "c) Thuế tiêu thụ đặc biệt đánh vào rượu bia, thuốc lá.", "d) Mọi hàng hóa đều chịu thuế tiêu thụ đặc biệt."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: chỉ hàng hóa, dịch vụ đặc biệt mới chịu thuế tiêu thụ đặc biệt.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thuế nhập khẩu cao bảo hộ sản xuất trong nước.", "b) Thuế tiêu thụ đặc biệt hạn chế tiêu dùng có hại.", "c) Giảm thuế nhập khẩu làm hàng nhập rẻ hơn.", "d) Thuế xuất nhập khẩu đánh vào hàng bán trong nước."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thuế xuất nhập khẩu đánh vào hàng hóa qua biên giới.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Thuế ... đặc biệt đánh vào hàng hóa, dịch vụ đặc biệt cần điều tiết».", "answer": "tiêu thụ", "explain": "Thuế tiêu thụ đặc biệt đánh vào hàng hóa, dịch vụ đặc biệt như thuốc lá, rượu bia, ô tô.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thuế đánh vào hàng hóa xuất khẩu, nhập khẩu qua biên giới gọi là thuế xuất ... Điền từ còn thiếu.", "answer": "nhập khẩu", "explain": "Thuế xuất nhập khẩu đánh vào hàng hóa xuất khẩu, nhập khẩu qua biên giới.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Câu nói «thuế là nguồn sữa nuôi bộ máy nhà nước» muốn nhấn mạnh", "options": ["A. thuế là nguồn thu chủ yếu của ngân sách nhà nước.", "B. thuế chỉ để nuôi cán bộ.", "C. thuế không quan trọng.", "D. thuế là tiền cho vay."], "answer": "A", "explain": "Thuế là nguồn thu chủ yếu, ổn định nhất của ngân sách nhà nước — «nguồn sữa» nuôi mọi hoạt động của Nhà nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người nộp thuế bao gồm", "options": ["A. tổ chức, cá nhân thuộc diện chịu thuế theo pháp luật.", "B. chỉ có doanh nghiệp nhà nước.", "C. chỉ có người nước ngoài.", "D. chỉ có học sinh."], "answer": "A", "explain": "Mọi tổ chức, cá nhân có thu nhập, tài sản, hàng hóa thuộc diện chịu thuế đều là người nộp thuế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một công nhân có thu nhập từ tiền lương. Công nhân này", "options": ["A. thuộc diện nộp thuế thu nhập cá nhân nếu thu nhập đến mức chịu thuế.", "B. không bao giờ phải nộp thuế.", "C. chỉ nộp thuế khi làm giám đốc.", "D. được miễn mọi loại thuế."], "answer": "A", "explain": "Người có thu nhập từ tiền lương thuộc diện nộp thuế thu nhập cá nhân khi thu nhập đến mức chịu thuế theo quy định.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hóa đơn mua hàng thường ghi «đã bao gồm thuế giá trị gia tăng». Điều này cho thấy", "options": ["A. người mua đã chịu thuế gián thu qua giá hàng hóa.", "B. người mua được miễn thuế.", "C. cửa hàng không phải nộp thuế.", "D. thuế giá trị gia tăng là thuế trực thu."], "answer": "A", "explain": "Thuế giá trị gia tăng đã tính trong giá bán: người mua chịu, cửa hàng nộp hộ — thuế gián thu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Chị Lan bán hàng online nhưng không kê khai thuế dù doanh thu lớn. Hành vi này", "options": ["A. là trốn thuế, vi phạm pháp luật.", "B. là quyền của người bán online.", "C. giúp tăng thu ngân sách.", "D. không ai có thể phát hiện."], "answer": "A", "explain": "Kinh doanh online có doanh thu thuộc diện chịu thuế mà không kê khai là trốn thuế, vi phạm pháp luật.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nhà nước triển khai hóa đơn điện tử, kết nối dữ liệu bán hàng để chống thất thu thuế. Biện pháp này", "options": ["A. giúp thu đúng, thu đủ, công bằng giữa các hộ kinh doanh.", "B. làm tăng gánh nặng cho người nộp thuế chân chính.", "C. khuyến khích trốn thuế.", "D. không liên quan đến thuế."], "answer": "A", "explain": "Hóa đơn điện tử giúp cơ quan thuế nắm doanh thu thực tế, chống gian lận, đảm bảo công bằng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mọi tổ chức, cá nhân thuộc diện chịu thuế đều phải nộp thuế.", "b) Bán hàng online có doanh thu lớn phải kê khai thuế.", "c) Hóa đơn điện tử giúp chống thất thu thuế.", "d) Chỉ doanh nghiệp lớn mới phải nộp thuế."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: mọi tổ chức, cá nhân thuộc diện chịu thuế đều phải nộp.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Không kê khai thuế khi có doanh thu là trốn thuế.", "b) Chống thất thu thuế đảm bảo công bằng.", "c) Người nộp thuế chân chính không bị tăng gánh nặng khi chống gian lận.", "d) Bán hàng online được miễn mọi loại thuế."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: kinh doanh online vẫn thuộc diện chịu thuế.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Bán hàng có doanh thu mà không kê khai thuế là ... thuế».", "answer": "trốn", "explain": "Trốn thuế: cố tình không kê khai, không nộp thuế theo quy định.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Công cụ giúp cơ quan thuế nắm doanh thu thực tế, chống gian lận trong thời đại số là hóa đơn ... Điền từ còn thiếu.", "answer": "điện tử", "explain": "Hóa đơn điện tử giúp chống thất thu thuế.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Thuế thu nhập cá nhân đánh vào", "options": ["A. thu nhập từ tiền lương, kinh doanh của cá nhân.", "B. hàng hóa trong siêu thị.", "C. xe ô tô nhập khẩu.", "D. thuốc lá, rượu bia."], "answer": "A", "explain": "Thuế thu nhập cá nhân đánh vào thu nhập từ tiền lương, tiền công, kinh doanh... của cá nhân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thuế thu nhập doanh nghiệp đánh vào", "options": ["A. lợi nhuận của doanh nghiệp.", "B. tiền lương của công nhân.", "C. hàng hóa tiêu dùng.", "D. nhà ở của dân."], "answer": "A", "explain": "Thuế thu nhập doanh nghiệp đánh vào thu nhập (lợi nhuận) của doanh nghiệp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người có thu nhập cao phải nộp thuế nhiều hơn người thu nhập thấp. Điều này thể hiện", "options": ["A. tính công bằng của thuế lũy tiến.", "B. sự bất công của thuế.", "C. miễn thuế cho người giàu.", "D. thuế đánh đều mọi người như nhau."], "answer": "A", "explain": "Thuế lũy tiến: thu nhập càng cao, thuế suất càng cao — điều tiết thu nhập, thực hiện công bằng xã hội.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Doanh nghiệp lỗ trong năm thì", "options": ["A. không phải nộp thuế thu nhập doanh nghiệp.", "B. vẫn phải nộp như khi có lãi.", "C. phải nộp gấp đôi.", "D. bị phạt vì lỗ."], "answer": "A", "explain": "Thuế thu nhập doanh nghiệp đánh vào lợi nhuận; doanh nghiệp lỗ (không có thu nhập chịu thuế) thì không phải nộp.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Anh Hùng có thu nhập 20 triệu đồng mỗi tháng từ tiền lương. Theo quy định, phần thu nhập đến mức chịu thuế của anh phải nộp thuế thu nhập cá nhân. Điều này cho thấy thuế thu nhập cá nhân là", "options": ["A. thuế trực thu đánh vào thu nhập.", "B. thuế gián thu.", "C. phí dịch vụ.", "D. tiền phạt."], "answer": "A", "explain": "Thuế thu nhập cá nhân đánh trực tiếp vào thu nhập của cá nhân nên là thuế trực thu.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một doanh nghiệp có doanh thu 10 tỉ đồng, chi phí 8 tỉ đồng. Lợi nhuận chịu thuế là 2 tỉ đồng. Với thuế suất 20 phần trăm, số thuế phải nộp là", "options": ["A. 400 triệu đồng.", "B. 2 tỉ đồng.", "C. 10 tỉ đồng.", "D. 1,6 tỉ đồng."], "answer": "A", "explain": "Thuế = lợi nhuận chịu thuế × thuế suất = 2 tỉ × 20 phần trăm = 400 triệu đồng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thuế thu nhập cá nhân là thuế trực thu.", "b) Thuế thu nhập doanh nghiệp là thuế trực thu.", "c) Thuế lũy tiến đảm bảo công bằng hơn.", "d) Doanh nghiệp lỗ vẫn phải nộp thuế thu nhập."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: lỗ thì không có thu nhập chịu thuế nên không phải nộp.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thuế trực thu đánh vào người có thu nhập.", "b) Người thu nhập cao nộp thuế nhiều hơn.", "c) Thuế thu nhập góp phần điều tiết thu nhập.", "d) Mọi cá nhân đều phải nộp thuế thu nhập như nhau."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thuế lũy tiến nên mức nộp khác nhau theo thu nhập; người thu nhập thấp được miễn, giảm.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Thuế thu nhập cá nhân áp dụng theo biểu ... tiến».", "answer": "lũy", "explain": "Thuế thu nhập cá nhân áp dụng theo biểu lũy tiến từng phần.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Doanh nghiệp lợi nhuận 2 tỉ đồng, thuế suất 20 phần trăm thì nộp bao nhiêu triệu đồng thuế? Viết số.", "answer": "400", "explain": "2 000 triệu × 20 phần trăm = 400 triệu đồng.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Mẹo nhớ phân biệt thuế trực thu và gián thu: thuế trực thu đánh vào", "options": ["A. «túi tiền» thu nhập của người nộp.", "B. giá hàng hóa.", "C. dịch vụ vận tải.", "D. tiền mừng tuổi."], "answer": "A", "explain": "Thuế trực thu đánh trực tiếp vào thu nhập, tài sản — «túi tiền» của người nộp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thuế gián thu «giấu» trong", "options": ["A. giá hàng hóa, dịch vụ.", "B. két sắt của Nhà nước.", "C. túi áo người bán.", "D. tài khoản ngân hàng."], "answer": "A", "explain": "Thuế gián thu đã tính trong giá bán hàng hóa, dịch vụ; người mua chịu, người bán nộp hộ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi mua vé xem phim, khán giả đã", "options": ["A. chịu thuế giá trị gia tăng qua giá vé.", "B. nộp thuế thu nhập cá nhân.", "C. không chịu thuế gì.", "D. được miễn thuế."], "answer": "A", "explain": "Giá vé đã bao gồm thuế giá trị gia tăng — người mua chịu thuế gián thu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chủ cửa hàng thu tiền thuế giá trị gia tăng từ khách rồi nộp vào ngân sách. Chủ cửa hàng đang", "options": ["A. nộp hộ thuế gián thu.", "B. trốn thuế.", "C. thu thuế trực thu.", "D. cho vay nặng lãi."], "answer": "A", "explain": "Người bán thu thuế gián thu từ người mua qua giá hàng hóa rồi nộp hộ vào ngân sách.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một mặt hàng có giá chưa thuế là 100 nghìn đồng, thuế giá trị gia tăng 10 phần trăm. Giá người mua phải trả là", "options": ["A. 110 nghìn đồng.", "B. 100 nghìn đồng.", "C. 90 nghìn đồng.", "D. 200 nghìn đồng."], "answer": "A", "explain": "Giá có thuế = 100 + 100 × 10 phần trăm = 110 nghìn đồng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "So sánh gánh nặng thuế: người nghèo và người giàu cùng mua một gói mì giá như nhau thì", "options": ["A. cùng chịu thuế gián thu như nhau qua giá, nên thuế gián thu ít công bằng hơn thuế trực thu lũy tiến.", "B. người nghèo không chịu thuế.", "C. người giàu chịu thuế gián thu nhiều hơn.", "D. thuế gián thu công bằng tuyệt đối."], "answer": "A", "explain": "Thuế gián thu đánh đều qua giá hàng hóa nên chiếm tỉ trọng lớn hơn trong thu nhập của người nghèo — kém công bằng hơn thuế trực thu lũy tiến.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thuế trực thu đánh vào thu nhập người nộp.", "b) Thuế gián thu tính trong giá hàng hóa.", "c) Người mua chịu thuế gián thu.", "d) Người bán nộp hộ thuế gián thu."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng theo đặc điểm hai loại thuế.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mua vé xem phim là chịu thuế gián thu.", "b) Thuế trực thu lũy tiến công bằng hơn thuế gián thu.", "c) Người bán thu hộ thuế giá trị gia tăng.", "d) Thuế gián thu do người bán tự chịu hoàn toàn."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: người mua mới là người chịu thuế gián thu qua giá.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Người mua chịu thuế gián thu, người bán ... hộ vào ngân sách».", "answer": "nộp", "explain": "Thuế gián thu: người mua chịu qua giá hàng hóa, người bán nộp hộ vào ngân sách.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hàng giá chưa thuế 100 nghìn đồng, thuế suất 10 phần trăm thì giá phải trả là bao nhiêu nghìn đồng? Viết số.", "answer": "110", "explain": "100 + 100 × 10 phần trăm = 110 nghìn đồng.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Cơ quan nào quản lí việc thu thuế ở Việt Nam?", "options": ["A. Cơ quan thuế (Tổng cục Thuế).", "B. Cơ quan công an.", "C. Nhà trường.", "D. Bệnh viện."], "answer": "A", "explain": "Cơ quan thuế (Tổng cục Thuế và chi cục thuế các cấp) quản lí việc thu thuế.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kê khai thuế là việc", "options": ["A. người nộp thuế khai báo thu nhập, doanh thu để tính thuế.", "B. cơ quan thuế tự đoán số thuế.", "C. người dân nộp tiền không cần khai.", "D. doanh nghiệp giấu doanh thu."], "answer": "A", "explain": "Kê khai thuế là việc người nộp thuế khai báo trung thực thu nhập, doanh thu làm căn cứ tính thuế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phải kê khai thuế trung thực?", "options": ["A. Vì đó là nghĩa vụ pháp luật và cơ sở tính thuế đúng.", "B. Vì kê khai gian dối được khen.", "C. Vì không ai kiểm tra.", "D. Vì thuế không quan trọng."], "answer": "A", "explain": "Kê khai trung thực là nghĩa vụ pháp luật, là cơ sở để tính đúng số thuế phải nộp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cơ quan thuế kiểm tra, thanh tra doanh nghiệp nhằm", "options": ["A. phát hiện gian lận, đảm bảo thu đúng, thu đủ.", "B. gây khó dễ cho doanh nghiệp.", "C. tăng thu nhập cá nhân.", "D. không có mục đích gì."], "answer": "A", "explain": "Kiểm tra, thanh tra thuế nhằm phát hiện gian lận, đảm bảo thu đúng, thu đủ, công bằng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một doanh nghiệp bị phạt vì chậm nộp thuế 3 tháng. Điều này cho thấy", "options": ["A. nộp thuế đúng hạn là nghĩa vụ bắt buộc.", "B. chậm nộp thuế không sao.", "C. doanh nghiệp được nợ thuế vô thời hạn.", "D. thuế là tự nguyện."], "answer": "A", "explain": "Chậm nộp thuế bị phạt — nộp thuế đầy đủ, đúng hạn là nghĩa vụ bắt buộc.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Người dân có thể tra cứu chính sách thuế trên cổng thông tin điện tử của cơ quan thuế. Điều này thể hiện quyền", "options": ["A. được hướng dẫn, cung cấp thông tin về thuế.", "B. tự đặt mức thuế.", "C. từ chối nộp thuế.", "D. miễn mọi loại thuế."], "answer": "A", "explain": "Người nộp thuế có quyền được hướng dẫn, giải đáp, cung cấp thông tin về chính sách thuế.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cơ quan thuế quản lí việc thu thuế.", "b) Kê khai thuế phải trung thực.", "c) Chậm nộp thuế có thể bị phạt.", "d) Người nộp thuế không có quyền gì."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: người nộp thuế có nhiều quyền theo pháp luật.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kiểm tra thuế nhằm đảm bảo thu đúng, thu đủ.", "b) Người nộp thuế được hướng dẫn về chính sách thuế.", "c) Nộp thuế đúng hạn là nghĩa vụ.", "d) Cơ quan thuế không được kiểm tra doanh nghiệp."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: cơ quan thuế có quyền kiểm tra, thanh tra.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «... thuế là việc khai báo thu nhập, doanh thu để tính thuế».", "answer": "Kê khai", "explain": "Kê khai thuế là việc người nộp thuế khai báo thu nhập, doanh thu làm căn cứ tính thuế.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cơ quan quản lí việc thu thuế ở Việt Nam là Tổng cục ... Điền từ còn thiếu.", "answer": "Thuế", "explain": "Tổng cục Thuế quản lí việc thu thuế.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Thông điệp «nộp thuế là yêu nước» muốn nhấn mạnh", "options": ["A. nộp thuế là nghĩa vụ và đóng góp xây dựng đất nước.", "B. chỉ người yêu nước mới phải nộp thuế.", "C. nộp thuế là việc của người khác.", "D. không nộp thuế cũng yêu nước."], "answer": "A", "explain": "Nộp thuế đầy đủ vừa là nghĩa vụ pháp luật, vừa là đóng góp thiết thực xây dựng đất nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tiền thuế được sử dụng vào", "options": ["A. xây dựng cầu đường, trường học, bệnh viện, đảm bảo an sinh.", "B. chia cho cán bộ.", "C. không sử dụng vào việc gì.", "D. cho vay nặng lãi."], "answer": "A", "explain": "Tiền thuế tạo nên ngân sách để đầu tư phát triển, đảm bảo quốc phòng, an sinh xã hội.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một học sinh nói «em chưa đi làm nên chưa liên quan đến thuế». Nhận xét đúng là", "options": ["A. chưa đúng, vì khi mua hàng em đã chịu thuế gián thu qua giá.", "B. đúng hoàn toàn.", "C. học sinh được miễn mọi loại thuế.", "D. thuế chỉ liên quan đến người lớn đi làm."], "answer": "A", "explain": "Dù chưa đi làm, học sinh mua hàng hóa vẫn chịu thuế giá trị gia tăng (thuế gián thu) qua giá bán.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để trở thành công dân có trách nhiệm về thuế trong tương lai, học sinh cần", "options": ["A. tìm hiểu kiến thức về thuế, sau này kê khai trung thực, nộp đúng hạn.", "B. học cách trốn thuế.", "C. không cần biết gì về thuế.", "D. phản đối mọi loại thuế."], "answer": "A", "explain": "Tìm hiểu kiến thức thuế từ bây giờ để sau này thực hiện nghĩa vụ đầy đủ là trách nhiệm công dân.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Gia đình bạn An kinh doanh tạp hóa, luôn kê khai trung thực và nộp thuế đúng hạn. Gia đình bạn An là", "options": ["A. tấm gương chấp hành pháp luật về thuế.", "B. người nộp thuế thiếu trách nhiệm.", "C. đối tượng bị xử phạt.", "D. không liên quan đến thuế."], "answer": "A", "explain": "Kê khai trung thực, nộp thuế đầy đủ đúng hạn là chấp hành tốt pháp luật về thuế.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một quốc gia có tỉ lệ tuân thủ thuế cao sẽ", "options": ["A. có ngân sách dồi dào để phát triển đất nước.", "B. bị thất thu ngân sách.", "C. không cần thu thuế nữa.", "D. kinh tế suy thoái."], "answer": "A", "explain": "Tuân thủ thuế cao giúp thu đúng, thu đủ, ngân sách dồi dào để đầu tư phát triển.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nộp thuế là nghĩa vụ và đóng góp xây dựng đất nước.", "b) Tiền thuế được dùng cho lợi ích chung.", "c) Học sinh mua hàng cũng chịu thuế gián thu.", "d) Không ai liên quan đến thuế cả."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: mọi người đều liên quan đến thuế (trực tiếp hoặc gián tiếp).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kê khai trung thực là tấm gương chấp hành pháp luật.", "b) Tuân thủ thuế cao giúp ngân sách dồi dào.", "c) Học sinh cần tìm hiểu kiến thức về thuế.", "d) Trốn thuế là cách yêu nước."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: trốn thuế vi phạm pháp luật, đi ngược lợi ích đất nước.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «... thuế là yêu nước».", "answer": "Nộp", "explain": "«Nộp thuế là yêu nước»: nộp thuế là nghĩa vụ và đóng góp xây dựng đất nước.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Có 2 loại thuế cơ bản: thuế trực thu và thuế ... thu. Điền từ còn thiếu.", "answer": "gián", "explain": "Hai loại thuế cơ bản: thuế trực thu và thuế gián thu.", "points": 0.5}]}]}
