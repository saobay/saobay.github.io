{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Tín dụng là", "options": ["A. quan hệ vay mượn dựa trên sự tin tưởng, hoàn trả gốc và lãi đúng hạn.", "B. quan hệ cho tặng không hoàn lại.", "C. quan hệ mua bán hàng hóa.", "D. quan hệ thuê nhà."], "answer": "A", "explain": "Tín dụng là quan hệ vay mượn dựa trên sự tin tưởng giữa người cho vay và người đi vay, hoàn trả cả gốc và lãi đúng thời hạn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đặc điểm nào sau đây thuộc về tín dụng?", "options": ["A. Phải hoàn trả cả gốc và lãi.", "B. Không phải hoàn trả.", "C. Không có thời hạn.", "D. Không có lãi suất."], "answer": "A", "explain": "Tín dụng mang tính hoàn trả: người vay phải trả lại đầy đủ gốc và lãi đúng thời hạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau cơ bản giữa «vay» và «cho/tặng» là", "options": ["A. vay phải hoàn trả cả gốc lẫn lãi, cho/tặng thì không.", "B. không có điểm khác nhau.", "C. vay không phải trả lại.", "D. cho/tặng phải trả lãi."], "answer": "A", "explain": "Vay (tín dụng) phải hoàn trả cả gốc lẫn lãi đúng hạn; cho/tặng thì không phải trả lại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lãi suất trong quan hệ tín dụng được hiểu là", "options": ["A. «giá» của vốn vay mà người vay phải trả thêm.", "B. tiền gốc vay ban đầu.", "C. tiền phạt vi phạm.", "D. tiền thưởng của ngân hàng."], "answer": "A", "explain": "Lãi suất là «giá» của vốn vay: khoản tiền người vay trả thêm ngoài gốc vay.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Anh Tùng vay ngân hàng 100 triệu đồng, sau một năm trả tổng cộng 108 triệu đồng. Trong ví dụ này, tiền gốc và tiền lãi lần lượt là", "options": ["A. 100 triệu đồng và 8 triệu đồng.", "B. 108 triệu đồng và 100 triệu đồng.", "C. 8 triệu đồng và 100 triệu đồng.", "D. 108 triệu đồng và 8 triệu đồng."], "answer": "A", "explain": "Tiền gốc là 100 triệu đồng vay ban đầu; tiền lãi là 108 − 100 = 8 triệu đồng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người vay 50 triệu đồng với lãi suất 10 phần trăm một năm, trả sau một năm. Tổng số tiền phải trả là", "options": ["A. 55 triệu đồng.", "B. 50 triệu đồng.", "C. 60 triệu đồng.", "D. 45 triệu đồng."], "answer": "A", "explain": "Tiền lãi = 50 × 10 phần trăm = 5 triệu đồng. Tổng phải trả = 50 + 5 = 55 triệu đồng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tín dụng dựa trên sự tin tưởng giữa người vay và người cho vay.", "b) Người vay phải hoàn trả cả gốc và lãi.", "c) Tín dụng luôn có thời hạn xác định.", "d) Vay tín dụng không phải trả lãi."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: tín dụng có lãi suất, người vay phải trả lãi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lãi suất là «giá» của vốn vay.", "b) Cho/tặng thì không phải hoàn trả.", "c) Vay mượn giữa bạn bè không cần tin tưởng.", "d) Tín dụng khác với thuê tài sản."], "answer": ["T", "T", "F", "T"], "explain": "a, b, d đúng. c sai: mọi quan hệ vay mượn đều dựa trên sự tin tưởng.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Tín dụng là quan hệ vay mượn dựa trên sự ...».", "answer": "tin tưởng", "explain": "Tín dụng là quan hệ vay mượn dựa trên sự tin tưởng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vay 50 triệu đồng, lãi suất 10 phần trăm một năm, sau một năm phải trả tổng cộng bao nhiêu triệu đồng? Viết số.", "answer": "55", "explain": "50 + 50 × 10 phần trăm = 55 triệu đồng.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Vai trò của tín dụng đối với sản xuất là", "options": ["A. bổ sung vốn, giúp mở rộng sản xuất.", "B. làm giảm vốn sản xuất.", "C. ngăn cản sản xuất.", "D. thay thế hoàn toàn vốn tự có."], "answer": "A", "explain": "Tín dụng bổ sung vốn kịp thời, giúp doanh nghiệp mở rộng sản xuất, nắm bắt cơ hội kinh doanh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vai trò của tín dụng đối với tiêu dùng là", "options": ["A. giúp mua sắm trước, trả dần, cải thiện đời sống.", "B. cấm người dân mua sắm.", "C. làm đời sống khó khăn hơn.", "D. không liên quan đến tiêu dùng."], "answer": "A", "explain": "Tín dụng giúp người dân mua nhà, xe... trả góp — mua sắm trước, trả dần, cải thiện đời sống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một hộ nông dân vay vốn ưu đãi mua máy cày, năng suất tăng gấp đôi. Đây là vai trò của tín dụng với", "options": ["A. sản xuất.", "B. tiêu dùng.", "C. Nhà nước.", "D. giáo dục."], "answer": "A", "explain": "Vay vốn để mua máy móc, mở rộng sản xuất là vai trò của tín dụng đối với sản xuất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một gia đình trẻ vay ngân hàng mua nhà trả góp trong 15 năm. Đây là vai trò của tín dụng với", "options": ["A. tiêu dùng.", "B. sản xuất.", "C. xuất khẩu.", "D. quốc phòng."], "answer": "A", "explain": "Vay mua nhà để ở là phục vụ nhu cầu tiêu dùng (nhà ở) — mua trước trả dần.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tín dụng được ví như «đòn bẩy» phát triển vì", "options": ["A. giúp biến vốn nhỏ thành kết quả lớn khi dùng đúng cách.", "B. giúp vay mà không cần trả.", "C. làm mọi việc thay con người.", "D. xóa bỏ mọi rủi ro."], "answer": "A", "explain": "Vốn vay đúng lúc giúp tạo ra giá trị lớn hơn nhiều so với vốn ban đầu — như đòn bẩy.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nhà nước dùng công cụ lãi suất để điều tiết lượng tiền trong lưu thông. Đây là vai trò của tín dụng với", "options": ["A. Nhà nước trong điều tiết tiền tệ, ổn định kinh tế.", "B. người tiêu dùng cá nhân.", "C. doanh nghiệp tư nhân.", "D. hộ gia đình."], "answer": "A", "explain": "Điều tiết tiền tệ qua lãi suất là vai trò của tín dụng đối với Nhà nước trong quản lí vĩ mô.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về vai trò tín dụng:", "statements": ["a) Tín dụng bổ sung vốn cho sản xuất.", "b) Tín dụng giúp mua nhà trả góp.", "c) Tín dụng là công cụ điều tiết tiền tệ.", "d) Tín dụng không có vai trò gì."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: tín dụng có vai trò quan trọng với sản xuất, tiêu dùng và Nhà nước.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vay vốn mua máy móc là tín dụng cho sản xuất.", "b) Vay mua xe trả góp là tín dụng cho tiêu dùng.", "c) Tín dụng dùng đúng cách là đòn bẩy phát triển.", "d) Tín dụng chỉ có lợi, không có rủi ro."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: lạm dụng tín dụng, vay quá khả năng sẽ thành gánh nặng nợ nần.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Tín dụng dùng đúng cách là ... phát triển».", "answer": "đòn bẩy", "explain": "Tín dụng dùng đúng cách là đòn bẩy phát triển.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tín dụng là «con dao hai lưỡi»: dùng đúng là đòn bẩy, lạm dụng thành gánh nặng ... Điền từ còn thiếu.", "answer": "nợ nần", "explain": "Lạm dụng tín dụng, vay quá khả năng sẽ thành gánh nặng nợ nần.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Tín dụng ngân hàng là", "options": ["A. quan hệ vay mượn giữa ngân hàng với tổ chức, cá nhân.", "B. quan hệ mua bán giữa các doanh nghiệp.", "C. quan hệ vay mượn của Nhà nước.", "D. quan hệ cho tặng."], "answer": "A", "explain": "Tín dụng ngân hàng là quan hệ vay mượn giữa ngân hàng, tổ chức tín dụng với tổ chức, cá nhân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tín dụng thương mại là", "options": ["A. quan hệ mua bán chịu, trả chậm giữa các doanh nghiệp.", "B. quan hệ vay ngân hàng.", "C. trái phiếu chính phủ.", "D. vay ưu đãi hộ nghèo."], "answer": "A", "explain": "Tín dụng thương mại là quan hệ vay mượn giữa các doanh nghiệp với nhau: mua hàng trả chậm, bán chịu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhà nước phát hành trái phiếu chính phủ để huy động vốn thuộc hình thức", "options": ["A. tín dụng nhà nước.", "B. tín dụng ngân hàng.", "C. tín dụng thương mại.", "D. tín dụng đen."], "answer": "A", "explain": "Nhà nước vay vốn qua phát hành trái phiếu chính phủ là tín dụng nhà nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cửa hàng cho khách quen mua chịu cuối tháng trả tiền. Đây là", "options": ["A. tín dụng thương mại.", "B. tín dụng ngân hàng.", "C. tín dụng nhà nước.", "D. cho tặng."], "answer": "A", "explain": "Mua chịu, trả chậm giữa người bán và người mua là tín dụng thương mại.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hộ nghèo được vay vốn ưu đãi từ Ngân hàng Chính sách xã hội để chăn nuôi. Đây là", "options": ["A. tín dụng nhà nước (chính sách).", "B. tín dụng thương mại.", "C. tín dụng đen.", "D. cho không hoàn lại."], "answer": "A", "explain": "Vay vốn ưu đãi theo chính sách của Nhà nước cho hộ nghèo là tín dụng nhà nước.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một công ty bán nguyên liệu cho công ty khác, cho nợ 60 ngày không tính lãi. Hình thức này giúp bên mua", "options": ["A. có vốn lưu động tạm thời mà không cần vay ngân hàng.", "B. được cho không nguyên liệu.", "C. không phải trả tiền.", "D. vay được tiền mặt."], "answer": "A", "explain": "Mua chịu 60 ngày giúp bên mua chiếm dụng vốn tạm thời — lợi ích của tín dụng thương mại.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vay ngân hàng là tín dụng ngân hàng.", "b) Mua chịu, trả chậm là tín dụng thương mại.", "c) Trái phiếu chính phủ là tín dụng nhà nước.", "d) Chỉ có một hình thức tín dụng duy nhất."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: có ba hình thức: ngân hàng, thương mại, nhà nước.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vay ưu đãi hộ nghèo là tín dụng nhà nước.", "b) Tín dụng thương mại giúp doanh nghiệp có vốn tạm thời.", "c) Mua chịu cuối tháng trả là tín dụng thương mại.", "d) Tín dụng nhà nước do doanh nghiệp thực hiện."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: tín dụng nhà nước do Nhà nước thực hiện.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Mua hàng trả chậm, bán chịu giữa các doanh nghiệp là tín dụng ...».", "answer": "thương mại", "explain": "Tín dụng thương mại: mua hàng trả chậm, bán chịu giữa các doanh nghiệp.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nhà nước huy động vốn bằng cách phát hành trái phiếu ... Điền từ còn thiếu.", "answer": "chính phủ", "explain": "Trái phiếu chính phủ là hình thức tín dụng nhà nước.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên tắc vàng khi sử dụng tín dụng là", "options": ["A. chỉ vay khi có khả năng trả nợ.", "B. vay càng nhiều càng tốt.", "C. vay rồi không trả.", "D. vay để tiêu xài hoang phí."], "answer": "A", "explain": "Chỉ vay trong khả năng trả nợ, vay đúng mục đích là nguyên tắc vàng khi dùng tín dụng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trước khi vay, người đi vay cần tìm hiểu kĩ", "options": ["A. lãi suất, thời hạn, điều khoản hợp đồng.", "B. màu sắc trụ sở ngân hàng.", "C. sở thích của nhân viên.", "D. thời tiết hôm vay."], "answer": "A", "explain": "Phải tìm hiểu kĩ lãi suất, thời hạn, điều khoản hợp đồng trước khi vay.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dấu hiệu nào sau đây cảnh báo «tín dụng đen»?", "options": ["A. Lãi suất cao bất thường, không hợp đồng rõ ràng, đe dọa khi đòi nợ.", "B. Lãi suất thấp, hợp đồng minh bạch.", "C. Ngân hàng có giấy phép.", "D. Được Nhà nước bảo trợ."], "answer": "A", "explain": "Tín dụng đen: lãi suất cao bất thường, thủ tục mập mờ, dùng đe dọa, bạo lực khi đòi nợ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hậu quả của việc sa vào tín dụng đen là", "options": ["A. nợ nần chồng chất, bị đe dọa, ảnh hưởng gia đình.", "B. được xóa nợ.", "C. làm giàu nhanh chóng.", "D. không có hậu quả gì."], "answer": "A", "explain": "Tín dụng đen với lãi suất cắt cổ khiến nợ chồng chất, người vay bị đe dọa, khủng hoảng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn An cần 20 triệu đồng gấp, có người chào vay «nhanh gọn, không cần giấy tờ» với lãi 20 phần trăm một tháng. Bạn An nên", "options": ["A. từ chối, vì đó là tín dụng đen với lãi suất cắt cổ.", "B. vay ngay vì thủ tục nhanh.", "C. vay rồi không trả.", "D. giới thiệu cho bạn bè cùng vay."], "answer": "A", "explain": "Lãi 20 phần trăm một tháng, không giấy tờ là dấu hiệu tín dụng đen — phải từ chối.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người vay tín dụng đen 10 triệu đồng, lãi 15 phần trăm một tháng. Sau 2 tháng không trả được, số tiền lãi phát sinh (chưa tính lãi mẹ đẻ lãi con) là", "options": ["A. 3 triệu đồng.", "B. 1,5 triệu đồng.", "C. 15 triệu đồng.", "D. 30 triệu đồng."], "answer": "A", "explain": "Lãi mỗi tháng = 10 × 15 phần trăm = 1,5 triệu đồng. 2 tháng = 3 triệu đồng tiền lãi.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chỉ nên vay trong khả năng trả nợ.", "b) Cần tìm hiểu kĩ hợp đồng trước khi vay.", "c) Phải trả nợ đúng hạn, giữ uy tín.", "d) Nên vay tín dụng đen vì thủ tục nhanh."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: tín dụng đen rất nguy hiểm, phải tránh xa.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lãi suất cao bất thường là dấu hiệu tín dụng đen.", "b) Tín dụng đen gây nợ nần chồng chất.", "c) Vay đúng mục đích giúp sử dụng vốn hiệu quả.", "d) Không cần đọc hợp đồng khi vay."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: phải đọc kĩ hợp đồng trước khi vay.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Nguyên tắc vàng: chỉ vay khi ... được».", "answer": "trả", "explain": "Nguyên tắc vàng: chỉ vay khi trả được (trong khả năng trả nợ).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hình thức cho vay với lãi suất cắt cổ, thủ tục mập mờ được gọi là tín dụng ... Điền từ còn thiếu.", "answer": "đen", "explain": "Tín dụng đen: lãi suất cao bất thường, không hợp đồng rõ ràng, đe dọa khi đòi nợ.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Tín dụng có vai trò «đòn bẩy» khi", "options": ["A. được dùng đúng mục đích, trong khả năng trả nợ.", "B. vay để tiêu xài hoang phí.", "C. vay quá khả năng chi trả.", "D. sa vào tín dụng đen."], "answer": "A", "explain": "Dùng đúng mục đích, trong khả năng trả nợ thì tín dụng là đòn bẩy phát triển.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tín dụng trở thành «gánh nặng» khi", "options": ["A. vay quá khả năng, dùng sai mục đích.", "B. vay đúng mục đích.", "C. trả nợ đúng hạn.", "D. tìm hiểu kĩ hợp đồng."], "answer": "A", "explain": "Vay quá khả năng, dùng sai mục đích, sa vào tín dụng đen thì tín dụng thành gánh nặng nợ nần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sinh viên vay tiền để đóng học phí, ra trường đi làm trả dần. Đây là", "options": ["A. sử dụng tín dụng đúng mục đích, đầu tư cho tương lai.", "B. lạm dụng tín dụng.", "C. tín dụng đen.", "D. hành vi đáng chê trách."], "answer": "A", "explain": "Vay để học tập là đầu tư cho tương lai, dùng vốn đúng mục đích — tín dụng phát huy vai trò tích cực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người vay tiền để chơi cờ bạc, cá độ. Đây là", "options": ["A. dùng vốn sai mục đích, dễ sa vào nợ nần.", "B. sử dụng tín dụng đúng cách.", "C. đầu tư thông minh.", "D. không ảnh hưởng gì."], "answer": "A", "explain": "Vay để cờ bạc là dùng vốn sai mục đích, vi phạm pháp luật, dễ dẫn đến nợ nần chồng chất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Gia đình ông Ba vay 200 triệu đồng để mở rộng xưởng mộc, mỗi tháng trả góp 5 triệu đồng trong khả năng thu nhập. Cách dùng vốn này", "options": ["A. hợp lí: đúng mục đích sản xuất, trong khả năng trả nợ.", "B. lãng phí.", "C. là tín dụng đen.", "D. vi phạm pháp luật."], "answer": "A", "explain": "Vay để mở rộng sản xuất, trả góp trong khả năng thu nhập là sử dụng tín dụng hợp lí.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một thanh niên vay nhiều app với tổng số tiền vượt xa thu nhập để mua sắm hàng hiệu, rồi phải vay app khác trả app cũ. Đây là hiện tượng", "options": ["A. lạm dụng tín dụng, rơi vào vòng xoáy nợ nần.", "B. sử dụng tín dụng thông minh.", "C. đầu tư tài chính.", "D. không có gì đáng lo."], "answer": "A", "explain": "Vay vượt khả năng, vay mới trả cũ là lạm dụng tín dụng, rơi vào vòng xoáy nợ nần — cần tránh.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vay đúng mục đích thì tín dụng là đòn bẩy.", "b) Vay quá khả năng thì thành gánh nặng.", "c) Vay để học tập là đầu tư cho tương lai.", "d) Vay để cờ bạc là dùng vốn đúng mục đích."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: vay để cờ bạc là sai mục đích, vi phạm pháp luật.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vay mới trả cũ là dấu hiệu lạm dụng tín dụng.", "b) Mua sắm vượt khả năng bằng vốn vay rất rủi ro.", "c) Trả nợ đúng hạn giữ uy tín tín dụng.", "d) Càng vay nhiều càng tốt."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: chỉ vay trong khả năng trả nợ.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Vay ... trả cũ là dấu hiệu rơi vào vòng xoáy nợ nần».", "answer": "mới", "explain": "Vay mới trả cũ là lạm dụng tín dụng, rơi vào vòng xoáy nợ nần.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tín dụng là «con dao ... lưỡi». Điền từ còn thiếu.", "answer": "hai", "explain": "Tín dụng là «con dao hai lưỡi»: dùng đúng là đòn bẩy, lạm dụng thành gánh nặng.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Uy tín tín dụng của một người được xây dựng từ", "options": ["A. việc trả nợ đúng hạn, đầy đủ.", "B. việc vay càng nhiều càng tốt.", "C. việc trốn nợ.", "D. việc vay rồi không trả."], "answer": "A", "explain": "Trả nợ đúng hạn, đầy đủ tạo uy tín tín dụng tốt, giúp vay vốn dễ dàng hơn sau này.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Người có lịch sử trả nợ xấu sẽ", "options": ["A. khó vay vốn ở những lần sau.", "B. được vay dễ dàng hơn.", "C. được giảm lãi suất.", "D. không bị ảnh hưởng gì."], "answer": "A", "explain": "Lịch sử trả nợ xấu (nợ quá hạn) làm giảm uy tín, khó vay vốn sau này.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao ngân hàng yêu cầu người vay chứng minh thu nhập?", "options": ["A. Để đánh giá khả năng trả nợ của người vay.", "B. Để tò mò đời tư khách hàng.", "C. Để tăng thủ tục rườm rà.", "D. Để từ chối mọi khoản vay."], "answer": "A", "explain": "Chứng minh thu nhập giúp ngân hàng đánh giá khả năng trả nợ — cơ sở của sự tin tưởng trong tín dụng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tài sản thế chấp trong vay vốn có tác dụng", "options": ["A. đảm bảo cho khoản vay, tăng sự tin tưởng của bên cho vay.", "B. để ngân hàng giữ chơi.", "C. không có tác dụng gì.", "D. để tăng lãi suất."], "answer": "A", "explain": "Tài sản thế chấp là đảm bảo cho khoản vay: nếu không trả được nợ, bên cho vay xử lí tài sản để thu hồi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Anh Cường vay mua xe ô tô thế chấp bằng chính chiếc xe. Nếu anh không trả được nợ, ngân hàng có quyền", "options": ["A. xử lí chiếc xe để thu hồi nợ.", "B. bắt giữ anh Cường.", "C. không làm gì được.", "D. tăng gấp đôi số nợ."], "answer": "A", "explain": "Tài sản thế chấp được xử lí để thu hồi nợ khi người vay không trả được — đúng quy định pháp luật.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người có uy tín tín dụng tốt được ngân hàng ưu đãi lãi suất thấp hơn. Điều này cho thấy", "options": ["A. uy tín tín dụng mang lại lợi ích thiết thực cho người vay.", "B. uy tín không quan trọng.", "C. ai cũng được lãi suất như nhau.", "D. ngân hàng cho vay tùy hứng."], "answer": "A", "explain": "Uy tín tốt giúp vay dễ hơn, lãi suất ưu đãi hơn — lợi ích thiết thực của việc giữ chữ tín trong tín dụng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trả nợ đúng hạn tạo uy tín tín dụng tốt.", "b) Nợ xấu làm khó vay vốn sau này.", "c) Tài sản thế chấp đảm bảo cho khoản vay.", "d) Uy tín tín dụng không quan trọng."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: uy tín tín dụng rất quan trọng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ngân hàng đánh giá khả năng trả nợ trước khi cho vay.", "b) Uy tín tốt được ưu đãi lãi suất.", "c) Không trả được nợ thì tài sản thế chấp bị xử lí.", "d) Vay vốn không cần chứng minh gì."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: phải chứng minh thu nhập, khả năng trả nợ.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Trả nợ đúng hạn, đầy đủ tạo ... tín dụng tốt».", "answer": "uy tín", "explain": "Uy tín tín dụng được xây dựng từ việc trả nợ đúng hạn, đầy đủ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tài sản dùng để đảm bảo cho khoản vay được gọi là tài sản ... Điền từ còn thiếu.", "answer": "thế chấp", "explain": "Tài sản thế chấp đảm bảo cho khoản vay.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Gửi tiết kiệm ngân hàng là", "options": ["A. gửi tiền nhàn rỗi vào ngân hàng để hưởng lãi.", "B. cho vay nặng lãi.", "C. mua cổ phiếu.", "D. trốn thuế."], "answer": "A", "explain": "Gửi tiết kiệm là gửi tiền nhàn rỗi vào ngân hàng để bảo toàn và hưởng lãi suất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lãi suất huy động là", "options": ["A. lãi ngân hàng trả cho người gửi tiền.", "B. lãi người vay trả cho ngân hàng.", "C. phí mở tài khoản.", "D. tiền phạt."], "answer": "A", "explain": "Lãi suất huy động là lãi ngân hàng trả cho người gửi tiền; lãi suất cho vay là lãi người vay trả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ngân hàng lấy tiền gửi tiết kiệm của người dân để", "options": ["A. cho vay lại, thu chênh lệch lãi suất.", "B. cất trong két không dùng.", "C. chia cho nhân viên.", "D. đốt bỏ."], "answer": "A", "explain": "Ngân hàng huy động tiền gửi rồi cho vay lại với lãi suất cao hơn — chênh lệch là lợi nhuận ngân hàng, đồng thời là vai trò trung gian vốn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao lãi suất cho vay thường cao hơn lãi suất huy động?", "options": ["A. Vì chênh lệch là lợi nhuận và chi phí hoạt động của ngân hàng.", "B. Vì ngân hàng muốn gây khó cho người vay.", "C. Ngẫu nhiên không có lí do.", "D. Vì người gửi tiền chịu thiệt."], "answer": "A", "explain": "Chênh lệch giữa lãi cho vay và lãi huy động là nguồn lợi nhuận và chi phí hoạt động của ngân hàng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bà Lan gửi 100 triệu đồng tiết kiệm với lãi suất 6 phần trăm một năm. Sau một năm, bà nhận được tiền lãi là", "options": ["A. 6 triệu đồng.", "B. 100 triệu đồng.", "C. 106 triệu đồng.", "D. 60 triệu đồng."], "answer": "A", "explain": "Tiền lãi = 100 × 6 phần trăm = 6 triệu đồng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ngân hàng huy động với lãi suất 6 phần trăm, cho vay với lãi suất 10 phần trăm. Với 1 tỉ đồng vốn huy động cho vay hết trong một năm, chênh lệch lãi ngân hàng thu được là", "options": ["A. 40 triệu đồng.", "B. 100 triệu đồng.", "C. 60 triệu đồng.", "D. 160 triệu đồng."], "answer": "A", "explain": "Chênh lệch = 10 phần trăm − 6 phần trăm = 4 phần trăm. 1 tỉ × 4 phần trăm = 40 triệu đồng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Gửi tiết kiệm là gửi tiền nhàn rỗi hưởng lãi.", "b) Lãi suất huy động trả cho người gửi tiền.", "c) Ngân hàng cho vay lại tiền huy động được.", "d) Lãi suất cho vay thường thấp hơn lãi suất huy động."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: lãi suất cho vay thường cao hơn lãi suất huy động.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chênh lệch lãi suất là lợi nhuận của ngân hàng.", "b) Gửi tiết kiệm giúp bảo toàn tiền nhàn rỗi.", "c) Ngân hàng là trung gian vốn trong nền kinh tế.", "d) Người gửi tiền phải trả lãi cho ngân hàng."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: ngân hàng trả lãi cho người gửi tiền.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «... suất huy động là lãi ngân hàng trả cho người gửi tiền».", "answer": "Lãi", "explain": "Lãi suất huy động là lãi ngân hàng trả cho người gửi tiền.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Gửi 100 triệu đồng, lãi suất 6 phần trăm một năm thì tiền lãi một năm là bao nhiêu triệu đồng? Viết số.", "answer": "6", "explain": "100 × 6 phần trăm = 6 triệu đồng.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Thẻ tín dụng là", "options": ["A. thẻ cho phép chi tiêu trước, trả sau trong hạn mức.", "B. thẻ rút tiền tiết kiệm.", "C. thẻ căn cước.", "D. thẻ học sinh."], "answer": "A", "explain": "Thẻ tín dụng cho phép chủ thẻ chi tiêu trước trong hạn mức, trả sau cho ngân hàng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nếu trả đủ dư nợ thẻ tín dụng đúng hạn, người dùng", "options": ["A. thường được miễn lãi.", "B. vẫn bị tính lãi cao.", "C. bị phạt.", "D. bị khóa thẻ."], "answer": "A", "explain": "Trả đủ đúng hạn trong thời gian miễn lãi thì không bị tính lãi — lợi ích của dùng thẻ đúng cách.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Rủi ro khi lạm dụng thẻ tín dụng là", "options": ["A. chi tiêu vượt khả năng, nợ lãi cao.", "B. được miễn lãi mãi mãi.", "C. tăng thu nhập.", "D. không có rủi ro."], "answer": "A", "explain": "Chi tiêu vượt khả năng, chỉ trả tối thiểu sẽ bị tính lãi cao, nợ chồng chất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi mất thẻ tín dụng, việc cần làm ngay là", "options": ["A. khóa thẻ khẩn cấp qua ngân hàng.", "B. im lặng chờ đợi.", "C. đăng lên mạng xã hội.", "D. làm thẻ mới mà không khóa thẻ cũ."], "answer": "A", "explain": "Mất thẻ phải khóa khẩn cấp ngay để tránh bị kẻ gian sử dụng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn Hoa dùng thẻ tín dụng mua sắm 10 triệu đồng nhưng chỉ trả tối thiểu 1 triệu đồng, số còn lại bị tính lãi 3 phần trăm một tháng. Sau một tháng, tiền lãi phát sinh khoảng", "options": ["A. 270 nghìn đồng.", "B. 30 nghìn đồng.", "C. 3 triệu đồng.", "D. 0 đồng."], "answer": "A", "explain": "Dư nợ còn lại = 10 − 1 = 9 triệu đồng. Lãi = 9 triệu × 3 phần trăm = 270 nghìn đồng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Dùng thẻ tín dụng một cách thông minh là", "options": ["A. chi tiêu trong khả năng, trả đủ đúng hạn để được miễn lãi.", "B. rút tiền mặt từ thẻ tín dụng thường xuyên.", "C. chi tiêu vượt hạn mức.", "D. cho người lạ mượn thẻ."], "answer": "A", "explain": "Chi tiêu trong khả năng và trả đủ đúng hạn giúp tận hưởng tiện ích mà không mất lãi.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thẻ tín dụng cho phép chi tiêu trước, trả sau.", "b) Trả đủ đúng hạn thường được miễn lãi.", "c) Mất thẻ cần khóa khẩn cấp ngay.", "d) Thẻ tín dụng là tiền miễn phí."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: chi tiêu bằng thẻ là khoản vay phải trả.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lạm dụng thẻ tín dụng dễ nợ lãi cao.", "b) Chỉ trả tối thiểu sẽ bị tính lãi trên dư nợ.", "c) Dùng thẻ đúng cách mang lại tiện ích.", "d) Nên cho người lạ mượn thẻ tín dụng."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: không cho người lạ mượn thẻ để tránh rủi ro.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Thẻ tín dụng cho phép chi tiêu ..., trả sau».", "answer": "trước", "explain": "Thẻ tín dụng: chi tiêu trước trong hạn mức, trả sau cho ngân hàng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Dư nợ thẻ 9 triệu đồng, lãi 3 phần trăm một tháng thì tiền lãi một tháng là bao nhiêu nghìn đồng? Viết số.", "answer": "270", "explain": "9 000 nghìn × 3 phần trăm = 270 nghìn đồng.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Thanh toán không dùng tiền mặt qua ngân hàng giúp", "options": ["A. nhanh chóng, an toàn, minh bạch.", "B. tăng rủi ro mất tiền.", "C. khó kiểm soát chi tiêu.", "D. vi phạm pháp luật."], "answer": "A", "explain": "Thanh toán qua ngân hàng (chuyển khoản, quét mã) nhanh chóng, an toàn, minh bạch, dễ kiểm soát.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dịch vụ chuyển tiền qua ứng dụng ngân hàng thuộc", "options": ["A. dịch vụ thanh toán của tín dụng.", "B. tín dụng đen.", "C. cho vay nặng lãi.", "D. không phải dịch vụ ngân hàng."], "answer": "A", "explain": "Chuyển tiền, thanh toán qua ngân hàng là dịch vụ thanh toán trong hệ thống tín dụng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Nhà nước khuyến khích thanh toán không dùng tiền mặt?", "options": ["A. Vì minh bạch, chống tham nhũng, thất thu thuế.", "B. Vì muốn kiểm soát đời tư.", "C. Vì tiền mặt sắp hết giá trị.", "D. Không có lí do gì."], "answer": "A", "explain": "Thanh toán không tiền mặt tạo dấu vết giao dịch, minh bạch, chống tham nhũng, thất thu thuế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi chuyển tiền nhầm cho người lạ, việc cần làm là", "options": ["A. liên hệ ngân hàng để được hỗ trợ xử lí.", "B. bỏ luôn số tiền đó.", "C. tự đến nhà người lạ đòi.", "D. im lặng."], "answer": "A", "explain": "Chuyển nhầm tiền cần liên hệ ngân hàng để được hỗ trợ thu hồi theo quy trình.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một cửa hàng chỉ nhận tiền mặt, không xuất hóa đơn để trốn thuế. Hành vi này", "options": ["A. vi phạm pháp luật về thuế.", "B. là quyền của cửa hàng.", "C. giúp minh bạch.", "D. được khuyến khích."], "answer": "A", "explain": "Trốn thuế bằng cách không xuất hóa đơn là vi phạm pháp luật.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Người dân cần cảnh giác với tin nhắn «tài khoản ngân hàng của bạn bị khóa, bấm vào link để xác thực» vì", "options": ["A. đó có thể là lừa đảo chiếm đoạt tài khoản.", "B. đó là thông báo thật của ngân hàng.", "C. bấm vào link sẽ được thưởng.", "D. không có rủi ro gì."], "answer": "A", "explain": "Ngân hàng không bao giờ yêu cầu xác thực qua link lạ — đó là thủ đoạn lừa đảo chiếm đoạt tài khoản.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thanh toán không tiền mặt nhanh chóng, an toàn.", "b) Chuyển tiền nhầm cần liên hệ ngân hàng.", "c) Tin nhắn yêu cầu bấm link lạ có thể là lừa đảo.", "d) Trốn thuế qua tiền mặt là hợp pháp."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: trốn thuế vi phạm pháp luật.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thanh toán không tiền mặt giúp minh bạch.", "b) Không bấm vào link lạ yêu cầu xác thực tài khoản.", "c) Không cung cấp mã OTP cho người lạ.", "d) Ngân hàng yêu cầu cung cấp mật khẩu qua điện thoại."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: ngân hàng không bao giờ hỏi mật khẩu, mã OTP qua điện thoại.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Không cung cấp mã ... cho người lạ».", "answer": "OTP", "explain": "Tuyệt đối không cung cấp mã OTP, mật khẩu cho người lạ để tránh bị chiếm đoạt tài khoản.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thủ đoạn giả danh ngân hàng gửi link lạ để chiếm đoạt tài khoản gọi là lừa ... Điền từ còn thiếu.", "answer": "đảo", "explain": "Lừa đảo chiếm đoạt tài sản qua mạng là tội phạm công nghệ cao cần cảnh giác.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Học sinh có thể tiếp cận tín dụng qua", "options": ["A. vay vốn học tập của Nhà nước khi vào đại học.", "B. tín dụng đen.", "C. vay nặng lãi.", "D. không có kênh nào."], "answer": "A", "explain": "Học sinh, sinh viên khó khăn được vay vốn học tập ưu đãi của Nhà nước khi vào đại học, cao đẳng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vay vốn học tập của Nhà nước giúp", "options": ["A. học sinh nghèo được tiếp tục đến trường.", "B. học sinh tiêu xài hoang phí.", "C. tăng gánh nặng không cần thiết.", "D. không ai được lợi."], "answer": "A", "explain": "Vay vốn học tập ưu đãi giúp học sinh, sinh viên khó khăn trang trải học phí, tiếp tục học tập.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một sinh viên vay vốn học tập 20 triệu đồng mỗi năm, sau 4 năm tổng số vốn vay là", "options": ["A. 80 triệu đồng.", "B. 20 triệu đồng.", "C. 100 triệu đồng.", "D. 60 triệu đồng."], "answer": "A", "explain": "20 × 4 = 80 triệu đồng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trách nhiệm của sinh viên khi vay vốn học tập là", "options": ["A. học tập tốt, ra trường trả nợ đúng hạn.", "B. vay rồi không trả.", "C. dùng vốn vay để tiêu xài.", "D. không cần quan tâm."], "answer": "A", "explain": "Vay vốn học tập phải dùng đúng mục đích học tập và trả nợ đúng hạn sau khi ra trường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Gia đình khó khăn nhưng con học giỏi, đỗ đại học. Giải pháp tài chính phù hợp là", "options": ["A. vay vốn học tập ưu đãi của Nhà nước.", "B. vay tín dụng đen để đóng học phí.", "C. bỏ học đi làm thuê.", "D. không có giải pháp nào."], "answer": "A", "explain": "Vay vốn học tập ưu đãi là chính sách của Nhà nước giúp học sinh nghèo tiếp tục học đại học.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Thông điệp chính của bài học về tín dụng đối với học sinh là", "options": ["A. hiểu đúng về tín dụng, dùng vốn có trách nhiệm, tránh xa tín dụng đen.", "B. càng vay nhiều càng tốt.", "C. học sinh không cần biết về tín dụng.", "D. tín dụng đen là giải pháp nhanh."], "answer": "A", "explain": "Hiểu đúng tín dụng, dùng vốn đúng mục đích, trong khả năng trả nợ và tránh xa tín dụng đen.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sinh viên khó khăn được vay vốn học tập ưu đãi.", "b) Vay vốn học tập phải trả nợ sau khi ra trường.", "c) Vốn vay học tập dùng cho học tập.", "d) Học sinh nên vay tín dụng đen khi cần tiền."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: tuyệt đối tránh xa tín dụng đen.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hiểu về tín dụng giúp dùng vốn có trách nhiệm.", "b) Tránh xa tín dụng đen là tự bảo vệ mình.", "c) Vay đúng mục đích mang lại lợi ích.", "d) Vay tiền không cần tính khả năng trả nợ."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: phải tính kĩ khả năng trả nợ trước khi vay.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Sinh viên khó khăn được vay ... học tập ưu đãi».", "answer": "vốn", "explain": "Vay vốn học tập ưu đãi của Nhà nước giúp sinh viên khó khăn tiếp tục học tập.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sinh viên vay 20 triệu mỗi năm, sau 4 năm tổng vốn vay là bao nhiêu triệu đồng? Viết số.", "answer": "80", "explain": "20 × 4 = 80 triệu đồng.", "points": 0.5}]}]}
