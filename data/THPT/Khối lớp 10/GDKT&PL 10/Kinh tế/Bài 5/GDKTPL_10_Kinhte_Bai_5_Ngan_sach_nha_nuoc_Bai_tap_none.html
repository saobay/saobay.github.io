ộ máy nhà nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi kinh tế suy thoái, Nhà nước nên", "options": ["A. tăng chi tiêu, giảm thuế để kích thích kinh tế.", "B. giảm chi tiêu, tăng thuế.", "C. ngừng mọi khoản chi.", "D. tăng thuế thật cao."], "answer": "A", "explain": "Khi suy thoái, tăng chi và giảm thuế giúp kích thích tiêu dùng, đầu tư, phục hồi tăng trưởng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi lạm phát cao, Nhà nước nên", "options": ["A. tăng chi tiêu, giảm thuế.", "B. giảm chi tiêu, tăng thuế để kiềm chế lạm phát.", "C. in thêm thật nhiều tiền.", "D. bỏ mặc lạm phát."], "answer": "B", "explain": "Khi lạm phát cao, giảm chi và tăng thuế giúp hút bớt tiền trong lưu thông, kiềm chế lạm phát.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhà nước miễn học phí cho học sinh tiểu học ở vùng khó khăn. Khoản chi này thể hiện vai trò", "options": ["A. thực hiện công bằng xã hội.", "B. tăng thu ngân sách.", "C. trả nợ nước ngoài.", "D. dự trữ quốc gia."], "answer": "A", "explain": "Miễn học phí cho học sinh nghèo là chi cho giáo dục, an sinh — thực hiện công bằng xã hội.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong đợt dịch bệnh, Nhà nước tăng chi hỗ trợ người dân và doanh nghiệp, đồng thời giảm, giãn thuế. Chính sách này nhằm", "options": ["A. kích thích kinh tế, ổn định đời sống trong suy thoái.", "B. tăng thu ngân sách tối đa.", "C. kiềm chế lạm phát.", "D. giảm vai trò của ngân sách."], "answer": "A", "explain": "Tăng chi, giảm thuế khi kinh tế khó khăn là chính sách kích thích: hỗ trợ đời sống, giúp doanh nghiệp vượt khó, phục hồi tăng trưởng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về vai trò ngân sách:", "statements": ["a) Ngân sách là công cụ điều tiết vĩ mô.", "b) Ngân sách đảm bảo quốc phòng, an ninh.", "c) Ngân sách góp phần thực hiện công bằng xã hội.", "d) Ngân sách không liên quan đến tăng trưởng kinh tế."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: đầu tư từ ngân sách (hạ tầng) thúc đẩy tăng trưởng kinh tế.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Suy thoái nên tăng chi, giảm thuế.", "b) Lạm phát cao nên giảm chi, tăng thuế.", "c) Miễn học phí cho học sinh nghèo là công bằng xã hội.", "d) Chính sách thu – chi không ảnh hưởng đến nền kinh tế."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: chính sách thu – chi tác động mạnh đến tổng cầu và tăng trưởng.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Mẹo nhớ vai trò của ngân sách: Điều tiết – Quốc phòng – Công bằng – ...».", "answer": "Tăng trưởng", "explain": "Vai trò: điều tiết vĩ mô, quốc phòng an ninh, công bằng xã hội, tăng trưởng kinh tế.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Khi lạm phát cao, Nhà nước giảm chi và tăng thuế để ... lạm phát. Điền từ còn thiếu.", "answer": "kiềm chế", "explain": "Giảm chi, tăng thuế giúp hút bớt tiền trong lưu thông, kiềm chế lạm phát.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Đặc điểm nào sau đây thuộc về ngân sách nhà nước?", "options": ["A. Do Nhà nước quyết định, mang tính pháp lí cao.", "B. Do một cá nhân tùy ý quyết định.", "C. Không cần cân đối thu chi.", "D. Chỉ có khoản thu, không có khoản chi."], "answer": "A", "explain": "Ngân sách nhà nước do Nhà nước (Quốc hội) quyết định, mang tính pháp lí cao, gồm cả thu và chi phải cân đối.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngân sách nhà nước thường được dự toán theo thời gian", "options": ["A. một năm.", "B. một ngày.", "C. một giờ.", "D. một thế kỉ."], "answer": "A", "explain": "Ngân sách nhà nước được dự toán và thực hiện thường theo năm (năm ngân sách).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao ngân sách nhà nước mang tính pháp lí cao?", "options": ["A. Vì do Quốc hội quyết định, mọi tổ chức cá nhân phải tuân thủ.", "B. Vì được in thành sách đẹp.", "C. Vì ai cũng được tự ý thay đổi.", "D. Vì không ai kiểm tra."], "answer": "A", "explain": "Ngân sách do Quốc hội quyết định thành luật nên có tính bắt buộc, mọi tổ chức, cá nhân phải tuân thủ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thu – chi ngân sách phải «cân đối» có nghĩa là", "options": ["A. thu và chi phải tương xứng, không để bội chi quá lớn.", "B. thu bằng không.", "C. chi bao nhiêu cũng được.", "D. không cần quan tâm đến thu."], "answer": "A", "explain": "Cân đối ngân sách nghĩa là thu – chi phải tương xứng, hạn chế bội chi quá lớn gây mất ổn định.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một cán bộ xã dùng tiền ngân sách cấp cho xây đường để chi tiêu cá nhân. Hành vi này vi phạm", "options": ["A. pháp luật về quản lí, sử dụng ngân sách nhà nước.", "B. quyền tự do cá nhân.", "C. quy luật cung – cầu.", "D. không vi phạm gì."], "answer": "A", "explain": "Tham ô, sử dụng sai mục đích tiền ngân sách là vi phạm pháp luật, bị xử lí nghiêm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Người dân có thể giám sát việc sử dụng ngân sách nhà nước thông qua", "options": ["A. đại biểu dân cử, phản ánh, tố cáo sai phạm.", "B. tự ý kiểm tra két sắt cơ quan.", "C. không có quyền gì.", "D. tự quyết định ngân sách."], "answer": "A", "explain": "Công dân giám sát qua đại biểu Quốc hội, HĐND, phản ánh, tố cáo hành vi tham nhũng, lãng phí.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ngân sách nhà nước mang tính pháp lí cao.", "b) Thu – chi ngân sách cần được cân đối.", "c) Mọi tổ chức, cá nhân phải tuân thủ luật ngân sách.", "d) Ai cũng được tự ý sử dụng tiền ngân sách."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: sử dụng sai mục đích tiền ngân sách là vi phạm pháp luật.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tham ô tiền ngân sách bị xử lí theo pháp luật.", "b) Công dân có quyền giám sát sử dụng ngân sách.", "c) Tiết kiệm, chống lãng phí tài sản công là trách nhiệm công dân.", "d) Tiền ngân sách là tiền riêng của cán bộ."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: tiền ngân sách là tài sản chung của Nhà nước, phục vụ lợi ích công.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Ngân sách nhà nước do ... quyết định».", "answer": "Quốc hội", "explain": "Ngân sách nhà nước do Quốc hội quyết định.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hành vi dùng tiền ngân sách sai mục đích, vụ lợi cá nhân được gọi là tham ô và ... Điền từ còn thiếu.", "answer": "lãng phí", "explain": "Tham ô, lãng phí tiền ngân sách là vi phạm pháp luật, bị xử lí nghiêm.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Khoản chi «trả nợ gốc và lãi các khoản vay» thuộc loại chi", "options": ["A. chi trả nợ.", "B. chi thường xuyên.", "C. chi đầu tư phát triển.", "D. chi dự trữ."], "answer": "A", "explain": "Chi trả nợ là khoản chi để trả nợ gốc và lãi các khoản vay của Nhà nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khoản chi «dự trữ lương thực, thuốc men quốc gia» thuộc loại chi", "options": ["A. chi dự trữ quốc gia.", "B. chi thường xuyên.", "C. chi trả nợ.", "D. chi đầu tư."], "answer": "A", "explain": "Dự trữ lương thực, thuốc men, hàng hóa thiết yếu là chi dự trữ quốc gia.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tiền lương của công an, bộ đội được chi từ ngân sách thuộc loại", "options": ["A. chi thường xuyên và chi cho quốc phòng, an ninh.", "B. chi đầu tư phát triển.", "C. chi trả nợ.", "D. thu từ tài nguyên."], "answer": "A", "explain": "Trả lương cho lực lượng vũ trang là chi thường xuyên, đồng thời đảm bảo quốc phòng, an ninh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Xây dựng bệnh viện mới ở huyện nghèo thuộc loại chi", "options": ["A. chi đầu tư phát triển.", "B. chi thường xuyên.", "C. chi trả nợ.", "D. chi dự trữ."], "answer": "A", "explain": "Xây dựng bệnh viện mới là đầu tư xây dựng cơ bản, thuộc chi đầu tư phát triển.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong cơ cấu chi ngân sách, khoản chi nào thường chiếm tỉ trọng lớn nhất?", "options": ["A. Chi thường xuyên.", "B. Chi dự trữ quốc gia.", "C. Chi trả nợ.", "D. Chi viện trợ."], "answer": "A", "explain": "Chi thường xuyên (nuôi bộ máy, trả lương) thường chiếm tỉ trọng lớn nhất trong cơ cấu chi ngân sách.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một quốc gia chi quá nhiều cho bộ máy hành chính mà ít đầu tư phát triển. Hệ quả có thể là", "options": ["A. hạ tầng lạc hậu, tăng trưởng chậm lại.", "B. kinh tế phát triển nhanh.", "C. ngân sách dư thừa.", "D. không ảnh hưởng gì."], "answer": "A", "explain": "Chi thường xuyên quá lớn lấn át chi đầu tư phát triển sẽ làm hạ tầng lạc hậu, kìm hãm tăng trưởng — cần cơ cấu chi hợp lí.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trả nợ gốc và lãi thuộc chi trả nợ.", "b) Dự trữ lương thực thuộc chi dự trữ quốc gia.", "c) Xây trường học thuộc chi đầu tư phát triển.", "d) Mọi khoản chi đều là chi thường xuyên."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: có nhiều loại chi khác nhau.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chi thường xuyên thường chiếm tỉ trọng lớn nhất.", "b) Cần cơ cấu chi hợp lí giữa thường xuyên và đầu tư.", "c) Chi đầu tư phát triển tạo hạ tầng cho tăng trưởng.", "d) Chi cho quốc phòng, an ninh là không cần thiết."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: quốc phòng, an ninh là nhiệm vụ trọng yếu được ngân sách đảm bảo.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Trả lương cán bộ, công chức thuộc chi ...».", "answer": "thường xuyên", "explain": "Chi thường xuyên: nuôi bộ máy nhà nước — trả lương cán bộ, công chức.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Xây cầu, đường, trường học, bệnh viện thuộc chi ... phát triển. Điền từ còn thiếu.", "answer": "đầu tư", "explain": "Chi đầu tư phát triển: xây dựng cầu đường, trường học, bệnh viện, hạ tầng.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trách nhiệm của công dân đối với ngân sách nhà nước là", "options": ["A. nộp thuế đầy đủ, đúng hạn; tiết kiệm, chống lãng phí.", "B. trốn thuế để giữ tiền.", "C. sử dụng tài sản công tùy ý.", "D. không quan tâm đến ngân sách."], "answer": "A", "explain": "Công dân phải nộp thuế đầy đủ, đúng hạn; giám sát sử dụng ngân sách; tiết kiệm, chống lãng phí tài sản công.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nộp thuế đầy đủ, đúng hạn là", "options": ["A. nghĩa vụ của tổ chức, cá nhân.", "B. việc tự nguyện thích thì làm.", "C. trách nhiệm chỉ của doanh nghiệp.", "D. không bắt buộc."], "answer": "A", "explain": "Nộp thuế là nghĩa vụ bắt buộc của tổ chức, cá nhân theo quy định pháp luật.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hành vi nào sau đây thể hiện trách nhiệm với ngân sách nhà nước?", "options": ["A. Tố cáo hành vi tham nhũng tiền ngân sách.", "B. Bao che cho người tham ô.", "C. Sử dụng điện công vào việc riêng.", "D. Khai gian để trốn thuế."], "answer": "A", "explain": "Tố cáo tham nhũng là thực hiện quyền giám sát của công dân đối với việc sử dụng ngân sách.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Học sinh có thể góp phần vào ngân sách nhà nước bằng cách", "options": ["A. tiết kiệm điện, nước ở trường; không phá hoại tài sản công.", "B. xả rác bừa bãi.", "C. vẽ bậy lên bàn ghế.", "D. bỏ học đi làm thuê."], "answer": "A", "explain": "Tiết kiệm, bảo vệ tài sản công là cách học sinh góp phần sử dụng hiệu quả ngân sách nhà nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một doanh nghiệp kê khai gian dối để nộp thuế ít hơn. Hành vi này", "options": ["A. vi phạm pháp luật, làm thất thu ngân sách.", "B. là quyền của doanh nghiệp.", "C. giúp tăng thu ngân sách.", "D. không ảnh hưởng đến ai."], "answer": "A", "explain": "Trốn thuế, gian lận thuế là vi phạm pháp luật, làm thất thu ngân sách nhà nước, bị xử phạt.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Người dân phát hiện cán bộ xã «rút ruột» công trình đường giao thông nông thôn. Việc làm đúng đắn nhất là", "options": ["A. tố cáo đến cơ quan có thẩm quyền.", "B. im lặng vì sợ phiền phức.", "C. chia sẻ để trục lợi cùng.", "D. tự ý xử lí cán bộ đó."], "answer": "A", "explain": "Tố cáo đến cơ quan có thẩm quyền là cách đúng đắn để bảo vệ tài sản công, phát huy quyền giám sát của công dân.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nộp thuế là nghĩa vụ của công dân.", "b) Tiết kiệm tài sản công là trách nhiệm của mọi người.", "c) Tố cáo tham nhũng là quyền của công dân.", "d) Trốn thuế là hành vi đáng khuyến khích."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: trốn thuế vi phạm pháp luật, bị xử phạt.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kê khai gian dối để trốn thuế là vi phạm pháp luật.", "b) Học sinh tiết kiệm điện nước là góp phần bảo vệ ngân sách.", "c) Bao che tham nhũng là vi phạm pháp luật.", "d) Giám sát ngân sách là việc chỉ của cơ quan nhà nước."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: mọi công dân đều có quyền giám sát việc sử dụng ngân sách.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Nộp thuế đầy đủ, ... là nghĩa vụ của tổ chức, cá nhân».", "answer": "đúng hạn", "explain": "Nộp thuế đầy đủ, đúng hạn là nghĩa vụ của tổ chức, cá nhân.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tiền thuế của dân bị cán bộ chiếm đoạt để chi tiêu cá nhân gọi là hành vi tham ... Điền từ còn thiếu.", "answer": "ô", "explain": "Tham ô: chiếm đoạt tài sản công (tiền ngân sách) để chi tiêu cá nhân.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Ngân sách nhà nước phản ánh quan hệ kinh tế giữa", "options": ["A. Nhà nước với các chủ thể trong xã hội.", "B. các cá nhân với nhau.", "C. doanh nghiệp với doanh nghiệp.", "D. người dân với thiên nhiên."], "answer": "A", "explain": "Ngân sách phản ánh các quan hệ kinh tế giữa Nhà nước với các chủ thể trong xã hội (thu thuế, chi tiêu...).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khoản chi cho giáo dục, y tế, văn hóa thuộc loại", "options": ["A. chi sự nghiệp.", "B. chi trả nợ.", "C. chi dự trữ.", "D. chi quốc phòng."], "answer": "A", "explain": "Chi cho giáo dục, y tế, văn hóa, khoa học là chi sự nghiệp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhà nước xây thêm bệnh viện, trường học ở vùng khó khăn. Khoản chi này vừa thuộc chi đầu tư phát triển vừa thể hiện", "options": ["A. công bằng xã hội.", "B. trả nợ nước ngoài.", "C. dự trữ quốc gia.", "D. tăng thuế."], "answer": "A", "explain": "Đầu tư cho vùng khó khăn giúp người dân nơi đây được hưởng dịch vụ như nơi khác — thực hiện công bằng xã hội.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tiền hỗ trợ người có công với cách mạng được chi từ ngân sách thuộc loại", "options": ["A. chi an sinh xã hội.", "B. chi đầu tư phát triển.", "C. chi trả nợ.", "D. chi thường xuyên."], "answer": "A", "explain": "Trợ cấp người có công, hộ nghèo là chi an sinh xã hội.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong đại dịch, Nhà nước chi hàng nghìn tỉ đồng mua vắc xin tiêm miễn phí cho người dân. Đây là", "options": ["A. chi sự nghiệp y tế và an sinh xã hội, bảo vệ sức khỏe cộng đồng.", "B. chi trả nợ.", "C. thu từ tài nguyên.", "D. chi dự trữ quốc gia duy nhất."], "answer": "A", "explain": "Mua vắc xin tiêm miễn phí là chi cho y tế, bảo vệ sức khỏe người dân — chi sự nghiệp và an sinh xã hội.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một quốc gia dành tỉ lệ chi cho giáo dục cao trong ngân sách. Điều này cho thấy quốc gia đó", "options": ["A. coi trọng phát triển con người, đầu tư cho tương lai.", "B. lãng phí ngân sách.", "C. không quan tâm đến kinh tế.", "D. chỉ chi cho giáo dục mà bỏ các lĩnh vực khác."], "answer": "A", "explain": "Đầu tư cho giáo dục là đầu tư cho con người — nền tảng của phát triển bền vững, thể hiện tầm nhìn dài hạn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chi cho giáo dục, y tế thuộc chi sự nghiệp.", "b) Trợ cấp người có công thuộc an sinh xã hội.", "c) Ngân sách phản ánh quan hệ Nhà nước với các chủ thể.", "d) Chi ngân sách chỉ phục vụ một nhóm người."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: chi ngân sách phục vụ lợi ích chung của toàn xã hội.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đầu tư cho vùng khó khăn thể hiện công bằng xã hội.", "b) Mua vắc xin tiêm miễn phí là chi y tế.", "c) Chi cho giáo dục là đầu tư cho tương lai.", "d) An sinh xã hội làm tăng phân hóa giàu nghèo."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: an sinh xã hội giúp giảm phân hóa giàu nghèo.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Chi cho giáo dục, y tế, văn hóa, khoa học là chi ...».", "answer": "sự nghiệp", "explain": "Chi sự nghiệp: giáo dục, y tế, văn hóa, khoa học...", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trợ cấp hộ nghèo, người có công thuộc chi ... xã hội. Điền từ còn thiếu.", "answer": "an sinh", "explain": "Chi an sinh xã hội: trợ cấp hộ nghèo, người có công, đối tượng chính sách.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Thu ngân sách từ hoạt động nào sau đây là bền vững nhất?", "options": ["A. Thuế từ sản xuất, kinh doanh.", "B. Vay nợ nước ngoài.", "C. Bán tài nguyên cạn kiệt.", "D. In tiền."], "answer": "A", "explain": "Thuế từ sản xuất kinh doanh là nguồn thu chủ yếu, ổn định, bền vững; vay nợ và bán tài nguyên cạn kiệt không bền vững.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vay nợ để bù đắp bội chi là", "options": ["A. giải pháp tình thế, không thể lạm dụng.", "B. giải pháp tốt nhất nên vay càng nhiều càng tốt.", "C. không bao giờ được phép.", "D. không ảnh hưởng gì đến tương lai."], "answer": "A", "explain": "Vay nợ bù bội chi là giải pháp tình thế; lạm dụng gây nợ công cao, ảnh hưởng thế hệ tương lai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không nên lạm dụng vay nợ để bù bội chi?", "options": ["A. Vì làm nợ công tăng cao, thế hệ sau phải trả.", "B. Vì vay nợ không tốn chi phí.", "C. Vì chủ nợ không bao giờ đòi.", "D. Vì vay nợ làm tăng thu nhập."], "answer": "A", "explain": "Vay nợ nhiều làm nợ công tăng cao, gánh nặng trả nợ đè lên thế hệ tương lai, có nguy cơ mất ổn định kinh tế vĩ mô.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biện pháp nào giúp tăng thu ngân sách bền vững?", "options": ["A. Nuôi dưỡng nguồn thu: hỗ trợ doanh nghiệp phát triển, chống thất thu thuế.", "B. Tăng thuế thật cao một lần.", "C. Bán hết tài nguyên.", "D. Vay nợ tối đa."], "answer": "A", "explain": "Nuôi dưỡng nguồn thu (hỗ trợ sản xuất kinh doanh phát triển) và chống thất thu thuế là cách tăng thu bền vững.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một địa phương tăng cường chống buôn lậu, gian lận thuế nên thu ngân sách tăng mà không cần tăng thuế suất. Đây là", "options": ["A. chống thất thu thuế, tăng thu bền vững.", "B. tăng gánh nặng cho người dân.", "C. bội chi ngân sách.", "D. giảm thu ngân sách."], "answer": "A", "explain": "Chống buôn lậu, gian lận thuế giúp thu đúng, thu đủ — tăng thu mà không tăng gánh nặng cho người nộp thuế chân chính.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Quan điểm «vay nợ hôm nay, thế hệ sau trả» nhắc nhở điều gì?", "options": ["A. Cần quản lí nợ công chặt chẽ, vay trong giới hạn an toàn.", "B. Nên vay càng nhiều càng tốt.", "C. Thế hệ sau không liên quan đến nợ hôm nay.", "D. Vay nợ không cần trả."], "answer": "A", "explain": "Nợ hôm nay là gánh nặng của thế hệ sau nên phải quản lí nợ công chặt chẽ, giữ trong giới hạn an toàn, vay để đầu tư hiệu quả.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thuế từ sản xuất kinh doanh là nguồn thu bền vững.", "b) Vay nợ bù bội chi không nên lạm dụng.", "c) Chống thất thu thuế giúp tăng thu ngân sách.", "d) Vay nợ càng nhiều càng tốt."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: vay nợ quá nhiều gây nợ công cao, mất an toàn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nợ công cao là gánh nặng cho thế hệ tương lai.", "b) Cần giữ nợ công trong giới hạn an toàn.", "c) Hỗ trợ doanh nghiệp phát triển giúp nuôi dưỡng nguồn thu.", "d) Bán tài nguyên cạn kiệt là nguồn thu bền vững."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: tài nguyên cạn kiệt dần nên không phải nguồn thu bền vững.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «... thất thu thuế giúp tăng thu ngân sách mà không tăng gánh nặng».", "answer": "Chống", "explain": "Chống thất thu thuế (chống buôn lậu, gian lận thuế) giúp tăng thu bền vững.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vay nợ quá nhiều làm ... công tăng cao. Điền từ còn thiếu.", "answer": "nợ", "explain": "Vay nợ quá nhiều làm nợ công tăng cao, đe dọa ổn định kinh tế vĩ mô.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Năm ngân sách ở Việt Nam được tính từ", "options": ["A. ngày 1 tháng 1 đến ngày 31 tháng 12.", "B. ngày 1 tháng 9 đến ngày 31 tháng 8.", "C. ngày Tết Nguyên đán đến Tết năm sau.", "D. bất kì thời điểm nào."], "answer": "A", "explain": "Năm ngân sách ở Việt Nam tính từ ngày 1 tháng 1 đến ngày 31 tháng 12 hằng năm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dự toán ngân sách là", "options": ["A. kế hoạch thu, chi dự kiến trong năm.", "B. số tiền đã chi thực tế.", "C. số nợ phải trả.", "D. tiền tiết kiệm của Nhà nước."], "answer": "A", "explain": "Dự toán ngân sách là kế hoạch thu, chi dự kiến của Nhà nước trong năm ngân sách, do Quốc hội quyết định.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quyết toán ngân sách là", "options": ["A. báo cáo thu, chi thực tế sau khi năm ngân sách kết thúc.", "B. kế hoạch thu, chi dự kiến.", "C. dự báo thu, chi năm sau.", "D. vay nợ nước ngoài."], "answer": "A", "explain": "Quyết toán là việc tổng kết, báo cáo số thu, chi thực tế sau khi năm ngân sách kết thúc để Quốc hội phê chuẩn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trình tự đúng trong quản lí ngân sách nhà nước là", "options": ["A. lập dự toán – chấp hành – quyết toán.", "B. quyết toán – lập dự toán – chấp hành.", "C. chấp hành – quyết toán – lập dự toán.", "D. vay nợ – chi tiêu – quyết toán."], "answer": "A", "explain": "Trình tự: lập dự toán (kế hoạch), chấp hành (thực hiện thu chi), quyết toán (tổng kết báo cáo).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cuối năm, Chính phủ báo cáo Quốc hội về số thu, chi thực tế của năm ngân sách. Đây là hoạt động", "options": ["A. quyết toán ngân sách.", "B. lập dự toán ngân sách.", "C. vay nợ nước ngoài.", "D. in tiền."], "answer": "A", "explain": "Báo cáo thu, chi thực tế sau khi năm ngân sách kết thúc để Quốc hội phê chuẩn là quyết toán ngân sách.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Quốc hội thảo luận, thông qua kế hoạch thu chi cho năm tới vào cuối năm nay. Đây là hoạt động", "options": ["A. quyết định dự toán ngân sách.", "B. quyết toán ngân sách.", "C. chấp hành ngân sách.", "D. vay nợ công."], "answer": "A", "explain": "Thông qua kế hoạch thu, chi cho năm tới là quyết định dự toán ngân sách.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Năm ngân sách tính từ 1 tháng 1 đến 31 tháng 12.", "b) Dự toán là kế hoạch thu, chi dự kiến.", "c) Quyết toán là báo cáo thu, chi thực tế.", "d) Không cần lập dự toán ngân sách."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: phải lập dự toán để quản lí thu chi có kế hoạch.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trình tự quản lí: lập dự toán – chấp hành – quyết toán.", "b) Quốc hội phê chuẩn quyết toán ngân sách.", "c) Dự toán giúp quản lí thu chi có kế hoạch.", "d) Quyết toán được thực hiện trước khi lập dự toán."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: quyết toán tổng kết năm cũ, diễn ra sau chấp hành.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «... toán ngân sách là kế hoạch thu, chi dự kiến trong năm».", "answer": "Dự", "explain": "Dự toán ngân sách là kế hoạch thu, chi dự kiến trong năm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp đúng trình tự quản lí ngân sách: (1) Quyết toán, (2) Chấp hành, (3) Lập dự toán. Viết dãy số, ví dụ 123.", "answer": "321", "explain": "Trình tự: (3) lập dự toán, (2) chấp hành, (1) quyết toán.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Tiền xây dựng đường cao tốc Bắc – Nam được lấy từ", "options": ["A. ngân sách nhà nước (chi đầu tư phát triển).", "B. túi tiền cá nhân của bộ trưởng.", "C. tiền mừng tuổi của học sinh.", "D. quỹ lớp của trường học."], "answer": "A", "explain": "Xây dựng đường cao tốc là chi đầu tư phát triển từ ngân sách nhà nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lương hưu của cán bộ về hưu được chi từ", "options": ["A. ngân sách nhà nước (chi an sinh xã hội).", "B. doanh nghiệp tư nhân.", "C. tiền tiết kiệm cá nhân duy nhất.", "D. quỹ từ thiện nước ngoài."], "answer": "A", "explain": "Lương hưu, trợ cấp người có công là chi an sinh xã hội từ ngân sách nhà nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói «mỗi đồng thuế của dân đều có ý nghĩa»?", "options": ["A. Vì thuế tạo nên ngân sách để xây dựng đất nước, phục vụ người dân.", "B. Vì thuế làm giàu cho cán bộ.", "C. Vì thuế không được sử dụng.", "D. Vì thuế chỉ để trưng bày."], "answer": "A", "explain": "Thuế tạo nên ngân sách để xây cầu đường, trường học, bệnh viện, đảm bảo an sinh — phục vụ chính người dân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bạn học sinh xả nước bừa bãi ở trường. Hành động này liên quan đến ngân sách vì", "options": ["A. lãng phí tài sản công do ngân sách chi trả.", "B. không liên quan gì.", "C. giúp tăng thu ngân sách.", "D. là quyền của học sinh."], "answer": "A", "explain": "Điện, nước ở trường do ngân sách chi trả; lãng phí là lãng phí tài sản công.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Địa phương A thu ngân sách 500 tỉ đồng, chi 480 tỉ đồng. Địa phương B thu 400 tỉ đồng, chi 450 tỉ đồng. Nhận xét đúng là", "options": ["A. A bội thu 20 tỉ, B bội chi 50 tỉ.", "B. A bội chi, B bội thu.", "C. Cả hai đều cân bằng.", "D. Cả hai đều bội chi."], "answer": "A", "explain": "A: thu 500 lớn hơn chi 480 là bội thu 20 tỉ. B: chi 450 lớn hơn thu 400 là bội chi 50 tỉ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để đánh giá việc sử dụng ngân sách có hiệu quả không, cần xem xét", "options": ["A. tiền chi có đúng mục đích, mang lại lợi ích thiết thực cho người dân không.", "B. số tiền chi càng nhiều càng tốt.", "C. chi càng nhanh càng tốt.", "D. không cần đánh giá."], "answer": "A", "explain": "Hiệu quả ngân sách không nằm ở chi nhiều hay nhanh mà ở đúng mục đích, chống lãng phí, mang lại lợi ích thiết thực.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xây đường cao tốc là chi đầu tư phát triển.", "b) Lương hưu là chi an sinh xã hội.", "c) Thuế của dân góp phần xây dựng đất nước.", "d) Lãng phí tài sản công không ảnh hưởng đến ngân sách."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: lãng phí tài sản công là lãng phí tiền ngân sách.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hiệu quả ngân sách nằm ở đúng mục đích, chống lãng phí.", "b) Chi nhiều chưa chắc đã hiệu quả.", "c) Học sinh tiết kiệm điện nước là bảo vệ ngân sách.", "d) Ngân sách chỉ để chi, không cần đánh giá hiệu quả."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: phải đánh giá hiệu quả sử dụng ngân sách.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Mỗi đồng ... của dân đều có ý nghĩa vì tạo nên ngân sách xây dựng đất nước».", "answer": "thuế", "explain": "Thuế của người dân tạo nên ngân sách nhà nước để xây dựng đất nước.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Địa phương thu 500 tỉ, chi 480 tỉ thì bội thu bao nhiêu tỉ đồng? Viết số.", "answer": "20", "explain": "Bội thu = 500 − 480 = 20 tỉ đồng.", "points": 0.5}]}]}
