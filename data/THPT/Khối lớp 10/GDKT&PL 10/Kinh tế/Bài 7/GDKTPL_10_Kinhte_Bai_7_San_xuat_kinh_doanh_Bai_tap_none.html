ất.", "C. giảm thu nhập của nông dân.", "D. xóa bỏ sản xuất."], "answer": "A", "explain": "Hợp tác xã giúp nông dân liên kết, tương trợ, cùng có lợi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Công ty hợp danh thường hoạt động trong lĩnh vực", "options": ["A. cần uy tín cá nhân cao như luật, kiểm toán.", "B. sản xuất hàng loạt giá rẻ.", "C. không cần uy tín.", "D. chỉ buôn bán nhỏ lẻ."], "answer": "A", "explain": "Công ty hợp danh với thành viên chịu trách nhiệm vô hạn nên uy tín cao, phù hợp ngành luật, kiểm toán, tư vấn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nhóm luật sư cùng mở văn phòng, cùng chịu trách nhiệm bằng tài sản của mình về hoạt động của văn phòng. Mô hình phù hợp là", "options": ["A. công ty hợp danh.", "B. hộ kinh doanh.", "C. công ty cổ phần.", "D. hợp tác xã nông nghiệp."], "answer": "A", "explain": "Cùng hành nghề luật, cùng chịu trách nhiệm vô hạn — đặc trưng của công ty hợp danh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một làng nghề có 20 hộ cùng góp vốn mở xưởng chung, chia lợi nhuận theo vốn góp và công sức, mọi người cùng bàn bạc quyết định. Mô hình này gần với", "options": ["A. hợp tác xã.", "B. doanh nghiệp tư nhân.", "C. công ty cổ phần đại chúng.", "D. hộ kinh doanh cá thể."], "answer": "A", "explain": "Cùng góp vốn, cùng quyết định dân chủ, cùng có lợi — đặc trưng của hợp tác xã.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hợp tác xã hoạt động theo nguyên tắc tương trợ, cùng có lợi.", "b) Hợp tác xã cần tối thiểu 7 thành viên.", "c) Công ty hợp danh có thành viên chịu trách nhiệm vô hạn.", "d) Hợp tác xã do một người độc quyền quyết định."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: hợp tác xã quyết định dân chủ.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Công ty hợp danh phù hợp ngành cần uy tín cá nhân.  "questions": [{"type": "mcq", "level": "NB", "q": "Kinh doanh online (thương mại điện tử) là", "options": ["A. mua bán hàng hóa, dịch vụ qua mạng internet.", "B. chỉ bán hàng tại chợ.", "C. không phải hoạt động kinh doanh.", "D. bị pháp luật cấm."], "answer": "A", "explain": "Kinh doanh online là mua bán hàng hóa, dịch vụ qua mạng internet — mô hình ngày càng phổ biến.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ưu điểm của kinh doanh online là", "options": ["A. tiếp cận nhiều khách hàng, chi phí mặt bằng thấp.", "B. không cần quan tâm chất lượng.", "C. được phép bán hàng giả.", "D. không phải nộp thuế."], "answer": "A", "explain": "Kinh doanh online tiếp cận khách hàng rộng, tiết kiệm chi phí mặt bằng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Rủi ro khi mua hàng online là", "options": ["A. hàng không đúng mô tả, khó kiểm tra trực tiếp.", "B. luôn được hàng tốt.", "C. không bao giờ bị lừa.", "D. giá luôn rẻ nhất."], "answer": "A", "explain": "Mua online không được xem hàng trực tiếp nên rủi ro hàng không đúng mô tả, cần chọn shop uy tín.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Người bán hàng online có trách nhiệm", "options": ["A. mô tả trung thực, giao đúng hàng, kê khai thuế.", "B. giao hàng giả cho khách.", "C. chặn khách khi khiếu nại.", "D. không cần chịu trách nhiệm gì."], "answer": "A", "explain": "Bán online vẫn phải trung thực, giao đúng hàng, bảo hành và kê khai thuế như kinh doanh truyền thống.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn An đặt mua áo online, nhận được áo rách, shop từ chối đổi trả. Bạn An nên", "options": ["A. khiếu nại qua sàn thương mại điện tử, báo cơ quan bảo vệ người tiêu dùng.", "B. im lặng chấp nhận.", "C. đặt thêm nhiều đơn để trả đũa.", "D. tự sửa áo và bỏ qua."], "answer": "A", "explain": "Người tiêu dùng có quyền khiếu nại qua sàn, báo cơ quan bảo vệ quyền lợi người tiêu dùng khi bị vi phạm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một shop online bán  nghiệp.", "D. thất bại là do số phận."], "answer": "A", "explain": "Kiên trì, rút kinh nghiệm từ thất bại là phẩm chất quan trọng để khởi nghiệp thành công.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Khởi nghiệp là tự tổ chức sản xuất kinh doanh.", "b) Khởi nghiệp cần ý tưởng và kiến thức.", "c) Cần nghiên cứu thị trường trước khi khởi nghiệp.", "d) Khởi nghiệp không có rủi ro gì."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: khởi nghiệp có nhiều rủi ro cần lường trước.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nên bắt đầu khởi nghiệp từ quy mô nhỏ.", "b) Kiên trì giúp vượt qua thất bại khởi nghiệp.", "c) Học hỏi kinh nghiệm làm tăng cơ hội thành công.", "d) Vay nợ lớn ngay từ đầu là cách hay nhất."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: vay nợ lớn ngay từ đầu rất rủi ro.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Trước khi khởi nghiệp cần nghiên cứu thị trường, lập ... kinh doanh».", "answer": "kế hoạch", "explain": "Lập kế hoạch kinh doanh là bước quan trọng trước khi khởi nghiệp.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Phẩm chất quan trọng giúp vượt qua thất bại khi khởi nghiệp là sự ... Điền từ còn thiếu.", "answer": "kiên trì", "explain": "Kiên trì, học hỏi từ thất bại là yếu tố quan trọng của khởi nghiệp thành công.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Quảng cáo trung thực giúp doanh nghiệp", "options": ["A. xây dựng uy tín, thu hút khách hàng.", "B. lừa dối khách hàng.", "C. vi phạm pháp luật.", "D. mất uy tín."], "answer": "A", "explain": "Quảng cáo trung thực, đúng sự thật giúp xây dựng uy tín và thu hút khách hàng bền vững.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quảng cáo sai sự thật là", "options": ["A. vi phạm pháp luật và đạo đức kinh doanh.", "B. quyền tự do của doanh nghiệp.", "C. cách làm giàu hợp pháp.", "D. không ảnh hưởng đến ai."], "answer": "A", "explain": "Quảng cáo sai sự thật lừa dối người tiêu dùng, vi phạm pháp luật quảng cáo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một nhãn hàng quảng cáo «uống là khỏi bệnh» cho thực phẩm chức năng. Đây là", "options": ["A. quảng cáo sai sự thật, lừa dối người tiêu dùng.", "B. quảng cáo trung thực.", "C. quyền của nhãn hàng.", "D. không vi phạm gì."], "answer": "A", "explain": "Thực phẩm chức năng không phải thuốc chữa bệnh; quảng cáo «uống là khỏi bệnh» là sai sự thật, lừa dối.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi thấy quảng cáo «thần dược» chữa bách bệnh, người tiêu dùng nên", "options": ["A. cảnh giác, tìm hiểu kĩ, không tin mù quáng.", "B. mua ngay càng nhiều càng tốt.", "C. giới thiệu cho mọi người.", "D. vay tiền để mua."], "answer": "A", "explain": "Người tiêu dùng thông minh cảnh giác với quảng cáo thổi phồng, tìm hiểu kĩ trước khi mua.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một công ty bị phạt vì quảng cáo sữa «tăng chiều cao vượt trội» không có căn cứ khoa học. Bài học cho doanh nghiệp là", "options": ["A. quảng cáo phải trung thực, có căn cứ.", "B. cứ quảng cáo thổi phồng rồi nộp phạt.", "C. không cần quảng cáo.", "D. quảng cáo càng sai càng tốt."], "answer": "A", "explain": "Quảng cáo phải trung thực, có căn cứ khoa học; sai sự thật bị xử phạt và mất uy tín.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Doanh nghiệp dùng người nổi tiếng quảng cáo sản phẩm kém chất lượng. Trách nhiệm thuộc về", "options": ["A. cả doanh nghiệp và người quảng cáo thiếu trách nhiệm.", "B. chỉ người tiêu dùng.", "C. không ai cả.", "D. Nhà nước."], "answer": "A", "explain": "Doanh nghiệp chịu trách nhiệm về sản phẩm; người nổi tiếng quảng cáo thiếu kiểm chứng cũng phải chịu trách nhiệm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quảng cáo trung thực xây dựng uy tín.", "b) Quảng cáo sai sự thật vi phạm pháp luật.", "c) Người tiêu dùng nên cảnh giác với quảng cáo thổi phồng.", "d) Quảng cáo càng sai sự thật càng tốt."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: quảng cáo sai sự thật bị xử phạt.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thực phẩm chức năng không phải thuốc chữa bệnh.", "b) Quảng cáo phải có căn cứ khoa học.", "c) Người nổi tiếng quảng cáo sai cũng phải chịu trách nhiệm.", "d) Tin mù quáng vào quảng cáo là thông minh."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: cần cảnh giác, tìm hiểu kĩ.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Quảng cáo ... sự thật là vi phạm pháp luật».", "answer": "sai", "explain": "Quảng cáo sai sự thật lừa dối người tiêu dùng, vi phạm pháp luật.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Quảng cáo đúng sự thật, có căn cứ được gọi là quảng cáo ... Điền từ còn thiếu.", "answer": "trung thực", "explain": "Quảng cáo trung thực xây dựng uy tín bền vững.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Mục tiêu cuối cùng của sản xuất kinh doanh có đạo đức là", "options": ["A. lợi nhuận bền vững gắn với lợi ích xã hội.", "B. lợi nhuận bằng mọi giá.", "C. loại bỏ đối thủ.", "D. trốn thuế thành công."], "answer": "A", "explain": "Kinh doanh có đạo đức hướng tới lợi nhuận bền vững gắn với lợi ích của khách hàng và xã hội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thương hiệu mạnh được xây dựng từ", "options": ["A. chất lượng tốt, uy tín lâu dài.", "B. quảng cáo sai sự thật.", "C. bán hàng giả giá rẻ.", "D. lừa dối khách hàng."], "answer": "A", "explain": "Thương hiệu mạnh đến từ chất lượng tốt và uy tín được vun đắp lâu dài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nhiều doanh nghiệp công khai quy trình sản xuất cho khách hàng tham quan?", "options": ["A. Để tạo niềm tin, minh bạch — đạo đức kinh doanh.", "B. Để khoe khoang.", "C. Để tăng giá bán.", "D. Để che giấu sai phạm."], "answer": "A", "explain": "Minh bạch quy trình tạo niềm tin cho khách hàng — biểu hiện đạo đức kinh doanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Doanh nghiệp đạt chứng nhận chất lượng quốc tế cho thấy", "options": ["A. cam kết chất lượng, nâng cao uy tín.", "B. chỉ là hình thức.", "C. không cần thiết.", "D. để tăng giá vô tội vạ."], "answer": "A", "explain": "Chứng nhận chất lượng là cam kết với khách hàng, nâng cao uy tín thương hiệu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một công ty thực phẩm thu hồi toàn bộ lô hàng nghi nhiễm khuẩn dù tốn kém. Hành động này", "options": ["A. thể hiện trách nhiệm với người tiêu dùng, bảo vệ uy tín lâu dài.", "B. là lãng phí không cần thiết.", "C. làm mất uy tín công ty.", "D. vi phạm pháp luật."], "answer": "A", "explain": "Thu hồi hàng lỗi dù tốn kém thể hiện trách nhiệm với sức khỏe người tiêu dùng — bảo vệ uy tín lâu dài.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong dài hạn, doanh nghiệp nào tồn tại bền vững?", "options": ["A. Doanh nghiệp kinh doanh trung thực, có trách nhiệm xã hội.", "B. Doanh nghiệp chuyên bán hàng giả.", "C. Doanh nghiệp trốn thuế.", "D. Doanh nghiệp lừa dối khách hàng."], "answer": "A", "explain": "Trung thực và trách nhiệm xã hội tạo uy tín, niềm tin — nền tảng tồn tại bền vững.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lợi nhuận bền vững gắn với lợi ích xã hội.", "b) Thương hiệu mạnh đến từ chất lượng và uy tín.", "c) Minh bạch tạo niềm tin cho khách hàng.", "d) Gian dối giúp doanh nghiệp tồn tại lâu dài."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: gian dối sớm muộn cũng bị phát hiện và xử lí.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thu hồi hàng lỗi thể hiện trách nhiệm với người tiêu dùng.", "b) Chứng nhận chất lượng nâng cao uy tín.", "c) Trách nhiệm xã hội tạo lợi thế cạnh tranh.", "d) Chỉ cần lợi nhuận, không cần đạo đức."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: thiếu đạo đức thì không bền vững.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Thương hiệu mạnh được xây dựng từ chất lượng tốt và ... lâu dài».", "answer": "uy tín", "explain": "Thương hiệu mạnh đến từ chất lượng tốt và uy tín được vun đắp lâu dài.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Kinh doanh trung thực, có trách nhiệm xã hội hướng tới lợi nhuận ... Điền từ còn thiếu.", "answer": "bền vững", "explain": "Kinh doanh có đạo đức hướng tới lợi nhuận bền vững gắn với lợi ích xã hội.", "points": 0.5}]}]}
