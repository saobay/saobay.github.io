 kiệm đang có.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi đánh giá tình hình tài chính, cần liệt kê", "options": ["A. thu nhập, chi tiêu, tiết kiệm hiện tại.", "B. sở thích cá nhân.", "C. bạn bè.", "D. thời tiết."], "answer": "A", "explain": "Liệt kê đầy đủ thu nhập, các khoản chi tiêu và tiết kiệm hiện có để biết «điểm xuất phát».", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cần ghi chép chi tiêu hằng ngày?", "options": ["A. Vì giúp biết tiền đi đâu, kiểm soát và điều chỉnh chi tiêu.", "B. Vì ghi cho vui.", "C. Vì bắt buộc theo luật.", "D. Không có tác dụng gì."], "answer": "A", "explain": "Ghi chép giúp nhìn rõ dòng tiền, phát hiện khoản chi lãng phí để điều chỉnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bạn Bình ghi chép và phát hiện mỗi tháng tốn 600 nghìn đồng cho trà sữa. Đây là", "options": ["A. khoản chi cho «muốn», có thể cắt giảm để tiết kiệm.", "B. khoản chi thiết yếu không thể giảm.", "C. khoản đầu tư.", "D. tiền tiết kiệm."], "answer": "A", "explain": "Trà sữa là «muốn» chứ không phải «cần» thiết yếu — cắt giảm được để tăng tiết kiệm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Thu nhập mỗi tháng 2 triệu đồng, chi tiêu hiện tại 2,2 triệu đồng. Tình hình tài chính này", "options": ["A. không lành mạnh: chi vượt thu, cần cắt giảm ngay.", "B. rất tốt.", "C. không cần quan tâm.", "D. nên vay thêm để chi."], "answer": "A", "explain": "Chi (2,2 triệu) vượt thu (2 triệu) là mất cân đối — cần cắt giảm chi tiêu ngay.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người có thu nhập 10 triệu đồng, chi tiêu 7 triệu đồng, tiết kiệm 3 triệu đồng. Tỉ lệ tiết kiệm là", "options": ["A. 30 phần trăm.", "B. 70 phần trăm.", "C. 10 phần trăm.", "D. 3 phần trăm."], "answer": "A", "explain": "Tỉ lệ tiết kiệm = 3 / 10 = 30 phần trăm thu nhập.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cần đánh giá thu nhập, chi tiêu hiện tại.", "b) Ghi chép chi tiêu giúp kiểm soát tiền bạc.", "c) Chi vượt thu là không lành mạnh.", "d) Không cần biết tiền của mình đi đâu."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: phải biết rõ dòng tiền của mình.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trà sữa, ăn vặt là khoản «muốn», có thể cắt giảm.", "b) Phát hiện chi lãng phí qua ghi chép.", "c) Chi vượt thu cần điều chỉnh ngay.", "d) Mọi khoản chi đều thiết yếu như nhau."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: cần phân biệt «cần» và «muốn».", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Bước 2: đánh giá tình hình ... hiện tại».", "answer": "tài chính", "explain": "Bước 2: đánh giá tình hình tài chính hiện tại.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thu nhập 10 triệu, tiết kiệm 3 triệu thì tỉ lệ tiết kiệm là bao nhiêu phần trăm? Viết số.", "answer": "30", "explain": "3 / 10 = 30 phần trăm.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Quy tắc 50/30/20 trong quản lí tài chính có nghĩa là", "options": ["A. 50 phần trăm thiết yếu, 30 phần trăm mong muốn, 20 phần trăm tiết kiệm.", "B. 50 phần trăm tiết kiệm, 30 phần trăm thiết yếu, 20 phần trăm mong muốn.", "C. chia đều 3 phần bằng nhau.", "D. tiêu hết 100 phần trăm."], "answer": "A", "explain": "Quy tắc 50/30/20: 50 phần trăm thu nhập cho nhu cầu thiết yếu, 30 phần trăm cho mong muốn, 20 phần trăm tiết kiệm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo quy tắc 50/30/20, khoản tiết kiệm chiếm", "options": ["A. 20 phần trăm thu nhập.", "B. 50 phần trăm thu nhập.", "C. 30 phần trăm thu nhập.", "D. 100 phần trăm thu nhập."], "answer": "A", "explain": "Tiết kiệm chiếm 20 phần trăm thu nhập theo quy tắc 50/30/20.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một người thu nhập 10 triệu đồng mỗi tháng. Theo quy tắc 50/30/20, số tiền tiết kiệm là", "options": ["A. 2 triệu đồng.", "B. 5 triệu đồng.", "C. 3 triệu đồng.", "D. 10 triệu đồng."], "answer": "A", "explain": "Tiết kiệm = 10 × 20 phần trăm = 2 triệu đồng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khoản «chi tiêu thiết yếu» gồm", "options": ["A. ăn uống, đi lại, học tập.", "B. du lịch sang chảnh.", "C. mua đồ hiệu.", "D. chơi game nạp tiền."], "answer": "A", "explain": "Chi tiêu thiết yếu là những khoản không thể thiếu: ăn uống, đi lại, học tập, nhà ở.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn Mai thu nhập 3 triệu đồng mỗi tháng từ làm thêm. Theo quy tắc 50/30/20, bạn nên phân bổ", "options": ["A. 1,5 triệu thiết yếu; 900 nghìn mong muốn; 600 nghìn tiết kiệm.", "B. tiêu hết 3 triệu.", "C. tiết kiệm 3 triệu, không chi gì.", "D. 3 triệu cho mong muốn."], "answer": "A", "explain": "50 phần trăm × 3 triệu = 1,5 triệu; 30 phần trăm = 900 nghìn; 20 phần trăm = 600 nghìn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người áp dụng quy tắc 50/30/20 nhưng thấy 50 phần trăm không đủ cho chi tiêu thiết yếu. Cách xử lí đúng là", "options": ["A. điều chỉnh linh hoạt, cắt giảm mong muốn, tăng thu nhập.", "B. bỏ luôn khoản tiết kiệm.", "C. vay nợ để bù.", "D. bỏ quy tắc."], "answer": "A", "explain": "Quy tắc là gợi ý, cần điều chỉnh linh hoạt: cắt «muốn», tăng thu nhập, nhưng cố giữ khoản tiết kiệm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quy tắc 50/30/20 chia thu nhập thành 3 phần.", "b) Tiết kiệm chiếm 20 phần trăm theo quy tắc.", "c) Chi tiêu thiết yếu chiếm 50 phần trăm.", "d) Nên tiêu hết 100 phần trăm thu nhập."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: phải dành 20 phần trăm tiết kiệm.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ăn uống, đi lại là chi tiêu thiết yếu.", "b) Du lịch, đồ hiệu là khoản «mong muốn».", "c) Quy tắc có thể điều chỉnh linh hoạt.", "d) Không bao giờ được điều chỉnh quy tắc."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: cần điều chỉnh linh hoạt theo hoàn cảnh.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Quy tắc ...: 50 phần trăm thiết yếu, 30 phần trăm mong muốn, 20 phần trăm tiết kiệm».", "answer": "50/30/20", "explain": "Quy tắc 50/30/20 trong quản lí tài chính cá nhân.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thu nhập 10 triệu đồng, theo quy tắc 50/30/20 thì tiết kiệm bao nhiêu triệu đồng? Viết số.", "answer": "2", "explain": "10 × 20 phần trăm = 2 triệu đồng.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên tắc «trả cho mình trước» có nghĩa là", "options": ["A. có thu nhập thì trích tiết kiệm ngay rồi mới chi tiêu.", "B. tiêu hết rồi còn dư mới tiết kiệm.", "C. trả nợ cho người khác trước.", "D. mua sắm trước rồi tính sau."], "answer": "A", "explain": "«Trả cho mình trước»: nhận thu nhập thì trích ngay khoản tiết kiệm, phần còn lại mới chi tiêu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tắc bất di bất dịch trong tài chính cá nhân là", "options": ["A. chi tiêu nhỏ hơn thu nhập.", "B. chi tiêu lớn hơn thu nhập.", "C. chi bằng thu nhập.", "D. không cần quan tâm."], "answer": "A", "explain": "Chi tiêu phải nhỏ hơn thu nhập — nguyên tắc bất di bất dịch.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao «tiêu hết rồi còn dư mới tiết kiệm» thường thất bại?", "options": ["A. Vì thường không còn dư để tiết kiệm.", "B. Vì tiết kiệm là không cần thiết.", "C. Vì tiền tự sinh sôi.", "D. Vì ai cũng giàu."], "answer": "A", "explain": "Tâm lí chi tiêu thường «ngốn» hết thu nhập nên cuối tháng chẳng còn gì — phải tiết kiệm trước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quỹ dự phòng tài chính dùng để", "options": ["A. ứng phó tình huống bất ngờ như ốm đau, hỏng xe.", "B. mua sắm hàng hiệ : "VDC", "q": "Khoản tiền dành cho tình huống bất ngờ như ốm đau gọi là quỹ ... Điền từ còn thiếu.", "answer": "dự phòng", "explain": "Quỹ dự phòng cho tình huống bất ngờ.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Phân biệt «cần» và «muốn» trong chi tiêu: «cần» là", "options": ["A. nhu cầu thiết yếu không thể thiếu.", "B. sở thích nhất thời.", "C. đồ hiệu xa xỉ.", "D. không quan trọng."], "answer": "A", "explain": "«Cần» là nhu cầu thiết yếu (ăn, ở, học tập); «muốn» là mong muốn, sở thích có thể hoãn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các khoản sau, khoản nào thuộc «muốn»?", "options": ["A. Trà sữa mỗi ngày.", "B. Cơm ăn hằng ngày.", "C. Sách giáo khoa.", "D. Tiền xe buýt đi học."], "answer": "A", "explain": "Trà sữa mỗi ngày là sở thích («muốn»), có thể cắt giảm; các khoản còn lại là thiết yếu («cần»).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi tiền eo hẹp, thứ tự ưu tiên chi tiêu đúng là", "options": ["A. «cần» trước, «muốn» sau.", "B. «muốn» trước, «cần» sau.", "C. chỉ chi cho «muốn».", "D. không chi gì cả."], "answer": "A", "explain": "Ưu tiên nhu cầu thiết yếu («cần») trước, mong muốn («muốn») sau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mẹo «đợi 24 giờ» trước khi mua món đồ không thiết yếu giúp", "options": ["A. tránh mua sắm bốc đồng.", "B. mua được nhiều hơn.", "C. tăng giá món đồ.", "D. không có tác dụng."], "answer": "A", "explain": "Đợi 24 giờ giúp cơn «thèm mua» qua đi, tránh mua sắm bốc đồng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn Hùng thấy đôi giày hiệu giảm giá, rất muốn mua dù đã có 3 đôi giày. Theo nguyên tắc «cần» và «muốn», bạn Hùng nên", "options": ["A. đợi 24 giờ suy nghĩ, ưu tiên tiết kiệm vì đây là «muốn».", "B. mua ngay không cần nghĩ.", "C. vay tiền để mua.", "D. mua 2 đôi cho chắc."], "answer": "A", "explain": "Đã có 3 đôi giày thì đôi thứ 4 là «muốn» — nên cân nhắc, đợi 24 giờ, ưu tiên tiết kiệm.", "points": 0.25} "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một học sinh để dành tiền mừng tuổi vào heo đất. Đây là", "options": ["A. thói quen tiết kiệm tốt.", "B. lãng phí.", "C. không cần thiết.", "D. vi phạm."], "answer": "A", "explain": "Bỏ heo đất là hình thức tiết kiệm đơn giản, hình thành thói quen tốt cho học sinh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nên gửi tiết kiệm ngân hàng thay vì giữ tiền mặt ở nhà?", "options": ["A. Vì an toàn hơn và được hưởng lãi.", "B. Vì ngân hàng giữ hộ miễn phí mãi mãi.", "C. Vì tiền mặt không có giá trị.", "D. Không có lí do gì."], "answer": "A", "explain": "Gửi ngân hàng an toàn hơn (tránh mất cắp, cháy nổ) và được hưởng lãi suất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn Hoa bỏ heo 200 nghìn đồng mỗi tháng. Sau một năm, số tiền tiết kiệm là", "options": ["A. 2,4 triệu đồng.", "B. 200 nghìn đồng.", "C. 12 triệu đồng.", "D. 24 triệu đồng."], "answer": "A", "explain": "200 nghìn × 12 = 2 400 nghìn đồng = 2,4 triệu đồng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sức mạnh của tiết kiệm đều đặn thể hiện ở việc", "options": ["A. số tiền nhỏ tích lũy thành lớn theo thời gian.", "B. tiết kiệm làm nghèo đi.", "C. không cần tiết kiệm.", "D. tiền tự biến mất."], "answer": "A", "explain": "Tiết kiệm đều đặn, dù nhỏ, tích lũy theo thời gian thành số tiền lớn — sức mạnh của thói quen.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tiết kiệm là dành một phần thu nhập không chi tiêu.", "b) Bỏ heo đất là hình thức tiết kiệm.", "c) Gửi ngân hàng an toàn và có lãi.", "d) Không cần tiết kiệm khi còn trẻ."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: càng trẻ càng nên tập thói quen tiết kiệm.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tiết kiệm đều đặn tích thành số tiền lớn.", "b) Tiền tiết kiệm giúp thực hiện mục tiêu.", "c) Tiết kiệm giúp dự phòng rủi ro.", "d) Tiêu hết tiền là cách tiết kiệm tốt."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: tiêu hết thì không còn gì để tiết kiệm.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Bỏ ... đất là hình thức tiết kiệm đơn giản của học sinh».", "answer": "heo", "explain": "Bỏ heo đất là hình thức tiết kiệm đơn giản, phổ biến của học sinh.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Bỏ heo 200 nghìn mỗi tháng, sau một năm được bao nhiêu triệu đồng? Viết số (dạng thập phân).", "answer": "2.4", "explain": "200 nghìn × 12 = 2,4 triệu đồng.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Đầu tư trong tài chính cá nhân là", "options": ["A. dùng tiền để tạo ra thêm tiền trong tương lai.", "B. tiêu hết tiền.", "C. cất tiền trong két.", "D. cho tiền người khác."], "answer": "A", "explain": "Đầu tư là dùng tiền (mua cổ phiếu, gửi tiết kiệm dài hạn, học tập...) để tạo ra thêm tiền trong tương lai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "«Đầu tư cho bản thân» của học sinh là", "options": ["A. đầu tư vào học tập, sức khỏe, kĩ năng.", "B. mua đồ hiệu.", "C. chơi game.", "D. không cần đầu tư gì."], "answer": "A", "explain": "Với học sinh, đầu tư tốt nhất là vào học tập, sức khỏe, kĩ năng — «tài sản» sinh lời lâu dài nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tắc cơ bản khi đầu tư là", "options": ["A. lợi nhuận càng cao thì rủi ro càng lớn.", "B. lợi nhuận cao mà không có rủi ro.", "C. cứ đầu tư là giàu.", "D. không cần tìm hiểu."], "answer": "A", "explain": "Lợi nhuận và rủi ro đi đôi: hứa hẹn lãi càng cao thì rủi ro càng lớn — cần cảnh giác với «lãi khủng».", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi thấy quảng cáo «đầu tư lãi 50 phần trăm một tháng, không rủi ro», nên", "options": ["A. cảnh giác vì đó có thể là lừa đảo.", "B. đầu tư ngay toàn bộ tiền.", "C. vay tiền để đầu tư.", "D. rủ bạn bè cùng đầu tư."], "answer": "A", "explain": "«Lãi khủng, không rủi ro» là dấu hiệu lừa đảo — không có đầu tư nào như vậy.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bạn Nam dùng tiền tiết kiệm mua sách, học thêm ngoại ngữ. Đây là", "options": ["A. đầu tư cho bản thân, sinh lời lâu dài.", "B. lãng phí tiền.", "C. tiêu xài hoang phí.", "D. không phải đầu tư."], "answer": "A", "explain": "Đầu tư vào học tập, kĩ năng là khoản đầu tư sinh lời bền vững nhất cho tương lai.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một người chia tiền tiết kiệm thành 3 phần: gửi ngân hàng, mua vàng, đầu tư học nghề. Cách làm này", "options": ["A. phân tán rủi ro, hợp lí.", "B. quá phức tạp.", "C. làm mất tiền.", "D. không cần thiết."], "answer": "A", "explain": "«Không bỏ hết trứng vào một giỏ» — phân tán giúp giảm rủi ro.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đầu tư là dùng tiền để tạo ra thêm tiền.", "b) Học tập là đầu tư cho bản thân.", "c) Lãi càng cao thì rủi ro càng lớn.", "d) «Lãi khủng, không rủi ro» là thật."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: đó là dấu hiệu lừa đảo.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nên cảnh giác với quảng cáo lãi khủng.", "b) Phân tán giúp giảm rủi ro đầu tư.", "c) Đầu tư cần tìm hiểu kĩ.", "d) Vay nợ để đầu tư lãi khủng là khôn ngoan."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: rất rủi ro, dễ mất trắng.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: «Lợi nhuận càng cao thì ... càng lớn».", "answer": "rủi ro", "explain": "Lợi nhuận và rủi ro đi đôi với nhau.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguyên tắc «không bỏ hết trứng vào một giỏ» trong đầu tư có nghĩa là phân tán ... Điền từ còn thiếu.", "answer": "rủi ro", "explain": "Phân tán đầu tư giúp giảm rủi ro.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Chi tiêu hợp lí có nghĩa là", "options": ["A. chi đúng mục đích, đúng mức cần thiết, tránh lãng phí.", "B. chi càng nhiều càng tốt.", "C. không chi gì cả.", "D. chi theo cảm xúc."], "answer": "A", "explain": "Chi tiêu hợp lí: đúng mục đích, đúng mức cần thiết, tránh lãng phí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lãng phí trong chi tiêu là", "options": ["A. chi cho những thứ không cần thiết, vượt mức cần thiết.", "B. chi cho ăn uống.", "C. chi cho học tập.", "D. tiết kiệm."], "answer": "A", "explain": "Lãng phí là chi cho thứ không cần thiết hoặc vượt mức cần thiết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mua 10 bộ quần áo giống nhau trong khi chỉ mặc 2 bộ là", "options": ["A. lãng phí.", "B. hợp lí.", "C. tiết kiệm.", "D. đầu tư."], "answer": "A", "explain": "Mua vượt mức cần thiết là lãng phí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để chi tiêu hợp lí, trước khi mua nên", "options": ["A. tự hỏi «mình có thật sự cần không».", "B. mua ngay không cần nghĩ.", "C. mua càng nhiều càng tốt.", "D. vay tiền để mua."], "answer": "A", "explain": "Tự hỏi về nhu cầu thật sự giúp tránh mua sắm lãng phí, bốc đồng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Gia đình bạn An lên danh sách đi chợ, mua đúng danh sách, so sánh giá. Đây là", "options": ["A. chi tiêu hợp lí, có kế hoạch.", "B. keo kiệt.", "C. lãng phí.", "D. không cần thiết."], "answer": "A", "explain": "Lên danh sách, mua đúng nhu cầu, so sánh giá là chi tiêu hợp lí — khác với keo kiệt.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phân biệt «tiết kiệm» và «keo kiệt»: tiết kiệm là", "options": ["A. chi hợp lí, đúng mức cần thiết; keo kiệt là không dám chi cả khi cần thiết.", "B. giống hệt nhau.", "C. keo kiệt tốt hơn.", "D. tiết kiệm là xấu."], "answer": "A", "explain": "Tiết kiệm là chi hợp lí; keo kiệt là tằn tiện quá mức, không dám chi cả khi cần — khác nhau.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chi tiêu hợp lí là chi đúng mục đích, tránh lãng phí.", "b) Mua vượt nhu cầu là lãng phí.", "c) Nên tự hỏi nhu cầu trước khi mua.", "d) Chi càng nhiều càng hợp lí."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: chi vượt mức cần thiết là lãng phí.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lên danh sách đi chợ giúp chi tiêu hợp lí.", "b) Tiết kiệm khác với keo kiệt.", "c) So sánh giá giúp chi tiêu hợp lí.", "d) Mua sắm bốc đồng là hợp lí."], "answer": ["T", "T", "T", "F"], "explain": "a, b, c đúng. d sai: mua sắm bốc đồng dễ lãng phí.", "points": 1}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: «Chi tiêu ... là chi đúng mục đích, đúng mức cần thiết».", "answer": "hợp lí", "explain": "Chi tiêu hợp lí: đúng mục đích, đúng mức cần thiết, tránh lãng phí.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tiết kiệm là chi hợp lí; không dám chi cả khi cần thiết là ... Điền từ còn thiếu.", "answer": "keo kiệt", "explain": "Keo kiệt là tằn tiện quá mức, khác với tiết kiệm hợp lí.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Học sinh lập kế hoạch tài chính cá nhân từ bây giờ giúp", "options": ["A. hình thành thói quen quản lí tiền bạc tốt cho tương lai.", "B. giàu ngay lập tức.", "C. không cần học.", "D. tiêu nhiều hơn."], "answer": "A", "explain": "Tập lập kế hoạch từ sớm hình thành thói quen quản lí tài chính tốt cho cả đời.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguồn thu nhập của học sinh thường là", "options": ["A. tiền bố mẹ cho, tiền mừng tuổi, làm thêm.", "B. lương hưu.", "C. lợi nhuận doanh nghiệp.", "D. thuế."], "answer": "A", "explain": "Học sinh có thu nhập từ tiền bố mẹ cho, mừng tuổi, làm thêm phù hợp.", "points": 0.25}, {"type": "mcq", "level":
