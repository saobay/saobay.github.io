<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Vì sao cần bảo quản, chế biến sản phẩm chăn nuôi?","options":["A. Vì thịt, trứng, sữa giàu dinh dưỡng nhưng rất dễ hư hỏng do vi sinh vật.","B. Vì sản phẩm để lâu càng ngon.","C. Vì không ai mua sản phẩm tươi.","D. Vì chế biến làm sản phẩm rẻ đi."],"answer":"A","explain":"Thịt, trứng, sữa là môi trường tốt cho vi sinh vật phát triển nên nhanh ôi thiu. Bảo quản, chế biến kéo dài thời gian sử dụng, nâng giá trị sản phẩm.","points":0.25},{"type":"mcq","level":"NB","q":"Mục đích nào sau đây KHÔNG phải của chế biến sản phẩm chăn nuôi?","options":["A. Kéo dài thời gian bảo quản.","B. Nâng cao giá trị sản phẩm.","C. Làm sản phẩm nhanh hỏng hơn.","D. Mở rộng thị trường tiêu thụ."],"answer":"C","explain":"Chế biến nhằm bảo quản LÂU hơn, giá trị CAO hơn, thị trường RỘNG hơn — không phải làm nhanh hỏng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao chế biến giúp “điều hòa cung cầu” sản phẩm chăn nuôi?","options":["A. Vì chế biến làm tăng sản lượng.","B. Vì chế biến vào mùa dư thừa để dự trữ dùng dần mùa khan hiếm, giúp ổn định giá cả.","C. Vì chế biến làm giảm nhu cầu.","D. Vì không ai mua vào mùa dư thừa."],"answer":"B","explain":"Mùa thuận lợi sản phẩm dồi dào, giá rẻ; chế biến (đồ hộp, sấy khô…) dự trữ để bán mùa khan hiếm giá cao — vừa tránh lãng phí vừa ổn định thu nhập.","points":0.25},{"type":"mcq","level":"TH","q":"So sánh giá trị giữa thịt lợn tươi và xúc xích làm từ thịt lợn, nhận định nào đúng?","options":["A. Như nhau.","B. Xúc xích có giá trị gia tăng cao hơn nhờ công chế biến, bảo quản lâu, tiện sử dụng.","C. Thịt tươi luôn đắt hơn.","D. Xúc xích không có giá trị."],"answer":"B","explain":"Chế biến sâu tạo giá trị gia tăng: cùng 1 kg thịt, làm xúc xích bán được giá cao hơn, bảo quản lâu hơn, vận chuyển xa hơn — đó là ý nghĩa kinh tế của chế biến.","points":0.25},{"type":"mcq","level":"VD","q":"Vào dịp Tết, giá thịt lợn tăng cao, nhiều hộ “để dành” lợn đến Tết mới bán. Về mặt chế biến, giải pháp nào bền vững hơn?","options":["A. Cứ để lợn sống đến Tết, không cần chế biến.","B. Giết thịt, chế biến thành giò chả, thịt hun khói, đồ hộp dự trữ từ trước Tết để bán dần, tránh rủi ro dịch bệnh và giá cả.","C. Bán hết lợn từ sớm với giá rẻ.","D. Không nuôi lợn nữa."],"answer":"B","explain":"Giữ lợn sống đến Tết rủi ro dịch bệnh, tốn thức ăn. Chế biến dự trữ từ trước: chủ động nguồn hàng Tết, giá tốt, ít rủi ro — là tư duy chế biến điều hòa cung cầu.","points":0.25},{"type":"mcq","level":"VDC","q":"Một hợp tác xã chăn nuôi chỉ bán sản phẩm tươi sống, thường xuyên bị ép giá vào mùa dư thừa. Chiến lược nào giúp họ thoát khỏi tình trạng này?","options":["A. Giảm sản lượng.","B. Đầu tư chế biến sâu (đồ hộp, hun khói, sấy khô) để dự trữ, nâng giá trị và chủ động thị trường thay vì phụ thuộc thương lái.","C. Bán rẻ hơn nữa.","D. Ngừng chăn nuôi."],"answer":"B","explain":"Bán tươi sống = phụ thuộc hoàn toàn vào thị trường thời điểm. Chế biến sâu tạo ra sản phẩm để được lâu, giá trị cao, bán được quanh năm — giúp hợp tác xã chủ động, không bị ép giá.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thịt, trứng, sữa dễ hư hỏng do vi sinh vật.","b) Chế biến giúp kéo dài thời gian bảo quản sản phẩm.","c) Chế biến giúp nâng cao giá trị sản phẩm.","d) Sản phẩm tươi sống bảo quản được rất lâu."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: sản phẩm tươi nhanh ôi thiu.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chế biến giúp điều hòa cung cầu, ổn định giá cả.","b) Sản phẩm chế biến có giá trị gia tăng cao hơn sản phẩm tươi.","c) Chế biến giúp mở rộng thị trường tiêu thụ.","d) Bán tươi sống giúp người chăn nuôi chủ động về giá."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: bán tươi phụ thuộc thị trường thời điểm, dễ bị ép giá.","points":1},{"type":"short","level":"VD","q":"Nêu 2 mục đích của việc chế biến sản phẩm chăn nuôi.","answer":"kéo dài thời gian bảo quản, nâng cao giá trị sản phẩm","explain":"Mục đích chế biến: kéo dài bảo quản, nâng giá trị, mở rộng thị trường, điều hòa cung cầu, đảm bảo an toàn thực phẩm.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao hợp tác xã chỉ bán sản phẩm tươi sống thường bị ép giá?","answer":"vì phụ thuộc hoàn toàn vào thị trường thời điểm và sản phẩm nhanh hỏng","explain":"Sản phẩm tươi nhanh hỏng, không để lâu được nên người bán bị động, phải bán ngay dù giá thấp. Chế biến dự trữ được giúp chủ động chọn thời điểm bán giá tốt.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Bảo quản lạnh thịt ở 0–4 độ C có tác dụng gì?","options":["A. Ức chế vi sinh vật phát triển, giữ thịt tươi trong vài ngày.","B. Làm thịt chín.","C. Diệt hoàn toàn vi khuẩn.","D. Làm thịt tăng trọng lượng."],"answer":"A","explain":"Nhiệt độ thấp (0–4 độ C) làm vi sinh vật ngừng hoặc chậm phát triển, giữ thịt tươi vài ngày. Đông lạnh (-18 độ C) giữ được nhiều tháng.","points":0.25},{"type":"mcq","level":"NB","q":"Ướp muối để bảo quản thực phẩm dựa trên nguyên lí nào?","options":["A. Muối rút nước, ức chế vi khuẩn phát triển.","B. Muối làm thực phẩm ngọt hơn.","C. Muối diệt mọi vi khuẩn ngay lập tức.","D. Muối không có tác dụng bảo quản."],"answer":"A","explain":"Muối nồng độ cao rút nước khỏi thực phẩm và tế bào vi khuẩn, ức chế chúng phát triển — nguyên lí của thịt muối, trứng muối, cá muối.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao thịt hộp để được 1–2 năm ở nhiệt độ thường?","options":["A. Vì hộp đẹp.","B. Vì đã tiệt trùng ở nhiệt độ cao diệt hết vi sinh vật rồi đóng kín, không cho vi khuẩn xâm nhập trở lại.","C. Vì có chất bảo quản độc hại.","D. Vì thịt hộp không có dinh dưỡng."],"answer":"B","explain":"Đồ hộp được tiệt trùng (đun nóng cao áp) diệt sạch vi sinh vật và đóng kín vô trùng — không còn mầm gây hỏng nên để lâu ở nhiệt độ thường.","points":0.25},{"type":"mcq","level":"TH","q":"Hun khói vừa bảo quản vừa tạo đặc tính gì cho sản phẩm?","options":["A. Mùi thơm đặc trưng và màu sắc hấp dẫn, đồng thời khói có chất kháng khuẩn.","B. Làm sản phẩm sống lại.","C. Không có tác dụng gì thêm.","D. Làm sản phẩm nhanh hỏng."],"answer":"A","explain":"Khói chứa phenol, andehit có tính kháng khuẩn; đồng thời tạo mùi thơm, màu vàng nâu đặc trưng cho thịt hun khói, lạp xưởng.","points":0.25},{"type":"mcq","level":"VD","q":"Gia đình em có nhiều trứng gà, muốn để dành ăn dần 2–3 tháng. Cách nào phù hợp?","options":["A. Để trứng ở nhiệt độ thường.","B. Làm trứng muối: ngâm nước muối 3–4 tuần rồi bảo quản nơi thoáng mát.","C. Luộc chín để ngoài.","D. Đập trứng ra bát để tủ lạnh."],"answer":"B","explain":"Trứng tươi chỉ để được 2–3 tuần. Trứng muối bảo quản được 2–3 tháng, cách làm đơn giản tại nhà, phù hợp nông hộ.","points":0.25},{"type":"mcq","level":"VDC","q":"Một cơ sở sản xuất thịt hun khói muốn mở rộng ra thị trường cả nước. Yếu tố kỹ thuật then chốt là gì?","options":["A. Chỉ cần quảng cáo nhiều.","B. Đảm bảo quy trình hun khói chuẩn, đóng gói hút chân không, chuỗi lạnh (nếu cần) và hạn sử dụng rõ ràng để sản phẩm đến tay người tiêu dùng vẫn an toàn.","C. Giảm giá thật rẻ.","D. Không cần quan tâm bảo quản."],"answer":"B","explain":"Mở rộng thị trường xa đòi hỏi sản phẩm chịu được vận chuyển, bảo quản lâu: quy trình chuẩn, đóng gói tốt, chuỗi bảo quản liên tục và nhãn mác đầy đủ — là nền tảng kĩ thuật của mở rộng thị trường.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bảo quản lạnh ức chế vi sinh vật phát triển.","b) Muối rút nước, ức chế vi khuẩn nên dùng để bảo quản.","c) Thịt hộp tiệt trùng để được lâu ở nhiệt độ thường.","d) Hun khói tạo mùi thơm đặc trưng cho sản phẩm."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trứng muối bảo quản được lâu hơn trứng tươi.","b) Đồ hộp cần tiệt trùng và đóng kín vô trùng.","c) Mở rộng thị trường cần đảm bảo bảo quản sản phẩm khi vận chuyển xa.","d) Thực phẩm ướp muối không bao giờ hỏng."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: ướp muối chỉ kéo dài thời gian, vẫn có hạn sử dụng.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 phương pháp bảo quản sản phẩm chăn nuôi.","answer":"bảo quản lạnh, ướp muối","explain":"Các phương pháp bảo quản: lạnh (làm lạnh, đông lạnh), ướp muối, hun khói, sấy khô, đóng hộp.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao đồ hộp phải tiệt trùng rồi mới đóng kín?","answer":"để diệt hết vi sinh vật và ngăn chúng xâm nhập trở lại","explain":"Tiệt trùng ở nhiệt độ cao diệt sạch vi sinh vật trong thực phẩm; đóng kín vô trùng ngăn vi khuẩn từ ngoài xâm nhập — nhờ đó đồ hộp để lâu ở nhiệt độ thường mà không hỏng.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Các công đoạn chính chế biến xúc xích là gì?","options":["A. Chọn thịt – xay, phối trộn – nhồi vỏ – hấp/hun khói – đóng gói.","B. Nuôi lợn – bán thịt.","C. Mua xúc xích về ăn.","D. Đóng gói rồi mới chọn thịt."],"answer":"A","explain":"Quy trình xúc xích: chọn thịt tươi, sơ chế → xay nhuyễn, phối trộn gia vị → nhồi vào vỏ → hấp chín/hun khói → làm nguội, đóng gói, bảo quản lạnh.","points":0.25},{"type":"mcq","level":"NB","q":"Sữa chua được làm bằng phương pháp nào?","options":["A. Lên men sữa bằng vi khuẩn lactic.","B. Đun sôi sữa.","C. Pha sữa với nước.","D. Để sữa ngoài nắng."],"answer":"A","explain":"Sữa chua: thanh trùng sữa rồi cấy vi khuẩn lactic, ủ ấm để lên men tạo vị chua dịu, tốt cho tiêu hóa.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao sữa tươi vắt ra phải được làm lạnh hoặc chế biến ngay?","options":["A. Vì sữa nhanh nguội.","B. Vì sữa giàu dinh dưỡng, vi khuẩn phát triển rất nhanh ở nhiệt độ thường, dễ gây ôi thiu và ngộ độc.","C. Vì sữa để lâu ngon hơn.","D. Không cần thiết."],"answer":"B","explain":"Sữa tươi là môi trường lí tưởng cho vi khuẩn. Để ở nhiệt độ thường vài giờ là chua, hỏng. Phải làm lạnh ngay hoặc đưa vào chế biến (tiệt trùng, làm sữa chua…) kịp thời.","points":0.25},{"type":"mcq","level":"TH","q":"Sữa bột có ưu điểm gì so với sữa tươi?","options":["A. Nhẹ, bảo quản rất lâu, tiện vận chuyển đi xa.","B. Ngon hơn sữa tươi.","C. Rẻ hơn nước lã.","D. Không cần pha khi dùng."],"answer":"A","explain":"Sấy khô thành bột loại bỏ nước (nguyên nhân chính gây hỏng), sữa bột nhẹ, để được lâu, vận chuyển xa dễ dàng — phù hợp xuất khẩu, dự trữ.","points":0.25},{"type":"mcq","level":"VD","q":"Trang trại bò sữa của ông Hòa mỗi ngày vắt 500 lít sữa nhưng xe thu mua đến muộn 6 giờ. Ông nên xử lí thế nào?","options":["A. Để sữa ngoài trời chờ xe.","B. Làm lạnh sữa ngay xuống 4 độ C trong bồn lạnh để giữ chất lượng chờ xe đến.","C. Đổ sữa đi.","D. Pha thêm nước cho nhiều."],"answer":"B","explain":"Sữa phải được làm lạnh ngay sau vắt (4 độ C) để ức chế vi khuẩn. Để ngoài trời 6 giờ sữa sẽ chua, hỏng, bị từ chối thu mua — bồn lạnh là thiết bị bắt buộc của trại bò sữa.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty sữa muốn đảm bảo chất lượng từ trang trại đến nhà máy. Biện pháp then chốt là gì?","options":["A. Chỉ cần quảng cáo.","B. Chuỗi lạnh liên tục: bồn lạnh tại trại, xe bồn lạnh vận chuyển, kiểm tra chất lượng tại cổng nhà máy — không để sữa bị “ngắt lạnh”.","C. Thu mua sữa không cần kiểm tra.","D. Để sữa ở nhiệt độ thường cho tiện."],"answer":"B","explain":"Chất lượng sữa quyết định ở chuỗi lạnh: chỉ cần một khâu bị ngắt lạnh, vi khuẩn bùng phát, cả bồn sữa hỏng. Kiểm soát chuỗi lạnh + kiểm tra đầu vào là then chốt.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Quy trình xúc xích gồm: chọn thịt, xay trộn, nhồi vỏ, hấp, đóng gói.","b) Sữa chua được làm bằng lên men lactic.","c) Sữa tươi cần làm lạnh ngay sau khi vắt.","d) Sữa bột bảo quản được lâu và tiện vận chuyển."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sữa để ở nhiệt độ thường nhanh bị chua, hỏng.","b) Bồn lạnh là thiết bị cần thiết của trại bò sữa.","c) Chuỗi lạnh không được ngắt quãng từ trại đến nhà máy.","d) Sữa hỏng vẫn thu mua được bình thường."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: sữa kém chất lượng bị từ chối thu mua.","points":1},{"type":"short","level":"VD","q":"Sữa sau khi vắt cần được bảo quản ở nhiệt độ bao nhiêu?","answer":"4 độ C","explain":"Sữa tươi sau vắt phải làm lạnh ngay xuống khoảng 4 độ C (0–4 độ C) để ức chế vi khuẩn, giữ chất lượng chờ thu mua, chế biến.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao chuỗi lạnh trong thu mua sữa không được ngắt quãng?","answer":"vì chỉ cần một khâu bị ấm lên vi khuẩn sẽ bùng phát làm hỏng cả bồn sữa","explain":"Vi khuẩn trong sữa phát triển rất nhanh khi nhiệt độ tăng. Ngắt lạnh ở bất kì khâu nào (trại, xe, nhà máy) cũng làm sữa chua, hỏng — cả bồn sữa phải đổ bỏ, thiệt hại lớn.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Trứng bắc thảo được chế biến bằng cách nào?","options":["A. Ủ trứng trong hỗn hợp tro, trấu, vôi.","B. Luộc trứng.","C. Chiên trứng.","D. Để trứng ngoài nắng."],"answer":"A","explain":"Trứng bắc thảo (trứng vịt) được ủ trong hỗn hợp tro, trấu, vôi, muối vài tuần — lòng trắng nâu trong, lòng đỏ dẻo, vị đặc trưng.","points":0.25},{"type":"mcq","level":"NB","q":"Phô mai được làm từ nguyên liệu nào?","options":["A. Sữa.","B. Thịt.","C. Trứng.","D. Rau."],"answer":"A","explain":"Phô mai làm từ sữa: đông tụ protein sữa (casein) rồi ép, ủ chín thành khối phô mai giàu dinh dưỡng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các làng nghề làm giò chả, xúc xích thường tập trung ở vùng chăn nuôi?","options":["A. Vì ở đó đất rẻ.","B. Vì gần nguồn nguyên liệu thịt tươi, giảm chi phí vận chuyển, bảo quản và đảm bảo độ tươi ngon.","C. Vì ở đó không ai kiểm tra.","D. Vì ngẫu nhiên."],"answer":"B","explain":"Chế biến thịt cần nguyên liệu tươi. Gần vùng chăn nuôi giúp lấy thịt tươi nhanh, rẻ, đảm bảo chất lượng — lợi thế của làng nghề gắn với vùng nguyên liệu.","points":0.25},{"type":"mcq","level":"TH","q":"Sấy khô để bảo quản thực phẩm dựa trên nguyên lí nào?","options":["A. Loại bỏ nước khiến vi sinh vật khó phát triển.","B. Làm thực phẩm chín.","C. Thêm chất bảo quản.","D. Không có nguyên lí gì."],"answer":"A","explain":"Vi sinh vật cần nước để sống. Sấy khô loại bỏ phần lớn nước tự do trong thực phẩm → vi khuẩn, nấm không phát triển được → bảo quản lâu (thịt khô, cá khô).","points":0.25},{"type":"mcq","level":"VD","q":"Làng nghề của em nổi tiếng với lạp xưởng, thịt hun khói. Để nâng tầm sản phẩm bán vào siêu thị, cần làm gì?","options":["A. Giữ nguyên cách làm, không cần thay đổi.","B. Chuẩn hóa quy trình, đảm bảo vệ sinh an toàn thực phẩm, đóng gói, nhãn mác, hạn sử dụng đầy đủ.","C. Giảm giá thật rẻ.","D. Bán không nhãn mác."],"answer":"B","explain":"Vào siêu thị phải đáp ứng: VSATTP, đóng gói, nhãn mác, hạn sử dụng, truy xuất nguồn gốc. Chuẩn hóa quy trình là bước bắt buộc để làng nghề vươn ra thị trường hiện đại.","points":0.25},{"type":"mcq","level":"VDC","q":"Một cơ sở chế biến giò chả bị phát hiện dùng hàn the (chất cấm) để giò giòn, dai. Hậu quả và bài học nào đúng?","options":["A. Không sao, giò ngon là được.","B. Hàn the gây hại sức khỏe người tiêu dùng; cơ sở bị xử phạt, mất uy tín, có thể phá sản — bài học: tuyệt đối không dùng phụ gia ngoài danh mục cho phép.","C. Nên dùng nhiều hơn.","D. Chỉ bị phạt nhẹ, không sao."],"answer":"B","explain":"Hàn the (borax) tích lũy gây hại thận, thần kinh. Dùng chất cấm là vi phạm pháp luật, bị xử phạt nặng, mất niềm tin người tiêu dùng — có thể đánh sập cả thương hiệu.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trứng bắc thảo được ủ trong hỗn hợp tro, trấu, vôi.","b) Phô mai được làm từ sữa.","c) Sấy khô loại bỏ nước giúp bảo quản thực phẩm lâu.","d) Làng nghề chế biến nên gần vùng nguyên liệu."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vào siêu thị, sản phẩm cần đảm bảo VSATTP và nhãn mác đầy đủ.","b) Dùng phụ gia ngoài danh mục cho phép là vi phạm pháp luật.","c) Hàn the gây hại sức khỏe người tiêu dùng.","d) Chất lượng sản phẩm không ảnh hưởng đến uy tín thương hiệu."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: một vụ vi phạm có thể phá sản thương hiệu.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 sản phẩm chế biến từ thịt lợn.","answer":"xúc xích, giò chả","explain":"Các sản phẩm chế biến từ thịt lợn: xúc xích, giò chả, thịt hộp, thịt hun khói, lạp xưởng, thịt khô…","points":0.5},{"type":"short","level":"VDC","q":"Vì sao cơ sở chế biến tuyệt đối không được dùng phụ gia ngoài danh mục cho phép?","answer":"vì gây hại sức khỏe người tiêu dùng và bị xử phạt mất uy tín","explain":"Phụ gia cấm (hàn the…) gây hại sức khỏe; bị phát hiện sẽ xử phạt nặng, mất niềm tin người tiêu dùng, có thể phá sản thương hiệu — cái giá quá đắt.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Vệ sinh an toàn thực phẩm trong chế biến yêu cầu gì về nguyên liệu?","options":["A. Vật nuôi khỏe mạnh, không tồn dư kháng sinh, hóa chất.","B. Nguyên liệu càng rẻ càng tốt.","C. Không cần quan tâm nguồn gốc.","D. Dùng nguyên liệu ôi thiu cũng được."],"answer":"A","explain":"Nguyên liệu sạch là điều kiện tiên quyết: vật nuôi khỏe, không tồn dư kháng sinh, hóa chất — vì chất độc từ nguyên liệu không thể loại bỏ hoàn toàn khi chế biến.","points":0.25},{"type":"mcq","level":"NB","q":"Người trực tiếp chế biến thực phẩm cần đảm bảo gì?","options":["A. Vệ sinh cá nhân: khám sức khỏe định kì, rửa tay, đeo găng, khẩu trang.","B. Không cần vệ sinh gì.","C. Mặc quần áo bẩn cũng được.","D. Ốm vẫn đi làm bình thường."],"answer":"A","explain":"Người chế biến là nguồn lây nhiễm trực tiếp. Phải khám sức khỏe định kì, không mắc bệnh truyền nhiễm, vệ sinh tay, trang phục bảo hộ đầy đủ.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao “chuỗi lạnh không ngắt quãng” quan trọng với thực phẩm tươi sống?","options":["A. Vì lạnh làm thực phẩm ngon hơn.","B. Vì chỉ cần một khâu bị ấm lên, vi khuẩn bùng phát, thực phẩm hỏng — cả chuỗi mất tác dụng.","C. Vì lạnh làm tăng trọng lượng.","D. Không quan trọng."],"answer":"B","explain":"Chuỗi lạnh là hệ thống liên tục từ sản xuất đến tiêu dùng. Ngắt quãng ở khâu nào (vận chuyển, kho, cửa hàng) thì vi khuẩn phát triển, thực phẩm hỏng dù các khâu khác tốt.","points":0.25},{"type":"mcq","level":"TH","q":"Nhãn mác sản phẩm chế biến cần ghi những gì?","options":["A. Tên sản phẩm, thành phần, hạn sử dụng, hướng dẫn bảo quản, cơ sở sản xuất.","B. Chỉ cần tên sản phẩm.","C. Không cần ghi gì.","D. Ghi giá thật cao."],"answer":"A","explain":"Nhãn mác đầy đủ giúp người tiêu dùng biết thành phần (dị ứng), hạn sử dụng, cách bảo quản và truy xuất cơ sở sản xuất khi có sự cố — là yêu cầu pháp lí bắt buộc.","points":0.25},{"type":"mcq","level":"VD","q":"Em mua một gói xúc xích không nhãn mác, không hạn sử dụng ở cổng trường. Em nên làm gì?","options":["A. Mua ăn vì rẻ.","B. Không mua; báo thầy cô, vì sản phẩm không rõ nguồn gốc, không đảm bảo an toàn thực phẩm.","C. Mua cho bạn ăn thử.","D. Mua về để dành."],"answer":"B","explain":"Thực phẩm không nhãn mác, không hạn sử dụng, bán ở cổng trường có nguy cơ mất an toàn cao (nguyên liệu bẩn, phụ gia cấm). Học sinh cần tránh và báo người lớn.","points":0.25},{"type":"mcq","level":"VDC","q":"Một vụ ngộ độc thực phẩm do pate chay nhiễm khuẩn tại một cơ sở. Bài học cho các cơ sở chế biến là gì?","options":["A. Ngộ độc là chuyện bình thường.","B. Phải kiểm soát nghiêm ngặt từ nguyên liệu, quy trình tiệt trùng đến bảo quản; một sai sót có thể gây hậu quả nghiêm trọng về sức khỏe cộng đồng và pháp lí.","C. Nên giấu nhẹm khi có sự cố.","D. Không cần quan tâm."],"answer":"B","explain":"Ngộ độc thực phẩm (nhất là botulinum trong đồ hộp) có thể gây chết người. Cơ sở phải kiểm soát chặt mọi khâu; khi sự cố phải công khai, thu hồi — giấu giếm làm hậu quả nặng nề hơn và bị xử lí hình sự.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nguyên liệu chế biến phải sạch, không tồn dư kháng sinh.","b) Người chế biến cần đảm bảo vệ sinh cá nhân.","c) Chuỗi lạnh không được ngắt quãng.","d) Nhãn mác cần ghi hạn sử dụng và cơ sở sản xuất."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Học sinh không nên mua thực phẩm không nhãn mác ở cổng trường.","b) Khi có sự cố ngộ độc, cơ sở phải công khai và thu hồi sản phẩm.","c) Giấu sự cố ngộ độc làm hậu quả nghiêm trọng hơn.","d) An toàn thực phẩm không quan trọng với cơ sở chế biến."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: VSATTP là sống còn của cơ sở chế biến.","points":1},{"type":"short","level":"VD","q":"Nêu 2 yêu cầu về vệ sinh an toàn thực phẩm trong chế biến.","answer":"nguyên liệu sạch, quy trình đảm bảo vệ sinh","explain":"Yêu cầu VSATTP: nguyên liệu sạch (không tồn dư); quy trình, dụng cụ, nhà xưởng vệ sinh; người chế biến đảm bảo vệ sinh cá nhân; bảo quản đúng; không dùng phụ gia cấm.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao khi xảy ra ngộ độc thực phẩm, cơ sở chế biến phải công khai và thu hồi sản phẩm?","answer":"để ngăn thêm người bị ngộ độc và thể hiện trách nhiệm","explain":"Công khai, thu hồi kịp thời ngăn thêm nạn nhân, thể hiện trách nhiệm; giấu giếm làm hậu quả lan rộng, khi bị phát hiện sẽ chịu trách nhiệm hình sự nặng hơn và mất hoàn toàn uy tín.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Bơ được chế biến từ nguyên liệu nào?","options":["A. Kem sữa.","B. Thịt.","C. Trứng.","D. Mật ong."],"answer":"A","explain":"Bơ làm từ kem sữa (phần béo của sữa) qua quá trình đánh tách — là sản phẩm sữa giàu năng lượng.","points":0.25},{"type":"mcq","level":"NB","q":"Giò chả là sản phẩm chế biến từ gì?","options":["A. Thịt xay nhuyễn gói lá chuối, hấp chín.","B. Sữa lên men.","C. Trứng muối.","D. Rau củ."],"answer":"A","explain":"Giò chả (giò lụa): thịt lợn xay nhuyễn (quết), gói lá chuối, hấp chín — món ăn truyền thống phổ biến của Việt Nam.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao giò chả truyền thống gói lá chuối được ưa chuộng?","options":["A. Vì lá chuối rẻ.","B. Vì lá chuối tạo mùi thơm đặc trưng, an toàn, thân thiện môi trường; giò giữ được vị ngọt tự nhiên của thịt.","C. Vì không có bao bì khác.","D. Vì lá chuối làm giò chín nhanh."],"answer":"B","explain":"Lá chuối vừa là bao bì tự nhiên an toàn, vừa tạo mùi thơm đặc trưng khi hấp; đồng thời thân thiện môi trường hơn nilon — giá trị truyền thống được ưa chuộng.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm chung của các sản phẩm: sữa chua, phô mai, trứng muối là gì?","options":["A. Đều dùng vi sinh vật hoặc muối để biến đổi, bảo quản nguyên liệu tươi thành sản phẩm mới có giá trị.","B. Đều làm từ thịt.","C. Đều ăn sống.","D. Đều không cần bảo quản."],"answer":"A","explain":"Sữa chua, phô mai dùng vi sinh vật lên men/đông tụ; trứng muối dùng muối — đều là công nghệ biến đổi sinh hóa để bảo quản và tạo sản phẩm mới giá trị cao hơn.","points":0.25},{"type":"mcq","level":"VD","q":"Hộ bà Hai có nghề làm sữa chua thủ công, muốn mở rộng bán cho cửa hàng. Cần đầu tư gì?","options":["A. Chỉ cần làm nhiều hơn.","B. Chuẩn hóa công thức, đảm bảo vệ sinh, đóng hũ, nhãn mác, bảo quản lạnh và giao hàng đúng hẹn.","C. Giảm chất lượng để rẻ hơn.","D. Không cần thay đổi gì."],"answer":"B","explain":"Từ thủ công lên hàng hóa: phải chuẩn hóa chất lượng ổn định, đảm bảo vệ sinh, đóng gói, nhãn mác, giữ lạnh và uy tín giao hàng — mới vào được cửa hàng.","points":0.25},{"type":"mcq","level":"VDC","q":"So sánh hai mô hình: bán sữa tươi tại trại và chế biến thành sữa chua, phô mai để bán. Mô hình nào bền vững hơn và vì sao?","options":["A. Bán sữa tươi bền vững hơn.","B. Chế biến bền vững hơn: đa dạng sản phẩm, giá trị cao, bảo quản lâu, ít phụ thuộc vào thương lái thu mua sữa tươi hằng ngày.","C. Hai mô hình như nhau.","D. Không nên chăn nuôi bò sữa."],"answer":"B","explain":"Bán sữa tươi phụ thuộc hoàn toàn vào xe thu mua hằng ngày, giá bấp bênh. Chế biến tạo nhiều sản phẩm giá trị cao, để lâu, chủ động thị trường — bền vững và lợi nhuận cao hơn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bơ được chế biến từ kem sữa.","b) Giò chả làm từ thịt xay nhuyễn gói lá chuối hấp chín.","c) Lá chuối tạo mùi thơm đặc trưng cho giò chả.","d) Sữa chua, phô mai đều từ công nghệ lên men, đông tụ sữa."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Từ thủ công lên hàng hóa cần chuẩn hóa chất lượng và vệ sinh.","b) Chế biến sữa thành nhiều sản phẩm giúp chủ động thị trường.","c) Bán sữa tươi phụ thuộc nhiều vào thương lái thu mua.","d) Sản phẩm thủ công không cần nhãn mác khi bán ở cửa hàng."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: bán ở cửa hàng cần nhãn mác, hạn sử dụng đầy đủ.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 sản phẩm chế biến từ sữa.","answer":"sữa chua, phô mai","explain":"Các sản phẩm từ sữa: sữa tiệt trùng, sữa chua, phô mai, sữa bột, bơ…","points":0.5},{"type":"short","level":"VDC","q":"Vì sao chế biến sữa thành nhiều sản phẩm bền vững hơn chỉ bán sữa tươi?","answer":"vì đa dạng sản phẩm giá trị cao và ít phụ thuộc thương lái","explain":"Chế biến tạo nhiều sản phẩm (sữa chua, phô mai…) giá trị cao, bảo quản lâu, bán quanh năm; giảm phụ thuộc vào xe thu mua sữa tươi hằng ngày với giá bấp bênh.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Thịt hun khói có đặc điểm nào?","options":["A. Mùi thơm đặc trưng, bảo quản được lâu nhờ khói có chất kháng khuẩn.","B. Ăn sống được ngay.","C. Không cần bảo quản.","D. Làm từ rau củ."],"answer":"A","explain":"Hun khói: khói chứa chất kháng khuẩn, đồng thời tạo mùi thơm, màu đẹp đặc trưng; sản phẩm để được lâu hơn thịt tươi nhiều.","points":0.25},{"type":"mcq","level":"NB","q":"Lạp xưởng là sản phẩm chế biến từ gì?","options":["A. Thịt (thường thịt lợn) nhồi vỏ, phơi/hun khô.","B. Sữa.","C. Trứng.","D. Cá khô."],"answer":"A","explain":"Lạp xưởng: thịt lợn (có thể thêm mỡ) xay, ướp gia vị, nhồi vào vỏ (ruột), phơi nắng hoặc hun khói cho khô — đặc sản nhiều vùng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các đặc sản vùng miền (lạp xưởng, thịt chua, nem…) có tiềm năng phát triển thành thương hiệu lớn?","options":["A. Vì ngon miệng.","B. Vì mang bản sắc văn hóa ẩm thực, được người tiêu dùng ưa chuộng; nếu chuẩn hóa chất lượng và xây dựng thương hiệu sẽ vươn xa.","C. Vì rẻ tiền.","D. Vì không cần quảng cáo."],"answer":"B","explain":"Đặc sản vùng miền có câu chuyện văn hóa, hương vị độc đáo — lợi thế cạnh tranh. Chuẩn hóa VSATTP, đóng gói, thương hiệu sẽ đưa đặc sản ra thị trường lớn, thậm chí xuất khẩu.","points":0.25},{"type":"mcq","level":"TH","q":"Thịt chua (Phú Thọ) lên men nhờ vi sinh vật nào?","options":["A. Vi khuẩn lactic có sẵn trong thịt và thính gạo.","B. Vi rút cúm.","C. Nấm mốc độc.","D. Không cần vi sinh vật."],"answer":"A","explain":"Thịt chua: thịt lợn ướp muối trộn thính gạo, ủ kín; vi khuẩn lactic lên men tạo vị chua dịu đặc trưng — công nghệ lên men truyền thống.","points":0.25},{"type":"mcq","level":"VD","q":"Hộ anh Thắng làm nem chua Thanh Hóa ngon nổi tiếng, muốn bán online toàn quốc. Thách thức lớn nhất và giải pháp là gì?","options":["A. Không có thách thức gì.","B. Thách thức: nem chua nhanh hỏng khi vận chuyển xa; giải pháp: đóng gói hút chân không, giữ lạnh, giao hàng nhanh và ghi hạn sử dụng rõ ràng.","C. Chỉ cần tăng giá.","D. Ngừng làm nem."],"answer":"B","explain":"Nem chua lên men tiếp tục, nhanh chua quá, hỏng khi đi xa. Đóng gói hút chân không + giữ lạnh làm chậm lên men; giao nhanh + hạn sử dụng rõ giúp sản phẩm đến tay khách vẫn ngon, an toàn.","points":0.25},{"type":"mcq","level":"VDC","q":"Một tỉnh muốn phát triển “mỗi xã một sản phẩm” (OCOP) từ đặc sản chăn nuôi địa phương. Yếu tố quyết định thành công là gì?","options":["A. Chỉ cần sản phẩm ngon.","B. Chuẩn hóa chất lượng, đảm bảo VSATTP, xây dựng thương hiệu, truy xuất nguồn gốc và kết nối thị trường — đồng bộ từ sản xuất đến tiêu thụ.","C. Chỉ cần bao bì đẹp.","D. Chỉ cần giá rẻ."],"answer":"B","explain":"OCOP thành công khi đặc sản được chuẩn hóa (chất lượng ổn định, VSATTP), có thương hiệu, truy xuất được và kết nối được thị trường — là hệ sinh thái, không chỉ “ngon” là đủ.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thịt hun khói có mùi thơm đặc trưng và để được lâu.","b) Lạp xưởng làm từ thịt nhồi vỏ, phơi hoặc hun khô.","c) Thịt chua lên men nhờ vi khuẩn lactic.","d) Đặc sản vùng miền không có tiềm năng phát triển."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: đặc sản có tiềm năng lớn nếu chuẩn hóa và xây dựng thương hiệu.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bán đặc sản online cần đóng gói và bảo quản tốt khi vận chuyển.","b) OCOP cần chuẩn hóa chất lượng và xây dựng thương hiệu.","c) Đặc sản mang bản sắc văn hóa ẩm thực vùng miền.","d) Chỉ cần sản phẩm ngon là đủ để thành công."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cần đồng bộ chất lượng, VSATTP, thương hiệu, thị trường.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 đặc sản chế biến từ thịt lợn của Việt Nam.","answer":"giò chả, lạp xưởng","explain":"Các đặc sản từ thịt lợn: giò chả, lạp xưởng, nem chua, thịt chua, thịt hun khói…","points":0.5},{"type":"short","level":"VDC","q":"Nêu 2 yếu tố để đặc sản địa phương vươn ra thị trường lớn.","answer":"chuẩn hóa chất lượng, xây dựng thương hiệu","explain":"Để vươn xa: chuẩn hóa chất lượng ổn định, đảm bảo VSATTP, xây dựng thương hiệu, truy xuất nguồn gốc và kết nối thị trường.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Sữa tiệt trùng khác sữa thanh trùng ở điểm nào?","options":["A. Tiệt trùng diệt khuẩn triệt để hơn, bảo quản được lâu hơn (kể cả ở nhiệt độ thường nếu đóng hộp kín).","B. Không khác nhau.","C. Thanh trùng tốt hơn.","D. Sữa tiệt trùng không uống được."],"answer":"A","explain":"Tiệt trùng (UHT, nhiệt độ rất cao trong thời gian ngắn) diệt gần như hoàn toàn vi sinh vật → để được lâu. Thanh trùng (nhiệt độ thấp hơn) diệt phần lớn nhưng vẫn cần bảo quản lạnh và hạn ngắn.","points":0.25},{"type":"mcq","level":"NB","q":"Trứng muối có đặc điểm nào?","options":["A. Lòng đỏ cứng, béo ngậy, bảo quản được 2–3 tháng.","B. Lòng đỏ lỏng như trứng tươi.","C. Không ăn được.","D. Chỉ để làm cảnh."],"answer":"A","explain":"Ngâm muối 3–4 tuần, lòng đỏ trứng săn cứng, béo ngậy, mặn dịu — dùng ăn cháo, làm bánh; bảo quản được 2–3 tháng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao sữa tiệt trùng (UHT) để được lâu ở nhiệt độ thường?","options":["A. Vì có chất bảo quản mạnh.","B. Vì xử lí nhiệt rất cao diệt gần hết vi sinh vật và đóng hộp vô trùng kín.","C. Vì sữa không có dinh dưỡng.","D. Vì hộp sữa đẹp."],"answer":"B","explain":"Công nghệ UHT (135–150 độ C trong vài giây) + đóng gói vô trùng: không còn vi sinh vật gây hỏng và không cho xâm nhập trở lại → để lâu ở nhiệt độ thường.","points":0.25},{"type":"mcq","level":"TH","q":"Sau khi mở hộp sữa tiệt trùng, cần bảo quản như thế nào?","options":["A. Để ngoài nhiệt độ thường.","B. Đậy kín, bảo quản lạnh và dùng trong 2–3 ngày.","C. Đổ ra bát để ngoài.","D. Không cần bảo quản."],"answer":"B","explain":"Mở hộp là phá vỡ vô trùng, vi khuẩn từ không khí xâm nhập. Phải đậy kín, để lạnh và dùng nhanh trong 2–3 ngày để đảm bảo an toàn.","points":0.25},{"type":"mcq","level":"VD","q":"Hộp sữa tươi của gia đình em mở ra uống dở, để ngoài 2 ngày mới uống tiếp. Điều gì có thể xảy ra?","options":["A. Không sao.","B. Sữa đã nhiễm khuẩn, chua, hỏng; uống vào dễ bị ngộ độc, đau bụng.","C. Sữa ngon hơn.","D. Sữa tự tiệt trùng lại."],"answer":"B","explain":"Sữa đã mở hộp nhiễm khuẩn nhanh; để ngoài 2 ngày vi khuẩn phát triển mạnh gây chua, hỏng. Uống vào dễ ngộ độc — phải bỏ, không tiếc.","points":0.25},{"type":"mcq","level":"VDC","q":"Một cửa hàng bán sữa chua không bảo quản lạnh, để ở nhiệt độ thường cả tuần. Đánh giá nào đúng?","options":["A. Bình thường, sữa chua không cần lạnh.","B. Sai nghiêm trọng: sữa chua cần lạnh để kìm hãm lên men tiếp và vi khuẩn có hại; để ngoài lâu sẽ chua gắt, hỏng, gây ngộ độc.","C. Sữa chua càng để ngoài càng ngon.","D. Không ảnh hưởng gì."],"answer":"B","explain":"Sữa chua là sản phẩm lên men sống, phải bảo quản lạnh (2–8 độ C) để ổn định. Để ngoài lâu: lên men quá đà chua gắt, vi khuẩn có hại phát triển gây ngộ độc — vi phạm VSATTP nghiêm trọng.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sữa tiệt trùng để được lâu ở nhiệt độ thường khi chưa mở hộp.","b) Trứng muối bảo quản được 2–3 tháng.","c) Sữa đã mở hộp cần bảo quản lạnh và dùng trong 2–3 ngày.","d) Sữa chua cần được bảo quản lạnh."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sữa để ngoài sau khi mở hộp nhanh bị nhiễm khuẩn, hỏng.","b) Uống sữa hỏng dễ bị ngộ độc.","c) Sữa chua để ở nhiệt độ thường lâu sẽ chua gắt, hỏng.","d) Thực phẩm hỏng vẫn dùng được nếu tiếc."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: thực phẩm hỏng phải bỏ, không tiếc.","points":1},{"type":"short","level":"VD","q":"Sau khi mở hộp, sữa tiệt trùng cần được bảo quản thế nào?","answer":"đậy kín bảo quản lạnh và dùng trong 2 đến 3 ngày","explain":"Mở hộp là phá vỡ vô trùng; phải đậy kín, để lạnh và dùng hết trong 2–3 ngày để đảm bảo an toàn.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao sữa chua bán ở cửa hàng phải được bảo quản lạnh?","answer":"để kìm hãm lên men tiếp và ngăn vi khuẩn có hại phát triển","explain":"Sữa chua chứa vi khuẩn lactic sống; bảo quản lạnh (2–8 độ C) kìm hãm lên men tiếp tục và ngăn vi khuẩn có hại — đảm bảo chất lượng và an toàn đến hạn sử dụng.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Chế biến sâu sản phẩm chăn nuôi có ý nghĩa gì với người chăn nuôi?","options":["A. Tăng giá trị gia tăng, giảm phụ thuộc vào giá sản phẩm tươi bấp bênh.","B. Làm giảm thu nhập.","C. Tốn công vô ích.","D. Không có ý nghĩa."],"answer":"A","explain":"Chế biến sâu biến sản phẩm tươi giá bấp bênh thành nhiều sản phẩm giá trị cao, để lâu, bán quanh năm — nâng thu nhập và giảm rủi ro cho người chăn nuôi.","points":0.25},{"type":"mcq","level":"NB","q":"Khâu nào quyết định giá trị gia tăng lớn nhất trong chuỗi chăn nuôi?","options":["A. Chế biến, bảo quản.","B. Chỉ khâu nuôi.","C. Chỉ khâu vận chuyển.","D. Không có khâu nào."],"answer":"A","explain":"Nuôi tạo ra nguyên liệu; chế biến, bảo quản mới tạo ra giá trị gia tăng lớn (xúc xích đắt gấp nhiều lần thịt hơi tính trên cùng khối lượng thịt).","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các nước phát triển chú trọng chế biến sâu nông sản?","options":["A. Vì họ không thích sản phẩm tươi.","B. Vì chế biến sâu tạo giá trị gia tăng cao, việc làm, và giúp nông sản vươn ra thị trường toàn cầu.","C. Vì chế biến rẻ tiền.","D. Vì nông dân yêu cầu."],"answer":"B","explain":"Giá trị lớn nhất nằm ở chế biến: tạo việc làm công nghiệp, giá trị xuất khẩu cao, thương hiệu quốc gia — bài học cho nông nghiệp Việt Nam vươn lên chuỗi giá trị.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa chăn nuôi và công nghiệp chế biến thực phẩm là gì?","options":["A. Không liên quan.","B. Chăn nuôi cung cấp nguyên liệu; chế biến tạo đầu ra ổn định, giá trị cao — hai bên thúc đẩy nhau phát triển.","C. Chế biến gây hại cho chăn nuôi.","D. Chăn nuôi không cần chế biến."],"answer":"B","explain":"Chế biến cần nguồn nguyên liệu ổn định từ chăn nuôi; chăn nuôi cần chế biến để tiêu thụ, nâng giá trị. Liên kết chặt tạo chuỗi giá trị bền vững — “nuôi để chế biến, chế biến để nuôi”.","points":0.25},{"type":"mcq","level":"VD","q":"Tỉnh A có đàn bò sữa lớn nhưng chỉ bán sữa tươi, giá bấp bênh. Để nâng tầm ngành sữa địa phương, nên làm gì?","options":["A. Giảm đàn bò.","B. Thu hút đầu tư nhà máy chế biến sữa (sữa tiệt trùng, sữa chua, phô mai) gắn với vùng nguyên liệu — tạo chuỗi giá trị khép kín.","C. Bán hết bò.","D. Chỉ uống sữa tươi."],"answer":"B","explain":"Nhà máy chế biến tại chỗ: tiêu thụ ổn định sữa tươi, tạo nhiều sản phẩm giá trị cao, việc làm, thương hiệu địa phương — nâng cả ngành sữa lên tầm cao mới.","points":0.25},{"type":"mcq","level":"VDC","q":"Việt Nam xuất khẩu nhiều thịt lợn sống (tiểu ngạch) nhưng nhập khẩu xúc xích, thịt hộp giá cao. Vấn đề và giải pháp nào đúng?","options":["A. Không có vấn đề gì.","B. Vấn đề: ta ở khâu giá trị thấp của chuỗi; giải pháp: phát triển công nghiệp chế biến sâu trong nước để giữ lại giá trị gia tăng và chủ động thị trường.","C. Nên xuất khẩu nhiều hơn nữa.","D. Nên cấm nhập khẩu."],"answer":"B","explain":"Xuất nguyên liệu thô, nhập sản phẩm chế biến = “bán rẻ mua đắt”, mất giá trị gia tăng và việc làm. Phát triển chế biến sâu trong nước là hướng đi đúng để nâng vị thế trong chuỗi giá trị toàn cầu.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chế biến sâu giúp tăng giá trị gia tăng cho sản phẩm chăn nuôi.","b) Khâu chế biến quyết định phần lớn giá trị gia tăng của chuỗi.","c) Chăn nuôi cung cấp nguyên liệu cho công nghiệp chế biến.","d) Xuất nguyên liệu thô, nhập sản phẩm chế biến là có lợi."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: đó là “bán rẻ mua đắt”, mất giá trị gia tăng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nhà máy chế biến gắn với vùng nguyên liệu tạo chuỗi giá trị khép kín.","b) Chế biến và chăn nuôi thúc đẩy nhau phát triển.","c) Phát triển chế biến sâu giúp giữ lại giá trị gia tăng trong nước.","d) Chỉ cần chăn nuôi tốt, không cần chế biến."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: thiếu chế biến, giá trị gia tăng rơi vào tay người khác.","points":1},{"type":"short","level":"VD","q":"Nêu 2 lợi ích của chế biến sâu đối với người chăn nuôi.","answer":"tăng giá trị sản phẩm, giảm phụ thuộc giá tươi bấp bênh","explain":"Chế biến sâu: tăng giá trị gia tăng, đa dạng sản phẩm, bảo quản lâu, chủ động thị trường, giảm phụ thuộc giá sản phẩm tươi.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao “xuất nguyên liệu thô, nhập sản phẩm chế biến” là bất lợi?","answer":"vì bán rẻ mua đắt và mất giá trị gia tăng việc làm","explain":"Xuất thô giá rẻ, nhập thành phẩm giá cao = mất giá trị gia tăng, mất việc làm chế biến, phụ thuộc thị trường ngoài — cần phát triển chế biến sâu trong nước.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Để trở thành người tiêu dùng thông thái với sản phẩm chăn nuôi chế biến, cần làm gì?","options":["A. Xem nhãn mác, hạn sử dụng, nguồn gốc; chọn cơ sở uy tín; bảo quản đúng cách sau khi mua.","B. Mua theo giá rẻ nhất.","C. Không cần quan tâm gì.","D. Mua hàng không nhãn mác."],"answer":"A","explain":"Người tiêu dùng thông thái: đọc nhãn (thành phần, hạn dùng), chọn thương hiệu uy tín, bảo quản đúng (lạnh), không dùng hàng quá hạn, không rõ nguồn gốc.","points":0.25},{"type":"mcq","level":"NB","q":"Hạn sử dụng của thực phẩm có ý nghĩa gì?","options":["A. Thời gian nhà sản xuất cam kết sản phẩm còn an toàn, chất lượng khi bảo quản đúng cách.","B. Chỉ để trang trí.","C. Quá hạn vẫn dùng tốt.","D. Không có ý nghĩa."],"answer":"A","explain":"Hạn sử dụng là cam kết về an toàn, chất lượng trong điều kiện bảo quản đúng. Quá hạn, thực phẩm có thể biến chất gây hại — tuyệt đối không dùng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao không nên dùng thực phẩm quá hạn sử dụng dù nhìn vẫn bình thường?","options":["A. Vì nhìn bình thường là vẫn tốt.","B. Vì vi sinh vật và độc tố có thể đã phát triển mà mắt thường không thấy, gây ngộ độc.","C. Vì hạn sử dụng không quan trọng.","D. Vì thực phẩm quá hạn rẻ hơn."],"answer":"B","explain":"Nhiều vi khuẩn, độc tố không làm thay đổi cảm quan rõ rệt. Quá hạn = không còn đảm bảo an toàn — “nhìn bình thường” không có nghĩa là an toàn.","points":0.25},{"type":"mcq","level":"TH","q":"Bảo quản thực phẩm đã mua về đúng cách có ý nghĩa gì?","options":["A. Không quan trọng.","B. Giữ thực phẩm an toàn đến hết hạn sử dụng; bảo quản sai (để ngoài, không đậy kín) làm thực phẩm hỏng sớm, gây ngộ độc.","C. Chỉ để tủ lạnh đẹp.","D. Làm thực phẩm ngon hơn."],"answer":"B","explain":"Nhà sản xuất cam kết hạn sử dụng với điều kiện bảo quản đúng. Người dùng bảo quản sai (đồ lạnh để ngoài, mở hộp không đậy) thì thực phẩm hỏng trước hạn — trách nhiệm thuộc người dùng.","points":0.25},{"type":"mcq","level":"VD","q":"Mẹ em mua thịt về để trong ngăn đá 3 tháng mới dùng. Đánh giá nào đúng?","options":["A. Sai, phải bỏ đi.","B. Đúng nếu thịt được bọc kín, để đông liên tục (-18 độ C); khi dùng rã đông đúng cách và chế biến ngay.","C. Thịt đông 3 tháng là hỏng.","D. Nên để ngoài cho nhanh."],"answer":"B","explain":"Đông lạnh đúng (-18 độ C, bọc kín) giữ thịt an toàn nhiều tháng. Khi dùng: rã đông trong ngăn mát hoặc nước lạnh, chế biến ngay, không cấp đông lại.","points":0.25},{"type":"mcq","level":"VDC","q":"Một gia đình có thói quen rã đông thịt ở nhiệt độ phòng cả ngày rồi cấp đông lại phần thừa. Đánh giá và khuyến nghị nào đúng?","options":["A. Bình thường.","B. Sai nguy hiểm: rã đông lâu ở nhiệt độ phòng vi khuẩn phát triển mạnh; cấp đông lại không diệt được vi khuẩn và độc tố — dễ gây ngộ độc. Nên rã đông trong ngăn mát, dùng hết trong ngày.","C. Nên làm thường xuyên.","D. Không ảnh hưởng gì."],"answer":"B","explain":"Rã đông ở nhiệt độ phòng là “vùng nguy hiểm” (5–60 độ C) cho vi khuẩn bùng phát; cấp đông lại không loại bỏ được chúng và độc tố đã tạo ra. Đúng: rã đông trong ngăn mát, chế biến ngay, không cấp đông lại.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Người tiêu dùng nên xem nhãn mác, hạn sử dụng khi mua thực phẩm.","b) Hạn sử dụng là cam kết về an toàn, chất lượng sản phẩm.","c) Thực phẩm quá hạn tuyệt đối không dùng.","d) Nên mua thực phẩm không nhãn mác vì rẻ."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: hàng không nhãn mác tiềm ẩn nguy cơ mất an toàn.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thực phẩm quá hạn có thể chứa vi khuẩn, độc tố không nhìn thấy được.","b) Bảo quản sai cách làm thực phẩm hỏng trước hạn.","c) Rã đông ở nhiệt độ phòng lâu rồi cấp đông lại rất nguy hiểm.","d) Thịt đông lạnh đúng cách giữ được an toàn nhiều tháng."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Nêu 2 việc người tiêu dùng cần làm khi mua thực phẩm chế biến.","answer":"xem hạn sử dụng, chọn cơ sở uy tín","explain":"Người tiêu dùng thông thái: xem nhãn mác, hạn sử dụng, nguồn gốc; chọn cơ sở uy tín; bảo quản đúng cách; không dùng hàng quá hạn.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao không được rã đông thịt ở nhiệt độ phòng quá lâu rồi cấp đông lại?","answer":"vì vi khuẩn phát triển mạnh và cấp đông lại không diệt được chúng","explain":"Nhiệt độ phòng là “vùng nguy hiểm” cho vi khuẩn bùng phát và tạo độc tố; cấp đông lại không diệt được vi khuẩn và độc tố đã có — dễ gây ngộ độc thực phẩm.","points":0.5}]}]}
