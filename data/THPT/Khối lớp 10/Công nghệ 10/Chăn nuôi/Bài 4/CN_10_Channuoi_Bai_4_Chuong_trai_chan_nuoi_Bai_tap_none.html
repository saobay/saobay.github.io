<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Chuồng trại có vai trò nào sau đây?","options":["A. Bảo vệ vật nuôi khỏi nắng, mưa, gió rét và thú dữ.","B. Thay thế thức ăn cho vật nuôi.","C. Chữa bệnh cho vật nuôi.","D. Làm vật nuôi không cần uống nước."],"answer":"A","explain":"Chuồng trại bảo vệ vật nuôi khỏi tác động bất lợi của thời tiết, thú dữ; đồng thời tạo môi trường sống tối ưu và thuận tiện quản lí.","points":0.25},{"type":"mcq","level":"NB","q":"Hướng chuồng trại tốt nhất ở Việt Nam là hướng nào?","options":["A. Hướng Đông Nam.","B. Hướng Tây.","C. Hướng Bắc.","D. Hướng nào cũng như nhau."],"answer":"A","explain":"Hướng Đông Nam: buổi sáng đón nắng ấm, buổi chiều tránh nắng gắt hướng Tây; đồng thời đón gió mát mà tránh gió lùa trực tiếp.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao chuồng trại nên xây ở nơi cao ráo, xa khu dân cư?","options":["A. Để vật nuôi được yên tĩnh tuyệt đối.","B. Cao ráo giúp thoát nước, khô ráo, ít bệnh; xa dân cư hạn chế mùi hôi, ô nhiễm và lây lan dịch bệnh.","C. Để tiết kiệm đất.","D. Vì quy định cấm xây gần đường."],"answer":"B","explain":"Nơi cao ráo tránh ngập úng, ẩm thấp (nguồn sinh bệnh); xa khu dân cư giảm ảnh hưởng mùi hôi, tiếng ồn và nguy cơ dịch bệnh lây sang cộng đồng.","points":0.25},{"type":"mcq","level":"TH","q":"Nền chuồng trại cần đảm bảo yêu cầu nào?","options":["A. Thật thấp, trơn trượt.","B. Cao hơn mặt đất, phẳng, không trơn, dễ vệ sinh, có độ dốc thoát nước.","C. Đất lầy lội.","D. Không cần nền."],"answer":"B","explain":"Nền cao tránh ngập; phẳng, không trơn để vật nuôi đi lại an toàn; dễ vệ sinh và có độ dốc để nước, phân thoát nhanh, giữ chuồng khô ráo.","points":0.25},{"type":"mcq","level":"VD","q":"Gia đình bác Tám định xây chuồng lợn mới trên nền đất trũng hay bị ngập khi mưa. Lời khuyên đúng là gì?","options":["A. Cứ xây vì đất trũng mát.","B. Nên tôn nền cao hơn mặt đất xung quanh, làm rãnh thoát nước; nếu không được thì chọn vị trí cao ráo khác.","C. Xây chuồng thật thấp để lợn mát.","D. Không cần nền chuồng."],"answer":"B","explain":"Đất trũng ngập úng gây ẩm thấp, bệnh tật. Phải tôn nền cao, thoát nước tốt; nếu không khắc phục được thì chọn vị trí khác cao ráo hơn.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trang trại lợn 500 con đặt ngay sát khu dân cư đông đúc, không có hệ thống xử lí chất thải. Hậu quả có thể dự đoán và giải pháp căn cơ là gì?","options":["A. Không có vấn đề gì.","B. Gây mùi hôi, ô nhiễm nguồn nước, nguy cơ dịch bệnh; cần di dời đến vùng quy hoạch chăn nuôi tập trung, đầu tư biogas và xử lí chất thải.","C. Chỉ cần sơn lại chuồng.","D. Giảm số lợn xuống còn 10 con là xong."],"answer":"B","explain":"Chăn nuôi quy mô lớn sát dân cư gây ô nhiễm nghiêm trọng và xung đột cộng đồng. Giải pháp căn cơ: quy hoạch vùng chăn nuôi tập trung xa dân cư, bắt buộc có hệ thống xử lí chất thải (biogas, lắng lọc).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chuồng trại bảo vệ vật nuôi khỏi nắng, mưa, gió rét.","b) Nên xây chuồng trại theo hướng Đông Nam.","c) Chuồng trại nên đặt ở nơi cao ráo, thoát nước tốt.","d) Nền chuồng càng thấp, càng trũng càng tốt."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: nền phải cao hơn mặt đất, tránh ngập úng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chuồng trại xa khu dân cư giúp hạn chế ô nhiễm và dịch bệnh.","b) Nền chuồng phẳng, không trơn giúp vật nuôi đi lại an toàn.","c) Chuồng trại tốt giúp tạo tiểu khí hậu tối ưu cho vật nuôi.","d) Xây chuồng sát nhà dân không ảnh hưởng gì đến cộng đồng."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: gây mùi hôi, ô nhiễm, nguy cơ dịch bệnh.","points":1},{"type":"short","level":"VD","q":"Nêu 2 yêu cầu về địa điểm xây dựng chuồng trại.","answer":"cao ráo thoát nước tốt, xa khu dân cư","explain":"Địa điểm xây chuồng: cao ráo, thoát nước tốt; xa khu dân cư, trường học, nguồn nước sinh hoạt; gần nguồn thức ăn, nước sạch và đường giao thông.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao trang trại quy mô lớn phải đặt ở vùng quy hoạch chăn nuôi tập trung xa dân cư?","answer":"để hạn chế ô nhiễm môi trường và lây lan dịch bệnh sang cộng đồng","explain":"Trang trại lớn thải lượng chất thải lớn, nguy cơ dịch bệnh cao. Đặt xa dân cư trong vùng quy hoạch giúp kiểm soát ô nhiễm, cách li dịch bệnh và thuận tiện quản lí nhà nước.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Chuồng kín có đặc điểm nào?","options":["A. Tường bao kín, điều khiển được nhiệt độ, độ ẩm, thông gió bằng thiết bị.","B. Không có mái che.","C. Hoàn toàn không có tường.","D. Không cần vệ sinh."],"answer":"A","explain":"Chuồng kín có tường bao, dùng quạt, tấm làm mát, đèn sưởi để chủ động điều khiển tiểu khí hậu; kiểm soát dịch bệnh tốt, phù hợp chăn nuôi công nghiệp.","points":0.25},{"type":"mcq","level":"NB","q":"Chuồng đệm lót sinh học có ưu điểm gì?","options":["A. Giảm mùi hôi, ít phải dọn phân, tạo phân hữu cơ nhờ vi sinh vật phân hủy phân.","B. Tốn nhiều công dọn dẹp hơn.","C. Làm vật nuôi bị bệnh nhiều hơn.","D. Không có ưu điểm gì."],"answer":"A","explain":"Đệm lót (trấu, mùn cưa + chế phẩm vi sinh) phân hủy phân ngay tại chỗ → giảm mùi hôi, giảm công dọn, cuối vụ thu được phân hữu cơ bón cây.","points":0.25},{"type":"mcq","level":"TH","q":"So sánh chuồng hở và chuồng kín, nhận định nào đúng?","options":["A. Chuồng hở rẻ tiền nhưng khó kiểm soát nhiệt độ, dịch bệnh; chuồng kín đầu tư cao nhưng kiểm soát tốt tiểu khí hậu và dịch bệnh.","B. Chuồng hở luôn tốt hơn chuồng kín.","C. Chuồng kín không cần đầu tư gì.","D. Hai kiểu chuồng không khác nhau."],"answer":"A","explain":"Chuồng hở: rẻ, thoáng tự nhiên, hợp quy mô nhỏ; nhược điểm là phụ thuộc thời tiết, khó cách li dịch. Chuồng kín: chủ động mọi yếu tố, an toàn sinh học cao, nhưng vốn đầu tư và chi phí điện lớn.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao chuồng sàn (nền có khe hở) giúp lợn, gà ít bệnh hơn?","options":["A. Vì sàn đẹp hơn.","B. Vì phân lọt xuống dưới, mặt sàn luôn khô ráo, sạch sẽ, giảm tiếp xúc với mầm bệnh trong phân.","C. Vì vật nuôi thích leo trèo.","D. Vì sàn làm bằng vàng."],"answer":"B","explain":"Phân lọt qua khe sàn xuống hố bên dưới nên vật nuôi ít tiếp xúc với phân — giảm hẳn các bệnh đường tiêu hóa, hô hấp do môi trường bẩn.","points":0.25},{"type":"mcq","level":"VD","q":"Hộ anh Bình nuôi 50 lợn thịt, chuồng nền đất ẩm thấp, lợn hay bị tiêu chảy. Biện pháp cải tạo hiệu quả, ít tốn kém là gì?","options":["A. Lát nền xi măng có độ dốc, rãnh thoát nước; giữ chuồng khô ráo, dọn phân hằng ngày.","B. Cho lợn uống thêm nước.","C. Tăng mật độ nuôi lên gấp đôi.","D. Đóng kín chuồng không cho thoáng."],"answer":"A","explain":"Nguyên nhân tiêu chảy là nền ẩm, bẩn. Lát nền xi măng dốc thoát nước, dọn vệ sinh hằng ngày giữ chuồng khô ráo — biện pháp đơn giản mà giải quyết đúng gốc rễ.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trang trại gà đẻ 10.000 con ở vùng nắng nóng muốn ổn định năng suất quanh năm. Hệ thống chuồng trại nên đầu tư theo hướng nào?","options":["A. Chuồng hở hoàn toàn, không cần thiết bị.","B. Chuồng kín có tấm làm mát, quạt thông gió, điều khiển nhiệt độ tự động và băng tải thu trứng.","C. Nuôi thả rông ngoài đồng.","D. Chỉ cần mái che đơn giản."],"answer":"B","explain":"Gà đẻ rất nhạy cảm với nóng (giảm đẻ, trứng nhỏ). Chuồng kín + cooling pad + quạt giữ nhiệt độ ổn định quanh năm; tự động hóa thu trứng giảm công lao động — đầu tư xứng đáng với quy mô 10.000 con.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chuồng kín giúp kiểm soát tốt nhiệt độ và dịch bệnh.","b) Chuồng đệm lót sinh học giúp giảm mùi hôi chuồng nuôi.","c) Chuồng sàn giúp mặt chuồng luôn khô ráo, sạch sẽ.","d) Chuồng hở có chi phí đầu tư cao hơn chuồng kín."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: chuồng hở rẻ tiền hơn chuồng kín.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nền chuồng ẩm thấp là nguyên nhân gây tiêu chảy cho lợn.","b) Chuồng kín phù hợp với chăn nuôi công nghiệp quy mô lớn.","c) Đệm lót sinh học biến phân thành phân hữu cơ.","d) Mật độ nuôi càng cao càng tốt."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: quá chật gây stress, bệnh, chậm lớn.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 kiểu chuồng trại phổ biến trong chăn nuôi.","answer":"chuồng hở, chuồng kín","explain":"Các kiểu chuồng phổ biến: chuồng hở, chuồng kín; ngoài ra còn chuồng sàn, chuồng đệm lót sinh học… chọn theo loài, quy mô và điều kiện.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao trang trại gà đẻ quy mô lớn ở vùng nắng nóng nên đầu tư chuồng kín có hệ thống làm mát?","answer":"vì gà đẻ nhạy cảm với nóng và chuồng kín giữ nhiệt độ ổn định quanh năm","explain":"Nóng làm gà giảm ăn, giảm đẻ, trứng nhỏ. Chuồng kín + tấm làm mát + quạt duy trì nhiệt độ tối ưu ổn định quanh năm, đảm bảo năng suất — hiệu quả kinh tế vượt chi phí đầu tư ở quy mô lớn.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Thiết bị nào giúp gà đẻ trứng đều hơn trong mùa đông ít nắng?","options":["A. Hệ thống chiếu sáng bổ sung (14–16 giờ/ngày).","B. Máy gặt.","C. Lò sưởi quá nóng.","D. Không cần thiết bị gì."],"answer":"A","explain":"Ánh sáng kích thích gà đẻ trứng. Mùa đông ngày ngắn, thắp đèn bổ sung đủ 14–16 giờ/ngày giúp gà đẻ đều, không giảm năng suất.","points":0.25},{"type":"mcq","level":"NB","q":"Đèn sưởi, quây úm trong chuồng dùng để làm gì?","options":["A. Sưởi ấm cho vật nuôi non trong mùa lạnh.","B. Làm mát chuồng.","C. Chiếu sáng cho gà đẻ.","D. Sát trùng chuồng."],"answer":"A","explain":"Vật nuôi non (gà con, lợn con) chưa điều tiết thân nhiệt tốt, dễ chết rét. Đèn sưởi + quây úm giữ ấm cục bộ giúp chúng khỏe mạnh qua mùa lạnh.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao máng uống tự động tốt hơn máng uống thủ công?","options":["A. Vì đẹp hơn.","B. Vì luôn cung cấp nước sạch, đủ mọi lúc; giảm công lao động và tránh nước bẩn gây bệnh.","C. Vì không tốn tiền.","D. Vì vật nuôi không cần nước."],"answer":"B","explain":"Máng uống tự động (núm uống) cho nước sạch liên tục theo nhu cầu, không bị bẩn như máng thủ công; giảm công châm nước, hạn chế bệnh đường tiêu hóa.","points":0.25},{"type":"mcq","level":"TH","q":"Hố sát trùng ở cổng trang trại có tác dụng gì?","options":["A. Trang trí cổng.","B. Sát trùng giày dép, bánh xe người và phương tiện ra vào, ngăn mầm bệnh xâm nhập.","C. Nuôi cá.","D. Chứa nước uống."],"answer":"B","explain":"Người, xe ra vào là đường lây lan mầm bệnh. Hố (hoặc thảm) sát trùng ở cổng tiêu diệt mầm bệnh bám trên giày, bánh xe — biện pháp an toàn sinh học quan trọng.","points":0.25},{"type":"mcq","level":"VD","q":"Đàn gà con mới nở của chị Thảo vào mùa đông chết nhiều do lạnh. Biện pháp khắc phục trực tiếp là gì?","options":["A. Dùng đèn sưởi và quây úm giữ ấm cho gà con (32–35 độ C tuần đầu).","B. Cho gà con ra ngoài trời lạnh cho quen.","C. Giảm thức ăn.","D. Không cần làm gì."],"answer":"A","explain":"Gà con cần nhiệt độ úm 32–35 độ C tuần đầu, giảm dần. Đèn sưởi + quây úm giữ ấm cục bộ, tránh gió lùa là biện pháp trực tiếp cứu đàn gà con mùa lạnh.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trang trại đầu tư đầy đủ thiết bị hiện đại nhưng tỉ lệ bệnh vẫn cao. Kiểm tra thấy công nhân ra vào tự do, không sát trùng. Bài học là gì?","options":["A. Thiết bị hiện đại là vô ích.","B. Thiết bị chỉ phát huy khi kết hợp quản lí con người nghiêm ngặt (an toàn sinh học); con người là khâu yếu nhất trong phòng dịch.","C. Nên mua thêm thiết bị đắt tiền hơn.","D. Nên đóng cửa trang trại."],"answer":"B","explain":"Dù chuồng trại hiện đại, nếu con người ra vào tự do, mang mầm bệnh vào thì dịch vẫn bùng phát. An toàn sinh học đòi hỏi kỉ luật: sát trùng, cách li, hạn chế ra vào — con người quyết định thành bại.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chiếu sáng bổ sung giúp gà đẻ đều trong mùa đông.","b) Đèn sưởi giúp giữ ấm cho vật nuôi non.","c) Máng uống tự động cung cấp nước sạch liên tục.","d) Hố sát trùng ở cổng giúp ngăn mầm bệnh xâm nhập."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Gà con mới nở cần được giữ ấm 32–35 độ C trong tuần đầu.","b) Người và phương tiện ra vào là đường lây lan mầm bệnh.","c) Thiết bị hiện đại cần kết hợp với quản lí an toàn sinh học nghiêm ngặt.","d) Nước uống bẩn không gây bệnh cho vật nuôi."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: nước bẩn gây bệnh tiêu hóa.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 thiết bị quan trọng trong chuồng trại chăn nuôi.","answer":"máng ăn máng uống, hệ thống thông gió","explain":"Các thiết bị quan trọng: máng ăn, máng uống (tự động); hệ thống thông gió, làm mát; đèn sưởi úm; hệ thống chiếu sáng; dụng cụ vệ sinh, sát trùng.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao con người được coi là khâu yếu nhất trong an toàn sinh học trang trại?","answer":"vì người ra vào tự do có thể mang mầm bệnh vào trang trại","explain":"Dù chuồng trại, thiết bị hiện đại, chỉ cần công nhân, khách, xe cộ ra vào không sát trùng là mầm bệnh xâm nhập, gây bùng phát dịch — kỉ luật con người quyết định hiệu quả phòng dịch.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Vệ sinh chuồng trại hằng ngày gồm những việc gì?","options":["A. Quét dọn phân, rửa máng ăn, máng uống; giữ chuồng khô ráo.","B. Chỉ cần cho ăn.","C. Đóng cửa chuồng cả ngày.","D. Không cần làm gì."],"answer":"A","explain":"Vệ sinh hằng ngày: quét dọn phân, chất độn bẩn; rửa máng ăn, máng uống; giữ chuồng khô ráo, thoáng mát — nền tảng phòng bệnh.","points":0.25},{"type":"mcq","level":"NB","q":"Xử lí chất thải chăn nuôi bằng hầm biogas thu được gì?","options":["A. Khí đốt và phân bón hữu cơ.","B. Vàng bạc.","C. Thức ăn cho lợn.","D. Nước uống."],"answer":"A","explain":"Hầm biogas phân hủy kị khí chất thải, thu khí metan làm chất đốt đun nấu, thắp sáng; bã thải làm phân bón hữu cơ.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải sát trùng chuồng trại định kì ngay cả khi đàn vật nuôi khỏe mạnh?","options":["A. Vì sát trùng làm chuồng đẹp hơn.","B. Vì mầm bệnh luôn tồn tại trong môi trường; sát trùng định kì tiêu diệt mầm bệnh, ngăn dịch bùng phát.","C. Vì thuốc sát trùng rẻ.","D. Vì vật nuôi thích mùi thuốc."],"answer":"B","explain":"Mầm bệnh tồn tại trong phân, đất, không khí. Khi vật nuôi stress, sức đề kháng giảm, mầm bệnh sẽ bùng phát. Sát trùng định kì giữ mật độ mầm bệnh ở mức thấp, an toàn.","points":0.25},{"type":"mcq","level":"TH","q":"Mật độ nuôi quá cao trong chuồng gây hậu quả gì?","options":["A. Vật nuôi lớn nhanh hơn.","B. Stress, tranh ăn, bệnh lây lan nhanh, chậm lớn.","C. Tiết kiệm thức ăn.","D. Không ảnh hưởng gì."],"answer":"B","explain":"Chật chội gây stress, vật nuôi cắn nhau, tranh ăn; bệnh lây lan nhanh; không khí ô nhiễm → chậm lớn, tỉ lệ chết cao. Phải đảm bảo mật độ theo quy định.","points":0.25},{"type":"mcq","level":"VD","q":"Chuồng gà của gia đình em mùi hôi nồng nặc, ruồi nhặng nhiều. Biện pháp cải thiện tổng hợp là gì?","options":["A. Dọn phân thường xuyên, rắc vôi bột, phun thuốc sát trùng, giữ chuồng khô ráo, thoáng.","B. Đóng kín chuồng cho đỡ mùi.","C. Nuôi thêm nhiều gà nữa.","D. Chuyển gà ra ngoài vườn thả rông."],"answer":"A","explain":"Mùi hôi, ruồi do phân ứ đọng, ẩm thấp. Dọn phân thường xuyên + rắc vôi khử trùng + giữ khô ráo, thoáng khí giải quyết đồng bộ nguyên nhân.","points":0.25},{"type":"mcq","level":"VDC","q":"Một xã có 200 hộ nuôi lợn, mỗi hộ xả thải trực tiếp ra kênh chung. Kênh ô nhiễm nặng, cá chết. Giải pháp bền vững cho cả xã là gì?","options":["A. Cấm nuôi lợn toàn xã.","B. Vận động mỗi hộ xây hầm biogas, ủ phân; xã hỗ trợ kĩ thuật và kiểm tra việc xử lí chất thải.","C. Đổ thêm hóa chất xuống kênh.","D. Mặc kệ, chờ mưa cuốn đi."],"answer":"B","explain":"Cấm nuôi triệt để khó khả thi vì là sinh kế. Giải pháp bền vững: mỗi hộ xử lí chất thải tại nguồn (biogas, ủ phân) + chính quyền hỗ trợ kĩ thuật, giám sát — vừa giữ sinh kế vừa bảo vệ môi trường chung.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cần vệ sinh chuồng trại hằng ngày.","b) Hầm biogas cho khí đốt và phân bón.","c) Nên sát trùng chuồng trại định kì.","d) Mật độ nuôi càng cao càng tốt."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: quá chật gây stress và bệnh.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mầm bệnh luôn tồn tại trong môi trường chuồng nuôi.","b) Chuồng ẩm thấp, bẩn là nguyên nhân gây bệnh.","c) Xử lí chất thải tại nguồn giúp bảo vệ môi trường chung.","d) Mùi hôi chuồng nuôi không ảnh hưởng đến cộng đồng."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: mùi hôi ảnh hưởng nghiêm trọng đến dân cư xung quanh.","points":1},{"type":"short","level":"VD","q":"Nêu 2 biện pháp xử lí chất thải chăn nuôi thân thiện môi trường.","answer":"hầm biogas, ủ phân hữu cơ","explain":"Các biện pháp xử lí chất thải: hầm biogas (thu khí đốt), ủ phân hữu cơ (compost) bón cây; nước thải qua hệ thống lắng lọc.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao phải sát trùng chuồng trại định kì ngay cả khi vật nuôi khỏe mạnh?","answer":"vì mầm bệnh luôn tồn tại trong môi trường và có thể bùng phát khi vật nuôi giảm sức đề kháng","explain":"Mầm bệnh tồn tại thường trực trong phân, đất, không khí. Khi thời tiết thay đổi, vật nuôi stress, sức đề kháng giảm, mầm bệnh sẽ bùng phát thành dịch. Sát trùng định kì giữ mật độ mầm bệnh thấp.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Tấm làm mát (cooling pad) trong chuồng trại có tác dụng gì?","options":["A. Làm mát không khí trong chuồng vào mùa nóng.","B. Sưởi ấm chuồng.","C. Chiếu sáng chuồng.","D. Sát trùng chuồng."],"answer":"A","explain":"Tấm cooling pad kết hợp quạt hút tạo luồng không khí mát đi qua chuồng, giảm nhiệt độ hiệu quả trong mùa nắng nóng.","points":0.25},{"type":"mcq","level":"NB","q":"Vật liệu làm chuồng trại nên đảm bảo yêu cầu nào?","options":["A. Bền, rẻ, dễ vệ sinh, sát trùng.","B. Càng đắt càng tốt.","C. Thật đẹp mắt.","D. Không cần bền."],"answer":"A","explain":"Vật liệu chuồng cần bền chắc, giá hợp lí, bề mặt dễ vệ sinh, chịu được thuốc sát trùng; nên tận dụng vật liệu địa phương để giảm chi phí.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nên trồng cây xanh xung quanh chuồng trại?","options":["A. Để lấy gỗ.","B. Cây xanh che bóng mát, giảm nhiệt, chắn bụi, tạo cảnh quan và hạn chế mùi lan tỏa.","C. Để nuôi thêm khỉ.","D. Không có tác dụng gì."],"answer":"B","explain":"Hàng cây xanh quanh trại tạo bóng mát, giảm bức xạ nhiệt vào chuồng, lọc bụi, hấp thụ một phần mùi hôi — biện pháp chống nóng tự nhiên, rẻ tiền.","points":0.25},{"type":"mcq","level":"TH","q":"Chuồng nuôi lợn nái đẻ cần có thêm thiết bị gì đặc biệt?","options":["A. Ô úm cho lợn con và thanh chắn đè để bảo vệ lợn con khỏi bị mẹ đè.","B. Bể bơi cho lợn.","C. Máy lạnh công suất lớn.","D. Tivi cho lợn xem."],"answer":"A","explain":"Chuồng nái đẻ cần ô úm giữ ấm lợn con và khung/thanh chắn chống đè — vì lợn con sơ sinh dễ bị mẹ đè chết, đây là nguyên nhân hao hụt lớn.","points":0.25},{"type":"mcq","level":"VD","q":"Mùa hè nắng nóng, đàn lợn thịt của ông Vinh bỏ ăn, thở dốc. Biện pháp chống nóng khẩn cấp là gì?","options":["A. Phun sương, bật quạt thông gió, đảm bảo đủ nước uống mát; về lâu dài lắp tấm làm mát.","B. Cho lợn ăn nhiều hơn.","C. Đóng kín chuồng.","D. Tắm cho lợn bằng nước đá."],"answer":"A","explain":"Lợn bị stress nhiệt cần làm mát ngay: phun sương, quạt thông gió, nước uống đầy đủ. Tắm nước đá gây sốc nhiệt nguy hiểm. Về lâu dài cần hệ thống làm mát chuồng.","points":0.25},{"type":"mcq","level":"VDC","q":"Thiết kế chuồng trại cho vùng thường xuyên bão lũ cần lưu ý đặc biệt gì?","options":["A. Xây chuồng thật thấp để tránh gió.","B. Nền cao chống ngập, mái chắc chắn chống bão, có phương án sơ tán vật nuôi khi lũ lớn.","C. Không cần chuồng trại.","D. Chỉ nuôi vật nuôi biết bơi."],"answer":"B","explain":"Vùng bão lũ: nền phải cao hơn mức ngập lịch sử, kết cấu mái, khung chịu được gió bão; đồng thời có kế hoạch sơ tán đàn lên nơi cao khi có lũ — bảo vệ cả đàn vật nuôi và tài sản.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tấm làm mát giúp giảm nhiệt độ chuồng vào mùa nóng.","b) Vật liệu làm chuồng cần bền và dễ vệ sinh.","c) Trồng cây xanh quanh trại giúp chống nóng, giảm mùi.","d) Chuồng nái đẻ cần ô úm và thanh chắn chống đè cho lợn con."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lợn bị stress nhiệt thường bỏ ăn, thở dốc.","b) Phun sương, quạt gió giúp chống nóng khẩn cấp cho lợn.","c) Vùng bão lũ cần xây chuồng nền cao, mái chắc chắn.","d) Tắm cho lợn bằng nước đá là cách chống nóng tốt."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: nước đá gây sốc nhiệt nguy hiểm.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 biện pháp chống nóng cho chuồng trại vào mùa hè.","answer":"trồng cây xanh, lắp tấm làm mát","explain":"Các biện pháp chống nóng: trồng cây xanh quanh trại, lợp mái chống nóng, tấm làm mát + quạt thông gió, phun sương, đảm bảo đủ nước uống.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao chuồng nái đẻ cần thanh chắn chống đè?","answer":"vì lợn con sơ sinh dễ bị lợn mẹ đè chết gây hao hụt lớn","explain":"Lợn nái to, vụng về; lợn con sơ sinh yếu, hay nằm sát mẹ nên dễ bị đè chết — là nguyên nhân hao hụt lớn. Thanh chắn tạo khoảng an toàn cho lợn con.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Rắc vôi bột trong chuồng trại có tác dụng gì?","options":["A. Khử trùng, hút ẩm, giảm mùi hôi.","B. Làm thức ăn cho vật nuôi.","C. Trang trí chuồng.","D. Làm mát chuồng."],"answer":"A","explain":"Vôi bột có tính sát khuẩn, hút ẩm, khử mùi — thường rắc nền chuồng, lối đi để vệ sinh, phòng bệnh, giá rẻ, dễ dùng.","points":0.25},{"type":"mcq","level":"NB","q":"Nước thải chăn nuôi trước khi thải ra môi trường cần được làm gì?","options":["A. Xả thẳng ra sông.","B. Qua hệ thống lắng lọc, xử lí đạt chuẩn.","C. Đổ ra đường.","D. Không cần xử lí."],"answer":"B","explain":"Nước thải chăn nuôi chứa nhiều chất hữu cơ, mầm bệnh; phải qua bể lắng, lọc, xử lí đạt quy chuẩn mới được thải ra môi trường.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao chuồng trại cần được thông thoáng nhưng tránh gió lùa trực tiếp?","options":["A. Vì gió lùa làm vật nuôi bị lạnh đột ngột, dễ mắc bệnh hô hấp; còn bí khí gây ngột ngạt, tích khí độc.","B. Vì vật nuôi sợ gió.","C. Vì gió làm bay thức ăn.","D. Không cần quan tâm."],"answer":"A","explain":"Thông thoáng giúp không khí trong lành, giảm khí độc (amoniac). Nhưng gió lùa thẳng vào vật nuôi, nhất là con non, gây cảm lạnh, viêm phổi — cần che chắn hợp lí.","points":0.25},{"type":"mcq","level":"TH","q":"Khí amoniac trong chuồng nuôi sinh ra từ đâu và gây hại gì?","options":["A. Từ phân, nước tiểu phân hủy; gây cay mắt, viêm đường hô hấp cho vật nuôi và người.","B. Từ thức ăn thơm ngon.","C. Từ nước sạch.","D. Không gây hại gì."],"answer":"A","explain":"Phân, nước tiểu phân hủy sinh amoniac mùi khai, cay mắt; nồng độ cao gây viêm hô hấp, giảm năng suất — phải thông gió tốt và dọn phân thường xuyên.","points":0.25},{"type":"mcq","level":"VD","q":"Chuồng gà của bạn An bí khí, mùi khai nồng, gà hay bị hen khẹc. Nguyên nhân và cách khắc phục là gì?","options":["A. Do thiếu ánh sáng; thắp thêm đèn.","B. Do tích tụ khí amoniac từ phân; cần dọn phân, tăng thông gió, rắc vôi khử mùi.","C. Do gà đói; cho ăn thêm.","D. Do gà khát; cho uống thêm nước."],"answer":"B","explain":"Mùi khai + hen khẹc là dấu hiệu ngộ độc amoniac do phân ứ đọng, thông gió kém. Khắc phục: dọn phân thường xuyên, mở cửa thông gió, rắc vôi bột.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trang trại muốn đạt chứng nhận chăn nuôi an toàn (VietGAHP). Về chuồng trại, họ cần đáp ứng yêu cầu cốt lõi nào?","options":["A. Chuồng thật đẹp, sơn màu sắc sặc sỡ.","B. Địa điểm phù hợp, chuồng trại hợp vệ sinh, có khu cách li, hệ thống xử lí chất thải, hồ sơ ghi chép vệ sinh, sát trùng đầy đủ.","C. Nuôi càng nhiều càng tốt.","D. Không cần ghi chép gì."],"answer":"B","explain":"VietGAHP yêu cầu đồng bộ: vị trí, thiết kế chuồng hợp vệ sinh; khu cách li vật nuôi mới/ốm; xử lí chất thải đạt chuẩn; và hồ sơ ghi chép vệ sinh, sát trùng, thú y đầy đủ để truy xuất.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vôi bột giúp khử trùng và hút ẩm chuồng nuôi.","b) Nước thải chăn nuôi phải được xử lí trước khi thải ra môi trường.","c) Khí amoniac sinh ra từ phân, nước tiểu phân hủy.","d) Chuồng nuôi càng bí khí càng tốt."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cần thông thoáng, tránh bí khí.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Gió lùa trực tiếp dễ làm vật nuôi non mắc bệnh hô hấp.","b) Amoniac nồng độ cao gây viêm đường hô hấp cho vật nuôi.","c) Chứng nhận VietGAHP yêu cầu chuồng trại hợp vệ sinh và có hồ sơ ghi chép.","d) Phân ứ đọng lâu ngày không gây mùi hôi."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: phân ứ đọng sinh mùi hôi và khí độc.","points":1},{"type":"short","level":"VD","q":"Khí độc có mùi khai trong chuồng nuôi sinh ra từ đâu?","answer":"phân và nước tiểu phân hủy","explain":"Phân, nước tiểu của vật nuôi phân hủy sinh ra khí amoniac có mùi khai, cay mắt, gây viêm đường hô hấp — cần thông gió và dọn vệ sinh thường xuyên.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao trang trại muốn đạt chứng nhận VietGAHP phải có hồ sơ ghi chép vệ sinh, sát trùng?","answer":"để truy xuất và chứng minh quy trình chăn nuôi an toàn","explain":"Hồ sơ ghi chép là bằng chứng cho thấy trang trại thực hiện đúng quy trình vệ sinh, sát trùng, thú y — là cơ sở để đánh giá, cấp chứng nhận và truy xuất khi có sự cố.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Khu cách li trong trang trại dùng để làm gì?","options":["A. Cách li vật nuôi mới nhập hoặc vật nuôi ốm để theo dõi, tránh lây bệnh cho cả đàn.","B. Nuôi nhốt vật nuôi phạm lỗi.","C. Chứa thức ăn.","D. Để không cho đẹp."],"answer":"A","explain":"Vật nuôi mới mua về hoặc bị ốm phải cách li riêng một thời gian để theo dõi, điều trị, đảm bảo không mang mầm bệnh lây cho đàn khỏe mạnh.","points":0.25},{"type":"mcq","level":"NB","q":"Mái chuồng trại cần đảm bảo yêu cầu nào?","options":["A. Chắc chắn, chống dột, chống nóng.","B. Càng thấp càng tốt.","C. Làm bằng lá mỏng dễ tốc.","D. Không cần mái che."],"answer":"A","explain":"Mái phải chắc chắn chịu được mưa bão, không dột, có khả năng chống nóng (lợp 2 mái, vật liệu cách nhiệt) để bảo vệ vật nuôi.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao vật nuôi mới mua về không được thả ngay vào đàn cũ?","options":["A. Vì vật nuôi mới đắt tiền hơn.","B. Vì có thể mang mầm bệnh; cần cách li theo dõi 2–3 tuần, đảm bảo khỏe mạnh mới nhập đàn.","C. Vì đàn cũ sẽ ghen tị.","D. Vì vật nuôi mới không ăn được cám."],"answer":"B","explain":"Vật nuôi mới chưa rõ tình trạng sức khỏe, có thể đang ủ bệnh. Cách li 2–3 tuần để theo dõi, tiêm phòng bổ sung rồi mới nhập đàn — nguyên tắc an toàn sinh học cơ bản.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của việc tận dụng vật liệu địa phương làm chuồng trại là gì?","options":["A. Giảm chi phí đầu tư, phù hợp điều kiện địa phương, dễ sửa chữa.","B. Chuồng sẽ xấu hơn.","C. Vật nuôi không thích.","D. Không có ưu điểm."],"answer":"A","explain":"Tre, gỗ, lá… sẵn có tại địa phương giúp giảm đáng kể chi phí xây dựng, phù hợp khí hậu và dễ sửa chữa — quan trọng với chăn nuôi nông hộ vốn ít.","points":0.25},{"type":"mcq","level":"VD","q":"Anh Khoa mua 20 con lợn giống từ chợ về thả ngay vào đàn 100 con đang nuôi. Một tuần sau cả đàn ốm. Sai lầm của anh là gì?","options":["A. Mua quá ít lợn.","B. Không cách li, theo dõi lợn mới trước khi nhập đàn nên mầm bệnh lây lan.","C. Cho lợn ăn quá nhiều.","D. Chuồng quá rộng."],"answer":"B","explain":"Lợn mua ở chợ chưa rõ nguồn gốc, sức khỏe; thả ngay vào đàn là đưa mầm bệnh vào. Đúng ra phải cách li riêng 2–3 tuần, theo dõi, sát trùng, tiêm phòng rồi mới nhập đàn.","points":0.25},{"type":"mcq","level":"VDC","q":"Thiết kế một trang trại lợn khép kín cần bố trí các khu vực theo nguyên tắc nào để phòng dịch hiệu quả?","options":["A. Tất cả các khu chung một chỗ cho tiện.","B. Phân khu rõ ràng: khu chăn nuôi – khu cách li – kho thức ăn – khu xử lí chất thải; luồng đi một chiều, có hàng rào và sát trùng ở cổng.","C. Đặt khu cách li giữa khu chăn nuôi.","D. Không cần phân khu."],"answer":"B","explain":"Phân khu + luồng một chiều ngăn mầm bệnh di chuyển chéo: vật nuôi mới/ốm ở khu cách li riêng; người, xe, thức ăn đi theo luồng quy định, sát trùng ở cổng — là thiết kế chuẩn của trang trại an toàn sinh học.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vật nuôi mới mua về cần được cách li theo dõi trước khi nhập đàn.","b) Mái chuồng cần chắc chắn, chống dột, chống nóng.","c) Tận dụng vật liệu địa phương giúp giảm chi phí làm chuồng.","d) Có thể thả ngay vật nuôi mới mua vào đàn cũ."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: phải cách li 2–3 tuần.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trang trại khép kín cần phân khu rõ ràng và luồng đi một chiều.","b) Khu cách li đặt riêng biệt với khu chăn nuôi chính.","c) Sát trùng ở cổng giúp ngăn mầm bệnh theo người, xe vào trại.","d) Tất cả các khu trong trại nên chung một chỗ cho tiện."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: chung chỗ dễ lây lan mầm bệnh chéo.","points":1},{"type":"short","level":"VD","q":"Vật nuôi mới mua về cần cách li theo dõi bao lâu trước khi nhập đàn?","answer":"2 đến 3 tuần","explain":"Vật nuôi mới cần cách li riêng 2–3 tuần để theo dõi sức khỏe, phát hiện bệnh đang ủ, tiêm phòng bổ sung rồi mới nhập đàn — đảm bảo an toàn dịch bệnh.","points":0.5},{"type":"short","level":"VDC","q":"Nêu nguyên tắc bố trí các khu vực trong trang trại để phòng dịch hiệu quả.","answer":"phân khu rõ ràng và luồng đi một chiều","explain":"Trang trại an toàn sinh học bố trí phân khu (chăn nuôi, cách li, kho, xử lí chất thải) riêng biệt, luồng người – vật nuôi – thức ăn – chất thải đi một chiều, có hàng rào và sát trùng ở cổng.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Diện tích chuồng nuôi cần đảm bảo yêu cầu nào?","options":["A. Đủ rộng theo mật độ quy định của từng loài.","B. Càng chật càng tốt.","C. Không cần quan tâm diện tích.","D. Một chuồng nuôi mọi loài chung."],"answer":"A","explain":"Mỗi loài, lứa tuổi có mật độ nuôi quy định (m2/con). Đủ diện tích giúp vật nuôi thoải mái, ít stress, ít bệnh, lớn nhanh.","points":0.25},{"type":"mcq","level":"NB","q":"Phun thuốc sát trùng chuồng trại nên thực hiện khi nào?","options":["A. Định kì và sau mỗi lứa nuôi (trước khi nhập lứa mới).","B. Không bao giờ.","C. Chỉ khi có dịch.","D. Mỗi ngày 10 lần."],"answer":"A","explain":"Sát trùng định kì hằng tuần/tháng và tổng vệ sinh, sát trùng toàn trại sau mỗi lứa (để trống chuồng) trước khi nhập lứa mới — cắt đứt mầm bệnh giữa các lứa.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao sau mỗi lứa nuôi nên để trống chuồng một thời gian trước khi nhập lứa mới?","options":["A. Để chuồng nghỉ ngơi.","B. Để tổng vệ sinh, sát trùng triệt để, cắt đứt mầm bệnh từ lứa cũ sang lứa mới.","C. Vì hết tiền mua con giống.","D. Vì vật nuôi cũ nhớ chuồng."],"answer":"B","explain":"Để trống chuồng 1–2 tuần kết hợp vệ sinh, sát trùng, rắc vôi giúp tiêu diệt mầm bệnh còn sót từ lứa cũ, lứa mới vào sẽ an toàn, ít bệnh.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các biện pháp sau, biện pháp nào KHÔNG thuộc vệ sinh phòng bệnh?","options":["A. Quét dọn phân hằng ngày.","B. Phun thuốc sát trùng định kì.","C. Cho vật nuôi ăn thức ăn mốc.","D. Rắc vôi bột khử trùng."],"answer":"C","explain":"Cho ăn thức ăn mốc gây bệnh chứ không phòng bệnh. Các biện pháp còn lại đều là vệ sinh phòng bệnh đúng.","points":0.25},{"type":"mcq","level":"VD","q":"Trang trại gà của cô Lan sau mỗi lứa đều tổng vệ sinh, sát trùng và để trống chuồng 2 tuần. Kết quả là gì?","options":["A. Tốn thời gian vô ích.","B. Lứa gà mới ít bệnh, lớn nhanh, tỉ lệ sống cao vì mầm bệnh từ lứa cũ đã bị tiêu diệt.","C. Gà lứa mới chậm lớn hơn.","D. Tốn thêm tiền thuốc."],"answer":"B","explain":"Để trống + sát trùng triệt để cắt đứt chuỗi lây nhiễm giữa các lứa — lứa mới khỏe mạnh, ít bệnh, thực tế còn tiết kiệm tiền thuốc và tăng lợi nhuận.","points":0.25},{"type":"mcq","level":"VDC","q":"Một hộ nuôi lợn nái sinh sản muốn giảm tỉ lệ lợn con chết. Trong các đầu tư về chuồng trại, nên ưu tiên gì?","options":["A. Sơn chuồng màu đẹp.","B. Ô úm giữ ấm, sàn khô ráo, thanh chắn chống đè và vệ sinh, sát trùng tốt.","C. Mở rộng chuồng gấp đôi.","D. Lắp điều hòa cho cả trại."],"answer":"B","explain":"Lợn con chết chủ yếu do lạnh, bị đè và nhiễm trùng. Ô úm + sàn khô + chắn đè + vệ sinh tốt giải quyết đúng 3 nguyên nhân chính với chi phí hợp lí nhất.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cần đảm bảo mật độ nuôi theo quy định từng loài.","b) Nên sát trùng chuồng trại định kì và sau mỗi lứa nuôi.","c) Nên để trống chuồng một thời gian trước khi nhập lứa mới.","d) Cho vật nuôi ăn thức ăn mốc giúp phòng bệnh."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: thức ăn mốc gây bệnh.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Để trống chuồng giúp cắt đứt mầm bệnh giữa các lứa nuôi.","b) Lợn con chết nhiều do lạnh, bị đè và nhiễm trùng.","c) Ô úm và thanh chắn chống đè giúp giảm hao hụt lợn con.","d) Vệ sinh tốt làm tăng chi phí thuốc thú y."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: vệ sinh tốt giúp giảm bệnh, giảm tiền thuốc.","points":1},{"type":"short","level":"VD","q":"Sau mỗi lứa nuôi, cần làm gì trước khi nhập lứa vật nuôi mới?","answer":"tổng vệ sinh sát trùng và để trống chuồng","explain":"Sau mỗi lứa: tổng vệ sinh, phun thuốc sát trùng triệt để, rắc vôi và để trống chuồng 1–2 tuần để cắt đứt mầm bệnh trước khi nhập lứa mới.","points":0.5},{"type":"short","level":"VDC","q":"Nêu 3 nguyên nhân chính gây chết lợn con sơ sinh liên quan đến chuồng trại.","answer":"lạnh, bị mẹ đè, nhiễm trùng","explain":"Lợn con sơ sinh chết chủ yếu do: lạnh (thiếu úm sưởi), bị lợn mẹ đè (thiếu thanh chắn), nhiễm trùng (chuồng bẩn, không sát trùng) — đều khắc phục được bằng chuồng trại và vệ sinh tốt.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Chuồng trại tốt giúp ích gì cho việc quản lí đàn vật nuôi?","options":["A. Thuận tiện cho ăn, vệ sinh, theo dõi sức khỏe và thu sản phẩm.","B. Không cần quản lí nữa.","C. Vật nuôi tự chăm sóc nhau.","D. Không có ích gì."],"answer":"A","explain":"Chuồng trại bố trí hợp lí giúp người chăn nuôi cho ăn, dọn vệ sinh, phát hiện vật nuôi ốm và thu hoạch sản phẩm (trứng, sữa) dễ dàng, nhanh chóng.","points":0.25},{"type":"mcq","level":"NB","q":"Hàng rào bao quanh trang trại có tác dụng gì?","options":["A. Ngăn người lạ, động vật hoang dã xâm nhập, bảo vệ đàn vật nuôi và an toàn sinh học.","B. Trang trí.","C. Nuôi thêm cây cảnh.","D. Không có tác dụng."],"answer":"A","explain":"Hàng rào ngăn người lạ, chó mèo, động vật hoang dã mang mầm bệnh xâm nhập; đồng thời bảo vệ tài sản trang trại.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao động vật hoang dã (chuột, chim) xâm nhập trang trại là nguy hiểm?","options":["A. Vì chúng ăn hết thức ăn.","B. Vì chúng có thể mang mầm bệnh (cúm gia cầm, dịch tả…) lây cho đàn vật nuôi.","C. Vì chúng làm ồn.","D. Vì chúng đẹp."],"answer":"B","explain":"Chuột, chim hoang dã là vật trung gian truyền nhiều bệnh nguy hiểm (cúm gia cầm, Newcastle, dịch tả lợn…). Hàng rào, lưới chắn và vệ sinh tốt giúp ngăn chúng xâm nhập.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa chuồng trại và năng suất vật nuôi là gì?","options":["A. Không liên quan.","B. Chuồng trại tốt tạo môi trường tối ưu giúp vật nuôi khỏe, lớn nhanh, đẻ nhiều; chuồng xấu làm giảm năng suất.","C. Chuồng càng xấu vật nuôi càng lớn nhanh.","D. Chỉ giống mới quyết định năng suất."],"answer":"B","explain":"Tiểu khí hậu chuồng (nhiệt độ, độ ẩm, sạch sẽ) ảnh hưởng trực tiếp đến sức khỏe và sinh trưởng. Chuồng tốt + giống tốt + thức ăn tốt = năng suất cao.","points":0.25},{"type":"mcq","level":"VD","q":"Đàn gà của bác Sáu hay bị cúm, phát hiện có nhiều chim hoang dã bay vào chuồng ăn thức ăn. Biện pháp nào cần làm ngay?","options":["A. Dùng lưới chắn không cho chim vào, vệ sinh máng ăn, sát trùng chuồng.","B. Cho chim ăn cùng gà.","C. Thả thêm chim vào chuồng.","D. Không cần làm gì."],"answer":"A","explain":"Chim hoang dã là nguồn lây cúm gia cầm. Phải ngăn chim tiếp xúc đàn gà bằng lưới chắn, vệ sinh thức ăn, nước uống và sát trùng — biện pháp an toàn sinh học cấp thiết.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty muốn xây dựng trang trại lợn 2000 con đạt chuẩn an toàn sinh học. Thứ tự ưu tiên đầu tư nào hợp lí nhất?","options":["A. Mua lợn giống trước, xây chuồng sau.","B. Quy hoạch địa điểm – thiết kế chuồng trại, phân khu, xử lí chất thải – rồi mới nhập giống và áp dụng quy trình quản lí nghiêm ngặt.","C. Chỉ cần mua thức ăn tốt là đủ.","D. Thuê thật nhiều công nhân."],"answer":"B","explain":"Xây dựng trang trại phải theo trình tự: địa điểm, thiết kế chuồng trại và hệ thống phụ trợ (cách li, biogas, sát trùng) trước; rồi mới nhập giống và vận hành theo quy trình — “xây nhà rồi mới đón khách”.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chuồng trại hợp lí giúp thuận tiện chăm sóc, quản lí đàn vật nuôi.","b) Hàng rào ngăn động vật hoang dã mang mầm bệnh xâm nhập.","c) Chuồng trại tốt góp phần nâng cao năng suất vật nuôi.","d) Nên xây chuồng trước khi nhập giống về nuôi."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chim hoang dã có thể lây bệnh cúm cho đàn gà.","b) Lưới chắn giúp ngăn chim tiếp xúc với đàn gà.","c) Xây dựng trang trại cần quy hoạch địa điểm và thiết kế trước khi nhập giống.","d) Động vật hoang dã xâm nhập không gây nguy hiểm gì."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: chúng mang mầm bệnh nguy hiểm.","points":1},{"type":"short","level":"VD","q":"Nêu 2 tác dụng của hàng rào bao quanh trang trại.","answer":"ngăn người lạ xâm nhập, ngăn động vật hoang dã mang mầm bệnh","explain":"Hàng rào bảo vệ trang trại: ngăn người lạ, trộm cắp; ngăn chó mèo, chuột, động vật hoang dã mang mầm bệnh xâm nhập — đảm bảo an toàn sinh học.","points":0.5},{"type":"short","level":"VDC","q":"Nêu trình tự hợp lí khi xây dựng một trang trại chăn nuôi mới.","answer":"quy hoạch địa điểm rồi thiết kế xây dựng chuồng trại rồi mới nhập giống","explain":"Trình tự đúng: chọn địa điểm phù hợp → thiết kế, xây dựng chuồng trại và hệ thống phụ trợ (cách li, xử lí chất thải, sát trùng) → nhập con giống → vận hành theo quy trình nghiêm ngặt.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Đầu tư chuồng trại đúng cách được coi là gì?","options":["A. Lãng phí tiền bạc.","B. Đầu tư cho năng suất và phòng bệnh lâu dài.","C. Chỉ để khoe với hàng xóm.","D. Không cần thiết."],"answer":"B","explain":"Chuồng trại tốt giúp vật nuôi khỏe, ít bệnh, lớn nhanh — tiết kiệm tiền thuốc, tăng năng suất qua nhiều lứa, nên là khoản đầu tư sinh lời lâu dài.","points":0.25},{"type":"mcq","level":"NB","q":"Bể lắng, lọc nước thải chăn nuôi có tác dụng gì?","options":["A. Làm nước thải đạt chuẩn trước khi thải ra môi trường.","B. Nuôi cá cảnh.","C. Chứa nước uống.","D. Không có tác dụng."],"answer":"A","explain":"Nước thải qua bể lắng, lọc sinh học để loại bỏ chất hữu cơ, mầm bệnh, đạt quy chuẩn môi trường mới được thải ra ngoài.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói “phòng bệnh hơn chữa bệnh” bắt đầu từ chuồng trại?","options":["A. Vì chuồng trại chữa được mọi bệnh.","B. Vì chuồng sạch, khô ráo, sát trùng tốt ngăn mầm bệnh ngay từ đầu, rẻ hơn nhiều so với chữa bệnh khi dịch bùng phát.","C. Vì không cần tiêm phòng nữa.","D. Vì chuồng trại thay thế bác sĩ thú y."],"answer":"B","explain":"Vệ sinh, sát trùng chuồng trại tốn ít chi phí nhưng ngăn được phần lớn dịch bệnh. Khi dịch đã bùng phát, thiệt hại về vật nuôi chết và tiền thuốc lớn gấp nhiều lần.","points":0.25},{"type":"mcq","level":"TH","q":"Trong chăn nuôi nông hộ vốn ít, cải tạo chuồng trại nên ưu tiên gì?","options":["A. Sơn vẽ trang trí.","B. Nền cao ráo, thoát nước; mái che chắc chắn; vệ sinh, sát trùng thường xuyên — những việc ít tốn kém mà hiệu quả cao.","C. Mua thiết bị đắt tiền nhất.","D. Mở rộng gấp 10 lần."],"answer":"B","explain":"Với vốn ít, ưu tiên những cải tạo thiết thực, rẻ tiền: tôn nền, sửa mái, rãnh thoát nước, vệ sinh, vôi bột sát trùng — hiệu quả phòng bệnh rất cao so với chi phí.","points":0.25},{"type":"mcq","level":"VD","q":"Hộ cô Hoa vốn ít, chuồng lợn cũ dột nát, nền trũng. Với 5 triệu đồng, cô nên ưu tiên sửa gì?","options":["A. Mua tivi đặt trong chuồng.","B. Tôn nền cao, lợp lại mái chống dột, làm rãnh thoát nước và mua vôi bột sát trùng.","C. Mua thêm 20 con lợn.","D. Sơn chuồng màu hồng."],"answer":"B","explain":"Với ngân sách hạn chế, ưu tiên khắc phục điểm yếu chí mạng: chống dột, chống ngập, thoát nước và vệ sinh — trực tiếp giảm bệnh tật, bảo vệ đàn lợn hiện có.","points":0.25},{"type":"mcq","level":"VDC","q":"Đánh giá câu nói: “Chuồng trại chỉ là nơi trú ẩn, không ảnh hưởng đến hiệu quả kinh tế”.","options":["A. Đúng.","B. Sai: chuồng trại ảnh hưởng trực tiếp qua năng suất (tiểu khí hậu), chi phí thuốc (phòng bệnh), môi trường (xử lí chất thải) — quyết định lợi nhuận.","C. Đúng một phần.","D. Không thể đánh giá."],"answer":"B","explain":"Chuồng trại tác động đa chiều đến kinh tế: vật nuôi khỏe → năng suất cao; ít bệnh → giảm tiền thuốc; xử lí chất thải tốt → tránh bị phạt môi trường. Đó là khoản đầu tư, không phải chi phí thuần túy.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đầu tư chuồng trại tốt là đầu tư cho năng suất lâu dài.","b) Nước thải chăn nuôi cần được xử lí trước khi thải ra môi trường.","c) Vệ sinh chuồng trại rẻ hơn nhiều so với chữa bệnh khi có dịch.","d) Nông hộ vốn ít không thể cải tạo chuồng trại."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: có nhiều cải tạo ít tốn kém mà hiệu quả cao.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chuồng trại ảnh hưởng đến năng suất, chi phí thuốc và môi trường.","b) Nông hộ nên ưu tiên cải tạo thiết thực, ít tốn kém.","c) Phòng bệnh từ chuồng trại rẻ hơn chữa bệnh.","d) Chuồng trại không liên quan đến hiệu quả kinh tế."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai.","points":1},{"type":"short","level":"VD","q":"Nêu 2 việc ưu tiên khi cải tạo chuồng trại với vốn ít.","answer":"tôn nền chống ngập, sửa mái chống dột","explain":"Với vốn ít, ưu tiên: tôn nền cao, thoát nước tốt; sửa mái chống dột, chống nóng; vệ sinh, rắc vôi sát trùng thường xuyên — hiệu quả cao, chi phí thấp.","points":0.5},{"type":"short","level":"VDC","q":"Giải thích ngắn gọn vì sao chuồng trại ảnh hưởng đến hiệu quả kinh tế chăn nuôi.","answer":"vì quyết định năng suất vật nuôi chi phí thuốc thú y và chi phí môi trường","explain":"Chuồng tốt → vật nuôi khỏe, năng suất cao; ít bệnh → giảm tiền thuốc; xử lí chất thải tốt → tránh phạt môi trường. Cả ba đều tác động trực tiếp đến lợi nhuận.","points":0.5}]}]}
