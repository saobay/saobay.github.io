<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Thức ăn chăn nuôi là gì?","options":["A. Những sản phẩm vật nuôi ăn vào để cung cấp chất dinh dưỡng cho cơ thể.","B. Thuốc chữa bệnh cho vật nuôi.","C. Nước uống của vật nuôi.","D. Vật liệu làm chuồng trại."],"answer":"A","explain":"Thức ăn chăn nuôi là những sản phẩm có nguồn gốc thực vật, động vật, khoáng… mà vật nuôi ăn vào, cung cấp dinh dưỡng cho duy trì sự sống và tạo sản phẩm.","points":0.25},{"type":"mcq","level":"NB","q":"Chi phí thức ăn chiếm bao nhiêu phần trăm giá thành sản phẩm chăn nuôi?","options":["A. Khoảng 5–10%.","B. Khoảng 60–70%.","C. Khoảng 1–2%.","D. Khoảng 100%."],"answer":"B","explain":"Chi phí thức ăn chiếm 60–70% giá thành sản phẩm chăn nuôi nên sử dụng thức ăn hợp lí là chìa khóa hạ giá thành, tăng lợi nhuận.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao chi phí thức ăn lại quyết định lợi nhuận chăn nuôi?","options":["A. Vì thức ăn là khoản chi lớn nhất (60–70% giá thành); tiết kiệm thức ăn mà vẫn đảm bảo dinh dưỡng sẽ tăng lãi.","B. Vì thức ăn không quan trọng.","C. Vì vật nuôi không cần ăn.","D. Vì thức ăn luôn miễn phí."],"answer":"A","explain":"Thức ăn chiếm tỉ trọng chi phí lớn nhất. Giảm hao hụt, phối khẩu phần hợp lí, tận dụng phụ phẩm giúp hạ giá thành mỗi kg thịt, quả trứng mà năng suất không giảm → lợi nhuận tăng.","points":0.25},{"type":"mcq","level":"TH","q":"Nhu cầu dinh dưỡng của lợn nái mang thai gồm những gì?","options":["A. Chỉ nhu cầu duy trì.","B. Nhu cầu duy trì + nhu cầu sản xuất (nuôi thai).","C. Chỉ nhu cầu sản xuất.","D. Không có nhu cầu dinh dưỡng."],"answer":"B","explain":"Lợn nái mang thai vừa cần dinh dưỡng duy trì sự sống (nhu cầu duy trì) vừa cần thêm dinh dưỡng để nuôi thai phát triển (nhu cầu sản xuất).","points":0.25},{"type":"mcq","level":"VD","q":"Đàn gà đẻ trứng của bác Hai đẻ ít, vỏ trứng mỏng dễ vỡ. Khẩu phần nhiều khả năng đang thiếu chất gì?","options":["A. Canxi (khoáng).","B. Nước.","C. Chất xơ.","D. Không khí."],"answer":"A","explain":"Vỏ trứng cấu tạo chủ yếu từ canxi. Thiếu canxi → vỏ mỏng, dễ vỡ, tỉ lệ đẻ giảm. Cần bổ sung bột vỏ sò, bột xương vào khẩu phần.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trang trại nuôi 1000 lợn thịt, giá cám tăng 20% trong khi giá lợn hơi không đổi. Giải pháp nào giúp trang trại duy trì lợi nhuận mà không giảm năng suất?","options":["A. Giảm một nửa khẩu phần ăn của lợn.","B. Tối ưu khẩu phần (phối trộn tận dụng phụ phẩm rẻ, giảm hao hụt, đúng tiêu chuẩn từng giai đoạn) và đàm phán giá cám.","C. Ngừng cho lợn uống nước.","D. Bán hết lợn con."],"answer":"B","explain":"Không thể cắt giảm dinh dưỡng (lợn chậm lớn, lỗ nặng hơn). Giải pháp đúng là tối ưu hóa: phối khẩu phần đúng tiêu chuẩn từng giai đoạn, tận dụng nguyên liệu rẻ (cám gạo, sắn…), giảm rơi vãi, chống hao hụt — hạ chi phí/kg tăng trọng.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thức ăn cung cấp chất dinh dưỡng cho vật nuôi.","b) Chi phí thức ăn chiếm 60–70% giá thành sản phẩm chăn nuôi.","c) Vật nuôi mang thai cần thêm dinh dưỡng ngoài nhu cầu duy trì.","d) Thức ăn không ảnh hưởng đến năng suất vật nuôi."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: đó là nhu cầu sản xuất (nuôi thai). d) Sai: thức ăn quyết định trực tiếp tốc độ lớn và năng suất.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Gà đẻ trứng cần nhiều canxi để tạo vỏ trứng.","b) Bò sữa đang cho sữa cần nhiều protein và năng lượng hơn bò nghỉ.","c) Nhu cầu duy trì là lượng dinh dưỡng tối thiểu để vật nuôi tồn tại.","d) Mọi vật nuôi ở mọi lứa tuổi đều có nhu cầu dinh dưỡng như nhau."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: nhu cầu khác nhau theo loài, lứa tuổi, mục đích nuôi.","points":1},{"type":"short","level":"VD","q":"Chi phí thức ăn chiếm khoảng bao nhiêu phần trăm giá thành sản phẩm chăn nuôi? (chỉ ghi số)","answer":"65","explain":"Chi phí thức ăn chiếm khoảng 60–70% giá thành sản phẩm chăn nuôi (lấy giá trị giữa khoảng là 65%).","points":0.5},{"type":"short","level":"VDC","q":"Vì sao không nên cắt giảm khẩu phần ăn khi giá thức ăn tăng cao? (trả lời ngắn gọn)","answer":"vì vật nuôi thiếu dinh dưỡng sẽ chậm lớn năng suất giảm thiệt hại lớn hơn","explain":"Cắt giảm khẩu phần làm vật nuôi thiếu dinh dưỡng → chậm lớn, đẻ ít, dễ bệnh; thời gian nuôi kéo dài, tổng chi phí còn tăng cao hơn — thiệt hại lớn hơn nhiều so với tiền thức ăn tiết kiệm được.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Thức ăn nào sau đây thuộc nhóm thức ăn thô?","options":["A. Cỏ, rơm.","B. Ngô, cám gạo.","C. Bột cá.","D. Bột xương."],"answer":"A","explain":"Thức ăn thô nhiều xơ, ít dinh dưỡng: cỏ, rơm, thân cây ngô — chủ yếu cho gia súc nhai lại (trâu, bò).","points":0.25},{"type":"mcq","level":"NB","q":"Ngô, cám gạo, sắn thuộc nhóm thức ăn nào?","options":["A. Thức ăn tinh.","B. Thức ăn thô.","C. Thức ăn khoáng.","D. Thức ăn giàu vitamin."],"answer":"A","explain":"Thức ăn tinh giàu tinh bột (năng lượng), ít xơ: ngô, cám gạo, sắn, khoai.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao thức ăn thô chủ yếu dùng cho trâu, bò mà ít dùng cho lợn, gà?","options":["A. Vì trâu bò thích ăn cỏ hơn.","B. Vì trâu, bò là động vật nhai lại, có hệ vi sinh vật dạ cỏ tiêu hóa được nhiều xơ; lợn, gà tiêu hóa xơ kém.","C. Vì cỏ rẻ hơn cám.","D. Vì lợn gà không ăn được cỏ."],"answer":"B","explain":"Trâu, bò nhai lại có dạ cỏ với hệ vi sinh vật phân giải xơ hiệu quả. Lợn, gà (dạ dày đơn) tiêu hóa xơ rất kém nên cần thức ăn tinh, giàu đạm.","points":0.25},{"type":"mcq","level":"TH","q":"Bột cá, khô dầu đậu tương thuộc nhóm thức ăn nào và có vai trò gì?","options":["A. Thức ăn giàu đạm, cung cấp protein cho vật nuôi lớn nhanh.","B. Thức ăn thô, cung cấp chất xơ.","C. Thức ăn khoáng, cung cấp canxi.","D. Thức ăn tinh, cung cấp năng lượng."],"answer":"A","explain":"Bột cá, khô dầu đậu tương, giun quế giàu protein — là nguyên liệu đạm quan trọng giúp vật nuôi lớn nhanh, đẻ nhiều.","points":0.25},{"type":"mcq","level":"VD","q":"Bác Tư nuôi bò thịt, có nhiều rơm rạ sau vụ gặt. Cách tận dụng rơm hiệu quả nhất là gì?","options":["A. Đốt bỏ rơm ngoài đồng.","B. Ủ rơm với urê hoặc cho bò ăn kết hợp bổ sung thức ăn tinh, đạm.","C. Để rơm mục ngoài vườn.","D. Bán rơm với giá rẻ."],"answer":"B","explain":"Rơm nghèo dinh dưỡng, khó tiêu. Ủ với urê (hoặc vôi) làm mềm, tăng đạm; cho ăn kết hợp thức ăn tinh giúp bò tận dụng được nguồn phụ phẩm rẻ tiền này.","points":0.25},{"type":"mcq","level":"VDC","q":"Một hộ nuôi lợn có sẵn cám gạo, sắn lát, rau muống và bột cá. Muốn phối khẩu phần đủ dinh dưỡng mà rẻ tiền, nguyên tắc quan trọng nhất là gì?","options":["A. Trộn tất cả với tỉ lệ bằng nhau.","B. Phối theo nhu cầu (tiêu chuẩn ăn) của lợn từng giai đoạn: đủ năng lượng (cám, sắn), đủ đạm (bột cá), thêm rau xanh và khoáng.","C. Chỉ cho ăn rau muống.","D. Chỉ cho ăn bột cá."],"answer":"B","explain":"Phối khẩu phần phải dựa vào tiêu chuẩn ăn của từng giai đoạn: năng lượng từ cám/sắn, đạm từ bột cá, xơ-vitamin từ rau, khoáng bổ sung — cân đối mới vừa đủ dinh dưỡng vừa rẻ.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cỏ, rơm là thức ăn thô.","b) Ngô, cám gạo là thức ăn tinh giàu năng lượng.","c) Bột cá là thức ăn giàu đạm.","d) Bột xương, muối ăn là thức ăn khoáng."],"answer":["T","T","T","T"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Đúng: cung cấp khoáng đa, vi lượng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trâu, bò tiêu hóa thức ăn thô tốt nhờ hệ vi sinh vật dạ cỏ.","b) Lợn, gà cần thức ăn tinh và giàu đạm vì tiêu hóa xơ kém.","c) Ủ rơm với urê giúp tăng giá trị dinh dưỡng của rơm.","d) Cho lợn ăn toàn rơm là đủ dinh dưỡng."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: rơm nghèo dinh dưỡng, lợn không tiêu hóa được nhiều xơ.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 loại thức ăn tinh phổ biến.","answer":"ngô, cám gạo","explain":"Các loại thức ăn tinh phổ biến: ngô, cám gạo, sắn, khoai — giàu tinh bột, cung cấp năng lượng chính cho vật nuôi.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao khi phối khẩu phần phải dựa vào tiêu chuẩn ăn của từng giai đoạn?","answer":"vì thừa dinh dưỡng gây lãng phí còn thiếu làm vật nuôi chậm lớn","explain":"Phối đúng tiêu chuẩn: thừa đạm, năng lượng gây lãng phí tiền và ô nhiễm (thải ra môi trường); thiếu thì vật nuôi chậm lớn, đẻ ít. Đúng tiêu chuẩn mới tối ưu chi phí và năng suất.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Tiêu chuẩn ăn là gì?","options":["A. Lượng chất dinh dưỡng vật nuôi cần trong một ngày đêm.","B. Lượng thức ăn cụ thể cho vật nuôi ăn trong ngày.","C. Giá tiền thức ăn trong ngày.","D. Số bữa ăn trong ngày."],"answer":"A","explain":"Tiêu chuẩn ăn là lượng chất dinh dưỡng (năng lượng, protein, khoáng, vitamin…) mà vật nuôi cần trong một ngày đêm, tính theo loài, lứa tuổi, mục đích nuôi.","points":0.25},{"type":"mcq","level":"NB","q":"Khẩu phần ăn là gì?","options":["A. Lượng thức ăn cụ thể phối hợp trong ngày để đáp ứng tiêu chuẩn ăn.","B. Thực đơn của người chăn nuôi.","C. Giá bán thức ăn.","D. Kho chứa thức ăn."],"answer":"A","explain":"Khẩu phần ăn là lượng thức ăn cụ thể (bao nhiêu kg cỏ, bao nhiêu kg cám…) cho ăn trong một ngày đêm, được phối hợp để đáp ứng tiêu chuẩn ăn.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác nhau cơ bản giữa tiêu chuẩn ăn và khẩu phần ăn là gì?","options":["A. Không có gì khác nhau.","B. Tiêu chuẩn ăn là nhu cầu dinh dưỡng (cái cần); khẩu phần ăn là thức ăn cụ thể cho ăn (cách đáp ứng).","C. Tiêu chuẩn ăn đắt hơn khẩu phần ăn.","D. Khẩu phần ăn chỉ dùng cho gà."],"answer":"B","explain":"Tiêu chuẩn ăn trả lời câu hỏi vật nuôi CẦN gì (bao nhiêu đạm, năng lượng…); khẩu phần ăn trả lời CHO ĂN gì, bao nhiêu (kg cám, kg cỏ…) để đáp ứng nhu cầu đó.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải nghiền nhỏ hạt ngô, sắn trước khi cho lợn, gà ăn?","options":["A. Để thức ăn đẹp mắt hơn.","B. Để vật nuôi dễ nhai, dễ tiêu hóa và trộn đều với các loại thức ăn khác.","C. Để tăng trọng lượng thức ăn.","D. Để thức ăn lâu hỏng."],"answer":"B","explain":"Hạt nguyên lợn, gà khó nhai, tiêu hóa kém, dễ lựa ăn. Nghiền nhỏ tăng diện tích tiếp xúc với men tiêu hóa, dễ trộn đều thành hỗn hợp đồng nhất.","points":0.25},{"type":"mcq","level":"VD","q":"Vào mùa khô khan hiếm cỏ tươi, hộ nuôi bò nên dự trữ thức ăn bằng cách nào?","options":["A. Ủ chua cỏ, thân cây ngô từ mùa mưa để dùng dần.","B. Đợi đến mùa khô mới đi cắt cỏ.","C. Cho bò nhịn ăn qua mùa khô.","D. Bán hết bò trước mùa khô."],"answer":"A","explain":"Ủ chua (yếm khí với muối, chế phẩm vi sinh) bảo quản được cỏ, thân ngô lâu dài, dùng dần trong mùa khô — giải pháp chủ động nguồn thức ăn thô quanh năm.","points":0.25},{"type":"mcq","level":"VDC","q":"Bột sắn nghèo protein được lên men bằng nấm men thành bột giàu protein. Cơ sở khoa học của việc này là gì?","options":["A. Nấm men tự biến thành sắn.","B. Vi sinh vật phát triển nhanh trong môi trường giàu tinh bột, sinh khối của chúng giàu protein, vitamin; vật nuôi ăn vào được bổ sung thêm nguồn đạm vi sinh vật.","C. Men làm sắn mất hết tinh bột.","D. Không có cơ sở khoa học."],"answer":"B","explain":"Trong môi trường giàu tinh bột, nấm men sinh sản rất nhanh; thành phần chủ yếu của vi sinh vật là protein cùng vitamin, axit amin. Vật nuôi ăn thức ăn lên men được cộng thêm nguồn đạm vi sinh vật quý giá.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tiêu chuẩn ăn là lượng dinh dưỡng vật nuôi cần trong một ngày đêm.","b) Khẩu phần ăn là lượng thức ăn cụ thể cho ăn trong ngày.","c) Nghiền nhỏ giúp vật nuôi dễ tiêu hóa thức ăn.","d) Ủ chua giúp bảo quản thức ăn thô dùng dần trong mùa khô."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng theo nội dung bài học.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lên men vi sinh làm tăng hàm lượng protein của thức ăn nghèo đạm.","b) Ép viên giúp vật nuôi không lựa ăn và giảm hao hụt.","c) Nấu chín cám giúp dễ tiêu hóa và diệt mầm bệnh.","d) Thức ăn đã mốc vẫn dùng được nếu phơi khô."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: thức ăn mốc chứa độc tố nấm mốc gây bệnh, tuyệt đối không dùng.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 phương pháp chế biến thức ăn chăn nuôi.","answer":"nghiền nhỏ, ủ chua","explain":"Các phương pháp chế biến: nghiền nhỏ, ủ chua, lên men vi sinh, ép viên, nấu chín.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao thức ăn bị mốc tuyệt đối không được cho vật nuôi ăn?","answer":"vì chứa độc tố nấm mốc gây bệnh và giảm năng suất","explain":"Thức ăn mốc chứa độc tố nấm mốc (aflatoxin…) gây ngộ độc, tổn thương gan, giảm sức đề kháng, giảm năng suất, thậm chí gây chết vật nuôi.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Thức ăn hỗn hợp hoàn chỉnh có đặc điểm gì?","options":["A. Chỉ gồm một loại nguyên liệu.","B. Phối trộn nhiều loại nguyên liệu theo công thức, đầy đủ dinh dưỡng, tiện sử dụng.","C. Chỉ dùng cho trâu bò.","D. Không có chất dinh dưỡng."],"answer":"B","explain":"Thức ăn hỗn hợp (cám hỗn hợp) phối nhiều nguyên liệu (tinh, đạm, khoáng, vitamin) theo công thức, đảm bảo đầy đủ, cân đối dinh dưỡng, tiện bảo quản và cho ăn.","points":0.25},{"type":"mcq","level":"NB","q":"Bảo quản thức ăn chăn nuôi đúng cách là như thế nào?","options":["A. Để nơi khô ráo, thoáng mát, kê cao, chống ẩm mốc, chuột bọ.","B. Để trực tiếp trên nền đất ẩm.","C. Để ngoài trời mưa nắng.","D. Trộn với rác thải."],"answer":"A","explain":"Thức ăn phải để nơi khô ráo, thoáng mát, kê cao khỏi mặt đất, bao bì kín, chống chuột, côn trùng để tránh ẩm mốc, hư hỏng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao thức ăn hỗn hợp công nghiệp ngày càng được dùng phổ biến trong chăn nuôi trang trại?","options":["A. Vì rẻ hơn mọi loại thức ăn tự phối.","B. Vì đầy đủ, cân đối dinh dưỡng, chất lượng ổn định, tiện lợi, giúp vật nuôi phát huy tối đa tiềm năng.","C. Vì không cần bảo quản.","D. Vì vật nuôi thích ăn hơn cỏ."],"answer":"B","explain":"Cám công nghiệp được phối theo công thức khoa học, đầy đủ dinh dưỡng, chất lượng ổn định từng lô, tiện sử dụng — phù hợp chăn nuôi quy mô lớn đòi hỏi năng suất cao, đồng đều.","points":0.25},{"type":"mcq","level":"TH","q":"Ép viên thức ăn có lợi ích gì?","options":["A. Làm thức ăn nặng hơn để bán được giá.","B. Tiện bảo quản, vận chuyển; vật nuôi không lựa ăn, giảm rơi vãi, hao hụt.","C. Làm thức ăn mất chất dinh dưỡng.","D. Không có lợi ích gì."],"answer":"B","explain":"Thức ăn viên gọn, dễ bảo quản, vận chuyển; vật nuôi ăn hết cả viên nên không lựa ăn (tránh thiếu chất), giảm rơi vãi — tiết kiệm đáng kể.","points":0.25},{"type":"mcq","level":"VD","q":"Kho cám của trang trại bị dột, một số bao cám vón cục, có mùi mốc. Xử lí đúng là gì?","options":["A. Phơi khô rồi cho vật nuôi ăn tiếp.","B. Trộn với cám mới cho ăn.","C. Loại bỏ, không cho vật nuôi ăn; sửa kho, kê cao, chống ẩm.","D. Cho vật nuôi ăn ít đi."],"answer":"C","explain":"Cám mốc chứa độc tố nấm mốc nguy hiểm, phơi khô không loại được độc tố. Phải loại bỏ, đồng thời khắc phục kho (chống dột, kê cao, thoáng) để không tái diễn.","points":0.25},{"type":"mcq","level":"VDC","q":"Một hộ nuôi 200 gà đẻ đang dùng cám công nghiệp (đắt) trong khi có sẵn ngô, cám gạo, bột cá, rau. Phương án nào cân bằng giữa chi phí và năng suất?","options":["A. Ngừng dùng cám công nghiệp, tự phối theo công thức (có thể nhờ khuyến nông tư vấn) từ nguyên liệu sẵn có.","B. Cho gà ăn toàn rau.","C. Giảm một nửa lượng cám công nghiệp mà không bổ sung gì.","D. Bán hết gà."],"answer":"A","explain":"Tự phối từ nguyên liệu sẵn có theo công thức cân đối (đủ năng lượng, đạm, khoáng, vitamin) giúp giảm đáng kể chi phí mà vẫn đảm bảo năng suất — cần tư vấn kĩ thuật để phối đúng.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thức ăn hỗn hợp đầy đủ dinh dưỡng và tiện sử dụng.","b) Thức ăn phải bảo quản nơi khô ráo, thoáng mát.","c) Cám mốc có thể cho vật nuôi ăn sau khi phơi khô.","d) Ép viên giúp giảm hao hụt thức ăn."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: độc tố nấm mốc không mất đi khi phơi khô. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cám công nghiệp có chất lượng dinh dưỡng ổn định.","b) Tự phối thức ăn từ nguyên liệu sẵn có giúp giảm chi phí.","c) Khi tự phối cần đảm bảo cân đối dinh dưỡng theo công thức.","d) Cho ăn thức ăn mốc với lượng ít thì không sao."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: nên nhờ khuyến nông tư vấn công thức. d) Sai: dù ít, độc tố nấm mốc vẫn gây hại tích lũy.","points":1},{"type":"short","level":"VD","q":"Nêu 2 yêu cầu khi bảo quản thức ăn chăn nuôi.","answer":"khô ráo thoáng mát, chống ẩm mốc chuột bọ","explain":"Bảo quản thức ăn: nơi khô ráo, thoáng mát, kê cao khỏi mặt đất; bao bì kín, chống ẩm mốc, chuột, côn trùng; không dùng thức ăn đã mốc.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao tự phối thức ăn cần tuân thủ công thức cân đối dinh dưỡng?","answer":"vì thiếu hoặc thừa chất đều gây lãng phí và giảm năng suất","explain":"Tự phối tùy tiện dễ thiếu đạm, khoáng (vật nuôi chậm lớn) hoặc thừa năng lượng (lãng phí, béo phì). Tuân thủ công thức đảm bảo vừa đủ, cân đối — tối ưu chi phí và năng suất.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Rau xanh trong khẩu phần vật nuôi cung cấp chủ yếu chất gì?","options":["A. Vitamin.","B. Tinh bột.","C. Chất xơ thô.","D. Protein động vật."],"answer":"A","explain":"Rau xanh là nguồn vitamin tự nhiên (A, C, nhóm B…) và cung cấp thêm chất xơ, nước cho vật nuôi.","points":0.25},{"type":"mcq","level":"NB","q":"Đá liếm cho trâu, bò cung cấp chất gì?","options":["A. Khoáng chất.","B. Tinh bột.","C. Protein.","D. Vitamin C."],"answer":"A","explain":"Đá liếm là khối khoáng (muối ăn + khoáng đa, vi lượng) cho trâu bò liếm bổ sung, phòng thiếu khoáng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao gà đẻ cần được bổ sung bột vỏ sò?","options":["A. Để gà có màu lông đẹp.","B. Vì vỏ sò giàu canxi, giúp tạo vỏ trứng cứng, giảm trứng mỏng vỏ, dập vỡ.","C. Để gà ăn ngon miệng hơn.","D. Để thay thế hoàn toàn cám."],"answer":"B","explain":"Mỗi quả trứng cần lượng lớn canxi tạo vỏ. Bột vỏ sò (canxi cacbonat) là nguồn canxi rẻ, hiệu quả cho gà đẻ.","points":0.25},{"type":"mcq","level":"TH","q":"Ủ chua thức ăn cần điều kiện nào?","options":["A. Môi trường yếm khí (kín), có muối và chế phẩm vi sinh.","B. Phơi ngoài nắng to.","C. Để ngoài trời mưa.","D. Trộn với đất."],"answer":"A","explain":"Ủ chua: nguyên liệu (cỏ, thân ngô) cắt nhỏ, trộn muối/chế phẩm vi sinh, nén chặt, đậy kín tạo môi trường yếm khí để vi khuẩn lactic lên men, bảo quản lâu dài.","points":0.25},{"type":"mcq","level":"VD","q":"Đàn lợn con sau cai sữa hay bị tiêu chảy. Ngoài thuốc thú y, về thức ăn cần lưu ý gì?","options":["A. Cho ăn thức ăn dễ tiêu, đủ ấm, chia nhiều bữa nhỏ; đảm bảo vệ sinh thức ăn, nước uống.","B. Cho nhịn ăn 3 ngày.","C. Cho ăn thật nhiều một lúc.","D. Cho ăn thức ăn mốc."],"answer":"A","explain":"Lợn con cai sữa hệ tiêu hóa yếu, dễ stress. Cho ăn thức ăn dễ tiêu, chia nhiều bữa nhỏ, giữ ấm và vệ sinh giúp giảm tiêu chảy, lợn nhanh hồi phục.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trang trại bò sữa nhập khẩu giống tốt nhưng năng suất sữa vẫn thấp. Kiểm tra thấy khẩu phần thiếu protein và khoáng. Bài học rút ra là gì?","options":["A. Giống tốt tự cho nhiều sữa, không cần quan tâm thức ăn.","B. Giống chỉ là tiềm năng; phải đáp ứng đúng tiêu chuẩn ăn (đủ đạm, năng lượng, khoáng) thì tiềm năng mới biểu hiện thành năng suất.","C. Nên thay giống khác.","D. Nên giảm khẩu phần ăn."],"answer":"B","explain":"Năng suất = di truyền × ngoại cảnh. Giống tốt mà khẩu phần thiếu đạm, khoáng thì không đủ nguyên liệu tạo sữa — minh chứng thức ăn quyết định việc phát huy tiềm năng giống.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Rau xanh cung cấp vitamin cho vật nuôi.","b) Đá liếm cung cấp khoáng chất cho trâu, bò.","c) Gà đẻ cần bổ sung canxi để tạo vỏ trứng.","d) Ủ chua cần môi trường yếm khí."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lợn con cai sữa nên cho ăn nhiều bữa nhỏ, thức ăn dễ tiêu.","b) Khẩu phần thiếu protein làm giảm năng suất sữa của bò.","c) Giống tốt vẫn cần thức ăn đầy đủ mới phát huy năng suất.","d) Thức ăn mốc gây ngộ độc cho vật nuôi."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Bột vỏ sò cung cấp chất khoáng nào chủ yếu cho gà đẻ?","answer":"canxi","explain":"Bột vỏ sò giàu canxi (dạng canxi cacbonat), giúp gà đẻ tạo vỏ trứng cứng, giảm tỉ lệ trứng mỏng vỏ.","points":0.5},{"type":"short","level":"VDC","q":"Nêu mối quan hệ giữa giống và thức ăn trong việc tạo ra năng suất vật nuôi.","answer":"giống quyết định tiềm năng còn thức ăn quyết định mức độ phát huy tiềm năng đó","explain":"Giống tốt tạo tiềm năng di truyền cao; thức ăn (cùng chăm sóc, chuồng trại) đầy đủ, đúng tiêu chuẩn giúp tiềm năng đó biểu hiện thành năng suất thực tế. Thiếu một trong hai, năng suất đều thấp.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Nấu chín cám, rau cho lợn ăn có tác dụng gì?","options":["A. Dễ tiêu hóa, diệt mầm bệnh.","B. Làm thức ăn mất chất.","C. Tốn công vô ích.","D. Làm lợn biếng ăn."],"answer":"A","explain":"Nấu chín làm mềm thức ăn, dễ tiêu hóa, đồng thời diệt vi sinh vật gây bệnh — cách chế biến truyền thống vẫn còn giá trị.","points":0.25},{"type":"mcq","level":"NB","q":"Giun quế trong chăn nuôi được dùng làm gì?","options":["A. Thức ăn giàu đạm cho vật nuôi.","B. Thuốc trừ sâu.","C. Phân bón duy nhất.","D. Vật liệu xây chuồng."],"answer":"A","explain":"Giun quế giàu protein (60–70% vật chất khô), là nguồn đạm động vật quý, rẻ tiền cho gà, vịt, lợn, cá.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nên phối hợp nhiều loại thức ăn thay vì chỉ cho ăn một loại?","options":["A. Vì một loại thức ăn không thể cung cấp đầy đủ, cân đối mọi chất dinh dưỡng.","B. Vì vật nuôi thích ăn nhiều món.","C. Vì thức ăn đơn lẻ luôn độc hại.","D. Vì phối nhiều loại thì rẻ hơn."],"answer":"A","explain":"Mỗi loại thức ăn mạnh một mặt: ngô giàu năng lượng nhưng nghèo đạm; bột cá giàu đạm nhưng đắt. Phối hợp nhiều loại mới cân đối dinh dưỡng và hợp lí về giá.","points":0.25},{"type":"mcq","level":"TH","q":"Dấu hiệu nào cho thấy khẩu phần ăn của đàn gà thịt chưa hợp lí?","options":["A. Gà lớn nhanh, lông mượt.","B. Gà chậm lớn không đều, nhiều con còi cọc, lông xù.","C. Gà đẻ nhiều trứng.","D. Gà ăn khỏe."],"answer":"B","explain":"Chậm lớn, không đều, còi cọc, lông xù là dấu hiệu thiếu dinh dưỡng hoặc mất cân đối khẩu phần (thiếu đạm, vitamin, khoáng) — cần xem lại công thức phối trộn.","points":0.25},{"type":"mcq","level":"VD","q":"Hộ chị Lan nuôi 30 lợn thịt bằng cám nấu truyền thống, tốn nhiều công. Muốn giảm công lao động mà lợn vẫn lớn tốt, chị nên làm gì?","options":["A. Chuyển sang dùng cám hỗn hợp (tự phối hoặc mua) cho ăn khô, uống nước tự do.","B. Ngừng nấu, cho ăn cám sống nguyên hạt.","C. Giảm số bữa ăn xuống 1 bữa/ngày.","D. Bán hết lợn."],"answer":"A","explain":"Cho ăn cám khô (hỗn hợp viên hoặc bột) + nước uống tự do vừa đủ dinh dưỡng vừa giảm hẳn công nấu nướng, là hướng hiện đại hóa chăn nuôi nông hộ.","points":0.25},{"type":"mcq","level":"VDC","q":"So sánh hai hộ nuôi lợn thịt: hộ A dùng cám công nghiệp đúng hướng dẫn; hộ B tự phối từ phụ phẩm nhưng không theo công thức, lúc thừa lúc thiếu. Kết quả có thể dự đoán là gì?","options":["A. Hộ B luôn lãi hơn.","B. Hộ A: lợn lớn nhanh, đều, ít bệnh; hộ B: lợn lớn chậm, không đều, dễ bệnh do mất cân đối dinh dưỡng.","C. Hai hộ như nhau.","D. Hộ A lỗ vì cám đắt."],"answer":"B","explain":"Cám công nghiệp cân đối dinh dưỡng, chất lượng ổn định → lợn phát huy tiềm năng. Tự phối tùy tiện gây thiếu/thừa chất → chậm lớn, đề kháng kém. Dù cám đắt hơn, hiệu quả tổng thể của hộ A thường tốt hơn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nấu chín giúp thức ăn dễ tiêu hóa và diệt mầm bệnh.","b) Giun quế là nguồn thức ăn giàu đạm.","c) Nên phối hợp nhiều loại thức ăn để cân đối dinh dưỡng.","d) Gà chậm lớn, lông xù có thể do khẩu phần thiếu dinh dưỡng."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cho lợn ăn cám khô + nước tự do giúp giảm công nấu nướng.","b) Cám công nghiệp có dinh dưỡng cân đối, ổn định.","c) Tự phối thức ăn tùy tiện dễ gây mất cân đối dinh dưỡng.","d) Thức ăn đầy đủ giúp vật nuôi ít bệnh hơn."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 nguồn thức ăn giàu đạm động vật.","answer":"bột cá, giun quế","explain":"Các nguồn đạm động vật: bột cá, giun quế, bột thịt xương… giàu protein và axit amin thiết yếu.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao hộ tự phối thức ăn nên nhờ cán bộ khuyến nông tư vấn công thức?","answer":"vì phối sai công thức gây mất cân đối dinh dưỡng làm giảm năng suất","explain":"Cán bộ khuyến nông giúp tính toán công thức cân đối theo tiêu chuẩn ăn từng giai đoạn từ nguyên liệu sẵn có — tránh thiếu/thừa chất, vừa tiết kiệm vừa đảm bảo năng suất.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Premix trong thức ăn chăn nuôi là gì?","options":["A. Hỗn hợp vitamin, khoáng, axit amin bổ sung vào khẩu phần.","B. Một loại cỏ.","C. Một giống lợn.","D. Thuốc kháng sinh."],"answer":"A","explain":"Premix là hỗn hợp đậm đặc gồm vitamin, khoáng vi lượng, axit amin… trộn với tỉ lệ nhỏ vào thức ăn để bổ sung những chất dễ thiếu.","points":0.25},{"type":"mcq","level":"NB","q":"Thức ăn cho cá thường được chế biến dạng nào?","options":["A. Dạng viên nổi hoặc chìm.","B. Dạng bột khô.","C. Dạng cỏ tươi.","D. Dạng rơm khô."],"answer":"A","explain":"Thức ăn thủy sản thường ép viên nổi/chìm phù hợp tập tính ăn của từng loài cá, giảm thất thoát, dễ quan sát lượng ăn.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao không nên thay đổi đột ngột loại thức ăn cho vật nuôi?","options":["A. Vì thức ăn mới luôn độc.","B. Vì hệ tiêu hóa cần thời gian thích nghi; đổi đột ngột dễ gây rối loạn tiêu hóa, tiêu chảy, bỏ ăn.","C. Vì vật nuôi không thích thức ăn mới.","D. Vì thức ăn mới đắt hơn."],"answer":"B","explain":"Men tiêu hóa và hệ vi sinh đường ruột đã quen với thức ăn cũ. Đổi đột ngột gây rối loạn tiêu hóa. Phải chuyển dần trong 5–7 ngày (trộn tăng dần thức ăn mới).","points":0.25},{"type":"mcq","level":"TH","q":"Nước uống có vai trò gì đối với vật nuôi?","options":["A. Không có vai trò gì.","B. Tham gia mọi quá trình sống: tiêu hóa, hấp thu, bài tiết, điều hòa thân nhiệt; thiếu nước vật nuôi bỏ ăn, chậm lớn.","C. Chỉ để tắm.","D. Chỉ để rửa chuồng."],"answer":"B","explain":"Nước chiếm 60–70% cơ thể, tham gia mọi hoạt động sống. Vật nuôi phải được uống đủ nước sạch thường xuyên; thiếu nước ảnh hưởng ngay đến ăn uống và năng suất.","points":0.25},{"type":"mcq","level":"VD","q":"Trang trại mới nhập đàn lợn con về, chủ trại nên cho ăn như thế nào trong tuần đầu?","options":["A. Đổi ngay sang cám của trại với lượng thật nhiều.","B. Giữ thức ăn cũ vài ngày rồi chuyển dần sang thức ăn mới, chia nhiều bữa nhỏ.","C. Cho nhịn ăn 1 tuần.","D. Cho ăn thức ăn mốc cho quen."],"answer":"B","explain":"Lợn con mới về bị stress vận chuyển. Giữ thức ăn cũ rồi chuyển dần 5–7 ngày, chia nhiều bữa nhỏ giúp hệ tiêu hóa thích nghi, giảm tiêu chảy.","points":0.25},{"type":"mcq","level":"VDC","q":"Một cơ sở sản xuất thức ăn muốn cạnh tranh với cám ngoại nhập. Yếu tố quyết định nhất là gì?","options":["A. Bao bì thật đẹp.","B. Chất lượng ổn định, đúng công bố dinh dưỡng, giá hợp lí và dịch vụ kĩ thuật tốt cho người chăn nuôi.","C. Quảng cáo nhiều nhất.","D. Bán chịu không giới hạn."],"answer":"B","explain":"Người chăn nuôi chọn cám dựa trên hiệu quả thực tế: lợn, gà có lớn nhanh, đẻ tốt không; chất lượng có ổn định từng lô không; giá có hợp lí không. Uy tín chất lượng là yếu tố sống còn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Premix là hỗn hợp vitamin, khoáng bổ sung vào thức ăn.","b) Thức ăn cho cá thường ở dạng viên nổi hoặc chìm.","c) Vật nuôi cần được uống đủ nước sạch thường xuyên.","d) Có thể đổi đột ngột loại thức ăn mà không ảnh hưởng gì."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: phải chuyển dần trong 5–7 ngày.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đổi thức ăn đột ngột dễ gây rối loạn tiêu hóa.","b) Thiếu nước làm vật nuôi bỏ ăn, chậm lớn.","c) Chất lượng cám ổn định là yếu tố quan trọng khi chọn thức ăn.","d) Lợn con mới nhập về nên cho ăn ngay thật nhiều thức ăn mới."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cần chuyển dần, chia nhiều bữa nhỏ.","points":1},{"type":"short","level":"VD","q":"Khi đổi loại thức ăn mới cho vật nuôi, cần làm gì để tránh rối loạn tiêu hóa?","answer":"chuyển dần trong 5 đến 7 ngày","explain":"Trộn thức ăn mới tăng dần vào thức ăn cũ trong 5–7 ngày để hệ tiêu hóa và vi sinh đường ruột thích nghi dần, tránh tiêu chảy, bỏ ăn.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao uy tín chất lượng là yếu tố sống còn của cơ sở sản xuất thức ăn chăn nuôi?","answer":"vì người chăn nuôi chọn cám dựa trên hiệu quả thực tế và sự ổn định","explain":"Người chăn nuôi đánh giá cám qua thực tế: vật nuôi có lớn nhanh, khỏe mạnh không; chất lượng có ổn định từng lô không. Một lô cám kém chất lượng gây thiệt hại lớn sẽ làm mất khách hàng vĩnh viễn.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Khô dầu đậu tương là loại thức ăn nào?","options":["A. Thức ăn giàu đạm thực vật.","B. Thức ăn thô.","C. Thức ăn khoáng.","D. Nước uống."],"answer":"A","explain":"Khô dầu đậu tương (bã đậu sau ép dầu) giàu protein thực vật (40–48%), là nguyên liệu đạm quan trọng trong cám hỗn hợp.","points":0.25},{"type":"mcq","level":"NB","q":"Bột xương cung cấp chất gì cho vật nuôi?","options":["A. Canxi, photpho.","B. Tinh bột.","C. Chất xơ.","D. Nước."],"answer":"A","explain":"Bột xương giàu canxi và photpho — hai khoáng chất chính cấu tạo xương, rất cần cho vật nuôi non đang lớn và gà đẻ.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao khô dầu đậu tương được dùng nhiều trong cám hỗn hợp?","options":["A. Vì giàu protein thực vật, giá hợp lí, dễ phối trộn.","B. Vì không có chất dinh dưỡng.","C. Vì vật nuôi không thích ăn.","D. Vì chỉ để độn cho nặng."],"answer":"A","explain":"Khô dầu đậu tương có hàm lượng protein cao, thành phần axit amin tốt, giá hợp lí hơn đạm động vật nên là nguồn đạm thực vật chủ lực trong công nghiệp thức ăn.","points":0.25},{"type":"mcq","level":"TH","q":"Thiếu photpho, canxi, vật nuôi non sẽ bị gì?","options":["A. Còi xương, chậm lớn, xương yếu dễ gãy.","B. Lớn nhanh gấp đôi.","C. Không ảnh hưởng gì.","D. Đẻ nhiều trứng hơn."],"answer":"A","explain":"Canxi, photpho cấu tạo xương. Thiếu ở vật nuôi non gây còi xương: chân cong, xương mềm, chậm lớn — cần bổ sung bột xương, bột vỏ sò, premix khoáng.","points":0.25},{"type":"mcq","level":"VD","q":"Đàn bê con của ông Lâm chân cong, đi khập khiễng, chậm lớn. Ngoài bệnh, cần nghĩ đến nguyên nhân dinh dưỡng nào?","options":["A. Thừa năng lượng.","B. Thiếu canxi, photpho, vitamin D.","C. Thừa nước uống.","D. Thiếu không khí."],"answer":"B","explain":"Triệu chứng còi xương điển hình do thiếu canxi, photpho và vitamin D (giúp hấp thu canxi). Cần bổ sung bột xương, cho bê tắm nắng/vận động.","points":0.25},{"type":"mcq","level":"VDC","q":"Một nhà máy thức ăn muốn giảm giá thành cám mà vẫn giữ chất lượng. Hướng đi khả thi nhất là gì?","options":["A. Giảm hàm lượng dinh dưỡng công bố.","B. Nghiên cứu thay thế một phần nguyên liệu nhập khẩu đắt bằng nguyên liệu trong nước (sắn, cám gạo…) và tối ưu công thức bằng phần mềm.","C. Trộn thêm cát cho nặng.","D. Giảm công đoạn kiểm tra chất lượng."],"answer":"B","explain":"Dùng nguyên liệu nội địa rẻ (sắn thay một phần ngô nhập khẩu…) và tối ưu công thức bằng phần mềm giúp hạ giá thành mà vẫn đảm bảo dinh dưỡng công bố — hướng đi bền vững, hợp pháp.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Khô dầu đậu tương giàu protein thực vật.","b) Bột xương cung cấp canxi, photpho.","c) Thiếu canxi gây còi xương ở vật nuôi non.","d) Vitamin D giúp hấp thu canxi."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dùng nguyên liệu trong nước giúp hạ giá thành thức ăn.","b) Tối ưu công thức bằng phần mềm giúp cân đối dinh dưỡng và giá thành.","c) Giảm chất lượng để hạ giá là hướng đi bền vững.","d) Bê con cần tắm nắng để tổng hợp vitamin D."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: gian lận chất lượng mất uy tín, vi phạm pháp luật. d) Đúng.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 nguyên liệu thức ăn trong nước giúp hạ giá thành cám.","answer":"sắn, cám gạo","explain":"Sắn, cám gạo, tấm… là nguyên liệu năng lượng trong nước rẻ tiền, có thể thay thế một phần ngô nhập khẩu trong công thức cám.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao giảm hàm lượng dinh dưỡng so với công bố để hạ giá cám là không bền vững?","answer":"vì gian lận chất lượng làm mất uy tín và vi phạm pháp luật","explain":"Vật nuôi ăn cám kém chất lượng sẽ chậm lớn, người chăn nuôi phát hiện và tẩy chay; hành vi gian lận còn vi phạm quy định về chất lượng thức ăn chăn nuôi, bị xử phạt.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Nhóm chất dinh dưỡng nào cung cấp năng lượng chính cho vật nuôi?","options":["A. Tinh bột, chất béo (gluxit, lipit).","B. Nước.","C. Vitamin.","D. Chất xơ thô."],"answer":"A","explain":"Tinh bột (gluxit) và chất béo (lipit) là nguồn năng lượng chính; protein chủ yếu để tạo thịt, sữa, trứng; vitamin, khoáng với lượng nhỏ nhưng không thể thiếu.","points":0.25},{"type":"mcq","level":"NB","q":"Protein trong thức ăn có vai trò chính gì?","options":["A. Tạo nên cơ thịt, sữa, trứng và các sản phẩm của vật nuôi.","B. Chỉ để tạo nhiệt.","C. Không có vai trò gì.","D. Chỉ để vật nuôi uống."],"answer":"A","explain":"Protein là nguyên liệu xây dựng cơ thể: tạo cơ thịt, sữa, trứng, lông… Thiếu protein, vật nuôi chậm lớn dù đủ năng lượng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao khẩu phần chỉ toàn ngô (giàu năng lượng) mà thiếu đạm thì lợn vẫn chậm lớn?","options":["A. Vì ngô có độc.","B. Vì tạo cơ thịt cần protein; thiếu đạm thì dù đủ năng lượng, lợn vẫn không lớn được, dễ béo mỡ.","C. Vì lợn không ăn được ngô.","D. Vì ngô quá rẻ."],"answer":"B","explain":"Năng lượng chỉ cung cấp sức hoạt động; muốn tạo cơ thịt, sữa, trứng phải có protein (axit amin). Khẩu phần mất cân đối đạm – năng lượng làm vật nuôi chậm lớn, tích mỡ.","points":0.25},{"type":"mcq","level":"TH","q":"Vai trò của chất xơ trong khẩu phần trâu, bò là gì?","options":["A. Không có vai trò gì.","B. Kích thích nhu động ruột, là thức ăn cho vi sinh vật dạ cỏ, giúp tiêu hóa tốt.","C. Chỉ để độn cho no.","D. Gây bệnh cho trâu bò."],"answer":"B","explain":"Chất xơ cần thiết cho động vật nhai lại: kích thích nhai lại, nhu động ruột và là nguồn thức ăn cho hệ vi sinh vật dạ cỏ phân giải tạo năng lượng.","points":0.25},{"type":"mcq","level":"VD","q":"Đàn lợn thịt của anh Đức ăn khỏe nhưng chậm lớn, tích nhiều mỡ. Khẩu phần có thể đang mất cân đối như thế nào?","options":["A. Thừa năng lượng, thiếu protein.","B. Thừa protein, thiếu năng lượng.","C. Thừa nước.","D. Thừa vitamin."],"answer":"A","explain":"Thừa năng lượng (tinh bột) + thiếu đạm → cơ thể không tạo được cơ thịt, năng lượng dư chuyển thành mỡ dự trữ → lợn béo mỡ, chậm lớn, hiệu quả kém.","points":0.25},{"type":"mcq","level":"VDC","q":"Một chuyên gia dinh dưỡng nói: “Không có thức ăn xấu, chỉ có khẩu phần không hợp lí”. Ý nghĩa của câu nói này là gì?","options":["A. Mọi thức ăn đều tốt như nhau.","B. Mỗi loại thức ăn có ưu, nhược điểm riêng; quan trọng là phối hợp chúng thành khẩu phần cân đối, phù hợp từng đối tượng.","C. Không cần quan tâm đến thức ăn.","D. Chỉ nên dùng một loại thức ăn."],"answer":"B","explain":"Ngô, sắn, cám gạo, bột cá… mỗi loại mạnh một mặt, yếu một mặt. Nghệ thuật dinh dưỡng là phối hợp chúng thành khẩu phần cân đối theo tiêu chuẩn ăn — đó mới là yếu tố quyết định.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tinh bột và chất béo cung cấp năng lượng chính cho vật nuôi.","b) Protein là nguyên liệu tạo cơ thịt, sữa, trứng.","c) Chất xơ giúp tiêu hóa tốt ở trâu, bò.","d) Thiếu protein thì vật nuôi vẫn lớn nhanh bình thường."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: thiếu protein gây chậm lớn.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Khẩu phần thừa năng lượng, thiếu đạm làm lợn béo mỡ, chậm lớn.","b) Mỗi loại thức ăn có ưu, nhược điểm riêng nên cần phối hợp.","c) Khẩu phần hợp lí là khẩu phần cân đối theo tiêu chuẩn ăn.","d) Chỉ cần cho ăn no là đủ, không cần cân đối dinh dưỡng."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: no mà mất cân đối vẫn chậm lớn, lãng phí.","points":1},{"type":"short","level":"VD","q":"Nhóm chất nào trong thức ăn là nguyên liệu chính để tạo cơ thịt?","answer":"protein","explain":"Protein (chất đạm) cung cấp axit amin là nguyên liệu xây dựng cơ thịt, sữa, trứng của vật nuôi.","points":0.5},{"type":"short","level":"VDC","q":"Giải thích ngắn gọn vì sao khẩu phần thừa năng lượng, thiếu đạm làm lợn béo mỡ mà chậm lớn.","answer":"vì thiếu đạm không tạo được cơ thịt nên năng lượng dư chuyển thành mỡ","explain":"Tạo cơ thịt cần protein; khi thiếu đạm, cơ thể không tổng hợp được cơ dù đủ năng lượng, năng lượng dư thừa chuyển hóa thành mỡ dự trữ → lợn béo, chậm lớn.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Phụ gia thức ăn chăn nuôi có tác dụng gì?","options":["A. Kích thích tiêu hóa, tăng tính ngon miệng, phòng bệnh (men vi sinh, enzyme…).","B. Thay thế hoàn toàn thức ăn.","C. Làm thức ăn độc hơn.","D. Không có tác dụng gì."],"answer":"A","explain":"Phụ gia (men vi sinh, enzyme tiêu hóa, chất tạo mùi…) với lượng nhỏ giúp tăng tiêu hóa, ngon miệng, tăng sức đề kháng — nhưng phải dùng đúng loại, đúng liều cho phép.","points":0.25},{"type":"mcq","level":"NB","q":"Dấu hiệu của thức ăn bị hỏng, không dùng được là gì?","options":["A. Mốc, hôi, vón cục, đổi màu.","B. Còn hạn sử dụng.","C. Bao bì nguyên vẹn.","D. Mùi thơm tự nhiên."],"answer":"A","explain":"Thức ăn mốc, hôi, vón cục, đổi màu là đã hỏng, chứa độc tố nấm mốc — tuyệt đối không cho vật nuôi ăn.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải dùng phụ gia đúng loại, đúng liều lượng cho phép?","options":["A. Vì phụ gia đắt tiền.","B. Vì dùng sai loại, quá liều có thể gây ngộ độc, tồn dư trong sản phẩm, ảnh hưởng sức khỏe người tiêu dùng.","C. Vì phụ gia không có tác dụng.","D. Vì vật nuôi không thích phụ gia."],"answer":"B","explain":"Phụ gia, nhất là kháng sinh, nếu lạm dụng sẽ tồn dư trong thịt, trứng, sữa gây hại sức khỏe con người và tạo vi khuẩn kháng thuốc — phải tuân thủ nghiêm quy định.","points":0.25},{"type":"mcq","level":"TH","q":"Mối liên hệ giữa thức ăn và phòng bệnh cho vật nuôi là gì?","options":["A. Không liên quan.","B. Thức ăn đầy đủ, cân đối giúp vật nuôi khỏe, sức đề kháng cao, ít bệnh; thức ăn kém, mốc gây bệnh.","C. Thức ăn chỉ gây bệnh.","D. Phòng bệnh không cần quan tâm thức ăn."],"answer":"B","explain":"Dinh dưỡng tốt là nền tảng của sức đề kháng. Ngược lại, thức ăn thiếu chất, mốc, bẩn là nguồn gây bệnh trực tiếp — “phòng bệnh từ khẩu phần” là nguyên tắc quan trọng.","points":0.25},{"type":"mcq","level":"VD","q":"Một hộ dùng kháng sinh trộn vào thức ăn hằng ngày để “phòng bệnh” cho lợn. Đánh giá nào đúng?","options":["A. Làm đúng, nên tiếp tục.","B. Sai: lạm dụng kháng sinh gây tồn dư trong thịt, tạo vi khuẩn kháng thuốc; chỉ dùng khi có chỉ định thú y.","C. Nên tăng liều gấp đôi.","D. Kháng sinh không ảnh hưởng gì."],"answer":"B","explain":"Trộn kháng sinh thường xuyên vào thức ăn là lạm dụng: tồn dư trong sản phẩm gây hại người tiêu dùng, tạo chủng vi khuẩn kháng thuốc nguy hiểm. Chỉ dùng theo chỉ định của thú y.","points":0.25},{"type":"mcq","level":"VDC","q":"Xu hướng “sử dụng phụ phẩm nông nghiệp làm thức ăn chăn nuôi” có ý nghĩa gì?","options":["A. Chỉ để giảm rác thải.","B. Vừa giảm chi phí thức ăn, vừa giảm ô nhiễm môi trường, tạo vòng tuần hoàn trong nông nghiệp bền vững.","C. Làm giảm năng suất chăn nuôi.","D. Không có ý nghĩa kinh tế."],"answer":"B","explain":"Tận dụng rơm, cám, bã đậu, rau thừa… làm thức ăn giúp hạ giá thành (thức ăn chiếm 60–70% chi phí), giảm chất thải ra môi trường, khép kín vòng tuần hoàn nông nghiệp — lợi ích kép kinh tế và môi trường.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phụ gia giúp tăng tiêu hóa và sức đề kháng cho vật nuôi.","b) Thức ăn mốc, hôi, vón cục là đã hỏng, không dùng được.","c) Phải dùng phụ gia đúng loại, đúng liều cho phép.","d) Lạm dụng kháng sinh trong thức ăn không gây hại gì."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: gây tồn dư và kháng thuốc.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dinh dưỡng tốt giúp vật nuôi tăng sức đề kháng, ít bệnh.","b) Tận dụng phụ phẩm nông nghiệp giúp giảm chi phí thức ăn.","c) Kháng sinh chỉ dùng trong thức ăn khi có chỉ định thú y.","d) Thức ăn kém chất lượng không ảnh hưởng sức khỏe vật nuôi."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: thức ăn kém, mốc là nguồn gây bệnh.","points":1},{"type":"short","level":"VD","q":"Nêu 2 dấu hiệu nhận biết thức ăn chăn nuôi đã bị hỏng.","answer":"mốc, có mùi hôi","explain":"Thức ăn hỏng có dấu hiệu: mốc, mùi hôi, vón cục, đổi màu — tuyệt đối không cho vật nuôi ăn.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao lạm dụng kháng sinh trong thức ăn chăn nuôi gây nguy hiểm cho con người?","answer":"vì tồn dư kháng sinh trong thịt trứng sữa và tạo vi khuẩn kháng thuốc","explain":"Kháng sinh tồn dư trong sản phẩm chăn nuôi gây dị ứng, rối loạn sức khỏe người tiêu dùng; đồng thời tạo ra các chủng vi khuẩn kháng thuốc nguy hiểm, khó chữa bệnh.","points":0.5}]}]}
