{"type": "mcq", "level": "TH", "points": 0.25, "q": "Sữa đầu của mẹ có ý nghĩa gì với con non?", "options": ["A. Cung cấp dinh dưỡng và kháng thể giúp chống bệnh.", "B. Chỉ để no bụng.", "C. Không quan trọng.", "D. Làm con chậm lớn."], "answer": "A", "explain": "Sữa đầu giàu dinh dưỡng và kháng thể tự nhiên, tăng sức đề kháng cho con non."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một hộ nuôi bò sữa, mỗi ngày vắt sữa 2 lần nhưng không vệ sinh vú và dụng cụ. Nguy cơ nào xảy ra?", "options": ["A. Bò dễ bị viêm vú, sữa nhiễm khuẩn.", "B. Bò cho nhiều sữa hơn.", "C. Không sao cả.", "D. Sữa ngon hơn."], "answer": "A", "explain": "Vệ sinh kém khi vắt sữa dễ gây viêm vú và nhiễm khuẩn sữa, ảnh hưởng chất lượng."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một trang trại muốn giảm chi phí thức ăn (chiếm 60-70% giá thành). Giải pháp tổng hợp nào tốt nhất?", "options": ["A. Tận dụng phụ phẩm, tự phối trộn đúng công thức, giảm hao phí.", "B. Cắt giảm khẩu phần.", "C. Cho ăn một loại rẻ tiền.", "D. Để vật nuôi tự kiếm ăn."], "answer": "A", "explain": "Giảm chi phí phải đi đôi với đảm bảo dinh dưỡng: tận dụng phụ phẩm, phối trộn đúng, giảm hao phí."},

{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một tỉnh muốn phát triển chăn nuôi thành ngành hàng hóa chủ lực. Định hướng tổng thể nào phù hợp?", "options": ["A. Quy hoạch vùng chăn nuôi, đầu tư giống, thức ăn, thú y, chế biến và bảo vệ môi trường.", "B. Để nông dân tự phát.", "C. Chỉ tăng số lượng.", "D. Không cần quy hoạch."], "answer": "A", "explain": "Phát triển thành ngành hàng hóa cần quy hoạch tổng thể, đầu tư đồng bộ các khâu và bảo vệ môi trường."},

{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đông lạnh thịt ở nhiệt độ nào?", "options": ["A. Âm 18 độ C.", "B. 0 đến 4 độ C.", "C. 25 độ C.", "D. 37 độ C."], "answer": "A", "explain": "Thịt đông lạnh bảo quản ở âm 18 độ C, giữ được nhiều tháng."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao chăn nuôi công nghệ cao giúp nâng cao năng suất?", "options": ["A. Vì kiểm soát tốt môi trường, dinh dưỡng và sức khỏe đàn.", "B. Vì không cần con người.", "C. Vì không tốn chi phí.", "D. Vì tự động hoàn toàn."], "answer": "A", "explain": "Công nghệ cao kiểm soát tốt tiểu khí hậu, cho ăn chính xác, phát hiện sớm bệnh nên năng suất cao, ổn định."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Mô hình VAC thể hiện nguyên tắc nào?", "options": ["A. Tận dụng chất thải thành tài nguyên, kinh tế tuần hoàn.", "B. Xả thải ra môi trường.", "C. Đốt bỏ chất thải.", "D. Chôn lấp hết."], "answer": "A", "explain": "VAC (vườn, ao, chuồng) tận dụng chất thải làm phân bón, nuôi cá, tạo vòng tuần hoàn."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một hộ làm mô hình VAC nhưng xả phân lợn trực tiếp xuống ao quá nhiều, cá chết. Bài học là gì?", "options": ["A. Cần xử lí, điều tiết lượng chất thải hợp lí, tránh quá tải.", "B. Mô hình VAC không tốt.", "C. Không nên nuôi cá.", "D. Xả càng nhiều càng tốt."], "answer": "A", "explain": "Chất thải phải được xử lí và điều tiết hợp lí; quá tải gây ô nhiễm, cá chết."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một công ty đầu tư trang trại thông minh: cảm biến, cho ăn tự động, AI phát hiện bệnh. Đây là xu hướng nào?", "options": ["A. Chăn nuôi công nghệ cao, chuyển đổi số.", "B. Chăn nuôi truyền thống.", "C. Chăn nuôi quảng canh.", "D. Không phải xu hướng."], "answer": "A", "explain": "Ứng dụng cảm biến, tự động hóa, AI là xu hướng chăn nuôi công nghệ cao, chuyển đổi số."},
{"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xác định giới tính sớm giúp chọn đực, cái đúng mục đích.", "b) Thịt đông lạnh ở âm 18 độ C.", "c) Công nghệ cao kiểm soát tốt môi trường.", "d) VAC tận dụng chất thải thành tài nguyên."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng theo kiến thức đã học."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chất thải quá tải gây ô nhiễm ao.", "b) AI hỗ trợ phát hiện bệnh sớm.", "c) Chuyển đổi số là xu hướng chăn nuôi.", "d) VAC là mô hình gây ô nhiễm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: VAC đúng cách giúp giảm ô nhiễm."},
{"type": "short", "level": "VD", "points": 0.5, "q": "Mô hình kết hợp vườn, ao, chuồng viết tắt là gì?", "answer": "VAC", "explain": "VAC tận dụng chất thải chăn nuôi thành tài nguyên."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Ứng dụng cảm biến, AI trong chăn nuôi gọi là chăn nuôi gì? (3 từ: ... công nghệ cao)", "answer": "chăn nuôi công nghệ cao", "explain": "Chăn nuôi công nghệ cao là xu hướng tất yếu hiện nay."}
]},

{"type": "mcq", "level": "NB", "points": 0.25, "q": "Ba chỉ tiêu chọn giống vật nuôi gồm những gì?", "options": ["A. Ngoại hình, thể chất; sinh trưởng, phát dục; sức sản xuất.", "B. Màu lông, tiếng kêu, tính nết.", "C. Giá bán, thị trường, quảng cáo.", "D. Tuổi, cân nặng, chiều cao."], "answer": "A", "explain": "Ba chỉ tiêu: ngoại hình thể chất; khả năng sinh trưởng phát dục; sức sản xuất."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Khẩu phần ăn của vật nuôi là gì?", "options": ["A. Lượng thức ăn cung cấp trong một ngày đêm.", "B. Giá tiền thức ăn.", "C. Kho chứa thức ăn.", "D. Công thức thuốc."], "answer": "A", "explain": "Khẩu phần ăn là lượng thức ăn cho một con vật trong một ngày đêm, phải đủ và cân đối."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao giống tốt vẫn cần chăm sóc tốt?", "options": ["A. Vì tiềm năng di truyền chỉ phát huy khi điều kiện thuận lợi.", "B. Vì giống tốt không có gen tốt.", "C. Vì thức ăn thay đổi gen.", "D. Vì không cần thiết."], "answer": "A", "explain": "Năng suất do cả giống và môi trường quyết định; giống tốt mà chăm sóc kém thì không phát huy được."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao phải tuân thủ thời gian ngừng thuốc trước khi xuất bán?", "options": ["A. Vì tránh tồn dư thuốc trong sản phẩm gây hại người dùng.", "B. Vì để tốn thời gian.", "C. Vì không cần thiết.", "D. Vì thuốc đắt tiền."], "answer": "A", "explain": "Ngừng thuốc đủ thời gian giúp đào thải hết tồn dư, đảm bảo an toàn thực phẩm."},
{"type": "mcq", "level": "VD", "points": 0.25, "q": "Một hộ nuôi gà đẻ chỉ cho ăn thóc, gà đẻ ít, vỏ trứng mỏng. Nguyên nhân và cách khắc phục là gì?", "options": ["A. Thiếu protein, khoáng; cần bổ sung thức ăn giàu đạm và bột vỏ sò.", "B. Do giống xấu.", "C. Do thời tiết.", "D. Không khắc phục được."], "answer": "A", "explain": "Thóc thiếu protein và canxi nên đẻ ít, vỏ mỏng; cần bổ sung thức ăn giàu protein và chất khoáng."},
{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một hợp tác xã chăn nuôi muốn phát triển bền vững lâu dài. Yếu tố nào là nền tảng?", "options": ["A. Hài hòa hiệu quả kinh tế, bảo vệ môi trường và an toàn thực phẩm.", "B. Chỉ cần lợi nhuận.", "C. Chỉ cần số lượng.", "D. Chỉ cần giá rẻ."], "answer": "A", "explain": "Bền vững là hài hòa ba yếu tố: kinh tế, môi trường và an toàn thực phẩm."},
{"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Có 3 chỉ tiêu chọn giống cơ bản.", "b) Khẩu phần ăn tính trong một ngày đêm.", "c) Giống tốt cần chăm sóc tốt.", "d) Cần ngừng thuốc đủ thời gian trước khi bán."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng theo kiến thức đã học."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tiềm năng di truyền cần điều kiện tốt để phát huy.", "b) Tồn dư thuốc gây hại người dùng.", "c) Thiếu khoáng làm vỏ trứng mỏng.", "d) Bền vững cần hài hòa kinh tế và môi trường."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng theo kiến thức đã học."},
{"type": "short", "level": "VD", "points": 0.5, "q": "Gà đẻ vỏ trứng mỏng cần bổ sung chất khoáng nào? (1 từ: ...)", "answer": "canxi", "explain": "Canxi (bột vỏ sò, bột xương) giúp vỏ trứng dày, chắc."},
{"type": "short", "level": "VDC", "points": 0.5, "q": "Phát triển hài hòa kinh tế, môi trường và an toàn thực phẩm gọi là phát triển gì? (2 từ)", "answer": "bền vững", "explain": "Phát triển bền vững đáp ứng hiện tại mà không ảnh hưởng thế hệ tương lai."}
]},

{"type": "mcq", "level": "NB", "points": 0.25, "q": "Công nghệ gen trong chăn nuôi nhằm mục đích gì?", "options": ["A. Tạo giống mới có đặc tính vượt trội.", "B. Làm vật nuôi không cần ăn.", "C. Biến vật nuôi thành cây.", "D. Loại bỏ chọn giống."], "answer": "A", "explain": "Công nghệ gen chuyển gen mong muốn tạo giống mới vượt trội như tăng trưởng nhanh, kháng bệnh."},
{"type": "mcq", "level": "NB", "points": 0.25, "q": "Sữa chua được tạo ra nhờ quá trình nào?", "options": ["A. Lên men lactic.", "B. Đông lạnh.", "C. Hun khói.", "D. Ướp muối."], "answer": "A", "explain": "Vi khuẩn lactic lên men đường trong sữa tạo sữa chua thơm ngon, tốt cho tiêu hóa."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Mối quan hệ giữa các khâu kĩ thuật trong chăn nuôi là gì?", "options": ["A. Tác động tổng hợp, hỗ trợ lẫn nhau.", "B. Độc lập, không liên quan.", "C. Triệt tiêu lẫn nhau.", "D. Chỉ cần một khâu."], "answer": "A", "explain": "Giống, thức ăn, chăm sóc, thú y tác động tổng hợp; thiếu một khâu cũng giảm hiệu quả chung."},
{"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao cần bảo tồn các giống vật nuôi địa phương?", "options": ["A. Vì mang nguồn gen quý về thích nghi và chất lượng đặc trưng.", "B. Vì năng suất cao nhất.", "C. Vì không tốn chi phí.", "D. Vì pháp luật cấm giống ngoại."], "answer": "A", "explain": "Giống địa phương mang gen quý: thích nghi tốt, thịt thơm ngon; là nguồn gen cho lai tạo."},

{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Trong bối cảnh hội nhập, để sản phẩm chăn nuôi Việt Nam cạnh tranh được cần đáp ứng yêu cầu nào?", "options": ["A. An toàn thực phẩm, chất lượng ổn định, truy xuất nguồn gốc.", "B. Giá rẻ bằng mọi giá.", "C. Chỉ cần số lượng lớn.", "D. Không cần tiêu chuẩn."], "answer": "A", "explain": "Hội nhập đòi hỏi sản phẩm đạt chuẩn an toàn, chất lượng ổn định và truy xuất được nguồn gốc."},
{"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Công nghệ gen tạo giống mới vượt trội.", "b) Sữa chua nhờ lên men lactic.", "c) Các khâu kĩ thuật hỗ trợ lẫn nhau.", "d) Giống địa phương mang nguồn gen quý."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng theo kiến thức đã học."},
{"type": "truefalse", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thiếu một khâu kĩ thuật cũng giảm hiệu quả.", "b) Bảo tồn giống địa phương là cần thiết.", "c) Hội nhập đòi hỏi sản phẩm đạt chuẩn.", "d) Chỉ cần giá rẻ là cạnh tranh được."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần chất lượng và an toàn."},
