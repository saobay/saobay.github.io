<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Chăn nuôi là gì?","options":["A. Nuôi dưỡng, chăm sóc vật nuôi để thu sản phẩm phục vụ con người.","B. Nuôi thú cưng trong nhà để làm cảnh.","C. Săn bắt động vật hoang dã để lấy thịt.","D. Trồng cây thức ăn cho gia súc."],"answer":"A","explain":"Chăn nuôi là ngành sản xuất nuôi dưỡng, chăm sóc vật nuôi (gia súc, gia cầm…) nhằm thu các sản phẩm như thịt, trứng, sữa phục vụ con người.","points":0.25},{"type":"mcq","level":"NB","q":"Sản phẩm nào sau đây KHÔNG phải là sản phẩm của ngành chăn nuôi?","options":["A. Thịt lợn.","B. Trứng gà.","C. Sữa bò.","D. Gạo tẻ."],"answer":"D","explain":"Gạo tẻ là sản phẩm của trồng trọt. Thịt, trứng, sữa đều là sản phẩm chăn nuôi.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói chăn nuôi là mắt xích quan trọng trong nông nghiệp bền vững?","options":["A. Vì chăn nuôi không cần vốn đầu tư.","B. Vì chăn nuôi cung cấp phân bón cho trồng trọt, tận dụng phụ phẩm nông nghiệp làm thức ăn.","C. Vì chăn nuôi chỉ nuôi các loài động vật quý hiếm.","D. Vì chăn nuôi không gây ô nhiễm môi trường."],"answer":"B","explain":"Chăn nuôi liên kết chặt với trồng trọt: phụ phẩm trồng trọt làm thức ăn cho vật nuôi, phân chuồng bón lại cho cây trồng, tạo vòng tuần hoàn khép kín (mô hình VAC).","points":0.25},{"type":"mcq","level":"TH","q":"Vai trò nào sau đây thể hiện chăn nuôi cung cấp nguyên liệu cho công nghiệp chế biến?","options":["A. Nuôi trâu để cày ruộng.","B. Nuôi bò sữa để lấy sữa làm sữa bột, phô mai.","C. Nuôi lợn để lấy phân bón ruộng.","D. Nuôi gà để lấy trứng ăn hằng ngày."],"answer":"B","explain":"Sữa bò là nguyên liệu để chế biến thành sữa bột, phô mai, sữa chua — thể hiện vai trò cung cấp nguyên liệu cho công nghiệp chế biến.","points":0.25},{"type":"mcq","level":"VD","q":"Gia đình chị Lan có vườn, ao và đang nuôi 20 con lợn. Để phát triển theo hướng bền vững, gia đình chị nên áp dụng mô hình nào?","options":["A. Chỉ nuôi lợn, bán hết phân đi nơi khác.","B. Mô hình VAC: dùng phân lợn bón vườn, phụ phẩm vườn và ao làm thức ăn cho lợn.","C. Ngừng nuôi lợn, chỉ trồng rau.","D. Nuôi thêm thật nhiều lợn mà không xử lí chất thải."],"answer":"B","explain":"Mô hình VAC (vườn – ao – chuồng) tận dụng phụ phẩm lẫn nhau: phân lợn bón vườn, rau thừa và cá tạp làm thức ăn, vừa tiết kiệm chi phí vừa bảo vệ môi trường.","points":0.25},{"type":"mcq","level":"VDC","q":"Một địa phương có hàng nghìn hộ chăn nuôi lợn nhỏ lẻ, dịch bệnh thường xuyên bùng phát và lan nhanh. Giải pháp căn cơ nhất để phát triển chăn nuôi bền vững ở đây là gì?","options":["A. Cấm hoàn toàn việc chăn nuôi lợn.","B. Khuyến khích từng hộ nuôi thêm nhiều lợn hơn để bù lỗ khi dịch đến.","C. Chuyển dần sang chăn nuôi trang trại tập trung, áp dụng an toàn sinh học và quy hoạch vùng chăn nuôi.","D. Chỉ dùng thuốc kháng sinh liều cao cho đàn lợn."],"answer":"C","explain":"Chăn nuôi nhỏ lẻ, phân tán khó kiểm soát dịch bệnh. Giải pháp căn cơ là tập trung hóa thành trang trại, áp dụng an toàn sinh học (cách li, sát trùng, tiêm phòng), quy hoạch vùng chăn nuôi xa khu dân cư.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về chăn nuôi:","statements":["a) Chăn nuôi là ngành sản xuất nuôi dưỡng, chăm sóc vật nuôi để thu sản phẩm.","b) Thịt, trứng, sữa là các sản phẩm chủ yếu của chăn nuôi.","c) Nuôi chó cảnh trong nhà được coi là hoạt động chăn nuôi.","d) Chăn nuôi cung cấp sức kéo cho sản xuất nông nghiệp."],"answer":["T","T","F","T"],"explain":"a) Đúng: đúng khái niệm. b) Đúng. c) Sai: nuôi thú cưng làm cảnh không phải hoạt động sản xuất chăn nuôi. d) Đúng: trâu, bò cung cấp sức kéo.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về vai trò của chăn nuôi:","statements":["a) Chăn nuôi cung cấp nguồn thực phẩm giàu protein động vật.","b) Phân chuồng là nguồn phân hữu cơ quý cho trồng trọt.","c) Chăn nuôi không tạo ra việc làm cho lao động nông thôn.","d) Tơ tằm, mật ong là sản phẩm chăn nuôi có giá trị xuất khẩu."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: chăn nuôi thu hút hàng triệu lao động, góp phần xóa đói giảm nghèo. d) Đúng.","points":1},{"type":"short","level":"VD","q":"Kể tên 3 công nghệ cao được ứng dụng trong nuôi dưỡng, chăm sóc vật nuôi (mỗi công nghệ cách nhau bằng dấu phẩy).","answer":"cho ăn thông minh, vắt sữa bò tự động, vòng cổ theo dõi vô tuyến","explain":"Các công nghệ cao trong nuôi dưỡng, chăm sóc: cho ăn thông minh, vắt sữa bò tự động, thu gom trứng gà tự động, tắm chải tự động cho bò, vòng cổ theo dõi vô tuyến, chuồng trại tự động điều khiển nhiệt độ, độ ẩm.","points":0.5},{"type":"short","level":"VDC","q":"Một trang trại bò sữa muốn vừa tăng năng suất vừa phát hiện sớm bệnh viêm vú cho từng con bò. Công nghệ nào phù hợp nhất? (trả lời ngắn gọn)","answer":"robot vắt sữa tự động","explain":"Robot vắt sữa tự động nhận diện từng con bò, ghi lại sản lượng và chất lượng sữa theo từng ca vắt, qua đó phát hiện sớm dấu hiệu viêm vú, đồng thời tăng năng suất và giảm công lao động.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Đâu là vai trò của chăn nuôi đối với trồng trọt?","options":["A. Cung cấp phân bón hữu cơ và sức kéo.","B. Cung cấp hạt giống cây trồng.","C. Cung cấp nước tưới cho đồng ruộng.","D. Cung cấp thuốc trừ sâu."],"answer":"A","explain":"Chăn nuôi cung cấp phân chuồng (phân hữu cơ) bón cho cây trồng và sức kéo (trâu, bò cày kéo) phục vụ sản xuất nông nghiệp.","points":0.25},{"type":"mcq","level":"NB","q":"Công nghệ nào sau đây được ứng dụng trong công tác giống vật nuôi?","options":["A. Thụ tinh nhân tạo.","B. Máy gặt đập liên hợp.","C. Tưới nhỏ giọt.","D. Ủ chua thức ăn."],"answer":"A","explain":"Thụ tinh nhân tạo, cấy truyền phôi và công nghệ gen là các thành tựu công nghệ cao trong công tác giống vật nuôi.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của thụ tinh nhân tạo so với phối giống tự nhiên là gì?","options":["A. Không cần con đực giống.","B. Chủ động chọn giống tốt, giảm số lượng con đực giống phải nuôi, nâng cao chất lượng đàn con.","C. Con non sinh ra không cần chăm sóc.","D. Chi phí luôn bằng không."],"answer":"B","explain":"Thụ tinh nhân tạo dùng tinh dịch bảo quản trong môi trường nhân tạo, cho phép chọn lọc giống tốt, giảm số con đực giống cần nuôi, nâng cao chất lượng đàn con và chủ động kế hoạch phối giống.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao chăn nuôi trang trại quy mô lớn đang dần thay thế chăn nuôi nông hộ nhỏ lẻ?","options":["A. Vì nuôi nhỏ lẻ tốn ít công chăm sóc hơn.","B. Vì trang trại quy mô lớn dễ áp dụng công nghệ cao, kiểm soát dịch bệnh và hạ giá thành sản phẩm.","C. Vì trang trại không cần vốn đầu tư.","D. Vì nông hộ không được phép chăn nuôi nữa."],"answer":"B","explain":"Trang trại quy mô lớn áp dụng được cơ giới hóa, tự động hóa, an toàn sinh học, từ đó nâng năng suất, kiểm soát dịch bệnh tốt và hạ giá thành — đó là xu thế tất yếu.","points":0.25},{"type":"mcq","level":"VD","q":"Anh Minh muốn mở trang trại gà đẻ trứng quy mô 5000 con theo hướng hiện đại. Thiết bị nào sau đây là KHÔNG cần thiết?","options":["A. Hệ thống cho ăn, uống tự động.","B. Hệ thống thu gom trứng tự động.","C. Máy gặt đập liên hợp.","D. Hệ thống điều khiển nhiệt độ, thông gió chuồng nuôi."],"answer":"C","explain":"Máy gặt đập liên hợp dùng trong trồng trọt (thu hoạch lúa), không liên quan đến trang trại gà đẻ. Các thiết bị còn lại đều phục vụ chăn nuôi gà hiện đại.","points":0.25},{"type":"mcq","level":"VDC","q":"Để phát triển chăn nuôi bò sữa công nghệ cao ở một tỉnh miền núi, yếu tố nào cần được ưu tiên đầu tư TRƯỚC TIÊN?","options":["A. Nhập thật nhiều bò sữa về nuôi ngay.","B. Quy hoạch vùng trồng cỏ, ngô làm thức ăn và xây dựng cơ sở hạ tầng trang trại, thú y.","C. Chỉ tập trung quảng cáo bán sữa.","D. Giảm giá sữa để cạnh tranh."],"answer":"B","explain":"Chăn nuôi bò sữa công nghệ cao đòi hỏi nguồn thức ăn ổn định (đồng cỏ, ngô ủ chua), chuồng trại, hệ thống thú y và con giống tốt. Vội nhập bò khi chưa có thức ăn và hạ tầng sẽ thất bại — đây là tư duy hệ thống trong phát triển chăn nuôi.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau về công nghệ cao trong chăn nuôi:","statements":["a) Cấy truyền phôi giúp tăng nhanh đàn bò sữa chất lượng cao.","b) Vòng cổ theo dõi vô tuyến giúp giám sát sức khỏe vật nuôi.","c) Cho ăn thông minh là máy cho ăn tự động theo khẩu phần từng cá thể.","d) Công nghệ cao chỉ áp dụng được cho trồng trọt, không áp dụng cho chăn nuôi."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: công nghệ cao được ứng dụng mạnh mẽ trong cả giống và nuôi dưỡng, chăm sóc vật nuôi.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về triển vọng chăn nuôi:","statements":["a) Nhu cầu thịt, trứng, sữa ngày càng tăng tạo dư địa phát triển cho chăn nuôi.","b) Chăn nuôi hữu cơ, an toàn ngày càng được người tiêu dùng ưa chuộng.","c) Xử lí chất thải bằng hầm biogas giúp chăn nuôi thân thiện môi trường.","d) Xu hướng hiện nay là quay lại chăn nuôi nhỏ lẻ, thủ công hoàn toàn."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: biogas biến chất thải thành năng lượng và phân bón. d) Sai: xu hướng là trang trại quy mô lớn, công nghệ cao.","points":1},{"type":"short","level":"VD","q":"Công nghệ nào cho phép lấy phôi từ bò mẹ cao sản cấy sang bò mẹ khác mang thai hộ?","answer":"cấy truyền phôi","explain":"Cấy truyền phôi: lấy phôi từ bò mẹ cao sản (cho phôi) cấy vào tử cung của những con bò cái khác (nhận phôi) để mang thai hộ, giúp tăng nhanh đàn bò chất lượng cao.","points":0.5},{"type":"short","level":"VDC","q":"Nêu tên mô hình sản xuất kết hợp vườn – ao – chuồng, tận dụng phụ phẩm lẫn nhau giữa trồng trọt và chăn nuôi.","answer":"VAC","explain":"Mô hình VAC (vườn – ao – chuồng) là mô hình nông nghiệp bền vững: phân chuồng bón vườn, phụ phẩm vườn và thức ăn từ ao phục vụ chăn nuôi, tạo vòng tuần hoàn khép kín.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Vật nuôi nào sau đây được nuôi chủ yếu để lấy sức kéo?","options":["A. Gà ri.","B. Trâu.","C. Ong mật.","D. Tằm."],"answer":"B","explain":"Trâu (cùng với bò) được nuôi để lấy sức kéo cày, bừa trong sản xuất nông nghiệp, đồng thời cho phân bón.","points":0.25},{"type":"mcq","level":"NB","q":"Sản phẩm chăn nuôi nào giàu protein động vật, giúp nâng cao chất lượng bữa ăn?","options":["A. Rau muống.","B. Thịt, trứng, sữa.","C. Gạo nếp.","D. Mía đường."],"answer":"B","explain":"Thịt, trứng, sữa là nguồn protein động vật chủ yếu do chăn nuôi cung cấp, có giá trị dinh dưỡng cao.","points":0.25},{"type":"mcq","level":"TH","q":"Công nghệ gen trong công tác giống vật nuôi có ưu điểm nổi bật nào?","options":["A. Làm vật nuôi không cần ăn.","B. Phát hiện sớm giới tính phôi, chọn lọc chính xác, rút ngắn thời gian chọn giống.","C. Thay thế hoàn toàn thức ăn chăn nuôi.","D. Giúp vật nuôi sống mãi không chết."],"answer":"B","explain":"Công nghệ gen cho phép xác định sớm giới tính phôi theo nhu cầu sản xuất, chọn lọc chính xác ở mức độ gen và rút ngắn đáng kể thời gian chọn tạo giống.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao chăn nuôi góp phần xóa đói giảm nghèo ở nông thôn?","options":["A. Vì chăn nuôi không cần kiến thức kĩ thuật.","B. Vì chăn nuôi tận dụng được lao động, đất đai, phụ phẩm nông nghiệp, tạo thu nhập thường xuyên cho nông hộ.","C. Vì Nhà nước phát tiền cho người chăn nuôi.","D. Vì chăn nuôi không bao giờ gặp rủi ro."],"answer":"B","explain":"Chăn nuôi phù hợp với điều kiện nông thôn: tận dụng lao động nhàn rỗi, đất vườn, phụ phẩm trồng trọt, cho thu nhập thường xuyên (trứng, sữa hằng ngày) nên giúp nhiều hộ thoát nghèo.","points":0.25},{"type":"mcq","level":"VD","q":"Trang trại của ông Ba nuôi 200 con lợn, chất thải gây mùi hôi ảnh hưởng khu dân cư. Biện pháp xử lí phù hợp và mang lại lợi ích kinh tế nhất là gì?","options":["A. Xả thẳng chất thải ra sông.","B. Xây hầm biogas để xử lí chất thải, lấy khí đun nấu và phân bón.","C. Đổ chất thải ra đường làng.","D. Ngừng chăn nuôi vĩnh viễn."],"answer":"B","explain":"Hầm biogas phân hủy kị khí chất thải chăn nuôi, thu khí metan làm chất đốt, bã thải làm phân bón — vừa xử lí ô nhiễm vừa tạo lợi ích kinh tế, đúng hướng chăn nuôi thân thiện môi trường.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty muốn xây dựng chuỗi sản phẩm thịt lợn sạch có truy xuất nguồn gốc từ trang trại đến bàn ăn. Yếu tố then chốt để chuỗi này thành công là gì?","options":["A. Chỉ cần bao bì đẹp.","B. Kiểm soát đồng bộ: con giống tốt, thức ăn an toàn, an toàn sinh học, giết mổ đảm bảo vệ sinh và hệ thống truy xuất nguồn gốc minh bạch.","C. Bán giá thật rẻ bất chấp chất lượng.","D. Nuôi càng nhiều lợn càng tốt."],"answer":"B","explain":"Thịt sạch truy xuất được đòi hỏi kiểm soát toàn chuỗi: giống, thức ăn không tồn dư kháng sinh, an toàn sinh học, giết mổ vệ sinh, bảo quản lạnh và ghi nhận minh bạch từng khâu — thiếu một khâu là mất niềm tin người tiêu dùng.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nuôi tằm để lấy tơ là một hoạt động chăn nuôi.","b) Nuôi ong để lấy mật là một hoạt động chăn nuôi.","c) Trồng lúa để lấy gạo là một hoạt động chăn nuôi.","d) Nuôi cá trong ao để lấy thịt là một hoạt động chăn nuôi."],"answer":["T","T","F","T"],"explain":"a) Đúng: tằm cho tơ. b) Đúng: ong cho mật. c) Sai: trồng lúa là trồng trọt. d) Đúng: nuôi thủy sản cũng thuộc lĩnh vực chăn nuôi rộng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về thành tựu công nghệ cao:","statements":["a) Máy thu gom trứng gà tự động giúp giảm công lao động và hạn chế trứng dập vỡ.","b) Tắm chải tự động giúp bò thoải mái, tăng tiết sữa.","c) Chuồng trại tự động điều khiển được nhiệt độ, độ ẩm, thông gió.","d) Công nghệ cao làm giảm năng suất chăn nuôi."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: bò được chải lông thường xuyên sẽ thoải mái, ăn ngon, cho nhiều sữa hơn. c) Đúng. d) Sai: công nghệ cao giúp tăng năng suất và chất lượng.","points":1},{"type":"short","level":"VD","q":"Thiết bị đeo trên cổ bò giúp giám sát sức khỏe, vị trí của vật nuôi theo thời gian thực được gọi là gì?","answer":"vòng cổ theo dõi vô tuyến","explain":"Vòng cổ theo dõi vô tuyến (cảm biến đeo cổ) thu thập dữ liệu về hoạt động, thân nhiệt, vị trí của bò, giúp phát hiện sớm bò ốm hoặc đến kì động dục.","points":0.5},{"type":"short","level":"VDC","q":"Xu hướng chăn nuôi hiện đại được tóm tắt bằng 4 cụm từ nào? (liệt kê cách nhau bằng dấu phẩy)","answer":"quy mô lớn, công nghệ cao, an toàn sinh học, thân thiện môi trường","explain":"Chăn nuôi hiện đại phát triển theo hướng: quy mô lớn (trang trại tập trung), công nghệ cao (tự động hóa), an toàn sinh học (phòng dịch) và thân thiện với môi trường.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Đâu là xu hướng phát triển của chăn nuôi hiện nay?","options":["A. Chăn nuôi nhỏ lẻ, manh mún.","B. Trang trại quy mô lớn ứng dụng công nghệ cao.","C. Ngừng chăn nuôi, chỉ trồng trọt.","D. Nuôi thả rông không kiểm soát."],"answer":"B","explain":"Xu hướng hiện nay là chuyển từ chăn nuôi nông hộ nhỏ lẻ sang trang trại quy mô lớn, ứng dụng công nghệ cao, an toàn sinh học.","points":0.25},{"type":"mcq","level":"NB","q":"Hầm biogas trong chăn nuôi có tác dụng gì?","options":["A. Xử lí chất thải chăn nuôi, thu khí đốt và phân bón.","B. Nuôi cá trong hầm.","C. Bảo quản thức ăn chăn nuôi.","D. Sưởi ấm cho vật nuôi non."],"answer":"A","explain":"Hầm biogas phân hủy kị khí phân và chất thải chăn nuôi, thu khí metan làm chất đốt, bã thải làm phân bón hữu cơ.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao chăn nuôi công nghệ cao giúp hạ giá thành sản phẩm?","options":["A. Vì không cần đầu tư ban đầu.","B. Vì tự động hóa giảm công lao động, nâng năng suất, giảm hao hụt do dịch bệnh.","C. Vì vật nuôi không cần ăn.","D. Vì bán sản phẩm với giá cao hơn."],"answer":"B","explain":"Tự động hóa (cho ăn, vắt sữa, thu trứng) giảm chi phí nhân công; kiểm soát môi trường và dịch bệnh tốt giúp vật nuôi khỏe, năng suất cao, từ đó hạ giá thành mỗi đơn vị sản phẩm.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm khác biệt cơ bản giữa chăn nuôi nông hộ và chăn nuôi trang trại là gì?","options":["A. Nông hộ nuôi nhiều hơn trang trại.","B. Nông hộ quy mô nhỏ, tận dụng phụ phẩm; trang trại quy mô lớn, đầu tư công nghệ, an toàn sinh học.","C. Trang trại không cần kiến thức kĩ thuật.","D. Nông hộ luôn cho năng suất cao hơn."],"answer":"B","explain":"Chăn nuôi nông hộ: quy mô nhỏ, tận dụng lao động và phụ phẩm gia đình. Chăn nuôi trang trại: quy mô lớn, vốn đầu tư cao, áp dụng công nghệ và an toàn sinh học, năng suất cao.","points":0.25},{"type":"mcq","level":"VD","q":"Hợp tác xã của xã A muốn liên kết các hộ nuôi gà để bán trứng sạch cho siêu thị. Điều kiện tiên quyết để siêu thị chấp nhận là gì?","options":["A. Gà phải được nuôi thả rông hoàn toàn.","B. Quy trình chăn nuôi thống nhất, đảm bảo vệ sinh an toàn thực phẩm và truy xuất được nguồn gốc.","C. Giá trứng phải rẻ nhất thị trường.","D. Mỗi hộ nuôi một giống gà khác nhau."],"answer":"B","explain":"Siêu thị yêu cầu sản phẩm đồng đều, an toàn: các hộ phải thống nhất con giống, thức ăn, quy trình thú y, có ghi chép và truy xuất nguồn gốc rõ ràng.","points":0.25},{"type":"mcq","level":"VDC","q":"Đánh giá nào sau đây đúng về mối quan hệ giữa phát triển chăn nuôi và bảo vệ môi trường?","options":["A. Phát triển chăn nuôi nhất thiết phải gây ô nhiễm môi trường.","B. Áp dụng công nghệ xử lí chất thải (biogas, ủ phân hữu cơ) và chăn nuôi tuần hoàn giúp vừa phát triển chăn nuôi vừa bảo vệ môi trường.","C. Bảo vệ môi trường thì phải cấm chăn nuôi.","D. Chất thải chăn nuôi không thể tái sử dụng."],"answer":"B","explain":"Chăn nuôi và môi trường không mâu thuẫn nếu áp dụng đúng công nghệ: biogas, ủ phân compost, tuần hoàn nước… biến chất thải thành tài nguyên, giảm phát thải khí nhà kính.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chăn nuôi trang trại có quy mô lớn hơn chăn nuôi nông hộ.","b) An toàn sinh học giúp ngăn ngừa dịch bệnh trong chăn nuôi.","c) Chăn nuôi hữu cơ hạn chế sử dụng kháng sinh và hóa chất.","d) Mọi hộ gia đình nuôi một con chó đều là trang trại chăn nuôi."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: an toàn sinh học là biện pháp phòng dịch tổng hợp. c) Đúng. d) Sai: nuôi thú cưng không phải chăn nuôi sản xuất.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về vai trò kinh tế của chăn nuôi:","statements":["a) Chăn nuôi tạo việc làm cho lao động nông thôn.","b) Sản phẩm chăn nuôi có thể xuất khẩu thu ngoại tệ.","c) Chăn nuôi chỉ tiêu tốn chi phí, không mang lại thu nhập.","d) Chế biến sản phẩm chăn nuôi làm tăng giá trị sản phẩm."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng: thịt, sữa, mật ong, tơ tằm xuất khẩu. c) Sai: chăn nuôi là nguồn thu nhập quan trọng. d) Đúng: chế biến sâu nâng cao giá trị gia tăng.","points":1},{"type":"short","level":"VD","q":"Biện pháp phòng dịch tổng hợp trong chăn nuôi (cách li, sát trùng, tiêm phòng, kiểm soát người ra vào…) được gọi là gì?","answer":"an toàn sinh học","explain":"An toàn sinh học là tổng hợp các biện pháp kĩ thuật nhằm ngăn mầm bệnh xâm nhập và lây lan trong cơ sở chăn nuôi: cách li, vệ sinh sát trùng, tiêm phòng, kiểm soát con người, phương tiện ra vào.","points":0.5},{"type":"short","level":"VDC","q":"Một vùng chăn nuôi muốn phát triển bền vững cần kết hợp 3 yếu tố nào? (trả lời: hiệu quả kinh tế, …, …)","answer":"hiệu quả kinh tế, an toàn dịch bệnh, bảo vệ môi trường","explain":"Chăn nuôi bền vững phải hài hòa ba trụ cột: hiệu quả kinh tế (năng suất, lợi nhuận), an toàn dịch bệnh (sức khỏe đàn vật nuôi và cộng đồng) và bảo vệ môi trường (xử lí chất thải).","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Lịch sử chăn nuôi phát triển theo trình tự nào?","options":["A. Trang trại công nghệ cao → chăn thả tự nhiên → nông hộ nhỏ lẻ.","B. Chăn thả tự nhiên → chăn nuôi nông hộ nhỏ lẻ → trang trại quy mô lớn công nghệ cao.","C. Nông hộ nhỏ lẻ → chăn thả tự nhiên → trang trại công nghệ cao.","D. Trang trại công nghệ cao → nông hộ nhỏ lẻ → chăn thả tự nhiên."],"answer":"B","explain":"Chăn nuôi phát triển từ chăn thả tự nhiên, đến chăn nuôi nông hộ nhỏ lẻ, rồi đến chăn nuôi trang trại quy mô lớn ứng dụng công nghệ cao như hiện nay.","points":0.25},{"type":"mcq","level":"NB","q":"Sản phẩm nào sau đây là nguyên liệu cho công nghiệp dệt may?","options":["A. Tơ tằm, lông cừu.","B. Thịt bò.","C. Trứng vịt.","D. Sữa dê."],"answer":"A","explain":"Tơ tằm dùng dệt lụa, lông cừu dùng dệt len — đều là nguyên liệu cho công nghiệp dệt may do chăn nuôi cung cấp.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói nhu cầu thực phẩm tăng tạo triển vọng cho chăn nuôi?","options":["A. Vì dân số và thu nhập tăng kéo theo nhu cầu thịt, trứng, sữa tăng.","B. Vì mọi người ngừng ăn rau.","C. Vì chăn nuôi không cần diện tích đất.","D. Vì thực phẩm nhập khẩu ngày càng rẻ."],"answer":"A","explain":"Dân số tăng và mức sống nâng cao làm nhu cầu protein động vật (thịt, trứng, sữa) tăng nhanh, mở ra dư địa lớn cho ngành chăn nuôi phát triển.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của chuồng trại tự động điều khiển bằng cảm biến là gì?","options":["A. Luôn giữ nhiệt độ, độ ẩm, thông gió ở mức tối ưu cho vật nuôi mà ít tốn công.","B. Không cần cho vật nuôi ăn.","C. Vật nuôi không bao giờ bị bệnh.","D. Không tốn điện năng."],"answer":"A","explain":"Cảm biến đo nhiệt độ, độ ẩm, khí độc và tự động điều chỉnh quạt thông gió, hệ thống sưởi/làm mát, giúp vật nuôi luôn ở môi trường tối ưu, giảm công lao động.","points":0.25},{"type":"mcq","level":"VD","q":"Trang trại gà của anh Tuấn lắp hệ thống thu gom trứng tự động. Lợi ích trực tiếp lớn nhất là gì?","options":["A. Gà đẻ nhiều trứng hơn gấp đôi.","B. Trứng được thu nhanh, sạch, ít dập vỡ và giảm công lao động.","C. Không cần cho gà ăn nữa.","D. Trứng tự ấp thành gà con."],"answer":"B","explain":"Băng tải thu gom đưa trứng về khu vực tập kết ngay sau khi đẻ nên trứng sạch, ít dập vỡ, giảm công nhặt trứng thủ công — lợi ích trực tiếp và rõ rệt nhất.","points":0.25},{"type":"mcq","level":"VDC","q":"Một doanh nghiệp đầu tư dây chuyền giết mổ, chế biến thịt lợn hiện đại nhưng vẫn mua lợn từ các hộ nuôi nhỏ lẻ không kiểm soát. Rủi ro lớn nhất của mô hình này là gì?","options":["A. Lợn quá nhiều không giết hết.","B. Không kiểm soát được chất lượng, an toàn dịch bệnh đầu vào, dễ mất uy tín thương hiệu khi xảy ra sự cố.","C. Dây chuyền hiện đại làm thịt mất ngon.","D. Hộ nông dân không chịu bán lợn."],"answer":"B","explain":"Chế biến hiện đại nhưng đầu vào không kiểm soát (tồn dư kháng sinh, dịch bệnh) thì sản phẩm đầu ra vẫn rủi ro. Chuỗi giá trị chỉ mạnh khi mọi khâu — từ giống, thức ăn, thú y đến giết mổ — đều được kiểm soát đồng bộ.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chăn nuôi có lịch sử phát triển lâu đời gắn với văn minh nhân loại.","b) Chăn nuôi trang trại ứng dụng công nghệ cao là xu hướng hiện nay.","c) Mật ong là sản phẩm của ngành chăn nuôi.","d) Phân chuồng không có giá trị gì với trồng trọt."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: nuôi ong lấy mật là chăn nuôi. d) Sai: phân chuồng là phân hữu cơ rất quý.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau về công nghệ trong chăn nuôi:","statements":["a) Thụ tinh nhân tạo giúp nâng cao chất lượng đàn con.","b) Cấy truyền phôi giúp tăng nhanh đàn bò chất lượng cao.","c) Công nghệ gen giúp chọn lọc giống chính xác hơn.","d) Máy cho ăn tự động làm vật nuôi biếng ăn."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cho ăn đúng khẩu phần, đúng giờ giúp vật nuôi ăn ngon, lớn nhanh.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 thành tựu công nghệ cao trong công tác giống vật nuôi.","answer":"thụ tinh nhân tạo, cấy truyền phôi","explain":"Các thành tựu nổi bật trong công tác giống: thụ tinh nhân tạo, cấy truyền phôi và công nghệ gen (xác định giới tính phôi, chọn lọc chính xác).","points":0.5},{"type":"short","level":"VDC","q":"Vì sao robot vắt sữa giúp phát hiện sớm bệnh viêm vú ở bò? (trả lời ngắn gọn)","answer":"vì ghi nhận sản lượng và chất lượng sữa từng con mỗi ca vắt","explain":"Robot vắt sữa ghi lại sản lượng, thành phần sữa của từng con bò mỗi ca vắt; khi các chỉ số thay đổi bất thường, hệ thống cảnh báo sớm dấu hiệu viêm vú để can thiệp kịp thời.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Chăn nuôi cung cấp sức kéo chủ yếu từ vật nuôi nào?","options":["A. Trâu, bò.","B. Gà, vịt.","C. Ong, tằm.","D. Cá, tôm."],"answer":"A","explain":"Trâu, bò là vật nuôi cung cấp sức kéo (cày, bừa, kéo xe) trong sản xuất nông nghiệp.","points":0.25},{"type":"mcq","level":"NB","q":"Đâu là biểu hiện của chăn nuôi ứng dụng công nghệ cao?","options":["A. Cho ăn bằng tay, ghi chép bằng trí nhớ.","B. Hệ thống cho ăn tự động, cảm biến theo dõi sức khỏe vật nuôi.","C. Nuôi thả rông không quản lí.","D. Không tiêm phòng cho vật nuôi."],"answer":"B","explain":"Chăn nuôi công nghệ cao đặc trưng bởi tự động hóa (cho ăn, vắt sữa, thu trứng), cảm biến giám sát môi trường và sức khỏe vật nuôi.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao tắm chải tự động cho bò giúp tăng sản lượng sữa?","options":["A. Vì máy chải làm bò sợ nên tiết nhiều sữa.","B. Vì bò được vệ sinh, thoải mái, tuần hoàn máu tốt nên ăn ngon và tiết sữa nhiều hơn.","C. Vì máy chải thay thế hoàn toàn thức ăn.","D. Vì bò không cần uống nước nữa."],"answer":"B","explain":"Chải lông thường xuyên giúp bò sạch sẽ, thoải mái, kích thích tuần hoàn máu và giảm stress — bò ăn ngon, khỏe mạnh nên cho nhiều sữa hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Mô hình VAC có ý nghĩa gì với môi trường?","options":["A. Làm tăng ô nhiễm nguồn nước.","B. Tận dụng phụ phẩm, chất thải của khâu này làm đầu vào cho khâu khác, giảm thải ra môi trường.","C. Chỉ có tác dụng tăng thu nhập, không liên quan môi trường.","D. Làm đất bạc màu nhanh hơn."],"answer":"B","explain":"VAC tạo vòng tuần hoàn: phân chuồng bón vườn, rau thừa cho lợn, cá… chất thải được tái sử dụng thay vì thải ra môi trường, giảm ô nhiễm.","points":0.25},{"type":"mcq","level":"VD","q":"Xã B có nhiều hộ nuôi lợn nhỏ lẻ, mỗi khi có dịch tả lợn là lây lan cả xã. Biện pháp nào giúp hạn chế lây lan hiệu quả nhất?","options":["A. Giấu dịch, vẫn bán lợn ốm ra chợ.","B. Áp dụng an toàn sinh học: cách li đàn, sát trùng chuồng trại, tiêm phòng, kiểm soát người và phương tiện ra vào.","C. Cho lợn uống thật nhiều nước.","D. Đợi dịch tự hết."],"answer":"B","explain":"An toàn sinh học là biện pháp phòng dịch hiệu quả nhất: ngăn mầm bệnh xâm nhập (cách li, kiểm soát ra vào), tiêu diệt mầm bệnh (sát trùng) và tăng miễn dịch (tiêm phòng).","points":0.25},{"type":"mcq","level":"VDC","q":"Một tỉnh muốn phát triển chăn nuôi thành ngành kinh tế mũi nhọn. Trong các định hướng sau, định hướng nào KHÔNG phù hợp?","options":["A. Quy hoạch vùng chăn nuôi tập trung xa khu dân cư.","B. Đầu tư cơ sở giết mổ, chế biến và hệ thống truy xuất nguồn gốc.","C. Khuyến khích chăn nuôi tự phát, nhỏ lẻ ngay trong khu dân cư đông đúc.","D. Đào tạo nguồn nhân lực thú y, khuyến nông."],"answer":"C","explain":"Chăn nuôi tự phát trong khu dân cư gây ô nhiễm, khó kiểm soát dịch bệnh, mâu thuẫn với phát triển bền vững. Cần quy hoạch vùng tập trung, chế biến sâu và nhân lực chất lượng cao.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Sữa bò là nguyên liệu để sản xuất sữa bột, phô mai.","b) Da, lông vật nuôi là nguyên liệu cho công nghiệp da giày, dệt may.","c) Chăn nuôi không liên quan gì đến công nghiệp chế biến.","d) Tơ tằm dùng để dệt lụa."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: chăn nuôi cung cấp nhiều nguyên liệu cho chế biến. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dân số tăng làm nhu cầu thịt, trứng, sữa tăng theo.","b) Chăn nuôi hữu cơ được người tiêu dùng ngày càng ưa chuộng.","c) Hầm biogas giúp biến chất thải chăn nuôi thành năng lượng.","d) Công nghệ cao chỉ làm tăng chi phí, không tăng năng suất."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: công nghệ cao giúp tăng năng suất, giảm hao hụt, hạ giá thành.","points":1},{"type":"short","level":"VD","q":"Nêu 2 lợi ích của hầm biogas đối với hộ chăn nuôi.","answer":"thu khí đốt đun nấu, có phân bón hữu cơ","explain":"Hầm biogas xử lí chất thải chăn nuôi, thu khí metan làm chất đốt đun nấu, thắp sáng; bã thải sau phân hủy là phân bón hữu cơ tốt, đồng thời giảm mùi hôi và ô nhiễm.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao chuỗi thịt sạch cần kiểm soát đồng bộ từ trang trại đến bàn ăn? (trả lời ngắn gọn)","answer":"vì chỉ một khâu mất an toàn sẽ làm mất niềm tin và uy tín cả chuỗi","explain":"Thịt sạch đòi hỏi mọi khâu đều an toàn: giống, thức ăn, thú y, giết mổ, bảo quản. Chỉ cần một khâu (ví dụ tồn dư kháng sinh) bị phát hiện, người tiêu dùng sẽ mất niềm tin vào toàn bộ thương hiệu.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Vật nuôi nào sau đây cho sản phẩm là mật?","options":["A. Ong mật.","B. Lợn.","C. Gà.","D. Trâu."],"answer":"A","explain":"Ong mật được nuôi để lấy mật và sáp ong — là hoạt động chăn nuôi mang lại giá trị kinh tế cao.","points":0.25},{"type":"mcq","level":"NB","q":"Chăn nuôi nông hộ có đặc điểm nào?","options":["A. Quy mô lớn, vốn đầu tư cao.","B. Quy mô nhỏ, tận dụng lao động và phụ phẩm của gia đình.","C. Áp dụng hoàn toàn robot tự động.","D. Không cần chăm sóc vật nuôi."],"answer":"B","explain":"Chăn nuôi nông hộ: quy mô nhỏ (vài con đến vài chục con), tận dụng lao động nhàn rỗi, phụ phẩm nông nghiệp, vốn đầu tư thấp.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao cấy truyền phôi giúp tăng nhanh đàn bò sữa chất lượng cao?","options":["A. Vì một bò mẹ cao sản có thể cho nhiều phôi để nhiều bò khác mang thai hộ trong cùng thời gian.","B. Vì phôi tự phát triển không cần bò mẹ.","C. Vì bò mang thai hộ không cần ăn.","D. Vì phôi có thể để mãi không cần cấy."],"answer":"A","explain":"Bò mẹ cao sản (cho phôi) tạo ra nhiều phôi tốt; các phôi được cấy cho nhiều bò nhận phôi mang thai hộ cùng lúc nên số bê con chất lượng cao tăng nhanh gấp nhiều lần so với sinh sản tự nhiên.","points":0.25},{"type":"mcq","level":"TH","q":"Lợi ích của việc đeo vòng cổ theo dõi cho bò là gì?","options":["A. Làm bò đẹp hơn.","B. Giám sát sức khỏe, phát hiện sớm bò ốm hoặc đến kì động dục để phối giống đúng thời điểm.","C. Thay thế hoàn toàn bác sĩ thú y.","D. Giúp bò không cần ăn cỏ."],"answer":"B","explain":"Vòng cổ cảm biến ghi nhận hoạt động, thân nhiệt của bò theo thời gian thực; dữ liệu bất thường cảnh báo bò ốm hoặc động dục, giúp can thiệp kịp thời, nâng hiệu quả sinh sản.","points":0.25},{"type":"mcq","level":"VD","q":"Gia đình bác Tư nuôi 10 con bò thịt theo kiểu chăn thả tự nhiên, năng suất thấp. Muốn nâng cao hiệu quả mà vốn ít, bác nên làm gì trước?","options":["A. Mua ngay 100 con bò mới.","B. Cải tạo chuồng trại, trồng cỏ, bổ sung thức ăn tinh và tiêm phòng đầy đủ.","C. Bán hết bò để trồng lúa.","D. Ngừng cho bò ăn để tiết kiệm."],"answer":"B","explain":"Với vốn ít, giải pháp khả thi là thâm canh đàn hiện có: cải thiện chuồng trại, chủ động nguồn thức ăn (trồng cỏ), bổ sung thức ăn tinh, phòng bệnh đầy đủ — năng suất sẽ tăng rõ rệt mà không cần mở rộng ồ ạt.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai hộ cùng nuôi 50 con lợn thịt. Hộ A áp dụng an toàn sinh học và ghi chép đầy đủ; hộ B nuôi theo kinh nghiệm, không tiêm phòng. Khi dịch tả lợn bùng phát trong vùng, khả năng cao điều gì xảy ra?","options":["A. Cả hai hộ đều thiệt hại như nhau.","B. Hộ A có khả năng bảo vệ được đàn lợn cao hơn nhờ cách li, sát trùng và đàn đã được tiêm phòng.","C. Hộ B ít thiệt hại hơn vì không tốn tiền thuốc.","D. Dịch bệnh không ảnh hưởng hộ nào."],"answer":"B","explain":"An toàn sinh học (cách li, sát trùng, kiểm soát ra vào) ngăn mầm bệnh xâm nhập; tiêm phòng tạo miễn dịch. Hộ A đầu tư phòng bệnh nên khả năng giữ được đàn cao hơn hẳn — phòng bệnh luôn rẻ hơn chữa bệnh.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chăn nuôi nông hộ có quy mô nhỏ, vốn đầu tư thấp.","b) Chăn nuôi trang trại có quy mô lớn, áp dụng công nghệ cao.","c) Mọi hình thức chăn nuôi đều cho năng suất như nhau.","d) Thụ tinh nhân tạo là thành tựu trong công tác giống."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: năng suất phụ thuộc giống, thức ăn, kĩ thuật và quy mô đầu tư. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cấy truyền phôi giúp một bò mẹ cao sản cho nhiều bê con chất lượng cao trong thời gian ngắn.","b) Cho ăn thông minh giúp mỗi con vật nhận đúng khẩu phần của mình.","c) Vắt sữa tự động giúp ghi nhận sản lượng sữa từng con bò.","d) Công nghệ cao trong chăn nuôi làm tăng ô nhiễm môi trường."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: công nghệ cao giúp quản lí chất thải tốt hơn, giảm ô nhiễm.","points":1},{"type":"short","level":"VD","q":"Nêu tên 2 vật nuôi cung cấp sức kéo trong sản xuất nông nghiệp.","answer":"trâu, bò","explain":"Trâu và bò là hai vật nuôi cung cấp sức kéo chủ yếu (cày, bừa, kéo xe) trong sản xuất nông nghiệp, đồng thời cho phân bón hữu cơ.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao phòng bệnh (an toàn sinh học, tiêm phòng) được coi là rẻ hơn chữa bệnh trong chăn nuôi? (trả lời ngắn gọn)","answer":"vì dịch bệnh gây thiệt hại lớn về đàn vật nuôi và chi phí chữa trị cao","explain":"Một khi dịch bùng phát, vật nuôi chết hàng loạt, chi phí thuốc men, sát trùng rất lớn mà hiệu quả thấp. Phòng bệnh bằng an toàn sinh học và tiêm phòng tốn ít chi phí hơn nhiều và bảo vệ được cả đàn.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Đâu là sản phẩm chăn nuôi xuất khẩu có giá trị của Việt Nam?","options":["A. Mật ong, tơ tằm.","B. Gạo tẻ.","C. Cà phê.","D. Cao su."],"answer":"A","explain":"Mật ong, tơ tằm (và một số sản phẩm thịt, sữa) là mặt hàng chăn nuôi xuất khẩu có giá trị, mang về ngoại tệ cho đất nước.","points":0.25},{"type":"mcq","level":"NB","q":"Thiết bị nào giúp thu hoạch trứng gà nhanh và ít dập vỡ?","options":["A. Băng tải thu gom trứng tự động.","B. Máy gặt đập liên hợp.","C. Máy cày.","D. Lò ấp trứng."],"answer":"A","explain":"Hệ thống thu gom trứng tự động dùng băng tải đưa trứng về khu tập kết ngay sau khi đẻ, trứng sạch và ít dập vỡ.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao chăn nuôi cần gắn với công nghiệp chế biến?","options":["A. Vì vật nuôi chỉ ăn được thức ăn chế biến.","B. Vì chế biến giúp bảo quản sản phẩm lâu hơn, nâng cao giá trị và mở rộng thị trường tiêu thụ.","C. Vì chăn nuôi không bán được sản phẩm tươi.","D. Vì chế biến làm sản phẩm rẻ đi."],"answer":"B","explain":"Thịt, sữa tươi khó bảo quản lâu. Chế biến (đồ hộp, sữa bột, xúc xích…) kéo dài thời gian bảo quản, tăng giá trị gia tăng và giúp sản phẩm vươn xa đến nhiều thị trường.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm chung của các công nghệ: cho ăn thông minh, vắt sữa tự động, thu gom trứng tự động là gì?","options":["A. Đều thay thế hoàn toàn con người.","B. Đều là tự động hóa các khâu lao động nặng nhọc, lặp đi lặp lại trong chăn nuôi.","C. Đều chỉ dùng cho bò sữa.","D. Đều không cần điện."],"answer":"B","explain":"Các công nghệ này đều tự động hóa những công việc nặng nhọc, lặp lại hằng ngày (cho ăn, vắt sữa, nhặt trứng), giúp giảm công lao động, tăng độ chính xác và năng suất.","points":0.25},{"type":"mcq","level":"VD","q":"Một trang trại nuôi gà đẻ muốn giảm tỉ lệ trứng dập vỡ. Giải pháp kĩ thuật trực tiếp nhất là gì?","options":["A. Lắp hệ thống thu gom trứng tự động bằng băng tải.","B. Cho gà ăn nhiều hơn gấp đôi.","C. Mở nhạc cho gà nghe.","D. Sơn lại chuồng gà."],"answer":"A","explain":"Trứng dập vỡ chủ yếu do thu gom chậm, va đập khi nhặt tay. Băng tải thu gom tự động đưa trứng về khu tập kết nhẹ nhàng, nhanh chóng — giải quyết trực tiếp nguyên nhân.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong bối cảnh biến đổi khí hậu (nắng nóng kéo dài), trang trại lợn quy mô lớn cần ưu tiên đầu tư gì?","options":["A. Hệ thống làm mát, thông gió và quản lí nhiệt độ chuồng nuôi tự động.","B. Mua thêm thật nhiều lợn con.","C. Giảm khẩu phần ăn của lợn.","D. Chuyển sang nuôi thả rông ngoài đồng."],"answer":"A","explain":"Lợn rất nhạy cảm với nóng (dễ stress nhiệt, bỏ ăn, chậm lớn). Hệ thống làm mát (tấm cooling pad, quạt, phun sương) duy trì nhiệt độ tối ưu là đầu tư then chốt giúp đàn lợn vượt qua nắng nóng, giữ năng suất.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chế biến giúp bảo quản sản phẩm chăn nuôi được lâu hơn.","b) Sữa bột, thịt hộp là sản phẩm chế biến từ chăn nuôi.","c) Sản phẩm tươi sống không cần bảo quản.","d) Chăn nuôi gắn với chế biến giúp nâng cao giá trị sản phẩm."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: thịt, sữa tươi rất dễ hư hỏng, cần bảo quản lạnh. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tự động hóa giúp giảm công lao động trong chăn nuôi.","b) Cảm biến giúp điều khiển nhiệt độ, độ ẩm chuồng nuôi tối ưu.","c) Chăn nuôi công nghệ cao giúp kiểm soát dịch bệnh tốt hơn.","d) Nắng nóng kéo dài không ảnh hưởng đến vật nuôi."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: chuồng kín, cách li tốt hạn chế mầm bệnh. d) Sai: nắng nóng gây stress nhiệt, giảm năng suất.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 sản phẩm chế biến từ sữa bò.","answer":"sữa bột, phô mai","explain":"Sữa bò tươi được chế biến thành nhiều sản phẩm: sữa bột, sữa chua, phô mai, bơ… giúp bảo quản lâu và tăng giá trị.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao lợn nuôi công nghiệp cần hệ thống làm mát chuồng trong mùa nắng nóng? (trả lời ngắn gọn)","answer":"vì lợn dễ bị stress nhiệt làm bỏ ăn và chậm lớn","explain":"Lợn ít tuyến mồ hôi, khả năng tản nhiệt kém nên nắng nóng gây stress nhiệt: bỏ ăn, thở dốc, chậm lớn, dễ bệnh. Hệ thống làm mát giữ nhiệt độ chuồng tối ưu, bảo đảm năng suất.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Chăn nuôi có vai trò gì đối với đời sống con người?","options":["A. Chỉ để giải trí.","B. Cung cấp thực phẩm, nguyên liệu, sức kéo, phân bón và việc làm.","C. Chỉ để xuất khẩu.","D. Không có vai trò gì."],"answer":"B","explain":"Chăn nuôi cung cấp thực phẩm giàu đạm, nguyên liệu chế biến, sức kéo, phân bón; tạo việc làm, thu nhập và nguồn ngoại tệ từ xuất khẩu.","points":0.25},{"type":"mcq","level":"NB","q":"Công nghệ gen trong chọn giống vật nuôi có thể làm được gì?","options":["A. Xác định sớm giới tính của phôi.","B. Biến lợn thành bò.","C. Giúp vật nuôi không cần uống nước.","D. Thay thế hoàn toàn thức ăn."],"answer":"A","explain":"Công nghệ gen cho phép xác định sớm giới tính phôi theo nhu cầu sản xuất (ví dụ chọn phôi cái trong chăn nuôi bò sữa), chọn lọc chính xác và rút ngắn thời gian chọn giống.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói chăn nuôi tạo việc làm cho lao động nông thôn?","options":["A. Vì chăn nuôi cần nhiều lao động ở các khâu: chăm sóc, thú y, chế biến, vận chuyển, buôn bán.","B. Vì ai cũng phải đi chăn bò.","C. Vì chăn nuôi không cần máy móc.","D. Vì lao động thành phố chuyển về nông thôn."],"answer":"A","explain":"Chuỗi chăn nuôi tạo việc làm đa dạng: người trực tiếp chăn nuôi, thú y, công nhân chế biến thức ăn và thực phẩm, lái xe vận chuyển, tiểu thương… thu hút hàng triệu lao động.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm của chăn nuôi hữu cơ là gì?","options":["A. Năng suất luôn cao nhất.","B. Hạn chế kháng sinh, hóa chất; sản phẩm an toàn, được người tiêu dùng ưa chuộng và bán giá cao hơn.","C. Không cần chăm sóc vật nuôi.","D. Vật nuôi lớn nhanh gấp đôi bình thường."],"answer":"B","explain":"Chăn nuôi hữu cơ tuân thủ quy trình nghiêm ngặt: thức ăn hữu cơ, hạn chế kháng sinh, đảm bảo phúc lợi động vật — sản phẩm an toàn, truy xuất được, giá bán cao hơn, đáp ứng nhu cầu thị trường cao cấp.","points":0.25},{"type":"mcq","level":"VD","q":"Chị Hoa muốn nuôi gà lấy trứng sạch bán cho cửa hàng thực phẩm sạch trong thành phố. Chị nên chọn hướng nào?","options":["A. Nuôi thả rông không kiểm soát, không ghi chép.","B. Nuôi theo quy trình an toàn: con giống rõ nguồn gốc, thức ăn đảm bảo, ghi chép đầy đủ để truy xuất nguồn gốc.","C. Dùng thật nhiều kháng sinh để gà không bệnh.","D. Nhập trứng từ nơi khác về bán."],"answer":"B","explain":"Thực phẩm sạch yêu cầu: giống rõ nguồn gốc, thức ăn an toàn, hạn chế kháng sinh, vệ sinh chuồng trại và hồ sơ ghi chép truy xuất được — đó là điều kiện để cửa hàng chấp nhận và người tiêu dùng tin tưởng.","points":0.25},{"type":"mcq","level":"VDC","q":"Một quốc gia có diện tích đất nông nghiệp hạn chế nhưng muốn đảm bảo an ninh thực phẩm từ chăn nuôi. Chiến lược phù hợp nhất là gì?","options":["A. Mở rộng diện tích chăn thả tự nhiên.","B. Phát triển chăn nuôi công nghệ cao, thâm canh: giống tốt, chuồng trại hiện đại, tận dụng phụ phẩm công nghiệp làm thức ăn.","C. Nhập khẩu toàn bộ thực phẩm.","D. Cấm người dân ăn thịt."],"answer":"B","explain":"Đất hạn chế thì phải thâm canh: chọn giống năng suất cao, chuồng trại nhiều tầng/hiện đại, thức ăn công nghiệp tận dụng phụ phẩm — cho năng suất cao trên diện tích nhỏ, đảm bảo nguồn cung thực phẩm.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chăn nuôi hữu cơ hạn chế sử dụng kháng sinh và hóa chất.","b) Sản phẩm hữu cơ thường được bán với giá cao hơn.","c) Chăn nuôi hữu cơ không cần đảm bảo vệ sinh chuồng trại.","d) Người tiêu dùng ngày càng ưa chuộng thực phẩm an toàn, truy xuất được nguồn gốc."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: hữu cơ càng đòi hỏi vệ sinh, an toàn sinh học nghiêm ngặt. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chuỗi chăn nuôi tạo việc làm từ khâu chăn nuôi đến chế biến, vận chuyển, buôn bán.","b) Xuất khẩu sản phẩm chăn nuôi mang về ngoại tệ cho đất nước.","c) Chăn nuôi chỉ phục vụ nhu cầu trong gia đình, không có ý nghĩa kinh tế.","d) Chế biến sâu giúp nâng cao giá trị sản phẩm chăn nuôi."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: chăn nuôi là ngành kinh tế quan trọng. d) Đúng.","points":1},{"type":"short","level":"VD","q":"Nêu 2 yêu cầu của sản phẩm chăn nuôi hữu cơ.","answer":"hạn chế kháng sinh, thức ăn hữu cơ","explain":"Chăn nuôi hữu cơ yêu cầu: thức ăn có nguồn gốc hữu cơ, hạn chế tối đa kháng sinh và hóa chất, đảm bảo phúc lợi động vật và truy xuất nguồn gốc rõ ràng.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao đất nông nghiệp hạn chế thì cần phát triển chăn nuôi thâm canh công nghệ cao? (trả lời ngắn gọn)","answer":"vì cho năng suất cao trên diện tích nhỏ","explain":"Chăn nuôi thâm canh công nghệ cao (giống tốt, chuồng trại hiện đại, thức ăn công nghiệp) cho năng suất rất cao trên một đơn vị diện tích, phù hợp với nơi đất đai hạn chế mà vẫn đảm bảo an ninh thực phẩm.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Đâu KHÔNG phải là vai trò của chăn nuôi?","options":["A. Cung cấp thực phẩm giàu đạm.","B. Cung cấp phân bón cho trồng trọt.","C. Sản xuất máy móc nông nghiệp.","D. Tạo việc làm cho lao động nông thôn."],"answer":"C","explain":"Máy móc nông nghiệp do công nghiệp cơ khí sản xuất, không phải sản phẩm của chăn nuôi. Các vai trò còn lại đều đúng.","points":0.25},{"type":"mcq","level":"NB","q":"Biện pháp nào giúp chăn nuôi thân thiện với môi trường?","options":["A. Xả thải trực tiếp ra môi trường.","B. Xử lí chất thải bằng hầm biogas, ủ phân hữu cơ.","C. Đốt chất thải ngoài đồng ruộng.","D. Chôn lấp thức ăn thừa bừa bãi."],"answer":"B","explain":"Hầm biogas và ủ phân hữu cơ (compost) biến chất thải chăn nuôi thành năng lượng và phân bón, giảm ô nhiễm môi trường.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao các nước phát triển chuyển mạnh sang chăn nuôi công nghệ cao?","options":["A. Vì lao động nông nghiệp đắt đỏ, cần tự động hóa để giảm chi phí và nâng năng suất, chất lượng.","B. Vì họ không thích vật nuôi.","C. Vì công nghệ cao không tốn tiền đầu tư.","D. Vì chăn nuôi truyền thống cho năng suất cao hơn."],"answer":"A","explain":"Ở các nước phát triển, chi phí nhân công cao nên phải tự động hóa; đồng thời yêu cầu về an toàn thực phẩm, truy xuất nguồn gốc và bảo vệ môi trường rất khắt khe — công nghệ cao đáp ứng được tất cả.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa chăn nuôi và trồng trọt trong mô hình VAC là gì?","options":["A. Hai ngành độc lập, không liên quan.","B. Hỗ trợ lẫn nhau: phụ phẩm trồng trọt làm thức ăn chăn nuôi, phân chuồng bón cho cây trồng.","C. Chăn nuôi cạnh tranh đất với trồng trọt.","D. Trồng trọt gây hại cho chăn nuôi."],"answer":"B","explain":"Trong mô hình VAC, các hợp phần hỗ trợ nhau tạo vòng tuần hoàn khép kín: chất thải, phụ phẩm của khâu này là đầu vào của khâu khác, giảm chi phí và ô nhiễm.","points":0.25},{"type":"mcq","level":"VD","q":"Trường học của em muốn tổ chức cho học sinh tham quan một mô hình chăn nuôi hiện đại để học tập. Nên chọn mô hình nào?","options":["A. Hộ nuôi 2 con lợn thả rông sau vườn.","B. Trang trại chăn nuôi ứng dụng công nghệ cao: chuồng trại tự động, xử lí chất thải bằng biogas.","C. Chợ bán gia súc.","D. Lò mổ thủ công."],"answer":"B","explain":"Trang trại công nghệ cao thể hiện đầy đủ xu hướng chăn nuôi hiện đại: tự động hóa, an toàn sinh học, xử lí môi trường — là mô hình học tập tốt nhất cho học sinh.","points":0.25},{"type":"mcq","level":"VDC","q":"Nhận định nào sau đây đúng nhất về tương lai của ngành chăn nuôi Việt Nam?","options":["A. Sẽ quay lại chăn nuôi nhỏ lẻ hoàn toàn.","B. Phát triển theo hướng trang trại quy mô lớn, công nghệ cao, an toàn sinh học, gắn với chế biến sâu và bảo vệ môi trường.","C. Sẽ biến mất vì mọi người chuyển sang ăn chay.","D. Chỉ phát triển ở thành phố."],"answer":"B","explain":"Định hướng phát triển chăn nuôi Việt Nam: chuyển từ nhỏ lẻ sang tập trung, ứng dụng công nghệ cao, đảm bảo an toàn dịch bệnh và thực phẩm, chế biến sâu nâng giá trị, hài hòa với môi trường.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chăn nuôi là ngành sản xuất có lịch sử lâu đời.","b) Xu hướng hiện nay là chăn nuôi trang trại quy mô lớn, công nghệ cao.","c) Chăn nuôi và bảo vệ môi trường luôn mâu thuẫn, không thể hài hòa.","d) An toàn sinh học giúp phòng ngừa dịch bệnh trong chăn nuôi."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: áp dụng công nghệ xử lí chất thải giúp hài hòa cả hai. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tự động hóa giúp giảm chi phí nhân công trong chăn nuôi.","b) Yêu cầu về an toàn thực phẩm ngày càng khắt khe thúc đẩy chăn nuôi công nghệ cao.","c) Mô hình VAC giúp tận dụng phụ phẩm, giảm chi phí sản xuất.","d) Chăn nuôi công nghệ cao không cần quan tâm đến môi trường."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: công nghệ cao càng phải gắn với xử lí chất thải, bảo vệ môi trường.","points":1},{"type":"short","level":"VD","q":"Nêu 2 đặc điểm của chăn nuôi trang trại hiện đại.","answer":"quy mô lớn, ứng dụng công nghệ cao","explain":"Chăn nuôi trang trại hiện đại có đặc điểm: quy mô lớn, vốn đầu tư cao, ứng dụng công nghệ cao (tự động hóa), áp dụng an toàn sinh học và xử lí chất thải bảo vệ môi trường.","points":0.5},{"type":"short","level":"VDC","q":"Định hướng phát triển chăn nuôi Việt Nam trong tương lai là gì? (trả lời ngắn gọn)","answer":"trang trại quy mô lớn, công nghệ cao, an toàn sinh học, gắn với chế biến sâu","explain":"Định hướng: chuyển từ chăn nuôi nhỏ lẻ sang trang trại tập trung quy mô lớn, ứng dụng công nghệ cao, đảm bảo an toàn sinh học và thực phẩm, chế biến sâu nâng cao giá trị, bảo vệ môi trường.","points":0.5}]}]}
