<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Kĩ thuật chăn nuôi là gì?","options":["A. Tổng hợp các biện pháp kĩ thuật về giống, thức ăn, chuồng trại, chăm sóc, thú y trong chăn nuôi.","B. Chỉ là cách cho vật nuôi ăn.","C. Chỉ là cách xây chuồng.","D. Là việc bán sản phẩm chăn nuôi."],"answer":"A","explain":"Kĩ thuật chăn nuôi bao gồm toàn bộ các biện pháp: chọn giống, thức ăn, chuồng trại, nuôi dưỡng, chăm sóc, phòng trị bệnh… nhằm đạt năng suất và hiệu quả cao.","points":0.25},{"type":"mcq","level":"NB","q":"Quy trình chăn nuôi chung gồm mấy giai đoạn?","options":["A. 2 giai đoạn.","B. 3 giai đoạn: chuẩn bị – nuôi dưỡng, chăm sóc – thu hoạch.","C. 5 giai đoạn.","D. 1 giai đoạn."],"answer":"B","explain":"Quy trình chung: (1) Chuẩn bị (giống, thức ăn, chuồng trại); (2) Nuôi dưỡng, chăm sóc; (3) Thu hoạch sản phẩm đúng thời điểm.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao giai đoạn chuẩn bị quan trọng trong quy trình chăn nuôi?","options":["A. Vì chuẩn bị kĩ giúp chủ động giống tốt, đủ thức ăn, chuồng trại hợp vệ sinh — tạo tiền đề cho cả lứa nuôi thành công.","B. Vì chuẩn bị tốn nhiều tiền.","C. Vì không chuẩn bị vẫn nuôi được.","D. Vì chuẩn bị chỉ để đối phó kiểm tra."],"answer":"A","explain":"“Đầu xuôi đuôi lọt”: giống tốt, thức ăn dự trữ đủ, chuồng trại sát trùng sạch trước khi nhập vật nuôi giúp lứa nuôi thuận lợi, ít rủi ro ngay từ đầu.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải thu hoạch sản phẩm đúng thời điểm?","options":["A. Vì để lâu sản phẩm càng ngon.","B. Vì thu đúng lúc cho năng suất, chất lượng tốt nhất và hiệu quả kinh tế cao nhất (tránh nuôi quá lứa tốn thức ăn).","C. Vì thu sớm luôn tốt hơn.","D. Không cần quan tâm thời điểm."],"answer":"B","explain":"Lợn nuôi quá lứa: tăng trọng chậm mà vẫn tốn thức ăn → lỗ. Trứng để lâu giảm chất lượng. Thu đúng thời điểm tối ưu hóa lợi nhuận.","points":0.25},{"type":"mcq","level":"VD","q":"Anh Tuấn nuôi 100 lợn thịt, đến 100 kg vẫn chưa bán vì chờ giá lên. Mỗi ngày đàn lợn ăn hết 300 kg cám mà tăng trọng rất chậm. Lời khuyên đúng là gì?","options":["A. Tiếp tục chờ giá, cho ăn nhiều hơn.","B. Nên xuất chuồng đúng khối lượng (khoảng 100–110 kg) vì nuôi quá lứa tốn thức ăn mà tăng trọng kém, hiệu quả kinh tế giảm.","C. Giảm khẩu phần để lợn gầy đi.","D. Bán hết lợn con."],"answer":"B","explain":"Lợn quá 110 kg: tốc độ tăng trọng giảm mạnh, hệ số chuyển hóa thức ăn kém. Nuôi cố tốn cám mà lãi giảm — nên xuất chuồng đúng thời điểm.","points":0.25},{"type":"mcq","level":"VDC","q":"Một hộ nuôi gà thịt 45 ngày đã đạt 2,5 kg/con nhưng muốn nuôi thêm 15 ngày cho nặng hơn để bán được nhiều tiền hơn. Phân tích nào đúng?","options":["A. Nên nuôi thêm vì gà càng nặng càng lãi.","B. Không nên: gà quá lứa tăng trọng chậm, tốn thức ăn, dễ bệnh; nên xuất chuồng đúng lứa và nhập lứa mới quay vòng vốn nhanh hơn.","C. Nên ngừng cho ăn để gà không tốn cám.","D. Nên bán gà con."],"answer":"B","explain":"Gà thịt có thời điểm xuất chuồng tối ưu (hệ số thức ăn thấp nhất). Nuôi quá lứa: tăng trọng chậm, tốn cám, rủi ro bệnh — quay vòng lứa mới hiệu quả hơn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Kĩ thuật chăn nuôi gồm các biện pháp về giống, thức ăn, chuồng trại, chăm sóc, thú y.","b) Quy trình chăn nuôi gồm: chuẩn bị – nuôi dưỡng, chăm sóc – thu hoạch.","c) Nên xuất chuồng, thu hoạch sản phẩm đúng thời điểm.","d) Nuôi quá lứa vẫn cho hiệu quả kinh tế cao."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: quá lứa tốn thức ăn mà tăng trọng kém.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chuẩn bị tốt tạo tiền đề cho lứa nuôi thành công.","b) Lợn nuôi quá 110 kg thường tăng trọng chậm, tốn thức ăn.","c) Trứng để lâu sẽ giảm chất lượng.","d) Thu hoạch càng muộn càng có lợi."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: muộn quá làm giảm hiệu quả kinh tế.","points":1},{"type":"short","level":"VD","q":"Kể tên 3 giai đoạn của quy trình chăn nuôi.","answer":"chuẩn bị, nuôi dưỡng chăm sóc, thu hoạch","explain":"Quy trình chăn nuôi chung: (1) Chuẩn bị; (2) Nuôi dưỡng, chăm sóc; (3) Thu hoạch — xuyên suốt là ghi chép, theo dõi và phòng bệnh.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao không nên nuôi lợn thịt quá lứa (trên 110 kg)?","answer":"vì tăng trọng chậm mà vẫn tốn nhiều thức ăn làm giảm hiệu quả kinh tế","explain":"Lợn quá lứa: tốc độ tăng trọng giảm, hệ số chuyển hóa thức ăn kém (ăn nhiều mà lớn ít), lại tăng rủi ro bệnh — nên xuất chuồng đúng thời điểm tối ưu.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Vật nuôi non có đặc điểm nào?","options":["A. Chưa điều tiết thân nhiệt tốt, hệ tiêu hóa và miễn dịch chưa hoàn chỉnh.","B. Đã hoàn thiện mọi chức năng như vật trưởng thành.","C. Không cần chăm sóc đặc biệt.","D. Tự kiếm ăn ngay sau khi sinh."],"answer":"A","explain":"Vật nuôi non còn yếu: chưa giữ ấm tốt, tiêu hóa kém, ít kháng thể — nên cần giữ ấm, cho bú sữa đầu, tập ăn sớm và vệ sinh phòng bệnh cẩn thận.","points":0.25},{"type":"mcq","level":"NB","q":"Sữa đầu của vật nuôi mẹ có vai trò gì?","options":["A. Giàu kháng thể, giúp con non chống lại bệnh tật.","B. Chỉ để con non no bụng.","C. Không có vai trò gì.","D. Làm con non chậm lớn."],"answer":"A","explain":"Sữa đầu (sữa non) giàu kháng thể mẹ truyền, giúp con non có miễn dịch thụ động chống bệnh trong những ngày đầu đời — phải cho bú sớm trong giờ đầu sau sinh.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải giữ ấm cho gà con trong tuần đầu (32–35 độ C)?","options":["A. Vì gà con chưa điều tiết thân nhiệt tốt, dễ chết rét; đủ ấm giúp gà khỏe, ăn ngon, lớn nhanh.","B. Vì gà con thích nóng.","C. Vì để tốn điện.","D. Vì gà con sợ ánh sáng."],"answer":"A","explain":"Gà con mới nở hệ điều tiết thân nhiệt chưa hoàn chỉnh. Lạnh gây tụm đống, bỏ ăn, dễ bệnh và chết. Úm đủ ấm là kĩ thuật sống còn trong nuôi gà con.","points":0.25},{"type":"mcq","level":"TH","q":"Tập cho vật nuôi non ăn sớm có tác dụng gì?","options":["A. Giúp hệ tiêu hóa phát triển, con non cứng cáp, giảm phụ thuộc vào sữa mẹ, cai sữa thuận lợi.","B. Làm con non biếng bú.","C. Không có tác dụng.","D. Làm con non chậm lớn."],"answer":"A","explain":"Tập ăn sớm kích thích men tiêu hóa, dạ dày phát triển; con non nhận thêm dinh dưỡng ngoài sữa mẹ nên lớn nhanh, cai sữa dễ dàng, ít stress.","points":0.25},{"type":"mcq","level":"VD","q":"Đàn gà con của chị Phương 3 ngày tuổi bị tụm đống dưới đèn, kêu chiếp chiếp, ít ăn. Nguyên nhân và cách xử lí là gì?","options":["A. Gà bị lạnh (thiếu nhiệt úm); cần tăng nhiệt độ úm, quây kín tránh gió lùa.","B. Gà bị nóng; tắt đèn sưởi.","C. Gà no; không cần làm gì.","D. Gà thích tụm đống; kệ chúng."],"answer":"A","explain":"Gà con tụm đống dưới đèn, kêu nhiều là dấu hiệu bị lạnh (thiếu nhiệt). Cần tăng nhiệt úm lên 32–35 độ C, quây kín chắn gió — ngược lại, gà tản ra xa đèn, há mỏ thở là bị nóng.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trại lợn có tỉ lệ lợn con theo mẹ chết cao (20%). Kiểm tra: ô đẻ lạnh, ẩm; lợn con không được bú sữa đầu sớm. Giải pháp tổng hợp nào hiệu quả nhất?","options":["A. Mua thuốc bổ đắt tiền.","B. Cải thiện ô đẻ (ấm, khô, sát trùng), đỡ đẻ đúng kĩ thuật, cho bú sữa đầu trong giờ đầu, giữ ấm ô úm.","C. Tăng số lợn nái.","D. Bán hết lợn con."],"answer":"B","explain":"Nguyên nhân chết là lạnh, nhiễm trùng và thiếu kháng thể sữa đầu. Giải pháp phải đồng bộ: môi trường đẻ ấm, khô, sạch + bú sữa đầu sớm + úm ấm — giải quyết đúng 3 gốc rễ, hiệu quả hơn mọi loại thuốc bổ.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vật nuôi non chưa điều tiết thân nhiệt tốt.","b) Sữa đầu giàu kháng thể giúp con non chống bệnh.","c) Gà con cần được úm ấm 32–35 độ C trong tuần đầu.","d) Không cần tập cho vật nuôi non ăn sớm."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: tập ăn sớm giúp tiêu hóa phát triển, cai sữa thuận lợi.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Gà con tụm đống dưới đèn là dấu hiệu bị lạnh.","b) Cho bú sữa đầu sớm giúp con non có kháng thể.","c) Ô đẻ lạnh, ẩm làm tăng tỉ lệ chết của vật nuôi non.","d) Vật nuôi non có sức đề kháng tốt như vật trưởng thành."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: hệ miễn dịch của con non chưa hoàn chỉnh.","points":1},{"type":"short","level":"VD","q":"Nêu 2 việc cần làm khi chăm sóc vật nuôi non.","answer":"giữ ấm, cho bú sữa đầu","explain":"Chăm sóc vật nuôi non: giữ ấm (úm), cho bú sữa đầu sớm, tập ăn sớm, vệ sinh phòng bệnh, cho vận động, tắm nắng.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao ô đẻ lạnh, ẩm làm tăng tỉ lệ chết của lợn con sơ sinh?","answer":"vì lợn con dễ bị lạnh và nhiễm trùng khi sức đề kháng còn yếu","explain":"Lợn con sơ sinh chưa điều tiết thân nhiệt, hệ miễn dịch yếu. Ô đẻ lạnh gây hạ thân nhiệt, chết rét; ẩm ướt là môi trường cho vi khuẩn gây tiêu chảy, nhiễm trùng rốn — hai nguyên nhân chết hàng đầu.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Chăm sóc lợn nái mang thai cần lưu ý gì?","options":["A. Tăng dần khẩu phần theo thai kì, tránh stress và va chạm mạnh.","B. Cho nhịn ăn.","C. Đuổi chạy nhiều cho khỏe.","D. Không cần quan tâm."],"answer":"A","explain":"Nái mang thai cần thêm dinh dưỡng nuôi thai (tăng dần, nhất là 1/3 cuối thai kì); tránh stress, va chạm mạnh dễ gây sảy thai.","points":0.25},{"type":"mcq","level":"NB","q":"Chăm sóc vật nuôi đực giống cần chú ý gì?","options":["A. Cho ăn đủ dinh dưỡng, vận động thường xuyên, tránh béo phì; khai thác phối giống hợp lí.","B. Nhốt một chỗ không cho vận động.","C. Cho ăn càng nhiều càng tốt.","D. Khai thác phối giống liên tục không nghỉ."],"answer":"A","explain":"Đực giống béo phì thì tinh dịch kém, phối giống kém hiệu quả; lạm dụng khai thác làm kiệt sức. Cần dinh dưỡng cân đối, vận động đều và lịch phối hợp lí.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao vật nuôi đực giống béo phì lại phối giống kém?","options":["A. Vì nặng nên lười vận động.","B. Vì mỡ thừa ảnh hưởng đến sinh lí sinh dục, làm giảm chất lượng tinh dịch và khả năng phối giống.","C. Vì béo nên đẹp.","D. Vì béo không ảnh hưởng gì."],"answer":"B","explain":"Béo phì rối loạn nội tiết sinh dục, giảm chất lượng và số lượng tinh trùng, đực lười phối — nên phải kiểm soát thể trạng đực giống ở mức vừa phải.","points":0.25},{"type":"mcq","level":"TH","q":"Cai sữa cho vật nuôi non cần thực hiện như thế nào?","options":["A. Cai đột ngột, tách mẹ ngay.","B. Cai dần, chuyển thức ăn từ từ để cả mẹ và con thích nghi, giảm stress.","C. Không cần cai sữa.","D. Cho con non nhịn ăn 1 tuần."],"answer":"B","explain":"Cai đột ngột gây stress: con bỏ ăn, tiêu chảy; mẹ căng sữa dễ viêm vú. Cai dần (giảm dần số lần bú, tăng thức ăn) giúp cả hai thích nghi êm thấm.","points":0.25},{"type":"mcq","level":"VD","q":"Lợn nái của ông Ba sắp đẻ 1 tuần nhưng vẫn nhốt chung với đàn lợn thịt, chuồng bẩn. Rủi ro và cách xử lí là gì?","options":["A. Không có rủi ro gì.","B. Dễ sảy thai do va chạm, lợn con dễ nhiễm bệnh; cần chuyển nái vào ô đẻ riêng đã vệ sinh, sát trùng trước đẻ 1 tuần.","C. Cho nái ăn ít đi.","D. Bán nái đi."],"answer":"B","explain":"Nái sắp đẻ nhốt chung dễ bị húc, sảy thai; chuồng bẩn gây nhiễm trùng sau đẻ. Phải chuyển ô đẻ riêng sạch sẽ, sát trùng trước 1 tuần để nái quen chỗ.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trại bò sữa có tỉ lệ phối giống đậu thai thấp. Kiểm tra thấy bò đực giống béo phì, ít vận động. Giải pháp nào đúng?","options":["A. Thay toàn bộ đàn bò.","B. Điều chỉnh khẩu phần giảm năng lượng, tăng vận động cho đực giống; kiểm tra, đánh giá lại chất lượng tinh dịch định kì.","C. Cho đực giống ăn nhiều hơn.","D. Ngừng phối giống 1 năm."],"answer":"B","explain":"Nguyên nhân là đực giống béo phì → chất lượng tinh kém. Khắc phục: giảm khẩu phần năng lượng, tăng vận động để về thể trạng chuẩn; đồng thời kiểm tra tinh dịch định kì để đánh giá hiệu quả.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nái mang thai cần tăng dần khẩu phần và tránh va chạm mạnh.","b) Đực giống cần vận động thường xuyên, tránh béo phì.","c) Nên cai sữa đột ngột cho vật nuôi non.","d) Nái sắp đẻ nên chuyển vào ô đẻ riêng sạch sẽ."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: cai đột ngột gây stress, nên cai dần. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đực giống béo phì làm giảm chất lượng tinh dịch.","b) Cai sữa dần giúp mẹ và con thích nghi tốt.","c) Va chạm mạnh có thể gây sảy thai cho nái mang thai.","d) Đực giống càng béo càng phối giống tốt."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: béo phì làm giảm khả năng sinh sản.","points":1},{"type":"short","level":"VD","q":"Nêu 2 lưu ý khi chăm sóc lợn nái mang thai.","answer":"tăng khẩu phần dần, tránh stress va chạm mạnh","explain":"Chăm sóc nái mang thai: tăng dần khẩu phần theo thai kì (đủ dinh dưỡng nuôi thai); chuồng yên tĩnh, tránh stress, va chạm mạnh gây sảy thai.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao nên cai sữa dần thay vì cai đột ngột cho vật nuôi non?","answer":"để tránh stress cho cả mẹ và con","explain":"Cai đột ngột: con bỏ ăn, tiêu chảy do stress; mẹ căng sữa dễ viêm vú. Cai dần (giảm bú, tăng thức ăn từ từ) giúp cả hai thích nghi, khỏe mạnh.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Chăn nuôi quảng canh có đặc điểm nào?","options":["A. Tận dụng tự nhiên, đầu tư thấp, năng suất thấp.","B. Đầu tư rất cao, năng suất rất cao.","C. Hoàn toàn tự động hóa.","D. Không cần diện tích."],"answer":"A","explain":"Quảng canh: chăn thả tự nhiên, ít đầu tư (giống, thức ăn, thú y), năng suất thấp, phụ thuộc thiên nhiên — ví dụ chăn thả trâu bò trên đồng cỏ.","points":0.25},{"type":"mcq","level":"NB","q":"Chăn nuôi thâm canh có đặc điểm nào?","options":["A. Đầu tư cao, kiểm soát tốt các yếu tố, năng suất cao.","B. Đầu tư thấp, năng suất thấp.","C. Thả rông hoàn toàn.","D. Không cần kĩ thuật."],"answer":"A","explain":"Thâm canh: đầu tư lớn về giống, thức ăn, chuồng trại, thú y; kiểm soát chặt chẽ; năng suất cao — ví dụ nuôi lợn, gà công nghiệp chuồng kín.","points":0.25},{"type":"mcq","level":"TH","q":"So sánh hiệu quả kinh tế giữa chăn nuôi quảng canh và thâm canh, nhận định nào đúng?","options":["A. Quảng canh luôn lãi hơn thâm canh.","B. Thâm canh cho năng suất và lợi nhuận trên đơn vị diện tích/vốn cao hơn nhưng rủi ro và vốn đầu tư cũng lớn hơn.","C. Hai hình thức như nhau.","D. Thâm canh không cần vốn."],"answer":"B","explain":"Thâm canh: năng suất cao, quay vòng nhanh, lãi trên đơn vị cao; nhưng vốn lớn, dịch bệnh có thể gây thiệt hại nặng. Quảng canh: ít vốn, ít rủi ro nhưng năng suất thấp.","points":0.25},{"type":"mcq","level":"TH","q":"Chăn nuôi bán thâm canh phù hợp với đối tượng nào?","options":["A. Nông hộ có vốn trung bình, muốn nâng năng suất nhưng chưa đủ điều kiện thâm canh hoàn toàn.","B. Chỉ phù hợp công ty lớn.","C. Không phù hợp với ai.","D. Chỉ phù hợp nuôi cá."],"answer":"A","explain":"Bán thâm canh (ví dụ gà thả vườn bổ sung cám) là bước chuyển từ quảng canh lên thâm canh, phù hợp nông hộ: vốn vừa phải, tận dụng được điều kiện tự nhiên mà năng suất cao hơn hẳn.","points":0.25},{"type":"mcq","level":"VD","q":"Gia đình em có 2 sào vườn, vốn ít, muốn nuôi gà lấy thịt và trứng. Nên chọn hình thức nào?","options":["A. Nuôi gà thả vườn bán thâm canh: gà vận động tự nhiên, bổ sung cám, tiêm phòng đầy đủ.","B. Xây chuồng kín 10.000 con.","C. Thả gà tự kiếm ăn, không chăm sóc gì.","D. Không nuôi gà."],"answer":"A","explain":"Với vườn rộng, vốn ít: gà thả vườn bán thâm canh tận dụng được không gian, côn trùng, rau cỏ; bổ sung cám và thú y giúp gà lớn nhanh, thịt thơm ngon, được giá.","points":0.25},{"type":"mcq","level":"VDC","q":"Một doanh nghiệp có vốn lớn muốn sản xuất trứng gà công nghiệp cạnh tranh. Lựa chọn nào đúng đắn nhất?","options":["A. Nuôi gà thả vườn quảng canh.","B. Đầu tư trang trại thâm canh: giống chuyên trứng, chuồng kín tự động, quy trình khép kín.","C. Thu mua trứng nông hộ về bán lại.","D. Nuôi mỗi nhà một ít."],"answer":"B","explain":"Sản xuất hàng hóa cạnh tranh đòi hỏi năng suất cao, chất lượng đồng đều, giá thành thấp — chỉ chăn nuôi thâm canh công nghiệp với giống chuyên dụng và tự động hóa mới đáp ứng được.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chăn nuôi quảng canh đầu tư thấp, năng suất thấp.","b) Chăn nuôi thâm canh đầu tư cao, năng suất cao.","c) Chăn nuôi bán thâm canh kết hợp tự nhiên và đầu tư.","d) Mọi hình thức chăn nuôi đều cho năng suất như nhau."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: năng suất tăng theo mức đầu tư và kĩ thuật.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thâm canh cho lợi nhuận trên đơn vị cao hơn nhưng rủi ro lớn hơn.","b) Bán thâm canh phù hợp với nông hộ vốn trung bình.","c) Gà thả vườn bổ sung cám là ví dụ bán thâm canh.","d) Thâm canh không cần vốn đầu tư."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: thâm canh đòi hỏi vốn đầu tư lớn.","points":1},{"type":"short","level":"VD","q":"Sắp xếp các hình thức chăn nuôi theo mức độ đầu tư tăng dần.","answer":"quảng canh, bán thâm canh, thâm canh","explain":"Mức độ đầu tư và năng suất tăng dần: quảng canh → bán thâm canh → thâm canh.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao doanh nghiệp sản xuất hàng hóa nên chọn chăn nuôi thâm canh?","answer":"vì cho năng suất cao chất lượng đồng đều và giá thành cạnh tranh","explain":"Thâm canh với giống chuyên dụng, tự động hóa cho năng suất cao, sản phẩm đồng đều, giá thành thấp — đáp ứng yêu cầu cạnh tranh của sản xuất hàng hóa quy mô lớn.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Chăn nuôi hữu cơ có đặc điểm nào?","options":["A. Không dùng kháng sinh bừa bãi, thức ăn hữu cơ, đảm bảo phúc lợi động vật.","B. Dùng thật nhiều kháng sinh.","C. Nuôi nhốt chật chội.","D. Không cần quan tâm môi trường."],"answer":"A","explain":"Chăn nuôi hữu cơ tuân thủ nghiêm ngặt: thức ăn hữu cơ, hạn chế kháng sinh/hóa chất, vật nuôi được vận động tự nhiên (phúc lợi động vật), sản phẩm an toàn, giá cao.","points":0.25},{"type":"mcq","level":"NB","q":"Công nghệ nào giúp theo dõi sức khỏe từng con vật nuôi?","options":["A. Cảm biến, vòng cổ theo dõi (IoT).","B. Máy cày.","C. Lò ấp trứng.","D. Máy băm cỏ."],"answer":"A","explain":"Cảm biến đeo trên vật nuôi (vòng cổ) thu thập dữ liệu hoạt động, thân nhiệt theo thời gian thực, giúp phát hiện sớm vật nuôi ốm.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao sản phẩm chăn nuôi hữu cơ bán được giá cao hơn?","options":["A. Vì sản xuất tốn kém hơn.","B. Vì đáp ứng nhu cầu thực phẩm an toàn, truy xuất được nguồn gốc của người tiêu dùng có thu nhập cao.","C. Vì hữu cơ cho năng suất cao nhất.","D. Vì nhà nước quy định giá."],"answer":"B","explain":"Người tiêu dùng sẵn sàng trả giá cao cho thực phẩm an toàn, không tồn dư kháng sinh, truy xuất được nguồn gốc — đó là giá trị cốt lõi của sản phẩm hữu cơ.","points":0.25},{"type":"mcq","level":"TH","q":"Phần mềm quản lí trang trại giúp ích gì?","options":["A. Ghi chép khẩu phần, năng suất, thú y; phân tích hiệu quả; truy xuất nguồn gốc sản phẩm.","B. Thay thế người chăn nuôi.","C. Tự cho vật nuôi ăn.","D. Không có ích gì."],"answer":"A","explain":"Phần mềm số hóa mọi dữ liệu trang trại, giúp phân tích (lứa nào lãi, khâu nào tốn kém), ra quyết định chính xác và truy xuất nguồn gốc khi cần.","points":0.25},{"type":"mcq","level":"VD","q":"Trang trại 2000 lợn của anh Dũng ghi chép mọi thứ bằng sổ tay, hay thất lạc số liệu. Giải pháp hiện đại là gì?","options":["A. Thuê thêm 10 người ghi chép.","B. Ứng dụng phần mềm quản lí trang trại trên điện thoại/máy tính để nhập liệu, theo dõi, báo cáo tự động.","C. Ngừng ghi chép.","D. Giảm số lợn xuống."],"answer":"B","explain":"Phần mềm quản lí giúp nhập liệu nhanh, lưu trữ an toàn, báo cáo tự động (tăng trọng, tiêu tốn thức ăn, lãi lỗ) — quản trị trang trại hiện đại, chính xác.","points":0.25},{"type":"mcq","level":"VDC","q":"Một siêu thị yêu cầu trứng gà phải truy xuất được: trang trại nào, ngày đẻ, thức ăn, tiêm phòng. Trang trại cần làm gì để đáp ứng?","options":["A. Không thể đáp ứng.","B. Ghi chép đầy đủ, số hóa dữ liệu từng lô trứng (ngày đẻ, đàn gà, thức ăn, thú y) và dán mã truy xuất trên bao bì.","C. Nói dối siêu thị.","D. Bán trứng không nhãn mác."],"answer":"B","explain":"Truy xuất nguồn gốc đòi hỏi hệ thống ghi chép đầy đủ, chính xác từng lô sản phẩm + mã QR/tem truy xuất. Đây là xu thế tất yếu của thực phẩm an toàn hiện đại.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chăn nuôi hữu cơ hạn chế kháng sinh và hóa chất.","b) Cảm biến giúp theo dõi sức khỏe vật nuôi theo thời gian thực.","c) Sản phẩm hữu cơ thường có giá bán cao hơn.","d) Phần mềm quản lí giúp truy xuất nguồn gốc sản phẩm."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Người tiêu dùng ưa chuộng thực phẩm an toàn, truy xuất được nguồn gốc.","b) Số hóa dữ liệu giúp quản trị trang trại chính xác hơn.","c) Truy xuất nguồn gốc cần ghi chép đầy đủ từng lô sản phẩm.","d) Chăn nuôi hữu cơ cho năng suất cao nhất trong mọi hình thức."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: hữu cơ thường năng suất thấp hơn thâm canh, bù lại giá trị và an toàn cao.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 công nghệ cao ứng dụng trong kĩ thuật chăn nuôi.","answer":"tự động hóa, cảm biến IoT","explain":"Các công nghệ cao: tự động hóa (cho ăn, vắt sữa…), cảm biến IoT theo dõi sức khỏe, phần mềm quản lí và truy xuất nguồn gốc.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao truy xuất nguồn gốc ngày càng trở thành yêu cầu bắt buộc với sản phẩm chăn nuôi?","answer":"vì người tiêu dùng cần thực phẩm an toàn và minh bạch","explain":"Ngộ độc thực phẩm, tồn dư kháng sinh khiến người tiêu dùng đòi hỏi minh bạch: sản phẩm từ đâu, nuôi thế nào. Truy xuất nguồn gốc tạo niềm tin, là điều kiện vào siêu thị và xuất khẩu.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Ghi chép trong chăn nuôi có vai trò gì?","options":["A. Theo dõi năng suất, chi phí, sức khỏe đàn; làm cơ sở đánh giá hiệu quả và truy xuất nguồn gốc.","B. Chỉ để đối phó kiểm tra.","C. Không có vai trò gì.","D. Làm tốn thời gian vô ích."],"answer":"A","explain":"Ghi chép đầy đủ (thức ăn, thuốc, năng suất, thu chi) giúp đánh giá lứa nuôi lãi lỗ, phát hiện khâu yếu và là cơ sở truy xuất nguồn gốc sản phẩm.","points":0.25},{"type":"mcq","level":"NB","q":"Cho vật nuôi vận động, tắm nắng có tác dụng gì?","options":["A. Giúp cứng cáp, tổng hợp vitamin D, tăng sức đề kháng.","B. Làm vật nuôi mệt mỏi.","C. Không có tác dụng.","D. Làm vật nuôi chậm lớn."],"answer":"A","explain":"Vận động giúp cơ xương chắc khỏe; tắm nắng giúp tổng hợp vitamin D (hấp thu canxi), diệt khuẩn ngoài da — vật nuôi cứng cáp, ít bệnh.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao chăn nuôi nông hộ nên ghi chép đơn giản hằng ngày?","options":["A. Để khoe với hàng xóm.","B. Để biết chính xác chi phí, thu nhập, phát hiện khâu nào tốn kém, lứa nào hiệu quả để điều chỉnh.","C. Vì pháp luật bắt buộc mọi hộ.","D. Không cần thiết."],"answer":"B","explain":"Nhiều hộ nuôi theo cảm tính, không biết lãi lỗ thực. Ghi chép đơn giản (tiền cám, tiền giống, tiền bán…) giúp tính được lợi nhuận và quyết định có nên tiếp tục, mở rộng hay thay đổi.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa các yếu tố giống, thức ăn, chuồng trại, chăm sóc, thú y trong kĩ thuật chăn nuôi là gì?","options":["A. Độc lập, không liên quan.","B. Tác động tổng hợp, bổ sung cho nhau; yếu một khâu sẽ kéo hiệu quả chung xuống.","C. Chỉ cần một yếu tố tốt là đủ.","D. Các yếu tố mâu thuẫn nhau."],"answer":"B","explain":"Năng suất là kết quả tổng hợp: giống tốt + thức ăn tốt + chuồng tốt + chăm sóc tốt + thú y tốt. Một khâu yếu (ví dụ dịch bệnh) có thể phá hỏng cả lứa nuôi — phải đồng bộ.","points":0.25},{"type":"mcq","level":"VD","q":"Hộ bác Năm nuôi lợn: giống tốt, cám tốt nhưng chuồng bẩn, không tiêm phòng nên lợn hay bệnh, lãi thấp. Bài học là gì?","options":["A. Nên đổi giống khác.","B. Kĩ thuật chăn nuôi phải đồng bộ các khâu; yếu khâu vệ sinh, thú y thì giống tốt, cám tốt cũng không phát huy được.","C. Nên cho ăn nhiều hơn.","D. Nên bán hết lợn."],"answer":"B","explain":"Trường hợp điển hình của “mạnh khâu này, yếu khâu kia”. Bệnh tật triệt tiêu mọi ưu thế của giống và thức ăn — phải chăm sóc đồng bộ, nhất là vệ sinh phòng bệnh.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai trang trại cùng quy mô, giống, thức ăn như nhau nhưng lợi nhuận chênh lệch lớn. Yếu tố nào có thể giải thích?","options":["A. Không thể giải thích được.","B. Khác nhau ở trình độ quản lí, kĩ thuật chăm sóc: ghi chép, phòng bệnh, thu hoạch đúng thời điểm, giảm hao hụt — những yếu tố “mềm” quyết định.","C. Do may rủi.","D. Do giá cám khác nhau."],"answer":"B","explain":"Khi đầu vào như nhau, chênh lệch lợi nhuận đến từ quản trị: ai chăm sóc tốt hơn, phòng bệnh tốt hơn, hao hụt ít hơn, bán đúng thời điểm hơn sẽ lãi hơn — kĩ thuật và quản lí là yếu tố quyết định.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Ghi chép giúp đánh giá hiệu quả chăn nuôi.","b) Vận động, tắm nắng giúp vật nuôi cứng cáp, tăng sức đề kháng.","c) Các yếu tố kĩ thuật chăn nuôi tác động tổng hợp đến năng suất.","d) Chỉ cần giống tốt là đủ, các khâu khác không quan trọng."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: phải đồng bộ các khâu.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nông hộ nên ghi chép chi phí, thu nhập đơn giản hằng ngày.","b) Khâu vệ sinh, thú y yếu có thể triệt tiêu ưu thế của giống tốt.","c) Trình độ quản lí, chăm sóc ảnh hưởng lớn đến lợi nhuận.","d) Hao hụt thức ăn không ảnh hưởng đến lợi nhuận."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: thức ăn chiếm 60–70% giá thành nên hao hụt ảnh hưởng lớn.","points":1},{"type":"short","level":"VD","q":"Nêu 2 nội dung cần ghi chép trong chăn nuôi.","answer":"chi phí thức ăn, năng suất thu hoạch","explain":"Nội dung ghi chép: chi phí (giống, thức ăn, thuốc, điện…), năng suất (tăng trọng, số trứng, lượng sữa), tình hình sức khỏe, thu nhập — để đánh giá hiệu quả.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao hai trang trại cùng giống, cùng thức ăn mà lợi nhuận chênh lệch lớn?","answer":"vì khác nhau ở trình độ quản lí và kĩ thuật chăm sóc","explain":"Kĩ thuật chăm sóc, phòng bệnh, ghi chép, giảm hao hụt, thu hoạch đúng thời điểm — những yếu tố “mềm” trong quản trị — quyết định chênh lệch lợi nhuận khi đầu vào như nhau.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Trước khi nhập vật nuôi mới về, cần chuẩn bị gì?","options":["A. Vệ sinh, sát trùng chuồng trại; chuẩn bị đủ thức ăn, nước uống, dụng cụ.","B. Không cần chuẩn bị gì.","C. Chỉ cần chuẩn bị tiền bán.","D. Đợi vật nuôi về rồi tính."],"answer":"A","explain":"Chuồng trại phải được vệ sinh, sát trùng sạch, để trống trước khi nhập lứa mới; chuẩn bị đủ thức ăn, nước, thuốc thú y, dụng cụ — “chuẩn bị kĩ thì nuôi nhàn”.","points":0.25},{"type":"mcq","level":"NB","q":"Phúc lợi động vật trong chăn nuôi là gì?","options":["A. Đảm bảo vật nuôi được sống thoải mái: đủ ăn, đủ uống, không bị hành hạ, có không gian vận động.","B. Cho vật nuôi xem phim.","C. Không cần quan tâm.","D. Chỉ áp dụng cho thú cưng."],"answer":"A","explain":"Phúc lợi động vật: vật nuôi không bị đói khát, đau đớn, sợ hãi; được thể hiện tập tính tự nhiên — là yêu cầu của chăn nuôi hiện đại, nhất là chăn nuôi hữu cơ.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao đảm bảo phúc lợi động vật lại giúp tăng năng suất?","options":["A. Vì vật nuôi vui vẻ.","B. Vì vật nuôi thoải mái, ít stress sẽ ăn ngon, khỏe mạnh, sinh sản tốt hơn — stress làm giảm năng suất rõ rệt.","C. Vì pháp luật yêu cầu.","D. Không liên quan đến năng suất."],"answer":"B","explain":"Stress (chật chội, nóng, sợ hãi) làm vật nuôi bỏ ăn, giảm tiết sữa, giảm đẻ. Môi trường thoải mái giúp vật nuôi phát huy tối đa tiềm năng — phúc lợi cũng là kinh tế.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các việc sau, việc nào thể hiện đảm bảo phúc lợi động vật?","options":["A. Nhốt gà đẻ trong lồng chật không thể đứng thẳng.","B. Cho gà không gian vận động, đủ máng ăn, uống, chuồng thoáng mát.","C. Bỏ đói vật nuôi.","D. Đánh đập vật nuôi."],"answer":"B","explain":"Phúc lợi động vật yêu cầu không gian vận động, đủ ăn uống, môi trường thoải mái, không hành hạ — xu hướng chăn nuôi nhân đạo hiện đại.","points":0.25},{"type":"mcq","level":"VD","q":"Trang trại gà đẻ của ông Hải mật độ quá cao, gà cắn mổ nhau, đẻ giảm. Biện pháp nào vừa đảm bảo phúc lợi vừa tăng năng suất?","options":["A. Cắt mỏ tất cả gà.","B. Giảm mật độ, đảm bảo đủ máng ăn, uống, ánh sáng hợp lí; gà thoải mái sẽ ít cắn mổ, đẻ tốt hơn.","C. Nhốt gà vào chỗ tối hoàn toàn.","D. Bán hết gà."],"answer":"B","explain":"Cắn mổ do stress chật chội. Giảm mật độ, đủ ăn uống, môi trường tốt giải quyết gốc rễ: gà thoải mái, ít stress, đẻ tốt hơn — vừa nhân đạo vừa kinh tế.","points":0.25},{"type":"mcq","level":"VDC","q":"Xu hướng “trứng gà nuôi thả” (cage-free) được ưa chuộng dù giá cao hơn trứng lồng. Điều này phản ánh gì?","options":["A. Người tiêu dùng lãng phí tiền.","B. Người tiêu dùng ngày càng quan tâm phúc lợi động vật và sẵn sàng trả giá cao cho sản phẩm nhân đạo, an toàn.","C. Trứng thả luôn to hơn.","D. Nuôi lồng đã bị cấm hoàn toàn."],"answer":"B","explain":"Người tiêu dùng hiện đại, nhất là ở đô thị, quan tâm đến cách vật nuôi được đối xử; họ trả giá cao hơn cho sản phẩm từ hệ thống đảm bảo phúc lợi — mở ra phân khúc thị trường giá trị cao.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trước khi nhập lứa mới cần vệ sinh, sát trùng chuồng trại.","b) Phúc lợi động vật là đảm bảo vật nuôi sống thoải mái, không bị hành hạ.","c) Stress làm giảm năng suất vật nuôi.","d) Chật chội, thiếu ăn uống vẫn đảm bảo phúc lợi động vật."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: đó là vi phạm phúc lợi động vật.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Môi trường thoải mái giúp vật nuôi phát huy tối đa tiềm năng.","b) Giảm mật độ nuôi giúp gà ít cắn mổ, đẻ tốt hơn.","c) Người tiêu dùng ngày càng quan tâm đến phúc lợi động vật.","d) Phúc lợi động vật không liên quan đến hiệu quả kinh tế."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: phúc lợi tốt giúp tăng năng suất, mở phân khúc giá cao.","points":1},{"type":"short","level":"VD","q":"Nêu 2 biểu hiện của việc đảm bảo phúc lợi động vật trong chăn nuôi.","answer":"đủ không gian vận động, đủ thức ăn nước uống","explain":"Phúc lợi động vật: đủ không gian vận động, đủ ăn uống, môi trường thoải mái, không bị hành hạ, được thể hiện tập tính tự nhiên.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao stress làm giảm năng suất vật nuôi?","answer":"vì vật nuôi bỏ ăn giảm tiết sữa giảm đẻ khi bị stress","explain":"Stress (nóng, chật, sợ hãi) kích thích cơ thể tiết hormon ức chế: vật nuôi bỏ ăn, giảm tiết sữa, giảm đẻ trứng, chậm lớn, dễ bệnh — năng suất giảm rõ rệt.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Tự động hóa trong chăn nuôi giúp ích gì?","options":["A. Giảm công lao động nặng nhọc, tăng độ chính xác, nâng năng suất.","B. Thay thế hoàn toàn con người.","C. Làm vật nuôi lười biếng.","D. Không có ích gì."],"answer":"A","explain":"Tự động hóa (cho ăn, vắt sữa, thu trứng, dọn phân) giảm lao động thủ công nặng nhọc, thực hiện chính xác, đúng giờ — nâng năng suất và giảm chi phí.","points":0.25},{"type":"mcq","level":"NB","q":"Dấu hiệu nào cho thấy vật nuôi bị bệnh cần can thiệp?","options":["A. Bỏ ăn, ủ rũ, lông xù, phân bất thường, sốt.","B. Ăn khỏe, nhanh nhẹn.","C. Lông mượt, mắt sáng.","D. Chạy nhảy bình thường."],"answer":"A","explain":"Bỏ ăn, ủ rũ, xù lông, phân lỏng/bất thường, sốt là dấu hiệu bệnh điển hình — cần cách li, theo dõi và xử lí thú y kịp thời.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao phải phát hiện sớm vật nuôi bị bệnh?","options":["A. Để bán ngay.","B. Để cách li, điều trị kịp thời, ngăn lây lan cho cả đàn, giảm thiệt hại.","C. Để làm thịt ăn.","D. Không cần thiết."],"answer":"B","explain":"Phát hiện sớm → cách li ngay → điều trị sớm hiệu quả cao, chi phí thấp; đồng thời ngăn mầm bệnh lây lan — “một con ốm cả đàn nguy”.","points":0.25},{"type":"mcq","level":"TH","q":"Trong chăm sóc hằng ngày, việc quan sát đàn vật nuôi có vai trò gì?","options":["A. Chỉ để giải trí.","B. Phát hiện sớm con ốm, con bỏ ăn, bất thường để xử lí kịp thời — là kĩ năng quan trọng nhất của người chăn nuôi.","C. Không có vai trò gì.","D. Làm vật nuôi sợ hãi."],"answer":"B","explain":"Quan sát hằng ngày (lúc cho ăn là tốt nhất) giúp phát hiện sớm dấu hiệu bất thường. Người chăn nuôi giỏi là người “đọc” được đàn vật nuôi của mình.","points":0.25},{"type":"mcq","level":"VD","q":"Buổi sáng cho ăn, bạn An thấy một con lợn nằm riêng, không dậy ăn, thở nhanh. Bạn nên làm gì?","options":["A. Kệ nó, chiều tính tiếp.","B. Cách li con lợn ra ô riêng, đo thân nhiệt, theo dõi và báo người lớn/thú y xử lí.","C. Đuổi nó dậy ăn.","D. Cho cả đàn uống thuốc ngay."],"answer":"B","explain":"Nằm riêng, bỏ ăn, thở nhanh là dấu hiệu bệnh. Phải cách li ngay để tránh lây lan, theo dõi triệu chứng và nhờ thú y chẩn đoán, điều trị — không tự ý cho cả đàn uống thuốc.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trang trại áp dụng “mỗi ngày 10 phút quan sát đàn lúc cho ăn” và ghi chép bất thường. Hiệu quả của thói quen này là gì?","options":["A. Tốn thời gian vô ích.","B. Phát hiện bệnh sớm nhất, chi phí thấp nhất; dữ liệu ghi chép giúp truy vết nguyên nhân và cải tiến quy trình.","C. Làm vật nuôi sợ.","D. Không có hiệu quả."],"answer":"B","explain":"Quan sát lúc cho ăn là thời điểm vàng phát hiện bệnh sớm (con nào bỏ ăn lộ ngay). Ghi chép tạo dữ liệu để phân tích, cải tiến — thói quen đơn giản nhưng là nền tảng quản trị trang trại hiệu quả.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tự động hóa giúp giảm công lao động trong chăn nuôi.","b) Bỏ ăn, ủ rũ là dấu hiệu vật nuôi bị bệnh.","c) Nên cách li ngay vật nuôi có dấu hiệu bệnh.","d) Không cần quan sát đàn vật nuôi hằng ngày."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: quan sát hằng ngày là kĩ năng quan trọng nhất.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phát hiện sớm giúp điều trị hiệu quả và ngăn lây lan.","b) Lúc cho ăn là thời điểm tốt nhất để quan sát đàn.","c) Ghi chép bất thường giúp truy vết nguyên nhân bệnh.","d) Nên tự ý cho cả đàn uống thuốc khi một con ốm."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: phải cách li, chẩn đoán rồi mới điều trị theo chỉ định.","points":1},{"type":"short","level":"VD","q":"Nêu 2 dấu hiệu cho thấy vật nuôi có thể bị bệnh.","answer":"bỏ ăn, ủ rũ","explain":"Dấu hiệu bệnh: bỏ ăn, ủ rũ, nằm riêng, lông xù, phân bất thường, sốt, thở nhanh…","points":0.5},{"type":"short","level":"VDC","q":"Vì sao lúc cho ăn là thời điểm tốt nhất để quan sát, phát hiện vật nuôi bệnh?","answer":"vì con khỏe sẽ tranh ăn còn con ốm thường bỏ ăn lộ rõ","explain":"Khi cho ăn, vật nuôi khỏe mạnh tranh nhau ăn; con ốm mệt, bỏ ăn, nằm riêng sẽ lộ rõ ngay — dễ phát hiện sớm nhất để cách li, xử lí kịp thời.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Nuôi gà thả vườn thuộc hình thức chăn nuôi nào?","options":["A. Bán thâm canh.","B. Thâm canh hoàn toàn.","C. Quảng canh hoàn toàn.","D. Không thuộc hình thức nào."],"answer":"A","explain":"Gà thả vườn: tận dụng không gian vườn, côn trùng (yếu tố tự nhiên) kết hợp bổ sung cám, tiêm phòng (đầu tư) — là hình thức bán thâm canh điển hình.","points":0.25},{"type":"mcq","level":"NB","q":"Chăn nuôi công nghiệp thuộc hình thức nào?","options":["A. Thâm canh.","B. Quảng canh.","C. Tự nhiên.","D. Thủ công."],"answer":"A","explain":"Chăn nuôi công nghiệp (lợn, gà chuồng kín, tự động hóa) đầu tư rất cao, kiểm soát chặt chẽ, năng suất cao — là thâm canh ở mức cao nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao thịt gà thả vườn thường được giá cao hơn gà công nghiệp?","options":["A. Vì gà thả vườn to hơn.","B. Vì vận động nhiều, thịt săn chắc, thơm ngon hơn và người tiêu dùng tin tưởng an toàn hơn.","C. Vì gà thả vườn lớn nhanh hơn.","D. Vì nhà nước quy định."],"answer":"B","explain":"Gà thả vườn vận động nhiều nên thịt săn chắc, ít mỡ, hương vị đặc trưng; đồng thời người tiêu dùng tin tưởng ít tồn dư kháng sinh — sẵn sàng trả giá cao hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Hạn chế của chăn nuôi quảng canh là gì?","options":["A. Năng suất thấp, phụ thuộc thiên nhiên, khó kiểm soát dịch bệnh.","B. Tốn nhiều vốn.","C. Cần nhiều máy móc.","D. Không có hạn chế."],"answer":"A","explain":"Quảng canh ít đầu tư nên năng suất thấp; vật nuôi phơi nhiễm thiên nhiên, khó kiểm soát bệnh, hiệu quả bấp bênh theo mùa vụ, thời tiết.","points":0.25},{"type":"mcq","level":"VD","q":"Huyện miền núi A có đồng cỏ rộng, vốn ít, muốn phát triển chăn nuôi bò thịt. Nên chọn hướng nào?","options":["A. Xây ngay trang trại thâm canh 1000 con.","B. Chăn thả bán thâm canh trên đồng cỏ: bổ sung khoáng, tiêm phòng, chọn giống tốt — phù hợp điều kiện.","C. Không chăn nuôi gì.","D. Nhập bò sữa về nuôi."],"answer":"B","explain":"Đồng cỏ rộng, vốn ít → chăn thả bán thâm canh tận dụng được lợi thế tự nhiên; bổ sung kĩ thuật (giống, khoáng, thú y) nâng năng suất mà không cần vốn lớn như thâm canh.","points":0.25},{"type":"mcq","level":"VDC","q":"Một startup muốn kinh doanh “gà thả vườn hữu cơ” giá cao cho thị trường đô thị. Yếu tố then chốt để thành công là gì?","options":["A. Chỉ cần nói là hữu cơ.","B. Quy trình thật sự đảm bảo (không gian thả, thức ăn hữu cơ, không kháng sinh), có chứng nhận và truy xuất nguồn gốc minh bạch.","C. Nuôi càng nhiều càng tốt.","D. Bán giá rẻ nhất."],"answer":"B","explain":"Phân khúc giá cao đòi hỏi niềm tin tuyệt đối: quy trình thật, chứng nhận uy tín, truy xuất minh bạch. Gian dối một lần mất cả thương hiệu — chất lượng thật là then chốt.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nuôi gà thả vườn là hình thức bán thâm canh.","b) Chăn nuôi công nghiệp là hình thức thâm canh.","c) Thịt gà thả vườn thường săn chắc, thơm ngon.","d) Chăn nuôi quảng canh cho năng suất rất cao."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: quảng canh năng suất thấp.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vùng đồng cỏ rộng, vốn ít phù hợp chăn thả bán thâm canh.","b) Sản phẩm hữu cơ cần chứng nhận và truy xuất minh bạch.","c) Quảng canh khó kiểm soát dịch bệnh.","d) Mọi hình thức chăn nuôi đều cần vốn đầu tư như nhau."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: vốn tăng dần từ quảng canh đến thâm canh.","points":1},{"type":"short","level":"VD","q":"Nêu 2 hạn chế của chăn nuôi quảng canh.","answer":"năng suất thấp, khó kiểm soát dịch bệnh","explain":"Hạn chế của quảng canh: năng suất thấp, phụ thuộc thiên nhiên, khó kiểm soát dịch bệnh, hiệu quả bấp bênh.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao kinh doanh sản phẩm hữu cơ giá cao cần chứng nhận và truy xuất minh bạch?","answer":"vì người tiêu dùng trả giá cao cần niềm tin tuyệt đối vào chất lượng thật","explain":"Giá cao chỉ được chấp nhận khi người mua tin sản phẩm thật sự hữu cơ, an toàn. Chứng nhận uy tín và truy xuất minh bạch tạo niềm tin đó; gian dối sẽ mất thương hiệu vĩnh viễn.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Kĩ thuật chăn nuôi tốt thể hiện ở điểm nào?","options":["A. Vật nuôi khỏe mạnh, lớn nhanh, ít bệnh, năng suất cao, hiệu quả kinh tế tốt.","B. Chuồng trại thật đẹp.","C. Nuôi càng nhiều càng tốt.","D. Không cần quan tâm vật nuôi."],"answer":"A","explain":"Kĩ thuật tốt thể hiện bằng kết quả: đàn vật nuôi khỏe, lớn nhanh, ít bệnh, năng suất cao và lợi nhuận tốt — là tổng hòa của mọi khâu kĩ thuật.","points":0.25},{"type":"mcq","level":"NB","q":"Trong quy trình chăn nuôi, khâu nào diễn ra xuyên suốt?","options":["A. Ghi chép, theo dõi sức khỏe và phòng bệnh.","B. Chỉ khâu cho ăn.","C. Chỉ khâu thu hoạch.","D. Không có khâu nào."],"answer":"A","explain":"Ghi chép, quan sát, theo dõi sức khỏe và phòng bệnh phải thực hiện xuyên suốt từ chuẩn bị đến thu hoạch — là “sợi chỉ đỏ” của quy trình.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao người chăn nuôi cần học kĩ thuật chăn nuôi một cách bài bản?","options":["A. Để khoe kiến thức.","B. Vì chăn nuôi hiện đại đòi hỏi kiến thức tổng hợp (giống, dinh dưỡng, thú y, quản lí); làm theo kinh nghiệm mò mẫm dễ thất bại khi quy mô lớn.","C. Vì không học vẫn nuôi tốt.","D. Vì pháp luật cấm nuôi không bằng cấp."],"answer":"B","explain":"Quy mô càng lớn, rủi ro càng cao. Kiến thức bài bản giúp phòng tránh rủi ro, xử lí đúng khi có sự cố, nâng năng suất — kinh nghiệm dân gian là quý nhưng chưa đủ cho chăn nuôi hiện đại.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa kinh nghiệm dân gian và khoa học kĩ thuật trong chăn nuôi là gì?","options":["A. Mâu thuẫn, phải bỏ kinh nghiệm.","B. Bổ sung cho nhau: kinh nghiệm thực tiễn quý báu kết hợp với khoa học kĩ thuật tạo hiệu quả cao nhất.","C. Chỉ cần kinh nghiệm là đủ.","D. Chỉ cần khoa học, bỏ kinh nghiệm."],"answer":"B","explain":"Kinh nghiệm dân gian (nhìn gà biết bệnh, mẹo chữa…) rất quý; khoa học kĩ thuật hệ thống hóa, nâng cao và kiểm chứng. Kết hợp cả hai cho hiệu quả tối ưu.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn Minh muốn sau này về quê phát triển trang trại. Từ bây giờ bạn nên chuẩn bị gì?","options":["A. Học tốt kiến thức chăn nuôi, tham quan mô hình hay, tích lũy vốn và kinh nghiệm thực tế.","B. Không cần chuẩn bị gì.","C. Chỉ cần có tiền là đủ.","D. Chờ người khác làm rồi học theo."],"answer":"A","explain":"Khởi nghiệp chăn nuôi cần chuẩn bị đồng bộ: kiến thức (học), mô hình tham khảo, vốn và kinh nghiệm thực tế — “chuẩn bị kĩ thì thành công sớm”.","points":0.25},{"type":"mcq","level":"VDC","q":"Đánh giá nhận định: “Chăn nuôi là nghề đơn giản, ai cũng làm được, không cần học”.","options":["A. Đúng.","B. Sai: chăn nuôi hiện đại là ngành kĩ thuật – kinh tế tổng hợp, đòi hỏi kiến thức và quản lí; làm ẩu dễ thất bại, nhất là quy mô lớn.","C. Đúng một phần.","D. Không đánh giá được."],"answer":"B","explain":"Chăn nuôi nhỏ lẻ theo kinh nghiệm thì đơn giản, nhưng chăn nuôi hàng hóa hiện đại đòi hỏi kiến thức giống, dinh dưỡng, thú y, quản trị, thị trường — là một nghề kĩ thuật thực thụ, cần học bài bản.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Kĩ thuật tốt thể hiện ở đàn vật nuôi khỏe, năng suất cao.","b) Ghi chép, phòng bệnh cần thực hiện xuyên suốt quy trình.","c) Chăn nuôi hiện đại cần kiến thức bài bản.","d) Kinh nghiệm dân gian và khoa học kĩ thuật bổ sung cho nhau."],"answer":["T","T","T","T"],"explain":"Cả bốn khẳng định đều đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Quy mô chăn nuôi càng lớn thì rủi ro càng cao.","b) Kiến thức bài bản giúp xử lí đúng khi có sự cố.","c) Khởi nghiệp chăn nuôi cần chuẩn bị kiến thức, vốn và kinh nghiệm.","d) Chăn nuôi hàng hóa không cần quản trị, thị trường."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: chăn nuôi hàng hóa là hoạt động kinh tế, cần quản trị và thị trường.","points":1},{"type":"short","level":"VD","q":"Nêu 2 biểu hiện của kĩ thuật chăn nuôi tốt.","answer":"vật nuôi khỏe ít bệnh, năng suất cao","explain":"Kĩ thuật tốt thể hiện ở: đàn vật nuôi khỏe mạnh, lớn nhanh, ít bệnh; năng suất, chất lượng cao; hiệu quả kinh tế tốt.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao chăn nuôi hàng hóa hiện đại được coi là một nghề kĩ thuật thực thụ?","answer":"vì đòi hỏi kiến thức tổng hợp và quản trị chuyên nghiệp","explain":"Chăn nuôi hàng hóa đòi hỏi kiến thức tổng hợp (giống, dinh dưỡng, thú y, chuồng trại), quản trị (ghi chép, tài chính), am hiểu thị trường — không còn là việc “ai cũng làm được” theo kinh nghiệm đơn thuần.","points":0.5}]}]}
