<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Giống vật nuôi là gì?","options":["A. Một con vật nuôi bất kì trong đàn.","B. Quần thể vật nuôi cùng loài, có nguồn gốc rõ ràng, đặc điểm ngoại hình và năng suất đặc trưng, di truyền ổn định.","C. Tất cả các loài động vật hoang dã.","D. Thức ăn dành cho vật nuôi."],"answer":"B","explain":"Giống vật nuôi là quần thể cùng loài có nguồn gốc rõ ràng, ngoại hình và năng suất đặc trưng, tính di truyền ổn định, số lượng đủ lớn và được công nhận.","points":0.25},{"type":"mcq","level":"NB","q":"Đâu là giống lợn nội của Việt Nam?","options":["A. Lợn Móng Cái.","B. Lợn Landrace.","C. Lợn Yorkshire.","D. Lợn Duroc."],"answer":"A","explain":"Lợn Móng Cái (Quảng Ninh) là giống lợn nội nổi tiếng: mắn đẻ, đẻ nhiều con. Landrace, Yorkshire, Duroc là giống nhập nội.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao giống vật nuôi được coi là yếu tố quyết định đầu tiên đến năng suất chăn nuôi?","options":["A. Vì giống tốt thì không cần cho ăn.","B. Vì tiềm năng di truyền của giống đặt ra giới hạn năng suất; giống xấu thì chăm sóc tốt cũng khó đạt năng suất cao.","C. Vì giống quyết định giá bán thức ăn.","D. Vì chỉ có giống ngoại mới đẻ được."],"answer":"B","explain":"Năng suất vật nuôi = tiềm năng di truyền × điều kiện ngoại cảnh. Giống tốt tạo tiền đề; thức ăn, chăm sóc, chuồng trại chỉ giúp phát huy tiềm năng đó.","points":0.25},{"type":"mcq","level":"TH","q":"Gà Leghorn được xếp vào nhóm giống nào?","options":["A. Giống nội, kiêm dụng.","B. Giống nhập nội, chuyên trứng.","C. Giống nội, chuyên thịt.","D. Giống nhập nội, chuyên sữa."],"answer":"B","explain":"Gà Leghorn là giống gà nhập nội chuyên đẻ trứng, năng suất 270–300 quả/năm, được nuôi phổ biến trong các trang trại gà đẻ.","points":0.25},{"type":"mcq","level":"VD","q":"Anh Kiên muốn nuôi gà vừa lấy thịt vừa lấy trứng cho gia đình (quy mô nhỏ). Nên chọn giống nào?","options":["A. Gà Leghorn chuyên trứng.","B. Gà Broiler chuyên thịt.","C. Gà Ri kiêm dụng.","D. Bò Holstein."],"answer":"C","explain":"Gà Ri là giống kiêm dụng: vừa cho thịt thơm ngon vừa cho trứng, phù hợp chăn nuôi nông hộ nhỏ lẻ, đa mục đích.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trang trại muốn sản xuất thịt lợn hàng hóa năng suất cao. Phương án nhân giống nào hiệu quả nhất?","options":["A. Chỉ nhân thuần lợn Móng Cái.","B. Lai kinh tế: nái Móng Cái × đực Landrace, lấy con lai nuôi thịt.","C. Cho lợn tự giao phối ngẫu nhiên trong đàn.","D. Không cần quan tâm đến giống, chỉ cần cho ăn nhiều."],"answer":"B","explain":"Lai kinh tế giữa nái nội mắn đẻ (Móng Cái) và đực ngoại chuyên thịt (Landrace) tạo con lai có ưu thế lai: đẻ nhiều, lớn nhanh, tỉ lệ nạc cao — tối ưu cho chăn nuôi thịt hàng hóa.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Giống vật nuôi phải có nguồn gốc rõ ràng.","b) Lợn Móng Cái là giống lợn nội của Việt Nam.","c) Bò Holstein là giống bò chuyên cho sữa.","d) Bất kì con vật nào cũng được gọi là giống vật nuôi."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: bò Holstein lông lang trắng đen, chuyên sữa. d) Sai: phải thỏa mãn các điều kiện về nguồn gốc, ngoại hình, năng suất, di truyền.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Giống nhập nội thường có năng suất cao hơn giống địa phương.","b) Giống địa phương thích nghi tốt với điều kiện địa phương.","c) Giống chuyên dụng cho một loại sản phẩm với năng suất cao.","d) Gà Ri là giống gà chuyên cho sữa."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: sức chống chịu cao. c) Đúng: ví dụ gà Leghorn chuyên trứng. d) Sai: gà không cho sữa; gà Ri là giống kiêm dụng thịt – trứng.","points":1},{"type":"short","level":"VD","q":"Nêu 2 điều kiện để một quần thể vật nuôi được công nhận là giống.","answer":"nguồn gốc rõ ràng, di truyền ổn định","explain":"Các điều kiện công nhận giống: nguồn gốc rõ ràng; đặc điểm ngoại hình đặc trưng; năng suất, chất lượng đặc trưng và di truyền ổn định; số lượng cá thể đủ lớn.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao trong chăn nuôi lợn thịt hàng hóa, người ta thường dùng con lai làm sản phẩm mà không dùng làm giống?","answer":"vì lai kinh tế chỉ phát huy ưu thế lai ở thế hệ F1","explain":"Ưu thế lai biểu hiện mạnh nhất ở đời con F1; nếu dùng con lai làm giống (giao phối tiếp), ưu thế lai giảm dần ở các thế hệ sau, năng suất không ổn định nên chỉ dùng con lai để nuôi thịt.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Chọn lọc hàng loạt dựa vào đặc điểm nào của vật nuôi?","options":["A. Ngoại hình (kiểu hình).","B. Số lượng trứng của đời con.","C. Kết quả xét nghiệm ADN.","D. Giá bán trên thị trường."],"answer":"A","explain":"Chọn lọc hàng loạt chọn cùng lúc nhiều cá thể dựa vào ngoại hình đạt tiêu chuẩn — đơn giản, nhanh nhưng độ chính xác chưa cao.","points":0.25},{"type":"mcq","level":"NB","q":"Nhân giống thuần chủng là gì?","options":["A. Cho giao phối giữa các cá thể cùng giống.","B. Cho giao phối giữa các cá thể khác giống.","C. Cho giao phối giữa các loài khác nhau.","D. Không cho vật nuôi sinh sản."],"answer":"A","explain":"Nhân giống thuần chủng là giao phối trong cùng giống nhằm giữ vững và hoàn thiện các đặc tính tốt, nhân nhanh số lượng cá thể của giống.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu điểm nổi bật của chọn lọc cá thể so với chọn lọc hàng loạt là gì?","options":["A. Làm nhanh với số lượng lớn.","B. Đánh giá được năng suất của từng cá thể và đời con nên chính xác cao.","C. Không tốn công sức.","D. Không cần ghi chép."],"answer":"B","explain":"Chọn lọc cá thể theo dõi năng suất từng con và kiểm tra đời con (kiểm tra năng suất cá thể, kiểm tra đời con) nên độ chính xác cao, dù tốn thời gian và chỉ làm với số lượng ít.","points":0.25},{"type":"mcq","level":"TH","q":"Ưu thế lai là hiện tượng gì?","options":["A. Con lai yếu hơn bố mẹ.","B. Con lai khỏe hơn, lớn nhanh hơn, năng suất cao hơn bố mẹ.","C. Con lai không sinh sản được.","D. Con lai giống hệt bố."],"answer":"B","explain":"Ưu thế lai: con lai (đặc biệt F1) có sức sống, tốc độ lớn và năng suất vượt trội so với bố mẹ — là cơ sở của lai kinh tế trong chăn nuôi.","points":0.25},{"type":"mcq","level":"VD","q":"Bác Năm muốn giữ gìn và nhân nhanh đàn gà Đông Tảo thuần chủng của gia đình. Bác nên áp dụng phương pháp nào?","options":["A. Lai gà Đông Tảo với gà Leghorn.","B. Nhân giống thuần chủng: cho gà Đông Tảo giao phối với nhau và chọn lọc.","C. Thả gà tự giao phối với gà hoang.","D. Không cho gà đẻ trứng."],"answer":"B","explain":"Muốn giữ độ thuần và nhân nhanh số lượng của giống quý thì áp dụng nhân giống thuần chủng kết hợp chọn lọc những cá thể tốt.","points":0.25},{"type":"mcq","level":"VDC","q":"Một cơ sở giống muốn tạo dòng lợn nái vừa mắn đẻ (đặc tính của Móng Cái) vừa cho con lớn nhanh (đặc tính của Landrace) để làm nái nền lâu dài. Nên áp dụng phương pháp nào?","options":["A. Lai kinh tế đơn giản rồi bán hết con lai.","B. Lai cải tiến: lai tạo rồi chọn lọc nhiều thế hệ để ổn định đặc tính mong muốn.","C. Chỉ nuôi thuần Móng Cái.","D. Nhập hoàn toàn nái ngoại về."],"answer":"B","explain":"Lai cải tiến dùng con lai tốt làm giống, chọn lọc qua nhiều thế hệ để cố định các đặc tính mong muốn (mắn đẻ + lớn nhanh) thành dòng nái nền ổn định lâu dài.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chọn lọc hàng loạt dựa vào ngoại hình của vật nuôi.","b) Chọn lọc cá thể cho độ chính xác cao hơn chọn lọc hàng loạt.","c) Nhân giống thuần chủng là giao phối giữa các cá thể cùng giống.","d) Lai giống là giao phối giữa các cá thể cùng giống."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: lai giống là giao phối giữa các cá thể khác giống.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Con lai F1 thường có ưu thế lai vượt trội so với bố mẹ.","b) Lai kinh tế dùng con lai để nuôi lấy sản phẩm, không làm giống.","c) Lai cải tiến nhằm nâng cấp giống địa phương.","d) Nhân giống thuần chủng làm mất hoàn toàn đặc tính tốt của giống."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: thuần chủng nhằm giữ vững và hoàn thiện đặc tính tốt của giống.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 giống gà nội của Việt Nam.","answer":"gà Ri, gà Đông Tảo","explain":"Các giống gà nội nổi tiếng của Việt Nam: gà Ri, gà Đông Tảo, gà Hồ, gà Mía… thích nghi tốt, thịt thơm ngon.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao chọn lọc cá thể tuy chính xác nhưng chỉ áp dụng được với số lượng ít?","answer":"vì phải theo dõi ghi chép năng suất từng cá thể và đời con rất tốn thời gian công sức","explain":"Chọn lọc cá thể đòi hỏi theo dõi, ghi chép năng suất từng con trong thời gian dài và kiểm tra đời con — rất tốn thời gian, công sức và chi phí nên chỉ làm được với số lượng ít (đàn hạt nhân, đàn giống).","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Bò Vàng Việt Nam thuộc nhóm giống nào?","options":["A. Giống nhập nội, chuyên sữa.","B. Giống nội, kiêm dụng (cày kéo, thịt).","C. Giống nhập nội, chuyên thịt.","D. Giống nội, chuyên trứng."],"answer":"B","explain":"Bò Vàng là giống bò nội kiêm dụng: vừa cày kéo vừa cho thịt, chịu đựng tốt, thích nghi cao với điều kiện Việt Nam.","points":0.25},{"type":"mcq","level":"NB","q":"Lai kinh tế có đặc điểm nào?","options":["A. Dùng con lai làm giống lâu dài.","B. Dùng con lai nuôi lấy sản phẩm, không dùng làm giống.","C. Chỉ lai giữa các con cùng giống.","D. Không tạo ra ưu thế lai."],"answer":"B","explain":"Lai kinh tế tạo con lai F1 có ưu thế lai để nuôi lấy thịt, trứng…; con lai không dùng làm giống vì ưu thế lai giảm ở thế hệ sau.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao giống nhập nội cần điều kiện chăm sóc tốt hơn giống địa phương?","options":["A. Vì giống nhập nội được tạo ra ở điều kiện khí hậu, thức ăn khác; khả năng thích nghi và chống chịu kém hơn.","B. Vì giống nhập nội không ăn được thức ăn Việt Nam.","C. Vì giống nhập nội không sinh sản được.","D. Vì giống nhập nội luôn bị bệnh."],"answer":"A","explain":"Giống nhập nội được chọn tạo ở nước ngoài với điều kiện tối ưu; khi về Việt Nam, chúng kém thích nghi với nóng ẩm, dịch bệnh địa phương nên đòi hỏi chuồng trại, thức ăn, thú y tốt hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Để chọn gà mái làm giống đẻ trứng, biện pháp nào thuộc chọn lọc cá thể?","options":["A. Loại bỏ những con còi cọc, giữ con khỏe mạnh.","B. Ghi chép số trứng từng con mái trong một năm, chỉ giữ con đẻ trên 250 quả/năm.","C. Chọn con có màu lông đẹp.","D. Chọn con to nhất đàn."],"answer":"B","explain":"Theo dõi, ghi chép năng suất (số trứng) của từng cá thể trong thời gian dài rồi chọn — đó là chọn lọc cá thể (kiểm tra năng suất cá thể).","points":0.25},{"type":"mcq","level":"VD","q":"Trang trại bò sữa của ông Hải đang dùng bò lai Sind, năng suất sữa thấp. Muốn nâng năng suất sữa của đàn về lâu dài, ông nên làm gì?","options":["A. Lai cải tiến: dùng tinh bò Holstein phối cho đàn cái, chọn lọc con lai tốt qua nhiều thế hệ.","B. Bán hết đàn bò.","C. Chỉ cho bò ăn cỏ tự nhiên.","D. Ngừng vắt sữa một năm."],"answer":"A","explain":"Lai cải tiến với giống chuyên sữa Holstein rồi chọn lọc nhiều thế hệ sẽ nâng dần tỉ lệ máu chuyên sữa, cải tạo đàn theo hướng năng suất cao một cách bền vững.","points":0.25},{"type":"mcq","level":"VDC","q":"Một địa phương có giống lợn đen bản địa thịt thơm ngon nhưng lớn chậm. Muốn vừa giữ được chất lượng thịt đặc sản vừa tăng tốc độ lớn cho chăn nuôi hàng hóa, giải pháp hợp lí nhất là gì?","options":["A. Thay thế hoàn toàn bằng lợn ngoại.","B. Lai kinh tế: nái bản địa × đực ngoại chuyên thịt; đồng thời giữ đàn thuần bản địa làm nái nền.","C. Cấm nuôi lợn bản địa.","D. Cho lợn bản địa ăn thật nhiều là đủ."],"answer":"B","explain":"Vừa giữ đàn thuần bản địa (bảo tồn nguồn gen, làm nái nền mắn đẻ, thịt ngon) vừa lai kinh tế với đực ngoại để con lai lớn nhanh — kết hợp được chất lượng đặc sản và năng suất hàng hóa.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bò Vàng là giống bò nội của Việt Nam.","b) Gà Leghorn là giống gà chuyên đẻ trứng.","c) Lợn Landrace là giống lợn nội.","d) Giống kiêm dụng cho nhiều loại sản phẩm."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: Landrace là giống nhập nội chuyên thịt. d) Đúng: ví dụ gà Ri vừa cho thịt vừa cho trứng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Giống nhập nội thường đòi hỏi điều kiện chăm sóc tốt hơn giống địa phương.","b) Ghi chép số trứng từng mái là biện pháp chọn lọc cá thể.","c) Lai cải tiến giúp nâng cấp giống địa phương qua nhiều thế hệ chọn lọc.","d) Công tác giống không ảnh hưởng đến hiệu quả kinh tế chăn nuôi."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: giống quyết định năng suất, chất lượng nên ảnh hưởng trực tiếp đến lợi nhuận.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 giống lợn nhập nội phổ biến ở Việt Nam.","answer":"Landrace, Yorkshire","explain":"Các giống lợn nhập nội phổ biến: Landrace, Yorkshire (chuyên thịt, tỉ lệ nạc cao), Duroc (làm đực giống lai)...","points":0.5},{"type":"short","level":"VDC","q":"Vì sao cần bảo tồn các giống vật nuôi bản địa như lợn Móng Cái, gà Đông Tảo?","answer":"vì là nguồn gen quý có nguy cơ mai một và mang đặc tính thích nghi tốt","explain":"Giống bản địa mang nguồn gen quý: thích nghi tốt, chống chịu cao, chất lượng sản phẩm đặc trưng. Nếu không bảo tồn, chúng có nguy cơ mai một do bị thay thế bởi giống ngoại, làm mất đa dạng sinh học.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Điều kiện nào sau đây KHÔNG phải là điều kiện công nhận giống vật nuôi?","options":["A. Có nguồn gốc rõ ràng.","B. Có giá bán thật cao.","C. Có đặc điểm ngoại hình đặc trưng.","D. Có tính di truyền ổn định."],"answer":"B","explain":"Giá bán không phải điều kiện công nhận giống. Các điều kiện là: nguồn gốc rõ, ngoại hình đặc trưng, năng suất ổn định, di truyền ổn định, số lượng đủ lớn.","points":0.25},{"type":"mcq","level":"NB","q":"Gà Broiler thuộc nhóm giống nào?","options":["A. Gà nội kiêm dụng.","B. Gà nhập nội chuyên thịt.","C. Gà nội chuyên trứng.","D. Gà nhập nội chuyên sữa."],"answer":"B","explain":"Gà Broiler (gà thịt công nghiệp) là giống nhập nội chuyên thịt, lớn rất nhanh, nuôi 6–7 tuần là xuất chuồng.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao chọn lọc hàng loạt có độ chính xác chưa cao?","options":["A. Vì chỉ đánh giá qua ngoại hình mà chưa biết năng suất di truyền thực sự của cá thể.","B. Vì làm quá chậm.","C. Vì tốn quá nhiều tiền.","D. Vì không chọn được con nào."],"answer":"A","explain":"Ngoại hình đẹp chưa chắc đã di truyền tốt cho đời sau (năng suất còn phụ thuộc nhiều yếu tố). Chọn lọc hàng loạt bỏ qua kiểm tra năng suất cá thể và đời con nên độ chính xác hạn chế.","points":0.25},{"type":"mcq","level":"TH","q":"Trong chăn nuôi bò sữa, vì sao người ta chuộng bò Holstein?","options":["A. Vì bò Holstein cho năng suất sữa rất cao, chuyên dụng cho sữa.","B. Vì bò Holstein không cần ăn.","C. Vì bò Holstein cày ruộng giỏi.","D. Vì bò Holstein đẻ nhiều bê một lứa."],"answer":"A","explain":"Bò Holstein là giống chuyên sữa hàng đầu thế giới, năng suất 5000–6000 kg sữa/chu kì, nên được dùng phổ biến trong các trang trại bò sữa.","points":0.25},{"type":"mcq","level":"VD","q":"Chị Mai có đàn vịt Cỏ đẻ trứng, muốn chọn những con mái tốt giữ lại làm giống cho năm sau. Cách làm đơn giản, phù hợp nông hộ là gì?","options":["A. Chọn lọc hàng loạt: loại con còi cọc, dị tật; giữ con khỏe, ngoại hình đạt chuẩn, đẻ đều.","B. Mang từng con đi xét nghiệm ADN ở nước ngoài.","C. Chọn ngẫu nhiên.","D. Bán hết đàn vịt."],"answer":"A","explain":"Với nông hộ, chọn lọc hàng loạt theo ngoại hình và biểu hiện đẻ là cách đơn giản, ít tốn kém mà vẫn nâng được chất lượng đàn giống.","points":0.25},{"type":"mcq","level":"VDC","q":"Một công ty giống muốn cung cấp gà mái đẻ trứng thương phẩm cho nông dân. Họ nên tổ chức sản xuất con giống theo sơ đồ nào?","options":["A. Bán gà Leghorn thuần chủng cho nông dân tự nhân giống.","B. Giữ đàn ông bà (thuần chủng) → sản xuất gà bố mẹ → tạo con lai thương phẩm đẻ trứng bán cho nông dân nuôi lấy trứng.","C. Thu mua gà thịt ngoài chợ về bán làm giống.","D. Để gà tự sinh sản trong trang trại của nông dân."],"answer":"B","explain":"Mô hình tháp nhân giống: đàn hạt nhân/ông bà thuần chủng → đàn bố mẹ → con lai thương phẩm. Nông dân chỉ nuôi con lai thương phẩm lấy trứng (không làm giống), đảm bảo chất lượng đồng đều và bảo vệ được bí quyết dòng giống của công ty.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Gà Broiler là giống gà chuyên thịt.","b) Bò Holstein cho năng suất sữa rất cao.","c) Chọn lọc hàng loạt đơn giản, áp dụng rộng rãi.","d) Mọi giống vật nuôi đều cho sữa."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: chỉ loài có vú mới cho sữa; gà, vịt không cho sữa.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Chọn lọc hàng loạt chỉ dựa vào ngoại hình nên độ chính xác hạn chế.","b) Mô hình tháp nhân giống gồm đàn hạt nhân, đàn bố mẹ và đàn thương phẩm.","c) Con lai thương phẩm thường không dùng làm giống.","d) Giống tốt giúp hạ giá thành sản phẩm chăn nuôi."],"answer":["T","T","T","T"],"explain":"a) Đúng. b) Đúng: tháp di truyền 3 tầng. c) Đúng: vì ưu thế lai giảm ở thế hệ sau. d) Đúng: năng suất cao, ít bệnh → giá thành hạ.","points":1},{"type":"short","level":"VD","q":"Nêu tên 2 phương pháp chọn giống vật nuôi.","answer":"chọn lọc hàng loạt, chọn lọc cá thể","explain":"Hai phương pháp chọn giống cơ bản: chọn lọc hàng loạt (dựa vào ngoại hình) và chọn lọc cá thể (dựa vào năng suất cá thể và đời con).","points":0.5},{"type":"short","level":"VDC","q":"Vì sao công ty giống không bán đàn ông bà thuần chủng mà chỉ bán con lai thương phẩm cho nông dân?","answer":"để bảo vệ bí quyết dòng giống và đảm bảo chất lượng con giống đồng đều","explain":"Đàn ông bà thuần chủng là tài sản trí tuệ của công ty. Chỉ bán con lai thương phẩm giúp công ty giữ bí quyết dòng, đồng thời nông dân nhận được con giống đồng đều, phát huy ưu thế lai tốt nhất.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Vịt Cỏ là giống vật nuôi nào?","options":["A. Giống vịt nội, kiêm dụng.","B. Giống vịt nhập nội chuyên thịt.","C. Giống ngan ngoại.","D. Giống gà nội."],"answer":"A","explain":"Vịt Cỏ là giống vịt nội kiêm dụng (thịt, trứng), nuôi phổ biến ở nông thôn Việt Nam, thích nghi tốt.","points":0.25},{"type":"mcq","level":"NB","q":"Con lai có ưu thế lai thường được dùng để làm gì?","options":["A. Làm giống lâu dài.","B. Nuôi lấy sản phẩm (thịt, trứng).","C. Thả về tự nhiên.","D. Làm cảnh."],"answer":"B","explain":"Con lai F1 phát huy ưu thế lai mạnh nhất nên được nuôi lấy sản phẩm (lai kinh tế), không dùng làm giống.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao không nên cho vật nuôi giao phối cận huyết (cùng huyết thống) nhiều thế hệ?","options":["A. Vì con non sẽ to quá không nuôi được.","B. Vì làm tăng gen lặn có hại, con non yếu ớt, dị tật, năng suất giảm (thoái hóa giống).","C. Vì tốn nhiều thức ăn hơn.","D. Vì pháp luật cấm tuyệt đối mọi trường hợp."],"answer":"B","explain":"Giao phối cận huyết làm tăng tỉ lệ đồng hợp tử, các gen lặn có hại biểu hiện ra → con non yếu, dị tật, thoái hóa giống. Nhân giống thuần chủng phải tránh cận huyết bằng cách đổi đực giống.","points":0.25},{"type":"mcq","level":"TH","q":"Để nhân nhanh số lượng một giống gà quý đang có ít cá thể, nên áp dụng biện pháp nào?","options":["A. Nhân giống thuần chủng kết hợp chọn lọc và tránh giao phối cận huyết.","B. Lai với giống khác ngay lập tức.","C. Không cho sinh sản.","D. Thả rông không quản lí."],"answer":"A","explain":"Nhân thuần giữ độ thuần chủng của giống quý; chọn lọc giữ cá thể tốt; tránh cận huyết (luân chuyển đực giống) để không bị thoái hóa khi số lượng ít.","points":0.25},{"type":"mcq","level":"VD","q":"Ông Sáu nuôi lợn nái Móng Cái, muốn lứa lợn con nuôi thịt lớn nhanh, tỉ lệ nạc cao. Ông nên phối giống như thế nào?","options":["A. Phối nái Móng Cái với đực Móng Cái.","B. Phối nái Móng Cái với đực Landrace (lai kinh tế), nuôi con lai lấy thịt.","C. Không phối giống, để nái tự đẻ.","D. Mua lợn thịt ngoài chợ về nuôi tiếp."],"answer":"B","explain":"Nái Móng Cái mắn đẻ × đực Landrace chuyên thịt → con lai F1 có ưu thế lai: lớn nhanh, tỉ lệ nạc cao, rất phù hợp nuôi thịt hàng hóa.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trại giống lợn có đàn nái hạt nhân ít (50 con) nhưng phải duy trì nhiều thế hệ. Biện pháp quan trọng nhất để tránh thoái hóa giống là gì?","options":["A. Cho giao phối tự do trong đàn.","B. Luân chuyển, thay đổi đực giống định kì và ghi chép phả hệ để tránh giao phối cận huyết.","C. Giảm khẩu phần ăn.","D. Nuôi nhốt hoàn toàn không cho vận động."],"answer":"B","explain":"Đàn hạt nhân ít cá thể rất dễ cận huyết. Phải ghi chép phả hệ, luân chuyển đực giống giữa các dòng/đàn khác nhau định kì để duy trì đa dạng di truyền, tránh thoái hóa.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vịt Cỏ là giống vịt nội của Việt Nam.","b) Con lai F1 thường được nuôi lấy sản phẩm.","c) Giao phối cận huyết nhiều thế hệ gây thoái hóa giống.","d) Nhân giống thuần chủng làm mất giống."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: gen lặn có hại biểu hiện. d) Sai: thuần chủng nhằm giữ vững giống.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trại giống cần ghi chép phả hệ để tránh giao phối cận huyết.","b) Luân chuyển đực giống giúp duy trì đa dạng di truyền.","c) Nái Móng Cái × đực Landrace cho con lai nuôi thịt tốt.","d) Càng giao phối cận huyết, giống càng tốt."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: kết hợp mắn đẻ và lớn nhanh. d) Sai: cận huyết gây thoái hóa.","points":1},{"type":"short","level":"VD","q":"Hiện tượng con lai khỏe hơn, năng suất cao hơn bố mẹ được gọi là gì?","answer":"ưu thế lai","explain":"Ưu thế lai là hiện tượng con lai (nhất là F1) có sức sống, tốc độ sinh trưởng và năng suất vượt trội so với các dạng bố mẹ.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao trại giống phải ghi chép phả hệ của đàn vật nuôi?","answer":"để tránh giao phối cận huyết gây thoái hóa giống","explain":"Phả hệ cho biết quan hệ huyết thống giữa các cá thể, giúp bố trí phối giống tránh cận huyết — nguyên nhân gây thoái hóa giống khi đàn ít cá thể.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Giống vật nuôi nhập nội có đặc điểm nào?","options":["A. Năng suất cao nhưng đòi hỏi chăm sóc tốt.","B. Năng suất luôn thấp.","C. Không bao giờ bị bệnh.","D. Không cần thức ăn."],"answer":"A","explain":"Giống nhập nội (Landrace, Holstein, Leghorn…) năng suất cao nhưng kém thích nghi, đòi hỏi chuồng trại, thức ăn và thú y tốt hơn.","points":0.25},{"type":"mcq","level":"NB","q":"Kiểm tra năng suất cá thể và kiểm tra đời con thuộc phương pháp nào?","options":["A. Chọn lọc hàng loạt.","B. Chọn lọc cá thể.","C. Lai kinh tế.","D. Nhân giống thuần chủng."],"answer":"B","explain":"Chọn lọc cá thể đánh giá năng suất của từng cá thể (kiểm tra năng suất cá thể) và của đời con nó (kiểm tra đời con) nên chính xác cao.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao trong chăn nuôi gà đẻ trứng công nghiệp, người ta dùng gà mái lai thương phẩm thay vì gà thuần chủng?","options":["A. Vì gà lai đẻ trứng to hơn và đẻ đều hơn nhờ ưu thế lai, đồng đều cả đàn.","B. Vì gà thuần chủng không đẻ trứng.","C. Vì gà lai không cần ăn.","D. Vì gà lai rẻ hơn gà thuần."],"answer":"A","explain":"Gà mái lai thương phẩm phát huy ưu thế lai: đẻ nhiều, đều, trứng to, cả đàn đồng đều — hiệu quả kinh tế cao hơn nuôi thuần trong sản xuất hàng hóa.","points":0.25},{"type":"mcq","level":"TH","q":"Vai trò của công tác bảo tồn giống vật nuôi bản địa là gì?","options":["A. Chỉ để làm cảnh.","B. Giữ gìn nguồn gen quý, đa dạng sinh học; giữ đặc tính thích nghi tốt phục vụ lai tạo sau này.","C. Làm tăng giá thức ăn.","D. Không có vai trò gì."],"answer":"B","explain":"Giống bản địa mang gen thích nghi, chống chịu và chất lượng sản phẩm đặc trưng — là nguồn gen quý cho lai tạo và đảm bảo đa dạng sinh học, cần bảo tồn trước nguy cơ mai một.","points":0.25},{"type":"mcq","level":"VD","q":"Huyện A có phong trào nuôi gà Đông Tảo đặc sản nhưng nhiều hộ mua phải gà lai tạp, chất lượng không đồng đều. Giải pháp căn cơ là gì?","options":["A. Cấm nuôi gà Đông Tảo.","B. Xây dựng cơ sở giống gốc thuần chủng, cung cấp con giống chuẩn và chứng nhận nguồn gốc cho các hộ.","C. Để các hộ tự mua giống trôi nổi.","D. Chuyển sang nuôi gà công nghiệp."],"answer":"B","explain":"Muốn phát triển đặc sản bền vững phải có giống gốc chuẩn: cơ sở giữ đàn thuần, cung cấp con giống có chứng nhận nguồn gốc, tránh lai tạp làm mất thương hiệu.","points":0.25},{"type":"mcq","level":"VDC","q":"So sánh hiệu quả của hai phương án: (1) nuôi thuần lợn ngoại chuyên thịt; (2) nuôi con lai F1 (nái nội × đực ngoại) trong điều kiện nông hộ Việt Nam. Nhận định đúng là gì?","options":["A. Phương án 1 luôn tốt hơn trong mọi điều kiện.","B. Phương án 2 thường phù hợp hơn với nông hộ vì con lai vừa có ưu thế lai vừa thừa hưởng sức chống chịu, mắn đẻ từ mẹ nội.","C. Hai phương án cho kết quả như nhau.","D. Không nên nuôi lợn."],"answer":"B","explain":"Lợn ngoại thuần đòi hỏi điều kiện cao, kém thích nghi. Con lai F1 kết hợp được ưu thế lai (lớn nhanh) với đặc tính tốt của nái nội (mắn đẻ, chống chịu) nên phù hợp điều kiện nông hộ hơn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Giống nhập nội thường có năng suất cao.","b) Kiểm tra đời con thuộc chọn lọc cá thể.","c) Gà mái lai thương phẩm đẻ trứng đều nhờ ưu thế lai.","d) Bảo tồn giống bản địa là không cần thiết."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: bảo tồn giữ nguồn gen quý và đa dạng sinh học.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Con lai F1 (nái nội × đực ngoại) phù hợp với điều kiện nông hộ.","b) Giống bản địa có sức chống chịu tốt với điều kiện địa phương.","c) Cơ sở giống gốc giúp đảm bảo chất lượng con giống đặc sản.","d) Nuôi thuần lợn ngoại luôn hiệu quả hơn nuôi con lai trong mọi điều kiện."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: hiệu quả phụ thuộc điều kiện chăm sóc; nông hộ thường hợp với con lai hơn.","points":1},{"type":"short","level":"VD","q":"Nêu 2 biện pháp tránh giao phối cận huyết trong trại giống.","answer":"ghi chép phả hệ, luân chuyển đực giống","explain":"Để tránh cận huyết: ghi chép phả hệ đầy đủ để biết quan hệ huyết thống; luân chuyển, thay đổi đực giống định kì giữa các đàn, dòng khác nhau.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao con lai F1 giữa nái nội và đực ngoại phù hợp với chăn nuôi nông hộ hơn lợn ngoại thuần chủng?","answer":"vì vừa có ưu thế lai vừa thừa hưởng sức chống chịu của giống nội","explain":"Con lai F1 có ưu thế lai (lớn nhanh, năng suất cao) đồng thời thừa hưởng từ mẹ nội tính mắn đẻ, khả năng thích nghi và chống chịu tốt — phù hợp điều kiện chăm sóc còn hạn chế của nông hộ.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Đâu là ví dụ về giống kiêm dụng?","options":["A. Gà Ri vừa cho thịt vừa cho trứng.","B. Gà Leghorn chuyên trứng.","C. Bò Holstein chuyên sữa.","D. Lợn Landrace chuyên thịt."],"answer":"A","explain":"Gà Ri cho cả thịt thơm ngon và trứng — là giống kiêm dụng. Các giống còn lại đều chuyên dụng một hướng sản phẩm.","points":0.25},{"type":"mcq","level":"NB","q":"Thụ tinh nhân tạo có vai trò gì trong công tác giống?","options":["A. Giúp chọn lọc giống tốt, giảm số đực giống phải nuôi, nâng chất lượng đàn con.","B. Giúp vật nuôi không cần ăn.","C. Thay thế hoàn toàn việc chăm sóc.","D. Làm vật nuôi đẻ không cần phối giống."],"answer":"A","explain":"Thụ tinh nhân tạo dùng tinh của đực giống tốt bảo quản trong môi trường nhân tạo để phối cho nhiều cái, giảm số đực giống, nâng cao chất lượng đàn con và chủ động kế hoạch.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao lợn Móng Cái được dùng làm nái nền trong lai kinh tế?","options":["A. Vì mắn đẻ, đẻ nhiều con, nuôi con khéo.","B. Vì lớn nhanh nhất.","C. Vì tỉ lệ nạc cao nhất.","D. Vì không cần cho ăn."],"answer":"A","explain":"Lợn Móng Cái mắn đẻ, đẻ 12–14 con/lứa, nuôi con khéo — đặc tính sinh sản tốt nên rất phù hợp làm nái nền; nhược điểm lớn chậm, mỡ nhiều được khắc phục bằng đực ngoại chuyên thịt.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm giống nhau giữa lai kinh tế và lai cải tiến là gì?","options":["A. Đều là giao phối giữa các cá thể khác giống nhằm kết hợp đặc tính tốt.","B. Đều dùng con lai làm giống lâu dài.","C. Đều không tạo ưu thế lai.","D. Đều chỉ áp dụng cho gà."],"answer":"A","explain":"Cả hai đều là hình thức lai giống (khác giống × khác giống) để kết hợp ưu điểm bố mẹ. Khác nhau ở mục đích: lai kinh tế lấy con lai nuôi sản phẩm; lai cải tiến dùng con lai tốt làm giống qua nhiều thế hệ.","points":0.25},{"type":"mcq","level":"VD","q":"Một hộ nuôi bò sinh sản có 5 bò cái lai Sind. Muốn đàn bê con sau này cho nhiều sữa hơn, hộ đó nên phối tinh của giống bò nào?","options":["A. Bò Holstein (chuyên sữa).","B. Bò Brahman (chịu nóng).","C. Bò Vàng (cày kéo).","D. Trâu."],"answer":"A","explain":"Muốn nâng năng suất sữa thì phối với đực giống chuyên sữa Holstein (lai cải tiến), con lai sẽ mang tỉ lệ máu chuyên sữa cao hơn, cho nhiều sữa hơn.","points":0.25},{"type":"mcq","level":"VDC","q":"Trong chọn tạo giống gà đẻ, người ta thường tạo hai dòng: dòng trống và dòng mái rồi cho lai với nhau. Mục đích chính của cách làm này là gì?","options":["A. Để gà có màu lông đẹp.","B. Để khai thác ưu thế lai tối đa ở con lai thương phẩm, đồng thời giữ được hai dòng thuần làm bí quyết.","C. Để giảm số lượng gà phải nuôi.","D. Để gà không cần ăn."],"answer":"B","explain":"Lai giữa hai dòng thuần khác nhau tạo con lai thương phẩm có ưu thế lai cao nhất; đồng thời công ty giữ được hai dòng thuần (bí quyết công nghệ) để tiếp tục sản xuất con lai ổn định.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Gà Ri là giống gà kiêm dụng.","b) Thụ tinh nhân tạo giúp nâng cao chất lượng đàn con.","c) Lợn Móng Cái mắn đẻ, thích hợp làm nái nền.","d) Lai kinh tế và lai cải tiến đều là giao phối khác giống."],"answer":["T","T","T","T"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Đúng: khác nhau ở mục đích sử dụng con lai.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bò Holstein thích hợp để cải tạo đàn bò theo hướng sữa.","b) Tạo hai dòng thuần rồi lai với nhau giúp khai thác ưu thế lai tối đa.","c) Công ty giống giữ dòng thuần để bảo vệ bí quyết công nghệ.","d) Muốn nhiều sữa thì nên phối bò cái với đực giống chuyên thịt."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: muốn sữa phải phối với đực giống chuyên sữa.","points":1},{"type":"short","level":"VD","q":"Lợn Móng Cái có ưu điểm nổi bật nào khiến nó được dùng làm nái nền?","answer":"mắn đẻ, đẻ nhiều con","explain":"Lợn Móng Cái mắn đẻ, mỗi lứa đẻ 12–14 con, nuôi con khéo — đặc tính sinh sản vượt trội nên được dùng làm nái nền trong lai kinh tế.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao các công ty giống thường tạo hai dòng thuần rồi mới cho lai tạo con thương phẩm?","answer":"để khai thác ưu thế lai tối đa và giữ bí quyết dòng thuần","explain":"Lai giữa hai dòng thuần khác nhau cho con lai thương phẩm có ưu thế lai cao nhất; giữ hai dòng thuần giúp công ty duy trì bí quyết và sản xuất con lai ổn định lâu dài.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Giống vật nuôi nào sau đây chuyên cho thịt?","options":["A. Lợn Landrace.","B. Gà Leghorn.","C. Bò Holstein.","D. Vịt Cỏ."],"answer":"A","explain":"Lợn Landrace là giống chuyên thịt (tỉ lệ nạc cao, lớn nhanh). Gà Leghorn chuyên trứng, bò Holstein chuyên sữa, vịt Cỏ kiêm dụng.","points":0.25},{"type":"mcq","level":"NB","q":"Ngoại hình đặc trưng của bò Holstein là gì?","options":["A. Lông lang trắng đen.","B. Lông vàng toàn thân.","C. Da đen tuyền.","D. Không có sừng."],"answer":"A","explain":"Bò Holstein có bộ lông lang trắng đen rất đặc trưng, dễ nhận biết — là giống bò sữa nổi tiếng thế giới.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao trong nhân giống thuần chủng vẫn cần chọn lọc?","options":["A. Vì không chọn lọc thì giống sẽ tự tốt lên.","B. Vì cần loại bỏ cá thể xấu, giữ cá thể tốt để giống ngày càng hoàn thiện, tránh thoái hóa.","C. Vì chọn lọc làm tăng số lượng nhanh hơn.","D. Vì pháp luật bắt buộc."],"answer":"B","explain":"Thuần chủng mà không chọn lọc thì các đặc tính xấu vẫn di truyền và tích lũy. Chọn lọc liên tục loại cá thể kém, giữ cá thể ưu tú giúp giống hoàn thiện dần.","points":0.25},{"type":"mcq","level":"TH","q":"Khi nào nên áp dụng chọn lọc cá thể?","options":["A. Khi cần chọn nhanh số lượng lớn với chi phí thấp.","B. Khi xây dựng đàn hạt nhân, đàn giống gốc đòi hỏi độ chính xác cao.","C. Khi không cần ghi chép gì.","D. Khi nuôi vật nuôi lấy thịt thương phẩm."],"answer":"B","explain":"Chọn lọc cá thể tốn công nhưng chính xác cao, phù hợp cho đàn hạt nhân, đàn ông bà — nơi chất lượng di truyền quyết định cả hệ thống nhân giống phía sau.","points":0.25},{"type":"mcq","level":"VD","q":"Trại gà giống của anh Phúc có 200 gà mái, anh muốn biết chính xác con nào đẻ nhiều nhất để giữ làm giống. Anh nên làm gì?","options":["A. Chọn con to nhất.","B. Đánh dấu, ghi chép số trứng từng con trong vài tháng (kiểm tra năng suất cá thể) rồi chọn.","C. Chọn ngẫu nhiên 20 con.","D. Chọn con có màu lông đẹp nhất."],"answer":"B","explain":"Muốn biết chính xác năng suất từng cá thể phải theo dõi, ghi chép riêng — đó là kiểm tra năng suất cá thể thuộc chọn lọc cá thể.","points":0.25},{"type":"mcq","level":"VDC","q":"Một chương trình bảo tồn giống gà Hồ (giống quý, số lượng ít) cần ưu tiên điều gì?","options":["A. Lai ngay với gà công nghiệp để tăng số lượng.","B. Nhân thuần, mở rộng số lượng, tránh cận huyết, ghi chép phả hệ cẩn thận.","C. Bán hết gà Hồ để lấy tiền.","D. Thả gà Hồ vào rừng tự sinh sản."],"answer":"B","explain":"Bảo tồn giống quý số lượng ít: nhân thuần để giữ đặc tính, mở rộng quần thể, tuyệt đối tránh cận huyết bằng phả hệ và luân chuyển đực giống — lai với giống khác sẽ làm mất độ thuần.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lợn Landrace là giống chuyên thịt.","b) Bò Holstein có lông lang trắng đen.","c) Nhân giống thuần chủng vẫn cần chọn lọc liên tục.","d) Chọn lọc cá thể phù hợp cho đàn hạt nhân."],"answer":["T","T","T","T"],"explain":"a) Đúng. b) Đúng. c) Đúng: để giống ngày càng hoàn thiện. d) Đúng: vì đòi hỏi độ chính xác cao.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bảo tồn giống quý cần nhân thuần và tránh cận huyết.","b) Ghi chép phả hệ giúp quản lí đàn giống tốt hơn.","c) Lai gà Hồ với gà công nghiệp giúp bảo tồn độ thuần của gà Hồ.","d) Kiểm tra năng suất cá thể giúp chọn đúng con giống tốt."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: lai với giống khác làm mất độ thuần. d) Đúng.","points":1},{"type":"short","level":"VD","q":"Nêu 2 việc cần làm khi nhân giống thuần chủng một giống quý số lượng ít.","answer":"chọn lọc cá thể tốt, tránh giao phối cận huyết","explain":"Khi nhân thuần giống quý ít cá thể: chọn lọc giữ cá thể ưu tú; ghi chép phả hệ, luân chuyển đực giống để tránh cận huyết gây thoái hóa.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao nhân giống thuần chủng mà không chọn lọc thì giống vẫn có thể thoái hóa?","answer":"vì các đặc tính xấu vẫn di truyền và tích lũy qua các thế hệ","explain":"Thuần chủng chỉ đảm bảo giao phối trong giống; nếu không chọn lọc loại bỏ cá thể kém, các gen xấu vẫn được di truyền và tích lũy, cộng với nguy cơ cận huyết — giống sẽ thoái hóa dần.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Đâu là vai trò của công tác giống trong chăn nuôi?","options":["A. Quyết định năng suất, chất lượng và hiệu quả kinh tế chăn nuôi.","B. Thay thế hoàn toàn thức ăn.","C. Làm vật nuôi không cần chuồng trại.","D. Giúp vật nuôi tự chữa bệnh."],"answer":"A","explain":"Giống tốt là tiền đề quyết định năng suất, chất lượng sản phẩm và hiệu quả kinh tế; đồng thời công tác giống còn bảo tồn nguồn gen quý.","points":0.25},{"type":"mcq","level":"NB","q":"Cấy truyền phôi có tác dụng gì trong công tác giống?","options":["A. Tăng nhanh số bê con chất lượng cao từ bò mẹ cao sản.","B. Giúp bò không cần mang thai.","C. Thay thế thức ăn cho bò.","D. Làm bò đẻ nhiều lứa một năm."],"answer":"A","explain":"Cấy truyền phôi lấy phôi từ bò mẹ cao sản cấy cho nhiều bò nhận phôi mang thai hộ, giúp tăng nhanh đàn bò chất lượng cao trong thời gian ngắn.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nói giống tốt nhưng chăm sóc kém thì năng suất vẫn thấp?","options":["A. Vì giống tốt không có gen tốt.","B. Vì năng suất là kết quả của cả di truyền và ngoại cảnh; điều kiện kém ngăn cản tiềm năng di truyền biểu hiện.","C. Vì giống tốt chỉ hợp với nước ngoài.","D. Vì giống tốt không cần thức ăn."],"answer":"B","explain":"Tiềm năng di truyền chỉ biểu hiện thành năng suất thực tế khi có đủ thức ăn, chuồng trại, chăm sóc, thú y tốt. Giống tốt + chăm sóc kém = năng suất thấp.","points":0.25},{"type":"mcq","level":"TH","q":"Trong các giống sau, giống nào thích nghi tốt nhất với điều kiện nóng ẩm Việt Nam?","options":["A. Bò Vàng, gà Ri, lợn Móng Cái.","B. Bò Holstein thuần.","C. Gà Leghorn thuần.","D. Lợn Landrace thuần."],"answer":"A","explain":"Các giống nội (bò Vàng, gà Ri, lợn Móng Cái) được chọn lọc lâu đời trong điều kiện Việt Nam nên thích nghi, chống chịu tốt hơn hẳn giống ngoại thuần.","points":0.25},{"type":"mcq","level":"VD","q":"Gia đình em ở miền núi, điều kiện chăm sóc còn hạn chế, muốn nuôi lợn thịt. Nên chọn phương án giống nào?","options":["A. Nuôi thuần lợn Landrace.","B. Nuôi con lai F1 (nái Móng Cái × đực Landrace).","C. Nuôi lợn rừng tự nhiên.","D. Không nuôi lợn."],"answer":"B","explain":"Con lai F1 vừa lớn nhanh (ưu thế lai) vừa thừa hưởng sức chống chịu của mẹ nội, phù hợp điều kiện chăm sóc còn hạn chế ở miền núi hơn lợn ngoại thuần.","points":0.25},{"type":"mcq","level":"VDC","q":"Một tỉnh miền núi muốn phát triển chăn nuôi bò thịt hàng hóa nhưng địa hình dốc, cỏ tự nhiên nhiều. Chiến lược giống nào phù hợp nhất?","options":["A. Nhập ồ ạt bò ngoại thuần về nuôi nhốt hoàn toàn.","B. Dùng bò cái lai Sind (chịu nóng, dễ nuôi) làm nền, phối tinh bò chuyên thịt (Brahman, Charolais) theo hướng lai cải tiến, kết hợp chăn thả.","C. Chỉ nuôi bò Vàng thuần không lai tạo.","D. Ngừng chăn nuôi bò."],"answer":"B","explain":"Bò lai Sind thích nghi tốt, dễ nuôi trên địa hình đồi núi; phối tinh bò chuyên thịt để nâng tầm vóc, tỉ lệ thịt qua nhiều thế hệ (lai cải tiến) — vừa tận dụng cỏ tự nhiên vừa nâng năng suất bền vững.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Công tác giống quyết định năng suất chăn nuôi.","b) Cấy truyền phôi giúp tăng nhanh đàn bò chất lượng cao.","c) Giống nội thích nghi tốt với điều kiện Việt Nam.","d) Giống tốt thì không cần chăm sóc vẫn cho năng suất cao."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: năng suất cần cả giống tốt và chăm sóc tốt.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Năng suất vật nuôi phụ thuộc cả di truyền và điều kiện ngoại cảnh.","b) Bò lai Sind thích nghi tốt với điều kiện nóng ẩm.","c) Lai cải tiến giúp nâng dần năng suất đàn bò địa phương.","d) Địa hình đồi núi không thể phát triển chăn nuôi bò."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: đồi núi có cỏ tự nhiên rất phù hợp chăn nuôi bò thịt kết hợp chăn thả.","points":1},{"type":"short","level":"VD","q":"Nêu công thức lai kinh tế phổ biến trong chăn nuôi lợn thịt ở Việt Nam.","answer":"nái Móng Cái × đực Landrace","explain":"Công thức lai kinh tế phổ biến: nái Móng Cái (mắn đẻ) × đực Landrace hoặc Yorkshire (chuyên thịt) → con lai F1 lớn nhanh, tỉ lệ nạc cao nuôi lấy thịt.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao ở vùng đồi núi nên dùng bò lai Sind làm nền rồi phối tinh bò chuyên thịt thay vì nhập bò ngoại thuần?","answer":"vì bò lai Sind thích nghi tốt còn tinh bò chuyên thịt nâng năng suất dần","explain":"Bò lai Sind chịu nóng, dễ nuôi, tận dụng được cỏ đồi núi; phối tinh bò chuyên thịt (lai cải tiến) nâng dần tầm vóc và tỉ lệ thịt qua các thế hệ — bền vững hơn nhập bò ngoại thuần khó thích nghi.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Hội đồng giống vật nuôi có vai trò gì?","options":["A. Công nhận các giống vật nuôi đạt tiêu chuẩn.","B. Bán thức ăn chăn nuôi.","C. Xây chuồng trại.","D. Tiêm phòng cho vật nuôi."],"answer":"A","explain":"Hội đồng giống vật nuôi là cơ quan chuyên môn đánh giá và công nhận các giống vật nuôi đạt tiêu chuẩn (nguồn gốc, ngoại hình, năng suất, di truyền).","points":0.25},{"type":"mcq","level":"NB","q":"Số lượng cá thể của một giống phải như thế nào?","options":["A. Chỉ cần 1 con.","B. Đủ lớn để duy trì và nhân giống.","C. Càng ít càng tốt.","D. Không quan trọng số lượng."],"answer":"B","explain":"Một trong các điều kiện công nhận giống là số lượng cá thể đủ lớn để duy trì, nhân giống và tránh cận huyết gây thoái hóa.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao con lai F1 thường đồng đều hơn cả đàn?","options":["A. Vì được nuôi trong cùng điều kiện và mang tổ hợp gen tương tự nhau từ bố mẹ thuần.","B. Vì con lai không có gen.","C. Vì con lai ăn ít hơn.","D. Vì con lai không lớn."],"answer":"A","explain":"Bố mẹ thuần có bộ gen đồng nhất nên các con F1 nhận tổ hợp gen tương tự nhau, cộng với nuôi cùng điều kiện → cả đàn đồng đều về ngoại hình và năng suất, thuận lợi cho chăn nuôi hàng hóa.","points":0.25},{"type":"mcq","level":"TH","q":"Mục đích của việc ghi chép phả hệ trong trại giống là gì?","options":["A. Để bán được giá cao hơn.","B. Để biết quan hệ huyết thống, bố trí phối giống tránh cận huyết và theo dõi năng suất dòng họ.","C. Để làm cảnh.","D. Để đối phó khi kiểm tra."],"answer":"B","explain":"Phả hệ ghi nguồn gốc, quan hệ huyết thống và năng suất của từng cá thể/dòng họ — cơ sở để tránh cận huyết, chọn lọc và quản lí chất lượng đàn giống.","points":0.25},{"type":"mcq","level":"VD","q":"Một hộ nuôi 20 nái Móng Cái nhưng nhiều năm không thay đực giống, lợn con ngày càng còi cọc. Nguyên nhân và cách khắc phục là gì?","options":["A. Do thiếu thức ăn; cho ăn nhiều hơn.","B. Do giao phối cận huyết gây thoái hóa; cần thay đực giống mới không cùng huyết thống.","C. Do chuồng trại quá rộng; thu hẹp chuồng.","D. Do thời tiết; chờ mùa khác."],"answer":"B","explain":"Không thay đực giống nhiều năm dẫn đến cận huyết, gen lặn có hại biểu hiện → con còi cọc, thoái hóa. Khắc phục: đưa đực giống mới không cùng huyết thống vào phối.","points":0.25},{"type":"mcq","level":"VDC","q":"Đánh giá tổng thể: một chương trình giống lợn cho nông hộ miền núi nên ưu tiên tiêu chí nào?","options":["A. Chỉ cần tỉ lệ nạc cao nhất.","B. Cân đối: mắn đẻ, thích nghi tốt, lớn khá; con lai dễ nuôi, ít bệnh trong điều kiện chăm sóc hạn chế.","C. Chỉ cần ngoại hình đẹp.","D. Chỉ cần giá con giống rẻ."],"answer":"B","explain":"Nông hộ miền núi điều kiện hạn chế nên giống phải dễ nuôi, ít bệnh, mắn đẻ (đảm bảo thu nhập ổn định) hơn là chạy theo một chỉ tiêu đơn lẻ như tỉ lệ nạc — đó là tư duy chọn giống phù hợp thực tiễn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hội đồng giống vật nuôi công nhận các giống đạt tiêu chuẩn.","b) Số lượng cá thể của giống phải đủ lớn để nhân giống.","c) Con lai F1 trong đàn thường khá đồng đều.","d) Phả hệ giúp tránh giao phối cận huyết."],"answer":["T","T","T","T"],"explain":"a) Đúng. b) Đúng. c) Đúng: do bố mẹ thuần và nuôi cùng điều kiện. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Không thay đực giống nhiều năm dễ gây thoái hóa đàn do cận huyết.","b) Chương trình giống cho nông hộ cần ưu tiên tính thích nghi và dễ nuôi.","c) Chỉ tiêu tỉ lệ nạc là tiêu chí duy nhất khi chọn giống cho nông hộ.","d) Đực giống mới không cùng huyết thống giúp cải thiện đàn."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: cần cân đối nhiều tiêu chí. d) Đúng.","points":1},{"type":"short","level":"VD","q":"Cơ quan nào có thẩm quyền công nhận một giống vật nuôi mới?","answer":"Hội đồng giống vật nuôi","explain":"Hội đồng giống vật nuôi đánh giá quần thể vật nuôi theo các tiêu chí (nguồn gốc, ngoại hình, năng suất, di truyền, số lượng) và ra quyết định công nhận giống.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao con lai F1 trong chăn nuôi hàng hóa thường đồng đều cả đàn?","answer":"vì bố mẹ thuần có bộ gen đồng nhất nên con F1 mang tổ hợp gen tương tự nhau","explain":"Bố mẹ đều thuần chủng, bộ gen đồng nhất → các con F1 nhận tổ hợp gen tương tự nhau; nuôi cùng điều kiện nên cả đàn đồng đều về ngoại hình, tốc độ lớn — rất thuận lợi cho chăn nuôi hàng hóa quy mô lớn.","points":0.5}]}]}
