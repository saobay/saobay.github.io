<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Bệnh của vật nuôi là gì?","options":["A. Trạng thái rối loạn chức năng sinh lí của cơ thể do các nguyên nhân bên trong hoặc bên ngoài tác động.","B. Vật nuôi ăn quá nhiều.","C. Vật nuôi chạy quá nhanh.","D. Vật nuôi ngủ nhiều."],"answer":"A","explain":"Bệnh là trạng thái rối loạn chức năng sinh lí của cơ thể vật nuôi, làm giảm năng suất, thậm chí gây chết.","points":0.25},{"type":"mcq","level":"NB","q":"Nguyên nhân nào sau đây thuộc nhóm nguyên nhân bên ngoài gây bệnh?","options":["A. Vi rút, vi khuẩn, kí sinh trùng.","B. Gen di truyền của giống.","C. Màu lông của vật nuôi.","D. Tên gọi của vật nuôi."],"answer":"A","explain":"Nguyên nhân bên ngoài gồm: vi sinh vật (vi rút, vi khuẩn, nấm), kí sinh trùng, dinh dưỡng kém, môi trường bất lợi, chấn thương cơ học.","points":0.25},{"type":"mcq","level":"TH","q":"Ba mắt xích để bệnh truyền nhiễm bùng phát là gì?","options":["A. Mầm bệnh – vật nuôi cảm thụ – môi trường thuận lợi.","B. Thức ăn – nước uống – chuồng trại.","C. Giống – thức ăn – thuốc.","D. Người – xe – hàng rào."],"answer":"A","explain":"Dịch bùng phát khi có đủ: mầm bệnh (đủ độc lực, số lượng) + vật nuôi cảm thụ (chưa miễn dịch) + môi trường thuận lợi. Cắt đứt một mắt xích là ngăn được dịch.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao vật nuôi bị stress (nóng, lạnh đột ngột, vận chuyển xa) dễ mắc bệnh?","options":["A. Vì stress làm vật nuôi sợ hãi.","B. Vì stress làm giảm sức đề kháng, tạo điều kiện cho mầm bệnh tấn công (mắt xích “vật cảm thụ” yếu đi).","C. Vì stress làm thức ăn mất chất.","D. Vì stress không ảnh hưởng gì."],"answer":"B","explain":"Stress ức chế hệ miễn dịch, sức đề kháng giảm → mầm bệnh có sẵn trong môi trường dễ gây bệnh. Đó là lí do sau vận chuyển xa, thay đổi thời tiết, vật nuôi hay ốm.","points":0.25},{"type":"mcq","level":"VD","q":"Đàn gà của bác Lâm sau đợt rét đậm đột ngột thì nhiều con ủ rũ, khó thở. Giải thích và biện pháp nào đúng?","options":["A. Gà bị lạnh làm giảm sức đề kháng, mầm bệnh hô hấp tấn công; cần giữ ấm, tăng cường dinh dưỡng và điều trị kịp thời.","B. Gà lười biếng; đuổi gà chạy.","C. Do thiếu ánh sáng; thắp đèn sáng hơn.","D. Không cần làm gì."],"answer":"A","explain":"Rét đậm gây stress lạnh, sức đề kháng giảm, bệnh hô hấp bùng phát. Xử lí: giữ ấm chuồng, bổ sung dinh dưỡng, vitamin; con bệnh cách li điều trị.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trang trại nhập 500 gà giống về, không cách li mà thả ngay vào đàn cũ 2000 con. Hai tuần sau cả trại bùng phát bệnh hô hấp. Phân tích nguyên nhân sâu xa là gì?","options":["A. Do gà mới ăn nhiều hơn.","B. Vi phạm an toàn sinh học: gà mới có thể mang mầm bệnh (mắt xích mầm bệnh) gặp đàn cũ chưa miễn dịch với chủng mới, trong điều kiện stress vận chuyển — đủ 3 mắt xích bùng dịch.","C. Do chuồng quá rộng.","D. Do thời tiết đẹp."],"answer":"B","explain":"Đây là ví dụ điển hình đủ 3 mắt xích: mầm bệnh từ gà mới + vật cảm thụ (đàn cũ và gà mới stress sau vận chuyển) + môi trường chuồng nuôi. Cách li 2–3 tuần đã có thể ngăn chặn.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bệnh là trạng thái rối loạn chức năng sinh lí của cơ thể vật nuôi.","b) Vi rút, vi khuẩn là nguyên nhân bên ngoài gây bệnh.","c) Bệnh truyền nhiễm bùng phát cần 3 mắt xích: mầm bệnh, vật cảm thụ, môi trường thuận lợi.","d) Stress không ảnh hưởng đến sức đề kháng của vật nuôi."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: stress làm giảm sức đề kháng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Rét đậm đột ngột làm gà giảm sức đề kháng, dễ mắc bệnh hô hấp.","b) Cắt đứt một trong 3 mắt xích có thể ngăn dịch bùng phát.","c) Gà mới nhập về cần cách li trước khi nhập đàn.","d) Mầm bệnh chỉ tồn tại trong cơ thể vật nuôi, không có ngoài môi trường."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: mầm bệnh tồn tại nhiều trong phân, đất, nước, không khí.","points":1},{"type":"short","level":"VD","q":"Kể tên 3 mắt xích để bệnh truyền nhiễm bùng phát.","answer":"mầm bệnh, vật nuôi cảm thụ, môi trường thuận lợi","explain":"Ba mắt xích: mầm bệnh (đủ độc lực, số lượng) + vật nuôi cảm thụ (chưa miễn dịch, sức yếu) + môi trường thuận lợi (ẩm thấp, stress).","points":0.5},{"type":"short","level":"VDC","q":"Vì sao sau vận chuyển đường dài, vật nuôi hay bị ốm?","answer":"vì stress vận chuyển làm giảm sức đề kháng","explain":"Vận chuyển xa gây stress (mệt mỏi, đói khát, thay đổi môi trường) làm suy giảm miễn dịch — mắt xích “vật cảm thụ” yếu đi, mầm bệnh dễ tấn công gây bệnh.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Bệnh dịch tả lợn có triệu chứng chính nào?","options":["A. Sốt cao, bỏ ăn, xuất huyết da, tỉ lệ chết cao.","B. Ho nhẹ, sổ mũi.","C. Lông mượt, ăn khỏe.","D. Chỉ bị ngứa da."],"answer":"A","explain":"Dịch tả lợn là bệnh vi rút nguy hiểm: sốt cao, bỏ ăn, xuất huyết dưới da, tỉ lệ chết rất cao, chưa có thuốc đặc trị — phòng bằng vắc xin và an toàn sinh học.","points":0.25},{"type":"mcq","level":"NB","q":"Bệnh cúm gia cầm lây lan chủ yếu qua đường nào?","options":["A. Qua chim hoang dã, phân, dụng cụ, người mang mầm bệnh.","B. Qua ánh sáng mặt trời.","C. Qua tiếng ồn.","D. Không lây lan."],"answer":"A","explain":"Cúm gia cầm lây qua tiếp xúc với gia cầm bệnh, phân, chất thải; chim hoang dã là nguồn lây quan trọng; người, phương tiện, dụng cụ mang mầm bệnh đi xa.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao bệnh cúm gia cầm và dịch tả lợn phải tiêu hủy cả đàn khi phát hiện ổ dịch?","options":["A. Vì thịt không ngon.","B. Vì là bệnh vi rút nguy hiểm, lây lan cực nhanh, chưa có thuốc đặc trị; tiêu hủy để cắt đứt nguồn lây, bảo vệ vùng rộng lớn.","C. Vì tốn thức ăn.","D. Vì người dân yêu cầu."],"answer":"B","explain":"Các bệnh này lây lan nhanh, tỉ lệ chết cao, không có thuốc đặc trị. Tiêu hủy ổ dịch + sát trùng triệt để là biện pháp duy nhất cắt đứt nguồn lây theo quy định pháp luật.","points":0.25},{"type":"mcq","level":"TH","q":"Bệnh Newcastle (gà rù) có triệu chứng đặc trưng nào?","options":["A. Ủ rũ, ngoẹo cổ, tiêu chảy phân xanh, chết nhiều.","B. Đẻ nhiều trứng hơn.","C. Lông mượt, mào đỏ tươi.","D. Chỉ bị hắt hơi nhẹ."],"answer":"A","explain":"Newcastle do vi rút: gà ủ rũ (rù), vẹo cổ, ngoẹo đầu, tiêu chảy phân xanh, chết hàng loạt — phòng hiệu quả bằng vắc xin đầy đủ.","points":0.25},{"type":"mcq","level":"VD","q":"Đàn gà của chị Hồng có con ủ rũ, ngoẹo cổ, phân xanh, chết 2 con/ngày. Chị nên làm gì?","options":["A. Giấu bệnh, bán chạy gà ra chợ.","B. Cách li gà ốm, báo thú y xã để chẩn đoán, xử lí theo hướng dẫn; sát trùng chuồng trại.","C. Cho cả đàn uống nước lã.","D. Thả gà ra vườn cho tự khỏi."],"answer":"B","explain":"Triệu chứng nghi Newcastle/cúm — bệnh nguy hiểm. Phải cách li, báo thú y ngay; tuyệt đối không bán chạy (làm lây lan dịch, vi phạm pháp luật).","points":0.25},{"type":"mcq","level":"VDC","q":"Một xã có ổ dịch tả lợn, một số hộ giấu dịch, bán chạy lợn ốm ra chợ huyện. Hậu quả và trách nhiệm nào đúng?","options":["A. Không sao, bán được là tốt.","B. Làm dịch lây lan ra diện rộng, gây thiệt hại lớn cho cả vùng; hành vi vi phạm quy định phòng chống dịch, bị xử phạt.","C. Giúp giá thịt rẻ hơn.","D. Không ai bị ảnh hưởng."],"answer":"B","explain":"Giấu dịch, bán chạy là hành vi nguy hiểm: phát tán mầm bệnh ra diện rộng, gây thiệt hại kinh tế lớn. Pháp luật nghiêm cấm và xử phạt — người chăn nuôi phải báo dịch trung thực.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dịch tả lợn gây sốt cao, xuất huyết, tỉ lệ chết cao.","b) Cúm gia cầm lây qua chim hoang dã và phân, dụng cụ.","c) Bệnh Newcastle làm gà ủ rũ, ngoẹo cổ, phân xanh.","d) Khi nghi bệnh nguy hiểm nên bán chạy để gỡ vốn."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: phải báo thú y, tuyệt đối không bán chạy.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cúm gia cầm và dịch tả lợn chưa có thuốc đặc trị.","b) Tiêu hủy ổ dịch nhằm cắt đứt nguồn lây lan.","c) Giấu dịch, bán chạy vật ốm là vi phạm pháp luật.","d) Mọi bệnh vật nuôi đều chữa khỏi bằng kháng sinh."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: bệnh vi rút không chữa bằng kháng sinh.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 bệnh truyền nhiễm nguy hiểm ở vật nuôi phải tiêu hủy khi có ổ dịch.","answer":"cúm gia cầm, dịch tả lợn","explain":"Các bệnh nguy hiểm phải tiêu hủy ổ dịch theo quy định: cúm gia cầm, dịch tả lợn (và một số bệnh khác theo quy định thú y).","points":0.5},{"type":"short","level":"VDC","q":"Vì sao không được bán chạy vật nuôi khi nghi mắc bệnh truyền nhiễm nguy hiểm?","answer":"vì làm lây lan dịch bệnh ra diện rộng và vi phạm pháp luật","explain":"Bán chạy phát tán mầm bệnh theo vật nuôi, phương tiện đi khắp nơi, gây dịch diện rộng, thiệt hại lớn; hành vi bị pháp luật nghiêm cấm và xử phạt.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Vắc xin là gì?","options":["A. Chế phẩm sinh học giúp cơ thể tạo miễn dịch chủ động phòng bệnh.","B. Thuốc chữa mọi bệnh.","C. Thức ăn bổ sung.","D. Hóa chất sát trùng."],"answer":"A","explain":"Vắc xin chứa mầm bệnh đã làm yếu/giết chết hoặc kháng nguyên; khi đưa vào cơ thể, hệ miễn dịch tạo kháng thể bảo vệ — gọi là miễn dịch chủ động.","points":0.25},{"type":"mcq","level":"NB","q":"Tiêm phòng vắc xin cần tuân thủ nguyên tắc nào?","options":["A. Đúng lịch, đủ liều, bảo quản đúng cách.","B. Tiêm càng nhiều càng tốt.","C. Tiêm một lần dùng cả đời.","D. Không cần lịch tiêm."],"answer":"A","explain":"Vắc xin chỉ hiệu quả khi tiêm đúng lịch (đúng tuổi), đủ liều, nhắc lại đúng hẹn và bảo quản lạnh đúng cách (vắc xin hỏng do nóng sẽ mất tác dụng).","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao vắc xin phải được bảo quản lạnh và dùng đúng hạn?","options":["A. Vì vắc xin đắt tiền.","B. Vì nhiệt độ cao và quá hạn làm vắc xin mất hoạt tính, tiêm vào không tạo được miễn dịch mà còn tạo tâm lí chủ quan nguy hiểm.","C. Vì vắc xin cần lạnh để ngon.","D. Không cần bảo quản đặc biệt."],"answer":"B","explain":"Vắc xin là chế phẩm sinh học nhạy cảm nhiệt. Bảo quản sai → mất tác dụng → vật nuôi “tưởng đã được bảo vệ” nhưng thực ra không, khi gặp dịch sẽ thiệt hại nặng.","points":0.25},{"type":"mcq","level":"TH","q":"Thời gian ngừng thuốc trước khi giết thịt có ý nghĩa gì?","options":["A. Để vật nuôi đói trước khi thịt.","B. Để thuốc đào thải hết khỏi cơ thể, tránh tồn dư trong thịt gây hại sức khỏe người tiêu dùng.","C. Để tiết kiệm thuốc.","D. Không có ý nghĩa gì."],"answer":"B","explain":"Sau khi dùng thuốc, cần đủ thời gian để cơ thể đào thải hết thuốc. Giết thịt trước thời hạn gây tồn dư kháng sinh trong thịt — nguy hại cho người ăn và vi phạm quy định.","points":0.25},{"type":"mcq","level":"VD","q":"Hộ anh Minh tiêm vắc xin dịch tả cho lợn nhưng để vắc xin ngoài nắng 2 giờ mới tiêm. Hậu quả có thể là gì?","options":["A. Không sao, vắc xin càng nóng càng tốt.","B. Vắc xin mất hoạt tính, lợn không có miễn dịch; khi gặp dịch vẫn mắc bệnh dù “đã tiêm”.","C. Lợn lớn nhanh hơn.","D. Lợn không cần tiêm nhắc lại."],"answer":"B","explain":"Nắng nóng làm hỏng vắc xin. Tiêm vắc xin hỏng = không tiêm, tạo tâm lí chủ quan rất nguy hiểm. Vắc xin phải bảo quản lạnh từ lúc mua đến lúc tiêm.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trang trại tiêm phòng đầy đủ nhưng vẫn bùng phát dịch. Kiểm tra thấy lịch tiêm không đúng (tiêm muộn), bảo quản vắc xin kém. Bài học quản lí nào đúng?","options":["A. Vắc xin không có tác dụng.","B. Tiêm phòng chỉ hiệu quả khi thực hiện nghiêm ngặt: đúng lịch, đúng kĩ thuật, bảo quản đúng; đồng thời kết hợp an toàn sinh học — vắc xin không phải “bùa hộ mệnh” tuyệt đối.","C. Nên bỏ tiêm phòng.","D. Nên tăng liều gấp đôi."],"answer":"B","explain":"Vắc xin chỉ là một mắt xích. Tiêm sai lịch, bảo quản kém làm mất tác dụng; ngoài ra vẫn cần an toàn sinh học vì không có vắc xin nào bảo vệ 100%. Quản lí phải đồng bộ, nghiêm ngặt.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vắc xin giúp cơ thể tạo miễn dịch chủ động phòng bệnh.","b) Tiêm phòng cần đúng lịch, đủ liều.","c) Vắc xin cần được bảo quản lạnh.","d) Tiêm vắc xin rồi thì không cần vệ sinh, an toàn sinh học nữa."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: vẫn cần an toàn sinh học vì không có vắc xin nào bảo vệ tuyệt đối.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vắc xin hỏng do bảo quản sai sẽ không tạo được miễn dịch.","b) Cần tuân thủ thời gian ngừng thuốc trước khi giết thịt.","c) Tồn dư kháng sinh trong thịt gây hại sức khỏe người tiêu dùng.","d) Có thể giết thịt ngay sau khi dùng kháng sinh liều cao."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: phải đủ thời gian đào thải thuốc.","points":1},{"type":"short","level":"VD","q":"Nêu 3 nguyên tắc khi tiêm phòng vắc xin cho vật nuôi.","answer":"đúng lịch, đủ liều, bảo quản đúng cách","explain":"Nguyên tắc tiêm phòng: đúng lịch (đúng tuổi, nhắc lại đúng hẹn), đủ liều, bảo quản lạnh đúng cách, tiêm đúng kĩ thuật.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao trang trại tiêm phòng đầy đủ vẫn có thể bùng phát dịch?","answer":"vì tiêm sai lịch bảo quản kém và thiếu an toàn sinh học","explain":"Vắc xin mất tác dụng nếu tiêm sai lịch, bảo quản kém; hơn nữa không có vắc xin nào bảo vệ 100% nên vẫn cần an toàn sinh học đồng bộ. Tiêm phòng không phải “bùa hộ mệnh” tuyệt đối.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Biện pháp nào sau đây thuộc phòng bệnh?","options":["A. Tiêm phòng vắc xin đầy đủ.","B. Chờ vật nuôi ốm mới chữa.","C. Cho ăn thức ăn mốc.","D. Nhốt chung vật ốm với vật khỏe."],"answer":"A","explain":"Tiêm phòng vắc xin là biện pháp phòng bệnh chủ động, tạo miễn dịch cho vật nuôi trước khi gặp mầm bệnh.","points":0.25},{"type":"mcq","level":"NB","q":"Khi phát hiện vật nuôi có dấu hiệu bệnh, việc đầu tiên cần làm là gì?","options":["A. Cách li ngay vật ốm khỏi đàn.","B. Bán ngay ra chợ.","C. Thả ra vườn.","D. Không làm gì."],"answer":"A","explain":"Cách li ngay ngăn mầm bệnh lây lan cho cả đàn — là việc đầu tiên, quan trọng nhất khi phát hiện vật nuôi ốm.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao không nên tự ý dùng kháng sinh khi chưa rõ bệnh?","options":["A. Vì kháng sinh đắt tiền.","B. Vì dùng sai bệnh không khỏi, gây tốn kém, tạo vi khuẩn kháng thuốc và tồn dư trong sản phẩm.","C. Vì kháng sinh không bán ở hiệu thuốc.","D. Vì vật nuôi sợ thuốc."],"answer":"B","explain":"Kháng sinh chỉ trị bệnh do vi khuẩn; bệnh vi rút dùng kháng sinh vô ích. Dùng bừa bãi gây kháng thuốc, tồn dư — phải có chẩn đoán và chỉ định của thú y.","points":0.25},{"type":"mcq","level":"TH","q":"Chẩn đoán đúng bệnh trước khi điều trị có ý nghĩa gì?","options":["A. Không có ý nghĩa gì.","B. Giúp chọn đúng thuốc, đúng cách; tránh chữa sai gây tốn kém, bệnh nặng thêm và lây lan.","C. Chỉ để lấy tiền khám.","D. Làm mất thời gian."],"answer":"B","explain":"“Bắt đúng bệnh mới chữa đúng thuốc”. Chẩn đoán sai → dùng sai thuốc → bệnh không khỏi, tốn tiền, mất thời gian vàng, dịch lây lan.","points":0.25},{"type":"mcq","level":"VD","q":"Con lợn của gia đình em bỏ ăn, sốt, ho. Em nên khuyên bố mẹ làm gì?","options":["A. Tự mua kháng sinh tiêm ngay.","B. Cách li con lợn, theo dõi thêm triệu chứng và mời thú y đến khám, điều trị theo chỉ định.","C. Bán ngay cho lái buôn.","D. Để tự khỏi."],"answer":"B","explain":"Bỏ ăn, sốt, ho có thể là nhiều bệnh khác nhau. Cách li + nhờ thú y chẩn đoán, điều trị đúng là cách xử lí khoa học, an toàn nhất.","points":0.25},{"type":"mcq","level":"VDC","q":"Một hộ thấy lợn ho là tự mua kháng sinh tiêm, thấy không đỡ lại đổi thuốc khác. Đánh giá cách làm này.","options":["A. Đúng, cần thử nhiều thuốc.","B. Sai: chữa mò không qua chẩn đoán dễ sai thuốc, tốn kém, tạo kháng thuốc; cần thú y chẩn đoán, dùng đúng thuốc, đủ liệu trình.","C. Nên tăng liều thật cao.","D. Nên ngừng chữa."],"answer":"B","explain":"Ho do nhiều nguyên nhân (vi rút, vi khuẩn, kí sinh trùng…). Chữa mò: sai thuốc không khỏi, tốn tiền, tạo kháng thuốc. Đúng là chẩn đoán rồi dùng đúng thuốc, đủ liều, đủ ngày.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tiêm phòng vắc xin là biện pháp phòng bệnh.","b) Khi vật nuôi ốm cần cách li ngay.","c) Nên tự ý dùng kháng sinh khi chưa rõ bệnh.","d) Cần chẩn đoán đúng trước khi điều trị."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: phải có chỉ định của thú y. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dùng kháng sinh bừa bãi gây kháng thuốc và tồn dư.","b) Chẩn đoán sai dẫn đến điều trị sai, tốn kém.","c) Mọi bệnh vật nuôi đều chữa được bằng kháng sinh.","d) Khi vật ốm nên nhờ thú y chẩn đoán."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: bệnh vi rút kháng sinh không có tác dụng. d) Đúng.","points":1},{"type":"short","level":"VD","q":"Nêu 2 việc cần làm ngay khi phát hiện vật nuôi có dấu hiệu bệnh.","answer":"cách li vật ốm, báo thú y chẩn đoán","explain":"Khi phát hiện vật ốm: cách li ngay khỏi đàn; theo dõi triệu chứng; báo/mời thú y chẩn đoán và điều trị theo chỉ định.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao chữa bệnh “mò” (tự đổi thuốc khi chưa rõ bệnh) là sai lầm?","answer":"vì dễ sai thuốc tốn kém và tạo vi khuẩn kháng thuốc","explain":"Không chẩn đoán mà tự đổi thuốc: sai thuốc bệnh không khỏi, tốn tiền, mất thời gian vàng, lại tạo chủng vi khuẩn kháng thuốc nguy hiểm cho cả cộng đồng.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Bệnh lở mồm long móng mắc ở vật nuôi nào?","options":["A. Trâu, bò, lợn.","B. Gà, vịt.","C. Cá, tôm.","D. Ong, tằm."],"answer":"A","explain":"Lở mồm long móng do vi rút gây bệnh cho động vật móng guốc chẵn: trâu, bò, lợn, dê… với mụn nước ở miệng, móng.","points":0.25},{"type":"mcq","level":"NB","q":"Kí sinh trùng nào thường gặp ở vật nuôi?","options":["A. Giun, sán.","B. Vi rút cúm.","C. Vi khuẩn lao.","D. Nấm mốc."],"answer":"A","explain":"Giun đũa, giun kim, sán lá gan… là kí sinh trùng phổ biến ở vật nuôi, gây còi cọc, chậm lớn — phòng trị bằng tẩy giun định kì.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao cần tẩy giun định kì cho vật nuôi?","options":["A. Vì giun sán kí sinh lấy chất dinh dưỡng, gây còi cọc, chậm lớn, giảm năng suất.","B. Vì giun đẹp.","C. Vì vật nuôi thích uống thuốc tẩy giun.","D. Không cần thiết."],"answer":"A","explain":"Giun sán sống trong ruột, hút dinh dưỡng, tiết độc tố làm vật nuôi còi cọc, chậm lớn, dễ mắc bệnh khác. Tẩy giun định kì (3–4 tháng/lần) giúp vật nuôi khỏe, lớn nhanh.","points":0.25},{"type":"mcq","level":"TH","q":"Biện pháp nào giúp phòng bệnh kí sinh trùng ngoài da (ve, rận, ghẻ)?","options":["A. Vệ sinh chuồng trại, tắm chải, phun thuốc diệt kí sinh trùng định kì.","B. Không cần làm gì.","C. Cho vật nuôi ăn nhiều hơn.","D. Nhốt chung tất cả."],"answer":"B","explain":"Kí sinh trùng ngoài da lây qua tiếp xúc, chuồng bẩn. Vệ sinh, tắm chải thường xuyên và phun/xịt thuốc diệt kí sinh trùng định kì giúp phòng hiệu quả.","points":0.25},{"type":"mcq","level":"VD","q":"Đàn lợn của ông Tư còi cọc, chậm lớn dù ăn khỏe, lông xù. Nghi bị giun sán. Xử lí nào đúng?","options":["A. Tẩy giun cho cả đàn bằng thuốc đúng liều, vệ sinh chuồng trại sạch sẽ.","B. Cho ăn nhiều hơn nữa.","C. Bán hết lợn.","D. Không cần làm gì."],"answer":"A","explain":"Ăn khỏe mà còi cọc, lông xù là dấu hiệu điển hình nhiễm giun sán. Tẩy giun cả đàn + vệ sinh chuồng (diệt trứng giun) sẽ giúp lợn lớn nhanh trở lại.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trang trại gà thả vườn bị rận, ghẻ lây lan nhanh do gà ngủ chung, chuồng ẩm. Giải pháp tổng hợp nào hiệu quả, bền vững?","options":["A. Phun thuốc một lần rồi thôi.","B. Vệ sinh, thay chất độn chuồng; phun thuốc diệt kí sinh trùng cả đàn và chuồng theo liệu trình; giảm mật độ, giữ chuồng khô ráo — kết hợp môi trường và thuốc.","C. Bán hết gà.","D. Đốt chuồng."],"answer":"B","explain":"Kí sinh trùng ngoài da tái phát nhanh nếu môi trường còn ẩm, bẩn. Phải kết hợp: diệt kí sinh trùng trên vật nuôi + vệ sinh môi trường + cải thiện chuồng (khô ráo, thoáng) mới bền vững.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Lở mồm long móng mắc ở trâu, bò, lợn.","b) Giun, sán là kí sinh trùng thường gặp ở vật nuôi.","c) Nên tẩy giun định kì cho vật nuôi.","d) Kí sinh trùng không ảnh hưởng đến năng suất vật nuôi."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: gây còi cọc, chậm lớn.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Giun sán lấy chất dinh dưỡng làm vật nuôi còi cọc.","b) Vệ sinh chuồng trại giúp phòng kí sinh trùng ngoài da.","c) Phòng kí sinh trùng cần kết hợp thuốc và cải thiện môi trường.","d) Ăn khỏe thì chắc chắn không bị giun sán."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: nhiễm giun vẫn ăn khỏe nhưng còi cọc.","points":1},{"type":"short","level":"VD","q":"Kể tên 2 loại kí sinh trùng thường gặp ở vật nuôi.","answer":"giun, sán","explain":"Kí sinh trùng trong: giun đũa, giun kim, sán lá gan…; ngoài da: ve, rận, ghẻ…","points":0.5},{"type":"short","level":"VDC","q":"Vì sao phòng kí sinh trùng ngoài da phải kết hợp cả thuốc và vệ sinh môi trường?","answer":"vì môi trường bẩn là nơi trú ngụ và tái lây nhiễm kí sinh trùng","explain":"Thuốc chỉ diệt kí sinh trùng trên vật nuôi; trứng, ấu trùng còn trong chất độn, khe chuồng ẩm sẽ tái lây ngay. Vệ sinh, thay độn, giữ khô ráo mới cắt được vòng đời kí sinh trùng.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Bệnh tụ huyết trùng có đặc điểm nào?","options":["A. Sốt cao, khó thở, xuất huyết, chết nhanh ở trâu, bò, lợn, gà.","B. Chỉ gây ngứa da.","C. Làm vật nuôi lớn nhanh.","D. Không nguy hiểm."],"answer":"A","explain":"Tụ huyết trùng do vi khuẩn, tiến triển nhanh: sốt cao, khó thở, xuất huyết, chết nhanh — phòng bằng vắc xin, trị bằng kháng sinh khi phát hiện sớm.","points":0.25},{"type":"mcq","level":"NB","q":"Tiêu chảy ở lợn con thường do nguyên nhân nào?","options":["A. Lạnh, vệ sinh kém, nhiễm khuẩn; thiếu sữa đầu.","B. Ăn quá ngon.","C. Chuồng quá sạch.","D. Được chăm sóc tốt."],"answer":"A","explain":"Lợn con tiêu chảy do: lạnh, ô đẻ ẩm bẩn, nhiễm khuẩn E.coli…, không được bú sữa đầu — phòng bằng giữ ấm, vệ sinh, sữa đầu; trị bằng bù nước, điện giải.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao bệnh do vi rút (cúm, dịch tả, Newcastle) khó chữa hơn bệnh do vi khuẩn?","options":["A. Vì vi rút nhỏ hơn.","B. Vì chưa có thuốc đặc trị diệt vi rút; chủ yếu phòng bằng vắc xin và tăng sức đề kháng, còn vi khuẩn có kháng sinh đặc hiệu.","C. Vì vi rút không gây bệnh.","D. Vì bệnh vi rút nhẹ hơn."],"answer":"B","explain":"Y học chưa có nhiều thuốc đặc trị vi rút; kháng sinh không diệt được vi rút. Vì vậy với bệnh vi rút, phòng (vắc xin, an toàn sinh học) là chính, quan trọng hơn chữa.","points":0.25},{"type":"mcq","level":"TH","q":"Bù nước, điện giải cho vật nuôi bị tiêu chảy có ý nghĩa gì?","options":["A. Không có ý nghĩa gì.","B. Tiêu chảy gây mất nước, mất muối nghiêm trọng — nguyên nhân chính gây chết; bù kịp thời cứu sống vật nuôi trong khi chờ thuốc có tác dụng.","C. Chỉ để vật nuôi đỡ khát.","D. Làm bệnh nặng thêm."],"answer":"B","explain":"Vật nuôi tiêu chảy chết chủ yếu do mất nước và điện giải, không phải do mầm bệnh trực tiếp. Bù nước, điện giải (oresol) kịp thời là biện pháp cứu sống quan trọng nhất.","points":0.25},{"type":"mcq","level":"VD","q":"Đàn lợn con 10 ngày tuổi của bà Năm bị tiêu chảy phân vàng, mất nước. Xử lí đúng là gì?","options":["A. Giữ ấm, vệ sinh ô đẻ; cho uống dung dịch bù nước, điện giải; nhờ thú y điều trị.","B. Cho nhịn uống nước.","C. Tắm cho lợn con bằng nước lạnh.","D. Bán hết lợn con."],"answer":"A","explain":"Tiêu chảy phân vàng ở lợn con: giữ ấm (lạnh làm nặng thêm), vệ sinh sạch, bù nước điện giải ngay chống mất nước, đồng thời nhờ thú y dùng thuốc đặc trị.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trại bò sữa ghi nhận: bê con tiêu chảy nhiều vào mùa mưa. Phân tích hệ thống và đề xuất giải pháp nào đúng?","options":["A. Do mưa nên không tránh được.","B. Mùa mưa chuồng ẩm, lạnh, mầm bệnh phát triển; giải pháp: nâng nền, thoát nước tốt, giữ ấm, vệ sinh, đảm bảo bê bú sữa đầu — phòng tổng hợp theo mùa.","C. Cho bê uống kháng sinh quanh năm.","D. Ngừng nuôi bê vào mùa mưa."],"answer":"B","explain":"Bệnh theo mùa cho thấy nguyên nhân môi trường. Giải pháp phải hệ thống: cải thiện chuồng (khô ráo, ấm), vệ sinh, sữa đầu — phòng theo mùa hiệu quả, bền vững hơn dùng thuốc quanh năm.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tụ huyết trùng gây sốt cao, chết nhanh ở nhiều loài vật nuôi.","b) Lợn con tiêu chảy do lạnh, vệ sinh kém.","c) Bệnh vi rút chưa có thuốc đặc trị, chủ yếu phòng bằng vắc xin.","d) Vật nuôi tiêu chảy không cần bù nước."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: bù nước, điện giải là biện pháp cứu sống quan trọng.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Kháng sinh không diệt được vi rút.","b) Vật nuôi chết do tiêu chảy chủ yếu vì mất nước, điện giải.","c) Phòng bệnh theo mùa cần cải thiện môi trường chuồng nuôi.","d) Mùa mưa không ảnh hưởng đến bệnh tiêu chảy."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: mùa mưa ẩm thấp làm tăng bệnh tiêu chảy.","points":1},{"type":"short","level":"VD","q":"Vật nuôi bị tiêu chảy cần được bù gì kịp thời để tránh chết?","answer":"nước và điện giải","explain":"Tiêu chảy gây mất nước và muối (điện giải) nghiêm trọng — nguyên nhân chính gây chết. Bù dung dịch điện giải (oresol) kịp thời cứu sống vật nuôi.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao với bệnh do vi rút, phòng bệnh quan trọng hơn chữa bệnh?","answer":"vì chưa có thuốc đặc trị diệt vi rút","explain":"Y học chưa có thuốc đặc trị hầu hết bệnh vi rút ở vật nuôi; kháng sinh vô tác dụng. Vì vậy phòng bằng vắc xin, an toàn sinh học, tăng sức đề kháng là biện pháp chính, hiệu quả nhất.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"An toàn sinh học trong chăn nuôi gồm những biện pháp nào?","options":["A. Cách li, vệ sinh sát trùng, kiểm soát người và phương tiện ra vào.","B. Mở cửa tự do cho mọi người vào.","C. Không cần biện pháp gì.","D. Chỉ cần cho ăn no."],"answer":"A","explain":"An toàn sinh học là tổng hợp biện pháp ngăn mầm bệnh xâm nhập và lây lan: cách li, sát trùng, kiểm soát ra vào, quản lí chất thải…","points":0.25},{"type":"mcq","level":"NB","q":"Kiểm dịch vật nuôi có ý nghĩa gì?","options":["A. Kiểm tra sức khỏe vật nuôi khi mua bán, vận chuyển để ngăn lây lan dịch bệnh.","B. Để thu thuế.","C. Để làm đẹp.","D. Không có ý nghĩa."],"answer":"A","explain":"Kiểm dịch thú y kiểm tra sức khỏe, nguồn gốc vật nuôi khi mua bán, vận chuyển; ngăn vật mang bệnh đi nơi khác — là chốt chặn pháp lí phòng dịch.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao không nên mua bán, vận chuyển vật nuôi qua vùng đang có dịch?","options":["A. Vì đường xa tốn xăng.","B. Vì vật nuôi có thể mang mầm bệnh từ vùng dịch đi nơi khác, làm dịch lan rộng.","C. Vì giá rẻ.","D. Vì không ai kiểm tra."],"answer":"B","explain":"Vận chuyển vật nuôi từ vùng dịch là con đường phát tán mầm bệnh nhanh nhất, xa nhất. Quy định cấm vận chuyển qua vùng dịch là để bao vây, dập tắt ổ dịch.","points":0.25},{"type":"mcq","level":"TH","q":"Người chăn nuôi có trách nhiệm gì khi phát hiện dịch bệnh?","options":["A. Giấu nhẹm để tránh rắc rối.","B. Báo ngay cho thú y, chính quyền địa phương; thực hiện các biện pháp xử lí theo hướng dẫn.","C. Tự chữa bằng mọi giá.","D. Bán chạy để gỡ vốn."],"answer":"B","explain":"Pháp luật quy định người chăn nuôi phải báo dịch trung thực, kịp thời; hợp tác xử lí. Giấu dịch, bán chạy bị xử phạt và gây thiệt hại cộng đồng.","points":0.25},{"type":"mcq","level":"VD","q":"Xã A đang có dịch cúm gia cầm, anh Cường định chở 500 gà ra tỉnh khác bán vì sợ lỗ. Lời khuyên nào đúng?","options":["A. Cứ chở đi bán nhanh.","B. Tuyệt đối không vận chuyển; báo thú y, thực hiện tiêu hủy, sát trùng theo quy định; Nhà nước có chính sách hỗ trợ thiệt hại.","C. Bán lén vào ban đêm.","D. Thả gà ra đồng."],"answer":"B","explain":"Vận chuyển gà từ vùng dịch là vi phạm nghiêm trọng, làm dịch lan rộng. Phải chấp hành tiêu hủy, sát trùng; người chăn nuôi được Nhà nước hỗ trợ một phần thiệt hại theo chính sách.","points":0.25},{"type":"mcq","level":"VDC","q":"Một tỉnh kiểm soát tốt dịch bệnh nhờ hệ thống: báo dịch nhanh qua điện thoại, đội phản ứng cơ động, kho dự trữ vắc xin. Yếu tố then chốt của thành công này là gì?","options":["A. May mắn.","B. Hệ thống giám sát, cảnh báo sớm và phản ứng nhanh, đồng bộ từ cơ sở đến tỉnh — phát hiện sớm, dập tắt nhanh khi ổ dịch còn nhỏ.","C. Tỉnh đó không có vật nuôi.","D. Người dân tự chữa bệnh."],"answer":"B","explain":"Dịch bệnh như đám cháy: phát hiện sớm, dập nhanh khi còn nhỏ thì thiệt hại ít. Hệ thống giám sát – cảnh báo – phản ứng nhanh, đồng bộ là then chốt kiểm soát dịch hiệu quả.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) An toàn sinh học giúp ngăn mầm bệnh xâm nhập trang trại.","b) Kiểm dịch ngăn vật mang bệnh đi nơi khác.","c) Khi có dịch phải báo ngay cho thú y, chính quyền.","d) Có thể tự do vận chuyển vật nuôi qua vùng dịch."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: bị cấm để ngăn lây lan.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Giấu dịch, bán chạy vật ốm là vi phạm pháp luật.","b) Nhà nước có chính sách hỗ trợ khi tiêu hủy vật nuôi do dịch.","c) Phát hiện sớm, dập tắt nhanh giúp giảm thiệt hại do dịch.","d) Người chăn nuôi không có trách nhiệm gì khi có dịch."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: phải báo dịch và hợp tác xử lí.","points":1},{"type":"short","level":"VD","q":"Khi phát hiện vật nuôi mắc bệnh truyền nhiễm nguy hiểm, người chăn nuôi phải làm gì đầu tiên về mặt pháp lí?","answer":"báo ngay cho thú y và chính quyền địa phương","explain":"Pháp luật quy định: khi phát hiện dịch bệnh, người chăn nuôi phải báo ngay cho thú y, chính quyền; không giấu dịch, không bán chạy; thực hiện xử lí theo hướng dẫn.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao phát hiện sớm và phản ứng nhanh là then chốt trong kiểm soát dịch bệnh?","answer":"vì dập tắt ổ dịch khi còn nhỏ sẽ giảm thiệt hại rất nhiều","explain":"Dịch bệnh lây lan theo cấp số nhân. Phát hiện sớm, bao vây, tiêu hủy, sát trùng ngay khi ổ dịch còn nhỏ sẽ chặn đứng lây lan, thiệt hại ít hơn nhiều so với để dịch lan rộng.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Dinh dưỡng tốt giúp phòng bệnh như thế nào?","options":["A. Không liên quan đến bệnh tật.","B. Giúp vật nuôi khỏe mạnh, sức đề kháng cao, ít mắc bệnh.","C. Chỉ làm vật nuôi béo.","D. Làm vật nuôi lười vận động."],"answer":"B","explain":"Dinh dưỡng đầy đủ, cân đối là nền tảng của hệ miễn dịch. Vật nuôi suy dinh dưỡng sức đề kháng kém, dễ mắc bệnh — “phòng bệnh từ khẩu phần”.","points":0.25},{"type":"mcq","level":"NB","q":"Vứt xác vật nuôi chết do dịch bừa bãi gây hậu quả gì?","options":["A. Không sao.","B. Mầm bệnh phát tán ra môi trường (đất, nước), lây lan dịch và ô nhiễm nghiêm trọng.","C. Làm đất tốt hơn.","D. Giúp vật khác có thức ăn."],"answer":"B","explain":"Xác vật chết do dịch chứa lượng mầm bệnh khổng lồ. Vứt bừa bãi (xuống sông, bãi rác) phát tán mầm bệnh khắp nơi — phải chôn sâu có vôi bột hoặc tiêu hủy theo quy định.","points":0.25},{"type":"mcq","level":"TH","q":"Xử lí đúng xác vật nuôi chết do dịch bệnh là gì?","options":["A. Vứt xuống sông.","B. Chôn sâu, rắc vôi bột hoặc tiêu hủy bằng lò đốt theo hướng dẫn của thú y.","C. Bán cho hàng thịt.","D. Để ngoài vườn."],"answer":"B","explain":"Xác vật chết do dịch phải được chôn sâu (có vôi bột khử trùng) hoặc đốt tiêu hủy — tuyệt đối không vứt bừa bãi, không bán, không ăn thịt vật chết do dịch.","points":0.25},{"type":"mcq","level":"TH","q":"Mối quan hệ giữa vệ sinh môi trường và phòng bệnh là gì?","options":["A. Không liên quan.","B. Môi trường sạch, khô ráo làm giảm mật độ mầm bệnh, vật nuôi ít bệnh; môi trường bẩn là ổ dịch tiềm ẩn.","C. Môi trường càng bẩn vật nuôi càng khỏe.","D. Chỉ cần thuốc, không cần vệ sinh."],"answer":"B","explain":"Phần lớn mầm bệnh tồn tại trong phân, đất, nước bẩn. Vệ sinh tốt làm giảm mầm bệnh trong môi trường — là biện pháp phòng bệnh rẻ tiền mà hiệu quả nhất.","points":0.25},{"type":"mcq","level":"VD","q":"Hộ bà Sáu có gà chết do cúm, bà định vứt xác ra bờ sông. Em nên khuyên bà như thế nào?","options":["A. Cứ vứt cho nhanh.","B. Không được vứt bừa bãi; phải báo thú y, chôn sâu có vôi bột hoặc tiêu hủy theo hướng dẫn để tránh lây lan dịch.","C. Mang bán cho người khác.","D. Để xác trong vườn."],"answer":"B","explain":"Vứt xác gà cúm ra sông phát tán vi rút khắp vùng hạ lưu, gây dịch diện rộng và ô nhiễm nguồn nước. Phải xử lí đúng quy định và báo thú y.","points":0.25},{"type":"mcq","level":"VDC","q":"Một làng nghề ấp trứng gia cầm muốn phòng dịch cúm hiệu quả. Biện pháp tổng hợp nào phù hợp nhất?","options":["A. Chỉ tiêm phòng là đủ.","B. Tiêm phòng đầy đủ + kiểm soát trứng giống đầu vào + vệ sinh, sát trùng lò ấp + lưới chắn chim hoang dã + giám sát đàn — đồng bộ nhiều biện pháp.","C. Không cần làm gì.","D. Đóng cửa lò ấp."],"answer":"B","explain":"Lò ấp tập trung trứng, gà con từ nhiều nơi — rủi ro dịch cao. Phải phòng tổng hợp: vắc xin + kiểm soát đầu vào + vệ sinh lò + ngăn chim hoang dã + giám sát — một biện pháp đơn lẻ không đủ.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Dinh dưỡng tốt giúp tăng sức đề kháng, ít bệnh.","b) Phải chôn sâu, rắc vôi hoặc tiêu hủy xác vật chết do dịch.","c) Vứt xác vật chết do dịch bừa bãi làm lây lan dịch bệnh.","d) Môi trường bẩn không ảnh hưởng đến bệnh tật."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: môi trường bẩn là ổ mầm bệnh.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vệ sinh tốt là biện pháp phòng bệnh rẻ tiền, hiệu quả.","b) Lò ấp trứng cần phòng dịch tổng hợp nhiều biện pháp.","c) Một biện pháp đơn lẻ luôn đủ để phòng mọi dịch bệnh.","d) Kiểm soát đầu vào giúp giảm nguy cơ mang mầm bệnh."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: cần phòng tổng hợp đồng bộ. d) Đúng.","points":1},{"type":"short","level":"VD","q":"Nêu cách xử lí đúng xác vật nuôi chết do dịch bệnh.","answer":"chôn sâu rắc vôi bột hoặc tiêu hủy theo quy định","explain":"Xác vật chết do dịch: chôn sâu có rắc vôi bột khử trùng hoặc đốt tiêu hủy theo hướng dẫn thú y; tuyệt đối không vứt bừa bãi, không bán, không ăn.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao phòng dịch ở lò ấp trứng cần nhiều biện pháp đồng bộ?","answer":"vì lò ấp tập trung trứng và gà con từ nhiều nơi nên rủi ro dịch rất cao","explain":"Lò ấp nhận trứng, xuất gà con đi nhiều nơi — là điểm nút lây lan dịch. Một biện pháp đơn lẻ (chỉ tiêm phòng) không đủ; cần kiểm soát đầu vào, vệ sinh lò, ngăn chim hoang dã, giám sát đồng bộ.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Miễn dịch chủ động là gì?","options":["A. Cơ thể tự tạo ra kháng thể sau khi tiêm vắc xin hoặc khỏi bệnh.","B. Uống thuốc kháng sinh.","C. Ăn nhiều thức ăn.","D. Ngủ nhiều."],"answer":"A","explain":"Miễn dịch chủ động: cơ thể tự sản xuất kháng thể sau khi tiếp xúc kháng nguyên (tiêm vắc xin, mắc bệnh rồi khỏi) — bảo vệ lâu dài.","points":0.25},{"type":"mcq","level":"NB","q":"Sữa đầu giúp con non phòng bệnh nhờ cơ chế nào?","options":["A. Miễn dịch thụ động: kháng thể từ mẹ truyền sang con qua sữa đầu.","B. Sữa đầu có kháng sinh.","C. Sữa đầu diệt mọi vi khuẩn.","D. Không có cơ chế gì."],"answer":"A","explain":"Kháng thể trong sữa đầu được con non hấp thu, tạo miễn dịch thụ động bảo vệ trong những tuần đầu đời khi hệ miễn dịch chưa hoàn chỉnh.","points":0.25},{"type":"mcq","level":"TH","q":"So sánh miễn dịch chủ động (tiêm vắc xin) và miễn dịch thụ động (sữa đầu), nhận định nào đúng?","options":["A. Cả hai đều bảo vệ vĩnh viễn.","B. Miễn dịch chủ động bảo vệ lâu dài; miễn dịch thụ động bảo vệ ngắn hạn trong giai đoạn đầu đời.","C. Miễn dịch thụ động tốt hơn hẳn.","D. Không có sự khác biệt."],"answer":"B","explain":"Tiêm vắc xin: cơ thể tự tạo kháng thể và “nhớ” mầm bệnh → bảo vệ lâu dài, có thể nhắc lại. Sữa đầu: kháng thể mẹ truyền sang, mất dần sau vài tuần — chỉ bảo vệ giai đoạn đầu.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao lịch tiêm phòng của gà con bắt đầu từ 3–7 ngày tuổi (vắc xin Newcastle nhỏ mắt)?","options":["A. Vì gà con thích uống thuốc.","B. Vì kháng thể từ mẹ (qua trứng) giảm dần sau vài ngày; cần tạo miễn dịch chủ động kịp thời trước khi hết bảo vệ.","C. Vì vắc xin rẻ.","D. Vì thích thì tiêm."],"answer":"B","explain":"Gà con nhận kháng thể mẹ qua lòng đỏ trứng nhưng chỉ bảo vệ vài ngày đầu. Tiêm sớm (3–7 ngày) để tạo miễn dịch chủ động nối tiếp, không để “khoảng trống miễn dịch”.","points":0.25},{"type":"mcq","level":"VD","q":"Đàn gà con 2 tuần tuổi của anh Nam chưa tiêm phòng gì, trong vùng đang có dịch Newcastle. Biện pháp nào đúng?","options":["A. Tiêm ngay vắc xin Newcastle theo hướng dẫn + tăng cường an toàn sinh học, vì đàn đang trong “khoảng trống miễn dịch” rất nguy hiểm.","B. Chờ gà lớn mới tiêm.","C. Không cần tiêm.","D. Bán hết gà."],"answer":"A","explain":"Gà 2 tuần đã hết kháng thể mẹ mà chưa tiêm = không được bảo vệ, lại đang có dịch trong vùng — nguy cơ rất cao. Tiêm ngay + siết an toàn sinh học là xử lí đúng.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trại gà đẻ tiêm phòng đầy đủ nhưng không nhắc lại định kì, 6 tháng sau bùng phát Newcastle. Nguyên nhân và bài học là gì?","options":["A. Vắc xin giả.","B. Miễn dịch sau tiêm giảm dần theo thời gian; không nhắc lại đúng hẹn làm đàn mất bảo vệ — phải tuân thủ lịch nhắc lại đầy đủ.","C. Do thời tiết.","D. Do thức ăn."],"answer":"B","explain":"Kháng thể sau tiêm phòng giảm dần; nhiều vắc xin cần nhắc lại định kì để duy trì miễn dịch. Bỏ nhắc lại = mất bảo vệ dần — bài học về tuân thủ lịch tiêm nghiêm ngặt.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tiêm vắc xin giúp cơ thể tạo miễn dịch chủ động.","b) Sữa đầu cho con non miễn dịch thụ động.","c) Miễn dịch chủ động bảo vệ lâu dài hơn miễn dịch thụ động.","d) Không cần nhắc lại vắc xin định kì."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cần nhắc lại để duy trì miễn dịch.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Kháng thể mẹ chỉ bảo vệ gà con trong vài ngày đầu.","b) Cần tiêm phòng kịp thời để không có “khoảng trống miễn dịch”.","c) Không nhắc lại vắc xin làm đàn mất dần bảo vệ.","d) Tiêm một lần bảo vệ suốt đời vật nuôi."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: miễn dịch giảm dần, cần nhắc lại.","points":1},{"type":"short","level":"VD","q":"Phân biệt ngắn gọn miễn dịch chủ động và miễn dịch thụ động.","answer":"chủ động là cơ thể tự tạo kháng thể còn thụ động là nhận kháng thể từ mẹ","explain":"Miễn dịch chủ động: cơ thể tự tạo kháng thể sau tiêm vắc xin/khỏi bệnh, bảo vệ lâu dài. Miễn dịch thụ động: nhận kháng thể sẵn có từ mẹ (sữa đầu, trứng), bảo vệ ngắn hạn.","points":0.5},{"type":"short","level":"VDC","q":"Vì sao phải nhắc lại vắc xin định kì cho vật nuôi?","answer":"vì lượng kháng thể sau tiêm giảm dần theo thời gian","explain":"Kháng thể tạo ra sau tiêm phòng giảm dần theo thời gian. Nhắc lại đúng hẹn giúp duy trì mức kháng thể bảo vệ, tránh “khoảng trống miễn dịch” gây bùng phát dịch.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Nguyên tắc “phòng bệnh hơn chữa bệnh” có nghĩa là gì?","options":["A. Đầu tư cho phòng bệnh (vệ sinh, vắc xin, an toàn sinh học) hiệu quả và rẻ hơn nhiều so với chữa bệnh khi đã mắc.","B. Không cần chữa bệnh.","C. Bệnh không nguy hiểm.","D. Chỉ phòng không chữa."],"answer":"A","explain":"Phòng bệnh tốn ít chi phí, ngăn được thiệt hại lớn; chữa bệnh tốn kém, hiệu quả thấp, nhất là bệnh vi rút — nên ưu tiên phòng bệnh.","points":0.25},{"type":"mcq","level":"NB","q":"Thú y trong chăn nuôi có vai trò gì?","options":["A. Chẩn đoán, điều trị bệnh; tư vấn phòng bệnh, tiêm phòng cho đàn vật nuôi.","B. Chỉ bán thuốc.","C. Chỉ tiêm phòng.","D. Không có vai trò gì."],"answer":"A","explain":"Cán bộ thú y: chẩn đoán, điều trị; xây dựng lịch tiêm phòng; tư vấn an toàn sinh học; giám sát, xử lí dịch bệnh — người đồng hành không thể thiếu của người chăn nuôi.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao người chăn nuôi nên có mối quan hệ tốt với cán bộ thú y địa phương?","options":["A. Để được giảm giá thuốc.","B. Để được tư vấn phòng bệnh kịp thời, chẩn đoán, điều trị đúng khi có bệnh và cập nhật thông tin dịch bệnh trong vùng.","C. Để khoe đàn vật nuôi.","D. Không cần thiết."],"answer":"B","explain":"Thú y địa phương nắm thông tin dịch bệnh vùng, có chuyên môn chẩn đoán, điều trị và lịch tiêm phòng phù hợp — là “bác sĩ gia đình” của đàn vật nuôi, giúp giảm thiệt hại đáng kể.","points":0.25},{"type":"mcq","level":"TH","q":"Tổng kết các biện pháp phòng bệnh, nhóm biện pháp nào là nền tảng nhất?","options":["A. Vệ sinh, chăm sóc, dinh dưỡng tốt — vì rẻ tiền, thực hiện hằng ngày và nâng sức đề kháng tổng thể của đàn.","B. Chỉ dùng thuốc.","C. Chỉ tiêm phòng.","D. Không có nhóm nào quan trọng."],"answer":"A","explain":"Vệ sinh, dinh dưỡng, chăm sóc tốt là nền tảng: rẻ, làm hằng ngày, tăng đề kháng chung chống mọi bệnh. Vắc xin, thuốc là bổ sung — “nền móng” vẫn là chăm sóc tốt.","points":0.25},{"type":"mcq","level":"VD","q":"Hộ cô Lan nuôi 30 lợn, ít khi dọn chuồng, không tiêm phòng, khi ốm mới mua thuốc. Tỉ lệ hao hụt cao. Cần thay đổi gì trước tiên?","options":["A. Mua thuốc đắt tiền hơn.","B. Chuyển sang phòng bệnh là chính: vệ sinh hằng ngày, tiêm phòng đầy đủ, an toàn sinh học — thay đổi tư duy từ “chữa” sang “phòng”.","C. Nuôi thêm nhiều lợn.","D. Bỏ chăn nuôi."],"answer":"B","explain":"Tư duy “có bệnh mới chữa” là nguyên nhân hao hụt cao. Chuyển sang phòng bệnh chủ động: vệ sinh, vắc xin, an toàn sinh học — chi phí ít hơn nhiều so với thiệt hại do bệnh.","points":0.25},{"type":"mcq","level":"VDC","q":"Đánh giá mô hình: trang trại A chi 5% chi phí cho phòng bệnh (vệ sinh, vắc xin), hao hụt 3%; hộ B không chi cho phòng bệnh, hao hụt 25%. Kết luận nào đúng?","options":["A. Hộ B tiết kiệm hơn.","B. Đầu tư phòng bệnh nhỏ (5%) giúp giảm hao hụt lớn (từ 25% xuống 3%) — hiệu quả kinh tế vượt trội, chứng minh “phòng hơn chữa”.","C. Hai mô hình như nhau.","D. Không thể so sánh."],"answer":"B","explain":"Con số minh chứng: chi 5% cho phòng bệnh để tránh mất 22% đàn — lợi nhuận chênh lệch rất lớn. Phòng bệnh là khoản đầu tư sinh lời cao nhất trong chăn nuôi.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Phòng bệnh hiệu quả và rẻ hơn chữa bệnh.","b) Thú y giúp chẩn đoán, điều trị và tư vấn phòng bệnh.","c) Vệ sinh, dinh dưỡng tốt là nền tảng phòng bệnh.","d) Có bệnh mới cần quan tâm đến thú y."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: cần gắn bó thường xuyên để phòng bệnh.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đầu tư nhỏ cho phòng bệnh giúp giảm lớn hao hụt.","b) Tư duy “có bệnh mới chữa” gây thiệt hại lớn.","c) Người chăn nuôi nên phối hợp chặt chẽ với thú y địa phương.","d) Phòng bệnh tốn kém hơn chữa bệnh."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: phòng bệnh rẻ hơn nhiều.","points":1},{"type":"short","level":"VD","q":"Nêu 2 nhóm biện pháp phòng bệnh cho vật nuôi.","answer":"vệ sinh chăm sóc tốt, tiêm phòng vắc xin","explain":"Các nhóm biện pháp phòng bệnh: vệ sinh, chăm sóc, dinh dưỡng tốt; tiêm phòng vắc xin; an toàn sinh học; kiểm dịch, cách li.","points":0.5},{"type":"short","level":"VDC","q":"Chứng minh ngắn gọn “phòng bệnh hơn chữa bệnh” bằng con số.","answer":"chi 5 phần trăm cho phòng bệnh giảm hao hụt từ 25 phần trăm xuống 3 phần trăm","explain":"Đầu tư nhỏ (khoảng 5% chi phí) cho vệ sinh, vắc xin giúp giảm hao hụt từ 25% xuống còn 3% — hiệu quả kinh tế vượt trội so với chữa bệnh khi đã mắc.","points":0.5}]}]}
