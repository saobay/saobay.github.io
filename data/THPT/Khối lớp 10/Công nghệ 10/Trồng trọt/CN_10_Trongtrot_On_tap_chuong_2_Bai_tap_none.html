l": "TH", "q": "Đốt rơm rạ sau thu hoạch gây hại gì cho đất và môi trường?", "options": ["A. Ô nhiễm không khí, mất hữu cơ, diệt vi sinh vật có ích", "B. Làm đất tốt hơn", "C. Tăng mùn", "D. Không gây hại"], "answer": "A", "explain": "Đốt: khói ô nhiễm, mất N và hữu cơ, diệt vi sinh vật — nên ủ làm phân.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một hộ trồng hoa lan dùng dớn bị mục, thối rễ lan. Xử lí nào đúng?", "options": ["A. Thay dớn mới, chuyển sang vỏ thông + than củi thoáng bền hơn", "B. Tưới thêm nước", "C. Bón thêm phân", "D. Để nguyên"], "answer": "A", "explain": "Dớn mục giữ nước quá mức gây thối rễ; thay giá thể thoáng, bền như vỏ thông, than củi.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mùn là dạng hữu cơ có ích cho đất.", "b) Bón hữu cơ, trồng họ đậu cải tạo đất bạc màu.", "c) Trấu hun tạo bằng cách đốt yếm khí vỏ trấu.", "d) Nhiều giun đất là dấu hiệu đất tốt."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về giá thể trồng lan:", "statements": ["a) Dớn mục, giữ nước quá mức gây thối rễ lan.", "b) Vỏ thông, than củi thoáng khí, bền, phù hợp trồng lan.", "c) Nên thay giá thể khi bị mục nát.", "d) Giá thể mục cứ để nguyên không ảnh hưởng gì."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: giá thể mục gây úng, thối rễ.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai vai trò của mùn đối với đất trồng.", "answer": "Cung cấp dinh dưỡng; cải thiện cấu trúc, tơi xốp đất (chấp nhận: giữ nước, giữ phân)", "explain": "Mùn: kho dinh dưỡng + kết dính hạt đất thành viên xốp, tăng giữ nước, giữ phân.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao nên ủ rơm rạ làm phân thay vì đốt bỏ?", "answer": "Tăng mùn cho đất; giảm ô nhiễm không khí (chấp nhận ý tương đương)", "explain": "Ủ hoai: trả "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ôxi trong đất giúp rễ hô hấp.", "b) Đất úng cần tiêu nước bằng mương, luống cao.", "c) Vermiculite giữ nước, giữ phân tốt.", "d) Đất cát giữ phân kém do dễ bị rửa trôi."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các biện pháp cải tạo đất cát:", "statements": ["a) Bón phân hữu cơ tăng khả năng giữ nước, giữ phân.", "b) Trồng cây chắn gió hạn chế cát bay.", "c) Che phủ, tưới giữ ẩm thường xuyên.", "d) Nén chặt đất cát giúp cây phát triển tốt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nén chặt làm bí đất, rễ khó phát triển.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai tác hại của bón thừa phân hóa học.", "answer": "Chai cứng đất; ô nhiễm môi trường (chấp nhận: tồn dư nông sản, lãng phí)", "explain": "Thừa phân: đất chai, chua; rửa trôi ô nhiễm nước; tồn dư trên nông sản.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao đất cát cần bón phân nhiều lần với liều nhỏ?", "answer": "Vì đất cát giữ phân kém, dễ bị rửa trôi (chấp nhận ý tương đương)", "explain": "Cát ít keo hấp phụ; bón một lần nhiều bị rửa trôi lãng phí — chia nhỏ nhiều lần hiệu quả hơn.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Đất phù sa phân bố chủ yếu ở đâu?", "options": ["A. Đồng bằng sông Hồng và sông Cửu Long", "B. Đỉnh núi cao", "C. Ngoài biển", "D. Sa mạc"], "answer": "A", "explain": "Phù sa do sông bồi đắp ở đồng bằng — màu mỡ, vựa lúa cả nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong cải tạo đất phèn, sau khi bón vôi khử chua cần làm gì tiếp theo?", "options": ["A. Rửa phèn bằng nước ngọt và lên liếp thoát nước", "B. Bón thêm phèn cho đất", "C. Tưới nước mặn vào ruộng", "D. Để đất khô hạn kéo dài"], "answer": "A", "explain": "Bón vôi khử chua xong phải rửa trôi độc tố phèn bằng nước ngọt, lên liếp thoát nước — quy trình hoàn chỉnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Than bùn có đặc điểm gì nổi bật?", "options": ["A. Giàu hữu cơ, giữ nước và giữ phân tốt", "B. Rất nhẹ như xốp", "C. Không giữ nước", "D. Chứa mầm bệnh"], "answer": "A", "explain": "Than bùn từ thực vật đầm lầy phân hủy: hữu cơ cao, giữ ẩm, giữ dinh dưỡng tốt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao đất phù sa ven sông màu mỡ?", "options": ["A. Vì được bồi đắp phù sa mới giàu dinh dưỡng hằng năm", "B. Vì không ai canh tác", "C. Vì bị ngập", "D. Vì toàn cát"], "answer": "A", "explain": "Mỗi mùa lũ bồi lớp phù sa mới — đất luôn được 'bón phân' tự nhiên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Xen canh ngô với đậu tương có lợi gì?", "options": ["A. Tận dụng đất, đậu làm giàu đạm, tăng thu nhập", "B. Làm đất nghèo đi", "C. Tăng sâu bệnh", "D. Không lợi gì"], "answer": "A", "explain": "Xen canh tận dụng không gian; đậu cố định đạm nuôi cả ngô — hai lợi ích.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vùng đất phèn ở ĐBSCL sau cải tạo trồng lúa 2 vụ thành công. Yếu tố then chốt nào?", "options": ["A. Bón vôi khử chua kết hợp rửa phèn bằng nước ngọt", "B. Gieo giống bất kì", "C. Bón thêm phèn", "D. Tưới nước mặn"], "answer": "A", "explain": "Khử chua (vôi) + rửa độc tố (nước ngọt) là then chốt biến đất phèn thành đất canh tác.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đất phù sa ở đồng bằng sông Hồng, sông Cửu Long.", "b) Lên liếp giúp thoát nước phèn.", "c) Than bùn giàu hữu cơ, giữ nước tốt.", "d) Xen canh ngô – đậu tận dụng đất, làm giàu đạm."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của quy trình cải tạo đất phèn trồng lúa:", "statements": ["a) Bón vôi khử chua.", "b) Rửa phèn bằng nước ngọt.", "c) Lên liếp thoát nước phèn.", "d) Gieo lúa ngay không cần cải tạo."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đất phèn chưa cải tạo trồng lúa sẽ chết, thất bát.", "points": 1}, {"type": "short", "level": "VDC", "q": "So sánh đất phù sa và đất phèn (độ phì, phân bố).", "answer": "Phù sa: đồng bằng, màu mỡ; phèn: ĐBSCL, chua độc cần cải tạo", "explain": "Phù sa bồi đắp hằng năm, màu mỡ. Phèn ở ĐBSCL, chua, chứa độc tố, phải cải tạo.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai lợi ích của xen canh cây họ đậu.", "answer": "Làm giàu đạm cho đất; tăng thu nhập, che phủ đất (chấp nhận ý tương đương)", "explain": "Họ đậu cố định đạm; xen canh tận dụng đất, tăng sản phẩm, che phủ chống xói mòn.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Vi sinh vật đất có vai trò gì?", "options": ["A. Cố định đạm, phân giải hữu cơ làm giàu dinh dưỡng", "B. Ăn rễ cây", "C. Gây úng đất", "D. Không vai trò"], "answer": "A", "explain": "Vi khuẩn cố định đạm, vi sinh phân giải xác sinh vật thành dinh dưỡng cây dùng được.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Rừng phòng hộ ven biển có vai trò gì?", "options": ["A. Chắn gió, chắn cát, bảo vệ đất", "B. Lấy gỗ xuất khẩu", "C. Trồng cây ăn quả", "D. Không vai trò"], "answer": "A", "explain": "Rừng phi lao chắn gió bão, cố định cát bay, bảo vệ đất canh tác ven biển.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nếu đo pH giá thể được giá trị 8,5, cần xử lí thế nào trước khi trồng?", "options": ["A. Điều chỉnh hạ pH về khoảng 5,5–6,5", "B. Để nguyên vì càng kiềm càng tốt", "C. Tăng pH lên cao hơn nữa", "D. Đổ bỏ giá thể ngay lập tức"], "answer": "A", "explain": "pH 8,5 quá kiềm, cây khó hấp thụ vi lượng; cần hạ về khoảng 5,5–6,5 là tối ưu cho đa số cây.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biện pháp nào sau đây KHÔNG giúp chống xói mòn trên đất dốc?", "options": ["A. Cày xới theo chiều dốc", "B. Trồng cây theo đường đồng mức", "C. Che phủ đất bằng rơm rạ", "D. Làm ruộng bậc thang"], "answer": "A", "explain": "Cày xuôi dốc tạo rãnh dẫn nước, làm xói mòn nặng thêm; các biện pháp còn lại đều chống xói mòn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giá thể trồng rau mầm không cần nhiều dinh dưỡng vì sao?", "options": ["A. Vì rau mầm dùng dinh dưỡng dự trữ trong hạt, thu hoạch sớm", "B. Vì rau mầm không cần dinh dưỡng", "C. Vì giá thể tự sinh dinh dưỡng", "D. Vì rau mầm là cây dại"], "answer": "A", "explain": "Hạt đủ dinh dưỡng nuôi mầm 7–10 ngày; giá thể chỉ cần giữ ẩm, sạch.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một đồi trồng cà phê bị rửa trôi mạnh sau mưa. Giải pháp tổng hợp nào đúng?", "options": ["A. Trồng theo đường đồng mức, trồng cây che phủ, bón hữu cơ", "B. Cày xới theo chiều dốc", "C. Để đất trống", "D. Bón nhiều phân hóa học"], "answer": "A", "explain": "Đồng mức + che phủ chống xói mòn; hữu cơ cải thiện đất dốc — bền vững.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vi sinh vật đất làm giàu dinh dưỡng.", "b) Rừng ven biển chắn gió, chắn cát.", "c) pH giá thể phù hợp khoảng 5,5–6,5.", "d) Đất dốc dễ bị xói mòn hơn đất bằng."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các giải pháp chống xói mòn đồi cà phê:", "statements": ["a) Trồng theo đường đồng mức.", "b) Trồng cây che phủ giữa các hàng.", "c) Bón phân hữu cơ cải tạo đất.", "d) Cày xới theo chiều dốc."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cày xuôi dốc làm xói mòn nặng thêm.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai vai trò của vi sinh vật đất.", "answer": "Cố định đạm khí trời; phân giải chất hữu cơ (chấp nhận: tăng độ phì)", "explain": "Vi khuẩn nốt sần cố định N2; vi sinh phân giải xác sinh vật thành mùn, dinh dưỡng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích vì sao rau mầm có thể trồng trên khăn giấy ẩm.", "answer": "Hạt dự trữ đủ dinh dưỡng; chỉ cần ẩm và sạch để nảy mầm (chấp nhận ý tương đương)", "explain": "Rau mầm thu hoạch sau 7–10 ngày, sống nhờ dinh dưỡng trong hạt — khăn ẩm sạch là đủ.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Thành phần cơ giới của đất là tỉ lệ của các hạt nào?", "options": ["A. Cát, limon, sét", "B. Nước và khí", "C. Mùn và đá", "D. Phân và thuốc"], "answer": "A", "explain": "Cơ giới = tỉ lệ cát, limon, sét — quyết định đất cát, thịt hay sét.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hệ số sử dụng đất được nâng cao nhờ biện pháp nào?", "options": ["A. Tăng vụ và xen canh trên cùng diện tích", "B. Bỏ hoang đất nông nghiệp", "C. Giảm số vụ gieo trồng", "D. Độc canh một vụ duy nhất"], "answer": "A", "explain": "Tăng vụ (2–3 vụ/năm), xen canh tận dụng đất tối đa — nâng hệ số sử dụng đất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giá thể cần được thay mới khi nào?", "options": ["A. Khi mục nát, nén chặt, nhiễm bệnh hoặc hết dinh dưỡng", "B. Không bao giờ", "C. Mỗi ngày", "D. Khi cây ra hoa"], "answer": "A", "explain": "Giá thể suy giảm chất lượng thì mất tác dụng — cần thay để cây khỏe.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không nên cày đất khi đất quá ướt?", "options": ["A. Vì đất ướt cày bị nén chặt, phá vỡ cấu trúc đất", "B. Vì cày lúc nào cũng tốt", "C. Vì tốn ít công", "D. Vì không có lí do"], "answer": "A", "explain": "Cày đất ướt làm mất cấu trúc viên, nén chặt — nên cày khi đất đủ ẩm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ưu điểm của phân hữu cơ so với phân hóa học trong cải tạo đất là gì?", "options": ["A. Cải thiện cấu trúc đất, tăng mùn, an toàn lâu dài", "B. Tác dụng nhanh hơn", "C. Luôn rẻ hơn", "D. Không cần bón nhiều"], "answer": "A", "explain": "Hữu cơ cải tạo toàn diện lí-hóa-sinh, bền vững; hóa học tác dụng nhanh nhưng không cải tạo cấu trúc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nông dân muốn cải tạo 1 ha đất bạc màu trồng màu lâu dài. Kế hoạch nào bền vững nhất?", "options": ["A. Bón hữu cơ, luân canh với họ đậu, trả lại phụ phẩm cho đất", "B. Bón thật nhiều phân hóa học", "C. Đốt hết phụ phẩm", "D. Bỏ hoang"], "answer": "A", "explain": "Hữu cơ + họ đậu + trả phụ phẩm = phục hồi độ phì bền vững, chi phí hợp lí.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thành phần cơ giới là tỉ lệ cát, limon, sét.", "b) Tăng vụ là tăng số vụ trồng trong một năm.", "c) Giá thể mục nát, nhiễm bệnh cần thay mới.", "d) Cày đất ướt làm nén chặt, phá cấu trúc đất."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của kế hoạch cải tạo đất bạc màu:", "statements": ["a) Bón phân hữu cơ tăng mùn cho đất.", "b) Luân canh cây họ đậu làm giàu đạm.", "c) Trả lại phụ phẩm (rơm rạ) cho đất.", "d) Bón thật nhiều phân hóa học là cách bền vững nhất."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: lạm dụng hóa học gây chai đất, không bền vững.", "points": 1}, {"type": "short", "level": "VDC", "q": "Phân biệt đất thịt với đất cát, đất sét (thành phần và tính chất).", "answer": "Thịt: cân đối cát-limon-sét, tốt nhất; cát: rời, thoát nhanh; sét: dính, bí", "explain": "Thịt cân đối giữ nước vừa phải, thoáng. Cát rời, giữ nước kém. Sét dính, giữ nước tốt nhưng bí.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai nguyên nhân khiến đất bị bạc màu.", "answer": "Canh tác bóc lột không bón trả; xói mòn rửa trôi (chấp nhận: độc canh, đốt phụ phẩm)", "explain": "Lấy dinh dưỡng không bù đắp + xói mòn mất lớp mặt + độc canh = bạc màu.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Đất feralit phân bố chủ yếu ở đâu?", "options": ["A. Trung du và miền núi", "B. Đồng bằng sông Hồng", "C. Đồng bằng sông Cửu Long", "D. Ngoài biển"], "answer": "A", "explain": "Feralit (đỏ vàng) hình thành trên đồi núi vùng nhiệt đới ẩm — chua, nghèo dinh dưỡng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một địa phương muốn bảo vệ đất trồng. Việc làm nào sau đây là đúng?", "options": ["A. Trồng rừng phòng hộ đầu nguồn, thu gom bao bì thuốc trừ sâu", "B. Phá rừng đầu nguồn lấy đất sản xuất", "C. Xả nước thải chưa xử lí ra ruộng", "D. Đốt rơm rạ bừa bãi sau thu hoạch"], "answer": "A", "explain": "Trồng rừng chống xói mòn, thu gom bao bì tránh ô nhiễm — đều là bảo vệ đất; các việc còn lại hủy hoại đất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xơ dừa thô chưa xử lí có nhược điểm gì?", "options": ["A. Chứa tanin gây hại rễ non", "B. Quá nhẹ", "C. Quá rẻ", "D. Không nhược điểm"], "answer": "A", "explain": "Tanin, muối trong xơ dừa thô gây cháy rễ — phải ngâm, xả chát kĩ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao đất đỏ bazan Tây Nguyên trồng cà phê tốt?", "options": ["A. Vì tơi xốp, giàu dinh dưỡng, thoát nước tốt", "B. Vì rất chua", "C. Vì nhiễm mặn", "D. Vì toàn đá"], "answer": "A", "explain": "Bazan từ đá núi lửa: tơi xốp, giàu khoáng, thoát nước — lí tưởng cho cà phê, hồ tiêu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Che phủ đất bằng rơm rạ có tác dụng gì?", "options": ["A. Hạn chế xói mòn, giữ ẩm, tăng mùn", "B. Làm đất xấu đi", "C. Thu hút sâu bệnh", "D. Không tác dụng"], "answer": "A", "explain": "Lớp phủ giảm lực mưa, giữ ẩm, phân hủy thành mùn — bảo vệ đất đơn giản, hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một công ty xả thải ra ruộng lúa gây chết lúa. Cần xử lí thế nào?", "options": ["A. Buộc dừng xả thải, xử lí ô nhiễm, bồi thường, xử phạt theo pháp luật", "B. Để yên", "C. Khuyên nông dân chịu thiệt", "D. Xả tiếp"], "answer": "A", "explain": "Xả thải gây ô nhiễm vi phạm pháp luật môi trường: dừng, khắc phục, bồi thường, xử phạt.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đất feralit ở trung du, miền núi.", "b) Bảo vệ đất gồm chống xói mòn, ô nhiễm, thoái hóa.", "c) Xơ dừa thô chứa tanin gây hại rễ.", "d) Đất bazan tơi xốp, thích hợp trồng cà phê."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về xử lí ô nhiễm:", "statements": ["a) Phải buộc cơ sở gây ô nhiễm dừng xả thải.", "b) Cần xử lí, cải tạo vùng đất bị ô nhiễm.", "c) Cơ sở gây ô nhiễm phải bồi thường thiệt hại.", "d) Ô nhiễm đất công nghiệp không cần xử lí."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phải xử lí nghiêm theo pháp luật.", "points": 1}, {"type": "short", "level": "VDC", "q": "So sánh đất feralit và đất phù sa.", "answer": "Feralit: đồi núi, chua nghèo; phù sa: đồng bằng, màu mỡ", "explain": "Feralit chua, nghèo dinh dưỡng ở trung du, miền núi. Phù sa bồi đắp hằng năm, màu mỡ ở đồng bằng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai việc cần làm khi phát hiện cơ sở xả thải gây ô nhiễm đất nông nghiệp.", "answer": "Báo chính quyền; yêu cầu dừng xả thải, xử lí (chấp nhận: thu thập bằng chứng)", "explain": "Báo cơ quan chức năng, yêu cầu dừng ngay, xử lí ô nhiễm và bồi thường theo pháp luật.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Cấu trúc đất tốt cho cây trồng là cấu trúc nào?", "options": ["A. Cấu trúc viên, tơi xốp, thoáng khí", "B. Cấu trúc tảng lớn, cứng", "C. Đất nén chặt", "D. Đất toàn sỏi"], "answer": "A", "explain": "Cấu trúc viên tơi xốp: vừa giữ nước vừa thoáng khí — lí tưởng cho rễ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cải tạo đất là gì?", "options": ["A. Làm đất xấu trở nên tốt, phù hợp cây trồng", "B. Bỏ hoang đất", "C. Đổ rác ra đất", "D. Khai thác kiệt quệ"], "answer": "A", "explain": "Cải tạo = biến đất xấu (chua, phèn, mặn, bạc màu...) thành đất canh tác được.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giá thể nào bền nhất, lâu mục nhất khi trồng lan?", "options": ["A. Than củi", "B. Giấy báo", "C. Vải vụn", "D. Xốp mỏng"], "answer": "A", "explain": "Than củi cứng, khó phân hủy, dùng nhiều năm — bền nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao đất giàu mùn giữ phân bón tốt?", "options": ["A. Vì keo mùn hấp phụ ion dinh dưỡng, nhả dần cho cây", "B. Vì mùn đẩy phân ra", "C. Vì mùn không tan", "D. Vì mùn làm đất cứng"], "answer": "A", "explain": "Keo mùn, keo sét giữ cation dinh dưỡng — đất giàu mùn ít bị rửa trôi phân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa bảo vệ đất và phát triển bền vững là gì?", "options": ["A. Bảo vệ đất là điều kiện để nông nghiệp phát triển bền vững", "B. Không liên quan", "C. Bảo vệ đất cản trở phát triển", "D. Chỉ cần khai thác"], "answer": "A", "explain": "Đất là tư liệu sản xuất chính; mất đất thì không thể phát triển lâu dài.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vườn cà phê đất chai cứng sau nhiều năm bón hóa học. Lộ trình phục hồi nào đúng?", "options": ["A. Giảm hóa học, bón vôi và hữu cơ, trồng cây che phủ", "B. Tăng gấp đôi phân hóa học", "C. Đốn bỏ cà phê", "D. Tưới nước mặn"], "answer": "A", "explain": "Giảm hóa học + vôi, hữu cơ tái tạo cấu trúc + che phủ — phục hồi bền vững.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cấu trúc viên giúp đất tơi xốp, thoáng khí.", "b) Cải tạo đất là làm đất xấu trở nên tốt.", "c) Than củi là giá thể lan bền, lâu mục.", "d) Bảo vệ đất là điều kiện phát triển bền vững."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về phục hồi đất thoái hóa:", "statements": ["a) Cần giảm dần phân hóa học, tăng phân hữu cơ.", "b) Trồng cây họ đậu, cây phân xanh giúp phục hồi đất.", "c) Che phủ đất hạn chế xói mòn trong quá trình phục hồi.", "d) Đất thoái hóa nặng có thể phục hồi hoàn toàn chỉ sau 1–2 tuần."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: lộ trình phục hồi bền vững. d) Sai: phục hồi đất là quá trình lâu dài, cần nhiều vụ.", "points": 1}, {"type": "short", "level": "VDC", "q": "Liệt kê ba nhóm tính chất của đất và một ví dụ mỗi nhóm.", "answer": "Vật lí (cơ giới), hóa học (pH), sinh học (vi sinh vật)", "explain": "Vật lí: cơ giới, cấu trúc. Hóa học: pH, dinh dưỡng. Sinh học: vi sinh vật, giun đất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai dấu hiệu nhận biết đất bị chai cứng do lạm dụng phân hóa học.", "answer": "Đất cứng, khó cày xới; ít giun, cây còi cọc (chấp nhận ý tương đương)", "explain": "Đất chai: cứng, nứt nẻ, ít sinh vật đất, cây kém phát triển dù bón nhiều phân.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Xác bã thực vật vùi trong đất biến thành mùn nhờ quá trình nào?", "options": ["A. Phân hủy bởi vi sinh vật đất", "B. Quang hợp của cây xanh", "C. Hô hấp của rễ cây", "D. Thoát hơi nước qua lá"], "answer": "A", "explain": "Vi sinh vật phân giải xác sinh vật thành mùn — nguồn hữu cơ quý làm đất màu mỡ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việc làm nào sau đây thể hiện sử dụng đất nông nghiệp hợp lí?", "options": ["A. Luân canh, bón phân cân đối, không bỏ hoang đất", "B. Bỏ hoang đất nhiều năm liên tục", "C. Khai thác đất kiệt quệ không bồi bổ", "D. Đổ chất thải chưa xử lí ra ruộng"], "answer": "A", "explain": "Luân canh cải tạo đất, bón cân đối, khai thác liên tục không bỏ hoang — sử dụng hợp lí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giá thể góp phần phát triển nông nghiệp theo hướng nào?", "options": ["A. Nông nghiệp đô thị, công nghệ cao, sạch và bền vững", "B. Nông nghiệp lạc hậu", "C. Phá rừng", "D. Ô nhiễm môi trường"], "answer": "A", "explain": "Giá thể là nền tảng của thủy canh, nông nghiệp đô thị, sản xuất sạch hiện đại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa độ xốp của đất và sinh trưởng của rễ là gì?", "options": ["A. Đất xốp giúp rễ hô hấp, đâm sâu, hút nước và dinh dưỡng tốt", "B. Đất càng chặt rễ càng khỏe", "C. Không liên quan", "D. Rễ không cần ôxi"], "answer": "A", "explain": "Đất xốp đủ ôxi, rễ phát triển mạnh — cây khỏe, năng suất cao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tổng hợp các biện pháp cải tạo đất xấu gồm những nhóm nào?", "options": ["A. Thủy lợi, bón phân, canh tác và chọn giống phù hợp", "B. Chỉ bón phân", "C. Chỉ tưới nước", "D. Chỉ chọn giống"], "answer": "A", "explain": "Cải tạo tổng hợp: thủy lợi (rửa, tiêu), bón phân (vôi, hữu cơ), canh tác, giống chống chịu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nông trại muốn vừa bảo vệ đất vừa tăng lợi nhuận. Mô hình nào phù hợp?", "options": ["A. Luân canh, xen canh, phân hữu cơ, che phủ đất, trồng đa tầng", "B. Độc canh, bón nhiều hóa chất", "C. Bỏ hoang một nửa", "D. Khai thác kiệt quệ"], "answer": "A", "explain": "Đa canh + hữu cơ + che phủ: bảo vệ đất, đa dạng thu nhập, bền vững.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mùn do vi sinh vật phân hủy xác sinh vật tạo thành.", "b) Bỏ hoang đất là sử dụng hợp lí.", "c) Giá thể phát triển nông nghiệp đô thị, công nghệ cao.", "d) Cải tạo đất cần kết hợp nhiều biện pháp."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: bỏ hoang là lãng phí. c), d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nông nghiệp tuần hoàn:", "statements": ["a) Tận dụng rơm rạ, phân chuồng để làm phân hữu cơ.", "b) Kết hợp trồng trọt – chăn nuôi để tận dụng phụ phẩm lẫn nhau.", "c) Giảm hóa chất, ưu tiên biện pháp sinh học.", "d) Nông nghiệp tuần hoàn làm tăng ô nhiễm môi trường."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: nguyên tắc tuần hoàn, khép kín. d) Sai: tuần hoàn giúp giảm ô nhiễm, tiết kiệm tài nguyên.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai loại giá thể khoáng nung nở và ưu điểm chung của chúng.", "answer": "Perlite, vermiculite; nhẹ, sạch, bền (chấp nhận: thoáng khí / giữ nước tốt)", "explain": "Perlite, vermiculite là khoáng nung nở: nhẹ, sạch mầm bệnh, bền, dùng lâu dài.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai việc nông dân cần làm khi có dự báo mưa lớn kéo dài trên đất dốc.", "answer": "Khơi thông mương thoát nước; che phủ, gia cố chống xói mòn (chấp nhận: thu hoạch sớm)", "explain": "Chủ động thoát nước chống úng, che phủ chống xói mòn, thu hoạch sớm nếu cần.", "points": 0.5}]}]}
