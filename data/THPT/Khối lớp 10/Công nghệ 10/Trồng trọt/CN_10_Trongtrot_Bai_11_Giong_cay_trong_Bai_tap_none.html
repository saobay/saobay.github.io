à yếu tố quyết định năng suất.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 2 vai trò quan trọng nhất của giống cây trồng.", "answer": "quyết định năng suất, quyết định chất lượng nông sản", "explain": "Hai vai trò quan trọng nhất: quyết định năng suất và quyết định chất lượng nông sản.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Câu tục ngữ nào nói về vai trò của giống trong trồng trọt? (Viết đầy đủ)", "answer": "nhất nước, nhì phân, tam cần, tứ giống", "explain": "Câu tục ngữ: \"Nhất nước, nhì phân, tam cần, tứ giống\" — giống là yếu tố thứ tư quyết định thành công.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Giống kháng sâu bệnh có lợi ích gì?", "options": ["A. Giảm thuốc bảo vệ thực vật, giảm chi phí và bảo vệ môi trường.", "B. Làm sâu bệnh nhiều hơn.", "C. Không có lợi ích gì.", "D. Làm cây yếu đi."], "answer": "A", "explain": "Giống kháng sâu bệnh giúp giảm phun thuốc, tiết kiệm chi phí, an toàn môi trường và nông sản.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vùng đất nhiễm mặn nên chọn giống cây trồng như thế nào?", "options": ["A. Giống chịu mặn.", "B. Giống chịu hạn.", "C. Giống ngắn ngày.", "D. Giống nào cũng được."], "answer": "A", "explain": "Đất mặn cần giống chịu mặn mới sinh trưởng được.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vùng thường xuyên hạn hán nên chọn giống cây trồng như thế nào?", "options": ["A. Giống chịu hạn.", "B. Giống ưa nước.", "C. Giống dài ngày.", "D. Giống nào cũng được."], "answer": "A", "explain": "Vùng hạn cần giống chịu hạn để đảm bảo năng suất khi thiếu nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao giống chống chịu tốt giúp nông dân giảm rủi ro mất mùa?", "options": ["A. Vì cây vẫn sinh trưởng được khi gặp sâu bệnh, hạn, mặn, rét.", "B. Vì cây không cần chăm sóc.", "C. Vì cây tự tưới nước.", "D. Vì không có lí do gì."], "answer": "A", "explain": "Giống chống chịu khỏe giúp cây vượt qua điều kiện bất lợi, hạn chế mất mùa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giống lúa kháng bệnh đạo ôn có ý nghĩa gì trong sản xuất?", "options": ["A. Giảm thiệt hại do bệnh, giảm thuốc trừ bệnh, tăng hiệu quả kinh tế.", "B. Làm bệnh đạo ôn nặng hơn.", "C. Không có ý nghĩa gì.", "D. Chỉ có ý nghĩa quảng cáo."], "answer": "A", "explain": "Kháng bệnh giúp cây khỏe, giảm phun thuốc, tiết kiệm chi phí, năng suất ổn định.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vùng ven biển bị nhiễm mặn ngày càng nặng. Giải pháp về giống lâu dài và bền vững nhất là gì?", "options": ["A. Chọn tạo và sử dụng giống lúa chịu mặn phù hợp.", "B. Ngừng sản xuất nông nghiệp.", "C. Trồng giống lúa thường và bón nhiều phân.", "D. Chuyển sang nuôi trồng thủy sản hoàn toàn."], "answer": "A", "explain": "Giống chịu mặn là giải pháp căn cơ, bền vững để duy trì sản xuất trên đất nhiễm mặn.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về vai trò chống chịu của giống:", "statements": ["a) Giống kháng sâu bệnh giúp giảm thuốc bảo vệ thực vật.", "b) Giống chịu hạn phù hợp với vùng thiếu nước.", "c) Giống chịu mặn phù hợp với vùng đất nhiễm mặn.", "d) Khả năng chống chịu của cây không liên quan đến giống."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: chống chịu do gen của giống quy định.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về ứng dụng giống chống chịu:", "statements": ["a) Giống chống chịu tốt giúp giảm rủi ro mất mùa.", "b) Trồng giống kháng bệnh góp phần bảo vệ môi trường.", "c) Vùng đất phèn nên chọn giống chịu phèn.", "d) Mọi giống cây trồng đều chống chịu tốt như nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: giảm thuốc trừ sâu. c) Đúng. d) Sai: khả năng chống chịu khác nhau giữa các giống.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 3 loại điều kiện bất lợi mà giống chống chịu tốt giúp cây vượt qua.", "answer": "sâu bệnh, hạn hán, nhiễm mặn", "explain": "Giống chống chịu tốt giúp cây vượt qua: sâu bệnh hại, hạn hán, nhiễm mặn, rét, đổ ngã...", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao giống kháng sâu bệnh góp phần bảo vệ môi trường? (Nêu 1 lí do)", "answer": "vì giảm lượng thuốc bảo vệ thực vật phải phun", "explain": "Giống kháng sâu bệnh giúp giảm phun thuốc bảo vệ thực vật, hạn chế ô nhiễm môi trường và tồn dư thuốc trong nông sản.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Giống tốt giúp tăng hiệu quả sử dụng đất đai như thế nào?", "options": ["A. Cho năng suất, thu nhập cao trên cùng một diện tích.", "B. Làm đất rộng ra.", "C. Không cần đất vẫn trồng được.", "D. Không có tác dụng gì."], "answer": "A", "explain": "Giống tốt cho năng suất cao nên thu nhập trên cùng diện tích tăng lên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giống tốt sử dụng phân bón như thế nào?", "options": ["A. Hấp thu và sử dụng hiệu quả phân bón, cho năng suất cao.", "B. Không cần phân bón.", "C. Lãng phí phân bón.", "D. Làm phân bón mất tác dụng."], "answer": "A", "explain": "Giống tốt có bộ rễ khỏe, khả năng hấp thu dinh dưỡng tốt nên sử dụng phân bón hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giống ngắn ngày có lợi ích gì?", "options": ["A. Giúp tăng vụ, tăng số vụ trồng trong năm.", "B. Cho năng suất thấp hơn.", "C. Không có lợi ích gì.", "D. Làm đất xấu đi."], "answer": "A", "explain": "Giống ngắn ngày rút ngắn thời gian sinh trưởng, có thể trồng thêm vụ trong năm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói giống tốt là tiền đề để áp dụng tiến bộ kĩ thuật?", "options": ["A. Vì chỉ khi có giống tốt, các biện pháp thâm canh (phân bón, tưới tiêu, cơ giới) mới phát huy tối đa hiệu quả.", "B. Vì giống tốt không cần kĩ thuật.", "C. Vì kĩ thuật không quan trọng.", "D. Vì không có lí do gì."], "answer": "A", "explain": "Giống tốt có tiềm năng năng suất cao; thâm canh đúng kĩ thuật giúp khai thác tối đa tiềm năng đó.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai hộ cùng diện tích, cùng mức đầu tư phân bón: hộ A dùng giống mới, hộ B dùng giống cũ. Dự đoán đúng là gì?", "options": ["A. Hộ A thường cho năng suất và hiệu quả kinh tế cao hơn.", "B. Hai hộ cho kết quả như nhau.", "C. Hộ B cho năng suất cao hơn.", "D. Không dự đoán được."], "answer": "A", "explain": "Cùng đầu tư, giống mới cho năng suất cao hơn nên hiệu quả kinh tế cao hơn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một địa phương muốn tăng sản lượng lương thực mà không mở rộng diện tích. Giải pháp về giống hiệu quả nhất là gì?", "options": ["A. Đưa giống mới năng suất cao, ngắn ngày vào sản xuất để tăng năng suất và tăng vụ.", "B. Tiếp tục dùng giống cũ.", "C. Bón thật nhiều phân cho giống cũ.", "D. Giảm diện tích trồng."], "answer": "A", "explain": "Giống mới năng suất cao tăng sản lượng trên cùng diện tích; giống ngắn ngày tăng số vụ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về hiệu quả sử dụng của giống tốt:", "statements": ["a) Giống tốt cho năng suất cao trên cùng một diện tích.", "b) Giống tốt sử dụng phân bón, nước tưới hiệu quả hơn.", "c) Giống ngắn ngày giúp tăng vụ trong năm.", "d) Giống tốt làm giảm diện tích đất trồng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: giống tốt tăng thu nhập trên cùng diện tích, không làm giảm diện tích.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về hiệu quả sử dụng giống tốt:", "statements": ["a) Giống tốt là tiền đề để thâm canh tăng năng suất.", "b) Đầu tư phân bón cho giống tốt cho hiệu quả cao hơn giống xấu.", "c) Muốn tăng sản lượng phải mở rộng diện tích, giống không giúp được.", "d) Giống ngắn ngày góp phần tăng số vụ trồng trong năm."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: giống mới năng ỉ phát huy tốt trong điều kiện sinh thái phù hợp.", "B. Vì giống ngoại luôn tốt hơn.", "C. Vì không có lí do gì.", "D. Vì để tiết kiệm tiền mua giống."], "answer": "A", "explain": "Giống có tính thích nghi; đưa giống không phù hợp vào vùng khác dễ thất bại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một giống lúa năng suất rất cao nhưng gạo ăn dở, dễ nhiễm bệnh. Đánh giá đúng là gì?", "options": ["A. Chưa phải là giống tốt vì chưa đáp ứng yêu cầu chất lượng và chống chịu.", "B. Là giống tốt vì năng suất cao.", "C. Là giống tốt nhất.", "D. Không đánh giá được."], "answer": "A", "explain": "Giống tốt phải đáp ứng đồng thời: năng suất, chất lượng, chống chịu; thiếu một yếu tố thì chưa đạt.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một địa phương có 2 giống lúa: giống X năng suất 70 tạ/ha nhưng nhiễm bệnh nặng; giống Y năng suất 60 tạ/ha, kháng bệnh tốt, gạo ngon. Nên khuyến cáo giống nào và vì sao?", "options": ["A. Giống Y vì đáp ứng tổng hòa: năng suất khá, kháng bệnh, chất lượng tốt, hiệu quả bền vững.", "B. Giống X vì năng suất cao nhất.", "C. Không nên trồng lúa.", "D. Trồng cả hai lẫn lộn."], "answer": "A", "explain": "Chọn giống phải cân nhắc tổng hòa các yêu cầu; giống Y bền vững và hiệu quả kinh tế thực tế cao hơn.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về yêu cầu của giống tốt:", "statements": ["a) Giống tốt phải sinh trưởng, phát triển tốt, thích nghi địa phương.", "b) Giống tốt phải cho năng suất cao và ổn định.", "c) Giống tốt phải cho nông sản chất lượng tốt.", "d) Giống tốt phải chống chịu được sâu bệnh và điều kiện bất lợi."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: cả 4 đều là yêu cầu của giống tốt.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về yêu cầu của giống tốt:", "statements": ["a) Giống năng suất cao nhưng chất lượng kém vẫn là giống tốt.", "b) Chọn giống phải phù hợp với điều kiện khí hậu, đất đai địa phương.", "c) Giống tốt cần đáp ứng đồng thời nhiều yêu cầu.", "d) Giống dễ nhiễm sâu bệnh không được coi là giống tốt."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: giống tốt cần cả năng suất và chất lượng. b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 4 yêu cầu của giống cây trồng tốt.", "answer": "sinh trưởng tốt, năng suất cao ổn định, chất lượng tốt, chống chịu tốt", "explain": "Bốn yêu cầu: sinh trưởng, phát triển tốt (thích nghi); năng suất cao và ổn định; chất lượng tốt; chống chịu sâu bệnh và điều kiện bất lợi.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao khi chọn giống phải xét đến điều kiện địa phương? (Nêu 1 lí do)", "answer": "vì mỗi giống chỉ phát huy tốt trong điều kiện sinh thái phù hợp", "explain": "Giống có tính thích nghi; giống không phù hợp điều kiện địa phương sẽ sinh trưởng kém, năng suất thấp.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Dấu hiệu nào sau đây cho thấy ruộng lúa dùng giống tốt?", "options": ["A. Cây mọc đều, khỏe, năng suất cao.", "B. Cây mọc lổ đổ, cao thấp không đều.", "C. Nhiều cây bị bệnh.", "D. Năng suất rất thấp."], "answer": "A", "explain": "Giống tốt cho quần thể cây đồng đều, sinh trưởng khỏe, năng suất cao.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hạt giống đạt chất lượng tốt phải như thế nào?", "options": ["A. Chắc, mẩy, đều, sạch, tỉ lệ nảy mầm cao.", "B. Lép nhiều, lẫn tạp.", "C. Ẩm mốc.", "D. Kích thước không đều."], "answer": "A", "explain": "Hạt giống tốt: chắc mẩy, đều, sạch bệnh, nảy mầm khỏe, tỉ lệ nảy mầm cao.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nên mua hạt giống ở đâu để đảm bảo chất lượng?", "options": ["A. Cơ sở sản xuất, kinh doanh giống có uy tín, được cấp phép.", "B. Chợ tự do không rõ nguồn gốc.", "C. Nhặt hạt rơi ngoài đồng.", "D. Nơi nào rẻ nhất."], "answer": "A", "explain": "Mua ở cơ sở uy tín, có kiểm định chất lượng để đảm bảo giống đúng, tốt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không nên dùng hạt lúa tự để nhiều vụ liên tiếp làm giống?", "options": ["A. Vì dễ bị lẫn tạp, thoái hóa giống, năng suất giảm dần.", "B. Vì hạt sẽ to hơn.", "C. Vì không có lí do gì.", "D. Vì tốn công phơi."], "answer": "A", "explain": "Tự để giống nhiều vụ dễ lẫn tạp, thoái hóa, mất tính ổn định di truyền.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một bao hạt giống không có nhãn mác, không rõ nguồn gốc. Rủi ro khi sử dụng là gì?", "options": ["A. Có thể là giống giả, giống kém chất lượng, lẫn tạp, mang mầm bệnh.", "B. Không có rủi ro gì.", "C. Chắc chắn là giống tốt.", "D. Chỉ hơi đắt."], "answer": "A", "explain": "Giống không rõ nguồn gốc dễ là hàng giả, kém chất lượng, gây thiệt hại sản xuất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nông dân mua phải hạt giống giả (đóng bao bì nhái thương hiệu). Hậu quả và bài học rút ra là gì?", "options": ["A. Mất mùa, thiệt hại kinh tế; bài học là chỉ mua giống ở cơ sở uy tín, kiểm tra nhãn mác.", "B. Không có hậu quả gì.", "C. Cây vẫn tốt bình thường.", "D. Bài học là nên mua giống rẻ."], "answer": "A", "explain": "Giống giả gây mất mùa, thiệt hại lớn; phải mua ở nơi uy tín, kiểm tra kĩ nhãn mác, nguồn gốc.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về nhận biết giống tốt:", "statements": ["a) Ruộng dùng giống tốt thường cây mọc đều, khỏe.", "b) Hạt giống tốt phải chắc, mẩy, sạch, nảy mầm tốt.", "c) Nên mua giống ở cơ sở uy tín, có nhãn mác rõ ràng.", "d) Hạt giống ẩm mốc, lẫn tạp vẫn dùng tốt."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: hạt ẩm mốc, lẫn tạp cho tỉ lệ nảy mầm thấp, cây yếu.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về nhận biết giống tốt:", "statements": ["a) Tự để giống nhiều vụ dễ làm thoái hóa giống.", "b) Giống không rõ nguồn gốc tiềm ẩn nhiều rủi ro.", "c) Hạt lép, lửng vẫn nảy mầm tốt như hạt chắc.", "d) Kiểm tra nhãn mác, hạn sử dụng giúp tránh mua phải giống giả."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: hạt lép cho cây yếu, tỉ lệ nảy mầm thấp. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 3 dấu hiệu của hạt giống đạt chất lượng tốt.", "answer": "chắc mẩy, sạch, tỉ lệ nảy mầm cao", "explain": "Hạt giống tốt: chắc, mẩy, đều, sạch (không lẫn tạp, không sâu bệnh), tỉ lệ nảy mầm cao, nảy mầm khỏe.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 1 biện pháp tránh mua phải hạt giống giả, kém chất lượng.", "answer": "mua ở cơ sở uy tín có nhãn mác rõ ràng", "explain": "Mua hạt giống ở cơ sở sản xuất, kinh doanh uy tín, được cấp phép; kiểm tra nhãn mác, nguồn gốc, hạn sử dụng.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Giống lúa nào của Việt Nam từng đạt giải gạo ngon nhất thế giới?", "options": ["A. ST25.", "B. IR64.", "C. Jasmine 85.", "D. Nếp cái hoa vàng."], "answer": "A", "explain": "Gạo ST25 của kĩ sư Hồ Quang Cua đạt giải gạo ngon nhất thế giới năm 2019.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ai là người lai tạo ra giống lúa ST25?", "options": ["A. Kĩ sư Hồ Quang Cua.", "B. Một công ty nước ngoài.", "C. Không rõ tác giả.", "D. Nông dân tự phát."], "answer": "A", "explain": "Giống lúa ST25 do kĩ sư Hồ Quang Cua và cộng sự lai tạo tại Sóc Trăng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giống cây trồng nào sau đây là giống ngô lai phổ biến ở Việt Nam?", "options": ["A. LVN10.", "B. ST25.", "C. Jasmine 85.", "D. Đài thơm 8."], "answer": "A", "explain": "LVN10 là giống ngô lai được trồng phổ biến ở Việt Nam. ST25, Jasmine 85, Đài thơm 8 là giống lúa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thành công của giống lúa ST25 chứng tỏ điều gì về công tác giống ở Việt Nam?", "options": ["A. Việt Nam có khả năng chọn tạo giống lúa chất lượng cao, vươn tầm thế giới.", "B. Việt Nam chỉ trồng được lúa thường.", "C. Không có ý nghĩa gì.", "D. Chỉ là may mắn."], "answer": "A", "explain": "ST25 khẳng định năng lực chọn tạo giống của Việt Nam đạt trình độ quốc tế.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nhiều địa phương khuyến khích nông dân dùng giống lúa mới thay giống cũ?", "options": ["A. Vì giống mới năng suất cao hơn, chất lượng tốt hơn, chống chịu tốt hơn.", "B. Vì giống cũ đã hết.", "C. Vì để tốn tiền mua giống.", "D. Vì không có lí do gì."], "answer": "A", "explain": "Giống mới ưu việt hơn về năng suất, chất lượng, chống chịu nên được khuyến khích.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một tỉnh muốn xây dựng thương hiệu gạo đặc sản. Theo em, khâu giống cần làm gì?", "options": ["A. Chọn giống lúa đặc sản chất lượng cao, phù hợp địa phương và giữ gìn nguồn giống thuần.", "B. Trồng bất kì giống lúa nào.", "C. Nhập gạo về đóng gói.", "D. Không cần quan tâm giống."], "answer": "A", "explain": "Thương hiệu gạo đặc sản bắt đầu từ giống đặc sản chất lượng cao, thuần chủng, phù hợp địa phương.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về giống cây trồng Việt Nam:", "statements": ["a) Lúa ST25 là giống lúa của Việt Nam đạt giải gạo ngon nhất thế giới.", "b) LVN10 là giống ngô lai phổ biến ở Việt Nam.", "c) Việt Nam không chọn tạo được giống cây trồng nào.", "d) Nên dùng giống mới, phù hợp địa phương thay giống cũ thoái hóa."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: Việt Nam chọn tạo được nhiều giống tốt (ST25, LVN10...). d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về giống cây trồng ở Việt Nam:", "statements": ["a) Kĩ sư Hồ Quang Cua là tác giả giống lúa ST25.", "b) Giống đặc sản địa phương cần được giữ gìn nguồn gen.", "c) Chỉ có giống ngoại nhập mới tốt.", "d) Xây dựng thương hiệu nông sản cần bắt đầu từ giống tốt."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: nhiều giống trong nước rất tốt, phù hợp địa phương. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên 2 giống lúa và 1 giống ngô phổ biến ở Việt Nam.", "answer": "ST25, Đài thơm 8, LVN10", "explain": "Giống lúa: ST25, Đài thơm 8, Jasmine 85, IR64... Giống ngô: LVN10... Chấp nhận đáp án tương đương.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giống lúa ST25 nổi tiếng về đặc điểm gì?", "answer": "gạo thơm ngon, đạt giải gạo ngon nhất thế giới", "explain": "ST25 nổi tiếng với gạo thơm ngon, từng đạt giải gạo ngon nhất thế giới năm 2019.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Mối quan hệ giữa giống tốt và kĩ thuật canh tác là gì?", "options": ["A. Giống tốt kết hợp kĩ thuật tốt cho năng suất cao nhất.", "B. Giống tốt không cần kĩ thuật.", "C. Kĩ thuật tốt không cần giống tốt.", "D. Hai yếu tố không liên quan."], "answer": "A", "explain": "Giống tốt là tiền đề; kĩ thuật canh tác tốt giúp khai thác tối đa tiềm năng của giống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nếu chỉ có giống tốt mà chăm sóc kém (thiếu phân, thiếu nước) thì kết quả ra sao?", "options": ["A. Năng suất không cao, giống không phát huy được tiềm năng.", "B. Vẫn cho năng suất tối đa.", "C. Cây chết ngay.", "D. Không ảnh hưởng gì."], "answer": "A", "explain": "Giống tốt cần điều kiện canh tác tốt mới phát huy tiềm năng; chăm sóc kém làm năng suất thấp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nếu chăm sóc rất tốt nhưng dùng giống xấu, thoái hóa thì kết quả ra sao?", "options": ["A. Năng suất vẫn thấp vì tiềm năng di truyền của giống thấp.", "B. Năng suất sẽ rất cao.", "C. Không ảnh hưởng gì.", "D. Cây sẽ biến thành giống tốt."], "answer": "A", "explain": "Tiềm năng năng suất do gen quy định; giống xấu dù chăm tốt cũng không cho năng suất cao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao các mô hình trình diễn giống mới luôn đi kèm hướng dẫn kĩ thuật canh tác?", "options": ["A. Vì giống mới chỉ phát huy tối đa khi canh tác đúng kĩ thuật.", "B. Vì để tốn giấy.", "C. Vì không có lí do gì.", "D. Vì giống mới khó trồng."], "answer": "A", "explain": "Giống và kĩ thuật phải đi đôi; hướng dẫn kĩ thuật giúp nông dân khai thác đúng tiềm năng giống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Câu \"nhất nước, nhì phân, tam cần, tứ giống\" cho thấy mối quan hệ nào?", "options": ["A. Năng suất do nhiều yếu tố quyết định, trong đó giống là một yếu tố quan trọng.", "B. Chỉ cần giống là đủ.", "C. Giống là yếu tố duy nhất.", "D. Nước là yếu tố duy nhất."], "answer": "A", "explain": "Câu tục ngữ xếp hạng các yếu tố: nước, phân, công chăm sóc, giống — đều quan trọng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai nông dân cùng trồng giống lúa mới: người A chăm sóc đúng kĩ thuật, người B bỏ bê. Kết quả người A năng suất gấp rưỡi người B. Bài học rút ra là gì?", "options": ["A. Giống tốt phải đi đôi với kĩ thuật canh tác tốt mới cho hiệu quả cao.", "B. Giống mới không tốt.", "C. Kĩ thuật không quan trọng.", "D. Nên trồng giống cũ."], "answer": "A", "explain": "Cùng giống tốt, kĩ thuật quyết định mức độ phát huy tiềm năng — giống và kĩ thuật phải đi đôi.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về giống và kĩ thuật canh tác:", "statements": ["a) Giống tốt kết hợp kĩ thuật tốt cho năng suất cao nhất.", "b) Giống tốt mà chăm sóc kém thì không phát huy được tiềm năng.", "c) Giống xấu dù chăm sóc tốt cũng khó cho năng suất cao.", "d) Chỉ cần giống tốt là đủ, không cần quan tâm kĩ thuật."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: tiềm năng do gen quy định. d) Sai: phải kết hợp cả hai.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về giống và kĩ thuật canh tác:", "statements": ["a) \"Nhất nước, nhì phân, tam cần, tứ giống\" nêu các yếu tố quyết định năng suất.", "b) Đầu tư kĩ thuật cho giống tốt cho hiệu quả cao.", "c) Giống tốt có thể bù đắp hoàn toàn cho kĩ thuật kém.", "d) Trình diễn giống mới cần kèm hướng dẫn kĩ thuật."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: kĩ thuật kém làm giống không phát huy tiềm năng. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu mối quan hệ giữa giống tốt và kĩ thuật canh tác. (1 câu ngắn)", "answer": "giống tốt phải đi đôi với kĩ thuật canh tác tốt", "explain": "Giống tốt là tiền đề; kĩ thuật canh tác tốt giúp khai thác tối đa tiềm năng của giống; hai yếu tố phải đi đôi.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích câu tục ngữ \"nhất nước, nhì phân, tam cần, tứ giống\". (Ngắn gọn)", "answer": "năng suất do nước, phân bón, công chăm sóc và giống quyết định", "explain": "Câu tục ngữ xếp hạng các yếu tố quyết định năng suất: thứ nhất là nước, thứ hai là phân bón, thứ ba là công chăm sóc (cần cù), thứ tư là giống.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Biến đổi khí hậu gây khó khăn gì cho trồng trọt?", "options": ["A. Hạn hán, ngập lụt, nhiễm mặn, sâu bệnh diễn biến phức tạp.", "B. Thời tiết luôn thuận lợi.", "C. Không gây khó khăn gì.", "D. Chỉ làm tăng năng suất."], "answer": "A", "explain": "Biến đổi khí hậu gây thời tiết cực đoan: hạn, lụt, mặn, rét, sâu bệnh phức tạp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để thích ứng với biến đổi khí hậu, công tác giống cần hướng tới điều gì?", "options": ["A. Tạo giống chống chịu: chịu hạn, chịu mặn, chịu ngập, kháng sâu bệnh.", "B. Chỉ tạo giống năng suất cao.", "C. Không cần làm gì.", "D. Ngừng trồng trọt."], "answer": "A", "explain": "Giống chống chịu là giải pháp căn cơ giúp cây trồng thích ứng với khí hậu cực đoan.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vùng đồng bằng sông Cửu Long bị nhiễm mặn ngày càng sâu, giải pháp về giống là gì?", "options": ["A. Sử dụng giống lúa chịu mặn.", "B. Trồng giống lúa thường.", "C. Không trồng lúa nữa.", "D. Bón nhiều phân."], "answer": "A", "explain": "Giống chịu mặn giúp duy trì sản xuất lúa trên đất nhiễm mặn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao giống ngắn ngày giúp nông dân thích ứng với biến đổi khí hậu?", "options": ["A. Vì rút ngắn thời gian sinh trưởng, tránh được thiên tai cuối vụ, tăng vụ.", "B. Vì cho năng suất thấp.", "C. Vì không cần nước.", "D. Vì không có lí do gì."], "answer": "A", "explain": "Ngắn ngày giúp \"chạy\" thiên tai, chủ động thời vụ và tăng số vụ trong năm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giống kháng sâu bệnh có ý nghĩa gì trong bối cảnh biến đổi khí hậu?", "options": ["A. Vì khí hậu thay đổi làm sâu bệnh diễn biến phức tạp, giống kháng giúp ổn định sản xuất.", "B. Vì sâu bệnh sẽ biến mất.", "C. Không có ý nghĩa gì.", "D. Vì thuốc trừ sâu rẻ hơn."], "answer": "A", "explain": "Biến đổi khí hậu làm sâu bệnh phức tạp hơn; giống kháng giúp giảm thiệt hại, giảm thuốc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một địa phương ven biển vừa bị hạn, vừa bị mặn. Để duy trì trồng lúa, cần giống có đặc tính nào?", "options": ["A. Vừa chịu hạn vừa chịu mặn.", "B. Chỉ cần năng suất cao.", "C. Chỉ cần thơm ngon.", "D. Giống nào cũng được."], "answer": "A", "explain": "Điều kiện khắc nghiệt kép đòi hỏi giống tích hợp nhiều tính chống chịu.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về giống và biến đổi khí hậu:", "statements": ["a) Biến đổi khí hậu gây hạn, lụt, mặn, sâu bệnh phức tạp.", "b) Giống chống chịu giúp cây thích ứng với biến đổi khí hậu.", "c) Vùng nhiễm mặn nên dùng giống chịu mặn.", "d) Biến đổi khí hậu không ảnh hưởng đến trồng trọt."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ảnh hưởng rất lớn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về chọn giống thích ứng biến đổi khí hậu:", "statements": ["a) Giống ngắn ngày giúp tránh thiên tai cuối vụ.", "b) Giống kháng sâu bệnh giúp ổn định sản xuất khi sâu bệnh phức tạp.", "c) Công tác giống cần hướng tới tạo giống chống chịu.", "d) Chỉ cần giống năng suất cao là thích ứng được với mọi biến đổi khí hậu."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cần cả tính chống chịu, không chỉ năng suất.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 3 biểu hiện của biến đổi khí hậu ảnh hưởng đến trồng trọt.", "answer": "hạn hán, ngập lụt, nhiễm mặn", "explain": "Biến đổi khí hậu: hạn hán, ngập lụt, nhiễm mặn, rét đậm, sâu bệnh diễn biến phức tạp...", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 2 đặc tính giống cần có để thích ứng với biến đổi khí hậu.", "answer": "chịu hạn, chịu mặn", "explain": "Giống thích ứng biến đổi khí hậu cần: chịu hạn, chịu mặn, chịu ngập, kháng sâu bệnh, ngắn ngày...", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Khái niệm giống cây trồng bao gồm những yếu tố nào?", "options": ["A. Quần thể cùng loài, di truyền ổn định, thích nghi, năng suất cao, chất lượng tốt.", "B. Chỉ cần hạt to.", "C. Chỉ cần giá rẻ.", "D. Chỉ cần màu đẹp."], "answer": "A", "explain": "Đầy đủ các yếu tố: quần thể cùng loài, di truyền ổn định, thích nghi, năng suất cao, chất lượng tốt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vai trò nào sau đây không phải của giống cây trồng?", "options": ["A. Quyết định giá phân bón trên thị trường.", "B. Quyết định năng suất nông sản.", "C. Quyết định chất lượng nông sản.", "D. Tăng khả năng chống chịu."], "answer": "A", "explain": "Giống không quyết định giá phân bón; các vai trò còn lại đều đúng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Yêu cầu nào sau đây không phải của giống tốt?", "options": ["A. Dễ nhiễm sâu bệnh.", "B. Năng suất cao, ổn định.", "C. Chất lượng tốt.", "D. Chống chịu tốt."], "answer": "A", "explain": "Dễ nhiễm sâu bệnh là nhược điểm, không phải yêu cầu của giống tốt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một nông dân muốn chuyển đổi từ giống lúa cũ sang giống mới. Những việc cần làm đúng là gì?", "options": ["A. Chọn giống phù hợp địa phương, mua ở cơ sở uy tín, canh tác đúng kĩ thuật.", "B. Mua giống trôi nổi giá rẻ.", "C. Trồng thử không cần tìm hiểu.", "D. Chỉ đổi giống, giữ nguyên cách làm cũ."], "answer": "A", "explain": "Đổi giống đúng cách: phù hợp địa phương, nguồn uy tín, kèm kĩ thuật phù hợp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các yếu tố \"nước, phân, cần, giống\", yếu tố nào do con người chủ động chọn tạo được?", "options": ["A. Giống (thông qua chọn, tạo giống).", "B. Nước mưa.", "C. Thời tiết.", "D. Đất đai."], "answer": "A", "explain": "Con người chủ động chọn, tạo ra giống mới bằng các phương pháp khoa học (học ở Bài 12).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một hợp tác xã muốn nâng cao thu nhập cho xã viên trên cùng diện tích đất. Giải pháp tổng hợp về giống là gì?", "options": ["A. Dùng giống mới năng suất, chất lượng cao, phù hợp địa phương, kết hợp thâm canh đúng kĩ thuật.", "B. Tiếp tục dùng giống cũ.", "C. Mở rộng diện tích.", "D. Giảm đầu tư."], "answer": "A", "explain": "Giải pháp tổng hợp: giống mới tốt + phù hợp địa phương + thâm canh đúng kĩ thuật.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định tổng hợp sau về giống cây trồng:", "statements": ["a) Giống cây trồng có đặc tính di truyền ổn định.", "b) Giống quyết định năng suất và chất lượng nông sản.", "c) Giống tốt giúp tăng khả năng chống chịu.", "d) Giống tốt không cần kĩ thuật canh tác tốt."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: giống tốt phải đi đôi với kĩ thuật tốt.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về tổng hợp kiến thức giống cây trồng:", "statements": ["a) Chọn giống phù hợp địa phương giúp cây phát huy tốt nhất.", "b) Nên mua giống ở cơ sở uy tín, có nhãn mác rõ ràng.", "c) Giống chống chịu góp phần thích ứng với biến đổi khí hậu.", "d) Tự để giống nhiều vụ liên tiếp không ảnh hưởng gì đến chất lượng giống."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: dễ lẫn tạp, thoái hóa giống.", "points": 1}, {"type": "short", "level": "VDC", "q": "Hoàn thành câu: \"Giống cây trồng là ... cùng một loài, có đặc tính ... ổn định.\"", "answer": "quần thể cây trồng, di truyền", "explain": "Câu đầy đủ: \"Giống cây trồng là quần thể cây trồng cùng một loài, có đặc tính di truyền ổn định...\"", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 3 vai trò của giống cây trồng mà em thấy quan trọng nhất.", "answer": "quyết định năng suất, quyết định chất lượng, tăng khả năng chống chịu", "explain": "Các vai trò: quyết định năng suất, quyết định chất lượng, tăng khả năng chống chịu, tăng hiệu quả sử dụng đất phân, mở rộng diện tích vụ trồng, thích ứng biến đổi khí hậu.", "points": 0.5}]}]}
