ng bệnh.", "D. Vì không có lí do gì."], "answer": "A", "explain": "Mô đỉnh sinh trưởng thường sạch virus; môi trường vô trùng ngăn lây nhiễm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So với giâm, chiết, ghép, nuôi cấy mô vượt trội ở điểm nào?", "options": ["A. Hệ số nhân rất cao, nhân được số lượng lớn trong thời gian ngắn.", "B. Đơn giản hơn.", "C. Rẻ tiền hơn.", "D. Không cần kĩ thuật."], "answer": "A", "explain": "Nuôi cấy mô khắc phục nhược điểm hệ số nhân thấp của các cách vô tính khác.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hạn chế của nuôi cấy mô là gì?", "options": ["A. Cần phòng thí nghiệm, kĩ thuật cao, chi phí đầu tư lớn.", "B. Cây con không đồng đều.", "C. Cây con nhiều bệnh.", "D. Không nhân được số lượng lớn."], "answer": "A", "explain": "Nuôi cấy mô đòi hỏi cơ sở vật chất và trình độ kĩ thuật cao, chi phí lớn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một trung tâm giống cần cung cấp 100.000 cây chuối giống sạch bệnh, đồng đều trong vài tháng. Phương pháp phù hợp nhất là gì?", "options": ["A. Nuôi cấy mô.", "B. Gieo hạt chuối.", "C. Chiết cành chuối.", "D. Để chuối tự đẻ cây con ngoài đồng."], "answer": "A", "explain": "Chỉ nuôi cấy mô mới đáp ứng số lượng lớn, đồng đều, sạch bệnh trong thời gian ngắn.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về nuôi cấy mô trong nhân giống:", "statements": ["a) Nuôi cấy mô nhân được số lượng lớn cây con đồng đều, sạch bệnh.", "b) Lan, chuối thường được nhân bằng nuôi cấy mô.", "c) Nuôi cấy mô thuộc nhóm nhân giống vô tính.", "d) Nuôi cấy mô đơn giản, không cần phòng thí nghiệm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: cây con từ mô, giống hệt mẹ. d) Sai: cần phòng thí nghiệm vô trùng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về ứng dụng nuôi cấy mô trong nhân giống:", "statements": ["a) Nuôi cấy mô khắc phục được nhược điểm hệ số nhân thấp của giâm, chiết.", "b) Cây nuôi cấy mô giữ nguyên đặc tính của cây mẹ.", "c) Nuôi cấy mô đòi hỏi kĩ thuật và đầu tư cao.", "d) Mọi nông hộ đều dễ dàng áp dụng nuôi cấy mô."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cần cơ sở và kĩ thuật chuyên môn.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 2 ưu điểm của nhân giống bằng nuôi cấy mô.", "answer": "nhân nhanh số lượng lớn, cây sạch bệnh", "explain": "Ưu điểm: nhân nhanh số lượng lớn trong thời gian ngắn; cây con đồng đều, sạch bệnh; bảo tồn giống quý hiếm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 1 hạn chế của nhân giống bằng nuôi cấy mô.", "answer": "cần phòng thí nghiệm và kĩ thuật cao", "explain": "Hạn chế: cần phòng thí nghiệm vô trùng, kĩ thuật cao, chi phí đầu tư lớn.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Ưu điểm lớn nhất của nhân giống vô tính là gì?", "options": ["A. Cây con giữ nguyên đặc tính di truyền tốt của cây mẹ.", "B. Hệ số nhân rất cao.", "C. Hạt dễ bảo quản.", "D. Cây tuổi thọ rất cao."], "answer": "A", "explain": "Vô tính không qua thụ tinh nên không phân li, cây con giống hệt mẹ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đối với cây ăn quả, nhân giống vô tính có lợi thế gì?", "options": ["A. Nhanh cho thu hoạch (2–3 năm) thay vì chờ 5–10 năm như trồng hạt.", "B. Quả to hơn.", "C. Không cần chăm sóc.", "D. Không có lợi thế gì."], "answer": "A", "explain": "Cây chiết, ghép từ cành đã trưởng thành nên nhanh ra hoa, kết quả.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhược điểm chung của nhân giống vô tính (trừ nuôi cấy mô) là gì?", "options": ["A. Hệ số nhân thấp, mỗi cây mẹ chỉ cho số cây con hạn chế.", "B. Cây con không giống mẹ.", "C. Cây lâu ra quả.", "D. Hạt khó bảo quản."], "answer": "A", "explain": "Giâm, chiết, ghép mỗi cây mẹ chỉ cho số lượng cây con giới hạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nhân giống vô tính dễ làm lây lan sâu bệnh?", "options": ["A. Vì lấy cơ quan của cây mẹ; nếu mẹ nhiễm bệnh, cây con cũng nhiễm.", "B. Vì cây con yếu.", "C. Vì không có lí do gì.", "D. Vì đất bị nhiễm bệnh."], "answer": "A", "explain": "Mầm bệnh tồn tại trong cành, mắt ghép sẽ theo sang cây con.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cây ăn quả trồng bằng cành chiết thường có tuổi thọ thấp hơn trồng bằng hạt vì sao?", "options": ["A. Vì bộ rễ chùm nông, kém ăn sâu, cây kém chống chịu.", "B. Vì cây không ra quả.", "C. Vì không có lí do gì.", "D. Vì cây bị bệnh."], "answer": "A", "explain": "Cây chiết có rễ chùm từ cành, ăn nông nên kém vững chắc, tuổi thọ thấp hơn cây rễ cọc từ hạt.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vườn ươm phát hiện cây mẹ bị bệnh virus nhưng vẫn lấy cành để giâm. Hậu quả và bài học là gì?", "options": ["A. Cây con đồng loạt nhiễm bệnh; bài học là chỉ nhân giống từ cây mẹ khỏe, sạch bệnh.", "B. Cây con sẽ khỏe mạnh.", "C. Không có hậu quả gì.", "D. Bệnh sẽ tự khỏi."], "answer": "A", "explain": "Virus theo cành giâm sang cây con; phải chọn cây mẹ sạch bệnh khi nhân vô tính.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về ưu nhược điểm nhân giống vô tính:", "statements": ["a) Cây con giữ nguyên đặc tính tốt của cây mẹ.", "b) Cây ăn quả nhân vô tính nhanh cho thu hoạch.", "c) Hệ số nhân của giâm, chiết, ghép thường thấp.", "d) Nhân giống vô tính không bao giờ lây lan sâu bệnh."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: dễ lây bệnh từ cây mẹ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về chọn cây mẹ nhân giống vô tính:", "statements": ["a) Nên chọn cây mẹ khỏe, sạch bệnh để nhân giống vô tính.", "b) Cây chiết có rễ chùm nông nên kém chống chịu gió bão.", "c) Nuôi cấy mô khắc phục được nhược điểm hệ số nhân thấp.", "d) Cây con vô tính luôn có tuổi thọ cao hơn cây trồng bằng hạt."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: thường tuổi thọ thấp hơn.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 2 ưu điểm và 2 nhược điểm của nhân giống vô tính.", "answer": "ưu điểm: giống hệt mẹ và nhanh ra quả; nhược điểm: hệ số nhân thấp và dễ lây bệnh", "explain": "Ưu điểm: giữ nguyên đặc tính mẹ, nhanh cho thu hoạch. Nhược điểm: hệ số nhân thấp (trừ nuôi cấy mô), dễ lây bệnh, tuổi thọ thấp.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao phải chọn cây mẹ khỏe, sạch bệnh khi nhân giống vô tính? (Nêu 1 lí do)", "answer": "vì sâu bệnh từ cây mẹ lây sang cây con", "explain": "Mầm bệnh tồn tại trong cơ quan nhân giống (cành, mắt ghép) sẽ lây sang cây con, làm cả vườn ươm nhiễm bệnh.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Điểm khác biệt cơ bản nhất giữa nhân giống hữu tính và vô tính là gì?", "options": ["A. Hữu tính cây con dễ phân li; vô tính cây con giống hệt mẹ.", "B. Hữu tính nhanh hơn.", "C. Vô tính rẻ hơn.", "D. Không có điểm khác biệt."], "answer": "A", "explain": "Hữu tính qua thụ tinh nên phân li; vô tính từ cơ quan sinh dưỡng nên giống hệt mẹ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Về hệ số nhân, phương pháp nào cao hơn?", "options": ["A. Nhân giống hữu tính (bằng hạt).", "B. Nhân giống vô tính.", "C. Hai phương pháp như nhau.", "D. Không so sánh được."], "answer": "A", "explain": "Một cây cho hàng nghìn hạt nên hệ số nhân hữu tính cao hơn hẳn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Về thời gian cho thu hoạch ở cây ăn quả, phương pháp nào nhanh hơn?", "options": ["A. Nhân giống vô tính.", "B. Nhân giống hữu tính.", "C. Hai phương pháp như nhau.", "D. Không xác định được."], "answer": "A", "explain": "Cây chiết, ghép 2–3 năm ra quả; trồng hạt 5–10 năm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Muốn nhân nhanh giống lúa mới với diện tích lớn, nên chọn phương pháp nào? Vì sao?", "options": ["A. Nhân bằng hạt, vì hệ số nhân cao, đơn giản, rẻ tiền.", "B. Ghép.", "C. Chiết cành.", "D. Nuôi cấy mô."], "answer": "A", "explain": "Cây ngắn ngày, cần số lượng lớn: gieo hạt là hiệu quả nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Muốn giữ nguyên đặc tính quả ngon của cây bưởi mẹ, nên chọn phương pháp nào? Vì sao?", "options": ["A. Chiết cành hoặc ghép, vì cây con giống hệt mẹ.", "B. Gieo hạt.", "C. Để tự nhiên.", "D. Phương pháp nào cũng được."], "answer": "A", "explain": "Chỉ nhân vô tính mới giữ nguyên đặc tính tốt của cây mẹ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một trang trại cần 10.000 cây cam sành: yêu cầu giống hệt cây mẹ, nhanh ra quả, sạch bệnh. Phương án tối ưu là gì?", "options": ["A. Kết hợp: chọn cây mẹ tốt, sạch bệnh rồi nhân bằng nuôi cấy mô hoặc ghép.", "B. Gieo hạt cam.", "C. Để cam tự mọc.", "D. Mua quả về lấy hạt."], "answer": "A", "explain": "Nuôi cấy mô/ghép từ cây mẹ tốt đáp ứng cả ba yêu cầu: giống mẹ, nhanh, sạch bệnh, số lượng lớn.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau khi so sánh hai nhóm phương pháp:", "statements": ["a) Hữu tính: cây con dễ phân li; vô tính: cây con giống hệt mẹ.", "b) Hữu tính có hệ số nhân cao hơn vô tính.", "c) Cây ăn quả nhân vô tính nhanh cho thu hoạch hơn.", "d) Cây trồng bằng hạt có tuổi thọ cao hơn cây chiết."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: rễ cọc ăn sâu, tuổi thọ cao.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về lựa chọn phương pháp nhân giống:", "statements": ["a) Lúa, ngô nên nhân bằng hạt vì cần số lượng lớn.", "b) Cây ăn quả quý nên nhân vô tính để giữ đặc tính tốt.", "c) Hạt giống dễ bảo quản, vận chuyển hơn cành giâm, cây ghép.", "d) Mọi loại cây đều nên nhân bằng hạt là tốt nhất."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tùy mục đích, cây ăn quả nên nhân vô tính.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 2 điểm khác nhau cơ bản giữa nhân giống hữu tính và vô tính.", "answer": "hữu tính cây con phân li và hệ số nhân cao, vô tính cây con giống mẹ và nhanh ra quả", "explain": "Hữu tính: cây con phân li, hệ số nhân cao, lâu ra quả, tuổi thọ cao. Vô tính: cây con giống hệt mẹ, hệ số nhân thấp, nhanh ra quả, tuổi thọ thấp hơn.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Khi nào nên chọn nhân giống hữu tính, khi nào nên chọn vô tính? (Nêu ngắn gọn)", "answer": "cần số lượng lớn thì hữu tính, cần giữ đặc tính mẹ thì vô tính", "explain": "Cần số lượng lớn, rẻ tiền (lúa, ngô, rau): hữu tính. Cần giữ nguyên đặc tính tốt của mẹ, nhanh ra quả (cây ăn quả, hoa): vô tính.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Thời vụ thích hợp để giâm, chiết cành là khi nào?", "options": ["A. Khi cây sinh trưởng khỏe, thời tiết mát mẻ, đủ ẩm.", "B. Khi cây đang ra hoa rộ.", "C. Khi trời nắng gắt, khô hạn.", "D. Bất cứ lúc nào."], "answer": "A", "explain": "Cây khỏe, trời mát ẩm giúp cành nhanh ra rễ, tỉ lệ sống cao.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vật liệu bọc bầu chiết thường dùng là gì?", "options": ["A. Đất ẩm trộn xơ dừa, rơm rạ hoặc rễ bèo.", "B. Cát khô.", "C. Đá sỏi.", "D. Nilon khô."], "answer": "A", "explain": "Bầu chiết cần giữ ẩm tốt: đất ẩm trộn xơ dừa, rơm rạ, rễ bèo.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sau khi giâm cành, cần chăm sóc như thế nào?", "options": ["A. Giữ ẩm, che nắng, tránh úng nước.", "B. Phơi nắng gắt.", "C. Không tưới nước.", "D. Bón thật nhiều phân."], "answer": "A", "explain": "Cành giâm cần ẩm để ra rễ, che nắng giảm thoát hơi nước, tránh úng gây thối.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao khi chiết cành phải bọc kín bầu đất bằng nilon?", "options": ["A. Để giữ ẩm cho bầu đất, giúp cành nhanh ra rễ.", "B. Để cho đẹp.", "C. Để chống trộm.", "D. Không có tác dụng gì."], "answer": "A", "explain": "Bọc nilon giữ ẩm, ngăn bay hơi, tạo điều kiện ra rễ tốt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dấu hiệu nào cho thấy cành chiết đã ra rễ, có thể cắt đem trồng?", "options": ["A. Rễ trắng mọc xuyên qua bầu đất bọc ngoài.", "B. Lá cành chiết vàng úa.", "C. Bầu đất bị khô.", "D. Cành bị gãy."], "answer": "A", "explain": "Rễ trắng đâm ra ngoài bầu là dấu hiệu cành đã ra rễ đủ để cắt trồng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một học sinh giâm cành hoa hồng nhưng cành bị thối đen sau một tuần. Nguyên nhân có thể và cách khắc phục là gì?", "options": ["A. Đất bị úng nước; cần dùng đất thoát nước tốt, tưới vừa ẩm.", "B. Do cành quá khỏe.", "C. Do che nắng.", "D. Không khắc phục được."], "answer": "A", "explain": "Úng nước gây thối cành giâm; cần giá thể thoát nước tốt, giữ ẩm vừa phải.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về kĩ thuật giâm, chiết:", "statements": ["a) Nên giâm, chiết khi cây sinh trưởng khỏe, trời mát, đủ ẩm.", "b) Bầu chiết cần giữ ẩm tốt bằng đất ẩm trộn xơ dừa.", "c) Cành giâm cần được che nắng trong thời gian đầu.", "d) Đất giâm bị úng nước giúp cành nhanh ra rễ hơn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: úng gây thối cành.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về chăm sóc cành giâm, cành chiết:", "statements": ["a) Bọc nilon quanh bầu chiết giúp giữ ẩm.", "b) Rễ trắng đâm ra ngoài bầu là dấu hiệu cành đã ra rễ.", "c) Nên chiết cành khi cây đang mang nhiều quả non.", "d) Cành giâm bị thối thường do đất úng nước."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cây đang nuôi quả kém sức ra rễ. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 3 điều kiện để giâm, chiết cành đạt tỉ lệ sống cao.", "answer": "cành khỏe, đất đủ ẩm, che nắng", "explain": "Điều kiện: chọn cành bánh tẻ khỏe, không sâu bệnh; giá thể ẩm nhưng thoát nước; che nắng, giữ ẩm; thời tiết mát mẻ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Làm thế nào để biết cành chiết đã ra rễ? (Nêu 1 dấu hiệu)", "answer": "rễ trắng mọc xuyên qua bầu đất", "explain": "Dấu hiệu: rễ trắng đâm xuyên qua bầu đất bọc ngoài; lúc đó có thể cắt cành đem trồng.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Ghép mắt khác ghép cành ở điểm nào?", "options": ["A. Ghép mắt dùng chồi (mắt), ghép cành dùng đoạn cành.", "B. Ghép mắt dùng rễ, ghép cành dùng lá.", "C. Hai cách hoàn toàn giống nhau.", "D. Không có điểm khác."], "answer": "A", "explain": "Ghép mắt: lấy mắt (chồi ngủ) ghép; ghép cành: lấy đoạn cành có nhiều mắt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thời điểm thích hợp để ghép cây là khi nào?", "options": ["A. Khi cây sinh trưởng mạnh, nhựa lưu thông tốt (đầu mùa mưa).", "B. Khi cây đang rụng lá ngủ đông.", "C. Khi trời rét đậm.", "D. Bất cứ lúc nào."], "answer": "A", "explain": "Cây sinh trưởng mạnh, nhựa lưu thông giúp vết ghép nhanh liền sẹo.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dấu hiệu ghép thành công là gì?", "options": ["A. Mắt/cành ghép tươi, nảy chồi sau 2–3 tuần.", "B. Mắt ghép khô đen.", "C. Vết ghép chảy nhựa nhiều.", "D. Gốc ghép chết."], "answer": "A", "explain": "Mắt ghép tươi và nảy chồi chứng tỏ đã tiếp hợp thành công với gốc ghép.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao gốc ghép và cành ghép phải có độ tương thích (thường cùng họ)?", "options": ["A. Vì mô của hai bên phải tiếp hợp được với nhau thì vết ghép mới liền.", "B. Vì để cho đẹp.", "C. Vì không có lí do gì.", "D. Vì để chống sâu bệnh."], "answer": "A", "explain": "Chỉ khi tương thích, mô sẹo hai bên mới liền nhau, mạch dẫn nối thông.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một ưu điểm của ghép mà giâm, chiết không có là gì?", "options": ["A. Tận dụng được bộ rễ khỏe, chống chịu tốt của gốc ghép.", "B. Đơn giản hơn.", "C. Rẻ tiền hơn.", "D. Không cần kĩ thuật."], "answer": "A", "explain": "Ghép kết hợp 2 cây: gốc khỏe + cành tốt; giâm, chiết chỉ dùng một cây mẹ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vườn cam bị bệnh vàng lá gân xanh (do rễ kém), nhưng giống cam rất ngon. Giải pháp nhân giống và cải tạo vườn tốt nhất là gì?", "options": ["A. Ghép mắt cam ngon lên gốc cam sành khỏe, kháng bệnh tốt.", "B. Gieo hạt cam ngon.", "C. Chiết cành cây bệnh.", "D. Bỏ vườn."], "answer": "A", "explain": "Ghép giữ được giống ngon trên gốc khỏe kháng bệnh — giải pháp tối ưu.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về kĩ thuật ghép:", "statements": ["a) Ghép mắt dùng chồi, ghép cành dùng đoạn cành.", "b) Nên ghép khi cây sinh trưởng mạnh.", "c) Mắt ghép nảy chồi sau 2–3 tuần là dấu hiệu thành công.", "d) Gốc ghép và cành ghép không cần tương thích."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: phải tương thích mới liền sẹo được.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về kĩ thuật ghép cây:", "statements": ["a) Ghép tận dụng được gốc khỏe và cành tốt.", "b) Khi ghép cần buộc chặt và che kín vết ghép.", "c) Mắt ghép khô đen là dấu hiệu ghép thành công.", "d) Ghép thuộc nhóm nhân giống vô tính."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: giúp liền sẹo, tránh khô và nhiễm bệnh. c) Sai: khô đen là ghép hỏng. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Phân biệt ghép mắt và ghép cành. (Ngắn gọn)", "answer": "ghép mắt dùng chồi, ghép cành dùng đoạn cành", "explain": "Ghép mắt: lấy mắt (chồi ngủ) của giống tốt ghép lên gốc ghép. Ghép cành: lấy đoạn cành có nhiều mắt ghép lên gốc ghép.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 2 yêu cầu kĩ thuật để ghép thành công.", "answer": "gốc và cành tương thích, buộc chặt vết ghép", "explain": "Yêu cầu: gốc ghép và cành ghép tương thích; ghép khi cây sinh trưởng mạnh; vết ghép tiếp xúc tốt, buộc chặt, che kín.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Có mấy nhóm phương pháp nhân giống cây trồng chính?", "options": ["A. 2 nhóm: hữu tính (bằng hạt) và vô tính.", "B. 1 nhóm duy nhất.", "C. 4 nhóm.", "D. 5 nhóm."], "answer": "A", "explain": "Hai nhóm: nhân giống hữu tính (bằng hạt) và nhân giống vô tính (giâm, chiết, ghép, nuôi cấy mô).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Các phương pháp nào thuộc nhóm nhân giống vô tính?", "options": ["A. Giâm cành, chiết cành, ghép, nuôi cấy mô.", "B. Gieo hạt.", "C. Lai hữu tính.", "D. Gây đột biến."], "answer": "A", "explain": "Vô tính gồm: giâm cành, chiết cành, ghép, nuôi cấy mô.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ưu điểm chung lớn nhất của nhân giống vô tính là gì?", "options": ["A. Cây con giống hệt cây mẹ.", "B. Hệ số nhân rất cao.", "C. Hạt dễ bảo quản.", "D. Chi phí thấp nhất."], "answer": "A", "explain": "Cây con từ cơ quan sinh dưỡng nên giữ nguyên đặc tính di truyền của mẹ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một nông dân muốn trồng 1 ha lúa và 100 cây bưởi da xanh ngon. Phương án nhân giống đúng là gì?", "options": ["A. Lúa gieo bằng hạt; bưởi chiết cành hoặc ghép từ cây mẹ ngon.", "B. Cả hai đều gieo hạt.", "C. Cả hai đều chiết cành.", "D. Để tự nhiên."], "answer": "A", "explain": "Lúa cần số lượng lớn, rẻ: gieo hạt. Bưởi cần giữ đặc tính ngon: chiết/ghép.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các việc làm sau, việc nào sai với kiến thức nhân giống?", "options": ["A. Lấy cành của cây mẹ bị bệnh virus để giâm.", "B. Chọn cành bánh tẻ khỏe để giâm.", "C. Chiết cành cam từ cây mẹ tốt.", "D. Ghép mắt cam ngon lên gốc khỏe."], "answer": "A", "explain": "Cây mẹ bệnh sẽ lây bệnh sang cây con; phải chọn cây mẹ khỏe, sạch bệnh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một hợp tác xã hoa lan muốn vừa giữ được màu hoa đẹp của giống mẹ, vừa có số lượng lớn để xuất khẩu. Giải pháp tốt nhất là gì?", "options": ["A. Nhân bằng nuôi cấy mô từ cây mẹ có màu hoa đẹp.", "B. Gieo hạt lan.", "C. Để lan tự nhân.", "D. Nhập hoa về bán."], "answer": "A", "explain": "Nuôi cấy mô vừa giữ nguyên đặc tính mẹ (màu hoa đẹp) vừa cho số lượng lớn, đồng đều, sạch bệnh.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định tổng hợp sau về nhân giống cây trồng:", "statements": ["a) Nhân giống gồm hai nhóm: hữu tính và vô tính.", "b) Giâm, chiết, ghép, nuôi cấy mô thuộc nhóm vô tính.", "c) Cây con vô tính giống hệt cây mẹ.", "d) Nhân bằng hạt luôn giữ nguyên đặc tính cây mẹ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: gieo hạt dễ phân li tính trạng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về tổng hợp nhân giống cây trồng:", "statements": ["a) Lúa, ngô nên nhân bằng hạt; cây ăn quả quý nên nhân vô tính.", "b) Muốn nhanh ra quả nên chọn nhân giống vô tính.", "c) Nhân vô tính từ cây mẹ bệnh sẽ lây bệnh sang cây con.", "d) Nuôi cấy mô vừa cho số lượng lớn vừa giữ nguyên đặc tính mẹ."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: cả 4 đều đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Hoàn thành sơ đồ: Nhân giống cây trồng gồm ... (bằng hạt) và ... (giâm, chiết, ghép, nuôi cấy mô).", "answer": "hữu tính, vô tính", "explain": "Nhân giống cây trồng gồm nhân giống hữu tính (bằng hạt) và nhân giống vô tính (giâm cành, chiết cành, ghép, nuôi cấy mô).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 1 tình huống nên dùng nhân giống hữu tính và 1 tình huống nên dùng vô tính.", "answer": "trồng lúa dùng hạt, nhân bưởi ngon dùng chiết cành", "explain": "Hữu tính: trồng lúa, ngô diện tích lớn (cần số lượng lớn, rẻ). Vô tính: nhân bưởi da xanh ngon, hoa lan quý (cần giữ nguyên đặc tính mẹ).", "points": 0.5}]}]}
