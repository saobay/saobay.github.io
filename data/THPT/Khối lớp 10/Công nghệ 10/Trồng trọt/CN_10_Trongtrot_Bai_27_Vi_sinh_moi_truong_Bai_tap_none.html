{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Công nghệ vi sinh trong trồng trọt được hiểu là gì?", "answer": "A", "explain": "Công nghệ vi sinh ứng dụng vi sinh vật (vi khuẩn, nấm...) và chế phẩm sinh học vào sản xuất, xử lí chất thải, BVMT.", "points": 0.25, "options": ["A. Ứng dụng vi sinh vật và chế phẩm sinh học vào sản xuất và xử lí chất thải.", "B. Dùng kính hiển vi để ngắm vi sinh vật cho vui.", "C. Nuôi vi sinh vật để làm cảnh.", "D. Diệt hết mọi vi sinh vật trong đất."]}, {"type": "mcq", "level": "NB", "q": "Vai trò nào sau đây của công nghệ vi sinh đối với môi trường?", "answer": "A", "explain": "Vi sinh vật phân hủy phụ phẩm thành phân hữu cơ, xử lí chất thải thành biogas, chế phẩm sinh học thay thế hóa chất — góp phần BVMT.", "points": 0.25, "options": ["A. Phân hủy phụ phẩm thành phân bón, xử lí chất thải chăn nuôi, thay thế một phần hóa chất.", "B. Làm tăng ô nhiễm môi trường.", "C. Không có vai trò gì.", "D. Chỉ dùng trong y tế."]}, {"type": "mcq", "level": "TH", "q": "Phân compost là gì?", "answer": "A", "explain": "Compost là phân hữu cơ từ phân hủy hiếu khí (có ôxy) rơm rạ, phụ phẩm, phân chuồng nhờ vi sinh vật.", "points": 0.25, "options": ["A. Phân hữu cơ tạo ra từ quá trình phân hủy hiếu khí phụ phẩm, phân chuồng nhờ vi sinh vật.", "B. Phân hóa học tổng hợp trong nhà máy.", "C. Đất sét nung.", "D. Thuốc trừ sâu sinh học."]}, {"type": "mcq", "level": "TH", "q": "Nguyên liệu nào sau đây dùng để ủ phân compost?", "answer": "A", "explain": "Nguyên liệu ủ compost là chất hữu cơ: rơm rạ, thân cây, vỏ lạc, bã mía, phân chuồng + chế phẩm vi sinh.", "points": 0.25, "options": ["A. Rơm rạ, thân cây ngô, vỏ lạc, bã mía, phân chuồng kết hợp chế phẩm vi sinh.", "B. Nilon, chai nhựa.", "C. Pin, ắc quy cũ.", "D. Thủy tinh vỡ."]}, {"type": "mcq", "level": "VD", "q": "Gia đình bác Năm sau thu hoạch lúa thường đốt rơm rạ. Theo bài học, nên khuyên bác làm gì?", "answer": "A", "explain": "Thay vì đốt: ủ rơm rạ thành phân compost — vừa sạch đồng, vừa có phân bón tốt, tiết kiệm chi phí.", "points": 0.25, "options": ["A. Thu gom rơm rạ trộn phân chuồng và chế phẩm vi sinh để ủ compost bón cho vụ sau.", "B. Tiếp tục đốt vì nhanh.", "C. Vứt rơm rạ xuống sông.", "D. Bỏ hoang ruộng."]}, {"type": "mcq", "level": "VDC", "q": "So sánh đốt rơm rạ và ủ rơm rạ làm compost: nhận định nào đúng?", "answer": "A", "explain": "Ủ compost: tận dụng hữu cơ, cải tạo đất, không phát thải; đốt: khói bụi, CO2, chết vi sinh vật, lãng phí — ủ compost vượt trội.", "points": 0.25, "options": ["A. Ủ compost tận dụng được hữu cơ, cải tạo đất, không gây ô nhiễm; đốt gây khói bụi, lãng phí hữu cơ.", "B. Đốt tốt hơn ủ vì nhanh.", "C. Hai cách như nhau.", "D. Ủ compost gây ô nhiễm hơn đốt."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về công nghệ vi sinh:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: công nghệ vi sinh góp phần BVMT.", "points": 1, "statements": ["a) Công nghệ vi sinh ứng dụng vi sinh vật và chế phẩm sinh học vào sản xuất, xử lí chất thải.", "b) Vi sinh vật giúp phân hủy phụ phẩm thành phân bón hữu cơ.", "c) Chế phẩm sinh học có thể thay thế một phần phân bón, thuốc hóa học.", "d) Công nghệ vi sinh làm tăng ô nhiễm môi trường."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về ủ compost:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: compost là phân hủy HIẾU KHÍ, cần ôxy.", "points": 1, "statements": ["a) Compost là phân hữu cơ từ phân hủy hiếu khí phụ phẩm nhờ vi sinh vật.", "b) Nguyên liệu ủ gồm rơm rạ, phân chuồng và chế phẩm vi sinh.", "c) Khi ủ cần đảo trộn định kì để thoáng khí.", "d) Ủ compost là quá trình phân hủy kị khí, không cần ôxy."]}, {"type": "short", "level": "NB", "q": "Phân compost là gì?", "answer": "phân hữu cơ từ phân hủy hiếu khí phụ phẩm nhờ vi sinh vật", "explain": "Compost là phân hữu cơ tạo ra từ quá trình phân hủy hiếu khí (có ôxy) rơm rạ, phụ phẩm, phân chuồng nhờ vi sinh vật.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Kể tên một nguyên liệu để ủ phân compost.", "answer": "rơm rạ", "explain": "Các nguyên liệu: rơm rạ, thân cây ngô, vỏ lạc, bã mía, phân chuồng + chế phẩm vi sinh (nêu một là được).", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Vì sao khi ủ compost phải đảo trộn đống ủ định kì?", "answer": "A", "explain": "Vi sinh vật hiếu khí cần ôxy; đảo trộn định kì cung cấp ôxy, giúp phân hủy nhanh, đều, tránh thối yếm khí.", "points": 0.25, "options": ["A. Vì quá trình phân hủy hiếu khí cần ôxy; đảo trộn giúp thoáng khí cho vi sinh vật hoạt động.", "B. Vì đảo trộn làm đống ủ đẹp hơn.", "C. Vì không đảo thì đống ủ bị mất.", "D. Vì đảo trộn để đuổi chuột."]}, {"type": "mcq", "level": "NB", "q": "Dấu hiệu nào cho thấy đống ủ compost đã hoai mục, dùng được?", "answer": "A", "explain": "Compost đạt: tơi xốp, màu nâu đen, mùi đất, không hôi — sau khoảng 30–45 ngày ủ đúng kĩ thuật.", "points": 0.25, "options": ["A. Tơi xốp, màu nâu đen, không còn mùi hôi.", "B. Còn nguyên hình dạng rơm rạ, mùi hôi nồng.", "C. Ướt sũng, chảy nước đen.", "D. Nóng bỏng tay."]}, {"type": "mcq", "level": "TH", "q": "Chế phẩm Trichoderma khi ủ compost có tác dụng gì?", "answer": "A", "explain": "Trichoderma là nấm đối kháng: phân hủy nhanh chất xơ, rút ngắn thời gian ủ, đồng thời ức chế nấm bệnh trong đống ủ.", "points": 0.25, "options": ["A. Rút ngắn thời gian ủ, phân hủy nhanh xenlulozo, hạn chế nấm bệnh.", "B. Làm đống ủ nóng hơn để nấu chín.", "C. Diệt hết vi sinh vật có lợi.", "D. Không có tác dụng."]}, {"type": "mcq", "level": "TH", "q": "Độ ẩm đống ủ compost cần duy trì khoảng bao nhiêu?", "answer": "A", "explain": "Ẩm độ 50–60% là tối ưu cho vi sinh vật hiếu khí; quá khô vi sinh ngừng hoạt động, quá ướt gây yếm khí, thối.", "points": 0.25, "options": ["A. Khoảng 50–60% (nắm chặt thấy rịn nước, không chảy thành dòng).", "B. Càng khô càng tốt.", "C. Ngập nước hoàn toàn.", "D. Không cần quan tâm độ ẩm."]}, {"type": "mcq", "level": "VD", "q": "Đống ủ compost của anh Hai bị hôi thối, nhão nhoét. Nguyên nhân và cách khắc phục là gì?", "answer": "A", "explain": "Hôi thối + nhão = thừa nước, thiếu ôxy → yếm khí. Khắc phục: đảo trộn thoáng khí, thêm rơm khô, trấu, che mưa.", "points": 0.25, "options": ["A. Do quá ướt, thiếu ôxy gây phân hủy yếm khí; cần đảo trộn, bổ sung nguyên liệu khô, che mưa.", "B. Do thiếu nước, cần tưới thêm thật nhiều.", "C. Hiện tượng bình thường, không cần làm gì.", "D. Do ủ chưa đủ lâu, cần chờ thêm 1 năm."]}, {"type": "mcq", "level": "VDC", "q": "Một hộ có 2 tấn rơm rạ sau thu hoạch. Ước tính có thể ủ được bao nhiêu phân compost?", "answer": "A", "explain": "Quá trình phân hủy làm mất nước và CO2 nên khối lượng giảm còn khoảng 40–50%; 2 tấn rơm cho khoảng 0,8–1 tấn compost.", "points": 0.25, "options": ["A. Khoảng 0,8–1 tấn (tỉ lệ thu hồi khoảng 40–50% do mất nước và CO2 trong phân hủy).", "B. Được đúng 2 tấn.", "C. Được 5 tấn.", "D. Không thu được gì."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần ẩm độ 50–60% cho vi sinh vật hoạt động.", "points": 1, "statements": ["a) Compost đạt khi tơi xốp, màu nâu đen, không còn mùi hôi.", "b) Thời gian ủ compost khoảng 30–45 ngày.", "c) Trichoderma giúp rút ngắn thời gian ủ, hạn chế nấm bệnh.", "d) Đống ủ càng khô càng tốt, không cần tưới ẩm."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về biogas:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phải kín để giữ điều kiện kị khí và thu khí.", "points": 1, "statements": ["a) Biogas sinh ra do vi sinh vật phân hủy kị khí chất hữu cơ.", "b) Khí biogas chủ yếu là methane, dùng để đun nấu.", "c) Bã thải biogas dùng làm phân bón được.", "d) Hầm biogas không cần xây kín."]}, {"type": "short", "level": "NB", "q": "Khí biogas sinh ra theo nguyên lí nào?", "answer": "vi sinh vật phân hủy kị khí chất hữu cơ", "explain": "Trong điều kiện kị khí (không ôxy), vi sinh vật phân hủy chất hữu cơ sinh ra khí biogas (chủ yếu methane).", "points": 0.5}, {"type": "short", "level": "NB", "q": "Khí biogas dùng để làm gì? (nêu một)", "answer": "đun nấu", "explain": "Biogas dùng để đun nấu, thắp sáng, chạy máy phát điện (nêu một là được).", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên lí của công nghệ biogas là gì?", "answer": "A", "explain": "Biogas: trong điều kiện kị khí (không ôxy), vi sinh vật phân hủy chất hữu cơ sinh khí methane dùng đun nấu, phát điện.", "points": 0.25, "options": ["A. Vi sinh vật phân hủy kị khí chất hữu cơ sinh ra khí biogas (chủ yếu là methane).", "B. Đốt phân chuồng để lấy khí.", "C. Phơi nắng phân chuồng để sinh khí.", "D. Hòa tan phân chuồng trong nước để uống."]}, {"type": "mcq", "level": "NB", "q": "Hầm biogas gồm những bộ phận chính nào?", "answer": "A", "explain": "Hầm biogas kín gồm: ngăn nạp phân, buồng phân hủy kị khí sinh khí, ngăn thu khí dẫn lên bếp, ngăn xả bã.", "points": 0.25, "options": ["A. Ngăn nạp nguyên liệu, buồng phân hủy kị khí, ngăn lấy khí, ngăn xả bã thải.", "B. Chỉ gồm một bể nước.", "C. Gồm lò đốt và ống khói.", "D. Gồm máy bơm và vòi phun."]}, {"type": "mcq", "level": "TH", "q": "Khí biogas dùng để làm gì?", "answer": "A", "explain": "Biogas (giàu methane) cháy được: đun nấu thay gas, thắp sáng, chạy máy phát điện — năng lượng sạch từ chất thải.", "points": 0.25, "options": ["A. Đun nấu, thắp sáng, chạy máy phát điện.", "B. Bơm xe đạp.", "C. Thổi bóng bay.", "D. Không dùng được vào việc gì."]}, {"type": "mcq", "level": "TH", "q": "Bã thải sau hầm biogas có thể dùng để làm gì?", "answer": "A", "explain": "Bã biogas đã phân hủy, ít mầm bệnh, giàu dinh dưỡng — dùng bón cây, nuôi cá rất tốt.", "points": 0.25, "options": ["A. Làm phân bón cho cây trồng, thức ăn cho cá vì đã hoai mục, ít mầm bệnh.", "B. Đổ bỏ ra sông.", "C. Không dùng được.", "D. Đem đốt."]}, {"type": "mcq", "level": "VD", "q": "Gia đình nuôi 10 con lợn bị phản ánh về mùi hôi và ô nhiễm. Giải pháp nào phù hợp với bài học?", "answer": "A", "explain": "Hầm biogas xử lí triệt để: giảm mùi, hết ô nhiễm, tạo khí đốt tiết kiệm, bã làm phân — giải pháp căn cơ.", "points": 0.25, "options": ["A. Xây hầm biogas xử lí phân, nước thải: hết mùi, có gas đun nấu, bã làm phân bón.", "B. Xả thải ra xa khu dân cư hơn.", "C. Bán hết lợn.", "D. Phun nước hoa át mùi."]}, {"type": "mcq", "level": "VDC", "q": "So sánh hầm biogas xây bằng gạch và bằng composite: nhận định nào đúng?", "answer": "A", "explain": "Composite: nhẹ, kín, lắp nhanh, cơ động; hầm gạch: bền vững, rẻ vật liệu nhưng cần thợ xây kĩ thuật kín khí.", "points": 0.25, "options": ["A. Hầm composite lắp đặt nhanh, kín tốt, di chuyển được; hầm gạch bền, chi phí vật liệu rẻ hơn nhưng thi công lâu.", "B. Hai loại hoàn toàn giống nhau.", "C. Hầm gạch không sinh được khí.", "D. Hầm composite không dùng được."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "T"], "explain": "Tất cả đều đúng theo nội dung bài học.", "points": 1, "statements": ["a) Ủ compost tạo phân bón; biogas tạo khí đốt và phân bón.", "b) Nilon, pin cũ không dùng để ủ compost được.", "c) Rơm rạ có thể trồng nấm, ủ chua làm thức ăn gia súc.", "d) Đệm lót sinh học giúp khử mùi chuồng trại."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về kinh tế tuần hoàn:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chất thải được tận dụng, không đổ bỏ.", "points": 1, "statements": ["a) Chất thải khâu này là nguyên liệu khâu khác.", "b) Mô hình VAC + biogas là ví dụ về kinh tế tuần hoàn.", "c) Kinh tế tuần hoàn giúp giảm ô nhiễm, tiết kiệm chi phí.", "d) Trong kinh tế tuần hoàn, mọi chất thải đều đổ bỏ."]}, {"type": "short", "level": "TH", "q": "Vì sao ủ compost phải đảo trộn định kì?", "answer": "để cung cấp ôxy cho vi sinh vật hiếu khí", "explain": "Vi sinh vật hiếu khí cần ôxy; đảo trộn giúp thoáng khí, phân hủy nhanh, đều, tránh thối yếm khí.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nêu dấu hiệu đống ủ compost đã hoai mục.", "answer": "tơi xốp, màu nâu đen, không mùi hôi", "explain": "Compost đạt: tơi xốp, màu nâu đen, mùi đất, không hôi — sau khoảng 30–45 ngày.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Điểm khác nhau cơ bản giữa ủ compost và hầm biogas là gì?", "answer": "A", "explain": "Khác biệt cốt lõi: điều kiện ôxy (hiếu khí/kị khí) và sản phẩm chính (phân bón/khí đốt + phân bón).", "points": 0.25, "options": ["A. Compost phân hủy hiếu khí (cần ôxy) tạo phân bón; biogas phân hủy kị khí (kín, không ôxy) tạo khí đốt + phân bón.", "B. Hai công nghệ hoàn toàn giống nhau.", "C. Compost tạo ra khí đốt.", "D. Biogas không tạo ra phân bón."]}, {"type": "mcq", "level": "NB", "q": "Trong các nguyên liệu sau, nguyên liệu nào KHÔNG phù hợp để ủ compost?", "answer": "A", "explain": "Compost chỉ dùng chất hữu cơ phân hủy được; nilon, nhựa, pin không phân hủy, pin còn gây ô nhiễm kim loại nặng.", "points": 0.25, "options": ["A. Nilon, chai nhựa, pin cũ.", "B. Rơm rạ, thân cây ngô.", "C. Phân chuồng hoai.", "D. Vỏ lạc, bã mía."]}, {"type": "mcq", "level": "TH", "q": "Vì sao hầm biogas phải được xây kín?", "answer": "A", "explain": "Kín để duy trì điều kiện kị khí cho vi sinh vật và thu giữ khí methane; hở sẽ lọt ôxy, mất khí, giảm hiệu quả.", "points": 0.25, "options": ["A. Vì vi sinh vật phân hủy kị khí chỉ hoạt động khi không có ôxy; kín còn để thu giữ khí methane.", "B. Vì sợ trộm.", "C. Vì kín cho đẹp.", "D. Không cần kín cũng được."]}, {"type": "mcq", "level": "TH", "q": "Một hầm biogas bị rò rỉ khí. Nguy cơ nào có thể xảy ra?", "answer": "A", "explain": "Methane dễ cháy nổ, là khí nhà kính mạnh; rò rỉ vừa mất gas, vừa nguy hiểm, vừa gây ô nhiễm — cần kiểm tra, sửa kín.", "points": 0.25, "options": ["A. Lãng phí khí đốt, giảm hiệu quả xử lí và methane rò rỉ gây nguy cơ cháy nổ, phát thải khí nhà kính.", "B. Không có nguy cơ gì.", "C. Khí rò rỉ tốt cho cây trồng.", "D. Rò rỉ giúp hầm sạch hơn."]}, {"type": "mcq", "level": "VD", "q": "Hộ chăn nuôi nên nạp nguyên liệu cho hầm biogas như thế nào?", "answer": "A", "explain": "Nạp đều đặn, đúng tỉ lệ để vi sinh vật hoạt động ổn định; tránh chất khó phân hủy, hóa chất diệt vi sinh.", "points": 0.25, "options": ["A. Nạp phân chuồng đều đặn hằng ngày, đúng tỉ lệ phân:nước, không nạp chất khó phân hủy.", "B. Nạp một lần rồi thôi.", "C. Nạp nilon, rác thải nhựa vào hầm.", "D. Không cần nạp gì."]}, {"type": "mcq", "level": "VDC", "q": "Đánh giá hiệu quả: Hộ nuôi 8 con lợn xây hầm biogas 10 m3. Lợi ích thu được là gì?", "answer": "A", "explain": "Hầm biogas 10 m3 cho 8 lợn đủ gas nấu ăn, xử lí triệt để ô nhiễm, bã làm phân — tiết kiệm chi phí, hoàn vốn vài năm.", "points": 0.25, "options": ["A. Đủ gas đun nấu hằng ngày, hết mùi hôi, có bã làm phân bón — hoàn vốn sau vài năm nhờ tiết kiệm gas, phân bón.", "B. Không có lợi ích gì.", "C. Chỉ tốn tiền xây.", "D. Làm tăng ô nhiễm."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: hôi thối do yếm khí, cần khắc phục.", "points": 1, "statements": ["a) Đống ủ compost hôi thối, nhão nhoét do quá ướt, thiếu ôxy.", "b) Khắc phục bằng cách đảo trộn, bổ sung nguyên liệu khô, che mưa.", "c) Đống ủ hôi thối là hiện tượng bình thường, không cần xử lí.", "d) Che phủ bạt giúp giữ ẩm, giữ nhiệt cho đống ủ."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nhựa không phân hủy được.", "points": 1, "statements": ["a) Nạp phân cho hầm biogas cần đều đặn, đúng tỉ lệ phân:nước.", "b) Không nên nạp nilon, hóa chất diệt vi sinh vào hầm biogas.", "c) Hầm biogas rò rỉ gây lãng phí khí và nguy cơ cháy nổ.", "d) Có thể nạp rác thải nhựa vào hầm biogas."]}, {"type": "short", "level": "TH", "q": "Phân biệt ủ compost và hầm biogas về điều kiện phân hủy.", "answer": "compost hiếu khí, biogas kị khí", "explain": "Compost: phân hủy hiếu khí (cần ôxy, đảo trộn) tạo phân bón; biogas: phân hủy kị khí (kín) tạo khí đốt + phân bón.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Vì sao hầm biogas phải xây kín?", "answer": "để giữ điều kiện kị khí và thu giữ khí methane", "explain": "Kín để vi sinh vật kị khí hoạt động và thu giữ khí methane; hở sẽ lọt ôxy, mất khí, giảm hiệu quả.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Ngoài ủ compost, rơm rạ còn có thể tận dụng để làm gì?", "answer": "A", "explain": "Rơm rạ đa dụng: trồng nấm (thu nhập cao), ủ chua nuôi trâu bò, đệm lót sinh học chuồng trại, cày vùi cải tạo đất.", "points": 0.25, "options": ["A. Trồng nấm rơm, nấm sò; ủ chua làm thức ăn gia súc; đệm lót sinh học; cày vùi trả lại ruộng.", "B. Chỉ có thể đốt bỏ.", "C. Không tận dụng được.", "D. Đem đổ xuống sông."]}, {"type": "mcq", "level": "NB", "q": "Trồng nấm rơm từ rơm rạ có ưu điểm gì?", "answer": "A", "explain": "Nấm rơm: nguyên liệu rẻ (rơm rạ), thời gian ngắn, giá trị kinh tế cao; bã sau trồng nấm làm phân bón rất tốt.", "points": 0.25, "options": ["A. Tận dụng phụ phẩm bỏ đi, cho thu nhập cao, bã nấm còn làm phân bón.", "B. Không cần vốn gì.", "C. Nấm tự mọc không cần chăm sóc.", "D. Không có ưu điểm."]}, {"type": "mcq", "level": "TH", "q": "Đệm lót sinh học trong chăn nuôi là gì?", "answer": "A", "explain": "Đệm lót sinh học: chất độn hữu cơ + vi sinh vật phân hủy phân, khử mùi, hút ẩm; hết vụ thành phân bón — sạch chuồng, ít bệnh.", "points": 0.25, "options": ["A. Lớp rơm rạ, trấu trộn chế phẩm vi sinh lót chuồng, hút ẩm, khử mùi; sau đó thành phân bón.", "B. Nệm cho lợn nằm ngủ.", "C. Tấm nilon lót chuồng.", "D. Xi măng lót chuồng."]}, {"type": "mcq", "level": "TH", "q": "Ủ chua rơm rạ làm thức ăn gia súc dựa trên nguyên lí nào?", "answer": "A", "explain": "Ủ chua: nén kín yếm khí, vi sinh vật lên men làm mềm chất xơ, tăng đạm (khi ủ với urê), dự trữ thức ăn mùa khô cho trâu bò.", "points": 0.25, "options": ["A. Vi sinh vật lên men yếm khí làm mềm rơm, tăng dinh dưỡng, bảo quản được lâu.", "B. Phơi nắng cho giòn.", "C. Đốt thành than.", "D. Ngâm nước lã."]}, {"type": "mcq", "level": "VD", "q": "Trang trại có nhiều rơm rạ sau thu hoạch và đang nuôi bò. Phương án tận dụng tốt nhất là gì?", "answer": "A", "explain": "Tận dụng tổng hợp: ủ chua nuôi bò, compost bón cây, trồng nấm tăng thu nhập — đúng tinh thần kinh tế tuần hoàn.", "points": 0.25, "options": ["A. Một phần ủ chua làm thức ăn bò, một phần ủ compost, một phần trồng nấm — đa dạng hóa thu nhập.", "B. Đốt hết cho nhanh.", "C. Bỏ đống ngoài đồng.", "D. Bán rẻ cho người đốt."]}, {"type": "mcq", "level": "VDC", "q": "So sánh giá trị: 1 tấn rơm đem đốt so với 1 tấn rơm trồng nấm rơm. Nhận định nào đúng?", "answer": "A", "explain": "Trồng nấm: 1 tấn rơm cho hàng trăm kg nấm giá trị cao + bã làm phân; đốt chỉ được ít tro và gây ô nhiễm — chênh lệch lớn.", "points": 0.25, "options": ["A. Đốt thu được tro ít giá trị và gây ô nhiễm; trồng nấm cho thu nhập cao gấp nhiều lần, bã còn làm phân.", "B. Đốt có giá trị hơn.", "C. Hai cách như nhau.", "D. Trồng nấm lỗ vốn."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: rơm rạ đa dụng.", "points": 1, "statements": ["a) Ủ chua rơm rạ dựa trên lên men yếm khí, làm mềm chất xơ, dự trữ thức ăn mùa khô.", "b) Trồng nấm rơm tận dụng rơm rạ cho thu nhập cao, bã nấm làm phân bón.", "c) 1 tấn rơm trồng nấm cho thu nhập cao hơn nhiều so với đốt bỏ.", "d) Rơm rạ chỉ có thể đốt bỏ, không tận dụng được."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về xử lí nước thải:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: gây ô nhiễm, cá chết.", "points": 1, "statements": ["a) Nước thải chăn nuôi phải qua bể lắng, lọc sinh học trước khi thải.", "b) Chế phẩm vi sinh giúp phân hủy chất hữu cơ, khử mùi nước thải.", "c) Nước sau xử lí đạt chuẩn có thể tái dùng để tưới cây.", "d) Có thể xả nước thải chăn nuôi trực tiếp xuống ao cá."]}, {"type": "short", "level": "VD", "q": "Đống ủ compost bị hôi thối, nhão nhoét. Nêu nguyên nhân và cách khắc phục.", "answer": "do quá ướt thiếu ôxy; đảo trộn, thêm nguyên liệu khô", "explain": "Nguyên nhân: thừa nước, thiếu ôxy gây yếm khí. Khắc phục: đảo trộn thoáng khí, bổ sung rơm khô, trấu, che mưa.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu hai cách tận dụng rơm rạ ngoài ủ compost.", "answer": "trồng nấm; ủ chua làm thức ăn gia súc", "explain": "Các cách: trồng nấm rơm/nấm sò, ủ chua thức ăn gia súc, đệm lót sinh học, cày vùi (nêu hai là được).", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Nước thải chăn nuôi, chế biến nông sản cần xử lí như thế nào trước khi thải ra môi trường?", "answer": "A", "explain": "Nước thải phải qua lắng, lọc sinh học + chế phẩm vi sinh để giảm ô nhiễm, đạt chuẩn mới được thải hoặc tái dùng tưới cây.", "points": 0.25, "options": ["A. Qua bể lắng, bể lọc sinh học; dùng chế phẩm vi sinh phân hủy chất hữu cơ, khử mùi.", "B. Xả trực tiếp ra sông.", "C. Đổ ra đường.", "D. Không cần xử lí."]}, {"type": "mcq", "level": "NB", "q": "Chế phẩm vi sinh xử lí nước thải có tác dụng gì?", "answer": "A", "explain": "Vi sinh vật phân hủy chất hữu cơ gây ô nhiễm, khử mùi hôi thối — làm sạch nước thải sinh học, an toàn.", "points": 0.25, "options": ["A. Phân hủy chất hữu cơ, khử mùi hôi, giảm ô nhiễm.", "B. Làm nước có màu đẹp.", "C. Diệt hết cá trong ao.", "D. Không có tác dụng."]}, {"type": "mcq", "level": "TH", "q": "Nước sau xử lí đạt chuẩn có thể dùng để làm gì?", "answer": "A", "explain": "Nước thải sau xử lí đạt chuẩn có thể tái dùng tưới cây — tiết kiệm nước, giảm xả thải ra môi trường.", "points": 0.25, "options": ["A. Tái sử dụng để tưới cây trồng.", "B. Uống trực tiếp.", "C. Nuôi cá cảnh cao cấp.", "D. Không dùng được."]}, {"type": "mcq", "level": "TH", "q": "Một cơ sở chế biến tinh bột sắn xả thải trực tiếp ra suối gây cá chết. Theo bài học, cần làm gì?", "answer": "A", "explain": "Phải xử lí: lắng, lọc sinh học, vi sinh khử ô nhiễm đạt chuẩn mới thải; tốt nhất tái sử dụng — đúng quy định BVMT.", "points": 0.25, "options": ["A. Xây hệ thống bể lắng, lọc sinh học + dùng chế phẩm vi sinh xử lí trước khi thải; tái dùng nước tưới.", "B. Xả vào ban đêm để tránh bị phát hiện.", "C. Đóng cửa cơ sở.", "D. Mặc kệ."]}, {"type": "mcq", "level": "VD", "q": "Vì sao không được xả nước thải chăn nuôi trực tiếp xuống ao nuôi cá?", "answer": "A", "explain": "Nước thải chưa xử lí giàu hữu cơ, mầm bệnh → ao thiếu ôxy, dịch bệnh → cá chết; phải qua biogas/xử lí mới dùng.", "points": 0.25, "options": ["A. Vì gây ô nhiễm, thiếu ôxy, phát sinh dịch bệnh khiến cá chết.", "B. Vì cá thích nước sạch tuyệt đối.", "C. Vì nước thải làm cá lớn nhanh.", "D. Không sao, xả thoải mái."]}, {"type": "mcq", "level": "VDC", "q": "Mô hình nào xử lí nước thải chăn nuôi hiệu quả nhất theo bài học?", "answer": "A", "explain": "Kết hợp biogas (kị khí) + lắng lọc sinh học + chế phẩm vi sinh là hệ thống xử lí toàn diện, hiệu quả nhất.", "points": 0.25, "options": ["A. Hầm biogas kết hợp bể lắng, lọc sinh học và chế phẩm vi sinh.", "B. Xả thẳng ra sông.", "C. Đào hố chôn.", "D. Phơi nắng."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: sinh học tác dụng chậm hơn nhưng bền vững.", "points": 1, "statements": ["a) Phân vi sinh an toàn, cải tạo đất, ít gây ô nhiễm hơn phân hóa học.", "b) Thuốc trừ sâu sinh học chọn lọc, ít độc với người và thiên địch.", "c) Nên kết hợp phân vi sinh với phân hữu cơ để tăng hiệu quả.", "d) Thuốc sinh học tác dụng nhanh, mạnh hơn thuốc hóa học."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: hữu cơ khuyến khích dùng vi sinh vật.", "points": 1, "statements": ["a) Vườn hữu cơ bị rệp nên dùng chế phẩm sinh học, thiên địch, không dùng thuốc hóa học.", "b) Công nghệ vi sinh là công cụ quan trọng của nông nghiệp hữu cơ.", "c) Thả ong mắt đỏ diệt sâu đục thân là biện pháp sinh học.", "d) Nông nghiệp hữu cơ cấm sử dụng vi sinh vật."]}, {"type": "short", "level": "VD", "q": "Nước thải chăn nuôi cần xử lí như thế nào trước khi thải ra môi trường?", "answer": "qua bể lắng, lọc sinh học và chế phẩm vi sinh", "explain": "Qua bể lắng, bể lọc sinh học; dùng chế phẩm vi sinh phân hủy chất hữu cơ, khử mùi; đạt chuẩn mới thải hoặc tái dùng.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Bã thải hầm biogas dùng để làm gì?", "answer": "làm phân bón cho cây trồng", "explain": "Bã biogas đã hoai mục, ít mầm bệnh — dùng bón cây, nuôi cá rất tốt.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Kinh tế tuần hoàn trong trồng trọt được hiểu là gì?", "answer": "A", "explain": "Kinh tế tuần hoàn: chất thải → nguyên liệu, vòng khép kín, gần như không có gì bỏ đi — bền vững.", "points": 0.25, "options": ["A. Mô hình mà chất thải của khâu này trở thành nguyên liệu của khâu khác, khép kín, hạn chế chất thải.", "B. Mô hình chỉ sản xuất không quan tâm chất thải.", "C. Mô hình đốt hết phụ phẩm.", "D. Mô hình nhập khẩu phân bón."]}, {"type": "mcq", "level": "NB", "q": "Trong mô hình VAC + biogas, dòng chất thải – nguyên liệu diễn ra như thế nào?", "answer": "A", "explain": "Vòng khép kín: phụ phẩm trồng trọt → thức ăn chăn nuôi → phân → biogas (khí + bã) → phân bón lại cho cây.", "points": 0.25, "options": ["A. Rơm rạ nuôi gia súc → phân vào biogas tạo khí đốt → bã biogas ủ compost bón cây.", "B. Chất thải đổ hết ra sông.", "C. Không có dòng nào.", "D. Mua phân bón về bón."]}, {"type": "mcq", "level": "TH", "q": "Lợi ích của kinh tế tuần hoàn trong nông nghiệp là gì?", "answer": "A", "explain": "Tuần hoàn: không lãng phí tài nguyên, giảm ô nhiễm, giảm chi phí đầu vào (phân bón, nhiên liệu), tăng thu nhập từ phụ phẩm.", "points": 0.25, "options": ["A. Tận dụng tối đa phụ phẩm, giảm ô nhiễm, tiết kiệm chi phí, tăng thu nhập.", "B. Làm tăng chất thải.", "C. Tốn kém hơn.", "D. Không có lợi ích."]}, {"type": "mcq", "level": "TH", "q": "Mô hình nào sau đây thể hiện kinh tế tuần hoàn?", "answer": "A", "explain": "Mô hình A khép kín chất thải thành nguyên liệu; mô hình B là tuyến tính gây ô nhiễm, lãng phí.", "points": 0.25, "options": ["A. Trang trại: rơm ủ chua nuôi bò – phân bò vào biogas – bã biogas bón rau.", "B. Trang trại: đốt rơm, xả phân ra sông, mua phân hóa học.", "C. Trang trại: bỏ hoang đất.", "D. Trang trại: chỉ trồng, không chăn nuôi."]}, {"type": "mcq", "level": "VD", "q": "Hộ gia đình có vườn, ao, chuồng (VAC) muốn áp dụng kinh tế tuần hoàn. Nên bắt đầu từ đâu?", "answer": "A", "explain": "Bắt đầu từ giải pháp đơn giản, rẻ (ủ compost), tích lũy rồi nâng cấp (biogas) — lộ trình phù hợp hộ gia đình.", "points": 0.25, "options": ["A. Từ việc nhỏ nhất: ủ compost rơm rạ, phân chuồng; sau đó xây hầm biogas khi có điều kiện.", "B. Phải đầu tư lớn ngay từ đầu.", "C. Không làm được vì quy mô nhỏ.", "D. Bỏ mô hình VAC."]}, {"type": "mcq", "level": "VDC", "q": "Đánh giá: Vì sao kinh tế tuần hoàn được xem là hướng đi tất yếu của nông nghiệp?", "answer": "A", "explain": "Tài nguyên cạn kiệt, biến đổi khí hậu đòi hỏi mô hình vừa hiệu quả kinh tế vừa thân thiện môi trường — kinh tế tuần hoàn đáp ứng cả hai.", "points": 0.25, "options": ["A. Vì tài nguyên hữu hạn, ô nhiễm gia tăng; tuần hoàn vừa BVMT vừa nâng cao hiệu quả kinh tế bền vững.", "B. Vì là trào lưu nhất thời.", "C. Vì không còn cách nào khác.", "D. Vì rẻ nhất."]}, {"type": "truefalse", "level": "VD", "q": "Tình huống: Xã có 500 ha lúa, hàng nghìn tấn rơm mỗi vụ. Xét tính đúng, sai của các giải pháp:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: giải pháp tổng thể. d) Sai: gây ô nhiễm, lãng phí.", "points": 1, "statements": ["a) Hỗ trợ máy cuộn rơm để thu gom cơ giới.", "b) Một phần trồng nấm, một phần ủ compost, một phần ủ chua nuôi bò.", "c) Liên kết thu mua, tạo đầu ra cho rơm rạ.", "d) Đốt hết cho nhanh, đỡ tốn công."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nhân rộng biogas:", "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: cần hỗ trợ, tuyên truyền chứ không ép buộc.", "points": 1, "statements": ["a) Rào cản: vốn đầu tư, cần thợ kĩ thuật, duy trì nạp liệu đều đặn.", "b) Giải pháp: hỗ trợ vốn, tập huấn, mô hình điểm, hầm composite giá rẻ.", "c) Ép buộc xây dựng là cách tốt nhất để nhân rộng.", "d) Hầm composite lắp đặt nhanh, kín tốt, phù hợp nhân rộng."]}, {"type": "short", "level": "VD", "q": "Trình bày vòng kinh tế tuần hoàn trong mô hình VAC + biogas.", "answer": "rơm nuôi gia súc, phân vào biogas, bã bón cây", "explain": "Rơm rạ làm thức ăn gia súc → phân chuồng vào hầm biogas tạo khí đốt → bã biogas ủ compost bón lại cho cây.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu một lợi ích của kinh tế tuần hoàn.", "answer": "tận dụng tối đa phụ phẩm, giảm ô nhiễm", "explain": "Các lợi ích: tận dụng phụ phẩm, giảm ô nhiễm, tiết kiệm chi phí phân bón/nhiên liệu, tăng thu nhập (nêu một là được).", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Chế phẩm vi sinh trong trồng trọt gồm những loại nào?", "answer": "A", "explain": "Chế phẩm vi sinh đa dạng: phân hủy hữu cơ, xử lí nước thải/mùi, phân vi sinh cố định đạm/phân giải lân, thuốc trừ sâu sinh học.", "points": 0.25, "options": ["A. Chế phẩm phân hủy (ủ compost), chế phẩm xử lí môi trường, phân bón vi sinh, thuốc trừ sâu sinh học.", "B. Chỉ gồm thuốc trừ sâu hóa học.", "C. Chỉ gồm phân đạm.", "D. Không có loại nào."]}, {"type": "mcq", "level": "NB", "q": "Phân bón vi sinh có ưu điểm gì so với phân hóa học?", "answer": "A", "explain": "Phân vi sinh: vi sinh vật cố định đạm, phân giải lân... an toàn, cải tạo đất, thân thiện môi trường; nhược điểm là tác dụng chậm hơn.", "points": 0.25, "options": ["A. An toàn, cải tạo đất, ít gây ô nhiễm, giá thành hợp lí.", "B. Tác dụng nhanh hơn hẳn phân hóa học.", "C. Không cần bón nhiều lần.", "D. Thay thế hoàn toàn mọi loại phân."]}, {"type": "mcq", "level": "TH", "q": "Thuốc trừ sâu sinh học (như chế phẩm từ nấm, vi khuẩn Bt) có ưu điểm gì?", "answer": "A", "explain": "Thuốc sinh học: đặc hiệu với sâu hại, an toàn với người và thiên địch, phân hủy nhanh, ít kháng thuốc — phù hợp IPM, hữu cơ.", "points": 0.25, "options": ["A. Chọn lọc, ít độc với người, thiên địch và môi trường; ít gây kháng thuốc.", "B. Diệt sạch mọi sinh vật.", "C. Tác dụng nhanh như thuốc hóa học.", "D. Không cần phun lại."]}, {"type": "mcq", "level": "TH", "q": "Vì sao nên kết hợp phân vi sinh với phân hữu cơ?", "answer": "A", "explain": "Phân hữu cơ cung cấp chất nền cho vi sinh vật sinh sôi; kết hợp giúp phân giải nhanh, cây hấp thụ tốt hơn.", "points": 0.25, "options": ["A. Vì phân hữu cơ là thức ăn, môi trường cho vi sinh vật phát triển, tăng hiệu quả cả hai.", "B. Vì hai loại triệt tiêu nhau.", "C. Không nên kết hợp.", "D. Vì cho vui."]}, {"type": "mcq", "level": "VD", "q": "Một vườn rau hữu cơ bị rệp hại. Giải pháp phù hợp với bài học là gì?", "answer": "A", "explain": "Hữu cơ: chỉ dùng biện pháp sinh học (chế phẩm nấm, vi khuẩn, thiên địch, bẫy) — giữ đúng tiêu chuẩn hữu cơ.", "points": 0.25, "options": ["A. Dùng chế phẩm sinh học (nấm, thiên địch), bẫy bả; tuyệt đối không dùng thuốc hóa học.", "B. Phun thuốc hóa học liều cao.", "C. Bỏ vườn.", "D. Đốt vườn."]}, {"type": "mcq", "level": "VDC", "q": "So sánh thuốc trừ sâu hóa học và sinh học: nhận định nào đúng?", "answer": "A", "explain": "Hóa học: nhanh, mạnh nhưng tồn dư, kháng thuốc, hại môi trường; sinh học: an toàn, bền vững nhưng chậm, cần dùng đúng lúc.", "points": 0.25, "options": ["A. Hóa học tác dụng nhanh, mạnh nhưng độc hại, dễ kháng; sinh học an toàn, bền vững nhưng tác dụng chậm hơn.", "B. Sinh học mạnh hơn hóa học.", "C. Hai loại như nhau.", "D. Hóa học an toàn hơn."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về mô hình VAC + biogas:", "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: hộ nhỏ vẫn áp dụng được từ việc đơn giản.", "points": 1, "statements": ["a) Rơm rạ làm thức ăn gia súc; phân vào biogas; bã biogas bón cây — khép kín.", "b) Mô hình này tận dụng tối đa phụ phẩm, giảm ô nhiễm.", "c) Hộ VAC nhỏ không thể áp dụng kinh tế tuần hoàn.", "d) Nên bắt đầu từ ủ compost rồi nâng cấp lên biogas."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phải xử lí chất thải theo quy định.", "points": 1, "statements": ["a) Cơ sở chế biến sắn xả thải ra suối phải xây hệ thống xử lí đạt chuẩn.", "b) Xả thải ban đêm để tránh phát hiện là hành vi vi phạm.", "c) Nước thải sau xử lí có thể tái sử dụng.", "d) Phát triển sản xuất không cần quan tâm xử lí chất thải."]}, {"type": "short", "level": "VDC", "q": "Một xã có hàng nghìn tấn rơm mỗi vụ. Nêu hai giải pháp tận dụng tổng thể.", "answer": "hỗ trợ máy cuộn rơm và đa dạng hóa sử dụng", "explain": "Giải pháp: hỗ trợ máy cuộn rơm thu gom; trồng nấm, ủ compost, ủ chua; liên kết thu mua tạo đầu ra (nêu hai là được).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai rào cản khi nhân rộng hầm biogas ở nông thôn.", "answer": "vốn đầu tư ban đầu và cần thợ kĩ thuật", "explain": "Các rào cản: vốn đầu tư, cần thợ kĩ thuật xây kín, duy trì nạp liệu đều đặn (nêu hai là được).", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Một xã có 500 ha lúa, mỗi vụ hàng nghìn tấn rơm rạ. Đề xuất giải pháp tổng thể tận dụng rơm rạ?", "answer": "A", "explain": "Giải pháp tổng thể: cơ giới hóa thu gom + đa dạng hóa sử dụng (nấm, compost, thức ăn) + đầu ra — biến rơm rạ thành tài nguyên.", "points": 0.25, "options": ["A. Hỗ trợ máy cuộn rơm; một phần trồng nấm, một phần ủ compost, một phần ủ chua nuôi bò; liên kết thu mua.", "B. Đốt hết cho nhanh.", "C. Bỏ đống ngoài đồng.", "D. Cấm thu hoạch lúa."]}, {"type": "mcq", "level": "NB", "q": "Tính hiệu quả: 1 tấn rơm trồng nấm rơm cho khoảng 150 kg nấm tươi (giá 30.000 đ/kg). Thu nhập từ 1 tấn rơm là bao nhiêu?", "answer": "A", "explain": "150 kg x 30.000 đ = 4.500.000 đ — thu nhập đáng kể từ phụ phẩm bỏ đi (chưa trừ chi phí meo giống, công).", "points": 0.25, "options": ["A. Khoảng 4,5 triệu đồng (chưa trừ chi phí).", "B. Khoảng 450.000 đồng.", "C. Khoảng 45 triệu đồng.", "D. Không thu được gì."]}, {"type": "mcq", "level": "TH", "q": "Trang trại 50 con lợn xây hầm biogas 30 m3. Ngoài gas đun nấu, còn lợi ích nào?", "answer": "A", "explain": "Biogas quy mô lớn: đủ gas + phát điện, bã thải lượng lớn làm phân bón thay phân hóa học — lợi ích kép môi trường và kinh tế.", "points": 0.25, "options": ["A. Xử lí triệt để ô nhiễm, bã làm phân bón cho hàng ha cây trồng, giảm chi phí phân bón.", "B. Không còn lợi ích nào.", "C. Chỉ tốn tiền.", "D. Làm tăng ô nhiễm."]}, {"type": "mcq", "level": "TH", "q": "Một hợp tác xã muốn xây dựng 'làng nông nghiệp tuần hoàn'. Cần những hạng mục nào?", "answer": "A", "explain": "Làng tuần hoàn cần hạ tầng đồng bộ: thu gom, ủ compost, trồng nấm, biogas, xử lí nước thải — khép kín chất thải toàn xã.", "points": 0.25, "options": ["A. Điểm thu gom rơm rạ; xưởng ủ compost; khu trồng nấm; hầm biogas tập trung; hệ thống xử lí nước thải.", "B. Chỉ cần lò đốt rác.", "C. Chỉ cần bãi chôn lấp.", "D. Không cần hạng mục gì."]}, {"type": "mcq", "level": "VD", "q": "Rào cản khi nhân rộng mô hình biogas ở nông thôn là gì?", "answer": "A", "explain": "Rào cản: vốn xây hầm, kĩ thuật xây kín khí, thói quen nạp liệu đều đặn và bảo dưỡng — cần hỗ trợ, tập huấn.", "points": 0.25, "options": ["A. Vốn đầu tư ban đầu, cần thợ kĩ thuật xây kín, cần duy trì nạp nguyên liệu đều đặn.", "B. Không có rào cản nào.", "C. Người dân không cần gas.", "D. Biogas đã lỗi thời."]}, {"type": "mcq", "level": "VDC", "q": "Giải pháp khắc phục rào cản trên là gì?", "answer": "A", "explain": "Hỗ trợ vốn + đào tạo + mô hình trình diễn + công nghệ hầm composite giá rẻ, lắp nhanh — thúc đẩy nhân rộng.", "points": 0.25, "options": ["A. Hỗ trợ vốn, tập huấn kĩ thuật, xây mô hình điểm, hầm composite lắp sẵn giá rẻ.", "B. Bỏ mô hình biogas.", "C. Ép buộc xây dựng.", "D. Không cần giải pháp."]}, {"type": "truefalse", "level": "VDC", "q": "Phân tích: Hợp tác xã xây 'làng nông nghiệp tuần hoàn'. Xét tính đúng, sai của các hạng mục:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đốt không phải hướng tuần hoàn.", "points": 1, "statements": ["a) Điểm thu gom rơm rạ tập trung của xã.", "b) Xưởng ủ compost và khu trồng nấm chung.", "c) Hầm biogas tập trung xử lí chất thải chăn nuôi.", "d) Chỉ cần xây lò đốt rác tập trung."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các nhận định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tuyến tính lãng phí, ô nhiễm, không bền vững.", "points": 1, "statements": ["a) Kinh tế tuần hoàn là hướng tất yếu vì tài nguyên hữu hạn, ô nhiễm gia tăng.", "b) Vi sinh vật là 'công nhân' trung tâm của mô hình tuần hoàn.", "c) Áp dụng tuần hoàn vừa BVMT vừa nâng cao hiệu quả kinh tế.", "d) Mô hình tuyến tính (đốt, xả thải) bền vững hơn tuần hoàn."]}, {"type": "short", "level": "VDC", "q": "Giải thích vì sao vi sinh vật được gọi là 'công nhân' của nông nghiệp tuần hoàn.", "answer": "vì phân hủy chất thải thành phân bón, khí đốt và thay thế hóa chất", "explain": "Vi sinh vật phân hủy phụ phẩm thành phân bón, tạo biogas, cố định đạm, đối kháng sâu bệnh — trung tâm của mọi khâu tuần hoàn.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu mối quan hệ giữa công nghệ vi sinh và nông nghiệp hữu cơ.", "answer": "vi sinh là công cụ giúp hữu cơ thay thế hóa chất", "explain": "Phân vi sinh, thuốc sinh học, ủ compost là trụ cột kĩ thuật giúp nông nghiệp hữu cơ thay thế hoàn toàn hóa chất.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Mối quan hệ giữa công nghệ vi sinh và nông nghiệp hữu cơ là gì?", "answer": "A", "explain": "Phân vi sinh, thuốc sinh học, ủ compost là trụ cột kĩ thuật của nông nghiệp hữu cơ — thay thế hoàn toàn hóa chất.", "points": 0.25, "options": ["A. Công nghệ vi sinh là công cụ quan trọng giúp nông nghiệp hữu cơ thay thế phân bón, thuốc hóa học.", "B. Hai lĩnh vực đối lập nhau.", "C. Hữu cơ cấm dùng vi sinh vật.", "D. Không liên quan."]}, {"type": "mcq", "level": "NB", "q": "Mối quan hệ giữa Bài 26 và Bài 27 thể hiện ở điểm nào?", "answer": "A", "explain": "Bài 26: nhận diện ô nhiễm + giải pháp chung; Bài 27: giải pháp công nghệ vi sinh chi tiết (compost, biogas, tuần hoàn).", "points": 0.25, "options": ["A. Bài 26 chỉ ra vấn đề ô nhiễm; Bài 27 đưa giải pháp vi sinh cụ thể để xử lí — vấn đề và giải pháp.", "B. Hai bài trùng lặp nhau.", "C. Hai bài mâu thuẫn nhau.", "D. Không có quan hệ."]}, {"type": "mcq", "level": "TH", "q": "Trong các phát biểu sau, phát biểu nào đúng nhất về vai trò của vi sinh vật?", "answer": "A", "explain": "Vi sinh vật là 'công nhân' của tự nhiên: phân hủy hữu cơ, cố định đạm, đối kháng sâu bệnh — trung tâm của Bài 27.", "points": 0.25, "options": ["A. Vi sinh vật vừa phân hủy chất thải thành tài nguyên, vừa thay thế hóa chất, góp phần BVMT.", "B. Vi sinh vật chỉ gây bệnh.", "C. Vi sinh vật vô dụng.", "D. Vi sinh vật chỉ dùng trong y tế."]}, {"type": "mcq", "level": "TH", "q": "Nội dung nào sau đây KHÔNG thuộc Bài 27?", "answer": "A", "explain": "Nguyên tắc 4 đúng thuộc Bài 26; ba nội dung còn lại thuộc Bài 27.", "points": 0.25, "options": ["A. Nguyên tắc 4 đúng khi sử dụng thuốc bảo vệ thực vật.", "B. Quy trình ủ phân compost.", "C. Cấu tạo hầm biogas.", "D. Mô hình kinh tế tuần hoàn."]}, {"type": "mcq", "level": "VD", "q": "Một đề kiểm tra Bài 27 ở mức vận dụng cao có thể yêu cầu gì?", "answer": "A", "explain": "Mức vận dụng cao: thiết kế, đề xuất mô hình tổng hợp xử lí chất thải cho tình huống cụ thể — đúng năng lực bài học.", "points": 0.25, "options": ["A. Thiết kế mô hình xử lí chất thải cho một trang trại cụ thể (VAC + biogas + compost).", "B. Chỉ chép định nghĩa compost.", "C. Chỉ kể tên vi sinh vật.", "D. Không có câu vận dụng cao."]}, {"type": "mcq", "level": "VDC", "q": "Thông điệp chính của Bài 27 là gì?", "answer": "A", "explain": "Thông điệp: 'biến rác thành vàng' — dùng công nghệ vi sinh biến phụ phẩm, chất thải thành phân bón, năng lượng, khép kín tuần hoàn.", "points": 0.25, "options": ["A. Ứng dụng vi sinh vật biến chất thải thành tài nguyên, xây dựng nông nghiệp tuần hoàn, bền vững.", "B. Chất thải nên đổ bỏ.", "C. Vi sinh vật nguy hiểm.", "D. Chỉ cần dùng hóa chất."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau (phân biệt Bài 26 – Bài 27):", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: thuộc Bài 26.", "points": 1, "statements": ["a) Bài 26: vấn đề ô nhiễm và giải pháp chung; Bài 27: giải pháp vi sinh cụ thể.", "b) Nguyên tắc 4 đúng thuộc Bài 26.", "c) Ủ compost, biogas, kinh tế tuần hoàn thuộc Bài 27.", "d) So sánh hữu cơ và VietGAP thuộc Bài 27."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định tổng kết:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần tận dụng, không đổ bỏ.", "points": 1, "statements": ["a) Thông điệp Bài 27: biến chất thải thành tài nguyên bằng công nghệ vi sinh.", "b) Học sinh có thể thực hành ủ compost quy mô nhỏ trong vườn trường.", "c) Mỗi người đều có thể góp phần xây dựng nông nghiệp tuần hoàn.", "d) Chất thải trồng trọt tốt nhất là đổ bỏ."]}, {"type": "short", "level": "VDC", "q": "Kể tên ba ứng dụng của công nghệ vi sinh trong bảo vệ môi trườ
