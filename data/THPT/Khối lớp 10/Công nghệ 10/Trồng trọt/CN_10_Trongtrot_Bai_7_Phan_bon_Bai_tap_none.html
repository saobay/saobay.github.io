 coi là một trong những yếu tố quyết định năng suất cây trồng?", "options": ["A. Vì phân bón cung cấp chất dinh dưỡng cho cây sinh trưởng, phát triển, tạo năng suất.", "B. Vì phân bón làm thay đổi hoàn toàn tính chất của đất.", "C. Vì không có phân bón thì cây không quang hợp được.", "D. Vì phân bón giúp cây không cần nước."], "answer": "A", "explain": "Cây trồng cần chất dinh dưỡng để sinh trưởng, ra hoa, kết quả; phân bón cung cấp các chất đó nên quyết định lớn đến năng suất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một loại phân được sản xuất bằng con đường hóa học, chứa nguyên tố dinh dưỡng ở dạng muối khoáng, hàm lượng dinh dưỡng cao, cây dễ hấp thu. Đó là loại phân nào?", "options": ["A. Phân hữu cơ.", "B. Phân vô cơ.", "C. Phân vi sinh.", "D. Phân xanh."], "answer": "B", "explain": "Các dấu hiệu \"sản xuất bằng con đường hóa học\", \"dạng muối khoáng\", \"hàm lượng cao, tác dụng nhanh\" là đặc điểm của phân vô cơ (phân hóa học).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về khái niệm phân bón:", "statements": ["a) Phân bón cung cấp chất dinh dưỡng cho cây trồng.", "b) Bón phân làm tăng độ phì nhiêu của đất.", "c) Chỉ có phân hóa học mới được gọi là phân bón.", "d) Bón phân hợp lí giúp tăng năng suất và chất lượng nông sản."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đây là vai trò cơ bản nhất của phân bón. b) Đúng: phân bón (nhất là hữu cơ, vi sinh) làm đất màu mỡ hơn. c) Sai: phân hữu cơ, phân vi sinh cũng là phân bón. d) Đúng: cây đủ dinh dưỡng cho năng suất, chất lượng cao.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về phân bón và đất trồng:", "statements": ["a) Phân bón chỉ có tác dụng cung cấp dinh dưỡng, không ảnh hưởng gì đến đất.", "b) Phân hữu cơ vừa cung cấp dinh dưỡng vừa cải tạo đất.", "c) Bón phân là cách trả lại cho đất những chất dinh dưỡng mà cây đã lấy đi.", "d) Phân bón có thể thay thế hoàn toàn vai hữu cơ có hàm lượng dinh dưỡng cao hơn phân vô cơ.", "d) Bón phân hữu cơ giúp đất tơi xốp, tăng độ phì nhiêu."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: cả ba đều có nguồn gốc động, thực vật hoặc than bùn. b) Đúng: đặc điểm của phân hữu cơ. c) Sai: ngược lại, phân hữu cơ có hàm lượng dinh dưỡng thấp hơn phân vô cơ. d) Đúng: đây là ưu điểm nổi bật của phân hữu cơ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về phân hữu cơ:", "statements": ["a) Phân chuồng tươi bón trực tiếp cho cây sẽ tốt hơn phân đã ủ hoai mục.", "b) Phân hữu cơ có tác dụng chậm vì chất dinh dưỡng cần thời gian phân giải.", "c) Bón nhiều phân hữu cơ hoai mục giúp cải tạo đất bạc màu.", "d) Phân hữu cơ không chứa nguyên tố vi lượng."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: phân tươi gây nóng, xót rễ và mang mầm bệnh; phải ủ hoai mục. b) Đúng: dinh dưỡng dạng hữu cơ cần VSV phân giải mới tiêu được. c) Đúng: tăng mùn, cải thiện cấu trúc đất bạc màu. d) Sai: phân hữu cơ chứa khá đầy đủ cả đa, trung và vi lượng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 2 ví dụ về phân hữu cơ có nguồn gốc từ thực vật.", "answer": "phân xanh, rơm rạ", "explain": "Phân hữu cơ nguồn gốc thực vật gồm: phân xanh (cây phân xanh vùi vào đất), rơm rạ, bã mía, vỏ cà phê... Chấp nhận các đáp án tương đương.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao phải ủ hoai mục phân chuồng trước khi bón? (Nêu 1 lí do chính)", "answer": "để diệt mầm bệnh và giúp cây dễ hấp thu, tránh làm xót rễ", "explain": "Phân chuồng tươi chứa mầm bệnh, hạt cỏ dại và khi phân giải sinh nhiệt gây xót rễ; ủ hoai mục khắc phục các nhược điểm này và giúp dinh dưỡng ở dạng dễ tiêu.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Phân vô cơ còn được gọi là gì?", "options": ["A. Phân hóa học.", "B. Phân chuồng.", "C. Phân xanh.", "D. Phân vi sinh."], "answer": "A", "explain": "Phân vô cơ được sản xuất bằng con đường hóa học nên còn gọi là phân hóa học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đặc điểm của phân vô cơ là gì?", "options": ["A. Hàm lượng dinh dưỡng cao, dễ hòa tan, tác dụng nhanh.", "B. Hàm lượng dinh dưỡng thấp, tác dụng chậm.", "C. Chứa nhiều vi sinh vật có ích.", "D. Làm đất tơi xốp, tăng mùn."], "answer": "A", "explain": "Phân vô cơ chứa dinh dưỡng dạng muối khoáng nên hàm lượng cao, dễ hòa tan, cây hấp thu nhanh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Loại phân nào sau đây là phân đạm (chứa N)?", "options": ["A. Supe lân.", "B. Kali clorua.", "C. Urê.", "D. Vôi bột."], "answer": "C", "explain": "Urê CO(NH2)2 chứa khoảng 46 phần trăm đạm nguyên chất, là phân đạm điển hình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ưu điểm lớn nhất của phân vô cơ so với phân hữu cơ là gì?", "options": ["A. Hàm lượng dinh dưỡng cao, tác dụng nhanh, dễ sử dụng với liều lượng chính xác.", "B. Cải tạo đất tốt hơn.", "C. Giá thành luôn rẻ hơn.", "D. Không gây ô nhiễm môi trường."], "answer": "A", "explain": "Nhờ hàm lượng dinh dưỡng cao và ở dạng dễ tiêu, phân vô cơ tác dụng nhanh và dễ tính liều lượng chính xác.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hạn chế của việc lạm dụng phân vô cơ (bón quá nhiều, liên tục) là gì?", "options": ["A. Làm đất chai cứng, chua hóa, giảm vi sinh vật có ích và gây ô nhiễm môi trường.", "B. Làm cây sinh trưởng quá chậm.", "C. Làm đất tơi xốp quá mức.", "D. Không có hạn chế gì."], "answer": "A", "explain": "Bón nhiều phân hóa học liên tục làm đất chai cứng, chua, giảm VSV có ích, dư lượng rửa trôi gây ô nhiễm nguồn nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một bao phân ghi \"KCl\". Đây là phân gì và cung cấp nguyên tố nào cho cây?", "options": ["A. Phân kali, cung cấp kali (K).", "B. Phân đạm, cung cấp đạm (N).", "C. Phân lân, cung cấp lân (P).", "D. Vôi, cung cấp canxi (Ca)."], "answer": "A", "explain": "KCl là kali clorua, phân đơn cung cấp nguyên tố kali (K) cho cây trồng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về phân vô cơ:", "statements": ["a) Phân vô cơ được sản xuất bằng con đường hóa học.", "b) Phân vô cơ chứa chất dinh dưỡng ở dạng muối khoáng.", "c) Phân vô cơ có tác dụng chậm hơn phân hữu cơ.", "d) Urê, supe lân, kali clorua đều là phân vô cơ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: dinh dưỡng dạng muối khoáng nên cây dễ hấp thu. c) Sai: phân vô cơ tác dụng nhanh hơn phân hữu cơ. d) Đúng: cả ba đều là phân hóa học.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về phân vô cơ:", "statements": ["a) Bón phân vô cơ càng nhiều thì năng suất càng cao, không có giới hạn.", "b) Phân vô cơ dễ hòa tan nên cây trồng hấp thu nhanh.", "c) Lạm dụng phân đạm hóa học làm rau tồn dư nitrat, ảnh hưởng sức khỏe.", "d) Nên kết hợp phân vô cơ với phân hữu cơ để vừa tăng năng suất vừa bảo vệ đất."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: bón quá liều gây ngộ độc, ô nhiễm, năng suất giảm. b) Đúng. c) Đúng: thừa đạm làm tích lũy nitrat trong rau. d) Đúng: kết hợp hài hòa là hướng canh tác bền vững.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên 2 loại phân vô cơ cung cấp đạm (N) cho cây trồng.", "answer": "urê, amoni sunfat", "explain": "Các phân đạm vô cơ phổ biến: urê, amoni sunfat (SA), amoni nitrat... Chấp nhận đáp án tương đương.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 1 tác hại của việc lạm dụng phân hóa học đối với đất trồng.", "answer": "làm đất chai cứng, chua hóa", "explain": "Lạm dụng phân hóa học làm đất chai cứng, chua hóa, giảm mùn và vi sinh vật có ích trong đất.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Phân vi sinh là loại phân bón chứa thành phần đặc biệt nào?", "options": ["A. Các vi sinh vật có ích như vi sinh vật cố định đạm, phân giải lân.", "B. Các loại thuốc trừ sâu sinh học.", "C. Các chất kích thích sinh trưởng hóa học.", "D. Mùn và than bùn nghiền nhỏ."], "answer": "A", "explain": "Phân vi sinh chứa các vi sinh vật có ích: VSV cố định đạm, VSV phân giải lân, VSV phân giải chất hữu cơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vi sinh vật cố định đạm có vai trò gì?", "options": ["A. Chuyển nitơ trong không khí thành đạm mà cây trồng hấp thu được.", "B. Phân giải xác bã thực vật thành mùn.", "C. Diệt trừ sâu bệnh hại cây trồng.", "D. Làm đất chua nhanh hơn."], "answer": "A", "explain": "VSV cố định đạm (ví dụ Rhizobium sống cộng sinh ở rễ cây họ đậu) biến N2 trong không khí thành dạng đạm cây dùng được.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vi sinh vật phân giải lân có vai trò gì?", "options": ["A. Chuyển lân khó tan trong đất thành dạng lân dễ tiêu cho cây hấp thu.", "B. Cố định đạm từ không khí.", "C. Tổng hợp chất diệp lục cho cây.", "D. Làm tăng độ chua của đất."], "answer": "A", "explain": "Nhiều loại lân trong đất ở dạng khó tan; VSV phân giải lân chuyển chúng thành dạng dễ tiêu giúp cây hấp thu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ưu điểm nổi bật của phân vi sinh là gì?", "options": ["A. An toàn, thân thiện với môi trường, góp phần cải tạo đất.", "B. Tác dụng nhanh như phân hóa học.", "C. Hàm lượng dinh dưỡng rất cao.", "D. Không phụ thuộc vào điều kiện đất đai."], "answer": "A", "explain": "Phân vi sinh không gây ô nhiễm, an toàn cho người và môi trường, đồng thời cải thiện hệ VSV đất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phân vi sinh thường được dùng kết hợp với phân hữu cơ?", "options": ["A. Vì vi sinh vật cần chất hữu cơ làm thức ăn để phát triển và phát huy tác dụng.", "B. Vì phân hữu cơ diệt được vi sinh vật có hại.", "C. Vì phân vi sinh làm tăng hàm lượng đạm của phân hữu cơ lên gấp đôi.", "D. Vì để giảm giá thành phân bón."], "answer": "A", "explain": "VSV trong phân vi sinh cần nguồn chất hữu cơ để sinh trưởng; kết hợp với phân hữu cơ giúp chúng phát triển mạnh, tăng hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ruộng lạc (đậu phộng) được bón phân vi sinh chứa Rhizobium cho năng suất cao mà giảm được lượng phân đạm hóa học. Giải thích nào đúng?", "options": ["A. Rhizobium cộng sinh ở nốt sần rễ cây họ đậu, cố định đạm từ không khí cung cấp cho cây.", "B. Rhizobium diệt sâu bệnh hại rễ lạc.", "C. Rhizobium làm đất tơi xốp thay cho cày bừa.", "D. Rhizobium cung cấp trực tiếp lân cho cây."], "answer": "A", "explain": "Rhizobium sống cộng sinh trong nốt sần rễ cây họ đậu, cố định N2 thành đạm cây hấp thu được nên giảm được phân đạm hóa học.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về vai trò của phân vi sinh:", "statements": ["a) Phân vi sinh chứa các vi sinh vật có ích cho cây trồng.", "b) Vi sinh vật cố định đạm giúp cây hấp thu được nitơ từ không khí.", "c) Phân vi sinh có tác dụng nhanh như phân hóa học.", "d) Phân vi sinh thân thiện với môi trường."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: định nghĩa phân vi sinh. b) Đúng: vai trò của VSV cố định đạm. c) Sai: phân vi sinh tác dụng chậm, phụ thuộc điều kiện. d) Đúng: ưu điểm nổi bật.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về phân vi sinh:", "statements": ["a) Bón phân vi sinh cho cây họ đậu giúp giảm lượng phân đạm hóa học.", "b) Vi sinh vật phân giải lân biến lân khó tan thành lân dễ tiêu.", "c) Phân vi sinh có thể thay thế hoàn toàn mọi loại phân bón khác.", "d) Hiệu quả của phân vi sinh phụ thuộc vào độ ẩm, nhiệt độ của đất."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: nhờ VSV cố định đạm cộng sinh. b) Đúng. c) Sai: phân vi sinh chỉ bổ sung, không thay thế hoàn toàn phân hữu cơ, vô cơ. d) Đúng: VSV chỉ hoạt động tốt trong điều kiện thích hợp.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên 2 nhóm vi sinh vật có ích thường có trong phân vi sinh.", "answer": "vi sinh vật cố định đạm, vi sinh vật phân giải lân", "explain": "Các nhóm VSV có ích trong phân vi sinh: VSV cố định đạm, VSV phân giải lân, VSV phân giải chất hữu cơ (xenlulozơ).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nốt sần ở rễ cây họ đậu (lạc, đậu tương) chứa vi sinh vật nào có ích?", "answer": "Rhizobium", "explain": "Rhizobium là vi khuẩn cố định đạm sống cộng sinh trong nốt sần rễ cây họ đậu.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Phân đơn là loại phân như thế nào?", "options": ["A. Chỉ chứa một nguyên tố dinh dưỡng đa lượng.", "B. Chứa từ hai nguyên tố dinh dưỡng trở lên.", "C. Chỉ chứa vi sinh vật có ích.", "D. Chỉ dùng để bón lót."], "answer": "A", "explain": "Phân đơn chỉ chứa một nguyên tố dinh dưỡng đa lượng, ví dụ urê (N), supe lân (P), kali clorua (K).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Loại phân nào sau đây là phân đơn?", "options": ["A. Urê.", "B. DAP.", "C. NPK.", "D. Phân chuồng."], "answer": "A", "explain": "Urê chỉ chứa đạm (N) nên là phân đơn. DAP là phân phức hợp, NPK là phân hỗn hợp, phân chuồng là phân hữu cơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phân phức hợp khác phân hỗn hợp ở điểm nào?", "options": ["A. Phân phức hợp được tạo ra bằng phản ứng hóa học, phân hỗn hợp được tạo bằng cách trộn cơ học.", "B. Phân phức hợp chỉ chứa một nguyên tố dinh dưỡng.", "C. Phân hỗn hợp được tạo bằng phản ứng hóa học.", "D. Hai loại hoàn toàn giống nhau."], "answer": "A", "explain": "Phân phức hợp (DAP, MAP) tạo thành qua phản ứng hóa học; phân hỗn hợp (NPK) là trộn cơ học các phân đơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "DAP là phân phức hợp vì sao?", "options": ["A. Vì trong một hợp chất chứa cả đạm (N) và lân (P), được tạo ra bằng phản ứng hóa học.", "B. Vì chỉ chứa nguyên tố đạm.", "C. Vì được trộn từ urê và supe lân.", "D. Vì chứa vi sinh vật cố định đạm."], "answer": "A", "explain": "DAP (diamoni photphat) là hợp chất chứa cả N và P, hình thành qua phản ứng hóa học nên là phân phức hợp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân NPK được xếp vào loại phân hỗn hợp vì sao?", "options": ["A. Vì được tạo ra bằng cách trộn cơ học các phân đơn chứa N, P, K theo tỉ lệ nhất định.", "B. Vì được tạo ra bằng phản ứng hóa học.", "C. Vì chỉ chứa một nguyên tố dinh dưỡng.", "D. Vì có nguồn gốc từ chất hữu cơ."], "answer": "A", "explain": "NPK là phân hỗn hợp: trộn cơ học phân đạm, phân lân, phân kali theo tỉ lệ phù hợp từng loại cây.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một bao phân ghi \"NPK 16-16-8\". Con số này cho biết điều gì?", "options": ["A. Tỉ lệ phần trăm N, P2O5, K2O trong phân lần lượt là 16, 16 và 8 phần trăm.", "B. Phân chứa 16 kg đạm, 16 kg lân, 8 kg kali.", "C. Giá tiền của 3 loại phân đơn.", "D. Thời gian tác dụng của phân là 16, 16 và 8 ngày."], "answer": "A", "explain": "Các con số trên bao phân NPK chỉ tỉ lệ phần trăm các nguyên tố dinh dưỡng N, P2O5, K2O có trong phân.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về phân đơn và phân phức hợp:", "statements": ["a) Urê, supe lân, kali clorua đều là phân đơn.", "b) Phân phức hợp chứa từ hai nguyên tố dinh dưỡng trở lên.", "c) NPK là phân đơn vì chỉ dùng để bón thúc.", "d) DAP vừa cung cấp đạm vừa cung cấp lân cho cây."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: mỗi loại chỉ chứa một nguyên tố đa lượng. b) Đúng: định nghĩa phân phức hợp. c) Sai: NPK là phân hỗn hợp, chứa N, P, K. d) Đúng: DAP chứa cả N và P.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về phân hỗn hợp NPK:", "statements": ["a) Phân đơn chỉ chứa một nguyên tố nên khi bón cần phối hợp nhiều loại.", "b) Phân phức hợp và phân hỗn hợp đều cung cấp nhiều nguyên tố dinh dưỡng cùng lúc.", "c) Trộn urê với supe lân theo tỉ lệ sẽ được phân phức hợp.", "d) Dùng phân hỗn hợp NPK giúp tiết kiệm công bón so với bón riêng từng phân đơn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: muốn đủ N, P, K phải dùng nhiều phân đơn. b) Đúng. c) Sai: trộn cơ học chỉ được phân hỗn hợp, phức hợp phải qua phản ứng hóa học. d) Đúng: một lần bón cung cấp nhiều nguyên tố.", "points": 1}, {"type": "short", "level": "VDC", "q": "Phân urê thuộc loại phân đơn hay phân phức hợp? Vì sao? (Trả lời: loại phân + lí do ngắn)", "answer": "phân đơn vì chỉ chứa một nguyên tố dinh dưỡng là đạm", "explain": "Urê chỉ chứa nguyên tố đạm (N) nên là phân đơn.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 1 ví dụ về phân phức hợp và 1 ví dụ về phân hỗn hợp.", "answer": "DAP và NPK", "explain": "Phân phức hợp: DAP, MAP. Phân hỗn hợp: NPK. Chấp nhận đáp án tương đương.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Đạm (N) là thành phần cấu tạo của những chất nào trong cây?", "options": ["A. Protein và diệp lục.", "B. Tinh bột và đường.", "C. Xenlulozơ và lignin.", "D. Nước và muối khoáng."], "answer": "A", "explain": "Đạm là thành phần của protein, diệp lục và nhiều hợp chất quan trọng khác trong cây.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vai trò chính của đạm đối với cây trồng là gì?", "options": ["A. Kích thích cây sinh trưởng thân, lá; tăng năng suất.", "B. Kích thích ra hoa, đậu quả.", "C. Tăng độ ngọt của quả.", "D. Làm rễ cây phát triển mạnh."], "answer": "A", "explain": "Đạm thúc đẩy sinh trưởng thân, lá (sinh trưởng sinh dưỡng), từ đó tạo cơ sở cho năng suất cao.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi cây thiếu đạm, biểu hiện dễ nhận thấy nhất là gì?", "options": ["A. Cây còi cọc, lá vàng úa.", "B. Lá có màu tím đỏ.", "C. Mép lá bị cháy khô.", "D. Rễ cây bị thối."], "answer": "A", "explain": "Thiếu đạm làm giảm diệp lục nên lá vàng úa (vàng từ lá già trước), cây còi cọc, sinh trưởng kém.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao khi thiếu đạm, lá già vàng trước rồi mới đến lá non?", "options": ["A. Vì đạm là nguyên tố linh động, cây chuyển đạm từ lá già lên nuôi lá non.", "B. Vì lá già không quang hợp được.", "C. Vì sâu bệnh thường tấn công lá già trước.", "D. Vì lá non tự tổng hợp được đạm."], "answer": "A", "explain": "Đạm linh động trong cây: khi thiếu, cây huy động đạm từ lá già chuyển lên lá non nên lá già vàng trước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tác hại của việc bón thừa đạm cho cây trồng là gì?", "options": ["A. Cây tốt lốp, dễ đổ ngã, dễ nhiễm sâu bệnh, chậm ra hoa kết quả.", "B. Cây còi cọc, lá vàng.", "C. Quả bị nhỏ, hạt lép.", "D. Rễ cây kém phát triển."], "answer": "A", "explain": "Thừa đạm kích thích sinh trưởng thân lá quá mức (tốt lốp), cây yếu, dễ đổ, dễ nhiễm sâu bệnh và chậm chuyển sang sinh trưởng sinh thực.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ruộng lúa giai đoạn đẻ nhánh có biểu hiện lá vàng từ gốc lên, cây thấp còi. Chẩn đoán và biện pháp xử lí đúng là gì?", "options": ["A. Thiếu đạm, cần bón thúc phân đạm (urê) với liều lượng hợp lí.", "B. Thiếu lân, cần bón supe lân.", "C. Thiếu kali, cần bón kali clorua.", "D. Bị bệnh vàng lá, cần phun thuốc trừ bệnh."], "answer": "A", "explain": "Biểu hiện vàng lá từ gốc lên, cây còi là điển hình của thiếu đạm; biện pháp là bón thúc đạm đúng liều.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về vai trò của đạm:", "statements": ["a) Đạm là thành phần của protein và diệp lục trong cây.", "b) Đạm kích thích cây sinh trưởng thân, lá.", "c) Thiếu đạm làm cây còi cọc, lá vàng úa.", "d) Bón càng nhiều đạm thì cây càng cho năng suất cao, không có tác hại."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: vai trò chính của đạm. c) Đúng: biểu hiện điển hình khi thiếu đạm. d) Sai: thừa đạm gây tốt lốp, đổ ngã, sâu bệnh.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về thiếu và thừa đạm:", "statements": ["a) Cây thiếu đạm thường vàng lá từ lá già trước.", "b) Thừa đạm làm cây chậm ra hoa, kết quả.", "c) Rau ăn lá cần bón nhiều đạm hơn cây lấy củ, quả.", "d) Bón thừa đạm làm tăng chất lượng nông sản."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: do đạm linh động. b) Đúng: thừa đạm kéo dài sinh trưởng sinh dưỡng. c) Đúng: rau ăn lá thu hoạch thân lá nên cần nhiều đạm. d) Sai: thừa đạm làm giảm chất lượng (tích lũy nitrat, dễ dập nát).", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 2 biểu hiện của cây trồng khi bị thiếu đạm.", "answer": "cây còi cọc, lá vàng úa", "explain": "Thiếu đạm: cây còi cọc, sinh trưởng kém, lá vàng úa (vàng từ lá già).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 2 tác hại của việc bón thừa đạm cho cây trồng.", "answer": "cây tốt lốp dễ đổ ngã, dễ nhiễm sâu bệnh", "explain": "Thừa đạm: cây tốt lốp, dễ đổ ngã, dễ nhiễm sâu bệnh, chậm ra hoa kết quả, giảm chất lượng nông sản.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Vai trò chính của lân (P) đối với cây trồng là gì?", "options": ["A. Kích thích phát triển bộ rễ, đẻ nhánh, ra hoa, đậu quả; làm hạt chắc.", "B. Kích thích sinh trưởng thân, lá.", "C. Tăng độ ngọt của quả.", "D. Diệt trừ sâu bệnh hại rễ."], "answer": "A", "explain": "Lân thúc đẩy phát triển rễ, phân cành, ra hoa, đậu quả, giúp hạt chắc và chín sớm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi cây thiếu lân, biểu hiện đặc trưng trên lá là gì?", "options": ["A. Lá có màu xanh đậm ngả tím đỏ.", "B. Lá vàng úa từ gốc lên.", "C. Mép lá cháy khô.", "D. Lá bị thủng lỗ."], "answer": "A", "explain": "Thiếu lân làm tích lũy sắc tố anthocyanin khiến lá xanh đậm ngả màu tím đỏ, đây là dấu hiệu đặc trưng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giai đoạn nào của cây trồng cần được cung cấp đầy đủ lân nhất?", "options": ["A. Giai đoạn cây con (phát triển rễ) và giai đoạn ra hoa, đậu quả.", "B. Giai đoạn thu hoạch.", "C. Giai đoạn cây ngủ nghỉ.", "D. Mọi giai đoạn đều như nhau, không có giai đoạn đặc biệt."], "answer": "A", "explain": "Lân cần nhiều cho phát triển rễ ở cây con và cho ra hoa, đậu quả, tạo hạt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phân lân thường được dùng để bón lót?", "options": ["A. Vì lân ít di động trong đất, cần bón sớm, bón sâu để rễ cây hấp thu được.", "B. Vì lân dễ bay hơi nên phải vùi sâu.", "C. Vì lân chỉ có tác dụng khi bón lót.", "D. Vì bón thúc lân làm cháy lá."], "answer": "A", "explain": "Lân di chuyển kém trong đất nên bón lót (bón sâu, bón sớm) giúp phân nằm trong tầng rễ, cây hấp thu hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cây lúa thiếu lân thường có biểu hiện nào sau đây?", "options": ["A. Đẻ nhánh kém, rễ ngắn, lá ngả tím, chín muộn.", "B. Lá vàng úa, cây cao vống.", "C. Mép lá cháy khô, hạt lép.", "D. Thân cây mềm, dễ đổ ngay từ đầu vụ."], "answer": "A", "explain": "Đây là các biểu hiện điển hình của thiếu lân ở lúa: rễ kém, đẻ nhánh ít, lá tím, chín muộn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vườn cà chua ra hoa nhiều nhưng đậu quả ít, rễ cây phát triển kém. Nguyên nhân có thể là gì và nên bón loại phân nào?", "options": ["A. Thiếu lân, nên bón bổ sung phân lân (supe lân).", "B. Thiếu đạm, nên bón urê.", "C. Thừa kali, nên ngừng bón kali.", "D. Thiếu nước, chỉ cần tưới thêm."], "answer": "A", "explain": "Rễ kém, đậu quả ít là dấu hiệu thiếu lân; cần bổ sung phân lân để kích thích ra rễ, ra hoa, đậu quả.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về vai trò của lân:", "statements": ["a) Lân kích thích sự phát triển của bộ rễ cây trồng.", "b) Lân giúp cây ra hoa, đậu quả và làm hạt chắc.", "c) Thiếu lân làm lá cây có màu tím đỏ.", "d) Lân có vai trò chính là kích thích sinh trưởng thân, lá."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: vai trò quan trọng của lân. c) Đúng: biểu hiện đặc trưng khi thiếu lân. d) Sai: đó là vai trò của đạm, không phải lân.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về vai trò của lân:", "statements": ["a) Bón đủ lân giúp cây ra rễ mạnh nên thường dùng bón lót.", "b) Cây thiếu lân thường chín muộn hơn bình thường.", "c) Lân di chuyển rất nhanh trong đất nên nên bón thúc nhiều lần.", "d) Supe lân là phân đơn cung cấp lân cho cây."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: thiếu lân làm chậm quá trình sinh trưởng, chín muộn. c) Sai: lân ít di động trong đất nên bón lót là chính. d) Đúng: supe lân chỉ chứa P.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 2 vai trò chính của lân đối với cây trồng.", "answer": "phát triển bộ rễ, ra hoa đậu quả", "explain": "Lân kích thích phát triển bộ rễ, đẻ nhánh, ra hoa, đậu quả, làm hạt chắc, chín sớm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cây thiếu lân có biểu hiện đặc trưng nào trên lá?", "answer": "lá có màu xanh đậm ngả tím đỏ", "explain": "Thiếu lân: lá xanh đậm ngả màu tím đỏ do tích lũy anthocyanin; kèm theo còi cọc, rễ kém.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Vai trò chính của kali (K) đối với cây trồng là gì?", "options": ["A. Tăng khả năng chống chịu, thúc đẩy vận chuyển chất hữu cơ, nâng cao chất lượng nông sản.", "B. Kích thích sinh trưởng thân, lá.", "C. Kích thích phát triển bộ rễ.", "D. Diệt trừ nấm bệnh trong đất."], "answer": "A", "explain": "Kali tăng khả năng chống chịu hạn, rét, sâu bệnh; vận chuyển chất hữu cơ về củ, quả, hạt; tăng chất lượng (ngọt, thơm, chắc hạt).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi cây thiếu kali, biểu hiện đặc trưng trên lá là gì?", "options": ["A. Mép lá vàng rồi cháy khô.", "B. Lá vàng úa toàn bộ từ gốc lên.", "C. Lá ngả màu tím đỏ.", "D. Lá bị xoăn do virus."], "answer": "A", "explain": "Thiếu kali: mép lá vàng rồi cháy khô (cháy bìa lá), đây là dấu hiệu đặc trưng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Loại cây trồng nào cần được cung cấp nhiều kali nhất?", "options": ["A. Cây lấy củ, quả, hạt (khoai, sắn, mía, cây ăn quả).", "B. Rau ăn lá.", "C. Cây lấy thân gỗ.", "D. Cây hoa cảnh chơi lá."], "answer": "A", "explain": "Kali thúc đẩy vận chuyển chất hữu cơ về củ, quả, hạt và tăng chất lượng nên cây lấy củ, quả, đường cần nhiều kali.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao kali được gọi là \"nguyên tố chất lượng\"?", "options": ["A. Vì kali làm tăng chất lượng nông sản: quả ngọt, thơm, hạt chắc, củ to.", "B. Vì kali làm cây cao to nhanh nhất.", "C. Vì kali rẻ tiền nhất.", "D. Vì kali diệt được sâu bệnh."], "answer": "A", "explain": "Kali thúc đẩy vận chuyển và tích lũy chất hữu cơ nên nâng cao chất lượng nông sản rõ rệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bón đủ kali giúp cây trồng chống chịu tốt hơn với điều kiện nào?", "options": ["A. Hạn, rét và sâu bệnh.", "B. Ngập úng kéo dài.", "C. Đất nhiễm mặn nặng.", "D. Mọi điều kiện bất lợi mà không cần biện pháp khác."], "answer": "A", "explain": "Kali điều tiết nước trong cây, làm cây cứng cáp nên tăng khả năng chống chịu hạn, rét và sâu bệnh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vườn cam có hiện tượng mép lá cháy khô, quả nhỏ, vị nhạt. Chẩn đoán và biện pháp đúng là gì?", "options": ["A. Thiếu kali, cần bón bổ sung phân kali (kali clorua).", "B. Thiếu đạm, cần bón urê.", "C. Thiếu lân, cần bón supe lân.", "D. Bị bệnh cháy lá, cần phun thuốc."], "answer": "A", "explain": "Cháy mép lá, quả nhỏ là dấu hiệu điển hình thiếu kali; cần bổ sung phân kali.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về vai trò của kali:", "statements": ["a) Kali giúp cây tăng khả năng chống chịu hạn, rét, sâu bệnh.", "b) Kali thúc đẩy vận chuyển chất hữu cơ về củ, quả, hạt.", "c) Thiếu kali làm mép lá vàng rồi cháy khô.", "d) Kali có vai trò chính là kích thích ra hoa, đậu quả."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: biểu hiện đặc trưng. d) Sai: đó là vai trò của lân.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về thiếu và thừa kali:", "statements": ["a) Cây mía, khoai lang cần bón nhiều kali để tăng năng suất, chất lượng.", "b) Thiếu kali làm quả nhỏ, hạt lép.", "c) Kali clorua là phân đơn cung cấp kali.", "d) Bón thừa kali không bao giờ gây hại cho cây."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: cây lấy đường, củ cần nhiều kali. b) Đúng. c) Đúng: KCl chỉ chứa K. d) Sai: thừa kali cản trở hấp thu magie, canxi, vẫn có hại.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 2 vai trò chính của kali đối với cây trồng.", "answer": "tăng khả năng chống chịu, nâng cao chất lượng nông sản", "explain": "Kali: tăng khả năng chống chịu (hạn, rét, sâu bệnh), thúc đẩy vận chuyển chất hữu cơ, nâng cao chất lượng nông sản.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu biểu hiện đặc trưng trên lá khi cây thiếu kali.", "answer": "mép lá vàng rồi cháy khô", "explain": "Thiếu kali: mép lá vàng rồi cháy khô (cháy bìa lá); quả nhỏ, hạt lép, cây dễ đổ.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Ba nguyên tố dinh dưỡng đa lượng cây trồng cần nhiều nhất là gì?", "options": ["A. Đạm (N), lân (P), kali (K).", "B. Canxi (Ca), magie (Mg), lưu huỳnh (S).", "C. Sắt (Fe), kẽm (Zn), đồng (Cu).", "D. Cacbon (C), hidro (H), oxi (O)."], "answer": "A", "explain": "N, P, K là 3 nguyên tố đa lượng cây cần với lượng lớn nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây lúa vàng lá từ gốc lên, còi cọc là biểu hiện thiếu nguyên tố nào?", "options": ["A. Đạm (N).", "B. Lân (P).", "C. Kali (K).", "D. Canxi (Ca)."], "answer": "A", "explain": "Vàng lá từ lá già, cây còi cọc là biểu hiện điển hình của thiếu đạm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lá cây ngả màu tím đỏ là biểu hiện thiếu nguyên tố nào?", "options": ["A. Lân (P).", "B. Đạm (N).", "C. Kali (K).", "D. Magie (Mg)."], "answer": "A", "explain": "Thiếu lân làm tích lũy anthocyanin khiến lá có màu tím đỏ đặc trưng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mép lá bị cháy khô, quả nhỏ, hạt lép là biểu hiện thiếu nguyên tố nào?", "options": ["A. Kali (K).", "B. Đạm (N).", "C. Lân (P).", "D. Sắt (Fe)."], "answer": "A", "explain": "Cháy mép lá là dấu hiệu đặc trưng của thiếu kali.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cây trồng \"tốt lốp\", dễ đổ ngã, dễ nhiễm sâu bệnh là hậu quả của việc nào?", "options": ["A. Bón thừa đạm.", "B. Bón thiếu lân.", "C. Bón thiếu kali.", "D. Không bón phân hữu cơ."], "answer": "A", "explain": "Thừa đạm kích thích sinh trưởng thân lá quá mức làm cây yếu, dễ đổ và dễ nhiễm sâu bệnh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Quan sát 3 ruộng lúa: ruộng A lá vàng từ gốc, ruộng B lá tím đỏ, ruộng C mép lá cháy khô. Thứ tự thiếu dinh dưỡng đúng là gì?", "options": ["A. A thiếu đạm, B thiếu lân, C thiếu kali.", "B. A thiếu lân, B thiếu kali, C thiếu đạm.", "C. A thiếu kali, B thiếu đạm, C thiếu lân.", "D. Cả ba ruộng đều thiếu đạm."], "answer": "A", "explain": "Vàng lá từ gốc là thiếu đạm; lá tím đỏ là thiếu lân; cháy mép lá là thiếu kali.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về các nguyên tố đa lượng:", "statements": ["a) N, P, K là các nguyên tố dinh dưỡng đa lượng.", "b) Thiếu đạm làm lá cây vàng úa, cây còi cọc.", "c) Thiếu lân làm lá cây có màu tím đỏ.", "d) Thiếu kali làm lá cây vàng toàn bộ từ gốc lên."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: vàng toàn bộ từ gốc lên là thiếu đạm; thiếu kali cháy mép lá.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về bón phân cân đối:", "statements": ["a) Bón thừa đạm làm cây tốt lốp, dễ đổ ngã.", "b) Cây thiếu lân thường đẻ nhánh kém và chín muộn.", "c) Bón đủ kali giúp quả ngọt hơn, hạt chắc hơn.", "d) Chỉ cần bón đủ đạm là cây cho năng suất tối đa, không cần lân, kali."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: kali nâng cao chất lượng. d) Sai: cây cần cân đối cả N, P, K và các nguyên tố khác.", "points": 1}, {"type": "short", "level": "VDC", "q": "Viết kí hiệu hóa học của 3 nguyên tố dinh dưỡng đa lượng.", "answer": "N, P, K", "explain": "Ba nguyên tố đa lượng: đạm (N), lân (P), kali (K).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu nguyên tắc chung khi bón phân đạm, lân, kali cho cây trồng. (Gợi ý: đủ và cân đối)", "answer": "bón đủ và cân đối, tránh thiếu và tránh thừa", "explain": "Cần bón đủ và cân đối các nguyên tố N, P, K theo nhu cầu từng loại cây, từng giai đoạn; thiếu làm giảm năng suất, thừa gây hại và lãng phí.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Phân loại nào sau đây là phân loại theo thành phần dinh dưỡng?", "options": ["A. Phân đơn, phân phức hợp, phân hỗn hợp.", "B. Phân hữu cơ, phân vô cơ, phân vi sinh.", "C. Phân bón lót, phân bón thúc.", "D. Phân bón lá, phân bón gốc."], "answer": "A", "explain": "Theo thành phần dinh dưỡng: phân đơn, phân phức hợp, phân hỗn hợp. Theo nguồn gốc: hữu cơ, vô cơ, vi sinh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các loại phân sau, loại nào vừa cung cấp dinh dưỡng vừa cải tạo đất tốt nhất?", "options": ["A. Phân hữu cơ hoai mục.", "B. Urê.", "C. Kali clorua.", "D. Supe lân."], "answer": "A", "explain": "Phân hữu cơ hoai mục vừa cung cấp dinh dưỡng vừa làm đất tơi xốp, tăng độ phì nhiêu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tố nào tham gia cấu tạo diệp lục, giúp lá cây xanh tốt?", "options": ["A. Đạm (N).", "B. Lân (P).", "C. Kali (K).", "D. Canxi (Ca)."], "answer": "A", "explain": "Đạm là thành phần của diệp lục nên đủ đạm lá xanh tốt; thiếu đạm lá vàng úa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao trong sản xuất nông nghiệp bền vững, người ta khuyến khích kết hợp phân hữu cơ, phân vô cơ và phân vi sinh?", "options": ["A. Vì kết hợp hài hòa vừa đảm bảo năng suất nhanh vừa cải tạo đất, bảo vệ môi trường.", "B. Vì dùng một loại phân sẽ làm cây chết.", "C. Vì phân hữu cơ rẻ hơn phân vô cơ.", "D. Vì phân vi sinh thay thế được hoàn toàn phân vô cơ."], "answer": "A", "explain": "Phân vô cơ cho tác dụng nhanh; hữu cơ và vi sinh cải tạo đất, bảo vệ môi trường; kết hợp cho hiệu quả bền vững.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một nông dân chỉ bón urê cho ruộng lúa nhiều vụ liên tiếp mà không bón lân, kali. Hậu quả có thể xảy ra là gì?", "options": ["A. Đất mất cân đối dinh dưỡng, lúa tốt lốp, dễ đổ, năng suất giảm dần.", "B. Lúa cho năng suất ngày càng cao.", "C. Đất ngày càng tơi xốp.", "D. Không có hậu quả gì."], "answer": "A", "explain": "Chỉ bón đạm gây mất cân đối N-P-K: cây tốt lốp, dễ đổ, sâu bệnh, đất suy kiệt lân, kali.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Để trồng rau an toàn, người ta hạn chế bón thừa phân đạm hóa học. Lí do chính là gì?", "options": ["A. Thừa đạm làm rau tích lũy nitrat gây hại sức khỏe người ăn.", "B. Thừa đạm làm rau không lớn được.", "C. Thừa đạm làm đất quá tơi xốp.", "D. Thừa đạm làm rau mất màu xanh."], "answer": "A", "explain": "Bón thừa đạm khiến cây tích lũy nitrat (NO3-) trong lá; người ăn nhiều nitrat có hại cho sức khỏe.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về sử dụng phân bón hợp lí:", "statements": ["a) Phân hữu cơ có tác dụng chậm nhưng bền và cải tạo đất.", "b) Phân vô cơ có hàm lượng dinh dưỡng cao, tác dụng nhanh.", "c) Phân vi sinh chứa vi sinh vật có ích, thân thiện môi trường.", "d) Cả ba loại phân trên đều cung cấp chất dinh dưỡng cho cây."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: đây là điểm chung của mọi loại phân bón.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Một học sinh đưa ra các kết luận sau khi quan sát vườn rau, xét tính đúng, sai:", "statements": ["a) Rau vàng lá, còi cọc có thể do thiếu đạm.", "b) Rau chỉ bón phân chuồng mà xanh tốt chứng tỏ không cần phân vô cơ trong mọi trường hợp.", "c) Bón phân cân đối N, P, K giúp rau sinh trưởng tốt, ít sâu bệnh.", "d) Phân vi sinh có thể dùng để giảm bớt phân hóa học mà vẫn đảm bảo năng suất."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: biểu hiện thiếu đạm. b) Sai: tùy loại đất và cây trồng, nhiều trường hợp vẫn cần bổ sung phân vô cơ. c) Đúng. d) Đúng: xu hướng canh tác bền vững.", "points": 1}, {"type": "short", "level": "VDC", "q": "Hoàn thành câu: \"Phân bón cung cấp ... cho cây trồng, làm tăng ... của đất.\"", "answer": "chất dinh dưỡng, độ phì nhiêu", "explain": "Câu đầy đủ: \"Phân bón cung cấp chất dinh dưỡng cho cây trồng, làm tăng độ phì nhiêu của đất.\"", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu tên 1 loại phân đơn cung cấp đạm, 1 loại cung cấp lân và 1 loại cung cấp kali.", "answer": "urê, supe lân, kali clorua", "explain": "Phân đơn cung cấp đạm: urê; cung cấp lân: supe lân; cung cấp kali: kali clorua.", "points": 0.5}]}]}
