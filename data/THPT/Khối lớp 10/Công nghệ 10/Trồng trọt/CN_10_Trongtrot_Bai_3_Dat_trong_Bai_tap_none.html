 ẩm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vi sinh vật đất có vai trò gì?", "options": ["A. Cố định đạm, phân giải chất hữu cơ làm giàu dinh dưỡng", "B. Ăn rễ cây", "C. Gây úng đất", "D. Không có vai trò"], "answer": "A", "explain": "Vi khuẩn cố định đạm, vi sinh phân giải hữu cơ biến xác sinh vật thành dinh dưỡng cây dùng được.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao đất đỏ bazan Tây Nguyên trồng cà phê rất tốt?", "options": ["A. Vì đất bazan tơi xốp, giàu dinh dưỡng, thoát nước tốt", "B. Vì đất bazan rất chua", "C. Vì đất bazan nhiễm mặn", "D. Vì đất bazan toàn đá"], "answer": "A", "explain": "Bazan phong hóa từ đá núi lửa: tơi xốp, giàu khoáng, thoát nước — lí tưởng cho cà phê, hồ tiêu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đất nhiễm mặn gây hại cho cây trồng như thế nào?", "options": ["A. Muối làm cây khó hút nước, gây héo, chết cây", "B. Muối giúp cây tốt hơn", "C. Muối không ảnh hưởng", "D. Muối thay thế phân bón"], "answer": "A", "explain": "Nồng độ muối cao làm giảm khả năng hút nước của rễ (hạn sinh lí), gây ngộ độc muối.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vùng ven biển muốn trồng rừng phòng hộ. Loại đất và cây nào phù hợp?", "options": ["A. Đất cát ven biển; trồng phi lao chắn cát, chắn gió", "B. Đất phèn; trồng lúa", "C. Đất mặn; trồng cà phê", "D. Đất bazan; trồng chè"], "answer": "A", "explain": "Ven biển đất cát: phi lao chịu cát, chắn gió, cố định cát bay — đúng cây đúng đất.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thành phần cơ giới là tỉ lệ cát, limon, sét.", "b) Đất feralit phân bố ở trung du, miền núi.", "c) Vi sinh vật đất giúp làm giàu dinh dưỡng.", "d) Đất đỏ bazan thích hợp trồng cà phê, hồ tiêu."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về đất mặn:", "statements": ["a) Đất mặn phân bố chủ yếu ở vùng ven biển.", "b) Muối làm cây khó hút nước, dễ héo.", "c) Cần rửa mặn, chọn cây chịu mặn khi canh tác.", "d) Đất mặn rất màu mỡ, trồng cây gì cũng tốt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đất mặn gây hại, cần cải tạo mới canh tác được.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu ba tính chất hóa học quan trọng của đất trồng.", "answer": "Độ chua (pH), độ mặn, hàm lượng dinh dưỡng (chấp nhận: khả năng hấp phụ)", "explain": "Tính chất hóa học: độ chua pH, độ mặn, chất dinh dưỡng (N, P, K...), khả năng hấp phụ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích vì sao đất úng nước làm rễ cây bị thối.", "answer": "Ngập úng đuổi hết không khí, rễ thiếu ôxi để hô hấp nên thối (chấp nhận ý tương đương)", "explain": "Rễ cần ôxi hô hấp; úng lâu ngày đất yếm khí, rễ chết, thối, cây vàng héo.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Cấu trúc đất tốt cho cây trồng là cấu trúc nào?", "options": ["A. Cấu trúc viên, tơi xốp, thoáng khí", "B. Cấu trúc tảng lớn, cứng chắc", "C. Đất bị nén chặt", "D. Đất toàn đá sỏi"], "answer": "A", "explain": "Cấu trúc viên: các hạt kết thành viên nhỏ, tơi xốp — vừa giữ nước vừa thoáng khí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đất phèn phân bố chủ yếu ở đâu?", "options": ["A. Đồng bằng sông Cửu Long", "B. Tây Nguyên", "C. Đồng bằng sông Hồng", "D. Vùng núi cao"], "answer": "A", "explain": "Đất phèn tập trung ở ĐBSCL (Đồng Tháp Mười, tứ giác Long Xuyên...) — chua, độc, cần cải tạo.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khả năng hấp phụ của đất có ý nghĩa gì?", "options": ["A. Giữ chất dinh dưỡng ở dạng ion để cung cấp dần cho cây", "B. Hút hết nước của cây", "C. Làm đất cứng lại", "D. Không có ý nghĩa"], "answer": "A", "explain": "Keo đất hấp phụ ion dinh dưỡng, nhả dần cho rễ — đất giàu keo (sét, mùn) giữ phân tốt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao đất nhiều mùn thường có màu nâu đen và tơi xốp?", "options": ["A. Vì mùn là chất hữu cơ phân hủy, vừa giàu dinh dưỡng vừa cải thiện cấu trúc", "B. Vì đất bị cháy", "C. Vì đất nhiễm độc", "D. Vì đất thiếu nước"], "answer": "A", "explain": "Mùn màu sẫm, kết dính hạt đất thành viên, tăng độ xốp — đất giàu mùn màu mỡ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đất xám ở Đông Nam Bộ có đặc điểm gì?", "options": ["A. Nghèo dinh dưỡng, cần bón phân nhiều khi trồng cây công nghiệp", "B. Rất màu mỡ tự nhiên", "C. Ngập úng quanh năm", "D. Nhiễm mặn nặng"], "answer": "A", "explain": "Đất xám bạc màu, nghèo dinh dưỡng — trồng cao su, điều cần bón phân đầy đủ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai mẫu đất: A tơi xốp, nhiều giun; B bí chặt, không có giun. Nhận xét nào đúng?", "options": ["A. Đất A màu mỡ hơn đất B", "B. Đất B tốt hơn đất A", "C. Hai đất như nhau", "D. Không thể nhận xét"], "answer": "A", "explain": "Giun đất chỉ sống ở đất tơi xốp, giàu hữu cơ — là chỉ thị sinh học của đất tốt.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cấu trúc viên giúp đất tơi xốp, thoáng khí.", "b) Đất phèn tập trung ở Đồng bằng sông Cửu Long.", "c) Keo đất hấp phụ dinh dưỡng cung cấp dần cho cây.", "d) Đất xám Đông Nam Bộ nghèo dinh dưỡng."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về đánh giá đất:", "statements": ["a) Nhiều giun đất là dấu hiệu đất tơi xốp, màu mỡ.", "b) Đất màu nâu đen thường giàu mùn.", "c) Đất bí chặt, đọng nước lâu là đất xấu.", "d) Chỉ cần nhìn màu đất là đủ đánh giá mọi tính chất."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần kiểm tra pH, dinh dưỡng, cơ giới... mới đánh giá đầy đủ.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên 6 loại đất chính ở Việt Nam và nơi phân bố mỗi loại.", "answer": "Phù sa (đồng bằng), feralit (đồi núi), xám (Đông Nam Bộ), phèn (ĐBSCL), mặn (ven biển), cát (duyên hải miền Trung)", "explain": "6 loại: phù sa, feralit, xám, phèn, mặn, cát ven biển.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai cách nhận biết đất giàu mùn bằng quan sát trực tiếp.", "answer": "Màu nâu đen; tơi xốp, có giun đất (chấp nhận: mùi đất thơm, giữ ẩm tốt)", "explain": "Đất giàu mùn: màu sẫm nâu đen, tơi xốp, ẩm, nhiều giun và sinh vật đất.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Đất được hình thành chủ yếu từ quá trình nào?", "options": ["A. Phong hóa đá và tích lũy chất hữu cơ trong thời gian dài", "B. Nung nóng đột ngột", "C. Đổ bê tông", "D. Khai thác mỏ"], "answer": "A", "explain": "Đá phong hóa vụn ra + xác sinh vật tích lũy, phân hủy thành mùn qua hàng nghìn năm tạo đất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong phần rắn của đất, chất vô cơ chiếm tỉ lệ khoảng bao nhiêu?", "options": ["A. 92–98% khối lượng phần rắn", "B. 5–10%", "C. 50%", "D. 1–2%"], "answer": "A", "explain": "Chất vô cơ (cát, limon, sét, khoáng) chiếm 92–98% khối lượng phần rắn; hữu cơ chỉ 2–8%.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Độ chua của đất được đo bằng chỉ tiêu nào?", "options": ["A. pH", "B. Nhiệt độ", "C. Độ ẩm", "D. Màu sắc"], "answer": "A", "explain": "pH đo độ chua/kiềm: dưới 6,5 chua; 6,5–7,5 trung tính; trên 7,5 kiềm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao đất dốc dễ bị xói mòn hơn đất bằng?", "options": ["A. Vì nước mưa chảy mạnh cuốn trôi lớp đất mặt màu mỡ", "B. Vì đất dốc không có cây", "C. Vì đất dốc quá tốt", "D. Vì đất bằng không bị mưa"], "answer": "A", "explain": "Dốc làm dòng chảy mặt mạnh, cuốn trôi mùn và dinh dưỡng lớp mặt — cần trồng theo đường đồng mức.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cây trồng bị thiếu đạm (N) thường có biểu hiện gì?", "options": ["A. Còi cọc, vàng lá, sinh trưởng kém", "B. Xanh đậm bất thường", "C. Ra hoa sớm", "D. Không biểu hiện"], "answer": "A", "explain": "Đạm cần cho sinh trưởng; thiếu đạm cây còi, lá vàng (từ lá già), đẻ nhánh kém.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vườn cây ăn quả trên đất dốc bị rửa trôi mạnh sau mưa. Giải pháp tổng hợp nào đúng?", "options": ["A. Trồng cỏ che phủ, làm đường đồng mức, bón hữu cơ", "B. Cày xới đất dốc thật kĩ", "C. Để đất trống", "D. Bón thật nhiều phân hóa học"], "answer": "A", "explain": "Che phủ + đồng mức giữ đất; hữu cơ cải thiện cấu trúc — tổng hợp chống xói mòn.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đất hình thành do phong hóa đá và tích lũy hữu cơ.", "b) Chất vô cơ chiếm 92–98% khối lượng phần rắn.", "c) pH là chỉ tiêu đo độ chua của đất.", "d) Thiếu đạm làm cây còi cọc, vàng lá."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về chống xói mòn:", "statements": ["a) Trồng theo đường đồng mức giúp giữ đất.", "b) Che phủ đất bằng cỏ, rơm rạ hạn chế xói mòn.", "c) Bón phân hữu cơ giúp đất kết cấu tốt, ít bị rửa trôi.", "d) Cày xới đất dốc theo chiều dốc giúp chống xói mòn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cày theo chiều dốc làm xói mòn nặng thêm; phải cày ngang dốc.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu ba nguyên tố dinh dưỡng đa lượng cây cần nhiều nhất và vai trò mỗi loại.", "answer": "Đạm (sinh trưởng), lân (rễ, hoa quả), kali (cứng cây, chất lượng) (chấp nhận ý tương đương)", "explain": "N: sinh trưởng thân lá. P: phát triển rễ, ra hoa, đậu quả. K: cứng cây, tăng chất lượng, chống chịu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao đất dốc cần được che phủ thực vật?", "answer": "Hạn chế xói mòn do mưa, giữ đất màu và độ ẩm (chấp nhận ý tương đương)", "explain": "Tán lá và rễ giữ đất, làm chậm dòng chảy — chống rửa trôi lớp đất mặt màu mỡ.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Limon trong đất là gì?", "options": ["A. Hạt đất có kích thước trung gian giữa cát và sét", "B. Một loại phân bón", "C. Một loại thuốc trừ sâu", "D. Một loại cây trồng"], "answer": "A", "explain": "Limon (bụi): hạt trung gian cát – sét; đất nhiều limon (phù sa) màu mỡ, giữ nước tốt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đất kiềm có pH trong khoảng nào?", "options": ["A. Trên 7,5", "B. Dưới 6,5", "C. Bằng 7", "D. Bằng 0"], "answer": "A", "explain": "pH trên 7,5 là đất kiềm; đa số cây thích pH 6–7 nên đất kiềm mạnh cần cải tạo.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chất hữu cơ trong đất chủ yếu tồn tại ở dạng nào có ích cho cây?", "options": ["A. Mùn", "B. Đá cuội", "C. Cát thô", "D. Sỏi"], "answer": "A", "explain": "Mùn là chất hữu cơ đã phân hủy ổn định, giàu dinh dưỡng, cải tạo cấu trúc đất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao đất phù sa ven sông thường màu mỡ?", "options": ["A. Vì được bồi đắp phù sa mới giàu dinh dưỡng hằng năm", "B. Vì không ai canh tác", "C. Vì đất bị ngập", "D. Vì đất toàn cát"], "answer": "A", "explain": "Mỗi mùa lũ, sông bồi lớp phù sa mới giàu khoáng, hữu cơ — đất luôn được 'bón phân' tự nhiên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi đất thiếu kali (K), cây trồng thường biểu hiện gì?", "options": ["A. Mép lá cháy khô, cây yếu, dễ đổ ngã", "B. Lá xanh đậm", "C. Quả chín sớm", "D. Không biểu hiện"], "answer": "A", "explain": "Kali giúp cứng cây, vận chuyển chất; thiếu K mép lá vàng cháy, cây mềm yếu, quả kém chất lượng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Muốn cải thiện đất cát ven biển để trồng lạc, biện pháp nào hiệu quả nhất?", "options": ["A. Bón nhiều phân hữu cơ, trồng cây chắn gió, tưới giữ ẩm", "B. Nén chặt đất cát", "C. Đổ thêm cát", "D. Bỏ hoang"], "answer": "A", "explain": "Hữu cơ tăng giữ nước, giữ phân; chắn gió chống cát bay; tưới giữ ẩm — tổng hợp cải tạo đất cát.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Limon là hạt đất trung gian giữa cát và sét.", "b) Đất kiềm có pH trên 7,5.", "c) Mùn là dạng hữu cơ có ích cho cây.", "d) Phù sa được bồi đắp hằng năm nên đất màu mỡ."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các biện pháp cải tạo đất cát:", "statements": ["a) Bón phân hữu cơ giúp đất cát giữ nước, giữ phân tốt hơn.", "b) Trồng cây chắn gió hạn chế cát bay.", "c) Tưới giữ ẩm thường xuyên cho đất cát.", "d) Nén chặt đất cát sẽ giúp giữ nước tốt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nén chặt làm đất bí, rễ khó phát triển; cần tơi xốp + hữu cơ.", "points": 1}, {"type": "short", "level": "VDC", "q": "So sánh đất feralit và đất phù sa (nơi phân bố, độ phì).", "answer": "Feralit: đồi núi, chua nghèo; phù sa: đồng bằng, màu mỡ", "explain": "Feralit ở trung du, miền núi, chua, nghèo dinh dưỡng. Phù sa ở đồng bằng, được bồi đắp, màu mỡ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai dấu hiệu nhận biết cây thiếu kali.", "answer": "Mép lá cháy khô; cây yếu, dễ đổ ngã (chấp nhận: quả nhỏ, kém chất lượng)", "explain": "Thiếu K: mép lá vàng rồi cháy khô, thân yếu, dễ đổ, quả nhỏ, nhạt.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Đất trung tính có pH trong khoảng nào?", "options": ["A. Khoảng 6,5–7,5", "B. Dưới 4", "C. Trên 9", "D. Bằng 1"], "answer": "A", "explain": "pH 6,5–7,5 là trung tính — khoảng pH lí tưởng cho đa số cây trồng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tố nào giúp cây phát triển rễ, ra hoa, đậu quả?", "options": ["A. Lân (P)", "B. Sắt", "C. Clo", "D. Natri"], "answer": "A", "explain": "Lân (P) cần cho phát triển rễ, ra hoa, đậu quả, chín sớm; thiếu lân cây còi, lá tím đỏ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đất nào sau đây cần được cải tạo trước khi trồng trọt?", "options": ["A. Đất phèn chua, đất mặn, đất bạc màu", "B. Đất phù sa màu mỡ", "C. Đất thịt tơi xốp", "D. Đất giàu mùn"], "answer": "A", "explain": "Đất phèn, mặn, bạc màu có tính chất xấu — phải cải tạo (bón vôi, rửa mặn, bón hữu cơ) mới canh tác hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao sau mỗi vụ lúa, nông dân thường cày ải, phơi đất?", "options": ["A. Để diệt mầm bệnh, cỏ dại và làm đất tơi xốp", "B. Để đất cứng lại", "C. Để diệt giun đất", "D. Không có tác dụng"], "answer": "A", "explain": "Cày ải phơi đất: nắng diệt mầm bệnh, trứng sâu, cỏ dại; đất tơi xốp, tăng thoáng khí cho vụ sau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cây thiếu lân (P) thường có biểu hiện gì?", "options": ["A. Còi cọc, lá có màu tím đỏ, rễ kém phát triển", "B. Lá xanh mướt", "C. Ra hoa nhiều", "D. Quả to nhanh"], "answer": "A", "explain": "Thiếu lân: sinh trưởng chậm, lá tím đỏ (tích anthocyanin), rễ yếu, chín muộn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một khu đất trống bị chai cứng sau nhiều năm bỏ hoang. Muốn trồng rau, bước đầu tiên nên làm gì?", "options": ["A. Cày xới tơi, bón phân hữu cơ cải tạo cấu trúc đất", "B. Gieo hạt ngay không cần làm gì", "C. Đổ bê tông lên mặt đất", "D. Tưới nước mặn"], "answer": "A", "explain": "Đất chai cứng cần cày xới + hữu cơ để tơi xốp, tăng mùn — tạo nền trước khi gieo trồng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đất trung tính có pH khoảng 6,5–7,5.", "b) Lân giúp cây phát triển rễ, ra hoa, đậu quả.", "c) Đất phèn, đất mặn cần cải tạo trước khi trồng.", "d) Cày ải phơi đất giúp diệt mầm bệnh, làm đất tơi xốp."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về thiếu dinh dưỡng:", "statements": ["a) Thiếu lân làm lá có màu tím đỏ.", "b) Thiếu đạm làm cây còi cọc, vàng lá.", "c) Thiếu kali làm mép lá cháy khô.", "d) Thiếu dinh dưỡng không ảnh hưởng đến năng suất."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: triệu chứng thiếu N, P, K điển hình. d) Sai: thiếu dinh dưỡng giảm mạnh năng suất.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai lợi ích của việc cày ải, phơi đất sau vụ thu hoạch.", "answer": "Diệt mầm bệnh, cỏ dại; làm đất tơi xốp (chấp nhận: tăng thoáng khí, vùi gốc rạ)", "explain": "Phơi ải: nắng diệt sâu bệnh, cỏ dại; đất tơi, thoáng; vùi gốc rạ tăng hữu cơ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao đất phèn, đất mặn không thể trồng ngay mà cần cải tạo?", "answer": "Vì chua độc / nhiễm mặn gây hại cây, cần khử chua, rửa mặn trước (chấp nhận ý tương đương)", "explain": "Phèn chua, chứa độc tố (Al, Fe); mặn gây hạn sinh lí — trồng ngay cây chết, phải cải tạo.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Tính chất vật lí của đất bao gồm những gì?", "options": ["A. Thành phần cơ giới, cấu trúc, độ xốp, giữ và thoát nước", "B. Độ chua, độ mặn", "C. Vi sinh vật, giun đất", "D. Màu sắc hoa quả"], "answer": "A", "explain": "Tính chất vật lí: cơ giới (cát, limon, sét), cấu trúc, độ xốp, khả năng giữ/thoát nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tính chất sinh học của đất thể hiện ở yếu tố nào?", "options": ["A. Vi sinh vật và động vật sống trong đất", "B. Hàm lượng cát", "C. Độ pH", "D. Màu của đất"], "answer": "A", "explain": "Sinh học = sinh vật đất: vi khuẩn cố định đạm, vi sinh phân giải hữu cơ, giun đất...", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đất bazan ở Tây Nguyên hình thành từ loại đá nào?", "options": ["A. Đá bazan (đá núi lửa)", "B. Đá vôi", "C. Đá cát kết", "D. Đá granit"], "answer": "A", "explain": "Đất đỏ bazan phong hóa từ đá bazan núi lửa — giàu khoáng, tơi xốp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao đất giàu mùn có khả năng giữ phân bón tốt?", "options": ["A. Vì mùn và keo đất hấp phụ ion dinh dưỡng, nhả dần cho cây", "B. Vì mùn đẩy phân ra ngoài", "C. Vì mùn không tan", "D. Vì mùn làm đất cứng"], "answer": "A", "explain": "Keo mùn, keo sét hấp phụ cation dinh dưỡng (K+, NH4+...) — đất giàu mùn ít bị rửa trôi phân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi ruộng lúa bị ngộ độc hữu cơ (ngộ độc rễ), biểu hiện nào thường gặp?", "options": ["A. Rễ đen, thối, cây vàng, sinh trưởng kém", "B. Lúa xanh tốt bất thường", "C. Lúa trổ sớm", "D. Không biểu hiện"], "answer": "A", "explain": "Ngộ độc hữu cơ (đất yếm khí sinh khí độc H2S...): rễ đen thối, cây vàng, lùn — cần tháo nước phơi ruộng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ruộng lúa trũng, bón nhiều phân chuồng tươi chưa ủ, lúa bị vàng thối rễ. Nguyên nhân và cách xử lí?", "options": ["A. Ngộ độc hữu cơ do phân tươi phân hủy yếm khí; tháo nước phơi ruộng, lần sau ủ hoai phân", "B. Thiếu nước; tưới thêm", "C. Thiếu ánh sáng; che thêm", "D. Do giống tốt quá"], "answer": "A", "explain": "Phân tươi phân hủy sinh khí độc trong điều kiện ngập úng — tháo nước, phơi ruộng; phải ủ hoai phân trước khi bón.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tính chất vật lí gồm cơ giới, cấu trúc, giữ và thoát nước.", "b) Vi sinh vật, giun đất thuộc tính chất sinh học.", "c) Đất bazan hình thành từ đá núi lửa.", "d) Đất giàu mùn giữ phân bón tốt."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về ngộ độc hữu cơ:", "statements": ["a) Bón phân chuồng tươi chưa ủ dễ gây ngộ độc hữu cơ.", "b) Ngập úng kéo dài làm tăng nguy cơ ngộ độc rễ.", "c) Tháo nước, phơi ruộng giúp khắc phục ngộ độc hữu cơ.", "d) Phân chuồng phải được ủ hoai trước khi bón."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng — nguyên tắc sử dụng phân hữu cơ an toàn.", "points": 1}, {"type": "short", "level": "VDC", "q": "Liệt kê ba nhóm tính chất của đất trồng và ví dụ mỗi nhóm.", "answer": "Vật lí (cơ giới), hóa học (pH), sinh học (vi sinh vật)", "explain": "Vật lí: cơ giới, cấu trúc, giữ/thoát nước. Hóa học: pH, độ mặn, dinh dưỡng. Sinh học: vi sinh vật, giun đất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai nguyên tắc khi sử dụng phân chuồng bón cho cây.", "answer": "Ủ hoai trước khi bón; bón đúng liều lượng (chấp nhận: không bón tươi, bón lót)", "explain": "Phân chuồng phải ủ hoai để diệt mầm bệnh, tránh ngộ độc hữu cơ; bón đúng lượng, đúng cách.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Đất trồng có mấy vai trò chính đối với cây?", "options": ["A. 3 vai trò: giá thể, cung cấp nước, cung cấp dinh dưỡng và không khí", "B. 1 vai trò duy nhất", "C. Không có vai trò", "D. 10 vai trò"], "answer": "A", "explain": "3 vai trò: giá thể (bám rễ, đứng vững), cung cấp nước, cung cấp dinh dưỡng và không khí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hạt sét trong đất có đặc điểm gì?", "options": ["A. Hạt rất mịn, dính, giữ nước và dinh dưỡng tốt", "B. Hạt to, rời rạc", "C. Không giữ được nước", "D. Nhẹ như không khí"], "answer": "A", "explain": "Sét hạt mịn nhất, dính, keo sét hấp phụ dinh dưỡng tốt nhưng dễ bí chặt khi nhiều.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đa số cây trồng sinh trưởng tốt ở pH khoảng nào?", "options": ["A. Khoảng 6–7", "B. Khoảng 3–4", "C. Khoảng 9–10", "D. Khoảng 1–2"], "answer": "A", "explain": "pH 6–7 (hơi chua đến trung tính) là khoảng tối ưu cho đa số cây trồng hấp thụ dinh dưỡng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao đất sét nặng cần được cải tạo cho tơi xốp trước khi trồng rau?", "options": ["A. Vì đất sét bí chặt, thiếu ôxi, rễ khó phát triển", "B. Vì đất sét quá tốt", "C. Vì đất sét không giữ nước", "D. Vì đất sét quá rẻ"], "answer": "A", "explain": "Sét nặng bí chặt, úng khi mưa, nứt khi khô — rễ ngạt, khó đâm; cần hữu cơ, lên luống cải tạo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bón phân hữu cơ thường xuyên có tác dụng lâu dài nào cho đất?", "options": ["A. Tăng mùn, cải thiện cấu trúc, tăng vi sinh vật có ích", "B. Làm đất chai cứng", "C. Giết chết giun đất", "D. Không tác dụng"], "answer": "A", "explain": "Hữu cơ bổ sung mùn, tơi xốp đất, nuôi vi sinh vật — cải tạo độ phì bền vững.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nông dân muốn trồng rau sạch trên đất sét nặng. Quy trình cải tạo nào hợp lí?", "options": ["A. Bón vôi, bón nhiều phân hữu cơ, lên luống cao thoát nước", "B. Nén đất thật chặt rồi gieo", "C. Tưới ngập úng thường xuyên", "D. Không cần cải tạo"], "answer": "A", "explain": "Vôi cải thiện cấu trúc, hữu cơ làm tơi xốp, luống cao thoát nước — tổng hợp cải tạo đất sét.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đất có 3 vai trò: giá thể, cung cấp nước, dinh dưỡng và không khí.", "b) Hạt sét mịn, dính, giữ dinh dưỡng tốt.", "c) Đa số cây trồng thích pH khoảng 6–7.", "d) Bón hữu cơ thường xuyên giúp đất tơi xốp, màu mỡ."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của quy trình cải tạo đất sét trồng rau:", "statements": ["a) Bón vôi giúp cải thiện cấu trúc đất sét.", "b) Bón phân hữu cơ làm đất tơi xốp hơn.", "c) Lên luống cao giúp thoát nước, chống úng.", "d) Nén chặt đất sét giúp rau phát triển tốt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nén chặt làm đất bí, rễ ngạt.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu ba vai trò chính của đất trồng đối với cây.", "answer": "Giá thể bám rễ; cung cấp nước; cung cấp dinh dưỡng và không khí", "explain": "Đất là giá thể giúp cây đứng vững; cung cấp nước; cung cấp chất dinh dưỡng và ôxi cho rễ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích vì sao bón phân hữu cơ được coi là biện pháp cải tạo đất bền vững.", "answer": "Tăng mùn, tơi xốp đất, nuôi vi sinh vật có ích, không gây ô nhiễm (chấp nhận ý tương đương)", "explain": "Hữu cơ cải thiện lí, hóa, sinh của đất một cách tự nhiên, bền vững, không gây ô nhiễm như hóa học.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Quá trình nào tạo ra mùn trong đất?", "options": ["A. Vi sinh vật phân hủy xác động, thực vật", "B. Nung đất ở nhiệt độ cao", "C. Đổ hóa chất", "D. Phơi nắng"], "answer": "A", "explain": "Xác sinh vật được vi sinh vật phân hủy dần thành mùn — nguồn hữu cơ quý của đất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đất cát ven biển phân bố chủ yếu ở đâu?", "options": ["A. Duyên hải miền Trung", "B. Tây Nguyên", "C. Đồng bằng sông Hồng", "D. Vùng núi Tây Bắc"], "answer": "A", "explain": "Dải cát ven biển hẹp ở duyên hải miền Trung — rời rạc, giữ nước kém, cần chắn cát, cải tạo.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Yếu tố nào quyết định độ phì nhiêu của đất?", "options": ["A. Hàm lượng dinh dưỡng, mùn, cấu trúc và sinh vật đất tổng hòa", "B. Chỉ màu sắc đất", "C. Chỉ độ sâu tầng đất", "D. Chỉ giá đất"], "answer": "A", "explain": "Độ phì = tổng hòa dinh dưỡng, mùn, cấu trúc tơi xốp, vi sinh vật — không chỉ một yếu tố.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không nên cày đất khi đất quá ướt hoặc quá khô?", "options": ["A. Vì đất ướt cày bị nén chặt, đất khô cày vỡ tảng lớn, đều hại cấu trúc", "B. Vì cày lúc nào cũng tốt", "C. Vì tốn ít công", "D. Không có lí do"], "answer": "A", "explain": "Cày đất ướt làm mất cấu trúc, nén chặt; đất khô vỡ tảng to khó làm nhỏ — nên cày khi đất đủ ẩm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa độ xốp của đất và sinh trưởng của rễ cây là gì?", "options": ["A. Đất xốp giúp rễ hô hấp, đâm sâu, hút nước và dinh dưỡng tốt", "B. Đất càng chặt rễ càng khỏe", "C. Không liên quan", "D. Rễ không cần ôxi"], "answer": "A", "explain": "Đất xốp: ôxi đầy đủ, rễ đâm sâu, hút nước, dinh dưỡng tốt — cây khỏe.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Để đánh giá nhanh một mảnh đất có tốt không trước khi thuê trồng rau, nên kiểm tra những gì?", "options": ["A. Độ tơi xốp, màu sắc, mùi đất, pH và hỏi lịch sử canh tác", "B. Chỉ xem giá thuê", "C. Chỉ nhìn từ xa", "D. Không cần kiểm tra"], "answer": "A", "explain": "Quan sát tơi xốp, màu (mùn), mùi; đo pH; tìm hiểu lịch sử (có nhiễm độc, bạc màu không) — đánh giá tổng hợp.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mùn do vi sinh vật phân hủy xác sinh vật tạo thành.", "b) Đất cát ven biển phân bố ở duyên hải miền Trung.", "c) Độ phì nhiêu phụ thuộc tổng hòa nhiều yếu tố.", "d) Nên cày đất khi đất đủ ẩm, không quá ướt hay quá khô."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các tiêu chí chọn đất trồng rau:", "statements": ["a) Đất tơi xốp, giàu mùn là tiêu chí tốt.", "b) Đất gần nguồn nước sạch thuận lợi tưới tiêu.", "c) Đất từng nhiễm hóa chất độc cần tránh hoặc xử lí.", "d) Đất càng rẻ thì càng tốt, không cần quan tâm chất lượng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đất xấu, nhiễm độc gây thiệt hại lớn hơn nhiều so với tiền thuê rẻ.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai việc cần tránh khi làm đất để bảo vệ cấu trúc đất.", "answer": "Không cày khi đất quá ướt; không cày khi đất quá khô (chấp nhận: không nén chặt, không đốt rơm rạ)", "explain": "Cày đất ướt gây nén chặt; đất khô vỡ tảng — đều phá cấu trúc; nên cày khi đủ ẩm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao đất tơi xốp giúp cây trồng sinh trưởng tốt?", "answer": "Rễ hô hấp tốt, đâm sâu, hút nước và dinh dưỡng dễ dàng (chấp nhận ý tương đương)", "explain": "Tơi xốp: đủ ôxi cho rễ và vi sinh vật, giữ nước vừa phải, rễ phát triển mạnh — cây khỏe, năng suất cao.", "points": 0.5}]}]}
