i phun thuốc trừ sâu, nông dân vứt vỏ chai xuống mương nước gần ruộng. Hậu quả có thể là gì?", "answer": "A", "explain": "Vỏ chai còn tồn dư thuốc; vứt xuống mương gây ô nhiễm nước, diệt sinh vật thủy sinh, ảnh hưởng hệ sinh thái.", "points": 0.25, "options": ["A. Hóa chất còn dính trong chai ngấm ra mương, gây ô nhiễm nguồn nước, ảnh hưởng sinh vật thủy sinh.", "B. Chai nhựa làm nước sạch hơn.", "C. Không có hậu quả gì.", "D. Cá trong mương lớn nhanh hơn."]}, {"type": "mcq", "level": "VDC", "q": "Một vùng trồng rau ven sông có hiện tượng cá chết hàng loạt sau mỗi vụ bón thúc. Nguyên nhân có khả năng nhất là gì?", "answer": "A", "explain": "Bón thúc thừa đạm, gặp mưa rửa trôi xuống sông → phú dưỡng → thiếu ôxy → cá chết hàng loạt. Cần bón đúng liều, đúng lúc.", "points": 0.25, "options": ["A. Phân bón dư thừa bị rửa trôi xuống sông gây phú dưỡng, thiếu ôxy khiến cá chết.", "B. Cá chết do già.", "C. Cá chết do nước sông quá sạch.", "D. Cá chết vì thiếu thức ăn duy nhất."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về nguồn gây ô nhiễm:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đốt rơm rạ gây khói bụi, phát thải CO2.", "points": 1, "statements": ["a) Phân bón hóa học dư thừa bị rửa trôi gây phú dưỡng ao hồ.", "b) Thuốc bảo vệ thực vật tồn dư trong đất, nước, nông sản.", "c) Nilon, bao bì, chai lọ thuốc khó phân hủy gây ô nhiễm.", "d) Đốt rơm rạ không gây ô nhiễm không khí."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: trồng trọt có nhiều nguồn gây ô nhiễm nếu không quản lí tốt.", "points": 1, "statements": ["a) Nitrat từ phân đạm dư thừa có thể thấm xuống mạch nước ngầm.", "b) Lạm dụng thuốc BVTV diệt cả sinh vật có ích như ong, thiên địch.", "c) Chất thải chăn nuôi không xử lí gây ô nhiễm nguồn nước.", "d) Trồng trọt không gây ra bất kì ô nhiễm nào."]}, {"type": "short", "level": "NB", "q": "Hiện tượng tảo nở hoa, cá chết do thiếu ôxy khi dinh dưỡng dư thừa trôi xuống ao hồ gọi là gì?", "answer": "phú dưỡng", "explain": "Đạm, lân dư thừa rửa trôi xuống ao hồ gây phú dưỡng: tảo nở hoa, phân hủy tiêu tốn ôxy, cá chết.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Kể tên một nguồn gây ô nhiễm trong trồng trọt.", "answer": "phân bón hóa học dư thừa", "explain": "Các nguồn: phân bón hóa học dư thừa; thuốc BVTV; nilon, bao bì, chai lọ; đốt rơm rạ; chất thải chăn nuôi (nêu một là được).", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Đốt rơm rạ sau thu hoạch gây tác hại nào?", "answer": "A", "explain": "Đốt rơm rạ gây ô nhiễm không khí, phát thải khí nhà kính, tiêu diệt vi sinh vật tầng đất mặt và lãng phí nguồn hữu cơ quý giá.", "points": 0.25, "options": ["A. Gây khói bụi, phát thải khí CO2; làm chết vi sinh vật có ích ở tầng đất mặt; lãng phí nguồn hữu cơ.", "B. Làm đất tơi xốp hơn.", "C. Diệt được mọi loại sâu bệnh mà không có hại.", "D. Không có tác hại nào."]}, {"type": "mcq", "level": "NB", "q": "Nilon phủ luống rau nếu không thu gom sau vụ sẽ gây hậu quả gì?", "answer": "A", "explain": "Nilon khó phân hủy (hàng chục năm), tồn đọng trong đất gây ô nhiễm, cản trở rễ cây và vi sinh vật; phải thu gom, tái chế.", "points": 0.25, "options": ["A. Khó phân hủy, gây ô nhiễm đất, cản trở canh tác vụ sau.", "B. Làm đất tốt hơn.", "C. Tự phân hủy nhanh trong vài ngày.", "D. Không ảnh hưởng gì."]}, {"type": "mcq", "level": "TH", "q": "Chất thải chăn nuôi trong mô hình VAC nếu không xử lí sẽ gây ra vấn đề gì?", "answer": "A", "explain": "Phân, nước thải chuồng trại chưa xử lí gây ô nhiễm nước ao, mùi hôi, mầm bệnh — cần xử lí (biogas, ủ compost) trước khi dùng.", "points": 0.25, "options": ["A. Ô nhiễm nguồn nước, bốc mùi hôi thối, phát sinh dịch bệnh.", "B. Làm nước ao sạch hơn.", "C. Không gây vấn đề gì.", "D. Giúp cá lớn nhanh."]}, {"type": "mcq", "level": "TH", "q": "Trong các nguồn gây ô nhiễm sau, nguồn nào ảnh hưởng trực tiếp đến sức khỏe người tiêu dùng nông sản?", "answer": "A", "explain": "Tồn dư thuốc BVTV, nitrat vượt ngưỡng trong nông sản trực tiếp gây ngộ độc, ảnh hưởng sức khỏe người ăn.", "points": 0.25, "options": ["A. Tồn dư thuốc bảo vệ thực vật và nitrat trong rau, quả.", "B. Khói đốt rơm rạ ở đồng xa.", "C. Nilon trong đất.", "D. Tiếng ồn máy cày."]}, {"type": "mcq", "level": "VD", "q": "Gia đình em trồng rau, sau mỗi vụ thường đốt sạch rơm rạ và nilon phủ luống ngay trên đồng. Theo bài học, nên thay đổi như thế nào?", "answer": "A", "explain": "Thay vì đốt: rơm rạ ủ compost/trồng nấm (Bài 27), nilon thu gom tái chế — vừa BVMT vừa tận dụng tài nguyên.", "points": 0.25, "options": ["A. Không đốt nữa; rơm rạ đem ủ làm phân compost, nilon thu gom để tái chế hoặc xử lí đúng cách.", "B. Tiếp tục đốt vì nhanh và tiện.", "C. Đốt nhiều hơn để sạch đồng.", "D. Bỏ hoang đất không trồng nữa."]}, {"type": "mcq", "level": "VDC", "q": "Đánh giá: Một hộ chăn nuôi xả trực tiếp nước thải chuồng lợn ra mương. Đây là hành vi đúng hay sai, vì sao?", "answer": "A", "explain": "Xả thải trực tiếp vi phạm quy định BVMT, gây ô nhiễm nghiêm trọng; phải qua hệ thống xử lí như hầm biogas, bể lắng.", "points": 0.25, "options": ["A. Sai, vì gây ô nhiễm nguồn nước, bốc mùi, phát sinh dịch bệnh; phải xử lí (biogas, lắng lọc) trước khi thải.", "B. Đúng, vì tiện lợi.", "C. Đúng, vì phân lợn tốt cho mương.", "D. Sai vì tốn công xử lí."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về sự cần thiết BVMT:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: BVMT là nền tảng của phát triển bền vững.", "points": 1, "statements": ["a) BVMT trong trồng trọt giúp bảo vệ sức khỏe con người.", "b) BVMT giúp đảm bảo an toàn thực phẩm.", "c) BVMT giúp bảo vệ đa dạng sinh học.", "d) BVMT không liên quan đến phát triển bền vững."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về nguyên tắc 4 đúng:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đúng cách là đúng kĩ thuật (đều, đúng đối tượng), không phải phun nhiều.", "points": 1, "statements": ["a) 4 đúng gồm: đúng loại, đúng liều lượng, đúng lúc, đúng cách.", "b) Phun thuốc khi sâu mới phát sinh là thể hiện 'đúng lúc'.", "c) Phun quá liều khuyến cáo là vi phạm 'đúng liều lượng'.", "d) 'Đúng cách' nghĩa là phun càng nhiều càng tốt."]}, {"type": "short", "level": "NB", "q": "Nguyên tắc '4 đúng' gồm những nội dung nào?", "answer": "đúng loại, đúng liều lượng, đúng lúc, đúng cách", "explain": "4 đúng: đúng loại (đúng thuốc), đúng liều lượng, đúng lúc, đúng cách.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Nêu một tác hại của việc đốt rơm rạ.", "answer": "gây khói bụi, ô nhiễm không khí", "explain": "Các tác hại: khói bụi, phát thải CO2; chết vi sinh vật đất mặt; lãng phí hữu cơ (nêu một là được).", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Vì sao bảo vệ môi trường trong trồng trọt là yêu cầu cấp thiết?", "answer": "A", "explain": "BVMT trong trồng trọt cấp thiết vì liên quan trực tiếp đến sức khỏe, an toàn thực phẩm, đa dạng sinh học và phát triển bền vững.", "points": 0.25, "options": ["A. Vì ô nhiễm ảnh hưởng sức khỏe con người, an toàn thực phẩm, đa dạng sinh học và sự phát triển bền vững.", "B. Vì môi trường không quan trọng.", "C. Vì chỉ để đối phó kiểm tra.", "D. Vì trồng trọt không gây ô nhiễm."]}, {"type": "mcq", "level": "NB", "q": "Bảo vệ môi trường trong trồng trọt góp phần đảm bảo an toàn thực phẩm như thế nào?", "answer": "A", "explain": "Dùng phân bón, thuốc hợp lí + tiêu chuẩn VietGAP/hữu cơ giúp nông sản không vượt ngưỡng tồn dư, đảm bảo an toàn.", "points": 0.25, "options": ["A. Hạn chế tồn dư thuốc BVTV, nitrat trong nông sản, tạo ra nông sản sạch, an toàn.", "B. Làm nông sản to hơn.", "C. Làm nông sản rẻ hơn.", "D. Không liên quan đến an toàn thực phẩm."]}, {"type": "mcq", "level": "TH", "q": "Bảo vệ đa dạng sinh học trong trồng trọt có ý nghĩa gì?", "answer": "A", "explain": "Ong thụ phấn, thiên địch (bọ rùa, nhện...) giúp thụ phấn và kiểm soát sâu hại tự nhiên; lạm dụng thuốc sẽ tiêu diệt chúng.", "points": 0.25, "options": ["A. Giữ gìn ong thụ phấn, thiên địch của sâu hại, cân bằng hệ sinh thái đồng ruộng.", "B. Chỉ để ngắm cảnh đẹp.", "C. Không có ý nghĩa gì.", "D. Làm tăng sâu bệnh."]}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa bảo vệ môi trường và phát triển nông nghiệp bền vững là gì?", "answer": "A", "explain": "Giữ độ phì đất, chất lượng nước, đa dạng sinh học chính là nền tảng để canh tác lâu dài — cốt lõi của phát triển bền vững.", "points": 0.25, "options": ["A. BVMT là điều kiện để nông nghiệp phát triển bền vững, lâu dài cho các thế hệ sau.", "B. Hai vấn đề mâu thuẫn nhau.", "C. BVMT cản trở phát triển nông nghiệp.", "D. Không có mối quan hệ."]}, {"type": "mcq", "level": "VD", "q": "Một công ty muốn xuất khẩu rau sang thị trường khó tính. Vì sao họ phải đặc biệt chú trọng bảo vệ môi trường trong sản xuất?", "answer": "A", "explain": "Thị trường khó tính (EU, Nhật...) kiểm tra chặt tồn dư thuốc, nitrat và quy trình thân thiện môi trường; vi phạm sẽ bị trả hàng.", "points": 0.25, "options": ["A. Vì thị trường xuất khẩu yêu cầu nghiêm ngặt về tồn dư hóa chất, an toàn thực phẩm và sản xuất thân thiện môi trường.", "B. Vì xuất khẩu không cần chất lượng.", "C. Vì môi trường không liên quan đến xuất khẩu.", "D. Vì chỉ cần rau đẹp mã."]}, {"type": "mcq", "level": "VDC", "q": "Phân tích: Vì sao nói 'bảo vệ môi trường trong trồng trọt cũng là bảo vệ chính người nông dân'?", "answer": "A", "explain": "Nông dân trực tiếp pha, phun thuốc, sống cạnh đồng ruộng nên là đối tượng chịu ảnh hưởng đầu tiên của ô nhiễm — BVMT là tự bảo vệ mình.", "points": 0.25, "options": ["A. Vì nông dân là người tiếp xúc trực tiếp với thuốc BVTV, phân bón; môi trường ô nhiễm ảnh hưởng trước hết đến sức khỏe họ và gia đình.", "B. Vì nông dân không cần môi trường.", "C. Vì chỉ người tiêu dùng bị ảnh hưởng.", "D. Vì nông dân thích ô nhiễm."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: gây ô nhiễm nguồn nước nghiêm trọng.", "points": 1, "statements": ["a) Cần đảm bảo thời gian cách li sau phun thuốc trước khi thu hoạch.", "b) Thu hoạch trước thời gian cách li khiến tồn dư vượt ngưỡng.", "c) Vỏ chai thuốc sau khi dùng cần được thu gom, không vứt bừa bãi.", "d) Có thể vứt vỏ chai thuốc xuống mương nước."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về nông nghiệp hữu cơ và VietGAP:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: VietGAP cho phép dùng đúng quy định, chỉ hữu cơ mới cấm hoàn toàn.", "points": 1, "statements": ["a) Nông nghiệp hữu cơ không dùng phân bón, thuốc BVTV hóa học.", "b) VietGAP cho phép dùng hóa chất nhưng phải đúng quy định.", "c) Cả hai đều hướng tới nông sản an toàn, BVMT.", "d) VietGAP cấm hoàn toàn việc sử dụng phân hóa học."]}, {"type": "short", "level": "TH", "q": "Vì sao phải đảm bảo thời gian cách li sau khi phun thuốc BVTV?", "answer": "để thuốc phân hủy, tồn dư giảm dưới ngưỡng an toàn", "explain": "Thời gian cách li giúp thuốc phân hủy hết; thu hoạch sớm khiến tồn dư vượt ngưỡng, nguy hiểm cho người ăn.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nêu điểm khác nhau cơ bản giữa nông nghiệp hữu cơ và VietGAP.", "answer": "hữu cơ cấm hoàn toàn hóa chất, VietGAP cho dùng đúng quy định", "explain": "Hữu cơ: zero hóa chất tổng hợp; VietGAP: được dùng phân bón, thuốc hóa học nhưng đúng quy định, đảm bảo cách li.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên tắc '4 đúng' khi sử dụng phân bón, thuốc bảo vệ thực vật gồm những gì?", "answer": "A", "explain": "Nguyên tắc 4 đúng: đúng loại/thuốc, đúng liều lượng (nồng độ), đúng lúc (thời điểm), đúng cách (kĩ thuật).", "points": 0.25, "options": ["A. Đúng loại (đúng thuốc), đúng liều lượng, đúng lúc, đúng cách.", "B. Đúng giá, đúng nơi mua, đúng hãng, đúng màu sắc.", "C. Đúng mùa, đúng ngày, đúng giờ, đúng phút.", "D. Đúng cây, đúng đất, đúng nước, đúng phân."]}, {"type": "mcq", "level": "NB", "q": "'Đúng lúc' trong nguyên tắc 4 đúng khi phun thuốc trừ sâu được hiểu là gì?", "answer": "A", "explain": "Đúng lúc: khi sâu bệnh mới xuất hiện, đúng ngưỡng phòng trừ; tránh nắng gắt (thuốc bay hơi), mưa (rửa trôi), gió lớn (bay sang ruộng khác).", "points": 0.25, "options": ["A. Phun khi sâu bệnh mới phát sinh, đúng giai đoạn mẫn cảm, tránh lúc nắng gắt, mưa to, gió lớn.", "B. Phun bất cứ khi nào rảnh.", "C. Phun vào lúc nửa đêm.", "D. Phun sau khi đã thu hoạch."]}, {"type": "mcq", "level": "TH", "q": "Vì sao phải đảm bảo 'thời gian cách li' sau khi phun thuốc bảo vệ thực vật?", "answer": "A", "explain": "Mỗi loại thuốc có thời gian cách li quy định; thu hoạch trước thời hạn sẽ khiến tồn dư vượt ngưỡng, gây nguy hiểm cho người ăn.", "points": 0.25, "options": ["A. Để thuốc phân hủy hết, tồn dư giảm xuống dưới ngưỡng an toàn trước khi thu hoạch.", "B. Để thuốc ngấm sâu hơn vào nông sản.", "C. Để sâu bệnh quen với thuốc.", "D. Không cần thiết."]}, {"type": "mcq", "level": "TH", "q": "Biện pháp nào sau đây thuộc phòng trừ tổng hợp (IPM)?", "answer": "A", "explain": "IPM: ưu tiên biện pháp sinh thái, sinh học, canh tác; thuốc hóa học là giải pháp cuối cùng khi mật độ sâu bệnh vượt ngưỡng.", "points": 0.25, "options": ["A. Kết hợp biện pháp canh tác, sinh học, thủ công và chỉ dùng thuốc hóa học khi thật cần thiết.", "B. Chỉ phun thuốc hóa học định kì.", "C. Không làm gì, để sâu bệnh tự hết.", "D. Đốt đồng sau mỗi vụ."]}, {"type": "mcq", "level": "VD", "q": "Ruộng lúa của bác Tư bị sâu cuốn lá nhẹ. Theo IPM, nên xử lí thế nào?", "answer": "A", "explain": "IPM: sâu ở mật độ thấp chưa cần phun; dùng thiên địch, bắt bằng tay, bẫy...; chỉ phun khi vượt ngưỡng kinh tế, đúng 4 đúng.", "points": 0.25, "options": ["A. Theo dõi thêm, dùng biện pháp thủ công, sinh học trước; chỉ phun thuốc khi mật độ vượt ngưỡng.", "B. Phun ngay thuốc liều cao để diệt sạch.", "C. Bỏ ruộng không chăm sóc.", "D. Đốt cả ruộng."]}, {"type": "mcq", "level": "VDC", "q": "Một nông dân phun thuốc trừ sâu liều gấp đôi khuyến cáo vì nghĩ diệt nhanh hơn. Hậu quả có thể là gì?", "answer": "A", "explain": "Quá liều: tồn dư cao nguy hiểm, diệt thiên địch gây bùng phát sâu sau đó, sâu kháng thuốc, tốn chi phí, ô nhiễm — vi phạm nguyên tắc 4 đúng.", "points": 0.25, "options": ["A. Tồn dư vượt ngưỡng, diệt cả thiên địch, gây kháng thuốc, tốn tiền và ô nhiễm môi trường.", "B. Sâu chết nhanh hơn mà không có hại gì.", "C. Lúa tốt hơn.", "D. Không có hậu quả."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: đạm thừa là nguyên nhân chính gây phú dưỡng.", "points": 1, "statements": ["a) Bón thừa đạm gây phú dưỡng ao hồ: tảo nở hoa, thiếu ôxy, cá chết.", "b) Để hạn chế phú dưỡng cần bón đúng liều, đúng lúc, làm bờ ngăn rửa trôi.", "c) Phân đạm dư thừa không bao giờ gây ô nhiễm.", "d) Thay nước, sục khí giúp khắc phục ao bị phú dưỡng."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về IPM:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: IPM hạn chế tối đa thuốc hóa học.", "points": 1, "statements": ["a) IPM ưu tiên biện pháp sinh học, canh tác; thuốc hóa học là giải pháp cuối cùng.", "b) Sâu ở mật độ thấp chưa cần phun thuốc ngay.", "c) Thả ong mắt đỏ diệt sâu đục thân là biện pháp sinh học.", "d) IPM yêu cầu phun thuốc hóa học định kì."]}, {"type": "short", "level": "TH", "q": "Biện pháp sinh học trong phòng trừ sâu bệnh là gì? Cho ví dụ.", "answer": "dùng thiên địch, chế phẩm sinh học; ví dụ thả ong mắt đỏ", "explain": "Dùng thiên địch, chế phẩm sinh học, bẫy bả thay thuốc hóa học; ví dụ: thả ong mắt đỏ kí sinh trứng sâu đục thân.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Thay vì đốt, rơm rạ có thể tận dụng để làm gì? (nêu một)", "answer": "ủ làm phân compost", "explain": "Các cách: ủ phân compost, trồng nấm, thức ăn gia súc, đệm lót sinh học (nêu một là được).", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Nông nghiệp hữu cơ có đặc điểm nào?", "answer": "A", "explain": "Nông nghiệp hữu cơ tuyệt đối không dùng hóa chất tổng hợp; dùng phân hữu cơ, biện pháp sinh học, tạo nông sản an toàn tuyệt đối.", "points": 0.25, "options": ["A. Không sử dụng phân bón hóa học, thuốc bảo vệ thực vật hóa học và chất kích thích sinh trưởng.", "B. Sử dụng thật nhiều phân hóa học.", "C. Chỉ trồng cây dại không chăm sóc.", "D. Không cần tuân thủ quy trình gì."]}, {"type": "mcq", "level": "NB", "q": "Điểm khác nhau cơ bản giữa nông nghiệp hữu cơ và VietGAP là gì?", "answer": "A", "explain": "Hữu cơ: zero hóa chất tổng hợp. VietGAP: được dùng phân bón, thuốc hóa học nhưng phải đúng quy định, an toàn, truy xuất được.", "points": 0.25, "options": ["A. Hữu cơ cấm hoàn toàn hóa chất; VietGAP cho phép dùng hóa chất nhưng đúng quy định, đúng liều, đảm bảo cách li.", "B. Hai mô hình hoàn toàn giống nhau.", "C. VietGAP cấm hoàn toàn hóa chất.", "D. Hữu cơ cho phép dùng thoải mái thuốc hóa học."]}, {"type": "mcq", "level": "TH", "q": "Vì sao nông sản hữu cơ thường có giá cao hơn nông sản thông thường?", "answer": "A", "explain": "Hữu cơ: không dùng hóa chất nên năng suất thấp hơn, công chăm sóc nhiều, chi phí chứng nhận cao — giá cao phản ánh giá trị an toàn.", "points": 0.25, "options": ["A. Vì quy trình nghiêm ngặt, năng suất thường thấp hơn, chi phí chứng nhận cao nhưng an toàn tuyệt đối.", "B. Vì người bán tự nâng giá.", "C. Vì nông sản hữu cơ to hơn.", "D. Vì không tốn chi phí sản xuất."]}, {"type": "mcq", "level": "TH", "q": "Tiêu chuẩn VietGAP yêu cầu những nội dung nào?", "answer": "A", "explain": "VietGAP (thực hành nông nghiệp tốt): 4 trụ cột — an toàn thực phẩm, BVMT, sức khỏe người lao động, truy xuất nguồn gốc.", "points": 0.25, "options": ["A. An toàn thực phẩm, bảo vệ môi trường, sức khỏe người lao động và truy xuất nguồn gốc.", "B. Chỉ yêu cầu năng suất cao.", "C. Chỉ yêu cầu mẫu mã đẹp.", "D. Không yêu cầu gì."]}, {"type": "mcq", "level": "VD", "q": "Hợp tác xã rau của xã em muốn đạt chứng nhận VietGAP. Việc đầu tiên cần làm là gì?", "answer": "A", "explain": "VietGAP yêu cầu minh bạch quy trình: nhật kí ghi chép đầy đủ là bằng chứng truy xuất nguồn gốc, điều kiện bắt buộc để chứng nhận.", "points": 0.25, "options": ["A. Ghi chép nhật kí sản xuất đầy đủ (bón phân, phun thuốc, thu hoạch) và tuân thủ quy trình an toàn.", "B. Chỉ cần treo biển VietGAP.", "C. Tăng giá bán trước.", "D. Không cần làm gì."]}, {"type": "mcq", "level": "VDC", "q": "So sánh: Một hộ làm rau hữu cơ và một hộ làm rau VietGAP. Nhận định nào đúng?", "answer": "A", "explain": "Hữu cơ an toàn tuyệt đối nhưng năng suất thấp, giá cao; VietGAP cân bằng giữa an toàn và năng suất, phù hợp đại trà hơn.", "points": 0.25, "options": ["A. Rau hữu cơ không dùng hóa chất nên an toàn tuyệt đối nhưng năng suất thấp hơn; rau VietGAP dùng hóa chất đúng quy định, năng suất cao hơn.", "B. Rau VietGAP an toàn hơn rau hữu cơ.", "C. Hai loại rau như nhau.", "D. Rau hữu cơ dùng nhiều thuốc hơn."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: độc canh làm sâu bệnh tích lũy, đất suy kiệt.", "points": 1, "statements": ["a) Thuốc trừ sâu phổ rộng diệt cả thiên địch khiến sâu hại có thể bùng phát trở lại.", "b) Nên tránh phun lúc hoa nở rộ để bảo vệ ong thụ phấn.", "c) Luân canh, xen canh giúp hạn chế sâu bệnh thân thiện môi trường.", "d) Độc canh liên tục một loại cây giúp đất khỏe hơn."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đốt nilon thải khí độc, gây ô nhiễm không khí.", "points": 1, "statements": ["a) Rơm rạ có thể ủ compost, trồng nấm, làm thức ăn gia súc thay vì đốt.", "b) Đốt rơm rạ làm chết vi sinh vật có ích ở tầng đất mặt.", "c) Nilon phủ luống cần thu gom sau vụ vì khó phân hủy.", "d) Đốt nilon ngay trên đồng là cách xử lí tốt."]}, {"type": "short", "level": "VD", "q": "Giải thích vì sao lạm dụng thuốc trừ sâu phổ rộng có thể khiến sâu hại bùng phát trở lại.", "answer": "vì thuốc diệt cả thiên địch nên sâu hại không còn kẻ thù tự nhiên", "explain": "Thuốc phổ rộng diệt cả thiên địch; sâu hại sinh sản nhanh phục hồi trước, bùng phát mạnh hơn.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Để bảo vệ ong thụ phấn, khi phun thuốc cần lưu ý gì?", "answer": "không phun lúc hoa nở rộ, phun chiều mát", "explain": "Tránh phun khi hoa nở rộ (ong lấy mật), phun chiều mát, ưu tiên thuốc chọn lọc.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Việc thu gom vỏ chai thuốc bảo vệ thực vật sau khi sử dụng có ý nghĩa gì?", "answer": "A", "explain": "Vỏ chai còn dính thuốc; thu gom, xử lí đúng quy định ngăn ô nhiễm đất, nước và bảo vệ sức khỏe mọi người.", "points": 0.25, "options": ["A. Ngăn hóa chất tồn dư gây ô nhiễm đất, nguồn nước; bảo vệ sức khỏe cộng đồng.", "B. Chỉ để đồng ruộng gọn gàng.", "C. Không có ý nghĩa gì.", "D. Để bán ve chai kiếm lời là chính."]}, {"type": "mcq", "level": "NB", "q": "Thay vì đốt rơm rạ, nông dân có thể tận dụng rơm rạ để làm gì?", "answer": "A", "explain": "Rơm rạ là nguồn hữu cơ quý: ủ compost, trồng nấm rơm, thức ăn gia súc, đệm lót sinh học — vừa BVMT vừa tăng thu nhập (chi tiết Bài 27).", "points": 0.25, "options": ["A. Ủ làm phân compost, trồng nấm, làm thức ăn gia súc, đệm lót sinh học.", "B. Chỉ có thể vứt bỏ.", "C. Không tận dụng được vào việc gì.", "D. Đem đổ xuống sông."]}, {"type": "mcq", "level": "TH", "q": "Biện pháp sinh học trong phòng trừ sâu bệnh là gì?", "answer": "A", "explain": "Biện pháp sinh học: thả ong kí sinh, dùng nấm, vi khuẩn trừ sâu, bẫy pheromone... an toàn, thân thiện môi trường.", "points": 0.25, "options": ["A. Dùng thiên địch, chế phẩm sinh học, bẫy bả để kiểm soát sâu hại thay cho thuốc hóa học.", "B. Phun thật nhiều thuốc hóa học.", "C. Đốt đồng để diệt sâu.", "D. Không làm gì cả."]}, {"type": "mcq", "level": "TH", "q": "Ví dụ nào sau đây là ứng dụng biện pháp sinh học?", "answer": "A", "explain": "Ong mắt đỏ đẻ trứng vào trứng sâu đục thân, tiêu diệt sâu từ trứng — biện pháp sinh học điển hình, không cần thuốc hóa học.", "points": 0.25, "options": ["A. Thả ong mắt đỏ kí sinh trứng sâu đục thân lúa.", "B. Phun thuốc trừ sâu liều cao.", "C. Đốt rơm rạ diệt sâu.", "D. Bón thật nhiều đạm."]}, {"type": "mcq", "level": "VD", "q": "Xã em phát động phong trào 'Thu gom chai lọ thuốc BVTV'. Mỗi hộ nên làm gì?", "answer": "A", "explain": "Xử lí đúng: súc rửa 3 lần (nước súc đổ vào bình phun), thu gom tập trung để xử lí — không vứt, đốt, chôn bừa bãi.", "points": 0.25, "options": ["A. Sau khi phun, súc rửa chai 3 lần, thu gom vào nơi quy định, không vứt bừa bãi.", "B. Vứt xuống mương cho tiện.", "C. Đốt chai nhựa ngay tại ruộng.", "D. Chôn lấp trong vườn nhà."]}, {"type": "mcq", "level": "VDC", "q": "Đánh giá mô hình: Vườn rau áp dụng IPM kết hợp VietGAP so với vườn phun thuốc định kì. Nhận định nào đúng?", "answer": "A", "explain": "IPM + VietGAP: giảm thuốc, giảm chi phí, nông sản an toàn bán giá cao; đổi lại cần kiến thức, theo dõi đồng ruộng thường xuyên.", "points": 0.25, "options": ["A. Mô hình IPM + VietGAP giảm chi phí thuốc, an toàn, bán giá tốt hơn dù cần kiến thức và công theo dõi.", "B. Mô hình phun định kì luôn tốt hơn.", "C. IPM không có tác dụng gì.", "D. Hai mô hình như nhau."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vi phạm quy định BVMT, gây ô nhiễm.", "points": 1, "statements": ["a) Bón thừa đạm làm tăng phát thải khí N2O gây biến đổi khí hậu.", "b) Ủ rơm rạ làm phân compost thân thiện hơn đốt rơm rạ.", "c) Hầm biogas giúp xử lí chất thải chăn nuôi, giảm mùi hôi.", "d) Xả nước thải chuồng trại trực tiếp ra mương là đúng quy định."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: ảnh hưởng trước hết đến nông dân và cộng đồng nông thôn.", "points": 1, "statements": ["a) Nông dân là đối tượng chịu ảnh hưởng đầu tiên của ô nhiễm trong trồng trọt.", "b) BVMT trong trồng trọt cũng là bảo vệ sức khỏe chính người nông dân.", "c) Thị trường xuất khẩu yêu cầu nghiêm ngặt về tồn dư hóa chất.", "d) Ô nhiễm trong trồng trọt chỉ ảnh hưởng người tiêu dùng thành phố."]}, {"type": "short", "level": "VD", "q": "Nêu cách xử lí đúng vỏ chai thuốc BVTV sau khi sử dụng.", "answer": "súc rửa 3 lần, thu gom vào nơi quy định", "explain": "Súc rửa chai 3 lần (nước súc đổ vào bình phun), thu gom tập trung để xử lí; không vứt, đốt, chôn bừa bãi.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Vì sao bón thừa đạm làm tăng phát thải khí nhà kính?", "answer": "vì sinh ra khí N2O từ đất", "explain": "Đạm thừa → vi sinh vật đất thải N2O, khí nhà kính mạnh gấp khoảng 300 lần CO2.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Khí nhà kính từ trồng trọt (do đốt rơm rạ, bón thừa đạm) góp phần gây ra hiện tượng gì?", "answer": "A", "explain": "Đốt rơm rạ thải CO2; bón thừa đạm thải N2O — các khí nhà kính góp phần vào biến đổi khí hậu.", "points": 0.25, "options": ["A. Biến đổi khí hậu toàn cầu.", "B. Mưa axit duy nhất.", "C. Không ảnh hưởng gì.", "D. Làm không khí sạch hơn."]}, {"type": "mcq", "level": "NB", "q": "Sử dụng phân đạm hợp lí giúp ứng phó biến đổi khí hậu như thế nào?", "answer": "A", "explain": "Bón thừa đạm → vi sinh vật đất thải N2O (khí nhà kính mạnh gấp ~300 lần CO2); bón đúng liều giảm phát thải.", "points": 0.25, "options": ["A. Giảm phát thải khí N2O (một khí nhà kính mạnh) từ đất.", "B. Làm tăng phát thải.", "C. Không liên quan.", "D. Chỉ giúp cây tốt hơn."]}, {"type": "mcq", "level": "TH", "q": "Trong các hoạt động sau, hoạt động nào thân thiện với môi trường nhất?", "answer": "A", "explain": "Ủ compost tận dụng hữu cơ, không phát thải, cải tạo đất — thân thiện nhất; các phương án còn lại đều gây ô nhiễm.", "points": 0.25, "options": ["A. Ủ rơm rạ làm phân compost bón cho vụ sau.", "B. Đốt rơm rạ ngay trên đồng.", "C. Vứt nilon phủ luống ra mương.", "D. Xả nước thải chuồng trại ra sông."]}, {"type": "mcq", "level": "TH", "q": "Mô hình VAC (vườn – ao – chuồng) muốn bền vững cần xử lí chất thải chăn nuôi như thế nào?", "answer": "A", "explain": "Chất thải chăn nuôi qua biogas/compost (Bài 27) thành phân bón, khí đốt — khép kín chu trình, không ô nhiễm.", "points": 0.25, "options": ["A. Ủ compost, làm hầm biogas để vừa xử lí ô nhiễm vừa tạo phân bón, khí đốt.", "B. Xả trực tiếp ra ao.", "C. Đổ đống ngoài vườn.", "D. Không cần xử lí."]}, {"type": "mcq", "level": "VD", "q": "Một trang trại chăn nuôi lợn gần khu dân cư bị phản ánh về mùi hôi. Giải pháp căn cơ là gì?", "answer": "A", "explain": "Biogas xử lí triệt để phân, nước thải, giảm mùi và tạo khí đốt; trồng cây xanh làm vành đai cách li — giải pháp căn cơ.", "points": 0.25, "options": ["A. Xây hầm biogas xử lí phân, nước thải; che chắn, trồng cây xanh cách li.", "B. Xả thải ra xa hơn.", "C. Nuôi thêm nhiều lợn hơn.", "D. Phun nước hoa át mùi."]}, {"type": "mcq", "level": "VDC", "q": "Phân tích: Vì sao 'nông nghiệp hữu cơ' được xem là mô hình thân thiện môi trường nhất?", "answer": "A", "explain": "Hữu cơ: zero hóa chất → đất, nước sạch; sinh vật có ích được bảo vệ; nông sản an toàn tuyệt đối — thân thiện nhất.", "points": 0.25, "options": ["A. Vì loại bỏ hoàn toàn hóa chất tổng hợp, bảo vệ đất, nước, đa dạng sinh học và sức khỏe con người.", "B. Vì cho năng suất cao nhất.", "C. Vì không cần lao động.", "D. Vì rẻ nhất."]}, {"type": "truefalse", "level": "VD", "q": "Tình huống: Ao cá gần ruộng lúa bị phú dưỡng sau vụ bón thúc. Xét tính đúng, sai của các biện pháp:", "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: làm phú dưỡng nặng thêm.", "points": 1, "statements": ["a) Giảm liều đạm, bón đúng lúc, làm bờ ngăn nước ruộng chảy ra ao.", "b) Thay một phần nước ao, sục khí để tăng ôxy.", "c) Tiếp tục bón thúc đạm liều cao cho vụ sau.", "d) Vớt bớt tảo, thả bèo để hạn chế tảo nở hoa."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về xử lí vi phạm:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: làm tồn dư nặng thêm.", "points": 1, "statements": ["a) Siêu thị từ chối rau tồn dư vượt ngưỡng; hợp tác xã cần rà soát quy trình, tuân thủ cách li.", "b) Ghi nhật kí sản xuất giúp truy xuất, khắc phục nguyên nhân.", "c) Hướng tới VietGAP giúp lấy lại niềm tin thị trường.", "d) Nên phun thêm thuốc để rau đẹp mắt hơn."]}, {"type": "short", "level": "VD", "q": "Ao cá bị phú dưỡng sau vụ bón thúc. Nêu hai biện pháp khắc phục.", "answer": "giảm liều đạm và thay nước, sục khí ao", "explain": "Các biện pháp: bón đúng 4 đúng, ngăn rửa trôi; thay nước, sục khí; vớt tảo (nêu hai là được).", "points": 0.5}, {"type": "short", "level": "VD", "q": "Hợp tác xã bị siêu thị từ chối vì tồn dư vượt ngưỡng. Cần làm gì?", "answer": "rà soát quy trình, tuân thủ 4 đúng và thời gian cách li", "explain": "Khắc phục: tuân thủ 4 đúng, đảm bảo cách li, ghi nhật kí, hướng tới VietGAP.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Ong mật và thiên địch (bọ rùa, nhện) có vai trò gì trong đồng ruộng?", "answer": "A", "explain": "Ong thụ phấn tăng đậu quả; bọ rùa ăn rệp, nhện bắt sâu — kiểm soát sâu hại tự nhiên, giảm cần thuốc.", "points": 0.25, "options": ["A. Ong thụ phấn cho cây; thiên địch kiểm soát sâu hại tự nhiên.", "B. Gây hại cho cây trồng.", "C. Không có vai trò gì.", "D. Chỉ để làm cảnh."]}, {"type": "mcq", "level": "NB", "q": "Lạm dụng thuốc trừ sâu phổ rộng gây ra 'bùng phát sâu hại trở lại' vì sao?", "answer": "A", "explain": "Thuốc phổ rộng diệt cả thiên địch; sâu hại sinh sản nhanh phục hồi trước, không còn kẻ thù nên bùng phát dữ dội hơn.", "points": 0.25, "options": ["A. Vì thuốc diệt cả thiên địch của sâu hại nên sau đó sâu hại bùng phát mạnh hơn do không còn kẻ thù tự nhiên.", "B. Vì sâu thích thuốc trừ sâu.", "C. Vì thuốc làm sâu khỏe hơn.", "D. Vì nông dân phun chưa đủ."]}, {"type": "mcq", "level": "TH", "q": "Để bảo vệ ong thụ phấn, khi phun thuốc cần lưu ý gì?", "answer": "A", "explain": "Ong hoạt động mạnh khi hoa nở, ban ngày; phun chiều mát, tránh lúc hoa nở rộ và dùng thuốc chọn lọc để bảo vệ ong.", "points": 0.25, "options": ["A. Không phun lúc hoa nở rộ, ong đi lấy mật; ưu tiên thuốc chọn lọc, phun chiều mát.", "B. Phun thật nhiều lúc hoa nở.", "C. Phun thẳng vào đàn ong.", "D. Không cần lưu ý gì."]}, {"type": "mcq", "level": "TH", "q": "Biện pháp canh tác nào giúp hạn chế sâu bệnh mà thân thiện môi trường?", "answer": "A", "explain": "Luân canh cắt vòng đời sâu bệnh, xen canh đa dạng sinh học, vệ sinh đồng ruộng diệt nguồn bệnh, giống kháng bệnh — thân thiện môi trường.", "points": 0.25, "options": ["A. Luân canh, xen canh, vệ sinh đồng ruộng, dùng giống kháng bệnh.", "B. Độc canh một loại cây liên tục.", "C. Bỏ hoang đất.", "D. Tưới ngập úng liên tục."]}, {"type": "mcq", "level": "VD", "q": "Vườn cây ăn quả của bác Hai thả nhiều bọ rùa và treo bẫy bả. Đây là biện pháp gì?", "answer": "A", "explain": "Thả thiên địch (bọ rùa) + bẫy bả sinh học là biện pháp sinh học trong IPM — giảm phụ thuộc thuốc hóa học.", "points": 0.25, "options": ["A. Biện pháp sinh học trong phòng trừ tổng hợp (IPM).", "B. Biện pháp hóa học.", "C. Biện pháp cơ học duy nhất.", "D. Không phải biện pháp phòng trừ."]}, {"type": "mcq", "level": "VDC", "q": "So sánh chi phí dài hạn: vườn dùng IPM so với vườn phun thuốc định kì. Nhận định nào hợp lí?", "answer": "A", "explain": "IPM: ban đầu cần học, theo dõi; lâu dài giảm thuốc, đất không bị chai, nông sản an toàn giá tốt — hiệu quả vượt trội.", "points": 0.25, "options": ["A. IPM giảm dần chi phí thuốc, đất khỏe hơn, nông sản bán giá tốt nên hiệu quả dài hạn cao hơn.", "B. Phun định kì luôn rẻ hơn.", "C. IPM tốn kém hơn mãi mãi.", "D. Hai cách như nhau."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về chính sách:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần chính sách hỗ trợ đồng bộ.", "points": 1, "statements": ["a) Hỗ trợ máy cuộn rơm, tập huấn ủ compost giúp nông dân bỏ đốt rơm rạ.", "b) Tạo đầu ra cho rơm rạ (nấm, thức ăn) khuyến khích nông dân tận dụng.", "c) Chỉ phạt nặng mà không hỗ trợ thì khó hiệu quả bền vững.", "d) Nên mặc kệ nông dân tự xử lí rơm rạ."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: nhiều giải pháp tiết kiệm chi phí.", "points": 1, "statements": ["a) Nhiều giải pháp BVMT (ủ compost, IPM, 4 đúng) còn giúp giảm chi phí sản xuất.", "b) Nông sản an toàn bán được giá tốt hơn.", "c) BVMT luôn làm tăng chi phí nên nông dân không muốn làm.", "d) Lợi ích dài hạn của BVMT vượt chi phí bỏ ra."]}, {"type": "short", "level": "VDC", "q": "Phân tích ngắn gọn: Vì sao BVMT trong trồng trọt cũng là bảo vệ chính người nông dân?", "answer": "vì nông dân tiếp xúc trực tiếp với thuốc, phân bón và sống cạnh đồng ruộng", "explain": "Nông dân trực tiếp pha phun thuốc, sống cạnh đồng nên chịu ảnh hưởng đầu tiên của ô nhiễm — BVMT là tự bảo vệ mình.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai giải pháp giúp xã giảm đốt rơm rạ hiệu quả.", "answer": "hỗ trợ máy cuộn rơm và tạo đầu ra cho rơm rạ", "explain": "Các giải pháp: hỗ trợ máy cuộn rơm, tập huấn ủ compost, liên kết thu mua rơm làm nấm/thức ăn (nêu hai là được).", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Nước ao nuôi cá bị xanh rêu, cá nổi đầu vào sáng sớm sau đợt bón thúc đạm cho lúa gần ao. Chẩn đoán và cách xử lí?", "answer": "A", "explain": "Đạm rửa trôi → tảo nở hoa → đêm tảo hô hấp hết ôxy → cá nổi đầu. Xử lí: bón đúng 4 đúng, ngăn rửa trôi, thay nước, sục khí ao.", "points": 0.25, "options": ["A. Phú dưỡng do đạm rửa trôi; cần giảm liều đạm, bón đúng lúc, làm bờ ngăn, thay nước ao.", "B. Cá bị bệnh, cần phun thuốc xuống ao.", "C. Hiện tượng bình thường, không cần làm gì.", "D. Do thiếu thức ăn cho cá."]}, {"type": "mcq", "level": "NB", "q": "Một vùng chuyên rau có tỉ lệ nông dân bị ngộ độc thuốc BVTV cao. Giải pháp tổng thể nào phù hợp?", "answer": "A", "explain": "Giải pháp tổng thể: đào tạo sử dụng an toàn, đồ bảo hộ, IPM giảm thuốc, VietGAP, thu gom bao bì — giảm ngộ độc bền vững.", "points": 0.25, "options": ["A. Tập huấn 4 đúng + trang bị bảo hộ + phát triển IPM, VietGAP + thu gom chai lọ.", "B. Cấm trồng rau.", "C. Tăng liều thuốc để phun ít lần hơn.", "D. Không cần giải pháp."]}, {"type": "mcq", "level": "TH", "q": "Chính quyền xã muốn giảm đốt rơm rạ. Biện pháp nào hiệu quả và được nông dân hưởng ứng?", "answer": "A", "explain": "Kết hợp hỗ trợ kĩ thuật, thiết bị và đầu ra cho rơm rạ (nấm, thức ăn) tạo lợi ích kinh tế — nông dân tự nguyện bỏ đốt.", "points": 0.25, "options": ["A. Hỗ trợ máy cuộn rơm, tập huấn ủ compost, liên kết thu mua rơm làm nấm, thức ăn gia súc.", "B. Chỉ phạt nặng mà không hỗ trợ.", "C. Mặc kệ nông dân.", "D. Cấm thu hoạch lúa."]}, {"type": "mcq", "level": "TH", "q": "Siêu thị từ chối nhập rau của hợp tác xã vì phát hiện tồn dư thuốc vượt ngưỡng. Hợp tác xã cần làm gì?", "answer": "A", "explain": "Khắc phục gốc rễ: tuân thủ 4 đúng, đảm bảo cách li, minh bạch nhật kí, xây dựng VietGAP để lấy lại niềm tin thị trường.", "points": 0.25, "options": ["A. Rà soát quy trình, tuân thủ 4 đúng và thời gian cách li, ghi nhật kí, hướng tới VietGAP.", "B. Phun thêm thuốc cho rau đẹp.", "C. Bán chui cho chợ khác.", "D. Đổ lỗi cho siêu thị."]}, {"type": "mcq", "level": "VD", "q": "Đánh giá: 'Bảo vệ môi trường làm tăng chi phí nên nông dân không muốn làm'. Quan điểm này đúng hay sai?", "answer": "A", "explain": "Nhiều giải pháp BVMT tiết kiệm chi phí (giảm thuốc, phân; tận dụng rơm rạ) và tăng giá trị nông sản — lợi ích dài hạn vượt chi phí.", "points": 0.25, "options": ["A. Chưa đúng hoàn toàn, vì nhiều giải pháp (ủ compost, IPM, 4 đúng) còn giúp giảm chi phí, tăng thu nhập dài hạn.", "B. Hoàn toàn đúng.", "C. Hoàn toàn sai, không tốn gì.", "D. Đúng vì nông dân lười."]}, {"type": "mcq", "level": "VDC", "q": "Tổng hợp: Để xây dựng 'vùng rau an toàn' cho một xã, cần những nội dung nào?", "answer": "A", "explain": "Vùng rau an toàn cần đồng bộ: quy hoạch, kĩ thuật (4 đúng, IPM), chứng nhận (VietGAP), BVMT (bao bì, rơm rạ) và thị trường.", "points": 0.25, "options": ["A. Quy hoạch vùng sản xuất; tập huấn 4 đúng, IPM; chứng nhận VietGAP; thu gom bao bì; không đốt rơm rạ; liên kết tiêu thụ.", "B. Chỉ cần treo biển 'rau an toàn'.", "C. Chỉ cần tăng diện tích.", "D. Không cần nội dung gì."]}, {"type": "truefalse", "level": "VDC", "q": "Phân tích mô hình: Vườn rau áp dụng IPM + VietGAP so với vườn phun thuốc định kì. Xét tính đúng, sai:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: dài hạn tốn thuốc, đất chai, rủi ro tồn dư.", "points": 1, "statements": ["a) Mô hình IPM + VietGAP giảm chi phí thuốc, nông sản an toàn hơn.", "b) Mô hình IPM + VietGAP đòi hỏi kiến thức và công theo dõi nhiều hơn.", "c) Về dài hạn, mô hình IPM + VietGAP hiệu quả và bền vững hơn.", "d) Phun thuốc định kì luôn cho hiệu quả kinh tế cao hơn."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các nhận định tổng hợp:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: càng hiện đại càng phải BVMT.", "points": 1, "statements": ["a) BVMT trong trồng trọt: sức khỏe – an toàn thực phẩm – đa dạng sinh học – bền vững – khí hậu.", "b) Học sinh có thể góp phần bằng tuyên truyền, thu gom bao bì, thực hành đúng kĩ thuật.", "c) Bảo vệ môi trường là trách nhiệm của mọi người, không chỉ của nông dân.", "d) Trồng trọt hiện đại không cần quan tâm môi trường."]}, {"type": "short", "level": "VDC", "q": "Nêu mối quan hệ giữa Bài 26 và Bài 27.", "answer": "bài 26 nêu vấn đề, bài 27 trình bày giải pháp vi sinh cụ thể", "explain": "Bài 26: vấn đề ô nhiễm và giải pháp chung; Bài 27: công nghệ vi sinh xử lí chất thải (ủ compost, biogas) cụ thể.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Học sinh có thể góp phần BVMT trong trồng trọt bằng việc làm nào? (nêu một)", "answer": "tuyên truyền không đốt rơm rạ", "explain": "Các việc: tuyên truyền không đốt rơm rạ, cùng gia đình thu gom chai lọ, thực hành 4 đúng trong vườn trường (nêu một là được).", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các hành vi sau, hành vi nào thể hiện ý thức bảo vệ môi trường trong trồng trọt?", "answer": "A", "explain": "Thu gom bao bì, tận dụng rơm rạ là hành vi BVMT; các phương án còn lại đều gây ô nhiễm.", "points": 0.25, "options": ["A. Thu gom chai lọ thuốc BVTV sau khi phun và ủ rơm rạ làm phân bón.", "B. Vứt bao bì phân bón xuống kênh.", "C. Đốt nilon phủ luống ngay trên đồng.", "D. Phun thuốc khi trời mưa to."]}, {"type": "mcq", "level": "NB", "q": "Học sinh có thể góp phần bảo vệ môi trường trong trồng trọt bằng việc làm nào?", "answer": "A", "explain": "Học sinh góp phần bằng tuyên truyền, cùng gia đình thu gom bao bì, thực hành đúng kĩ thuật trong vườn trường.", "points": 0.25, "options": ["A. Tuyên truyền không đốt rơm rạ, thu gom chai lọ thuốc cùng gia đình; thực hành 4 đúng trong vườn trường.", "B. Không quan tâm vì là việc của người lớn.", "C. Xả rác bừa bãi.", "D. Đốt rơm rạ giúp bố mẹ."]}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa Bài 26 và Bài 27 là gì?", "answer": "A", "explain": "Bài 26: nhận diện vấn đề và giải pháp chung; Bài 27: đi sâu giải pháp công nghệ vi sinh (ủ compost, biogas) xử lí chất thải.", "points": 0.25, "options": ["A. Bài 26 nêu vấn đề ô nhiễm và sự cần thiết BVMT; Bài 27 trình bày giải pháp công nghệ vi sinh xử lí chất thải cụ thể.", "B. Hai bài không liên quan.", "C. Bài 27 mâu thuẫn với Bài 26.", "D. Chỉ cần học một trong hai bài."]}, {"type": "mcq", "level": "TH", "q": "Nội dung nào sau đây KHÔNG thuộc Bài 26?", "answer": "A", "explain": "Quy trình ủ compost chi tiết thuộc Bài 27; các nội dung còn lại thuộc Bài 26.", "points": 0.25, "options": ["A. Quy trình ủ phân compost từ rơm rạ.", "B. Nguyên tắc 4 đúng khi dùng thuốc BVTV.", "C. So sánh nông nghiệp hữu cơ và VietGAP.", "D. Tác hại của việc đốt rơm rạ."]}, {"type": "mcq", "level": "VD", "q": "Một đề kiểm tra Bài 26 có thể yêu cầu học sinh làm gì ở mức vận dụng?", "answer": "A", "explain": "Mức vận dụng: phân tích tình huống thực tế (phú dưỡng, ngộ độc, đốt rơm rạ...) và đề xuất giải pháp — đúng tinh thần bài học.", "points": 0.25, "options": ["A. Phân tích tình huống ô nhiễm cụ thể và đề xuất giải pháp khắc phục phù hợp.", "B. Chỉ chép lại định nghĩa.", "C. Chỉ kể tên các loại phân bón.", "D. Không có câu vận dụng."]}, {"type": "mcq", "level": "VDC", "q": "Thông điệp chính của Bài 26 là gì?", "answer": "A", "explain": "Thông điệp: phát triển trồng trọt phải đi đôi với BVMT — vì sức khỏe con người và sự bền vững của nông nghiệp.", "points": 0.25, "options": ["A. Trồng trọt phải gắn liền với bảo vệ môi trường để phát triển bền vững, bảo vệ sức khỏe con người.", "B. Cứ sản xuất bằng mọi giá.", "C. Môi trường không quan trọng.", "D. Chỉ cần năng suất cao."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau (phân biệt Bài 26 – Bài 27):", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: hầm biogas chi tiết thuộc Bài 27.", "points": 1, "statements": ["a) Bài 26 nêu vấn đề ô nhiễm và giải pháp chung; Bài 27 đi sâu công nghệ vi sinh xử lí chất thải.", "b) Quy trình ủ compost chi tiết thuộc Bài 27.", "c) Nguyên tắc 4 đúng thuộc Bài 26.", "d) Hầm biogas thuộc nội dung Bài 26."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định tổng kết:", "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: là vấn đề chung của toàn xã hội.", "points": 1, "statements": ["a) Thông điệp Bài 26: trồng trọt phải gắn với BVMT để phát triển bền vững.", "b) Giải pháp trọng tâm: 4 đúng – hữu cơ – VietGAP – thu gom bao bì – không đốt rơm rạ.", "c) Ô nhiễm trong trồng trọt là vấn đề của riêng người nông dân.", "d) Mỗi học sinh đều có thể góp phần BVMT trong trồng trọt."]}, {"type": "short", "level": "VDC", "q": "Kể tên năm giải pháp bảo vệ môi trường trong trồng trọt đã học.", "answer": "4 đúng; hữu cơ; VietGAP; thu gom bao bì; không đốt rơm rạ", "explain": "Năm giải pháp: phân bón/thuốc theo 4 đúng; nông nghiệp hữu cơ; VietGAP/GlobalGAP; thu gom bao bì chai lọ; không đốt rơm rạ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu thông điệp chính của Bài 26.", "answer": "trồng trọt phải gắn với bảo vệ môi trường để phát triển bền vững", "explain": "Thông điệp: phát triển trồng trọt phải đi đôi với BVMT — vì sức khỏe con người và sự bền vững của nông nghiệp.", "points": 0.5}]}]}
