{"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Giống tốt cần đạt yêu cầu nào về năng suất?", "options": ["A. Năng suất cao và ổn định qua các vụ.", "B. Năng suất thất thường.", "C. Năng suất thấp.", "D. Không cần năng suất."], "answer": "A", "explain": "Giống tốt phải cho năng suất cao và ổn định, không trồi sụt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giống tốt cần đạt yêu cầu nào về chất lượng?", "options": ["A. Nông sản thơm ngon, mẫu mã đẹp.", "B. Nông sản có mùi lạ.", "C. Nông sản nhanh hỏng.", "D. Không cần chất lượng."], "answer": "A", "explain": "Chất lượng tốt: thơm ngon, bổ dưỡng, mẫu mã đẹp, phù hợp thị hiếu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giống tốt cần đạt yêu cầu nào về chống chịu?", "options": ["A. Kháng sâu bệnh, chịu được điều kiện bất lợi.", "B. Dễ nhiễm bệnh.", "C. Chỉ sống trong nhà kính.", "D. Không cần chống chịu."], "answer": "A", "explain": "Giống tốt phải chống chịu được sâu bệnh, hạn, mặn, rét, đổ ngã.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một giống lúa năng suất cao nhưng dễ nhiễm bệnh đạo ôn, gạo ăn dở. Có nên coi là giống tốt không? Vì sao?", "options": ["A. Không, vì chưa đáp ứng yêu cầu chất lượng và chống chịu.", "B. Có, vì năng suất cao là đủ.", "C. Có, vì dễ trồng.", "D. Không thể đánh giá."], "answer": "A", "explain": "Giống tốt phải đáp ứng đồng thời các yêu cầu: năng suất, chất lượng, chống chịu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao chọn giống phải căn cứ vào điều kiện địa phương?", "options": ["A. Vì mỗi giống chỉ phát huy tốt trong điều kiện sinh thái phù hợp.", "B. Vì giống địa phương luôn rẻ.", "C. Vì không có lí do gì.", "D. Vì pháp luật quy định."], "answer": "A", "explain": "Tính thích nghi quyết định sự thành bại; giống không phù hợp sẽ sinh trưởng kém.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Có 2 giống ngô: A năng suất 90 tạ/ha nhưng nhiễm sâu đục thân nặng; B năng suất 80 tạ/ha, kháng sâu tốt, hạt đều đẹp. Khuyến cáo cho nông dân nên là gì?", "options": ["A. Giống B vì tổng hòa các yêu cầu, hiệu quả thực tế và bền vững cao hơn.", "B. Giống A vì năng suất cao nhất.", "C. Không trồng ngô.", "D. Trồng lẫn hai giống."], "answer": "A", "explain": "Chọn giống phải cân nhắc tổng hòa; giống B ổn định, ít rủi ro, chất lượng tốt.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định ôn tập sau về yêu cầu giống tốt:", "statements": ["a) Giống tốt phải sinh trưởng tốt, thích nghi địa phương.", "b) Giống tốt phải cho năng suất cao và ổn định.", "c) Giống tốt phải cho nông sản chất lượng tốt.", "d) Giống tốt phải chống chịu được sâu bệnh, điều kiện bất lợi."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: cả 4 đều là yêu cầu.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về lựa chọn giống:", "statements": ["a) Nên chọn giống phù hợp với điều kiện khí hậu, đất đai địa phương.", "b) Giống năng suất cao nhưng chất lượng kém vẫn là giống tốt.", "c) Giống tốt cần đáp ứng đồng thời nhiều yêu cầu.", "d) Chỉ cần năng suất cao, không cần quan tâm các yêu cầu khác."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: cần cả chất lượng. c) Đúng. d) Sai: phải cân nhắc tổng hòa.", "points": 1}, {"type": "short", "level": "VDC", "q": "So sánh ưu điểm của nhân giống vô tính so với nhân giống hữu tính ở cây ăn quả.", "answer": "giữ nguyên đặc tính tốt của cây mẹ, rút ngắn thời gian cho thu hoạch", "explain": "Nhân giống vô tính (ghép, chiết, giâm) tạo cây con giống hệt cây mẹ về đặc tính tốt, lại cho thu hoạch sớm hơn gieo hạt; nhân giống hữu tính dễ bị phân li tính trạng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao không nên chỉ dựa vào năng suất để đánh giá giống tốt? (Nêu 1 lí do)", "answer": "vì còn cần chất lượng và khả năng chống chịu", "explain": "Giống tốt phải đáp ứng đồng thời năng suất, chất lượng, chống chịu; chỉ năng suất cao mà chất lượng kém, dễ bệnh thì chưa phải giống tốt.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Chọn lọc hàng loạt có đặc điểm gì?", "options": ["A. Chọn cây tốt, thu chung hạt làm giống; đơn giản nhưng kém chính xác.", "B. Chọn từng cây, gieo riêng từng dòng.", "C. Cho hai cây giao phối.", "D. Dùng tia phóng xạ."], "answer": "A", "explain": "Hàng loạt: chọn nhiều cây tốt, thu hoạch chung — đơn giản, ít tốn kém, độ chính xác không cao.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chọn lọc cá thể có đặc điểm gì?", "options": ["A. Chọn từng cây tốt, gieo riêng từng dòng; chính xác cao nhưng tốn công.", "B. Chọn nhiều cây, thu chung.", "C. Rất đơn giản.", "D. Không tốn thời gian."], "answer": "A", "explain": "Cá thể: theo dõi riêng từng dòng nên chính xác cao, chọn được dòng thuần; tốn công, thời gian.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ai có thể áp dụng chọn lọc hàng loạt?", "options": ["A. Nông dân cũng tự làm được vì đơn giản, ít tốn kém.", "B. Chỉ viện nghiên cứu.", "C. Chỉ kĩ sư.", "D. Không ai làm được."], "answer": "A", "explain": "Nông dân chọn cây tốt trên ruộng mình để giữ giống là chọn lọc hàng loạt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao viện nghiên cứu ưu tiên chọn lọc cá thể?", "options": ["A. Vì cần độ chính xác cao để tạo dòng thuần, giống mới chất lượng.", "B. Vì đơn giản.", "C. Vì rẻ tiền.", "D. Vì không có lí do gì."], "answer": "A", "explain": "Tạo giống mới đòi hỏi đánh giá chính xác từng cá thể, từng dòng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân biệt chọn lọc hàng loạt và cá thể dựa vào điểm nào?", "options": ["A. Cách xử lí hạt: thu chung hay gieo riêng từng dòng.", "B. Giá thành hạt giống.", "C. Màu sắc hạt.", "D. Không phân biệt được."], "answer": "A", "explain": "Hàng loạt thu hoạch chung; cá thể gieo hạt từng cây riêng thành dòng để so sánh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một hợp tác xã muốn giữ giống lúa địa phương ngon qua nhiều vụ. Biện pháp chọn lọc phù hợp, đơn giản nhất là gì?", "options": ["A. Mỗi vụ chọn những cây tốt, thu chung hạt làm giống (chọn lọc hàng loạt).", "B. Mua giống mới mỗi vụ.", "C. Để lúa tự mọc.", "D. Không cần giữ giống."], "answer": "A", "explain": "Chọn lọc hàng loạt đơn giản, phù hợp với hợp tác xã tự giữ giống địa phương.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định ôn tập sau về chọn lọc:", "statements": ["a) Chọn lọc hàng loạt: chọn cây tốt, thu chung hạt làm giống.", "b) Chọn lọc cá thể: chọn từng cây, gieo riêng từng dòng.", "c) Chọn lọc cá thể chính xác hơn chọn lọc hàng loạt.", "d) Chọn lọc hàng loạt tốn công hơn chọn lọc cá thể."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cá thể tốn công hơn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về ứng dụng chọn lọc:", "statements": ["a) Nông dân chọn bông lúa to làm giống là chọn lọc hàng loạt.", "b) Viện nghiên cứu gieo riêng từng dòng là chọn lọc cá thể.", "c) Chọn cây xấu, cây bệnh làm giống giúp giống tốt lên.", "d) Chọn lọc cần lặp lại qua nhiều vụ để giống ổn định."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: phải chọn cây tốt, khỏe. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "So sánh ngắn gọn chọn lọc hàng loạt và chọn lọc cá thể.", "answer": "hàng loạt đơn giản kém chính xác, cá thể chính xác cao tốn công", "explain": "Hàng loạt: chọn nhiều cây tốt, thu chung hạt — đơn giản, ít tốn kém, kém chính xác. Cá thể: chọn từng cây, gieo riêng từng dòng — chính xác cao, tốn công.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 1 ví dụ về chọn lọc hàng loạt trong thực tế.", "answer": "chọn bông lúa to hạt chắc làm giống vụ sau", "explain": "Ví dụ: nông dân chọn những bông lúa to, hạt chắc trên ruộng để làm giống vụ sau; chọn cây ngô tốt lấy hạt giống.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Lai hữu tính là gì?", "options": ["A. Cho 2 cá thể bố mẹ có đặc tính tốt khác nhau giao phối với nhau.", "B. Chọn cây tốt làm giống.", "C. Dùng tia phóng xạ.", "D. Nuôi cấy mô."], "answer": "A", "explain": "Lai hữu tính: bố mẹ có đặc tính tốt khác nhau giao phối, con lai mang ưu điểm cả hai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ưu thế lai là gì?", "options": ["A. Con lai F1 vượt trội hơn cả bố và mẹ.", "B. Con lai giống hệt bố.", "C. Con lai yếu hơn bố mẹ.", "D. Không có hiện tượng này."], "answer": "A", "explain": "Ưu thế lai: F1 sinh trưởng mạnh, năng suất cao hơn cả bố và mẹ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để tận dụng ưu thế lai, trong sản xuất nên dùng hạt giống nào?", "options": ["A. Hạt lai F1.", "B. Hạt lai F2.", "C. Hạt bất kì.", "D. Hạt lép."], "answer": "A", "explain": "Ưu thế lai mạnh nhất ở F1 nên dùng hạt lai F1.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không dùng hạt thu từ ruộng cây lai F1 để làm giống?", "options": ["A. Vì sang F2 ưu thế lai giảm, cây phân li, năng suất giảm.", "B. Vì hạt F2 không nảy mầm.", "C. Vì pháp luật cấm.", "D. Vì không có lí do gì."], "answer": "A", "explain": "F2 mất ưu thế lai, phân li mạnh nên năng suất giảm, cây không đều.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Muốn tạo giống vừa năng suất cao vừa kháng bệnh, nên lai bố mẹ như thế nào?", "options": ["A. Một cây năng suất cao lai với một cây kháng bệnh.", "B. Hai cây đều năng suất cao.", "C. Hai cây đều kháng bệnh.", "D. Cây nào cũng được."], "answer": "A", "explain": "Chọn bố mẹ có đặc tính tốt khác nhau để con lai kết hợp cả hai.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ngô lai F1 năng suất 85 tạ/ha; nông dân dùng hạt thu được gieo vụ sau chỉ đạt 60 tạ/ha. Giải thích và khuyến cáo đúng là gì?", "options": ["A. Do mất ưu thế lai ở F2; nên mua hạt F1 mới mỗi vụ.", "B. Do thời tiết.", "C. Do bón phân sai.", "D. Không giải thích được."], "answer": "A", "explain": "Hạt thu từ F1 là F2: ưu thế lai giảm, năng suất giảm tất yếu; phải mua hạt F1 mới.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định ôn tập sau về lai tạo:", "statements": ["a) Lai hữu tính là cho bố mẹ có đặc tính tốt khác nhau giao phối.", "b) Con lai có thể mang đặc tính tốt của cả bố và mẹ.", "c) Ưu thế lai là F1 vượt trội hơn cả bố và mẹ.", "d) Nên dùng hạt F2 để tận dụng ưu thế lai."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: phải dùng hạt F1.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về ứng dụng ưu thế lai:", "statements": ["a) Ngô lai LVN10 tận dụng ưu thế lai.", "b) Trồng cây lai nên mua hạt F1 mới mỗi vụ.", "c) Ưu thế lai giảm dần ở các thế hệ sau F1.", "d) Sau khi lai, con lai đã ổn định ngay, không cần chọn lọc."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cần chọn lọc nhiều thế hệ mới ổn định.", "points": 1}, {"type": "short", "level": "VDC", "q": "Ưu thế lai là gì? Nêu cách tận dụng trong sản xuất. (Ngắn gọn)", "answer": "F1 vượt trội bố mẹ, dùng hạt lai F1 trong sản xuất", "explain": "Ưu thế lai: con lai F1 vượt trội hơn cả bố và mẹ. Tận dụng bằng cách dùng hạt lai F1 trong sản xuất, không dùng hạt F2 làm giống.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu các bước tạo giống bằng lai hữu tính theo đúng thứ tự.", "answer": "chọn bố mẹ, cho lai, chọn lọc các thế hệ, khảo nghiệm công nhận", "explain": "Các bước: chọn bố mẹ có đặc tính tốt khác nhau; cho giao phối; chọn lọc các thế hệ sau; khảo nghiệm và công nhận giống.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Tác nhân gây đột biến gồm những loại nào?", "options": ["A. Tia phóng xạ, tia tử ngoại và hóa chất như cônsixin.", "B. Phân bón.", "C. Thuốc trừ sâu.", "D. Nước lã."], "answer": "A", "explain": "Tác nhân vật lí (tia phóng xạ, tử ngoại) và hóa học (cônsixin...).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dưa hấu không hạt được tạo ra bằng cách nào?", "options": ["A. Gây đột biến đa bội bằng cônsixin.", "B. Lai thông thường.", "C. Chọn lọc hàng loạt.", "D. Gieo hạt."], "answer": "A", "explain": "Cônsixin gây đa bội tạo dưa hấu tam bội không hạt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nuôi cấy mô có ưu điểm gì?", "options": ["A. Nhân nhanh số lượng lớn cây con đồng đều, sạch bệnh.", "B. Không cần phòng thí nghiệm.", "C. Rất rẻ.", "D. Ai cũng làm được."], "answer": "A", "explain": "Nuôi cấy mô trong môi trường vô trùng: nhân nhanh, đồng đều, sạch bệnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhược điểm của gây đột biến là gì?", "options": ["A. Đột biến ngẫu nhiên, đa số có hại, phải chọn lọc công phu.", "B. Không tạo được đột biến.", "C. Quá đơn giản.", "D. Không tốn kém."], "answer": "A", "explain": "Đột biến ngẫu nhiên; chỉ số ít có lợi nên phải chọn lọc kĩ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Công nghệ chuyển gen khác lai hữu tính ở điểm nào?", "options": ["A. Đưa được gen từ loài rất xa, vượt rào cản loài.", "B. Đơn giản hơn.", "C. Rẻ hơn.", "D. Không khác gì."], "answer": "A", "explain": "Chuyển gen đưa được gen quý từ loài xa (kể cả vi sinh vật) vào cây trồng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Muốn có giống lúa chín sớm mà nguồn gen hiện tại không có, phương pháp khả thi nhất là gì?", "options": ["A. Gây đột biến bằng tia gamma rồi chọn dòng chín sớm.", "B. Chọn lọc hàng loạt.", "C. Lai hai giống chín muộn.", "D. Không thể tạo được."], "answer": "A", "explain": "Gây đột biến tạo biến dị mới không có sẵn trong nguồn gen.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định ôn tập sau về đột biến và CNSH:", "statements": ["a) Tác nhân gây đột biến gồm tia phóng xạ và hóa chất.", "b) Đột biến xảy ra ngẫu nhiên, cần chọn lọc cá thể tốt.", "c) Nuôi cấy mô nhân nhanh cây con đồng đều, sạch bệnh.", "d) Chuyển gen tạo ra giống biến đổi gen."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: cả 4 đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về đột biến và công nghệ sinh học:", "statements": ["a) Dưa hấu không hạt là thành tựu của gây đột biến đa bội.", "b) Chỉ thị phân tử giúp chọn lọc nhanh, chính xác.", "c) Nuôi cấy mô đơn giản, nông dân tự làm được ở nhà.", "d) Gây đột biến tạo được đặc tính mới mà lai tạo khó có."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cần phòng thí nghiệm vô trùng. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên 2 ứng dụng công nghệ sinh học trong chọn, tạo giống.", "answer": "nuôi cấy mô, chuyển gen", "explain": "Các ứng dụng: nuôi cấy mô tế bào, công nghệ chuyển gen, chỉ thị phân tử.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 1 ưu điểm và 1 nhược điểm của gây đột biến.", "answer": "ưu điểm tạo đặc tính mới, nhược điểm ngẫu nhiên phải chọn lọc kĩ", "explain": "Ưu điểm: tạo được đặc tính mới mà lai tạo khó có. Nhược điểm: đột biến ngẫu nhiên, đa số có hại, phải chọn lọc công phu.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Nhân giống hữu tính là gì?", "options": ["A. Nhân giống bằng hạt.", "B. Nhân giống bằng cành giâm.", "C. Nhân giống bằng ghép.", "D. Nhân giống bằng nuôi cấy mô."], "answer": "A", "explain": "Nhân giống hữu tính là dùng hạt (qua thụ phấn, thụ tinh) để nhân giống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ưu điểm của nhân giống bằng hạt là gì?", "options": ["A. Hệ số nhân cao, dễ bảo quản, vận chuyển.", "B. Cây con giống hệt mẹ.", "C. Nhanh ra quả.", "D. Không phân li."], "answer": "A", "explain": "Một cây cho hàng nghìn hạt; hạt khô dễ bảo quản, vận chuyển.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây trồng bằng hạt có ưu điểm gì về rễ và tuổi thọ?", "options": ["A. Rễ ăn sâu, tuổi thọ cao.", "B. Rễ nông, tuổi thọ thấp.", "C. Không có rễ.", "D. Tuổi thọ rất thấp."], "answer": "A", "explain": "Cây từ hạt có rễ cọc ăn sâu nên khỏe, tuổi thọ cao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhược điểm của nhân giống bằng hạt với cây ăn quả là gì?", "options": ["A. Phân li tính trạng, lâu ra quả (5–10 năm).", "B. Hạt đắt tiền.", "C. Hạt không nảy mầm.", "D. Không có nhược điểm."], "answer": "A", "explain": "Cây giao phấn phân li mạnh; trồng hạt lâu ra quả, quả có thể không ngon bằng mẹ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao lúa, ngô, rau chủ yếu nhân bằng hạt?", "options": ["A. Vì cần số lượng lớn, kĩ thuật đơn giản, chi phí thấp.", "B. Vì không có cách khác.", "C. Vì hạt đắt.", "D. Vì cây không ra hoa."], "answer": "A", "explain": "Cây ngắn ngày cần hệ số nhân cao, gieo hạt là hiệu quả nhất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trồng hạt bưởi da xanh ngon, 8 năm sau ra quả chua, nhỏ. Nguyên nhân và cách khắc phục đúng là gì?", "options": ["A. Do phân li tính trạng; muốn giữ đặc tính phải chiết cành hoặc ghép.", "B. Do bón phân sai.", "C. Do tưới sai.", "D. Do đất xấu."], "answer": "A", "explain": "Gieo hạt bị phân li; nhân vô tính (chiết, ghép) mới giữ nguyên đặc tính mẹ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định ôn tập sau về nhân giống hữu tính:", "statements": ["a) Nhân giống hữu tính là nhân giống bằng hạt.", "b) Hệ số nhân bằng hạt rất cao.", "c) Hạt dễ bảo quản và vận chuyển.", "d) Cây con từ hạt luôn giống hệt cây mẹ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: dễ phân li tính trạng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về ưu nhược điểm nhân giống bằng hạt:", "statements": ["a) Cây trồng bằng hạt có rễ ăn sâu, tuổi thọ cao.", "b) Cây ăn quả trồng bằng hạt thường lâu cho thu hoạch.", "c) Lúa, ngô phù hợp nhân giống bằng hạt.", "d) Nhân bằng hạt giữ nguyên hoàn toàn đặc tính cây mẹ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: dễ phân li.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 2 ưu điểm và 1 nhược điểm của nhân giống bằng hạt.", "answer": "ưu điểm hệ số nhân cao dễ bảo quản, nhược điểm phân li tính trạng", "explain": "Ưu điểm: hệ số nhân cao, dễ bảo quản vận chuyển, cây khỏe tuổi thọ cao. Nhược điểm: phân li tính trạng, lâu ra quả.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Kể tên 3 cây trồng chủ yếu được nhân giống bằng hạt.", "answer": "lúa, ngô, đậu", "explain": "Các cây nhân bằng hạt: lúa, ngô, đậu các loại, rau...", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Nhân giống vô tính gồm những cách nào?", "options": ["A. Giâm cành, chiết cành, ghép, nuôi cấy mô.", "B. Gieo hạt.", "C. Lai hữu tính.", "D. Gây đột biến."], "answer": "A", "explain": "Vô tính: giâm cành, chiết cành, ghép, nuôi cấy mô.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ưu điểm lớn nhất của nhân giống vô tính là gì?", "options": ["A. Cây con giống hệt cây mẹ.", "B. Hệ số nhân rất cao.", "C. Hạt dễ bảo quản.", "D. Chi phí thấp nhất."], "answer": "A", "explain": "Từ cơ quan sinh dưỡng nên không phân li, giữ nguyên đặc tính mẹ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiết cành là cách làm như thế nào?", "options": ["A. Khoanh vỏ cành, bọc đất ẩm, chờ ra rễ rồi cắt trồng.", "B. Cắt cành cắm xuống đất.", "C. Ghép mắt lên gốc.", "D. Gieo hạt."], "answer": "A", "explain": "Chiết: khoanh vỏ, bọc đất ẩm quanh chỗ khoanh, ra rễ thì cắt trồng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ghép có ưu điểm gì mà giâm, chiết không có?", "options": ["A. Kết hợp được gốc khỏe với cành tốt trong một cây.", "B. Đơn giản hơn.", "C. Rẻ hơn.", "D. Không cần kĩ thuật."], "answer": "A", "explain": "Ghép tận dụng cả hai: rễ khỏe chống chịu + cành cho quả ngon.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhược điểm chung của nhân giống vô tính là gì?", "options": ["A. Hệ số nhân thấp, dễ lây bệnh từ cây mẹ, tuổi thọ thấp hơn.", "B. Cây con không giống mẹ.", "C. Cây lâu ra quả.", "D. Không có nhược điểm."], "answer": "A", "explain": "Trừ nuôi cấy mô, giâm chiết ghép cho số lượng ít, dễ lây bệnh, tuổi thọ thấp.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhà vườn có cây bưởi mẹ quả ngon nhưng bị bệnh, muốn nhân 200 cây con khỏe, giống mẹ. Phương án tốt nhất là gì?", "options": ["A. Lấy mắt ghép từ cây mẹ khỏe khác cùng giống, ghép lên gốc khỏe; không lấy cành cây bệnh.", "B. Lấy cành cây bệnh để chiết.", "C. Gieo hạt bưởi.", "D. Để tự nhiên."], "answer": "A", "explain": "Không nhân từ cây bệnh (lây bệnh); lấy giống từ cây mẹ khỏe cùng giống rồi ghép.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định ôn tập sau về nhân giống vô tính:", "statements": ["a) Giâm cành là cắt cành bánh tẻ cắm vào đất ẩm.", "b) Chiết cành là khoanh vỏ, bọc đất ẩm, chờ ra rễ.", "c) Ghép là gắn mắt/cành tốt lên gốc ghép.", "d) Nuôi cấy mô nhân nhanh cây con đồng đều, sạch bệnh."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: cả 4 đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về ưu nhược điểm nhân giống vô tính:", "statements": ["a) Cây con vô tính giữ nguyên đặc tính của cây mẹ.", "b) Cây ăn quả nhân vô tính nhanh cho thu hoạch.", "c) Nên chọn cây mẹ khỏe, sạch bệnh để nhân giống.", "d) Nhân vô tính cho hệ số nhân cao hơn gieo hạt."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: hệ số nhân thấp hơn gieo hạt.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên 4 cách nhân giống vô tính và cho 1 ví dụ cây trồng mỗi cách.", "answer": "giâm cành sắn, chiết cành cam, ghép xoài, nuôi cấy mô lan", "explain": "Giâm cành (sắn, mía), chiết cành (cam, bưởi), ghép (xoài, cam), nuôi cấy mô (lan, chuối).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 2 ưu điểm và 1 nhược điểm của nhân giống vô tính.", "answer": "ưu điểm giống hệt mẹ nhanh ra quả, nhược điểm hệ số nhân thấp", "explain": "Ưu điểm: giống hệt mẹ, nhanh cho thu hoạch. Nhược điểm: hệ số nhân thấp (trừ nuôi cấy mô), dễ lây bệnh, tuổi thọ thấp.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Điểm khác nhau cơ bản giữa \"chọn, tạo giống\" và \"nhân giống\" là gì?", "options": ["A. Chọn, tạo giống làm ra giống mới; nhân giống làm ra nhiều cây từ giống đã có.", "B. Hai việc hoàn toàn giống nhau.", "C. Nhân giống làm ra giống mới.", "D. Không phân biệt được."], "answer": "A", "explain": "Chọn, tạo giống tạo giống mới tốt hơn; nhân giống nhân số lượng cây con từ giống đó.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lai tạo ra giống lúa ST25 thuộc công đoạn nào?", "options": ["A. Chọn, tạo giống.", "B. Nhân giống.", "C. Thu hoạch.", "D. Bảo quản."], "answer": "A", "explain": "Lai tạo ra giống mới ST25 là công đoạn chọn, tạo giống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiết cành để có 500 cây bưởi da xanh thuộc công đoạn nào?", "options": ["A. Nhân giống.", "B. Chọn, tạo giống.", "C. Lai tạo.", "D. Gây đột biến."], "answer": "A", "explain": "Chiết cành nhân số lượng cây từ giống đã có là nhân giống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa chọn, tạo giống và nhân giống trong sản xuất là gì?", "options": ["A. Nối tiếp nhau: có giống mới tốt rồi mới nhân ra số lượng lớn đưa vào sản xuất.", "B. Không liên quan.", "C. Chỉ cần một trong hai.", "D. Hai việc đối lập."], "answer": "A", "explain": "Quy trình: chọn, tạo ra giống mới, sau đó nhân giống để có đủ số lượng sản xuất đại trà.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nuôi cấy mô vừa là phương pháp tạo giống vừa là nhân giống. Vì sao?", "options": ["A. Vì vừa tạo cây sạch bệnh, vừa nhân nhanh số lượng lớn.", "B. Vì không có lí do gì.", "C. Vì rẻ tiền.", "D. Vì đơn giản."], "answer": "A", "explain": "Nuôi cấy mô tạo cây sạch bệnh (cải thiện giống) đồng thời nhân nhanh số lượng lớn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một trung tâm giống có quy trình: lai tạo giống lúa mới, khảo nghiệm, công nhận, sau đó nhân bằng hạt để cung ứng đại trà. Nhận xét đúng là gì?", "options": ["A. Quy trình đúng: chọn, tạo giống trước, nhân giống sau.", "B. Quy trình sai.", "C. Nên làm ngược lại.", "D. Không cần khảo nghiệm."], "answer": "A", "explain": "Đúng trình tự công tác giống: tạo giống mới, khảo nghiệm công nhận, rồi nhân rộng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định ôn tập sau:", "statements": ["a) Chọn, tạo giống nhằm tạo ra giống mới tốt hơn.", "b) Nhân giống nhằm tạo ra số lượng lớn cây con từ giống đã có.", "c) Lai tạo ra ST25 là chọn, tạo giống.", "d) Chiết cành nhân bưởi là chọn, tạo giống."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: chiết cành là nhân giống.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về phân biệt chọn tạo giống và nhân giống:", "statements": ["a) Có giống mới tốt rồi mới nhân rộng ra sản xuất.", "b) Gây đột biến thuộc công đoạn chọn, tạo giống.", "c) Giâm cành thuộc công đoạn nhân giống.", "d) Nhân giống có thể tạo ra giống hoàn toàn mới."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: nhân giống chỉ nhân số lượng, không tạo giống mới.", "points": 1}, {"type": "short", "level": "VDC", "q": "Phân biệt \"chọn, tạo giống\" và \"nhân giống\" về mục đích. (Ngắn gọn)", "answer": "chọn tạo giống làm ra giống mới, nhân giống làm ra nhiều cây", "explain": "Chọn, tạo giống: tạo ra giống mới tốt hơn. Nhân giống: tạo ra số lượng lớn cây con từ giống đã có.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu trình tự đúng của công tác giống từ tạo giống mới đến sản xuất đại trà.", "answer": "chọn tạo giống, khảo nghiệm công nhận, nhân giống", "explain": "Trình tự: chọn, tạo ra giống mới; khảo nghiệm, công nhận giống; nhân giống để có số lượng lớn đưa vào sản xuất.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Chương IV gồm những bài học nào?", "options": ["A. Bài 11 (giống), Bài 12 (chọn, tạo giống), Bài 13 (nhân giống).", "B. Bài 7, 8, 9.", "C. Bài 1, 2, 3.", "D. Chỉ có 1 bài."], "answer": "A", "explain": "Chương IV: Bài 11 khái niệm và vai trò giống; Bài 12 chọn, tạo giống; Bài 13 nhân giống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các phương pháp sau, phương pháp nào thuộc nhóm chọn, tạo giống?", "options": ["A. Lai hữu tính.", "B. Giâm cành.", "C. Chiết cành.", "D. Ghép."], "answer": "A", "explain": "Lai hữu tính là phương pháp chọn, tạo giống; giâm, chiết, ghép là nhân giống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các phương pháp sau, phương pháp nào thuộc nhóm nhân giống?", "options": ["A. Chiết cành.", "B. Gây đột biến.", "C. Chuyển gen.", "D. Chọn lọc cá thể."], "answer": "A", "explain": "Chiết cành là nhân giống vô tính; các đáp án còn lại thuộc chọn, tạo giống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một nông dân thực hiện: mua hạt giống F1 mới mỗi vụ; chọn cây tốt giữ giống rau; chiết cành nhân bưởi ngon. Đánh giá đúng là gì?", "options": ["A. Vận dụng tốt kiến thức chương IV: dùng hạt F1, chọn lọc giữ giống, nhân vô tính giữ đặc tính.", "B. Sai vì mua hạt F1 tốn tiền.", "C. Sai vì không nên chiết cành.", "D. Không đánh giá được."], "answer": "A", "explain": "Các việc làm đều đúng: hạt F1 tận dụng ưu thế lai; chọn lọc giữ giống; chiết giữ đặc tính mẹ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các việc làm sau, việc nào sai với kiến thức chương IV?", "options": ["A. Dùng hạt thu từ ruộng ngô lai F1 làm giống vụ sau.", "B. Mua hạt lai F1 mới mỗi vụ.", "C. Ghép mắt cam ngon lên gốc khỏe.", "D. Chọn bông lúa tốt làm giống."], "answer": "A", "explain": "Hạt F2 mất ưu thế lai, năng suất giảm — sai. Các việc còn lại đều đúng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một địa phương muốn phát triển bền vững: vừa có giống mới năng suất cao, vừa giữ được giống đặc sản địa phương. Giải pháp tổng hợp đúng là gì?", "options": ["A. Lai tạo giống mới kết hợp bảo tồn, nhân giống đặc sản bằng chiết, ghép, nuôi cấy mô.", "B. Chỉ trồng giống mới.", "C. Chỉ trồng giống cũ.", "D. Không cần làm gì."], "answer": "A", "explain": "Kết hợp: chọn tạo giống mới nâng năng suất + bảo tồn, nhân giống đặc sản bằng vô tính.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định tổng hợp chương IV:", "statements": ["a) Giống cây trồng có đặc tính di truyền ổn định.", "b) Lai hữu tính kết hợp được đặc tính tốt của bố và mẹ.", "c) Nhân giống vô tính cho cây con giống hệt mẹ.", "d) Gieo hạt luôn giữ nguyên đặc tính cây mẹ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: dễ phân li tính trạng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Một nhóm học sinh thảo luận, xét tính đúng, sai của các kết luận sau:", "statements": ["a) Giống tốt phải đi đôi với kĩ thuật canh tác tốt.", "b) Chọn, tạo giống làm ra giống mới; nhân giống làm ra nhiều cây.", "c) Bảo quản giống đúng cách giúp giữ chất lượng giống.", "d) Cứ nhân giống thật nhiều là có giống tốt."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: nhân nhiều mà giống xấu thì vẫn xấu; cần giống tốt trước.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu tên 3 bài trong chương IV và nội dung chính mỗi bài (ngắn gọn).", "answer": "bài 11 khái niệm vai trò giống, bài 12 chọn tạo giống, bài 13 nhân giống", "explain": "Bài 11: khái niệm và vai trò của giống cây trồng. Bài 12: một số phương pháp chọn, tạo giống. Bài 13: nhân giống cây trồng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu khẩu hiệu hành động về công tác giống mà em tâm đắc nhất. (Gợi ý: giống tốt, đúng kĩ thuật)", "answer": "giống tốt đi đôi với kĩ thuật tốt", "explain": "Ví dụ: \"Giống tốt đi đôi với kĩ thuật tốt — vì mùa vàng bội thu\". Chấp nhận câu trả lời hợp lí.", "points": 0.5}]}]}</script>
