 xử lí nước thải bằng vi sinh, kinh tế tuần hoàn (nêu một là được).", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên tắc '4 đúng' áp dụng cho đối tượng nào?", "answer": "A", "explain": "4 đúng (đúng loại, đúng liều, đúng lúc, đúng cách) là nguyên tắc vàng khi sử dụng phân bón và thuốc BVTV.", "points": 0.25, "options": ["A. Phân bón và thuốc bảo vệ thực vật.", "B. Chỉ áp dụng cho giống cây trồng.", "C. Chỉ áp dụng cho nước tưới.", "D. Chỉ áp dụng cho máy móc."]}, {"type": "mcq", "level": "NB", "q": "Điểm giống nhau giữa nông nghiệp hữu cơ và VietGAP là gì?", "answer": "A", "explain": "Cả hai đều mục tiêu an toàn thực phẩm, BVMT; khác nhau ở mức độ cho phép dùng hóa chất.", "points": 0.25, "options": ["A. Đều hướng tới nông sản an toàn, bảo vệ môi trường và sức khỏe con người.", "B. Đều cấm hoàn toàn hóa chất.", "C. Đều không cần chứng nhận.", "D. Đều cho năng suất như nhau."]}, {"type": "mcq", "level": "TH", "q": "Chế phẩm Trichoderma dùng để làm gì?", "answer": "A", "explain": "Trichoderma là nấm đối kháng dùng ủ compost: phân hủy xenlulozo nhanh, ức chế nấm bệnh.", "points": 0.25, "options": ["A. Ủ phân compost: phân hủy nhanh chất xơ, rút ngắn thời gian ủ, hạn chế nấm bệnh.", "B. Phun lên lá để diệt sâu ăn lá.", "C. Tưới để diệt cỏ dại.", "D. Không có tác dụng."]}, {"type": "mcq", "level": "TH", "q": "Bã thải sau hầm biogas có đặc điểm gì?", "answer": "A", "explain": "Qua phân hủy kị khí, bã biogas hoai mục, giảm mầm bệnh, giàu dinh dưỡng — phân bón tốt cho cây trồng.", "points": 0.25, "options": ["A. Đã hoai mục, ít mầm bệnh, giàu dinh dưỡng — dùng làm phân bón tốt.", "B. Độc hại, phải đổ bỏ.", "C. Không dùng được.", "D. Gây ô nhiễm nặng hơn phân tươi."]}, {"type": "mcq", "level": "VD", "q": "Xã em có phong trào thu gom chai lọ thuốc BVTV. Việc làm này thuộc giải pháp nào của chương VIII?", "answer": "A", "explain": "Thu gom bao bì, chai lọ là một trong các giải pháp BVMT của Bài 26, ngăn ô nhiễm đất, nguồn nước.", "points": 0.25, "options": ["A. Thu gom, xử lí bao bì, chai lọ — giải pháp BVMT trong trồng trọt (Bài 26).", "B. Kinh tế tuần hoàn.", "C. Ủ phân compost.", "D. Không thuộc giải pháp nào."]}, {"type": "mcq", "level": "VDC", "q": "Phân tích: Vì sao kết hợp biogas với ủ compost tạo hiệu quả cao hơn dùng riêng lẻ?", "answer": "A", "explain": "Kết hợp: phân tươi → biogas (lấy khí) → bã → ủ compost (hoàn thiện phân bón) — tận dụng tối đa, khép kín.", "points": 0.25, "options": ["A. Vì biogas xử lí phân tươi tạo khí đốt, bã biogas đem ủ compost tiếp thành phân bón hoàn chỉnh — tận dụng triệt để.", "B. Vì hai công nghệ đối lập nhau.", "C. Không nên kết hợp.", "D. Kết hợp làm giảm hiệu quả."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vi phạm đúng liều lượng.", "points": 1, "statements": ["a) 4 đúng: đúng loại, đúng liều lượng, đúng lúc, đúng cách.", "b) Cần đảm bảo thời gian cách li sau phun thuốc.", "c) Vỏ chai thuốc phải thu gom, không vứt bừa bãi.", "d) Có thể phun thuốc quá liều để diệt nhanh."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: trái với IPM.", "points": 1, "statements": ["a) Hữu cơ cấm hoàn toàn hóa chất; VietGAP cho dùng đúng quy định.", "b) Cả hai đều hướng tới nông sản an toàn, BVMT.", "c) IPM giảm tối đa thuốc hóa học.", "d) Nên phun thuốc hóa học định kì để phòng bệnh."]}, {"type": "short", "level": "NB", "q": "Nguyên tắc 4 đúng gồm những gì?", "answer": "đúng loại, đúng liều lượng, đúng lúc, đúng cách", "explain": "4 đúng: đúng loại (đúng thuốc), đúng liều lượng, đúng lúc, đúng cách.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Khí biogas chủ yếu là khí gì?", "answer": "methane", "explain": "Khí biogas chủ yếu là methane (CH4), cháy được dùng đun nấu, phát điện.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Hành vi nào sau đây vi phạm quy định bảo vệ môi trường trong trồng trọt?", "answer": "A", "explain": "Xả thải chưa xử lí gây ô nhiễm nguồn nước, vi phạm quy định BVMT; các phương án còn lại đều là hành vi đúng.", "points": 0.25, "options": ["A. Xả nước thải chăn nuôi chưa xử lí ra kênh mương.", "B. Ủ phân compost từ rơm rạ.", "C. Thu gom chai lọ thuốc BVTV.", "D. Bón phân theo nguyên tắc 4 đúng."]}, {"type": "mcq", "level": "NB", "q": "IPM (phòng trừ tổng hợp) có vai trò gì trong bảo vệ môi trường?", "answer": "A", "explain": "IPM ưu tiên biện pháp sinh học, canh tác; thuốc hóa học là giải pháp cuối cùng → giảm ô nhiễm môi trường.", "points": 0.25, "options": ["A. Giảm tối đa việc dùng thuốc hóa học nhờ kết hợp nhiều biện pháp — giảm ô nhiễm.", "B. Tăng lượng thuốc sử dụng.", "C. Không có vai trò.", "D. Chỉ để tăng năng suất."]}, {"type": "mcq", "level": "TH", "q": "Đệm lót sinh học trong chăn nuôi có tác dụng gì với môi trường?", "answer": "A", "explain": "Đệm lót sinh học (chất độn + vi sinh) xử lí phân tại chỗ, khử mùi, giảm ô nhiễm và tạo phân bón.", "points": 0.25, "options": ["A. Hút ẩm, khử mùi hôi, phân hủy phân; hết vụ thành phân bón — giảm ô nhiễm chuồng trại.", "B. Làm chuồng đẹp hơn.", "C. Không có tác dụng.", "D. Làm tăng mùi hôi."]}, {"type": "mcq", "level": "TH", "q": "Nước thải sau xử lí đạt chuẩn có thể dùng để làm gì?", "answer": "A", "explain": "Nước sau xử lí đạt chuẩn tái dùng tưới cây — tiết kiệm nước, giảm xả thải.", "points": 0.25, "options": ["A. Tái sử dụng để tưới cây trồng.", "B. Uống trực tiếp.", "C. Thải ra đâu cũng được.", "D. Không dùng được."]}, {"type": "mcq", "level": "VD", "q": "Một cơ sở chế biến nông sản xả thải gây cá chết ở suối. Theo chương VIII, cần yêu cầu cơ sở làm gì?", "answer": "A", "explain": "Phải xử lí nước thải đạt chuẩn (lắng, lọc sinh học, chế phẩm vi sinh) mới được thải; khuyến khích tái sử dụng.", "points": 0.25, "options": ["A. Xây hệ thống xử lí (lắng, lọc sinh học, vi sinh) đạt chuẩn trước khi thải; tái sử dụng nước.", "B. Xả vào ban đêm.", "C. Đóng cửa cơ sở vĩnh viễn ngay.", "D. Mặc kệ."]}, {"type": "mcq", "level": "VDC", "q": "So sánh hiệu quả môi trường: đốt rơm rạ so với trồng nấm rơm từ rơm rạ. Kết luận nào đúng?", "answer": "A", "explain": "Trồng nấm: tận dụng rơm, không khói bụi, thu nhập cao, bã làm phân; đốt: ô nhiễm + lãng phí — trồng nấm vượt trội toàn diện.", "points": 0.25, "options": ["A. Trồng nấm không phát thải, cho thu nhập cao, bã làm phân; đốt gây ô nhiễm, lãng phí — trồng nấm vượt trội.", "B. Đốt tốt hơn.", "C. Hai cách như nhau.", "D. Trồng nấm gây ô nhiễm hơn."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chỉ nhận chất hữu cơ.", "points": 1, "statements": ["a) Ủ compost cần đảo trộn định kì để thoáng khí.", "b) Compost đạt khi tơi xốp, nâu đen, không mùi hôi.", "c) Hầm biogas phải xây kín để giữ kị khí và thu khí.", "d) Có thể nạp nilon, pin cũ vào hầm biogas."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: gây ô nhiễm, cá chết.", "points": 1, "statements": ["a) Bã biogas làm phân bón tốt cho cây trồng.", "b) Khí biogas dùng đun nấu, phát điện.", "c) Nước thải chăn nuôi phải xử lí trước khi thải.", "d) Có thể xả nước thải trực tiếp xuống ao cá."]}, {"type": "short", "level": "TH", "q": "Phân biệt nông nghiệp hữu cơ và VietGAP về sử dụng hóa chất.", "answer": "hữu cơ cấm hoàn toàn, VietGAP cho dùng đúng quy định", "explain": "Hữu cơ: zero hóa chất tổng hợp; VietGAP: được dùng phân bón, thuốc hóa học nhưng đúng quy định, đảm bảo cách li.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nêu công thức nhớ phân biệt ủ compost và hầm biogas.", "answer": "hiếu khí là compost, kị khí là biogas", "explain": "Hiếu khí (có ôxy, đảo trộn) = compost tạo phân bón; kị khí (hầm kín) = biogas tạo khí đốt + phân bón.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Vì sao bảo vệ đa dạng sinh học quan trọng trong trồng trọt?", "answer": "A", "explain": "Ong thụ phấn tăng đậu quả; thiên địch kiểm soát sâu hại — mất đa dạng sinh học phải phụ thuộc nhiều hơn vào hóa chất.", "points": 0.25, "options": ["A. Vì sinh vật có ích (ong, thiên địch) giúp thụ phấn và kiểm soát sâu hại tự nhiên.", "B. Vì để ngắm cảnh.", "C. Không quan trọng.", "D. Vì làm tăng sâu bệnh."]}, {"type": "mcq", "level": "NB", "q": "Thuốc trừ sâu phổ rộng gây hại cho môi trường như thế nào?", "answer": "A", "explain": "Thuốc phổ rộng: diệt thiên địch → sâu bùng phát lại; sâu kháng thuốc; tồn dư ô nhiễm — tác hại nhiều mặt.", "points": 0.25, "options": ["A. Diệt cả thiên địch, gây kháng thuốc, tồn dư ô nhiễm đất, nước.", "B. Chỉ diệt sâu hại, không hại gì khác.", "C. Làm đất tốt hơn.", "D. Không có hại."]}, {"type": "mcq", "level": "TH", "q": "Phân bón vi sinh khác phân hóa học ở điểm nào?", "answer": "A", "explain": "Phân vi sinh: vi sinh vật cố định đạm, phân giải lân — an toàn, cải tạo đất; nhược điểm là chậm hơn phân hóa học.", "points": 0.25, "options": ["A. An toàn, cải tạo đất, ít ô nhiễm; nhưng tác dụng chậm hơn.", "B. Tác dụng nhanh hơn hẳn.", "C. Độc hại hơn.", "D. Không có điểm khác."]}, {"type": "mcq", "level": "TH", "q": "Khi nào nên dùng thuốc trừ sâu sinh học thay cho thuốc hóa học?", "answer": "A", "explain": "Thuốc sinh học phù hợp IPM, hữu cơ, VietGAP: an toàn, ít kháng thuốc, bảo vệ thiên địch — dùng khi sâu chưa bùng phát mạnh.", "points": 0.25, "options": ["A. Khi sâu ở mật độ thấp, trong IPM, sản xuất hữu cơ, VietGAP — để an toàn, bền vững.", "B. Không bao giờ nên dùng.", "C. Chỉ khi hết thuốc hóa học.", "D. Dùng bừa bãi."]}, {"type": "mcq", "level": "VD", "q": "Vườn rau của trường bị rệp. Nhóm em muốn xử lí theo hướng BVMT. Nên làm gì?", "answer": "A", "explain": "Hướng BVMT: biện pháp thủ công, thảo mộc, thiên địch trước; chế phẩm sinh học khi cần — không dùng hóa chất.", "points": 0.25, "options": ["A. Bắt bằng tay, phun dung dịch tỏi ớt, thả bọ rùa; chỉ dùng chế phẩm sinh học khi cần.", "B. Phun thuốc hóa học liều cao.", "C. Nhổ bỏ cả vườn.", "D. Để mặc kệ."]}, {"type": "mcq", "level": "VDC", "q": "Đánh giá: Mô hình 'trường học xanh' ủ compost từ rác hữu cơ căng tin. Ý nghĩa của mô hình?", "answer": "A", "explain": "Mô hình giáo dục: giảm rác, tự tạo phân bón, học sinh thực hành kiến thức Bài 27 và hình thành ý thức BVMT.", "points": 0.25, "options": ["A. Giảm rác thải, tạo phân bón cho vườn trường, giáo dục ý thức BVMT cho học sinh.", "B. Không có ý nghĩa.", "C. Chỉ để cho vui.", "D. Gây ô nhiễm trường học."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1, "statements": ["a) Bón thừa đạm làm tăng phát thải khí N2O gây biến đổi khí hậu.", "b) Không đốt rơm rạ giúp giảm phát thải CO2.", "c) Ủ compost, biogas góp phần giảm phát thải khí nhà kính.", "d) Trồng trọt không liên quan đến biến đổi khí hậu."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1, "statements": ["a) Ong thụ phấn giúp tăng đậu quả; thiên địch kiểm soát sâu hại.", "b) Thuốc phổ rộng diệt cả thiên địch khiến sâu bùng phát trở lại.", "c) Nên tránh phun lúc hoa nở rộ để bảo vệ ong.", "d) Đa dạng sinh học không quan trọng trong trồng trọt."]}, {"type": "short", "level": "TH", "q": "Vì sao không được đổ thuốc trừ sâu vào hầm biogas?", "answer": "vì diệt vi sinh vật, hầm ngừng sinh khí", "explain": "Thuốc trừ sâu, kháng sinh diệt vi sinh vật kị khí khiến hầm 'chết', ngừng sinh khí.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nêu một việc học sinh có thể làm để góp phần BVMT trong trồng trọt.", "answer": "ủ compost rác hữu cơ", "explain": "Các việc: ủ compost, phân loại rác, tuyên truyền không đốt rơm rạ, thu gom chai lọ (nêu một là được).", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Khí N2O sinh ra từ bón thừa đạm có tác hại gì?", "answer": "A", "explain": "N2O có khả năng giữ nhiệt gấp khoảng 300 lần CO2; bón thừa đạm làm tăng phát thải N2O từ đất.", "points": 0.25, "options": ["A. Là khí nhà kính mạnh, góp phần gây biến đổi khí hậu.", "B. Làm không khí trong lành hơn.", "C. Không có tác hại.", "D. Giúp cây quang hợp."]}, {"type": "mcq", "level": "NB", "q": "Biện pháp nào giúp giảm phát thải khí nhà kính trong trồng trọt?", "answer": "A", "explain": "Bón đúng liều giảm N2O; không đốt giảm CO2; compost, biogas tận dụng chất thải — giảm phát thải tổng thể.", "points": 0.25, "options": ["A. Bón đạm đúng liều, không đốt rơm rạ, ủ compost, dùng biogas.", "B. Bón thật nhiều đạm.", "C. Đốt rơm rạ thường xuyên.", "D. Xả thải bừa bãi."]}, {"type": "mcq", "level": "TH", "q": "Ủ chua rơm rạ làm thức ăn gia súc dựa trên nguyên lí nào?", "answer": "A", "explain": "Ủ chua: nén kín yếm khí, vi sinh vật lên men làm mềm rơm, tăng đạm (ủ với urê), dự trữ thức ăn mùa khô.", "points": 0.25, "options": ["A. Lên men yếm khí làm mềm chất xơ, tăng dinh dưỡng, bảo quản lâu.", "B. Phơi nắng.", "C. Đốt thành than.", "D. Ngâm nước lã."]}, {"type": "mcq", "level": "TH", "q": "Trồng nấm sò từ rơm rạ mang lại lợi ích gì?", "answer": "A", "explain": "Nấm sò: nguyên liệu rẻ, thời gian ngắn, giá trị cao; bã trồng nấm làm phân bón tốt — lợi ích kép.", "points": 0.25, "options": ["A. Thu nhập cao từ phụ phẩm bỏ đi; bã nấm làm phân bón; không gây ô nhiễm.", "B. Không có lợi ích.", "C. Gây ô nhiễm.", "D. Tốn công vô ích."]}, {"type": "mcq", "level": "VD", "q": "Hợp tác xã có 100 tấn rơm mỗi vụ. Phương án tận dụng tổng hợp nào tốt nhất?", "answer": "A", "explain": "Đa dạng hóa: nấm (thu nhập cao), compost (phân bón), ủ chua (thức ăn) + đầu ra ổn định — tối ưu giá trị rơm rạ.", "points": 0.25, "options": ["A. Chia ra: một phần trồng nấm, một phần ủ compost, một phần ủ chua; liên kết tiêu thụ.", "B. Đốt hết.", "C. Bỏ đống.", "D. Đổ xuống sông."]}, {"type": "mcq", "level": "VDC", "q": "Tính toán: 100 tấn rơm ủ compost thu hồi 45%. Được bao nhiêu phân compost?", "answer": "A", "explain": "100 tấn x 45% = 45 tấn phân compost — lượng phân hữu cơ lớn thay thế đáng kể phân hóa học.", "points": 0.25, "options": ["A. Khoảng 45 tấn.", "B. 100 tấn.", "C. 10 tấn.", "D. 200 tấn."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chậm hơn nhưng bền vững.", "points": 1, "statements": ["a) Phân vi sinh an toàn, cải tạo đất hơn phân hóa học.", "b) Thuốc sinh học chọn lọc, ít độc với người và thiên địch.", "c) Nên kết hợp phân vi sinh với phân hữu cơ.", "d) Thuốc sinh học tác dụng nhanh hơn thuốc hóa học."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: bã nấm làm phân bón tốt.", "points": 1, "statements": ["a) Rơm rạ trồng nấm cho thu nhập cao hơn đốt bỏ nhiều lần.", "b) Ủ chua rơm rạ dựa trên lên men yếm khí.", "c) Đệm lót sinh học khử mùi, hết vụ thành phân bón.", "d) Bã nấm sau trồng không dùng được vào việc gì."]}, {"type": "short", "level": "VD", "q": "Giải thích vì sao bón thừa đạm góp phần gây biến đổi khí hậu.", "answer": "vì sinh ra khí N2O là khí nhà kính mạnh", "explain": "Đạm thừa → vi sinh vật đất thải N2O, khí nhà kính mạnh gấp khoảng 300 lần CO2.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Hầm biogas ít sinh khí. Nêu hai nguyên nhân có thể.", "answer": "thiếu nguyên liệu và rò rỉ khí", "explain": "Các nguyên nhân: nạp quá ít, rò rỉ khí, nhiệt độ thấp, vi sinh bị ức chế bởi hóa chất (nêu hai là được).", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trong chương VIII, 'vấn đề' và 'giải pháp' được phân bố ở hai bài như thế nào?", "answer": "A", "explain": "Cấu trúc chương: Bài 26 (vấn đề → cần thiết → giải pháp chung), Bài 27 (giải pháp công nghệ vi sinh chi tiết).", "points": 0.25, "options": ["A. Bài 26 nêu vấn đề ô nhiễm và giải pháp chung; Bài 27 trình bày giải pháp vi sinh cụ thể.", "B. Cả hai bài đều chỉ nêu vấn đề.", "C. Cả hai bài đều chỉ nêu giải pháp.", "D. Hai bài không liên quan."]}, {"type": "mcq", "level": "NB", "q": "Công thức nhớ nào giúp phân biệt ủ compost và hầm biogas?", "answer": "A", "explain": "Nhớ: có ôxy đảo trộn → compost (phân); kín không ôxy → biogas (khí + phân).", "points": 0.25, "options": ["A. Hiếu khí (có ôxy) = compost tạo phân bón; kị khí (kín) = biogas tạo khí đốt + phân bón.", "B. Hai công nghệ giống nhau.", "C. Compost tạo khí đốt.", "D. Biogas không tạo phân bón."]}, {"type": "mcq", "level": "TH", "q": "Vì sao hầm biogas phải nạp nguyên liệu đều đặn?", "answer": "A", "explain": "Vi sinh vật kị khí cần thức ăn liên tục; nạp đều đặn giữ quá trình phân hủy ổn định, sinh khí đều.", "points": 0.25, "options": ["A. Vì vi sinh vật cần nguồn thức ăn ổn định để sinh khí đều; ngừng nạp sẽ giảm khí.", "B. Vì hầm sẽ hỏng nếu không nạp.", "C. Không cần đều đặn.", "D. Vì nạp nhiều một lần tốt hơn."]}, {"type": "mcq", "level": "TH", "q": "Dấu hiệu hầm biogas hoạt động tốt là gì?", "answer": "A", "explain": "Hầm tốt: khí đều, hết mùi hôi chuồng trại, bã hoai mục — chứng tỏ phân hủy hiệu quả.", "points": 0.25, "options": ["A. Sinh khí đều, đủ đun nấu; giảm mùi hôi; bã thải hoai mục.", "B. Không sinh khí.", "C. Mùi hôi nồng nặc.", "D. Bã thải tươi nguyên."]}, {"type": "mcq", "level": "VD", "q": "Hầm biogas ít sinh khí. Nguyên nhân có thể là gì?", "answer": "A", "explain": "Ít khí do: thiếu nguyên liệu, rò rỉ, lạnh, hoặc vi sinh bị diệt bởi hóa chất/kháng sinh trong phân — cần kiểm tra từng nguyên nhân.", "points": 0.25, "options": ["A. Nạp quá ít, rò rỉ khí, nhiệt độ thấp hoặc vi sinh vật bị ức chế (hóa chất, kháng sinh).", "B. Hầm quá tốt.", "C. Phân quá nhiều dinh dưỡng.", "D. Không có nguyên nhân."]}, {"type": "mcq", "level": "VDC", "q": "Để hầm biogas hoạt động ổn định lâu dài, cần làm gì?", "answer": "A", "explain": "Bảo dưỡng: nạp đều, tránh hóa chất diệt vi sinh, kiểm tra kín, xả bã định kì — hầm bền, khí đều.", "points": 0.25, "options": ["A. Nạp đều đặn, không đổ hóa chất vào hầm, kiểm tra độ kín định kì, xả bã đúng lúc.", "B. Không cần chăm sóc.", "C. Đổ thêm thuốc trừ sâu vào hầm.", "D. Mở nắp hầm thường xuyên."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nguy cơ cháy nổ, tuyệt đối không.", "points": 1, "statements": ["a) Hiếu khí = compost (phân bón); kị khí = biogas (khí + phân).", "b) Nạp phân cho biogas cần đều đặn để sinh khí ổn định.", "c) Không đổ thuốc trừ sâu, kháng sinh vào hầm biogas.", "d) Có thể dùng lửa để thử chỗ rò rỉ khí biogas."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đó là mô hình tuyến tính.", "points": 1, "statements": ["a) Mô hình tuyến tính: dùng một lần rồi bỏ, gây ô nhiễm, lãng phí.", "b) Mô hình tuần hoàn: chất thải thành nguyên liệu, khép kín.", "c) VAC + biogas là ví dụ kinh tế tuần hoàn.", "d) Đốt rơm, xả phân ra sông là kinh tế tuần hoàn."]}, {"type": "short", "level": "VD", "q": "Nêu hai việc cần làm để bảo dưỡng hầm biogas ổn định lâu dài.", "answer": "nạp đều đặn và kiểm tra độ kín", "explain": "Các việc: nạp nguyên liệu đều đặn, không đổ hóa chất, kiểm tra độ kín định kì, xả bã đúng lúc (nêu hai là được).", "points": 0.5}, {"type": "short", "level": "VD", "q": "Vì sao mô hình tuần hoàn cần phương án dự phòng?", "answer": "vì một khâu sự cố ảnh hưởng cả vòng khép kín", "explain": "Vòng khép kín liên đới: dịch bệnh, hỏng biogas ở một khâu lan sang các khâu khác nên cần dự phòng.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Mô hình kinh tế tuần hoàn khác mô hình tuyến tính ở điểm nào?", "answer": "A", "explain": "Tuyến tính: khai thác → dùng → bỏ (ô nhiễm, lãng phí); tuần hoàn: chất thải → tài nguyên, khép kín, bền vững.", "points": 0.25, "options": ["A. Tuần hoàn: chất thải thành nguyên liệu, khép kín; tuyến tính: dùng một lần rồi bỏ đi gây ô nhiễm.", "B. Hai mô hình giống nhau.", "C. Tuyến tính tốt hơn.", "D. Không có điểm khác."]}, {"type": "mcq", "level": "NB", "q": "Ví dụ nào sau đây KHÔNG phải kinh tế tuần hoàn?", "answer": "A", "explain": "Phương án A là mô hình tuyến tính gây ô nhiễm, lãng phí; các phương án còn lại đều khép kín tuần hoàn.", "points": 0.25, "options": ["A. Đốt rơm rạ, xả phân ra sông, mua phân hóa học về bón.", "B. Rơm nuôi bò – phân vào biogas – bã bón rau.", "C. Bã nấm trồng nấm làm phân bón.", "D. Nước thải xử lí tái dùng tưới cây."]}, {"type": "mcq", "level": "TH", "q": "Lợi ích kinh tế của mô hình VAC + biogas là gì?", "answer": "A", "explain": "VAC + biogas: tiết kiệm chi phí gas, phân bón; thu nhập đa dạng (cây, con, nấm); tránh phạt ô nhiễm — lợi ích kép.", "points": 0.25, "options": ["A. Tiết kiệm gas, phân bón; tăng thu nhập từ nhiều nguồn; giảm chi phí xử lí ô nhiễm.", "B. Không có lợi ích kinh tế.", "C. Tốn kém hơn.", "D. Chỉ có lợi ích môi trường."]}, {"type": "mcq", "level": "TH", "q": "Để xây dựng 'xã nông nghiệp tuần hoàn', cần sự tham gia của ai?", "answer": "A", "explain": "Tuần hoàn quy mô xã cần: chính sách hỗ trợ, hợp tác xã tổ chức, nông dân thực hiện, doanh nghiệp bao tiêu — đồng bộ.", "points": 0.25, "options": ["A. Chính quyền, hợp tác xã, nông dân, doanh nghiệp — đồng bộ từ chính sách đến thực hành.", "B. Chỉ cần một hộ.", "C. Chỉ cần chính quyền.", "D. Không cần ai."]}, {"type": "mcq", "level": "VD", "q": "Học sinh có thể góp phần xây dựng nông nghiệp tuần hoàn bằng việc gì?", "answer": "A", "explain": "Học sinh góp phần bằng hành động nhỏ: ủ compost, phân loại rác, tuyên truyền — lan tỏa ý thức tuần hoàn.", "points": 0.25, "options": ["A. Thực hành ủ compost rác hữu cơ ở trường, tuyên truyền không đốt rơm rạ, phân loại rác.", "B. Không làm được gì.", "C. Xả rác bừa bãi.", "D. Đốt rác."]}, {"type": "mcq", "level": "VDC", "q": "Tầm nhìn: Nông nghiệp tuần hoàn ở Việt Nam đến 2030 có thể đạt gì?", "answer": "A", "explain": "Với chính sách và nhận thức hiện nay, Việt Nam có thể nhân rộng mô hình tuần hoàn, hướng tới nông nghiệp xanh, bền vững.", "points": 0.25, "options": ["A. Nhiều vùng khép kín chất thải, giảm ô nhiễm, nông sản an toàn, nông dân thu nhập cao, bền vững.", "B. Không thay đổi.", "C. Biến mất.", "D. Chỉ trên giấy."]}, {"type": "truefalse", "level": "VD", "q": "Tình huống: Thôn 200 hộ đốt rơm rạ, xả thải chăn nuôi. Xét tính đúng, sai của các giải pháp:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: đồng bộ. d) Sai: cần hỗ trợ song hành.", "points": 1, "statements": ["a) Hỗ trợ máy cuộn rơm, ủ compost, trồng nấm.", "b) Xây hầm biogas hộ và tập trung xử lí phân.", "c) Thu gom bao bì, tập huấn 4 đúng.", "d) Chỉ phạt nặng mà không hỗ trợ."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nóng vội dễ thất bại.", "points": 1, "statements": ["a) Yếu tố con người (đồng thuận) quyết định thành công giải pháp BVMT.", "b) Trang trại tuần hoàn cần phương án dự phòng khi một khâu sự cố.", "c) Nên bắt đầu mô hình tuần hoàn từ quy mô vừa phải.", "d) Làm thật lớn ngay từ đầu luôn thành công."]}, {"type": "short", "level": "VD", "q": "Phân biệt mô hình tuyến tính và mô hình tuần hoàn.", "answer": "tuyến tính dùng một lần rồi bỏ, tuần hoàn khép kín chất thải thành nguyên liệu", "explain": "Tuyến tính: khai thác → dùng → bỏ (ô nhiễm); tuần hoàn: chất thải khâu này là nguyên liệu khâu khác, khép kín.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu hai lợi ích kinh tế của mô hình VAC + biogas.", "answer": "tiết kiệm gas và tiết kiệm phân bón", "explain": "Các lợi ích: tiết kiệm gas đun nấu, tiết kiệm phân bón, tăng thu nhập đa dạng, tránh phạt ô nhiễm (nêu hai là được).", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các chất thải sau, chất thải nào có thể đưa vào hầm biogas?", "answer": "A", "explain": "Biogas chỉ nhận chất hữu cơ phân hủy được; nilon, nhựa, pin, thủy tinh không phân hủy, pin còn gây ô nhiễm.", "points": 0.25, "options": ["A. Phân chuồng, phụ phẩm trồng trọt mềm, thức ăn thừa.", "B. Nilon, chai nhựa.", "C. Pin, ắc quy.", "D. Thủy tinh."]}, {"type": "mcq", "level": "NB", "q": "Vì sao không được đổ thuốc trừ sâu, kháng sinh vào hầm biogas?", "answer": "A", "explain": "Hóa chất, kháng sinh diệt vi sinh vật kị khí → hầm 'chết', ngừng sinh khí — tuyệt đối tránh.", "points": 0.25, "options": ["A. Vì sẽ diệt vi sinh vật phân hủy, làm hầm ngừng sinh khí.", "B. Vì làm tăng sinh khí.", "C. Không sao cả.", "D. Vì tốn thuốc."]}, {"type": "mcq", "level": "TH", "q": "Bã biogas cần xử lí thêm gì trước khi bón cho rau ăn lá?", "answer": "A", "explain": "Bã biogas nên ủ thêm/ phơi ải để hoai hoàn toàn, đảm bảo an toàn vệ sinh trước khi bón cho rau ăn trực tiếp.", "points": 0.25, "options": ["A. Ủ thêm với chế phẩm vi sinh (hoặc phơi ải) để hoai hoàn toàn, đảm bảo vệ sinh.", "B. Bón trực tiếp ngay.", "C. Đổ bỏ.", "D. Trộn với thuốc trừ sâu."]}, {"type": "mcq", "level": "TH", "q": "Một hầm biogas gia đình bị tắc đường dẫn khí. Cách xử lí an toàn là gì?", "answer": "A", "explain": "Khí methane dễ cháy nổ: tuyệt đối không dùng lửa thử rò rỉ; khóa van, thông tắc an toàn hoặc nhờ thợ có kinh nghiệm.", "points": 0.25, "options": ["A. Khóa van, kiểm tra, thông tắc khi không có lửa gần; nếu không rành thì nhờ thợ.", "B. Dùng lửa để thử xem tắc ở đâu.", "C. Đập vỡ đường ống.", "D. Bỏ hầm."]}, {"type": "mcq", "level": "VD", "q": "An toàn khi sử dụng hầm biogas cần lưu ý gì?", "answer": "A", "explain": "Methane dễ cháy nổ, hầm kín thiếu ôxy: không lửa gần chỗ rò, không xuống hầm khi chưa thông thoáng, kiểm tra định kì.", "points": 0.25, "options": ["A. Không dùng lửa thử rò rỉ; thông thoáng khi vào hầm; kiểm tra độ kín định kì.", "B. Không cần lưu ý gì.", "C. Hút thuốc gần hầm.", "D. Để trẻ em chơi gần hầm."]}, {"type": "mcq", "level": "VDC", "q": "So sánh chi phí xử lí: phạt ô nhiễm so với đầu tư biogas. Nhận định nào đúng?", "answer": "A", "explain": "Phạt ô nhiễm ngày càng nặng; biogas vừa tránh phạt vừa sinh lợi (gas, phân) — đầu tư khôn ngoan dài hạn.", "points": 0.25, "options": ["A. Đầu tư biogas ban đầu tốn kém nhưng tránh phạt, có gas, phân bón — lợi hơn nhiều so với bị phạt và ô nhiễm.", "B. Chịu phạt rẻ hơn.", "C. Không nên đầu tư gì.", "D. Ô nhiễm không bị phạt."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1, "statements": ["a) Đầu tư biogas tránh phạt ô nhiễm, có gas, phân bón — lợi hơn chịu phạt.", "b) Hầm biogas ít khí do thiếu liệu, rò rỉ, lạnh hoặc vi sinh bị ức chế.", "c) Bảo dưỡng hầm: nạp đều, tránh hóa chất, kiểm tra kín định kì.", "d) Hầm biogas không cần bảo dưỡng gì."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1, "statements": ["a) Trường học ủ compost rác căng tin: giảm rác, có phân bón, giáo dục ý thức.", "b) Học sinh có thể tuyên truyền không đốt rơm rạ.", "c) Vườn trường bị rệp nên ưu tiên biện pháp sinh học, thủ công.", "d) Học sinh không thể góp phần BVMT."]}, {"type": "short", "level": "VDC", "q": "Đề xuất hai giải pháp tổng thể cho thôn vừa đốt rơm rạ vừa xả thải chăn nuôi.", "answer": "hỗ trợ thu gom rơm và xây hầm biogas", "explain": "Giải pháp: hỗ trợ máy cuộn rơm + tận dụng (nấm, compost); hầm biogas hộ/tập trung; thu gom bao bì; tập huấn (nêu hai là được).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao yếu tố con người quyết định thành công giải pháp BVMT?", "answer": "vì cần sự đồng thuận, tham gia của người dân", "explain": "Mọi giải pháp chỉ thành công khi người dân đồng thuận, tích cực tham gia cùng với sự hỗ trợ của chính quyền.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Tình huống tổng hợp: Một thôn có 200 hộ trồng lúa, đốt rơm rạ gây khói mù mịt; nhiều hộ nuôi lợn xả thải ra mương. Đề xuất giải pháp tổng thể theo chương VIII?", "answer": "A", "explain": "Giải pháp tổng thể: thu gom rơm (máy cuộn) + tận dụng (nấm, compost) + biogas xử lí phân + thu gom bao bì + đào tạo — đồng bộ, bền vững.", "points": 0.25, "options": ["A. Hỗ trợ máy cuộn rơm + ủ compost/trồng nấm; xây hầm biogas hộ và tập trung; thu gom bao bì; tập huấn 4 đúng.", "B. Cấm sản xuất nông nghiệp.", "C. Mặc kệ.", "D. Chỉ phạt nặng."]}, {"type": "mcq", "level": "NB", "q": "Để giải pháp trên thành công, yếu tố nào quan trọng nhất?", "answer": "A", "explain": "Mọi giải pháp BVMT chỉ thành công khi người dân đồng thuận tham gia, có chính quyền hỗ trợ — yếu tố con người quyết định.", "points": 0.25, "options": ["A. Sự đồng thuận, tham gia của người dân cùng với hỗ trợ của chính quyền.", "B. Chỉ cần tiền.", "C. Chỉ cần công nghệ.", "D. Không cần yếu tố nào."]}, {"type": "mcq", "level": "TH", "q": "Một doanh nghiệp muốn đầu tư 'trang trại tuần hoàn' 20 ha. Cần chuẩn bị những gì?", "answer": "A", "explain": "Trang trại tuần hoàn cần: vốn, kĩ thuật, thiết kế vòng khép kín, thị trường và tuân thủ môi trường — đồng bộ.", "points": 0.25, "options": ["A. Vốn, nhân lực kĩ thuật, thiết kế khép kín (trồng trọt – chăn nuôi – biogas – compost), đầu ra, đánh giá môi trường.", "B. Chỉ cần đất.", "C. Chỉ cần tiền.", "D. Không cần chuẩn bị."]}, {"type": "mcq", "level": "TH", "q": "Rủi ro lớn nhất khi vận hành trang trại tuần hoàn là gì?", "answer": "A", "explain": "Vòng khép kín liên đới: một khâu sự cố (dịch bệnh, hỏng biogas) lan sang các khâu khác — cần quản lí rủi ro, phương án dự phòng.", "points": 0.25, "options": ["A. Đứt gãy một khâu (dịch bệnh vật nuôi, hỏng hầm biogas) ảnh hưởng cả vòng tuần hoàn.", "B. Không có rủi ro.", "C. Rủi ro duy nhất là thiếu vốn.", "D. Rủi ro không đáng kể."]}, {"type": "mcq", "level": "VD", "q": "Giải pháp giảm thiểu rủi ro trên là gì?", "answer": "A", "explain": "Giảm rủi ro: đa dạng nguồn liệu, bảo dưỡng định kì, phòng dịch tốt, có phương án dự phòng khi một khâu sự cố.", "points": 0.25, "options": ["A. Đa dạng hóa khâu (nhiều nguồn nguyên liệu), dự phòng kĩ thuật, bảo hiểm, quản lí dịch bệnh tốt.", "B. Không cần giải pháp.", "C. Bỏ mô hình tuần hoàn.", "D. Chịu rủi ro."]}, {"type": "mcq", "level": "VDC", "q": "Bài học kinh nghiệm từ các mô hình tuần hoàn thành công là gì?", "answer": "A", "explain": "Kinh nghiệm: đi từ nhỏ đến lớn, chắc từng khâu, liên kết khâu chặt chẽ, kiên trì — không nóng vội.", "points": 0.25, "options": ["A. Bắt đầu từ quy mô vừa phải, làm tốt từng khâu, liên kết chặt chẽ và kiên trì.", "B. Làm thật lớn ngay từ đầu.", "C. Không cần học hỏi.", "D. Chỉ cần may mắn."]}, {"type": "truefalse", "level": "VDC", "q": "Phân tích: Nông dân áp dụng công nghệ cao nhưng xả thải bừa bãi. Xét tính đúng, sai:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1, "statements": ["a) Mô hình này chưa bền vững vì thiếu BVMT.", "b) Công nghệ cao phải đi đôi với BVMT mới đúng định hướng.", "c) Chương VII (công nghệ) và VIII (môi trường) bổ trợ nhau.", "d) Có công nghệ cao thì không cần quan tâm môi trường."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: bổ trợ nhau.", "points": 1, "statements": ["a) Tưới nhỏ giọt thuộc chương VII; compost, biogas, tuần hoàn thuộc chương VIII.", "b) Thông điệp chung: hiện đại hóa gắn với BVMT, hướng tới bền vững.", "c) Học sinh nên hành động: tiết kiệm tài nguyên, ủ compost, tuyên truyền.", "d) Hai chương VII và VIII mâu thuẫn nhau."]}, {"type": "short", "level": "VDC", "q": "Trình bày mối quan hệ giữa chương VII và chương VIII.", "answer": "chương VII hiện đại hóa sản xuất, chương VIII đảm bảo bền vững", "explain": "VII: phát triển sản xuất bằng công nghệ cao; VIII: đảm bảo phát triển đó thân thiện môi trường, bền vững — bổ trợ nhau.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu thông điệp chung của hai chương VII và VIII.", "answer": "hiện đại hóa gắn với bảo vệ môi trường, hướng tới bền vững", "explain": "Thông điệp: phát triển trồng trọt hiện đại bằng công nghệ cao gắn liền với BVMT, hướng tới nông nghiệp bền vững.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Câu hỏi tích hợp chương VII – VIII: Trang trại rau công nghệ cao (nhà màng, tưới nhỏ giọt) muốn thêm mô hình tuần hoàn. Nên làm gì?", "answer": "A", "explain": "Tích hợp: công nghệ cao (Bài 24) + tuần hoàn (Bài 27) + VietGAP (Bài 26) — mô hình nông nghiệp hiện đại, bền vững toàn diện.", "points": 0.25, "options": ["A. Tận dụng phụ phẩm rau ủ compost bón lại; nước thải xử lí vi sinh tái tưới; theo VietGAP.", "B. Đốt phụ phẩm rau.", "C. Xả nước thải ra sông.", "D. Không cần làm gì thêm."]}, {"type": "mcq", "level": "NB", "q": "Mối quan hệ giữa chương VII và chương VIII là gì?", "answer": "A", "explain": "VII: hiện đại hóa sản xuất; VIII: BVMT trong sản xuất — hai mặt của nông nghiệp bền vững, bổ trợ nhau.", "points": 0.25, "options": ["A. Chương VII phát triển sản xuất bằng công nghệ cao; chương VIII đảm bảo phát triển đó bền vững, thân thiện môi trường.", "B. Hai chương mâu thuẫn nhau.", "C. Hai chương không liên quan.", "D. Chỉ cần học một chương."]}, {"type": "mcq", "level": "TH", "q": "Một nông dân áp dụng công nghệ cao nhưng xả thải bừa bãi. Đánh giá?", "answer": "A", "explain": "Công nghệ cao mà gây ô nhiễm là phát triển không bền vững; phải kết hợp BVMT mới đúng định hướng.", "points": 0.25, "options": ["A. Chưa bền vững, vì công nghệ cao phải đi đôi với BVMT (tinh thần chương VIII).", "B. Vẫn tốt vì có công nghệ cao.", "C. Không sao cả.", "D. Nên bỏ công nghệ cao."]}, {"type": "mcq", "level": "TH", "q": "Nội dung nào sau đây thuộc chương VII chứ không thuộc chương VIII?", "answer": "A", "explain": "Tưới nhỏ giọt thuộc Bài 24 (chương VII); ba nội dung còn lại thuộc chương VIII.", "points": 0.25, "options": ["A. Công nghệ tưới nhỏ giọt tự động.", "B. Ủ phân compost.", "C. Hầm biogas.", "D. Kinh tế tuần hoàn."]}, {"type": "mcq", "level": "VD", "q": "Thông điệp chung của cả hai chương VII và VIII là gì?", "answer": "A", "explain": "Thông điệp xuyên suốt: hiện đại hóa (VII) + BVMT (VIII) = nông nghiệp bền vững.", "points": 0.25, "options": ["A. Phát triển trồng trọt hiện đại bằng công nghệ cao gắn liền với bảo vệ môi trường, hướng tới bền vững.", "B. Chỉ cần công nghệ, không cần môi trường.", "C. Chỉ cần môi trường, không cần công nghệ.", "D. Không có thông điệp."]}, {"type": "mcq", "level": "VDC", "q": "Sau khi học xong chương VII và VIII, học sinh nên có hành động nào?", "answer": "A", "explain": "Học đi đôi với hành: thực hành BVMT hằng ngày, lan tỏa ý thức — mục tiêu giáo dục của chương trình.", "points": 0.25, "options": ["A. Thực hành tiết kiệm tài nguyên, phân loại rác, ủ compost, tuyên truyền BVMT trong cộng đồng.", "B. Không cần hành động gì.", "C. Xả rác bừa bãi.", "D. Chỉ học để thi."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định tổng kết chương VIII:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chương VIII hướng tới bền vững.", "points": 1, "statements": ["a) Bài 26: vấn đề ô nhiễm → cần thiết BVMT → giải pháp chung.", "b) Bài 27: giải pháp vi sinh cụ thể (compost, biogas, tuần hoàn).", "c) Công thức nhớ: hiếu khí = compost; kị khí = biogas.", "d) Chương VIII không liên quan đến phát triển bền vững."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: là vấn đề chung của xã hội.", "points": 1, "statements": ["a) Mỗi người đều có thể góp phần BVMT trong trồng trọt.", "b) Biến chất thải thành tài nguyên là tinh thần của Bài 27.", "c) Nông nghiệp tuần hoàn là hướng đi tất yếu.", "d) Ô nhiễm trong trồng trọt là vấn đề riêng của nông dân."]}, {"type": "short", "level": "VDC", "q": "Kể tên bốn giải pháp công nghệ vi sinh trong Bài 27.", "answer": "ủ compost; biogas; xử lí rơm rạ; xử lí nước thải", "explain": "Các giải pháp: ủ phân compost, hầm biogas, xử lí rơm rạ (nấm, ủ chua, đệm lót), xử lí nước thải, kinh tế tuần hoàn (nêu bốn là được).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nội dung nào thuộc chương VII chứ không thuộc chương VIII: tưới nhỏ giọt, ủ compost, biogas, kinh tế tuần hoàn?", "answer": "tưới nhỏ giọt", "explain": "Tưới nhỏ giọt thuộc Bài 24 (chương VII); ba nội dung còn lại thuộc chương VIII.", "points": 0.5}]}]}
