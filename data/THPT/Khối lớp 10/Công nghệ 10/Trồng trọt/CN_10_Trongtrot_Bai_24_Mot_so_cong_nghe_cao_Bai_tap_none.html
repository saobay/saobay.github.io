 như mưa.", "B. Tưới nhỏ giọt tốn nước hơn tưới phun mưa.", "C. Tưới phun mưa không thể tự động hóa.", "D. Hai cách tưới hoàn toàn giống nhau."]}, {"type": "mcq", "level": "VD", "q": "Một vườn cà phê ở Tây Nguyên lắp hệ thống tưới nhỏ giọt kết hợp hòa phân bón vào nước tưới. Mô hình này mang lại lợi ích nào?", "answer": "A", "explain": "Tưới nhỏ giọt + bón phân qua nước tưới (fertigation) đặc biệt hiệu quả ở Tây Nguyên mùa khô: tiết kiệm nước, phân đến đúng rễ, giảm công tưới.", "points": 0.25, "options": ["A. Tiết kiệm nước, phân bón đến đúng vùng rễ, cây hấp thụ tốt, giảm công lao động trong mùa khô.", "B. Làm tăng lượng nước ngầm vô hạn.", "C. Giúp cà phê không cần thu hoạch.", "D. Chỉ có tác dụng trang trí vườn."]}, {"type": "mcq", "level": "VDC", "q": "So sánh chi phí và lợi ích: Hệ thống tưới nhỏ giọt cho 1 ha rau có chi phí lắp đặt cao nhưng mỗi vụ tiết kiệm 40% nước và 30% phân bón, giảm 50% công tưới. Kết luận nào hợp lí?", "answer": "A", "explain": "Dù chi phí ban đầu cao, việc tiết kiệm thường xuyên nước, phân bón, công lao động qua nhiều vụ sẽ giúp hoàn vốn và sinh lợi về lâu dài.", "points": 0.25, "options": ["A. Về lâu dài, khoản tiết kiệm nước, phân bón và công lao động sẽ bù đắp chi phí đầu tư ban đầu.", "B. Không nên đầu tư vì chi phí ban đầu cao thì chắc chắn lỗ.", "C. Tưới nhỏ giọt chỉ phù hợp với cây cảnh.", "D. Tiết kiệm nước không có ý nghĩa kinh tế."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về nhà kính, nhà màng:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: tạo tiểu khí hậu ổn định, ngăn côn trùng. c) Đúng. d) Sai: cây vẫn cần ánh sáng để quang hợp; màng trong suốt cho ánh sáng đi qua.", "points": 1, "statements": ["a) Nhà màng gồm khung và lớp che phủ trong suốt cho ánh sáng đi qua.", "b) Nhà màng giúp kiểm soát nhiệt độ, độ ẩm và ngăn côn trùng gây hại.", "c) Nhà màng giúp trồng rau được trái vụ, quanh năm.", "d) Trong nhà màng, cây trồng không cần ánh sáng mặt trời."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về tưới nhỏ giọt:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: giảm bốc hơi, thấm sâu lãng phí. c) Đúng: bón phân qua hệ thống tưới. d) Sai: có thể hẹn giờ, điều khiển tự động.", "points": 1, "statements": ["a) Tưới nhỏ giọt đưa nước trực tiếp đến từng gốc cây.", "b) Tưới nhỏ giọt tiết kiệm nước hơn tưới tràn.", "c) Có thể hòa phân bón vào nước tưới nhỏ giọt.", "d) Tưới nhỏ giọt không thể tự động hóa."]}, {"type": "short", "level": "NB", "q": "Nhà màng gồm hai bộ phận chính nào?", "answer": "khung và lớp che phủ trong suốt", "explain": "Nhà màng gồm khung chịu lực (thép, tre...) và lớp che phủ trong suốt (màng PE, kính) cho ánh sáng đi qua.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Kể tên một ưu điểm của tưới nhỏ giọt.", "answer": "tiết kiệm nước", "explain": "Các ưu điểm: tiết kiệm nước; tiết kiệm phân bón (khi kết hợp bón qua nước tưới); tiết kiệm lao động; tăng năng suất.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Cảm biến trong trồng trọt công nghệ cao dùng để làm gì?", "answer": "A", "explain": "Cảm biến đo chính xác các thông số môi trường, làm cơ sở để hệ thống tự động điều chỉnh tưới, thông gió...", "points": 0.25, "options": ["A. Đo các thông số môi trường như nhiệt độ, độ ẩm đất, độ ẩm không khí, pH, EC, cường độ ánh sáng.", "B. Phát nhạc cho cây nghe để cây mau lớn.", "C. Chụp ảnh tự sướng cho nông dân.", "D. Thay thế hoàn toàn cây trồng."]}, {"type": "mcq", "level": "NB", "q": "Internet vạn vật (IoT) trong nông nghiệp cho phép người trồng làm gì?", "answer": "A", "explain": "IoT kết nối cảm biến với thiết bị chấp hành qua internet, giúp giám sát theo thời gian thực và điều khiển từ xa.", "points": 0.25, "options": ["A. Giám sát và điều khiển trang trại từ xa qua điện thoại, máy tính; nhận cảnh báo khi có bất thường.", "B. Trồng cây trong môi trường ảo trên internet.", "C. Bán nông sản mà không cần thu hoạch.", "D. Ngủ mà cây tự thu hoạch."]}, {"type": "mcq", "level": "TH", "q": "Vì sao cảm biến độ ẩm đất giúp tiết kiệm nước tưới?", "answer": "A", "explain": "Cảm biến giúp tưới đúng lúc, đúng lượng cây cần — không tưới thừa khi đất còn ẩm, không để cây khát khi đất khô.", "points": 0.25, "options": ["A. Vì hệ thống chỉ bật tưới khi đất khô dưới ngưỡng cài đặt và tự ngắt khi đủ ẩm, tránh tưới thừa.", "B. Vì cảm biến tự tạo ra nước cho cây.", "C. Vì cảm biến làm đất luôn ẩm ướt.", "D. Vì không cần tưới khi có cảm biến."]}, {"type": "mcq", "level": "TH", "q": "Trong các thông số sau, thông số nào KHÔNG đo bằng cảm biến trong trồng trọt?", "answer": "A", "explain": "Cảm biến đo các thông số vật lí, hóa học của môi trường trồng; giá bán nông sản là thông tin thị trường, không đo bằng cảm biến.", "points": 0.25, "options": ["A. Giá bán nông sản trên thị trường.", "B. Nhiệt độ không khí trong nhà màng.", "C. Độ ẩm của đất trồng.", "D. Độ pH của dung dịch dinh dưỡng."]}, {"type": "mcq", "level": "VD", "q": "Trang trại rau của chị Lan lắp cảm biến, mỗi khi nhiệt độ trong nhà màng vượt 35 độ C, quạt thông gió tự bật và chị nhận được tin nhắn cảnh báo. Hệ thống này thể hiện điều gì?", "answer": "A", "explain": "Đây là mô hình IoT điển hình: cảm biến đo → hệ thống tự động xử lí (bật quạt) → gửi cảnh báo về điện thoại.", "points": 0.25, "options": ["A. Ứng dụng cảm biến và IoT để tự động điều chỉnh tiểu khí hậu và cảnh báo từ xa.", "B. Trồng rau không cần con người giám sát.", "C. Cảm biến có thể thay thế quạt thông gió.", "D. Nhiệt độ cao tốt cho mọi loại rau."]}, {"type": "mcq", "level": "VDC", "q": "Một hệ thống IoT báo độ ẩm đất còn 70% nhưng cây vẫn héo. Nguyên nhân có thể là gì?", "answer": "A", "explain": "Dữ liệu cảm biến cần được kiểm chứng: cảm biến có thể đặt sai chỗ, hỏng, hoặc cây héo do bệnh, úng rễ... Cần kết hợp quan sát thực tế.", "points": 0.25, "options": ["A. Cảm biến đặt sai vị trí, hỏng, hoặc cây héo do nguyên nhân khác (sâu bệnh, úng rễ...) chứ không phải thiếu nước.", "B. Chắc chắn là do thiếu nước, cần tưới thêm.", "C. Cảm biến luôn đúng tuyệt đối, không cần kiểm tra.", "D. Cây héo là hiện tượng bình thường, không cần quan tâm."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về tưới phun mưa:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: có thể hẹn giờ, tự động. d) Đúng: sáng sớm ít bốc hơi, lá khô ráo trong ngày.", "points": 1, "statements": ["a) Tưới phun mưa phun nước thành hạt nhỏ như mưa, làm ướt đều diện tích.", "b) Tưới phun mưa phù hợp với rau ăn lá trồng dày đặc.", "c) Tưới phun mưa không thể hẹn giờ tự động.", "d) Nên tưới phun mưa vào sáng sớm để hạn chế nấm bệnh."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về cảm biến và IoT:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: tự động theo ngưỡng cài đặt. d) Sai: cảm biến chỉ đo, không tạo ra nước.", "points": 1, "statements": ["a) Cảm biến đo được nhiệt độ, độ ẩm đất, độ ẩm không khí, pH, EC.", "b) IoT giúp giám sát và điều khiển trang trại từ xa qua điện thoại.", "c) Khi đất khô dưới ngưỡng, hệ thống có thể tự động bật tưới.", "d) Cảm biến có thể tự tạo ra nước để tưới cây."]}, {"type": "short", "level": "NB", "q": "Cảm biến trong trồng trọt dùng để đo các thông số nào? (nêu một)", "answer": "nhiệt độ", "explain": "Cảm biến đo: nhiệt độ, độ ẩm không khí, độ ẩm đất, pH, EC, cường độ ánh sáng... (nêu một là được).", "points": 0.5}, {"type": "short", "level": "NB", "q": "IoT cho phép người trồng làm gì từ xa?", "answer": "giám sát và điều khiển trang trại qua điện thoại", "explain": "IoT kết nối cảm biến với thiết bị qua internet, cho phép giám sát theo thời gian thực và điều khiển từ xa, nhận cảnh báo.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Đèn LED được dùng để chiếu sáng bổ sung cho cây trồng dựa trên nguyên lí nào?", "answer": "A", "explain": "Cây quang hợp mạnh nhất với ánh sáng đỏ và xanh dương; đèn LED tạo được phổ sáng phù hợp, bổ sung khi thiếu nắng.", "points": 0.25, "options": ["A. Phát ra ánh sáng có bước sóng phù hợp với quang hợp (chủ yếu đỏ và xanh dương) để bổ sung khi thiếu sáng tự nhiên.", "B. Phát ra tia cực tím để diệt hết vi sinh vật trong đất.", "C. Làm nóng không khí để cây mau lớn.", "D. Phát ra âm thanh kích thích cây quang hợp."]}, {"type": "mcq", "level": "NB", "q": "Ưu điểm của đèn LED so với bóng đèn sợi đốt khi chiếu sáng cho cây là gì?", "answer": "A", "explain": "LED tiết kiệm điện, bền, ít tỏa nhiệt (không làm cháy lá) và điều chỉnh được phổ sáng theo từng giai đoạn sinh trưởng.", "points": 0.25, "options": ["A. Tiết kiệm điện, tuổi thọ cao, ít tỏa nhiệt, điều chỉnh được màu sắc ánh sáng.", "B. Rẻ hơn nhưng tốn điện hơn nhiều.", "C. Tỏa nhiệt mạnh giúp sưởi ấm nhà kính.", "D. Không có ưu điểm gì."]}, {"type": "mcq", "level": "TH", "q": "Vì sao người ta chiếu đèn LED cho hoa cúc vào ban đêm?", "answer": "A", "explain": "Hoa cúc là cây ngày ngắn; chiếu sáng bổ sung ban đêm làm gián đoạn đêm dài, điều khiển thời điểm ra hoa theo ý muốn.", "points": 0.25, "options": ["A. Để điều khiển quang chu kì, giúp hoa ra đúng thời điểm mong muốn (như dịp Tết).", "B. Để hoa cúc phát sáng trong đêm cho đẹp.", "C. Để xua đuổi trộm.", "D. Để hoa không cần nước."]}, {"type": "mcq", "level": "TH", "q": "Trong các trường hợp sau, trường hợp nào cần chiếu sáng bổ sung bằng đèn LED?", "answer": "A", "explain": "Khi thiếu sáng tự nhiên (mùa đông, trong nhà), đèn LED bổ sung ánh sáng giúp cây quang hợp, sinh trưởng tốt.", "points": 0.25, "options": ["A. Trồng rau mầm trong nhà thiếu nắng vào mùa đông.", "B. Trồng lúa ngoài đồng vào mùa hè nắng gắt.", "C. Trồng cây dưới ánh nắng đầy đủ quanh năm.", "D. Trồng cây trong hang tối không cần quang hợp."]}, {"type": "mcq", "level": "VD", "q": "Một vườn lan trong nhà kính dùng đèn LED ánh sáng đỏ nhiều hơn vào giai đoạn ra hoa. Việc làm này dựa trên cơ sở nào?", "answer": "A", "explain": "Các giai đoạn sinh trưởng cần tỉ lệ phổ sáng khác nhau; ánh sáng đỏ thúc đẩy ra hoa nên tăng tỉ lệ đỏ ở giai đoạn này.", "points": 0.25, "options": ["A. Ánh sáng đỏ kích thích ra hoa; điều chỉnh phổ sáng theo từng giai đoạn sinh trưởng của cây.", "B. Ánh sáng đỏ làm hoa có màu đỏ.", "C. Đèn LED màu đỏ rẻ hơn các màu khác.", "D. Cây lan chỉ sống được dưới ánh sáng đỏ."]}, {"type": "mcq", "level": "VDC", "q": "Đánh giá: Có ý kiến cho rằng 'chiếu đèn LED cả đêm cho cây sẽ giúp cây lớn nhanh gấp đôi'. Ý kiến này đúng hay sai?", "answer": "A", "explain": "Cây cần cân bằng sáng/tối; chiếu quá liều gây tốn điện, rối loạn sinh trưởng. Cần đúng cường độ, thời gian và phổ sáng phù hợp.", "points": 0.25, "options": ["A. Sai, vì cây cũng cần thời gian tối cho các quá trình sinh lí; chiếu sáng phải đúng liều lượng, đúng phổ theo từng loại cây.", "B. Đúng, vì càng nhiều sáng cây càng quang hợp mạnh.", "C. Đúng, vì điện năng rẻ nên cứ chiếu thoải mái.", "D. Sai, vì đèn LED không có tác dụng gì với cây."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về đèn LED:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: điều khiển quang chu kì. c) Đúng. d) Sai: cần đúng liều lượng, cây cũng cần thời gian tối.", "points": 1, "statements": ["a) Đèn LED phát ra ánh sáng đỏ và xanh dương phù hợp với quang hợp của cây.", "b) Đèn LED giúp điều khiển thời điểm ra hoa của cây trồng.", "c) Đèn LED tiết kiệm điện và ít tỏa nhiệt hơn bóng sợi đốt.", "d) Càng chiếu đèn LED cả đêm cho cây thì cây càng tốt, không cần giới hạn."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về drone:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: điều khiển từ xa. c) Đúng: cần đào tạo, giấy phép, tuân thủ quy định. d) Sai: mưa to, gió lớn không đảm bảo an toàn bay và hiệu quả phun.", "points": 1, "statements": ["a) Drone có thể phun thuốc bảo vệ thực vật trên diện tích lớn.", "b) Drone giúp giảm tiếp xúc trực tiếp của người với thuốc.", "c) Người điều khiển drone phun thuốc cần được đào tạo và có giấy phép.", "d) Có thể bay drone phun thuốc thoải mái khi trời đang mưa to, gió lớn."]}, {"type": "short", "level": "TH", "q": "Vì sao tưới nhỏ giọt thường được dùng cho cây cà phê ở Tây Nguyên?", "answer": "vì tiết kiệm nước trong mùa khô và đưa phân bón đến đúng vùng rễ", "explain": "Tây Nguyên mùa khô kéo dài, thiếu nước; tưới nhỏ giọt tiết kiệm nước, kết hợp bón phân chính xác nên rất phù hợp.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nêu một tác dụng của nhà màng đối với sâu bệnh hại.", "answer": "ngăn côn trùng gây hại xâm nhập", "explain": "Lớp che phủ là rào cản vật lí ngăn côn trùng, mầm bệnh từ bên ngoài, giúp hạn chế sâu bệnh, giảm phun thuốc.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Drone được ứng dụng trong trồng trọt để làm gì?", "answer": "A", "explain": "Drone đa năng: phun, rải phân, gieo hạt nhanh trên diện tích lớn; camera giám sát sinh trưởng, phát hiện sâu bệnh; lập bản đồ.", "points": 0.25, "options": ["A. Phun thuốc bảo vệ thực vật, rải phân bón, gieo hạt, giám sát sâu bệnh và lập bản đồ đồng ruộng.", "B. Chở nông dân đi thăm đồng.", "C. Thay thế hoàn toàn máy cày.", "D. Chỉ dùng để chụp ảnh cưới ngoài đồng."]}, {"type": "mcq", "level": "NB", "q": "Ưu điểm nổi bật của drone khi phun thuốc bảo vệ thực vật là gì?", "answer": "A", "explain": "Drone phun hàng chục héc-ta mỗi ngày, đều và chính xác; người đứng xa điều khiển nên hạn chế hít phải, dính thuốc.", "points": 0.25, "options": ["A. Phun nhanh, đều trên diện tích lớn, giảm tiếp xúc trực tiếp của người với thuốc.", "B. Phun thuốc đậm đặc hơn để diệt sạch mọi sinh vật.", "C. Không cần tuân thủ quy định an toàn bay.", "D. Ai cũng điều khiển được ngay không cần đào tạo."]}, {"type": "mcq", "level": "TH", "q": "Người điều khiển drone phun thuốc cần lưu ý điều gì?", "answer": "A", "explain": "Drone phun thuốc liên quan đến an toàn bay và hóa chất nên người điều khiển phải được đào tạo, cấp phép và tuân thủ quy định.", "points": 0.25, "options": ["A. Phải được đào tạo, có giấy phép; tuân thủ quy định an toàn bay và an toàn khi dùng thuốc bảo vệ thực vật.", "B. Cứ bay tự do, không cần quy định gì.", "C. Phun càng nhiều thuốc càng tốt.", "D. Bay vào ban đêm để tránh bị phát hiện."]}, {"type": "mcq", "level": "TH", "q": "Trong các địa hình sau, địa hình nào phù hợp nhất để dùng drone phun thuốc?", "answer": "A", "explain": "Drone phát huy ưu thế trên diện tích lớn hoặc nơi máy móc, người khó tiếp cận (đồi dốc, ruộng lầy).", "points": 0.25, "options": ["A. Đồng ruộng rộng lớn, bằng phẳng hoặc địa hình đồi dốc khó đưa máy móc vào.", "B. Vườn rau nhỏ trong nhà phố.", "C. Nhà kính kín mái.", "D. Sân thượng chung cư."]}, {"type": "mcq", "level": "VD", "q": "So với phun thuốc bằng bình thủ công, phun bằng drone giúp giảm nguy cơ nào cho người nông dân?", "answer": "A", "explain": "Phun thủ công người mang bình, đi trong làn thuốc nên dễ hít phải, dính thuốc; drone điều khiển từ xa nên an toàn hơn nhiều.", "points": 0.25, "options": ["A. Giảm nguy cơ ngộ độc do hít phải và tiếp xúc trực tiếp với thuốc bảo vệ thực vật.", "B. Giảm nguy cơ bị cảm nắng vì không phải ra đồng.", "C. Giảm nguy cơ bị ong đốt.", "D. Không giảm được nguy cơ nào."]}, {"type": "mcq", "level": "VDC", "q": "Một hợp tác xã có 100 ha lúa muốn phun thuốc đồng loạt trong 2 ngày. Giải pháp nào khả thi nhất?", "answer": "A", "explain": "100 ha trong 2 ngày vượt khả năng phun tay; drone phun hàng chục héc-ta mỗi ngày nên là giải pháp khả thi, kịp thời vụ.", "points": 0.25, "options": ["A. Thuê dịch vụ drone phun thuốc vì nhanh, đều và kịp thời vụ trên diện tích lớn.", "B. Huy động toàn bộ dân làng phun tay trong 2 ngày.", "C. Bỏ không phun, để sâu bệnh tự hết.", "D. Chờ mưa để rửa trôi sâu bệnh."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: rào cản vật lí. c) Sai: vẫn phải tưới (thường là tưới nhỏ giọt). d) Đúng.", "points": 1, "statements": ["a) Nhà màng chắn được mưa bão nên giúp vườn rau tránh ngập úng khi mưa lớn.", "b) Lớp màng che phủ ngăn côn trùng xâm nhập nên hạn chế được sâu bệnh.", "c) Trồng trong nhà màng thì không bao giờ cần tưới nước.", "d) Dưa lưới là cây trồng nhà màng điển hình ở Việt Nam."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: giúp GIẢM rửa trôi nhờ đúng liều, đúng vị trí. d) Đúng.", "points": 1, "statements": ["a) Bón phân qua hệ thống tưới giúp phân đến đúng vùng rễ, cây hấp thụ tốt.", "b) Tưới nhỏ giọt kết hợp bón phân qua nước tưới rất hiệu quả với cà phê ở Tây Nguyên mùa khô.", "c) Hòa phân vào nước tưới làm tăng lượng phân bị rửa trôi.", "d) Hệ thống tưới hẹn giờ giúp giảm công lao động tưới tay."]}, {"type": "short", "level": "TH", "q": "Đèn LED cung cấp chủ yếu những vùng phổ ánh sáng nào cho cây quang hợp?", "answer": "ánh sáng đỏ và xanh dương", "explain": "Diệp lục hấp thụ mạnh ánh sáng đỏ và xanh dương; đèn LED tạo được phổ sáng phù hợp với quang hợp của cây.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Kể tên một ứng dụng của drone trong trồng trọt.", "answer": "phun thuốc bảo vệ thực vật", "explain": "Các ứng dụng: phun thuốc, rải phân bón, gieo hạt, giám sát sâu bệnh bằng camera, lập bản đồ đồng ruộng (nêu một là được).", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Bón phân qua hệ thống tưới (hòa phân vào nước tưới) có ưu điểm gì?", "answer": "A", "explain": "Hòa phân vào nước tưới đưa dinh dưỡng trực tiếp đến vùng rễ với liều chính xác, cây hấp thụ hiệu quả, giảm rửa trôi.", "points": 0.25, "options": ["A. Phân bón đến đúng vùng rễ, cây hấp thụ tốt, giảm thất thoát và tiết kiệm công bón.", "B. Làm tăng lượng phân bón cần dùng.", "C. Gây ô nhiễm nguồn nước nghiêm trọng hơn bón thủ công.", "D. Chỉ áp dụng được cho phân chuồng tươi."]}, {"type": "mcq", "level": "NB", "q": "Nhà màng giúp trồng rau trái vụ dựa trên cơ sở nào?", "answer": "A", "explain": "Nhà màng kiểm soát nhiệt độ, ẩm độ, chắn mưa bão nên có thể trồng những loại rau trái mùa, bán giá cao.", "points": 0.25, "options": ["A. Tạo tiểu khí hậu ổn định, che chắn thời tiết bất lợi nên trồng được quanh năm, không phụ thuộc mùa vụ.", "B. Làm cho mùa đông trở thành mùa hè.", "C. Giúp cây không cần ánh sáng.", "D. Làm thay đổi gen của cây trồng."]}, {"type": "mcq", "level": "TH", "q": "Vì sao nhà màng giúp hạn chế sâu bệnh hại?", "answer": "A", "explain": "Màng che phủ là rào cản vật lí ngăn côn trùng, mầm bệnh từ bên ngoài, giảm mật độ sâu bệnh ban đầu.", "points": 0.25, "options": ["A. Vì lớp che phủ ngăn côn trùng gây hại xâm nhập từ bên ngoài vào.", "B. Vì trong nhà màng không có không khí.", "C. Vì sâu bệnh sợ màu của màng nhựa.", "D. Vì nhà màng tự sinh ra thuốc trừ sâu."]}, {"type": "mcq", "level": "TH", "q": "Trong các loại cây sau, loại nào ở Việt Nam thường được trồng trong nhà màng công nghệ cao?", "answer": "A", "explain": "Dưa lưới là cây trồng nhà màng điển hình ở Việt Nam (mỗi cây một quả, chất lượng cao); lúa, sắn, mía trồng ngoài đồng quy mô lớn.", "points": 0.25, "options": ["A. Dưa lưới.", "B. Lúa nước.", "C. Sắn.", "D. Mía."]}, {"type": "mcq", "level": "VD", "q": "Gia đình em có 2 sào đất trồng rau, hay bị ngập úng khi mưa lớn và sâu bệnh nhiều. Giải pháp công nghệ cao nào phù hợp?", "answer": "A", "explain": "Nhà màng đơn giản chắn mưa gây ngập úng, ngăn côn trùng — giải pháp vừa sức, hiệu quả với vườn rau nhỏ.", "points": 0.25, "options": ["A. Làm nhà màng đơn giản kết hợp luống cao thoát nước tốt để chắn mưa, hạn chế sâu bệnh.", "B. Bỏ đất hoang không trồng gì.", "C. Trồng rau dưới ao.", "D. Phun thuốc thật nhiều để diệt sâu bệnh."]}, {"type": "mcq", "level": "VDC", "q": "Phân tích: Vì sao trồng dưa lưới trong nhà màng cho thu nhập cao hơn nhiều so với trồng ngoài đồng dù chi phí đầu tư lớn?", "answer": "A", "explain": "Chất lượng vượt trội (mẫu mã đẹp, an toàn) giúp giá bán cao gấp nhiều lần, vượt chi phí đầu tư và mang lại lợi nhuận lớn.", "points": 0.25, "options": ["A. Vì quả to đều, đẹp, ít sâu bệnh, an toàn nên bán giá cao gấp 2–3 lần, bù đắp chi phí và sinh lãi lớn.", "B. Vì dưa nhà màng không cần chăm sóc.", "C. Vì nhà nước bao tiêu với giá cao.", "D. Vì trồng nhà màng không tốn chi phí gì."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: EC phản ánh nồng độ muối dinh dưỡng. b) Đúng. c) Đúng: thực hiện lệnh bật/tắt. d) Sai: dữ liệu lịch sử giúp phân tích, tối ưu vụ sau.", "points": 1, "statements": ["a) Cảm biến EC giúp theo dõi nồng độ dinh dưỡng trong dung dịch.", "b) pH không phù hợp khiến rễ cây khó hấp thụ dinh dưỡng.", "c) Máy bơm, van điện từ, quạt thông gió là các thiết bị chấp hành trong hệ thống IoT.", "d) Dữ liệu cảm biến các vụ trước không có giá trị sử dụng."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "T"], "explain": "Tất cả đều đúng: LED điều khiển quang chu kì (hoa cúc, thanh long), tùy chỉnh phổ sáng, cung cấp đúng phổ cây cần.", "points": 1, "statements": ["a) Chiếu đèn LED cho hoa cúc ban đêm giúp điều khiển thời điểm ra hoa.", "b) Thanh long được thắp sáng ban đêm để kích thích ra hoa trái vụ.", "c) Đèn LED có thể điều chỉnh phổ màu theo từng giai đoạn sinh trưởng của cây.", "d) Ánh sáng đỏ và xanh dương là hai vùng phổ cây hấp thụ mạnh để quang hợp."]}, {"type": "short", "level": "VD", "q": "Giải thích vì sao nên tưới phun mưa vào sáng sớm thay vì buổi tối.", "answer": "vì sáng sớm ít bốc hơi, lá khô ráo trong ngày nên hạn chế nấm bệnh", "explain": "Tưới sáng sớm: mát, ít bốc hơi, cây hấp thụ tốt; lá khô trước tối nên hạn chế nấm bệnh so với tưới tối ẩm ướt qua đêm.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Một vườn ươm dùng tưới phun mưa hẹn giờ. Nêu một lợi ích của việc hẹn giờ tự động.", "answer": "tưới đúng giờ đúng lượng, giảm công lao động", "explain": "Hẹn giờ giúp tưới đúng lịch, đúng lượng đã cài đặt, không lo quên tưới, tiết kiệm công lao động.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Hệ thống tưới tự động hẹn giờ mang lại lợi ích gì?", "answer": "A", "explain": "Hẹn giờ giúp tưới đúng lịch, đúng lượng, tiết kiệm công và đảm bảo cây không bị khô hạn do quên tưới.", "points": 0.25, "options": ["A. Tưới đúng giờ, đúng lượng đã cài đặt, giảm công lao động và tránh quên tưới.", "B. Tưới liên tục 24 giờ mỗi ngày.", "C. Không cần nguồn nước.", "D. Tự tạo ra phân bón."]}, {"type": "mcq", "level": "NB", "q": "Cảm biến EC trong trồng trọt dùng để đo gì?", "answer": "A", "explain": "EC (độ dẫn điện) tỉ lệ với nồng độ muối dinh dưỡng hòa tan; theo dõi EC giúp pha dung dịch đúng nồng độ cây cần.", "points": 0.25, "options": ["A. Độ dẫn điện của dung dịch dinh dưỡng, phản ánh nồng độ phân bón hòa tan.", "B. Tốc độ gió trong nhà màng.", "C. Màu sắc của lá cây.", "D. Độ ồn của máy bơm."]}, {"type": "mcq", "level": "TH", "q": "Vì sao cần theo dõi độ pH của dung dịch dinh dưỡng khi trồng thủy canh?", "answer": "A", "explain": "pH quá cao hoặc quá thấp làm kết tủa dinh dưỡng, rễ không hấp thụ được; cần giữ pH trong khoảng phù hợp từng loại cây.", "points": 0.25, "options": ["A. Vì pH ảnh hưởng đến khả năng hấp thụ dinh dưỡng của rễ cây; pH không phù hợp cây sẽ còi cọc dù đủ phân.", "B. Vì pH làm nước có màu đẹp.", "C. Vì pH giúp diệt hết vi khuẩn có lợi.", "D. pH không ảnh hưởng gì đến cây."]}, {"type": "mcq", "level": "TH", "q": "Trong các thiết bị sau, thiết bị nào là 'thiết bị chấp hành' trong hệ thống IoT nông nghiệp?", "answer": "A", "explain": "Thiết bị chấp hành là bộ phận thực hiện hành động (bơm nước, mở van, bật quạt) theo lệnh điều khiển; cảm biến chỉ đo, điện thoại chỉ hiển thị.", "points": 0.25, "options": ["A. Máy bơm, van điện từ, quạt thông gió — thực hiện lệnh bật/tắt từ hệ thống.", "B. Cảm biến nhiệt độ.", "C. Điện thoại của chủ trang trại.", "D. Máy chủ lưu trữ dữ liệu."]}, {"type": "mcq", "level": "VD", "q": "Một trang trại thông minh ghi lại toàn bộ dữ liệu nhiệt độ, độ ẩm các vụ trước. Dữ liệu này có ích gì?", "answer": "A", "explain": "Dữ liệu lịch sử giúp phân tích mối quan hệ giữa điều kiện môi trường và năng suất, từ đó tối ưu quy trình vụ sau.", "points": 0.25, "options": ["A. Phân tích để rút kinh nghiệm, dự báo và điều chỉnh quy trình các vụ sau tốt hơn.", "B. Chỉ để lưu trữ cho vui, không có tác dụng.", "C. Dùng để tăng giá bán nông sản.", "D. Dùng để thay thế cảm biến."]}, {"type": "mcq", "level": "VDC", "q": "Đánh giá hệ thống: Trang trại dùng IoT nhưng hay mất điện, hệ thống tưới tự động ngừng hoạt động khiến cây héo. Giải pháp nào phù hợp?", "answer": "A", "explain": "Hệ thống tự động phụ thuộc điện nên cần nguồn dự phòng và phương án thủ công khi sự cố — đảm bảo sản xuất không gián đoạn.", "points": 0.25, "options": ["A. Lắp thêm nguồn điện dự phòng (máy phát, pin mặt trời) và chế độ vận hành thủ công dự phòng.", "B. Bỏ hệ thống IoT, quay lại tưới tay hoàn toàn.", "C. Để cây tự chịu, không cần giải pháp.", "D. Tăng số lượng cảm biến."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: hàng chục héc-ta mỗi ngày. b) Đúng. c) Đúng. d) Sai: chi phí cao, cần đào tạo, phụ thuộc thời tiết.", "points": 1, "statements": ["a) Drone phun thuốc nhanh hơn nhiều so với phun thủ công trên diện tích lớn.", "b) Drone bay ổn định nên thuốc được phun đều hơn phun tay.", "c) Camera trên drone giúp phát hiện sớm vùng cây bị sâu bệnh.", "d) Sử dụng drone không có nhược điểm nào."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: vẫn cần kiến thức để vận hành, xử lí sự cố và ra quyết định.", "points": 1, "statements": ["a) Điểm chung của các công nghệ cao là chính xác, tự động, tiết kiệm tài nguyên.", "b) Kết hợp đồng bộ các công nghệ tạo hiệu quả tổng hợp cao hơn dùng riêng lẻ.", "c) Trang trại mất điện thường xuyên cần có nguồn điện dự phòng cho hệ thống tự động.", "d) Công nghệ cao giúp nông dân hoàn toàn không cần kiến thức trồng trọt."]}, {"type": "short", "level": "VD", "q": "Vì sao người điều khiển drone phun thuốc phải được đào tạo và có giấy phép?", "answer": "vì liên quan đến an toàn bay và an toàn khi sử dụng thuốc bảo vệ thực vật", "explain": "Drone phun thuốc liên quan đến an toàn hàng không và hóa chất độc hại nên pháp luật yêu cầu đào tạo, cấp phép và tuân thủ quy định.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu một nhược điểm của việc sử dụng drone trong trồng trọt.", "answer": "chi phí đầu tư cao", "explain": "Các nhược điểm: chi phí đầu tư/thuê cao; cần người được đào tạo, có giấy phép; phụ thuộc thời tiết (gió to, mưa); tuân thủ quy định an toàn bay.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Điểm chung của các công nghệ cao trong trồng trọt (nhà màng, tưới tự động, IoT, LED, drone) là gì?", "answer": "A", "explain": "Điểm chung là ứng dụng khoa học công nghệ để sản xuất chính xác, tự động, tiết kiệm tài nguyên và kiểm soát quy trình.", "points": 0.25, "options": ["A. Chính xác, tự động, tiết kiệm tài nguyên và kiểm soát tốt quy trình sản xuất.", "B. Đều rất rẻ tiền, ai cũng mua được.", "C. Đều không cần điện để hoạt động.", "D. Đều chỉ dùng cho cây lúa."]}, {"type": "mcq", "level": "NB", "q": "Vì sao các công nghệ này thường được kết hợp với nhau trong một trang trại?", "answer": "A", "explain": "Kết hợp đồng bộ tạo hiệu quả tổng hợp: mỗi công nghệ giải quyết một khâu, cùng hướng tới năng suất, chất lượng cao.", "points": 0.25, "options": ["A. Vì chúng bổ trợ nhau: nhà màng tạo tiểu khí hậu, tưới tự động cung cấp nước, IoT giám sát điều khiển, tạo hiệu quả tổng hợp.", "B. Vì pháp luật bắt buộc phải dùng đủ 5 công nghệ.", "C. Vì dùng riêng lẻ thì không có tác dụng gì.", "D. Vì kết hợp để tăng chi phí đầu tư."]}, {"type": "mcq", "level": "TH", "q": "Một trang trại trồng rau có nhà màng, tưới nhỏ giọt hẹn giờ nhưng chưa có cảm biến. Muốn nâng cấp lên 'trang trại thông minh', nên bổ sung gì?", "answer": "A", "explain": "Cảm biến + IoT là mảnh ghép còn thiếu để hệ thống tự động điều chỉnh theo thực tế thay vì chỉ hẹn giờ cố định.", "points": 0.25, "options": ["A. Lắp cảm biến (nhiệt độ, độ ẩm đất...) kết nối hệ thống để tự động điều chỉnh theo điều kiện thực tế.", "B. Tháo bỏ hệ thống tưới hiện có.", "C. Phá nhà màng để trồng ngoài trời.", "D. Chỉ cần sơn lại nhà màng."]}, {"type": "mcq", "level": "TH", "q": "Trong các công nghệ sau, công nghệ nào trực tiếp giúp giảm tiếp xúc của người với thuốc bảo vệ thực vật?", "answer": "A", "explain": "Drone do người điều khiển từ xa nên hạn chế tối đa việc hít phải, dính thuốc như khi phun thủ công.", "points": 0.25, "options": ["A. Drone phun thuốc điều khiển từ xa.", "B. Đèn LED chiếu sáng.", "C. Cảm biến nhiệt độ.", "D. Nhà màng."]}, {"type": "mcq", "level": "VD", "q": "Trường em muốn xây dựng mô hình 'vườn trường thông minh' với kinh phí hạn chế. Lựa chọn nào hợp lí nhất?", "answer": "A", "explain": "Với kinh phí hạn chế, nên chọn các giải pháp vừa sức: nhà màng đơn giản, tưới nhỏ giọt, cảm biến giá rẻ — vẫn thể hiện được công nghệ cao.", "points": 0.25, "options": ["A. Nhà màng đơn giản + tưới nhỏ giọt hẹn giờ + một vài cảm biến độ ẩm đất giá rẻ.", "B. Nhà kính nhập khẩu hiện đại nhất.", "C. Hệ thống drone phun thuốc.", "D. Không làm gì vì thiếu kinh phí."]}, {"type": "mcq", "level": "VDC", "q": "Tổng hợp: Để xây dựng một trang trại rau công nghệ cao hoàn chỉnh, cần kết hợp các yếu tố nào?", "answer": "A", "explain": "Trang trại hoàn chỉnh cần đồng bộ: hạ tầng (nhà màng), nước (tưới tự động), giám sát (IoT), giống tốt và quy trình sản xuất an toàn.", "points": 0.25, "options": ["A. Nhà màng kiểm soát tiểu khí hậu + tưới tự động tiết kiệm + cảm biến/IoT giám sát + giống tốt + quy trình an toàn.", "B. Chỉ cần thật nhiều vốn là đủ.", "C. Chỉ cần mua drone đắt tiền.", "D. Chỉ cần thuê nhiều nhân công."]}, {"type": "truefalse", "level": "VD", "q": "Một xã có 50 ha rau, nông dân phun thuốc thủ công hay bị ngộ độc. Xét tính đúng, sai của các giải pháp sau:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: rất nguy hiểm, dễ ngộ độc. d) Đúng: giảm phụ thuộc vào thuốc hóa học.", "points": 1, "statements": ["a) Thuê dịch vụ drone phun thuốc giúp nhanh, đều và giảm ngộ độc cho nông dân.", "b) Tập huấn an toàn sử dụng thuốc bảo vệ thực vật cho nông dân.", "c) Tiếp tục phun thủ công không có đồ bảo hộ vì đã quen.", "d) Kết hợp dùng drone với áp dụng biện pháp phòng trừ tổng hợp để giảm lượng thuốc."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về lựa chọn công nghệ:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: vừa sức, hiệu quả. b) Đúng. c) Đúng: nguyên tắc lựa chọn. d) Sai: phù hợp mới là tốt nhất.", "points": 1, "statements": ["a) Vườn rau nhỏ 1000 m2 nên ưu tiên tưới nhỏ giọt/phun mưa hẹn giờ thay vì mua drone.", "b) Trang trại 100 ha nên cân nhắc drone và hệ thống IoT để quản lí hiệu quả.", "c) Lựa chọn công nghệ phải phù hợp với quy mô, vốn và điều kiện thực tế.", "d) Cứ công nghệ đắt tiền nhất là tốt nhất trong mọi trường hợp."]}, {"type": "short", "level": "VD", "q": "Giải thích ngắn gọn nguyên tắc 'bón phân qua hệ thống tưới'.", "answer": "hòa phân bón vào nước tưới để đưa dinh dưỡng trực tiếp đến vùng rễ", "explain": "Phân bón được hòa vào nước tưới với liều chính xác, đến đúng vùng rễ giúp cây hấp thụ tốt, giảm thất thoát.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Vì sao cảm biến EC quan trọng khi pha dung dịch dinh dưỡng?", "answer": "vì EC phản ánh nồng độ phân bón hòa tan, giúp pha đúng liều cây cần", "explain": "Theo dõi EC giúp biết dung dịch quá đặc hay quá loãng để điều chỉnh, tránh bón thừa gây hại rễ hoặc thiếu dinh dưỡng.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Vật liệu che phủ nhà màng thường là gì?", "answer": "A", "explain": "Lớp che phủ phải trong suốt (màng PE, kính) để ánh sáng mặt trời đi qua cho cây quang hợp, đồng thời chắn mưa, gió.", "points": 0.25, "options": ["A. Màng nhựa PE trong suốt hoặc kính, cho ánh sáng đi qua.", "B. Tấm tôn kín không cho ánh sáng qua.", "C. Vải bạt đen che kín hoàn toàn.", "D. Tấm gỗ dày."]}, {"type": "mcq", "level": "NB", "q": "Khung nhà màng thường được làm bằng vật liệu nào?", "answer": "A", "explain": "Khung phải chắc chắn, bền với thời tiết (thép mạ kẽm phổ biến; tre, gỗ cho mô hình đơn giản, rẻ tiền).", "points": 0.25, "options": ["A. Thép mạ kẽm, tre, gỗ — chắc chắn, chịu được gió bão.", "B. Giấy bìa cứng.", "C. Nhựa dẻo không có khung.", "D. Đất nặn."]}, {"type": "mcq", "level": "TH", "q": "Vì sao trong nhà màng vẫn cần hệ thống thông gió?", "answer": "A", "explain": "Nhà màng kín giữ nhiệt tốt nên trưa nắng nhiệt độ có thể quá cao; quạt/cửa thông gió giúp điều hòa nhiệt độ, ẩm độ.", "points": 0.25, "options": ["A. Vì khi nắng gắt, nhiệt độ trong nhà màng tăng cao gây hại cây nên cần thông gió để hạ nhiệt.", "B. Vì cây trong nhà màng không cần không khí.", "C. Vì thông gió để đuổi hết côn trùng có lợi.", "D. Vì thông gió làm tăng độ ẩm."]}, {"type": "mcq", "level": "TH", "q": "Tưới phun mưa phù hợp với loại cây trồng nào?", "answer": "A", "explain": "Tưới phun mưa phủ đều diện tích, phù hợp rau ăn lá, thảm cỏ, cây trồng dày; cây ăn quả thường hợp tưới nhỏ giọt hơn.", "points": 0.25, "options": ["A. Rau ăn lá, cỏ, cây trồng dày đặc cần làm ướt đều diện tích.", "B. Chỉ phù hợp với cây ăn quả lâu năm.", "C. Chỉ phù hợp với lúa nước.", "D. Không phù hợp với loại cây nào."]}, {"type": "mcq", "level": "VD", "q": "Một vườn ươm cây giống dùng tưới phun mưa tự động hẹn giờ mỗi sáng sớm. Vì sao chọn tưới vào sáng sớm?", "answer": "A", "explain": "Tưới sáng sớm giảm bốc hơi, lá kịp khô trong ngày nên hạn chế nấm bệnh; tránh tưới tối gây ẩm ướt qua đêm.", "points": 0.25, "options": ["A. Vì sáng sớm mát, ít bốc hơi, cây hấp thụ tốt và lá khô ráo trước tối, hạn chế nấm bệnh.", "B. Vì buổi sáng nước rẻ hơn.", "C. Vì cây chỉ uống nước buổi sáng.", "D. Vì hệ thống chỉ chạy được buổi sáng."]}, {"type": "mcq", "level": "VDC", "q": "So sánh: Vườn rau 1000 m2 tưới tay mất 2 giờ/ngày; lắp tưới phun mưa hẹn giờ tốn 15 triệu đồng. Sau 1 năm (300 ngày công tưới), có nên đầu tư?", "answer": "A", "explain": "600 giờ công/năm là khoản tiết kiệm lớn; với tiền công lao động hiện nay, khoản đầu tư 15 triệu hoàn vốn nhanh và còn dùng được nhiều năm.", "points": 0.25, "options": ["A. Nên, vì tiết kiệm khoảng 600 giờ công lao động mỗi năm, số tiền công tiết kiệm được vượt chi phí đầu tư.", "B. Không nên, vì tưới tay tốt hơn.", "C. Không nên, vì 15 triệu là quá lớn không bao giờ hoàn vốn.", "D. Nên phá vườn để khỏi phải tưới."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nhà màng:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: màng PE, kính trong suốt. b) Đúng. c) Đúng. d) Sai: cần thông gió điều hòa nhiệt, ẩm.", "points": 1, "statements": ["a) Vật liệu che phủ phải trong suốt để ánh sáng đi qua cho cây quang hợp.", "b) Trưa nắng gắt cần thông gió vì nhiệt độ trong nhà màng có thể quá cao.", "c) Khung nhà màng cần chắc chắn để chịu được gió bão.", "d) Làm nhà màng càng kín hoàn toàn, không cần thông gió càng tốt."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về đèn LED:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: đúng liều lượng. c) Đúng. d) Sai: LED chỉ bổ sung khi thiếu sáng; ánh sáng tự nhiên vẫn là chính và miễn phí.", "points": 1, "statements": ["a) Giai đoạn ra hoa nên tăng tỉ lệ ánh sáng đỏ vì ánh sáng đỏ kích thích ra hoa.", "b) Chiếu sáng phải đúng cường độ, thời gian và phổ phù hợp từng loại cây.", "c) LED ít tỏa nhiệt nên có thể chiếu gần cây mà ít gây cháy lá.", "d) Đèn LED có thể thay thế hoàn toàn ánh sáng mặt trời trong mọi trường hợp."]}, {"type": "short", "level": "VDC", "q": "Một nhà màng 500 m2 dùng 20 bóng LED 50W chiếu 4 giờ mỗi đêm. Tính điện năng tiêu thụ mỗi đêm (ghi số và đơn vị).", "answer": "4 kWh", "explain": "Tổng công suất = 20 x 50W = 1000W = 1 kW; điện năng = 1 kW x 4 giờ = 4 kWh mỗi đêm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Phân tích: Vì sao hệ thống IoT báo đất còn ẩm nhưng cây vẫn héo?", "answer": "vì cảm biến có thể đặt sai vị trí hoặc hỏng, hoặc cây héo do nguyên nhân khác như sâu bệnh, úng rễ", "explain": "Dữ liệu cảm biến cần kiểm chứng thực tế: cảm biến sai vị trí/hỏng cho số liệu sai; cây héo còn do bệnh, úng rễ... không phải lúc nào cũng do thiếu nước.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Ánh sáng đỏ và xanh dương quan trọng với cây vì lí do nào?", "answer": "A", "explain": "Diệp lục hấp thụ mạnh ánh sáng đỏ và xanh dương nên đây là hai phổ chính cho quang hợp; LED tạo được phổ phù hợp.", "points": 0.25, "options": ["A. Vì đó là hai vùng phổ ánh sáng cây hấp thụ mạnh nhất để quang hợp.", "B. Vì hai màu này đẹp mắt.", "C. Vì cây chỉ nhìn thấy hai màu này.", "D. Vì các màu khác gây hại cho cây."]}, {"type": "mcq", "level": "NB", "q": "Chiếu sáng bổ sung cho thanh long vào ban đêm nhằm mục đích gì?", "answer": "A", "explain": "Thanh long ra hoa theo quang chu kì; thắp sáng ban đêm (kích thích ra hoa trái vụ) là kĩ thuật phổ biến ở Bình Thuận.", "points": 0.25, "options": ["A. Điều khiển để thanh long ra hoa trái vụ, cho thu hoạch vào thời điểm giá cao.", "B. Để quả thanh long phát sáng.", "C. Để xua muỗi cho vườn.", "D. Để thanh long không cần ban ngày."]}, {"type": "mcq", "level": "TH", "q": "Vì sao đèn LED ít làm cháy lá cây hơn bóng đèn sợi đốt khi chiếu gần?", "answer": "A", "explain": "LED hiệu suất cao, ít tỏa nhiệt nên có thể chiếu gần cây mà không gây cháy lá như bóng sợi đốt nóng.", "points": 0.25, "options": ["A. Vì LED ít tỏa nhiệt, phần lớn điện năng chuyển thành ánh sáng.", "B. Vì LED không phát ra ánh sáng.", "C. Vì LED luôn mát lạnh như đá.", "D. Vì cây thích đèn sợi đốt hơn."]}, {"type": "mcq", "level": "TH", "q": "Một nhà vườn muốn hoa ly nở đúng dịp Tết. Biện pháp công nghệ cao nào có thể áp dụng?", "answer": "A", "explain": "Điều khiển nhiệt độ (nhà màng) + quang chu kì (LED) giúp chủ động thời điểm ra hoa theo ý muốn.", "points": 0.25, "options": ["A. Kết hợp nhà màng điều chỉnh nhiệt độ và đèn LED điều khiển quang chu kì để hoa nở đúng hẹn.", "B. Ngắt hết lá của cây.", "C. Tưới nước sôi vào gốc.", "D. Để cây tự nhiên, không can thiệp."]}, {"type": "mcq", "level": "VD", "q": "So sánh đèn LED với đèn huỳnh quang khi chiếu sáng cho cây: ưu điểm vượt trội của LED là gì?", "answer": "A", "explain": "Ưu thế lớn nhất của LED là tùy chỉnh phổ sáng (đỏ/xanh theo giai đoạn) và hiệu suất năng lượng cao hơn huỳnh quang.", "points": 0.25, "options": ["A. Điều chỉnh được phổ màu theo nhu cầu cây và tiết kiệm điện hơn.", "B. Sáng hơn nên cây lớn nhanh hơn bất kể phổ sáng.", "C. Rẻ hơn nhiều nên ai cũng mua được.", "D. Không có ưu điểm gì."]}, {"type": "mcq", "level": "VDC", "q": "Tính toán: Một nhà màng 500 m2 cần chiếu sáng bổ sung 4 giờ/đêm bằng 20 bóng LED 50W. Mỗi đêm tiêu thụ bao nhiêu điện?", "answer": "A", "explain": "20 bóng x 50W = 1000W = 1 kW; chạy 4 giờ tiêu thụ 4 kWh mỗi đêm.", "points": 0.25, "options": ["A. 4 kWh (20 bóng x 0,05 kW x 4 giờ).", "B. 40 kWh.", "C. 0,4 kWh.", "D. 100 kWh."]}, {"type": "truefalse", "level": "VDC", "q": "Phân tích tình huống: Trang trại lắp IoT hiện đại nhưng cảm biến đặt sai vị trí, dữ liệu sai khiến hệ thống tưới thừa gây úng rễ. Xét tính đúng, sai:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: kết hợp quan sát thực tế. c) Sai: lỗi do lắp đặt, vận hành chứ không phải do công nghệ. d) Đúng.", "points": 1, "statements": ["a) Sự cố cho thấy lắp đặt, hiệu chuẩn cảm biến đúng kĩ thuật rất quan trọng.", "b) Người trồng vẫn cần kiểm tra thực tế, không nên phụ thuộc tuyệt đối vào dữ liệu cảm biến.", "c) Trường hợp này chứng tỏ IoT không có tác dụng gì trong nông nghiệp.", "d) Cần bảo dưỡng, kiểm tra định kì hệ thống cảm biến."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các nhận định sau về đầu tư công nghệ:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: lộ trình phù hợp. c) Sai: rất rủi ro. d) Đúng.", "points": 1, "statements": ["a) Trước khi đầu tư cần tính toán chi phí – lợi ích và thời gian hoàn vốn.", "b) Nên bắt đầu từ giải pháp vừa sức rồi nâng cấp dần khi có hiệu quả.", "c) Vay vốn lớn đầu tư công nghệ hiện đại nhất mà chưa có kĩ thuật là lựa chọn khôn ngoan.", "d) Có đầu ra ổn định giúp giảm rủi ro khi đầu tư công nghệ cao."]}, {"type": "short", "level": "VDC", "q": "Nêu một giải pháp khi trang trại dùng hệ thống tưới tự động nhưng khu vực hay mất điện.", "answer": "lắp nguồn điện dự phòng như máy phát điện hoặc pin mặt trời", "explain": "Hệ thống tự động phụ thuộc điện nên cần nguồn dự phòng (máy phát, pin mặt trời) và phương án vận hành thủ công khi sự cố.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Với 5 ha rau, nên mua drone hay thuê dịch vụ phun theo vụ? Vì sao? (trả lời ngắn gọn)", "answer": "nên thuê dịch vụ vì diện tích chưa đủ lớn để bù chi phí mua máy, bảo dưỡng và đào tạo", "explain": "Mua drone tốn chi phí máy, bảo dưỡng, đào tạo, giấy phép mà dùng không thường xuyên; thuê theo vụ kinh tế hơn với diện tích vừa.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Camera gắn trên drone giúp ích gì cho người trồng?", "answer": "A", "explain": "Ảnh từ drone bao quát diện rộng, giúp phát hiện sớm vùng cây bị bệnh, thiếu dinh dưỡng để xử lí kịp thời.", "points": 0.25, "options": ["A. Quan sát sinh trưởng cây trồng, phát hiện sớm sâu bệnh, đánh giá diện tích thiệt hại trên đồng ruộng rộng.", "B. Chụp ảnh cưới cho nông dân.", "C. Thay thế hoàn toàn mắt người.", "D. Tự động thu hoạch nông sản."]}, {"type": "mcq", "level": "NB", "q": "Lập bản đồ đồng ruộng bằng drone phục vụ mục đích gì?", "answer": "A", "explain": "Bản đồ số giúp quản lí chính xác từng vùng đất: bón phân, tưới khác nhau theo nhu cầu thực tế từng khu vực.", "points": 0.25, "options": ["A. Xác định diện tích, địa hình, vùng đất xấu để quy hoạch trồng, bón phân, tưới chính xác theo từng vùng.", "B. Chỉ để làm kỉ niệm.", "C. Để chia đất cho con cháu.", "D. Không có mục đích thực tế."]}, {"type": "mcq", "level": "TH", "q": "Vì sao phun thuốc bằng drone đều hơn phun tay?", "answer": "A", "explain": "Tốc độ bay, độ cao và lưu lượng phun được lập trình ổn định nên thuốc phân bố đều hơn phun tay phụ thuộc sức người.", "points": 0.25, "options": ["A. Vì drone bay với tốc độ và độ cao ổn định, lưu lượng phun được cài đặt chính xác.", "B. Vì drone phun thuốc đậm đặc hơn.", "C. Vì người phun tay luôn cẩn thận hơn.", "D. Vì drone không cần cài đặt gì."]}, {"type": "mcq", "level": "TH", "q": "Nhược điểm của việc sử dụng drone trong trồng trọt là gì?", "answer": "A", "explain": "Hạn chế: giá thành cao, cần đào tạo và giấy phép, không bay được khi gió to, mưa lớn, và cần tuân thủ quy định an toàn.", "points": 0.25, "options": ["A. Chi phí đầu tư, thuê dịch vụ cao; cần người được đào tạo; phụ thuộc thời tiết (gió to, mưa).", "B. Drone không có nhược điểm nào.", "C. Drone làm cây trồng chết hết.", "D. Drone chỉ bay được vào ban đêm."]}, {"type": "mcq", "level": "VD", "q": "Hợp tác xã em có 5 ha rau, đang phân vân mua drone hay thuê dịch vụ phun. Lời khuyên nào hợp lí?", "answer": "A", "explain": "Với 5 ha, thuê dịch vụ theo vụ kinh tế hơn mua máy (chi phí máy, bảo dưỡng, đào tạo, giấy phép lớn, dùng không thường xuyên).", "points": 0.25, "options": ["A. Nên thuê dịch vụ phun theo vụ vì diện tích chưa đủ lớn để bù chi phí mua, bảo dưỡng drone và đào tạo người lái.", "B. Nhất định phải mua drone mới là hiện đại.", "C. Không nên dùng drone trong mọi trường hợp.", "D. Bán đất để mua drone."]}, {"type": "mcq", "level": "VDC", "q": "Tổng hợp: Một bài báo cáo về 'công nghệ cao trong trồng trọt' cần trình bày những công nghệ nào?", "answer": "A", "explain": "Năm công nghệ tiêu biểu: nhà kính/nhà màng; tưới tiết kiệm, tự động; cảm biến và IoT; đèn LED bổ sung ánh sáng; drone.", "points": 0.25, "options": ["A. Nhà kính/nhà màng, tưới tiết kiệm tự động, cảm biến và IoT, đèn LED, drone.", "B. Chỉ cần trình bày về máy cày.", "C. Chỉ cần trình bày về phân bón.", "D. Chỉ cần trình bày về giống cây."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định tổng hợp sau:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: chất lượng cao, giá trị gia tăng. d) Sai: Việt Nam đang áp dụng thành công nhiều mô hình.", "points": 1, "statements": ["a) Năm công nghệ cao tiêu biểu là: nhà kính/nhà màng, tưới tiết kiệm tự động, cảm biến và IoT, đèn LED, drone.", "b) Các công nghệ này đều hướng tới sản xuất chính xác, tự động, tiết kiệm tài nguyên.", "c) Áp dụng công nghệ cao giúp nông sản Việt Nam nâng cao sức cạnh tranh.", "d) Công nghệ cao chỉ phù hợp với các nước phát triển, không phù hợp Việt Nam."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cần đổi mới tư duy, học kĩ thuật mới. d) Đúng.", "points": 1, "statements": ["a) Phát triển công nghệ cao trong trồng trọt cần gắn với đào tạo nhân lực.", "b) Chính sách hỗ trợ vốn, chuyển giao công nghệ giúp nông dân tiếp cận công nghệ cao.", "c) Người nông dân không cần thay đổi tư duy khi áp dụng công nghệ mới.", "d) Kết hợp công nghệ cao với sản xuất an toàn (VietGAP, hữu cơ) là hướng đi bền vững."]}, {"type": "short", "level": "VDC", "q": "Kể tên đầy đủ năm công nghệ cao tiêu biểu trong trồng trọt đã học.", "answer": "nhà kính/nhà màng; tưới tiết kiệm tự động; cảm biến và IoT; đèn LED; drone", "explain": "Năm công nghệ: (1) nhà kính/nhà màng, (2) tưới tiết kiệm tự động, (3) cảm biến và IoT, (4) đèn LED bổ sung ánh sáng, (5) drone.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu điểm chung của các công nghệ cao trong trồng trọt.", "answer": "chính xác, tự động, tiết kiệm tài nguyên", "explain": "Điểm chung: ứng dụng khoa học công nghệ để sản xuất chính xác, tự động, tiết kiệm tài nguyên và kiểm soát tốt quy trình.", "points": 0.5}]}]}
