"q": "Muốn tạo giống cà chua vừa to quả vừa kháng bệnh, nên chọn bố mẹ như thế nào?", "answer": "một cây to quả lai với một cây kháng bệnh", "explain": "Chọn bố mẹ có đặc tính tốt khác nhau: một cây cho quả to lai với một cây kháng bệnh.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Ưu thế lai là hiện tượng gì?", "options": ["A. Con lai F1 vượt trội hơn cả bố và mẹ về sinh trưởng, năng suất, chống chịu.", "B. Con lai giống hệt bố.", "C. Con lai giống hệt mẹ.", "D. Con lai yếu hơn bố mẹ."], "answer": "A", "explain": "Ưu thế lai: con lai thế hệ F1 sinh trưởng mạnh, năng suất cao hơn cả bố và mẹ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong sản xuất, người ta thường sử dụng hạt giống nào để tận dụng ưu thế lai?", "options": ["A. Hạt lai F1.", "B. Hạt lai F2.", "C. Hạt lai F3.", "D. Hạt bất kì."], "answer": "A", "explain": "Ưu thế lai biểu hiện mạnh nhất ở F1 nên sản xuất dùng hạt lai F1.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ví dụ nào sau đây tận dụng ưu thế lai?", "options": ["A. Trồng ngô lai LVN10 (hạt lai F1).", "B. Trồng lúa thuần ST25.", "C. Trồng rau bằng hạt tự để.", "D. Trồng cây bằng cành giâm."], "answer": "A", "explain": "Ngô lai LVN10 là hạt lai F1, tận dụng ưu thế lai cho năng suất vượt trội.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không nên dùng hạt của ruộng ngô lai F1 để làm giống vụ sau?", "options": ["A. Vì ưu thế lai giảm dần ở F2, cây phân li, năng suất giảm.", "B. Vì hạt F2 không nảy mầm.", "C. Vì pháp luật cấm.", "D. Vì không có lí do gì."], "answer": "A", "explain": "Ở thế hệ F2, ưu thế lai giảm, tính trạng phân li mạnh, năng suất giảm rõ rệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ưu thế lai biểu hiện mạnh nhất ở thế hệ nào?", "options": ["A. F1.", "B. F2.", "C. F3.", "D. Mọi thế hệ như nhau."], "answer": "A", "explain": "Ưu thế lai mạnh nhất ở F1 và giảm dần ở các thế hệ sau.", "points": 0.25}, {"type": "mcq", "level": "VD", "q" ions": [{"type": "mcq", "level": "NB", "q": "Phương pháp gây đột biến sử dụng tác nhân nào?", "options": ["A. Tia phóng xạ, tia tử ngoại hoặc hóa chất như cônsixin.", "B. Phân bón hóa học.", "C. Thuốc trừ sâu.", "D. Nước muối."], "answer": "A", "explain": "Tác nhân gây đột biến: vật lí (tia phóng xạ, tia tử ngoại), hóa học (cônsixin...).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mục đích của gây đột biến trong tạo giống là gì?", "options": ["A. Tạo ra các đột biến rồi chọn cá thể đột biến tốt làm giống.", "B. Diệt hết sâu bệnh.", "C. Làm cây chết.", "D. Không có mục đích gì."], "answer": "A", "explain": "Gây đột biến tạo nguồn biến dị mới, từ đó chọn được cá thể mang đặc tính tốt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giống dưa hấu không hạt được tạo ra bằng phương pháp nào?", "options": ["A. Gây đột biến đa bội bằng cônsixin.", "B. Lai hữu tính thông thường.", "C. Chọn lọc hàng loạt.", "D. Nuôi cấy mô."], "answer": "A", "explain": "Dùng cônsixin gây đột biến đa bội tạo dưa hấu tam bội (3n) không hạt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ưu điểm của phương pháp gây đột biến là gì?", "options": ["A. Tạo được đặc tính mới mà lai tạo thông thường khó có được.", "B. Luôn tạo ra đột biến tốt.", "C. Không cần chọn lọc.", "D. Rất đơn giản, ai cũng làm được."], "answer": "A", "explain": "Đột biến tạo biến dị mới (chín sớm, không hạt...) mà lai tạo khó đạt được.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhược điểm lớn nhất của gây đột biến là gì?", "options": ["A. Đột biến xảy ra ngẫu nhiên, đa số có hại, phải chọn lọc công phu.", "B. Không tạo được đột biến.", "C. Quá đơn giản.", "D. Không tốn kém."], "answer": "A", "explain": "Đột biến ngẫu nhiên, phần lớn có hại hoặc vô nghĩa; chỉ số ít có lợi nên phải chọn lọc kĩ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Chiếu tia gamma vào hạt lúa tạo được dòng lúa chín sớm hơn 10 ngày. Đây là ứng dụng của phương pháp nào và cần làm gì tiếp theo?", "options": ["A. Gây đột biến; cần chọn lọc, đánh giá dòng đột biến qua nhiều vụ để ổn định giống.", "B. Lai hữu tính; không cần làm gì.", "C. Nuôi cấy mô; đem trồng ngay.", "D. Chọn lọc hàng loạt; bỏ đi."], "answer": "A", "explain": "Đây là gây đột biến; sau đó phải chọn lọc, kiểm tra tính ổn định qua nhiều thế hệ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về gây đột biến:", "statements": ["a) Tác nhân gây đột biến gồm tia phóng xạ và hóa chất như cônsixin.", "b) Mục đích là tạo đột biến rồi chọn cá thể đột biến tốt.", "c) Đột biến xảy ra có định hướng theo ý muốn.", "d) Dưa hấu không hạt được tạo bằng gây đột biến đa bội."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: đột biến xảy ra ngẫu nhiên. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về ứng dụng gây đột biến:", "statements": ["a) Gây đột biến tạo được đặc tính mới mà lai tạo khó có.", "b) Đa số đột biến là có hại nên phải chọn lọc công phu.", "c) Sau gây đột biến, cá thể nào cũng tốt và làm giống được ngay.", "d) Chiếu tia gamma vào hạt lúa có thể tạo giống chín sớm."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: phải chọn lọc kĩ mới tìm được cá thể tốt. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên 2 tác nhân gây đột biến (1 vật lí, 1 hóa học).", "answer": "tia phóng xạ, cônsixin", "explain": "Tác nhân vật lí: tia phóng xạ (tia gamma), tia tử ngoại. Tác nhân hóa học: cônsixin...", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 1 ưu điểm và 1 nhược điểm của phương pháp gây đột biến.", "answer": "ưu điểm tạo được đặc tính mới, nhược điểm đột biến ngẫu nhiên phải chọn lọc công phu", "explain": "Ưu điểm: tạo được đặc tính mới mà lai tạo khó có. Nhược điểm: đột biến ngẫu nhiên, đa số có hại, phải chọn lọc công phu.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Nuôi cấy mô tế bào là phương pháp như thế nào?", "options": ["A. Nuôi mô cây trong môi trường nhân tạo vô trùng để tạo cây con hoàn chỉnh.", "B. Trồng cây trong đất.", "C. Cho hai cây giao phối.", "D. Chiếu tia phóng xạ vào hạt."], "answer": "A", "explain": "Nuôi cấy mô: lấy mô (đỉnh sinh trưởng, lá non...) nuôi trong môi trường nhân tạo thành cây con.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ưu điểm nổi bật của nuôi cấy mô là gì?", "options": ["A. Tạo số lượng lớn cây con đồng đều, sạch bệnh trong thời gian ngắn.", "B. Tạo giống hoàn toàn mới.", "C. Không cần phòng thí nghiệm.", "D. Rất rẻ tiền."], "answer": "A", "explain": "Nuôi cấy mô nhân nhanh với số lượng lớn, cây đồng đều và sạch bệnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nuôi cấy mô thường được ứng dụng để nhân giống cây nào?", "options": ["A. Lan, chuối, khoai tây.", "B. Lúa.", "C. Ngô.", "D. Đậu tương."], "answer": "A", "explain": "Lan, chuối, khoai tây, sâm... là các cây được nhân giống phổ biến bằng nuôi cấy mô.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cây con tạo ra bằng nuôi cấy mô thường sạch bệnh?", "options": ["A. Vì lấy mô đỉnh sinh trưởng (ít mầm bệnh) và nuôi trong môi trường vô trùng.", "B. Vì dùng thuốc trừ sâu.", "C. Vì cây tự kháng bệnh.", "D. Vì không có lí do gì."], "answer": "A", "explain": "Mô đỉnh sinh trưởng thường sạch virus; môi trường vô trùng ngăn lây nhiễm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nuôi cấy mô có vai trò gì trong bảo tồn giống quý hiếm?", "options": ["A. Nhân nhanh số lượng lớn từ ít mẫu ban đầu, bảo tồn nguồn gen.", "B. Làm mất giống quý.", "C. Không có vai trò gì.", "D. Chỉ dùng để nghiên cứu."], "answer": "A", "explain": "Từ một mẩu mô nhỏ có thể tạo hàng nghìn cây con, nhân nhanh và bảo tồn giống quý hiếm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vườn lan quý hiếm muốn nhân nhanh số lượng lớn cây con đồng đều, sạch bệnh để kinh doanh. Phương pháp phù hợp nhất là gì?", "options": ["A. Nuôi cấy mô tế bào.", "B. Gieo hạt.", "C. Chọn lọc hàng loạt.", "D. Gây đột biến."], "answer": "A", "explain": "Nuôi cấy mô nhân nhanh, đồng đều, sạch bệnh — phù hợp với lan quý hiếm kinh doanh.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về nuôi cấy mô:", "statements": ["a) Nuôi cấy mô là nuôi mô cây trong môi trường nhân tạo vô trùng.", "b) Cây con tạo ra đồng đều và sạch bệnh.", "c) Nuôi cấy mô nhân được số lượng lớn cây con trong thời gian ngắn.", "d) Nuôi cấy mô tạo ra giống biến đổi gen."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: giống biến đổi gen tạo bằng công nghệ chuyển gen.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về ứng dụng nuôi cấy mô:", "statements": ["a) Lan, chuối là cây được nhân giống phổ biến bằng nuôi cấy mô.", "b) Nuôi cấy mô giúp bảo tồn và nhân nhanh giống quý hiếm.", "c) Cây nuôi cấy mô sạch bệnh nhờ môi trường vô trùng.", "d) Nuôi cấy mô có thể thực hiện ngoài đồng ruộng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cần phòng thí nghiệm vô trùng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nuôi cấy mô tế bào là gì? (Trả lời ngắn gọn)", "answer": "nuôi mô cây trong môi trường nhân tạo để tạo cây con", "explain": "Nuôi cấy mô: lấy mô cây nuôi trong môi trường dinh dưỡng nhân tạo vô trùng để tạo thành cây con hoàn chỉnh.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 2 ưu điểm của phương pháp nuôi cấy mô.", "answer": "nhân nhanh số lượng lớn, cây sạch bệnh", "explain": "Ưu điểm: nhân nhanh số lượng lớn trong thời gian ngắn; cây con đồng đều, sạch bệnh; bảo tồn giống quý hiếm.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Công nghệ chuyển gen trong tạo giống là gì?", "options": ["A. Đưa gen quý từ loài này sang loài khác để tạo giống mang đặc tính mong muốn.", "B. Chọn cây tốt để làm giống.", "C. Cho hai cây giao phối.", "D. Nuôi cấy mô."], "answer": "A", "explain": "Chuyển gen: đưa gen quy định tính trạng tốt (kháng sâu, chịu hạn...) vào cây trồng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giống tạo ra bằng công nghệ chuyển gen được gọi là gì?", "options": ["A. Giống biến đổi gen.", "B. Giống thuần.", "C. Giống lai F1.", "D. Giống địa phương."], "answer": "A", "explain": "Giống mang gen được chuyển vào gọi là giống biến đổi gen (GMO).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ví dụ nào sau đây là giống biến đổi gen?", "options": ["A. Ngô chuyển gen kháng sâu đục thân.", "B. Lúa ST25.", "C. Ngô lai LVN10.", "D. Dưa hấu không hạt."], "answer": "A", "explain": "Ngô kháng sâu đục thân tạo bằng chuyển gen. ST25 (lai), LVN10 (lai), dưa hấu không hạt (đột biến) không phải chuyển gen.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ưu điểm của công nghệ chuyển gen so với lai hữu tính thông thường là gì?", "options": ["A. Đưa được gen quý từ loài rất xa, tạo đặc tính mới mà lai thường không làm được.", "B. Đơn giản hơn.", "C. Rẻ tiền hơn.", "D. Không cần phòng thí nghiệm."], "answer": "A", "explain": "Chuyển gen vượt qua rào cản loài, đưa được gen từ vi sinh vật, động vật vào cây trồng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chỉ thị phân tử có vai trò gì trong chọn tạo giống?", "options": ["A. Phát hiện sớm cá thể mang gen tốt, giúp chọn lọc nhanh và chính xác.", "B. Tạo ra gen mới.", "C. Diệt sâu bệnh.", "D. Không có vai trò gì."], "answer": "A", "explain": "Chỉ thị ADN giúp nhận biết cây mang gen quý ngay từ cây con, rút ngắn thời gian chọn tạo giống.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Muốn tạo giống bông kháng sâu mà trong họ hàng bông không có gen kháng, phương pháp nào phù hợp nhất?", "options": ["A. Công nghệ chuyển gen (đưa gen kháng sâu từ loài khác vào).", "B. Chọn lọc hàng loạt.", "C. Lai với cây bông thường.", "D. Gây đột biến ngẫu nhiên."], "answer": "A", "explain": "Khi nguồn gen trong loài không có, chuyển gen từ loài khác là cách duy nhất đưa được tính kháng vào.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về công nghệ chuyển gen:", "statements": ["a) Chuyển gen là đưa gen quý từ loài này sang loài khác.", "b) Giống tạo ra gọi là giống biến đổi gen.", "c) Chuyển gen vượt được rào cản khác loài.", "d) Lúa ST25 là giống biến đổi gen."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ST25 tạo bằng lai hữu tính và chọn lọc.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về ứng dụng chuyển gen và chỉ thị phân tử:", "statements": ["a) Ngô kháng sâu đục thân là giống biến đổi gen.", "b) Chỉ thị phân tử giúp chọn lọc nhanh, chính xác.", "c) Chuyển gen có thể đưa gen từ vi sinh vật vào cây trồng.", "d) Công nghệ chuyển gen đơn giản, nông dân tự làm được."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cần phòng thí nghiệm hiện đại, kĩ thuật cao.", "points": 1}, {"type": "short", "level": "VDC", "q": "Công nghệ chuyển gen là gì? (Trả lời ngắn gọn)", "answer": "đưa gen quý từ loài này sang loài khác để tạo giống mới", "explain": "Chuyển gen: đưa gen quy định tính trạng mong muốn (kháng sâu, chịu hạn...) từ loài này sang loài khác tạo giống biến đổi gen.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 1 ví dụ về giống cây trồng biến đổi gen.", "answer": "ngô kháng sâu đục thân", "explain": "Ví dụ: ngô chuyển gen kháng sâu đục thân, đậu tương chuyển gen chịu thuốc trừ cỏ...", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Phương pháp nào đơn giản, ít tốn kém nhất trong các phương pháp chọn, tạo giống?", "options": ["A. Chọn lọc hàng loạt.", "B. Công nghệ chuyển gen.", "C. Nuôi cấy mô.", "D. Gây đột biến."], "answer": "A", "explain": "Chọn lọc hàng loạt đơn giản nhất, nông dân tự thực hiện được.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phương pháp nào cần phòng thí nghiệm hiện đại?", "options": ["A. Nuôi cấy mô và công nghệ chuyển gen.", "B. Chọn lọc hàng loạt.", "C. Chọn lọc cá thể.", "D. Lai hữu tính."], "answer": "A", "explain": "Nuôi cấy mô và chuyển gen đòi hỏi phòng thí nghiệm vô trùng, kĩ thuật cao.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phương pháp nào phổ biến nhất để tạo giống cây trồng mới?", "options": ["A. Lai hữu tính.", "B. Gây đột biến.", "C. Chuyển gen.", "D. Nuôi cấy mô."], "answer": "A", "explain": "Lai hữu tính là phương pháp truyền thống, phổ biến nhất trong tạo giống mới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sắp xếp các phương pháp theo mức độ hiện đại tăng dần: (1) chọn lọc, (2) lai tạo, (3) gây đột biến, (4) công nghệ sinh học. Thứ tự đúng là gì?", "options": ["A. (1), (2), (3), (4).", "B. (4), (3), (2), (1).", "C. (2), (1), (4), (3).", "D. (3), (4), (1), (2)."], "answer": "A", "explain": "Từ truyền thống đến hiện đại: chọn lọc, lai tạo, gây đột biến, công nghệ sinh học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Muốn nhân nhanh giống chuối quý hiếm với số lượng lớn, sạch bệnh, nên chọn phương pháp nào?", "options": ["A. Nuôi cấy mô.", "B. Gieo hạt.", "C. Lai hữu tính.", "D. Gây đột biến."], "answer": "A", "explain": "Nuôi cấy mô nhân nhanh, đồng đều, sạch bệnh — phù hợp nhân giống quý hiếm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một chương trình tạo giống lúa mới cần kết hợp nhiều phương pháp: lai tạo để kết hợp đặc tính, dùng chỉ thị phân tử để chọn nhanh. Điều này cho thấy đặc điểm gì của công tác giống hiện đại?", "options": ["A. Phối hợp nhiều phương pháp để rút ngắn thời gian, nâng cao hiệu quả tạo giống.", "B. Chỉ dùng một phương pháp duy nhất.", "C. Không cần phương pháp nào.", "D. Chỉ dùng phương pháp truyền thống."], "answer": "A", "explain": "Công tác giống hiện đại phối hợp truyền thống và hiện đại để nhanh, chính xác, hiệu quả.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau khi so sánh các phương pháp:", "statements": ["a) Chọn lọc hàng loạt đơn giản, ít tốn kém nhất.", "b) Lai hữu tính là phương pháp tạo giống mới phổ biến nhất.", "c) Nuôi cấy mô và chuyển gen cần phòng thí nghiệm hiện đại.", "d) Gây đột biến tạo biến dị có định hướng theo ý muốn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: đột biến xảy ra ngẫu nhiên.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về lựa chọn phương pháp tạo giống:", "statements": ["a) Muốn nhân nhanh giống quý hiếm nên dùng nuôi cấy mô.", "b) Muốn tạo đặc tính hoàn toàn mới nên dùng gây đột biến hoặc chuyển gen.", "c) Công tác giống hiện đại phối hợp nhiều phương pháp.", "d) Mọi phương pháp tạo giống đều đơn giản như nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: mức độ phức tạp khác nhau, CNSH đòi hỏi kĩ thuật cao.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên 4 nhóm phương pháp chọn, tạo giống cây trồng đã học.", "answer": "chọn lọc, lai tạo, gây đột biến, công nghệ sinh học", "explain": "Bốn nhóm: phương pháp chọn lọc, phương pháp lai tạo, phương pháp gây đột biến, ứng dụng công nghệ sinh học.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Muốn tạo giống lúa chín sớm mà các giống hiện có đều chín muộn, nên dùng phương pháp nào? Vì sao? (Ngắn gọn)", "answer": "gây đột biến vì tạo được đặc tính mới mà lai tạo khó có", "explain": "Nên dùng gây đột biến (hoặc chuyển gen) vì tạo được đặc tính mới không có trong nguồn gen hiện tại.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Giống lúa ST25 được tạo ra bằng phương pháp nào?", "options": ["A. Lai hữu tính và chọn lọc nhiều thế hệ.", "B. Gây đột biến bằng tia gamma.", "C. Chuyển gen.", "D. Nuôi cấy mô."], "answer": "A", "explain": "ST25 được lai tạo hữu tính rồi chọn lọc qua nhiều thế hệ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngô lai LVN10 được tạo ra bằng phương pháp nào?", "options": ["A. Lai tạo, tận dụng ưu thế lai (dùng hạt lai F1).", "B. Gây đột biến.", "C. Chuyển gen.", "D. Chọn lọc hàng loạt."], "answer": "A", "explain": "LVN10 là giống ngô lai, gieo hạt F1 để tận dụng ưu thế lai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dưa hấu không hạt được tạo ra bằng phương pháp nào?", "options": ["A. Gây đột biến đa bội bằng cônsixin.", "B. Lai hữu tính.", "C. Chuyển gen.", "D. Chọn lọc cá thể."], "answer": "A", "explain": "Dùng cônsixin gây đa bội tạo dưa hấu tam bội không hạt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao các vườn lan thương phẩm thường mua cây giống nuôi cấy mô?", "options": ["A. Vì cây đồng đều, sạch bệnh, số lượng lớn, chất lượng ổn định.", "B. Vì giá rẻ nhất.", "C. Vì không cần chăm sóc.", "D. Vì không có lí do gì."], "answer": "A", "explain": "Cây nuôi cấy mô đồng đều, sạch bệnh, đảm bảo chất lượng kinh doanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nông dân trồng ngô lai nên mua hạt giống F1 mới mỗi vụ thay vì để giống. Vì sao?", "options": ["A. Vì hạt F2 mất ưu thế lai, năng suất giảm, cây không đều.", "B. Vì hạt F1 không nảy mầm vụ sau.", "C. Vì pháp luật cấm để giống.", "D. Vì không có lí do gì."], "answer": "A", "explain": "Ưu thế lai giảm ở F2; mua hạt F1 mới đảm bảo năng suất cao, đồng đều.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một địa phương muốn phát triển vùng chuyên canh hoa lan xuất khẩu. Giải pháp về giống phù hợp nhất là gì?", "options": ["A. Nhập và nhân giống lan bằng nuôi cấy mô để có số lượng lớn, đồng đều, sạch bệnh.", "B. Gieo hạt lan ngoài đồng.", "C. Để lan mọc tự nhiên.", "D. Nhập hoa về bán."], "answer": "A", "explain": "Nuôi cấy mô là cách nhân giống lan thương phẩm hiệu quả nhất hiện nay.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về ví dụ thực tế:", "statements": ["a) Lúa ST25 được tạo bằng lai hữu tính và chọn lọc.", "b) Ngô lai LVN10 tận dụng ưu thế lai.", "c) Dưa hấu không hạt được tạo bằng gây đột biến đa bội.", "d) Lan thương phẩm thường được nhân bằng nuôi cấy mô."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: cả 4 đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về ví dụ tạo giống thực tế:", "statements": ["a) Trồng ngô lai nên mua hạt F1 mới mỗi vụ.", "b) Dùng hạt thu từ ruộng ngô lai F1 làm giống cho năng suất tương đương.", "c) Nuôi cấy mô giúp nhân nhanh giống lan quý hiếm.", "d) Mỗi phương pháp tạo giống có ưu thế riêng, cần chọn phù hợp mục đích."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: F2 mất ưu thế lai, năng suất giảm. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu phương pháp tạo ra mỗi giống sau: lúa ST25, ngô lai LVN10, dưa hấu không hạt.", "answer": "ST25 lai hữu tính, LVN10 lai tận dụng ưu thế lai, dưa hấu không hạt gây đột biến đa bội", "explain": "ST25: lai hữu tính và chọn lọc. Ngô lai LVN10: lai tạo, dùng hạt F1 (ưu thế lai). Dưa hấu không hạt: gây đột biến đa bội bằng cônsixin.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao vườn lan thương phẩm ưa dùng cây giống nuôi cấy mô? (Nêu 2 lí do)", "answer": "cây đồng đều, sạch bệnh", "explain": "Cây nuôi cấy mô: đồng đều, sạch bệnh, số lượng lớn, chất lượng ổn định, nhân nhanh giống quý.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Có mấy nhóm phương pháp chọn, tạo giống cây trồng chính đã học?", "options": ["A. 4 nhóm: chọn lọc, lai tạo, gây đột biến, công nghệ sinh học.", "B. 2 nhóm.", "C. 3 nhóm.", "D. 5 nhóm."], "answer": "A", "explain": "Bốn nhóm: chọn lọc, lai tạo, gây đột biến, ứng dụng công nghệ sinh học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phương pháp nào tạo ra con lai mang đặc tính tốt của cả bố và mẹ?", "options": ["A. Lai hữu tính.", "B. Chọn lọc hàng loạt.", "C. Nuôi cấy mô.", "D. Bảo quản hạt giống."], "answer": "A", "explain": "Lai hữu tính kết hợp đặc tính tốt của bố và mẹ vào con lai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phương pháp nào tạo ra cây con đồng đều, sạch bệnh với số lượng lớn?", "options": ["A. Nuôi cấy mô.", "B. Gieo hạt.", "C. Chọn lọc hàng loạt.", "D. Gây đột biến."], "answer": "A", "explain": "Nuôi cấy mô trong môi trường vô trùng tạo cây con đồng đều, sạch bệnh, số lượng lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một nhà khoa học muốn tạo giống lúa kháng bệnh mà nguồn gen lúa không có gen kháng. Phương pháp khả thi nhất là gì?", "options": ["A. Công nghệ chuyển gen (đưa gen kháng từ loài khác vào).", "B. Chọn lọc hàng loạt.", "C. Lai hai giống lúa thường.", "D. Không thể tạo được."], "answer": "A", "explain": "Khi nguồn gen trong loài không có, chuyển gen từ loài khác là giải pháp khả thi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sắp xếp đúng trình tự tạo giống bằng lai hữu tính: (1) chọn bố mẹ, (2) cho giao phối, (3) chọn lọc các thế hệ sau, (4) khảo nghiệm, công nhận giống. Thứ tự đúng là gì?", "options": ["A. (1), (2), (3), (4).", "B. (2), (1), (4), (3).", "C. (4), (3), (2), (1).", "D. (1), (3), (2), (4)."], "answer": "A", "explain": "Trình tự: chọn bố mẹ tốt khác nhau, cho lai, chọn lọc nhiều thế hệ, khảo nghiệm rồi công nhận.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một chương trình tạo giống ngô: lai hai dòng thuần để tạo hạt F1 năng suất cao; đồng thời dùng chỉ thị phân tử để chọn nhanh dòng bố mẹ tốt. Nhận xét đúng là gì?", "options": ["A. Phối hợp lai tạo (truyền thống) với công nghệ sinh học (hiện đại) để hiệu quả cao.", "B. Chỉ dùng phương pháp truyền thống.", "C. Chỉ dùng công nghệ sinh học.", "D. Cách làm sai."], "answer": "A", "explain": "Phối hợp nhiều phương pháp là xu hướng hiện đại: nhanh, chính xác, hiệu quả.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định tổng hợp sau về chọn, tạo giống:", "statements": ["a) Chọn lọc gồm chọn lọc hàng loạt và chọn lọc cá thể.", "b) Lai hữu tính kết hợp được đặc tính tốt của bố và mẹ.", "c) Ưu thế lai biểu hiện mạnh nhất ở F1.", "d) Gây đột biến tạo biến dị có định hướng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: đột biến xảy ra ngẫu nhiên.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về tổng hợp các phương pháp tạo giống:", "statements": ["a) Nuôi cấy mô nhân nhanh cây con đồng đều, sạch bệnh.", "b) Chuyển gen tạo được giống biến đổi gen.", "c) Chỉ thị phân tử giúp chọn lọc nhanh, chính xác.", "d) Mọi phương pháp tạo giống đều cho kết quả nhanh như nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: thời gian và độ phức tạp khác nhau.", "points": 1}, {"type": "short", "level": "VDC", "q": "Hoàn thành sơ đồ tạo giống bằng lai: Chọn bố mẹ tốt khác nhau, cho ..., chọn lọc các thế hệ sau, khảo nghiệm và ... giống.", "answer": "giao phối, công nhận", "explain": "Trình tự: chọn bố mẹ, cho giao phối (lai), chọn lọc các thế hệ sau, khảo nghiệm và công nhận giống mới.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 2 phương pháp hiện đại trong chọn, tạo giống và ưu điểm của mỗi phương pháp. (Ngắn gọn)", "answer": "gây đột biến tạo đặc tính mới, công nghệ sinh học nhanh chính xác", "explain": "Gây đột biến: tạo được đặc tính mới. Công nghệ sinh học (nuôi cấy mô, chuyển gen, chỉ thị phân tử): nhanh, chính xác, nhân nhanh số lượng lớn.", "points": 0.5}]}]}
