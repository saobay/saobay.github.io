{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên tắc \"4 đúng\" khi bón phân gồm những nội dung nào?", "options": ["A. Đúng loại, đúng liều lượng, đúng lúc, đúng cách.", "B. Đúng giờ, đúng ngày, đúng tháng, đúng năm.", "C. Đúng đất, đúng nước, đúng ánh sáng, đúng nhiệt độ.", "D. Đúng cây, đúng giống, đúng mùa, đúng vụ."], "answer": "A", "explain": "Nguyên tắc \"4 đúng\": đúng loại phân, đúng liều lượng, đúng lúc (thời điểm) và đúng cách (phương pháp).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "\"Đúng loại\" trong nguyên tắc bón phân có nghĩa là gì?", "options": ["A. Chọn loại phân phù hợp với loại cây, giai đoạn sinh trưởng và loại đất.", "B. Chỉ dùng một loại phân duy nhất cho mọi loại cây.", "C. Dùng loại phân đắt tiền nhất.", "D. Dùng loại phân có màu sắc đẹp nhất."], "answer": "A", "explain": "\"Đúng loại\" là chọn phân phù hợp với nhu cầu của cây (loại cây, giai đoạn) và điều kiện đất đai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "\"Đúng liều lượng\" trong nguyên tắc bón phân có nghĩa là gì?", "options": ["A. Bón đủ theo nhu cầu của cây, không thiếu cũng không thừa.", "B. Bón càng nhiều càng tốt.", "C. Bón càng ít càng tốt để tiết kiệm.", "D. Bón theo cảm tính của người nông dân."], "answer": "A", "explain": "\"Đúng liều lượng\" là bón đủ nhu cầu của cây: thiếu làm giảm năng suất, thừa gây hại và lãng phí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phải tuân thủ nguyên tắc \"4 đúng\" khi bón phân?", "options": ["A. Vì giúp phân bón phát huy hiệu quả cao nhất, tránh gây hại cho cây, đất và môi trường.", "B. Vì đó là quy định bắt buộc của pháp luật.", "C. Vì giúp người nông dân đỡ tốn công.", "D. Vì phân bón rất đắt tiền."], "answer": "A", "explain": "Bón sai loại, sai liều, sai lúc, sai cách đều làm giảm hiệu quả, thậm chí gây ngộ độc cây, ô nhiễm môi trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một nông dân bón phân đạm cho ruộng lúa vào lúc trời sắp mưa to. Việc làm này vi phạm \"đúng\" nào?", "options": ["A. Đúng lúc (đúng thời điểm).", "B. Đúng loại.", "C. Đúng liều lượng.", "D. Đúng cách."], "answer": "A", "explain": "Bón trước mưa to làm phân bị rửa trôi, cây không hấp thu được — vi phạm \"đúng lúc\".", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vườn rau bị vàng lá do thiếu đạm nhưng người trồng lại bón thêm phân lân. Kết quả rau vẫn vàng và lãng phí phân. Sai lầm này vi phạm nguyên tắc nào?", "options": ["A. Đúng loại (chọn sai loại phân so với nhu cầu của cây).", "B. Đúng liều lượng.", "C. Đúng lúc.", "D. Đúng cách."], "answer": "A", "explain": "Cây thiếu đạm cần phân đạm, bón phân lân là sai loại phân so với nhu cầu thực tế của cây.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về nguyên tắc \"4 đúng\":", "statements": ["a) \"4 đúng\" gồm: đúng loại, đúng liều lượng, đúng lúc, đúng cách.", "b) Đúng loại là chọn phân phù hợp với cây trồng và đất đai.", "c) Đúng liều lượng nghĩa là bón càng nhiều càng tốt.", "d) Tuân thủ \"4 đúng\" giúp tăng hiệu quả phân bón và bảo vệ môi trường."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: đúng liều lượng là bón đủ, không thiếu không thừa. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về vận dụng \"4 đúng\":", "statements": ["a) Bón phân đạm cho rau ăn lá là vận dụng \"đúng loại\".", "b) Bón thừa phân hóa học không vi phạm \"đúng liều lượng\".", "c) Bón thúc khi cây đang cần dinh dưỡng là vận dụng \"đúng lúc\".", "d) Phun phân bón lá với nồng độ đặc để cây hấp thu nhanh là \"đúng cách\"."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: rau ăn lá cần nhiều đạm. b) Sai: bón thừa là vi phạm đúng liều lượng. c) Đúng. d) Sai: phun nồng độ đặc gây cháy lá, vi phạm đúng cách.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên \"4 đúng\" trong nguyên tắc bón phân.", "answer": "đúng loại, đúng liều lượng, đúng lúc, đúng cách", "explain": "Nguyên tắc \"4 đúng\": đúng loại, đúng liều lượng, đúng lúc (thời điểm), đúng cách (phương pháp).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Bón phân không đúng liều lượng (quá nhiều) có thể gây ra 2 hậu quả gì?", "answer": "gây hại cho cây trồng, gây ô nhiễm môi trường", "explain": "Bón thừa phân gây ngộ độc, cháy rễ cây; đồng thời dư lượng rửa trôi gây ô nhiễm nguồn nước, đất.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Loại cây nào sau đây cần được bón nhiều phân đạm nhất?", "options": ["A. Rau ăn lá (rau muống, cải xanh).", "B. Cây lấy củ (khoai lang).", "C. Cây ăn quả (cam, bưởi).", "D. Cây lấy gỗ."], "answer": "A", "explain": "Rau ăn lá thu hoạch thân, lá nên cần nhiều đạm để sinh trưởng thân lá.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây lấy củ, quả (khoai, sắn, mía) nên được ưu tiên bón loại phân nào?", "options": ["A. Phân kali.", "B. Phân đạm.", "C. Phân vi sinh cố định đạm.", "D. Chỉ bón phân chuồng."], "answer": "A", "explain": "Kali thúc đẩy vận chuyển chất hữu cơ về củ, quả và tăng chất lượng nên cây lấy củ, quả cần nhiều kali.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đất chua (pH thấp) không nên bón loại phân nào?", "options": ["A. Phân có tính chua như đạm sunfat (SA).", "B. Phân lân nung chảy có tính kiềm.", "C. Vôi bột.", "D. Phân hữu cơ hoai mục."], "answer": "A", "explain": "Đất đã chua không nên bón thêm phân có tính chua (SA) vì làm đất càng chua; nên dùng vôi hoặc phân có tính kiềm để cải tạo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cây họ đậu (lạc, đậu tương) cần ít phân đạm hóa học hơn các cây trồng khác?", "options": ["A. Vì rễ cây họ đậu có vi khuẩn Rhizobium cộng sinh cố định đạm từ không khí.", "B. Vì cây họ đậu không cần đạm.", "C. Vì cây họ đậu tự quang hợp tạo ra đạm.", "D. Vì đất trồng cây họ đậu luôn giàu đạm."], "answer": "A", "explain": "Nhờ Rhizobium cộng sinh ở nốt sần rễ cố định đạm, cây họ đậu tự đáp ứng một phần nhu cầu đạm nên cần ít phân đạm hóa học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một nông dân trồng lúa trên đất phèn (chua). Theo nguyên tắc \"đúng loại\", biện pháp nào phù hợp nhất?", "options": ["A. Bón vôi để khử chua kết hợp phân lân nung chảy.", "B. Bón thật nhiều đạm sunfat.", "C. Không bón phân gì cả.", "D. Chỉ bón phân đạm urê."], "answer": "A", "explain": "Đất phèn chua cần bón vôi khử chua; phân lân nung chảy có tính kiềm phù hợp với đất chua.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vườn cà chua đang ra hoa, đậu quả nhưng người trồng bón thúc nhiều urê. Dự đoán hậu quả và cách khắc phục đúng \"đúng loại\" là gì?", "options": ["A. Cây tốt lá, đậu quả kém; nên giảm đạm, bổ sung lân và kali.", "B. Cây sẽ ra hoa nhiều hơn; tiếp tục bón urê.", "C. Không ảnh hưởng gì; cứ bón bình thường.", "D. Cây bị thiếu nước; chỉ cần tưới thêm."], "answer": "A", "explain": "Giai đoạn ra hoa, đậu quả cây cần lân và kali nhiều hơn đạm; bón thừa đạm làm cây tốt lốp, đậu quả kém.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về \"đúng loại\" phân bón:", "statements": ["a) Rau ăn lá nên ưu tiên bón phân đạm.", "b) Cây lấy củ, quả nên ưu tiên bón phân kali.", "c) Mọi loại cây trồng đều bón cùng một loại phân với liều lượng như nhau.", "d) Đất chua nên hạn chế bón các loại phân có tính chua."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: mỗi loại cây, mỗi loại đất có nhu cầu khác nhau. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về chọn phân theo giai đoạn sinh trưởng:", "statements": ["a) Giai đoạn cây con cần nhiều lân để phát triển rễ.", "b) Giai đoạn nuôi quả cần tăng cường kali để quả ngọt, chắc.", "c) Cây họ đậu không cần bón bất kì loại phân nào.", "d) Chọn phân theo nhu cầu từng giai đoạn là vận dụng \"đúng loại\"."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cây họ đậu vẫn cần lân, kali và một lượng đạm nhất định. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Cây trồng đang ở giai đoạn ra hoa, đậu quả cần ưu tiên nguyên tố dinh dưỡng nào? (Kể 2 nguyên tố)", "answer": "lân và kali", "explain": "Giai đoạn ra hoa, đậu quả cây cần nhiều lân (P) để ra hoa, đậu quả và kali (K) để nuôi quả, tăng chất lượng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 1 ví dụ về việc chọn sai loại phân so với nhu cầu của cây.", "answer": "bón nhiều đạm cho cây đang ra hoa đậu quả", "explain": "Ví dụ: cây thiếu lân mà bón đạm; cây ra hoa cần lân, kali mà chỉ bón đạm; đất chua mà bón phân chua. Chấp nhận ví dụ hợp lí tương đương.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "\"Đúng liều lượng\" nghĩa là bón phân như thế nào?", "options": ["A. Bón đủ theo nhu cầu của cây, không thiếu, không thừa.", "B. Bón càng nhiều càng tốt.", "C. Bón càng ít càng tốt.", "D. Bón theo thói quen."], "answer": "A", "explain": "Đúng liều lượng là bón đủ nhu cầu dinh dưỡng của cây trồng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hậu quả của việc bón thiếu phân cho cây trồng là gì?", "options": ["A. Cây còi cọc, sinh trưởng kém, năng suất thấp.", "B. Cây tốt lốp, dễ đổ ngã.", "C. Đất bị ô nhiễm nặng.", "D. Không có hậu quả gì."], "answer": "A", "explain": "Thiếu phân làm cây thiếu dinh dưỡng, sinh trưởng kém, năng suất và chất lượng giảm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hậu quả của việc bón thừa phân hóa học là gì?", "options": ["A. Gây ngộ độc cho cây, lãng phí và ô nhiễm môi trường.", "B. Cây sinh trưởng tốt hơn.", "C. Đất ngày càng tơi xốp.", "D. Không có hậu quả gì."], "answer": "A", "explain": "Thừa phân gây cháy rễ, ngộ độc cây, lãng phí tiền bạc và gây ô nhiễm đất, nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao bón thừa phân đạm cho rau ăn lá lại nguy hiểm cho người ăn?", "options": ["A. Vì rau tích lũy nitrat vượt ngưỡng, gây hại sức khỏe.", "B. Vì rau bị đắng không ăn được.", "C. Vì rau mất hết vitamin.", "D. Vì rau bị nhiễm thuốc trừ sâu."], "answer": "A", "explain": "Thừa đạm làm cây tích lũy nitrat (NO3-) trong lá; nitrat chuyển hóa trong cơ thể có thể gây hại sức khỏe.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Căn cứ nào giúp xác định liều lượng phân bón \"đúng\" cho cây trồng?", "options": ["A. Nhu cầu dinh dưỡng của từng loại cây, giai đoạn sinh trưởng và độ phì của đất.", "B. Giá phân bón trên thị trường.", "C. Sở thích của người nông dân.", "D. Màu sắc của lá cây."], "answer": "A", "explain": "Liều lượng đúng dựa trên nhu cầu của cây (loại cây, giai đoạn), độ phì nhiêu của đất và khuyến cáo kĩ thuật.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai ruộng lúa cùng giống: ruộng A bón đúng liều lượng khuyến cáo, ruộng B bón gấp đôi liều đạm. Dự đoán đúng là gì?", "options": ["A. Ruộng B có thể tốt lốp, dễ đổ ngã, sâu bệnh nhiều hơn mà năng suất không cao hơn.", "B. Ruộng B chắc chắn cho năng suất gấp đôi ruộng A.", "C. Hai ruộng cho năng suất như nhau.", "D. Ruộng A bị thiếu dinh dưỡng."], "answer": "A", "explain": "Thừa đạm gây tốt lốp, đổ ngã, sâu bệnh; năng suất không tăng tương ứng mà còn tốn chi phí, ô nhiễm.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về \"đúng liều lượng\":", "statements": ["a) Bón thiếu phân làm cây còi cọc, năng suất thấp.", "b) Bón thừa phân hóa học gây lãng phí và ô nhiễm môi trường.", "c) Bón càng nhiều phân thì năng suất càng cao, không giới hạn.", "d) Liều lượng phân bón phụ thuộc vào loại cây và độ phì của đất."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: thừa phân gây hại, năng suất không tăng vô hạn. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về liều lượng phân bón:", "statements": ["a) Rau thừa đạm tích lũy nitrat gây hại sức khỏe người ăn.", "b) Bón thừa phân lân ít gây hại ngay như bón thừa đạm.", "c) Đất đã giàu dinh dưỡng thì nên giảm liều lượng phân bón.", "d) Bón phân theo cảm tính, không theo khuyến cáo vẫn đảm bảo \"đúng liều lượng\"."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: lân ít gây ngộ độc cấp tính nhưng vẫn lãng phí. c) Đúng: điều chỉnh theo độ phì của đất. d) Sai: phải dựa trên nhu cầu cây và khuyến cáo kĩ thuật.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 2 hậu quả của việc bón thừa phân hóa học.", "answer": "gây ngộ độc cho cây, gây ô nhiễm môi trường", "explain": "Bón thừa phân: gây cháy rễ, ngộ độc cây; lãng phí; dư lượng rửa trôi gây ô nhiễm đất, nguồn nước.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Muốn bón đúng liều lượng, người nông dân cần căn cứ vào những yếu tố nào? (Nêu 2 yếu tố)", "answer": "nhu cầu của cây trồng, độ phì nhiêu của đất", "explain": "Căn cứ: nhu cầu dinh dưỡng của từng loại cây, từng giai đoạn sinh trưởng; độ phì nhiêu của đất; khuyến cáo kĩ thuật.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "\"Đúng lúc\" trong nguyên tắc bón phân có nghĩa là gì?", "options": ["A. Bón phân vào thời điểm cây cần dinh dưỡng nhất.", "B. Bón phân vào buổi sáng sớm mỗi ngày.", "C. Bón phân vào ngày lễ, tết.", "D. Bón phân bất cứ khi nào rảnh."], "answer": "A", "explain": "\"Đúng lúc\" là bón vào thời điểm cây đang cần nhiều dinh dưỡng nhất (đẻ nhánh, ra hoa, nuôi quả...).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thời điểm nào sau đây thích hợp để bón thúc cho lúa?", "options": ["A. Khi lúa đẻ nhánh và làm đòng.", "B. Khi lúa đã chín vàng.", "C. Khi ruộng đang ngập sâu.", "D. Ngay sau khi thu hoạch."], "answer": "A", "explain": "Lúa cần nhiều dinh dưỡng khi đẻ nhánh và làm đòng nên bón thúc vào các thời điểm này.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vì sao không nên bón phân đạm ngay trước lúc trời mưa to?", "options": ["A. Vì phân bị nước mưa rửa trôi, cây không hấp thu được, gây lãng phí và ô nhiễm.", "B. Vì mưa làm phân biến chất.", "C. Vì cây không cần dinh dưỡng khi trời mưa.", "D. Vì phân sẽ làm cây bị úng."], "answer": "A", "explain": "Mưa to rửa trôi phân khỏi ruộng, vừa lãng phí vừa gây ô nhiễm nguồn nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bón thúc quá muộn (khi cây đã già, sắp thu hoạch) có tác hại gì?", "options": ["A. Cây không kịp hấp thu, gây lãng phí và có thể làm giảm chất lượng nông sản.", "B. Cây sẽ cho năng suất cao hơn.", "C. Không có tác hại gì.", "D. Giúp quả chín nhanh hơn."], "answer": "A", "explain": "Bón muộn cây không sử dụng hết, gây lãng phí; thừa đạm muộn còn làm giảm chất lượng, tồn dư nitrat.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao bón phân vào lúc trời nắng gắt (giữa trưa) là không tốt?", "options": ["A. Vì phân dễ bay hơi, cây dễ bị cháy lá khi phun phân bón lá.", "B. Vì cây không quang hợp lúc nắng gắt.", "C. Vì đất quá khô nên phân không tan.", "D. Vì nông dân dễ bị say nắng."], "answer": "A", "explain": "Nắng gắt làm phân đạm bay hơi nhanh, phun phân bón lá lúc nắng dễ gây cháy lá. Nên bón vào sáng sớm hoặc chiều mát.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Lịch bón phân cho cà chua: bón lót trước trồng; bón thúc lần 1 khi cây ra hoa; bón thúc lần 2 khi quả đang lớn. Lịch này vận dụng tốt nguyên tắc nào?", "options": ["A. Đúng lúc: bón vào các thời điểm cây cần dinh dưỡng nhất.", "B. Đúng loại: mỗi lần dùng một loại phân.", "C. Đúng cách: bón bằng tay.", "D. Không vận dụng nguyên tắc nào."], "answer": "A", "explain": "Chia nhiều lần bón đúng vào giai đoạn cây cần (ra hoa, nuôi quả) là vận dụng \"đúng lúc\".", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về \"đúng lúc\":", "statements": ["a) Nên bón thúc khi cây đang ở giai đoạn cần nhiều dinh dưỡng.", "b) Bón phân trước lúc mưa to giúp phân tan nhanh, cây hấp thu tốt.", "c) Bón thúc quá muộn gây lãng phí phân bón.", "d) Nên bón phân vào sáng sớm hoặc chiều mát, tránh nắng gắt."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: mưa to rửa trôi phân. c) Đúng. d) Đúng: tránh bay hơi và cháy lá.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về bón thúc nhiều lần:", "statements": ["a) Chia phân thành nhiều lần bón thúc giúp cây hấp thu tốt hơn bón một lần.", "b) Bón đạm đón đòng cho lúa là vận dụng \"đúng lúc\".", "c) Trời mưa to vẫn nên bón phân để phân tan nhanh.", "d) Phun phân bón lá nên thực hiện lúc trời nắng gắt để lá khô nhanh."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: bón nhiều lần đáp ứng kịp thời nhu cầu từng giai đoạn. b) Đúng. c) Sai: mưa to gây rửa trôi. d) Sai: nắng gắt gây cháy lá, nên phun sáng sớm/chiều mát.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 2 thời điểm thích hợp để bón thúc cho cây lúa.", "answer": "khi lúa đẻ nhánh, khi lúa làm đòng", "explain": "Lúa cần bón thúc khi đẻ nhánh và khi làm đòng (đón đòng) — các giai đoạn cần nhiều dinh dưỡng nhất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao không nên bón phân hóa học ngay trước khi trời mưa to? (Nêu 1 lí do)", "answer": "phân bị nước mưa rửa trôi gây lãng phí", "explain": "Mưa to rửa trôi phân khỏi ruộng làm cây không hấp thu được (lãng phí) và gây ô nhiễm nguồn nước.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "\"Đúng cách\" trong nguyên tắc bón phân có nghĩa là gì?", "options": ["A. Sử dụng phương pháp bón phù hợp với từng loại phân và loại cây.", "B. Bón phân bằng tay thay vì bằng máy.", "C. Bón phân thật nhanh để đỡ tốn công.", "D. Bón phân vào ban đêm."], "answer": "A", "explain": "\"Đúng cách\" là chọn phương pháp bón phù hợp: bón vào đất hay bón qua lá, bón lót hay bón thúc...", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phân lân (ít di động trong đất) nên được bón bằng cách nào?", "options": ["A. Bón lót, bón sâu vào tầng đất có rễ cây.", "B. Rải trên mặt đất không cần vùi.", "C. Phun lên lá với nồng độ đặc.", "D. Hòa vào nước tưới mỗi ngày."], "answer": "A", "explain": "Lân ít di động nên phải bón lót sâu vào tầng rễ thì cây mới hấp thu được.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi phun phân bón lá, cần lưu ý gì về nồng độ?", "options": ["A. Pha nồng độ loãng theo hướng dẫn để tránh cháy lá.", "B. Pha càng đặc càng tốt.", "C. Không cần pha, dùng nguyên chất.", "D. Pha đặc gấp đôi hướng dẫn."], "answer": "A", "explain": "Phân bón lá phải pha loãng đúng hướng dẫn; nồng độ đặc gây cháy lá, hại cây.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao sau khi bón phân hóa học vào đất thường phải vùi lấp hoặc tưới nước?", "options": ["A. Vì giúp phân tiếp xúc với rễ, hạn chế bay hơi và rửa trôi.", "B. Vì để phân không bị chuột ăn.", "C. Vì để đất đẹp hơn.", "D. Vì để phân có màu đẹp."], "answer": "A", "explain": "Vùi lấp/tưới nước giúp phân tan, tiếp xúc với rễ, giảm bay hơi (đạm) và rửa trôi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bón phân theo hốc, theo hàng có ưu điểm gì so với rải đều trên mặt ruộng?", "options": ["A. Tập trung phân vào vùng rễ, tiết kiệm phân, tăng hiệu quả sử dụng.", "B. Tốn ít công hơn.", "C. Không cần vùi lấp.", "D. Phân tác dụng chậm hơn."], "answer": "A", "explain": "Bón theo hốc/hàng đưa phân đúng vùng rễ cây, giảm thất thoát, tiết kiệm phân.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cây cam có biểu hiện thiếu kẽm (lá vàng, gân xanh) trong khi rễ cây vẫn khỏe. Cách xử lí \"đúng cách\" nhất là gì?", "options": ["A. Phun phân bón lá chứa kẽm với nồng độ loãng.", "B. Bón thật nhiều phân đạm vào gốc.", "C. Đào rễ lên để kiểm tra.", "D. Ngừng bón phân hoàn toàn."], "answer": "A", "explain": "Thiếu vi lượng cần bổ sung nhanh qua lá; phun phân bón lá nồng độ loãng là cách phù hợp nhất.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về \"đúng cách\":", "statements": ["a) Phân lân nên bón lót sâu vào đất vì ít di động.", "b) Phân bón lá phải pha đúng nồng độ loãng theo hướng dẫn.", "c) Bón phân xong nên vùi lấp hoặc tưới nước để phân tiếp xúc với rễ.", "d) Mọi loại phân đều bón bằng một cách duy nhất là rải trên mặt đất."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: tránh cháy lá. c) Đúng. d) Sai: có nhiều cách bón (vào đất, qua lá, theo hốc...) tùy loại phân, loại cây.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về phương pháp bón phân:", "statements": ["a) Bón phân đạm rồi không vùi lấp làm đạm dễ bay hơi, giảm hiệu quả.", "b) Phun phân bón lá nồng độ đặc giúp cây hấp thu nhanh hơn.", "c) Bón theo hốc giúp tiết kiệm phân so với rải đều.", "d) Khi rễ cây bị tổn thương, bón qua lá là cách bổ sung dinh dưỡng nhanh."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: nồng độ đặc gây cháy lá. c) Đúng. d) Đúng: lá hấp thu trực tiếp khi rễ kém.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 2 cách bón phân vào đất.", "answer": "bón rải, bón theo hàng hoặc theo hốc", "explain": "Các cách bón vào đất: rải đều rồi vùi lấp, bón theo hàng, bón theo hốc, bón sâu kết hợp vun xới.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Khi nào nên áp dụng cách bón phân qua lá? (Nêu 1 trường hợp)", "answer": "khi cần bổ sung nhanh chất dinh dưỡng hoặc rễ cây hoạt động kém", "explain": "Bón qua lá khi cần bổ sung nhanh (thiếu vi lượng), khi rễ kém hấp thu, hoặc giai đoạn cây cần gấp.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Bón lót là gì?", "options": ["A. Bón phân trước khi gieo trồng.", "B. Bón phân khi cây đang ra hoa.", "C. Bón phân sau khi thu hoạch.", "D. Phun phân lên lá."], "answer": "A", "explain": "Bón lót là bón phân vào đất trước khi gieo trồng (thường vùi lấp).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bón thúc là gì?", "options": ["A. Bón phân trong quá trình sinh trưởng của cây.", "B. Bón phân trước khi gieo trồng.", "C. Bón phân sau khi thu hoạch xong.", "D. Bón phân vào mùa đông."], "answer": "A", "explain": "Bón thúc là bón bổ sung trong quá trình cây sinh trưởng, vào lúc cây cần dinh dưỡng nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Loại phân nào thường được dùng để bón lót?", "options": ["A. Phân hữu cơ và phân lân.", "B. Phân đạm urê.", "C. Phân bón lá.", "D. Phân kali clorua."], "answer": "A", "explain": "Bón lót thường dùng phân hữu cơ và phân lân (ít di động, cần thời gian phân giải, bón sâu).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phân đạm thường được dùng để bón thúc mà ít dùng để bón lót?", "options": ["A. Vì đạm dễ hòa tan, tác dụng nhanh, cây hấp thu kịp thời khi đang sinh trưởng.", "B. Vì đạm rất đắt tiền.", "C. Vì đạm làm đất chua.", "D. Vì đạm không tan trong nước."], "answer": "A", "explain": "Phân đạm dễ tan, tác dụng nhanh nên bón thúc đáp ứng kịp thời nhu cầu của cây đang sinh trưởng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ưu điểm của việc chia phân thành nhiều lần bón thúc là gì?", "options": ["A. Đáp ứng kịp thời nhu cầu dinh dưỡng của cây theo từng giai đoạn, giảm thất thoát.", "B. Tốn ít công hơn.", "C. Không cần bón lót nữa.", "D. Làm đất tơi xốp hơn."], "answer": "A", "explain": "Bón nhiều lần đúng giai đoạn giúp cây hấp thu tối đa, giảm rửa trôi, bay hơi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nông dân bón toàn bộ phân urê một lần duy nhất vào đầu vụ lúa. Hạn chế của cách làm này là gì?", "options": ["A. Cây không dùng hết, phân bị rửa trôi, bay hơi gây lãng phí; cuối vụ cây thiếu dinh dưỡng.", "B. Lúa sẽ cho năng suất cao nhất.", "C. Không có hạn chế gì.", "D. Giúp đất tơi xốp hơn."], "answer": "A", "explain": "Bón một lần cây không hấp thu hết, đạm dễ mất đi; nên chia nhiều lần bón thúc đúng giai đoạn.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về bón lót và bón thúc:", "statements": ["a) Bón lót được thực hiện trước khi gieo trồng.", "b) Bón thúc được thực hiện trong quá trình cây sinh trưởng.", "c) Phân hữu cơ và phân lân thường dùng để bón lót.", "d) Phân đạm và phân kali thường dùng để bón thúc."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng: hữu cơ cần thời gian phân giải, lân ít di động. d) Đúng: đạm, kali dễ tan, tác dụng nhanh.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về bón lót và bón thúc:", "statements": ["a) Bón lót phân hữu cơ giúp cải tạo đất ngay từ đầu vụ.", "b) Bón thúc đạm đón đòng giúp lúa trổ bông tốt.", "c) Chỉ cần bón lót là đủ, không cần bón thúc.", "d) Chia nhỏ liều phân đạm thành nhiều lần bón thúc cho hiệu quả cao hơn bón một lần."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cây cần bổ sung dinh dưỡng trong sinh trưởng nên vẫn cần bón thúc. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Phân biệt bón lót và bón thúc về thời điểm thực hiện.", "answer": "bón lót trước khi gieo trồng, bón thúc trong quá trình cây sinh trưởng", "explain": "Bón lót: trước khi gieo trồng. Bón thúc: trong quá trình cây sinh trưởng, khi cây cần dinh dưỡng nhất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 2 loại phân thường dùng để bón lót và 2 loại thường dùng để bón thúc.", "answer": "bón lót: phân hữu cơ và phân lân; bón thúc: phân đạm và phân kali", "explain": "Bón lót: phân hữu cơ, phân lân. Bón thúc: phân đạm (urê), phân kali.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Bón phân vào đất có thể thực hiện bằng những cách nào?", "options": ["A. Rải đều, bón theo hàng, theo hốc, bón sâu kết hợp vun xới.", "B. Chỉ có cách phun lên lá.", "C. Chỉ có cách hòa vào nước tưới.", "D. Chỉ có cách rải trên mặt đất."], "answer": "A", "explain": "Bón vào đất gồm: rải đều rồi vùi lấp, bón theo hàng, theo hốc, bón sâu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bón phân qua lá là gì?", "options": ["A. Hòa phân vào nước rồi phun lên lá để cây hấp thu trực tiếp.", "B. Rải phân lên mặt lá rồi để nguyên.", "C. Bón phân vào gốc cây.", "D. Trộn phân với đất rồi đắp lên lá."], "answer": "A", "explain": "Bón qua lá là phun dung dịch phân bón lên lá, cây hấp thu dinh dưỡng trực tiếp qua lá.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trường hợp nào sau đây nên áp dụng bón phân qua lá?", "options": ["A. Khi cần bổ sung nhanh chất dinh dưỡng, nhất là nguyên tố vi lượng.", "B. Khi muốn bón một lượng phân rất lớn.", "C. Khi đất đã đủ dinh dưỡng.", "D. Khi trời đang mưa to."], "answer": "A", "explain": "Bón qua lá cho tác dụng nhanh, phù hợp khi cần bổ sung gấp vi lượng hoặc khi rễ hấp thu kém.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ưu điểm của bón phân qua lá so với bón vào đất là gì?", "options": ["A. Cây hấp thu nhanh, hiệu quả cao với lượng phân ít, nhất là vi lượng.", "B. Bón được lượng phân rất lớn.", "C. Không cần pha chế.", "D. Thay thế hoàn toàn bón vào đất."], "answer": "A", "explain": "Lá hấp thu trực tiếp nên nhanh, tiết kiệm, hiệu quả với vi lượng; nhưng không thay thế được bón vào đất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hạn chế của bón phân qua lá là gì?", "options": ["A. Chỉ bổ sung được lượng nhỏ, không thay thế được bón vào đất; sai nồng độ gây cháy lá.", "B. Cây hấp thu quá chậm.", "C. Tốn nhiều phân hơn bón vào đất.", "D. Không bổ sung được vi lượng."], "answer": "A", "explain": "Bón qua lá chỉ là biện pháp bổ sung; lượng dinh dưỡng qua lá có hạn và phải đúng nồng độ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cây bưởi có biểu hiện thiếu magie (lá vàng giữa gân) trong khi đang nuôi quả. Biện pháp \"đúng cách\" và \"đúng lúc\" nhất là gì?", "options": ["A. Phun phân bón lá chứa magie với nồng độ loãng.", "B. Bón thật nhiều vôi vào gốc.", "C. Ngừng tưới nước.", "D. Chờ đến vụ sau mới xử lí."], "answer": "A", "explain": "Cần bổ sung nhanh magie khi đang nuôi quả; phun qua lá là nhanh và phù hợp nhất.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về cách bón phân:", "statements": ["a) Bón vào đất gồm các cách: rải đều, bón theo hàng, theo hốc.", "b) Bón qua lá là phun dung dịch phân bón lên lá cây.", "c) Bón qua lá có thể thay thế hoàn toàn việc bón phân vào đất.", "d) Phun phân bón lá phải đúng nồng độ để tránh cháy lá."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: bón qua lá chỉ bổ sung, không thay thế bón vào đất. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về bón vào đất và bón qua lá:", "statements": ["a) Khi rễ cây bị tổn thương, bón qua lá giúp cây nhận dinh dưỡng nhanh.", "b) Bón phân vào đất là cách cung cấp dinh dưỡng chủ yếu cho cây.", "c) Có thể phun phân bón lá với nồng độ đặc để tiết kiệm công phun.", "d) Nên phun phân bón lá vào sáng sớm hoặc chiều mát."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: nồng độ đặc gây cháy lá. d) Đúng: tránh nắng gắt.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 2 ưu điểm của cách bón phân qua lá.", "answer": "cây hấp thu nhanh, tiết kiệm phân bón", "explain": "Bón qua lá: cây hấp thu nhanh qua lá, hiệu quả cao với lượng phân ít, phù hợp bổ sung vi lượng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao bón phân qua lá không thể thay thế hoàn toàn bón phân vào đất? (Nêu 1 lí do)", "answer": "vì chỉ bổ sung được lượng dinh dưỡng nhỏ", "explain": "Lá chỉ hấp thu được lượng dinh dưỡng hạn chế; nhu cầu dinh dưỡng lớn của cây (N, P, K) vẫn phải cung cấp chủ yếu qua đất.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Phân đạm (urê, SA) cần được bảo quản ở nơi như thế nào?", "options": ["A. Nơi khô ráo, thoáng mát, trên kệ cao, tránh ẩm.", "B. Nơi ẩm ướt để phân không bị khô.", "C. Ngoài trời nắng để diệt khuẩn.", "D. Nơi nào cũng được."], "answer": "A", "explain": "Phân đạm rất dễ hút ẩm, vón cục nên phải để nơi khô ráo, thoáng mát, trên kệ cao.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vì sao không được để phân đạm chung với vôi bột?", "options": ["A. Vì xảy ra phản ứng hóa học làm mất đạm.", "B. Vì vôi làm phân đạm biến thành phân lân.", "C. Vì vôi hút hết đạm vào trong.", "D. Vì hai loại đều có mùi khó chịu."], "answer": "A", "explain": "Vôi (tính kiềm) phản ứng với phân đạm amoni giải phóng khí amoniac làm mất đạm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một số loại phân đạm (đạm nitrat) phải để xa chất dễ cháy vì sao?", "options": ["A. Vì có thể gây cháy, nổ khi tiếp xúc với chất dễ cháy.", "B. Vì làm chất dễ cháy bị ẩm.", "C. Vì phân đạm dễ bay hơi.", "D. Vì phân đạm có mùi khai."], "answer": "A", "explain": "Đạm nitrat là chất oxi hóa mạnh, gặp chất dễ cháy có nguy cơ cháy, nổ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bao urê đã mở dở nhưng không buộc kín miệng, để ngoài sân vài ngày. Hiện tượng và hậu quả là gì?", "options": ["A. Urê hút ẩm vón cục, bay hơi mất đạm, giảm chất lượng.", "B. Urê biến thành phân lân.", "C. Không có hiện tượng gì.", "D. Urê trở nên tốt hơn."], "answer": "A", "explain": "Urê dễ hút ẩm và bay hơi; để hở làm vón cục, mất đạm, giảm chất lượng phân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không nên phơi phân đạm dưới nắng gắt?", "options": ["A. Vì nhiệt độ cao làm đạm dễ bay hơi, phân hủy, giảm chất lượng.", "B. Vì nắng làm phân đạm biến thành phân hữu cơ.", "C. Vì nắng làm bao bì đẹp hơn.", "D. Vì không có lí do gì."], "answer": "A", "explain": "Nắng nóng thúc đẩy quá trình bay hơi và phân hủy của phân đạm, nhất là đạm amoni.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một hộ nông dân trộn vôi bột với phân đạm sunfat để bón một thể cho tiện. Đánh giá đúng về việc làm này là gì?", "options": ["A. Sai: vôi phản ứng với đạm amoni làm mất đạm, nên bón vôi và đạm cách nhau một thời gian.", "B. Đúng: trộn chung giúp tiết kiệm công.", "C. Đúng: vôi giúp đạm tác dụng nhanh hơn.", "D. Không ảnh hưởng gì."], "answer": "A", "explain": "Không trộn vôi với phân đạm amoni; nếu cần bón cả hai thì bón cách nhau ít nhất 7-10 ngày.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về bảo quản phân đạm:", "statements": ["a) Phân đạm nên để nơi khô ráo, thoáng mát, trên kệ cao.", "b) Phân đạm rất dễ hút ẩm nên bao bì phải kín.", "c) Có thể để phân đạm chung với vôi bột cho gọn kho.", "d) Đạm nitrat phải để xa các chất dễ cháy."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: vôi phản ứng làm mất đạm. d) Đúng: nguy cơ cháy, nổ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về bảo quản phân bón:", "statements": ["a) Để bao urê dở dang không buộc kín làm phân vón cục, mất đạm.", "b) Phơi phân đạm dưới nắng gắt giúp diệt khuẩn, bảo quản tốt hơn.", "c) Trộn vôi với đạm sunfat rồi bón ngay không gây mất đạm.", "d) Kho chứa phân đạm cần thoáng mát, tránh ẩm ướt."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng. b) Sai: nắng nóng làm mất đạm. c) Sai: phản ứng xảy ra ngay khi trộn, gây mất đạm. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 2 yêu cầu khi bảo quản phân đạm.", "answer": "để nơi khô ráo thoáng mát, bao bì kín", "explain": "Bảo quản phân đạm: nơi khô ráo, thoáng mát, trên kệ cao; bao bì kín; tránh nắng nóng; xa chất dễ cháy; không để chung với vôi.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích ngắn gọn vì sao không trộn vôi bột với phân đạm amoni.", "answer": "vì xảy ra phản ứng hóa học làm mất đạm", "explain": "Vôi có tính kiềm, phản ứng với phân đạm amoni giải phóng khí amoniac (NH3) bay đi, làm mất đạm.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Yêu cầu chung khi bảo quản phân bón là gì?", "options": ["A. Nơi khô ráo, thoáng mát, bao bì kín, có nhãn mác rõ ràng.", "B. Để ngoài trời mưa nắng.", "C. Để lẫn lộn các loại với nhau.", "D. Không cần bao bì."], "answer": "A", "explain": "Phân bón cần được bảo quản nơi khô ráo, thoáng mát, bao bì kín và ghi nhãn rõ ràng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vì sao kho chứa phân bón nên kê phân trên kệ cao?", "options": ["A. Vì tránh ẩm từ nền đất làm phân vón cục, giảm chất lượng.", "B. Vì để chuột không ăn được.", "C. Vì để phân đẹp hơn.", "D. Vì để tiết kiệm diện tích kho."], "answer": "A", "explain": "Nền kho thường ẩm; kê trên kệ cao giúp phân tránh ẩm, không bị vón cục.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phân vi sinh cần được bảo quản đặc biệt như thế nào?", "options": ["A. Nơi mát, tránh ánh nắng trực tiếp và dùng trong thời hạn để vi sinh vật còn sống.", "B. Phơi nắng cho khô.", "C. Để nơi nóng ẩm.", "D. Không cần bảo quản đặc biệt."], "answer": "A", "explain": "Vi sinh vật chết khi gặp nắng nóng hoặc quá hạn; cần giữ nơi mát, tránh nắng, dùng đúng hạn sử dụng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao các loại phân bón khác nhau nên để riêng và ghi nhãn rõ ràng?", "options": ["A. Vì tránh nhầm lẫn khi sử dụng và tránh các phản ứng có hại giữa các loại phân.", "B. Vì để kho đẹp hơn.", "C. Vì phân các loại kị nhau về màu sắc.", "D. Không cần thiết."], "answer": "A", "explain": "Để riêng, ghi nhãn giúp dùng đúng loại, đúng liều; tránh nhầm lẫn và phản ứng hóa học có hại (như vôi với đạm amoni).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân hữu cơ chưa ủ hoai mục nếu bảo quản đống lớn, ẩm ướt lâu ngày có thể xảy ra hiện tượng gì?", "options": ["A. Lên men, sinh nhiệt, có mùi hôi và có thể tự bốc cháy.", "B. Biến thành phân hóa học.", "C. Không có hiện tượng gì.", "D. Trở nên khô ráo."], "answer": "A", "explain": "Phân hữu cơ tươi chất đống ẩm ướt sẽ lên men sinh nhiệt, bốc mùi hôi thối, thậm chí tự bốc cháy.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một cửa hàng vật tư nông nghiệp để các bao phân đạm, phân lân, vôi bột chung một góc kho ẩm thấp, bao bì rách. Những nguy cơ nào có thể xảy ra?", "options": ["A. Phân hút ẩm vón cục, giảm chất lượng; vôi phản ứng với đạm amoni gây mất đạm.", "B. Phân sẽ tốt hơn.", "C. Không có nguy cơ gì.", "D. Chỉ tốn diện tích kho."], "answer": "A", "explain": "Kho ẩm làm phân hút ẩm, vón cục; để chung vôi với đạm amoni gây phản ứng mất đạm; bao rách càng tăng hư hỏng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về bảo quản phân bón:", "statements": ["a) Phân bón nên để nơi khô ráo, thoáng mát, trên kệ cao.", "b) Bao phân đã mở dở cần buộc kín miệng bao.", "c) Các loại phân khác nhau nên để riêng và ghi nhãn rõ ràng.", "d) Phân vi sinh có thể phơi nắng thoải mái mà không ảnh hưởng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: tránh hút ẩm. c) Đúng. d) Sai: nắng nóng giết chết vi sinh vật.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về bảo quản phân bón:", "statements": ["a) Kho phân bón ẩm thấp làm phân vón cục, giảm chất lượng.", "b) Để vôi chung với phân đạm amoni không gây hại gì.", "c) Phân vi sinh quá hạn sử dụng có thể mất tác dụng.", "d) Bảo quản đúng cách giúp giữ chất lượng phân bón lâu dài."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: gây phản ứng mất đạm. c) Đúng: VSV chết dần theo thời gian. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 3 yêu cầu khi bảo quản phân bón nói chung.", "answer": "nơi khô ráo thoáng mát, bao bì kín, ghi nhãn rõ ràng", "explain": "Bảo quản phân bón: nơi khô ráo, thoáng mát, trên kệ cao; tránh nắng nóng; bao bì kín; để riêng từng loại, ghi nhãn rõ ràng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao phân vi sinh phải được dùng trong thời hạn sử dụng? (Nêu 1 lí do)", "answer": "vì để lâu vi sinh vật chết dần, phân mất tác dụng", "explain": "Vi s ệc nào vi phạm nguyên tắc bảo quản phân bón?", "options": ["A. Để bao urê dở dang không buộc kín ở nơi ẩm thấp.", "B. Kê bao phân trên kệ cao trong kho khô ráo.", "C. Ghi nhãn rõ ràng từng loại phân.", "D. Để phân vi sinh nơi mát, tránh nắng."], "answer": "A", "explain": "Bao dở không buộc kín ở nơi ẩm làm phân hút ẩm, vón cục, mất chất lượng — vi phạm bảo quản.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ruộng lúa bị vàng lá do thiếu đạm vào giai đoạn làm đòng. Biện pháp xử lí tổng hợp đúng nhất theo bài học là gì?", "options": ["A. Bón thúc phân đạm đúng liều lượng, vùi vào đất hoặc kết hợp tưới nước, tránh bón trước mưa to.", "B. Bón thật nhiều đạm một lần cho nhanh.", "C. Phun phân đạm nồng độ đặc lên lá lúc nắng gắt.", "D. Chờ vụ sau mới bón."], "answer": "A", "explain": "Cần bón thúc đạm (đúng loại, đúng lúc) với liều lượng hợp lí (đúng liều), bón vào đất (đúng cách), tránh mưa to gây rửa trôi.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về các cách bón phân:", "statements": ["a) Bón lót thực hiện trước khi gieo trồng, thường dùng phân hữu cơ và phân lân.", "b) Bón thúc thực hiện trong quá trình cây sinh trưởng, thường dùng đạm và kali.", "c) Bón qua lá là phun dung dịch phân bón lên lá với nồng độ loãng.", "d) Bảo quản phân bón không cần quan tâm đến độ ẩm của kho."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: độ ẩm kho rất quan trọng, phân dễ hút ẩm.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về sử dụng và bảo quản phân bón:", "statements": ["a) Tuân thủ \"4 đúng\" giúp tăng hiệu quả phân bón và bảo vệ môi trường.", "b) Không nên trộn vôi với phân đạm amoni vì gây mất đạm.", "c) Phân vi sinh nên bảo quản nơi mát, tránh nắng và dùng trong hạn sử dụng.", "d) Bón phân càng nhiều, càng thường xuyên thì cây càng tốt, không cần nguyên tắc."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng.
