 [{"type": "mcq", "level": "NB", "q": "Cây chuối, xoài thuộc nhóm nào theo mục đích sử dụng?", "options": ["A. Cây thực phẩm (cây ăn quả)", "B. Cây công nghiệp", "C. Cây thức ăn chăn nuôi", "D. Cây lấy gỗ"], "answer": "A", "explain": "Chuối, xoài cho quả tươi ăn trực tiếp — nhóm cây thực phẩm (cây ăn quả).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Yếu tố khí hậu bao gồm những thành phần nào?", "options": ["A. Nhiệt độ, ánh sáng, lượng mưa, độ ẩm", "B. Đất, nước, phân bón", "C. Giống, kĩ thuật", "D. Sâu, bệnh, cỏ dại"], "answer": "A", "explain": "Khí hậu – thời tiết gồm nhiệt độ, ánh sáng, lượng mưa, độ ẩm, gió... ảnh hưởng trực tiếp sinh trưởng cây.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phân bón cung cấp gì cho cây trồng?", "options": ["A. Chất dinh dưỡng như đạm, lân, kali", "B. Nước tưới", "C. Ánh sáng mặt trời", "D. Không khí"], "answer": "A", "explain": "Phân bón cung cấp các nguyên tố dinh dưỡng (đa lượng: đạm, lân, kali; trung, vi lượng) cho cây sinh trưởng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cùng một giống lúa nhưng ruộng bón phân cân đối cho năng suất cao hơn ruộng không bón phân?", "options": ["A. Vì phân bón cung cấp dinh dưỡng giúp cây sinh trưởng khỏe, đẻ nhánh tốt", "B. Vì phân bón làm thay đổi giống lúa", "C. Vì phân bón thay thế nước tưới", "D. Vì phân bón diệt hết sâu bệnh"], "answer": "A", "explain": "Giống quyết định tiềm năng; phân bón cung cấp dinh dưỡng để cây phát huy tiềm năng đó — thiếu dinh dưỡng cây còi cọc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biện pháp phòng trừ sâu bệnh nào sau đây thân thiện với môi trường nhất?", "options": ["A. Dùng giống chống chịu, bảo vệ thiên địch, vệ sinh đồng ruộng", "B. Phun thuốc hóa học liều cao liên tục", "C. Để mặc sâu bệnh phát triển tự nhiên", "D. Đốt toàn bộ ruộng khi có sâu"], "answer": "A", "explain": "Phòng trừ tổng hợp (giống chống chịu, thiên địch, vệ sinh...) giảm hóa chất, bảo vệ môi trường và an toàn thực phẩm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nông dân dùng kĩ thuật chong đèn cho thanh long ra hoa trái vụ. Đây là tác động của yếu tố nào?", "options": ["A. Con người và kĩ thuật canh tác (điều khiển ánh sáng)", "B. Đất trồng", "C. Phân bón", "D. Sâu bệnh"], "answer": "A", "explain": "Chong đèn bổ sung ánh sáng để kích thích ra hoa trái vụ — con người áp dụng kĩ thuật điều khiển yếu tố ánh sáng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chuối, xoài là cây thực phẩm (cây ăn quả).", "b) Nhiệt độ, ánh sáng, mưa, ẩm độ thuộc yếu tố khí hậu.", "c) Phân bón cung cấp đạm, lân, kali cho cây.", "d) Cây trồng không cần ánh sáng vẫn sinh trưởng tốt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: ánh sáng cần cho quang hợp — thiếu sáng cây còi, vàng lá.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về mối quan hệ các yếu tố:", "statements": ["a) Giống tốt nhưng đất xấu, thiếu nước thì năng suất vẫn thấp.", "b) Kĩ thuật tốt giúp khai thác hiệu quả các yếu tố khác.", "c) Các yếu tố trong trồng trọt tác động qua lại lẫn nhau.", "d) Chỉ cần giống tốt là đủ, các yếu tố khác không quan trọng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: các yếu tố liên quan chặt chẽ. d) Sai: phải phối hợp đồng bộ các yếu tố mới đạt hiệu quả cao.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên ba nhóm cây trồng theo mục đích sử dụng và cho ví dụ mỗi nhóm.", "answer": "Lương thực (lúa), công nghiệp (cà phê), thực phẩm (xoài) — chấp nhận các nhóm và ví dụ đúng", "explain": "Các nhóm: lương thực, thực phẩm (rau, quả), công nghiệp, thức ăn chăn nuôi, dược liệu, cảnh quan.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai biểu hiện của cây bị thiếu nước và hai biểu hiện của cây bị úng nước.", "answer": "Thiếu nước: héo, lá quăn; úng nước: vàng lá, thối rễ (chấp nhận ý tương đương)", "explain": "Thiếu nước cây héo rũ, sinh trưởng chậm; thừa nước gây thiếu ôxi vùng rễ, thối rễ, vàng lá.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Ngô sinh khối trồng để làm thức ăn cho bò thuộc nhóm nào?", "options": ["A. Cây thức ăn chăn nuôi", "B. Cây lương thực", "C. Cây dược liệu", "D. Cây cảnh quan"], "answer": "A", "explain": "Ngô sinh khối (cả cây) ủ làm thức ăn cho trâu bò — nhóm cây thức ăn chăn nuôi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây hồ tiêu (vòng đời nhiều năm) thuộc nhóm nào theo thời gian sinh trưởng?", "options": ["A. Cây dài ngày", "B. Cây ngắn ngày", "C. Cây một vụ", "D. Cây thủy sinh"], "answer": "A", "explain": "Hồ tiêu cho thu hoạch nhiều năm — cây dài ngày.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kĩ thuật canh tác bao gồm những khâu nào?", "options": ["A. Làm đất, gieo trồng, chăm sóc, thu hoạch", "B. Chỉ gieo hạt", "C. Chỉ thu hoạch", "D. Chỉ bón phân"], "answer": "A", "explain": "Kĩ thuật canh tác là toàn bộ quy trình: làm đất, gieo trồng, chăm sóc (tưới, bón, phòng trừ), thu hoạch, bảo quản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cây lúa ưa nóng ẩm nhưng cây chè lại ưa khí hậu mát?", "options": ["A. Vì mỗi loài cây có yêu cầu sinh thái, khí hậu riêng", "B. Vì lúa và chè là một loài", "C. Vì khí hậu không ảnh hưởng đến cây", "D. Vì con người muốn như vậy"], "answer": "A", "explain": "Mỗi cây có ngưỡng nhiệt, ẩm, sáng riêng (yêu cầu sinh thái); chọn cây phải phù hợp khí hậu địa phương.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi bón phân đạm quá liều cho rau, hiện tượng nào có thể xảy ra?", "options": ["A. Rau tốt lốp, dễ đổ ngã, tồn dư nitrat gây mất an toàn", "B. Rau chín nhanh hơn", "C. Rau không cần tưới nước", "D. Rau hết sâu bệnh hoàn toàn"], "answer": "A", "explain": "Thừa đạm làm cây tốt lốp, mềm yếu, dễ đổ, tồn dư nitrat — mất an toàn thực phẩm và ô nhiễm môi trường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vùng đất dốc muốn trồng cây dài ngày chống xói mòn. Lựa chọn nào phù hợp nhất?", "options": ["A. Trồng chè, cây ăn quả theo đường đồng mức, trồng xen cây họ đậu", "B. Trồng lúa nước trên đất dốc", "C. Để đất trống không trồng gì", "D. Trồng cây ngắn ngày cày xới liên tục"], "answer": "A", "explain": "Đất dốc cần cây dài ngày che phủ lâu dài + canh tác theo đường đồng mức + xen họ đậu cải tạo đất, chống xói mòn.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ngô sinh khối làm thức ăn chăn nuôi.", "b) Hồ tiêu là cây dài ngày.", "c) Kĩ thuật canh tác gồm làm đất, gieo trồng, chăm sóc, thu hoạch.", "d) Bón phân càng nhiều thì cây càng tốt, không có tác hại."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: bón quá liều gây ngộ độc cây, ô nhiễm, tồn dư, lãng phí.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về chọn cây phù hợp:", "statements": ["a) Nên chọn cây trồng phù hợp với khí hậu, đất đai địa phương.", "b) Trồng cây ưa nắng ở vùng râm mát quanh năm sẽ kém hiệu quả.", "c) Cây dài ngày thích hợp để phủ xanh, chống xói mòn đất dốc.", "d) Có thể trồng bất kì cây gì ở bất kì đâu mà không cần quan tâm điều kiện tự nhiên."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phải căn cứ điều kiện tự nhiên (đất, nước, khí hậu) khi chọn cây trồng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Phân biệt cây ngắn ngày và cây dài ngày (tiêu chí và ví dụ).", "answer": "Ngắn ngày vòng đời dưới 1 năm (lúa, ngô); dài ngày vòng đời nhiều năm (cà phê, cao su)", "explain": "Tiêu chí là thời gian sinh trưởng: dưới 1 năm là ngắn ngày; nhiều năm là dài ngày.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai tác hại của việc bón phân không đúng cách.", "answer": "Ngộ độc cây, ô nhiễm môi trường (chấp nhận: tồn dư nitrat, lãng phí, đất chai cứng)", "explain": "Bón sai gây cháy rễ, ngộ độc cây; thừa đạm tồn dư nitrat; rửa trôi gây ô nhiễm nguồn nước.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Cà gai leo thuộc nhóm cây trồng nào?", "options": ["A. Cây dược liệu", "B. Cây lương thực", "C. Cây công nghiệp", "D. Cây rau"], "answer": "A", "explain": "Cà gai leo dùng làm thuốc (bổ gan) — cây dược liệu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thừa nước (úng) gây hại gì cho cây trồng?", "options": ["A. Thiếu ôxi vùng rễ, thối rễ, vàng lá", "B. Cây xanh tốt hơn", "C. Cây ra nhiều hoa", "D. Không gây hại gì"], "answer": "A", "explain": "Úng nước làm đất thiếu ôxi, rễ thối, cây vàng lá, chết — cần tiêu nước kịp thời.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Yếu tố nào sau đây thuộc nhóm yếu tố tự nhiên trong trồng trọt?", "options": ["A. Đất, nước, khí hậu", "B. Máy cày", "C. Nhà kho", "D. Xe tải"], "answer": "A", "explain": "Đất, nước, khí hậu là yếu tố tự nhiên; máy móc, nhà kho, xe là cơ sở vật chất do con người tạo ra.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phải phòng trừ sâu bệnh kịp thời, không để lây lan?", "options": ["A. Vì sâu bệnh lây lan nhanh, gây giảm năng suất, thậm chí mất trắng", "B. Vì sâu bệnh làm đẹp ruộng", "C. Vì sâu bệnh giúp cây tốt hơn", "D. Vì không tốn chi phí"], "answer": "A", "explain": "Sâu bệnh phát triển, lây lan nhanh; chậm trễ gây thiệt hại lớn, tốn kém hơn nhiều so với phòng trừ sớm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giống lúa mới chịu phèn, chịu mặn có ý nghĩa gì với đồng bằng sông Cửu Long?", "options": ["A. Giúp mở rộng diện tích, ổn định năng suất trên đất khó canh tác", "B. Làm đất hết phèn hoàn toàn", "C. Không cần bón phân nữa", "D. Thay thế hoàn toàn kĩ thuật canh tác"], "answer": "A", "explain": "Giống chống chịu giúp canh tác được trên đất phèn, mặn — mở rộng diện tích, thích ứng biến đổi khí hậu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ruộng lúa bị vàng lá, sinh trưởng kém dù đủ nước. Nguyên nhân có thể nhất liên quan yếu tố nào?", "options": ["A. Thiếu dinh dưỡng (đất nghèo, bón phân chưa hợp lí) hoặc ngộ độc phèn", "B. Thiếu ánh sáng mặt trời hoàn toàn", "C. Giống lúa quá tốt", "D. Nông dân chăm sóc quá kĩ"], "answer": "A", "explain": "Vàng lá, kém sinh trưởng khi đủ nước thường do thiếu dinh dưỡng (thiếu đạm) hoặc ngộ độc phèn, ngộ độc hữu cơ — liên quan đất và phân bón.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cà gai leo là cây dược liệu.", "b) Úng nước gây thối rễ, vàng lá ở cây trồng.", "c) Đất, nước, khí hậu là yếu tố tự nhiên.", "d) Sâu bệnh hại giúp tăng năng suất cây trồng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: sâu bệnh làm giảm năng suất, chất lượng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về vai trò con người:", "statements": ["a) Con người lựa chọn cây trồng, giống phù hợp điều kiện địa phương.", "b) Con người áp dụng tiến bộ kĩ thuật vào sản xuất.", "c) Trình độ người nông dân ảnh hưởng hiệu quả trồng trọt.", "d) Trong trồng trọt hiện đại, con người không còn vai trò gì."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: con người vẫn là yếu tố quyết định, điều khiển công nghệ.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên hai loại thiên địch có ích trong phòng trừ sâu hại cây trồng.", "answer": "Ong mắt đỏ, nhện (chấp nhận: bọ rùa, kiến vàng, ếch nhái, chim)", "explain": "Ong mắt đỏ kí sinh trứng sâu, nhện, bọ rùa, kiến vàng bắt sâu — là thiên địch cần bảo vệ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai việc làm thể hiện vai trò quyết định của con người trong trồng trọt.", "answer": "Chọn giống tốt; áp dụng kĩ thuật mới (chấp nhận: quy hoạch vùng trồng, đầu tư cơ giới hóa, phòng trừ sâu bệnh...)", "explain": "Con người quyết định qua: chọn cây, giống; áp dụng kĩ thuật; đầu tư; tổ chức sản xuất, tiêu thụ.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Hoa hồng thuộc nhóm cây trồng nào theo mục đích sử dụng?", "options": ["A. Cây cảnh quan (hoa, cây cảnh)", "B. Cây lương thực", "C. Cây công nghiệp", "D. Cây dược liệu"], "answer": "A", "explain": "Hoa hồng trồng làm đẹp, kinh doanh hoa — nhóm hoa, cây cảnh (cảnh quan).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thiếu ánh sáng, cây trồng thường có biểu hiện gì?", "options": ["A. Cây còi cọc, vàng lá, vươn dài yếu ớt", "B. Cây xanh đậm, khỏe mạnh", "C. Cây ra hoa sớm", "D. Cây không thay đổi"], "answer": "A", "explain": "Thiếu sáng quang hợp kém: cây vàng, vươn dài (vống), yếu ớt, dễ đổ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sâu hại gây hại cho cây trồng chủ yếu bằng cách nào?", "options": ["A. Ăn lá, đục thân, chích hút nhựa cây", "B. Tưới nước cho cây", "C. Bón phân cho cây", "D. Làm đất tơi xốp"], "answer": "A", "explain": "Sâu ăn lá (sâu cuốn lá), đục thân (sâu đục thân), chích hút (rầy, rệp) làm cây suy yếu, giảm năng suất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tại sao nói các yếu tố trong trồng trọt tác động qua lại lẫn nhau?", "options": ["A. Vì thay đổi một yếu tố (nước, phân...) sẽ ảnh hưởng đến hiệu quả các yếu tố khác", "B. Vì các yếu tố hoàn toàn độc lập", "C. Vì chỉ có một yếu tố quan trọng", "D. Vì yếu tố không ảnh hưởng nhau"], "answer": "A", "explain": "Ví dụ: thiếu nước thì bón phân cũng kém hiệu quả; đất xấu thì giống tốt cũng khó phát huy — cần phối hợp đồng bộ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để hạn chế sâu bệnh hại mà ít dùng thuốc hóa học, nên làm gì?", "options": ["A. Luân canh, vệ sinh đồng ruộng, dùng giống chống chịu, bảo vệ thiên địch", "B. Trồng độc canh liên tục một loại cây", "C. Bỏ hoang ruộng", "D. Tăng liều thuốc hóa học"], "answer": "A", "explain": "Phòng trừ tổng hợp IPM: luân canh cắt nguồn bệnh, vệ sinh đồng ruộng, giống chống chịu, thiên địch — giảm hóa chất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một hộ trồng rau trong nhà lưới ít bị sâu bệnh hơn trồng ngoài trời. Giải thích nào đúng?", "options": ["A. Nhà lưới ngăn côn trùng, điều khiển được tiểu khí hậu nên hạn chế sâu bệnh", "B. Nhà lưới làm rau không cần nước", "C. Nhà lưới diệt hết vi sinh vật", "D. Nhà lưới thay thế phân bón"], "answer": "A", "explain": "Lưới ngăn bướm, côn trùng đẻ trứng; che mưa giảm bệnh — kĩ thuật nhà lưới hạn chế sâu bệnh, giảm thuốc.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hoa hồng thuộc nhóm hoa, cây cảnh.", "b) Thiếu ánh sáng làm cây còi cọc, vàng lá.", "c) Sâu cuốn lá ăn lá lúa làm giảm quang hợp.", "d) Các yếu tố trong trồng trọt hoàn toàn độc lập với nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: các yếu tố tác động qua lại, cần phối hợp đồng bộ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về phòng trừ tổng hợp (IPM):", "statements": ["a) Ưu tiên biện pháp sinh học, canh tác trước khi dùng thuốc hóa học.", "b) Luân canh giúp cắt đứt nguồn sâu bệnh hại.", "c) Chỉ phun thuốc khi sâu bệnh đến ngưỡng gây hại.", "d) IPM có nghĩa là phun thuốc hóa học càng nhiều càng tốt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: nguyên tắc IPM. d) Sai: IPM hạn chế tối đa thuốc hóa học.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai biện pháp canh tác giúp hạn chế sâu bệnh hại cây trồng.", "answer": "Luân canh; vệ sinh đồng ruộng (chấp nhận: giống chống chịu, bảo vệ thiên địch, bón phân cân đối)", "explain": "Luân canh cắt vòng đời sâu bệnh; vệ sinh đồng ruộng diệt nơi trú ngụ; giống chống chịu; thiên địch.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao bón phân cân đối giúp cây ít bị sâu bệnh hơn?", "answer": "Cây khỏe, sức đề kháng tốt, không tốt lốp thu hút sâu bệnh (chấp nhận ý tương đương)", "explain": "Cây đủ dinh dưỡng cân đối thì khỏe, cứng cây, tăng sức chống chịu; thừa đạm làm cây mềm yếu, dễ nhiễm bệnh.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Cây đậu tương thuộc nhóm nào theo mục đích sử dụng?", "options": ["A. Cây công nghiệp ngắn ngày (cây lấy dầu, đạm)", "B. Cây lương thực chính", "C. Cây ăn quả", "D. Cây dược liệu"], "answer": "A", "explain": "Đậu tương là cây công nghiệp ngắn ngày, cung cấp dầu ăn và đạm thực vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bệnh hại cây trồng do nguyên nhân nào gây ra?", "options": ["A. Vi khuẩn, nấm, vi rút kí sinh gây bệnh", "B. Phân bón", "C. Nước tưới sạch", "D. Ánh sáng mặt trời"], "answer": "A", "explain": "Bệnh hại do nấm, vi khuẩn, vi rút gây ra (đạo ôn, bạc lá, khảm...), khác với sâu hại là côn trùng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Con người tác động đến trồng trọt thông qua hoạt động nào?", "options": ["A. Chọn giống, làm đất, chăm sóc, áp dụng kĩ thuật", "B. Ngồi nhìn cây lớn", "C. Để cây tự sinh tự diệt", "D. Không làm gì cả"], "answer": "A", "explain": "Con người chủ động mọi khâu: chọn cây, giống, làm đất, gieo trồng, chăm sóc, thu hoạch, tiêu thụ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân biệt sâu hại và bệnh hại cây trồng.", "options": ["A. Sâu hại do côn trùng gây ra; bệnh hại do nấm, vi khuẩn, vi rút gây ra", "B. Sâu hại và bệnh hại là một", "C. Bệnh hại do côn trùng gây ra", "D. Sâu hại không gây thiệt hại"], "answer": "A", "explain": "Sâu hại = động vật (côn trùng, nhện...); bệnh hại = vi sinh vật gây bệnh (nấm, khuẩn, vi rút).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cần luân canh cây trồng?", "options": ["A. Cải tạo đất, cắt nguồn sâu bệnh, tăng hiệu quả sử dụng đất", "B. Để đất nghỉ hoàn toàn", "C. Để tăng sâu bệnh", "D. Để giảm năng suất"], "answer": "A", "explain": "Luân canh (đổi cây theo vụ): cây họ đậu cải tạo đất, cắt vòng đời sâu bệnh chuyên tính, tận dụng đất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trên đất bạc màu, nên ưu tiên trồng xen cây nào để cải tạo đất?", "options": ["A. Cây họ đậu (đậu tương, lạc, muồng...) vì có vi khuẩn cố định đạm", "B. Cây cần nhiều dinh dưỡng", "C. Cỏ dại", "D. Không trồng gì"], "answer": "A", "explain": "Cây họ đậu cộng sinh với vi khuẩn nốt sần cố định nitơ khí trời, làm giàu đạm cho đất — biện pháp cải tạo sinh học.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đậu tương là cây công nghiệp ngắn ngày.", "b) Bệnh đạo ôn trên lúa do nấm gây ra.", "c) Luân canh giúp cải tạo đất và hạn chế sâu bệnh.", "d) Cây họ đậu có khả năng cố định đạm khí trời."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng: đạo ôn do nấm Pyricularia. c) Đúng. d) Đúng: nhờ vi khuẩn nốt sần cộng sinh ở rễ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Một xã muốn giảm dùng thuốc trừ sâu. Xét tính đúng, sai của các giải pháp:", "statements": ["a) Áp dụng phòng trừ tổng hợp IPM.", "b) Dùng bẫy đèn, bẫy pheromone bắt côn trùng.", "c) Nhân nuôi và bảo vệ thiên địch.", "d) Phun thuốc hóa học định kì dù không có sâu bệnh."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: biện pháp sinh học, vật lí trong IPM. d) Sai: phun định kì gây lãng phí, kháng thuốc, ô nhiễm.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai loại bệnh hại phổ biến trên cây lúa.", "answer": "Bệnh đạo ôn, bệnh bạc lá (chấp nhận: khô vằn, vàng lùn, lùn xoắn lá)", "explain": "Lúa thường bị đạo ôn (nấm), bạc lá (vi khuẩn), khô vằn, vàng lùn – lùn xoắn lá (vi rút).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích cơ chế cây họ đậu làm giàu đạm cho đất.", "answer": "Vi khuẩn nốt sần ở rễ cố định nitơ khí trời thành đạm cây dùng được (chấp nhận ý tương đương)", "explain": "Rễ cây họ đậu có nốt sần chứa vi khuẩn Rhizobium cố định N2 thành đạm; khi cây tàn, đạm trả lại cho đất.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Cây lạc (đậu phộng) thuộc nhóm nào?", "options": ["A. Cây công nghiệp ngắn ngày", "B. Cây lương thực", "C. Cây ăn quả", "D. Cây dược liệu"], "answer": "A", "explain": "Lạc là cây công nghiệp ngắn ngày lấy dầu, trồng phổ biến ở Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhiệt độ thích hợp cho đa số cây trồng nhiệt đới sinh trưởng là khoảng nào?", "options": ["A. 25–35 độ C", "B. Dưới 0 độ C", "C. Trên 50 độ C", "D. 5–10 độ C"], "answer": "A", "explain": "Cây nhiệt đới (lúa, ngô...) sinh trưởng tốt ở 25–35 độ C; quá lạnh hoặc quá nóng đều ức chế sinh trưởng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thiên địch của sâu hại là gì?", "options": ["A. Sinh vật có ích ăn hoặc kí sinh sâu hại (ong mắt đỏ, nhện, ếch...)", "B. Thuốc trừ sâu", "C. Phân bón", "D. Cỏ dại"], "answer": "A", "explain": "Thiên địch là sinh vật có ích tiêu diệt sâu hại: ong kí sinh, nhện, bọ rùa, ếch, chim...", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không nên trồng độc canh một loại cây trong nhiều năm liên tục?", "options": ["A. Vì đất bạc màu, sâu bệnh chuyên tính tích lũy ngày càng nặng", "B. Vì cây sẽ biến thành cây khác", "C. Vì không tốn công chăm sóc", "D. Vì năng suất luôn tăng"], "answer": "A", "explain": "Độc canh làm đất suy kiệt một loại dinh dưỡng, sâu bệnh chuyên tính tích lũy — năng suất giảm dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bón vôi cho đất chua có tác dụng gì?", "options": ["A. Khử chua, cải tạo đất, cung cấp canxi", "B. Làm đất chua thêm", "C. Diệt hết vi sinh vật", "D. Không có tác dụng"], "answer": "A", "explain": "Vôi (CaCO3, CaO) trung hòa axit, khử chua, khử phèn, cung cấp canxi, cải thiện cấu trúc đất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ruộng lúa trũng thường xuyên ngập úng. Biện pháp kĩ thuật nào cần ưu tiên?", "options": ["A. Làm hệ thống tiêu nước, lên luống cao", "B. Tưới thêm nước", "C. Bón thêm đạm", "D. Phun thuốc trừ sâu"], "answer": "A", "explain": "Úng ngập cần tiêu nước là chính: khơi rãnh, lên luống; tưới thêm hay bón đạm lúc này đều sai.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lạc là cây công nghiệp ngắn ngày lấy dầu.", "b) Cây nhiệt đới sinh trưởng tốt ở 25–35 độ C.", "c) Ong mắt đỏ là thiên địch của nhiều loại sâu hại.", "d) Độc canh liên tục giúp đất ngày càng màu mỡ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: độc canh làm đất bạc màu, sâu bệnh tích lũy.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về cải tạo đất:", "statements": ["a) Bón vôi giúp khử chua cho đất.", "b) Trồng cây họ đậu giúp làm giàu đạm cho đất.", "c) Bón phân hữu cơ giúp đất tơi xốp, giàu mùn.", "d) Đất chua nên bón thêm axit để cân bằng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đất chua cần vôi để khử chua, không bón axit.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai tác hại của độc canh kéo dài một loại cây trồng.", "answer": "Đất bạc màu; sâu bệnh tích lũy nặng (chấp nhận: mất cân bằng dinh dưỡng, năng suất giảm)", "explain": "Độc canh hút cạn một số dinh dưỡng, sâu bệnh chuyên tính tích lũy, đất suy thoái, năng suất giảm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao cần tiêu nước kịp thời khi ruộng bị ngập úng?", "answer": "Tránh thối rễ do thiếu ôxi, cứu cây khỏi chết úng (chấp nhận ý tương đương)", "explain": "Ngập úng làm đất thiếu ôxi, rễ thối, cây vàng héo; tiêu nước kịp thời giúp rễ hô hấp trở lại.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Cây mía thuộc nhóm nào theo mục đích sử dụng và thời gian sinh trưởng?", "options": ["A. Cây công nghiệp ngắn ngày", "B. Cây lương thực dài ngày", "C. Cây ăn quả ngắn ngày", "D. Cây dược liệu dài ngày"], "answer": "A", "explain": "Mía là cây công nghiệp ngắn ngày (8–12 tháng), cung cấp nguyên liệu cho công nghiệp đường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ánh sáng có vai trò gì với cây xanh?", "options": ["A. Cung cấp năng lượng cho quang hợp tạo chất hữu cơ", "B. Làm cây hô hấp", "C. Giúp rễ hút nước", "D. Không có vai trò"], "answer": "A", "explain": "Ánh sáng là nguồn năng lượng cho quang hợp — quá trình tạo chất hữu cơ nuôi cây.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cỏ dại gây hại cho cây trồng vì sao?", "options": ["A. Cạnh tranh nước, dinh dưỡng, ánh sáng và là nơi trú ngụ sâu bệnh", "B. Làm đẹp ruộng", "C. Bón phân cho cây", "D. Tưới nước cho cây"], "answer": "A", "explain": "Cỏ dại tranh nước, phân, sáng với cây trồng, là kí chủ trung gian của sâu bệnh — cần làm cỏ kịp thời.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cây thanh long ở Bình Thuận cho năng suất, chất lượng cao?", "options": ["A. Vì khí hậu nắng nhiều phù hợp, cộng với kĩ thuật chăm sóc tốt của nông dân", "B. Vì thanh long không cần chăm sóc", "C. Vì Bình Thuận có đất phèn", "D. Vì thanh long là cây dại"], "answer": "A", "explain": "Phù hợp sinh thái (nắng) + giống tốt + kĩ thuật (chong đèn, bón phân) = năng suất cao — phối hợp các yếu tố.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi phát hiện sâu bệnh mới chớm, nên xử lí thế nào?", "options": ["A. Xử lí ngay bằng biện pháp phù hợp, tránh để lây lan", "B. Đợi sâu bệnh lan khắp ruộng mới xử lí", "C. Bỏ mặc không quan tâm", "D. Nhổ bỏ toàn bộ ruộng ngay"], "answer": "A", "explain": "Phát hiện sớm, diệt sớm: hiệu quả cao, ít tốn kém, hạn chế lây lan — nguyên tắc phòng hơn chữa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một dự án trồng rau an toàn cần chọn địa điểm. Tiêu chí nào quan trọng nhất?", "options": ["A. Đất, nước tưới sạch, xa nguồn ô nhiễm, giao thông thuận lợi", "B. Giá đất rẻ nhất", "C. Gần khu công nghiệp để tiện", "D. Đất càng chua càng tốt"], "answer": "A", "explain": "Rau an toàn đòi hỏi đất, nước sạch, xa nguồn ô nhiễm (KCN, bãi rác), thuận tiêu thụ — tiêu chí tổng hợp.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mía là cây công nghiệp ngắn ngày.", "b) Ánh sáng cung cấp năng lượng cho quang hợp.", "c) Cỏ dại cạnh tranh dinh dưỡng với cây trồng.", "d) Khi sâu bệnh mới chớm nên xử lí ngay."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng theo kiến thức bài học.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về sản xuất rau an toàn:", "statements": ["a) Nên chọn vùng đất, nước sạch, xa nguồn ô nhiễm.", "b) Tuân thủ thời gian cách ly thuốc trước thu hoạch.", "c) Ghi chép nhật kí sản xuất để truy xuất nguồn gốc.", "d) Có thể dùng nước thải chưa xử lí để tưới rau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: yêu cầu rau an toàn. d) Sai: nước thải gây ô nhiễm, mất an toàn thực phẩm.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai cách phân loại cây trồng đã học và ví dụ mỗi cách.", "answer": "Theo mục đích sử dụng (lúa – lương thực); theo thời gian sinh trưởng (cà phê – dài ngày)", "explain": "Hai cách phổ biến: theo mục đích sử dụng và theo thời gian sinh trưởng (ngắn ngày/dài ngày).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao phải làm cỏ kịp thời cho cây trồng?", "answer": "Cỏ dại cạnh tranh nước, dinh dưỡng, ánh sáng; là nơi trú ngụ sâu bệnh (chấp nhận ý tương đương)", "explain": "Làm cỏ giúp cây trồng không bị tranh chấp nguồn sống, hạn chế sâu bệnh, tăng năng suất.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Cây bông (lấy sợi) thuộc nhóm nào?", "options": ["A. Cây công nghiệp ngắn ngày", "B. Cây lương thực", "C. Cây ăn quả", "D. Cây rau"], "answer": "A", "explain": "Bông là cây công nghiệp ngắn ngày cung cấp sợi cho công nghiệp dệt may.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Độ ẩm không khí quá cao kéo dài dễ gây ra hiện tượng gì?", "options": ["A. Bệnh hại phát triển mạnh (nấm, vi khuẩn)", "B. Cây quang hợp mạnh hơn", "C. Sâu bệnh bị tiêu diệt", "D. Đất khô nhanh"], "answer": "A", "explain": "Ẩm độ cao là điều kiện thuận lợi cho nấm, vi khuẩn gây bệnh phát triển (đạo ôn, sương mai...).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mục đích của việc làm đất trước khi gieo trồng là gì?", "options": ["A. Làm đất tơi xốp, diệt cỏ dại, mầm bệnh, vùi phân bón", "B. Làm đất cứng lại", "C. Diệt hết vi sinh vật có ích", "D. Không có mục đích"], "answer": "A", "explain": "Làm đất (cày, bừa): tơi xốp, thoáng khí, diệt cỏ, mầm bệnh, trộn đều phân bón — tạo điều kiện cây bén rễ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cùng trồng cà chua nhưng trong nhà lưới ít phải phun thuốc hơn ngoài trời?", "options": ["A. Vì nhà lưới ngăn côn trùng gây hại và điều hòa tiểu khí hậu", "B. Vì cà chua trong nhà lưới không cần nước", "C. Vì nhà lưới tự sinh ra thuốc", "D. Vì sâu bệnh sợ nhà lưới"], "answer": "A", "explain": "Lưới chắn bướm, rầy; mái che giảm bệnh do mưa — kĩ thuật canh tác trong nhà lưới giảm áp lực sâu bệnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để cây trồng phát huy tối đa tiềm năng của giống, cần làm gì?", "options": ["A. Phối hợp đồng bộ: đất tốt, đủ nước, bón phân hợp lí, phòng trừ sâu bệnh, kĩ thuật đúng", "B. Chỉ cần giống tốt là đủ", "C. Trồng rồi bỏ mặc", "D. Tưới thật nhiều nước"], "answer": "A", "explain": "Giống chỉ là tiềm năng; phải có đất, nước, phân, phòng trừ, kĩ thuật đồng bộ mới biến tiềm năng thành năng suất thực.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vùng cao nguyên đá Đồng Văn (Hà Giang) khô hạn, đất nghèo. Hướng trồng trọt nào phù hợp?", "options": ["A. Trồng cây chịu hạn (ngô, đậu), làm ruộng bậc thang giữ đất, trồng rừng phủ xanh", "B. Trồng lúa nước đại trà", "C. Bỏ hoang toàn bộ", "D. Trồng cây ưa úng"], "answer": "A", "explain": "Điều kiện khắc nghiệt cần cây chịu hạn + canh tác giữ đất, nước (ruộng bậc thang) + phủ xanh — phù hợp sinh thái địa phương.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bông là cây công nghiệp ngắn ngày lấy sợi.", "b) Ẩm độ cao kéo dài tạo điều kiện cho bệnh hại phát triển.", "c) Làm đất giúp đất tơi xốp, diệt cỏ dại và mầm bệnh.", "d) Giống tốt thì không cần chăm sóc vẫn cho năng suất cao."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: giống tốt cần chăm sóc đồng bộ mới phát huy tiềm năng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về canh tác theo hướng bền vững:", "statements": ["a) Kết hợp trồng trọt với chăn nuôi để tận dụng phân chuồng.", "b) Ưu tiên phân hữu cơ, chế phẩm sinh học.", "c) Áp dụng tưới tiết kiệm để bảo vệ nguồn nước.", "d) Khai thác đất kiệt quệ để tối đa hóa lợi nhuận trước mắt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: hướng bền vững. d) Sai: khai thác kiệt quệ hủy hoại đất, không bền vững.", "points": 1}, {"type": "short", "level": "VDC", "q": "Liệt kê tám yếu tố chính ảnh hưởng đến trồng trọt.", "answer": "Giống, đất, nước, phân bón, khí hậu, sâu bệnh, kĩ thuật, con người", "explain": "Tám yếu tố: giống – đất – nước – phân bón – khí hậu – sâu, bệnh hại – kĩ thuật canh tác – con người.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai lợi ích của nhà lưới trong trồng rau.", "answer": "Ngăn côn trùng gây hại; giảm bệnh do mưa (chấp nhận: điều hòa tiểu khí hậu, giảm thuốc trừ sâu)", "explain": "Nhà lưới chắn sâu, che mưa giảm bệnh, điều hòa nhiệt ẩm — rau an toàn, giảm phun thuốc.", "points": 0.5}]}]}
