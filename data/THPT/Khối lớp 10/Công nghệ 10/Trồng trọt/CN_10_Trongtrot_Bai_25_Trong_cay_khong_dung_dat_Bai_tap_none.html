{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Trồng cây không dùng đất được hiểu là gì?", "answer": "A", "explain": "Trồng cây không dùng đất: rễ không bám đất tự nhiên mà nhận nước, dinh dưỡng qua dung dịch dinh dưỡng hoặc sương mù dinh dưỡng.", "points": 0.25, "options": ["A. Phương thức trồng cây mà rễ không bám vào đất tự nhiên, cây nhận nước và dinh dưỡng qua dung dịch hoặc sương mù dinh dưỡng.", "B. Phương thức trồng cây không cần nước và dinh dưỡng.", "C. Phương thức trồng cây trong không khí mà không cần chăm sóc.", "D. Phương thức chỉ trồng cây cảnh trong chậu."]}, {"type": "mcq", "level": "NB", "q": "Thủy canh là gì?", "answer": "A", "explain": "Thủy canh là trồng cây trong dung dịch dinh dưỡng (nước hòa tan các muối khoáng cần thiết) thay cho đất.", "points": 0.25, "options": ["A. Kĩ thuật trồng cây trong dung dịch dinh dưỡng thay cho đất.", "B. Kĩ thuật trồng cây dưới nước ao hồ tự nhiên.", "C. Kĩ thuật tưới nước cho cây trồng trên đất.", "D. Kĩ thuật trồng cây chịu ngập úng."]}, {"type": "mcq", "level": "TH", "q": "Vì sao thủy canh không hồi lưu có chi phí đầu tư thấp?", "answer": "A", "explain": "Thủy canh tĩnh chỉ cần thùng/khay chứa dung dịch, thay thủ công định kì nên không tốn tiền máy bơm, ống dẫn, thiết bị tự động.", "points": 0.25, "options": ["A. Vì cấu tạo đơn giản (thùng, khay đựng dung dịch), không cần máy bơm, hệ thống ống tuần hoàn.", "B. Vì không cần mua dung dịch dinh dưỡng.", "C. Vì không cần giống cây trồng.", "D. Vì trồng được mọi loại cây gỗ lớn."]}, {"type": "mcq", "level": "TH", "q": "Đặc điểm nào sau đây KHÔNG phải của thủy canh hồi lưu?", "answer": "A", "explain": "Thủy canh hồi lưu dùng máy bơm tuần hoàn dung dịch liên tục, tự động; thay thủ công mỗi ngày là đặc điểm của thủy canh tĩnh.", "points": 0.25, "options": ["A. Dung dịch được thay hoàn toàn bằng thủ công mỗi ngày.", "B. Dung dịch được bơm tuần hoàn liên tục qua rễ cây.", "C. Mức độ tự động hóa cao.", "D. Phù hợp với sản xuất quy mô lớn."]}, {"type": "mcq", "level": "VD", "q": "Một gia đình muốn tự trồng rau sạch trên sân thượng với chi phí thấp, ít phải chăm sóc kĩ thuật phức tạp. Nên chọn mô hình nào?", "answer": "A", "explain": "Thủy canh tĩnh bằng thùng xốp đơn giản, chi phí thấp, phù hợp hộ gia đình tự trồng rau sạch trên sân thượng.", "points": 0.25, "options": ["A. Thủy canh không hồi lưu (thủy canh tĩnh) trong thùng xốp vì đơn giản, rẻ tiền, dễ làm.", "B. Khí canh quy mô công nghiệp.", "C. Trồng lúa nước trên sân thượng.", "D. Không trồng gì vì sân thượng không trồng được rau."]}, {"type": "mcq", "level": "VDC", "q": "So sánh hiệu quả sử dụng nước giữa trồng rau trên đất tưới tràn và thủy canh hồi lưu. Kết luận nào đúng?", "answer": "A", "explain": "Thủy canh hồi lưu tuần hoàn dung dịch khép kín, nước chỉ mất đi do cây hút và bốc hơi ít nên tiết kiệm vượt trội so với tưới tràn.", "points": 0.25, "options": ["A. Thủy canh hồi lưu tiết kiệm nước hơn nhiều vì dung dịch được tuần hoàn, chỉ bổ sung lượng cây đã dùng.", "B. Trồng trên đất tưới tràn tiết kiệm nước hơn.", "C. Hai phương thức tốn nước như nhau.", "D. Thủy canh không cần nước."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về khái niệm:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: vẫn phải cung cấp đầy đủ dinh dưỡng qua dung dịch.", "points": 1, "statements": ["a) Trồng cây không dùng đất là rễ cây không bám vào đất tự nhiên.", "b) Cây nhận nước và dinh dưỡng qua dung dịch dinh dưỡng hoặc sương mù dinh dưỡng.", "c) Thủy canh là trồng cây trong dung dịch dinh dưỡng thay cho đất.", "d) Trồng cây không dùng đất không cần cung cấp dinh dưỡng cho cây."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về thủy canh không hồi lưu:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: thủy canh tĩnh. c) Đúng. d) Sai: máy bơm tuần hoàn là của thủy canh hồi lưu.", "points": 1, "statements": ["a) Dung dịch đựng trong thùng, khay; rễ ngập một phần trong dung dịch.", "b) Không có hệ thống tuần hoàn, thay dung dịch thủ công định kì.", "c) Cấu tạo đơn giản, chi phí thấp, phù hợp hộ gia đình.", "d) Cần máy bơm tuần hoàn liên tục."]}, {"type": "short", "level": "NB", "q": "Thủy canh là kĩ thuật trồng cây trong môi trường nào thay cho đất?", "answer": "dung dịch dinh dưỡng", "explain": "Thủy canh là trồng cây trong dung dịch dinh dưỡng (nước hòa tan các muối khoáng) thay cho đất.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Kể tên một loại giá thể dùng trong trồng cây không dùng đất.", "answer": "xơ dừa", "explain": "Các giá thể phổ biến: xơ dừa, trấu hun, đá perlite, mút xốp (nêu một là được).", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Khí canh khác thủy canh ở điểm nào?", "answer": "A", "explain": "Điểm khác biệt cốt lõi: môi trường quanh rễ — khí canh là không khí + sương mù dinh dưỡng; thủy canh là dung dịch dinh dưỡng.", "points": 0.25, "options": ["A. Khí canh: rễ treo trong không khí, phun sương dinh dưỡng; thủy canh: rễ ngập trong dung dịch dinh dưỡng.", "B. Khí canh trồng trong đất, thủy canh trồng trong nước.", "C. Khí canh không cần dinh dưỡng, thủy canh cần dinh dưỡng.", "D. Hai công nghệ hoàn toàn giống nhau."]}, {"type": "mcq", "level": "NB", "q": "Hệ thống khí canh gồm những bộ phận chính nào?", "answer": "A", "explain": "Khí canh cần: buồng tối chứa rễ treo, giàn đỡ thân cây phía trên, hệ thống béc phun sương + máy bơm hẹn giờ, bồn dung dịch.", "points": 0.25, "options": ["A. Buồng chứa rễ, giàn đỡ cây, hệ thống phun sương, bồn chứa dung dịch dinh dưỡng.", "B. Đất trồng, phân bón, cuốc xẻng.", "C. Ao cá và lồng bè.", "D. Máy cày và máy gặt."]}, {"type": "mcq", "level": "TH", "q": "Vì sao rễ cây trong hệ thống khí canh hô hấp tốt?", "answer": "A", "explain": "Rễ treo trong không khí tiếp xúc trực tiếp với ôxy nên hô hấp mạnh, thúc đẩy sinh trưởng nhanh.", "points": 0.25, "options": ["A. Vì rễ treo lơ lửng trong không khí nên tiếp xúc tối đa với ôxy.", "B. Vì rễ được phun thuốc kích thích.", "C. Vì rễ không cần ôxy.", "D. Vì sương mù tạo ra ôxy."]}, {"type": "mcq", "level": "TH", "q": "Trong các loại cây sau, loại nào phù hợp với công nghệ khí canh?", "answer": "A", "explain": "Khí canh phù hợp cây ngắn ngày, rau ăn lá, dâu tây; khoai tây khí canh cho củ sạch, dễ thu hoạch; cây gỗ lớn không phù hợp.", "points": 0.25, "options": ["A. Dâu tây, rau ăn lá, khoai tây (thu hoạch củ).", "B. Cây cao su.", "C. Cây keo lai lấy gỗ.", "D. Cây mía."]}, {"type": "mcq", "level": "VD", "q": "Một trang trại muốn sản xuất khoai tây giống sạch bệnh. Vì sao nên chọn công nghệ khí canh?", "answer": "A", "explain": "Khoai tây khí canh: củ treo trong buồng tối, sạch, tránh được bệnh từ đất (như mốc sương, tuyến trùng), thuận lợi sản xuất giống sạch bệnh.", "points": 0.25, "options": ["A. Vì củ khoai tây hình thành trong không khí, sạch, không tiếp xúc đất nên ít nhiễm bệnh từ đất, dễ thu hoạch.", "B. Vì khí canh làm củ khoai tây to gấp 10 lần.", "C. Vì khí canh không cần giống khoai tây.", "D. Vì khoai tây chỉ sống được trong không khí."]}, {"type": "mcq", "level": "VDC", "q": "Đánh giá: Một hộ nông dân muốn chuyển toàn bộ 2 ha lúa sang khí canh. Lời khuyên nào đúng?", "answer": "A", "explain": "Khí canh đầu tư cao, chỉ hiệu quả với cây giá trị cao (rau, dâu tây, giống khoai tây); lúa là cây lương thực diện rộng, trồng đất vẫn hiệu quả hơn.", "points": 0.25, "options": ["A. Không nên, vì khí canh vốn đầu tư rất cao, phù hợp rau, cây ngắn ngày giá trị cao chứ không phù hợp cây lương thực diện rộng.", "B. Nên làm ngay vì khí canh trồng được mọi loại cây.", "C. Nên làm vì lúa khí canh cho năng suất gấp 100 lần.", "D. Không nên vì khí canh đã lỗi thời."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về thủy canh hồi lưu:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cần bồn chứa để tuần hoàn dung dịch.", "points": 1, "statements": ["a) Dung dịch được bơm tuần hoàn liên tục qua rễ cây.", "b) Mức độ tự động hóa cao, phù hợp quy mô lớn.", "c) NFT là dạng dung dịch chảy thành màng mỏng qua rễ trên máng nghiêng.", "d) Thủy canh hồi lưu không cần bồn chứa dung dịch."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về khí canh:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: khí canh không dùng đất.", "points": 1, "statements": ["a) Rễ cây treo lơ lửng trong không khí.", "b) Rễ được phun sương mù dinh dưỡng định kì.", "c) Buồng chứa rễ cần tối, ẩm, thoáng khí.", "d) Khí canh là trồng cây trong đất tơi xốp."]}, {"type": "short", "level": "NB", "q": "Khí canh cung cấp dinh dưỡng cho rễ cây bằng cách nào?", "answer": "phun sương mù dinh dưỡng", "explain": "Khí canh: rễ treo trong không khí, được phun sương mù dinh dưỡng định kì.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Nêu điểm khác nhau cơ bản giữa thủy canh và khí canh.", "answer": "thủy canh rễ ngập trong dung dịch, khí canh rễ treo trong không khí", "explain": "Thủy canh: rễ trong dung dịch dinh dưỡng; khí canh: rễ treo trong không khí + phun sương dinh dưỡng.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Giá thể trong trồng cây không dùng đất có vai trò gì?", "answer": "A", "explain": "Giá thể có vai trò cơ học là giữ cây đứng vững, giữ ẩm; dinh dưỡng chủ yếu do dung dịch cung cấp.", "points": 0.25, "options": ["A. Giữ, cố định cây và giữ ẩm cho rễ (xơ dừa, trấu hun, đá perlite, mút xốp...).", "B. Cung cấp toàn bộ dinh dưỡng thay dung dịch.", "C. Diệt sâu bệnh cho cây.", "D. Thay thế ánh sáng mặt trời."]}, {"type": "mcq", "level": "NB", "q": "Dung dịch dinh dưỡng trong thủy canh gồm những gì?", "answer": "A", "explain": "Dung dịch thủy canh phải cung cấp đầy đủ các nguyên tố đa lượng (N, P, K...), trung lượng, vi lượng ở dạng cây hấp thụ được.", "points": 0.25, "options": ["A. Nước hòa tan các muối khoáng cung cấp đầy đủ đa, trung, vi lượng cây cần.", "B. Chỉ gồm nước sạch.", "C. Chỉ gồm đạm urê.", "D. Nước pha thuốc trừ sâu."]}, {"type": "mcq", "level": "TH", "q": "Vì sao phải theo dõi pH và EC của dung dịch thủy canh?", "answer": "A", "explain": "pH sai làm kết tủa dinh dưỡng, rễ không hấp thụ được; EC quá cao gây cháy rễ, quá thấp gây thiếu dinh dưỡng.", "points": 0.25, "options": ["A. Vì pH ảnh hưởng khả năng hấp thụ dinh dưỡng, EC phản ánh nồng độ dinh dưỡng; không phù hợp cây sẽ còi cọc.", "B. Vì pH và EC làm dung dịch có màu đẹp.", "C. Vì pH và EC giúp diệt sâu bệnh.", "D. Không cần theo dõi, cứ pha tùy ý."]}, {"type": "mcq", "level": "TH", "q": "Trong các giá thể sau, giá thể nào thường dùng trong thủy canh?", "answer": "A", "explain": "Giá thể thủy canh phải nhẹ, thoáng khí, giữ ẩm tốt, sạch mầm bệnh: xơ dừa, trấu hun, perlite, mút xốp...", "points": 0.25, "options": ["A. Xơ dừa, trấu hun, đá perlite, mút xốp.", "B. Đất thịt nặng.", "C. Cát biển mặn.", "D. Xi măng."]}, {"type": "mcq", "level": "VD", "q": "Rau xà lách thủy canh của anh Ba bị vàng lá dù dung dịch còn đầy. Nguyên nhân có thể là gì?", "answer": "A", "explain": "Vàng lá khi dung dịch còn đầy thường do pH sai (kết tủa dinh dưỡng) hoặc EC thấp (thiếu dinh dưỡng) — cần đo và điều chỉnh.", "points": 0.25, "options": ["A. pH dung dịch không phù hợp khiến rễ không hấp thụ được dinh dưỡng, hoặc EC quá thấp gây thiếu dinh dưỡng.", "B. Chắc chắn do thiếu ánh sáng duy nhất.", "C. Rau thủy canh nào cũng bị vàng lá, không sao.", "D. Do rau đã già, không cứu được."]}, {"type": "mcq", "level": "VDC", "q": "Một học sinh pha dung dịch thủy canh bằng cách đổ thật nhiều phân đạm vào nước vì nghĩ càng đậm càng tốt. Hậu quả có thể là gì?", "answer": "A", "explain": "Dung dịch quá đặc (EC cao) gây mất nước ở rễ (cháy rễ), cây héo; phải pha đúng nồng độ khuyến cáo.", "points": 0.25, "options": ["A. EC quá cao gây cháy rễ, cây héo, thậm chí chết.", "B. Cây lớn nhanh gấp đôi, không sao.", "C. Dung dịch càng đậm cây càng khỏe.", "D. Phân đạm không ảnh hưởng đến cây."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: quá đậm gây cháy rễ, phải đúng nồng độ.", "points": 1, "statements": ["a) Giá thể (xơ dừa, trấu hun...) có vai trò giữ cây và giữ ẩm cho rễ.", "b) Dung dịch thủy canh cung cấp đầy đủ đa, trung, vi lượng cho cây.", "c) pH không phù hợp khiến rễ khó hấp thụ dinh dưỡng.", "d) Pha dung dịch càng đậm đặc thì cây càng tốt."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về ưu điểm:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: trồng được quanh năm, nhiều vụ.", "points": 1, "statements": ["a) Trồng cây không dùng đất không cần đất canh tác.", "b) Tiết kiệm nước nhờ tuần hoàn khép kín.", "c) Ít sâu bệnh từ đất nên hạn chế thuốc bảo vệ thực vật.", "d) Chỉ trồng được một vụ mỗi năm."]}, {"type": "short", "level": "TH", "q": "Vì sao thủy canh không hồi lưu phù hợp với hộ gia đình?", "answer": "vì cấu tạo đơn giản, chi phí thấp, dễ làm", "explain": "Thủy canh tĩnh chỉ cần thùng/khay chứa dung dịch, thay thủ công, không cần máy bơm nên rẻ, đơn giản, phù hợp gia đình.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nêu một ưu điểm của thủy canh hồi lưu so với thủy canh tĩnh.", "answer": "tự động hóa cao", "explain": "Ưu điểm: tự động hóa cao (bơm tuần hoàn), tiết kiệm dung dịch, phù hợp quy mô lớn (nêu một là được).", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Ưu điểm lớn nhất của trồng cây không dùng đất đối với đô thị là gì?", "answer": "A", "explain": "Đô thị thiếu đất nông nghiệp; thủy canh, khí canh trồng được trên sân thượng, ban công, trong nhà — giải pháp rau sạch đô thị.", "points": 0.25, "options": ["A. Không cần đất canh tác, trồng được trên sân thượng, ban công, trong nhà.", "B. Không cần chăm sóc gì.", "C. Không tốn chi phí gì.", "D. Trồng được cây cổ thụ."]}, {"type": "mcq", "level": "NB", "q": "Vì sao rau thủy canh ít phải dùng thuốc bảo vệ thực vật?", "answer": "A", "explain": "Nhiều bệnh (tuyến trùng, nấm đất...) lây qua đất; thủy canh loại bỏ nguồn bệnh này, kết hợp nhà màng ngăn côn trùng nên ít phải phun thuốc.", "points": 0.25, "options": ["A. Vì không tiếp xúc với đất nên tránh được nhiều sâu bệnh từ đất; trồng trong nhà màng còn ngăn côn trùng.", "B. Vì rau thủy canh có khả năng miễn dịch tuyệt đối.", "C. Vì thuốc không tan trong dung dịch.", "D. Vì sâu bệnh sợ nước."]}, {"type": "mcq", "level": "TH", "q": "Nhược điểm lớn nhất của trồng cây không dùng đất là gì?", "answer": "A", "explain": "Rào cản chính là chi phí hệ thống, thiết bị cao và yêu cầu kĩ thuật (pha dung dịch, theo dõi pH, EC, vận hành hệ thống).", "points": 0.25, "options": ["A. Vốn đầu tư ban đầu cao và đòi hỏi kiến thức, kĩ thuật.", "B. Không trồng được rau ăn lá.", "C. Năng suất luôn thấp hơn trồng đất.", "D. Tốn nhiều đất hơn trồng đất."]}, {"type": "mcq", "level": "TH", "q": "Vì sao hệ thống thủy canh hồi lưu phụ thuộc vào điện năng?", "answer": "A", "explain": "Máy bơm tuần hoàn và sục khí chạy bằng điện; mất điện lâu, rễ thiếu ôxy và dinh dưỡng lưu thông kém khiến cây héo.", "points": 0.25, "options": ["A. Vì cần điện để chạy máy bơm tuần hoàn dung dịch và máy sục khí.", "B. Vì cây cần điện để quang hợp.", "C. Vì dung dịch cần điện để hòa tan.", "D. Vì cảm biến tạo ra điện nuôi cây."]}, {"type": "mcq", "level": "VD", "q": "Một khu chung cư muốn tổ chức trồng rau thủy canh cho cư dân. Mô hình nào phù hợp nhất?", "answer": "A", "explain": "Thủy canh tĩnh thùng xốp hoặc module nhỏ gọn đơn giản, chi phí thấp, phù hợp cư dân chung cư tự trồng rau sạch.", "points": 0.25, "options": ["A. Thủy canh không hồi lưu bằng thùng xốp hoặc hệ thống nhỏ gọn vì đơn giản, rẻ, dễ quản lí.", "B. Khí canh công nghiệp quy mô lớn.", "C. Trồng lúa nước dưới tầng hầm.", "D. Không thể trồng rau ở chung cư."]}, {"type": "mcq", "level": "VDC", "q": "Phân tích rủi ro: Cả hệ thống thủy canh hồi lưu dùng chung một bồn dung dịch, một khay rau bị bệnh thối rễ. Điều gì có thể xảy ra?", "answer": "A", "explain": "Nhược điểm của hồi lưu dùng chung dung dịch là mầm bệnh lan nhanh theo dòng tuần hoàn; cần phát hiện sớm, cách li và khử trùng.", "points": 0.25, "options": ["A. Mầm bệnh có thể lan nhanh sang các khay khác qua dòng dung dịch tuần hoàn chung.", "B. Không sao vì dung dịch diệt được mọi mầm bệnh.", "C. Bệnh chỉ ở một khay, không lan được.", "D. Cây bị bệnh sẽ tự khỏi."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về nhược điểm:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: có các nhược điểm về vốn, kĩ thuật, điện năng.", "points": 1, "statements": ["a) Vốn đầu tư ban đầu cho hệ thống thủy canh, khí canh khá cao.", "b) Người trồng cần kiến thức về pha dung dịch, theo dõi pH, EC.", "c) Hệ thống phụ thuộc vào điện năng (máy bơm, sục khí).", "d) Trồng cây không dùng đất không có nhược điểm nào."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: nhược điểm của dùng chung dung dịch. b) Đúng. c) Sai: mầm bệnh lan theo dòng tuần hoàn. d) Đúng.", "points": 1, "statements": ["a) Bệnh thối rễ có thể lan nhanh qua dung dịch dùng chung trong hệ thống hồi lưu.", "b) Cần phát hiện sớm, cách li khay bệnh và khử trùng hệ thống.", "c) Dung dịch dùng chung có khả năng tự diệt mọi mầm bệnh.", "d) Quan sát rễ thường xuyên giúp phát hiện sớm dấu hiệu bệnh."]}, {"type": "short", "level": "TH", "q": "EC trong thủy canh dùng để theo dõi yếu tố nào?", "answer": "nồng độ dinh dưỡng trong dung dịch", "explain": "EC (độ dẫn điện) tỉ lệ với nồng độ muối dinh dưỡng hòa tan; theo dõi EC giúp pha đúng liều cây cần.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Vì sao rau thủy canh ít phải dùng thuốc bảo vệ thực vật?", "answer": "vì không tiếp xúc đất nên tránh được sâu bệnh từ đất", "explain": "Nhiều bệnh lây qua đất; thủy canh loại bỏ nguồn bệnh này, kết hợp nhà màng ngăn côn trùng nên ít phải phun thuốc.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Hệ thống thủy canh hồi lưu dạng NFT hoạt động như thế nào?", "answer": "A", "explain": "NFT (Nutrient Film Technique): màng dung dịch mỏng chảy liên tục qua rễ trên máng nghiêng, vừa cung cấp dinh dưỡng vừa thoáng khí cho rễ.", "points": 0.25, "options": ["A. Dung dịch chảy thành màng mỏng liên tục qua rễ cây đặt trên máng nghiêng rồi tuần hoàn về bồn chứa.", "B. Rễ cây ngập hoàn toàn trong bồn nước tĩnh.", "C. Phun sương mù vào rễ treo trong không khí.", "D. Nhỏ từng giọt nước vào đất."]}, {"type": "mcq", "level": "NB", "q": "Hệ thống DWC trong thủy canh có đặc điểm gì?", "answer": "A", "explain": "DWC (Deep Water Culture): rễ ngập sâu trong dung dịch, máy sục khí cung cấp ôxy liên tục để rễ hô hấp.", "points": 0.25, "options": ["A. Rễ cây ngập trong dung dịch có sục khí ôxy liên tục.", "B. Rễ cây treo trong không khí.", "C. Không dùng dung dịch dinh dưỡng.", "D. Cây trồng trong đất có sục khí."]}, {"type": "mcq", "level": "TH", "q": "Vì sao hệ thống DWC cần sục khí liên tục?", "answer": "A", "explain": "Rễ hô hấp cần ôxy; ngập lâu trong nước tĩnh thiếu ôxy gây thối rễ nên phải sục khí liên tục.", "points": 0.25, "options": ["A. Vì rễ ngập trong dung dịch cần ôxy để hô hấp; thiếu ôxy rễ sẽ thối.", "B. Vì sục khí làm dung dịch có màu đẹp.", "C. Vì sục khí giúp diệt hết vi khuẩn.", "D. Vì cây cần bọt khí để quang hợp."]}, {"type": "mcq", "level": "TH", "q": "Trong các hệ thống sau, hệ thống nào có mức độ tự động hóa cao nhất?", "answer": "A", "explain": "Thủy canh hồi lưu dùng máy bơm, hẹn giờ, cảm biến tự động điều chỉnh — tự động hóa cao nhất trong các phương án.", "points": 0.25, "options": ["A. Thủy canh hồi lưu có máy bơm hẹn giờ và cảm biến.", "B. Thủy canh tĩnh thay dung dịch bằng tay.", "C. Trồng rau trên đất tưới bằng gáo.", "D. Trồng rau nhờ nước mưa tự nhiên."]}, {"type": "mcq", "level": "VD", "q": "Anh Minh lắp hệ thống NFT trồng xà lách nhưng để máng nằm ngang hoàn toàn (không nghiêng). Vấn đề có thể gặp là gì?", "answer": "A", "explain": "NFT cần máng nghiêng nhẹ để dung dịch chảy thành màng mỏng tuần hoàn về bồn; máng ngang gây ứ đọng, thiếu ôxy, thối rễ.", "points": 0.25, "options": ["A. Dung dịch không chảy tuần hoàn được, ứ đọng gây thiếu ôxy ở rễ.", "B. Không vấn đề gì, máng ngang tốt hơn.", "C. Rau sẽ lớn nhanh gấp đôi.", "D. Dung dịch tự bay hơi hết."]}, {"type": "mcq", "level": "VDC", "q": "So sánh NFT và DWC: trường hợp mất điện đột ngột, hệ thống nào nguy hiểm cho cây hơn?", "answer": "A", "explain": "DWC phụ thuộc hoàn toàn vào sục khí; mất điện, ôxy trong dung dịch cạn nhanh gây thối rễ. NFT rễ tiếp xúc không khí nhiều hơn nên chịu đựng tốt hơn.", "points": 0.25, "options": ["A. DWC nguy hiểm hơn vì rễ ngập sâu, ngừng sục khí là thiếu ôxy nhanh; NFT máng còn màng ẩm và rễ thoáng khí hơn.", "B. NFT nguy hiểm hơn.", "C. Hai hệ thống như nhau.", "D. Mất điện không ảnh hưởng hệ thống nào."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về DWC:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: vẫn cần dung dịch dinh dưỡng.", "points": 1, "statements": ["a) DWC là rễ ngập trong dung dịch có sục khí ôxy liên tục.", "b) Sục khí giúp rễ hô hấp, tránh thối rễ.", "c) Mất điện lâu khiến DWC nguy hiểm hơn NFT vì rễ ngập sâu thiếu ôxy nhanh.", "d) DWC không cần dung dịch dinh dưỡng."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: dinh dưỡng tối ưu. c) Sai: không kinh tế với cây gỗ lớn. d) Đúng.", "points": 1, "statements": ["a) Rau thủy canh thường đồng đều vì điều kiện dinh dưỡng, ánh sáng như nhau.", "b) Thời gian sinh trưởng thủy canh thường ngắn hơn trồng đất.", "c) Thủy canh phù hợp với cây ăn quả lâu năm như xoài, nhãn quy mô lớn.", "d) Trồng cây không dùng đất là giải pháp cho đô thị thiếu đất."]}, {"type": "short", "level": "VD", "q": "Giải thích vì sao máng trong hệ thống NFT phải đặt nghiêng.", "answer": "để dung dịch chảy thành màng mỏng tuần hoàn về bồn chứa", "explain": "NFT cần máng nghiêng nhẹ để dung dịch chảy liên tục qua rễ rồi về bồn; máng ngang gây ứ đọng, thiếu ôxy, thối rễ.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Vì sao hệ thống DWC phải sục khí liên tục?", "answer": "vì rễ ngập trong dung dịch cần ôxy để hô hấp", "explain": "Rễ hô hấp cần ôxy; ngập lâu trong nước tĩnh thiếu ôxy gây thối rễ nên phải sục khí liên tục.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trồng cây không dùng đất giúp tiết kiệm nước nhờ đâu?", "answer": "A", "explain": "Hệ thống khép kín tuần hoàn, nước chỉ mất qua hút của cây và bốc hơi ít nên tiết kiệm vượt trội so với tưới trên đất.", "points": 0.25, "options": ["A. Nhờ tuần hoàn dung dịch khép kín và chỉ cung cấp đúng lượng cây cần, hạn chế bốc hơi, thấm sâu.", "B. Nhờ cây không cần nước.", "C. Nhờ nước tự sinh ra trong hệ thống.", "D. Nhờ không tưới bao giờ."]}, {"type": "mcq", "level": "NB", "q": "Vì sao rau thủy canh thường có chất lượng đồng đều?", "answer": "A", "explain": "Điều kiện đồng nhất (cùng dung dịch, cùng ánh sáng, nhiệt độ) giúp cây sinh trưởng đều, chất lượng đồng đều.", "points": 0.25, "options": ["A. Vì mọi cây đều nhận được dinh dưỡng, nước, ánh sáng như nhau trong điều kiện được kiểm soát.", "B. Vì rau thủy canh được nhuộm màu.", "C. Vì chỉ trồng một cây duy nhất.", "D. Vì rau thủy canh không lớn."]}, {"type": "mcq", "level": "TH", "q": "Trồng cây không dùng đất có thể trồng quanh năm nhờ đâu?", "answer": "A", "explain": "Chủ động hoàn toàn về dinh dưỡng, nước + nhà màng che chắn thời tiết nên có thể sản xuất liên tục nhiều vụ trong năm.", "points": 0.25, "options": ["A. Nhờ chủ động điều khiển dinh dưỡng, nước và thường kết hợp nhà màng nên ít phụ thuộc mùa vụ, thời tiết.", "B. Nhờ cây không cần ánh sáng.", "C. Nhờ mùa nào cây cũng tự ra hoa.", "D. Nhờ không cần thu hoạch."]}, {"type": "mcq", "level": "TH", "q": "Trong các đối tượng sau, đối tượng nào hưởng lợi nhiều nhất từ trồng cây không dùng đất?", "answer": "A", "explain": "Ưu thế không cần đất phù hợp nhất với đô thị thiếu đất; trồng lúa diện rộng, cây lấy gỗ vẫn hiệu quả hơn trên đất.", "points": 0.25, "options": ["A. Người dân đô thị thiếu đất canh tác muốn tự trồng rau sạch.", "B. Chủ rừng trồng cây lấy gỗ.", "C. Ngư dân đánh bắt hải sản.", "D. Người trồng lúa nước diện rộng."]}, {"type": "mcq", "level": "VD", "q": "Siêu thị cần nguồn rau an toàn, chất lượng ổn định quanh năm. Vì sao nên hợp tác với trang trại thủy canh?", "answer": "A", "explain": "Thủy canh đáp ứng đúng yêu cầu của siêu thị: nguồn cung ổn định quanh năm, chất lượng đồng đều, an toàn, truy xuất được.", "points": 0.25, "options": ["A. Vì thủy canh cho năng suất ổn định, chất lượng đồng đều, ít thuốc bảo vệ thực vật, trồng được quanh năm.", "B. Vì rau thủy canh rẻ hơn rau chợ.", "C. Vì trang trại thủy canh không cần chứng nhận gì.", "D. Vì siêu thị thích rau đắt tiền."]}, {"type": "mcq", "level": "VDC", "q": "Tổng hợp: Để bắt đầu trồng rau thủy canh tại nhà, cần chuẩn bị những gì?", "answer": "A", "explain": "Mô hình đơn giản tại nhà cần: thùng chứa, dung dịch dinh dưỡng đúng loại, giá thể giữ cây, giống, nơi đủ sáng và hiểu biết cơ bản về pha dung dịch, theo dõi cây.", "points": 0.25, "options": ["A. Thùng/khay chứa, dung dịch dinh dưỡng, giá thể, cây giống, vị trí có ánh sáng và kiến thức pha dung dịch cơ bản.", "B. Chỉ cần hạt giống là đủ.", "C. Chỉ cần đất và phân chuồng.", "D. Chỉ cần mua hệ thống đắt tiền nhất."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về khí canh:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: cần vệ sinh béc thường xuyên. c) Sai: khí canh phức tạp nhất, đòi hỏi kĩ thuật cao. d) Đúng.", "points": 1, "statements": ["a) Sương mù bám trực tiếp lên rễ giúp cây hấp thụ hiệu quả, tiết kiệm dinh dưỡng.", "b) Béc phun tắc khiến rễ khô héo nhanh vì hoàn toàn phụ thuộc vào sương phun.", "c) Khí canh là công nghệ đơn giản nhất, ai cũng làm được ngay.", "d) Khoai tây khí canh cho củ sạch, ít bệnh từ đất, thuận lợi sản xuất giống."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: hồi lưu phức tạp hơn (bơm, ống, cảm biến).", "points": 1, "statements": ["a) Dâu tây khí canh cho quả sạch vì không tiếp xúc đất.", "b) Khí canh phù hợp sản xuất giống cây sạch bệnh.", "c) Thủy canh tĩnh đơn giản hơn thủy canh hồi lưu.", "d) Thủy canh hồi lưu đơn giản hơn thủy canh tĩnh."]}, {"type": "short", "level": "VD", "q": "Một bồn thủy canh xuất hiện rêu xanh. Nêu nguyên nhân và cách khắc phục.", "answer": "do ánh sáng lọt vào bồn; che tối bồn chứa", "explain": "Ánh sáng + dinh dưỡng khiến tảo rêu phát triển; che tối bồn chứa dung dịch để ngăn ngừa.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu một rủi ro của hệ thống thủy canh hồi lưu dùng chung bồn dung dịch.", "answer": "mầm bệnh lan nhanh sang các khay khác qua dòng tuần hoàn", "explain": "Nhược điểm: bệnh (như thối rễ) lan nhanh theo dòng dung dịch chung; cần phát hiện sớm, cách li, khử trùng.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Buồng chứa rễ trong hệ thống khí canh cần đảm bảo điều kiện gì?", "answer": "A", "explain": "Rễ cần tối (tránh rêu tảo, phân hủy dinh dưỡng), ẩm (sương mù), thoáng khí để hô hấp tốt.", "points": 0.25, "options": ["A. Tối, ẩm, thoáng khí để rễ phát triển tốt và sương dinh dưỡng không bị phân hủy bởi ánh sáng.", "B. Sáng rực để rễ quang hợp.", "C. Khô hoàn toàn để tránh úng.", "D. Ngập nước liên tục."]}, {"type": "mcq", "level": "NB", "q": "Tần suất phun sương trong khí canh phụ thuộc vào yếu tố nào?", "answer": "A", "explain": "Phun sương phải đúng chu kì: quá ít cây thiếu dinh dưỡng, quá nhiều gây úng; cài đặt theo nhu cầu cây và điều kiện môi trường.", "points": 0.25, "options": ["A. Loại cây, giai đoạn sinh trưởng, nhiệt độ, độ ẩm không khí — cài đặt hẹn giờ phù hợp.", "B. Phun càng nhiều càng tốt, không cần quy luật.", "C. Chỉ phun một lần duy nhất khi trồng.", "D. Phun theo cảm hứng của người trồng."]}, {"type": "mcq", "level": "TH", "q": "Vì sao khí canh tiết kiệm dinh dưỡng tối đa?", "answer": "A", "explain": "Sương mù mịn bám đều lên toàn bộ rễ, cây hấp thụ hiệu quả, lượng dư chảy về rất ít nên tiết kiệm tối đa.", "points": 0.25, "options": ["A. Vì sương mù bám trực tiếp lên rễ, cây hấp thụ gần như hoàn toàn, ít thất thoát.", "B. Vì khí canh không dùng dinh dưỡng.", "C. Vì sương mù tự tạo ra dinh dưỡng.", "D. Vì rễ không cần dinh dưỡng."]}, {"type": "mcq", "level": "TH", "q": "Khó khăn lớn nhất khi vận hành hệ thống khí canh là gì?", "answer": "A", "explain": "Khí canh là công nghệ cao nhất trong nhóm: béc phun tắc, mất điện, hẹn giờ sai đều khiến rễ khô nhanh và cây chết.", "points": 0.25, "options": ["A. Yêu cầu kĩ thuật cao, vốn đầu tư lớn và hệ thống phun sương phải hoạt động ổn định tuyệt đối.", "B. Không có khó khăn gì.", "C. Cây trồng quá dễ nên nhàm chán.", "D. Không tốn điện nước gì."]}, {"type": "mcq", "level": "VD", "q": "Béc phun sương của hệ thống khí canh bị tắc. Hậu quả trực tiếp là gì?", "answer": "A", "explain": "Rễ treo trong không khí hoàn toàn phụ thuộc vào sương phun; tắc béc là rễ khô, cây héo rất nhanh — cần kiểm tra, vệ sinh béc thường xuyên.", "points": 0.25, "options": ["A. Rễ không nhận được dinh dưỡng và nước, khô héo nhanh chóng.", "B. Cây vẫn bình thường vì rễ tự hút ẩm không khí.", "C. Hệ thống tự sửa được.", "D. Cây chuyển sang sống bằng đất."]}, {"type": "mcq", "level": "VDC", "q": "So sánh độ phức tạp kĩ thuật: xếp theo thứ tự từ đơn giản đến phức tạp.", "answer": "A", "explain": "Thủy canh tĩnh đơn giản nhất (thùng + dung dịch); hồi lưu phức tạp hơn (bơm, ống, cảm biến); khí canh phức tạp nhất (phun sương chính xác, kiểm soát tuyệt đối).", "points": 0.25, "options": ["A. Thủy canh tĩnh ít phức tạp hơn thủy canh hồi lưu, và khí canh phức tạp nhất.", "B. Khí canh đơn giản nhất.", "C. Cả ba phức tạp như nhau.", "D. Thủy canh hồi lưu đơn giản nhất."]}, {"type": "truefalse", "level": "VD", "q": "Tình huống: Rau thủy canh bị vàng lá dù dung dịch còn đầy. Xét tính đúng, sai của các chẩn đoán:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: đo kiểm tra là bước đầu. d) Sai: chưa thể kết luận khi chưa kiểm tra dung dịch.", "points": 1, "statements": ["a) Có thể do pH không phù hợp khiến rễ không hấp thụ được dinh dưỡng.", "b) Có thể do EC quá thấp gây thiếu dinh dưỡng.", "c) Cần đo pH, EC để kiểm tra trước khi xử lí.", "d) Chắc chắn do thiếu ánh sáng nên chỉ cần tăng đèn."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về xử lí sự cố:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ứ đọng gây thiếu ôxy, thối rễ.", "points": 1, "statements": ["a) Rêu xanh trong bồn do ánh sáng lọt vào; cần che tối bồn chứa.", "b) Nước máy có clo nên để bay hơi trước khi pha dung dịch.", "c) Máng NFT phải nghiêng nhẹ để dung dịch chảy tuần hoàn.", "d) Dung dịch ứ đọng trong máng ngang không gây hại gì cho rễ."]}, {"type": "short", "level": "VD", "q": "Vì sao khoai tây giống nên sản xuất bằng khí canh?", "answer": "vì củ hình thành trong không khí, sạch, ít bệnh từ đất", "explain": "Củ treo trong buồng tối, không tiếp xúc đất nên tránh bệnh từ đất, sạch, dễ thu hoạch — thuận lợi sản xuất giống.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu một nhược điểm của khí canh so với thủy canh.", "answer": "đòi hỏi kĩ thuật cao hơn và vốn đầu tư lớn hơn", "explain": "Khí canh phức tạp nhất: hệ thống phun sương phải tuyệt đối ổn định, kĩ thuật cao, vốn lớn (nêu một là được).", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Vì sao trồng dâu tây bằng khí canh cho quả sạch?", "answer": "A", "explain": "Quả treo trên giàn, không chạm đất nên sạch, ít nhiễm bệnh từ đất, thu hoạch dễ dàng, mẫu mã đẹp.", "points": 0.25, "options": ["A. Vì quả không tiếp xúc với đất nên tránh được đất bẩn, mầm bệnh từ đất và dễ thu hoạch.", "B. Vì dâu tây khí canh không cần rửa.", "C. Vì khí canh diệt được mọi vi khuẩn.", "D. Vì quả tự chín không cần chăm sóc."]}, {"type": "mcq", "level": "NB", "q": "Ứng dụng nào sau đây của khí canh mang lại giá trị kinh tế cao?", "answer": "A", "explain": "Khí canh đầu tư cao nên tập trung vào sản phẩm giá trị cao: giống khoai tây sạch bệnh, dâu tây trái vụ.", "points": 0.25, "options": ["A. Sản xuất khoai tây giống sạch bệnh và dâu tây trái vụ chất lượng cao.", "B. Trồng lúa lấy gạo.", "C. Trồng sắn lấy củ.", "D. Trồng keo lấy gỗ."]}, {"type": "mcq", "level": "TH", "q": "Nhân giống cây bằng khí canh có ưu điểm gì?", "answer": "A", "explain": "Môi trường sạch, dinh dưỡng tối ưu giúp cây giống khỏe, rễ phát triển, sạch bệnh, tỉ lệ sống cao.", "points": 0.25, "options": ["A. Cây giống sạch bệnh, rễ phát triển mạnh, tỉ lệ sống cao khi đem trồng.", "B. Không cần cây mẹ.", "C. Cây giống tự nhân đôi.", "D. Không cần chăm sóc cây mẹ."]}, {"type": "mcq", "level": "TH", "q": "Trong các chi phí sau, chi phí nào là chi phí vận hành thường xuyên của hệ thống thủy canh hồi lưu?", "answer": "A", "explain": "Chi phí thường xuyên: điện cho bơm/sục khí, dung dịch bổ sung, thay thế vật tư — cao hơn trồng đất truyền thống.", "points": 0.25, "options": ["A. Tiền điện chạy máy bơm, sục khí và tiền dung dịch dinh dưỡng bổ sung.", "B. Tiền mua đất.", "C. Tiền thuê trâu cày.", "D. Tiền mua thuốc trừ cỏ dại trên đất."]}, {"type": "mcq", "level": "VD", "q": "Một trường học muốn làm mô hình khí canh để học sinh quan sát rễ cây. Điều cần lưu ý nhất là gì?", "answer": "A", "explain": "Mô hình giáo dục cần vừa quan sát được rễ, vừa vận hành ổn định; khí canh đòi hỏi kĩ thuật nên cần giáo viên hướng dẫn.", "points": 0.25, "options": ["A. Thiết kế buồng rễ có cửa quan sát và đảm bảo hệ thống phun sương hoạt động ổn định, có giáo viên hướng dẫn kĩ thuật.", "B. Chỉ cần treo cây lên là được.", "C. Không cần hệ thống phun sương.", "D. Để học sinh tự vận hành không cần hướng dẫn."]}, {"type": "mcq", "level": "VDC", "q": "Đánh giá tính bền vững: Trồng rau thủy canh trong nhà màng ở thành phố có phải là hướng bền vững?", "answer": "A", "explain": "Mô hình này tiết kiệm tài nguyên, giảm khí thải vận chuyển, rau an toàn — phù hợp phát triển bền vững đô thị dù cần quản lí tốt năng lượng.", "points": 0.25, "options": ["A. Có, vì tiết kiệm đất, nước, giảm vận chuyển, cung cấp rau sạch tại chỗ, ít thuốc bảo vệ thực vật.", "B. Không, vì tốn điện nên không bền vững.", "C. Không, vì rau thủy canh không ăn được.", "D. Có, vì không tốn chi phí gì."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về lựa chọn mô hình:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: lúa diện rộng trồng đất hiệu quả hơn.", "points": 1, "statements": ["a) Hộ gia đình sân thượng nên chọn thủy canh tĩnh thùng xốp vì đơn giản, rẻ.", "b) Trang trại quy mô lớn nên chọn thủy canh hồi lưu tự động.", "c) Sản xuất giống khoai tây sạch bệnh nên chọn khí canh.", "d) Trồng lúa nước diện rộng nên chuyển sang khí canh."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: sản xuất tại chỗ. c) Đúng. d) Sai: Singapore, Israel phát triển mạnh thủy canh vì thiếu đất, nước.", "points": 1, "statements": ["a) Siêu thị ưa chuộng rau thủy canh vì nguồn cung ổn định, chất lượng đồng đều, an toàn.", "b) Trồng rau thủy canh trong đô thị giúp giảm chi phí vận chuyển.", "c) Trang trại thẳng đứng (vertical farming) là xu hướng tương lai của thủy canh đô thị.", "d) Các nước thiếu đất như Singapore không thể phát triển thủy canh."]}, {"type": "short", "level": "VDC", "q": "Phân tích: Vì sao không nên chuyển 2 ha lúa sang khí canh?", "answer": "vì vốn đầu tư rất cao mà lúa là cây lương thực diện rộng, trồng đất hiệu quả hơn", "explain": "Khí canh chỉ hiệu quả với cây giá trị cao (rau, dâu tây, giống); lúa diện rộng trồng đất vẫn kinh tế hơn nhiều.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một startup có 500 triệu đồng. Nêu hai việc cần làm trước khi mở rộng quy mô trồng rau thủy canh.", "answer": "tính toán chi phí và đảm bảo đầu ra", "explain": "Cần: tính toán chi phí (điện, dung dịch, đầu tư) và đảm bảo đầu ra (hợp đồng bao tiêu); bắt đầu quy mô vừa phải rồi mở rộng.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Vì sao không nên trồng cây ăn quả lâu năm (xoài, nhãn) bằng thủy canh quy mô lớn?", "answer": "A", "explain": "Thủy canh phù hợp cây ngắn ngày, rau ăn lá; cây gỗ lớn cần đất để bám rễ vững, chi phí hệ thống cho cây lớn là không kinh tế.", "points": 0.25, "options": ["A. Vì cây lớn cần giá đỡ vững chắc, nhu cầu dinh dưỡng lớn, chi phí cao mà hiệu quả không bằng trồng đất.", "B. Vì cây ăn quả không hút được dinh dưỡng từ dung dịch.", "C. Vì thủy canh làm quả có vị đắng.", "D. Vì pháp luật cấm."]}, {"type": "mcq", "level": "NB", "q": "Cây trồng thủy canh có thời gian sinh trưởng như thế nào so với trồng đất?", "answer": "A", "explain": "Dinh dưỡng đầy đủ, cân đối + điều kiện ổn định giúp cây sinh trưởng nhanh, rút ngắn thời gian thu hoạch (ví dụ xà lách 30–35 ngày).", "points": 0.25, "options": ["A. Thường ngắn hơn vì được cung cấp dinh dưỡng tối ưu, điều kiện ổn định.", "B. Luôn dài hơn gấp đôi.", "C. Không bao giờ thu hoạch được.", "D. Như nhau tuyệt đối."]}, {"type": "mcq", "level": "TH", "q": "Yếu tố nào quyết định thành công khi pha dung dịch thủy canh tại nhà?", "answer": "A", "explain": "Mỗi loại cây cần công thức và nồng độ khác nhau; pha sai gây thiếu dinh dưỡng hoặc cháy rễ.", "points": 0.25, "options": ["A. Pha đúng loại, đúng nồng độ theo hướng dẫn cho từng loại cây.", "B. Pha càng đậm càng tốt.", "C. Dùng nước ao tù đọng.", "D. Pha theo cảm tính."]}, {"type": "mcq", "level": "TH", "q": "Nước máy có chứa clo dùng pha dung dịch thủy canh cần xử lí như thế nào?", "answer": "A", "explain": "Clo trong nước máy có thể hại rễ non; nên để bay hơi tự nhiên (phơi, sục khí) trước khi pha dung dịch.", "points": 0.25, "options": ["A. Để nước bay hơi clo (phơi nắng, sục khí) trước khi pha để tránh hại rễ và vi sinh vật có lợi.", "B. Dùng trực tiếp, clo tốt cho cây.", "C. Đun sôi rồi pha ngay khi còn nóng.", "D. Pha thêm thật nhiều clo."]}, {"type": "mcq", "level": "VD", "q": "Một người mới trồng thủy canh thấy rêu xanh mọc trong bồn dung dịch. Nguyên nhân và cách khắc phục là gì?", "answer": "A", "explain": "Ánh sáng + dinh dưỡng khiến tảo, rêu phát triển, cạnh tranh dinh dưỡng và gây tắc ống; che tối bồn chứa để ngăn ngừa.", "points": 0.25, "options": ["A. Do ánh sáng lọt vào bồn; khắc phục bằng cách che tối bồn chứa dung dịch.", "B. Do dung dịch quá tốt nên mọc rêu, không sao.", "C. Do thiếu phân bón.", "D. Không thể khắc phục."]}, {"type": "mcq", "level": "VDC", "q": "Tổng hợp kiến thức: Một bài thuyết trình về trồng cây không dùng đất cần có những nội dung nào?", "answer": "A", "explain": "Bài thuyết trình đầy đủ: khái niệm → thủy canh (2 dạng) → khí canh → so sánh ưu nhược điểm → ứng dụng thực tế.", "points": 0.25, "options": ["A. Khái niệm, công nghệ thủy canh (không hồi lưu, hồi lưu), công nghệ khí canh, ưu nhược điểm và ứng dụng.", "B. Chỉ cần kể tên các loại rau.", "C. Chỉ cần nêu giá dung dịch.", "D. Chỉ cần chụp ảnh hệ thống."]}, {"type": "truefalse", "level": "VDC", "q": "Phân tích đầu tư: Một startup có 500 triệu đồng muốn kinh doanh rau thủy canh. Xét tính đúng, sai:", "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: lộ trình thận trọng. b) Sai: rủi ro cao. c) Đúng. d) Sai: thị trường, chi phí quyết định thành công kinh doanh.", "points": 1, "statements": ["a) Nên bắt đầu từ quy mô vừa phải, tính toán chi phí điện, dung dịch và đầu ra trước khi mở rộng.", "b) Nên dồn hết vốn làm khí canh quy mô lớn ngay từ đầu.", "c) Cần hợp đồng bao tiêu với siêu thị, cửa hàng để đảm bảo đầu ra.", "d) Chỉ cần kĩ thuật tốt là chắc chắn thành công, không cần quan tâm thị trường."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các nhận định tổng hợp:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: phù hợp mới hiệu quả. d) Đúng.", "points": 1, "statements": ["a) Thủy canh và khí canh đều không dùng đất nhưng khác nhau ở môi trường quanh rễ.", "b) Lựa chọn công nghệ phải phù hợp quy mô, vốn, loại cây và mục đích.", "c) Công nghệ càng hiện đại thì càng phù hợp với mọi trường hợp.", "d) Kết hợp nhà màng với thủy canh tạo hiệu quả tổng hợp cao."]}, {"type": "short", "level": "VDC", "q": "Nêu mối quan hệ giữa trồng cây không dùng đất và nông nghiệp đô thị.", "answer": "trồng cây không dùng đất là giải pháp kĩ thuật cốt lõi của nông nghiệp đô thị", "explain": "Không cần đất giúp trồng rau trên sân thượng, ban công, trong nhà — nền tảng để nông nghiệp đô thị phát triển.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao Singapore, Israel phát triển mạnh thủy canh, khí canh?", "answer": "vì thiếu đất và nước, công nghệ này cho năng suất cao trên diện tích nhỏ", "explain": "Thiếu đất, thiếu nước là động lực; thủy canh/khí canh không cần đất, tiết kiệm nước tối đa, năng suất cao.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Trồng cây không dùng đất thuộc nhóm công nghệ nào trong trồng trọt công nghệ cao?", "answer": "A", "explain": "Đây là công nghệ canh tác kiểm soát chính xác môi trường rễ và dinh dưỡng — thuộc nhóm công nghệ cao trong trồng trọt.", "points": 0.25, "options": ["A. Nhóm công nghệ canh tác tiên tiến, kiểm soát chính xác dinh dưỡng và môi trường rễ.", "B. Nhóm công nghệ chế biến sau thu hoạch.", "C. Nhóm công nghệ làm đất.", "D. Nhóm công nghệ bảo quản nông sản."]}, {"type": "mcq", "level": "NB", "q": "Mối quan hệ giữa trồng cây không dùng đất và nông nghiệp đô thị là gì?", "answer": "A", "explain": "Không cần đất là lợi thế then chốt để trồng rau trên sân thượng, ban công, trong nhà — nền tảng của nông nghiệp đô thị.", "points": 0.25, "options": ["A. Trồng cây không dùng đất là giải pháp kĩ thuật cốt lõi giúp nông nghiệp đô thị phát triển trên diện tích nhỏ.", "B. Hai lĩnh vực không liên quan.", "C. Nông nghiệp đô thị cấm dùng thủy canh.", "D. Chỉ nông thôn mới dùng được."]}, {"type": "mcq", "level": "TH", "q": "Vì sao các nước thiếu đất canh tác (như Singapore, Israel) phát triển mạnh thủy canh, khí canh?", "answer": "A", "explain": "Thiếu đất và nước là động lực để các nước này phát triển thủy canh, khí canh — năng suất cao trên diện tích nhỏ, tiết kiệm nước tối đa.", "points": 0.25, "options": ["A. Vì công nghệ này không cần đất, tiết kiệm nước, cho năng suất cao trên diện tích nhỏ.", "B. Vì các nước này thích công nghệ đắt tiền.", "C. Vì ở đó không trồng được cây trên đất.", "D. Vì thủy canh không cần nước."]}, {"type": "mcq", "level": "TH", "q": "Nhận định nào sau đây sai về trồng cây không dùng đất?", "answer": "A", "explain": "Trồng cây không dùng đất đòi hỏi kiến thức kĩ thuật cao (pha dung dịch, theo dõi pH, EC, vận hành hệ thống) — đây là nhược điểm chính.", "points": 0.25, "options": ["A. Trồng cây không dùng đất không cần bất kì kiến thức kĩ thuật nào.", "B. Trồng cây không dùng đất tiết kiệm nước hơn trồng trên đất.", "C. Thủy canh hồi lưu có mức tự động hóa cao hơn thủy canh tĩnh.", "D. Khí canh phun sương dinh dưỡng lên rễ treo trong không khí."]}, {"type": "mcq", "level": "VD", "q": "Tương lai của trồng cây không dùng đất gắn với xu hướng nào?", "answer": "A", "explain": "Xu hướng là trang trại thẳng đứng trong đô thị: xếp nhiều tầng thủy canh/khí canh trong nhà cao tầng, sản xuất rau sạch tại chỗ.", "points": 0.25, "options": ["A. Nông nghiệp đô thị, nông nghiệp thẳng đứng (vertical farming) trong nhà cao tầng ở thành phố.", "B. Quay lại trồng trọt quảng canh.", "C. Bỏ hoang đất nông nghiệp.", "D. Ngừng sản xuất rau."]}, {"type": "mcq", "level": "VDC", "q": "Một startup muốn kinh doanh rau thủy canh. Yếu tố nào quyết định sự thành công ngoài kĩ thuật?", "answer": "A", "explain": "Kinh doanh cần: đầu ra ổn định, kiểm soát chi phí (điện, dung dịch), chất lượng đồng đều, an toàn để giữ khách hàng.", "points": 0.25, "options": ["A. Đầu ra ổn định (siêu thị, cửa hàng), chi phí hợp lí và chất lượng đồng đều, an toàn.", "B. Chỉ cần hệ thống đẹp.", "C. Chỉ cần quảng cáo nhiều.", "D. Chỉ cần trồng thật nhiều loại rau."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về phát triển bền vững:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: tốn điện nên cần tối ưu năng lượng. d) Sai: góp phần đảm bảo rau sạch cho đô thị.", "points": 1, "statements": ["a) Thủy canh tiết kiệm nước, giảm thuốc bảo vệ thực vật nên thân thiện môi trường.", "b) Sản xuất rau tại đô thị giảm khí thải vận chuyển.", "c) Hệ thống thủy canh cần được quản lí tốt năng lượng để thực sự bền vững.", "d) Trồng cây không dùng đất không liên quan đến an ninh lương thực đô thị."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định tổng hợp cuối bài:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cây lương thực diện rộng, cây gỗ lớn vẫn hiệu quả hơn trên đất.", "points": 1, "statements": ["a) Ưu điểm lớn nhất của trồng cây không dùng đất là không cần đất và tiết kiệm nước.", "b) Nhược điểm lớn nhất là vốn đầu tư cao và đòi hỏi kĩ thuật.", "c) Thủy canh tĩnh phù hợp hộ gia đình; hồi lưu phù hợp trang trại; khí canh cho sản phẩm giá trị cao.", "d) Mọi loại cây trồng đều nên chuyển sang thủy canh, khí canh."]}, {"type": "short", "level": "VDC", "q": "Kể tên hai dạng của thủy canh và nêu đặc điểm phân biệt.", "answer": "không hồi lưu: thay dung dịch thủ công; hồi lưu: bơm tuần hoàn", "explain": "Thủy canh không hồi lưu (tĩnh): thay dung dịch thủ công; thủy canh hồi lưu (động): bơm tuần hoàn liên tục, tự động hóa cao.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu một xu hướng tương lai của trồng cây không dùng đất.", "answer": "nông nghiệp thẳng đứng (vertical farming) trong đô thị", "explain": "Xu hướng: trang trại thẳng đứng nhiều tầng thủy canh/khí canh trong nhà cao tầng đô thị, sản xuất rau sạch tại chỗ.", "points": 0.5}]}]}
