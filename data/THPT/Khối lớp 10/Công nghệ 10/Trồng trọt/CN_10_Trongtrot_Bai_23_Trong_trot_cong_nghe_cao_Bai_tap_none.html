", "C. Hạn chế sử dụng điện thoại thông minh trong quản lí trang trại.", "D. Giảm diện tích trồng rau an toàn theo tiêu chuẩn VietGAP."]}, {"type": "mcq", "level": "TH", "q": "Tiêu chuẩn nào sau đây thường được áp dụng trong trồng trọt công nghệ cao để đảm bảo nông sản an toàn?", "answer": "A", "explain": "VietGAP (thực hành nông nghiệp tốt Việt Nam) và GlobalGAP (toàn cầu) là các tiêu chuẩn đảm bảo quy trình sản xuất an toàn, truy xuất được nguồn gốc — thường gắn với trồng trọt công nghệ cao.", "points": 0.25, "options": ["A. VietGAP, GlobalGAP.", "B. Tiêu chuẩn khí thải xe cơ giới Euro 5.", "C. Tiêu chuẩn an toàn thực phẩm chỉ áp dụng cho thủy sản.", "D. Không cần tiêu chuẩn nào, chỉ cần năng suất cao."]}, {"type": "mcq", "level": "VD", "q": "Một hợp tác xã liên kết với doanh nghiệp từ khâu sản xuất đến chế biến, tiêu thụ và truy xuất nguồn gốc sản phẩm bằng mã QR. Đây là biểu hiện của xu hướng nào?", "answer": "A", "explain": "Liên kết doanh nghiệp – nông dân từ sản xuất đến tiêu thụ, có truy xuất nguồn gốc, là xu hướng liên kết chuỗi giá trị của trồng trọt công nghệ cao.", "points": 0.25, "options": ["A. Liên kết chuỗi giá trị trong trồng trọt công nghệ cao.", "B. Sản xuất manh mún, nhỏ lẻ theo hộ gia đình.", "C. Chỉ tập trung vào khâu thu hoạch thủ công.", "D. Giảm vai trò của doanh nghiệp trong nông nghiệp."]}, {"type": "mcq", "level": "VDC", "q": "Vì sao nói trồng trọt công nghệ cao giúp thích ứng với biến đổi khí hậu?", "answer": "A", "explain": "Nhà màng/nhà kính cùng hệ thống điều khiển tạo tiểu khí hậu ổn định, che chắn mưa bão, hạn chế sâu bệnh nên sản xuất ít bị ảnh hưởng bởi thời tiết cực đoan.", "points": 0.25, "options": ["A. Vì trồng trong nhà màng, nhà kính giúp chủ động đối phó với hạn hán, mưa bão, sâu bệnh và điều chỉnh được tiểu khí hậu.", "B. Vì trồng trọt công nghệ cao làm cho khí hậu toàn cầu mát mẻ hơn.", "C. Vì không cần nước tưới nên không sợ hạn hán.", "D. Vì cây trồng công nghệ cao không bao giờ bị sâu bệnh."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về vai trò của trồng trọt công nghệ cao:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: tưới nhỏ giọt, bón chính xác tiết kiệm tài nguyên. c) Sai: giúp GIẢM lượng thuốc dư thừa nhờ phun chính xác. d) Đúng.", "points": 1, "statements": ["a) Trồng trọt công nghệ cao giúp nâng cao năng suất, chất lượng nông sản.", "b) Trồng trọt công nghệ cao giúp tiết kiệm nước, phân bón nhờ tưới và bón chính xác.", "c) Trồng trọt công nghệ cao làm tăng lượng thuốc bảo vệ thực vật thải ra môi trường.", "d) Trồng trọt công nghệ cao tạo ra nông sản an toàn cho người tiêu dùng."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về xu hướng ở Việt Nam:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: là các xu hướng nổi bật. d) Sai: đã có các khu nông nghiệp công nghệ cao ở TP. Hồ Chí Minh, Hà Nội, Lâm Đồng...", "points": 1, "statements": ["a) Diện tích nhà màng, nhà kính trồng rau, hoa đang mở rộng ở Đà Lạt và các tỉnh phía Bắc.", "b) Tưới nhỏ giọt, tưới phun mưa đang được áp dụng cho cà phê, hồ tiêu ở Tây Nguyên.", "c) Nông sản đạt chuẩn VietGAP, GlobalGAP ngày càng được chú trọng.", "d) Việt Nam không có khu nông nghiệp công nghệ cao nào."]}, {"type": "short", "level": "NB", "q": "Nêu tên một công nghệ thông tin được ứng dụng trong trồng trọt công nghệ cao.", "answer": "Internet vạn vật (IoT)", "explain": "IoT kết nối cảm biến và thiết bị qua internet, cho phép giám sát, điều khiển trang trại từ xa. Các đáp án khác như phần mềm quản lí trang trại, bản đồ số cũng được chấp nhận.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Nông sản an toàn trong trồng trọt công nghệ cao thường đạt các chứng nhận nào? (nêu một)", "answer": "VietGAP", "explain": "Các chứng nhận phổ biến là VietGAP (Việt Nam) và GlobalGAP (toàn cầu), đảm bảo quy trình sản xuất an toàn, truy xuất được nguồn gốc.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Đặc điểm nào sau đây là rào cản lớn nhất khi nông hộ nhỏ muốn áp dụng trồng trọt công nghệ cao?", "answer": "A", "explain": "Vốn đầu tư ban đầu lớn là rào cản chính với nông hộ nhỏ; bên cạnh đó còn cần lao động có trình độ để vận hành hệ thống.", "points": 0.25, "options": ["A. Vốn đầu tư ban đầu lớn cho nhà kính, hệ thống tưới, máy móc, cảm biến.", "B. Thiếu đất canh tác vì công nghệ cao cần diện tích rất rộng.", "C. Công nghệ cao chỉ áp dụng được cho cây lúa nước.", "D. Sản phẩm công nghệ cao không bán được trên thị trường."]}, {"type": "mcq", "level": "NB", "q": "Nông sản của trồng trọt công nghệ cao thường có đặc điểm gì về chất lượng?", "answer": "A", "explain": "Nhờ kiểm soát chặt chẽ quy trình, nông sản công nghệ cao đồng đều về mẫu mã, chất lượng, đảm bảo an toàn và truy xuất được nguồn gốc.", "points": 0.25, "options": ["A. Đồng đều, an toàn, truy xuất được nguồn gốc, đạt tiêu chuẩn VietGAP/GlobalGAP.", "B. Năng suất cao nhưng chất lượng không ổn định.", "C. Chỉ đẹp mã, không đảm bảo an toàn thực phẩm.", "D. Không khác gì nông sản canh tác truyền thống."]}, {"type": "mcq", "level": "TH", "q": "Vì sao trồng trọt công nghệ cao thường tổ chức sản xuất tập trung, quy mô lớn?", "answer": "A", "explain": "Chi phí đầu tư công nghệ lớn nên sản xuất tập trung, quy mô lớn giúp phân bổ chi phí, nâng hiệu quả và thuận lợi liên kết chế biến, tiêu thụ.", "points": 0.25, "options": ["A. Vì đầu tư công nghệ tốn kém nên cần quy mô lớn để giảm chi phí trên một đơn vị sản phẩm và liên kết chuỗi giá trị.", "B. Vì công nghệ cao không thể áp dụng trên diện tích nhỏ.", "C. Vì nhà nước cấm sản xuất nhỏ lẻ.", "D. Vì cây trồng công nghệ cao chỉ sống được trên đồng ruộng rộng."]}, {"type": "mcq", "level": "TH", "q": "Trong các vai trò sau, vai trò nào thể hiện ý nghĩa xã hội của trồng trọt công nghệ cao?", "answer": "A", "explain": "Ý nghĩa xã hội nổi bật là cung cấp nguồn nông sản an toàn, chất lượng cho xã hội, bảo vệ sức khỏe người tiêu dùng.", "points": 0.25, "options": ["A. Cung cấp nông sản an toàn, đáp ứng nhu cầu ngày càng cao của người tiêu dùng.", "B. Chỉ làm tăng lợi nhuận cho doanh nghiệp lớn.", "C. Giảm số lượng nông dân tham gia sản xuất.", "D. Làm cho giá nông sản luôn ở mức cao."]}, {"type": "mcq", "level": "VD", "q": "Gia đình ông An đầu tư 500 triệu đồng làm nhà màng trồng dưa lưới, thuê kĩ sư nông nghiệp hướng dẫn quy trình. Sau một năm, năng suất đạt 40 tấn/ha, sản phẩm được siêu thị thu mua với giá cao. Trường hợp này minh họa nội dung nào của bài học?", "answer": "A", "explain": "Trường hợp thể hiện đầy đủ: vốn đầu tư lớn, cần lao động có trình độ (kĩ sư), kết quả là năng suất cao và hiệu quả kinh tế tốt — đúng bản chất trồng trọt công nghệ cao.", "points": 0.25, "options": ["A. Đặc điểm (vốn lớn, lao động có trình độ) và vai trò (năng suất cao, hiệu quả kinh tế) của trồng trọt công nghệ cao.", "B. Hạn chế của trồng trọt công nghệ cao là không hiệu quả kinh tế.", "C. Trồng trọt công nghệ cao chỉ phù hợp với doanh nghiệp nước ngoài.", "D. Nhà màng không có tác dụng nâng cao năng suất cây trồng."]}, {"type": "mcq", "level": "VDC", "q": "Một địa phương muốn phát triển trồng trọt công nghệ cao nhưng nông dân thiếu vốn và kĩ thuật. Giải pháp nào sau đây là phù hợp và bền vững nhất?", "answer": "A", "explain": "Liên kết hợp tác xã – doanh nghiệp giúp nông dân khắc phục rào cản vốn và kĩ thuật, đồng thời đảm bảo đầu ra, là hướng phát triển bền vững.", "points": 0.25, "options": ["A. Hình thành hợp tác xã, liên kết với doanh nghiệp để được đầu tư vốn, chuyển giao công nghệ và bao tiêu sản phẩm.", "B. Khuyên nông dân vay nặng lãi để tự đầu tư nhà kính riêng lẻ.", "C. Bỏ trồng trọt, chuyển toàn bộ sang làm công nghiệp.", "D. Tiếp tục canh tác truyền thống, không cần đổi mới."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: kiểm soát chính xác quy trình. c) Sai: công nghệ cao giúp CHỦ ĐỘNG đối phó thời tiết. d) Đúng.", "points": 1, "statements": ["a) Nông nghiệp công nghệ cao ứng dụng thành tựu của công nghệ sinh học và công nghệ thông tin.", "b) Trồng trọt công nghệ cao kiểm soát chặt chẽ các yếu tố như nhiệt độ, độ ẩm, dinh dưỡng.", "c) Trồng trọt công nghệ cao phụ thuộc hoàn toàn vào thời tiết như canh tác truyền thống.", "d) Nông nghiệp đô thị như trồng rau thủy canh trên sân thượng là một xu hướng của trồng trọt công nghệ cao."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: liên kết chuỗi giá trị là xu hướng quan trọng. d) Đúng: hợp tác xã giúp khắc phục rào cản vốn, kĩ thuật.", "points": 1, "statements": ["a) Cảm biến độ ẩm đất giúp tưới nước đúng lúc, đúng lượng cây cần.", "b) Mã QR truy xuất nguồn gốc giúp người tiêu dùng biết quy trình sản xuất nông sản.", "c) Trồng trọt công nghệ cao không cần liên kết giữa nông dân và doanh nghiệp.", "d) Hợp tác xã là mô hình phù hợp để nông dân cùng nhau áp dụng công nghệ cao."]}, {"type": "short", "level": "TH", "q": "Vì sao trồng trọt công nghệ cao cần lao động có trình độ? (trả lời ngắn gọn)", "answer": "để vận hành và giám sát hệ thống công nghệ hiện đại", "explain": "Hệ thống tự động, cảm biến, phần mềm quản lí đòi hỏi người lao động được đào tạo mới vận hành, giám sát và xử lí sự cố được.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nêu một vai trò của trồng trọt công nghệ cao đối với môi trường.", "answer": "giảm phân bón và thuốc bảo vệ thực vật dư thừa thải ra môi trường", "explain": "Nhờ bón, tưới, phun chính xác nên giảm dư thừa hóa chất gây ô nhiễm đất, nước; đồng thời tiết kiệm tài nguyên.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Cụm từ nào sau đây phù hợp nhất để hoàn thành khái niệm: Nông nghiệp công nghệ cao là nền nông nghiệp ứng dụng ... vào sản xuất?", "answer": "A", "explain": "Nông nghiệp công nghệ cao là ứng dụng những thành tựu khoa học và công nghệ hiện đại (sinh học, tự động hóa, thông tin, vật liệu mới...) vào sản xuất.", "points": 0.25, "options": ["A. những thành tựu khoa học và công nghệ hiện đại.", "B. sức kéo của trâu bò và lao động thủ công.", "C. kinh nghiệm dân gian truyền từ đời này sang đời khác.", "D. phân bón hóa học với liều lượng thật cao."]}, {"type": "mcq", "level": "NB", "q": "Internet vạn vật (IoT) được ứng dụng trong trồng trọt công nghệ cao để làm gì?", "answer": "A", "explain": "IoT kết nối các cảm biến (nhiệt độ, độ ẩm...) và thiết bị chấp hành (máy bơm, quạt) qua internet, cho phép giám sát và điều khiển trang trại từ xa.", "points": 0.25, "options": ["A. Kết nối cảm biến, thiết bị để thu thập dữ liệu và điều khiển trang trại từ xa qua mạng internet.", "B. Chỉ dùng để nông dân lướt mạng xã hội khi rảnh rỗi.", "C. Thay thế hoàn toàn cây trồng bằng mô hình trên máy tính.", "D. Tự động bán nông sản mà không cần thu hoạch."]}, {"type": "mcq", "level": "TH", "q": "Vì sao sản phẩm trồng trọt công nghệ cao dễ đạt tiêu chuẩn xuất khẩu?", "answer": "A", "explain": "Thị trường xuất khẩu đòi hỏi chất lượng đồng đều, an toàn, truy xuất nguồn gốc — đúng những ưu thế của trồng trọt công nghệ cao.", "points": 0.25, "options": ["A. Vì quy trình được kiểm soát chặt chẽ, chất lượng đồng đều, an toàn và truy xuất được nguồn gốc.", "B. Vì sản phẩm luôn có kích thước to hơn bình thường.", "C. Vì không cần kiểm tra chất lượng trước khi xuất khẩu.", "D. Vì giá thành luôn rẻ hơn nông sản các nước."]}, {"type": "mcq", "level": "TH", "q": "Nhận định nào sau đây KHÔNG đúng về vai trò của trồng trọt công nghệ cao?", "answer": "C", "explain": "Trồng trọt công nghệ cao giúp CHỦ ĐỘNG đối phó với thời tiết (nhà màng, tưới tự động...), giảm phụ thuộc vào tự nhiên chứ không tăng phụ thuộc.", "points": 0.25, "options": ["A. Giúp tăng năng suất, chất lượng nông sản và hiệu quả kinh tế.", "B. Góp phần tiết kiệm tài nguyên đất, nước và bảo vệ môi trường.", "C. Làm cho nông nghiệp ngày càng phụ thuộc hoàn toàn vào thời tiết.", "D. Tạo ra nông sản an toàn, đáp ứng nhu cầu người tiêu dùng."]}, {"type": "mcq", "level": "VD", "q": "Một công ty rau sạch ghi mã QR trên mỗi gói rau, khách hàng quét mã thấy được toàn bộ quy trình trồng, ngày thu hoạch. Điều này thể hiện đặc điểm nào?", "answer": "A", "explain": "Mã QR truy xuất nguồn gốc là biểu hiện của sản phẩm chất lượng cao, minh bạch quy trình — đặc trưng của trồng trọt công nghệ cao.", "points": 0.25, "options": ["A. Sản phẩm chất lượng cao, truy xuất được nguồn gốc.", "B. Sản xuất manh mún, không có tổ chức.", "C. Không ứng dụng công nghệ thông tin.", "D. Chỉ chú trọng năng suất, bỏ qua chất lượng."]}, {"type": "mcq", "level": "VDC", "q": "Đánh giá tính khả thi: Một hộ nông dân có 500 m2 đất, vốn ít, muốn bắt đầu với trồng trọt công nghệ cao. Lựa chọn nào khả thi nhất?", "answer": "A", "explain": "Có thể bắt đầu từ mô hình nhỏ, vốn vừa phải (nhà màng đơn giản + tưới nhỏ giọt), tích lũy kinh nghiệm rồi mở rộng — phù hợp với nông hộ ít vốn.", "points": 0.25, "options": ["A. Làm nhà màng đơn giản trồng rau ăn lá kết hợp tưới nhỏ giọt, từng bước mở rộng khi có vốn và kinh nghiệm.", "B. Vay vốn lớn xây ngay nhà kính hiện đại nhập khẩu dù chưa có kĩ thuật.", "C. Bỏ đất hoang chờ đủ vốn mới làm.", "D. Trồng trọt công nghệ cao không thể bắt đầu từ quy mô nhỏ."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: đi từ nhỏ đến lớn, tích lũy kinh nghiệm. c) Sai: có thể bắt đầu từ mô hình nhỏ, vốn vừa phải. d) Đúng.", "points": 1, "statements": ["a) Vốn đầu tư lớn là rào cản chính khiến nông hộ nhỏ khó áp dụng trồng trọt công nghệ cao.", "b) Bắt đầu từ mô hình nhỏ như nhà màng đơn giản kết hợp tưới nhỏ giọt là cách tiếp cận khả thi với nông hộ ít vốn.", "c) Nông hộ ít vốn thì không bao giờ có thể áp dụng được công nghệ cao.", "d) Liên kết hợp tác xã – doanh nghiệp giúp nông dân khắc phục khó khăn về vốn và kĩ thuật."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: VietGAP là thực hành nông nghiệp tốt Việt Nam. d) Sai: chất lượng và an toàn là mục tiêu quan trọng.", "points": 1, "statements": ["a) Sản phẩm công nghệ cao giá cao hơn vì chi phí đầu tư và quy trình kiểm soát nghiêm ngặt.", "b) Người tiêu dùng ngày càng ưa chuộng nông sản an toàn, có nguồn gốc rõ ràng.", "c) Chứng nhận VietGAP đảm bảo quy trình sản xuất nông sản an toàn.", "d) Trồng trọt công nghệ cao chỉ nhằm tăng năng suất, không quan tâm chất lượng."]}, {"type": "short", "level": "TH", "q": "Tỉnh, thành nào của Việt Nam nổi tiếng là trung tâm rau, hoa công nghệ cao với nhiều nhà kính, nhà màng?", "answer": "Lâm Đồng (Đà Lạt)", "explain": "Đà Lạt (Lâm Đồng) có khí hậu mát mẻ và đi đầu cả nước về nhà kính, nhà màng trồng rau, hoa công nghệ cao.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Kể tên một xu hướng phát triển trồng trọt công nghệ cao ở Việt Nam.", "answer": "mở rộng nhà màng, nhà kính", "explain": "Các xu hướng: mở rộng nhà màng/nhà kính; tưới tiết kiệm; nông sản an toàn VietGAP/hữu cơ; nông nghiệp đô thị, thông minh; khu nông nghiệp công nghệ cao; liên kết chuỗi giá trị.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Trồng trọt công nghệ cao khác trồng trọt truyền thống ở điểm cơ bản nào?", "answer": "A", "explain": "Điểm khác biệt cơ bản là mức độ ứng dụng công nghệ và kiểm soát quy trình: công nghệ cao chủ động điều khiển các yếu tố sinh trưởng, còn truyền thống phụ thuộc nhiều vào tự nhiên và kinh nghiệm.", "points": 0.25, "options": ["A. Ứng dụng công nghệ hiện đại, kiểm soát chính xác quy trình thay vì chủ yếu dựa vào kinh nghiệm và điều kiện tự nhiên.", "B. Không cần sử dụng đất để trồng cây.", "C. Chỉ trồng được một loại cây duy nhất.", "D. Không cần con người tham gia sản xuất."]}, {"type": "mcq", "level": "NB", "q": "Khu nông nghiệp công nghệ cao ở TP. Hồ Chí Minh, Hà Nội, Lâm Đồng có vai trò gì?", "answer": "A", "explain": "Các khu nông nghiệp công nghệ cao là nơi tập trung đầu tư, nghiên cứu, chuyển giao công nghệ và trình diễn mô hình để nhân rộng.", "points": 0.25, "options": ["A. Thu hút doanh nghiệp đầu tư, nghiên cứu, chuyển giao công nghệ và trình diễn mô hình cho nông dân học tập.", "B. Chỉ để trưng bày, không có hoạt động sản xuất.", "C. Cấm nông dân tham quan, học tập.", "D. Chỉ trồng cây cảnh phục vụ du lịch."]}, {"type": "mcq", "level": "TH", "q": "Vì sao nông nghiệp đô thị (trồng rau trên sân thượng, trong nhà phố) được xem là một xu hướng của trồng trọt công nghệ cao?", "answer": "A", "explain": "Nông nghiệp đô thị ứng dụng thủy canh, khí canh, tưới tự động, cảm biến... trên không gian nhỏ — đúng tinh thần công nghệ cao.", "points": 0.25, "options": ["A. Vì ứng dụng thủy canh, khí canh, cảm biến, điều khiển tự động trên diện tích nhỏ trong đô thị.", "B. Vì chỉ trồng cây cảnh, không trồng rau ăn.", "C. Vì không cần áp dụng kĩ thuật gì đặc biệt.", "D. Vì chỉ người giàu mới trồng được rau trên sân thượng."]}, {"type": "mcq", "level": "TH", "q": "Trong các yếu tố sau, yếu tố nào là điều kiện TIÊN QUYẾT để phát triển trồng trọt công nghệ cao ở một địa phương?", "answer": "A", "explain": "Vốn đầu tư và nhân lực có trình độ là hai điều kiện tiên quyết; đất rộng hay khí hậu lạnh không bắt buộc vì công nghệ giúp khắc phục hạn chế tự nhiên.", "points": 0.25, "options": ["A. Có nguồn vốn đầu tư và đội ngũ lao động được đào tạo về kĩ thuật.", "B. Có diện tích đất nông nghiệp thật rộng lớn.", "C. Có khí hậu lạnh quanh năm như Đà Lạt.", "D. Có thật nhiều lao động phổ thông giá rẻ."]}, {"type": "mcq", "level": "VD", "q": "Một siêu thị yêu cầu rau cung cấp phải có chứng nhận VietGAP và mã truy xuất nguồn gốc. Yêu cầu này liên quan đến đặc điểm nào của trồng trọt công nghệ cao?", "answer": "A", "explain": "Chứng nhận VietGAP + truy xuất nguồn gốc chính là yêu cầu về sản phẩm an toàn, chất lượng cao, minh bạch — đặc trưng của trồng trọt công nghệ cao.", "points": 0.25, "options": ["A. Sản phẩm chất lượng cao, an toàn, truy xuất được nguồn gốc.", "B. Vốn đầu tư lớn.", "C. Lao động có trình độ cao.", "D. Sản xuất tập trung quy mô lớn."]}, {"type": "mcq", "level": "VDC", "q": "Phân tích: Vì sao nhiều doanh nghiệp lớn (như các tập đoàn trong nước) đầu tư vào nông nghiệp công nghệ cao dù vốn ban đầu rất lớn?", "answer": "A", "explain": "Dù vốn đầu tư ban đầu lớn, nông sản sạch, chất lượng cao có nhu cầu thị trường lớn, giá bán tốt và ổn định nên hiệu quả kinh tế lâu dài hấp dẫn doanh nghiệp.", "points": 0.25, "options": ["A. Vì nông sản chất lượng cao, an toàn có thị trường lớn, giá trị gia tăng cao, mang lại lợi nhuận bền vững về lâu dài.", "B. Vì đầu tư nông nghiệp được miễn mọi loại thuế mãi mãi.", "C. Vì trồng trọt công nghệ cao không bao giờ gặp rủi ro.", "D. Vì nhà nước bao tiêu toàn bộ sản phẩm."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cây vẫn cần ánh sáng để quang hợp; nhà màng dùng vật liệu cho ánh sáng đi qua. d) Đúng.", "points": 1, "statements": ["a) Nhà màng giúp cây trồng tránh được mưa bão, hạn chế sâu bệnh nên năng suất ổn định hơn.", "b) Tưới nhỏ giọt đưa nước trực tiếp đến vùng rễ nên tiết kiệm nước hơn tưới tràn.", "c) Trồng trong nhà màng thì cây không cần ánh sáng.", "d) Đà Lạt phát triển rau, hoa công nghệ cao nhờ khí hậu mát mẻ và đi đầu về nhà kính, nhà màng."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: công nghệ cao cần sản xuất tập trung, quy mô lớn. d) Đúng: AI phân tích ảnh lá để phát hiện bệnh sớm.", "points": 1, "statements": ["a) Sản xuất tập trung, quy mô lớn giúp giảm chi phí công nghệ trên mỗi đơn vị sản phẩm.", "b) Vùng chuyên canh với hạ tầng công nghệ đồng bộ là biểu hiện của sản xuất tập trung.", "c) Sản xuất manh mún, nhỏ lẻ phù hợp hơn với trồng trọt công nghệ cao.", "d) Trí tuệ nhân tạo có thể hỗ trợ chẩn đoán sâu bệnh qua hình ảnh lá cây."]}, {"type": "short", "level": "VD", "q": "Một trang trại dùng drone phun thuốc cho 50 ha lúa trong 1 ngày, trong khi phun tay cần 10 ngày. Điều này thể hiện vai trò nào của công nghệ cao?", "answer": "tăng năng suất lao động, giảm chi phí và thời gian sản xuất", "explain": "Drone giúp phun nhanh, đều, giảm nhân công và thời gian, thể hiện vai trò nâng cao hiệu quả sản xuất của công nghệ cao.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Vì sao mã QR truy xuất nguồn gốc lại quan trọng với nông sản công nghệ cao?", "answer": "giúp người tiêu dùng kiểm tra quy trình sản xuất, tăng niềm tin vào chất lượng và an toàn sản phẩm", "explain": "Truy xuất nguồn gốc minh bạch quy trình, chứng minh nông sản an toàn — lợi thế cạnh tranh của nông sản công nghệ cao.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Đâu là ví dụ đúng về trồng trọt công nghệ cao?", "answer": "A", "explain": "Nhà kính điều khiển tự động nhiệt độ, độ ẩm là mô hình điển hình của trồng trọt công nghệ cao.", "points": 0.25, "options": ["A. Trồng hoa lan trong nhà kính có hệ thống điều khiển nhiệt độ, độ ẩm tự động ở Đà Lạt.", "B. Trồng lúa một vụ, hoàn toàn nhờ nước trời, không bón phân.", "C. Trồng sắn trên đất dốc theo tập quán du canh du cư.", "D. Trồng rau muống dưới ao, không chăm sóc gì."]}, {"type": "mcq", "level": "NB", "q": "Cụm từ 'kiểm soát chặt chẽ quy trình' trong trồng trọt công nghệ cao có nghĩa là gì?", "answer": "A", "explain": "Kiểm soát chặt chẽ quy trình nghĩa là chủ động theo dõi, điều chỉnh chính xác các yếu tố ảnh hưởng đến sinh trưởng của cây.", "points": 0.25, "options": ["A. Theo dõi và điều chỉnh chính xác các yếu tố như nhiệt độ, độ ẩm, dinh dưỡng, sâu bệnh trong suốt quá trình trồng.", "B. Giám sát công nhân làm việc bằng camera.", "C. Kiểm tra nông sản sau thu hoạch rồi mới bán.", "D. Hạn chế số lượng cây trồng trong một vụ."]}, {"type": "mcq", "level": "TH", "q": "Vì sao tưới tiết kiệm (nhỏ giọt, phun mưa) được xem là biểu hiện của trồng trọt công nghệ cao ở Tây Nguyên?", "answer": "A", "explain": "Tây Nguyên có mùa khô kéo dài; tưới nhỏ giọt/phun mưa tiết kiệm nước, kết hợp bón phân chính xác nên là ứng dụng công nghệ cao điển hình cho cà phê, hồ tiêu.", "points": 0.25, "options": ["A. Vì giúp tiết kiệm nước, bón phân qua hệ thống tưới chính xác, nâng cao năng suất cà phê, hồ tiêu trong điều kiện khô hạn.", "B. Vì Tây Nguyên thừa nước nên cần tưới nhiều.", "C. Vì tưới tiết kiệm làm tăng lượng nước ngầm vô hạn.", "D. Vì chỉ có Tây Nguyên mới lắp được hệ thống tưới."]}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây đúng về mối quan hệ giữa trồng trọt công nghệ cao và phát triển bền vững?", "answer": "A", "explain": "Nhờ sử dụng hiệu quả tài nguyên (nước, phân bón), giảm ô nhiễm, thích ứng biến đổi khí hậu, trồng trọt công nghệ cao là hướng đi của nông nghiệp bền vững.", "points": 0.25, "options": ["A. Trồng trọt công nghệ cao hướng tới phát triển bền vững nhờ tiết kiệm tài nguyên và bảo vệ môi trường.", "B. Trồng trọt công nghệ cao mâu thuẫn với phát triển bền vững vì tốn nhiều điện.", "C. Phát triển bền vững không cần quan tâm đến công nghệ.", "D. Chỉ trồng trọt truyền thống mới bền vững."]}, {"type": "mcq", "level": "VD", "q": "Một trang trại dùng phần mềm trên máy tính để ghi chép toàn bộ lịch sử bón phân, phun thuốc, thu hoạch từng luống rau. Việc làm này phục vụ mục đích gì?", "answer": "A", "explain": "Ghi chép số hóa toàn bộ quy trình giúp truy xuất nguồn gốc, minh bạch sản xuất — yêu cầu quan trọng của nông sản công nghệ cao, an toàn.", "points": 0.25, "options": ["A. Truy xuất nguồn gốc, chứng minh quy trình sản xuất an toàn với khách hàng và cơ quan quản lí.", "B. Chỉ để trang trí, không có tác dụng thực tế.", "C. Để tăng giá bán một cách tùy tiện.", "D. Để thay thế hoàn toàn việc chăm sóc cây."]}, {"type": "mcq", "level": "VDC", "q": "So sánh hiệu quả sử dụng nước: trồng cà chua ngoài đồng tưới tràn so với trồng trong nhà màng tưới nhỏ giọt. Kết luận nào hợp lí?", "answer": "A", "explain": "Tưới nhỏ giọt đưa nước trực tiếp đến vùng rễ với lưu lượng chính xác, kết hợp nhà màng giảm bốc hơi nên tiết kiệm nước vượt trội so với tưới tràn.", "points": 0.25, "options": ["A. Tưới nhỏ giọt trong nhà màng tiết kiệm nước hơn nhiều vì nước được đưa trực tiếp đến vùng rễ, hạn chế bốc hơi.", "B. Tưới tràn tiết kiệm nước hơn vì đơn giản, không tốn điện.", "C. Hai cách tưới tiêu tốn lượng nước như nhau.", "D. Nhà màng làm cây cần nhiều nước hơn nên tốn nước hơn."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: nhà màng, tưới tự động giúp đối phó thời tiết cực đoan. c) Sai: công nghệ cao hiện đại hóa nông nghiệp. d) Đúng.", "points": 1, "statements": ["a) Trồng trọt công nghệ cao góp phần đảm bảo an ninh lương thực nhờ năng suất cao, sản xuất ổn định.", "b) Trồng trọt công nghệ cao giúp nông dân chủ động hơn trước biến đổi khí hậu.", "c) Công nghệ cao khiến nông nghiệp ngày càng lạc hậu.", "d) Kết hợp nhà màng với du lịch trải nghiệm có thể tăng hiệu quả kinh tế."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: CNTT là trụ cột của nông nghiệp thông minh. d) Đúng.", "points": 1, "statements": ["a) Phần mềm quản lí trang trại giúp ghi chép, truy xuất toàn bộ quy trình sản xuất.", "b) Dữ liệu từ cảm biến giúp người trồng ra quyết định tưới, bón phân chính xác.", "c) Công nghệ thông tin không có vai trò gì trong trồng trọt.", "d) Điều khiển trang trại từ xa qua điện thoại là ứng dụng của IoT trong nông nghiệp."]}, {"type": "short", "level": "VD", "q": "Nêu một giải pháp giúp nông hộ ít vốn vẫn có thể tiếp cận trồng trọt công nghệ cao.", "answer": "tham gia hợp tác xã, liên kết với doanh nghiệp", "explain": "Hợp tác xã giúp nông dân góp vốn, được chuyển giao kĩ thuật và bao tiêu sản phẩm; hoặc bắt đầu từ mô hình nhỏ như nhà màng đơn giản + tưới nhỏ giọt.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trồng rau thủy canh trên sân thượng thuộc xu hướng nào của trồng trọt công nghệ cao ở Việt Nam?", "answer": "nông nghiệp đô thị", "explain": "Nông nghiệp đô thị ứng dụng thủy canh, khí canh, tưới tự động trên diện tích nhỏ trong đô thị là xu hướng đang phát triển.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Thuật ngữ 'nông nghiệp thông minh' thường gắn với yếu tố nào sau đây?", "answer": "A", "explain": "Nông nghiệp thông minh là ứng dụng cảm biến, IoT, dữ liệu lớn, AI để giám sát và điều khiển sản xuất chính xác, kịp thời.", "points": 0.25, "options": ["A. Ứng dụng cảm biến, IoT, dữ liệu lớn và trí tuệ nhân tạo để ra quyết định sản xuất chính xác.", "B. Nông dân có bằng đại học mới được làm nông nghiệp.", "C. Chỉ trồng các loại cây thông minh như cây bắt mồi.", "D. Nông nghiệp không cần sử dụng điện."]}, {"type": "mcq", "level": "NB", "q": "Trong trồng trọt công nghệ cao, công nghệ sinh học đóng vai trò gì?", "answer": "A", "explain": "Công nghệ sinh học (chọn tạo giống, công nghệ gen, nuôi cấy mô...) tạo ra giống cây trồng ưu việt, là nền tảng của trồng trọt công nghệ cao.", "points": 0.25, "options": ["A. Tạo giống cây trồng mới có năng suất cao, chất lượng tốt, chống chịu sâu bệnh.", "B. Thay thế hoàn toàn công nghệ tưới trong trồng trọt.", "C. Chỉ dùng để chế biến nông sản sau thu hoạch.", "D. Không có vai trò gì trong trồng trọt."]}, {"type": "mcq", "level": "TH", "q": "Vì sao các sản phẩm rau, quả công nghệ cao thường được bán trong siêu thị với giá cao hơn rau chợ truyền thống?", "answer": "A", "explain": "Chi phí đầu tư công nghệ, quy trình kiểm soát nghiêm ngặt và chứng nhận an toàn làm giá thành cao hơn, đổi lại người tiêu dùng được đảm bảo về chất lượng.", "points": 0.25, "options": ["A. Vì được sản xuất theo quy trình kiểm soát chặt chẽ, an toàn, có chứng nhận và truy xuất nguồn gốc nên chi phí cao hơn.", "B. Vì siêu thị tự ý nâng giá để thu lợi nhuận cao.", "C. Vì rau công nghệ cao to hơn nên nặng cân hơn.", "D. Vì người tiêu dùng thích trả tiền nhiều hơn."]}, {"type": "mcq", "level": "TH", "q": "Ý nào sau đây KHÔNG phải là xu hướng phát triển trồng trọt công nghệ cao ở Việt Nam?", "answer": "A", "explain": "Xu hướng là giảm hóa chất, sản xuất an toàn, hữu cơ, ứng dụng công nghệ — canh tác quảng canh lạm dụng thuốc hóa học đi ngược xu hướng.", "points": 0.25, "options": ["A. Mở rộng canh tác quảng canh, sử dụng ngày càng nhiều thuốc bảo vệ thực vật hóa học.", "B. Phát triển nông nghiệp hữu cơ, nông sản đạt chuẩn VietGAP, GlobalGAP.", "C. Ứng dụng tưới tiết kiệm cho cây công nghiệp ở Tây Nguyên.", "D. Hình thành các khu nông nghiệp công nghệ cao."]}, {"type": "mcq", "level": "VD", "q": "Trường học của em muốn xây dựng mô hình trồng rau thủy canh trên sân thượng để học sinh trải nghiệm. Mô hình này liên quan đến xu hướng nào?", "answer": "A", "explain": "Trồng rau thủy canh trên sân thượng là mô hình nông nghiệp đô thị điển hình, ứng dụng công nghệ cao trong không gian hạn chế.", "points": 0.25, "options": ["A. Nông nghiệp đô thị — ứng dụng công nghệ cao trên diện tích nhỏ trong đô thị.", "B. Chăn nuôi công nghệ cao.", "C. Khai thác rừng trồng.", "D. Nuôi trồng thủy sản."]}, {"type": "mcq", "level": "VDC", "q": "Một startup nông nghiệp dùng ảnh chụp từ điện thoại kết hợp AI để chẩn đoán sâu bệnh trên lá cây cà chua. Giải pháp này thể hiện đặc điểm nào của trồng trọt công nghệ cao?", "answer": "A", "explain": "AI chẩn đoán sâu bệnh qua ảnh giúp phát hiện sớm, xử lí đúng bệnh, đúng lúc — giảm phun thuốc tràn lan, đúng tinh thần công nghệ cao.", "points": 0.25, "options": ["A. Ứng dụng công nghệ hiện đại (trí tuệ nhân tạo, công nghệ thông tin) vào quản lí sâu bệnh chính xác.", "B. Thay thế hoàn toàn kiến thức của kĩ sư nông nghiệp.", "C. Chỉ mang tính quảng cáo, không có giá trị thực tiễn.", "D. Làm tăng lượng thuốc bảo vệ thực vật phải sử dụng."]}, {"type": "truefalse", "level": "VD", "q": "Một huyện miền núi muốn phát triển trồng rau công nghệ cao. Xét tính đúng, sai của các nhận định sau:", "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: trình diễn, tập huấn trước khi nhân rộng. b) Sai: ép vay vốn lớn gây rủi ro nợ nần. c) Đúng. d) Sai: có thể làm nhà màng trên đất dốc, trồng rau thủy canh...", "points": 1, "statements": ["a) Nên bắt đầu bằng việc tập huấn kĩ thuật và xây dựng mô hình trình diễn nhỏ trước khi nhân rộng.", "b) Nên ép mọi hộ dân vay vốn lớn xây nhà kính ngay lập tức.", "c) Nên thành lập hợp tác xã để liên kết sản xuất và tìm đầu ra ổn định.", "d) Địa hình miền núi thì không thể áp dụng được công nghệ cao."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về hiệu quả kinh tế:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: đầu tư phải phù hợp kĩ thuật, thị trường; đầu tư sai vẫn lỗ. d) Đúng.", "points": 1, "statements": ["a) Dù vốn đầu tư ban đầu lớn, trồng trọt công nghệ cao vẫn có thể hiệu quả nhờ năng suất cao và giá bán tốt.", "b) Tính thời gian hoàn vốn là việc cần thiết trước khi quyết định đầu tư.", "c) Cứ đầu tư càng nhiều tiền thì chắc chắn càng lãi.", "d) Có đầu ra ổn định (hợp đồng bao tiêu) giúp giảm rủi ro khi đầu tư công nghệ cao."]}, {"type": "short", "level": "VD", "q": "Giải thích ngắn gọn vì sao tưới nhỏ giọt tiết kiệm nước hơn tưới tràn.", "answer": "vì nước được đưa trực tiếp đến vùng rễ với lượng chính xác, hạn chế bốc hơi và thất thoát", "explain": "Tưới nhỏ giọt cung cấp đúng lượng nước cây cần ngay tại vùng rễ, giảm bốc hơi, thấm sâu lãng phí so với tưới tràn.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu một lợi ích của việc liên kết chuỗi giá trị trong trồng trọt công nghệ cao.", "answer": "đảm bảo đầu ra ổn định, tránh bị ép giá", "explain": "Liên kết doanh nghiệp – nông dân từ sản xuất đến tiêu thụ giúp ổn định giá, đảm bảo đầu ra và nâng cao thu nhập.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Đâu là vai trò của trồng trọt công nghệ cao đối với an ninh lương thực?", "answer": "A", "explain": "Năng suất cao, sản xuất ổn định, chủ động trước thời tiết giúp đảm bảo nguồn cung nông sản, góp phần vào an ninh lương thực.", "points": 0.25, "options": ["A. Nâng cao năng suất, sản xuất ổn định quanh năm, ít phụ thuộc thời tiết nên đảm bảo nguồn cung lương thực.", "B. Chỉ sản xuất rau hoa cao cấp, không liên quan đến lương thực.", "C. Làm giảm năng suất cây lương thực.", "D. Chỉ phục vụ xuất khẩu, không phục vụ tiêu dùng trong nước."]}, {"type": "mcq", "level": "NB", "q": "Trồng trọt công nghệ cao cần 'sản xuất tập trung, quy mô lớn' vì lí do nào?", "answer": "A", "explain": "Quy mô lớn giúp tận dụng hiệu quả vốn đầu tư công nghệ, cơ giới hóa đồng bộ và tổ chức chuỗi giá trị từ sản xuất đến tiêu thụ.", "points": 0.25, "options": ["A. Để phân bổ chi phí đầu tư công nghệ, áp dụng cơ giới hóa và liên kết chế biến, tiêu thụ hiệu quả.", "B. Vì pháp luật cấm nông hộ sản xuất nhỏ.", "C. Vì cây trồng công nghệ cao không sống được ở quy mô nhỏ.", "D. Vì chỉ quy mô lớn mới cần tưới nước."]}, {"type": "mcq", "level": "TH", "q": "Vì sao nói vốn đầu tư lớn vừa là đặc điểm vừa là thách thức của trồng trọt công nghệ cao?", "answer": "A", "explain": "Đặc điểm vốn lớn là tất yếu của công nghệ hiện đại, đồng thời là rào cản với nông hộ nhỏ — cần chính sách hỗ trợ vốn, liên kết doanh nghiệp để khắc phục.", "points": 0.25, "options": ["A. Vì công nghệ hiện đại đòi hỏi chi phí ban đầu cao, gây khó khăn cho nông hộ ít vốn dù hiệu quả lâu dài tốt.", "B. Vì vốn đầu tư lớn nhưng không mang lại lợi ích gì.", "C. Vì nhà nước không cho phép đầu tư lớn vào nông nghiệp.", "D. Vì vốn lớn chỉ dùng để mua đất, không mua được công nghệ."]}, {"type": "mcq", "level": "TH", "q": "Trong các đối tượng sau, đối tượng nào phù hợp nhất để tiếp cận trồng trọt công nghệ cao?", "answer": "A", "explain": "Hợp tác xã/doanh nghiệp có vốn, nhân lực được đào tạo và đầu ra ổn định là đối tượng phù hợp nhất để áp dụng công nghệ cao hiệu quả.", "points": 0.25, "options": ["A. Hợp tác xã, doanh nghiệp có vốn, được đào tạo kĩ thuật và liên kết thị trường.", "B. Hộ gia đình không có vốn, không được đào tạo, sản xuất manh mún.", "C. Người không có đất sản xuất nông nghiệp.", "D. Người chỉ muốn đầu tư ngắn hạn, thu lợi nhanh."]}, {"type": "mcq", "level": "VD", "q": "Một địa phương có thế mạnh du lịch sinh thái muốn kết hợp trồng rau công nghệ cao trong nhà màng để phục vụ khách tham quan và tiêu thụ tại chỗ. Mô hình này thể hiện vai trò nào?", "answer": "A", "explain": "Kết hợp nhà màng công nghệ cao với du lịch trải nghiệm vừa tạo thêm thu nhập từ du lịch, vừa tiêu thụ nông sản tại chỗ với giá tốt — nâng cao hiệu quả kinh tế.", "points": 0.25, "options": ["A. Tăng hiệu quả kinh tế nhờ kết hợp sản xuất nông nghiệp với du lịch và tiêu thụ tại chỗ.", "B. Chỉ có tác dụng trang trí, không tạo ra giá trị kinh tế.", "C. Làm giảm chất lượng nông sản.", "D. Không liên quan đến trồng trọt công nghệ cao."]}, {"type": "mcq", "level": "VDC", "q": "Đánh giá: 'Trồng trọt công nghệ cao là con đường duy nhất để nông nghiệp Việt Nam phát triển'. Nhận định này đúng hay sai, vì sao?", "answer": "A", "explain": "Công nghệ cao là hướng đi quan trọng nhưng không phải duy nhất; cần kết hợp nhiều mô hình phù hợp với điều kiện tự nhiên, kinh tế, xã hội từng vùng.", "points": 0.25, "options": ["A. Chưa hoàn toàn đúng, vì bên cạnh công nghệ cao vẫn cần các mô hình phù hợp khác (hữu cơ, nông nghiệp sinh thái...) tùy điều kiện từng vùng.", "B. Hoàn toàn đúng, vì mọi vùng đều phải áp dụng công nghệ cao ngay lập tức.", "C. Hoàn toàn sai, vì công nghệ cao không có tác dụng gì.", "D. Đúng, vì trồng trọt truyền thống phải bị xóa bỏ hoàn toàn."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về so sánh hai mô hình:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: tưới nhỏ giọt tiết kiệm nước vượt trội. b) Đúng. c) Sai: nhà màng cho năng suất cao và ổn định hơn. d) Đúng.", "points": 1, "statements": ["a) Trồng cà chua ngoài đồng tưới tràn tốn nước hơn trồng trong nhà màng tưới nhỏ giọt.", "b) Trồng trong nhà màng ít bị ảnh hưởng bởi mưa bão hơn trồng ngoài đồng.", "c) Trồng ngoài đồng luôn cho năng suất cao hơn trồng trong nhà màng.", "d) Chi phí đầu tư ban đầu của nhà màng cao hơn so với trồng ngoài đồng."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: giống tốt + kĩ thuật tốt = hiệu quả cao. c) Sai: giống tốt vẫn rất quan trọng. d) Đúng.", "points": 1, "statements": ["a) Công nghệ sinh học tạo giống mới là nền tảng quan trọng của trồng trọt công nghệ cao.", "b) Giống tốt kết hợp với công nghệ canh tác hiện đại cho hiệu quả cao nhất.", "c) Có công nghệ hiện đại thì không cần giống tốt.", "d) Nuôi cấy mô là một ứng dụng của công nghệ sinh học trong nhân giống cây trồng."]}, {"type": "short", "level": "VDC", "q": "Một hộ dân đầu tư 1 tỉ đồng làm nhà màng, mỗi năm lãi 800 triệu đồng. Hỏi sau bao lâu thì hoàn vốn? (chỉ ghi số và đơn vị thời gian)", "answer": "1,25 năm", "explain": "Thời gian hoàn vốn = vốn đầu tư / lợi nhuận mỗi năm = 1 tỉ / 800 triệu = 1,25 năm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Phân tích ngắn gọn: Vì sao thất bại của một trang trại công nghệ cao (thiếu kĩ sư, không có đầu ra) không chứng tỏ mô hình này kém hiệu quả?", "answer": "vì thất bại do thiếu đồng bộ các yếu tố (nhân lực, thị trường) chứ không phải do bản chất công nghệ", "explain": "Trồng trọt công nghệ cao cần đồng bộ vốn – công nghệ – nhân lực – thị trường; thiếu một yếu tố có thể thất bại, nhưng nhiều mô hình khác vẫn thành công.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Cụm từ nào điền đúng vào chỗ trống: 'Trồng trọt công nghệ cao giúp ... tài nguyên đất, nước nhờ tưới tiết kiệm và bón phân chính xác'?", "answer": "A", "explain": "Nhờ tưới tiết kiệm và bón phân chính xác, trồng trọt công nghệ cao giúp sử dụng hiệu quả tài nguyên đất, nước.", "points": 0.25, "options": ["A. sử dụng hiệu quả", "B. khai thác cạn kiệt", "C. lãng phí", "D. bỏ hoang"]}, {"type": "mcq", "level": "NB", "q": "Trong các công nghệ sau, công nghệ nào KHÔNG thuộc nhóm công nghệ cao trong trồng trọt?", "answer": "A", "explain": "Cày bừa bằng trâu kéo là phương thức truyền thống; các phương án còn lại đều là công nghệ hiện đại.", "points": 0.25, "options": ["A. Cày bừa bằng trâu kéo theo kinh nghiệm dân gian.", "B. Hệ thống tưới nhỏ giọt tự động.", "C. Cảm biến độ ẩm đất kết nối internet.", "D. Nhà kính điều khiển khí hậu tự động."]}, {"type": "mcq", "level": "TH", "q": "Vì sao nông sản công nghệ cao có khả năng cạnh tranh tốt trên thị trường xuất khẩu?", "answer": "A", "explain": "Thị trường xuất khẩu yêu cầu cao về chất lượng, an toàn, truy xuất nguồn gốc — đúng thế mạnh của nông sản công nghệ cao.", "points": 0.25, "options": ["A. Vì chất lượng đồng đều, an toàn, đáp ứng các tiêu chuẩn khắt khe của thị trường nhập khẩu.", "B. Vì giá luôn rẻ hơn mọi đối thủ.", "C. Vì không cần qua kiểm dịch thực vật.", "D. Vì được trợ giá vận chuyển quốc tế."]}, {"type": "mcq", "level": "TH", "q": "Một nông dân nói: 'Trồng rau trong nhà màng tốn tiền đầu tư nhưng được mùa, ít lo sâu bệnh, bán giá cao'. Câu nói phản ánh đúng nội dung nào?", "answer": "A", "explain": "Câu nói nêu đúng: vốn đầu tư lớn (đặc điểm) nhưng bù lại năng suất ổn định, ít sâu bệnh, giá bán cao (vai trò).", "points": 0.25, "options": ["A. Phản ánh cả đặc điểm (vốn đầu tư lớn) và vai trò (năng suất ổn định, hiệu quả kinh tế) của trồng trọt công nghệ cao.", "B. Phản ánh nhược điểm không thể khắc phục của nhà màng.", "C. Chứng tỏ nhà màng không phù hợp với nông dân.", "D. Chứng tỏ trồng rau nhà màng luôn bị lỗ."]}, {"type": "mcq", "level": "VD", "q": "Địa phương em có nhiều hộ trồng rau nhưng hay bị thương lái ép giá. Áp dụng mô hình nào của trồng trọt công nghệ cao giúp khắc phục?", "answer": "A", "explain": "Liên kết chuỗi giá trị với chứng nhận an toàn và hợp đồng bao tiêu giúp nông dân chủ động về giá và đầu ra, tránh bị ép giá.", "points": 0.25, "options": ["A. Liên kết chuỗi giá trị: hợp tác xã sản xuất rau an toàn, có chứng nhận, ký hợp đồng bao tiêu với siêu thị, doanh nghiệp.", "B. Tiếp tục bán lẻ manh mún cho thương lái như cũ.", "C. Ngừng trồng rau, chuyển sang trồng cây dại.", "D. Tăng diện tích nhưng vẫn sản xuất nhỏ lẻ, không chứng nhận."]}, {"type": "mcq", "level": "VDC", "q": "Phân tích chi phí – lợi ích: Đầu tư 1 tỉ đồng cho 1 ha nhà màng trồng dưa lưới, mỗi năm thu 2 vụ, mỗi vụ lãi 400 triệu đồng. Sau bao lâu thì hoàn vốn (chưa tính khấu hao)?", "answer": "A", "explain": "Mỗi năm lãi 2 vụ x 400 triệu = 800 triệu đồng; 1 tỉ / 800 triệu = 1,25 năm thì hoàn vốn đầu tư ban đầu.", "points": 0.25, "options": ["A. Khoảng 1,25 năm (mỗi năm lãi 800 triệu đồng).", "B. Khoảng 5 năm.", "C. Khoảng 10 năm.", "D. Không bao giờ hoàn vốn."]}, {"type": "truefalse", "level": "VDC", "q": "Phân tích tình huống: Công ty X đầu tư nhà kính trồng cà chua công nghệ Israel nhưng thua lỗ do không tìm được đầu ra và thiếu kĩ sư vận hành. Xét tính đúng, sai:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: công nghệ cao cần đồng bộ vốn – nhân lực – thị trường. b) Đúng. c) Sai: một thất bại cụ thể không phủ nhận cả mô hình. d) Đúng.", "points": 1, "statements": ["a) Thất bại cho thấy chỉ có vốn và công nghệ hiện đại là chưa đủ, cần cả nhân lực và thị trường.", "b) Nguyên nhân thua lỗ liên quan đến việc thiếu lao động có trình độ và đầu ra ổn định.", "c) Trường hợp này chứng tỏ trồng trọt công nghệ cao không bao giờ hiệu quả.", "d) Bài học rút ra là cần liên kết chuỗi giá trị từ sản xuất đến tiêu thụ."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các nhận định tổng hợp sau:", "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: cần phù hợp điều kiện, đi từ thấp đến cao. c) Đúng: kết hợp tạo mô hình bền vững. d) Sai: nhân lực là yếu tố then chốt.", "points": 1, "statements": ["a) Trồng trọt công nghệ cao là hướng đi tất yếu nhưng cần lộ trình phù hợp với điều kiện từng vùng.", "b) Mọi vùng, mọi hộ nông dân đều phải áp dụng ngay mô hình nhà kính hiện đại nhất.", "c) Kết hợp công nghệ cao với nông nghiệp hữu cơ, sinh thái có thể tạo ra mô hình bền vững.", "d) Phát triển công nghệ cao không cần quan tâm đến đào tạo nhân lực nông thôn."]}, {"type": "short", "level": "VDC", "q": "Nêu một bài học cho địa phương muốn nhân rộng mô hình trồng rau công nghệ cao.", "answer": "tập huấn kĩ thuật và xây mô hình trình diễn trước khi nhân rộng", "explain": "Cần đào tạo nhân lực, làm mô hình trình diễn, hỗ trợ vốn và đảm bảo đầu ra; không nên ép nông dân đầu tư ồ ạt khi chưa đủ điều kiện.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao nói trồng trọt công nghệ cao là hướng đi tất yếu nhưng không phải là con đường duy nhất?", "answer": "vì cần kết hợp nhiều mô hình phù hợp điều kiện từng vùng như hữu cơ, sinh thái", "explain": "Công nghệ cao quan trọng nhưng phải phù hợp điều kiện tự nhiên, kinh tế từng vùng; các mô hình hữu cơ, sinh thái cũng có vai trò riêng.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Đâu là biểu hiện của 'sản xuất tập trung, quy mô lớn' trong trồng trọt công nghệ cao?", "answer": "A", "explain": "Vùng chuyên canh quy mô lớn với hạ tầng công nghệ đồng bộ là biểu hiện của sản xuất tập trung.", "points": 0.25, "options": ["A. Vùng chuyên canh rau hàng trăm héc-ta với hệ thống nhà màng, tưới tự động đồng bộ.", "B. Mỗi hộ trồng một loại rau khác nhau trên mảnh vườn nhỏ, tự bán lẻ.", "C. Trồng xen canh tự phát không theo quy hoạch.", "D. Để đất trống, chỉ trồng khi giá cao."]}, {"type": "mcq", "level": "NB", "q": "Yếu tố nào sau đây là sản phẩm của công nghệ thông tin trong trồng trọt công nghệ cao?", "answer": "A", "explain": "Phần mềm quản lí, bản đồ số, cảnh báo sâu bệnh qua điện thoại là ứng dụng công nghệ thông tin trong trồng trọt.", "points": 0.25, "options": ["A. Phần mềm quản lí trang trại, bản đồ số đồng ruộng, hệ thống cảnh báo sâu bệnh qua điện thoại.", "B. Giống lúa lai mới.", "C. Máy cày công suất lớn.", "D. Phân bón lá hữu cơ."]}, {"type": "mcq", "level": "TH", "q": "Vì sao Đà Lạt (Lâm Đồng) trở thành trung tâm rau, hoa công nghệ cao của cả nước?", "answer": "A", "explain": "Đà Lạt có khí hậu ôn hòa quanh năm rất hợp rau, hoa ôn đới; đồng thời là nơi đi đầu cả nước về nhà kính, nhà màng và công nghệ cao.", "points": 0.25, "options": ["A. Vì có khí hậu mát mẻ thuận lợi kết hợp với việc sớm đầu tư nhà kính, nhà màng và công nghệ hiện đại.", "B. Vì Đà Lạt là nơi duy nhất có đất để trồng rau.", "C. Vì ở Đà Lạt không cần áp dụng công nghệ gì.", "D. Vì Đà Lạt cấm trồng trọt truyền thống."]}, {"type": "mcq", "level": "TH", "q": "Nhận định nào sau đây sai về trồng trọt công nghệ cao?", "answer": "A", "explain": "Bảo vệ môi trường (tiết kiệm tài nguyên, giảm hóa chất) là một trong những vai trò quan trọng của trồng trọt công nghệ cao.", "points": 0.25, "options": ["A. Trồng trọt công nghệ cao không cần quan tâm đến bảo vệ môi trường.", "B. Trồng trọt công nghệ cao giúp nâng cao năng suất, chất lượng nông sản.", "C. Trồng trọt công nghệ cao đòi hỏi vốn đầu tư lớn.", "D. Trồng trọt công nghệ cao cần lao động có trình độ."]}, {"type": "mcq", "level": "VD", "q": "Hợp tác xã rau an toàn của xã em muốn mở rộng thị trường ra siêu thị ở thành phố. Theo em, điều kiện quan trọng nhất là gì?", "answer": "A", "explain": "Siêu thị yêu cầu chứng nhận an toàn, chất lượng ổn định, truy xuất nguồn gốc và nguồn cung đều đặn — đúng chuẩn của trồng trọt công nghệ cao.", "points": 0.25, "options": ["A. Sản phẩm đạt chứng nhận an toàn (VietGAP...), chất lượng ổn định, truy xuất được nguồn gốc và đảm bảo sản lượng đều đặn.", "B. Chỉ cần rau trông đẹp mắt là đủ.", "C. Giảm giá bán xuống thật thấp bất kể chất lượng.", "D. Chỉ cần quen biết với quản lí siêu thị."]}, {"type": "mcq", "level": "VDC", "q": "Tổng hợp: Một bài thuyết trình về trồng trọt công nghệ cao cần có những nội dung chính nào?", "answer": "A", "explain": "Bài thuyết trình đầy đủ cần: khái niệm (là gì), đặc điểm (như thế nào), vai trò (ý nghĩa gì) và xu hướng phát triển ở Việt Nam.", "points": 0.25, "options": ["A. Khái niệm, đặc điểm, vai trò và xu hướng phát triển ở Việt Nam.", "B. Chỉ cần nêu tên các loại máy móc.", "C. Chỉ cần kể tên các loại cây trồng.", "D. Chỉ cần nêu giá bán nông sản."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về chiến lược phát triển:", "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cần đổi mới tư duy, học kĩ thuật mới. d) Đúng.", "points": 1, "statements": ["a) Nhà nước hỗ trợ vốn, đào tạo và xây dựng khu nông nghiệp công nghệ cao sẽ thúc đẩy phong trào.", "b) Doanh nghiệp đầu tư vào nông nghiệp công nghệ cao vì nông sản sạch có thị trường và lợi nhuận bền vững.", "c) Nông dân không cần thay đổi tư duy khi chuyển sang sản xuất công nghệ cao.", "d) Truy xuất nguồn gốc bằng công nghệ số giúp nâng cao niềm tin của người tiêu dùng."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp chương):", "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: CNTT, IoT, AI là bộ phận quan trọng. c) Đúng. d) Đúng.", "points": 1, "statements": ["a) Khái niệm, đặc điểm, vai trò và xu hướng là bốn nội dung chính khi tìm hiểu về trồng trọt công nghệ cao.", "b) Trồng trọt công nghệ cao chỉ bao gồm việc xây nhà kính, không liên quan đến công nghệ thông tin.", "c) Tiết kiệm tài nguyên và bảo vệ môi trường là vai trò quan trọng của trồng trọt công nghệ cao.", "d) Việt Nam đang phát triển trồng trọt công nghệ cao theo hướng an toàn, thông minh và liên kết chuỗi."]}, {"type": "short", "level": "VDC", "q": "Trình bày ngắn gọn mối quan hệ giữa trồng trọt công nghệ cao và phát triển bền vững.", "answer": "công nghệ cao tiết kiệm tài nguyên, giảm ô nhiễm, thích ứng biến đổi khí hậu nên hướng tới phát triển bền vững", "explain": "Nhờ sử dụng hiệu quả tài nguyên, giảm hóa chất thải ra môi trường và chủ động ứng phó biến đổi khí hậu, trồng trọt công nghệ cao là hướng đi của nông nghiệp bền vững.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai nội dung chính cần có khi thuyết trình về trồng trọt công nghệ cao. (ghi cách nhau bằng dấu chấm phẩy)", "answer": "khái niệm; đặc điểm", "explain": "Bài thuyết trình đầy đủ gồm: khái niệm, đặc điểm, vai trò và xu hướng phát triển ở Việt Nam (nêu hai trong bốn nội dung đều được chấp nhận).", "points": 0.5}]}]}
