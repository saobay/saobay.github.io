. Đất sét nặng nguyên chất", "C. Cát khô nguyên chất", "D. Đá sỏi to"], "answer": "A", "explain": "Phối trộn phát huy ưu điểm mỗi loại: xơ dừa giữ nước, trấu hun thoáng, hữu cơ dinh dưỡng — giá thể ươm lí tưởng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giá thể là vật liệu thay đất để trồng cây.", "b) Xơ dừa nhẹ, giữ nước tốt, rẻ tiền.", "c) Giá thể phải sạch mầm bệnh, không độc hại.", "d) Trấu hun sạch bệnh, thoáng khí, giàu kali."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về xử lí giá thể:", "statements": ["a) Xơ dừa cần ngâm, xả chát trước khi dùng.", "b) Trấu hun đã sạch mầm bệnh nhờ quá trình đốt.", "c) Có thể dùng ngay xơ dừa thô chưa xử lí để ươm cây con.", "d) Phối trộn nhiều loại giá thể giúp phát huy ưu điểm mỗi loại."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: xơ dừa thô chứa tanin gây hại rễ non.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên bốn loại giá thể phổ biến và ưu điểm nổi bật mỗi loại.", "answer": "Xơ dừa (giữ nước), trấu hun (thoáng, sạch bệnh), than bùn (giàu hữu cơ), perlite (nhẹ, thoáng)", "explain": "Xơ dừa giữ nước; trấu hun thoáng sạch bệnh; than bùn giàu hữu cơ; perlite nhẹ thoáng; vermiculite giữ nước, giữ phân.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai ứng dụng của giá thể trong nông nghiệp đô thị.", "answer": "Trồng rau sân thượng bằng thùng xốp; trồng hoa chậu ban công (chấp nhận: rau mầm, thủy canh tại nhà)", "explain": "Giá thể nhẹ, sạch phù hợp không gian hẹp: rau thùng xốp sân thượng, hoa chậu, rau mầm trong nhà.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Perlite (đá trân châu) có đặc điểm gì?", "options": ["A. Rất nhẹ, thoáng khí, sạch, làm từ đá núi lửa nung nở", "B. Nặng như đá thường", "C. Giữ nước kém  định sau:", "statements": ["a) Perlite nhẹ, thoáng khí, làm từ đá núi lửa nung nở.", "b) Vermiculite giữ nước và giữ dinh dưỡng tốt.", "c) Lan trồng trên vỏ thông, than củi vì rễ cần thoáng khí.", "d) pH giá thể phù hợp khoảng 5,5–6,5."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về giá thể trồng lan:", "statements": ["a) Vỏ thông tơi xốp, bền, phù hợp trồng lan.", "b) Than củi sạch, thoáng, lâu mục.", "c) Dớn (rêu) giữ ẩm tốt cho lan.", "d) Nên trồng lan trong đất sét nặng bí chặt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đất sét bí chặt làm thối rễ lan.", "points": 1}, {"type": "short", "level": "VDC", "q": "Phân biệt perlite và vermiculite về khả năng giữ nước.", "answer": "Perlite thoáng khí, giữ nước vừa phải; vermiculite giữ nước và giữ phân tốt hơn", "explain": "Perlite thiên về thoáng khí; vermiculite thiên về giữ nước, giữ dinh dưỡng — thường phối hợp cả hai.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai lí do người thành phố ưa dùng giá thể trồng rau sân thượng.", "answer": "Nhẹ, dễ vận chuyển lên cao; sạch, ít sâu bệnh (chấp nhận: không cần đất, dễ thay)", "explain": "Giá thể nhẹ hơn đất nhiều, sạch bệnh, dễ phối trộn — phù hợp ban công, sân thượng.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Than bùn có nguồn gốc từ đâu?", "options": ["A. Thực vật phân hủy trong đầm lầy qua thời gian dài", "B. Than đá khai thác ở mỏ", "C. Tro bếp", "D. Xi măng"], "answer": "A", "explain": "Than bùn hình thành từ xác thực vật phân hủy yếm khí ở đầm lầy — giàu hữu cơ, giữ nước tốt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong thủy canh, giá thể có vai trò gì?", "options": ["A. Giữ cây đứng vững trong hệ thống dung dịch dinh dưỡng", "B. Thay thế hoàn toàn dung dịch dinh dưỡng", "C. Không có vai trò", "D. Làm thức ăn cho cây"], "answer": "A", "explain": "Thủy canh cây sống nhờ dung dịch; giá thể (mút xốp, xơ dừa) chỉ để cố định, giữ cây đứng vững.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mùn cưa, vỏ cây được dùng làm giá thể cho loại cây nào?", "options": ["A. Hoa lan, hoa chậu", "B. Lúa nước", "C. Ngô đồng", "D. Mía"], "answer": "A", "explain": "Mùn cưa, vỏ thông tơi xốp, rẻ — phổ biến trồng lan, hoa chậu cảnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao giá thể cần có độ bền, khó phân hủy trong thời gian trồng?", "options": ["A. Vì giá thể nhanh mục sẽ bị nén chặt, thiếu khí, phải thay thường xuyên", "B. Vì giá thể bền làm cây chết", "C. Vì không quan trọng", "D. Vì giá thể mục tốt hơn"], "answer": "A", "explain": "Giá thể mục nhanh xẹp, bí chặt, thối rễ — cần bền để duy trì cấu trúc suốt vụ trồng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ưu điểm của viên nén xơ dừa trong ươm cây con là gì?", "options": ["A. Gọn nhẹ, rễ không bị tổn thương khi đem trồng", "B. Rất nặng", "C. Chứa mầm bệnh", "D. Không giữ nước"], "answer": "A", "explain": "Viên nén nở ra khi ngâm nước; trồng cả viên xuống đất — rễ nguyên vẹn, cây bén nhanh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một trang trại rau mầm dùng xơ dừa chưa xử lí, cây con bị cháy rễ hàng loạt. Nguyên nhân và cách khắc phục?", "options": ["A. Tanin trong xơ dừa thô gây hại; phải ngâm, xả chát kĩ trước khi dùng", "B. Do tưới quá ít; tưới thêm", "C. Do thiếu ánh sáng; che thêm", "D. Do giống kém; đổi giống"], "answer": "A", "explain": "Xơ dừa thô chứa tanin, muối gây cháy rễ non — bắt buộc xử lí chát (ngâm, xả nhiều lần).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Than bùn giàu hữu cơ, giữ nước tốt.", "b) Trong thủy canh, giá thể giúp cố định cây.", "c) Mùn cưa, vỏ cây dùng trồng lan, hoa chậu.", "d) Giá thể cần bền để duy trì cấu trúc lâu dài."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về viên nén xơ dừa:", "statements": ["a) Viên nén gọn nhẹ, tiện vận chuyển.", "b) Trồng cả viên giúp rễ không bị tổn thương.", "c) Viên nén đã được xử lí chát trước khi đóng gói.", "d) Viên nén chỉ dùng để xây dựng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: viên nén dùng ươm cây con.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai ưu điểm của than bùn làm giá thể.", "answer": "Giàu hữu cơ; giữ nước và giữ phân tốt (chấp nhận: tơi xốp)", "explain": "Than bùn: hữu cơ cao, giữ ẩm, giữ dinh dưỡng tốt — lí tưởng ươm cây, hoa chậu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích vì sao giá thể nhanh mục gây hại cho cây trồng chậu.", "answer": "Giá thể xẹp, nén chặt, thiếu khí, úng thối rễ; phải thay thường xuyên (chấp nhận ý tương đương)", "explain": "Mục nhanh làm mất cấu trúc xốp, bí khí, giữ nước quá mức — thối rễ, cây suy.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Dớn (rêu) được dùng làm giá thể chủ yếu cho cây nào?", "options": ["A. Hoa lan", "B. Lúa", "C. Ngô", "D. Sắn"], "answer": "A", "explain": "Dớn là rêu giữ ẩm tốt, sạch — quấn gốc lan, ươm lan con phổ biến.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giá thể tốt cần có đặc điểm nào về khối lượng?", "options": ["A. Nhẹ để dễ vận chuyển, thay chậu", "B. Càng nặng càng tốt", "C. Nặng như đá", "D. Không quan trọng"], "answer": "A", "explain": "Nhẹ giúp vận chuyển, thay chậu dễ dàng — quan trọng với nông nghiệp đô thị, nhà kính.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trấu hun được tạo ra bằng cách nào?", "options": ["A. Đốt vỏ trấu trong điều kiện yếm khí (thiếu ôxi)", "B. Đốt trấu cháy hoàn toàn thành tro", "C. Ngâm trấu trong nước", "D. Phơi trấu ngoài nắng"], "answer": "A", "explain": "Hun yếm khí: trấu cháy dở thành than hun xốp, giữ được kali, silic; cháy hoàn toàn thành tro mất tác dụng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không nên dùng đất vườn trực tiếp để ươm cây con trong khay?", "options": ["A. Vì đất vườn nặng, dễ nén chặt và có thể mang mầm bệnh", "B. Vì đất vườn quá tốt", "C. Vì đất vườn quá rẻ", "D. Vì không có lí do"], "answer": "A", "explain": "Đất vườn trong khay nhỏ dễ bí chặt, mang nấm bệnh — giá thể sạch, xốp cho cây con khỏe hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi phối trộn giá thể, nguyên tắc cơ bản là gì?", "options": ["A. Kết hợp loại giữ nước với loại thoáng khí và nguồn dinh dưỡng", "B. Trộn càng nhiều loại càng tốt không cần tỉ lệ", "C. Chỉ dùng một loại duy nhất", "D. Trộn bừa bãi"], "answer": "A", "explain": "Phối trộn cân bằng: giữ nước (xơ dừa) + thoáng (trấu hun, perlite) + dinh dưỡng (hữu cơ) — theo tỉ lệ phù hợp.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một hộ trồng hoa hồng chậu dùng toàn đất sét nặng, cây còi cọc, úng rễ. Nên thay bằng giá thể nào?", "options": ["A. Hỗn hợp than bùn + trấu hun + perlite tơi xốp, thoát nước tốt", "B. Tiếp tục dùng đất sét", "C. Dùng cát khô nguyên chất", "D. Dùng sỏi to"], "answer": "A", "explain": "Hoa chậu cần tơi xốp, thoát nước: than bùn giữ ẩm, trấu hun + perlite thoáng — khắc phục úng bí của đất sét.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dớn là giá thể giữ ẩm tốt cho hoa lan.", "b) Giá thể nên nhẹ để dễ vận chuyển.", "c) Trấu hun được tạo bằng cách đốt yếm khí vỏ trấu.", "d) Đất vườn mang mầm bệnh nên hạn chế dùng ươm cây con."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về phối trộn giá thể:", "statements": ["a) Nên kết hợp loại giữ nước với loại thoáng khí.", "b) Cần bổ sung nguồn dinh dưỡng (phân hữu cơ) khi phối trộn.", "c) Tỉ lệ phối trộn cần phù hợp từng loại cây.", "d) Trộn bừa bãi không theo tỉ lệ vẫn cho kết quả tốt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần tỉ lệ phù hợp, trộn bừa dễ bí hoặc khô.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai lí do nên dùng giá thể thay đất vườn khi ươm cây con.", "answer": "Sạch mầm bệnh; tơi xốp, nhẹ (chấp nhận: giữ nước tốt, rễ phát triển mạnh)", "explain": "Giá thể sạch bệnh, xốp nhẹ — cây con khỏe, rễ phát triển tốt, tỉ lệ sống cao.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao trấu hun tốt hơn tro trấu khi làm giá thể?", "answer": "Trấu hun còn cấu trúc xốp, giàu kali, silic; tro mịn, dễ bí, mất chất (chấp nhận ý tương đương)", "explain": "Hun yếm khí giữ cấu trúc xốp và khoáng; cháy hoàn toàn thành tro mịn dễ nén chặt, mất kali.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Giá thể trồng cây khác đất trồng ở điểm cơ bản nào?", "options": ["A. Giá thể là vật liệu thay thế hoặc phối trộn với đất, thường nhẹ và sạch hơn", "B. Giá thể chính là đất sét", "C. Không có điểm khác", "D. Giá thể không trồng được cây"], "answer": "A", "explain": "Giá thể thay thế đất trong các mô hình không dùng đất (thủy canh, chậu, đô thị) — nhẹ, sạch, chủ động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Loại giá thể nào sau đây có nguồn gốc nhân tạo (khoáng nung nở)?", "options": ["A. Perlite và vermiculite", "B. Xơ dừa", "C. Trấu hun", "D. Vỏ thông"], "answer": "A", "explain": "Perlite, vermiculite là khoáng nung ở nhiệt độ cao cho nở xốp — nguồn gốc khoáng, chế biến công nghiệp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Rau mầm thường được trồng trên giá thể nào?", "options": ["A. Xơ dừa, giấy thấm", "B. Đất sét nặng", "C. Đá sỏi", "D. Xi măng"], "answer": "A", "explain": "Rau mầm thu hoạch sau 7–10 ngày, chỉ cần ẩm: xơ dừa, khăn giấy là đủ, sạch, tiện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao giá thể trồng rau mầm không cần nhiều dinh dưỡng?", "options": ["A. Vì rau mầm dùng dinh dưỡng dự trữ trong hạt, thu hoạch rất sớm", "B. Vì rau mầm không cần dinh dưỡng", "C. Vì giá thể tự sinh dinh dưỡng", "D. Vì rau mầm là cây dại"], "answer": "A", "explain": "Hạt chứa đủ dinh dưỡng nuôi mầm 7–10 ngày; thu hoạch sớm nên giá thể chỉ cần giữ ẩm, sạch.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhược điểm của xơ dừa nếu không xử lí là gì?", "options": ["A. Chứa tanin, muối gây cháy rễ và có thể giữ nước quá nhiều", "B. Quá nhẹ", "C. Quá rẻ", "D. Không có nhược điểm"], "answer": "A", "explain": "Xơ dừa thô: tanin, muối gây độc rễ non; giữ nước mạnh dễ úng nếu không phối trộn thoáng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một trường học muốn tổ chức cho học sinh trồng rau mầm. Chuẩn bị nào đơn giản, an toàn nhất?", "options": ["A. Khay + xơ dừa đã xử lí (hoặc khăn giấy), hạt giống, bình tưới phun sương", "B. Đào đất vườn đổ vào lớp học", "C. Dùng đất sét nặng", "D. Dùng hóa chất kích thích"], "answer": "A", "explain": "Rau mầm trên xơ dừa/khăn giấy: sạch, đơn giản, an toàn, 7–10 ngày thu hoạch — phù hợp học sinh.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giá thể nhẹ và sạch hơn đất vườn thông thường.", "b) Perlite, vermiculite có nguồn gốc khoáng nung nở.", "c) Rau mầm thường trồng trên xơ dừa.", "d) Rau mầm dùng dinh dưỡng dự trữ trong hạt."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về trồng rau mầm ở trường học:", "statements": ["a) Nên dùng xơ dừa đã xử lí hoặc khăn giấy sạch.", "b) Cần bình tưới phun sương giữ ẩm.", "c) Thu hoạch sau khoảng 7–10 ngày.", "d) Nên dùng đất sét nặng bí chặt để trồng rau mầm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đất sét bí chặt, có thể mang mầm bệnh.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai ưu điểm của perlite khi phối trộn giá thể.", "answer": "Nhẹ, thoáng khí; chống nén chặt giá thể (chấp nhận: sạch, bền)", "explain": "Perlite xốp nhẹ, tạo độ thoáng, ngăn giá thể bị nén theo thời gian.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao rau mầm là mô hình phù hợp để học sinh thực hành trồng trọt?", "answer": "Nhanh thu hoạch, đơn giản, sạch, an toàn (chấp nhận ý tương đương)", "explain": "7–10 ngày thu hoạch, không cần đất, ít sâu bệnh — học sinh dễ thực hành, hứng thú.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Giá thể nào sau đây giàu chất hữu cơ nhất?", "options": ["A. Than bùn", "B. Perlite", "C. Cát thạch anh", "D. Sỏi"], "answer": "A", "explain": "Than bùn từ thực vật phân hủy — giàu hữu cơ nhất trong các giá thể, giữ nước, giữ phân tốt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các giá thể sau, loại nào nhẹ nhất?", "options": ["A. Perlite", "B. Đất thịt", "C. Cát", "D. Sỏi"], "answer": "A", "explain": "Perlite nở xốp như bọt biển, rất nhẹ — nhẹ hơn hẳn đất, cát, sỏi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hoa chậu trồng bằng giá thể có lợi gì so với trồng bằng đất vườn?", "options": ["A. Nhẹ, sạch bệnh, dễ thay chậu, chủ động dinh dưỡng", "B. Nặng hơn", "C. Nhiều sâu bệnh hơn", "D. Không lợi gì"], "answer": "A", "explain": "Giá thể nhẹ dễ di chuyển chậu, sạch bệnh, phối trộn chủ động — phù hợp cây cảnh đô thị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao than bùn thường được trộn thêm perlite khi trồng hoa chậu?", "options": ["A. Vì than bùn giữ nước mạnh, thêm perlite tăng thoáng khí, chống úng", "B. Vì perlite làm than bùn nặng hơn", "C. Vì không có lí do", "D. Vì perlite diệt than bùn"], "answer": "A", "explain": "Than bùn giữ nước quá mức dễ úng; perlite tạo độ xốp thoáng — cân bằng ẩm, khí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giá thể trồng cây cần được thay mới khi nào?", "options": ["A. Khi bị mục nát, nén chặt, nhiễm bệnh hoặc hết dinh dưỡng", "B. Không bao giờ cần thay", "C. Mỗi ngày thay một lần", "D. Khi cây ra hoa"], "answer": "A", "explain": "Giá thể mục, bí chặt, nhiễm bệnh thì mất tác dụng — cần thay để cây khỏe.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một cửa hàng bán giá thể trộn sẵn ghi 'xơ dừa + trấu hun + phân trùn quế'. Đánh giá nào đúng?", "options": ["A. Công thức hợp lí: giữ nước + thoáng + dinh dưỡng hữu cơ", "B. Công thức sai hoàn toàn", "C. Thiếu cát nên không dùng được", "D. Chỉ dùng cho xây dựng"], "answer": "A", "explain": "Xơ dừa giữ nước, trấu hun thoáng sạch, phân trùn quế dinh dưỡng — phối trộn cân đối, dùng ngay được.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Than bùn giàu hữu cơ nhất trong các giá thể.", "b) Perlite là giá thể rất nhẹ.", "c) Giá thể giúp hoa chậu nhẹ, sạch bệnh, dễ chăm sóc.", "d) Trộn perlite vào than bùn giúp tăng thoáng khí."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về thay giá thể:", "statements": ["a) Giá thể mục nát, nén chặt cần được thay mới.", "b) Giá thể nhiễm bệnh cần thay để tránh lây lan.", "c) Giá thể hết dinh dưỡng có thể bổ sung phân thay vì thay mới.", "d) Giá thể tốt thì không bao giờ cần thay."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: giá thể cũng có tuổi thọ, cần thay khi suy giảm chất lượng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai dấu hiệu cho thấy giá thể trồng chậu cần được thay mới.", "answer": "Mục nát, nén chặt; nhiễm bệnh, cây còi cọc (chấp nhận: thoát nước kém, có mùi hôi)", "explain": "Giá thể xẹp, bí, thối, cây vàng úa dù chăm sóc tốt — dấu hiệu cần thay.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích công thức giá thể 'xơ dừa + trấu hun + phân trùn quế'.", "answer": "Xơ dừa giữ nước, trấu hun thoáng sạch bệnh, phân trùn quế cung cấp dinh dưỡng", "explain": "Mỗi thành phần một vai trò: ẩm – khí – dinh dưỡng — phối trộn cân đối.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Giá thể trồng lan nào sau đây bền nhất, lâu mục nhất?", "options": ["A. Than củi", "B. Giấy báo", "C. Vải vụn", "D. Xốp mỏng"], "answer": "A", "explain": "Than củi cứng, khó phân hủy, dùng được nhiều năm — bền nhất trong các giá thể lan.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nông nghiệp đô thị là gì?", "options": ["A. Trồng trọt, chăn nuôi trong không gian đô thị (sân thượng, ban công)", "B. Nông nghiệp ở nông thôn", "C. Công nghiệp trong thành phố", "D. Du lịch đô thị"], "answer": "A", "explain": "Nông nghiệp đô thị tận dụng sân thượng, ban công, nhà kính trong thành phố — giá thể là giải pháp chính.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Yếu tố nào quyết định việc chọn loại giá thể cho từng cây?", "options": ["A. Đặc điểm rễ và nhu cầu nước, dinh dưỡng của cây", "B. Màu sắc giá thể", "C. Giá tiền cao nhất", "D. Sở thích ngẫu nhiên"], "answer": "A", "explain": "Lan cần thoáng (vỏ thông), rau mầm cần ẩm (xơ dừa) — chọn theo nhu cầu sinh lí cây.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao giá thể phải có khả năng giữ dinh dưỡng?", "options": ["A. Vì cây trồng chậu, thủy canh phụ thuộc hoàn toàn vào dinh dưỡng trong giá thể", "B. Vì dinh dưỡng không quan trọng", "C. Vì cây tự tạo dinh dưỡng", "D. Vì không cần bón phân"], "answer": "A", "explain": "Không có đất dự trữ, cây chậu chỉ hút dinh dưỡng từ giá thể — giữ phân tốt giúp cây no đều.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh trồng rau bằng đất và bằng giá thể trên sân thượng, ưu điểm của giá thể là gì?", "options": ["A. Nhẹ, sạch, chủ động, không lo úng bí như đất nặng", "B. Nặng hơn đất", "C. Rẻ hơn đất vườn", "D. Không cần tưới nước"], "answer": "A", "explain": "Sân thượng chịu tải hạn chế — giá thể nhẹ hơn đất nhiều, sạch bệnh, dễ quản lí.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một người trồng dâu tây chậu trên sân thượng. Giá thể nào phù hợp nhất?", "options": ["A. Than bùn + perlite + xơ dừa: tơi xốp, giữ ẩm vừa phải, thoát nước tốt", "B. Đất sét nặng nguyên chất", "C. Cát khô nguyên chất", "D. Sỏi to"], "answer": "A", "explain": "Dâu tây sợ úng: cần tơi xốp, thoát nước tốt nhưng giữ ẩm — hỗn hợp than bùn, perlite, xơ dừa lí tưởng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Than củi là giá thể lan bền, lâu mục.", "b) Nông nghiệp đô thị tận dụng sân thượng, ban công.", "c) Chọn giá thể căn cứ nhu cầu của cây trồng.", "d) Cây trồng chậu phụ thuộc dinh dưỡng trong giá thể."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về trồng dâu tây chậu:", "statements": ["a) Dâu tây sợ úng nên giá thể phải thoát nước tốt.", "b) Hỗn hợp than bùn, perlite, xơ dừa phù hợp.", "c) Nên dùng đất sét nặng bí chặt.", "d) Giá thể nhẹ phù hợp với sân thượng."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: đất sét bí chặt gây úng thối rễ dâu tây.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai đặc điểm của rễ lan khiến giá thể trồng lan phải thật thoáng khí.", "answer": "Rễ khí sinh, cần ôxi; úng dễ thối rễ (chấp nhận ý tương đương)", "explain": "Lan phụ sinh, rễ cần thoáng; giá thể bí gây úng thối — nên dùng vỏ thông, than, dớn.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao sân thượng phù hợp trồng rau bằng giá thể hơn bằng đất?", "answer": "Giá thể nhẹ, chịu tải tốt; sạch, dễ quản lí (chấp nhận ý tương đương)", "explain": "Sàn sân thượng chịu tải hạn chế; đất nặng, dễ úng — giá thể nhẹ, sạch, chủ động hơn.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Giá thể nào sau đây làm từ phụ phẩm nông nghiệp?", "options": ["A. Xơ dừa, trấu hun, mùn cưa", "B. Perlite", "C. Vermiculite", "D. Đá vôi"], "answer": "A", "explain": "Xơ dừa (vỏ dừa), trấu hun (vỏ trấu), mùn cưa (gỗ) đều là phụ phẩm nông, lâm nghiệp tái sử dụng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ưu điểm môi trường của việc dùng phụ phẩm làm giá thể là gì?", "options": ["A. Tận dụng phế thải, giảm ô nhiễm, tiết kiệm tài nguyên", "B. Tăng rác thải", "C. Gây ô nhiễm", "D. Không có ưu điểm"], "answer": "A", "explain": "Biến vỏ dừa, trấu, mùn cưa thành giá thể: giảm đốt bỏ, giảm rác — kinh tế tuần hoàn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "pH của giá thể quá thấp (quá chua) gây hại gì?", "options": ["A. Cây khó hấp thụ dinh dưỡng, rễ bị hại", "B. Cây tốt hơn", "C. Không ảnh hưởng", "D. Cây ra hoa nhiều"], "answer": "A", "explain": "pH thấp: rễ bị độc (Al), khó hút P, Ca, Mg — cây còi cọc; cần điều chỉnh về 5,5–6,5.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao perlite và vermiculite thường được dùng phối hợp với nhau?", "options": ["A. Vì perlite thoáng khí, vermiculite giữ nước — bổ sung cho nhau", "B. Vì chúng giống hệt nhau", "C. Vì không có lí do", "D. Vì trộn cho đẹp"], "answer": "A", "explain": "Perlite thiên thoáng, vermiculite thiên giữ nước — phối hợp cân bằng ẩm, khí lí tưởng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi giá thể có mùi hôi, thối, cần xử lí thế nào?", "options": ["A. Thay giá thể mới, vệ sinh chậu, kiểm tra thoát nước", "B. Để nguyên không làm gì", "C. Tưới thêm nước", "D. Bón thêm phân"], "answer": "A", "explain": "Mùi hôi = yếm khí, thối rễ — phải thay giá thể, vệ sinh, cải thiện thoát nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vườn ươm muốn giảm chi phí giá thể mà vẫn đảm bảo chất lượng. Giải pháp nào tốt?", "options": ["A. Tận dụng trấu hun, xơ dừa địa phương phối trộn, xử lí đúng kĩ thuật", "B. Mua giá thể nhập khẩu đắt tiền", "C. Dùng đất sét vườn", "D. Không dùng giá thể"], "answer": "A", "explain": "Phụ phẩm địa phương rẻ, sẵn; xử lí đúng kĩ thuật vẫn đạt chuẩn — tối ưu chi phí.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xơ dừa, trấu hun là phụ phẩm nông nghiệp.", "b) Dùng phụ phẩm làm giá thể giúp giảm ô nhiễm.", "c) pH giá thể quá thấp gây hại rễ cây.", "d) Perlite thoáng khí, vermiculite giữ nước tốt."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về quản lí giá thể:", "statements": ["a) Giá thể có mùi hôi cần được thay mới.", "b) Cần kiểm tra, cải thiện thoát nước khi giá thể bị úng.", "c) Tận dụng phụ phẩm địa phương giúp giảm chi phí.", "d) Giá thể bị thối cứ để nguyên sẽ tự khỏi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: để nguyên làm thối rễ lan rộng, cây chết.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai lợi ích kinh tế – môi trường của việc dùng trấu hun, xơ dừa làm giá thể.", "answer": "Tận dụng phế thải, giảm đốt bỏ; rẻ, sẵn có địa phương (chấp nhận ý tương đương)", "explain": "Biến phụ phẩm thành tài nguyên: giảm ô nhiễm đốt bỏ, tiết kiệm chi phí, tạo việc làm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao pH giá thể cần duy trì ở khoảng 5,5–6,5?", "answer": "Khoảng pH này cây hấp thụ dinh dưỡng tốt nhất, rễ khỏe (chấp nhận ý tương đương)", "explain": "pH quá thấp gây độc, khó hút P, Ca; pH quá cao gây thiếu vi lượng — 5,5–6,5 là tối ưu.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Giá thể trồng cây con trong khay ươm cần đặc biệt chú ý yêu cầu nào?", "options": ["A. Sạch mầm bệnh vì cây con rất yếu, dễ nhiễm bệnh", "B. Càng nặng càng tốt", "C. Chứa nhiều mầm bệnh", "D. Không cần yêu cầu gì"], "answer": "A", "explain": "Cây con sức đề kháng yếu; giá thể nhiễm bệnh gây chết hàng loạt — phải sạch bệnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mút xốp trong thủy canh có vai trò gì?", "options": ["A. Cố định cây con trên máng dung dịch", "B. Cung cấp dinh dưỡng", "C. Thay thế nước", "D. Không vai trò"], "answer": "A", "explain": "Mút xốp nhẹ, xốp giữ cổ rễ cây con đứng vững trên máng, rễ thòng xuống dung dịch.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Loại cây nào sau đây KHÔNG phù hợp trồng bằng giá thể chậu nhỏ?", "options": ["A. Cây cổ thụ lâu năm cần nhiều đất", "B. Hoa hồng", "C. Rau xà lách", "D. Dâu tây"], "answer": "A", "explain": "Cây cổ thụ cần không gian đất lớn; chậu nhỏ chỉ phù hợp hoa, rau, cây cảnh nhỏ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao ươm cây con bằng giá thể cho tỉ lệ sống cao hơn gieo thẳng ra ruộng?", "options": ["A. Vì môi trường ươm chủ động, sạch bệnh, cây con khỏe trước khi ra ruộng", "B. Vì gieo ruộng tốt hơn", "C. Vì không có lí do", "D. Vì ươm tốn công vô ích"], "answer": "A", "explain": "Ươm: ẩm, nhiệt, dinh dưỡng chủ động, sạch bệnh — cây con cứng cáp, bén rễ nhanh khi trồng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi tưới cho cây trồng trên giá thể, cần lưu ý gì?", "options": ["A. Tưới vừa đủ ẩm, tránh úng vì giá thể giữ nước tốt", "B. Tưới càng nhiều càng tốt", "C. Không cần tưới", "D. Tưới một lần cho cả tháng"], "answer": "A", "explain": "Giá thể giữ nước mạnh; tưới thừa gây úng thối rễ — tưới vừa ẩm, kiểm tra trước khi tưới.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nhà vườn ươm 10.000 cây giống bằng khay xốp. Lợi ích của giá thể so với đất vườn là gì?", "options": ["A. Nhẹ, đồng đều, sạch bệnh, dễ vận chuyển cây giống đi xa", "B. Nặng hơn, khó vận chuyển", "C. Nhiều sâu bệnh hơn", "D. Không lợi gì"], "answer": "A", "explain": "Khay xốp + giá thể: nhẹ, cây đồng đều, sạch bệnh, xếp xe vận chuyển dễ — chuẩn vườn ươm hiện đại.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giá thể ươm cần đặc biệt sạch mầm bệnh.", "b) Mút xốp cố định cây trong thủy canh.", "c) Cây cổ thụ không phù hợp chậu giá thể nhỏ.", "d) Ươm bằng giá thể cho tỉ lệ sống cao hơn."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tưới cây trên giá thể:", "statements": ["a) Nên tưới vừa đủ ẩm, tránh úng.", "b) Nên kiểm tra độ ẩm giá thể trước khi tưới.", "c) Giá thể giữ nước tốt nên không cần tưới nhiều lần như đất cát.", "d) Tưới ngập úng thường xuyên tốt cho mọi loại giá thể."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: úng gây thối rễ trên mọi giá thể.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai ưu điểm của khay xốp ươm cây so với gieo thẳng ra ruộng.", "answer": "Chủ động môi trường, cây đồng đều; sạch bệnh, tỉ lệ sống cao (chấp nhận ý tương đương)", "explain": "Ươm khay: kiểm soát ẩm, nhiệt, dinh dưỡng; cây con khỏe, đồng đều, bén nhanh khi trồng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao tưới quá nhiều cho cây trồng trên giá thể gây hại?", "answer": "Giá thể giữ nước mạnh, úng gây thiếu ôxi, thối rễ (chấp nhận ý tương đương)", "explain": "Thừa nước đuổi khí khỏi giá thể, rễ ngạt, thối — nhất là giá thể giữ nước tốt như xơ dừa, than bùn.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Giá thể được định nghĩa đầy đủ nhất là gì?", "options": ["A. Vật liệu thay thế đất, làm môi trường cho rễ bám, hút nước và dinh dưỡng", "B. Một loại đất đặc biệt", "C. Một loại phân bón", "D. Nước tưới cây"], "answer": "A", "explain": "Định nghĩa SGK: giá thể là vật liệu thay thế đất làm môi trường cho cây bám rễ, hút nước, dinh dưỡng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các vật liệu sau, vật liệu nào KHÔNG thể làm giá thể?", "options": ["A. Túi nilon nguyên tấm không thấm nước", "B. Xơ dừa", "C. Trấu hun", "D. Perlite"], "answer": "A", "explain": "Nilon không thấm, không thoáng, không giữ dinh dưỡng — không thể làm giá thể; các loại còn lại đều được.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giá thể trồng cây góp phần phát triển nông nghiệp theo hướng nào?", "options": ["A. Nông nghiệp đô thị, công nghệ cao, sạch và bền vững", "B. Nông nghiệp lạc hậu", "C. Phá rừng", "D. Ô nhiễm môi trường"], "answer": "A", "explain": "Giá thể là nền tảng của thủy canh, nông nghiệp đô thị, sản xuất sạch — hướng hiện đại, bền vững.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tổng hợp các yêu cầu của giá thể tốt gồm những gì?", "options": ["A. Tơi xốp, giữ nước và dinh dưỡng, sạch bệnh, pH phù hợp, bền, nhẹ, rẻ", "B. Chỉ cần rẻ", "C. Chỉ cần nặng", "D. Không cần yêu cầu gì"], "answer": "A", "explain": "Tổng hợp 6 yêu cầu: xốp thoáng – giữ nước, giữ phân – sạch bệnh – pH 5,5–6,5 – bền nhẹ – rẻ dễ kiếm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nên xử lí (khử trùng) giá thể tái sử dụng?", "options": ["A. Vì giá thể cũ có thể mang mầm bệnh, cần khử trùng trước khi dùng lại", "B. Vì giá thể cũ tốt hơn mới", "C. Vì không cần thiết", "D. Vì xử lí làm hỏng giá thể"], "answer": "A", "explain": "Giá thể cũ tích lũy mầm bệnh; phơi nắng, hấp hoặc hóa chất khử trùng trước khi tái dùng — tiết kiệm, an toàn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một startup muốn sản xuất giá thể trộn sẵn từ phụ phẩm địa phương. Yếu tố thành công quan trọng nhất là gì?", "options": ["A. Xử lí sạch bệnh, phối trộn đúng tỉ lệ, giá rẻ, đúng nhu cầu cây trồng", "B. Trộn bừa bãi cho nhanh", "C. Bán giá thật cao", "D. Không cần xử lí"], "answer": "A", "explain": "Giá thể thương phẩm cần: sạch bệnh, công thức chuẩn, giá cạnh tranh, phù hợp cây — mới được thị trường chấp nhận.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giá thể là vật liệu thay đất cho rễ bám, hút nước, dinh dưỡng.", "b) Túi nilon không thể làm giá thể.", "c) Giá thể góp phần phát triển nông nghiệp đô thị, công nghệ cao.", "d) Giá thể tái sử dụng cần được khử trùng."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các tiêu chí giá thể thương phẩm:", "statements": ["a) Phải sạch mầm bệnh.", "b) Phối trộn đúng tỉ lệ, phù hợp cây trồng.", "c) Giá thành hợp lí, cạnh tranh.", "d) Trộn bừa bãi, không xử lí vẫn bán tốt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chất lượng kém mất uy tín, không bền vững.", "points": 1}, {"type": "short", "level": "VDC", "q": "Tóm tắt 6 yêu cầu của giá thể tốt.", "answer": "Tơi xốp thoáng khí; giữ nước, giữ dinh dưỡng; sạch bệnh; pH phù hợp; bền, nhẹ; rẻ, dễ kiếm", "explain": "6 yêu cầu: xốp thoáng – giữ nước, giữ phân – sạch bệnh, không độc – pH 5,5–6,5 – bền, nhẹ – rẻ, dễ kiếm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai cách khử trùng giá thể tái sử dụng.", "answer": "Phơi nắng; hấp nhiệt (chấp nhận: xử lí hóa chất, luộc nước sôi)", "explain": "Phơi nắng, hấp nhiệt, hoặc xử lí hóa chất diệt mầm bệnh trước khi dùng lại — tiết kiệm chi phí.", "points": 0.5}]}]}
