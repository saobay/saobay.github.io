Học qua làm mang lại năng lực bền vững.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về dự án trồng hoa:", "statements": ["a) Bước đầu là xác định mục tiêu.", "b) Chậu cần có lỗ thoát nước.", "c) Giá thể cần tơi xốp, sạch mầm bệnh.", "d) Không cần hạch toán kinh tế."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: hạch toán là nội dung quan trọng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về hạch toán dự án:", "statements": ["a) Lợi nhuận = thu nhập − chi phí.", "b) Bấm ngọn giúp cây nhiều cành, nhiều hoa.", "c) Ưu tiên biện pháp thủ công, sinh học trừ sâu bệnh.", "d) Nên tưới thật nhiều nước mỗi ngày."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: úng gây thối rễ.", "points": 1}, {"type": "short", "level": "NB", "q": "Viết công thức tính lợi nhuận dự án.", "answer": "Lợi nhuận = Thu nhập − Chi phí", "explain": "Lợi nhuận bằng thu nhập trừ chi phí.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai việc cần làm sau khi kết thúc dự án.", "answer": "Đánh giá đối chiếu mục tiêu; rút kinh nghiệm; báo cáo kết quả", "explain": "Thu hoạch, đánh giá, rút kinh nghiệm, báo cáo (nêu hai là đủ).", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Tưới nước cho hoa chậu nên thực hiện vào", "options": ["A. sáng sớm hoặc chiều mát.", "B. giữa trưa nắng gắt.", "C. nửa đêm.", "D. lúc nào cũng được."], "answer": "A", "explain": "Tưới sáng sớm/chiều mát tránh sốc nhiệt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bấm ngọn cho hoa có tác dụng", "options": ["A. kích thích phân cành, nhiều hoa.", "B. làm cây chết.", "C. làm hoa nhỏ.", "D. không tác dụng."], "answer": "A", "explain": "Bấm ngọn phá ưu thế ngọn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tưới quá nhiều nước cho hoa chậu gây hại vì", "options": ["A. úng nước làm thối rễ.", "B. cây lớn quá nhanh.", "C. hoa nở nhiều quá.", "D. không gây hại."], "answer": "A", "explain": "Úng là nguyên nhân hàng đầu làm chết cây chậu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi cây chuẩn bị ra hoa nên", "options": ["A. giảm đạm, tăng lân kali.", "B. bón thật nhiều đạm.", "C. ngừng bón phân hoàn toàn.", "D. tưới thật nhiều."], "answer": "A", "explain": "Thừa đạm làm tốt lá ít hoa; cần lân, kali.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Chậu cúc một thân cao lêu nghêu ít hoa vì không bấm ngọn. Bài học:", "options": ["A. cần bấm ngọn đúng lúc để phân cành.", "B. cúc không cần bấm ngọn.", "C. nên trồng dày.", "D. do giống xấu."], "answer": "A", "explain": "Bấm ngọn tạo tán, tăng số hoa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Muốn hoa nở đúng Tết cần", "options": ["A. tính ngược thời gian gieo trồng, bấm ngọn theo đặc tính giống.", "B. gieo hạt ngày Tết.", "C. tưới nhiều nước.", "D. để tự nhiên."], "answer": "A", "explain": "Điều khiển ra hoa cần tính toán kĩ thuật.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về chăm sóc hoa:", "statements": ["a) Tưới đủ ẩm, tránh úng.", "b) Bấm ngọn giúp nhiều cành, nhiều hoa.", "c) Ra hoa nên giảm đạm, tăng lân kali.", "d) Tưới giữa trưa nắng là tốt nhất."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: gây sốc nhiệt.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về chăm sóc hoa chậu:", "statements": ["a) Sau trồng cần tưới đẫm, để râm mát vài ngày.", "b) Tỉa lá già, hoa tàn giúp cây đẹp.", "c) Thăm chậu thường xuyên để xử lí kịp thời.", "d) Bón càng nhiều phân càng tốt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: thừa phân hại rễ.", "points": 1}, {"type": "short", "level": "NB", "q": "Nêu một lưu ý khi tưới nước cho hoa chậu.", "answer": "Tưới đủ ẩm, tránh úng", "explain": "Đủ ẩm không úng; sáng sớm/chiều mát; quan sát giá thể (một đáp án đúng).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao không nên bón nhiều đạm khi cây sắp ra hoa?", "answer": "Vì đạm thúc lá làm cây tốt lốp, ít hoa, hoa kém đẹp", "explain": "Thừa đạm giai đoạn ra hoa: tốt lá, ít hoa; cần lân, kali để hoa đẹp.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Phụ phẩm nông nghiệp có thể tận dụng làm", "options": ["A. phân bón, thức ăn chăn nuôi, chất đốt.", "B. chỉ để đốt bỏ.", "C. không giá trị.", "D. đổ ra sông."], "answer": "A", "explain": "Tận dụng phụ phẩm tăng hiệu quả, giảm ô nhiễm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đốt rơm rạ bừa bãi gây hại vì", "options": ["A. ô nhiễm không khí, lãng phí hữu cơ.", "B. làm đất màu mỡ.", "C. diệt mọi sâu bệnh.", "D. không hại gì."], "answer": "A", "explain": "Đốt rơm: khói bụi, mất hữu cơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mô hình kinh tế tuần hoàn trong chế biến là", "options": ["A. tận dụng phụ phẩm thành sản phẩm mới, giảm chất thải.", "B. chỉ làm một sản phẩm.", "C. đổ bỏ phụ phẩm.", "D. không liên quan."], "answer": "A", "explain": "Tuần hoàn: phụ phẩm thành tài nguyên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong chế biến thực phẩm, cấm", "options": ["A. dùng phụ gia, hoá chất cấm.", "B. vệ sinh cơ sở.", "C. ghi nhãn sản phẩm.", "D. kiểm tra nguyên liệu."], "answer": "A", "explain": "Cấm phụ gia, hoá chất cấm – an toàn thực phẩm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Làng nghề dùng hoá chất tẩy trắng cấm cho bún. Hậu quả:", "options": ["A. sản phẩm độc hại, bị phạt, mất thị trường.", "B. bún đẹp, bán chạy mãi.", "C. không ai biết.", "D. tăng giá trị."], "answer": "A", "explain": "Vi phạm an toàn thực phẩm bị xử lí, mất uy tín.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sản xuất nông nghiệp bền vững cần", "options": ["A. hiệu quả kinh tế gắn với bảo vệ môi trường, an toàn thực phẩm.", "B. chỉ cần lợi nhuận.", "C. bất chấp môi trường.", "D. không cần chế biến."], "answer": "A", "explain": "Bền vững = kinh tế + môi trường + xã hội.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về an toàn và phụ phẩm:", "statements": ["a) Cấm dùng hoá chất cấm trong chế biến.", "b) Rơm rạ ủ làm phân, trồng nấm.", "c) Vỏ trấu làm chất đốt, vật liệu.", "d) Nên đốt bỏ hết phụ phẩm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: lãng phí, ô nhiễm.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về phụ phẩm và bền vững:", "statements": ["a) Tận dụng phụ phẩm tăng thu nhập, giảm ô nhiễm.", "b) Kinh tế tuần hoàn phù hợp nông nghiệp bền vững.", "c) An toàn thực phẩm là yêu cầu bắt buộc.", "d) Lợi nhuận là mục tiêu duy nhất."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần hài hoà kinh tế – môi trường – xã hội.", "points": 1}, {"type": "short", "level": "NB", "q": "Kể tên một cách tận dụng rơm rạ.", "answer": "Ủ làm phân bón", "explain": "Ủ phân, trồng nấm, thức ăn gia súc, chất đốt (một đáp án đúng).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai tác hại của đốt rơm rạ bừa bãi.", "answer": "Ô nhiễm không khí; lãng phí chất hữu cơ", "explain": "Khói bụi ô nhiễm, mất hữu cơ, hại vi sinh vật đất (nêu hai là đủ).", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Robot thu hoạch quả có ưu điểm", "options": ["A. hái nhẹ nhàng, giảm dập nát.", "B. hái nhanh hơn người mọi lúc.", "C. không cần năng lượng.", "D. rẻ hơn nhân công."], "answer": "A", "explain": "Robot hái chính xác, nhẹ nhàng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hút chân không trong bảo quản có tác dụng", "options": ["A. loại bỏ không khí, hạn chế oxy hoá, vi sinh vật.", "B. tăng không khí.", "C. làm chín nhanh.", "D. tăng độ ẩm."], "answer": "A", "explain": "Chân không ngăn oxy hoá, mọt mốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao quả dập nát nhanh hỏng?", "options": ["A. Vì vết dập là cửa ngõ cho vi sinh vật xâm nhập.", "B. Vì quả dập ngọt hơn.", "C. Vì quả dập nặng hơn.", "D. Không ảnh hưởng."], "answer": "A", "explain": "Vết thương hở dễ nhiễm vi sinh vật gây thối.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sấy lạnh giữ chất lượng tốt hơn sấy nóng vì", "options": ["A. nhiệt độ thấp giữ màu, vị, dinh dưỡng.", "B. nhanh hơn.", "C. rẻ hơn.", "D. không cần thiết bị."], "answer": "A", "explain": "Nhiệt thấp bảo toàn chất lượng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trái cây sấy cao cấp xuất khẩu nên chọn", "options": ["A. sấy lạnh/sấy thăng hoa.", "B. phơi nắng.", "C. sấy than tổ ong.", "D. không sấy."], "answer": "A", "explain": "Phân khúc cao cấp cần sấy lạnh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Xu hướng chế biến nông sản hiện nay là", "options": ["A. công nghệ cao, an toàn, giá trị gia tăng, thân thiện môi trường.", "B. quay lại thủ công.", "C. dùng nhiều hoá chất.", "D. không chế biến."], "answer": "A", "explain": "Xu hướng tất yếu của chế biến hiện đại.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về công nghệ hiện đại:", "statements": ["a) Robot hái quả giảm dập nát.", "b) Hút chân không hạn chế oxy hoá.", "c) Sấy lạnh giữ chất lượng tốt.", "d) Công nghệ cao không cần thiết."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về sơ chế sau thu hoạch:", "statements": ["a) Quả dập nát cần loại bỏ, tránh lây hỏng.", "b) Bao bì bảo vệ khi vận chuyển.", "c) Sơ chế ngay sau hái giữ chất lượng.", "d) Có thể để quả hái xong ngoài nắng nhiều ngày."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "NB", "q": "Kể tên một công nghệ bảo quản hiện đại.", "answer": "Kho lạnh", "explain": "Kho lạnh, CAS, MAP, sấy lạnh, hút chân không (một đáp án đúng).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai lợi ích của bao bì đóng gói nông sản.", "answer": "Bảo vệ tránh dập nát; giữ vệ sinh; thuận tiện vận chuyển, tiêu thụ", "explain": "Bao bì: bảo vệ cơ học, vệ sinh, thông tin, thuận tiện (nêu hai là đủ).", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Chương VI gồm các bài nào?", "options": ["A. Bài 19, 20, 21, 22.", "B. Bài 15, 16, 17, 18.", "C. Bài 11, 12, 13, 14.", "D. Bài 1, 2, 3, 4."], "answer": "A", "explain": "Chương VI: bài 19 (quy trình, cơ giới hoá), 20 (thu hoạch, bảo quản), 21 (chế biến), 22 (dự án).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bài 22 là bài", "options": ["A. dự án vận dụng tổng hợp kiến thức trồng trọt.", "B. lí thuyết suông.", "C. không quan trọng.", "D. chỉ để đọc."], "answer": "A", "explain": "Bài 22: dự án trồng hoa trong chậu – học qua làm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung của chương V và chương VI là", "options": ["A. đều hướng tới sản xuất nông nghiệp hiệu quả, an toàn, bền vững.", "B. không liên quan nhau.", "C. chương V quan trọng hơn.", "D. chương VI quan trọng hơn."], "answer": "A", "explain": "Cả hai chương cùng mục tiêu: năng suất, an toàn, bền vững.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ \"đồng ruộng đến bàn ăn\", khâu nào quyết định giá trị cuối cùng?", "options": ["A. Cả chuỗi: trồng, thu hoạch, bảo quản, chế biến đều quan trọng.", "B. Chỉ khâu trồng.", "C. Chỉ khâu chế biến.", "D. Không khâu nào."], "answer": "A", "explain": "Chuỗi giá trị liên hoàn, khâu nào yếu cũng ảnh hưởng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một học sinh sau khi học xong phần Trồng trọt muốn khởi nghiệp nông nghiệp. Lời khuyên đúng là", "options": ["A. nắm vững kĩ thuật, áp dụng công nghệ, tính toán kinh tế và bắt đầu từ mô hình nhỏ.", "B. đầu tư thật lớn ngay.", "C. chỉ trồng không cần học.", "D. bỏ học đi làm."], "answer": "A", "explain": "Khởi nghiệp cần kiến thức, công nghệ, tính toán và bước đi chắc chắn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Thông điệp lớn nhất của phần Trồng trọt (Công nghệ 10) là", "options": ["A. làm chủ khoa học kĩ thuật để trồng trọt hiệu quả, an toàn, bền vững, nâng cao đời sống.", "B. nông nghiệp lạc hậu.", "C. chỉ cần sức người.", "D. công nghệ không cần thiết."], "answer": "A", "explain": "Mục tiêu môn học: ứng dụng KHCN vào trồng trọt bền vững.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp chương VI):", "statements": ["a) Quy trình: làm đất, gieo trồng, chăm sóc, thu hoạch.", "b) Cơ giới hoá: máy móc thay sức người.", "c) Bảo quản: lạnh, CAS, MAP; chế biến: sấy, hộp, lên men, chế biến sâu.", "d) Dự án hoa chậu có 5 bước."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng: tổng hợp chương VI.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp chương VI):", "statements": ["a) Giảm tổn thất sau thu hoạch tương đương tăng sản lượng.", "b) Chế biến nâng giá trị nông sản.", "c) An toàn thực phẩm là yêu cầu xuyên suốt.", "d) Công nghệ không cần thiết với nông dân nhỏ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: có nhiều công nghệ phù hợp quy mô nhỏ.", "points": 1}, {"type": "short", "level": "NB", "q": "Trong dự án trồng hoa trong chậu, nội dung hạch toán kinh tế gồm những gì?", "answer": "chi phí giống, giá thể, phân bón, công chăm sóc và doanh thu dự kiến", "explain": "Hạch toán gồm: chi phí đầu vào (giống, giá thể, chậu, phân bón, thuốc), công lao động chăm sóc và doanh thu dự kiến từ bán hoa.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai định hướng phát triển nông nghiệp từ kiến thức phần Trồng trọt.", "answer": "Ứng dụng công nghệ cao, cơ giới hoá; sản xuất an toàn, bền vững, nâng giá trị gia tăng", "explain": "Định hướng: hiện đại hoá, công nghệ cao; an toàn, bền vững, giá trị gia tăng (nêu hai là đủ).", "points": 0.5}]}]}</script>
