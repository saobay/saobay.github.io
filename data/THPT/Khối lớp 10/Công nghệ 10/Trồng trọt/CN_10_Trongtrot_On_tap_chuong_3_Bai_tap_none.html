n phức hợp và phân hỗn hợp.", "answer": "phân phức hợp tạo bằng phản ứng hóa học, phân hỗn hợp tạo bằng cách trộn cơ học", "explain": "Phân phức hợp được tạo ra bằng phản ứng hóa học; phân hỗn hợp được tạo bằng cách trộn cơ học các phân đơn.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên tố nào là thành phần của protein và diệp lục, kích thích cây sinh trưởng thân lá?", "options": ["A. Đạm (N).", "B. Lân (P).", "C. Kali (K).", "D. Canxi (Ca)."], "answer": "A", "explain": "Đạm là thành phần của protein, diệp lục; thúc đẩy sinh trưởng thân, lá.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tố nào kích thích cây phát triển bộ rễ, ra hoa, đậu quả?", "options": ["A. Lân (P).", "B. Đạm (N).", "C. Kali (K).", "D. Magie (Mg)."], "answer": "A", "explain": "Lân thúc đẩy phát triển rễ, đẻ nhánh, ra hoa, đậu quả, hạt chắc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tố nào giúp cây tăng khả năng chống chịu và nâng cao chất lượng nông sản?", "options": ["A. Kali (K).", "B. Đạm (N).", "C. Lân (P).", "D. Sắt (Fe)."], "answer": "A", "explain": "Kali tăng chống chịu hạn, rét, sâu bệnh; vận chuyển chất hữu cơ; tăng chất lượng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cây lúa có biểu hiện lá vàng từ gốc lên, đẻ nhánh kém. Chẩn đoán đúng nhất là gì?", "options": ["A. Thiếu đạm.", "B. Thiếu lân.", "C. Thiếu kali.", "D. Thừa đạm."], "answer": "A", "explain": "Vàng lá từ lá già, còi cọc là biểu hiện điển hình của thiếu đạm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vườn ngô có nhiều cây lá ngả tím, rễ ngắn, chậm lớn. Chẩn đoán đúng nhất là gì?", "options": ["A. Thiếu lân.", "B. Thiếu đạm.", "C. Thiếu kali.", "D. Thiếu nước."], "answer": "A", "explain": "Lá tím đỏ, rễ kém phát triển là biểu hiện đặc trưng của thiếu lân.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nông dân thấy vườn cà phê mép lá cháy khô, quả nhỏ. Anh ta định bón thêm urê. Đánh giá đúng là gì?",  và tránh thừa.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về dinh dưỡng cân đối:", "statements": ["a) Cây trồng cần dinh dưỡng đầy đủ và cân đối.", "b) Thừa đạm gây tốt lốp, dễ đổ ngã, dễ nhiễm sâu bệnh.", "c) Thiếu dinh dưỡng làm cây còi cọc, năng suất thấp.", "d) Bón càng nhiều phân thì cây càng cân đối dinh dưỡng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bón nhiều gây thừa, mất cân đối.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về bón phân cân đối:", "statements": ["a) Chỉ bón đạm nhiều vụ liên tiếp gây mất cân đối dinh dưỡng đất.", "b) Rau thừa đạm tích lũy nitrat gây hại sức khỏe.", "c) Bón phân cân đối giúp cây khỏe, ít sâu bệnh.", "d) Cây thiếu kali có thể khắc phục bằng cách bón thêm đạm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: thiếu kali phải bón kali (đúng loại).", "points": 1}, {"type": "short", "level": "VDC", "q": "Giải thích ngắn gọn khái niệm \"bón phân cân đối\".", "answer": "bón đủ các chất dinh dưỡng theo nhu cầu của cây, không thiếu không thừa", "explain": "Bón phân cân đối là cung cấp đầy đủ các nguyên tố dinh dưỡng theo đúng nhu cầu của cây trồng, tránh thiếu và tránh thừa.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 2 tác hại của việc bón phân mất cân đối, chỉ thiên về đạm.", "answer": "cây tốt lốp dễ đổ, đất mất cân đối dinh dưỡng", "explain": "Chỉ bón đạm: cây tốt lốp, dễ đổ ngã, dễ nhiễm sâu bệnh; đất mất cân đối N-P-K, suy kiệt lân, kali.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên tắc \"4 đúng\" khi bón phân gồm những gì?", "options": ["A. Đúng loại, đúng liều lượng, đúng lúc, đúng cách.", "B. Đúng đất, đúng nước, đúng phân, đúng cây.", "C. Đúng sáng, đúng chiều, đúng tối, đúng đêm.", "D. Đúng vụ, đúng mùa, đúng năm, đúng tháng."], "answer": "A", "explain": "\"4 đúng\": đúng loại, đúng liều lượng, đúng lúc, đúng cách.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "\"Đúng loại\" nghĩa là chọn phân như thế nào?", "options": ["A. Phù hợp với loại cây, giai đoạn sinh trưởng và loại đất.", "B. Loại đắt tiền nhất.", "C. Loại có bao bì đẹp nhất.", "D. Loại nào cũng được."], "answer": "A", "explain": "Đúng loại: chọn phân phù hợp với nhu cầu cây trồng và điều kiện đất đai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "\"Đúng liều lượng\" nghĩa là gì?", "options": ["A. Bón đủ theo nhu cầu của cây, không thiếu, không thừa.", "B. Bón càng nhiều càng tốt.", "C. Bón càng ít càng tốt.", "D. Bón theo ý thích."], "answer": "A", "explain": "Đúng liều lượng: bón đủ nhu cầu, tránh thiếu và thừa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bón phân đạm cho ruộng lúa ngay trước khi bão về vi phạm \"đúng\" nào?", "options": ["A. Đúng lúc.", "B. Đúng loại.", "C. Đúng liều lượng.", "D. Đúng cách."], "answer": "A", "explain": "Bón trước bão, phân bị rửa trôi — sai thời điểm (đúng lúc).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phun phân bón lá với nồng độ gấp 3 lần hướng dẫn làm cháy lá. Vi phạm \"đúng\" nào?", "options": ["A. Đúng cách và đúng liều lượng.", "B. Đúng loại.", "C. Đúng lúc.", "D. Không vi phạm gì."], "answer": "A", "explain": "Pha sai nồng độ, sai phương pháp — vi phạm đúng cách (và đúng liều lượng).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nông dân bón phân cho vườn cây ăn trái: đầu vụ bón lót phân chuồng, khi ra hoa bón NPK, khi nuôi quả tăng kali, phun vi lượng khi thiếu. Đánh giá đúng là gì?", "options": ["A. Vận dụng tốt \"4 đúng\": đúng loại, đúng lúc cho từng giai đoạn.", "B. Sai vì bón quá nhiều lần.", "C. Sai vì không nên bón lót.", "D. Không thể đánh giá."], "answer": "A", "explain": "Mỗi giai đoạn dùng đúng loại phân, đúng thời điểm cây cần — mẫu mực của \"4 đúng\".", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định ôn tập sau về \"4 đúng\":", "statements": ["a) \"4 đúng\" gồm: đúng loại, đúng liều lượng, đúng lúc, đúng cách.", "b) Bón sai loại phân làm giảm hiệu quả, lãng phí.", "c) Bón thừa phân không vi phạm \"đúng liều lượng\".", "d) Tuân thủ \"4 đúng\" giúp bảo vệ môi trường."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: bón thừa là vi phạm đúng liều lượng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về vận dụng nguyên tắc 4 đúng:", "statements": ["a) Bón phân trước mưa to vi phạm \"đúng lúc\".", "b) Chọn phân theo nhu cầu từng giai đoạn là \"đúng loại\".", "c) Pha phân bón lá đặc gấp nhiều lần hướng dẫn là \"đúng cách\".", "d) Bón đủ liều theo khuyến cáo là \"đúng liều lượng\"."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: mưa rửa trôi phân. b) Đúng. c) Sai: gây cháy lá. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Liệt kê \"4 đúng\" trong nguyên tắc bón phân.", "answer": "đúng loại, đúng liều lượng, đúng lúc, đúng cách", "explain": "\"4 đúng\": đúng loại, đúng liều lượng, đúng lúc (thời điểm), đúng cách (phương pháp).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 1 ví dụ vi phạm \"đúng lúc\" khi bón phân.", "answer": "bón phân trước khi trời mưa to", "explain": "Ví dụ vi phạm đúng lúc: bón phân trước mưa to (rửa trôi), bón thúc quá muộn khi cây sắp thu hoạch, bón lúc nắng gắt.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Bón lót được thực hiện khi nào?", "options": ["A. Trước khi gieo trồng.", "B. Khi cây đang ra hoa.", "C. Sau khi thu hoạch.", "D. Khi cây bị bệnh."], "answer": "A", "explain": "Bón lót: bón phân vào đất trước khi gieo trồng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bón thúc được thực hiện khi nào?", "options": ["A. Trong quá trình cây sinh trưởng.", "B. Trước khi gieo trồng.", "C. Sau khi thu hoạch.", "D. Vào mùa đông."], "answer": "A", "explain": "Bón thúc: bón bổ sung trong quá trình cây sinh trưởng, lúc cây cần dinh dưỡng nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bón phân qua lá là cách bón như thế nào?", "options": ["A. Phun dung dịch phân bón lên lá.", "B. Rải phân lên mặt đất.", "C. Bón phân vào gốc.", "D. Trộn phân với đất."], "answer": "A", "explain": "Bón qua lá: hòa phân vào nước rồi phun lên lá, cây hấp thu trực tiếp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phân lân thường được dùng để bón lót?", "options": ["A. Vì lân ít di động trong đất, cần bón sớm và bón sâu vào tầng rễ.", "B. Vì lân dễ bay hơi.", "C. Vì lân chỉ có tác dụng khi bón lót.", "D. Vì lân rất đắt tiền."], "answer": "A", "explain": "Lân di chuyển kém trong đất nên bón lót sâu giúp rễ tiếp xúc và hấp thu được.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ưu điểm của bón phân qua lá là gì?", "options": ["A. Cây hấp thu nhanh, phù hợp khi cần bổ sung gấp, nhất là vi lượng.", "B. Bón được lượng phân rất lớn.", "C. Không cần pha chế.", "D. Thay thế hoàn toàn bón vào đất."], "answer": "A", "explain": "Bón qua lá cho tác dụng nhanh với lượng phân ít; nhưng chỉ là biện pháp bổ sung.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cây hồ tiêu có biểu hiện thiếu kẽm trong giai đoạn nuôi quả, rễ vẫn khỏe. Biện pháp tốt nhất là gì?", "options": ["A. Phun phân bón lá chứa kẽm với nồng độ loãng.", "B. Bón thật nhiều phân đạm vào gốc.", "C. Đào gốc lên kiểm tra.", "D. Chờ vụ sau."], "answer": "A", "explain": "Cần bổ sung nhanh vi lượng khi đang nuôi quả; phun qua lá là nhanh và phù hợp nhất.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định ôn tập sau về cách bón phân:", "statements": ["a) Bón lót thực hiện trước khi gieo trồng.", "b) Bón thúc thực hiện trong quá trình cây sinh trưởng.", "c) Bón qua lá là phun dung dịch phân bón lên lá.", "d) Phân lân nên bón thúc nhiều lần vì dễ di động."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: lân ít di động nên bón lót là chính.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về bón lót, bón thúc và bón qua lá:", "statements": ["a) Phân hữu cơ và phân lân thường dùng để bón lót.", "b) Phân đạm và phân kali thường dùng để bón thúc.", "c) Bón qua lá có thể thay thế hoàn toàn bón vào đất.", "d) Sau khi bón phân vào đất nên vùi lấp hoặc tưới nước."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: chỉ là biện pháp bổ sung. d) Đúng: giúp phân tiếp xúc rễ, giảm thất thoát.", "points": 1}, {"type": "short", "level": "VDC", "q": "So sánh ngắn gọn bón lót và bón thúc (thời điểm và loại phân).", "answer": "bón lót trước khi trồng dùng phân hữu cơ và lân, bón thúc khi cây sinh trưởng dùng đạm và kali", "explain": "Bón lót: trước khi gieo trồng, thường dùng phân hữu cơ và phân lân. Bón thúc: trong quá trình sinh trưởng, thường dùng phân đạm và phân kali.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 1 trường hợp nên áp dụng bón phân qua lá.", "answer": "khi cần bổ sung nhanh vi lượng cho cây", "explain": "Bón qua lá khi cần bổ sung nhanh chất dinh dưỡng (nhất là vi lượng), khi rễ hấp thu kém, hoặc giai đoạn cây cần gấp.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Phân bón nên được bảo quản ở nơi như thế nào?", "options": ["A. Khô ráo, thoáng mát, trên kệ cao.", "B. Ẩm ướt, tối tăm.", "C. Ngoài trời mưa nắng.", "D. Nơi nào cũng được."], "answer": "A", "explain": "Nơi khô ráo, thoáng mát, kê trên kệ cao tránh ẩm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vì sao bao phân đã mở dở cần buộc kín miệng?", "options": ["A. Vì nhiều loại phân dễ hút ẩm, vón cục và bay hơi mất chất.", "B. Vì để bao đẹp hơn.", "C. Vì tránh chuột cắn.", "D. Vì không có lí do gì."], "answer": "A", "explain": "Để hở làm phân hút ẩm vón cục, đạm bay hơi, giảm chất lượng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cặp chất nào sau đây không được để chung với nhau?", "options": ["A. Vôi bột và phân đạm amoni.", "B. Phân lân và phân kali.", "C. Phân hữu cơ và phân vi sinh.", "D. Urê và supe lân."], "answer": "A", "explain": "Vôi phản ứng với phân đạm amoni gây mất đạm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phân vi sinh cần bảo quản nơi mát, tránh nắng và dùng trong hạn?", "options": ["A. Vì nắng nóng và quá hạn làm vi sinh vật chết, phân mất tác dụng.", "B. Vì phân vi sinh dễ cháy.", "C. Vì phân vi sinh có mùi hôi.", "D. Vì không có lí do gì."], "answer": "A", "explain": "VSV chết khi gặp nắng nóng hoặc để quá lâu; phải giữ nơi mát và dùng đúng hạn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kho chứa phân bón ẩm thấp có thể gây ra hậu quả gì?", "options": ["A. Phân hút ẩm vón cục, giảm chất lượng; có thể xảy ra phản ứng có hại giữa các loại.", "B. Phân tốt hơn.", "C. Không có hậu quả gì.", "D. Chỉ tốn diện tích."], "answer": "A", "explain": "Ẩm làm phân vón cục, giảm chất lượng; để chung các loại có thể gây phản ứng mất dinh dưỡng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một đại lí để bao urê rách ngoài hiên mưa nắng, cạnh đống vôi bột. Những sai phạm và hậu quả là gì?", "options": ["A. Urê hút ẩm, vón cục, mất đạm; vôi phản ứng với đạm amoni gây mất đạm thêm.", "B. Không có sai phạm gì.", "C. Phân sẽ tốt hơn.", "D. Chỉ mất thẩm mĩ."], "answer": "A", "explain": "Để mưa nắng làm phân hư hỏng; để cạnh vôi gây phản ứng mất đạm; bao rách tăng tiếp xúc ẩm.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định ôn tập sau về bảo quản phân bón:", "statements": ["a) Phân bón nên để nơi khô ráo, thoáng mát, trên kệ cao.", "b) Không nên để phân đạm chung với vôi bột.", "c) Phân vi sinh cần tránh nắng nóng và dùng trong hạn sử dụng.", "d) Có thể để các bao phân rách ngoài trời mưa nắng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: phản ứng mất đạm. c) Đúng. d) Sai: làm phân hư hỏng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về bảo quản phân đạm:", "statements": ["a) Phân đạm rất dễ hút ẩm nên bao bì phải kín.", "b) Đạm nitrat phải để xa chất dễ cháy vì nguy cơ cháy nổ.", "c) Trộn vôi với đạm sunfat rồi để qua đêm không gây mất đạm.", "d) Ghi nhãn rõ ràng từng loại phân giúp tránh nhầm lẫn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: phản ứng xảy ra ngay, gây mất đạm. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 3 yêu cầu khi bảo quản phân bón.", "answer": "nơi khô ráo thoáng mát, bao bì kín, không để đạm chung với vôi", "explain": "Bảo quản: nơi khô ráo, thoáng mát, trên kệ cao; tránh nắng nóng; bao bì kín; để riêng từng loại, ghi nhãn; đạm không chung với vôi; xa chất dễ cháy.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích vì sao không được trộn vôi bột với phân đạm amoni.", "answer": "vì xảy ra phản ứng hóa học làm mất đạm", "explain": "Vôi có tính kiềm phản ứng với phân đạm amoni giải phóng khí amoniac bay đi, làm mất đạm.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Nhóm vi sinh vật nào chuyển nitơ trong không khí thành đạm cây dùng được?", "options": ["A. Vi sinh vật cố định đạm.", "B. Vi sinh vật phân giải lân.", "C. Vi sinh vật phân giải xenlulozơ.", "D. Nấm men."], "answer": "A", "explain": "VSV cố định đạm (Rhizobium, Azotobacter) biến N2 thành hợp chất chứa đạm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhóm vi sinh vật nào biến lân khó tan thành lân dễ tiêu?", "options": ["A. Vi sinh vật phân giải lân.", "B. Vi sinh vật cố định đạm.", "C. Vi sinh vật phân giải xenlulozơ.", "D. Vi khuẩn lactic."], "answer": "A", "explain": "VSV phân giải lân tiết axit hữu cơ hòa tan lân khó tan.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhóm vi sinh vật nào phân giải rơm rạ thành mùn?", "options": ["A. Vi sinh vật phân giải chất hữu cơ (xenlulozơ).", "B. Vi sinh vật cố định đạm.", "C. Vi sinh vật phân giải lân.", "D. Nấm men."], "answer": "A", "explain": "VSV phân giải xenlulozơ biến xác bã thực vật thành mùn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ưu điểm nổi bật của phân vi sinh là gì?", "options": ["A. An toàn, thân thiện môi trường, cải tạo đất.", "B. Tác dụng nhanh như phân hóa học.", "C. Hàm lượng dinh dưỡng rất cao.", "D. Không cần bảo quản."], "answer": "A", "explain": "Phân vi sinh an toàn, không ô nhiễm, cải tạo đất, tăng VSV có ích.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hạn chế của phân vi sinh là gì?", "options": ["A. Tác dụng chậm, hiệu quả phụ thuộc điều kiện đất, hạn dùng ngắn.", "B. Gây ô nhiễm môi trường.", "C. Làm đất chai cứng.", "D. Không có hạn chế gì."], "answer": "A", "explain": "VSV cần thời gian hoạt động, phụ thuộc ẩm độ, nhiệt độ; VSV chết dần nên hạn dùng ngắn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Muốn giảm phân đạm hóa học cho ruộng đậu tương, biện pháp ứng dụng công nghệ vi sinh hiệu quả nhất là gì?", "options": ["A. Trộn hạt giống với chế phẩm chứa Rhizobium trước khi gieo.", "B. Bón thêm thật nhiều urê.", "C. Phun thuốc trừ sâu.", "D. Không cần làm gì."], "answer": "A", "explain": "Rhizobium cộng sinh ở nốt sần rễ cố định đạm tự nhiên, giảm được phân đạm hóa học.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định ôn tập sau về công nghệ vi sinh:", "statements": ["a) Rhizobium sống cộng sinh ở nốt sần rễ cây họ đậu và cố định đạm.", "b) Vi sinh vật phân giải lân biến lân khó tan thành dễ tiêu.", "c) Vi sinh vật phân giải xenlulozơ giúp ủ rơm rạ nhanh hoai mục.", "d) Phân vi sinh gây ô nhiễm môi trường nghiêm trọng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: phân vi sinh thân thiện môi trường.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về sản xuất và sử dụng phân vi sinh:", "statements": ["a) Quy trình sản xuất phân vi sinh: chọn chủng, nuôi cấy, phối trộn chất mang, đóng gói.", "b) Phân vi sinh nên dùng kết hợp với phân hữu cơ để tăng hiệu quả.", "c) Phân vi sinh có thể thay thế hoàn toàn mọi loại phân bón khác.", "d) Nên bón phân vi sinh lúc đất đủ ẩm, trời mát."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: chất hữu cơ nuôi VSV. c) Sai: chỉ bổ sung, không thay thế hoàn toàn. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên 3 nhóm vi sinh vật được ứng dụng trong sản xuất phân bón.", "answer": "cố định đạm, phân giải lân, phân giải chất hữu cơ", "explain": "Ba nhóm: VSV cố định đạm, VSV phân giải lân, VSV phân giải chất hữu cơ (xenlulozơ).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu 2 ưu điểm và 1 hạn chế của phân vi sinh.", "answer": "ưu điểm: an toàn môi trường và cải tạo đất; hạn chế: tác dụng chậm", "explain": "Ưu điểm: an toàn, thân thiện môi trường; cải tạo đất; giảm phân hóa học. Hạn chế: tác dụng chậm; phụ thuộc điều kiện; hạn dùng ngắn.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các loại phân sau, loại nào là phân đơn?", "options": ["A. Kali clorua.", "B. DAP.", "C. NPK.", "D. Phân chuồng."], "answer": "A", "explain": "Kali clorua chỉ chứa kali nên là phân đơn. DAP là phức hợp, NPK là hỗn hợp, phân chuồng là hữu cơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biện pháp nào sau đây vận dụng đúng nguyên tắc \"4 đúng\"?", "options": ["A. Bón phân theo nhu cầu của cây, đúng liều, đúng lúc, đúng phương pháp.", "B. Bón càng nhiều càng tốt.", "C. Bón bất cứ lúc nào rảnh.", "D. Chỉ bón một loại phân duy nhất."], "answer": "A", "explain": "Đúng \"4 đúng\" là đáp ứng đầy đủ 4 yêu cầu: loại, liều, lúc, cách.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Loại phân nào sau đây thân thiện với môi trường nhất?", "options": ["A. Phân vi sinh.", "B. Phân đạm hóa học.", "C. Phân lân hóa học.", "D. Không có loại nào."], "answer": "A", "explain": "Phân vi sinh chứa VSV có ích, không gây ô nhiễm, thân thiện môi trường nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một nông dân làm các việc: ủ phân chuồng hoai mục để bón lót; bón thúc NPK đúng liều khi cây ra hoa; phun vi lượng khi thiếu; bảo quản phân nơi khô ráo. Đánh giá đúng là gì?", "options": ["A. Thực hiện tốt kiến thức chương III: đúng loại, đúng lúc, đúng cách và bảo quản tốt.", "B. Sai vì dùng quá nhiều loại phân.", "C. Sai vì không nên bón lót.", "D. Không đánh giá được."], "answer": "A", "explain": "Cách làm vận dụng đầy đủ: phân loại đúng, bón theo 4 đúng, bảo quản đúng — mẫu mực chương III.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các việc làm sau, việc nào sai với kiến thức chương III?", "options": ["A. Trộn vôi bột với phân đạm amoni để bón một thể.", "B. Ủ phân chuồng hoai mục trước khi bón.", "C. Bón lót phân lân trước khi trồng.", "D. Phun phân bón lá nồng độ loãng khi thiếu vi lượng."], "answer": "A", "explain": "Trộn vôi với đạm amoni gây phản ứng mất đạm — sai. Các việc còn lại đều đúng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vùng trồng rau bị tồn dư nitrat do lạm dụng phân đạm. Giải pháp tổng hợp theo chương III là gì?", "options": ["A. Giảm phân đạm hóa học, tăng phân hữu cơ hoai mục và phân vi sinh, bón theo \"4 đúng\".", "B. Ngừng trồng rau.", "C. Tăng gấp đôi phân đạm.", "D. Chỉ tưới nước, không bón phân."], "answer": "A", "explain": "Giải pháp bền vững: giảm hóa học, tăng hữu cơ và vi sinh, tuân thủ 4 đúng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định tổng hợp chương III:", "statements": ["a) Phân bón cung cấp dinh dưỡng cho cây, tăng độ phì của đất.", "b) N, P, K là các nguyên tố đa lượng quan trọng nhất.", "c) Nguyên tắc bón phân là \"4 đúng\".", "d) Phân vi sinh chứa vi sinh vật có ích, an toàn với môi trường."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: cả 4 đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Một nhóm học sinh thảo luận, xét tính đúng, sai của các kết luận sau:", "statements": ["a) Bón phân cân đối N, P, K giúp cây khỏe, ít sâu bệnh.", "b) Kết hợp hữu cơ, vô cơ, vi sinh theo \"4 đúng\" là hướng bền vững.", "c) Bảo quản phân bón đúng cách giúp giữ chất lượng phân.", "d) Cứ bón thật nhiều phân hóa học là đạt năng suất cao nhất."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bón thừa gây hại, lãng phí, ô nhiễm.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 3 bài học trong chương III và nội dung chính của mỗi bài (ngắn gọn).", "answer": "bài 7 phân loại và vai trò phân bón, bài 8 sử dụng và bảo quản phân bón, bài 9 công nghệ vi sinh trong sản xuất phân bón", "explain": "Bài 7: giới thiệu về phân bón (khái niệm, phân loại, vai trò N-P-K). Bài 8: sử dụng và bảo quản phân bón (4 đúng, cách bón, bảo quản). Bài 9: công nghệ vi sinh trong sản xuất phân bón.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu khẩu hiệu hành động về sử dụng phân bón bền vững mà em tâm đắc nhất. (Gợi ý: đủ, đúng, an toàn)", "answer": "bón đủ, bón đúng, bón an toàn", "explain": "Ví dụ: \"Bón đủ, bón đúng, bón an toàn — vì năng suất và môi trường\". Chấp nhận câu trả lời hợp lí thể hiện tinh thần 4 đúng và bền vững.", "points": 0.5}]}]}
