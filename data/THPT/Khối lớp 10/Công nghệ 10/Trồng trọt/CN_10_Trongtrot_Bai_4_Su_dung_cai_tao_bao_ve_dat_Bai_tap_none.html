 vôi khử chua, rửa phèn bằng nước ngọt, lên liếp rồi mới gieo trồng", "B. Gieo lúa ngay không cần cải tạo", "C. Bón thêm phèn cho đất", "D. Tưới nước mặn vào ruộng"], "answer": "A", "explain": "Đất phèn phải khử chua (vôi) + rửa độc tố (nước ngọt) + lên liếp thoát phèn — rồi mới canh tác hiệu quả.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bón vôi giúp khử chua cho đất.", "b) Trồng theo đường đồng mức giúp chống xói mòn.", "c) Luân canh giúp cải tạo đất và hạn chế sâu bệnh.", "d) Rửa phèn là đưa nước ngọt vào rửa trôi chất độc."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các hành vi sau đối với đất trồng:", "statements": ["a) Vứt bao bì thuốc trừ sâu ra ruộng gây ô nhiễm đất.", "b) Đốt rơm rạ bừa bãi gây ô nhiễm không khí, lãng phí hữu cơ.", "c) Ủ rơm rạ làm phân hữu cơ vừa sạch vừa tốt cho đất.", "d) Đổ nước thải chưa xử lí ra ruộng là an toàn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nước thải chưa xử lí gây ô nhiễm đất, mất an toàn thực phẩm.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu ba biện pháp cải tạo đất phèn.", "answer": "Bón vôi khử chua; rửa phèn bằng nước ngọt; lên liếp (chấp nhận: chọn giống chịu phèn)", "explain": "Đất phèn: bón vôi khử chua, tháo nước chua – đưa nước ngọt rửa phèn, lên liếp thoát phèn.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai việc nông dân nên làm với bao bì thuốc bảo vệ thực vật sau khi sử dụng.", "answer": "Thu gom; bỏ đúng nơi quy định (chấp nhận: không vứt ra ruộng, giao cho điểm thu gom)", "explain": "Bao bì thuốc độc hại phải thu gom, bỏ vào thùng chứa đúng quy định, không vứt bừa bãi.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Biện pháp chủ yếu để cải tạo đất mặn là gì?", "options": ["A. Rửa mặn bằng nước ngọt, đắp đê ngă  "Rừng phòng hộ ven biển có vai trò gì?", "options": ["A. Chắn gió, chắn cát, bảo vệ đất và khu dân cư", "B. Lấy gỗ xuất khẩu", "C. Trồng cây ăn quả", "D. Không có vai trò"], "answer": "A", "explain": "Rừng phi lao ven biển chắn gió bão, cố định cát bay, bảo vệ đất canh tác và làng mạc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tăng vụ trong trồng trọt có nghĩa là gì?", "options": ["A. Tăng số vụ gieo trồng trên cùng diện tích trong một năm", "B. Giảm số vụ", "C. Bỏ một vụ", "D. Chỉ trồng một vụ"], "answer": "A", "explain": "Tăng vụ: từ 1 vụ lên 2–3 vụ/năm — nâng hệ số sử dụng đất, tăng sản lượng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phải bón phân cân đối, không bón thừa phân hóa học?", "options": ["A. Vì bón thừa gây chai cứng đất, ô nhiễm, tồn dư, lãng phí", "B. Vì phân hóa học không có tác dụng", "C. Vì cây không cần phân", "D. Vì phân quá rẻ"], "answer": "A", "explain": "Thừa phân hóa học: đất chai, chua, ô nhiễm nguồn nước, tồn dư nông sản, tốn tiền.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Che phủ đất bằng rơm rạ, cây che phủ có tác dụng gì?", "options": ["A. Hạn chế xói mòn, giữ ẩm, tăng mùn cho đất", "B. Làm đất xấu đi", "C. Thu hút sâu bệnh", "D. Không tác dụng"], "answer": "A", "explain": "Lớp phủ giảm tác động mưa, giữ ẩm, khi phân hủy bổ sung mùn — bảo vệ đất hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nông dân trồng cà phê trên đất dốc bị rửa trôi mạnh. Tư vấn nào đúng?", "options": ["A. Trồng theo đường đồng mức, trồng cây che phủ, bón hữu cơ", "B. Cày xới đất dốc theo chiều dốc", "C. Để đất trống giữa các hàng cà phê", "D. Bón thật nhiều phân hóa học"], "answer": "A", "explain": "Đồng mức + che phủ chống xói mòn; hữu cơ cải thiện đất dốc — tổng hợp bền vững.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bón hữu cơ, trồng họ đậu giúp cải tạo đất bạc màu.", "b) Rừng ven biển chắn gió, chắn cát.", "c) Tăng vụ là tăng số vụ trồng trong một năm.", "d) Bón thừa phân hóa học gây chai đất, ô nhiễm."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về canh tác trên đất dốc:", "statements": ["a) Nên trồng theo đường đồng mức.", "b) Nên che phủ đất giữa các hàng cây.", "c) Nên bón phân hữu cơ cải tạo đất.", "d) Nên cày xới theo chiều dốc để thoát nước nhanh."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cày theo chiều dốc làm xói mòn nặng thêm.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai tác hại của việc bón thừa phân hóa học.", "answer": "Chai cứng đất; ô nhiễm môi trường (chấp nhận: tồn dư nông sản, lãng phí)", "explain": "Thừa phân hóa học: đất chai, chua; rửa trôi ô nhiễm nước; tồn dư trên nông sản; tốn chi phí.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao che phủ đất được coi là biện pháp bảo vệ đất đơn giản mà hiệu quả?", "answer": "Giảm xói mòn do mưa, giữ ẩm, tăng mùn khi phân hủy (chấp nhận ý tương đương)", "explain": "Lớp phủ chắn mưa trực tiếp, giữ ẩm, hạn chế cỏ dại, phân hủy thành mùn — rẻ, dễ làm.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Đất bị úng nước cần được cải tạo bằng biện pháp nào?", "options": ["A. Tiêu nước: đào mương, lên luống cao", "B. Tưới thêm nước", "C. Nén chặt đất", "D. Bỏ hoang"], "answer": "A", "explain": "Úng cần thoát nước: mương tiêu, luống cao giúp rễ thoáng khí, tránh thối rễ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hành vi nào sau đây là bảo vệ đất trồng?", "options": ["A. Thu gom bao bì thuốc trừ sâu đúng nơi quy định", "B. Đổ rác thải ra ruộng", "C. Xả nước thải chưa xử lí", "D. Khai thác đất kiệt quệ"], "answer": "A", "explain": "Thu gom bao bì thuốc đúng quy định tránh ô nhiễm đất — hành vi bảo vệ môi trường đất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bố trí cây trồng phù hợp với đất đai có nghĩa là gì?", "options": ["A. Chọn cây phù hợp đặc điểm từng loại đất", "B. Trồng cây bất kì ở đâu cũng được", "C. Chỉ trồng một loại cây", "D. Không cần quan tâm đất"], "answer": "A", "explain": "Đúng cây đúng đất: phù sa trồng lúa, bazan trồng cà phê, cát trồng lạc... mới hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không nên bỏ hoang đất nông nghiệp?", "options": ["A. Vì lãng phí tài nguyên đất, đất dễ thoái hóa, cỏ dại phát triển", "B. Vì đất hoang tốt hơn", "C. Vì không ai quản lí", "D. Vì đất hoang không bị xói mòn"], "answer": "A", "explain": "Bỏ hoang: lãng phí, đất chai cứng, cỏ dại, sâu bệnh tích lũy — nên khai thác hợp lí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sử dụng phân hữu cơ thay một phần phân hóa học có lợi gì?", "options": ["A. Cải tạo đất, an toàn môi trường, giảm chi phí", "B. Làm cây chết", "C. Không có lợi", "D. Tăng ô nhiễm"], "answer": "A", "explain": "Hữu cơ: tơi xốp đất, an toàn, rẻ (tận dụng phụ phẩm) — kết hợp hóa học cân đối là tối ưu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Khu đất trũng ven sông hay ngập úng muốn trồng màu. Giải pháp nào đúng?", "options": ["A. Lên liếp cao, đào mương tiêu nước, trồng cây chịu úng", "B. Gieo hạt trực tiếp xuống chỗ trũng", "C. Tưới thêm nước", "D. Bón vôi thật nhiều"], "answer": "A", "explain": "Lên liếp + tiêu nước khắc phục úng; chọn cây chịu úng — biến đất trũng thành đất màu.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đất úng cần tiêu nước bằng mương, luống cao.", "b) Thu gom bao bì thuốc trừ sâu là bảo vệ đất.", "c) Nên bố trí cây trồng phù hợp từng loại đất.", "d) Bỏ hoang đất nông nghiệp gây lãng phí, thoái hóa đất."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các giải pháp cho đất trũng ngập úng:", "statements": ["a) Lên liếp cao để trồng màu.", "b) Đào mương tiêu nước.", "c) Chọn cây chịu úng tốt.", "d) Tưới thêm nước vào chỗ trũng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đã úng còn tưới thêm làm tình trạng nặng hơn.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai biện pháp tiêu nước cho đất bị úng.", "answer": "Đào mương tiêu; lên luống (liếp) cao (chấp nhận: làm hệ thống thoát nước)", "explain": "Mương rãnh dẫn nước ra; luống cao nâng gốc cây khỏi mực nước ngầm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao kết hợp phân hữu cơ và phân hóa học là cách bón phân hợp lí?", "answer": "Hữu cơ cải tạo đất; hóa học cung cấp dinh dưỡng nhanh, cân đối (chấp nhận ý tương đương)", "explain": "Hữu cơ tơi xốp, bền vững; hóa học bổ sung NPK kịp thời — kết hợp phát huy ưu điểm cả hai.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Lên liếp khi cải tạo đất phèn có tác dụng gì?", "options": ["A. Thoát nước phèn, hạ mực nước ngầm nhiễm phèn", "B. Làm đất phèn thêm", "C. Tăng độ chua", "D. Không tác dụng"], "answer": "A", "explain": "Liếp cao + mương sâu giúp rửa, thoát nước phèn xuống mương, rễ cây tránh tầng phèn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hành vi nào sau đây vi phạm bảo vệ đất trồng?", "options": ["A. Đổ chất thải công nghiệp chưa xử lí ra đồng ruộng", "B. Trồng cây che phủ đất", "C. Bón phân hữu cơ", "D. Luân canh cây trồng"], "answer": "A", "explain": "Chất thải công nghiệp chứa kim loại nặng, hóa chất độc — đổ ra ruộng hủy hoại đất, vi phạm pháp luật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đất cát cần được cải tạo bằng cách nào?", "options": ["A. Bón nhiều phân hữu cơ, trồng cây chắn gió, che phủ", "B. Đổ thêm cát", "C. Nén chặt", "D. Bỏ hoang"], "answer": "A", "explain": "Hữu cơ tăng giữ nước, giữ phân; chắn gió chống cát bay; che phủ giữ ẩm — cải tạo đất cát.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cần chấp hành pháp luật về quản lí, sử dụng đất đai?", "options": ["A. Vì đất là tài nguyên hữu hạn, cần sử dụng đúng mục đích, chống hủy hoại", "B. Vì pháp luật không quan trọng", "C. Vì đất là vô hạn", "D. Vì ai muốn làm gì cũng được"], "answer": "A", "explain": "Đất hữu hạn, khó phục hồi; pháp luật đảm bảo sử dụng đúng quy hoạch, xử lí hành vi hủy hoại đất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trồng cây họ đậu xen trong vườn cây ăn quả có lợi gì cho đất?", "options": ["A. Cố định đạm làm giàu đất, che phủ chống xói mòn", "B. Làm đất nghèo đi", "C. Cạnh tranh hại cây chính", "D. Không lợi gì"], "answer": "A", "explain": "Họ đậu vừa cho đạm vừa che phủ đất — cải tạo đất vườn đồi hiệu quả, tăng thu nhập.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một công ty xả thải ra ruộng lúa gây chết lúa. Theo em, cần xử lí thế nào?", "options": ["A. Buộc dừng xả thải, xử lí ô nhiễm, bồi thường và xử phạt theo pháp luật", "B. Để yên không làm gì", "C. Khuyên nông dân chịu thiệt", "D. Xả tiếp cho quen"], "answer": "A", "explain": "Xả thải gây ô nhiễm là vi phạm pháp luật môi trường: dừng ngay, khắc phục, bồi thường, xử phạt.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lên liếp giúp thoát nước phèn.", "b) Đổ chất thải công nghiệp ra ruộng là vi phạm pháp luật.", "c) Đất cát cần bón hữu cơ và trồng cây chắn gió.", "d) Đất là tài nguyên hữu hạn cần sử dụng đúng pháp luật."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về xử lí ô nhiễm đất:", "statements": ["a) Phải buộc cơ sở gây ô nhiễm dừng xả thải.", "b) Cần xử lí, cải tạo vùng đất bị ô nhiễm.", "c) Cơ sở gây ô nhiễm phải bồi thường thiệt hại.", "d) Ô nhiễm đất do công nghiệp là việc bình thường, không cần xử lí."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: nguyên tắc xử lí ô nhiễm. d) Sai: phải xử lí nghiêm theo pháp luật.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai biện pháp cải tạo đất cát ven biển.", "answer": "Bón phân hữu cơ; trồng cây chắn gió (phi lao) (chấp nhận: che phủ, tưới giữ ẩm)", "explain": "Hữu cơ tăng giữ nước, giữ phân; phi lao chắn gió, cố định cát.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao đất được coi là tài nguyên hữu hạn?", "answer": "Hình thành rất chậm (hàng nghìn năm) nhưng dễ bị hủy hoại nhanh (chấp nhận ý tương đương)", "explain": "1cm đất cần hàng trăm năm hình thành; xói mòn, ô nhiễm có thể hủy hoại trong thời gian ngắn — khó phục hồi.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Bón vôi cho đất phèn ngoài khử chua còn có tác dụng gì?", "options": ["A. Cung cấp canxi, cải thiện cấu trúc đất", "B. Làm đất chua thêm", "C. Diệt cây trồng", "D. Không tác dụng"], "answer": "A", "explain": "Vôi vừa khử chua vừa cung cấp Ca, cải thiện kết cấu đất sét, tăng hoạt động vi sinh vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biện pháp nào giúp đất không bị rửa trôi khi mưa lớn?", "options": ["A. Che phủ đất bằng cây trồng hoặc rơm rạ", "B. Để đất trống", "C. Cày đất thật tơi trước mưa", "D. Đổ đất ra đường"], "answer": "A", "explain": "Lớp che phủ giảm lực đập của hạt mưa, làm chậm dòng chảy — chống rửa trôi hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đất bạc màu có đặc điểm gì?", "options": ["A. Nghèo mùn, nghèo dinh dưỡng, cấu trúc xấu", "B. Rất màu mỡ", "C. Giàu dinh dưỡng", "D. Tơi xốp lí tưởng"], "answer": "A", "explain": "Bạc màu: mất mùn, nghèo NPK, chai cứng — do canh tác bóc lột lâu ngày không bồi bổ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao rửa mặn phải kết hợp đắp đê ngăn mặn?", "options": ["A. Vì không ngăn mặn thì nước mặn lại tràn vào sau khi rửa", "B. Vì đê làm đẹp", "C. Vì không cần thiết", "D. Vì đê ngăn nước ngọt"], "answer": "A", "explain": "Rửa mặn bằng nước ngọt chỉ hiệu quả khi đê ngăn triều mặn xâm nhập trở lại — phải làm đồng bộ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tác hại của thoái hóa đất đối với sản xuất nông nghiệp là gì?", "options": ["A. Năng suất giảm, chi phí tăng, có nguy cơ mất đất canh tác", "B. Năng suất tăng", "C. Không ảnh hưởng", "D. Đất tốt hơn"], "answer": "A", "explain": "Thoái hóa (xói mòn, bạc màu, ô nhiễm): đất mất độ phì, năng suất giảm, phải đầu tư cải tạo tốn kém.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vùng đất bạc màu ở trung du muốn trồng sắn lâu dài. Kế hoạch nào bền vững?", "options": ["A. Bón hữu cơ, luân canh sắn – đậu, trả lại thân lá cho đất", "B. Trồng sắn liên tục, không bón gì", "C. Đốt hết thân lá sau thu hoạch", "D. Bón thật nhiều đạm hóa học"], "answer": "A", "explain": "Sắn bóc lột đất mạnh; phải trả hữu cơ, luân canh họ đậu mới duy trì độ phì lâu dài.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vôi vừa khử chua vừa cung cấp canxi cho đất.", "b) Che phủ đất giúp chống rửa trôi khi mưa lớn.", "c) Đất bạc màu nghèo mùn và dinh dưỡng.", "d) Rửa mặn cần kết hợp đắp đê ngăn mặn."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của kế hoạch canh tác sắn bền vững:", "statements": ["a) Nên bón phân hữu cơ cho đất trồng sắn.", "b) Nên luân canh sắn với cây họ đậu.", "c) Nên trả lại thân, lá sắn cho đất.", "d) Nên trồng sắn độc canh liên tục không bón phân."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: duy trì độ phì. d) Sai: sắn bóc lột đất, độc canh không bón sẽ bạc màu nhanh.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai nguyên nhân khiến đất bị bạc màu.", "answer": "Canh tác bóc lột không bón trả; xói mòn rửa trôi (chấp nhận: độc canh, đốt rơm rạ)", "explain": "Bạc màu do: lấy đi dinh dưỡng không bù đắp, xói mòn mất lớp mặt, độc canh, đốt phụ phẩm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích vì sao trồng sắn liên tục không bón phân làm đất bạc màu nhanh.", "answer": "Sắn lấy đi nhiều dinh dưỡng mà không được bù đắp, đất suy kiệt (chấp nhận ý tương đương)", "explain": "Sắn cho năng suất sinh khối lớn, hút nhiều NPK; không bón trả thì đất nhanh cạn kiệt.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Cải tạo đất là gì?", "options": ["A. Áp dụng biện pháp làm đất xấu trở nên tốt, phù hợp cây trồng", "B. Bỏ hoang đất", "C. Đổ rác ra đất", "D. Khai thác đất kiệt quệ"], "answer": "A", "explain": "Cải tạo = biến đất xấu (chua, phèn, mặn, bạc màu...) thành đất tốt canh tác được.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây nào sau đây chịu mặn tốt, có thể trồng ở vùng đất nhiễm mặn nhẹ?", "options": ["A. Cây đước, cây mắm (rừng ngập mặn)", "B. Cây cà phê", "C. Cây chè", "D. Cây atisô"], "answer": "A", "explain": "Đước, mắm là cây chịu mặn điển hình của rừng ngập mặn — còn cây trồng chịu mặn: lúa chịu mặn, dừa...", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Không đốt rơm rạ mà ủ làm phân có lợi gì cho đất?", "options": ["A. Tăng mùn, tơi xốp đất, giảm ô nhiễm", "B. Làm đất xấu đi", "C. Tốn công vô ích", "D. Không lợi gì"], "answer": "A", "explain": "Rơm ủ hoai thành phân hữu cơ: tăng mùn, tơi xốp, nuôi vi sinh vật — tốt hơn đốt nhiều.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao đất phèn sau cải tạo vẫn cần được theo dõi, chăm sóc thường xuyên?", "options": ["A. Vì phèn có thể tái phát nếu quản lí nước không tốt", "B. Vì đất phèn tự tốt lên", "C. Vì không cần quan tâm", "D. Vì phèn biến mất vĩnh viễn"], "answer": "A", "explain": "Tầng phèn nằm sâu; nếu để khô hạn, phèn bị ôxi hóa tái sinh — cần giữ nước, quản lí tốt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa bảo vệ đất và phát triển bền vững là gì?", "options": ["A. Bảo vệ đất là điều kiện để nông nghiệp phát triển bền vững lâu dài", "B. Không liên quan", "C. Bảo vệ đất cản trở phát triển", "D. Chỉ cần khai thác"], "answer": "A", "explain": "Đất là tư liệu sản xuất chính; mất đất, thoái hóa đất thì không thể phát triển lâu dài.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một dự án khu công nghiệp muốn lấy đất lúa. Theo quy định, cần đảm bảo điều gì?", "options": ["A. Đúng quy hoạch, có đánh giá tác động môi trường và phương án sử dụng đất hợp lí", "B. Lấy bao nhiêu cũng được", "C. Không cần thủ tục", "D. Lấy xong bỏ hoang"], "answer": "A", "explain": "Chuyển mục đích đất lúa phải đúng quy hoạch, đánh giá môi trường, được cấp có thẩm quyền cho phép.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cải tạo đất là làm đất xấu trở nên tốt.", "b) Đước, mắm là cây chịu mặn điển hình.", "c) Ủ rơm rạ làm phân tốt hơn đốt rơm rạ.", "d) Phèn có thể tái phát nếu quản lí nước không tốt."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về quản lí đất đai:", "statements": ["a) Chuyển đất lúa sang mục đích khác phải đúng quy hoạch.", "b) Cần đánh giá tác động môi trường khi thu hồi đất nông nghiệp.", "c) Bảo vệ đất là điều kiện phát triển bền vững.", "d) Có thể tự ý hủy hoại đất nông nghiệp mà không bị xử lí."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: hủy hoại đất bị xử phạt theo pháp luật đất đai, môi trường.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai biện pháp bảo vệ đất khỏi ô nhiễm hóa chất.", "answer": "Bón phân, thuốc đúng liều; thu gom bao bì thuốc (chấp nhận: ưu tiên hữu cơ, sinh học)", "explain": "Dùng hóa chất đúng 4 đúng, ưu tiên hữu cơ/sinh học; thu gom, xử lí bao bì, chất thải đúng quy định.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao phèn có thể tái phát sau khi đã cải tạo?", "answer": "Tầng phèn sâu bị ôxi hóa khi đất khô hạn, sinh axit trở lại (chấp nhận ý tương đương)", "explain": "Phèn tiềm tàng ở tầng sâu; khi khô hạn, sulfua bị ôxi hóa tạo axit — cần giữ ẩm, quản lí nước tốt.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Bón phân cân đối có nghĩa là gì?", "options": ["A. Bón đủ và cân đối các loại dinh dưỡng theo nhu cầu cây, không thừa không thiếu", "B. Bón thật nhiều một loại", "C. Không bón gì", "D. Bón bừa bãi"], "answer": "A", "explain": "Cân đối: đúng loại, đúng liều theo nhu cầu từng cây, từng giai đoạn — hiệu quả, an toàn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trồng rừng đầu nguồn có tác dụng gì với đất vùng hạ lưu?", "options": ["A. Giữ đất, điều hòa nước, hạn chế lũ quét và bồi lấp", "B. Gây lũ lụt", "C. Làm đất xấu đi", "D. Không tác dụng"], "answer": "A", "explain": "Rừng đầu nguồn giữ đất, thấm nước, giảm lũ quét, sạt lở — bảo vệ đất và dân cư hạ lưu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đất bị chai cứng do bón nhiều phân hóa học cần cải tạo bằng cách nào?", "options": ["A. Bón vôi kết hợp phân hữu cơ, giảm phân hóa học", "B. Bón thêm phân hóa học", "C. Nén chặt thêm", "D. Bỏ hoang"], "answer": "A", "explain": "Vôi + hữu cơ phục hồi cấu trúc, vi sinh vật; giảm hóa học để đất 'hồi sinh'.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao rừng đầu nguồn bị phá gây sạt lở, lũ quét ở hạ lưu?", "options": ["A. Vì mất lớp che phủ, đất trơ ra, nước mưa chảy xiết cuốn trôi đất đá", "B. Vì rừng gây mưa nhiều", "C. Vì không liên quan", "D. Vì đất tốt hơn khi không có rừng"], "answer": "A", "explain": "Rừng giữ đất bằng tán và rễ; phá rừng đất trơ, mưa lớn gây xói mòn, sạt lở, lũ quét.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ưu điểm của phân hữu cơ so với phân hóa học trong cải tạo đất là gì?", "options": ["A. Cải thiện cấu trúc đất, tăng mùn, an toàn lâu dài", "B. Tác dụng nhanh hơn", "C. Rẻ hơn luôn luôn", "D. Không cần bón nhiều"], "answer": "A", "explain": "Hữu cơ cải tạo toàn diện lí-hóa-sinh của đất, bền vững; hóa học tác dụng nhanh nhưng không cải tạo cấu trúc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vườn cà phê đất chai cứng sau nhiều năm bón hóa học. Lộ trình phục hồi nào đúng?", "options": ["A. Giảm hóa học, bón vôi + hữu cơ, trồng cây che phủ, luân canh", "B. Tăng gấp đôi phân hóa học", "C. Đốn bỏ cà phê", "D. Tưới nước mặn"], "answer": "A", "explain": "Phục hồi đất chai: giảm hóa học, vôi + hữu cơ tái tạo cấu trúc, che phủ giữ ẩm — lộ trình bền vững.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bón phân cân đối là bón đủ, đúng nhu cầu cây.", "b) Rừng đầu nguồn giữ đất, hạn chế lũ quét.", "c) Đất chai cứng cần bón vôi và hữu cơ để phục hồi.", "d) Phá rừng đầu nguồn không ảnh hưởng đến hạ lưu."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phá rừng gây xói mòn, lũ quét, sạt lở hạ lưu.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của lộ trình phục hồi đất chai cứng:", "statements": ["a) Giảm dần phân hóa học.", "b) Bón vôi và phân hữu cơ cải tạo cấu trúc.", "c) Trồng cây che phủ giữ ẩm, chống xói mòn.", "d) Tăng liều phân hóa học để đất nhanh tốt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tăng hóa học làm đất chai cứng thêm.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai vai trò của rừng đầu nguồn đối với đất và nước.", "answer": "Giữ đất chống xói mòn; điều hòa nguồn nước (chấp nhận: hạn chế lũ quét, sạt lở)", "explain": "Rừng giữ đất bằng rễ, tán; thấm, giữ nước, giảm lũ — bảo vệ đất vùng đồi núi và hạ lưu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "So sánh tác dụng của phân hữu cơ và phân hóa học đối với cấu trúc đất.", "answer": "Hữu cơ cải thiện cấu trúc, tơi xốp; hóa học không cải tạo cấu trúc, dùng nhiều gây chai cứng", "explain": "Hữu cơ tăng mùn, kết cấu viên; hóa học chỉ cung cấp dinh dưỡng nhanh, lạm dụng làm chai đất.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Sử dụng đất hợp lí KHÔNG bao gồm việc nào?", "options": ["A. Bỏ hoang đất nông nghiệp nhiều năm", "B. Luân canh cây trồng", "C. Bón phân cân đối", "D. Bố trí cây phù hợp đất"], "answer": "A", "explain": "Bỏ hoang gây lãng phí, thoái hóa — đi ngược sử dụng hợp lí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để hạn chế cỏ dại mà không dùng thuốc hóa học, nên làm gì?", "options": ["A. Che phủ đất, luân canh, làm cỏ thủ công", "B. Để cỏ mọc tự do", "C. Đốt toàn bộ ruộng", "D. Bỏ hoang"], "answer": "A", "explain": "Che phủ ngăn cỏ nảy mầm; luân canh cắt vòng đời cỏ; làm cỏ thủ công — tổng hợp không hóa chất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nước thải sinh hoạt chưa xử lí tưới cho rau gây hại gì?", "options": ["A. Ô nhiễm đất, mất an toàn thực phẩm", "B. Làm rau tốt hơn", "C. Không gây hại", "D. Tăng dinh dưỡng an toàn"], "answer": "A", "explain": "Nước thải chứa vi khuẩn, kim loại nặng — ô nhiễm đất, rau mất an toàn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cần luân canh cây trồng thay vì độc canh?", "options": ["A. Vì luân canh cải tạo đất, cắt sâu bệnh, tận dụng dinh dưỡng khác nhau", "B. Vì độc canh tốt hơn", "C. Vì luân canh tốn công", "D. Vì không có lí do"], "answer": "A", "explain": "Mỗi cây hút dinh dưỡng khác nhau; luân canh cân bằng đất, cắt sâu bệnh chuyên tính.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biện pháp nào vừa cải tạo đất vừa tăng thu nhập cho nông dân?", "options": ["A. Trồng cây họ đậu luân canh, xen canh", "B. Bỏ hoang đất", "C. Đốt nương rẫy", "D. Khai thác kiệt quệ"], "answer": "A", "explain": "Họ đậu: thu hoạch đậu bán + làm giàu đạm cho đất — hai lợi ích cùng lúc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một xã có nhiều đất bỏ hoang, bạc màu. Chương trình nào phù hợp nhất?", "options": ["A. Quy hoạch sử dụng đất, hỗ trợ cải tạo bằng hữu cơ, trồng cây phù hợp", "B. Để hoang tiếp", "C. Bán đất làm sân golf hết", "D. Đổ rác lên đất hoang"], "answer": "A", "explain": "Quy hoạch + hỗ trợ cải tạo (hữu cơ, cây phù hợp) đưa đất hoang vào sản xuất — đúng chính sách đất đai.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bỏ hoang đất nông nghiệp là sử dụng hợp lí.", "b) Che phủ, luân canh giúp hạn chế cỏ dại.", "c) Nước thải chưa xử lí gây ô nhiễm đất.", "d) Trồng họ đậu vừa cải tạo đất vừa tăng thu nhập."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: bỏ hoang là lãng phí, đi ngược sử dụng hợp lí. b), c), d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các giải pháp cho đất bỏ hoang bạc màu:", "statements": ["a) Cần quy hoạch, đưa đất vào sử dụng.", "b) Hỗ trợ nông dân cải tạo bằng phân hữu cơ.", "c) Chọn cây trồng phù hợp với đất.", "d) Tiếp tục để hoang là giải pháp tốt nhất."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: để hoang lãng phí, đất càng thoái hóa.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai lợi ích của luân canh so với độc canh.", "answer": "Cải tạo đất; cắt nguồn sâu bệnh (chấp nhận: tận dụng dinh dưỡng, tăng thu nhập)", "explain": "Luân canh: đất được nghỉ, bồi bổ (họ đậu); sâu bệnh chuyên tính bị cắt vòng đời.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao nước thải chưa qua xử lí không được dùng tưới rau?", "answer": "Chứa vi khuẩn gây bệnh, kim loại nặng gây ô nhiễm đất và rau mất an toàn (chấp nhận ý tương đương)", "explain": "Nước thải: mầm bệnh, hóa chất độc tích lũy trong đất và rau — nguy hiểm sức khỏe.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Bảo vệ đất trồng gồm những nội dung nào?", "options": ["A. Chống xói mòn, chống ô nhiễm, chống thoái hóa", "B. Chỉ chống xói mòn", "C. Chỉ bón phân", "D. Không cần bảo vệ"], "answer": "A", "explain": "3 nội dung: chống xói mòn/rửa trôi, chống ô nhiễm, chống thoái hóa đất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cày đất theo đường đồng mức (ngang dốc) có tác dụng gì?", "options": ["A. Hạn chế xói mòn, giữ nước cho cây", "B. Làm đất dốc hơn", "C. Tăng xói mòn", "D. Không tác dụng"], "answer": "A", "explain": "Luống cày ngang dốc như những bờ nhỏ giữ nước, giữ đất — ngược với cày xuôi dốc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phân xanh (cây phân xanh) được sử dụng để làm gì?", "options": ["A. Vùi vào đất làm phân hữu cơ cải tạo đất", "B. Làm thức ăn cho người", "C. Đốt lấy tro", "D. Bỏ đi"], "answer": "A", "explain": "Cây phân xanh (muồng, điền thanh...) vùi vào đất tăng mùn, đạm — phân hữu cơ rẻ tiền.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao vùi cây phân xanh vào đất tốt hơn đốt bỏ?", "options": ["A. Vì vùi trả lại mùn và dinh dưỡng cho đất, đốt thì mất đi", "B. Vì đốt nhanh hơn", "C. Vì không khác nhau", "D. Vì vùi tốn công vô ích"], "answer": "A", "explain": "Vùi: hữu cơ phân hủy thành mùn nuôi đất; đốt: mất N, hữu cơ, chỉ còn ít tro.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tổng hợp các biện pháp cải tạo đất xấu gồm những nhóm nào?", "options": ["A. Biện pháp thủy lợi, bón phân, canh tác và chọn giống phù hợp", "B. Chỉ bón phân", "C. Chỉ tưới nước", "D. Chỉ chọn giống"], "answer": "A", "explain": "Cải tạo tổng hợp: thủy lợi (rửa, tiêu), bón phân (vôi, hữu cơ), canh tác (luân canh, che phủ), giống chống chịu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nông trại tổng hợp muốn vừa bảo vệ đất vừa tăng lợi nhuận. Mô hình nào phù hợp?", "options": ["A. Luân canh, xen canh, dùng phân hữu cơ, che phủ đất, trồng cây đa tầng", "B. Độc canh một cây, bón nhiều hóa chất", "C. Bỏ hoang một nửa đất", "D. Khai thác kiệt quệ rồi chuyển đi"], "answer": "A", "explain": "Nông nghiệp tổng hợp, đa canh + hữu cơ: bảo vệ đất, đa dạng thu nhập, bền vững.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bảo vệ đất gồm chống xói mòn, ô nhiễm, thoái hóa.", "b) Cày ngang dốc giúp giữ đất, giữ nước.", "c) Cây phân xanh vùi vào đất làm phân hữu cơ.", "d) Cải tạo đất cần kết hợp nhiều biện pháp."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của mô hình nông trại bền vững:", "statements": ["a) Luân canh, xen canh bảo vệ và cải tạo đất.", "b) Phân hữu cơ giúp đất màu mỡ bền vững.", "c) Che phủ đất chống xói mòn hiệu quả.", "d) Độc canh và lạm dụng hóa chất là hướng bền vững."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: độc canh + hóa chất gây thoái hóa đất.", "points": 1}, {"type": "short", "level": "VDC", "q": "Tóm tắt ba nội dung bảo vệ đất trồng và một ví dụ mỗi nội dung.", "answer": "Chống xói mòn (đồng mức); chống ô nhiễm (thu gom bao bì thuốc); chống thoái hóa (luân canh)", "explain": "Chống xói mòn: đồng mức, che phủ. Chống ô nhiễm: giảm hóa chất, xử lí chất thải. Chống thoái hóa: luân canh, bón cân đối.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai lợi ích của cây phân xanh đối với đất trồng.", "answer": "Tăng mùn, đạm cho đất; che phủ chống xói mòn (chấp nhận ý tương đương)", "explain": "Phân xanh (họ đậu): cố định đạm, vùi tăng mùn; sinh khối che phủ đất.", "points": 0.5}]}]}
