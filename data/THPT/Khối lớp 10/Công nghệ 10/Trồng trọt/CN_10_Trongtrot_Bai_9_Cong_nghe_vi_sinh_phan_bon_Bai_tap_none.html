huộc họ đậu thường được trồng ở Việt Nam.", "answer": "lạc, đậu tương, đậu xanh", "explain": "Các cây họ đậu phổ biến: lạc (đậu phộng), đậu tương, đậu xanh, đậu đen... Chấp nhận đáp án tương đương.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Mối quan hệ giữa vi khuẩn Rhizobium và cây họ đậu được gọi là gì?", "answer": "cộng sinh", "explain": "Đó là quan hệ cộng sinh: cả vi khuẩn và cây trồng đều có lợi.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Vi sinh vật phân giải lân có vai trò gì?", "options": ["A. Chuyển lân khó tan trong đất thành lân dễ tiêu cho cây hấp thu.", "B. Cố định đạm từ không khí.", "C. Phân giải xenlulozơ thành mùn.", "D. Tổng hợp diệp lục cho cây."], "answer": "A", "explain": "VSV phân giải lân tiết axit hữu cơ hòa tan lân khó tan thành dạng dễ tiêu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vì sao trong đất có nhiều lân nhưng cây trồng vẫn có thể bị thiếu lân?", "options": ["A. Vì phần lớn lân ở dạng khó tan, cây không hấp thu được.", "B. Vì lân bị bay hơi hết.", "C. Vì cây không cần lân.", "D. Vì lân bị sâu ăn hết."], "answer": "A", "explain": "Lân trong đất chủ yếu tồn tại ở dạng khó tan (phosphate khó tan); cây chỉ hấp thu được lân dễ tiêu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vi sinh vật phân giải lân chuyển hóa lân bằng cách nào?", "options": ["A. Tiết ra axit hữu cơ hòa tan lân khó tan.", "B. Ăn lân rồi thải ra.", "C. Quang hợp tạo ra lân.", "D. Hút lân từ không khí."], "answer": "A", "explain": "VSV phân giải lân tiết các axit hữu cơ làm hòa tan các hợp chất lân khó tan.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bón phân vi sinh phân giải lân cho ruộng lúa có lợi ích gì?", "options": ["A. Tận dụng được lượng lân khó tan sẵn có trong đất, giảm phân lân hóa học.", "B. Diệt được ốc bươu vàng.", "C. Làm lúa chín sớm hơn một tháng.", "D. Không có lợi ích gì."], "answer": "A", "explain": "VSV biến lân khó tan thành dễ tiêu giúp cây dùng được nguồn lân sẵn có, giảm bón phân lân hóa học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Loại đất nào sau đây rất cần bổ sung vi sinh vật phân giải lân?", "options": ["A. Đất có nhiều lân tổng số nhưng lân dễ tiêu thấp.", "B. Đất cát nghèo dinh dưỡng hoàn toàn.", "C. Đất đã đủ lân dễ tiêu.", "D. Đất mặn."], "answer": "A", "explain": "Khi đất giàu lân tổng số mà nghèo lân dễ tiêu, VSV phân giải lân phát huy tác dụng tốt nhất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một ruộng lúa phân tích đất cho thấy hàm lượng lân tổng số cao nhưng cây lúa vẫn có biểu hiện thiếu lân (lá tím, đẻ nhánh kém). Giải pháp bền vững nhất là gì?", "options": ["A. Bón phân vi sinh phân giải lân để chuyển lân khó tan thành dễ tiêu.", "B. Bón thật nhiều supe lân.", "C. Ngừng trồng lúa.", "D. Tưới thật nhiều nước."], "answer": "A", "explain": "Vấn đề là lân khó tan; VSV phân giải lân giải quyết đúng bản chất, bền vững và tiết kiệm hơn bón thêm lân hóa học.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về vi sinh vật phân giải lân:", "statements": ["a) Vi sinh vật phân giải lân biến lân khó tan thành lân dễ tiêu.", "b) Cây trồng chỉ hấp thu được lân ở dạng dễ tiêu.", "c) Trong đất, phần lớn lân tồn tại ở dạng cây dễ hấp thu.", "d) Bón phân vi sinh phân giải lân giúp giảm phân lân hóa học."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: phần lớn lân ở dạng khó tan. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về ứng dụng vi sinh vật phân giải lân:", "statements": ["a) Vi sinh vật phân giải lân tiết axit hữu cơ để hòa tan lân.", "b) Đất giàu lân tổng số nhưng nghèo lân dễ tiêu rất cần VSV phân giải lân.", "c) Phân vi sinh phân giải lân cung cấp trực tiếp đạm cho cây.", "d) Kết hợp phân vi sinh phân giải lân với phân hữu cơ cho hiệu quả cao."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: nó cung cấp lân, không phải đạm. d) Đúng: chất hữu cơ là thức ăn giúp VSV phát triển.", "points": 1}, {"type": "short", "level": "VDC", "q": "Vi sinh vật phân giải lân biến lân ở dạng nào thành dạng nào?", "answer": "lân khó tan thành lân dễ tiêu", "explain": "VSV phân giải lân chuyển lân khó tan trong đất thành lân dễ tiêu cho cây hấp thu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Bằng cách nào vi sinh vật phân giải lân hòa tan được lân khó tan? (Nêu ngắn gọn)", "answer": "tiết ra axit hữu cơ", "explain": "VSV phân giải lân tiết ra các axit hữu cơ làm hòa tan các hợp chất lân khó tan.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Vi sinh vật phân giải chất hữu cơ có vai trò gì?", "options": ["A. Phân giải xác bã thực vật thành mùn, giải phóng chất dinh dưỡng cho cây.", "B. Cố định đạm từ không khí.", "C. Biến lân khó tan thành lân dễ tiêu.", "D. Diệt cỏ dại."], "answer": "A", "explain": "VSV phân giải xenlulozơ trong rơm rạ, thân lá thành mùn, đồng thời giải phóng dinh dưỡng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chất hữu cơ nào sau đây là thức ăn của vi sinh vật phân giải xenlulozơ?", "options": ["A. Rơm rạ, thân lá cây.", "B. Cát.", "C. Đá vôi.", "D. Nước mưa."], "answer": "A", "explain": "Rơm rạ, thân lá chứa nhiều xenlulozơ là nguồn thức ăn của VSV phân giải chất hữu cơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sản phẩm chính khi vi sinh vật phân giải hoàn toàn xác bã thực vật là gì?", "options": ["A. Mùn và các chất dinh dưỡng dễ tiêu.", "B. Khí độc.", "C. Đá.", "D. Nhựa đường."], "answer": "A", "explain": "Quá trình phân giải tạo mùn (cải tạo đất) và giải phóng N, P, K... ở dạng cây dùng được.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao ủ rơm rạ với chế phẩm vi sinh giúp rơm nhanh hoai mục hơn để tự nhiên?", "options": ["A. Vì bổ sung mật độ cao vi sinh vật phân giải xenlulozơ, tăng tốc độ phân hủy.", "B. Vì chế phẩm làm rơm bị cháy.", "C. Vì chế phẩm diệt hết vi sinh vật tự nhiên.", "D. Vì không có tác dụng gì."], "answer": "A", "explain": "Chế phẩm cung cấp lượng lớn VSV phân giải xenlulozơ nên rơm rạ phân hủy nhanh hơn nhiều.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mùn được tạo ra từ quá trình phân giải chất hữu cơ có tác dụng gì với đất?", "options": ["A. Làm đất tơi xốp, tăng độ phì nhiêu, giữ ẩm và dinh dưỡng tốt.", "B. Làm đất chai cứng.", "C. Diệt hết vi sinh vật đất.", "D. Làm đất bị chua nặng."], "answer": "A", "explain": "Mùn cải thiện cấu trúc đất, tăng khả năng giữ nước, giữ dinh dưỡng và là kho dinh dưỡng cho cây.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sau vụ lúa, nông dân đốt rơm rạ ngoài đồng thay vì ủ làm phân. Đánh giá đúng về việc làm này là gì?", "options": ["A. Sai: đốt rơm gây ô nhiễm, lãng phí nguồn hữu cơ; nên ủ với chế phẩm vi sinh làm phân bón.", "B. Đúng: đốt rơm diệt được mọi sâu bệnh.", "C. Đúng: tro rơm tốt hơn phân ủ.", "D. Không ảnh hưởng gì."], "answer": "A", "explain": "Đốt rơm gây khói bụi ô nhiễm, mất chất hữu cơ; ủ với VSV tận dụng được nguồn hữu cơ làm phân, cải tạo đất.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về vi sinh vật phân giải chất hữu cơ:", "statements": ["a) Vi sinh vật phân giải xenlulozơ biến rơm rạ thành mùn.", "b) Quá trình phân giải giải phóng chất dinh dưỡng cho cây trồng.", "c) Mùn giúp đất tơi xốp, tăng độ phì nhiêu.", "d) Vi sinh vật phân giải chất hữu cơ cố định đạm từ không khí."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cố định đạm là vai trò của nhóm VSV khác.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về vi sinh vật phân giải chất hữu cơ:", "statements": ["a) Ủ rơm rạ với chế phẩm vi sinh giúp rút ngắn thời gian hoai mục.", "b) Đốt rơm rạ ngoài đồng là cách tận dụng nguồn hữu cơ tốt nhất.", "c) Phân vi sinh phân giải chất hữu cơ góp phần cải tạo đất.", "d) Xác bã thực vật sau phân giải cung cấp cả mùn và dinh dưỡng cho cây."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: đốt gây ô nhiễm, lãng phí hữu cơ. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên 2 nguồn chất hữu cơ có thể ủ với chế phẩm vi sinh làm phân bón.", "answer": "rơm rạ, phân chuồng", "explain": "Các nguồn hữu cơ: rơm rạ, thân lá cây, phân chuồng, bã mía, vỏ cà phê... Chấp nhận đáp án tương đương.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sản phẩm của quá trình vi sinh vật phân giải xác bã thực vật là gì?", "answer": "mùn và chất dinh dưỡng", "explain": "VSV phân giải xác bã thực vật tạo mùn và giải phóng các chất dinh dưỡng ở dạng cây hấp thu được.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Có mấy loại phân vi sinh chính được học trong bài?", "options": ["A. 3 loại: cố định đạm, phân giải lân, phân giải chất hữu cơ.", "B. 2 loại: phân đạm và phân lân.", "C. 4 loại theo màu sắc.", "D. 1 loại duy nhất."], "answer": "A", "explain": "Ba loại chính: phân vi sinh cố định đạm, phân vi sinh phân giải lân, phân vi sinh phân giải chất hữu cơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phân vi sinh cố định đạm chứa vi sinh vật nào?", "options": ["A. Rhizobium, Azotobacter.", "B. Vi sinh vật phân giải lân.", "C. Vi sinh vật phân giải xenlulozơ.", "D. Nấm men."], "answer": "A", "explain": "Phân vi sinh cố định đạm chứa các VSV cố định đạm như Rhizobium, Azotobacter.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Muốn tận dụng lượng lân khó tan trong đất nên dùng loại phân vi sinh nào?", "options": ["A. Phân vi sinh phân giải lân.", "B. Phân vi sinh cố định đạm.", "C. Phân vi sinh phân giải chất hữu cơ.", "D. Phân đạm urê."], "answer": "A", "explain": "Phân vi sinh phân giải lân chuyên biến lân khó tan thành lân dễ tiêu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Muốn ủ rơm rạ nhanh hoai mục nên dùng loại phân vi sinh nào?", "options": ["A. Phân vi sinh phân giải chất hữu cơ (phân giải xenlulozơ).", "B. Phân vi sinh cố định đạm.", "C. Phân vi sinh phân giải lân.", "D. Phân lân nung chảy."], "answer": "A", "explain": "Rơm rạ giàu xenlulozơ nên cần VSV phân giải chất hữu cơ để phân hủy nhanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung của các loại phân vi sinh là gì?", "options": ["A. Đều chứa vi sinh vật có ích, an toàn và thân thiện với môi trường.", "B. Đều chứa hàm lượng đạm rất cao.", "C. Đều có tác dụng nhanh như phân hóa học.", "D. Đều được sản xuất bằng phản ứng hóa học."], "answer": "A", "explain": "Các loại phân vi sinh đều chứa VSV có ích, không gây ô nhiễm, thân thiện môi trường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một trang trại muốn vừa giảm phân đạm hóa học cho đậu tương, vừa xử lí rơm rạ sau thu hoạch. Nên kết hợp những loại phân vi sinh nào?", "options": ["A. Phân vi sinh cố định đạm và phân vi sinh phân giải chất hữu cơ.", "B. Chỉ dùng phân vi sinh phân giải lân.", "C. Chỉ dùng phân đạm hóa học.", "D. Không cần dùng phân vi sinh."], "answer": "A", "explain": "Cố định đạm giảm phân đạm cho đậu tương; phân giải chất hữu cơ xử lí rơm rạ thành phân bón.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về các loại phân vi sinh:", "statements": ["a) Phân vi sinh cố định đạm chứa Rhizobium, Azotobacter.", "b) Phân vi sinh phân giải lân biến lân khó tan thành dễ tiêu.", "c) Phân vi sinh phân giải chất hữu cơ giúp ủ rơm rạ nhanh hoai mục.", "d) Phân vi sinh là phân hóa học có hàm lượng dinh dưỡng cao."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: phân vi sinh chứa VSV có ích, không phải phân hóa học.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về các loại phân vi sinh:", "statements": ["a) Mỗi loại phân vi sinh có nhóm vi sinh vật đặc trưng và tác dụng riêng.", "b) Có thể phối hợp nhiều loại phân vi sinh với nhau.", "c) Phân vi sinh phân giải lân cung cấp đạm cho cây.", "d) Chọn đúng loại phân vi sinh theo mục đích giúp tăng hiệu quả sử dụng."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: có thể dùng đa chủng. c) Sai: nó cung cấp lân dễ tiêu. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên 3 loại phân vi sinh chính đã học.", "answer": "phân vi sinh cố định đạm, phân vi sinh phân giải lân, phân vi sinh phân giải chất hữu cơ", "explain": "Ba loại: phân vi sinh cố định đạm, phân vi sinh phân giải lân, phân vi sinh phân giải chất hữu cơ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Để ủ phân chuồng, rơm rạ nhanh hoai mục nên dùng loại phân vi sinh nào?", "answer": "phân vi sinh phân giải chất hữu cơ", "explain": "Dùng phân vi sinh phân giải chất hữu cơ (VSV phân giải xenlulozơ) để ủ nhanh hoai mục.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Bước đầu tiên trong quy trình sản xuất phân vi sinh là gì?", "options": ["A. Tuyển chọn chủng vi sinh vật có ích, hoạt tính cao.", "B. Đóng gói sản phẩm.", "C. Phối trộn với chất mang.", "D. Bón thử ngoài đồng."], "answer": "A", "explain": "Trước hết phải tuyển chọn được chủng VSV có ích, hoạt tính cao, phù hợp điều kiện địa phương.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sau khi tuyển chọn chủng, người ta làm gì để có đủ số lượng vi sinh vật?", "options": ["A. Nuôi cấy, nhân sinh khối vi sinh vật.", "B. Phơi khô vi sinh vật.", "C. Đông lạnh vi sinh vật.", "D. Trộn với phân hóa học."], "answer": "A", "explain": "Nuôi cấy trong môi trường dinh dưỡng để nhân nhanh sinh khối VSV đạt mật độ tiêu chuẩn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chất mang (than bùn, mùn) trong sản xuất phân vi sinh có vai trò gì?", "options": ["A. Giúp vi sinh vật sống được lâu và dễ sử dụng, bảo quản.", "B. Diệt vi sinh vật có hại.", "C. Làm tăng hàm lượng đạm.", "D. Tạo màu sắc đẹp cho phân."], "answer": "A", "explain": "Chất mang là giá thể giúp VSV tồn tại lâu, dễ đóng gói, vận chuyển và sử dụng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phải tuyển chọn kĩ chủng vi sinh vật trước khi sản xuất?", "options": ["A. Vì chỉ chủng hoạt tính cao, phù hợp mới cho hiệu quả tốt và an toàn.", "B. Vì chủng nào cũng giống nhau.", "C. Vì để giảm giá thành.", "D. Vì để phân có mùi thơm."], "answer": "A", "explain": "Chủng tốt quyết định chất lượng phân vi sinh: hoạt tính cao, đúng đối tượng cây trồng, không gây hại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thứ tự đúng của quy trình sản xuất phân vi sinh là gì?", "options": ["A. Chọn chủng, nuôi cấy nhân sinh khối, phối trộn chất mang, đóng gói bảo quản.", "B. Đóng gói, chọn chủng, nuôi cấy, phối trộn.", "C. Phối trộn, đóng gói, chọn chủng, nuôi cấy.", "D. Nuôi cấy, đóng gói, chọn chủng, phối trộn."], "answer": "A", "explain": "Quy trình: tuyển chọn chủng, nuôi cấy nhân sinh khối, phối trộn với chất mang, đóng gói và bảo quản.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một cơ sở sản xuất phân vi sinh bỏ qua bước phối trộn chất mang, đóng gói trực tiếp sinh khối VSV. Hạn chế của cách làm này là gì?", "options": ["A. Vi sinh vật nhanh chết, khó bảo quản, vận chuyển và sử dụng.", "B. Phân sẽ tốt hơn.", "C. Không có hạn chế gì.", "D. Giúp giảm giá thành đáng kể."], "answer": "A", "explain": "Không có chất mang, VSV thiếu giá thể sống, nhanh chết; sản phẩm khó bảo quản và sử dụng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về quy trình sản xuất phân vi sinh:", "statements": ["a) Bước đầu tiên là tuyển chọn chủng vi sinh vật có ích.", "b) Nuôi cấy nhằm nhân nhanh sinh khối vi sinh vật.", "c) Chất mang giúp vi sinh vật sống lâu và dễ sử dụng.", "d) Sản phẩm cần đóng gói kín và bảo quản nơi mát, tránh nắng."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: cả 4 bước đều đúng quy trình.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về quy trình sản xuất phân vi sinh:", "statements": ["a) Chủng vi sinh vật quyết định chất lượng của phân vi sinh.", "b) Có thể bỏ qua bước nuôi cấy mà vẫn đủ số lượng vi sinh vật.", "c) Than bùn là một loại chất mang phổ biến.", "d) Phân vi sinh thành phẩm cần được dùng trong thời hạn sử dụng."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: phải nuôi cấy mới đạt mật độ VSV theo tiêu chuẩn. c) Đúng. d) Đúng: quá hạn VSV chết dần.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 4 bước của quy trình sản xuất phân vi sinh theo đúng thứ tự.", "answer": "chọn chủng, nuôi cấy nhân sinh khối, phối trộn chất mang, đóng gói bảo quản", "explain": "Quy trình: tuyển chọn chủng VSV, nuôi cấy nhân sinh khối, phối trộn với chất mang, đóng gói và bảo quản.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Chất mang trong sản xuất phân vi sinh thường là những chất nào? (Nêu 1 ví dụ)", "answer": "than bùn", "explain": "Chất mang phổ biến: than bùn, mùn... giúp VSV sống lâu, dễ bảo quản và sử dụng.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Ưu điểm nổi bật nhất của phân vi sinh đối với môi trường là gì?", "options": ["A. An toàn, không gây ô nhiễm môi trường.", "B. Làm đất bị ô nhiễm nặng.", "C. Diệt hết vi sinh vật đất.", "D. Không có ưu điểm gì."], "answer": "A", "explain": "Phân vi sinh không chứa hóa chất độc hại nên an toàn, thân thiện với môi trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phân vi sinh có tác dụng gì đối với đất trồng?", "options": ["A. Cải tạo đất, tăng độ phì nhiêu và tăng vi sinh vật có ích.", "B. Làm đất chai cứng.", "C. Làm đất bị chua.", "D. Không ảnh hưởng gì đến đất."], "answer": "A", "explain": "VSV có ích hoạt động làm đất tơi xốp, tăng mùn, tăng độ phì nhiêu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sử dụng phân vi sinh giúp người nông dân tiết kiệm chi phí vì sao?", "options": ["A. Vì giảm được lượng phân hóa học phải mua.", "B. Vì phân vi sinh rất đắt.", "C. Vì không cần bón phân nữa.", "D. Vì phân vi sinh làm tăng giá nông sản gấp đôi."], "answer": "A", "explain": "VSV cung cấp một phần dinh dưỡng (đạm, lân) nên giảm được lượng phân hóa học, giảm chi phí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nông sản bón phân vi sinh thường được đánh giá an toàn hơn?", "options": ["A. Vì không tồn dư hóa chất độc hại, không tích lũy nitrat như khi lạm dụng phân hóa học.", "B. Vì quả to hơn.", "C. Vì mẫu mã đẹp hơn.", "D. Vì không cần thuốc trừ sâu."], "answer": "A", "explain": "Phân vi sinh không để lại tồn dư hóa chất, giúp nông sản sạch, an toàn cho người ăn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong canh tác hữu cơ, vì sao phân vi sinh được ưu tiên sử dụng?", "options": ["A. Vì phù hợp với nguyên tắc không dùng hóa chất, bảo vệ môi trường và sức khỏe.", "B. Vì tác dụng nhanh như phân hóa học.", "C. Vì rẻ hơn mọi loại phân.", "D. Vì không cần bón phân hữu cơ."], "answer": "A", "explain": "Canh tác hữu cơ cấm phân hóa học; phân vi sinh an toàn, thân thiện môi trường nên được ưu tiên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một hợp tác xã chuyển sang dùng phân vi sinh kết hợp phân hữu cơ, giảm 40 phần trăm phân hóa học. Kết quả bền vững có thể đạt được là gì?", "options": ["A. Đất ngày càng màu mỡ, chi phí giảm, nông sản an toàn mà năng suất ổn định.", "B. Năng suất tăng gấp đôi ngay vụ đầu.", "C. Không cần chăm sóc nữa.", "D. Đất bị suy kiệt nhanh."], "answer": "A", "explain": "Hướng đi bền vững: đất được cải tạo, giảm chi phí, nông sản sạch; năng suất ổn định chứ không tăng đột biến.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về ưu điểm của phân vi sinh:", "statements": ["a) Phân vi sinh an toàn, không gây ô nhiễm môi trường.", "b) Phân vi sinh góp phần cải tạo đất, tăng độ phì nhiêu.", "c) Dùng phân vi sinh giúp giảm lượng phân hóa học.", "d) Phân vi sinh làm nông sản tồn dư nhiều hóa chất."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ngược lại, phân vi sinh giúp nông sản sạch, an toàn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về ưu điểm của phân vi sinh:", "statements": ["a) Phân vi sinh phù hợp với hướng canh tác hữu cơ, bền vững.", "b) Dùng phân vi sinh giúp nông sản an toàn cho người tiêu dùng.", "c) Phân vi sinh có tác dụng nhanh hơn phân hóa học.", "d) Phân vi sinh vừa cung cấp dinh dưỡng vừa cải thiện hệ vi sinh vật đất."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: phân vi sinh tác dụng chậm hơn phân hóa học. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 3 ưu điểm của phân vi sinh.", "answer": "an toàn với môi trường, cải tạo đất, giảm phân hóa học", "explain": "Ưu điểm: an toàn, thân thiện môi trường; cải tạo đất, tăng độ phì; giảm phân hóa học, giảm chi phí; nâng cao chất lượng, an toàn nông sản.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao phân vi sinh được coi là thân thiện với môi trường? (Nêu 1 lí do)", "answer": "vì không gây ô nhiễm môi trường", "explain": "Phân vi sinh chứa vi sinh vật có ích, không chứa hóa chất độc hại nên không gây ô nhiễm đất, nước, không khí.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Hạn chế lớn nhất của phân vi sinh là gì?", "options": ["A. Tác dụng chậm, hiệu quả phụ thuộc vào điều kiện đất đai.", "B. Gây ô nhiễm môi trường nặng.", "C. Làm đất chai cứng.", "D. Giá thành quá cao."], "answer": "A", "explain": "VSV cần thời gian hoạt động và phụ thuộc độ ẩm, nhiệt độ, pH đất nên tác dụng chậm, không ổn định như phân hóa học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiệu quả của phân vi sinh phụ thuộc vào yếu tố nào của đất?", "options": ["A. Độ ẩm, nhiệt độ, độ pH.", "B. Màu sắc của đất.", "C. Giá đất.", "D. Diện tích đất."], "answer": "A", "explain": "VSV chỉ hoạt động tốt trong điều kiện ẩm độ, nhiệt độ, pH thích hợp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vì sao phân vi sinh thường được khuyên dùng kết hợp với phân hữu cơ?", "options": ["A. Vì chất hữu cơ là thức ăn giúp vi sinh vật phát triển mạnh.", "B. Vì phân hữu cơ diệt vi sinh vật có hại.", "C. Vì để tăng giá bán phân.", "D. Vì không có lí do gì."], "answer": "A", "explain": "VSV cần chất hữu cơ làm nguồn dinh dưỡng để sinh trưởng, tăng mật độ và hoạt tính.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không nên bón phân vi sinh vào lúc đất khô hạn, nắng gắt?", "options": ["A. Vì vi sinh vật dễ chết, hiệu quả phân giảm mạnh.", "B. Vì phân sẽ bay hơi hết.", "C. Vì cây không cần dinh dưỡng lúc nắng.", "D. Vì đất khô làm phân biến chất."], "answer": "A", "explain": "Nắng gắt, khô hạn giết chết VSV; nên bón lúc đất đủ ẩm, trời mát.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân vi sinh có thể thay thế hoàn toàn phân hữu cơ và phân vô cơ không? Vì sao?", "options": ["A. Không, vì tác dụng chậm và chỉ bổ sung một phần dinh dưỡng; cần kết hợp các loại phân.", "B. Có, vì phân vi sinh chứa đầy đủ mọi chất.", "C. Có, vì phân vi sinh rẻ nhất.", "D. Không, vì phân vi sinh gây ô nhiễm."], "answer": "A", "explain": "Phân vi sinh chỉ bổ sung, tác dụng chậm; cây vẫn cần phân hữu cơ, vô cơ cung cấp đủ và kịp thời dinh dưỡng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nông dân bón phân vi sinh vào ruộng đang khô nứt nẻ giữa trưa nắng gắt rồi phàn nàn phân không hiệu quả. Nguyên nhân và cách khắc phục đúng là gì?", "options": ["A. Vi sinh vật chết do khô hạn, nắng gắt; nên bón lúc đất đủ ẩm, trời mát và kết hợp phân hữu cơ.", "B. Phân vi sinh giả; nên đổi loại khác.", "C. Ruộng thiếu nước; chỉ cần tưới là phân có tác dụng ngay.", "D. Nên bón gấp đôi liều lượng."], "answer": "A", "explain": "Điều kiện bất lợi giết chết VSV; khắc phục bằng cách bón đúng lúc (đất ẩm, trời mát) và kết hợp chất hữu cơ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau về hạn chế của phân vi sinh:", "statements": ["a) Phân vi sinh có tác dụng chậm hơn phân hóa học.", "b) Hiệu quả phân vi sinh phụ thuộc độ ẩm, nhiệt độ của đất.", "c) Phân vi sinh có thời hạn sử dụng ngắn.", "d) Phân vi sinh gây ô nhiễm môi trường nghiêm trọng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: VSV chết dần theo thời gian. d) Sai: phân vi sinh thân thiện môi trường.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về sử dụng phân vi sinh:", "statements": ["a) Nên bón phân vi sinh khi đất đủ ẩm, trời mát.", "b) Kết hợp phân vi sinh với phân hữu cơ cho hiệu quả cao hơn.", "c) Phân vi sinh quá hạn sử dụng vẫn cho hiệu quả như ban đầu.", "d) Có thể dùng phân vi sinh để giảm bớt phân hóa học."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: quá hạn VSV chết nhiều, hiệu quả giảm. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 2 hạn chế của phân vi sinh.", "answer": "tác dụng chậm, hiệu quả phụ thuộc điều kiện đất đai", "explain": "Hạn chế: tác dụng chậm; hiệu quả phụ thuộc độ ẩm, nhiệt độ, pH đất; thời hạn sử dụng ngắn; không thay thế hoàn toàn các loại phân khác.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nên bón phân vi sinh vào thời điểm nào trong ngày để đạt hiệu quả cao? Vì sao? (Trả lời ngắn)", "answer": "sáng sớm hoặc chiều mát vì tránh nắng gắt làm chết vi sinh vật", "explain": "Bón lúc sáng sớm hoặc chiều mát, đất đủ ẩm để VSV sống và hoạt động tốt; tránh nắng gắt giữa trưa.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "So với phân hóa học, phân vi sinh có tác dụng như thế nào?", "options": ["A. Chậm hơn nhưng bền vững và an toàn hơn.", "B. Nhanh hơn và mạnh hơn.", "C. Hoàn toàn giống nhau.", "D. Không có tác dụng gì."], "answer": "A", "explain": "Phân vi sinh tác dụng chậm (VSV cần thời gian) nhưng an toàn, bền vững, cải tạo đất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "So với phân hóa học, phân vi sinh khác biệt cơ bản ở điểm nào?", "options": ["A. Chứa vi sinh vật sống có ích thay vì chất dinh dưỡng hóa học.", "B. Chứa nhiều đạm hơn.", "C. Có màu sắc đẹp hơn.", "D. Không cần bảo quản."], "answer": "A", "explain": "Phân vi sinh chứa VSV sống; phân hóa học chứa chất dinh dưỡng dạng muối khoáng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các tiêu chí sau, tiêu chí nào phân vi sinh vượt trội hơn phân hóa học?", "options": ["A. An toàn môi trường và cải tạo đất.", "B. Tốc độ tác dụng.", "C. Hàm lượng dinh dưỡng.", "D. Tính chính xác của liều lượng."], "answer": "A", "explain": "Phân vi sinh vượt trội về an toàn môi trường và cải tạo đất; phân hóa học vượt trội về tốc độ và hàm lượng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao xu hướng hiện nay là giảm phân hóa học, tăng phân vi sinh và hữu cơ?", "options": ["A. Vì hướng tới nền nông nghiệp bền vững, an toàn thực phẩm và bảo vệ môi trường.", "B. Vì phân hóa học đã hết trên thị trường.", "C. Vì phân vi sinh rẻ hơn nhiều.", "D. Vì không có lí do gì."], "answer": "A", "explain": "Lạm dụng phân hóa học gây ô nhiễm, suy thoái đất; phân vi sinh, hữu cơ hướng tới bền vững.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cách sử dụng phân bón nào sau đây là bền vững nhất?", "options": ["A. Kết hợp phân hữu cơ, phân vi sinh và phân hóa học hợp lí theo nguyên tắc 4 đúng.", "B. Chỉ dùng phân hóa học.", "C. Chỉ dùng phân vi sinh.", "D. Không bón phân gì."], "answer": "A", "explain": "Kết hợp hài hòa các loại phân theo 4 đúng vừa đảm bảo năng suất vừa bảo vệ đất và môi trường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vùng chuyên canh rau bị ô nhiễm nitrat do lạm dụng phân đạm hóa học nhiều năm. Giải pháp lâu dài đúng hướng là gì?", "options": ["A. Giảm phân hóa học, tăng phân hữu cơ hoai mục và phân vi sinh, bón theo 4 đúng.", "B. Ngừng trồng rau.", "C. Tăng gấp đôi phân hóa học.", "D. Chuyển sang trồng cây khác mà vẫn lạm dụng phân."], "answer": "A", "explain": "Giải pháp bền vững: giảm hóa học, tăng hữu cơ, vi sinh, tuân thủ 4 đúng để phục hồi đất và đảm bảo an toàn.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định sau khi so sánh phân vi sinh và phân hóa học:", "statements": ["a) Phân hóa học tác dụng nhanh hơn phân vi sinh.", "b) Phân vi sinh an toàn với môi trường hơn phân hóa học.", "c) Phân hóa học có hàm lượng dinh dưỡng cao hơn phân vi sinh.", "d) Phân vi sinh cải tạo đất tốt hơn phân hóa học."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: cả 4 nhận định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về so sánh phân vi sinh và phân hóa học:", "statements": ["a) Lạm dụng phân hóa học gây ô nhiễm môi trường và suy thoái đất.", "b) Kết hợp các loại phân theo 4 đúng là hướng canh tác bền vững.", "c) Phân vi sinh có thể thay thế hoàn toàn phân hóa học trong mọi trường hợp.", "d) Giảm phân hóa học, tăng hữu cơ và vi sinh giúp nông sản an toàn hơn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cần kết hợp, không thay thế hoàn toàn. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 1 điểm giống và 1 điểm khác nhau cơ bản giữa phân vi sinh và phân hóa học.", "answer": "giống: đều cung cấp dinh dưỡng cho cây; khác: phân vi sinh chứa vi sinh vật sống, phân hóa học chứa muối khoáng", "explain": "Giống: đều nhằm cung cấp dinh dưỡng cho cây. Khác: phân vi sinh chứa VSV sống, tác dụng chậm, an toàn; phân hóa học chứa muối khoáng, tác dụng nhanh.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hướng sử dụng phân bón bền vững hiện nay.", "answer": "kết hợp phân hữu cơ, phân vi sinh và phân hóa học hợp lí", "explain": "Hướng bền vững: giảm phân hóa học, tăng phân hữu cơ và phân vi sinh, bón theo nguyên tắc 4 đúng.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Phân vi sinh là gì?", "options": ["A. Phân bón chứa các vi sinh vật có ích như VSV cố định đạm, phân giải lân.", "B. Phân bón chứa thuốc trừ sâu.", "C. Phân bón làm từ nilon tái chế.", "D. Phân bón chỉ dùng cho cây cảnh."], "answer": "A", "explain": "Phân vi sinh chứa các VSV có ích: cố định đạm, phân giải lân, phân giải chất hữu cơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vi khuẩn Rhizobium có vai trò gì trong sản xuất phân bón?", "options": ["A. Cố định đạm, dùng để sản xuất phân vi sinh cố định đạm.", "B. Phân giải lân.", "C. Phân giải xenlulozơ.", "D. Diệt sâu bệnh."], "answer": "A", "explain": "Rhizobium là VSV cố định đạm điển hình, dùng sản xuất phân vi sinh cố định đạm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ưu điểm chung lớn nhất của việc ứng dụng công nghệ vi sinh trong sản xuất phân bón là gì?", "options": ["A. Tạo ra phân bón an toàn, thân thiện môi trường, góp phần phát triển nông nghiệp bền vững.", "B. Tạo ra phân bón tác dụng nhanh nhất.", "C. Không cần nguyên liệu gì.", "D. Giá thành bằng không."], "answer": "A", "explain": "Công nghệ vi sinh tạo phân bón an toàn, bảo vệ môi trường, hướng tới nông nghiệp bền vững.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một học sinh nói: \"Bón phân vi sinh là bón vi sinh vật có ích vào đất để chúng giúp cây lấy được dinh dưỡng\". Nhận xét đúng là gì?", "options": ["A. Đúng: VSV cố định đạm, phân giải lân, phân giải hữu cơ giúp cây hấp thu dinh dưỡng tốt hơn.", "B. Sai: vi sinh vật không có ích gì.", "C. Sai: phải bón xác vi sinh vật chết.", "D. Đúng một phần: chỉ có tác dụng diệt sâu."], "answer": "A", "explain": "Nói đúng bản chất: VSV sống hoạt động trong đất, chuyển hóa dinh dưỡng khó tiêu thành dễ tiêu cho cây.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sơ đồ nào sau đây mô tả đúng vai trò của vi sinh vật phân giải lân?", "options": ["A. Lân khó tan trong đất, nhờ VSV phân giải lân thành lân dễ tiêu, cây hấp thu được.", "B. Lân dễ tiêu nhờ VSV thành lân khó tan.", "C. VSV hút hết lân trong đất.", "D. VSV biến lân thành đạm."], "answer": "A", "explain": "VSV phân giải lân chuyển lân khó tan thành lân dễ tiêu cho cây hấp thu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trang trại trồng đậu tương áp dụng: trộn hạt với chế phẩm Rhizobium, bón lót phân hữu cơ ủ với chế phẩm vi sinh, giảm một nửa phân đạm hóa học. Đánh giá đúng là gì?", "options": ["A. Mô hình ứng dụng tốt công nghệ vi sinh: tiết kiệm phân hóa học, cải tạo đất, bền vững.", "B. Mô hình sai vì không nên giảm phân hóa học.", "C. Mô hình sai vì không nên dùng phân vi sinh.", "D. Mô hình không có ý nghĩa gì."], "answer": "A", "explain": "Mô hình kết hợp đúng: VSV cố định đạm giảm phân đạm, VSV phân giải hữu cơ xử lí phân chuồng, rơm rạ — bền vững.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các nhận định tổng hợp sau về công nghệ vi sinh trong sản xuất phân bón:", "statements": ["a) Vi sinh vật cố định đạm biến N2 thành đạm cây dùng được.", "b) Vi sinh vật phân giải lân biến lân khó tan thành dễ tiêu.", "c) Vi sinh vật phân giải chất hữu cơ tạo mùn, cải tạo đất.", "d) Cả ba nhóm vi sinh vật trên đều được dùng để sản xuất phân vi sinh."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: cả ba nhóm đều là thành phần của các loại phân vi sinh.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về công nghệ vi sinh trong sản xuất phân bón:", "statements": ["a) Quy trình sản xuất phân vi sinh gồm: chọn chủng, nuôi cấy, phối trộn chất mang, đóng gói.", "b) Phân vi sinh an toàn nhưng tác dụng chậm, cần dùng kết hợp với các loại phân khác.", "c) Bón phân vi sinh lúc đất khô, nắng gắt cho hiệu quả cao nhất.", "d) Ứng dụng công nghệ vi sinh góp phần phát triển nông nghiệp bền vững."], "answer": ["T", "T", "F", "T"
