{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Trồng trọt có vai trò quan trọng nhất nào đối với đời sống con người?", "options": ["A. Cung cấp lương thực, thực phẩm hằng ngày", "B. Cung cấp điện năng cho sinh hoạt", "C. Khai thác khoáng sản dưới lòng đất", "D. Sản xuất đồ điện tử tiêu dùng"], "answer": "A", "explain": "Vai trò trước hết và quan trọng nhất của trồng trọt là cung cấp lương thực, thực phẩm (lúa gạo, ngô, khoai, rau, quả...) cho con người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây mía được trồng chủ yếu để cung cấp nguyên liệu cho ngành công nghiệp nào?", "options": ["A. Công nghiệp dệt may", "B. Công nghiệp sản xuất đường", "C. Công nghiệp đóng tàu", "D. Công nghiệp luyện kim"], "answer": "B", "explain": "Mía là cây công nghiệp cung cấp nguyên liệu chính cho công nghiệp sản xuất đường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhóm cây nào sau đây thuộc nhóm cây lương thực?", "options": ["A. Cà phê, cao su, hồ tiêu", "B. Lúa, ngô, khoai lang, sắn", "C. Xoài, nhãn, vải, sầu riêng", "D. Hoa hồng, hoa lan, đào, mai"], "answer": "B", "explain": "Lúa, ngô, khoai lang, sắn là các cây lương thực chính; các nhóm còn lại là cây công nghiệp, cây ăn quả và hoa cây cảnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận định nào sau đây thể hiện đúng vai trò của trồng trọt đối với chăn nuôi?", "options": ["A. Trồng trọt cung cấp thức ăn (ngô, sắn, cỏ voi...) cho vật nuôi", "B. Trồng trọt thay thế hoàn toàn thức ăn công nghiệp", "C. Chăn nuôi không cần đến sản phẩm trồng trọt", "D. Trồng trọt chỉ phục vụ xuất khẩu, không liên quan chăn nuôi"], "answer": "A", "explain": "Trồng trọt cung cấp nguồn thức ăn quan trọng cho chăn nuôi như ngô, sắn, cỏ voi, phụ phẩm nông nghiệp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các công nghệ sau, công nghệ nào KHÔNG thuộc xu hướng nông nghiệp thông minh trong trồng trọt?", "options": ["A. Cảm biến độ ẩm đất kết nối IoT", "B. Máy bay không người lái (drone) phun thuốc", "C. Cày bừa bằng trâu bò thủ công", "D. Nhà kính điều khiển tự động"], "answer": "C", "explain": "Cày bừa bằng trâu bò là phương thức canh tác thủ công truyền thống, không phải công nghệ của nông nghiệp thông minh 4.0.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một hợp tác xã ở Đà Lạt đầu tư nhà màng, cảm biến và tưới tự động để trồng rau đạt chuẩn VietGAP cung cấp cho siêu thị. Mô hình này thể hiện triển vọng nào của trồng trọt?", "options": ["A. Quay lại canh tác thủ công truyền thống", "B. Ứng dụng công nghệ cao và sản xuất theo tiêu chuẩn an toàn", "C. Chỉ trồng cây lương thực phục vụ địa phương", "D. Từ bỏ sản xuất nông nghiệp"], "answer": "B", "explain": "Nhà màng, cảm biến, tưới tự động là công nghệ cao; đạt chuẩn VietGAP là sản xuất an toàn, hướng tới thị trường chất lượng cao.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về vai trò của trồng trọt:", "statements": ["a) Trồng trọt cung cấp lương thực, thực phẩm cho con người.", "b) Trồng trọt cung cấp nguyên liệu cho công nghiệp chế biến như mía cho nhà máy đường.", "c) Trồng trọt tạo việc làm và thu nhập cho người nông dân.", "d) Trồng trọt làm tăng ô nhiễm môi trường nên không có vai trò bảo vệ môi trường."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: xuất khẩu nông sản tạo việc làm, thu nhập. d) Sai: cây xanh góp phần điều hòa khí hậu, chống xói mòn, làm đẹp cảnh quan.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về triển vọng của trồng trọt:", "statements": ["a) Ứng dụng IoT, AI, drone giúp trồng trọt chính xác, tiết kiệm vật tư.", "b) Giống cây trồng mới có khả năng chống chịu sâu bệnh và thích ứng biến đổi khí hậu.", "c) Trồng trọt hữu cơ sử dụng phân hữu cơ, chế phẩm sinh học thay cho hóa chất.", "d) Cơ giới hóa làm giảm năng suất lao động trong trồng trọt."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: công nghệ 4.0 giúp canh tác chính xác. b) Đúng: công nghệ sinh học tạo giống mới ưu việt. c) Đúng: đó là đặc trưng của sản xuất hữu cơ. d) Sai: cơ giới hóa làm TĂNG năng suất lao động.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên ba mặt hàng nông sản xuất khẩu chủ lực của Việt Nam có nguồn gốc từ trồng trọt.", "answer": "Gạo, cà phê, hồ tiêu (chấp nhận: điều, cao su, thanh long, chè)", "explain": "Việt Nam là nước xuất khẩu hàng đầu thế giới về gạo, cà phê, hồ tiêu, điều... — đều là sản phẩm của ngành trồng trọt.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai lợi ích của việc dùng máy bay không người lái (drone) phun thuốc bảo vệ thực vật so với phun tay.", "answer": "Phun nhanh, đều; giảm tiếp xúc hóa chất cho nông dân (chấp nhận: tiết kiệm thuốc, tiết kiệm nhân công)", "explain": "Drone phun nhanh gấp nhiều lần, đều hơn, giúp nông dân tránh tiếp xúc trực tiếp với hóa chất độc hại và tiết kiệm thuốc.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Đối tượng sản xuất chính của ngành trồng trọt là gì?", "options": ["A. Vật nuôi", "B. Cây trồng", "C. Máy móc nông nghiệp", "D. Đất đai hoang hóa"], "answer": "B", "explain": "Trồng trọt là ngành sản xuất lấy cây trồng làm đối tượng, nhằm tạo ra sản phẩm phục vụ con người.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây bông được trồng chủ yếu để cung cấp nguyên liệu cho ngành công nghiệp nào?", "options": ["A. Công nghiệp dệt may", "B. Công nghiệp giấy", "C. Công nghiệp xi măng", "D. Công nghiệp ô tô"], "answer": "A", "explain": "Bông là cây công nghiệp cung cấp nguyên liệu cho công nghiệp dệt may.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây nào sau đây thuộc nhóm cây công nghiệp?", "options": ["A. Lúa", "B. Cà phê", "C. Rau muống", "D. Xoài"], "answer": "B", "explain": "Cà phê là cây công nghiệp dài ngày; lúa là cây lương thực, rau muống là cây rau, xoài là cây ăn quả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nói trồng trọt góp phần bảo vệ môi trường?", "options": ["A. Vì cây xanh điều hòa khí hậu, chống xói mòn đất, làm đẹp cảnh quan", "B. Vì trồng trọt không cần dùng nước", "C. Vì trồng trọt thải nhiều khí độc", "D. Vì trồng trọt làm đất bạc màu nhanh"], "answer": "A", "explain": "Cây xanh quang hợp, che phủ đất chống xói mòn, điều hòa tiểu khí hậu và tạo cảnh quan — đó là đóng góp môi trường của trồng trọt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Xu hướng nào sau đây phù hợp với trồng trọt bền vững?", "options": ["A. Lạm dụng phân bón hóa học và thuốc trừ sâu", "B. Sử dụng phân hữu cơ, chế phẩm sinh học, giảm hóa chất", "C. Đốt rơm rạ sau mỗi vụ thu hoạch", "D. Canh tác độc canh liên tục không luân canh"], "answer": "B", "explain": "Trồng trọt bền vững/hữu cơ hướng tới giảm hóa chất, dùng phân hữu cơ và chế phẩm sinh học để bảo vệ đất, nước và sức khỏe.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vùng Tây Nguyên của Việt Nam nổi tiếng với nhóm cây trồng nào?", "options": ["A. Cây lương thực như lúa nước", "B. Cây công nghiệp như cà phê, hồ tiêu, điều", "C. Cây rau ôn đới", "D. Cây dược liệu vùng núi cao"], "answer": "B", "explain": "Tây Nguyên có đất đỏ bazan màu mỡ, khí hậu phù hợp nên nổi tiếng với cà phê, hồ tiêu, điều, cao su.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về các nhóm cây trồng ở Việt Nam:", "statements": ["a) Lúa, ngô, khoai, sắn thuộc nhóm cây lương thực.", "b) Cà phê, cao su, hồ tiêu, điều thuộc nhóm cây công nghiệp.", "c) Xoài, nhãn, vải, sầu riêng thuộc nhóm cây ăn quả.", "d) Hoa hồng, hoa lan, đào, mai thuộc nhóm cây dược liệu."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo phân nhóm SGK. d) Sai: hoa hồng, hoa lan, đào, mai thuộc nhóm hoa và cây cảnh.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Một địa phương muốn phát triển trồng trọt theo hướng công nghệ cao. Xét tính đúng, sai của các giải pháp sau:", "statements": ["a) Lắp cảm biến độ ẩm đất và hệ thống tưới tự động.", "b) Dùng drone để giám sát sinh trưởng và phun thuốc.", "c) Trồng trong nhà màng, nhà lưới điều khiển nhiệt độ, ẩm độ.", "d) Giữ nguyên cách làm thủ công, không đầu tư máy móc."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: đều là công nghệ cao trong trồng trọt. d) Sai: giữ thủ công đi ngược hướng công nghệ cao.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai ví dụ về cây công nghiệp dài ngày được trồng nhiều ở Việt Nam.", "answer": "Cà phê, cao su (chấp nhận: hồ tiêu, điều, chè)", "explain": "Cà phê, cao su, hồ tiêu, điều, chè là những cây công nghiệp dài ngày chủ lực của Việt Nam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích vì sao phát triển giống cây trồng mới được xem là triển vọng quan trọng của trồng trọt.", "answer": "Giống mới cho năng suất cao, chất lượng tốt, chống chịu sâu bệnh và thích ứng biến đổi khí hậu (chấp nhận ý tương đương)", "explain": "Nhờ công nghệ sinh học, giống mới giúp tăng năng suất, giảm rủi ro sâu bệnh, thích ứng biến đổi khí hậu — then chốt cho an ninh lương thực.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Sản phẩm nào sau đây KHÔNG phải là sản phẩm của ngành trồng trọt?", "options": ["A. Gạo", "B. Cà phê nhân", "C. Thịt lợn", "D. Quả thanh long"], "answer": "C", "explain": "Thịt lợn là sản phẩm của ngành chăn nuôi; gạo, cà phê, thanh long đều là sản phẩm trồng trọt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhóm cây trồng nào cung cấp quả tươi giàu vitamin cho con người?", "options": ["A. Cây lương thực", "B. Cây ăn quả", "C. Cây công nghiệp", "D. Cây lấy gỗ"], "answer": "B", "explain": "Cây ăn quả (xoài, cam, chuối...) cung cấp quả tươi giàu vitamin và khoáng chất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "IoT trong nông nghiệp thông minh được hiểu là gì?", "options": ["A. Mạng lưới các thiết bị, cảm biến kết nối internet để giám sát và điều khiển", "B. Một loại phân bón mới", "C. Một giống lúa mới", "D. Một loại thuốc trừ sâu"], "answer": "A", "explain": "IoT (Internet vạn vật) là mạng lưới cảm biến, thiết bị kết nối internet giúp giám sát và điều khiển sản xuất từ xa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận định nào sau đây đúng về vai trò xuất khẩu của trồng trọt ở Việt Nam?", "options": ["A. Nông sản Việt Nam như gạo, cà phê, hồ tiêu, điều vươn ra thị trường thế giới", "B. Việt Nam không xuất khẩu nông sản", "C. Xuất khẩu nông sản làm giảm thu nhập nông dân", "D. Chỉ xuất khẩu được rau quả, không xuất khẩu được lương thực"], "answer": "A", "explain": "Việt Nam thuộc nhóm nước xuất khẩu gạo, cà phê, hồ tiêu, điều hàng đầu thế giới, mang lại ngoại tệ và thu nhập cho nông dân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cơ giới hóa được coi là triển vọng của trồng trọt?", "options": ["A. Vì máy móc giúp tăng năng suất lao động, giảm sức lao động thủ công", "B. Vì máy móc làm đất bạc màu nhanh hơn", "C. Vì cơ giới hóa không cần vốn đầu tư", "D. Vì máy móc thay thế hoàn toàn kiến thức nông dân"], "answer": "A", "explain": "Máy làm đất, máy gieo, máy thu hoạch giúp làm nhanh, giảm lao động thủ công nặng nhọc và tăng năng suất lao động.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đồng bằng sông Cửu Long được mệnh danh là gì nhờ vai trò trồng trọt?", "options": ["A. Vựa lúa lớn nhất cả nước", "B. Thủ phủ cà phê", "C. Vùng chè lớn nhất", "D. Xứ sở hoa đào"], "answer": "A", "explain": "Đồng bằng sông Cửu Long với đất phù sa màu mỡ là vựa lúa lớn nhất Việt Nam, đóng góp lớn vào xuất khẩu gạo.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ngô, sắn, cỏ voi có thể dùng làm thức ăn chăn nuôi.", "b) Cao su là nguyên liệu cho công nghiệp chế biến cao su.", "c) Trồng trọt chỉ có vai trò cung cấp lương thực, không liên quan đến công nghiệp.", "d) Cây xanh trong trồng trọt góp phần làm đẹp cảnh quan."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: trồng trọt còn cung cấp nguyên liệu cho công nghiệp chế biến. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nông nghiệp 4.0:", "statements": ["a) AI có thể phân tích ảnh để phát hiện sớm sâu bệnh hại cây trồng.", "b) Dữ liệu lớn (big data) giúp dự báo thời tiết, dịch bệnh phục vụ sản xuất.", "c) Nhà kính thông minh tự điều chỉnh nhiệt độ, ẩm độ theo nhu cầu cây.", "d) Nông nghiệp 4.0 có nghĩa là từ bỏ hoàn toàn kiến thức canh tác truyền thống."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: đều là ứng dụng của cách mạng 4.0. d) Sai: công nghệ 4.0 kết hợp và nâng cao chứ không phủ nhận kiến thức canh tác.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên hai loại hoa, cây cảnh nổi tiếng được trồng nhiều ở Việt Nam.", "answer": "Hoa hồng, hoa lan (chấp nhận: hoa cúc, đào, mai, quất cảnh)", "explain": "Việt Nam có nhiều vùng hoa nổi tiếng: hoa hồng, hoa lan Đà Lạt; đào Nhật Tân; mai vàng miền Nam...", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao nông sản đạt chuẩn VietGAP, GlobalGAP có triển vọng xuất khẩu tốt hơn?", "answer": "Vì đáp ứng tiêu chuẩn an toàn, chất lượng của thị trường quốc tế (chấp nhận: được thị trường khó tính chấp nhận, giá cao hơn)", "explain": "VietGAP/GlobalGAP chứng nhận quy trình sản xuất an toàn, truy xuất được nguồn gốc — điều kiện để vào siêu thị và thị trường xuất khẩu.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Trồng trọt thuộc lĩnh vực sản xuất nào?", "options": ["A. Nông nghiệp", "B. Công nghiệp nặng", "C. Dịch vụ du lịch", "D. Khai thác mỏ"], "answer": "A", "explain": "Trồng trọt là một ngành sản xuất của nông nghiệp, lấy cây trồng làm đối tượng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây nào sau đây thuộc nhóm cây rau?", "options": ["A. Cà phê", "B. Rau muống", "C. Cao su", "D. Sầu riêng"], "answer": "B", "explain": "Rau muống là cây rau cung cấp rau xanh hằng ngày; cà phê, cao su là cây công nghiệp; sầu riêng là cây ăn quả.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trí tuệ nhân tạo (AI) có thể hỗ trợ trồng trọt bằng cách nào?", "options": ["A. Phân tích hình ảnh để phát hiện sâu bệnh sớm", "B. Thay thế hoàn toàn ánh sáng mặt trời", "C. Tạo ra đất trồng từ không khí", "D. Làm cây sinh trưởng không cần nước"], "answer": "A", "explain": "AI phân tích ảnh từ camera/drone để phát hiện sớm sâu bệnh, đánh giá sinh trưởng cây trồng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau cơ bản giữa cây lương thực và cây công nghiệp là gì?", "options": ["A. Cây lương thực cung cấp lương thực cho con người; cây công nghiệp cung cấp nguyên liệu cho công nghiệp chế biến", "B. Cây lương thực chỉ trồng ở đồng bằng, cây công nghiệp chỉ trồng ở miền núi", "C. Cây lương thực không cần chăm sóc, cây công nghiệp cần chăm sóc", "D. Không có điểm khác nhau"], "answer": "A", "explain": "Phân biệt theo mục đích sử dụng: lương thực phục vụ ăn uống trực tiếp; công nghiệp phục vụ chế biến nguyên liệu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biện pháp nào sau đây giúp nông sản Việt Nam mở rộng thị trường xuất khẩu?", "options": ["A. Sản xuất theo tiêu chuẩn VietGAP, GlobalGAP", "B. Sử dụng bừa bãi thuốc bảo vệ thực vật", "C. Bán nông sản không rõ nguồn gốc", "D. Giảm chất lượng để hạ giá thành"], "answer": "A", "explain": "Đạt chuẩn VietGAP/GlobalGAP chứng minh sản xuất an toàn, là điều kiện vào siêu thị và thị trường quốc tế khó tính.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Làng hoa Sa Đéc (Đồng Tháp) và Đà Lạt nổi tiếng với nhóm cây trồng nào?", "options": ["A. Cây lương thực", "B. Cây công nghiệp", "C. Hoa và cây cảnh", "D. Cây dược liệu"], "answer": "C", "explain": "Sa Đéc, Đà Lạt là những vùng chuyên canh hoa, cây cảnh nổi tiếng cả nước.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trồng trọt là ngành sản xuất lấy cây trồng làm đối tượng.", "b) Cây dược liệu như đinh lăng, atisô dùng làm thuốc chữa bệnh.", "c) Cây công nghiệp chỉ gồm các cây ngắn ngày như mía, bông.", "d) Rau muống, bắp cải, cà chua thuộc nhóm cây rau."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cây công nghiệp có cả dài ngày (cà phê, cao su, hồ tiêu, điều, chè) và ngắn ngày (mía, bông, lạc). d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về thách thức và triển vọng:", "statements": ["a) Biến đổi khí hậu là thách thức lớn đối với trồng trọt.", "b) Giống cây trồng chống chịu giúp thích ứng với biến đổi khí hậu.", "c) Trồng trọt công nghệ cao giúp tiết kiệm nước, phân bón.", "d) Việt Nam không có tiềm năng phát triển trồng trọt công nghệ cao."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: hạn hán, lũ lụt, sâu bệnh gia tăng. b) Đúng. c) Đúng: tưới, bón chính xác theo nhu cầu. d) Sai: Việt Nam đang phát triển mạnh nông nghiệp công nghệ cao.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai cây ăn quả có giá trị xuất khẩu cao của Việt Nam.", "answer": "Thanh long, sầu riêng (chấp nhận: vải thiều, nhãn, xoài, chôm chôm, bưởi)", "explain": "Thanh long Bình Thuận, sầu riêng, vải thiều Bắc Giang... là những cây ăn quả xuất khẩu chủ lực.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích ngắn gọn khái niệm nông nghiệp thông minh.", "answer": "Ứng dụng IoT, AI, big data, drone, tự động hóa để giám sát và điều khiển sản xuất chính xác (chấp nhận ý tương đương)", "explain": "Nông nghiệp thông minh dùng công nghệ số để canh tác chính xác: đúng lúc, đúng lượng, đúng chỗ.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Vai trò nào sau đây của trồng trọt liên quan trực tiếp đến bữa ăn hằng ngày?", "options": ["A. Cung cấp lương thực, thực phẩm", "B. Cung cấp nguyên liệu dệt may", "C. Xuất khẩu nông sản", "D. Làm đẹp cảnh quan"], "answer": "A", "explain": "Lương thực, thực phẩm (gạo, rau, quả, thịt từ chăn nuôi ăn thức ăn trồng trọt...) trực tiếp phục vụ bữa ăn hằng ngày.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây chè được xếp vào nhóm cây trồng nào?", "options": ["A. Cây lương thực", "B. Cây công nghiệp", "C. Cây ăn quả", "D. Cây rau"], "answer": "B", "explain": "Chè là cây công nghiệp dài ngày, cung cấp nguyên liệu cho công nghiệp chế biến chè.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Máy bay không người lái (drone) được dùng trong trồng trọt để làm gì?", "options": ["A. Phun thuốc, bón phân và giám sát đồng ruộng", "B. Thay thế hạt giống", "C. Làm chín quả trên cây", "D. Vận chuyển nông sản ra nước ngoài"], "answer": "A", "explain": "Drone phun thuốc, rải phân nhanh, đều và chụp ảnh giám sát sinh trưởng, phát hiện sâu bệnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tại sao các vành đai cây xanh quanh đô thị được coi là đóng góp của trồng trọt?", "options": ["A. Vì chúng điều hòa không khí, chống xói mòn, làm đẹp cảnh quan", "B. Vì chúng cung cấp lương thực chính", "C. Vì chúng thay thế nhà máy", "D. Vì chúng không cần chăm sóc"], "answer": "A", "explain": "Cây xanh đô thị, rừng trồng điều hòa tiểu khí hậu, giữ đất, làm đẹp không gian sống — vai trò môi trường của trồng trọt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đặc điểm của sản xuất trồng trọt hữu cơ là gì?", "options": ["A. Không dùng phân bón, thuốc hóa học; dùng phân hữu cơ, chế phẩm sinh học", "B. Dùng càng nhiều thuốc trừ sâu càng tốt", "C. Chỉ trồng cây trong nhà kính", "D. Không cần chăm sóc cây trồng"], "answer": "A", "explain": "Hữu cơ = nói không với hóa chất tổng hợp, dùng phân hữu cơ, chế phẩm sinh học, bảo vệ môi trường và sức khỏe.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nông dân muốn chuyển từ trồng lúa sang trồng thanh long xuất khẩu. Yếu tố nào cần cân nhắc đầu tiên?", "options": ["A. Điều kiện đất đai, khí hậu địa phương có phù hợp với cây thanh long không", "B. Màu sắc của quả thanh long", "C. Tên gọi của giống thanh long", "D. Số lượng nông dân trong xã"], "answer": "A", "explain": "Chọn cây trồng phải căn cứ điều kiện tự nhiên (đất, nước, khí hậu) — thanh long ưa nắng, thoát nước tốt, phù hợp Bình Thuận...", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Gạo là lương thực chính của người Việt Nam, có nguồn gốc từ cây lúa.", "b) Hồ tiêu, điều là cây công nghiệp mang lại giá trị xuất khẩu cao.", "c) Cây ăn quả cung cấp quả tươi giàu vitamin.", "d) Tất cả các cây trồng đều thuộc nhóm cây lương thực."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cây trồng chia nhiều nhóm: lương thực, công nghiệp, ăn quả, rau, hoa cây cảnh, dược liệu.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về trồng trọt bền vững:", "statements": ["a) Luân canh, xen canh giúp bảo vệ đất và hạn chế sâu bệnh.", "b) Lạm dụng thuốc trừ sâu gây ô nhiễm môi trường và mất an toàn thực phẩm.", "c) Đốt rơm rạ sau thu hoạch là biện pháp bảo vệ môi trường tốt.", "d) Tưới tiết kiệm giúp bảo vệ nguồn nước."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: đốt rơm rạ gây ô nhiễm không khí, nên tận dụng làm phân hữu cơ. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên hai cây dược liệu được trồng ở Việt Nam.", "answer": "Đinh lăng, atisô (chấp nhận: cà gai leo, sâm, ba kích)", "explain": "Đinh lăng, atisô, cà gai leo... là những cây dược liệu được trồng để làm thuốc.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai biểu hiện của cơ giới hóa trong trồng trọt.", "answer": "Máy làm đất, máy gieo hạt (chấp nhận: máy cấy, máy gặt đập liên hợp, máy thu hoạch)", "explain": "Cơ giới hóa đưa máy móc thay sức người: cày, bừa, gieo, cấy, thu hoạch bằng máy.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Ngành trồng trọt cung cấp thức ăn cho ngành nào sau đây?", "options": ["A. Ngành chăn nuôi", "B. Ngành khai thác dầu khí", "C. Ngành sản xuất ô tô", "D. Ngành hàng không"], "answer": "A", "explain": "Ngô, sắn, cỏ voi và phụ phẩm nông nghiệp là nguồn thức ăn quan trọng cho chăn nuôi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây vải thiều (Bắc Giang) thuộc nhóm cây trồng nào?", "options": ["A. Cây lương thực", "B. Cây công nghiệp", "C. Cây ăn quả", "D. Cây rau"], "answer": "C", "explain": "Vải thiều cho quả tươi, thuộc nhóm cây ăn quả, nổi tiếng ở Bắc Giang.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhà kính, nhà lưới trong trồng trọt có tác dụng gì?", "options": ["A. Điều khiển nhiệt độ, ẩm độ, hạn chế sâu bệnh cho cây", "B. Nuôi cá trong nhà", "C. Chứa máy móc không dùng đến", "D. Làm kho chứa phân bón"], "answer": "A", "explain": "Nhà kính/nhà lưới tạo môi trường được kiểm soát, giúp cây sinh trưởng tốt, giảm sâu bệnh, trồng trái vụ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Việt Nam có điều kiện thuận lợi để phát triển đa dạng các nhóm cây trồng?", "options": ["A. Khí hậu nhiệt đới ẩm, đất đai đa dạng từ đồng bằng đến trung du, miền núi", "B. Vì Việt Nam không có mùa đông", "C. Vì Việt Nam chỉ trồng được lúa", "D. Vì Việt Nam nhập khẩu toàn bộ giống cây"], "answer": "A", "explain": "Khí hậu nhiệt đới gió mùa, địa hình đa dạng tạo điều kiện trồng lúa ở đồng bằng, cà phê ở Tây Nguyên, chè ở trung du, rau ôn đới ở Đà Lạt...", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây đúng về triển vọng giống cây trồng?", "options": ["A. Công nghệ sinh học tạo ra giống mới năng suất cao, chống chịu tốt", "B. Giống cây trồng không thể cải tiến được nữa", "C. Chỉ dùng giống địa phương, không cần giống mới", "D. Giống mới luôn cho năng suất thấp hơn giống cũ"], "answer": "A", "explain": "Chọn tạo giống bằng công nghệ sinh học là hướng đột phá, tạo giống năng suất, chất lượng, chống chịu cao.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đào Nhật Tân (Hà Nội) và mai vàng miền Nam thuộc nhóm cây trồng nào và có giá trị gì?", "options": ["A. Hoa, cây cảnh; giá trị kinh tế và thẩm mĩ cao dịp Tết", "B. Cây lương thực; cung cấp gạo", "C. Cây công nghiệp; làm nguyên liệu giấy", "D. Cây dược liệu; chữa bệnh"], "answer": "A", "explain": "Đào, mai là hoa cây cảnh đặc trưng Tết, mang lại giá trị kinh tế cao cho người trồng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trồng trọt cung cấp nguyên liệu cho công nghiệp chế biến thực phẩm.", "b) Cây cao su cung cấp mủ cho công nghiệp chế biến cao su.", "c) Ngành trồng trọt không tạo ra việc làm cho nông dân.", "d) Xuất khẩu nông sản mang lại ngoại tệ cho đất nước."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: mía, sắn, rau quả... là nguyên liệu chế biến. b) Đúng. c) Sai: trồng trọt là sinh kế của hàng triệu nông dân. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định sau về ứng dụng công nghệ:", "statements": ["a) Cảm biến độ ẩm đất giúp tưới đúng lúc, tiết kiệm nước.", "b) Robot thu hoạch giúp giảm thiếu hụt lao động mùa vụ.", "c) Ứng dụng điện thoại giúp nông dân theo dõi giá cả, thời tiết.", "d) Công nghệ cao chỉ phù hợp với nước phát triển, Việt Nam không áp dụng được."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: Việt Nam đang ứng dụng mạnh công nghệ cao (Đà Lạt, nhà màng, drone...).", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai vai trò của trồng trọt đối với công nghiệp.", "answer": "Cung cấp nguyên liệu chế biến; cung cấp nông sản xuất khẩu tạo ngoại tệ (chấp nhận: mía cho nhà máy đường, bông cho dệt may, cao su...)", "explain": "Trồng trọt cung cấp nguyên liệu (mía, bông, cao su, sắn...) cho công nghiệp chế biến và hàng xuất khẩu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao nói biến đổi khí hậu vừa là thách thức vừa là động lực đổi mới của trồng trọt?", "answer": "Gây hạn, lũ, sâu bệnh nhưng thúc đẩy giống chống chịu và công nghệ thích ứng (chấp nhận ý tương đương)", "explain": "Biến đổi khí hậu đe dọa sản xuất, buộc ngành trồng trọt đổi mới giống, công nghệ tưới, nhà màng... để thích ứng.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Cây sắn (khoai mì) thuộc nhóm cây trồng nào?", "options": ["A. Cây lương thực", "B. Cây ăn quả", "C. Cây rau", "D. Hoa cây cảnh"], "answer": "A", "explain": "Sắn là cây lương thực (củ giàu tinh bột), đồng thời làm nguyên liệu chế biến và thức ăn chăn nuôi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tiêu chuẩn VietGAP trong trồng trọt hướng tới mục tiêu gì?", "options": ["A. Sản xuất nông sản an toàn, chất lượng, truy xuất được nguồn gốc", "B. Tăng diện tích trồng trọt bằng mọi giá", "C. Giảm giá thành bằng cách bỏ qua chất lượng", "D. Chỉ phục vụ xuất khẩu, không bán nội địa"], "answer": "A", "explain": "VietGAP là tiêu chuẩn thực hành nông nghiệp tốt của Việt Nam: an toàn, chất lượng, bảo vệ môi trường, truy xuất nguồn gốc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây hồ tiêu chủ yếu được trồng ở vùng nào của Việt Nam?", "options": ["A. Tây Nguyên và Đông Nam Bộ", "B. Đồng bằng sông Hồng", "C. Vùng núi Tây Bắc", "D. Duyên hải miền Trung khô hạn"], "answer": "A", "explain": "Hồ tiêu ưa khí hậu nóng ẩm, trồng nhiều ở Tây Nguyên (Gia Lai, Đắk Lắk) và Đông Nam Bộ (Bình Phước).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh trồng trọt truyền thống và trồng trọt công nghệ cao, điểm khác biệt lớn nhất là gì?", "options": ["A. Công nghệ cao dùng cảm biến, tự động hóa để canh tác chính xác; truyền thống dựa vào kinh nghiệm và lao động thủ công", "B. Truyền thống cho năng suất cao hơn", "C. Công nghệ cao không cần đất", "D. Không có khác biệt"], "answer": "A", "explain": "Cốt lõi của công nghệ cao là số hóa, tự động hóa, canh tác chính xác thay cho thủ công, cảm tính.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc trồng rừng, cây xanh quanh khu công nghiệp thể hiện vai trò nào của trồng trọt?", "options": ["A. Bảo vệ môi trường, điều hòa không khí, làm đẹp cảnh quan", "B. Cung cấp lương thực", "C. Cung cấp nguyên liệu dệt may", "D. Xuất khẩu nông sản"], "answer": "A", "explain": "Cây xanh hấp thụ khí thải, giảm bụi, điều hòa nhiệt độ — vai trò môi trường, cảnh quan.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một trang trại dùng hệ thống tưới nhỏ giọt kết hợp cảm biến độ ẩm. Lợi ích lớn nhất là gì?", "options": ["A. Tiết kiệm nước, tưới đúng nhu cầu cây, tăng năng suất", "B. Làm cây không cần ánh sáng", "C. Diệt hết cỏ dại", "D. Tăng diện tích đất"], "answer": "A", "explain": "Tưới nhỏ giọt + cảm biến đưa nước đúng gốc, đúng lúc cây cần: tiết kiệm nước, phân hòa tan, tăng năng suất.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sắn vừa là cây lương thực vừa làm nguyên liệu chế biến.", "b) Chè là cây công nghiệp dài ngày trồng nhiều ở trung du, miền núi.", "c) Cây rau cung cấp vitamin, chất xơ cho bữa ăn hằng ngày.", "d) Hoa, cây cảnh không mang lại giá trị kinh tế."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: hoa cây cảnh (đào, mai, lan...) mang lại giá trị kinh tế cao.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về định hướng phát triển:", "statements": ["a) Phát triển trồng trọt gắn với chế biến sâu để tăng giá trị nông sản.", "b) Xây dựng thương hiệu nông sản giúp nâng cao giá trị xuất khẩu.", "c) Ứng dụng công nghệ sau thu hoạch giúp giảm tổn thất nông sản.", "d) Nên mở rộng diện tích bằng cách phá rừng trồng cây công nghiệp."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: chế biến sâu, thương hiệu, bảo quản sau thu hoạch. d) Sai: phá rừng gây hậu quả môi trường nghiêm trọng, bị pháp luật cấm.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên hai vùng trồng chè nổi tiếng ở Việt Nam.", "answer": "Thái Nguyên, Lâm Đồng (chấp nhận: Phú Thọ, Yên Bái, Mộc Châu – Sơn La)", "explain": "Thái Nguyên (Tân Cương), Lâm Đồng (Bảo Lộc), Phú Thọ, Mộc Châu là những vùng chè nổi tiếng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai tác hại của việc lạm dụng thuốc bảo vệ thực vật hóa học.", "answer": "Ô nhiễm môi trường; mất an toàn thực phẩm, ảnh hưởng sức khỏe (chấp nhận: diệt thiên địch, kháng thuốc, tồn dư)", "explain": "Lạm dụng thuốc hóa học gây ô nhiễm đất, nước, tồn dư trên nông sản, ảnh hưởng sức khỏe và diệt sinh vật có ích.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Cây ngô (bắp) có thể dùng vào mục đích nào?", "options": ["A. Làm lương thực cho người và thức ăn chăn nuôi", "B. Làm nguyên liệu luyện thép", "C. Sản xuất xi măng", "D. Chế tạo linh kiện điện tử"], "answer": "A", "explain": "Ngô là cây lương thực đa năng: hạt làm lương thực, thức ăn chăn nuôi và nguyên liệu chế biến.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhóm cây trồng nào sau đây cho thu hoạch trong thời gian ngắn nhất?", "options": ["A. Cây rau ngắn ngày như rau muống, cải", "B. Cây công nghiệp dài ngày như cao su", "C. Cây ăn quả lâu năm như sầu riêng", "D. Cây lấy gỗ"], "answer": "A", "explain": "Rau ngắn ngày cho thu hoạch sau vài tuần; cây dài ngày, cây ăn quả lâu năm cần nhiều năm mới cho thu hoạch.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dữ liệu lớn (big data) giúp ích gì cho trồng trọt?", "options": ["A. Dự báo thời tiết, dịch bệnh để chủ động sản xuất", "B. Thay thế phân bón", "C. Làm đất tơi xốp", "D. Tăng diện tích canh tác"], "answer": "A", "explain": "Phân tích dữ liệu lớn giúp dự báo thời tiết, sâu bệnh, giá cả để nông dân chủ động kế hoạch sản xuất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cần phát triển chế biến sâu nông sản?", "options": ["A. Để tăng giá trị, kéo dài thời gian bảo quản và mở rộng thị trường", "B. Để giảm chất lượng nông sản", "C. Để nông dân không cần trồng trọt nữa", "D. Để tăng giá thành vô lý"], "answer": "A", "explain": "Chế biến sâu (sấy, đóng hộp, tinh chế...) nâng giá trị gia tăng, giảm tổn thất sau thu hoạch, mở rộng thị trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhận định nào đúng về cây công nghiệp dài ngày?", "options": ["A. Thời gian kiến thiết cơ bản dài, cho thu hoạch nhiều năm như cà phê, cao su", "B. Thu hoạch ngay sau khi gieo một tháng", "C. Không cần chăm sóc", "D. Chỉ trồng được một vụ rồi bỏ"], "answer": "A", "explain": "Cây công nghiệp dài ngày (cà phê, cao su, hồ tiêu...) cần vài năm kiến thiết, sau đó cho thu hoạch ổn định nhiều năm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Thanh long Bình Thuận thành công trên thị trường xuất khẩu nhờ yếu tố nào?", "options": ["A. Điều kiện khí hậu phù hợp, kĩ thuật chăm sóc tốt và đáp ứng tiêu chuẩn thị trường", "B. Trồng hoàn toàn tự nhiên không chăm sóc", "C. Chỉ bán ở chợ địa phương", "D. Không cần quan tâm chất lượng"], "answer": "A", "explain": "Bình Thuận nắng nhiều phù hợp thanh long; cộng với kĩ thuật (chong đèn trái vụ) và chuẩn an toàn nên xuất khẩu tốt.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ngô vừa làm lương thực vừa làm thức ăn chăn nuôi.", "b) Cây rau ngắn ngày cho thu hoạch nhanh, quay vòng vốn nhanh.", "c) Cây công nghiệp dài ngày cần thời gian kiến thiết cơ bản nhiều năm.", "d) Trồng trọt không liên quan đến an ninh lương thực quốc gia."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: trồng trọt (đặc biệt cây lương thực) là nền tảng của an ninh lương thực.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chế biến sâu giúp nông sản Việt Nam tăng giá trị xuất khẩu.", "b) Thương hiệu nông sản giúp người tiêu dùng tin tưởng, sẵn sàng trả giá cao hơn.", "c) Công nghệ sau thu hoạch (kho lạnh, sấy) giúp giảm hao hụt.", "d) Nông dân nên bán toàn bộ nông sản tươi, không cần chế biến."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: bán tươi dễ ép giá, hao hụt cao; chế biến tăng giá trị và chủ động thị trường.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai lợi ích của việc xây dựng thương hiệu cho nông sản Việt Nam.", "answer": "Tăng giá trị, uy tín; mở rộng thị trường xuất khẩu (chấp nhận: chống hàng giả, người tiêu dùng tin tưởng)", "explain": "Thương hiệu giúp nông sản được nhận diện, bán giá cao hơn, vào được thị trường khó tính và chống giả mạo.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích vì sao tưới nhỏ giọt tiết kiệm nước hơn tưới tràn.", "answer": "Nước đưa trực tiếp đến gốc cây, đúng lượng cần, giảm thất thoát do bốc hơi và chảy tràn (chấp nhận ý tương đương)", "explain": "Tưới nhỏ giọt cung cấp nước từng giọt tại vùng rễ, hạn chế bốc hơi và thấm sâu lãng phí như tưới tràn.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "An ninh lương thực của một quốc gia phụ thuộc chủ yếu vào ngành nào?", "options": ["A. Ngành trồng trọt (đặc biệt cây lương thực)", "B. Ngành khai thác khoáng sản", "C. Ngành sản xuất ô tô", "D. Ngành du lịch"], "answer": "A", "explain": "Cây lương thực (lúa, ngô, khoai, sắn) đảm bảo nguồn lương thực — nền tảng an ninh lương thực quốc gia.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây đinh lăng thuộc nhóm cây trồng nào?", "options": ["A. Cây dược liệu", "B. Cây lương thực", "C. Cây công nghiệp", "D. Cây rau"], "answer": "A", "explain": "Đinh lăng là cây dược liệu, dùng làm thuốc và thực phẩm chức năng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Robot trong nông nghiệp thông minh có thể làm việc gì?", "options": ["A. Thu hoạch, làm cỏ tự động", "B. Soạn giáo án", "C. Dạy học trực tuyến", "D. Khám bệnh cho người"], "answer": "A", "explain": "Robot nông nghiệp làm cỏ, thu hoạch, phân loại nông sản tự động, giảm thiếu lao động.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa trồng trọt và chăn nuôi thể hiện ở điểm nào?", "options": ["A. Trồng trọt cung cấp thức ăn cho chăn nuôi; phân chuồng từ chăn nuôi bón cho cây trồng", "B. Hai ngành hoàn toàn độc lập", "C. Chăn nuôi cung cấp giống cây trồng", "D. Trồng trọt gây hại cho chăn nuôi"], "answer": "A", "explain": "Hai ngành hỗ trợ nhau: cây trồng cho thức ăn gia súc; phân chuồng cải tạo đất trồng trọt — mô hình VAC là ví dụ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để rau quả đạt chuẩn an toàn khi đến tay người tiêu dùng, cần chú ý điều gì?", "options": ["A. Tuân thủ thời gian cách ly thuốc bảo vệ thực vật, truy xuất nguồn gốc", "B. Phun thuốc ngay trước khi thu hoạch", "C. Dùng thuốc cấm để rau đẹp", "D. Không cần ghi chép quá trình sản xuất"], "answer": "A", "explain": "Phải cách ly đủ thời gian sau phun thuốc, ghi nhật kí, truy xuất nguồn gốc — yêu cầu của VietGAP.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Mô hình VAC (vườn – ao – chuồng) thể hiện vai trò nào của trồng trọt?", "options": ["A. Kết hợp trồng trọt – chăn nuôi – nuôi trồng thủy sản, tận dụng phụ phẩm lẫn nhau", "B. Chỉ trồng cây lương thực", "C. Chỉ nuôi cá", "D. Tách biệt hoàn toàn các ngành"], "answer": "A", "explain": "VAC là mô hình kinh tế sinh thái: vườn cung cấp thức ăn, phân chuồng bón vườn, ao tận dụng chất thải — khép kín, hiệu quả.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) An ninh lương thực gắn liền với phát triển cây lương thực.", "b) Phân chuồng từ chăn nuôi có thể dùng bón cho cây trồng.", "c) Mô hình VAC kết hợp vườn, ao, chuồng một cách khép kín.", "d) Trồng trọt và chăn nuôi không hỗ trợ lẫn nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: hai ngành hỗ trợ chặt chẽ (thức ăn – phân bón).", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về sản xuất an toàn:", "statements": ["a) Cần cách ly đủ thời gian sau khi phun thuốc mới thu hoạch.", "b) Ghi nhật kí sản xuất giúp truy xuất nguồn gốc nông sản.", "c) Dùng thuốc trong danh mục cho phép, đúng liều lượng.", "d) Thuốc bảo vệ thực vật càng dùng nhiều càng an toàn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: nguyên tắc VietGAP. d) Sai: lạm dụng gây tồn dư, ô nhiễm, mất an toàn.", "points": 1}, {"type": "short", "level": "VDC", "q": "Mô hình VAC gồm những thành phần nào?", "answer": "Vườn, ao, chuồng (vườn cây – ao cá – chuồng trại chăn nuôi)", "explain": "VAC = Vườn (trồng trọt) – Ao (nuôi thủy sản) – Chuồng (chăn nuôi), tận dụng phụ phẩm khép kín.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai yêu cầu khi sử dụng thuốc bảo vệ thực vật để đảm bảo an toàn.", "answer": "Đúng thuốc, đúng liều; đảm bảo thời gian cách ly (chấp nhận: đúng lúc, đúng cách – nguyên tắc 4 đúng)", "explain": "Nguyên tắc 4 đúng: đúng thuốc, đúng liều lượng, đúng lúc, đúng cách; tuân thủ thời gian cách ly trước thu hoạch.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Sản phẩm trồng trọt nào sau đây là nguyên liệu cho công nghiệp chế biến thực phẩm?", "options": ["A. Sắn, mía, rau quả", "B. Quặng sắt", "C. Dầu mỏ", "D. Cát xây dựng"], "answer": "A", "explain": "Sắn (tinh bột), mía (đường), rau quả (đồ hộp, nước ép) là nguyên liệu chế biến thực phẩm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây atisô (Đà Lạt) thuộc nhóm cây trồng nào?", "options": ["A. Cây dược liệu", "B. Cây lương thực", "C. Cây công nghiệp", "D. Cây lấy gỗ"], "answer": "A", "explain": "Atisô là cây dược liệu nổi tiếng của Đà Lạt, dùng làm trà, thuốc bổ gan.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ứng dụng điện thoại thông minh giúp nông dân điều gì?", "options": ["A. Theo dõi thời tiết, giá cả, kĩ thuật canh tác", "B. Thay thế hoàn toàn ruộng đất", "C. Tự động thu hoạch không cần máy", "D. Tạo ra giống cây mới"], "answer": "A", "explain": "App nông nghiệp cung cấp dự báo thời tiết, giá cả thị trường, tư vấn kĩ thuật, kết nối tiêu thụ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cần bảo tồn và phát triển các giống cây trồng bản địa?", "options": ["A. Vì chúng thích nghi tốt với địa phương, là nguồn gen quý cho chọn tạo giống", "B. Vì chúng luôn cho năng suất cao nhất", "C. Vì không cần chăm sóc", "D. Vì chúng không bao giờ bị sâu bệnh"], "answer": "A", "explain": "Giống bản địa thích nghi địa phương, mang gen quý (chống chịu, chất lượng đặc sản) phục vụ lai tạo giống mới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đâu là biểu hiện của trồng trọt phát triển theo hướng hàng hóa?", "options": ["A. Sản xuất quy mô lớn, gắn với chế biến và thị trường tiêu thụ", "B. Chỉ trồng đủ ăn trong gia đình", "C. Không quan tâm chất lượng sản phẩm", "D. Bán lẻ manh mún không qua chế biến"], "answer": "A", "explain": "Sản xuất hàng hóa = quy mô lớn, chuyên canh, gắn chế biến – tiêu thụ, hướng tới thị trường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trước biến đổi khí hậu (hạn hán gia tăng), giải pháp trồng trọt nào là phù hợp nhất?", "options": ["A. Chọn giống chịu hạn, áp dụng tưới tiết kiệm, che phủ đất", "B. Tăng diện tích trồng cây cần nhiều nước", "C. Bỏ hoang đất nông nghiệp", "D. Tưới tràn liên tục cả ngày"], "answer": "A", "explain": "Thích ứng hạn hán: giống chịu hạn + tưới tiết kiệm (nhỏ giọt, phun mưa) + che phủ giữ ẩm là giải pháp tổng hợp đúng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sắn, mía là nguyên liệu cho công nghiệp chế biến.", "b) Atisô Đà Lạt là cây dược liệu có giá trị.", "c) Ứng dụng di động giúp nông dân cập nhật giá cả, thời tiết.", "d) Giống cây bản địa không có giá trị trong chọn tạo giống."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: giống bản địa là nguồn gen quý cho lai tạo.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Địa phương có đất đồi trung du muốn phát triển trồng trọt bền vững. Xét tính đúng, sai:", "statements": ["a) Trồng chè, cây ăn quả theo đường đồng mức chống xói mòn.", "b) Trồng xen cây họ đậu để cải tạo đất.", "c) Phủ xanh đất trống, đồi trọc bằng cây trồng phù hợp.", "d) Khai thác đất dốc để trồng cây ngắn ngày không cần biện pháp chống xói mòn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: canh tác theo đường đồng mức, xen họ đậu, phủ xanh. d) Sai: đất dốc cần biện pháp chống xói mòn bắt buộc.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai hướng đi giúp nông sản Việt Nam tăng giá trị trên thị trường.", "answer": "Chế biến sâu; xây dựng thương hiệu (chấp nhận: đạt chuẩn VietGAP/GlobalGAP, truy xuất nguồn gốc)", "explain": "Chế biến sâu tăng giá trị gia tăng; thương hiệu và chuẩn chất lượng giúp vào thị trường cao cấp, giá tốt hơn.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Kể tên hai công nghệ của cách mạng 4.0 đang được ứng dụng trong trồng trọt ở Việt Nam.", "answer": "IoT (cảm biến), drone (chấp nhận: AI, big data, nhà kính thông minh, robot)", "explain": "IoT, AI, big data, drone, nhà kính thông minh đang được ứng dụng ở Đà Lạt, ĐBSCL và nhiều vùng sản xuất lớn.", "points": 0.5}]}]}
