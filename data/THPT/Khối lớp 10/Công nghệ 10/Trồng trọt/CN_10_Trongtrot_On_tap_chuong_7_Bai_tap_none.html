{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các phát biểu sau, phát biểu nào nêu đúng bản chất của trồng trọt công nghệ cao?", "answer": "A", "explain": "Bản chất là ứng dụng đồng bộ KHCN hiện đại vào mọi khâu để sản xuất chính xác, nâng cao năng suất, chất lượng, hiệu quả và bền vững.", "points": 0.25, "options": ["A. Ứng dụng đồng bộ các thành tựu khoa học công nghệ hiện đại để sản xuất chính xác, hiệu quả và bền vững.", "B. Chỉ sử dụng máy móc thay sức người trong khâu làm đất.", "C. Chỉ trồng các giống cây biến đổi gen.", "D. Sản xuất nông nghiệp không cần quan tâm đến thị trường."]}, {"type": "mcq", "level": "NB", "q": "Nội dung nào sau đây thuộc về 'đặc điểm' chứ không phải 'vai trò' của trồng trọt công nghệ cao?", "answer": "A", "explain": "Vốn đầu tư lớn là đặc điểm (tính chất vốn có); các phương án còn lại là vai trò (tác dụng, ý nghĩa mang lại).", "points": 0.25, "options": ["A. Vốn đầu tư ban đầu lớn.", "B. Góp phần bảo vệ môi trường.", "C. Cung cấp nông sản an toàn cho xã hội.", "D. Thích ứng với biến đổi khí hậu."]}, {"type": "mcq", "level": "TH", "q": "Hệ thống nào sau đây thể hiện sự kết hợp giữa tưới nhỏ giọt và IoT?", "answer": "A", "explain": "Cảm biến (IoT) đo độ ẩm + tự động điều khiển tưới nhỏ giọt là sự kết hợp điển hình của hai công nghệ.", "points": 0.25, "options": ["A. Cảm biến độ ẩm đất tự động bật máy bơm tưới nhỏ giọt khi đất khô.", "B. Tưới bằng gáo múc nước từ ao.", "C. Dẫn nước từ sông vào ruộng bằng mương.", "D. Chờ mưa để tưới cho cây."]}, {"type": "mcq", "level": "TH", "q": "Vì sao thủy canh hồi lưu được xếp vào nhóm công nghệ cao?", "answer": "A", "explain": "Thủy canh hồi lưu kiểm soát chính xác dinh dưỡng qua hệ thống tự động, tiết kiệm nước, năng suất cao — đúng tiêu chí công nghệ cao.", "points": 0.25, "options": ["A. Vì kiểm soát chính xác dinh dưỡng, nước bằng hệ thống tuần hoàn tự động, cho năng suất cao, tiết kiệm tài nguyên.", "B. Vì không cần chăm sóc gì.", "C. Vì trồng được mọi loại cây trên thế giới.", "D. Vì không tốn chi phí."]}, {"type": "mcq", "level": "VD", "q": "Một trang trại ở Đà Lạt trồng hoa ly trong nhà kính, dùng cảm biến điều khiển nhiệt độ, tưới nhỏ giọt tự động và đèn LED điều khiển ra hoa. Mô hình này tích hợp bao nhiêu công nghệ cao đã học?", "answer": "A", "explain": "Mô hình tích hợp 4 công nghệ: nhà kính + tưới nhỏ giọt tự động + cảm biến/IoT + đèn LED — ví dụ điển hình của trồng trọt công nghệ cao tổng hợp.", "points": 0.25, "options": ["A. 4 công nghệ: nhà kính, tưới tự động, cảm biến/IoT, đèn LED.", "B. 1 công nghệ duy nhất.", "C. 2 công nghệ.", "D. Không có công nghệ nào."]}, {"type": "mcq", "level": "VDC", "q": "Lập luận: 'Muốn phát triển trồng trọt công nghệ cao ở Việt Nam, chỉ cần nhập khẩu thật nhiều máy móc hiện đại'. Đánh giá lập luận này.", "answer": "A", "explain": "Công nghệ cao cần đồng bộ: máy móc + nhân lực + vốn + thị trường + chính sách + mô hình phù hợp; chỉ nhập máy móc mà thiếu các yếu tố khác sẽ thất bại.", "points": 0.25, "options": ["A. Chưa đúng, vì còn cần nhân lực có trình độ, vốn, thị trường, chính sách và mô hình phù hợp điều kiện từng vùng.", "B. Hoàn toàn đúng, máy móc là tất cả.", "C. Hoàn toàn sai, không cần máy móc gì.", "D. Đúng vì Việt Nam thiếu máy móc."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau (kiến thức Bài 23):", "answer": ["T", "T", "T", "T"], "explain": "Tất cả đều đúng theo nội dung Bài 23.", "points": 1, "statements": ["a) Trồng trọt công nghệ cao ứng dụng các công nghệ hiện đại vào trồng trọt.", "b) Vốn đầu tư lớn là một đặc điểm của trồng trọt công nghệ cao.", "c) Trồng trọt công nghệ cao giúp tiết kiệm tài nguyên và bảo vệ môi trường.", "d) Ở Việt Nam, nhà màng trồng rau, hoa phát triển mạnh ở Đà Lạt."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau (kiến thức Bài 24):", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: drone phun thuốc, rải phân, gieo hạt, giám sát...",  "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vẫn phải cung cấp đầy đủ dinh dưỡng qua dung dịch.", "points": 1, "statements": ["a) Thủy canh là trồng cây trong dung dịch dinh dưỡng thay cho đất.", "b) Khí canh là rễ treo trong không khí, phun sương dinh dưỡng.", "c) Thủy canh hồi lưu dùng máy bơm tuần hoàn dung dịch.", "d) Trồng cây không dùng đất không cần cung cấp dinh dưỡng."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: khí canh phức tạp nhất, đòi hỏi kĩ thuật cao.", "points": 1, "statements": ["a) Nhà màng giúp trồng rau trái vụ, quanh năm.", "b) IoT giúp điều khiển trang trại từ xa qua điện thoại.", "c) Thủy canh tĩnh phù hợp với hộ gia đình vì đơn giản, rẻ.", "d) Khí canh là công nghệ đơn giản nhất trong chương VII."]}, {"type": "short", "level": "NB", "q": "Thủy canh và khí canh khác nhau ở điểm nào?", "answer": "thủy canh rễ trong dung dịch, khí canh rễ trong không khí", "explain": "Thủy canh: rễ ngập trong dung dịch dinh dưỡng; khí canh: rễ treo trong không khí, phun sương dinh dưỡng.", "points": 0.5}, {"type": "short", "level": "NB", "q": "Nêu một đặc điểm của trồng trọt công nghệ cao.", "answer": "vốn đầu tư lớn", "explain": "Các đặc điểm: vốn đầu tư lớn; công nghệ hiện đại; sản xuất tập trung quy mô lớn; lao động có trình độ; kiểm soát chặt chẽ; sản phẩm an toàn (nêu một là được).", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Yếu tố nào là điều kiện chung để áp dụng thành công mọi công nghệ cao trong chương VII?", "answer": "A", "explain": "Mọi công nghệ cao đều cần: vốn, nhân lực kĩ thuật và sự phù hợp với điều kiện — đây là điều kiện chung rút ra từ cả ba bài.", "points": 0.25, "options": ["A. Vốn đầu tư, nhân lực có trình độ và mô hình phù hợp điều kiện thực tế.", "B. Diện tích đất thật rộng.", "C. Khí hậu lạnh quanh năm.", "D. Giá nông sản luôn cao."]}, {"type": "mcq", "level": "NB", "q": "Trong các lợi ích sau, lợi ích nào là của chung của cả tưới nhỏ giọt và thủy canh hồi lưu?", "answer": "A", "explain": "Cả hai đều tiết kiệm nước vượt trội: tưới nhỏ giọt (đúng gốc, đúng lượng), thủy canh hồi lưu (tuần hoàn khép kín).", "points": 0.25, "options": ["A. Tiết kiệm nước vượt trội so với canh tác truyền thống.", "B. Không cần điện.", "C. Không cần dinh dưỡng.", "D. Trồng được cây gỗ lớn."]}, {"type": "mcq", "level": "TH", "q": "Vì sao nói công nghệ cao giúp 'sản xuất nông nghiệp chính xác'?", "answer": "A", "explain": "Nông nghiệp chính xác = đo lường chính xác nhu cầu và cung cấp chính xác đầu vào — cốt lõi của các công nghệ chương VII.", "points": 0.25, "options": ["A. Vì mọi yếu tố (nước, phân, thuốc, ánh sáng, nhiệt độ) đều được đo lường và cung cấp đúng liều, đúng lúc, đúng vị trí.", "B. Vì máy móc không bao giờ sai.", "C. Vì không cần con người.", "D. Vì nông sản luôn giống hệt nhau về kích thước."]}, {"type": "mcq", "level": "TH", "q": "Một địa phương có thế mạnh du lịch muốn phát triển nông nghiệp công nghệ cao. Hướng đi nào phù hợp với nội dung chương VII?", "answer": "A", "explain": "Kết hợp nhà màng công nghệ cao với du lịch trải nghiệm + truy xuất nguồn gốc vừa tăng thu nhập, vừa quảng bá nông sản.", "points": 0.25, "options": ["A. Xây dựng vùng rau, hoa nhà màng kết hợp du lịch trải nghiệm, truy xuất nguồn gốc bằng mã QR.", "B. Phá rừng làm nương rẫy.", "C. Chỉ trồng lúa nước.", "D. Cấm du khách tham quan."]}, {"type": "mcq", "level": "VD", "q": "Trường em có khu đất trống 200 m2, muốn xây dựng mô hình học tập về chương VII với kinh phí 20 triệu đồng. Phương án nào khả thi?", "answer": "A", "explain": "Với 20 triệu, phương án vừa sức: nhà màng đơn giản, tưới nhỏ giọt, thủy canh tĩnh — đủ minh họa 3 bài của chương VII.", "points": 0.25, "options": ["A. Nhà màng đơn giản + luống rau tưới nhỏ giọt + một giàn thủy canh tĩnh thùng xốp + bảng giới thiệu công nghệ.", "B. Nhà kính nhập khẩu hiện đại.", "C. Hệ thống drone và IoT đầy đủ.", "D. Không làm được gì với 20 triệu."]}, {"type": "mcq", "level": "VDC", "q": "Đánh giá: 'Công nghệ càng hiện đại thì nông sản càng an toàn'. Nhận định này đúng hay sai?", "answer": "A", "explain": "Công nghệ tạo điều kiện kiểm soát tốt, nhưng an toàn thực sự còn phụ thuộc quy trình và ý thức chấp hành (đúng liều, đúng thời gian cách li...).", "points": 0.25, "options": ["A. Chưa hẳn đúng, vì an toàn còn phụ thuộc vào quy trình sử dụng (liều lượng thuốc, phân bón) và ý thức người sản xuất.", "B. Hoàn toàn đúng trong mọi trường hợp.", "C. Hoàn toàn sai, công nghệ không liên quan đến an toàn.", "D. Đúng vì máy móc tự đảm bảo an toàn."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tiết kiệm nước là vai trò (kết quả mang lại), không phải đặc điểm vốn có.", "points": 1, "statements": ["a) Đặc điểm là tính chất vốn có; vai trò là tác dụng, ý nghĩa mang lại.", "b) 'Vốn đầu tư lớn' là đặc điểm của trồng trọt công nghệ cao.", "c) 'Nâng cao năng suất' là vai trò của trồng trọt công nghệ cao.", "d) 'Tiết kiệm nước' vừa là đặc điểm vừa là vai trò."]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: công nghệ cao cần sản xuất tập trung, quy mô lớn.", "points": 1, "statements": ["a) VietGAP là tiêu chuẩn thực hành nông nghiệp tốt của Việt Nam.", "b) Mã QR giúp truy xuất nguồn gốc nông sản.", "c) Liên kết chuỗi giá trị giúp nông dân ổn định đầu ra.", "d) Sản xuất manh mún phù hợp với trồng trọt công nghệ cao."]}, {"type": "short", "level": "TH", "q": "Vì sao nói 'đặc điểm' khác 'vai trò'? Cho ví dụ mỗi loại một ý.", "answer": "đặc điểm là tính chất vốn có, vai trò là tác dụng mang lại", "explain": "Ví dụ: 'vốn đầu tư lớn' là đặc điểm; 'nâng cao năng suất' là vai trò. Đặc điểm = nó như thế nào; vai trò = nó mang lại gì.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nêu một xu hướng phát triển trồng trọt công nghệ cao ở Việt Nam.", "answer": "nông nghiệp thông minh", "explain": "Các xu hướng: nhà màng/nhà kính; tưới tiết kiệm; VietGAP, hữu cơ; nông nghiệp đô thị, thông minh; khu nông nghiệp công nghệ cao; liên kết chuỗi (nêu một là được).", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Điểm khác nhau cơ bản giữa 'đặc điểm' và 'vai trò' khi học về trồng trọt công nghệ cao là gì?", "answer": "A", "explain": "Đặc điểm = nó như thế nào (vốn lớn, công nghệ hiện đại...); vai trò = nó mang lại gì (năng suất, môi trường...).", "points": 0.25, "options": ["A. Đặc điểm là tính chất vốn có của nó; vai trò là tác dụng, ý nghĩa nó mang lại.", "B. Hai khái niệm hoàn toàn giống nhau.", "C. Đặc điểm quan trọng hơn vai trò.", "D. Vai trò là nhược điểm của nó."]}, {"type": "mcq", "level": "NB", "q": "Trong các công nghệ chương VII, công nghệ nào trực tiếp điều khiển yếu tố ánh sáng?", "answer": "A", "explain": "Đèn LED là công nghệ duy nhất trong chương trực tiếp bổ sung, điều khiển ánh sáng (quang chu kì, quang hợp).", "points": 0.25, "options": ["A. Đèn LED bổ sung ánh sáng.", "B. Tưới nhỏ giọt.", "C. Drone.", "D. Cảm biến độ ẩm đất."]}, {"type": "mcq", "level": "TH", "q": "Trong các công nghệ chương VII, công nghệ nào giúp giảm trực tiếp lượng thuốc bảo vệ thực vật?", "answer": "A", "explain": "Nhà màng ngăn côn trùng, drone phun đúng vị trí, thủy canh tránh bệnh đất — cả ba đều góp phần giảm thuốc BVTV.", "points": 0.25, "options": ["A. Nhà màng (ngăn côn trùng), drone phun chính xác, thủy canh (tránh bệnh từ đất).", "B. Đèn LED.", "C. Cảm biến nhiệt độ.", "D. Tưới phun mưa."]}, {"type": "mcq", "level": "TH", "q": "Sắp xếp các công nghệ sau theo mức độ đầu tư tăng dần cho cùng quy mô hộ gia đình: (1) tưới nhỏ giọt hẹn giờ, (2) thủy canh tĩnh thùng xốp, (3) nhà màng đơn giản.", "answer": "A", "explain": "Thủy canh tĩnh thùng xốp rẻ nhất (vài trăm nghìn); tưới nhỏ giọt hẹn giờ vài triệu; nhà màng đơn giản tốn kém nhất trong ba.", "points": 0.25, "options": ["A. (2) ít tốn kém hơn (1), và (1) ít tốn kém hơn (3).", "B. (3) ít tốn kém nhất.", "C. Cả ba tốn kém như nhau.", "D. (1) tốn kém nhất."]}, {"type": "mcq", "level": "VD", "q": "Một siêu thị yêu cầu: rau trồng trong nhà màng, tưới nhỏ giọt, có nhật kí sản xuất điện tử và chứng nhận VietGAP. Yêu cầu này phản ánh nội dung nào của chương VII?", "answer": "A", "explain": "Yêu cầu thể hiện: ứng dụng công nghệ (nhà màng, tưới), kiểm soát quy trình (nhật kí điện tử), xu hướng an toàn (VietGAP).", "points": 0.25, "options": ["A. Phản ánh đặc điểm (công nghệ hiện đại, kiểm soát quy trình) và xu hướng (nông sản an toàn, truy xuất nguồn gốc).", "B. Chỉ phản ánh về giá cả.", "C. Không liên quan đến chương VII.", "D. Chỉ là yêu cầu hình thức."]}, {"type": "mcq", "level": "VDC", "q": "Tổng hợp: Vẽ sơ đồ tư duy chương VII cần có những nhánh chính nào?", "answer": "A", "explain": "Sơ đồ đầy đủ gồm 3 nhánh tương ứng 3 bài, mỗi nhánh có các ý chính đã học.", "points": 0.25, "options": ["A. Khái niệm – đặc điểm – vai trò – xu hướng; 5 công nghệ Bài 24; thủy canh – khí canh – ưu nhược điểm Bài 25.", "B. Chỉ cần một nhánh duy nhất.", "C. Chỉ liệt kê tên máy móc.", "D. Không cần sơ đồ."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tưới nhỏ giọt tiết kiệm nước vượt trội so với tưới tràn.", "points": 1, "statements": ["a) Tưới nhỏ giọt và tưới phun mưa đều có thể hẹn giờ, tự động hóa.", "b) Tưới nhỏ giọt hợp với cây trồng theo hàng; tưới phun mưa hợp với rau ăn lá trồng dày.", "c) Bón phân qua hệ thống tưới giúp phân đến đúng vùng rễ.", "d) Tưới nhỏ giọt tốn nước hơn tưới tràn."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vẫn phải tưới, thường là tưới nhỏ giọt.", "points": 1, "statements": ["a) Nhà màng chắn mưa bão, ngăn côn trùng nên hạn chế sâu bệnh.", "b) Trong nhà màng vẫn cần thông gió khi trời nắng gắt.", "c) Vật liệu che phủ nhà màng phải trong suốt để ánh sáng đi qua.", "d) Trồng trong nhà màng thì không cần tưới nước."]}, {"type": "short", "level": "TH", "q": "So sánh ngắn gọn tưới nhỏ giọt và tưới phun mưa.", "answer": "nhỏ giọt đưa nước đến từng gốc, phun mưa ướt đều diện tích", "explain": "Tưới nhỏ giọt: nước nhỏ từng giọt tại gốc cây; tưới phun mưa: phun hạt nhỏ phủ đều diện tích như mưa.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nêu một ưu điểm chung của tưới nhỏ giọt và thủy canh hồi lưu.", "answer": "tiết kiệm nước", "explain": "Cả hai đều tiết kiệm nước vượt trội: nhỏ giọt (đúng gốc, đúng lượng), hồi lưu (tuần hoàn khép kín).", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Vì sao chương VII được đặt tên là 'Trồng trọt công nghệ cao'?", "answer": "A", "explain": "Bài 23 (khái niệm chung), Bài 24 (các công nghệ), Bài 25 (thủy canh, khí canh) đều thuộc chủ đề ứng dụng công nghệ cao vào trồng trọt.", "points": 0.25, "options": ["A. Vì cả ba bài đều xoay quanh việc ứng dụng công nghệ hiện đại vào trồng trọt.", "B. Vì chương chỉ nói về máy móc.", "C. Vì chương không liên quan đến trồng trọt.", "D. Vì tên chương do ngẫu nhiên."]}, {"type": "mcq", "level": "NB", "q": "Công nghệ nào trong chương VII có thể áp dụng ngay cả khi không có điện?", "answer": "A", "explain": "Nhà màng đơn giản chắn mưa, ngăn côn trùng bằng cấu trúc thụ động, không cần điện; các công nghệ còn lại đều cần điện.", "points": 0.25, "options": ["A. Nhà màng đơn giản (che chắn thụ động) vẫn phát huy tác dụng mà không cần điện.", "B. Thủy canh hồi lưu.", "C. Hệ thống IoT.", "D. Đèn LED."]}, {"type": "mcq", "level": "TH", "q": "Mối liên hệ giữa tưới nhỏ giọt (Bài 24) và thủy canh (Bài 25) là gì?", "answer": "A", "explain": "Cả hai cùng nguyên lí: đưa nước, dinh dưỡng chính xác đến rễ, tiết kiệm tối đa — thủy canh là bước phát triển cao hơn (không cần đất).", "points": 0.25, "options": ["A. Đều là công nghệ cung cấp nước, dinh dưỡng chính xác đến vùng rễ, tiết kiệm tài nguyên.", "B. Hai công nghệ đối lập nhau.", "C. Tưới nhỏ giọt là một dạng thủy canh.", "D. Không có liên hệ gì."]}, {"type": "mcq", "level": "TH", "q": "Một nông dân nói: 'Tôi chỉ cần nhà màng, không cần các công nghệ khác'. Đánh giá quan điểm này.", "answer": "A", "explain": "Nhà màng tốt nhưng kết hợp đồng bộ nhiều công nghệ (tưới, IoT...) mới phát huy tối đa hiệu quả — tinh thần của công nghệ cao tổng hợp.", "points": 0.25, "options": ["A. Chưa toàn diện, vì kết hợp thêm tưới tự động, cảm biến... sẽ nâng cao hiệu quả hơn nhiều.", "B. Hoàn toàn đúng, một công nghệ là đủ.", "C. Hoàn toàn sai, nhà màng vô dụng.", "D. Đúng vì các công nghệ khác tốn tiền vô ích."]}, {"type": "mcq", "level": "VD", "q": "Để giảm chi phí đầu tư khi mới bắt đầu, người nông dân nên ưu tiên công nghệ nào trong chương VII?", "answer": "A", "explain": "Nguyên tắc: bắt đầu từ giải pháp vừa sức, hiệu quả (nhà màng đơn giản, tưới nhỏ giọt, thủy canh tĩnh), tích lũy rồi nâng cấp.", "points": 0.25, "options": ["A. Các giải pháp đơn giản, rẻ tiền trước: nhà màng đơn giản, tưới nhỏ giọt, thủy canh tĩnh; nâng cấp dần.", "B. Mua ngay drone đắt tiền.", "C. Lắp ngay hệ thống IoT đầy đủ nhất.", "D. Không đầu tư gì."]}, {"type": "mcq", "level": "VDC", "q": "Bài học lớn nhất rút ra từ chương VII đối với người muốn khởi nghiệp nông nghiệp là gì?", "answer": "A", "explain": "Khởi nghiệp nông nghiệp công nghệ cao cần: kiến thức, lựa chọn phù hợp, lộ trình hợp lí, thị trường đầu ra — bài học xuyên suốt chương.", "points": 0.25, "options": ["A. Cần nắm vững kiến thức, lựa chọn công nghệ phù hợp điều kiện, đi từ nhỏ đến lớn và đảm bảo đầu ra.", "B. Cứ đầu tư thật nhiều tiền là thành công.", "C. Không cần học kiến thức, cứ làm theo cảm tính.", "D. Chỉ cần bắt chước mô hình của người khác."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cảm biến có thể sai vị trí, hỏng; cần đối chiếu thực tế.", "points": 1, "statements": ["a) Cảm biến EC theo dõi nồng độ dinh dưỡng trong dung dịch.", "b) pH không phù hợp khiến rễ khó hấp thụ dinh dưỡng.", "c) Máy bơm, van điện từ là thiết bị chấp hành trong hệ thống IoT.", "d) Dữ liệu cảm biến luôn đúng tuyệt đối, không cần kiểm tra thực tế."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần đúng liều lượng, cây cũng cần thời gian tối.", "points": 1, "statements": ["a) Chiếu đèn LED cho hoa cúc ban đêm giúp điều khiển thời điểm ra hoa.", "b) Thắp sáng cho thanh long ban đêm giúp ra hoa trái vụ.", "c) LED tiết kiệm điện, ít tỏa nhiệt hơn bóng sợi đốt.", "d) Càng chiếu LED cả đêm thì cây càng tốt, không cần giới hạn."]}, {"type": "short", "level": "VD", "q": "Giải thích vì sao kết hợp cảm biến với drone tạo thành 'nông nghiệp chính xác'.", "answer": "vì cảm biến phát hiện đúng vị trí bệnh, drone phun đúng vị trí đó", "explain": "Cảm biến/camera phát hiện vùng cây bệnh, drone đến đúng tọa độ phun thuốc — đúng liều, đúng lúc, đúng vị trí.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Một xã muốn nhân rộng mô hình rau công nghệ cao. Nêu hai việc cần làm trước.", "answer": "tập huấn kĩ thuật và xây mô hình trình diễn", "explain": "Cần: khảo sát điều kiện, tập huấn kĩ thuật, xây mô hình trình diễn, đánh giá hiệu quả rồi mới nhân rộng (nêu hai là được).", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các phát biểu sau, phát biểu nào đúng về mối quan hệ giữa công nghệ cao và môi trường?", "answer": "A", "explain": "Nhờ chính xác, tiết kiệm (nước, phân, thuốc), công nghệ cao giảm áp lực lên môi trường — một vai trò quan trọng đã học.", "points": 0.25, "options": ["A. Công nghệ cao giúp tiết kiệm tài nguyên, giảm hóa chất thải ra môi trường nên thân thiện hơn canh tác truyền thống lạm dụng hóa chất.", "B. Công nghệ cao luôn gây ô nhiễm môi trường.", "C. Công nghệ cao không liên quan đến môi trường.", "D. Chỉ canh tác truyền thống mới bảo vệ môi trường."]}, {"type": "mcq", "level": "NB", "q": "Yếu tố 'truy xuất nguồn gốc' được nhắc đến trong chương VII có ý nghĩa gì?", "answer": "A", "explain": "Truy xuất nguồn gốc (mã QR, nhật kí điện tử) minh bạch quy trình, là lợi thế cạnh tranh của nông sản công nghệ cao.", "points": 0.25, "options": ["A. Giúp người tiêu dùng, cơ quan quản lí kiểm tra được toàn bộ quá trình sản xuất, tăng niềm tin vào nông sản.", "B. Chỉ để tăng giá bán.", "C. Không có ý nghĩa thực tế.", "D. Chỉ áp dụng cho hàng xuất khẩu."]}, {"type": "mcq", "level": "TH", "q": "Vì sao nông nghiệp đô thị được xem là xu hướng tất yếu?", "answer": "A", "explain": "Đô thị thiếu đất nhưng nhu cầu rau sạch lớn; công nghệ không dùng đất + nhà màng giúp sản xuất ngay trong đô thị.", "points": 0.25, "options": ["A. Vì đô thị hóa làm giảm đất nông nghiệp, dân số đô thị tăng cần rau sạch tại chỗ; thủy canh, khí canh giải quyết được vấn đề này.", "B. Vì nông thôn không cần nông nghiệp.", "C. Vì đô thị có nhiều đất trống.", "D. Vì rau đô thị không cần chăm sóc."]}, {"type": "mcq", "level": "TH", "q": "So sánh hiệu quả kinh tế: trồng rau ngoài đồng truyền thống và rau thủy canh trong nhà màng. Nhận định nào hợp lí?", "answer": "A", "explain": "Dù vốn đầu tư cao, thủy canh nhà màng cho năng suất cao, chất lượng đồng đều, giá bán tốt, trồng quanh năm nên hiệu quả vượt trội về lâu dài.", "points": 0.25, "options": ["A. Thủy canh nhà màng vốn đầu tư cao nhưng năng suất, chất lượng, giá bán cao hơn nên hiệu quả lâu dài tốt hơn.", "B. Trồng ngoài đồng luôn hiệu quả hơn.", "C. Thủy canh không bao giờ có lãi.", "D. Hai mô hình hiệu quả như nhau."]}, {"type": "mcq", "level": "VD", "q": "Một doanh nghiệp muốn đầu tư 10 ha rau công nghệ cao. Theo chương VII, cần chuẩn bị những gì?", "answer": "A", "explain": "Đầu tư quy mô lớn cần đồng bộ: vốn, nhân lực, công nghệ phù hợp, giống, thị trường đầu ra và tuân thủ môi trường.", "points": 0.25, "options": ["A. Vốn, nhân lực kĩ thuật, lựa chọn công nghệ phù hợp (nhà màng, tưới, IoT...), giống tốt, đầu ra và đánh giá môi trường.", "B. Chỉ cần có đất là đủ.", "C. Chỉ cần mua máy móc đắt tiền.", "D. Không cần chuẩn bị gì."]}, {"type": "mcq", "level": "VDC", "q": "Phản biện: 'Nông dân nghèo không thể tiếp cận công nghệ cao'. Ý kiến của em?", "answer": "A", "explain": "Có lộ trình phù hợp cho nông hộ ít vốn: bắt đầu nhỏ, hợp tác xã, chính sách hỗ trợ — công nghệ cao không chỉ dành cho người giàu.", "points": 0.25, "options": ["A. Không hoàn toàn đúng, vì có thể bắt đầu từ mô hình nhỏ, rẻ (thủy canh tĩnh, nhà màng đơn giản), tham gia hợp tác xã, được hỗ trợ vốn, kĩ thuật.", "B. Hoàn toàn đúng, không có cách nào.", "C. Hoàn toàn sai, ai cũng dễ dàng làm được.", "D. Đúng vì công nghệ cao chỉ dành cho người giàu."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "T"], "explain": "Tất cả đều đúng theo nội dung Bài 24.", "points": 1, "statements": ["a) Drone phun nhanh, đều và giảm tiếp xúc của người với thuốc.", "b) Người điều khiển drone phun thuốc cần được đào tạo, có giấy phép.", "c) Không nên bay drone phun thuốc khi gió to, mưa lớn.", "d) Với diện tích nhỏ, thuê dịch vụ drone theo vụ kinh tế hơn mua máy."]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: không kinh tế với cây gỗ lớn.", "points": 1, "statements": ["a) Thủy canh tĩnh đơn giản, rẻ; thủy canh hồi lưu tự động cao; khí canh phức tạp nhất.", "b) Rau thủy canh ít sâu bệnh từ đất nên hạn chế thuốc bảo vệ thực vật.", "c) Bệnh có thể lan nhanh qua dung dịch dùng chung trong hệ thống hồi lưu.", "d) Cây ăn quả lâu năm rất phù hợp với thủy canh quy mô lớn."]}, {"type": "short", "level": "VD", "q": "Vì sao hộ ít vốn nên bắt đầu từ thủy canh tĩnh thay vì khí canh?", "answer": "vì thủy canh tĩnh đơn giản, rẻ tiền còn khí canh phức tạp, vốn lớn", "explain": "Thủy canh tĩnh chỉ cần thùng xốp, chi phí thấp; khí canh đòi hỏi hệ thống phun sương chính xác, kĩ thuật cao, vốn lớn.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Nêu một tiêu chí đánh giá hiệu quả mô hình công nghệ cao.", "answer": "lợi nhuận (hiệu quả kinh tế)", "explain": "Các tiêu chí: năng suất, chất lượng, chi phí, lợi nhuận, tác động môi trường, tính ổn định lâu dài (nêu một là được).", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trong chương VII, công nghệ nào được ứng dụng sớm và phổ biến nhất ở Việt Nam?", "answer": "A", "explain": "Nhà màng/nhà kính là công nghệ được áp dụng sớm và rộng rãi nhất ở Việt Nam, đặc biệt vùng rau, hoa Đà Lạt.", "points": 0.25, "options": ["A. Nhà màng, nhà kính trồng rau, hoa (đặc biệt ở Đà Lạt).", "B. Drone phun thuốc.", "C. Khí canh công nghiệp.", "D. Trí tuệ nhân tạo."]}, {"type": "mcq", "level": "NB", "q": "Điểm chung về 'tính chính xác' của các công nghệ chương VII thể hiện ở đâu?", "answer": "A", "explain": "Chính xác = đúng liều, đúng lúc, đúng vị trí, đúng nhu cầu cây — thể hiện ở tưới, bón, phun, chiếu sáng, điều khiển khí hậu.", "points": 0.25, "options": ["A. Cung cấp đúng lượng nước, phân bón, thuốc; điều khiển đúng nhiệt độ, ánh sáng theo nhu cầu cây.", "B. Máy móc luôn chạy đúng giờ.", "C. Nông sản có kích thước bằng nhau tuyệt đối.", "D. Không bao giờ xảy ra sự cố."]}, {"type": "mcq", "level": "TH", "q": "Vì sao chương VII nhấn mạnh 'bảo vệ môi trường' trong khi nói về công nghệ cao?", "answer": "A", "explain": "Một vai trò quan trọng của công nghệ cao là giảm phân bón, thuốc dư thừa, tiết kiệm tài nguyên — hướng tới nông nghiệp xanh, bền vững.", "points": 0.25, "options": ["A. Vì công nghệ cao giúp giảm hóa chất, tiết kiệm tài nguyên — gắn phát triển nông nghiệp với bảo vệ môi trường bền vững.", "B. Vì công nghệ cao gây ô nhiễm nặng.", "C. Vì môi trường không liên quan.", "D. Vì chỉ để cho đủ nội dung."]}, {"type": "mcq", "level": "TH", "q": "Một nhóm học sinh muốn làm video giới thiệu chương VII. Cấu trúc video hợp lí là gì?", "answer": "A", "explain": "Cấu trúc hợp lí: khái niệm chung → giới thiệu từng công nghệ có minh họa → đánh giá ưu nhược điểm → liên hệ Việt Nam → kết luận.", "points": 0.25, "options": ["A. Mở đầu (khái niệm) – các công nghệ tiêu biểu (minh họa thực tế) – ưu nhược điểm – ứng dụng ở Việt Nam – kết luận.", "B. Chỉ quay máy móc.", "C. Chỉ đọc khái niệm.", "D. Quay cảnh đồng ruộng bất kì."]}, {"type": "mcq", "level": "VD", "q": "Khi tham quan trang trại công nghệ cao, học sinh nên quan sát những gì để hiểu bài?", "answer": "A", "explain": "Quan sát có mục đích: hệ thống công nghệ, cách vận hành, quản lí quy trình, chất lượng và thị trường — gắn lí thuyết với thực tiễn.", "points": 0.25, "options": ["A. Hệ thống nhà màng, tưới, cảm biến; cách vận hành; sổ nhật kí sản xuất; chất lượng nông sản và đầu ra.", "B. Chỉ chụp ảnh check-in.", "C. Chỉ hỏi giá bán.", "D. Không cần quan sát gì."]}, {"type": "mcq", "level": "VDC", "q": "Tổng kết chương: Câu nói nào tóm tắt đúng nhất tinh thần chương VII?", "answer": "A", "explain": "Tinh thần chương VII: dùng KHCN để sản xuất chính xác, nâng cao hiệu quả kinh tế – xã hội và phát triển bền vững.", "points": 0.25, "options": ["A. 'Ứng dụng khoa học công nghệ để trồng trọt chính xác, hiệu quả và bền vững'.", "B. 'Càng nhiều máy móc càng tốt'.", "C. 'Bỏ hẳn canh tác truyền thống'.", "D. 'Công nghệ thay thế hoàn toàn con người'."]}, {"type": "truefalse", "level": "VD", "q": "Tình huống: Xã có 50 ha rau, nông dân phun tay hay bị ngộ độc. Xét tính đúng, sai của các giải pháp:", "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: rất nguy hiểm.", "points": 1, "statements": ["a) Thuê dịch vụ drone phun thuốc giúp nhanh, đều, giảm ngộ độc.", "b) Tập huấn an toàn sử dụng thuốc cho nông dân.", "c) Tiếp tục phun thủ công không đồ bảo hộ vì đã quen.", "d) Kết hợp drone với phòng trừ tổng hợp để giảm lượng thuốc."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về lựa chọn mô hình:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phù hợp mới hiệu quả.", "points": 1, "statements": ["a) Hộ ít vốn nên bắt đầu từ nhà màng đơn giản, tưới nhỏ giọt, thủy canh tĩnh.", "b) Trang trại lớn nên đầu tư đồng bộ nhà màng, tưới tự động, IoT.", "c) Lựa chọn công nghệ phải phù hợp quy mô, vốn, điều kiện thực tế.", "d) Công nghệ đắt tiền nhất luôn tốt nhất trong mọi trường hợp."]}, {"type": "short", "level": "VD", "q": "Giải thích ngắn gọn nguyên lí 'bón phân qua hệ thống tưới'.", "answer": "hòa phân vào nước tưới đưa đến đúng vùng rễ", "explain": "Phân bón hòa vào nước tưới với liều chính xác, đến đúng vùng rễ giúp cây hấp thụ tốt, giảm thất thoát.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Vì sao nhà màng giúp giảm thuốc bảo vệ thực vật?", "answer": "vì ngăn côn trùng xâm nhập", "explain": "Lớp che phủ là rào cản vật lí ngăn côn trùng, mầm bệnh từ bên ngoài nên giảm mật độ sâu bệnh ban đầu.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các cặp công nghệ sau, cặp nào có thể thay thế cho nhau trong việc cung cấp nước cho cây?", "answer": "A", "explain": "Tưới nhỏ giọt và phun mưa đều cung cấp nước; chọn loại nào tùy cây trồng (nhỏ giọt cho cây hàng, phun mưa cho rau ăn lá...).", "points": 0.25, "options": ["A. Tưới nhỏ giọt và tưới phun mưa (đều là công nghệ tưới, lựa chọn tùy loại cây).", "B. Đèn LED và drone.", "C. Nhà màng và cảm biến.", "D. Không có cặp nào."]}, {"type": "mcq", "level": "NB", "q": "Trong các cặp sau, cặp nào bổ trợ cho nhau tốt nhất?", "answer": "A", "explain": "Cảm biến đo nhu cầu thực tế, hệ thống tưới thực hiện chính xác — cặp đo lường + chấp hành hoàn hảo của nông nghiệp chính xác.", "points": 0.25, "options": ["A. Cảm biến/IoT và hệ thống tưới tự động (đo lường + thực thi).", "B. Drone và đèn LED.", "C. Nhà màng và bừa đất.", "D. Thủy canh và cày ải."]}, {"type": "mcq", "level": "TH", "q": "Vì sao thủy canh được xem là 'bước tiến xa hơn' so với tưới nhỏ giọt?", "answer": "A", "explain": "Thủy canh tiến xa hơn: không cần đất, dinh dưỡng hòa tan được kiểm soát tuyệt đối về thành phần, nồng độ, pH.", "points": 0.25, "options": ["A. Vì loại bỏ hoàn toàn đất, kiểm soát tuyệt đối dinh dưỡng và môi trường rễ.", "B. Vì tốn ít công nghệ hơn.", "C. Vì rẻ hơn nhiều.", "D. Vì không cần nước."]}, {"type": "mcq", "level": "TH", "q": "Một trang trại đã có nhà màng và tưới nhỏ giọt. Muốn nâng cấp tiếp, nên ưu tiên gì?", "answer": "A", "explain": "Lộ trình nâng cấp hợp lí: đã có hạ tầng (nhà màng, tưới) thì bổ sung 'bộ não' là cảm biến + IoT để tự động, chính xác hơn.", "points": 0.25, "options": ["A. Lắp cảm biến và hệ thống điều khiển tự động (IoT) để tối ưu vận hành.", "B. Phá nhà màng xây lại.", "C. Bỏ tưới nhỏ giọt.", "D. Mua thêm đất."]}, {"type": "mcq", "level": "VD", "q": "Đánh giá hiệu quả một mô hình công nghệ cao cần dựa trên những tiêu chí nào?", "answer": "A", "explain": "Đánh giá toàn diện: năng suất, chất lượng, hiệu quả kinh tế (chi phí – lợi nhuận), môi trường và tính bền vững.", "points": 0.25, "options": ["A. Năng suất, chất lượng, chi phí, lợi nhuận, tác động môi trường và tính ổn định lâu dài.", "B. Chỉ dựa vào độ hiện đại của máy móc.", "C. Chỉ dựa vào diện tích.", "D. Chỉ dựa vào số lượng công nhân."]}, {"type": "mcq", "level": "VDC", "q": "Nếu được tư vấn cho một xã nông thôn, em sẽ đề xuất lộ trình áp dụng công nghệ cao như thế nào?", "answer": "A", "explain": "Lộ trình khoa học: khảo sát, đào tạo, trình diễn, đánh giá hiệu quả rồi mới nhân rộng; gắn với tổ chức sản xuất và thị trường.", "points": 0.25, "options": ["A. Khảo sát điều kiện – tập huấn – làm mô hình trình diễn nhỏ – đánh giá – nhân rộng gắn với hợp tác xã và đầu ra.", "B. Ép mọi hộ vay vốn đầu tư ngay.", "C. Chỉ tư vấn cho hộ giàu.", "D. Không tư vấn gì."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vẫn cần kiến thức để vận hành, xử lí sự cố.", "points": 1, "statements": ["a) Cảm biến phát hiện vùng bệnh, drone phun đúng vị trí là nông nghiệp chính xác.", "b) Kết hợp nhà màng với thủy canh tạo hiệu quả tổng hợp cao.", "c) Dữ liệu cảm biến các vụ trước giúp tối ưu quy trình vụ sau.", "d) Áp dụng công nghệ cao thì không cần kiến thức trồng trọt."]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nhân lực là yếu tố then chốt.", "points": 1, "statements": ["a) Công nghệ cao giúp nông sản Việt Nam nâng cao sức cạnh tranh.", "b) Truy xuất nguồn gốc tăng niềm tin người tiêu dùng.", "c) Nông nghiệp đô thị dùng thủy canh giải quyết vấn đề thiếu đất.", "d) Phát triển công nghệ cao không cần đào tạo nhân lực."]}, {"type": "short", "level": "VDC", "q": "Phân tích: Vì sao nhập khẩu nhiều máy móc hiện đại chưa đủ để phát triển công nghệ cao?", "answer": "vì còn cần nhân lực, vốn, thị trường, mô hình phù hợp", "explain": "Công nghệ cao cần đồng bộ: máy móc + nhân lực có trình độ + vốn + thị trường đầu ra + mô hình phù hợp điều kiện.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai thách thức lớn của Việt Nam khi phát triển trồng trọt công nghệ cao.", "answer": "vốn đầu tư lớn; nhân lực kĩ thuật hạn chế", "explain": "Các thách thức: vốn đầu tư lớn; nhân lực kĩ thuật hạn chế; đầu ra chưa ổn định (nêu hai là được).", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Khái niệm 'nông nghiệp chính xác' liên quan đến chương VII như thế nào?", "answer": "A", "explain": "Nông nghiệp chính xác chính là triết lí của chương VII: đúng liều, đúng lúc, đúng vị trí nhờ cảm biến, IoT, tưới, drone...", "points": 0.25, "options": ["A. Là tư tưởng xuyên suốt: đo lường chính xác nhu cầu cây và cung cấp chính xác đầu vào nhờ công nghệ.", "B. Là khái niệm của chương khác.", "C. Không liên quan.", "D. Chỉ áp dụng cho chăn nuôi."]}, {"type": "mcq", "level": "NB", "q": "Vì sao các nước phát triển đi đầu trong trồng trọt công nghệ cao?", "answer": "A", "explain": "Vốn dồi dào, KHCN phát triển, thị trường đòi hỏi chất lượng cao là động lực để các nước phát triển đi đầu.", "points": 0.25, "options": ["A. Vì có vốn, trình độ KHCN cao và nhu cầu nông sản chất lượng lớn.", "B. Vì các nước đó không có đất nông nghiệp.", "C. Vì nông dân các nước đó không biết trồng trọt truyền thống.", "D. Vì công nghệ cao chỉ dùng được ở xứ lạnh."]}, {"type": "mcq", "level": "TH", "q": "Việt Nam có lợi thế gì khi phát triển trồng trọt công nghệ cao?", "answer": "A", "explain": "Lợi thế: khí hậu nhiệt đới đa dạng trồng được nhiều loại cây quanh năm, lao động dồi dào, thị trường trong nước và xuất khẩu rộng mở.", "points": 0.25, "options": ["A. Khí hậu đa dạng, lao động dồi dào, thị trường tiêu thụ lớn và đang hội nhập sâu.", "B. Không có lợi thế gì.", "C. Chỉ có lợi thế về vốn.", "D. Chỉ có lợi thế về máy móc."]}, {"type": "mcq", "level": "TH", "q": "Thách thức lớn nhất của Việt Nam khi phát triển trồng trọt công nghệ cao là gì?", "answer": "A", "explain": "Ba thách thức chính: vốn, nhân lực kĩ thuật và thị trường đầu ra — cần chính sách hỗ trợ đồng bộ.", "points": 0.25, "options": ["A. Vốn đầu tư lớn, nhân lực kĩ thuật còn hạn chế và đầu ra chưa ổn định ở nhiều nơi.", "B. Thiếu đất nông nghiệp hoàn toàn.", "C. Khí hậu không phù hợp.", "D. Không có thách thức nào."]}, {"type": "mcq", "level": "VD", "q": "Để khắc phục thách thức trên, cần những giải pháp nào?", "answer": "A", "explain": "Giải pháp đồng bộ: chính sách vốn, đào tạo, chuyển giao công nghệ, tổ chức sản xuất (hợp tác xã) và liên kết thị trường.", "points": 0.25, "options": ["A. Hỗ trợ vốn, đào tạo nhân lực, chuyển giao công nghệ, phát triển hợp tác xã và liên kết tiêu thụ.", "B. Bỏ mặc nông dân tự lo.", "C. Cấm áp dụng công nghệ cao.", "D. Chỉ trông chờ viện trợ."]}, {"type": "mcq", "level": "VDC", "q": "Tầm nhìn: Đến năm 2030, trồng trọt công nghệ cao ở Việt Nam có thể đạt được gì?", "answer": "A", "explain": "Với đà phát triển hiện nay và chính sách hỗ trợ, Việt Nam có thể hình thành nhiều vùng công nghệ cao, nâng cao vị thế nông sản.", "points": 0.25, "options": ["A. Nhiều vùng sản xuất tập trung hiện đại, nông sản an toàn đáp ứng trong nước và xuất khẩu, nông dân thu nhập cao hơn.", "B. Không thay đổi gì.", "C. Biến mất hoàn toàn.", "D. Chỉ còn trên sách vở."]}, {"type": "truefalse", "level": "VDC", "q": "Phân tích: Công ty đầu tư nhà kính hiện đại nhưng thua lỗ vì thiếu kĩ sư và đầu ra. Xét tính đúng, sai:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: một thất bại cụ thể không phủ nhận cả mô hình.", "points": 1, "statements": ["a) Thất bại do thiếu đồng bộ các yếu tố, không phải do bản chất công nghệ.", "b) Cần nhân lực có trình độ để vận hành hệ thống.", "c) Cần đầu ra ổn định trước khi đầu tư lớn.", "d) Trường hợp này chứng tỏ công nghệ cao không hiệu quả."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các nhận định chiến lược:", "answer": ["T", "F", "T", "T"], "explain": "a), c), d) Đúng. b) Sai: cần phù hợp điều kiện, không ồ ạt.", "points": 1, "statements": ["a) Nhà nước hỗ trợ vốn, đào tạo, khu nông nghiệp công nghệ cao sẽ thúc đẩy phát triển.", "b) Mọi vùng đều phải áp dụng ngay mô hình hiện đại nhất.", "c) Cần lộ trình phù hợp điều kiện từng vùng, từ thấp đến cao.", "d) Kết hợp công nghệ cao với sản xuất an toàn là hướng bền vững."]}, {"type": "short", "level": "VDC", "q": "Trình bày mối quan hệ giữa ba bài trong chương VII.", "answer": "bài 23 là lí luận chung, bài 24 và 25 là công nghệ cụ thể", "explain": "Bài 23 nêu khái niệm, đặc điểm, vai trò chung; Bài 24 và 25 trình bày các công nghệ cụ thể minh họa.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu thông điệp chính của chương VII.", "answer": "dùng khoa học công nghệ để trồng trọt hiệu quả, bền vững", "explain": "Thông điệp: ứng dụng KHCN để trồng trọt chính xác, hiệu quả và bền vững; lựa chọn, ứng dụng phù hợp điều kiện thực tế.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Câu hỏi tích hợp: Một dự án 'Vườn rau thông minh cho trường học' cần thể hiện được những nội dung nào của chương VII?", "answer": "A", "explain": "Dự án tốt cần thể hiện kiến thức chương VII (khái niệm, một số công nghệ), đồng thời có ý nghĩa giáo dục, môi trường.", "points": 0.25, "options": ["A. Khái niệm công nghệ cao; ít nhất 2–3 công nghệ (nhà màng, tưới tự động, thủy canh/cảm biến); ý nghĩa giáo dục và môi trường.", "B. Chỉ cần trồng rau là đủ.", "C. Chỉ cần mua thiết bị đắt tiền.", "D. Không cần nội dung kiến thức."]}, {"type": "mcq", "level": "NB", "q": "Khi viết báo cáo tham quan trang trại công nghệ cao, cần có những phần nào?", "answer": "A", "explain": "Báo cáo cần: giới thiệu, mô tả công nghệ, đánh giá hiệu quả, rút ra bài học và đề xuất — thể hiện năng lực tổng hợp kiến thức.", "points": 0.25, "options": ["A. Giới thiệu trang trại; các công nghệ đang áp dụng; hiệu quả kinh tế – môi trường; bài học, đề xuất.", "B. Chỉ cần ảnh chụp.", "C. Chỉ cần ghi địa chỉ.", "D. Không cần cấu trúc."]}, {"type": "mcq", "level": "TH", "q": "Kĩ năng nào quan trọng nhất khi học chương VII?", "answer": "A", "explain": "Chương VII đòi hỏi tư duy phân tích, so sánh các công nghệ và vận dụng vào thực tiễn — không chỉ học thuộc.", "points": 0.25, "options": ["A. Kĩ năng phân tích, so sánh, đánh giá và vận dụng công nghệ vào tình huống thực tế.", "B. Kĩ năng học thuộc lòng.", "C. Kĩ năng vẽ máy móc.", "D. Không cần kĩ năng gì."]}, {"type": "mcq", "level": "TH", "q": "Nội dung nào sau đây KHÔNG thuộc chương VII?", "answer": "A", "explain": "Ủ phân compost thuộc chương VIII (xử lí chất thải); các nội dung còn lại thuộc chương VII.", "points": 0.25, "options": ["A. Kĩ thuật ủ phân compost từ phụ phẩm trồng trọt.", "B. Công nghệ nhà màng trong trồng trọt.", "C. Hệ thống tưới nhỏ giọt tự động.", "D. Công nghệ khí canh."]}, {"type": "mcq", "level": "VD", "q": "Một câu hỏi thi học kì chương VII có thể ra dưới dạng nào?", "answer": "A", "explain": "Câu hỏi có thể ở các mức: nhận biết (khái niệm), thông hiểu (so sánh), vận dụng (tình huống lựa chọn, đánh giá mô hình).", "points": 0.25, "options": ["A. So sánh các công nghệ; phân tích tình huống lựa chọn mô hình; đánh giá ưu nhược điểm.", "B. Chỉ hỏi định nghĩa duy nhất.", "C. Chỉ yêu cầu kể tên.", "D. Không thể ra câu hỏi vận dụng."]}, {"type": "mcq", "level": "VDC", "q": "Thông điệp chính em rút ra sau khi học xong chương VII là gì?", "answer": "A", "explain": "Thông điệp: KHCN là động lực phát triển nông nghiệp bền vững; mỗi người cần hiểu biết để lựa chọn, ứng dụng phù hợp.", "points": 0.25, "options": ["A. Khoa học công nghệ giúp trồng trọt hiệu quả, bền vững; cần học tập, lựa chọn và ứng dụng phù hợp điều kiện thực tế.", "B. Công nghệ là vạn năng.", "C. Nông nghiệp không cần đổi mới.", "D. Chỉ người giàu mới làm nông nghiệp được."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định tổng hợp cuối chương:", "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: ủ phân compost thuộc chương VIII.", "points": 1, "statements": ["a) Bài 23 là nền tảng lí luận; Bài 24, 25 là các công nghệ cụ thể minh họa.", "b) Từ khóa chung của chương: chính xác – tự động – tiết kiệm tài nguyên – bền vững.", "c) Ủ phân compost thuộc nội dung chương VII.", "d) Học chương VII cần kĩ năng phân tích, vận dụng vào thực tế."]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau:", "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: có lộ trình phù hợp (mô hình nhỏ, hợp tác xã, hỗ trợ).", "points": 1, "statements": ["a) Công nghệ cao tạo điều kiện kiểm soát tốt nhưng an toàn còn phụ thuộc quy trình và ý thức người sản xuất.", "b) Phát triển công nghệ cao cần gắn với bảo vệ môi trường.", "c) Việt Nam có lợi thế khí hậu, lao động, thị trường để phát triển công nghệ cao.", "d) Nông dân nghèo hoàn toàn không thể tiếp cận công nghệ cao."]}, {"type": "short", "level": "VDC", "q": "Kể tên năm công nghệ cao tiêu biểu trong trồng trọt (Bài 24).", "answer": "nhà màng; tưới tự động; cảm biến và IoT; đèn LED; drone", "explain": "Năm công nghệ: nhà kính/nhà màng, tưới tiết kiệm tự động, cảm biến và IoT, đèn LED, drone.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nội dung nào sau đây KHÔNG thuộc chương VII: ủ phân compost, nhà màng, tưới nhỏ giọt, khí canh?", "answer": "ủ phân compost", "explain": "Ủ phân compost thuộc chương VIII (xử lí chất thải trồng trọt); ba nội dung còn lại thuộc chương VII.", "points": 0.5}]}]}
