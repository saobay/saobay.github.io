 tốt sau mưa bão, bón phân cân đối, vệ sinh đồng ruộng", "explain": "Các biện pháp canh tác: giống kháng, xử lí hạt giống, bón cân đối, thoát nước, vệ sinh đồng ruộng (nêu hai là đủ).", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Bệnh khảm lá, xoăn lá ở cây trồng do tác nhân nào gây ra?", "options": ["A. Virus.", "B. Nấm.", "C. Vi khuẩn.", "D. Côn trùng."], "answer": "A", "explain": "Bệnh khảm, xoăn lá do virus gây ra.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Virus gây bệnh cho cây trồng lây lan chủ yếu qua", "options": ["A. côn trùng chích hút (rầy, rệp, bọ phấn, bọ trĩ).", "B. nước mưa trực tiếp.", "C. ánh nắng mặt trời.", "D. gió thổi hạt phấn."], "answer": "A", "explain": "Côn trùng chích hút là môi giới truyền virus chủ yếu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đặc điểm nào sau đây đúng với bệnh virus hại cây trồng?", "options": ["A. Cây còi cọc, biến dạng và chưa có thuốc đặc trị.", "B. Có thuốc đặc trị diệt virus rất hiệu quả.", "C. Cây bị bệnh sẽ tự khỏi sau vài ngày.", "D. Virus chỉ gây bệnh cho cây lúa."], "answer": "A", "explain": "Virus kí sinh trong tế bào, chưa có thuốc đặc trị cho cây; chủ yếu phải phòng ngừa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biện pháp quan trọng nhất khi phát hiện cây bị bệnh virus là", "options": ["A. nhổ bỏ, tiêu huỷ ngay cây bệnh để tránh lây lan.", "B. phun thuốc trừ nấm liều cao.", "C. bón thêm phân đạm cho cây nhanh tốt.", "D. tưới thật nhiều nước."], "answer": "A", "explain": "Không có thuốc chữa virus nên phải nhổ bỏ, tiêu huỷ cây bệnh kịp thời, kết hợp trừ môi giới.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vườn ớt xuất hiện vài cây xoăn lá, biến dạng. Xử lí đúng theo IPM là", "options": ["A. nhổ bỏ, tiêu huỷ cây bệnh; đặt bẫy dính bắt bọ phấn; trừ rệp môi giới.", "B. phun thuốc trừ nấm cho cả vườn.", "C. bón thêm đạm để cây ra lá mới.", "D. để nguyên vì bệnh sẽ tự khỏi."], "answer": "A", "explain": "Bệnh virus: loại bỏ nguồn bệnh + trừ côn trùng môi giới là biện pháp then chốt.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao \"trừ côn trùng môi giới\" lại là biện pháp then chốt phòng bệnh virus?", "options": ["A. Vì virus lây lan chủ yếu qua côn trùng chích hút; diệt môi giới là cắt đứt con đường lây lan.", "B. Vì côn trùng môi giới ăn thịt virus.", "C. Vì trừ môi giới giúp cây quang hợp tốt hơn.", "D. Vì virus sống trong cơ thể côn trùng suốt đời."], "answer": "A", "explain": "Cắt đứt con đường lây lan qua môi giới là cách phòng virus hiệu quả nhất khi chưa có thuốc đặc trị.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về bệnh virus:", "statements": ["a) Bệnh khảm, xoăn lá ở cây trồng do virus gây ra.", "b) Virus lây lan chủ yếu qua côn trùng chích hút.", "c) Cây bị virus thường còi cọc, biến dạng.", "d) Đã có nhiều thuốc đặc trị virus cho cây trồng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chưa có thuốc đặc trị virus cho cây, chủ yếu phòng ngừa.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về phòng bệnh virus:", "statements": ["a) Dùng giống sạch bệnh, giống kháng virus giúp phòng bệnh.", "b) Trừ rầy, rệp, bọ phấn giúp hạn chế lây lan virus.", "c) Nhổ bỏ, tiêu huỷ cây bệnh kịp thời ngăn bệnh lan rộng.", "d) Phun thuốc trừ nấm có thể chữa khỏi bệnh virus."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: thuốc trừ nấm không có tác dụng với virus.", "points": 1}, {"type": "short", "level": "NB", "q": "Kể tên một bệnh virus thường gặp trên cây trồng.", "answer": "Bệnh khảm lá", "explain": "Các bệnh virus phổ biến: khảm lá, xoăn lá, vàng lùn, lùn xoắn lá (chấp nhận một đáp án đúng).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích vì sao với bệnh virus, \"phòng là chính\" càng trở nên quan trọng.", "answer": "Vì cây đã nhiễm virus thì không có thuốc đặc trị để chữa khỏi, chỉ có thể phòng ngừa từ đầu", "explain": "Virus kí sinh trong tế bào cây, chưa có thuốc đặc trị; một khi cây đã nhiễm nặng chỉ còn cách tiêu huỷ.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các bệnh sau, bệnh nào do nấm gây ra?", "options": ["A. Bệnh đạo ôn hại lúa.", "B. Bệnh bạc lá lúa.", "C. Bệnh khảm lá thuốc lá.", "D. Bệnh vàng lùn hại lúa."], "answer": "A", "explain": "Đạo ôn do nấm; bạc lá do vi khuẩn; khảm lá, vàng lùn do virus.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các bệnh sau, bệnh nào do virus gây ra?", "options": ["A. Bệnh xoăn lá.", "B. Bệnh đạo ôn.", "C. Bệnh bạc lá.", "D. Bệnh thối nhũn do nấm."], "answer": "A", "explain": "Xoăn lá do virus; đạo ôn do nấm; bạc lá do vi khuẩn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phải chẩn đoán đúng tác nhân gây bệnh trước khi dùng thuốc?", "options": ["A. Vì thuốc trừ nấm, trừ vi khuẩn khác nhau; dùng sai thuốc không hiệu quả và tốn kém.", "B. Vì mọi loại thuốc đều giống nhau.", "C. Vì bệnh nào cũng tự khỏi.", "D. Vì thuốc chỉ có tác dụng với sâu hại."], "answer": "A", "explain": "Thuốc trừ nấm không diệt được vi khuẩn và ngược lại; chẩn đoán đúng mới dùng đúng thuốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biện pháp \"xử lí hạt giống trước khi gieo\" có tác dụng phòng bệnh vì", "options": ["A. tiêu diệt mầm bệnh bám trên hạt, giúp cây con sạch bệnh từ đầu.", "B. làm hạt nảy mầm nhanh gấp đôi.", "C. giúp hạt chống được mọi loại sâu bệnh suốt vụ.", "D. thay thế được việc bón phân."], "answer": "A", "explain": "Nhiều mầm bệnh (nấm đạo ôn, vi khuẩn bạc lá) bám trên hạt giống; xử lí hạt diệt mầm bệnh từ gốc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một ruộng lúa vừa có vết đạo ôn hình thoi, vừa có sọc vàng mép lá. Hướng xử lí đúng là", "options": ["A. phun phối hợp thuốc trừ nấm và thuốc trừ vi khuẩn đặc trị, kết hợp ngừng bón đạm, thoát nước tốt.", "B. chỉ phun thuốc trừ sâu.", "C. bón thêm đạm để lúa át bệnh.", "D. để mặc bệnh tự khỏi."], "answer": "A", "explain": "Ruộng nhiễm cả nấm (đạo ôn) và vi khuẩn (bạc lá) cần thuốc đúng từng đối tượng + biện pháp canh tác hỗ trợ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đánh giá phát biểu: \"Thấy bệnh mới phun thuốc là đủ, không cần các biện pháp phòng ngừa.\"", "options": ["A. Sai, vì nhiều bệnh (nhất là virus) không có thuốc đặc trị; phòng ngừa rẻ và hiệu quả hơn chữa.", "B. Đúng, vì thuốc hoá học diệt được mọi bệnh.", "C. Đúng, vì phòng ngừa tốn công vô ích.", "D. Sai, vì thuốc hoá học không có tác dụng gì."], "answer": "A", "explain": "Phòng là chính: nhiều bệnh không chữa được bằng thuốc; phòng ngừa hiệu quả kinh tế và bền vững hơn.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (phân biệt 3 bệnh):", "statements": ["a) Đạo ôn do nấm, vết bệnh hình thoi như mắt én.", "b) Bạc lá do vi khuẩn, sọc vàng từ mép lá.", "c) Khảm, xoăn lá do virus, lây qua côn trùng chích hút.", "d) Cả ba bệnh đều do nấm gây ra."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: ba bệnh do ba nhóm tác nhân khác nhau.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về dùng thuốc trừ bệnh:", "statements": ["a) Bệnh do nấm phải dùng thuốc trừ nấm đặc trị.", "b) Bệnh do vi khuẩn phải dùng thuốc trừ vi khuẩn đặc trị.", "c) Thuốc trừ sâu có thể dùng để chữa bệnh đạo ôn.", "d) Khi dùng thuốc phải tuân thủ nguyên tắc 4 đúng."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: thuốc trừ sâu không diệt được nấm gây đạo ôn.", "points": 1}, {"type": "short", "level": "NB", "q": "Nêu một biện pháp canh tác phòng bệnh đạo ôn.", "answer": "Dùng giống kháng đạo ôn", "explain": "Các biện pháp canh tác: giống kháng, xử lí hạt giống, bón cân đối không thừa đạm, vệ sinh đồng ruộng (một đáp án đúng).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao \"bón phân cân đối\" vừa giúp phòng bệnh đạo ôn, vừa giúp phòng bệnh bạc lá?", "answer": "Vì bón cân đối giúp cây khoẻ, tăng sức chống chịu; tránh thừa đạm làm cây tốt lốp, mô mềm, dễ nhiễm cả nấm và vi khuẩn", "explain": "Thừa đạm làm cây tốt lốp, ẩm độ cao – điều kiện thuận lợi cho cả nấm đạo ôn và vi khuẩn bạc lá phát triển.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Bệnh đạo ôn gây hại nặng nhất ở bộ phận nào của cây lúa?", "options": ["A. Lá và cổ bông.", "B. Rễ lúa.", "C. Thân ngầm.", "D. Hạt thóc đã phơi khô."], "answer": "A", "explain": "Đạo ôn hại lá (vết hình thoi) và cổ bông (gãy cổ bông, lép hạt).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Côn trùng nào sau đây là môi giới truyền bệnh virus phổ biến?", "options": ["A. Rệp, bọ phấn.", "B. Ong mật.", "C. Bướm ngày.", "D. Chuồn chuồn."], "answer": "A", "explain": "Rệp, bọ phấn, rầy, bọ trĩ chích hút và truyền virus; ong mật, bướm, chuồn chuồn không truyền virus.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao bệnh bạc lá hay bùng phát sau mưa bão?", "options": ["A. Vì nước mưa, gió giúp vi khuẩn phát tán nhanh từ cây bệnh sang cây khoẻ.", "B. Vì mưa làm thuốc trừ bệnh mất tác dụng hoàn toàn.", "C. Vì mưa làm lúa chết ngay.", "D. Vì vi khuẩn chỉ sống được trong nước mưa."], "answer": "A", "explain": "Vi khuẩn bạc lá lây qua nước, gió; mưa bão tạo điều kiện phát tán mạnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi phát hiện vài cây lúa bị bệnh virus vàng lùn, việc đầu tiên nên làm là", "options": ["A. nhổ bỏ, tiêu huỷ ngay cây bệnh và kiểm tra, trừ rầy môi giới.", "B. phun thuốc trừ nấm cho cả ruộng.", "C. bón thêm đạm để cây nhanh tốt lại.", "D. tưới thêm nước cho ruộng."], "answer": "A", "explain": "Bệnh virus không chữa được: nhổ bỏ nguồn bệnh + trừ rầy môi giới là then chốt.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vườn cà chua bị bệnh xoăn lá do virus lây lan nhanh. Biện pháp tổng hợp phù hợp là", "options": ["A. nhổ bỏ cây bệnh, đặt bẫy dính bắt bọ phấn, dùng giống kháng, vệ sinh vườn.", "B. phun thuốc trừ nấm liên tục.", "C. bón thật nhiều phân đạm.", "D. tưới đẫm nước mỗi ngày."], "answer": "A", "explain": "Phối hợp: loại nguồn bệnh + trừ môi giới (bẫy dính) + giống kháng + vệ sinh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một hợp tác xã trồng ớt nhiều năm bị virus xoăn lá nặng. Giải pháp lâu dài là", "options": ["A. chuyển sang giống ớt kháng virus, quản lí môi giới bằng IPM và luân canh.", "B. tăng liều thuốc hoá học mỗi vụ.", "C. trồng dày hơn để bù cây bệnh.", "D. bỏ không trồng ớt nữa mà không cần biện pháp gì."], "answer": "A", "explain": "Giải pháp căn cơ: giống kháng + IPM trừ môi giới + luân canh cắt nguồn bệnh.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về triệu chứng bệnh:", "statements": ["a) Vết hình thoi mắt én là triệu chứng đạo ôn.", "b) Sọc vàng từ mép lá là triệu chứng bạc lá.", "c) Lá khảm xanh vàng, xoăn biến dạng là triệu chứng bệnh virus.", "d) Dảnh héo, bông bạc là triệu chứng bệnh đạo ôn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: dảnh héo, bông bạc là triệu chứng của sâu đục thân (Bài 16).", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về phòng trừ tổng hợp bệnh hại:", "statements": ["a) Dùng giống kháng, giống sạch bệnh là biện pháp phòng ngừa hàng đầu.", "b) Bón phân cân đối giúp cây khoẻ, tăng khả năng chống chịu bệnh.", "c) Nhổ bỏ, tiêu huỷ cây bệnh khi mới phát hiện giúp ngăn lây lan.", "d) Chỉ cần phun thuốc là đủ, không cần biện pháp nào khác."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần phối hợp nhiều biện pháp theo IPM.", "points": 1}, {"type": "short", "level": "NB", "q": "Bệnh vàng lùn, lùn xoắn lá trên lúa do loại tác nhân nào gây ra?", "answer": "Virus", "explain": "Vàng lùn, lùn xoắn lá là bệnh virus trên lúa, do rầy nâu truyền.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích mối liên hệ giữa \"trừ rầy nâu\" và \"phòng bệnh virus vàng lùn\" trên lúa.", "answer": "Vì rầy nâu là môi giới truyền virus vàng lùn; trừ rầy là cắt đứt con đường lây lan bệnh", "explain": "Không có thuốc chữa virus nên phòng bệnh virus chủ yếu bằng cách trừ rầy môi giới.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Biện pháp nào sau đây thuộc nhóm sinh học trong phòng trừ bệnh hại?", "options": ["A. Dùng nấm đối kháng Trichoderma để trừ nấm bệnh hại rễ.", "B. Phun thuốc trừ nấm.", "C. Nhổ bỏ cây bệnh đem tiêu huỷ.", "D. Bón phân cân đối."], "answer": "A", "explain": "Trichoderma là chế phẩm vi sinh đối kháng – biện pháp sinh học (học kĩ ở Bài 18).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biện pháp \"nhổ bỏ, tiêu huỷ cây bệnh\" thuộc nhóm nào?", "options": ["A. Vật lí – cơ giới.", "B. Sinh học.", "C. Hoá học.", "D. Canh tác."], "answer": "A", "explain": "Nhổ bỏ, tiêu huỷ bằng sức người thuộc nhóm vật lí – cơ giới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao khi phun thuốc trừ bệnh cần phun khi bệnh mới chớm?", "options": ["A. Vì lúc này mầm bệnh còn ít, thuốc dễ dập tắt, giảm số lần phun.", "B. Vì bệnh mới chớm thì thuốc rẻ hơn.", "C. Vì bệnh nặng thì cây đã chết nên không cần phun.", "D. Vì pháp luật chỉ cho phun khi bệnh nhẹ."], "answer": "A", "explain": "\"Đúng lúc\": bệnh mới chớm, mật độ mầm bệnh thấp thì hiệu quả cao, tiết kiệm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phòng trừ bệnh hại, biện pháp hoá học nên được sử dụng khi nào?", "options": ["A. Khi bệnh mới chớm và các biện pháp khác không đủ hiệu quả, tuân thủ 4 đúng.", "B. Phun định kì mỗi tuần dù không có bệnh.", "C. Chỉ phun khi bệnh đã lan khắp ruộng.", "D. Phun càng nhiều càng tốt."], "answer": "A", "explain": "Thuốc là biện pháp cuối cùng, dùng đúng lúc (bệnh chớm), đúng đối tượng, đúng 4 đúng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ruộng rau bị thối nhũn do vi khuẩn trong mùa mưa. Biện pháp canh tác quan trọng nhất là", "options": ["A. lên luống cao, thoát nước tốt để giảm ẩm độ.", "B. tưới đẫm nước mỗi ngày.", "C. trồng thật dày.", "D. bón thêm đạm."], "answer": "A", "explain": "Thoát nước tốt, giảm ẩm là then chốt với bệnh thối nhũn do vi khuẩn mùa mưa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phân tích: vì sao \"luân canh\" giúp hạn chế cả sâu và bệnh hại tích luỹ trong đất?", "options": ["A. Vì thay đổi cây trồng cắt đứt nguồn thức ăn và vòng đời của sâu bệnh chuyên tính.", "B. Vì luân canh làm đất màu mỡ hơn.", "C. Vì sâu bệnh không thích đất đã luân canh.", "D. Vì luân canh giúp cây cao lớn hơn."], "answer": "A", "explain": "Luân canh cây khác họ cắt vòng đời sâu bệnh chuyên tính, giảm tích luỹ mầm bệnh trong đất.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về biện pháp phòng bệnh:", "statements": ["a) Xử lí hạt giống giúp phòng bệnh từ đầu vụ.", "b) Vệ sinh đồng ruộng giúp giảm nguồn bệnh cho vụ sau.", "c) Thoát nước tốt giúp hạn chế bệnh bạc lá, thối nhũn.", "d) Gieo trồng dày đặc giúp phòng bệnh tốt hơn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: gieo dày làm ẩm độ cao, bệnh dễ lây lan; cần mật độ hợp lí.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thuốc trừ nấm không có tác dụng với bệnh do vi khuẩn.", "b) Thuốc trừ vi khuẩn không diệt được nấm gây đạo ôn.", "c) Chẩn đoán đúng tác nhân giúp chọn đúng loại thuốc.", "d) Có thể dùng một loại thuốc chung cho mọi bệnh."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: mỗi nhóm tác nhân cần thuốc đặc trị riêng.", "points": 1}, {"type": "short", "level": "NB", "q": "Kể tên một chế phẩm vi sinh dùng phòng trừ nấm bệnh hại cây.", "answer": "Nấm Trichoderma", "explain": "Nấm đối kháng Trichoderma trừ nấm bệnh hại rễ – biện pháp sinh học (học kĩ ở Bài 18).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao \"mật độ gieo trồng hợp lí\" giúp hạn chế bệnh hại?", "answer": "Vì ruộng thông thoáng, giảm ẩm độ, bệnh khó lây lan; cây đủ ánh sáng, khoẻ mạnh hơn", "explain": "Mật độ hợp lí giúp thông thoáng, giảm ẩm – điều kiện bất lợi cho nấm, vi khuẩn phát triển và lây lan.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Bệnh nào sau đây KHÔNG phải do vi sinh vật gây ra?", "options": ["A. Cây bị thối rễ do ngập úng kéo dài.", "B. Bệnh đạo ôn hại lúa.", "C. Bệnh bạc lá lúa.", "D. Bệnh khảm lá."], "answer": "A", "explain": "Thối rễ do ngập úng là bệnh do điều kiện ngoại cảnh bất lợi; các bệnh còn lại do vi sinh vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Triệu chứng \"lá có mảng xanh vàng xen kẽ như khảm\" là của bệnh nào?", "options": ["A. Bệnh khảm lá do virus.", "B. Bệnh đạo ôn.", "C. Bệnh bạc lá.", "D. Bệnh thối nhũn."], "answer": "A", "explain": "Khảm xanh vàng xen kẽ là triệu chứng điển hình của bệnh khảm do virus.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao bệnh do virus thường gây thiệt hại nặng nề?", "options": ["A. Vì lây lan nhanh qua môi giới và không có thuốc đặc trị.", "B. Vì virus làm đất bị ô nhiễm nặng.", "C. Vì virus chỉ tấn công cây khoẻ.", "D. Vì virus sinh sản trong đất."], "answer": "A", "explain": "Virus lây nhanh qua côn trùng chích hút, chưa có thuốc chữa – thiệt hại khó khắc phục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để có giống sạch bệnh virus, người ta thường", "options": ["A. chọn cây mẹ khoẻ, không nhiễm bệnh để nhân giống.", "B. lấy giống từ cây đang bị bệnh nặng.", "C. không cần quan tâm nguồn giống.", "D. dùng hạt của cây bệnh để gieo."], "answer": "A", "explain": "Giống sạch bệnh bắt đầu từ cây mẹ khoẻ, không nhiễm virus.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vườn ươm cây giống xuất hiện cây con xoăn lá. Để bảo vệ cả vườn ươm, cần", "options": ["A. loại bỏ ngay cây bệnh, che lưới ngăn côn trùng và kiểm tra định kì.", "B. phun thuốc trừ nấm cho cả vườn.", "C. bón thêm phân cho cây bệnh nhanh tốt.", "D. tưới nhiều nước."], "answer": "A", "explain": "Vườn ươm cần giống sạch: loại cây bệnh + ngăn môi giới (lưới) + theo dõi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "So sánh chiến lược phòng trừ bệnh đạo ôn (do nấm) và bệnh virus. Điểm khác biệt cốt lõi là", "options": ["A. đạo ôn có thuốc đặc trị nên chữa được khi chớm; virus không có thuốc chữa nên phải phòng triệt để và loại bỏ nguồn bệnh.", "B. hai bệnh đều chữa bằng một loại thuốc.", "C. bệnh virus dễ chữa hơn đạo ôn.", "D. không có điểm khác biệt nào."], "answer": "A", "explain": "Có thuốc đặc trị hay không quyết định chiến lược: nấm chữa được khi chớm; virus chỉ phòng và loại bỏ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về con đường lây lan:", "statements": ["a) Nấm đạo ôn lây lan qua gió, nước và tàn dư cây bệnh.", "b) Vi khuẩn bạc lá lây qua nước, gió sau mưa bão.", "c) Virus lây chủ yếu qua côn trùng chích hút.", "d) Bệnh hại không bao giờ lây từ vụ này sang vụ khác."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: mầm bệnh tồn tại trong tàn dư, đất, hạt giống sang vụ sau.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về xử lí khi phát hiện bệnh:", "statements": ["a) Bệnh đạo ôn mới chớm: phun thuốc trừ nấm đặc trị ngay.", "b) Bệnh bạc lá mới chớm: thoát nước, phun thuốc trừ vi khuẩn.", "c) Cây bị virus: nhổ bỏ, tiêu huỷ và trừ môi giới.", "d) Mọi bệnh đều xử lí bằng cách phun thuốc trừ sâu."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: xử lí đúng từng đối tượng. d) Sai: thuốc trừ sâu không chữa được bệnh.", "points": 1}, {"type": "short", "level": "NB", "q": "Bệnh thối rễ do ngập úng thuộc nhóm tác nhân gây bệnh nào?", "answer": "Điều kiện ngoại cảnh bất lợi", "explain": "Ngập úng là điều kiện ngoại cảnh bất lợi gây bệnh cho cây (chấp nhận: điều kiện bất lợi).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai con đường lây lan của bệnh hại từ vụ này sang vụ khác.", "answer": "Tàn dư cây bệnh còn lại trên ruộng; hạt giống nhiễm bệnh", "explain": "Mầm bệnh tồn tại trong tàn dư cây trồng, đất, cỏ dại và hạt giống nhiễm bệnh sang vụ sau (nêu hai là đủ).", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Trong phòng trừ bệnh hại, \"phòng là chính\" thể hiện ở việc", "options": ["A. dùng giống kháng, xử lí hạt giống, vệ sinh đồng ruộng trước khi bệnh xuất hiện.", "B. đợi bệnh nặng rồi phun thuốc.", "C. phun thuốc định kì mỗi ngày.", "D. nhổ bỏ toàn bộ ruộng khi có bệnh."], "answer": "A", "explain": "\"Phòng là chính\": ngăn ngừa từ đầu bằng giống kháng, xử lí hạt giống, vệ sinh đồng ruộng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dụng cụ, tàn dư cây bệnh sau khi nhổ bỏ cần được", "options": ["A. tiêu huỷ đúng cách, không vứt bừa bãi trên ruộng.", "B. vứt ngay xuống mương nước.", "C. để đống ở bờ ruộng.", "D. mang về làm thức ăn gia súc."], "answer": "A", "explain": "Tiêu huỷ đúng cách (đốt, chôn, ủ) tránh mầm bệnh phát tán trở lại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không nên vứt cây bệnh bừa bãi trên ruộng?", "options": ["A. Vì mầm bệnh từ cây bệnh sẽ phát tán, lây sang cây khoẻ và vụ sau.", "B. Vì cây bệnh làm xấu cảnh quan.", "C. Vì cây bệnh nặng mùi.", "D. Vì pháp luật cấm vứt rác nói chung."], "answer": "A", "explain": "Cây bệnh là nguồn lây; vứt bừa bãi làm mầm bệnh phát tán.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biện pháp phơi nắng, xử lí nhiệt hạt giống thuộc nhóm nào?", "options": ["A. Vật lí.", "B. Hoá học.", "C. Sinh học.", "D. Canh tác."], "answer": "A", "explain": "Phơi nắng, xử lí nhiệt là biện pháp vật lí diệt mầm bệnh trên hạt giống.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hợp tác xã muốn sản xuất lúa an toàn, giảm thuốc hoá học. Định hướng IPM phù hợp là", "options": ["A. giống kháng + bón cân đối + thăm đồng thường xuyên + thuốc chỉ khi cần.", "B. phun thuốc định kì mỗi tuần.", "C. tăng liều thuốc để chắc chắn.", "D. bỏ hẳn việc thăm đồng."], "answer": "A", "explain": "IPM tổng hợp giảm lệ thuộc thuốc, đảm bảo an toàn và bền vững.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đánh giá hiệu quả của \"thăm đồng thường xuyên\" trong phòng trừ bệnh hại:", "options": ["A. Rất hiệu quả vì phát hiện sớm giúp xử lí kịp thời, giảm thiệt hại và chi phí.", "B. Không cần thiết vì bệnh tự khỏi.", "C. Tốn công vô ích.", "D. Chỉ cần thiết với sâu hại, không cần với bệnh hại."], "answer": "A", "explain": "Phát hiện sớm – diệt trừ kịp thời là nguyên tắc IPM, giúp giảm thiệt hại và số lần phun thuốc.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về vệ sinh đồng ruộng:", "statements": ["a) Dọn sạch tàn dư cây trồng sau thu hoạch giảm nguồn bệnh vụ sau.", "b) Cày lật đất giúp vùi lấp, tiêu diệt mầm bệnh trong đất.", "c) Tiêu huỷ đúng cách cây bệnh ngăn mầm bệnh phát tán.", "d) Vệ sinh đồng ruộng không liên quan đến phòng trừ bệnh."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vệ sinh đồng ruộng là biện pháp canh tác quan trọng phòng bệnh.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về an toàn thực phẩm:", "statements": ["a) Tuân thủ thời gian cách li giúp nông sản an toàn khi thu hoạch.", "b) Hạn chế thuốc hoá học giúp giảm tồn dư trên nông sản.", "c) Dùng đúng liều lượng tránh tồn dư vượt ngưỡng cho phép.", "d) Phun thuốc sát ngày thu hoạch giúp rau tươi lâu hơn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vi phạm thời gian cách li gây tồn dư, mất an toàn thực phẩm.", "points": 1}, {"type": "short", "level": "NB", "q": "Khi phát hiện cây trồng bị bệnh virus, biện pháp cơ giới đầu tiên cần làm là gì?", "answer": "Nhổ bỏ, tiêu huỷ cây bệnh", "explain": "Nhổ bỏ, tiêu huỷ ngay cây bệnh để loại bỏ nguồn lây lan.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao \"đúng đối tượng\" (đúng thuốc cho đúng bệnh) quan trọng trong phòng trừ bệnh hại?", "answer": "Vì thuốc trừ nấm, trừ vi khuẩn, trừ sâu khác nhau; dùng sai không diệt được mầm bệnh, gây lãng phí và ô nhiễm", "explain": "Mỗi nhóm tác nhân cần thuốc đặc trị riêng; dùng sai vừa tốn kém, vừa không hiệu quả, vừa gây hại môi trường.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Bệnh đạo ôn và bệnh bạc lá đều gây hại nặng trên cây trồng nào?", "options": ["A. Cây lúa.", "B. Cây ngô.", "C. Cây mía.", "D. Cây đậu tương."], "answer": "A", "explain": "Đạo ôn và bạc lá là hai bệnh nguy hiểm hàng đầu trên cây lúa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bệnh nào sau đây có thể làm \"gãy cổ bông\" lúa?", "options": ["A. Bệnh đạo ôn.", "B. Bệnh bạc lá.", "C. Bệnh khảm lá.", "D. Bệnh vàng lùn."], "answer": "A", "explain": "Đạo ôn cổ bông làm gãy cổ bông, hạt lép trắng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quan sát ruộng lúa thấy lá có sọc vàng từ mép lan vào, một số lá khô bạc trắng. Chẩn đoán đúng là", "options": ["A. bệnh bạc lá do vi khuẩn.", "B. bệnh đạo ôn do nấm.", "C. rầy nâu gây hại.", "D. thiếu kali."], "answer": "A", "explain": "Sọc vàng từ mép lá, khô bạc trắng là triệu chứng đặc trưng của bạc lá.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quan sát ruộng lúa thấy vết hình thoi mắt én trên lá, một số cổ bông bị gãy. Chẩn đoán đúng là", "options": ["A. bệnh đạo ôn do nấm.", "B. bệnh bạc lá do vi khuẩn.", "C. sâu đục thân.", "D. bọ trĩ."], "answer": "A", "explain": "Vết hình thoi mắt én + gãy cổ bông là triệu chứng đặc trưng của đạo ôn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nông dân nhầm bệnh bạc lá thành đạo ôn và phun thuốc trừ nấm. Hậu quả là", "options": ["A. bệnh không khỏi, tốn tiền thuốc và bệnh tiếp tục lây lan.", "B. bệnh khỏi hoàn toàn.", "C. lúa tốt hơn vì được phun thuốc.", "D. vi khuẩn bị tiêu diệt."], "answer": "A", "explain": "Thuốc trừ nấm không diệt được vi khuẩn; chẩn đoán sai dẫn đến lãng phí và mất thời cơ xử lí.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Bài học rút ra từ tình huống trên là", "options": ["A. phải chẩn đoán đúng tác nhân gây bệnh trước khi chọn thuốc và biện pháp.", "B. nên phun nhiều loại thuốc cùng lúc cho chắc.", "C. không cần quan tâm triệu chứng bệnh.", "D. thuốc trừ nấm dùng được cho mọi bệnh."], "answer": "A", "explain": "Chẩn đoán đúng là bước đầu tiên, quyết định hiệu quả phòng trừ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (ôn tập chẩn đoán):", "statements": ["a) Vết hình thoi mắt én là đạo ôn do nấm.", "b) Sọc vàng mép lá là bạc lá do vi khuẩn.", "c) Khảm, xoăn lá là bệnh virus.", "d) Dảnh héo, bông bạc là bệnh đạo ôn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: dảnh héo, bông bạc là sâu đục thân (Bài 16).", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về phối hợp phòng trừ:", "statements": ["a) Có thể kết hợp giống kháng với bón phân cân đối.", "b) Có thể kết hợp nhổ cây bệnh với phun thuốc đúng đối tượng.", "c) Có thể kết hợp trừ môi giới với dùng giống sạch bệnh để phòng virus.", "d) Không thể phối hợp nhiều biện pháp với nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: IPM là phối hợp các biện pháp. d) Sai.", "points": 1}, {"type": "short", "level": "NB", "q": "Nêu tên tác nhân gây bệnh bạc lá lúa.", "answer": "Vi khuẩn", "explain": "Bệnh bạc lá lúa do vi khuẩn Xanthomonas oryzae gây ra.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai dấu hiệu giúp phân biệt nhanh bệnh đạo ôn và bệnh bạc lá trên lá lúa.", "answer": "Đạo ôn: vết hình thoi mắt én; bạc lá: sọc vàng từ mép lá lan vào", "explain": "Đạo ôn: vết hình thoi như mắt én; bạc lá: sọc vàng xuất phát từ mép, chóp lá.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Biện pháp nào sau đây phòng được nhiều loại bệnh hại cùng lúc?", "options": ["A. Dùng giống kháng bệnh, vệ sinh đồng ruộng, bón phân cân đối.", "B. Phun một loại thuốc duy nhất.", "C. Chỉ trồng một vụ trong năm.", "D. Không chăm sóc gì."], "answer": "A", "explain": "Các biện pháp canh tác nền tảng phòng được nhiều bệnh cùng lúc, bền vững.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong IPM phòng trừ bệnh hại, thuốc hoá học được xếp ở vị trí nào?", "options": ["A. Biện pháp cuối cùng, chỉ dùng khi cần thiết.", "B. Biện pháp đầu tiên, dùng thường xuyên.", "C. Không bao giờ được dùng.", "D. Dùng thay cho mọi biện pháp khác."], "answer": "A", "explain": "Thuốc hoá học là biện pháp cuối cùng trong IPM, dùng khi cần thiết và đúng 4 đúng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao bệnh hại cây trồng thường khó phát hiện sớm hơn sâu hại?", "options": ["A. Vì triệu chứng ban đầu mờ nhạt, mầm bệnh rất nhỏ, khó quan sát bằng mắt thường.", "B. Vì bệnh không gây thiệt hại.", "C. Vì bệnh chỉ xuất hiện vào ban đêm.", "D. Vì sâu hại to hơn nên dễ thấy."], "answer": "A", "explain": "Mầm bệnh vi sinh vật rất nhỏ, triệu chứng đầu mờ nhạt nên cần thăm đồng kĩ, thường xuyên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thăm đồng thường xuyên giúp phòng trừ bệnh hại vì", "options": ["A. phát hiện triệu chứng sớm để xử lí kịp thời trước khi lây lan.", "B. giúp cây quang hợp tốt hơn.", "C. xua đuổi được mầm bệnh.", "D. làm đất tơi xốp hơn."], "answer": "A", "explain": "Phát hiện sớm – xử lí kịp thời là nguyên tắc IPM, đặc biệt quan trọng với bệnh hại lây lan nhanh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một mô hình trồng rau an toàn áp dụng: giống kháng, lưới ngăn côn trùng, bẫy dính, chế phẩm sinh học. Kết quả mong đợi là", "options": ["A. giảm sâu bệnh, giảm thuốc hoá học, rau an toàn, hiệu quả bền vững.", "B. sâu bệnh tăng mạnh.", "C. chi phí tăng cao không hiệu quả.", "D. rau không lớn được."], "answer": "A", "explain": "IPM tổng hợp cho rau an toàn: giảm sâu bệnh, giảm thuốc, bền vững.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tổng kết chương trình phòng trừ bệnh hại bền vững cần dựa trên nguyên tắc nào?", "options": ["A. Phòng là chính; chẩn đoán đúng; phối hợp biện pháp; an toàn và bền vững.", "B. Chỉ dùng thuốc hoá học.", "C. Chỉ dùng biện pháp sinh học.", "D. Không cần phòng trừ gì."], "answer": "A", "explain": "Tổng hợp các nguyên tắc IPM đã học: phòng là chính, chẩn đoán đúng, phối hợp, an toàn bền vững.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp: tác nhân, phòng bệnh):", "statements": ["a) Đạo ôn do nấm, bạc lá do vi khuẩn, khảm xoăn lá do virus.", "b) Phòng bệnh quan trọng hơn chữa bệnh, nhất là với bệnh virus.", "c) Bón phân cân đối, thoát nước tốt giúp hạn chế nhiều bệnh.", "d) Mọi bệnh hại đều có thuốc đặc trị hiệu quả."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: bệnh virus chưa có thuốc đặc trị cho cây trồng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp: chẩn đoán, xử lí):", "statements": ["a) Chẩn đoán đúng tác nhân là cơ sở chọn đúng thuốc.", "b) Nhổ bỏ cây bệnh kịp thời giúp ngăn lây lan.", "c) Trừ côn trùng môi giới giúp phòng bệnh virus.", "d) Vệ sinh đồng ruộng không có tác dụng phòng bệnh."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vệ sinh đồng ruộng giảm nguồn bệnh vụ sau.", "points": 1}, {"type": "short", "level": "NB", "q": "Nêu một nguyên tắc quan trọng nhất trong phòng trừ bệnh hại cây trồng.", "answer": "Phòng là chính", "explain": "Nguyên tắc \"phòng là chính\" là cốt lõi của IPM trong phòng trừ cả sâu và bệnh hại.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao nói \"một biện pháp phòng ngừa hiệu quả bằng nhiều lần chữa trị\" trong phòng trừ bệnh hại?", "answer": "Vì bệnh lây lan nhanh, nhiều bệnh không có thuốc chữa; phòng từ đầu rẻ hơn, hiệu quả hơn chữa khi đã lan rộng", "explain": "Phòng ngừa (giống kháng, vệ sinh...) ngăn bệnh phát sinh với chi phí thấp; khi bệnh đã lan rộng thì tốn kém, khó kiểm soát.", "points": 0.5}]}]}</script>
