, "B. trừ sâu ăn lá.", "C. trừ rầy nâu.", "D. gây bệnh cho cây trồng."], "answer": "A", "explain": "Trichoderma là nấm đối kháng trừ nấm bệnh hại rễ, có ích cho cây.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bẫy đèn trong phòng trừ sâu hại có tác dụng", "options": ["A. thu hút, bắt bướm trưởng thành, giảm nguồn trứng lứa sau.", "B. diệt sâu non trong thân cây.", "C. xua đuổi chim ăn lúa.", "D. làm lúa quang hợp tốt hơn."], "answer": "A", "explain": "Bướm hướng sáng, bẫy đèn bắt bướm đẻ trứng – biện pháp vật lí.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ong kí sinh Trichogramma giúp trừ sâu đục thân bằng cách", "options": ["A. kí sinh vào trứng sâu, ngăn trứng nở.", "B. ăn thịt sâu non trong thân.", "C. đốt chết bướm.", "D. hút nhựa cây làm sâu chết đói."], "answer": "A", "explain": "Ong Trichogramma kí sinh trứng sâu đục thân – biện pháp sinh học.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ruộng rau bị sâu tơ và bọ trĩ cùng lúc. Phác đồ vi sinh phù hợp là", "options": ["A. phun Bt trừ sâu tơ + nấm Beauveria trừ bọ trĩ, kết hợp bẫy dính.", "B. chỉ phun Bt cho cả hai.", "C. chỉ phun Beauveria cho cả hai.", "D. phun thuốc hoá học phổ rộng."], "answer": "A", "explain": "Mỗi đối tượng cần chế phẩm đặc hiệu: Bt cho sâu ăn lá, Beauveria cho bọ trĩ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao phải \"đúng đối tượng\" khi dùng chế phẩm vi sinh?", "options": ["A. Vì mỗi chế phẩm có phổ hẹp, đặc hiệu; sai đối tượng sẽ không hiệu quả, lãng phí.", "B. Vì chế phẩm vi sinh rất đắt.", "C. Vì pháp luật quy định nghiêm ngặt.", "D. Vì dùng sai sẽ làm cây chết."], "answer": "A", "explain": "Phổ hẹp là đặc tính của chế phẩm vi sinh; đúng đối tượng mới hiệu quả.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về biện pháp vật lí – cơ giới:", "statements": ["a) Bẫy đèn bắt bướm sâu hại.", "b) Bẫy dính màu bắt bọ trĩ.", "c) Bắt sâu bằng tay, ngắt lá bệnh.", "d) Thả ong kí sinh trừ sâu."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: vật lí – cơ giới. d) Sai: thả ong kí sinh là biện pháp sinh học.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về an toàn:", "statements": ["a) Phun thuốc cần mang đồ bảo hộ.", "b) Tuân thủ thời gian cách li trước thu hoạch.", "c) Thu gom, xử lí bao bì thuốc đúng quy định.", "d) Có thể pha thuốc bằng tay trần cho nhanh."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: an toàn cho người và môi trường. d) Sai: phải dùng dụng cụ, găng tay.", "points": 1}, {"type": "short", "level": "NB", "q": "Bọ trĩ còn có tên gọi khác là gì?", "answer": "Bù lạch", "explain": "Bọ trĩ còn gọi là bù lạch, chích hút làm lá non quăn queo.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai việc làm thuộc nhóm canh tác giúp phòng sâu, bệnh hại.", "answer": "Vệ sinh đồng ruộng; luân canh; dùng giống kháng; bón phân cân đối; gieo đúng thời vụ", "explain": "Các biện pháp canh tác: giống kháng, vệ sinh đồng ruộng, luân canh, bón cân đối, đúng thời vụ (nêu hai là đủ).", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Virus NPV có đặc điểm", "options": ["A. đặc hiệu với sâu hại, rất an toàn với người và thiên địch.", "B. gây bệnh cho mọi loài vật.", "C. gây bệnh cho cây trồng.", "D. lây sang người."], "answer": "A", "explain": "NPV đặc hiệu với sâu bộ cánh vảy, an toàn tuyệt đối.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Rầy nâu thuộc nhóm sâu hại nào?", "options": ["A. Chích hút.", "B. Cắn nhai.", "C. Đục thân.", "D. Ăn rễ."], "answer": "A", "explain": "Rầy nâu chích hút nhựa ở gốc lúa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung của bệnh đạo ôn và bệnh bạc lá là", "options": ["A. đều gây hại nặng trên lúa và phòng bằng giống kháng, bón cân đối.", "B. đều do virus gây ra.", "C. đều không có thuốc phòng trừ.", "D. đều chỉ hại rễ lúa."], "answer": "A", "explain": "Cả hai đều là bệnh nguy hiểm trên lúa; khác nhau ở tác nhân (nấm/vi khuẩn) và triệu chứng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao chế phẩm vi sinh nên phun vào chiều mát?", "options": ["A. Vì nắng gắt, tia tử ngoại tiêu diệt vi sinh vật, giảm hiệu quả.", "B. Vì sâu chỉ hoạt động chiều mát.", "C. Vì chiều mát thuốc rẻ hơn.", "D. Vì sáng sớm vi sinh vật ngủ."], "answer": "A", "explain": "Vi sinh vật nhạy cảm với UV và nhiệt cao.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nông dân phun Bt giữa trưa nắng gắt, hiệu quả kém. Bài học là", "options": ["A. phải phun chiều mát, đúng kĩ thuật thì chế phẩm mới phát huy tác dụng.", "B. Bt không có tác dụng.", "C. nên tăng liều gấp đôi.", "D. nên phun lúc nửa đêm."], "answer": "A", "explain": "Sai thời điểm làm vi sinh vật chết; đúng kĩ thuật là yếu tố quyết định.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đánh giá: \"Chế phẩm vi sinh đắt hơn thuốc hoá học nên không nên dùng.\"", "options": ["A. Sai, vì tính cả chi phí lâu dài, an toàn và bền vững thì vi sinh + IPM hiệu quả hơn.", "B. Đúng, vì chỉ giá mua ban đầu mới quan trọng.", "C. Đúng, vì vi sinh không có tác dụng.", "D. Sai, vì chế phẩm vi sinh luôn rẻ hơn."], "answer": "A", "explain": "Đánh giá phải toàn diện: chi phí lâu dài, sức khoẻ, môi trường, tính bền vững.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về phân loại biện pháp:", "statements": ["a) Giống kháng, luân canh: canh tác.", "b) Bt, Trichoderma, ong kí sinh: sinh học.", "c) Bẫy đèn, bẫy dính, bắt tay: vật lí – cơ giới.", "d) Thuốc BVTV: hoá học."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng: phân loại 4 nhóm biện pháp IPM.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nguyên tắc dùng chế phẩm vi sinh:", "statements": ["a) Chế phẩm vi sinh cần dùng sớm vì tác dụng chậm.", "b) Không pha chung vi sinh với thuốc hoá học mạnh.", "c) Bảo quản vi sinh nơi khô mát, đúng hạn dùng.", "d) Vi sinh dùng một lần trừ được mọi lứa sâu."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần theo dõi, có thể xử lí nhắc lại.", "points": 1}, {"type": "short", "level": "NB", "q": "Nêu một ưu điểm của chế phẩm vi sinh.", "answer": "An toàn với người và môi trường", "explain": "Các ưu điểm: an toàn, không tồn dư, ít kháng thuốc, hiệu quả kéo dài (một đáp án đúng).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao IPM được gọi là \"quản lí\" chứ không phải \"tiêu diệt\" dịch hại?", "answer": "Vì mục tiêu là giữ sâu bệnh dưới ngưỡng gây hại kinh tế, không cần diệt sạch tuyệt đối, để bảo vệ cân bằng sinh thái", "explain": "IPM chấp nhận mật độ thấp không gây hại kinh tế, tránh diệt sạch gây tốn kém và phá vỡ sinh thái.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Sâu đục thân gây hại ở giai đoạn nào?", "options": ["A. Sâu non.", "B. Trứng.", "C. Nhộng.", "D. Bướm."], "answer": "A", "explain": "Sâu non đục thân gây hại; bướm đẻ trứng không trực tiếp phá hoại.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bệnh khảm lá do tác nhân nào gây ra?", "options": ["A. Virus.", "B. Nấm.", "C. Vi khuẩn.", "D. Côn trùng."], "answer": "A", "explain": "Khảm lá do virus, lây qua côn trùng chích hút.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao khi sâu đục thân đã vào sâu trong thân thì khó trừ bằng thuốc?", "options": ["A. Vì thân cây che chắn, thuốc khó tiếp xúc với sâu non.", "B. Vì sâu có áo giáp chống thuốc.", "C. Vì thuốc không thấm vào cây.", "D. Vì sâu đã hoá nhộng."], "answer": "A", "explain": "Sâu trong thân được che chắn; cần phun khi sâu mới nở còn ở ngoài.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biện pháp \"nhổ bỏ, tiêu huỷ cây bệnh\" có tác dụng", "options": ["A. loại bỏ nguồn lây lan mầm bệnh.", "B. làm đất tơi xốp.", "C. tăng năng suất cây còn lại gấp đôi.", "D. diệt được virus trong đất."], "answer": "A", "explain": "Loại bỏ nguồn bệnh là biện pháp cơ giới quan trọng, nhất là với bệnh virus.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hợp tác xã muốn sản xuất lúa gạo an toàn. Định hướng đúng là", "options": ["A. IPM + ưu tiên vi sinh, giảm thuốc hoá học, tuân thủ cách li.", "B. phun thuốc định kì mỗi tuần.", "C. tăng liều thuốc để chắc chắn.", "D. không phòng trừ gì."], "answer": "A", "explain": "Sản xuất an toàn cần IPM tổng hợp, giảm thuốc, đảm bảo cách li.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một mô hình rau hữu cơ thành công nhờ Bt + bẫy dính + lưới ngăn côn trùng. Bài học là", "options": ["A. phối hợp nhiều biện pháp an toàn có thể thay thế thuốc hoá học trong nhiều trường hợp.", "B. thuốc hoá học là không thể thay thế.", "C. rau hữu cơ không cần phòng trừ.", "D. chỉ cần một biện pháp là đủ."], "answer": "A", "explain": "Phối hợp biện pháp an toàn cho hiệu quả tổng hợp, giảm lệ thuộc thuốc.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về triệu chứng:", "statements": ["a) Dảnh héo, bông bạc: sâu đục thân.", "b) Cháy rầy thành đám: rầy nâu.", "c) Vết hình thoi mắt én: đạo ôn.", "d) Sọc vàng mép lá: bạc lá."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 đều đúng: triệu chứng đặc trưng giúp chẩn đoán nhanh.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tác hại sâu bệnh:", "statements": ["a) Giảm năng suất, có thể mất trắng khi thành dịch.", "b) Giảm chất lượng nông sản.", "c) Tăng chi phí sản xuất.", "d) Không ảnh hưởng đến môi trường."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: lạm dụng thuốc gây ô nhiễm môi trường.", "points": 1}, {"type": "short", "level": "NB", "q": "Kể tên một loài thiên địch của sâu hại.", "answer": "Ong kí sinh", "explain": "Thiên địch: ong kí sinh, bọ rùa, nhện bắt mồi, ếch nhái (một đáp án đúng).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai hậu quả của việc lạm dụng thuốc hoá học.", "answer": "Sâu bệnh kháng thuốc; diệt thiên địch; ô nhiễm môi trường; tồn dư trên nông sản", "explain": "Các hậu quả: kháng thuốc, mất cân bằng sinh thái, ô nhiễm, tồn dư, hại sức khoẻ (nêu hai là đủ).", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Nấm Beauveria bassiana trừ được đối tượng nào?", "options": ["A. Rầy, rệp, bọ trĩ (côn trùng gây hại).", "B. Nấm bệnh hại rễ.", "C. Sâu ăn lá bộ cánh vảy.", "D. Vi khuẩn bạc lá."], "answer": "A", "explain": "Beauveria kí sinh côn trùng; nấm bệnh rễ dùng Trichoderma; sâu ăn lá dùng Bt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tắc \"4 đúng\" khi dùng thuốc KHÔNG gồm", "options": ["A. đúng giá rẻ nhất.", "B. đúng thuốc.", "C. đúng lúc.", "D. đúng cách."], "answer": "A", "explain": "4 đúng: đúng thuốc, đúng lúc, đúng liều lượng và nồng độ, đúng cách.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cần luân phiên thuốc khi phun nhiều lần?", "options": ["A. Để hạn chế sâu bệnh hình thành tính kháng thuốc.", "B. Để thuốc có mùi mới.", "C. Để tăng doanh số bán thuốc.", "D. Để cây quen với nhiều loại thuốc."], "answer": "A", "explain": "Luân phiên hoạt chất là nguyên tắc chống kháng thuốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "\"Ngưỡng gây hại kinh tế\" là", "options": ["A. mật độ sâu bệnh mà thiệt hại bắt đầu lớn hơn chi phí phòng trừ.", "B. mật độ sâu bệnh bằng không.", "C. lúc sâu bệnh phá hết ruộng.", "D. số lượng thuốc cần phun."], "answer": "A", "explain": "Dưới ngưỡng thì không cần phun; vượt ngưỡng mới can thiệp – nguyên tắc kinh tế của IPM.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ruộng lúa có rầy nâu dưới ngưỡng, nhiều nhện bắt mồi. Xử lí đúng là", "options": ["A. theo dõi tiếp, bảo vệ nhện, chưa phun thuốc.", "B. phun ngay liều cao.", "C. phun diệt cả nhện.", "D. bỏ ruộng."], "answer": "A", "explain": "Dưới ngưỡng + còn thiên địch thì theo dõi, chưa cần thuốc.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phun thuốc khi dưới ngưỡng gây hại kinh tế sẽ dẫn đến", "options": ["A. lãng phí, diệt thiên địch, tăng nguy cơ kháng thuốc và ô nhiễm.", "B. năng suất tăng vượt trội.", "C. sâu bệnh biến mất vĩnh viễn.", "D. đất màu mỡ hơn."], "answer": "A", "explain": "Phun dưới ngưỡng gây nhiều tác hại mà không hiệu quả kinh tế.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về ý nghĩa phòng trừ:", "statements": ["a) Bảo vệ năng suất, chất lượng nông sản.", "b) Giảm chi phí, tăng hiệu quả kinh tế.", "c) Bảo vệ môi trường, an toàn thực phẩm.", "d) Chỉ có ý nghĩa với cây lúa."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: mọi cây trồng đều cần phòng trừ sâu bệnh.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về hạn chế chế phẩm vi sinh:", "statements": ["a) Tác dụng chậm hơn thuốc hoá học.", "b) Phụ thuộc điều kiện môi trường.", "c) Phổ tác dụng hẹp.", "d) Gây ô nhiễm môi trường nặng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vi sinh an toàn, thân thiện môi trường.", "points": 1}, {"type": "short", "level": "NB", "q": "Kể tên 2 chế phẩm vi sinh dùng trong phòng trừ sâu bệnh hại cây trồng.", "answer": "chế phẩm Bt, nấm Trichoderma", "explain": "Các chế phẩm vi sinh phổ biến: chế phẩm Bt (diệt sâu), nấm Trichoderma và nấm xanh Metarhizium (đối kháng sâu bệnh), virus NPV.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích vì sao \"phát hiện sớm\" giúp giảm chi phí phòng trừ.", "answer": "Vì xử lí khi sâu bệnh mới chớm cần ít thuốc, ít công hơn; ngăn được lây lan thành dịch gây thiệt hại lớn", "explain": "Phát hiện sớm – xử lí kịp thời giảm liều lượng, số lần phun và ngăn dịch, tiết kiệm chi phí.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Bệnh nào sau đây do điều kiện ngoại cảnh bất lợi gây ra?", "options": ["A. Thối rễ do ngập úng kéo dài.", "B. Đạo ôn hại lúa.", "C. Bạc lá lúa.", "D. Khảm lá."], "answer": "A", "explain": "Ngập úng là điều kiện bất lợi; các bệnh còn lại do vi sinh vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biện pháp nào sau đây là \"phòng là chính\"?", "options": ["A. Dùng giống kháng bệnh trước khi gieo trồng.", "B. Đợi bệnh nặng rồi phun thuốc.", "C. Phun thuốc mỗi ngày.", "D. Nhổ bỏ cả ruộng khi có bệnh."], "answer": "A", "explain": "Giống kháng là phòng ngừa từ đầu; các đáp án còn lại là chữa hoặc lạm dụng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Côn trùng chích hút như rầy, rệp nguy hiểm vì", "options": ["A. vừa chích hút trực tiếp, vừa truyền bệnh virus.", "B. cắn đứt rễ cây.", "C. ăn hết hạt giống.", "D. làm đất bị chua."], "answer": "A", "explain": "Tác hại kép: chích hút + môi giới truyền virus.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để phòng bệnh virus cho vụ sau, cần", "options": ["A. dùng giống sạch bệnh, vệ sinh vườn, trừ môi giới.", "B. phun thuốc trừ nấm định kì.", "C. bón thật nhiều đạm.", "D. tưới thật nhiều nước."], "answer": "A", "explain": "Virus không có thuốc chữa nên phòng tổng hợp: giống sạch + vệ sinh + trừ môi giới.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vườn cây ăn quả bị rệp sáp, có bọ rùa. Xử lí IPM đúng là", "options": ["A. bảo vệ bọ rùa, phun chế phẩm vi sinh khi cần, hạn chế thuốc hoá học.", "B. phun thuốc phổ rộng diệt cả rệp và bọ rùa.", "C. chặt bỏ cây bị rệp.", "D. không làm gì."], "answer": "A", "explain": "Bảo vệ thiên địch bọ rùa + vi sinh khi cần; thuốc phổ rộng diệt cả thiên địch.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Vì sao \"bảo vệ thiên địch\" là biện pháp \"miễn phí mà hiệu quả\"?", "options": ["A. Vì thiên địch tự sinh sản, tiêu diệt sâu hại liên tục không tốn tiền thuốc.", "B. Vì thiên địch giúp cây lớn nhanh.", "C. Vì thiên địch không cần thức ăn.", "D. Vì thiên địch diệt được mọi bệnh."], "answer": "A", "explain": "Thiên địch khống chế sâu hại tự nhiên, lâu dài, không tốn chi phí.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về con đường lây bệnh:", "statements": ["a) Nấm bệnh lây qua gió, nước, tàn dư cây bệnh.", "b) Vi khuẩn lây qua nước, gió sau mưa bão.", "c) Virus lây qua côn trùng chích hút.", "d) Bệnh không lây từ vụ này sang vụ khác."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: mầm bệnh tồn tại trong tàn dư, đất, hạt giống.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về dùng thuốc đúng kĩ thuật:", "statements": ["a) Dùng đúng thuốc cho đúng đối tượng mới hiệu quả.", "b) Phun thuốc khi bệnh mới chớm hiệu quả hơn khi đã nặng.", "c) Có thể pha chung vi sinh với thuốc hoá học mạnh.", "d) Cần tuân thủ thời gian cách li sau phun thuốc."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: thuốc hoá học mạnh diệt vi sinh vật có ích.", "points": 1}, {"type": "short", "level": "NB", "q": "Nêu một biện pháp vật lí phòng trừ sâu hại.", "answer": "Bẫy đèn", "explain": "Các biện pháp vật lí: bẫy đèn, bẫy dính màu, bắt tay, ngắt lá bệnh (một đáp án đúng).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao \"thăm đồng thường xuyên\" là việc làm không thể thiếu trong IPM?", "answer": "Vì giúp phát hiện sớm sâu bệnh để xử lí kịp thời, tránh lây lan thành dịch", "explain": "Phát hiện sớm là cơ sở để diệt trừ kịp thời – nguyên tắc then chốt của IPM.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Chế phẩm vi sinh nào dùng để ủ phân chuồng, bón lót phòng nấm bệnh rễ?", "options": ["A. Nấm Trichoderma.", "B. Chế phẩm Bt.", "C. Virus NPV.", "D. Nấm Beauveria."], "answer": "A", "explain": "Trichoderma trộn phân hữu cơ bón lót, ủ phân phòng nấm bệnh hại rễ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sâu hại nào làm lá lúa chỉ còn trơ gân trắng?", "options": ["A. Sâu cuốn lá.", "B. Rầy nâu.", "C. Sâu đục thân.", "D. Bọ trĩ."], "answer": "A", "explain": "Sâu cuốn lá ăn thịt lá chỉ còn gân trắng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi nào nên dùng thuốc hoá học trong IPM?", "options": ["A. Khi sâu bệnh vượt ngưỡng và các biện pháp khác không đủ hiệu quả.", "B. Phun định kì mỗi tuần.", "C. Phun ngay khi thấy một con sâu.", "D. Phun theo lịch cố định."], "answer": "A", "explain": "Thuốc là biện pháp cuối cùng, dùng khi cần thiết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ưu điểm của biện pháp sinh học so với hoá học là", "options": ["A. an toàn, ít ô nhiễm, ít gây kháng thuốc.", "B. tác dụng nhanh hơn.", "C. diệt được mọi đối tượng.", "D. không cần kĩ thuật."], "answer": "A", "explain": "Sinh học an toàn, bền vững; nhược điểm là tác dụng chậm hơn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một trang trại áp dụng IPM thấy sâu bệnh giảm, chi phí thuốc giảm một nửa. Kết luận đúng là", "options": ["A. IPM mang lại hiệu quả kinh tế và môi trường.", "B. sâu bệnh tự hết không cần biện pháp.", "C. thuốc hoá học không còn tác dụng.", "D. nông dân may mắn."], "answer": "A", "explain": "IPM giảm chi phí thuốc, bảo vệ môi trường mà vẫn kiểm soát được sâu bệnh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong tương lai, hướng phát triển của phòng trừ sâu bệnh là", "options": ["A. tăng cường biện pháp sinh học, công nghệ vi sinh, giảm dần hoá chất.", "B. tăng liều thuốc hoá học.", "C. phun thuốc bằng máy bay mỗi ngày.", "D. bỏ hẳn việc phòng trừ."], "answer": "A", "explain": "Xu hướng: sinh học, vi sinh, công nghệ cao – an toàn, bền vững.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về kĩ thuật dùng vi sinh:", "statements": ["a) Phun chiều mát, tránh nắng gắt.", "b) Dùng sớm khi sâu bệnh mới chớm.", "c) Chọn chế phẩm đúng đối tượng.", "d) Pha chung với thuốc trừ nấm hoá học mạnh."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về đặc tính các chế phẩm vi sinh:", "statements": ["a) Bt an toàn với ong mật và thiên địch.", "b) Trichoderma giúp phân huỷ chất hữu cơ.", "c) Beauveria lây lan tự nhiên trong quần thể côn trùng.", "d) NPV gây bệnh cho người."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: NPV chỉ gây bệnh cho sâu hại, an toàn với người.", "points": 1}, {"type": "short", "level": "NB", "q": "Kể tên một chế phẩm vi sinh trừ côn trùng gây hại.", "answer": "Nấm Beauveria", "explain": "Nấm Beauveria (hoặc Metarhizium) kí sinh côn trùng như rầy, rệp, bọ trĩ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai nguyên tắc sử dụng chế phẩm vi sinh đúng kĩ thuật.", "answer": "Dùng sớm khi sâu bệnh mới chớm; phun chiều mát; đúng đối tượng; bảo quản đúng cách", "explain": "Các nguyên tắc: dùng sớm, chiều mát, đúng đối tượng, bảo quản đúng, không pha chung thuốc mạnh (nêu hai là đủ).", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Bệnh đạo ôn lây lan mạnh khi", "options": ["A. ẩm độ cao, trời âm u, bón thừa đạm.", "B. trời nắng nóng, khô hạn.", "C. bón phân cân đối.", "D. gieo thưa, đúng thời vụ."], "answer": "A", "explain": "Ẩm cao + thừa đạm là điều kiện thuận lợi cho nấm đạo ôn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bọ trĩ gây hại ở bộ phận nào của cây?", "options": ["A. Lá non, đọt non.", "B. Rễ cây.", "C. Thân già.", "D. Hạt khô."], "answer": "A", "explain": "Bọ trĩ chích hút lá non, đọt non làm quăn queo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không vứt cây bệnh bừa bãi trên ruộng?", "options": ["A. Vì mầm bệnh sẽ phát tán, lây sang cây khoẻ và vụ sau.", "B. Vì làm xấu ruộng.", "C. Vì cây bệnh nặng mùi.", "D. Vì tốn công dọn."], "answer": "A", "explain": "Cây bệnh là nguồn lây; cần tiêu huỷ đúng cách.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Luân canh giúp phòng sâu bệnh vì", "options": ["A. cắt đứt nguồn thức ăn, vòng đời của sâu bệnh chuyên tính.", "B. làm đất màu mỡ hơn.", "C. giúp cây cao lớn.", "D. diệt được mọi mầm bệnh."], "answer": "A", "explain": "Luân canh cây khác họ cắt vòng đời sâu bệnh chuyên tính.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sau thu hoạch lúa bị đạo ôn nặng, cần xử lí ruộng thế nào?", "options": ["A. Dọn sạch tàn dư, cày lật đất, phơi ải để diệt nguồn bệnh.", "B. Để nguyên tàn dư cho vụ sau.", "C. Đốt rơm rạ ngay trên ruộng ướt.", "D. Ngâm nước ruộng liên tục."], "answer": "A", "explain": "Vệ sinh đồng ruộng + cày lật, phơi ải diệt nguồn nấm bệnh cho vụ sau.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tổng hợp: một quy trình IPM hoàn chỉnh cho ruộng lúa gồm các bước nào?", "options": ["A. Giống kháng – vệ sinh đồng ruộng – bón cân đối – bẫy đèn, thiên địch – thăm đồng – thuốc khi cần.", "B. Chỉ phun thuốc định kì.", "C. Chỉ dùng giống kháng.", "D. Bỏ hoang ruộng."], "answer": "A", "explain": "Quy trình IPM đầy đủ từ phòng ngừa đến can thiệp có chọn lọc.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (nhận diện nhanh):", "statements": ["a) Vết hình thoi mắt én: đạo ôn.", "b) Sọc vàng mép lá: bạc lá.", "c) Lá cuốn ống: sâu cuốn lá.", "d) Lá non quăn: sâu đục thân."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: lá non quăn là bọ trĩ; sâu đục thân gây dảnh héo, bông bạc.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về nguyên tắc phòng trừ:", "statements": ["a) Chẩn đoán đúng giúp chọn đúng biện pháp.", "b) Phối hợp biện pháp hiệu quả hơn dùng đơn lẻ.", "c) Ưu tiên biện pháp an toàn, bền vững.", "d) Thuốc hoá học nên dùng đầu tiên."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: tinh thần IPM. d) Sai: thuốc là biện pháp cuối cùng.", "points": 1}, {"type": "short", "level": "NB", "q": "Nêu một tác hại của bệnh đạo ôn đối với bông lúa.", "answer": "Gãy cổ bông", "explain": "Đạo ôn cổ bông làm gãy cổ bông, hạt lép trắng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao \"vệ sinh đồng ruộng sau thu hoạch\" quan trọng với cả sâu và bệnh?", "answer": "Vì tàn dư là nơi trú ẩn của sâu và nguồn mầm bệnh cho vụ sau; dọn sạch cắt đứt vòng đời của chúng", "explain": "Tàn dư chứa nhộng sâu, mầm nấm, vi khuẩn; vệ sinh + cày lật diệt nguồn sâu bệnh vụ sau.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "IPM là viết tắt của", "options": ["A. Integrated Pest Management – quản lí dịch hại tổng hợp.", "B. International Plant Medicine.", "C. Insect Protection Method.", "D. Irrigation Pest Monitoring."], "answer": "A", "explain": "IPM = quản lí dịch hại tổng hợp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mục tiêu của IPM là", "options": ["A. giữ sâu bệnh dưới ngưỡng gây hại kinh tế, an toàn, bền vững.", "B. diệt sạch tuyệt đối mọi sâu bệnh.", "C. cấm hoàn toàn thuốc BVTV.", "D. tăng mật độ sâu bệnh."], "answer": "A", "explain": "IPM quản lí ở mức không gây hại kinh tế, không diệt sạch tuyệt đối.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác biệt lớn nhất giữa biện pháp hoá học và sinh học là", "options": ["A. hoá học nhanh nhưng nhiều tác dụng phụ; sinh học an toàn, bền vững nhưng chậm.", "B. hoá học luôn tốt hơn.", "C. sinh học luôn nhanh hơn.", "D. không có khác biệt."], "answer": "A", "explain": "So sánh đúng bản chất hai nhóm biện pháp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nông nghiệp bền vững cần giảm thuốc hoá học?", "options": ["A. Vì thuốc gây ô nhiễm, kháng thuốc, tồn dư, phá vỡ sinh thái.", "B. Vì thuốc quá rẻ.", "C. Vì thuốc không có tác dụng.", "D. Vì nông dân không biết phun."], "answer": "A", "explain": "Các tác hại của lạm dụng thuốc đối với bền vững.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một xã đạt chuẩn nông thôn mới nhờ mô hình lúa an toàn ít thuốc. Yếu tố then chốt là", "options": ["A. nông dân được tập huấn IPM và áp dụng đồng bộ.", "B. phát thuốc miễn phí.", "C. cấm trồng lúa.", "D. may mắn thời tiết."], "answer": "A", "explain": "Tập huấn + áp dụng đồng bộ IPM là then chốt.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Thông điệp chính của chương V là", "options": ["A. chẩn đoán đúng – phòng là chính – phối hợp IPM – ưu tiên sinh học, vi sinh để bền vững.", "B. chỉ dùng thuốc hoá học.", "C. không cần phòng trừ.", "D. diệt sạch mọi sinh vật."], "answer": "A", "explain": "Tổng hợp tinh thần toàn chương V.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp: khái niệm, IPM):", "statements": ["a) Sâu hại là động vật; bệnh hại do vi sinh vật hoặc điều kiện bất lợi.", "b) Đạo ôn (nấm), bạc lá (vi khuẩn), virus gây khảm xoăn lá.", "c) IPM: phòng là chính, phối hợp biện pháp, bảo vệ thiên địch.", "d) Chế phẩm vi sinh thuộc nhóm hoá học."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vi sinh thuộc nhóm sinh học.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp: vi sinh, nguyên tắc):", "statements": ["a) Bt, NPV trừ sâu; Trichoderma trừ nấm bệnh rễ; Beauveria trừ côn trùng.", "b) Vi sinh an toàn nhưng tác dụng chậm, phổ hẹp.", "c) Dùng vi sinh cần sớm, chiều mát, đúng đối tượng.", "d) IPM khuyến khích lạm dụng thuốc hoá học."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: IPM hạn chế thuốc hoá học.", "points": 1}, {"type": "short", "level": "NB", "q": "Nêu một chế phẩm vi sinh đã học trong chương V.", "answer": "Chế phẩm Bt", "explain": "Các chế phẩm: Bt, Trichoderma, Beauveria/Metarhizium, NPV (một đáp án đúng).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai nội dung trọng tâm nhất của chương V.", "answer": "Nhận diện, phòng trừ sâu bệnh hại theo IPM; ứng dụng công nghệ vi sinh trong phòng trừ", "explain": "Trọng tâm: sâu bệnh hại và IPM (bài 15–17); công nghệ vi sinh (bài 18) (nêu hai là đủ).", "points": 0.5}]}]}</script>
