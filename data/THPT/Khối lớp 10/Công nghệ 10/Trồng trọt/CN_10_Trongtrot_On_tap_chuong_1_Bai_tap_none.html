 tố là gì?", "options": ["A. Chọn địa điểm (đất, nước, khí hậu) – chọn giống – đầu tư kĩ thuật, con người", "B. Mua máy móc trước, không cần quan tâm đất", "C. Chọn giống bất kì, không cần khảo sát", "D. Chỉ cần vốn là đủ"], "answer": "A", "explain": "Phải khảo sát điều kiện tự nhiên trước, rồi chọn giống phù hợp, sau đó đầu tư kĩ thuật và nhân lực — phối hợp đồng bộ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đậu xanh là cây ngắn ngày.", "b) Phân bón cung cấp dinh dưỡng cho cây.", "c) Trồng trọt tạo việc làm cho nông dân.", "d) Cây dài ngày có vòng đời dưới 3 tháng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cây dài ngày có vòng đời nhiều năm.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về phát triển bền vững:", "statements": ["a) Nên kết hợp trồng trọt với chăn nuôi để tận dụng phụ phẩm.", "b) Hạn chế thuốc hóa học giúp bảo vệ môi trường.", "c) Tưới tiết kiệm giúp bảo vệ nguồn nước.", "d) Mở rộng diện tích bằng mọi giá, kể cả phá rừng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phá rừng gây hậu quả môi trường, vi phạm pháp luật.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 5 vai trò của trồng trọt đã học.", "answer": "Lương thực thực phẩm; nguyên liệu công nghiệp; thức ăn chăn nuôi; xuất khẩu, việc làm; bảo vệ môi trường", "explain": "5 vai trò: lương thực – thực phẩm; nguyên liệu công nghiệp; thức ăn chăn nuôi; xuất khẩu, việc làm, thu nhập; bảo vệ môi trường, cảnh quan.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích mối quan hệ giữa giống tốt và các yếu tố chăm sóc.", "answer": "Giống quyết định tiềm năng; chăm sóc tốt giúp phát huy tiềm năng thành năng suất thực tế", "explain": "Giống tốt chỉ là tiềm năng; cần đất, nước, phân, kĩ thuật đồng bộ mới đạt năng suất cao.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Sản phẩm nào sau đây vừa là lương thực vừa làm nguyên liệu chế biến công nghiệp?", "options": ["A. Sắn", "B. Cát", "C. Đá vôi", "D. Than đá"], "answer": "A", "explain": "Sắn là cây lương thực, đồng thời là nguyên liệu chế biến tinh bột, thức ăn chăn nuôi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây keo (trồng lấy gỗ, vòng đời nhiều năm) thuộc nhóm nào?", "options": ["A. Cây dài ngày", "B. Cây ngắn ngày", "C. Cây rau", "D. Cây lương thực"], "answer": "A", "explain": "Keo vòng đời nhiều năm — cây dài ngày (nhóm cây lâm nghiệp).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thiếu yếu tố nào sau đây, cây trồng không thể quang hợp?", "options": ["A. Ánh sáng", "B. Phân bón", "C. Thuốc trừ sâu", "D. Cỏ dại"], "answer": "A", "explain": "Ánh sáng cung cấp năng lượng cho quang hợp; thiếu sáng cây không tạo được chất hữu cơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm giống nhau giữa cây lương thực và cây thực phẩm (rau, quả) là gì?", "options": ["A. Đều trực tiếp phục vụ nhu cầu ăn uống của con người", "B. Đều là cây dài ngày", "C. Đều làm nguyên liệu công nghiệp", "D. Đều không cần chăm sóc"], "answer": "A", "explain": "Cả hai nhóm đều cung cấp thức ăn trực tiếp cho con người (lương thực chính và rau quả bổ sung vitamin).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nông nghiệp thông minh giúp giảm chi phí sản xuất?", "options": ["A. Vì tưới, bón chính xác theo nhu cầu, giảm lãng phí vật tư", "B. Vì không cần đầu tư ban đầu", "C. Vì không cần lao động", "D. Vì cây tự lớn không cần chăm"], "answer": "A", "explain": "Cảm biến, IoT giúp bón phân, tưới nước đúng lúc, đúng lượng — tiết kiệm vật tư, nhân công.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Huyện miền núi muốn chuyển đổi cơ cấu cây trồng. Căn cứ quan trọng nhất để chọn cây là gì?", "options": ["A. Điều kiện đất đai, khí hậu địa phương và nhu cầu thị trường", "B. Sở thích cá nhân của cán bộ", "C. Trồng theo phong trào", "D. Chọn cây đắt tiền nhất"], "answer": "A", "explain": "Chọn cây phải căn cứ điều kiện tự nhiên (đất, khí hậu) và đầu ra thị trường — nguyên tắc cơ bản.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Sắn vừa làm lương thực vừa làm nguyên liệu chế biến.", "b) Keo là cây dài ngày.", "c) Thiếu ánh sáng cây không quang hợp được.", "d) Nông nghiệp thông minh giúp tiết kiệm vật tư."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chọn cây trồng phải phù hợp điều kiện tự nhiên địa phương.", "b) Thị trường tiêu thụ là căn cứ quan trọng khi chọn cây trồng.", "c) Nên trồng cây theo phong trào mà không cần khảo sát.", "d) Cây dài ngày cần tính toán hiệu quả đầu tư dài hạn."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: trồng theo phong trào dễ thua lỗ, cần khảo sát kĩ.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu 4 triển vọng lớn của trồng trọt hiện nay.", "answer": "Công nghệ cao 4.0; giống mới; sản xuất hữu cơ bền vững; cơ giới hóa (chấp nhận: hội nhập thị trường)", "explain": "Triển vọng: nông nghiệp thông minh, giống mới chống chịu, hữu cơ bền vững, cơ giới hóa, thị trường quốc tế.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho ví dụ chứng minh các yếu tố trong trồng trọt tác động qua lại nhau.", "answer": "Thiếu nước thì bón phân kém hiệu quả; đất xấu giống tốt cũng khó đạt năng suất (chấp nhận ví dụ hợp lí)", "explain": "Ví dụ: ruộng thiếu nước, bón phân cũng không hiệu quả; hoặc giống tốt trên đất bạc màu vẫn thấp năng suất.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Ngành nào cung cấp bông cho công nghiệp dệt may?", "options": ["A. Trồng trọt", "B. Khai thác mỏ", "C. Đánh bắt hải sản", "D. Sản xuất thép"], "answer": "A", "explain": "Bông là cây công nghiệp của ngành trồng trọt, cung cấp sợi cho dệt may.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây hoa cúc (trồng 3–4 tháng cho thu hoạch) là cây gì?", "options": ["A. Cây ngắn ngày, nhóm hoa cây cảnh", "B. Cây dài ngày", "C. Cây lương thực", "D. Cây dược liệu"], "answer": "A", "explain": "Hoa cúc vòng đời vài tháng (ngắn ngày), trồng làm hoa cảnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bệnh hại cây trồng khác sâu hại ở điểm nào?", "options": ["A. Bệnh do nấm, vi khuẩn, vi rút; sâu do côn trùng gây ra", "B. Bệnh không gây hại", "C. Sâu do vi rút gây ra", "D. Không có điểm khác"], "answer": "A", "explain": "Bệnh hại do vi sinh vật (nấm, khuẩn, vi rút); sâu hại do động vật (côn trùng, nhện...).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phải bảo vệ thiên địch trong trồng trọt?", "options": ["A. Vì thiên địch tiêu diệt sâu hại, giúp giảm thuốc hóa học", "B. Vì thiên địch làm đẹp ruộng", "C. Vì thiên địch bón phân cho cây", "D. Vì thiên địch tưới nước"], "answer": "A", "explain": "Ong mắt đỏ, nhện, bọ rùa... ăn sâu hại — bảo vệ chúng là biện pháp sinh học giảm hóa chất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối liên hệ giữa trồng trọt với bảo vệ môi trường thể hiện ở đâu?", "options": ["A. Cây xanh điều hòa khí hậu, chống xói mòn, làm đẹp cảnh quan", "B. Trồng trọt thải nhiều khí độc", "C. Trồng trọt làm cạn kiệt ôzôn", "D. Không có liên hệ"], "answer": "A", "explain": "Cây xanh quang hợp, che phủ đất chống xói mòn, điều hòa tiểu khí hậu — vai trò môi trường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vùng chuyên trồng lúa muốn đa dạng hóa cây trồng. Giải pháp nào hợp lí nhất?", "options": ["A. Luân canh lúa – màu (ngô, đậu, rau) để cải tạo đất, tăng thu nhập", "B. Bỏ lúa trồng toàn bộ cây dài ngày ngay", "C. Tiếp tục độc canh lúa 20 năm", "D. Bỏ hoang đất"], "answer": "A", "explain": "Luân canh lúa – màu: cây họ đậu cải tạo đất, đa dạng sản phẩm, giảm rủi ro sâu bệnh, tăng thu nhập.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bông là cây công nghiệp cung cấp sợi dệt may.", "b) Hoa cúc là cây ngắn ngày.", "c) Bệnh hại do nấm, vi khuẩn, vi rút gây ra.", "d) Thiên địch giúp tiêu diệt sâu hại."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về đa dạng hóa cây trồng:", "statements": ["a) Luân canh lúa – màu giúp cải tạo đất.", "b) Đa dạng cây trồng giúp giảm rủi ro thị trường.", "c) Trồng xen cây họ đậu làm giàu đạm cho đất.", "d) Độc canh một loại cây là cách đa dạng hóa tốt nhất."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: độc canh đi ngược đa dạng hóa, gây bạc màu, sâu bệnh.", "points": 1}, {"type": "short", "level": "VDC", "q": "Phân biệt cây trồng với cây dại (2 điểm khác nhau).", "answer": "Cây trồng được gieo trồng, chăm sóc, chọn lọc; cây dại mọc tự nhiên (chấp nhận: năng suất, chất lượng theo nhu cầu)", "explain": "Cây trồng: con người chủ động gieo trồng, chăm sóc, chọn lọc qua nhiều thế hệ; cây dại mọc tự nhiên.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai cách phân loại cây trồng và tiêu chí mỗi cách.", "answer": "Theo mục đích sử dụng; theo thời gian sinh trưởng (dưới 1 năm / nhiều năm)", "explain": "Cách 1: theo mục đích sử dụng (lương thực, công nghiệp...). Cách 2: theo thời gian sinh trưởng (ngắn ngày/dài ngày).", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Cây cao su cho sản phẩm nào phục vụ công nghiệp?", "options": ["A. Mủ cao su", "B. Gạo", "C. Đường", "D. Dầu ăn"], "answer": "A", "explain": "Cây cao su cho mủ — nguyên liệu công nghiệp chế biến cao su (lốp xe, găng tay...).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây rau muống (thu hoạch sau 3–4 tuần) thuộc loại nào?", "options": ["A. Cây rau ngắn ngày", "B. Cây công nghiệp dài ngày", "C. Cây ăn quả lâu năm", "D. Cây dược liệu dài ngày"], "answer": "A", "explain": "Rau muống thu hoạch sau vài tuần — cây rau ngắn ngày.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Yếu tố nào giúp cây trồng đứng vững và bám rễ?", "options": ["A. Đất trồng", "B. Nước mưa", "C. Ánh sáng", "D. Gió"], "answer": "A", "explain": "Đất là giá thể giúp rễ bám, cây đứng vững, đồng thời cung cấp nước, dinh dưỡng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cây chè thích hợp trồng ở trung du, miền núi phía Bắc?", "options": ["A. Vì chè ưa khí hậu mát, đất đồi thoát nước tốt", "B. Vì chè ưa ngập úng", "C. Vì chè không cần đất", "D. Vì chè ưa nắng gắt quanh năm"], "answer": "A", "explain": "Chè ưa mát, đất đồi feralit thoát nước — phù hợp sinh thái nên cho năng suất, chất lượng cao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ưu điểm của trồng trọt hữu cơ so với trồng trọt thông thường là gì?", "options": ["A. An toàn thực phẩm, bảo vệ môi trường, giá bán cao hơn", "B. Năng suất luôn cao hơn", "C. Không cần chăm sóc", "D. Không cần đất"], "answer": "A", "explain": "Hữu cơ: không hóa chất nên an toàn, bảo vệ môi trường, sản phẩm được giá cao (dù năng suất có thể thấp hơn).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nông dân trồng cam bị bệnh vàng lá gân xanh (greening). Biện pháp căn cơ nhất là gì?", "options": ["A. Dùng cây giống sạch bệnh, phòng trừ rầy chổng cánh môi giới truyền bệnh", "B. Bón thật nhiều đạm", "C. Tưới thật nhiều nước", "D. Để cây tự khỏi"], "answer": "A", "explain": "Vàng lá gân xanh do vi khuẩn, lây qua rầy chổng cánh; biện pháp căn cơ: giống sạch bệnh + diệt môi giới + nhổ bỏ cây bệnh.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mủ cao su là nguyên liệu công nghiệp.", "b) Rau muống là cây rau ngắn ngày.", "c) Đất giúp cây đứng vững và cung cấp dinh dưỡng.", "d) Chè ưa khí hậu mát, đất đồi thoát nước."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về phòng bệnh vàng lá gân xanh trên cam:", "statements": ["a) Nên dùng cây giống sạch bệnh.", "b) Cần phòng trừ rầy chổng cánh môi giới truyền bệnh.", "c) Cây đã nhiễm nặng nên nhổ bỏ, tiêu hủy.", "d) Bón nhiều đạm sẽ chữa khỏi bệnh vi khuẩn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: quản lí tổng hợp bệnh greening. d) Sai: bón đạm không chữa được bệnh vi khuẩn.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên 6 nhóm cây trồng chính ở Việt Nam (theo Bài 1).", "answer": "Lương thực, công nghiệp, ăn quả, rau, hoa cây cảnh, dược liệu", "explain": "6 nhóm: cây lương thực, cây công nghiệp, cây ăn quả, cây rau, hoa và cây cảnh, cây dược liệu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai ưu điểm và một hạn chế của trồng trọt hữu cơ.", "answer": "Ưu: an toàn, bảo vệ môi trường; hạn chế: năng suất thấp hơn, chi phí cao (chấp nhận ý tương đương)", "explain": "Hữu cơ an toàn, thân thiện môi trường, giá cao; nhưng năng suất thường thấp hơn, chi phí chứng nhận, phòng trừ khó hơn.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Cây điều (đào lộn hột) mang lại giá trị kinh tế chủ yếu nào?", "options": ["A. Hạt điều xuất khẩu giá trị cao", "B. Lấy gỗ đóng tàu", "C. Làm rau ăn", "D. Làm thuốc nhuộm"], "answer": "A", "explain": "Điều là cây công nghiệp dài ngày, hạt điều là mặt hàng xuất khẩu giá trị cao của Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây bắp cải thuộc nhóm nào?", "options": ["A. Cây rau ngắn ngày", "B. Cây công nghiệp dài ngày", "C. Cây ăn quả", "D. Cây dược liệu"], "answer": "A", "explain": "Bắp cải là cây rau, vòng đời vài tháng — cây rau ngắn ngày.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiện tượng cây bị vàng lá, thối rễ khi ruộng ngập úng lâu ngày do nguyên nhân nào?", "options": ["A. Thừa nước, thiếu ôxi vùng rễ", "B. Thiếu ánh sáng", "C. Thiếu phân bón", "D. Do giống quá tốt"], "answer": "A", "explain": "Ngập úng làm đất thiếu ôxi, rễ thối, cây vàng héo — cần tiêu nước kịp thời.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cây họ đậu thường được trồng luân canh với lúa, ngô?", "options": ["A. Vì rễ có vi khuẩn cố định đạm, làm giàu đạm cho đất", "B. Vì họ đậu không cần nước", "C. Vì họ đậu diệt hết sâu bệnh", "D. Vì họ đậu cho năng suất cao nhất"], "answer": "A", "explain": "Vi khuẩn nốt sần ở rễ họ đậu cố định nitơ khí trời — luân canh giúp đất giàu đạm, giảm phân bón.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các yếu tố trồng trọt, yếu tố nào do con người chủ động điều khiển được nhiều nhất?", "options": ["A. Giống, phân bón, kĩ thuật canh tác", "B. Lượng mưa tự nhiên", "C. Nhiệt độ khí quyển", "D. Bão lũ"], "answer": "A", "explain": "Con người chủ động chọn giống, bón phân, áp dụng kĩ thuật; còn mưa, nhiệt, bão là tự nhiên khó điều khiển.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một hợp tác xã trồng bưởi da xanh muốn vào siêu thị. Điều kiện tiên quyết là gì?", "options": ["A. Đạt chuẩn VietGAP: an toàn, truy xuất nguồn gốc", "B. Quả càng to càng tốt", "C. Giá rẻ nhất thị trường", "D. Không cần bao bì"], "answer": "A", "explain": "Siêu thị yêu cầu chuẩn an toàn (VietGAP/GlobalGAP), truy xuất nguồn gốc — điều kiện tiên quyết vào kênh hiện đại.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hạt điều là mặt hàng xuất khẩu giá trị cao.", "b) Bắp cải là cây rau ngắn ngày.", "c) Ngập úng lâu ngày gây thối rễ, vàng lá.", "d) Cây họ đậu giúp làm giàu đạm cho đất."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tiêu chuẩn VietGAP:", "statements": ["a) Yêu cầu ghi chép nhật kí sản xuất.", "b) Yêu cầu đảm bảo thời gian cách ly thuốc.", "c) Yêu cầu truy xuất được nguồn gốc sản phẩm.", "d) VietGAP cấm hoàn toàn việc bón phân."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: VietGAP cho phép bón phân nhưng phải đúng loại, đúng liều, đúng cách.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai ví dụ về cây công nghiệp dài ngày và hai ví dụ về cây công nghiệp ngắn ngày.", "answer": "Dài ngày: cà phê, cao su; ngắn ngày: mía, bông (chấp nhận: hồ tiêu, điều / đậu tương, lạc)", "explain": "Dài ngày: cà phê, cao su, hồ tiêu, điều, chè. Ngắn ngày: mía, bông, đậu tương, lạc.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích vì sao luân canh cây họ đậu với lúa giúp giảm chi phí phân bón.", "answer": "Họ đậu cố định đạm khí trời làm giàu đất, vụ sau cần ít phân đạm hơn (chấp nhận ý tương đương)", "explain": "Đạm do vi khuẩn nốt sần cố định được trả lại đất khi cây tàn, giảm lượng phân đạm cần bón vụ sau.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Cây mía cung cấp nguyên liệu cho ngành công nghiệp nào?", "options": ["A. Công nghiệp đường", "B. Công nghiệp dệt", "C. Công nghiệp giấy", "D. Công nghiệp xi măng"], "answer": "A", "explain": "Mía là nguyên liệu chính của công nghiệp sản xuất đường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây nhãn (cho quả sau nhiều năm) thuộc loại nào?", "options": ["A. Cây ăn quả dài ngày", "B. Cây lương thực ngắn ngày", "C. Cây rau", "D. Cây công nghiệp ngắn ngày"], "answer": "A", "explain": "Nhãn cho quả ăn tươi, vòng đời nhiều năm — cây ăn quả dài ngày.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vai trò của làm đất trước khi gieo trồng là gì?", "options": ["A. Làm đất tơi xốp, diệt cỏ dại và mầm bệnh", "B. Làm đất cứng chắc", "C. Diệt vi sinh vật có ích", "D. Không có vai trò"], "answer": "A", "explain": "Cày bừa làm đất tơi xốp, thoáng khí, diệt cỏ, mầm bệnh, vùi phân — tạo điều kiện cây bén rễ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao không nên bón phân đạm quá liều cho rau ăn lá?", "options": ["A. Vì gây tồn dư nitrat, mất an toàn thực phẩm và ô nhiễm", "B. Vì rau sẽ chín nhanh", "C. Vì rau không cần đạm", "D. Vì đạm làm rau đắng"], "answer": "A", "explain": "Thừa đạm tồn dư nitrat trong rau gây hại sức khỏe, rửa trôi gây ô nhiễm nguồn nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh cây ngắn ngày và cây dài ngày, ưu điểm của cây ngắn ngày là gì?", "options": ["A. Thu hoạch nhanh, quay vòng vốn nhanh, dễ chuyển đổi cơ cấu", "B. Không cần chăm sóc", "C. Năng suất luôn cao hơn", "D. Không bị sâu bệnh"], "answer": "A", "explain": "Ngắn ngày: vài tháng thu hoạch, quay vòng vốn nhanh, linh hoạt chuyển đổi khi thị trường thay đổi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đồng bằng sông Cửu Long bị xâm nhập mặn. Giải pháp trồng trọt thích ứng nào đúng?", "options": ["A. Dùng giống lúa chịu mặn, trữ nước ngọt, chuyển đổi cơ cấu cây trồng phù hợp", "B. Tiếp tục trồng giống cũ không chịu mặn", "C. Bỏ hoang toàn bộ đồng ruộng", "D. Tưới nước mặn cho lúa"], "answer": "A", "explain": "Thích ứng mặn: giống chịu mặn + quản lí nước ngọt + chuyển đổi cây trồng phù hợp — giải pháp tổng hợp.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mía là nguyên liệu công nghiệp đường.", "b) Nhãn là cây ăn quả dài ngày.", "c) Làm đất giúp đất tơi xốp, diệt mầm bệnh.", "d) Bón thừa đạm gây tồn dư nitrat trong rau."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các giải pháp thích ứng xâm nhập mặn:", "statements": ["a) Sử dụng giống lúa chịu mặn.", "b) Trữ nước ngọt phục vụ tưới tiêu.", "c) Chuyển đổi sang cây trồng, vật nuôi phù hợp vùng mặn.", "d) Tiếp tục canh tác như cũ, không thay đổi gì."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: thích ứng tổng hợp. d) Sai: không thích ứng sẽ mất mùa.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai biện pháp kĩ thuật giúp cây trồng chống chịu hạn hán.", "answer": "Tưới tiết kiệm (nhỏ giọt); che phủ đất giữ ẩm (chấp nhận: giống chịu hạn, bón phân cân đối)", "explain": "Tưới nhỏ giọt tiết kiệm nước; phủ rơm rạ giữ ẩm; giống chịu hạn; bón cân đối tăng sức chống chịu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao cây ngắn ngày giúp nông dân linh hoạt hơn trước biến động thị trường?", "answer": "Thu hoạch nhanh, dễ chuyển đổi cây trồng theo giá cả (chấp nhận ý tương đương)", "explain": "Vòng đời vài tháng nên nông dân nhanh chóng chuyển sang cây khác khi giá giảm, giảm rủi ro.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Cây chè cho sản phẩm nào?", "options": ["A. Búp chè làm nguyên liệu chế biến chè uống", "B. Gạo", "C. Đường", "D. Dầu ăn"], "answer": "A", "explain": "Chè là cây công nghiệp dài ngày, búp chè chế biến thành chè uống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây cà chua (thu hoạch sau 2–3 tháng) là cây gì?", "options": ["A. Cây rau (thực phẩm) ngắn ngày", "B. Cây công nghiệp dài ngày", "C. Cây ăn quả lâu năm", "D. Cây dược liệu"], "answer": "A", "explain": "Cà chua thu hoạch sau vài tháng, dùng làm rau quả — cây thực phẩm ngắn ngày.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cỏ dại có hại cho cây trồng chủ yếu vì lí do nào?", "options": ["A. Cạnh tranh nước, dinh dưỡng, ánh sáng với cây trồng", "B. Làm đất tơi xốp", "C. Bón phân cho cây", "D. Thu hút ong bướm"], "answer": "A", "explain": "Cỏ dại tranh nguồn sống với cây trồng và là nơi trú ngụ sâu bệnh — cần làm cỏ kịp thời.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao trồng cây theo đường đồng mức trên đất dốc?", "options": ["A. Để hạn chế xói mòn, giữ đất và nước", "B. Để cây đẹp hơn", "C. Để tốn nhiều công", "D. Không có tác dụng"], "answer": "A", "explain": "Trồng theo đường đồng mức (ngang dốc) làm chậm dòng chảy, giữ đất, giữ nước, chống xói mòn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa năng suất cây trồng và chất lượng nông sản là gì?", "options": ["A. Cần đạt cả hai: năng suất cao và chất lượng tốt mới hiệu quả bền vững", "B. Chỉ cần năng suất, không cần chất lượng", "C. Chỉ cần chất lượng, năng suất không quan trọng", "D. Hai yếu tố đối lập, không thể cùng đạt"], "answer": "A", "explain": "Sản xuất hiện đại hướng tới cả năng suất và chất lượng (an toàn, ngon) mới có giá trị kinh tế bền vững.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một trang trại muốn giảm 50% thuốc trừ sâu mà vẫn giữ năng suất. Hướng đi đúng là gì?", "options": ["A. Áp dụng IPM: giống chống chịu, thiên địch, bẫy bả, nhà lưới", "B. Ngừng phun thuốc đột ngột, không làm gì thêm", "C. Tăng liều thuốc để phun ít lần", "D. Đổi sang thuốc cấm mạnh hơn"], "answer": "A", "explain": "IPM tổng hợp nhiều biện pháp thay thế thuốc hóa học — giảm thuốc mà vẫn kiểm soát được sâu bệnh.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chè là cây công nghiệp dài ngày.", "b) Cà chua là cây thực phẩm ngắn ngày.", "c) Cỏ dại cạnh tranh dinh dưỡng với cây trồng.", "d) Trồng theo đường đồng mức giúp chống xói mòn."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về giảm thuốc trừ sâu:", "statements": ["a) Dùng giống chống chịu giúp giảm số lần phun thuốc.", "b) Nhà lưới giúp hạn chế sâu bệnh, giảm thuốc.", "c) Bảo vệ thiên địch góp phần kiểm soát sâu hại.", "d) Muốn giảm thuốc thì phải chấp nhận mất trắng mùa màng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: IPM giảm thuốc mà vẫn bảo vệ năng suất.", "points": 1}, {"type": "short", "level": "VDC", "q": "Kể tên 4 công nghệ của cách mạng 4.0 ứng dụng trong trồng trọt.", "answer": "IoT, AI, drone, big data (chấp nhận: nhà kính thông minh, robot, cảm biến)", "explain": "IoT (cảm biến), AI, dữ liệu lớn, drone, nhà kính thông minh, robot nông nghiệp.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai lợi ích của trồng cây theo đường đồng mức trên đất dốc.", "answer": "Chống xói mòn; giữ nước, giữ đất màu (chấp nhận ý tương đương)", "explain": "Đường đồng mức làm chậm dòng chảy mặt, hạn chế rửa trôi đất, giữ ẩm cho cây.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Cây hồ tiêu cho sản phẩm nào?", "options": ["A. Hạt tiêu làm gia vị", "B. Gạo", "C. Đường", "D. Sợi dệt"], "answer": "A", "explain": "Hồ tiêu là cây công nghiệp dài ngày, hạt tiêu là gia vị và mặt hàng xuất khẩu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây đậu tương (3–4 tháng) thuộc nhóm nào?", "options": ["A. Cây công nghiệp ngắn ngày", "B. Cây ăn quả dài ngày", "C. Cây dược liệu lâu năm", "D. Cây cảnh quan"], "answer": "A", "explain": "Đậu tương vòng đời vài tháng, lấy hạt làm dầu, đạm — cây công nghiệp ngắn ngày.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhiệt độ quá thấp (rét đậm) gây hại gì cho lúa?", "options": ["A. Lúa chết rét, sinh trưởng ngừng trệ", "B. Lúa chín nhanh", "C. Lúa đẻ nhánh mạnh", "D. Không ảnh hưởng"], "answer": "A", "explain": "Lúa ưa nóng; rét đậm làm mạ chết, lúa ngừng sinh trưởng — cần che phủ, bón tro giữ ấm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cần chọn thời vụ gieo trồng phù hợp?", "options": ["A. Vì mỗi cây cần điều kiện nhiệt, ẩm, sáng nhất định theo giai đoạn sinh trưởng", "B. Vì gieo lúc nào cũng như nhau", "C. Vì thời vụ không ảnh hưởng", "D. Vì chỉ để cho vui"], "answer": "A", "explain": "Đúng thời vụ = cây gặp điều kiện thuận lợi nhất, tránh rét, hạn, lũ — quyết định năng suất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ưu điểm của mô hình VAC (vườn – ao – chuồng) là gì?", "options": ["A. Tận dụng phụ phẩm khép kín, tăng thu nhập, bảo vệ môi trường", "B. Chỉ trồng được một loại cây", "C. Tốn nhiều diện tích vô ích", "D. Không có ưu điểm"], "answer": "A", "explain": "VAC: vườn cho thức ăn, phân chuồng bón vườn, ao tận dụng chất thải — kinh tế sinh thái hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vùng rét đậm miền Bắc, để bảo vệ mạ non cần làm gì?", "options": ["A. Che phủ nilon, bón tro bếp giữ ấm, không gieo khi rét đậm", "B. Tưới nước lạnh vào mạ", "C. Bón nhiều đạm cho mạ tốt lốp", "D. Để mạ ngoài trời không che"], "answer": "A", "explain": "Che nilon giữ ấm, tro bếp giữ nhiệt, tránh gieo đúng đợt rét — biện pháp chống rét cho mạ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hạt tiêu là gia vị và mặt hàng xuất khẩu.", "b) Đậu tương là cây công nghiệp ngắn ngày.", "c) Rét đậm làm lúa chết rét, ngừng sinh trưởng.", "d) Gieo đúng thời vụ giúp cây gặp điều kiện thuận lợi."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các biện pháp chống rét cho mạ:", "statements": ["a) Che phủ nilon giữ ấm cho mạ.", "b) Bón tro bếp giúp giữ nhiệt cho mặt ruộng.", "c) Không gieo mạ khi dự báo rét đậm.", "d) Tưới nước lạnh vào lúc rét nhất để mạ khỏe."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tưới nước lạnh lúc rét làm mạ sốc nhiệt, chết rét.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu hai yếu tố tự nhiên và hai yếu tố kĩ thuật trong trồng trọt.", "answer": "Tự nhiên: đất, nước (khí hậu); kĩ thuật: giống, phân bón (chấp nhận các cặp đúng)", "explain": "Tự nhiên: đất, nước, khí hậu. Kĩ thuật – con người: giống, phân bón, kĩ thuật canh tác.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vì sao thời vụ gieo trồng ảnh hưởng lớn đến năng suất?", "answer": "Mỗi cây cần nhiệt, ẩm, sáng phù hợp từng giai đoạn; sai thời vụ gặp rét, hạn, lũ, sâu bệnh (chấp nhận ý tương đương)", "explain": "Đúng thời vụ giúp cây sinh trưởng trong điều kiện tối ưu, tránh thiên tai, sâu bệnh cao điểm.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Cây atisô ở Đà Lạt thuộc nhóm nào?", "options": ["A. Cây dược liệu", "B. Cây lương thực", "C. Cây công nghiệp", "D. Cây rau"], "answer": "A", "explain": "Atisô là cây dược liệu nổi tiếng Đà Lạt, dùng làm trà, thuốc bổ gan.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây lạc (4–5 tháng) là cây gì?", "options": ["A. Cây công nghiệp ngắn ngày", "B. Cây ăn quả dài ngày", "C. Cây dược liệu lâu năm", "D. Cây lấy gỗ"], "answer": "A", "explain": "Lạc vòng đời vài tháng, lấy hạt ép dầu — cây công nghiệp ngắn ngày.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thiên địch nào sau đây có ích cho ruộng lúa?", "options": ["A. Nhện, ong mắt đỏ, ếch nhái", "B. Rầy nâu", "C. Sâu cuốn lá", "D. Chuột đồng"], "answer": "A", "explain": "Nhện bắt rầy, ong mắt đỏ kí sinh trứng sâu, ếch ăn côn trùng — đều là thiên địch có ích.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao trồng trọt được coi là ngành sản xuất đặc biệt?", "options": ["A. Vì đối tượng là sinh vật sống, chịu ảnh hưởng lớn của điều kiện tự nhiên", "B. Vì không cần vốn", "C. Vì không cần lao động", "D. Vì sản xuất trong nhà máy"], "answer": "A", "explain": "Cây trồng là sinh vật sống, mang tính thời vụ, phụ thuộc đất, nước, khí hậu — khác sản xuất công nghiệp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để phát triển trồng trọt bền vững, cần kết hợp yếu tố nào?", "options": ["A. Hiệu quả kinh tế với bảo vệ môi trường và an sinh xã hội", "B. Chỉ chạy theo lợi nhuận", "C. Chỉ bảo vệ môi trường, bỏ kinh tế", "D. Khai thác cạn kiệt tài nguyên"], "answer": "A", "explain": "Bền vững = 3 trụ cột: kinh tế – môi trường – xã hội hài hòa, không đánh đổi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một doanh nghiệp muốn trồng sâm Ngọc Linh (cây dược liệu quý). Thách thức lớn nhất là gì?", "options": ["A. Yêu cầu sinh thái đặc biệt (núi cao, mát, ẩm) và thời gian dài mới thu hoạch", "B. Sâm không cần chăm sóc", "C. Sâm trồng ở đâu cũng được", "D. Sâm cho thu hoạch sau 1 tháng"], "answer": "A", "explain": "Sâm Ngọc Linh đòi hỏi độ cao, khí hậu đặc thù và 5–7 năm mới thu hoạch — đầu tư dài hạn, kĩ thuật cao.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Atisô là cây dược liệu của Đà Lạt.", "b) Lạc là cây công nghiệp ngắn ngày.", "c) Nhện, ong mắt đỏ là thiên địch có ích.", "d) Trồng trọt bền vững cần hài hòa kinh tế – môi trường – xã hội."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các nhận định về trồng sâm Ngọc Linh:", "statements": ["a) Sâm cần điều kiện núi cao, khí hậu mát ẩm đặc thù.", "b) Trồng sâm cần thời gian nhiều năm mới thu hoạch.", "c) Sâm là cây dược liệu có giá trị kinh tế cao.", "d) Có thể trồng sâm đại trà ở đồng bằng nóng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: sâm không thích nghi đồng bằng nóng thấp.", "points": 1}, {"type": "short", "level": "VDC", "q": "Nêu ba đặc điểm khiến trồng trọt khác với sản xuất công nghiệp.", "answer": "Đối tượng sống; tính thời vụ; phụ thuộc tự nhiên (chấp nhận: cần đất đai, chu kì dài)", "explain": "Trồng trọt: đối tượng là sinh vật sống, mang tính thời vụ, phụ thuộc nhiều vào đất, nước, khí hậu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giải thích khái niệm trồng trọt bền vững bằng 3 trụ cột.", "answer": "Kinh tế hiệu quả; môi trường được bảo vệ; xã hội (việc làm, an toàn thực phẩm) (chấp nhận ý tương đương)", "explain": "Bền vững: hiệu quả kinh tế + bảo vệ môi trường + đảm bảo an sinh xã hội, an toàn thực phẩm.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Cây thanh long thuộc nhóm nào?", "options": ["A. Cây ăn quả", "B. Cây lương thực", "C. Cây công nghiệp", "D. Cây dược liệu"], "answer": "A", "explain": "Thanh long cho quả tươi ăn trực tiếp, giàu vitamin — cây ăn quả.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây ngô (3–4 tháng) vừa là cây lương thực vừa thuộc loại nào?", "options": ["A. Cây ngắn ngày", "B. Cây dài ngày", "C. Cây lâu năm", "D. Cây thủy sinh"], "answer": "A", "explain": "Ngô vòng đời 3–4 tháng — cây ngắn ngày (đồng thời là lương thực và thức ăn chăn nuôi).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bón vôi cho đất chua có tác dụng gì?", "options": ["A. Khử chua, cải tạo đất", "B. Làm đất chua hơn", "C. Diệt cây trồng", "D. Không tác dụng"], "answer": "A", "explain": "Vôi trung hòa axit, khử chua, khử phèn, cung cấp canxi cho đất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao cùng là cây ăn quả nhưng sầu riêng cần nhiều năm mới cho thu hoạch còn thanh long chỉ cần hơn 1 năm?", "options": ["A. Vì đặc tính sinh trưởng mỗi loài khác nhau (thời gian kiến thiết khác nhau)", "B. Vì sầu riêng không cần chăm sóc", "C. Vì thanh long là cây dại", "D. Vì sầu riêng trồng sai kĩ thuật"], "answer": "A", "explain": "Mỗi loài có đặc tính sinh học riêng: sầu riêng kiến thiết 4–5 năm, thanh long 1–1,5 năm — đều là cây dài ngày.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong 8 yếu tố trồng trọt, nhóm yếu tố nào con người khó điều khiển nhất?", "options": ["A. Khí hậu, thời tiết (mưa, bão, rét)", "B. Giống cây trồng", "C. Phân bón", "D. Kĩ thuật canh tác"], "answer": "A", "explain": "Mưa, bão, rét là tự nhiên khó điều khiển; con người chỉ thích ứng (giống chống chịu, nhà màng...).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trước dự báo bão lớn, nông dân trồng lúa sắp thu hoạch nên làm gì?", "options": ["A. Thu hoạch sớm (chạy bão), khơi thông mương tiêu nước", "B. Bón thêm phân đạm", "C. Phun thuốc trừ sâu", "D. Không làm gì"], "answer": "A", "explain": "Chạy bão: thu hoạch sớm lúa chín, tiêu nước chống úng — giảm thiệt hại thiên tai.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thanh long là cây ăn quả.", "b) Ngô là cây ngắn ngày.", "c) Bón vôi giúp khử chua đất.", "d) Khí hậu là yếu tố con người khó điều khiển nhất."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các biện pháp ứng phó bão cho lúa:", "statements": ["a) Thu hoạch sớm lúa đã chín để chạy bão.", "b) Khơi thông mương máng tiêu nước.", "c) Bón thúc đạm ngay trước bão để lúa cứng cây.", "d) Sau bão cần thăm đồng, xử lí úng và sâu bệnh."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: bón đạm trước bão làm lúa tốt lốp, dễ đổ ngã.", "points": 1}, {"type": "short", "level": "VDC", "q": "Tóm tắt 8 yếu tố chính trong trồng trọt bằng một câu liệt kê.", "answer": "Giống, đất, nước, phân bón, khí hậu, sâu bệnh, kĩ thuật, con người", "explain": "8 yếu tố: giống – đất – nước – phân bón – khí hậu – sâu, bệnh hại – kĩ thuật canh tác – con người.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nêu hai việc nông dân cần làm khi có dự báo thiên tai (bão, lũ).", "answer": "Thu hoạch sớm; tiêu nước, chằng chống (chấp nhận: gia cố nhà lưới, di dời vật tư)", "explain": "Chủ động: thu hoạch sớm, tiêu nước chống úng, chằng chống cây, bảo vệ công trình.", "points": 0.5}]}]}
