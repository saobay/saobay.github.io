{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'o' is pronounced differently from the others.","options":["A. explore","B. local","C. responsible","D. ecology"],"answer":"B","explain":"Trong explore, chữ o đọc là /ɔː/; trong responsible, ecology, chữ o đọc là /ɒ/; trong local, chữ o đọc là /əʊ/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. conser'vation","B. desti'nation","C. degra'dation","D. 'ecotourism"],"answer":"D","explain":"conservation, destination, degradation nhấn âm 3 (trước -tion); ecotourism nhấn âm 1.","points":0.25},{"type":"mcq","level":"NB","q":"___ is travel to natural places without harming nature.","options":["A. Ecotourism","B. Homework","C. Housework","D. Teamwork"],"answer":"A","explain":"ecotourism (du lịch sinh thái): du lịch đến nơi tự nhiên mà không gây hại.","points":0.25},{"type":"mcq","level":"TH","q":"If the weather ___ fine tomorrow, we will go camping.","options":["A. is","B. will be","C. would be","D. has been"],"answer":"A","explain":"Câu điều kiện loại 1: If + hiện tại đơn, will + V; mệnh đề if không dùng will.","points":0.25},{"type":"mcq","level":"VD","q":"If I ___ you, I would apply for that job.","options":["A. am","B. were","C. will be","D. have been"],"answer":"B","explain":"Câu điều kiện loại 2 với be: dùng were cho mọi ngôi → If I were you.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"What should I take on an eco-tour?\" B: \"___\"","options":["A. You should take reusable bottles.","B. Take a lot of plastic.","C. I don't know.","D. Bye."],"answer":"A","explain":"Lời khuyên du lịch sinh thái: mang chai dùng lại được (reusable bottles).","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["ecotourism","du lịch sinh thái"],["conservation","bảo tồn"],["destination","điểm đến"],["trail","đường mòn"],["explore","khám phá"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["If","it","rains","we","will","stay","home"],"explain":"Câu đúng: If it rains we will stay home. (Nếu trời mưa chúng ta sẽ ở nhà.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: What is ecotourism, Dad? B: It's travel to natural places without harming nature. A: What do ecotourists do? B: They walk on forest trails and watch wild animals. A: Is it good? B: Yes, it helps local people earn money.","sub_questions":[{"q":"What is ecotourism?","options":["Travel to natural places without harming nature","Travel to big cities","Travel by plane"],"answer":0},{"q":"What do ecotourists do?","options":["Walk on forest trails and watch wild animals","Hunt animals","Pick flowers"],"answer":0},{"q":"Is ecotourism good?","options":["Yes, it helps local people earn money","No","Not sure"],"answer":0}],"explain":"Nghe kỹ: du lịch sinh thái là du lịch tự nhiên không gây hại; du khách đi đường mòn, ngắm động vật; giúp người dân địa phương kiếm tiền.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Ecotourism is different from mass tourism. Ecotourists visit natural places in small groups. They do not damage nature or harm animals. Local people earn money by guiding tours and selling handicrafts.","statements":["a) Ecotourism is different from mass tourism.","b) Ecotourists travel in small groups.","c) Ecotourists harm animals.","d) Local people earn money from ecotourism."],"answer":["T","T","F","T"],"explain":"a) Đúng: is different from mass tourism. b) Đúng: in small groups. c) Sai: không gây hại động vật. d) Đúng: guiding tours and selling handicrafts.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Ha Long Bay is one of the most famous ecotourism destinations in Viet Nam. Tourists can explore caves and sail on the bay. However, too many visitors can harm the water. The government limits the number of boats to protect the bay.","statements":["a) Ha Long Bay is a famous ecotourism destination.","b) Tourists can explore caves there.","c) Too many visitors never cause problems.","d) The government limits boats to protect the bay."],"answer":["T","T","F","T"],"explain":"a) Đúng: one of the most famous destinations. b) Đúng: explore caves and sail. c) Sai: quá đông du khách gây hại nguồn nước. d) Đúng: limits the number of boats.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Ecotourism protects nature and local culture","explain":"Đọc to, rõ ràng, chú ý: ECOtourism, PROtects.","points":1}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'a' is pronounced differently from the others.","options":["A. trail","B. sustainable","C. natural","D. lake"],"answer":"C","explain":"Trong trail, sustainable, lake, chữ a đọc là /eɪ/; trong natural, chữ a đọc là /æ/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. eco'nomic","B. tra'ditional","C. under'standing","D. 'ecotourism"],"answer":"D","explain":"economic, traditional, understanding nhấn âm 2 hoặc 3; ecotourism nhấn âm 1.","points":0.25},{"type":"mcq","level":"NB","q":"We should buy ___ products to protect the environment.","options":["A. eco-friendly","B. expensive","C. cheap","D. old"],"answer":"A","explain":"eco-friendly (thân thiện môi trường): nên mua sản phẩm thân thiện môi trường.","points":0.25},{"type":"mcq","level":"TH","q":"If you ___ hard, you will pass the exam.","options":["A. will study","B. study","C. studied","D. would study"],"answer":"B","explain":"Câu điều kiện loại 1: If + hiện tại đơn (study), will + V.","points":0.25},{"type":"mcq","level":"VD","q":"If tourists bought local products, more of their money ___ in the community.","options":["A. would stay","B. will stay","C. stays","D. stayed"],"answer":"A","explain":"Câu điều kiện loại 2: If + quá khứ đơn (bought), would + V → would stay.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"If I were you, I'd visit Ha Long Bay.\" B: \"___\"","options":["A. Thanks for your advice.","B. No way.","C. I hate it.","D. Goodbye."],"answer":"A","explain":"Cảm ơn lời khuyên: Thanks for your advice.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["eco-friendly","thân thiện môi trường"],["impact","tác động"],["local","địa phương"],["aware","nhận thức"],["preserve","giữ gìn"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["If","I","were","you","I","would","go"],"explain":"Câu đúng: If I were you I would go. (Nếu tôi là bạn, tôi sẽ đi.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Lan, what did you do on your eco-tour? B: I walked on a forest trail and watched birds. A: Did you enjoy it? B: Very much. Our guide taught us about local plants.","sub_questions":[{"q":"What did Lan do?","options":["Walked on a forest trail and watched birds","Swam in the sea","Climbed a mountain"],"answer":0},{"q":"Did she enjoy it?","options":["Very much","A little","No"],"answer":0},{"q":"What did the guide teach?","options":["About local plants","About history","About cooking"],"answer":0}],"explain":"Nghe kỹ: Lan đi đường mòn trong rừng, ngắm chim; rất thích; hướng dẫn viên dạy về cây địa phương.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Responsible tourists do not litter. They take their rubbish home or put it in bins. They also respect local people and their culture. Small good actions protect beautiful destinations.","statements":["a) Responsible tourist onservation","B. Pollution","C. Destruction","D. Construction"],"answer":"A","explain":"conservation (sự bảo tồn): giữ thiên nhiên an toàn.","points":0.25},{"type":"mcq","level":"TH","q":"We will go camping tomorrow if the weather ___ fine.","options":["A. will be","B. is","C. would be","D. were"],"answer":"B","explain":"Câu điều kiện loại 1: mệnh đề if dùng hiện tại đơn (is), không dùng will.","points":0.25},{"type":"mcq","level":"VD","q":"If my parents were 10 years younger, they ___ around the world.","options":["A. would travel","B. will travel","C. travel","D. travelled"],"answer":"A","explain":"Câu điều kiện loại 2: If + quá khứ đơn (were), would + V → would travel.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Should we feed wild animals?\" B: \"___\"","options":["A. No, it harms them.","B. Yes, a lot.","C. I like it.","D. Maybe."],"answer":"A","explain":"Không nên cho động vật hoang dã ăn vì hại chúng: No, it harms them.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["exotic","kỳ lạ"],["mass tourism","du lịch đại chúng"],["sustainable","bền vững"],["degrade","làm suy thoái"],["profit","lợi nhuận"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Ecotourism","protects","nature","and","culture"],"explain":"Câu đúng: Ecotourism protects nature and culture. (Du lịch sinh thái bảo vệ thiên nhiên và văn hóa.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Minh, why shouldn't we feed wild monkeys? B: Because human food harms them. A: What should we do instead? B: Just watch them from far away. A: Can we take photos? B: Yes, but don't use flash.","sub_questions":[{"q":"Why not feed monkeys?","options":["Human food harms them","They are dangerous","They don't eat"],"answer":0},{"q":"What should we do?","options":["Watch them from far away","Touch them","Take them home"],"answe g help, get, destination, chữ e đọc là /e/; trong preserve, chữ e đọc là /ɪ/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. under'standing","B. tra'ditional","C. eco'nomic","D. 'handicraft"],"answer":"D","explain":"understanding, traditional, economic nhấn âm 2 hoặc 3; handicraft nhấn âm 1.","points":0.25},{"type":"mcq","level":"NB","q":"Ha Long Bay is a famous tourist ___.","options":["A. destination","B. station","C. hospital","D. factory"],"answer":"A","explain":"destination (điểm đến): Vịnh Hạ Long là điểm đến du lịch nổi tiếng.","points":0.25},{"type":"mcq","level":"TH","q":"If tourists ___ local products, more money will stay in the community.","options":["A. will buy","B. buy","C. bought","D. would buy"],"answer":"B","explain":"Câu điều kiện loại 1: If + hiện tại đơn (buy), will + V.","points":0.25},{"type":"mcq","level":"VD","q":"If I had more free time, I ___ to play one musical instrument.","options":["A. would learn","B. will learn","C. learn","D. learnt"],"answer":"A","explain":"Câu điều kiện loại 2: If + quá khứ đơn (had), would + V → would learn.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"What's the best time to visit the forest?\" B: \"___\"","options":["A. In the dry season.","B. At midnight.","C. I don't care.","D. Never."],"answer":"A","explain":"Thời điểm tốt để thăm rừng: mùa khô (the dry season).","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["handicraft","đồ thủ công"],["ecology","sinh thái học"],["responsible","có trách nhiệm"],["culture","văn hóa"],["natural resources","tài nguyên thiên nhiên"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Tourists","should","respect","local","people"],"explain":"Câu đúng: Tourists should respect local people. (Du khách nên tôn trọng người dân địa phương.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: What should we take on our eco-tour, Mum? B: Reusable bottles and cloth bags. A: Why not plastic bottles? B: Because plastic harms nature. A: What else? B: Don't forget your hat!","sub_questions":[{"q":"What should they take?","options":["Reusable bottles and cloth bags","Plastic bottles","Nothing"],"answer":0},{"q":"Why not plastic?","options":["Plastic harms nature","Plastic is cheap","Plastic is light"],"answer":0},{"q":"What else?","options":["Don't forget your hat","Bring toys","Bring food"],"answer":0}],"explain":"Nghe kỹ: mang chai dùng lại được và túi vải; nhựa hại thiên nhiên; đừng quên mũ.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Sapa is a beautiful destination in northern Viet Nam. Tourists can walk on mountain trails and see terraced fields. Local people sell colourful handicrafts. Ecotourism helps them earn money without harming nature.","statements":["a) Sapa is in northern Viet Nam.","b) Tourists can walk on mountain trails.","c) Local people sell handicrafts.","d) Ecotourism harms nature in Sapa."],"answer":["T","T","T","F"],"explain":"a) Đúng: in northern Viet Nam. b) Đúng: walk on mountain trails. c) Đúng: sell colourful handicrafts. d) Sai: du lịch sinh thái không gây hại thiên nhiên.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). When tourists respect nature, everyone benefits. Animals keep their homes, forests stay green, and local people earn money. But when tourists litter and damage coral, nature suffers. Responsible travel protects destinations for future visitors.","statements":["a) Respecting nature benefits everyone.","b) Local people earn money from tourism.","c) Littering harms nature.","d) Future visitors don't need beautiful nature."],"answer":["T","T","T","F"],"explain":"a) Đúng: everyone benefits. b) Đúng: earn money. c) Đúng: nature suffers. d) Sai: cần giữ điểm đến cho du khách tương lai.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Responsible tourists do not litter","explain":"Đọc to, rõ ràng, chú ý: reSPONsible, LITter.","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'u' is pronounced differently from the others.","options":["A. culture","B. just","C. much","D. sustainable"],"answer":"D","explain":"Trong culture, just, much, chữ u đọc là /ʌ/; trong sustainable, chữ u đọc là /ə/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. 'ecotourism","B. conser'vation","C. desti'nation","D. degra'dation"],"answer":"A","explain":"ecotourism nhấn âm 1; conservation, destination, degradation nhấn âm 3 (trước -tion).","points":0.25},{"type":"mcq","level":"NB","q":"Tourists can walk along the ___ in the forest.","options":["A. trail","B. train","C. plane","D. ship"],"answer":"A","explain":"trail (đường mòn): du khách đi bộ trên đường mòn trong rừng.","points":0.25},{"type":"mcq","level":"TH","q":"If you ___ the tour, you will see beautiful nature.","options":["A. will join","B. join","C. joined","D. would join"],"answer":"B","explain":"Câu điều kiện loại 1: If + hiện tại đơn (join), will + V.","points":0.25},{"type":"mcq","level":"VD","q":"If we ___ a yacht, we would sail the seven seas.","options":["A. had","B. have","C. will have","D. would have"],"answer":"A","explain":"Câu điều kiện loại 2: If + quá khứ đơn (had), would + V.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Can we swim here?\" B: \"___\"","options":["A. Yes, but don't litter.","B. No, never.","C. I don't swim.","D. Bye."],"answer":"A","explain":"Được bơi nhưng đừng xả rác: Yes, but don't litter.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["ecotourism","du lịch sinh thái"],["trail","đường mòn"],["local","địa phương"],["preserve","giữ gìn"],["impact","tác động"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["We","will","travel","if","the","weather","is","fine"],"explain":"Câu đúng: We will travel if the weather is fine. (Chúng ta sẽ đi du lịch nếu thời tiết đẹp.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Dad, what is mass tourism? B: It's when too many tourists visit one place at once. A: Is it bad? B: Yes. It makes beaches dirty and harms nature.","sub_questions":[{"q":"What is mass tourism?","options":["Too many tourists visit one place at once","Few tourists visit","Nobody visits"],"answer":0},{"q":"Is it bad?","options":["Yes","No","Sometimes"],"answer":0},{"q":"Why?","options":["It makes beaches dirty and harms nature","It is expensive","It is boring"],"answer":0}],"explain":"Nghe kỹ: du lịch đại chúng là quá đông du khách cùng lúc; có hại; làm bẩn bãi biển, hại thiên nhiên.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Cuc Phuong is the oldest national park in Viet Nam. Visitors can see rare animals and thousand-year-old trees. Tourists must follow the trails and not feed animals. The park teaches everyone to love nature.","statements":["a) Cuc Phuong is the oldest national park.","b) Visitors can see rare animals.","c) Tourists can feed animals.","d) The park teaches love of nature."],"answer":["T","T","F","T"],"explain":"a) Đúng: the oldest national park in Viet Nam. b) Đúng: see rare animals. c) Sai: không cho động vật ăn (not feed animals). d) Đúng: teaches everyone to love nature.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Buying local products helps local people. When tourists buy handicrafts, money stays in the village. Farmers also sell food to restaurants. If tourists buy imported goods, local people earn less.","statements":["a) Buying local products helps local people.","b) Money stays in the village.","c) Tourists should buy imported goods.","d) Local people earn less from imported goods."],"answer":["T","T","F","T"],"explain":"a) Đúng: helps local people. b) Đúng: money stays in the village. c) Sai: nên mua hàng địa phương. d) Đúng: earn less.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Buying local products helps local people","explain":"Đọc to, rõ ràng, chú ý: BUYing, LOcal.","points":1}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letters 'ea' are pronounced differently from the others.","options":["A. beach","B. clean","C. leave","D. weather"],"answer":"D","explain":"Trong beach, clean, leave, ea đọc là /iː/; trong weather, ea đọc là /e/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. Vietna'mese","B. Japa'nese","C. engi'neer","D. 'ecotourism"],"answer":"D","explain":"Vietnamese, Japanese, engineer nhấn âm cuối; ecotourism nhấn âm 1.","points":0.25},{"type":"mcq","level":"NB","q":"Mass tourism has a bad ___ on the environment.","options":["A. impact","B. music","C. film","D. game"],"answer":"A","explain":"impact (tác động): du lịch đại chúng tác động xấu đến môi trường.","points":0.25},{"type":"mcq","level":"TH","q":"She will be tired if she ___ late.","options":["A. will work","B. works","C. worked","D. would work"],"answer":"B","explain":"Câu điều kiện loại 1: If + hiện tại đơn (works), will + V.","points":0.25},{"type":"mcq","level":"VD","q":"If I were a bird, I ___ fly everywhere.","options":["A. would","B. will","C. can","D. shall"],"answer":"A","explain":"Câu điều kiện loại 2: If + quá khứ đơn (were), would + V.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Should I buy souvenirs from local people?\" B: \"___\"","options":["A. Yes, it helps them earn money.","B. No, never.","C. I don't like shopping.","D. Maybe not."],"answer":"A","explain":"Nên mua quà lưu niệm của người địa phương để giúp họ kiếm tiền.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["conservation","bảo tồn"],["destination","điểm đến"],["explore","khám phá"],["eco-friendly","thân thiện môi trường"],["aware","nhận thức"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Buy","local","products","to","help","people"],"explain":"Câu đúng: Buy local products to help people. (Hãy mua sản phẩm địa phương để giúp người dân.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: What are coral reefs, teacher? B: They are beautiful homes for sea animals. A: Can we touch them? B: No. Touching coral can kill it.","sub_questions":[{"q":"What are coral reefs?","options":["Beautiful homes for sea animals","Big rocks","Fish food"],"answer":0},{"q":"Can we touch coral?","options":["No","Yes","Sometimes"],"answer":0},{"q":"Why not?","options":["Touching coral can kill it","It is dirty","It is sharp"],"answer":0}],"explain":"Nghe kỹ: rạn san hô là nơi ở của động vật biển; không được chạm vì có thể giết san hô.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Hoi An is famous for its old streets and lanterns. Tourists can walk around the ancient town and try local food. The town is cleaner because people use fewer plastic bags. Everyone should keep Hoi An beautiful.","statements":["a) Hoi An is famous for old streets.","b) Tourists can try local food.","c) People use fewer plastic bags.","d) Nobody should protect Hoi An."],"answer":["T","T","T","F"],"explain":"a) Đúng: famous for its old streets and lanterns. b) Đúng: try local food. c) Đúng: use fewer plastic bags. d) Sai: mọi người nên giữ Hội An đẹp.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Sustainable tourism plans for the future. It limits the number of visitors to protect nature. Local people share in the profits. Their children can also enjoy clean beaches and green forests. This way, tourism lasts for many years.","statements":["a) Sustainable tourism plans for the future.","b) It limits visitor numbers.","c) Local people share profits.","d) Tourism will last many years this way."],"answer":["T","T","T","T"],"explain":"a) Đúng: plans for the future. b) Đúng: limits the number of visitors. c) Đúng: share in the profits. d) Đúng: lasts for many years.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Sustainable tourism protects nature","explain":"Đọc to, rõ ràng, chú ý: susTAInable, PROtects.","points":1}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letters 'ed' are pronounced differently from the others.","options":["A. explored","B. stayed","C. cleaned","D. visited"],"answer":"D","explain":"Trong explored, stayed, cleaned, ed đọc là /d/; trong visited, ed đọc là /ɪd/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. ac'tivity","B. possi'bility","C. commu'nity","D. 'ecotourism"],"answer":"D","explain":"activity, possibility, community nhấn âm 2 (trước -ity); ecotourism nhấn âm 1.","points":0.25},{"type":"mcq","level":"NB","q":"___ tourism brings too many visitors at once.","options":["A. Mass","B. Small","C. Little","D. Good"],"answer":"A","explain":"mass tourism (du lịch đại chúng): đón quá đông du khách cùng lúc.","points":0.25},{"type":"mcq","level":"TH","q":"If we ___ the environment, ecotourism will grow.","options":["A. will protect","B. protect","C. protected","D. would protect"],"answer":"B","explain":"Câu điều kiện loại 1: If + hiện tại đơn (protect), will + V.","points":0.25},{"type":"mcq","level":"VD","q":"She would travel more if she ___ more money.","options":["A. had","B. has","C. will have","D. would have"],"answer":"A","explain":"Câu điều kiện loại 2: If + quá khứ đơn (had), would + V.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"How can we be responsible tourists?\" B: \"___\"","options":["A. Don't damage nature.","B. Litter everywhere.","C. Make noise.","D. I don't know."],"answer":"A","explain":"Du khách có trách nhiệm: đừng phá hoại thiên nhiên.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["ecotourism","du lịch sinh thái"],["conservation","bảo tồn"],["exotic","kỳ lạ"],["trail","đường mòn"],["sustainable","bền vững"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["If","I","had","time","I","would","travel"],"explain":"Câu đúng: If I had time I would travel. (Nếu tôi có thời gian, tôi sẽ đi du lịch.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Lan, what is your favourite destination in Viet Nam? B: Ha Long Bay. The caves are amazing. A: What did you do there? B: I sailed on the bay and explored a cave.","sub_questions":[{"q":"What is Lan's favourite destination?","options":["Ha Long Bay","Sapa","Hoi An"],"answer":0},{"q":"What are amazing?","options":["The caves","The beaches","The hotels"],"answer":0},{"q":"What did she do?","options":["Sailed on the bay and explored a cave","Swam all day","Shopped"],"answer":0}],"explain":"Nghe kỹ: điểm đến yêu thích của Lan là Vịnh Hạ Long; hang động tuyệt vời; cô đi thuyền và khám phá hang.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Phong Nha Cave is one of the most beautiful caves in the world. Tourists sail on underground rivers to see amazing rocks. The cave is protected so future visitors can also enjoy it. Everyone must follow the guide's rules.","statements":["a) Phong Nha is a beautiful cave.","b) Tourists sail on underground rivers.","c) The cave is not protected.","d) Tourists must follow rules."],"answer":["T","T","F","T"],"explain":"a) Đúng: one of the most beautiful caves. b) Đúng: sail on underground rivers. c) Sai: hang được bảo vệ. d) Đúng: follow the guide's rules.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Tourism can damage local culture. When too many tourists come, old traditions may disappear. Young people may forget their own music and dances. Responsible ecotourism teaches tourists to respect local culture.","statements":["a) Tourism can damage local culture.","b) Old traditions may disappear.","c) Young people always keep traditions.","d) Ecotourism respects local culture."],"answer":["T","F","F","T"],"explain":"a) Đúng: can damage local culture. b) Đúng: may disappear. c) Sai: người trẻ có thể quên nhạc và điệu múa. d) Đúng: respect local culture.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Ha Long Bay is a beautiful destination","explain":"Đọc to, rõ ràng, chú ý: BEAUtiful, destiNAtion.","points":1}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 's' is pronounced differently from the others.","options":["A. impacts","B. profits","C. costs","D. trails"],"answer":"D","explain":"Trong impacts, profits, costs, s đọc là /s/; trong trails, s đọc là /z/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. conser'vation","B. desti'nation","C. edu'cation","D. 'tourism"],"answer":"D","explain":"conservation, destination, education nhấn âm 3 (trước -tion); tourism nhấn âm 1.","points":0.25},{"type":"mcq","level":"NB","q":"Tourists should respect the ___ culture.","options":["A. local","B. foreign","C. strange","D. new"],"answer":"A","explain":"local culture (văn hóa địa phương): du khách nên tôn trọng.","points":0.25},{"type":"mcq","level":"TH","q":"You will get lost unless you ___ a map.","options":["A. will take","B. take","C. took","D. would take"],"answer":"B","explain":"Unless = if... not; câu điều kiện loại 1: unless + hiện tại đơn (take).","points":0.25},{"type":"mcq","level":"VD","q":"If people ___ less energy, pollution would decrease.","options":["A. used","B. use","C. will use","D. would use"],"answer":"A","explain":"Câu điều kiện loại 2: If + quá khứ đơn (used), would + V.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Is it OK to pick flowers in the park?\" B: \"___\"","options":["A. No, leave them for everyone.","B. Yes, pick many.","C. I love flowers.","D. Who cares."],"answer":"A","explain":"Không nên hái hoa: để hoa cho mọi người ngắm.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["destination","điểm đến"],["explore","khám phá"],["impact","tác động"],["local","địa phương"],["aware","nhận thức"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Do","not","damage","coral","reefs"],"explain":"Câu đúng: Do not damage coral reefs. (Đừng phá hoại rạn san hô.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Minh, do you know what tourists should not do in forests? B: They should not make fires. A: Why? B: Fires can burn the forest. A: What else? B: Don't leave rubbish.","sub_questions":[{"q":"What shouldn't tourists do?","options":["Make fires in forests","Walk on trails","Take photos"],"answer":0},{"q":"Why?","options":["Fires can burn the forest","Fires are beautiful","Smoke is nice"],"answer":0},{"q":"What else?","options":["Don't leave rubbish","Don't drink water","Don't talk"],"answer":0}],"explain":"Nghe kỹ: du khách không đốt lửa trong rừng vì gây cháy rừng; cũng không xả rác.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). National parks protect nature and animals. Visitors pay a small fee to enter. The money helps protect the park. Tourists must not hunt or pick plants in the park.","statements":["a) National parks protect nature.","b) Visitors pay a fee.","c) The money helps the park.","d) Tourists can hunt in the park."],"answer":["T","T","T","F"],"explain":"a) Đúng: protect nature and animals. b) Đúng: pay a small fee. c) Đúng: helps protect the park. d) Sai: không săn bắt, hái cây.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Some tourists want to see rare animals. They pay local guides to find them. This gives guides jobs and money. But tourists must not disturb the animals. Watching quietly is the responsible way.","statements":["a) Tourists want to see rare animals.","b) Guides earn money.","c) Tourists should disturb animals.","d) Watching quietly is responsible."],"answer":["T","T","F","T"],"explain":"a) Đúng: want to see rare animals. b) Đúng: gives guides jobs and money. c) Sai: không làm phiền động vật. d) Đúng: Watching quietly is the responsible way.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Do not damage coral reefs","explain":"Đọc to, rõ ràng, chú ý: DAmage, COral.","points":1}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letters 'ch' are pronounced differently from the others.","options":["A. beach","B. culture","C. change","D. children"],"answer":"B","explain":"Trong beach, change, children, ch đọc là /tʃ/; trong culture, ch đọc là /k/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. sustai'nable","B. tra'ditional","C. eco'nomic","D. 'ecotourism"],"answer":"D","explain":"sustainable, traditional, economic nhấn âm 2; ecotourism nhấn âm 1.","points":0.25},{"type":"mcq","level":"NB","q":"We should be ___ of protecting nature.","options":["A. aware","B. afraid","C. tired","D. sick"],"answer":"A","explain":"be aware of (nhận thức được): chúng ta nên nhận thức việc bảo vệ thiên nhiên.","points":0.25},{"type":"mcq","level":"TH","q":"If he ___ me, I will help him.","options":["A. will ask","B. asks","C. asked","D. would ask"],"answer":"B","explain":"Câu điều kiện loại 1: If + hiện tại đơn (asks), will + V.","points":0.25},{"type":"mcq","level":"VD","q":"What would you do if you ___ a million dollars?","options":["A. had","B. have","C. will have","D. would have"],"answer":"A","explain":"Câu điều kiện loại 2: If + quá khứ đơn (had), would + V.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"What should tourists not do?\" B: \"___\"","options":["A. They shouldn't hunt wild animals.","B. They should litter.","C. Nothing.","D. Bye."],"answer":"A","explain":"Du khách không nên săn động vật hoang dã.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["mass tourism","du lịch đại chúng"],["degrade","làm suy thoái"],["profit","lợi nhuận"],["preserve","giữ gìn"],["handicraft","đồ thủ công"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Mass","tourism","harms","the","environment"],"explain":"Câu đúng: Mass tourism harms the environment. (Du lịch đại chúng gây hại môi trường.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: What is sustainable tourism, teacher? B: It's tourism that protects nature for the future. A: How does it work? B: It limits visitors and helps local people. A: Is it expensive? B: Sometimes, but it's worth it.","sub_questions":[{"q":"What is sustainable tourism?","options":["Tourism that protects nature for the future","Cheap tourism","Fast tourism"],"answer":0},{"q":"How does it work?","options":["It limits visitors and helps local people","It brings many visitors","It builds hotels"],"answer":0},{"q":"Is it worth it?","options":["Yes","No","Maybe"],"answer":0}],"explain":"Nghe kỹ: du lịch bền vững bảo vệ thiên nhiên cho tương lai; hạn chế du khách, giúp người địa phương; xứng đáng.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). The Mekong Delta is famous for floating markets. Tourists can sail on rivers and buy fresh fruit. Local people are friendly and welcoming. Tourism helps them have a better life.","statements":["a) The Mekong Delta has floating markets.","b) Tourists can buy fresh fruit.","c) Local people are unfriendly.","d) Tourism helps local life."],"answer":["T","T","T","F"],"explain":"a) Đúng: famous for floating markets. b) Đúng: buy fresh fruit. c) Sai: người dân thân thiện (friendly and welcoming). d) Đúng: have a better life.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Plastic bottles harm nature for hundreds of years. Tourists should bring reusable bottles on trips. Many hotels now give guests glass bottles. Small changes protect beautiful destinations.","statements":["a) Plastic bottles harm nature long.","b) Tourists should bring reusable bottles.","c) Hotels give glass bottles.","d) Small changes don't help."],"answer":["T","T","T","F"],"explain":"a) Đúng: for hundreds of years. b) Đúng: bring reusable bottles. c) Đúng: give guests glass bottles. d) Sai: thay đổi nhỏ bảo vệ điểm đến.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Sustainable tourism helps local people","explain":"Đọc to, rõ ràng, chú ý: susTAInable, LOcal.","points":1}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'g' is pronounced differently from the others.","options":["A. degrade","B. general","C. giant","D. gentle"],"answer":"A","explain":"Trong general, giant, gentle, g đọc là /dʒ/; trong degrade, g đọc là /ɡ/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. Vietna'mese","B. engi'neer","C. Japa'nese","D. 'tourism"],"answer":"D","explain":"Vietnamese, engineer, Japanese nhấn âm cuối; tourism nhấn âm 1.","points":0.25},{"type":"mcq","level":"NB","q":"___ development meets today's needs without harming the future.","options":["A. Sustainable","B. Fast","C. Slow","D. Cheap"],"answer":"A","explain":"sustainable development (phát triển bền vững): đáp ứng hiện tại, không hại tương lai.","points":0.25},{"type":"mcq","level":"TH","q":"Plants will die if we ___ them water.","options":["A. won't give","B. don't give","C. didn't give","D. wouldn't give"],"answer":"B","explain":"Câu điều kiện loại 1: If + hiện tại đơn (don't give), will + V.","points":0.25},{"type":"mcq","level":"VD","q":"If he studied harder, he ___ pass the exam.","options":["A. would","B. will","C. can","D. shall"],"answer":"A","explain":"Câu điều kiện loại 2: If + quá khứ đơn (studied), would + V.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Do you like ecotourism?\" B: \"___\"","options":["A. Yes, it protects nature.","B. No, I hate it.","C. I'm tired.","D. Good night."],"answer":"A","explain":"Trả lời: Yes, it protects nature (du lịch sinh thái bảo vệ thiên nhiên).","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["ecology","sinh thái học"],["responsible","có trách nhiệm"],["culture","văn hóa"],["natural resources","tài nguyên thiên nhiên"],["eco-friendly","thân thiện môi trường"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["She","would","help","if","she","could"],"explain":"Câu đúng: She would help if she could. (Cô ấy sẽ giúp nếu cô ấy có thể.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Lan, will you join our beach clean-up this Sunday? B: Yes! What should I bring? A: Gloves and bags. B: What time? A: At 7 in the morning.","sub_questions":[{"q":"Will Lan join the clean-up?","options":["Yes","No","Maybe"],"answer":0},{"q":"What should she bring?","options":["Gloves and bags","Food","Toys"],"answer":0},{"q":"What time?","options":["At 7 in the morning","At 7 in the evening","At noon"],"answer":0}],"explain":"Nghe kỹ: Lan tham gia dọn bãi biển Chủ nhật; mang găng tay và túi; lúc 7 giờ sáng.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Da Lat is cool all year. Tourists love its flowers and pine forests. They can walk around the lake and visit waterfalls. Ecotourism keeps Da Lat clean and green.","statements":["a) Da Lat is cool all year.","b) Tourists love flowers and forests.","c) Tourists can visit waterfalls.","d) Ecotourism pollutes Da Lat."],"answer":["T","T","T","F"],"explain":"a) Đúng: cool all year. b) Đúng: love its flowers and pine forests. c) Đúng: visit waterfalls. d) Sai: du lịch sinh thái giữ Đà Lạt sạch đẹp.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Learning about nature makes trips more interesting. Guides explain how plants and animals live together. Tourists understand why forests matter. When people understand nature, they protect it better.","statements":["a) Learning makes trips interesting.","b) Guides explain nature.","c) Tourists understand why forests matter.","d) Understanding doesn't help protection."],"answer":["T","T","T","F"],"explain":"a) Đúng: makes trips more interesting. b) Đúng: explain how plants and animals live together. c) Đúng: understand why forests matter. d) Sai: hiểu thiên nhiên giúp bảo vệ tốt hơn.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"If we protect nature, our future will be green","explain":"Đọc to, rõ ràng, chú ý: PROtect, NAture, FUture.","points":1}]}]}
