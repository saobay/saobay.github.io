questions": [{"q": "Why is the album free this week?", "options": ["The singer wants more people to hear his music", "It is an old album", "The website has an error"], "answer": 0}, {"q": "What does Mum warn about?", "options": ["Loud music", "Strange websites", "Free albums"], "answer": 1}], "explain": "Album miễn phí vì ca sĩ muốn nhiều người nghe nhạc của mình; mẹ cảnh báo cẩn thận với trang web lạ.", "points": 1}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. judges", "B. voices", "C. dances", "D. clips"], "answer": "D", "explain": "judges, voices, dances có 's' phát âm là /ɪz/, còn clips có 's' phát âm là /s/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. enjoy", "B. begin", "C. gather", "D. prefer"], "answer": "C", "explain": "enjoy, begin, prefer là động từ 2 âm tiết nhấn âm tiết thứ hai, còn gather nhấn âm tiết thứ nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "She has a sweet ___. Everyone loves listening to her songs.", "options": ["A. voice", "B. noise", "C. sound", "D. whisper"], "answer": "A", "explain": "voice (giọng hát) ngọt ngào; mọi người thích nghe cô ấy hát.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "The band has just ___ their new album.", "options": ["A. released", "B. release", "C. releasing", "D. to release"], "answer": "A", "explain": "'has just + V3/ed' là thì hiện tại hoàn thành: has just released. (Ôn kiến thức thì trong ngữ cảnh Unit 3.)", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "My parents would rather ___ at home than go to a noisy concert.", "options": ["A. stay", "B. to stay", "C. staying", "D. stays"], "answer": "A", "explain": "Cấu trúc 'would rather + bare infinitive' (thà... còn hơn): would rather stay.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lan: Let's go to the concert on Saturday! - Mai: ___.", "options": ["A. Sounds great! What time does it start?", "B. Concerts are loud.", "C. Saturday is a day.", "D. I hate Saturdays."], "answer": "A", "explain": "Khi được rủ đi hòa nhạc, câu đáp tích cực là nhận lời và hỏi giờ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). The violin is a string instrument with four strings. Players use a bow to make sound. Learning the violin takes years of practice. It is often called the king of instruments because of its beautiful sound.", "statements": ["a) The violin has four strings.", "b) Players use a bow to make sound.", "c) Learning the violin is very easy.", "d) It is called the king of instruments."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: học violin cần nhiều năm luyện tập. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). A lullaby is a soft song sung to help babies sleep. Every culture has its own lullabies with gentle melodies. Scientists say lullabies calm both babies and parents. Singing lullabies also strengthens the bond between parent and child.", "statements": ["a) A lullaby helps babies sleep.", "b) Only Western cultures have lullabies.", "c) Lullabies calm babies and parents.", "d) Lullabies strengthen parent-child bonds."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: ru con ngủ. b) Sai: mọi nền văn hóa đều có bài hát ru. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: The thief was made (raise) ___ his hands.", "answer": "to raise", "explain": "Câu bẫy: 'make + O + bare infinitive' ở thể chủ động, nhưng ở thể bị động (was made) phải dùng to-infinitive: was made to raise.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["audience", "khán giả"], ["perform", "biểu diễn"], ["contest", "cuộc thi"], ["release", "phát hành"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["made", "They", "sing", "her", "again"], "explain": "Câu đúng: They made her sing again.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: I heard you play the drums very well. B: Thanks! I have practised for three years. A: Do you want to join our band? B: Really? What kind of music do you play? A: Rock. We need a drummer for our school show next month. B: I'd love to! When do we practise? A: Every Tuesday and Thursday.", "sub_questions": [{"q": "How long has the boy practised drums?", "options": ["One year", "Three years", "Five years"], "answer": 1}, {"q": "When does the band practise?", "options": ["Every Monday", "Every Tuesday and Thursday", "Every weekend"], "answer": 1}], "explain": "Cậu bé tập trống 3 năm; ban nhạc rock tập vào thứ Ba và thứ Năm cho buổi diễn của trường.", "points": 1}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. concerts", "B. bands", "C. hits", "D. clips"], "answer": "B", "explain": "concerts, hits, clips có 's' phát âm là /s/, còn bands có 's' phát âm là /z/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. culture", "B. decide", "C. include", "D. invite"], "answer": "A", "explain": "decide, include, invite là động từ 2 âm tiết nhấn âm tiết thứ hai, còn culture nhấn âm tiết thứ nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "The ___ of the song is so lovely that I cannot stop humming it.", "options": ["A. melody", "B. noise", "C. whisper", "D. silence"], "answer": "A", "explain": "melody (giai điệu) đáng yêu khiến tôi cứ ngân nga mãi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "She is talented ___ kind. Everyone loves her.", "options": ["A. and", "B. but", "C. or", "D. so"], "answer": "A", "explain": "Hai tính từ cùng ý tích cực nối bằng 'and'.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "You had better ___ your music teacher about the contest.", "options": ["A. to ask", "B. ask", "C. asking", "D. asks"], "answer": "B", "explain": "Cấu trúc 'had better + bare infinitive' (tốt hơn nên): had better ask.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tom: This song is amazing! - Jerry: ___.", "options": ["A. I know, right? I listen to it every day.", "B. Songs are bad.", "C. Turn it down.", "D. I prefer silence."], "answer": "A", "explain": "Khi bạn khen một bài hát, câu đáp đồng tình là 'I know, right? I listen to it every day.'", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). The piano has 88 keys. Pianists press the keys to make music. It is one of the most popular instruments in the world. Many children start learning the piano at the age of five or six.", "statements": ["a) The piano has 88 keys.", "b) The piano is unpopular.", "c) Many children start learning piano at five or six.", "d) Pianists press keys to make music."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: piano là một trong những nhạc cụ phổ biến nhất. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Music festivals attract thousands of fans every summer. People camp, dance and enjoy live music for days. However, festivals also create lots of rubbish. Organisers now encourage fans to use reusable cups and sort their waste.", "statements": ["a) Music festivals attract thousands of fans.", "b) Festivals create no rubbish.", "c) Organisers encourage reusable cups.", "d) Fans are asked to sort their waste."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: lễ hội tạo ra rất nhiều rác. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: She was seen (leave) ___ the theatre in a hurry.", "answer": "to leave", "explain": "Câu bẫy: 'see + O + bare infinitive' ở chủ động, nhưng ở bị động (was seen) phải dùng to-infinitive: was seen to leave.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["judge", "giám khảo"], ["debut", "ra mắt (lần đầu)"], ["single", "đĩa đơn"], ["vote", "bình chọn"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["let", "The", "teacher", "sing", "us", "song", "a"], "explain": "Câu đúng: The teacher let us sing a song.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Our school music night is next Friday. Are you performing? B: Yes, I am going to sing a folk song. A: Solo? B: No, with my class choir. We have practised for a month. A: I am sure you will do well. B: Thanks! Come and support us. A: Of course I will!", "sub_questions": [{"q": "What is the girl going to do?", "options": ["Dance solo", "Sing a folk song with her choir", "Play the piano"], "answer": 1}, {"q": "How long have they practised?", "options": ["A week", "A month", "A year"], "answer": 1}], "explain": "Cô gái sẽ hát dân ca cùng dàn hợp xướng lớp; họ đã tập một tháng cho đêm nhạc của trường.", "points": 1}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. artists", "B. idols", "C. fans", "D. songs"], "answer": "A", "explain": "idols, fans, songs có 's' phát âm là /z/, còn artists có 's' phát âm là /s/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. prepare", "B. useful", "C. happen", "D. travel"], "answer": "A", "explain": "useful, happen, travel nhấn âm tiết thứ nhất, còn prepare là động từ 2 âm tiết nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "A ___ writes music for singers to perform.", "options": ["A. composer", "B. viewer", "C. fan", "D. judge"], "answer": "A", "explain": "composer (nhà soạn nhạc) viết nhạc cho ca sĩ biểu diễn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "He agreed ___ us with the concert preparations.", "options": ["A. help", "B. to help", "C. helping", "D. helps"], "answer": "B", "explain": "Sau 'agree' dùng to-infinitive: agreed to help.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "The singer was made ___ three more songs by the excited audience.", "options": ["A. sing", "B. to sing", "C. singing", "D. sings"], "answer": "B", "explain": "'make + O + bare infinitive' ở chủ động, nhưng ở bị động (was made) phải dùng to-infinitive: was made to sing.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mai: I am nervous about my performance tonight. - Nam: ___.", "options": ["A. Good luck! You will do great.", "B. Don't perform then.", "C. Nervous is bad.", "D. Stay home instead."], "answer": "A", "explain": "Khi bạn lo lắng trước buổi diễn, câu động viên phù hợp là 'Good luck! You will do great.'", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Dan Bau is a traditional Vietnamese instrument with only one string. Players change the pitch by bending the string. Its sound is soft and sad, often used in folk music. Learning Dan Bau requires great skill and patience.", "statements": ["a) Dan Bau has only one string.", "b) Its sound is loud and cheerful.", "c) It is often used in folk music.", "d) Learning Dan Bau needs skill and patience."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: đàn bầu chỉ có một dây. b) Sai: tiếng đàn mềm và buồn. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Some studies suggest that listening to loud music for too long can damage hearing. Experts advise keeping the volume below 60 percent and taking breaks. Earbuds are more dangerous than headphones because they sit closer to the eardrum. Protecting your ears lets you enjoy music for life.", "statements": ["a) Loud music can damage hearing.", "b) Experts advise maximum volume all the time.", "c) Earbuds can be more dangerous than headphones.", "d) Protecting ears helps enjoy music longer."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: chuyên gia khuyên giữ âm lượng dưới 60% và nghỉ ngơi. c) Đúng: tai nghe nhét tai gần màng nhĩ hơn. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: She is good ___ singing and dancing.", "answer": "at", "explain": "Cấu trúc cố định 'be good at + V-ing' (giỏi về việc gì).", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["rhythm", "nhịp điệu"], ["lyrics", "lời bài hát"], ["fan", "người hâm mộ"], ["clip", "video ngắn"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["rather", "I", "stay", "would", "home", "at"], "explain": "Câu đúng: I would rather stay at home.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Did you watch the singing contest final last night? B: Yes! The winner was amazing. A: I voted for her three times! B: Me too. Do you think she deserved to win? A: Definitely. Her voice is powerful and she performed with confidence. B: I hope she releases an album soon.", "sub_questions": [{"q": "How many times did the girl vote?", "options": ["Once", "Twice", "Three times"], "answer": 2}, {"q": "Why did she deserve to win?", "options": ["She is beautiful", "Her voice is powerful and she performed confidently", "She is the youngest"], "answer": 1}], "explain": "Cô gái đã bình chọn 3 lần; thí sinh xứng đáng thắng vì giọng khỏe và biểu diễn tự tin.", "points": 1}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. voices", "B. judges", "C. clips", "D. dances"], "answer": "C", "explain": "voices, judges, dances có 's' phát âm là /ɪz/, còn clips có 's' phát âm là /s/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. follow", "B. notice", "C. depend", "D. listen"], "answer": "C", "explain": "follow, notice, listen nhấn âm tiết thứ nhất, còn depend là động từ 2 âm tiết nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "The lyrics of the song are very ___. They make me cry.", "options": ["A. meaningful", "B. meaningless", "C. meaning", "D. mean"], "answer": "A", "explain": "meaningful (đầy ý nghĩa) — lời bài hát ý nghĩa khiến tôi xúc động.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "We managed ___ the tickets online before they sold out.", "options": ["A. book", "B. to book", "C. booking", "D. books"], "answer": "B", "explain": "Sau 'manage' dùng to-infinitive: managed to book.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "She was heard ___ a beautiful lullaby to her baby.", "options": ["A. sing", "B. to sing", "C. singing", "D. sings"], "answer": "B", "explain": "'hear + O + bare infinitive' ở chủ động, nhưng ở bị động (was heard) phải dùng to-infinitive: was heard to sing.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dad: Turn down the music, please! - Son: ___.", "options": ["A. Sorry, Dad. I will turn it down right away.", "B. Music is life.", "C. No, I won't.", "D. Loud is good."], "answer": "A", "explain": "Khi bố yêu cầu vặn nhỏ nhạc, câu đáp lễ phép là xin lỗi và làm ngay.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). The guitar is one of the most popular instruments. There are acoustic guitars and electric guitars. Beginners often start with simple chords. With daily practice, anyone can play their favourite songs within months.", "statements": ["a) The guitar is a popular instrument.", "b) There are two main kinds: acoustic and electric.", "c) Beginners start with difficult solos.", "d) Daily practice helps you play songs in months."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: người mới bắt đầu với hợp âm đơn giản. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Streaming has changed how we listen to music. In the past, people bought CDs or downloaded songs. Now, most people pay a small monthly fee and listen to millions of songs online. Artists earn less per play, but they can reach fans worldwide instantly.", "statements": ["a) Streaming has changed music listening.", "b) In the past, nobody bought CDs.", "c) Artists can reach fans worldwide instantly.", "d) Artists earn more per stream than per CD."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: xưa kia người ta mua CD hoặc tải nhạc. c) Đúng. d) Sai: nghệ sĩ kiếm ít hơn mỗi lượt nghe so với bán CD.", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: He refused (lend) ___ me his guitar.", "answer": "to lend", "explain": "Sau 'refuse' dùng to-infinitive: refused to lend.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["melody", "giai điệu"], ["stage", "sân khấu"], ["judge", "giám khảo"], ["contest", "cuộc thi"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["better", "You", "had", "practise", "every", "day"], "explain": "Câu đúng: You had better practise every day.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Why are tickets for the concert so expensive? B: Because the singer is world-famous. A: I really want to go, but I only have half the money. B: I can lend you some. You can pay me back later. A: Really? Thank you so much! B: No problem. But you must buy the tickets today. They sell out fast. A: I will go right now!", "sub_questions": [{"q": "Why are the tickets expensive?", "options": ["The singer is world-famous", "The concert is very long", "There are few seats"], "answer": 0}, {"q": "What will the boy do?", "options": ["Wait until tomorrow", "Go buy the tickets right now", "Borrow money from his mum"], "answer": 1}], "explain": "Vé đắt vì ca sĩ nổi tiếng thế giới; cậu bé sẽ đi mua vé ngay vì vé bán hết rất nhanh.", "points": 1}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. bands", "B. concerts", "C. songs", "D. fans"], "answer": "B", "explain": "bands, songs, fans có 's' phát âm là /z/, còn concerts có 's' phát âm là /s/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. agree", "B. ancient", "C. promise", "D. famous"], "answer": "A", "explain": "ancient, promise, famous nhấn âm tiết thứ nhất, còn agree là động từ 2 âm tiết nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "He is a ___ singer. He can sing many kinds of music.", "options": ["A. talented", "B. talent", "C. talentedly", "D. untalented"], "answer": "A", "explain": "Sau 'a' và trước danh từ 'singer' cần tính từ: talented (tài năng).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "The audience ___ loudly when the show ended.", "options": ["A. clapped", "B. clap", "C. is clapping", "D. to clap"], "answer": "A", "explain": "'when the show ended' là dấu hiệu quá khứ đơn: clapped. (Ôn thì quá khứ trong ngữ cảnh Unit 3.)", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "I watched the pianist ___ the final note perfectly.", "options": ["A. play", "B. to play", "C. playing", "D. plays"], "answer": "A", "explain": "'watch + O + bare infinitive' diễn tả chứng kiến toàn bộ hành động từ đầu đến cuối: watched the pianist play.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hoa: What do you think of my new song? - Nam: ___.", "options": ["A. It's wonderful! I love the rhythm.", "B. Songs exist.", "C. I didn't hear it.", "D. New is good."], "answer": "A", "explain": "Khi được hỏi ý kiến về bài hát mới, câu đáp phù hợp là khen ngợi cụ thể.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). The drums are among the oldest instruments in the world. Ancient people used drums to send messages and celebrate festivals. Today, drums are the heartbeat of rock and pop bands. A good drummer keeps the rhythm for the whole band.", "statements": ["a) Drums are among the oldest instruments.", "b) Ancient people used drums to send messages.", "c) Drums are unimportant in modern bands.", "d) A drummer keeps the rhythm for the band."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: trống là 'nhịp tim' của ban nhạc rock/pop. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Many teenagers dream of becoming idols, but the road is tough. Trainees practise up to 12 hours a day and follow strict rules. Only a few debut successfully. Experts advise young dreamers to finish school first, because education is a safe backup plan.", "statements": ["a) Becoming an idol is easy.", "b) Trainees practise many hours daily.", "c) Only a few trainees debut successfully.", "d) Experts advise finishing school first."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: con đường trở thành thần tượng rất gian nan. b) Đúng: tập tới 12 tiếng/ngày. c) Đúng. d) Đúng: học vấn là kế hoạch dự phòng an toàn.", "points": 1}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: He is famous ___ his powerful voice.", "answer": "for", "explain": "Cấu trúc cố định 'be famous for' (nổi tiếng về...).", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["voice", "giọng hát"], ["hit", "bản hit"], ["band", "ban nhạc"], ["record", "bản thu âm"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["to", "decided", "She", "part", "take", "in", "contest", "the"], "explain": "Câu đúng: She decided to take part in the contest.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Grandma, did you like music when you were young? B: Oh yes! We sang folk songs while working in the fields. A: No phones or speakers? B: No. Our voices were the music. We felt happy and less tired. A: That sounds wonderful. B: Music connects people, in the past and now.", "sub_questions": [{"q": "What did Grandma do while working in the fields?", "options": ["Listened to the radio", "Sang folk songs", "Played the guitar"], "answer": 1}, {"q": "What does Grandma say about music?", "options": ["It is only for young people", "It connects people", "It is too loud"], "answer": 1}], "explain": "Bà hát dân ca khi làm đồng; bà nói âm nhạc kết nối con người xưa và nay.", "points": 1}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 's' is pronounced differently from the others.", "options": ["A. clips", "B. hits", "C. judges", "D. artists"], "answer": "C", "explain": "clips, hits, artists có 's' phát âm là /s/, còn judges có 's' phát âm là /ɪz/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. perform", "B. idol", "C. concert", "D. music"], "answer": "A", "explain": "idol, concert, music nhấn âm tiết thứ nhất, còn perform là động từ 2 âm tiết nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "The band will ___ their new single next Friday.", "options": ["A. release", "B. perform", "C. compose", "D. vote"], "answer": "A", "explain": "'release a single' (phát hành đĩa đơn) vào thứ Sáu tới.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "She learned ___ the violin when she was six.", "options": ["A. play", "B. to play", "C. playing", "D. plays"], "answer": "B", "explain": "Sau 'learn' dùng to-infinitive: learned to play.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "They noticed the stranger ___ photos of the stage.", "options": ["A. take", "B. to take", "C. taking", "D. takes"], "answer": "A", "explain": "'notice + O + bare infinitive' diễn tả chứng kiến toàn bộ hành động: noticed the stranger take. ('taking' cũng có thể dùng khi chỉ chứng kiến một phần, nhưng đáp án chuẩn theo cấu trúc bài học là bare infinitive.)", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ben: Shall we form a band? - Ann: ___.", "options": ["A. Why not? I can play the guitar!", "B. Bands are noisy.", "C. I can't sing.", "D. Guitars are heavy."], "answer": "A", "explain": "Khi được rủ lập ban nhạc, câu đáp tích cực là đồng ý và nêu khả năng của mình.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Karaoke was invented in Japan. People sing along to music without the original singer's voice. It is a favourite pastime in many Asian countries. Families and friends gather to sing karaoke on special occasions.", "statements": ["a) Karaoke was invented in Japan.", "b) People sing with the original singer's voice.", "c) It is popular in many Asian countries.", "d) People sing karaoke on special occasions."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: hát theo nhạc không có giọng ca sĩ gốc. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Learning music and learning languages use similar brain areas. Children who learn an instrument often find it easier to learn new words. Rhythm helps memory, and songs make new vocabulary stick. That is why many teachers use songs in English lessons.", "statements": ["a) Music and languages use similar brain areas.", "b) Rhythm helps memory.", "c) Songs make vocabulary harder to remember.", "d) Teachers use songs in English lessons."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: nhịp điệu giúp trí nhớ. c) Sai: bài hát giúp từ vựng 'dính' lâu hơn (dễ nhớ hơn). d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: I look forward to (hear) ___ her new album.", "answer": "hearing", "explain": "Câu bẫy: sau 'look forward to', 'to' là giới từ nên dùng V-ing: look forward to hearing.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["idol", "thần tượng"], ["melody", "giai điệu"], ["stage", "sân khấu"], ["release", "phát hành"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["wants", "She", "famous", "to", "become", "singer", "a"], "explain": "Câu đúng: She wants to become a famous singer.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Tickets for the charity concert are 200,000 dong. Are you going? B: Yes! The money helps poor children. A: Who is performing? B: Many famous singers. My idol will sing three songs. A: Let us buy tickets together tomorrow. B: Good idea. I will bring my savings.", "sub_questions": [{"q": "How much is a ticket?", "options": ["100,000 dong", "200,000 dong", "300,000 dong"], "answer": 1}, {"q": "What is the concert for?", "options": ["For a new stadium", "To help poor children", "For the singers' fans"], "answer": 1}], "explain": "Vé 200.000 đồng; buổi hòa nhạc từ thiện giúp trẻ em nghèo.", "points": 1}]}]}</script>
