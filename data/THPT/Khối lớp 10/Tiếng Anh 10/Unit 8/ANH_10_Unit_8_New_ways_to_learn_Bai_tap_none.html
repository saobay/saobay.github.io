<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'i' is pronounced differently from the others.","options":["A. digital","B. device","C. identify","D. idea"],"answer":"A","explain":"Trong digital, chữ i đọc là /ɪ/; trong device, identify, idea, chữ i đọc là /aɪ/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. 'digital","B. 'personal","C. sym'bolic","D. 'educate"],"answer":"C","explain":"digital, personal, educate nhấn âm 1 (hậu tố -al, -ate); symbolic nhấn âm 2 (trước -ic).","points":0.25},{"type":"mcq","level":"NB","q":"Students use ___ such as laptops and tablets to learn online.","options":["A. devices","B. foods","C. clothes","D. toys"],"answer":"A","explain":"devices (thiết bị): học sinh dùng các thiết bị như laptop, máy tính bảng để học trực tuyến.","points":0.25},{"type":"mcq","level":"TH","q":"I'm looking for a secretary ___ can use a computer well.","options":["A. who","B. which","C. whose","D. whom"],"answer":"A","explain":"Danh từ chỉ người (secretary) làm chủ ngữ → dùng who.","points":0.25},{"type":"mcq","level":"VD","q":"My laptop, ___ I bought last year, works very well.","options":["A. which","B. that","C. who","D. whose"],"answer":"A","explain":"Mệnh đề không xác định (có dấu phẩy) không dùng that → dùng which.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"What do you think of online learning?\" B: \"___\"","options":["A. I think it's convenient.","B. I like rice.","C. I'm tired.","D. Goodbye."],"answer":"A","explain":"Trả lời câu hỏi ý kiến: I think it's convenient (Tôi thấy nó tiện lợi).","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["digital","kỹ thuật số"],["device","thiết bị"],["tablet","máy tính bảng"],["concentrate","tập trung"],["distract","làm xao nhãng"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Students","use","digital","devices","to","learn"],"explain":"Câu đúng: Students use digital devices to learn. (Học sinh dùng thiết bị số để học.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: How do you learn English at home, Lan? B: I watch video lessons on my tablet. A: Do you understand everything? B: Mostly yes. I can pause and watch again when I don't understand.","sub_questions":[{"q":"How does Lan learn English at home?","options":["She watches video lessons on her tablet","She goes to class","She reads books"],"answer":0},{"q":"What can she do when she doesn't understand?","options":["Pause and watch again","Ask her mum","Give up"],"answer":0},{"q":"What device does she use?","options":["A tablet","A phone","A TV"],"answer":0}],"explain":"Nghe kỹ: Lan xem video bài học trên máy tính bảng; có thể dừng và xem lại khi không hiểu.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Online learning lets students study at home. They watch video lessons and do exercises on the Internet. Students can learn at their own pace. However, they need a good Internet connection.","statements":["a) Online learning lets students study at home.","b) Students watch video lessons online.","c) Students must learn at the same pace.","d) A good Internet connection is needed."],"answer":["T","T","F","T"],"explain":"a) Đúng: study at home. b) Đúng: watch video lessons. c) Sai: học theo tốc độ của mình (their own pace). d) Đúng: trong bài.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Blended learning is becoming popular in many schools. It combines online lessons with face-to-face classes. Students watch videos at home and discuss with teachers in class. Studies show that blended learning can be more effective than only online or only face-to-face learning.","statements":["a) Blended learning combines online and face-to-face study.","b) Students never meet teachers in blended learning.","c) Students watch videos at home.","d) Blended learning can be very effective."],"answer":["T","F","T","T"],"explain":"a) Đúng: combines online lessons with face-to-face classes. b) Sai: vẫn gặp giáo viên để thảo luận. c) Đúng: watch videos at home. d) Đúng: more effective.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Students use digital devices to learn English","explain":"Đọc to, rõ ràng, chú ý trọng âm: DIgital, deVIces.","points":1}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'a' is pronounced differently from the others.","options":["A. tablet","B. access","C. application","D. face"],"answer":"D","explain":"Trong tablet, access, application, chữ a đọc là /æ/; trong face, chữ a đọc là /eɪ/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. de'cision","B. a'bility","C. com'munity","D. 'benefit"],"answer":"D","explain":"decision, ability, community nhấn âm 2 (trước -ion, -ity); benefit nhấn âm 1.","points":0.25},{"type":"mcq","level":"NB","q":"A ___ is a small computer you can carry easily.","options":["A. table","B. tablet","C. chair","D. pen"],"answer":"B","explain":"tablet (máy tính bảng): chiếc máy tính nhỏ dễ mang theo.","points":0.25},{"type":"mcq","level":"TH","q":"This is the book ___ I like best.","options":["A. who","B. which","C. whose","D. whom"],"answer":"B","explain":"Danh từ chỉ vật (book) → dùng which (hoặc that).","points":0.25},{"type":"mcq","level":"VD","q":"He told me about the places and people ___ he had seen in London.","options":["A. who","B. whom","C. that","D. whose"],"answer":"C","explain":"places and people (vừa vật vừa người) → dùng that.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Do you like studying on a tablet?\" B: \"___\"","options":["A. Yes, it's very useful.","B. No, thanks.","C. I'm fine.","D. See you."],"answer":"A","explain":"Trả lời đồng tình: Yes, it's very useful.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["touchscreen","màn hình cảm ứng"],["identify","nhận dạng"],["access","truy cập"],["portable","di động"],["software","phần mềm"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Online","learning","is","very","convenient"],"explain":"Câu đúng: Online learning is very convenient. (Học trực tuyến rất tiện lợi.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: What is blended learning, teacher? B: It combines online lessons and classroom lessons. A: What do students do at home? B: They watch videos and do exercises online. A: And in class? B: They discuss with teachers and friends.","sub_questions":[{"q":"What is blended learning?","options":["It combines online and classroom lessons","It is only online","It is only in class"],"answer":0},{"q":"What do students do at home?","options":["Watch videos and do exercises online","Play games","Sleep"],"answer":0},{"q":"What do they do in class?","options":["Discuss with teachers and friends","Watch TV","Take exams only"],"answer":0}],"explain":"Nghe kỹ: học kết hợp gồm bài trực tuyến và bài trên lớp; ở nhà xem video, làm bài tập; trên lớp thảo luận.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). A tablet is a portable device with a touchscreen. Students can use tablets to read books, watch lessons and do exercises. Tablets are lighter than laptops, so students can carry them easily.","statements":["a) A tablet has a touchscreen.","b) Students can read books on tablets.","c) Tablets are heavier than laptops.","d) Students can carry tablets easily."],"answer":["T","T","F","T"],"explain":"a) Đúng: with a touchscreen. b) Đúng: read books, watch lessons. c) Sai: nhẹ hơn laptop (lighter than laptops). d) Đúng: carry them easily.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Some students find it hard to concentrate when learning online. Messages and games on their phones distract them easily. Teachers advise students to turn off notifications during lessons. A quiet place also helps students focus better.","statements":["a) Some students cannot concentrate well online.","b) Phones never distract students.","c) Teachers advise turning off notifications.","d) A quiet place helps students focus."],"answer":["T","F","T","T"],"explain":"a) Đúng: hard to concentrate. b) Sai: điện thoại dễ làm xao nhãng. c) Đúng: turn off notifications. d) Đúng: helps students focus better.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Blended learning combines online and classroom lessons","explain":"Đọc to, rõ ràng, chú ý: BLENded, COMbines.","points":1}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'e' is pronounced differently from the others.","options":["A. device","B. effective","C. develop","D. pen"],"answer":"D","explain":"Trong device, effective, develop, chữ e đọc là /ɪ/; trong pen, chữ e đọc là /e/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. Japa'nese","B. engi'neer","C. Vietna'mese","D. 'family"],"answer":"D","explain":"Japanese, engineer, Vietnamese nhấn âm cuối; family nhấn âm 1.","points":0.25},{"type":"mcq","level":"NB","q":"I need to ___ on my lesson; don't distract me.","options":["A. concentrate","B. sleep","C. run","D. sing"],"answer":"A","explain":"concentrate on (tập trung vào): tôi cần tập trung vào bài học.","points":0.25},{"type":"mcq","level":"TH","q":"The boy ___ bicycle you borrowed is Tom.","options":["A. who","B. which","C. whose","D. whom"],"answer":"C","explain":"whose + danh từ (bicycle) chỉ sở hữu → whose bicycle.","points":0.25},{"type":"mcq","level":"VD","q":"This is the best film ___ I have ever seen.","options":["A. who","B. which","C. that","D. whose"],"answer":"C","explain":"Sau so sánh nhất (the best) bắt buộc dùng that.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Is blended learning effective?\" B: \"___\"","options":["A. Yes, I think so.","B. Never mind.","C. Good night.","D. Not at all."],"answer":"A","explain":"Trả lời đồng tình với câu hỏi ý kiến: Yes, I think so.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["application","ứng dụng"],["strategy","chiến lược"],["benefit","lợi ích"],["effective","hiệu quả"],["instruction","hướng dẫn"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["The","teacher","who","helped","me","is","kind"],"explain":"Câu đúng: The teacher who helped me is kind. (Cô giáo đã giúp tôi rất tốt bụng.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Nam, do you use any learning apps? B: Yes. I use an app to learn English words every day. A: Is it useful? B: Very useful. It helps me remember words with pictures and games.","sub_questions":[{"q":"Does Nam use learning apps?","options":["Yes","No","Sometimes"],"answer":0},{"q":"What does he learn?","options":["English words","Maths","Music"],"answer":0},{"q":"Why is the app useful?","options":["It helps remember words with pictures and games","It is free","It is funny"],"answer":0}],"explain":"Nghe kỹ: Nam dùng app học từ vựng tiếng Anh mỗi ngày; app giúp nhớ từ qua hình ảnh và trò chơi.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Voice recognition is a useful technology. It lets computers understand what we say. Students can use it to practise speaking English. The computer listens and tells them their mistakes.","statements":["a) Voice recognition lets computers understand speech.","b) Students can practise speaking with it.","c) The computer tells students their mistakes.","d) Voice recognition is useless for learning."],"answer":["T","T","T","F"],"explain":"a) Đúng: understand what we say. b) Đúng: practise speaking English. c) Đúng: tells them their mistakes. d) Sai: đây là công nghệ hữu ích.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Face-to-face classes have some advantages over online lessons. Students can ask teachers questions immediately and work with friends easily. However, they must travel to school every day, which takes time and money. Many students prefer blended learning because it has the benefits of both ways.","statements":["a) Students can ask questions immediately in face-to-face classes.","b) Face-to-face classes save travel time.","c) Students can work with friends easily in class.","d) Many students like blended learning."],"answer":["T","F","T","T"],"explain":"a) Đúng: ask teachers questions immediately. b) Sai: phải đi lại mỗi ngày tốn thời gian. c) Đúng: work with friends easily. d) Đúng: prefer blended learning.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Online learning helps us study at our own pace","explain":"Đọc to, rõ ràng, chú ý: ONline, LEARning.","points":1}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'o' is pronounced differently from the others.","options":["A. concentrate","B. online","C. portable","D. software"],"answer":"C","explain":"Trong concentrate, online, software, chữ o đọc là /ɒ/; trong portable, chữ o đọc là /ɔː/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. 'dangerous","B. 'tablet","C. 'software","D. dis'tract"],"answer":"D","explain":"dangerous, tablet, software nhấn âm 1; distract là động từ 2 âm tiết nên nhấn âm 2.","points":0.25},{"type":"mcq","level":"NB","q":"___ learning combines online lessons and classroom lessons.","options":["A. Blended","B. Sweet","C. Hot","D. Cold"],"answer":"A","explain":"blended learning (học kết hợp): kết hợp bài trực tuyến và bài trên lớp.","points":0.25},{"type":"mcq","level":"TH","q":"The teacher ___ helped me is very kind.","options":["A. who","B. which","C. whose","D. whom"],"answer":"A","explain":"Danh từ chỉ người (teacher) làm chủ ngữ → dùng who.","points":0.25},{"type":"mcq","level":"VD","q":"I have never seen anything ___ beautiful.","options":["A. who","B. which","C. that","D. whose"],"answer":"C","explain":"Sau anything bắt buộc dùng that.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Can the Internet help us learn English?\" B: \"___\"","options":["A. Sure, it can.","B. I don't know.","C. I'm hungry.","D. Take care."],"answer":"A","explain":"Trả lời khẳng định chắc chắn: Sure, it can.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["blended learning","học kết hợp"],["online learning","học trực tuyến"],["face-to-face","trực tiếp"],["voice recognition","nhận dạng giọng nói"],["immediately","ngay lập tức"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["This","is","the","book","which","I","like"],"explain":"Câu đúng: This is the book which I like. (Đây là cuốn sách mà tôi thích.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Hoa, how do you remember new words? B: I write them on cards and use a learning app. A: How often do you practise? B: Every evening for 20 minutes.","sub_questions":[{"q":"How does Hoa remember new words?","options":["She writes them on cards and uses an app","She sings songs","She watches films"],"answer":0},{"q":"How often does she practise?","options":["Every evening","Every morning","Once a week"],"answer":0},{"q":"How long each time?","options":["20 minutes","2 hours","10 minutes"],"answer":0}],"explain":"Nghe kỹ: Hoa ghi từ ra thẻ và dùng app học; luyện mỗi tối 20 phút.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). A good learning strategy helps students study better. For example, students should review lessons every day, not only before exams. Taking notes during lessons also helps them remember. A quiet study place is important too.","statements":["a) A good strategy helps students study better.","b) Students should review lessons every day.","c) Taking notes helps memory.","d) Students should only study before exams."],"answer":["T","T","T","F"],"explain":"a) Đúng: helps students study better. b) Đúng: review lessons every day. c) Đúng: helps them remember. d) Sai: nên ôn mỗi ngày, không chỉ trước kỳ thi.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). The Internet gives students access to lessons from the best teachers in the world. A student in a small village can watch the same lessons as a student in a big city. However, not every family can buy a computer. Governments should help poor students access digital learning.","statements":["a) The Internet gives access to good lessons.","b) Village students can watch the same lessons as city students.","c) Every family can buy a computer.","d) Governments should help poor students."],"answer":["T","T","F","T"],"explain":"a) Đúng: access to lessons from the best teachers. b) Đúng: the same lessons. c) Sai: không phải gia đình nào cũng mua được máy tính. d) Đúng: help poor students access digital learning.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"A tablet is portable and easy to carry","explain":"Đọc to, rõ ràng, chú ý: TAblet, PORtable.","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letters 'ou' are pronounced differently from the others.","options":["A. touchscreen","B. cloud","C. proud","D. sound"],"answer":"A","explain":"Trong cloud, proud, sound, ou đọc là /aʊ/; trong touchscreen, ou đọc là /ʌ/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. i'dentify","B. ef'fective","C. dis'tract","D. 'digital"],"answer":"D","explain":"identify, effective, distract nhấn âm 2; digital nhấn âm 1.","points":0.25},{"type":"mcq","level":"NB","q":"This software helps you ___ new words quickly.","options":["A. identify","B. eat","C. break","D. hide"],"answer":"A","explain":"identify (nhận biết): phần mềm giúp bạn nhận biết từ mới nhanh chóng.","points":0.25},{"type":"mcq","level":"TH","q":"The laptop ___ I bought yesterday is very fast.","options":["A. who","B. which","C. whose","D. whom"],"answer":"B","explain":"Danh từ chỉ vật (laptop) → dùng which (hoặc that).","points":0.25},{"type":"mcq","level":"VD","q":"Mr Nam, ___ is our teacher, is very kind.","options":["A. who","B. that","C. which","D. whose"],"answer":"A","explain":"Mệnh đề không xác định (có dấu phẩy) chỉ người → dùng who, không dùng that.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"What's the advantage of online learning?\" B: \"___\"","options":["A. We can study at our own pace.","B. It's raining.","C. I like dogs.","D. Bye."],"answer":"A","explain":"Nêu ưu điểm: We can study at our own pace (học theo tốc độ của mình).","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["digital","kỹ thuật số"],["touchscreen","màn hình cảm ứng"],["benefit","lợi ích"],["instruction","hướng dẫn"],["portable","di động"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["We","can","study","at","our","own","pace"],"explain":"Câu đúng: We can study at our own pace. (Chúng ta có thể học theo tốc độ của mình.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Mum, can I use your laptop for my online lesson? B: Sure, but be careful with it. A: What time does my lesson start? B: At 8 o'clock. Don't be late!","sub_questions":[{"q":"What does the girl want to use?","options":["Her mum's laptop","A tablet","Her phone"],"answer":0},{"q":"What time does the lesson start?","options":["At 8 o'clock","At 9 o'clock","At 7 o'clock"],"answer":0},{"q":"What does her mum say?","options":["Be careful with it","Don't study","Turn it off"],"answer":0}],"explain":"Nghe kỹ: bạn gái mượn laptop của mẹ; bài học bắt đầu lúc 8 giờ; mẹ dặn cẩn thận.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Smartphones are useful for learning, but they can also distract students. Many students play games during online lessons. Teachers ask students to put phones away in class. Using phones wisely helps learning.","statements":["a) Smartphones are useful for learning.","b) Phones never distract students.","c) Teachers ask students to put phones away.","d) Using phones wisely helps learning."],"answer":["T","F","T","T"],"explain":"a) Đúng: useful for learning. b) Sai: điện thoại có thể làm xao nhãng. c) Đúng: put phones away in class. d) Đúng: trong bài.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). In the future, robots may teach some lessons in schools. They can answer questions immediately and never get tired. However, robots cannot understand students' feelings like human teachers. Most experts believe robots will help teachers, not replace them.","statements":["a) Robots may teach some lessons in the future.","b) Robots never get tired.","c) Robots understand feelings better than teachers.","d) Robots will help, not replace, teachers."],"answer":["T","T","F","T"],"explain":"a) Đúng: may teach some lessons. b) Đúng: never get tired. c) Sai: không hiểu cảm xúc như giáo viên. d) Đúng: help teachers, not replace them.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"We can learn at our own pace online","explain":"Đọc to, rõ ràng, chú ý: ONline, PACE.","points":1}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letters 'ea' are pronounced differently from the others.","options":["A. learn","B. read","C. speak","D. teach"],"answer":"A","explain":"Trong read, speak, teach, ea đọc là /iː/; trong learn, ea đọc là /ɜː/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. 'internet","B. 'strategy","C. 'portable","D. in'struction"],"answer":"D","explain":"internet, strategy, portable nhấn âm 1; instruction nhấn âm 2.","points":0.25},{"type":"mcq","level":"NB","q":"A ___ lets you write directly on the screen.","options":["A. touchscreen","B. printer","C. speaker","D. camera"],"answer":"A","explain":"touchscreen (màn hình cảm ứng): cho phép viết trực tiếp lên màn hình.","points":0.25},{"type":"mcq","level":"TH","q":"She is the girl ___ mother is a doctor.","options":["A. who","B. which","C. whose","D. whom"],"answer":"C","explain":"whose + danh từ (mother) chỉ sở hữu → whose mother.","points":0.25},{"type":"mcq","level":"VD","q":"The phone ___ you gave me is broken.","options":["A. who","B. that","C. whose","D. whom"],"answer":"B","explain":"Danh từ chỉ vật trong mệnh đề xác định → dùng that (hoặc which).","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Do you prefer face-to-face classes?\" B: \"___\"","options":["A. Yes, I can ask teachers directly.","B. No, thanks.","C. I'm OK.","D. Good luck."],"answer":"A","explain":"Nêu ưu điểm của học trực tiếp: có thể hỏi giáo viên ngay.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["identify","nhận dạng"],["access","truy cập"],["software","phần mềm"],["voice recognition","nhận dạng giọng nói"],["immediately","ngay lập tức"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["A","tablet","is","portable","and","useful"],"explain":"Câu đúng: A tablet is portable and useful. (Máy tính bảng di động và hữu ích.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: What did you do in your English class today, Minh? B: We practised speaking with voice recognition software. A: Was it difficult? B: At first yes, but the software showed my mistakes and I improved.","sub_questions":[{"q":"What did Minh practise?","options":["Speaking with voice recognition software","Writing essays","Listening to songs"],"answer":0},{"q":"Was it difficult at first?","options":["Yes","No","A little"],"answer":0},{"q":"How did he improve?","options":["The software showed his mistakes","The teacher helped","He guessed"],"answer":0}],"explain":"Nghe kỹ: Minh luyện nói với phần mềm nhận dạng giọng nói; lúc đầu khó; phần mềm chỉ lỗi giúp tiến bộ.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Lan studies English with an app every morning. The app teaches her five new words a day. She practises speaking and the app checks her pronunciation. After three months, her English is much better.","statements":["a) Lan studies English every morning.","b) The app teaches five new words a day.","c) The app checks her pronunciation.","d) Her English is worse now."],"answer":["T","T","T","F"],"explain":"a) Đúng: every morning. b) Đúng: five new words a day. c) Đúng: checks her pronunciation. d) Sai: tiếng Anh tốt hơn nhiều (much better).","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Some parents worry that children spend too much time on screens. Too much screen time can harm children's eyes and sleep. Experts advise parents to limit screen time to two hours a day. Children should also play outside and do exercise.","statements":["a) Too much screen time can harm eyes.","b) Experts advise limiting screen time.","c) Children should never play outside.","d) Screen time can affect sleep."],"answer":["T","T","F","T"],"explain":"a) Đúng: harm children's eyes. b) Đúng: limit screen time to two hours a day. c) Sai: nên chơi ngoài trời và vận động. d) Đúng: harm sleep.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Voice recognition helps me practise speaking","explain":"Đọc to, rõ ràng, chú ý: REcognition, PRACtise.","points":1}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letters 'ed' are pronounced differently from the others.","options":["A. distracted","B. used","C. played","D. studied"],"answer":"A","explain":"Trong used, played, studied, ed đọc là /d/; trong distracted, ed đọc là /ɪd/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. appli'cation","B. communi'cation","C. infor'mation","D. 'tablet"],"answer":"D","explain":"application, communication, information nhấn âm 3 (trước -tion); tablet nhấn âm 1.","points":0.25},{"type":"mcq","level":"NB","q":"Online courses give students the chance to work at their own ___.","options":["A. pace","B. house","C. car","D. tree"],"answer":"A","explain":"at their own pace (theo tốc độ của mình): khóa học trực tuyến cho học sinh học theo tốc độ riêng.","points":0.25},{"type":"mcq","level":"TH","q":"Do you know the man ___ is talking to Lan?","options":["A. who","B. which","C. whose","D. whom"],"answer":"A","explain":"Danh từ chỉ người (man) làm chủ ngữ → dùng who.","points":0.25},{"type":"mcq","level":"VD","q":"She is the only student ___ passed the exam.","options":["A. who","B. which","C. that","D. whose"],"answer":"C","explain":"Sau only bắt buộc dùng that.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Is this app useful for learning?\" B: \"___\"","options":["A. Yes, very useful.","B. Not at all.","C. Excuse me.","D. I'm sorry."],"answer":"A","explain":"Trả lời khẳng định: Yes, very useful.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["digital","kỹ thuật số"],["device","thiết bị"],["concentrate","tập trung"],["effective","hiệu quả"],["benefit","lợi ích"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["The","boy","whose","bike","is","red","is","Tom"],"explain":"Câu đúng: The boy whose bike is red is Tom. (Cậu bé có xe đạp đỏ là Tom.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Lan, what is your favourite way to learn English? B: I like watching English films with subtitles. A: Does it help? B: Yes. I learn new words and hear real pronunciation.","sub_questions":[{"q":"What is Lan's favourite way to learn?","options":["Watching English films with subtitles","Reading books","Playing games"],"answer":0},{"q":"Does it help?","options":["Yes","No","A little"],"answer":0},{"q":"What does she learn?","options":["New words and real pronunciation","Grammar only","Nothing"],"answer":0}],"explain":"Nghe kỹ: Lan thích xem phim tiếng Anh có phụ đề; cách này giúp học từ mới và nghe phát âm thật.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Taking notes helps students remember lessons. They should write down important ideas in their own words. Pictures and mind maps also help. Reviewing notes every evening makes memory stronger.","statements":["a) Taking notes helps memory.","b) Students should copy everything word by word.","c) Mind maps help learning.","d) Reviewing notes helps memory."],"answer":["T","F","T","T"],"explain":"a) Đúng: helps students remember. b) Sai: nên ghi ý chính bằng lời của mình. c) Đúng: mind maps also help. d) Đúng: makes memory stronger.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Some schools use smart tables in classrooms. Several students can touch and interact with the table at the same time. They play learning games and solve problems together. Teachers say students learn faster and enjoy lessons more with smart tables.","statements":["a) Smart tables are used in some schools.","b) Only one student can use a smart table.","c) Students play learning games together.","d) Teachers say students enjoy lessons more."],"answer":["T","F","T","T"],"explain":"a) Đúng: trong bài. b) Sai: nhiều học sinh dùng cùng lúc. c) Đúng: play learning games. d) Đúng: enjoy lessons more.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Taking notes helps me remember lessons","explain":"Đọc to, rõ ràng, chú ý: TAking, REMember.","points":1}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 's' is pronounced differently from the others.","options":["A. tablets","B. laptops","C. desks","D. devices"],"answer":"D","explain":"Trong tablets, laptops, desks, s đọc là /s/; trong devices, s đọc là /ɪz/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. de'cision","B. a'bility","C. possi'bility","D. 'family"],"answer":"D","explain":"decision, ability, possibility nhấn âm 2; family nhấn âm 1.","points":0.25},{"type":"mcq","level":"NB","q":"Teachers can create a classroom ___ for students to post ideas.","options":["A. blog","B. dog","C. box","D. fog"],"answer":"A","explain":"blog (nhật ký mạng): giáo viên tạo blog lớp để học sinh đăng ý tưởng.","points":0.25},{"type":"mcq","level":"TH","q":"The film ___ we watched was interesting.","options":["A. who","B. which","C. whose","D. whom"],"answer":"B","explain":"Danh từ chỉ vật (film) → dùng which (hoặc that).","points":0.25},{"type":"mcq","level":"VD","q":"Everything ___ he said was true.","options":["A. who","B. which","C. that","D. whose"],"answer":"C","explain":"Sau everything bắt buộc dùng that.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"How do you learn new words?\" B: \"___\"","options":["A. I use a learning app.","B. I eat bread.","C. I run fast.","D. I sleep."],"answer":"A","explain":"Trả lời cách học: I use a learning app (Tôi dùng app học tập).","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["tablet","máy tính bảng"],["touchscreen","màn hình cảm ứng"],["distract","làm xao nhãng"],["strategy","chiến lược"],["instruction","hướng dẫn"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Blended","learning","combines","two","methods"],"explain":"Câu đúng: Blended learning combines two methods. (Học kết hợp gồm hai phương thức.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Minh, do you think tablets can replace textbooks? B: Maybe in the future. Tablets are lighter and have many books inside. A: What is the problem? B: The screen can hurt our eyes if we read too long.","sub_questions":[{"q":"What does Minh think?","options":["Tablets may replace textbooks in the future","Tablets are useless","Books are better"],"answer":0},{"q":"What is good about tablets?","options":["They are lighter and have many books","They are cheap","They are big"],"answer":0},{"q":"What is the problem?","options":["The screen can hurt eyes","They are heavy","They break easily"],"answer":0}],"explain":"Nghe kỹ: máy tính bảng có thể thay sách trong tương lai; nhẹ và chứa nhiều sách; nhưng màn hình hại mắt nếu đọc lâu.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Libraries are quiet places for studying. Students can borrow books for free. Many libraries also have computers with Internet. Studying in a library helps students concentrate better.","statements":["a) Libraries are quiet places.","b) Students can borrow books for free.","c) Libraries never have computers.","d) Libraries help students concentrate."],"answer":["T","T","F","T"],"explain":"a) Đúng: quiet places for studying. b) Đúng: borrow books for free. c) Sai: nhiều thư viện có máy tính nối mạng. d) Đúng: helps students concentrate better.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). A survey shows that students who review lessons daily get better marks. Short daily study is more effective than long study before exams. The brain remembers better with sleep between study times. Therefore, students should study a little every day.","statements":["a) Daily review helps get better marks.","b) Long study before exams is the best way.","c) Sleep helps memory.","d) Students should study a little daily."],"answer":["T","F","T","T"],"explain":"a) Đúng: get better marks. b) Sai: học ngắn mỗi ngày hiệu quả hơn. c) Đúng: remembers better with sleep. d) Đúng: study a little every day.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"The Internet gives us access to many lessons","explain":"Đọc to, rõ ràng, chú ý: INternet, ACcess.","points":1}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letters 'ch' are pronounced differently from the others.","options":["A. touchscreen","B. teacher","C. technology","D. children"],"answer":"C","explain":"Trong touchscreen, teacher, children, ch đọc là /tʃ/; trong technology, ch đọc là /k/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. 'dangerous","B. 'tablet","C. 'software","D. e'valuate"],"answer":"D","explain":"dangerous, tablet, software nhấn âm 1; evaluate nhấn âm 2.","points":0.25},{"type":"mcq","level":"NB","q":"___ recognition helps computers understand our voice.","options":["A. Voice","B. Face","C. Hand","D. Foot"],"answer":"A","explain":"voice recognition (nhận dạng giọng nói): giúp máy tính hiểu giọng nói.","points":0.25},{"type":"mcq","level":"TH","q":"I like the teacher ___ explains clearly.","options":["A. who","B. which","C. whose","D. whom"],"answer":"A","explain":"Danh từ chỉ người (teacher) làm chủ ngữ → dùng who.","points":0.25},{"type":"mcq","level":"VD","q":"The house ___ roof is red is mine.","options":["A. who","B. which","C. whose","D. whom"],"answer":"C","explain":"whose + danh từ (roof) chỉ sở hữu → whose roof.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Can tablets replace textbooks?\" B: \"___\"","options":["A. Maybe, but books are still useful.","B. I don't care.","C. Bye bye.","D. No way."],"answer":"A","explain":"Trả lời cân nhắc: Maybe, but books are still useful.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["access","truy cập"],["software","phần mềm"],["application","ứng dụng"],["online learning","học trực tuyến"],["blended learning","học kết hợp"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["She","uses","apps","to","learn","English"],"explain":"Câu đúng: She uses apps to learn English. (Cô ấy dùng app để học tiếng Anh.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: What are you doing, Lan? B: I'm joining an online English club. A: How does it work? B: We meet on video every Sunday and talk in English.","sub_questions":[{"q":"What is Lan doing?","options":["Joining an online English club","Watching TV","Playing games"],"answer":0},{"q":"How does it work?","options":["They meet on video every Sunday","They write letters","They phone each other"],"answer":0},{"q":"What do they do?","options":["Talk in English","Sing songs","Play chess"],"answer":0}],"explain":"Nghe kỹ: Lan tham gia câu lạc bộ tiếng Anh trực tuyến; gặp qua video mỗi Chủ nhật; nói chuyện bằng tiếng Anh.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). English clubs help students practise speaking. Members talk about films, music and school life. Nobody laughs at mistakes, so students feel confident. Joining a club makes learning English more fun.","statements":["a) English clubs help practise speaking.","b) Members talk about films and music.","c) Students laugh at mistakes.","d) Clubs make learning fun."],"answer":["T","T","F","T"],"explain":"a) Đúng: practise speaking. b) Đúng: films, music and school life. c) Sai: không ai cười khi mắc lỗi. d) Đúng: more fun.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Some students learn best in the morning, others at night. Scientists say the brain works well after good sleep. Studying when tired is not effective. Students should find their best study time and keep a regular schedule.","statements":["a) Everyone learns best in the morning.","b) Good sleep helps the brain work well.","c) Studying when tired is effective.","d) Students should keep a regular schedule."],"answer":["F","T","F","T"],"explain":"a) Sai: mỗi người một khác (some... others...). b) Đúng: works well after good sleep. c) Sai: không hiệu quả khi mệt. d) Đúng: keep a regular schedule.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Blended learning is effective for students","explain":"Đọc to, rõ ràng, chú ý: BLENded, efFECtive.","points":1}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'g' is pronounced differently from the others.","options":["A. digital","B. language","C. general","D. gentle"],"answer":"B","explain":"Trong digital, general, gentle, g đọc là /dʒ/; trong language, g đọc là /ɡ/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. Japa'nese","B. engi'neer","C. pio'neer","D. 'benefit"],"answer":"D","explain":"Japanese, engineer, pioneer nhấn âm cuối; benefit nhấn âm 1.","points":0.25},{"type":"mcq","level":"NB","q":"A good ___ helps you learn English faster.","options":["A. strategy","B. story","C. picture","D. song"],"answer":"A","explain":"strategy (chiến lược): chiến lược tốt giúp học tiếng Anh nhanh hơn.","points":0.25},{"type":"mcq","level":"TH","q":"That's the student ___ pen I borrowed.","options":["A. who","B. which","C. whose","D. whom"],"answer":"C","explain":"whose + danh từ (pen) chỉ sở hữu → whose pen.","points":0.25},{"type":"mcq","level":"VD","q":"The students ___ are able to use the smart table will work together.","options":["A. who","B. which","C. whose","D. whom"],"answer":"A","explain":"Danh từ chỉ người (students) làm chủ ngữ → dùng who.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Do you often use voice recognition?\" B: \"___\"","options":["A. Yes, to practise speaking.","B. No, never.","C. I'm busy.","D. Thanks."],"answer":"A","explain":"Trả lời: Yes, to practise speaking (để luyện nói).","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["identify","nhận dạng"],["portable","di động"],["voice recognition","nhận dạng giọng nói"],["immediately","ngay lập tức"],["face-to-face","trực tiếp"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["The","touchscreen","helps","us","write","easily"],"explain":"Câu đúng: The touchscreen helps us write easily. (Màn hình cảm ứng giúp ta viết dễ dàng.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Dad, our teacher asked us to make a video about our school. B: That's interesting! What will you do? A: I'll film the library and the lab with my tablet. B: Good idea. Ask your friends to help you.","sub_questions":[{"q":"What did the teacher ask?","options":["To make a video about the school","To write an essay","To draw a picture"],"answer":0},{"q":"What will the boy film?","options":["The library and the lab","The playground","His house"],"answer":0},{"q":"What does his dad advise?","options":["Ask friends to help","Do it alone","Don't do it"],"answer":0}],"explain":"Nghe kỹ: cô giáo yêu cầu làm video về trường; bạn nam sẽ quay thư viện và phòng lab; bố khuyên nhờ bạn giúp.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Group study helps students learn from each other. They explain lessons to friends and answer questions together. Shy students become more confident. However, groups should not be too big or too noisy.","statements":["a) Group study helps students learn from each other.","b) Students explain lessons to friends.","c) Shy students become more confident.","d) Big noisy groups are the best."],"answer":["T","T","T","F"],"explain":"a) Đúng: learn from each other. b) Đúng: explain lessons to friends. c) Đúng: more confident. d) Sai: nhóm không nên quá đông hoặc ồn.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Digital devices are changing how we learn. In the past, students only learned from textbooks and teachers. Now they can watch lessons from anywhere in the world. But technology cannot replace good teachers, who guide and encourage students every day.","statements":["a) Devices are changing how we learn.","b) In the past students learned only from books and teachers.","c) Students can now watch lessons from anywhere.","d) Technology can fully replace teachers."],"answer":["T","T","T","F"],"explain":"a) Đúng: changing how we learn. b) Đúng: only learned from textbooks and teachers. c) Đúng: from anywhere in the world. d) Sai: công nghệ không thể thay thế giáo viên giỏi.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Technology cannot replace good teachers","explain":"Đọc to, rõ ràng, chú ý: techNOlogy, REplace.","points":1}]}]}
