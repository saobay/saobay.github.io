}, {"q": "How will it work?", "options": ["It waters on a timer", "A sensor checks the soil and waters when dry", "It asks the owner"], "answer": 1}], "explain": "Ý tưởng là robot tưới cây tự động; cảm biến kiểm tra đất, đất khô thì robot tưới.", "points": 1}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ch' is pronounced differently from the others.", "options": ["A. chopsticks", "B. machine", "C. choose", "D. change"], "answer": "B", "explain": "chopsticks, choose, change có 'ch' phát âm là /tʃ/, còn machine có 'ch' phát âm là /ʃ/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. agreement", "B. employee", "C. department", "D. proposal"], "answer": "B", "explain": "agreement, department, proposal nhấn âm tiết thứ hai, còn employee nhấn âm tiết thứ ba.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "This laptop is very ___. You can carry it everywhere.", "options": ["A. portable", "B. heavy", "C. huge", "D. fixed"], "answer": "A", "explain": "portable (di động, xách tay) — mang đi khắp nơi dễ dàng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "They ___ to Japan. They are still in Vietnam.", "options": ["A. have gone", "B. have been", "C. went", "D. go"], "answer": "B", "explain": "'have been to' (đã từng đến và đã về); 'have gone to' (đã đi và vẫn ở đó). Vì họ vẫn ở Việt Nam nên dùng 'have been'.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "My dad ___ a new car. Look! It is in the garage.", "options": ["A. has just bought", "B. just buys", "C. is just buying", "D. bought just"], "answer": "A", "explain": "'just' + kết quả hiện tại (xe đang ở gara) dùng hiện tại hoàn thành: has just bought.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hoa: This app is amazing! - Lan: ___.", "options": ["A. I know! It helps me learn English every day.", "B. Apps are big.", "C. Amazing is a word.", "D. I hate apps."], "answer": "A", "explain": "Khi bạn khen một ứng dụng, câu đáp đồng tình là chia sẻ trải nghiệm tích cực của mình.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Alexander Graham Bell invented the telephone in 1876. His invention let people talk over long distances for the first time. Before that, messages travelled by letter, which took days. The telephone changed business and daily life completely.", "statements": ["a) Bell invented the telephone in 1876.", "b) People could talk over long distances.", "c) Letters were faster than phones.", "d) The telephone changed daily life."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: thư từ mất nhiều ngày, chậm hơn điện thoại. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Some people fear technology makes us lazier. They say calculators weaken maths skills and GPS ruins sense of direction. However, others argue technology frees our brains for creative work. The truth is probably in the middle: tools are good if we use them wisely.", "statements": ["a) Some fear technology makes us lazier.", "b) Everyone agrees technology is bad.", "c) Technology can free brains for creativity.", "d) Tools are good if used wisely."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: có người cho rằng công nghệ giải phóng trí não cho sáng tạo. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: She (go) ___ to Japan last year.", "answer": "went", "explain": "Câu bẫy: 'last year' là dấu hiệu quá khứ đơn, KHÔNG dùng hiện tại hoàn thành dù câu nói về trải nghiệm. Đáp án: went.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["benefit", "lợi ích"], ["improve", "cải thiện"] erts believe they will become common in ten years.", "statements": ["a) A smart home is controlled by phone.", "b) It saves energy automatically.", "c) Smart homes are cheap now.", "d) Experts think they will become common."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: nhà thông minh còn đắt. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: I have lived here ___ I was born.", "answer": "since", "explain": "Câu bẫy: 'since + mốc thời gian / mệnh đề quá khứ' (từ khi tôi sinh ra); đừng nhầm với 'for'.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["screen", "màn hình"], ["keyboard", "bàn phím"], ["software", "phần mềm"], ["hardware", "phần cứng"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["has", "Our", "changed", "school", "a", "lot"], "explain": "Câu đúng: Our school has changed a lot.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: My new phone can unlock with my face! B: Wow, that's advanced. Is it safe? A: Yes, it is safer than a password. B: What if someone uses your photo? A: It checks that I'm a real person, not a photo. B: Technology is amazing these days.", "sub_questions": [{"q": "How does the new phone unlock?", "options": ["With a password", "With face recognition", "With a fingerprint"], "answer": 1}, {"q": "Why is it safe?", "options": ["It is expensive", "It checks for a real person, not a photo", "It never unlocks"], "answer": 1}], "explain": "Điện thoại mở khóa bằng nhận diện khuôn mặt; nó kiểm tra người thật chứ không phải ảnh.", "points": 1}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ch' is pronounced differently from the others.", "options": ["A. machine", "B. change", "C. charge", "D. choo g", "words": ["yet", "hasn't", "He", "homework", "finished", "his"], "explain": "Câu đúng: He hasn't finished his homework yet.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Dad, what was life like before smartphones? B: We wrote letters and waited weeks for replies. A: That sounds slow! B: It taught us patience. But I love video calls now. A: What invention do you like most? B: The Internet. It changed everything. A: I agree!", "sub_questions": [{"q": "What did people do before smartphones?", "options": ["Wrote letters and waited weeks", "Used video calls", "Sent emails"], "answer": 0}, {"q": "What is Dad's favourite invention?", "options": ["The television", "The Internet", "The car"], "answer": 1}], "explain": "Trước kia người ta viết thư và chờ hàng tuần; bố thích nhất phát minh Internet.", "points": 1}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ch' is pronounced differently from the others.", "options": ["A. choose", "B. change", "C. machine", "D. chopsticks"], "answer": "C", "explain": "choose, change, chopsticks có 'ch' phát âm là /tʃ/, còn machine có 'ch' phát âm là /ʃ/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. advantage", "B. solution", "C. holiday", "D. department"], "answer": "C", "explain": "advantage, solution, department nhấn âm tiết thứ hai, còn holiday nhấn âm tiết thứ nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "The Internet has ___ our lives in many ways.", "options": ["A. changed", "B. kept", "C. left", "D. lost"], "answer": "A", "explain": "Internet đã thay đổi (changed) cuộc sống của chúng ta nhiều mặt.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "He ___ his wallet. He cannot pay for the tickets.", "options": ["A. forgot", "B. has forgotten", "C. forgets", "D. is forgetting"], "answer": "B", "explain": "Quên ví và không thể trả tiền (kết quả hiện tại) dùng hiện tại hoàn thành: has forgotten.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "They ___ the new bridge yet. It will open next month.", "options": ["A. did not finish", "B. have not finished", "C. do not finish", "D. are not finishing"], "answer": "B", "explain": "'yet' trong câu phủ định + cầu chưa xong (sẽ khánh thành tháng tới) dùng hiện tại hoàn thành: have not finished.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lan: I want to buy a good camera. Any advice? - Nam: ___.", "options": ["A. Choose one with good image quality and long battery life.", "B. Cameras take photos.", "C. Buy the cheapest one.", "D. Photos are nice."], "answer": "A", "explain": "Khi được hỏi tư vấn mua máy ảnh, câu trả lời hữu ích là nêu tiêu chí chọn: chất lượng ảnh tốt, pin lâu.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Chopsticks were invented in China thousands of years ago. They are used in many Asian countries today. At first, they were used for cooking, not eating. Now, billions of people eat with chopsticks every day.", "statements": ["a) Chopsticks were invented in China.", "b) They are used in many Asian countries.", "c) They were first used for eating.", "d) Billions use chopsticks daily."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: lúc đầu dùng để nấu ăn, không phải để ăn. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). The digital divide means some people have no Internet access. Students without Internet struggle with online learning. Charities donate old laptops to poor students. Closing this gap is important for equal education.", "statements": ["a) The digital divide means unequal Internet access.", "b) It affects online learning.", "c) Charities donate laptops to poor students.", "d) The gap does not matter for education."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: thu hẹp khoảng cách số rất quan trọng cho giáo dục công bằng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: I (know) ___ him for ten years.", "answer": "have known", "explain": "'for ten years' (kéo dài đến nay) dùng hiện tại hoàn thành; 'know' là động từ trạng thái: have known.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["valuable", "có giá trị"], ["affordable", "vừa túi tiền"], ["wireless", "không dây"], ["automatic", "tự động"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["have", "We", "never", "been", "abroad"], "explain": "Câu đúng: We have never been abroad.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Our robot vacuum is the best invention ever! B: Why do you say that? A: It cleans the floor while we are at work. B: Does it work well? A: Mostly. But it gets stuck under the sofa sometimes. B: Haha! Nothing is perfect. A: True. Still, it saves us lots of time.", "sub_questions": [{"q": "What does the robot vacuum do?", "options": ["Cooks meals", "Cleans the floor automatically", "Washes clothes"], "answer": 1}, {"q": "What is its problem?", "options": ["It is too noisy", "It gets stuck under the sofa", "It breaks easily"], "answer": 1}], "explain": "Robot hút bụi tự dọn nhà khi chủ đi làm, nhưng đôi khi bị kẹt dưới ghế sofa.", "points": 1}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ch' is pronounced differently from the others.", "options": ["A. chemistry", "B. character", "C. change", "D. school"], "answer": "C", "explain": "chemistry, character, school nventions start with learning.", "sub_questions": [{"q": "What does the girl want to invent?", "options": ["A flying car", "A machine turning seawater into drinking water", "A time machine"], "answer": 1}, {"q": "Why would it help?", "options": ["Many places lack clean water", "It would be fun", "It would make her rich"], "answer": 0}], "explain": "Cô gái muốn phát minh máy biến nước biển thành nước uống giá rẻ vì nhiều nơi thiếu nước sạch.", "points": 1}]}]}</script>
