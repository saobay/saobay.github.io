":"TH","q":"'We are doing our homework,' they said. → They said they ___ their homework.","options":["A. were doing","B. are doing","C. do","D. did"],"answer":"A","explain":"Lùi thì: hiện tại tiếp diễn → quá khứ tiếp diễn (are doing → were doing).","points":0.25},{"type":"mcq","level":"VD","q":"'Where did you go yesterday?' she asked. → She asked where I ___ the day before.","options":["A. had gone","B. went","C. go","D. will go"],"answer":"A","explain":"Lùi thì: quá khứ đơn → quá khứ hoàn thành (went → had gone); yesterday → the day before.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Why is deforestation bad?\" B: \"___\"","options":["A. It destroys animals' habitats.","B. It's good.","C. I don't care.","D. Who knows."],"answer":"A","explain":"Chặt phá rừng phá hủy môi trường sống của động vật.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["ecosystem","hệ sinh thái"],["contaminate","làm ô nhiễm"],["extinct","tuyệt chủng"],["release","thải ra"],["natural resources","tài nguyên thiên nhiên"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Clean","water","is","important","for","life"],"explain":"Câu đúng: Clean water is important for life. (Nước sạch quan trọng cho sự sống.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Lan, have you ever planted a tree? B: Yes, with my dad last spring. A: How is it now? B: It's growing well. I water it every day.","sub_questions":[{"q":"Has Lan planted a tree?","options":["Yes","No","Maybe"],"answer":0},{"q":"When?","options":["Last spring","Last week","Yesterday"],"answer":0},{"q":"How is the tree now?","options":["It's growing well","It's dead","It's small"],"answer":0}],"explain":"Nghe kỹ: Lan đã trồng cây với bố mùa xuân năm ngoái; cây đang lớn tốt; cô tưới mỗi ngày.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Bees are very important for nature. They help flowers make fruit. Without bees, many plants cannot grow. We must not kill bees with chemicals.","statements":["a) Bees help flowers make fruit.","b) Plants need bees to grow.","c) Chemicals are good for bees.","d) We must protect bees."],"answer":["T","T","F","T"],"explain":"a) Đúng: help flowers make fruit. b) Đúng: Without bees, many plants cannot grow. c) Sai: không giết ong bằng hóa chất. d) Đúng: must not kill bees.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). The sea gives us food and oxygen. Tiny sea plants make much of the world's oxygen. But plastic and oil pollute the sea. Protecting the sea means protecting our own life.","statements":["a) The sea gives food and oxygen.","b) Sea plants make oxygen.","c) Plastic pollutes the sea.","d) The sea is not important."],"answer":["T","T","T","F"],"explain":"a) Đúng: gives us food and oxygen. b) Đúng: make much of the world's oxygen. c) Đúng: plastic and oil pollute the sea. d) Sai: bảo vệ biển là bảo vệ cuộc sống của ta.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"We must stop illegal hunting","explain":"Đọc to, rõ ràng, chú ý: ilLEgal, HUNting.","points":1}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'g' is pronounced differently from the others.","options":["A. global","B. energy","C. general","D. giant"],"answer":"A","explain":"Trong energy, general, giant, g đọc là /dʒ/; trong global, g đọc là /ɡ/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. 'natural","B. 'habitat","C. 'forest","D. con'taminate"],"answer":"D","explain":"natural, habitat, forest nhấn âm 1; contaminate nhấn âm 2.","points":0.25},{"type":"mcq","level":"NB","q":"High pollution can ___ the balance of an ecosystem.","options":["A. upset","B. help","C. keep","D. save"],"answer":"A","explain":"upset the balance (phá vỡ cân bằng): ô nhiễm cao có thể phá vỡ cân bằng hệ sinh thái.","points":0.25},{"type":"mcq","level":"TH","q":"'I will call you tomorrow,' she said. → She said she ___ me the next day.","options":["A. would call","B. will call","C. calls","D. called"],"answer":"A","explain":"Lùi thì: will → would; tomorrow → the next day.","points":0.25},{"type":"mcq","level":"VD","q":"'Do you like music?' he asked. → He asked whether I ___ music.","options":["A. liked","B. like","C. will like","D. likes"],"answer":"A","explain":"Lùi thì: hiện tại đơn → quá khứ đơn (like → liked); câu hỏi Yes/No dùng whether.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"How can we protect wildlife?\" B: \"___\"","options":["A. We should stop illegal hunting.","B. We should hunt more.","C. I don't like animals.","D. Bye."],"answer":"A","explain":"Bảo vệ động vật hoang dã: ngừng săn bắt trái phép.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["pollution","ô nhiễm"],["wildlife","động vật hoang dã"],["illegal hunting","săn bắt trái phép"],["balance","cân bằng"],["climate change","biến đổi khí hậu"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["They","said","they","would","help"],"explain":"Câu đúng: They said they would help. (Họ nói họ sẽ giúp.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: What are you watching, Nam? B: A film about sea animals. A: What did you learn? B: I learned that plastic kills many sea animals. A: What will you do? B: I'll never throw plastic away carelessly.","sub_questions":[{"q":"What is Nam watching?","options":["A film about sea animals","A comedy","The news"],"answer":0},{"q":"What did he learn?","options":["Plastic kills many sea animals","Fish are happy","The sea is clean"],"answer":0},{"q":"What will Nam do?","options":["Never throw plastic carelessly","Eat more fish","Swim in the sea"],"answer":0}],"explain":"Nghe kỹ: Nam xem phim về động vật biển; nhựa giết nhiều động vật biển; cậu sẽ không vứt nhựa bừa bãi.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Walking and cycling are good for health and the environment. They make no pollution. People in many cities now cycle to work. This also reduces traffic jams.","statements":["a) Walking and cycling are healthy.","b) They make no pollution.","c) People cycle to work in many cities.","d) Cycling increases traffic jams."],"answer":["T","T","T","F"],"explain":"a) Đúng: good for health. b) Đúng: make no pollution. c) Đúng: cycle to work. d) Sai: giảm kẹt xe (reduces traffic jams).","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Everyone can protect the environment. Students can save water and electricity at school. Families can sort rubbish at home. Companies must use clean technology. When everyone acts, the Earth becomes greener.","statements":["a) Students can save water at school.","b) Families can sort rubbish.","c) Companies must use clean technology.","d) Only governments can protect nature."],"answer":["T","T","T","F"],"explain":"a) Đúng: save water and electricity at school. b) Đúng: sort rubbish at home. c) Đúng: use clean technology. d) Sai: mọi người đều có thể bảo vệ môi trường.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Everyone can protect the environment","explain":"Đọc to, rõ ràng, chú ý: EveryONE, enVIronment.","points":1}]}]}
