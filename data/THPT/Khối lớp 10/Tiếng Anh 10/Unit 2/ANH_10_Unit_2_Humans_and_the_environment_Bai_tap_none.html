atter.", "sub_questions": [{"q": "How many plastic bottles did the class use?", "options": ["12", "20", "25"], "answer": 1}, {"q": "What is the new class rule?", "options": ["No picnics", "Everyone brings a reusable bottle", "Everyone buys plastic bottles"], "answer": 1}], "explain": "Lớp đã dùng 20 chai nhựa; quy định mới là mỗi người mang bình tái sử dụng, không dùng nhựa một lần.", "points": 1}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'pr' is pronounced differently from the others.", "options": ["A. protect", "B. great", "C. produce", "D. problem"], "answer": "B", "explain": "protect, produce, problem có 'pr' phát âm là /pr/, còn great có 'gr' phát âm là /gr/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. climate", "B. litter", "C. pollute", "D. forest"], "answer": "C", "explain": "climate, litter, forest nhấn âm tiết thứ nhất, còn pollute nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Please ___ litter in the bin, not on the ground.", "options": ["A. pick up", "B. throw away", "C. put", "D. cut down"], "answer": "C", "explain": "'put litter in the bin' (bỏ rác vào thùng); 'throw away' nghĩa là vứt đi, không phù hợp với 'in the bin'.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "She ___ to the clean-up campaign tomorrow. She signed up yesterday.", "options": ["A. will join", "B. is going to join", "C. joins", "D. join"], "answer": "B", "explain": "'She signed up yesterday' cho thấy đây là kế hoạch đã định trước nên dùng 'be going to': is going to join.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "A: The room is dark. B: I ___ turn on the light.", "options": ["A. will", "B. am going to", "C. turn", "D. turns"], "answer": "A", "explain": "Quyết định bộc phát ngay lúc nói dùng 'will'.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dad: Remember to turn off the lights! - Son: ___.", "options": ["A. OK, Dad. I will do it now.", "B. I like bright rooms.", "C. Lights are expensive.", "D. No, I won't."], "answer": "A", "explain": "Khi được nhắc tắt đèn, câu đáp phù hợp là đồng ý làm ngay.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Sorting rubbish is easy. We put paper, plastic and glass in different bins. Recyclable things go to recycling centres and become new products. Food waste can become fertiliser for plants. Everyone can start sorting today.", "statements": ["a) Sorting rubbish is difficult.", "b) We put different materials in different bins.", "c) Recyclable things become new products.", "d) Food waste can become fertiliser."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: phân loại rác rất dễ (easy). b) Đúng. c) Đúng. d) Đúng: rác thực phẩm thành phân bón.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Many students bring lunch in plastic boxes and bags every day. This creates a lot of waste. Schools now encourage students to use reusable lunch boxes. Some schools even give prizes to classes that produce the least waste.", "statements": ["a) Students create a lot of waste with plastic lunch packaging.", "b) Schools encourage reusable lunch boxes.", "c) No school cares about waste.", "d) Some schools reward low-waste classes."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: nhiều trường khuyến khích giảm rác. d) Đúng: có trường thưởng cho lớp ít rác nhất.", "points": 1}, {"type": "short", "level": "VD", "q": "Give the correct form of the word in brackets: If we (not act) ___ now, the environment will get worse.", "answer": "do not act", "explain": "Mệnh đề 'if' chỉ điều kiện ở hiện tại dùng hiện tại đơn; chủ ngữ 'we' nên phủ định là 'do not act'.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["natural resources", "tài nguyên thiên nhiên"], ["refillable", "có thể nạp lại"], ["litter", "rác bừa bãi"], ["preserve", "bảo tồn"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["going", "They", "are", "the", "to", "beach", "clean", "to"], "explain": "Câu đúng: They are going to clean the beach.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Mum, our teacher said our family should calculate our carbon footprint. B: That is interesting. How do we do it? A: We list how much electricity and water we use, and how we travel. B: Then what? A: Then we find ways to reduce it, like cycling to school. B: Good idea. Let us start this weekend.", "sub_questions": [{"q": "What did the teacher ask students to do?", "options": ["Plant more trees", "Calculate their family carbon footprint", "Write an essay"], "answer": 1}, {"q": "What is one way to reduce the footprint?", "options": ["Driving more", "Cycling to school", "Using more electricity"], "answer": 1}], "explain": "Cô giáo yêu cầu tính dấu chân carbon của gia đình; một cách giảm là đạp xe đi học.", "points": 1}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'cl' is pronounced differently from the others.", "options": ["A. class", "B. close", "C. price", "D. club"], "answer": "C", "explain": "class, close, club có 'cl' phát âm là /kl/, còn price có 'pr' phát âm là /pr/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. organic", "B. product", "C. local", "D. public"], "answer": "A", "explain": "product, local, public nhấn âm tiết thứ nhất, còn organic nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "___ products are grown without chemicals.", "options": ["A. Plastic", "B. Organic", "C. Chemical", "D. Metal"], "answer": "B", "explain": "Organic products (sản phẩm hữu cơ) được trồng không dùng hóa chất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "He has already packed his bag. He ___ his old clothes to the charity shop tomorrow.", "options": ["A. will take", "B. is going to take", "C. takes", "D. take"], "answer": "B", "explain": "'has already packed' cho thấy kế hoạch đã chuẩn bị trước nên dùng 'be going to': is going to take.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "In my opinion, electric cars ___ petrol cars in the future.", "options": ["A. will replace", "B. are going to replace", "C. replace", "D. replaces"], "answer": "A", "explain": "'In my opinion' cho thấy dự đoán theo ý kiến cá nhân nên dùng 'will': will replace.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hoa: Shall we plant trees around our school? - Nam: ___.", "options": ["A. Good idea! Let's do it on Saturday.", "B. Trees are tall.", "C. I don't like Saturdays.", "D. School is big."], "answer": "A", "explain": "Khi được rủ trồng cây, câu đáp tích cực là đồng ý và hẹn thời gian.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). In 2023, volunteers in Da Nang collected over two tonnes of rubbish from My Khe beach in one day. Most of it was plastic bottles and bags. The event raised awareness about ocean pollution. Organisers hope more people will join future clean-ups.", "statements": ["a) Volunteers collected rubbish from My Khe beach.", "b) Most rubbish was plastic bottles and bags.", "c) The event raised awareness about ocean pollution.", "d) Organisers want fewer people to join next time."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: tình nguyện viên nhặt hơn 2 tấn rác ở biển Mỹ Khê. b) Đúng. c) Đúng. d) Sai: ban tổ chức mong nhiều người tham gia hơn.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Some people think one person cannot change the environment. However, history shows small actions spread fast. When one family starts sorting rubbish, neighbours often follow. A town in Japan now recycles 80 percent of its waste because residents worked together for years. Change begins with a single step.", "statements": ["a) One person can never change the environment.", "b) Small actions can spread to neighbours.", "c) A Japanese town recycles 80 percent of its waste.", "d) Change begins with a single step."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: đoạn văn phản bác ý nghĩ 'một người không thể thay đổi'. b) Đúng: hành động nhỏ lan tỏa. c) Đúng. d) Đúng: thay đổi bắt đầu từ một bước nhỏ.", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: By 2030, scientists (predict) ___ that sea levels will rise further.", "answer": "predict", "explain": "Câu bẫy: mệnh đề chính đã có 'will rise'; mệnh đề 'scientists predict that...' diễn tả sự thật/hiện tại nên dùng hiện tại đơn 'predict' (chủ ngữ số nhiều). Đừng thêm 'will' hai lần.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["adopt", "áp dụng"], ["emission", "khí thải"], ["sustainable", "bền vững"], ["litter", "rác bừa bãi"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["will", "She", "at", "plastic", "use", "stop", "home"], "explain": "Câu đúng: She will stop using plastic at home.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Dad, can we get a new air conditioner? This one is very old. B: Old appliances use more electricity. Let us check its energy label first. A: What does the label tell us? B: It shows how much energy it uses. A new eco-friendly one will save money in the long run. A: Then let us buy one this weekend.", "sub_questions": [{"q": "Why does Dad hesitate to buy a new air conditioner immediately?", "options": ["He has no money", "He wants to check the energy label first", "He likes the old one"], "answer": 1}, {"q": "What is the benefit of an eco-friendly air conditioner?", "options": ["It is cheaper to buy", "It saves money in the long run", "It cools faster"], "answer": 1}], "explain": "Bố muốn kiểm tra nhãn năng lượng trước; điều hòa thân thiện môi trường giúp tiết kiệm tiền về lâu dài.", "points": 1}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'pl' is pronounced differently from the others.", "options": ["A. place", "B. grow", "C. play", "D. please"], "answer": "B", "explain": "place, play, please có 'pl' phát âm là /pl/, còn grow có 'gr' phát âm là /gr/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. harmful", "B. useful", "C. destroy", "D. careful"], "answer": "C", "explain": "harmful, useful, careful nhấn âm tiết thứ nhất, còn destroy nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "___ down on plastic use helps protect the ocean.", "options": ["A. Cutting", "B. Cut", "C. To cutting", "D. Cuts"], "answer": "A", "explain": "Danh động từ (V-ing) làm chủ ngữ câu: Cutting down on (cắt giảm) việc dùng nhựa giúp bảo vệ đại dương.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "A: Why are you carrying an umbrella? B: I ___ visit my grandma, and it looks like rain.", "options": ["A. will", "B. am going to", "C. visit", "D. visits"], "answer": "B", "explain": "Chuyến thăm bà đã được định trước (kế hoạch) nên dùng 'be going to': am going to visit.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Look! The boys ___ litter into the lake. Stop them!", "options": ["A. throw", "B. are throwing", "C. throws", "D. will throw"], "answer": "B", "explain": "'Look!' cho thấy hành động đang diễn ra nên dùng hiện tại tiếp diễn: are throwing. (Ôn lại Unit 1 trong ngữ cảnh Unit 2.)", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Minh: Our classroom is so hot. - Lan: ___.", "options": ["A. I will open the windows.", "B. Heat is bad.", "C. Close the windows now.", "D. Let's turn on more lights."], "answer": "A", "explain": "Khi phòng học nóng, đề nghị mở cửa sổ ngay lúc đó dùng 'will' (quyết định bộc phát).", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Food waste is a big problem. About one-third of all food produced is wasted. Wasted food in landfills produces methane, a harmful gas. To help, we can buy only what we need, store food properly and share extra food with others.", "statements": ["a) About one-third of food produced is wasted.", "b) Wasted food produces a harmful gas called methane.", "c) Buying only what we need helps reduce waste.", "d) Sharing extra food makes the problem worse."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: rác thực phẩm sinh khí methane. c) Đúng. d) Sai: chia sẻ đồ ăn thừa giúp giảm lãng phí.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Eco-friendly products are often more expensive at first. However, they usually last longer and save money over time. For example, an LED bulb costs more than a normal bulb but uses less electricity. Smart shoppers think about long-term value, not just the price tag.", "statements": ["a) Eco-friendly products are always cheaper.", "b) They usually last longer and save money over time.", "c) An LED bulb uses less electricity.", "d) Smart shoppers consider long-term value."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: sản phẩm thân thiện môi trường thường đắt hơn lúc đầu. b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: We will ___ out of clean water if we keep wasting it.", "answer": "run", "explain": "Cụm cố định 'run out of' (cạn kiệt): chúng ta sẽ cạn nước sạch nếu tiếp tục lãng phí.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["awareness", "sự nhận thức"], ["recycle", "tái chế"], ["eco-friendly", "thân thiện với môi trường"], ["carbon footprint", "dấu chân carbon"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["going", "to", "We", "are", "reduce", "waste", "food"], "explain": "Câu đúng: We are going to reduce food waste.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: I read that our school throws away 50 kilos of food waste every week. B: That is shocking! What can we do? A: We can start a composting project. Food waste becomes fertiliser for the school garden. B: Who will take care of it? A: The Go Green Club. We are going to ask the principal tomorrow.", "sub_questions": [{"q": "How much food waste does the school throw away weekly?", "options": ["15 kilos", "50 kilos", "100 kilos"], "answer": 1}, {"q": "What is their plan?", "options": ["Stop school meals", "Start a composting project", "Sell the food waste"], "answer": 1}], "explain": "Trường thải 50kg rác thực phẩm mỗi tuần; kế hoạch là ủ phân compost bón cho vườn trường.", "points": 1}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'gr' is pronounced differently from the others.", "options": ["A. promise", "B. grade", "C. ground", "D. group"], "answer": "A", "explain": "grade, ground, group có 'gr' phát âm là /gr/, còn promise có 'pr' phát âm là /pr/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. effect", "B. damage", "C. planet", "D. method"], "answer": "A", "explain": "damage, planet, method nhấn âm tiết thứ nhất, còn effect nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "The ___ of air pollution on health is very serious.", "options": ["A. affect", "B. effect", "C. effective", "D. effectively"], "answer": "B", "explain": "Sau 'The' và trước 'of' cần danh từ: effect (tác động). 'affect' là động từ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Our class ___ a trip to the national park next Sunday. We have booked the bus.", "options": ["A. will have", "B. is going to have", "C. has", "D. have"], "answer": "B", "explain": "'We have booked the bus' cho thấy kế hoạch đã chuẩn bị nên dùng 'be going to': is going to have.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "A: Have you decided what to do about the old fridge? B: Yes. We ___ buy a new energy-saving one.", "options": ["A. will", "B. are going to", "C. buy", "D. buys"], "answer": "B", "explain": "'Have you decided...? - Yes' cho thấy quyết định đã được đưa ra từ trước nên dùng 'be going to'.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nam: I forgot my reusable bag. - Mai: ___.", "options": ["A. Take mine. I have an extra one.", "B. Plastic bags are fine.", "C. Forget it, let's go home.", "D. Bags are expensive."], "answer": "A", "explain": "Khi bạn quên túi tái sử dụng, câu đáp giúp đỡ phù hợp là cho mượn túi của mình.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Cycling to school has many benefits. It produces no pollution, keeps you fit and saves money. Many cities now build special bike lanes to keep cyclists safe. However, you should always wear a helmet and follow traffic rules.", "statements": ["a) Cycling produces no pollution.", "b) Cycling keeps you fit and saves money.", "c) Cyclists should wear helmets.", "d) Bike lanes make cycling more dangerous."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: làn đường xe đạp giúp người đạp xe an toàn hơn.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Greenwashing is when companies pretend to be eco-friendly. They use words like 'natural' or 'green' in ads, but their products still harm the environment. Smart consumers check labels and facts instead of trusting ads. Real change comes from honest actions, not clever marketing.", "statements": ["a) Greenwashing means pretending to be eco-friendly.", "b) All products labelled 'green' are truly green.", "c) Smart consumers check facts, not just ads.", "d) Honest actions matter more than marketing."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: greenwashing là giả vờ thân thiện môi trường. b) Sai: nhiều sản phẩm gắn mác 'xanh' vẫn gây hại. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: The government should take (act) ___ to stop illegal logging.", "answer": "action", "explain": "Cụm cố định 'take action' (hành động); 'act' là động từ, cần danh từ 'action' sau 'take'.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["household appliance", "thiết bị gia dụng"], ["energy bill", "hóa đơn tiền điện"], ["organic", "hữu cơ"], ["preserve", "bảo tồn"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["are", "We", "to", "going", "our", "reduce", "footprint", "carbon"], "explain": "Câu đúng: We are going to reduce our carbon footprint.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Why is our energy bill so high this month? B: We left the air conditioner on all night. A: From now on, let us turn it off before bed. B: Good idea. We are also going to use LED bulbs. A: Will that really help? B: Yes. Small changes add up.", "sub_questions": [{"q": "Why was the energy bill high?", "options": ["They bought a new TV", "They left the air conditioner on all night", "The price of electricity rose"], "answer": 1}, {"q": "What are they going to do?", "options": ["Turn off the air conditioner before bed and use LED bulbs", "Stop using electricity", "Move to a new house"], "answer": 0}], "explain": "Hóa đơn cao vì để điều hòa cả đêm; họ sẽ tắt điều hòa trước khi ngủ và dùng bóng đèn LED.", "points": 1}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'pr' is pronounced differently from the others.", "options": ["A. proud", "B. present", "C. clean", "D. practice"], "answer": "C", "explain": "proud, present, practice có 'pr' phát âm là /pr/, còn clean có 'cl' phát âm là /kl/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. result", "B. ocean", "C. river", "D. mountain"], "answer": "A", "explain": "ocean, river, mountain nhấn âm tiết thứ nhất, còn result nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "We need to ___ public ___ about plastic pollution.", "options": ["A. rise / awareness", "B. raise / awareness", "C. raise / aware", "D. rise / aware"], "answer": "B", "explain": "'raise awareness' (nâng cao nhận thức) là cụm cố định; 'awareness' là danh từ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Be careful! The floor is wet. You ___ slip.", "options": ["A. will", "B. are going to", "C. slip", "D. slips"], "answer": "B", "explain": "Cảnh báo dựa trên tình huống trước mắt (sàn ướt) dùng 'be going to': are going to slip.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "I promise I ___ sort my rubbish from now on.", "options": ["A. am going to", "B. will", "C. sort", "D. sorts"], "answer": "B", "explain": "Lời hứa (promise) ở thời điểm nói dùng 'will', không dùng 'be going to'.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Teacher: What will you do to protect the environment? - Student: ___.", "options": ["A. I will start by sorting my rubbish at home.", "B. I will pollute more.", "C. Nothing. It is not my job.", "D. I don't care about the environment."], "answer": "A", "explain": "Câu trả lời tích cực và cụ thể: bắt đầu bằng việc phân loại rác tại nhà.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). E-waste is old phones, computers and batteries. It contains harmful chemicals that can pollute soil and water. Many people throw e-waste in normal bins, which is dangerous. Special collection points take e-waste and recycle its valuable parts safely.", "statements": ["a) E-waste includes old phones and batteries.", "b) E-waste is harmless.", "c) Throwing e-waste in normal bins is dangerous.", "d) Special points recycle e-waste safely."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: rác điện tử chứa hóa chất độc hại. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Some cities charge people for each bag of rubbish they throw away. This 'pay as you throw' rule makes people sort and recycle more. Critics say it is unfair to poor families. Supporters argue it is the fairest way because polluters pay for the waste they create.", "statements": ["a) Some cities charge per bag of rubbish.", "b) The rule encourages sorting and recycling.", "c) Everyone agrees the rule is perfect.", "d) Supporters say polluters should pay."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: trả tiền theo túi rác. b) Đúng. c) Sai: có người phản đối vì cho rằng bất công với gia đình nghèo. d) Đúng: ai gây ô nhiễm thì trả tiền.", "points": 1}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: If everyone ___ a reusable bottle, we would save millions of plastic bottles.", "answer": "carried", "explain": "Câu điều kiện loại 2 (giả định trái hiện tại): If + quá khứ đơn, would + V. Chủ ngữ 'everyone' số ít nên dùng 'carried'.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["natural resources", "tài nguyên thiên nhiên"], ["refillable", "có thể nạp lại"], ["chemical", "hóa chất"], ["sort", "phân loại"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["promise", "I", "will", "water", "save", "I"], "explain": "Câu đúng: I promise I will save water.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: The river near our village is getting dirtier every year. B: What is causing it? A: Factories dump waste into it, and people throw litter on the banks. B: That is awful. Can we do anything? A: Our youth union is going to organise a clean-up and report the factories. B: Count me in!", "sub_questions": [{"q": "What is polluting the river?", "options": ["Factory waste and litter", "Too many fish", "Heavy rain"], "answer": 0}, {"q": "What is the youth union going to do?", "options": ["Build a new factory", "Organise a clean-up and report the factories", "Move the village"], "answer": 1}], "explain": "Sông bị ô nhiễm do nhà máy xả thải và rác; đoàn thanh niên sẽ tổ chức dọn dẹp và báo cáo các nhà máy.", "points": 1}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'cl' is pronounced differently from the others.", "options": ["A. clear", "B. protect", "C. climate", "D. clean"], "answer": "B", "explain": "clear, climate, clean có 'cl' phát âm là /kl/, còn protect có 'pr' phát âm là /pr/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. paper", "B. exist", "C. water", "D. desert"], "answer": "B", "explain": "paper, water, desert (danh từ) nhấn âm tiết thứ nhất, còn exist nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "The government is trying to ___ the use of single-use plastics.", "options": ["A. cut down on", "B. cut down", "C. cut off on", "D. cut up on"], "answer": "A", "explain": "Cụm cố định 'cut down on' (cắt giảm) + danh từ: cut down on the use of...", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "A: I have a headache. B: I ___ get you some medicine.", "options": ["A. am going to", "B. will", "C. get", "D. gets"], "answer": "B", "explain": "Quyết định bộc phát ngay lúc nói dùng 'will'.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "I think it ___ rain soon. The sky is so dark.", "options": ["A. is going to", "B. will", "C. rains", "D. rain"], "answer": "B", "explain": "'I think' cho thấy đây là dự đoán theo ý kiến cá nhân nên dùng 'will', dù có dấu hiệu mây đen.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lan: Would you like to join our beach clean-up? - Nam: ___.", "options": ["A. I'd love to. Count me in!", "B. Beaches are sandy.", "C. I can't swim.", "D. Clean-ups are dirty."], "answer": "A", "explain": "Khi được mời tham gia dọn bãi biển, câu đáp tích cực là nhận lời nhiệt tình.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). National parks protect nature and wildlife. Visitors can hike, camp and watch animals, but they must follow rules: no littering, no fires and no loud noise. Rangers work hard to keep the parks clean and safe. Entrance fees help pay for this important work.", "statements": ["a) National parks protect nature and wildlife.", "b) Visitors can light fires anywhere.", "c) Rangers keep the parks clean and safe.", "d) Entrance fees support the parks' work."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: cấm đốt lửa (no fires). c) Đúng. d) Đúng: phí vào cửa chi trả công việc bảo vệ.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Fast fashion means cheap clothes that go out of style quickly. Making these clothes uses huge amounts of water and chemicals. Many end up in landfills after a few wears. Buying fewer, better-quality clothes and donating old ones are greener choices.", "statements": ["a) Fast fashion clothes last a very long time.", "b) Making fast fashion uses lots of water.", "c) Many fast fashion clothes end up in landfills.", "d) Donating old clothes is a greener choice."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: thời trang nhanh mau lỗi mốt, nhanh hỏng. b) Đúng: tốn nhiều nước và hóa chất. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: Air (pollute) ___ is a serious problem in big cities.", "answer": "pollution", "explain": "Cần danh từ ghép: air pollution (ô nhiễm không khí). 'pollute' là động từ.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["adopt", "áp dụng"], ["awareness", "sự nhận thức"], ["emission", "khí thải"], ["preserve", "bảo tồn"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["going", "We", "are", "not", "to", "use", "bags", "plastic"], "explain": "Câu đúng: We are not going to use plastic bags.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Grandpa, was the air cleaner when you were young? B: Much cleaner. There were fewer cars and factories. A: What changed? B: People bought more cars and built more factories. But now young people like you care about the environment. A: We are going to plant 100 trees this month! B: Wonderful. Your generation will save the planet.", "sub_questions": [{"q": "Why was the air cleaner in the past?", "options": ["Fewer cars and factories", "More trees only", "Less rain"], "answer": 0}, {"q": "What are the young people going to do?", "options": ["Buy more cars", "Plant 100 trees this month", "Close the factories"], "answer": 1}], "explain": "Không khí xưa sạch hơn vì ít xe và nhà máy; thế hệ trẻ sẽ trồng 100 cây trong tháng này.", "points": 1}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'gr' is pronounced differently from the others.", "options": ["A. place", "B. green", "C. great", "D. grow"], "answer": "A", "explain": "green, great, grow có 'gr' phát âm là /gr/, còn place có 'pl' phát âm là /pl/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. amount", "B. ticket", "C. pencil", "D. solar"], "answer": "A", "explain": "ticket, pencil, solar nhấn âm tiết thứ nhất, còn amount nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "We should buy products with ___ packaging to reduce waste.", "options": ["A. less", "B. fewer", "C. little", "D. few"], "answer": "A", "explain": "'packaging' là danh từ không đếm được nên dùng 'less': less packaging (ít bao bì hơn).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "They ___ the beach this Sunday. They have already prepared gloves and bags.", "options": ["A. will clean", "B. are going to clean", "C. clean", "D. cleans"], "answer": "B", "explain": "'have already prepared' cho thấy kế hoạch đã chuẩn bị nên dùng 'be going to': are going to clean.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "A: The tap is leaking. B: I ___ call the plumber right now.", "options": ["A. am going to", "B. will", "C. call", "D. calls"], "answer": "B", "explain": "Quyết định bộc phát ngay lúc nói (right now) dùng 'will'.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mum: Don't forget to sort the rubbish! - Child: ___.", "options": ["A. I won't, Mum. I promise.", "B. Sorting is boring.", "C. Rubbish smells.", "D. I forgot already."], "answer": "A", "explain": "Khi mẹ dặn phân loại rác, câu đáp phù hợp là hứa sẽ nhớ làm.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Bees are important for the environment. They pollinate flowers and crops, helping plants grow. However, bee numbers are falling because of chemicals and habitat loss. Planting wildflowers and avoiding chemicals can help protect bees.", "statements": ["a) Bees help plants grow by pollinating them.", "b) Bee numbers are rising fast.", "c) Chemicals harm bees.", "d) Planting wildflowers helps protect bees."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: ong thụ phấn giúp cây phát triển. b) Sai: số lượng ong đang giảm. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). A zero-waste lifestyle means sending nothing to landfills. Followers refuse single-use items, reduce what they buy, reuse containers and compost food scraps. It sounds hard, but they say it saves money and feels rewarding. Even starting with one change, like a reusable bottle, makes a difference.", "statements": ["a) Zero-waste means sending nothing to landfills.", "b) Followers buy more single-use items.", "c) They say zero-waste saves money.", "d) Starting with one small change helps."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: họ từ chối (refuse) đồ dùng một lần. c) Đúng: tiết kiệm tiền và thấy xứng đáng. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: The more trees we plant, the ___ our air will be.", "answer": "cleaner", "explain": "Cấu trúc so sánh kép 'The more..., the + so sánh hơn...': the cleaner (càng sạch hơn).", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["sustainable", "bền vững"], ["recycle", "tái chế"], ["eco-friendly", "thân thiện với môi trường"], ["carbon footprint", "dấu chân carbon"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["protect", "We", "must", "the", "environment", "now"], "explain": "Câu đúng: We must protect the environment now.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Our neighbourhood is going to have a Green Day next month. B: What will happen on Green Day? A: Everyone plants a tree, and shops give discounts on eco-friendly products. B: Sounds fun! Can students join? A: Yes! Your class can perform a play about saving water. B: We are going to start rehearsing tomorrow.", "sub_questions": [{"q": "What happens on Green Day?", "options": ["Everyone plants a tree", "Everyone buys a car", "Shops close all day"], "answer": 0}, {"q": "What will the students do?", "options": ["Perform a play about saving water", "Sell plastic bags", "Clean the shops"], "answer": 0}], "explain": "Ngày Xanh: mọi người trồng cây, cửa hàng giảm giá sản phẩm thân thiện môi trường; học sinh sẽ diễn kịch về tiết kiệm nước.", "points": 1}]}]}</script>
