{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'o' is pronounced differently from the others.","options":["A. organisation","B. support","C. report","D. promote"],"answer":"D","explain":"Trong organisation, support, report, chữ o đọc là /ɔː/; trong promote, chữ o đọc là /əʊ/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. organi'sation","B. partici'pation","C. communi'cation","D. eco'nomic"],"answer":"D","explain":"organisation, participation, communication nhấn âm 3 (trước -tion); economic nhấn âm 2 (trước -ic).","points":0.25},{"type":"mcq","level":"NB","q":"UNICEF is an international ___ that helps children around the world.","options":["A. shop","B. organisation","C. market","D. restaurant"],"answer":"B","explain":"organisation (tổ chức): UNICEF là tổ chức quốc tế giúp đỡ trẻ em.","points":0.25},{"type":"mcq","level":"TH","q":"UNICEF is one of the ___ organisations in the world.","options":["A. large","B. largest","C. larger","D. most large"],"answer":"B","explain":"So sánh nhất với tính từ ngắn: the + adj-est → the largest.","points":0.25},{"type":"mcq","level":"VD","q":"The European markets are usually ___ than the Asian markets.","options":["A. most competitive","B. competitive","C. more competitive","D. the most competitive"],"answer":"C","explain":"So sánh hơn với tính từ dài: more + adj + than → more competitive than.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"What does UNICEF do?\" B: \"___\"","options":["A. It supports disadvantaged children.","B. It sells clothes.","C. It plays football.","D. It builds cars."],"answer":"A","explain":"UNICEF hỗ trợ trẻ em thiệt thòi (supports disadvantaged children).","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["organisation","tổ chức"],["peacekeeping","gìn giữ hòa bình"],["investor","nhà đầu tư"],["support","hỗ trợ"],["trade .","points":1}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'i' is pronounced differently from the others.","options":["A. investor","B. rich","C. active","D. big"],"answer":"C","explain":"Trong investor, rich, big, chữ i đọc là /ɪ/; trong active, chữ i đọc là /æ/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. eco'nomic","B. ac'tivity","C. com'munity","D. inter'national"],"answer":"D","explain":"economic, activity, community nhấn âm 2; international nhấn âm 3.","points":0.25},{"type":"mcq","level":"NB","q":"The company will ___ a lot of money in our province.","options":["A. invest","B. eat","C. hide","D. waste"],"answer":"A","explain":"invest (đầu tư): công ty sẽ đầu tư nhiều tiền vào tỉnh ta.","points":0.25},{"type":"mcq","level":"TH","q":"Learning English is ___ learning Chinese for most students.","options":["A. easiest","B. easy","C. more easy","D. easier than"],"answer":"D","explain":"So sánh hơn với tính từ ngắn: adj-er + than → easier than.","points":0.25},{"type":"mcq","level":"VD","q":"Viet Nam is ___ now than 20 years ago.","options":["A. much more active","B. much most active","C. much active","D. more much active"],"answer":"A","explain":"much có thể đứng trước so sánh hơn để nhấn mạnh: much more active.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"What is the UN?\" B: \"___\"","options":["A. It is the United Nations.","B. It is a school.","C. It is a shop.","D. Goodbye."],"answer":"A","explain":"UN là viết tắt của United Nations (Liên Hợp Quốc).","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["promote","thúc đẩy"],["participant","người tham gia"],["develop","phát triển"],["economic","thuộc kinh tế"],["representative","đại diện"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["International","trade","helps","countries","develop"],"explain":"Câu đúng: International trade helps countries develop. (Thương mại quốc tế giúp các nước phát triển.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: What does WTO do, Dad? B: It is the World Trade Organisation. It helps countries trade with each other. A: When did Viet Nam join it? B: In 2007. Since then, our products are sold in many countries.","sub_questions":[{"q":"What is WTO?","options":["The World Trade Organisation","A school","A hospital"],"answer":0},{"q":"What does it do?","options":["It helps countries trade with each other","It teaches English","It builds houses"],"answer":0},{"q":"When did Viet Nam join the WTO?","options":["In 2007","In 1995","In 1977"],"answer":0}],"explain":"Nghe kỹ: WTO là Tổ chức Thương mại Thế giới; giúp các nước buôn bán; Việt Nam gia nhập năm 2007.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Peacekeeping forces are soldiers from many countries. They go to places with wars and help stop the fighting. They also help build schools and hospitals. Viet Nam sent its first peacekeeping force in 2014.","statements":["a) Peacekeeping forces come from many countries.","b) They help stop fighting.","c) They never help local people.","d) Viet Nam sent its first peacekeeping force in 2014."],"answer":["T","T","F","T"],"explain":"a) Đúng: soldiers from many countries. b) Đúng: help stop the fighting. c) Sai: họ giúp xây trường học, bệnh viện. d) Đúng: trong bài.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Small countries can benefit a lot from joining international organisations. They get help with money, experts and technology. However, they must also follow common rules. Viet Nam follows these rules and becomes a responsible member.","statements":["a) Small countries get no benefit from organisations.","b) They receive money, experts and technology.","c) Members must follow common rules.","d) Viet Nam is a responsible member."],"answer":["F","T","T","T"],"explain":"a) Sai: các nước nhỏ được lợi nhiều (benefit a lot). b) Đúng: trong bài. c) Đúng: follow common rules. d) Đúng: responsible member.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Viet Nam joined the World Trade Organisation in 2007","explain":"Đọc to, rõ ràng, chú ý: organisation /ˌɔːɡənaɪˈzeɪʃn/.","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'u' is pronounced differently from the others.","options":["A. run","B. support","C. much","D. just"],"answer":"B","explain":"Trong run, much, just, chữ u đọc là /ʌ/; trong support, chữ u đọc là /ɔː/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. organi'sation","B. partici'pation","C. edu'cation","D. de'velopment"],"answer":"D","explain":"organisation, participation, education nhấn âm 3 (trước -tion); development nhấn âm 2.","points":0.25},{"type":"mcq","level":"NB","q":"An ___ is a person who puts money into a business.","options":["A. investor","B. farmer","C. pilot","D. singer"],"answer":"A","explain":"investor (nhà đầu tư): người bỏ tiền vào kinh doanh.","points":0.25},{"type":"mcq","level":"TH","q":"This task is ___ than that one.","options":["A. more difficult","B. less difficult","C. difficulter","D. difficult"],"answer":"B","explain":"less + adj + than (kém hơn): less difficult than.","points":0.25},{"type":"mcq","level":"VD","q":"My presentation is ___ yours.","options":["A. as interesting as","B. more interesting","C. so interesting","D. more interesting than"],"answer":"D","explain":"So sánh hơn đầy đủ cần than: more interesting than yours.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Does UNICEF work in Viet Nam?\" B: \"___\"","options":["A. Yes, it has many projects here.","B. No, it doesn't.","C. I don't know.","D. Maybe."],"answer":"A","explain":"UNICEF có nhiều dự án tại Việt Nam (has many projects here).","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["organisation","tổ chức"],["invest","đầu tư"],["aim","mục tiêu"],["trade","thương mại"],["support","hỗ trợ"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Foreign","investors","create","jobs","for","people"],"explain":"Câu đúng: Foreign investors create jobs for people. (Các nhà đầu tư nước ngoài tạo việc làm cho người dân.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Lan, why do countries join the UN? B: To keep peace and help each other, I think. A: What is the UN's main aim? B: To make the world peaceful and fair. A: Is Viet Nam an active member? B: Yes, very active.","sub_questions":[{"q":"Why do countries join the UN?","options":["To keep peace and help each other","To play games","To sell products"],"answer":0},{"q":"What is the UN's main aim?","options":["To make the world peaceful and fair","To build schools","To win wars"],"answer":0},{"q":"Is Viet Nam active in the UN?","options":["Yes, very active","No","A little"],"answer":0}],"explain":"Nghe kỹ: các nước gia nhập UN để giữ hòa bình; mục tiêu chính là thế giới hòa bình, công bằng; Việt Nam rất năng động.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Experts from international organisations often visit Viet Nam. They give advice on health, education and farming. Their knowledge helps our country develop faster. Vietnamese experts also work in other countries.","statements":["a) Foreign experts visit Viet Nam.","b) They give advice on health and education.","c) Their help makes Viet Nam develop slower.","d) Vietnamese experts work abroad too."],"answer":["T","T","F","T"],"explain":"a) Đúng: often visit Viet Nam. b) Đúng: health, education and farming. c) Sai: giúp phát triển nhanh hơn (faster). d) Đúng: work in other countries.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Tourism brings money to Viet Nam, but too many tourists can harm famous places. The government wants to develop tourism without harming nature. International organisations help train local guides. Responsible tourism protects both culture and the environment.","statements":["a) Tourism brings money to Viet Nam.","b) Too many tourists never cause problems.","c) Organisations help train local guides.","d) Responsible tourism protects culture and nature."],"answer":["T","F","T","T"],"explain":"a) Đúng: brings money. b) Sai: quá đông du khách có thể gây hại (can harm). c) Đúng: help train local guides. d) Đúng: protects both culture and the environment.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Foreign investors build factories in Viet Nam","explain":"Đọc to, rõ ràng, chú ý: investors, factories.","points":1}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letters 'ea' are pronounced differently from the others.","options":["A. peacekeeping","B. peace","C. deal","D. health"],"answer":"D","explain":"Trong peacekeeping, peace, deal, ea đọc là /iː/; trong health, ea đọc là /e/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. ac'tivity","B. possi'bility","C. commu'nity","D. 'television"],"answer":"D","explain":"activity, possibility, community nhấn âm 2 (trước -ity); television nhấn âm 1.","points":0.25},{"type":"mcq","level":"NB","q":"UNICEF supports the most ___ children in the world.","options":["A. disadvantaged","B. happy","C. rich","D. tall"],"answer":"A","explain":"disadvantaged (thiệt thòi): UNICEF hỗ trợ trẻ em thiệt thòi nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Ho Chi Minh City is one of ___ cities in Viet Nam.","options":["A. busier","B. busy","C. the busiest","D. more busy"],"answer":"C","explain":"So sánh nhất: the + adj-est → the busiest.","points":0.25},{"type":"mcq","level":"VD","q":"This is ___ problem we have ever faced.","options":["A. the more difficult","B. the most difficult","C. difficulter","D. more difficult"],"answer":"B","explain":"So sánh nhất với tính từ dài: the most + adj → the most difficult.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"What does ASEAN do?\" B: \"___\"","options":["A. It helps members develop and keep peace.","B. It sells tickets.","C. It makes films.","D. I don't like it."],"answer":"A","explain":"ASEAN giúp các thành viên phát triển và giữ hòa bình.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["peacekeeping","gìn giữ hòa bình"],["disadvantaged","thiệt thòi"],["competitive","cạnh tranh"],["responsible","có trách nhiệm"],["participant","người tham gia"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["We","should","protect","the","environment"],"explain":"Câu đúng: We should protect the environment. (Chúng ta nên bảo vệ môi trường.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Dad, what is an investor? B: An investor is a person who puts money into a business. A: Why do investors come to Viet Nam? B: Because our economy is growing fast and workers are skilful. A: Is that good for us? B: Yes, they create many jobs.","sub_questions":[{"q":"What is an investor?","options":["A person who puts money into a business","A teacher","A doctor"],"answer":0},{"q":"Why do investors come to Viet Nam?","options":["The economy is growing fast","The weather is nice","Food is cheap"],"answer":0},{"q":"Is foreign investment good for Viet Nam?","options":["Yes, it creates many jobs","No","Not sure"],"answer":0}],"explain":"Nghe kỹ: nhà đầu tư là người bỏ tiền kinh doanh; đến Việt Nam vì kinh tế tăng trưởng nhanh; tạo nhiều việc làm.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). International organisations often give money to build schools in poor areas. New schools help more children go to class. Teachers get better training too. Education gives children a better future.","statements":["a) Organisations help build schools in poor areas.","b) New schools help children go to class.","c) Teachers get worse training.","d) Education gives children a better future."],"answer":["T","T","F","T"],"explain":"a) Đúng: give money to build schools. b) Đúng: help more children go to class. c) Sai: giáo viên được đào tạo tốt hơn (better training). d) Đúng: a better future.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). In 1977 Viet Nam joined the United Nations. In 1995 it joined ASEAN. In 2007 it joined the WTO. Each step made Viet Nam more active in the world. Today our country is a responsible member of many organisations.","statements":["a) Viet Nam joined the UN in 1977.","b) Viet Nam joined ASEAN in 1975.","c) Viet Nam joined the WTO in 2007.","d) Viet Nam is a responsible member today."],"answer":["T","F","T","T"],"explain":"a) Đúng: trong bài. b) Sai: gia nhập ASEAN năm 1995. c) Đúng: trong bài. d) Đúng: responsible member.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"ASEAN has ten member countries","explain":"Đọc to, rõ ràng, chú ý: ASEAN /ˈɑːsiæn/, member.","points":1}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letters 'ed' are pronounced differently from the others.","options":["A. developed","B. helped","C. supported","D. worked"],"answer":"C","explain":"Trong developed, helped, worked, ed đọc là /t/; trong supported, ed đọc là /ɪd/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. organi'sation","B. partici'pation","C. communi'cation","D. de'velopment"],"answer":"D","explain":"organisation, participation, communication nhấn âm 3 (trước -tion); development nhấn âm 2.","points":0.25},{"type":"mcq","level":"NB","q":"This organisation ___ projects to help poor people.","options":["A. runs","B. eats","C. drinks","D. paints"],"answer":"A","explain":"run projects (triển khai dự án): tổ chức này triển khai dự án giúp người nghèo.","points":0.25},{"type":"mcq","level":"TH","q":"Life in the city is ___ life in the country.","options":["A. expensiver than","B. more expensive than","C. expensive","D. most expensive"],"answer":"B","explain":"So sánh hơn với tính từ dài: more + adj + than → more expensive than.","points":0.25},{"type":"mcq","level":"VD","q":"Of the three organisations, the UN is ___.","options":["A. the oldest","B. older","C. the older","D. oldest"],"answer":"A","explain":"So sánh nhất: the + adj-est → the oldest.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"What does WTO stand for?\" B: \"___\"","options":["A. World Trade Organisation.","B. A football team.","C. A big shop.","D. I don't know."],"answer":"A","explain":"WTO là viết tắt của World Trade Organisation (Tổ chức Thương mại Thế giới).","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["aim","mục tiêu"],["economy","nền kinh tế"],["active","năng động"],["invest","đầu tư"],["trade","thương mại"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Viet","Nam","sends","peacekeeping","forces","abroad"],"explain":"Câu đúng: Viet Nam sends peacekeeping forces abroad. (Việt Nam gửi lực lượng gìn giữ hòa bình ra nước ngoài.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Mum, what does UNICEF mean? B: It means United Nations Children's Fund. A: What does it do? B: It helps children go to school and stay healthy. A: I want to help too! B: You can join our school charity club.","sub_questions":[{"q":"What does UNICEF mean?","options":["United Nations Children's Fund","A football club","A big company"],"answer":0},{"q":"What does UNICEF do?","options":["It helps children go to school and stay healthy","It sells toys","It builds roads"],"answer":0},{"q":"What can the boy do?","options":["Join the school charity club","Stay at home","Play games"],"answer":0}],"explain":"Nghe kỹ: UNICEF là Quỹ Nhi đồng Liên Hợp Quốc; giúp trẻ em đi học và khỏe mạnh; bạn nhỏ có thể tham gia câu lạc bộ từ thiện.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Charity clubs in schools collect old books and clothes for poor children. Students also teach small children to read. These small actions make poor children's lives better. Everyone can help in some way.","statements":["a) Charity clubs collect books and clothes.","b) Students teach small children to read.","c) Small actions cannot help anyone.","d) Everyone can help in some way."],"answer":["T","T","F","T"],"explain":"a) Đúng: collect old books and clothes. b) Đúng: teach small children to read. c) Sai: small actions make lives better. d) Đúng: trong bài.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Some people think international organisations only help poor countries. In fact, rich countries also benefit. They sell more products and find new friends. Helping each other makes the whole world better and safer.","statements":["a) Organisations only help poor countries.","b) Rich countries sell more products through organisations.","c) Countries find new friends in organisations.","d) Helping each other makes the world better."],"answer":["F","T","T","T"],"explain":"a) Sai: các nước giàu cũng được lợi. b) Đúng: sell more products. c) Đúng: find new friends. d) Đúng: better and safer.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Peacekeeping forces help stop wars","explain":"Đọc to, rõ ràng, chú ý: peacekeeping /ˈpiːskiːpɪŋ/.","points":1}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 's' is pronounced differently from the others.","options":["A. aims","B. runs","C. joins","D. supports"],"answer":"D","explain":"Trong aims, runs, joins, s đọc là /z/; trong supports, s đọc là /s/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. inter'national","B. repre'sentative","C. disad'vantage","D. e'conomic"],"answer":"D","explain":"international, representative, disadvantage nhấn âm 3; economic nhấn âm 2 (trước -ic).","points":0.25},{"type":"mcq","level":"NB","q":"International ___ helps countries sell products to each other.","options":["A. trade","B. game","C. song","D. film"],"answer":"A","explain":"trade (thương mại): thương mại quốc tế giúp các nước bán sản phẩm cho nhau.","points":0.25},{"type":"mcq","level":"TH","q":"Today, Viet Nam is ___ it was 30 years ago.","options":["A. richest","B. rich","C. richer than","D. more rich"],"answer":"C","explain":"So sánh hơn với tính từ ngắn: adj-er + than → richer than.","points":0.25},{"type":"mcq","level":"VD","q":"She is ___ student in our class.","options":["A. intelligenter","B. the most intelligent","C. most intelligent","D. the more intelligent"],"answer":"B","explain":"So sánh nhất với tính từ dài: the most + adj → the most intelligent.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Is Viet Nam a member of ASEAN?\" B: \"___\"","options":["A. Yes, it joined in 1995.","B. No, it isn't.","C. I hate it.","D. Goodbye."],"answer":"A","explain":"Việt Nam gia nhập ASEAN năm 1995 (joined in 1995).","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["organisation","tổ chức"],["peacekeeping","gìn giữ hòa bình"],["investor","nhà đầu tư"],["disadvantaged","thiệt thòi"],["competitive","cạnh tranh"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["The","WTO","helps","countries","trade","together"],"explain":"Câu đúng: The WTO helps countries trade together. (WTO giúp các nước buôn bán với nhau.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: What are the UN's main jobs, teacher? B: To keep peace and help countries develop. A: Does the UN help Viet Nam? B: Yes. It helps with education, health and the environment.","sub_questions":[{"q":"What are the UN's main jobs?","options":["To keep peace and help countries develop","To play football","To sell cars"],"answer":0},{"q":"Does the UN help Viet Nam?","options":["Yes","No","Sometimes"],"answer":0},{"q":"What does it help with?","options":["Education, health and the environment","Sports only","Nothing"],"answer":0}],"explain":"Nghe kỹ: nhiệm vụ chính của UN là giữ hòa bình và giúp các nước phát triển; giúp Việt Nam về giáo dục, y tế, môi trường.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Many Vietnamese students study abroad with scholarships from international organisations. They learn new knowledge and skills. After finishing, most of them return to help develop Viet Nam.","statements":["a) Vietnamese students get scholarships to study abroad.","b) They learn nothing new.","c) Most return to help Viet Nam.","d) Organisations never give scholarships."],"answer":["T","F","T","F"],"explain":"a) Đúng: scholarships from international organisations. b) Sai: learn new knowledge and skills. c) Đúng: return to help develop Viet Nam. d) Sai: trái với nội dung bài.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). English is the most popular language in international organisations. People from different countries use English to work together. That is why Vietnamese students should learn English well. Good English helps them find better jobs in the future.","statements":["a) English is widely used in international organisations.","b) People use English to work together.","c) Vietnamese students should not learn English.","d) Good English helps find better jobs."],"answer":["T","T","F","T"],"explain":"a) Đúng: the most popular language. b) Đúng: use English to work together. c) Sai: nên học tiếng Anh giỏi. d) Đúng: find better jobs.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"English helps us work with other countries","explain":"Đọc to, rõ ràng, chú ý: English, countries.","points":1}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letters 'ch' are pronounced differently from the others.","options":["A. charity","B. children","C. change","D. school"],"answer":"D","explain":"Trong charity, children, change, ch đọc là /tʃ/; trong school, ch đọc là /k/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. Chi'nese","B. Japa'nese","C. Vietna'mese","D. 'English"],"answer":"D","explain":"Chinese, Japanese, Vietnamese nhấn âm cuối; English nhấn âm 1.","points":0.25},{"type":"mcq","level":"NB","q":"We should ___ our economy to develop faster.","options":["A. promote","B. hide","C. break","D. forget"],"answer":"A","explain":"promote (thúc đẩy): chúng ta nên thúc đẩy kinh tế để phát triển nhanh hơn.","points":0.25},{"type":"mcq","level":"TH","q":"This road is ___ that one.","options":["A. wider than","B. widest","C. wide","D. more wide"],"answer":"A","explain":"So sánh hơn với tính từ ngắn: adj-er + than → wider than.","points":0.25},{"type":"mcq","level":"VD","q":"He is ___ player in the team.","options":["A. the better","B. good","C. the best","D. better"],"answer":"C","explain":"So sánh nhất của good là the best.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"What does UNDP stand for?\" B: \"___\"","options":["A. United Nations Development Programme.","B. A big market.","C. A football club.","D. I don't care."],"answer":"A","explain":"UNDP là viết tắt của United Nations Development Programme.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["support","hỗ trợ"],["responsible","có trách nhiệm"],["participant","người tham gia"],["develop","phát triển"],["economic","thuộc kinh tế"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Members","work","together","for","peace"],"explain":"Câu đúng: Members work together for peace. (Các thành viên cùng hợp tác vì hòa bình.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Lan, have you ever met a foreign expert? B: Yes. An English expert taught at my school last year. A: What did he teach? B: He taught us how to protect the environment.","sub_questions":[{"q":"Has Lan met a foreign expert?","options":["Yes","No","Maybe"],"answer":0},{"q":"What did he teach?","options":["How to protect the environment","Maths","Football"],"answer":0},{"q":"When did he teach at her school?","options":["Last year","Last month","Yesterday"],"answer":0}],"explain":"Nghe kỹ: Lan đã gặp chuyên gia người Anh; ông dạy cách bảo vệ môi trường; dạy ở trường cô năm ngoái.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Viet Nam often holds international meetings in Ha Noi. Leaders from many countries come to discuss peace and trade. These meetings help Viet Nam make more friends. They also bring tourists to our country.","statements":["a) Viet Nam holds international meetings in Ha Noi.","b) Leaders discuss peace and trade.","c) Meetings help Viet Nam make friends.","d) Meetings bring no tourists."],"answer":["T","T","T","F"],"explain":"a) Đúng: trong bài. b) Đúng: discuss peace and trade. c) Đúng: make more friends. d) Sai: bring tourists to our country.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). To become a good member of international organisations, Viet Nam must keep its promises. It should also help poorer countries when it can. A responsible member always follows common rules. Other countries will then trust and respect Viet Nam more.","statements":["a) Viet Nam must keep its promises.","b) Viet Nam should never help other countries.","c) A responsible member follows common rules.","d) Other countries will trust Viet Nam more."],"answer":["T","F","T","T"],"explain":"a) Đúng: keep its promises. b) Sai: nên giúp các nước nghèo hơn. c) Đúng: follows common rules. d) Đúng: trust and respect Viet Nam more.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Viet Nam is a responsible member of the UN","explain":"Đọc to, rõ ràng, chú ý: responsible /rɪˈspɒnsəbl/.","points":1}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'g' is pronounced differently from the others.","options":["A. organisation","B. change","C. general","D. giant"],"answer":"A","explain":"Trong change, general, giant, g đọc là /dʒ/; trong organisation, g đọc là /ɡ/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. engi'neer","B. volun'teer","C. pio'neer","D. 'doctor"],"answer":"D","explain":"engineer, volunteer, pioneer nhấn âm cuối (-eer); doctor nhấn âm 1.","points":0.25},{"type":"mcq","level":"NB","q":"An ___ has a lot of knowledge about a subject.","options":["A. expert","B. baby","C. stranger","D. guest"],"answer":"A","explain":"expert (chuyên gia): người có nhiều kiến thức về một lĩnh vực.","points":0.25},{"type":"mcq","level":"TH","q":"The Mekong is ___ river in Southeast Asia.","options":["A. longer","B. the longest","C. long","D. more long"],"answer":"B","explain":"So sánh nhất: the + adj-est → the longest.","points":0.25},{"type":"mcq","level":"VD","q":"That was ___ day of my life!","options":["A. the happier","B. happy","C. happier","D. the happiest"],"answer":"D","explain":"So sánh nhất: the + adj-est → the happiest.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Do you know UNICEF?\" B: \"___\"","options":["A. Yes, it helps children.","B. No, I hate it.","C. Goodbye.","D. I'm tired."],"answer":"A","explain":"Trả lời: Yes, it helps children (UNICEF giúp đỡ trẻ em).","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["harm","tổn hại"],["promote","thúc đẩy"],["representative","đại diện"],["aim","mục tiêu"],["economy","nền kinh tế"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Helping","each","other","makes","the","world","better"],"explain":"Câu đúng: Helping each other makes the world better. (Giúp đỡ lẫn nhau làm thế giới tốt đẹp hơn.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: What do you want to do in the future, Minh? B: I want to work for an international organisation. A: Why? B: Because I want to help poor children. A: That's great! You should learn English well.","sub_questions":[{"q":"What does Minh want to do?","options":["Work for an international organisation","Become a doctor","Be a pilot"],"answer":0},{"q":"Why?","options":["He wants to help poor children","He wants money","He likes travelling"],"answer":0},{"q":"What should he do?","options":["Learn English well","Play games","Watch TV"],"answer":0}],"explain":"Nghe kỹ: Minh muốn làm cho tổ chức quốc tế; để giúp trẻ em nghèo; nên học tiếng Anh giỏi.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Learning about other countries helps us understand the world better. We learn about their food, festivals and traditions. International organisations also bring countries closer. A peaceful world is good for everyone.","statements":["a) Learning about other countries helps us understand the world.","b) We learn about food and festivals.","c) Organisations bring countries closer.","d) A peaceful world is bad for everyone."],"answer":["T","T","T","F"],"explain":"a) Đúng: understand the world better. b) Đúng: food, festivals and traditions. c) Đúng: bring countries closer. d) Sai: thế giới hòa bình tốt cho mọi người.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Some factories invest a lot of money but harm rivers and air. Local people get sick from polluted water. The government asks these factories to use clean technology. Development must not harm people's health.","statements":["a) Some factories harm rivers and air.","b) Polluted water makes people sick.","c) The government wants clean technology.","d) Development should harm people's health."],"answer":["T","T","T","F"],"explain":"a) Đúng: harm rivers and air. b) Đúng: get sick from polluted water. c) Đúng: use clean technology. d) Sai: phát triển không được gây hại sức khỏe.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"We should help disadvantaged children","explain":"Đọc to, rõ ràng, chú ý: disadvantaged, children.","points":1}]}]}
