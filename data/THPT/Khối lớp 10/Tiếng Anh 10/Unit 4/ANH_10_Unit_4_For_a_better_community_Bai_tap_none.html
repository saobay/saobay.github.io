.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["thankful", "biết ơn"], ["delighted", "vui mừng"], ["tiring", "mệt mỏi"], ["exciting", "hào hứng"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["broke", "He", "while", "was", "playing", "leg", "his", "he"], "explain": "Câu đúng: He broke his leg while he was playing.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Mum, our class is raising money for flood victims. B: That's wonderful. How much is your target? A: Two million dong. We are going to sell handmade cards. B: I will buy five cards. Can I donate extra money too? A: Of course! Every dong counts. B: I am proud of your class.", "sub_questions": [{"q": "What is the class target?", "options": ["One million dong", "Two million dong", "Five million dong"], "answer": 1}, {"q": "How will they raise money?", "options": ["By selling handmade cards", "By washing cars", "By performing"], "answer": 0}], "explain": "Lớp đặt mục tiêu 2 triệu đồng giúp nạn nhân lũ lụt bằng cách bán thiệp handmade.", "points": 1}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ed' is pronounced differently from the others.", "options": ["A. stopped", "B. washed", "C. donated", "D. worked"], "answer": "C", "explain": "stopped, washed, worked có 'ed' phát âm là /t/, còn donated có 'ed' phát âm là /ɪd/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. conduct (n)", "B. object (n)", "C. increase (n)", "D. reject (v)"], "answer": "D", "explain": "conduct, object, increase là danh từ nhấn âm tiết thứ nhất, còn reject là động từ nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Many ___ people in our town joined the clean-up campaign.", "options": ["A. kind-hearted", "B. cold-hearted", "C. hard-hearted", "D. faint-hearted"], "answer": "A", "explain": "kind-hearted people (người tốt bụng) tham gia chiến dịch dọn dẹp.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "I ___ my keys while I was cleaning the room.", "options": ["A. found", "B. was finding", "C. find", "D. am finding"], "answer": "A", "explain": "Hành động ngắn xen vào (tìm thấy chìa khóa) dùng quá khứ đơn: found.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "They ___ the old bridge when the storm came.", "options": ["A. repaired", "B. were repairing", "C. repair", "D. are repairing"], "answer": "B", "explain": "Hành động đang diễn ra (dài) khi bão đến: were repairing.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hoa: I feel tired after the volunteer trip. - Lan: ___.", "options": ["A. But it was worth it, right?", "B. Trips are boring.", "C. You should stay home.", "D. Tired is bad."], "answer": "A", "explain": "Khi bạn mệt sau chuyến tình nguyện, câu đáp đồng cảm phù hợp là 'But it was worth it, right?'", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). A soup kitchen gives free meals to homeless people. Volunteers cook and serve food every evening. Last winter, our school's cooking club helped at a soup kitchen for a week. The experience taught us to appreciate what we have.", "statements": ["a) A soup kitchen gives free meals to homeless people.", "b) Volunteers work there every evening.", "c) The cooking club helped for a month.", "d) The experience taught them gratitude."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: câu lạc bộ nấu ăn giúp trong một tuần (a week). d) Đúng: biết trân trọng những gì mình có.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Some people argue that volunteering is a waste of time. However, research proves the opposite. Volunteers gain work experience, which helps their future careers. Companies also prefer hiring people with volunteer experience. In short, giving time can be an investment in yourself.", "statements": ["a) Everyone agrees volunteering is useful.", "b) Volunteers gain work experience.", "c) Companies prefer hiring volunteers.", "d) Volunteering can be an investment in yourself."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: một số người cho rằng tình nguyện lãng phí thời gian. b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: While we (talk) ___ about the plan, the teacher came in.", "answer": "were talking", "explain": "Hành động đang diễn ra (dài) dùng quá khứ tiếp diễn: were talking; hành động xen vào dùng quá khứ đơn: came.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["apply", "nộp đơn"], ["interact", "tương tác"], ["development", "sự phát triển"], ["community", "cộng đồng"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["was", "It", "raining", "left", "when", "we"], "explain": "Câu đúng: It was raining when we left.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Why do you spend every Sunday at the nursing home? B: The old people there have no family nearby. A: Don't you feel bored? B: Not at all. Mrs Lan tells amazing stories about the old days. A: What do you do there? B: We chat, read newspapers and sometimes cook together. A: You are doing a great thing.", "sub_questions": [{"q": "Why does the boy visit the nursing home?", "options": ["To earn money", "Because the old people have no family nearby", "Because his grandma lives there"], "answer": 1}, {"q": "What does he do there?", "options": ["Chat, read newspapers and cook together", "Clean the rooms only", "Give medical care"], "answer": 0}], "explain": "Cậu bé đến viện dưỡng lão vì các cụ không có gia đình gần bên; cậu trò chuyện, đọc báo và nấu ăn cùng họ.", "points": 1}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ed' is pronounced differently from the others.", "options": ["A. cleaned", "B. collected", "C. volunteered", "D. played"], "answer": "B", "explain": "cleaned, volunteered, played có 'ed' phát âm là /d/, còn collected có 'ed' phát âm là /ɪd/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. desert (v)", "B. content (v)", "C. permit (v)", "D. record (n)"], "answer": "D", "explain": "desert, content, permit là động từ nhấn âm tiết thứ hai, còn record là danh từ nhấn âm tiết thứ nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "The charity provides food and shelter for ___ people.", "options": ["A. homeless", "B. homely", "C. home", "D. homesick"], "answer": "A", "explain": "homeless people (người vô gia cư) được tổ chức từ thiện cung cấp thức ăn và chỗ ở.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "When the earthquake happened, we ___ in the classroom.", "options": ["A. studied", "B. were studying", "C. study", "D. are studying"], "answer": "B", "explain": "Hành động đang diễn ra (dài) khi động đất xảy ra: were studying.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "She ___ TV when her friend called yesterday evening.", "options": ["A. watched", "B. was watching", "C. watches", "D. is watching"], "answer": "B", "explain": "Hành động đang diễn ra (dài) thì bị xen vào: was watching (dài) - called (ngắn).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nam: Let's donate our old books to the village library. - Mai: ___.", "options": ["A. Great idea! I'll pack mine tonight.", "B. Books are heavy.", "C. Villages are far.", "D. I need my books."], "answer": "A", "explain": "Khi được rủ quyên góp sách cũ, câu đáp tích cực là đồng ý và hẹn đóng gói sách tối nay.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Last year, floods hit the central provinces of Vietnam. Thousands of volunteers brought food and clothes to victims. Students collected donations at schools. The whole country joined hands to help. The victims were deeply grateful.", "statements": ["a) Floods hit the central provinces last year.", "b) Volunteers brought food to victims.", "c) Students collected donations at schools.", "d) Nobody helped the victims."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cả nước chung tay giúp đỡ.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Volunteer tourism is travelling to help communities. Tourists teach, build houses or protect wildlife. Critics say some programmes do more harm than good when untrained volunteers do skilled jobs. Supporters reply that well-run programmes truly help. Choosing a responsible organisation is key.", "statements": ["a) Volunteer tourism combines travel and helping.", "b) All volunteer programmes are perfect.", "c) Untrained volunteers can cause harm.", "d) Choosing a responsible organisation matters."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: có chương trình gây hại nhiều hơn lợi. c) Đúng: tình nguyện viên không được đào tạo làm việc chuyên môn có thể gây hại. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: He (wear) ___ a strange hat at the party last night.", "answer": "wore", "explain": "'last night' là dấu hiệu quá khứ đơn; 'wear' là động từ bất quy tắc: wear - wore - worn.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["kind-hearted", "tốt bụng"], ["homeless", "vô gia cư"], ["rewarding", "đáng giá"], ["noble", "cao thượng"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["were", "While", "walking", "we", "it", "to", "snow", "began"], "explain": "Câu đúng: While we were walking, it began to snow.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Our volunteer club needs a leader for the winter clothes drive. B: What does the leader do? A: Plan the schedule, collect clothes and contact the village. B: That sounds like a lot of work. A: It is, but it is rewarding. Will you do it? B: Hmm... I am busy with exams. Can I help with collecting clothes only? A: Of course! Every bit helps.", "sub_questions": [{"q": "What does the club need?", "options": ["More money", "A leader for the winter clothes drive", "New members"], "answer": 1}, {"q": "What will the girl help with?", "options": ["Planning the schedule", "Collecting clothes only", "Contacting the village"], "answer": 1}], "explain": "Câu lạc bộ cần trưởng nhóm cho đợt quyên góp áo ấm; cô gái bận thi nên chỉ giúp thu gom quần áo.", "points": 1}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ed' is pronounced differently from the others.", "options": ["A. visited", "B. helped", "C. started", "D. needed"], "answer": "B", "explain": "visited, started, needed có 'ed' phát âm là /ɪd/, còn helped có 'ed' phát âm là /t/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. increase (n)", "B. present (n)", "C. object (v)", "D. progress (n)"], "answer": "C", "explain": "increase, present, progress là danh từ nhấn âm tiết thứ nhất, còn object là động từ nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Volunteering can be a very ___ experience for young people.", "options": ["A. rewarding", "B. boring", "C. tiring", "D. disappointing"], "answer": "A", "explain": "rewarding experience (trải nghiệm đáng giá) cho người trẻ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "The phone rang while she ___ dinner.", "options": ["A. cooked", "B. was cooking", "C. cooks", "D. is cooking"], "answer": "B", "explain": "Hành động đang diễn ra (dài): was cooking; hành động xen vào (ngắn): rang.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "She ___ asleep while she was reading the report.", "options": ["A. fell", "B. was falling", "C. falls", "D. is falling"], "answer": "A", "explain": "Hành động ngắn xen vào (ngủ thiếp đi) dùng quá khứ đơn; 'fall' là động từ bất quy tắc: fall - fell - fallen.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lan: I want to help flood victims. What can I do? - Nam: ___.", "options": ["A. You can donate clothes or join a clean-up team.", "B. Floods are scary.", "C. Stay home and watch TV.", "D. Victims need help."], "answer": "A", "explain": "Khi bạn muốn giúp nạn nhân lũ lụt, gợi ý cụ thể là quyên góp quần áo hoặc tham gia đội dọn dẹp.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Teaching poor children to read is a noble job. Every weekend, Mai goes to a poor neighbourhood and teaches kids for free. At first, the children were shy, but now they love her lessons. Mai says teaching gives her life more meaning.", "statements": ["a) Teaching poor children is noble.", "b) Mai teaches for free every weekend.", "c) The children hated her lessons.", "d) Teaching gives Mai's life more meaning."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: lúc đầu các em nhút nhát, giờ rất thích bài học của cô. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Many companies now encourage staff to volunteer. They give workers paid days off for charity work. Studies show these workers are happier and more loyal. Communities also benefit from skilled help. It is a win-win situation for everyone.", "statements": ["a) Companies encourage staff to volunteer.", "b) Workers get paid days off for charity.", "c) Volunteering workers are happier.", "d) Nobody benefits from company volunteering."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: đây là tình huống đôi bên cùng có lợi (win-win).", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: She is excited ___ (join) the volunteer club.", "answer": "to join", "explain": "Cấu trúc 'be excited to do something' (háo hức làm gì): excited to join.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["shelter", "nơi trú ẩn"], ["victim", "nạn nhân"], ["award", "giải thưởng"], ["spirit", "tinh thần"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["was", "While", "I", "home", "walking", "it", "rained"], "explain": "Câu đúng: While I was walking home, it rained.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Did you hear about the new community garden? B: Yes! Volunteers turned an empty lot into a garden. A: What do they grow there? B: Vegetables and flowers. Poor families get free vegetables. A: That's amazing. Can anyone join? B: Yes. They meet every Sunday morning. A: I am going to join next week!", "sub_questions": [{"q": "What did volunteers create?", "options": ["A playground", "A community garden", "A library"], "answer": 1}, {"q": "Who gets free vegetables?", "options": ["Rich families", "Poor families", "Restaurants"], "answer": 1}], "explain": "Tình nguyện viên biến bãi đất trống thành vườn cộng đồng; gia đình nghèo được nhận rau miễn phí.", "points": 1}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ed' is pronounced differently from the others.", "options": ["A. raised", "B. shared", "C. sorted", "D. joined"], "answer": "C", "explain": "raised, shared, joined có 'ed' phát âm là /d/, còn sorted có 'ed' phát âm là /ɪd/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. record (v)", "B. present (v)", "C. conduct (v)", "D. desert (n)"], "answer": "D", "explain": "record, present, conduct là động từ nhấn âm tiết thứ hai, còn desert là danh từ nhấn âm tiết thứ nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "The ___ of the new community centre will benefit everyone.", "options": ["A. opening", "B. closing", "C. painting", "D. locking"], "answer": "A", "explain": "opening (lễ khai trương) trung tâm cộng đồng mới mang lợi ích cho mọi người.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "While Tim ___ for jobs, he found a volunteer position.", "options": ["A. searched", "B. was searching", "C. searches", "D. is searching"], "answer": "B", "explain": "Hành động đang diễn ra (dài): was searching; hành động xen vào (ngắn): found.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "The children ___ noise while their mother was working.", "options": ["A. made", "B. were making", "C. make", "D. are making"], "answer": "B", "explain": "Hành động đang diễn ra song song (dài) trong quá khứ dùng quá khứ tiếp diễn: were making.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mum: You look tired, son. - Son: ___.", "options": ["A. I spent all day helping at the charity fair, Mum.", "B. Tired people sleep.", "C. Fairs are noisy.", "D. I'm fine, don't ask."], "answer": "A", "explain": "Khi mẹ hỏi sao trông mệt, câu trả lời giải thích hợp lý là đã giúp ở hội chợ từ thiện cả ngày.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). A charity fair was held at our school last month. Students sold handmade items and second-hand books. All the money went to poor students in mountain areas. The fair raised over five million dong.", "statements": ["a) A charity fair was held last month.", "b) Students sold handmade items.", "c) The money went to rich students.", "d) The fair raised over five million dong."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: tiền giúp học sinh nghèo vùng núi. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Critics of volunteering say young people should focus on studying. They fear volunteering takes time away from school. However, studies show volunteers often do better at school. Volunteering teaches time management, which helps both study and life.", "statements": ["a) Critics think students should focus on studying.", "b) They fear volunteering wastes study time.", "c) Studies show volunteers do worse at school.", "d) Volunteering teaches time management."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: nghiên cứu cho thấy tình nguyện viên học tốt hơn. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: He (not go) ___ to the meeting yesterday.", "answer": "did not go", "explain": "Câu phủ định quá khứ đơn: did not + động từ nguyên thể. 'yesterday' là dấu hiệu quá khứ đơn.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["flood", "lũ lụt"], ["earthquake", "động đất"], ["storm", "bão"], ["drought", "hạn hán"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["was", "They", "playing", "when", "arrived", "we", "chess"], "explain": "Câu đúng: They were playing chess when we arrived.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: I am writing an application letter for a volunteer programme. B: What programme? A: Teaching English in a mountain village for a month. B: That sounds tough. Are you sure? A: Yes. I want to do something meaningful before university. B: I admire you. Can I join too? A: Let's apply together!", "sub_questions": [{"q": "What is the girl applying for?", "options": ["A music course", "Teaching English in a mountain village", "A university scholarship"], "answer": 1}, {"q": "Why does she want to do it?", "options": ["To earn money", "To do something meaningful before university", "To travel for fun"], "answer": 1}], "explain": "Cô gái viết đơn tham gia dạy tiếng Anh ở làng miền núi một tháng vì muốn làm điều ý nghĩa trước khi vào đại học.", "points": 1}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ed' is pronounced differently from the others.", "options": ["A. donated", "B. washed", "C. stopped", "D. worked"], "answer": "A", "explain": "washed, stopped, worked có 'ed' phát âm là /t/, còn donated có 'ed' phát âm là /ɪd/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. content (n)", "B. permit (n)", "C. reject (n)", "D. increase (v)"], "answer": "D", "explain": "content, permit, reject là danh từ nhấn âm tiết thứ nhất, còn increase là động từ nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "We should show ___ to people who help our community.", "options": ["A. gratitude", "B. attitude", "C. altitude", "D. multitude"], "answer": "A", "explain": "gratitude (lòng biết ơn) với những người giúp đỡ cộng đồng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "While we ___ about the plan, the teacher came in.", "options": ["A. talked", "B. were talking", "C. talk", "D. are talking"], "answer": "B", "explain": "Hành động đang diễn ra (dài): were talking; hành động xen vào (ngắn): came.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "I ___ my grandmother when the lights went out last night.", "options": ["A. visited", "B. was visiting", "C. visit", "D. am visiting"], "answer": "B", "explain": "Hành động đang diễn ra (dài) thì bị xen vào: was visiting (dài) - went out (ngắn).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tom: Shall we clean up the park this Sunday? - Jerry: ___.", "options": ["A. Sure! I'll bring gloves and bags.", "B. Parks are big.", "C. Sundays are busy.", "D. Cleaning is hard."], "answer": "A", "explain": "Khi được rủ dọn công viên, câu đáp tích cực là đồng ý và chuẩn bị dụng cụ.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Donating old clothes is a simple way to help. Many charities collect clothes and give them to poor families. Before donating, wash the clothes and check they are still usable. Your old jacket could keep someone warm this winter.", "statements": ["a) Donating old clothes helps poor families.", "b) Charities give collected clothes to poor families.", "c) You should donate dirty, broken clothes.", "d) An old jacket can keep someone warm."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: nên giặt sạch và kiểm tra quần áo còn dùng được trước khi quyên góp. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). A study followed two groups of teenagers for a year. One group volunteered weekly; the other did not. The volunteers reported higher happiness and better grades. Researchers conclude that giving time to others also gives back to yourself.", "statements": ["a) The study followed two groups for a year.", "b) One group volunteered weekly.", "c) Volunteers reported lower happiness.", "d) Giving time also gives back to yourself."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: tình nguyện viên báo cáo hạnh phúc hơn và điểm cao hơn. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the verb in brackets: The volunteers (arrive) ___ just in time to help.", "answer": "arrived", "explain": "Hành động đã hoàn thành trong quá khứ, dùng quá khứ đơn: arrived.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["volunteer", "tình nguyện viên"], ["raise", "gây (quỹ)"], ["remote", "xa xôi"], ["benefit", "lợi ích"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["was", "She", "when", "sleeping", "rang", "phone", "the"], "explain": "Câu đúng: She was sleeping when the phone rang.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Our school won the best volunteer group award! B: Really? What did you do? A: We taught free English classes for poor children all year. B: That's impressive. How many children joined? A: Over 100. Some can now speak basic English. B: You should be proud. A: We are! We are going to do it again next year.", "sub_questions": [{"q": "What award did the school win?", "options": ["Best sports team", "Best volunteer group", "Best music club"], "answer": 1}, {"q": "What did they do?", "options": ["Taught free English classes all year", "Built a new school", "Raised one billion dong"], "answer": 0}], "explain": "Trường đoạt giải nhóm tình nguyện xuất sắc nhờ dạy tiếng Anh miễn phí cho trẻ em nghèo cả năm.", "points": 1}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'ed' is pronounced differently from the others.", "options": ["A. played", "B. wanted", "C. cleaned", "D. raised"], "answer": "B", "explain": "played, cleaned, raised có 'ed' phát âm là /d/, còn wanted có 'ed' phát âm là /ɪd/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. object (n)", "B. desert (n)", "C. present (v)", "D. progress (n)"], "answer": "C", "explain": "object, desert, progress là danh từ nhấn âm tiết thứ nhất, còn present là động từ nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "The concert raised a lot of money for ___.", "options": ["A. charity", "B. profit", "C. business", "D. trade"], "answer": "A", "explain": "'raise money for charity' (gây quỹ từ thiện).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "They ___ football when it began to rain heavily.", "options": ["A. played", "B. were playing", "C. play", "D. are playing"], "answer": "B", "explain": "Hành động đang diễn ra (dài): were playing; hành động xen vào (ngắn): began.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "While I ___ home, I saw a volunteer team cleaning the beach.", "options": ["A. walked", "B. was walking", "C. walk", "D. am walking"], "answer": "B", "explain": "Hành động đang diễn ra (dài): was walking; hành động xen vào (ngắn): saw.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Linda: Our charity concert is next week. Can you help? - Peter: ___.", "options": ["A. Of course! What should I do?", "B. Concerts are fun.", "C. Next week is busy.", "D. I can't sing."], "answer": "A", "explain": "Khi được nhờ giúp buổi hòa nhạc từ thiện, câu đáp phù hợp là đồng ý và hỏi cần làm gì.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Plantin  trip to the mountains? B: Amazing, but tiring. We built two classrooms in five days. A: Wow! Did the local people help? B: Yes, they cooked for us every day. A: What was the best part? B: Seeing the children's smiles on the first day of school. A: I want to join next time!", "sub_questions": [{"q": "What did they build?", "options": ["Two classrooms", "A bridge", "A hospital"], "answer": 0}, {"q": "What was the best part?", "options": ["The food", "Seeing the children's smiles on the first school day", "The mountain view"], "answer": 1}], "explain": "Họ xây 2 phòng học trong 5 ngày; điều tuyệt nhất là nụ cười của trẻ em ngày đầu đến trường.", "points": 1}]}]}</script>
