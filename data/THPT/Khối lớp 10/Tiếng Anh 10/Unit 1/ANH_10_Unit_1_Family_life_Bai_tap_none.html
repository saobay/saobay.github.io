, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). In my family, we share the household chores. My dad does the heavy lifting and mops the floor. My mum does the cooking and does the laundry. My brother and I take out the rubbish and water the plants.", "statements": ["a) The writer's family share the household chores.", "b) The writer's dad does the cooking.", "c) The writer's mum does the laundry.", "d) The writer waters the plants with his brother."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: 'we share the household chores'. b) Sai: bố làm việc nặng và lau nhà, mẹ mới nấu ăn. c) Đúng: 'My mum does the laundry'. d) Đúng: 'My brother and I water the plants'.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Anna is the breadwinner in her family. She works as a doctor at a big hospital. Her husband, Tom, is a homemaker. He does most of the household chores: he cooks, cleans the house and takes care of their two children. They both think sharing chores makes their family happier.", "statements": ["a) Anna earns money to support her family.", "b) Tom works at a big hospital.", "c) Tom does most of the household chores.", "d) They think sharing chores is a waste of time."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: Anna là breadwinner. b) Sai: Anna mới làm bác sĩ ở bệnh viện lớn. c) Đúng. d) Sai: họ cho rằng chia sẻ việc nhà làm gia đình hạnh phúc hơn.", "points": 1}, {"type": "short", "level": "TH", "q": "Fill in the blank with ONE word: My dad usually ___ the heavy lifting in our family.", "answer": "does", "explain": "'do the heavy lifting' là cụm cố định; diễn tả thói quen nên dùng hiện tại đơn, chủ ngữ số ít 'My dad' nên dùng 'does'.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["homemaker", "người nội trợ"], ["breadwinner", "người trụ cột gia đình"], ["chore", "việc nhà"], ["gratitude", "lòng biết ơn"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["is", "My", "dinner", "cooking", "mother", "now"], "explain": "Câu đúng: My mother is cooking dinner now.", "points": 1}, {"type": "listening", "level": "TH", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: What are you doing, Mai? B: I am doing the laundry, Mum. A: Good. After that, can you water the plants? B: Sure, Mum.", "sub_questions": [{"q": "What is Mai doing?", "options": ["Doing the laundry", "Cooking dinner", "Mopping the floor"], "answer": 0}, {"q": "What does Mum ask Mai to do next?", "options": ["Take out the rubbish", "Water the plants", "Lay the table"], "answer": 1}], "explain": "Nghe kỹ đoạn hội thoại để trả lời: Mai đang giặt quần áo, mẹ nhờ tưới cây sau đó.", "points": 1}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'cr' is pronounced differently from the others.", "options": ["A. crash", "B. cry", "C. bread", "D. cross"], "answer": "C", "explain": "crash, cry, cross có 'cr' phát âm là /kr/, còn bread có 'br' phát âm là /br/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. equal", "B. value", "C. create", "D. grateful"], "answer": "C", "explain": "equal, value, grateful nhấn âm tiết thứ nhất, còn create nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "My father is the ___ of our family. He goes to work to earn money.", "options": ["A. homemaker", "B. breadwinner", "C. member", "D. guest"], "answer": "B", "explain": "breadwinner (người trụ cột) là người đi làm kiếm tiền nuôi gia đình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Listen! Someone ___ at the door.", "options": ["A. knocks", "B. is knocking", "C. knock", "D. are knocking"], "answer": "B", "explain": "'Listen!' cho thấy hành động đang diễn ra ngay lúc nói nên dùng thì hiện tại tiếp diễn: is knocking.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "She ___ to school by bus every morning.", "options": ["A. is going", "B. go", "C. goes", "D. are going"], "answer": "C", "explain": "'every morning' là dấu hiệu của thói quen nên dùng hiện tại đơn; chủ ngữ 'She' số ít nên động từ thêm 's': goes.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dad: Thank you for cleaning your room. It looks spotlessly clean! - Lan: ___.", "options": ["A. You are welcome, Dad.", "B. I hate cleaning.", "C. My room is small.", "D. No, it is dirty."], "answer": "A", "explain": "Khi được cảm ơn, câu đáp lịch sự là 'You are welcome'.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Mr Lam is a breadwinner. He works in a factory from Monday to Friday. His wife, Mrs Lam, is a homemaker. She does the washing-up, sweeps the floor and takes care of their baby. Their son, Minh, helps by laying the table for meals.", "statements": ["a) Mr Lam earns money for his family.", "b) Mrs Lam works in a factory.", "c) Mrs Lam does the washing-up.", "d) Minh helps lay the table for meals."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: Mr Lam là breadwinner. b) Sai: Mr Lam làm ở nhà máy, vợ ông là homemaker. c) Đúng. d) Đúng: Minh giúp dọn bàn ăn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Doing household chores is good for children. It teaches them responsibility and life skills. Children who share chores often feel proud of helping their parents. Experts say parents should give children small tasks like watering plants or folding clothes.", "statements": ["a) Doing chores teaches children responsibility.", "b) Children who share chores feel ashamed.", tr/, còn brown có 'br' phát âm là /br/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. rubbish", "B. teenager", "C. enjoy", "D. member"], "answer": "C", "explain": "rubbish, teenager, member nhấn âm tiết thứ nhất, còn enjoy nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "We should divide the household chores ___. Everyone in the family should do a part.", "options": ["A. equally", "B. equal", "C. equality", "D. equalize"], "answer": "A", "explain": "Cần trạng từ bổ nghĩa cho động từ 'divide': equally (một cách công bằng).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "At the moment, my mum ___ lunch in the kitchen.", "options": ["A. prepares", "B. is preparing", "C. prepare", "D. are preparing"], "answer": "B", "explain": "'At the moment' là dấu hiệu của hành động đang diễn ra nên dùng hiện tại tiếp diễn: is preparing.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Water ___ at 100 degrees Celsius.", "options": ["A. is boiling", "B. boil", "C. boils", "D. are boiling"], "answer": "C", "explain": "Đây là sự thật hiển nhiên nên dùng hiện tại đơn; chủ ngữ 'Water' số ít nên dùng 'boils'.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hoa: Mum, I have finished mopping the floor. - Mum: ___.", "options": ["A. Well done! Thank you, dear.", "B. The floor is dirty.", "C. Go to your room now.", "D. I do not believe you."], "answer": "A", "explain": "Khi con làm xong việc nhà, mẹ nên khen ngợi và cảm ơn: 'Well done! Thank you, dear.'", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Linh lives with her parents and her younger brother. Every evening, Linh helps her mum cook dinner while her brother lays the table. After dinner, Linh does the washing-up and her brother takes out the rubbish. They always do their chores happily.", "statements": ["a) Linh lives with her grandparents.", "b) Linh helps her mum cook dinner.", "c) Her brother takes out the rubbish after dinner.", "d) They do their chores happily."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: Linh sống với bố mẹ và em trai. b) Đúng. c) Đúng. d) Đúng: 'They always do their chores happily'.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Many teenagers think household chores are boring, but they bring many benefits. Doing chores helps teenagers learn time management and become more independent. It also gives them a chance to bond with family members. Parents feel happy when their children share the housework.", "statements": ["a) All teenagers love doing household chores.", "b) Doing chores helps teenagers become more independent.", "c) Chores give teenagers a chance to bond with family.", "d) Parents feel unhappy when children share the housework."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: nhiều thanh thiếu niên thấy việc nhà nhàm chán. b) Đúng: học quản lý thời gian và tự lập hơn. c) Đúng: cơ hội gắn kết với gia đình. d) Sai: bố mẹ cảm thấy vui khi con chia sẻ việc nhà.", "points": 1}, {"type": "short", "level": "VD", "q": "Give the correct form of the word in brackets: Look! He (wash) ___ the car in the yard.", "answer": "is washing", "explain": "'Look!' cho thấy hành động đang diễn ra nên dùng hiện tại tiếp diễn: is washing.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["heavy lifting", "việc nặng nhọc"], ["groceries", "đồ tạp hóa"], ["bond", "sự gắn kết"], ["character", "tính cách"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["does", "He", "morning", "the", "every", "laundry"], "explain": "Câu đúng: He does the laundry every morning.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: You look tired, Minh. What have you been doing? B: I have been cleaning the whole house since morning. A: Why did you do all that alone? B: Mum is sick, so I wanted to help her. A: That is very kind of you.", "sub_questions": [{"q": "Why is Minh tired?", "options": ["He has been cleaning the house all morning", "He played football all morning", "He stayed up late last night"], "answer": 0}, {"q": "Why did Minh do all the housework alone?", "options": ["Because he likes cleaning", "Because his mum is sick", "Because his dad asked him to"], "answer": 1}], "explain": "Suy luận từ hội thoại: Minh mệt vì dọn cả nhà từ sáng; cậu làm một mình vì mẹ bị ốm nên muốn giúp mẹ.", "points": 1}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'br' is pronounced differently from the others.", "options": ["A. brush", "B. brave", "C. crane", "D. brother"], "answer": "C", "explain": "brush, brave, brother có 'br' phát âm là /br/, còn crane có 'cr' phát âm là /kr/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. repeat", "B. breadwinner", "C. homemaker", "D. character"], "answer": "A", "explain": "breadwinner, homemaker, character nhấn âm tiết thứ nhất, còn repeat nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Doing the ___ is my favourite chore because I love clean clothes.", "options": ["A. laundry", "B. rubbish", "C. lifting", "D. cooking"], "answer": "A", "explain": "'do the laundry' (giặt quần áo) liên quan đến quần áo sạch.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "My parents ___ to work at 7 a.m. every day.", "options": ["A. is going", "B. goes", "C. go", "D. are going"], "answer": "C", "explain": "'every day' là dấu hiệu thói quen nên dùng hiện tại đơn; chủ ngữ số nhiều 'My parents' nên dùng 'go'.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "I ___ what you mean. You do not need to explain again.", "options": ["A. am understanding", "B. understand", "C. understands", "D. is understanding"], "answer": "B", "explain": "'understand' là động từ chỉ trạng thái (stative verb), không dùng ở thì tiếp diễn. Chủ ngữ 'I' nên dùng 'understand'.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Brother: I am too tired to take out the rubbish. - Sister: ___.", "options": ["A. Let me do it for you.", "B. The rubbish smells bad.", "C. You are lazy.", "D. I am tired too, so no."], "answer": "A", "explain": "Khi anh trai mệt, câu đáp phù hợp là đề nghị giúp: 'Let me do it for you.'", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Read the passage and decide whether the statements are True (T) or False (F). Family values are important in Vietnamese culture. Children learn to respect their parents and grandparents. They also learn to share household chores from a young age. These values help keep the family bonds strong.", "statements": ["a) Family values are important in Vietnamese culture.", "b) Children learn to respect their parents.", "c) Children start sharing chores when they grow up.", "d) Family values help keep family bonds strong."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: trẻ học kính trọng bố mẹ, ông bà. c) Sai: trẻ học chia sẻ việc nhà từ nhỏ (from a young age). d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). In some families, only women do the household chores. However, experts believe this is unfair. When men share the chores, women have more time to rest and work. Children also learn that housework is everyone's responsibility, not just women's work.", "statements": ["a) In some families, only women do the chores.", "b) Experts think it is fair that only women do chores.", "c) Sharing chores gives women more time to rest.", "d) Children learn housework is everyone's responsibility."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: chuyên gia cho rằng điều đó là không công bằng (unfair). c) Đúng. d) Đúng: việc nhà là trách nhiệm của mọi người.", "points": 1}, {"type": "short", "level": "VD", "q": "Give the correct form of the word in brackets: She (not like) ___ doing the washing-up.", "answer": "does not like", "explain": "Diễn tả sở thích chung nên dùng hiện tại đơn; chủ ngữ 'She' số ít, câu phủ định nên dùng 'does not like'.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["spotlessly", "sạch bóng"], ["teenager", "thanh thiếu niên"], ["value", "giá trị"], ["truthful", "trung thực"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["are", "sharing", "We", "chores", "the", "household"], "explain": "Câu đúng: We are sharing the household chores.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Mum, can I go out with my friends this afternoon? B: Have you finished your homework and cleaned your room? A: My homework is done, but I have not cleaned my room yet. B: Then you know the rule: chores first, fun later. A: OK, I will clean it right now.", "sub_questions": [{"q": "What is the family rule?", "options": ["Fun first, chores later", "Chores first, fun later", "No chores at weekends"], "answer": 1}, {"q": "What will the boy do now?", "options": ["Go out with friends", "Clean his room", "Do his homework"], "answer": 1}], "explain": "Quy tắc gia đình là 'việc nhà trước, vui chơi sau'; cậu bé sẽ dọn phòng ngay bây giờ rồi mới đi chơi.", "points": 1}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'tr' is pronounced differently from the others.", "options": ["A. travel", "B. cry", "C. trust", "D. try"], "answer": "B", "explain": "travel, trust, try có 'tr' phát âm là /tr/, còn cry có 'cr' phát âm là /kr/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. children", "B. brother", "C. sister", "D. forget"], "answer": "D", "explain": "children, brother, sister nhấn âm tiết thứ nhất, còn forget nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Please take out the ___. The bin is full.", "options": ["A. rubbish", "B. laundry", "C. groceries", "D. dinner"], "answer": "A", "explain": "'take out the rubbish' (đổ rác); thùng rác (bin) đã đầy.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "My brother ___ his room at the moment, so he cannot go out.", "options": ["A. cleans", "B. is cleaning", "C. clean", "D. are cleaning"], "answer": "B", "explain": "'at the moment' là dấu hiệu hành động đang diễn ra nên dùng hiện tại tiếp diễn: is cleaning.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "The train ___ at 6 o'clock every morning.", "options": ["A. leaves", "B. is leaving", "C. leave", "D. are leaving"], "answer": "A", "explain": "Lịch trình cố định (timetables) dùng thì hiện tại đơn dù nói về tương lai; chủ ngữ số ít nên dùng 'leaves'.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lan: I am doing the washing-up. Could you dry the dishes for me? - Mai: ___.", "options": ["A. No problem. Give them to me.", "B. I hate dry dishes.", "C. The dishes are white.", "D. Washing-up is boring."], "answer": "A", "explain": "Khi được nhờ giúp đỡ, câu đáp phù hợp là đồng ý: 'No problem. Give them to me.'", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). A recent survey asked 500 teenagers about household chores. About 70 percent said they help with chores every day. Washing the dishes and taking out the rubbish are the most common tasks. However, only 30 percent help with cooking. The survey shows that most teenagers are willing to share housework.", "statements": ["a) 500 teenagers took part in the survey.", "b) Most teenagers never help with chores.", "c) Cooking is less common than washing dishes among teenagers.", "d) Most teenagers are willing to share housework."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: khảo sát 500 thanh thiếu niên. b) Sai: 70% giúp việc nhà mỗi ngày. c) Đúng: chỉ 30% giúp nấu ăn, ít hơn rửa bát và đổ rác. d) Đúng: hầu hết sẵn sàng chia sẻ việc nhà.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Mr Hung used to do no housework at all. After attending a workshop on family life, he changed his mind. Now he cooks dinner three times a week and helps his children with homework. His wife says their marriage is happier than ever. Mr Hung believes small changes can make a big difference.", "statements": ["a) Mr Hung never did any housework in the past.", "b) A workshop changed his attitude to housework.", "c) His wife thinks their marriage is worse now.", "d) Mr Hung believes small changes matter."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: 'used to do no housework at all'. b) Đúng: hội thảo về đời sống gia đình làm ông thay đổi suy nghĩ. c) Sai: vợ ông nói hôn nhân hạnh phúc hơn bao giờ hết. d) Đúng: thay đổi nhỏ tạo khác biệt lớn.", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: This soup (taste) ___ too salty. Did you add too much salt?", "answer": "tastes", "explain": "'taste' là động từ chỉ trạng thái, không dùng thì tiếp diễn; nhận xét chung ở hiện tại nên dùng hiện tại đơn: tastes.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["washing-up", "rửa bát đĩa"], ["mop", "lau nhà"], ["fold", "gấp (quần áo)"], ["appreciate", "đánh giá cao"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["is", "She", "plants", "watering", "the", "moment", "the", "at"], "explain": "Câu đúng: She is watering the plants at the moment.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Why are you angry with your brother? B: He never helps with the chores. Yesterday I asked him to mop the floor, but he played games instead. A: Did you talk to him about it? B: Yes, and he promised to help from now on. A: Good. Give him a chance.", "sub_questions": [{"q": "Why is the girl angry with her brother?", "options": ["He broke her toy", "He never helps with the chores", "He ate her cake"], "answer": 1}, {"q": "What did the brother promise?", "options": ["To play fewer games", "To help with chores from now on", "To mop the floor yesterday"], "answer": 1}], "explain": "Cô gái giận vì em trai không bao giờ giúp việc nhà; cậu em hứa sẽ giúp đỡ từ nay về sau.", "points": 1}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'cr' is pronounced differently from the others.", "options": ["A. crack", "B. cream", "C. train", "D. create"], "answer": "C", "explain": "crack, cream, create có 'cr' phát âm là /kr/, còn train có 'tr' phát âm là /tr/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. honest", "B. prepare", "C. dinner", "D. mother"], "answer": "B", "explain": "honest, dinner, mother nhấn âm tiết thứ nhất, còn prepare nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "She showed her ___ by cooking a big meal for her parents.", "options": ["A. rubbish", "B. gratitude", "C. chore", "D. laundry"], "answer": "B", "explain": "gratitude (lòng biết ơn) thể hiện qua việc nấu bữa ăn lớn cho bố mẹ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Be quiet! My baby brother ___.", "options": ["A. sleeps", "B. is sleeping", "C. sleep", "D. are sleeping"], "answer": "B", "explain": "'Be quiet!' cho thấy hành động đang diễn ra ngay lúc nói nên dùng hiện tại tiếp diễn: is sleeping.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "My mum ___ dinner now. Can you call back later?", "options": ["A. cooks", "B. is cooking", "C. cook", "D. are cooking"], "answer": "B", "explain": "'now' là dấu hiệu hành động đang diễn ra nên dùng hiện tại tiếp diễn: is cooking.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Son: Dad, the rubbish bin is full. - Dad: ___.", "options": ["A. Could you take it out, please?", "B. Rubbish is dirty.", "C. Buy a new bin.", "D. I took it out yesterday, not you."], "answer": "A", "explain": "Khi thùng rác đầy, bố nhờ con đổ rác một cách lịch sự: 'Could you take it out, please?'", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Doing chores together can be fun. Last Sunday, the Nguyen family cleaned the house together. Mr Nguyen mopped the floors while Mrs Nguyen washed the windows. Their daughter, Hoa, dusted the furniture and their son, Nam, watered the plants. They finished in two hours and then had lunch together.", "statements": ["a) The Nguyen family cleaned the house together last Sunday.", "b) Mrs Nguyen mopped the floors.", "c) Hoa dusted the furniture.", "d) They had lunch before cleaning the house."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: ông Nguyễn lau nhà, bà Nguyễn lau cửa sổ. c) Đúng. d) Sai: họ ăn trưa sau khi dọn xong.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Studies show that children who do chores from an early age tend to be more successful as adults. They learn to manage time, solve problems and work with others. In contrast, children who never help at home may struggle with basic life skills later. Therefore, giving children chores is an investment in their future.", "statements": ["a) Children who do chores early tend to be more successful later.", "b) Chores help children learn time management.", "c) Children who never help at home always fail as adults.", "d) Giving children chores is an investment in their future."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: học quản lý thời gian, giải quyết vấn đề. c) Sai: đoạn văn nói 'may struggle' (có thể gặp khó khăn), không phải 'always fail'. d) Đúng.", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: My brother (not mind) ___ washing the dishes.", "answer": "does not mind", "explain": "'mind' là động từ chỉ cảm xúc, diễn tả thái độ chung nên dùng hiện tại đơn; chủ ngữ số ít 'My brother', câu phủ định nên dùng 'does not mind'.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["dust", "quét bụi"], ["sweep", "quét nhà"], ["iron", "là (quần áo)"], ["benefit", "lợi ích"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["takes", "He", "rubbish", "the", "out", "evening", "every"], "explain": "Câu đúng: He takes the rubbish out every evening.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Mum, I am going to Nam's house to play games. B: Wait! Did you feed the cat yet? A: Oh, I forgot. I will do it now. B: And do not forget to take out the rubbish on your way out. A: OK, Mum. I will remember this time.", "sub_questions": [{"q": "What did the boy forget to do?", "options": ["Feed the cat", "Do his homework", "Clean his room"], "answer": 0}, {"q": "What must he do on his way out?", "options": ["Buy some food", "Take out the rubbish", "Lock the door"], "answer": 1}], "explain": "Cậu bé quên cho mèo ăn; mẹ dặn đổ rác trên đường ra ngoài.", "points": 1}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'br' is pronounced differently from the others.", "options": ["A. trick", "B. branch", "C. bread", "D. brick"], "answer": "A", "explain": "branch, bread, brick có 'br' phát âm là /br/, còn trick có 'tr' phát âm là /tr/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. study", "B. table", "C. begin", "D. laundry"], "answer": "C", "explain": "study, table, laundry nhấn âm tiết thứ nhất, còn begin nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Parents should teach children to be ___ for what they have.", "options": ["A. grateful", "B. gratefully", "C. gratitude", "D. ungrateful"], "answer": "A", "explain": "Sau 'to be' cần tính từ: grateful (biết ơn).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Currently, my sister ___ for her final exams, so she cannot help with chores.", "options": ["A. studies", "B. is studying", "C. study", "D. are studying"], "answer": "B", "explain": "'Currently' là dấu hiệu hành động tạm thời đang diễn ra nên dùng hiện tại tiếp diễn: is studying.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "I ___ to playing football on Sundays. It is my favourite hobby.", "options": ["A. am used", "B. used", "C. use", "D. am using"], "answer": "A", "explain": "Cấu trúc 'be used to + V-ing' (đã quen với việc gì). 'used to + V' diễn tả thói quen trong quá khứ, không phù hợp ở đây.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Minh: Would you like to help me wash the car? - Nam: ___.", "options": ["A. Sorry, I am busy now. Maybe later.", "B. Cars are expensive.", "C. I washed my hands.", "D. No, I like dirty cars."], "answer": "A", "explain": "Từ chối lời nhờ giúp đỡ một cách lịch sự: xin lỗi, bận và hẹn lúc khác.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). The Tran family has an interesting rule: everyone cooks one dinner per week. On Mondays, Mr Tran cooks. On Tuesdays, Mrs Tran cooks. Their teenage son cooks on Wednesdays and their daughter cooks on Thursdays. From Friday to Sunday, they eat out or order food. This rule helps everyone learn cooking skills.", "statements": ["a) Everyone in the Tran family cooks one dinner a week.", "b) Mr Tran cooks on Tuesdays.", "c) The daughter cooks on Thursdays.", "d) They never eat out."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: ông Trần nấu thứ Hai, bà Trần nấu thứ Ba. c) Đúng. d) Sai: cuối tuần họ ăn ngoài hoặc đặt đồ ăn.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Psychologists say that saying 'thank you' for small chores matters. When parents thank children for helping, children feel valued and are more willing to help again. A simple 'thank you' can strengthen family bonds more than expensive gifts. Gratitude, they conclude, is the glue that holds families together.", "statements": ["a) Saying 'thank you' for small chores is unimportant.", "b) Thanked children feel valued and help more willingly.", "c) A 'thank you' can strengthen family bonds.", "d) Expensive gifts hold families together better than gratitude."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: nói cảm ơn việc nhỏ rất quan trọng (matters). b) Đúng. c) Đúng. d) Sai: lòng biết ơn gắn kết gia đình tốt hơn quà đắt tiền.", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: She is very (responsibility) ___; she always finishes her chores on time.", "answer": "responsible", "explain": "Sau 'is very' cần tính từ: responsible (có trách nhiệm). 'responsibility' là danh từ.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["survey", "cuộc khảo sát"], ["split", "chia sẻ"], ["strengthen", "tăng cường"], ["homemaker", "người nội trợ"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["usually", "She", "groceries", "the", "does", "weekend", "at"], "explain": "Câu đúng: She usually does the groceries at the weekend.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Dad, why do I have to do chores? None of my friends do. B: That is not true. Most of your friends help at home. Besides, chores teach you useful skills. A: Like what? B: Like cooking, cleaning and managing your time. You will thank me one day. A: Maybe you are right.", "sub_questions": [{"q": "What does the boy think about his friends?", "options": ["They all do chores", "None of them do chores", "They love doing chores"], "answer": 1}, {"q": "What skills do chores teach, according to Dad?", "options": ["Playing games and singing", "Cooking, cleaning and time management", "Driving and swimming"], "answer": 1}], "explain": "Cậu bé nghĩ bạn bè không ai làm việc nhà; bố nói việc nhà dạy nấu ăn, dọn dẹp và quản lý thời gian.", "points": 1}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'tr' is pronounced differently from the others.", "options": ["A. trash", "B. trouble", "C. crowd", "D. tree"], "answer": "C", "explain": "trash, trouble, tree có 'tr' phát âm là /tr/, còn crowd có 'cr' phát âm là /kr/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. arrange", "B. water", "C. garden", "D. market"], "answer": "A", "explain": "water, garden, market nhấn âm tiết thứ nhất, còn arrange nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "The sense of ___ holds our family together through difficult times.", "options": ["A. responsible", "B. responsibility", "C. respond", "D. responsive"], "answer": "B", "explain": "Sau 'sense of' cần danh từ: responsibility (trách nhiệm).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "My dad ___ the lawn every Sunday morning. It is his favourite chore.", "options": ["A. is mowing", "B. mow", "C. mows", "D. are mowing"], "answer": "C", "explain": "'every Sunday morning' là dấu hiệu thói quen nên dùng hiện tại đơn; chủ ngữ 'My dad' số ít nên dùng 'mows'.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "This picture ___ my family on our holiday last year.", "options": ["A. is showing", "B. shows", "C. show", "D. are showing"], "answer": "B", "explain": "'show' là động từ chỉ trạng thái, không dùng thì tiếp diễn; chủ ngữ 'This picture' số ít nên dùng 'shows'.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Anna: Thanks for helping me with the heavy lifting! - Ben: ___.", "options": ["A. Do not mention it. Happy to help!", "B. Heavy things are bad.", "C. You should do it alone.", "D. I am strong."], "answer": "A", "explain": "Đáp lại lời cảm ơn một cách thân thiện: 'Do not mention it. Happy to help!'", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). In Japan, children learn to do chores at school as well as at home. Students clean their classrooms, serve lunch and water the school garden. Teachers believe this teaches respect and teamwork. Many parents in other countries admire this tradition.", "statements": ["a) Japanese children do chores only at home.", "b) Students clean their classrooms.", "c) Teachers believe chores teach respect and teamwork.", "d) Parents in other countries admire this tradition."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: trẻ Nhật làm việc nhà cả ở trường lẫn ở nhà. b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Equal sharing of chores is still a dream in many households. A study found that women spend twice as much time on housework as men, even when both work full-time. Experts suggest making a chore list and dividing tasks fairly. They also advise couples to talk openly about what feels unfair.", "statements": ["a) Equal sharing of chores is common in all households.", "b) Women spend more time on housework than men.", "c) Experts suggest dividing tasks fairly with a chore list.", "d) Couples should avoid talking about unfair chores."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: chia sẻ công bằng vẫn chỉ là mơ ước ở nhiều gia đình. b) Đúng: phụ nữ dành gấp đôi thời gian làm việc nhà. c) Đúng: lập danh sách và chia việc công bằng. d) Sai: nên trao đổi thẳng thắn về điều bất công.", "points": 1}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: Doing chores ___ children learn responsibility and independence.", "answer": "helps", "explain": "Chủ ngữ 'Doing chores' (việc làm việc nhà) là danh động từ số ít, động từ chính chia số ít: helps. Câu mang nghĩa chung nên dùng hiện tại đơn.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["breadwinner", "người trụ cột gia đình"], ["equally", "một cách công bằng"], ["gratitude", "lòng biết ơn"], ["chore", "việc nhà"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["parents", "My", "the", "divide", "equally", "chores"], "explain": "Câu đúng: My parents divide the chores equally.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: I am worried about my son. He spends all day on his phone and never helps at home. B: Have you tried giving him specific tasks? A: I just tell him to help, but he does nothing. B: Be specific. Ask him to take out the rubbish every evening. Small clear tasks work better. A: I will try that tonight.", "sub_questions": [{"q": "What is the mother worried about?", "options": ["Her son never helps at home", "Her son eats too much", "Her son fails at school"], "answer": 0}, {"q": "What advice does the friend give?", "options": ["Take away his phone", "Give him small specific tasks", "Let him do whatever he wants"], "answer": 1}], "explain": "Người mẹ lo vì con trai không bao giờ giúp việc nhà; bạn khuyên giao việc nhỏ, cụ thể.", "points": 1}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'cr' is pronounced differently from the others.", "options": ["A. cross", "B. crowd", "C. crash", "D. brother"], "answer": "D", "explain": "cross, crowd, crash có 'cr' phát âm là /kr/, còn brother có 'br' phát âm là /br/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. happy", "B. morning", "C. paper", "D. decide"], "answer": "D", "explain": "happy, morning, paper nhấn âm tiết thứ nhất, còn decide nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "A strong family ___ is built on love, respect and shared responsibilities.", "options": ["A. bond", "B. bind", "C. boundary", "D. band"], "answer": "A", "explain": "'family bond' (sự gắn kết gia đình) được xây dựng trên tình yêu và sự tôn trọng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Shh! The children ___ their homework in the next room.", "options": ["A. do", "B. are doing", "C. does", "D. is doing"], "answer": "B", "explain": "'Shh!' cho thấy hành động đang diễn ra ngay lúc nói nên dùng hiện tại tiếp diễn; chủ ngữ số nhiều nên dùng 'are doing'.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "The chef ___ the soup to check its flavour.", "options": ["A. tastes", "B. is tasting", "C. taste", "D. are tasting"], "answer": "B", "explain": "'taste' khi chỉ hành động nếm thử thì dùng được ở thì tiếp diễn; chỉ khi chỉ trạng thái (món ăn có vị gì) mới không dùng tiếp diễn. Đầu bếp đang nếm nên dùng 'is tasting'.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tom: I will do the washing-up tonight. - Mum: ___.", "options": ["A. That is very kind of you. Thanks!", "B. Washing-up is easy.", "C. Do it now, not tonight.", "D. Your sister did it yesterday."], "answer": "A", "explain": "Khi con đề nghị giúp việc nhà, mẹ nên cảm ơn và khen ngợi.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Family Day in Vietnam is on June 28th. On this day, families spend time together and express love and gratitude. Many families cook special meals, visit grandparents or take a short trip. Schools also hold activities to remind students of family values.", "statements": ["a) Family Day in Vietnam is on June 28th.", "b) Families express love and gratitude on this day.", "c) Schools hold no activities on Family Day.", "d) Many families take a short trip on Family Day."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: trường học tổ chức hoạt động nhắc nhở về giá trị gia đình. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). Some parents pay their children for doing chores. Supporters say it teaches the value of money and hard work. However, critics argue that children may then refuse to help unless paid. They believe chores should be a shared family duty, not a paid job. Most experts agree that praise works better than money.", "statements": ["a) Some parents pay children for doing chores.", "b) Supporters say paying teaches the value of hard work.", "c) Critics think paid chores make children always willing to help.", "d) Most experts prefer praise to money."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: người phản đối lo trẻ sẽ từ chối giúp nếu không được trả tiền. d) Đúng: khen ngợi hiệu quả hơn tiền bạc.", "points": 1}, {"type": "short", "level": "VDC", "q": "Give the correct form of the word in brackets: He dislikes (do) ___ the laundry because it takes too much time.", "answer": "doing", "explain": "Sau 'dislike' dùng danh động từ (V-ing): doing. Đây là cấu trúc cố định cần nhớ.", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["laundry", "quần áo giặt"], ["rubbish", "rác"], ["responsibility", "trách nhiệm"], ["value", "giá trị"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["is", "Dad", "the", "mopping", "floor", "now"], "explain": "Câu đúng: Dad is mopping the floor now.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Grandma, you should rest. I will do the washing-up. B: Thank you, dear. You are as kind as your mother. A: Mum taught me that sharing chores is a way to show love. B: She is right. A family that shares work stays close.", "sub_questions": [{"q": "What does the grandchild offer to do?", "options": ["Cook dinner", "Do the washing-up", "Sweep the floor"], "answer": 1}, {"q": "What lesson did Mum teach?", "options": ["Sharing chores shows love", "Rest is more important", "Guests do the chores"], "answer": 0}], "explain": "Cháu đề nghị rửa bát giúp bà; mẹ đã dạy rằng chia sẻ việc nhà là cách thể hiện tình yêu.", "points": 1}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Choose the word whose underlined 'br' is pronounced differently from the others.", "options": ["A. breakfast", "B. brown", "C. bring", "D. crane"], "answer": "D", "explain": "breakfast, brown, bring có 'br' phát âm là /br/, còn crane có 'cr' phát âm là /kr/ nên khác.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Choose the word whose main stress is placed differently from the others.", "options": ["A. sofa", "B. carpet", "C. divide", "D. window"], "answer": "C", "explain": "sofa, carpet, window nhấn âm tiết thứ nhất, còn divide nhấn âm tiết thứ hai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "It is important to ___ household chores among family members fairly.", "options": ["A. do", "B. make", "C. divide", "D. take"], "answer": "C", "explain": "'divide chores' (chia việc nhà) một cách công bằng giữa các thành viên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "He is always ___ his dirty clothes on the floor. It drives me crazy!", "options": ["A. leave", "B. leaves", "C. leaving", "D. left"], "answer": "C", "explain": "Thì hiện tại tiếp diễn kết hợp với 'always' diễn tả sự phàn nàn về một thói quen xấu: is always leaving.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "My parents ___ of buying a bigger house. They have not decided yet.", "options": ["A. think", "B. are thinking", "C. thinks", "D. is thinking"], "answer": "B", "explain": "'think' khi nghĩa là 'đang cân nhắc' (considering) thì dùng được ở thì tiếp diễn; chỉ khi nghĩa là 'cho rằng, có ý kiến' mới là động từ trạng thái không dùng tiếp diễn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mum: Who wants to help me make dinner? - Both kids: ___.", "options": ["A. Me! I love cooking with you.", "B. Not me. I hate the kitchen.", "C. Dinner is at 6 p.m.", "D. Dad is watching TV."], "answer": "A", "explain": "Khi mẹ rủ cùng nấu ăn, câu đáp tích cực là xung phong giúp: 'Me! I love cooking with you.'", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Read the passage and decide whether the statements are True (T) or False (F). Technology has changed housework. Washing machines, vacuum cleaners and dishwashers save a lot of time. However, family members still need to share the remaining chores. Experts remind us that machines cannot replace the warmth of doing things together.", "statements": ["a) Technology has changed housework.", "b) Machines save a lot of time on chores.", "c) Family members no longer need to share chores.", "d) Machines cannot replace family warmth."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: máy móc tiết kiệm nhiều thời gian. c) Sai: các thành viên vẫn cần chia sẻ việc còn lại. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Read the passage and decide whether the statements are True (T) or False (F). The concept of the 'breadwinner' is changing. In the past, fathers usually earned the money while mothers stayed home. Today, many mothers are breadwinners and many fathers are homemakers. Experts say what matters is not who earns more, but that both partners respect each other's contribution.", "statements": ["a) The idea of the breadwinner is changing.", "b) In the past, mothers usually earned the money.", "c) Today, some fathers are homemakers.", "d) Experts say earning more is what matters most."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: xưa kia bố kiếm tiền, mẹ ở nhà. c) Đúng: nhiều bố nay là homemaker. d) Sai: điều quan trọng là tôn trọng đóng góp của nhau, không phải ai kiếm nhiều hơn.", "points": 1}, {"type": "short", "level": "VDC", "q": "Fill in the blank with ONE word: She is responsible ___ doing the washing-up every evening.", "answer": "for", "explain": "Cấu trúc cố định: 'be responsible for + V-ing' (chịu trách nhiệm về việc gì).", "points": 0.5}, {"type": "matching", "level": "NB", "q": "Nối từ với nghĩa đúng", "pairs": [["washing-up", "rửa bát đĩa"], ["mop", "lau nhà"], ["appreciate", "đánh giá cao"], ["spotlessly", "sạch bóng"]], "explain": "Nối mỗi từ với nghĩa tiếng Việt đúng.", "points": 1}, {"type": "ordering", "level": "TH", "q": "Sắp xếp các từ thành câu đúng", "words": ["grateful", "am", "I", "help", "your", "for"], "explain": "Câu đúng: I am grateful for your help.", "points": 1}, {"type": "listening", "level": "VDC", "q": "Nghe đoạn hội thoại và trả lời câu hỏi", "audio_text": "A: Our family meeting is about sharing chores. Dad will do the heavy lifting, Mum will do the cooking. B: What about us? A: You and I will take turns doing the laundry and taking out the rubbish. B: Sounds fair. When do we start? A: This weekend. Everyone agrees?", "sub_questions": [{"q": "What will Dad do?", "options": ["The cooking", "The heavy lifting", "The laundry"], "answer": 1}, {"q": "What will the two children share?", "options": ["Cooking and cleaning", "Laundry and taking out the rubbish", "Shopping and gardening"], "answer": 1}], "explain": "Bố làm việc nặng; hai con luân phiên giặt quần áo và đổ rác, bắt đầu từ cuối tuần này.", "points": 1}]}]}</script>
