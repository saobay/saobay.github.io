<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'a' is pronounced differently from the others.","options":["A. equal","B. female","C. male","D. wage"],"answer":"A","explain":"Trong equal, chữ a đọc là /ə/; trong female, male, wage, chữ a đọc là /eɪ/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. gender","B. equal","C. female","D. enrol"],"answer":"D","explain":"gender, equal, female là danh từ hoặc tính từ 2 âm tiết nên nhấn âm 1; enrol là động từ 2 âm tiết nên nhấn âm 2.","points":0.25},{"type":"mcq","level":"NB","q":"Women should be given the same ___ as men to do the jobs they like.","options":["A. holidays","B. opportunities","C. meals","D. uniforms"],"answer":"B","explain":"opportunities (cơ hội): phụ nữ nên được trao cơ hội như nam giới để làm công việc mình thích.","points":0.25},{"type":"mcq","level":"TH","q":"Gender discrimination ___ so that everyone has equal opportunities in education.","options":["A. must eliminate","B. must be eliminated","C. must eliminated","D. must be eliminate"],"answer":"B","explain":"Câu bị động với must: must be + V3/ed, nên đáp án là must be eliminated.","points":0.25},{"type":"mcq","level":"VD","q":"Young girls ___ into early marriage by their families.","options":["A. mustn't force","B. mustn't forced","C. mustn't be forced","D. mustn't be force"],"answer":"C","explain":"Câu bị động phủ định: mustn't be + V3/ed, nên đáp án là mustn't be forced.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"I think men and women should share the housework.\" B: \"___\"","options":["A. I agree with you.","B. You're welcome.","C. Goodbye.","D. Never mind."],"answer":"A","explain":"Để bày tỏ đồng tình với ý kiến của người khác, ta nói I agree with you.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["gender","giới tính"],["equality","sự bình đẳng"],["opportunity","cơ hội"],["encourage","khuyến khích"],["surgeon","bác sĩ phẫu thuật"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Women","should","be","given","equal","pay"],"explain":"Câu đúng: Women should be given equal pay. (Phụ nữ nên được trả lương bình đẳng.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Lan, do you think boys and girls should do the same housework? B: Yes, I do. In my family, my brother and I share the housework. A: Who cooks dinner in your family? B: My dad often cooks, and my mum washes the dishes.","sub_questions":[{"q":"Who shares the housework with Lan?","options":["Her brother","Her sister","Her cousin"],"answer":0},{"q":"Who often cooks dinner in Lan's family?","options":["Her dad","Her mum","Lan"],"answer":0},{"q":"What does Lan's mum do?","options":["Washes the dishes","Cooks dinner","Cleans the floor"],"answer":0}],"explain":"Nghe kỹ đoạn hội thoại: Lan chia sẻ việc nhà với anh trai; bố nấu ăn, mẹ rửa bát.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Gender equality means men and women have the same rights and opportunities. In many families today, both parents go to work and share the housework. Girls are encouraged to go to school and pursue any career they like.","statements":["a) Gender equality gives men and women the same rights.","b) Only fathers go to work in modern families.","c) Girls are encouraged to go to school.","d) Girls can choose any career they like."],"answer":["T","F","T","T"],"explain":"a) Đúng: định nghĩa trong bài. b) Sai: cả bố và mẹ đều đi làm. c) Đúng: trong bài có nói. d) Đúng: pursue any career they like.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). In the past, many girls left school early to get married, so they had few job opportunities. Today, more girls finish their education and become doctors, engineers and leaders. However, women still earn less than men for the same work in some countries, so the fight for equality continues.","statements":["a) In the past, early marriage stopped many girls from studying.","b) Today no woman can become a leader.","c) Some women still earn less than men for the same work.","d) The fight for gender equality has completely finished."],"answer":["T","F","T","F"],"explain":"a) Đúng: nghỉ học sớm để kết hôn. b) Sai: ngày nay phụ nữ có thể làm bác sĩ, kỹ sư, lãnh đạo. c) Đúng: trong bài có nói. d) Sai: cuộc đấu tranh vẫn tiếp diễn (continues).","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Gender equality means equal rights for everyone","explain":"Đọc to, rõ ràng, chú ý trọng âm các từ: GENder, eQUAlity.","points":1}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'e' is pronounced differently from the others.","options":["A. gender","B. female","C. equal","D. evening"],"answer":"A","explain":"Trong gender, chữ e đọc là /e/; trong female, equal, evening, chữ e đọc là /iː/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. income","B. surgeon","C. bias","D. pursue"],"answer":"D","explain":"income, surgeon, bias là danh từ 2 âm tiết nên nhấn âm 1; pursue là động từ 2 âm tiết nên nhấn âm 2.","points":0.25},{"type":"mcq","level":"NB","q":"We must ___ gender discrimination in our school.","options":["A. eat","B. eliminate","C. drink","D. paint"],"answer":"B","explain":"eliminate (loại bỏ): chúng ta phải loại bỏ sự phân biệt đối xử về giới trong trường học.","points":0.25},{"type":"mcq","level":"TH","q":"Girls ___ to stay at home; they should go to school like boys.","options":["A. should not force","B. should not forced","C. should not be forced","D. should not be force"],"answer":"C","explain":"Câu bị động với should: should not be + V3/ed, nên đáp án là should not be forced.","points":0.25},{"type":"mcq","level":"VD","q":"The new law says that men and women ___ equally for the same job.","options":["A. should pay","B. should be paid","C. should paid","D. should be pay"],"answer":"B","explain":"Câu bị động: should be + V3/ed, nên đáp án là should be paid (được trả lương).","points":0.25},{"type":"mcq","level":"TH","q":"A: \"In my opinion, girls can do any job they like.\" B: \"___\"","options":["A. That's true.","B. Thank you.","C. See you.","D. Not at all."],"answer":"A","explain":"That's true dùng để đồng tình với ý kiến vừa nghe.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["equal","bình đẳng"],["pursue","theo đuổi"],["enrol","ghi danh"],["income","thu nhập"],["bias","thành kiến"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Girls","must","not","be","forced","into","marriage"],"explain":"Câu đúng: Girls must not be forced into marriage. (Các bé gái không được ép tảo hôn.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Minh, what does your mother do? B: She is a surgeon at a city hospital. A: Wow! Is her job difficult? B: Yes, but she loves it. She says women can do any job as well as men.","sub_questions":[{"q":"What is Minh's mother?","options":["A surgeon","A teacher","A nurse"],"answer":0},{"q":"Where does she work?","options":["At a city hospital","At a school","At a market"],"answer":0},{"q":"What does she think about women and jobs?","options":["Women can do any job as well as men","Women should stay at home","Only men can be surgeons"],"answer":0}],"explain":"Nghe kỹ: mẹ của Minh là bác sĩ phẫu thuật ở bệnh viện thành phố; bà cho rằng phụ nữ có thể làm mọi việc tốt như nam giới.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). In Lan's family, everyone shares the housework. Her father cooks dinner, her mother washes the dishes, and Lan cleans her room. Her brother takes out the rubbish. Lan thinks housework should not be only women's work.","statements":["a) Everyone in Lan's family shares the housework.","b) Lan's father washes the dishes.","c) Lan's brother takes out the rubbish.","d) Lan thinks only women should do housework."],"answer":["T","F","T","F"],"explain":"a) Đúng: everyone shares the housework. b) Sai: bố nấu ăn (cooks dinner), mẹ rửa bát. c) Đúng: trong bài. d) Sai: Lan cho rằng việc nhà không chỉ của phụ nữ.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). A recent survey shows that the number of female students at universities is now higher than the number of male students in some countries. However, few women become leaders of big companies. Experts say companies should give women more chances to show their ability, and governments must make fair laws.","statements":["a) In some countries there are more female than male university students.","b) Many women lead big companies now.","c) Experts want companies to give women more chances.","d) Governments should make unfair laws."],"answer":["T","F","T","F"],"explain":"a) Đúng: số nữ sinh viên cao hơn nam ở một số nước. b) Sai: ít phụ nữ làm lãnh đạo công ty lớn (few women). c) Đúng: trong bài. d) Sai: chính phủ phải ban hành luật công bằng (fair laws).","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Women should be given equal opportunities at work","explain":"Đọc to, rõ ràng, chú ý phát âm đúng các từ nhiều âm tiết: opportunities.","points":1}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'i' is pronounced differently from the others.","options":["A. bias","B. income","C. victim","D. skill"],"answer":"A","explain":"Trong bias, chữ i đọc là /aɪ/; trong income, victim, skill, chữ i đọc là /ɪ/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. victim","B. workforce","C. childcare","D. encourage"],"answer":"D","explain":"victim, workforce, childcare là danh từ 2 âm tiết nên nhấn âm 1; encourage là động từ 2 âm tiết nên nhấn âm 2.","points":0.25},{"type":"mcq","level":"NB","q":"My sister wants to ___ a career as a surgeon.","options":["A. pursue","B. swim","C. sing","D. run"],"answer":"A","explain":"pursue a career (theo đuổi sự nghiệp): chị tôi muốn theo đuổi sự nghiệp bác sĩ phẫu thuật.","points":0.25},{"type":"mcq","level":"TH","q":"In my opinion, housework ___ equally by all family members.","options":["A. should share","B. should be shared","C. should shared","D. should be share"],"answer":"B","explain":"Câu bị động với should: should be + V3/ed, nên đáp án là should be shared.","points":0.25},{"type":"mcq","level":"VD","q":"I think this problem ___ at the next meeting.","options":["A. should discuss","B. should discussed","C. should be discussed","D. should be discuss"],"answer":"C","explain":"Câu bị động: should be + V3/ed, nên đáp án là should be discussed (được thảo luận).","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Do you think women can be good leaders?\" B: \"___\"","options":["A. Yes, I think so.","B. No, thanks.","C. I'm fine.","D. Good luck."],"answer":"A","explain":"Trả lời đồng tình với câu hỏi ý kiến: Yes, I think so.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["discrimination","sự phân biệt đối xử"],["workforce","lực lượng lao động"],["childcare","việc chăm sóc trẻ em"],["housework","việc nhà"],["kindergarten","trường mẫu giáo"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Housework","should","be","shared","by","everyone"],"explain":"Câu đúng: Housework should be shared by everyone. (Việc nhà nên được mọi người cùng chia sẻ.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Hoa, why did you choose to be an engineer? B: Because I love building things. My parents encouraged me to follow my dream. A: Do some people think engineering is only for men? B: Yes, but I don't agree. Girls can do it well too.","sub_questions":[{"q":"Why did Hoa choose engineering?","options":["She loves building things","Her teacher asked her","It is very easy"],"answer":0},{"q":"Who encouraged Hoa?","options":["Her parents","Her friends","Her brother"],"answer":0},{"q":"What does Hoa think?","options":["Girls can do engineering well too","Engineering is only for men","She wants to quit"],"answer":0}],"explain":"Nghe kỹ: Hoa yêu thích chế tạo; bố mẹ khuyến khích cô theo đuổi ước mơ; cô tin các bạn gái cũng làm kỹ sư giỏi.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Child marriage is a serious problem in some poor areas. Young girls are forced to marry early and leave school. Without education, they cannot find good jobs. Many organisations are working to stop child marriage and help girls return to school.","statements":["a) Child marriage happens in some poor areas.","b) Young girls are encouraged to marry early.","c) Without education, girls cannot find good jobs.","d) Organisations want more girls to marry early."],"answer":["T","F","T","F"],"explain":"a) Đúng: trong bài. b) Sai: các bé gái bị ép (forced), không phải được khuyến khích. c) Đúng: trong bài. d) Sai: các tổ chức đang ngăn chặn tảo hôn.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). In 1900, women in many countries could not vote. Brave women fought for equal rights for many years. Finally, they won the right to vote and to work. Their fight shows that gender equality must be protected by fair laws.","statements":["a) In 1900 women in many countries had the right to vote.","b) Women fought for equal rights for a long time.","c) Women finally won the right to vote and work.","d) Fair laws are not important for gender equality."],"answer":["F","T","T","F"],"explain":"a) Sai: năm 1900 phụ nữ chưa được đi bầu (could not vote). b) Đúng: đấu tranh nhiều năm. c) Đúng: trong bài. d) Sai: bình đẳng giới phải được bảo vệ bằng luật công bằng.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Housework should be shared by all family members","explain":"Đọc to, rõ ràng, chú ý cụm từ: should be shared.","points":1}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'o' is pronounced differently from the others.","options":["A. opportunity","B. job","C. doctor","D. enrol"],"answer":"D","explain":"Trong opportunity, job, doctor, chữ o đọc là /ɒ/; trong enrol, chữ o đọc là /əʊ/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. gender","B. doctor","C. office","D. agree"],"answer":"D","explain":"gender, doctor, office là danh từ 2 âm tiết nên nhấn âm 1; agree là động từ 2 âm tiết nên nhấn âm 2.","points":0.25},{"type":"mcq","level":"NB","q":"A ___ works in a hospital and performs operations on patients.","options":["A. farmer","B. driver","C. surgeon","D. teacher"],"answer":"C","explain":"surgeon (bác sĩ phẫu thuật): làm việc trong bệnh viện và phẫu thuật cho bệnh nhân.","points":0.25},{"type":"mcq","level":"TH","q":"Women ___ the same salaries as men for doing the same work.","options":["A. should give","B. should be given","C. should given","D. should be give"],"answer":"B","explain":"Câu bị động với should: should be + V3/ed, nên đáp án là should be given.","points":0.25},{"type":"mcq","level":"VD","q":"Girls ___ from going to school in some poor areas.","options":["A. should not prevent","B. should not prevented","C. should not be prevented","D. should not be prevent"],"answer":"C","explain":"Câu bị động phủ định: should not be + V3/ed, nên đáp án là should not be prevented (không bị ngăn cản).","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Should boys learn to cook?\" B: \"___\"","options":["A. Never mind.","B. Of course.","C. No problem.","D. Take care."],"answer":"B","explain":"Trả lời đồng tình chắc chắn: Of course (Tất nhiên rồi).","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["empower","trao quyền"],["uneducated","thất học"],["firefighter","lính cứu hỏa"],["treat","đối xử"],["force","ép buộc"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Gender","discrimination","must","be","eliminated"],"explain":"Câu đúng: Gender discrimination must be eliminated. (Phân biệt đối xử về giới phải bị loại bỏ.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Dad, can I join the school football team? B: Of course, Mai. Why do you ask? A: Some boys say football is only for boys. B: Don't listen to them. Girls can play football very well. I will talk to your coach.","sub_questions":[{"q":"What does Mai want to join?","options":["The school football team","The swimming club","The music club"],"answer":0},{"q":"What do some boys say?","options":["Football is only for boys","Girls play better","Mai is the best player"],"answer":0},{"q":"What will Mai's dad do?","options":["Talk to her coach","Stop her playing","Buy a new ball"],"answer":0}],"explain":"Nghe kỹ: Mai muốn vào đội bóng đá; một số bạn nam nói bóng đá chỉ dành cho nam; bố sẽ nói chuyện với huấn luyện viên.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Today many women have good jobs. Some are doctors, some are teachers, and some are company leaders. They earn money and help their families. Their success shows that women can do any job as well as men.","statements":["a) Many women have good jobs today.","b) No woman can become a company leader.","c) Working women help their families.","d) Women can do jobs as well as men."],"answer":["T","F","T","T"],"explain":"a) Đúng: trong bài. b) Sai: một số phụ nữ là lãnh đạo công ty. c) Đúng: help their families. d) Đúng: as well as men.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). The United Nations says gender equality is a basic human right. When girls go to school, they get better jobs and earn more money later. Educated women also take better care of their children's health. That is why every country should help girls finish at least 12 years of school.","statements":["a) The UN sees gender equality as a basic human right.","b) Educated girls earn less money than uneducated girls.","c) Educated women look after their children's health better.","d) Countries should help girls finish at least 12 years of school."],"answer":["T","T","T","T"],"explain":"a) Đúng: basic human right. b) Đúng: get better jobs and earn more money. c) Đúng: take better care of their children's health. d) Đúng: trong bài.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Girls can pursue any career they want","explain":"Đọc to, rõ ràng, chú ý trọng âm: purSUE, caREER.","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'u' is pronounced differently from the others.","options":["A. must","B. just","C. result","D. pursue"],"answer":"D","explain":"Trong must, just, result, chữ u đọc là /ʌ/; trong pursue, chữ u đọc là /uː/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. income","B. equal","C. bias","D. employ"],"answer":"D","explain":"income, equal, bias nhấn âm 1; employ là động từ 2 âm tiết nên nhấn âm 2.","points":0.25},{"type":"mcq","level":"NB","q":"In many families, both parents share the ___.","options":["A. housework","B. homework","C. network","D. teamwork"],"answer":"A","explain":"share the housework (chia sẻ việc nhà): cả bố và mẹ cùng làm việc nhà.","points":0.25},{"type":"mcq","level":"TH","q":"Children ___ everything they want; it is not good for them.","options":["A. must not give","B. must not be given","C. must not given","D. must not be give"],"answer":"B","explain":"Câu bị động phủ định với must: must not be + V3/ed, nên đáp án là must not be given.","points":0.25},{"type":"mcq","level":"VD","q":"More schools ___ in rural areas to help girls continue their education.","options":["A. should build","B. should be built","C. should built","D. should be build"],"answer":"B","explain":"Câu bị động: should be + V3/ed; build là động từ bất quy tắc (build-built-built), nên đáp án là should be built.","points":0.25},{"type":"mcq","level":"TH","q":"A: \"I don't think housework is only for women.\" B: \"___\"","options":["A. I'm sorry.","B. Excuse me.","C. I couldn't agree more.","D. Good night."],"answer":"C","explain":"I couldn't agree more (Tôi hoàn toàn đồng ý) dùng để đồng tình mạnh mẽ.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["victim","nạn nhân"],["traditional","truyền thống"],["skill","kỹ năng"],["female","nữ giới"],["male","nam giới"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Boys","and","girls","have","equal","rights"],"explain":"Câu đúng: Boys and girls have equal rights. (Trẻ em trai và gái có quyền bình đẳng.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Our class is doing a survey about housework. B: Great! What did you find? A: In 20 families, fathers never do the cooking. B: Really? In my family, my dad cooks every Sunday. A: Your family is a good example of gender equality!","sub_questions":[{"q":"What is the class doing?","options":["A survey about housework","A survey about food","A football match"],"answer":0},{"q":"What did they find in 20 families?","options":["Fathers never do the cooking","Mothers never cook","Children do everything"],"answer":0},{"q":"When does the boy's dad cook?","options":["Every Sunday","Every day","Never"],"answer":0}],"explain":"Nghe kỹ: lớp làm khảo sát về việc nhà; ở 20 gia đình bố không nấu ăn; bố của bạn nam nấu ăn mỗi Chủ nhật.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Domestic violence is a serious problem. It happens when a family member hurts another. Both women and children can be victims. The law must protect them, and neighbours should help by reporting violence to the police.","statements":["a) Domestic violence is a serious problem.","b) Only men can be victims of domestic violence.","c) The law must protect victims.","d) Neighbours should report violence to the police."],"answer":["T","F","T","T"],"explain":"a) Đúng: trong bài. b) Sai: phụ nữ và trẻ em đều có thể là nạn nhân. c) Đúng: The law must protect them. d) Đúng: reporting violence to the police.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Some people still believe that boys are better at maths and girls are better at languages. Scientists say this is not true. Boys and girls have the same ability to learn any subject. What really matters is hard work and good teaching, not gender.","statements":["a) Some people believe boys are better at maths than girls.","b) Scientists agree that girls cannot learn maths well.","c) Boys and girls have the same ability to learn.","d) Hard work matters more than gender in learning."],"answer":["T","F","T","T"],"explain":"a) Đúng: trong bài. b) Sai: các nhà khoa học nói điều đó không đúng. c) Đúng: the same ability. d) Đúng: hard work and good teaching, not gender.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Discrimination must be eliminated in our school","explain":"Đọc to, rõ ràng, chú ý: discrimination, eliminated.","points":1}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letters 'ea' are pronounced differently from the others.","options":["A. treat","B. equal","C. deal","D. head"],"answer":"D","explain":"Trong treat, equal, deal, ea đọc là /iː/; trong head, ea đọc là /e/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. surgeon","B. victim","C. workforce","D. degree"],"answer":"D","explain":"surgeon, victim, workforce là danh từ 2 âm tiết nên nhấn âm 1; degree nhấn âm 2.","points":0.25},{"type":"mcq","level":"NB","q":"Parents should ___ their daughters to go to school.","options":["A. encourage","B. punish","C. forget","D. leave"],"answer":"A","explain":"encourage (khuyến khích, động viên): bố mẹ nên động viên con gái đi học.","points":0.25},{"type":"mcq","level":"TH","q":"Efforts ___ to provide equal access to education for all children.","options":["A. should make","B. should be made","C. should made","D. should be make"],"answer":"B","explain":"Câu bị động với should: should be + V3/ed; make-made-made, nên đáp án là should be made.","points":0.25},{"type":"mcq","level":"VD","q":"Women ___ to take part in social activities.","options":["A. should encourage","B. should be encouraged","C. should encouraged","D. should be encourage"],"answer":"B","explain":"Câu bị động: should be + V3/ed, nên đáp án là should be encouraged (được khuyến khích).","points":0.25},{"type":"mcq","level":"TH","q":"A: \"What do you think about gender equality?\" B: \"___\"","options":["A. I like football.","B. I'm hungry.","C. I think it's very important.","D. It's sunny."],"answer":"C","explain":"Trả lời câu hỏi ý kiến: I think it's very important.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["gender","giới tính"],["equal","bình đẳng"],["encourage","khuyến khích"],["pursue","theo đuổi"],["opportunity","cơ hội"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["She","wants","to","pursue","her","dream"],"explain":"Câu đúng: She wants to pursue her dream. (Cô ấy muốn theo đuổi ước mơ của mình.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: What do you want to be in the future, Nam? B: I want to be a kindergarten teacher. A: Really? Some people say it is a woman's job. B: I don't think so. Men can take good care of small children too.","sub_questions":[{"q":"What does Nam want to be?","options":["A kindergarten teacher","A doctor","A driver"],"answer":0},{"q":"What do some people say?","options":["It is a woman's job","It is a man's job","It is boring"],"answer":0},{"q":"What does Nam think?","options":["Men can take good care of small children too","He wants to change his dream","Teaching is difficult"],"answer":0}],"explain":"Nghe kỹ: Nam muốn làm giáo viên mẫu giáo; một số người nói đó là việc của phụ nữ; Nam tin nam giới cũng chăm sóc trẻ tốt.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Firefighters put out fires and save people's lives. In the past, most firefighters were men. Today, many women also do this job well. They are strong, brave and skilful.","statements":["a) Firefighters save people's lives.","b) In the past, most firefighters were men.","c) No woman can be a firefighter.","d) Female firefighters are strong and brave."],"answer":["T","T","F","T"],"explain":"a) Đúng: save people's lives. b) Đúng: trong bài. c) Sai: ngày nay nhiều phụ nữ làm tốt công việc này. d) Đúng: strong, brave and skilful.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). In some villages, parents still prefer sons to daughters because sons carry on the family name. As a result, some girls leave school early to work and help the family. Experts say parents must change this old idea because daughters can look after parents just as well as sons.","statements":["a) Some parents prefer sons because sons carry on the family name.","b) All girls in villages finish school.","c) Experts want parents to keep the old idea.","d) Daughters can look after parents as well as sons."],"answer":["T","F","F","T"],"explain":"a) Đúng: trong bài. b) Sai: một số bé gái nghỉ học sớm. c) Sai: chuyên gia muốn bố mẹ thay đổi quan niệm cũ. d) Đúng: just as well as sons.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Boys and girls have the same right to education","explain":"Đọc to, rõ ràng, chú ý: education /ˌedʒuˈkeɪʃn/.","points":1}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letters 'ed' are pronounced differently from the others.","options":["A. forced","B. worked","C. missed","D. encouraged"],"answer":"D","explain":"Trong forced, worked, missed, ed đọc là /t/; trong encouraged, ed đọc là /d/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. gender","B. equal","C. enrol","D. female"],"answer":"C","explain":"gender, equal, female nhấn âm 1; enrol là động từ 2 âm tiết nên nhấn âm 2.","points":0.25},{"type":"mcq","level":"NB","q":"___ is unfair treatment of people because of their sex.","options":["A. Discrimination","B. Education","C. Celebration","D. Pollution"],"answer":"A","explain":"Discrimination (sự phân biệt đối xử): đối xử bất công vì giới tính.","points":0.25},{"type":"mcq","level":"TH","q":"This job ___ by a woman as well as by a man.","options":["A. can do","B. can done","C. can be done","D. can be do"],"answer":"C","explain":"Câu bị động với can: can be + V3/ed, nên đáp án là can be done.","points":0.25},{"type":"mcq","level":"VD","q":"Child marriage ___ by law in many countries now.","options":["A. can ban","B. can banned","C. can be ban","D. can be banned"],"answer":"D","explain":"Câu bị động: can be + V3/ed, nên đáp án là can be banned (bị cấm).","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Women should have the same pay as men.\" B: \"___\"","options":["A. I totally agree.","B. You're welcome.","C. Don't mention it.","D. See you later."],"answer":"A","explain":"I totally agree (Tôi hoàn toàn đồng ý) dùng để bày tỏ đồng tình.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["equality","sự bình đẳng"],["enrol","ghi danh"],["income","thu nhập"],["surgeon","bác sĩ phẫu thuật"],["bias","thành kiến"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Parents","should","encourage","their","daughters"],"explain":"Câu đúng: Parents should encourage their daughters. (Bố mẹ nên động viên con gái.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Mum, our teacher says girls should learn to cook and boys should learn to fix things. B: Do you agree, Tom? A: No. I think both boys and girls should learn both. B: You're right. Skills are not only for boys or only for girls.","sub_questions":[{"q":"What does Tom's teacher say?","options":["Girls should learn to cook and boys should fix things","Boys should learn to cook","Nobody should learn skills"],"answer":0},{"q":"What does Tom think?","options":["Both boys and girls should learn both","Only girls should cook","Only boys should fix things"],"answer":0},{"q":"What does Tom's mum say?","options":["You're right","You're wrong","Be quiet"],"answer":0}],"explain":"Nghe kỹ: cô giáo nói nữ học nấu ăn, nam học sửa chữa; Tom không đồng ý; mẹ bảo Tom nói đúng.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Equal pay means men and women get the same salary for the same work. In some jobs, women still earn less than men. Many people think this is unfair. Laws should protect women's right to equal pay.","statements":["a) Equal pay means the same salary for the same work.","b) All women earn more than men now.","c) Many people think unequal pay is unfair.","d) Laws should protect equal pay for women."],"answer":["T","F","T","T"],"explain":"a) Đúng: định nghĩa trong bài. b) Sai: một số nơi phụ nữ vẫn lương thấp hơn. c) Đúng: this is unfair. d) Đúng: trong bài.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). When mothers earn money, the whole family benefits. Studies show that working mothers spend most of their income on food, health and education for their children. Therefore, helping women find good jobs is one of the best ways to reduce poverty.","statements":["a) The whole family benefits when mothers earn money.","b) Working mothers spend most income on their children.","c) Helping women find jobs can reduce poverty.","d) Mothers' income is bad for families."],"answer":["T","T","T","F"],"explain":"a) Đúng: the whole family benefits. b) Đúng: spend most of their income on food, health and education. c) Đúng: one of the best ways to reduce poverty. d) Sai: trái với nội dung bài.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Parents should encourage their daughters to study","explain":"Đọc to, rõ ràng, chú ý trọng âm: enCOUrage, DAUGHTers.","points":1}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 's' is pronounced differently from the others.","options":["A. jobs","B. girls","C. works","D. degrees"],"answer":"C","explain":"Trong jobs, girls, degrees, s đọc là /z/; trong works, s đọc là /s/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. pursue","B. pilot","C. equal","D. income"],"answer":"A","explain":"pilot, equal, income nhấn âm 1; pursue là động từ 2 âm tiết nên nhấn âm 2.","points":0.25},{"type":"mcq","level":"NB","q":"She had to ___ in a medical school to become a doctor.","options":["A. sleep","B. travel","C. enrol","D. cook"],"answer":"C","explain":"enrol in (ghi danh vào): cô ấy phải ghi danh vào trường y để thành bác sĩ.","points":0.25},{"type":"mcq","level":"TH","q":"Everyone ___ with respect, no matter what their sex is.","options":["A. should treat","B. should be treated","C. should treated","D. should be treat"],"answer":"B","explain":"Câu bị động với should: should be + V3/ed, nên đáp án là should be treated.","points":0.25},{"type":"mcq","level":"VD","q":"The results of the survey ___ next week.","options":["A. may announce","B. may announced","C. may be announce","D. may be announced"],"answer":"D","explain":"Câu bị động với may: may be + V3/ed, nên đáp án là may be announced (được công bố).","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Can girls play football well?\" B: \"___\"","options":["A. Sure, they can.","B. No, I don't.","C. I'm OK.","D. Thanks a lot."],"answer":"A","explain":"Trả lời đồng tình, khẳng định: Sure, they can (Chắc chắn rồi).","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["discrimination","sự phân biệt đối xử"],["housework","việc nhà"],["childcare","việc chăm sóc trẻ em"],["workforce","lực lượng lao động"],["kindergarten","trường mẫu giáo"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["Men","can","be","good","nurses","too"],"explain":"Câu đúng: Men can be good nurses too. (Nam giới cũng có thể là y tá giỏi.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Why are there few women pilots, Dad? B: In the past, people thought flying was only for men. A: Is that true now? B: No. Today many women fly planes very well. A: I want to be a pilot too! B: Good idea. Work hard and follow your dream.","sub_questions":[{"q":"What did people think in the past?","options":["Flying was only for men","Women flew better","Pilots earned little"],"answer":0},{"q":"What is true today?","options":["Many women fly planes very well","No woman can fly","Flying is too difficult"],"answer":0},{"q":"What does the girl want to be?","options":["A pilot","A teacher","A doctor"],"answer":0}],"explain":"Nghe kỹ: xưa kia người ta nghĩ lái máy bay chỉ dành cho nam; ngày nay nhiều phụ nữ lái giỏi; cô bé cũng muốn làm phi công.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Mai is the best student in her maths class. She always gets high marks and helps her friends with difficult exercises. Her teacher says girls can be excellent at maths. Mai wants to become an engineer.","statements":["a) Mai is the best student in her maths class.","b) She never helps her friends.","c) Her teacher believes girls can be good at maths.","d) Mai wants to become a nurse."],"answer":["T","F","T","F"],"explain":"a) Đúng: trong bài. b) Sai: Mai giúp bạn làm bài khó. c) Đúng: trong bài. d) Sai: Mai muốn thành kỹ sư.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Gender bias starts very early. Many toy shops sell dolls to girls and cars to boys. Girls' books are often pink and about princesses, while boys' books are about adventures. Parents should let children choose the toys and books they really like.","statements":["a) Gender bias can start in childhood.","b) Toy shops always sell the same toys to all children.","c) Girls' books are often about princesses.","d) Parents should let children choose what they like."],"answer":["T","F","T","T"],"explain":"a) Đúng: starts very early. b) Sai: bán búp bê cho bé gái, ô tô cho bé trai. c) Đúng: trong bài. d) Đúng: trong bài.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Men and women should receive equal pay","explain":"Đọc to, rõ ràng, chú ý: receive /rɪˈsiːv/, equal.","points":1}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letter 'g' is pronounced differently from the others.","options":["A. gender","B. gentle","C. general","D. goal"],"answer":"D","explain":"Trong gender, gentle, general, g đọc là /dʒ/; trong goal, g đọc là /ɡ/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. childcare","B. housework","C. doctor","D. support"],"answer":"D","explain":"childcare, housework, doctor nhấn âm 1; support là động từ 2 âm tiết nên nhấn âm 2.","points":0.25},{"type":"mcq","level":"NB","q":"Domestic ___ is a serious problem in some families.","options":["A. violence","B. happiness","C. kindness","D. silence"],"answer":"A","explain":"domestic violence (bạo lực gia đình): là vấn đề nghiêm trọng ở một số gia đình.","points":0.25},{"type":"mcq","level":"TH","q":"Equal opportunities ___ to both boys and girls in this school.","options":["A. must offer","B. must offered","C. must be offered","D. must be offer"],"answer":"C","explain":"Câu bị động với must: must be + V3/ed, nên đáp án là must be offered.","points":0.25},{"type":"mcq","level":"VD","q":"Old ideas about gender roles ___.","options":["A. must change","B. must be changed","C. must changed","D. must be change"],"answer":"B","explain":"Câu bị động: must be + V3/ed, nên đáp án là must be changed (phải được thay đổi).","points":0.25},{"type":"mcq","level":"TH","q":"A: \"I believe girls should go to school like boys.\" B: \"___\"","options":["A. Goodbye.","B. So do I.","C. Thanks.","D. No way."],"answer":"B","explain":"So do I (Tôi cũng vậy) dùng để đồng tình với ý kiến tích cực.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["empower","trao quyền"],["treat","đối xử"],["force","ép buộc"],["uneducated","thất học"],["firefighter","lính cứu hỏa"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["All","children","need","equal","opportunities"],"explain":"Câu đúng: All children need equal opportunities. (Mọi trẻ em đều cần cơ hội bình đẳng.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: What is your favourite subject, Hoa? B: I love physics. A: Some students say physics is too difficult for girls. B: I don't agree. My sister is studying physics at university. A: You're right. Hard work is more important than gender.","sub_questions":[{"q":"What is Hoa's favourite subject?","options":["Physics","Maths","Chemistry"],"answer":0},{"q":"What do some students say?","options":["Physics is too difficult for girls","Physics is easy","Girls hate physics"],"answer":0},{"q":"What is more important than gender?","options":["Hard work","Good luck","Nice clothes"],"answer":0}],"explain":"Nghe kỹ: Hoa thích vật lý; một số bạn nói vật lý khó với nữ; chăm chỉ quan trọng hơn giới tính.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). In many countries, women could not vote a hundred years ago. They had to fight for a long time to win this right. Today, women vote and take part in elections like men. Voting is an important right for everyone.","statements":["a) Women could vote easily a hundred years ago.","b) Women fought for a long time to win the vote.","c) Today women vote like men.","d) Voting is important for everyone."],"answer":["F","T","T","T"],"explain":"a) Sai: cách đây 100 năm phụ nữ chưa được đi bầu. b) Đúng: fight for a long time. c) Đúng: trong bài. d) Đúng: important right for everyone.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). Advertisements often show women cooking and cleaning while men drive cars and work in offices. These images teach children wrong ideas about gender roles. Companies should show both men and women doing all kinds of jobs in their advertisements.","statements":["a) Advertisements never show wrong ideas about gender.","b) Ads often show women cooking and cleaning.","c) These images teach children wrong ideas.","d) Companies should show men and women doing all jobs."],"answer":["F","T","T","T"],"explain":"a) Sai: quảng cáo dạy trẻ quan niệm sai. b) Đúng: trong bài. c) Đúng: wrong ideas about gender roles. d) Đúng: trong bài.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Child marriage must be stopped by law","explain":"Đọc to, rõ ràng, chú ý: marriage /ˈmærɪdʒ/, stopped.","points":1}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Choose the word in which the letters 'ou' are pronounced differently from the others.","options":["A. housework","B. house","C. proud","D. country"],"answer":"D","explain":"Trong housework, house, proud, ou đọc là /aʊ/; trong country, ou đọc là /ʌ/.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. encourage","B. bias","C. female","D. surgeon"],"answer":"A","explain":"bias, female, surgeon nhấn âm 1; encourage là động từ 2 âm tiết nên nhấn âm 2.","points":0.25},{"type":"mcq","level":"NB","q":"A ___ takes care of small children before they go to primary school.","options":["A. kindergarten teacher","B. surgeon","C. firefighter","D. pilot"],"answer":"A","explain":"kindergarten teacher (giáo viên mẫu giáo): chăm sóc trẻ nhỏ trước tuổi tiểu học.","points":0.25},{"type":"mcq","level":"TH","q":"Domestic violence ___ immediately by law.","options":["A. must stop","B. must be stopped","C. must stopped","D. must be stop"],"answer":"B","explain":"Câu bị động với must: must be + V3/ed, nên đáp án là must be stopped.","points":0.25},{"type":"mcq","level":"VD","q":"A safe working environment ___ for all workers.","options":["A. must provide","B. must be provided","C. must provided","D. must be provide"],"answer":"B","explain":"Câu bị động: must be + V3/ed, nên đáp án là must be provided (phải được tạo ra).","points":0.25},{"type":"mcq","level":"TH","q":"A: \"Do you agree that men can be good nurses?\" B: \"___\"","options":["A. No, thanks.","B. Not really.","C. Yes, I do.","D. Bye."],"answer":"C","explain":"Trả lời đồng tình: Yes, I do.","points":0.25},{"type":"matching","level":"NB","q":"Nối từ với nghĩa đúng","pairs":[["victim","nạn nhân"],["skill","kỹ năng"],["traditional","truyền thống"],["female","nữ giới"],["male","nam giới"]],"explain":"Nối mỗi từ tiếng Anh với nghĩa tiếng Việt đúng của nó.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp thành câu đúng","words":["We","must","treat","everyone","with","respect"],"explain":"Câu đúng: We must treat everyone with respect. (Chúng ta phải đối xử tôn trọng với mọi người.)","points":1},{"type":"listening","level":"VD","q":"Nghe và trả lời câu hỏi","audio_text":"A: Lan, what will you do after you finish school? B: I want to study medicine and become a surgeon. A: That's a difficult job! B: I know, but I will work hard. My mum says girls can achieve anything they want.","sub_questions":[{"q":"What does Lan want to become?","options":["A surgeon","A teacher","A nurse"],"answer":0},{"q":"What will Lan do?","options":["Work hard","Give up","Change her dream"],"answer":0},{"q":"What does Lan's mum say?","options":["Girls can achieve anything they want","Surgery is too hard","Lan should stay at home"],"answer":0}],"explain":"Nghe kỹ: Lan muốn thành bác sĩ phẫu thuật; cô sẽ chăm chỉ; mẹ nói các bạn gái có thể đạt mọi điều mình muốn.","points":1},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are True (T) or False (F). Sports are for everyone. Girls can play football, swim and run as well as boys. Many female athletes win gold medals for their countries. Their success encourages more girls to play sports.","statements":["a) Sports are only for boys.","b) Girls can play sports as well as boys.","c) Female athletes win medals for their countries.","d) Their success encourages more girls to play sports."],"answer":["F","T","T","T"],"explain":"a) Sai: thể thao dành cho mọi người. b) Đúng: as well as boys. c) Đúng: win gold medals. d) Đúng: trong bài.","points":1},{"type":"truefalse","level":"VDC","q":"Read the passage and decide whether the statements are True (T) or False (F). True gender equality needs action from everyone. Schools should teach students to respect both sexes. Companies must pay men and women equally. Families should share housework fairly. When everyone works together, equality will become real.","statements":["a) Only governments need to act for gender equality.","b) Schools should teach respect for both sexes.","c) Companies must pay men and women equally.","d) Families should share housework fairly."],"answer":["F","T","T","T"],"explain":"a) Sai: cần hành động từ mọi người (everyone). b) Đúng: trong bài. c) Đúng: pay men and women equally. d) Đúng: share housework fairly.","points":1},{"type":"speaking","level":"VDC","q":"Đọc to câu sau","target":"Everyone should be treated with respect","explain":"Đọc to, rõ ràng, chú ý: treated /ˈtriːtɪd/, respect.","points":1}]}]}
