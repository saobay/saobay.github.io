loại trừ lẫn nhau (từ khóa \"hoặc\").","Có $5$ chiếc áo và $7$ chiếc quần thì có $5 + 7 = 12$ cách chọn một bộ quần áo."],"answer":["T","T","T","F"],"explain":"a) Đúng (quy tắc cộng). b) Đúng (quy tắc nhân). c) Đúng. d) Sai: chọn một bộ quần áo gồm hai công đoạn liên tiếp nên phải nhân: $5 \\times 7 = 35$ cách.","points":1},{"type":"truefalse","level":"TH","q":"Mỗi nhận định sau là đúng hay sai?","statements":["Khai triển $(x + 3)^{10}$ có hệ số của $x^{9}$ bằng $196830$.","Tổng các hệ số trong khai triển $(x + 1)^{10}$ bằng $2^{10} = 1024$.","$C_{10}^{0} - C_{10}^{1} + C_{10}^{2} - \\dots + (-1)^{10} C_{10}^{10} = 0$.","Số hạng thứ hai trong khai triển $(x + y)^{10}$ là $11x^{9}y$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $T_2 = C_{10}^{1} x^{9} \\cdot 3 = 196830x^{9}$. b) Đúng: thay $x = 1$. c) Đúng: thay $a = 1, b = -1$. d) Sai: số hạng thứ hai là $C_{10}^{1} x^{9} y = 10x^{9}y$.","points":1},{"type":"short","level":"VD","q":"Tính giá trị của biểu thức $S = A_{5}^{2} + C_{5}^{2}$.","answer":"$30$","explain":"$A_{5}^{2} = 20$, $C_{5}^{2} = 10$ nên $S = 20 + 10 = 30$.","points":0.5},{"type":"short","level":"VDC","q":"Có bao nhiêu số tự nhiên có $6$ chữ số khác nhau và chia hết cho $10$?","answer":"$15120$","explain":"Tận cùng $= 0$: $9 \\times P(8, 4) = 15120$ số.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Bạn An muốn mua một món đồ dùng học tập. Cửa hàng có 7 quả bóng đá và 4 quả bóng chuyền. Hỏi An có bao nhiêu cách chọn một món?","options":["A. $11$","B. $12$","C. $3$","D. $28$"],"answer":"A","explain":"Hai phương án loại trừ nhau (chọn cái này thì thôi cái kia) nên dùng quy tắc cộng: $7 + 4 = 11$ cách.","points":0.25},{"type":"mcq","level":"NB","q":"Số các hoán vị của 11 phần tử là","options":["A. $39916799$","B. $39916801$","C. $110$","D. $39916800$"],"answer":"D","explain":"$P_{11} = 11! = 39916800$.","points":0.25},{"type":"mcq","level":"TH","q":"Một lớp có 5 học sinh giỏi Toán, 2 học sinh giỏi Văn và 5 học sinh giỏi Anh (mỗi học sinh chỉ giỏi một môn). Cần chọn một học sinh đi dự hội nghị. Hỏi có bao nhiêu cách chọn?","options":["A. $13$","B. $12$","C. $50$","D. $15$"],"answer":"B","explain":"Ba nhóm loại trừ nhau nên dùng quy tắc cộng: $5 + 2 + 5 = 12$ cách.","points":0.25},{"type":"mcq","level":"TH","q":"Từ 12 học sinh, có bao nhiêu cách chọn 3 bạn vào đội tình nguyện (không phân biệt vai trò)?","options":["A. $1320$","B. $220$","C. $36$","D. $225$"],"answer":"B","explain":"Không phân biệt thứ tự nên là tổ hợp: $C_{12}^{3} = 220$ cách.","points":0.25},{"type":"mcq","level":"VD","q":"Từ 16 vận động viên, chọn $3$ người xếp hạng Nhất, Nhì, Ba. Có bao nhiêu cách?","options":["A. $48$","B. $3360$","C. $3376$","D. $560$"],"answer":"B","explain":"Có phân biệt thứ tự (hạng Nhất khác hạng Nhì) nên là chỉnh hợp: $A_{16}^{3} = 16 \\times 15 \\times 14 = 3360$ cách.","points":0.25},{"type":"mcq","level":"VDC","q":"Số hạng không chứa $x$ trong khai triển $\\left(x + \\frac{4}{x}\\right)^{4}$ bằng","options":["A. $96$","B. $192$","C. $6$","D. $100$"],"answer":"A","explain":"$T_{k+1} = C_{4}^{k} x^{4-k} \\cdot \\left(\\frac{4}{x}\\right)^{k} = C_{4}^{k} \\cdot 4^{k} \\cdot x^{4-2k}$. Không chứa $x$ khi $4 - 2k = 0 \\Rightarrow k = 2$. Số hạng cần tìm: $C_{4}^{2} \\cdot 4^{2} = 96$.","points":0.25},{"type":"truefalse","level":"NB","q":"Mỗi nhận định sau về quy tắc đếm là đúng hay sai?","statements":["Nếu công việc $A$ có $3$ cách và công việc $B$ (loại trừ với $A$) có $9$ cách thì có $3 + 9 = 12$ cách thực hiện $A$ hoặc $B$.","Nếu công việc gồm hai công đoạn liên tiếp với $3$ và $9$ cách thì có $3 \\times 9 = 27$ cách.","Quy tắc cộng áp dụng khi các phương án loại trừ lẫn nhau (từ khóa \"hoặc\").","Có $3$ chiếc áo và $9$ chiếc quần thì có $3 + 9 = 12$ cách chọn một bộ quần áo."],"answer":["T","T","T","F"],"explain":"a) Đúng (quy tắc cộng). b) Đúng (quy tắc nhân). c) Đúng. d) Sai: chọn một bộ quần áo gồm hai công đoạn liên tiếp nên phải nhân: $3 \\times 9 = 27$ cách.","points":1},{"type":"truefalse","level":"TH","q":"Mỗi nhận định sau là đúng hay sai?","statements":["Khai triển $(x + 2)^{10}$ có hệ số của $x^{9}$ bằng $5120$.","Tổng các hệ số trong khai triển $(x + 1)^{10}$ bằng $2^{10} = 1024$.","$C_{10}^{0} - C_{10}^{1} + C_{10}^{2} - \\dots + (-1)^{10} C_{10}^{10} = 0$.","Số hạng thứ hai trong khai triển $(x + y)^{10}$ là $11x^{9}y$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $T_2 = C_{10}^{1} x^{9} \\cdot 2 = 5120x^{9}$. b) Đúng: thay $x = 1$. c) Đúng: thay $a = 1, b = -1$. d) Sai: số hạng thứ hai là $C_{10}^{1} x^{9} y = 10x^{9}y$.","points":1},{"type":"short","level":"VD","q":"Tính giá trị của biểu thức $S = A_{9}^{3} - C_{9}^{3}$.","answer":"$420$","explain":"$A_{9}^{3} = 504$, $C_{9}^{3} = 84$ nên $S = 504 - 84 = 420$.","points":0.5},{"type":"short","level":"VDC","q":"Có bao nhiêu số tự nhiên lẻ có $3$ chữ số khác nhau?","answer":"$320$","explain":"Tận cùng $\\in \\{1, 3, 5, 7, 9\\}$ ($5$ cách), chữ số đầu $8$ cách (khác $0$ và khác tận cùng), các chữ số giữa $P(8, 1)$ cách: $5 \\times 8 \\times P(8, 1) = 320$ số.","points":0.5}]}]}</script>
