<script type="application/json" class="saobay-exam10-data">{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Khai triển $(a + b)^{5}$ có bao nhiêu số hạng?","options":["A. $7$","B. $6$","C. $5$","D. $10$"],"answer":"B","explain":"Khai triển $(a + b)^n$ có $n + 1$ số hạng, ứng với $k = 0, 1, \\dots, n$. Với $n = 5$ có $6$ số hạng.","points":0.25},{"type":"mcq","level":"NB","q":"Số hạng đầu tiên trong khai triển $(x + y)^{8}$ là","options":["A. $x^{8}$","B. $x^{7}y$","C. $y^{8}$","D. $8x^{8}$"],"answer":"A","explain":"Số hạng đầu ứng với $k = 0$: $T_1 = C_{8}^{0} x^{8} y^0 = x^{8}$.","points":0.25},{"type":"mcq","level":"TH","q":"Hệ số của $x^{3}$ trong khai triển $(x + 3)^{6}$ bằng","options":["A. $20$","B. $543$","C. $1080$","D. $540$"],"answer":"D","explain":"$T_{j+1} = C_{6}^{j} x^{6-j} \\cdot 3^{j}$. Cho $6 - j = 3 \\Rightarrow j = 3$. Hệ số: $C_{6}^{3} \\cdot 3^{3} = 540$.","points":0.25},{"type":"mcq","level":"TH","q":"Số hạng thứ $5$ trong khai triển $(a + b)^{8}$ là","options":["A. $T_{5} = A_{8}^{4} a^{4} b^{4}$","B. $T_{5} = C_{8}^{5} a^{3} b^{5}$","C. $T_{4} = C_{8}^{4} a^{4} b^{4}$","D. $T_{5} = C_{8}^{4} a^{4} b^{4}$"],"answer":"D","explain":"Số hạng thứ $(k+1)$ là $T_{k+1} = C_n^k a^{n-k} b^k$. Với thứ $5$ ($k = 4$) và $n = 8$: $T_{5} = C_{8}^{4} a^{4} b^{4}$.","points":0.25},{"type":"mcq","level":"VD","q":"Hệ số của $x^{1}$ trong khai triển $(3x + 2)^{5}$ bằng","options":["A. $240$","B. $15$","C. $80$","D. $241$"],"answer":"A","explain":"$T_{k+1} = C_{5}^{k} (3x)^{5-k} \\cdot 2^{k}$. Số mũ của $x$ là $5 - k = 1 \\Rightarrow k = 4$. Hệ số: $C_{5}^{4} \\cdot 3^{1} \\cdot 2^{4} = 240$.","points":0.25},{"type":"mcq","level":"VDC","q":"Số hạng không chứa $x$ trong khai triển $\\left(x + \\frac{2}{x}\\right)^{6}$ bằng","options":["A. $20$","B. $320$","C. $162$","D. $160$"],"answer":"D","explain":"$T_{k+1} = C_{6}^{k} x^{6-k} \\cdot \\left(\\frac{2}{x}\\right)^{k} = C_{6}^{k} \\cdot 2^{k} \\cdot x^{6-2k}$. Không chứa $x$ khi $6 - 2k = 0 \\Rightarrow k = 3$. Số hạng cần tìm: $C_{6}^{3} \\cdot 2^{3} = 160$.","points":0.25},{"type":"truefalse","level":"NB","q":"Mỗi nhận định sau về nhị thức Newton là đúng hay sai?","statements":["Khai triển $(a + b)^{6}$ có $7$ số hạng.","Số hạng tổng quát của $(a + b)^{6}$ là $T_{k+1} = C_{6}^{k} a^{6-k} b^k$.","Trong mỗi số hạng của khai triển, tổng số mũ của $a$ và $b$ luôn bằng $6$.","Hệ số của số hạng đầu tiên trong khai triển $(a + b)^{6}$ bằng $6$."],"answer":["T","T","T","F"],"explain":"a) Đúng ($n + 1$ số hạng). b) Đúng (công thức). c) Đúng ($(n-k) + k = n$). d) Sai: số hạng đầu là $C_n^0 a^n = a^n$, hệ số bằng $1$.","points":1},{"type":"truefalse","level":"TH","q":"Mỗi nhận định sau là đúng hay sai?","statements":["Khai triển $(x + 3)^{4}$ có hệ số của $x^{3}$ bằng $108$.","Tổng các hệ số trong khai triển $(x + 1)^{4}$ bằng $2^{4} = 16$.","$C_{4}^{0} - C_{4}^{1} + C_{4}^{2} - \\dots + (-1)^{4} C_{4}^{4} = 0$.","Số hạng thứ hai trong khai triển $(x + y)^{4}$ là $5x^{3}y$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $T_2 = C_{4}^{1} x^{3} \\cdot 3 = 108x^{3}$. b) Đúng: thay $x = 1$. c) Đúng: thay $a = 1, b = -1$. d) Sai: số hạng thứ hai là $C_{4}^{1} x^{3} y = 4x^{3}y$.","points":1},{"type":"short","level":"VD","q":"Tính tổng các hệ số trong khai triển $(2x + 1)^{11}$.","answer":"$177147$","explain":"Tổng các hệ số $=$ giá trị của khai triển tại $x = 1$: $(2 \\cdot 1 + 1)^{11} = 3^{11} = 177147$.","points":0.5},{"type":"short","level":"VDC","q":"Biết tổng các hệ số trong khai triển $(x + 1)^n$ bằng $1024$. Tìm $n$.","answer":"$10$","explain":"Tổng các hệ số $= (1 + 1)^n = 2^n = 1024 \\Rightarrow n = 10$.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Khai triển $(a + b)^{7}$ có bao nhiêu số hạng?","options":["A. $8$","B. $7$","C. $9$","D. $14$"],"answer":"A","explain":"Khai triển $(a + b)^n$ có $n + 1$ số hạng, ứng với $k = 0, 1, \\dots, n$. Với $n = 7$ có $8$ số hạng.","points":0.25},{"type":"mcq","level":"NB","q":"Số hạng đầu j}$. Cho $5 - j = 2 \\Rightarrow j = 3$. Hệ số: $C_{5}^{3} \\cdot 2^{3} = 80$.","points":0.25},{"type":"mcq","level":"TH","q":"Số hạng thứ $8$ trong khai triển $(a + b)^{8}$ là","options":["A. $T_{8} = C_{8}^{7} a^{7} b^{1}$","B. $T_{8} = C_{8}^{7} a^{1} b^{7}$","C. $T_{8} = A_{8}^{7} a^{1} b^{7}$","D. $T_{7} = C_{8}^{7} a^{1} b^{7}$"],"answer":"B","explain":"Số hạng thứ $(k+1)$ là $T_{k+1} = C_n^k a^{n-k} b^k$. Với thứ $8$ ($k = 7$) và $n = 8$: $T_{8} = C_{8}^{7} a^{1} b^{7}$.","points":0.25},{"type":"mcq","level":"VD","q":"Hệ số của $x^{3}$ trong khai triển $(2x + 1)^{6}$ bằng","options":["A. $20$","B. $160$","C. $80$","D. $161$"],"answer":"B","explain":"$T_{k+1} = C_{6}^{k} (2x)^{6-k} \\cdot 1^{k}$. Số mũ của $x$ là $6 - k = 3 \\Rightarrow k = 3$. Hệ số: $C_{6}^{3} \\cdot 2^{3} \\cdot 1^{3} = 160$.","points":0.25},{"type":"mcq","level":"VDC","q":"Số hạng không chứa $x$ trong khai triển $\\left(x + \\frac{2}{x}\\right)^{10}$ bằng","options":["A. $8066$","B. $8064$","C. $252$","D. $16128$"],"answer":"B","explain":"$T_{k+1} = C_{10}^{k} x^{10-k} \\cdot \\left(\\frac{2}{x}\\right)^{k} = C_{10}^{k} \\cdot 2^{k} \\cdot x^{10-2k}$. Không chứa $x$ khi $10 - 2k = 0 \\Rightarrow k = 5$. Số hạng cần tìm: $C_{10}^{5} \\cdot 2^{5} = 8064$.","points":0.25},{"type":"truefalse","level":"NB","q":"Mỗi nhận định sau về nhị thức Newton là đúng hay sai?","statements":["Khai triển $(a + b)^{14}$ có $15$ số hạng.","Số hạng tổng quát của $(a + b)^{14}$ là $T_{k+1} = C_{14}^{k} a^{14-k} b^k$.","Trong mỗi số hạng của khai triển, tổng số mũ của $a$ và $b$ luôn bằng $14$.","Hệ số của số hạng đầu tiên trong khai triển $(a + b)^{14}$ bằng $14$."],"answer":["T","T","T","F"],"explain":"a) Đúng ($n + 1$ số hạng). b) Đúng (công thức). c) Đúng ($(n-k) + k = n$). d) Sai: số hạng đầu là $C_n^0 a^n = a^n$, hệ số bằng $1$.","points":1},{"type":"truefalse","level":"TH","q":"Mỗi nhận định sau là đúng hay sai?","statements":["Khai triển $(x + 2)^{5}$ có hệ số của $x^{4}$ bằng $80$.","Tổng các hệ số trong w k = 5$. Hệ số: $C_{6}^{5} \\cdot 3^{1} \\cdot 3^{5} = 4374$.","points":0.25},{"type":"mcq","level":"VDC","q":"Số hạng không chứa $x$ trong khai triển $\\left(x + \\frac{2}{x}\\right)^{8}$ bằng","options":["A. $70$","B. $1122$","C. $1120$","D. $2240$"],"answer":"C","explain":"$T_{k+1} = C_{8}^{k} x^{8-k} \\cdot \\left(\\frac{2}{x}\\right)^{k} = C_{8}^{k} \\cdot 2^{k} \\cdot x^{8-2k}$. Không chứa $x$ khi $8 - 2k = 0 \\Rightarrow k = 4$. Số hạng cần tìm: $C_{8}^{4} \\cdot 2^{4} = 1120$.","points":0.25},{"type":"truefalse","level":"NB","q":"Mỗi nhận định sau về nhị thức Newton là đúng hay sai?","statements":["Khai triển $(a + b)^{7}$ có $8$ số hạng.","Số hạng tổng quát của $(a + b)^{7}$ là $T_{k+1} = C_{7}^{k} a^{7-k} b^k$.","Trong mỗi số hạng của khai triển, tổng số mũ của $a$ và $b$ luôn bằng $7$.","Hệ số của số hạng đầu tiên trong khai triển $(a + b)^{7}$ bằng $7$."],"answer":["T","T","T","F"],"explain":"a) Đúng ($n + 1$ số hạng). b) Đúng (công thức). c) Đúng ($(n-k) + k = n$). d) Sai: số hạng đầu là $C_n^0 a^n = a^n$, hệ số bằng $1$.","points":1},{"type":"truefalse","level":"TH","q":"Mỗi nhận định sau là đúng hay sai?","statements":["Khai triển $(x + 2)^{4}$ có hệ số của $x^{3}$ bằng $32$.","Tổng các hệ số trong khai triển $(x + 1)^{4}$ bằng $2^{4} = 16$.","$C_{4}^{0} - C_{4}^{1} + C_{4}^{2} - \\dots + (-1)^{4} C_{4}^{4} = 0$.","Số hạng thứ hai trong khai triển $(x + y)^{4}$ là $5x^{3}y$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $T_2 = C_{4}^{1} x^{3} \\cdot 2 = 32x^{3}$. b) Đúng: thay $x = 1$. c) Đúng: thay $a = 1, b = -1$. d) Sai: số hạng thứ hai là $C_{4}^{1} x^{3} y = 4x^{3}y$.","points":1},{"type":"short","level":"VD","q":"Tính tổng các hệ số trong khai triển $(3x + 1)^{4}$.","answer":"$256$","explain":"Tổng các hệ số $=$ giá trị của khai triển tại $x = 1$: $(3 \\cdot 1 + 1)^{4} = 4^{4} = 256$.","points":0.5},{"type":"short","level":"VDC","q":"Biết tổng các hệ số trong khai triển $(x + 1)^n$ bằng $32768$. Tìm $n$.","answer":"$15$","explain":"Tổng các
