","D. $\\dfrac{2}{3}$"],"answer":"A","explain":"$n(\\Omega) = 6$, $n(A) = 2$: $P(A) = \\frac{2}{6} = \\dfrac{1}{3}$.","points":0.25},{"type":"mcq","level":"VD","q":"Một xạ thủ bắn $1$ phát đạn với xác suất trúng đích là $0{,}9$. Xác suất xạ thủ bắn trượt là","options":["A. $0{,}9$","B. $0{,}8$","C. $0{,}1$","D. $0{,}2$"],"answer":"C","explain":"Biến cố đối: $P(\\overline{A}) = 1 - P(A) = 1 - 0{,}9 = 0{,}1$.","points":0.25},{"type":"mcq","level":"VDC","q":"Hộp có 4 bi đỏ, 3 bi xanh và 2 bi vàng. Lấy ngẫu nhiên $1$ viên. Tính xác suất lấy được bi đỏ hoặc bi xanh.","options":["A. $\\dfrac{7}{9}$","B. $\\dfrac{7}{4}$","C. $\\dfrac{2}{9}$","D. $\\dfrac{4}{9}$"],"answer":"A","explain":"Gọi $A$: \"được bi đỏ hoặc bi xanh\", $n(A) = 4 + 3 = 7$, $n(\\Omega) = 9$: $P(A) = \\dfrac{7}{9}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Mỗi nhận định sau là đúng hay sai?","statements":["Hộp có 2 bi đỏ và 7 bi xanh; lấy ngẫu nhiên $1$ viên thì $n(\\Omega) = 9$.","Biến cố \"lấy được bi đỏ\" có $2$ kết quả thuận lợi.","Xác suất lấy được bi đỏ là $\\dfrac{2}{9}$.","Biến cố \"lấy được bi vàng\" là biến cố chắc chắn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo định nghĩa. d) Sai: trong hộp không có bi vàng nên đó là biến cố không thể.","points":1},{"type":"truefalse","level":"TH","q":"Mỗi nhận định sau là đúng hay sai?","statements":["Hộp có 3 bi đỏ, 2 bi xanh; lấy ngẫu nhiên $1$ viên thì $n(\\Omega) = 5$.","Xác suất lấy được bi đỏ là $\\frac{2}{5}$.","Biến cố đối của \"lấy được bi đỏ\" là \"lấy được bi xanh\".","Xác suất lấy được bi xanh là $1 - \\frac{3}{5} = \\dfrac{2}{5}$."],"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai: $P = \\frac{n(A)}{n(\\Omega)} = \\frac{3}{5}$. c) Đúng (chỉ có hai màu). d) Đúng: $P(\\overline{A}) = 1 - P(A)$.","points":1},{"type":"short","level":"VD","q":"Hộp có 7 bi đỏ và 8 bi xanh. Lấy ngẫu nhiên $1$ viên. Tính xác suất lấy được bi xanh.","answer":"$\\dfrac{8}{15}$","explain":"$n(\\Omega) = 15$, $n(A) = 8$: $P = \\dfrac{8}{15}$.","points":0.5},{"type":"short","level":"VDC","q":"Hộp có 4 bi đỏ và 4 bi xanh. Lấy ngẫu nhiên $1$ viên. Tính xác suất lấy được bi đỏ (viết phân số tối giản).","answer":"$\\dfrac{1}{2}$","explain":"$P = \\frac{4}{8} = \\frac{1}{2}$ (chia cả tử và mẫu cho $4$).","points":0.5}]}]}</script>
