"type":"truefalse","level":"TH","q":"Mỗi nhận định sau là đúng hay sai?","statements":["Tung 5 đồng xu cân đối thì $n(\\Omega) = 32$.","Biến cố đối của \"ít nhất một mặt ngửa\" là \"cả 5 mặt đều sấp\".","Xác suất \"cả 5 mặt đều sấp\" bằng $\\dfrac{1}{5}$.","Xác suất \"ít nhất một mặt ngửa\" bằng $1 - \\dfrac{1}{32} = \\dfrac{31}{32}$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $2^{5} = 32$. b) Đúng. c) Sai: chỉ có $1$ kết quả thuận lợi trong $32$ kết quả. d) Đúng: $P(A) = 1 - P(\\overline{A})$.","points":1},{"type":"short","level":"VD","q":"Hộp có 3 bi đỏ, 5 bi xanh và 7 bi vàng. Lấy ngẫu nhiên $1$ viên. Tính xác suất lấy được bi vàng.","answer":"$\\dfrac{7}{15}$","explain":"$n(\\Omega) = 15$, $n(A) = 7$: $P = \\dfrac{7}{15}$.","points":0.5},{"type":"short","level":"VDC","q":"Hộp có 6 bi đỏ và 5 bi xanh. Lấy ngẫu nhiên đồng thời $2$ viên. Tính xác suất cả hai viên đều màu đỏ.","answer":"$\\dfrac{3}{11}$","explain":"$n(\\Omega) = C_{11}^{2} = 55$; $n(A) = C_{6}^{2} = 15$: $P = \\dfrac{3}{11}$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Rút ngẫu nhiên $1$ lá bài từ bộ bài tú lơ khơ $52$ lá. Tính xác suất rút được lá $Q$.","options":["A. $\\dfrac{1}{2}$","B. $\\dfrac{1}{13}$","C. $\\dfrac{1}{52}$","D. $\\dfrac{1}{4}$"],"answer":"B","explain":"$n(\\Omega) = 52$, $n(A) = 4$: $P = \\frac{4}{52} = \\dfrac{1}{13}$.","points":0.25},{"type":"mcq","level":"NB","q":"Gieo hai con xúc xắc cân đối. Tính xác suất tổng số chấm bằng $9$.","options":["A. $\\dfrac{2}{9}$","B. $\\dfrac{1}{6}$","C. $\\dfrac{1}{9}$","D. $\\dfrac{1}{36}$"],"answer":"C","explain":"Số cặp có tổng bằng $9$ là $4$; $n(\\Omega) = 36$: $P = \\dfrac{1}{9}$.","points":0.25},{"type":"mcq","level":"TH","q":"Hộp có 4 bi đỏ và 6 bi xanh. Lấy ngẫu nhiên lần lượt $2$ viên (không hoàn lại). Tính xác suất cả hai viên đều đỏ.","options":["A. $\\dfrac{1}{3}$","B. $\\dfrac{2}{15}$","C. $\\dfrac{1}{2}$","D. $\\dfrac{2}{5}$"],"answer":"B","explain":"$P = \\frac{4}{10} \\times \\frac{3}{9} = \\dfrac{2}{15}$.","points":0.25},{"type":"mcq","level":"TH","q":"Tung 3 đồng xu cân đối. Tính xác suất có ít nhất một mặt ngửa.","options":["A. $\\dfrac{7}{8}$","B. $\\dfrac{1}{2}$","C. $\\dfrac{7}{9}$","D. $\\dfrac{1}{8}$"],"answer":"A","explain":"$\\overline{A}$: \"cả 3 mặt đều sấp\", $P(\\overline{A}) = \\frac{1}{8}$. Vậy $P(A) = 1 - \\frac{1}{8} = \\dfrac{7}{8}$.","points":0.25},{"type":"mcq","level":"VD","q":"Rút ngẫu nhiên $2$ lá bài từ bộ bài $52$ lá. Tính xác suất hai lá khác chất.","options":["A. $\\dfrac{1}{4}$","B. $\\dfrac{1}{13}$","C. $\\dfrac{1}{17}$","D. $\\dfrac{13}{17}$"],"answer":"D","explain":"$n(\\Omega) = C_{52}^{2} = 1326$; $n(A) = C_{52}^{2} - 4C_{13}^{2} = 1014$: $P = \\dfrac{13}{17}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Hộp có 4 bi đỏ và 6 bi xanh. Lấy ngẫu nhiên đồng thời $2$ viên. Tính xác suất hai viên khác màu.","options":["A. $\\dfrac{2}{5}$","B. $\\dfrac{1}{2}$","C. $\\dfrac{8}{15}$","D. $\\dfrac{7}{15}$"],"answer":"C","explain":"$n(\\Omega) = C_{10}^{2} = 45$; $n(A) = 4 \\times 6 = 24$ (1 đỏ và 1 xanh): $P = \\dfrac{8}{15}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Mỗi nhận định sau là đúng hay sai?","statements":["Muốn tính xác suất theo định nghĩa cổ điển, trước hết phải mô tả không gian mẫu $\\Omega$ và tính $n(\\Omega)$.","Hộp có 5 bi đỏ, 5 bi xanh; lấy $1$ viên thì $n(\\Omega) = 10$.","Xác suất lấy được bi đỏ là $P = \\frac{n(A)}{n(\\Omega)}$ với $n(A) = 5$.","Xác suất của một biến cố có thể lớn hơn $1$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo phương pháp và định nghĩa. d) Sai: $0 \\le P(A) \\le 1$.","points":1},{"type":"truefalse","level":"TH","q":"Mỗi nhận định sau là đúng hay sai?","statements":["Hộp có 8 bi đỏ, 6 bi xanh; lấy lần lượt $2$ viên (không hoàn lại) thì $n(\\Omega) = 14 \\times 13 = 182$.","Xác suất cả hai viên đều đỏ là $\\dfrac{4}{7} \\times \\dfrac{7}{13} = \\dfrac{4}{13}$.","Biến cố đối của \"cả hai viên đều đỏ\" là \"cả hai viên đều xanh\".","\"Lấy lần lượt không hoàn lại\" và \"lấy đồng thời\" cho cùng xác suất."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: biến cố đối là \"ít nhất một viên xanh\" (gồm cả trường hợp $1$ đỏ $1$ xanh). d) Đúng.","points":1},{"type":"short","level":"VD","q":"Tung bốn đồng xu cân đối. Tính xác suất có đúng 3 mặt ngửa.","answer":"$\\dfrac{1}{4}$","explain":"$n(\\Omega) = 2^4 = 16$, số kết quả có đúng 3 mặt ngửa là $C_4^{3} = 4$: $P = \\dfrac{1}{4}$.","points":0.5},{"type":"short","level":"VDC","q":"Hộp có 4 bi đỏ và 9 bi xanh. Lấy ngẫu nhiên đồng thời $2$ viên. Tính xác suất cả hai viên đều màu đỏ.","answer":"$\\dfrac{1}{13}$","explain":"$n(\\Omega) = C_{13}^{2} = 78$; $n(A) = C_{4}^{2} = 6$: $P = \\dfrac{1}{13}$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Rút ngẫu nhiên $1$ lá bài từ bộ bài tú lơ khơ $52$ lá. Tính xác suất rút được chất bích.","options":["A. $\\dfrac{1}{4}$","B. $\\dfrac{1}{2}$","C. $\\dfrac{1}{52}$","D. $\\dfrac{1}{13}$"],"answer":"A","explain":"$n(\\Omega) = 52$, $n(A) = 13$: $P = \\frac{13}{52} = \\dfrac{1}{4}$.","points":0.25},{"type":"mcq","level":"NB","q":"Gieo hai con xúc xắc cân đối. Tính xác suất tổng số chấm bằng $2$.","options":["A. $\\dfrac{1}{6}$","B. $\\dfrac{1}{72}$","C. $\\dfrac{1}{18}$","D. $\\dfrac{1}{36}$"],"answer":"D","explain":"Số cặp có tổng bằng $2$ là $1$; $n(\\Omega) = 36$: $P = \\dfrac{1}{36}$.","points":0.25},{"type":"mcq","level":"TH","q":"Hộp có 6 bi đỏ và 3 bi xanh. Lấy ngẫu nhiên lần lượt $2$ viên (không hoàn lại). Tính xác suất cả hai viên đều đỏ.","options":["A. $\\dfrac{5}{8}$","B. $\\dfrac{5}{12}$","C. $\\dfrac{1}{2}$","D. $\\dfrac{2}{3}$"],"answer":"B","explain":"$P = \\frac{6}{9} \\times \\frac{5}{8} = \\dfrac{5}{12}$.","points":0.25},{"type":"mcq","level":"TH","q":"Tung 3 đồng xu cân đối. Tính xác suất tất cả đều là mặt sấp.","options":["A. $\\dfrac{1}{8}$","B. $\\dfrac{3}{8}$","C. $\\dfrac{7}{8}$","D. $\\dfrac{1}{2}$"],"answer":"A","explain":"Chỉ có $1$ trường hợp thuận lợi trên $2^{3} = 8$ trường hợp: $P = \\dfrac{1}{8}$.","points":0.25},{"type":"mcq","level":"VD","q":"Rút ngẫu nhiên $2$ lá bài từ bộ bài $52$ lá. Tính xác suất cả hai lá đều là $10$.","options":["A. $\\dfrac{1}{221}$","B. $\\dfrac{1}{13}$","C. $\\dfrac{1}{4}$","D. $\\dfrac{1}{17}$"],"answer":"A","explain":"$n(\\Omega) = C_{52}^{2} = 1326$; $n(A) = C_4^2 = 6$: $P = \\dfrac{1}{221}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Hộp có 8 bi đỏ và 6 bi xanh. Lấy ngẫu nhiên đồng thời $2$ viên. Tính xác suất hai viên khác màu.","options":["A. $\\dfrac{1}{2}$","B. $\\dfrac{48}{91}$","C. $\\dfrac{43}{91}$","D. $\\dfrac{4}{7}$"],"answer":"B","explain":"$n(\\Omega) = C_{14}^{2} = 91$; $n(A) = 8 \\times 6 = 48$ (1 đỏ và 1 xanh): $P = \\dfrac{48}{91}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Mỗi nhận định sau là đúng hay sai?","statements":["Muốn tính xác suất theo định nghĩa cổ điển, trước hết phải mô tả không gian mẫu $\\Omega$ và tính $n(\\Omega)$.","Hộp có 3 bi đỏ, 3 bi xanh; lấy $1$ viên thì $n(\\Omega) = 6$.","Xác suất lấy được bi đỏ là $P = \\frac{n(A)}{n(\\Omega)}$ với $n(A) = 3$.","Xác suất của một biến cố có thể lớn hơn $1$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo phương pháp và định nghĩa. d) Sai: $0 \\le P(A) \\le 1$.","points":1},{"type":"truefalse","level":"TH","q":"Mỗi nhận định sau là đúng hay sai?","statements":["Tung 4 đồng xu cân đối thì $n(\\Omega) = 16$.","Biến cố đối của \"ít nhất một mặt ngửa\" là \"cả 4 mặt đều sấp\".","Xác suất \"cả 4 mặt đều sấp\" bằng $\\dfrac{1}{16}$.","Xác suất \"ít nhất một mặt ngửa\" bằng $1 - \\dfrac{1}{16} = \\dfrac{15}{16}$."],"answer":["T","T","T","T"],"explain":"a) Đúng: $2^{4} = 16$. b) Đúng. c) Đúng. d) Đúng: $P(A) = 1 - P(\\overline{A})$.","points":1},{"type":"short","level":"VD","q":"Tung bốn đồng xu cân đối. Tính xác suất có đúng 0 mặt ngửa.","answer":"$\\dfrac{1}{16}$","explain":"$n(\\Omega) = 2^4 = 16$, số kết quả có đúng 0 mặt ngửa là $C_4^{0} = 1$: $P = \\dfrac{1}{16}$.","points":0.5},{"type":"short","level":"VDC","q":"Hộp có 7 bi đỏ và 4 bi xanh. Lấy ngẫu nhiên đồng thời $2$ viên. Tính xác suất cả hai viên đều màu xanh.","answer":"$\\dfrac{6}{55}$","explain":"$n(\\Omega) = C_{11}^{2} = 55$; $n(A) = C_{4}^{2} = 6$: $P = \\dfrac{6}{55}$.","points":0.5}]}]}</script>
