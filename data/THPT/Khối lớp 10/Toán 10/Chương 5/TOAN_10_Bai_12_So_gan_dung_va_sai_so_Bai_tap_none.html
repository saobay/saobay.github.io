0{,}0002$."], "answer": "A", "explain": "Vì $0{,}0001 \\lt d = 0{,}0002 \\lt 0{,}001$ nên hàng quy tròn là hàng phần nghìn; $0{,}0345 \\approx 0{,}035$ (chữ số sau là $5$). Độ chính xác của số quy tròn bằng nửa đơn vị hàng phần nghìn là $0{,}0005$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về quy tắc làm tròn:", "statements": ["a) Làm tròn $4{,}49$ đến hàng phần mười được $4{,}5$.", "b) Làm tròn $4{,}44$ đến hàng phần mười được $4{,}4$.", "c) Quy tròn $15\\,500$ đến hàng nghìn được $16\\,000$.", "d) Quy tròn $2{,}05$ đến hàng phần mười được $2{,}0$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: chữ số sau là $9 \\ge 5$. b) Đúng: chữ số sau là $4 \\lt 5$. c) Đúng: chữ số sau hàng nghìn là $5 \\ge 5$ nên $15\\,500 \\approx 16\\,000$. d) Sai: chữ số sau là $5 \\ge 5$ nên $2{,}05 \\approx 2{,}1$.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho $\\overline{a} = 100 \\pm 3$. Xét tính đúng, sai:", "statements": ["a) Số quy tròn của $a = 100$ với độ chính xác $d = 3$ là $100$.", "b) Sai số tương đối không vượt quá $3\\%$.", "c) Muốn $\\delta_a \\le 1\\%$ thì cần độ chính xác $d \\le 1$.", "d) Giá trị đúng $\\overline{a}$ chắc chắn bằng $100$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $d = 3$ thì hàng quy tròn là hàng chục, $100$ giữ nguyên. b) Đúng: $3/100 = 3\\%$. c) Đúng: cần $d/100 \\le 0{,}01$, tức $d \\le 1$. d) Sai: chỉ biết $97 \\le \\overline{a} \\le 103$.", "points": 1}, {"type": "short", "level": "NB", "q": "Cho $\\overline{a} = 9{,}8 \\pm 0{,}3$. Giá trị nhỏ nhất có thể của $\\overline{a}$ là bao nhiêu?", "answer": "9,5", "explain": "$\\overline{a} \\ge 9{,}8 - 0{,}3 = 9{,}5$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Muốn sai số tương đối của số gần đúng $a = 250$ không vượt quá $0{,}5\\%$ thì độ chính xác $d$ tối đa cho phép là bao nhiêu?", "answer": "1,25", "explain": "Cần $\\dfrac{d}{250} \\le 0{,}005$, suy ra $d \\le 250 \\times 0{,}005 = 1{,}25$.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các số sau, số nào có thể là số gần đúng của $\\pi = 3{,}14159\\ldots$?", "options": ["A. $3{,}14$.", "B. $2{,}71$.", "C. $4{,}00$.", "D. $3{,}50$."], "answer": "A", "explain": "$3{,}14$ gần với $\\pi$ (sai số tuyệt đối khoảng $0{,}0016$); các số còn lại chênh lệch quá lớn nên không thể là số gần đúng hợp lí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Viết $\\overline{a} = 20 \\pm 0{,}5$ dưới dạng đoạn, ta được", "options": ["A. $[19{,}5;\\,20{,}5]$.", "B. $[19;\\,21]$.", "C. $[20;\\,20{,}5]$.", "D. $[19{,}5;\\,20]$."], "answer": "A", "explain": "$\\overline{a} = 20 \\pm 0{,}5$ nghĩa là $20 - 0{,}5 \\le \\overline{a} \\le 20 + 0{,}5$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số gần đúng $a = 6{,}3$ với độ chính xác $d = 0{,}2$. Sai số tương đối không vượt quá", "options": ["A. $3{,}17\\%$.", "B. $31{,}7\\%$.", "C. $0{,}317\\%$.", "D. $1{,}26\\%$."], "answer": "A", "explain": "$\\delta_a \\le \\dfrac{0{,}2}{6{,}3} \\approx 0{,}0317 = 3{,}17\\%$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quy tròn số $87{,}65$ đến hàng đơn vị ta được", "options": ["A. $87$.", "B. $88$.", "C. $87{,}6$.", "D. $87{,}7$."], "answer": "B", "explain": "Chữ số ngay sau hàng đơn vị là $6 \\ge 5$ nên cộng thêm $1$ vào hàng đơn vị: $87{,}65 \\approx 88$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đo một hình chữ nhật: chiều dài $12{,}5\\,\\text{m} \\pm 0{,}1\\,\\text{m}$, chiều rộng $8\\,\\text{m} \\pm 0{,}1\\,\\text{m}$. Phép đo nào có chất lượng cao hơn?", "options": ["A. Đo chiều dài.", "B. Đo chiều rộng.", "C. Hai phép đo có chất lượng như nhau.", "D. Không so sánh được."], "answer": "A", "explain": "$\\delta_{\\text{dài}} \\le 0{,}1/12{,}5 = 0{,}8\\%$; $\\delta_{\\text{rộng}} \\le 0{,}1/8 = 1{,}25\\%$. Sai số tương đối của phép đo chiều dài nhỏ hơn nên chất lượng cao hơn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho số gần đúng $a = 2{,}71828$ với độ chính xác $d = 0{,}0004$. Số quy tròn của $a$ là", "options": ["A. $2{,}72$.", "B. $2{,}718$.", "C. $2{,}7183$.", "D. $2{,}7$."], "answer": "B", "explain": "Vì $0{,}0001 \\lt d = 0{,}0004 \\lt 0{,}001$ nên hàng quy tròn là hàng phần nghìn; chữ số sau là $2 \\lt 5$ nên $2{,}71828 \\approx 2{,}718$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\overline{a} = a \\pm d$ nghĩa là $|\\overline{a} - a| \\le d$.", "b) Độ chính xác $d$ là một số âm.", "c) Mọi số gần đúng đều có thể viết dưới dạng $a \\pm d$ khi biết độ chính xác.", "d) $\\Delta_a = |\\overline{a} - a|$ luôn không âm."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng theo định nghĩa. b) Sai: $d$ là số dương. c) Đúng: đó chính là quy ước viết. d) Đúng vì giá trị tuyệt đối không âm.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Quy tròn số $a = 45\\,678$ với độ chính xác $d = 60$. Xét tính đúng, sai:", "statements": ["a) Hàng quy tròn là hàng trăm.", "b) Số quy tròn là $45\\,700$.", "c) Độ chính xác của số quy tròn là $50$.", "d) Sai số tuyệt đối của số quy tròn so với $a$ là $22$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $10 \\lt d = 60 \\lt 100$ nên hàng quy tròn là hàng trăm. b) Đúng: chữ số sau hàng trăm là $7 \\ge 5$ nên $45\\,678 \\approx 45\\,700$. c) Đúng: nửa đơn vị hàng trăm là $50$. d) Đúng: $|45\\,678 - 45\\,700| = 22 \\le 50$.", "points": 1}, {"type": "short", "level": "TH", "q": "Quy tròn số $5{,}678$ đến hàng phần mười ta được bao nhiêu?", "answer": "5,7", "explain": "Chữ số ngay sau hàng phần mười là $7 \\ge 5$ nên $5{,}678 \\approx 5{,}7$.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Đo thời gian một con lắc dao động được $a = 2{,}0\\,\\text{s}$ với độ chính xác $d = 0{,}05\\,\\text{s}$. Sai số tương đối không vượt quá bao nhiêu phần trăm?", "answer": "2,5", "explain": "$\\delta_a \\le \\dfrac{0{,}05}{2{,}0} = 0{,}025 = 2{,}5\\%$.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Sai số tương đối $\\delta_a$ thường được viết dưới dạng", "options": ["A. số thập phân.", "B. phần trăm.", "C. phân số.", "D. số nguyên."], "answer": "B", "explain": "Trong thực hành, người ta thường viết sai số tương đối dưới dạng phần trăm, ví dụ $0{,}5\\%$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quy tròn số $999$ đến hàng trăm ta được", "options": ["A. $900$.", "B. $1\\,000$.", "C. $990$.", "D. $1\\,100$."], "answer": "B", "explain": "Chữ số ngay sau hàng trăm là $9 \\ge 5$ nên cộng thêm $1$ vào hàng trăm: $999 \\approx 1\\,000$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $\\overline{a} = 50 \\pm 2$. Phát biểu nào sau đây sai?", "options": ["A. $48 \\le \\overline{a} \\le 52$.", "B. $\\Delta_a \\le 2$.", "C. $\\delta_a \\le 4\\%$.", "D. $\\overline{a} = 50$."], "answer": "D", "explain": "A đúng ($50 \\pm 2$); B đúng (định nghĩa độ chính xác); C đúng ($2/50 = 4\\%$); D sai vì chỉ biết $\\overline{a}$ nằm trong $[48;\\,52]$, chưa chắc bằng $50$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số quy tròn của $a = 7\\,654$ với độ chính xác $d = 40$ là", "options": ["A. $7\\,650$.", "B. $7\\,700$.", "C. $7\\,600$.", "D. $8\\,000$."], "answer": "B", "explain": "Vì $10 \\lt d = 40 \\lt 100$ nên hàng quy tròn là hàng trăm; chữ số sau hàng trăm là $5 \\ge 5$ nên $7\\,654 \\approx 7\\,700$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một cửa hàng báo cáo doanh thu tháng là $250$ triệu đồng $\\pm\\,5$ triệu đồng. Sai số tương đối không vượt quá", "options": ["A. $2\\%$.", "B. $0{,}2\\%$.", "C. $20\\%$.", "D. $5\\%$."], "answer": "A", "explain": "$\\delta_a \\le \\dfrac{5}{250} = 0{,}02 = 2\\%$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Biết $a = 1{,}4142$ là số gần đúng của $\\sqrt{2}$ với độ chính xác $d = 0{,}0001$. Khẳng định đúng là", "options": ["A. $\\Delta_a \\gt d$.", "B. $\\delta_a \\approx 0{,}001\\%$.", "C. Số quy tròn của $a$ với $d = 0{,}0001$ là $1{,}41$.", "D. $\\overline{a} \\lt 1{,}4141$."], "answer": "B", "explain": "$\\Delta_a = |\\sqrt{2} - 1{,}4142| \\approx 0{,}0000136 \\le d$ nên A sai. $\\delta_a \\approx 0{,}0000136/1{,}4142 \\approx 0{,}00096\\% \\approx 0{,}001\\%$ nên B đúng. Hàng quy tròn là hàng phần nghìn nên số quy tròn là $1{,}414$, C sai. $\\overline{a} = \\sqrt{2} \\approx 1{,}41421 \\gt 1{,}4141$ nên D sai.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số $3{,}1416$ là số quy tròn của $\\pi$ đến hàng phần chục nghìn.", "b) $|\\pi - 3{,}1416| \\lt 0{,}00005$.", "c) Mọi số gần đúng đều có sai số tuyệt đối bằng $0$.", "d) Độ chính xác $d$ phải là một số dương."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $\\pi \\approx 3{,}14159$ làm tròn đến hàng phần chục nghìn được $3{,}1416$. b) Đúng: $|\\pi - 3{,}1416| \\approx 0{,}0000073 \\lt 0{,}00005$. c) Sai: sai số tuyệt đối bằng $0$ chỉ khi $a = \\overline{a}$. d) Đúng theo định nghĩa.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Một sân vận động có sức chứa $\\overline{a} = 20\\,000 \\pm 500$ (chỗ ngồi). Xét tính đúng, sai:", "statements": ["a) Số quy tròn của $20\\,000$ với độ chính xác $d = 500$ là $20\\,000$.", "b) Sai số tương đối không vượt quá $2{,}5\\%$.", "c) Sức chứa thực tế ít nhất $19\\,500$ chỗ.", "d) Nếu $d = 50$ thì số quy tròn vẫn là $20\\,000$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $100 \\lt d = 500 \\lt 1\\,000$ nên hàng quy tròn là hàng nghìn, $20\\,000$ giữ nguyên. b) Đúng: $500/20\\,000 = 2{,}5\\%$. c) Đúng: $\\overline{a} \\ge 20\\,000 - 500$. d) Đúng: $d = 50$ thì hàng quy tròn là hàng trăm, $20\\,000$ giữ nguyên.", "points": 1}, {"type": "short", "level": "TH", "q": "Quy tròn số $0{,}125$ đến hàng phần trăm ta được bao nhiêu?", "answer": "0,13", "explain": "Chữ số ngay sau hàng phần trăm là $5 \\ge 5$ nên $0{,}125 \\approx 0{,}13$.", "points": 0.5}, {"type": "short", \text{m} \\pm 1\\,\\text{m}$.", "C. $50\\,\\text{m} \\pm 10\\,\\text{m}$.", "D. $500\\,\\text{m} \\pm 100\\,\\text{m}$."], "answer": "A", "explain": "Độ dài thật: $5 \\times 10\\,000 = 50\\,000\\,\\text{cm} = 500\\,\\text{m}$; độ chính xác thật: $0{,}1 \\times 10\\,000 = 1\\,000\\,\\text{cm} = 10\\,\\text{m}$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho $a = 0{,}999$ với độ chính xác $d = 0{,}002$. Phát biểu đúng là", "options": ["A. Số quy tròn của $a$ là $0{,}99$.", "B. Số quy tròn của $a$ là $1{,}00$.", "C. Sai số tuyệt đối $\\Delta_a = 0{,}002$.", "D. $\\overline{a} \\lt 0{,}997$."], "answer": "B", "explain": "Vì $0{,}001 \\lt d = 0{,}002 \\lt 0{,}01$ nên hàng quy tròn là hàng phần trăm; chữ số sau là $9 \\ge 5$ nên $0{,}999 \\approx 1{,}00$. C sai vì chỉ biết $\\Delta_a \\le 0{,}002$; D sai vì $\\overline{a} \\ge 0{,}997$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho số gần đúng $a = 12{,}6$ với độ chính xác $d = 0{,}3$. Xét tính đúng, sai:", "statements": ["a) $\\overline{a} \\in [12{,}3;\\,12{,}9]$.", "b) Hàng quy tròn là hàng đơn vị.", "c) Số quy tròn là $13$.", "d) $\\delta_a \\le \\dfrac{0{,}3}{12{,}6} \\lt 2{,}4\\%$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $12{,}6 \\pm 0{,}3$. b) Đúng: $0{,}1 \\lt d = 0{,}3 \\lt 1$. c) Đúng: chữ số sau hàng đơn vị là $6 \\ge 5$. d) Đúng: $0{,}3/12{,}6 \\approx 2{,}38\\% \\lt 2{,}4\\%$.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho hai số gần đúng $a = 200 \\pm 4$ và $b = 300 \\pm 9$. Xét tính đúng, sai:", "statements": ["a) $\\delta_a \\le 2\\%$.", "b) $\\delta_b \\le 3\\%$.", "c) $a$ chính xác tương đối hơn $b$.", "d) Tổng $a + b$ có độ chính xác không vượt quá $13$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $4/200 = 2\\%$. b) Đúng: $9/300 = 3\\%$. c) Đúng vì $2\\% \\lt 3\\%$. d) Đúng: $|(\\overline{a}+\\overline{b}) - (a+b)| \\le |\\overline{a}-a| + |\\overline{b}-b| \\le 4 + 9 = 13$.", "points": 1}, {"type": "short", "level": "NB", "q": "Viết gọn: giá trị đúng $\\overline{a}$ thỏa $4{,}8 \\le \\overline{a} \\le 5{,}2$ dưới dạng $a \\pm d$ (viết công thức đầy đủ trong $...$).", "answer": "$5 \\pm 0,2$", "explain": "Tâm đoạn là $a = (4{,}8 + 5{,}2)/2 = 5$, nửa độ dài là $d = 0{,}2$, nên $\\overline{a} = 5 \\pm 0{,}2$.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Cân một vật được $a = 2{,}5\\,\\text{kg}$ với độ chính xác $d = 0{,}02\\,\\text{kg}$. Sai số tương đối không vượt quá bao nhiêu phần trăm?", "answer": "0,8", "explain": "$\\delta_a \\le \\dfrac{0{,}02}{2{,}5} = 0{,}008 = 0{,}8\\%$.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Kí hiệu $\\delta_a$ là", "options": ["A. sai số tuyệt đối.", "B. sai số tương đối.", "C. độ chính xác.", "D. giá trị đúng."], "answer": "B", "explain": "$\\delta_a$ là kí hiệu của sai số tương đối: $\\delta_a = \\Delta_a / |\\overline{a}|$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quy tròn số $0{,}046$ đến hàng phần trăm ta được", "options": ["A. $0{,}04$.", "B. $0{,}05$.", "C. $0{,}046$.", "D. $0{,}1$."], "answer": "B", "explain": "Chữ số ngay sau hàng phần trăm là $6 \\ge 5$ nên $0{,}046 \\approx 0{,}05$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $a = 3{,}2 \\pm 0{,}05$. Khẳng định sai là", "options": ["A. $3{,}15 \\le \\overline{a} \\le 3{,}25$.", "B. $\\Delta_a \\le 0{,}05$.", "C. $\\delta_a \\le 1{,}5625\\%$.", "D. Số quy tròn của $a$ với $d = 0{,}5$ là $3{,}2$."], "answer": "D", "explain": "A đúng ($3{,}2 \\pm 0{,}05$); B đúng; C đúng ($0{,}05/3{,}2 = 1{,}5625\\%$); D sai vì $d = 0{,}5$ thì hàng quy tròn là hàng đơn vị, số quy tròn là $3$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số quy tròn của $a = 9\\,876$ với độ chính xác $d = 250$ là", "options": ["A. $9\\,900$.", "B. $9\\,800$.", "C. $10\\,000$.", "D. $9\\,000$."], "answer": "C", "explain": "Vì $100 \\lt d = 250 \\lt 1\\,000$ nên hàng quy tròn là hàng nghìn; chữ số sau hàng nghìn là $8 \\ge 5$ nên $9\\,876 \\approx 10\\,000$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhiệt độ trong phòng đo được $25^{\\circ}\\text{C} \\pm 0{,}5^{\\circ}\\text{C}$; nhiệt độ ngoài trời đo được $35^{\\circ}\\text{C} \\pm 0{,}5^{\\circ}\\text{C}$. Phép đo nào cho chất lượng cao hơn?", "options": ["A. Đo trong phòng.", "B. Đo ngoài trời.", "C. Hai phép đo như nhau.", "D. Không xác định được."], "answer": "B", "explain": "$\\delta_{\\text{phòng}} \\le 0{,}5/25 = 2\\%$; $\\delta_{\\text{ngoài}} \\le 0{,}5/35 \\approx 1{,}43\\%$. Sai số tương đối của phép đo ngoài trời nhỏ hơn nên chất lượng cao hơn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Số $a = \\dfrac{50}{7} = 7{,}142857\\ldots$ được quy tròn đến hàng phần trăm thành $7{,}14$. Độ chính xác của số quy tròn này là", "options": ["A. $0{,}01$.", "B. $0{,}005$.", "C. $0{,}002$.", "D. $0{,}05$."], "answer": "B", "explain": "Độ chính xác của số quy tròn bằng nửa đơn vị của hàng quy tròn (hàng phần trăm): $0{,}01/2 = 0{,}005$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho $a = 150 \\pm 10$. Xét tính đúng, sai:", "statements": ["a) Hàng quy tròn là hàng trăm.", "b) Số quy tròn là $200$.", "c) $\\delta_a \\le \\dfrac{10}{150} \\approx 6{,}67\\%$.", "d) $\\overline{a} \\in [140;\\,160]$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $d = 10$ không nhỏ hơn $10$ nên hàng quy tròn là hàng trăm. b) Đúng: chữ số sau hàng trăm là $5 \\ge 5$ nên $150 \\approx 200$. c) Đúng. d) Đúng: $150 \\pm 10$.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho $a = 1{,}2345$ với độ chính xác $d = 0{,}0003$. Xét tính đúng, sai:", "statements": ["a) Hàng quy tròn là hàng phần nghìn.", "b) Số quy tròn là $1{,}235$.", "c) Độ chính xác của số quy tròn là $0{,}0005$, lớn hơn $d$.", "d) Mọi chữ số của số quy tròn $1{,}235$ đều là chữ số chắc."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $0{,}0001 \\lt d \\lt 0{,}001$. b) Đúng: chữ số sau là $5 \\ge 5$. c) Đúng: nửa đơn vị hàng phần nghìn là $0{,}0005 \\gt 0{,}0003$. d) Đúng: với độ chính xác $0{,}0005$, các hàng đơn vị, phần mười, phần trăm, phần nghìn đều có nửa đơn vị $\\ge 0{,}0005$.", "points": 1}, {"type": "short", "level": "TH", "q": "Quy tròn số $6{,}789$ đến hàng phần mười ta được bao nhiêu?", "answer": "6,8", "explain": "Chữ số ngay sau hàng phần mười là $8 \\ge 5$ nên $6{,}789 \\approx 6{,}8$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Số gần đúng $a = 50{,}05$ với độ chính xác $d = 0{,}06$. Có bao nhiêu chữ số chắc của $a$?", "answer": "2", "explain": "Hàng đơn vị (nửa đơn vị $0{,}5 \\ge 0{,}06$) chắc; hàng phần mười (nửa đơn vị $0{,}05 \\lt 0{,}06$) không chắc. Vậy có $2$ chữ số chắc là $5$ và $0$.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Công thức đánh giá sai số tương đối thường dùng trong thực hành là", "options": ["A. $\\delta_a \\le \\dfrac{d}{|a|}$.", "B. $\\delta_a \\ge \\dfrac{d}{|a|}$.", "C. $\\delta_a = d \\cdot |a|$.", "D. $\\delta_a = d + |a|$."], "answer": "A", "explain": "Vì không biết $\\overline{a}$ nên ta đánh giá $\\delta_a = \\dfrac{\\Delta_a}{|\\overline{a}|} \\le \\dfrac{d}{|a|}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quy tròn số $5\\,555$ đến hàng trăm ta được", "options": ["A. $5\\,500$.", "B. $5\\,600$.", "C. $6\\,000$.", "D. $5\\,550$."], "answer": "B", "explain": "Chữ số ngay sau hàng trăm là $5 \\ge 5$ nên $5\\,555 \\approx 5\\,600$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $a = 0{,}9 \\pm 0{,}02$. Số quy tròn của $a$ là", "options": ["A. $0{,}9$.", "B. $1{,}0$.", "C. $0{,}90$.", "D. $0{,}92$."], "answer": "A", "explain": "Vì $0{,}01 \\lt d = 0{,}02 \\lt 0{,}1$ nên hàng quy tròn là hàng phần mười: $0{,}9$ giữ nguyên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sai số tương đối của $a = 4$ với $d = 0{,}1$ không vượt quá", "options": ["A. $2{,}5\\%$.", "B. $0{,}25\\%$.", "C. $25\\%$.", "D. $4\\%$."], "answer": "A", "explain": "$\\delta_a \\le \\dfrac{0{,}1}{4} = 0{,}025 = 2{,}5\\%$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một công ty báo cáo lợi nhuận $1{,}2$ tỉ đồng $\\pm\\,0{,}05$ tỉ đồng. Sai số tương đối không vượt quá", "options": ["A. $4{,}17\\%$.", "B. $0{,}417\\%$.", "C. $41{,}7\\%$.", "D. $6\\%$."], "answer": "A", "explain": "$\\delta_a \\le \\dfrac{0{,}05}{1{,}2} \\approx 0{,}0417 = 4{,}17\\%$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Biết $\\overline{a} = 10{,}00 \\pm 0{,}03$. Muốn viết lại số gần đúng với độ chính xác $d' = 0{,}1$ thì số quy tròn là", "options": ["A. $10{,}0$.", "B. $10$.", "C. $9$.", "D. $11$."], "answer": "B", "explain": "Với $d' = 0{,}1$ thì hàng quy tròn là hàng đơn vị (vì $0{,}1$ không nhỏ hơn $0{,}1$); $10{,}00$ làm tròn đến hàng đơn vị được $10$.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Đo hai đoạn thẳng: (1) $a_1 = 200\\,\\text{cm}$, $d_1 = 1\\,\\text{cm}$; (2) $a_2 = 2\\,\\text{m}$, $d_2 = 1\\,\\text{cm}$. Xét tính đúng, sai:", "statements": ["a) Hai phép đo có cùng độ chính xác tuyệt đối.", "b) $\\delta_{a_1} \\le 0{,}5\\%$.", "c) $\\delta_{a_2} \\le 0{,}5\\%$.", "d) Phép đo (2) cho biết độ dài thật chính xác hơn phép đo (1)."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: cùng $d = 1\\,\\text{cm}$. b) Đúng: $1/200 = 0{,}5\\%$. c) Đúng: $2\\,\\text{m} = 200\\,\\text{cm}$, $1/200 = 0{,}5\\%$. d) Sai: hai phép đo thực chất là một, chất lượng như nhau.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho $a = 3{,}146 \\pm 0{,}004$. Xét tính đúng, sai:", "statements": ["a) Hàng quy tròn là hàng phần trăm.", "b) Số quy tròn là $3{,}15$.", "c) Độ chính xác của số quy tròn ($0{,}005$) lớn hơn $d$.", "d) $\\delta_a \\le \\dfrac{0{,}004}{3{,}146} \\lt 0{,}13\\%$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $0{,}001 \\lt d = 0{,}004 \\lt 0{,}01$. b) Đúng: chữ số sau là $6 \\ge 5$. c) Đúng: $0{,}005 \\gt 0{,}004$. d) Đúng: $0{,}004/3{,}146 \\approx 0{,}127\\% \\lt 0{,}13\\%$.", "points": 1}, {"type": "short", "level": "VD", "q": "Quy tròn số $8\\,888$ với độ chính xác $d = 90$ ta được bao nhiêu (viết liền không dấu cách)?", "answer": "8900", "explain": "Vì $10 \\lt d = 90 \\lt 100$ nên hàng quy tròn là hàng trăm; chữ số sau hàng trăm là $8 \\ge 5$ nên $8\\,888 \\approx 8\\,900$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Muốn sai số tương đối của số gần đúng $a = 80$ không vượt quá $0{,}25\\%$ thì độ chính xác $d$ tối đa cho phép là bao nhiêu?", "answer": "0,2", "explain": "Cần $\\dfrac{d}{80} \\le 0{,}0025$, suy ra $d \\le 80 \\times 0{,}0025 = 0{,}2$.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Khi thay số đúng bởi số quy tròn đến một hàng nào đó, độ chính xác của số quy tròn bằng", "options": ["A. một đơn vị của hàng quy tròn.", "B. nửa đơn vị của hàng quy tròn.", "C. gấp đôi đơn vị của hàng quy tròn.", "D. $0$."], "answer": "B", "explain": "Nhận xét: sai số tuyệt đối của số quy tròn không vượt quá nửa đơn vị của hàng quy tròn, nên có thể lấy độ chính xác bằng nửa đơn vị của hàng quy tròn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quy tròn số $123{,}456$ đến hàng chục ta được", "options": ["A. $120$.", "B. $130$.", "C. $123$.", "D. $123{,}5$."], "answer": "A", "explain": "Chữ số ngay sau hàng chục là $3 \\lt 5$ nên $123{,}456 \\approx 120$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $a = 72 \\pm 5$. Khẳng định đúng là", "options": ["A. $67 \\le \\overline{a} \\le 77$.", "B. $\\delta_a = \\dfrac{5}{72}$.", "C. Số quy tròn của $a$ là $72$.", "D. $\\overline{a} = 72$."], "answer": "A", "explain": "A đúng ($72 \\pm 5$). B sai vì chỉ có $\\delta_a \\le 5/72$. C sai vì $d = 5$ thì hàng quy tròn là hàng chục, số quy tròn là $70$. D sai vì chưa chắc $\\overline{a} = 72$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số quy tròn của $a = 0{,}505$ với độ chính xác $d = 0{,}004$ là", "options": ["A. $0{,}50$.", "B. $0{,}51$.", "C. $0{,}5$.", "D. $0{,}505$."], "answer": "B", "explain": "Vì $0{,}001 \\lt d = 0{,}004 \\lt 0{,}01$ nên hàng quy tròn là hàng phần trăm; chữ số sau là $5 \\ge 5$ nên $0{,}505 \\approx 0{,}51$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Dân số một thành phố là $1\\,200\\,000 \\pm 10\\,000$ (người). Sai số tương đối không vượt quá", "options": ["A. $0{,}83\\%$.", "B. $8{,}3\\%$.", "C. $0{,}083\\%$.", "D. $1{,}2\\%$."], "answer": "A", "explain": "$\\delta_a \\le \\dfrac{10\\,000}{1\\,200\\,000} \\approx 0{,}00833 = 0{,}83\\%$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho hai số gần đúng $x = 1{,}5 \\pm 0{,}1$ và $y = 2{,}5 \\pm 0{,}1$. Đánh giá nào sau đây đúng về hiệu $x - y$?", "options": ["A. $(x - y) = -1{,}0 \\pm 0{,}2$.", "B. $(x - y) = -1{,}0 \\pm 0{,}1$.", "C. Sai số tương đối của hiệu không vượt quá $10\\%$.", "D. Giá trị đúng của hiệu bằng $-1$."], "answer": "A", "explain": "$|(\\overline{x}-\\overline{y}) - (x-y)| \\le |\\overline{x}-x| + |\\overline{y}-y| \\le 0{,}1 + 0{,}1 = 0{,}2$, và $(x - y) = -1{,}0$ nên hiệu là $-1{,}0 \\pm 0{,}2$. C sai vì $0{,}2/1{,}0 = 20\\%$.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Cho $a = 60 \\pm 4$. Xét tính đúng, sai:", "statements": ["a) $\\overline{a} \\in [56;\\,64]$.", "b) Số quy tròn của $a$ là $60$.", "c) $\\delta_a \\le \\dfrac{4}{60} \\approx 6{,}67\\%$.", "d) Nếu $d = 40$ thì số quy tròn là $100$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $60 \\pm 4$. b) Đúng: $d = 4$ thì hàng quy tròn là hàng chục, $60$ giữ nguyên. c) Đúng. d) Đúng: $d = 40$ thì hàng quy tròn là hàng trăm, $60 \\approx 100$.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho $a = 2{,}5 \\pm 0{,}15$. Xét tính đúng, sai:", "statements": ["a) Hàng quy tròn là hàng đơn vị.", "b) Số quy tròn là $3$.", "c) Độ chính xác của số quy tròn là $0{,}5$.", "d) Chữ số $2$ của $a$ là chữ số chắc."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $0{,}1 \\lt d = 0{,}15 \\lt 1$. b) Đúng: chữ số sau hàng đơn vị là $5 \\ge 5$ nên $2{,}5 \\approx 3$. c) Đúng: nửa đơn vị hàng đơn vị là $0{,}5$. d) Đúng: nửa đơn vị hàng đơn vị $0{,}5 \\ge d = 0{,}15$ nên chữ số $2$ chắc.", "points": 1}, {"type": "short", "level": "VD", "q": "Quy tròn số $4\\,444$ với độ chính xác $d = 350$ ta được bao nhiêu (viết liền không dấu cách)?", "answer": "4000", "explain": "Vì $100 \\lt d = 350 \\lt 1\\,000$ nên hàng quy tròn là hàng nghìn; chữ số sau hàng nghìn là $4 \\lt 5$ nên $4\\,444 \\approx 4\\,000$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Số gần đúng $a = 9{,}99$ với độ chính xác $d = 0{,}02$. Có bao nhiêu chữ số chắc của $a$?", "answer": "3", "explain": "Hàng đơn vị (nửa đơn vị $0{,}5 \\ge 0{,}02$) chắc; hàng phần mười (nửa đơn vị $0{,}05 \\ge 0{,}02$) chắc; hàng phần trăm (nửa đơn vị $0{,}005 \\lt 0{,}02$) không chắc. Vậy có $3$ chữ số chắc.", "points": 0.5}]}]}
