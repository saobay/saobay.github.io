u.", "B. số trung bình của mẫu số liệu.", "C. mốt của mẫu số liệu.", "D. giá trị lớn nhất của mẫu."], "answer": "A", "explain": "Theo định nghĩa, $Q_2$ chính là trung vị $M_e$ của mẫu số liệu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $10;\\, 20;\\, 30;\\, 40$. Tứ phân vị thứ nhất $Q_1$ là", "options": ["A. $15$.", "B. $20$.", "C. $25$.", "D. $10$."], "answer": "A", "explain": "$n = 4$ chẵn; nửa số liệu bên trái là $10;\\, 20$ nên $Q_1 = (10 + 20)/2 = 15$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khảo sát số giờ tự học mỗi tuần của 5 bạn: $1;\\, 2;\\, 2;\\, 3;\\, 7$ (giờ). Nên dùng số đặc trưng nào làm đại diện cho mẫu?", "options": ["A. Trung vị.", "B. Số trung bình.", "C. Mốt.", "D. Giá trị lớn nhất."], "answer": "A", "explain": "Mẫu có giá trị bất thường $7$ làm số trung bình ($3$ giờ) bị kéo lên cao; trung vị $2$ giờ phản ánh đúng mức tự học điển hình.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho mẫu số liệu đã sắp xếp: $2;\\, 5;\\, 7;\\, 9;\\, 12;\\, 15;\\, 18$ ($n = 7$). Các tứ phân vị là", "options": ["A. $Q_1 = 5;\\, Q_2 = 9;\\, Q_3 = 15$.", "B. $Q_1 = 5;\\, Q_2 = 9;\\, Q_3 = 12$.", "C. $Q_1 = 7;\\, Q_2 = 9;\\, Q_3 = 15$.", "D. $Q_1 = 2;\\, Q_2 = 9;\\, Q_3 = 18$."], "answer": "A", "explain": "$Q_2 = 9$ (vị trí thứ $4$). Nửa trái $2;\\,5;\\,7$ cho $Q_1 = 5$; nửa phải $12;\\,15;\\,18$ cho $Q_3 = 15$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tiền lương (triệu đồng) của 7 người: $6;\\, 7;\\, 7;\\, 8;\\, 9;\\, 10;\\, 60$. Phát biểu đúng là", "options": ["A. Nên dùng số trung bình làm đại diện.", "B. Trung vị là $8$ và phản ánh tốt hơn số trung bình.", "C. Mốt của mẫu là $8$.", "D. Số trung bình nhỏ hơn trung vị."], "answer": "B", "explain": "$\\overline{x} = 107/7 \\approx 15{,}29$ bị giá trị $60$ kéo lên rất cao; $M_e = 8$ phản ánh đúng mức lương điển hình. Mốt là $7$ (xuất hiện $2$ lần) nên C sai; $\\overline{x} \\gt M_e$ nên D sai.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Muốn tìm trung vị, trước hết phải sắp xếp số liệu theo thứ tự không giảm.", "b) Khi $n$ chẵn, trung vị là giá trị đứng chính giữa dãy.", "c) Một mẫu số liệu có thể có nhiều mốt.", "d) Luôn có $Q_1 \\le Q_2 \\le Q_3$."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: $n$ chẵn thì trung vị là trung bình cộng của hai giá trị chính giữa. c) Đúng: khi nhiều giá trị cùng có tần số lớn nhất. d) Đúng theo cách xác định.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho mẫu số liệu: $4;\\, 4;\\, 5;\\, 6;\\, 6;\\, 6;\\, 7$. Xét tính đúng, sai:", "statements": ["a) Mốt của mẫu là $6$.", "b) Số trung bình của mẫu là $\\dfrac{38}{7}$.", "c) Trung vị của mẫu là $6$.", "d) $Q_3 = 6$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $6$ xuất hiện $3$ lần, nhiều nhất. b) Đúng: tổng $38$, $n = 7$. c) Đúng: vị trí thứ $4$ là $6$. d) Đúng: nửa phải là $6;\\,6;\\,7$ nên $Q_3 = 6$.", "points": 1}, {"type": "short", "level": "NB", "q": "Cho mẫu số liệu: $2;\\, 2;\\, 3;\\, 5$. Mốt của mẫu bằng bao nhiêu?", "answer": "2", "explain": "Giá trị $2$ xuất hiện $2$ lần, nhiều nhất nên $M_0 = 2$.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Cho mẫu số liệu đã sắp xếp: $5;\\, 8;\\, 10;\\, 12;\\, 15;\\, 20$ ($n = 6$). Tứ phân vị thứ ba $Q_3$ bằng bao nhiêu?", "answer": "15", "explain": "Nửa số liệu bên phải là $12;\\,15;\\,20$ nên $Q_3 = 15$.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Số trung bình của mẫu số liệu cho dưới dạng bảng tần số (giá trị $x_i$ có tần số $m_i$, $n = m_1 + \\ldots + m_k$) được tính bằng", "options": ["A. $\\overline{x} = \\dfrac{m_1x_1 + m_2x_2 + \\ldots + m_kx_k}{n}$.", "B. $\\overline{x} = m_1x_1 + m_2x_2 + \\ldots + m_kx_k$.", "C. $\\overline{x} = \\dfrac{x_1 + x_2 + \\ldots + x_k}{n}$.", "D. $\\overline{x} = \\dfrac{m_1 + m_2 + \\ldots + m_k}{n}$."], "answer": "A", "explain": "Đó chính là công thức số trung bình với bảng tần số.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi mẫu số liệu có giá trị bất thường (quá lớn hoặc quá nhỏ), nên dùng số đặc trưng nào làm đại diện?", "options": ["A. Trung vị.", "B. Số trung bình.", "C. Giá trị lớn nhất.", "D. Giá trị nhỏ nhất."], "answer": "A", "explain": "Trung vị không bị ảnh hưởng bởi các giá trị bất thường, còn số trung bình thì rất nhạy với chúng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $1;\\, 2;\\, 3;\\, 4;\\, 100$. Số trung bình và trung vị của mẫu lần lượt là", "options": ["A. $22$ và $3$.", "B. $22$ và $4$.", "C. $3$ và $22$.", "D. $20$ và $3$."], "answer": "A", "explain": "$\\overline{x} = 110/5 = 22$; $M_e = 3$ (vị trí thứ $3$). Giá trị $100$ kéo trung bình lên rất cao nhưng không ảnh hưởng trung vị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu đã sắp xếp: $3;\\, 6;\\, 9;\\, 12;\\, 15;\\, 18;\\, 21;\\, 24$ ($n = 8$). $Q_2$ bằng", "options": ["A. $13{,}5$.", "B. $12$.", "C. $15$.", "D. $13$."], "answer": "A", "explain": "$n = 8$ chẵn nên $Q_2 = M_e = (12 + 15)/2 = 13{,}5$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Điểm kiểm tra của 10 bạn: $5;\\, 6;\\, 7;\\, 7;\\, 8;\\, 8;\\, 8;\\, 9;\\, 9;\\, 10$. Mẫu số liệu có bao nhiêu mốt?", "options": ["A. $1$.", "B. $2$.", "C. $3$.", "D. $0$."], "answer": "A", "explain": "Giá trị $8$ xuất hiện $3$ lần, nhiều hơn mọi giá trị khác ($7$ và $9$ mỗi giá trị $2$ lần) nên chỉ có một mốt là $8$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mẫu số liệu có số trung bình $\\overline{x} = 10$ và $n = 5$. Nếu thêm giá trị $x_6 = 20$ vào mẫu thì số trung bình mới là", "options": ["A. $11{,}67$.", "B. $10$.", "C. $12$.", "D. $15$."], "answer": "A", "explain": "Tổng cũ là $5 \\times 10 = 50$; tổng mới là $70$ với $n = 6$ nên $\\overline{x}_{\\text{mới}} = 70/6 \\approx 11{,}67$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số trung bình sử dụng mọi giá trị của mẫu số liệu.", "b) Trung vị không bị ảnh hưởng bởi các giá trị bất thường.", "c) Mốt của mẫu số liệu luôn duy nhất.", "d) Tứ phân vị chia mẫu số liệu thành bốn phần có số lượng bằng nhau."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng theo công thức. b) Đúng: trung vị chỉ phụ thuộc vị trí giữa. c) Sai: có thể có nhiều mốt. d) Đúng theo định nghĩa.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho mẫu số liệu đã sắp xếp: $1;\\, 2;\\, 4;\\, 5;\\, 7;\\, 8;\\, 10;\\, 12;\\, 15$ ($n = 9$). Xét tính đúng, sai:", "statements": ["a) $Q_2 = 7$.", "b) $Q_1 = 3$.", "c) $Q_3 = 11$.", "d) $Q_3 - Q_1 = 8$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: vị trí thứ $5$ là $7$. b) Đúng: nửa trái $1;\\,2;\\,4;\\,5$ cho $Q_1 = (2+4)/2 = 3$. c) Đúng: nửa phải $8;\\,10;\\,12;\\,15$ cho $Q_3 = (10+12)/2 = 11$. d) Đúng: $11 - 3 = 8$.", "points": 1}, {"type": "short", "level": "NB", "q": "Cho mẫu số liệu: $10;\\, 20;\\, 30$. Trung vị của mẫu bằng bao nhiêu?", "answer": "20", "explain": "$n = 3$ lẻ, giá trị chính giữa là $20$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho mẫu số liệu $2;\\, 4;\\, 6;\\, 8;\\, 10$ có số trung bình bằng $6$. Nếu mỗi giá trị tăng thêm $3$ thì số trung bình mới bằng bao nhiêu?", "answer": "9", "explain": "Khi mỗi giá trị tăng thêm $3$ thì số trung bình cũng tăng thêm $3$: $6 + 3 = 9$.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Để tìm tứ phân vị của một mẫu số liệu, trước hết phải", "options": ["A. sắp xếp số liệu theo thứ tự không giảm.", "B. tính số trung bình của mẫu.", "C. tìm giá trị lớn nhất của mẫu.", "D. lập bảng tần số."], "answer": "A", "explain": "Tứ phân vị được xác định trên dãy số liệu đã sắp xếp theo thứ tự không giảm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mốt của mẫu số liệu cho biết", "options": ["A. giá trị xuất hiện nhiều lần nhất.", "B. giá trị ở chính giữa dãy.", "C. giá trị trung bình cộng.", "D. giá trị lớn nhất của mẫu."], "answer": "A", "explain": "Theo định nghĩa, mốt là giá trị có tần số lớn nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $6;\\, 8;\\, 10;\\, 12;\\, 14$. $Q_1$ và $Q_3$ lần lượt là", "options": ["A. $7$ và $13$.", "B. $8$ và $12$.", "C. $7$ và $12$.", "D. $8$ và $13$."], "answer": "A", "explain": "$Q_2 = 10$; nửa trái $6;\\,8$ cho $Q_1 = 7$; nửa phải $12;\\,14$ cho $Q_3 = 13$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số trung bình của mẫu số liệu: $2;\\, 4;\\, 4;\\, 6$ là", "options": ["A. $4$.", "B. $5$.", "C. $3$.", "D. $6$."], "answer": "A", "explain": "$\\overline{x} = (2 + 4 + 4 + 6)/4 = 16/4 = 4$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Chiều cao (cm) của 5 bạn: $150;\\, 155;\\, 160;\\, 165;\\, 200$. Số đặc trưng nào phản ánh đúng chiều cao điển hình nhất?", "options": ["A. Trung vị ($160\\,\\text{cm}$).", "B. Số trung bình ($166\\,\\text{cm}$).", "C. Giá trị lớn nhất ($200\\,\\text{cm}$).", "D. Giá trị nhỏ nhất ($150\\,\\text{cm}$)."], "answer": "A", "explain": "Giá trị $200$ là bất thường, kéo số trung bình lên $166$; trung vị $160$ phản ánh đúng chiều cao điển hình.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho bảng tần số: giá trị $5$ (tần số $4$), giá trị $6$ (tần số $6$), giá trị $7$ (tần số $5$). Số trung bình của mẫu là", "options": ["A. $6{,}07$.", "B. $6$.", "C. $6{,}5$.", "D. $5{,}93$."], "answer": "A", "explain": "$n = 15$; $\\overline{x} = (4\\cdot 5 + 6\\cdot 6 + 5\\cdot 7)/15 = 91/15 \\approx 6{,}07$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Q_2 = M_e$.", "b) Khi $n$ lẻ, tính $Q_1$ và $Q_3$ thì bỏ giá trị $Q_2$ ở giữa.", "c) Số trung bình luôn nằm giữa giá trị nhỏ nhất và giá trị lớn nhất của mẫu.", "d) Mốt là giá trị có tần số nhỏ nhất."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng theo quy tắc. c) Đúng vì trung bình cộng của các số nằm giữa min và max. d) Sai: mốt là giá trị có tần số lớn nhất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Cho mẫu số liệu: $8;\\, 3;\\, 5;\\, 12;\\, 7$ (chưa sắp xếp). Xét tính đúng, sai:", "statements": ["a) Sau khi sắp xếp theo thứ tự không giảm: $3;\\, 5;\\, 7;\\, 8;\\, 12$.", "b) Trung vị của mẫu là $7$.", "c) Số trung bình của mẫu là $7$.", "d) $Q_1 = 4$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng: vị trí thứ $3$. c) Đúng: tổng $35$, $n = 5$. d) Đúng: nửa trái $3;\\,5$ cho $Q_1 = 4$.", "points": 1}, {"type": "short", "level": "TH", "q": "Cho mẫu số liệu đã sắp xếp: $2;\\, 4;\\, 6;\\, 8;\\, 10;\\, 12$. $Q_1$ bằng bao nhiêu?", "answer": "4", "explain": "Nửa số liệu bên trái là $2;\\,4;\\,6$ nên $Q_1 = 4$.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Một mẫu số liệu có $n = 4$ và số trung bình bằng $15$. Tổng các giá trị của mẫu bằng bao nhiêu?", "answer": "60", "explain": "Tổng $= n \\times \\overline{x} = 4 \\times 15 = 60$.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Trung vị của mẫu số liệu được kí hiệu là", "options": ["A. $M_e$.", "B. $M_0$.", "C. $\\overline{x}$.", "D. $Q_1$."], "answer": "A", "explain": "Trung vị kí hiệu là $M_e$; $M_0$ là mốt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tứ phân vị của một mẫu số liệu gồm", "options": ["A. ba giá trị $Q_1, Q_2, Q_3$.", "B. hai giá trị $Q_1, Q_3$.", "C. bốn giá trị $Q_1, Q_2, Q_3, Q_4$.", "D. một giá trị $Q_2$."], "answer": "A", "explain": "Tứ phân vị gồm ba giá trị $Q_1, Q_2, Q_3$ chia mẫu thành bốn phần bằng nhau về số lượng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $9;\\, 7;\\, 5;\\, 3;\\, 1$. Trung vị của mẫu là", "options": ["A. $5$.", "B. $7$.", "C. $3$.", "D. $9$."], "answer": "A", "explain": "Sắp xếp: $1;\\,3;\\,5;\\,7;\\,9$; $n = 5$ lẻ nên $M_e = 5$ (vị trí thứ $3$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mốt của mẫu số liệu: $1;\\, 2;\\, 2;\\, 3;\\, 3;\\, 3;\\, 4$ là", "options": ["A. $3$.", "B. $2$.", "C. $4$.", "D. $1$."], "answer": "A", "explain": "Giá trị $3$ xuất hiện $3$ lần, nhiều nhất nên $M_0 = 3$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Số học sinh nghỉ học trong 8 tuần: $2;\\, 1;\\, 3;\\, 2;\\, 5;\\, 2;\\, 4;\\, 1$. Mốt và số trung bình của mẫu lần lượt là", "options": ["A. $2$ và $2{,}5$.", "B. $2$ và $2$.", "C. $1$ và $2{,}5$.", "D. $5$ và $2{,}5$."], "answer": "A", "explain": "$2$ xuất hiện $3$ lần (nhiều nhất) nên $M_0 = 2$; $\\overline{x} = 20/8 = 2{,}5$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mẫu số liệu $x_1, x_2, \\ldots, x_{10}$ có $\\overline{x} = 5$. Biết $x_1 + x_2 + \\ldots + x_9 = 40$. Giá trị $x_{10}$ là", "options": ["A. $10$.", "B. $5$.", "C. $40$.", "D. $50$."], "answer": "A", "explain": "Tổng $10$ giá trị là $10 \\times 5 = 50$ nên $x_{10} = 50 - 40 = 10$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số trung bình rất nhạy với các giá trị bất thường.", "b) Trung vị chia mẫu số liệu thành hai phần có số lượng bằng nhau.", "c) Mốt dùng được cho cả số liệu định tính.", "d) $Q_3$ là trung vị của nửa số liệu bên trái $Q_2$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng theo định nghĩa. c) Đúng: ví dụ màu sắc ưa thích nhất. d) Sai: $Q_3$ là trung vị của nửa bên phải $Q_2$.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Điểm 7 môn học của An: $8;\\, 9;\\, 7;\\, 10;\\, 8;\\, 9;\\, 8$. Xét tính đúng, sai:", "statements": ["a) Mốt của mẫu là $8$.", "b) Số trung bình của mẫu là $\\dfrac{59}{7}$.", "c) Trung vị của mẫu là $8$.", "d) $Q_1 = 8$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $8$ xuất hiện $3$ lần. b) Đúng: tổng $59$, $n = 7$. c) Đúng: sắp xếp $7;\\,8;\\,8;\\,8;\\,9;\\,9;\\,10$, vị trí thứ $4$ là $8$. d) Đúng: nửa trái $7;\\,8;\\,8$ cho $Q_1 = 8$.", "points": 1}, {"type": "short", "level": "TH", "q": "Cho mẫu số liệu đã sắp xếp: $4;\\, 6;\\, 8;\\, 10;\\, 12;\\, 14;\\, 16$. $Q_3$ bằng bao nhiêu?", "answer": "14", "explain": "$n = 7$; $Q_2 = 10$; nửa phải là $12;\\,14;\\,16$ nên $Q_3 = 14$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho mẫu số liệu đã sắp xếp: $3;\\, 5;\\, 7;\\, 9;\\, a$ ($a \\gt 9$) có trung vị bằng $7$ và số trung bình bằng $8$. Giá trị $a$ bằng bao nhiêu?", "answer": "16", "explain": "$(24 + a)/5 = 8$ suy ra $a = 16$ (thỏa $a \\gt 9$ và trung vị vẫn là $7$).", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Số trung bình của mẫu số liệu cho biết", "options": ["A. vị trí trung tâm (giá trị đại diện) của mẫu số liệu.", "B. giá trị xuất hiện nhiều nhất của mẫu.", "C. giá trị lớn nhất của mẫu.", "D. số lượng giá trị của mẫu."], "answer": "A", "explain": "Số trung bình là một trong các số đặc trưng đo xu thế trung tâm, cho biết giá trị đại diện của mẫu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trung vị của mẫu số liệu có $n = 10$ (đã sắp xếp theo thứ tự không giảm) được tính từ", "options": ["A. hai giá trị ở vị trí thứ $5$ và thứ $6$.", "B. giá trị ở vị trí thứ $5$.", "C. giá trị ở vị trí thứ $6$.", "D. hai giá trị ở vị trí thứ $4$ và thứ $5$."], "answer": "A", "explain": "$n = 10$ chẵn nên trung vị là trung bình cộng của hai giá trị chính giữa ở vị trí thứ $n/2 = 5$ và $n/2 + 1 = 6$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $15;\\, 10;\\, 5;\\, 20$. Số trung bình của mẫu là", "options": ["A. $12{,}5$.", "B. $10$.", "C. $15$.", "D. $11$."], "answer": "A", "explain": "$\\overline{x} = (15 + 10 + 5 + 20)/4 = 50/4 = 12{,}5$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mốt của mẫu số liệu: $5;\\, 5;\\, 6;\\, 6;\\, 7$ là", "options": ["A. $5$ và $6$.", "B. $5$.", "C. $6$.", "D. $7$."], "answer": "A", "explain": "Cả hai giá trị $5$ và $6$ đều xuất hiện $2$ lần (nhiều nhất) nên mẫu có hai mốt.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhiệt độ trung bình 7 ngày trong tuần ($^{\\circ}\\text{C}$): $28;\\, 30;\\, 29;\\, 31;\\, 30;\\, 32;\\, 30$. Mốt của mẫu là", "options": ["A. $30$.", "B. $28$.", "C. $31$.", "D. $29$."], "answer": "A", "explain": "Giá trị $30$ xuất hiện $3$ lần, nhiều nhất nên $M_0 = 30$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mẫu số liệu: $2;\\, 4;\\, 6;\\, 8$ có $\\overline{x} = 5$. Nếu gấp đôi mỗi giá trị của mẫu thì số trung bình mới là", "options": ["A. $10$.", "B. $5$.", "C. $7$.", "D. $20$."], "answer": "A", "explain": "Khi mỗi giá trị gấp đôi thì tổng gấp đôi nên số trung bình cũng gấp đôi: $5 \\times 2 = 10$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho mẫu số liệu đã sắp xếp: $6;\\, 8;\\, 10;\\, 12;\\, 14;\\, 16$ ($n = 6$). Xét tính đúng, sai:", "statements": ["a) $Q_2 = 11$.", "b) $Q_1 = 8$.", "c) $Q_3 = 14$.", "d) Trung vị của mẫu bằng $11$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $Q_2 = M_e = (10 + 12)/2 = 11$. b) Đúng: nửa trái $6;\\,8;\\,10$ cho $Q_1 = 8$. c) Đúng: nửa phải $12;\\,14;\\,16$ cho $Q_3 = 14$. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Khảo sát cỡ áo thun bán được trong ngày: cỡ S: $5$ chiếc, cỡ M: $12$ chiếc, cỡ L: $20$ chiếc, cỡ XL: $8$ chiếc. Xét tính đúng, sai:", "statements": ["a) Mốt của mẫu là cỡ L.", "b) Không tính được số trung bình của mẫu này.", "c) Cửa hàng nên nhập nhiều cỡ L nhất cho ngày hôm sau.", "d) Trung vị của mẫu là cỡ M."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: cỡ L có tần số lớn nhất ($20$). b) Đúng: cỡ áo là số liệu định tính, không tính trung bình được. c) Đúng theo ý nghĩa của mốt. d) Sai: $n = 45$, vị trí thứ $23$ rơi vào cỡ L (S: $1$–$5$, M: $6$–$17$, L: $18$–$37$) nên trung vị là cỡ L.", "points": 1}, {"type": "short", "level": "NB", "q": "Cho mẫu số liệu: $5;\\, 15;\\, 10$. Số trung bình của mẫu bằng bao nhiêu?", "answer": "10", "explain": "$\\overline{x} = (5 + 15 + 10)/3 = 30/3 = 10$.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho mẫu số liệu đã sắp xếp: $3;\\, 5;\\, 7;\\, 9$. $Q_3$ bằng bao nhiêu?", "answer": "8", "explain": "Nửa số liệu bên phải là $7;\\,9$ nên $Q_3 = (7 + 9)/2 = 8$.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Tứ phân vị thứ nhất $Q_1$ là", "options": ["A. trung vị của nửa số liệu bên trái $Q_2$.", "B. trung vị của nửa số liệu bên phải $Q_2$.", "C. trung vị của cả mẫu số liệu.", "D. giá trị nhỏ nhất của mẫu."], "answer": "A", "explain": "Theo định nghĩa, $Q_1$ là trung vị của nửa số liệu bên trái $Q_2$ (tức trung vị).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một mẫu số liệu có thể", "options": ["A. có nhiều mốt.", "B. có nhiều trung vị.", "C. có nhiều số trung bình.", "D. không có tứ phân vị."], "answer": "A", "explain": "Khi nhiều giá trị cùng có tần số lớn nhất bằng nhau thì mẫu có nhiều mốt; trung vị và số trung bình luôn duy nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $20;\\, 30;\\, 40;\\, 50;\\, 60$. Trung vị và số trung bình của mẫu lần lượt là", "options": ["A. $40$ và $40$.", "B. $40$ và $30$.", "C. $30$ và $40$.", "D. $50$ và $40$."], "answer": "A", "explain": "$M_e = 40$ (vị trí thứ $3$); $\\overline{x} = 200/5 = 40$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu đã sắp xếp: $1;\\, 4;\\, 7;\\, 10;\\, 13;\\, 16;\\, 19$ ($n = 7$). $Q_1$ bằng", "options": ["A. $4$.", "B. $7$.", "C. $10$.", "D. $1$."], "answer": "A", "explain": "$Q_2 = 10$; nửa trái (bỏ $Q_2$) là $1;\\,4;\\,7$ nên $Q_1 = 4$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Điểm trung bình môn Toán của lớp 10A là $7{,}5$ với $40$ học sinh. Tổng điểm của cả lớp là", "options": ["A. $300$.", "B. $47{,}5$.", "C. $32{,}5$.", "D. $75$."], "answer": "A", "explain": "Tổng $= n \\times \\overline{x} = 40 \\times 7{,}5 = 300$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mẫu số liệu có $M_e = 12$ và $n = 9$ (đã sắp xếp theo thứ tự không giảm). Giá trị ở vị trí thứ $5$ là", "options": ["A. $12$.", "B. $9$.", "C. $5$.", "D. Không xác định được."], "answer": "A", "explain": "$n = 9$ lẻ nên trung vị chính là giá trị ở vị trí thứ $(9+1)/2 = 5$, bằng $12$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho mẫu số liệu: $2;\\, 6;\\, 4;\\, 8;\\, 10$ (chưa sắp xếp). Xét tính đúng, sai:", "statements": ["a) Sắp xếp lại theo thứ tự không giảm: $2;\\, 4;\\, 6;\\, 8;\\, 10$.", "b) $M_e = 6$.", "c) $\\overline{x} = 6$.", "d) $Q_3 = 9$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng: vị trí thứ $3$. c) Đúng: tổng $30$, $n = 5$. d) Đúng: nửa phải $8;\\,10$ cho $Q_3 = 9$.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho bảng tần số: giá trị $2$ (tần số $3$), giá trị $4$ (tần số $2$), giá trị $6$ (tần số $5$). Xét tính đúng, sai:", "statements": ["a) $n = 10$.", "b) $\\overline{x} = 4{,}4$.", "c) Mốt của mẫu là $6$.", "d) Trung vị của mẫu là $4$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $3 + 2 + 5 = 10$. b) Đúng: $(3\\cdot 2 + 2\\cdot 4 + 5\\cdot 6)/10 = 44/10 = 4{,}4$. c) Đúng: tần số lớn nhất là $5$. d) Sai: dãy sắp xếp là $2;\\,2;\\,2;\\,4;\\,4;\\,6;\\,6;\\,6;\\,6;\\,6$, vị trí thứ $5, 6$ là $4$ và $6$ nên $M_e = 5$.", "points": 1}, {"type": "short", "level": "NB", "q": "Cho mẫu số liệu: $1;\\, 3;\\, 5;\\, 7$. Trung vị của mẫu bằng bao nhiêu?", "answer": "4", "explain": "$n = 4$ chẵn nên $M_e = (3 + 5)/2 = 4$.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Cho mẫu số liệu đã sắp xếp: $2;\\, 6;\\, 10;\\, 14;\\, 18$. $Q_1$ bằng bao nhiêu?", "answer": "4", "explain": "$n = 5$; $Q_2 = 10$; nửa trái là $2;\\,6$ nên $Q_1 = (2 + 6)/2 = 4$.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Khi $n$ lẻ, trung vị của mẫu số liệu (đã sắp xếp) là", "options": ["A. giá trị ở vị trí thứ $\\dfrac{n+1}{2}$.", "B. giá trị ở vị trí thứ $\\dfrac{n}{2}$.", "C. trung bình cộng của hai giá trị chính giữa.", "D. giá trị ở vị trí thứ $n$."], "answer": "A", "explain": "$n$ lẻ thì giá trị chính giữa ở vị trí $(n+1)/2$ chính là trung vị.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kí hiệu của mốt trong thống kê là", "options": ["A. $M_0$.", "B. $M_e$.", "C. $Q_3$.", "D. $\\overline{x}$."], "answer": "A", "explain": "Mốt kí hiệu là $M_0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $11;\\, 22;\\, 33$. Số trung bình của mẫu là", "options": ["A. $22$.", "B. $11$.", "C. $33$.", "D. $16{,}5$."], "answer": "A", "explain": "$\\overline{x} = (11 + 22 + 33)/3 = 66/3 = 22$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu đã sắp xếp: $5;\\, 10;\\, 15;\\, 20;\\, 25;\\, 30$ ($n = 6$). $Q_2$ bằng", "options": ["A. $17{,}5$.", "B. $15$.", "C. $20$.", "D. $17$."], "answer": "A", "explain": "$n = 6$ chẵn nên $Q_2 = M_e = (15 + 20)/2 = 17{,}5$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Lượng mưa (mm) trong 6 tháng: $100;\\, 120;\\, 90;\\, 110;\\, 300;\\, 105$. Nên dùng số đặc trưng nào làm đại diện?", "options": ["A. Trung vị.", "B. Số trung bình.", "C. Giá trị lớn nhất.", "D. Mốt."], "answer": "A", "explain": "Giá trị $300$ là bất thường, kéo số trung bình lên cao; trung vị phản ánh đúng lượng mưa điển hình.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mẫu số liệu gồm ba số $a;\\, b;\\, c$ có số trung bình bằng $9$ và $a + b = 12$. Giá trị $c$ là", "options": ["A. $15$.", "B. $9$.", "C. $12$.", "D. $3$."], "answer": "A", "explain": "Tổng ba số là $3 \\times 9 = 27$ nên $c = 27 - 12 = 15$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho mẫu số liệu đã sắp xếp: $4;\\, 7;\\, 10;\\, 13;\\, 16;\\, 19;\\, 22$ ($n = 7$). Xét tính đúng, sai:", "statements": ["a) $Q_2 = 13$.", "b) $Q_1 = 7$.", "c) $Q_3 = 19$.", "d) $M_e = 13$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: vị trí thứ $4$. b) Đúng: nửa trái $4;\\,7;\\,10$ cho $Q_1 = 7$. c) Đúng: nửa phải $16;\\,19;\\,22$ cho $Q_3 = 19$. d) Đúng: $M_e = Q_2$.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho mẫu số liệu: $5;\\, 5;\\, 5;\\, 8;\\, 10;\\, 12$. Xét tính đúng, sai:", "statements": ["a) $M_0 = 5$.", "b) $\\overline{x} = 7{,}5$.", "c) $M_e = 6{,}5$.", "d) $Q_1 = 5$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $5$ xuất hiện $3$ lần. b) Đúng: tổng $45$, $n = 6$. c) Đúng: vị trí thứ $3, 4$ là $5$ và $8$ nên $M_e = 6{,}5$. d) Đúng: nửa trái $5;\\,5;\\,5$ cho $Q_1 = 5$.", "points": 1}, {"type": "short", "level": "TH", "q": "Cho mẫu số liệu: $3;\\, 9;\\, 6$. Số trung bình của mẫu bằng bao nhiêu?", "answer": "6", "explain": "$\\overline{x} = (3 + 9 + 6)/3 = 18/3 = 6$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho mẫu số liệu: $1;\\, 2;\\, 3;\\, \\ldots;\\, 10$. Trung vị của mẫu bằng bao nhiêu?", "answer": "5,5", "explain": "$n = 10$ chẵn; hai giá trị chính giữa ở vị trí thứ $5, 6$ là $5$ và $6$ nên $M_e = 5{,}5$.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Số trung bình của mẫu số liệu nhạy với", "options": ["A. các giá trị bất thường (quá lớn hoặc quá nhỏ).", "B. số lượng giá trị của mẫu.", "C. thứ tự sắp xếp các giá trị.", "D. đơn vị đo của số liệu."], "answer": "A", "explain": "Vì dùng mọi giá trị để tính tổng nên một giá trị cực đoan có thể kéo số trung bình lệch hẳn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trung vị của mẫu số liệu không bị ảnh hưởng bởi", "options": ["A. các giá trị bất thường.", "B. số lượng giá trị của mẫu.", "C. giá trị ở chính giữa dãy.", "D. thứ tự sắp xếp."], "answer": "A", "explain": "Đó chính là ưu điểm lớn nhất của trung vị so với số trung bình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $100;\\, 200;\\, 300;\\, 400$. $Q_1$ và $Q_3$ lần lượt là", "options": ["A. $150$ và $350$.", "B. $200$ và $300$.", "C. $100$ và $400$.", "D. $150$ và $300$."], "answer": "A", "explain": "Nửa trái $100;\\,200$ cho $Q_1 = 150$; nửa phải $300;\\,400$ cho $Q_3 = 350$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mốt của mẫu số liệu: $9;\\, 8;\\, 7;\\, 9;\\, 8;\\, 9$ là", "options": ["A. $9$.", "B. $8$.", "C. $7$.", "D. $9$ và $8$."], "answer": "A", "explain": "Giá trị $9$ xuất hiện $3$ lần, nhiều nhất nên $M_0 = 9$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tuổi thọ (giờ) của 5 bóng đèn: $1000;\\, 1200;\\, 1100;\\, 1050;\\, 1150$. Số trung bình của mẫu là", "options": ["A. $1100$.", "B. $1000$.", "C. $1150$.", "D. $1050$."], "answer": "A", "explain": "$\\overline{x} = 5500/5 = 1100$ (giờ).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mẫu số liệu $x_1, x_2, \\ldots, x_8$ có $\\overline{x} = 12$. Nếu bỏ đi một giá trị bằng $20$ thì số trung bình của $7$ giá trị còn lại là", "options": ["A. $10{,}86$.", "B. $12$.", "C. $8$.", "D. $11$."], "answer": "A", "explain": "Tổng $8$ giá trị là $96$; tổng $7$ giá trị còn lại là $76$ nên trung bình mới là $76/7 \\approx 10{,}86$.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Cho mẫu số liệu đã sắp xếp: $10;\\, 20;\\, 30;\\, 40;\\, 50;\\, 60;\\, 70;\\, 80$ ($n = 8$). Xét tính đúng, sai:", "statements": ["a) $Q_2 = 45$.", "b) $Q_1 = 25$.", "c) $Q_3 = 65$.", "d) $M_e = 45$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $(40 + 50)/2 = 45$. b) Đúng: nửa trái $10;\\,20;\\,30;\\,40$ cho $(20+30)/2 = 25$. c) Đúng: nửa phải $50;\\,60;\\,70;\\,80$ cho $(60+70)/2 = 65$. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho mẫu số liệu: $1;\\, 3;\\, 3;\\, 3;\\, 7;\\, 9;\\, 11$. Xét tính đúng, sai:", "statements": ["a) $M_0 = 3$.", "b) $\\overline{x} = \\dfrac{37}{7}$.", "c) $M_e = 3$.", "d) $Q_3 = 9$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $3$ xuất hiện $3$ lần. b) Đúng: tổng $37$, $n = 7$. c) Đúng: vị trí thứ $4$ là $3$. d) Đúng: nửa phải $7;\\,9;\\,11$ cho $Q_3 = 9$.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho mẫu số liệu: $6;\\, 8;\\, 10;\\, 12$ có số trung bình bằng $9$. Nếu thêm giá trị $14$ vào mẫu thì số trung bình mới bằng bao nhiêu?", "answer": "10", "explain": "Tổng mới là $36 + 14 = 50$ với $n = 5$ nên trung bình mới là $10$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho mẫu số liệu đã sắp xếp: $2;\\, 4;\\, 6;\\, 8;\\, x$ ($x \\gt 8$) có trung vị bằng $6$ và số trung bình bằng $7$. Giá trị $x$ bằng bao nhiêu?", "answer": "15", "explain": "$(20 + x)/5 = 7$ suy ra $x = 15$ (thỏa $x \\gt 8$; trung vị vẫn là $6$).", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Tứ phân vị chia mẫu số liệu (đã sắp xếp) thành", "options": ["A. bốn phần có số lượng bằng nhau.", "B. hai phần có số lượng bằng nhau.", "C. ba phần có số lượng bằng nhau.", "D. bốn phần có tổng bằng nhau."], "answer": "A", "explain": "Ba giá trị $Q_1, Q_2, Q_3$ chia dãy thành bốn phần, mỗi phần chứa $25\\%$ số liệu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mốt là số đặc trưng dùng tốt cho", "options": ["A. số liệu định tính (màu sắc, cỡ áo, ...).", "B. mọi loại số liệu định lượng.", "C. mẫu chỉ có một giá trị.", "D. mẫu có giá trị bất thường."], "answer": "A", "explain": "Với số liệu định tính không tính được trung bình hay trung vị, mốt cho biết giá trị phổ biến nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $7;\\, 14;\\, 21;\\, 28$. Trung vị của mẫu là", "options": ["A. $17{,}5$.", "B. $14$.", "C. $21$.", "D. $17$."], "answer": "A", "explain": "$n = 4$ chẵn nên $M_e = (14 + 21)/2 = 17{,}5$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu đã sắp xếp: $2;\\, 5;\\, 8;\\, 11;\\, 14$ ($n = 5$). $Q_3$ bằng", "options": ["A. $12{,}5$.", "B. $11$.", "C. $14$.", "D. $8$."], "answer": "A", "explain": "$Q_2 = 8$; nửa phải (bỏ $Q_2$) là $11;\\,14$ nên $Q_3 = (11 + 14)/2 = 12{,}5$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Số trung bình của $20$ số là $15$. Tổng của $20$ số đó là", "options": ["A. $300$.", "B. $35$.", "C. $5$.", "D. $150$."], "answer": "A", "explain": "Tổng $= 20 \\times 15 = 300$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mẫu số liệu: $4;\\, 6;\\, 6;\\, 8;\\, 10$ có mốt bằng $6$. Nếu mỗi giá trị của mẫu giảm đi $2$ thì mốt mới bằng", "options": ["A. $4$.", "B. $6$.", "C. $2$.", "D. $8$."], "answer": "A", "explain": "Mẫu mới là $2;\\,4;\\,4;\\,6;\\,8$; giá trị $4$ xuất hiện nhiều nhất nên mốt mới là $4$ (mốt cũng giảm đi $2$).", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Cho mẫu số liệu: $12;\\, 15;\\, 18;\\, 21;\\, 24$. Xét tính đúng, sai:", "statements": ["a) $\\overline{x} = 18$.", "b) $M_e = 18$.", "c) $Q_1 = 13{,}5$.", "d) Mẫu không có mốt."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: tổng $90$, $n = 5$. b) Đúng: vị trí thứ $3$. c) Đúng: nửa trái $12;\\,15$ cho $Q_1 = 13{,}5$. d) Đúng: mỗi giá trị xuất hiện $1$ lần.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho bảng tần số: giá trị $10$ (tần số $1$), giá trị $20$ (tần số $4$), giá trị $30$ (tần số $5$). Xét tính đúng, sai:", "statements": ["a) $n = 10$.", "b) $\\overline{x} = 24$.", "c) $M_0 = 30$.", "d) $M_e = 25$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $1 + 4 + 5 = 10$. b) Đúng: $(10 + 80 + 150)/10 = 24$. c) Đúng: tần số lớn nhất là $5$. d) Đúng: dãy sắp xếp $10;\\,20;\\,20;\\,20;\\,20;\\,30;\\,30;\\,30;\\,30;\\,30$, vị trí thứ $5, 6$ là $20$ và $30$ nên $M_e = 25$.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho mẫu số liệu đã sắp xếp: $1;\\, 5;\\, 9;\\, 13;\\, 17$. $Q_1$ bằng bao nhiêu?", "answer": "3", "explain": "$n = 5$; $Q_2 = 9$; nửa trái là $1;\\,5$ nên $Q_1 = (1 + 5)/2 = 3$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho mẫu số liệu đã sắp xếp: $5;\\, 10;\\, 15;\\, x$ ($x \\gt 15$) có trung vị bằng $12{,}5$ và số trung bình bằng $12$. Giá trị $x$ bằng bao nhiêu?", "answer": "18", "explain": "Trung vị $(10 + 15)/2 = 12{,}5$ (không phụ thuộc $x$); $(30 + x)/4 = 12$ suy ra $x = 18$.", "points": 0.5}]}]}
