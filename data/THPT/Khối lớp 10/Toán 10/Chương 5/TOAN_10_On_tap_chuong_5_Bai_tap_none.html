trước hết phải sắp xếp số liệu theo thứ tự không giảm.", "b) Độ lệch chuẩn bằng $0$ khi mọi giá trị của mẫu bằng nhau.", "c) Sai số tương đối $\\delta_a$ có thể nhận giá trị âm.", "d) Chữ số ngay sau hàng quy tròn từ $5$ trở lên thì cộng thêm $1$ vào hàng quy tròn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: $\\delta_a \\ge 0$. d) Đúng theo quy tắc làm tròn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Cho mẫu số liệu: $20;\\, 40;\\, 60$. Xét tính đúng, sai:", "statements": ["a) $\\overline{x} = 40$.", "b) $s^2 = \\dfrac{800}{3}$.", "c) $R = 40$.", "d) Với số gần đúng $a = 40$, độ chính xác $d = 2$ thì $\\delta_a \\le 5\\%$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng: các bình phương độ lệch $400;\\,0;\\,400$. c) Đúng: $60 - 20 = 40$. d) Đúng: $2/40 = 5\\%$.", "points": 1}, {"type": "short", "level": "TH", "q": "Cho mẫu số liệu có $Q_1 = 6$, $Q_3 = 18$. Khoảng tứ phân vị của mẫu bằng bao nhiêu?", "answer": "12", "explain": "$\\Delta_Q = 18 - 6 = 12$.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Cho mẫu số liệu: $5;\\, 10;\\, 15;\\, 20;\\, 25$. Trung vị của mẫu bằng bao nhiêu?", "answer": "15", "explain": "$n = 5$ lẻ, giá trị chính giữa (vị trí thứ $3$) là $15$.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Một giá trị được coi là bất thường nếu nó nằm ngoài đoạn", "options": ["A. $[Q_1 - 1{,}5\\Delta_Q;\\, Q_3 + 1{,}5\\Delta_Q]$.", "B. $[Q_1;\\, Q_3]$.", "C. $[x_{\\min};\\, x_{\\max}]$.", "D. $[0;\\, 100]$."], "answer": "A", "explain": "Đó chính là quy tắc hàng rào $1{,}5\\Delta_Q$ phát hiện giá trị bất thường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quy tròn số $7{,}85$ đến hàng phần mười ta được", "options": ["A. $7{,}9$.", "B. $7{,}8$.", "C. $7{,}85$.", "D. $8$."], "answer": "A", "explain": "Chữ số ngay sau hàng phần mười là $5 \\ge 5$ nên $7{,}85 \\approx 7{,}9$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $12;\\, 18;\\, 24;\\, 30$. Số trung bình của mẫu là", "options": ["A. $21$.", "B. $18$.", "C. $24$.", "D. $20$."], "answer": "A", "explain": "$\\overline{x} = 84/4 = 21$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $1;\\, 5;\\, 9;\\, 13$. Khoảng tứ phân vị của mẫu là", "options": ["A. $8$.", "B. $12$.", "C. $6$.", "D. $4$."], "answer": "A", "explain": "$Q_1 = (1 + 5)/2 = 3$; $Q_3 = (9 + 13)/2 = 11$; $\\Delta_Q = 11 - 3 = 8$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai phép đo: đo quãng đường $100\\,\\text{m} \\pm 1\\,\\text{m}$ và đo chiều cao $10\\,\\text{m} \\pm 0{,}2\\,\\text{m}$. Phép đo nào cho chất lượng cao hơn?", "options": ["A. Đo quãng đường $100\\,\\text{m}$.", "B. Đo chiều cao $10\\,\\text{m}$.", "C. Hai phép đo như nhau.", "D. Không so sánh được."], "answer": "A", "explain": "$\\delta_1 \\le 1/100 = 1\\%$; $\\delta_2 \\le 0{,}2/10 = 2\\%$. Sai số tương đối của phép đo quãng đường nhỏ hơn nên chất lượng cao hơn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mẫu số liệu: $6;\\, 8;\\, 10;\\, 12;\\, 14;\\, 16;\\, 18$. $Q_1, Q_3, \\Delta_Q$ lần lượt là", "options": ["A. $8;\\, 16;\\, 8$.", "B. $6;\\, 18;\\, 12$.", "C. $8;\\, 14;\\, 6$.", "D. $10;\\, 16;\\, 6$."], "answer": "A", "explain": "$n = 7$; $Q_2 = 12$; nửa trái $6;\\,8;\\,10$ cho $Q_1 = 8$; nửa phải $14;\\,16;\\,18$ cho $Q_3 = 16$; $\\Delta_Q = 8$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Biểu đồ hộp tóm tắt năm số của mẫu số liệu.", "b) Trong biểu đồ hộp, các giá trị bất thường được vẽ thành các điểm riêng.", "c) Số trung bình luôn lớn hơn trung vị.", "d) Mốt dùng được cho cả số liệu định tính."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: min, $Q_1$, $Q_2$, $Q_3$, max. b) Đúng. c) Sai: tùy mẫu, có thể lớn hơn, nhỏ hơn hoặc bằng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho mẫu số liệu: $2;\\, 10;\\, 18$. Xét tính đúng, sai:", "statements": ["a) $R = 16$.", "b) $s^2 = \\dfrac{128}{3}$.", "c) $\\Delta_Q = 16$.", "d) $s \\approx 6{,}53$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $18 - 2 = 16$. b) Đúng: $\\overline{x} = 10$, các bình phương độ lệch $64;\\,0;\\,64$. c) Đúng: $Q_1 = 2$, $Q_3 = 18$. d) Đúng: $\\sqrt{128/3} \\approx 6{,}53$.", "points": 1}, {"type": "short", "level": "TH", "q": "Quy tròn số $2{,}046$ đến hàng phần trăm ta được bao nhiêu?", "answer": "2,05", "explain": "Chữ số ngay sau hàng phần trăm là $6 \\ge 5$ nên $2{,}046 \\approx 2{,}05$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho mẫu số liệu: $5;\\, 15;\\, 25;\\, 35$. Có bao nhiêu giá trị bất thường?", "answer": "0", "explain": "$Q_1 = 10$, $Q_3 = 30$, $\\Delta_Q = 20$; hàng rào $[-20;\\, 60]$ chứa mọi giá trị nên không có giá trị bất thường.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Mốt của mẫu số liệu là", "options": ["A. giá trị có tần số lớn nhất.", "B. giá trị ở chính giữa dãy đã sắp xếp.", "C. trung bình cộng của các giá trị.", "D. giá trị lớn nhất của mẫu."], "answer": "A", "explain": "Theo định nghĩa, mốt là giá trị có tần số lớn nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Độ lệch của giá trị $x_i$ so với số trung bình là", "options": ["A. $x_i - \\overline{x}$.", "B. $\\overline{x} - x_i$.", "C. $|x_i| + \\overline{x}$.", "D. $x_i \\cdot \\overline{x}$."], "answer": "A", "explain": "Theo định nghĩa, độ lệch của $x_i$ là $x_i - \\overline{x}$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $\\overline{a} = 3{,}00 \\pm 0{,}04$. Đoạn chứa $\\overline{a}$ là", "options": ["A. $[2{,}96;\\, 3{,}04]$.", "B. $[2{,}94;\\, 3{,}06]$.", "C. $[3{,}00;\\, 3{,}04]$.", "D. $[2{,}96;\\, 3{,}00]$."], "answer": "A", "explain": "$3{,}00 - 0{,}04 \\le \\overline{a} \\le 3{,}00 + 0{,}04$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $3;\\, 1;\\, 2$. Trung vị của mẫu là", "options": ["A. $2$.", "B. $3$.", "C. $1$.", "D. $1{,}5$."], "answer": "A", "explain": "Sắp xếp: $1;\\,2;\\,3$; $n = 3$ lẻ nên $M_e = 2$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho mẫu số liệu: $7;\\, 9;\\, 11;\\, 13;\\, 15$. Độ lệch chuẩn của mẫu (làm tròn đến 2 chữ số thập phân) là", "options": ["A. $2{,}83$.", "B. $8$.", "C. $11$.", "D. $4$."], "answer": "A", "explain": "$\\overline{x} = 11$; $s^2 = (16 + 4 + 0 + 4 + 16)/5 = 8$; $s = \\sqrt{8} \\approx 2{,}83$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mẫu số liệu gồm hai giá trị $a;\\, b$ có số trung bình bằng $12$ và $a = 8$. Giá trị $b$ là", "options": ["A. $16$.", "B. $12$.", "C. $8$.", "D. $20$."], "answer": "A", "explain": "$(a + b)/2 = 12$ nên $b = 24 - 8 = 16$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho mẫu số liệu đã sắp xếp: $2;\\, 5;\\, 8;\\, 11;\\, 14$. Xét tính đúng, sai:", "statements": ["a) $Q_2 = 8$.", "b) $Q_1 = 3{,}5$.", "c) $Q_3 = 12{,}5$.", "d) $\\Delta_Q = 9$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: vị trí thứ $3$. b) Đúng: nửa trái $2;\\,5$ cho $Q_1 = 3{,}5$. c) Đúng: nửa phải $11;\\,14$ cho $Q_3 = 12{,}5$. d) Đúng: $12{,}5 - 3{,}5 = 9$.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Đo chiều cao một học sinh bằng hai cách: (1) $a_1 = 1{,}70\\,\\text{m}$, $d_1 = 0{,}01\\,\\text{m}$; (2) $a_2 = 170\\,\\text{cm}$, $d_2 = 1\\,\\text{cm}$. Xét tính đúng, sai:", "statements": ["a) Hai phép đo có cùng độ chính xác tuyệt đối.", "b) $\\delta_{a_1} \\le 0{,}59\\%$.", "c) $\\delta_{a_2} \\le 0{,}59\\%$.", "d) Phép đo (2) kém chính xác hơn phép đo (1)."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: cùng $d = 1\\,\\text{cm}$. b) Đúng: $0{,}01/1{,}70 \\approx 0{,}588\\% \\le 0{,}59\\%$. c) Đúng: $1/170 \\approx 0{,}588\\%$. d) Sai: hai phép đo thực chất là một, chất lượng như nhau.", "points": 1}, {"type": "short", "level": "NB", "q": "Sai số tuyệt đối của số gần đúng $a = 5$ với giá trị đúng $\\overline{a} = 5{,}2$ là bao nhiêu?", "answer": "0,2", "explain": "$\\Delta_a = |5{,}2 - 5| = 0{,}2$.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho mẫu số liệu: $8;\\, 8;\\, 8;\\, 8$. Phương sai của mẫu bằng bao nhiêu?", "answer": "0", "explain": "Mọi giá trị bằng nhau nên mọi độ lệch bằng $0$, suy ra $s^2 = 0$.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "$s^2 \\ge 0$ với mọi mẫu số liệu vì", "options": ["A. $s^2$ là trung bình cộng của các bình phương độ lệch.", "B. $s^2$ là tổng các độ lệch.", "C. $s^2$ luôn bằng $0$.", "D. $s^2$ là số trung bình của mẫu."], "answer": "A", "explain": "Bình phương của mọi số thực đều không âm nên trung bình cộng của chúng cũng không âm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi $n$ chẵn, trung vị của mẫu số liệu (đã sắp xếp) là", "options": ["A. trung bình cộng của hai giá trị chính giữa.", "B. giá trị ở vị trí thứ $n/2$.", "C. giá trị ở vị trí thứ $n/2 + 1$.", "D. giá trị lớn nhất của mẫu."], "answer": "A", "explain": "$n$ chẵn thì trung vị là trung bình cộng của hai giá trị ở vị trí thứ $n/2$ và $n/2 + 1$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số quy tròn của $a = 678$ với độ chính xác $d = 9$ là", "options": ["A. $680$.", "B. $670$.", "C. $700$.", "D. $678$."], "answer": "A", "explain": "Vì $1 \\lt d = 9 \\lt 10$ nên hàng quy tròn là hàng chục; chữ số sau hàng chục là $8 \\ge 5$ nên $678 \\approx 680$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $4;\\, 10;\\, 16$. Phương sai của mẫu là", "options": ["A. $24$.", "B. $72$.", "C. $10$.", "D. $16$."], "answer": "A", "explain": "$\\overline{x} = 10$; các bình phương độ lệch $36;\\,0;\\,36$; $s^2 = 72/3 = 24$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Lớp 10B có $45$ học sinh, điểm trung bình môn Văn là $6{,}8$. Tổng điểm của cả lớp là", "options": ["A. $306$.", "B. $51{,}8$.", "C. $38{,}2$.", "D. $68$."], "answer": "A", "explain": "Tổng $= 45 \\times 6{,}8 = 306$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mẫu số liệu: $1;\\, 2;\\, 3;\\, 4;\\, 5;\\, 6;\\, 7;\\, 8$. Phương sai của mẫu là", "options": ["A. $5{,}25$.", "B. $42$.", "C. $4{,}5$.", "D. $8$."], "answer": "A", "explain": "$\\overline{x} = 4{,}5$; tổng các bình phương độ lệch là $42$; $s^2 = 42/8 = 5{,}25$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho $a = 0{,}60$ với độ chính xác $d = 0{,}05$. Xét tính đúng, sai:", "statements": ["a) Hàng quy tròn là hàng phần mười.", "b) Số quy tròn của $a$ là $0{,}6$.", "c) $\\delta_a \\le \\dfrac{0{,}05}{0{,}60} \\approx 8{,}33\\%$.", "d) $\\overline{a} \\in [0{,}55;\\, 0{,}65]$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $0{,}01 \\lt d = 0{,}05 \\lt 0{,}1$. b) Đúng: $0{,}60$ làm tròn đến hàng phần mười vẫn là $0{,}6$. c) Đúng. d) Đúng: $0{,}60 \\pm 0{,}05$.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho bảng tần số: giá trị $2$ (tần số $2$), giá trị $6$ (tần số $3$). Xét tính đúng, sai:", "statements": ["a) $n = 5$.", "b) $\\overline{x} = 4{,}4$.", "c) Mốt của mẫu là $6$.", "d) Trung vị của mẫu là $6$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $2 + 3 = 5$. b) Đúng: $(2\\cdot 2 + 3\\cdot 6)/5 = 22/5 = 4{,}4$. c) Đúng: tần số lớn nhất là $3$. d) Đúng: dãy sắp xếp $2;\\,2;\\,6;\\,6;\\,6$, vị trí thứ $3$ là $6$.", "points": 1}, {"type": "short", "level": "NB", "q": "Cho mẫu số liệu: $4;\\, 8;\\, 12$. Số trung bình của mẫu bằng bao nhiêu?", "answer": "8", "explain": "$\\overline{x} = 24/3 = 8$.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Quy tròn số $5\\,678$ với độ chính xác $d = 60$ ta được bao nhiêu (viết liền không dấu cách)?", "answer": "5700", "explain": "Vì $10 \\lt d = 60 \\lt 100$ nên hàng quy tròn là hàng trăm; chữ số sau hàng trăm là $7 \\ge 5$ nên $5\\,678 \\approx 5\\,700$.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Khi quy tròn một số, nếu chữ số ngay sau hàng quy tròn nhỏ hơn $5$ thì ta", "options": ["A. giữ nguyên chữ số ở hàng quy tròn.", "B. cộng thêm $1$ vào chữ số ở hàng quy tròn.", "C. thay chữ số ở hàng quy tròn bằng $0$.", "D. bỏ luôn hàng quy tròn."], "answer": "A", "explain": "Quy tắc: chữ số sau hàng quy tròn nhỏ hơn $5$ thì giữ nguyên hàng quy tròn (thay các chữ số bên phải bằng $0$ hoặc bỏ đi).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biểu đồ hộp tóm tắt mẫu số liệu bằng", "options": ["A. năm số: giá trị nhỏ nhất, $Q_1$, $Q_2$, $Q_3$, giá trị lớn nhất.", "B. ba số: $Q_1$, $Q_2$, $Q_3$.", "C. hai số: trung bình và trung vị.", "D. một số duy nhất là mốt."], "answer": "A", "explain": "Biểu đồ hộp (box plot) tóm tắt năm số của mẫu, các giá trị bất thường được chấm riêng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $9;\\, 3;\\, 6$. Số trung bình của mẫu là", "options": ["A. $6$.", "B. $9$.", "C. $3$.", "D. $5$."], "answer": "A", "explain": "$\\overline{x} = 18/3 = 6$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $a = 12{,}34$ với độ chính xác $d = 0{,}03$. Số quy tròn của $a$ là", "options": ["A. $12{,}3$.", "B. $12{,}4$.", "C. $12{,}34$.", "D. $12$."], "answer": "A", "explain": "Vì $0{,}01 \\lt d = 0{,}03 \\lt 0{,}1$ nên hàng quy tròn là hàng phần mười; chữ số sau là $3 \\lt 5$ nên $12{,}34 \\approx 12{,}3$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho mẫu số liệu có $s = 3$. Nếu mỗi giá trị của mẫu giảm đi $10$ thì độ lệch chuẩn mới là", "options": ["A. $3$.", "B. $13$.", "C. $-7$.", "D. $30$."], "answer": "A", "explain": "Cộng (hoặc trừ) một hằng số vào mọi giá trị không làm thay đổi các độ lệch nên $s$ không đổi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mẫu số liệu đã sắp xếp: $1;\\, 3;\\, 5;\\, 7;\\, x$ ($x \\gt 7$) có trung vị bằng $5$ và số trung bình bằng $6$. Giá trị $x$ là", "options": ["A. $14$.", "B. $7$.", "C. $10$.", "D. $5$."], "answer": "A", "explain": "Trung vị của dãy $5$ số là giá trị thứ $3$, bằng $5$ (thỏa mãn với mọi $x \\gt 7$); $(16 $M_e$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sai số tương đối $\\delta_a$ thường được viết dưới dạng", "options": ["A. phần trăm.", "B. số nguyên.", "C. phân số tối giản.", "D. số thập phân vô hạn."], "answer": "A", "explain": "Trong thực hành, người ta thường viết sai số tương đối dưới dạng phần trăm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $50;\\, 60;\\, 70$. Khoảng biến thiên của mẫu là", "options": ["A. $20$.", "B. $70$.", "C. $50$.", "D. $60$."], "answer": "A", "explain": "$R = 70 - 50 = 20$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $4;\\, 4;\\, 5;\\, 5;\\, 5$. Mốt của mẫu là", "options": ["A. $5$.", "B. $4$.", "C. $4$ và $5$.", "D. Không có mốt."], "answer": "A", "explain": "Giá trị $5$ xuất hiện $3$ lần, nhiều nhất nên $M_0 = 5$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Số gần đúng $a = 2{,}00$ với độ chính xác $d = 0{,}02$. Số chữ số chắc của $a$ là", "options": ["A. $2$.", "B. $3$.", "C. $1$.", "D. $4$."], "answer": "A", "explain": "Hàng đơn vị (nửa đơn vị $0{,}5 \\ge 0{,}02$) chắc; hàng phần mười (nửa đơn vị $0{,}05 \\ge 0{,}02$) chắc; hàng phần trăm (nửa đơn vị $0{,}005 \\lt 0{,}02$) không chắc. Vậy có $2$ chữ số chắc.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mẫu số liệu: $2;\\, 5;\\, 10;\\, 17;\\, 26$. Phương sai của mẫu là", "options": ["A. $74{,}8$.", "B. $374$.", "C. $12$.", "D. $60$."], "answer": "A", "explain": "$\\overline{x} = 12$; tổng các bình phương độ lệch là $374$; $s^2 = 374/5 = 74{,}8$.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Cho mẫu số liệu: $1;\\, 4;\\, 7;\\, 10$. Xét tính đúng, sai:", "statements": ["a) $Q_1 = 2{,}5$.", "b) $Q_3 = 8{,}5$.", "c) $\\Delta_Q = 6$.", "d) $M_e = 5{,}5$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: nửa trái $1;\\,4$ cho $Q_1 = 2{,}5$. b) Đúng: nửa phải $7;\\,10$ cho $Q_3 = 8{,}5$. c) Đúng: $8{,}5 - 2{,}5 = 6$. d) Đúng: $(4 + 7)/2 = 5{,}5$.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho mẫu số liệu: $5;\\, 10;\\, 15;\\, 20;\\, 25;\\, 100$. Xét tính đúng, sai:", "statements": ["a) $100$ là giá trị bất thường.", "b) $R = 95$.", "c) $\\overline{x} = \\dfrac{175}{6}$.", "d) Nên dùng trung vị ($17{,}5$) làm đại diện thay vì số trung bình."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $Q_1 = 10$, $Q_3 = 25$, hàng rào trên là $47{,}5 \\lt 100$. b) Đúng: $100 - 5 = 95$. c) Đúng: tổng $175$, $n = 6$. d) Đúng vì giá trị $100$ kéo số trung bình lên $\\approx 29{,}17$ trong khi trung vị $17{,}5$ ổn định.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho mẫu số liệu: $6;\\, 12;\\, 18$. Độ lệch chuẩn của mẫu (làm tròn đến 2 chữ số thập phân) bằng bao nhiêu?", "answer": "4,90", "explain": "$\\overline{x} = 12$; $s^2 = (36 + 0 + 36)/3 = 24$; $s = \\sqrt{24} \\approx 4{,}90$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho mẫu số liệu đã sắp xếp: $2;\\, 6;\\, 10;\\, 14;\\, x$ ($x \\gt 14$) có trung vị bằng $10$ và số trung bình bằng $11$. Giá trị $x$ bằng bao nhiêu?", "answer": "23", "explain": "Trung vị là giá trị thứ $3$, bằng $10$ (thỏa mãn với mọi $x \\gt 14$); $(32 + x)/5 = 11$ suy ra $x = 23$.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Đại lượng $1{,}5\\,\\Delta_Q$ được dùng để", "options": ["A. xác định hàng rào phát hiện các giá trị bất thường.", "B. tính khoảng biến thiên của mẫu.", "C. tính số trung bình của mẫu.", "D. tính mốt của mẫu."], "answer": "A", "explain": "Quy tắc: giá trị nằm ngoài $[Q_1 - 1{,}5\\Delta_Q;\\, Q_3 + 1{,}5\\Delta_Q]$ là giá trị bất thường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Số trung bình của mẫu số liệu nhạy với", "options": ["A. các giá trị bất thường.", "B. số lượng giá trị của mẫu.", "C. thứ tự sắp xếp.", "D. đơn vị đo."], "answer": "A", "explain": "Vì dùng mọi giá trị để tính tổng nên một giá trị cực đoan kéo trung bình lệch hẳn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $a = 345$ với độ chính xác $d = 6$. Số quy tròn của $a$ là", "options": ["A. $350$.", "B. $340$.", "C. $300$.", "D. $345$."], "answer": "A", "explain": "Vì $1 \\lt d = 6 \\lt 10$ nên hàng quy tròn là hàng chục; chữ số sau hàng chục là $5 \\ge 5$ nên $345 \\approx 350$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu có $Q_1 = 9$, $Q_3 = 21$. Giá trị $x = 45$ có phải là giá trị bất thường không?", "options": ["A. Có.", "B. Không.", "C. Không xác định được.", "D. Cần biết thêm $Q_2$."], "answer": "A", "explain": "$\\Delta_Q = 12$; hàng rào trên là $21 + 18 = 39$; $45 \\gt 39$ nên là giá trị bất thường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Điểm trung bình $8$ môn học của Mai là $8{,}5$. Tổng điểm $8$ môn của Mai là", "options": ["A. $68$.", "B. $16{,}5$.", "C. $0{,}5$.", "D. $85$."], "answer": "A", "explain": "Tổng $= 8 \\times 8{,}5 = 68$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho $a = 8{,}0$ với độ chính xác $d = 0{,}1$ và mẫu số liệu $6;\\, 8;\\, 10$. Phát biểu đúng là", "options": ["A. Số quy tròn của $a$ là $8$.", "B. Phương sai của mẫu $6;\\, 8;\\, 10$ là $4$.", "C. $\\delta_a \\le 1\\%$.", "D. Khoảng biến thiên của mẫu là $6$."], "answer": "A", "explain": "A đúng: $d = 0{,}1$ thì hàng quy tròn là hàng đơn vị, $8{,}0 \\approx 8$. B sai: $s^2 = 8/3$. C sai: $\\delta_a \\le 0{,}1/8 = 1{,}25\\% \\gt 1\\%$. D sai: $R = 10 - 6 = 4$.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "So sánh hai phép đo: (1) $a_1 = 500\\,\\text{m}$, $d_1 = 2\\,\\text{m}$; (2) $a_2 = 20\\,\\text{m}$, $d_2 = 0{,}2\\,\\text{m}$. Xét tính đúng, sai:", "statements": ["a) $\\delta_{a_1} \\le 0{,}4\\%$.", "b) $\\delta_{a_2} \\le 1\\%$.", "c) Phép đo (1) cho chất lượng cao hơn.", "d) Vì sai số tuyệt đối của (1) lớn hơn nên (1) kém chính xác hơn (2)."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $2/500 = 0{,}4\\%$. b) Đúng: $0{,}2/20 = 1\\%$. c) Đúng vì $0{,}4\\% \\lt 1\\%$. d) Sai: phải so sánh sai số tương đối.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho bảng tần số: giá trị $3$ (tần số $2$), giá trị $7$ (tần số $2$). Xét tính đúng, sai:", "statements": ["a) $n = 4$.", "b) $\\overline{x} = 5$.", "c) $s^2 = 4$.", "d) Mẫu có hai mốt là $3$ và $7$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $2 + 2 = 4$. b) Đúng: $(6 + 14)/4 = 5$. c) Đúng: các bình phương độ lệch $4;\\,4;\\,4;\\,4$, $s^2 = 16/4 = 4$. d) Đúng: cả hai giá trị cùng có tần số lớn nhất là $2$.", "points": 1}, {"type": "short", "level": "VD", "q": "Quy tròn số $9\\,876$ với độ chính xác $d = 40$ ta được bao nhiêu (viết liền không dấu cách)?", "answer": "9900", "explain": "Vì $10 \\lt d = 40 \\lt 100$ nên hàng quy tròn là hàng trăm; chữ số sau hàng trăm là $7 \\ge 5$ nên $9\\,876 \\approx 9\\,900$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho mẫu số liệu: $1;\\, 2;\\, 100$. Có bao nhiêu giá trị bất thường?", "answer": "0", "explain": "$Q_1 = 1$, $Q_3 = 100$, $\\Delta_Q = 99$; hàng rào $[-147{,}5;\\, 248{,}5]$ chứa mọi giá trị nên không có giá trị bất thường.", "points": 0.5}]}]}
