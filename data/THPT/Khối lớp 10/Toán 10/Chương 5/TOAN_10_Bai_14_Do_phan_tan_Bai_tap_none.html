"level": "TH", "q": "Cho mẫu số liệu: $7;\\, 7;\\, 7;\\, 7;\\, 7$. Khoảng biến thiên và độ lệch chuẩn của mẫu lần lượt là", "options": ["A. $0$ và $0$.", "B. $7$ và $0$.", "C. $0$ và $7$.", "D. $7$ và $7$."], "answer": "A", "explain": "Mọi giá trị bằng nhau nên $R = 0$ và $s = 0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu có $Q_1 = 10$, $Q_3 = 22$. Khoảng tứ phân vị của mẫu là", "options": ["A. $12$.", "B. $32$.", "C. $16$.", "D. $10$."], "answer": "A", "explain": "$\\Delta_Q = 22 - 10 = 12$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho mẫu số liệu: $12;\\, 15;\\, 18;\\, 21$. Phương sai của mẫu là", "options": ["A. $11{,}25$.", "B. $45$.", "C. $16{,}5$.", "D. $7{,}5$."], "answer": "A", "explain": "$\\overline{x} = 16{,}5$; các bình phương độ lệch $20{,}25;\\,2{,}25;\\,2{,}25;\\,20{,}25$; $s^2 = 45/4 = 11{,}25$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mẫu số liệu: $3;\\, 6;\\, 9;\\, 12;\\, 15;\\, 45$. Có bao nhiêu giá trị bất thường?", "options": ["A. $1$.", "B. $0$.", "C. $2$.", "D. $3$."], "answer": "A", "explain": "$Q_1 = 6$, $Q_3 = 15$, $\\Delta_Q = 9$; hàng rào trên là $15 + 13{,}5 = 28{,}5$; chỉ có $45 \\gt 28{,}5$ là bất thường.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Muốn tính phương sai, trước hết phải tính số trung bình của mẫu.", "b) Đơn vị của phương sai là bình phương đơn vị của số liệu gốc.", "c) Độ lệch chuẩn có cùng đơn vị với số liệu gốc.", "d) $R$ và $\\Delta_Q$ có cùng đơn vị với số liệu gốc."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng vì công thức dùng các độ lệch $x_i - \\overline{x}$. b) Đúng. c) Đúng vì $s = \\sqrt{s^2}$. d) Đúng vì là hiệu của hai giá trị cùng đơn vị.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Cho mẫu số liệu: $9;\\, 6;\\, 3;\\, 12$. Xét tính đúng, sai:", "statements": ["a) $R = 9$.", "b) $\\overline{x} = 7{,}5$.", "c) $s^2 = 11{,}25$.", "d) $s = 3{,}5$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $12 - 3 = 9$. b) Đúng: tổng $30$, $n = 4$. c) Đúng: các bình phương độ lệch $2{,}25;\\,2{,}25;\\,20{,}25;\\,20{,}25$, tổng $45$, $s^2 = 45/4 = 11{,}25$. d) Sai: $s = \\sqrt{11{,}25} \\approx 3{,}35 \\ne 3{,}5$.", "points": 1}, {"type": "short", "level": "TH", "q": "Cho mẫu số liệu: $10;\\, 20;\\, 30;\\, 40$. Phương sai của mẫu bằng bao nhiêu?", "answer": "125", "explain": "$\\overline{x} = 25$; các bình phương độ lệch $225;\\,25;\\,25;\\,225$; $s^2 = 500/4 = 125$.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Cho mẫu số liệu có $Q_1 = 5$, $Q_3 = 17$. Giá trị $x = 40$ có phải là giá trị bất thường không? (Trả lời Có hoặc Không)", "answer": "Có", "explain": "$\\Delta_Q = 12$; hàng rào trên là $17 + 1{,}5 \\times 12 = 35$; $40 \\gt 35$ nên là giá trị bất thường.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Khoảng biến thiên được kí hiệu là", "options": ["A. $R$.", "B. $\\Delta_Q$.", "C. $s$.", "D. $s^2$."], "answer": "A", "explain": "Khoảng biến thiên kí hiệu là $R$ (range).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khoảng tứ phân vị được kí hiệu là", "options": ["A. $\\Delta_Q$.", "B. $R$.", "C. $Q_2$.", "D. $M_e$."], "answer": "A", "explain": "Khoảng tứ phân vị kí hiệu là $\\Delta_Q = Q_3 - Q_1$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $1;\\, 10;\\, 100$. Khoảng biến thiên của mẫu là", "options": ["A. $99$.", "B. $100$.", "C. $90$.", "D. $111$."], "answer": "A", "explain": "$R = 100 - 1 = 99$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $2;\\, 8;\\, 4;\\, 6$ (sắp xếp: $2;\\, 4;\\, 6;\\, 8$). Khoảng tứ phân vị của mẫu là", "options": ["A. $4$.", "B. $6$.", "C. $3$.", "D. $5$."], "answer": "A", "explain": "$Q_1 = (2 + 4)/2 = 3$; $Q_3 = (6 + 8)/2 = 7$; $\\Delta_Q = 7 - 3 = 4$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cân nặng (kg) của 4 bạn: $40;\\, 45;\\, 50;\\, 65$. Giá trị bất thường của mẫu (nếu có) là", "options": ["A. Không có giá trị bất thường.", "B. $65$.", "C. $40$.", "D. $50$."], "answer": "A", "explain": "$Q_1 = 42{,}5$, $Q_3 = 57{,}5$, $\\Delta_Q = 15$; hàng rào là $[42{,}5 - 22{,}5;\\, 57{,}5 + 22{,}5] = [20;\\, 80]$; mọi giá trị đều nằm trong hàng rào.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho bảng tần số: giá trị $1$ (tần số $2$), giá trị $3$ (tần số $2$). Phương sai của mẫu là", "options": ["A. $1$.", "B. $2$.", "C. $4$.", "D. $0{,}5$."], "answer": "A", "explain": "$n = 4$; $\\overline{x} = (2\\cdot 1 + 2\\cdot 3)/4 = 2$; $s^2 = (2\\cdot 1 + 2\\cdot 1)/4 = 1$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Khoảng biến thiên dễ tính toán.", "b) Khoảng biến thiên sử dụng mọi giá trị của mẫu số liệu.", "c) Phương sai sử dụng mọi giá trị của mẫu số liệu.", "d) Độ lệch chuẩn là căn bậc hai của phương sai."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: chỉ cần max và min. b) Sai: chỉ dùng hai giá trị đầu mút. c) Đúng theo công thức. d) Đúng theo định nghĩa.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho mẫu số liệu: $15;\\, 25;\\, 35$. Xét tính đúng, sai:", "statements": ["a) $\\overline{x} = 25$.", "b) $s^2 = \\dfrac{200}{3}$.", "c) $s = \\dfrac{10\\sqrt{6}}{3}$.", "d) $R = 20$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng: các bình phương độ lệch $100;\\,0;\\,100$, $s^2 = 200/3$. c) Đúng: $\\sqrt{200/3} = 10\\sqrt{6}/3$. d) Đúng: $35 - 15 = 20$.", "points": 1}, {"type": "short", "level": "TH", "q": "Cho mẫu số liệu: $5;\\, 15;\\, 25$. Phương sai của mẫu bằng bao nhiêu (làm tròn đến 2 chữ số thập phân)?", "answer": "66,67", "explain": "$\\overline{x} = 15$; $s^2 = (100 + 0 + 100)/3 = 200/3 \\approx 66{,}67$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho mẫu số liệu: $4;\\, 8;\\, 12;\\, 16$. Có bao nhiêu giá trị bất thường?", "answer": "0", "explain": "$Q_1 = 6$,  4;\\, 5;\\, 6;\\, 7;\\, 8;\\, 9;\\, 10$. Phương sai của mẫu là", "options": ["A. $8{,}25$.", "B. $9{,}17$.", "C. $82{,}5$.", "D. $5{,}5$."], "answer": "A", "explain": "$\\overline{x} = 5{,}5$; tổng các bình phương độ lệch là $82{,}5$; $s^2 = 82{,}5/10 = 8{,}25$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho mẫu số liệu: $5;\\, 10;\\, 15$. Xét tính đúng, sai:", "statements": ["a) $R = 10$.", "b) $\\overline{x} = 10$.", "c) $s^2 = \\dfrac{50}{3}$.", "d) $\\Delta_Q = 10$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $15 - 5 = 10$. b) Đúng. c) Đúng: các bình phương độ lệch $25;\\,0;\\,25$, $s^2 = 50/3$. d) Đúng: $Q_1 = 5$, $Q_3 = 15$.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "So sánh độ phân tán của hai mẫu có cùng $\\overline{x} = 20$: mẫu X: $18;\\, 19;\\, 21;\\, 22$ và mẫu Y: $10;\\, 15;\\, 25;\\, 30$. Xét tính đúng, sai:", "statements": ["a) $s^2_X = 2{,}5$.", "b) $s^2_Y = 62{,}5$.", "c) Mẫu Y phân tán hơn mẫu X.", "d) $R_X = R_Y$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: tổng bình phương độ lệch $10$, $s^2_X = 10/4 = 2{,}5$. b) Đúng: tổng bình phương độ lệch $250$, $s^2_Y = 250/4 = 62{,}5$. c) Đúng vì $s^2_Y \\gt s^2_X$. d) Sai: $R_X = 4$, $R_Y = 20$.", "points": 1}, {"type": "short", "level": "NB", "q": "Cho mẫu số liệu: $3;\\, 7$. Khoảng biến thiên của mẫu bằng bao nhiêu?", "answer": "4", "explain": "$R = 7 - 3 = 4$.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho mẫu số liệu: $2;\\, 4;\\, 4;\\, 4;\\, 6$. Phương sai của mẫu bằng bao nhiêu (viết dưới dạng số thập phân)?", "answer": "1,6", "explain": "$\\overline{x} = 4$; các bình phương độ lệch $4;\\,0;\\,0;\\,0;\\,4$; $s^2 = 8/5 = 1{,}6$.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Công thức tính phương sai của mẫu số liệu $x_1, x_2, \\ldots, x_n$ là", "options": ["A. $s^2 = \\dfrac{(x_1 - \\overline{x})^2 + \\ldots + (x_n - \\overline{x})^2}{n}$.", "B. $s^2 = \\dfrac{(x_1 - \\overline{x})^2 + R$ bị giá trị bất thường thổi phồng.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho mẫu số liệu: $20;\\, 30;\\, 40;\\, 50$. Khoảng tứ phân vị của mẫu bằng bao nhiêu?", "answer": "20", "explain": "$Q_1 = (20 + 30)/2 = 25$; $Q_3 = (40 + 50)/2 = 45$; $\\Delta_Q = 45 - 25 = 20$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho mẫu số liệu: $2;\\, 8;\\, 14$. Phương sai của mẫu bằng bao nhiêu?", "answer": "24", "explain": "$\\overline{x} = 8$; các bình phương độ lệch $36;\\,0;\\,36$; $s^2 = 72/3 = 24$.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Độ lệch chuẩn có đơn vị", "options": ["A. cùng đơn vị với số liệu gốc.", "B. là bình phương đơn vị của số liệu gốc.", "C. không có đơn vị.", "D. là nghịch đảo đơn vị của số liệu gốc."], "answer": "A", "explain": "Vì $s = \\sqrt{s^2}$ nên độ lệch chuẩn có cùng đơn vị với số liệu gốc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đơn vị của phương sai là", "options": ["A. bình phương đơn vị của số liệu gốc.", "B. cùng đơn vị với số liệu gốc.", "C. không có đơn vị.", "D. là căn bậc hai đơn vị của số liệu gốc."], "answer": "A", "explain": "Phương sai là trung bình của các bình phương độ lệch nên có đơn vị là bình phương đơn vị gốc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $100;\\, 200;\\, 300$. Độ lệch chuẩn của mẫu là", "options": ["A. $\\dfrac{100\\sqrt{6}}{3}$.", "B. $\\sqrt{20000}$.", "C. $100$.", "D. $\\dfrac{20000}{3}$."], "answer": "A", "explain": "$\\overline{x} = 200$; $s^2 = 20000/3$ nên $s = \\sqrt{20000/3} = 100\\sqrt{6}/3$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẫu số liệu: $5;\\, 15;\\, 10;\\, 20$ (sắp xếp: $5;\\, 10;\\, 15;\\, 20$). Khoảng tứ phân vị của mẫu là", "options": ["A. $10$.", "B. $15$.", "C. $5$.", "D. $7{,}5$."], "answer": "A", "explain": "$Q_1 = (5 + 10)/2 = 7{,}5$; $Q_3 = (15 + 20)/2 = 17{,}5$; $\\Delta_Q = 10$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Điểm các môn học của Bình có $s = 0{,}4$; của An có $s = 1{,}1$ (cùng trung bình $8{,}0$). Ai học đều các môn hơn?", "options": ["A. Bình.", "B. An.", "C. Hai bạn đều như nhau.", "D. Không kết luận được."], "answer": "A", "explain": "Độ lệch chuẩn càng nhỏ thì điểm các môn càng tập trung quanh trung bình, tức học đều hơn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mẫu số liệu: $1;\\, 4;\\, 9;\\, 16;\\, 25$. Phương sai của mẫu là", "options": ["A. $74{,}8$.", "B. $374$.", "C. $55$.", "D. $11$."], "answer": "A", "explain": "$\\overline{x} = 11$; tổng các bình phương độ lệch là $374$; $s^2 = 374/5 = 74{,}8$.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Cho mẫu số liệu: $8;\\, 18;\\, 28$. Xét tính đúng, sai:", "statements": ["a) $\\overline{x} = 18$.", "b) $s^2 = \\dfrac{200}{3}$.", "c) $s \\approx 8{,}16$.", "d) $R = 20$ và $\\Delta_Q = 20$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng: các bình phương độ lệch $100;\\,0;\\,100$. c) Đúng. d) Đúng: $R = 28 - 8 = 20$; $Q_1 = 8$, $Q_3 = 28$ nên $\\Delta_Q = 20$.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho bảng tần số: giá trị $4$ (tần số $3$), giá trị $8$ (tần số $1$). Xét tính đúng, sai:", "statements": ["a) $n = 4$.", "b) $\\overline{x} = 5$.", "c) $s^2 = 3$.", "d) $s = \\sqrt{3}$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $3 + 1 = 4$. b) Đúng: $(3\\cdot 4 + 8)/4 = 5$. c) Đúng: $s^2 = (3\\cdot 1 + 9)/4 = 3$. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho mẫu số liệu: $12;\\, 18;\\, 24$. Phương sai của mẫu bằng bao nhiêu?", "answer": "24", "explain": "$\\overline{x} = 18$; các bình phương độ lệch $36;\\,0;\\,36$; $s^2 = 72/3 = 24$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho mẫu số liệu có $Q_1 = 10$, $Q_3 = 30$. Giá trị $x = 65$ có phải là giá trị bất thường không? (Trả lời Có hoặc Không)", "answer": "Có", "explain": "$\\Delta_Q = 20$; hàng rào trên là $30 + 30 = 60$; $65 \\gt 60$ nên là giá trị bất thường.", "points": 0.5}]}]}
