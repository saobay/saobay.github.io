<script type="application/json" class="saobay-exam10-data">{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Bất phương trình nào sau đây là bất phương trình bậc nhất hai ẩn?","options":["A. $3x - 2y \\le 7$","B. $x^2 + y \\ge 1$","C. $\\frac{1}{x} + y \\lt 2$","D. $x + y + z \\ge 0$"],"answer":"A","explain":"Đáp án A có dạng $ax + by \\le c$ với $a^2 + b^2 \\gt 0$. B có $x^2$, C có $\\frac{1}{x}$, D có ba ẩn.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(2; 1)$ là nghiệm của hệ nào sau đây?","options":["A. $\\begin{cases} x + y \\le 4 \\\\ x - y \\ge 0 \\end{cases}$","B. $\\begin{cases} x + y \\lt 3 \\\\ x \\ge 0 \\end{cases}$","C. $\\begin{cases} x - y \\gt 1 \\\\ y \\ge 0 \\end{cases}$","D. $\\begin{cases} 2x \\gt 5 \\\\ y \\ge 0 \\end{cases}$"],"answer":"A","explain":"Thay $(2; 1)$: A: $3 \\le 4$ đúng và $1 \\ge 0$ đúng. B: $3 \\lt 3$ sai; C: $1 \\gt 1$ sai; D: $4 \\gt 5$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của bất phương trình $2x - y \\ge 4$ là nửa mặt phẳng nào?","options":["A. Bờ $2x - y = 4$, không chứa gốc $O$, kể cả bờ","B. Bờ $2x - y = 4$, chứa gốc $O$, kể cả bờ","C. Bờ $2x - y = 4$, không chứa gốc $O$, không kể bờ","D. Bờ $2x - y = 4$, chứa gốc $O$, không kể bờ"],"answer":"A","explain":"Thay $O(0; 0)$: $0 \\ge 4$ sai nên miền nghiệm không chứa $O$; dấu $\\ge$ nên kể cả bờ (vẽ nét liền).","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + y \\le 5 \\end{cases}$ là tam giác có diện tích bằng","options":["A. $10$","B. $12{,}5$","C. $25$","D. $15$"],"answer":"B","explain":"Tam giác vuông với hai cạnh góc vuông bằng $5$ nên diện tích bằng $\\frac{1}{2} \\cdot 5 \\cdot 5 = 12{,}5$.","points":0.25},{"type":"mcq","level":"VD","q":"Tìm $m \\gt 0$ để hệ $\\begin{cases} x + y \\le m \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$ có miền nghiệm là tam giác với diện tích bằng $8$.","options":["A. $2$","B. $4$","C. $8$","D. $16$"],"answer":"B","explain":"Miền nghiệm là tam giác vuông cân với hai cạnh góc vuông bằng $m$, diện tích $\\frac{1}{2}m^2 = 8 \\Rightarrow m^2 = 16 \\Rightarrow m = 4$ (vì $m \\gt 0$).","points":0.25},{"type":"mcq","level":"VDC","q":"Tìm giá trị lớn nhất của $F(x; y) = 4x + 3y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + y \\le 6 \\end{cases}$.","options":["A. $18$","B. $24$","C. $30$","D. $36$"],"answer":"B","explain":"Các đỉnh: $(0;0), (6;0), (0;6)$. $F$: $0; 24; 18$. Giá trị lớn nhất là $24$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $x + 2y = 5$ là một bất phương trình bậc nhất hai ẩn.","b) Cặp $(1; 2)$ là nghiệm của bất phương trình $x + y \\le 3$.","c) Miền nghiệm của bất phương trình bậc nhất hai ẩn là một nửa mặt phẳng.","d) Đường biên của miền nghiệm luôn được vẽ bằng nét liền."],"answer":["F","T","T","F"],"explain":"a) Sai: đây là phương trình. b) Đúng: $3 \\le 3$. c) Đúng theo định nghĩa miền nghiệm. d) Sai: dấu $\\lt, \\gt$ thì vẽ nét đứt.","points":1},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} 2x + y \\le 8 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(4; 0)$ là nghiệm của hệ.","b) Miền nghiệm của hệ là tam giác kể cả ba cạnh.","c) Cặp $(2; 5)$ là nghiệm của hệ.","d) Giá trị lớn nhất của $2x + y$ trên miền nghiệm là $8$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $8 \\le 8$. b) Đúng: tam giác $OAB$ với $A(4;0), B(0;8)$. c) Sai: $9 \\le 8$ sai. d) Đúng: $2x + y$ tại các đỉnh là $0, 8, 8$.","points":1},{"type":"short","level":"VD","q":"Tìm $m$ để bất phương trình $(m - 3)x + 0y \\le 5$ KHÔNG phải là bất phương trình bậc nhất hai ẩn.","answer":"3","explain":"Không phải bất phương trình bậc nhất hai ẩn khi cả hai hệ số của $x, y$ đều bằng $0$, tức $m - 3 = 0 \\Rightarrow m = 3$.","points":0.5},{"type":"short","level":"VDC","q":"Tìm giá trị lớn nhất của $L(x; y) = 2x + 5y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 3x + 2y \\le 12 \\end{cases}$.","answer":"30","explain":"Các đỉnh: $(0;0), (4;0), (0;6)$. $L$: $0; 8; 30$. Giá trị lớn nhất là $30$.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Hệ nào sau đây gồm đúng hai bất phương trình?","options":["A. $\\begin{cases} x + y \\le 1 \\\\ x - y \\ge 0 \\end{cases}$","B. $\\begin{cases} x \\le 1 \\end{cases}$","C. $\\begin{cases} x + y \\le 1 \\\\ x - y \\ge 0 \\\\ x \\ge 0 \\end{cases}$","D. $\\begin{cases} x^2 \\le 1 \\\\ y^2 \\le 1 \\end{cases}$"],"answer":"A","explain":"Đáp án A gồm đúng hai bất phương trình bậc nhất hai ẩn. D không phải hệ bất phương trình bậc nhất hai ẩn.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(0; 3)$ là nghiệm của bất phương trình nào sau đây?","options":["A. $x + y \\le 2$","B. $2x - y \\ge -3$","C. $x - y \\gt 0$","D. $3x + y \\lt 2$"],"answer":"B","explain":"Thay $(0; 3)$: A: $3 \\le 2$ sai; B: $-3 \\ge -3$ đúng; C: $-3 \\gt 0$ sai; D: $3 \\lt 2$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm nào sau đây thuộc miền nghiệm của hệ $\\begin{cases} x - y \\le 1 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$?","options":["A. $(0; 0)$","B. $(2; 0)$","C. $(3; 1)$","D. $(4; 2)$"],"answer":"A","explain":"Thay $(0; 0)$: $0 \\le 1$ đúng. B: $2 \\le 1$ sai; C: $2 \\le 1$ sai; D: $2 \\le 1$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Bất phương trình nào sau đây có miền nghiệm không chứa gốc $O$ và không kể bờ?","options":["A. $x + y \\lt -1$","B. $x + y \\le -1$","C. $x + y \\lt 1$","D. $x + y \\le 1$"],"answer":"A","explain":"Thay $O$: $0 \\lt -1$ sai nên không chứa $O$; dấu $\\lt$ nên không kể bờ (nét đứt).","points":0.25},{"type":"mcq","level":"VD","q":"Hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + 3y \\le 12 \\end{cases}$ có miền nghiệm là tam giác $OAB$ với $B$ nằm trên trục $Oy$. Tọa độ điểm $B$ là","options":["A. $(0; 3)$","B. $(0; 4)$","C. $(0; 12)$","D. $(4; 0)$"],"answer":"B","explain":"Trên trục $Oy$ thì $x = 0$, thay vào $x + 3y = 12$ được $y = 4$, vậy $B(0; 4)$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tìm giá trị nhỏ nhất của $F(x; y) = 5x + 2y$ trên miền nghiệm của hệ $\\begin{cases} 1 \\le x \\le 4 \\\\ 2 \\le y \\le 5 \\end{cases}$.","options":["A. $9$","B. $15$","C. $24$","D. $30$"],"answer":"A","explain":"Các đỉnh: $(1;2), (4;2), (1;5), (4;5)$. $F$: $9; 24; 15; 30$. Giá trị nhỏ nhất là $9$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nghiệm của hệ bất phương trình phải thỏa mãn tất cả các bất phương trình trong hệ.","b) Cặp $(1; 1)$ là nghiệm của hệ $\\begin{cases} x \\le 2 \\\\ y \\le 2 \\end{cases}$.","c) Miền nghiệm của hệ là hợp của các miền nghiệm thành phần.","d) Hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\end{cases}$ có vô số nghiệm."],"answer":["T","T","F","T"],"explain":"a) Đúng: phải đồng thời thỏa mãn tất cả. b) Đúng: $1 \\le 2$. c) Sai: là giao, không phải hợp. d) Đúng: góc phần tư thứ nhất có vô số điểm.","points":1},{"type":"truefalse","level":"TH","q":"Cho bất phương trình $3x - y \\le 6$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(2; 0)$ là nghiệm của bất phương trình.","b) Đường biên $3x - y = 6$ được vẽ bằng nét liền.","c) Miền nghiệm của bất phương trình chứa gốc tọa độ $O$.","d) Hệ $\\begin{cases} 3x - y \\le 6 \\\\ x + y \\ge 7 \\end{cases}$ vô nghiệm."],"answer":["T","T","T","F"],"explain":"a) Đúng: $6 \\le 6$. b) Đúng: dấu $\\le$ nên kể cả bờ. c) Đúng: $0 \\le 6$. d) Sai: ví dụ $(3; 4)$ thỏa mãn $5 \\le 6$ và $7 \\ge 7$ nên hệ có nghiệm.","points":1},{"type":"short","level":"VD","q":"Hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + 2y \\le 10 \\end{cases}$ có miền nghiệm là tam giác $OAB$ với $A$ nằm trên trục $Ox$. Tìm hoành độ của điểm $A$.","answer":"10","explain":"Trên trục $Ox$ thì $y = 0$, thay vào $x + 2y = 10$ được $x = 10$.","points":0.5},{"type":"short","level":"VDC","q":"Một nông dân trồng $x$ ha lúa (lãi $10$ triệu đồng một ha) và $y$ ha ngô (lãi $15$ triệu đồng một ha). Điều kiện: $x + y \\le 8$, $y \\le 5$, $x \\ge 0, y \\ge 0$. Lợi nhuận lớn nhất (tính bằng triệu đồng) mà nông dân đạt được là bao nhiêu?","answer":"105","explain":"Lợi nhuận $L = 10x + 15y$. Các đỉnh: $(0;0), (8;0), (3;5), (0;5)$. $L$: $0; 80; 105; 75$. Giá trị lớn nhất là $105$ triệu đồng.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Khẳng định nào sau đây đúng về miền nghiệm của bất phương trình $ax + by \\le c$?","options":["A. Là nửa mặt phẳng bờ $ax + by = c$","B. Là đường thẳng $ax + by = c$","C. Là một điểm duy nhất","D. Là cả mặt phẳng tọa độ"],"answer":"A","explain":"Miền nghiệm của $ax + by \\le c$ là nửa mặt phẳng có bờ là đường thẳng $ax + by = c$.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(3; 0)$ KHÔNG là nghiệm của hệ nào sau đây?","options":["A. $\\begin{cases} x + y \\le 5 \\\\ x \\ge 0 \\end{cases}$","B. $\\begin{cases} x - y \\ge 4 \\\\ y \\ge 0 \\end{cases}$","C. $\\begin{cases} 2x \\le 7 \\\\ y \\ge 0 \\end{cases}$","D. $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\end{cases}$"],"answer":"B","explain":"Thay $(3; 0)$: B có $3 \\ge 4$ sai nên không là nghiệm. A: $3 \\le 5$ là nghiệm; C: $6 \\le 7$ là nghiệm; D là nghiệm.","points":0.25},{"type":"mcq","level":"TH","q":"Bất phương trình $2(x + 3) - 3(y - 1) \\le 11$ tương đương với bất phương trình nào sau đây?","options":["A. $2x - 3y \\le 2$","B. $2x - 3y \\le 11$","C. $2x - 3y \\le 20$","D. $2x + 3y \\le 2$"],"answer":"A","explain":"$2x + 6 - 3y + 3 \\le 11 \\Leftrightarrow 2x - 3y + 9 \\le 11 \\Leftrightarrow 2x - 3y \\le 2$.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của hệ $\\begin{cases} x \\le 3 \\\\ y \\le 3 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$ là hình vuông có chu vi bằng","options":["A. $6$","B. $9$","C. $12$","D. $36$"],"answer":"C","explain":"Hình vuông cạnh $3$ nên chu vi bằng $12$.","points":0.25},{"type":"mcq","level":"VD","q":"Tìm số nguyên $m$ lớn nhất để cặp $(2; m)$ là nghiệm của bất phương trình $3x + y \\le 10$.","options":["A. $2$","B. $3$","C. $4$","D. $5$"],"answer":"C","explain":"Thay vào: $6 + m \\le 10 \\Leftrightarrow m \\le 4$. Số nguyên lớn nhất thỏa mãn là $4$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hệ $\\begin{cases} x + y \\le 4 \\\\ 2x + y \\le 6 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Giá trị lớn nhất của $F(x; y) = 5x + 3y$ trên miền nghiệm của hệ là","options":["A. $12$","B. $15$","C. $16$","D. $20$"],"answer":"C","explain":"Các đỉnh: $(0;0), (3;0), (2;2), (0;4)$ (giao hai đường biên: $x = 2, y = 2$). $F$: $0; 15; 16; 12$. Giá trị lớn nhất là $16$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bất phương trình $2x + 3y \\gt 5$ có miền nghiệm không kể bờ.","b) Cặp $(2; 1)$ là nghiệm của bất phương trình $2x + 3y \\gt 5$.","c) Bất phương trình $x \\le -2$ có miền nghiệm là nửa mặt phẳng bên trái đường thẳng $x = -2$, kể cả bờ.","d) Điểm $(1; 1)$ thuộc miền nghiệm của bất phương trình $x + y \\lt 1$."],"answer":["T","T","T","F"],"explain":"a) Đúng: dấu $\\gt$ nên không kể bờ. b) Đúng: $7 \\gt 5$. c) Đúng. d) Sai: $2 \\lt 1$ sai.","points":1},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} x + y \\le 6 \\\\ x \\ge 1 \\\\ y \\ge 1 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(1; 1)$ là nghiệm của hệ.","b) Miền nghiệm của hệ là một tam giác.","c) Cặp $(5; 1)$ là nghiệm của hệ.","d) Diện tích miền nghiệm của hệ bằng $12$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $2 \\le 6$. b) Đúng: tam giác với các đỉnh $(1;1), (5;1), (1;5)$. c) Đúng: $6 \\le 6$. d) Sai: diện tích bằng $\\frac{1}{2} \\cdot 4 \\cdot 4 = 8$.","points":1},{"type":"short","level":"VD","q":"Tìm hoành độ giao điểm của hai đường biên $x + 2y = 6$ và $3x - y = 4$.","answer":"2","explain":"Từ phương trình thứ hai: $y = 3x - 4$. Thay vào phương trình thứ nhất: $x + 6x - 8 = 6 \\Rightarrow 7x = 14 \\Rightarrow x = 2$.","points":0.5},{"type":"short","level":"VDC","q":"Tìm giá trị lớn nhất của $F(x; y) = 4x + y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + 3y \\le 9 \\end{cases}$.","answer":"36","explain":"Các đỉnh: $(0;0), (9;0), (0;3)$. $F$: $0; 36; 3$. Giá trị lớn nhất là $36$.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Miền nghiệm của hệ bất phương trình bậc nhất hai ẩn là","options":["A. giao của các miền nghiệm của từng bất phương trình trong hệ","B. hợp của các miền nghiệm của từng bất phương trình trong hệ","C. một điểm duy nhất","D. tập rỗng"],"answer":"A","explain":"Miền nghiệm của hệ là giao của các miền nghiệm của từng bất phương trình trong hệ.","points":0.25},{"type":"mcq","level":"NB","q":"Bất phương trình nào sau đây có cặp $(0; 0)$ là nghiệm?","options":["A. $x + y \\le -5$","B. $2x - 3y \\ge 1$","C. $-x - y \\le 0$","D. $x - y \\gt 0$"],"answer":"C","explain":"Thay $(0; 0)$: A: $0 \\le -5$ sai; B: $0 \\ge 1$ sai; C: $0 \\le 0$ đúng; D: $0 \\gt 0$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x \\le 2 \\\\ y \\le 5 \\end{cases}$ là hình chữ nhật có diện tích bằng","options":["A. $7$","B. $10$","C. $14$","D. $20$"],"answer":"B","explain":"Hình chữ nhật $2 \\times 5$ nên diện tích bằng $10$.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm nào sau đây thuộc đường biên của miền nghiệm của bất phương trình $5x - 2y \\le 10$?","options":["A. $(2; 0)$","B. $(0; 5)$","C. $(4; 4)$","D. $(0; 0)$"],"answer":"A","explain":"Điểm thuộc đường biên $5x - 2y = 10$: A cho $10 = 10$ đúng. B: $-10 \\ne 10$; C: $12 \\ne 10$; D: $0 \\ne 10$.","points":0.25},{"type":"mcq","level":"VD","q":"Hệ $\\begin{cases} 2x + y \\le 10 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$ có miền nghiệm là tam giác $OAB$. Diện tích tam giác $OAB$ bằng","options":["A. $20$","B. $25$","C. $50$","D. $100$"],"answer":"B","explain":"Tam giác vuông với hai cạnh góc vuông $OA = 5, OB = 10$ nên diện tích bằng $\\frac{1}{2} \\cdot 5 \\cdot 10 = 25$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tìm giá trị lớn nhất của $F(x; y) = 2x + 3y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + y \\le 5 \\\\ 2x + y \\le 8 \\end{cases}$.","options":["A. $8$","B. $12$","C. $15$","D. $20$"],"answer":"C","explain":"Các đỉnh: $(0;0), (4;0), (3;2), (0;5)$ (giao hai đường biên: $x = 3, y = 2$). $F$: $0; 8; 12; 15$. Giá trị lớn nhất là $15$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hệ $\\begin{cases} x \\le 1 \\\\ y \\le 1 \\end{cases}$ có miền nghiệm chứa điểm $(0; 0)$.","b) Bất phương trình $x + y \\ge 0$ có miền nghiệm chứa gốc tọa độ $O$.","c) Cặp $(2; -1)$ là nghiệm của bất phương trình $x - y \\le 3$.","d) Miền nghiệm của hệ $\\begin{cases} x \\gt 2 \\end{cases}$ kể cả đường thẳng $x = 2$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $0 \\le 1$. b) Đúng: $0 \\ge 0$. c) Đúng: $3 \\le 3$. d) Sai: dấu $\\gt$ nên không kể bờ.","points":1},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} 3x + 2y \\le 12 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(4; 0)$ là nghiệm của hệ.","b) Miền nghiệm của hệ là tam giác kể cả ba cạnh.","c) Giá trị lớn nhất của $x + 2y$ trên miền nghiệm là $12$.","d) Cặp $(2; 4)$ là nghiệm của hệ."],"answer":["T","T","T","F"],"explain":"a) Đúng: $12 \\le 12$. b) Đúng: tam giác $OAB$ với $A(4;0), B(0;6)$. c) Đúng: $x + 2y$ tại các đỉnh là $0, 4, 12$. d) Sai: $6 + 8 = 14 \\le 12$ sai.","points":1},{"type":"short","level":"VD","q":"Tìm $m$ để bất phương trình $(m + 1)x + (m + 1)y \\le 2$ KHÔNG phải là bất phương trình bậc nhất hai ẩn.","answer":"-1","explain":"Cần $m + 1 = 0$ (cả hai hệ số của $x, y$ đều bằng $0$), suy ra $m = -1$.","points":0.5},{"type":"short","level":"VDC","q":"Một trang trại nuôi $x$ con gà (lãi $50$ nghìn đồng một con) và $y$ con vịt (lãi $70$ nghìn đồng một con). Điều kiện: $x + y \\le 200$, $y \\le 120$, $x \\ge 0, y \\ge 0$. Lợi nhuận lớn nhất (tính bằng nghìn đồng) mà trang trại đạt được là bao nhiêu?","answer":"12400","explain":"Lợi nhuận $L = 50x + 70y$. Các đỉnh: $(0;0), (200;0), (80;120), (0;120)$. $L$: $0; 10000; 12400; 8400$. Giá trị lớn nhất là $12400$ nghìn đồng.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Dạng nào sau đây KHÔNG phải là bất phương trình bậc nhất hai ẩn?","options":["A. $ax + by \\le c$","B. $ax + by \\ge c$","C. $ax + by \\lt c$","D. $ax + by = c$"],"answer":"D","explain":"Đáp án D là phương trình bậc nhất hai ẩn, không phải bất phương trình.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(1; 4)$ là nghiệm của hệ nào sau đây?","options":["A. $\\begin{cases} x + 2y \\le 10 \\\\ x \\ge 0 \\end{cases}$","B. $\\begin{cases} x + y \\lt 5 \\\\ y \\ge 0 \\end{cases}$","C. $\\begin{cases} 3x \\le 2 \\\\ y \\ge 0 \\end{cases}$","D. $\\begin{cases} y \\gt 4 \\\\ x \\ge 0 \\end{cases}$"],"answer":"A","explain":"Thay $(1; 4)$: A: $9 \\le 10$ đúng và $1 \\ge 0$ đúng. B: $5 \\lt 5$ sai; C: $3 \\le 2$ sai; D: $4 \\gt 4$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của bất phương trình $y \\ge 3x - 2$ chứa điểm nào sau đây?","options":["A. $(0; 0)$","B. $(1; -1)$","C. $(2; 3)$","D. $(3; 6)$"],"answer":"A","explain":"Thay $(0; 0)$: $0 \\ge -2$ đúng. B: $-1 \\ge 1$ sai; C: $3 \\ge 4$ sai; D: $6 \\ge 7$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Hệ nào sau đây có miền nghiệm là góc phần tư thứ nhất (kể cả hai trục tọa độ)?","options":["A. $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\end{cases}$","B. $\\begin{cases} x \\le 0 \\\\ y \\le 0 \\end{cases}$","C. $\\begin{cases} x + y \\le 0 \\end{cases}$","D. $\\begin{cases} x \\ge 1 \\\\ y \\ge 1 \\end{cases}$"],"answer":"A","explain":"Hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\end{cases}$ có miền nghiệm chính là góc phần tư thứ nhất kể cả hai trục tọa độ.","points":0.25},{"type":"mcq","level":"VD","q":"Bất phương trình $(x - 2)^2 - (x + 2)^2 + 4y \\ge 0$ tương đương với bất phương trình nào sau đây?","options":["A. $y \\ge 2x$","B. $y \\le 2x$","C. $2x + y \\ge 0$","D. $-2x + y \\le 0$"],"answer":"A","explain":"$(x^2 - 4x + 4) - (x^2 + 4x + 4) = -8x$ nên bất phương trình thành $-8x + 4y \\ge 0 \\Leftrightarrow y \\ge 2x$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tìm giá trị lớn nhất của $F(x; y) = 7x + 5y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 2x + 3y \\le 12 \\end{cases}$.","options":["A. $20$","B. $30$","C. $42$","D. $60$"],"answer":"C","explain":"Các đỉnh: $(0;0), (6;0), (0;4)$. $F$: $0; 42; 20$. Giá trị lớn nhất là $42$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hệ gồm ba bất phương trình thì miền nghiệm là giao của ba miền nghiệm thành phần.","b) Cặp $(2; 2)$ là nghiệm của hệ $\\begin{cases} x \\le 3 \\\\ y \\le 3 \\\\ x + y \\ge 3 \\end{cases}$.","c) Hệ $\\begin{cases} x \\lt 0 \\\\ x \\gt 0 \\end{cases}$ vô nghiệm.","d) Miền nghiệm của mọi hệ bất phương trình đều chứa gốc tọa độ $O$."],"answer":["T","T","T","F"],"explain":"a) Đúng theo định nghĩa miền nghiệm của hệ. b) Đúng: $2 \\le 3$ và $4 \\ge 3$. c) Đúng: không có $x$ nào thỏa mãn. d) Sai: ví dụ hệ $\\begin{cases} x \\ge 1 \\\\ y \\ge 1 \\end{cases}$.","points":1},{"type":"truefalse","level":"TH","q":"Cho bất phương trình $-2x + 3y \\gt 6$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Gốc tọa độ $O$ không là nghiệm của bất phương trình.","b) Miền nghiệm của bất phương trình không chứa gốc tọa độ $O$.","c) Đường biên $-2x + 3y = 6$ được vẽ bằng nét đứt.","d) Điểm $(0; 2)$ là nghiệm của bất phương trình."],"answer":["T","T","T","F"],"explain":"a) Đúng: $0 \\gt 6$ sai. b) Đúng vì $O$ không là nghiệm. c) Đúng: dấu $\\gt$ nên không kể bờ. d) Sai: $6 \\gt 6$ sai.","points":1},{"type":"short","level":"VD","q":"Hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 4x + 3y \\le 24 \\end{cases}$ có miền nghiệm là tam giác $OAB$ với $B$ nằm trên trục $Oy$. Tìm tung độ của điểm $B$.","answer":"8","explain":"Trên trục $Oy$ thì $x = 0$, thay vào $4x + 3y = 24$ được $y = 8$.","points":0.5},{"type":"short","level":"VDC","q":"Tìm giá trị lớn nhất của $F(x; y) = 3x + 2y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + y \\le 10 \\\\ x \\le 6 \\end{cases}$.","answer":"26","explain":"Các đỉnh: $(0;0), (6;0), (6;4), (0;10)$. $F$: $0; 18; 26; 20$. Giá trị lớn nhất là $26$.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Cặp $(x_0; y_0)$ là nghiệm của bất phương trình $ax + by \\le c$ khi","options":["A. $ax_0 + by_0 \\le c$ là khẳng định đúng","B. $ax_0 + by_0 \\le c$ là khẳng định sai","C. $ax_0 + by_0 = c$","D. Không xác định được"],"answer":"A","explain":"Theo định nghĩa, $(x_0; y_0)$ là nghiệm khi thay vào bất phương trình được khẳng định đúng.","points":0.25},{"type":"mcq","level":"NB","q":"Hệ nào sau đây vô nghiệm?","options":["A. $\\begin{cases} x \\ge 2 \\\\ x \\le 1 \\end{cases}$","B. $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\end{cases}$","C. $\\begin{cases} x + y \\le 5 \\end{cases}$","D. $\\begin{cases} x \\le 3 \\\\ y \\le 3 \\end{cases}$"],"answer":"A","explain":"Không có số thực $x$ nào vừa $\\ge 2$ vừa $\\le 1$ nên hệ vô nghiệm.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của bất phương trình $3x + 2y \\lt 12$ không chứa điểm nào sau đây?","options":["A. $(0; 0)$","B. $(4; 0)$","C. $(0; 5)$","D. $(2; 2)$"],"answer":"B","explain":"Thay $(4; 0)$: $12 \\lt 12$ sai nên không thuộc miền nghiệm. A: $0 \\lt 12$ thuộc; C: $10 \\lt 12$ thuộc; D: $10 \\lt 12$ thuộc.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm nào sau đây là nghiệm của hệ $\\begin{cases} x + y \\ge 4 \\\\ x \\le 5 \\\\ y \\le 5 \\end{cases}$?","options":["A. $(5; 5)$","B. $(0; 0)$","C. $(6; 0)$","D. $(0; 6)$"],"answer":"A","explain":"Thay $(5; 5)$: $10 \\ge 4$, $5 \\le 5$, $5 \\le 5$ đều đúng. B: $0 \\ge 4$ sai; C: $6 \\le 5$ sai; D: $6 \\le 5$ sai.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 5x + 4y \\le 20 \\end{cases}$. Diện tích miền nghiệm của hệ bằng","options":["A. $10$","B. $20$","C. $40$","D. $50$"],"answer":"A","explain":"Tam giác vuông với hai cạnh góc vuông $4$ và $5$ nên diện tích bằng $\\frac{1}{2} \\cdot 4 \\cdot 5 = 10$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tìm giá trị nhỏ nhất của $F(x; y) = x + 3y$ trên miền nghiệm của hệ $\\begin{cases} 2 \\le x \\le 6 \\\\ 1 \\le y \\le 4 \\end{cases}$.","options":["A. $5$","B. $9$","C. $14$","D. $18$"],"answer":"A","explain":"Các đỉnh: $(2;1), (6;1), (2;4), (6;4)$. $F$: $5; 9; 14; 18$. Giá trị nhỏ nhất là $5$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bất phương trình $x \\gt 5$ có miền nghiệm là nửa mặt phẳng bên phải đường thẳng $x = 5$, không kể bờ.","b) Cặp $(5; 0)$ không là nghiệm của bất phương trình $x \\gt 5$.","c) $0x + 0y \\lt 1$ là bất phương trình bậc nhất hai ẩn.","d) Miền nghiệm của bất phương trình $y \\le 0$ là nửa mặt phẳng phía dưới trục $Ox$, kể cả trục $Ox$."],"answer":["T","T","F","T"],"explain":"a) Đúng: dấu $\\gt$ nên không kể bờ. b) Đúng: $5 \\gt 5$ sai. c) Sai: $a = b = 0$. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} x + 4y \\le 16 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(0; 4)$ là nghiệm của hệ.","b) Miền nghiệm của hệ là tam giác kể cả ba cạnh.","c) Giá trị lớn nhất của $2x + y$ trên miền nghiệm là $32$.","d) Cặp $(8; 3)$ là nghiệm của hệ."],"answer":["T","T","T","F"],"explain":"a) Đúng: $16 \\le 16$. b) Đúng: tam giác $OAB$ với $A(16;0), B(0;4)$. c) Đúng: $2x + y$ tại các đỉnh là $0, 32, 4$. d) Sai: $8 + 12 = 20 \\le 16$ sai.","points":1},{"type":"short","level":"VD","q":"Điểm $M(2; a)$ thuộc đường biên của miền nghiệm của bất phương trình $x + 3y \\le 11$. Tìm $a$.","answer":"3","explain":"$M$ thuộc đường biên $x + 3y = 11$ nên $2 + 3a = 11 \\Leftrightarrow a = 3$.","points":0.5},{"type":"short","level":"VDC","q":"Một xưởng may $x$ cái áo (lãi $40$ nghìn đồng một cái) và $y$ cái quần (lãi $60$ nghìn đồng một cái). Điều kiện: $2x + 3y \\le 120$ (vải), $x + y \\le 50$, $x \\ge 0, y \\ge 0$. Lợi nhuận lớn nhất (tính bằng nghìn đồng) mà xưởng đạt được là bao nhiêu?","answer":"2400","explain":"Lợi nhuận $L = 40x + 60y$. Các đỉnh: $(0;0), (50;0), (30;20), (0;40)$. $L$: $0; 2000; 2400; 2400$. Giá trị lớn nhất là $2400$ nghìn đồng.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Hệ bất phương trình bậc nhất hai ẩn gồm","options":["A. hai hay nhiều bất phương trình bậc nhất hai ẩn","B. một bất phương trình duy nhất","C. các phương trình bậc nhất","D. một ẩn duy nhất"],"answer":"A","explain":"Theo định nghĩa, hệ bất phương trình bậc nhất hai ẩn là một hệ gồm hai hay nhiều bất phương trình bậc nhất hai ẩn $x, y$.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(4; 1)$ là nghiệm của bất phương trình nào sau đây?","options":["A. $x + 3y \\le 6$","B. $2x - y \\ge 7$","C. $x - 2y \\gt 3$","D. $3x + y \\lt 12$"],"answer":"B","explain":"Thay $(4; 1)$: A: $7 \\le 6$ sai; B: $7 \\ge 7$ đúng; C: $2 \\gt 3$ sai; D: $13 \\lt 12$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của hệ $\\begin{cases} y \\ge 2x \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$ là","options":["A. một miền góc vô hạn","B. một tam giác","C. một nửa mặt phẳng","D. một hình thang"],"answer":"A","explain":"Điều kiện $y \\ge 2x, x \\ge 0, y \\ge 0$ cho một miền góc vô hạn trong góc phần tư thứ nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Bất phương trình nào sau đây có đường biên là trục $Oy$?","options":["A. $x \\le 0$","B. $y \\le 0$","C. $x + y \\le 0$","D. $x \\ge 1$"],"answer":"A","explain":"Đường biên của $x \\le 0$ là đường thẳng $x = 0$, chính là trục $Oy$.","points":0.25},{"type":"mcq","level":"VD","q":"Tìm $m$ để cặp $(m; 2)$ thỏa mãn bất phương trình $2x - 3y \\le 0$ với dấu bằng.","options":["A. $2$","B. $3$","C. $4$","D. $6$"],"answer":"B","explain":"Dấu bằng: $2m - 6 = 0 \\Leftrightarrow m = 3$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tìm giá trị lớn nhất của $F(x; y) = 6x + y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + 2y \\le 12 \\end{cases}$.","options":["A. $6$","B. $36$","C. $72$","D. $78$"],"answer":"C","explain":"Các đỉnh: $(0;0), (12;0), (0;6)$. $F$: $0; 72; 6$. Giá trị lớn nhất là $72$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Giao của hai nửa mặt phẳng có thể là một miền góc.","b) Cặp $(1; 1)$ là nghiệm của hệ $\\begin{cases} x \\ge 1 \\\\ y \\ge 1 \\end{cases}$.","c) Hệ $\\begin{cases} x + y \\le 1 \\\\ x + y \\ge 1 \\end{cases}$ có miền nghiệm là đường thẳng $x + y = 1$.","d) Cặp $(0; 0)$ là nghiệm của mọi hệ bất phương trình bậc nhất hai ẩn."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: $1 \\ge 1$. c) Đúng: giao của hai nửa mặt phẳng đối nhau là đường biên. d) Sai: ví dụ hệ $\\begin{cases} x \\ge 1 \\end{cases}$.","points":1},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} 2x + 5y \\le 20 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(10; 0)$ là nghiệm của hệ.","b) Miền nghiệm của hệ là tam giác kể cả ba cạnh.","c) Cặp $(4; 4)$ là nghiệm của hệ.","d) Giá trị lớn nhất của $x + y$ trên miền nghiệm là $10$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $20 \\le 20$. b) Đúng: tam giác $OAB$ với $A(10;0), B(0;4)$. c) Sai: $28 \\le 20$ sai. d) Đúng: $x + y$ tại các đỉnh là $0, 10, 4$.","points":1},{"type":"short","level":"VD","q":"Tìm hoành độ giao điểm của hai đường biên $2x + y = 10$ và $x - y = 2$.","answer":"4","explain":"Cộng hai phương trình: $3x = 12 \\Rightarrow x = 4$.","points":0.5},{"type":"short","level":"VDC","q":"Tìm giá trị lớn nhất của $F(x; y) = 5x + 4y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 3x + 2y \\le 18 \\end{cases}$.","answer":"36","explain":"Các đỉnh: $(0;0), (6;0), (0;9)$. $F$: $0; 30; 36$. Giá trị lớn nhất là $36$.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Bất phương trình $4x - 5y + 2 \\ge 0$ viết dưới dạng $ax + by \\ge c$ với $a, b, c$ lần lượt là","options":["A. $4; -5; -2$","B. $4; 5; 2$","C. $4; -5; 2$","D. $-4; 5; -2$"],"answer":"A","explain":"$4x - 5y + 2 \\ge 0 \\Leftrightarrow 4x - 5y \\ge -2$ nên $a = 4, b = -5, c = -2$.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(0; 0)$ KHÔNG là nghiệm của hệ nào sau đây?","options":["A. $\\begin{cases} x + y \\le 1 \\\\ x \\ge -1 \\end{cases}$","B. $\\begin{cases} x - y \\ge 1 \\\\ x \\ge 0 \\end{cases}$","C. $\\begin{cases} 2x \\le 1 \\\\ 3y \\le 1 \\end{cases}$","D. $\\begin{cases} x \\ge -1 \\\\ y \\ge -1 \\end{cases}$"],"answer":"B","explain":"Thay $(0; 0)$: B có $0 \\ge 1$ sai nên không là nghiệm. A, C, D đều nhận $(0; 0)$ làm nghiệm.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của bất phương trình $x + 5y \\le 10$ chứa điểm nào sau đây?","options":["A. $(0; 0)$","B. $(10; 10)$","C. $(5; 2)$","D. $(0; 3)$"],"answer":"A","explain":"Thay $(0; 0)$: $0 \\le 10$ đúng. B: $60 \\le 10$ sai; C: $15 \\le 10$ sai; D: $15 \\le 10$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + y \\ge 1 \\end{cases}$ có miền nghiệm là","options":["A. phần góc phần tư thứ nhất nằm ngoài tam giác $OAB$ (với $A(1;0), B(0;1)$)","B. một tam giác","C. một hình vuông","D. một đoạn thẳng"],"answer":"A","explain":"Miền nghiệm là góc phần tư thứ nhất trừ đi miền tam giác $OAB$ (kể cả cạnh $AB$), là miền không bị giới hạn.","points":0.25},{"type":"mcq","level":"VD","q":"Bất phương trình $(3x - 1) - 2(x + 2) \\ge x - 9$ có miền nghiệm là","options":["A. mọi cặp $(x; y)$ đều là nghiệm","B. tập rỗng","C. chỉ gồm điểm $(0; 0)$","D. một nửa mặt phẳng"],"answer":"A","explain":"Khai triển: $3x - 1 - 2x - 4 \\ge x - 9 \\Leftrightarrow x - 5 \\ge x - 9 \\Leftrightarrow -5 \\ge -9$ luôn đúng, nên mọi cặp $(x; y)$ đều là nghiệm.","points":0.25},{"type":"mcq","level":"VDC","q":"Tìm giá trị lớn nhất của $F(x; y) = 2x + 9y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 4x + 3y \\le 24 \\end{cases}$.","options":["A. $12$","B. $48$","C. $72$","D. $96$"],"answer":"C","explain":"Các đỉnh: $(0;0), (6;0), (0;8)$. $F$: $0; 12; 72$. Giá trị lớn nhất là $72$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thay $(3; -2)$ vào $x - y \\le 5$ được $5 \\le 5$ là khẳng định đúng.","b) Bất phương trình $x \\lt 0$ và bất phương trình $-x \\gt 0$ tương đương nhau.","c) Miền nghiệm của bất phương trình bậc nhất hai ẩn có thể là cả mặt phẳng tọa độ.","d) Đường biên của miền nghiệm của bất phương trình $2x + 3y \\ge 6$ là đường thẳng $2x + 3y = 6$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $3 - (-2) = 5 \\le 5$. b) Đúng: nhân hai vế với $-1$. c) Sai: luôn là một nửa mặt phẳng. d) Đúng theo quy tắc.","points":1},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} x - 3y \\le 0 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Miền nghiệm của hệ bị giới hạn (là một đa giác).","b) Cặp $(0; 0)$ là nghiệm của hệ.","c) Cặp $(3; 1)$ là nghiệm của hệ.","d) Cặp $(4; 1)$ là nghiệm của hệ."],"answer":["F","T","T","F"],"explain":"a) Sai: $x \\le 3y$ với $x, y \\ge 0$ là miền góc vô hạn. b) Đúng: $0 \\le 0$. c) Đúng: $3 \\le 3$. d) Sai: $4 \\le 3$ sai.","points":1},{"type":"short","level":"VD","q":"Hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 2x + 3y \\le 18 \\end{cases}$ có miền nghiệm là tam giác $OAB$. Tính $OA + OB$.","answer":"15","explain":"$A(9; 0), B(0; 6)$ nên $OA + OB = 9 + 6 = 15$.","points":0.5},{"type":"short","level":"VDC","q":"Một rạp chiếu phim bán $x$ vé loại I (lãi $100$ nghìn đồng một vé) và $y$ vé loại II (lãi $150$ nghìn đồng một vé). Điều kiện: $x + y \\le 500$, $y \\ge 200$, $x \\ge 0, y \\ge 0$. Lợi nhuận lớn nhất (tính bằng nghìn đồng) mà rạp đạt được là bao nhiêu?","answer":"75000","explain":"Lợi nhuận $L = 100x + 150y$. Các đỉnh: $(0;200), (300;200), (0;500)$. $L$: $30000; 60000; 75000$. Giá trị lớn nhất là $75000$ nghìn đồng.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Cặp nào sau đây là nghiệm của hệ $\\begin{cases} x \\le 2 \\\\ y \\le 3 \\end{cases}$?","options":["A. $(2; 3)$","B. $(3; 2)$","C. $(2; 4)$","D. $(5; 5)$"],"answer":"A","explain":"Thay $(2; 3)$: $2 \\le 2$ đúng và $3 \\le 3$ đúng. B: $3 \\le 2$ sai; C: $4 \\le 3$ sai; D sai cả hai.","points":0.25},{"type":"mcq","level":"NB","q":"Bất phương trình nào sau đây KHÔNG nhận cặp $(1; 1)$ làm nghiệm?","options":["A. $x + y \\le 2$","B. $x - y \\le 0$","C. $2x + y \\lt 3$","D. $x \\ge 0$"],"answer":"C","explain":"Thay $(1; 1)$: C cho $3 \\lt 3$ sai nên không nhận $(1; 1)$ làm nghiệm. A: $2 \\le 2$; B: $0 \\le 0$; D: $1 \\ge 0$ đều nhận.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của hệ $\\begin{cases} x + y \\le 4 \\\\ x - y \\le 0 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$ là tam giác có diện tích bằng","options":["A. $2$","B. $4$","C. $8$","D. $16$"],"answer":"B","explain":"Miền nghiệm là tam giác với các đỉnh $O(0;0), (2;2), (0;4)$, diện tích bằng $\\frac{1}{2} \\cdot 4 \\cdot 2 = 4$.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm nào sau đây thuộc miền nghiệm của bất phương trình $2x + 3y \\ge 12$?","options":["A. $(0; 0)$","B. $(6; 0)$","C. $(0; 3)$","D. $(3; 1)$"],"answer":"B","explain":"Thay $(6; 0)$: $12 \\ge 12$ đúng. A: $0 \\ge 12$ sai; C: $9 \\ge 12$ sai; D: $9 \\ge 12$ sai.","points":0.25},{"type":"mcq","level":"VD","q":"Hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + 2y \\le 8 \\end{cases}$ có miền nghiệm là tam giác $OAB$ với $B$ nằm trên trục $Oy$. Diện tích tam giác $OAB$ bằng","options":["A. $4$","B. $8$","C. $16$","D. $32$"],"answer":"B","explain":"$A(4; 0), B(0; 4)$ nên diện tích bằng $\\frac{1}{2} \\cdot 4 \\cdot 4 = 8$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tìm giá trị lớn nhất của $F(x; y) = 8x + 6y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 3x + 4y \\le 24 \\end{cases}$.","options":["A. $36$","B. $48$","C. $64$","D. $144$"],"answer":"C","explain":"Các đỉnh: $(0;0), (8;0), (0;6)$. $F$: $0; 64; 36$. Giá trị lớn nhất là $64$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x \\le 1 \\\\ y \\le 1 \\end{cases}$ có miền nghiệm là hình vuông đơn vị.","b) Điểm $(1; 1)$ thuộc miền nghiệm của hệ ở câu a.","c) Diện tích miền nghiệm của hệ ở câu a bằng $1$.","d) Hệ ở câu a có đúng một nghiệm."],"answer":["T","T","T","F"],"explain":"a) Đúng: hình vuông $[0;1] \\times [0;1]$. b) Đúng. c) Đúng. d) Sai: có vô số nghiệm.","points":1},{"type":"truefalse","level":"TH","q":"Cho bất phương trình $4x - 3y \\lt 12$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Gốc tọa độ $O$ là nghiệm của bất phương trình.","b) Miền nghiệm của bất phương trình chứa gốc tọa độ $O$.","c) Đường biên $4x - 3y = 12$ được vẽ bằng nét đứt.","d) Cặp $(3; 0)$ là nghiệm của bất phương trình."],"answer":["T","T","T","F"],"explain":"a) Đúng: $0 \\lt 12$. b) Đúng vì $O$ là nghiệm. c) Đúng: dấu $\\lt$ nên không kể bờ. d) Sai: $12 \\lt 12$ sai.","points":1},{"type":"short","level":"VD","q":"Tìm số nguyên $m$ nhỏ nhất để cặp $(m; 0)$ là nghiệm của bất phương trình $2x + 5y \\gt 7$.","answer":"4","explain":"Thay vào: $2m \\gt 7 \\Leftrightarrow m \\gt 3{,}5$. Số nguyên nhỏ nhất thỏa mãn là $4$.","points":0.5},{"type":"short","level":"VDC","q":"Tìm giá trị lớn nhất của $F(x; y) = x + 4y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 2x + y \\le 10 \\\\ x \\le 4 \\end{cases}$.","answer":"40","explain":"Các đỉnh: $(0;0), (4;0), (4;2), (0;10)$. $F$: $0; 4; 12; 40$. Giá trị lớn nhất là $40$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Điểm thử thường được dùng để xác định miền nghiệm của bất phương trình bậc nhất hai ẩn là","options":["A. gốc tọa độ $O$","B. điểm $(100; 100)$","C. một điểm trên đường biên","D. điểm bất kì trên đường biên"],"answer":"A","explain":"Thường lấy gốc tọa độ $O$ (nếu $O$ không thuộc đường biên) làm điểm thử vì tính toán đơn giản.","points":0.25},{"type":"mcq","level":"NB","q":"Hệ nào sau đây có miền nghiệm chứa điểm $(1; 2)$?","options":["A. $\\begin{cases} x + y \\le 2 \\\\ x \\ge 0 \\end{cases}$","B. $\\begin{cases} x - y \\ge 0 \\\\ y \\ge 0 \\end{cases}$","C. $\\begin{cases} 2x + y \\le 5 \\\\ x \\ge 1 \\end{cases}$","D. $\\begin{cases} y \\lt 2 \\\\ x \\ge 0 \\end{cases}$"],"answer":"C","explain":"Thay $(1; 2)$: C: $4 \\le 5$ đúng và $1 \\ge 1$ đúng. A: $3 \\le 2$ sai; B: $-1 \\ge 0$ sai; D: $2 \\lt 2$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của bất phương trình $-x + 4y \\le 8$ là nửa mặt phẳng nào?","options":["A. Bờ $-x + 4y = 8$, chứa gốc $O$, kể cả bờ","B. Bờ $-x + 4y = 8$, chứa gốc $O$, không kể bờ","C. Bờ $-x + 4y = 8$, không chứa gốc $O$, kể cả bờ","D. Bờ $-x + 4y = 8$, không chứa gốc $O$, không kể bờ"],"answer":"A","explain":"Thay $O$: $0 \\le 8$ đúng nên chứa $O$; dấu $\\le$ nên kể cả bờ (vẽ nét liền).","points":0.25},{"type":"mcq","level":"TH","q":"Cặp nào sau đây là nghiệm của hệ $\\begin{cases} 3x - y \\le 9 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$?","options":["A. $(3; 0)$","B. $(4; 0)$","C. $(5; 5)$","D. $(2; -1)$"],"answer":"A","explain":"Thay $(3; 0)$: $9 \\le 9$ đúng, $3 \\ge 0$, $0 \\ge 0$. B: $12 \\le 9$ sai; C: $10 \\le 9$ sai; D: $-1 \\ge 0$ sai.","points":0.25},{"type":"mcq","level":"VD","q":"Tìm $m \\gt 0$ để hệ $\\begin{cases} x + y \\le m \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$ có miền nghiệm là tam giác với diện tích bằng $18$.","options":["A. $3$","B. $6$","C. $9$","D. $36$"],"answer":"B","explain":"Diện tích $\\frac{1}{2}m^2 = 18 \\Rightarrow m^2 = 36 \\Rightarrow m = 6$ (vì $m \\gt 0$).","points":0.25},{"type":"mcq","level":"VDC","q":"Tìm giá trị lớn nhất của $F(x; y) = 3x + 8y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 5x + 2y \\le 20 \\end{cases}$.","options":["A. $12$","B. $40$","C. $80$","D. $100$"],"answer":"C","explain":"Các đỉnh: $(0;0), (4;0), (0;10)$. $F$: $0; 12; 80$. Giá trị lớn nhất là $80$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bất phương trình $5x \\le 15$ tương đương với bất phương trình $x \\le 3$.","b) Miền nghiệm của $x \\le 3$ là nửa mặt phẳng bên trái đường thẳng $x = 3$, kể cả bờ.","c) Cặp $(3; 100)$ là nghiệm của bất phương trình $x \\le 3$.","d) Bất phương trình $x \\le 3$ không phải là bất phương trình bậc nhất hai ẩn."],"answer":["T","T","T","F"],"explain":"a) Đúng: chia hai vế cho $5$. b) Đúng. c) Đúng: $3 \\le 3$. d) Sai: $x \\le 3$ là $1x + 0y \\le 3$ nên là bất phương trình bậc nhất hai ẩn.","points":1},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} 5x + 2y \\le 10 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(2; 0)$ là nghiệm của hệ.","b) Miền nghiệm của hệ là tam giác kể cả ba cạnh.","c) Giá trị lớn nhất của $5x + 2y$ trên miền nghiệm là $10$.","d) Cặp $(1; 3)$ là nghiệm của hệ."],"answer":["T","T","T","F"],"explain":"a) Đúng: $10 \\le 10$. b) Đúng: tam giác $OAB$ với $A(2;0), B(0;5)$. c) Đúng: tại các đỉnh giá trị là $0, 10, 10$. d) Sai: $5 + 6 = 11 \\le 10$ sai.","points":1},{"type":"short","level":"VD","q":"Tìm số nguyên âm $a$ lớn nhất để cặp $(a; 0)$ là nghiệm của hệ $\\begin{cases} 2x - y \\le 4 \\\\ x \\ge -5 \\\\ y \\ge 0 \\end{cases}$.","answer":"-1","explain":"Với $y = 0$: $2a \\le 4$ luôn đúng với $a \\le 0$; $a \\ge -5$. Số nguyên âm lớn nhất thỏa mãn là $-1$.","points":0.5},{"type":"short","level":"VDC","q":"Một xí nghiệp dệt $x$ mét vải loại I (lãi $20$ nghìn đồng một mét) và $y$ mét vải loại II (lãi $30$ nghìn đồng một mét). Điều kiện: $x + 2y \\le 120$ (giờ máy), $2x + y \\le 120$ (nhân công), $x \\ge 0, y \\ge 0$. Lợi nhuận lớn nhất (tính bằng nghìn đồng) mà xí nghiệp đạt được là bao nhiêu?","answer":"2000","explain":"Lợi nhuận $L = 20x + 30y$. Các đỉnh: $(0;0), (60;0), (40;40), (0;60)$. $L$: $0; 1200; 2000; 1800$. Giá trị lớn nhất là $2000$ nghìn đồng.","points":0.5}]}]}</script>
