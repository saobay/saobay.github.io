<script type="application/json" class="saobay-exam10-data">{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Bất phương trình nào sau đây là bất phương trình bậc nhất hai ẩn?","options":["A. $2x + 3y \\le 6$","B. $x^2 + y \\le 1$","C. $\\frac{1}{x} + y \\ge 2$","D. $0x + 0y \\le 5$"],"answer":"A","explain":"Đáp án A có dạng $ax + by \\le c$ với $a = 2, b = 3$ không đồng thời bằng $0$. Các đáp án còn lại: B có $x^2$, C có $\\frac{1}{x}$, D có $a = b = 0$.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp số nào sau đây là nghiệm của bất phương trình $2x + y \\le 4$?","options":["A. $(1; 1)$","B. $(3; 2)$","C. $(2; 3)$","D. $(5; 0)$"],"answer":"A","explain":"Thay $(1; 1)$ vào: $2 \\cdot 1 + 1 = 3 \\le 4$ đúng. Các cặp còn lại cho $8, 7, 10$ đều lớn hơn $4$.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của bất phương trình $x + y \\ge 2$ là nửa mặt phẳng nào?","options":["A. Bờ $d: x + y = 2$, chứa gốc $O$, kể cả bờ $d$","B. Bờ $d: x + y = 2$, không chứa gốc $O$, kể cả bờ $d$","C. Bờ $d: x + y = 2$, chứa gốc $O$, không kể bờ $d$","D. Bờ $d: x + y = 2$, không chứa gốc $O$, không kể bờ $d$"],"answer":"B","explain":"Thay $O(0; 0)$ vào: $0 + 0 = 0 \\ge 2$ sai nên miền nghiệm không chứa $O$. Dấu $\\ge$ nên kể cả bờ $d$, vẽ $d$ nét liền.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm nào sau đây thuộc miền nghiệm của bất phương trình $3x - 2y \\lt 6$?","options":["A. $(0; 0)$","B. $(2; 0)$","C. $(0; -3)$","D. $(3; 1)$"],"answer":"A","explain":"Thay $(0; 0)$: $0 \\lt 6$ đúng. B: $6 \\lt 6$ sai; C: $6 \\lt 6$ sai; D: $9 - 2 = 7 \\lt 6$ sai.","points":0.25},{"type":"mcq","level":"VD","q":"Bất phương trình $2(x - 1) + 3(y + 2) \\le 5$ tương đương với bất phương trình nào sau đây?","options":["A. $2x + 3y \\le 1$","B. $2x + 3y \\le 9$","C. $2x + 3y \\le 5$","D. $2x + 3y + 4 \\le 9$"],"answer":"A","explain":"$2(x - 1) + 3(y + 2) \\le 5 \\Leftrightarrow 2x - 2 + 3y + 6 \\le 5 \\Leftrightarrow 2x + 3y + 4 \\le 5 \\Leftrightarrow 2x + 3y \\le 1$.","points":0.25},{"type":"mcq","level":"VDC","q":"Có bao nhiêu cặp số nguyên $(x; y)$ với $0 \\le x \\le 2$, $0 \\le y \\le 2$ thỏa mãn $x + 2y \\le 4$?","options":["A. $5$","B. $6$","C. $7$","D. $8$"],"answer":"C","explain":"$x = 0$: $2y \\le 4 \\Rightarrow y \\in \\{0; 1; 2\\}$ (3 cặp). $x = 1$: $2y \\le 3 \\Rightarrow y \\in \\{0; 1\\}$ (2 cặp). $x = 2$: $2y \\le 2 \\Rightarrow y \\in \\{0; 1\\}$ (2 cặp). Tổng $3 + 2 + 2 = 7$ cặp.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $2x - y \\ge 1$ là bất phương trình bậc nhất hai ẩn.","b) Cặp $(1; 0)$ là nghiệm của bất phương trình $x + y \\lt 2$.","c) Miền nghiệm của bất phương trình $ax + by \\le c$ luôn chứa gốc tọa độ $O$.","d) Đường thẳng $x + y = 2$ là bờ của miền nghiệm của bất phương trình $x + y \\gt 2$."],"answer":["T","T","F","T"],"explain":"a) Đúng: dạng $ax + by \\ge c$ với $a^2 + b^2 \\gt 0$. b) Đúng: $1 + 0 = 1 \\lt 2$. c) Sai: $O$ thuộc miền nghiệm chỉ khi $0 \\le c$. d) Đúng: bờ là đường thẳng $ax + by = c$.","points":1},{"type":"truefalse","level":"TH","q":"Cho bất phương trình $3x + y \\le 9$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(3; 0)$ là nghiệm của bất phương trình.","b) Cặp $(0; 9)$ là nghiệm của bất phương trình.","c) Miền nghiệm kể cả đường thẳng $3x + y = 9$.","d) Điểm $(4; 0)$ thuộc miền nghiệm của bất phương trình."],"answer":["T","T","T","F"],"explain":"a) Đúng: $9 \\le 9$. b) Đúng: $9 \\le 9$. c) Đúng: dấu $\\le$ nên kể cả bờ, vẽ nét liền. d) Sai: $12 \\gt 9$.","points":1},{"type":"short","level":"VD","q":"Tìm số nguyên $m$ lớn nhất để cặp $(m; 1)$ là nghiệm của bất phương trình $x + 2y \\le 10$.","answer":"8","explain":"Thay vào: $m + 2 \\cdot 1 \\le 10 \\Leftrightarrow m \\le 8$. Số nguyên $m$ lớn nhất thỏa mãn là $8$.","points":0.5},{"type":"short","level":"VDC","q":"Bạn Lan có $500$ nghìn đồng để mua vở (giá $15$ nghìn đồng một quyển) và bút (giá $8$ nghìn đồng một cái). Gọi $x, y$ lần lượt là số quyển vở và số cái bút Lan mua. Nếu Lan mua $20$ quyển vở thì mua được tối đa bao nhiêu cái bút?","answer":"25","explain":"Bất phương trình: $15x + 8y \\le 500$. Với $x = 20$: $300 + 8y \\le 500 \\Leftrightarrow 8y \\le 200 \\Leftrightarrow y \\le 25$. Vậy tối đa $25$ cái bút.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Bất phương trình nào sau đây KHÔNG phải là bất phương trình bậc nhất hai ẩn?","options":["A. $x + y \\lt 3$","B. $2x - 5 \\ge 0$","C. $xy \\le 4$","D. $-x + 2y \\gt 1$"],"answer":"C","explain":"Đáp án C có hạng tử $xy$ (bậc hai) nên không phải bất phương trình bậc nhất hai ẩn. B là trường hợp $b = 0$ nhưng $a = 2 \\ne 0$ nên vẫn là bất phương trình bậc nhất hai ẩn.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp số nào sau đây là nghiệm của bất phương trình $x - 2y \\ge 1$?","options":["A. $(3; 1)$","B. $(1; 1)$","C. $(2; 2)$","D. $(0; 1)$"],"answer":"A","explain":"Thay $(3; 1)$: $3 - 2 = 1 \\ge 1$ đúng. B: $-1 \\ge 1$ sai; C: $-2 \\ge 1$ sai; D: $-2 \\ge 1$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Đường thẳng nào là bờ của miền nghiệm của bất phương trình $2x - y \\lt 4$?","options":["A. $2x - y = 4$","B. $2x - y \\gt 4$","C. $x - 2y = 4$","D. $2x + y = 4$"],"answer":"A","explain":"Bờ của miền nghiệm của $ax + by \\lt c$ là đường thẳng $ax + by = c$, tức $2x - y = 4$ (vẽ nét đứt vì dấu $\\lt$).","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của bất phương trình $y \\le 2x + 1$ chứa điểm nào sau đây?","options":["A. $(0; 0)$","B. $(1; 4)$","C. $(2; 6)$","D. $(-1; 2)$"],"answer":"A","explain":"Thay $(0; 0)$: $0 \\le 1$ đúng. B: $4 \\le 3$ sai; C: $6 \\le 5$ sai; D: $2 \\le -1$ sai.","points":0.25},{"type":"mcq","level":"VD","q":"Với giá trị nào của $m$ thì bất phương trình $(m^2 - 1)x + (m - 1)y \\le 2$ KHÔNG phải là bất phương trình bậc nhất hai ẩn?","options":["A. $m = 1$","B. $m = -1$","C. $m = 0$","D. $m = 2$"],"answer":"A","explain":"Không phải bất phương trình bậc nhất hai ẩn khi cả hai hệ số của $x, y$ đều bằng $0$: $m^2 - 1 = 0$ và $m - 1 = 0$, suy ra $m = 1$. Với $m = -1$ thì hệ số của $y$ là $-2 \\ne 0$ nên vẫn là bất phương trình bậc nhất hai ẩn.","points":0.25},{"type":"mcq","level":"VDC","q":"Có bao nhiêu cặp số nguyên $(x; y)$ thỏa mãn $x \\ge 0$, $y \\ge 0$ và $3x + 4y \\le 12$?","options":["A. $9$","B. $10$","C. $11$","D. $12$"],"answer":"C","explain":"$x = 0$: $y \\in \\{0;1;2;3\\}$ (4 cặp). $x = 1$: $4y \\le 9 \\Rightarrow y \\in \\{0;1;2\\}$ (3 cặp). $x = 2$: $4y \\le 6 \\Rightarrow y \\in \\{0;1\\}$ (2 cặp). $x = 3$: $4y \\le 3 \\Rightarrow y = 0$ (1 cặp). $x = 4$: $y = 0$ (1 cặp). Tổng $4+3+2+1+1 = 11$ cặp.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bất phương trình bậc nhất hai ẩn có dạng $ax + by \\le c$ với $a^2 + b^2 \\gt 0$.","b) Cặp $(0; 0)$ luôn là nghiệm của bất phương trình $x + y \\le 5$.","c) Bất phương trình $x \\lt 3$ không phải là bất phương trình bậc nhất hai ẩn.","d) Miền nghiệm của bất phương trình $x + y \\lt 1$ không chứa điểm $(1; 1)$."],"answer":["T","T","F","T"],"explain":"a) Đúng theo định nghĩa. b) Đúng: $0 \\le 5$. c) Sai: $x \\lt 3$ là $1x + 0y \\lt 3$ nên là bất phương trình bậc nhất hai ẩn. d) Đúng: $1 + 1 = 2 \\lt 1$ sai.","points":1},{"type":"truefalse","level":"TH","q":"Cho bất phương trình $x - 3y \\ge -6$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(0; 0)$ là nghiệm của bất phương trình.","b) Miền nghiệm của bất phương trình chứa gốc tọa độ $O$.","c) Đường biên $x - 3y = -6$ được vẽ bằng nét đứt.","d) Điểm $(0; 3)$ thuộc miền nghiệm của bất phương trình."],"answer":["T","T","F","F"],"explain":"a) Đúng: $0 \\ge -6$. b) Đúng vì $O$ là nghiệm. c) Sai: dấu $\\ge$ nên kể cả bờ, vẽ nét liền. d) Sai: $0 - 9 = -9 \\ge -6$ sai.","points":1},{"type":"short","level":"VD","q":"Bất phương trình $5x - 2(x + y) + 4 \\ge 0$ tương đương với bất phương trình $ax + by \\ge c$. Tính $a + b + c$.","answer":"-3","explain":"$5x - 2x - 2y + 4 \\ge 0 \\Leftrightarrow 3x - 2y + 4 \\ge 0 \\Leftrightarrow 3x - 2y \\ge -4$. Vậy $a = 3, b = -2, c = -4$ và $a + b + c = -3$.","points":0.5},{"type":"short","level":"VDC","q":"Trong $100$ gam thịt bò chứa khoảng $26$ gam protein, trong $100$ gam cá chứa khoảng $20$ gam protein. Trung bình mỗi ngày một người cần tối thiểu $46$ gam protein. Gọi $x, y$ (tính bằng lạng) lần lượt là lượng thịt bò và lượng cá người đó ăn trong một ngày. Nếu người đó ăn $1$ lạng thịt bò thì cần ăn tối thiểu bao nhiêu lạng cá để đủ protein?","answer":"1","explain":"Bất phương trình: $26x + 20y \\ge 46$. Với $x = 1$: $26 + 20y \\ge 46 \\Leftrightarrow 20y \\ge 20 \\Leftrightarrow y \\ge 1$. Vậy cần tối thiểu $1$ lạng cá.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Khẳng định nào sau đây đúng về dạng tổng quát của bất phương trình bậc nhất hai ẩn?","options":["A. $ax + by \\le c$ với $a^2 + b^2 \\gt 0$","B. $ax^2 + by \\le c$ với $a \\ne 0$","C. $ax + by + cz \\le c$ với $a, b, c$ tùy ý","D. $ax + by \\le c$ với $a = b = 0$"],"answer":"A","explain":"Dạng tổng quát là $ax + by \\le c$ (hoặc $\\ge, \\lt, \\gt$) trong đó $a, b$ không đồng thời bằng $0$, tức $a^2 + b^2 \\gt 0$.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp số nào sau đây là nghiệm của bất phương trình $3x + y \\gt 5$?","options":["A. $(1; 2)$","B. $(0; 1)$","C. $(1; 1)$","D. $(2; 2)$"],"answer":"D","explain":"Thay $(2; 2)$: $3 \\cdot 2 + 2 = 8 \\gt 5$ đúng. A: $5 \\gt 5$ sai; B: $1 \\gt 5$ sai; C: $4 \\gt 5$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của bất phương trình $2x + 3y \\gt 6$ không chứa điểm nào sau đây?","options":["A. $(0; 0)$","B. $(4; 0)$","C. $(0; 3)$","D. $(3; 3)$"],"answer":"A","explain":"Thay $(0; 0)$: $0 \\gt 6$ sai nên $(0; 0)$ không thuộc miền nghiệm. Các điểm còn lại đều thỏa mãn: $8, 9, 15$ đều lớn hơn $6$.","points":0.25},{"type":"mcq","level":"TH","q":"Bất phương trình nào sau đây có miền nghiệm là nửa mặt phẳng chứa gốc tọa độ $O$ (kể cả bờ)?","options":["A. $x + y \\le -1$","B. $2x - y \\ge 1$","C. $-x - y \\le 0$","D. $x - y \\gt 0$"],"answer":"C","explain":"Thay $O(0; 0)$: A: $0 \\le -1$ sai; B: $0 \\ge 1$ sai; C: $0 \\le 0$ đúng và dấu $\\le$ nên kể cả bờ; D: $0 \\gt 0$ sai.","points":0.25},{"type":"mcq","level":"VD","q":"Bất phương trình $(x + 1)^2 - (x - 1)^2 + 2y \\le 8$ tương đương với bất phương trình nào sau đây?","options":["A. $2x + y \\le 4$","B. $2x + y \\le 8$","C. $4x + 2y \\le 6$","D. $x + 2y \\le 4$"],"answer":"A","explain":"$(x^2 + 2x + 1) - (x^2 - 2x + 1) = 4x$ nên bất phương trình thành $4x + 2y \\le 8$, chia hai vế cho $2$ được $2x + y \\le 4$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bất phương trình $x + y \\le m$. Biết $(2; 3)$ là nghiệm nhưng $(3; 3)$ không là nghiệm của bất phương trình. Giá trị nguyên của $m$ là","options":["A. $4$","B. $5$","C. $6$","D. $7$"],"answer":"B","explain":"$(2; 3)$ là nghiệm $\\Rightarrow 5 \\le m$. $(3; 3)$ không là nghiệm $\\Rightarrow 6 \\gt m$. Vậy $5 \\le m \\lt 6$ nên $m = 5$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mọi bất phương trình bậc nhất hai ẩn đều có vô số nghiệm.","b) Cặp $(0; 0)$ là nghiệm của mọi bất phương trình dạng $ax + by \\lt c$ với $c \\gt 0$.","c) Bất phương trình $0x + 5y \\le 10$ là bất phương trình bậc nhất hai ẩn.","d) Miền nghiệm của bất phương trình $2x + 3y \\gt 6$ kể cả đường thẳng $2x + 3y = 6$."],"answer":["T","T","T","F"],"explain":"a) Đúng: miền nghiệm là một nửa mặt phẳng nên có vô số điểm. b) Đúng: $0 \\lt c$ với $c \\gt 0$. c) Đúng: $b = 5 \\ne 0$. d) Sai: dấu $\\gt$ nên không kể bờ, vẽ nét đứt.","points":1},{"type":"truefalse","level":"TH","q":"Cho bất phương trình $-x + 2y \\lt 4$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Đường biên $-x + 2y = 4$ được vẽ bằng nét đứt.","b) Gốc tọa độ $O$ thuộc miền nghiệm của bất phương trình.","c) Điểm $(0; 2)$ thuộc miền nghiệm của bất phương trình.","d) Điểm $(-2; 0)$ thuộc miền nghiệm của bất phương trình."],"answer":["T","T","F","T"],"explain":"a) Đúng: dấu $\\lt$ nên không kể bờ. b) Đúng: $0 \\lt 4$. c) Sai: $4 \\lt 4$ sai. d) Đúng: $2 + 0 = 2 \\lt 4$.","points":1},{"type":"short","level":"VD","q":"Điểm $M(a; 2)$ thuộc đường biên của miền nghiệm của bất phương trình $3x - y \\le 10$. Tìm $a$.","answer":"4","explain":"$M$ thuộc đường biên $3x - y = 10$ nên $3a - 2 = 10 \\Leftrightarrow 3a = 12 \\Leftrightarrow a = 4$.","points":0.5},{"type":"short","level":"VDC","q":"Tìm số nguyên $x$ nhỏ nhất để cặp $(x; 2)$ là nghiệm của bất phương trình $2x - 3y \\ge -8$.","answer":"-1","explain":"Thay $y = 2$: $2x - 6 \\ge -8 \\Leftrightarrow 2x \\ge -2 \\Leftrightarrow x \\ge -1$. Số nguyên nhỏ nhất thỏa mãn là $-1$.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Bất phương trình $ax + by \\gt c$ là bất phương trình bậc nhất hai ẩn khi","options":["A. $a, b, c$ là các số thực tùy ý","B. $a^2 + b^2 \\gt 0$","C. $a \\gt 0$ và $b \\gt 0$","D. $c \\ne 0$"],"answer":"B","explain":"Điều kiện là $a$ và $b$ không đồng thời bằng $0$, tức $a^2 + b^2 \\gt 0$. Các số $a, b, c$ là số thực cho trước.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(0; 5)$ là nghiệm của bất phương trình nào sau đây?","options":["A. $x + y \\le 4$","B. $2x - y \\ge 3$","C. $x + 2y \\le 10$","D. $3x + y \\gt 15$"],"answer":"C","explain":"Thay $(0; 5)$: A: $5 \\le 4$ sai; B: $-5 \\ge 3$ sai; C: $10 \\le 10$ đúng; D: $5 \\gt 15$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của bất phương trình $x \\ge 2$ là","options":["A. nửa mặt phẳng bờ $x = 2$ chứa điểm $(3; 0)$, kể cả bờ","B. nửa mặt phẳng bờ $x = 2$ chứa gốc $O$, kể cả bờ","C. nửa mặt phẳng bờ $x = 2$ chứa điểm $(3; 0)$, không kể bờ","D. nửa mặt phẳng bờ $x = 2$ chứa gốc $O$, không kể bờ"],"answer":"A","explain":"Bất phương trình $x \\ge 2$ là $1x + 0y \\ge 2$. Điểm $(3; 0)$ thỏa mãn $3 \\ge 2$ nên miền nghiệm là nửa mặt phẳng bờ $x = 2$ chứa $(3; 0)$; dấu $\\ge$ nên kể cả bờ.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm nào sau đây KHÔNG thuộc miền nghiệm của bất phương trình $x + 2y - 5 \\le 0$?","options":["A. $(1; 1)$","B. $(3; 2)$","C. $(0; 0)$","D. $(5; 0)$"],"answer":"B","explain":"Thay $(3; 2)$: $3 + 4 - 5 = 2 \\gt 0$ nên không thuộc miền nghiệm. A: $-2 \\le 0$ thuộc; C: $-5 \\le 0$ thuộc; D: $0 \\le 0$ thuộc.","points":0.25},{"type":"mcq","level":"VD","q":"Bất phương trình nào sau đây tương đương với bất phương trình $\\frac{x}{2} + \\frac{y}{3} \\le 1$?","options":["A. $3x + 2y \\le 6$","B. $2x + 3y \\le 6$","C. $3x + 2y \\le 1$","D. $x + y \\le 6$"],"answer":"A","explain":"Nhân hai vế với $6$: $3x + 2y \\le 6$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $x, y$ là các số nguyên thỏa mãn $0 \\le x \\le 3$, $0 \\le y \\le 3$ và $2x + 3y \\le 9$. Giá trị lớn nhất của $P = x + y$ là","options":["A. $3$","B. $4$","C. $5$","D. $6$"],"answer":"B","explain":"Thử các cặp thỏa mãn: $(3; 1)$ cho $2 \\cdot 3 + 3 \\cdot 1 = 9 \\le 9$ và $P = 4$; $(2; 2)$ cho $10 \\gt 9$ loại; $(3; 0)$ cho $P = 3$. Giá trị lớn nhất của $P$ là $4$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $3x + 4y = 12$ là một bất phương trình bậc nhất hai ẩn.","b) Nghiệm của bất phương trình bậc nhất hai ẩn là một cặp số $(x_0; y_0)$.","c) Cặp $(2; -3)$ là nghiệm của bất phương trình $x + y \\le 0$.","d) Bất phương trình $y \\gt 2x$ có miền nghiệm không chứa gốc tọa độ $O$."],"answer":["F","T","T","T"],"explain":"a) Sai: đây là phương trình, không phải bất phương trình. b) Đúng theo định nghĩa nghiệm. c) Đúng: $2 + (-3) = -1 \\le 0$. d) Đúng: $0 \\gt 0$ sai nên $O$ không thuộc miền nghiệm.","points":1},{"type":"truefalse","level":"TH","q":"Cho bất phương trình $2x + 5y \\ge 10$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(5; 0)$ là nghiệm của bất phương trình.","b) Cặp $(0; 2)$ là nghiệm của bất phương trình.","c) Miền nghiệm của bất phương trình không chứa gốc tọa độ $O$.","d) Điểm $(1; 1)$ thuộc miền nghiệm của bất phương trình."],"answer":["T","T","T","F"],"explain":"a) Đúng: $10 \\ge 10$. b) Đúng: $10 \\ge 10$. c) Đúng: $0 \\ge 10$ sai nên $O$ không thuộc miền nghiệm. d) Sai: $7 \\ge 10$ sai.","points":1},{"type":"short","level":"VD","q":"Tìm tung độ của giao điểm của đường biên của miền nghiệm của bất phương trình $x + y \\le 6$ với trục $Oy$.","answer":"6","explain":"Giao với trục $Oy$ thì $x = 0$, thay vào đường biên $x + y = 6$ được $y = 6$.","points":0.5},{"type":"short","level":"VDC","q":"Bạn An có $200$ nghìn đồng để mua bút bi (giá $5$ nghìn đồng một cái) và vở (giá $12$ nghìn đồng một quyển). Gọi $x, y$ lần lượt là số cái bút và số quyển vở An mua. Nếu An mua $10$ cái bút thì mua được tối đa bao nhiêu quyển vở?","answer":"12","explain":"Bất phương trình: $5x + 12y \\le 200$. Với $x = 10$: $50 + 12y \\le 200 \\Leftrightarrow 12y \\le 150 \\Leftrightarrow y \\le 12{,}5$. Vậy tối đa $12$ quyển vở.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Trong các bất phương trình sau, bất phương trình nào là bất phương trình bậc nhất hai ẩn?","options":["A. $x + y^2 \\le 1$","B. $\\sqrt{x} + y \\le 2$","C. $3x - y \\gt 0$","D. $\\frac{1}{x} + \\frac{1}{y} \\ge 1$"],"answer":"C","explain":"Đáp án C có dạng $ax + by \\gt c$ với $a = 3, b = -1$. A có $y^2$, B có $\\sqrt{x}$, D có $\\frac{1}{x}$ nên không phải bậc nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(-1; 2)$ là nghiệm của bất phương trình nào sau đây?","options":["A. $x + y \\le 0$","B. $2x + y \\ge 0$","C. $x - y \\gt 0$","D. $3x + 2y \\lt 0$"],"answer":"B","explain":"Thay $(-1; 2)$: A: $1 \\le 0$ sai; B: $-2 + 2 = 0 \\ge 0$ đúng; C: $-3 \\gt 0$ sai; D: $1 \\lt 0$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của bất phương trình $-2x + y \\le 1$ là nửa mặt phẳng nào?","options":["A. Bờ $-2x + y = 1$, chứa gốc $O$, kể cả bờ","B. Bờ $-2x + y = 1$, chứa gốc $O$, không kể bờ","C. Bờ $-2x + y = 1$, không chứa gốc $O$, kể cả bờ","D. Bờ $-2x + y = 1$, không chứa gốc $O$, không kể bờ"],"answer":"A","explain":"Thay $O(0; 0)$: $0 \\le 1$ đúng nên miền nghiệm chứa $O$; dấu $\\le$ nên kể cả bờ (vẽ nét liền).","points":0.25},{"type":"mcq","level":"TH","q":"Cho bất phương trình $4x - 3y \\gt 12$. Điểm nào sau đây thuộc miền nghiệm?","options":["A. $(0; 0)$","B. $(4; 0)$","C. $(0; -4)$","D. $(3; 3)$"],"answer":"B","explain":"Thay $(4; 0)$: $16 \\gt 12$ đúng. A: $0 \\gt 12$ sai; C: $12 \\gt 12$ sai; D: $3 \\gt 12$ sai.","points":0.25},{"type":"mcq","level":"VD","q":"Bất phương trình $(2x - y) + 3(x + y) \\ge 7$ tương đương với bất phương trình nào sau đây?","options":["A. $5x + 2y \\ge 7$","B. $5x - 2y \\ge 7$","C. $5x + 2y \\ge 10$","D. $x + 2y \\ge 7$"],"answer":"A","explain":"$2x - y + 3x + 3y \\ge 7 \\Leftrightarrow 5x + 2y \\ge 7$.","points":0.25},{"type":"mcq","level":"VDC","q":"Có bao nhiêu cặp số nguyên $(x; y)$ với $1 \\le x \\le 3$, $1 \\le y \\le 3$ thỏa mãn $2x + y \\le 7$?","options":["A. $5$","B. $6$","C. $7$","D. $9$"],"answer":"C","explain":"$x = 1$: $y \\le 5 \\Rightarrow y \\in \\{1;2;3\\}$ (3 cặp). $x = 2$: $y \\le 3 \\Rightarrow y \\in \\{1;2;3\\}$ (3 cặp). $x = 3$: $y \\le 1 \\Rightarrow y = 1$ (1 cặp). Tổng $3 + 3 + 1 = 7$ cặp.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Thay $(1; 1)$ vào $2x + 3y \\le 6$ được $5 \\le 6$ là khẳng định đúng.","b) Miền nghiệm của bất phương trình bậc nhất hai ẩn luôn chứa vô số điểm.","c) Bất phương trình $0x + 5y \\le 10$ là bất phương trình bậc nhất hai ẩn.","d) Miền nghiệm của bất phương trình $2x + 3y \\gt 6$ kể cả đường thẳng $2x + 3y = 6$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $2 + 3 = 5 \\le 6$. b) Đúng: miền nghiệm là một nửa mặt phẳng. c) Đúng: $b = 5 \\ne 0$. d) Sai: dấu $\\gt$ nên không kể bờ.","points":1},{"type":"truefalse","level":"TH","q":"Cho bất phương trình $x + y \\lt 4$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(4; 0)$ không là nghiệm của bất phương trình.","b) Đường biên $x + y = 4$ được vẽ bằng nét đứt.","c) Miền nghiệm của bất phương trình chứa gốc tọa độ $O$.","d) Điểm $(2; 2)$ là nghiệm của bất phương trình."],"answer":["T","T","T","F"],"explain":"a) Đúng: $4 \\lt 4$ sai. b) Đúng: dấu $\\lt$ nên không kể bờ. c) Đúng: $0 \\lt 4$. d) Sai: $4 \\lt 4$ sai.","points":1},{"type":"short","level":"VD","q":"Cho bất phương trình $ax + 2y \\le 10$ nhận cặp $(2; 3)$ làm nghiệm với dấu bằng (tức $2a + 6 = 10$). Tìm $a$.","answer":"2","explain":"$2a + 6 = 10 \\Leftrightarrow 2a = 4 \\Leftrightarrow a = 2$.","points":0.5},{"type":"short","level":"VDC","q":"Một cửa hàng có không quá $100$ kg gạo để đóng thành túi loại $5$ kg và túi loại $10$ kg. Gọi $x, y$ lần lượt là số túi loại $5$ kg và loại $10$ kg. Nếu cửa hàng đóng $8$ túi loại $10$ kg thì đóng được tối đa bao nhiêu túi loại $5$ kg?","answer":"4","explain":"Bất phương trình: $5x + 10y \\le 100$. Với $y = 8$: $5x + 80 \\le 100 \\Leftrightarrow 5x \\le 20 \\Leftrightarrow x \\le 4$. Vậy tối đa $4$ túi loại $5$ kg.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Nghiệm của bất phương trình bậc nhất hai ẩn là gì?","options":["A. Một số thực","B. Một cặp số $(x_0; y_0)$ thỏa mãn bất phương trình","C. Một đường thẳng","D. Một nửa mặt phẳng"],"answer":"B","explain":"Theo định nghĩa, mỗi cặp số $(x_0; y_0)$ sao cho $ax_0 + by_0 \\le c$ (đúng với dạng tương ứng) là một nghiệm của bất phương trình.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(2; 3)$ KHÔNG là nghiệm của bất phương trình nào sau đây?","options":["A. $x + y \\le 5$","B. $2x - y \\le 1$","C. $x + 2y \\gt 8$","D. $3x - y \\ge 3$"],"answer":"C","explain":"Thay $(2; 3)$: A: $5 \\le 5$ là nghiệm; B: $1 \\le 1$ là nghiệm; C: $8 \\gt 8$ sai nên không là nghiệm; D: $3 \\ge 3$ là nghiệm.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của bất phương trình $y \\lt -x + 3$ là nửa mặt phẳng nào?","options":["A. Bờ $y = -x + 3$, chứa gốc $O$, kể cả bờ","B. Bờ $y = -x + 3$, chứa gốc $O$, không kể bờ","C. Bờ $y = -x + 3$, không chứa gốc $O$, kể cả bờ","D. Bờ $y = -x + 3$, không chứa gốc $O$, không kể bờ"],"answer":"B","explain":"Thay $O(0; 0)$: $0 \\lt 3$ đúng nên miền nghiệm chứa $O$; dấu $\\lt$ nên không kể bờ (vẽ nét đứt).","points":0.25},{"type":"mcq","level":"TH","q":"Bất phương trình nào sau đây có đường biên đi qua gốc tọa độ?","options":["A. $x + y \\le 1$","B. $2x - 3y \\ge 0$","C. $x + 2 \\le 5$","D. $y \\ge 1$"],"answer":"B","explain":"Đường biên của B là $2x - 3y = 0$ đi qua $O(0; 0)$. Các đường biên còn lại: $x + y = 1$, $x = 3$, $y = 1$ đều không qua $O$.","points":0.25},{"type":"mcq","level":"VD","q":"Bất phương trình $3(x - 2) - 2(y + 1) \\le x + y - 4$ tương đương với bất phương trình nào sau đây?","options":["A. $2x - 3y \\le 4$","B. $2x - 3y \\le 12$","C. $4x - 3y \\le 4$","D. $2x - y \\le 4$"],"answer":"A","explain":"$3x - 6 - 2y - 2 \\le x + y - 4 \\Leftrightarrow 3x - 2y - 8 \\le x + y - 4 \\Leftrightarrow 2x - 3y \\le 4$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bất phương trình $mx + y \\le 2$. Biết $(1; 1)$ là nghiệm nhưng $(2; 2)$ không là nghiệm của bất phương trình. Giá trị nguyên của $m$ là","options":["A. $0$","B. $1$","C. $2$","D. $-1$"],"answer":"B","explain":"$(1; 1)$ là nghiệm $\\Rightarrow m + 1 \\le 2 \\Rightarrow m \\le 1$. $(2; 2)$ không là nghiệm $\\Rightarrow 2m + 2 \\gt 2 \\Rightarrow m \\gt 0$. Vậy $0 \\lt m \\le 1$ nên $m = 1$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Điểm $(1; -1)$ là nghiệm của bất phương trình $x + y \\le 0$.","b) Bất phương trình $x \\le 4$ có miền nghiệm là nửa mặt phẳng bên trái đường thẳng $x = 4$, kể cả bờ.","c) Bất phương trình $2x + 3y + 1 \\gt 0$ không phải là bất phương trình bậc nhất hai ẩn.","d) Mọi điểm trên đường thẳng $x + y = 2$ đều là nghiệm của bất phương trình $x + y \\le 2$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $1 + (-1) = 0 \\le 0$. b) Đúng: $x \\le 4$ là $1x + 0y \\le 4$, miền nghiệm là nửa mặt phẳng bên trái đường $x = 4$ kể cả bờ. c) Sai: đây chính là bất phương trình bậc nhất hai ẩn. d) Đúng: các điểm trên bờ thỏa mãn dấu bằng.","points":1},{"type":"truefalse","level":"TH","q":"Cho bất phương trình $-3x + y \\ge -6$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(0; 0)$ là nghiệm của bất phương trình.","b) Miền nghiệm của bất phương trình chứa gốc tọa độ $O$.","c) Đường biên $-3x + y = -6$ được vẽ bằng nét liền.","d) Điểm $(3; 1)$ thuộc miền nghiệm của bất phương trình."],"answer":["T","T","T","F"],"explain":"a) Đúng: $0 \\ge -6$. b) Đúng vì $O$ là nghiệm. c) Đúng: dấu $\\ge$ nên kể cả bờ. d) Sai: $-9 + 1 = -8 \\ge -6$ sai.","points":1},{"type":"short","level":"VD","q":"Bất phương trình $ax + by \\le 12$ có đường biên đi qua $A(4; 0)$ và $B(0; 6)$. Biết $a = 3$, tìm $b$.","answer":"2","explain":"Thay $B(0; 6)$ vào đường biên $ax + by = 12$: $3 \\cdot 0 + b \\cdot 6 = 12 \\Leftrightarrow b = 2$ (điểm $A$ cho $4a = 12$ đúng với $a = 3$).","points":0.5},{"type":"short","level":"VDC","q":"Tìm số nguyên $a$ lớn nhất để cặp $(a; a + 1)$ là nghiệm của bất phương trình $2x - y \\le 3$.","answer":"4","explain":"Thay vào: $2a - (a + 1) \\le 3 \\Leftrightarrow a - 1 \\le 3 \\Leftrightarrow a \\le 4$. Số nguyên lớn nhất thỏa mãn là $4$.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Bất phương trình $5x - 2y \\ge 7$ có các hệ số $a, b, c$ lần lượt là","options":["A. $5; -2; 7$","B. $5; 2; 7$","C. $5; -2; -7$","D. $-5; 2; 7$"],"answer":"A","explain":"So với dạng $ax + by \\ge c$ ta có $a = 5, b = -2, c = 7$.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(0; -2)$ là nghiệm của bất phương trình nào sau đây?","options":["A. $x + y \\ge 0$","B. $2x - y \\le 1$","C. $-x + y \\le -2$","D. $x - y \\lt -3$"],"answer":"C","explain":"Thay $(0; -2)$: A: $-2 \\ge 0$ sai; B: $2 \\le 1$ sai; C: $-2 \\le -2$ đúng; D: $2 \\lt -3$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của bất phương trình $3x + y \\le 0$ là nửa mặt phẳng nào?","options":["A. Bờ $3x + y = 0$, chứa điểm $(1; 0)$","B. Bờ $3x + y = 0$, không chứa điểm $(1; 0)$, kể cả bờ","C. Bờ $3x + y = 0$, không chứa điểm $(-1; 0)$","D. Bờ $3x + y = 0$, chứa gốc $O$ ở phía trong (không kể bờ)"],"answer":"B","explain":"Gốc $O$ thuộc đường biên nên lấy điểm thử $(1; 0)$: $3 \\gt 0$ sai nên miền nghiệm không chứa $(1; 0)$; dấu $\\le$ nên kể cả bờ. Điểm $(-1; 0)$ thỏa mãn $-3 \\le 0$ nên thuộc miền nghiệm.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm nào sau đây thuộc đường biên của miền nghiệm của bất phương trình $x - 4y \\le 8$?","options":["A. $(0; 2)$","B. $(8; 0)$","C. $(4; 1)$","D. $(2; 2)$"],"answer":"B","explain":"Điểm thuộc đường biên $x - 4y = 8$: B cho $8 - 0 = 8$ đúng. A: $-8 \\ne 8$; C: $0 \\ne 8$; D: $-6 \\ne 8$.","points":0.25},{"type":"mcq","level":"VD","q":"Tìm $m$ để cặp $(2; -1)$ là nghiệm của bất phương trình $mx + 3y \\le 7$.","options":["A. $m \\le 5$","B. $m \\ge 5$","C. $m \\lt 5$","D. $m = 5$"],"answer":"A","explain":"Thay vào: $2m + 3 \\cdot (-1) \\le 7 \\Leftrightarrow 2m \\le 10 \\Leftrightarrow m \\le 5$.","points":0.25},{"type":"mcq","level":"VDC","q":"Biết mọi nghiệm $(x; y)$ của bất phương trình $x + 2y \\le 6$ với $x \\ge 0, y \\ge 0$ đều thỏa mãn $P = 2x + 3y \\le m$. Giá trị nhỏ nhất của $m$ là","options":["A. $9$","B. $10$","C. $12$","D. $15$"],"answer":"C","explain":"Miền $x + 2y \\le 6, x \\ge 0, y \\ge 0$ là tam giác với các đỉnh $(0;0), (6;0), (0;3)$. Giá trị của $P = 2x + 3y$ tại các đỉnh: $0; 12; 9$. Giá trị lớn nhất là $12$ nên $m$ nhỏ nhất là $12$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bất phương trình bậc nhất hai ẩn luôn có dạng $ax + by \\le c$.","b) Cặp $(3; -2)$ thỏa mãn bất phương trình $2x + y \\le 4$.","c) Kí hiệu $(x_0; y_0)$ là một nghiệm của $ax + by \\le c$ nghĩa là $ax_0 + by_0 \\le c$ là khẳng định đúng.","d) Bất phương trình $x \\gt 0$ và bất phương trình $-x \\lt 0$ tương đương nhau."],"answer":["F","T","T","T"],"explain":"a) Sai: có 4 dạng $\\le, \\ge, \\lt, \\gt$. b) Đúng: $6 - 2 = 4 \\le 4$. c) Đúng theo định nghĩa nghiệm. d) Đúng: nhân hai vế với $-1$ thì đổi chiều.","points":1},{"type":"truefalse","level":"TH","q":"Cho bất phương trình $5x - 2y \\lt 10$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(0; 0)$ là nghiệm của bất phương trình.","b) Miền nghiệm của bất phương trình chứa gốc tọa độ $O$.","c) Đường biên $5x - 2y = 10$ được vẽ bằng nét đứt.","d) Điểm $(0; -5)$ là nghiệm của bất phương trình."],"answer":["T","T","T","F"],"explain":"a) Đúng: $0 \\lt 10$. b) Đúng vì $O$ là nghiệm. c) Đúng: dấu $\\lt$ nên không kể bờ. d) Sai: $10 \\lt 10$ sai.","points":1},{"type":"short","level":"VD","q":"Cho bất phương trình $x + my \\le 8$ nhận cặp $(4; 2)$ làm nghiệm với dấu bằng (tức $4 + 2m = 8$). Tìm $m$.","answer":"2","explain":"$4 + 2m = 8 \\Leftrightarrow 2m = 4 \\Leftrightarrow m = 2$.","points":0.5},{"type":"short","level":"VDC","q":"Tìm số nguyên dương $n$ nhỏ nhất sao cho cặp $(n; n)$ là nghiệm của bất phương trình $3x + 4y \\gt 25$.","answer":"4","explain":"Thay vào: $7n \\gt 25 \\Leftrightarrow n \\gt \\frac{25}{7} \\approx 3{,}57$. Số nguyên dương nhỏ nhất thỏa mãn là $n = 4$.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Trong các cặp số sau, cặp nào KHÔNG là nghiệm của bất phương trình $x + y \\le 2$?","options":["A. $(0; 0)$","B. $(1; 1)$","C. $(2; 0)$","D. $(2; 1)$"],"answer":"D","explain":"Thay $(2; 1)$: $3 \\le 2$ sai nên không là nghiệm. A: $0 \\le 2$; B: $2 \\le 2$; C: $2 \\le 2$ đều là nghiệm.","points":0.25},{"type":"mcq","level":"NB","q":"Bất phương trình nào sau đây có miền nghiệm chứa điểm $(1; 1)$?","options":["A. $x + y \\le 1$","B. $2x - y \\ge 3$","C. $x - y \\gt 2$","D. $3x - y \\le 4$"],"answer":"D","explain":"Thay $(1; 1)$: A: $2 \\le 1$ sai; B: $1 \\ge 3$ sai; C: $0 \\gt 2$ sai; D: $2 \\le 4$ đúng.","points":0.25},{"type":"mcq","level":"TH","q":"Trong miền nghiệm của bất phương trình nào sau đây, đường thẳng $d: x + 2y = 5$ được vẽ bằng nét đứt?","options":["A. $x + 2y \\le 5$","B. $x + 2y \\ge 5$","C. $x + 2y \\lt 5$","D. $x + 2y = 5$"],"answer":"C","explain":"Dấu $\\lt$ nên miền nghiệm không kể bờ $d$, vẽ $d$ bằng nét đứt. D là phương trình, không phải bất phương trình.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của bất phương trình $2x - y \\ge -2$ chứa điểm nào sau đây?","options":["A. $(0; 0)$","B. $(-2; 1)$","C. $(1; 5)$","D. $(-1; 2)$"],"answer":"A","explain":"Thay $(0; 0)$: $0 \\ge -2$ đúng. B: $-5 \\ge -2$ sai; C: $-3 \\ge -2$ sai; D: $-4 \\ge -2$ sai.","points":0.25},{"type":"mcq","level":"VD","q":"Bất phương trình $x(x + 2) - x^2 + 3y \\ge 5$ tương đương với bất phương trình nào sau đây?","options":["A. $2x + 3y \\ge 5$","B. $2x + 3y \\ge 3$","C. $x + 3y \\ge 5$","D. $2x + 3y \\le 5$"],"answer":"A","explain":"$x^2 + 2x - x^2 + 3y \\ge 5 \\Leftrightarrow 2x + 3y \\ge 5$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bất phương trình $(m + 1)x - 2y \\le 4$. Khẳng định nào sau đây đúng?","options":["A. Miền nghiệm luôn chứa gốc tọa độ $O$ với mọi $m$","B. Miền nghiệm không chứa gốc tọa độ $O$ với mọi $m$","C. Đường biên luôn đi qua gốc tọa độ $O$","D. Miền nghiệm là một đường thẳng"],"answer":"A","explain":"Thay $O(0; 0)$: $0 \\le 4$ luôn đúng với mọi $m$ nên miền nghiệm luôn chứa $O$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Miền nghiệm của bất phương trình $x \\le 0$ là nửa mặt phẳng bên trái trục $Oy$, kể cả trục $Oy$.","b) Mọi bất phương trình dạng $ax + by \\lt c$ đều có miền nghiệm không chứa đường biên.","c) Cặp $(5; 5)$ là nghiệm của bất phương trình $x - y \\le 0$.","d) Bất phương trình $4x \\le 12$ tương đương với bất phương trình $x \\le 4$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $x \\le 0$ là $1x + 0y \\le 0$. b) Đúng: dấu $\\lt$ nên không kể bờ. c) Đúng: $0 \\le 0$. d) Sai: $4x \\le 12 \\Leftrightarrow x \\le 3$.","points":1},{"type":"truefalse","level":"TH","q":"Cho bất phương trình $3x + 4y \\gt 12$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(0; 0)$ không là nghiệm của bất phương trình.","b) Miền nghiệm của bất phương trình không chứa gốc tọa độ $O$.","c) Đường biên $3x + 4y = 12$ được vẽ bằng nét đứt.","d) Điểm $(4; 0)$ thuộc miền nghiệm của bất phương trình."],"answer":["T","T","T","F"],"explain":"a) Đúng: $0 \\gt 12$ sai. b) Đúng vì $O$ không là nghiệm. c) Đúng: dấu $\\gt$ nên không kể bờ. d) Sai: $12 \\gt 12$ sai.","points":1},{"type":"short","level":"VD","q":"Viết bất phương trình bậc nhất hai ẩn có miền nghiệm là nửa mặt phẳng bờ đường thẳng $x + y = 2$ chứa gốc $O$, kể cả bờ, dưới dạng $x + y \\le a$. Tìm $a$.","answer":"2","explain":"Miền chứa $O$ và kể cả bờ nên bất phương trình là $x + y \\le 2$, vậy $a = 2$.","points":0.5},{"type":"short","level":"VDC","q":"Một xưởng may dùng không quá $120$ m vải để may áo (hết $2$ m một áo) và quần (hết $3$ m một quần). Gọi $x, y$ lần lượt là số áo và số quần xưởng may. Nếu xưởng may $30$ cái quần thì may được tối đa bao nhiêu cái áo?","answer":"15","explain":"Bất phương trình: $2x + 3y \\le 120$. Với $y = 30$: $2x + 90 \\le 120 \\Leftrightarrow 2x \\le 30 \\Leftrightarrow x \\le 15$. Vậy tối đa $15$ cái áo.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Khái niệm nào sau đây mô tả đúng miền nghiệm của bất phương trình bậc nhất hai ẩn?","options":["A. Tập hợp các điểm có tọa độ là nghiệm của bất phương trình","B. Đường thẳng $ax + by = c$","C. Một điểm duy nhất trên mặt phẳng","D. Tập rỗng"],"answer":"A","explain":"Theo SGK, trong mặt phẳng tọa độ $Oxy$, tập hợp các điểm có tọa độ là nghiệm của bất phương trình $ax + by \\le c$ được gọi là miền nghiệm của nó.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(1; -1)$ là nghiệm của bất phương trình nào sau đây?","options":["A. $x + y \\gt 0$","B. $x - y \\le 1$","C. $2x + y \\ge 0$","D. $x + 2y \\lt -2$"],"answer":"C","explain":"Thay $(1; -1)$: A: $0 \\gt 0$ sai; B: $2 \\le 1$ sai; C: $1 \\ge 0$ đúng; D: $-1 \\lt -2$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Để biểu diễn miền nghiệm của bất phương trình $2x + y \\le 6$, sau khi vẽ đường thẳng $2x + y = 6$ ta làm gì tiếp theo?","options":["A. Lấy một điểm thử không thuộc đường thẳng; điểm thử thỏa mãn thì lấy nửa mặt phẳng chứa điểm đó","B. Tô đậm toàn bộ mặt phẳng tọa độ","C. Chỉ lấy mỗi đường thẳng $2x + y = 6$","D. Lấy ngẫu nhiên một nửa mặt phẳng bất kì"],"answer":"A","explain":"Đúng theo quy tắc 3 bước: vẽ đường thẳng $d$, lấy điểm thử $M_0 \\notin d$, điểm thử thỏa mãn thì miền nghiệm là nửa mặt phẳng bờ $d$ chứa $M_0$.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của bất phương trình $x + 3y - 9 \\ge 0$ không chứa điểm nào sau đây?","options":["A. $(0; 0)$","B. $(9; 0)$","C. $(0; 3)$","D. $(10; 10)$"],"answer":"A","explain":"Thay $(0; 0)$: $-9 \\ge 0$ sai nên không thuộc miền nghiệm. B: $0 \\ge 0$ thuộc; C: $0 \\ge 0$ thuộc; D: $31 \\ge 0$ thuộc.","points":0.25},{"type":"mcq","level":"VD","q":"Với giá trị nào của $m$ thì bất phương trình $(m^2 - 4)x + (m - 2)y \\le 1$ KHÔNG phải là bất phương trình bậc nhất hai ẩn?","options":["A. $m = 2$","B. $m = -2$","C. $m = 0$","D. $m = 4$"],"answer":"A","explain":"Cần $m^2 - 4 = 0$ và $m - 2 = 0$ đồng thời, suy ra $m = 2$. Với $m = -2$: hệ số của $y$ là $-4 \\ne 0$ nên vẫn là bất phương trình bậc nhất hai ẩn.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $x, y$ là các số nguyên dương thỏa mãn $x + 3y \\le 10$. Giá trị lớn nhất của $xy$ là","options":["A. $6$","B. $7$","C. $8$","D. $9$"],"answer":"C","explain":"$y = 1 \\Rightarrow x \\le 7 \\Rightarrow xy \\le 7$; $y = 2 \\Rightarrow x \\le 4 \\Rightarrow xy \\le 8$; $y = 3 \\Rightarrow x \\le 1 \\Rightarrow xy \\le 3$. Giá trị lớn nhất là $8$ (tại $x = 4, y = 2$).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Bất phương trình $2x + 3y \\le 6$ và bất phương trình $4x + 6y \\le 12$ có cùng miền nghiệm.","b) Điểm $(3; -1)$ thuộc miền nghiệm của bất phương trình $x + y \\le 2$.","c) Bất phương trình $x^2 + y^2 \\le 1$ là bất phương trình bậc nhất hai ẩn.","d) Gốc tọa độ $O$ thuộc đường biên của miền nghiệm của bất phương trình $x - y \\le 0$."],"answer":["T","T","F","T"],"explain":"a) Đúng: nhân hai vế với $2$ được bất phương trình tương đương. b) Đúng: $2 \\le 2$. c) Sai: có $x^2, y^2$ nên không bậc nhất. d) Đúng: $0 - 0 = 0$ thỏa mãn dấu bằng.","points":1},{"type":"truefalse","level":"TH","q":"Cho bất phương trình $-x - y \\ge -5$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(0; 0)$ là nghiệm của bất phương trình.","b) Miền nghiệm của bất phương trình chứa gốc tọa độ $O$.","c) Đường biên $-x - y = -5$ được vẽ bằng nét liền.","d) Điểm $(5; 5)$ là nghiệm của bất phương trình."],"answer":["T","T","T","F"],"explain":"Bất phương trình tương đương $x + y \\le 5$. a) Đúng: $0 \\le 5$. b) Đúng. c) Đúng: dấu $\\ge$ nên kể cả bờ. d) Sai: $10 \\le 5$ sai.","points":1},{"type":"short","level":"VD","q":"Bất phương trình $ax + 2y \\le 10$ nhận cặp $(2; 3)$ làm nghiệm với dấu bằng (tức $2a + 6 = 10$). Tìm $a$.","answer":"2","explain":"$2a + 6 = 10 \\Leftrightarrow 2a = 4 \\Leftrightarrow a = 2$.","points":0.5},{"type":"short","level":"VDC","q":"Có bao nhiêu cặp số nguyên $(x; y)$ với $x \\ge 0, y \\ge 0$ thỏa mãn $2x + y \\le 4$?","answer":"9","explain":"$x = 0$: $y \\in \\{0;1;2;3;4\\}$ (5 cặp). $x = 1$: $y \\in \\{0;1;2\\}$ (3 cặp). $x = 2$: $y = 0$ (1 cặp). Tổng $5 + 3 + 1 = 9$ cặp.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Bất phương trình nào sau đây KHÔNG phải là bất phương trình bậc nhất hai ẩn?","options":["A. $y \\le 2x + 1$","B. $3x \\ge 9$","C. $x + y + z \\le 1$","D. $-2x \\lt 5$"],"answer":"C","explain":"Đáp án C có ba ẩn $x, y, z$. A, B, D đều có dạng $ax + by$ so với $c$ với $a^2 + b^2 \\gt 0$.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(4; -1)$ là nghiệm của bất phương trình nào sau đây?","options":["A. $x + 2y \\le 0$","B. $2x + y \\ge 5$","C. $x - y \\lt 4$","D. $3x - 2y \\gt 15$"],"answer":"B","explain":"Thay $(4; -1)$: A: $2 \\le 0$ sai; B: $7 \\ge 5$ đúng; C: $5 \\lt 4$ sai; D: $14 \\gt 15$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của bất phương trình $x - y \\lt 0$ là nửa mặt phẳng nào?","options":["A. Bờ $x - y = 0$, chứa điểm $(1; 0)$, kể cả bờ","B. Bờ $x - y = 0$, không chứa điểm $(1; 0)$, không kể bờ","C. Bờ $x - y = 0$, chứa điểm $(0; 1)$, kể cả bờ","D. Bờ $x - y = 0$, không chứa điểm $(0; 1)$"],"answer":"B","explain":"Gốc $O$ thuộc đường biên nên lấy điểm thử $(1; 0)$: $1 \\lt 0$ sai nên miền nghiệm không chứa $(1; 0)$; dấu $\\lt$ nên không kể bờ. Điểm $(0; 1)$ thỏa mãn $-1 \\lt 0$ nên thuộc miền nghiệm.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm nào sau đây thuộc đường biên của miền nghiệm của bất phương trình $3x - 2y \\le 12$?","options":["A. $(4; 0)$","B. $(0; 6)$","C. $(2; 3)$","D. $(6; 2)$"],"answer":"A","explain":"Điểm thuộc đường biên $3x - 2y = 12$: A cho $12 = 12$ đúng. B: $-12 \\ne 12$; C: $0 \\ne 12$; D: $14 \\ne 12$.","points":0.25},{"type":"mcq","level":"VD","q":"Tìm số nguyên dương $m$ nhỏ nhất để cặp $(m; m)$ KHÔNG là nghiệm của bất phương trình $x + 2y \\le 9$.","options":["A. $3$","B. $4$","C. $5$","D. $6$"],"answer":"B","explain":"$(m; m)$ không là nghiệm $\\Leftrightarrow 3m \\gt 9 \\Leftrightarrow m \\gt 3$. Số nguyên dương nhỏ nhất thỏa mãn là $m = 4$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bất phương trình $ax + by \\le 6$ có miền nghiệm chứa các điểm $(1; 0)$, $(0; 1)$, $(1; 1)$ với $a, b$ là các số nguyên dương. Giá trị nhỏ nhất của $a + b$ là","options":["A. $1$","B. $2$","C. $3$","D. $6$"],"answer":"B","explain":"Từ $(1; 0)$: $a \\le 6$; từ $(0; 1)$: $b \\le 6$; từ $(1; 1)$: $a + b \\le 6$. Với $a, b$ nguyên dương thì $a + b \\ge 2$, dấu bằng khi $a = b = 1$ (thỏa mãn $2 \\le 6$).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mọi cặp $(x_0; y_0)$ thỏa mãn $ax_0 + by_0 = c$ đều là nghiệm của bất phương trình $ax + by \\le c$.","b) Cặp $(2; 100)$ là nghiệm của bất phương trình $x \\le 3$.","c) Bất phương trình bậc nhất hai ẩn có thể viết dưới $4$ dạng: $\\le, \\ge, \\lt, \\gt$.","d) Đường thẳng $y = 2$ song song với trục $Oy$."],"answer":["T","T","T","F"],"explain":"a) Đúng: thỏa mãn dấu bằng nên là nghiệm của cả 4 dạng. b) Đúng: $2 \\le 3$. c) Đúng theo định nghĩa. d) Sai: $y = 2$ song song với trục $Ox$.","points":1},{"type":"truefalse","level":"TH","q":"Cho bất phương trình $4x - y \\le 8$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(2; 0)$ là nghiệm của bất phương trình.","b) Đường biên $4x - y = 8$ đi qua điểm $(2; 0)$.","c) Miền nghiệm của bất phương trình chứa gốc tọa độ $O$.","d) Điểm $(0; -9)$ thuộc miền nghiệm của bất phương trình."],"answer":["T","T","T","F"],"explain":"a) Đúng: $8 \\le 8$. b) Đúng: $8 - 0 = 8$. c) Đúng: $0 \\le 8$. d) Sai: $9 \\le 8$ sai.","points":1},{"type":"short","level":"VD","q":"Miền nghiệm của bất phương trình $y \\ge 2x - 1$ chứa điểm $(0; a)$ với $a$ là số nguyên. Tìm giá trị nhỏ nhất của $a$.","answer":"-1","explain":"Thay $(0; a)$: $a \\ge -1$. Số nguyên $a$ nhỏ nhất thỏa mãn là $-1$.","points":0.5},{"type":"short","level":"VDC","q":"Một đội văn nghệ có không quá $40$ người, gồm nam và nữ. Số bạn nữ ít nhất gấp đôi số bạn nam. Gọi $x, y$ lần lượt là số bạn nam và số bạn nữ. Nếu đội có $10$ bạn nam thì có tối đa bao nhiêu bạn nữ?","answer":"30","explain":"Hệ điều kiện: $x + y \\le 40$ và $y \\ge 2x$. Với $x = 10$: $y \\ge 20$ và $y \\le 30$. Vậy tối đa $30$ bạn nữ.","points":0.5}]}]}</script>
