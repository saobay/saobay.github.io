<script type="application/json" class="saobay-exam10-data">{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Hệ nào sau đây là hệ bất phương trình bậc nhất hai ẩn?","options":["A. $\\begin{cases} x + y \\le 4 \\\\ x \\ge 0 \\end{cases}$","B. $\\begin{cases} x^2 + y \\le 1 \\\\ x \\ge 0 \\end{cases}$","C. $\\begin{cases} x + y + z \\le 1 \\\\ x \\ge 0 \\end{cases}$","D. $\\begin{cases} x + y = 2 \\\\ x \\ge 0 \\end{cases}$"],"answer":"A","explain":"Đáp án A gồm hai bất phương trình bậc nhất hai ẩn. B có $x^2$, C có ba ẩn, D chứa một phương trình.","points":0.25},{"type":"mcq","level":"NB","q":"Khẳng định nào sau đây đúng về cặp $(1; 1)$ đối với hệ $\\begin{cases} x + y \\le 3 \\\\ x - y \\ge 0 \\end{cases}$?","options":["A. $(1; 1)$ là nghiệm của hệ","B. $(1; 1)$ không là nghiệm vì không thỏa mãn bất phương trình thứ nhất","C. $(1; 1)$ không là nghiệm vì không thỏa mãn bất phương trình thứ hai","D. Không xác định được"],"answer":"A","explain":"Thay $(1; 1)$: $1 + 1 = 2 \\le 3$ đúng và $1 - 1 = 0 \\ge 0$ đúng, nên $(1; 1)$ đồng thời là nghiệm của cả hai bất phương trình, tức là nghiệm của hệ.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + y \\le 2 \\end{cases}$ là hình gì?","options":["A. Tam giác (kể cả ba cạnh)","B. Tứ giác","C. Nửa mặt phẳng","D. Hình tròn"],"answer":"A","explain":"Miền nghiệm là giao của góc phần tư thứ nhất với nửa mặt phẳng $x + y \\le 2$, tức tam giác $OAB$ với $O(0;0), A(2;0), B(0;2)$, kể cả ba cạnh vì các dấu đều có dấu bằng.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm nào sau đây là nghiệm của hệ $\\begin{cases} 2x + y \\le 6 \\\\ x - y \\ge 0 \\end{cases}$?","options":["A. $(2; 2)$","B. $(3; 3)$","C. $(1; 2)$","D. $(0; 5)$"],"answer":"A","explain":"Thay $(2; 2)$: $6 \\le 6$ đúng và $0 \\ge 0$ đúng. B: $9 \\le 6$ sai; C: $-1 \\ge 0$ sai; D: $-5 \\ge 0$ sai.","points":0.25},{"type":"mcq","level":"VD","q":"Tìm giá trị lớn nhất của $F(x; y) = x + 2y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + y \\le 3 \\end{cases}$.","options":["A. $3$","B. $5$","C. $6$","D. $9$"],"answer":"C","explain":"Miền nghiệm là tam giác với các đỉnh $(0;0), (3;0), (0;3)$. $F(0;0) = 0$, $F(3;0) = 3$, $F(0;3) = 6$. Giá trị lớn nhất là $6$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hệ $\\begin{cases} x + y \\le 5 \\\\ x \\ge 1 \\\\ y \\ge 1 \\end{cases}$. Giá trị lớn nhất của $F(x; y) = 3x + 2y$ trên miền nghiệm của hệ là","options":["A. $5$","B. $11$","C. $14$","D. $16$"],"answer":"C","explain":"Miền nghiệm là tam giác với các đỉnh $(1;1), (4;1), (1;4)$. $F(1;1) = 5$, $F(4;1) = 14$, $F(1;4) = 11$. Giá trị lớn nhất là $14$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hệ bất phương trình bậc nhất hai ẩn gồm hai hay nhiều bất phương trình bậc nhất hai ẩn.","b) Cặp $(2; 1)$ là nghiệm của hệ $\\begin{cases} x + y \\le 4 \\\\ x \\ge 0 \\end{cases}$.","c) Miền nghiệm của hệ là hợp của các miền nghiệm của từng bất phương trình trong hệ.","d) Hệ $\\begin{cases} x \\le 1 \\\\ y \\le 1 \\end{cases}$ có miền nghiệm chứa gốc tọa độ $O$."],"answer":["T","T","F","T"],"explain":"a) Đúng theo định nghĩa. b) Đúng: $3 \\le 4$ và $2 \\ge 0$. c) Sai: miền nghiệm của hệ là giao, không phải hợp. d) Đúng: $0 \\le 1$.","points":1},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} x + y \\le 4 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(4; 0)$ là nghiệm của hệ.","b) Miền nghiệm là tam giác $OAB$ với $A(4; 0), B(0; 4)$, kể cả ba cạnh.","c) Cặp $(2; 3)$ là nghiệm của hệ.","d) Điểm $(1; 1)$ thuộc miền nghiệm của hệ."],"answer":["T","T","F","T"],"explain":"a) Đúng: $4 \\le 4$, $4 \\ge 0$, $0 \\ge 0$. b) Đúng: giao của góc phần tư thứ nhất với $x + y \\le 4$. c) Sai: $5 \\le 4$ sai. d) Đúng: $2 \\le 4$.","points":1},{"type":"short","level":"VD","q":"Hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 2x + y \\le 6 \\end{cases}$ có miền nghiệm là tam giác với các đỉnh $O(0; 0), A(3; 0), B(0; 6)$. Tìm giá trị lớn nhất của $F(x; y) = x + y$ trên miền nghiệm đó.","answer":"6","explain":"$F(0; 0) = 0$, $F(3; 0) = 3$, $F(0; 6) = 6$. Giá trị lớn nhất là $6$.","points":0.5},{"type":"short","level":"VDC","q":"Một xưởng sản xuất hai loại sản phẩm A và B. Mỗi sản phẩm A lãi $3$ triệu đồng, mỗi sản phẩm B lãi $5$ triệu đồng. Điều kiện sản xuất: $x + 2y \\le 10$ (nguyên liệu), $x + y \\le 6$ (nhân công), $x \\ge 0, y \\ge 0$, trong đó $x, y$ lần lượt là số sản phẩm A, B. Lợi nhuận lớn nhất (tính bằng triệu đồng) mà xưởng đạt được là bao nhiêu?","answer":"26","explain":"Lợi nhuận $L = 3x + 5y$. Miền nghiệm có các đỉnh $(0;0), (6;0), (2;4), (0;5)$. $L$ tại các đỉnh: $0; 18; 26; 25$. Giá trị lớn nhất là $26$ triệu đồng.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Hệ nào sau đây KHÔNG phải là hệ bất phương trình bậc nhất hai ẩn?","options":["A. $\\begin{cases} x + y \\le 2 \\\\ x - y \\ge 0 \\end{cases}$","B. $\\begin{cases} xy \\le 1 \\\\ x \\ge 0 \\end{cases}$","C. $\\begin{cases} 2x \\le 4 \\\\ y \\ge 1 \\end{cases}$","D. $\\begin{cases} x \\lt 3 \\\\ y \\gt 2 \\\\ x + y \\le 5 \\end{cases}$"],"answer":"B","explain":"Đáp án B chứa $xy$ nên không phải bất phương trình bậc nhất hai ẩn. Các đáp án còn lại đều gồm các bất phương trình bậc nhất hai ẩn.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(0; 0)$ là nghiệm của hệ nào sau đây?","options":["A. $\\begin{cases} x + y \\le -1 \\\\ x \\ge 0 \\end{cases}$","B. $\\begin{cases} 2x - y \\ge 1 \\\\ x \\le 0 \\end{cases}$","C. $\\begin{cases} x - y \\le 2 \\\\ x + y \\ge 0 \\end{cases}$","D. $\\begin{cases} x \\gt 1 \\\\ y \\gt 1 \\end{cases}$"],"answer":"C","explain":"Thay $(0; 0)$: A: $0 \\le -1$ sai; B: $0 \\ge 1$ sai; C: $0 \\le 2$ đúng và $0 \\ge 0$ đúng; D: $0 \\gt 1$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của hệ $\\begin{cases} x \\le 2 \\\\ y \\le 2 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$ là","options":["A. hình vuông cạnh $2$ (kể cả biên)","B. hình chữ nhật","C. tam giác","D. nửa mặt phẳng"],"answer":"A","explain":"Miền nghiệm là $\\{(x; y) \\mid 0 \\le x \\le 2, 0 \\le y \\le 2\\}$, tức hình vuông cạnh $2$ kể cả biên.","points":0.25},{"type":"mcq","level":"TH","q":"Cặp số nào sau đây KHÔNG là nghiệm của hệ $\\begin{cases} x + 2y \\le 8 \\\\ x \\ge 1 \\\\ y \\ge 1 \\end{cases}$?","options":["A. $(1; 1)$","B. $(2; 3)$","C. $(4; 2)$","D. $(3; 3)$"],"answer":"D","explain":"Thay $(3; 3)$: $3 + 6 = 9 \\le 8$ sai nên không là nghiệm. A: $3 \\le 8$ là nghiệm; B: $8 \\le 8$ là nghiệm; C: $8 \\le 8$ là nghiệm.","points":0.25},{"type":"mcq","level":"VD","q":"Tìm giá trị nhỏ nhất của $F(x; y) = 2x - y$ trên miền nghiệm của hệ $\\begin{cases} 1 \\le x \\le 3 \\\\ 1 \\le y \\le 3 \\end{cases}$.","options":["A. $-1$","B. $1$","C. $3$","D. $5$"],"answer":"A","explain":"Miền nghiệm là hình vuông với các đỉnh $(1;1), (3;1), (1;3), (3;3)$. $F$ tại các đỉnh: $1; 5; -1; 3$. Giá trị nhỏ nhất là $-1$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hệ $\\begin{cases} x + y \\le 6 \\\\ 2x + y \\le 8 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Giá trị lớn nhất của $F(x; y) = 3x + 2y$ trên miền nghiệm của hệ là","options":["A. $12$","B. $14$","C. $16$","D. $18$"],"answer":"B","explain":"Miền nghiệm có các đỉnh $(0;0), (4;0), (2;4), (0;6)$. $F$ tại các đỉnh: $0; 12; 14; 12$. Giá trị lớn nhất là $14$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nghiệm của hệ bất phương trình phải thỏa mãn mọi bất phương trình trong hệ.","b) Cặp $(1; 2)$ là nghiệm của hệ $\\begin{cases} x \\lt 2 \\\\ y \\lt 3 \\end{cases}$.","c) Hệ $\\begin{cases} x \\ge 5 \\\\ x \\le 3 \\end{cases}$ có miền nghiệm là tập rỗng.","d) Miền nghiệm của mọi hệ bất phương trình bậc nhất hai ẩn đều là một đa giác."],"answer":["T","T","T","F"],"explain":"a) Đúng: phải đồng thời thỏa mãn tất cả. b) Đúng: $1 \\lt 2$ và $2 \\lt 3$. c) Đúng: không có $x$ nào vừa $\\ge 5$ vừa $\\le 3$. d) Sai: miền nghiệm có thể vô hạn, không bị giới hạn.","points":1},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + 2y \\le 6 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Miền nghiệm là tam giác $OAB$ với $A(3; 0), B(0; 3)$, kể cả ba cạnh.","b) Cặp $(3; 0)$ là nghiệm của hệ.","c) Cặp $(1; 3)$ là nghiệm của hệ.","d) Giá trị lớn nhất của $x + y$ trên miền nghiệm là $4$."],"answer":["T","T","F","F"],"explain":"a) Đúng: $y = 0 \\Rightarrow x = 3$; $x = 0 \\Rightarrow y = 3$. b) Đúng: $6 \\le 6$. c) Sai: $1 + 6 = 7 \\le 6$ sai. d) Sai: tại các đỉnh $O, A, B$ giá trị $x + y$ là $0, 3, 3$ nên giá trị lớn nhất là $3$.","points":1},{"type":"short","level":"VD","q":"Tìm hoành độ giao điểm của hai đường biên $x + y = 4$ và $2x - y = 2$.","answer":"2","explain":"Giải hệ $\\begin{cases} x + y = 4 \\\\ 2x - y = 2 \\end{cases}$: cộng hai phương trình được $3x = 6 \\Rightarrow x = 2$.","points":0.5},{"type":"short","level":"VDC","q":"Một người dùng không quá $12$ quả trứng để làm hai loại bánh: bánh A cần $2$ quả trứng một cái, bánh B cần $3$ quả trứng một cái. Mỗi bánh A lãi $20$ nghìn đồng, mỗi bánh B lãi $30$ nghìn đồng. Gọi $x, y$ lần lượt là số bánh A, bánh B ($x \\ge 0, y \\ge 0$). Lợi nhuận lớn nhất (tính bằng nghìn đồng) là bao nhiêu?","answer":"120","explain":"Lợi nhuận $L = 20x + 30y$ với $2x + 3y \\le 12, x \\ge 0, y \\ge 0$. Các đỉnh: $(0;0), (6;0), (0;4)$. $L$: $0; 120; 120$. Giá trị lớn nhất là $120$ nghìn đồng.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Khẳng định nào sau đây đúng về nghiệm của hệ bất phương trình bậc nhất hai ẩn?","options":["A. Cặp số thỏa mãn một bất phương trình trong hệ","B. Cặp số đồng thời là nghiệm của tất cả các bất phương trình trong hệ","C. Một đường thẳng trên mặt phẳng","D. Một nửa mặt phẳng"],"answer":"B","explain":"Theo định nghĩa, nghiệm của hệ là cặp số đồng thời là nghiệm của tất cả các bất phương trình trong hệ.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(2; 0)$ là nghiệm của hệ nào sau đây?","options":["A. $\\begin{cases} x + y \\le 1 \\\\ x \\ge 0 \\end{cases}$","B. $\\begin{cases} x - y \\ge 3 \\\\ y \\ge 0 \\end{cases}$","C. $\\begin{cases} 2x + y \\le 5 \\\\ x - y \\ge 0 \\end{cases}$","D. $\\begin{cases} x \\lt 2 \\\\ y \\le 0 \\end{cases}$"],"answer":"C","explain":"Thay $(2; 0)$: A: $2 \\le 1$ sai; B: $2 \\ge 3$ sai; C: $4 \\le 5$ đúng và $2 \\ge 0$ đúng; D: $2 \\lt 2$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của hệ $\\begin{cases} y \\ge 0 \\\\ y \\le 3 \\\\ x \\ge 0 \\end{cases}$ là","options":["A. một dải phẳng vô hạn","B. một tam giác","C. một hình vuông","D. một đoạn thẳng"],"answer":"A","explain":"Miền nghiệm là $\\{(x; y) \\mid x \\ge 0, 0 \\le y \\le 3\\}$, một dải phẳng vô hạn theo hướng $Ox$.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm nào sau đây thuộc miền nghiệm của hệ $\\begin{cases} x + y \\ge 2 \\\\ x \\le 3 \\\\ y \\le 3 \\end{cases}$?","options":["A. $(0; 0)$","B. $(3; 3)$","C. $(4; 0)$","D. $(0; 4)$"],"answer":"B","explain":"Thay $(3; 3)$: $6 \\ge 2$, $3 \\le 3$, $3 \\le 3$ đều đúng. A: $0 \\ge 2$ sai; C: $4 \\le 3$ sai; D: $4 \\le 3$ sai.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + y \\le 5 \\end{cases}$. Giá trị lớn nhất của $F(x; y) = 2x + 3y$ trên miền nghiệm của hệ là","options":["A. $10$","B. $12$","C. $15$","D. $25$"],"answer":"C","explain":"Các đỉnh: $(0;0), (5;0), (0;5)$. $F$: $0; 10; 15$. Giá trị lớn nhất là $15$.","points":0.25},{"type":"mcq","level":"VDC","q":"Hệ $\\begin{cases} x + y \\le 4 \\\\ x + 2y \\le 6 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$ có miền nghiệm là tứ giác $OABC$. Tọa độ điểm $C$ là giao của hai đường biên $x + y = 4$ và $x + 2y = 6$. Giá trị lớn nhất của $F(x; y) = x + 3y$ trên miền nghiệm là","options":["A. $8$","B. $9$","C. $10$","D. $12$"],"answer":"B","explain":"Giải hệ biên: $y = 2, x = 2$ nên $C(2; 2)$. Các đỉnh: $O(0;0), A(4;0), C(2;2), B(0;3)$. $F$: $0; 4; 8; 9$. Giá trị lớn nhất là $9$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hệ $\\begin{cases} x \\le 2 \\\\ x \\ge 2 \\end{cases}$ có nghiệm duy nhất.","b) Cặp $(0; 1)$ là nghiệm của hệ $\\begin{cases} y \\ge x \\\\ x \\ge 0 \\end{cases}$.","c) Miền nghiệm của hệ $\\begin{cases} x \\gt 0 \\\\ y \\gt 0 \\end{cases}$ không bao gồm các trục tọa độ.","d) Một bất phương trình đơn lẻ cũng được gọi là hệ bất phương trình."],"answer":["F","T","T","F"],"explain":"a) Sai: $x = 2$ nhưng $y$ tùy ý nên có vô số nghiệm. b) Đúng: $1 \\ge 0$ và $0 \\ge 0$. c) Đúng: dấu $\\gt$ nên không kể bờ là các trục. d) Sai: hệ gồm hai hay nhiều bất phương trình.","points":1},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} 2x + y \\le 4 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(2; 0)$ là nghiệm của hệ.","b) Miền nghiệm là tam giác kể cả ba cạnh.","c) Cặp $(1; 3)$ là nghiệm của hệ.","d) Giá trị lớn nhất của $F(x; y) = x + y$ trên miền nghiệm là $3$."],"answer":["T","T","F","F"],"explain":"a) Đúng: $4 \\le 4$. b) Đúng: tam giác $OAB$ với $A(2;0), B(0;4)$, các dấu đều có dấu bằng. c) Sai: $5 \\le 4$ sai. d) Sai: $F$ tại các đỉnh là $0, 2, 4$ nên giá trị lớn nhất là $4$.","points":1},{"type":"short","level":"VD","q":"Hệ $\\begin{cases} x \\ge 1 \\\\ y \\ge 1 \\\\ x + y \\le 6 \\end{cases}$ có miền nghiệm là tam giác với các đỉnh $(1; 1), (5; 1), (1; 5)$. Tính giá trị của $F(x; y) = 2x + y$ tại đỉnh $(5; 1)$.","answer":"11","explain":"$F(5; 1) = 2 \\cdot 5 + 1 = 11$.","points":0.5},{"type":"short","level":"VDC","q":"Một công ty cần thuê xe chở ít nhất $100$ người: xe loại A chở $20$ người, xe loại B chở $30$ người; tổng số xe không quá $6$; số xe mỗi loại không âm. Gọi $x, y$ lần lượt là số xe loại A, loại B. Nếu công ty thuê $2$ xe loại A thì cần thuê tối thiểu bao nhiêu xe loại B?","answer":"2","explain":"Cần $20 \\cdot 2 + 30y \\ge 100 \\Leftrightarrow 30y \\ge 60 \\Leftrightarrow y \\ge 2$, và $2 + y \\le 6$ thỏa mãn. Vậy tối thiểu $2$ xe loại B.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Miền nghiệm của hệ bất phương trình bậc nhất hai ẩn là gì?","options":["A. Giao của các miền nghiệm của từng bất phương trình trong hệ","B. Hợp của các miền nghiệm của từng bất phương trình trong hệ","C. Hiệu của các miền nghiệm của từng bất phương trình trong hệ","D. Một đường thẳng"],"answer":"A","explain":"Miền nghiệm của hệ là giao của các miền nghiệm của từng bất phương trình trong hệ.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(1; 3)$ là nghiệm của hệ nào sau đây?","options":["A. $\\begin{cases} x + y \\le 3 \\\\ x \\ge 0 \\end{cases}$","B. $\\begin{cases} x + 2y \\le 8 \\\\ x - y \\le 0 \\end{cases}$","C. $\\begin{cases} 2x \\ge 8 \\\\ y \\ge 0 \\end{cases}$","D. $\\begin{cases} y \\lt 3 \\\\ x \\gt 0 \\end{cases}$"],"answer":"B","explain":"Thay $(1; 3)$: A: $4 \\le 3$ sai; B: $7 \\le 8$ đúng và $-2 \\le 0$ đúng; C: $2 \\ge 8$ sai; D: $3 \\lt 3$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x \\le 4 \\\\ y \\le 3 \\end{cases}$ có miền nghiệm là hình chữ nhật với diện tích bằng","options":["A. $7$","B. $12$","C. $14$","D. $24$"],"answer":"B","explain":"Miền nghiệm là hình chữ nhật $4 \\times 3$ nên diện tích bằng $12$.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm nào sau đây KHÔNG thuộc miền nghiệm của hệ $\\begin{cases} x + y \\le 5 \\\\ x \\ge 2 \\end{cases}$?","options":["A. $(2; 3)$","B. $(3; 1)$","C. $(2; 0)$","D. $(5; 5)$"],"answer":"D","explain":"Thay $(5; 5)$: $10 \\le 5$ sai nên không thuộc miền nghiệm. A: $5 \\le 5$ thuộc; B: $4 \\le 5$ thuộc; C: $2 \\le 5$ thuộc.","points":0.25},{"type":"mcq","level":"VD","q":"Tìm giá trị nhỏ nhất của $F(x; y) = x + 2y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 1 \\\\ y \\ge 2 \\\\ x + y \\le 6 \\end{cases}$.","options":["A. $5$","B. $8$","C. $11$","D. $13$"],"answer":"A","explain":"Các đỉnh: $(1;2), (4;2), (1;5)$. $F$: $5; 8; 11$. Giá trị nhỏ nhất là $5$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hệ $\\begin{cases} x + 3y \\le 9 \\\\ 2x + y \\le 8 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Giá trị lớn nhất của $F(x; y) = 4x + 3y$ trên miền nghiệm của hệ là","options":["A. $16$","B. $18$","C. $20$","D. $24$"],"answer":"B","explain":"Các đỉnh: $(0;0), (4;0), (3;2), (0;3)$ (giao của hai đường biên: $x = 3, y = 2$). $F$: $0; 16; 18; 9$. Giá trị lớn nhất là $18$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Để kiểm tra $(x_0; y_0)$ có là nghiệm của hệ không, ta thay vào từng bất phương trình trong hệ.","b) Hệ $\\begin{cases} x + y \\le 2 \\\\ x + y \\ge 5 \\end{cases}$ vô nghiệm.","c) Miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\end{cases}$ là nửa mặt phẳng bên phải trục $Oy$, kể cả trục $Oy$.","d) Mọi hệ bất phương trình bậc nhất hai ẩn đều có miền nghiệm là một đa giác."],"answer":["T","T","T","F"],"explain":"a) Đúng: phải thỏa mãn đồng thời tất cả. b) Đúng: không có cặp số nào vừa có tổng $\\le 2$ vừa $\\ge 5$. c) Đúng. d) Sai: miền nghiệm có thể không bị giới hạn.","points":1},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} x - y \\le 2 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(0; 0)$ là nghiệm của hệ.","b) Miền nghiệm của hệ chứa gốc tọa độ $O$.","c) Cặp $(3; 0)$ là nghiệm của hệ.","d) Miền nghiệm của hệ bị giới hạn (là một đa giác)."],"answer":["T","T","F","F"],"explain":"a) Đúng: $0 \\le 2$. b) Đúng vì $O$ là nghiệm. c) Sai: $3 \\le 2$ sai. d) Sai: với $y$ lớn tùy ý, $x = y$ vẫn thỏa mãn nên miền không bị giới hạn.","points":1},{"type":"short","level":"VD","q":"Tìm tung độ giao điểm của hai đường biên $x + 2y = 8$ và $x - y = 2$.","answer":"2","explain":"Trừ hai phương trình: $3y = 6 \\Rightarrow y = 2$.","points":0.5},{"type":"short","level":"VDC","q":"Một người cần pha chế không quá $10$ lít dung dịch từ hai loại: loại A nồng độ $10\\%$, loại B nồng độ $40\\%$; dung dịch pha được phải có nồng độ không quá $25\\%$. Gọi $x, y$ (lít) lần lượt là lượng loại A, loại B. Nếu người đó dùng $4$ lít loại A thì dùng được tối đa bao nhiêu lít loại B?","answer":"4","explain":"Điều kiện: $x + y \\le 10$ và $0{,}1x + 0{,}4y \\le 0{,}25(x + y) \\Leftrightarrow 0{,}15y \\le 0{,}15x \\Leftrightarrow y \\le x$. Với $x = 4$: $y \\le 4$ và $4 + y \\le 10$. Vậy tối đa $4$ lít loại B.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Hệ $\\begin{cases} 2x + y \\le 5 \\\\ x - y \\ge 1 \\end{cases}$ gồm bao nhiêu bất phương trình?","options":["A. $1$","B. $2$","C. $3$","D. $4$"],"answer":"B","explain":"Hệ gồm hai bất phương trình bậc nhất hai ẩn.","points":0.25},{"type":"mcq","level":"NB","q":"Khẳng định nào sau đây đúng về cặp $(3; 1)$ đối với hệ $\\begin{cases} x + y \\le 5 \\\\ x - y \\ge 1 \\end{cases}$?","options":["A. $(3; 1)$ là nghiệm của hệ","B. $(3; 1)$ không là nghiệm vì không thỏa mãn bất phương trình thứ nhất","C. $(3; 1)$ không là nghiệm vì không thỏa mãn bất phương trình thứ hai","D. Không xác định được"],"answer":"A","explain":"Thay $(3; 1)$: $4 \\le 5$ đúng và $2 \\ge 1$ đúng, nên $(3; 1)$ là nghiệm của hệ.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + y \\ge 4 \\\\ x + y \\le 6 \\end{cases}$ là","options":["A. một hình thang","B. một tam giác","C. một hình vuông","D. một nửa mặt phẳng"],"answer":"A","explain":"Miền nghiệm là phần nằm giữa hai đường thẳng song song $x + y = 4$ và $x + y = 6$ trong góc phần tư thứ nhất, tức một hình thang.","points":0.25},{"type":"mcq","level":"TH","q":"Hệ nào sau đây có miền nghiệm chứa điểm $(2; 2)$?","options":["A. $\\begin{cases} x + y \\le 3 \\\\ x \\ge 0 \\end{cases}$","B. $\\begin{cases} x + y \\ge 5 \\\\ y \\le 3 \\end{cases}$","C. $\\begin{cases} x - y \\ge 1 \\\\ x \\le 3 \\end{cases}$","D. $\\begin{cases} x + y \\le 5 \\\\ x \\ge 1 \\\\ y \\ge 1 \\end{cases}$"],"answer":"D","explain":"Thay $(2; 2)$: A: $4 \\le 3$ sai; B: $4 \\ge 5$ sai; C: $0 \\ge 1$ sai; D: $4 \\le 5$, $2 \\ge 1$, $2 \\ge 1$ đều đúng.","points":0.25},{"type":"mcq","level":"VD","q":"Tìm giá trị lớn nhất của $F(x; y) = 5x + 4y$ trên miền nghiệm của hệ $\\begin{cases} 0 \\le x \\le 2 \\\\ 0 \\le y \\le 3 \\end{cases}$.","options":["A. $10$","B. $12$","C. $22$","D. $24$"],"answer":"C","explain":"Các đỉnh: $(0;0), (2;0), (2;3), (0;3)$. $F$: $0; 10; 22; 12$. Giá trị lớn nhất là $22$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hệ $\\begin{cases} 3x + y \\le 9 \\\\ x + 2y \\le 8 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Giá trị lớn nhất của $F(x; y) = 2x + 3y$ trên miền nghiệm của hệ là","options":["A. $12$","B. $13$","C. $15$","D. $18$"],"answer":"B","explain":"Các đỉnh: $(0;0), (3;0), (2;3), (0;4)$ (giao hai đường biên: $x = 2, y = 3$). $F$: $0; 6; 13; 12$. Giá trị lớn nhất là $13$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hệ $\\begin{cases} x \\le 1 \\\\ y \\le 2 \\end{cases}$ có vô số nghiệm.","b) Cặp $(1; 2)$ là nghiệm của hệ $\\begin{cases} x \\le 1 \\\\ y \\le 2 \\end{cases}$.","c) Miền nghiệm của hệ là giao của các miền nghiệm thành phần.","d) Hệ $\\begin{cases} x \\ge 0 \\\\ x \\le 0 \\end{cases}$ có nghiệm duy nhất $(0; 0)$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $x \\le 1, y \\le 2$ có vô số cặp thỏa mãn. b) Đúng: $1 \\le 1$ và $2 \\le 2$. c) Đúng theo định nghĩa. d) Sai: $x = 0$ nhưng $y$ tùy ý nên có vô số nghiệm.","points":1},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} x + 2y \\le 10 \\\\ 2x + y \\le 10 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Giao điểm của hai đường biên $x + 2y = 10$ và $2x + y = 10$ là điểm $\\left(\\frac{10}{3}; \\frac{10}{3}\\right)$.","b) Điểm $\\left(\\frac{10}{3}; \\frac{10}{3}\\right)$ là nghiệm của hệ.","c) Miền nghiệm của hệ là một ngũ giác.","d) Giá trị lớn nhất của $x + y$ trên miền nghiệm là $\\frac{20}{3}$."],"answer":["T","T","F","T"],"explain":"a) Đúng: giải hệ được $x = y = \\frac{10}{3}$. b) Đúng: thỏa mãn dấu bằng. c) Sai: miền nghiệm là tứ giác với các đỉnh $O(0;0), (5;0), \\left(\\frac{10}{3}; \\frac{10}{3}\\right), (0;5)$. d) Đúng: $x + y$ tại các đỉnh là $0, 5, \\frac{20}{3}, 5$ nên giá trị lớn nhất là $\\frac{20}{3}$.","points":1},{"type":"short","level":"VD","q":"Tìm giá trị của $F(x; y) = 4x + 5y$ tại đỉnh $(0; 7)$ của miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + y \\le 7 \\end{cases}$.","answer":"35","explain":"$F(0; 7) = 4 \\cdot 0 + 5 \\cdot 7 = 35$.","points":0.5},{"type":"short","level":"VDC","q":"Một hộ nông dân trồng không quá $5$ ha, gồm lúa (lãi $8$ triệu đồng một ha) và rau (lãi $12$ triệu đồng một ha); diện tích trồng rau không quá $3$ ha; diện tích mỗi loại không âm. Lợi nhuận lớn nhất (tính bằng triệu đồng) mà hộ nông dân đạt được là bao nhiêu?","answer":"52","explain":"Lợi nhuận $L = 8x + 12y$ với $x + y \\le 5, y \\le 3, x \\ge 0, y \\ge 0$. Các đỉnh: $(0;0), (5;0), (2;3), (0;3)$. $L$: $0; 40; 52; 36$. Giá trị lớn nhất là $52$ triệu đồng.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Cặp số nào sau đây là nghiệm của hệ $\\begin{cases} x - y \\le 0 \\\\ x + y \\le 2 \\end{cases}$?","options":["A. $(1; 1)$","B. $(2; 0)$","C. $(0; 3)$","D. $(2; 2)$"],"answer":"A","explain":"Thay $(1; 1)$: $0 \\le 0$ đúng và $2 \\le 2$ đúng. B: $2 \\le 0$ sai; C: $3 \\le 2$ sai; D: $4 \\le 2$ sai.","points":0.25},{"type":"mcq","level":"NB","q":"Miền nghiệm của hệ $\\begin{cases} x \\ge 1 \\\\ y \\ge 1 \\end{cases}$ là","options":["A. miền góc vuông đỉnh $(1; 1)$ chứa điểm $(2; 2)$","B. một tam giác","C. một hình vuông","D. một đường thẳng"],"answer":"A","explain":"Miền nghiệm là $\\{(x; y) \\mid x \\ge 1, y \\ge 1\\}$, tức miền góc vuông có đỉnh $(1; 1)$ chứa điểm $(2; 2)$.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của hệ $\\begin{cases} x \\le 0 \\\\ y \\le 0 \\end{cases}$ là góc phần tư thứ mấy (kể cả hai trục tọa độ)?","options":["A. Thứ nhất","B. Thứ hai","C. Thứ ba","D. Thứ tư"],"answer":"C","explain":"$x \\le 0, y \\le 0$ là góc phần tư thứ ba kể cả hai trục tọa độ âm.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm nào sau đây là một đỉnh của miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 2x + 3y \\le 12 \\end{cases}$?","options":["A. $(6; 0)$","B. $(0; 6)$","C. $(4; 4)$","D. $(3; 3)$"],"answer":"A","explain":"Điểm $(6; 0)$ thỏa mãn $12 \\le 12$ và nằm trên trục $Ox$ nên là đỉnh của tam giác miền nghiệm. B: $18 \\le 12$ sai; C: $20 \\le 12$ sai; D: $18 \\le 12$ sai.","points":0.25},{"type":"mcq","level":"VD","q":"Tìm giá trị nhỏ nhất của $F(x; y) = 3x + 2y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 2 \\\\ y \\ge 1 \\\\ x + y \\le 8 \\end{cases}$.","options":["A. $8$","B. $18$","C. $23$","D. $6$"],"answer":"A","explain":"Các đỉnh: $(2;1), (7;1), (2;6)$. $F$: $8; 23; 18$. Giá trị nhỏ nhất là $8$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hệ $\\begin{cases} x + 2y \\le 8 \\\\ 3x + y \\le 9 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Giá trị lớn nhất của $F(x; y) = 5x + 4y$ trên miền nghiệm của hệ là","options":["A. $15$","B. $16$","C. $22$","D. $25$"],"answer":"C","explain":"Các đỉnh: $(0;0), (3;0), (2;3), (0;4)$ (giao hai đường biên: $x = 2, y = 3$). $F$: $0; 15; 22; 16$. Giá trị lớn nhất là $22$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(x_0; y_0)$ là nghiệm của hệ $\\begin{cases} x \\le a \\\\ y \\le b \\end{cases}$ khi $x_0 \\le a$ hoặc $y_0 \\le b$.","b) Hệ $\\begin{cases} x \\le 3 \\\\ y \\le 3 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$ có miền nghiệm là hình vuông cạnh $3$.","c) Điểm $(3; 3)$ thuộc miền nghiệm của hệ ở câu b.","d) Hệ bất phương trình bậc nhất hai ẩn có thể có miền nghiệm rỗng."],"answer":["F","T","T","T"],"explain":"a) Sai: phải đồng thời $x_0 \\le a$ và $y_0 \\le b$. b) Đúng: hình vuông $3 \\times 3$. c) Đúng: $3 \\le 3$. d) Đúng: ví dụ hệ $\\begin{cases} x \\ge 1 \\\\ x \\le 0 \\end{cases}$ vô nghiệm.","points":1},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} 2x - y \\le 4 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Miền nghiệm của hệ bị giới hạn (là một đa giác).","b) Cặp $(0; 0)$ là nghiệm của hệ.","c) Cặp $(2; 0)$ là nghiệm của hệ.","d) Điểm $(0; 1)$ thuộc miền nghiệm của hệ."],"answer":["F","T","T","T"],"explain":"a) Sai: với $y$ lớn tùy ý, lấy $x = y$ thì $x \\ge 0$ và $2x - y = y \\le 4$... kiểm tra: $x = y = 10$: $20 - 10 = 10 \\le 4$ sai. Xét $x = 0, y$ lớn: $-y \\le 4$ đúng với mọi $y \\ge 0$, nên miền không bị giới hạn. b) Đúng: $0 \\le 4$. c) Đúng: $4 \\le 4$. d) Đúng: $-1 \\le 4$.","points":1},{"type":"short","level":"VD","q":"Tìm giá trị lớn nhất của $F(x; y) = 3x + 2y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + y \\le 2 \\end{cases}$.","answer":"6","explain":"Các đỉnh: $(0;0), (2;0), (0;2)$. $F$: $0; 6; 4$. Giá trị lớn nhất là $6$.","points":0.5},{"type":"short","level":"VDC","q":"Một nhà máy sản xuất hai mặt hàng X và Y. Mỗi đơn vị mặt hàng X lãi $4$ triệu đồng, mỗi đơn vị mặt hàng Y lãi $6$ triệu đồng. Ràng buộc: $2x + y \\le 12$ (giờ máy), $x + 2y \\le 12$ (nhân công), $x \\ge 0, y \\ge 0$. Lợi nhuận lớn nhất (tính bằng triệu đồng) mà nhà máy đạt được là bao nhiêu?","answer":"40","explain":"Lợi nhuận $L = 4x + 6y$. Các đỉnh: $(0;0), (6;0), (4;4), (0;6)$. $L$: $0; 24; 40; 36$. Giá trị lớn nhất là $40$ triệu đồng.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Hệ bất phương trình nào sau đây gồm ba bất phương trình?","options":["A. $\\begin{cases} x + y \\le 4 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$","B. $\\begin{cases} x \\le 2 \\\\ y \\le 3 \\end{cases}$","C. $\\begin{cases} 2x - y \\ge 1 \\end{cases}$","D. $\\begin{cases} x \\lt 1 \\\\ y \\lt 2 \\\\ z \\lt 3 \\end{cases}$"],"answer":"A","explain":"Đáp án A gồm ba bất phương trình bậc nhất hai ẩn. D có ba ẩn nên không phải hệ bất phương trình bậc nhất hai ẩn.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(0; 2)$ KHÔNG là nghiệm của hệ nào sau đây?","options":["A. $\\begin{cases} x + y \\le 3 \\\\ x \\ge 0 \\end{cases}$","B. $\\begin{cases} y \\ge 3 \\\\ x \\ge 0 \\end{cases}$","C. $\\begin{cases} x - y \\le 0 \\\\ y \\le 2 \\end{cases}$","D. $\\begin{cases} 2x + y \\le 4 \\\\ y \\ge 0 \\end{cases}$"],"answer":"B","explain":"Thay $(0; 2)$: B có $2 \\ge 3$ sai nên $(0; 2)$ không là nghiệm. A: $2 \\le 3$ là nghiệm; C: $-2 \\le 0$ và $2 \\le 2$ là nghiệm; D: $2 \\le 4$ là nghiệm.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của hệ $\\begin{cases} x + y \\le 0 \\\\ x \\ge 0 \\\\ y \\le 0 \\end{cases}$ là","options":["A. chỉ gồm điểm $O$","B. một góc vô hạn có đỉnh $O$","C. một tam giác","D. một nửa mặt phẳng"],"answer":"B","explain":"Điều kiện $x \\ge 0, y \\le 0, x + y \\le 0$ cho miền góc vô hạn có đỉnh $O$ (ví dụ điểm $(1; -2)$ thỏa mãn).","points":0.25},{"type":"mcq","level":"TH","q":"Hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x \\le 5 \\end{cases}$ có miền nghiệm là","options":["A. dải vô hạn $0 \\le x \\le 5, y \\ge 0$","B. một tam giác","C. một hình chữ nhật","D. một đoạn thẳng"],"answer":"A","explain":"Không có ràng buộc trên cho $y$ nên miền nghiệm là dải vô hạn $0 \\le x \\le 5, y \\ge 0$.","points":0.25},{"type":"mcq","level":"VD","q":"Tìm giá trị lớn nhất của $F(x; y) = x + 4y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 2x + y \\le 10 \\end{cases}$.","options":["A. $10$","B. $20$","C. $40$","D. $50$"],"answer":"C","explain":"Các đỉnh: $(0;0), (5;0), (0;10)$. $F$: $0; 5; 40$. Giá trị lớn nhất là $40$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hệ $\\begin{cases} x + 4y \\le 12 \\\\ 2x + y \\le 10 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Giá trị lớn nhất của $F(x; y) = 3x + 5y$ trên miền nghiệm của hệ là","options":["A. $15$","B. $20$","C. $22$","D. $25$"],"answer":"C","explain":"Các đỉnh: $(0;0), (5;0), (4;2), (0;3)$ (giao hai đường biên: $x = 4, y = 2$). $F$: $0; 15; 22; 15$. Giá trị lớn nhất là $22$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hệ $\\begin{cases} x \\le 2 \\\\ y \\ge 1 \\end{cases}$ có miền nghiệm là một dải vô hạn.","b) Cặp $(2; 1)$ là nghiệm của hệ ở câu a.","c) Muốn vẽ miền nghiệm của hệ, ta vẽ miền nghiệm của từng bất phương trình trên cùng một hình.","d) Phần mặt phẳng bị gạch bỏ trong hình vẽ chính là miền nghiệm của hệ."],"answer":["T","T","T","F"],"explain":"a) Đúng: $x \\le 2, y \\ge 1$ là miền vô hạn. b) Đúng: $2 \\le 2$ và $1 \\ge 1$. c) Đúng theo quy tắc vẽ. d) Sai: phần bị gạch bỏ là phần không thỏa mãn, miền nghiệm là phần không bị gạch.","points":1},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} x + y \\ge 3 \\\\ x \\le 4 \\\\ y \\le 4 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Cặp $(0; 0)$ không là nghiệm của hệ.","b) Miền nghiệm của hệ không chứa gốc tọa độ $O$.","c) Cặp $(4; 4)$ là nghiệm của hệ.","d) Miền nghiệm của hệ là một tứ giác."],"answer":["T","T","T","F"],"explain":"a) Đúng: $0 \\ge 3$ sai. b) Đúng vì $O$ không là nghiệm. c) Đúng: $8 \\ge 3$, $4 \\le 4$. d) Sai: miền là hình vuông $[-1; 4] \\times [-1; 4]$ cắt bởi $x + y \\ge 3$, còn lại tam giác với các đỉnh $(4;4), (-1;4), (4;-1)$.","points":1},{"type":"short","level":"VD","q":"Tìm giá trị của $F(x; y) = 2x + 3y$ tại giao điểm của hai đường biên $x + y = 5$ và $x - y = 1$.","answer":"12","explain":"Giải hệ: $x = 3, y = 2$. $F(3; 2) = 6 + 6 = 12$.","points":0.5},{"type":"short","level":"VDC","q":"Một cửa hàng bán hai loại hộp quà: loại I lãi $30$ nghìn đồng một hộp, loại II lãi $50$ nghìn đồng một hộp. Mỗi hộp loại I cần $1$ giờ gói, mỗi hộp loại II cần $2$ giờ gói; cửa hàng có tối đa $40$ giờ gói; tổng số hộp không quá $30$; số hộp mỗi loại không âm. Lợi nhuận lớn nhất (tính bằng nghìn đồng) mà cửa hàng đạt được là bao nhiêu?","answer":"1100","explain":"Lợi nhuận $L = 30x + 50y$ với $x + 2y \\le 40, x + y \\le 30, x \\ge 0, y \\ge 0$. Các đỉnh: $(0;0), (30;0), (20;10), (0;20)$. $L$: $0; 900; 1100; 1000$. Giá trị lớn nhất là $1100$ nghìn đồng.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Muốn là nghiệm của hệ bất phương trình thì cặp số phải","options":["A. thỏa mãn ít nhất một bất phương trình trong hệ","B. thỏa mãn đồng thời tất cả các bất phương trình trong hệ","C. thỏa mãn đúng một bất phương trình trong hệ","D. không thỏa mãn bất phương trình nào trong hệ"],"answer":"B","explain":"Nghiệm của hệ phải đồng thời là nghiệm của tất cả các bất phương trình trong hệ.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(5; 0)$ là nghiệm của hệ nào sau đây?","options":["A. $\\begin{cases} x + y \\le 4 \\\\ x \\ge 0 \\end{cases}$","B. $\\begin{cases} 2x - y \\le 10 \\\\ x \\ge 5 \\end{cases}$","C. $\\begin{cases} x \\lt 5 \\\\ y \\le 0 \\end{cases}$","D. $\\begin{cases} y \\ge 1 \\\\ x \\le 5 \\end{cases}$"],"answer":"B","explain":"Thay $(5; 0)$: A: $5 \\le 4$ sai; B: $10 \\le 10$ đúng và $5 \\ge 5$ đúng; C: $5 \\lt 5$ sai; D: $0 \\ge 1$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của hệ $\\begin{cases} x \\ge 2 \\\\ x \\le 5 \\\\ y \\ge 1 \\\\ y \\le 4 \\end{cases}$ là hình chữ nhật có diện tích bằng","options":["A. $6$","B. $9$","C. $12$","D. $20$"],"answer":"B","explain":"Hình chữ nhật $3 \\times 3$ nên diện tích bằng $9$.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm nào sau đây nằm trên biên của miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + y \\le 6 \\end{cases}$?","options":["A. $(3; 3)$","B. $(4; 4)$","C. $(0; 7)$","D. $(7; 0)$"],"answer":"A","explain":"Điểm $(3; 3)$ thỏa mãn $3 + 3 = 6$ nên nằm trên đường biên $x + y = 6$. B: $8 \\le 6$ sai; C: $7 \\le 6$ sai; D: $7 \\le 6$ sai.","points":0.25},{"type":"mcq","level":"VD","q":"Tìm giá trị nhỏ nhất của $F(x; y) = 4x + 3y$ trên miền nghiệm của hệ $\\begin{cases} 2 \\le x \\le 5 \\\\ 1 \\le y \\le 4 \\end{cases}$.","options":["A. $11$","B. $20$","C. $23$","D. $32$"],"answer":"A","explain":"Các đỉnh: $(2;1), (5;1), (2;4), (5;4)$. $F$: $11; 23; 20; 32$. Giá trị nhỏ nhất là $11$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hệ $\\begin{cases} 2x + 3y \\le 12 \\\\ x + y \\le 5 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Giá trị lớn nhất của $F(x; y) = 4x + 5y$ trên miền nghiệm của hệ là","options":["A. $20$","B. $21$","C. $22$","D. $25$"],"answer":"C","explain":"Các đỉnh: $(0;0), (5;0), (3;2), (0;4)$ (giao hai đường biên: $x = 3, y = 2$). $F$: $0; 20; 22; 20$. Giá trị lớn nhất là $22$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\end{cases}$ có miền nghiệm là góc phần tư thứ nhất kể cả hai trục tọa độ.","b) Mọi điểm trong góc phần tư thứ nhất đều có tọa độ không âm.","c) Cặp $(x_0; y_0)$ là nghiệm của hệ $\\begin{cases} x \\le a \\\\ y \\le b \\end{cases}$ khi $x_0 \\le a$ hoặc $y_0 \\le b$.","d) Hệ bất phương trình bậc nhất hai ẩn có thể có miền nghiệm rỗng."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: phải đồng thời $x_0 \\le a$ và $y_0 \\le b$. d) Đúng: ví dụ hệ $\\begin{cases} x \\ge 1 \\\\ x \\le 0 \\end{cases}$.","points":1},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} 3x + y \\le 6 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Miền nghiệm là tam giác $OAB$ với $A(2; 0), B(0; 6)$, kể cả ba cạnh.","b) Cặp $(2; 0)$ là nghiệm của hệ.","c) Cặp $(1; 4)$ là nghiệm của hệ.","d) Giá trị lớn nhất của $F(x; y) = 2x + y$ trên miền nghiệm là $6$."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng: $6 \\le 6$. c) Sai: $7 \\le 6$ sai. d) Đúng: $F$ tại các đỉnh $O, A, B$ là $0, 4, 6$.","points":1},{"type":"short","level":"VD","q":"Hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 3x + 2y \\le 12 \\end{cases}$ có miền nghiệm là tam giác $OAB$ với $A$ nằm trên trục $Ox$. Tìm hoành độ của điểm $A$.","answer":"4","explain":"Trên trục $Ox$ thì $y = 0$, thay vào $3x + 2y = 12$ được $x = 4$.","points":0.5},{"type":"short","level":"VDC","q":"Một trường học cần mua vở tặng học sinh: vở loại I giá $8$ nghìn đồng một quyển, vở loại II giá $12$ nghìn đồng một quyển; cần mua ít nhất $100$ quyển; số tiền không quá $1000$ nghìn đồng; số vở mỗi loại không âm. Nếu trường mua $50$ quyển loại I thì mua được tối đa bao nhiêu quyển loại II?","answer":"50","explain":"Điều kiện: $x + y \\ge 100$ và $8x + 12y \\le 1000$. Với $x = 50$: $y \\ge 50$ và $400 + 12y \\le 1000 \\Leftrightarrow y \\le 50$. Vậy tối đa $50$ quyển loại II.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Hệ $\\begin{cases} x + 2y \\le 6 \\\\ 3x - y \\ge 2 \\\\ x \\ge 0 \\end{cases}$ là hệ gồm mấy ẩn?","options":["A. $1$","B. $2$","C. $3$","D. $4$"],"answer":"B","explain":"Hệ gồm hai ẩn $x, y$.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(1; 1)$ KHÔNG là nghiệm của hệ nào sau đây?","options":["A. $\\begin{cases} x + y \\le 2 \\\\ x \\ge 0 \\end{cases}$","B. $\\begin{cases} x - y \\ge 1 \\\\ y \\ge 0 \\end{cases}$","C. $\\begin{cases} 2x \\le 3 \\\\ 2y \\le 3 \\end{cases}$","D. $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\end{cases}$"],"answer":"B","explain":"Thay $(1; 1)$: B có $0 \\ge 1$ sai nên không là nghiệm. A: $2 \\le 2$ là nghiệm; C: $2 \\le 3$ là nghiệm; D là nghiệm.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của hệ $\\begin{cases} y \\le x \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$ là","options":["A. miền góc $45^\\circ$ trong góc phần tư thứ nhất, kể cả biên","B. một tam giác","C. một nửa mặt phẳng","D. một hình vuông"],"answer":"A","explain":"Điều kiện $0 \\le y \\le x$ cho miền góc $45^\\circ$ nằm trong góc phần tư thứ nhất, kể cả biên (dấu $\\le, \\ge$).","points":0.25},{"type":"mcq","level":"TH","q":"Hệ nào sau đây có miền nghiệm là một điểm duy nhất?","options":["A. $\\begin{cases} x \\le 1 \\\\ x \\ge 1 \\\\ y \\le 2 \\\\ y \\ge 2 \\end{cases}$","B. $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\end{cases}$","C. $\\begin{cases} x + y \\le 1 \\end{cases}$","D. $\\begin{cases} x \\le 2 \\\\ y \\le 2 \\end{cases}$"],"answer":"A","explain":"Hệ A cho $x = 1, y = 2$ nên miền nghiệm chỉ gồm điểm $(1; 2)$.","points":0.25},{"type":"mcq","level":"VD","q":"Tìm giá trị lớn nhất của $F(x; y) = 6x + 5y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + 2y \\le 10 \\end{cases}$.","options":["A. $25$","B. $50$","C. $60$","D. $110$"],"answer":"C","explain":"Các đỉnh: $(0;0), (10;0), (0;5)$. $F$: $0; 60; 25$. Giá trị lớn nhất là $60$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hệ $\\begin{cases} x + 2y \\le 6 \\\\ 2x + y \\le 6 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Giá trị lớn nhất của $F(x; y) = 3x + 4y$ trên miền nghiệm của hệ là","options":["A. $12$","B. $13$","C. $14$","D. $18$"],"answer":"C","explain":"Các đỉnh: $(0;0), (3;0), (2;2), (0;3)$ (giao hai đường biên: $x = 2, y = 2$). $F$: $0; 9; 14; 12$. Giá trị lớn nhất là $14$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Miền nghiệm của hệ $\\begin{cases} x \\ge 1 \\end{cases}$ là nửa mặt phẳng bên phải đường thẳng $x = 1$, kể cả bờ.","b) Điểm $(1; 100)$ thuộc miền nghiệm của hệ ở câu a.","c) Hệ $\\begin{cases} x + y \\le 2 \\\\ x + y \\ge 2 \\end{cases}$ có miền nghiệm là đường thẳng $x + y = 2$.","d) Nghiệm của hệ bất phương trình bậc nhất hai ẩn là một số thực."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: $1 \\ge 1$. c) Đúng: giao của hai nửa mặt phẳng đối nhau là đường biên. d) Sai: nghiệm là một cặp số.","points":1},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} x - 2y \\le 0 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Miền nghiệm của hệ bị giới hạn (là một đa giác).","b) Cặp $(0; 0)$ là nghiệm của hệ.","c) Cặp $(2; 1)$ là nghiệm của hệ.","d) Cặp $(3; 1)$ là nghiệm của hệ."],"answer":["F","T","T","F"],"explain":"a) Sai: $x \\le 2y$ với $x, y \\ge 0$ là miền góc vô hạn. b) Đúng: $0 \\le 0$. c) Đúng: $2 \\le 2$. d) Sai: $3 \\le 2$ sai.","points":1},{"type":"short","level":"VD","q":"Tìm giá trị nhỏ nhất của $F(x; y) = x + 2y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + y \\le 3 \\end{cases}$.","answer":"0","explain":"Các đỉnh: $(0;0), (3;0), (0;3)$. $F$: $0; 3; 6$. Giá trị nhỏ nhất là $0$.","points":0.5},{"type":"short","level":"VDC","q":"Một người có $18$ triệu đồng để mua hai loại cổ phiếu: loại A giá $2$ triệu đồng một cổ phiếu, loại B giá $3$ triệu đồng một cổ phiếu; cần mua ít nhất $4$ cổ phiếu loại A; số cổ phiếu mỗi loại không âm và nguyên. Nếu người đó mua đúng $4$ cổ phiếu loại A thì mua được tối đa bao nhiêu cổ phiếu loại B?","answer":"3","explain":"Điều kiện: $2 \\cdot 4 + 3y \\le 18 \\Leftrightarrow 3y \\le 10 \\Leftrightarrow y \\le 3$ (vì $y$ nguyên). Vậy tối đa $3$ cổ phiếu loại B.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Hệ bất phương trình bậc nhất hai ẩn khác bất phương trình bậc nhất hai ẩn ở điểm nào?","options":["A. Hệ gồm hai hay nhiều bất phương trình","B. Hệ chỉ có một ẩn","C. Hệ không có miền nghiệm","D. Hệ luôn vô nghiệm"],"answer":"A","explain":"Hệ bất phương trình bậc nhất hai ẩn là một hệ gồm hai hay nhiều bất phương trình bậc nhất hai ẩn $x, y$.","points":0.25},{"type":"mcq","level":"NB","q":"Cặp $(2; 2)$ là nghiệm của hệ nào sau đây?","options":["A. $\\begin{cases} x + y \\le 3 \\\\ x \\ge 0 \\end{cases}$","B. $\\begin{cases} x - y \\le 0 \\\\ x + y \\le 4 \\end{cases}$","C. $\\begin{cases} 2x \\ge 5 \\\\ y \\ge 0 \\end{cases}$","D. $\\begin{cases} y \\le 1 \\\\ x \\ge 0 \\end{cases}$"],"answer":"B","explain":"Thay $(2; 2)$: A: $4 \\le 3$ sai; B: $0 \\le 0$ đúng và $4 \\le 4$ đúng; C: $4 \\ge 5$ sai; D: $2 \\le 1$ sai.","points":0.25},{"type":"mcq","level":"TH","q":"Miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ y \\le -x + 4 \\end{cases}$ là tam giác có diện tích bằng","options":["A. $4$","B. $8$","C. $12$","D. $16$"],"answer":"B","explain":"Tam giác vuông với hai cạnh góc vuông bằng $4$ nên diện tích bằng $\\frac{1}{2} \\cdot 4 \\cdot 4 = 8$.","points":0.25},{"type":"mcq","level":"TH","q":"Điểm nào sau đây là giao điểm của hai đường biên $x + y = 3$ và $2x - y = 3$?","options":["A. $(1; 2)$","B. $(2; 1)$","C. $(3; 0)$","D. $(0; 3)$"],"answer":"B","explain":"Giải hệ: cộng hai phương trình được $3x = 6 \\Rightarrow x = 2, y = 1$.","points":0.25},{"type":"mcq","level":"VD","q":"Tìm giá trị lớn nhất của $F(x; y) = 2x + 7y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 3x + 2y \\le 12 \\end{cases}$.","options":["A. $8$","B. $24$","C. $42$","D. $84$"],"answer":"C","explain":"Các đỉnh: $(0;0), (4;0), (0;6)$. $F$: $0; 8; 42$. Giá trị lớn nhất là $42$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hệ $\\begin{cases} 4x + y \\le 12 \\\\ x + 3y \\le 9 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Giá trị lớn nhất của $F(x; y) = 5x + 4y$ trên miền nghiệm của hệ là","options":["A. $15$","B. $18$","C. $21$","D. $24$"],"answer":"C","explain":"Giao hai đường biên: $x = \\frac{27}{11}, y = \\frac{24}{11}$. Các đỉnh: $(0;0), (3;0), \\left(\\frac{27}{11}; \\frac{24}{11}\\right), (0;3)$. $F$: $0; 15; 21; 12$. Giá trị lớn nhất là $21$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Để tìm miền nghiệm của hệ, ta tìm giao của các miền nghiệm thành phần.","b) Phần mặt phẳng bị gạch bỏ trong hình vẽ là phần không thỏa mãn ít nhất một bất phương trình.","c) Hệ $\\begin{cases} x \\le 0 \\\\ y \\le 0 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$ có nghiệm duy nhất $(0; 0)$.","d) Mọi hệ bất phương trình bậc nhất hai ẩn đều có nghiệm."],"answer":["T","T","T","F"],"explain":"a) Đúng theo định nghĩa. b) Đúng: gạch bỏ phần vi phạm. c) Đúng: $x = 0, y = 0$. d) Sai: có hệ vô nghiệm.","points":1},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} x + 3y \\le 9 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Miền nghiệm là tam giác $OAB$ với $A(9; 0), B(0; 3)$, kể cả ba cạnh.","b) Cặp $(9; 0)$ là nghiệm của hệ.","c) Giá trị lớn nhất của $F(x; y) = x + y$ trên miền nghiệm là $9$.","d) Điểm $(3; 3)$ thuộc miền nghiệm của hệ."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: $9 \\le 9$. c) Đúng: $F$ tại các đỉnh là $0, 9, 3$. d) Sai: $3 + 9 = 12 \\le 9$ sai.","points":1},{"type":"short","level":"VD","q":"Tìm giá trị lớn nhất của $F(x; y) = 5x + 3y$ trên miền nghiệm của hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ x + y \\le 4 \\end{cases}$.","answer":"20","explain":"Các đỉnh: $(0;0), (4;0), (0;4)$. $F$: $0; 20; 12$. Giá trị lớn nhất là $20$.","points":0.5},{"type":"short","level":"VDC","q":"Một đội xe có hai loại xe: loại $4$ chỗ và loại $7$ chỗ; cần chở ít nhất $40$ người; tổng số xe không quá $8$; số xe mỗi loại không âm và nguyên. Nếu đội dùng $5$ xe loại $4$ chỗ thì cần ít nhất bao nhiêu xe loại $7$ chỗ?","answer":"3","explain":"Cần $4 \\cdot 5 + 7y \\ge 40 \\Leftrightarrow 7y \\ge 20 \\Leftrightarrow y \\ge 3$ (vì $y$ nguyên), và $5 + y \\le 8$ thỏa mãn với $y = 3$. Vậy cần ít nhất $3$ xe loại $7$ chỗ.","points":0.5}]}]}</script>
