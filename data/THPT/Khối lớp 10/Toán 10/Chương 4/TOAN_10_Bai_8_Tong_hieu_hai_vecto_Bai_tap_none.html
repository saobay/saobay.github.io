"B. $\\overrightarrow{CA}$","C. $\\overrightarrow{BD}$","D. $\\overrightarrow{DB}$"],"answer":"A","explain":"Theo quy tắc hình bình hành: $\\overrightarrow{AB} + \\overrightarrow{AD} = \\overrightarrow{AC}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho tam giác $ABC$. Tổng $\\overrightarrow{CB} + \\overrightarrow{BA}$ bằng","options":["A. $\\overrightarrow{CA}$","B. $\\overrightarrow{AC}$","C. $\\overrightarrow{CB}$","D. $\\vec{0}$"],"answer":"A","explain":"Theo quy tắc ba điểm: $\\overrightarrow{CB} + \\overrightarrow{BA} = \\overrightarrow{CA}$.","points":0.25},{"type":"mcq","level":"TH","q":"Rút gọn biểu thức $\\overrightarrow{XY} - \\overrightarrow{ZY} + \\overrightarrow{ZX}$ được kết quả là","options":["A. $\\vec{0}$","B. $2\\overrightarrow{XZ}$","C. $\\overrightarrow{XY}$","D. $\\overrightarrow{ZY}$"],"answer":"A","explain":"$\\overrightarrow{XY} - \\overrightarrow{ZY} + \\overrightarrow{ZX} = \\overrightarrow{XY} + \\overrightarrow{YZ} + \\overrightarrow{ZX} = \\vec{0}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình bình hành $ABCD$. Hiệu $\\overrightarrow{DA} - \\overrightarrow{DB}$ bằng","options":["A. $\\overrightarrow{BA}$","B. $\\overrightarrow{AB}$","C. $\\overrightarrow{BD}$","D. $\\overrightarrow{DA}$"],"answer":"A","explain":"Theo quy tắc trừ (chung điểm đầu $D$): $\\overrightarrow{DA} - \\overrightarrow{DB} = \\overrightarrow{BA}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho bốn điểm phân biệt $A, B, C, D$ thỏa mãn $\\overrightarrow{AB} + \\overrightarrow{AD} = \\overrightarrow{AC}$. Tứ giác $ABCD$ là hình gì?","options":["A. Hình bình hành","B. Hình thang","C. Hình chữ nhật","D. Tứ giác lồi bất kì"],"answer":"A","explain":"Theo quy tắc hình bình hành, $\\overrightarrow{AB} + \\overrightarrow{AD} = \\overrightarrow{AC}$ khi và chỉ khi $ABCD$ là hình bình hành.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\overrightarrow{AB} + \\overrightarrow{BC} = \\overrightarrow{AC}$.","b) $\\overrightarrow{BA} + \\overrightarrow{CB} = \\overrightarrow{CA}$.","c) $\\overrightarrow{AB} - \\overrightarrow{BC} = \\overrightarrow{AC}$.","d) $\\overrightarrow{CA} + \\overrightarrow{AB} = \\overrightarrow{CB}$."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng: $\\overrightarrow{BC} + \\overrightarrow{CA}$... kiểm tra: $\\overrightarrow{BA} + \\overrightarrow{CB} = \\overrightarrow{CA}$ đúng theo quy tắc ba điểm. c) Sai. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Cho hình bình hành $ABCD$ tâm $O$, $M$ là điểm tùy ý. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\overrightarrow{MA} + \\overrightarrow{MC} = 2\\overrightarrow{MO}$.","b) $\\overrightarrow{MB} + \\overrightarrow{MD} = 2\\overrightarrow{MO}$.","c) $\\overrightarrow{MA} + \\overrightarrow{MB} + \\overrightarrow{MC} + \\overrightarrow{MD} = 4\\overrightarrow{MO}$.","d) $\\overrightarrow{AB} + \\overrightarrow{BC} = \\overrightarrow{BD}$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $O$ là trung điểm $AC$. b) Đúng: $O$ là trung điểm $BD$. c) Đúng: cộng hai đẳng thức trên. d) Sai: $\\overrightarrow{AB} + \\overrightarrow{BC} = \\overrightarrow{AC}$.","points":1},{"type":"short","level":"VD","q":"Cho tam giác $ABC$, $D$ là trung điểm của $BC$. Biết $AB = 8$, $AC = 6$, $\\widehat{A} = 90^\\circ$. Tính $|\\overrightarrow{AD}|$.","answer":"5","explain":"$BC = 10$; $AD$ là trung tuyến ứng với cạnh huyền nên $AD = 5$.","points":0.5},{"type":"short","level":"VDC","q":"Cho $|\\vec{a}| = 5$, $|\\vec{b}| = 12$, $|\\vec{a} + \\vec{b}| = 13$. Tính $|\\vec{a} - \\vec{b}|$.","answer":"13","explain":"$|\\vec{a} + \\vec{b}|^2 + |\\vec{a} - \\vec{b}|^2 = 2(|\\vec{a}|^2 + |\\vec{b}|^2) = 338$, suy ra $|\\vec{a} - \\vec{b}|^2 = 169$, vậy $|\\vec{a} - \\vec{b}| = 13$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"$\\overrightarrow{AB} - \\overrightarrow{AC} = \\overrightarrow{CB}$ được gọi là","options":["A. quy tắc trừ","B. quy tắc ba điểm","C. quy tắc hình bình hành","D. quy tắc trung điểm"],"answer":"A","explain":"Đây là quy tắc trừ hai vectơ chung điểm đầu.","points":0.25},{"type":"mcq","level":"NB","q":"$I$ là trung điểm của $AB$ thì","options":["A. $\\overrightarrow{IA} + \\overrightarrow{IB} = \\vec{0}$","B. $\\overrightarrow{IA} + \\overrightarrow{IB} = \\overrightarrow{AB}$","C. $\\overrightarrow{IA} = \\overrightarrow{IB}$","D. $\\overrightarrow{AB} = \\vec{0}$"],"answer":"A","explain":"$I$ là trung điểm $AB$ khi và chỉ khi $\\overrightarrow{IA} + \\overrightarrow{IB} = \\vec{0}$.","points":0.25},{"type":"mcq","level":"TH","q":"Rút gọn biểu thức $\\overrightarrow{AB} + \\overrightarrow{BC} + \\overrightarrow{CD} + \\overrightarrow{DE}$ được kết quả là","options":["A. $\\overrightarrow{AE}$","B. $\\overrightarrow{AD}$","C. $\\overrightarrow{BE}$","D. $\\vec{0}$"],"answer":"A","explain":"Quy tắc ba điểm mở rộng: tổng bằng $\\overrightarrow{AE}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình bình hành $ABCD$. Tổng $\\overrightarrow{CD} + \\overrightarrow{CB}$ bằng","options":["A. $\\overrightarrow{CA}$","B. $\\overrightarrow{AC}$","C. $\\overrightarrow{BD}$","D. $\\vec{0}$"],"answer":"A","explain":"Quy tắc hình bình hành tại đỉnh $C$: $\\overrightarrow{CD} + \\overrightarrow{CB} = \\overrightarrow{CA}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho tam giác $ABC$, $N$ là trung điểm của $AC$. Tổng $\\overrightarrow{BA} + \\overrightarrow{BC}$ bằng","options":["A. $2\\overrightarrow{BN}$","B. $\\overrightarrow{BN}$","C. $2\\overrightarrow{BM}$ ($M$ là trung điểm $AB$)","D. $\\vec{0}$"],"answer":"A","explain":"Với $N$ là trung điểm $AC$: $\\overrightarrow{BA} + \\overrightarrow{BC} = 2\\overrightarrow{BN}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho điểm $M$ thỏa mãn $\\overrightarrow{MA} + \\overrightarrow{MB} = 2\\overrightarrow{MC}$. Khẳng định nào sau đây đúng?","options":["A. $C$ là trung điểm của $AB$","B. $M$ là trung điểm của $AB$","C. $A$ là trung điểm của $BC$","D. $M$ trùng $C$"],"answer":"A","explain":"Gọi $I$ là trung điểm $AB$: $\\overrightarrow{MA} + \\overrightarrow{MB} = 2\\overrightarrow{MI} = 2\\overrightarrow{MC} \\Rightarrow I \\equiv C$, tức $C$ là trung điểm $AB$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\overrightarrow{AB} + \\overrightarrow{BC} + \\overrightarrow{CA} = \\vec{0}$.","b) $\\overrightarrow{AB} - \\overrightarrow{AC} - \\overrightarrow{CB} = \\vec{0}$.","c) $\\overrightarrow{PQ} + \\overrightarrow{QP} = \\vec{0}$.","d) $\\overrightarrow{AB} + \\overrightarrow{CD} = \\overrightarrow{AC} + \\overrightarrow{BD}$."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: $\\overrightarrow{CB} - \\overrightarrow{CB} = \\vec{0}$. c) Đúng. d) Sai: vế phải bằng $\\overrightarrow{AB} + \\overrightarrow{BC} + \\overrightarrow{CD} + \\overrightarrow{DA}$... kiểm tra: $\\overrightarrow{AC} + \\overrightarrow{BD} = \\overrightarrow{AB} + \\overrightarrow{BC} + \\overrightarrow{BC} + \\overrightarrow{CD} \\ne$ vế trái nói chung.","points":1},{"type":"truefalse","level":"TH","q":"Cho tam giác đều $ABC$ cạnh $a$, $M$ là trung điểm của $BC$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\overrightarrow{AB} + \\overrightarrow{AC} = 2\\overrightarrow{AM}$.","b) $|\\overrightarrow{AM}| = \\frac{a\\sqrt{3}}{2}$.","c) $\\overrightarrow{MB} + \\overrightarrow{MC} = \\vec{0}$.","d) $\\overrightarrow{AB} + \\overrightarrow{BA} = 2\\overrightarrow{AB}$."],"answer":["T","T","T","F"],"explain":"a) Đúng: quy tắc trung điểm. b) Đúng. c) Đúng. d) Sai: bằng $\\vec{0}$.","points":1},{"type":"short","level":"VD","q":"Cho hình chữ nhật $ABCD$ có $AB = 9$, $AD = 12$. Tính $|\\overrightarrow{AB} + \\overrightarrow{BC}|$.","answer":"15","explain":"$\\overrightarrow{AB} + \\overrightarrow{BC} = \\overrightarrow{AC}$ nên độ dài bằng $AC = 15$.","points":0.5},{"type":"short","level":"VDC","q":"Cho tam giác $ABC$ vuông tại $A$ có $AB = 20$, $AC = 15$. Gọi $M$ là trung điểm của $BC$. Tính $|\\overrightarrow{AM}|$.","answer":"12.5","explain":"$BC = 25$; $AM$ là trung tuyến ứng với cạnh huyền nên $AM = 12{,}5$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Phép cộng vectơ có tính chất nào sau đây?","options":["A. Tính giao hoán: $\\vec{a} + \\vec{b} = \\vec{b} + \\vec{a}$","B. Tính phản giao hoán: $\\vec{a} + \\vec{b} = -(\\vec{b} + \\vec{a})$","C. Không có tính chất nào","D. $\\vec{a} + \\vec{b} = \\vec{0}$ với mọi $\\vec{a}, \\vec{b}$"],"answer":"A","explain":"Phép cộng vectơ có tính giao hoán (và kết hợp).","points":0.25},{"type":"mcq","level":"NB","q":"$\\vec{a} + (-\\vec{a})$ bằng","options":["A. $\\vec{0}$","B. $2\\vec{a}$","C. $\\vec{a}$","D. $-\\vec{a}$"],"answer":"A","explain":"Tổng của một vectơ với vectơ đối của nó bằng vectơ-không.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình bình hành $ABCD$. Tổng $\\overrightarrow{AD} + \\overrightarrow{AB}$ bằng","options":["A. $\\overrightarrow{AC}$","B. $\\overrightarrow{CA}$","C. $\\overrightarrow{BD}$","D. $\\overrightarrow{DB}$"],"answer":"A","explain":"Theo quy tắc hình bình hành: $\\overrightarrow{AD} + \\overrightarrow{AB} = \\overrightarrow{AC}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $O$ là tâm của hình bình hành $ABCD$. Tổng $\\overrightarrow{OA} + \\overrightarrow{OC}$ bằng","options":["A. $\\vec{0}$","B. $\\overrightarrow{AC}$","C. $2\\overrightarrow{OA}$","D. $\\overrightarrow{CA}$"],"answer":"A","explain":"$\\overrightarrow{OC} = -\\overrightarrow{OA}$ nên tổng bằng $\\vec{0}$.","points":0.25},{"type":"mcq","level":"VD","q":"Rút gọn biểu thức $\\overrightarrow{AB} - \\overrightarrow{DC} + \\overrightarrow{BC}$ được kết quả là","options":["A. $\\overrightarrow{AD}$","B. $\\overrightarrow{AC}$","C. $\\overrightarrow{BD}$","D. $\\vec{0}$"],"answer":"A","explain":"$\\overrightarrow{AB} - \\overrightarrow{DC} + \\overrightarrow{BC} = \\overrightarrow{AB} + \\overrightarrow{BC} + \\overrightarrow{CD} = \\overrightarrow{AD}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tam giác $ABC$, điểm $D$ thỏa mãn $\\overrightarrow{DA} + \\overrightarrow{DB} + \\overrightarrow{DC} = \\vec{0}$. Điểm $D$ là","options":["A. trọng tâm của tam giác $ABC$","B. trực tâm của tam giác $ABC$","C. tâm đường tròn ngoại tiếp tam giác $ABC$","D. trung điểm của $BC$"],"answer":"A","explain":"Điểm $D$ thỏa mãn tổng ba vectơ bằng $\\vec{0}$ chính là trọng tâm của tam giác $ABC$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\overrightarrow{AB} + \\overrightarrow{BC} = \\overrightarrow{AC}$.","b) $\\overrightarrow{AB} - \\overrightarrow{BC} = \\overrightarrow{AC}$.","c) $-\\overrightarrow{AB} = \\overrightarrow{BA}$.","d) $\\overrightarrow{AB} + \\overrightarrow{BA} = \\vec{0}$."],"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai. c) Đúng. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Cho hình bình hành $ABCD$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\overrightarrow{AB} - \\overrightarrow{AD} = \\overrightarrow{DB}$.","b) $\\overrightarrow{CB} - \\overrightarrow{CD} = \\overrightarrow{DB}$.","c) $\\overrightarrow{AC} - \\overrightarrow{AD} = \\overrightarrow{DC}$.","d) $\\overrightarrow{BD} - \\overrightarrow{BC} = \\overrightarrow{DC}$."],"answer":["T","T","T","F"],"explain":"a) Đúng: quy tắc trừ. b) Đúng: chung điểm đầu $C$, $\\overrightarrow{CB} - \\overrightarrow{CD} = \\overrightarrow{DB}$. c) Đúng: $\\overrightarrow{AC} - \\overrightarrow{AD} = \\overrightarrow{DC}$. d) Sai: $\\overrightarrow{BD} - \\overrightarrow{BC} = \\overrightarrow{CD}$.","points":1},{"type":"short","level":"VD","q":"Cho $|\\overrightarrow{AB}| = 10$, $|\\overrightarrow{BC}| = 24$, góc $ABC = 90^\\circ$. Tính $|\\overrightarrow{AB} + \\overrightarrow{BC}|$.","answer":"26","explain":"$|\\overrightarrow{AB} + \\overrightarrow{BC}| = |\\overrightarrow{AC}| = \\sqrt{100 + 576} = 26$.","points":0.5},{"type":"short","level":"VDC","q":"Cho tam giác đều $ABC$ cạnh $6$, $M$ là trung điểm của $BC$. Tính $|\\overrightarrow{AM}|^2$.","answer":"27","explain":"$|\\overrightarrow{AM}|^2 = AM^2 = 36 - 9 = 27$.","points":0.5}]}]}</script>
