B. $\\overrightarrow{AD} = \\overrightarrow{BC}$","C. $\\overrightarrow{AC} = \\overrightarrow{BD}$","D. $\\overrightarrow{OA} = \\overrightarrow{CO}$ (với $O$ là tâm)"],"answer":"C","explain":"Hai đường chéo $AC, BD$ không cùng phương nên $\\overrightarrow{AC} \\ne \\overrightarrow{BD}$. Các khẳng định còn lại đều đúng.","points":0.25},{"type":"mcq","level":"VD","q":"Cho tam giác $ABC$, $M$ là trung điểm của $BC$. Vectơ nào sau đây bằng vectơ $\\overrightarrow{CM}$?","options":["A. $\\overrightarrow{MB}$","B. $\\overrightarrow{MC}$","C. $\\overrightarrow{BC}$","D. $\\overrightarrow{BM}$"],"answer":"A","explain":"$\\overrightarrow{CM}$ (từ $C$ đến $M$) và $\\overrightarrow{MB}$ (từ $M$ đến $B$) cùng hướng, cùng độ dài nên bằng nhau.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình vuông $ABCD$ cạnh $a$. Giá trị của $|\\overrightarrow{AC}|$ bằng","options":["A. $a\\sqrt{2}$","B. $a$","C. $2a$","D. $a\\sqrt{3}$"],"answer":"A","explain":"$|\\overrightarrow{AC}| = AC = a\\sqrt{2}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vectơ có hai yếu tố: độ dài và hướng.","b) Đoạn thẳng $AB$ và vectơ $\\overrightarrow{AB}$ là một.","c) $|\\overrightarrow{AB}| \\ge 0$.","d) Nếu $|\\vec{a}| = |\\vec{b}|$ thì $\\vec{a} = \\vec{b}$."],"answer":["T","F","T","F"],"explain":"a) Đúng. b) Sai: đoạn thẳng không có hướng. c) Đúng. d) Sai: còn phải cùng hướng.","points":1},{"type":"truefalse","level":"TH","q":"Cho bốn điểm $A, B, C, D$ tạo thành hình bình hành $ABCD$ (theo thứ tự). Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\overrightarrow{AB} = \\overrightarrow{DC}$.","b) $\\overrightarrow{BA} = \\overrightarrow{CD}$.","c) $\\overrightarrow{AD}$ và $\\overrightarrow{CB}$ đối nhau.","d) $\\overrightarrow{AC}$ và $\\overrightarrow{CA}$ bằng nhau."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: cùng ngược hướng với $\\overrightarrow{AB}$. c) Đúng. d) Sai: đối nhau.","points":1},{"type":"short","level":"VD","q":"Cho hình thoi $ABCD$ cạnh $5$. Tính $|\\overrightarrow{AB}|$.","answer":"5","explain":"$|\\overrightarrow{AB}| = AB = 5$.","points":0.5},{"type":"short","level":"VDC","q":"Cho hình vuông $ABCD$ cạnh $6$. Tính $|\\overrightarrow{BD}|^2$.","answer":"72","explain":"$|\\overrightarrow{BD}|^2 = BD^2 = 36 + 36 = 72$.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Kí hiệu $|\\vec{a}|$ là","options":["A. độ dài của vectơ $\\vec{a}$","B. hướng của vectơ $\\vec{a}$","C. giá của vectơ $\\vec{a}$","D. điểm đầu của vectơ $\\vec{a}$"],"answer":"A","explain":"$|\\vec{a}|$ là độ dài của vectơ $\\vec{a}$.","points":0.25},{"type":"mcq","level":"NB","q":"Vectơ $\\overrightarrow{AB}$ và vectơ $\\overrightarrow{CD}$ bằng nhau khi","options":["A. chúng cùng hướng và cùng độ dài","B. $A$ trùng $C$ và $B$ trùng $D$","C. $AB = CD$","D. $A, B, C, D$ thẳng hàng"],"answer":"A","explain":"Hai vectơ bằng nhau khi cùng hướng và cùng độ dài, không cần chung điểm.","points":0.25},{"type":"mcq","level":"TH","q":"Cho tam giác $ABC$. Vectơ $\\overrightarrow{CB}$ có điểm đầu là","options":["A. $C$","B. $B$","C. $A$","D. Trung điểm $BC$"],"answer":"A","explain":"Vectơ $\\overrightarrow{CB}$ có điểm đầu $C$, điểm cuối $B$.","points":0.25},{"type":"mcq","level":"TH","q":"Khẳng định nào sau đây đúng về vectơ-không?","options":["A. Cùng phương với mọi vectơ","B. Có độ dài bằng $1$","C. Không cùng hướng với vectơ nào","D. Chỉ cùng phương với chính nó"],"answer":"A","explain":"Theo quy ước, vectơ-không cùng phương và cùng hướng với mọi vectơ.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình chữ nhật $ABCD$ có $AB = 3$, $BC = 4$. Giá trị của $|\\overrightarrow{BD}|$ bằng","options":["A. $5$","B. $7$","C. $25$","D. $\\sqrt{7}$"],"answer":"A","explain":"$|\\overrightarrow{BD}| = BD = \\sqrt{9 + 16} = 5$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho lục giác đều $ABCDEF$ tâm $O$ cạnh $a$. Giá trị của $|\\overrightarrow{AD}|$ bằng","options":["A. $a$","B. $2a$","C. $a\\sqrt{3}$","D. $3a$"],"answer":"B","explain":"$AD$ là đường chéo chính của lục giác đều, $AD = 2a$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\overrightarrow{AB}$ có hướng từ $A$ đến $B$.","b) Độ dài của vectơ là một số không âm.","c) Vectơ-không được kí hiệu là $\\vec{0}$.","d) Hai vectơ bằng nhau phải có chung điểm đầu."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: hai vectơ bằng nhau không cần chung điểm đầu.","points":1},{"type":"truefalse","level":"TH","q":"Cho đoạn thẳng $AB$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Có vô số vectơ bằng $\\overrightarrow{AB}$.","b) Có duy nhất một vectơ bằng $\\overrightarrow{AB}$ mà có điểm đầu là $A$.","c) $-\\overrightarrow{AB} = \\overrightarrow{BA}$.","d) $\\overrightarrow{AB} = \\overrightarrow{BA}$."],"answer":["T","T","T","F"],"explain":"a) Đúng: tịnh tiến $\\overrightarrow{AB}$ đi khắp mặt phẳng. b) Đúng: chính là $\\overrightarrow{AB}$. c) Đúng. d) Sai (khi $A \\ne B$).","points":1},{"type":"short","level":"VD","q":"Cho hai điểm phân biệt $A, B$. Có bao nhiêu vectơ-không có điểm đầu và điểm cuối là $A$ hoặc $B$?","answer":"2","explain":"Các vectơ-không là $\\overrightarrow{AA}$ và $\\overrightarrow{BB}$: có $2$ vectơ.","points":0.5},{"type":"short","level":"VDC","q":"Cho tam giác $ABC$ vuông cân tại $A$ có $AB = 4$. Tính $|\\overrightarrow{BC}|^2$.","answer":"32","explain":"$|\\overrightarrow{BC}|^2 = BC^2 = 16 + 16 = 32$.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Điểm cuối của vectơ $\\overrightarrow{AB}$ là","options":["A. $B$","B. $A$","C. Trung điểm $AB$","D. Không xác định"],"answer":"A","explain":"Vectơ $\\overrightarrow{AB}$ có điểm đầu $A$, điểm cuối $B$.","points":0.25},{"type":"mcq","level":"NB","q":"Hai vectơ cùng hướng thì","options":["A. cùng phương","B. bằng nhau","C. đối nhau","D. cùng độ dài"],"answer":"A","explain":"Hai vectơ cùng hướng thì cùng phương (cùng hướng là trường hợp riêng của cùng phương).","points":0.25},{"type":"mcq","level":"TH","q":"Cho $A, B, C$ thẳng hàng, $B$ nằm giữa $A$ và $C$. Hai vectơ $\\overrightarrow{AB}$ và $\\overrightarrow{BC}$ có quan hệ","options":["A. cùng hướng","B. ngược hướng","C. không cùng phương","D. bằng nhau"],"answer":"A","explain":"$B$ nằm giữa $A$ và $C$ nên $\\overrightarrow{AB}$ và $\\overrightarrow{BC}$ cùng chỉ về một phía, tức cùng hướng.","points":0.25},{"type":"mcq","level":"TH","q":"Vectơ nào sau đây là vectơ-không?","options":["A. $\\overrightarrow{AA}$","B. $\\overrightarrow{AB}$","C. $\\overrightarrow{BA}$","D. Số $0$"],"answer":"A","explain":"$\\overrightarrow{AA}$ có điểm đầu trùng điểm cuối nên là vectơ-không.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình bình hành $ABCD$. Khẳng định nào sau đây đúng?","options":["A. $\\overrightarrow{AB} = \\overrightarrow{CD}$","B. $\\overrightarrow{AD} = \\overrightarrow{CB}$","C. $\\overrightarrow{BA} = \\overrightarrow{DC}$","D. $\\overrightarrow{AC} = \\overrightarrow{DB}$"],"answer":"C","explain":"$\\overrightarrow{BA}$ và $\\overrightarrow{DC}$ cùng hướng, cùng độ dài nên bằng nhau. A, B sai (ngược hướng); D sai (không cùng phương).","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tam giác $ABC$, $M, N$ lần lượt là trung điểm của $AB, AC$. Biết $BC = 10$. Giá trị của $|\\overrightarrow{MN}|$ bằng","options":["A. $5$","B. $10$","C. $20$","D. $2{,}5$"],"answer":"A","explain":"$MN$ là đường trung bình nên $MN = \\frac{BC}{2} = 5$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $|\\overrightarrow{AB}| = AB$.","b) $\\overrightarrow{AB} = -\\overrightarrow{BA}$.","c) Nếu $A, B, C$ thẳng hàng thì $\\overrightarrow{AB}, \\overrightarrow{AC}$ cùng phương.","d) Vectơ-không có hướng xác định."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: giá trùng nhau. d) Sai: vectơ-không quy ước cùng hướng với mọi vectơ, không có hướng xác định riêng.","points":1},{"type":"truefalse","level":"TH","q":"Cho hình vuông $ABCD$ tâm $O$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\overrightarrow{AB} = \\overrightarrow{DC}$.","b) $\\overrightarrow{AO} = \\overrightarrow{OC}$.","c) $\\overrightarrow{AC}$ và $\\overrightarrow{BD}$ cùng phương.","d) $\\overrightarrow{AB}$ và $\\overrightarrow{AD}$ không cùng phương."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: hai đường chéo vuông góc. d) Đúng: hai cạnh kề vuông góc.","points":1},{"type":"short","level":"VD","q":"Cho tam giác $ABC$ có $AB = 9$. Tính $|\\overrightarrow{AB}| + |\\overrightarrow{BA}|$.","answer":"18","explain":"$|\\overrightarrow{AB}| + |\\overrightarrow{BA}| = 9 + 9 = 18$.","points":0.5},{"type":"short","level":"VDC","q":"Cho bốn điểm phân biệt $A, B, C, D$ thẳng hàng theo thứ tự đó. Có bao nhiêu cặp vectơ đối nhau có điểm đầu và điểm cuối là các điểm đã cho?","answer":"6","explain":"Các cặp đối nhau: $(\\overrightarrow{AB}, \\overrightarrow{BA})$, $(\\overrightarrow{AC}, \\overrightarrow{CA})$, $(\\overrightarrow{AD}, \\overrightarrow{DA})$, $(\\overrightarrow{BC}, \\overrightarrow{CB})$, $(\\overrightarrow{BD}, \\overrightarrow{DB})$, $(\\overrightarrow{CD}, \\overrightarrow{DC})$: có $6$ cặp.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Vectơ $\\overrightarrow{AB}$ ngược hướng với vectơ nào sau đây?","options":["A. $\\overrightarrow{BA}$","B. $\\overrightarrow{AB}$","C. $\\overrightarrow{AA}$","D. $\\overrightarrow{BB}$"],"answer":"A","explain":"Đổi thứ tự điểm đầu, điểm cuối thì vectơ đổi hướng: $\\overrightarrow{BA}$ ngược hướng $\\overrightarrow{AB}$.","points":0.25},{"type":"mcq","level":"NB","q":"$|\\vec{0}|$ bằng","options":["A. $0$","B. $1$","C. $-1$","D. Không xác định"],"answer":"A","explain":"Độ dài của vectơ-không bằng $0$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho tam giác $ABC$ đều. Hai vectơ $\\overrightarrow{AB}$ và $\\overrightarrow{BC}$ có quan hệ","options":["A. không cùng phương","B. cùng hướng","C. ngược hướng","D. bằng nhau"],"answer":"A","explain":"$\\overrightarrow{AB}$ nằm trên cạnh $AB$, $\\overrightarrow{BC}$ nằm trên cạnh $BC$; hai cạnh này cắt nhau tại $B$ nên hai vectơ không cùng phương.","points":0.25},{"type":"mcq","level":"TH","q":"Cho ba điểm phân biệt $A, B, C$. Có bao nhiêu vectơ khác $\\vec{0}$ có điểm đầu và điểm cuối là các điểm này?","options":["A. $6$","B. $3$","C. $9$","D. $2$"],"answer":"A","explain":"Số cặp có thứ tự $(X; Y)$ với $X \\ne Y$ là $3 \\cdot 2 = 6$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình bình hành $ABCD$, $E$ là trung điểm của $AB$. Vectơ nào sau đây bằng vectơ $\\overrightarrow{AE}$?","options":["A. $\\overrightarrow{EB}$","B. $\\overrightarrow{BE}$","C. $\\overrightarrow{AB}$","D. $\\overrightarrow{BA}$"],"answer":"A","explain":"$\\overrightarrow{AE}$ và $\\overrightarrow{EB}$ cùng hướng, cùng độ dài nên bằng nhau.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tam giác $ABC$ vuông tại $A$ có $AB = 3$, $AC = 4$, $M$ là trung điểm của $BC$. Giá trị của $|\\overrightarrow{AM}|$ bằng","options":["A. $2{,}5$","B. $5$","C. $3{,}5$","D. $7$"],"answer":"A","explain":"$BC = 5$; trung tuyến ứng với cạnh huyền bằng nửa cạnh huyền nên $AM = 2{,}5$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vectơ $\\overrightarrow{AB}$ được xác định bởi hai điểm $A, B$.","b) Thứ tự hai điểm $A, B$ quyết định hướng của vectơ.","c) Đoạn thẳng $AB$ không có hướng.","d) $\\overrightarrow{AB}$ và đoạn thẳng $AB$ là một."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: đoạn thẳng không có hướng.","points":1},{"type":"truefalse","level":"TH","q":"Cho tam giác $ABC$, $M$ là trung điểm của $BC$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\overrightarrow{MB} = \\overrightarrow{MC}$.","b) $\\overrightarrow{MB}$ và $\\overrightarrow{MC}$ đối nhau.","c) $|\\overrightarrow{MB}| = |\\overrightarrow{MC}|$.","d) $\\overrightarrow{BM} = \\overrightarrow{MC}$."],"answer":["F","T","T","T"],"explain":"a) Sai: ngược hướng. b) Đúng. c) Đúng. d) Đúng: $\\overrightarrow{BM}$ (từ $B$ đến $M$) và $\\overrightarrow{MC}$ (từ $M$ đến $C$) cùng hướng, cùng độ dài.","points":1},{"type":"short","level":"VD","q":"Cho điểm $A$ và vectơ $\\vec{a} \\ne \\vec{0}$. Có bao nhiêu vectơ bằng $\\vec{a}$ mà nhận $A$ làm điểm đầu?","answer":"1","explain":"Có duy nhất một vectơ bằng $\\vec{a}$ có điểm đầu cho trước.","points":0.5},{"type":"short","level":"VDC","q":"Cho lục giác đều $ABCDEF$ tâm $O$. Có bao nhiêu vectơ khác $\\vec{0}$ có điểm đầu và điểm cuối là $O$ hoặc các đỉnh, mà cùng phương với $\\overrightarrow{AB}$?","answer":"8","explain":"Các vectơ cùng phương với $\\overrightarrow{AB}$: $\\overrightarrow{AB}, \\overrightarrow{BA}, \\overrightarrow{DE}, \\overrightarrow{ED}, \\overrightarrow{FO}, \\overrightarrow{OF}, \\overrightarrow{OC}, \\overrightarrow{CO}$: có $8$ vectơ.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Hai vectơ được gọi là cùng phương nếu","options":["A. giá của chúng song song hoặc trùng nhau","B. chúng bằng nhau","C. chúng đối nhau","D. chúng có chung điểm đầu"],"answer":"A","explain":"Hai vectơ cùng phương khi giá của chúng song song hoặc trùng nhau.","points":0.25},{"type":"mcq","level":"NB","q":"Vectơ có điểm đầu trùng với điểm cuối được gọi là","options":["A. vectơ-không","B. vectơ đơn vị","C. vectơ đối","D. vectơ bằng nhau"],"answer":"A","explain":"Vectơ có điểm đầu trùng điểm cuối gọi là vectơ-không.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình bình hành $ABCD$. Cặp vectơ nào sau đây bằng nhau?","options":["A. $\\overrightarrow{AB}$ và $\\overrightarrow{DC}$","B. $\\overrightarrow{AB}$ và $\\overrightarrow{CD}$","C. $\\overrightarrow{AD}$ và $\\overrightarrow{CB}$","D. $\\overrightarrow{AC}$ và $\\overrightarrow{BD}$"],"answer":"A","explain":"$\\overrightarrow{AB}$ và $\\overrightarrow{DC}$ cùng hướng, cùng độ dài.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $O$ là trung điểm của đoạn thẳng $AB$. Khẳng định nào sau đây đúng?","options":["A. $\\overrightarrow{OA}$ và $\\overrightarrow{OB}$ đối nhau","B. $\\overrightarrow{OA} = \\overrightarrow{OB}$","C. $\\overrightarrow{OA}$ và $\\overrightarrow{OB}$ cùng hướng","D. $|\\overrightarrow{OA}| \\ne |\\overrightarrow{OB}|$"],"answer":"A","explain":"$\\overrightarrow{OA}$ và $\\overrightarrow{OB}$ ngược hướng, cùng độ dài nên đối nhau.","points":0.25},{"type":"mcq","level":"VD","q":"Cho hình bình hành $ABCD$, $F$ là trung điểm của $CD$. Vectơ nào sau đây bằng vectơ $\\overrightarrow{CF}$?","options":["A. $\\overrightarrow{FD}$","B. $\\overrightarrow{DF}$","C. $\\overrightarrow{CD}$","D. $\\overrightarrow{DC}$"],"answer":"A","explain":"$\\overrightarrow{CF}$ và $\\overrightarrow{FD}$ cùng hướng, cùng độ dài nên bằng nhau.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tam giác $ABC$ vuông tại $A$ có $AB = 6$, $AC = 8$, $M$ là trung điểm của $BC$. Giá trị của $|\\overrightarrow{AM}|$ bằng","options":["A. $5$","B. $10$","C. $7$","D. $4$"],"answer":"A","explain":"$BC = 10$; $AM$ là trung tuyến ứng với cạnh huyền nên $AM = 5$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\vec{a} = -(-\\vec{a})$.","b) $-\\overrightarrow{AB} = \\overrightarrow{BA}$.","c) Vectơ đối của $\\vec{0}$ là chính nó.","d) Hai vectơ đối nhau thì cùng hướng."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: đối nhau thì ngược hướng.","points":1},{"type":"truefalse","level":"TH","q":"Cho hình chữ nhật $ABCD$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\overrightarrow{AB} = \\overrightarrow{DC}$.","b) $\\overrightarrow{BC} = \\overrightarrow{AD}$.","c) $\\overrightarrow{AC} = \\overrightarrow{BD}$.","d) $|\\overrightarrow{AC}| = |\\overrightarrow{BD}|$."],"answer":["T","T","F","T"],"explain":"a), b) Đúng. c) Sai: hai đường chéo không cùng phương. d) Đúng: hai đường chéo bằng nhau.","points":1},{"type":"short","level":"VD","q":"Cho đoạn thẳng $AB = 12$, $M$ là trung điểm của $AB$. Tính $|\\overrightarrow{MA}|$.","answer":"6","explain":"$|\\overrightarrow{MA}| = MA = 6$.","points":0.5},{"type":"short","level":"VDC","q":"Cho ngũ giác đều $ABCDE$ tâm $O$. Có bao nhiêu vectơ khác $\\vec{0}$ có điểm đầu là $O$ và điểm cuối là một đỉnh của ngũ giác?","answer":"5","explain":"Các vectơ $\\overrightarrow{OA}, \\overrightarrow{OB}, \\overrightarrow{OC}, \\overrightarrow{OD}, \\overrightarrow{OE}$: có $5$ vectơ.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Kí hiệu nào sau đây là vectơ đối của $\\overrightarrow{AB}$?","options":["A. $\\overrightarrow{BA}$","B. $\\overrightarrow{AB}$","C. $\\overrightarrow{AA}$","D. $\\vec{0}$"],"answer":"A","explain":"Vectơ đối của $\\overrightarrow{AB}$ là $\\overrightarrow{BA}$ (cũng kí hiệu $-\\overrightarrow{AB}$).","points":0.25},{"type":"mcq","level":"NB","q":"Độ dài của vectơ-không bằng","options":["A. $0$","B. $1$","C. $-1$","D. Không xác định"],"answer":"A","explain":"$|\\vec{0}| = 0$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hai vectơ $\\vec{a}, \\vec{b}$ cùng hướng. Khẳng định nào sau đây đúng?","options":["A. $\\vec{a}, \\vec{b}$ cùng phương","B. $\\vec{a} = \\vec{b}$","C. $\\vec{a}, \\vec{b}$ đối nhau","D. $|\\vec{a}| = |\\vec{b}|$"],"answer":"A","explain":"Cùng hướng thì cùng phương (nhưng chưa chắc bằng nhau vì có thể khác độ dài).","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình thoi $ABCD$. Khẳng định nào sau đây sai?","options":["A. $\\overrightarrow{AB} = \\overrightarrow{DC}$","B. $\\overrightarrow{AD} = \\overrightarrow{BC}$","C. $\\overrightarrow{AC} = \\overrightarrow{BD}$","D. $|\\overrightarrow{AB}| = |\\overrightarrow{AD}|$"],"answer":"C","explain":"Hai đường chéo không cùng phương nên $\\overrightarrow{AC} \\ne \\overrightarrow{BD}$. Các khẳng định còn lại đúng.","points":0.25},{"type":"mcq","level":"VD","q":"Cho đoạn thẳng $AB$, $M$ là trung điểm của $AB$. Hai vectơ $\\overrightarrow{MA}$ và $\\overrightarrow{MB}$ có quan hệ","options":["A. đối nhau","B. bằng nhau","C. cùng hướng","D. không cùng phương"],"answer":"A","explain":"$\\overrightarrow{MA}$ và $\\overrightarrow{MB}$ ngược hướng, cùng độ dài nên đối nhau.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình bình hành $ABCD$ có $AB = 6$, $AD = 8$, $\\widehat{A} = 90^\\circ$. Giá trị của $|\\overrightarrow{AC}|$ bằng","options":["A. $10$","B. $14$","C. $2\\sqrt{7}$","D. $48$"],"answer":"A","explain":"$|\\overrightarrow{AC}| = AC = \\sqrt{36 + 64} = 10$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Mọi vectơ đều có độ dài.","b) Mọi vectơ đều có hướng.","c) Vectơ-không có độ dài bằng $0$.","d) Mọi đoạn thẳng đều là vectơ."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng (vectơ-không quy ước cùng hướng với mọi vectơ). d) Sai: đoạn thẳng không có hướng.","points":1},{"type":"truefalse","level":"TH","q":"Cho tam giác $ABC$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Có $6$ vectơ khác $\\vec{0}$ có điểm đầu và điểm cuối là các điểm $A, B, C$.","b) Trong $6$ vectơ đó có $3$ cặp vectơ đối nhau.","c) $\\overrightarrow{AB} = \\overrightarrow{AC}$.","d) $|\\overrightarrow{AB}| = |\\overrightarrow{BA}|$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $3 \\cdot 2 = 6$. b) Đúng: $(\\overrightarrow{AB}, \\overrightarrow{BA})$, $(\\overrightarrow{AC}, \\overrightarrow{CA})$, $(\\overrightarrow{BC}, \\overrightarrow{CB})$. c) Sai. d) Đúng.","points":1},{"type":"short","level":"VD","q":"Cho hình bình hành $ABCD$ có $AB = 11$. Tính $|\\overrightarrow{DC}|$.","answer":"11","explain":"$|\\overrightarrow{DC}| = DC = AB = 11$.","points":0.5},{"type":"short","level":"VDC","q":"Cho tam giác đều $ABC$ cạnh $4$. Tính $|\\overrightarrow{AB}|^2 + |\\overrightarrow{AC}|^2$.","answer":"32","explain":"$16 + 16 = 32$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Vectơ $\\overrightarrow{AB}$ có điểm đầu là $A$. Điểm cuối của nó là","options":["A. $B$","B. $A$","C. Trung điểm của $AB$","D. Không xác định"],"answer":"A","explain":"Vectơ $\\overrightarrow{AB}$ có điểm đầu $A$ và điểm cuối $B$.","points":0.25},{"type":"mcq","level":"NB","q":"Hai vectơ bằng nhau thì","options":["A. cùng hướng và cùng độ dài","B. cùng độ dài","C. cùng phương","D. có chung điểm đầu"],"answer":"A","explain":"Hai vectơ bằng nhau khi cùng hướng và cùng độ dài.","points":0.25},{"type":"mcq","level":"TH","q":"Cho điểm $M$ và vectơ $\\vec{a}$. Dựng điểm $N$ sao cho $\\overrightarrow{MN} = \\vec{a}$. Điểm $N$ như thế","options":["A. tồn tại duy nhất","B. có hai điểm","C. có vô số điểm","D. không tồn tại"],"answer":"A","explain":"Có duy nhất một điểm $N$ sao cho $\\overrightarrow{MN} = \\vec{a}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho hình bình hành $ABCD$ tâm $O$. Khẳng định nào sau đây đúng?","options":["A. $\\overrightarrow{AO} = \\overrightarrow{OC}$","B. $\\overrightarrow{AO} = \\overrightarrow{OA}$","C. $\\overrightarrow{AO} = \\overrightarrow{CO}$","D. $\\overrightarrow{AO} = \\overrightarrow{AC}$"],"answer":"A","explain":"$\\overrightarrow{AO}$ và $\\overrightarrow{OC}$ cùng hướng, cùng độ dài nên bằng nhau.","points":0.25},{"type":"mcq","level":"VD","q":"Cho tam giác $ABC$, $M, N, P$ lần lượt là trung điểm của $BC, CA, AB$. Vectơ $\\overrightarrow{MN}$ cùng hướng với vectơ nào sau đây?","options":["A. $\\overrightarrow{BA}$","B. $\\overrightarrow{AB}$","C. $\\overrightarrow{CB}$","D. $\\overrightarrow{AC}$"],"answer":"A","explain":"$\\overrightarrow{MN}$ song song và cùng hướng với $\\overrightarrow{BA}$ (đường trung bình).","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình vuông $ABCD$ cạnh $4$, $M$ là trung điểm của $AB$. Giá trị của $|\\overrightarrow{DM}|$ bằng","options":["A. $2\\sqrt{5}$","B. $6$","C. $2\\sqrt{3}$","D. $20$"],"answer":"A","explain":"$DM^2 = AD^2 + AM^2 = 16 + 4 = 20$, suy ra $|\\overrightarrow{DM}| = 2\\sqrt{5}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Vectơ là một đoạn thẳng có hướng.","b) $\\overrightarrow{AB} \\ne \\overrightarrow{BA}$ (khi $A \\ne B$).","c) $|\\overrightarrow{AB}|$ là khoảng cách giữa $A$ và $B$.","d) Vectơ-không có điểm đầu khác điểm cuối."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: điểm đầu trùng điểm cuối.","points":1},{"type":"truefalse","level":"TH","q":"Cho lục giác đều $ABCDEF$ tâm $O$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\overrightarrow{AB} = \\overrightarrow{FO}$.","b) $\\overrightarrow{AB} = \\overrightarrow{OC}$.","c) $\\overrightarrow{AB} = \\overrightarrow{ED}$.","d) $\\overrightarrow{AB} = \\overrightarrow{DE}$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: cùng hướng, cùng độ dài cạnh. d) Sai: $\\overrightarrow{DE}$ ngược hướng $\\overrightarrow{AB}$.","points":1},{"type":"short","level":"VD","q":"Cho ba điểm phân biệt $A, B, C$. Có bao nhiêu vectơ khác $\\vec{0}$ có điểm đầu và điểm cuối là các điểm đã cho?","answer":"6","explain":"$3 \\cdot 2 = 6$ vectơ.","points":0.5},{"type":"short","level":"VDC","q":"Cho hình bình hành $ABCD$ có $AB = 8$, $AD = 6$, $AC = 10$. Tính $|\\overrightarrow{BD}|^2$.","answer":"100","explain":"$AC^2 + BD^2 = 2(AB^2 + AD^2) \\Rightarrow 100 + BD^2 = 200 \\Rightarrow BD^2 = 100$.","points":0.5}]}]}</script>
