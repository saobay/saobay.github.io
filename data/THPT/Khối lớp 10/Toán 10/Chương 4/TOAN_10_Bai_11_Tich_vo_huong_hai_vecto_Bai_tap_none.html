<script type="application/json" class="saobay-exam10-data">{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Tích vô hướng của hai vectơ $\\vec{a}$ và $\\vec{b}$ bằng","options":["A. $|\\vec{a}| \\cdot |\\vec{b}| \\cdot \\cos(\\vec{a}, \\vec{b})$","B. $|\\vec{a}| + |\\vec{b}|$","C. $|\\vec{a}| \\cdot |\\vec{b}|$","D. $\\cos(\\vec{a}, \\vec{b})$"],"answer":"A","explain":"Theo định nghĩa: $\\vec{a} \\cdot \\vec{b} = |\\vec{a}| \\cdot |\\vec{b}| \\cdot \\cos(\\vec{a}, \\vec{b})$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $\\vec{a}, \\vec{b} \\ne \\vec{0}$. Khẳng định nào sau đây đúng?","options":["A. $\\vec{a} \\perp \\vec{b} \\Leftrightarrow \\vec{a} \\cdot \\vec{b} = 0$","B. $\\vec{a} \\perp \\vec{b} \\Leftrightarrow \\vec{a} \\cdot \\vec{b} = 1$","C. $\\vec{a} \\perp \\vec{b} \\Leftrightarrow |\\vec{a}| = |\\vec{b}|$","D. $\\vec{a} \\perp \\vec{b} \\Leftrightarrow \\vec{a} = \\vec{b}$"],"answer":"A","explain":"Hai vectơ (khác $\\vec{0}$) vuông góc khi và chỉ khi tích vô hướng bằng $0$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $|\\vec{a}| = 3$, $|\\vec{b}| = 4$, $(\\vec{a}, \\vec{b}) = 60^\\circ$. Giá trị của $\\vec{a} \\cdot \\vec{b}$ bằng","options":["A. $6$","B. $12$","C. $3$","D. $7$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{b} = 3\\cdot 4\\cdot\\cos 60^\\circ = 12\\cdot\\frac{1}{2} = 6$.","points":0.25},{"type":"mcq","level":"TH","q":"$\\vec{a} \\cdot \\vec{a}$ bằng","options":["A. $|\\vec{a}|^2$","B. $|\\vec{a}|$","C. $0$","D. $2|\\vec{a}|$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{a} = |\\vec{a}|\\cdot|\\vec{a}|\\cdot\\cos 0^\\circ = |\\vec{a}|^2$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $\\vec{a} = (1; 2)$, $\\vec{b} = (3; -1)$. Giá trị của $\\vec{a} \\cdot \\vec{b}$ bằng","options":["A. $1$","B. $5$","C. $-1$","D. $7$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{b} = 1\\cdot 3 + 2\\cdot(-1) = 1$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $\\vec{a} = (2; 1)$, $\\vec{b} = (-1; 2)$ $","C. Từ $0^\\circ$ đến $360^\\circ$","D. Từ $-90^\\circ$ đến $90^\\circ$"],"answer":"A","explain":"Góc giữa hai vectơ có số đo từ $0^\\circ$ đến $180^\\circ$.","points":0.25},{"type":"mcq","level":"NB","q":"$\\vec{a} \\cdot \\vec{b} = x_1x_2 + y_1y_2$ là biểu thức tọa độ của","options":["A. tích vô hướng của $\\vec{a} = (x_1; y_1)$, $\\vec{b} = (x_2; y_2)$","B. tổng của hai vectơ","C. hiệu của hai vectơ","D. độ dài của vectơ"],"answer":"A","explain":"Đây là biểu thức tọa độ của tích vô hướng.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $|\\vec{a}| = 2$, $|\\vec{b}| = 5$, $(\\vec{a}, \\vec{b}) = 120^\\circ$. Giá trị của $\\vec{a} \\cdot \\vec{b}$ bằng","options":["A. $-5$","B. $5$","C. $10$","D. $-10$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{b} = 2\\cdot 5\\cdot\\cos 120^\\circ = 10\\cdot\\left(-\\frac{1}{2}\\right) = -5$.","points":0.25},{"type":"mcq","level":"TH","q":"$(\\vec{a} + \\vec{b}) \\cdot \\vec{c}$ bằng","options":["A. $\\vec{a} \\cdot \\vec{c} + \\vec{b} \\cdot \\vec{c}$","B. $\\vec{a} \\cdot \\vec{c} - \\vec{b} \\cdot \\vec{c}$","C. $\\vec{a} \\cdot \\vec{b} + \\vec{c}$","D. $(\\vec{a} \\cdot \\vec{b}) \\cdot \\vec{c}$"],"answer":"A","explain":"Tính chất phân phối của tích vô hướng.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $\\vec{a} = (1; 0)$, $\\vec{b} = (1; 1)$. Giá trị của $\\cos(\\vec{a}, \\vec{b})$ bằng","options":["A. $\\frac{\\sqrt{2}}{2}$","B. $\\frac{1}{2}$","C. $\\frac{\\sqrt{3}}{2}$","D. $0$"],"answer":"A","explain":"$\\cos(\\vec{a}, \\vec{b}) = \\frac{1}{\\sqrt{1}\\cdot\\sqrt{2}} = \\frac{\\sqrt{2}}{2}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tam giác $ABC$ vuông tại $A$. Giá trị của $\\overrightarrow{AB} \\cdot \\overrightarrow{AC}$ bằng","options":["A. $0$","B. $AB \\cdot AC$","C. $1$","D. $-1$"],"answer":"A","explain":"$\\overrightarrow{AB} \\perp \\overrightarrow{AC}$ nên tích vô hướng bằng $0$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (với $\\vec{a}, \\vec{b} \\ne \\vec{0}$):","statements":["a) $\\vec{a} \\perp \\vec{b} \\Leftrightarrow \\vec{a} \\cdot \\vec{b} = 0$.","b) Góc giữa $\\vec{a}$ và $-\\vec{a}$ bằng $180^\\circ$.","c) Góc giữa $\\vec{a}$ và $\\vec{a}$ bằng $0^\\circ$.","d) $\\vec{a} \\cdot \\vec{b} \\ge 0$ với mọi $\\vec{a}, \\vec{b}$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: tích vô hướng có thể âm.","points":1},{"type":"truefalse","level":"TH","q":"Cho $\\vec{a} = (1; 1)$, $\\vec{b} = (1; -1)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\vec{a} \\cdot \\vec{b} = 0$.","b) $\\vec{a} \\perp \\vec{b}$.","c) $|\\vec{a}| = |\\vec{b}| = \\sqrt{2}$.","d) $(\\vec{a}, \\vec{b}) = 45^\\circ$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: $(\\vec{a}, \\vec{b}) = 90^\\circ$.","points":1},{"type":"short","level":"VD","q":"Cho $|\\vec{a}| = 4$, $|\\vec{b}| = 3$, $(\\vec{a}, \\vec{b}) = 60^\\circ$. Tính $\\vec{a} \\cdot \\vec{b}$.","answer":"6","explain":"$\\vec{a} \\cdot \\vec{b} = 4\\cdot 3\\cdot\\frac{1}{2} = 6$.","points":0.5},{"type":"short","level":"VDC","q":"Cho $\\vec{a} = (3; 4)$. Tính $|\\vec{a}|^2$.","answer":"25","explain":"$|\\vec{a}|^2 = 9 + 16 = 25$.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Cho $(\\vec{a}, \\vec{b}) = 90^\\circ$. Giá trị của $\\vec{a} \\cdot \\vec{b}$ bằng","options":["A. $0$","B. $1$","C. $|\\vec{a}| \\cdot |\\vec{b}|$","D. $-1$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{b} = |\\vec{a}|\\cdot|\\vec{b}|\\cdot\\cos 90^\\circ = 0$.","points":0.25},{"type":"mcq","level":"NB","q":"Nếu $\\vec{a} \\cdot \\vec{b} \\lt 0$ ($\\vec{a}, \\vec{b} \\ne \\vec{0}$) thì góc giữa $\\vec{a}$ và $\\vec{b}$ là","options":["A. góc tù (lớn hơn $90^\\circ$)","B. góc nhọn (nhỏ hơn $90^\\circ$)","C. góc vuông","D. góc bẹt"],"answer":"A","explain":"$\\cos(\\vec{a}, \\vec{b}) \\lt 0$ nên góc giữa hai vectơ là góc tù.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $|\\vec{a}| = 6$, $|\\vec{b}| = 2$, $\\vec{a} \\cdot \\vec{b} = 6$. Giá trị của $\\cos(\\vec{a}, \\vec{b})$ bằng","options":["A. $\\frac{1}{2}$","B. $1$","C. $\\frac{1}{3}$","D. $0$"],"answer":"A","explain":"$\\cos(\\vec{a}, \\vec{b}) = \\frac{6}{6\\cdot 2} = \\frac{1}{2}$.","points":0.25},{"type":"mcq","level":"TH","q":"$k(\\vec{a} \\cdot \\vec{b})$ bằng","options":["A. $(k\\vec{a}) \\cdot \\vec{b}$","B. $k\\vec{a} \\cdot k\\vec{b}$","C. $k + (\\vec{a} \\cdot \\vec{b})$","D. $(k\\vec{a}) + \\vec{b}$"],"answer":"A","explain":"$(k\\vec{a}) \\cdot \\vec{b} = k(\\vec{a} \\cdot \\vec{b})$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $\\vec{a} = (-1; 2)$, $\\vec{b} = (3; 1)$. Giá trị của $\\vec{a} \\cdot \\vec{b}$ bằng","options":["A. $-1$","B. $1$","C. $5$","D. $-5$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{b} = (-1)\\cdot 3 + 2\\cdot 1 = -1$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình vuông $ABCD$. Giá trị của $\\overrightarrow{AB} \\cdot \\overrightarrow{AD}$ bằng","options":["A. $0$","B. $AB \\cdot AD$","C. $AB^2$","D. $-AB \\cdot AD$"],"answer":"A","explain":"$\\overrightarrow{AB} \\perp \\overrightarrow{AD}$ nên tích vô hướng bằng $0$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\vec{a} \\cdot \\vec{b} = |\\vec{a}|\\cdot|\\vec{b}|\\cdot\\cos(\\vec{a}, \\vec{b})$.","b) $\\vec{a} \\cdot \\vec{a} \\ge 0$.","c) $\\vec{a} \\cdot \\vec{a} = 0 \\Leftrightarrow \\vec{a} = \\vec{0}$.","d) $(\\vec{a} + \\vec{b})^2 = |\\vec{a}|^2 + |\\vec{b}|^2$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: thiếu $2\\vec{a}\\cdot\\vec{b}$.","points":1},{"type":"truefalse","level":"TH","q":"Cho $|\\vec{a}| = 3$, $|\\vec{b}| = 4$, $\\vec{a} \\cdot \\vec{b} = 12$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\cos(\\vec{a}, \\vec{b}) = 1$.","b) $(\\vec{a}, \\vec{b}) = 0^\\circ$.","c) $\\vec{a}$ và $\\vec{b}$ cùng hướng.","d) $\\vec{a} = \\vec{b}$."],"answer":["T","T","T","F"],"expla ec{a}$ và $\\vec{b}$ bằng","options":["A. $90^\\circ$","B. $45^\\circ$","C. $60^\\circ$","D. $0^\\circ$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{b} = -2 + 2 = 0$ nên $(\\vec{a}, \\vec{b}) = 90^\\circ$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $|\\vec{a}| = 1$, $|\\vec{b}| = 2$, $(\\vec{a}, \\vec{b}) = 120^\\circ$. Giá trị của $|\\vec{a} + \\vec{b}|^2$ bằng","options":["A. $3$","B. $5$","C. $7$","D. $1$"],"answer":"A","explain":"$|\\vec{a} + \\vec{b}|^2 = 1 + 4 + 2\\cdot 1\\cdot 2\\cdot\\left(-\\frac{1}{2}\\right) = 3$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau (với $\\vec{a}, \\vec{b} \\ne \\vec{0}$):","statements":["a) $\\cos(\\vec{a}, \\vec{b}) = \\frac{\\vec{a} \\cdot \\vec{b}}{|\\vec{a}|\\cdot|\\vec{b}|}$.","b) $\\vec{a} \\perp \\vec{b} \\Leftrightarrow \\cos(\\vec{a}, \\vec{b}) = 0$.","c) $(\\vec{a}, \\vec{b}) = 0^\\circ \\Leftrightarrow \\vec{a} \\cdot \\vec{b} = |\\vec{a}|\\cdot|\\vec{b}|$.","d) $(\\vec{a}, \\vec{b}) = 180^\\circ \\Leftrightarrow \\vec{a} \\cdot \\vec{b} = |\\vec{a}|\\cdot|\\vec{b}|$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: khi đó $\\vec{a} \\cdot \\vec{b} = -|\\vec{a}|\\cdot|\\vec{b}|$.","points":1},{"type":"truefalse","level":"TH","q":"Cho tam giác $ABC$ vuông tại $A$ có $AB = 3$, $AC = 4$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\overrightarrow{AB} \\cdot \\overrightarrow{AC} = 0$.","b) $\\overrightarrow{BA} \\cdot \\overrightarrow{BC} = 9$.","c) $\\overrightarrow{CA} \\cdot \\overrightarrow{CB} = 16$.","d) $\\overrightarrow{AB} \\cdot \\overrightarrow{BC} = 0$."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: $3\\cdot 5\\cdot\\frac{3}{5} = 9$. c) Đúng: $4\\cdot 5\\cdot\\frac{4}{5} = 16$. d) Sai: $\\overrightarrow{AB} \\cdot \\overrightarrow{BC} = -9$.","points":1},{"type":"short","level":"VD","q":"Cho $|\\vec{a}| = 3$, $|\\vec{b}| = 8$, $(\\vec{a}, \\vec{b}) = 120^\\circ$. Tính $\\vec{a} \\cdot \\vec{b}$.","a :["A. $9$","B. $12$","C. $15$","D. $0$"],"answer":"A","explain":"$\\overrightarrow{AB} \\cdot \\overrightarrow{AC} = AB\\cdot AC\\cdot\\cos A = 3\\cdot 5\\cdot\\frac{3}{5} = 9$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\vec{a} \\cdot \\vec{b} = \\vec{b} \\cdot \\vec{a}$.","b) $(2\\vec{a}) \\cdot \\vec{b} = 2(\\vec{a} \\cdot \\vec{b})$.","c) $\\vec{a} \\cdot (\\vec{b} + \\vec{c}) = \\vec{a} \\cdot \\vec{b} + \\vec{a} \\cdot \\vec{c}$.","d) $\\vec{a} \\cdot \\vec{b} = \\vec{a} \\cdot \\vec{c} \\Rightarrow \\vec{b} = \\vec{c}$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: không có luật giản ước cho tích vô hướng.","points":1},{"type":"truefalse","level":"TH","q":"Cho $\\vec{a} = (2; 1)$, $\\vec{b} = (-1; 2)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\vec{a} \\cdot \\vec{b} = 0$.","b) $\\vec{a} \\perp \\vec{b}$.","c) $|\\vec{a}| = |\\vec{b}|$.","d) $\\vec{a} = -\\vec{b}$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $-2 + 2 = 0$. b) Đúng. c) Đúng: cùng bằng $\\sqrt{5}$. d) Sai.","points":1},{"type":"short","level":"VD","q":"Cho $|\\vec{a}| = 6$, $|\\vec{b}| = 4$, $\\vec{a} \\cdot \\vec{b} = -12$. Tính $\\cos(\\vec{a}, \\vec{b})$.","answer":"-0.5","explain":"$\\cos(\\vec{a}, \\vec{b}) = \\frac{-12}{6\\cdot 4} = -0{,}5$.","points":0.5},{"type":"short","level":"VDC","q":"Cho $\\vec{a} = (1; 2)$, $\\vec{b} = (2; -1)$. Tính $(\\vec{a} + \\vec{b}) \\cdot (\\vec{a} - \\vec{b})$.","answer":"0","explain":"$(\\vec{a} + \\vec{b})\\cdot(\\vec{a} - \\vec{b}) = |\\vec{a}|^2 - |\\vec{b}|^2 = 5 - 5 = 0$.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Cho $(\\vec{a}, \\vec{b}) = 0^\\circ$. Giá trị của $\\vec{a} \\cdot \\vec{b}$ bằng","options":["A. $|\\vec{a}| \\cdot |\\vec{b}|$","B. $0$","C. $-|\\vec{a}| \\cdot |\\vec{b}|$","D. $1$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{b} = |\\vec{a}|\\cdot|\\vec{b}|\\cdot\\cos 0^\\circ = | ai vectơ vuông góc (khác $\\vec{0}$) cũng có tích vô hướng bằng $0$. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Cho $|\\vec{a}| = |\\vec{b}| = 1$, $\\vec{a} \\cdot \\vec{b} = \\frac{1}{2}$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $(\\vec{a}, \\vec{b}) = 60^\\circ$.","b) $|\\vec{a} - \\vec{b}| = 1$.","c) $|\\vec{a} + \\vec{b}| = \\sqrt{3}$.","d) $\\vec{a} \\perp \\vec{b}$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $\\cos = \\frac{1}{2}$. b) Đúng: $1 + 1 - 2\\cdot\\frac{1}{2} = 1$. c) Đúng: $1 + 1 + 2\\cdot\\frac{1}{2} = 3$. d) Sai.","points":1},{"type":"short","level":"VD","q":"Cho $\\vec{a} = (-3; 4)$, $\\vec{b} = (2; 5)$. Tính $\\vec{a} \\cdot \\vec{b}$.","answer":"14","explain":"$\\vec{a} \\cdot \\vec{b} = (-3)\\cdot 2 + 4\\cdot 5 = 14$.","points":0.5},{"type":"short","level":"VDC","q":"Cho $|\\vec{a}| = 4$, $|\\vec{b}| = 5$, $|\\vec{a} - \\vec{b}| = \\sqrt{21}$. Tính $\\vec{a} \\cdot \\vec{b}$.","answer":"10","explain":"$|\\vec{a} - \\vec{b}|^2 = 16 + 25 - 2\\vec{a}\\cdot\\vec{b} = 21 \\Rightarrow \\vec{a}\\cdot\\vec{b} = 10$.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Cho $(\\vec{a}, \\vec{b}) = 180^\\circ$. Giá trị của $\\vec{a} \\cdot \\vec{b}$ bằng","options":["A. $-|\\vec{a}| \\cdot |\\vec{b}|$","B. $|\\vec{a}| \\cdot |\\vec{b}|$","C. $0$","D. $1$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{b} = |\\vec{a}|\\cdot|\\vec{b}|\\cdot\\cos 180^\\circ = -|\\vec{a}|\\cdot|\\vec{b}|$.","points":0.25},{"type":"mcq","level":"NB","q":"$\\vec{a} \\cdot \\vec{a}$ bằng","options":["A. $|\\vec{a}|^2$","B. $|\\vec{a}|$","C. $0$","D. $2\\vec{a}$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{a} = |\\vec{a}|^2$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $\\vec{a} = (1; -2)$, $\\vec{b} = (3; 1)$. Giá trị của $\\vec{a} \\cdot \\vec{b}$ bằng","options":["A. $1$","B. $5$","C. $-1$","D. $7$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{b} = 1\\cdot 3 + (-2)\\cdot 1 = 1$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $|\\vec{a}| = 7$. Giá trị của $\\vec{a} \\cdot \\vec{a}$ bằng","options":["A. $49$","B. $7$","C. $14$","D. $0$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{a} = |\\vec{a}|^2 = 49$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $\\vec{a} = (3; 1)$, $\\vec{b} = (1; 3)$. Giá trị của $\\cos(\\vec{a}, \\vec{b})$ bằng","options":["A. $\\frac{3}{5}$","B. $\\frac{4}{5}$","C. $\\frac{1}{2}$","D. $0$"],"answer":"A","explain":"$\\cos(\\vec{a}, \\vec{b}) = \\frac{3 + 3}{\\sqrt{10}\\cdot\\sqrt{10}} = \\frac{6}{10} = \\frac{3}{5}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho hình thoi $ABCD$ cạnh $a$, $\\widehat{A} = 60^\\circ$. Giá trị của $\\overrightarrow{AB} \\cdot \\overrightarrow{AD}$ bằng","options":["A. $\\frac{a^2}{2}$","B. $a^2$","C. $0$","D. $-\\frac{a^2}{2}$"],"answer":"A","explain":"$\\overrightarrow{AB} \\cdot \\overrightarrow{AD} = a\\cdot a\\cdot\\cos 60^\\circ = \\frac{a^2}{2}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Góc giữa hai vectơ bằng $0^\\circ$ khi chúng cùng hướng.","b) Góc giữa hai vectơ bằng $180^\\circ$ khi chúng ngược hướng.","c) Góc giữa hai vectơ vuông góc bằng $90^\\circ$.","d) Góc giữa hai vectơ luôn là góc nhọn."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: có thể tù hoặc vuông.","points":1},{"type":"truefalse","level":"TH","q":"Cho $\\vec{a} = (5; 0)$, $\\vec{b} = (0; 5)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\vec{a} \\cdot \\vec{b} = 0$.","b) $\\vec{a} \\perp \\vec{b}$.","c) $(\\vec{a}, \\vec{b}) = 90^\\circ$.","d) $|\\vec{a} + \\vec{b}| = 10$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: $|\\vec{a} + \\vec{b}| = 5\\sqrt{2}$.","points":1},{"type":"short","level":"VD","q":"Cho $|\\vec{a}| = 10$, $|\\vec{b}| = 2$, $(\\vec{a}, \\vec{b}) = 60^\\circ$. Tính $\\vec{a} \\cdot \\vec{b}$.","answer":"10","explain":"$\\vec{a} \\cdot \\vec{b} = 10\\cdot 2\\cdot\\frac{1}{2} = 10$.","points":0.5},{"type":"short","level":"VDC","q":"Cho $\\vec{a} = (4; 3)$. Tìm $m$ để $\\vec{b} = (m; -4)$ vuông góc với $\\vec{a}$.","answer":"3","explain":"$\\vec{a} \\cdot \\vec{b} = 4m - 12 = 0 \\Rightarrow m = 3$.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Tích vô hướng của hai vectơ là","options":["A. một số thực","B. một vectơ","C. một góc","D. một điểm"],"answer":"A","explain":"Tích vô hướng của hai vectơ là một số thực.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $\\vec{a} \\perp \\vec{b}$. Góc giữa $\\vec{a}$ và $\\vec{b}$ bằng","options":["A. $90^\\circ$","B. $0^\\circ$","C. $180^\\circ$","D. $45^\\circ$"],"answer":"A","explain":"Hai vectơ vuông góc thì góc giữa chúng bằng $90^\\circ$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $|\\vec{a}| = 3$, $|\\vec{b}| = 6$, $(\\vec{a}, \\vec{b}) = 60^\\circ$. Giá trị của $2(\\vec{a} \\cdot \\vec{b})$ bằng","options":["A. $18$","B. $9$","C. $36$","D. $12$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{b} = 3\\cdot 6\\cdot\\frac{1}{2} = 9$ nên $2(\\vec{a} \\cdot \\vec{b}) = 18$.","points":0.25},{"type":"mcq","level":"TH","q":"$(\\vec{a} - \\vec{b}) \\cdot (\\vec{a} + \\vec{b})$ bằng","options":["A. $|\\vec{a}|^2 - |\\vec{b}|^2$","B. $|\\vec{a}|^2 + |\\vec{b}|^2$","C. $|\\vec{a} - \\vec{b}|^2$","D. $0$"],"answer":"A","explain":"$(\\vec{a} - \\vec{b})\\cdot(\\vec{a} + \\vec{b}) = |\\vec{a}|^2 - |\\vec{b}|^2$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $\\vec{a} = (-1; -2)$, $\\vec{b} = (2; -1)$. Góc giữa $\\vec{a}$ và $\\vec{b}$ bằng","options":["A. $90^\\circ$","B. $45^\\circ$","C. $60^\\circ$","D. $135^\\circ$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{b} = -2 + 2 = 0$ nên góc bằng $90^\\circ$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $|\\vec{a}| = 2$, $|\\vec{b}| = 1$, $(\\vec{a}, \\vec{b}) = 60^\\circ$. Giá trị của $|2\\vec{a} - \\vec{b}|^2$ bằng","options":["A. $13$","B. $17$","C. $9$","D. $5$"],"answer":"A","explain":"$|2\\vec{a} - \\vec{b}|^2 = 4\\cdot 4 + 1 - 2\\cdot 2\\cdot 2\\cdot 1\\cdot\\frac{1}{2} = 16 + 1 - 4 = 13$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $(k\\vec{a}) \\cdot \\vec{b} = k(\\vec{a} \\cdot \\vec{b})$.","b) $\\vec{a} \\cdot (\\vec{b} + \\vec{c}) = \\vec{a} \\cdot \\vec{b} + \\vec{a} \\cdot \\vec{c}$.","c) $(\\vec{a} + \\vec{b})^2 = |\\vec{a}|^2 + 2\\vec{a}\\cdot\\vec{b} + |\\vec{b}|^2$.","d) $(\\vec{a} - \\vec{b})^2 = |\\vec{a}|^2 - |\\vec{b}|^2$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: $(\\vec{a} - \\vec{b})^2 = |\\vec{a}|^2 - 2\\vec{a}\\cdot\\vec{b} + |\\vec{b}|^2$.","points":1},{"type":"truefalse","level":"TH","q":"Cho hình vuông $ABCD$ cạnh $4$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\overrightarrow{AB} \\cdot \\overrightarrow{AD} = 0$.","b) $\\overrightarrow{AB} \\cdot \\overrightarrow{AC} = 16$.","c) $\\overrightarrow{AC} \\cdot \\overrightarrow{BD} = 0$.","d) $\\overrightarrow{AB} \\cdot \\overrightarrow{CD} = 16$."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: $4\\cdot 4\\sqrt{2}\\cdot\\frac{\\sqrt{2}}{2} = 16$. c) Đúng: hai đường chéo vuông góc. d) Sai: bằng $-16$ (ngược hướng).","points":1},{"type":"short","level":"VD","q":"Cho $\\vec{a} = (6; -8)$. Tính $\\vec{a} \\cdot \\vec{a}$.","answer":"100","explain":"$\\vec{a} \\cdot \\vec{a} = 36 + 64 = 100$.","points":0.5},{"type":"short","level":"VDC","q":"Cho $|\\vec{a}| = 3$, $|\\vec{b}| = 4$, $|\\vec{a} + \\vec{b}| = 5$. Tính $\\vec{a} \\cdot \\vec{b}$.","answer":"0","explain":"$|\\vec{a} + \\vec{b}|^2 = 9 + 16 + 2\\vec{a}\\cdot\\vec{b} = 25 \\Rightarrow \\vec{a}\\cdot\\vec{b} = 0$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"$\\cos(\\vec{a}, \\vec{b})$ bằng","options":["A. $\\frac{\\vec{a} \\cdot \\vec{b}}{|\\vec{a}|\\cdot|\\vec{b}|}$ ($\\vec{a}, \\vec{b} \\ne \\vec{0}$)","B. $\\vec{a} \\cdot \\vec{b}$","C. $|\\vec{a}|\\cdot|\\vec{b}|$","D. $\\frac{|\\vec{a}|\\cdot|\\vec{b}|}{\\vec{a} \\cdot \\vec{b}}$"],"answer":"A","explain":"Từ định nghĩa suy ra $\\cos(\\vec{a}, \\vec{b}) = \\frac{\\vec{a} \\cdot \\vec{b}}{|\\vec{a}|\\cdot|\\vec{b}|}$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $\\vec{a} \\cdot \\vec{b} = 0$ ($\\vec{a}, \\vec{b} \\ne \\vec{0}$). Khẳng định nào sau đây đúng?","options":["A. $\\vec{a} \\perp \\vec{b}$","B. $\\vec{a}$ cùng hướng với $\\vec{b}$","C. $\\vec{a} = \\vec{b}$","D. $|\\vec{a}| = |\\vec{b}|$"],"answer":"A","explain":"Tích vô hướng bằng $0$ (với hai vectơ khác $\\vec{0}$) khi và chỉ khi chúng vuông góc.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $\\vec{a} = (2; 5)$, $\\vec{b} = (-1; -2)$. Giá trị của $\\vec{a} \\cdot \\vec{b}$ bằng","options":["A. $-12$","B. $12$","C. $-8$","D. $8$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{b} = 2\\cdot(-1) + 5\\cdot(-2) = -12$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $|\\vec{a}| = 8$, $|\\vec{b}| = 3$, $(\\vec{a}, \\vec{b}) = 0^\\circ$. Giá trị của $\\vec{a} \\cdot \\vec{b}$ bằng","options":["A. $24$","B. $0$","C. $11$","D. $-24$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{b} = 8\\cdot 3\\cdot\\cos 0^\\circ = 24$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $\\vec{a} = (1; 1)$, $\\vec{b} = (1; 0)$. Giá trị của $\\cos(\\vec{a}, \\vec{b})$ bằng","options":["A. $\\frac{\\sqrt{2}}{2}$","B. $\\frac{1}{2}$","C. $\\frac{\\sqrt{3}}{2}$","D. $1$"],"answer":"A","explain":"$\\cos(\\vec{a}, \\vec{b}) = \\frac{1}{\\sqrt{2}\\cdot 1} = \\frac{\\sqrt{2}}{2}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tam giác $ABC$ có $AB = 5$, $AC = 6$, $\\widehat{A} = 60^\\circ$. Giá trị của $\\overrightarrow{AB} \\cdot \\overrightarrow{AC}$ bằng","options":["A. $15$","B. $30$","C. $11$","D. $0$"],"answer":"A","explain":"$\\overrightarrow{AB} \\cdot \\overrightarrow{AC} = 5\\cdot 6\\cdot\\cos 60^\\circ = 15$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\vec{a} \\cdot \\vec{b} = |\\vec{a}|\\cdot|\\vec{b}|\\cdot\\cos(\\vec{a}, \\vec{b})$.","b) Nếu $\\vec{a} \\cdot \\vec{b} \\gt 0$ thì góc giữa $\\vec{a}$ và $\\vec{b}$ là góc nhọn.","c) Nếu $\\vec{a} \\cdot \\vec{b} \\lt 0$ thì góc giữa $\\vec{a}$ và $\\vec{b}$ là góc tù.","d) Nếu $\\vec{a} \\cdot \\vec{b} = 0$ thì $\\vec{a} = \\vec{0}$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: có thể do vuông góc.","points":1},{"type":"truefalse","level":"TH","q":"Cho $\\vec{a} = (3; -4)$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $|\\vec{a}| = 5$.","b) $\\vec{a} \\cdot \\vec{a} = 25$.","c) $\\vec{a} \\cdot \\vec{i} = 3$.","d) $\\vec{a} \\cdot \\vec{j} = 4$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: $\\vec{a} \\cdot \\vec{j} = -4$.","points":1},{"type":"short","level":"VD","q":"Cho $|\\vec{a}| = 7$, $|\\vec{b}| = 9$, $(\\vec{a}, \\vec{b}) = 120^\\circ$. Tính $\\vec{a} \\cdot \\vec{b}$.","answer":"-31.5","explain":"$\\vec{a} \\cdot \\vec{b} = 7\\cdot 9\\cdot\\left(-\\frac{1}{2}\\right) = -31{,}5$.","points":0.5},{"type":"short","level":"VDC","q":"Cho $\\vec{a} = (2; m)$, $\\vec{b} = (3; -2)$. Tìm $m$ để $\\vec{a} \\cdot \\vec{b} = 0$.","answer":"3","explain":"$\\vec{a} \\cdot \\vec{b} = 6 - 2m = 0 \\Rightarrow m = 3$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"$\\vec{a} \\cdot \\vec{b} = |\\vec{a}| \\cdot |\\vec{b}|$ khi","options":["A. $(\\vec{a}, \\vec{b}) = 0^\\circ$","B. $(\\vec{a}, \\vec{b}) = 90^\\circ$","C. $(\\vec{a}, \\vec{b}) = 180^\\circ$","D. $\\vec{a} = \\vec{0}$"],"answer":"A","explain":"$\\cos(\\vec{a}, \\vec{b}) = 1$ khi góc bằng $0^\\circ$.","points":0.25},{"type":"mcq","level":"NB","q":"Cho $(\\vec{a}, \\vec{b}) = 90^\\circ$. Giá trị của $\\cos(\\vec{a}, \\vec{b})$ bằng","options":["A. $0$","B. $1$","C. $-1$","D. $\\frac{1}{2}$"],"answer":"A","explain":"$\\cos 90^\\circ = 0$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $|\\vec{a}| = 4$, $|\\vec{b}| = 7$, $(\\vec{a}, \\vec{b}) = 120^\\circ$. Giá trị của $\\vec{a} \\cdot \\vec{b}$ bằng","options":["A. $-14$","B. $14$","C. $28$","D. $-28$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{b} = 4\\cdot 7\\cdot\\left(-\\frac{1}{2}\\right) = -14$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $\\vec{a} = (0; -3)$, $\\vec{b} = (4; 0)$. Giá trị của $\\vec{a} \\cdot \\vec{b}$ bằng","options":["A. $0$","B. $12$","C. $-12$","D. $7$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{b} = 0\\cdot 4 + (-3)\\cdot 0 = 0$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho $\\vec{a} = (2; -3)$, $\\vec{b} = (-3; -2)$. Góc giữa $\\vec{a}$ và $\\vec{b}$ bằng","options":["A. $90^\\circ$","B. $45^\\circ$","C. $60^\\circ$","D. $120^\\circ$"],"answer":"A","explain":"$\\vec{a} \\cdot \\vec{b} = -6 + 6 = 0$ nên góc bằng $90^\\circ$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $|\\vec{a}| = 5$, $|\\vec{b}| = 12$, $\\vec{a} \\perp \\vec{b}$. Độ dài của $\\vec{a} + \\vec{b}$ bằng","options":["A. $13$","B. $17$","C. $7$","D. $169$"],"answer":"A","explain":"$|\\vec{a} + \\vec{b}|^2 = 25 + 144 = 169$ nên $|\\vec{a} + \\vec{b}| = 13$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\vec{a} \\cdot \\vec{b} = \\vec{b} \\cdot \\vec{a}$.","b) $(-\\vec{a}) \\cdot \\vec{b} = -(\\vec{a} \\cdot \\vec{b})$.","c) $\\vec{a} \\cdot \\vec{a} = |\\vec{a}|^2$.","d) $|\\vec{a} \\cdot \\vec{b}| = |\\vec{a}|\\cdot|\\vec{b}|$ với mọi $\\vec{a}, \\vec{b}$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng. d) Sai: chỉ đúng khi hai vectơ cùng phương.","points":1},{"type":"truefalse","level":"TH","q":"Cho tam giác $ABC$ đều cạnh $6$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\overrightarrow{AB} \\cdot \\overrightarrow{AC} = 18$.","b) $\\overrightarrow{BA} \\cdot \\overrightarrow{BC} = 18$.","c) $\\overrightarrow{AB} \\cdot \\overrightarrow{BC} = -18$.","d) $\\overrightarrow{AB} \\cdot \\overrightarrow{BA} = 36$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $36\\cdot\\frac{1}{2} = 18$. b) Đúng. c) Đúng: góc giữa $\\overrightarrow{AB}$ và $\\overrightarrow{BC}$ bằng $120^\\circ$. d) Sai: bằng $-36$.","points":1},{"type":"short","level":"VD","q":"Cho $|\\vec{a}| = 2$, $|\\vec{b}| = 5$, $(\\vec{a}, \\vec{b}) = 180^\\circ$. Tính $\\vec{a} \\cdot \\vec{b}$.","answer":"-10","explain":"$\\vec{a} \\cdot \\vec{b} = 2\\cdot 5\\cdot(-1) = -10$.","points":0.5},{"type":"short","level":"VDC","q":"Cho $|\\vec{a}| = 6$, $|\\vec{b}| = 8$, $|\\vec{a} - \\vec{b}| = 10$. Tính $\\vec{a} \\cdot \\vec{b}$.","answer":"0","explain":"$|\\vec{a} - \\vec{b}|^2 = 36 + 64 - 2\\vec{a}\\cdot\\vec{b} = 100 \\Rightarrow \\vec{a}\\cdot\\vec{b} = 0$.","points":0.5}]}]}</script>
