ịnh của mệnh đề \"$\\sqrt{3}$ là số vô tỉ.\" là mệnh đề \"$\\sqrt{3}$ là số hữu tỉ.\".", "c) Mệnh đề \"$7 \\gt 3 \\Rightarrow 6 \\gt 2$\" là mệnh đề sai.", "d) Mệnh đề \"$\\exists n \\in \\mathbb{N}, n^2 = 16$\" là mệnh đề đúng."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đây là câu khẳng định xác định được là đúng. b) Đúng: phủ định chỉ thêm \"không phải\" nên vẫn là khẳng định đúng. c) Sai: $P$: \"$7 \\gt 3$\" đúng, $Q$: \"$6 \\gt 2$\" đúng nên $P \\Rightarrow Q$ đúng. d) Đúng: ví dụ $n = 4$."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mệnh đề \"$\\forall x \\in \\mathbb{R}, x^2 + 7 \\ge 0$\" là mệnh đề đúng.", "b) Phủ định của mệnh đề \"$\\exists x \\in \\mathbb{R}, x + 4 = 0$\" là mệnh đề \"$\\forall x \\in \\mathbb{R}, x + 4 \\ne 0$\".", "c) Với mọi $n \\in \\mathbb{N}$, mệnh đề \"$n$ chia hết cho $15 $\\Rightarrow$ $n$ chia hết cho $5$\" là đúng.", "d) Mệnh đề đảo của \"$n$ chia hết cho $2 $\\Rightarrow$ $n$ chia hết cho $8$\" là mệnh đề đúng với mọi $n \\in \\mathbb{N}$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $x^2 \\ge 0$ với mọi $x \\in \\mathbb{R}$ nên $x^2 + 7 \\ge 7 \\gt 0$. b) Đúng: đổi $\\exists$ thành $\\forall$ và $=$ thành $\\ne$. c) Đúng: mọi bội của $15$ đều là bội của $5$. d) Mệnh đề đảo là \"$n$ chia hết cho $8 $\\Rightarrow$ $n$ chia hết cho $2$\", đúng vì mọi bội của $8$ đều là bội của $2$."}, {"type": "short", "level": "VDC", "q": "Cho $m \\in \\{-5, -4, \\dots, 5\\}$. Có bao nhiêu giá trị của $m$ để mệnh đề \"$\\exists x \\in \\mathbb{R}, x^2 + 2x + m = 0$\" là mệnh đề đúng?", "answer": "7", "explain": "Mệnh đề đúng $\\Leftrightarrow$ phương trình $x^2 + 2x + m = 0$ có nghiệm thực $\\Leftrightarrow \\Delta = 2^2 - 4m \\ge 0 \\Leftrightarrow m \\le 1.0$. Trong $\\{-5, \\dots, 5\\}$ có $7$ giá trị $m$ thỏa mãn."}, {"type": "short", "level": "VDC", "q": "Viết mệnh đề phủ định $\\overline{P}$ của $P$: \"$\\forall n \\in \\mathbb{N}, n^2 + n + 14$ là số ề sai."}, {"type": "mcq", "level": "TH", "q": "Mệnh đề nào sau đây là mệnh đề đúng?", "options": ["A. $\\exists n \\in \\mathbb{N}, n^2 = 16$", "B. $\\forall x \\in \\mathbb{R}, x^2 - 8 \\ge 0$", "C. $\\exists x \\in \\mathbb{R}, x^2 = -8$", "D. $\\forall n \\in \\mathbb{N}, 8n \\gt n$"], "answer": "A", "explain": "$n = 4$ thỏa $n^2 = 16$ nên mệnh đề có $\\exists n \\in \\mathbb{N}, n^2 = 16$ đúng. Các mệnh đề còn lại sai (ví dụ $x = 0$ làm cho $x^2 - 8 \\ge 0$ sai)."}, {"type": "mcq", "level": "VD", "q": "Phủ định của mệnh đề $P$: \"$\\forall x \\in \\mathbb{R}, x^2 + 4x + 15 \\gt 0$\" là mệnh đề nào sau đây?", "options": ["A. $\\exists x \\in \\mathbb{R}, x^2 + 4x + 15 \\le 0$", "B. $\\forall x \\in \\mathbb{R}, x^2 + 4x + 15 \\le 0$", "C. $\\exists x \\in \\mathbb{R}, x^2 + 4x + 15 \\gt 0$", "D. $\\forall x \\in \\mathbb{R}, x^2 + 4x + 15 \\lt 0$"], "answer": "A", "explain": "Phủ định phải \"đổi 2 chỗ\": $\\forall$ thành $\\exists$ và $\\gt$ thành $\\le$, được $\\exists x \\in \\mathbb{R}, x^2 + 4x + 15 \\le 0$."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Câu \"$8 + 11 = 19$\" là một mệnh đề.", "b) Phủ định của mệnh đề \"$\\sqrt{5}$ là số vô tỉ.\" là mệnh đề \"$\\sqrt{5}$ là số hữu tỉ.\".", "c) Mệnh đề \"$8 \\gt 5 \\Rightarrow 3 \\gt 7$\" là mệnh đề sai.", "d) Mệnh đề \"$\\exists n \\in \\mathbb{N}, n^2 = 6$\" là mệnh đề đúng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: đây là câu khẳng định xác định được là đúng. b) Đúng: phủ định chỉ thêm \"không phải\" nên vẫn là khẳng định đúng. c) Đúng: $P$: \"$8 \\gt 5$\" đúng, $Q$: \"$3 \\gt 7$\" sai nên $P \\Rightarrow Q$ sai. d) Sai: không có số tự nhiên nào bình phương bằng $6$."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mệnh đề \"$\\forall x \\in \\mathbb{R}, x^2 + 8 \\ge 0$\" là mệnh đề đúng.", "b) Phủ định của mệnh đề \"$\\exists x \\in \\mathbb{R}, x + 5 = 0$\" là mệnh đề \"$\\forall x \\in \\mathbb{R}, x + 5 \\ne 0$\".", "c) Với mọi $n \\in \\mathbb{N}$, mệnh đề \"$n$ chia hết cho $9 $\\Rightarrow$ $n$ chia hết cho $6$\" là đúng.", "d) Mệnh đề đảo của \"$n$ chia hết cho $8 $\\Rightarrow$ $n$ chia hết cho $2$\" là mệnh đề đúng với mọi $n \\in \\mathbb{N}$."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $x^2 \\ge 0$ với mọi $x \\in \\mathbb{R}$ nên $x^2 + 8 \\ge 8 \\gt 0$. b) Đúng: đổi $\\exists$ thành $\\forall$ và $=$ thành $\\ne$. c) Sai: ví dụ $n = 9$ chia hết cho $9$ nhưng không chia hết cho $6$. d) Mệnh đề đảo là \"$n$ chia hết cho $2 $\\Rightarrow$ $n$ chia hết cho $8$\", sai ví dụ $n = 2$."}, {"type": "short", "level": "VDC", "q": "Cho $m \\in \\{-5, -4, \\dots, 5\\}$. Có bao nhiêu giá trị của $m$ để mệnh đề \"$\\exists x \\in \\mathbb{R}, x^2 + 3x + m = 0$\" là mệnh đề đúng?", "answer": "8", "explain": "Mệnh đề đúng $\\Leftrightarrow$ phương trình $x^2 + 3x + m = 0$ có nghiệm thực $\\Leftrightarrow \\Delta = 3^2 - 4m \\ge 0 \\Leftrightarrow m \\le 2.25$. Trong $\\{-5, \\dots, 5\\}$ có $8$ giá trị $m$ thỏa mãn."}, {"type": "short", "level": "VDC", "q": "Viết mệnh đề phủ định $\\overline{P}$ của $P$: \"$\\forall n \\in \\mathbb{N}, n^2 + n + 16$ là số nguyên tố.\" và cho biết $\\overline{P}$ đúng hay sai.", "answer": "$\\overline{P}$: \"$\\exists n \\in \\mathbb{N}, n^2 + n + 16$ không là số nguyên tố.\"; $\\overline{P}$ đúng.", "explain": "$n^2 + n = n(n+1)$ luôn chẵn nên $n^2 + n + 16$ luôn chẵn; với $n = 1$ được $18$ là số chẵn lớn hơn $2$ nên là hợp số. Vậy $P$ sai, $\\overline{P}$ đúng."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các câu sau, câu nào là một mệnh đề?", "options": ["A. $10 + 19 = 29$.", "B. Thật là một ngày tuyệt vời!", "C. Bạn đã làm bài tập chưa?", "D. Đừng nói chuyện trong giờ học nữa!"], "answer": "A", "explain": "Câu $10 + 19 = 29$ là câu khẳng định và xác định được là đúng, nên là mệnh đề. Các câu còn lại là câu cảm thán, câu hỏi hoặc câu mệnh lệnh nên không phải mệnh đề."}, {"type": "mcq", "level": "NB", "q": "Phủ định của mệnh đề $P$: \"$23$ là số nguyên tố.\" là mệnh đề nào sau đây?", "options": ["A. \"$23$ là hợp số.\"", "B. \"$23$ là số nguyên tố.\"", "C. \"Mọi số tự nhiên đều là số nguyên tố.\"", "D. \"$23$ không phải là số nguyên tố.\""], "answer": "D", "explain": "Phủ định của \"$23$ là số nguyên tố\" là \"$23$ không phải là số nguyên tố\". Chú ý: \"$23$ là hợp số\" chưa phải phủ định đúng vì còn trường hợp số $1$."}, {"type": "mcq", "level": "NB", "q": "Mệnh đề kéo theo $P \\Rightarrow Q$ chỉ sai trong trường hợp nào?", "options": ["A. P đúng và Q đúng", "B. P sai và Q sai", "C. P đúng và Q sai", "D. P sai và Q đúng"], "answer": "C", "explain": "Theo định nghĩa, $P \\Rightarrow Q$ sai duy nhất khi $P$ đúng mà $Q$ sai (\"Đúng kéo theo Sai là Sai\")."}, {"type": "mcq", "level": "TH", "q": "Cho hai mệnh đề $P$: \"$24$ chia hết cho $8$\" và $Q$: \"$24$ chia hết cho $6$\". Mệnh đề $P \\Rightarrow Q$ là mệnh đề đúng hay sai?", "options": ["A. Không xác định được", "B. Đúng", "C. Sai", "D. Vừa đúng vừa sai"], "answer": "B", "explain": "Vì $24$ chia hết cho $8$ nên $P$ đúng; $24$ chia hết cho $6$ nên $Q$ đúng. Do đó $P \\Rightarrow Q$ là mệnh đề đúng."}, {"type": "mcq", "level": "TH", "q": "Mệnh đề nào sau đây là mệnh đề đúng?", "options": ["A. $\\forall x \\in \\mathbb{R}, x^2 + 6 \\ge 0$", "B. $\\exists x \\in \\mathbb{R}, x^2 = -9$", "C. $\\forall n \\in \\mathbb{N}, 9n \\gt n$", "D. $\\exists n \\in \\mathbb{N}, n^2 = 7$"], "answer": "A", "explain": "Với mọi $x \\in \\mathbb{R}$, $x^2 \\ge 0$ nên $x^2 + 6 \\ge 6 \\ge 0$: mệnh đề A đúng. Các mệnh đề còn lại đều sai (ví dụ $\\forall n \\in \\mathbb{N}, 9n \\gt n$ sai khi $n = 0$)."}, {"type": "mcq", "level": "VD", "q": "Phủ định của mệnh đề $P$: \"$\\forall x \\in \\mathbb{R}, x^2 + 5x + 17 \\gt 0$\" là mệnh đề nào sau đây?", "options": ["A. $\\forall x \\in \\mathbb{R}, x^2 + 5x + 17 \\le 0$", "B. $\\exists x \\in \\mathbb{R}, x^2 + 5x + 17 \\gt 0$", "C. $\\forall x \\in \\mathbb{R}, x^2 + 5x + 17 \\lt 0$", "D. $\\exists x \\in \\mathbb{R}, x^2 + 5x + 17 \\le 0$"], "answer": "D", "explain": "Phủ định phải \"đổi 2 chỗ\": $\\forall$ thành $\\exists$ và $\\gt$ thành $\\le$, được $\\exists x \\in \\mathbb{R}, x^2 + 5x + 17 \\le 0$."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Câu \"$9 + 12 = 21$\" là một mệnh đề.", "b) Phủ định của mệnh đề \"$\\sqrt{6}$ là số vô tỉ.\" là mệnh đề \"$\\sqrt{6}$ là số hữu tỉ.\".", "c) Mệnh đề \"$2 \\gt 4 \\Rightarrow 1 \\gt 3$\" là mệnh đề sai.", "d) Mệnh đề \"$\\exists n \\in \\mathbb{N}, n^2 = 25$\" là mệnh đề đúng."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đây là câu khẳng định xác định được là đúng. b) Đúng: phủ định chỉ thêm \"không phải\" nên vẫn là khẳng định đúng. c) Sai: $P$: \"$2 \\gt 4$\" sai, $Q$: \"$1 \\gt 3$\" sai nên $P \\Rightarrow Q$ đúng. d) Đúng: ví dụ $n = 5$."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mệnh đề \"$\\forall x \\in \\mathbb{R}, x^2 + 9 \\ge 0$\" là mệnh đề đúng.", "b) Phủ định của mệnh đề \"$\\exists x \\in \\mathbb{R}, x + 6 = 0$\" là mệnh đề \"$\\forall x \\in \\mathbb{R}, x + 6 \\ne 0$\".", "c) Với mọi $n \\in \\mathbb{N}$, mệnh đề \"$n$ chia hết cho $14 $\\Rightarrow$ $n$ chia hết cho $7$\" là đúng.", "d) Mệnh đề đảo của \"$n$ chia hết cho $7 $\\Rightarrow$ $n$ chia hết cho $14$\" là mệnh đề đúng với mọi $n \\in \\mathbb{N}$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $x^2 \\ge 0$ với mọi $x \\in \\mathbb{R}$ nên $x^2 + 9 \\ge 9 \\gt 0$. b) Đúng: đổi $\\exists$ thành $\\forall$ và $=$ thành $\\ne$. c) Đúng: mọi bội của $14$ đều là bội của $7$. d) Mệnh đề đảo là \"$n$ chia hết cho $14 $\\Rightarrow$ $n$ chia hết cho $7$\", đúng vì mọi bội của $14$ đều là bội của $7$."}, {"type": "short", "level": "VDC", "q": "Cho $m \\in \\{-5, -4, \\dots, 5\\}$. Có bao nhiêu giá trị của $m$ để mệnh đề \"$\\exists x \\in \\mathbb{R}, x^2 + 4x + m = 0$\" là mệnh đề đúng?", "answer": "10", "explain": "Mệnh đề đúng $\\Leftrightarrow$ phương trình $x^2 + 4x + m = 0$ có nghiệm thực $\\Leftrightarrow \\Delta = 4^2 - 4m \\ge 0 \\Leftrightarrow m \\le 4.0$. Trong $\\{-5, \\dots, 5\\}$ có $10$ giá trị $m$ thỏa mãn."}, {"type": "short", "level": "VDC", "q": "Viết mệnh đề phủ định $\\overline{P}$ của $P$: \"$\\forall n \\in \\mathbb{N}, n^2 + n + 18$ là số nguyên tố.\" và cho biết $\\overline{P}$ đúng hay sai.", "answer": "$\\overline{P}$: \"$\\exists n \\in \\mathbb{N}, n^2 + n + 18$ không là số nguyên tố.\"; $\\overline{P}$ đúng.", "explain": "$n^2 + n = n(n+1)$ luôn chẵn nên $n^2 + n + 18$ luôn chẵn; với $n = 1$ được $20$ là số chẵn lớn hơn $2$ nên là hợp số. Vậy $P$ sai, $\\overline{P}$ đúng."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các câu sau, câu nào là một mệnh đề?", "options": ["A. Trời hôm nay đẹp quá!", "B. Mấy giờ rồi bạn?", "C. Làm bài tập ngay đi!", "D. $11 + 21 = 32$."], "answer": "D", "explain": "Câu $11 + 21 = 32$ là câu khẳng định và xác định được là đúng, nên là mệnh đề. Các câu còn lại là câu cảm thán, câu hỏi hoặc câu mệnh lệnh nên không phải mệnh đề."}, {"type": "mcq", "level": "NB", "q": "Phủ định của mệnh đề $P$: \"$29$ là số nguyên tố.\" là mệnh đề nào sau đây?", "options": ["A. \"$29$ là số nguyên tố.\"", "B. \"Mọi số tự nhiên đều là số nguyên tố.\"", "C. \"$29$ không phải là số nguyên tố.\"", "D. \"$29$ là hợp số.\""], "answer": "C", "explain": "Phủ định của \"$29$ là số nguyên tố\" là \"$29$ không phải là số nguyên tố\". Chú ý: \"$29$ là hợp số\" chưa phải phủ định đúng vì còn trường hợp số $1$."}, {"type": "mcq", "level": "NB", "q": "Mệnh đề tương đương $P \\Leftrightarrow Q$ đúng trong trường hợp nào?", "options": ["A. $P$ đúng hoặc $Q$ đúng", "B. $P$ và $Q$ cùng đúng hoặc cùng sai", "C. $P$ đúng và $Q$ sai", "D. $P$ sai và $Q$ đúng"], "answer": "B", "explain": "$P \\Leftrightarrow Q$ đúng khi $P$ và $Q$ \"cùng phe\": cùng đúng hoặc cùng sai."}, {"type": "mcq", "level": "TH", "q": "Cho hai mệnh đề $P$: \"$10$ chia hết cho $5$\" và $Q$: \"$10$ chia hết cho $4$\". Mệnh đề $P \\Rightarrow Q$ là mệnh đề đúng hay sai?", "options": ["A. Đúng", "B. Sai", "C. Vừa đúng vừa sai", "D. Không xác định được"], "answer": "B", "explain": "Vì $10$ chia hết cho $5$ nên $P$ đúng; $10$ không chia hết cho $4$ nên $Q$ sai. Do đó $P \\Rightarrow Q$ là mệnh đề sai."}, {"type": "mcq", "level": "TH", "q": "Mệnh đề nào sau đây là mệnh đề đúng?", "options": ["A. $\\exists x \\in \\mathbb{R}, x^2 = -10$", "B. $\\forall n \\in \\mathbb{N}, 10n \\gt n$", "C. $\\exists n \\in \\mathbb{N}, n^2 = 25$", "D. $\\forall x \\in \\mathbb{R}, x^2 - 10 \\ge 0$"], "answer": "C", "explain": "$n = 5$ thỏa $n^2 = 25$ nên mệnh đề có $\\exists n \\in \\mathbb{N}, n^2 = 25$ đúng. Các mệnh đề còn lại sai (ví dụ $x = 0$ làm cho $x^2 - 10 \\ge 0$ sai)."}, {"type": "mcq", "level": "VD", "q": "Phủ định của mệnh đề $P$: \"$\\forall x \\in \\mathbb{R}, x^2 + 6x + 19 \\gt 0$\" là mệnh đề nào sau đây?", "options": ["A. $\\exists x \\in \\mathbb{R}, x^2 + 6x + 19 \\gt 0$", "B. $\\forall x \\in \\mathbb{R}, x^2 + 6x + 19 \\lt 0$", "C. $\\exists x \\in \\mathbb{R}, x^2 + 6x + 19 \\le 0$", "D. $\\forall x \\in \\mathbb{R}, x^2 + 6x + 19 \\le 0$"], "answer": "C", "explain": "Phủ định phải \"đổi 2 chỗ\": $\\forall$ thành $\\exists$ và $\\gt$ thành $\\le$, được $\\exists x \\in \\mathbb{R}, x^2 + 6x + 19 \\le 0$."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Câu \"$10 + 13 = 23$\" là một mệnh đề.", "b) Phủ định của mệnh đề \"$\\sqrt{7}$ là số vô tỉ.\" là mệnh đề \"$\\sqrt{7}$ là số hữu tỉ.\".", "c) Mệnh đề \"$9 \\gt 6 \\Rightarrow 8 \\gt 4$\" là mệnh đề sai.", "d) Mệnh đề \"$\\exists n \\in \\mathbb{N}, n^2 = 7$\" là mệnh đề đúng."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: đây là câu khẳng định xác định được là đúng. b) Đúng: phủ định chỉ thêm \"không phải\" nên vẫn là khẳng định đúng. c) Sai: $P$: \"$9 \\gt 6$\" đúng, $Q$: \"$8 \\gt 4$\" đúng nên $P \\Rightarrow Q$ đúng. d) Sai: không có số tự nhiên nào bình phương bằng $7$."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mệnh đề \"$\\forall x \\in \\mathbb{R}, x^2 + 10 \\ge 0$\" là mệnh đề đúng.", "b) Phủ định của mệnh đề \"$\\exists x \\in \\mathbb{R}, x + 7 = 0$\" là mệnh đề \"$\\forall x \\in \\mathbb{R}, x + 7 \\ne 0$\".", "c) Với mọi $n \\in \\mathbb{N}$, mệnh đề \"$n$ chia hết cho $12 $\\Rightarrow$ $n$ chia hết cho $8$\" là đúng.", "d) Mệnh đề đảo của \"$n$ chia hết cho $14 $\\Rightarrow$ $n$ chia hết cho $7$\" là mệnh đề đúng với mọi $n \\in \\mathbb{N}$."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: $x^2 \\ge 0$ với mọi $x \\in \\mathbb{R}$ nên $x^2 + 10 \\ge 10 \\gt 0$. b) Đúng: đổi $\\exists$ thành $\\forall$ và $=$ thành $\\ne$. c) Sai: ví dụ $n = 12$ chia hết cho $12$ nhưng không chia hết cho $8$. d) Mệnh đề đảo là \"$n$ chia hết cho $7 $\\Rightarrow$ $n$ chia hết cho $14$\", sai ví dụ $n = 7$."}, {"type": "short", "level": "VDC", "q": "Cho $m \\in \\{-5, -4, \\dots, 5\\}$. Có bao nhiêu giá trị của $m$ để mệnh đề \"$\\exists x \\in \\mathbb{R}, x^2 + 5x + m = 0$\" là mệnh đề đúng?", "answer": "11", "explain": "Mệnh đề đúng $\\Leftrightarrow$ phương trình $x^2 + 5x + m = 0$ có nghiệm thực $\\Leftrightarrow \\Delta = 5^2 - 4m \\ge 0 \\Leftrightarrow m \\le 6.25$. Trong $\\{-5, \\dots, 5\\}$ có $11$ giá trị $m$ thỏa mãn."}, {"type": "short", "level": "VDC", "q": "Viết mệnh đề phủ định $\\overline{P}$ của $P$: \"$\\forall n \\in \\mathbb{N}, n^2 + n + 20$ là số nguyên tố.\" và cho biết $\\overline{P}$ đúng hay sai.", "answer": "$\\overline{P}$: \"$\\exists n \\in \\mathbb{N}, n^2 + n + 20$ không là số nguyên tố.\"; $\\overline{P}$ đúng.", "explain": "$n^2 + n = n(n+1)$ luôn chẵn nên $n^2 + n + 20$ luôn chẵn; với $n = 1$ được $22$ là số chẵn lớn hơn $2$ nên là hợp số. Vậy $P$ sai, $\\overline{P}$ đúng."}]}]}
