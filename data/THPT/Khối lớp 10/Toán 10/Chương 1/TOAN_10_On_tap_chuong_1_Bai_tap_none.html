 + 41$ là số nguyên tố” với $n \\in \\mathbb{N}$. Mệnh đề nào sau đây đúng?", "options": ["A. “$P(0)$ đúng.”", "B. “$\\forall n \\in \\mathbb{N}, P(n)$ đúng.”", "C. “$P(41)$ đúng.”", "D. “$\\exists n \\in \\mathbb{N}, P(n)$ sai.”"], "answer": "A", "explain": "$P(0)$: $41$ là số nguyên tố nên đúng. $P(41) = 41^2 + 41 + 41 = 41 \\times 43$ là hợp số, vì vậy B và C sai; do $P(0)$ đúng nên D cũng sai."}, {"type": "truefalse", "level": "TH", "q": "Cho $A = \\{x \\in \\mathbb{N} \\mid x \\text{ là ước của } 12\\}$ và $B = \\{1; 2; 3; 6\\}$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $A = B$.", "b) $B \\subset A$.", "c) $A \\cap B = B$.", "d) Số phần tử của $A$ là $6$."], "answer": ["F", "T", "T", "T"], "explain": "$A = \\{1; 2; 3; 4; 6; 12\\}$. a) sai vì $4 \\in A$ nhưng $4 \\notin B$; b) đúng vì mọi phần tử của $B$ đều thuộc $A$; c) đúng vì $B \\subset A$; d) đúng vì $A$ có $6$ phần tử."}, {"type": "truefalse", "level": "VD", "q": "Cho $A = (-\\infty; 3]$, $B = [m; +\\infty)$ với $m \\in \\mathbb{R}$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Với $m = 5$, $A \\cap B = \\varnothing$.", "b) Với $m = 3$, $A \\cap B = \\{3\\}$.", "c) $A \\cup B = \\mathbb{R}$ với mọi $m$.", "d) $A \\cap B \\ne \\varnothing$ khi và chỉ khi $m \\le 3$."], "answer": ["T", "T", "F", "T"], "explain": "a) đúng vì $5$ lớn hơn $3$. b) đúng vì điểm chung duy nhất là $3$. c) sai, ví dụ $m = 5$ thì khoảng $(3; 5)$ không thuộc hợp. d) đúng vì hai tập có điểm chung khi $m \\le 3$."}, {"type": "short", "level": "VDC", "q": "Tập $A$ có $6$ phần tử. Có bao nhiêu tập con của $A$ có số phần tử là số chẵn?", "answer": "32", "explain": "Số tập con có số phần tử chẵn bằng số tập con có số phần tử lẻ, mỗi loại bằng một nửa tổng số tập con: $2^6 : 2 = 32$."}, {"type": "short", "level": "VDC", "q": "Cho $A = [m - 1; m + 1]$, $B = (0; 4)$ với $m \\in \\mathbb{R}$. Tìm tổng các giá trị nguyên của $m$ để $A \\subset B$.", "answer": "2", "explain": "$A \\subset B$ khi $m$ lớn tử?", "answer": "11", "explain": "$|U| = 21$, $|A| = 7$, $|B| = 5$, $|A \\cap B| = 2$ (là $0$ và $15$). Suy ra $|A \\cup B| = 7 + 5 - 2 = 10$, phần bù có $21 - 10 = 11$ phần tử."}, {"type": "short", "level": "VDC", "q": "Cho $A = \\{2; 3\\}$, $B = \\{x \\in \\mathbb{N} \\mid x \\text{ nhỏ hơn } m\\}$ với $m \\in \\mathbb{N}$. Tìm giá trị nguyên nhỏ nhất của $m$ để $A \\subset B$.", "answer": "4", "explain": "$A \\subset B$ khi mọi phần tử của $A$ đều nhỏ hơn $m$, tức $m$ lớn hơn $3$. Với $m \\in \\mathbb{N}$, giá trị nhỏ nhất là $m = 4$."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Mệnh đề phủ định của mệnh đề “Paris là thủ đô của nước Pháp” là:", "options": ["A. “Paris không là thủ đô của nước Pháp.”", "B. “Paris là thủ đô của nước Anh.”", "C. “London là thủ đô của nước Pháp.”", "D. “Mọi thành phố đều không là thủ đô.”"], "answer": "A", "explain": "Phủ định chỉ thêm từ “không” vào mệnh đề gốc, không bịa thêm thông tin mới như các đáp án B, C, D."}, {"type": "mcq", "level": "NB", "q": "Liệt kê các phần tử của tập $A = \\{x \\in \\mathbb{N} \\mid x \\text{ là ước của } 6\\}$:", "options": ["A. “$\\{1; 2; 3; 6\\}$.”", "B. “$\\{0; 1; 2; 3; 6\\}$.”", "C. “$\\{1; 2; 3\\}$.”", "D. “$\\{6; 12; 18; \\dots\\}$.”"], "answer": "A", "explain": "Các ước tự nhiên của $6$ là $1, 2, 3, 6$. Chú ý $0$ không là ước của số nào."}, {"type": "mcq", "level": "NB", "q": "Mệnh đề “$\\exists x \\in \\mathbb{R}, x + 1 = 0$” là mệnh đề:", "options": ["A. “Đúng.”", "B. “Sai.”", "C. “Chứa biến.”", "D. “Không xác định được tính đúng sai.”"], "answer": "A", "explain": "Tồn tại $x = -1 \\in \\mathbb{R}$ thỏa mãn $x + 1 = 0$ nên mệnh đề đúng."}, {"type": "mcq", "level": "TH", "q": "Mệnh đề kéo theo nào sau đây là mệnh đề sai?", "options": ["A. “Nếu $9$ là số nguyên tố thì $9$ chia hết cho $3$.”", "B. “Nếu $4$ là số lẻ thì $4 + 1$ là số chẵn.”", "C. “Nếu $6$ chia hết cho $2$ thì $6$ chia hết cho $4$.”", "D. “Nếu hình vuông có $4$ cạnh bằng nhau thì nó có $4$ góc vuông.”"], "answer": "C", "explain": "Mệnh đề kéo theo chỉ sai khi giả thiết đúng mà kết luận sai. Ở C: $6$ chia hết cho $2$ (đúng) nhưng $6$ không chia hết cho $4$ (sai)."}, {"type": "mcq", "level": "TH", "q": "Cho $A = \\{1; 3; 5; 7\\}$, $B = \\{2; 3; 6; 7\\}$. Tập $A \\cup B$ là:", "options": ["A. “$\\{1; 2; 3; 5; 6; 7\\}$.”", "B. “$\\{3; 7\\}$.”", "C. “$\\{1; 5\\}$.”", "D. “$\\{1; 2; 5; 6\\}$.”"], "answer": "A", "explain": "Hợp của hai tập gồm mọi phần tử thuộc ít nhất một trong hai tập, mỗi phần tử chỉ viết một lần."}, {"type": "mcq", "level": "VD", "q": "Cho $A$ có $6$ phần tử. Số tập con gồm đúng $4$ phần tử của $A$ là:", "options": ["A. “$15$.”", "B. “$24$.”", "C. “$30$.”", "D. “$12$.”"], "answer": "A", "explain": "Số tập con $4$ phần tử của tập $6$ phần tử là tổ hợp chập $4$ của $6$: $C(6, 4) = 15$."}, {"type": "truefalse", "level": "TH", "q": "Cho $A = [-2; 3)$, $B = (0; 5]$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $A \\cap B = (0; 3)$.", "b) $A \\cup B = [-2; 5]$.", "c) Hiệu $A \\setminus B = [-2; 0]$.", "d) Hiệu $B \\setminus A = (3; 5]$."], "answer": ["T", "T", "T", "F"], "explain": "Vẽ trên trục số: $A \\cap B = (0; 3)$; $A \\cup B = [-2; 5]$; $A \\setminus B = [-2; 0]$; còn $B \\setminus A = [3; 5]$ (lấy cả đầu mút $3$ vì $3 \\notin A$) nên d) sai."}, {"type": "truefalse", "level": "VD", "q": "Cho $P$: “Tứ giác $ABCD$ là hình chữ nhật”, $Q$: “Tứ giác $ABCD$ có hai đường chéo bằng nhau”. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mệnh đề $P \\Rightarrow Q$ đúng.", "b) Mệnh đề $Q \\Rightarrow P$ đúng.", "c) $P$ là điều kiện đủ của $Q$.", "d) $Q$ là điều kiện cần của $P$."], "answer": ["T", "F", "T", "T"], "explain": "Hình chữ nhật luôn có hai đường chéo bằng nhau nên a) đúng. Ngược lại sai: hình thang cân có hai đường chéo bằng nhau nhưng không là hình chữ nhật, nên b) sai. Từ đó c) và d) đúng."}, {"type": "short", "level": "VDC", "q": "Cho $A = [m; m + 1]$, $B = (0; 5)$ với $m \\in \\mathbb{R}$. Tìm tổng các giá trị nguyên của $m$ để $A \\subset B$.", "answer": "6", "explain": "$A \\subset B$ khi $m$ lớn hơn $0$ và $m + 1$ nhỏ hơn $5$, tức $m$ lớn hơn $0$ và nhỏ hơn $4$. Các giá trị nguyên là $1, 2, 3$; tổng bằng $6$."}, {"type": "short", "level": "VDC", "q": "Lớp $10A$ có $40$ học sinh. Có $25$ bạn thích Toán, $20$ bạn thích Văn, $8$ bạn thích cả hai môn. Hỏi có bao nhiêu bạn không thích cả hai môn?", "answer": "3", "explain": "Số bạn thích ít nhất một môn: $25 + 20 - 8 = 37$. Số bạn không thích cả hai môn: $40 - 37 = 3$."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các câu sau, câu nào là mệnh đề đúng?", "options": ["A. “$5$ là số chẵn.”", "B. “$9$ là số nguyên tố.”", "C. “$\\sqrt{9} = 3$.”", "D. “Trời hôm nay thế nào?”"], "answer": "C", "explain": "A sai ($5$ lẻ), B sai ($9 = 3 \\times 3$), D là câu hỏi. Chỉ có C là mệnh đề đúng."}, {"type": "mcq", "level": "NB", "q": "Cho $A = \\{1; 2\\}$, $B = \\{1; 2; 3\\}$. Khẳng định nào sau đây sai?", "options": ["A. “$A \\subset B$.”", "B. “$\\{1; 2\\} \\subset B$.”", "C. “$B \\subset A$.”", "D. “$3 \\in B$.”"], "answer": "C", "explain": "$3 \\in B$ nhưng $3 \\notin A$ nên $B$ không là tập con của $A$. Các khẳng định còn lại đều đúng."}, {"type": "mcq", "level": "NB", "q": "Mệnh đề phủ định của mệnh đề “Mọi số thực đều có bình phương không âm” là:", "options": ["A. “Mọi số thực đều có bình phương âm.”", "B. “Tồn tại số thực có bình phương âm.”", "C. “Không có số thực nào có bình phương không âm.”", "D. “Mọi số thực đều có bình phương dương.”"], "answer": "B", "explain": "Phủ định của “mọi” là “tồn tại (có ít nhất một)”, phủ định của “không âm” là “âm”. Đáp án B diễn đạt đúng."}, {"type": "mcq", "level": "TH", "q": "Tập $(-\\infty; 2] \\cup [0; +\\infty)$ bằng tập nào sau đây?", "options": ["A. “$\\mathbb{R}$.”", "B. “$[0; 2]$.”", "C. “$\\varnothing$.”", "D. “$(2; +\\infty)$.”"], "answer": "A", "explain": "Mọi số thực $x$ hoặc không vượt quá $2$, hoặc không nhỏ hơn $0$ (hai khoảng phủ kín nhau tại $[0; 2]$), nên hợp bằng $\\mathbb{R}$."}, {"type": "mcq", "level": "TH", "q": "Với $n \\in \\mathbb{N}$, khẳng định nào sau đây đúng?", "options": ["A. “$n$ chia hết cho $4$ là điều kiện cần để $n$ chia hết cho $2$.”", "B. “$n$ chia hết cho $6$ là điều kiện đủ để $n$ chia hết cho $3$.”", "C. “$n$ chia hết cho $2$ là điều kiện đủ để $n$ chia hết cho $4$.”", "D. “$n$ là số lẻ là điều kiện cần và đủ để $n$ chia hết cho $3$.”"], "answer": "B", "explain": "$n$ chia hết cho $6$ thì chắc chắn chia hết cho $3$ nên B đúng. A sai (đó là điều kiện đủ); C sai (ví dụ $n = 2$); D sai (ví dụ $n = 5$)."}, {"type": "mcq", "level": "VD", "q": "Mệnh đề nào sau đây là mệnh đề đúng?", "options": ["A. “$\\forall x \\in \\mathbb{R}, x^2 + 2x + 1 \\ge 0$.”", "B. “$\\exists x \\in \\mathbb{R}, x^2 + x + 1 = 0$.”", "C. “$\\forall n \\in \\mathbb{N}, n^2 + 1$ là số nguyên tố.”", "D. “$\\exists x \\in \\mathbb{Q}, x^2 = 2$.”"], "answer": "A", "explain": "A đúng vì $x^2 + 2x + 1 = (x + 1)^2 \\ge 0$. B sai vì $x^2 + x + 1 = 0$ vô nghiệm ($\\Delta$ âm). C sai vì $n = 3$ cho $10$ là hợp số. D sai vì $\\sqrt{2}$ là số vô tỉ."}, {"type": "truefalse", "level": "TH", "q": "Cho $A = \\{x \\in \\mathbb{Z} \\mid -2 \\le x \\le 2\\}$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số phần tử của $A$ là $5$.", "b) $3 \\in A$.", "c) $\\{-1; 0\\} \\subset A$.", "d) $A \\cap \\mathbb{N} = \\{0; 1; 2\\}$."], "answer": ["T", "F", "T", "T"], "explain": "$A = \\{-2; -1; 0; 1; 2\\}$. a) đúng; b) sai vì $3 \\notin A$; c) đúng; d) đúng vì các số tự nhiên trong $A$ là $0, 1, 2$."}, {"type": "truefalse", "level": "VD", "q": "Cho $A = [m; 2m + 1]$ với $m \\in \\mathbb{R}$, $B = (-1; 4)$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $A$ khác rỗng khi và chỉ khi $m \\ge -1$.", "b) Với $m = 1$, $A \\cap B = [1; 3]$.", "c) Để $A \\subset B$ cần có $m$ lớn hơn $-1$ và $2m + 1$ nhỏ hơn $4$.", "d) Không tồn tại $m$ để $A \\subset B$."], "answer": ["T", "T", "T", "F"], "explain": "a) đúng vì $m \\le 2m + 1 \\Leftrightarrow m \\ge -1$. b) đúng: $A = [1; 3] \\subset B$. c) đúng vì cần $m$ lớn hơn $-1$ và $2m + 1$ nhỏ hơn $4$. d) sai, ví dụ $m = 0$ thì $A = [0; 1] \\subset (-1; 4)$."}, {"type": "short", "level": "VDC", "q": "Cho $A = \\{x \\in \\mathbb{R} \\mid (x^2 - 4)(x^2 - 1) = 0\\}$, $B = \\{x \\in \\mathbb{Z} \\mid |x| \\text{ nhỏ hơn } 3\\}$. Tập $A \\cap B$ có bao nhiêu phần tử?", "answer": "4", "explain": "$A = \\{-2; -1; 1; 2\\}$, $B = \\{-2; -1; 0; 1; 2\\}$. Giao của hai tập là $\\{-2; -1; 1; 2\\}$ có $4$ phần tử."}, {"type": "short", "level": "VDC", "q": "Trong các mệnh đề sau có bao nhiêu mệnh đề đúng? (1) $\\forall x \\in \\mathbb{R}, x^2 \\ge x$. (2) $\\exists x \\in \\mathbb{Z}, x^2 = 2$. (3) $\\forall n \\in \\mathbb{N}, n(n+1)$ chia hết cho $2$. (4) $\\exists x \\in \\mathbb{R}, |x|$ nhỏ hơn $0$.", "answer": "1", "explain": "(1) sai (ví dụ $x = 0{,}5$); (2) sai (không có số nguyên nào bình phương bằng $2$); (3) đúng vì $n(n+1)$ là tích hai số tự nhiên liên tiếp; (4) sai vì $|x| \\ge 0$. Chỉ có $1$ mệnh đề đúng."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Câu nào sau đây là mệnh đề sai?", "options": ["A. “$3 + 4 = 7$.”", "B. “$5$ là số chẵn.”", "C. “$10$ chia hết cho $2$.”", "D. “Hình tam giác có $3$ cạnh.”"], "answer": "B", "explain": "$5$ là số lẻ nên câu “$5$ là số chẵn” là mệnh đề sai. Các câu còn lại đều là mệnh đề đúng."}, {"type": "mcq", "level": "NB", "q": "Số nào sau đây thuộc tập $\\mathbb{Z}$ nhưng không thuộc tập $\\mathbb{N}$?", "options": ["A. “$0$.”", "B. “$-3$.”", "C. “$5$.”", "D. “$1{,}5$.”"], "answer": "B", "explain": "$-3$ là số nguyên âm nên thuộc $\\mathbb{Z}$ nhưng không thuộc $\\mathbb{N}$ (theo chương trình, $0 \\in \\mathbb{N}$). $1{,}5$ không thuộc $\\mathbb{Z}$."}, {"type": "mcq", "level": "NB", "q": "Cho mệnh đề $P$: “Nếu $a = b$ thì $a^2 = b^2$”. Mệnh đề đảo của $P$ là:", "options": ["A. “Nếu $a^2 = b^2$ thì $a = b$.”", "B. “Nếu $a \\ne b$ thì $a^2 \\ne b^2$.”", "C. “Nếu $a = b$ thì $a^2 \\ne b^2$.”", "D. “$a = b$ khi và chỉ khi $a^2 = b^2$.”"], "answer": "A", "explain": "Mệnh đề đảo đổi vai trò giả thiết và kết luận cho nhau. Chú ý mệnh đề đảo này là mệnh đề sai (ví dụ $a = 2, b = -2$)."}, {"type": "mcq", "level": "TH", "q": "Cho $U = \\{1; 2; 3; 4; 5; 6\\}$, $A = \\{2; 4; 6\\}$. Phần bù của $A$ trong $U$ là:", "options": ["A. “$\\{1; 3; 5\\}$.”", "B. “$\\{2; 4; 6\\}$.”", "C. “$\\{1; 2; 3\\}$.”", "D. “$\\varnothing$.”"], "answer": "A", "explain": "Phần bù $C_U A = U \\setminus A$ gồm các phần tử của $U$ không thuộc $A$: $\\{1; 3; 5\\}$."}, {"type": "mcq", "level": "TH", "q": "Tập $[-1; 3)$ gồm các số thực $x$ thỏa mãn:", "options": ["A. “$x$ lớn hơn hoặc bằng $-1$ và nhỏ hơn $3$.”", "B. “$x$ lớn hơn $-1$ và nhỏ hơn hoặc bằng $3$.”", "C. “$x$ lớn hơn hoặc bằng $-1$ và nhỏ hơn hoặc bằng $3$.”", "D. “$x$ nhỏ hơn $-1$ hoặc lớn hơn $3$.”"], "answer": "A", "explain": "Dấu $[$ nghĩa là lấy đầu mút $-1$, dấu $)$ nghĩa là không lấy đầu mút $3$."}, {"type": "mcq", "level": "VD", "q": "Cho $A = \\{x \\in \\mathbb{R} \\mid (x - 1)(x - 3) = 0\\}$, $B = \\{x \\in \\mathbb{Z} \\mid |x| \\le 2\\}$. Tập $A \\cap B$ là:", "options": ["A. “$\\{1\\}$.”", "B. “$\\{1; 3\\}$.”", "C. “$\\{-2; -1; 0; 1; 2\\}$.”", "D. “$\\varnothing$.”"], "answer": "A", "explain": "$A = \\{1; 3\\}$, $B = \\{-2; -1; 0; 1; 2\\}$. Phần tử chung duy nhất là $1$."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các mệnh đề sau:", "statements": ["a) “$17$ là số nguyên tố.”", "b) “$\\pi$ là số hữu tỉ.”", "c) “Hình vuông có bốn cạnh bằng nhau.”", "d) “$\\sqrt{2}$ là số vô tỉ.”"], "answer": ["T", "F", "T", "T"], "explain": "a) đúng; b) sai vì $\\pi$ là số vô tỉ; c) đúng theo định nghĩa hình vuông; d) đúng."}, {"type": "truefalse", "level": "VD", "q": "Cho $A = [m - 2; 5]$, $B = (3; m + 2)$ với $m \\in \\mathbb{R}$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Với $m = 4$, $A = [2; 5]$ và $A \\cap B = (3; 5]$.", "b) Với $m = 1$, $B = \\varnothing$ nên $A \\cap B = \\varnothing$.", "c) $A \\cap B \\ne \\varnothing$ với mọi $m$.", "d) Với $m = 6$, $A \\cup B = [4; 8)$."], "answer": ["T", "T", "F", "T"], "explain": "a) đúng. b) đúng vì $(3; 3) = \\varnothing$. c) sai vì với $m = 1$ giao bằng rỗng. d) đúng: $A = [4; 5]$, $B = (3; 8)$."}, {"type": "short", "level": "VDC", "q": "Cho $A = [-5; 2)$, $B = (-1; 6]$. Tính tổng các số nguyên thuộc tập hiệu $A \\setminus B$.", "answer": "-15", "explain": "$A \\setminus B = [-5; -1]$. Các số nguyên thuộc tập này là $-5, -4, -3, -2, -1$; tổng bằng $-15$."}, {"type": "short", "level": "VDC", "q": "Hai tập $A$ và $B$ rời nhau, $A$ có $3$ phần tử, $A \\cup B$ có $32$ tập con. Hỏi $B$ có bao nhiêu phần tử?", "answer": "2", "explain": "$A \\cup B$ có $32 = 2^5$ tập con nên có $5$ phần tử. Vì $A$ và $B$ rời nhau: $|B| = 5 - 3 = 2$."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các câu sau, câu nào là mệnh đề chứa biến?", "options": ["A. “$x + 3 = 7$.”", "B. “$7$ là số nguyên tố.”", "C. “$2^3 = 8$.”", "D. “Tam giác đều có ba góc bằng nhau.”"], "answer": "A", "explain": "Câu A chứa biến $x$, tính đúng sai phụ thuộc vào giá trị của $x$. Các câu còn lại có tính đúng sai xác định."}, {"type": "mcq", "level": "NB", "q": "Hai tập hợp nào sau đây bằng nhau?", "options": ["A. “$\\{1; 2\\}$ và $\\{2; 1; 1\\}$.”", "B. “$\\{1; 2\\}$ và $\\{1; 2; 3\\}$.”", "C. “$\\varnothing$ và $\\{0\\}$.”", "D. “$\\{a; b\\}$ và $\\{b; c\\}$.”"], "answer": "A", "explain": "Trong tập hợp, thứ tự liệt kê không quan trọng và mỗi phần tử chỉ tính một lần, nên $\\{2; 1; 1\\} = \\{1; 2\\}$."}, {"type": "mcq", "level": "NB", "q": "Mệnh đề phủ định của mệnh đề “Nếu trời mưa thì đường ướt” là:", "options": ["A. “Nếu trời không mưa thì đường không ướt.”", "B. “Trời mưa nhưng đường không ướt.”", "C. “Trời không mưa nhưng đường ướt.”", "D. “Nếu đường ướt thì trời mưa.”"], "answer": "B", "explain": "Phủ định của $P \\Rightarrow Q$ là “$P$ đúng mà $Q$ sai”: trời mưa nhưng đường không ướt."}, {"type": "mcq", "level": "TH", "q": "Tập $(1; 5) \\cap [3; 8)$ là:", "options": ["A. “$[3; 5)$.”", "B. “$(1; 8)$.”", "C. “$(1; 3)$.”", "D. “$[5; 8)$.”"], "answer": "A", "explain": "Phần chung của hai khoảng là $[3; 5)$: lấy đầu mút $3$ (thuộc cả hai) và bỏ đầu mút $5$ (không thuộc $(1; 5)$)."}, {"type": "mcq", "level": "TH", "q": "Mệnh đề phủ định của mệnh đề “Nếu $a$ chia hết cho $2$ và $a$ chia hết cho $3$ thì $a$ chia hết cho $6$” là:", "options": ["A. “$a$ chia hết cho $2$ và $a$ chia hết cho $3$ nhưng $a$ không chia hết cho $6$.”", "B. “Nếu $a$ không chia hết cho $6$ thì $a$ không chia hết cho $2$ hoặc không chia hết cho $3$.”", "C. “$a$ không chia hết cho $2$ hoặc không chia hết cho $3$.”", "D. “Nếu $a$ chia hết cho $6$ thì $a$ chia hết cho $2$ và $3$.”"], "answer": "A", "explain": "Phủ định của mệnh đề kéo theo $P \\Rightarrow Q$ là “$P$ đúng và $Q$ sai”. Đáp án D là mệnh đề đảo, không phải mệnh đề phủ định."}, {"type": "mcq", "level": "VD", "q": "Cho $P$: “$a$ chia hết cho $3$”, $Q$: “$a$ chia hết cho $9$” với $a \\in \\mathbb{N}$. Có bao nhiêu khẳng định sau đây đúng? (I) $P \\Rightarrow Q$ đúng. (II) $Q \\Rightarrow P$ đúng. (III) $P$ là điều kiện cần của $Q$. (IV) $Q$ là điều kiện đủ của $P$.", "options": ["A. “$1$.”", "B. “$2$.”", "C. “$3$.”", "D. “$4$.”"], "answer": "C", "explain": "(I) sai vì $a = 3$ chia hết cho $3$ nhưng không chia hết cho $9$. (II) đúng; (III) đúng vì $Q \\Rightarrow P$ đúng; (IV) đúng. Vậy có $3$ khẳng định đúng."}, {"type": "truefalse", "level": "TH", "q": "Cho $A = (2; 6]$, $B = [4; 9)$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $A \\cap B = [4; 6]$.", "b) $A \\cup B = (2; 9)$.", "c) Hiệu $A \\setminus B = (2; 4)$.", "d) $2 \\in A$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng theo quy tắc giao, hợp, hiệu trên trục số. d) sai vì $2 \\notin (2; 6]$."}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các mệnh đề sau:", "statements": ["a) “$6$ là ước của $18$.”", "b) “Mọi bội của $3$ đều là bội của $6$.”", "c) “Nếu $n$ chia hết cho $6$ thì $n$ chia hết cho $3$.”", "d) “$n$ chia hết cho $3$” là điều kiện cần để “$n$ chia hết cho $6$”."], "answer": ["T", "F", "T", "T"], "explain": "a) đúng vì $18 = 6 \\times 3$. b) sai (ví dụ $9$). c) đúng. d) đúng vì $n$ chia hết cho $6$ thì chắc chắn chia hết cho $3$."}, {"type": "short", "level": "VDC", "q": "Cho $A = \\{1; 2; 3; 4; 5\\}$. Có bao nhiêu tập con của $A$ không chứa phần tử $1$?", "answer": "16", "explain": "Tập con không chứa $1$ chính là tập con của $\\{2; 3; 4; 5\\}$, có $2^4 = 16$ tập."}, {"type": "short", "level": "VDC", "q": "Cho $A = \\{x \\in \\mathbb{R} \\mid x \\text{ nhỏ hơn } m\\}$, $B = \\{x \\in \\mathbb{R} \\mid x \\ge 5\\}$ với $m \\in \\mathbb{R}$. Tìm giá trị nguyên nhỏ nhất của $m$ để phần bù của $A \\cup B$ trong $\\mathbb{R}$ bằng $\\varnothing$.", "answer": "6", "explain": "Phần bù bằng rỗng nghĩa là $A \\cup B = \\mathbb{R}$, điều này xảy ra khi $m$ lớn hơn $5$. Giá trị nguyên nhỏ nhất là $m = 6$."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Câu nào sau đây là mệnh đề đúng?", "options": ["A. “$\\sqrt{9} = 3$.”", "B. “$4$ là số nguyên tố.”", "C. “$1 + 1 = 3$.”", "D. “$0$ là số nguyên dương.”"], "answer": "A", "explain": "B sai ($4 = 2 \\times 2$), C sai, D sai vì $0$ không là số nguyên dương. Chỉ có A đúng."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây đúng?", "options": ["A. “$\\{1\\} \\in \\{1; 2\\}$.”", "B. “$\\{1\\} \\subset \\{1; 2\\}$.”", "C. “$1 \\subset \\{1; 2\\}$.”", "D. “$\\{1; 2\\} \\in \\{1; 2\\}$.”"], "answer": "B", "explain": "Quan hệ giữa hai tập hợp dùng kí hiệu $\\subset$; quan hệ giữa phần tử và tập hợp dùng $\\in$. $1 \\in \\{1; 2\\}$ và $\\{1\\} \\subset \\{1; 2\\}$."}, {"type": "mcq", "level": "NB", "q": "Mệnh đề phủ định của mệnh đề “An cao hơn Bình” là:", "options": ["A. “An thấp hơn Bình.”", "B. “An không cao hơn Bình.”", "C. “Bình cao hơn An.”", "D. “An và Bình cao bằng nhau.”"], "answer": "B", "explain": "Phủ định chỉ thêm từ “không”, không suy diễn thêm. “An không cao hơn Bình” bao gồm cả trường hợp thấp hơn và bằng nhau."}, {"type": "mcq", "level": "TH", "q": "Cho $A = \\{1; 3; 5\\}$, $B = \\{2; 3; 4\\}$. Tập $A \\cup B$ là:", "options": ["A. “$\\{1; 2; 3; 4; 5\\}$.”", "B. “$\\{3\\}$.”", "C. “$\\{1; 2; 4; 5\\}$.”", "D. “$\\{1; 5\\}$.”"], "answer": "A", "explain": "Hợp gồm mọi phần tử của cả hai tập, mỗi phần tử viết một lần: $\\{1; 2; 3; 4; 5\\}$."}, {"type": "mcq", "level": "TH", "q": "Mệnh đề “$\\forall x \\in \\mathbb{R}, (x - 1)^2 \\ge 0$” là mệnh đề:", "options": ["A. “Đúng.”", "B. “Sai.”", "C. “Chứa biến.”", "D. “Không phải mệnh đề.”"], "answer": "A", "explain": "Bình phương của mọi số thực đều không âm nên mệnh đề đúng với mọi $x \\in \\mathbb{R}$."}, {"type": "mcq", "level": "VD", "q": "Cho $A = [2m - 1; 5]$, $B = (3; 7)$ với $m = 2$. Tập $A \\cap B$ là:", "options": ["A. “$(3; 5]$.”", "B. “$[3; 5]$.”", "C. “$(3; 7)$.”", "D. “$[2; 5]$.”"], "answer": "A", "explain": "Với $m = 2$ thì $A = [3; 5]$. Giao với $B = (3; 7)$ được $(3; 5]$ (bỏ $3$ vì $3 \\notin B$, lấy $5$ vì $5 \\in A$)."}, {"type": "truefalse", "level": "TH", "q": "Cho $U = \\{x \\in \\mathbb{N} \\mid x \\le 6\\}$, $A = \\{1; 2; 3\\}$, $B = \\{3; 4; 5\\}$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $A \\cup B = \\{1; 2; 3; 4; 5\\}$.", "b) $A \\cap B = \\{3\\}$.", "c) Phần bù của $A$ trong $U$ là $\\{0; 4; 5; 6\\}$.", "d) Hiệu $B \\setminus A = \\{4; 5; 6\\}$."], "answer": ["T", "T", "T", "F"], "explain": "$U = \\{0; 1; 2; 3; 4; 5; 6\\}$. a), b), c) đúng. d) sai vì $B \\setminus A = \\{4; 5\\}$ ($6 \\notin B$)."}, {"type": "truefalse", "level": "VD", "q": "Cho định lí: “$\\forall n \\in \\mathbb{N}$, nếu $n^2$ chia hết cho $3$ thì $n$ chia hết cho $3$”. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giả thiết của định lí là “$n^2$ chia hết cho $3$”.", "b) Kết luận của định lí là “$n$ chia hết cho $3$”.", "c) Mệnh đề đảo của định lí trên là mệnh đề đúng.", "d) “$n^2$ chia hết cho $3$” là điều kiện đủ nhưng không cần để “$n$ chia hết cho $3$”."], "answer": ["T", "T", "T", "F"], "explain": "a), b) đúng theo cấu trúc định lí. c) đúng vì nếu $n$ chia hết cho $3$ thì $n^2$ chia hết cho $9$, do đó chia hết cho $3$. d) sai vì nó vừa là điều kiện đủ vừa là điều kiện cần."}, {"type": "short", "level": "VDC", "q": "Cho $A = \\{x \\in \\mathbb{N} \\mid x \\text{ là bội của } 3 \\text{ và } x \\text{ nhỏ hơn } 25\\}$. Tập $A$ có bao nhiêu tập con gồm đúng $2$ phần tử?", "answer": "36", "explain": "$A = \\{0; 3; 6; 9; 12; 15; 18; 21; 24\\}$ có $9$ phần tử. Số tập con $2$ phần tử là $C(9, 2) = 36$."}, {"type": "short", "level": "VDC", "q": "Lớp $10B$ có $50$ học sinh. Có $30$ bạn thích bóng đá, $25$ bạn thích cầu lông, $10$ bạn thích cả hai môn. Hỏi có bao nhiêu bạn không thích cả hai môn?", "answer": "5", "explain": "Số bạn thích ít nhất một môn: $30 + 25 - 10 = 45$. Số bạn không thích cả hai môn: $50 - 45 = 5$."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Câu nào sau đây không phải là mệnh đề?", "options": ["A. “$7$ là số lẻ.”", "B. “Hôm nay bạn có vui không?”", "C. “$2 + 3 = 5$.”", "D. “$10$ chia hết cho $5$.”"], "answer": "B", "explain": "Câu B là câu hỏi nên không có tính đúng sai, không phải mệnh đề. Các câu còn lại đều là mệnh đề đúng."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây đúng?", "options": ["A. “$\\mathbb{N} \\subset \\mathbb{Z}$.”", "B. “$\\mathbb{Z} \\subset \\mathbb{N}$.”", "C. “$\\mathbb{Q} \\subset \\mathbb{Z}$.”", "D. “$\\mathbb{N} = \\mathbb{Z}$.”"], "answer": "A", "explain": "Mọi số tự nhiên đều là số nguyên nên $\\mathbb{N} \\subset \\mathbb{Z}$. Ta có $\\mathbb{N} \\subset \\mathbb{Z} \\subset \\mathbb{Q} \\subset \\mathbb{R}$."}, {"type": "mcq", "level": "TH", "q": "Mệnh đề phủ định của mệnh đề “$\\exists x \\in \\mathbb{Q}, x^2 = 3$” là:", "options": ["A. “$\\forall x \\in \\mathbb{Q}, x^2 \\ne 3$.”", "B. “$\\exists x \\in \\mathbb{Q}, x^2 \\ne 3$.”", "C. “$\\forall x \\in \\mathbb{Q}, x^2 = 3$.”", "D. “Không tồn tại $x \\in \\mathbb{R}$ sao cho $x^2 = 3$.”"], "answer": "A", "explain": "Phủ định của $\\exists$ là $\\forall$, phủ định của “$=$” là “$\\ne$”. Đáp án A là mệnh đề đúng vì $\\sqrt{3}$ là số vô tỉ."}, {"type": "mcq", "level": "TH", "q": "Tập $[1; 6) \\setminus (3; 8]$ là:", "options": ["A. “$[1; 3]$.”", "B. “$(3; 6)$.”", "C. “$[1; 8]$.”", "D. “$(1; 3]$.”"], "answer": "A", "explain": "Lấy các phần tử của $[1; 6)$ mà không thuộc $(3; 8]$: được $[1; 3]$ (giữ đầu mút $1$, lấy cả $3$ vì $3 \\notin (3; 8]$)."}, {"type": "mcq", "level": "NB", "q": "Mệnh đề kéo theo nào sau đây là mệnh đề đúng?", "options": ["A. “Nếu $2 + 2 = 5$ thì Hà Nội là thủ đô của Pháp.”", "B. “Nếu $3$ là số lẻ thì $3 + 1$ là số lẻ.”", "C. “Nếu $8$ chia hết cho $2$ thì $8$ chia hết cho $3$.”", "D. “Nếu $5$ là số lẻ thì $5$ là số chẵn.”"], "answer": "A", "explain": "A có dạng “sai kéo theo sai” nên đúng. B, C, D đều có dạng “đúng kéo theo sai” nên sai."}, {"type": "mcq", "level": "VD", "q": "Cho $A$ có $4$ phần tử. Số tập con có ít nhất $3$ phần tử của $A$ là:", "options": ["A. “$5$.”", "B. “$11$.”", "C. “$6$.”", "D. “$4$.”"], "answer": "A", "explain": "Số tập con $3$ phần tử là $C(4, 3) = 4$, số tập con $4$ phần tử là $C(4, 4) = 1$. Tổng bằng $5$."}, {"type": "truefalse", "level": "TH", "q": "Cho $A = \\{x \\in \\mathbb{N}^* \\mid x \\text{ nhỏ hơn } 5\\}$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $0 \\in A$.", "b) $\\{2; 4\\} \\subset A$.", "c) Số phần tử của $A$ là $4$.", "d) $A = \\{4; 3; 2; 1\\}$."], "answer": ["F", "T", "T", "T"], "explain": "$A = \\{1; 2; 3; 4\\}$. a) sai vì $0 \\notin \\mathbb{N}^*$. b), c), d) đúng (thứ tự liệt kê không quan trọng)."}, {"type": "truefalse", "level": "VD", "q": "Cho $A = [-4; 1)$, $B = (-2; 3]$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $A \\cap B = (-2; 1)$.", "b) $A \\cup B = [-4; 3]$.", "c) Hiệu $A \\setminus B = [-4; -2]$.", "d) Hiệu $A \\setminus B = [-4; -2)$."], "answer": ["T", "T", "T", "F"], "explain": "a), b) đúng. c) đúng vì $-2 \\notin B$ nên $-2$ thuộc hiệu. d) sai vì thiếu đầu mút $-2$."}, {"type": "short", "level": "VDC", "q": "Cho $A = \\{x \\in \\mathbb{R} \\mid |x - 1| \\text{ nhỏ hơn } 2\\}$, $B = \\{x \\in \\mathbb{Z} \\mid x^2 \\le 10\\}$. Tập $A \\cap B$ có bao nhiêu phần tử?", "answer": "3", "explain": "$A = (-1; 3)$, $B = \\{-3; -2; -1; 0; 1; 2; 3\\}$. Các số nguyên thuộc $A$ là $0, 1, 2$ nên giao có $3$ phần tử."}, {"type": "short", "level": "VDC", "q": "Cho $A = (m - 2; 5)$, $B = [3; m + 4]$ với $m \\in \\mathbb{R}$. Có bao nhiêu giá trị nguyên của $m$ trong đoạn $[-5; 10]$ để $A \\cap B = \\varnothing$?", "answer": "8", "explain": "$A \\cap B = \\varnothing$ khi $A = \\varnothing$ ($m$ lớn hơn hoặc bằng $7$) hoặc $B = \\varnothing$ ($m$ nhỏ hơn $-1$); khi cả hai khác rỗng chúng luôn có điểm chung. Trong $[-5; 10]$ có $4 + 4 = 8$ giá trị: $-5, -4, -3, -2, 7, 8, 9, 10$."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Câu nào sau đây là mệnh đề sai?", "options": ["A. “$3 + 4 = 8$.”", "B. “$6$ là số chẵn.”", "C. “$11$ là số nguyên tố.”", "D. “$0 \\in \\mathbb{N}$.”"], "answer": "A", "explain": "$3 + 4 = 7 \\ne 8$ nên câu A là mệnh đề sai. Các câu còn lại đều là mệnh đề đúng."}, {"type": "mcq", "level": "NB", "q": "Tập nào sau đây là tập rỗng?", "options": ["A. “$\\{x \\in \\mathbb{N} \\mid x \\text{ nhỏ hơn } 0\\}$.”", "B. “$\\{x \\in \\mathbb{Z} \\mid x^2 = 4\\}$.”", "C. “$\\{0\\}$.”", "D. “$\\{x \\in \\mathbb{N} \\mid x + 1 = 2\\}$.”"], "answer": "A", "explain": "Không có số tự nhiên nào nhỏ hơn $0$ nên tập ở A rỗng. B $= \\{-2; 2\\}$, C $= \\{0\\}$ có một phần tử, D $= \\{1\\}$."}, {"type": "mcq", "level": "NB", "q": "Mệnh đề $P \\Leftrightarrow Q$ là mệnh đề sai khi nào?", "options": ["A. “Khi $P$ đúng và $Q$ đúng.”", "B. “Khi $P$ sai và $Q$ sai.”", "C. “Khi một trong hai mệnh đề $P, Q$ đúng và mệnh đề còn lại sai.”", "D. “Khi $P \\Rightarrow Q$ đúng.”"], "answer": "C", "explain": "$P \\Leftrightarrow Q$ đúng khi $P, Q$ cùng đúng hoặc cùng sai; sai khi một đúng một sai."}, {"type": "mcq", "level": "TH", "q": "Tập $(-3; +\\infty) \\cap (-\\infty; 2]$ là:", "options": ["A. “$(-3; 2]$.”", "B. “$\\mathbb{R}$.”", "C. “$(-3; 2)$.”", "D. “$[-3; 2]$.”"], "answer": "A", "explain": "Phần chung của hai tập là $(-3; 2]$: bỏ đầu mút $-3$, lấy đầu mút $2$."}, {"type": "mcq", "level": "TH", "q": "Mệnh đề phủ định của mệnh đề “$\\forall x \\in \\mathbb{R}$, $x^2 + 1$ là số dương” là:", "options": ["A. “$\\exists x \\in \\mathbb{R}$, $x^2 + 1$ không là số dương.”", "B. “$\\forall x \\in \\mathbb{R}$, $x^2 + 1$ không là số dương.”", "C. “$\\forall x \\in \\mathbb{R}$, $x^2 + 1$ là số âm.”", "D. “$\\exists x \\in \\mathbb{R}$, $x^2 + 1$ là số dương.”"], "answer": "A", "explain": "Phủ định của $\\forall$ là $\\exists$, phủ định của “là số dương” là “không là số dương” (tức nhỏ hơn hoặc bằng $0$)."}, {"type": "mcq", "level": "VD", "q": "Có bao nhiêu khẳng định sau đây đúng? (I) $\\varnothing \\subset \\{\\varnothing\\}$. (II) $\\{\\varnothing\\} \\subset \\{\\varnothing\\}$. (III) $\\varnothing \\in \\{\\varnothing\\}$. (IV) $\\varnothing = \\{\\varnothing\\}$.", "options": ["A. “$1$.”", "B. “$2$.”", "C. “$3$.”", "D. “$4$.”"], "answer": "C", "explain": "(I) đúng vì tập rỗng là tập con của mọi tập. (II) đúng vì mọi tập đều là tập con của chính nó. (III) đúng vì $\\varnothing$ là phần tử của $\\{\\varnothing\\}$. (IV) sai vì $\\{\\varnothing\\}$ có một phần tử còn $\\varnothing$ không có phần tử nào."}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các mệnh đề sau:", "statements": ["a) “Số $0$ là số tự nhiên.”", "b) “Mọi số nguyên tố đều là số lẻ.”", "c) “Tồn tại số nguyên chia hết cho $7$.”", "d) “Bình phương của mọi số thực đều là số dương.”"], "answer": ["T", "F", "T", "F"], "explain": "a) đúng. b) sai vì $2$ là số nguyên tố chẵn. c) đúng (ví dụ $7$). d) sai vì $0^2 = 0$ không là số dương."}, {"type": "truefalse", "level": "VD", "q": "Cho $A = \\{x \\in \\mathbb{Z} \\mid x^2 \\le 9\\}$, $B = \\{x \\in \\mathbb{N} \\mid x \\text{ là số lẻ và } x \\text{ nhỏ hơn } 8\\}$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $A \\cap B = \\{1; 3\\}$.", "b) $A \\cup B$ có $9$ phần tử.", "c) Hiệu $A \\setminus B = \\{-3; -2; -1; 0; 2\\}$.", "d) $B \\subset A$."], "answer": ["T", "T", "T", "F"], "explain": "$A = \\{-3; -2; -1; 0; 1; 2; 3\\}$, $B = \\{1; 3; 5; 7\\}$. a) đúng; b) đúng vì hợp có $9$ phần tử; c) đúng; d) sai vì $5, 7 \\notin A$."}, {"type": "short", "level": "VDC", "q": "Cho $A = [m; +\\infty)$, $B = (-\\infty; 2m - 3]$ với $m \\in \\mathbb{R}$. Tìm giá trị nguyên nhỏ nhất của $m$ để $A \\cap B \\ne \\varnothing$.", "answer": "3", "explain": "$A \\cap B \\ne \\varnothing$ khi $m \\le 2m - 3$, tức $m$ lớn hơn hoặc bằng $3$. Giá trị nguyên nhỏ nhất là $3$."}, {"type": "short", "level": "VDC", "q": "Lớp $10C$ có $45$ học sinh. Có $28$ bạn học giỏi Toán, $25$ bạn học giỏi Lý, $12$ bạn học giỏi cả hai môn. Hỏi có bao nhiêu bạn không giỏi môn nào trong hai môn trên?", "answer": "4", "explain": "Số bạn giỏi ít nhất một môn: $28 + 25 - 12 = 41$. Số bạn không giỏi môn nào: $45 - 41 = 4$."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các câu sau, câu nào là mệnh đề chứa biến?", "options": ["A. “$2x - 1 = 5$.”", "B. “$8$ chia hết cho $4$.”", "C. “$\\sqrt{16} = 4$.”", "D. “$15$ là hợp số.”"], "answer": "A", "explain": "Câu A chứa biến $x$ nên tính đúng sai phụ thuộc vào $x$. Các câu còn lại đều là mệnh đề đúng."}, {"type": "mcq", "level": "NB", "q": "Khẳng định nào sau đây đúng?", "options": ["A. “$\\{a\\} \\subset \\{a; b\\}$.”", "B. “$a \\subset \\{a; b\\}$.”", "C. “$\\{a\\} \\in \\{a; b\\}$.”", "D. “$\\{a; b\\} \\subset \\{a\\}$.”"], "answer": "A", "explain": "Mọi phần tử của $\\{a\\}$ đều thuộc $\\{a; b\\}$ nên $\\{a\\} \\subset \\{a; b\\}$. Viết đúng cho phần tử là $a \\in \\{a; b\\}$."}, {"type": "mcq", "level": "NB", "q": "Mệnh đề “$P \\Rightarrow Q$” được đọc là:", "options": ["A. “$P$ kéo theo $Q$.”", "B. “$P$ tương đương $Q$.”", "C. “$P$ và $Q$.”", "D. “$P$ hoặc $Q$.”"], "answer": "A", "explain": "Kí hiệu $\\Rightarrow$ đọc là “kéo theo”; kí hiệu $\\Leftrightarrow$ mới đọc là “tương đương”."}, {"type": "mcq", "level": "TH", "q": "Cho $A$ là tập các ước tự nhiên của $12$, $B$ là tập các ước tự nhiên của $18$. Tập $A \\cap B$ là:", "options": ["A. “$\\{1; 2; 3; 6\\}$.”", "B. “$\\{1; 2; 3; 4; 6; 9; 12; 18\\}$.”", "C. “$\\{12; 18\\}$.”", "D. “$\\{4; 9\\}$.”"], "answer": "A", "explain": "$A = \\{1; 2; 3; 4; 6; 12\\}$, $B = \\{1; 2; 3; 6; 9; 18\\}$. Các ước chung là $1, 2, 3, 6$."}, {"type": "mcq", "level": "TH", "q": "Mệnh đề phủ định của mệnh đề “$\\exists n \\in \\mathbb{N}$, $n$ chia hết cho $7$” là:", "options": ["A. “$\\forall n \\in \\mathbb{N}$, $n$ không chia hết cho $7$.”", "B. “$\\exists n \\in \\mathbb{N}$, $n$ không chia hết cho $7$.”", "C. “$\\forall n \\in \\mathbb{N}$, $n$ chia hết cho $7$.”", "D. “Không tồn tại $n \\in \\mathbb{N}$.”"], "answer": "A", "explain": "Đổi $\\exists$ thành $\\forall$ và phủ định vị ngữ “chia hết cho $7$” thành “không chia hết cho $7$”."}, {"type": "mcq", "level": "VD", "q": "Phần bù của $[-2; 5)$ trong $\\mathbb{R}$ là:", "options": ["A. “$(-\\infty; -2) \\cup [5; +\\infty)$.”", "B. “$(-\\infty; -2] \\cup (5; +\\infty)$.”", "C. “$[-2; 5)$.”", "D. “$(-2; 5]$.”"], "answer": "A", "explain": "Phần bù gồm các số thực không thuộc $[-2; 5)$: $(-\\infty; -2) \\cup [5; +\\infty)$. Chú ý $-2$ bị loại khỏi phần bù, $5$ được lấy vào."}, {"type": "truefalse", "level": "TH", "q": "Cho $A = (-5; 0]$, $B = [-2; 4)$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $A \\cap B = [-2; 0]$.", "b) $A \\cup B = (-5; 4)$.", "c) Hiệu $A \\setminus B = (-5; -2)$.", "d) $-5 \\in A$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) đúng theo quy tắc trên trục số. d) sai vì $-5 \\notin (-5; 0]$."}, {"type": "truefalse", "level": "VD", "q": "Cho $A = (-\\infty; 2m + 1)$, $B = (m - 3; +\\infty)$ với $m \\in \\mathbb{R}$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Với $m = 1$, $A \\cap B = (-2; 3)$.", "b) Với $m = 5$, $A \\cup B = \\mathbb{R}$.", "c) $A \\cap B = \\varnothing$ khi và chỉ khi $m \\le -4$.", "d) $A \\cup B = \\mathbb{R}$ với mọi $m$."], "answer": ["T", "T", "T", "F"], "explain": "a) đúng: $A = (-\\infty; 3)$, $B = (-2; +\\infty)$. b) đúng: $A = (-\\infty; 11)$, $B = (2; +\\infty)$. c) đúng vì $2m + 1 \\le m - 3 \\Leftrightarrow m \\le -4$. d) sai, ví dụ $m = -10$ thì đoạn $[-19; -13]$ không thuộc hợp."}, {"type": "short", "level": "VDC", "q": "Cho $A = \\{x \\in \\mathbb{Z} \\mid -3 \\text{ nhỏ hơn } x \\text{ và } x \\le 4\\}$, $B = \\{x \\in A \\mid x \\text{ là số chẵn}\\}$. Tập hiệu $A \\setminus B$ có bao nhiêu tập con?", "answer": "8", "explain": "$A = \\{-2; -1; 0; 1; 2; 3; 4\\}$, $B = \\{-2; 0; 2; 4\\}$. Suy ra $A \\setminus B = \\{-1; 1; 3\\}$ có $3$ phần tử, số tập con là $2^3 = 8$."}, {"type": "short", "level": "VDC", "q": "Cho $A = \\{1; 2; \\dots; n\\}$ với $n \\in \\mathbb{N}^*$. Biết số tập con của $A$ chứa phần tử $1$ là $64$. Tìm $n$.", "answer": "7", "explain": "Cố định phần tử $1$, mỗi tập con còn lại của $\\{2; \\dots; n\\}$ cho một tập con chứa $1$ của $A$. Số đó là $2^{n-1} = 64 = 2^6$, suy ra $n - 1 = 6$, tức $n = 7$."}]}]}
