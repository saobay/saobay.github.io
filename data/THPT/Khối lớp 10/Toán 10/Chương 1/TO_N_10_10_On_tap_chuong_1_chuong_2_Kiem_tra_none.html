<script type="application/json" class="saobay-exam10-data">
{"frozen_bank_exam":true,"shuffle_within_type":true,"time_limit":20,"scoring":{"mcq":0.25,"truefalse":1,"short":0.5,"essay":0,"listening":0,"speaking":0,"matching":0,"ordering":0},"meta":{"title":"Ôn tập chương 1 chương 2","subject":"TO_N_10","grade":10},"sets":[{"name":"Ôn tập chương 1 chương 2","questions":[{"type":"mcq","level":"NB","q":"Hệ bất phương trình bậc nhất hai ẩn gồm","options":["A. hai hay nhiều bất phương trình bậc nhất hai ẩn","B. một bất phương trình duy nhất","C. các phương trình bậc nhất","D. một ẩn duy nhất"],"statements":[],"answer":"A","explain":"Theo định nghĩa, hệ bất phương trình bậc nhất hai ẩn là một hệ gồm hai hay nhiều bất phương trình bậc nhất hai ẩn $x, y$."},{"type":"mcq","level":"NB","q":"Cặp $(1; 3)$ là nghiệm của hệ nào sau đây?","options":["A. $\\begin{cases} x + y \\le 3 \\\\ x \\ge 0 \\end{cases}$","B. $\\begin{cases} x + 2y \\le 8 \\\\ x - y \\le 0 \\end{cases}$","C. $\\begin{cases} 2x \\ge 8 \\\\ y \\ge 0 \\end{cases}$","D. $\\begin{cases} y \\lt 3 \\\\ x \\gt 0 \\end{cases}$"],"statements":[],"answer":"B","explain":"Thay $(1; 3)$: A: $4 \\le 3$ sai; B: $7 \\le 8$ đúng và $-2 \\le 0$ đúng; C: $2 \\ge 8$ sai; D: $3 \\lt 3$ sai."},{"type":"mcq","level":"NB","q":"Mệnh đề phủ định của mệnh đề “Paris là thủ đô của nước Pháp” là:","options":["A. “Paris không là thủ đô của nước Pháp.”","B. “Paris là thủ đô của nước Anh.”","C. “London là thủ đô của nước Pháp.”","D. “Mọi thành phố đều không là thủ đô.”"],"statements":[],"answer":"A","explain":"Phủ định chỉ thêm từ “không” vào mệnh đề gốc, không bịa thêm thông tin mới như các đáp án B, C, D."},{"type":"mcq","level":"NB","q":"Khẳng định nào sau đây đúng về cặp $(1; 1)$ đối với hệ $\\begin{cases} x + y \\le 3 \\\\ x - y \\ge 0 \\end{cases}$?","options":["A. $(1; 1)$ là nghiệm của hệ","B. $(1; 1)$ không là nghiệm vì không thỏa mãn bất phương trình thứ nhất","C. $(1; 1)$ không là nghiệm vì không thỏa mãn bất phương trình thứ hai","D. Không xác định được"],"statements":[],"answer":"A","explain":"Thay $(1; 1)$: $1 + 1 = 2 \\le 3$ đúng và $1 - 1 = 0 \\ge 0$ đúng, nên $(1; 1)$ đồng thời là nghiệm của cả hai bất phương trình, tức là nghiệm của hệ."},{"type":"mcq","level":"NB","q":"Mệnh đề “$\\exists x \\in \\mathbb{R}, x + 1 = 0$” là mệnh đề:","options":["A. “Đúng.”","B. “Sai.”","C. “Chứa biến.”","D. “Không xác định được tính đúng sai.”"],"statements":[],"answer":"A","explain":"Tồn tại $x = -1 \\in \\mathbb{R}$ thỏa mãn $x + 1 = 0$ nên mệnh đề đúng."},{"type":"mcq","level":"NB","q":"Khẳng định nào sau đây đúng về cặp $(3; 1)$ đối với hệ $\\begin{cases} x + y \\le 5 \\\\ x - y \\ge 1 \\end{cases}$?","options":["A. $(3; 1)$ là nghiệm của hệ","B. $(3; 1)$ không là nghiệm vì không thỏa mãn bất phương trình thứ nhất","C. $(3; 1)$ không là nghiệm vì không thỏa mãn bất phương trình thứ hai","D. Không xác định được"],"statements":[],"answer":"A","explain":"Thay $(3; 1)$: $4 \\le 5$ đúng và $2 \\ge 1$ đúng, nên $(3; 1)$ là nghiệm của hệ."},{"type":"mcq","level":"NB","q":"Cặp $(0; 0)$ KHÔNG là nghiệm của hệ nào sau đây?","options":["A. $\\begin{cases} x + y \\le 1 \\\\ x \\ge -1 \\end{cases}$","B. $\\begin{cases} x - y \\ge 1 \\\\ x \\ge 0 \\end{cases}$","C. $\\begin{cases} 2x \\le 1 \\\\ 3y \\le 1 \\end{cases}$","D. $\\begin{cases} x \\ge -1 \\\\ y \\ge -1 \\end{cases}$"],"statements":[],"answer":"B","explain":"Thay $(0; 0)$: B có $0 \\ge 1$ sai nên không là nghiệm. A, C, D đều nhận $(0; 0)$ làm nghiệm."},{"type":"mcq","level":"NB","q":"Mệnh đề tương đương $P \\Leftrightarrow Q$ đúng trong trường hợp nào?","options":["A. $P$ đúng và $Q$ sai","B. $P$ sai và $Q$ đúng","C. $P$ đúng hoặc $Q$ đúng","D. $P$ và $Q$ cùng đúng hoặc cùng sai"],"statements":[],"answer":"D","explain":"$P \\Leftrightarrow Q$ đúng khi $P$ và $Q$ \"cùng phe\": cùng đúng hoặc cùng sai."},{"type":"mcq","level":"NB","q":"Mệnh đề kéo theo $P \\Rightarrow Q$ chỉ sai trong trường hợp nào?","options":["A. P đúng và Q đúng","B. P sai và Q sai","C. P đúng và Q sai","D. P sai và Q đúng"],"statements":[],"answer":"C","explain":"Theo định nghĩa, $P \\Rightarrow Q$ sai duy nhất khi $P$ đúng mà $Q$ sai (\"Đúng kéo theo Sai là Sai\")."},{"type":"mcq","level":"NB","q":"Mệnh đề phủ định của mệnh đề “Mọi số thực đều có bình phương không âm” là:","options":["A. “Mọi số thực đều có bình phương âm.”","B. “Tồn tại số thực có bình phương âm.”","C. “Không có số thực nào có bình phương không âm.”","D. “Mọi số thực đều có bình phương dương.”"],"statements":[],"answer":"B","explain":"Phủ định của “mọi” là “tồn tại (có ít nhất một)”, phủ định của “không âm” là “âm”. Đáp án B diễn đạt đúng."},{"type":"mcq","level":"NB","q":"Cho $k = 11$. Tập hợp nào sau đây bằng $\\varnothing$?","options":["A. $N = \\{x \\in \\mathbb{R} \\mid x = x\\}$","B. $Q = \\{x \\in \\mathbb{Z} \\mid x^2 = 9\\}$","C. $P = \\{x \\in \\mathbb{N}^* \\mid x < 4\\}$","D. $M = \\{{x \\in \\mathbb{{R}} \\mid x^2 + k = 0\\}}$"],"statements":[],"answer":"D","explain":"Phương trình $x^2 + 11 = 0$ vô nghiệm trên $\\mathbb{R}$ nên $M = \\varnothing$; các tập còn lại đều có phần tử."},{"type":"mcq","level":"NB","q":"Cho tập hợp $A = \\{0; 1; 4; 6; 7\\}$. Khẳng định nào sau đây đúng?","options":["A. $2 \\in A$","B. $4 \\in A$","C. $5 \\in A$","D. $4 \\notin A$"],"statements":[],"answer":"B","explain":"$4$ là phần tử của $A$ nên $4 \\in A$ đúng; $2$ và $5$ không thuộc $A$."},{"type":"truefalse","level":"TH","q":"Cho hệ $\\begin{cases} 5x + 2y \\le 10 \\\\ x \\ge 0 \\\\ y \\ge 0 \\end{cases}$. Xét tính đúng, sai của các khẳng định sau:","options":[],"statements":["a) Cặp $(2; 0)$ là nghiệm của hệ.","b) Miền nghiệm của hệ là tam giác kể cả ba cạnh.","c) Giá trị lớn nhất của $5x + 2y$ trên miền nghiệm là $10$.","d) Cặp $(1; 3)$ là nghiệm của hệ."],"answer":["T","T","T","F"],"explain":"a) Đúng: $10 \\le 10$. b) Đúng: tam giác $OAB$ với $A(2;0), B(0;5)$. c) Đúng: tại các đỉnh giá trị là $0, 10, 10$. d) Sai: $5 + 6 = 11 \\le 10$ sai."},{"type":"truefalse","level":"TH","q":"Cho bất phương trình $3x - y \\le 6$. Xét tính đúng, sai của các khẳng định sau:","options":[],"statements":["a) Cặp $(2; 0)$ là nghiệm của bất phương trình.","b) Đường biên $3x - y = 6$ được vẽ bằng nét liền.","c) Miền nghiệm của bất phương trình chứa gốc tọa độ $O$.","d) Hệ $\\begin{cases} 3x - y \\le 6 \\\\ x + y \\ge 7 \\end{cases}$ vô nghiệm."],"answer":["T","T","T","F"],"explain":"a) Đúng: $6 \\le 6$. b) Đúng: dấu $\\le$ nên kể cả bờ. c) Đúng: $0 \\le 6$. d) Sai: ví dụ $(3; 4)$ thỏa mãn $5 \\le 6$ và $7 \\ge 7$ nên hệ có nghiệm."},{"type":"short","level":"VD","q":"Lớp 10B có $23$ học sinh thích môn Toán, $22$ học sinh thích môn Văn, trong đó có $9$ học sinh thích cả hai môn. Hỏi có bao nhiêu học sinh thích ít nhất một trong hai môn?","options":[],"statements":[],"answer":"36","explain":"Số học sinh thích ít nhất một môn là $23 + 22 - 9 = 36$."},{"type":"short","level":"VD","q":"Tìm hoành độ giao điểm của hai đường biên $x + 2y = 6$ và $3x - y = 4$.","options":[],"statements":[],"answer":"2","explain":"Từ phương trình thứ hai: $y = 3x - 4$. Thay vào phương trình thứ nhất: $x + 6x - 8 = 6 \\Rightarrow 7x = 14 \\Rightarrow x = 2$."},{"type":"short","level":"VD","q":"Hệ $\\begin{cases} x \\ge 0 \\\\ y \\ge 0 \\\\ 2x + y \\le 6 \\end{cases}$ có miền nghiệm là tam giác với các đỉnh $O(0; 0), A(3; 0), B(0; 6)$. Tìm giá trị lớn nhất của $F(x; y) = x + y$ trên miền nghiệm đó.","options":[],"statements":[],"answer":"6","explain":"$F(0; 0) = 0$, $F(3; 0) = 3$, $F(0; 6) = 6$. Giá trị lớn nhất là $6$."},{"type":"short","level":"VDC","q":"Cho $U = \\{x \\in \\mathbb{N} \\mid x \\le 20\\}$, $A = \\{x \\in U \\mid x \\text{ chia hết cho } 3\\}$, $B = \\{x \\in U \\mid x \\text{ chia hết cho } 5\\}$. Phần bù của $A \\cup B$ trong $U$ có bao nhiêu phần tử?","options":[],"statements":[],"answer":"11","explain":"$|U| = 21$, $|A| = 7$, $|B| = 5$, $|A \\cap B| = 2$ (là $0$ và $15$). Suy ra $|A \\cup B| = 7 + 5 - 2 = 10$, phần bù có $21 - 10 = 11$ phần tử."},{"type":"essay","level":"VD","q":"[TL] Chứng minh rằng tổng của hai số lẻ là một số chẵn và cho một ví dụ minh họa.","options":[],"statements":[],"answer":"","explain":"Barem: Đặt hai số lẻ dưới dạng 2a + 1 và 2b + 1 (0,25 điểm). Tính tổng: (2a + 1) + (2b + 1) = 2(a + b + 1), chia hết cho 2 (0,5 điểm). Kết luận tổng là số chẵn và cho ví dụ đúng, ví dụ 3 + 5 = 8 (0,25 điểm)."}]}]}
