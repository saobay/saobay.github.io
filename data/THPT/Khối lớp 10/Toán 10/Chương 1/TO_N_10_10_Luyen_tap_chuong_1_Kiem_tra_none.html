{"frozen_bank_exam":true,"shuffle_within_type":true,"time_limit":0,"scoring":{"mcq":0.25,"truefalse":1,"short":0.5,"essay":0,"listening":0,"speaking":0,"matching":0,"ordering":0},"meta":{"title":"Luyện tập chương 1","subject":"TO_N_10","grade":10},"sets":[{"name":"Luyện tập chương 1","questions":[{"type":"mcq","level":"NB","q":"Cho khoảng $A = (4; 7)$. Khẳng định nào sau đây đúng?","options":["A. $4 \\in A$","B. $7 \\in A$","C. $6 \\notin A$","D. $6 \\in A$"],"statements":[],"answer":"D","explain":"Khoảng $(4; 7)$ gồm các số thực lớn hơn $4$ và nhỏ hơn $7$; $6$ thỏa mãn, còn $4$ và $7$ là hai đầu mút nên không thuộc $A$."},{"type":"mcq","level":"NB","q":"Trong các câu sau, câu nào là mệnh đề?","options":["A. “Hà Nội là thủ đô của Việt Nam.”","B. “Hôm nay trời đẹp quá!”","C. “$x + 2 = 7$.”","D. “Bạn tên gì?”"],"statements":[],"answer":"A","explain":"Mệnh đề là câu khẳng định có tính đúng hoặc sai. Câu B là câu cảm thán, câu C chứa biến $x$ nên tính đúng sai phụ thuộc $x$, câu D là câu hỏi."},{"type":"mcq","level":"NB","q":"Cho $k = 11$. Tập hợp nào sau đây bằng $\\varnothing$?","options":["A. $N = \\{x \\in \\mathbb{R} \\mid x = x\\}$","B. $Q = \\{x \\in \\mathbb{Z} \\mid x^2 = 9\\}$","C. $P = \\{x \\in \\mathbb{N}^* \\mid x < 4\\}$","D. $M = \\{{x \\in \\mathbb{{R}} \\mid x^2 + k = 0\\}}$"],"statements":[],"answer":"D","explain":"Phương trình $x^2 + 11 = 0$ vô nghiệm trên $\\mathbb{R}$ nên $M = \\varnothing$; các tập còn lại đều có phần tử."},{"type":"mcq","level":"NB","q":"Phủ định của mệnh đề $P$: \"$13$ là số nguyên tố.\" là mệnh đề nào sau đây?","options":["A. \"$13$ là số nguyên tố.\"","B. \"Mọi số tự nhiên đều là số nguyên tố.\"","C. \"$13$ không phải là số nguyên tố.\"","D. \"$13$ là hợp số.\""],"statements":[],"answer":"C","explain":"Phủ định của \"$13$ là số nguyên tố\" là \"$13$ không phải là số nguyên tố\". Chú ý: \"$13$ là hợp số\" chưa phải phủ định đúng vì còn trường hợp số $1$."},{"type":"mcq","level":"NB","q":"Mệnh đề $P \\Leftrightarrow Q$ là mệnh đề sai khi nào?","options":["A. “Khi $P$ đúng và $Q$ đúng.”","B. “Khi $P$ sai và $Q$ sai.”","C. “Khi một trong hai mệnh đề $P, Q$ đúng và mệnh đề còn lại sai.”","D. “Khi $P \\Rightarrow Q$ đúng.”"],"statements":[],"answer":"C","explain":"$P \\Leftrightarrow Q$ đúng khi $P, Q$ cùng đúng hoặc cùng sai; sai khi một đúng một sai."},{"type":"mcq","level":"NB","q":"Phủ định của mệnh đề $P$: \"$17$ là số nguyên tố.\" là mệnh đề nào sau đây?","options":["A. \"Mọi số tự nhiên đều là số nguyên tố.\"","B. \"$17$ không phải là số nguyên tố.\"","C. \"$17$ là hợp số.\"","D. \"$17$ là số nguyên tố.\""],"statements":[],"answer":"B","explain":"Phủ định của \"$17$ là số nguyên tố\" là \"$17$ không phải là số nguyên tố\". Chú ý: \"$17$ là hợp số\" chưa phải phủ định đúng vì còn trường hợp số $1$."},{"type":"mcq","level":"NB","q":"Tập hợp $A = \\{x \\in \\mathbb{N} \\mid x \\le 9\\}$ có bao nhiêu phần tử?","options":["A. 11","B. 12","C. 9","D. 10"],"statements":[],"answer":"D","explain":"Các số tự nhiên không vượt quá $9$ là $0; 1; \\ldots; 9$, gồm $10$ phần tử."},{"type":"mcq","level":"TH","q":"Tập $(-\\infty; 2] \\cup [0; +\\infty)$ bằng tập nào sau đây?","options":["A. “$\\mathbb{R}$.”","B. “$[0; 2]$.”","C. “$\\varnothing$.”","D. “$(2; +\\infty)$.”"],"statements":[],"answer":"A","explain":"Mọi số thực $x$ hoặc không vượt quá $2$, hoặc không nhỏ hơn $0$ (hai khoảng phủ kín nhau tại $[0; 2]$), nên hợp bằng $\\mathbb{R}$."},{"type":"truefalse","level":"TH","q":"Cho $A = [-4; 0]$ và $B = (-2; 3)$. Xét tính đúng, sai của các khẳng định sau:","options":[],"statements":["a) $A \\cap B = $(-2; 0]$$.","b) $A \\cup B = $[-4; 3)$$.","c) $A \\setminus B = $[-4; -2]$$.","d) $B \\subset A$."],"answer":["T","T","T","F"],"explain":"$A \\cap B = $(-2; 0]$$; $A \\cup B = $[-4; 3)$$; $A \\setminus B = $[-4; -2]$$; $B \\not\\subset A$ vì $3 \\in B$ nhưng $3 \\notin A$."},{"type":"truefalse","level":"VD","q":"Cho $P$: “Tứ giác $ABCD$ là hình chữ nhật”, $Q$: “Tứ giác $ABCD$ có hai đường chéo bằng nhau”. Xét tính đúng, sai của các khẳng định sau:","options":[],"statements":["a) Mệnh đề $P \\Rightarrow Q$ đúng.","b) Mệnh đề $Q \\Rightarrow P$ đúng.","c) $P$ là điều kiện đủ của $Q$.","d) $Q$ là điều kiện cần của $P$."],"answer":["T","F","T","T"],"explain":"Hình chữ nhật luôn có hai đường chéo bằng nhau nên a) đúng. Ngược lại sai: hình thang cân có hai đường chéo bằng nhau nhưng không là hình chữ nhật, nên b) sai. Từ đó c) và d) đúng."}]}]}
