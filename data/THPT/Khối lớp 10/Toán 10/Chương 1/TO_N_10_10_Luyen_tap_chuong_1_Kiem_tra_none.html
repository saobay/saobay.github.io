ập hợp nào sau đây bằng $\\varnothing$?","options":["A. $N = \\{x \\in \\mathbb{R} \\mid x = x\\}$","B. $Q = \\{x \\in \\mathbb{Z} \\mid x^2 = 9\\}$","C. $P = \\{x \\in \\mathbb{N}^* \\mid x < 4\\}$","D. $M = \\{{x \\in \\mathbb{{R}} \\mid x^2 + k = 0\\}}$"],"statements":[],"answer":"D","explain":"Phương trình $x^2 + 11 = 0$ vô nghiệm trên $\\mathbb{R}$ nên $M = \\varnothing$; các tập còn lại đều có phần tử."},{"type":"mcq","level":"NB","q":"Liệt kê các phần tử của tập $A = \\{x \\in \\mathbb{N} \\mid x \\text{ là ước của } 6\\}$:","options":["A. “$\\{1; 2; 3; 6\\}$.”","B. “$\\{0; 1; 2; 3; 6\\}$.”","C. “$\\{1; 2; 3\\}$.”","D. “$\\{6; 12; 18; \\dots\\}$.”"],"statements":[],"answer":"A","explain":"Các ước tự nhiên của $6$ là $1, 2, 3, 6$. Chú ý $0$ không là ước của số nào."},{"type":"mcq","level":"NB","q":"Mệnh đề $P \\Leftrightarrow Q$ là mệnh đề sai khi nào?","options":["A. “Khi $P$ đúng và $Q$ đúng.”","B. “Khi $P$ sai và $Q$ sai.”","C. “Khi một trong hai mệnh đề $P, Q$ đúng và mệnh đề còn lại sai.”","D. “Khi $P \\Rightarrow Q$ đúng.”"],"statements":[],"answer":"C","explain":"$P \\Leftrightarrow Q$ đúng khi $P, Q$ cùng đúng hoặc cùng sai; sai khi một đúng một sai."},{"type":"mcq","level":"TH","q":"Cho $A = [-5; -2]$ và $B = (-3; -1)$. Tập hợp $A \\cap B$ là","options":["A. $(-3; -2]$","B. $(-3; -2)$","C. $[-3; -2)$","D. $[-3; -2]$"],"statements":[],"answer":"A","explain":"Lấy phần chung của $[-5; -2]$ và $(-3; -1)$ được $(-3; -2]$."},{"type":"truefalse","level":"TH","q":"Cho hai tập hợp $A = \\{0; 1; 3; 4; 9\\}$ và $B = \\{0; 2; 4; 8\\}$. Xét tính đúng, sai của các khẳng định sau:","options":[],"statements":["a) $A \\cap B = $\\{0; 4\\}$$.","b) $A \\cup B = $\\{0; 4\\}$$.","c) $A \\setminus B = $\\{1; 3; 9\\}$$.","d) $B \\subset A$."],"answer":["T","F","T","F"],"explain":"$A \\cap B = $\\{0; 4\\}$$; $A \\cup B = $\\{0; 1; 2; 3; 4; 8; 9\\}$$; $A \\setminus B = $\\{1; 3; 9\\}$$; $B \\not\\subset A$."},{"type":"truefalse","level":"VD","q":"Cho $A = [m - 2; 5]$, $B = (3; m + 2)$ với $m \\in \\mathbb{R}$. Xét tính đúng, sai của các khẳng định sau:","options":[],"statements":["a) Với $m = 4$, $A = [2; 5]$ và $A \\cap B = (3; 5]$.","b) Với $m = 1$, $B = \\varnothing$ nên $A \\cap B = \\varnothing$.","c) $A \\cap B \\ne \\varnothing$ với mọi $m$.","d) Với $m = 6$, $A \\cup B = [4; 8)$."],"answer":["T","T","F","T"],"explain":"a) đúng. b) đúng vì $(3; 3) = \\varnothing$. c) sai vì với $m = 1$ giao bằng rỗng. d) đúng: $A = [4; 5]$, $B = (3; 8)$."}]}]}
