ị cắt trục hoành tại $x = -1$ và $x = 3$.", "d) Giá trị lớn nhất của hàm số bằng $-4$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $x = 1$, $y = 1 - 2 - 3 = -4$. b) Đúng. c) Đúng: $x^2 - 2x - 3 = 0$ cho $x = -1, 3$. d) Sai: $a \\gt 0$ nên $-4$ là giá trị nhỏ nhất.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Một công ty có lợi nhuận $P(x) = -2x^2 + 40x - 100$ (triệu đồng), trong đó $x$ là số sản phẩm bán ra (nghìn chiếc). Xét tính đúng, sai:", "statements": ["a) Lợi nhuận lớn nhất khi bán $x = 10$ (nghìn chiếc).", "b) Lợi nhuận lớn nhất là $100$ triệu đồng.", "c) Đồ thị hàm lợi nhuận là parabol quay xuống.", "d) Khi $x = 0$ thì lợi nhuận bằng $0$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $x = -b/2a = -40/(-4) = 10$. b) Đúng: $P(10) = -200 + 400 - 100 = 100$. c) Đúng vì $a = -2 \\lt 0$. d) Sai: $P(0) = -100$ (lỗ $100$ triệu).", "points": 1}, {"type": "short", "level": "TH", "q": "Cho hàm số $y = -x^2 + 4x - 3$. Hoành độ đỉnh của parabol bằng bao nhiêu?", "answer": "2", "explain": "$x = -b/2a = -4/(-2) = 2$.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Cho hàm số $y = x^2 - 4x + 3$. Giá trị $y$ tại đỉnh của parabol bằng bao nhiêu?", "answer": "-1", "explain": "Đỉnh $I(2;\\, -1)$ nên tung độ đỉnh là $-1$.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Hàm số bậc hai $y = ax^2 + bx + c$ có tập xác định là", "options": ["A. $\\mathbb{R}$.", "B. $\\mathbb{R} \\setminus \\{0\\}$.", "C. $[0;\\, +\\infty)$.", "D. $(-\\infty;\\, 0]$."], "answer": "A", "explain": "Hàm số bậc hai là hàm đa thức nên xác định với mọi $x \\in \\mathbb{R}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi $a \\gt 0$, hàm số $y = ax^2 + bx + c$", "options": ["A. nghịch biến trên $\\left(-\\infty;\\, -\\dfrac{b}{2a}\\right)$, đồng biến trên $\\left(-\\dfrac{b}{2a};\\, +\\infty\\right)$.", "B. đồng biến trên $\\mathbb{R}$.", "C. nghịch biến trên $\\mathbb{R}$.", "D. đồng biến trên $\\left(-\\infty;\\, -\\dfrac{b}{2a}\\right)$, nghịch biến trên $\\left(-\\dfrac{b}{2a};\\, +\\infty\\right)$."], "answer": "A", "explain": "Đó chính là bảng biến thiên của hàm số bậc hai khi $a \\gt 0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho hàm số $y = -x^2 + 6x - 5$. Tọa độ đỉnh của parabol là", "options": ["A. $(3;\\, 4)$.", "B. $(-3;\\, 4)$.", "C. $(3;\\, -4)$.", "D. $(6;\\, -5)$."], "answer": "A", "explain": "$x = -6/(-2) = 3$; $y = -9 + 18 - 5 = 4$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giá trị lớn nhất của hàm số $y = -4x^2 + 8x + 1$ là", "options": ["A. $5$.", "B. $1$.", "C. $8$.", "D. $-4$."], "answer": "A", "explain": "$x = -8/(-8) = 1$; $y_{\\max} = -4 + 8 + 1 = 5$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho hàm số $y = x^2 - 4x + m$. Để đồ thị cắt trục hoành tại hai điểm phân biệt thì", "options": ["A. $m \\lt 4$.", "B. $m \\gt 4$.", "C. $m = 4$.", "D. $m \\le 4$."], "answer": "A", "explain": "Cắt $Ox$ tại hai điểm phân biệt khi $\\Delta = 16 - 4m \\gt 0$, tức $m \\lt 4$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho hàm số $y = x^2 - 2(m + 1)x + 4$ có trục đối xứng là đường thẳng $x = 3$. Giá trị của $m$ là", "options": ["A. $2$.", "B. $3$.", "C. $1$.", "D. $4$."], "answer": "A", "explain": "Trục đối xứng $x = -b/2a = m + 1 = 3$ suy ra $m = 2$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đồ thị hàm số bậc hai đối xứng qua đường thẳng $x = -\\dfrac{b}{2a}$.", "b) Parabol $y = x^2 + 1$ có đỉnh tại $(0;\\, 1)$.", "c) Hàm số $y = -2x^2$ có giá trị nhỏ nhất bằng $0$.", "d) Hàm số $y = x^2$ đồng biến trên $(0;\\, +\\infty)$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: $a \\lt 0$ nên $0$ là giá trị lớn nhất. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Cho hàm số $y = -2x^2 + 4x + 1$. Xét tính đúng, sai:", "statements": ["a) Đỉnh của parabol là $I(1;\\, 3)$.", "b) Giá trị lớn nhất của hàm số bằng $3$.", "c) Hàm số nghịch biến trên $(1;\\, +\\infty)$.", "d) Đồ thị cắt trục tung tại điểm $(0;\\, 1)$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $x = -4/(-4) = 1$, $y = -2 + 4 + 1 = 3$. b) Đúng ($a \\lt 0$). c) Đúng. d) Đúng: $x = 0$ cho $y = 1$.", "points": 1}, {"type": "short", "level": "NB", "q": "Cho hàm số $y = -2x^2 + x + 1$. Hệ số $a$ của hàm số bằng bao nhiêu?", "answer": "-2", "explain": "Hệ số của $x^2$ là $a = -2$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho hàm số $y = 2x^2 - 3x + 1$. Tung độ đỉnh của parabol bằng bao nhiêu (viết dưới dạng phân số)?", "answer": "-1/8", "explain": "$\\Delta = 9 - 8 = 1$; $y_I = -\\Delta/4a = -1/8$.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Số giao điểm của parabol $y = ax^2 + bx + c$ với trục hoành $Ox$ phụ thuộc vào", "options": ["A. dấu của $\\Delta = b^2 - 4ac$.", "B. dấu của $a$.", "C. giá trị của $c$.", "D. dấu của $b$."], "answer": "A", "explain": "Số nghiệm của $ax^2 + bx + c = 0$ (tức số giao điểm với $Ox$) phụ thuộc vào dấu của $\\Delta$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hàm số $y = ax^2 + bx + c$ với $a \\lt 0$ có", "options": ["A. giá trị lớn nhất.", "B. giá trị nhỏ nhất.", "C. cả hai giá trị lớn nhất và nhỏ nhất.", "D. không có giá trị lớn nhất cũng không có giá trị nhỏ nhất."], "answer": "A", "explain": "$a \\lt 0$ thì đỉnh là điểm cao nhất nên hàm số có giá trị lớn nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho hàm số $y = 2x^2 + 4x + 2 = 2(x + 1)^2$. Đỉnh của parabol là", "options": ["A. $(-1;\\, 0)$.", "B. $(1;\\, 0)$.", "C. $(0;\\, -1)$.", "D. $(-1;\\, 2)$."], "answer": "A", "explain": "$y = 2(x+1)^2 \\ge 0$, bằng $0$ khi $x = -1$ nên đỉnh là $(-1;\\, 0)$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hàm số $y = x^2 - 6x + 8$ nghịch biến trên khoảng", "options": ["A. $(-\\infty;\\, 3)$.", "B. $(3;\\, +\\infty)$.", "C. $(-\\infty;\\, +\\infty)$.", "D. $(8;\\, +\\infty)$."], "answer": "A", "explain": "Đỉnh $I(3;\\, -1)$, $a = 1 \\gt 0$ nên nghịch biến trên $(-\\infty;\\, 3)$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một hình chữ nhật có chu vi $20\\,\\text{m}$. Gọi $x$ (m) là chiều dài, diện tích $S(x)$ của hình chữ nhật là", "options": ["A. $S(x) = -x^2 + 10x$.", "B. $S(x) = x^2 + 10x$.", "C. $S(x) = -x^2 + 20x$.", "D. $S(x) = x^2 - 10x$."], "answer": "A", "explain": "Chiều rộng là $10 - x$ nên $S = x(10 - x) = -x^2 + 10x$ (với $0 \\lt x \\lt 10$).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho hàm số $y = -x^2 + 2mx + 1$ có giá trị lớn nhất bằng $5$. Giá trị của $m$ là", "options": ["A. $m = 2$ hoặc $m = -2$.", "B. $m = 2$.", "C. $m = -2$.", "D. $m = 4$."], "answer": "A", "explain": "$y_{\\max} = -\\Delta/4a = (4m^2 + 4)/4 = m^2 + 1 = 5$ suy ra $m^2 = 4$, tức $m = \\pm 2$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho hàm số $y = x^2 + 2x$. Xét tính đúng, sai:", "statements": ["a) Đỉnh của parabol là $I(-1;\\, -1)$.", "b) Đồ thị cắt trục hoành tại $x = 0$ và $x = -2$.", "c) Giá trị nhỏ nhất của hàm số bằng $-1$.", "d) Hàm số đồng biến trên $(-1;\\, +\\infty)$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $x = -1$, $y = 1 - 2 = -1$. b) Đúng: $x(x+2) = 0$. c) Đúng ($a \\gt 0$). d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Bác An dùng $40\\,\\text{m}$ hàng rào để rào một mảnh vườn hình chữ nhật. Gọi $x$ (m) là chiều dài của mảnh vườn. Xét tính đúng, sai:", "statements": ["a) Chiều rộng của mảnh vườn là $20 - x$ (m).", "b) Diện tích $S = -x^2 + 20x$ ($\\text{m}^2$).", "c) Diện tích lớn nhất khi $x = 10$ (m).", "d) Diện tích lớn nhất là $200\\,\\text{m}^2$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: nửa chu vi là $20$. b) Đúng. c) Đúng: $x = -b/2a = 10$. d) Sai: $S_{\\max} = -100 + 200 = 100\\,\\text{m}^2$.", "points": 1}, {"type": "short", "level": "TH", "q": "Cho hàm số $y = x^2 - 8x + 12$. Hoành độ đỉnh của parabol bằng bao nhiêu?", "answer": "4", "explain": "$x = -b/2a = 8/2 = 4$.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Cho hàm số $y = -x^2 + 4x + 5$. Giá trị lớn nhất của hàm số bằng bao nhiêu?", "answer": "9", "explain": "Đỉnh $I(2;\\, 9)$, $a \\lt 0$ nên $y_{\\max} = 9$.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trục đối xứng của parabol $y = ax^2 + bx + c$ là đường thẳng", "options": ["A. $x = -\\dfrac{b}{2a}$.", "B. $y = -\\dfrac{b}{2a}$.", "C. $x = \\dfrac{b}{2a}$.", "D. $y = -\\dfrac{\\Delta}{4a}$."], "answer": "A", "explain": "Trục đối xứng là đường thẳng đứng $x = -b/2a$ đi qua đỉnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đỉnh $I$ của parabol $y = ax^2 + bx + c$ có tọa độ", "options": ["A. $\\left(-\\dfrac{b}{2a};\\, -\\dfrac{\\Delta}{4a}\\right)$.", "B. $\\left(\\dfrac{b}{2a};\\, \\dfrac{\\Delta}{4a}\\right)$.", "C. $\\left(-\\dfrac{b}{2a};\\, c\\right)$.", "D. $\\left(0;\\, -\\dfrac{\\Delta}{4a}\\right)$."], "answer": "A", "explain": "Đó chính là công thức tọa độ đỉnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho hàm số $y = -x^2 + 2x - 1 = -(x - 1)^2$. Đỉnh của parabol là", "options": ["A. $(1;\\, 0)$.", "B. $(-1;\\, 0)$.", "C. $(1;\\, -1)$.", "D. $(0;\\, 1)$."], "answer": "A", "explain": "$y = -(x-1)^2 \\le 0$, bằng $0$ khi $x = 1$ nên đỉnh là $(1;\\, 0)$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hàm số $y = 4x^2 - 4x + 1$ đồng biến trên khoảng", "options": ["A. $\\left(\\dfrac{1}{2};\\, +\\infty\\right)$.", "B. $\\left(-\\infty;\\, \\dfrac{1}{2}\\right)$.", "C. $(-\\infty;\\, +\\infty)$.", "D. $(1;\\, +\\infty)$."], "answer": "A", "explain": "Đỉnh $I(1/2;\\, 0)$, $a = 4 \\gt 0$ nên đồng biến trên $(1/2;\\, +\\infty)$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho hàm số $y = x^2 - 2x - 8$. Khoảng cách giữa hai giao điểm của đồ thị với trục hoành là", "options": ["A. $6$.", "B. $2$.", "C. $8$.", "D. $4$."], "answer": "A", "explain": "$x^2 - 2x - 8 = 0$ có nghiệm $x = 4$ và $x = -2$; khoảng cách là $|4 - (-2)| = 6$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho hàm số $y = x^2 - 4x + 3$. Có bao nhiêu điểm nguyên trên đồ thị có tung độ bằng $0$?", "options": ["A. $2$.", "B. $1$.", "C. $3$.", "D. $0$."], "answer": "A", "explain": "$y = 0$ khi $x = 1$ hoặc $x = 3$; hai điểm $(1;\\, 0)$ và $(3;\\, 0)$ đều có tọa độ nguyên.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Parabol $y = x^2$ nhận trục $Oy$ làm trục đối xứng.", "b) Parabol $y = x^2 + 2x$ nhận đường thẳng $x = -1$ làm trục đối xứng.", "c) Mọi parabol $y = ax^2 + bx + c$ đều cắt trục tung $Oy$.", "d) Mọi parabol $y = ax^2 + bx + c$ đều cắt trục hoành $Ox$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: $x = -2/2 = -1$. c) Đúng: luôn cắt tại $(0;\\, c)$. d) Sai: chỉ cắt $Ox$ khi $\\Delta \\ge 0$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Cho hàm số $y = 3x^2 - 12x + 7$. Xét tính đúng, sai:", "statements": ["a) Đỉnh của parabol là $I(2;\\, -5)$.", "b) Trục đối xứng là đường thẳng $x = 2$.", "c) Giá trị nhỏ nhất của hàm số bằng $-5$.", "d) Hàm số nghịch biến trên $(-\\infty;\\, 2)$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $x = 12/6 = 2$, $y = 12 - 24 + 7 = -5$. b) Đúng. c) Đúng ($a \\gt 0$). d) Đúng.", "points": 1}, {"type": "short", "level": "NB", "q": "Cho hàm số $y = x^2 - 5x + 6$. Hệ số $c$ của hàm số bằng bao nhiêu?", "answer": "6", "explain": "Hệ số tự do là $c = 6$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho hàm số $y = -2x^2 + 12x - 10$. Tung độ đỉnh của parabol bằng bao nhiêu?", "answer": "8", "explain": "$\\Delta = 144 - 80 = 64$; $y_I = -\\Delta/4a = -64/(-8) = 8$.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Hàm số nào sau đây là hàm số bậc hai?", "options": ["A. $y = x^2 - 1$.", "B. $y = 2x + 1$.", "C. $y = \\dfrac{1}{x}$.", "D. $y = \\sqrt{x}$."], "answer": "A", "explain": "$y = x^2 - 1$ có dạng $ax^2 + bx + c$ với $a = 1 \\ne 0$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hàm số nào sau đây KHÔNG phải là hàm số bậc hai?", "options": ["A. $y = 2x - 1$.", "B. $y = x^2$.", "C. $y = -x^2 + x$.", "D. $y = 3x^2 - 2$."], "answer": "A", "explain": "$y = 2x - 1$ là hàm bậc nhất ($a = 0$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho hàm số $y = x^2 - 10x + 25 = (x - 5)^2$. Giá trị nhỏ nhất của hàm số là", "options": ["A. $0$.", "B. $25$.", "C. $-10$.", "D. $5$."], "answer": "A", "explain": "$y = (x-5)^2 \\ge 0$, giá trị nhỏ nhất bằng $0$ tại $x = 5$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hàm số $y = -5x^2 + 10x - 3$ có giá trị lớn nhất là", "options": ["A. $2$.", "B. $-3$.", "C. $10$.", "D. $-5$."], "answer": "A", "explain": "$x = -10/(-10) = 1$; $y_{\\max} = -5 + 10 - 3 = 2$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Parabol $y = ax^2 + bx + c$ đi qua điểm $(0;\\, 3)$ và có đỉnh $I(2;\\, -1)$. Giá trị của $a$ là", "options": ["A. $\\dfrac{4}{3}$.", "B. $1$.", "C. $4$.", "D. $-1$."], "answer": "A", "explain": "$c = 3$; $a + b + c = -1$ nên $a + b = -4$; $-b/2a = 2$ nên $b = -4a$; suy ra $-3a = -4$, $a = 4/3$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho hàm số $y = x^2 - 2x + m - 1$ có giá trị nhỏ nhất bằng $2$. Giá trị của $m$ là", "options": ["A. $4$.", "B. $2$.", "C. $3$.", "D. $1$."], "answer": "A", "explain": "$y_{\\min} = -\\Delta/4a = -(4 - 4(m-1))/4 = m - 2 = 2$ suy ra $m = 4$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho hàm số $y = -x^2 - 4x - 3$. Xét tính đúng, sai:", "statements": ["a) Đỉnh của parabol là $I(-2;\\, 1)$.", "b) Giá trị lớn nhất của hàm số bằng $1$.", "c) Hàm số đồng biến trên $(-\\infty;\\, -2)$.", "d) Đồ thị cắt trục tung tại điểm $(0;\\, -3)$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $x = 4/(-2) = -2$, $y = -4 + 8 - 3 = 1$. b) Đúng ($a \\lt 0$). c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho hàm số $y = x^2 - (m + 2)x + 1$ có đỉnh nằm trên trục hoành $Ox$. Xét tính đúng, sai:", "statements": ["a) $\\Delta = 0$.", "b) $m = 0$ hoặc $m = -4$.", "c) Với $m = 0$, đỉnh của parabol là $(-1;\\, 0)$.", "d) Với $m = -4$, đỉnh của parabol là $(-1;\\, 0)$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đỉnh trên $Ox$ nghĩa là $y_I = 0$, tức $\\Delta = 0$. b) Đúng: $(m+2)^2 - 4 = 0$ cho $m = 0$ hoặc $m = -4$. c) Sai: $m = 0$ cho đỉnh $(1;\\, 0)$. d) Đúng: $m = -4$ cho $y = x^2 + 2x + 1$, đỉnh $(-1;\\, 0)$.", "points": 1}, {"type": "short", "level": "TH", "q": "Cho hàm số $y = x^2 - 6x + 9$. Tung độ đỉnh của parabol bằng bao nhiêu?", "answer": "0", "explain": "$y = (x-3)^2$ nên đỉnh $(3;\\, 0)$, tung độ đỉnh bằng $0$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một viên đạn được bắn lên với quỹ đạo $y = -\\dfrac{x^2}{100} + x$ ($x, y$ tính bằng mét, mặt đất là $y = 0$). Tầm bay xa của viên đạn (hoành độ giao điểm với mặt đất, $x \\gt 0$) bằng bao nhiêu mét?", "answer": "100", "explain": "$y = 0$ cho $x(-x/100 + 1) = 0$, nghiệm $x \\gt 0$ là $x = 100$.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Đồ thị của hàm số bậc hai đối xứng qua", "options": ["A. đường thẳng $x = -\\dfrac{b}{2a}$.", "B. đường thẳng $y = -\\dfrac{b}{2a}$.", "C. gốc tọa độ $O$.", "D. đường thẳng $y = x$."], "answer": "A", "explain": "Trục đối xứng của parabol là đường thẳng đứng $x = -b/2a$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giá trị lớn nhất (hoặc nhỏ nhất) của hàm số bậc hai đạt được tại", "options": ["A. $x = -\\dfrac{b}{2a}$.", "B. $x = 0$.", "C. $x = c$.", "D. $x = \\dfrac{b}{2a}$."], "answer": "A", "explain": "Đó chính là hoành độ đỉnh của parabol.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho hàm số $y = 2x^2 - x - 1$. Giao điểm của đồ thị với trục tung là", "options": ["A. $(0;\\, -1)$.", "B. $(0;\\, 1)$.", "C. $(-1;\\, 0)$.", "D. $(2;\\, 0)$."], "answer": "A", "explain": "Thay $x = 0$ được $y = -1$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hàm số $y = -x^2 + 4x - 4 = -(x - 2)^2$ nghịch biến trên khoảng", "options": ["A. $(2;\\, +\\infty)$.", "B. $(-\\infty;\\, 2)$.", "C. $(-\\infty;\\, +\\infty)$.", "D. $(0;\\, +\\infty)$."], "answer": "A", "explain": "Đỉnh $I(2;\\, 0)$, $a = -1 \\lt 0$ nên nghịch biến trên $(2;\\, +\\infty)$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho hàm số $y = x^2 - 4x + 3$. Diện tích của tam giác tạo bởi đỉnh của parabol và hai giao điểm của đồ thị với trục hoành là", "options": ["A. $1$.", "B. $2$.", "C. $4$.", "D. $3$."], "answer": "A", "explain": "Đỉnh $(2;\\, -1)$, hai giao điểm $(1;\\, 0)$ và $(3;\\, 0)$; đáy $= 2$, chiều cao $= 1$ nên $S = 1$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho hàm số $y = (m - 1)x^2 + 2x + 1$ là hàm số bậc hai và có giá trị lớn nhất. Khẳng định đúng về $m$ là", "options": ["A. $m \\lt 1$.", "B. $m \\gt 1$.", "C. $m = 1$.", "D. $m \\ge 1$."], "answer": "A", "explain": "Là hàm bậc hai nên $m \\ne 1$; có GTLN nên $a = m - 1 \\lt 0$, tức $m \\lt 1$.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Cho hàm số $y = x^2 - 4$. Xét tính đúng, sai:", "statements": ["a) Đỉnh của parabol là $I(0;\\, -4)$.", "b) Giá trị nhỏ nhất của hàm số bằng $-4$.", "c) Đồ thị cắt trục hoành tại $x = \\pm 2$.", "d) Hàm số nghịch biến trên $(0;\\, +\\infty)$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng ($a \\gt 0$). c) Đúng: $x^2 = 4$. d) Sai: đồng biến trên $(0;\\, +\\infty)$.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho hàm số $y = -3x^2 + 12x - 9$. Xét tính đúng, sai:", "statements": ["a) Đỉnh của parabol là $I(2;\\, 3)$.", "b) Giá trị lớn nhất của hàm số bằng $3$.", "c) Đồ thị cắt trục hoành tại $x = 1$ và $x = 3$.", "d) Hàm số đồng biến trên $(2;\\, +\\infty)$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $x = -12/(-6) = 2$, $y = -12 + 24 - 9 = 3$. b) Đúng ($a \\lt 0$). c) Đúng: $-3x^2 + 12x - 9 = 0$ cho $x = 1, 3$. d) Sai: nghịch biến trên $(2;\\, +\\infty)$.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho hàm số $y = x^2 - 3x + 2$. Tổng hai nghiệm của phương trình $y = 0$ bằng bao nhiêu?", "answer": "3", "explain": "Hai nghiệm là $1$ và $2$, tổng bằng $3$ (Viète: $-b/a = 3$).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho hàm số $y = x^2 - 6x + 5$. Khoảng cách từ đỉnh của parabol đến trục hoành bằng bao nhiêu?", "answer": "4", "explain": "Đỉnh $I(3;\\, -4)$ nên khoảng cách đến trục hoành là $|-4| = 4$.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Công thức tính $\\Delta$ của tam thức bậc hai $ax^2 + bx + c$ là", "options": ["A. $\\Delta = b^2 - 4ac$.", "B. $\\Delta = b^2 + 4ac$.", "C. $\\Delta = 4ac - b^2$.", "D. $\\Delta = b^2 - 2ac$."], "answer": "A", "explain": "$\\Delta = b^2 - 4ac$ là biệt thức của tam thức bậc hai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tung độ đỉnh $I$ của parabol $y = ax^2 + bx + c$ là", "options": ["A. $-\\dfrac{\\Delta}{4a}$.", "B. $\\dfrac{\\Delta}{4a}$.", "C. $-\\dfrac{b}{2a}$.", "D. $\\dfrac{b}{2a}$."], "answer": "A", "explain": "Tung độ đỉnh là $y_I = -\\Delta/4a$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho hàm số $y = x^2 + x - 2$. Giao điểm của đồ thị với trục hoành là", "options": ["A. $x = 1$ và $x = -2$.", "B. $x = 2$ và $x = -1$.", "C. $x = 1$.", "D. $x = -2$."], "answer": "A", "explain": "$x^2 + x - 2 = 0$ có hai nghiệm $x = 1$ và $x = -2$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hàm số $y = 6x^2 - 12x + 5$ có trục đối xứng là đường thẳng", "options": ["A. $x = 1$.", "B. $x = -1$.", "C. $x = 2$.", "D. $x = 6$."], "answer": "A", "explain": "$x = -b/2a = 12/12 = 1$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một mảnh đất hình chữ nhật có chu vi $30\\,\\text{m}$. Diện tích lớn nhất có thể của mảnh đất là", "options": ["A. $56{,}25\\,\\text{m}^2$.", "B. $225\\,\\text{m}^2$.", "C. $30\\,\\text{m}^2$.", "D. $15\\,\\text{m}^2$."], "answer": "A", "explain": "$S = x(15 - x) = -x^2 + 15x$ lớn nhất tại $x = 7{,}5$: $S_{\\max} = 56{,}25\\,\\text{m}^2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho hàm số $y = x^2 - 2mx + m^2 - 1$ có đỉnh $I(2;\\, -1)$. Giá trị của $m$ là", "options": ["A. $2$.", "B. $-2$.", "C. $1$.", "D. $3$."], "answer": "A", "explain": "Hoành độ đỉnh $x = -b/2a = m = 2$; kiểm tra: $y = 4 - 8 + 4 - 1 = -1$ đúng.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Cho hàm số $y = 2x^2 - 4x - 6$. Xét tính đúng, sai:", "statements": ["a) Đỉnh của parabol là $I(1;\\, -8)$.", "b) Đồ thị cắt trục tung tại điểm $(0;\\, -6)$.", "c) Đồ thị cắt trục hoành tại $x = -1$ và $x = 3$.", "d) Giá trị lớn nhất của hàm số bằng $-8$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $x = 1$, $y = 2 - 4 - 6 = -8$. b) Đúng. c) Đúng: $2x^2 - 4x - 6 = 0$ cho $x = -1, 3$. d) Sai: $a \\gt 0$ nên $-8$ là giá trị nhỏ nhất.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho hàm số $y = ax^2 - 4x + 1$ có giá trị nhỏ nhất bằng $-3$. Xét tính đúng, sai:", "statements": ["a) $a \\gt 0$.", "b) $\\Delta = 12$.", "c) Đỉnh của parabol là $I(2;\\, -3)$.", "d) $a = 2$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng vì có GTNN. b) Đúng: $y_{\\min} = -\\Delta/4a = -3$ và thử $a = 1$: $\\Delta = 16 - 4 = 12$. c) Đúng: $x = 4/(2a) = 2$ khi $a = 1$. d) Sai: từ $-\\Delta/4a = -3$ với $\\Delta = 16 - 4a$ suy ra $a = 1$.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho hàm số $y = -x^2 + 6x - 8$. Hoành độ đỉnh của parabol bằng bao nhiêu?", "answer": "3", "explain": "$x = -b/2a = -6/(-2) = 3$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho hàm số $y = 2x^2 - 12x + 10$. Giá trị nhỏ nhất của hàm số bằng bao nhiêu?", "answer": "-8", "explain": "Đỉnh $I(3;\\, -8)$, $a \\gt 0$ nên $y_{\\min} = -8$.", "points": 0.5}]}]}
