i $1 \\lt x \\lt 5$.", "c) Bất phương trình $f(x) \\le 0$ có tập nghiệm $[1;\\, 5]$.", "d) Bất phương trình $f(x) \\gt 0$ có $3$ nghiệm nguyên."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng (trong trái). c) Đúng. d) Sai: $f(x) \\gt 0$ khi $x \\lt 1$ hoặc $x \\gt 5$ có vô số nghiệm nguyên.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho bất phương trình $x^2 - 2mx + 1 \\gt 0$ nghiệm đúng với mọi $x \\in \\mathbb{R}$. Xét tính đúng, sai:", "statements": ["a) Cần $\\Delta' \\lt 0$.", "b) $m^2 - 1 \\lt 0$.", "c) $-1 \\lt m \\lt 1$.", "d) $m = 1$ thỏa mãn."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng: $\\Delta' = m^2 - 1 \\lt 0$. c) Đúng. d) Sai: $m = 1$ cho $\\Delta' = 0$, khi đó $f(1) = 0$ nên không nghiệm đúng với mọi $x$.", "points": 1}, {"type": "short", "level": "VD", "q": "Tập nghiệm của bất phương trình $x^2 - 5x + 6 \\le 0$ là đoạn $[a;\\, b]$. Giá trị $a + b$ bằng bao nhiêu?", "answer": "5", "explain": "Hai nghiệm là $2$ và $3$; $a + b = 2 + 3 = 5$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho $f(x) = x^2 - 4x + m$. Để $f(x) \\lt 0$ có nghiệm thì $m$ thỏa điều kiện $m \\lt a$. Giá trị $a$ bằng bao nhiêu?", "answer": "4", "explain": "$f(x) \\lt 0$ có nghiệm khi $\\Delta' = 4 - m \\gt 0$, tức $m \\lt 4$; $a = 4$.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Số nghiệm tối đa của tam thức bậc hai là", "options": ["A. $2$.", "B. $1$.", "C. $3$.", "D. Vô số."], "answer": "A", "explain": "Phương trình bậc hai có tối đa hai nghiệm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi $\\Delta = 0$, giá trị của tam thức $f(x) = ax^2 + bx + c$ tại nghiệm kép $x_0$ bằng", "options": ["A. $0$.", "B. $a$.", "C. $1$.", "D. $x_0$."], "answer": "A", "explain": "Tại nghiệm kép, tam thức bằng $0$ theo định lí về dấu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $f(x) = 5x^2 - 3x - 2$. Khẳng định $f(x) \\lt 0$ khi", "options": ["A. $-\\dfrac{2}{5} \\lt x \\lt 1$.", "B. $x \\lt -\\dfrac{2}{5}$ hoặc $x \\gt 1$.", "C. Mọi $x \\in \\mathbb{R}$.", "D. Không có $x$ nào."], "answer": "A", "explain": "Hai nghiệm là $-2/5$ và $1$, $a = 5 \\gt 0$ nên $f(x) \\lt 0$ khi $x$ ở trong khoảng hai nghiệm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tập nghiệm của bất phương trình $-x^2 - 3x + 4 \\gt 0$ là", "options": ["A. $(-4;\\, 1)$.", "B. $(-\\infty;\\, -4) \\cup (1;\\, +\\infty)$.", "C. $[-4;\\, 1]$.", "D. $\\varnothing$."], "answer": "A", "explain": "Hai nghiệm là $-4$ và $1$, $a = -1 \\lt 0$ nên $f(x) \\gt 0$ khi $x$ ở trong khoảng hai nghiệm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bất phương trình $x^2 - 2x + 1 \\gt 0$ có tập nghiệm là", "options": ["A. $\\mathbb{R} \\setminus \\{1\\}$.", "B. $\\mathbb{R}$.", "C. $(1;\\, +\\infty)$.", "D. $\\varnothing$."], "answer": "A", "explain": "$(x-1)^2 \\gt 0$ với mọi $x \\ne 1$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để phương trình $x^2 - 2(m - 1)x + m^2 = 0$ có hai nghiệm phân biệt thì", "options": ["A. $m \\lt \\dfrac{1}{2}$.", "B. $m \\gt \\dfrac{1}{2}$.", "C. $m = \\dfrac{1}{2}$.", "D. Mọi $m \\in \\mathbb{R}$."], "answer": "A", "explain": "Cần $\\Delta' = (m-1)^2 - m^2 = -2m + 1 \\gt 0$, tức $m \\lt 1/2$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét dấu tam thức $f(x) = -x^2 + 9$. Xét tính đúng, sai:", "statements": ["a) Hai nghiệm của $f(x) = 0$ là $\\pm 3$.", "b) $f(x) \\gt 0$ khi $-3 \\lt x \\lt 3$.", "c) $f(x) \\lt 0$ khi $x \\lt -3$ hoặc $x \\gt 3$.", "d) $f(0) = -9$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b), c) Đúng theo quy tắc trong trái ngoài cùng ($a \\lt 0$). d) Sai: $f(0) = 9$.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho bất phương trình $(x - 1)(x - 5) \\lt 0$. Xét tính đúng, sai:", "statements": ["a) Tập nghiệm là $(1;\\, 5)$.", "b) $x = 3$ là nghiệm của bất phương trình.", "c) $x = 0$ là nghiệm của bất phương trình.", "d) Bất phương trình có $3$ nghiệm nguyên."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai. d) Đúng: các số nguyên $2,\\, 3,\\, 4$ có $3$ số.", "points": 1}, {"type": "short", "level": "NB", "q": "Cho tam thức $f(x) = -x^2 + 2x + 8$. Nghiệm lớn hơn của phương trình $f(x) = 0$ bằng bao nhiêu?", "answer": "4", "explain": "$x^2 - 2x - 8 = 0$ cho $x = 4$ và $x = -2$; nghiệm lớn hơn là $4$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Có bao nhiêu số nguyên $x$ thỏa mãn bất phương trình $x^2 - 3x - 4 \\le 0$?", "answer": "6", "explain": "Tập nghiệm là $[-1;\\, 4]$; các số nguyên là $-1,\\, 0,\\, 1,\\, 2,\\, 3,\\, 4$, có $6$ số.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Bảng xét dấu giúp ta", "options": ["A. xác định dấu của tam thức trên từng khoảng.", "B. tìm nghiệm của phương trình.", "C. vẽ đồ thị parabol.", "D. tính $\\Delta$."], "answer": "A", "explain": "Bảng xét dấu cho biết $f(x)$ dương hay âm trên từng khoảng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giải bất phương trình bậc hai gồm các bước cơ bản là", "options": ["A. xét dấu tam thức rồi kết luận tập nghiệm.", "B. vẽ đồ thị rồi kết luận.", "C. thử từng giá trị $x$.", "D. chỉ cần tính $\\Delta$."], "answer": "A", "explain": "Hai bước: xét dấu tam thức (tìm nghiệm, lập bảng) rồi kết luận tập nghiệm theo chiều bất phương trình.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $f(x) = x^2 - 10x + 21$. Khẳng định $f(x) \\ge 0$ khi", "options": ["A. $x \\le 3$ hoặc $x \\ge 7$.", "B. $3 \\le x \\le 7$.", "C. Mọi $x \\in \\mathbb{R}$.", "D. Không có $x$ nào."], "answer": "A", "explain": "Hai nghiệm là $3$ và $7$, $a = 1 \\gt 0$ nên $f(x) \\ge 0$ khi $x$ ở ngoài (kể cả hai đầu) khoảng hai nghiệm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tập nghiệm của bất phương trình $9x^2 - 6x + 1 \\gt 0$ là", "options": ["A. $\\mathbb{R} \\setminus \\left\\{\\dfrac{1}{3}\\right\\}$.", "B. $\\mathbb{R}$.", "C. $\\left(\\dfrac{1}{3};\\, +\\infty\\right)$.", "D. $\\varnothing$."], "answer": "A", "explain": "$(3x-1)^2 \\gt 0$ với mọi $x \\ne 1/3$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho $f(x) = x^2 + bx + 9 \\ge 0$ với mọi $x \\in \\mathbb{R}$. Khẳng định đúng về $b$ là", "options": ["A. $-6 \\le b \\le 6$.", "B. $b \\ge 6$.", "C. $b \\le -6$.", "D. $b = 0$."], "answer": "A", "explain": "Cần $a = 1 \\gt 0$ và $\\Delta = b^2 - 36 \\le 0$, tức $-6 \\le b \\le 6$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để bất phương trình $x^2 + 2(m + 1)x + 9m - 5 \\lt 0$ vô nghiệm thì", "options": ["A. $1 \\le m \\le 6$.", "B. $m \\lt 1$ hoặc $m \\gt 6$.", "C. $m = 1$.", "D. Mọi $m \\in \\mathbb{R}$."], "answer": "A", "explain": "Vô nghiệm nghĩa là $f(x) \\ge 0$ mọi $x$: cần $\\Delta' = (m+1)^2 - (9m - 5) = m^2 - 7m + 6 \\le 0$, tức $1 \\le m \\le 6$.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Cho $f(x) = 4x^2 - 12x + 9$. Xét tính đúng, sai:", "statements": ["a) $\\Delta = 0$.", "b) Nghiệm kép của $f(x) = 0$ là $x = \\dfrac{3}{2}$.", "c) $f(x) \\ge 0$ với mọi $x$.", "d) Bất phương trình $f(x) \\lt 0$ vô nghiệm."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $\\Delta = 144 - 144 = 0$. b) Đúng: $x = 12/8 = 3/2$. c) Đúng: $(2x-3)^2 \\ge 0$. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho $f(x) = (m - 2)x^2 + 2x + 1$. Xét tính đúng, sai:", "statements": ["a) Để $f(x)$ là tam thức bậc hai thì $m \\ne 2$.", "b) Với $m = 3$ thì $\\Delta' = -2 \\lt 0$.", "c) Với $m = 1$ thì $f(x)$ có hai nghiệm phân biệt.", "d) Với $m = 2$ thì $f(x)$ là tam thức bậc hai."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: $m = 3$ cho $a = 1$, $\\Delta = 4 - 4 = 0$ nên $\\Delta' = 0$. c) Đúng: $m = 1$ cho $\\Delta = 4 + 4 = 8 \\gt 0$. d) Sai: $m = 2$ cho $f(x) = 2x + 1$ là hàm bậc nhất.", "points": 1}, {"type": "short", "level": "VD", "q": "Tập nghiệm của bất phương trình $-2x^2 + 7x - 3 \\lt 0$ là $(-\\infty;\\, a) \\cup (b;\\, +\\infty)$. Giá trị $a + b$ bằng bao nhiêu? (viết dưới dạng số thập phân)", "answer": "3,5", "explain": "$-2x^2 + 7x - 3 \\lt 0$ tương đương $2x^2 - 7x + 3 \\gt 0$: $x \\lt 1/2$ hoặc $x \\gt 3$; $a + b = 0,5 + 3 = 3,5$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Có bao nhiêu số nguyên $m$ thuộc đoạn $[0;\\, 6]$ để bất phương trình $x^2 - 4x + m \\ge 0$ nghiệm đúng với mọi $x \\in \\mathbb{R}$?", "answer": "3", "explain": "Cần $\\Delta' = 4 - m \\le 0$, tức $m \\ge 4$; các $m$ nguyên trong $[0;\\, 6]$ thỏa là $4,\\, 5,\\, 6$, có $3$ số.", "points": 0.5}]}]}
