ợc $x^2 - 5x + 6 = 0$ cho $x = 2$ và $x = 3$; cả hai đều thỏa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Số nghiệm của phương trình $\\sqrt{x - 1} = 3 - x$ là", "options": ["A. $1$.", "B. $2$.", "C. $0$.", "D. Vô số."], "answer": "A", "explain": "Điều kiện $x \\le 3$; bình phương được $x^2 - 7x + 10 = 0$ cho $x = 2$ (nhận) và $x = 5$ (loại).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Số nghiệm của phương trình $\\sqrt{2x^2 + 1} = x + 2$ là", "options": ["A. $2$.", "B. $1$.", "C. $0$.", "D. Vô số."], "answer": "A", "explain": "Điều kiện $x \\ge -2$; bình phương được $x^2 - 4x - 3 = 0$ cho $x = 2 \\pm \\sqrt{7}$, cả hai đều $\\ge -2$ nên đều nhận.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mọi phương trình chứa căn đều quy về phương trình bậc hai.", "b) Giải $\\sqrt{f(x)} = g(x)$ cần điều kiện $g(x) \\ge 0$.", "c) Nghiệm ngoại lai không thỏa mãn phương trình gốc.", "d) Thử lại nghiệm là bước bắt buộc."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: chỉ một số dạng quy về được. b), c), d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Giải phương trình $\\sqrt{x + 2} = x$. Xét tính đúng, sai:", "statements": ["a) Điều kiện là $x \\ge 0$.", "b) Bình phương hai vế được $x^2 - x - 2 = 0$.", "c) Hai nghiệm của phương trình bình phương là $2$ và $-1$.", "d) Nghiệm duy nhất của phương trình là $x = 2$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: $x = -1$ bị loại.", "points": 1}, {"type": "short", "level": "NB", "q": "Phương trình $\\sqrt{4x + 5} = 3$ có nghiệm $x = a$. Giá trị $a$ bằng bao nhiêu?", "answer": "1", "explain": "Bình phương được $4x + 5 = 9$, suy ra $x = 1$.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Phương trình $\\sqrt{x^2 - 16} = 0$ có nghiệm lớn nhất bằng bao nhiêu?", "answer": "4", "explain": "Bình phương được $x^2 = 16$ cho $x = \\pm 4$; nghiệm lớn nhất là $4$.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "$\\sqrt{x^2}$ bằng", "options": ["A. $|x|$.", "B. $x$.", "C. $-x$.", "D. $x^2$."], "answer": "A", "explain": "$\\sqrt{x^2} = |x|$ với mọi $x \\in \\mathbb{R}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để phương trình $\\sqrt{x - 2} = x - 4$ có nghiệm thì vế phải phải", "options": ["A. không âm.", "B. âm.", "C. bằng $0$.", "D. tùy ý."], "answer": "A", "explain": "Vì vế trái không âm nên vế phải cũng phải không âm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phương trình $\\sqrt{x - 2} = x - 4$ có nghiệm là", "options": ["A. $x = 6$.", "B. $x = 3$.", "C. $x = 4$.", "D. Vô nghiệm."], "answer": "A", "explain": "Điều kiện $x \\ge 4$; bình phương được $x^2 - 9x + 18 = 0$ cho $x = 3$ (loại) và $x = 6$ (nhận).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phương trình $\\sqrt{x^2 + 3} = 2$ có nghiệm là", "options": ["A. $x = \\pm 1$.", "B. $x = 1$.", "C. $x = -1$.", "D. Vô nghiệm."], "answer": "A", "explain": "Bình phương được $x^2 = 1$, cho $x = \\pm 1$; cả hai đều thỏa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Số nghiệm của phương trình $\\sqrt{x^2 + 4} = 2x - 1$ là", "options": ["A. $1$.", "B. $2$.", "C. $0$.", "D. Vô số."], "answer": "A", "explain": "Điều kiện $x \\ge 1/2$; bình phương được $3x^2 - 4x - 3 = 0$ cho hai nghiệm $\\dfrac{2 \\pm \\sqrt{13}}{3}$, chỉ nghiệm $\\dfrac{2 + \\sqrt{13}}{3}$ thỏa mãn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phương trình $\\sqrt{x^2 - 4x + 4} = 2x - 1$ có nghiệm là", "options": ["A. $x = 1$.", "B. $x = -1$.", "C. $x = \\pm 1$.", "D. Vô nghiệm."], "answer": "A", "explain": "Điều kiện $x \\ge 1/2$; bình phương được $3x^2 = 3$ cho $x = 1$ (nhận) và $x = -1$ (loại).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Giải phương trình $\\sqrt{x - 2} = x - 4$. Xét tính đúng, sai:", "statements": ["a) Điều kiện là $x \\ge 4$.", "b) Bình phương hai vế được $x^2 - 9x + 18 = 0$.", "c) Hai nghiệm của phương trình bình phương là $3$ và $6$.", "d) Nghiệm duy nhất của phương trình là $x = 6$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng: $x - 2 = x^2 - 8x + 16$. c) Đúng. d) Đúng: $x = 3$ bị loại.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho phương trình $\\sqrt{x^2 + 5x + 6} = \\sqrt{x + 2}$. Xét tính đúng, sai:", "statements": ["a) Bình phương hai vế được $(x + 2)^2 = 0$.", "b) Nghiệm (kép) của phương trình bình phương là $x = -2$.", "c) $x = -2$ thỏa mãn phương trình gốc.", "d) Phương trình đã cho vô nghiệm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $x^2 + 5x + 6 = x + 2$. b) Đúng. c) Đúng: thử lại thỏa. d) Sai.", "points": 1}, {"type": "short", "level": "NB", "q": "Phương trình $\\sqrt{2x + 7} = 5$ có nghiệm $x = a$. Giá trị $a$ bằng bao nhiêu?", "answer": "9", "explain": "Bình phương được $2x + 7 = 25$, suy ra $x = 9$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Phương trình $\\sqrt{x^2 - 2x + 1} = 3$ có nghiệm nhỏ nhất bằng bao nhiêu?", "answer": "-2", "explain": "$\\sqrt{(x-1)^2} = |x - 1| = 3$ cho $x = 4$ và $x = -2$; nghiệm nhỏ nhất là $-2$.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "$\\sqrt{a^2}$ với $a$ là số thực bằng", "options": ["A. $|a|$.", "B. $a$.", "C. $-a$.", "D. $a^2$."], "answer": "A", "explain": "$\\sqrt{a^2} = |a|$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phương trình $\\sqrt{f(x)} = \\sqrt{g(x)}$ cần điều kiện", "options": ["A. $f(x) \\ge 0$ (hoặc $g(x) \\ge 0$).", "B. $f(x) \\lt 0$.", "C. $f(x) = g(x) = 0$.", "D. không cần điều kiện."], "answer": "A", "explain": "Chỉ cần một trong hai biểu thức dưới căn không âm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nghiệm của phương trình $\\sqrt{x^2 + 5x + 6} = \\sqrt{x + 2}$ là", "options": ["A. $x = -2$.", "B. $x = 2$.", "C. $x = -1$.", "D. Vô nghiệm."], "answer": "A", "explain": "Bình phương được $(x+2)^2 = 0$, cho nghiệm kép $x = -2$ (thử lại thỏa).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phương trình $\\sqrt{5 - x} = 2$ có nghiệm là", "options": ["A. $x = 1$.", "B. $x = 9$.", "C. $x = 3$.", "D. Vô nghiệm."], "answer": "A", "explain": "Bình phương được $5 - x = 4$, suy ra $x = 1$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Số nghiệm của phương trình $\\sqrt{x^2 - 2x + 1} = 3$ là", "options": ["A. $2$.", "B. $1$.", "C. $0$.", "D. Vô số."], "answer": "A", "explain": "$|x - 1| = 3$ cho $x = 4$ và $x = -2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để phương trình $\\sqrt{x - m} = 2$ có nghiệm thì", "options": ["A. mọi $m \\in \\mathbb{R}$.", "B. $m \\ge 0$.", "C. $m \\le 0$.", "D. $m = 0$."], "answer": "A", "explain": "Bình phương được $x = m + 4$ luôn thỏa điều kiện $x - m = 4 \\ge 0$ với mọi $m$.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Cho phương trình $\\sqrt{x^2 - 4x + 4} = 2x - 1$. Xét tính đúng, sai:", "statements": ["a) Điều kiện là $2x - 1 \\ge 0$.", "b) Bình phương hai vế được $3x^2 = 3$.", "c) Hai nghiệm của phương trình bình phương là $\\pm 1$.", "d) Nghiệm duy nhất của phương trình là $x = 1$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng: $x^2 - 4x + 4 = 4x^2 - 4x + 1$. c) Đúng. d) Đúng: $x = -1$ bị loại.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho phương trình $\\sqrt{x^2 - 3x} = \\sqrt{x - 3}$. Xét tính đúng, sai:", "statements": ["a) Bình phương hai vế được $x^2 - 4x + 3 = 0$.", "b) Hai nghiệm của phương trình bình phương là $1$ và $3$.", "c) $x = 1$ thỏa mãn phương trình gốc.", "d) Nghiệm duy nhất của phương trình là $x = 3$."], "answer": ["T", "T", "F", "T"], "explain": "a), b) Đúng. c) Sai: $x = 1$ cho $x - 3 \\lt 0$. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Phương trình $\\sqrt{x^2 - 9} = 4$ có nghiệm dương bằng bao nhiêu?", "answer": "5", "explain": "Bình phương được $x^2 = 25$ cho $x = \\pm 5$; nghiệm dương là $5$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Phương trình $\\sqrt{2x - 1} = x - 2$ có nghiệm $x = a$. Giá trị $a$ bằng bao nhiêu?", "answer": "5", "explain": "Điều kiện $x \\ge 2$; bình phương được $x^2 - 6x + 5 = 0$ cho $x = 1$ (loại) và $x = 5$ (nhận).", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Khi nào cần thử lại nghiệm của phương trình?", "options": ["A. Sau khi bình phương hai vế.", "B. Sau khi đặt điều kiện.", "C. Sau khi rút gọn.", "D. Không bao giờ."], "answer": "A", "explain": "Vì bình phương có thể sinh nghiệm ngoại lai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "$\\sqrt{9} + \\sqrt{16}$ bằng", "options": ["A. $7$.", "B. $5$.", "C. $25$.", "D. $\\sqrt{25}$."], "answer": "A", "explain": "$\\sqrt{9} + \\sqrt{16} = 3 + 4 = 7$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nghiệm của phương trình $\\sqrt{2x - 1} = x - 2$ là", "options": ["A. $x = 5$.", "B. $x = 1$.", "C. $x = 2$.", "D. Vô nghiệm."], "answer": "A", "explain": "Điều kiện $x \\ge 2$; bình phương được $x^2 - 6x + 5 = 0$ cho $x = 1$ (loại) và $x = 5$ (nhận).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phương trình $\\sqrt{x^2 - 3x} = 0$ có nghiệm là", "options": ["A. $x = 0$ và $x = 3$.", "B. $x = 0$.", "C. $x = 3$.", "D. Vô nghiệm."], "answer": "A", "explain": "Bình phương được $x(x - 3) = 0$ cho $x = 0$ và $x = 3$; cả hai đều thỏa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Số nghiệm của phương trình $\\sqrt{x - 2} = x - 4$ là", "options": ["A. $1$.", "B. $2$.", "C. $0$.", "D. Vô số."], "answer": "A", "explain": "Điều kiện $x \\ge 4$; bình phương được $x^2 - 9x + 18 = 0$ cho $x = 3$ (loại) và $x = 6$ (nhận).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phương trình $\\sqrt{x^2 + 2x + 5} = 2x + 1$ có nghiệm là", "options": ["A. $x = \\dfrac{-1 + \\sqrt{13}}{3}$.", "B. $x = \\dfrac{-1 - \\sqrt{13}}{3}$.", "C. Cả hai nghiệm trên.", "D. Vô nghiệm."], "answer": "A", "explain": "Điều kiện $x \\ge -1/2$; bình phương được $3x^2 + 2x - 4 = 0$ cho hai nghiệm, chỉ $x = (-1+\\sqrt{13})/3 \\approx 0{,}87$ thỏa.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Giải phương trình $\\sqrt{2x - 1} = x - 2$. Xét tính đúng, sai:", "statements": ["a) Điều kiện là $x \\ge 2$.", "b) Bình phương hai vế được $x^2 - 6x + 5 = 0$.", "c) Hai nghiệm của phương trình bình phương là $1$ và $5$.", "d) Nghiệm duy nhất của phương trình là $x = 5$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: $x = 1$ bị loại.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho phương trình $\\sqrt{x^2 + x - 6} = \\sqrt{x + 3}$. Xét tính đúng, sai:", "statements": ["a) Bình phương hai vế được $x^2 - 9 = 0$.", "b) Hai nghiệm của phương trình bình phương là $\\pm 3$.", "c) Cả hai nghiệm đều thỏa mãn phương trình gốc.", "d) Phương trình đã cho có $2$ nghiệm."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $x^2 + x - 6 = x + 3$. b) Đúng. c) Đúng: $x = 3$ cho $6 \\ge 0$, $x = -3$ cho $0 \\ge 0$. d) Đúng.", "points": 1}, {"type": "short", "level": "TH", "q": "Phương trình $\\sqrt{7 - 2x} = 1$ có nghiệm $x = a$. Giá trị $a$ bằng bao nhiêu?", "answer": "3", "explain": "Bình phương được $7 - 2x = 1$, suy ra $x = 3$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Phương trình $\\sqrt{x^2 - 4} = \\sqrt{x - 2}$ có bao nhiêu nghiệm nguyên?", "answer": "1", "explain": "Bình phương được $x^2 - x - 2 = 0$ cho $x = 2$ (nhận) và $x = -1$ (loại); có $1$ nghiệm nguyên.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Bước nào KHÔNG thuộc quy trình giải phương trình $\\sqrt{f(x)} = g(x)$?", "options": ["A. Vẽ đồ thị.", "B. Đặt điều kiện $g(x) \\ge 0$.", "C. Bình phương hai vế.", "D. Thử lại nghiệm."], "answer": "A", "explain": "Quy trình gồm: đặt điều kiện, bình phương hai vế, thử lại nghiệm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nếu $g(x) \\lt 0$ thì phương trình $\\sqrt{f(x)} = g(x)$", "options": ["A. vô nghiệm.", "B. có vô số nghiệm.", "C. có một nghiệm.", "D. có hai nghiệm."], "answer": "A", "explain": "Vế trái không âm nên không thể bằng vế phải âm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phương trình $\\sqrt{x^2 - 4} = \\sqrt{x - 2}$ có nghiệm là", "options": ["A. $x = 2$.", "B. $x = -1$.", "C. $x = 1$.", "D. Vô nghiệm."], "answer": "A", "explain": "Bình phương được $x^2 - x - 2 = 0$ cho $x = 2$ (nhận) và $x = -1$ (loại).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phương trình $\\sqrt{3x + 7} = 4$ có nghiệm là", "options": ["A. $x = 3$.", "B. $x = 9$.", "C. $x = 1$.", "D. Vô nghiệm."], "answer": "A", "explain": "Bình phương được $3x + 7 = 16$, suy ra $x = 3$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Số nghiệm nguyên của phương trình $\\sqrt{x^2 - 4} = \\sqrt{x - 2}$ là", "options": ["A. $1$.", "B. $2$.", "C. $0$.", "D. Vô số."], "answer": "A", "explain": "Nghiệm duy nhất $x = 2$ là số nguyên.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để phương trình $\\sqrt{x^2 + 1} = x + m$ có nghiệm thì", "options": ["A. $m \\gt 0$.", "B. $m \\lt 0$.", "C. $m = 0$.", "D. Mọi $m \\in \\mathbb{R}$."], "answer": "A", "explain": "Điều kiện $x \\ge -m$; bình phương được $x = (1-m^2)/2m$ ($m \\ne 0$); cần $x \\ge -m$, tức $(1+m^2)/2m \\ge 0$, suy ra $m \\gt 0$.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Cho phương trình $\\sqrt{x^2 + 2x + 5} = 2x + 1$. Xét tính đúng, sai:", "statements": ["a) Điều kiện là $x \\ge -\\dfrac{1}{2}$.", "b) Bình phương hai vế được $3x^2 + 2x - 4 = 0$.", "c) Hai nghiệm của phương trình bình phương là $\\dfrac{-1 \\pm \\sqrt{13}}{3}$.", "d) Nghiệm duy nhất của phương trình là $x = \\dfrac{-1 + \\sqrt{13}}{3}$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: nghiệm kia $\\approx -1{,}54 \\lt -1/2$ bị loại.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho phương trình $\\sqrt{2x^2 + 1} = x + 2$. Xét tính đúng, sai:", "statements": ["a) Điều kiện là $x \\ge -2$.", "b) Bình phương hai vế được $x^2 - 4x - 3 = 0$.", "c) Hai nghiệm của phương trình bình phương là $2 \\pm \\sqrt{7}$.", "d) Cả hai nghiệm đều thỏa mãn phương trình gốc."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: $2 - \\sqrt{7} \\approx -0{,}65 \\ge -2$.", "points": 1}, {"type": "short", "level": "VD", "q": "Phương trình $\\sqrt{x + 3} = x - 3$ có nghiệm $x = a$. Giá trị $a$ bằng bao nhiêu?", "answer": "6", "explain": "Điều kiện $x \\ge 3$; bình phương được $x^2 - 7x + 6 = 0$ cho $x = 1$ (loại) và $x = 6$ (nhận).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Phương trình $\\sqrt{4 - x^2} = x$ có bao nhiêu nghiệm?", "answer": "1", "explain": "Điều kiện $x \\ge 0$; bình phương được $x^2 = 2$ cho $x = \\sqrt{2}$ (nhận) và $x = -\\sqrt{2}$ (loại).", "points": 0.5}]}]}
