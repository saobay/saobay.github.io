mathbb{R} \\setminus \\{0\\}$.", "C. $(-1;\\, +\\infty)$.", "D. $\\mathbb{R} \\setminus \\{-1\\}$."], "answer": "A", "explain": "Mẫu $x^2 + 1 \\gt 0$ với mọi $x$ nên hàm số xác định trên $\\mathbb{R}$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho hàm số $f(x) = 2x + 1$ và $g(x) = x - 3$. Giá trị $f(1) + g(2)$ bằng", "options": ["A. $2$.", "B. $4$.", "C. $0$.", "D. $-2$."], "answer": "A", "explain": "$f(1) = 3$, $g(2) = -1$ nên tổng bằng $2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hàm số $y = \\sqrt{m - x}$ có tập xác định $D = (-\\infty;\\, 3]$. Giá trị của $m$ là", "options": ["A. $3$.", "B. $-3$.", "C. $0$.", "D. $9$."], "answer": "A", "explain": "Hàm số xác định khi $m - x \\ge 0$, tức $x \\le m$; để $D = (-\\infty;\\, 3]$ thì $m = 3$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho hàm số $y = |x|$. Xét tính đúng, sai:", "statements": ["a) Tập xác định là $\\mathbb{R}$.", "b) $f(-3) = 3$.", "c) Hàm số nghịch biến trên $(-\\infty;\\, 0)$.", "d) Hàm số đồng biến trên $\\mathbb{R}$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: $|-3| = 3$. c) Đúng: trên $(-\\infty;\\, 0)$ thì $y = -x$ nghịch biến. d) Sai: chỉ đồng biến trên $(0;\\, +\\infty)$.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho hàm số $y = f(x) = \\dfrac{2x}{x^2 + 4}$. Xét tính đúng, sai:", "statements": ["a) Tập xác định là $\\mathbb{R}$.", "b) $f(0) = 0$.", "c) $f(2) = \\dfrac{1}{2}$.", "d) Điểm $(2;\\, 1)$ thuộc đồ thị."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: mẫu $x^2 + 4 \\gt 0$ với mọi $x$. b) Đúng. c) Đúng: $4/8 = 1/2$. d) Sai: $f(2) = 1/2 \\ne 1$.", "points": 1}, {"type": "short", "level": "NB", "q": "Cho hàm số $y = x + 9$. Giá trị $f(-9)$ bằng bao nhiêu?", "answer": "0", "explain": "$f(-9) = -9 + 9 = 0$.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Hàm số $y = -4x + b$ có đồ thị đi qua điểm $(2;\\, 1)$. Giá trị $b$ bằng bao nhiêu?", "answer": "9", "explain": "$-4\\times 2 + b = 1$ ": "A", "explain": "Cần $6 - 2x \\ge 0$, tức $x \\le 3$; các số nguyên trong $[0;\\, 10]$ thỏa là $0;\\, 1;\\, 2;\\, 3$, có $4$ số.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Cho hàm số $y = 2x + 4$. Xét tính đúng, sai:", "statements": ["a) Tập xác định là $\\mathbb{R}$.", "b) Hàm số nghịch biến trên $\\mathbb{R}$.", "c) Đồ thị cắt trục hoành tại điểm $(-2;\\, 0)$.", "d) $f(-1) = 2$."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: hệ số $2 \\gt 0$ nên đồng biến. c) Đúng: $2x + 4 = 0$ cho $x = -2$. d) Đúng: $-2 + 4 = 2$.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho hàm số $y = \\sqrt{x + 2} - 1$. Xét tính đúng, sai:", "statements": ["a) Tập xác định là $[-2;\\, +\\infty)$.", "b) $f(2) = 1$.", "c) Điểm $(-2;\\, -1)$ thuộc đồ thị.", "d) Tập giá trị là $[-1;\\, +\\infty)$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $x + 2 \\ge 0$. b) Đúng: $\\sqrt{4} - 1 = 1$. c) Đúng: $\\sqrt{0} - 1 = -1$. d) Đúng: $\\sqrt{x+2} \\ge 0$ nên $y \\ge -1$, mọi giá trị $\\ge -1$ đều đạt được.", "points": 1}, {"type": "short", "level": "TH", "q": "Cho hàm số $y = 5x^2$. Giá trị $f(-2)$ bằng bao nhiêu?", "answer": "20", "explain": "$f(-2) = 5\\times 4 = 20$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tập xác định của hàm số $y = \\dfrac{1}{\\sqrt{9 - x^2}}$ là khoảng $(a;\\, b)$. Giá trị $b - a$ bằng bao nhiêu?", "answer": "6", "explain": "Cần $9 - x^2 \\gt 0$, tức $-3 \\lt x \\lt 3$; $b - a = 3 - (-3) = 6$.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Một hàm số có thể được cho bằng", "options": ["A. bảng, biểu đồ, công thức hoặc mô tả bằng lời.", "B. chỉ bằng công thức.", "C. chỉ bằng bảng số liệu.", "D. chỉ bằng đồ thị."], "answer": "A", "explain": "Theo nhận xét trong SGK, hàm số có thể cho bằng bảng, biểu đồ, công thức hoặc lời.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong định nghĩa hàm số, tập hợp $D$ được gọi là", "options": ["A. tập xác định củ ": 0.25}, {"type": "mcq", "level": "TH", "q": "Tập xác định của hàm số $y = \\sqrt{2 - x} + \\dfrac{1}{x}$ là", "options": ["A. $(-\\infty;\\, 2] \\setminus \\{0\\}$.", "B. $(-\\infty;\\, 2)$.", "C. $\\mathbb{R} \\setminus \\{0\\}$.", "D. $[0;\\, 2]$."], "answer": "A", "explain": "Cần $2 - x \\ge 0$ và $x \\ne 0$, tức $x \\le 2$ và $x \\ne 0$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho hàm số $y = f(x) = 3x - 2$. Biết $f(a) = 7$. Giá trị của $a$ là", "options": ["A. $3$.", "B. $5$.", "C. $19$.", "D. $-3$."], "answer": "A", "explain": "$3a - 2 = 7$ suy ra $a = 3$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tập xác định của hàm số $y = \\sqrt{x^2 - 4}$ là", "options": ["A. $(-\\infty;\\, -2] \\cup [2;\\, +\\infty)$.", "B. $[-2;\\, 2]$.", "C. $\\mathbb{R}$.", "D. $(-\\infty;\\, -2) \\cup (2;\\, +\\infty)$."], "answer": "A", "explain": "Cần $x^2 - 4 \\ge 0$, tức $|x| \\ge 2$. (Phương án D sai vì thiếu dấu bằng tại $x = \\pm 2$.)", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Cho hàm số $y = -2x + 6$. Xét tính đúng, sai:", "statements": ["a) Hàm số nghịch biến trên $\\mathbb{R}$.", "b) Đồ thị cắt trục hoành tại điểm $(3;\\, 0)$.", "c) $f(0) = 6$.", "d) Điểm $(1;\\, 5)$ thuộc đồ thị."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng vì hệ số $-2 \\lt 0$. b) Đúng: $-2x + 6 = 0$ cho $x = 3$. c) Đúng. d) Sai: $f(1) = 4 \\ne 5$.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Cho hàm số $y = f(x)$ xác định trên $[-2;\\, 3]$ có bảng biến thiên: $x$: $-2 \\to 1 \\to 3$; $y$: $0$ đi lên $5$ rồi đi xuống $2$. Xét tính đúng, sai:", "statements": ["a) Hàm số đồng biến trên $(-2;\\, 1)$.", "b) Hàm số nghịch biến trên $(1;\\, 3)$.", "c) $f(1) = 5$.", "d) Tập giá trị của hàm số là $[0;\\, 5]$."], "answer": ["T", "T", "T", "T"], "explain": "a), b) Đúng theo các mũi tên. c) Đúng. d) Đúng: giá trị nhỏ nhất là $0$, lớn nhất là $5$.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho hàm số $y = x^3 - x$. Giá trị $f(2)$
