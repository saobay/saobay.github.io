q":"Điểm nào sau đây thuộc đường thẳng $d: -3x - 4y + 3 = 0$?","options":["A. $M(-2; 3)$","B. $M(2; -1)$","C. $M(1; -3)$","D. $M(-3; 3)$"],"answer":"D","explain":"Thay tọa độ từng điểm vào phương trình: chỉ có $M(-3; 3)$ thỏa mãn $-3 \\cdot -3 - 12 \\cdot 3 + 3 = 0$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho đường thẳng $\\Delta$ có một vectơ chỉ phương $\\vec{u} = (3; 4)$. Vectơ nào sau đây là một vectơ pháp tuyến của $\\Delta$?","options":["A. $\\vec{n} = (-3; -4)$","B. $\\vec{n} = (3; 4)$","C. $\\vec{n} = (4; -3)$","D. $\\vec{n} = (4; 3)$"],"answer":"C","explain":"VTPT $\\vec{n}$ phải vuông góc với VTCP $\\vec{u} = (3; 4)$, tức $\\vec{u} \\cdot \\vec{n} = 0$. Với $\\vec{n} = (4; -3)$ ta có $3 \\cdot 4 + 4 \\cdot (3) = 0$. (Mẹo: \"đổi chỗ, đổi dấu một thành phần\".)","points":0.25},{"type":"mcq","level":"TH","q":"Phương trình tham số của đường thẳng đi qua $M_0(-4; 3)$ và có vectơ chỉ phương $\\vec{u} = (5; -1)$ là","options":["A. $\\begin{cases} x = -4 + 5t \\\\ y = 3 + t \\end{cases}$","B. $\\begin{cases} x = -3 + 5t \\\\ y = 3 - t \\end{cases}$","C. $\\begin{cases} x = -4 - t \\\\ y = 3 + 5t \\end{cases}$","D. $\\begin{cases} x = -4 + 5t \\\\ y = 3 - t \\end{cases}$"],"answer":"D","explain":"Áp dụng công thức $\\begin{cases} x = x_0 + tu_1 \\\\ y = y_0 + tu_2 \\end{cases}$ với $x_0 = -4, y_0 = 3, u_1 = 5, u_2 = -1$.","points":0.25},{"type":"mcq","level":"VD","q":"Phương trình đường thẳng đi qua $M(4; 3)$ và song song với đường thẳng $d: -x + 2y + 5 = 0$ là","options":["A. $-x + 2y + 0 = 0$","B. $-x + 2y + 11 = 0$","C. $-x + 2y - 2 = 0$","D. $-x + 2y - 3 = 0$"],"answer":"C","explain":"Đường thẳng song song với $d$ có cùng VTPT $(-1; 2)$ nên dạng $-x + 2y + c' = 0$. Đi qua $M(4; 3)$ nên $-1 \\cdot 4 + 6 \\cdot 3 + c' = 0 \\Rightarrow c' = -2$.","points":0.25},{"type":"mcq","level":"VDC","q":"Phương trình tổng quát của đường thẳng đi qua hai điểm $A(-3; 3)$ và $B(-6; 2)$ là","options":["A. $x + 3y + 12 = 0$","B. $-x - 3y + 12 = 0$","C. $x - 3y + 13 = 0$"  3)$ thuộc đường thẳng $d: x - 4y + m = 0$.","answer":"$16$","explain":"$A \\in d \\Leftrightarrow 1 \\cdot (-4) - 12 \\cdot (3) + m = 0 \\Leftrightarrow m = 16$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Cho đường thẳng $d: -2x - 4y - 4 = 0$. Vectơ nào sau đây là một vectơ pháp tuyến của $d$?","options":["A. $\\vec{n} = (-4; -2)$","B. $\\vec{n} = (4; -2)$","C. $\\vec{n} = (-2; -4)$","D. $\\vec{n} = (-4; 2)$"],"answer":"C","explain":"Đường thẳng $d: ax + by + c = 0$ có một VTPT là $\\vec{n} = (a; b) = (-2; -4)$. (Vectơ $(b; -a)$ là VTCP, không phải VTPT.)","points":0.25},{"type":"mcq","level":"NB","q":"Điểm nào sau đây thuộc đường thẳng $d: 4x + 3y + 6 = 0$?","options":["A. $M(1; -3)$","B. $M(-2; 0)$","C. $M(0; -2)$","D. $M(-4; 0)$"],"answer":"C","explain":"Thay tọa độ từng điểm vào phương trình: chỉ có $M(0; -2)$ thỏa mãn $4 \\cdot 0 - 6 \\cdot -2 + 6 = 0$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho đường thẳng $\\Delta$ có một vectơ chỉ phương $\\vec{u} = (-2; -3)$. Vectơ nào sau đây là một vectơ pháp tuyến của $\\Delta$?","options":["A. $\\vec{n} = (-2; -3)$","B. $\\vec{n} = (-3; -2)$","C. $\\vec{n} = (2; 3)$","D. $\\vec{n} = (-3; 2)$"],"answer":"D","explain":"VTPT $\\vec{n}$ phải vuông góc với VTCP $\\vec{u} = (-2; -3)$, tức $\\vec{u} \\cdot \\vec{n} = 0$. Với $\\vec{n} = (-3; 2)$ ta có $-2 \\cdot -3 + -3 \\cdot (-2) = 0$. (Mẹo: \"đổi chỗ, đổi dấu một thành phần\".)","points":0.25},{"type":"mcq","level":"TH","q":"Phương trình tham số của đường thẳng đi qua $M_0(4; 1)$ và có vectơ chỉ phương $\\vec{u} = (-3; 5)$ là","options":["A. $\\begin{cases} x = 5 - 3t \\\\ y = 1 + 5t \\end{cases}$","B. $\\begin{cases} x = 4 - 3t \\\\ y = 1 - 5t \\end{cases}$","C. $\\begin{cases} x = 4 - 3t \\\\ y = 1 + 5t \\end{cases}$","D. $\\begin{cases} x = 4 + 5t \\\\ y = 1 - 3t \\end{cases}$"],"answer":"C","explain":"Áp dụng công thức $\\begin{cases} x = x_0 + tu_1 \\\\ y = y_0 + tu_2 \\end{cases}$ với $x_0 = 4, y_0 = 1, u_1 = -3, u_2 = 5$.","points":0.25},{"type":"mcq","level":"VD","q":"Phương trình đường thẳng đi qua $M(-2; -3)$ và song song với đường thẳng $d: -4x + 2y + 5 = 0$ là","options":["A. $-4x + 2y - 1 = 0$","B. $-4x + 2y - 2 = 0$","C. $-4x + 2y - 16 = 0$","D. $-4x + 2y - 3 = 0$"],"answer":"B","explain":"Đường thẳng song song với $d$ có cùng VTPT $(-4; 2)$ nên dạng $-4x + 2y + c' = 0$. Đi qua $M(-2; -3)$ nên $-4 \\cdot -2 - 6 \\cdot -3 + c' = 0 \\Rightarrow c' = -2$.","points":0.25},{"type":"mcq","level":"VDC","q":"Phương trình tổng quát của đường thẳng đi qua hai điểm $A(2; 1)$ và $B(6; 4)$ là","options":["A. $3x + 4y - 2 = 0$","B. $3x - 4y - 1 = 0$","C. $3x - 4y - 2 = 0$","D. $-3x - 4y - 2 = 0$"],"answer":"C","explain":"$\\overrightarrow{AB} = (4; 3)$ là một VTCP nên VTPT $\\vec{n} = (3; -4)$. Phương trình: $3(x - 2) - 4(y - 1) = 0 \\Leftrightarrow 3x - 4y - 2 = 0$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét đường thẳng $d: 5x + 1y = 0$. Mỗi nhận định sau là đúng hay sai?","statements":["Vectơ $\\vec{u} = (1; -5)$ là một vectơ chỉ phương của đường thẳng $d: 5x + 1y = 0$.","Vectơ $\\vec{n} = (5; 1)$ là một vectơ pháp tuyến của đường thẳng $d: 5x + 1y = 0$.","Đường thẳng $d: 5x + 1y = 0$ đi qua gốc tọa độ $O$.","Mỗi đường thẳng chỉ có duy nhất một vectơ chỉ phương."],"answer":["T","T","T","F"],"explain":"a) Đúng: $(1; -5) \\cdot (5; 1) = 0$ nên $(1; -5)$ vuông góc VTPT, là VTCP. b) Đúng theo định nghĩa. c) Đúng: $O(0; 0)$ thỏa mãn phương trình (hệ số tự do bằng 0). d) Sai: có vô số VTCP cùng phương với nhau.","points":1},{"type":"truefalse","level":"TH","q":"Cho $\\Delta: \\begin{cases} x = 3 + t \\\\ y = -3 + t \\end{cases} \\; (t \\in \\mathbb{R})$. Mỗi nhận định sau là đúng hay sai?","statements":["Đường thẳng $\\Delta: \\begin{cases} x = 3 + t \\\\ y = -3 + t \\end{cases}$ đi qua điểm $M_0(3; -3)$.","Đường thẳng $\\Delta$ trên có một vectơ pháp tuyến là $\\vec{n} = (1; -1)$.","Phương trình tổng quát của $\\Delta$ là $x - 1y - 6 = 0$.","Điểm $M(4; -2)$ thuộc đường thẳng $\\Delta$."],"answer":["T","T","T","T"],"explain":"a) Đúng: ứng với $t = 0$. b) Đúng: $\\vec{n} = (u_2; -u_1)$ vuông góc VTCP $(u_1; u_2)$. c) Đúng: khử $t$ hoặc dùng công thức $A(x - x_0) + B(y - y_0) = 0$. d) Đúng: ứng với $t = 1$.","points":1},{"type":"short","level":"VD","q":"Cho đường thẳng $\\Delta: \\begin{cases} x = 2 + 4t \\\\ y = -3 + t \\end{cases} \\; (t \\in \\mathbb{R})$. Tìm hoành độ giao điểm của $\\Delta$ với trục $Ox$.","answer":"$14$","explain":"Giao điểm với $Ox$ có $y = 0$ nên $-3 + t = 0$, suy ra $t = 3$. Thay vào phương trình của $x$: $x = 2 + 12 = 14$.","points":0.5},{"type":"short","level":"VDC","q":"Tìm $m$ để điểm $A(3; 1)$ thuộc đường thẳng $d: 4x - 1y + m = 0$.","answer":"$-11$","explain":"$A \\in d \\Leftrightarrow 4 \\cdot (3) - 1 \\cdot (1) + m = 0 \\Leftrightarrow m = -11$.","points":0.5}]}]}</script>
