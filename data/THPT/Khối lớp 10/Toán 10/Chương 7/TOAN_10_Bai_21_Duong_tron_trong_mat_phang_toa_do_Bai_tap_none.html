<script type="application/json" class="saobay-exam10-data">{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Cho đường tròn $(C)$: $(x - 0)^2 + (y + 3)^2 = 4$. Tâm và bán kính của $(C)$ là","options":["A. $I(0; 3)$, $R = 2$","B. $I(0; -3)$, $R = 4$","C. $I(0; -3)$, $R = 2$","D. $I(0; -3)$, $R = 3$"],"answer":"C","explain":"Dạng $(x - a)^2 + (y - b)^2 = R^2$ cho tâm $I(a; b) = I(0; -3)$ và $R^2 = 4 \\Rightarrow R = 2$.","points":0.25},{"type":"mcq","level":"NB","q":"Phương trình nào sau đây là phương trình của một đường tròn?","options":["A. $x^2 - y^2 + 4x + 4y - 28 = 0$","B. $x^2 + y^2 - 8x + 2y + 18 = 0$","C. $x^2 + y^2 + 4x + 4y + 9 = 0$","D. $x^2 + y^2 + 4x + 4y - 28 = 0$"],"answer":"D","explain":"Kiểm tra điều kiện $a^2 + b^2 - c \\gt 0$: chỉ có $x^2 + y^2 + 4x + 4y - 28 = 0$ thỏa mãn ($4 + 4 - (-28) = 36 \\gt 0$).","points":0.25},{"type":"mcq","level":"TH","q":"Phương trình đường tròn tâm $I(-4; 1)$ bán kính $R = 5$ là","options":["A. $(x + 4)^2 + (y - 1)^2 = 36$","B. $(x - 4)^2 + (y + 1)^2 = 25$","C. $(x + 4)^2 + (y - 1)^2 = 25$","D. $(x + 4)^2 + (y - 1)^2 = 5$"],"answer":"C","explain":"Áp dụng $(x - a)^2 + (y - b)^2 = R^2$ với $a = -4, b = 1, R = 5$: $(x + 4)^2 + (y - 1)^2 = 25$.","points":0.25},{"type":"mcq","level":"TH","q":"Tâm và bán kính của đường tròn $(C)$: $x^2 + y^2 + 4x - 8y - 5 = 0$ là","options":["A. $I(2; -4)$, $R = 5$","B. $I(-4; 8)$, $R = 5$","C. $I(-2; 4)$, $R = 25$","D. $I(-2; 4)$, $R = 5$"],"answer":"D","explain":"$-2a_1 = 4 \\Rightarrow a_1 = -2$; $-2b_1 = -8 \\Rightarrow b_1 = 4$; $R = \\sqrt{4 + 16 - (-5)} = 5$.","points":0.25},{"type":"mcq","level":"VD","q":"Phương trình đường tròn đường kính $AB$ với $A(-2; 0)$, $B(-14; 16)$ là","options":["A. $(x + 2)^2 + (y - 0)^2 = 100$","B. $(x + 7)^2 + (y - 8)^2 = 100$","C. $(x + 8)^2 + (y - 8)^2 = 100$","D. $(x + 8)^2 + (y - 8)^2 = 400$"],"answer":"C","explain":"Tâm là trung điểm $AB$: $I(-8; 8)$. Bán kính $R = \\frac{AB}{2} = \\frac{\\sqrt{-12^2 + 16^2}}{2} = 10$. Vậy $(x + 8)^2 + (y - 8)^2 = 100$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho đường tròn $(C)$: $(x + 1)^2 + (y - 0)^2 = 100$. Phương trình tiếp tuyến của $(C)$ tại điểm $M_0(5; 8)$ là","options":["A. $6(x + 1) - -8(y - 0) = 100$","B. $6(x + 1) + 8(y - 0) = 101$","C. $6(x + 1) + 8(y - 0) = 100$","D. $8(x + 1) + 6(y - 0) = 100$"],"answer":"C","explain":"Quy tắc \"tách đôi\": $(x_0 - a)(x - a) + (y_0 - b)(y - b) = R^2$ với $x_0 - a = 6$, $y_0 - b = 8$, $R^2 = 100$: $6(x + 1) + 8(y - 0) = 100$.","points":0.25},{"type":"truefalse","level":"NB","q":"Cho đường tròn $(C)$: $(x + 4)^2 + (y - 1)^2 = 64$. Mỗi nhận định sau là đúng hay sai?","statements":["Tâm của $(C)$: $(x + 4)^2 + (y - 1)^2 = 64$ là $I(-4; 1)$.","Bán kính của $(C)$ bằng $8$.","Điểm $I(-4; 1)$ thuộc đường tròn $(C)$.","Đường tròn $(C)$ đi qua gốc tọa độ $O$."],"answer":["T","T","F","F"],"explain":"a) Đúng. b) Đúng: $R^2 = 64$. c) Sai: $I$ là tâm, $II = 0 \\ne R$. d) Sai: $OI^2 = -4^2 + 1^2 = 17$ \\ne $R^2 = 64$.","points":1},{"type":"truefalse","level":"TH","q":"Cho $(C)$: $x^2 + y^2 + 4y - 32 = 0$. Mỗi nhận định sau là đúng hay sai?","statements":["Tâm của $(C)$: $x^2 + y^2 + 4y - 32 = 0$ là $I(0; -2)$.","Bán kính của $(C)$ bằng $\\sqrt{36}$.","Điều kiện để $x^2 + y^2 + 4y - 32 = 0$ là phương trình đường tròn là $a^2 + b^2 - c \\gt 0$.","Tiếp tuyến của $(C)$ tại $M_0(x_0; y_0) \\in (C)$ là $(x_0 - 0)(x - 0) + (y_0 + 2)(y + 2) = 36$."],"answer":["T","T","T","T"],"explain":"a) Đúng. b) Đúng: $R = \\sqrt{a^2 + b^2 - c} = \\sqrt{36}$. c) Đúng theo lý thuyết. d) Đúng (quy tắc \"tách đôi\").","points":1},{"type":"short","level":"VD","q":"Cho đường tròn $(C)$: $x^2 + y^2 - 4x + 6y - 36 = 0$. Tìm bán kính $R$ của $(C)$.","answer":"$7$","explain":"$R = \\sqrt{a^2 + b^2 - c} = \\sqrt{4 + 9 - (-36)} = \\sqrt{49} = 7$.","points":0.5},{"type":"short","level":"VDC","q":"Viết phương trình đường tròn đi qua ba điểm $O(0; 0)$, $A(24; 0)$, $B(0; 70)$. Tìm bán kính $R$ của đường tròn đó.","answer":"$37$","explain":"Tam giác $OAB$ vuông tại $O$ nên $AB$ là đường kính. $AB = \\sqrt{24^2 + 70^2} = 74$, suy ra $R = \\frac{AB}{2} = 37$.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Cho đường tròn $(C)$: $(x + 5)^2 + (y + 4)^2 = 81$. Tâm và bán kính của $(C)$ là","options":["A. $I(-5; -4)$, $R = 9$","B. $I(-5; -4)$, $R = 81$","C. $I(-5; -4)$, $R = 10$","D. $I(5; 4)$, $R = 9$"],"answer":"A","explain":"Dạng $(x - a)^2 + (y - b)^2 = R^2$ cho tâm $I(a; b) = I(-5; -4)$ và $R^2 = 81 \\Rightarrow R = 9$.","points":0.25},{"type":"mcq","level":"NB","q":"Phương trình nào sau đây là phương trình của một đường tròn?","options":["A. $x^2 + y^2 - 2x - 4y + 10 = 0$","B. $x^2 + y^2 - 6x + 8y + 30 = 0$","C. $x^2 + y^2 - 6x + 8y + 0 = 0$","D. $x^2 - y^2 - 6x + 8y + 0 = 0$"],"answer":"C","explain":"Kiểm tra điều kiện $a^2 + b^2 - c \\gt 0$: chỉ có $x^2 + y^2 - 6x + 8y + 0 = 0$ thỏa mãn ($9 + 16 - (0) = 25 \\gt 0$).","points":0.25},{"type":"mcq","level":"TH","q":"Phương trình đường tròn tâm $I(-3; 4)$ bán kính $R = 8$ là","options":["A. $(x + 3)^2 + (y - 4)^2 = 8$","B. $(x - 3)^2 + (y + 4)^2 = 64$","C. $(x + 3)^2 + (y - 4)^2 = 81$","D. $(x + 3)^2 + (y - 4)^2 = 64$"],"answer":"D","explain":"Áp dụng $(x - a)^2 + (y - b)^2 = R^2$ với $a = -3, b = 4, R = 8$: $(x + 3)^2 + (y - 4)^2 = 64$.","points":0.25},{"type":"mcq","level":"TH","q":"Tâm và bán kính của đường tròn $(C)$: $x^2 + y^2 + 2x + 4y - 11 = 0$ là","options":["A. $I(-1; -2)$, $R = 4$","B. $I(-2; -4)$, $R = 4$","C. $I(1; 2)$, $R = 4$","D. $I(-1; -2)$, $R = 16$"],"answer":"A","explain":"$-2a_1 = 2 \\Rightarrow a_1 = -1$; $-2b_1 = 4 \\Rightarrow b_1 = -2$; $R = \\sqrt{1 + 4 - (-11)} = 4$.","points":0.25},{"type":"mcq","level":"VD","q":"Phương trình đường tròn đường kính $AB$ với $A(0; -3)$, $B(10; 21)$ là","options":["A. $(x - 5)^2 + (y - 9)^2 = 169$","B. $(x - 5)^2 + (y - 9)^2 = 676$","C. $(x - 6)^2 + (y - 9)^2 = 169$","D. $(x - 0)^2 + (y + 3)^2 = 169$"],"answer":"A","explain":"Tâm là trung điểm $AB$: $I(5; 9)$. Bán kính $R = \\frac{AB}{2} = \\frac{\\sqrt{10^2 + 24^2}}{2} = 13$. Vậy $(x - 5)^2 + (y - 9)^2 = 169$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho đường tròn $(C)$: $(x + 2)^2 + (y - 3)^2 = 25$. Phương trình tiếp tuyến của $(C)$ tại điểm $M_0(2; 6)$ là","options":["A. $3(x + 2) + 4(y - 3) = 25$","B. $4(x + 2) + 3(y - 3) = 26$","C. $4(x + 2) + 3(y - 3) = 25$","D. $4(x + 2) - -3(y - 3) = 25$"],"answer":"C","explain":"Quy tắc \"tách đôi\": $(x_0 - a)(x - a) + (y_0 - b)(y - b) = R^2$ với $x_0 - a = 4$, $y_0 - b = 3$, $R^2 = 25$: $4(x + 2) + 3(y - 3) = 25$.","points":0.25},{"type":"truefalse","level":"NB","q":"Cho đường tròn $(C)$: $(x + 2)^2 + (y - 1)^2 = 9$. Mỗi nhận định sau là đúng hay sai?","statements":["Tâm của $(C)$: $(x + 2)^2 + (y - 1)^2 = 9$ là $I(-2; 1)$.","Bán kính của $(C)$ bằng $3$.","Điểm $I(-2; 1)$ thuộc đường tròn $(C)$.","Đường tròn $(C)$ đi qua gốc tọa độ $O$."],"answer":["T","T","F","F"],"explain":"a) Đúng. b) Đúng: $R^2 = 9$. c) Sai: $I$ là tâm, $II = 0 \\ne R$. d) Sai: $OI^2 = -2^2 + 1^2 = 5$ \\ne $R^2 = 9$.","points":1},{"type":"truefalse","level":"TH","q":"Cho $(C)$: $x^2 + y^2 + 6x + 4y - 12 = 0$. Mỗi nhận định sau là đúng hay sai?","statements":["Tâm của $(C)$: $x^2 + y^2 + 6x + 4y - 12 = 0$ là $I(-3; -2)$.","Bán kính của $(C)$ bằng $\\sqrt{25}$.","Điều kiện để $x^2 + y^2 + 6x + 4y - 12 = 0$ là phương trình đường tròn là $a^2 + b^2 - c \\gt 0$.","Tiếp tuyến của $(C)$ tại $M_0(x_0; y_0) \\in (C)$ là $(x_0 + 3)(x + 3) - (y_0 + 2)(y + 2) = 25$."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: $R = \\sqrt{a^2 + b^2 - c} = \\sqrt{25}$. c) Đúng theo lý thuyết. d) Sai: dấu giữa hai nhóm phải là dấu $+$.","points":1},{"type":"short","level":"VD","q":"Cho đường tròn $(C)$: $x^2 + y^2 - 8x - 6y - 11 = 0$. Tìm bán kính $R$ của $(C)$.","answer":"$6$","explain":"$R = \\sqrt{a^2 + b^2 - c} = \\sqrt{16 + 9 - (-11)} = \\sqrt{36} = 6$.","points":0.5},{"type":"short","level":"VDC","q":"Viết phương trình đường tròn đi qua ba điểm $O(0; 0)$, $A(56; 0)$, $B(0; 90)$. i: dấu giữa hai nhóm phải là dấu $+$.","points":1},{"type":"short","level":"VD","q":"Cho đường tròn $(C)$: $x^2 + y^2 - 8x + 2y - 32 = 0$. Tìm bán kính $R$ của $(C)$.","answer":"$7$","explain":"$R = \\sqrt{a^2 + b^2 - c} = \\sqrt{16 + 1 - (-32)} = \\sqrt{49} = 7$.","points":0.5},{"type":"short","level":"VDC","q":"Viết phương trình đường tròn đi qua ba điểm $O(0; 0)$, $A(40; 0)$, $B(0; 42)$. Tìm bán kính $R$ của đường tròn đó.","answer":"$29$","explain":"Tam giác $OAB$ vuông tại $O$ nên $AB$ là đường kính. $AB = \\sqrt{40^2 + 42^2} = 58$, suy ra $R = \\frac{AB}{2} = 29$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Cho đường tròn $(C)$: $(x - 4)^2 + (y + 5)^2 = 16$. Tâm và bán kính của $(C)$ là","options":["A. $I(4; -5)$, $R = 5$","B. $I(4; -5)$, $R = 4$","C. $I(-4; 5)$, $R = 4$","D. $I(4; -5)$, $R = 16$"],"answer":"B","explain":"Dạng $(x - a)^2 + (y - b)^2 = R^2$ cho tâm $I(a; b) = I(4; -5)$ và $R^2 = 16 \\Rightarrow R = 4$.","points":0.25},{"type":"mcq","level":"NB","q":"Phương trình nào sau đây là phương trình của một đường tròn?","options":["A. $x^2 + y^2 + 2x - 6y + 11 = 0$","B. $x^2 + y^2 + 6x - 4y + 9 = 0$","C. $x^2 - y^2 + 6x - 4y + 9 = 0$","D. $x^2 + y^2 + 6x - 4y + 18 = 0$"],"answer":"B","explain":"Kiểm tra điều kiện $a^2 + b^2 - c \\gt 0$: chỉ có $x^2 + y^2 + 6x - 4y + 9 = 0$ thỏa mãn ($9 + 4 - (9) = 4 \\gt 0$).","points":0.25},{"type":"mcq","level":"TH","q":"Phương trình đường tròn tâm $I(-3; 2)$ bán kính $R = 2$ là","options":["A. $(x + 3)^2 + (y - 2)^2 = 4$","B. $(x + 3)^2 + (y - 2)^2 = 2$","C. $(x + 3)^2 + (y - 2)^2 = 9$","D. $(x - 3)^2 + (y + 2)^2 = 4$"],"answer":"A","explain":"Áp dụng $(x - a)^2 + (y - b)^2 = R^2$ với $a = -3, b = 2, R = 2$: $(x + 3)^2 + (y - 2)^2 = 4$.","points":0.25},{"type":"mcq","level":"TH","q":"Tâm và bán kính của đường tròn $(C)$: $x^2 + y^2 + 6x + 6y - 18 = 0$ là","options":["A. $I(3; 3)$, $R = 6$","B. $I(-3; -3)$, $R = 36$","C. $I(-6; -6)$, $R = 6$","D. $I(-3; -3)$, $R = 6$"],"answer":"D","exp  36$."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: $R = \\sqrt{a^2 + b^2 - c} = \\sqrt{36}$. c) Đúng theo lý thuyết. d) Sai: dấu giữa hai nhóm phải là dấu $+$.","points":1},{"type":"short","level":"VD","q":"Cho đường tròn $(C)$: $x^2 + y^2 + 2x - 8y - 64 = 0$. Tìm bán kính $R$ của $(C)$.","answer":"$9$","explain":"$R = \\sqrt{a^2 + b^2 - c} = \\sqrt{1 + 16 - (-64)} = \\sqrt{81} = 9$.","points":0.5},{"type":"short","level":"VDC","q":"Viết phương trình đường tròn đi qua ba điểm $O(0; 0)$, $A(24; 0)$, $B(0; 18)$. Tìm bán kính $R$ của đường tròn đó.","answer":"$15$","explain":"Tam giác $OAB$ vuông tại $O$ nên $AB$ là đường kính. $AB = \\sqrt{24^2 + 18^2} = 30$, suy ra $R = \\frac{AB}{2} = 15$.","points":0.5}]}]}</script>
