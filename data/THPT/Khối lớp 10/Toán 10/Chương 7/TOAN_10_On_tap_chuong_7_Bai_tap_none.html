c{p}{2} = -1$ (dấu trừ!).","points":1},{"type":"short","level":"VD","q":"Cho đường thẳng $\\Delta: \\begin{cases} x = -4 - t \\\\ y = -12 - 4t \\end{cases} \\; (t \\in \\mathbb{R})$. Tìm hoành độ giao điểm của $\\Delta$ với trục $Ox$.","answer":"$-1$","explain":"Giao điểm với $Ox$ có $y = 0$ nên $-12 - 4t = 0$, suy ra $t = -3$. Thay vào phương trình của $x$: $x = -4 + 3 = -1$.","points":0.5},{"type":"short","level":"VDC","q":"Viết phương trình đường tròn đi qua ba điểm $O(0; 0)$, $A(32; 0)$, $B(0; 60)$. Tìm bán kính $R$ của đường tròn đó.","answer":"$34$","explain":"Tam giác $OAB$ vuông tại $O$ nên $AB$ là đường kính. $AB = \\sqrt{32^2 + 60^2} = 68$, suy ra $R = \\frac{AB}{2} = 34$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Cho đường thẳng $d: -3x - 4y - 2 = 0$. Vectơ nào sau đây là một vectơ pháp tuyến của $d$?","options":["A. $\\vec{n} = (-4; -3)$","B. $\\vec{n} = (-3; -4)$","C. $\\vec{n} = (4; -3)$","D. $\\vec{n} = (-4; 3)$"],"answer":"B","explain":"Đường thẳng $d: ax + by + c = 0$ có một VTPT là $\\vec{n} = (a; b) = (-3; -4)$. (Vectơ $(b; -a)$ là VTCP, không phải VTPT.)","points":0.25},{"type":"mcq","level":"NB","q":"Cho đường tròn $(C)$: $(x + 5)^2 + (y + 3)^2 = 64$. Tâm và bán kính của $(C)$ là","options":["A. $I(-5; -3)$, $R = 9$","B. $I(-5; -3)$, $R = 8$","C. $I(5; 3)$, $R = 8$","D. $I(-5; -3)$, $R = 64$"],"answer":"B","explain":"Dạng $(x - a)^2 + (y - b)^2 = R^2$ cho tâm $I(a; b) = I(-5; -3)$ và $R^2 = 64 \\Rightarrow R = 8$.","points":0.25},{"type":"mcq","level":"TH","q":"Phương trình tham số của đường thẳng đi qua $M_0(-2; -2)$ và có vectơ chỉ phương $\\vec{u} = (2; 3)$ là","options":["A. $\\begin{cases} x = -1 + 2t \\\\ y = -2 + 3t \\end{cases}$","B. $\\begin{cases} x = -2 + 3t \\\\ y = -2 + 2t \\end{cases}$","C. $\\begin{cases} x = -2 + 2t \\\\ y = -2 + 3t \\end{cases}$","D. $\\begin{cases} x = -2 + 2t \\\\ y = -2 - 3t \\end{cases}$"],"answer":"C","explain":"Áp dụng công thức $\\begin{cases} x = x_0 + tu_1 \\\\ y = y_0 + tu_2 \\end{cases}$ với $x_0 = -2, y_0 = -2, u_1 = 2, u_2 = 3$.","points":0.25},{"type":"mcq","level":"TH","q":"Khoảng cách từ điểm $M(0; -1)$ đến đường thẳng $\\Delta$: 3x - 4y + 6 = 0 bằng","options":["A. $2$","B. $\\frac{2}{5}$","C. $4$","D. $3$"],"answer":"A","explain":"$d(M, \\Delta) = \\frac{|3 \\cdot 0 + 4 \\cdot -1 + 6|}{\\sqrt{3^2 + -4^2}} = \\frac{10}{5} = 2$.","points":0.25},{"type":"mcq","level":"VD","q":"Phương trình đường tròn đường kính $AB$ với $A(3; 3)$, $B(13; 27)$ là","options":["A. $(x - 9)^2 + (y - 15)^2 = 169$","B. $(x - 8)^2 + (y - 15)^2 = 676$","C. $(x - 8)^2 + (y - 15)^2 = 169$","D. $(x - 3)^2 + (y - 3)^2 = 169$"],"answer":"C","explain":"Tâm là trung điểm $AB$: $I(8; 15)$. Bán kính $R = \\frac{AB}{2} = \\frac{\\sqrt{10^2 + 24^2}}{2} = 13$. Vậy $(x - 8)^2 + (y - 15)^2 = 169$.","points":0.25},{"type":"mcq","level":"VDC","q":"Viết phương trình chính tắc của elip $(E)$ có độ dài trục lớn bằng $20$ và tiêu cự bằng $12$.","options":["A. $\\frac{x^2}{100} - \\frac{y^2}{64} = 1$","B. $\\frac{x^2}{100} + \\frac{y^2}{36} = 1$","C. $\\frac{x^2}{100} + \\frac{y^2}{64} = 1$","D. $\\frac{x^2}{64} + \\frac{y^2}{100} = 1$"],"answer":"C","explain":"Trục lớn $2a = 20 \\Rightarrow a = 10$; tiêu cự $2c = 12 \\Rightarrow c = 6$; $b = \\sqrt{a^2 - c^2} = \\sqrt{100 - 36} = 8$. Vậy $(E)$: $\\frac{x^2}{100} + \\frac{y^2}{64} = 1$.","points":0.25},{"type":"truefalse","level":"NB","q":"Cho $d_1$: -2x - 4y + 7 = 0 và $d_2$: -x - 2y + 3 = 0. Mỗi nhận định sau là đúng hay sai?","statements":["$d_1$ cắt $d_2$.","$d_1$ song song $d_2$.","$d_1$ trùng $d_2$.","$d_1$ và $d_2$ có điểm chung."],"answer":["F","T","F","F"],"explain":"Vì $\\frac{a_1}{a_2} = \\frac{b_1}{b_2} \\ne \\frac{c_1}{c_2}$ nên $d_1 \\parallel d_2$ (không có điểm chung).","points":1},{"type":"truefalse","level":"TH","q":"Mỗi nhận định sau là đúng hay sai?","statements":["Elip $(E)$: $\\frac{x^2}{25} + \\frac{y^2}{16} = 1$ có tiêu điểm $F_1(-3; 0)$, $F_2(3; 0)$.","Hypebol $(H)$: $\\frac{x^2}{25} - \\frac{y^2}{16} = 1$ có hai đường tiệm cận $y = \\pm\\frac{4}{5}x$.","Parabol $(P)$: $y^2 = 4x$ có tiêu điểm $F(1; 0)$.","Parabol $(P)$ trên có đường chuẩn $\\Delta: x = 1$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $c = \\sqrt{25 - 16} = 3$. b) Đúng: tiệm cận $y = \\pm\\frac{b}{a}x$. c) Đúng: $p = 2$, $F(p/2; 0)$. d) Sai: đường chuẩn là $x = -\\frac{p}{2} = -1$ (dấu trừ!).","points":1},{"type":"short","level":"VD","q":"Cho đường thẳng $\\Delta: \\begin{cases} x = -2 + 4t \\\\ y = 12 + 3t \\end{cases} \\; (t \\in \\mathbb{R})$. Tìm hoành độ giao điểm của $\\Delta$ với trục $Ox$.","answer":"$-18$","explain":"Giao điểm với $Ox$ có $y = 0$ nên $12 + 3t = 0$, suy ra $t = -4$. Thay vào phương trình của $x$: $x = -2 - 16 = -18$.","points":0.5},{"type":"short","level":"VDC","q":"Viết phương trình đường tròn đi qua ba điểm $O(0; 0)$, $A(18; 0)$, $B(0; 80)$. Tìm bán kính $R$ của đường tròn đó.","answer":"$41$","explain":"Tam giác $OAB$ vuông tại $O$ nên $AB$ là đường kính. $AB = \\sqrt{18^2 + 80^2} = 82$, suy ra $R = \\frac{AB}{2} = 41$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Cho đường thẳng $d: 2x + 1y - 1 = 0$. Vectơ nào sau đây là một vectơ pháp tuyến của $d$?","options":["A. $\\vec{n} = (1; -2)$","B. $\\vec{n} = (2; 1)$","C. $\\vec{n} = (1; 2)$","D. $\\vec{n} = (-1; 2)$"],"answer":"B","explain":"Đường thẳng $d: ax + by + c = 0$ có một VTPT là $\\vec{n} = (a; b) = (2; 1)$. (Vectơ $(b; -a)$ là VTCP, không phải VTPT.)","points":0.25},{"type":"mcq","level":"NB","q":"Cho đường tròn $(C)$: $(x - 0)^2 + (y + 4)^2 = 16$. Tâm và bán kính của $(C)$ là","options":["A. $I(0; 4)$, $R = 4$","B. $I(0; -4)$, $R = 16$","C. $I(0; -4)$, $R = 4$","D. $I(0; -4)$, $R = 5$"],"answer":"C","explain":"Dạng $(x - a)^2 + (y - b)^2 = R^2$ cho tâm $I(a; b) = I(0; -4)$ và $R^2 = 16 \\Rightarrow R = 4$.","points":0.25},{"type":"mcq","level":"TH","q":"Phương trình tham số của đường thẳng đi qua $M_0(4; -1)$ và có vectơ chỉ phương $\\vec{u} = (2; -4)$ là","options":[ a_2} = \\frac{b_1}{b_2} = \\frac{c_1}{c_2}$ nên $d_1 \\equiv d_2$ (mọi điểm đều chung).","points":1},{"type":"truefalse","level":"TH","q":"Mỗi nhận định sau là đúng hay sai?","statements":["Elip $(E)$: $\\frac{x^2}{25} + \\frac{y^2}{9} = 1$ có tiêu điểm $F_1(-4; 0)$, $F_2(4; 0)$.","Hypebol $(H)$: $\\frac{x^2}{25} - \\frac{y^2}{9} = 1$ có hai đường tiệm cận $y = \\pm\\frac{3}{5}x$.","Parabol $(P)$: $y^2 = 8x$ có tiêu điểm $F(2; 0)$.","Parabol $(P)$ trên có đường chuẩn $\\Delta: x = 2$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $c = \\sqrt{25 - 9} = 4$. b) Đúng: tiệm cận $y = \\pm\\frac{b}{a}x$. c) Đúng: $p = 4$, $F(p/2; 0)$. d) Sai: đường chuẩn là $x = -\\frac{p}{2} = -2$ (dấu trừ!).","points":1},{"type":"short","level":"VD","q":"Cho đường thẳng $\\Delta: \\begin{cases} x = -4 - 3t \\\\ y = -1 - t \\end{cases} \\; (t \\in \\mathbb{R})$. Tìm hoành độ giao điểm của $\\Delta$ với trục $Ox$.","answer":"$-1$","explain":"Giao điểm với $Ox$ có $y = 0$ nên $-1 - t = 0$, suy ra $t = -1$. Thay vào phương trình của $x$: $x = -4 + 3 = -1$.","points":0.5},{"type":"short","level":"VDC","q":"Viết phương trình đường tròn đi qua ba điểm $O(0; 0)$, $A(48; 0)$, $B(0; 140)$. Tìm bán kính $R$ của đường tròn đó.","answer":"$74$","explain":"Tam giác $OAB$ vuông tại $O$ nên $AB$ là đường kính. $AB = \\sqrt{48^2 + 140^2} = 148$, suy ra $R = \\frac{AB}{2} = 74$.","points":0.5}]}]}</script>
