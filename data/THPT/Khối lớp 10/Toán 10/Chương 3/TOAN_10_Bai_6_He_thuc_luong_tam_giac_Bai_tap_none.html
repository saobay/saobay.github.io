<script type="application/json" class="saobay-exam10-data">{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Theo định lí côsin, trong tam giác $ABC$ ta có","options":["A. $a^2 = b^2 + c^2 - 2bc\\cos A$","B. $a^2 = b^2 + c^2 + 2bc\\cos A$","C. $a^2 = b^2 - c^2 + 2bc\\cos A$","D. $a = b^2 + c^2 - 2bc\\cos A$"],"answer":"A","explain":"Định lí côsin: $a^2 = b^2 + c^2 - 2bc\\cos A$ (tương tự cho $b^2, c^2$).","points":0.25},{"type":"mcq","level":"NB","q":"Theo định lí sin, trong tam giác $ABC$ với bán kính đường tròn ngoại tiếp $R$ ta có","options":["A. $\\frac{a}{\\sin A} = 2R$","B. $\\frac{a}{\\sin A} = R$","C. $\\frac{a}{\\cos A} = 2R$","D. $a \\cdot \\sin A = 2R$"],"answer":"A","explain":"Định lí sin: $\\frac{a}{\\sin A} = \\frac{b}{\\sin B} = \\frac{c}{\\sin C} = 2R$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho tam giác $ABC$ có $AB = 5$, $AC = 8$, $\\widehat{A} = 60^\\circ$. Độ dài cạnh $BC$ bằng","options":["A. $7$","B. $9$","C. $13$","D. $\\sqrt{89}$"],"answer":"A","explain":"$BC^2 = 5^2 + 8^2 - 2 \\cdot 5 \\cdot 8 \\cdot \\cos 60^\\circ = 25 + 64 - 40 = 49$, suy ra $BC = 7$.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác có hai cạnh bằng $6$ và $8$, góc xen giữa bằng $90^\\circ$. Diện tích tam giác bằng","options":["A. $12$","B. $24$","C. $48$","D. $20$"],"answer":"B","explain":"$S = \\frac{1}{2} \\cdot 6 \\cdot 8 \\cdot \\sin 90^\\circ = 24$.","points":0.25},{"type":"mcq","level":"VD","q":"Tam giác có ba cạnh $3, 4, 5$. Côsin của góc lớn nhất bằng","options":["A. $0$","B. $\\frac{1}{2}$","C. $-\\frac{1}{2}$","D. $1$"],"answer":"A","explain":"Góc lớn nhất đối diện cạnh $5$: $\\cos = \\frac{3^2 + 4^2 - 5^2}{2 \\cdot 3 \\cdot 4} = 0$ (tam giác vuông).","points":0.25},{"type":"mcq","level":"VDC","q":"Tam giác $ABC$ có $BC = 7$, $CA = 8$, $AB = 9$. Giá trị của $\\cos A$ bằng","options":["A. $\\frac{1}{2}$","B. $\\frac{2}{3}$","C. $\\frac{3}{4}$","D. $\\frac{1}{3}$"],"answer":"B","explain":"$\\cos A = \\frac{8^2 + 9^2 - 7^2}{2 \\cdot 8 \\cdot 9} = \\frac{64 + 81 - 49}{144} = \\frac{96}{144} = \\frac{2}{3}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $a^2 = b^2 + c^2 - 2bc\\cos A$.","b) $\\frac{a}{\\sin A} = \\frac{b}{\\sin B}$.","c) $S = \\frac{1}{2}ab\\sin C$.","d) $2R = a \\cdot \\sin A$."],"answer":["T","T","T","F"],"explain":"a) Đúng: định lí côsin. b) Đúng: định lí sin. c) Đúng: công thức diện tích. d) Sai: $\\frac{a}{\\sin A} = 2R$ nên $a = 2R\\sin A$.","points":1},{"type":"truefalse","level":"TH","q":"Cho tam giác $ABC$ có $AB = 4$, $AC = 5$, $\\widehat{A} = 60^\\circ$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $BC = \\sqrt{21}$.","b) Diện tích tam giác bằng $5\\sqrt{3}$.","c) Chu vi tam giác bằng $9 + \\sqrt{21}$.","d) $BC = 21$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $BC^2 = 16 + 25 - 2 \\cdot 4 \\cdot 5 \\cdot \\frac{1}{2} = 21$. b) Đúng: $S = \\frac{1}{2} \\cdot 4 \\cdot 5 \\cdot \\frac{\\sqrt{3}}{2} = 5\\sqrt{3}$. c) Đúng: $4 + 5 + \\sqrt{21}$. d) Sai: $BC = \\sqrt{21}$.","points":1},{"type":"short","level":"VD","q":"Tam giác vuông cân có cạnh góc vuông bằng $4$. Tính diện tích tam giác.","answer":"8","explain":"$S = \\frac{1}{2} \\cdot 4 \\cdot 4 = 8$.","points":0.5},{"type":"short","level":"VDC","q":"Tam giác $ABC$ có $AB = 3$, $AC = 4$, $BC = 5$. Tính bán kính $R$ của đường tròn ngoại tiếp tam giác.","answer":"2.5","explain":"Tam giác vuông tại $A$ (vì $3^2 + 4^2 = 5^2$) nên cạnh huyền $BC$ là đường kính đường tròn ngoại tiếp, $R = \\frac{5}{2} = 2{,}5$.","points":0.5}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Công thức Hê-rông tính diện tích tam giác là","options":["A. $S = \\sqrt{p(p-a)(p-b)(p-c)}$","B. $S = p(p-a)(p-b)(p-c)$","C. $S = \\sqrt{p + (p-a) + (p-b) + (p-c)}$","D. $S = \\frac{p(p-a)(p-b)(p-c)}{2}$"],"answer":"A","explain":"Công thức Hê-rông: $S = \\sqrt{p(p-a)(p-b)(p-c)}$ với $p$ là nửa chu vi.","points":0.25},{"type":"mcq","level":"NB","q":"Từ công thức $S = \\frac{abc}{4R}$, bán kính đường tròn ngoại tiếp $R$ bằng","options":["A. $\\frac{abc}{4S}$","B. $\\frac{4S}{abc}$","C. $\\frac{abc}{S}$","D. $4abcS$"],"answer":"A","explain":"$S = \\frac{abc}{4R} \\Rightarrow R = \\frac{abc}{4S}$.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác $ABC$ có $\\widehat{A} = 45^\\circ$, $\\widehat{B} = 60^\\circ$, $BC = 10$. Độ dài cạnh $AC$ bằng","options":["A. $5\\sqrt{6}$","B. $5\\sqrt{3}$","C. $10\\sqrt{2}$","D. $5\\sqrt{2}$"],"answer":"A","explain":"Theo định lí sin: $\\frac{AC}{\\sin 60^\\circ} = \\frac{10}{\\sin 45^\\circ} \\Rightarrow AC = \\frac{10 \\cdot \\sqrt{3}/2}{\\sqrt{2}/2} = 5\\sqrt{6}$.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác có $a = 5$, $b = 6$, góc $C = 60^\\circ$. Diện tích tam giác bằng","options":["A. $15$","B. $\\frac{15\\sqrt{3}}{2}$","C. $15\\sqrt{3}$","D. $30$"],"answer":"B","explain":"$S = \\frac{1}{2} \\cdot 5 \\cdot 6 \\cdot \\sin 60^\\circ = 15 \\cdot \\frac{\\sqrt{3}}{2} = \\frac{15\\sqrt{3}}{2}$.","points":0.25},{"type":"mcq","level":"VD","q":"Cho tam giác có $b = 7$, $c = 5$, $\\widehat{A} = 120^\\circ$. Độ dài cạnh $a$ bằng","options":["A. $\\sqrt{109}$","B. $\\sqrt{39}$","C. $12$","D. $\\sqrt{74}$"],"answer":"A","explain":"$a^2 = 49 + 25 - 2 \\cdot 7 \\cdot 5 \\cdot \\cos 120^\\circ = 74 - 70 \\cdot \\left(-\\frac{1}{2}\\right) = 109$, suy ra $a = \\sqrt{109}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tam giác $ABC$ có $AB = 4$, $AC = 6$, $BC = 8$. Giá trị của $\\cos A$ bằng","options":["A. $\\frac{1}{4}$","B. $-\\frac{1}{4}$","C. $\\frac{1}{2}$","D. $-\\frac{1}{2}$"],"answer":"B","explain":"$\\cos A = \\frac{6^2 + 4^2 - 8^2}{2 \\cdot 6 \\cdot 4} = \\frac{36 + 16 - 64}{48} = -\\frac{1}{4}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\frac{a}{\\sin A} = 2R$.","b) $S = pr$ (với $r$ là bán kính đường tròn nội tiếp).","c) $m_a^2 = \\frac{2b^2 + 2c^2 - a^2}{4}$.","d) $a^2 = b^2 + c^2 + 2bc\\cos A$."],"answer":["T","T","T","F"],"explain":"a) Đúng: định lí sin. b) Đúng. c) Đúng: công thức đường trung tuyến. d) Sai: dấu phải là trừ.","points":1},{"type":"truefalse","level":"TH","q":"Cho tam giác $ABC$ vuông tại $A$ có $AB = 3$, $AC = 4$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $BC = 5$.","b) Diện tích tam giác bằng $6$.","c) Bán kính đường tròn ngoại tiếp $R = 2{,}5$.","d) Bán kính đường tròn nội tiếp $r = 2$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $BC = \\sqrt{9 + 16} = 5$. b) Đúng: $S = \\frac{1}{2} \\cdot 3 \\cdot 4 = 6$. c) Đúng: $R = \\frac{BC}{2} = 2{,}5$. d) Sai: $r = \\frac{S}{p} = \\frac{6}{6} = 1$.","points":1},{"type":"short","level":"VD","q":"Tam giác $ABC$ có $AB = 8$, $AC = 6$, $\\widehat{A} = 30^\\circ$. Tính diện tích tam giác.","answer":"12","explain":"$S = \\frac{1}{2} \\cdot 8 \\cdot 6 \\cdot \\sin 30^\\circ = 24 \\cdot \\frac{1}{2} = 12$.","points":0.5},{"type":"short","level":"VDC","q":"Tam giác có chu vi bằng $24$ và diện tích bằng $24$. Tính bán kính $r$ của đường tròn nội tiếp tam giác.","answer":"2","explain":"$r = \\frac{S}{p} = \\frac{24}{12} = 2$.","points":0.5}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Công thức tính bình phương độ dài đường trung tuyến $m_a$ là","options":["A. $m_a^2 = \\frac{2b^2 + 2c^2 - a^2}{4}$","B. $m_a^2 = \\frac{2b^2 + 2c^2 + a^2}{4}$","C. $m_a^2 = \\frac{b^2 + c^2 - a^2}{2}$","D. $m_a^2 = 2b^2 + 2c^2 - a^2$"],"answer":"A","explain":"Công thức đường trung tuyến: $m_a^2 = \\frac{2b^2 + 2c^2 - a^2}{4}$.","points":0.25},{"type":"mcq","level":"NB","q":"Công thức $S = \\frac{1}{2}bc\\sin A$ được dùng khi biết","options":["A. hai cạnh và góc xen giữa","B. ba cạnh","C. ba góc","D. một cạnh và hai góc"],"answer":"A","explain":"Công thức $S = \\frac{1}{2}bc\\sin A$ dùng khi biết hai cạnh $b, c$ và góc xen giữa $A$.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác có $a = 8$, $\\widehat{A} = 60^\\circ$. Bán kính đường tròn ngoại tiếp $R$ bằng","options":["A. $\\frac{8\\sqrt{3}}{3}$","B. $8\\sqrt{3}$","C. $4\\sqrt{3}$","D. $\\frac{16}{3}$"],"answer":"A","explain":"$2R = \\frac{8}{\\sin 60^\\circ} = \\frac{16}{\\sqrt{3}} \\Rightarrow R = \\frac{8}{\\sqrt{3}} = \\frac{8\\sqrt{3}}{3}$.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác đều cạnh $a$ có diện tích bằng","options":["A. $\\frac{a^2\\sqrt{3}}{4}$","B. $\\frac{a^2\\sqrt{3}}{2}$","C. $a^2\\sqrt{3}$","D. $\\frac{a^2}{2}$"],"answer":"A","explain":"$S = \\frac{1}{2} \\cdot a \\cdot a \\cdot \\sin 60^\\circ = \\frac{a^2\\sqrt{3}}{4}$.","points":0.25},{"type":"mcq","level":"VD","q":"Tam giác $ABC$ có $AB = 5$, $BC = 7$, $CA = 8$. Giá trị của $\\cos B$ bằng","options":["A. $\\frac{1}{7}$","B. $\\frac{1}{2}$","C. $-\\frac{1}{7}$","D. $\\frac{5}{7}$"],"answer":"A","explain":"$\\cos B = \\frac{5^2 + 7^2 - 8^2}{2 \\cdot 5 \\cdot 7} = \\frac{25 + 49 - 64}{70} = \\frac{1}{7}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tam giác $ABC$ có $AB = 6$, $AC = 8$ và đường trung tuyến $AM = 5$ ($M$ là trung điểm $BC$). Độ dài cạnh $BC$ bằng","options":["A. $8$","B. $10$","C. $12$","D. $2\\sqrt{21}$"],"answer":"B","explain":"$m_a^2 = 25 = \\frac{2 \\cdot 64 + 2 \\cdot 36 - BC^2}{4} \\Rightarrow 100 = 200 - BC^2 \\Rightarrow BC^2 = 100$, suy ra $BC = 10$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Biết hai cạnh và góc xen giữa thì dùng định lí côsin để tính cạnh thứ ba.","b) Biết một cạnh và hai góc thì dùng định lí sin để tính các cạnh còn lại.","c) Biết ba cạnh thì dùng hệ quả của định lí côsin để tính các góc.","d) Định lí sin phát biểu: $\\frac{a}{\\sin A} = R$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo hướng dẫn giải tam giác. d) Sai: $\\frac{a}{\\sin A} = 2R$.","points":1},{"type":"truefalse","level":"TH","q":"Tam giác có ba cạnh $6, 8, 10$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tam giác đã cho là tam giác vuông.","b) Góc lớn nhất bằng $90^\\circ$.","c) Diện tích tam giác bằng $24$.","d) Bán kính đường tròn ngoại tiếp $R = 6$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $36 + 64 = 100$. b) Đúng: góc đối diện cạnh $10$. c) Đúng: $S = \\frac{1}{2} \\cdot 6 \\cdot 8 = 24$. d) Sai: $R = \\frac{10}{2} = 5$.","points":1},{"type":"short","level":"VD","q":"Tam giác $ABC$ có $\\widehat{B} = 30^\\circ$, $\\widehat{C} = 90^\\circ$, $AB = 6$. Tính độ dài cạnh $AC$.","answer":"3","explain":"$AC = AB \\cdot \\sin 30^\\circ = 6 \\cdot \\frac{1}{2} = 3$.","points":0.5},{"type":"short","level":"VDC","q":"Tam giác $ABC$ có $AB = 13$, $AC = 14$, $BC = 15$. Tính diện tích tam giác.","answer":"84","explain":"Nửa chu vi $p = 21$. $S = \\sqrt{21 \\cdot 8 \\cdot 7 \\cdot 6} = \\sqrt{7056} = 84$.","points":0.5}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Định lí sin được phát biểu là","options":["A. $\\frac{a}{\\sin A} = \\frac{b}{\\sin B} = \\frac{c}{\\sin C} = 2R$","B. $\\frac{a}{\\cos A} = \\frac{b}{\\cos B} = \\frac{c}{\\cos C} = 2R$","C. $a\\sin A = b\\sin B = c\\sin C = 2R$","D. $\\frac{\\sin A}{a} = \\frac{\\sin B}{b} = \\frac{\\sin C}{c} = R$"],"answer":"A","explain":"Định lí sin: $\\frac{a}{\\sin A} = \\frac{b}{\\sin B} = \\frac{c}{\\sin C} = 2R$.","points":0.25},{"type":"mcq","level":"NB","q":"Trong công thức Hê-rông, $p$ là","options":["A. nửa chu vi tam giác","B. chu vi tam giác","C. diện tích tam giác","D. bán kính đường tròn ngoại tiếp"],"answer":"A","explain":"$p = \\frac{a+b+c}{2}$ là nửa chu vi của tam giác.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác $ABC$ có $\\widehat{A} = 30^\\circ$, $BC = 8$. Bán kính đường tròn ngoại tiếp $R$ bằng","options":["A. $4$","B. $8$","C. $16$","D. $8\\sqrt{3}$"],"answer":"B","explain":"$2R = \\frac{8}{\\sin 30^\\circ} = 16 \\Rightarrow R = 8$.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác có $b = 5$, $c = 7$, $\\widehat{A} = 90^\\circ$. Độ dài cạnh $a$ bằng","options":["A. $\\sqrt{74}$","B. $12$","C. $\\sqrt{24}$","D. $2\\sqrt{3}$"],"answer":"A","explain":"$a^2 = 25 + 49 - 2 \\cdot 5 \\cdot 7 \\cdot \\cos 90^\\circ = 74$, suy ra $a = \\sqrt{74}$.","points":0.25},{"type":"mcq","level":"VD","q":"Tam giác $ABC$ có $AB = 7$, $AC = 9$, $\\widehat{A} = 60^\\circ$. Độ dài cạnh $BC$ bằng","options":["A. $\\sqrt{67}$","B. $\\sqrt{193}$","C. $4$","D. $8$"],"answer":"A","explain":"$BC^2 = 49 + 81 - 2 \\cdot 7 \\cdot 9 \\cdot \\frac{1}{2} = 130 - 63 = 67$, suy ra $BC = \\sqrt{67}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tam giác có ba cạnh $7, 8, 9$. Diện tích tam giác bằng","options":["A. $12\\sqrt{5}$","B. $24$","C. $36$","D. $6\\sqrt{5}$"],"answer":"A","explain":"$p = 12$. $S = \\sqrt{12 \\cdot 5 \\cdot 4 \\cdot 3} = \\sqrt{720} = 12\\sqrt{5}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\cos A = \\frac{b^2 + c^2 - a^2}{2bc}$.","b) $S = \\frac{1}{2}ab\\sin C$.","c) $R = \\frac{abc}{4S}$.","d) $r = S \\cdot p$."],"answer":["T","T","T","F"],"explain":"a) Đúng: hệ quả định lí côsin. b) Đúng. c) Đúng: từ $S = \\frac{abc}{4R}$. d) Sai: $r = \\frac{S}{p}$.","points":1},{"type":"truefalse","level":"TH","q":"Cho tam giác đều cạnh $4$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Diện tích tam giác bằng $4\\sqrt{3}$.","b) Bán kính đường tròn ngoại tiếp $R = \\frac{4\\sqrt{3}}{3}$.","c) Bán kính đường tròn nội tiếp $r = \\frac{2\\sqrt{3}}{3}$.","d) Nửa chu vi $p = 12$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $S = \\frac{16\\sqrt{3}}{4} = 4\\sqrt{3}$. b) Đúng: $R = \\frac{a}{\\sqrt{3}} = \\frac{4\\sqrt{3}}{3}$. c) Đúng: $r = \\frac{R}{2}$. d) Sai: $p = 6$.","points":1},{"type":"short","level":"VD","q":"Tam giác $ABC$ vuông tại $B$ có $AB = 5$, $BC = 12$. Tính độ dài cạnh $AC$.","answer":"13","explain":"$AC = \\sqrt{25 + 144} = 13$.","points":0.5},{"type":"short","level":"VDC","q":"Tam giác $ABC$ có $AB = 6$, $AC = 10$, $BC = 14$. Tính côsin của góc lớn nhất trong tam giác.","answer":"-1/2","explain":"Góc lớn nhất đối diện cạnh $BC = 14$: $\\cos = \\frac{36 + 100 - 196}{2 \\cdot 6 \\cdot 10} = -\\frac{1}{2}$.","points":0.5}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Công thức tính bán kính đường tròn ngoại tiếp qua ba cạnh và diện tích là","options":["A. $R = \\frac{abc}{4S}$","B. $R = \\frac{4S}{abc}$","C. $R = \\frac{abc}{S}$","D. $R = 4abcS$"],"answer":"A","explain":"Từ $S = \\frac{abc}{4R}$ suy ra $R = \\frac{abc}{4S}$.","points":0.25},{"type":"mcq","level":"NB","q":"Giải tam giác là","options":["A. tìm các cạnh và các góc còn lại khi biết một số yếu tố cho trước","B. vẽ hình tam giác","C. tính chu vi tam giác","D. chứng minh hai tam giác bằng nhau"],"answer":"A","explain":"Giải tam giác là tìm các cạnh và các góc còn lại của tam giác khi biết một số yếu tố cho trước.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác vuông tại $C$ có $\\widehat{A} = 30^\\circ$, $BC = 4$. Độ dài cạnh huyền $AB$ bằng","options":["A. $8$","B. $4\\sqrt{3}$","C. $4$","D. $2$"],"answer":"A","explain":"$BC$ đối diện góc $A = 30^\\circ$ nên $AB = \\frac{BC}{\\sin 30^\\circ} = 8$.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác có $a = 10$, $b = 12$, góc $C = 30^\\circ$. Diện tích tam giác bằng","options":["A. $60$","B. $30$","C. $30\\sqrt{3}$","D. $15$"],"answer":"B","explain":"$S = \\frac{1}{2} \\cdot 10 \\cdot 12 \\cdot \\sin 30^\\circ = 30$.","points":0.25},{"type":"mcq","level":"VD","q":"Tam giác $ABC$ có $AB = 8$, $AC = 15$, $BC = 17$. Sin của góc lớn nhất bằng","options":["A. $\\frac{8}{17}$","B. $\\frac{15}{17}$","C. $1$","D. $\\frac{8}{15}$"],"answer":"C","explain":"Tam giác vuông tại $A$ (vì $64 + 225 = 289$) nên góc lớn nhất bằng $90^\\circ$, $\\sin 90^\\circ = 1$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tam giác $ABC$ có $\\widehat{A} = 120^\\circ$, $AB = 4$, $AC = 6$. Độ dài cạnh $BC$ bằng","options":["A. $2\\sqrt{19}$","B. $\\sqrt{52}$","C. $10$","D. $2\\sqrt{7}$"],"answer":"A","explain":"$BC^2 = 16 + 36 - 2 \\cdot 4 \\cdot 6 \\cdot \\cos 120^\\circ = 52 + 24 = 76$, suy ra $BC = 2\\sqrt{19}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $a = 2R\\sin A$.","b) $b = 2R\\sin B$.","c) $c = 2R\\sin C$.","d) $a + b + c = 2R$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: từ định lí sin. d) Sai.","points":1},{"type":"truefalse","level":"TH","q":"Cho tam giác $ABC$ có $AB = 6$, $AC = 8$, $BC = 10$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tam giác $ABC$ vuông tại $A$.","b) $\\sin B = \\frac{4}{5}$.","c) $\\cos C = \\frac{3}{5}$.","d) $\\tan B = \\frac{3}{4}$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $36 + 64 = 100$. b) Đúng: $\\sin B = \\frac{AC}{BC} = \\frac{4}{5}$. c) Đúng: $\\cos C = \\frac{AC}{BC} = \\frac{3}{5}$. d) Sai: $\\tan B = \\frac{AC}{AB} = \\frac{4}{3}$.","points":1},{"type":"short","level":"VD","q":"Tam giác $ABC$ vuông tại $A$ có $AB = 9$, $AC = 12$. Tính độ dài cạnh $BC$.","answer":"15","explain":"$BC = \\sqrt{81 + 144} = 15$.","points":0.5},{"type":"short","level":"VDC","q":"Tam giác có độ dài ba cạnh là $5, 5, 6$. Tính diện tích tam giác.","answer":"12","explain":"$p = 8$. $S = \\sqrt{8 \\cdot 3 \\cdot 3 \\cdot 2} = 12$.","points":0.5}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Trong công thức $S = pr$, $r$ là","options":["A. bán kính đường tròn nội tiếp tam giác","B. bán kính đường tròn ngoại tiếp tam giác","C. nửa chu vi tam giác","D. diện tích tam giác"],"answer":"A","explain":"$S = pr$ với $r$ là bán kính đường tròn nội tiếp, $p$ là nửa chu vi.","points":0.25},{"type":"mcq","level":"NB","q":"Trong tam giác $ABC$, cạnh $a = BC$ đối diện với góc nào?","options":["A. Góc $A$","B. Góc $B$","C. Góc $C$","D. Không đối diện góc nào"],"answer":"A","explain":"Quy ước: $a = BC$ đối diện góc $A$, $b = CA$ đối diện góc $B$, $c = AB$ đối diện góc $C$.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác có $\\widehat{B} = 90^\\circ$, $a = BC = 13$, $c = AB = 5$. Độ dài cạnh $b = CA$ bằng","options":["A. $12$","B. $8\\sqrt{2}$","C. $14$","D. $\\sqrt{194}$"],"answer":"A","explain":"$b^2 = a^2 - c^2 = 169 - 25 = 144$ (định lí Pytago), suy ra $b = 12$.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác có hai cạnh $9$ và $12$, góc xen giữa bằng $90^\\circ$. Độ dài cạnh huyền bằng","options":["A. $15$","B. $21$","C. $3\\sqrt{7}$","D. $9\\sqrt{3}$"],"answer":"A","explain":"Cạnh huyền $= \\sqrt{81 + 144} = 15$.","points":0.25},{"type":"mcq","level":"VD","q":"Tam giác $ABC$ có $\\widehat{A} = 60^\\circ$, $b = 6$, $c = 8$. Độ dài cạnh $a$ bằng","options":["A. $2\\sqrt{13}$","B. $10$","C. $2\\sqrt{7}$","D. $14$"],"answer":"A","explain":"$a^2 = 36 + 64 - 2 \\cdot 6 \\cdot 8 \\cdot \\frac{1}{2} = 52$, suy ra $a = 2\\sqrt{13}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tam giác vuông có hai cạnh góc vuông bằng $6$ và $8$. Độ dài đường trung tuyến ứng với cạnh huyền bằng","options":["A. $5$","B. $10$","C. $4$","D. $7$"],"answer":"A","explain":"Cạnh huyền bằng $10$; trong tam giác vuông, đường trung tuyến ứng với cạnh huyền bằng nửa cạnh huyền, tức bằng $5$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Trong tam giác vuông tại $A$, định lí côsin cho $a^2 = b^2 + c^2$.","b) Định lí sin đúng với cả tam giác vuông.","c) Tam giác đều cạnh $a$ có $R = \\frac{a}{\\sqrt{3}}$.","d) Mọi tam giác đều có $r = R$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $\\cos 90^\\circ = 0$. b) Đúng: định lí sin đúng với mọi tam giác. c) Đúng. d) Sai: $r = \\frac{R}{2}$.","points":1},{"type":"truefalse","level":"TH","q":"Cho tam giác $ABC$ có $\\widehat{A} = 60^\\circ$, $AB = 4$, $AC = 6$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $BC = 2\\sqrt{7}$.","b) Diện tích tam giác bằng $6\\sqrt{3}$.","c) Góc $B$ là góc nhọn.","d) $BC = 8$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $BC^2 = 16 + 36 - 24 = 28$. b) Đúng: $S = \\frac{1}{2} \\cdot 4 \\cdot 6 \\cdot \\frac{\\sqrt{3}}{2} = 6\\sqrt{3}$. c) Đúng: $\\cos B = \\frac{16 + 28 - 36}{2 \\cdot 4 \\cdot 2\\sqrt{7}} \\gt 0$. d) Sai.","points":1},{"type":"short","level":"VD","q":"Tam giác $ABC$ có $\\widehat{A} = 60^\\circ$, $AB = 5$, $AC = 6$. Tính $BC^2$.","answer":"31","explain":"$BC^2 = 25 + 36 - 2 \\cdot 5 \\cdot 6 \\cdot \\frac{1}{2} = 31$.","points":0.5},{"type":"short","level":"VDC","q":"Tam giác $ABC$ có $BC = 7$, $CA = 8$, $AB = 9$. Tính giá trị của biểu thức $P = b^2 + c^2 - a^2$ (với $a = BC, b = CA, c = AB$).","answer":"96","explain":"$P = 64 + 81 - 49 = 96$.","points":0.5}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Khi biết hai cạnh và góc xen giữa của tam giác, ta dùng định lí nào để tính cạnh thứ ba?","options":["A. Định lí côsin","B. Định lí sin","C. Công thức Hê-rông","D. Định lí Pytago"],"answer":"A","explain":"Định lí côsin: $a^2 = b^2 + c^2 - 2bc\\cos A$ dùng khi biết hai cạnh và góc xen giữa.","points":0.25},{"type":"mcq","level":"NB","q":"Khi biết một cạnh và hai góc của tam giác, ta dùng định lí nào để tính các cạnh còn lại?","options":["A. Định lí sin","B. Định lí côsin","C. Công thức Hê-rông","D. Định lí Pytago"],"answer":"A","explain":"Định lí sin: $\\frac{a}{\\sin A} = \\frac{b}{\\sin B} = 2R$ dùng khi biết một cạnh và hai góc.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác $ABC$ có $\\widehat{A} = 90^\\circ$, $\\widehat{B} = 60^\\circ$, $BC = 10$. Độ dài cạnh $AB$ bằng","options":["A. $5$","B. $5\\sqrt{3}$","C. $10$","D. $5\\sqrt{2}$"],"answer":"A","explain":"$AB = BC \\cdot \\cos 60^\\circ = 10 \\cdot \\frac{1}{2} = 5$.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác có $a = 7$, $b = 9$, góc $C = 90^\\circ$. Độ dài cạnh $c$ bằng","options":["A. $\\sqrt{130}$","B. $16$","C. $4\\sqrt{2}$","D. $\\sqrt{32}$"],"answer":"A","explain":"$c^2 = 49 + 81 = 130$, suy ra $c = \\sqrt{130}$.","points":0.25},{"type":"mcq","level":"VD","q":"Tam giác có ba cạnh $6, 8, 10$. Sin của góc lớn nhất bằng","options":["A. $\\frac{3}{5}$","B. $\\frac{4}{5}$","C. $1$","D. $\\frac{3}{4}$"],"answer":"C","explain":"Tam giác vuông (vì $36 + 64 = 100$) nên góc lớn nhất bằng $90^\\circ$, $\\sin 90^\\circ = 1$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho tam giác $ABC$ có $\\widehat{B} = 120^\\circ$, $AB = 5$, $BC = 7$. Độ dài cạnh $AC$ bằng","options":["A. $\\sqrt{109}$","B. $\\sqrt{39}$","C. $12$","D. $2\\sqrt{13}$"],"answer":"A","explain":"$AC^2 = 25 + 49 - 2 \\cdot 5 \\cdot 7 \\cdot \\cos 120^\\circ = 74 + 35 = 109$, suy ra $AC = \\sqrt{109}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $S = \\frac{1}{2}bc\\sin A$.","b) $S = \\frac{abc}{4R}$.","c) $S = pr$.","d) $S = p(p-a)(p-b)(p-c)$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng là các công thức diện tích. d) Sai: thiếu dấu căn, đúng là $S = \\sqrt{p(p-a)(p-b)(p-c)}$.","points":1},{"type":"truefalse","level":"TH","q":"Cho tam giác $ABC$ cân tại $A$ có $AB = AC = 5$, $BC = 6$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Diện tích tam giác bằng $12$.","b) $\\cos A = \\frac{7}{25}$.","c) $R = \\frac{25}{8}$.","d) $r = 2$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $p = 8$, $S = \\sqrt{8 \\cdot 3 \\cdot 3 \\cdot 2} = 12$. b) Đúng: $\\cos A = \\frac{25 + 25 - 36}{50} = \\frac{7}{25}$. c) Đúng: $R = \\frac{150}{48} = \\frac{25}{8}$. d) Sai: $r = \\frac{12}{8} = 1{,}5$.","points":1},{"type":"short","level":"VD","q":"Tam giác $ABC$ vuông tại $A$ có $AB = 6$, $\\widehat{B} = 60^\\circ$. Tính độ dài cạnh $BC$.","answer":"12","explain":"$BC = \\frac{AB}{\\cos 60^\\circ} = \\frac{6}{1/2} = 12$.","points":0.5},{"type":"short","level":"VDC","q":"Tam giác $ABC$ có $AB = 5$, $AC = 12$, $BC = 13$. Tính diện tích tam giác.","answer":"30","explain":"Tam giác vuông tại $A$ (vì $25 + 144 = 169$) nên $S = \\frac{1}{2} \\cdot 5 \\cdot 12 = 30$.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Biết ba cạnh của tam giác, muốn tính các góc ta dùng","options":["A. hệ quả của định lí côsin","B. định lí sin","C. công thức Hê-rông","D. công thức đường trung tuyến"],"answer":"A","explain":"Hệ quả định lí côsin: $\\cos A = \\frac{b^2 + c^2 - a^2}{2bc}$ dùng để tính góc khi biết ba cạnh.","points":0.25},{"type":"mcq","level":"NB","q":"Trong định lí sin, $2R$ là","options":["A. đường kính của đường tròn ngoại tiếp tam giác","B. bán kính của đường tròn ngoại tiếp tam giác","C. đường kính của đường tròn nội tiếp tam giác","D. chu vi của tam giác"],"answer":"A","explain":"$\\frac{a}{\\sin A} = 2R$ với $R$ là bán kính đường tròn ngoại tiếp, nên $2R$ là đường kính.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác vuông tại $C$ có $\\widehat{A} = 45^\\circ$, $BC = 6$. Độ dài cạnh huyền $AB$ bằng","options":["A. $6\\sqrt{2}$","B. $6$","C. $12$","D. $3\\sqrt{2}$"],"answer":"A","explain":"$AB = \\frac{BC}{\\sin 45^\\circ} = \\frac{6}{\\sqrt{2}/2} = 6\\sqrt{2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác có $a = 4$, $b = 5$, góc $C = 60^\\circ$. Độ dài cạnh $c$ bằng","options":["A. $\\sqrt{21}$","B. $3$","C. $\\sqrt{41}$","D. $9$"],"answer":"A","explain":"$c^2 = 16 + 25 - 2 \\cdot 4 \\cdot 5 \\cdot \\frac{1}{2} = 21$, suy ra $c = \\sqrt{21}$.","points":0.25},{"type":"mcq","level":"VD","q":"Tam giác $ABC$ có $\\widehat{A} = 120^\\circ$, $b = 8$, $c = 6$. Độ dài cạnh $a$ bằng","options":["A. $2\\sqrt{37}$","B. $10$","C. $2\\sqrt{13}$","D. $14$"],"answer":"A","explain":"$a^2 = 64 + 36 - 2 \\cdot 8 \\cdot 6 \\cdot \\left(-\\frac{1}{2}\\right) = 148$, suy ra $a = 2\\sqrt{37}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tam giác có chu vi bằng $30$ và diện tích bằng $30$. Bán kính đường tròn nội tiếp $r$ bằng","options":["A. $1$","B. $2$","C. $4$","D. $15$"],"answer":"B","explain":"$r = \\frac{S}{p} = \\frac{30}{15} = 2$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tam giác có hai góc bằng $60^\\circ$ là tam giác đều.","b) Tam giác vuông cân có một góc bằng $45^\\circ$.","c) Định lí côsin suy ra định lí Pytago khi góc $A$ vuông.","d) Mọi tam giác đều thỏa mãn $a + b = c$."],"answer":["T","T","T","F"],"explain":"a) Đúng: góc còn lại cũng $60^\\circ$. b) Đúng. c) Đúng: $\\cos 90^\\circ = 0$. d) Sai: vi phạm bất đẳng thức tam giác.","points":1},{"type":"truefalse","level":"TH","q":"Cho tam giác $ABC$ có $AB = 9$, $AC = 12$, $BC = 15$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tam giác $ABC$ vuông tại $A$.","b) Diện tích tam giác bằng $54$.","c) $R = 7{,}5$.","d) Đường cao kẻ từ $A$ bằng $8$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $81 + 144 = 225$. b) Đúng: $S = \\frac{1}{2} \\cdot 9 \\cdot 12 = 54$. c) Đúng: $R = \\frac{15}{2}$. d) Sai: $h_a = \\frac{2S}{a} = \\frac{108}{15} = 7{,}2$.","points":1},{"type":"short","level":"VD","q":"Tam giác $ABC$ có $\\widehat{B} = 90^\\circ$, $AC = 17$, $AB = 8$. Tính độ dài cạnh $BC$.","answer":"15","explain":"$BC = \\sqrt{289 - 64} = 15$.","points":0.5},{"type":"short","level":"VDC","q":"Tam giác $ABC$ có $AB = 7$, $AC = 8$, $BC = 9$. Tính $m_b^2$ (bình phương độ dài đường trung tuyến kẻ từ $B$).","answer":"49","explain":"$m_b^2 = \\frac{2a^2 + 2c^2 - b^2}{4} = \\frac{2 \\cdot 49 + 2 \\cdot 81 - 64}{4} = \\frac{196}{4} = 49$.","points":0.5}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Công thức nào sau đây tính diện tích tam giác khi biết hai cạnh và góc xen giữa?","options":["A. $S = \\frac{1}{2}ab\\sin C$","B. $S = \\sqrt{p(p-a)(p-b)(p-c)}$","C. $S = \\frac{abc}{4R}$","D. $S = pr$"],"answer":"A","explain":"$S = \\frac{1}{2}ab\\sin C$ dùng khi biết hai cạnh $a, b$ và góc xen giữa $C$.","points":0.25},{"type":"mcq","level":"NB","q":"Tam giác $ABC$ có góc $A$ là góc tù. Cạnh lớn nhất của tam giác là","options":["A. $a = BC$","B. $b = CA$","C. $c = AB$","D. Không xác định được"],"answer":"A","explain":"Cạnh lớn nhất đối diện góc lớn nhất; góc tù là góc lớn nhất nên cạnh $a = BC$ lớn nhất.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác có $\\widehat{A} = 30^\\circ$, $BC = 6$. Giá trị của $2R$ bằng","options":["A. $6$","B. $12$","C. $6\\sqrt{3}$","D. $3$"],"answer":"B","explain":"$2R = \\frac{BC}{\\sin A} = \\frac{6}{\\sin 30^\\circ} = 12$.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác vuông tại $A$ có $AB = 8$, $AC = 15$. Giá trị của $\\sin B$ bằng","options":["A. $\\frac{8}{17}$","B. $\\frac{15}{17}$","C. $\\frac{8}{15}$","D. $1$"],"answer":"B","explain":"$BC = 17$, $\\sin B = \\frac{AC}{BC} = \\frac{15}{17}$.","points":0.25},{"type":"mcq","level":"VD","q":"Tam giác có $a = 11$, $b = 13$, góc $C = 60^\\circ$. Độ dài cạnh $c$ bằng","options":["A. $7\\sqrt{3}$","B. $\\sqrt{290}$","C. $12$","D. $7\\sqrt{2}$"],"answer":"A","explain":"$c^2 = 121 + 169 - 2 \\cdot 11 \\cdot 13 \\cdot \\frac{1}{2} = 147$, suy ra $c = 7\\sqrt{3}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tam giác vuông tại $A$ có $AB = 6$, $AC = 8$. Độ dài đường trung tuyến kẻ từ $A$ bằng","options":["A. $5$","B. $10$","C. $7$","D. $4$"],"answer":"A","explain":"Cạnh huyền $BC = 10$; trung tuyến ứng với cạnh huyền bằng nửa cạnh huyền, tức bằng $5$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Góc lớn nhất đối diện với cạnh lớn nhất.","b) Cạnh lớn nhất đối diện với góc lớn nhất.","c) Trong tam giác tù, cạnh đối diện góc tù là cạnh lớn nhất.","d) Định lí sin cho biết $a = 2R\\cos A$."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng theo quan hệ giữa cạnh và góc. d) Sai: $a = 2R\\sin A$.","points":1},{"type":"truefalse","level":"TH","q":"Cho tam giác $ABC$ có $\\widehat{A} = 60^\\circ$, $b = 5$, $c = 8$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) $a = 7$.","b) Diện tích tam giác bằng $10\\sqrt{3}$.","c) Chu vi tam giác bằng $20$.","d) $R = 7$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $a^2 = 25 + 64 - 40 = 49$. b) Đúng: $S = \\frac{1}{2} \\cdot 5 \\cdot 8 \\cdot \\frac{\\sqrt{3}}{2} = 10\\sqrt{3}$. c) Đúng: $5 + 8 + 7 = 20$. d) Sai: $R = \\frac{7}{\\sqrt{3}} = \\frac{7\\sqrt{3}}{3}$.","points":1},{"type":"short","level":"VD","q":"Tam giác $ABC$ có $\\widehat{A} = 90^\\circ$, $AB = 12$, $AC = 5$. Tính độ dài cạnh $BC$.","answer":"13","explain":"$BC = \\sqrt{144 + 25} = 13$.","points":0.5},{"type":"short","level":"VDC","q":"Tam giác $ABC$ có $AB = 6$, $AC = 8$, $\\widehat{A} = 90^\\circ$. Tính bán kính $R$ của đường tròn ngoại tiếp tam giác.","answer":"5","explain":"$BC = 10$ là đường kính đường tròn ngoại tiếp nên $R = 5$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Biết ba cạnh của tam giác, muốn tính các góc ta dùng","options":["A. hệ quả của định lí côsin","B. định lí sin","C. công thức Hê-rông","D. công thức tính đường trung tuyến"],"answer":"A","explain":"Hệ quả định lí côsin $\\cos A = \\frac{b^2 + c^2 - a^2}{2bc}$ dùng để tính góc khi biết ba cạnh.","points":0.25},{"type":"mcq","level":"NB","q":"Trong công thức $r = \\frac{S}{p}$, $p$ là","options":["A. nửa chu vi tam giác","B. chu vi tam giác","C. diện tích tam giác","D. bán kính đường tròn ngoại tiếp"],"answer":"A","explain":"$p = \\frac{a+b+c}{2}$ là nửa chu vi của tam giác.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác có $b = 8$, $c = 6$, $\\widehat{A} = 90^\\circ$. Diện tích tam giác bằng","options":["A. $48$","B. $24$","C. $14$","D. $20$"],"answer":"B","explain":"$S = \\frac{1}{2} \\cdot 8 \\cdot 6 \\cdot \\sin 90^\\circ = 24$.","points":0.25},{"type":"mcq","level":"TH","q":"Tam giác vuông tại $A$ có $\\widehat{B} = 30^\\circ$, $BC = 20$. Độ dài cạnh $AC$ bằng","options":["A. $10$","B. $10\\sqrt{3}$","C. $20$","D. $5$"],"answer":"A","explain":"$AC = BC \\cdot \\sin 30^\\circ = 20 \\cdot \\frac{1}{2} = 10$.","points":0.25},{"type":"mcq","level":"VD","q":"Tam giác có $a = 9$, $b = 10$, $c = 11$. Giá trị của $\\cos C$ bằng","options":["A. $\\frac{1}{3}$","B. $\\frac{1}{2}$","C. $\\frac{2}{3}$","D. $\\frac{1}{4}$"],"answer":"A","explain":"$\\cos C = \\frac{81 + 100 - 121}{2 \\cdot 9 \\cdot 10} = \\frac{60}{180} = \\frac{1}{3}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Tam giác $ABC$ có $\\widehat{A} = 90^\\circ$, $AB = 5$, $AC = 12$. Bán kính đường tròn nội tiếp $r$ bằng","options":["A. $2$","B. $3$","C. $2{,}5$","D. $6$"],"answer":"A","explain":"$BC = 13$, $r = \\frac{AB + AC - BC}{2} = \\frac{5 + 12 - 13}{2} = 2$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $m_a$ là đường trung tuyến kẻ từ đỉnh $A$.","b) $m_a^2 = \\frac{2b^2 + 2c^2 - a^2}{4}$.","c) Đường trung tuyến chia tam giác thành hai tam giác bằng nhau.","d) Trọng tâm chia mỗi đường trung tuyến theo tỉ lệ $2:1$ (tính từ đỉnh)."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: chia thành hai tam giác có diện tích bằng nhau, không nhất thiết bằng nhau. d) Đúng.","points":1},{"type":"truefalse","level":"TH","q":"Cho tam giác $ABC$ có $a = 5$, $b = 5$, $c = 6$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tam giác $ABC$ cân tại $C$.","b) Diện tích tam giác bằng $12$.","c) $\\cos C = \\frac{7}{25}$.","d) Góc $C$ là góc tù."],"answer":["T","T","T","F"],"explain":"a) Đúng: $a = b$. b) Đúng: $p = 8$, $S = \\sqrt{8 \\cdot 3 \\cdot 3 \\cdot 2} = 12$. c) Đúng: $\\cos C = \\frac{25 + 25 - 36}{50} = \\frac{7}{25}$. d) Sai: $\\cos C \\gt 0$ nên góc $C$ nhọn.","points":1},{"type":"short","level":"VD","q":"Tam giác $ABC$ có $\\widehat{A} = 60^\\circ$, $AB = 4$, $AC = 9$. Tính $BC^2$.","answer":"61","explain":"$BC^2 = 16 + 81 - 2 \\cdot 4 \\cdot 9 \\cdot \\frac{1}{2} = 61$.","points":0.5},{"type":"short","level":"VDC","q":"Một người đứng tại $A$ cách $B$ $100$ m trên bờ sông, nhìn sang cù lao $C$ với $\\widehat{CAB} = 70^\\circ$, $\\widehat{CBA} = 60^\\circ$. Tính khoảng cách $AC$ (làm tròn đến hàng đơn vị, tính bằng mét).","answer":"113","explain":"$\\widehat{C} = 50^\\circ$. $AC = \\frac{100 \\cdot \\sin 60^\\circ}{\\sin 50^\\circ} \\approx 113$ m.","points":0.5}]}]}</script>
