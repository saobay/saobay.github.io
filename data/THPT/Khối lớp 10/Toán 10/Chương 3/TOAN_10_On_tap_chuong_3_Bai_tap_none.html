n": "$\\cos^2 \\alpha + \\sin^2 \\alpha = 1$ với mọi góc $\\alpha$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tam giác có ba cạnh $12, 16, 20$. Diện tích tam giác bằng", "options": ["A. $96$", "B. $192$", "C. $48$", "D. $120$"], "answer": "A", "explain": "Tam giác vuông (vì $144 + 256 = 400$) nên $S = \\frac{1}{2} \\cdot 12 \\cdot 16 = 96$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho $\\sin \\alpha + \\cos \\alpha = 0$ với $0^\\circ \\lt \\alpha \\lt 180^\\circ$, $\\alpha \\ne 90^\\circ$. Giá trị của $\\alpha$ là", "options": ["A. $45^\\circ$", "B. $135^\\circ$", "C. $90^\\circ$", "D. $180^\\circ$"], "answer": "B", "explain": "$\\sin \\alpha = -\\cos \\alpha \\Rightarrow \\tan \\alpha = -1 \\Rightarrow \\alpha = 135^\\circ$ (góc tù).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nửa đường tròn đơn vị có bán kính bằng $1$.", "b) $\\sin \\alpha$ là tung độ của điểm $M$ trên nửa đường tròn đơn vị.", "c) $\\cos \\alpha$ là hoành độ của điểm $M$ trên nửa đường tròn đơn vị.", "d) $\\tan \\alpha$ là tích $x_0 \\cdot y_0$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo định nghĩa. d) Sai: $\\tan \\alpha = \\frac{y_0}{x_0}$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Cho tam giác có $a = 7$, $b = 8$, $c = 9$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nửa chu vi $p = 12$.", "b) Diện tích $S = 12\\sqrt{5}$.", "c) $\\cos A = \\frac{2}{3}$.", "d) Góc $A$ là góc tù."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $p = 12$. b) Đúng: $S = \\sqrt{12 \\cdot 5 \\cdot 4 \\cdot 3} = 12\\sqrt{5}$. c) Đúng: $\\cos A = \\frac{64 + 81 - 49}{144} = \\frac{2}{3}$. d) Sai: $\\cos A \\gt 0$ nên góc $A$ nhọn.", "points": 1}, {"type": "short", "level": "VD", "q": "Tính giá trị của biểu thức $T = \\sin 0^\\circ + \\sin 90^\\circ + \\sin 180^\\circ$.", "answer": "1", "explain": "$T = 0 + 1 + 0 = 1$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tam giác $ABC$ có $AB = 9$, $AC = 12$, $\\widehat{A} = 90^\\circ$. Tính bán kính $r$ của đường tròn nội tiếp tam giác.", "answer": "3", "explain": "$BC = 15$, $r = \\frac{9 + 12 - 15}{2} = 3$.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Công thức tính bình phương độ dài đường trung tuyến $m_b$ là", "options": ["A. $m_b^2 = \\frac{2a^2 + 2c^2 - b^2}{4}$", "B. $m_b^2 = \\frac{2a^2 + 2c^2 + b^2}{4}$", "C. $m_b^2 = \\frac{a^2 + c^2 - b^2}{2}$", "D. $m_b^2 = 2a^2 + 2c^2 - b^2$"], "answer": "A", "explain": "Công thức đường trung tuyến: $m_b^2 = \\frac{2a^2 + 2c^2 - b^2}{4}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi $\\alpha = 90^\\circ$, khẳng định nào sau đây đúng?", "options": ["A. $\\sin \\alpha = 1$", "B. $\\cos \\alpha = 1$", "C. $\\tan \\alpha = 0$", "D. $\\cot \\alpha = 1$"], "answer": "A", "explain": "$\\sin 90^\\circ = 1$, $\\cos 90^\\circ = 0$, $\\tan 90^\\circ$ không xác định, $\\cot 90^\\circ = 0$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tam giác $ABC$ có $\\widehat{C} = 90^\\circ$, $\\widehat{A} = 30^\\circ$, $AB = 14$. Độ dài cạnh $BC$ bằng", "options": ["A. $7$", "B. $7\\sqrt{3}$", "C. $14$", "D. $28$"], "answer": "A", "explain": "$BC = AB \\cdot \\sin 30^\\circ = 14 \\cdot \\frac{1}{2} = 7$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giá trị của $\\tan(180^\\circ - 60^\\circ)$ bằng", "options": ["A. $-\\sqrt{3}$", "B. $\\sqrt{3}$", "C. $-\\frac{\\sqrt{3}}{3}$", "D. $-1$"], "answer": "A", "explain": "$\\tan 120^\\circ = -\\tan 60^\\circ = -\\sqrt{3}$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tam giác có $a = 8$, $b = 15$, $c = 17$. Côsin của góc đối diện cạnh $b$ bằng", "options": ["A. $\\frac{8}{17}$", "B. $\\frac{15}{17}$", "C. $\\frac{8}{15}$", "D. $\\frac{1}{2}$"], "answer": "A", "explain": "Góc đối diện cạnh $b$ là góc $B$: $\\cos B = \\frac{64 + 289 - 225}{2 \\cdot 8 \\cdot 17} = \\frac{128}{272} = \\frac{8}{17}$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho $\\cos \\alpha = \\frac{2}{3}$ và $\\alpha$ là góc nhọn. Giá trị của $P = \\tan \\alpha \\cdot \\sin \\alpha$ bằng", "options": ["A. $\\frac{5}{6}$", "B. $\\frac{5}{9}$", "C. $\\frac{2}{3}$", "D. $\\frac{1}{2}$"], "answer": "A", "explain": "$\\sin \\alpha = \\frac{\\sqrt{5}}{3}$, $\\tan \\alpha = \\frac{\\sqrt{5}}{2}$. $P = \\frac{\\sqrt{5}}{2} \\cdot \\frac{\\sqrt{5}}{3} = \\frac{5}{6}$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giải tam giác là tìm các cạnh và các góc còn lại khi biết một số yếu tố cho trước.", "b) Có thể giải tam giác khi biết ba góc.", "c) Có thể giải tam giác khi biết hai cạnh và một góc.", "d) Trong mọi tam giác: $a \\lt b + c$."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: biết ba góc chỉ xác định dạng. c) Đúng (với điều kiện đủ). d) Đúng: bất đẳng thức tam giác.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nếu $\\alpha_1 + \\alpha_2 = 180^\\circ$ thì $\\tan \\alpha_1 = -\\tan \\alpha_2$.", "b) Nếu $\\alpha_1 + \\alpha_2 = 180^\\circ$ thì $\\cot \\alpha_1 = \\cot \\alpha_2$.", "c) $\\sin 90^\\circ = 1$.", "d) $\\cos 180^\\circ = -1$."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: $\\cot \\alpha_1 = -\\cot \\alpha_2$. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Tam giác $ABC$ vuông tại $B$ có $AB = 12$, $BC = 5$. Tính độ dài cạnh $AC$.", "answer": "13", "explain": "$AC = \\sqrt{144 + 25} = 13$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Rút gọn biểu thức $U = \\frac{1 - \\cos^2 60^\\circ}{\\sin^2 60^\\circ}$.", "answer": "1", "explain": "$U = \\frac{\\sin^2 60^\\circ}{\\sin^2 60^\\circ} = 1$.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "$\\cot \\alpha$ xác định khi", "options": ["A. $\\sin \\alpha \\ne 0$", "B. $\\cos \\alpha \\ne 0$", "C. $\\tan \\alpha \\ne 0$", "D. mọi $\\alpha$"], "answer": "A", "explain": "$\\cot \\alpha = \\frac{\\cos \\alpha}{\\sin \\alpha}$ xác định khi $\\sin \\alpha \\ne 0$, tức $\\alpha \\ne 0^\\circ, 180^\\circ$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Công thức $S = \\frac{1}{2}ab\\sin C$ được dùng khi biết", "options": ["A. hai cạnh và góc xen giữa", "B. ba cạnh", "C. ba góc", "D. bán kính đường tròn ngoại tiếp"], "answer": "A", "explain": "$S = \\frac{1}{2}ab\\sin C$ dùng khi biết hai cạnh $a, b$ và góc xen giữa $C$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giá trị của biểu thức $P = \\sin 30^\\circ \\cdot \\cos 60^\\circ + \\cos 30^\\circ \\cdot \\sin 60^\\circ$ bằng", "options": ["A. $0$", "B. $\\frac{1}{2}$", "C. $1$", "D. $\\frac{\\sqrt{3}}{2}$"], "answer": "C", "explain": "$P = \\frac{1}{2} \\cdot \\frac{1}{2} + \\frac{\\sqrt{3}}{2} \\cdot \\frac{\\sqrt{3}}{2} = \\frac{1}{4} + \\frac{3}{4} = 1$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tam giác có ba cạnh $5, 12, 13$. Bán kính đường tròn ngoại tiếp $R$ bằng", "options": ["A. $6{,}5$", "B. $13$", "C. $5$", "D. $30$"], "answer": "A", "explain": "Tam giác vuông (vì $25 + 144 = 169$) nên $R = \\frac{13}{2} = 6{,}5$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tam giác $ABC$ có $\\widehat{A} = 60^\\circ$, $AB = 9$, $AC = 12$. Giá trị của $BC^2$ bằng", "options": ["A. $117$", "B. $333$", "C. $45$", "D. $225$"], "answer": "A", "explain": "$BC^2 = 81 + 144 - 2 \\cdot 9 \\cdot 12 \\cdot \\frac{1}{2} = 117$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho $\\tan \\alpha = -1$ và $90^\\circ \\lt \\alpha \\lt 180^\\circ$. Giá trị của $\\sin \\alpha - \\cos \\alpha$ bằng", "options": ["A. $0$", "B. $\\sqrt{2}$", "C. $1$", "D. $-\\sqrt{2}$"], "answer": "B", "explain": "$\\alpha = 135^\\circ$: $\\sin \\alpha - \\cos \\alpha = \\frac{\\sqrt{2}}{2} - \\left(-\\frac{\\sqrt{2}}{2}\\right) = \\sqrt{2}$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $\\cos 120^\\circ = -\\frac{1}{2}$.", "b) $\\frac{a}{\\sin A} = 2R$.", "c) $S = pr$.", "d) $\\sin(180^\\circ - \\alpha) = -\\sin \\alpha$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: định lí sin. c) Đúng. d) Sai: $\\sin(180^\\circ - \\alpha) = \\sin \\alpha$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Cho tam giác $ABC$ có $AB = 7$, $AC = 24$, $BC = 25$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tam giác $ABC$ vuông tại $A$.", "b) Diện tích tam giác bằng $84$.", "c) $R = 12{,}5$.", "d) $r = 4$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $49 + 576 = 625$. b) Đúng: $S = \\frac{1}{2} \\cdot 7 \\cdot 24 = 84$. c) Đúng: $R = \\frac{25}{2}$. d) Sai: $r = \\frac{7 + 24 - 25}{2} = 3$.", "points": 1}, {"type": "short", "level": "VD", "q": "Tính giá trị của biểu thức $V = 2\\tan 45^\\circ - 3\\cot 45^\\circ + \\sin 90^\\circ$.", "answer": "0", "explain": "$V = 2 \\cdot 1 - 3 \\cdot 1 + 1 = 0$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tam giác $ABC$ có $AB = 20$, $AC = 21$, $BC = 29$. Tính diện tích tam giác.", "answer": "210", "explain": "Tam giác vuông tại $A$ (vì $400 + 441 = 841$) nên $S = \\frac{1}{2} \\cdot 20 \\cdot 21 = 210$.", "points": 0.5}]}]}</script>
