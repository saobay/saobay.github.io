Giá trị nào của $\\alpha$ làm cho $\\cot \\alpha$ không xác định?","options":["A. $0^\\circ$","B. $45^\\circ$","C. $90^\\circ$","D. $135^\\circ$"],"answer":"A","explain":"$\\cot \\alpha = \\frac{\\cos \\alpha}{\\sin \\alpha}$ không xác định khi $\\sin \\alpha = 0$, tức $\\alpha = 0^\\circ$ hoặc $180^\\circ$.","points":0.25},{"type":"mcq","level":"NB","q":"Giá trị của $\\tan 45^\\circ$ bằng","options":["A. $1$","B. $\\sqrt{3}$","C. $\\frac{\\sqrt{3}}{3}$","D. $0$"],"answer":"A","explain":"Theo bảng giá trị lượng giác của các góc đặc biệt: $\\tan 45^\\circ = 1$.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị của $\\cot 150^\\circ$ bằng","options":["A. $-\\sqrt{3}$","B. $\\sqrt{3}$","C. $-\\frac{\\sqrt{3}}{3}$","D. $-1$"],"answer":"A","explain":"$\\cot 150^\\circ = \\cot(180^\\circ - 30^\\circ) = -\\cot 30^\\circ = -\\sqrt{3}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $\\alpha$ là góc tù. Khẳng định nào sau đây sai?","options":["A. $\\sin \\alpha \\gt 0$","B. $\\cos \\alpha \\lt 0$","C. $\\tan \\alpha \\gt 0$","D. $\\cot \\alpha \\lt 0$"],"answer":"C","explain":"Góc tù có $\\tan \\alpha \\lt 0$ nên khẳng định C sai. Các khẳng định còn lại đều đúng.","points":0.25},{"type":"mcq","level":"VD","q":"Tính giá trị của biểu thức $P = \\frac{1 - \\sin 90^\\circ}{2} + \\cos 60^\\circ$.","options":["A. $0$","B. $\\frac{1}{2}$","C. $1$","D. $\\frac{3}{2}$"],"answer":"B","explain":"$P = \\frac{1 - 1}{2} + \\frac{1}{2} = \\frac{1}{2}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $\\sin \\alpha = \\frac{3}{5}$ và $\\alpha$ là góc nhọn. Giá trị của $P = \\cos \\alpha - \\sin \\alpha$ bằng","options":["A. $\\frac{1}{5}$","B. $-\\frac{1}{5}$","C. $\\frac{7}{5}$","D. $\\frac{2}{5}$"],"answer":"A","explain":"$\\cos \\alpha = \\frac{4}{5}$ (vì $\\alpha$ nhọn). Vậy $P = \\frac{4}{5} - \\frac{3}{5} = \\frac{1}{5}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\tan \\alpha = \\frac{\\sin \\alpha}{\\cos \\alpha}$ (với $\\cos \\alpha \\ne 0$).","b) $\\cot \\alpha = \\frac{1}{\\tan \\alpha}$ (khi cả hai xác định).","c) $\\sin 60^\\circ = \\frac{\\sqrt{3}}{2}$.","d) $\\cos 60^\\circ = \\frac{\\sqrt{3}}{2}$."],"answer":["T","T","T","F"],"explain":"a) Đúng theo định nghĩa. b) Đúng. c) Đúng. d) Sai: $\\cos 60^\\circ = \\frac{1}{2}$.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Góc $135^\\circ$ và góc $45^\\circ$ là hai góc bù nhau.","b) $\\sin 135^\\circ = \\sin 45^\\circ$.","c) $\\cos 135^\\circ = \\cos 45^\\circ$.","d) $\\tan 135^\\circ = -\\tan 45^\\circ$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $135^\\circ + 45^\\circ = 180^\\circ$. b) Đúng: sin của hai góc bù bằng nhau. c) Sai: $\\cos 135^\\circ = -\\frac{\\sqrt{2}}{2} \\ne \\cos 45^\\circ$. d) Đúng: $-1 = -1$.","points":1},{"type":"short","level":"VD","q":"Tính giá trị của biểu thức $I = -2\\cos 120^\\circ + 2\\sin 30^\\circ$.","answer":"2","explain":"$I = -2 \\cdot \\left(-\\frac{1}{2}\\right) + 2 \\cdot \\frac{1}{2} = 1 + 1 = 2$.","points":0.5},{"type":"short","level":"VDC","q":"Tìm góc $\\alpha \\in (0^\\circ; 180^\\circ)$ biết $\\sin \\alpha = \\cos \\alpha$ và $\\alpha \\ne 90^\\circ$. (Nhập số đo góc theo độ.)","answer":"45","explain":"$\\sin \\alpha = \\cos \\alpha \\Rightarrow \\tan \\alpha = 1 \\Rightarrow \\alpha = 45^\\circ$.","points":0.5}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Trong các góc sau, góc nào có $\\sin$ bằng $0$?","options":["A. $0^\\circ$","B. $30^\\circ$","C. $90^\\circ$","D. $60^\\circ$"],"answer":"A","explain":"$\\sin 0^\\circ = 0$ (điểm $M$ trùng với điểm $(1; 0)$... tại $\\alpha = 0^\\circ$ điểm $M$ là $(1; 0)$ nên tung độ bằng $0$).","points":0.25},{"type":"mcq","level":"NB","q":"Giá trị của $\\cos 90^\\circ$ bằng","options":["A. $0$","B. $1$","C. $-1$","D. $\\frac{1}{2}$"],"answer":"A","explain":"Theo bảng giá trị lượng giác: $\\cos 90^\\circ = 0$.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị của $\\tan 120^\\circ$ bằng","options":["A. $-\\sqrt{3}$","B. $\\sqrt{3}$","C. $-\\frac{\\sqrt{3}}{3}$","D. $-1$"],"answer":"A","explain":"$\\tan 120^\\circ = \\tan(180^\\circ - 60^\\circ) = -\\tan 60^\\circ = -\\sqrt{3}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $\\alpha = 150^\\circ$. Khẳng định nào sau đây đúng?","options":["A. $\\sin \\alpha = \\frac{1}{2}$","B. $\\cos \\alpha = \\frac{\\sqrt{3}}{2}$","C. $\\tan \\alpha = \\frac{\\sqrt{3}}{3}$","D. $\\cot \\alpha = \\sqrt{3}$"],"answer":"A","explain":"$\\sin 150^\\circ = \\sin 30^\\circ = \\frac{1}{2}$. Còn $\\cos 150^\\circ = -\\frac{\\sqrt{3}}{2}$, $\\tan 150^\\circ = -\\frac{\\sqrt{3}}{3}$, $\\cot 150^\\circ = -\\sqrt{3}$.","points":0.25},{"type":"mcq","level":"VD","q":"Tính giá trị của biểu thức $P = \\sin^2 60^\\circ - \\cos^2 60^\\circ$.","options":["A. $0$","B. $\\frac{1}{2}$","C. $1$","D. $-\\frac{1}{2}$"],"answer":"B","explain":"$P = \\frac{3}{4} - \\frac{1}{4} = \\frac{1}{2}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $\\tan \\alpha = -\\frac{\\sqrt{3}}{3}$ và $90^\\circ \\lt \\alpha \\lt 180^\\circ$. Giá trị của $\\cot \\alpha$ bằng","options":["A. $\\sqrt{3}$","B. $-\\sqrt{3}$","C. $\\frac{\\sqrt{3}}{3}$","D. $-\\frac{\\sqrt{3}}{3}$"],"answer":"B","explain":"$\\cot \\alpha = \\frac{1}{\\tan \\alpha} = -\\sqrt{3}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nửa đường tròn đơn vị có bán kính bằng $1$.","b) Nửa đường tròn đơn vị nằm phía trên trục $Ox$.","c) Mọi điểm trên nửa đường tròn đơn vị đều có hoành độ không âm.","d) Góc $\\alpha$ luôn thỏa mãn $0^\\circ \\le \\alpha \\le 180^\\circ$."],"answer":["T","T","F","T"],"explain":"a) Đúng theo định nghĩa. b) Đúng. c) Sai: hoành độ $x_0 \\in [-1; 1]$. d) Đúng trong phạm vi bài học.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\sin 60^\\circ + \\cos 120^\\circ = 25},{"type":"mcq","level":"VD","q":"Tính giá trị của biểu thức $P = \\tan 60^\\circ \\cdot \\cot 60^\\circ + \\sin 90^\\circ$.","options":["A. $0$","B. $1$","C. $2$","D. $3$"],"answer":"C","explain":"$P = 1 + 1 = 2$ (vì $\\tan \\alpha \\cdot \\cot \\alpha = 1$ khi xác định).","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $\\cos \\alpha = \\frac{5}{13}$ và $\\alpha$ là góc nhọn. Giá trị của $\\sin \\alpha + \\cos \\alpha$ bằng","options":["A. $\\frac{7}{13}$","B. $\\frac{12}{13}$","C. $\\frac{17}{13}$","D. $1$"],"answer":"C","explain":"$\\sin \\alpha = \\frac{12}{13}$ (vì $\\alpha$ nhọn). Vậy $\\sin \\alpha + \\cos \\alpha = \\frac{17}{13}$.","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\alpha = 180^\\circ - \\alpha$ khi $\\alpha = 90^\\circ$.","b) Góc $90^\\circ$ bù với chính nó.","c) $\\sin 90^\\circ = 1$ là giá trị lớn nhất của $\\sin \\alpha$.","d) $\\cos \\alpha \\ge 0$ với mọi góc $\\alpha$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $2\\alpha = 180^\\circ$. b) Đúng: $90^\\circ + 90^\\circ = 180^\\circ$. c) Đúng: $\\sin \\alpha \\le 1$. d) Sai: góc tù có $\\cos$ âm.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Nếu $\\alpha_1 + \\alpha_2 = 180^\\circ$ thì $\\sin \\alpha_1 = \\sin \\alpha_2$.","b) Nếu $\\alpha_1 + \\alpha_2 = 180^\\circ$ thì $\\cos \\alpha_1 = -\\cos \\alpha_2$.","c) Góc $30^\\circ$ và góc $150^\\circ$ bù nhau.","d) Góc $60^\\circ$ và góc $120^\\circ$ phụ nhau."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: tổng bằng $180^\\circ$. d) Sai: tổng bằng $180^\\circ$ nên bù nhau, không phải phụ nhau.","points":1},{"type":"short","level":"VD","q":"Tính giá trị của biểu thức $K = \\sqrt{2}\\sin 45^\\circ + \\sqrt{2}\\cos 45^\\circ$.","answer":"2","explain":"$K = \\sqrt{2} \\cdot \\frac{\\sqrt{2}}{2} + \\sqrt{2} \\cdot \\frac{\\sqrt{2}}{2} = 1 + 1 = 2$.","points":0.5},{"type":"short","level":"VDC","q":"Tìm góc tù $\\alpha$ biết $\\tan \\alpha = -1$. (Nhập số đo góc theo độ.)","answer":"135","explain":"$\\tan \\alpha = -1$ và $\\alpha$ tù nên $\\alpha = 180^\\circ - 45^\\circ = 135^\\circ$.","points":0.5}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Khẳng định nào sau đây đúng?","options":["A. $\\sin 0^\\circ = 0$","B. $\\cos 0^\\circ = 0$","C. $\\tan 0^\\circ = 1$","D. $\\cot 0^\\circ = 0$"],"answer":"A","explain":"$\\sin 0^\\circ = 0$, $\\cos 0^\\circ = 1$, $\\tan 0^\\circ = 0$, $\\cot 0^\\circ$ không xác định.","points":0.25},{"type":"mcq","level":"NB","q":"Giá trị của $\\tan 30^\\circ$ bằng","options":["A. $\\frac{\\sqrt{3}}{3}$","B. $\\sqrt{3}$","C. $1$","D. $\\frac{1}{2}$"],"answer":"A","explain":"Theo bảng giá trị lượng giác: $\\tan 30^\\circ = \\frac{\\sqrt{3}}{3}$.","points":0.25},{"type":"mcq","level":"TH","q":"Giá trị của $\\sin(180^\\circ - 45^\\circ)$ bằng","options":["A. $\\frac{\\sqrt{2}}{2}$","B. $-\\frac{\\sqrt{2}}{2}$","C. $\\frac{1}{2}$","D. $\\frac{\\sqrt{3}}{2}$"],"answer":"A","explain":"$\\sin(180^\\circ - 45^\\circ) = \\sin 45^\\circ = \\frac{\\sqrt{2}}{2}$.","points":0.25},{"type":"mcq","level":"TH","q":"Cho $\\alpha = 120^\\circ$. Giá trị nào sau đây bằng $-\\frac{1}{2}$?","options":["A. $\\cos \\alpha$","B. $\\sin \\alpha$","C. $-\\cos \\alpha$","D. $\\sin(180^\\circ - \\alpha)$"],"answer":"A","explain":"$\\cos 120^\\circ = -\\frac{1}{2}$. Còn $\\sin 120^\\circ = \\frac{\\sqrt{3}}{2}$.","points":0.25},{"type":"mcq","level":"VD","q":"Tính giá trị của biểu thức $P = \\frac{\\sin 30^\\circ + \\cos 60^\\circ}{2}$.","options":["A. $\\frac{1}{4}$","B. $\\frac{1}{2}$","C. $1$","D. $2$"],"answer":"B","explain":"$P = \\frac{1/2 + 1/2}{2} = \\frac{1}{2}$.","points":0.25},{"type":"mcq","level":"VDC","q":"Cho $\\sin \\alpha = \\frac{4}{5}$ và $90^\\circ \\lt \\alpha \\lt 180^\\circ$. Giá trị của $\\cos \\alpha$ bằng","options":["A. $\\frac{3}{5}$","B. $-\\frac{3}{5}$","C. $\\frac{4}{5}$","D. $-\\frac{4}{5}$"],"answer":"B","explain":"$\\cos^2 \\alpha = 1 - \\frac{16}{25} = \\frac{9}{25} \\Rightarrow \\cos \\alpha = -\\frac{3}{5}$ (vì $\\alpha$ tù).","points":0.25},{"type":"truefalse","level":"NB","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\cos(180^\\circ - \\alpha) = -\\cos \\alpha$.","b) $\\sin(180^\\circ - \\alpha) = -\\sin \\alpha$.","c) Hai góc bù nhau có tổng bằng $180^\\circ$.","d) $\\tan(180^\\circ - 45^\\circ) = 1$."],"answer":["T","F","T","F"],"explain":"a) Đúng. b) Sai: $\\sin(180^\\circ - \\alpha) = \\sin \\alpha$. c) Đúng theo định nghĩa. d) Sai: $\\tan 135^\\circ = -1$.","points":1},{"type":"truefalse","level":"TH","q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) $\\sin 120^\\circ = \\frac{\\sqrt{3}}{2}$.","b) $\\cos 120^\\circ = \\frac{1}{2}$.","c) $\\tan 120^\\circ = -\\sqrt{3}$.","d) $\\cot 120^\\circ = -\\frac{\\sqrt{3}}{3}$."],"answer":["T","F","T","T"],"explain":"a) Đúng. b) Sai: $\\cos 120^\\circ = -\\frac{1}{2}$. c) Đúng. d) Đúng: $\\cot 120^\\circ = -\\cot 60^\\circ = -\\frac{\\sqrt{3}}{3}$.","points":1},{"type":"short","level":"VD","q":"Tính giá trị của biểu thức $L = 4\\sin^2 30^\\circ + 4\\cos^2 30^\\circ$.","answer":"4","explain":"$L = 4(\\sin^2 30^\\circ + \\cos^2 30^\\circ) = 4$.","points":0.5},{"type":"short","level":"VDC","q":"Rút gọn biểu thức $M = 2\\sin 150^\\circ + 2\\cos 60^\\circ - 1$.","answer":"1","explain":"$M = 2 \\cdot \\frac{1}{2} + 2 \\cdot \\frac{1}{2} - 1 = 1$.","points":0.5}]}]}</script>
