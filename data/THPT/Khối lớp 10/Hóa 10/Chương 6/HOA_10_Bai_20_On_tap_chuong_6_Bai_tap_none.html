: "TH", "q": "Trong phản ứng phân hủy $H_2O_2$ có bột $MnO_2$, $MnO_2$ đóng vai trò là", "options": ["A. chất phản ứng.", "B. chất xúc tác.", "C. chất sản phẩm.", "D. chất ức chế."], "answer": "B", "explain": "$MnO_2$ làm tăng tốc độ phân hủy $H_2O_2$ nhưng không bị tiêu hao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nén hỗn hợp khí phản ứng (tăng áp suất) thì tốc độ phản ứng", "options": ["A. tăng.", "B. giảm.", "C. không đổi.", "D. bằng 0."], "answer": "A", "explain": "Tăng áp suất làm tăng nồng độ chất khí, số va chạm hiệu quả tăng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tốc độ phản ứng ở nhiệt độ $T$ là 0,25 mol/(L·s), $\\gamma = 2$. Khi giảm nhiệt độ đi $30^\\circ C$, tốc độ phản ứng là", "options": ["A. 0,031 mol/(L·s).", "B. 0,062 mol/(L·s).", "C. 0,125 mol/(L·s).", "D. 2,0 mol/(L·s)."], "answer": "A", "explain": "Giảm $30^\\circ C$ tức $n = 3$: $v = 0{,}25/2^3 = 0{,}25/8 = 0{,}03125 \\approx 0{,}031$ mol/(L·s).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) $v = -\\Delta C_{cđ}/\\Delta t = +\\Delta C_{sp}/\\Delta t$.", "b) Đơn vị thời gian có thể là giây, phút, giờ.", "c) Tốc độ phản ứng luôn dương.", "d) Chất xúc tác làm thay đổi nhiệt phản ứng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chất xúc tác không làm thay đổi $\\Delta_rH$.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho $v_{20} = 0{,}01$ mol/(L·s), $\\gamma = 2$. Xét các phát biểu:", "statements": ["a) $v_{30} = 0{,}02$ mol/(L·s).", "b) $v_{40} = 0{,}04$ mol/(L·s).", "c) $v_{50} = 0{,}08$ mol/(L·s).", "d) $v_{10} = 0{,}02$ mol/(L·s)."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $v_{10} = 0{,}005$ mol/(L·s).", "points": 1}, {"type": "short", "level": "VD", "q": "Nồng độ của một chất đầu giảm 0,72 mol/L trong 6 phút. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,002", "explain": "$v = 0{,}72/360 = 0{,}002$ mol/(L·s).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hệ số nhiệt độ $\\gamma = 4$. Khi tăng nhiệt độ thêm $10^\\circ C$ thì tốc độ phản ứng tăng lên bao nhiêu lần?", "answer": "4", "explain": "Tăng $10^\\circ C$ tức $n = 1$: tốc độ tăng $4^1 = 4$ lần.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Lượng chất trong định nghĩa tốc độ phản ứng có thể biểu diễn bằng", "options": ["A. chỉ số mol.", "B. số mol, nồng độ mol, khối lượng hoặc thể tích.", "C. chỉ khối lượng.", "D. chỉ thể tích."], "answer": "B", "explain": "Lượng chất có thể biểu diễn bằng nhiều đại lượng khác nhau.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chất xúc tác làm tăng tốc độ phản ứng bằng cách", "options": ["A. làm tăng nồng độ chất phản ứng.", "B. làm giảm năng lượng hoạt hóa.", "C. làm tăng nhiệt độ.", "D. làm tăng áp suất."], "answer": "B", "explain": "Chất xúc tác tạo con đường phản ứng mới có năng lượng hoạt hóa thấp hơn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Than tổ ong có nhiều lỗ nên cháy tốt hơn than cục vì", "options": ["A. tăng diện tích tiếp xúc với không khí.", "B. có chất xúc tác.", "C. tăng nhiệt độ.", "D. tăng áp suất."], "answer": "A", "explain": "Diện tích bề mặt tiếp xúc càng lớn thì tốc độ cháy càng nhanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho Zn vào $HCl$ 1M và $HCl$ 2M (các điều kiện khác như nhau). Hiện tượng đúng là", "options": ["A. cốc $HCl$ 1M thoát khí nhanh hơn.", "B. cốc $HCl$ 2M thoát khí nhanh hơn.", "C. hai cốc như nhau.", "D. cốc $HCl$ 1M không phản ứng."], "answer": "B", "explain": "Nồng độ acid càng lớn thì tốc độ phản ứng càng nhanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sau khi phản ứng kết thúc, chất xúc tác", "options": ["A. bị tiêu hao hết.", "B. khối lượng và tính chất hóa học không đổi.", "C. biến thành chất khác.", "D. bay hơi hết."], "answer": "B", "explain": "Chất xúc tác không bị tiêu hao trong phản ứng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tốc độ phản ứng ở $50^\\circ C$ là 0,48 mol/(L·s), $\\gamma = 2$. Tốc độ phản ứng ở $20^\\circ C$ là", "options": ["A. 0,06 mol/(L·s).", "B. 0,12 mol/(L·s).", "C. 0,24 mol/(L·s).", "D. 0,96 mol/(L·s)."], "answer": "A", "explain": "Giảm $30^\\circ C$ tức $n = 3$: $v = 0{,}48/8 = 0{,}06$ mol/(L·s).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về các yếu tố ảnh hưởng đến tốc độ phản ứng:", "statements": ["a) Tăng nồng độ thì tốc độ tăng.", "b) Tăng nhiệt độ thì tốc độ tăng.", "c) Nghiền nhỏ chất rắn thì tốc độ tăng.", "d) Giảm áp suất của hệ khí thì tốc độ tăng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: giảm áp suất làm giảm nồng độ khí nên tốc độ giảm.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Thí nghiệm Zn với $HCl$. Xét các phát biểu:", "statements": ["a) $HCl$ càng đặc thì bọt khí thoát ra càng mạnh.", "b) Zn bột phản ứng nhanh hơn Zn miếng.", "c) Đun nóng thì bọt khí thoát ra mạnh hơn.", "d) Thêm $MnO_2$ thì bọt khí thoát ra mạnh hơn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $MnO_2$ không xúc tác cho phản ứng này.", "points": 1}, {"type": "short", "level": "VD", "q": "Nồng độ của một chất đầu giảm 0,45 mol/L trong 90 giây. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,005", "explain": "$v = 0{,}45/90 = 0{,}005$ mol/(L·s).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hệ số nhiệt độ $\\gamma = 2$. Khi tăng nhiệt độ thêm $40^\\circ C$ thì tốc độ phản ứng tăng lên bao nhiêu lần?", "answer": "16", "explain": "Tăng $40^\\circ C$ tức $n = 4$: tốc độ tăng $2^4 = 16$ lần.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Tốc độ phản ứng là đại lượng đặc trưng cho", "options": ["A. sự nhanh, chậm của phản ứng hóa học.", "B. hiệu suất phản ứng.", "C. sự cân bằng hóa học.", "D. nhiệt độ phản ứng."], "answer": "A", "explain": "Định nghĩa tốc độ phản ứng.", "points": 0.25}, {"answer": "A", "explain": "Tốc độ phản ứng cho biết mức độ nhanh, chậm của phản ứng, được xác định bằng độ biến thiên nồng độ của một chất phản ứng hoặc sản phẩm trong một đơn vị thời gian.", "level": "NB", "options": ["A. độ biến thiên nồng độ của một chất trong một đơn vị thời gian.", "B. tổng số mol các chất có trong hệ phản ứng.", "C. khối lượng chất phản ứng đã dùng trong một đơn vị thời gian.", "D. nhiệt lượng tỏa ra hay thu vào của phản ứng."], "points": 0.25, "q": "Tốc độ phản ứng hóa học được xác định bằng", "type": "mcq"}, {"type": "mcq", "level": "NB", "q": "Khi tăng diện tích bề mặt tiếp xúc của chất rắn thì tốc độ phản ứng", "options": ["A. tăng.", "B. giảm.", "C. không đổi.", "D. bằng 0."], "answer": "A", "explain": "Diện tích tiếp xúc càng lớn, số va chạm hiệu quả càng nhiều.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao thực phẩm để trong tủ lạnh lâu hỏng hơn để ở ngoài?", "options": ["A. Vì nhiệt độ thấp làm chậm các phản ứng phân hủy.", "B. Vì tủ lạnh không có không khí.", "C. Vì nhiệt độ thấp làm tăng tốc độ phản ứng.", "D. Vì ánh sáng trong tủ lạnh diệt khuẩn."], "answer": "A", "explain": "Nhiệt độ thấp làm giảm tốc độ các phản ứng sinh hóa gây hỏng thực phẩm.", "points": 0.25}, {"answer": "A", "explain": "Nghiền nhỏ làm tăng diện tích bề mặt tiếp xúc, tăng số va chạm hiệu quả giữa các tiểu phân nên tốc độ phản ứng tăng.", "level": "TH", "options": ["A. làm tăng diện tích tiếp xúc giữa các chất phản ứng.", "B. làm giảm năng lượng hoạt hóa của phản ứng.", "C. làm tăng nhiệt độ của hệ phản ứng.", "D. sinh ra chất xúc tác mới cho phản ứng."], "points": 0.25, "q": "Nghiền nhỏ chất rắn trước khi cho phản ứng làm tăng tốc độ phản ứng vì", "type": "mcq"}, {"type": "mcq", "level": "VDC", "q": "Tốc độ phản ứng ở $15^\\circ C$ là 0,03 mol/(L·s), $\\gamma = 2$. Tốc độ phản ứng ở $45^\\circ C$ là", "options": ["A. 0,06 mol/(L·s).", "B. 0,12 mol/(L·s).", "C. 0,24 mol/(L·s).", "D. 0,48 mol/(L·s)."], "answer": "C", "explain": "Tăng $30^\\circ C$ tức $n = 3$: $v = 2^3 \\times 0{,}03 = 0{,}24$ mol/(L·s).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về chất xúc tác:", "statements": ["a) Chất xúc tác làm tăng tốc độ phản ứng.", "b) Chất xúc tác được tái tạo sau phản ứng.", "c) Men bánh mì là chất xúc tác sinh học.", "d) Chất xúc tác làm tăng nhiệt lượng tỏa ra."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: không làm thay đổi $\\Delta_rH$.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về ảnh hưởng của nhiệt độ:", "statements": ["a) Nhiệt độ tăng làm tiểu phân chuyển động nhanh hơn.", "b) Nhiệt độ tăng làm tăng số va chạm hiệu quả.", "c) Tăng $10^\\circ C$, tốc độ tăng 2–4 lần.", "d) Giảm nhiệt độ làm tăng tốc độ phản ứng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Nồng độ của một sản phẩm tăng thêm 0,18 mol/L trong 60 giây. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,003", "explain": "$v = 0{,}18/60 = 0{,}003$ mol/(L·s).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hệ số nhiệt độ $\\gamma = 2$. Muốn tốc độ phản ứng tăng lên 32 lần thì cần tăng nhiệt độ thêm bao nhiêu độ C?", "answer": "50", "explain": "$2^n = 32 \\Rightarrow n = 5$, tức tăng $5 \\times 10 = 50^\\circ C$.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"answer": "A", "explain": "Nồng độ mol (mol/L) là đơn vị thường dùng để biểu diễn lượng chất trong công thức tính tốc độ phản ứng.", "level": "NB", "options": ["A. mol/L.", "B. gam.", "C. lít.", "D. mol."], "points": 0.25, "q": "Đơn vị nồng độ thường dùng trong công thức tính tốc độ phản ứng là", "type": "mcq"}, {"type": "mcq", "level": "NB", "q": "Khi tăng nhiệt độ, các tiểu phân trong hệ phản ứng", "options": ["A. chuyển động chậm lại.", "B. chuyển động nhanh hơn, va chạm hiệu quả nhiều hơn.", "C. ngừng chuyển động.", "D. biến mất."], "answer": "B", "explain": "Nhiệt độ tăng làm tăng động năng và số va chạm hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ví dụ đúng về chất xúc tác trong đời sống là", "options": ["A. Men dùng làm bánh mì.", "B. Muối ăn.", "C. Đường kính.", "D. Đá lạnh."], "answer": "A", "explain": "Men (enzyme) là chất xúc tác sinh học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho vào hai cốc $HCl$ cùng nồng độ: cốc (1) 1 gam Zn bột, cốc (2) 1 gam Zn miếng. Hiện tượng đúng là", "options": ["A. cốc (2) sủi bọt mạnh hơn.", "B. cốc (1) sủi bọt mạnh hơn vì diện tích tiếp xúc lớn hơn.", "C. hai cốc như nhau.", "D. không có hiện tượng."], "answer": "B", "explain": "Zn bột có diện tích bề mặt tiếp xúc lớn hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Công thức Van't Hoff là", "options": ["A. $v_{T+10n} = \\gamma^n \\cdot v_T$.", "B. $v_{T+10n} = \\gamma \\cdot n \\cdot v_T$.", "C. $v_{T+10n} = v_T / \\gamma^n$.", "D. $v_{T+10n} = v_T + n\\gamma$."], "answer": "A", "explain": "Đúng công thức Van't Hoff.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tốc độ phản ứng ở $5^\\circ C$ là 0,02 mol/(L·s), $\\gamma = 4$. Tốc độ phản ứng ở $25^\\circ C$ là", "options": ["A. 0,08 mol/(L·s).", "B. 0,16 mol/(L·s).", "C. 0,32 mol/(L·s).", "D. 0,64 mol/(L·s)."], "answer": "C", "explain": "Tăng $20^\\circ C$ tức $n = 2$: $v = 4^2 \\times 0{,}02 = 0{,}32$ mol/(L·s).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Tốc độ phản ứng đặc trưng cho sự nhanh, chậm của phản ứng.", "b) Tốc độ phản ứng luôn dương.", "c) Đơn vị của tốc độ có thể là mol/(L·min).", "d) Tốc độ phản ứng không phụ thuộc bản chất chất phản ứng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: bản chất chất phản ứng ảnh hưởng đến tốc độ.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Thí nghiệm phân hủy $H_2O_2$: cốc (1) chỉ có $H_2O_2$, cốc (2) thêm bột $MnO_2$. Xét các phát biểu:", "statements": ["a) Cốc (2) thoát khí $O_2$ mạnh hơn.", "b) $MnO_2$ là chất xúc tác.", "c) Sau phản ứng, khối lượng $MnO_2$ không đổi.", "d) $MnO_2$ làm tăng nhiệt tỏa ra của phản ứng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Nồng độ của một chất đầu giảm 0,42 mol/L trong 210 giây. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,002", "explain": "$v = 0{,}42/210 = 0{,}002$ mol/(L·s).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nồng độ của một chất đầu giảm từ 2,0 mol/L xuống 0,5 mol/L trong 5 phút. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,005", "explain": "$v = (2{,}0 - 0{,}5)/300 = 1{,}5/300 = 0{,}005$ mol/(L·s).", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Tốc độ phản ứng được xác định như thế nào?", "options": ["A. Chỉ bằng sự thay đổi lượng chất đầu.", "B. Chỉ bằng sự thay đổi lượng sản phẩm.", "C. Bằng sự thay đổi lượng chất đầu hoặc sản phẩm trong một đơn vị thời gian.", "D. Bằng tổng khối lượng các chất."], "answer": "C", "explain": "Đúng định nghĩa.", "points": 0.25}, {"answer": "A", "explain": "Chất xúc tác chỉ làm tăng tốc độ phản ứng mà không bị tiêu hao, nên khối lượng của nó không thay đổi sau phản ứng.", "level": "NB", "options": ["A. không thay đổi.", "B. tăng gấp đôi.", "C. giảm còn một nửa.", "D. mất hoàn toàn."], "points": 0.25, "q": "Sau khi phản ứng kết thúc, khối lượng của chất xúc tác", "type": "mcq"}, {"type": "mcq", "level": "NB", "q": "Củi chẻ nhỏ cháy nhanh hơn khúc gỗ to vì", "options": ["A. củi nhỏ nóng hơn.", "B. củi chẻ nhỏ có diện tích tiếp xúc với không khí lớn hơn.", "C. củi nhỏ có chất xúc tác.", "D. khúc gỗ to ướt hơn."], "answer": "B", "explain": "Diện tích bề mặt tiếp xúc càn tements": ["a) Đường cong có chất xúc tác có đỉnh năng lượng hoạt hóa thấp hơn.", "b) Năng lượng của chất đầu và sản phẩm không thay đổi khi có chất xúc tác.", "c) Chất xúc tác làm phản ứng tỏa ra nhiều nhiệt hơn.", "d) Chất xúc tác mở ra con đường phản ứng mới với cơ chế khác."], "type": "truefalse"}, {"type": "short", "level": "VD", "q": "Nồng độ của một sản phẩm tăng thêm 0,27 mol/L trong 135 giây. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,002", "explain": "$v = 0{,}27/135 = 0{,}002$ mol/(L·s).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hệ số nhiệt độ $\\gamma = 3$. Khi tăng nhiệt độ từ $10^\\circ C$ lên $50^\\circ C$ thì tốc độ phản ứng tăng lên bao nhiêu lần?", "answer": "81", "explain": "Tăng $40^\\circ C$ tức $n = 4$: tốc độ tăng $3^4 = 81$ lần.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"answer": "A", "explain": "$\\Delta t$ là khoảng thời gian phản ứng diễn ra, $\\Delta C$ là độ biến thiên nồng độ trong khoảng thời gian đó.", "level": "NB", "options": ["A. khoảng thời gian xảy ra phản ứng.", "B. nhiệt độ của hệ phản ứng.", "C. nồng độ của chất phản ứng.", "D. áp suất của hệ phản ứng."], "points": 0.25, "q": "Trong công thức tính tốc độ phản ứng trung bình $v = \\Delta C/\\Delta t$, đại lượng $\\Delta t$ biểu thị", "type": "mcq"}, {"answer": "A", "explain": "Nồng độ chất sản phẩm tăng dần theo thời gian ($\\Delta C_{sp}$ dương) nên không cần dấu trừ, tốc độ vẫn luôn dương.", "level": "NB", "options": ["A. $v = \\Delta C_{sp}/\\Delta t$.", "B. $v = -\\Delta C_{sp}/\\Delta t$.", "C. $v = \\Delta C_{sp} \\times \\Delta t$.", "D. $v = \\Delta t/\\Delta C_{sp}$."], "points": 0.25, "q": "Khi tính tốc độ phản ứng theo sự tăng nồng độ của chất sản phẩm, công thức được dùng là", "type": "mcq"}, {"type": "mcq", "level": "NB", "q": "Enzyme trong cơ thể sinh vật là", "options": ["A. chất xúc tác sinh học.", "B. chất phản ứng.", "C. chất sản phẩm.", "D. chất độc."], "answer": "A", "explain": "Enzyme là chất xúc tác sinh học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai cốc đựng $H_2O_2$: cốc (1) không thêm gì, cốc (2) thêm một ít bột $MnO_2$. Hiện tượng đúng là", "options": ["A. cốc (1) thoát khí mạnh hơn.", "B. cốc (2) thoát khí $O_2$ mạnh hơn vì $MnO_2$ là chất xúc tác.", "C. hai cốc như nhau.", "D. cốc (2) không có hiện tượng."], "answer": "B", "explain": "$MnO_2$ xúc tác làm tăng tốc độ phân hủy $H_2O_2$.", "points": 0.25}, {"answer": "A", "explain": "$V_2O_5$ là chất xúc tác cho phản ứng $2SO_2 + O_2 \\to 2SO_3$, làm giảm năng lượng hoạt hóa nên tốc độ phản ứng tăng.", "level": "TH", "options": ["A. $V_2O_5$ là chất xúc tác làm tăng tốc độ oxi hóa $SO_2$ thành $SO_3$.", "B. $V_2O_5$ làm tăng nồng độ của $SO_2$.", "C. $V_2O_5$ làm tăng nhiệt độ của hệ phản ứng.", "D. $V_2O_5$ làm tăng áp suất của hệ phản ứng."], "points": 0.25, "q": "Trong công nghiệp sản xuất $H_2SO_4$ bằng phương pháp tiếp xúc, người ta dùng $V_2O_5$ vì", "type": "mcq"}, {"type": "mcq", "level": "VDC", "q": "Tốc độ phản ứng ở $30^\\circ C$ là 0,4 mol/(L·min), $\\gamma = 2$. Tốc độ phản ứng ở $0^\\circ C$ là", "options": ["A. 0,05 mol/(L·min).", "B. 0,10 mol/(L·min).", "C. 0,20 mol/(L·min).", "D. 3,20 mol/(L·min)."], "answer": "A", "explain": "Giảm $30^\\circ C$ tức $n = 3$: $v = 0{,}4/8 = 0{,}05$ mol/(L·min).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Tốc độ phản ứng đặc trưng cho sự nhanh, chậm của phản ứng.", "b) Tốc độ phản ứng xác định bằng sự thay đổi lượng chất trong một đơn vị thời gian.", "c) Nhiệt độ càng cao thì tốc độ càng nhanh.", "d) Áp suất không ảnh hưởng đến phản ứng trong dung dịch."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "points": 1, "q": "Xét các phát biểu về các yếu tố ảnh hưởng đến tốc độ phản ứng:", "statements": ["a) Chất xúc tác làm tăng tốc độ phản ứng và không bị tiêu hao sau phản ứng.", "b) Giảm nồng độ chất tham gia làm tốc độ phản ứng tăng.", "c) Tăng áp suất của hệ có chất khí làm tốc độ phản ứng tăng.", "d) Nhiệt độ càng cao thì tốc độ phản ứng càng lớn."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: giảm nồng độ làm tốc độ giảm. c) Đúng. d) Đúng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Nồng độ một sản phẩm tăng 0,9 mol/L trong 300 giây. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,003", "explain": "v = 0,9/300 = 0,003 mol/(L·s)."}, {"answer": "0,0025", "explain": "Độ biến thiên nồng độ A: $\\Delta C_A = 1{,}0 - 0{,}4 = 0{,}6$ mol/L. Tốc độ theo A: $v_A = 0{,}6/120 = 0{,}005$ mol/(L·s). Theo tỉ lệ hệ số phương trình, $v_B = v_A/2 = 0{,}0025$ mol/(L·s).", "level": "VDC", "points": 0.5, "q": "Cho phản ứng $2A \\to B$. Nồng độ của A giảm từ 1,0 mol/L xuống 0,4 mol/L trong 120 giây. Tính tốc độ trung bình của phản ứng tính theo sự tạo thành B (mol/(L·s)).", "type": "short"}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Tốc độ phản ứng là đại lượng đặc trưng cho", "options": ["A. sự nhanh, chậm của phản ứng hóa học.", "B. sự thay đổi nhiệt độ.", "C. sự thay đổi áp suất.", "D. sự thay đổi màu sắc."], "answer": "A", "explain": "Định nghĩa tốc độ phản ứng.", "points": 0.25}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Theo quy tắc Van't Hoff, khi giảm nhiệt độ đi 10 độ C thì tốc độ phản ứng thường", "options": ["A. giảm từ 2 đến 4 lần.", "B. tăng gấp đôi.", "C. không đổi.", "D. bằng 0."], "answer": "A", "explain": "Ngược với khi tăng nhiệt độ: tốc độ giảm 2–4 lần."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Để tăng tốc độ phản ứng giữa chất rắn và dung dịch, người ta thường", "options": ["A. nghiền nhỏ chất rắn.", "B. để nguyên khối chất rắn lớn.", "C. giảm nhiệt độ.", "D. pha loãng dung dịch."], "answer": "A", "explain": "Nghiền nhỏ làm tăng diện tích tiếp xúc, tăng số va chạm hiệu quả."}, {"answer": "A", "explain": "Tốc độ = độ giảm khối lượng / thời gian = 5,0/100 = 0,05 g/s.", "level": "TH", "options": ["A. 0,05 g/s.", "B. 0,5 g/s.", "C. 0,005 g/s.", "D. 5,0 g/s."], "points": 0.25, "q": "Trong phản ứng phân hủy $CaCO_3$, khối lượng $CaCO_3$ giảm 5,0 g trong 100 giây. Tốc độ trung bình của phản ứng tính theo sự giảm khối lượng $CaCO_3$ là", "type": "mcq"}, {"answer": "A", "explain": "$MnO_2$ là chất xúc tác cho phản ứng phân hủy $H_2O_2$ thành $H_2O$ và $O_2$, làm giảm năng lượng hoạt hóa nên khí $O_2$ thoát ra nhanh hơn.", "level": "TH", "options": ["A. $MnO_2$ là chất xúc tác làm tăng tốc độ phân hủy $H_2O_2$.", "B. $MnO_2$ làm tăng nồng độ của $H_2O_2$.", "C. $MnO_2$ làm tăng nhiệt độ của dung dịch.", "D. $MnO_2$ làm tăng áp suất của hệ."], "points": 0.25, "q": "Khi cho thêm $MnO_2$ vào dung dịch $H_2O_2$, tốc độ thoát khí $O_2$ tăng lên vì", "type": "mcq"}, {"answer": "A", "explain": "Giảm $20^\\circ C$ tức $n = 2$ khoảng $10^\\circ C$, tốc độ giảm $\\gamma^n = 2^2 = 4$ lần.", "level": "VDC", "options": ["A. giảm 4 lần.", "B. giảm 2 lần.", "C. tăng 4 lần.", "D. không thay đổi."], "points": 0.25, "q": "Một phản ứng có hệ số nhiệt độ Van't Hoff $\\gamma = 2$. Khi giảm nhiệt độ từ $50^\\circ C$ xuống $30^\\circ C$ thì tốc độ phản ứng", "type": "mcq"}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu ôn tập:", "statements": ["a) $v = -\\Delta C_{cđ}/\\Delta t = +\\Delta C_{sp}/\\Delta t$.", "b) Tốc độ phản ứng luôn dương.", "c) $\\gamma$ thường từ 2 đến 4.", "d) Chất xúc tác bị tiêu hao sau phản ứng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $0{,}50 - 0{,}30 = 0{,}20$ mol/L. b) Đúng: $v = 0{,}20/200 = 0{,}001$ mol/(L·s). c) Sai: thời gian giảm một nửa thì tốc độ tăng gấp đôi. d) Đúng.", "level": "VD", "points": 1, "q": "Nồng độ $HI$ giảm từ 0,50 mol/L xuống 0,30 mol/L trong 200 giây. Xét các phát biểu:", "statements": ["a) Độ biến thiên nồng độ $HI$ là 0,20 mol/L.", "b) Tốc độ trung bình của phản ứng là 0,001 mol/(L·s).", "c) Nếu thời gian phản ứng giảm một nửa thì tốc độ phản ứng cũng giảm một nửa.", "d) Dấu trừ trong công thức tính theo nồng độ chất đầu giúp tốc độ luôn có giá trị dương."], "type": "truefalse"}, {"type": "short", "level": "VD", "points": 0.5, "q": "Nồng độ một chất đầu giảm 0,45 mol/L trong 150 giây. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,003", "explain": "v = 0,45/150 = 0,003 mol/(L·s)."}, {"type": "short", "level": "VDC", "q": "Hệ số nhiệt độ $\\gamma = 2$. Khi tăng nhiệt độ từ $10^\\circ C$ lên $60^\\circ C$ thì tốc độ phản ứng tăng lên bao nhiêu lần?", "answer": "32", "explain": "Tăng $50^\\circ C$ tức $n = 5$: tốc độ tăng $2^5 = 32$ lần.", "points": 0.5}]}]}</script>
