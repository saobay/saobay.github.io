": "VDC", "q": "Tốc độ phản ứng ở $20^\\circ C$ là 0,02 mol/(L·s), hệ số nhiệt độ Van't Hoff $\\gamma = 3$. Khi tăng nhiệt độ lên $50^\\circ C$, tốc độ phản ứng là", "options": ["A. 0,06 mol/(L·s).", "B. 0,18 mol/(L·s).", "C. 0,54 mol/(L·s).", "D. 1,62 mol/(L·s)."], "answer": "C", "explain": "Tăng $30^\\circ C$ tức $n = 3$: $v_{50} = 3^3 \\times 0{,}02 = 27 \\times 0{,}02 = 0{,}54$ mol/(L·s).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu sau về tốc độ phản ứng:", "statements": ["a) Tốc độ phản ứng đặc trưng cho sự nhanh, chậm của phản ứng hóa học.", "b) Tốc độ phản ứng được xác định bằng sự thay đổi lượng chất trong một đơn vị thời gian.", "c) Lượng chất có thể biểu diễn bằng số mol, nồng độ mol, khối lượng hoặc thể tích.", "d) Tốc độ phản ứng có thể có giá trị âm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nhờ dấu trừ/cộng trong công thức mà tốc độ luôn có giá trị dương.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về các yếu tố ảnh hưởng đến tốc độ phản ứng:", "statements": ["a) Nồng độ chất phản ứng tăng thì tốc độ phản ứng tăng.", "b) Nhiệt độ tăng thì tốc độ phản ứng tăng.", "c) Chất xúc tác làm tăng tốc độ phản ứng và bị tiêu hao sau phản ứng.", "d) Diện tích bề mặt tiếp xúc càng lớn thì tốc độ phản ứng càng nhanh."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: chất xúc tác không bị tiêu hao trong phản ứng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nồng độ của một chất đầu giảm từ 0,6 mol/L xuống 0,3 mol/L trong 100 giây. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,003", "explain": "$v = (0{,}6 - 0{,}3)/100 = 0{,}003$ mol/(L·s).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tốc độ phản ứng ở $30^\\circ C$ là 0,01 mol/(L·s), hệ số nhiệt độ $\\gamma = 2$. Tính tốc độ phản ứng (mol/(L·s), làm tròn đến 2 chữ số thập phân) khi tăng nhiệt độ lên $60^\\c ợc sinh ra.", "D. năng lượng hoạt hóa giảm."], "answer": "B", "explain": "Tăng áp suất (nén khí) làm tăng nồng độ các chất khí, số va chạm hiệu quả tăng nên tốc độ tăng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hệ số nhiệt độ $\\gamma = 2$. Muốn tốc độ phản ứng tăng lên 8 lần thì cần tăng nhiệt độ thêm", "options": ["A. $10^\\circ C$.", "B. $20^\\circ C$.", "C. $30^\\circ C$.", "D. $40^\\circ C$."], "answer": "C", "explain": "$2^n = 8 \\Rightarrow n = 3$, tức tăng $3 \\times 10 = 30^\\circ C$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về chất xúc tác:", "statements": ["a) Chất xúc tác làm tăng tốc độ phản ứng.", "b) Chất xúc tác bị tiêu hao hết sau phản ứng.", "c) Chất xúc tác làm giảm năng lượng hoạt hóa của phản ứng.", "d) $MnO_2$ là chất xúc tác trong phản ứng phân hủy $H_2O_2$."], "answer": ["T", "F", "T", "T"], "explain": "a), c), d) Đúng. b) Sai: chất xúc tác không bị tiêu hao.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Hai thí nghiệm: (1) Zn + $HCl$ 1M; (2) Zn + $HCl$ 3M (các điều kiện khác như nhau). Xét các phát biểu:", "statements": ["a) Thí nghiệm (2) thoát khí $H_2$ mạnh hơn.", "b) Nồng độ acid càng lớn thì tốc độ phản ứng càng nhanh.", "c) Nếu thay Zn miếng bằng Zn bột thì tốc độ còn tăng thêm.", "d) Nhiệt độ của hai thí nghiệm không ảnh hưởng đến kết quả so sánh."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nhiệt độ ảnh hưởng mạnh đến tốc độ nên khi so sánh phải giữ nhiệt độ như nhau.", "points": 1}, {"type": "short", "level": "VD", "q": "Tốc độ phản ứng ở $50^\\circ C$ là 0,04 mol/(L·s), hệ số nhiệt độ $\\gamma = 2$. Tính tốc độ phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân) ở $20^\\circ C$.", "answer": "0,005", "explain": "Giảm $30^\\circ C$ tức $n = 3$: $v_{20} = 0{,}04 / 2^3 = 0{,}04/8 = 0{,}005$ mol/(L·s).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nồng độ của một sản phẩm tăng thêm 0,12 mol/L trong 2 phút. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,001", "explain": "$v = 0{,}12/120 = 0{,}001$ mol/(L·s).", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Tốc độ phản ứng luôn có giá trị", "options": ["A. âm.", "B. dương.", "C. bằng 0.", "D. âm hoặc dương tùy phản ứng."], "answer": "B", "explain": "Nhờ dấu trừ (với chất đầu) và dấu cộng (với sản phẩm) trong công thức mà tốc độ luôn dương.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi tăng nhiệt độ thêm $10^\\circ C$, tốc độ phản ứng thường tăng", "options": ["A. đúng 10 lần.", "B. từ 2 đến 4 lần.", "C. không đáng kể.", "D. giảm một nửa."], "answer": "B", "explain": "Quy tắc Van't Hoff.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biện pháp nào sau đây làm chậm các phản ứng phân hủy thực phẩm (phản ứng có hại)?", "options": ["A. Để thực phẩm ở nơi nóng.", "B. Bảo quản thực phẩm trong tủ lạnh.", "C. Phơi thực phẩm ngoài nắng.", "D. Đun nóng thực phẩm liên tục."], "answer": "B", "explain": "Nhiệt độ thấp làm chậm các phản ứng phân hủy nên thực phẩm lâu hỏng hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng phân hủy $H_2O_2$ có thêm bột $MnO_2$, vai trò của $MnO_2$ là", "options": ["A. chất phản ứng, bị tiêu hao hết.", "B. chất xúc tác, không bị tiêu hao.", "C. chất sản phẩm.", "D. chất làm giảm tốc độ phản ứng."], "answer": "B", "explain": "$MnO_2$ làm tăng tốc độ phân hủy $H_2O_2$ nhưng khối lượng không đổi sau phản ứng nên là chất xúc tác.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nén hỗn hợp khí tham gia phản ứng (tăng áp suất) thì tốc độ phản ứng", "options": ["A. tăng.", "B. giảm.", "C. không đổi.", "D. tăng rồi giảm."], "answer": "A", "explain": "Tăng áp suất làm tăng nồng độ các chất khí, số va chạm hiệu quả tăng nên tốc độ tăng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tốc độ phản ứng ở nhiệt độ $T$ là 0,5 mol/(L·min), hệ số nhiệt độ $\\gamma = 4$. Khi tăng nhiệt độ thêm $20^\\circ C$, tốc độ phản ứng là", "options": ["A. 2,0 mol/(L·min).", "B. 4,0 mol/(L·min).", "C. 8,0 mol/(L·min).", "D. 16,0 mol/(L·min)."], "answer": "C", "explain": "Tăng $20^\\circ C$ tức $n = 2$: $v = 4^2 \\times 0{,}5 = 16 \\times 0{,}5 = 8{,}0$ mol/(L·min).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Tốc độ phản ứng được tính bằng độ thay đổi nồng độ chia cho thời gian.", "b) Với chất đầu, công thức tính tốc độ có dấu trừ.", "c) Với sản phẩm, công thức tính tốc độ có dấu cộng.", "d) Đơn vị thời gian chỉ có thể là giây."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đơn vị thời gian có thể là giây, phút, giờ, ngày...", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho $v_{20} = 0{,}01$ mol/(L·s) và $\\gamma = 2$. Xét các phát biểu:", "statements": ["a) $v_{30} = 0{,}02$ mol/(L·s).", "b) $v_{40} = 0{,}04$ mol/(L·s).", "c) $v_{50} = 0{,}08$ mol/(L·s).", "d) $v_{10} = 0{,}02$ mol/(L·s)."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $2 \\times 0{,}01$. b) Đúng: $4 \\times 0{,}01$. c) Đúng: $8 \\times 0{,}01$. d) Sai: $v_{10} = 0{,}01/2 = 0{,}005$ mol/(L·s).", "points": 1}, {"type": "short", "level": "VD", "q": "Nồng độ của một chất đầu giảm 0,9 mol/L trong 3 phút. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,005", "explain": "$v = 0{,}9/180 = 0{,}005$ mol/(L·s).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hệ số nhiệt độ $\\gamma = 2$. Muốn tốc độ phản ứng tăng lên 16 lần thì cần tăng nhiệt độ thêm bao nhiêu độ C?", "answer": "40", "explain": "$2^n = 16 \\Rightarrow n = 4$, tức tăng $4 \\times 10 = 40^\\circ C$.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Lượng chất trong định nghĩa tốc độ phản ứng có thể được biểu diễn bằng", "options": ["A. chỉ số mol.", "B. chỉ nồng độ mol.", "C. số mol, nồng độ mol, khối lượng hoặc thể tích.", "D. chỉ khối lượng."], "answer": "C", "explain": "Lượng chất có thể biểu diễn bằng số mol, nồng độ mol, khối lượng hoặc thể tích.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chất xúc tác làm tăng tốc độ phản ứng bằng cách", "options": ["A. làm tăng nồng độ chất phản ứng.", "B. làm giảm năng lượng hoạt hóa của phản ứng.", "C. làm tăng nhiệt độ của hệ.", "D. làm tăng áp suất của hệ."], "answer": "B", "explain": "Chất xúc tác tạo con đường phản ứng mới có năng lượng hoạt hóa thấp hơn nên phản ứng xảy ra dễ dàng hơn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Than tổ ong có nhiều lỗ nhỏ nên cháy tốt hơn than cục vì", "options": ["A. tăng diện tích tiếp xúc với không khí.", "B. tăng nhiệt độ ngọn lửa.", "C. có chất xúc tác.", "D. tăng áp suất."], "answer": "A", "explain": "Nhiều lỗ làm tăng diện tích bề mặt tiếp xúc với oxygen nên than cháy nhanh và mạnh hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho Zn vào hai cốc đựng $HCl$: cốc (1) $HCl$ 1M, cốc (2) $HCl$ 3M. Kết luận đúng là", "options": ["A. cốc (1) thoát khí nhanh hơn.", "B. cốc (2) thoát khí nhanh hơn vì nồng độ acid lớn hơn.", "C. hai cốc thoát khí như nhau.", "D. cốc (1) không xảy ra phản ứng."], "answer": "B", "explain": "Nồng độ $HCl$ càng lớn thì tốc độ phản ứng của Zn với acid càng nhanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sau khi phản ứng kết thúc, chất xúc tác", "options": ["A. bị tiêu hao hết.", "B. khối lượng và tính chất hóa học không đổi.", "C. biến thành chất khác.", "D. tăng khối lượng."], "answer": "B", "explain": "Chất xúc tác không bị tiêu hao trong phản ứng: khối lượng và tính chất hóa học giữ nguyên.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tốc độ phản ứng ở $40^\\circ C$ là 0,32 mol/(L·s), hệ số nhiệt độ $\\gamma = 2$. Tốc độ phản ứng ở $20^\\circ C$ là", "options": ["A. 0,08 mol/(L·s).", "B. 0,16 mol/(L·s).", "C. 0,64 mol/(L·s).", "D. 1,28 mol/(L·s)."], "answer": "A", "explain": "Giảm $20^\\circ C$ tức $n = 2$: $v_{20} = 0{,}32/2^2 = 0{,}32/4 = 0{,}08$ mol/(L·s).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về các yếu tố ảnh hưởng đến tốc độ phản ứng:", "statements": ["a) Tăng nồng độ chất phản ứng làm tăng tốc độ phản ứng.", "b) Tăng nhiệt độ làm tăng tốc độ phản ứng.", "c) Nghiền nhỏ chất rắn làm tăng tốc độ phản ứng.", "d) Giảm áp suất của hệ khí làm tăng tốc độ phản ứng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: giảm áp suất làm giảm nồng độ chất khí nên tốc độ giảm.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Thí nghiệm Zn với dung dịch $HCl$. Xét các phát biểu:", "statements": ["a) Dùng $HCl$ đặc hơn thì bọt khí thoát ra mạnh hơn.", "b) Dùng Zn bột thì bọt khí thoát ra mạnh hơn dùng Zn miếng.", "c) Đun nóng thì bọt khí thoát ra mạnh hơn.", "d) Thêm $MnO_2$ vào thì bọt khí thoát ra mạnh hơn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: nồng độ, diện tích bề mặt, nhiệt độ đều ảnh hưởng. d) Sai: $MnO_2$ không phải chất xúc tác của phản ứng Zn với $HCl$.", "points": 1}, {"type": "short", "level": "VD", "q": "Nồng độ của một chất đầu giảm 0,25 mol/L trong 50 giây. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,005", "explain": "$v = 0{,}25/50 = 0{,}005$ mol/(L·s).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hệ số nhiệt độ $\\gamma = 3$. Khi tăng nhiệt độ thêm $30^\\circ C$ thì tốc độ phản ứng tăng lên bao nhiêu lần?", "answer": "27", "explain": "Tăng $30^\\circ C$ tức $n = 3$: tốc độ tăng $3^3 = 27$ lần.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Tốc độ phản ứng là đại lượng đặc trưng cho", "options": ["A. sự nhanh, chậm của phản ứng hóa học.", "B. mức độ tỏa nhiệt của phản ứng.", "C. hiệu suất của phản ứng.", "D. sự cân bằng của phản ứng."], "answer": "A", "explain": "Định nghĩa tốc độ phản ứng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đơn vị thời gian trong công thức tính tốc độ phản ứng có thể là", "options": ["A. chỉ giây.", "B. giây, phút, giờ, ngày...", "C. chỉ phút.", "D. chỉ giờ."], "answer": "B", "explain": "Đơn vị thời gian có thể là giây (s), phút (min), giờ (h), ngày (d)...", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi tăng diện tích bề mặt tiếp xúc của chất rắn thì tốc độ phản ứng", "options": ["A. tăng.", "B. giảm.", "C. không đổi.", "D. tăng rồi giảm."], "answer": "A", "explain": "Diện tích tiếp xúc càng lớn, số va chạm hiệu quả càng nhiều nên tốc độ càng nhanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao bảo quản thực phẩm trong tủ lạnh giúp thực phẩm lâu hỏng?", "options": ["A. Vì nhiệt độ thấp làm chậm các phản ứng phân hủy thực phẩm.", "B. Vì tủ lạnh diệt hết vi khuẩn.", "C. Vì nhiệt độ thấp làm tăng tốc độ phản ứng.", "D. Vì trong tủ lạnh không có không khí."], "answer": "A", "explain": "Nhiệt độ thấp làm giảm tốc độ các phản ứng sinh hóa gây phân hủy thực phẩm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đối với phản ứng có chất khí tham gia, tăng áp suất làm tốc độ phản ứng tăng vì", "options": ["A. làm tăng nồng độ các chất khí.", "B. làm giảm năng lượng hoạt hóa.", "C. sinh ra chất xúc tác.", "D. làm tăng nhiệt độ."], "answer": "A", "explain": "Tăng áp suất tương đương tăng nồng độ chất khí, số va chạm hiệu quả tăng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tốc độ phản ứng ở $25^\\circ C$ là 0,02 mol/(L·s), $\\gamma = 2$. Tốc độ phản ứng ở $55^\\circ C$ là", "options": ["A. 0,04 mol/(L·s).", "B. 0,08 mol/(L·s).", "C. 0,16 mol/(L·s).", "D. 0,32 mol/(L·s)."], "answer": "C", "explain": "Tăng $30^\\circ C$ tức $n = 3$: $v = 2^3 \\times 0{,}02 = 0{,}16$ mol/(L·s).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về chất xúc tác:", "statements": ["a) Chất xúc tác làm tăng tốc độ phản ứng.", "b) Chất xúc tác tham gia vào phản ứng nhưng được tái tạo lại sau phản ứng.", "c) Men làm bánh mì là một loại chất xúc tác sinh học.", "d) Chất xúc tác làm tăng nhiệt lượng tỏa ra của phản ứng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chất xúc tác không làm thay đổi nhiệt phản ứng ($\\Delta_rH$), chỉ làm phản ứng xảy ra nhanh hơn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về ảnh hưởng của nhiệt độ:", "statements": ["a) Nhiệt độ tăng làm các tiểu phân chuyển động nhanh hơn.", "b) Nhiệt độ tăng làm tăng số va chạm hiệu quả.", "c) Theo Van't Hoff, tăng $10^\\circ C$ tốc độ tăng 2–4 lần.", "d) Giảm nhiệt độ làm tăng tốc độ phản ứng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: giảm nhiệt độ làm giảm tốc độ phản ứng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nồng độ của một sản phẩm tăng thêm 0,06 mol/L trong 30 giây. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,002", "explain": "$v = 0{,}06/30 = 0{,}002$ mol/(L·s).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hệ số nhiệt độ $\\gamma = 4$. Muốn tốc độ phản ứng tăng lên 64 lần thì cần tăng nhiệt độ thêm bao nhiêu độ C?", "answer": "30", "explain": "$4^n = 64 \\Rightarrow n = 3$, tức tăng $3 \\times 10 = 30^\\circ C$.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Khi tăng nồng độ chất phản ứng thì tốc độ phản ứng", "options": ["A. tăng.", "B. giảm.", "C. không đổi.", "D. bằng 0."], "answer": "A", "explain": "Nồng độ tăng làm tăng số va chạm hiệu quả nên tốc độ tăng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi tăng nhiệt độ, các tiểu phân trong hệ phản ứng", "options": ["A. chuyển động chậm lại.", "B. chuyển động nhanh hơn, va chạm hiệu quả nhiều hơn.", "C. ngừng chuyển động.", "D. kết hợp thành chất mới ngay."], "answer": "B", "explain": "Nhiệt độ tăng làm tăng động năng, số va chạm hiệu quả tăng nên tốc độ tăng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ví dụ nào sau đây về chất xúc tác trong đời sống là đúng?", "options": ["A. Men dùng để làm bánh mì.", "B. Muối dùng để ướp thực phẩm.", "C. Đường dùng để pha nước.", "D. Đá lạnh dùng để ướp lạnh."], "answer": "A", "explain": "Men (enzyme) là chất xúc tác sinh học giúp quá trình lên men xảy ra nhanh hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cùng cho vào hai cốc $HCl$ cùng nồng độ: cốc (1) 1 gam Zn bột, cốc (2) 1 gam Zn miếng. Hiện tượng đúng là", "options": ["A. cốc (2) sủi bọt mạnh hơn.", "B. cốc (1) sủi bọt mạnh hơn vì diện tích tiếp xúc lớn hơn.", "C. hai cốc sủi bọt như nhau.", "D. cả hai cốc đều không có hiện tượng."], "answer": "B", "explain": "Zn bột có diện tích bề mặt tiếp xúc với acid lớn hơn nên phản ứng nhanh hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Công thức Van't Hoff biểu diễn sự phụ thuộc của tốc độ phản ứng vào nhiệt độ là", "options": ["A. $v_{T+10n} = \\gamma^n \\cdot v_T$.", "B. $v_{T+10n} = \\gamma \\cdot n \\cdot v_T$.", "C. $v_{T+10n} = v_T / \\gamma^n$.", "D. $v_{T+10n} = v_T + n\\gamma$."], "answer": "A", "explain": "Đúng công thức: $v_{T+10n} = \\gamma^n \\cdot v_T$ với $\\gamma$ là hệ số nhiệt độ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tốc độ phản ứng ở $10^\\circ C$ là 0,01 mol/(L·s), $\\gamma = 3$. Tốc độ phản ứng ở $40^\\circ C$ là", "options": ["A. 0,03 mol/(L·s).", "B. 0,09 mol/(L·s).", "C. 0,27 mol/(L·s).", "D. 0,81 mol/(L·s)."], "answer": "C", "explain": "Tăng $30^\\circ C$ tức $n = 3$: $v = 3^3 \\times 0{,}01 = 27 \\times 0{,}01 = 0{,}27$ mol/(L·s).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Tốc độ phản ứng đặc trưng cho sự nhanh, chậm của phản ứng.", "b) Tốc độ phản ứng luôn có giá trị dương.", "c) Đơn vị của tốc độ có thể là mol/(L·min).", "d) Tốc độ phản ứng không phụ thuộc vào bản chất của chất phản ứng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: các phản ứng khác nhau có tốc độ khác nhau (bản chất chất phản ứng ảnh hưởng).", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Thí nghiệm phân hủy $H_2O_2$: cốc (1) chỉ có $H_2O_2$, cốc (2) thêm một ít bột $MnO_2$. Xét các phát biểu:", "statements": ["a) Cốc (2) thoát khí $O_2$ mạnh hơn.", "b) $MnO_2$ là chất xúc tác.", "c) Sau phản ứng, khối lượng $MnO_2$ không đổi.", "d) $MnO_2$ làm tăng nhiệt lượng tỏa ra của phản ứng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chất xúc tác không làm thay đổi nhiệt phản ứng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nồng độ của một chất đầu giảm 0,15 mol/L trong 75 giây. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,002", "explain": "$v = 0{,}15/75 = 0{,}002$ mol/(L·s).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nồng độ của một chất đầu giảm từ 1,2 mol/L xuống 0,6 mol/L trong 2 phút. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,005", "explain": "$v = (1{,}2 - 0{,}6)/120 = 0{,}6/120 = 0{,}005$ mol/(L·s).", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Tốc độ phản ứng được xác định như thế nào?", "options": ["A. Chỉ bằng sự thay đổi lượng chất đầu.", "B. Chỉ bằng sự thay đổi lượng sản phẩm.", "C. Bằng sự thay đổi lượng chất đầu hoặc chất sản phẩm trong một đơn vị thời gian.", "D. Bằng tổng khối lượng các chất."], "answer": "C", "explain": "Đúng định nghĩa tốc độ phản ứng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hệ số nhiệt độ Van't Hoff $\\gamma$ thường có giá trị trong khoảng", "options": ["A. 1 đến 2.", "B. 2 đến 4.", "C. 5 đến 10.", "D. 10 đến 20."], "answer": "B", "explain": "Theo quy tắc Van't Hoff, $\\gamma$ thường có giá trị từ 2 đến 4.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Củi chẻ nhỏ cháy nhanh hơn khúc gỗ to vì", "options": ["A. củi nhỏ có nhiệt độ cao hơn.", "B. củi chẻ nhỏ có diện tích tiếp xúc với không khí lớn hơn.", "C. củi nhỏ có chất xúc tác.", "D. khúc gỗ to có nhiều nước hơn."], "answer": "B", "explain": "Diện tích bề mặt tiếp xúc càng lớn thì tốc độ phản ứng cháy càng nhanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nồng độ của một sản phẩm tăng thêm 0,4 mol/L trong 80 giây. Tốc độ trung bình của phản ứng là", "options": ["A. 0,005 mol/(L·s).", "B. 0,002 mol/(L·s).", "C. 0,008 mol/(L·s).", "D. 0,010 mol/(L·s)."], "answer": "A", "explain": "$v = 0{,}4/80 = 0{,}005$ mol/(L·s).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây về chất xúc tác là đúng?", "options": ["A. Chất xúc tác bị biến đổi hoàn toàn sau phản ứng.", "B. Chất xúc tác làm giảm năng lượng hoạt hóa, tạo con đường phản ứng mới dễ xảy ra hơn.", "C. Chất xúc tác làm tăng nhiệt phản ứng.", "D. Mọi phản ứng đều cần chất xúc tác."], "answer": "B", "explain": "Chất xúc tác giảm năng lượng hoạt hóa; không bị tiêu hao và không làm thay đổi nhiệt phản ứng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hệ số nhiệt độ $\\gamma = 3$. Muốn tốc độ phản ứng tăng lên 9 lần thì cần tăng nhiệt độ thêm", "options": ["A. $10^\\circ C$.", "B. $20^\\circ C$.", "C. $30^\\circ C$.", "D. $90^\\circ C$."], "answer": "B", "explain": "$3^n = 9 \\Rightarrow n = 2$, tức tăng $2 \\times 10 = 20^\\circ C$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về các yếu tố ảnh hưởng đến tốc độ phản ứng:", "statements": ["a) Nồng độ tăng thì tốc độ tăng.", "b) Nhiệt độ tăng thì tốc độ tăng.", "c) Có chất xúc tác thì tốc độ tăng.", "d) Diện tích bề mặt tăng thì tốc độ giảm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: diện tích bề mặt tăng thì tốc độ tăng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho $v_{10} = 0{,}02$ mol/(L·s), $\\gamma = 2$. Xét các phát biểu:", "statements": ["a) $v_{20} = 0{,}04$ mol/(L·s).", "b) $v_{30} = 0{,}08$ mol/(L·s).", "c) $v_{40} = 0{,}16$ mol/(L·s).", "d) $v_{0} = 0{,}04$ mol/(L·s)."], "answer": ["T", "T", "T", "F"], "explain": "a) $2 \\times 0{,}02$. b) $4 \\times 0{,}02$. c) $8 \\times 0{,}02$. d) Sai: $v_0 = 0{,}02/2 = 0{,}01$ mol/(L·s).", "points": 1}, {"type": "short", "level": "VD", "q": "Tốc độ phản ứng ở $25^\\circ C$ là 0,03 mol/(L·s), $\\gamma = 2$. Tính tốc độ phản ứng (mol/(L·s), làm tròn đến 2 chữ số thập phân) ở $45^\\circ C$.", "answer": "0,12", "explain": "Tăng $20^\\circ C$ tức $n = 2$: $v = 2^2 \\times 0{,}03 = 0{,}12$ mol/(L·s).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nồng độ của một chất đầu giảm 0,48 mol/L trong 4 phút. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,002", "explain": "$v = 0{,}48/240 = 0{,}002$ mol/(L·s).", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Các phản ứng khác nhau thì", "options": ["A. tốc độ phản ứng khác nhau.", "B. tốc độ phản ứng giống nhau.", "C. tốc độ phản ứng luôn bằng 0.", "D. không so sánh được."], "answer": "A", "explain": "Các phản ứng khác nhau (bản chất khác nhau) thì tốc độ phản ứng khác nhau: có phản ứng xảy ra tức thời, có phản ứng mất hàng triệu năm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi tăng nồng độ chất phản ứng, số va chạm hiệu quả giữa các tiểu phân", "options": ["A. tăng.", "B. giảm.", "C. không đổi.", "D. bằng 0."], "answer": "A", "explain": "Nồng độ tăng làm tăng mật độ tiểu phân, số va chạm hiệu quả tăng nên tốc độ tăng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Yếu tố áp suất ảnh hưởng đến tốc độ của", "options": ["A. mọi phản ứng.", "B. phản ứng có chất khí tham gia.", "C. phản ứng trong dung dịch.", "D. phản ứng của chất rắn."], "answer": "B", "explain": "Áp suất chỉ ảnh hưởng đến phản ứng có chất khí tham gia (làm thay đổi nồng độ chất khí).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nén hỗn hợp khí phản ứng (tăng áp suất) làm tăng tốc độ phản ứng?", "options": ["A. Vì làm tăng nồng độ các chất khí.", "B. Vì làm tăng nhiệt độ.", "C. Vì sinh ra chất xúc tác.", "D. Vì làm giảm thể tích bình."], "answer": "A", "explain": "Tăng áp suất tương đương tăng nồng độ chất khí, số va chạm hiệu quả tăng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thí nghiệm cho Zn vào $HCl$ 1M và $HCl$ 3M nhằm nghiên cứu ảnh hưởng của yếu tố nào?", "options": ["A. Nhiệt độ.", "B. Nồng độ.", "C. Chất xúc tác.", "D. Diện tích bề mặt."], "answer": "B", "explain": "Hai thí nghiệm chỉ khác nhau về nồng độ $HCl$ nên nghiên cứu ảnh hưởng của nồng độ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tốc độ phản ứng ở $20^\\circ C$ là 0,05 mol/(L·s), $\\gamma = 2$. Khi giảm nhiệt độ xuống $10^\\circ C$, tốc độ phản ứng là", "options": ["A. 0,10 mol/(L·s).", "B. 0,025 mol/(L·s).", "C. 0,05 mol/(L·s).", "D. 0,0125 mol/(L·s)."], "answer": "B", "explain": "Giảm $10^\\circ C$ tức $n = 1$: $v_{10} = 0{,}05/2 = 0{,}025$ mol/(L·s).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Tốc độ phản ứng = độ thay đổi lượng chất / thời gian.", "b) Tốc độ phản ứng luôn dương.", "c) Có thể dùng khối lượng để biểu diễn lượng chất.", "d) Chất xúc tác làm thay đổi nhiệt phản ứng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chất xúc tác không làm thay đổi $\\Delta_rH$.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về chất xúc tác:", "statements": ["a) Chất xúc tác làm tăng tốc độ phản ứng.", "b) Chất xúc tác giảm năng lượng hoạt hóa.", "c) Sau phản ứng, lượng chất xúc tác không đổi.", "d) Không có chất xúc tác thì phản ứng không xảy ra."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nhiều phản ứng vẫn xảy ra mà không cần xúc tác, chỉ chậm hơn.", "points": 1}, {"type": "short", "level": "VD", "q": "Nồng độ của một sản phẩm tăng thêm 0,09 mol/L trong 45 giây. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,002", "explain": "$v = 0{,}09/45 = 0{,}002$ mol/(L·s).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hệ số nhiệt độ $\\gamma = 2$. Khi tăng nhiệt độ từ $20^\\circ C$ lên $70^\\circ C$ thì tốc độ phản ứng tăng lên bao nhiêu lần?", "answer": "32", "explain": "Tăng $50^\\circ C$ tức $n = 5$: tốc độ tăng $2^5 = 32$ lần.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Khi dùng nồng độ mol, đơn vị của tốc độ phản ứng là", "options": ["A. mol/L.", "B. mol/(L·s).", "C. mol.", "D. g/L."], "answer": "B", "explain": "Tốc độ = độ thay đổi nồng độ / thời gian nên đơn vị là mol/(L·s).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong công thức $v = -\\Delta C_{cđ}/\\Delta t$, dấu trừ được dùng để", "options": ["A. làm tốc độ luôn có giá trị dương.", "B. làm tốc độ có giá trị âm.", "C. biểu thị phản ứng thu nhiệt.", "D. biểu thị phản ứng tỏa nhiệt."], "answer": "A", "explain": "Nồng độ chất đầu giảm dần ($\\Delta C_{cđ} \\lt 0$) nên cần dấu trừ để tốc độ luôn dương.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Enzyme trong cơ thể sinh vật là", "options": ["A. chất xúc tác sinh học.", "B. chất phản ứng.", "C. chất sản phẩm.", "D. chất ức chế."], "answer": "A", "explain": "Enzyme là chất xúc tác sinh học, giúp các phản ứng trong cơ thể xảy ra nhanh hơn ở nhiệt độ thường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai cốc đựng $H_2O_2$: cốc (1) không thêm gì, cốc (2) thêm một ít bột $MnO_2$. Hiện tượng đúng là", "options": ["A. cốc (1) thoát khí mạnh hơn.", "B. cốc (2) thoát khí $O_2$ mạnh hơn vì $MnO_2$ là chất xúc tác.", "C. hai cốc thoát khí như nhau.", "D. cốc (2) không có hiện tượng."], "answer": "B", "explain": "$MnO_2$ xúc tác làm tăng tốc độ phân hủy $H_2O_2$ nên bọt khí $O_2$ thoát ra mạnh hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong công nghiệp, tổng hợp $NH_3$ được thực hiện ở áp suất cao một phần là để", "options": ["A. tăng tốc độ phản ứng.", "B. giảm nhiệt độ.", "C. tiết kiệm chất xúc tác.", "D. làm giảm tốc độ phản ứng."], "answer": "A", "explain": "Áp suất cao làm tăng nồng độ các chất khí, tăng số va chạm hiệu quả nên tốc độ phản ứng tăng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tốc độ phản ứng ở $30^\\circ C$ là 0,4 mol/(L·min), $\\gamma = 2$. Tốc độ phản ứng ở $0^\\circ C$ là", "options": ["A. 0,05 mol/(L·min).", "B. 0,10 mol/(L·min).", "C. 0,20 mol/(L·min).", "D. 0,80 mol/(L·min)."], "answer": "A", "explain": "Giảm $30^\\circ C$ tức $n = 3$: $v_0 = 0{,}4/2^3 = 0{,}4/8 = 0{,}05$ mol/(L·min).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Tốc độ phản ứng đặc trưng cho sự nhanh, chậm của phản ứng.", "b) Tốc độ phản ứng xác định bằng sự thay đổi lượng chất trong một đơn vị thời gian.", "c) Nhiệt độ càng cao thì tốc độ phản ứng càng nhanh.", "d) Áp suất không ảnh hưởng đến phản ứng trong dung dịch."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng: áp suất chỉ ảnh hưởng đáng kể đến phản ứng có chất khí.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về các yếu tố ảnh hưởng đến tốc độ phản ứng:", "statements": ["a) Tăng nồng độ: tốc độ tăng.", "b) Tăng nhiệt độ: tốc độ tăng.", "c) Thêm chất xúc tác: tốc độ tăng.", "d) Nghiền nhỏ chất rắn: tốc độ tăng."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nồng độ của một chất đầu giảm 1,0 mol/L trong 200 giây. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,005", "explain": "$v = 1{,}0/200 = 0{,}005$ mol/(L·s).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tốc độ phản ứng ở $30^\\circ C$ là 0,81 mol/(L·s), $\\gamma = 3$. Tính tốc độ phản ứng (mol/(L·s), làm tròn đến 2 chữ số thập phân) ở $10^\\circ C$.", "answer": "0,09", "explain": "Giảm $20^\\circ C$ tức $n = 2$: $v_{10} = 0{,}81/3^2 = 0{,}81/9 = 0{,}09$ mol/(L·s).", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Tốc độ phản ứng là đại lượng đặc trưng cho", "options": ["A. sự nhanh, chậm của phản ứng hóa học.", "B. sự thay đổi nhiệt độ của phản ứng.", "C. sự thay đổi áp suất của phản ứng.", "D. sự thay đổi màu sắc của phản ứng."], "answer": "A", "explain": "Định nghĩa tốc độ phản ứng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi tăng nhiệt độ thêm $10^\\circ C$ thì tốc độ phản ứng thường", "options": ["A. tăng từ 2 đến 4 lần.", "B. giảm một nửa.", "C. không đổi.", "D. tăng 10 lần."], "answer": "A", "explain": "Quy tắc Van't Hoff.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Diện tích bề mặt tiếp xúc của chất rắn càng lớn thì tốc độ phản ứng", "options": ["A. càng nhanh.", "B. càng chậm.", "C. không đổi.", "D. bằng 0."], "answer": "A", "explain": "Diện tích tiếp xúc lớn làm tăng số va chạm hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nồng độ $H_2O_2$ giảm từ 0,8 mol/L xuống 0,5 mol/L trong 150 giây. Tốc độ trung bình của phản ứng phân hủy $H_2O_2$ là", "options": ["A. 0,002 mol/(L·s).", "B. 0,003 mol/(L·s).", "C. 0,005 mol/(L·s).", "D. 0,008 mol/(L·s)."], "answer": "A", "explain": "$v = (0{,}8 - 0{,}5)/150 = 0{,}3/150 = 0{,}002$ mol/(L·s).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chất xúc tác làm tăng tốc độ phản ứng vì", "options": ["A. làm tăng nồng độ chất phản ứng.", "B. tạo con đường phản ứng mới có năng lượng hoạt hóa thấp hơn.", "C. làm tăng nhiệt độ của hệ.", "D. làm tăng áp suất của hệ."], "answer": "B", "explain": "Chất xúc tác giảm năng lượng hoạt hóa nên phản ứng xảy ra dễ dàng hơn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tốc độ phản ứng ở $20^\\circ C$ là 0,02 mol/(L·s), $\\gamma = 4$. Tốc độ phản ứng ở $40^\\circ C$ là", "options": ["A. 0,08 mol/(L·s).", "B. 0,16 mol/(L·s).", "C. 0,32 mol/(L·s).", "D. 0,64 mol/(L·s)."], "answer": "C", "explain": "Tăng $20^\\circ C$ tức $n = 2$: $v = 4^2 \\times 0{,}02 = 16 \\times 0{,}02 = 0{,}32$ mol/(L·s).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu ôn tập:", "statements": ["a) $v = -\\Delta C_{cđ}/\\Delta t = +\\Delta C_{sp}/\\Delta t$.", "b) Tốc độ phản ứng luôn có giá trị dương.", "c) $\\gamma$ thường có giá trị từ 2 đến 4.", "d) Chất xúc tác bị tiêu hao sau phản ứng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chất xúc tác không bị tiêu hao.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho $v_{20} = 0{,}05$ mol/(L·s), $\\gamma = 2$. Xét các phát biểu:", "statements": ["a) $v_{30} = 0{,}10$ mol/(L·s).", "b) $v_{40} = 0{,}20$ mol/(L·s).", "c) $v_{10} = 0{,}025$ mol/(L·s).", "d) $v_{50} = 0{,}30$ mol/(L·s)."], "answer": ["T", "T", "T", "F"], "explain": "a) $2 \\times 0{,}05$. b) $4 \\times 0{,}05$. c) $0{,}05/2$. d) Sai: $v_{50} = 8 \\times 0{,}05 = 0{,}40$ mol/(L·s).", "points": 1}, {"type": "short", "level": "VD", "q": "Nồng độ của một sản phẩm tăng thêm 0,21 mol/L trong 70 giây. Tính tốc độ trung bình của phản ứng (mol/(L·s), làm tròn đến 3 chữ số thập phân).", "answer": "0,003", "explain": "$v = 0{,}21/70 = 0{,}003$ mol/(L·s).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hệ số nhiệt độ $\\gamma = 3$. Muốn tốc độ phản ứng tăng lên 81 lần thì cần tăng nhiệt độ thêm bao nhiêu độ C?", "answer": "40", "explain": "$3^n = 81 \\Rightarrow n = 4$, tức tăng $4 \\times 10 = 40^\\circ C$.", "points": 0.5}]}]}
