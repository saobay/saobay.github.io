{,}98 - 0{,}82 = 3{,}16 \\ge 1{,}7$ nên liên kết K-F là liên kết ion.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong tinh thể $NaCl$, mỗi ion $Na^+$ được bao quanh bởi bao nhiêu ion $Cl^-$?", "options": ["A. 4.", "B. 6.", "C. 8.", "D. 12."], "answer": "B", "explain": "Trong mạng tinh thể NaCl, mỗi ion $Na^+$ được bao quanh bởi 6 ion $Cl^-$ và ngược lại (số phối trí bằng 6).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Liên kết ion là liên kết giữa cation và anion.", "b) $NaCl$ là hợp chất ion.", "c) $MgO$ là hợp chất ion.", "d) $H_2$ là hợp chất ion."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: bản chất của liên kết ion. b) Đúng: $Na^+$ và $Cl^-$. c) Đúng: $Mg^{2+}$ và $O^{2-}$. d) Sai: $H_2$ là đơn chất cộng hóa trị.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về tính chất của hợp chất ion:", "statements": ["a) Hợp chất ion có nhiệt độ nóng chảy cao.", "b) Hợp chất ion dẫn điện ở trạng thái rắn.", "c) Hợp chất ion dẫn điện khi nóng chảy.", "d) Hợp chất ion dẫn điện khi tan trong nước."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: liên kết ion bền vững. b) Sai: ở trạng thái rắn, các ion bị giữ chặt trong mạng tinh thể nên không dẫn điện. c) Đúng: khi nóng chảy, các ion chuyển động tự do. d) Đúng: khi tan trong nước, các ion chuyển động tự do.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết quá trình tạo thành cation $Na^+$ từ nguyên tử $Na$ (dạng text).", "answer": "Na thành Na+ + 1e", "explain": "Nguyên tử Na nhường 1 electron lớp ngoài cùng: Na thành $Na^+$ + 1e.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hiệu độ âm điện của liên kết $Mg-O$ là 2,13. Liên kết $Mg-O$ là liên kết ion hay liên kết cộng hóa trị?", "answer": "liên kết ion", "explain": "Hiệu độ âm điện $\\Delta\\chi = 2{,}13 \\ge 1{,}7$ nên liên kết Mg-O là liên kết ion.", "points": 0.5}]},

vel": "VDC", "q": "Phát biểu nào sau đây đúng về tính chất của tinh thể $NaCl$?", "options": ["A. Dẫn điện tốt ở trạng thái rắn.", "B. Không dẫn điện ở trạng thái rắn nhưng dẫn điện khi nóng chảy.", "C. Nhiệt độ nóng chảy thấp.", "D. Mềm và dẻo."], "answer": "B", "explain": "Ở trạng thái rắn, các ion trong tinh thể NaCl bị giữ chặt nên không dẫn điện; khi nóng chảy, các ion chuyển động tự do nên dẫn điện. NaCl có nhiệt độ nóng chảy cao, cứng nhưng giòn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $KBr$ là hợp chất ion.", "b) $NaF$ là hợp chất ion.", "c) $LiCl$ là hợp chất ion.", "d) $CH_4$ là hợp chất ion."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $K^+$ và $Br^-$. b) Đúng: $Na^+$ và $F^-$. c) Đúng: $Li^+$ và $Cl^-$. d) Sai: $CH_4$ là hợp chất cộng hóa trị.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hợp chất ion cứng nhưng giòn.", "b) Khi bị tác động mạnh, tinh thể ion dễ vỡ vụn.", "c) Hợp chất ion có nhiệt độ sôi thấp.", "d) Dung dịch $NaCl$ dẫn điện."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: mạng tinh thể bị lệch làm các ion cùng dấu xích lại gần nhau, lực đẩy làm vỡ tinh thể. c) Sai: hợp chất ion có nhiệt độ nóng chảy và nhiệt độ sôi cao. d) Đúng: các ion $Na^+$ và $Cl^-$ chuyển động tự do.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết quá trình tạo thành anion $O^{2-}$ từ nguyên tử $O$ (dạng text).", "answer": "O + 2e thành O2-", "explain": "Nguyên tử O nhận 2 electron: O + 2e thành $O^{2-}$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho biết độ âm điện của $Al$ là 1,61 và của $O$ là 3,44. Liên kết $Al-O$ trong $Al_2O_3$ là liên kết ion hay liên kết cộng hóa trị?", "answer": "liên kết ion", "explain": "Hiệu độ âm điện $\\Delta\\chi = 3{,}44 - 1{,}61 = 1{,}83 \\ge 1{,}7$ nên liên kết Al-O là liên kết ion.", "points": 0.5}]},
{"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Cation là ion mang điện tích", "options": ["A. âm.", "B. dương.", "C. bằng 0.", "D. không xác định."], "answer": "B", "explain": "Cation được tạo thành khi nguyên tử nhường electron nên mang điện tích dương.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Anion là ion mang điện tích", "options": ["A. dương.", "B. âm.", "C. bằng 0.", "D. không xác định."], "answer": "B", "explain": "Anion được tạo thành khi nguyên tử nhận electron nên mang điện tích âm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sự tạo thành phân tử $CaF_2$ diễn ra như thế nào?", "options": ["A. $Ca$ nhường 1 electron, $F$ nhận 1 electron.", "B. $Ca$ nhường 2 electron tạo $Ca^{2+}$, mỗi $F$ nhận 1 electron tạo $F^-$; các ion hút nhau.", "C. $Ca$ và $F$ góp chung electron.", "D. $Ca$ nhận 2 electron, $F$ nhường 1 electron."], "answer": "B", "explain": "$Ca \\rightarrow Ca^{2+} + 2e$; $2F + 2e \\rightarrow 2F^-$. Một ion $Ca^{2+}$ hút hai ion $F^-$ bằng lực hút tĩnh điện tạo thành $CaF_2$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các hợp chất sau, hợp chất nào KHÔNG phải là hợp chất ion?", "options": ["A. $Na_2O$.", "B. $KCl$.", "C. $NH_3$.", "D. $MgBr_2$."], "answer": "C", "explain": "$NH_3$ được tạo thành từ hai phi kim (N và H) bằng sự góp chung electron nên là hợp chất cộng hóa trị, không phải hợp chất ion.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết độ âm điện: $H$ (2,20), $F$ (3,98), $Na$ (0,93). Sắp xếp các liên kết $H-F, Na-F$ theo chiều tăng dần của hiệu độ âm điện:", "options": ["A. $H-F \\lt Na-F$.", "B. $Na-F \\lt H-F$.", "C. Hai liên kết có hiệu độ âm điện bằng nhau.", "D. Không so sánh được."], "answer": "A", "explain": "$\\Delta\\chi_{H-F} = 3{,}98 - 2{,}20 = 1{,}78$; $\\Delta\\chi_{Na-F} = 3{,}98 - 0{,}93 = 3{,}05$. Vậy $\\Delta\\chi_{H-F} \\lt \\Delta\\chi_{Na-F}$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nhiệt độ nóng chảy của $NaCl$ là 801 độ C, của $MgO$ là 2852 độ C. Giải thích nào sau đây đúng?", "options": ["A. Liên kết ion trong $MgO$ bền hơn vì điện tích ion lớn hơn ($Mg^{2+}, O^{2-}$ so với $Na^+, Cl^-$).", "B. $MgO$ là hợp chất cộng hóa trị.", "C. $NaCl$ có liên kết ion bền hơn $MgO$.", "D. Nhiệt độ nóng chảy không liên quan đến liên kết ion."], "answer": "A", "explain": "Lực hút tĩnh điện tỉ lệ với tích điện tích các ion. $Mg^{2+}$ và $O^{2-}$ có điện tích lớn gấp đôi $Na^+$ và $Cl^-$ nên liên kết ion trong MgO bền hơn, nhiệt độ nóng chảy cao hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Na_2O$ là hợp chất ion.", "b) $CaO$ là hợp chất ion.", "c) $BaCl_2$ là hợp chất ion.", "d) $SO_2$ là hợp chất ion."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $SO_2$ là hợp chất cộng hóa trị (tạo từ hai phi kim).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong tinh thể $NaCl$, tỉ lệ số ion $Na^+$ và $Cl^-$ là 1:1.", "b) Trong tinh thể $CaF_2$, tỉ lệ số ion $Ca^{2+}$ và $F^-$ là 1:2.", "c) Hợp chất ion không tồn tại ở dạng phân tử riêng lẻ.", "d) $NaCl$ rắn khan dẫn điện tốt."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: công thức NaCl. b) Đúng: công thức $CaF_2$. c) Đúng: tồn tại ở dạng mạng tinh thể ion. d) Sai: NaCl rắn không dẫn điện.", "points": 1}, {"type": "short", "level": "VD", "q": "Hiệu độ âm điện của liên kết $K-Br$ là 2,14. Liên kết $K-Br$ là liên kết ion hay liên kết cộng hóa trị?", "answer": "liên kết ion", "explain": "$\\Delta\\chi = 2{,}14 \\ge 1{,}7$ nên liên kết K-Br là liên kết ion.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết công thức hợp chất ion tạo thành giữa $Al^{3+}$ và $S^{2-}$.", "answer": "$Al_2S_3$", "explain": "Để trung hòa điện tích: 2 ion $Al^{3+}$ (tổng 6+) kết hợp với 3 ion $S^{2-}$ (tổng 6-) tạo thành $Al_2S_3$.", "points": 0.5}]},
{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Quá trình tạo thành ion $Na^+$ từ nguyên tử $Na$ là quá trình", "options": ["A. oxi hóa.", "B. khử.", "C. trung hòa.", "D. phân hủy."], "answer": "A", "explain": "Quá trình nhường electron là quá trình oxi hóa. $Na \\rightarrow Na^+ + 1e$ là quá trình oxi hóa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quá trình tạo thành ion $Cl^-$ từ nguyên tử $Cl$ là quá trình", "options": ["A. oxi hóa.", "B. khử.", "C. trung hòa.", "D. phân hủy."], "answer": "B", "explain": "Quá trình nhận electron là quá trình khử. $Cl + 1e \\rightarrow Cl^-$ là quá trình khử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng tạo thành $NaCl$ từ $Na$ và $Cl_2$, chất oxi hóa và chất khử lần lượt là", "options": ["A. $Na$ và $Cl_2$.", "B. $Cl_2$ và $Na$.", "C. $Na^+$ và $Cl^-$.", "D. $Cl^-$ và $Na^+$."], "answer": "B", "explain": "$Cl_2$ nhận electron (bị khử) nên là chất oxi hóa; $Na$ nhường electron (bị oxi hóa) nên là chất khử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hợp chất ion nào sau đây được tạo thành từ cation kim loại kiềm thổ và anion halogen?", "options": ["A. $NaCl$.", "B. $CaBr_2$.", "C. $K_2O$.", "D. $Al_2O_3$."], "answer": "B", "explain": "$CaBr_2$ được tạo thành từ cation $Ca^{2+}$ (kim loại kiềm thổ) và anion $Br^-$ (halogen).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho các chất: $NaCl, H_2O, MgO, CO_2$. Số chất là hợp chất ion là", "options": ["A. 1.", "B. 2.", "C. 3.", "D. 4."], "answer": "B", "explain": "Hợp chất ion: NaCl ($Na^+, Cl^-$), MgO ($Mg^{2+}, O^{2-}$). $H_2O$ và $CO_2$ là hợp chất cộng hóa trị. Vậy có 2 chất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điện phân nóng chảy $Al_2O_3$ thu được $Al$ và $O_2$. Trong quá trình này, tại catot xảy ra quá trình", "options": ["A. $Al^{3+} + 3e \\rightarrow Al$ (quá trình khử).", "B. $2O^{2-} \\rightarrow O_2 + 4e$ (quá trình oxi hóa).", "C. $Al \\rightarrow Al^{3+} + 3e$ (quá trình oxi hóa).", "D. $O_2 + 4e \\rightarrow 2O^{2-}$ (quá trình khử)."], "answer": "A", "explain": "Tại catot (cực âm) xảy ra quá trình khử: cation $Al^{3+}$ nhận electron tạo thành Al kim loại.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quá trình nhường electron là quá trình oxi hóa.", "b) Quá trình nhận electron là quá trình khử.", "c) Chất nhường electron là chất khử.", "d) Chất nhận electron là chất khử."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: chất khử là chất nhường electron (bị oxi hóa). d) Sai: chất nhận electron là chất oxi hóa.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Na$ là chất khử trong phản ứng tạo $NaCl$.", "b) $Cl_2$ là chất oxi hóa trong phản ứng tạo $NaCl$.", "c) $Na^+$ là chất oxi hóa.", "d) $Cl^-$ là chất khử."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: Na nhường electron. b) Đúng: $Cl_2$ nhận electron. c) Sai: $Na^+$ đã đạt octet bền vững, không còn tính oxi hóa đáng kể trong ngữ cảnh này. d) Sai: $Cl^-$ đã đạt octet bền vững.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong phản ứng $2Na + Cl_2$ tạo thành $2NaCl$, chất nào là chất oxi hóa?", "answer": "$Cl_2$", "explain": "$Cl_2$ nhận electron tạo $Cl^-$ (quá trình khử) nên $Cl_2$ là chất oxi hóa.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết công thức hợp chất ion tạo thành giữa $Mg^{2+}$ và $N^{3-}$.", "answer": "$Mg_3N_2$", "explain": "Để trung hòa điện tích: 3 ion $Mg^{2+}$ (tổng 6+) kết hợp với 2 ion $N^{3-}$ (tổng 6-) tạo thành $Mg_3N_2$.", "points": 0.5}]},
{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Số phối trí của mỗi ion trong tinh thể $NaCl$ là", "options": ["A. 4.", "B. 6.", "C. 8.", "D. 12."], "answer": "B", "explain": "Trong tinh thể NaCl, mỗi ion $Na^+$ được bao quanh bởi 6 ion $Cl^-$ và ngược lại (số phối trí bằng 6).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hợp chất ion dẫn điện trong trường hợp nào sau đây?", "options": ["A. Ở trạng thái rắn.", "B. Khi nóng chảy hoặc tan trong nước.", "C. Ở mọi trạng thái.", "D. Không bao giờ dẫn điện."], "answer": "B", "explain": "Hợp chất ion dẫn điện khi nóng chảy hoặc tan trong nước (các ion chuyển động tự do); ở trạng thái rắn, các ion bị giữ chặt nên không dẫn điện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giải thích nào sau đây đúng về tính giòn của tinh thể ion?", "options": ["A. Liên kết ion rất yếu nên dễ vỡ.", "B. Khi bị tác động, mạng tinh thể bị lệch làm các ion cùng dấu xích lại gần nhau, lực đẩy làm tinh thể vỡ.", "C. Tinh thể ion mềm.", "D. Các ion chuyển động tự do nên dễ vỡ."], "answer": "B", "explain": "Khi có lực tác động làm lệch mạng tinh thể, các ion cùng điện tích xích lại gần nhau, lực đẩy tĩnh điện làm tinh thể vỡ vụn (giòn).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chất sau, chất nào có nhiệt độ nóng chảy cao nhất?", "options": ["A. $NaCl$.", "B. $H_2O$.", "C. $CO_2$.", "D. $MgO$."], "answer": "D", "explain": "MgO là hợp chất ion với điện tích ion lớn ($Mg^{2+}, O^{2-}$) nên liên kết ion rất bền, nhiệt độ nóng chảy cao nhất (2852 độ C).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết độ âm điện: $Cs$ (0,79), $F$ (3,98). Dự đoán bản chất liên kết trong $CsF$:", "options": ["A. Liên kết ion.", "B. Liên kết cộng hóa trị không cực.", "C. Liên kết cộng hóa trị có cực.", "D. Liên kết kim loại."], "answer": "A", "explain": "$\\Delta\\chi = 3{,}98 - 0{,}79 = 3{,}19 \\ge 1{,}7$ nên liên kết Cs-F là liên kết ion.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sắp xếp các hợp chất $NaF, NaCl, NaBr, NaI$ theo chiều tăng dần của nhiệt độ nóng chảy:", "options": ["A. $NaF \\lt NaCl \\lt NaBr \\lt NaI$.", "B. $NaI \\lt NaBr \\lt NaCl \\lt NaF$.", "C. $NaCl \\lt NaF \\lt NaBr \\lt NaI$.", "D. $NaBr \\lt NaI \\lt NaF \\lt NaCl$."], "answer": "B", "explain": "Nhiệt độ nóng chảy của hợp chất ion phụ thuộc vào năng lượng mạng tinh thể: ion càng nhỏ thì lực hút càng mạnh. Bán kính anion tăng dần theo thứ tự: $F^-$, $Cl^-$, $Br^-$, $I^-$ nên nhiệt độ nóng chảy giảm dần theo thứ tự: NaF, NaCl, NaBr, NaI.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $NaCl$ nóng chảy dẫn điện.", "b) Dung dịch $NaCl$ trong nước dẫn điện.", "c) Tinh thể $NaCl$ khan dẫn điện.", "d) Nước cất dẫn điện tốt."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: các ion chuyển động tự do. b) Đúng. c) Sai: các ion bị giữ chặt. d) Sai: nước cất hầu như không dẫn điện.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hợp chất ion thường tan tốt trong nước.", "b) Hợp chất ion thường tan tốt trong dung môi không phân cực như xăng.", "c) $NaCl$ tan nhiều trong nước.", "d) Dầu ăn dẫn điện tốt."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: nước là dung môi phân cực. b) Sai: hợp chất ion ít tan trong dung môi không phân cực. c) Đúng. d) Sai: dầu ăn là chất không phân cực, không dẫn điện.", "points": 1}, {"type": "short", "level": "VD", "q": "Hợp chất ion ở trạng thái rắn có dẫn điện không? (trả lời: có hoặc không)", "answer": "không", "explain": "Ở trạng thái rắn, các ion bị giữ chặt trong mạng tinh thể nên hợp chất ion không dẫn điện.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết công thức hợp chất ion tạo thành giữa $Fe^{3+}$ và $O^{2-}$.", "answer": "$Fe_2O_3$", "explain": "Để trung hòa điện tích: 2 ion $Fe^{3+}$ (tổng 6+) kết hợp với 3 ion $O^{2-}$ (tổng 6-) tạo thành $Fe_2O_3$.", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trong phân tử $KCl$, các ion $K^+$ và $Cl^-$ liên kết với nhau bằng", "options": ["A. liên kết cộng hóa trị.", "B. liên kết ion.", "C. liên kết hydrogen.", "D. liên kết kim loại."], "answer": "B", "explain": "$K^+$ và $Cl^-$ là các ion trái dấu, hút nhau bằng lực hút tĩnh điện tạo thành liên kết ion.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hợp chất nào sau đây là hợp chất ion?", "options": ["A. $H_2S$.", "B. $NH_3$.", "C. $MgS$.", "D. $PH_3$."], "answer": "C", "explain": "MgS được tạo thành từ kim loại Mg và phi kim S ($Mg^{2+}$ và $S^{2-}$) nên là hợp chất ion.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các cặp chất sau, cặp nào tạo thành hợp chất ion?", "options": ["A. $Na$ và $Cl$.", "B. $H$ và $Cl$.", "C. $C$ và $O$.", "D. $N$ và $H$."], "answer": "A", "explain": "Na là kim loại điển hình, Cl là phi kim điển hình nên tạo thành hợp chất ion NaCl. Các cặp còn lại đều gồm phi kim nên tạo hợp chất cộng hóa trị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây sai về hợp chất ion?", "options": ["A. Có nhiệt độ nóng chảy cao.", "B. Dẫn điện khi nóng chảy.", "C. Cứng nhưng giòn.", "D. Luôn dẫn điện ở mọi trạng thái."], "answer": "D", "explain": "Hợp chất ion không dẫn điện ở trạng thái rắn (các ion bị giữ chặt trong mạng tinh thể). Phát biểu D sai.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết độ âm điện: $Ba$ (0,89), $O$ (3,44). Liên kết trong $BaO$ là", "options": ["A. liên kết ion.", "B. liên kết cộng hóa trị không cực.", "C. liên kết cộng hóa trị có cực.", "D. liên kết cho nhận."], "answer": "A", "explain": "$\\Delta\\chi = 3{,}44 - 0{,}89 = 2{,}55 \\ge 1{,}7$ nên liên kết Ba-O là liên kết ion.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong các hợp chất $LiF, NaCl, KBr, CsI$, hợp chất có liên kết ion mang nhiều tính cộng hóa trị nhất (phân cực nhất về phía cộng hóa trị) là", "options": ["A. $LiF$.", "B. $NaCl$.", "C. $KBr$.", "D. $CsI$."], "answer": "A", "explain": "Cation càng nhỏ và điện tích càng lớn thì khả năng phân cực anion càng mạnh, liên kết càng mang tính cộng hóa trị. $Li^+$ là cation nhỏ nhất trong bốn cation nên LiF có tính cộng hóa trị nhiều nhất.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $LiF$ là hợp chất ion.", "b) $NaCl$ là hợp chất ion.", "c) $KBr$ là hợp chất ion.", "d) $HF$ là hợp chất ion."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: HF là hợp chất cộng hóa trị có cực ($\\Delta\\chi = 1{,}78$? Thực tế $\\Delta\\chi_{H-F} = 1{,}78 \\ge 1{,}7$ nhưng HF được coi là cộng hóa trị có cực do H không tạo cation $H^+$ độc lập trong phân tử).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Liên kết ion không có tính định hướng.", "b) Liên kết ion không bão hòa.", "c) Mỗi ion trong tinh thể hút nhiều ion trái dấu xung quanh.", "d) Hợp chất ion tồn tại ở dạng phân tử riêng lẻ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: lực hút tĩnh điện tác dụng đẳng hướng trong không gian. b) Đúng: một ion có thể hút nhiều ion trái dấu. c) Đúng: ví dụ số phối trí 6 trong NaCl. d) Sai: hợp chất ion tồn tại ở dạng mạng tinh thể.", "points": 1}, {"type": "short", "level": "VD", "q": "Hiệu độ âm điện của liên kết $Ca-F$ là 3,0. Liên kết $Ca-F$ là liên kết ion hay liên kết cộng hóa trị?", "answer": "liên kết ion", "explain": "$\\Delta\\chi = 3{,}0 \\ge 1{,}7$ nên liên kết Ca-F là liên kết ion.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết công thức hợp chất ion tạo thành giữa $Na^+$ và $S^{2-}$.", "answer": "$Na_2S$", "explain": "Để trung hòa điện tích: 2 ion $Na^+$ (tổng 2+) kết hợp với 1 ion $S^{2-}$ (2-) tạo thành $Na_2S$.", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Liên kết được tạo thành giữa $Mg^{2+}$ và $O^{2-}$ là", "options": ["A. liên kết ion.", "B. liên kết cộng hóa trị.", "C. liên kết hydrogen.", "D. liên kết kim loại."], "answer": "A", "explain": "$Mg^{2+}$ và $O^{2-}$ là các ion trái dấu, hút nhau bằng lực hút tĩnh điện tạo thành liên kết ion.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các chất sau, chất nào là hợp chất ion?", "options": ["A. $O_2$.", "B. $N_2$.", "C. $CaO$.", "D. $H_2$."], "answer": "C", "explain": "CaO được tạo thành từ kim loại Ca và phi kim O nên là hợp chất ion. $O_2, N_2, H_2$ là đơn chất cộng hóa trị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quá trình nào sau đây là quá trình tạo thành liên kết ion?", "options": ["A. $Na^+ + Cl^-$ tạo thành $NaCl$.", "B. $H + H$ tạo thành $H_2$.", "C. $Cl + Cl$ tạo thành $Cl_2$.", "D. $O + O$ tạo thành $O_2$."], "answer": "A", "explain": "Các ion $Na^+$ và $Cl^-$ hút nhau bằng lực hút tĩnh điện tạo thành liên kết ion trong NaCl. Các quá trình còn lại là sự góp chung electron tạo liên kết cộng hóa trị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hợp chất ion $XY$ được tạo thành từ", "options": ["A. cation $X^+$ và anion $Y^-$.", "B. hai cation.", "C. hai anion.", "D. hai nguyên tử trung hòa."], "answer": "A", "explain": "Hợp chất ion XY gồm cation $X^+$ và anion $Y^-$ hút nhau bằng lực hút tĩnh điện.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết độ âm điện: $Sr$ (0,95), $Cl$ (3,16). Số công thức và bản chất liên kết của hợp chất tạo thành giữa $Sr$ và $Cl$ là", "options": ["A. $SrCl$, liên kết cộng hóa trị.", "B. $SrCl_2$, liên kết ion.", "C. $Sr_2Cl$, liên kết ion.", "D. $SrCl_2$, liên kết cộng hóa trị."], "answer": "B", "explain": "Sr thuộc nhóm IIA tạo $Sr^{2+}$, Cl tạo $Cl^-$ nên hợp chất là $SrCl_2$. $\\Delta\\chi = 3{,}16 - 0{,}95 = 2{,}21 \\ge 1{,}7$ nên là liên kết ion.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Năng lượng mạng tinh thể của $NaCl$ là 787 kJ/mol, của $MgO$ là 3795 kJ/mol. Kết luận nào sau đây đúng?", "options": ["A. Liên kết ion trong $MgO$ bền hơn trong $NaCl$.", "B. Liên kết ion trong $NaCl$ bền hơn trong $MgO$.", "C. Hai liên kết bền như nhau.", "D. Không thể so sánh."], "answer": "A", "explain": "Năng lượng mạng tinh thể càng lớn thì liên kết ion càng bền. Năng lượng mạng của MgO (3795 kJ/mol) lớn hơn nhiều của NaCl (787 kJ/mol) do điện tích ion lớn hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $MgCl_2$ là hợp chất ion.", "b) $Al_2O_3$ là hợp chất ion.", "c) $Fe_2O_3$ là hợp chất ion.", "d) $CO_2$ là hợp chất ion."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $Mg^{2+}$ và $Cl^-$. b) Đúng: $Al^{3+}$ và $O^{2-}$. c) Đúng: $Fe^{3+}$ và $O^{2-}$. d) Sai: $CO_2$ là hợp chất cộng hóa trị.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Điện phân nóng chảy $NaCl$ thu được $Na$ và $Cl_2$.", "b) Tại catot, $Na^+$ nhận electron tạo $Na$.", "c) Tại anot, $Cl^-$ nhường electron tạo $Cl_2$.", "d) $NaCl$ rắn khan dẫn điện."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: quá trình khử. c) Đúng: quá trình oxi hóa. d) Sai: NaCl rắn không dẫn điện.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hợp chất ion tạo thành giữa $K^+$ và $O^{2-}$.", "answer": "$K_2O$", "explain": "Để trung hòa điện tích: 2 ion $K^+$ (tổng 2+) kết hợp với 1 ion $O^{2-}$ (2-) tạo thành $K_2O$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hiệu độ âm điện của liên kết $Li-F$ là 3,0. Liên kết $Li-F$ là liên kết ion hay liên kết cộng hóa trị?", "answer": "liên kết ion", "explain": "$\\Delta\\chi = 3{,}0 \\ge 1{,}7$ nên liên kết Li-F là liên kết ion.", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Trong hợp chất ion, các ion tồn tại ở trạng thái", "options": ["A. chuyển động tự do trong mọi trường hợp.", "B. sắp xếp trật tự trong mạng tinh thể ở trạng thái rắn.", "C. phân tử riêng lẻ.", "D. nguyên tử trung hòa."], "answer": "B", "explain": "Ở trạng thái rắn, các cation và anion trong hợp chất ion sắp xếp luân phiên trật tự trong mạng tinh thể ion.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lực liên kết trong hợp chất ion là", "options": ["A. lực hút tĩnh điện.", "B. lực hút giữa các phân tử.", "C. lực đẩy giữa các hạt nhân.", "D. lực hấp dẫn."], "answer": "A", "explain": "Liên kết ion có bản chất là lực hút tĩnh điện giữa các ion trái dấu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các ion: $Na^+, Ca^{2+}, Al^{3+}$. Khả năng hút anion $Cl^-$ tăng dần theo thứ tự", "options": ["A. $Na^+ \\lt Ca^{2+} \\lt Al^{3+}$.", "B. $Al^{3+} \\lt Ca^{2+} \\lt Na^+$.", "C. $Ca^{2+} \\lt Na^+ \\lt Al^{3+}$.", "D. $Na^+ \\lt Al^{3+} \\lt Ca^{2+}$."], "answer": "A", "explain": "Lực hút tĩnh điện tỉ lệ với điện tích ion. Điện tích tăng dần theo thứ tự: $Na^+$ (1+), $Ca^{2+}$ (2+), $Al^{3+}$ (3+) nên lực hút anion tăng dần theo thứ tự này.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các hợp chất sau, hợp chất nào có nhiệt độ nóng chảy cao nhất?", "options": ["A. $NaCl$ (801 độ C).", "B. $MgCl_2$ (714 độ C).", "C. $Al_2O_3$ (2072 độ C).", "D. $H_2O$ (0 độ C)."], "answer": "C", "explain": "$Al_2O_3$ có các ion điện tích lớn ($Al^{3+}, O^{2-}$) nên năng lượng mạng tinh thể lớn, nhiệt độ nóng chảy cao nhất (2072 độ C).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Điện phân dung dịch $NaCl$ bão hòa có màng ngăn thu được", "options": ["A. $Na$ và $Cl_2$.", "B. $NaOH, Cl_2$ và $H_2$.", "C. $Na_2O$ và $HCl$.", "D. $NaH$ và $Cl_2$."], "answer": "B", "explain": "Điện phân dung dịch NaCl có màng ngăn (công nghiệp): $2NaCl + 2H_2O \\rightarrow 2NaOH + Cl_2 + H_2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 5,85 gam $NaCl$ hòa tan vào nước thành 500 ml dung dịch. Nồng độ mol của ion $Na^+$ trong dung dịch là", "options": ["A. 0,1M.", "B. 0,2M.", "C. 0,4M.", "D. 0,05M."], "answer": "B", "explain": "Số mol NaCl $= 5{,}85/58{,}5 = 0{,}1$ mol. $NaCl \\rightarrow Na^+ + Cl^-$ nên số mol $Na^+ = 0{,}1$ mol. Nồng độ $= 0{,}1/0{,}5 = 0{,}2M$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $NaCl$ có trong nước biển.", "b) $CaCO_3$ là thành phần chính của đá vôi.", "c) $Na_2CO_3$ được gọi là soda.", "d) $NaHCO_3$ được gọi là baking soda."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: nước biển chứa khoảng 3,5% muối, chủ yếu là NaCl. b) Đúng. c) Đúng: soda ash. d) Đúng: dùng làm bột nở.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $CaO$ được gọi là vôi sống.", "b) $Ca(OH)_2$ được gọi là vôi tôi.", "c) $CaCO_3$ bị nhiệt phân tạo $CaO$ và $CO_2$.", "d) $CaO$ không tác dụng với nước."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: $CaCO_3 \\rightarrow CaO + CO_2$ (nung). d) Sai: $CaO + H_2O \\rightarrow Ca(OH)_2$ (tôi vôi, tỏa nhiều nhiệt).", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hợp chất ion tạo thành giữa $Ba^{2+}$ và $Cl^-$.", "answer": "$BaCl_2$", "explain": "Để trung hòa điện tích: 1 ion $Ba^{2+}$ (2+) kết hợp với 2 ion $Cl^-$ (tổng 2-) tạo thành $BaCl_2$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hiệu độ âm điện của liên kết $Na-I$ là 1,73. Liên kết $Na-I$ là liên kết ion hay liên kết cộng hóa trị?", "answer": "liên kết ion", "explain": "$\\Delta\\chi = 1{,}73 \\ge 1{,}7$ nên liên kết Na-I được xếp vào liên kết ion (ngưỡng biên).", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Hợp chất ion được tạo thành khi", "options": ["A. hai nguyên tử góp chung electron.", "B. một nguyên tử nhường electron, một nguyên tử nhận electron rồi các ion hút nhau.", "C. hai nguyên tử cùng nhường electron.", "D. hai nguyên tử cùng nhận electron."], "answer": "B", "explain": "Kim loại nhường electron tạo cation, phi kim nhận electron tạo anion; các ion trái dấu hút nhau tạo thành hợp chất ion.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các chất sau, chất nào KHÔNG phải là hợp chất ion?", "options": ["A. $K_2S$.", "B. $NaBr$.", "C. $CCl_4$.", "D. $Li_2O$."], "answer": "C", "explain": "$CCl_4$ được tạo thành từ hai phi kim (C và Cl) bằng sự góp chung electron nên là hợp chất cộng hóa trị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho sơ đồ tạo thành $KBr$: $K$ nhường 1 electron, $Br$ nhận 1 electron. Phát biểu nào sau đây đúng?", "options": ["A. $K^+$ và $Br^-$ đều đạt octet.", "B. $K^+$ đạt duplet, $Br^-$ đạt octet.", "C. $K^+$ và $Br^-$ đều đạt duplet.", "D. Không ion nào đạt octet."], "answer": "A", "explain": "$K^+$ có 18 electron (giống Ar, 8e lớp ngoài cùng), $Br^-$ có 36 electron (giống Kr, 8e lớp ngoài cùng): cả hai đều đạt octet.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các hợp chất ion sau, hợp chất nào có tỉ lệ cation : anion là 2 : 1?", "options": ["A. $CaCl_2$.", "B. $Na_2O$.", "C. $MgO$.", "D. $AlCl_3$."], "answer": "B", "explain": "$Na_2O$ gồm 2 ion $Na^+$ và 1 ion $O^{2-}$ nên tỉ lệ cation : anion là 2 : 1.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X (Z = 13) kết hợp với nguyên tố Y (Z = 8). Công thức hợp chất ion tạo thành là", "options": ["A. $XY$.", "B. $X_2Y_3$.", "C. $X_3Y_2$.", "D. $XY_3$."], "answer": "B", "explain": "X là Al (tạo $Al^{3+}$), Y là O (tạo $O^{2-}$). Để trung hòa điện tích: 2 ion $Al^{3+}$ (6+) + 3 ion $O^{2-}$ (6-) tạo thành $Al_2O_3$ (dạng $X_2Y_3$).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hòa tan 11,7 gam $NaCl$ vào nước được 2 lít dung dịch. Nồng độ mol của ion $Cl^-$ là", "options": ["A. 0,05M.", "B. 0,1M.", "C. 0,2M.", "D. 0,4M."], "answer": "B", "explain": "Số mol NaCl $= 11{,}7/58{,}5 = 0{,}2$ mol. $NaCl \\rightarrow Na^+ + Cl^-$ nên số mol $Cl^- = 0{,}2$ mol. Nồng độ $= 0{,}2/2 = 0{,}1M$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Na_2S$ là hợp chất ion.", "b) $K_2O$ là hợp chất ion.", "c) $CaS$ là hợp chất ion.", "d) $H_2S$ là hợp chất ion."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $Na^+$ và $S^{2-}$. b) Đúng: $K^+$ và $O^{2-}$. c) Đúng: $Ca^{2+}$ và $S^{2-}$. d) Sai: $H_2S$ là hợp chất cộng hóa trị.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong $Na_2O$, tỉ lệ $Na^+$ : $O^{2-}$ là 2:1.", "b) Trong $AlCl_3$, tỉ lệ $Al^{3+}$ : $Cl^-$ là 1:3.", "c) Trong $Mg_3N_2$, tỉ lệ $Mg^{2+}$ : $N^{3-}$ là 3:2.", "d) Trong $CaF_2$, tỉ lệ $Ca^{2+}$ : $F^-$ là 2:1."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: trong $CaF_2$, tỉ lệ $Ca^{2+}$ : $F^-$ là 1:2.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hợp chất ion tạo thành giữa $Rb^+$ và $I^-$.", "answer": "$RbI$", "explain": "1 ion $Rb^+$ (1+) kết hợp với 1 ion $I^-$ (1-) tạo thành RbI.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hiệu độ âm điện của liên kết $H-Cl$ là 0,96. Liên kết $H-Cl$ là liên kết ion hay liên kết cộng hóa trị có cực?", "answer": "liên kết cộng hóa trị có cực", "explain": "$\\Delta\\chi = 0{,}96$ nằm trong khoảng từ 0,4 đến dưới 1,7 nên liên kết H-Cl là liên kết cộng hóa trị có cực.", "points": 0.5}]},
{"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Đặc điểm nào sau đây là của hợp chất ion?", "options": ["A. Nhiệt độ nóng chảy thấp.", "B. Dẫn điện ở trạng thái rắn.", "C. Nhiệt độ nóng chảy cao, cứng nhưng giòn.", "D. Luôn là chất khí."], "answer": "C", "explain": "Hợp chất ion có nhiệt độ nóng chảy cao (liên kết bền), cứng nhưng giòn (mạng tinh thể dễ vỡ khi bị lệch).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Liên kết ion được hình thành do", "options": ["A. sự góp chung electron.", "B. lực hút tĩnh điện giữa các ion trái dấu.", "C. sự cho proton.", "D. lực van der Waals."], "answer": "B", "explain": "Bản chất của liên kết ion là lực hút tĩnh điện giữa cation và anion.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chất sau, chất nào vừa là hợp chất ion vừa tan tốt trong nước?", "options": ["A. $AgCl$.", "B. $NaCl$.", "C. $BaSO_4$.", "D. $CaCO_3$."], "answer": "B", "explain": "NaCl là hợp chất ion và tan nhiều trong nước. $AgCl, BaSO_4, CaCO_3$ là hợp chất ion nhưng ít tan trong nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây đúng?", "options": ["A. Mọi hợp chất của kim loại và phi kim đều là hợp chất ion.", "B. $AlCl_3$ là hợp chất cộng hóa trị (mặc dù tạo từ kim loại và phi kim).", "C. $NaCl$ là hợp chất cộng hóa trị.", "D. $MgO$ là hợp chất cộng hóa trị."], "answer": "B", "explain": "$AlCl_3$ có hiệu độ âm điện nhỏ ($\\Delta\\chi$ khoảng 1,55, nhỏ hơn 1,7) và cation $Al^{3+}$ phân cực mạnh nên mang nhiều tính cộng hóa trị. Không phải mọi hợp chất kim loại-phi kim đều là ion.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 0,25 mol $CaO$ tác dụng hết với nước. Khối lượng $Ca(OH)_2$ thu được là", "options": ["A. 18,5 gam.", "B. 9,25 gam.", "C. 37 gam.", "D. 14 gam."], "answer": "A", "explain": "$CaO + H_2O \\rightarrow Ca(OH)_2$. Số mol $Ca(OH)_2 = 0{,}25$ mol, khối lượng $= 0{,}25 \\times 74 = 18{,}5$ gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nung 20 gam $CaCO_3$ (hiệu suất 100%). Thể tích khí $CO_2$ thu được ở đktc là", "options": ["A. 2,24 lít.", "B. 4,48 lít.", "C. 6,72 lít.", "D. 1,12 lít."], "answer": "B", "explain": "Số mol $CaCO_3 = 20/100 = 0{,}2$ mol. $CaCO_3 \\rightarrow CaO + CO_2$. Số mol $CO_2 = 0{,}2$ mol, thể tích $= 0{,}2 \\times 22{,}4 = 4{,}48$ lít.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Na^+$ có 10 electron.", "b) $Cl^-$ có 18 electron.", "c) $NaCl$ được tạo thành từ $Na^+$ và $Cl^-$.", "d) Liên kết trong $NaCl$ là liên kết cộng hóa trị."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: liên kết trong NaCl là liên kết ion.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Mg^{2+}$ có 10 electron.", "b) $O^{2-}$ có 10 electron.", "c) $MgO$ được tạo thành từ $Mg^{2+}$ và $O^{2-}$.", "d) Liên kết trong $MgO$ là liên kết ion."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: 12 - 2 = 10. b) Đúng: 8 + 2 = 10. c) Đúng. d) Đúng: $\\Delta\\chi = 2{,}13 \\ge 1{,}7$.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hợp chất ion tạo thành giữa $Cs^+$ và $Br^-$.", "answer": "$CsBr$", "explain": "1 ion $Cs^+$ (1+) kết hợp với 1 ion $Br^-$ (1-) tạo thành CsBr.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hiệu độ âm điện của liên kết $C-H$ là 0,35. Liên kết $C-H$ là liên kết cộng hóa trị có cực hay không cực?", "answer": "không cực", "explain": "$\\Delta\\chi = 0{,}35 \\lt 0{,}4$ nên liên kết C-H được coi là liên kết cộng hóa trị không cực (phân cực rất yếu).", "points": 0.5}]}]}
