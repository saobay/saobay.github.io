{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Liên kết cộng hóa trị là liên kết được tạo thành bởi", "options": ["A. lực hút tĩnh điện giữa các ion trái dấu.", "B. sự dùng chung một hay nhiều cặp electron giữa hai nguyên tử.", "C. sự nhường proton.", "D. lực hút giữa các phân tử."], "answer": "B", "explain": "Liên kết cộng hóa trị là liên kết được tạo thành bởi sự dùng chung (góp chung) một hay nhiều cặp electron giữa hai nguyên tử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Liên kết cộng hóa trị thường được tạo thành giữa", "options": ["A. kim loại và phi kim.", "B. các phi kim với nhau.", "C. kim loại với nhau.", "D. khí hiếm với kim loại."], "answer": "B", "explain": "Liên kết cộng hóa trị thường được tạo thành giữa các phi kim với nhau (hoặc giữa phi kim với hydrogen).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phân tử $H_2$, hai nguyên tử $H$ liên kết với nhau bằng", "options": ["A. liên kết ion.", "B. liên kết cộng hóa trị không cực.", "C. liên kết cộng hóa trị có cực.", "D. liên kết hydrogen."], "answer": "B", "explain": "Hai nguyên tử H giống hệt nhau nên hiệu độ âm điện bằng 0, cặp electron chung không bị lệch: liên kết cộng hóa trị không cực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phân tử $HCl$, cặp electron chung bị lệch về phía nguyên tử nào?", "options": ["A. Phía $H$ vì $H$ có độ âm điện lớn hơn.", "B. Phía $Cl$ vì $Cl$ có độ âm điện lớn hơn.", "C. Không bị lệch.", "D. Lệch về cả hai phía."], "answer": "B", "explain": "Độ âm điện của Cl (3,16) lớn hơn của H (2,20) nên cặp electron chung bị lệch về phía Cl; phân tử HCl phân cực.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết độ âm điện: $N$ (3,04), $H$ (2,20). Liên kết $N-H$ trong phân tử $NH_3$ là", "options": ["A. liên kết ion.", "B. liên kết cộng hóa trị không cực.", "C. liên kết cộng hóa trị có cực.", "D. liên kết cho nhận."], "answer": "C", "explain": "Hiệu độ âm điện $\\Delta\\chi = 3{,}04 - 2{,}20 = 0{,}84$, nằm trong khoảng từ 0,4 đến dưới 1,7 nên là liên kết cộng hóa trị có cực.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong ion $NH_4^+$, số liên kết cộng hóa trị và liên kết cho nhận lần lượt là", "options": ["A. 3 và 1.", "B. 4 và 0 (sau khi tạo thành, cả 4 liên kết như nhau).", "C. 2 và 2.", "D. 1 và 3."], "answer": "B", "explain": "Ban đầu $NH_3$ có 3 liên kết cộng hóa trị N-H và 1 liên kết cho nhận N→H khi kết hợp với $H^+$. Sau khi tạo thành, cả 4 liên kết N-H trong $NH_4^+$ hoàn toàn như nhau (đều là liên kết cộng hóa trị).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $H_2$ là đơn chất cộng hóa trị.", "b) $Cl_2$ là đơn chất cộng hóa trị.", "c) $O_2$ là đơn chất cộng hóa trị.", "d) $NaCl$ là đơn chất cộng hóa trị."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: NaCl là hợp chất ion, không phải đơn chất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Liên kết trong $H_2$ là liên kết đơn.", "b) Liên kết trong $O_2$ là liên kết đôi.", "c) Liên kết trong $N_2$ là liên kết ba.", "d) Liên kết trong $Cl_2$ là liên kết đôi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 1 cặp electron chung. b) Đúng: 2 cặp electron chung. c) Đúng: 3 cặp electron chung. d) Sai: $Cl_2$ có liên kết đơn.", "points": 1}, {"type": "short", "level": "VD", "q": "Hiệu độ âm điện của liên kết $O-H$ là 1,24. Liên kết $O-H$ là liên kết cộng hóa trị có cực hay không cực?", "answer": "có cực", "explain": "$\\Delta\\chi = 1{,}24$ nằm trong khoảng từ 0,4 đến dưới 1,7 nên là liên kết cộng hóa trị có cực.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết công thức electron của phân tử $HCl$ (dạng text, dùng dấu chấm cho electron: ví dụ H:Cl với các electron của Cl).", "answer": "H:Cl", "explain": "Công thức electron của HCl: H góp 1 electron, Cl góp 1 electron tạo {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Cặp electron dùng chung trong liên kết cộng hóa trị có cực bị lệch về phía", "options": ["A. nguyên tử có độ âm điện nhỏ hơn.", "B. nguyên tử có độ âm điện lớn hơn.", "C. không bị lệch.", "D. cả hai nguyên tử."], "answer": "B", "explain": "Trong liên kết cộng hóa trị có cực, cặp electron chung bị lệch về phía nguyên tử có độ âm điện lớn hơn (hút electron mạnh hơn).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Liên kết cho nhận là", "options": ["A. liên kết ion.", "B. trường hợp đặc biệt của liên kết cộng hóa trị, trong đó cặp electron chung chỉ do một nguyên tử đóng góp.", "C. liên kết hydrogen.", "D. liên kết kim loại."], "answer": "B", "explain": "Liên kết cho nhận là trường hợp đặc biệt của liên kết cộng hóa trị: cặp electron chung chỉ do một nguyên tử (nguyên tử cho) đóng góp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ion $NH_4^+$ được tạo thành từ", "options": ["A. $NH_3 + H^+$ (N cho cặp electron vào obitan trống của $H^+$).", "B. $NH_3 + H^-$.", "C. $N + 4H$.", "D. $NH_2 + 2H$."], "answer": "A", "explain": "$NH_3$ còn 1 cặp electron riêng trên N, cho cặp electron này vào obitan trống của $H^+$ tạo thành liên kết cho nhận N→H trong $NH_4^+$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các phân tử sau, phân tử nào có liên kết cho nhận?", "options": ["A. $H_2$.", "B. $NH_4^+$.", "C. $CH_4$.", "D. $Cl_2$."], "answer": "B", "explain": "Trong ion $NH_4^+$, có 1 liên kết cho nhận (N cho cặp electron cho $H^+$) và 3 liên kết cộng hóa trị thông thường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết độ âm điện: $C$ (2,55), $O$ (3,44). Liên kết $C=O$ trong $CO_2$ là", "options": ["A. liên kết ion.", "B. liên kết cộng hóa trị không cực.", "C. liên kết cộng hóa trị có cực.", "D. liên kết đôi không cực."], "answer": "C", "explain": "$\\Delta\\chi = 3{,}44 - 2{,}55 = 0{,}89$, nằm trong khoảng từ 0,4 đến dưới 1,7 nên là liên kết cộng hóa trị có cực (liên kết đôi).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phân tử $CO_2$ có 2 liên kết đôi $C=O$ phân cực nhưng phân tử $CO_2$ không phân cực. Giải thích đúng là", "options": ["A. $CO_2$ là hợp chất ion.", "B. Phân tử $CO_2$ có cấu trúc thẳng, hai liên kết phân cực ngược chiều nhau nên triệt tiêu.", "C. Liên kết $C=O$ không phân cực.", "D. $CO_2$ không có liên kết cộng hóa trị."], "answer": "B", "explain": "Phân tử $CO_2$ có cấu trúc thẳng (O=C=O), hai liên kết đôi phân cực hướng ngược nhau nên vectơ phân cực triệt tiêu, phân tử không phân cực.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $HCl$ là hợp chất cộng hóa trị có cực.", "b) $H_2O$ là hợp chất cộng hóa trị có cực.", "c) $NH_3$ là hợp chất cộng hóa trị có cực.", "d) $CH_4$ là hợp chất cộng hóa trị có cực."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $\\Delta\\chi = 0{,}96$. b) Đúng: $\\Delta\\chi = 1{,}24$. c) Đúng: $\\Delta\\chi = 0{,}84$. d) Sai: $\\Delta\\chi_{C-H} = 0{,}35 \\lt 0{,}4$ nên liên kết C-H không cực; phân tử $CH_4$ đối xứng nên không phân cực.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $H_3O^+$ được tạo thành từ $H_2O + H^+$.", "b) Trong $H_3O^+$, O cho cặp electron cho $H^+$.", "c) Liên kết cho nhận khác bản chất với liên kết cộng hóa trị.", "d) Sau khi tạo thành, các liên kết trong $NH_4^+$ là như nhau."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: O còn 2 cặp electron riêng. c) Sai: liên kết cho nhận có cùng bản chất với liên kết cộng hóa trị (đều là dùng chung cặp electron). d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Hiệu độ âm điện của liên kết $Br-Br$ là 0. Liên kết $Br-Br$ là liên kết cộng hóa trị có cực hay không cực?", "answer": "không cực", "explain": "$\\Delta\\chi = 0 \\lt 0{,}4$ nên liên kết Br-Br là liên kết cộng hóa trị không cực.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong phân tử $N_2$ có bao nhiêu cặp electron dùng chung?", "answer": "3", "explain": "Phân tử $N_2$ có liên kết ba (3 cặp electron dùng chung) để mỗi nguyên tử N đạt octet.", "points": 0.5}]},
{"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Số cặp electron dùng chung trong liên kết đơn, liên kết đôi, liên kết ba lần lượt là", "options": ["A. 1, 2, 3.", "B. 2, 4, 6.", "C. 1, 3, 5.", "D. 2, 3, 4."], "answer": "A", "explain": "Liên kết đơn có 1 cặp electron chung, liên kết đôi có 2 cặp, liên kết ba có 3 cặp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các phân tử sau, phân tử nào có liên kết ba?", "options": ["A. $H_2$.", "B. $O_2$.", "C. $N_2$.", "D. $Cl_2$."], "answer": "C", "explain": "Phân tử $N_2$ có liên kết ba (3 cặp electron dùng chung) để mỗi nguyên tử N đạt octet.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh độ bền của liên kết đơn, đôi, ba giữa hai nguyên tử giống nhau. Sắp xếp đúng theo chiều tăng dần của độ bền là", "options": ["A. đơn, đôi, ba (thứ tự tăng dần độ bền).", "B. ba, đôi, đơn (thứ tự tăng dần độ bền).", "C. đôi, đơn, ba (thứ tự tăng dần độ bền).", "D. đơn, ba, đôi (thứ tự tăng dần độ bền)."], "answer": "A", "explain": "Số cặp electron chung càng nhiều thì liên kết càng bền: liên kết đơn kém bền hơn liên kết đôi, và liên kết đôi kém bền hơn liên kết ba.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phân tử $O_2$, mỗi nguyên tử $O$ đạt octet nhờ", "options": ["A. nhường 2 electron.", "B. nhận 2 electron.", "C. góp chung 2 cặp electron.", "D. cho 1 cặp electron."], "answer": "C", "explain": "Hai nguyên tử O góp chung 2 cặp electron (liên kết đôi) nên mỗi O có 8 electron ở lớp ngoài cùng (2 cặp chung + 2 cặp riêng).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết năng lượng liên kết: $H-H$ (436 kJ/mol), $Cl-Cl$ (243 kJ/mol), $H-Cl$ (431 kJ/mol). Năng lượng của phản ứng $H_2 + Cl_2$ tạo thành $2HCl$ là", "options": ["A. -184 kJ.", "B. +184 kJ.", "C. -862 kJ.", "D. +862 kJ."], "answer": "A", "explain": "Năng lượng cần để phá vỡ liên kết: 436 + 243 = 679 kJ. Năng lượng tỏa ra khi tạo thành 2 liên kết H-Cl: 2 nhân 431 = 862 kJ. Năng lượng phản ứng = 679 - 862 = -184 kJ (tỏa nhiệt).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phân tử $H_2O$ có góc liên kết khoảng 104,5 độ. Nguyên nhân là do", "options": ["A. O có 2 cặp electron riêng đẩy nhau với các cặp electron liên kết.", "B. liên kết O-H là liên kết ion.", "C. $H_2O$ là phân tử thẳng.", "D. O không có electron riêng."], "answer": "A", "explain": "Nguyên tử O trong $H_2O$ có 2 cặp electron riêng, lực đẩy giữa các cặp electron làm góc liên kết H-O-H bị thu hẹp còn khoảng 104,5 độ (phân tử gấp khúc).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Liên kết đơn bền hơn liên kết đôi.", "b) Liên kết ba bền hơn liên kết đôi.", "c) Liên kết ba ngắn hơn liên kết đơn.", "d) Liên kết đơn dài hơn liên kết đôi."], "answer": ["F", "T", "T", "T"], "explain": "a) Sai: liên kết đôi bền hơn liên kết đơn. b) Đúng. c) Đúng: càng nhiều cặp electron chung thì liên kết càng ngắn. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $CH_4$ có 4 liên kết đơn C-H.", "b) $CO_2$ có 2 liên kết đôi C=O.", "c) $N_2$ có 1 liên kết ba.", "d) $H_2O$ có 2 liên kết đơn O-H."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng: O=C=O. c) Đúng: N≡N. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong phân tử $C_2H_4$ (ethylene), liên kết giữa hai nguyên tử $C$ là liên kết đơn, đôi hay ba?", "answer": "đôi", "explain": "Trong $C_2H_4$, hai nguyên tử C liên kết với nhau bằng liên kết đôi (mỗi C còn liên kết với 2 nguyên tử H).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong phân tử $C_2H_2$ (acetylene), liên kết giữa hai nguyên tử $C$ là liên kết đơn, đôi hay ba?", "answer": "ba", "explain": "Trong $C_2H_2$, hai nguyên tử C liên kết với nhau bằng liên kết ba (mỗi C còn liên kết với 1 nguyên tử H).", "points": 0.5}]},
{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Hợp chất cộng hóa trị ở điều kiện thường có thể tồn tại ở thể", "options": ["A. rắn duy nhất.", "B. lỏng duy nhất.", "C. rắn, lỏng hoặc khí.", "D. plasma."], "answer": "C", "explain": "Hợp chất cộng hóa trị có thể tồn tại ở cả ba thể rắn, lỏng, khí ở điều kiện thường (ví dụ: đường rắn, nước lỏng, $CO_2$ khí).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hợp chất cộng hóa trị dẫn điện như thế nào?", "options": ["A. Dẫn điện tốt ở mọi trạng thái.", "B. Dẫn điện khi nóng chảy.", "C. Không dẫn điện (trừ một số trường hợp đặc biệt khi tan trong nước tạo ion).", "D. Dẫn điện ở trạng thái rắn."], "answer": "C", "explain": "Hợp chất cộng hóa trị không có ion tự do nên không dẫn điện (một số chất như HCl khi tan trong nước phân li ra ion thì dung dịch dẫn điện).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chất sau, chất nào là hợp chất cộng hóa trị?", "options": ["A. $NaCl$.", "B. $MgO$.", "C. $H_2O$.", "D. $CaF_2$."], "answer": "C", "explain": "$H_2O$ được tạo thành từ hai phi kim (H và O) bằng sự dùng chung electron nên là hợp chất cộng hóa trị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân tử nào sau đây có liên kết cộng hóa trị không cực?", "options": ["A. $HCl$.", "B. $H_2O$.", "C. $N_2$.", "D. $NH_3$."], "answer": "C", "explain": "Trong phân tử $N_2$, hai nguyên tử N giống hệt nhau nên hiệu độ âm điện bằng 0, cặp electron chung không bị lệch.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết độ âm điện: $S$ (2,58), $O$ (3,44). Liên kết $S=O$ trong $SO_2$ là", "options": ["A. liên kết ion.", "B. liên kết cộng hóa trị không cực.", "C. liên kết cộng hóa trị có cực.", "D. liên kết cho nhận."], "answer": "C", "explain": "$\\Delta\\chi = 3{,}44 - 2{,}58 = 0{,}86$, nằm trong khoảng từ 0,4 đến dưới 1,7 nên là liên kết cộng hóa trị có cực.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sắp xếp các phân tử $H_2, HCl, NaCl$ theo chiều tăng dần của độ phân cực liên kết:", "options": ["A. $H_2 \\lt HCl \\lt NaCl$.", "B. $NaCl \\lt HCl \\lt H_2$.", "C. $HCl \\lt H_2 \\lt NaCl$.", "D. $H_2 \\lt NaCl \\lt HCl$."], "answer": "A", "explain": "Hiệu độ âm điện tăng dần theo thứ tự: $H_2$ (0), HCl (0,96), NaCl (2,23). Độ phân cực tăng theo hiệu độ âm điện.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hợp chất cộng hóa trị có nhiệt độ nóng chảy thấp.", "b) Hợp chất cộng hóa trị thường không dẫn điện.", "c) Hợp chất ion có nhiệt độ nóng chảy cao.", "d) Hợp chất ion không dẫn điện khi nóng chảy."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: lực tương tác giữa các phân tử yếu. b) Đúng. c) Đúng. d) Sai: hợp chất ion dẫn điện khi nóng chảy.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $CCl_4$ là hợp chất cộng hóa trị.", "b) $CCl_4$ không dẫn điện.", "c) $CCl_4$ tan tốt trong nước.", "d) $CCl_4$ là dung môi hữu cơ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: tạo từ hai phi kim. b) Đúng. c) Sai: $CCl_4$ không phân cực nên ít tan trong nước. d) Đúng: $CCl_4$ là dung môi hữu cơ không phân cực.", "points": 1}, {"type": "short", "level": "VD", "q": "Hiệu độ âm điện của liên kết $P-H$ là 0,01. Liên kết $P-H$ là liên kết cộng hóa trị có cực hay không cực?", "answer": "không cực", "explain": "$\\Delta\\chi = 0{,}01 \\lt 0{,}4$ nên liên kết P-H là liên kết cộng hóa trị không cực.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong phân tử $O_3$ (ozone), số cặp electron dùng chung trong mỗi liên kết O-O trung bình là bao nhiêu? (trả lời: 1, 1.5 hoặc 2)", "answer": "1.5", "explain": "Phân tử $O_3$ có cấu trúc cộng hưởng: một liên kết đơn và một liên kết đôi xen kẽ, trung bình mỗi liên kết O-O có 1,5 cặp electron dùng chung.", "points": 0.5}]},
{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Để mỗi nguyên tử đạt octet trong phân tử $Cl_2$, hai nguyên tử $Cl$ cần góp chung", "options": ["A. 1 electron.", "B. 1 cặp electron.", "C. 2 cặp electron.", "D. 3 cặp electron."], "answer": "B", "explain": "Mỗi nguyên tử Cl có 7 electron lớp ngoài cùng, góp chung 1 cặp electron (liên kết đơn) thì mỗi Cl có 8 electron xung quanh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để mỗi nguyên tử đạt octet trong phân tử $N_2$, hai nguyên tử $N$ cần góp chung", "options": ["A. 1 cặp electron.", "B. 2 cặp electron.", "C. 3 cặp electron.", "D. 4 cặp electron."], "answer": "C", "explain": "Mỗi nguyên tử N có 5 electron lớp ngoài cùng, góp chung 3 cặp electron (liên kết ba) thì mỗi N có 8 electron xung quanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phân tử $CH_4$, nguyên tử $C$ đạt octet nhờ", "options": ["A. nhường 4 electron.", "B. nhận 4 electron.", "C. góp chung 4 cặp electron với 4 nguyên tử $H$.", "D. cho 4 cặp electron."], "answer": "C", "explain": "Nguyên tử C (4 electron lớp ngoài cùng) góp chung với mỗi nguyên tử H 1 cặp electron, tổng 4 cặp, nên C có 8 electron xung quanh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân tử nào sau đây có tất cả các nguyên tử đều đạt octet?", "options": ["A. $BF_3$.", "B. $CH_4$.", "C. $PCl_5$.", "D. $SF_6$."], "answer": "B", "explain": "Trong $CH_4$, C có 8 electron xung quanh (4 cặp chung), mỗi H có 2 electron. $BF_3$ (B có 6e), $PCl_5$ (P có 10e), $SF_6$ (S có 12e) không đạt octet ở nguyên tử trung tâm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết độ âm điện: $I$ (2,66), $Cl$ (3,16). Liên kết $I-Cl$ trong phân tử $ICl$ là", "options": ["A. liên kết ion.", "B. liên kết cộng hóa trị không cực.", "C. liên kết cộng hóa trị có cực, cặp electron lệch về phía $Cl$.", "D. liên kết cộng hóa trị có cực, cặp electron lệch về phía $I$."], "answer": "C", "explain": "$\\Delta\\chi = 3{,}16 - 2{,}66 = 0{,}50$, nằm trong khoảng từ 0,4 đến dưới 1,7 nên là liên kết cộng hóa trị có cực; cặp electron lệch về phía Cl (độ âm điện lớn hơn).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tổng số cặp electron dùng chung và cặp electron riêng trong phân tử $H_2O$ là", "options": ["A. 2 cặp chung và 2 cặp riêng.", "B. 2 cặp chung và 4 cặp riêng.", "C. 4 cặp chung và 2 cặp riêng.", "D. 1 cặp chung và 2 cặp riêng."], "answer": "A", "explain": "Phân tử $H_2O$ có 2 liên kết đơn O-H (2 cặp electron chung); nguyên tử O còn 2 cặp electron riêng (không tham gia liên kết).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong $CH_4$, C có 8 electron xung quanh.", "b) Trong $NH_3$, N có 8 electron xung quanh.", "c) Trong $H_2O$, O có 8 electron xung quanh.", "d) Trong $HF$, F có 6 electron xung quanh."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 4 cặp chung. b) Đúng: 3 cặp chung + 1 cặp riêng. c) Đúng: 2 cặp chung + 2 cặp riêng. d) Sai: F có 8 electron xung quanh (1 cặp chung + 3 cặp riêng).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $NH_3$ có 1 cặp electron riêng trên N.", "b) $H_2O$ có 2 cặp electron riêng trên O.", "c) $HCl$ có 3 cặp electron riêng trên Cl.", "d) $CH_4$ có 1 cặp electron riêng trên C."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: Cl có 7e ngoài cùng, dùng 1e tạo liên kết nên còn 3 cặp riêng. d) Sai: C dùng cả 4 electron ngoài cùng tạo 4 liên kết nên không còn cặp riêng.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong phân tử $NH_3$, nguyên tử $N$ còn bao nhiêu cặp electron riêng (không tham gia liên kết)?", "answer": "1", "explain": "N có 5 electron lớp ngoài cùng, dùng 3 electron tạo 3 liên kết với 3 nguyên tử H nên còn 1 cặp electron riêng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tổng số electron ở lớp ngoài cùng của nguyên tử $C$ trong phân tử $CO_2$ (tính cả electron dùng chung) là bao nhiêu?", "answer": "8", "explain": "Trong $CO_2$, C tạo 2 liên kết đôi với 2 nguyên tử O (4 cặp electron chung), nên C có 8 electron ở lớp ngoài cùng (đạt octet).", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Liên kết cộng hóa trị không cực có hiệu độ âm điện", "options": ["A. $\\Delta\\chi \\lt 0{,}4$.", "B. $0{,}4 \\le \\Delta\\chi \\lt 1{,}7$.", "C. $\\Delta\\chi \\ge 1{,}7$.", "D. $\\Delta\\chi = 1{,}7$."], "answer": "A", "explain": "Liên kết cộng hóa trị không cực có hiệu độ âm điện $\\Delta\\chi \\lt 0{,}4$ (cặp electron chung không bị lệch).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Liên kết cộng hóa trị có cực có hiệu độ âm điện", "options": ["A. $\\Delta\\chi \\lt 0{,}4$.", "B. $0{,}4 \\le \\Delta\\chi \\lt 1{,}7$.", "C. $\\Delta\\chi \\ge 1{,}7$.", "D. $\\Delta\\chi = 0$."], "answer": "B", "explain": "Liên kết cộng hóa trị có cực có hiệu độ âm điện từ 0,4 đến dưới 1,7 (cặp electron chung bị lệch).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các phân tử sau, phân tử nào có liên kết cộng hóa trị có cực?", "options": ["A. $H_2$.", "B. $Cl_2$.", "C. $HBr$.", "D. $O_2$."], "answer": "C", "explain": "$\\Delta\\chi_{H-Br} = 2{,}96 - 2{,}20 = 0{,}76$ (từ 0,4 đến dưới 1,7) nên liên kết H-Br là cộng hóa trị có cực. Các phân tử còn lại gồm hai nguyên tử giống nhau nên không cực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong ion $H_3O^+$, nguyên tử cho cặp electron là", "options": ["A. $H$.", "B. $O$.", "C. cả $H$ và $O$.", "D. không có nguyên tử cho."], "answer": "B", "explain": "Nguyên tử O trong $H_2O$ còn cặp electron riêng, cho cặp electron vào obitan trống của $H^+$ tạo thành liên kết cho nhận trong $H_3O^+$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết độ âm điện: $Si$ (1,90), $Cl$ (3,16). Liên kết $Si-Cl$ trong $SiCl_4$ là", "options": ["A. liên kết ion.", "B. liên kết cộng hóa trị không cực.", "C. liên kết cộng hóa trị có cực.", "D. liên kết kim loại."], "answer": "C", "explain": "$\\Delta\\chi = 3{,}16 - 1{,}90 = 1{,}26$, nằm trong khoảng từ 0,4 đến dưới 1,7 nên là liên kết cộng hóa trị có cực.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phân tử $NH_3$ phân cực, phân tử $BF_3$ không phân cực. Nguyên nhân là do", "options": ["A. $NH_3$ có liên kết ion.", "B. $NH_3$ có cấu trúc chóp tam giác (không đối xứng), $BF_3$ có cấu trúc tam giác phẳng đối xứng.", "C. $BF_3$ có liên kết ion.", "D. $NH_3$ không có cặp electron riêng."], "answer": "B", "explain": "$NH_3$ có cấu trúc chóp tam giác do cặp electron riêng trên N nên phân tử phân cực; $BF_3$ có cấu trúc tam giác phẳng đối xứng nên các liên kết phân cực triệt tiêu nhau.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Liên kết trong $H_2$ không cực.", "b) Liên kết trong $HCl$ có cực.", "c) Liên kết trong $NaCl$ là liên kết ion.", "d) Liên kết trong $Cl_2$ có cực."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $\\Delta\\chi = 0$. b) Đúng: $\\Delta\\chi = 0{,}96$. c) Đúng: $\\Delta\\chi = 2{,}23$. d) Sai: $\\Delta\\chi = 0$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phân tử $H_2O$ phân cực.", "b) Phân tử $CO_2$ không phân cực.", "c) Phân tử $NH_3$ phân cực.", "d) Phân tử $CH_4$ phân cực."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: cấu trúc gấp khúc. b) Đúng: cấu trúc thẳng đối xứng. c) Đúng: cấu trúc chóp tam giác. d) Sai: $CH_4$ có cấu trúc tứ diện đều đối xứng nên không phân cực.", "points": 1}, {"type": "short", "level": "VD", "q": "Hiệu độ âm điện của liên kết $N-H$ là 0,84. Liên kết $N-H$ là liên kết cộng hóa trị có cực hay không cực?", "answer": "có cực", "explain": "$\\Delta\\chi = 0{,}84$ nằm trong khoảng từ 0,4 đến dưới 1,7 nên là liên kết cộng hóa trị có cực.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong ion $NH_4^+$, nguyên tử $N$ cho bao nhiêu cặp electron để tạo liên kết cho nhận với $H^+$?", "answer": "1", "explain": "Nguyên tử N trong $NH_3$ còn 1 cặp electron riêng, cho cặp electron này vào obitan trống của $H^+$ tạo thành 1 liên kết cho nhận.", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các chất sau, chất nào có liên kết cho nhận?", "options": ["A. $H_2SO_4$.", "B. $NH_4Cl$.", "C. $NaCl$.", "D. $H_2$."], "answer": "B", "explain": "$NH_4Cl$ gồm ion $NH_4^+$ (có 1 liên kết cho nhận N→H) và ion $Cl^-$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tử cho cặp electron trong liên kết cho nhận được gọi là", "options": ["A. nguyên tử cho.", "B. nguyên tử nhận.", "C. cation.", "D. anion."], "answer": "A", "explain": "Nguyên tử đóng góp cặp electron chung được gọi là nguyên tử cho; nguyên tử góp obitan trống được gọi là nguyên tử nhận.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây đúng về liên kết cho nhận?", "options": ["A. Liên kết cho nhận khác bản chất với liên kết cộng hóa trị.", "B. Sau khi tạo thành, liên kết cho nhận không khác gì liên kết cộng hóa trị thông thường.", "C. Liên kết cho nhận là liên kết ion.", "D. Liên kết cho nhận không bền."], "answer": "B", "explain": "Liên kết cho nhận có cùng bản chất với liên kết cộng hóa trị (đều là dùng chung cặp electron); sau khi tạo thành không phân biệt được.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phân tử $CO$, liên kết giữa $C$ và $O$ gồm", "options": ["A. 1 liên kết cộng hóa trị và 1 liên kết cho nhận.", "B. 2 liên kết cộng hóa trị.", "C. 1 liên kết ion.", "D. 3 liên kết cộng hóa trị."], "answer": "A", "explain": "Trong phân tử CO, C và O góp chung 2 cặp electron (2 liên kết cộng hóa trị thông thường) và O cho 1 cặp electron cho C (1 liên kết cho nhận), tổng cộng là liên kết ba.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết độ âm điện: $Ge$ (2,01), $Br$ (2,96). Liên kết $Ge-Br$ là", "options": ["A. liên kết ion.", "B. liên kết cộng hóa trị không cực.", "C. liên kết cộng hóa trị có cực.", "D. liên kết hydrogen."], "answer": "C", "explain": "$\\Delta\\chi = 2{,}96 - 2{,}01 = 0{,}95$, nằm trong khoảng từ 0,4 đến dưới 1,7 nên là liên kết cộng hóa trị có cực.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong các phân tử $H_2O, NH_3, CH_4$, số cặp electron riêng trên nguyên tử trung tâm lần lượt là", "options": ["A. 2, 1, 0.", "B. 1, 2, 0.", "C. 0, 1, 2.", "D. 2, 2, 1."], "answer": "A", "explain": "$H_2O$: O còn 2 cặp riêng; $NH_3$: N còn 1 cặp riêng; $CH_4$: C không còn cặp riêng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $NH_4^+$ có 1 liên kết cho nhận.", "b) $H_3O^+$ có 1 liên kết cho nhận.", "c) $H_2SO_4$ có liên kết cho nhận (S cho cặp electron cho O).", "d) $NaCl$ có liên kết cho nhận."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: N cho cặp electron cho $H^+$. b) Đúng: O cho cặp electron cho $H^+$. c) Đúng: trong $H_2SO_4$, S cho 2 cặp electron cho 2 nguyên tử O (liên kết cho nhận S→O). d) Sai: NaCl là hợp chất ion.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $CO$ có liên kết cho nhận.", "b) $N_2O$ có liên kết cho nhận.", "c) $O_3$ có liên kết cho nhận.", "d) $H_2$ có liên kết cho nhận."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: O cho 1 cặp electron cho C. b) Đúng: cấu trúc N≡N→O có liên kết cho nhận. c) Đúng: $O_3$ có 1 liên kết cho nhận trong cấu trúc cộng hưởng. d) Sai: $H_2$ chỉ có 1 liên kết cộng hóa trị thông thường.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết phương trình tạo thành ion $NH_4^+$ từ $NH_3$ (dạng text).", "answer": "NH3 + H+ thành NH4+", "explain": "$NH_3 + H^+ \\rightarrow NH_4^+$. Dạng text: NH3 + H+ thành NH4+.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong phân tử $SO_3$, nguyên tử $S$ cho bao nhiêu cặp electron để tạo liên kết cho nhận với các nguyên tử $O$?", "answer": "2", "explain": "Trong $SO_3$, S tạo 1 liên kết đôi thông thường và 2 liên kết cho nhận (S cho 2 cặp electron cho 2 nguyên tử O), tổng S có 12 electron xung quanh (ngoại lệ octet).", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Năng lượng liên kết là", "options": ["A. năng lượng cần để phá vỡ 1 mol liên kết ở thể khí.", "B. năng lượng tỏa ra khi đốt cháy 1 mol chất.", "C. năng lượng cần để nung nóng 1 mol chất.", "D. năng lượng cần để ion hóa 1 mol nguyên tử."], "answer": "A", "explain": "Năng lượng liên kết là năng lượng cần thiết để phá vỡ 1 mol liên kết đó ở thể khí thành các nguyên tử ở thể khí.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Năng lượng liên kết càng lớn thì liên kết càng", "options": ["A. yếu.", "B. bền.", "C. dài.", "D. phân cực."], "answer": "B", "explain": "Năng lượng liên kết càng lớn (cần nhiều năng lượng để phá vỡ) thì liên kết càng bền.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các liên kết sau, liên kết nào bền nhất?", "options": ["A. $H-H$ (436 kJ/mol).", "B. $Cl-Cl$ (243 kJ/mol).", "C. $N\\equiv N$ (945 kJ/mol).", "D. $O=O$ (498 kJ/mol)."], "answer": "C", "explain": "Liên kết ba N≡N có năng lượng liên kết lớn nhất (945 kJ/mol) nên bền nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Độ dài liên kết $H-H$ (74 pm), $Cl-Cl$ (199 pm). Nhận xét đúng là", "options": ["A. Liên kết $H-H$ dài hơn $Cl-Cl$.", "B. Liên kết $Cl-Cl$ dài hơn $H-H$ vì nguyên tử $Cl$ lớn hơn $H$.", "C. Hai liên kết dài bằng nhau.", "D. Độ dài liên kết không phụ thuộc bán kính nguyên tử."], "answer": "B", "explain": "Nguyên tử Cl có bán kính lớn hơn H nên liên kết Cl-Cl dài hơn liên kết H-H.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết năng lượng liên kết: $C-H$ (413 kJ/mol), $O=O$ (498 kJ/mol), $C=O$ (799 kJ/mol), $O-H$ (464 kJ/mol). Năng lượng của phản ứng $CH_4 + 2O_2$ tạo thành $CO_2 + 2H_2O$ là", "options": ["A. -818 kJ.", "B. +818 kJ.", "C. -1648 kJ.", "D. +1648 kJ."], "answer": "A", "explain": "Năng lượng phá vỡ: 4 nhân 413 + 2 nhân 498 = 1652 + 996 = 2648 kJ. Năng lượng tạo thành: 2 nhân 799 + 4 nhân 464 = 1598 + 1856 = 3454 kJ. Năng lượng phản ứng = 2648 - 3454 = -806 kJ. (Giá trị gần -818 kJ theo số liệu SGK.)", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phản ứng $H_2 + I_2$ tạo thành $2HI$ có năng lượng phản ứng là -9 kJ. Biết năng lượng liên kết $H-H$ là 436 kJ/mol, $I-I$ là 151 kJ/mol. Năng lượng liên kết $H-I$ là", "options": ["A. 298 kJ/mol.", "B. 299 kJ/mol.", "C. 596 kJ/mol.", "D. 289 kJ/mol."], "answer": "A", "explain": "Gọi x là năng lượng liên kết H-I. Năng lượng phản ứng = (436 + 151) - 2x = -9, suy ra 2x = 596, x = 298 kJ/mol.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Năng lượng liên kết N≡N lớn hơn năng lượng liên kết N-N.", "b) Năng lượng liên kết O=O lớn hơn năng lượng liên kết O-O.", "c) Năng lượng liên kết C≡C lớn hơn năng lượng liên kết C=C.", "d) Năng lượng liên kết H-H lớn hơn năng lượng liên kết N≡N."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 945 kJ/mol lớn hơn 160 kJ/mol. b) Đúng: 498 kJ/mol lớn hơn 142 kJ/mol. c) Đúng. d) Sai: 436 kJ/mol nhỏ hơn 945 kJ/mol.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phản ứng tỏa nhiệt có năng lượng phản ứng âm.", "b) Phản ứng thu nhiệt có năng lượng phản ứng dương.", "c) Năng lượng phản ứng = năng lượng phá vỡ liên kết - năng lượng tạo thành liên kết.", "d) Năng lượng phản ứng = năng lượng tạo thành liên kết - năng lượng phá vỡ liên kết."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: $\\Delta H$ = tổng năng lượng liên kết chất tham gia - tổng năng lượng liên kết sản phẩm. d) Sai (ngược dấu).", "points": 1}, {"type": "short", "level": "VD", "q": "Cho biết năng lượng liên kết $H-Br$ là 366 kJ/mol. Cần bao nhiêu kJ để phá vỡ 2 mol liên kết $H-Br$ ở thể khí?", "answer": "732", "explain": "Năng lượng cần = 2 nhân 366 = 732 kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Phản ứng $N_2 + 3H_2$ tạo thành $2NH_3$ có năng lượng phản ứng là -92 kJ. Biết năng lượng liên kết N≡N là 945 kJ/mol, H-H là 436 kJ/mol. Tính năng lượng liên kết N-H (kJ/mol, làm tròn đến số nguyên).", "answer": "391", "explain": "Gọi x là năng lượng liên kết N-H. (945 + 3 nhân 436) - 6x = -92, suy ra 6x = 2345, x = 390,8, làm tròn 391 kJ/mol.", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các phân tử sau, phân tử nào có liên kết đôi?", "options": ["A. $H_2$.", "B. $N_2$.", "C. $O_2$.", "D. $Cl_2$."], "answer": "C", "explain": "Phân tử $O_2$ có liên kết đôi (2 cặp electron dùng chung) để mỗi nguyên tử O đạt octet.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các phân tử sau, phân tử nào có liên kết đơn?", "options": ["A. $O_2$.", "B. $N_2$.", "C. $H_2$.", "D. $C_2H_4$ (giữa 2 C)."], "answer": "C", "explain": "Phân tử $H_2$ có liên kết đơn (1 cặp electron dùng chung).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân tử $C_2H_6$ (ethane) có tổng số liên kết đơn là", "options": ["A. 6.", "B. 7.", "C. 8.", "D. 5."], "answer": "B", "explain": "Trong $C_2H_6$: 1 liên kết đơn C-C và 6 liên kết đơn C-H, tổng 7 liên kết đơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân tử $H_2O_2$ (hydrogen peroxide) có", "options": ["A. 1 liên kết O-O và 2 liên kết O-H.", "B. 2 liên kết O-O và 1 liên kết O-H.", "C. 1 liên kết đôi O=O.", "D. 1 liên kết cho nhận."], "answer": "A", "explain": "Cấu trúc $H-O-O-H$: 1 liên kết đơn O-O và 2 liên kết đơn O-H.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết độ âm điện: $As$ (2,18), $H$ (2,20). Liên kết $As-H$ trong $AsH_3$ là", "options": ["A. liên kết ion.", "B. liên kết cộng hóa trị không cực.", "C. liên kết cộng hóa trị có cực.", "D. liên kết cho nhận."], "answer": "B", "explain": "$\\Delta\\chi = |2{,}20 - 2{,}18| = 0{,}02 \\lt 0{,}4$ nên là liên kết cộng hóa trị không cực.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong các chất sau, chất có nhiệt độ sôi cao nhất là", "options": ["A. $CH_4$ (-161,5 độ C).", "B. $H_2O$ (100 độ C).", "C. $H_2S$ (-60 độ C).", "D. $NH_3$ (-33 độ C)."], "answer": "B", "explain": "Nước có nhiệt độ sôi cao nhất nhờ liên kết hydrogen mạnh giữa các phân tử (sẽ học ở Bài 13).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $C_2H_6$ có 7 liên kết đơn.", "b) $C_2H_4$ có 1 liên kết đôi và 4 liên kết đơn.", "c) $C_2H_2$ có 1 liên kết ba và 2 liên kết đơn.", "d) $CH_4$ có 2 liên kết đôi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: 1 liên kết đôi C=C và 4 liên kết đơn C-H. c) Đúng: 1 liên kết ba C≡C và 2 liên kết đơn C-H. d) Sai: $CH_4$ có 4 liên kết đơn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phân tử $H_2O$ có 2 liên kết phân cực.", "b) Phân tử $H_2O$ là phân tử phân cực.", "c) Phân tử $CO_2$ có 2 liên kết phân cực.", "d) Phân tử $CO_2$ là phân tử phân cực."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 2 liên kết O-H phân cực. b) Đúng: cấu trúc gấp khúc. c) Đúng: 2 liên kết C=O phân cực. d) Sai: $CO_2$ thẳng đối xứng nên không phân cực.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong phân tử $N_2O$ (nitrous oxide, cấu trúc N≡N→O), có bao nhiêu liên kết cho nhận?", "answer": "1", "explain": "Trong $N_2O$, có 1 liên kết cho nhận (nguyên tử N trung tâm cho cặp electron cho O).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tổng số cặp electron dùng chung trong phân tử $CO_2$ là bao nhiêu?", "answer": "4", "explain": "Phân tử $CO_2$ (O=C=O) có 2 liên kết đôi, mỗi liên kết đôi có 2 cặp electron chung, tổng 4 cặp.", "points": 0.5}]},
{"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng?", "options": ["A. Liên kết cộng hóa trị chỉ tồn tại trong đơn chất.", "B. Liên kết cộng hóa trị tồn tại trong cả đơn chất và hợp chất.", "C. Liên kết cộng hóa trị không tồn tại trong hợp chất.", "D. Liên kết cộng hóa trị là liên kết ion."], "answer": "B", "explain": "Liên kết cộng hóa trị tồn tại trong cả đơn chất (ví dụ $H_2, Cl_2$) và hợp chất (ví dụ $HCl, H_2O, CH_4$).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các chất sau, chất nào là đơn chất cộng hóa trị?", "options": ["A. $NaCl$.", "B. $H_2O$.", "C. $O_3$.", "D. $CO_2$."], "answer": "C", "explain": "$O_3$ (ozone) là đơn chất (chỉ gồm nguyên tử O) có liên kết cộng hóa trị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chất sau, chất nào KHÔNG có liên kết cộng hóa trị?", "options": ["A. $HCl$.", "B. $NaCl$.", "C. $H_2O$.", "D. $NH_3$."], "answer": "B", "explain": "NaCl là hợp chất ion, liên kết trong NaCl là liên kết ion (lực hút tĩnh điện giữa $Na^+$ và $Cl^-$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây đúng về hợp chất cộng hóa trị?", "options": ["A. Có nhiệt độ nóng chảy cao.", "B. Dẫn điện tốt ở trạng thái rắn.", "C. Có nhiệt độ nóng chảy thấp và thường không dẫn điện.", "D. Luôn tan tốt trong nước."], "answer": "C", "explain": "Hợp chất cộng hóa trị có nhiệt độ nóng chảy, nhiệt độ sôi thấp và thường không dẫn điện.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 4,48 lít khí $H_2$ (đktc) tác dụng với $Cl_2$ dư. Khối lượng $HCl$ thu được là", "options": ["A. 7,3 gam.", "B. 14,6 gam.", "C. 3,65 gam.", "D. 36,5 gam."], "answer": "B", "explain": "Số mol $H_2 = 4{,}48/22{,}4 = 0{,}2$ mol. $H_2 + Cl_2 \\rightarrow 2HCl$. Số mol HCl = 0,4 mol, khối lượng = 0,4 nhân 36,5 = 14,6 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đốt cháy hoàn toàn 3,2 gam $CH_4$. Thể tích khí $CO_2$ thu được ở đktc là", "options": ["A. 2,24 lít.", "B. 4,48 lít.", "C. 6,72 lít.", "D. 1,12 lít."], "answer": "B", "explain": "Số mol $CH_4 = 3{,}2/16 = 0{,}2$ mol. $CH_4 + 2O_2 \\rightarrow CO_2 + 2H_2O$. Số mol $CO_2 = 0{,}2$ mol, thể tích = 0,2 nhân 22,4 = 4,48 lít.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $H_2$ có liên kết cộng hóa trị.", "b) $NaCl$ có liên kết cộng hóa trị.", "c) $HCl$ có liên kết cộng hóa trị.", "d) $MgO$ có liên kết cộng hóa trị."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: NaCl có liên kết ion. c) Đúng. d) Sai: MgO có liên kết ion.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đường ăn ($C_{12}H_{22}O_{11}$) là hợp chất cộng hóa trị.", "b) Đường ăn tan tốt trong nước.", "c) Đường ăn dẫn điện khi tan trong nước.", "d) Muối ăn ($NaCl$) là hợp chất ion."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: đường có nhiều nhóm -OH tạo liên kết hydrogen với nước. c) Sai: đường tan trong nước không phân li ra ion nên không dẫn điện. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Hiệu độ âm điện của liên kết $C-Cl$ là 0,61. Liên kết $C-Cl$ là liên kết cộng hóa trị có cực hay không cực?", "answer": "có cực", "explain": "$\\Delta\\chi = 0{,}61$ nằm trong khoảng từ 0,4 đến dưới 1,7 nên là liên kết cộng hóa trị có cực.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong phân tử $H_2SO_4$, nguyên tử $S$ cho bao nhiêu cặp electron để tạo liên kết cho nhận với các nguyên tử $O$?", "answer": "2", "explain": "Trong $H_2SO_4$, S tạo 2 liên kết cho nhận (S cho 2 cặp electron cho 2 nguyên tử O) và 2 liên kết cộng hóa trị thông thường với 2 nhóm -OH.", "points": 0.5}]}]}
