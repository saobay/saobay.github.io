{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Nội dung của quy tắc octet là", "options": ["A. các nguyên tử luôn có 8 electron.", "B. khi tạo thành liên kết hóa học, các nguyên tử có xu hướng đạt cấu hình electron bền vững với 8 electron lớp ngoài cùng.", "C. mọi nguyên tử đều nhường 8 electron.", "D. mọi nguyên tử đều nhận 8 electron."], "answer": "B", "explain": "Quy tắc octet: khi tạo thành liên kết hóa học, các nguyên tử có xu hướng nhường, nhận hoặc góp chung electron để đạt 8 electron ở lớp ngoài cùng (giống khí hiếm).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tử hydrogen khi tạo thành liên kết hóa học có xu hướng đạt cấu hình electron của", "options": ["A. $Ne$ với 8 electron lớp ngoài cùng.", "B. $He$ với 2 electron lớp ngoài cùng.", "C. $Ar$ với 8 electron lớp ngoài cùng.", "D. $Li$ với 1 electron lớp ngoài cùng."], "answer": "B", "explain": "Hydrogen là ngoại lệ của quy tắc octet: khi tạo liên kết, H có xu hướng đạt cấu hình của He với 2 electron (quy tắc duplet).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tử $Na$ (Z = 11) tạo thành ion $Na^+$ bằng cách", "options": ["A. nhận 1 electron.", "B. nhường 1 electron.", "C. nhận 7 electron.", "D. nhường 7 electron."], "answer": "B", "explain": "Na có 1 electron lớp ngoài cùng ($3s^1$), nhường 1 electron này để đạt cấu hình bền vững giống Ne ($1s^22s^22p^6$), tạo thành cation $Na^+$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tử $Cl$ (Z = 17) tạo thành ion $Cl^-$ bằng cách", "options": ["A. nhường 1 electron.", "B. nhận 1 electron.", "C. nhường 7 electron.", "D. nhận 7 electron."], "answer": "B", "explain": "Cl có 7 electron lớp ngoài cùng ($3s^23p^5$), nhận thêm 1 electron để đạt 8 electron lớp ngoài cùng giống Ar, tạo thành anion $Cl^-$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ion $X^{2+}$ có cấu hình electron giống khí hiếm $Ne$. Nguyên tố X là", "options": ["A. $Na$.", "B. $Mg$.", "C. $Al$.", "D. $K$."], "answer": "B", "explain": "Ion $X^{2+}$ có 10 electron (giống Ne) nên nguyên tử X có 12 electron, Z = 12, X là Mg.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hợp chất nào sau đây KHÔNG tuân theo quy tắc octet?", "options": ["A. $NaCl$.", "B. $MgO$.", "C. $BF_3$.", "D. $H_2O$."], "answer": "C", "explain": "Trong $BF_3$, nguyên tử B chỉ có 6 electron ở lớp ngoài cùng (3 liên kết với 3 nguyên tử F), không đạt 8 electron nên không tuân theo quy tắc octet.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cation là ion mang điện tích dương.", "b) Anion là ion mang điện tích âm.", "c) Kim loại có xu hướng nhường electron tạo cation.", "d) Phi kim có xu hướng nhường electron tạo anion."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: cation tạo thành khi nguyên tử nhường electron. b) Đúng: anion tạo thành khi nguyên tử nhận electron. c) Đúng. d) Sai: phi kim có xu hướng nhận electron tạo anion.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Na^+$ có cấu hình electron giống $Ne$.", "b) $Cl^-$ có cấu hình electron giống $Ar$.", "c) $O^{2-}$ có cấu hình electron giống $Ne$.", "d) $Mg^{2+}$ có cấu hình electron giống $Ar$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $Na^+$ có 10 electron giống Ne. b) Đúng: $Cl^-$ có 18 electron giống Ar. c) Đúng: $O^{2-}$ có 10 electron giống Ne. d) Sai: $Mg^{2+}$ có 10 electron nên giống Ne, không phải Ar.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tử $Al$ (Z = 13) nhường bao nhiêu electron để tạo thành ion $Al^{3+}$?", "answer": "3", "explain": "Al có 3 electron lớp ngoài cùng ($3s^23p^1$), nhường cả 3 electron để đạt cấu hình bền vững giống Ne, tạo thành $Al^{3+}$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ion $X^-$ có tổng số hạt proton, neutron, electron là 53, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 17. Số hiệu nguyên tử Z của X là bao nhiêu?", "answer": "17", "explain": "Gọi Z là số proton, N là số neutron của nguyên tử X. Ion $X^-$ có Z proton, N neutron, Z + 1 electron. Tổng hạt: $2Z + N + 1 = 53$. Hạt mang điện: $2Z + 1$, hơn hạt không mang điện (N) là 17: $2Z + 1 - N = 17$. Giải hệ: cộng hai phương trình được $4Z + 2 = 70$, suy ra Z = 17 (X là Cl).", "points": 0.5}]},
{"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Cation được tạo thành khi nguyên tử", "options": ["A. nhận electron.", "B. nhường electron.", "C. góp chung electron.", "D. không thay đổi số electron."], "answer": "B", "explain": "Cation (ion dương) được tạo thành khi nguyên tử nhường electron (số proton lớn hơn số electron).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Anion được tạo thành khi nguyên tử", "options": ["A. nhường electron.", "B. nhận electron.", "C. mất proton.", "D. nhận proton."], "answer": "B", "explain": "Anion (ion âm) được tạo thành khi nguyên tử nhận electron (số electron lớn hơn số proton).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ion nào sau đây có cấu hình electron giống khí hiếm $Ar$?", "options": ["A. $Na^+$.", "B. $Mg^{2+}$.", "C. $S^{2-}$.", "D. $O^{2-}$."], "answer": "C", "explain": "$S^{2-}$ có 18 electron (16 + 2), giống cấu hình của Ar ($1s^22s^22p^63s^23p^6$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để đạt cấu hình electron bền vững, nguyên tử $O$ (Z = 8) có xu hướng", "options": ["A. nhường 2 electron.", "B. nhận 2 electron.", "C. nhường 6 electron.", "D. nhận 6 electron."], "answer": "B", "explain": "O có 6 electron lớp ngoài cùng ($2s^22p^4$), nhận thêm 2 electron để đạt 8 electron lớp ngoài cùng giống Ne, tạo thành $O^{2-}$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho các ion: $Na^+, Mg^{2+}, Al^{3+}$. Ion nào có bán kính nhỏ nhất?", "options": ["A. $Na^+$.", "B. $Mg^{2+}$.", "C. $Al^{3+}$.", "D. Cả ba bằng nhau."], "answer": "C", "explain": "Cả ba ion đều có 10 electron (giống Ne) nhưng điện tích hạt nhân tăng dần (11, 12, 13) nên lực hút electron tăng dần, bán kính giảm dần: $Al^{3+}$ nhỏ nhất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tố X thuộc nhóm IIA, tạo cation $X^{2+}$ có cấu hình electron lớp ngoài cùng là $3s^23p^6$. X là nguyên tố nào?", "options": ["A. $Mg$.", "B. $Ca$.", "C. $Sr$.", "D. $Ba$."], "answer": "B", "explain": "Ion $X^{2+}$ có cấu hình $[Ne]3s^23p^6$ (giống Ar, 18 electron) nên nguyên tử X có 20 electron, Z = 20, X là Ca (nhóm IIA, chu kì 4).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $K^+$ được tạo thành khi nguyên tử K nhường 1 electron.", "b) $Br^-$ được tạo thành khi nguyên tử Br nhận 1 electron.", "c) $Ca^{2+}$ được tạo thành khi nguyên tử Ca nhận 2 electron.", "d) $N^{3-}$ được tạo thành khi nguyên tử N nhận 3 electron."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: $Ca^{2+}$ được tạo thành khi Ca nhường 2 electron. d) Đúng: N có 5 electron lớp ngoài cùng, nhận 3 electron để đạt octet.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về quy tắc octet:", "statements": ["a) $NaCl$ tuân theo quy tắc octet.", "b) $H_2O$ tuân theo quy tắc octet (O đạt 8e, H đạt 2e).", "c) $PCl_5$ tuân theo quy tắc octet.", "d) $SF_6$ không tuân theo quy tắc octet."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $Na^+$ giống Ne, $Cl^-$ giống Ar. b) Đúng: O có 8e xung quanh, mỗi H có 2e. c) Sai: P có 10 electron xung quanh. d) Đúng: S có 12 electron xung quanh.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết kí hiệu ion được tạo thành khi nguyên tử $Ca$ (Z = 20) nhường 2 electron.", "answer": "$Ca^{2+}$", "explain": "Ca nhường 2 electron lớp ngoài cùng ($4s^2$) để đạt cấu hình giống Ar, tạo thành cation $Ca^{2+}$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguyên tử X có 3 lớp electron, lớp ngoài cùng có 1 electron. Khi tạo liên kết, X nhường 1 electron tạo ion có cấu hình giống khí hiếm nào? (viết kí hiệu khí hiếm)", "answer": "$Ne$", "explain": "X là Na (3 lớp, 1e ngoài cùng). $Na^+$ có 10 electron, cấu hình giống Ne.", "points": 0.5}]},
{"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Quy tắc duplet áp dụng cho nguyên tử", "options": ["A. $Na$.", "B. $H$.", "C. $Cl$.", "D. $O$."], "answer": "B", "explain": "Quy tắc duplet: nguyên tử hydrogen khi tạo liên kết có xu hướng đạt 2 electron lớp ngoài cùng (giống He).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Điện tích của ion $Mg^{2+}$ cho biết nguyên tử $Mg$ đã", "options": ["A. nhận 2 electron.", "B. nhường 2 electron.", "C. nhận 2 proton.", "D. nhường 2 proton."], "answer": "B", "explain": "Ion $Mg^{2+}$ mang điện tích 2+ nghĩa là nguyên tử Mg đã nhường 2 electron (số proton hơn số electron là 2).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các ion sau, ion nào KHÔNG có cấu hình electron giống khí hiếm $Ne$?", "options": ["A. $F^-$.", "B. $O^{2-}$.", "C. $Na^+$.", "D. $Cl^-$."], "answer": "D", "explain": "$Cl^-$ có 18 electron nên có cấu hình giống Ar, không phải Ne. $F^-$ (10e), $O^{2-}$ (10e), $Na^+$ (10e) đều giống Ne.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tử $S$ (Z = 16) tạo thành ion $S^{2-}$. Cấu hình electron của $S^{2-}$ giống khí hiếm nào?", "options": ["A. $Ne$.", "B. $Ar$.", "C. $He$.", "D. $Kr$."], "answer": "B", "explain": "$S^{2-}$ có 18 electron (16 + 2), cấu hình $1s^22s^22p^63s^23p^6$, giống khí hiếm Ar.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai nguyên tố X, Y thuộc cùng chu kì 3. X tạo cation $X^+$ có cấu hình electron giống $Ne$, Y tạo anion $Y^-$ có cấu hình electron giống $Ar$. X và Y lần lượt là", "options": ["A. $Na$ và $F$.", "B. $Na$ và $Cl$.", "C. $Mg$ và $F$.", "D. $K$ và $Cl$."], "answer": "B", "explain": "Cation $X^+$ có 10 electron (giống Ne) nên X có 11 electron: Na (chu kì 3). Anion $Y^-$ có 18 electron (giống Ar) nên Y có 17 electron: Cl (chu kì 3).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tổng số hạt proton, neutron, electron trong ion $X^{2-}$ là 50. Biết X thuộc nhóm VIA. Số khối của X là", "options": ["A. 32.", "B. 34.", "C. 16.", "D. 36."], "answer": "A", "explain": "Gọi Z là số proton, N là số neutron. Ion $X^{2-}$ có Z proton, N neutron, Z + 2 electron. Tổng hạt: $2Z + N + 2 = 50$, suy ra $2Z + N = 48$. X thuộc nhóm VIA: thử Z = 16 (S) thì N = 16, số khối = 32. Phù hợp.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ion $Na^+$ có 10 electron.", "b) Ion $Cl^-$ có 18 electron.", "c) Nguyên tử $Na$ có 11 electron.", "d) Nguyên tử $Cl$ có 18 electron."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 11 - 1 = 10. b) Đúng: 17 + 1 = 18. c) Đúng: Z = 11. d) Sai: nguyên tử Cl có 17 electron (Z = 17).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Al^{3+}$ có cấu hình electron giống $Ne$.", "b) $N^{3-}$ có cấu hình electron giống $Ne$.", "c) $K^+$ có cấu hình electron giống $Ar$.", "d) $Ca^{2+}$ có cấu hình electron giống $Ne$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $Al^{3+}$ có 10 electron. b) Đúng: $N^{3-}$ có 10 electron. c) Đúng: $K^+$ có 18 electron giống Ar. d) Sai: $Ca^{2+}$ có 18 electron nên giống Ar.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tử $N$ (Z = 7) nhận bao nhiêu electron để tạo thành ion $N^{3-}$?", "answer": "3", "explain": "N có 5 electron lớp ngoài cùng, nhận thêm 3 electron để đạt 8 electron lớp ngoài cùng giống Ne, tạo thành $N^{3-}$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết công thức hợp chất tạo thành giữa $Mg^{2+}$ và $N^{3-}$.", "answer": "$Mg_3N_2$", "explain": "Để trung hòa điện tích: 3 ion $Mg^{2+}$ (tổng 6+) kết hợp với 2 ion $N^{3-}$ (tổng 6-) tạo thành $Mg_3N_2$.", "points": 0.5}]},
{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Khi tạo thành liên kết hóa học, nguyên tử $Mg$ (Z = 12) có xu hướng", "options": ["A. nhận 2 electron.", "B. nhường 2 electron.", "C. nhận 6 electron.", "D. nhường 6 electron."], "answer": "B", "explain": "Mg có 2 electron lớp ngoài cùng ($3s^2$), nhường 2 electron để đạt cấu hình bền vững giống Ne, tạo thành $Mg^{2+}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi tạo thành liên kết hóa học, nguyên tử $F$ (Z = 9) có xu hướng", "options": ["A. nhường 1 electron.", "B. nhận 1 electron.", "C. nhường 7 electron.", "D. nhận 7 electron."], "answer": "B", "explain": "F có 7 electron lớp ngoài cùng ($2s^22p^5$), nhận thêm 1 electron để đạt 8 electron lớp ngoài cùng giống Ne, tạo thành $F^-$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số electron lớp ngoài cùng của $Na^+$ và $Cl^-$ lần lượt là", "options": ["A. 1 và 7.", "B. 8 và 8.", "C. 10 và 18.", "D. 7 và 1."], "answer": "B", "explain": "$Na^+$ có cấu hình giống Ne ($1s^22s^22p^6$) với 8 electron lớp ngoài cùng; $Cl^-$ có cấu hình giống Ar ($[Ne]3s^23p^6$) với 8 electron lớp ngoài cùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây đúng về quy tắc octet?", "options": ["A. Mọi hợp chất đều tuân theo quy tắc octet.", "B. Quy tắc octet là quy tắc kinh nghiệm, có một số ngoại lệ.", "C. Quy tắc octet chỉ áp dụng cho kim loại.", "D. Quy tắc octet chỉ áp dụng cho hydrogen."], "answer": "B", "explain": "Quy tắc octet là quy tắc kinh nghiệm, đúng với đa số hợp chất nhưng có ngoại lệ như $BF_3, PCl_5, SF_6$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tử X có Z = 20. Khi tạo ion, X có xu hướng tạo thành ion nào sau đây?", "options": ["A. $X^{2+}$.", "B. $X^{2-}$.", "C. $X^+$.", "D. $X^-$."], "answer": "A", "explain": "X là Ca (Z = 20), có 2 electron lớp ngoài cùng ($4s^2$), nhường 2 electron để đạt cấu hình giống Ar, tạo thành $Ca^{2+}$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ion $X^{2+}$ và ion $Y^-$ đều có cấu hình electron giống $Ne$. Biết X thuộc chu kì 3. X và Y là", "options": ["A. $Mg$ và $F$.", "B. $Na$ và $Cl$.", "C. $Ca$ và $F$.", "D. $Mg$ và $Cl$."], "answer": "A", "explain": "Ion $X^{2+}$ có 10 electron nên X có 12 electron: Mg (chu kì 3). Ion $Y^-$ có 10 electron nên Y có 9 electron: F.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nguyên tử $O$ nhận 2 electron tạo $O^{2-}$.", "b) Nguyên tử $S$ nhận 2 electron tạo $S^{2-}$.", "c) Nguyên tử $N$ nhận 3 electron tạo $N^{3-}$.", "d) Nguyên tử $C$ nhận 4 electron tạo $C^{4-}$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: O có 6e ngoài cùng, nhận 2e để đạt octet. b) Đúng: tương tự. c) Đúng: N có 5e ngoài cùng, nhận 3e để đạt octet. d) Đúng về mặt xu hướng octet (C có 4e ngoài cùng), tuy nhiên trong thực tế C thường góp chung electron hơn là tạo $C^{4-}$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Li^+$ có 2 electron.", "b) $Be^{2+}$ có 2 electron.", "c) $H^-$ có 2 electron.", "d) $He$ có 2 electron lớp ngoài cùng."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: Li (3e) nhường 1e còn 2e (giống He). b) Đúng: Be (4e) nhường 2e còn 2e. c) Đúng: H (1e) nhận 1e thành 2e (giống He). d) Đúng: cấu hình $1s^2$.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết kí hiệu ion tạo thành khi nguyên tử $Br$ (Z = 35) nhận 1 electron.", "answer": "$Br^-$", "explain": "Br có 7 electron lớp ngoài cùng, nhận thêm 1 electron để đạt 8 electron lớp ngoài cùng giống Kr, tạo thành $Br^-$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết công thức hợp chất tạo thành giữa $Al^{3+}$ và $O^{2-}$.", "answer": "$Al_2O_3$", "explain": "Để trung hòa điện tích: 2 ion $Al^{3+}$ (tổng 6+) kết hợp với 3 ion $O^{2-}$ (tổng 6-) tạo thành $Al_2O_3$.", "points": 0.5}]},
{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Số electron ở lớp ngoài cùng của khí hiếm $Ne$ là", "options": ["A. 2.", "B. 8.", "C. 10.", "D. 18."], "answer": "B", "explain": "Ne có cấu hình $1s^22s^22p^6$, lớp ngoài cùng (lớp thứ 2) có 8 electron bền vững.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Số electron ở lớp ngoài cùng của khí hiếm $He$ là", "options": ["A. 1.", "B. 2.", "C. 8.", "D. 4."], "answer": "B", "explain": "He có cấu hình $1s^2$, lớp ngoài cùng (cũng là lớp duy nhất) có 2 electron bền vững.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để có cấu hình electron bền vững giống khí hiếm, nguyên tử $K$ (Z = 19) sẽ", "options": ["A. nhường 1 electron tạo $K^+$.", "B. nhận 1 electron tạo $K^-$.", "C. nhường 7 electron tạo $K^{7+}$.", "D. nhận 7 electron tạo $K^{7-}$."], "answer": "A", "explain": "K có 1 electron lớp ngoài cùng ($4s^1$), nhường 1 electron để đạt cấu hình giống Ar, tạo thành $K^+$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ion $O^{2-}$ có số electron là", "options": ["A. 6.", "B. 8.", "C. 10.", "D. 16."], "answer": "C", "explain": "Nguyên tử O có 8 electron (Z = 8), nhận thêm 2 electron nên ion $O^{2-}$ có 10 electron.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho các ion: $N^{3-}, O^{2-}, F^-, Na^+$. Dãy sắp xếp theo chiều tăng dần của số proton là", "options": ["A. $N^{3-} \\lt O^{2-} \\lt F^- \\lt Na^+$.", "B. $Na^+ \\lt F^- \\lt O^{2-} \\lt N^{3-}$.", "C. $F^- \\lt O^{2-} \\lt N^{3-} \\lt Na^+$.", "D. $O^{2-} \\lt N^{3-} \\lt F^- \\lt Na^+$."], "answer": "A", "explain": "Số proton của các ion: $N^{3-}$ (7), $O^{2-}$ (8), $F^-$ (9), $Na^+$ (11). Thứ tự tăng dần là $N^{3-}$, $O^{2-}$, $F^-$, $Na^+$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tố X có cấu hình electron $1s^22s^22p^63s^23p^64s^2$. Khi tạo ion, X tạo thành", "options": ["A. $X^{2+}$ có cấu hình giống $Ar$.", "B. $X^{2-}$ có cấu hình giống $Kr$.", "C. $X^+$ có cấu hình giống $Ar$.", "D. $X^{4+}$ có cấu hình giống $Ne$."], "answer": "A", "explain": "X là Ca (Z = 20), có 2 electron lớp ngoài cùng, nhường 2 electron tạo $Ca^{2+}$ có 18 electron, cấu hình giống Ar.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Na$ có 1 electron lớp ngoài cùng.", "b) $Mg$ có 2 electron lớp ngoài cùng.", "c) $Al$ có 3 electron lớp ngoài cùng.", "d) $Si$ có 3 electron lớp ngoài cùng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $3s^1$. b) Đúng: $3s^2$. c) Đúng: $3s^23p^1$. d) Sai: Si có 4 electron lớp ngoài cùng ($3s^23p^2$).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $P$ có 5 electron lớp ngoài cùng.", "b) $S$ có 6 electron lớp ngoài cùng.", "c) $Cl$ có 7 electron lớp ngoài cùng.", "d) $Ar$ có 7 electron lớp ngoài cùng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $3s^23p^3$. b) Đúng: $3s^23p^4$. c) Đúng: $3s^23p^5$. d) Sai: Ar có 8 electron lớp ngoài cùng ($3s^23p^6$).", "points": 1}, {"type": "short", "level": "VD", "q": "Ion $Na^+$ có bao nhiêu electron?", "answer": "10", "explain": "Nguyên tử Na có 11 electron, nhường 1 electron nên $Na^+$ có 10 electron (giống Ne).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết công thức hợp chất tạo thành giữa $Na^+$ và $O^{2-}$.", "answer": "$Na_2O$", "explain": "Để trung hòa điện tích: 2 ion $Na^+$ (tổng 2+) kết hợp với 1 ion $O^{2-}$ (2-) tạo thành $Na_2O$.", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng?", "options": ["A. Cation mang điện tích âm.", "B. Anion mang điện tích dương.", "C. Cation mang điện tích dương, anion mang điện tích âm.", "D. Cation và anion đều mang điện tích dương."], "answer": "C", "explain": "Cation được tạo thành khi nguyên tử nhường electron nên mang điện tích dương; anion được tạo thành khi nguyên tử nhận electron nên mang điện tích âm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tử nào sau đây có xu hướng nhường electron khi tạo thành liên kết hóa học?", "options": ["A. $O$.", "B. $F$.", "C. $Na$.", "D. $Cl$."], "answer": "C", "explain": "Na là kim loại (nhóm IA), có 1 electron lớp ngoài cùng nên có xu hướng nhường electron tạo cation. O, F, Cl là phi kim, có xu hướng nhận electron.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ion $Cl^-$ có cấu hình electron $1s^22s^22p^63s^23p^6$. Số electron lớp ngoài cùng của $Cl^-$ là", "options": ["A. 7.", "B. 8.", "C. 17.", "D. 18."], "answer": "B", "explain": "Lớp ngoài cùng của $Cl^-$ là lớp thứ 3 ($3s^23p^6$) với 8 electron, đạt octet bền vững.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các hợp chất sau, hợp chất nào có nguyên tử trung tâm không đạt octet?", "options": ["A. $CH_4$.", "B. $NH_3$.", "C. $PCl_5$.", "D. $H_2O$."], "answer": "C", "explain": "Trong $PCl_5$, nguyên tử P có 10 electron ở lớp ngoài cùng (5 liên kết), vượt quá 8 nên không tuân theo quy tắc octet.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X thuộc nhóm IA, nguyên tố Y thuộc nhóm VIIA, cả hai thuộc chu kì 3. Hợp chất tạo thành giữa X và Y là", "options": ["A. $XY_2$.", "B. $X_2Y$.", "C. $XY$.", "D. $X_2Y_3$."], "answer": "C", "explain": "X là Na (nhường 1e tạo $Na^+$), Y là Cl (nhận 1e tạo $Cl^-$). Tỉ lệ 1:1 tạo thành NaCl (dạng XY).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho các ion có cùng số electron là 10: $N^{3-}, O^{2-}, F^-, Na^+, Mg^{2+}, Al^{3+}$. Sắp xếp theo chiều tăng dần của bán kính ion là", "options": ["A. $Al^{3+} \\lt Mg^{2+} \\lt Na^+ \\lt F^- \\lt O^{2-} \\lt N^{3-}$.", "B. $N^{3-} \\lt O^{2-} \\lt F^- \\lt Na^+ \\lt Mg^{2+} \\lt Al^{3+}$.", "C. $F^- \\lt Na^+ \\lt O^{2-} \\lt Mg^{2+} \\lt N^{3-} \\lt Al^{3+}$.", "D. $Na^+ \\lt Mg^{2+} \\lt Al^{3+} \\lt F^- \\lt O^{2-} \\lt N^{3-}$."], "answer": "A", "explain": "Các ion có cùng 10 electron nhưng điện tích hạt nhân tăng dần theo thứ tự: N (7), O (8), F (9), Na (11), Mg (12), Al (13). Điện tích hạt nhân càng lớn thì lực hút electron càng mạnh, bán kính càng nhỏ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Ca^{2+}$ có 18 electron.", "b) $K^+$ có 18 electron.", "c) $S^{2-}$ có 18 electron.", "d) $Cl^-$ có 10 electron."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 20 - 2 = 18. b) Đúng: 19 - 1 = 18. c) Đúng: 16 + 2 = 18. d) Sai: $Cl^-$ có 17 + 1 = 18 electron.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bán kính của $Na^+$ nhỏ hơn bán kính của $Na$.", "b) Bán kính của $Cl^-$ lớn hơn bán kính của $Cl$.", "c) Bán kính của $Mg^{2+}$ nhỏ hơn bán kính của $Na^+$.", "d) Bán kính của $S^{2-}$ nhỏ hơn bán kính của $Cl^-$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: cation nhỏ hơn nguyên tử. b) Đúng: anion lớn hơn nguyên tử. c) Đúng: cùng 10 electron nhưng $Mg^{2+}$ có Z lớn hơn. d) Sai: $S^{2-}$ (Z = 16) có bán kính lớn hơn $Cl^-$ (Z = 17) vì điện tích hạt nhân nhỏ hơn.", "points": 1}, {"type": "short", "level": "VD", "q": "Ion $F^-$ có bao nhiêu electron lớp ngoài cùng?", "answer": "8", "explain": "$F^-$ có cấu hình $1s^22s^22p^6$ (giống Ne), lớp ngoài cùng có 8 electron.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết công thức hợp chất tạo thành giữa $K^+$ và $S^{2-}$.", "answer": "$K_2S$", "explain": "Để trung hòa điện tích: 2 ion $K^+$ (tổng 2+) kết hợp với 1 ion $S^{2-}$ (2-) tạo thành $K_2S$.", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên tử $Al$ (Z = 13) có bao nhiêu electron lớp ngoài cùng?", "options": ["A. 1.", "B. 2.", "C. 3.", "D. 13."], "answer": "C", "explain": "Cấu hình Al: $1s^22s^22p^63s^23p^1$, lớp ngoài cùng (lớp thứ 3) có 3 electron.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tử $P$ (Z = 15) có bao nhiêu electron lớp ngoài cùng?", "options": ["A. 3.", "B. 5.", "C. 7.", "D. 15."], "answer": "B", "explain": "Cấu hình P: $1s^22s^22p^63s^23p^3$, lớp ngoài cùng có 5 electron.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi tạo thành ion, nguyên tử nào sau đây tạo thành anion?", "options": ["A. $Na$.", "B. $Mg$.", "C. $O$.", "D. $Al$."], "answer": "C", "explain": "O là phi kim (nhóm VIA), có xu hướng nhận 2 electron tạo anion $O^{2-}$. Na, Mg, Al là kim loại, tạo cation.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cấu hình electron của $Na^+$ là", "options": ["A. $1s^22s^22p^63s^1$.", "B. $1s^22s^22p^6$.", "C. $1s^22s^22p^63s^23p^6$.", "D. $1s^2$."], "answer": "B", "explain": "Na (Z = 11) nhường 1 electron lớp ngoài cùng ($3s^1$) nên $Na^+$ còn 10 electron với cấu hình $1s^22s^22p^6$ (giống Ne).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X thuộc chu kì 4, nhóm IIA. Ion $X^{2+}$ có cấu hình electron giống khí hiếm nào?", "options": ["A. $Ne$.", "B. $Ar$.", "C. $Kr$.", "D. $He$."], "answer": "B", "explain": "X là Ca (Z = 20). $Ca^{2+}$ có 18 electron, cấu hình $1s^22s^22p^63s^23p^6$, giống khí hiếm Ar.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho biết tổng số hạt trong nguyên tử X là 40, số hạt mang điện nhiều hơn số hạt không mang điện là 12. Khi tạo ion, X có xu hướng tạo thành ion nào?", "options": ["A. $X^+$.", "B. $X^{2+}$.", "C. $X^{3+}$.", "D. $X^-$."], "answer": "C", "explain": "Gọi Z là số proton, N là số neutron: $2Z + N = 40$ và $2Z - N = 12$, giải ra Z = 13, N = 14. X là Al (nhóm IIIA), có 3 electron lớp ngoài cùng nên nhường 3 electron tạo $Al^{3+}$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Mg^{2+}$ được tạo thành khi Mg nhường 2 electron.", "b) $O^{2-}$ được tạo thành khi O nhận 2 electron.", "c) $Al^{3+}$ được tạo thành khi Al nhận 3 electron.", "d) $N^{3-}$ được tạo thành khi N nhận 3 electron."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: $Al^{3+}$ được tạo thành khi Al nhường 3 electron. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong $NaCl$, $Na^+$ đạt octet còn $Cl^-$ đạt octet.", "b) Trong $MgO$, $Mg^{2+}$ và $O^{2-}$ đều đạt octet.", "c) Trong $CaF_2$, $Ca^{2+}$ và $F^-$ đều đạt octet.", "d) Trong $BF_3$, nguyên tử B đạt octet."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $Na^+$ giống Ne, $Cl^-$ giống Ar. b) Đúng: cả hai đều giống Ne. c) Đúng: $Ca^{2+}$ giống Ar, $F^-$ giống Ne. d) Sai: B chỉ có 6 electron xung quanh.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết phương trình tạo thành ion $Mg^{2+}$ từ nguyên tử $Mg$ (dạng text, ví dụ: Na thành Na+ + 1e).", "answer": "Mg thành Mg2+ + 2e", "explain": "Nguyên tử Mg nhường 2 electron lớp ngoài cùng để đạt cấu hình giống Ne: Mg thành $Mg^{2+}$ + 2e.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết công thức hợp chất tạo thành giữa $Ca^{2+}$ và $Cl^-$.", "answer": "$CaCl_2$", "explain": "Để trung hòa điện tích: 1 ion $Ca^{2+}$ (2+) kết hợp với 2 ion $Cl^-$ (tổng 2-) tạo thành $CaCl_2$.", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các nguyên tử sau, nguyên tử nào đã đạt cấu hình electron bền vững mà không cần tạo liên kết?", "options": ["A. $Na$.", "B. $Ne$.", "C. $Cl$.", "D. $O$."], "answer": "B", "explain": "Ne là khí hiếm, đã có 8 electron lớp ngoài cùng bền vững nên không cần tạo liên kết để đạt octet.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Lớp electron ngoài cùng bền vững của các khí hiếm (trừ He) có bao nhiêu electron?", "options": ["A. 2.", "B. 4.", "C. 6.", "D. 8."], "answer": "D", "explain": "Các khí hiếm (trừ He) có lớp ngoài cùng bền vững với 8 electron (octet).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tử $X$ có 7 electron lớp ngoài cùng. Khi tạo liên kết, X có xu hướng", "options": ["A. nhường 7 electron.", "B. nhận 1 electron.", "C. nhường 1 electron.", "D. nhận 7 electron."], "answer": "B", "explain": "Nguyên tử có 7 electron lớp ngoài cùng (nhóm VIIA) chỉ cần nhận thêm 1 electron là đạt octet, dễ hơn nhiều so với nhường 7 electron.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tử $Y$ có 2 electron lớp ngoài cùng. Khi tạo liên kết, Y có xu hướng", "options": ["A. nhận 6 electron.", "B. nhường 2 electron.", "C. nhận 2 electron.", "D. nhường 6 electron."], "answer": "B", "explain": "Nguyên tử có 2 electron lớp ngoài cùng (nhóm IIA, kim loại) có xu hướng nhường 2 electron để đạt cấu hình khí hiếm, tạo cation $Y^{2+}$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho các nguyên tố: X (Z = 3), Y (Z = 9). Dự đoán hợp chất tạo thành giữa X và Y:", "options": ["A. $XY$.", "B. $X_2Y$.", "C. $XY_2$.", "D. $X_2Y_3$."], "answer": "A", "explain": "X là Li (nhường 1e tạo $Li^+$), Y là F (nhận 1e tạo $F^-$). Tỉ lệ 1:1 tạo thành LiF (dạng XY).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ion $X^+$ có tổng số hạt proton, neutron, electron là 32, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 10. X là nguyên tố nào?", "options": ["A. $Na$.", "B. $K$.", "C. $Li$.", "D. $Mg$."], "answer": "A", "explain": "Gọi Z là số proton, N là số neutron của nguyên tử X. Ion $X^+$ có Z proton, N neutron, Z - 1 electron. Tổng hạt: $2Z + N - 1 = 32$, suy ra $2Z + N = 33$. Hạt mang điện ($2Z - 1$) hơn hạt không mang điện (N) là 10: $2Z - N = 11$. Cộng hai phương trình: $4Z = 44$, suy ra Z = 11. X là Na.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $H_2$ tuân theo quy tắc duplet.", "b) $Cl_2$ tuân theo quy tắc octet.", "c) $N_2$ tuân theo quy tắc octet.", "d) $O_2$ không tuân theo quy tắc octet."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: mỗi H có 2e (giống He). b) Đúng: mỗi Cl có 8e xung quanh. c) Đúng: mỗi N có 8e xung quanh (3 liên kết + 1 cặp riêng). d) Sai: mỗi O có 8e xung quanh (2 liên kết + 2 cặp riêng).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số oxi hóa của $Na$ trong $NaCl$ là +1.", "b) Số oxi hóa của $Cl$ trong $NaCl$ là -1.", "c) Số oxi hóa của $Mg$ trong $MgO$ là +2.", "d) Số oxi hóa của $O$ trong $MgO$ là -2."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: Na nhường 1e. b) Đúng: Cl nhận 1e. c) Đúng: Mg nhường 2e. d) Đúng: O nhận 2e.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết kí hiệu ion tạo thành khi nguyên tử $O$ nhận 2 electron.", "answer": "$O^{2-}$", "explain": "O nhận 2 electron để đạt 8 electron lớp ngoài cùng giống Ne, tạo thành anion $O^{2-}$ (oxide).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết công thức hợp chất tạo thành giữa $Ba^{2+}$ và $Br^-$.", "answer": "$BaBr_2$", "explain": "Để trung hòa điện tích: 1 ion $Ba^{2+}$ (2+) kết hợp với 2 ion $Br^-$ (tổng 2-) tạo thành $BaBr_2$.", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các ion sau, ion nào có 10 electron?", "options": ["A. $Cl^-$.", "B. $S^{2-}$.", "C. $F^-$.", "D. $K^+$."], "answer": "C", "explain": "$F^-$ có 9 + 1 = 10 electron. $Cl^-$ và $S^{2-}$ có 18 electron; $K^+$ có 18 electron.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các ion sau, ion nào có 18 electron?", "options": ["A. $Na^+$.", "B. $Mg^{2+}$.", "C. $Cl^-$.", "D. $F^-$."], "answer": "C", "explain": "$Cl^-$ có 17 + 1 = 18 electron. $Na^+$ và $Mg^{2+}$ có 10 electron; $F^-$ có 10 electron.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tử $X$ có Z = 19. Khi tạo thành liên kết, X tạo thành ion", "options": ["A. $X^+$ có cấu hình giống $Ar$.", "B. $X^-$ có cấu hình giống $Ar$.", "C. $X^{2+}$ có cấu hình giống $Ne$.", "D. $X^+$ có cấu hình giống $Ne$."], "answer": "A", "explain": "X là K (Z = 19), có 1 electron lớp ngoài cùng, nhường 1 electron tạo $K^+$ có 18 electron, cấu hình giống Ar.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tử $Y$ có Z = 35. Khi tạo thành liên kết, Y tạo thành ion", "options": ["A. $Y^+$ có cấu hình giống $Kr$.", "B. $Y^-$ có cấu hình giống $Kr$.", "C. $Y^{2-}$ có cấu hình giống $Kr$.", "D. $Y^-$ có cấu hình giống $Ar$."], "answer": "B", "explain": "Y là Br (Z = 35), có 7 electron lớp ngoài cùng, nhận 1 electron tạo $Br^-$ có 36 electron, cấu hình giống Kr.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho nguyên tố X (Z = 12) và Y (Z = 8). Hợp chất tạo thành giữa X và Y là", "options": ["A. $XY$.", "B. $X_2Y$.", "C. $XY_2$.", "D. $X_2Y_3$."], "answer": "A", "explain": "X là Mg (nhường 2e tạo $Mg^{2+}$), Y là O (nhận 2e tạo $O^{2-}$). Tỉ lệ 1:1 tạo thành MgO (dạng XY).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tử R có tổng số hạt proton, neutron, electron là 36, số hạt mang điện nhiều hơn số hạt không mang điện là 12. Khi tạo liên kết, R tạo thành ion $R^{2+}$. Cấu hình electron của $R^{2+}$ giống khí hiếm nào?", "options": ["A. $He$.", "B. $Ne$.", "C. $Ar$.", "D. $Kr$."], "answer": "B", "explain": "Gọi Z là số proton, N là số neutron: $2Z + N = 36$ và $2Z - N = 12$, giải ra Z = 12, N = 12. R là Mg, tạo $Mg^{2+}$ có 10 electron, cấu hình giống Ne.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Na^+$ và $Ne$ có cùng số electron.", "b) $Mg^{2+}$ và $Ne$ có cùng số electron.", "c) $Al^{3+}$ và $Ne$ có cùng số electron.", "d) $Si^{4+}$ và $Ne$ có cùng số electron."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: 10 electron. b) Đúng: 10 electron. c) Đúng: 10 electron. d) Đúng: Si (14e) nhường 4e còn 10e (giống Ne).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $K^+$ và $Ar$ có cùng số electron.", "b) $Ca^{2+}$ và $Ar$ có cùng số electron.", "c) $Cl^-$ và $Ar$ có cùng số electron.", "d) $S^{2-}$ và $Ar$ có cùng số electron."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: 18 electron. b) Đúng: 18 electron. c) Đúng: 18 electron. d) Đúng: 18 electron.", "points": 1}, {"type": "short", "level": "VD", "q": "Ion $Al^{3+}$ có bao nhiêu electron?", "answer": "10", "explain": "Nguyên tử Al có 13 electron, nhường 3 electron nên $Al^{3+}$ có 10 electron (giống Ne).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết công thức hợp chất tạo thành giữa $Mg^{2+}$ và $Cl^-$.", "answer": "$MgCl_2$", "explain": "Để trung hòa điện tích: 1 ion $Mg^{2+}$ (2+) kết hợp với 2 ion $Cl^-$ (tổng 2-) tạo thành $MgCl_2$.", "points": 0.5}]},
{"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Khi tạo thành ion, các nguyên tử kim loại nhóm IA, IIA, IIIA thường tạo thành ion có điện tích lần lượt là", "options": ["A. 1+, 2+, 3+.", "B. 1-, 2-, 3-.", "C. 3+, 2+, 1+.", "D. 1+, 1+, 1+."], "answer": "A", "explain": "Kim loại nhóm IA (1e ngoài cùng) nhường 1e tạo ion 1+; nhóm IIA (2e) nhường 2e tạo ion 2+; nhóm IIIA (3e) nhường 3e tạo ion 3+.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi tạo thành ion, các nguyên tử phi kim nhóm VIA, VIIA thường tạo thành ion có điện tích lần lượt là", "options": ["A. 2+, 1+.", "B. 2-, 1-.", "C. 6-, 7-.", "D. 2+, 1-."], "answer": "B", "explain": "Phi kim nhóm VIA (6e ngoài cùng) nhận 2e tạo ion 2-; nhóm VIIA (7e) nhận 1e tạo ion 1-.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dãy nào sau đây gồm các ion đều có cấu hình electron giống $Ne$?", "options": ["A. $Na^+, Mg^{2+}, Al^{3+}, O^{2-}, F^-$.", "B. $K^+, Ca^{2+}, Cl^-, S^{2-}$.", "C. $Na^+, K^+, F^-, Cl^-$.", "D. $Mg^{2+}, Ca^{2+}, O^{2-}, S^{2-}$."], "answer": "A", "explain": "Các ion trong dãy A đều có 10 electron (giống Ne). Dãy B gồm các ion 18 electron (giống Ar).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dãy nào sau đây gồm các ion đều có cấu hình electron giống $Ar$?", "options": ["A. $Na^+, Mg^{2+}, F^-, O^{2-}$.", "B. $K^+, Ca^{2+}, Cl^-, S^{2-}$.", "C. $Li^+, Be^{2+}, H^-, He$.", "D. $Na^+, Ca^{2+}, F^-, S^{2-}$."], "answer": "B", "explain": "Các ion trong dãy B đều có 18 electron (giống Ar). Dãy A gồm các ion 10 electron (giống Ne).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X (Z = 16) kết hợp với nguyên tố Y (Z = 11). Hợp chất tạo thành là", "options": ["A. $XY$.", "B. $X_2Y$.", "C. $XY_2$.", "D. $Y_2X$."], "answer": "D", "explain": "X là S (nhận 2e tạo $S^{2-}$), Y là Na (nhường 1e tạo $Na^+$). Để trung hòa điện tích: 2 ion $Na^+$ kết hợp với 1 ion $S^{2-}$ tạo thành $Na_2S$ (dạng $Y_2X$).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho các nguyên tố A (Z = 20), B (Z = 9). Hợp chất tạo thành giữa A và B là", "options": ["A. $AB$.", "B. $AB_2$.", "C. $A_2B$.", "D. $A_2B_3$."], "answer": "B", "explain": "A là Ca (nhường 2e tạo $Ca^{2+}$), B là F (nhận 1e tạo $F^-$). Để trung hòa điện tích: 1 ion $Ca^{2+}$ kết hợp với 2 ion $F^-$ tạo thành $CaF_2$ (dạng $AB_2$).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $NaCl$ là hợp chất ion.", "b) Trong $NaCl$, $Na$ tồn tại ở dạng $Na^+$.", "c) Trong $NaCl$, $Cl$ tồn tại ở dạng $Cl^-$.", "d) $NaCl$ là hợp chất cộng hóa trị."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: tạo thành do lực hút giữa $Na^+$ và $Cl^-$. b) Đúng. c) Đúng. d) Sai: NaCl là hợp chất ion.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $MgO$ là hợp chất ion.", "b) $CaCl_2$ là hợp chất ion.", "c) $KBr$ là hợp chất ion.", "d) $HCl$ là hợp chất ion."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $Mg^{2+}$ và $O^{2-}$. b) Đúng: $Ca^{2+}$ và $Cl^-$. c) Đúng: $K^+$ và $Br^-$. d) Sai: HCl là hợp chất cộng hóa trị có cực.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hợp chất tạo thành giữa $Li^+$ và $F^-$.", "answer": "$LiF$", "explain": "1 ion $Li^+$ (1+) kết hợp với 1 ion $F^-$ (1-) tạo thành LiF.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết công thức hợp chất tạo thành giữa $Sr^{2+}$ và $I^-$.", "answer": "$SrI_2$", "explain": "Để trung hòa điện tích: 1 ion $Sr^{2+}$ (2+) kết hợp với 2 ion $I^-$ (tổng 2-) tạo thành $SrI_2$.", "points": 0.5}]}]}
