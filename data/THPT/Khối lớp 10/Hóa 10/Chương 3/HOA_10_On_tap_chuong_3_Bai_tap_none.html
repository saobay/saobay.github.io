ó liên kết ba (3 cặp electron dùng chung).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân tử nào sau đây có liên kết đôi?", "options": ["A. $H_2$.", "B. $N_2$.", "C. $O_2$.", "D. $Cl_2$."], "answer": "C", "explain": "Phân tử $O_2$ có liên kết đôi (2 cặp electron dùng chung).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết độ âm điện: $Al$ (1,61), $O$ (3,44). Liên kết $Al-O$ là", "options": ["A. liên kết ion.", "B. liên kết cộng hóa trị không cực.", "C. liên kết cộng hóa trị có cực.", "D. liên kết hydrogen."], "answer": "A", "explain": "Hiệu độ âm điện = 3,44 - 1,61 = 1,83, lớn hơn hoặc bằng 1,7 nên là liên kết ion.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nhiệt độ sôi của $H_2O$ ($100^\\circ C$) cao hơn hẳn $H_2S$ ($-60^\\circ C$). Nguyên nhân là do", "options": ["A. $H_2O$ là hợp chất ion.", "B. giữa các phân tử $H_2O$ có liên kết hydrogen.", "C. $H_2S$ có khối lượng phân tử lớn hơn.", "D. $H_2O$ không phân cực."], "answer": "B", "explain": "Giữa các phân tử nước tồn tại liên kết hydrogen O-H···O khá bền nên nước có nhiệt độ sôi cao bất thường.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $N_2$ có liên kết ba.", "b) $O_2$ có liên kết đôi.", "c) $H_2$ có liên kết đơn.", "d) $Cl_2$ có liên kết đôi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $Cl_2$ có liên kết đơn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Liên kết ba bền hơn liên kết đôi.", "b) Liên kết đôi bền hơn liên kết đơn.", "c) Liên kết ba ngắn hơn liên kết đơn.", "d) Liên kết đơn bền hơn liên kết ba."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: càng nhiều cặp electron chung thì liên kết càng ngắn. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong phân tử $CO_2$ (O=C=O), có bao nhiêu liên kết đôi?", "answer": "2", "explain": "Phân tử $CO_2$ có 2 liên kết đôi C=O.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hiệu độ âm điện của liên kết $H-Cl$ là 0,96. Liên kết $H-Cl$ là liên kết cộng hóa trị có cực hay không cực?", "answer": "cộng hóa trị có cực", "explain": "Hiệu độ âm điện 0,96 nằm trong khoảng từ 0,4 đến nhỏ hơn 1,7 nên liên kết $H-Cl$ là liên kết cộng hóa trị có cực.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Cation là", "options": ["A. ion mang điện tích dương.", "B. ion mang điện tích âm.", "C. nguyên tử trung hòa.", "D. phân tử trung hòa."], "answer": "A", "explain": "Cation là ion mang điện tích dương, được tạo thành khi nguyên tử nhường electron.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Anion là", "options": ["A. ion mang điện tích dương.", "B. ion mang điện tích âm.", "C. nguyên tử trung hòa.", "D. phân tử trung hòa."], "answer": "B", "explain": "Anion là ion mang điện tích âm, được tạo thành khi nguyên tử nhận electron.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ion $Ca^{2+}$ có bao nhiêu electron? (Biết Ca có Z = 20)", "options": ["A. 20.", "B. 18.", "C. 22.", "D. 10."], "answer": "B", "explain": "Nguyên tử Ca có 20 electron, nhường 2 electron tạo thành $Ca^{2+}$ nên còn 18 electron.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ion $S^{2-}$ có bao nhiêu electron? (Biết S có Z = 16)", "options": ["A. 16.", "B. 14.", "C. 18.", "D. 8."], "answer": "C", "explain": "Nguyên tử S có 16 electron, nhận 2 electron tạo thành $S^{2-}$ nên có 18 electron.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X (Z = 12) kết hợp với nguyên tố Y (Z = 9). Công thức hợp chất tạo thành là", "options": ["A. $XY$.", "B. $XY_2$.", "C. $X_2Y$.", "D. $X_2Y_3$."], "answer": "B", "explain": "X là Mg (tạo $Mg^{2+}$), Y là F (tạo $F^-$). 1 ion $Mg^{2+}$ kết hợp với 2 ion $F^-$ tạo thành $MgF_2$ (dạng $XY_2$).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 11,2 gam $CaO$ tác dụng hết với nước. Khối lượng $Ca(OH)_2$ thu được là", "options": ["A. 14,8 gam.", "B. 7,4 gam.", "C. 29,6 gam.", "D. 18,5 gam."], "answer": "A", "explain": "Số mol CaO = 11,2/56 = 0,2 mol. CaO + $H_2O$ tạo thành $Ca(OH)_2$. Số mol $Ca(OH)_2$ = 0,2 mol, khối lượng = 0,2 nhân 74 = 14,8 gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Na^+$ có 10 electron.", "b) $Mg^{2+}$ có 10 electron.", "c) $Al^{3+}$ có 10 electron.", "d) $K^+$ có 10 electron."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 11 - 1 = 10. b) Đúng: 12 - 2 = 10. c) Đúng: 13 - 3 = 10. d) Sai: $K^+$ có 19 - 1 = 18 electron.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $F^-$ có 10 electron.", "b) $O^{2-}$ có 10 electron.", "c) $N^{3-}$ có 10 electron.", "d) $Cl^-$ có 10 electron."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 9 + 1 = 10. b) Đúng: 8 + 2 = 10. c) Đúng: 7 + 3 = 10. d) Sai: $Cl^-$ có 17 + 1 = 18 electron.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hợp chất ion tạo thành giữa $K^+$ và $S^{2-}$ (dạng text).", "answer": "K2S", "explain": "2 ion $K^+$ (2+) kết hợp với 1 ion $S^{2-}$ (2-) tạo thành $K_2S$ (dạng text: K2S).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ion $X^{2+}$ có 10 electron. Nguyên tố X có số hiệu nguyên tử Z bằng bao nhiêu?", "answer": "12", "explain": "Ion $X^{2+}$ có 10 electron nên nguyên tử X có 12 electron, vậy Z = 12 (Mg).", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Trong phân tử $HCl$, cặp electron chung bị lệch về phía", "options": ["A. $H$ vì $H$ có độ âm điện lớn hơn.", "B. $Cl$ vì $Cl$ có độ âm điện lớn hơn.", "C. không bị lệch.", "D. cả hai phía."], "answer": "B", "explain": "Độ âm điện của Cl (3,16) lớn hơn của H (2,20) nên cặp electron chung bị lệch về phía Cl.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Điều kiện để tạo thành liên kết hydrogen là H phải liên kết với", "options": ["A. C.", "B. F, O hoặc N.", "C. S.", "D. P."], "answer": "B", "explain": "Nguyên tử H phải liên kết với nguyên tử có độ âm điện lớn (thường là F, O, N) mới tạo được liên kết hydrogen.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân tử $CO_2$ không phân cực mặc dù liên kết $C=O$ phân cực vì", "options": ["A. $CO_2$ là hợp chất ion.", "B. phân tử $CO_2$ có cấu trúc thẳng, hai liên kết phân cực ngược chiều nhau nên triệt tiêu.", "C. liên kết $C=O$ không phân cực.", "D. $CO_2$ không có liên kết cộng hóa trị."], "answer": "B", "explain": "Phân tử $CO_2$ có cấu trúc thẳng (O=C=O), hai liên kết đôi phân cực hướng ngược nhau nên triệt tiêu, phân tử không phân cực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân tử $H_2O$ phân cực vì", "options": ["A. $H_2O$ là hợp chất ion.", "B. phân tử $H_2O$ có cấu trúc gấp khúc, không đối xứng.", "C. liên kết $O-H$ không phân cực.", "D. $H_2O$ không có cặp electron riêng."], "answer": "B", "explain": "Phân tử $H_2O$ có cấu trúc gấp khúc (do 2 cặp electron riêng trên O) nên các liên kết phân cực không triệt tiêu nhau, phân tử phân cực.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết năng lượng liên kết: $H-H$ (436 kJ/mol), $I-I$ (151 kJ/mol). Phản ứng $H_2 + I_2$ tạo thành $2HI$ tỏa ra 9 kJ. Năng lượng liên kết $H-I$ là", "options": ["A. 298 kJ/mol.", "B. 596 kJ/mol.", "C. 289 kJ/mol.", "D. 149 kJ/mol."], "answer": "A", "explain": "Gọi x là năng lượng liên kết H-I. Năng lượng phản ứng = (436 + 151) - 2x = -9, suy ra 2x = 596, x = 298 kJ/mol.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sắp xếp các chất $HF, HCl, HBr$ theo chiều tăng dần của nhiệt độ sôi:", "options": ["A. $HF, HCl, HBr$.", "B. $HBr, HCl, HF$.", "C. $HCl, HBr, HF$.", "D. $HF, HBr, HCl$."], "answer": "C", "explain": "HF có liên kết hydrogen nên nhiệt độ sôi cao nhất. Giữa HCl và HBr, HBr có khối lượng phân tử lớn hơn nên nhiệt độ sôi cao hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về liên kết hydrogen:", "statements": ["a) Giữa các phân tử $H_2O$ tồn tại liên kết hydrogen.", "b) Giữa các phân tử $CH_4$ tồn tại liên kết hydrogen.", "c) Nhiệt độ sôi của $H_2O$ cao bất thường so với $H_2S$ chủ yếu do liên kết hydrogen.", "d) Liên kết hydrogen mạnh hơn liên kết cộng hóa trị."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: H liên kết với O có độ âm điện lớn nên các phân tử $H_2O$ tạo liên kết hydrogen với nhau. b) Sai: C không đủ âm điện, $CH_4$ không tạo được liên kết hydrogen. c) Đúng: liên kết hydrogen làm tăng nhiệt độ sôi của $H_2O$ so với $H_2S$ không có liên kết hydrogen. d) Sai: liên kết hydrogen yếu hơn nhiều so với liên kết cộng hóa trị, nó chỉ là tương tác giữa các phân tử.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $C_2H_5OH$ tan tốt trong nước.", "b) $CH_4$ ít tan trong nước.", "c) Đường ăn tan tốt trong nước.", "d) Dầu ăn tan tốt trong nước."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: nhóm -OH tạo liên kết hydrogen với nước. b) Đúng: không phân cực. c) Đúng: nhiều nhóm -OH. d) Sai: dầu ăn không phân cực, không tan trong nước.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong phân tử $NH_3$, nguyên tử $N$ còn bao nhiêu cặp electron riêng?", "answer": "1", "explain": "N có 5 electron lớp ngoài cùng, dùng 3 electron tạo 3 liên kết với 3 nguyên tử H nên còn 1 cặp electron riêng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Mỗi phân tử $H_2O$ tạo tối đa bao nhiêu liên kết hydrogen với các phân tử nước xung quanh?", "answer": "4", "explain": "Mỗi phân tử $H_2O$ có 2 nguyên tử H (cho 2 liên kết) và O còn 2 cặp electron riêng (nhận 2 liên kết), tổng tối đa 4.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Để mỗi nguyên tử đạt octet trong phân tử $Cl_2$, hai nguyên tử $Cl$ cần", "options": ["A. mỗi nguyên tử nhường 1 electron.", "B. góp chung 1 cặp electron.", "C. góp chung 2 cặp electron.", "D. mỗi nguyên tử nhận 1 electron."], "answer": "B", "explain": "Mỗi nguyên tử Cl có 7 electron lớp ngoài cùng, góp chung 1 cặp electron (liên kết đơn) thì mỗi Cl có 8 electron xung quanh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngoại lệ của quy tắc octet là", "options": ["A. $CH_4$.", "B. $H_2O$.", "C. $BF_3$ (B chỉ có 6 electron xung quanh).", "D. $NH_3$."], "answer": "C", "explain": "Trong $BF_3$, nguyên tử B chỉ có 6 electron xung quanh (3 cặp electron chung), không đạt octet.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các phân tử sau, phân tử nào vi phạm quy tắc octet ở nguyên tử trung tâm?", "options": ["A. $CH_4$.", "B. $PCl_5$.", "C. $H_2O$.", "D. $NH_3$."], "answer": "B", "explain": "Trong $PCl_5$, nguyên tử P có 10 electron xung quanh (5 cặp electron chung), vượt quá octet.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các phân tử sau, phân tử nào có tất cả các nguyên tử đều đạt octet (H đạt duplet)?", "options": ["A. $BF_3$.", "B. $CCl_4$.", "C. $PCl_5$.", "D. $SF_6$."], "answer": "B", "explain": "Trong $CCl_4$, C có 8 electron xung quanh (4 cặp chung), mỗi Cl có 8 electron xung quanh (1 cặp chung + 3 cặp riêng).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tổng số cặp electron dùng chung và cặp electron riêng trong phân tử $NH_3$ là", "options": ["A. 3 cặp chung và 1 cặp riêng.", "B. 3 cặp chung và 2 cặp riêng.", "C. 4 cặp chung và 1 cặp riêng.", "D. 2 cặp chung và 1 cặp riêng."], "answer": "A", "explain": "Phân tử $NH_3$ có 3 liên kết đơn N-H (3 cặp electron chung); nguyên tử N còn 1 cặp electron riêng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong các chất $CH_4, C_2H_6, C_3H_8$, chất có nhiệt độ sôi cao nhất là", "options": ["A. $CH_4$.", "B. $C_2H_6$.", "C. $C_3H_8$.", "D. cả ba bằng nhau."], "answer": "C", "explain": "$C_3H_8$ có khối lượng phân tử lớn nhất nên tương tác van der Waals mạnh nhất, nhiệt độ sôi cao nhất.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $BF_3$ vi phạm quy tắc octet.", "b) $PCl_5$ vi phạm quy tắc octet.", "c) $CH_4$ tuân thủ quy tắc octet.", "d) $SF_6$ tuân thủ quy tắc octet."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: B có 6e. b) Đúng: P có 10e. c) Đúng: C có 8e. d) Sai: S có 12e.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhiệt độ sôi của alkane tăng theo khối lượng phân tử.", "b) Nguyên nhân là do tương tác van der Waals tăng.", "c) Các alkane có liên kết hydrogen.", "d) $C_3H_8$ có nhiệt độ sôi cao hơn $CH_4$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: alkane không phân cực. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong phân tử $BF_3$, nguyên tử $B$ có bao nhiêu electron ở lớp ngoài cùng (tính cả electron dùng chung)?", "answer": "6", "explain": "Trong $BF_3$, B tạo 3 liên kết đơn với 3 nguyên tử F (3 cặp electron chung) nên B có 6 electron ở lớp ngoài cùng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong phân tử $SF_6$, nguyên tử $S$ có bao nhiêu electron ở lớp ngoài cùng (tính cả electron dùng chung)?", "answer": "12", "explain": "Trong $SF_6$, S tạo 6 liên kết đơn với 6 nguyên tử F (6 cặp electron chung) nên S có 12 electron ở lớp ngoài cùng.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Độ dài liên kết càng ngắn thì liên kết càng", "options": ["A. yếu.", "B. bền.", "C. dài.", "D. dễ đứt."], "answer": "B", "explain": "Độ dài liên kết càng ngắn (các nguyên tử hút nhau càng chặt) thì liên kết càng bền.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bản chất của liên kết hydrogen là", "options": ["A. sự dùng chung electron.", "B. tương tác tĩnh điện.", "C. lực hút giữa các ion.", "D. sự cho nhận proton."], "answer": "B", "explain": "Bản chất của liên kết hydrogen là tương tác tĩnh điện giữa $H^{\\delta+}$ và nguyên tử có độ âm điện lớn $^{\\delta-}$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các liên kết hydrogen-halogen sau, liên kết nào bền nhất?", "options": ["A. $H-Cl$ (431 kJ/mol).", "B. $H-Br$ (366 kJ/mol).", "C. $H-I$ (299 kJ/mol).", "D. $H-F$ (565 kJ/mol)."], "answer": "D", "explain": "Liên kết $H-F$ có năng lượng liên kết lớn nhất (565 kJ/mol) nên bền nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các tương tác sau, tương tác nào yếu nhất?", "options": ["A. Liên kết cộng hóa trị.", "B. Liên kết ion.", "C. Liên kết hydrogen.", "D. Tương tác van der Waals."], "answer": "D", "explain": "Tương tác van der Waals là tương tác yếu nhất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết năng lượng liên kết $C-H$ là 413 kJ/mol. Cần bao nhiêu kJ để phá vỡ 4 mol liên kết $C-H$ ở thể khí?", "options": ["A. 413 kJ.", "B. 826 kJ.", "C. 1652 kJ.", "D. 165 kJ."], "answer": "C", "explain": "Năng lượng cần = 4 nhân 413 = 1652 kJ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đốt cháy hoàn toàn 2,3 gam $C_2H_5OH$. Thể tích khí $CO_2$ thu được ở đktc là", "options": ["A. 4,48 lít.", "B. 1,12 lít.", "C. 2,24 lít.", "D. 3,36 lít."], "answer": "C", "explain": "Số mol $C_2H_5OH$ = 2,3/46 = 0,05 mol. Phương trình: $C_2H_5OH + 3O_2$ tạo thành $2CO_2 + 3H_2O$. Số mol $CO_2$ = 0,05 nhân 2 = 0,1 mol, thể tích = 0,1 nhân 22,4 = 2,24 lít.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Năng lượng liên kết N≡N lớn hơn H-H.", "b) Liên kết ba bền hơn liên kết đơn.", "c) Năng lượng liên kết càng lớn thì liên kết càng bền.", "d) Liên kết đơn dài hơn liên kết ba."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: 945 kJ/mol lớn hơn 436 kJ/mol. b) Đúng. c) Đúng. d) Đúng: càng nhiều cặp electron chung thì liên kết càng ngắn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phản ứng tỏa nhiệt có năng lượng phản ứng âm.", "b) Phản ứng thu nhiệt có năng lượng phản ứng dương.", "c) Nước đá nhẹ hơn nước lỏng.", "d) Nguyên nhân là do liên kết hydrogen tạo mạng cấu trúc rỗng."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng: nước đá nổi trên mặt nước. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho biết năng lượng liên kết $H-Cl$ là 431 kJ/mol. Cần bao nhiêu kJ để phá vỡ 2 mol liên kết $H-Cl$ ở thể khí?", "answer": "862", "explain": "Năng lượng cần = 2 nhân 431 = 862 kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong các chất $NaCl, H_2O, CH_4$, chất nào có nhiệt độ nóng chảy cao nhất?", "answer": "NaCl", "explain": "NaCl là hợp chất ion có mạng tinh thể bền nên nhiệt độ nóng chảy cao nhất (801 độ C).", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Hợp chất ion dẫn điện khi", "options": ["A. ở trạng thái rắn.", "B. nóng chảy hoặc tan trong nước.", "C. ở mọi trạng thái.", "D. không bao giờ dẫn điện."], "answer": "B", "explain": "Hợp chất ion dẫn điện khi nóng chảy hoặc tan trong nước (có ion tự do chuyển động); ở trạng thái rắn không dẫn điện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hợp chất cộng hóa trị ở điều kiện thường có thể tồn tại ở thể", "options": ["A. rắn duy nhất.", "B. rắn, lỏng hoặc khí.", "C. plasma.", "D. lỏng duy nhất."], "answer": "B", "explain": "Hợp chất cộng hóa trị có thể tồn tại ở cả ba thể rắn, lỏng, khí ở điều kiện thường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chất sau, chất nào dẫn điện khi nóng chảy?", "options": ["A. $H_2O$.", "B. $NaCl$.", "C. $CH_4$.", "D. $CCl_4$."], "answer": "B", "explain": "NaCl là hợp chất ion, khi nóng chảy có ion $Na^+$ và $Cl^-$ tự do chuyển động nên dẫn điện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chất sau, chất nào KHÔNG dẫn điện ở mọi trạng thái?", "options": ["A. $NaCl$ nóng chảy.", "B. Dung dịch $NaCl$.", "C. $CCl_4$.", "D. $MgO$ nóng chảy."], "answer": "C", "explain": "$CCl_4$ là hợp chất cộng hóa trị, không có ion tự do nên không dẫn điện ở mọi trạng thái.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X (Z = 13) kết hợp với nguyên tố Y (Z = 8). Công thức hợp chất tạo thành là", "options": ["A. $XY$.", "B. $X_2Y_3$.", "C. $X_3Y_2$.", "D. $XY_3$."], "answer": "B", "explain": "X là Al (tạo $Al^{3+}$), Y là O (tạo $O^{2-}$). 2 ion $Al^{3+}$ kết hợp với 3 ion $O^{2-}$ tạo thành $Al_2O_3$ (dạng $X_2Y_3$).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hòa tan 9,5 gam $MgCl_2$ vào nước được 2,5 lít dung dịch. Nồng độ mol của ion $Mg^{2+}$ là", "options": ["A. 0,02M.", "B. 0,04M.", "C. 0,08M.", "D. 0,10M."], "answer": "B", "explain": "Số mol $MgCl_2$ = 9,5/95 = 0,1 mol. $MgCl_2$ điện li tạo thành $Mg^{2+} + 2Cl^-$ nên số mol $Mg^{2+}$ = 0,1 mol. Nồng độ = 0,1/2,5 = 0,04M.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $NaCl$ rắn không dẫn điện.", "b) $NaCl$ nóng chảy dẫn điện.", "c) Dung dịch $NaCl$ dẫn điện.", "d) $CCl_4$ dẫn điện."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: ion bị giữ chặt trong mạng tinh thể. b) Đúng. c) Đúng. d) Sai: $CCl_4$ là hợp chất cộng hóa trị, không dẫn điện.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về quy tắc octet:", "statements": ["a) Nguyên tử O trong phân tử $H_2O$ đạt cấu hình electron bền vững giống khí hiếm Ne.", "b) Ion $Na^+$ trong tinh thể $NaCl$ đạt cấu hình electron bền vững giống khí hiếm Ne.", "c) Ion $Cl^-$ trong tinh thể $NaCl$ đạt cấu hình electron bền vững giống khí hiếm Ne.", "d) Nguyên tử Mg trong $MgO$ nhường 1 electron để tạo thành ion $Mg^{2+}$."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: O dùng 2 electron tạo 2 liên kết với 2 H, còn 4 electron tạo 2 cặp riêng, tổng 8 electron lớp ngoài cùng giống Ne. b) Đúng: Na nhường 1 electron tạo $Na^+$ có 8 electron lớp ngoài cùng giống Ne. c) Sai: $Cl^-$ có 18 electron, cấu hình giống khí hiếm Ar chứ không phải Ne. d) Sai: Mg nhường 2 electron mới tạo thành $Mg^{2+}$.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hợp chất ion tạo thành giữa $Mg^{2+}$ và $N^{3-}$ (dạng text).", "answer": "Mg3N2", "explain": "3 ion $Mg^{2+}$ (6+) kết hợp với 2 ion $N^{3-}$ (6-) tạo thành $Mg_3N_2$ (dạng text: Mg3N2).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ion $Y^{3-}$ có 10 electron. Nguyên tố Y có số hiệu nguyên tử Z bằng bao nhiêu?", "answer": "7", "explain": "Ion $Y^{3-}$ có 10 electron nên nguyên tử Y có 7 electron, vậy Z = 7 (N).", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các chất sau, chất nào là hợp chất ion?", "options": ["A. $CO_2$.", "B. $K_2O$.", "C. $NH_3$.", "D. $Cl_2$."], "answer": "B", "explain": "$K_2O$ được tạo thành từ kim loại điển hình K và phi kim điển hình O nên là hợp chất ion.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các chất sau, chất nào là hợp chất cộng hóa trị?", "options": ["A. $NaCl$.", "B. $MgO$.", "C. $SO_2$.", "D. $CaF_2$."], "answer": "C", "explain": "$SO_2$ được tạo thành từ hai phi kim (S và O) bằng sự dùng chung electron nên là hợp chất cộng hóa trị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chất sau, chất nào vừa có liên kết cộng hóa trị vừa có liên kết ion?", "options": ["A. $NaCl$.", "B. $NaOH$.", "C. $H_2O$.", "D. $Cl_2$."], "answer": "B", "explain": "Trong NaOH, liên kết giữa $Na^+$ và $OH^-$ là liên kết ion; liên kết O-H trong ion $OH^-$ là liên kết cộng hóa trị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chất sau, chất nào vừa có liên kết cộng hóa trị vừa có liên kết cho nhận?", "options": ["A. $NH_4Cl$.", "B. $NaCl$.", "C. $H_2$.", "D. $MgO$."], "answer": "A", "explain": "Trong $NH_4Cl$, ion $NH_4^+$ có 3 liên kết cộng hóa trị N-H thông thường và 1 liên kết cho nhận N→H; liên kết giữa $NH_4^+$ và $Cl^-$ là liên kết ion.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết độ âm điện: $H$ (2,20), $S$ (2,58). Liên kết $H-S$ trong $H_2S$ là", "options": ["A. liên kết ion.", "B. liên kết cộng hóa trị không cực.", "C. liên kết cộng hóa trị có cực.", "D. liên kết hydrogen."], "answer": "B", "explain": "Hiệu độ âm điện = 2,58 - 2,20 = 0,38, nhỏ hơn 0,4 nên là liên kết cộng hóa trị không cực.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nung 12,6 gam $NaHCO_3$ (hiệu suất 100%). Thể tích khí $CO_2$ thu được ở đktc là", "options": ["A. 3,36 lít.", "B. 1,68 lít.", "C. 0,84 lít.", "D. 2,24 lít."], "answer": "B", "explain": "Số mol $NaHCO_3$ = 12,6/84 = 0,15 mol. Phương trình: $2NaHCO_3$ tạo thành $Na_2CO_3 + CO_2 + H_2O$. Số mol $CO_2$ = 0,15/2 = 0,075 mol, thể tích = 0,075 nhân 22,4 = 1,68 lít.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $K_2O$ là hợp chất ion.", "b) $SO_2$ là hợp chất cộng hóa trị.", "c) $NaOH$ có cả liên kết ion và liên kết cộng hóa trị.", "d) $Cl_2$ là hợp chất ion."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $Cl_2$ là đơn chất cộng hóa trị.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $NH_4Cl$ có liên kết cho nhận.", "b) $NH_4Cl$ có liên kết ion.", "c) $NH_4Cl$ có liên kết cộng hóa trị.", "d) $NH_4Cl$ là đơn chất."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: trong ion $NH_4^+$. b) Đúng: giữa $NH_4^+$ và $Cl^-$. c) Đúng: các liên kết N-H. d) Sai: $NH_4Cl$ là hợp chất.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong phân tử $NaOH$, liên kết giữa $Na^+$ và $OH^-$ là liên kết ion hay liên kết cộng hóa trị?", "answer": "liên kết ion", "explain": "Liên kết giữa cation $Na^+$ và anion $OH^-$ là liên kết ion (lực hút tĩnh điện).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong các chất $NaCl, NaOH, H_2O$, có bao nhiêu chất có liên kết ion?", "answer": "2", "explain": "Có 2 chất: NaCl và NaOH. $H_2O$ là hợp chất cộng hóa trị.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Ôn tập: Liên kết được tạo thành bởi sự dùng chung cặp electron là", "options": ["A. liên kết ion.", "B. liên kết cộng hóa trị.", "C. liên kết kim loại.", "D. liên kết hydrogen."], "answer": "B", "explain": "Liên kết cộng hóa trị là liên kết được tạo thành bởi sự dùng chung một hay nhiều cặp electron.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ôn tập: Liên kết được tạo thành bởi lực hút tĩnh điện giữa các ion trái dấu là", "options": ["A. liên kết cộng hóa trị.", "B. liên kết ion.", "C. liên kết hydrogen.", "D. tương tác van der Waals."], "answer": "B", "explain": "Liên kết ion là liên kết được tạo thành bởi lực hút tĩnh điện giữa các ion mang điện tích trái dấu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chất sau, chất nào KHÔNG phải là hợp chất ion?", "options": ["A. $KBr$.", "B. $CaO$.", "C. $CCl_4$.", "D. $Li_2O$."], "answer": "C", "explain": "$CCl_4$ được tạo thành từ hai phi kim (C và Cl) bằng sự góp chung electron nên là hợp chất cộng hóa trị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chất sau, chất nào KHÔNG phải là hợp chất cộng hóa trị?", "options": ["A. $HCl$.", "B. $H_2O$.", "C. $NH_3$.", "D. $NaCl$."], "answer": "D", "explain": "NaCl là hợp chất ion.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 6,72 lít khí $O_2$ (đktc) tác dụng với $H_2$ dư. Khối lượng $H_2O$ thu được là", "options": ["A. 5,4 gam.", "B. 21,6 gam.", "C. 10,8 gam.", "D. 2,7 gam."], "answer": "C", "explain": "Số mol $O_2$ = 6,72/22,4 = 0,3 mol. Phương trình: $2H_2 + O_2$ tạo thành $2H_2O$. Số mol $H_2O$ = 0,3 nhân 2 = 0,6 mol, khối lượng = 0,6 nhân 18 = 10,8 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phản ứng $N_2 + 3H_2$ tạo thành $2NH_3$ có năng lượng phản ứng là -92 kJ. Biết năng lượng liên kết N≡N là 945 kJ/mol, H-H là 436 kJ/mol. Năng lượng liên kết N-H (làm tròn đến số nguyên) là", "options": ["A. 391 kJ/mol.", "B. 390 kJ/mol.", "C. 782 kJ/mol.", "D. 195 kJ/mol."], "answer": "A", "explain": "Gọi x là năng lượng liên kết N-H. (945 + 3 nhân 436) - 6x = -92, suy ra 6x = 2345, x = 390,8, làm tròn 391 kJ/mol.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $KBr$ là hợp chất ion.", "b) $CCl_4$ là hợp chất cộng hóa trị.", "c) $HCl$ là hợp chất cộng hóa trị.", "d) $NaCl$ là hợp chất cộng hóa trị."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: NaCl là hợp chất ion.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giữa các phân tử $H_2O$ có liên kết hydrogen.", "b) Giữa các phân tử $CH_4$ chỉ có tương tác van der Waals.", "c) Tương tác van der Waals tăng theo khối lượng phân tử.", "d) Liên kết hydrogen mạnh hơn liên kết cộng hóa trị."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: liên kết cộng hóa trị mạnh hơn nhiều.", "points": 1}, {"type": "short", "level": "VD", "q": "Hiệu độ âm điện của liên kết $Si-Cl$ là 1,26. Liên kết $Si-Cl$ là liên kết ion hay liên kết cộng hóa trị?", "answer": "liên kết cộng hóa trị", "explain": "Hiệu độ âm điện 1,26 nằm trong khoảng từ 0,4 đến dưới 1,7 nên là liên kết cộng hóa trị (có cực).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong các chất $H_2O, NH_3, HF, CH_4$, có bao nhiêu chất tạo được liên kết hydrogen giữa các phân tử?", "answer": "3", "explain": "Có 3 chất: $H_2O, NH_3, HF$. $CH_4$ không tạo được liên kết hydrogen.", "points": 0.5}]}]}</script>
