{"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Tương tác van der Waals là", "options": ["A. tương tác mạnh giữa các ion.", "B. tương tác yếu giữa các phân tử do sự phân cực tạm thời.", "C. liên kết cộng hóa trị.", "D. liên kết hydrogen."], "answer": "B", "explain": "Tương tác van der Waals là tương tác yếu giữa các phân tử (kể cả phân tử không cực), xuất hiện do sự phân cực tạm thời của phân tử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tương tác van der Waals tồn tại ở", "options": ["A. mọi chất.", "B. chỉ chất phân cực.", "C. chỉ hợp chất ion.", "D. chỉ kim loại."], "answer": "A", "explain": "Tương tác van der Waals tồn tại ở mọi chất, kể cả khí hiếm và các phân tử không cực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tương tác van der Waals tăng khi", "options": ["A. khối lượng phân tử tăng.", "B. khối lượng phân tử giảm.", "C. nhiệt độ tăng.", "D. áp suất giảm."], "answer": "A", "explain": "Phân tử càng lớn (khối lượng phân tử càng tăng) càng dễ bị phân cực tạm thời nên tương tác van der Waals càng mạnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhiệt độ sôi tăng dần từ $F_2$ ($-188^\\circ C$) đến $I_2$ ($184^\\circ C$). Nguyên nhân là do", "options": ["A. liên kết hydrogen tăng dần.", "B. tương tác van der Waals tăng dần theo khối lượng phân tử.", "C. liên kết cộng hóa trị tăng dần.", "D. độ âm điện tăng dần."], "answer": "B", "explain": "Từ $F_2$ đến $I_2$, khối lượng phân tử tăng dần nên tương tác van der Waals tăng dần, nhiệt độ sôi tăng dần.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong các chất sau, chất nào có nhiệt độ sôi cao nhất?", "options": ["A. $F_2$.", "B. $Cl_2$.", "C. $Br_2$.", "D. $I_2$."], "answer": "D", "explain": "$I_2$ có khối lượng phân tử lớn nhất (254) nên tương tác van der Waals mạnh nhất, nhiệt độ sôi cao nhất (184 độ C).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sắp xếp các tương tác sau theo chiều tăng dần của độ mạnh: (1) liên kết cộng hóa trị, (2) liên kết hydrogen, (3) tương tác van der Waals.", "options": ["A. (3), (2), (1) (theo thứ tự tăng dần).", "B. (1), (2), (3) (theo thứ tự tăng dần).", "C. (2), (3), (1) (theo thứ tự tăng dần).", "D. (3), (1), (2) (theo thứ tự tăng dần)."], "answer": "A", "explain": "Độ mạnh tăng dần: tương tác van der Waals (yếu nhất), rồi đến liên kết hydrogen, rồi đến liên kết cộng hóa trị (mạnh nhất).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tương tác van der Waals là tương tác yếu.", "b) Tương tác van der Waals tồn tại ở khí hiếm.", "c) Tương tác van der Waals tồn tại ở phân tử không cực.", "d) Tương tác van der Waals mạnh hơn liên kết hydrogen."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: tồn tại ở mọi chất. c) Đúng. d) Sai: tương tác van der Waals yếu hơn liên kết hydrogen.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhiệt độ sôi của $Br_2$ cao hơn $Cl_2$.", "b) Nhiệt độ sôi của $I_2$ cao hơn $Br_2$.", "c) Nguyên nhân là do tương tác van der Waals tăng dần.", "d) Nguyên nhân là do liên kết hydrogen tăng dần."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 59 độ C cao hơn -34 độ C. b) Đúng: 184 độ C cao hơn 59 độ C. c) Đúng: khối lượng phân tử tăng dần. d) Sai: các halogen không tạo liên kết hydrogen.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong các chất $F_2, Cl_2, Br_2, I_2$, chất nào có tương tác van der Waals mạnh nhất?", "answer": "I2", "explain": "$I_2$ có khối lượng phân tử lớn nhất nên tương tác van der Waals mạnh nhất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Loại tương tác nào giải thích vì sao khí hiếm $He$ có thể hóa lỏng ở nhiệt độ rất thấp?", "answer": "tương tác van der Waals", "explain": "Khí hiếm He chỉ có tương tác van der Waals rất yếu giữa các nguyên tử nên chỉ hóa lỏng ở nhiệt độ rất thấp (-269 độ C).", "points": 0.5}]},

 bất thường so với $PH_3$ (không có liên kết hydrogen).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nước đá nhẹ hơn nước lỏng (nổi trên mặt nước). Nguyên nhân là do", "options": ["A. liên kết hydrogen tạo mạng cấu trúc rỗng trong nước đá.", "B. nước đá không có liên kết hydrogen.", "C. nước lỏng không có liên kết hydrogen.", "D. khối lượng phân tử nước đá nhỏ hơn."], "answer": "A", "explain": "Trong nước đá, các phân tử nước sắp xếp theo mạng liên kết hydrogen tạo cấu trúc rỗng, làm khối lượng riêng của nước đá nhỏ hơn nước lỏng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $NH_3$ tan tốt trong nước.", "b) $HCl$ tan tốt trong nước.", "c) $C_2H_5OH$ tan tốt trong nước.", "d) $CH_4$ tan tốt trong nước."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: tạo liên kết hydrogen với nước. b) Đúng. c) Đúng: nhóm -OH tạo liên kết hydrogen với nước. d) Sai: $CH_4$ không phân cực, không tạo liên kết hydrogen với nước nên ít tan.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Liên kết hydrogen làm tăng nhiệt độ sôi.", "b) Liên kết hydrogen làm tăng độ tan trong nước.", "c) Tương tác van der Waals làm tăng nhiệt độ sôi khi khối lượng phân tử tăng.", "d) Liên kết hydrogen làm giảm nhiệt độ sôi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: liên kết hydrogen làm tăng nhiệt độ sôi.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết kí hiệu liên kết hydrogen giữa các phân tử $HF$ (dạng text, dùng dấu ba chấm).", "answer": "F-H...F", "explain": "Liên kết hydrogen giữa các phân tử HF được kí hiệu là F-H···F (dạng text: F-H...F).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong các chất $NH_3, PH_3, H_2O, H_2S$, có bao nhiêu chất có liên kết hydrogen giữa các phân tử?", "answer": "2", "explain": "Có 2 chất: $NH_3$ (N-H···N) và $H_2O$ (O-H···O). $PH_3$ và $H_2S$ không tạo được liên kết hydrogen giữa các phân tử.", "points": 0.5}]},
{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Bản chất của liên kết hydrogen là", "options": ["A. sự dùng chung electron.", "B. tương tác tĩnh điện giữa $H^{\\delta+}$ và nguyên tử $^{\\delta-}$.", "C. lực hút giữa các ion.", "D. sự cho nhận proton."], "answer": "B", "explain": "Bản chất của liên kết hydrogen là tương tác tĩnh điện giữa nguyên tử H mang một phần điện tích dương và nguyên tử có độ âm điện lớn mang một phần điện tích âm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bản chất của tương tác van der Waals là", "options": ["A. sự dùng chung electron.", "B. tương tác giữa các lưỡng cực tức thời do phân cực tạm thời.", "C. lực hút giữa các ion.", "D. liên kết hydrogen."], "answer": "B", "explain": "Tương tác van der Waals xuất hiện do sự phân cực tạm thời của phân tử tạo ra các lưỡng cực tức thời cảm ứng lẫn nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các loại tương tác sau, loại nào yếu nhất?", "options": ["A. Liên kết cộng hóa trị.", "B. Liên kết hydrogen.", "C. Tương tác van der Waals.", "D. Liên kết ion."], "answer": "C", "explain": "Tương tác van der Waals là tương tác yếu nhất trong các loại tương tác giữa các phân tử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các loại tương tác sau, loại nào mạnh nhất?", "options": ["A. Tương tác van der Waals.", "B. Liên kết hydrogen.", "C. Liên kết cộng hóa trị.", "D. Cả ba mạnh như nhau."], "answer": "C", "explain": "Liên kết cộng hóa trị (dùng chung electron) mạnh hơn nhiều so với liên kết hydrogen và tương tác van der Waals.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sắp xếp các chất $CH_4, H_2O, NaCl$ theo chiều tăng dần của nhiệt độ sôi:", "options": ["A. $CH_4, H_2O, NaCl$.", "B. $NaCl, H_2O, CH_4$.", "C. $H_2O, CH_4, NaCl$.", "D. $CH_4, NaCl, H_2O$."], "answer": "A", "explain": "$CH_4$ chỉ có tương tác van der Waals yếu (t_s = -161,5 độ C); $H_2O$ có liên kết hydrogen (t_s = 100 độ C); NaCl là hợp chất ion (t_s = 1465 độ C).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ethanol ($C_2H_5OH$, $t_s = 78^\\circ C$) có nhiệt độ sôi cao hơn dimethyl ether ($CH_3OCH_3$, $t_s = -24^\\circ C$) mặc dù cùng công thức phân tử $C_2H_6O$. Nguyên nhân là do", "options": ["A. ethanol có liên kết hydrogen giữa các phân tử, dimethyl ether không có.", "B. dimethyl ether có khối lượng phân tử lớn hơn.", "C. ethanol là hợp chất ion.", "D. dimethyl ether phân cực mạnh hơn."], "answer": "A", "explain": "Ethanol có nhóm -OH tạo được liên kết hydrogen giữa các phân tử nên nhiệt độ sôi cao; dimethyl ether không có H liên kết với O nên không tạo được liên kết hydrogen.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Liên kết hydrogen mạnh hơn liên kết cộng hóa trị.", "b) Tương tác van der Waals yếu hơn liên kết hydrogen.", "c) Liên kết cộng hóa trị mạnh hơn tương tác van der Waals.", "d) Liên kết hydrogen yếu hơn tương tác van der Waals."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: liên kết cộng hóa trị mạnh hơn nhiều. b) Đúng. c) Đúng. d) Sai: liên kết hydrogen mạnh hơn tương tác van der Waals.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $C_2H_5OH$ có liên kết hydrogen giữa các phân tử.", "b) $CH_3OCH_3$ có liên kết hydrogen giữa các phân tử.", "c) $C_2H_5OH$ có nhiệt độ sôi cao hơn $CH_3OCH_3$.", "d) $C_2H_5OH$ và $CH_3OCH_3$ là đồng phân của nhau."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: nhóm -OH. b) Sai: không có H liên kết với O. c) Đúng: 78 độ C cao hơn -24 độ C. d) Đúng: cùng công thức phân tử $C_2H_6O$.", "points": 1}, {"type": "short", "level": "VD", "q": "Loại liên kết nào giải thích nhiệt độ sôi cao bất thường của nước?", "answer": "liên kết hydrogen", "explain": "Giữa các phân tử nước tồn tại liên kết hydrogen O-H···O khá bền nên nước có nhiệt độ sôi cao bất thường (100 độ C).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Loại tương tác nào giải thích nhiệt độ sôi tăng dần từ $F_2$ đến $I_2$?", "answer": "tương tác van der Waals", "explain": "Từ $F_2$ đến $I_2$, khối lượng phân tử tăng dần nên tương tác van der Waals tăng dần, nhiệt độ sôi tăng dần.", "points": 0.5}]},
{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Protein và DNA giữ được cấu trúc không gian nhờ", "options": ["A. liên kết ion.", "B. liên kết hydrogen.", "C. liên kết kim loại.", "D. tương tác van der Waals duy nhất."], "answer": "B", "explain": "Liên kết hydrogen đóng vai trò quan trọng trong việc duy trì cấu trúc không gian của protein và DNA.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong phân tử $HF$, nguyên tử H tạo liên kết hydrogen với", "options": ["A. nguyên tử H khác.", "B. nguyên tử F của phân tử $HF$ khác.", "C. nguyên tử O.", "D. nguyên tử N."], "answer": "B", "explain": "H của phân tử HF này tạo liên kết hydrogen với F (còn cặp electron riêng) của phân tử HF khác: F-H···F.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mỗi phân tử $H_2O$ có thể tạo tối đa bao nhiêu liên kết hydrogen với các phân tử nước xung quanh?", "options": ["A. 1.", "B. 2.", "C. 4.", "D. 6."], "answer": "C", "explain": "Mỗi phân tử $H_2O$ có 2 nguyên tử H (cho 2 liên kết hydrogen) và nguyên tử O còn 2 cặp electron riêng (nhận 2 liên kết hydrogen), tổng tối đa 4 liên kết hydrogen.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mỗi phân tử $NH_3$ có thể tạo tối đa bao nhiêu liên kết hydrogen với các phân tử $NH_3$ xung quanh?", "options": ["A. 1.", "B. 2.", "C. 3.", "D. 4."], "answer": "D", "explain": "Mỗi phân tử $NH_3$ có 3 nguyên tử H (cho 3 liên kết hydrogen) và nguyên tử N còn 1 cặp electron riêng (nhận 1 liên kết hydrogen), tổng tối đa 4 liên kết hydrogen.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhiệt độ sôi của $HF$ ($19{,}5^\\circ C$) cao hơn $HCl$ ($-85^\\circ C$). Nguyên nhân là do", "options": ["A. $HF$ có liên kết hydrogen giữa các phân tử, $HCl$ không có.", "B. $HCl$ có khối lượng phân tử lớn hơn.", "C. $HF$ là hợp chất ion.", "D. $HCl$ phân cực mạnh hơn."], "answer": "A", "explain": "Giữa các phân tử HF tồn tại liên kết hydrogen F-H···F nên nhiệt độ sôi cao bất thường; HCl không tạo được liên kết hydrogen giữa các phân tử.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong các dãy chất sau, dãy nào có nhiệt độ sôi tăng dần đúng?", "options": ["A. $HCl, HBr, HI$.", "B. $HI, HBr, HCl$.", "C. $HBr, HCl, HI$.", "D. $HCl, HI, HBr$."], "answer": "A", "explain": "HCl, HBr, HI đều không có liên kết hydrogen giữa các phân tử; nhiệt độ sôi tăng theo khối lượng phân tử (tương tác van der Waals tăng) theo thứ tự: HCl (-85 độ C), HBr (-66 độ C), HI (-35 độ C).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mỗi phân tử $H_2O$ tạo tối đa 4 liên kết hydrogen.", "b) Mỗi phân tử $HF$ tạo tối đa 2 liên kết hydrogen.", "c) Mỗi phân tử $NH_3$ tạo tối đa 4 liên kết hydrogen.", "d) Mỗi phân tử $CH_4$ tạo tối đa 4 liên kết hydrogen."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 2 H cho + O nhận 2. b) Đúng: 1 H cho + F nhận 1 (F còn 3 cặp riêng nhưng chỉ xét tối đa 2). c) Đúng: 3 H cho + N nhận 1. d) Sai: $CH_4$ không tạo liên kết hydrogen.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhiệt độ sôi của $HI$ cao hơn $HBr$.", "b) Nhiệt độ sôi của $HBr$ cao hơn $HCl$.", "c) Nguyên nhân là do tương tác van der Waals tăng dần.", "d) Nguyên nhân là do liên kết hydrogen."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: -35 độ C cao hơn -66 độ C. b) Đúng: -66 độ C cao hơn -85 độ C. c) Đúng: khối lượng phân tử tăng dần. d) Sai: HCl, HBr, HI không có liên kết hydrogen giữa các phân tử.", "points": 1}, {"type": "short", "level": "VD", "q": "Mỗi phân tử $HF$ có thể tạo tối đa bao nhiêu liên kết hydrogen với các phân tử $HF$ xung quanh?", "answer": "2", "explain": "Mỗi phân tử HF có 1 nguyên tử H (cho 1 liên kết hydrogen) và F còn cặp electron riêng (nhận 1 liên kết hydrogen), tổng tối đa 2.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong các chất $HF, HCl, HBr, HI$, có bao nhiêu chất có liên kết hydrogen giữa các phân tử?", "answer": "1", "explain": "Chỉ có HF tạo được liên kết hydrogen giữa các phân tử (F-H···F). HCl, HBr, HI không tạo được.", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Liên kết hydrogen có thể hình thành giữa phân tử $H_2O$ và phân tử nào sau đây?", "options": ["A. $CH_4$.", "B. $NH_3$.", "C. $H_2$.", "D. $O_2$."], "answer": "B", "explain": "$H_2O$ và $NH_3$ đều có H liên kết với nguyên tử có độ âm điện lớn và còn cặp electron riêng nên tạo được liên kết hydrogen với nhau (O-H···N hoặc N-H···O).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Liên kết hydrogen KHÔNG thể hình thành giữa $H_2O$ và", "options": ["A. $HF$.", "B. $NH_3$.", "C. $C_2H_5OH$.", "D. $CH_4$."], "answer": "D", "explain": "$CH_4$ không có H liên kết với F/O/N và không có nguyên tử F/O/N còn cặp electron riêng nên không tạo được liên kết hydrogen với nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đường ăn ($C_{12}H_{22}O_{11}$) tan tốt trong nước vì", "options": ["A. đường là hợp chất ion.", "B. đường có nhiều nhóm -OH tạo được liên kết hydrogen với nước.", "C. đường không phân cực.", "D. đường có tương tác van der Waals mạnh."], "answer": "B", "explain": "Phân tử đường có nhiều nhóm -OH tạo được nhiều liên kết hydrogen với nước nên tan rất tốt trong nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dầu ăn không tan trong nước vì", "options": ["A. dầu ăn là hợp chất ion.", "B. dầu ăn không phân cực, không tạo được liên kết hydrogen với nước.", "C. dầu ăn có liên kết hydrogen mạnh.", "D. nước không phân cực."], "answer": "B", "explain": "Dầu ăn gồm các phân tử không phân cực, không tạo được liên kết hydrogen với nước nên không tan trong nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong các chất sau, chất nào có nhiệt độ sôi cao nhất?", "options": ["A. $CH_4$ ($-161{,}5^\\circ C$).", "B. $H_2S$ ($-60^\\circ C$).", "C. $NH_3$ ($-33^\\circ C$).", "D. $PH_3$ ($-88^\\circ C$)."], "answer": "C", "explain": "$NH_3$ có liên kết hydrogen giữa các phân tử nên nhiệt độ sôi cao nhất trong 4 chất (-33 độ C).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sắp xếp các chất $H_2O, H_2S, H_2Se$ theo chiều tăng dần của nhiệt độ sôi:", "options": ["A. $H_2O, H_2S, H_2Se$.", "B. $H_2S, H_2Se, H_2O$.", "C. $H_2Se, H_2S, H_2O$.", "D. $H_2S, H_2O, H_2Se$."], "answer": "B", "explain": "$H_2O$ có liên kết hydrogen nên nhiệt độ sôi cao nhất (100 độ C). Giữa $H_2S$ và $H_2Se$ (không có liên kết hydrogen), $H_2Se$ có khối lượng phân tử lớn hơn nên nhiệt độ sôi cao hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dầu ăn tan tốt trong nước.", "b) Đường ăn tan tốt trong nước.", "c) Ethanol tan tốt trong nước.", "d) $I_2$ tan tốt trong nước."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: dầu ăn không phân cực. b) Đúng: nhiều nhóm -OH tạo liên kết hydrogen với nước. c) Đúng: nhóm -OH. d) Sai: $I_2$ không phân cực, ít tan trong nước.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $H_2O$ có nhiệt độ sôi cao hơn $H_2S$.", "b) $NH_3$ có nhiệt độ sôi cao hơn $PH_3$.", "c) $HF$ có nhiệt độ sôi cao hơn $HCl$.", "d) $CH_4$ có nhiệt độ sôi cao hơn $H_2O$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 100 độ C cao hơn -60 độ C. b) Đúng: -33 độ C cao hơn -88 độ C. c) Đúng: 19,5 độ C cao hơn -85 độ C. d) Sai: -161,5 độ C thấp hơn 100 độ C.", "points": 1}, {"type": "short", "level": "VD", "q": "Chất nào sau đây tan tốt trong nước: $CH_4$ hay $NH_3$?", "answer": "NH3", "explain": "$NH_3$ tạo được liên kết hydrogen với nước nên tan rất tốt trong nước; $CH_4$ không phân cực nên ít tan.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong các chất $H_2O, H_2S, H_2Se, H_2Te$, chất nào có nhiệt độ sôi cao nhất?", "answer": "H2O", "explain": "$H_2O$ có liên kết hydrogen giữa các phân tử nên nhiệt độ sôi cao nhất (100 độ C), cao hơn hẳn các chất còn lại.", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các phân tử sau, phân tử nào có thể vừa cho vừa nhận liên kết hydrogen?", "options": ["A. $CH_4$.", "B. $H_2O$.", "C. $H_2$.", "D. $Cl_2$."], "answer": "B", "explain": "Phân tử $H_2O$ vừa có H liên kết với O (cho liên kết hydrogen) vừa có O còn cặp electron riêng (nhận liên kết hydrogen).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các phân tử sau, phân tử nào chỉ có thể nhận liên kết hydrogen mà không thể cho?", "options": ["A. $H_2O$.", "B. $NH_3$.", "C. $(CH_3)_2O$ (dimethyl ether).", "D. $HF$."], "answer": "C", "explain": "Dimethyl ether $(CH_3)_2O$ có O còn cặp electron riêng (nhận liên kết hydrogen) nhưng không có H liên kết với O (không cho được).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây đúng?", "options": ["A. Mọi phân tử có chứa H đều tạo được liên kết hydrogen.", "B. Chỉ phân tử có H liên kết với F, O, N mới tạo được liên kết hydrogen.", "C. $CH_4$ tạo được liên kết hydrogen.", "D. $H_2S$ tạo được liên kết hydrogen giữa các phân tử."], "answer": "B", "explain": "Chỉ khi H liên kết với nguyên tử có độ âm điện lớn (F, O, N) thì H mới mang đủ điện tích dương để tạo liên kết hydrogen.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chất sau, chất nào có thể tạo liên kết hydrogen với nước?", "options": ["A. $CCl_4$.", "B. $CH_3OH$ (methanol).", "C. $CH_4$.", "D. $He$."], "answer": "B", "explain": "Methanol ($CH_3OH$) có nhóm -OH tạo được liên kết hydrogen với nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhiệt độ nóng chảy của nước đá là $0^\\circ C$. Nếu không có liên kết hydrogen, nhiệt độ nóng chảy của nước dự đoán khoảng", "options": ["A. $0^\\circ C$.", "B. $100^\\circ C$.", "C. khoảng $-100^\\circ C$ (thấp hơn nhiều).", "D. $1000^\\circ C$."], "answer": "C", "explain": "Nếu không có liên kết hydrogen, nước ($H_2O$) sẽ có nhiệt độ nóng chảy, nhiệt độ sôi thấp tương tự $H_2S$ (dự đoán khoảng -100 độ C).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong các chất sau, chất nào có nhiệt độ sôi thấp nhất?", "options": ["A. $H_2O$.", "B. $HF$.", "C. $NH_3$.", "D. $CH_4$."], "answer": "D", "explain": "$CH_4$ không phân cực, không có liên kết hydrogen, chỉ có tương tác van der Waals rất yếu nên nhiệt độ sôi thấp nhất (-161,5 độ C).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $H_2O$ vừa cho vừa nhận liên kết hydrogen.", "b) $NH_3$ vừa cho vừa nhận liên kết hydrogen.", "c) $HF$ vừa cho vừa nhận liên kết hydrogen.", "d) $CH_4$ vừa cho vừa nhận liên kết hydrogen."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $CH_4$ không tạo được liên kết hydrogen.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $(CH_3)_2O$ chỉ nhận liên kết hydrogen.", "b) $CH_3OH$ vừa cho vừa nhận liên kết hydrogen.", "c) $CCl_4$ không tạo liên kết hydrogen với nước.", "d) $He$ có liên kết hydrogen."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: không có H liên kết với O. b) Đúng: có nhóm -OH. c) Đúng: không phân cực. d) Sai: He chỉ có tương tác van der Waals.", "points": 1}, {"type": "short", "level": "VD", "q": "Phân tử $CH_3OH$ có thể tạo liên kết hydrogen với nước không? (trả lời: có hoặc không)", "answer": "có", "explain": "Methanol có nhóm -OH tạo được liên kết hydrogen với nước nên tan vô hạn trong nước.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong các chất $H_2O, NH_3, HF, CH_4$, có bao nhiêu chất vừa cho vừa nhận được liên kết hydrogen?", "answer": "3", "explain": "Có 3 chất: $H_2O, NH_3, HF$. $CH_4$ không tạo được liên kết hydrogen.", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Tương tác van der Waals ảnh hưởng đến", "options": ["A. màu sắc của chất.", "B. nhiệt độ nóng chảy, nhiệt độ sôi của chất.", "C. khối lượng nguyên tử.", "D. số oxi hóa."], "answer": "B", "explain": "Tương tác van der Waals càng mạnh thì cần càng nhiều năng lượng để tách các phân tử ra xa nhau, làm tăng nhiệt độ nóng chảy, nhiệt độ sôi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khí $Cl_2$ hóa lỏng ở $-34^\\circ C$ nhờ", "options": ["A. liên kết hydrogen.", "B. tương tác van der Waals giữa các phân tử $Cl_2$.", "C. liên kết ion.", "D. liên kết cộng hóa trị giữa các phân tử."], "answer": "B", "explain": "Các phân tử $Cl_2$ không cực, không tạo liên kết hydrogen; chúng hút nhau nhờ tương tác van der Waals nên $Cl_2$ hóa lỏng ở -34 độ C.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chất sau, chất nào tồn tại ở thể lỏng ở điều kiện thường nhờ tương tác van der Waals đủ mạnh?", "options": ["A. $F_2$.", "B. $Cl_2$.", "C. $Br_2$.", "D. $He$."], "answer": "C", "explain": "$Br_2$ có khối lượng phân tử đủ lớn (160) nên tương tác van der Waals đủ mạnh để $Br_2$ tồn tại ở thể lỏng ở điều kiện thường (t_s = 59 độ C).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chất sau, chất nào tồn tại ở thể rắn ở điều kiện thường?", "options": ["A. $F_2$.", "B. $Cl_2$.", "C. $Br_2$.", "D. $I_2$."], "answer": "D", "explain": "$I_2$ có khối lượng phân tử lớn nhất (254) nên tương tác van der Waals mạnh nhất, tồn tại ở thể rắn ở điều kiện thường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nhiệt độ sôi của các alkane $CH_4$ ($-161^\\circ C$), $C_2H_6$ ($-89^\\circ C$), $C_3H_8$ ($-42^\\circ C$) tăng dần vì", "options": ["A. liên kết hydrogen tăng dần.", "B. tương tác van der Waals tăng dần theo khối lượng phân tử.", "C. liên kết cộng hóa trị tăng dần.", "D. độ phân cực tăng dần."], "answer": "B", "explain": "Các alkane không phân cực, không có liên kết hydrogen; nhiệt độ sôi tăng theo khối lượng phân tử do tương tác van der Waals tăng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Pentane ($C_5H_{12}$, $t_s = 36^\\circ C$) và neopentane ($C_5H_{12}$, $t_s = 10^\\circ C$) là đồng phân của nhau. Nhiệt độ sôi của pentane cao hơn vì", "options": ["A. pentane có liên kết hydrogen.", "B. phân tử pentane dạng mạch thẳng tiếp xúc nhau nhiều hơn, tương tác van der Waals mạnh hơn.", "C. neopentane có khối lượng phân tử lớn hơn.", "D. pentane phân cực mạnh hơn."], "answer": "B", "explain": "Phân tử pentane mạch thẳng có diện tích tiếp xúc giữa các phân tử lớn hơn neopentane (dạng cầu), nên tương tác van der Waals mạnh hơn, nhiệt độ sôi cao hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $F_2$ là chất khí ở điều kiện thường.", "b) $Cl_2$ là chất khí ở điều kiện thường.", "c) $Br_2$ là chất lỏng ở điều kiện thường.", "d) $I_2$ là chất rắn ở điều kiện thường."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: thể tồn tại thay đổi theo chiều tăng của tương tác van der Waals.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhiệt độ sôi của alkane tăng theo khối lượng phân tử.", "b) Nguyên nhân là do tương tác van der Waals tăng.", "c) Các alkane có liên kết hydrogen.", "d) $CH_4$ có nhiệt độ sôi thấp nhất trong dãy alkane."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: alkane không phân cực, không có liên kết hydrogen. d) Đúng: $CH_4$ có khối lượng phân tử nhỏ nhất.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong các halogen $F_2, Cl_2, Br_2, I_2$, chất nào tồn tại ở thể lỏng ở điều kiện thường?", "answer": "Br2", "explain": "$Br_2$ có nhiệt độ sôi 59 độ C nên tồn tại ở thể lỏng ở điều kiện thường.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong các halogen $F_2, Cl_2, Br_2, I_2$, chất nào tồn tại ở thể rắn ở điều kiện thường?", "answer": "I2", "explain": "$I_2$ có tương tác van der Waals mạnh nhất nên tồn tại ở thể rắn ở điều kiện thường.", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng về liên kết hydrogen?", "options": ["A. Liên kết hydrogen là liên kết cộng hóa trị.", "B. Liên kết hydrogen là tương tác tĩnh điện yếu giữa các phân tử.", "C. Liên kết hydrogen mạnh hơn liên kết cộng hóa trị.", "D. Liên kết hydrogen chỉ tồn tại trong kim loại."], "answer": "B", "explain": "Liên kết hydrogen là tương tác tĩnh điện (yếu hơn nhiều so với liên kết cộng hóa trị) giữa nguyên tử H mang một phần điện tích dương và nguyên tử có độ âm điện lớn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng về tương tác van der Waals?", "options": ["A. Là tương tác mạnh nhất giữa các phân tử.", "B. Chỉ tồn tại ở chất phân cực.", "C. Là tương tác yếu, tồn tại ở mọi chất.", "D. Là liên kết cộng hóa trị."], "answer": "C", "explain": "Tương tác van der Waals là tương tác yếu nhất, tồn tại ở mọi chất kể cả khí hiếm và phân tử không cực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chất sau, chất nào có liên kết hydrogen nội phân tử (trong cùng một phân tử)?", "options": ["A. $H_2O$.", "B. o-nitrophenol (nhóm -OH và nhóm $-NO_2$ ở vị trí ortho).", "C. $CH_4$.", "D. $NaCl$."], "answer": "B", "explain": "Trong o-nitrophenol, nhóm -OH tạo liên kết hydrogen với nguyên tử O của nhóm $-NO_2$ trong cùng một phân tử (liên kết hydrogen nội phân tử).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "o-nitrophenol có nhiệt độ sôi thấp hơn p-nitrophenol vì", "options": ["A. o-nitrophenol có liên kết hydrogen nội phân tử nên ít tạo liên kết hydrogen liên phân tử.", "B. o-nitrophenol có khối lượng phân tử nhỏ hơn.", "C. p-nitrophenol là hợp chất ion.", "D. o-nitrophenol không phân cực."], "answer": "A", "explain": "o-nitrophenol tạo liên kết hydrogen nội phân tử nên ít tạo liên kết hydrogen với các phân tử khác, nhiệt độ sôi thấp hơn p-nitrophenol (tạo liên kết hydrogen liên phân tử).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong các chất sau, chất nào có độ tan trong nước lớn nhất?", "options": ["A. $CH_4$.", "B. $C_2H_5OH$.", "C. $CCl_4$.", "D. $I_2$."], "answer": "B", "explain": "Ethanol ($C_2H_5OH$) có nhóm -OH tạo được liên kết hydrogen với nước nên tan vô hạn trong nước.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 9,2 gam ethanol ($C_2H_5OH$) tan hoàn toàn trong nước được 100 ml dung dịch. Nồng độ mol của dung dịch là", "options": ["A. 1M.", "B. 2M.", "C. 0,5M.", "D. 4M."], "answer": "B", "explain": "Số mol ethanol = 9,2/46 = 0,2 mol. Nồng độ = 0,2/0,1 = 2M.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Liên kết hydrogen là tương tác tĩnh điện.", "b) Tương tác van der Waals là tương tác yếu.", "c) Liên kết hydrogen mạnh hơn liên kết cộng hóa trị.", "d) Tương tác van der Waals mạnh hơn liên kết hydrogen."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng. b) Đúng. c) Sai. d) Sai.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ethanol tan vô hạn trong nước.", "b) Nguyên nhân là do ethanol tạo liên kết hydrogen với nước.", "c) $CCl_4$ tan tốt trong nước.", "d) $I_2$ tan tốt trong $CCl_4$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: nhóm -OH. c) Sai: $CCl_4$ không phân cực, ít tan trong nước. d) Đúng: $I_2$ và $CCl_4$ đều không phân cực nên tan tốt trong nhau.", "points": 1}, {"type": "short", "level": "VD", "q": "Loại liên kết nào tồn tại giữa nhóm -OH và nhóm $-NO_2$ trong cùng phân tử o-nitrophenol?", "answer": "liên kết hydrogen nội phân tử", "explain": "Đó là liên kết hydrogen nội phân tử (trong cùng một phân tử).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong các chất $C_2H_5OH, CH_3OCH_3, C_2H_6$, có bao nhiêu chất tạo được liên kết hydrogen giữa các phân tử?", "answer": "1", "explain": "Chỉ có $C_2H_5OH$ (có nhóm -OH) tạo được liên kết hydrogen giữa các phân tử.", {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Ôn tập: Liên kết cộng hóa trị được tạo thành bởi", "options": ["A. lực hút tĩnh điện giữa các ion.", "B. sự dùng chung cặp electron.", "C. sự nhường proton.", "D. tương tác van der Waals."], "answer": "B", "explain": "Liên kết cộng hóa trị là liên kết được tạo thành bởi sự dùng chung một hay nhiều cặp electron giữa hai nguyên tử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ôn tập: Liên kết ion được tạo thành bởi", "options": ["A. sự dùng chung electron.", "B. lực hút tĩnh điện giữa các ion trái dấu.", "C. liên kết hydrogen.", "D. tương tác van der Waals."], "answer": "B", "explain": "Liên kết ion là liên kết được tạo thành bởi lực hút tĩnh điện giữa các ion mang điện tích trái dấu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chất sau, chất nào có liên kết hydrogen giữa các phân tử?", "options": ["A. $H_2S$.", "B. $PH_3$.", "C. $NH_3$.", "D. $CH_4$."], "answer": "C", "explain": "Chỉ có $NH_3$ (N-H···N) tạo được liên kết hydrogen giữa các phân tử trong 4 chất trên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chất sau, chất nào chỉ có tương tác van der Waals giữa các phân tử?", "options": ["A. $H_2O$.", "B. $NH_3$.", "C. $CH_4$.", "D. $HF$."], "answer": "C", "explain": "$CH_4$ không phân cực, không tạo liên kết hydrogen; giữa các phân tử $CH_4$ chỉ có tương tác van der Waals.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sắp xếp các chất $NaCl, H_2O, CH_4$ theo chiều tăng dần của nhiệt độ nóng chảy:", "options": ["A. $CH_4, H_2O, NaCl$.", "B. $NaCl, H_2O, CH_4$.", "C. $H_2O, CH_4, NaCl$.", "D. $CH_4, NaCl, H_2O$."], "answer": "A", "explain": "$CH_4$ chỉ có tương tác van der Waals yếu; $H_2O$ có liên kết hydrogen; NaCl là hợp chất ion có mạng tinh thể bền. Nhiệt độ nóng chảy tăng dần theo thứ tự này.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đốt cháy hoàn toàn 4,6 gam ethanol ($C_2H_5OH$). Thể tích khí $CO_2$ thu được ở đktc là", "options": ["A. 2,24 lít.", "B. 4,48 lít.", "C. 6,72 lít.", "D. 1,12 lít."], "answer": "B", "explain": "Số mol ethanol = 4,6/46 = 0,1 mol. $C_2H_5OH + 3O_2$ tạo thành $2CO_2 + 3H_2O$. Số mol $CO_2$ = 0,2 mol, thể tích = 0,2 nhân 22,4 = 4,48 lít.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $NaCl$ là hợp chất ion.", "b) $H_2O$ là hợp chất cộng hóa trị.", "c) $CH_4$ là hợp chất cộng hóa trị.", "d) $MgO$ là hợp chất cộng hóa trị."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: MgO là hợp chất ion.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giữa các phân tử $H_2O$ có liên kết hydrogen.", "b) Giữa các phân tử $CH_4$ chỉ có tương tác van der Waals.", "c) Giữa các ion $Na^+$ và $Cl^-$ có liên kết ion.", "d) Giữa các phân tử $H_2$ có liên kết hydrogen."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: giữa các phân tử $H_2$ chỉ có tương tác van der Waals.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong các chất $HF, H_2O, NH_3$, chất nào có nhiệt độ sôi cao nhất?", "answer": "H2O", "explain": "Nước có nhiệt độ sôi cao nhất (100 độ C) nhờ mạng liên kết hydrogen bền vững giữa các phân tử.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong các chất $F_2, Cl_2, Br_2$, chất nào có nhiệt độ sôi cao nhất?", "answer": "Br2", "explain": "$Br_2$ có khối lượng phân tử lớn nhất trong 3 chất nên tương tác van der Waals mạnh nhất, nhiệt độ sôi cao nhất (59 độ C).", "points": 0.5}]}]}
