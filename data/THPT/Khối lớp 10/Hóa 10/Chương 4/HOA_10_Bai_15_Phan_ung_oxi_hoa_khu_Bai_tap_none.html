ự khử là quá trình nhận electron.", "c) Trong sự oxi hóa, số oxi hóa tăng.", "d) Trong sự khử, số oxi hóa tăng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: trong sự khử, số oxi hóa giảm.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Zn$ tạo thành $Zn^{2+} + 2e$ là sự oxi hóa.", "b) $2H^+ + 2e$ tạo thành $H_2$ là sự khử.", "c) $Cu^{2+} + 2e$ tạo thành $Cu$ là sự oxi hóa.", "d) $Al$ tạo thành $Al^{3+} + 3e$ là sự khử."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: nhường electron. b) Đúng: nhận electron. c) Sai: đây là sự khử. d) Sai: đây là sự oxi hóa.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết quá trình oxi hóa của $Mg$ thành $Mg^{2+}$ (dạng text, ví dụ: Zn thành Zn2+ + 2e).", "answer": "Mg thành Mg2+ + 2e", "explain": "Mg nhường 2 electron: Mg thành $Mg^{2+} + 2e$ (dạng text: Mg thành Mg2+ + 2e).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Viết quá trình khử của $H^+$ thành $H_2$ (dạng text).", "answer": "2H+ + 2e thành H2", "explain": "$2H^+ + 2e$ tạo thành $H_2$ (dạng text: 2H+ + 2e thành H2).", "points": 0.5}]},
{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Phản ứng oxi hóa - khử là phản ứng trong đó", "options": ["A. không có sự thay đổi số oxi hóa.", "B. có sự thay đổi số oxi hóa của một số nguyên tử.", "C. chỉ có sự thay đổi trạng thái.", "D. không có sự nhường, nhận electron."], "answer": "B", "explain": "Phản ứng oxi hóa - khử là phản ứng hóa học trong đó có sự thay đổi số oxi hóa của một số nguyên tử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dấu hiệu nhận biết phản ứng oxi hóa - khử là", "options": ["A. có chất khí thoát ra.", "B. có sự thay đổi số oxi hóa của nguyên tố.", "C. có sự thay đổi màu sắc.", "D. có kết tủa."], "answer": "B", "explain": "Dấu hiệu nhận biết phản ứng oxi hóa - khử là có nguyên tố thay đổi số oxi hóa trước và sau phản ứng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các phản ứng sau, phản ứng nào là phản ứng oxi hóa - khử?", "options": ["A. $NaOH + HCl$ tạo thành $NaCl + H_2O$.", "B. $2Na + Cl_2$ tạo thành $2NaCl$.", "C. $CaO + H_2O$ tạo thành $Ca(OH)_2$.", "D. $Na_2O + H_2O$ tạo thành $2NaOH$."], "answer": "B", "explain": "Trong phản ứng $2Na + Cl_2$ tạo thành $2NaCl$, số oxi hóa của Na tăng (0 lên +1), của Cl giảm (0 xuống -1) nên là phản ứng oxi hóa - khử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các phản ứng sau, phản ứng nào KHÔNG phải là phản ứng oxi hóa - khử?", "options": ["A. $Zn + 2HCl$ tạo thành $ZnCl_2 + H_2$.", "B. $Fe + CuSO_4$ tạo thành $FeSO_4 + Cu$.", "C. $NaOH + HCl$ tạo thành $NaCl + H_2O$.", "D. $C + O_2$ tạo thành $CO_2$."], "answer": "C", "explain": "Trong phản ứng $NaOH + HCl$ tạo thành $NaCl + H_2O$, số oxi hóa của mọi nguyên tố không đổi nên không phải phản ứng oxi hóa - khử.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong phản ứng $CuO + H_2$ tạo thành $Cu + H_2O$ (đun nóng), chất khử là", "options": ["A. $CuO$.", "B. $H_2$.", "C. $Cu$.", "D. $H_2O$."], "answer": "B", "explain": "$H_2$ nhường electron (số oxi hóa của H tăng từ 0 lên +1) nên $H_2$ là chất khử; $Cu^{2+}$ trong CuO là chất oxi hóa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong phản ứng $Fe_2O_3 + 3CO$ tạo thành $2Fe + 3CO_2$ (đun nóng), chất oxi hóa là", "options": ["A. $CO$.", "B. $Fe_2O_3$.", "C. $Fe$.", "D. $CO_2$."], "answer": "B", "explain": "$Fe^{3+}$ trong $Fe_2O_3$ nhận electron (số oxi hóa giảm từ +3 xuống 0) nên $Fe_2O_3$ là chất oxi hóa; CO là chất khử.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $2Na + Cl_2$ tạo thành $2NaCl$ là phản ứng oxi hóa - khử.", "b) $NaOH + HCl$ tạo thành $NaCl + H_2O$ là phản ứng oxi hóa - khử.", "c) $Zn + 2HCl$ tạo thành $ZnCl_2 + H_2$ là phản ứng oxi hóa - khử.", "d) $CaO + H_2O$ tạo thành $Ca(OH)_2$ là phản ứng oxi hóa - khử."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: Na (0 lên +1), Cl (0 xuống -1). b) Sai: số oxi hóa không đổi. c) Đúng: Zn (0 lên +2), H (+1 xuống 0). d) Sai: số oxi hóa không đổi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $C + O_2$ tạo thành $CO_2$ là phản ứng oxi hóa - khử.", "b) $CaCO_3$ tạo thành $CaO + CO_2$ là phản ứng oxi hóa - khử.", "c) $2H_2 + O_2$ tạo thành $2H_2O$ là phản ứng oxi hóa - khử.", "d) $NaCl + AgNO_3$ tạo thành $AgCl + NaNO_3$ là phản ứng oxi hóa - khử."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: C (0 lên +4), O (0 xuống -2). b) Sai: số oxi hóa không đổi (phản ứng phân hủy). c) Đúng. d) Sai: số oxi hóa không đổi (phản ứng trao đổi).", "points": 1}, {"type": "short", "level": "VD", "q": "Trong phản ứng $CuO + H_2$ tạo thành $Cu + H_2O$, số oxi hóa của $Cu$ thay đổi từ bao nhiêu đến bao nhiêu? (ghi dạng +2 thành 0)", "answer": "+2 thành 0", "explain": "Trong CuO, Cu có số oxi hóa +2; sau phản ứng Cu đơn chất có số oxi hóa 0.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong phản ứng $Fe_2O_3 + 3CO$ tạo thành $2Fe + 3CO_2$, số oxi hóa của $C$ thay đổi từ bao nhiêu đến bao nhiêu? (ghi dạng +2 thành +4)", "answer": "+2 thành +4", "explain": "Trong CO, C có số oxi hóa +2; trong $CO_2$, C có số oxi hóa +4.", "points": 0.5}]},
{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Bước đầu tiên khi cân bằng phản ứng oxi hóa - khử bằng phương pháp thăng bằng electron là", "options": ["A. viết quá trình oxi hóa, quá trình khử.", "B. xác định số oxi hóa, tìm chất oxi hóa và chất khử.", "C. tìm hệ số thích hợp.", "D. kiểm tra số nguyên tử."], "answer": "B", "explain": "Bước 1: xác định số oxi hóa của các nguyên tố, tìm chất oxi hóa và chất khử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tắc của phương pháp thăng bằng electron là", "options": ["A. tổng số electron nhường bằng tổng số electron nhận.", "B. tổng khối lượng hai vế bằng nhau.", "C. số nguyên tử oxi hai vế bằng nhau.", "D. số phân tử hai vế bằng nhau."], "answer": "A", "explain": "Nguyên tắc: tổng số electron do chất khử nhường bằng tổng số electron do chất oxi hóa nhận.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cân bằng phản ứng: $Al + HCl$ tạo thành $AlCl_3 + H_2$. Hệ số cân bằng (tối giản) lần lượt là", "options": ["A. 2, 6, 2, 3.", "B. 1, 3, 1, 2.", "C. 2, 3, 2, 3.", "D. 1, 6, 1, 3."], "answer": "A", "explain": "Quá trình oxi hóa: Al tạo thành $Al^{3+} + 3e$. Quá trình khử: $2H^+ + 2e$ tạo thành $H_2$. Bội số chung nhỏ nhất của 3 và 2 là 6. Phương trình: $2Al + 6HCl$ tạo thành $2AlCl_3 + 3H_2$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cân bằng phản ứng: $Mg + HCl$ tạo thành $MgCl_2 + H_2$. Hệ số cân bằng (tối giản) lần lượt là", "options": ["A. 1, 2, 1, 1.", "B. 1, 1, 1, 1.", "C. 2, 2, 2, 1.", "D. 1, 4, 1, 2."], "answer": "A", "explain": "Quá trình oxi hóa: Mg tạo thành $Mg^{2+} + 2e$. Quá trình khử: $2H^+ + 2e$ tạo thành $H_2$. Số electron nhường = số electron nhận = 2. Phương trình: $Mg + 2HCl$ tạo thành $MgCl_2 + H_2$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cân bằng phản ứng: $Fe + H_2SO_4$ (loãng) tạo thành $FeSO_4 + H_2$. Hệ số cân bằng (tối giản) lần lượt là", "options": ["A. 1, 1, 1, 1.", "B. 1, 2, 1, 2.", "C. 2, 1, 2, 1.", "D. 1, 2, 2, 1."], "answer": "A", "explain": "Quá trình oxi hóa: Fe tạo thành $Fe^{2+} + 2e$. Quá trình khử: $2H^+ + 2e$ tạo thành $H_2$. Số electron bằng nhau. Phương trình: $Fe + H_2SO_4$ tạo thành $FeSO_4 + H_2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cân bằng phản ứng: $Zn + H_2SO_4$ (loãng) tạo thành $ZnSO_4 + H_2$. Hệ số của $H_2SO_4$ là", "options": ["A. 1.", "B. 2.", "C. 3.", "D. 4."], "answer": "A", "explain": "Quá trình oxi hóa: Zn tạo thành $Zn^{2+} + 2e$. Quá trình khử: $2H^+ + 2e$ tạo thành $H_2$. Phương trình: $Zn + H_2SO_4$ tạo thành $ZnSO_4 + H_2$. Hệ số của $H_2SO_4$ là 1.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về phương pháp thăng bằng electron:", "statements": ["a) Bước 1 là xác định số oxi hóa.", "b) Bước 2 là viết quá trình oxi hóa, quá trình khử.", "c) Bước 3 là tìm hệ số sao cho electron nhường = electron nhận.", "d) Bước 4 là kiểm tra số nguyên tử hai vế."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: đây là 4 bước của phương pháp thăng bằng electron.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $2Al + 6HCl$ tạo thành $2AlCl_3 + 3H_2$ đã cân bằng đúng.", "b) $Mg + 2HCl$ tạo thành $MgCl_2 + H_2$ đã cân bằng đúng.", "c) $Fe + H_2SO_4$ tạo thành $FeSO_4 + H_2$ đã cân bằng đúng.", "d) $Zn + H_2SO_4$ tạo thành $ZnSO_4 + 2H_2$ đã cân bằng đúng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: vế phải thừa H (đúng là $Zn + H_2SO_4$ tạo thành $ZnSO_4 + H_2$).", "points": 1}, {"type": "short", "level": "VD", "q": "Cân bằng phản ứng: $Na + H_2O$ tạo thành $NaOH + H_2$. Hệ số của $H_2O$ là bao nhiêu?", "answer": "2", "explain": "Quá trình oxi hóa: Na tạo thành $Na^+ + 1e$ (nhân 2). Quá trình khử: $2H^+ + 2e$ tạo thành $H_2$. Phương trình: $2Na + 2H_2O$ tạo thành $2NaOH + H_2$. Hệ số của $H_2O$ là 2.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cân bằng phản ứng: $Ca + H_2O$ tạo thành $Ca(OH)_2 + H_2$. Hệ số của $H_2O$ là bao nhiêu?", "answer": "2", "explain": "Quá trình oxi hóa: Ca tạo thành $Ca^{2+} + 2e$. Quá trình khử: $2H^+ + 2e$ tạo thành $H_2$. Phương trình: $Ca + 2H_2O$ tạo thành $Ca(OH)_2 + H_2$. Hệ số của $H_2O$ là 2.", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Số oxi hóa của $O$ trong $H_2O_2$ là", "options": ["A. -2.", "B. -1.", "C. 0.", "D. +1."], "answer": "B", "explain": "$H_2O_2$ là peroxide nên O có số oxi hóa -1 (H là +1: 2 nhân (+1) + 2x = 0, x = -1).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Số oxi hóa của $O$ trong $OF_2$ là", "options": ["A. -2.", "B. -1.", "C. +2.", "D. 0."], "answer": "C", "explain": "Trong $OF_2$, F có độ âm điện lớn hơn O nên F là -1, O có số oxi hóa +2.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số oxi hóa của $N$ trong $NH_3$ là", "options": ["A. +3.", "B. -3.", "C. 0.", "D. +5."], "answer": "B", "explain": "H là +1. Gọi số oxi hóa của N là x: x + 3 nhân (+1) = 0, suy ra x = -3.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số oxi hóa của $N$ trong $NO_2$ là", "options": ["A. +2.", "B. +4.", "C. +5.", "D. -4."], "answer": "B", "explain": "O là -2. Gọi số oxi hóa của N là x: x + 2 nhân (-2) = 0, suy ra x = +4.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Số oxi hóa của $S$ trong ion $SO_4^{2-}$ là", "options": ["A. +4.", "B. +6.", "C. -2.", "D. +2."], "answer": "B", "explain": "O là -2. Gọi số oxi hóa của S là x: x + 4 nhân (-2) = -2 (điện tích của ion), suy ra x = +6.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Số oxi hóa của $Mn$ trong ion $MnO_4^-$ là", "options": ["A. +7.", "B. +4.", "C. +2.", "D. +6."], "answer": "A", "explain": "O là -2. Gọi số oxi hóa của Mn là x: x + 4 nhân (-2) = -1, suy ra x = +7.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số oxi hóa của O trong $H_2O$ là -2.", "b) Số oxi hóa của O trong $H_2O_2$ là -1.", "c) Số oxi hóa của O trong $OF_2$ là +2.", "d) Số oxi hóa của O trong $O_2$ là -2."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: peroxide. c) Đúng. d) Sai: $O_2$ là đơn chất nên số oxi hóa bằng 0.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số oxi hóa của H trong $HCl$ là +1.", "b) Số oxi hóa của H trong $NaH$ là -1.", "c) Số oxi hóa của H trong $H_2$ là 0.", "d) Số oxi hóa của H trong $H_2O$ là -1."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: hydride kim loại. c) Đúng: đơn chất. d) Sai: H trong $H_2O$ có số oxi hóa +1.", "points": 1}, {"type": "short", "level": "VD", "q": "Xác định số oxi hóa của $Cl$ trong $HClO$ (chỉ ghi số, ví dụ +1).", "answer": "+1", "explain": "H là +1, O là -2. Gọi số oxi hóa của Cl là x: (+1) + x + (-2) = 0, suy ra x = +1.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Xác định số oxi hóa của $Cl$ trong $HClO_3$ (chỉ ghi số, ví dụ +5).", "answer": "+5", "explain": "H là +1, O là -2. Gọi số oxi hóa của Cl là x: (+1) + x + 3 nhân (-2) = 0, suy ra x = +5.", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Câu thần chú nhớ chất oxi hóa, chất khử là", "options": ["A. Khử cho O nhận.", "B. Oxi cho khử nhận.", "C. Khử nhận O cho.", "D. Oxi nhận khử cho."], "answer": "A", "explain": "Câu thần chú: Khử cho O nhận, nghĩa là chất khử nhường (cho) electron, chất oxi hóa (O) nhận electron.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi tham gia phản ứng oxi hóa - khử, số oxi hóa của chất khử", "options": ["A. giảm.", "B. tăng.", "C. không đổi.", "D. bằng 0."], "answer": "B", "explain": "Chất khử nhường electron nên số oxi hóa tăng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi tham gia phản ứng oxi hóa - khử, số oxi hóa của chất oxi hóa", "options": ["A. tăng.", "B. giảm.", "C. không đổi.", "D. bằng 0."], "answer": "B", "explain": "Chất oxi hóa nhận electron nên số oxi hóa giảm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng $2Mg + O_2$ tạo thành $2MgO$ (đốt cháy), chất khử là", "options": ["A. $Mg$.", "B. $O_2$.", "C. $MgO$.", "D. không có."], "answer": "A", "explain": "Mg nhường electron (số oxi hóa tăng từ 0 lên +2) nên Mg là chất khử; $O_2$ là chất oxi hóa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong phản ứng $2H_2S + 3O_2$ tạo thành $2SO_2 + 2H_2O$ (đốt cháy), chất oxi hóa là", "options": ["A. $H_2S$.", "B. $O_2$.", "C. $SO_2$.", "D. $H_2O$."], "answer": "B", "explain": "$O_2$ nhận electron (số oxi hóa của O giảm từ 0 xuống -2) nên $O_2$ là chất oxi hóa; $H_2S$ (S từ -2 lên +4) là chất khử.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong phản ứng $CH_4 + 2O_2$ tạo thành $CO_2 + 2H_2O$ (đốt cháy), số oxi hóa của $C$ thay đổi từ", "options": ["A. -4 thành +4.", "B. 0 thành +4.", "C. +4 thành -4.", "D. -4 thành 0."], "answer": "A", "explain": "Trong $CH_4$, C có số oxi hóa -4 (H là +1); trong $CO_2$, C có số oxi hóa +4 (O là -2).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chất khử có số oxi hóa tăng.", "b) Chất oxi hóa có số oxi hóa giảm.", "c) Khử cho O nhận.", "d) Chất khử nhận electron."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: chất khử nhường electron.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về phản ứng $2Mg + O_2$ tạo thành $2MgO$:", "statements": ["a) $Mg$ là chất khử.", "b) $O_2$ là chất oxi hóa.", "c) Số oxi hóa của Mg tăng từ 0 lên +2.", "d) Số oxi hóa của O tăng từ 0 lên -2."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: số oxi hóa của O giảm từ 0 xuống -2.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong phản ứng $2H_2 + O_2$ tạo thành $2H_2O$, chất khử là chất nào? (ghi công thức)", "answer": "H2", "explain": "$H_2$ nhường electron (số oxi hóa của H tăng từ 0 lên +1) nên $H_2$ là chất khử.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong phản ứng $2H_2 + O_2$ tạo thành $2H_2O$, chất oxi hóa là chất nào? (ghi công thức)", "answer": "O2", "explain": "$O_2$ nhận electron (số oxi hóa của O giảm từ 0 xuống -2) nên $O_2$ là chất oxi hóa.", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Phản ứng nào sau đây là phản ứng oxi hóa - khử?", "options": ["A. $Na_2O + H_2O$ tạo thành $2NaOH$.", "B. $C + O_2$ tạo thành $CO_2$.", "C. $CaO + CO_2$ tạo thành $CaCO_3$.", "D. $HCl + NaOH$ tạo thành $NaCl + H_2O$."], "answer": "B", "explain": "Trong phản ứng $C + O_2$ tạo thành $CO_2$, số oxi hóa của C tăng (0 lên +4), của O giảm (0 xuống -2) nên là phản ứng oxi hóa - khử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phản ứng nào sau đây KHÔNG phải là phản ứng oxi hóa - khử?", "options": ["A. $2H_2 + O_2$ tạo thành $2H_2O$.", "B. $Zn + CuSO_4$ tạo thành $ZnSO_4 + Cu$.", "C. $AgNO_3 + NaCl$ tạo thành $AgCl + NaNO_3$.", "D. $Fe + 2HCl$ tạo thành $FeCl_2 + H_2$."], "answer": "C", "explain": "Trong phản ứng $AgNO_3 + NaCl$ tạo thành $AgCl + NaNO_3$, số oxi hóa của mọi nguyên tố không đổi (phản ứng trao đổi).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng $2KClO_3$ tạo thành $2KCl + 3O_2$ (đun nóng, xúc tác), số oxi hóa của $Cl$ thay đổi từ", "options": ["A. +5 thành -1.", "B. -1 thành +5.", "C. +5 thành 0.", "D. 0 thành -1."], "answer": "A", "explain": "Trong $KClO_3$, Cl có số oxi hóa +5; trong KCl, Cl có số oxi hóa -1. (Phản ứng tự oxi hóa - khử: O từ -2 lên 0.)", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng $2KClO_3$ tạo thành $2KCl + 3O_2$, số oxi hóa của $O$ thay đổi từ", "options": ["A. -2 thành 0.", "B. 0 thành -2.", "C. -1 thành 0.", "D. -2 thành +2."], "answer": "A", "explain": "Trong $KClO_3$, O có số oxi hóa -2; trong $O_2$ đơn chất, O có số oxi hóa 0.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cân bằng phản ứng: $Fe + CuSO_4$ tạo thành $FeSO_4 + Cu$. Tổng hệ số cân bằng (tối giản) là", "options": ["A. 2.", "B. 3.", "C. 4.", "D. 5."], "answer": "C", "explain": "Phương trình đã cân bằng: $Fe + CuSO_4$ tạo thành $FeSO_4 + Cu$. Tổng hệ số = 1 + 1 + 1 + 1 = 4.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 5,6 gam $Fe$ tác dụng hết với dung dịch $CuSO_4$ dư. Khối lượng $Cu$ thu được là", "options": ["A. 6,4 gam.", "B. 3,2 gam.", "C. 12,8 gam.", "D. 9,6 gam."], "answer": "A", "explain": "Số mol Fe = 5,6/56 = 0,1 mol. $Fe + CuSO_4$ tạo thành $FeSO_4 + Cu$. Số mol Cu = 0,1 mol, khối lượng = 0,1 nhân 64 = 6,4 gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $C + O_2$ tạo thành $CO_2$ là phản ứng oxi hóa - khử.", "b) $CaO + CO_2$ tạo thành $CaCO_3$ là phản ứng oxi hóa - khử.", "c) $2H_2 + O_2$ tạo thành $2H_2O$ là phản ứng oxi hóa - khử.", "d) $HCl + NaOH$ tạo thành $NaCl + H_2O$ là phản ứng oxi hóa - khử."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: số oxi hóa không đổi (phản ứng hóa hợp). c) Đúng. d) Sai: số oxi hóa không đổi (phản ứng trung hòa).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $2KClO_3$ tạo thành $2KCl + 3O_2$ là phản ứng oxi hóa - khử.", "b) $CaCO_3$ tạo thành $CaO + CO_2$ là phản ứng oxi hóa - khử.", "c) Trong $2KClO_3$ tạo thành $2KCl + 3O_2$, Cl là chất oxi hóa.", "d) Trong $2KClO_3$ tạo thành $2KCl + 3O_2$, O là chất khử."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: Cl (+5 xuống -1), O (-2 lên 0). b) Sai: số oxi hóa không đổi (phản ứng phân hủy). c) Đúng: Cl nhận electron (số oxi hóa giảm từ +5 xuống -1) nên nguyên tố Cl đóng vai trò chất oxi hóa. d) Đúng: O nhường electron (số oxi hóa tăng từ -2 lên 0) nên nguyên tố O đóng vai trò chất khử. Đây là phản ứng tự oxi hóa - khử.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong phản ứng $2KClO_3$ tạo thành $2KCl + 3O_2$, nguyên tố nào vừa là chất oxi hóa vừa là chất khử? (ghi kí hiệu nguyên tố)", "answer": "Cl và O (phản ứng tự oxi hóa - khử)", "explain": "Đây là phản ứng tự oxi hóa - khử: Cl (+5 xuống -1) là chất oxi hóa, O (-2 lên 0) là chất khử.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho 6,5 gam $Zn$ tác dụng hết với dung dịch $HCl$ dư. Thể tích khí $H_2$ thu được ở đktc là bao nhiêu lít?", "answer": "2,24", "explain": "Số mol Zn = 6,5/65 = 0,1 mol. $Zn + 2HCl$ tạo thành $ZnCl_2 + H_2$. Số mol $H_2$ = 0,1 mol, thể tích = 0,1 nhân 22,4 = 2,24 lít.", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Số oxi hóa của $Fe$ trong $FeO$ là", "options": ["A. +2.", "B. +3.", "C. 0.", "D. -2."], "answer": "A", "explain": "O là -2. Gọi số oxi hóa của Fe là x: x + (-2) = 0, suy ra x = +2.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Số oxi hóa của $Fe$ trong $Fe_2O_3$ là", "options": ["A. +2.", "B. +3.", "C. 0.", "D. +6."], "answer": "B", "explain": "O là -2. Gọi số oxi hóa của Fe là x: 2x + 3 nhân (-2) = 0, suy ra x = +3.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng $Fe_2O_3 + 3CO$ tạo thành $2Fe + 3CO_2$, chất khử là", "options": ["A. $Fe_2O_3$.", "B. $CO$.", "C. $Fe$.", "D. $CO_2$."], "answer": "B", "explain": "C trong CO nhường electron (số oxi hóa tăng từ +2 lên +4) nên CO là chất khử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng $Fe_2O_3 + 3CO$ tạo thành $2Fe + 3CO_2$, sự khử là", "options": ["A. $CO$ tạo thành $CO_2$.", "B. $Fe^{3+} + 3e$ tạo thành $Fe$.", "C. $Fe$ tạo thành $Fe^{3+} + 3e$.", "D. $CO_2$ tạo thành $CO$."], "answer": "B", "explain": "$Fe^{3+}$ nhận 3 electron (số oxi hóa giảm từ +3 xuống 0) nên đây là sự khử.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cân bằng phản ứng: $Cu + H_2SO_4$ (đặc, nóng) tạo thành $CuSO_4 + SO_2 + H_2O$. Hệ số cân bằng (tối giản) lần lượt là", "options": ["A. 1, 2, 1, 1, 2.", "B. 1, 4, 1, 2, 2.", "C. 2, 4, 2, 1, 2.", "D. 1, 2, 2, 1, 1."], "answer": "A", "explain": "Quá trình oxi hóa: Cu tạo thành $Cu^{2+} + 2e$. Quá trình khử: $SO_4^{2-} + 4H^+ + 2e$ tạo thành $SO_2 + 2H_2O$. Số electron bằng nhau. Phương trình: $Cu + 2H_2SO_4$ tạo thành $CuSO_4 + SO_2 + 2H_2O$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 6,4 gam $Cu$ tác dụng hết với $H_2SO_4$ đặc, nóng, dư. Thể tích khí $SO_2$ thu được ở đktc là", "options": ["A. 1,12 lít.", "B. 2,24 lít.", "C. 4,48 lít.", "D. 3,36 lít."], "answer": "B", "explain": "Số mol Cu = 6,4/64 = 0,1 mol. $Cu + 2H_2SO_4$ tạo thành $CuSO_4 + SO_2 + 2H_2O$. Số mol $SO_2$ = 0,1 mol, thể tích = 0,1 nhân 22,4 = 2,24 lít.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số oxi hóa của Fe trong FeO là +2.", "b) Số oxi hóa của Fe trong $Fe_2O_3$ là +3.", "c) Số oxi hóa của Fe trong Fe là 0.", "d) Số oxi hóa của Fe trong $FeCl_3$ là +2."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: đơn chất. d) Sai: Cl là -1 nên Fe trong $FeCl_3$ có số oxi hóa +3.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về phản ứng $Cu + 2H_2SO_4$ tạo thành $CuSO_4 + SO_2 + 2H_2O$:", "statements": ["a) $Cu$ là chất khử.", "b) $H_2SO_4$ (S) là chất oxi hóa.", "c) Số oxi hóa của Cu tăng từ 0 lên +2.", "d) Số oxi hóa của S tăng từ +6 lên +4."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: S nhận electron. c) Đúng. d) Sai: số oxi hóa của S giảm từ +6 xuống +4.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong phản ứng $Cu + 2H_2SO_4$ (đặc) tạo thành $CuSO_4 + SO_2 + 2H_2O$, số oxi hóa của $S$ thay đổi từ bao nhiêu đến bao nhiêu? (ghi dạng +6 thành +4)", "answer": "+6 thành +4", "explain": "Trong $H_2SO_4$, S có số oxi hóa +6; trong $SO_2$, S có số oxi hóa +4.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong phản ứng $C + 2H_2SO_4$ (đặc) tạo thành $CO_2 + 2SO_2 + 2H_2O$, chất khử là chất nào? (ghi công thức)", "answer": "C", "explain": "C nhường electron (số oxi hóa tăng từ 0 lên +4) nên C là chất khử.", "points": 0.5}]},
{"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Ôn tập: Số oxi hóa của $Na$ trong hợp chất là", "options": ["A. 0.", "B. +1.", "C. -1.", "D. +2."], "answer": "B", "explain": "Na là kim loại nhóm IA nên trong hợp chất có số oxi hóa +1.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ôn tập: Số oxi hóa của $O$ trong hợp chất (thông thường) là", "options": ["A. 0.", "B. +2.", "C. -2.", "D. -1."], "answer": "C", "explain": "Trong hợp chất (thông thường, trừ peroxide và $OF_2$), O có số oxi hóa -2.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số oxi hóa của $C$ trong $CO_2$ là", "options": ["A. +2.", "B. +4.", "C. -4.", "D. 0."], "answer": "B", "explain": "O là -2. Gọi số oxi hóa của C là x: x + 2 nhân (-2) = 0, suy ra x = +4.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số oxi hóa của $C$ trong $CH_4$ là", "options": ["A. +4.", "B. -4.", "C. 0.", "D. +2."], "answer": "B", "explain": "H là +1. Gọi số oxi hóa của C là x: x + 4 nhân (+1) = 0, suy ra x = -4.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong phản ứng $Cl_2 + 2NaOH$ tạo thành $NaCl + NaClO + H_2O$, số oxi hóa của $Cl$ thay đổi như thế nào?", "options": ["A. Từ 0 thành -1 và +1 (phản ứng tự oxi hóa - khử).", "B. Từ 0 thành +1 duy nhất.", "C. Từ 0 thành -1 duy nhất.", "D. Không thay đổi."], "answer": "A", "explain": "$Cl_2$ (số oxi hóa 0) vừa tạo thành $NaCl$ (Cl có số oxi hóa -1, sự khử) vừa tạo thành $NaClO$ (Cl có số oxi hóa +1, sự oxi hóa): phản ứng tự oxi hóa - khử.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 3,25 gam $Zn$ tác dụng hết với dung dịch $HCl$ dư. Khối lượng $ZnCl_2$ thu được là", "options": ["A. 6,8 gam.", "B. 3,4 gam.", "C. 13,6 gam.", "D. 1,7 gam."], "answer": "A", "explain": "Số mol Zn = 3,25/65 = 0,05 mol. $Zn + 2HCl$ tạo thành $ZnCl_2 + H_2$. Số mol $ZnCl_2$ = 0,05 mol, khối lượng = 0,05 nhân 136 = 6,8 gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:
