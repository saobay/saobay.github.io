ống -2) nên $O_2$ là chất oxi hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quá trình $2H^+ + 2e$ tạo thành $H_2$ là", "options": ["A. sự oxi hóa.", "B. sự khử.", "C. sự trung hòa.", "D. sự phân hủy."], "answer": "B", "explain": "$H^+$ nhận 2 electron (số oxi hóa giảm từ +1 xuống 0) nên là sự khử.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong phản ứng $Fe_2O_3 + 3CO$ tạo thành $2Fe + 3CO_2$, chất oxi hóa là", "options": ["A. $CO$.", "B. $Fe_2O_3$.", "C. $Fe$.", "D. $CO_2$."], "answer": "B", "explain": "$Fe^{3+}$ trong $Fe_2O_3$ nhận electron (số oxi hóa giảm từ +3 xuống 0) nên $Fe_2O_3$ là chất oxi hóa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cân bằng phản ứng: $Cu + H_2SO_4$ (đặc, nóng) tạo thành $CuSO_4 + SO_2 + H_2O$. Hệ số của $H_2SO_4$ là", "options": ["A. 1.", "B. 2.", "C. 3.", "D. 4."], "answer": "B", "explain": "Quá trình oxi hóa: Cu tạo thành $Cu^{2+} + 2e$. Quá trình khử: $SO_4^{2-} + 4H^+ + 2e$ tạo thành $SO_2 + 2H_2O$. Phương trình: $Cu + 2H_2SO_4$ tạo thành $CuSO_4 + SO_2 + 2H_2O$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $2Na + Cl_2$ tạo thành $2NaCl$ là phản ứng oxi hóa - khử.", "b) $CaO + H_2O$ tạo thành $Ca(OH)_2$ là phản ứng oxi hóa - khử.", "c) $C + O_2$ tạo thành $CO_2$ là phản ứng oxi hóa - khử.", "d) $NaCl + AgNO_3$ tạo thành $AgCl + NaNO_3$ là phản ứng oxi hóa - khử."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: số oxi hóa không đổi. c) Đúng. d) Sai: số oxi hóa không đổi (phản ứng trao đổi).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Mg + 2HCl$ tạo thành $MgCl_2 + H_2$ đã cân bằng đúng.", "b) $2Al + 6HCl$ tạo thành $2AlCl_3 + 3H_2$ đã cân bằng đúng.", "c) $Zn + H_2SO_4$ tạo thành $ZnSO_4 + H_2$ đã cân bằng đúng.", "d) $Cu + 2H_2SO_4$ tạo thành $CuSO_4 + SO_2 + 2H_2O$ đã cân bằng đúng."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: kiểm tra S (2=2), O (8=8), H (4=4).", "points": 1}, {"type": "short", "level": "VD", "q": "Xác định số oxi hóa của $S$ trong ion $SO_4^{2-}$ (chỉ ghi số, ví dụ +6).", "answer": "+6", "explain": "O là -2: x + 4 nhân (-2) = -2, suy ra x = +6.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho 6,4 gam $Cu$ tác dụng hết với $H_2SO_4$ đặc, nóng, dư. Thể tích khí $SO_2$ thu được ở đktc là bao nhiêu lít?", "answer": "2,24", "explain": "Số mol Cu = 6,4/64 = 0,1 mol. $Cu + 2H_2SO_4$ tạo thành $CuSO_4 + SO_2 + 2H_2O$. Số mol $SO_2$ = 0,1 mol, thể tích = 2,24 lít.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Số oxi hóa của $O$ trong $H_2O$ là", "options": ["A. 0.", "B. -2.", "C. -1.", "D. +2."], "answer": "B", "explain": "Trong hợp chất thông thường, O có số oxi hóa -2.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kí hiệu $Fe^{3+} + e$ tạo thành $Fe^{2+}$ biểu thị", "options": ["A. sự oxi hóa.", "B. sự điện li.", "C. sự khử.", "D. sự trung hòa."], "answer": "C", "explain": "$Fe^{3+}$ nhận 1 electron (số oxi hóa giảm từ +3 xuống +2) nên là sự khử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số oxi hóa của $S$ trong $SO_2$ là", "options": ["A. +2.", "B. +6.", "C. +4.", "D. -2."], "answer": "C", "explain": "O là -2: x + 2 nhân (-2) = 0, suy ra x = +4.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng $2Na + Cl_2$ tạo thành $2NaCl$, sự khử là", "options": ["A. $Cl_2 + 2e$ tạo thành $2Cl^-$.", "B. $Na$ tạo thành $Na^+ + e$.", "C. $Na + e$ tạo thành $Na^-$.", "D. $Cl_2$ tạo thành $2Cl^+ + 2e$."], "answer": "A", "explain": "$Cl_2$ nhận 2 electron (số oxi hóa giảm từ 0 xuống -1) nên là sự khử.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong phản ứng $Cl_2 + 2NaOH$ tạo thành $NaCl + NaClO + H_2O$, số oxi hóa của $Cl$ trong $NaClO$ là", "options": ["A. -1.", "B. +1.", "C. +5.", "D. 0."], "answer": "B", "explain": "Na là +1, O là -2: (+1) + x + (-2) = 0, suy ra x = +1.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 11,2 gam $Fe$ tác dụng hết với dung dịch $CuSO_4$ dư. Khối lượng $Cu$ thu được là", "options": ["A. 6,4 gam.", "B. 12,8 gam.", "C. 3,2 gam.", "D. 9,6 gam."], "answer": "B", "explain": "Số mol Fe = 11,2/56 = 0,2 mol. $Fe + CuSO_4$ tạo thành $FeSO_4 + Cu$. Số mol Cu = 0,2 mol, khối lượng = 0,2 nhân 64 = 12,8 gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số oxi hóa của K trong $KCl$ là +1.", "b) Số oxi hóa của Mg trong $MgO$ là +2.", "c) Số oxi hóa của Al trong $Al_2O_3$ là +3.", "d) Số oxi hóa của Na trong Na là +1."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: K nhóm IA. b) Đúng: Mg nhóm IIA. c) Đúng. d) Sai: Na đơn chất có số oxi hóa 0.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Zn$ tạo thành $Zn^{2+} + 2e$ là sự oxi hóa.", "b) $Cu^{2+} + 2e$ tạo thành $Cu$ là sự khử.", "c) $Fe$ tạo thành $Fe^{3+} + 3e$ là sự khử.", "d) $2H^+ + 2e$ tạo thành $H_2$ là sự oxi hóa."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng. b) Đúng. c) Sai: đây là sự oxi hóa. d) Sai: đây là sự khử.", "points": 1}, {"type": "short", "level": "VD", "q": "Xác định số oxi hóa của $N$ trong $HNO_3$ (chỉ ghi số, ví dụ +5).", "answer": "+5", "explain": "H là +1, O là -2: (+1) + x + 3 nhân (-2) = 0, suy ra x = +5.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho 3,25 gam $Zn$ tác dụng hết với dung dịch $HCl$ dư. Khối lượng $ZnCl_2$ thu được là bao nhiêu gam?", "answer": "6,8", "explain": "Số mol Zn = 3,25/65 = 0,05 mol. $Zn + 2HCl$ tạo thành $ZnCl_2 + H_2$. Số mol $ZnCl_2$ = 0,05 mol, khối lượng = 0,05 nhân 136 = 6,8 gam.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng?", "options": ["A. Trong phản ứng oxi hóa - khử, chất khử là chất nhận electron.", "B. Sự oxi hóa là quá trình nhận electron.", "C. Trong phản ứng oxi hóa - khử, số oxi hóa của chất khử tăng.", "D. Chất oxi hóa nhường electron cho chất khử."], "answer": "C", "explain": "Chất khử nhường electron nên số oxi hóa của nó tăng. Các phát biểu A, B, D đều ngược lại với định nghĩa đúng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chất oxi hóa là chất", "options": ["A. nhường electron.", "B. nhận proton.", "C. nhường proton.", "D. nhận electron."], "answer": "D", "explain": "Chất oxi hóa là chất nhận electron (số oxi hóa giảm).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng $2H_2S + 3O_2$ tạo thành $2SO_2 + 2H_2O$, chất khử là", "options": ["A. $H_2S$.", "B. $O_2$.", "C. $SO_2$.", "D. $H_2O$."], "answer": "A", "explain": "S trong $H_2S$ nhường electron (số oxi hóa tăng từ -2 lên +4) nên $H_2S$ là chất khử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng $CH_4 + 2O_2$ tạo thành $CO_2 + 2H_2O$, chất oxi hóa là", "options": ["A. $CH_4$.", "B. $O_2$.", "C. $CO_2$.", "D. $H_2O$."], "answer": "B", "explain": "$O_2$ nhận electron (số oxi hóa của O giảm từ 0 xuống -2) nên $O_2$ là chất oxi hóa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Số oxi hóa của $Cr$ trong ion $Cr_2O_7^{2-}$ là", "options": ["A. +3.", "B. +7.", "C. +5.", "D. +6."], "answer": "D", "explain": "O là -2: 2x + 7 nhân (-2) = -2, suy ra x = +6.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong phản ứng $3Fe + 2O_2$ tạo thành $Fe_3O_4$, tổng số electron mà 3 nguyên tử $Fe$ nhường là", "options": ["A. 4.", "B. 6.", "C. 8.", "D. 12."], "answer": "C", "explain": "Trong $Fe_3O_4$: 3x + 4 nhân (-2) = 0, suy ra số oxi hóa trung bình của Fe là +8/3. Mỗi nguyên tử Fe nhường 8/3 electron; 3 nguyên tử Fe nhường tổng cộng 8 electron.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số oxi hóa của C trong $CO_2$ là +4.", "b) Số oxi hóa của C trong $CH_4$ là -4.", "c) Số oxi hóa của C trong $CO$ là +2.", "d) Số oxi hóa của C trong kim cương là +4."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: kim cương là đơn chất nên số oxi hóa bằng 0.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $2H_2 + O_2$ tạo thành $2H_2O$ là phản ứng oxi hóa - khử.", "b) $H_2$ là chất khử trong phản ứng trên.", "c) $O_2$ là chất oxi hóa trong phản ứng trên.", "d) Số oxi hóa của O tăng từ 0 lên -2."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: số oxi hóa của O giảm từ 0 xuống -2.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong phản ứng $2H_2 + O_2$ tạo thành $2H_2O$, số oxi hóa của $H$ thay đổi từ bao nhiêu đến bao nhiêu? (ghi dạng 0 thành +1)", "answer": "0 thành +1", "explain": "Trong $H_2$ đơn chất, H có số oxi hóa 0; trong $H_2O$, H có số oxi hóa +1.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Xác định số oxi hóa của $Si$ trong $H_2SiO_3$ (chỉ ghi số, ví dụ +4).", "answer": "+4", "explain": "H là +1, O là -2: 2 nhân (+1) + x + 3 nhân (-2) = 0, suy ra x = +4.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Bước đầu tiên khi cân bằng phản ứng oxi hóa - khử là", "options": ["A. viết quá trình oxi hóa, quá trình khử.", "B. xác định số oxi hóa, tìm chất oxi hóa và chất khử.", "C. tìm hệ số thích hợp.", "D. kiểm tra số nguyên tử."], "answer": "B", "explain": "Bước 1: xác định số oxi hóa của các nguyên tố, tìm chất oxi hóa và chất khử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Số oxi hóa của $Cu$ trong $CuO$ là", "options": ["A. +1.", "B. +2.", "C. 0.", "D. -2."], "answer": "B", "explain": "O là -2: x + (-2) = 0, suy ra x = +2.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cân bằng phản ứng: $Al + H_2SO_4$ (loãng) tạo thành $Al_2(SO_4)_3 + H_2$. Hệ số cân bằng (tối giản) lần lượt là", "options": ["A. 1, 3, 1, 3.", "B. 2, 3, 1, 3.", "C. 2, 6, 1, 6.", "D. 2, 3, 1, 2."], "answer": "B", "explain": "Quá trình nhường: $Al$ tạo thành $Al^{3+} + 3e$ (nhân 2); quá trình nhận: $2H^+ + 2e$ tạo thành $H_2$ (nhân 3). Phương trình: $2Al + 3H_2SO_4$ tạo thành $Al_2(SO_4)_3 + 3H_2$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng $Fe_2O_3 + 3CO$ tạo thành $2Fe + 3CO_2$, sự oxi hóa là", "options": ["A. $Fe^{3+} + 3e$ tạo thành $Fe$.", "B. $CO$ tạo thành $CO_2 + 2e$ (C từ +2 lên +4).", "C. $Fe$ tạo thành $Fe^{3+} + 3e$.", "D. $CO_2 + 2e$ tạo thành $CO$."], "answer": "B", "explain": "C trong CO nhường 2 electron (số oxi hóa tăng từ +2 lên +4) nên đây là sự oxi hóa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cân bằng phản ứng: $Na + H_2O$ tạo thành $NaOH + H_2$. Hệ số cân bằng (tối giản) lần lượt là", "options": ["A. 1, 1, 1, 1.", "B. 2, 2, 2, 1.", "C. 1, 2, 1, 1.", "D. 2, 1, 2, 1."], "answer": "B", "explain": "Na tạo thành $Na^+ + 1e$ (nhân 2); $2H^+ + 2e$ tạo thành $H_2$. Phương trình: $2Na + 2H_2O$ tạo thành $2NaOH + H_2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 5,4 gam $Al$ tác dụng hết với dung dịch $NaOH$ dư. Thể tích khí $H_2$ thu được ở đktc là", "options": ["A. 3,36 lít.", "B. 6,72 lít.", "C. 4,48 lít.", "D. 2,24 lít."], "answer": "B", "explain": "Số mol Al = 5,4/27 = 0,2 mol. Phương trình: $2Al + 2NaOH + 2H_2O$ tạo thành $2NaAlO_2 + 3H_2$. Số mol $H_2$ = 0,2 nhân 3/2 = 0,3 mol, thể tích = 0,3 nhân 22,4 = 6,72 lít.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số oxi hóa của S trong $H_2S$ là -2.", "b) Số oxi hóa của S trong $SO_2$ là +4.", "c) Số oxi hóa của S trong $SO_3$ là +6.", "d) Số oxi hóa của S trong $H_2SO_4$ là +4."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: S trong $H_2SO_4$ có số oxi hóa +6.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Cu + 2H_2SO_4$ tạo thành $CuSO_4 + SO_2 + 2H_2O$ đã cân bằng đúng.", "b) $2Na + 2H_2O$ tạo thành $2NaOH + H_2$ đã cân bằng đúng.", "c) $Ca + 2H_2O$ tạo thành $Ca(OH)_2 + H_2$ đã cân bằng đúng.", "d) $Zn + H_2SO_4$ tạo thành $ZnSO_4 + 2H_2$ đã cân bằng đúng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: vế phải thừa H (đúng là $Zn + H_2SO_4$ tạo thành $ZnSO_4 + H_2$).", "points": 1}, {"type": "short", "level": "VD", "q": "Viết quá trình khử của $Cu^{2+}$ thành $Cu$ (dạng text, ví dụ: 2H+ + 2e thành H2).", "answer": "Cu2+ + 2e thành Cu", "explain": "$Cu^{2+} + 2e$ tạo thành $Cu$ (dạng text: Cu2+ + 2e thành Cu).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong phản ứng $C + 2H_2SO_4$ (đặc) tạo thành $CO_2 + 2SO_2 + 2H_2O$, chất oxi hóa là chất nào? (ghi công thức)", "answer": "H2SO4", "explain": "S trong $H_2SO_4$ nhận electron (số oxi hóa giảm từ +6 xuống +4) nên $H_2SO_4$ là chất oxi hóa.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Số oxi hóa của $H$ trong $HCl$ là", "options": ["A. 0.", "B. +1.", "C. -1.", "D. +2."], "answer": "B", "explain": "Trong hợp chất (trừ hydride kim loại), H có số oxi hóa +1.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong phản ứng oxi hóa - khử, chất khử và chất oxi hóa", "options": ["A. đều nhường electron.", "B. chất khử nhận electron, chất oxi hóa nhường electron.", "C. đều nhận electron.", "D. chất khử nhường electron, chất oxi hóa nhận electron."], "answer": "D", "explain": "Chất khử nhường electron (số oxi hóa tăng), chất oxi hóa nhận electron (số oxi hóa giảm).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng $Zn + CuSO_4$ tạo thành $ZnSO_4 + Cu$, chất khử là", "options": ["A. $Zn$.", "B. $CuSO_4$.", "C. $Cu$.", "D. $SO_4^{2-}$."], "answer": "A", "explain": "Zn nhường 2 electron (số oxi hóa tăng từ 0 lên +2) nên Zn là chất khử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng $Zn + CuSO_4$ tạo thành $ZnSO_4 + Cu$, chất oxi hóa là", "options": ["A. $Zn$.", "B. $Cu^{2+}$ (trong $CuSO_4$).", "C. $Cu$.", "D. $SO_4^{2-}$."], "answer": "B", "explain": "$Cu^{2+}$ nhận 2 electron (số oxi hóa giảm từ +2 xuống 0) nên là chất oxi hóa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong phản ứng $Cl_2 + 2NaOH$ tạo thành $NaCl + NaClO + H_2O$, $Cl_2$ đóng vai trò", "options": ["A. chỉ là chất oxi hóa.", "B. chỉ là chất khử.", "C. vừa là chất oxi hóa vừa là chất khử.", "D. không phải chất oxi hóa cũng không phải chất khử."], "answer": "C", "explain": "$Cl_2$ (số oxi hóa 0) vừa tạo thành NaCl (Cl có số oxi hóa -1, sự khử) vừa tạo thành NaClO (Cl có số oxi hóa +1, sự oxi hóa).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 2,7 gam $Al$ tác dụng hết với dung dịch $HCl$ dư. Khối lượng $AlCl_3$ thu được là", "options": ["A. 6,675 gam.", "B. 26,7 gam.", "C. 13,35 gam.", "D. 3,3375 gam."], "answer": "C", "explain": "Số mol Al = 2,7/27 = 0,1 mol. Phương trình: $2Al + 6HCl$ tạo thành $2AlCl_3 + 3H_2$. Số mol $AlCl_3$ = 0,1 mol, khối lượng = 0,1 nhân 133,5 = 13,35 gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về số oxi hóa của oxi:", "statements": ["a) Số oxi hóa của O trong $H_2O$ là -2.", "b) Số oxi hóa của O trong $OF_2$ là +2.", "c) Số oxi hóa của O trong $O_2$ là 0.", "d) Số oxi hóa của O trong $K_2O_2$ là -2."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: F âm điện hơn O nên O có số oxi hóa +2. c) Đúng: đơn chất. d) Sai: $K_2O_2$ là peroxide, O có số oxi hóa -1.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về phản ứng $2H_2O_2$ tạo thành $2H_2O + O_2$:", "statements": ["a) Đây là phản ứng oxi hóa - khử.", "b) Đây là phản ứng tự oxi hóa - khử.", "c) $H_2O_2$ vừa là chất oxi hóa, vừa là chất khử.", "d) Số oxi hóa của O trong $H_2O_2$ là -2."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: O thay đổi số oxi hóa từ -1 thành -2 (trong $H_2O$) và 0 (trong $O_2$). b) Đúng: chỉ có nguyên tố O thay đổi số oxi hóa, $H_2O_2$ vừa tự oxi hóa vừa tự khử. c) Đúng. d) Sai: O trong $H_2O_2$ có số oxi hóa -1.", "points": 1}, {"type": "short", "level": "VD", "q": "Xác định số oxi hóa của $N$ trong $HNO_2$ (chỉ ghi số, ví dụ +3).", "answer": "+3", "explain": "Số oxi hóa của $H$ là $+1$, của $O$ là $-2$. Gọi số oxi hóa của $N$ là $x$: $x + 1 + 2 \\\\times (-2) = 0$, suy ra $x = +3$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Xác định số oxi hóa của $C$ trong $Na_2CO_3$ (chỉ ghi số, ví dụ +4).", "answer": "+4", "explain": "Na là +1, O là -2: 2 nhân (+1) + x + 3 nhân (-2) = 0, suy ra x = +4.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Phản ứng tự oxi hóa - khử là phản ứng trong đó", "options": ["A. không có sự thay đổi số oxi hóa.", "B. một nguyên tố vừa là chất oxi hóa vừa là chất khử.", "C. chỉ có sự oxi hóa.", "D. chỉ có sự khử."], "answer": "B", "explain": "Phản ứng tự oxi hóa - khử: một nguyên tố (trong cùng một chất) vừa tăng vừa giảm số oxi hóa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ví dụ về phản ứng tự oxi hóa - khử là", "options": ["A. $Zn + 2HCl$ tạo thành $ZnCl_2 + H_2$.", "B. $Cl_2 + 2NaOH$ tạo thành $NaCl + NaClO + H_2O$.", "C. $NaOH + HCl$ tạo thành $NaCl + H_2O$.", "D. $CaO + H_2O$ tạo thành $Ca(OH)_2$."], "answer": "B", "explain": "$Cl_2$ vừa tạo thành NaCl (Cl có số oxi hóa -1) vừa tạo thành NaClO (Cl có số oxi hóa +1): phản ứng tự oxi hóa - khử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng $2KClO_3$ tạo thành $2KCl + 3O_2$, nguyên tố đóng vai trò chất khử là", "options": ["A. $K$.", "B. $Cl$.", "C. $O$.", "D. không có."], "answer": "C", "explain": "O nhường electron (số oxi hóa tăng từ -2 lên 0) nên nguyên tố O đóng vai trò chất khử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng $2KClO_3$ tạo thành $2KCl + 3O_2$, nguyên tố đóng vai trò chất oxi hóa là", "options": ["A. $K$.", "B. $Cl$.", "C. $O$.", "D. không có."], "answer": "B", "explain": "Cl nhận electron (số oxi hóa giảm từ +5 xuống -1) nên nguyên tố Cl đóng vai trò chất oxi hóa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Số oxi hóa của $S$ trong $H_2S, SO_2, SO_3$ lần lượt là", "options": ["A. -2, +4, +6.", "B. +2, +4, +6.", "C. -2, -4, -6.", "D. +6, +4, -2."], "answer": "A", "explain": "$H_2S$: 2 nhân (+1) + x = 0, x = -2. $SO_2$: x + 2 nhân (-2) = 0, x = +4. $SO_3$: x + 3 nhân (-2) = 0, x = +6.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 6,5 gam $Zn$ tác dụng hết với dung dịch $HCl$ dư. Thể tích khí $H_2$ thu được ở đktc là", "options": ["A. 1,12 lít.", "B. 2,24 lít.", "C. 4,48 lít.", "D. 3,36 lít."], "answer": "B", "explain": "Số mol Zn = 6,5/65 = 0,1 mol. $Zn + 2HCl$ tạo thành $ZnCl_2 + H_2$. Số mol $H_2$ = 0,1 mol, thể tích = 2,24 lít.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Cl_2 + 2NaOH$ tạo thành $NaCl + NaClO + H_2O$ là phản ứng tự oxi hóa - khử.", "b) $2KClO_3$ tạo thành $2KCl + 3O_2$ là phản ứng tự oxi hóa - khử.", "c) $Zn + 2HCl$ tạo thành $ZnCl_2 + H_2$ là phản ứng tự oxi hóa - khử.", "d) $2Na + Cl_2$ tạo thành $2NaCl$ là phản ứng tự oxi hóa - khử."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: Cl vừa tăng vừa giảm số oxi hóa. b) Đúng: Cl giảm, O tăng. c) Sai: Zn là chất khử, H là chất oxi hóa (hai nguyên tố khác nhau). d) Sai: Na là chất khử, Cl là chất oxi hóa.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số oxi hóa của S trong $H_2S$ là -2.", "b) Số oxi hóa của S trong $SO_2$ là +4.", "c) Số oxi hóa của S trong $SO_3$ là +6.", "d) S trong $H_2S$ có thể đóng vai trò chất khử."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: S (-2) có thể tăng số oxi hóa (nhường electron) nên có thể là chất khử.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong phản ứng $2KClO_3$ tạo thành $2KCl + 3O_2$, số oxi hóa của $Cl$ thay đổi từ bao nhiêu đến bao nhiêu? (ghi dạng +5 thành -1)", "answer": "+5 thành -1", "explain": "Trong $KClO_3$, Cl có số oxi hóa +5; trong KCl, Cl có số oxi hóa -1.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong phản ứng $2KClO_3$ tạo thành $2KCl + 3O_2$, số oxi hóa của $O$ thay đổi từ bao nhiêu đến bao nhiêu? (ghi dạng -2 thành 0)", "answer": "-2 thành 0", "explain": "Trong $KClO_3$, O có số oxi hóa -2; trong $O_2$ đơn chất, O có số oxi hóa 0.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Ứng dụng nào sau đây của phản ứng oxi hóa - khử?", "options": ["A. Luyện kim.", "B. Pin, acquy.", "C. Đốt cháy nhiên liệu.", "D. Cả ba ứng dụng trên."], "answer": "D", "explain": "Phản ứng oxi hóa - khử được ứng dụng trong luyện kim, pin/acquy, đốt cháy nhiên liệu, quang hợp, hô hấp...", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phản ứng $Fe_2O_3 + 3CO$ tạo thành $2Fe + 3CO_2$ được ứng dụng trong", "options": ["A. sản xuất pin.", "B. luyện kim (điều chế Fe từ quặng).", "C. quang hợp.", "D. hô hấp."], "answer": "B", "explain": "Đây là phản ứng điều chế sắt từ quặng hematite trong luyện kim.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng $CuO + H_2$ tạo thành $Cu + H_2O$, chất khử là", "options": ["A. $CuO$.", "B. $Cu$.", "C. $H_2$.", "D. $H_2O$."], "answer": "C", "explain": "H trong $H_2$ nhường electron (số oxi hóa tăng từ 0 lên +1) nên $H_2$ là chất khử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng $CuO + H_2$ tạo thành $Cu + H_2O$, chất oxi hóa là", "options": ["A. $H_2$.", "B. $Cu$.", "C. $H_2O$.", "D. $CuO$."], "answer": "D", "explain": "$Cu^{2+}$ trong $CuO$ nhận electron (số oxi hóa giảm từ +2 xuống 0) nên $CuO$ là chất oxi hóa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cân bằng phản ứng: $Fe + H_2SO_4$ (loãng) tạo thành $FeSO_4 + H_2$. Tổng hệ số cân bằng (tối giản) là", "options": ["A. 2.", "B. 3.", "C. 4.", "D. 5."], "answer": "C", "explain": "Phương trình: $Fe + H_2SO_4$ tạo thành $FeSO_4 + H_2$. Tổng hệ số = 1 + 1 + 1 + 1 = 4.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 8,4 gam $Fe$ tác dụng hết với dung dịch $H_2SO_4$ loãng, dư. Thể tích khí $H_2$ thu được ở đktc là", "options": ["A. 2,24 lít.", "B. 3,36 lít.", "C. 4,48 lít.", "D. 1,12 lít."], "answer": "B", "explain": "Số mol Fe = 8,4/56 = 0,15 mol. $Fe + H_2SO_4$ tạo thành $FeSO_4 + H_2$. Số mol $H_2$ = 0,15 mol, thể tích = 0,15 nhân 22,4 = 3,36 lít.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Luyện kim sử dụng phản ứng oxi hóa - khử.", "b) Pin, acquy sử dụng phản ứng oxi hóa - khử.", "c) Đốt cháy nhiên liệu là phản ứng oxi hóa - khử.", "d) Phản ứng trung hòa là phản ứng oxi hóa - khử."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: chất cháy là chất khử, $O_2$ là chất oxi hóa. d) Sai: số oxi hóa không đổi.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Fe + H_2SO_4$ tạo thành $FeSO_4 + H_2$ đã cân bằng đúng.", "b) $Fe_2O_3 + 3CO$ tạo thành $2Fe + 3CO_2$ đã cân bằng đúng.", "c) $CH_4 + 2O_2$ tạo thành $CO_2 + 2H_2O$ đã cân bằng đúng.", "d) $2H_2 + O_2$ tạo thành $2H_2O$ đã cân bằng đúng."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết quá trình oxi hóa của $Zn$ thành $Zn^{2+}$ (dạng text, ví dụ: Mg thành Mg2+ + 2e).", "answer": "Zn thành Zn2+ + 2e", "explain": "Zn nhường 2 electron: Zn thành $Zn^{2+} + 2e$ (dạng text: Zn thành Zn2+ + 2e).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong phản ứng $Fe_2O_3 + 3CO$ tạo thành $2Fe + 3CO_2$, số oxi hóa của $Fe$ thay đổi từ bao nhiêu đến bao nhiêu? (ghi dạng +3 thành 0)", "answer": "+3 thành 0", "explain": "Trong $Fe_2O_3$, Fe có số oxi hóa +3; sau phản ứng Fe đơn chất có số oxi hóa 0.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Ôn tập: Số oxi hóa của $Al$ trong hợp chất là", "options": ["A. 0.", "B. +1.", "C. +3.", "D. -3."], "answer": "C", "explain": "Al trong hợp chất có số oxi hóa +3.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ôn tập: Chất oxi hóa là chất", "options": ["A. nhường electron.", "B. nhận electron.", "C. nhường proton.", "D. nhận proton."], "answer": "B", "explain": "Chất oxi hóa là chất nhận electron (số oxi hóa giảm).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số oxi hóa của $P$ trong $H_3PO_4$ là", "options": ["A. +3.", "B. +5.", "C. -3.", "D. 0."], "answer": "B", "explain": "H là +1, O là -2: 3 nhân (+1) + x + 4 nhân (-2) = 0, suy ra x = +5.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng $Mg + 2HCl$ tạo thành $MgCl_2 + H_2$, chất khử là", "options": ["A. $Mg$.", "B. $HCl$.", "C. $H^+$.", "D. $Cl^-$."], "answer": "A", "explain": "Mg nhường 2 electron (số oxi hóa tăng từ 0 lên +2) nên Mg là chất khử.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong các phản ứng sau, phản ứng nào là phản ứng oxi hóa - khử?", "options": ["A. $CaO + H_2O$ tạo thành $Ca(OH)_2$.", "B. $2H_2 + O_2$ tạo thành $2H_2O$.", "C. $NaOH + HCl$ tạo thành $NaCl + H_2O$.", "D. $CaCO_3 + 2HCl$ tạo thành $CaCl_2 + CO_2 + H_2O$."], "answer": "B", "explain": "Trong phản ứng $2H_2 + O_2$ tạo thành $2H_2O$, số oxi hóa của H tăng (0 lên +1), của O giảm (0 xuống -2).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 5,4 gam $Al$ tác dụng hết với dung dịch $HCl$ dư. Thể tích khí $H_2$ thu được ở đktc là", "options": ["A. 2,24 lít.", "B. 4,48 lít.", "C. 6,72 lít.", "D. 3,36 lít."], "answer": "C", "explain": "Số mol Al = 5,4/27 = 0,2 mol. $2Al + 6HCl$ tạo thành $2AlCl_3 + 3H_2$. Số mol $H_2$ = 0,3 mol, thể tích = 0,3 nhân 22,4 = 6,72 lít.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số oxi hóa của Al trong $Al_2O_3$ là +3.", "b) Số oxi hóa của P trong $H_3PO_4$ là +5.", "c) Số oxi hóa của Ca trong $CaO$ là +2.", "d) Số oxi hóa của Ba trong Ba là +2."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: Ca nhóm IIA. d) Sai: Ba đơn chất có số oxi hóa 0.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $2Al + 6HCl$ tạo thành $2AlCl_3 + 3H_2$ đã cân bằng đúng.", "b) $Mg + 2HCl$ tạo thành $MgCl_2 + H_2$ đã cân bằng đúng.", "c) $2Na + 2H_2O$ tạo thành $2NaOH + H_2$ đã cân bằng đúng.", "d) $Fe + 2HCl$ tạo thành $FeCl_3 + H_2$ đã cân bằng đúng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: Fe tác dụng với HCl loãng tạo thành $FeCl_2$ (đúng là $Fe + 2HCl$ tạo thành $FeCl_2 + H_2$).", "points": 1}, {"type": "short", "level": "VD", "q": "Trong phản ứng $Mg + 2HCl$ tạo thành $MgCl_2 + H_2$, số oxi hóa của $Mg$ thay đổi từ bao nhiêu đến bao nhiêu? (ghi dạng 0 thành +2)", "answer": "0 thành +2", "explain": "Mg đơn chất có số oxi hóa 0; trong $MgCl_2$, Mg có số oxi hóa +2.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Xác định số oxi hóa của $Cl$ trong $KClO_3$ (chỉ ghi số, ví dụ +5).", "answer": "+5", "explain": "K là +1, O là -2: (+1) + x + 3 nhân (-2) = 0, suy ra x = +5.", "points": 0.5}]}]}</script>
