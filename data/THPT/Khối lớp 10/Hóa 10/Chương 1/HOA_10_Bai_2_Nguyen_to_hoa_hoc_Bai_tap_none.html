<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Nguyên tố hoá học là tập hợp các nguyên tử có cùng","options":["A. số neutron trong hạt nhân","B. số proton trong hạt nhân","C. số khối","D. số electron ở vỏ"],"answer":"B","explain":"Theo định nghĩa, nguyên tố hoá học là tập hợp các nguyên tử có cùng số proton (cùng Z)."},{"type":"mcq","level":"NB","points":0.25,"q":"Số hiệu nguyên tử Z của một nguyên tố bằng","options":["A. số neutron trong hạt nhân","B. tổng số proton và neutron","C. số proton trong hạt nhân","D. số electron ở lớp ngoài cùng"],"answer":"C","explain":"Số hiệu nguyên tử Z chính là số proton trong hạt nhân nguyên tử của nguyên tố đó."},{"type":"mcq","level":"NB","points":0.25,"q":"Số khối A của hạt nhân được tính bằng công thức","options":["A. $A = Z + N$","B. $A = Z - N$","C. $A = Z \\times N$","D. $A = N - Z$"],"answer":"A","explain":"Số khối A là tổng số proton (Z) và số neutron (N): $A = Z + N$."},{"type":"mcq","level":"TH","points":0.25,"q":"Kí hiệu $^{23}_{11}Na$ cho biết số neutron trong hạt nhân nguyên tử natri là","options":["A. 11","B. 23","C. 12","D. 34"],"answer":"C","explain":"Từ kí hiệu $^{23}_{11}Na$: $Z = 11$, $A = 23$ nên $N = A - Z = 23 - 11 = 12$."},{"type":"mcq","level":"TH","points":0.25,"q":"Cặp nguyên tử nào sau đây là đồng vị của nhau?","options":["A. $^{23}_{11}Na$ và $^{24}_{12}Mg$","B. $^{35}_{17}Cl$ và $^{37}_{17}Cl$","C. $^{12}_{6}C$ và $^{14}_{7}N$","D. $^{16}_{8}O$ và $^{19}_{9}F$"],"answer":"B","explain":"Đồng vị là các nguyên tử cùng Z, khác A. Chỉ có $^{35}_{17}Cl$ và $^{37}_{17}Cl$ cùng $Z = 17$ nhưng khác số khối (35 và 37)."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử X có tổng số proton và neutron là 23, số proton là 11. Kí hiệu nguyên tử đầy đủ của X là","options":["A. $^{23}_{11}Na$","B. $^{11}_{23}Na$","C. $^{23}_{12}Na$","D. $^{12}_{11}Na$"],"answer":"A","explain":"Số khối $A = 23$, $Z = 11$ (nguyên tố Na). Kí hiệu đầy đủ là $^{23}_{11}Na$ (A ở trên, Z ở dưới)."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về kí hiệu $^{35}_{17}Cl$:","statements":["a) Số hiệu nguyên tử Z = 17.","b) Số khối A = 35.","c) Số neutron N = 18.","d) Số electron trong nguyên tử trung hoà là 35."],"answer":["T","T","T","F"],"explain":"a) Đúng: Z = 17. b) Đúng: A = 35. c) Đúng: $N = A - Z = 35 - 17 = 18$. d) Sai: nguyên tử trung hoà có số electron bằng số proton, tức bằng $Z = 17$."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về các nguyên tử: $^{23}_{11}Na$, $^{24}_{12}Mg$, $^{22}_{11}Na$, $^{24}_{11}Na$.","statements":["a) $^{23}_{11}Na$ và $^{22}_{11}Na$ là đồng vị của nhau.","b) Có 3 nguyên tố hoá học khác nhau trong số các nguyên tử trên.","c) Nguyên tử $^{24}_{11}Na$ có 13 neutron.","d) $^{24}_{12}Mg$ và $^{24}_{11}Na$ là đồng vị của nhau."],"answer":["T","F","T","F"],"explain":"a) Đúng: cùng $Z = 11$, khác A. b) Sai: chỉ có 2 nguyên tố (Na với $Z = 11$ và Mg với $Z = 12$). c) Đúng: $N = 24 - 11 = 13$. d) Sai: khác Z (12 và 11) nên không phải đồng vị."},{"type":"short","level":"VDC","points":0.5,"q":"Chlorine trong tự nhiên gồm 2 đồng vị $^{35}Cl$ và $^{37}Cl$, nguyên tử khối trung bình là 35,45. Tính % số nguyên tử của đồng vị $^{35}Cl$ (ghi số thập phân, ví dụ 75.5).","answer":"77.5","explain":"Gọi x là % số nguyên tử của $^{35}Cl$. Ta có $\\frac{35x + 37(100 - x)}{100} = 35{,}45$ nên $-2x = -155$, suy ra $x = 77{,}5$. Đáp án 77.5 (chấp nhận 77,5)."},{"type":"short","level":"VDC","points":0.5,"q":"Silver trong tự nhiên gồm 2 đồng vị $^{107}Ag$ và $^{109}Ag$, nguyên tử khối trung bình là 108. Tính % số nguyên tử của đồng vị $^{107}Ag$ (ghi số, ví dụ 50).","answer":"50","explain":"Gọi x là % số nguyên tử của $^{107}Ag$. Ta có $\\frac{107x + 109(100 - x)}{100} = 108$ nên $-2x = -100$, suy ra $x = 50$. Đáp án 50."}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Số proton trong hạt nhân quyết định","options":["A. số khối của nguyên tử","B. nguyên tố hoá học mà nguyên tử thuộc về","C. số neutron trong hạt nhân","D. khối lượng tuyệt đối của nguyên tử"],"answer":"B","explain":"Số proton (Z) là đặc trưng của nguyên tố hoá học: các nguyên tử có cùng số proton thuộc cùng một nguyên tố."},{"type":"mcq","level":"NB","points":0.25,"q":"Trong nguyên tử trung hoà về điện, số electron bằng","options":["A. số neutron","B. số khối","C. số proton","D. tổng số proton và neutron"],"answer":"C","explain":"Nguyên tử trung hoà điện có số electron bằng số proton (bằng Z)."},{"type":"mcq","level":"NB","points":0.25,"q":"Trong kí hiệu nguyên tử $^{A}_{Z}X$, chữ Z cho biết","options":["A. số khối","B. số neutron","C. số hiệu nguyên tử","D. số electron ở lớp ngoài cùng"],"answer":"C","explain":"Trong kí hiệu $^{A}_{Z}X$, Z ở góc dưới bên trái là số hiệu nguyên tử (số proton)."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử oxygen có 8 proton và 8 neutron. Số khối của nguyên tử oxygen là","options":["A. 8","B. 16","C. 24","D. 10"],"answer":"B","explain":"Số khối $A = Z + N = 8 + 8 = 16$."},{"type":"mcq","level":"TH","points":0.25,"q":"Đồng vị là những nguyên tử","options":["A. có cùng số neutron, khác số proton","B. có cùng số proton, khác số neutron","C. có cùng số khối, khác số proton","D. có cùng số electron, khác số khối"],"answer":"B","explain":"Đồng vị là các nguyên tử cùng số proton (cùng Z) nhưng khác số neutron (khác N, khác A)."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tố X có Z = 19 và có 20 neutron. Kí hiệu nguyên tử đầy đủ của X là","options":["A. $^{39}_{19}K$","B. $^{19}_{39}K$","C. $^{39}_{20}K$","D. $^{20}_{19}K$"],"answer":"A","explain":"$Z = 19$ là nguyên tố K (potassium). Số khối $A = Z + N = 19 + 20 = 39$. Kí hiệu đầy đủ: $^{39}_{19}K$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau. Bromine trong tự nhiên gồm 2 đồng vị: $^{79}Br$ (55%) và $^{81}Br$ (45%).","statements":["a) Nguyên tử khối trung bình tính theo công thức $\\bar{A} = \\frac{79 \\times 55 + 81 \\times 45}{100}$.","b) Nguyên tử khối trung bình của bromine $\\approx 79{,}9$.","c) Vì % của $^{79}Br$ lớn hơn nên $\\bar{A}$ gần 79 hơn 81.","d) Nguyên tử khối trung bình của Br là một số nguyên."],"answer":["T","T","T","F"],"explain":"a) Đúng: đúng công thức tính NTK trung bình. b) Đúng: $\\frac{79 \\times 55 + 81 \\times 45}{100} = \\frac{4345 + 3645}{100} = 79{,}9$. c) Đúng: NTK trung bình gần với đồng vị có % cao hơn. d) Sai: 79,9 không phải số nguyên."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về các nguyên tử $^{12}_{6}C$, $^{14}_{6}C$, $^{14}_{7}N$.","statements":["a) $^{12}_{6}C$ và $^{14}_{6}C$ là đồng vị của nhau.","b) $^{14}_{6}C$ và $^{14}_{7}N$ là đồng vị của nhau.","c) Nguyên tử $^{14}_{6}C$ có 8 neutron.","d) Tất cả các nguyên tử trên thuộc cùng một nguyên tố hoá học."],"answer":["T","F","T","F"],"explain":"a) Đúng: cùng $Z = 6$, khác A. b) Sai: khác Z (6 và 7). c) Đúng: $N = 14 - 6 = 8$. d) Sai: có 2 nguyên tố (C với $Z = 6$ và N với $Z = 7$)."},{"type":"short","level":"VDC","points":0.5,"q":"Bromine trong tự nhiên gồm 2 đồng vị $^{79}Br$ và $^{81}Br$, nguyên tử khối trung bình là 79,9. Tính % số nguyên tử của đồng vị $^{79}Br$ (ghi số, ví dụ 55).","answer":"55","explain":"Gọi x là % số nguyên tử của $^{79}Br$. Ta có $\\frac{79x + 81(100 - x)}{100} = 79{,}9$ nên $-2x = -110$, suy ra $x = 55$. Đáp án 55."},{"type":"short","level":"VDC","points":0.5,"q":"Copper trong tự nhiên gồm 2 đồng vị $^{63}Cu$ và $^{65}Cu$, nguyên tử khối trung bình là 63,54. Tính % số nguyên tử của đồng vị $^{63}Cu$ (ghi số, ví dụ 73).","answer":"73","explain":"Gọi x là % số nguyên tử của $^{63}Cu$. Ta có $\\frac{63x + 65(100 - x)}{100} = 63{,}54$ nên $-2x = -146$, suy ra $x = 73$. Đáp án 73."}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Phát biểu nào sau đây đúng về nguyên tố hoá học?","options":["A. Là tập hợp các nguyên tử có cùng số neutron","B. Là tập hợp các nguyên tử có cùng số proton","C. Là tập hợp các nguyên tử có cùng số khối","D. Là tập hợp các nguyên tử có cùng số electron"],"answer":"B","explain":"Nguyên tố hoá học là tập hợp các nguyên tử có cùng số proton trong hạt nhân."},{"type":"mcq","level":"NB","points":0.25,"q":"Số hiệu nguyên tử của carbon là 6. Số proton trong hạt nhân nguyên tử carbon là","options":["A. 12","B. 6","C. 18","D. 0"],"answer":"B","explain":"Số hiệu nguyên tử Z bằng số proton, vậy nguyên tử carbon có 6 proton."},{"type":"mcq","level":"NB","points":0.25,"q":"Trong kí hiệu nguyên tử $^{A}_{Z}X$, chữ A cho biết","options":["A. số hiệu nguyên tử","B. số neutron","C. số khối","D. điện tích hạt nhân"],"answer":"C","explain":"Trong kí hiệu $^{A}_{Z}X$, A ở góc trên bên trái là số khối của hạt nhân."},{"type":"mcq","level":"TH","points":0.25,"q":"Kí hiệu $^{56}_{26}Fe$ cho biết số electron trong nguyên tử sắt trung hoà về điện là","options":["A. 56","B. 26","C. 30","D. 82"],"answer":"B","explain":"Nguyên tử trung hoà có số electron bằng số proton, tức bằng $Z = 26$."},{"type":"mcq","level":"TH","points":0.25,"q":"Cặp nào sau đây là đồng vị của hydrogen?","options":["A. $^{1}_{1}H$ và $^{2}_{1}H$","B. $^{1}_{1}H$ và $^{4}_{2}He$","C. $^{2}_{1}H$ và $^{3}_{2}He$","D. $^{3}_{1}H$ và $^{3}_{2}He$"],"answer":"A","explain":"Chỉ có $^{1}_{1}H$ và $^{2}_{1}H$ cùng $Z = 1$ (cùng là nguyên tố H) nhưng khác số khối."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử X có tổng số hạt cơ bản (proton, neutron, electron) là 34; số hạt mang điện nhiều hơn số hạt không mang điện là 10. Số khối A của X là","options":["A. 23","B. 22","C. 34","D. 11"],"answer":"A","explain":"Gọi p, n là số proton và neutron: $2p + n = 34$ và $2p - n = 10$. Giải ra $p = 11$, $n = 12$. Số khối $A = p + n = 23$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về nguyên tử $^{27}_{13}Al$.","statements":["a) Số hiệu nguyên tử Z = 13.","b) Số khối A = 27.","c) Số neutron N = 14.","d) Đây là đồng vị của nguyên tử $^{28}_{14}Si$."],"answer":["T","T","T","F"],"explain":"a) Đúng: Z = 13. b) Đúng: A = 27. c) Đúng: $N = 27 - 13 = 14$. d) Sai: khác Z (13 và 14) nên thuộc hai nguyên tố khác nhau, không phải đồng vị."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau. Magnesium trong tự nhiên có 3 đồng vị: $^{24}Mg$ (78,99%), $^{25}Mg$ (10%), $^{26}Mg$ (11,01%).","statements":["a) Ba đồng vị này đều có 12 proton trong hạt nhân.","b) Nguyên tử khối trung bình $\\bar{A} = \\frac{24 \\times 78{,}99 + 25 \\times 10 + 26 \\times 11{,}01}{100}$.","c) Nguyên tử khối trung bình của Mg $\\approx 24{,}32$.","d) Nguyên tử khối trung bình của Mg lớn hơn 25."],"answer":["T","T","T","F"],"explain":"a) Đúng: cùng là Mg nên cùng $Z = 12$. b) Đúng: đúng công thức. c) Đúng: $\\frac{1895{,}76 + 250 + 286{,}26}{100} = 24{,}3202 \\approx 24{,}32$. d) Sai: 24,32 nhỏ hơn 25."},{"type":"short","level":"VDC","points":0.5,"q":"Gallium trong tự nhiên gồm 2 đồng vị $^{69}Ga$ và $^{71}Ga$, nguyên tử khối trung bình là 69,72. Tính % số nguyên tử của đồng vị $^{69}Ga$ (ghi số, ví dụ 64).","answer":"64","explain":"Gọi x là % số nguyên tử của $^{69}Ga$. Ta có $\\frac{69x + 71(100 - x)}{100} = 69{,}72$ nên $-2x = -128$, suy ra $x = 64$. Đáp án 64."},{"type":"short","level":"VDC","points":0.5,"q":"Lithium trong tự nhiên gồm 2 đồng vị $^{6}Li$ và $^{7}Li$, nguyên tử khối trung bình là 6,94. Tính % số nguyên tử của đồng vị $^{6}Li$ (ghi số, ví dụ 6).","answer":"6","explain":"Gọi x là % số nguyên tử của $^{6}Li$. Ta có $\\frac{6x + 7(100 - x)}{100} = 6{,}94$ nên $-x = -6$, suy ra $x = 6$. Đáp án 6."}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Đại lượng đặc trưng cho một nguyên tố hoá học là","options":["A. số khối A","B. số neutron N","C. số hiệu nguyên tử Z","D. tổng số các hạt trong nguyên tử"],"answer":"C","explain":"Mỗi nguyên tố hoá học có một số hiệu nguyên tử Z duy nhất, không trùng với nguyên tố khác."},{"type":"mcq","level":"NB","points":0.25,"q":"Tổng số proton và neutron trong hạt nhân nguyên tử được gọi là","options":["A. số hiệu nguyên tử","B. số khối","C. điện tích hạt nhân","D. nguyên tử khối trung bình"],"answer":"B","explain":"Số khối A là tổng số proton và số neutron trong hạt nhân: $A = Z + N$."},{"type":"mcq","level":"NB","points":0.25,"q":"Kí hiệu hoá học Na ứng với nguyên tố có Z = 11. Số proton trong hạt nhân nguyên tử Na là","options":["A. 23","B. 11","C. 12","D. 34"],"answer":"B","explain":"Số proton bằng số hiệu nguyên tử Z, vậy nguyên tử Na có 11 proton."},{"type":"mcq","level":"TH","points":0.25,"q":"Từ kí hiệu $^{40}_{20}Ca$ suy ra số neutron trong hạt nhân nguyên tử calcium là","options":["A. 20","B. 40","C. 60","D. 10"],"answer":"A","explain":"$N = A - Z = 40 - 20 = 20$."},{"type":"mcq","level":"TH","points":0.25,"q":"Phát biểu nào sau đây SAI về đồng vị?","options":["A. Các đồng vị có cùng số proton","B. Các đồng vị khác nhau về số neutron","C. Các đồng vị có số khối bằng nhau","D. Các đồng vị thuộc cùng một nguyên tố hoá học"],"answer":"C","explain":"Các đồng vị cùng Z nhưng khác N nên khác số khối A. Phát biểu C sai."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử Y có 12 proton và 12 neutron. Kí hiệu nguyên tử đầy đủ của Y là","options":["A. $^{24}_{12}Mg$","B. $^{12}_{24}Mg$","C. $^{24}_{24}Mg$","D. $^{12}_{12}Mg$"],"answer":"A","explain":"$Z = 12$ là nguyên tố Mg. Số khối $A = 12 + 12 = 24$. Kí hiệu đầy đủ: $^{24}_{12}Mg$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về các nguyên tử $^{16}_{8}O$, $^{17}_{8}O$, $^{18}_{8}O$.","statements":["a) Đây là 3 đồng vị của nguyên tố oxygen.","b) Cả ba nguyên tử đều có 8 proton.","c) Số neutron của chúng lần lượt là 8, 9, 10.","d) Nguyên tử khối trung bình của oxygen bằng 17."],"answer":["T","T","T","F"],"explain":"a) Đúng: cùng $Z = 8$, khác A. b) Đúng. c) Đúng: $16-8=8$; $17-8=9$; $18-8=10$. d) Sai: NTK trung bình của O $\\approx 16$, không phải 17."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau. Nguyên tử khối trung bình của neon là 20,18; neon có các đồng vị $^{20}Ne$, $^{21}Ne$, $^{22}Ne$.","statements":["a) Đồng vị $^{20}Ne$ chiếm tỉ lệ % cao nhất trong tự nhiên.","b) Nguyên tử khối trung bình của neon là một số nguyên.","c) Các đồng vị của neon đều có 10 proton.","d) Nếu $^{22}Ne$ chiếm 8% và $^{21}Ne$ chiếm 2% thì % của $^{20}Ne$ là 90%."],"answer":["T","F","T","T"],"explain":"a) Đúng: $\\bar{A} = 20{,}18$ gần 20 nhất nên $^{20}Ne$ chiếm % cao nhất. b) Sai: 20,18 không phải số nguyên. c) Đúng: cùng là Ne nên cùng $Z = 10$. d) Đúng: $100 - 8 - 2 = 90$."},{"type":"short","level":"VDC","points":0.5,"q":"Boron trong tự nhiên gồm 2 đồng vị $^{10}B$ và $^{11}B$, nguyên tử khối trung bình là 10,81. Tính % số nguyên tử của đồng vị $^{10}B$ (ghi số, ví dụ 19).","answer":"19","explain":"Gọi x là % số nguyên tử của $^{10}B$. Ta có $\\frac{10x + 11(100 - x)}{100} = 10{,}81$ nên $-x = -19$, suy ra $x = 19$. Đáp án 19."},{"type":"short","level":"VDC","points":0.5,"q":"Antimony trong tự nhiên gồm 2 đồng vị $^{121}Sb$ và $^{123}Sb$, nguyên tử khối trung bình là 121,76. Tính % số nguyên tử của đồng vị $^{121}Sb$ (ghi số, ví dụ 62).","answer":"62","explain":"Gọi x là % số nguyên tử của $^{121}Sb$. Ta có $\\frac{121x + 123(100 - x)}{100} = 121{,}76$ nên $-2x = -124$, suy ra $x = 62$. Đáp án 62."}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Nguyên tố oxygen có Z = 8. Điều này có nghĩa là","options":["A. mỗi nguyên tử oxygen có 8 neutron","B. mỗi nguyên tử oxygen có 8 proton","C. mỗi nguyên tử oxygen có 8 electron ở lớp ngoài cùng","D. oxygen có 8 đồng vị trong tự nhiên"],"answer":"B","explain":"$Z = 8$ nghĩa là mỗi nguyên tử oxygen có 8 proton trong hạt nhân."},{"type":"mcq","level":"NB","points":0.25,"q":"Biết số khối A = 39 và số hiệu nguyên tử Z = 19, số neutron N bằng","options":["A. 58","B. 20","C. 19","D. 39"],"answer":"B","explain":"$N = A - Z = 39 - 19 = 20$."},{"type":"mcq","level":"NB","points":0.25,"q":"Trong kí hiệu nguyên tử $^{A}_{Z}X$, số khối A được viết ở vị trí","options":["A. góc trên bên phải của kí hiệu X","B. góc trên bên trái của kí hiệu X","C. góc dưới bên trái của kí hiệu X","D. góc dưới bên phải của kí hiệu X"],"answer":"B","explain":"Quy ước: số khối A viết ở góc trên bên trái, số hiệu Z viết ở góc dưới bên trái kí hiệu nguyên tố X."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử potassium ($^{39}_{19}K$) trung hoà về điện có số electron là","options":["A. 39","B. 19","C. 20","D. 58"],"answer":"B","explain":"Số electron bằng số proton bằng $Z = 19$."},{"type":"mcq","level":"TH","points":0.25,"q":"Nhóm nào sau đây gồm các đồng vị của nguyên tố carbon?","options":["A. $^{12}_{6}C$, $^{13}_{6}C$, $^{14}_{6}C$","B. $^{12}_{6}C$, $^{13}_{7}N$, $^{14}_{6}C$","C. $^{11}_{5}B$, $^{12}_{6}C$, $^{13}_{6}C$","D. $^{12}_{6}C$, $^{12}_{6}C$, $^{14}_{7}N$"],"answer":"A","explain":"Chỉ nhóm A gồm các nguyên tử cùng $Z = 6$ (cùng là carbon) nhưng khác số khối."},{"type":"mcq","level":"VD","points":0.25,"q":"Hạt nhân nguyên tử X có điện tích là +15 (tức có 15 proton) và có 16 neutron. Kí hiệu nguyên tử đầy đủ của X là","options":["A. $^{31}_{15}P$","B. $^{15}_{31}P$","C. $^{31}_{16}P$","D. $^{16}_{15}P$"],"answer":"A","explain":"$Z = 15$ là nguyên tố P (phosphorus). Số khối $A = 15 + 16 = 31$. Kí hiệu: $^{31}_{15}P$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về hai nguyên tử $^{39}_{19}K$ và $^{40}_{19}K$.","statements":["a) Đây là hai đồng vị của nguyên tố potassium.","b) Cả hai nguyên tử đều có 19 proton.","c) Số neutron của chúng lần lượt là 20 và 21.","d) Chúng thuộc hai nguyên tố hoá học khác nhau."],"answer":["T","T","T","F"],"explain":"a) Đúng: cùng $Z = 19$, khác A. b) Đúng. c) Đúng: $39-19=20$; $40-19=21$. d) Sai: cùng $Z = 19$ nên cùng là nguyên tố K."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau. Copper trong tự nhiên gồm $^{63}Cu$ (69,2%) và $^{65}Cu$ (30,8%).","statements":["a) Nguyên tử khối trung bình $\\bar{A}_{Cu} = \\frac{63 \\times 69{,}2 + 65 \\times 30{,}8}{100}$.","b) Nguyên tử khối trung bình của Cu $\\approx 63{,}62$.","c) $\\bar{A}_{Cu}$ gần 63 hơn 65 vì $^{63}Cu$ chiếm tỉ lệ cao hơn.","d) $^{63}Cu$ và $^{65}Cu$ khác nhau về tính chất hoá học cơ bản."],"answer":["T","T","T","F"],"explain":"a) Đúng: đúng công thức. b) Đúng: $\\frac{4360{,}36 + 2002}{100} = 63{,}6236 \\approx 63{,}62$. c) Đúng. d) Sai: các đồng vị có cùng tính chất hoá học."},{"type":"short","level":"VDC","points":0.5,"q":"Chlorine trong tự nhiên gồm 2 đồng vị $^{35}Cl$ và $^{37}Cl$, nguyên tử khối trung bình là 35,5. Tính % số nguyên tử của đồng vị $^{35}Cl$ (ghi số, ví dụ 75).","answer":"75","explain":"Gọi x là % số nguyên tử của $^{35}Cl$. Ta có $\\frac{35x + 37(100 - x)}{100} = 35{,}5$ nên $-2x = -150$, suy ra $x = 75$. Đáp án 75."},{"type":"short","level":"VDC","points":0.5,"q":"Copper trong tự nhiên gồm 2 đồng vị $^{63}Cu$ và $^{65}Cu$, nguyên tử khối trung bình là 63,7. Tính % số nguyên tử của đồng vị $^{63}Cu$ (ghi số, ví dụ 65).","answer":"65","explain":"Gọi x là % số nguyên tử của $^{63}Cu$. Ta có $\\frac{63x + 65(100 - x)}{100} = 63{,}7$ nên $-2x = -130$, suy ra $x = 65$. Đáp án 65."}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Phát biểu nào sau đây đúng về số hiệu nguyên tử?","options":["A. Mỗi nguyên tố có nhiều số hiệu nguyên tử khác nhau","B. Mỗi nguyên tố có một số hiệu nguyên tử duy nhất","C. Số hiệu nguyên tử thay đổi theo từng đồng vị","D. Số hiệu nguyên tử bằng số neutron"],"answer":"B","explain":"Mỗi nguyên tố hoá học có một số hiệu nguyên tử Z duy nhất; các đồng vị của cùng nguyên tố có cùng Z."},{"type":"mcq","level":"NB","points":0.25,"q":"Nguyên tử oxygen ($^{16}_{8}O$) có 8 proton và 8 neutron. Số khối A của nguyên tử này là","options":["A. 8","B. 16","C. 24","D. 32"],"answer":"B","explain":"Số khối $A = Z + N = 8 + 8 = 16$."},{"type":"mcq","level":"NB","points":0.25,"q":"Kí hiệu $^{1}_{1}H$ cho biết nguyên tử hydrogen (protium) có","options":["A. 1 proton và 1 neutron","B. 1 proton và 0 neutron","C. 0 proton và 1 neutron","D. 1 proton và 2 neutron"],"answer":"B","explain":"$Z = 1$ nên có 1 proton; $N = A - Z = 1 - 1 = 0$ neutron."},{"type":"mcq","level":"TH","points":0.25,"q":"Số neutron trong hạt nhân nguyên tử $^{27}_{13}Al$ là","options":["A. 13","B. 27","C. 14","D. 40"],"answer":"C","explain":"$N = A - Z = 27 - 13 = 14$."},{"type":"mcq","level":"TH","points":0.25,"q":"Cặp nguyên tử nào sau đây KHÔNG phải là đồng vị của nhau?","options":["A. $^{35}_{17}Cl$ và $^{37}_{17}Cl$","B. $^{1}_{1}H$ và $^{3}_{1}H$","C. $^{14}_{6}C$ và $^{14}_{7}N$","D. $^{16}_{8}O$ và $^{18}_{8}O$"],"answer":"C","explain":"$^{14}_{6}C$ và $^{14}_{7}N$ khác Z (6 và 7) nên thuộc hai nguyên tố khác nhau, không phải đồng vị (dù cùng A = 14)."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử X có tổng số hạt cơ bản là 40, số hạt mang điện nhiều hơn số hạt không mang điện là 12. Kí hiệu nguyên tử đầy đủ của X là","options":["A. $^{27}_{13}Al$","B. $^{13}_{27}Al$","C. $^{26}_{13}Al$","D. $^{28}_{14}Al$"],"answer":"A","explain":"Gọi p, n: $2p + n = 40$ và $2p - n = 12$ nên $p = 13$, $n = 14$. $Z = 13$ là Al, $A = 27$. Kí hiệu: $^{27}_{13}Al$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau. Nguyên tố chlorine có Z = 17.","statements":["a) Mọi nguyên tử chlorine đều có 17 proton.","b) Mọi nguyên tử chlorine đều có 18 neutron.","c) $^{35}Cl$ và $^{37}Cl$ đều là nguyên tử chlorine.","d) Kí hiệu đầy đủ của đồng vị chlorine-35 là $^{35}_{17}Cl$."],"answer":["T","F","T","T"],"explain":"a) Đúng: cùng nguyên tố thì cùng số proton. b) Sai: số neutron khác nhau theo đồng vị (18 với $^{35}Cl$, 20 với $^{37}Cl$). c) Đúng: cùng $Z = 17$. d) Đúng: $A = 35$ ở trên, $Z = 17$ ở dưới."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về ô nguyên tố Mg trong bảng tuần hoàn (ô ghi số 12, kí hiệu Mg, nguyên tử khối 24,31).","statements":["a) Số hiệu nguyên tử của Mg là 12.","b) Mỗi nguyên tử Mg có 12 proton trong hạt nhân.","c) Nguyên tử khối trung bình của Mg là một số nguyên.","d) Từ ô nguyên tố này ta biết được % cụ thể của từng đồng vị $^{24}Mg$, $^{25}Mg$, $^{26}Mg$."],"answer":["T","T","F","F"],"explain":"a) Đúng. b) Đúng: $Z = 12$. c) Sai: 24,31 không phải số nguyên. d) Sai: ô nguyên tố chỉ cho NTK trung bình, không cho % từng đồng vị."},{"type":"short","level":"VDC","points":0.5,"q":"Bromine trong tự nhiên gồm 2 đồng vị $^{79}Br$ và $^{81}Br$, nguyên tử khối trung bình là 80. Tính % số nguyên tử của đồng vị $^{79}Br$ (ghi số, ví dụ 50).","answer":"50","explain":"Gọi x là % số nguyên tử của $^{79}Br$. Ta có $\\frac{79x + 81(100 - x)}{100} = 80$ nên $-2x = -100$, suy ra $x = 50$. Đáp án 50."},{"type":"short","level":"VDC","points":0.5,"q":"Gallium trong tự nhiên gồm 2 đồng vị $^{69}Ga$ và $^{71}Ga$, nguyên tử khối trung bình là 69,8. Tính % số nguyên tử của đồng vị $^{69}Ga$ (ghi số, ví dụ 60).","answer":"60","explain":"Gọi x là % số nguyên tử của $^{69}Ga$. Ta có $\\frac{69x + 71(100 - x)}{100} = 69{,}8$ nên $-2x = -120$, suy ra $x = 60$. Đáp án 60."}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Trong các hạt proton, neutron, electron, hạt quyết định nguyên tố hoá học mà nguyên tử thuộc về là","options":["A. neutron","B. electron","C. proton","D. cả ba hạt"],"answer":"C","explain":"Số proton (Z) quyết định nguyên tố hoá học của nguyên tử."},{"type":"mcq","level":"NB","points":0.25,"q":"Số neutron N trong hạt nhân được tính bằng công thức","options":["A. $N = A + Z$","B. $N = A - Z$","C. $N = Z - A$","D. $N = A \\times Z$"],"answer":"B","explain":"Từ $A = Z + N$ suy ra $N = A - Z$."},{"type":"mcq","level":"NB","points":0.25,"q":"Kí hiệu đầy đủ của nguyên tử carbon-14 (biết carbon có Z = 6) là","options":["A. $^{14}_{6}C$","B. $^{6}_{14}C$","C. $^{14}_{8}C$","D. $^{6}_{6}C$"],"answer":"A","explain":"Carbon-14 có $A = 14$, $Z = 6$ nên kí hiệu đầy đủ là $^{14}_{6}C$."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử $^{31}_{15}P$ có số proton và số neutron lần lượt là","options":["A. 15 và 31","B. 15 và 16","C. 16 và 15","D. 31 và 15"],"answer":"B","explain":"Số proton $= Z = 15$; số neutron $N = A - Z = 31 - 15 = 16$."},{"type":"mcq","level":"TH","points":0.25,"q":"Khẳng định nào sau đây đúng về đồng vị?","options":["A. Các đồng vị có cùng số khối","B. Các đồng vị có cùng tính chất hoá học","C. Các đồng vị có số proton khác nhau","D. Các đồng vị thuộc các nguyên tố khác nhau"],"answer":"B","explain":"Các đồng vị cùng Z nên có cùng cấu hình electron, do đó có cùng tính chất hoá học."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử lưu huỳnh (S) có Z = 16 và 16 neutron trong hạt nhân. Kí hiệu nguyên tử đầy đủ của lưu huỳnh là","options":["A. $^{32}_{16}S$","B. $^{16}_{32}S$","C. $^{32}_{32}S$","D. $^{16}_{16}S$"],"answer":"A","explain":"$A = Z + N = 16 + 16 = 32$. Kí hiệu đầy đủ: $^{32}_{16}S$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về kí hiệu $^{23}_{11}Na$.","statements":["a) Nguyên tố natri có số hiệu nguyên tử Z = 11.","b) Số khối của nguyên tử này là 23.","c) Số neutron trong hạt nhân là 12.","d) Trong bảng tuần hoàn, ô nguyên tố Na ghi số 23 ở vị trí số hiệu nguyên tử."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: $N = 23 - 11 = 12$. d) Sai: vị trí số hiệu nguyên tử ghi số 11; số 23 (thực tế 22,99) là nguyên tử khối trung bình."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau. Silver trong tự nhiên gồm 2 đồng vị: $^{107}Ag$ (52%) và $^{109}Ag$ (48%).","statements":["a) Nguyên tử khối trung bình $\\bar{A}_{Ag} = \\frac{107 \\times 52 + 109 \\times 48}{100}$.","b) Nguyên tử khối trung bình của Ag $\\approx 107{,}96$.","c) Hai đồng vị này đều có 47 proton trong hạt nhân.","d) Nguyên tử khối trung bình của Ag bằng đúng 108."],"answer":["T","T","T","F"],"explain":"a) Đúng: đúng công thức. b) Đúng: $\\frac{5564 + 5232}{100} = 107{,}96$. c) Đúng: cùng là Ag nên cùng $Z = 47$. d) Sai: 107,96 khác 108."},{"type":"short","level":"VDC","points":0.5,"q":"Neon trong tự nhiên gồm 3 đồng vị: $^{20}Ne$ chiếm 90%, $^{21}Ne$ chiếm 2%, $^{22}Ne$ chiếm 8%. Tính nguyên tử khối trung bình của neon (ghi số thập phân, ví dụ 20.18).","answer":"20.18","explain":"$\\bar{A}_{Ne} = \\frac{20 \\times 90 + 21 \\times 2 + 22 \\times 8}{100} = \\frac{1800 + 42 + 176}{100} = 20{,}18$. Đáp án 20.18 (chấp nhận 20,18)."},{"type":"short","level":"VDC","points":0.5,"q":"Lithium trong tự nhiên gồm 2 đồng vị $^{6}Li$ và $^{7}Li$, nguyên tử khối trung bình là 6,9. Tính % số nguyên tử của đồng vị $^{6}Li$ (ghi số, ví dụ 10).","answer":"10","explain":"Gọi x là % số nguyên tử của $^{6}Li$. Ta có $\\frac{6x + 7(100 - x)}{100} = 6{,}9$ nên $-x = -10$, suy ra $x = 10$. Đáp án 10."}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Khái niệm nguyên tố hoá học được định nghĩa dựa trên","options":["A. số neutron trong hạt nhân","B. số proton trong hạt nhân","C. số electron ở vỏ nguyên tử","D. khối lượng của nguyên tử"],"answer":"B","explain":"Nguyên tố hoá học là tập hợp các nguyên tử có cùng số proton trong hạt nhân."},{"type":"mcq","level":"NB","points":0.25,"q":"Điện tích hạt nhân của nguyên tử có số hiệu Z = 17 là","options":["A. -17","B. +17","C. 17-","D. 0"],"answer":"B","explain":"Điện tích hạt nhân bằng +Z (do proton mang điện +1), vậy bằng +17."},{"type":"mcq","level":"NB","points":0.25,"q":"Số hiệu nguyên tử Z được viết ở vị trí nào trong kí hiệu $^{A}_{Z}X$?","options":["A. góc trên bên trái","B. góc dưới bên trái","C. góc trên bên phải","D. chính giữa kí hiệu"],"answer":"B","explain":"Quy ước: Z viết ở góc dưới bên trái, A viết ở góc trên bên trái kí hiệu nguyên tố X."},{"type":"mcq","level":"TH","points":0.25,"q":"Tổng số hạt proton, neutron và electron của nguyên tử $^{19}_{9}F$ là","options":["A. 19","B. 28","C. 37","D. 9"],"answer":"B","explain":"Số proton = số electron = 9; số neutron $= 19 - 9 = 10$. Tổng $= 9 + 10 + 9 = 28$."},{"type":"mcq","level":"TH","points":0.25,"q":"Dãy nào sau đây gồm các đồng vị của cùng một nguyên tố?","options":["A. $^{39}_{19}K$, $^{40}_{19}K$, $^{41}_{19}K$","B. $^{39}_{19}K$, $^{40}_{20}Ca$, $^{41}_{19}K$","C. $^{38}_{18}Ar$, $^{39}_{19}K$, $^{40}_{20}Ca$","D. $^{39}_{19}K$, $^{39}_{20}Ca$, $^{40}_{19}K$"],"answer":"A","explain":"Chỉ dãy A gồm các nguyên tử cùng $Z = 19$ (cùng là K) nhưng khác số khối."},{"type":"mcq","level":"VD","points":0.25,"q":"Ion $X^{2+}$ có 10 electron. Biết nguyên tử X có 12 neutron. Kí hiệu nguyên tử đầy đủ của X là","options":["A. $^{24}_{12}Mg$","B. $^{22}_{10}Ne$","C. $^{24}_{10}Ne$","D. $^{22}_{12}Mg$"],"answer":"A","explain":"Ion $X^{2+}$ có 10 electron nên nguyên tử X có $10 + 2 = 12$ proton, tức $Z = 12$ (Mg). Số khối $A = 12 + 12 = 24$. Kí hiệu: $^{24}_{12}Mg$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau. Mỗi ô nguyên tố trong bảng tuần hoàn cho biết:","statements":["a) Số hiệu nguyên tử Z của nguyên tố.","b) Kí hiệu hoá học của nguyên tố.","c) Nguyên tử khối trung bình của nguyên tố.","d) % số nguyên tử của từng đồng vị."],"answer":["T","T","T","F"],"explain":"a), b), c) Đúng: mỗi ô nguyên tố cho biết Z, kí hiệu hoá học và NTK trung bình. d) Sai: ô nguyên tố không cho % từng đồng vị."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về nguyên tử khối trung bình.","statements":["a) Nguyên tử khối trung bình luôn là một số nguyên.","b) Nguyên tử khối trung bình nằm giữa số khối của đồng vị nhẹ nhất và đồng vị nặng nhất.","c) Đồng vị nào có % càng cao thì NTK trung bình càng gần số khối của đồng vị đó.","d) Nguyên tố chỉ có một đồng vị bền trong tự nhiên thì NTK trung bình xấp xỉ bằng số khối của đồng vị đó."],"answer":["F","T","T","T"],"explain":"a) Sai: NTK trung bình thường là số thập phân (ví dụ Cl là 35,5). b), c) Đúng: tính chất của giá trị trung bình có trọng số. d) Đúng: ví dụ Na chỉ có $^{23}Na$ nên NTK $\\approx 22{,}99$."},{"type":"short","level":"VDC","points":0.5,"q":"Magnesium trong tự nhiên gồm 3 đồng vị: $^{24}Mg$ chiếm 80%, $^{25}Mg$ chiếm 10%, $^{26}Mg$ chiếm 10%. Tính nguyên tử khối trung bình của magnesium (ghi số thập phân, ví dụ 24.3).","answer":"24.3","explain":"$\\bar{A}_{Mg} = \\frac{24 \\times 80 + 25 \\times 10 + 26 \\times 10}{100} = \\frac{1920 + 250 + 260}{100} = 24{,}3$. Đáp án 24.3 (chấp nhận 24,3)."},{"type":"short","level":"VDC","points":0.5,"q":"Silver trong tự nhiên gồm 2 đồng vị $^{107}Ag$ và $^{109}Ag$, nguyên tử khối trung bình là 108,04. Tính % số nguyên tử của đồng vị $^{107}Ag$ (ghi số, ví dụ 48).","answer":"48","explain":"Gọi x là % số nguyên tử của $^{107}Ag$. Ta có $\\frac{107x + 109(100 - x)}{100} = 108{,}04$ nên $-2x = -96$, suy ra $x = 48$. Đáp án 48."}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Hai nguyên tử $^{12}_{6}C$ và $^{13}_{6}C$ thuộc cùng một nguyên tố hoá học vì chúng","options":["A. có cùng số neutron","B. có cùng số proton","C. có cùng số khối","D. có cùng số electron ở lớp ngoài cùng"],"answer":"B","explain":"Cả hai đều có $Z = 6$ (cùng 6 proton) nên cùng thuộc nguyên tố carbon."},{"type":"mcq","level":"NB","points":0.25,"q":"Số electron trong nguyên tử trung hoà của nguyên tố có Z = 26 là","options":["A. 30","B. 26","C. 56","D. 52"],"answer":"B","explain":"Nguyên tử trung hoà có số electron bằng số proton bằng Z = 26."},{"type":"mcq","level":"NB","points":0.25,"q":"Cách đọc đúng kí hiệu $^{35}_{17}Cl$ là","options":["A. chlorine-17","B. chlorine-35","C. chlorine-52","D. chlorine-18"],"answer":"B","explain":"Tên đồng vị đọc theo số khối A: chlorine-35 (A = 35)."},{"type":"mcq","level":"TH","points":0.25,"q":"Số neutron trong hạt nhân của đồng vị $^{37}_{17}Cl$ là","options":["A. 17","B. 37","C. 20","D. 54"],"answer":"C","explain":"$N = A - Z = 37 - 17 = 20$."},{"type":"mcq","level":"TH","points":0.25,"q":"Trong các cặp nguyên tử sau, cặp nào là đồng vị của nhau?","options":["A. $^{63}_{29}Cu$ và $^{65}_{29}Cu$","B. $^{63}_{29}Cu$ và $^{63}_{30}Zn$","C. $^{65}_{29}Cu$ và $^{65}_{30}Zn$","D. $^{63}_{29}Cu$ và $^{64}_{30}Zn$"],"answer":"A","explain":"Chỉ cặp A cùng $Z = 29$ (cùng là Cu) nhưng khác số khối (63 và 65)."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử X có tổng số hạt cơ bản là 52, số hạt mang điện nhiều hơn số hạt không mang điện là 16. Số hiệu nguyên tử Z của X là","options":["A. 17","B. 18","C. 35","D. 16"],"answer":"A","explain":"Gọi p, n: $2p + n = 52$ và $2p - n = 16$ nên $4p = 68$, suy ra $p = 17$. Vậy $Z = 17$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về nguyên tử $^{65}_{29}Cu$.","statements":["a) Số hiệu nguyên tử Z = 29.","b) Số proton trong hạt nhân là 29.","c) Số neutron trong hạt nhân là 36.","d) Số electron trong nguyên tử trung hoà là 65."],"answer":["T","T","T","F"],"explain":"a), b) Đúng: $Z = 29$. c) Đúng: $N = 65 - 29 = 36$. d) Sai: số electron bằng số proton, tức bằng 29."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau. Boron trong tự nhiên có 2 đồng vị: $^{10}B$ (19,9%) và $^{11}B$ (80,1%).","statements":["a) Nguyên tử khối trung bình $\\bar{A}_{B} = \\frac{10 \\times 19{,}9 + 11 \\times 80{,}1}{100}$.","b) Nguyên tử khối trung bình của B $\\approx 10{,}8$.","c) $^{10}B$ và $^{11}B$ có cùng tính chất hoá học.","d) Nguyên tử khối trung bình của B là 10,5."],"answer":["T","T","T","F"],"explain":"a) Đúng: đúng công thức. b) Đúng: $\\frac{199 + 881{,}1}{100} = 10{,}801 \\approx 10{,}8$. c) Đúng: các đồng vị cùng tính chất hoá học. d) Sai: giá trị đúng $\\approx 10{,}8$."},{"type":"short","level":"VDC","points":0.5,"q":"Zinc trong tự nhiên gồm 3 đồng vị: $^{64}Zn$ chiếm 50%, $^{66}Zn$ chiếm 30%, $^{68}Zn$ chiếm 20%. Tính nguyên tử khối trung bình của zinc (ghi số thập phân, ví dụ 65.4).","answer":"65.4","explain":"$\\bar{A}_{Zn} = \\frac{64 \\times 50 + 66 \\times 30 + 68 \\times 20}{100} = \\frac{3200 + 1980 + 1360}{100} = 65{,}4$. Đáp án 65.4 (chấp nhận 65,4)."},{"type":"short","level":"VDC","points":0.5,"q":"Antimony trong tự nhiên gồm 2 đồng vị $^{121}Sb$ và $^{123}Sb$, nguyên tử khối trung bình là 121,8. Tính % số nguyên tử của đồng vị $^{121}Sb$ (ghi số, ví dụ 60).","answer":"60","explain":"Gọi x là % số nguyên tử của $^{121}Sb$. Ta có $\\frac{121x + 123(100 - x)}{100} = 121{,}8$ nên $-2x = -120$, suy ra $x = 60$. Đáp án 60."}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Nguyên tố hoá học là tập hợp những nguyên tử có cùng","options":["A. số neutron","B. số khối","C. điện tích hạt nhân","D. số electron hoá trị"],"answer":"C","explain":"Điện tích hạt nhân bằng +Z (quyết định bởi số proton), vậy các nguyên tử cùng điện tích hạt nhân là cùng nguyên tố."},{"type":"mcq","level":"NB","points":0.25,"q":"Từ kí hiệu nguyên tử $^{A}_{Z}X$, số neutron N được xác định bằng","options":["A. $A + Z$","B. $A - Z$","C. $Z - A$","D. $A \\times Z$"],"answer":"B","explain":"Từ $A = Z + N$ suy ra $N = A - Z$."},{"type":"mcq","level":"NB","points":0.25,"q":"Nguyên tử aluminium (Al) có Z = 13 và A = 27. Số neutron trong hạt nhân là","options":["A. 13","B. 27","C. 14","D. 40"],"answer":"C","explain":"$N = A - Z = 27 - 13 = 14$."},{"type":"mcq","level":"TH","points":0.25,"q":"Cho các nguyên tử: $^{24}_{12}Mg$, $^{25}_{12}Mg$, $^{26}_{12}Mg$. Nhận xét đúng là","options":["A. chúng thuộc 3 nguyên tố hoá học khác nhau","B. chúng là đồng vị của nhau","C. chúng có cùng số neutron","D. chúng có cùng số khối"],"answer":"B","explain":"Cả ba cùng $Z = 12$ nhưng khác A (24, 25, 26) nên là đồng vị của nguyên tố Mg."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử khối trung bình của chlorine là 35,5. Điều này cho thấy","options":["A. mọi nguyên tử chlorine đều có khối lượng 35,5 amu","B. chlorine là hỗn hợp 2 đồng vị và $^{35}Cl$ chiếm tỉ lệ cao hơn","C. chlorine chỉ có một đồng vị duy nhất là $^{35}Cl$","D. số khối của nguyên tử chlorine là 35,5"],"answer":"B","explain":"NTK trung bình 35,5 nằm giữa 35 và 37 và gần 35 hơn, chứng tỏ Cl là hỗn hợp 2 đồng vị $^{35}Cl$, $^{37}Cl$ với $^{35}Cl$ chiếm % cao hơn."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử X có số khối là 39, số neutron nhiều hơn số proton là 1 hạt. Số hiệu nguyên tử Z của X là","options":["A. 19","B. 20","C. 39","D. 18"],"answer":"A","explain":"Gọi p, n: $p + n = 39$ và $n - p = 1$. Cộng hai phương trình: $2n = 40$ nên $n = 20$, $p = 19$. Vậy $Z = 19$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về nguyên tố potassium (K).","statements":["a) Mọi nguyên tử K đều có 19 proton trong hạt nhân.","b) Kí hiệu $^{39}_{19}K$ cho biết nguyên tử này có 20 neutron.","c) $^{39}K$ và $^{41}K$ là đồng vị của nhau.","d) Số hiệu nguyên tử của K thay đổi theo từng đồng vị."],"answer":["T","T","T","F"],"explain":"a) Đúng: K có $Z = 19$. b) Đúng: $N = 39 - 19 = 20$. c) Đúng: cùng $Z = 19$, khác A. d) Sai: mọi đồng vị của K đều có cùng $Z = 19$."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau. Gallium trong tự nhiên có 2 đồng vị: $^{69}Ga$ (60,1%) và $^{71}Ga$ (39,9%).","statements":["a) Nguyên tử khối trung bình $\\bar{A}_{Ga} = \\frac{69 \\times 60{,}1 + 71 \\times 39{,}9}{100}$.","b) Nguyên tử khối trung bình của Ga $\\approx 69{,}8$.","c) Nếu % của $^{69}Ga$ tăng lên thì $\\bar{A}_{Ga}$ sẽ giảm.","d) $^{69}Ga$ và $^{71}Ga$ có số neutron bằng nhau."],"answer":["T","T","T","F"],"explain":"a) Đúng: đúng công thức. b) Đúng: $\\frac{4146{,}9 + 2832{,}9}{100} = 69{,}798 \\approx 69{,}8$. c) Đúng: tăng % đồng vị nhẹ thì giá trị trung bình giảm. d) Sai: số neutron lần lượt là 38 và 40."},{"type":"short","level":"VDC","points":0.5,"q":"Iron trong tự nhiên gồm 3 đồng vị: $^{56}Fe$ chiếm 90%, $^{54}Fe$ chiếm 6%, $^{57}Fe$ chiếm 4%. Tính nguyên tử khối trung bình của iron (ghi số thập phân, ví dụ 55.92).","answer":"55.92","explain":"$\\bar{A}_{Fe} = \\frac{56 \\times 90 + 54 \\times 6 + 57 \\times 4}{100} = \\frac{5040 + 324 + 228}{100} = 55{,}92$. Đáp án 55.92 (chấp nhận 55,92)."},{"type":"short","level":"VDC","points":0.5,"q":"Chlorine trong tự nhiên gồm 2 đồng vị $^{35}Cl$ và $^{37}Cl$, nguyên tử khối trung bình là 35,4. Tính % số nguyên tử của đồng vị $^{35}Cl$ (ghi số, ví dụ 80).","answer":"80","explain":"Gọi x là % số nguyên tử của $^{35}Cl$. Ta có $\\frac{35x + 37(100 - x)}{100} = 35{,}4$ nên $-2x = -160$, suy ra $x = 80$. Đáp án 80."}]}]}
