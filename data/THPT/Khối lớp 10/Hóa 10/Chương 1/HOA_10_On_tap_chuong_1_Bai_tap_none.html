<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Hạt nào sau đây mang điện tích dương trong nguyên tử?","options":["A. Electron","B. Proton","C. Neutron","D. Photon"],"answer":"B","explain":"Proton mang điện tích dương (+1), electron mang điện tích âm (-1), neutron không mang điện."},{"type":"mcq","level":"NB","points":0.25,"q":"Số hiệu nguyên tử (Z) của một nguyên tố được xác định bằng số hạt nào?","options":["A. Neutron","B. Proton","C. Electron lớp ngoài cùng","D. Nucleon"],"answer":"B","explain":"Số hiệu nguyên tử Z bằng số proton trong hạt nhân, và cũng bằng số electron của nguyên tử trung hòa."},{"type":"mcq","level":"NB","points":0.25,"q":"Số khối (A) của hạt nhân nguyên tử được tính bằng công thức nào?","options":["A. $A = Z + N$","B. $A = Z - N$","C. $A = 2Z + N$","D. $A = Z + 2N$"],"answer":"A","explain":"Số khối A bằng tổng số proton (Z) và số neutron (N): $A = Z + N$."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử $^{23}_{11}Na$ có số proton, neutron, electron lần lượt là","options":["A. 11, 11, 11","B. 11, 12, 11","C. 12, 11, 12","D. 11, 12, 12"],"answer":"B","explain":"Từ kí hiệu $^{23}_{11}Na$: $Z = 11$ nên số $p$ = số $e$ = 11; số $n = A - Z = 23 - 11 = 12$."},{"type":"mcq","level":"TH","points":0.25,"q":"Clo có hai đồng vị $^{35}Cl$ chiếm 75% và $^{37}Cl$ chiếm 25%. Nguyên tử khối trung bình của clo là","options":["A. 35","B. 35,5","C. 36","D. 37"],"answer":"B","explain":"$\\bar{A}_{Cl} = \\frac{35 \\times 75 + 37 \\times 25}{100} = \\frac{3550}{100} = 35,5$."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử X có tổng số hạt là 58, số hạt mang điện nhiều hơn số hạt không mang điện là 18. Số proton của X là","options":["A. 18","B. 19","C. 20","D. 21"],"answer":"B","explain":"Đặt $p$ là số proton. Ta có $2p + n = 58$ và $2p - n = 18$. Cộng vế với vế: $4p = 76$, suy ra $p = 19$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về nguyên tử $^{37}_{17}Cl$:","statements":["a) Số neutron của nguyên tử này là 17.","b) Nguyên tử này có 17 electron.","c) Nguyên tử này thuộc nguyên tố clo vì có số hiệu nguyên tử bằng 17.","d) Khối lượng của nguyên tử tập trung chủ yếu ở hạt nhân."],"answer":["F","T","T","T"],"explain":"a) Sai. Số $n = A - Z = 37 - 17 = 20$. b) Đúng. Nguyên tử trung hòa có số $e$ = $Z$ = 17. c) Đúng. Số hiệu nguyên tử đặc trưng cho nguyên tố. d) Đúng. Khối lượng electron rất nhỏ nên khối lượng nguyên tử tập trung ở hạt nhân."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về nguyên tử natri ($Z = 11$):","statements":["a) Cấu hình electron của Na là $1s^2 2s^2 2p^6 3s^1$.","b) Nguyên tử Na có 3 lớp electron.","c) Lớp electron ngoài cùng của Na có 2 electron.","d) Natri là kim loại."],"answer":["T","T","F","T"],"explain":"a) Đúng. Điền 11 electron theo thứ tự mức năng lượng: $1s^2 2s^2 2p^6 3s^1$. b) Đúng. Electron phân bố trên các lớp $n = 1, 2, 3$. c) Sai. Lớp ngoài cùng ($n = 3$) chỉ có 1 electron ở phân lớp $3s$. d) Đúng."},{"type":"short","level":"VDC","points":0.5,"q":"Đồng có hai đồng vị $^{63}Cu$ và $^{65}Cu$. Nguyên tử khối trung bình của đồng là 63,55. Tính phần trăm số nguyên tử của đồng vị $^{63}Cu$.","answer":"72.5","explain":"Gọi $x$ là % của $^{63}Cu$ thì % của $^{65}Cu$ là $100 - x$. Ta có $\\frac{63x + 65(100 - x)}{100} = 63,55$, suy ra $63x + 6500 - 65x = 6355$, hay $-2x = -145$, vậy $x = 72,5$. Đáp án 72,5 (chấp nhận 72,5)."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử M có tổng số hạt proton, neutron, electron là 40; số hạt mang điện nhiều hơn số hạt không mang điện là 12. Tính số neutron của M.","answer":"14","explain":"Đặt $p$ là số proton. Ta có $2p + n = 40$ và $2p - n = 12$. Cộng vế với vế: $4p = 52$, suy ra $p = 13$. Số $n = 40 - 2 \\times 13 = 14$."}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Hạt nào sau đây không mang điện và nằm trong hạt nhân nguyên tử?","options":["A. Proton","B. Neutron","C. Electron","D. Positron"],"answer":"B","explain":"Neutron không mang điện và cùng với proton tạo thành hạt nhân nguyên tử."},{"type":"mcq","level":"NB","points":0.25,"q":"Phát biểu nào sau đây đúng về electron?","options":["A. Electron mang điện tích dương.","B. Electron có khối lượng xấp xỉ 1 amu.","C. Electron mang điện tích âm và có khối lượng rất nhỏ so với proton.","D. Electron nằm trong hạt nhân nguyên tử."],"answer":"C","explain":"Electron mang điện tích âm, khối lượng chỉ bằng khoảng 1/1836 khối lượng proton, chuyển động xung quanh hạt nhân."},{"type":"mcq","level":"NB","points":0.25,"q":"Các nguyên tử thuộc cùng một nguyên tố hóa học có đặc điểm chung nào sau đây?","options":["A. Có cùng số neutron.","B. Có cùng số proton (cùng số hiệu nguyên tử).","C. Có cùng số khối.","D. Có cùng số electron lớp ngoài cùng."],"answer":"B","explain":"Nguyên tố hóa học là tập hợp các nguyên tử có cùng số proton (cùng điện tích hạt nhân Z)."},{"type":"mcq","level":"TH","points":0.25,"q":"Số electron tối đa có thể có trong lớp M ($n = 3$) là","options":["A. 2","B. 8","C. 18","D. 32"],"answer":"C","explain":"Số electron tối đa của lớp $n$ là $2n^2$. Với $n = 3$: $2 \\times 3^2 = 18$."},{"type":"mcq","level":"TH","points":0.25,"q":"Ion $Na^+$ được tạo thành từ nguyên tử $^{23}_{11}Na$. Số proton và số electron của ion $Na^+$ lần lượt là","options":["A. 11 và 11","B. 11 và 10","C. 10 và 11","D. 12 và 10"],"answer":"B","explain":"Số proton không đổi: $p = Z = 11$. Nguyên tử Na nhường 1 electron để tạo $Na^+$ nên số $e = 11 - 1 = 10$."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử R có tổng số hạt là 52, số hạt mang điện nhiều hơn số hạt không mang điện là 16. Kí hiệu nguyên tử đúng của R là","options":["A. $^{35}_{17}Cl$","B. $^{37}_{17}Cl$","C. $^{35}_{16}S$","D. $^{36}_{17}Cl$"],"answer":"A","explain":"Đặt $p$ là số proton: $2p + n = 52$, $2p - n = 16$ nên $4p = 68$, suy ra $p = 17$. Số $n = 52 - 2 \\times 17 = 18$, số khối $A = 17 + 18 = 35$. Vậy kí hiệu là $^{35}_{17}Cl$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về đồng vị:","statements":["a) Đồng vị là các nguyên tử có cùng số proton nhưng khác nhau số neutron.","b) $^{12}C$ và $^{14}C$ là đồng vị của nhau.","c) Các đồng vị của cùng một nguyên tố có số khối khác nhau.","d) Các đồng vị của một nguyên tố có tính chất hóa học khác nhau hoàn toàn."],"answer":["T","T","T","F"],"explain":"a) Đúng. Đây là định nghĩa đồng vị. b) Đúng. Cả hai đều có $Z = 6$, số neutron lần lượt là 6 và 8. c) Đúng. Vì số neutron khác nhau nên $A = Z + N$ khác nhau. d) Sai. Các đồng vị có cùng số electron nên tính chất hóa học gần như giống nhau."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về nguyên tử oxi ($Z = 8$):","statements":["a) Cấu hình electron của O là $1s^2 2s^2 2p^4$.","b) Nguyên tử O có 2 lớp electron.","c) Lớp electron ngoài cùng của O có 4 electron.","d) Nguyên tử O có 2 electron độc thân."],"answer":["T","T","F","T"],"explain":"a) Đúng. Điền 8 electron: $1s^2 2s^2 2p^4$. b) Đúng. Electron phân bố ở $n = 1$ và $n = 2$. c) Sai. Lớp ngoài cùng ($n = 2$) có $2 + 4 = 6$ electron. d) Đúng. Theo quy tắc Hund, phân lớp $2p^4$ có 2 electron độc thân."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tố bo có hai đồng vị $^{10}B$ và $^{11}B$ với nguyên tử khối trung bình là 10,81. Tính phần trăm số nguyên tử của đồng vị $^{10}B$ (làm tròn đến 1 chữ số thập phân).","answer":"19","explain":"Gọi $x$ là % của $^{10}B$. Ta có $\\frac{10x + 11(100 - x)}{100} = 10,81$, suy ra $10x + 1100 - 11x = 1081$, hay $-x = -19$, vậy $x = 19$. Đáp án 19 (chấp nhận 19,0)."},{"type":"short","level":"VDC","points":0.5,"q":"Magie có ba đồng vị: $^{24}Mg$ chiếm 78,99%, $^{25}Mg$ chiếm 10,00%, $^{26}Mg$ chiếm 11,01%. Tính nguyên tử khối trung bình của magie (làm tròn đến 2 chữ số thập phân).","answer":"24.32","explain":"$\\bar{A}_{Mg} = \\frac{24 \\times 78,99 + 25 \\times 10,00 + 26 \\times 11,01}{100} = \\frac{2432,02}{100} = 24,3202 \\approx 24,32$. Đáp án 24.32 (chấp nhận 24,32)."}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Thứ tự điền electron vào các phân lớp theo chiều mức năng lượng tăng dần bắt đầu là","options":["A. $1s\\,2s\\,2p\\,3s\\,3p\\,4s\\,3d...$","B. $1s\\,2s\\,2p\\,3s\\,3d\\,4s...$","C. $1s\\,2p\\,2s\\,3s...$","D. $1s\\,2s\\,3s\\,2p...$"],"answer":"A","explain":"Thứ tự mức năng lượng tăng dần: $1s\\,2s\\,2p\\,3s\\,3p\\,4s\\,3d\\,4p...$ Chú ý mức $4s$ thấp hơn $3d$."},{"type":"mcq","level":"NB","points":0.25,"q":"Phân lớp p chứa tối đa bao nhiêu electron?","options":["A. 2","B. 6","C. 10","D. 14"],"answer":"B","explain":"Phân lớp p có 3 obitan, mỗi obitan chứa tối đa 2 electron nên chứa tối đa 6 electron."},{"type":"mcq","level":"NB","points":0.25,"q":"Kí hiệu nguyên tử $^{39}_{19}K$ cho biết điều gì?","options":["A. Số hiệu nguyên tử là 39, số khối là 19.","B. Số hiệu nguyên tử là 19, số khối là 39.","C. Có 39 proton và 19 neutron.","D. Có 39 electron."],"answer":"B","explain":"Trong kí hiệu $^{A}_{Z}X$, số ở trên là số khối $A = 39$, số ở dưới là số hiệu nguyên tử $Z = 19$."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron đúng của nguyên tử canxi ($Z = 20$) là","options":["A. $1s^2 2s^2 2p^6 3s^2 3p^6 4s^1$","B. $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2$","C. $1s^2 2s^2 2p^6 3s^2 3p^6 3d^2$","D. $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2 3d^1$"],"answer":"B","explain":"Ca có 20 electron. Điền theo thứ tự mức năng lượng: $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2$ (mức $4s$ trước $3d$)."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử $^{27}_{13}Al$ có bao nhiêu neutron?","options":["A. 13","B. 14","C. 27","D. 40"],"answer":"B","explain":"Số $n = A - Z = 27 - 13 = 14$."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử T có tổng số hạt là 34, số hạt mang điện nhiều hơn số hạt không mang điện là 10. Số khối A của T là","options":["A. 22","B. 23","C. 24","D. 34"],"answer":"B","explain":"Đặt $p$ là số proton: $2p + n = 34$, $2p - n = 10$ nên $4p = 44$, suy ra $p = 11$. Số $n = 34 - 2 \\times 11 = 12$. Số khối $A = 11 + 12 = 23$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về nguyên tử $^{32}_{16}S$:","statements":["a) Nguyên tử S có 16 proton.","b) Nguyên tử S có 16 neutron.","c) Ion $S^{2-}$ có 18 electron.","d) Lưu huỳnh là kim loại."],"answer":["T","T","T","F"],"explain":"a) Đúng. Số $p$ = $Z$ = 16. b) Đúng. Số $n = 32 - 16 = 16$. c) Đúng. Nguyên tử S nhận thêm 2 electron nên số $e = 16 + 2 = 18$. d) Sai. Lưu huỳnh là phi kim."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về nguyên tử kali ($Z = 19$):","statements":["a) Cấu hình electron của K là $1s^2 2s^2 2p^6 3s^2 3p^6 4s^1$.","b) Electron được điền vào phân lớp $4s$ trước phân lớp $3d$ vì mức $4s$ có năng lượng thấp hơn.","c) Nguyên tử K có 4 lớp electron.","d) Ion $K^+$ có 20 electron."],"answer":["T","T","T","F"],"explain":"a) Đúng. Điền 19 electron theo thứ tự mức năng lượng. b) Đúng. Đây là điểm đặc biệt của dãy mức năng lượng. c) Đúng. Lớp ngoài cùng là $n = 4$. d) Sai. $K^+$ mất 1 electron nên chỉ còn $19 - 1 = 18$ electron."},{"type":"short","level":"VDC","points":0.5,"q":"Brom có hai đồng vị $^{79}Br$ và $^{81}Br$ với nguyên tử khối trung bình là 79,91. Tính phần trăm số nguyên tử của đồng vị $^{79}Br$ (làm tròn đến 1 chữ số thập phân).","answer":"54.5","explain":"Gọi $x$ là % của $^{79}Br$. Ta có $\\frac{79x + 81(100 - x)}{100} = 79,91$, suy ra $79x + 8100 - 81x = 7991$, hay $-2x = -109$, vậy $x = 54,5$. Đáp án 54.5 (chấp nhận 54,5)."},{"type":"short","level":"VDC","points":0.5,"q":"Silic có ba đồng vị: $^{28}Si$ chiếm 92,2%, $^{29}Si$ chiếm 4,7%, $^{30}Si$ chiếm 3,1%. Tính nguyên tử khối trung bình của silic (làm tròn đến 2 chữ số thập phân).","answer":"28.11","explain":"$\\bar{A}_{Si} = \\frac{28 \\times 92,2 + 29 \\times 4,7 + 30 \\times 3,1}{100} = \\frac{2810,9}{100} = 28,109 \\approx 28,11$. Đáp án 28.11 (chấp nhận 28,11)."}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Khối lượng của nguyên tử tập trung chủ yếu ở đâu?","options":["A. Lớp vỏ electron.","B. Hạt nhân nguyên tử.","C. Phân lớp electron ngoài cùng.","D. Các neutron tự do."],"answer":"B","explain":"Khối lượng electron rất nhỏ (khoảng 1/1836 khối lượng proton) nên khối lượng nguyên tử tập trung chủ yếu ở hạt nhân."},{"type":"mcq","level":"NB","points":0.25,"q":"Điện tích của một proton (tính theo đơn vị điện tích nguyên tố) là","options":["A. -1","B. +1","C. 0","D. -2"],"answer":"B","explain":"Proton mang điện tích dương, có giá trị +1 đơn vị điện tích nguyên tố; electron mang -1; neutron không mang điện."},{"type":"mcq","level":"NB","points":0.25,"q":"Nguyên tử trung hòa về điện vì","options":["A. số proton bằng số neutron.","B. số proton bằng số electron.","C. số neutron bằng số electron.","D. nguyên tử không chứa hạt mang điện."],"answer":"B","explain":"Trong nguyên tử trung hòa, tổng điện tích dương của proton cân bằng tổng điện tích âm của electron nên số $p$ = số $e$."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron đúng của nguyên tử clo ($Z = 17$) là","options":["A. $1s^2 2s^2 2p^6 3s^2 3p^4$","B. $1s^2 2s^2 2p^6 3s^2 3p^5$","C. $1s^2 2s^2 2p^6 3s^2 3p^6$","D. $1s^2 2s^2 2p^6 3s^2 3p^5 4s^1$"],"answer":"B","explain":"Cl có 17 electron. Điền theo thứ tự mức năng lượng: $1s^2 2s^2 2p^6 3s^2 3p^5$."},{"type":"mcq","level":"TH","points":0.25,"q":"Số electron ở lớp ngoài cùng của nguyên tử $^{23}_{11}Na$ là","options":["A. 1","B. 2","C. 3","D. 11"],"answer":"A","explain":"Cấu hình electron của Na: $1s^2 2s^2 2p^6 3s^1$. Lớp ngoài cùng ($n = 3$) có 1 electron."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử E có tổng số hạt là 46, số hạt mang điện nhiều hơn số hạt không mang điện là 14. E là nguyên tố nào sau đây?","options":["A. Si ($Z = 14$)","B. P ($Z = 15$)","C. S ($Z = 16$)","D. Al ($Z = 13$)"],"answer":"B","explain":"Đặt $p$ là số proton: $2p + n = 46$, $2p - n = 14$ nên $4p = 60$, suy ra $p = 15$. Vậy E là photpho (P)."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về các đồng vị của hidro:","statements":["a) Hidro có ba đồng vị: $^{1}H$, $^{2}H$, $^{3}H$.","b) Đồng vị $^{1}H$ không có neutron trong hạt nhân.","c) Đồng vị $^{2}H$ có 1 proton và 2 neutron.","d) Các đồng vị của hidro đều có cùng số proton."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. $^{1}H$ có $A = 1$, $Z = 1$ nên số $n = 0$. c) Sai. $^{2}H$ có số $n = 2 - 1 = 1$. d) Đúng. Cùng là nguyên tố hidro nên cùng $Z = 1$."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về nguyên tử nhôm ($Z = 13$):","statements":["a) Cấu hình electron của Al là $1s^2 2s^2 2p^6 3s^2 3p^1$.","b) Nguyên tử Al có 3 lớp electron.","c) Số electron lớp ngoài cùng của Al là 1.","d) Ion $Al^{3+}$ có cấu hình electron $1s^2 2s^2 2p^6$."],"answer":["T","T","F","T"],"explain":"a) Đúng. Điền 13 electron theo thứ tự mức năng lượng. b) Đúng. Lớp ngoài cùng là $n = 3$. c) Sai. Lớp ngoài cùng có $2 + 1 = 3$ electron. d) Đúng. $Al^{3+}$ mất 3 electron ở lớp ngoài cùng nên còn 10 electron."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử Q có tổng số hạt proton, neutron, electron là 60; số hạt mang điện nhiều hơn số hạt không mang điện là 20. Tính số neutron của Q.","answer":"20","explain":"Đặt $p$ là số proton. Ta có $2p + n = 60$ và $2p - n = 20$. Cộng vế với vế: $4p = 80$, suy ra $p = 20$. Số $n = 60 - 2 \\times 20 = 20$."},{"type":"short","level":"VDC","points":0.5,"q":"Liti có hai đồng vị $^{6}Li$ chiếm 7,5% và $^{7}Li$ chiếm 92,5%. Tính nguyên tử khối trung bình của liti (làm tròn đến 2 chữ số thập phân).","answer":"6.93","explain":"$\\bar{A}_{Li} = \\frac{6 \\times 7,5 + 7 \\times 92,5}{100} = \\frac{692,5}{100} = 6,925 \\approx 6,93$. Đáp án 6.93 (chấp nhận 6,93)."}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Kích thước (đường kính) của nguyên tử vào khoảng","options":["A. $10^{-10}$ m","B. $10^{-14}$ m","C. $10^{-8}$ m","D. $10^{-6}$ m"],"answer":"A","explain":"Nguyên tử có kích thước cỡ $10^{-10}$ m (1 angstrom), trong khi hạt nhân chỉ cỡ $10^{-14}$ m."},{"type":"mcq","level":"NB","points":0.25,"q":"Phân lớp d chứa tối đa bao nhiêu electron?","options":["A. 2","B. 6","C. 10","D. 14"],"answer":"C","explain":"Phân lớp d có 5 obitan, mỗi obitan chứa tối đa 2 electron nên chứa tối đa 10 electron."},{"type":"mcq","level":"NB","points":0.25,"q":"Nguyên tố hóa học là tập hợp các nguyên tử có","options":["A. cùng số khối.","B. cùng số neutron.","C. cùng số proton (cùng điện tích hạt nhân).","D. cùng số electron lớp ngoài cùng."],"answer":"C","explain":"Nguyên tố hóa học gồm các nguyên tử có cùng số proton, tức cùng điện tích hạt nhân Z."},{"type":"mcq","level":"TH","points":0.25,"q":"Ion $O^{2-}$ được tạo thành từ nguyên tử $^{16}_{8}O$. Số electron của ion $O^{2-}$ là","options":["A. 8","B. 10","C. 6","D. 16"],"answer":"B","explain":"Nguyên tử O có 8 electron. Ion $O^{2-}$ nhận thêm 2 electron nên có $8 + 2 = 10$ electron."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron đúng của nguyên tử magie ($Z = 12$) là","options":["A. $1s^2 2s^2 2p^6 3s^1$","B. $1s^2 2s^2 2p^6 3s^2$","C. $1s^2 2s^2 2p^6 3p^2$","D. $1s^2 2s^2 2p^6 4s^2$"],"answer":"B","explain":"Mg có 12 electron. Điền theo thứ tự mức năng lượng: $1s^2 2s^2 2p^6 3s^2$."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử E có tổng số hạt là 28, số hạt mang điện nhiều hơn số hạt không mang điện là 8. Số electron của E là","options":["A. 9","B. 10","C. 8","D. 19"],"answer":"A","explain":"Đặt $p$ là số proton: $2p + n = 28$, $2p - n = 8$ nên $4p = 36$, suy ra $p = 9$. Nguyên tử trung hòa nên số $e$ = $p$ = 9."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về số hiệu nguyên tử:","statements":["a) Số hiệu nguyên tử Z bằng số proton trong hạt nhân.","b) Số hiệu nguyên tử cũng bằng số electron của nguyên tử trung hòa.","c) Các nguyên tử có cùng số hiệu nguyên tử thuộc cùng một nguyên tố hóa học.","d) Số hiệu nguyên tử quyết định số neutron trong hạt nhân."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. Đây chính là định nghĩa nguyên tố hóa học. d) Sai. Số neutron được xác định từ số khối: $n = A - Z$, Z không quyết định số neutron."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về nguyên tử silic ($Z = 14$):","statements":["a) Cấu hình electron của Si là $1s^2 2s^2 2p^6 3s^2 3p^2$.","b) Nguyên tử Si có 3 lớp electron.","c) Lớp electron ngoài cùng của Si có 2 electron.","d) Nguyên tử Si có 2 electron độc thân ở phân lớp $3p$."],"answer":["T","T","F","T"],"explain":"a) Đúng. Điền 14 electron theo thứ tự mức năng lượng. b) Đúng. Lớp ngoài cùng là $n = 3$. c) Sai. Lớp ngoài cùng có $2 + 2 = 4$ electron. d) Đúng. Theo quy tắc Hund, $3p^2$ có 2 electron độc thân."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tố X có hai đồng vị. Đồng vị nhẹ $^{35}X$ chiếm 75% số nguyên tử, nguyên tử khối trung bình của X là 35,5. Tìm số khối của đồng vị nặng.","answer":"37","explain":"Gọi $A$ là số khối đồng vị nặng. Ta có $\\frac{35 \\times 75 + A \\times 25}{100} = 35,5$, suy ra $2625 + 25A = 3550$, hay $25A = 925$, vậy $A = 37$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử Z có tổng số hạt proton, neutron, electron là 36; số hạt mang điện nhiều hơn số hạt không mang điện là 12. Tính số khối A của Z.","answer":"24","explain":"Đặt $p$ là số proton. Ta có $2p + n = 36$ và $2p - n = 12$. Cộng vế với vế: $4p = 48$, suy ra $p = 12$. Số $n = 36 - 2 \\times 12 = 12$. Số khối $A = 12 + 12 = 24$."}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Phân lớp s chứa tối đa bao nhiêu electron?","options":["A. 2","B. 6","C. 10","D. 14"],"answer":"A","explain":"Phân lớp s chỉ có 1 obitan nên chứa tối đa 2 electron."},{"type":"mcq","level":"NB","points":0.25,"q":"Hạt nhân nguyên tử được tạo thành từ các hạt nào?","options":["A. Proton và electron.","B. Proton và neutron.","C. Neutron và electron.","D. Chỉ proton."],"answer":"B","explain":"Hạt nhân gồm các proton mang điện dương và các neutron không mang điện."},{"type":"mcq","level":"NB","points":0.25,"q":"Số đơn vị điện tích hạt nhân của nguyên tử $^{23}_{11}Na$ là","options":["A. 23","B. 11","C. 12","D. 34"],"answer":"B","explain":"Số đơn vị điện tích hạt nhân bằng số proton, tức bằng số hiệu nguyên tử $Z = 11$."},{"type":"mcq","level":"TH","points":0.25,"q":"Nitơ có hai đồng vị $^{14}N$ chiếm 99,6% và $^{15}N$ chiếm 0,4%. Nguyên tử khối trung bình của nitơ gần nhất với giá trị nào?","options":["A. 14","B. 14,5","C. 15","D. 13,5"],"answer":"A","explain":"$\\bar{A}_{N} = \\frac{14 \\times 99,6 + 15 \\times 0,4}{100} = \\frac{1400,4}{100} = 14,004 \\approx 14$."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron đúng của nguyên tử flo ($Z = 9$) là","options":["A. $1s^2 2s^2 2p^4$","B. $1s^2 2s^2 2p^5$","C. $1s^2 2s^2 2p^6$","D. $1s^2 2s^2 2p^6 3s^1$"],"answer":"B","explain":"F có 9 electron. Điền theo thứ tự mức năng lượng: $1s^2 2s^2 2p^5$."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử G có tổng số hạt là 44, số hạt mang điện nhiều hơn số hạt không mang điện là 12. Số neutron của G là","options":["A. 14","B. 16","C. 18","D. 12"],"answer":"B","explain":"Đặt $p$ là số proton: $2p + n = 44$, $2p - n = 12$ nên $4p = 56$, suy ra $p = 14$. Số $n = 44 - 2 \\times 14 = 16$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về nguyên tử $^{40}_{20}Ca$:","statements":["a) Nguyên tử Ca có 20 proton.","b) Nguyên tử Ca có 20 neutron.","c) Ion $Ca^{2+}$ có 18 electron.","d) Canxi thuộc nhóm kim loại kiềm."],"answer":["T","T","T","F"],"explain":"a) Đúng. Số $p$ = $Z$ = 20. b) Đúng. Số $n = 40 - 20 = 20$. c) Đúng. $Ca^{2+}$ mất 2 electron nên còn $20 - 2 = 18$ electron. d) Sai. Canxi thuộc nhóm kim loại kiềm thổ."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về nguyên tử photpho ($Z = 15$):","statements":["a) Cấu hình electron của P là $1s^2 2s^2 2p^6 3s^2 3p^3$.","b) Nguyên tử P có 3 electron độc thân.","c) Lớp electron ngoài cùng của P có 3 electron.","d) Photpho là phi kim."],"answer":["T","T","F","T"],"explain":"a) Đúng. Điền 15 electron theo thứ tự mức năng lượng. b) Đúng. Theo quy tắc Hund, phân lớp $3p^3$ có 3 electron độc thân. c) Sai. Lớp ngoài cùng ($n = 3$) có $2 + 3 = 5$ electron. d) Đúng."},{"type":"short","level":"VDC","points":0.5,"q":"Bạc có hai đồng vị $^{107}Ag$ và $^{109}Ag$ với nguyên tử khối trung bình là 107,88. Tính phần trăm số nguyên tử của đồng vị $^{107}Ag$ (làm tròn đến 1 chữ số thập phân).","answer":"56","explain":"Gọi $x$ là % của $^{107}Ag$. Ta có $\\frac{107x + 109(100 - x)}{100} = 107,88$, suy ra $107x + 10900 - 109x = 10788$, hay $-2x = -112$, vậy $x = 56$. Đáp án 56 (chấp nhận 56,0)."},{"type":"short","level":"VDC","points":0.5,"q":"Oxi có ba đồng vị: $^{16}O$ chiếm 99,757%, $^{17}O$ chiếm 0,038%, $^{18}O$ chiếm 0,205%. Tính nguyên tử khối trung bình của oxi (làm tròn đến 3 chữ số thập phân).","answer":"16.004","explain":"$\\bar{A}_{O} = \\frac{16 \\times 99,757 + 17 \\times 0,038 + 18 \\times 0,205}{100} = \\frac{1600,448}{100} = 16,00448 \\approx 16,004$. Đáp án 16.004 (chấp nhận 16,004)."}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Theo mô hình nguyên tử hiện đại, các electron chuyển động như thế nào?","options":["A. Theo những quỹ đạo tròn xác định quanh hạt nhân.","B. Trong các obitan có hình dạng xác định xung quanh hạt nhân.","C. Đứng yên bên trong hạt nhân.","D. Theo đường thẳng từ hạt nhân ra ngoài."],"answer":"B","explain":"Theo mô hình hiện đại, electron chuyển động trong các obitan (vùng không gian xung quanh hạt nhân), không theo quỹ đạo xác định."},{"type":"mcq","level":"NB","points":0.25,"q":"Lớp electron thứ hai ($n = 2$) chứa tối đa bao nhiêu electron?","options":["A. 2","B. 8","C. 18","D. 32"],"answer":"B","explain":"Số electron tối đa của lớp $n$ là $2n^2$. Với $n = 2$: $2 \\times 2^2 = 8$."},{"type":"mcq","level":"NB","points":0.25,"q":"Hai nguyên tử $^{35}_{17}Cl$ và $^{37}_{17}Cl$ có quan hệ gì với nhau?","options":["A. Là hai nguyên tố hóa học khác nhau.","B. Là đồng vị của nhau.","C. Là đồng phân của nhau.","D. Là hai ion khác nhau."],"answer":"B","explain":"Cả hai đều có $Z = 17$ (cùng số proton) nhưng số neutron khác nhau (18 và 20) nên là đồng vị của nhau."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron đúng của nguyên tử oxi ($Z = 8$) là","options":["A. $1s^2 2s^2 2p^3$","B. $1s^2 2s^2 2p^4$","C. $1s^2 2s^2 2p^5$","D. $1s^2 2s^2 2p^6$"],"answer":"B","explain":"O có 8 electron. Điền theo thứ tự mức năng lượng: $1s^2 2s^2 2p^4$."},{"type":"mcq","level":"TH","points":0.25,"q":"Tổng số hạt proton, neutron, electron trong ion $Cl^-$ được tạo thành từ nguyên tử $^{35}_{17}Cl$ là","options":["A. 35","B. 52","C. 53","D. 54"],"answer":"C","explain":"Ion $Cl^-$: số $p = 17$, số $n = 35 - 17 = 18$, số $e = 17 + 1 = 18$. Tổng số hạt $= 17 + 18 + 18 = 53$."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử H có tổng số hạt là 68, số hạt mang điện nhiều hơn số hạt không mang điện là 20. Số hiệu nguyên tử Z của H là","options":["A. 20","B. 21","C. 22","D. 24"],"answer":"C","explain":"Đặt $p$ là số proton: $2p + n = 68$, $2p - n = 20$ nên $4p = 88$, suy ra $p = 22$. Số hiệu nguyên tử $Z = p = 22$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về khối lượng nguyên tử:","statements":["a) Vì khối lượng electron rất nhỏ nên khối lượng nguyên tử tập trung chủ yếu ở hạt nhân.","b) Khối lượng của 1 amu xấp xỉ bằng khối lượng của 1 proton.","c) Khối lượng của một nguyên tử bằng tổng khối lượng của các proton, neutron và electron trong nó.","d) Khối lượng nguyên tử bằng số khối A và có đơn vị là gam."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. 1 amu được định nghĩa xấp xỉ bằng 1/12 khối lượng nguyên tử $^{12}C$, gần bằng khối lượng 1 proton. c) Đúng. d) Sai. Khối lượng nguyên tử có đơn vị là amu (u), không phải gam; số khối A chỉ cho giá trị xấp xỉ."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về ion $Na^+$ ($Z = 11$):","statements":["a) Cấu hình electron của $Na^+$ là $1s^2 2s^2 2p^6$.","b) Ion $Na^+$ có 2 lớp electron.","c) Ion $Na^+$ có cấu hình electron giống nguyên tử neon.","d) Ion $Na^+$ có 11 electron."],"answer":["T","T","T","F"],"explain":"a) Đúng. Na mất 1 electron ở phân lớp $3s$. b) Đúng. c) Đúng. Cả hai đều có 10 electron với cấu hình $1s^2 2s^2 2p^6$. d) Sai. $Na^+$ chỉ còn $11 - 1 = 10$ electron."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tố X có hai đồng vị $^{63}X$ chiếm 69,2% và đồng vị nặng chiếm 30,8%. Nguyên tử khối trung bình của X là 63,62. Tìm số khối của đồng vị nặng (làm tròn đến số nguyên).","answer":"65","explain":"Gọi $A$ là số khối đồng vị nặng. Ta có $\\frac{63 \\times 69,2 + A \\times 30,8}{100} = 63,62$, suy ra $4359,6 + 30,8A = 6362$, hay $30,8A = 2002,4$, vậy $A \\approx 65,01$, làm tròn được 65."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử D có tổng số hạt proton, neutron, electron là 26; số hạt mang điện nhiều hơn số hạt không mang điện là 6. Tính số khối A của D.","answer":"18","explain":"Đặt $p$ là số proton. Ta có $2p + n = 26$ và $2p - n = 6$. Cộng vế với vế: $4p = 32$, suy ra $p = 8$. Số $n = 26 - 2 \\times 8 = 10$. Số khối $A = 8 + 10 = 18$."}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Phân lớp f chứa tối đa bao nhiêu electron?","options":["A. 2","B. 6","C. 10","D. 14"],"answer":"D","explain":"Phân lớp f có 7 obitan, mỗi obitan chứa tối đa 2 electron nên chứa tối đa 14 electron."},{"type":"mcq","level":"NB","points":0.25,"q":"Nguyên tử khối trung bình của một nguyên tố được tính dựa trên","options":["A. số proton của nguyên tử.","B. khối lượng và tỉ lệ % số nguyên tử của các đồng vị.","C. số neutron của nguyên tử.","D. điện tích của hạt nhân."],"answer":"B","explain":"Nguyên tử khối trung bình là trung bình có trọng số theo tỉ lệ % số nguyên tử của từng đồng vị."},{"type":"mcq","level":"NB","points":0.25,"q":"Cặp nguyên tử nào sau đây là đồng vị của nhau?","options":["A. $^{12}_{6}C$ và $^{14}_{7}N$","B. $^{35}_{17}Cl$ và $^{37}_{17}Cl$","C. $^{23}_{11}Na$ và $^{24}_{12}Mg$","D. $^{16}_{8}O$ và $^{19}_{9}F$"],"answer":"B","explain":"Chỉ cặp ở đáp án B có cùng số hiệu nguyên tử ($Z = 17$) nhưng số khối khác nhau nên là đồng vị của nhau."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron đúng của nguyên tử nitơ ($Z = 7$) là","options":["A. $1s^2 2s^2 2p^2$","B. $1s^2 2s^2 2p^3$","C. $1s^2 2s^2 2p^4$","D. $1s^2 2s^1 2p^4$"],"answer":"B","explain":"N có 7 electron. Điền theo thứ tự mức năng lượng: $1s^2 2s^2 2p^3$."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử kali ($Z = 19$) có bao nhiêu lớp electron?","options":["A. 2","B. 3","C. 4","D. 5"],"answer":"C","explain":"Cấu hình electron của K: $1s^2 2s^2 2p^6 3s^2 3p^6 4s^1$. Lớp ngoài cùng là $n = 4$ nên K có 4 lớp electron."},{"type":"mcq","level":"VD","points":0.25,"q":"Trong tự nhiên, cứ 100 nguyên tử clo thì có 75 nguyên tử $^{35}Cl$ và 25 nguyên tử $^{37}Cl$. Trong 100 nguyên tử clo tự nhiên có bao nhiêu nguyên tử $^{37}Cl$?","options":["A. 75","B. 25","C. 35","D. 50"],"answer":"B","explain":"Tỉ lệ % của $^{37}Cl$ là 25% nên trong 100 nguyên tử có 25 nguyên tử $^{37}Cl$. (Đây cũng là cơ sở để tính $\\bar{A}_{Cl} = 35,5$.)"},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về cấu hình electron:","statements":["a) Electron được điền vào các phân lớp theo chiều mức năng lượng tăng dần.","b) Mức năng lượng $4s$ thấp hơn mức $3d$.","c) Phân lớp p chứa tối đa 6 electron.","d) Lớp electron thứ ba ($n = 3$) chứa tối đa 8 electron."],"answer":["T","T","T","F"],"explain":"a) Đúng. Đây là nguyên tắc điền electron. b) Đúng. Nên electron điền vào $4s$ trước $3d$. c) Đúng. d) Sai. Số electron tối đa của lớp $n = 3$ là $2 \\times 3^2 = 18$."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về nguyên tử sắt ($Z = 26$):","statements":["a) Cấu hình electron của Fe là $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2 3d^6$.","b) Nguyên tử Fe có 4 lớp electron.","c) Phân lớp $3d$ của Fe có 8 electron.","d) Ion $Fe^{2+}$ được tạo thành khi nguyên tử Fe nhường 2 electron ở phân lớp $4s$."],"answer":["T","T","F","T"],"explain":"a) Đúng. Điền 26 electron theo thứ tự mức năng lượng, chú ý $4s$ trước $3d$. b) Đúng. Lớp ngoài cùng là $n = 4$. c) Sai. Phân lớp $3d$ có 6 electron. d) Đúng. Khi tạo cation, electron ở lớp ngoài cùng ($4s$) bị mất trước."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử L có tổng số hạt proton, neutron, electron là 18; số hạt mang điện nhiều hơn số hạt không mang điện là 6. Ion $L^{2+}$ có bao nhiêu electron?","answer":"4","explain":"Đặt $p$ là số proton của L. Ta có $2p + n = 18$ và $2p - n = 6$. Cộng vế với vế: $4p = 24$, suy ra $p = 6$. Nguyên tử L có 6 electron; ion $L^{2+}$ mất 2 electron nên còn $6 - 2 = 4$ electron."},{"type":"short","level":"VDC","points":0.5,"q":"Neon có ba đồng vị: $^{20}Ne$ chiếm 90,48%, $^{21}Ne$ chiếm 0,27%, $^{22}Ne$ chiếm 9,25%. Tính nguyên tử khối trung bình của neon (làm tròn đến 2 chữ số thập phân).","answer":"20.19","explain":"$\\bar{A}_{Ne} = \\frac{20 \\times 90,48 + 21 \\times 0,27 + 22 \\times 9,25}{100} = \\frac{2018,77}{100} = 20,1877 \\approx 20,19$. Đáp án 20.19 (chấp nhận 20,19)."}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Quy tắc Hund đề cập đến cách sắp xếp electron như thế nào?","options":["A. Thứ tự các mức năng lượng của các phân lớp.","B. Số electron tối đa trong một obitan.","C. Sự phân bố electron trong các obitan thuộc cùng một phân lớp.","D. Số lớp electron của nguyên tử."],"answer":"C","explain":"Quy tắc Hund: trong cùng một phân lớp, các electron phân bố sao cho số electron độc thân là tối đa."},{"type":"mcq","level":"NB","points":0.25,"q":"Nguyên tử oxi có số hiệu nguyên tử là 8. Số electron của nguyên tử oxi là","options":["A. 8","B. 16","C. 6","D. 10"],"answer":"A","explain":"Nguyên tử trung hòa có số electron bằng số hiệu nguyên tử: $e = Z = 8$."},{"type":"mcq","level":"NB","points":0.25,"q":"Trong kí hiệu nguyên tử $^{A}_{Z}X$, chữ A biểu thị","options":["A. số hiệu nguyên tử.","B. số khối.","C. số proton.","D. số electron."],"answer":"B","explain":"Trong kí hiệu $^{A}_{Z}X$, A (số ở trên) là số khối, Z (số ở dưới) là số hiệu nguyên tử."},{"type":"mcq","level":"TH","points":0.25,"q":"Tổng số hạt proton, neutron, electron trong nguyên tử $^{27}_{13}Al$ là","options":["A. 27","B. 40","C. 13","D. 14"],"answer":"B","explain":"Số $p = 13$, số $e = 13$, số $n = 27 - 13 = 14$. Tổng số hạt $= 13 + 14 + 13 = 40$."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron đúng của nguyên tử nhôm ($Z = 13$) là","options":["A. $1s^2 2s^2 2p^6 3s^2 3p^2$","B. $1s^2 2s^2 2p^6 3s^2 3p^1$","C. $1s^2 2s^2 2p^6 3s^1 3p^2$","D. $1s^2 2s^2 2p^6 4s^2 3p^1$"],"answer":"B","explain":"Al có 13 electron. Điền theo thứ tự mức năng lượng: $1s^2 2s^2 2p^6 3s^2 3p^1$."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tố M có hai đồng vị $^{24}M$ chiếm 80% và $^{26}M$ chiếm 20%. Nguyên tử khối trung bình của M là","options":["A. 24","B. 24,4","C. 25","D. 25,6"],"answer":"B","explain":"$\\bar{A}_{M} = \\frac{24 \\times 80 + 26 \\times 20}{100} = \\frac{2440}{100} = 24,4$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về ion:","statements":["a) Ion dương (cation) được tạo thành khi nguyên tử nhường electron.","b) Ion $Na^+$ có ít hơn nguyên tử Na 1 electron.","c) Ion âm (anion) có số electron nhiều hơn số proton.","d) Điện tích của ion bằng số proton trong ion đó."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. Anion nhận thêm electron nên số $e$ lớn hơn số $p$. d) Sai. Điện tích ion bằng hiệu số giữa số proton và số electron."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về ion $Cl^-$ ($Z = 17$):","statements":["a) Cấu hình electron của $Cl^-$ là $1s^2 2s^2 2p^6 3s^2 3p^6$.","b) Ion $Cl^-$ có cấu hình electron giống nguyên tử agon.","c) Ion $Cl^-$ có 3 lớp electron.","d) Ion $Cl^-$ có 17 electron."],"answer":["T","T","T","F"],"explain":"a) Đúng. Cl nhận thêm 1 electron vào phân lớp $3p$. b) Đúng. Cả hai đều có 18 electron. c) Đúng. Lớp ngoài cùng vẫn là $n = 3$. d) Sai. $Cl^-$ có $17 + 1 = 18$ electron."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử V có tổng số hạt proton, neutron, electron là 66; số hạt mang điện nhiều hơn số hạt không mang điện là 22. Tính số khối A của V.","answer":"44","explain":"Đặt $p$ là số proton. Ta có $2p + n = 66$ và $2p - n = 22$. Cộng vế với vế: $4p = 88$, suy ra $p = 22$. Số $n = 66 - 2 \\times 22 = 22$. Số khối $A = 22 + 22 = 44$."},{"type":"short","level":"VDC","points":0.5,"q":"Kali có hai đồng vị $^{39}K$ chiếm 93,3% và $^{41}K$ chiếm 6,7%. Tính nguyên tử khối trung bình của kali (làm tròn đến 2 chữ số thập phân).","answer":"39.13","explain":"$\\bar{A}_{K} = \\frac{39 \\times 93,3 + 41 \\times 6,7}{100} = \\frac{3913,4}{100} = 39,134 \\approx 39,13$. Đáp án 39.13 (chấp nhận 39,13)."}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Phát biểu nào sau đây SAI?","options":["A. Proton mang điện tích dương.","B. Neutron không mang điện.","C. Electron mang điện tích âm.","D. Hạt nhân nguyên tử mang điện tích âm."],"answer":"D","explain":"Hạt nhân gồm proton (điện tích dương) và neutron (không mang điện) nên hạt nhân mang điện tích dương."},{"type":"mcq","level":"NB","points":0.25,"q":"Nguyên tử của nguyên tố X có 12 proton. X là nguyên tố nào sau đây?","options":["A. Mg","B. Na","C. Al","D. Ne"],"answer":"A","explain":"Số hiệu nguyên tử $Z = 12$ là magie (Mg)."},{"type":"mcq","level":"NB","points":0.25,"q":"Số electron ở lớp ngoài cùng của nguyên tử clo ($Z = 17$) là","options":["A. 5","B. 7","C. 17","D. 2"],"answer":"B","explain":"Cấu hình electron của Cl: $1s^2 2s^2 2p^6 3s^2 3p^5$. Lớp ngoài cùng ($n = 3$) có $2 + 5 = 7$ electron."},{"type":"mcq","level":"TH","points":0.25,"q":"Ion $Mg^{2+}$ được tạo thành từ nguyên tử $^{24}_{12}Mg$. Cấu hình electron của ion $Mg^{2+}$ là","options":["A. $1s^2 2s^2 2p^6 3s^2$","B. $1s^2 2s^2 2p^6$","C. $1s^2 2s^2 2p^5$","D. $1s^2 2s^2 2p^6 3s^1$"],"answer":"B","explain":"Nguyên tử Mg: $1s^2 2s^2 2p^6 3s^2$. Ion $Mg^{2+}$ mất 2 electron ở lớp ngoài cùng ($3s$) nên còn $1s^2 2s^2 2p^6$."},{"type":"mcq","level":"TH","points":0.25,"q":"Cặp nguyên tử nào sau đây có cùng số neutron?","options":["A. $^{23}_{11}Na$ và $^{24}_{12}Mg$","B. $^{35}_{17}Cl$ và $^{37}_{17}Cl$","C. $^{14}_{7}N$ và $^{16}_{8}O$","D. $^{39}_{19}K$ và $^{40}_{18}Ar$"],"answer":"A","explain":"Số neutron: $^{23}_{11}Na$ có $23 - 11 = 12$; $^{24}_{12}Mg$ có $24 - 12 = 12$. Các cặp còn lại: 18 và 20; 7 và 8; 20 và 22."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử X có tổng số hạt là 40, số hạt mang điện nhiều hơn số hạt không mang điện là 12. Cấu hình electron của X là","options":["A. $1s^2 2s^2 2p^6 3s^2 3p^2$","B. $1s^2 2s^2 2p^6 3s^2 3p^1$","C. $1s^2 2s^2 2p^6 3s^1 3p^2$","D. $1s^2 2s^2 2p^6 4s^2 3p^1$"],"answer":"B","explain":"Đặt $p$ là số proton: $2p + n = 40$, $2p - n = 12$ nên $4p = 52$, suy ra $p = 13$ (nhôm). Cấu hình electron: $1s^2 2s^2 2p^6 3s^2 3p^1$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về nguyên tử khối:","statements":["a) Nguyên tử khối trung bình được tính bằng trung bình có trọng số theo tỉ lệ % số nguyên tử của các đồng vị.","b) Nguyên tử khối trung bình của clo xấp xỉ bằng 35,5.","c) Nguyên tử khối trung bình của một nguyên tố luôn là số nguyên.","d) Đơn vị của nguyên tử khối là amu (u)."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai. Nguyên tử khối trung bình thường là số thập phân, ví dụ của clo là 35,5. d) Đúng."},{"type":"truefalse","level":"VD","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về nguyên tử kẽm ($Z = 30$):","statements":["a) Nguyên tử Zn có 30 proton.","b) Nguyên tử $^{65}_{30}Zn$ có 35 neutron.","c) Cấu hình electron của Zn là $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2 3d^{10}$.","d) Nguyên tử Zn có 2 electron độc thân."],"answer":["T","T","T","F"],"explain":"a) Đúng. Số $p$ = $Z$ = 30. b) Đúng. Số $n = 65 - 30 = 35$. c) Đúng. Điền 30 electron theo thứ tự mức năng lượng. d) Sai. Phân lớp $3d^{10}$ đã đầy nên Zn không có electron độc thân."},{"type":"short","level":"VDC","points":0.5,"q":"Trong tự nhiên, đồng vị $^{65}Cu$ chiếm 27,2% số nguyên tử, còn lại là $^{63}Cu$. Tính nguyên tử khối trung bình của đồng (làm tròn đến 2 chữ số thập phân).","answer":"63.54","explain":"% của $^{63}Cu$ là $100 - 27,2 = 72,8$. $\\bar{A}_{Cu} = \\frac{65 \\times 27,2 + 63 \\times 72,8}{100} = \\frac{6354,4}{100} = 63,544 \\approx 63,54$. Đáp án 63.54 (chấp nhận 63,54)."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử W có tổng số hạt proton, neutron, electron là 48; số hạt mang điện nhiều hơn số hạt không mang điện là 16. Ion $W^{2+}$ có bao nhiêu electron?","answer":"14","explain":"Đặt $p$ là số proton của W. Ta có $2p + n = 48$ và $2p - n = 16$. Cộng vế với vế: $4p = 64$, suy ra $p = 16$. Nguyên tử W có 16 electron; ion $W^{2+}$ mất 2 electron nên còn $16 - 2 = 14$ electron."}]}]}
