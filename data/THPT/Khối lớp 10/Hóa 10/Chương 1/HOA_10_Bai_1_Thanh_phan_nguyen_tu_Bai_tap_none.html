<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Hạt nào sau đây mang điện tích dương trong nguyên tử?","options":["A. Electron","B. Neutron","C. Proton","D. Photon"],"answer":"C","explain":"Proton mang điện tích tương đối $+1$; neutron không mang điện; electron mang điện tích tương đối $-1$."},{"type":"mcq","level":"NB","points":0.25,"q":"Hạt nào sau đây KHÔNG mang điện?","options":["A. Proton","B. Neutron","C. Electron","D. Ion dương"],"answer":"B","explain":"Neutron có điện tích tương đối bằng $0$ nên không mang điện."},{"type":"mcq","level":"NB","points":0.25,"q":"Kí hiệu của electron là","options":["A. $p$","B. $n$","C. $e$","D. $u$"],"answer":"C","explain":"Electron kí hiệu là $e$; $p$ là proton, $n$ là neutron, $u$ là đơn vị khối lượng nguyên tử."},{"type":"mcq","level":"TH","points":0.25,"q":"Số đơn vị điện tích hạt nhân ($Z$) của một nguyên tử bằng","options":["A. số neutron trong hạt nhân","B. số proton trong hạt nhân","C. số khối của nguyên tử","D. tổng số hạt của nguyên tử"],"answer":"B","explain":"Số đơn vị điện tích hạt nhân $Z$ bằng số proton trong hạt nhân và bằng số electron của nguyên tử trung hòa điện."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử trung hòa về điện vì","options":["A. số proton bằng số neutron","B. số proton bằng số electron","C. số neutron bằng số electron","D. hạt nhân không mang điện"],"answer":"B","explain":"Trong nguyên tử trung hòa điện, số proton (điện tích dương) bằng số electron (điện tích âm) nên tổng điện tích bằng $0$."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử X có 12 proton và 12 neutron. Số khối ($A$) của X là","options":["A. 12","B. 24","C. 36","D. 6"],"answer":"B","explain":"Số khối $A$ bằng tổng số proton và neutron: $A = 12 + 12 = 24$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về các hạt cấu tạo nên nguyên tử:","statements":["a) Proton mang điện tích $+1$ và nằm trong hạt nhân.","b) Neutron không mang điện và nằm trong hạt nhân.","c) Electron mang điện tích $-1$ và chuyển động xung quanh hạt nhân.","d) Khối lượng của proton xấp xỉ bằng khối lượng của electron."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: khối lượng proton xấp xỉ $1u$, khối lượng electron chỉ xấp xỉ $0{,}00055u$."},{"type":"truefalse","level":"VD","points":1,"q":"Cho nguyên tử M có 13 proton và 14 neutron. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Số đơn vị điện tích hạt nhân $Z = 13$.","b) Số electron của M là 14.","c) Số khối $A = 27$.","d) Khối lượng nguyên tử M xấp xỉ $27u$."],"answer":["T","F","T","T"],"explain":"a) Đúng: $Z$ bằng số proton. b) Sai: nguyên tử trung hòa điện nên số electron bằng số proton, bằng 13. c) Đúng: $A = 13 + 14 = 27$. d) Đúng: khối lượng nguyên tử xấp xỉ bằng số khối."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử X có tổng số hạt là 46, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 14. Số proton của X là bao nhiêu?","answer":"15","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 46$ và $2p - n = 14$. Cộng hai phương trình: $4p = 60$, suy ra $p = 15$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử Y có tổng số hạt là 40, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 12. Số neutron của Y là bao nhiêu?","answer":"14","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 40$ và $2p - n = 12$. Trừ hai phương trình: $2n = 28$, suy ra $n = 14$."}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Hạt nhân nguyên tử được cấu tạo bởi","options":["A. proton và electron","B. proton và neutron","C. neutron và electron","D. chỉ các hạt proton"],"answer":"B","explain":"Hạt nhân nguyên tử gồm các hạt proton và neutron; electron chuyển động ở lớp vỏ."},{"type":"mcq","level":"NB","points":0.25,"q":"Đơn vị khối lượng nguyên tử là","options":["A. kilôgam","B. gam","C. u","D. mol"],"answer":"C","explain":"Trong hóa học, khối lượng nguyên tử được biểu diễn bằng đơn vị khối lượng nguyên tử, kí hiệu là $u$."},{"type":"mcq","level":"NB","points":0.25,"q":"Khối lượng của neutron xấp xỉ bằng","options":["A. $1u$","B. $0{,}00055u$","C. $2u$","D. $0u$"],"answer":"A","explain":"Khối lượng neutron xấp xỉ bằng khối lượng proton, khoảng $1u$."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử R có $Z = 11$. Số electron của R là","options":["A. 11","B. 12","C. 23","D. 10"],"answer":"A","explain":"Trong nguyên tử trung hòa điện, số electron bằng số đơn vị điện tích hạt nhân $Z$, bằng 11."},{"type":"mcq","level":"TH","points":0.25,"q":"Phát biểu nào sau đây đúng?","options":["A. Khối lượng electron xấp xỉ bằng khối lượng proton","B. Khối lượng nguyên tử tập trung chủ yếu ở lớp vỏ electron","C. Khối lượng nguyên tử tập trung chủ yếu ở hạt nhân","D. Neutron mang điện tích âm"],"answer":"C","explain":"Khối lượng electron rất nhỏ nên được bỏ qua; khối lượng nguyên tử tập trung chủ yếu ở hạt nhân."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử X có 20 proton và 20 neutron. Số electron và số khối của X lần lượt là","options":["A. 20 và 20","B. 20 và 40","C. 40 và 20","D. 10 và 40"],"answer":"B","explain":"Số electron bằng số proton, bằng 20; số khối $A = 20 + 20 = 40$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về kích thước nguyên tử:","statements":["a) Kích thước nguyên tử vào khoảng $10^{-10}$ m.","b) Kích thước hạt nhân vào khoảng $10^{-14}$ m.","c) Hạt nhân có kích thước lớn hơn nguyên tử.","d) Nguyên tử có cấu tạo đặc khít, không có khoảng trống."],"answer":["T","T","F","F"],"explain":"a) Đúng. b) Đúng. c) Sai: hạt nhân nhỏ hơn nguyên tử khoảng 10000 lần. d) Sai: nguyên tử rỗng là chính."},{"type":"truefalse","level":"VD","points":1,"q":"Cho nguyên tử Q có số khối là 31 và 15 proton. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Số neutron của Q là 16.","b) Số electron của Q là 16.","c) Tổng số hạt trong hạt nhân là 31.","d) Khối lượng nguyên tử Q xấp xỉ $16u$."],"answer":["T","F","T","F"],"explain":"a) Đúng: $n = A - Z = 31 - 15 = 16$. b) Sai: số electron bằng số proton, bằng 15. c) Đúng: tổng proton và neutron bằng số khối. d) Sai: khối lượng nguyên tử xấp xỉ $31u$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử A có tổng số hạt là 36, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 12. Số electron của A là bao nhiêu?","answer":"12","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 36$ và $2p - n = 12$. Cộng hai phương trình: $4p = 48$, suy ra $p = 12$; số electron bằng số proton, bằng 12."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử B có tổng số hạt là 52, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 16. Số neutron của B là bao nhiêu?","answer":"18","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 52$ và $2p - n = 16$. Trừ hai phương trình: $2n = 36$, suy ra $n = 18$."}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Hạt nào sau đây chuyển động xung quanh hạt nhân, tạo thành lớp vỏ nguyên tử?","options":["A. Proton","B. Neutron","C. Electron","D. Photon"],"answer":"C","explain":"Electron chuyển động xung quanh hạt nhân tạo thành lớp vỏ nguyên tử; proton và neutron nằm trong hạt nhân."},{"type":"mcq","level":"NB","points":0.25,"q":"Điện tích tương đối của neutron là","options":["A. $+1$","B. $-1$","C. $0$","D. $+2$"],"answer":"C","explain":"Neutron không mang điện nên điện tích tương đối của neutron bằng $0$."},{"type":"mcq","level":"NB","points":0.25,"q":"$1u$ bằng","options":["A. $1{,}6605 \\times 10^{-27}$ kg","B. $1{,}6605 \\times 10^{-24}$ kg","C. $9{,}11 \\times 10^{-31}$ kg","D. $1{,}6605 \\times 10^{-27}$ gam"],"answer":"A","explain":"$1u = 1{,}6605 \\times 10^{-27}$ kg."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử X có số khối $A = 23$ và $Z = 11$. Số neutron của X là","options":["A. 11","B. 12","C. 23","D. 34"],"answer":"B","explain":"Số neutron $n = A - Z = 23 - 11 = 12$."},{"type":"mcq","level":"TH","points":0.25,"q":"Khối lượng của một nguyên tử xấp xỉ bằng","options":["A. tổng khối lượng các electron","B. tổng khối lượng proton và neutron trong hạt nhân","C. khối lượng của neutron","D. khối lượng của proton"],"answer":"B","explain":"Khối lượng electron được bỏ qua nên khối lượng nguyên tử xấp xỉ bằng tổng khối lượng proton và neutron trong hạt nhân."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử cacbon-12 có khối lượng $12u$. Khối lượng tính bằng kilôgam của một nguyên tử cacbon-12 xấp xỉ","options":["A. $1{,}9926 \\times 10^{-26}$ kg","B. $1{,}6605 \\times 10^{-27}$ kg","C. $1{,}9926 \\times 10^{-23}$ kg","D. $7{,}2 \\times 10^{-26}$ kg"],"answer":"A","explain":"$12u = 12 \\times 1{,}6605 \\times 10^{-27} = 1{,}9926 \\times 10^{-26}$ kg."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về số đơn vị điện tích hạt nhân:","statements":["a) $Z$ là số đơn vị điện tích hạt nhân.","b) $Z$ bằng số proton trong hạt nhân.","c) Trong nguyên tử trung hòa điện, $Z$ bằng số electron.","d) $Z$ bằng tổng số proton và neutron."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: số electron bằng số proton. d) Sai: tổng số proton và neutron là số khối $A$."},{"type":"truefalse","level":"VD","points":1,"q":"Cho nguyên tử T có 8 proton, 8 neutron và 8 electron. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Số đơn vị điện tích hạt nhân $Z = 8$.","b) Số khối $A = 16$.","c) Tổng số hạt của nguyên tử là 24.","d) Số hạt mang điện là 24."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: $A = 8 + 8 = 16$. c) Đúng: $8 + 8 + 8 = 24$. d) Sai: số hạt mang điện là $8 + 8 = 16$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử C có tổng số hạt là 48, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 16. Số proton của C là bao nhiêu?","answer":"16","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 48$ và $2p - n = 16$. Cộng hai phương trình: $4p = 64$, suy ra $p = 16$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử D có tổng số hạt là 34, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 10. Số neutron của D là bao nhiêu?","answer":"12","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 34$ và $2p - n = 10$. Trừ hai phương trình: $2n = 24$, suy ra $n = 12$."}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Điện tích tương đối của proton là","options":["A. $-1$","B. $0$","C. $+1$","D. $+2$"],"answer":"C","explain":"Proton mang điện tích dương nên điện tích tương đối của proton là $+1$."},{"type":"mcq","level":"NB","points":0.25,"q":"Kích thước của nguyên tử vào khoảng","options":["A. $10^{-10}$ m","B. $10^{-14}$ m","C. $10^{-8}$ m","D. $10^{-15}$ m"],"answer":"A","explain":"Nguyên tử có kích thước vào khoảng $10^{-10}$ m; $10^{-14}$ m là kích thước của hạt nhân."},{"type":"mcq","level":"NB","points":0.25,"q":"Hạt nhân nguyên tử mang điện tích","options":["A. âm","B. dương","C. bằng 0","D. vừa âm vừa dương"],"answer":"B","explain":"Hạt nhân gồm proton (điện tích dương) và neutron (không mang điện) nên hạt nhân mang điện tích dương."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử M có 19 proton. Số đơn vị điện tích hạt nhân và số electron của M lần lượt là","options":["A. 19 và 19","B. 19 và 20","C. 20 và 19","D. 19 và 18"],"answer":"A","explain":"Số đơn vị điện tích hạt nhân $Z$ bằng số proton, bằng 19; số electron bằng số proton, bằng 19."},{"type":"mcq","level":"TH","points":0.25,"q":"So với khối lượng của proton, khối lượng của electron","options":["A. xấp xỉ bằng nhau","B. lớn hơn rất nhiều","C. nhỏ hơn rất nhiều nên thường được bỏ qua","D. gấp đôi"],"answer":"C","explain":"Khối lượng electron chỉ xấp xỉ $0{,}00055u$, rất nhỏ so với khối lượng proton (khoảng $1u$) nên thường được bỏ qua."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử X có 11 proton và 12 neutron. Khối lượng nguyên tử X xấp xỉ","options":["A. $11u$","B. $12u$","C. $23u$","D. $34u$"],"answer":"C","explain":"Khối lượng nguyên tử xấp xỉ bằng số khối: $A = 11 + 12 = 23$, tức khoảng $23u$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về electron:","statements":["a) Electron mang điện tích $-1$.","b) Khối lượng electron xấp xỉ $0{,}00055u$.","c) Electron nằm trong hạt nhân nguyên tử.","d) Số electron bằng số proton trong nguyên tử trung hòa điện."],"answer":["T","T","F","T"],"explain":"a) Đúng. b) Đúng. c) Sai: electron chuyển động ở lớp vỏ xung quanh hạt nhân. d) Đúng."},{"type":"truefalse","level":"VD","points":1,"q":"Cho nguyên tử G có $Z = 9$ và số khối $A = 19$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Số neutron của G là 10.","b) Số electron của G là 10.","c) Tổng số hạt của nguyên tử G là 28.","d) Số hạt mang điện của G là 19."],"answer":["T","F","T","F"],"explain":"a) Đúng: $n = A - Z = 19 - 9 = 10$. b) Sai: số electron bằng số proton, bằng 9. c) Đúng: $9 + 10 + 9 = 28$. d) Sai: số hạt mang điện là $9 + 9 = 18$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử E có tổng số hạt là 44, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 12. Số electron của E là bao nhiêu?","answer":"14","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 44$ và $2p - n = 12$. Cộng hai phương trình: $4p = 56$, suy ra $p = 14$; số electron bằng số proton, bằng 14."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử F có tổng số hạt là 58, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 18. Số neutron của F là bao nhiêu?","answer":"20","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 58$ và $2p - n = 18$. Trừ hai phương trình: $2n = 40$, suy ra $n = 20$."}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Trong nguyên tử, hạt mang điện tích âm là","options":["A. proton","B. neutron","C. electron","D. hạt nhân"],"answer":"C","explain":"Electron mang điện tích âm; proton mang điện tích dương; neutron không mang điện."},{"type":"mcq","level":"NB","points":0.25,"q":"Kí hiệu $p$ dùng để chỉ hạt","options":["A. proton","B. neutron","C. electron","D. photon"],"answer":"A","explain":"Proton kí hiệu là $p$; neutron kí hiệu là $n$; electron kí hiệu là $e$."},{"type":"mcq","level":"NB","points":0.25,"q":"Kích thước của hạt nhân nguyên tử vào khoảng","options":["A. $10^{-10}$ m","B. $10^{-14}$ m","C. $10^{-6}$ m","D. $10^{-9}$ m"],"answer":"B","explain":"Hạt nhân có kích thước vào khoảng $10^{-14}$ m, nhỏ hơn nguyên tử khoảng 10000 lần."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử natri có 11 proton, 12 neutron và 11 electron. Số khối của natri là","options":["A. 11","B. 12","C. 23","D. 34"],"answer":"C","explain":"Số khối $A$ bằng tổng số proton và neutron: $A = 11 + 12 = 23$."},{"type":"mcq","level":"TH","points":0.25,"q":"Vì sao khối lượng của electron thường được bỏ qua khi tính khối lượng nguyên tử?","options":["A. Vì electron không có khối lượng","B. Vì khối lượng electron rất nhỏ so với proton và neutron","C. Vì electron nằm ngoài hạt nhân","D. Vì electron không mang điện"],"answer":"B","explain":"Khối lượng electron chỉ xấp xỉ $0{,}00055u$, rất nhỏ so với proton và neutron (khoảng $1u$) nên được bỏ qua."},{"type":"mcq","level":"VD","points":0.25,"q":"Một nguyên tử có tổng số proton và neutron trong hạt nhân là 39. Khối lượng nguyên tử xấp xỉ","options":["A. $39u$","B. $19{,}5u$","C. $78u$","D. $0u$"],"answer":"A","explain":"Khối lượng nguyên tử xấp xỉ bằng số khối, tức tổng số proton và neutron: khoảng $39u$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về đơn vị khối lượng nguyên tử:","statements":["a) Đơn vị khối lượng nguyên tử kí hiệu là $u$.","b) $1u = 1{,}6605 \\times 10^{-27}$ kg.","c) $1u$ xấp xỉ bằng khối lượng của một proton.","d) Khối lượng nguyên tử thường được biểu diễn bằng đơn vị gam."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng: khối lượng proton xấp xỉ $1u$. d) Sai: khối lượng nguyên tử được biểu diễn bằng đơn vị $u$."},{"type":"truefalse","level":"VD","points":1,"q":"Cho nguyên tử H có tổng số hạt là 34, trong đó số hạt mang điện là 22. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Số hạt không mang điện là 12.","b) Số proton của H là 11.","c) Số neutron của H là 12.","d) Số khối $A = 22$."],"answer":["T","T","T","F"],"explain":"a) Đúng: $34 - 22 = 12$. b) Đúng: $p = 22 / 2 = 11$. c) Đúng. d) Sai: $A = 11 + 12 = 23$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử G có tổng số hạt là 28, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 8. Số proton của G là bao nhiêu?","answer":"9","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 28$ và $2p - n = 8$. Cộng hai phương trình: $4p = 36$, suy ra $p = 9$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử K có tổng số hạt là 38, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 14. Số neutron của K là bao nhiêu?","answer":"12","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 38$ và $2p - n = 14$. Trừ hai phương trình: $2n = 24$, suy ra $n = 12$."}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Hạt nào sau đây có khối lượng nhỏ nhất?","options":["A. Proton","B. Neutron","C. Electron","D. Hạt nhân"],"answer":"C","explain":"Khối lượng electron xấp xỉ $0{,}00055u$, nhỏ hơn rất nhiều so với proton và neutron (khoảng $1u$)."},{"type":"mcq","level":"NB","points":0.25,"q":"Kí hiệu $n$ dùng để chỉ hạt","options":["A. proton","B. neutron","C. electron","D. neutrino"],"answer":"B","explain":"Neutron kí hiệu là $n$; proton kí hiệu là $p$; electron kí hiệu là $e$."},{"type":"mcq","level":"NB","points":0.25,"q":"Nguyên tử có cấu tạo rỗng là chủ yếu vì","options":["A. hạt nhân rất nhỏ so với kích thước nguyên tử","B. electron rất nặng","C. proton có kích thước rất lớn","D. neutron lấp đầy nguyên tử"],"answer":"A","explain":"Hạt nhân chỉ vào khoảng $10^{-14}$ m, nhỏ hơn nguyên tử (khoảng $10^{-10}$ m) khoảng 10000 lần nên nguyên tử rỗng là chính."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử X có $Z = 17$ và số khối $A = 35$. Số neutron và số electron của X lần lượt là","options":["A. 17 và 18","B. 18 và 17","C. 35 và 17","D. 17 và 35"],"answer":"B","explain":"Số neutron $n = A - Z = 35 - 17 = 18$; số electron bằng số proton, bằng 17."},{"type":"mcq","level":"TH","points":0.25,"q":"Số hạt mang điện trong nguyên tử có 9 proton và 10 neutron là","options":["A. 9","B. 10","C. 18","D. 19"],"answer":"C","explain":"Số hạt mang điện gồm proton và electron: $9 + 9 = 18$ (số electron bằng số proton)."},{"type":"mcq","level":"VD","points":0.25,"q":"Khối lượng của một nguyên tử oxi (8 proton, 8 neutron) xấp xỉ","options":["A. $8u$","B. $16u$","C. $24u$","D. $0{,}00055u$"],"answer":"B","explain":"Khối lượng nguyên tử xấp xỉ bằng số khối: $A = 8 + 8 = 16$, tức khoảng $16u$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về nguyên tử trung hòa điện:","statements":["a) Nguyên tử trung hòa về điện.","b) Số proton luôn bằng số electron trong nguyên tử.","c) Tổng điện tích của nguyên tử bằng $0$.","d) Hạt nhân nguyên tử trung hòa về điện."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: hạt nhân mang điện tích dương do các proton."},{"type":"truefalse","level":"VD","points":1,"q":"Cho nguyên tử K có 12 proton và 12 neutron. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Số electron của K là 12.","b) Số đơn vị điện tích hạt nhân $Z = 24$.","c) Số khối $A = 24$.","d) Khối lượng nguyên tử K xấp xỉ $12u$."],"answer":["T","F","T","F"],"explain":"a) Đúng: số electron bằng số proton. b) Sai: $Z$ bằng số proton, bằng 12. c) Đúng: $A = 12 + 12 = 24$. d) Sai: khối lượng nguyên tử xấp xỉ $24u$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử L có tổng số hạt là 42, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 14. Số electron của L là bao nhiêu?","answer":"14","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 42$ và $2p - n = 14$. Cộng hai phương trình: $4p = 56$, suy ra $p = 14$; số electron bằng số proton, bằng 14."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử N có tổng số hạt là 24, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 8. Số neutron của N là bao nhiêu?","answer":"8","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 24$ và $2p - n = 8$. Trừ hai phương trình: $2n = 16$, suy ra $n = 8$."}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Phát biểu nào sau đây SAI?","options":["A. Proton mang điện tích dương","B. Neutron không mang điện","C. Electron mang điện tích âm","D. Proton nằm ở lớp vỏ nguyên tử"],"answer":"D","explain":"Proton nằm trong hạt nhân, không nằm ở lớp vỏ nguyên tử; electron mới chuyển động ở lớp vỏ."},{"type":"mcq","level":"NB","points":0.25,"q":"Điện tích tương đối của electron là","options":["A. $+1$","B. $0$","C. $-1$","D. $+2$"],"answer":"C","explain":"Electron mang điện tích âm nên điện tích tương đối của electron là $-1$."},{"type":"mcq","level":"NB","points":0.25,"q":"Khối lượng của proton xấp xỉ bằng","options":["A. $0{,}00055u$","B. $1u$","C. $2u$","D. $1836u$"],"answer":"B","explain":"Khối lượng proton xấp xỉ $1u$, gần bằng khối lượng neutron."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử nhôm có 13 proton và 14 neutron. Tổng số hạt trong nguyên tử nhôm là","options":["A. 27","B. 40","C. 41","D. 13"],"answer":"B","explain":"Tổng số hạt gồm proton, neutron và electron: $13 + 14 + 13 = 40$."},{"type":"mcq","level":"TH","points":0.25,"q":"Công thức tính số neutron khi biết số khối $A$ và số đơn vị điện tích hạt nhân $Z$ là","options":["A. $n = A + Z$","B. $n = A - Z$","C. $n = Z - A$","D. $n = A \\times Z$"],"answer":"B","explain":"Số khối $A$ bằng tổng số proton và neutron nên số neutron $n = A - Z$."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử X có khối lượng xấp xỉ $31u$ và 15 proton. Số neutron của X là","options":["A. 15","B. 16","C. 31","D. 46"],"answer":"B","explain":"Khối lượng nguyên tử xấp xỉ bằng số khối $A = 31$, suy ra số neutron $n = 31 - 15 = 16$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau khi so sánh proton và neutron:","statements":["a) Proton và neutron đều nằm trong hạt nhân.","b) Khối lượng proton xấp xỉ bằng khối lượng neutron.","c) Proton mang điện $+1$, neutron không mang điện.","d) Số proton bằng số neutron trong mọi nguyên tử."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng: cả hai đều xấp xỉ $1u$. c) Đúng. d) Sai: số neutron có thể khác số proton."},{"type":"truefalse","level":"VD","points":1,"q":"Cho nguyên tử V có $Z = 20$ và $A = 40$. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Số neutron của V là 20.","b) Số electron của V là 20.","c) Tổng số hạt của nguyên tử V là 60.","d) Số hạt mang điện của V là 60."],"answer":["T","T","T","F"],"explain":"a) Đúng: $n = 40 - 20 = 20$. b) Đúng: số electron bằng số proton, bằng 20. c) Đúng: $20 + 20 + 20 = 60$. d) Sai: số hạt mang điện là $20 + 20 = 40$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử P có tổng số hạt là 56, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 20. Số proton của P là bao nhiêu?","answer":"19","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 56$ và $2p - n = 20$. Cộng hai phương trình: $4p = 76$, suy ra $p = 19$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử R có số khối là 39 và tổng số hạt là 58. Số neutron của R là bao nhiêu?","answer":"20","explain":"Ta có $p + n = 39$ và $2p + n = 58$. Trừ hai phương trình: $p = 19$, suy ra $n = 39 - 19 = 20$."}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Lớp vỏ nguyên tử được tạo thành bởi","options":["A. proton","B. neutron","C. electron","D. hạt nhân"],"answer":"C","explain":"Lớp vỏ nguyên tử gồm các electron chuyển động xung quanh hạt nhân."},{"type":"mcq","level":"NB","points":0.25,"q":"Kí hiệu $Z$ biểu thị","options":["A. số khối","B. số neutron","C. số đơn vị điện tích hạt nhân","D. tổng số hạt"],"answer":"C","explain":"$Z$ là số đơn vị điện tích hạt nhân, bằng số proton trong hạt nhân."},{"type":"mcq","level":"NB","points":0.25,"q":"Nguyên tử heli có 2 proton, 2 neutron và 2 electron. Điện tích của hạt nhân heli là","options":["A. $0$","B. $+2$","C. $-2$","D. $+4$"],"answer":"B","explain":"Hạt nhân có 2 proton, mỗi proton mang điện tích $+1$ nên điện tích hạt nhân là $+2$."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử X có 16 proton. Số electron và điện tích hạt nhân của X lần lượt là","options":["A. 16 và $+16$","B. 16 và $-16$","C. 15 và $+16$","D. 16 và $0$"],"answer":"A","explain":"Số electron bằng số proton, bằng 16; hạt nhân có 16 proton nên mang điện tích $+16$."},{"type":"mcq","level":"TH","points":0.25,"q":"Một nguyên tử có khối lượng $23u$. Khối lượng tính bằng kilôgam của nguyên tử đó xấp xỉ","options":["A. $3{,}819 \\times 10^{-26}$ kg","B. $1{,}6605 \\times 10^{-27}$ kg","C. $3{,}819 \\times 10^{-23}$ kg","D. $23 \\times 10^{-27}$ kg"],"answer":"A","explain":"$23u = 23 \\times 1{,}6605 \\times 10^{-27} = 38{,}1915 \\times 10^{-27} = 3{,}819 \\times 10^{-26}$ kg."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử sắt có 26 proton và 30 neutron. Số khối và tổng số hạt của nguyên tử sắt lần lượt là","options":["A. 56 và 82","B. 56 và 56","C. 26 và 82","D. 30 và 56"],"answer":"A","explain":"Số khối $A = 26 + 30 = 56$; tổng số hạt $= 26 + 30 + 26 = 82$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về cấu tạo nguyên tử:","statements":["a) Nguyên tử gồm hạt nhân ở giữa và lớp vỏ electron xung quanh.","b) Hạt nhân chứa proton và neutron.","c) Electron chuyển động xung quanh hạt nhân.","d) Kích thước hạt nhân xấp xỉ bằng kích thước nguyên tử."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: hạt nhân nhỏ hơn nguyên tử khoảng 10000 lần."},{"type":"truefalse","level":"VD","points":1,"q":"Cho nguyên tử S có 7 proton và 7 neutron. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Số electron của S là 7.","b) Số khối $A = 14$.","c) Khối lượng nguyên tử S xấp xỉ $7u$.","d) Tổng số hạt mang điện là 14."],"answer":["T","T","F","T"],"explain":"a) Đúng: số electron bằng số proton. b) Đúng: $A = 7 + 7 = 14$. c) Sai: khối lượng nguyên tử xấp xỉ $14u$. d) Đúng: $7 + 7 = 14$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử U có tổng số hạt là 30, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 10. Số proton của U là bao nhiêu?","answer":"10","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 30$ và $2p - n = 10$. Cộng hai phương trình: $4p = 40$, suy ra $p = 10$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử W có tổng số hạt là 54, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 14. Số neutron của W là bao nhiêu?","answer":"20","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 54$ và $2p - n = 14$. Trừ hai phương trình: $2n = 40$, suy ra $n = 20$."}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Hạt nào sau đây quyết định điện tích của hạt nhân?","options":["A. Neutron","B. Electron","C. Proton","D. Photon"],"answer":"C","explain":"Điện tích hạt nhân do các proton quyết định; neutron không mang điện, electron ở lớp vỏ."},{"type":"mcq","level":"NB","points":0.25,"q":"Khối lượng nguyên tử tập trung chủ yếu ở","options":["A. lớp vỏ electron","B. hạt nhân","C. khoảng trống giữa các lớp electron","D. các proton"],"answer":"B","explain":"Khối lượng electron được bỏ qua nên khối lượng nguyên tử tập trung chủ yếu ở hạt nhân."},{"type":"mcq","level":"NB","points":0.25,"q":"Trong nguyên tử trung hòa điện, số proton","options":["A. luôn lớn hơn số electron","B. luôn bằng số electron","C. luôn nhỏ hơn số electron","D. luôn bằng số neutron"],"answer":"B","explain":"Nguyên tử trung hòa điện khi số proton (điện tích dương) bằng số electron (điện tích âm)."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử canxi có $Z = 20$ và 20 neutron. Số khối của canxi là","options":["A. 20","B. 40","C. 60","D. 10"],"answer":"B","explain":"Số khối $A$ bằng tổng số proton và neutron: $A = 20 + 20 = 40$."},{"type":"mcq","level":"TH","points":0.25,"q":"Phát biểu nào sau đây đúng về kích thước nguyên tử?","options":["A. Nguyên tử có kích thước khoảng $10^{-14}$ m","B. Hạt nhân có kích thước khoảng $10^{-10}$ m","C. Nguyên tử lớn hơn hạt nhân khoảng 10000 lần","D. Hạt nhân lớn hơn nguyên tử khoảng 10000 lần"],"answer":"C","explain":"Nguyên tử khoảng $10^{-10}$ m, hạt nhân khoảng $10^{-14}$ m nên nguyên tử lớn hơn hạt nhân khoảng 10000 lần."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử X có tổng số hạt là 46. Biết số hạt không mang điện là 16. Số proton của X là","options":["A. 15","B. 16","C. 30","D. 14"],"answer":"A","explain":"Số hạt mang điện là $46 - 16 = 30$, gồm proton và electron bằng nhau nên số proton là $30 / 2 = 15$."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau về điện tích các hạt:","statements":["a) Điện tích tương đối của proton là $+1$.","b) Điện tích tương đối của electron là $-1$.","c) Điện tích tương đối của neutron là $0$.","d) Tổng điện tích tương đối của một nguyên tử trung hòa điện khác $0$."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: tổng điện tích tương đối của nguyên tử trung hòa điện bằng $0$."},{"type":"truefalse","level":"VD","points":1,"q":"Cho nguyên tử Z có tổng số hạt là 40 và số hạt mang điện là 26. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Số hạt không mang điện là 14.","b) Số proton của Z là 13.","c) Số neutron của Z là 13.","d) Số khối $A = 27$."],"answer":["T","T","F","T"],"explain":"a) Đúng: $40 - 26 = 14$. b) Đúng: $p = 26 / 2 = 13$. c) Sai: số neutron là 14. d) Đúng: $A = 13 + 14 = 27$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử Y có tổng số hạt là 48, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 12. Số proton của Y là bao nhiêu?","answer":"15","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 48$ và $2p - n = 12$. Cộng hai phương trình: $4p = 60$, suy ra $p = 15$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử X có số hạt mang điện nhiều hơn số hạt không mang điện là 12 và có số khối là 27. Số proton của X là bao nhiêu?","answer":"13","explain":"Ta có $2p - n = 12$ và $p + n = 27$. Cộng hai phương trình: $3p = 39$, suy ra $p = 13$."}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Hạt electron được kí hiệu là","options":["A. $p$","B. $n$","C. $e$","D. $u$"],"answer":"C","explain":"Electron kí hiệu là $e$; $p$ là proton; $n$ là neutron."},{"type":"mcq","level":"NB","points":0.25,"q":"Khối lượng của electron xấp xỉ bằng","options":["A. $1u$","B. $0{,}00055u$","C. $2u$","D. $1836u$"],"answer":"B","explain":"Khối lượng electron xấp xỉ $0{,}00055u$, rất nhỏ so với proton và neutron."},{"type":"mcq","level":"NB","points":0.25,"q":"Thành phần nào sau đây KHÔNG thuộc cấu tạo nguyên tử?","options":["A. Proton","B. Neutron","C. Electron","D. Phân tử"],"answer":"D","explain":"Nguyên tử được cấu tạo từ proton, neutron và electron; phân tử được tạo thành từ các nguyên tử."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử magie có 12 proton và 12 neutron. Số electron và số đơn vị điện tích hạt nhân của magie lần lượt là","options":["A. 12 và 12","B. 24 và 12","C. 12 và 24","D. 10 và 12"],"answer":"A","explain":"Số electron bằng số proton, bằng 12; số đơn vị điện tích hạt nhân $Z$ bằng số proton, bằng 12."},{"type":"mcq","level":"TH","points":0.25,"q":"Một nguyên tử có $Z = 8$ và $A = 16$. Số neutron của nguyên tử đó là","options":["A. 8","B. 16","C. 24","D. 6"],"answer":"A","explain":"Số neutron $n = A - Z = 16 - 8 = 8$."},{"type":"mcq","level":"VD","points":0.25,"q":"Khối lượng tính bằng gam của một nguyên tử nitơ (7 proton, 7 neutron) xấp xỉ","options":["A. $2{,}3247 \\times 10^{-23}$ g","B. $1{,}6605 \\times 10^{-24}$ g","C. $2{,}3247 \\times 10^{-26}$ g","D. $14$ g"],"answer":"A","explain":"Khối lượng nguyên tử xấp xỉ $14u = 14 \\times 1{,}6605 \\times 10^{-27}$ kg $= 2{,}3247 \\times 10^{-26}$ kg $= 2{,}3247 \\times 10^{-23}$ g."},{"type":"truefalse","level":"TH","points":1,"q":"Xét tính đúng, sai của các khẳng định sau:","statements":["a) Hạt nhân nguyên tử mang điện tích dương.","b) Electron có khối lượng không đáng kể so với hạt nhân.","c) Số đơn vị điện tích hạt nhân đặc trưng cho một nguyên tố hóa học.","d) Các nguyên tử khác nhau có thể có cùng số proton."],"answer":["T","T","T","F"],"explain":"a) Đúng. b) Đúng. c) Đúng. d) Sai: số proton đặc trưng cho nguyên tố, các nguyên tố khác nhau có số proton khác nhau."},{"type":"truefalse","level":"VD","points":1,"q":"Cho nguyên tử D có 11 proton và 12 neutron. Xét tính đúng, sai của các khẳng định sau:","statements":["a) Số electron của D là 11.","b) Số đơn vị điện tích hạt nhân $Z = 12$.","c) Số khối $A = 23$.","d) Tổng số hạt của nguyên tử D là 34."],"answer":["T","F","T","T"],"explain":"a) Đúng: số electron bằng số proton. b) Sai: $Z$ bằng số proton, bằng 11. c) Đúng: $A = 11 + 12 = 23$. d) Đúng: $11 + 12 + 11 = 34$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử T có tổng số hạt là 60, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 20. Số proton của T là bao nhiêu?","answer":"20","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 60$ và $2p - n = 20$. Cộng hai phương trình: $4p = 80$, suy ra $p = 20$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử V có tổng số hạt là 32, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 12. Số neutron của V là bao nhiêu?","answer":"10","explain":"Gọi số proton là $p$, số neutron là $n$. Ta có $2p + n = 32$ và $2p - n = 12$. Trừ hai phương trình: $2n = 20$, suy ra $n = 10$."}]}]}
