{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Lớp electron ứng với số thứ tự n = 1 được kí hiệu là","options":["A. K","B. L","C. M","D. N"],"answer":"A","explain":"Các lớp electron được kí hiệu K, L, M, N, O, P, Q tương ứng với n = 1, 2, 3, 4, 5, 6, 7. Vậy n = 1 là lớp K."},{"type":"mcq","level":"NB","points":0.25,"q":"Lớp electron ứng với số thứ tự n = 3 được kí hiệu là","options":["A. K","B. L","C. M","D. N"],"answer":"C","explain":"n = 1: K; n = 2: L; n = 3: M; n = 4: N. Vậy n = 3 là lớp M."},{"type":"mcq","level":"NB","points":0.25,"q":"Lớp electron ứng với số thứ tự n = 4 được kí hiệu là","options":["A. L","B. M","C. K","D. N"],"answer":"D","explain":"n = 1: K; n = 2: L; n = 3: M; n = 4: N. Vậy n = 4 là lớp N."},{"type":"mcq","level":"TH","points":0.25,"q":"Phân lớp được điền electron ngay sau phân lớp 3p là","options":["A. 3d","B. 4s","C. 4p","D. 5s"],"answer":"B","explain":"Theo thứ tự mức năng lượng tăng dần: ... $3s$ $3p$ $4s$ $3d$ $4p$ .... Phân lớp 4s có mức năng lượng thấp hơn 3d nên được điền trước."},{"type":"mcq","level":"TH","points":0.25,"q":"Phân lớp được điền electron ngay sau phân lớp 4s là","options":["A. 3d","B. 4p","C. 5s","D. 3p"],"answer":"A","explain":"Theo thứ tự mức năng lượng tăng dần: ... $3p$ $4s$ $3d$ $4p$ .... Sau 4s là 3d."},{"type":"mcq","level":"VD","points":0.25,"q":"Cấu hình electron của nguyên tử calcium (Z = 20) là","options":["A. $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2$","B. $1s^2 2s^2 2p^6 3s^2 3p^6 3d^2$","C. $1s^2 2s^2 2p^6 3s^2 3p^6 4p^2$","D. $1s^2 2s^2 2p^6 3s^2 3p^6 4s^1 3d^1$"],"answer":"A","explain":"Điền theo thứ tự mức năng lượng: ... $3p$ $4s$ $3d$ .... Vì 4s có mức năng lượng thấp hơn 3d nên hai electron thứ 19 và 20 điền vào 4s."},{"type":"truefalse","level":"TH","points":1,"q":"Về lớp electron L, xét tính đúng, sai của các khẳng định sau:","statements":["a) Lớp L ứng với số thứ tự n = 2.","b) Lớp L gồm hai phân lớp 2s và 2p.","c) Lớp L chứa tối đa 8 electron.","d) Trong lớp L có phân lớp 2d."],"answer":["T","T","T","F"],"explain":"a) đúng: K(1), L(2), M(3), N(4). b) đúng: số phân lớp của lớp n bằng n, lớp L có 2s và 2p. c) đúng: $2n^2$ = 8 với n = 2. d) sai: lớp L chỉ có 2s và 2p."},{"type":"truefalse","level":"VD","points":1,"q":"Về nguyên tử K (Z = 19), xét tính đúng, sai của các khẳng định sau:","statements":["a) Cấu hình electron của K là $1s^2 2s^2 2p^6 3s^2 3p^6 4s^1$.","b) Electron cuối cùng điền vào phân lớp 4s thay vì 3d vì 4s có mức năng lượng thấp hơn 3d.","c) Lớp electron ngoài cùng của K có 1 electron.","d) Nguyên tử K có 4 lớp electron."],"answer":["T","T","T","T"],"explain":"a) đúng. b) đúng: đây chính là lí do 4s điền trước 3d. c) đúng: $4s^1$. d) đúng: phân lớp có n lớn nhất là 4."},{"type":"short","level":"VDC","points":0.5,"q":"Lớp N (n = 4) chứa tối đa bao nhiêu electron?","answer":"32","explain":"Số electron tối đa trên lớp thứ n là $2n^2$. Với n = 4: $2n^2$ = 32."},{"type":"short","level":"VDC","points":0.5,"q":"Lớp electron có số thứ tự n = 5 chứa tối đa bao nhiêu electron?","answer":"50","explain":"Số electron tối đa trên lớp thứ n là $2n^2$. Với n = 5: $2n^2$ = 50."}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Lớp electron thứ hai tính từ hạt nhân ra ngoài được kí hiệu là","options":["A. K","B. L","C. M","D. N"],"answer":"B","explain":"Lớp thứ nhất (n = 1) là K, lớp thứ hai (n = 2) là L."},{"type":"mcq","level":"NB","points":0.25,"q":"Lớp electron O ứng với giá trị n bằng","options":["A. 3","B. 4","C. 5","D. 6"],"answer":"C","explain":"Thứ tự các lớp: K(1), L(2), M(3), N(4), O(5), P(6), Q(7). Vậy lớp O ứng với n = 5."},{"type":"mcq","level":"NB","points":0.25,"q":"Lớp electron Q ứng với giá trị n bằng","options":["A. 5","B. 6","C. 7","D. 8"],"answer":"C","explain":"Thứ tự các lớp: K(1), L(2), M(3), N(4), O(5), P(6), Q(7). Vậy lớp Q ứng với n = 7."},{"type":"mcq","level":"TH","points":0.25,"q":"Phân lớp được điền electron ngay sau phân lớp 2s là","options":["A. 2p","B. 3s","C. 1s","D. 3p"],"answer":"A","explain":"Theo thứ tự mức năng lượng tăng dần: $1s$ $2s$ $2p$ $3s$ .... Sau 2s là 2p."},{"type":"mcq","level":"TH","points":0.25,"q":"Dãy phân lớp nào sau đây được sắp xếp đúng theo chiều mức năng lượng tăng dần?","options":["A. $1s$ $2s$ $2p$ $3s$ $3p$ $4s$ $3d$ $4p$","B. $1s$ $2s$ $2p$ $3s$ $3d$ $3p$ $4s$ $4p$","C. $1s$ $2p$ $2s$ $3s$ $3p$ $3d$ $4s$ $4p$","D. $1s$ $2s$ $2p$ $3p$ $3s$ $4s$ $4p$ $3d$"],"answer":"A","explain":"Thứ tự đúng: $1s$ $2s$ $2p$ $3s$ $3p$ $4s$ $3d$ $4p$ .... Chú ý 4s đứng trước 3d."},{"type":"mcq","level":"VD","points":0.25,"q":"Cấu hình electron của nguyên tử potassium (Z = 19) là","options":["A. $1s^2 2s^2 2p^6 3s^2 3p^6 3d^1$","B. $1s^2 2s^2 2p^6 3s^2 3p^6 4s^1$","C. $1s^2 2s^2 2p^6 3s^2 3p^6 4p^1$","D. $1s^2 2s^2 2p^6 3s^2 3p^5 4s^2$"],"answer":"B","explain":"Electron thứ 19 điền vào 4s vì 4s có mức năng lượng thấp hơn 3d, không điền vào 3d."},{"type":"truefalse","level":"TH","points":1,"q":"Về phân lớp p, xét tính đúng, sai của các khẳng định sau:","statements":["a) Phân lớp p có 3 obitan nguyên tử.","b) Phân lớp p chứa tối đa 6 electron.","c) Trong lớp K có phân lớp 2p.","d) Phân lớp 3p được điền electron trước phân lớp 4s."],"answer":["T","T","F","T"],"explain":"a) đúng. b) đúng: 3 AO × 2e = 6e. c) sai: lớp K (n = 1) chỉ có phân lớp 1s; phân lớp 2p thuộc lớp L. d) đúng: thứ tự ... $3s$ $3p$ $4s$ $3d$ ...."},{"type":"truefalse","level":"VD","points":1,"q":"Về ion $Ca^{2+}$, xét tính đúng, sai của các khẳng định sau:","statements":["a) Nguyên tử Ca có Z = 20.","b) Ion $Ca^{2+}$ có 18 electron.","c) Cấu hình electron của $Ca^{2+}$ là $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2$.","d) Ion $Ca^{2+}$ có cấu hình electron giống nguyên tử Ar."],"answer":["T","T","F","T"],"explain":"a) đúng. b) đúng: 20 − 2 = 18. c) sai: Ca nhường 2e ở phân lớp 4s nên cấu hình đúng là $1s^2 2s^2 2p^6 3s^2 3p^6$. d) đúng: Ar (Z = 18) cũng có cấu hình $1s^2 2s^2 2p^6 3s^2 3p^6$."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử aluminium (Z = 13) có bao nhiêu electron ở lớp ngoài cùng?","answer":"3","explain":"Cấu hình của Al là $1s^2 2s^2 2p^6 3s^2 3p^1$. Lớp ngoài cùng (n = 3) có 2 + 1 = 3 electron."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử chlorine (Z = 17) có bao nhiêu electron ở lớp ngoài cùng?","answer":"7","explain":"Cấu hình của Cl là $1s^2 2s^2 2p^6 3s^2 3p^5$. Lớp ngoài cùng (n = 3) có 2 + 5 = 7 electron."}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Số electron tối đa trên lớp K (n = 1) là","options":["A. 2","B. 4","C. 8","D. 18"],"answer":"A","explain":"Số electron tối đa trên lớp thứ n là $2n^2$. Với n = 1: $2n^2$ = 2."},{"type":"mcq","level":"NB","points":0.25,"q":"Số electron tối đa trên lớp L (n = 2) là","options":["A. 2","B. 8","C. 18","D. 32"],"answer":"B","explain":"Số electron tối đa trên lớp thứ n là $2n^2$. Với n = 2: $2n^2$ = 8."},{"type":"mcq","level":"NB","points":0.25,"q":"Số electron tối đa trên lớp M (n = 3) là","options":["A. 8","B. 16","C. 18","D. 32"],"answer":"C","explain":"Số electron tối đa trên lớp thứ n là $2n^2$. Với n = 3: $2n^2$ = 18."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron của nguyên tử oxygen (Z = 8) là","options":["A. $1s^2 2s^2 2p^6$","B. $1s^2 2s^2 2p^4$","C. $1s^2 2s^2 2p^2$","D. $1s^2 2p^6$"],"answer":"B","explain":"Điền 8 electron theo thứ tự $1s$ $2s$ $2p$: $1s^2 2s^2 2p^4$."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron của nguyên tử sodium (Z = 11) là","options":["A. $1s^2 2s^2 2p^6 3s^2$","B. $1s^2 2s^2 2p^6 3s^1$","C. $1s^2 2s^2 2p^6 2s^1$","D. $1s^2 2s^2 2p^5 3s^2$"],"answer":"B","explain":"Điền 11 electron: $1s^2 2s^2 2p^6$ hết 10e, electron thứ 11 vào phân lớp $3s^1$."},{"type":"mcq","level":"VD","points":0.25,"q":"Cấu hình electron của ion $Na^+$ là","options":["A. $1s^2 2s^2 2p^6 3s^1$","B. $1s^2 2s^2 2p^6$","C. $1s^2 2s^2 2p^5$","D. $1s^2 2s^2 2p^6 3s^2$"],"answer":"B","explain":"Na (Z = 11) có cấu hình $1s^2 2s^2 2p^6 3s^1$. Khi tạo ion $Na^+$, nguyên tử Na nhường 1 electron ở lớp ngoài cùng (3s) nên còn 10 electron: $1s^2 2s^2 2p^6$."},{"type":"truefalse","level":"TH","points":1,"q":"Về nguyên tử Na (Z = 11), xét tính đúng, sai của các khẳng định sau:","statements":["a) Cấu hình electron của Na là $1s^2 2s^2 2p^6 3s^1$.","b) Nguyên tử Na có 3 lớp electron.","c) Lớp electron ngoài cùng của Na có 1 electron.","d) Nguyên tử Na có tổng cộng 12 electron."],"answer":["T","T","T","F"],"explain":"a) đúng. b) đúng: phân lớp có n lớn nhất là 3. c) đúng: $3s^1$. d) sai: Z = 11 nên có 11 electron."},{"type":"truefalse","level":"VD","points":1,"q":"Về các ion $Na^+$ và $Cl^-$, xét tính đúng, sai của các khẳng định sau:","statements":["a) Ion $Na^+$ có 10 electron.","b) Cấu hình electron của $Na^+$ là $1s^2 2s^2 2p^6$.","c) Ion $Cl^-$ có 18 electron.","d) Cấu hình electron của $Cl^-$ là $1s^2 2s^2 2p^6 3s^2 3p^5$."],"answer":["T","T","T","F"],"explain":"a) đúng: 11 − 1 = 10. b) đúng: Na nhường 1e ở $3s^1$. c) đúng: 17 + 1 = 18. d) sai: Cl nhận thêm 1e nên $3p^5$ thành $3p^6$, cấu hình đúng là $1s^2 2s^2 2p^6 3s^2 3p^6$."},{"type":"short","level":"VDC","points":0.5,"q":"Phân lớp 4f có bao nhiêu obitan nguyên tử?","answer":"7","explain":"Mọi phân lớp f đều có 7 obitan nguyên tử, phân lớp 4f cũng vậy."},{"type":"short","level":"VDC","points":0.5,"q":"Phân lớp 4f chứa tối đa bao nhiêu electron?","answer":"14","explain":"Phân lớp f có 7 AO nên chứa tối đa 7 × 2 = 14 electron."}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Số electron tối đa trên lớp N (n = 4) là","options":["A. 18","B. 24","C. 32","D. 36"],"answer":"C","explain":"Số electron tối đa trên lớp thứ n là $2n^2$. Với n = 4: $2n^2$ = 32."},{"type":"mcq","level":"NB","points":0.25,"q":"Phân lớp s có bao nhiêu obitan nguyên tử (AO)?","options":["A. 1","B. 3","C. 5","D. 7"],"answer":"A","explain":"Phân lớp s có 1 AO; phân lớp p có 3 AO; phân lớp d có 5 AO; phân lớp f có 7 AO."},{"type":"mcq","level":"NB","points":0.25,"q":"Phân lớp p có bao nhiêu obitan nguyên tử (AO)?","options":["A. 1","B. 3","C. 5","D. 7"],"answer":"B","explain":"Phân lớp s có 1 AO; phân lớp p có 3 AO; phân lớp d có 5 AO; phân lớp f có 7 AO."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron của nguyên tử magnesium (Z = 12) là","options":["A. $1s^2 2s^2 2p^6 3s^1$","B. $1s^2 2s^2 2p^6 3p^2$","C. $1s^2 2s^2 2p^6 3s^2$","D. $1s^2 2s^2 2p^4 3s^2$"],"answer":"C","explain":"Điền 12 electron: $1s^2 2s^2 2p^6$ hết 10e, 2 electron còn lại vào $3s^2$."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron của nguyên tử carbon (Z = 6) là","options":["A. $1s^2 2s^2 2p^2$","B. $1s^2 2p^4$","C. $1s^2 2s^4$","D. $1s^2 2s^2 2p^6$"],"answer":"A","explain":"Điền 6 electron theo thứ tự $1s$ $2s$ $2p$: $1s^2 2s^2 2p^2$."},{"type":"mcq","level":"VD","points":0.25,"q":"Cấu hình electron của ion $Cl^-$ là","options":["A. $1s^2 2s^2 2p^6 3s^2 3p^5$","B. $1s^2 2s^2 2p^6 3s^2 3p^6$","C. $1s^2 2s^2 2p^6 3s^2 3p^4$","D. $1s^2 2s^2 2p^6 3s^1 3p^6$"],"answer":"B","explain":"Cl (Z = 17) nhận thêm 1 electron vào lớp ngoài cùng để đạt 8 electron bền vững: $1s^2 2s^2 2p^6 3s^2 3p^6$ (18 electron)."},{"type":"truefalse","level":"TH","points":1,"q":"Về thứ tự mức năng lượng của các phân lớp, xét tính đúng, sai của các khẳng định sau:","statements":["a) Phân lớp 4s có mức năng lượng thấp hơn phân lớp 3d.","b) Phân lớp 2p được điền electron sau phân lớp 3s.","c) Phân lớp 3s được điền electron ngay sau phân lớp 2p.","d) Phân lớp 1s có mức năng lượng thấp nhất."],"answer":["T","F","T","T"],"explain":"a) đúng nên 4s điền trước 3d. b) sai: thứ tự là $2s$ $2p$ $3s$, 2p điền trước 3s. c) đúng. d) đúng: 1s đứng đầu dãy."},{"type":"truefalse","level":"VD","points":1,"q":"Cho cấu hình $1s^2 2s^2 2p^6 3s^2 3p^6 3d^1$ của nguyên tử K (Z = 19). Xét tính đúng, sai của các khẳng định sau:","statements":["a) Tổng số electron trong cấu hình trên là 19.","b) Cấu hình trên được viết đúng theo thứ tự mức năng lượng.","c) Electron cuối cùng phải được điền vào phân lớp 4s thay vì 3d.","d) Phân lớp 3d có mức năng lượng cao hơn phân lớp 4s."],"answer":["T","F","T","T"],"explain":"a) đúng: 2+2+6+2+6+1 = 19. b) sai: 3d đứng trước 4s là sai thứ tự. c) đúng: cấu hình đúng của K là $1s^2 2s^2 2p^6 3s^2 3p^6 4s^1$. d) đúng."},{"type":"short","level":"VDC","points":0.5,"q":"Lớp M (n = 3) có tất cả bao nhiêu obitan nguyên tử?","answer":"9","explain":"Lớp M gồm 3s (1 AO) + 3p (3 AO) + 3d (5 AO) = 9 AO."},{"type":"short","level":"VDC","points":0.5,"q":"Một lớp electron gồm 4 phân lớp s, p, d, f chứa tối đa bao nhiêu electron?","answer":"32","explain":"Tổng số electron tối đa = 2 + 6 + 10 + 14 = 32 (cũng chính là $2n^2$ với n = 4)."}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Phân lớp d có bao nhiêu obitan nguyên tử (AO)?","options":["A. 1","B. 3","C. 5","D. 7"],"answer":"C","explain":"Phân lớp s có 1 AO; phân lớp p có 3 AO; phân lớp d có 5 AO; phân lớp f có 7 AO."},{"type":"mcq","level":"NB","points":0.25,"q":"Phân lớp f có bao nhiêu obitan nguyên tử (AO)?","options":["A. 1","B. 3","C. 5","D. 7"],"answer":"D","explain":"Phân lớp s có 1 AO; phân lớp p có 3 AO; phân lớp d có 5 AO; phân lớp f có 7 AO."},{"type":"mcq","level":"NB","points":0.25,"q":"Số electron tối đa trong phân lớp s là","options":["A. 2","B. 6","C. 10","D. 14"],"answer":"A","explain":"Phân lớp s có 1 AO, mỗi AO chứa tối đa 2 electron nên phân lớp s chứa tối đa 2 electron."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron của nguyên tử fluorine (Z = 9) là","options":["A. $1s^2 2s^2 2p^3$","B. $1s^2 2s^2 2p^6$","C. $1s^2 2s^2 2p^5$","D. $1s^2 2s^1 2p^6$"],"answer":"C","explain":"Điền 9 electron: $1s^2 2s^2$ hết 4e, 5 electron còn lại vào $2p^5$."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron của nguyên tử silicon (Z = 14) là","options":["A. $1s^2 2s^2 2p^6 3s^2 3p^2$","B. $1s^2 2s^2 2p^6 3s^2 3p^4$","C. $1s^2 2s^2 2p^6 3p^4$","D. $1s^2 2s^2 2p^6 3s^2 3d^2$"],"answer":"A","explain":"Điền 14 electron: $1s^2 2s^2 2p^6 3s^2$ hết 12e, 2 electron còn lại vào $3p^2$."},{"type":"mcq","level":"VD","points":0.25,"q":"Cấu hình electron của ion $Ca^{2+}$ là","options":["A. $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2$","B. $1s^2 2s^2 2p^6 3s^2 3p^6$","C. $1s^2 2s^2 2p^6 3s^2 3p^4$","D. $1s^2 2s^2 2p^6 3s^2 3p^6 3d^2$"],"answer":"B","explain":"Ca (Z = 20): $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2$. Khi tạo ion $Ca^{2+}$, nguyên tử Ca nhường 2 electron ở phân lớp ngoài cùng 4s."},{"type":"truefalse","level":"TH","points":1,"q":"Về lớp electron M, xét tính đúng, sai của các khẳng định sau:","statements":["a) Lớp M ứng với số thứ tự n = 3.","b) Lớp M gồm ba phân lớp 3s, 3p và 3d.","c) Lớp M chứa tối đa 18 electron.","d) Lớp M chứa tối đa 8 electron."],"answer":["T","T","T","F"],"explain":"a) đúng: K(1), L(2), M(3). b) đúng: số phân lớp bằng n = 3. c) đúng: $2n^2$ = 18 với n = 3. d) sai: 8 là số electron tối đa của lớp L."},{"type":"truefalse","level":"VD","points":1,"q":"Về nguyên tử Sc (Z = 21), xét tính đúng, sai của các khẳng định sau:","statements":["a) Cấu hình electron của Sc là $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2 3d^1$.","b) Lớp electron ngoài cùng (n = 4) của Sc có 2 electron.","c) Phân lớp 3d được điền electron sau phân lớp 4s.","d) Nguyên tử Sc có 3 lớp electron."],"answer":["T","T","T","F"],"explain":"a) đúng: điền 21e theo thứ tự ... $4s$ $3d$. b) đúng: $4s^2$. c) đúng. d) sai: phân lớp có n lớn nhất là 4 nên Sc có 4 lớp."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử X có cấu hình electron $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2 3d^2$. Điện tích hạt nhân Z của X bằng bao nhiêu?","answer":"22","explain":"Tổng số electron = 2 + 2 + 6 + 2 + 6 + 2 + 2 = 22 nên Z = 22."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử calcium (Z = 20) có bao nhiêu electron ở lớp ngoài cùng?","answer":"2","explain":"Cấu hình của Ca là $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2$. Lớp ngoài cùng (n = 4) là $4s^2$ có 2 electron."}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Số electron tối đa trong phân lớp p là","options":["A. 2","B. 6","C. 10","D. 14"],"answer":"B","explain":"Phân lớp p có 3 AO nên chứa tối đa 3 × 2 = 6 electron."},{"type":"mcq","level":"NB","points":0.25,"q":"Số electron tối đa trong phân lớp d là","options":["A. 2","B. 6","C. 10","D. 14"],"answer":"C","explain":"Phân lớp d có 5 AO nên chứa tối đa 5 × 2 = 10 electron."},{"type":"mcq","level":"NB","points":0.25,"q":"Số electron tối đa trong phân lớp f là","options":["A. 2","B. 6","C. 10","D. 14"],"answer":"D","explain":"Phân lớp f có 7 AO nên chứa tối đa 7 × 2 = 14 electron."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron của nguyên tử sulfur (Z = 16) là","options":["A. $1s^2 2s^2 2p^6 3s^2 3p^6$","B. $1s^2 2s^2 2p^6 3s^2 3p^4$","C. $1s^2 2s^2 2p^6 3s^2 3d^4$","D. $1s^2 2s^2 2p^6 3p^6$"],"answer":"B","explain":"Điền 16 electron: $1s^2 2s^2 2p^6 3s^2$ hết 12e, 4 electron còn lại vào $3p^4$."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron của nguyên tử boron (Z = 5) là","options":["A. $1s^2 2s^2 2p^1$","B. $1s^2 2s^3$","C. $1s^2 2p^3$","D. $1s^2 2s^2 2p^3$"],"answer":"A","explain":"Điền 5 electron: $1s^2 2s^2$ hết 4e, electron thứ 5 vào $2p^1$. Phân lớp s chỉ chứa tối đa 2e nên B sai."},{"type":"mcq","level":"VD","points":0.25,"q":"Cấu hình electron của ion $Mg^{2+}$ là","options":["A. $1s^2 2s^2 2p^6 3s^2$","B. $1s^2 2s^2 2p^4$","C. $1s^2 2s^2 2p^6$","D. $1s^2 2s^2 2p^6 3s^1$"],"answer":"C","explain":"Mg (Z = 12): $1s^2 2s^2 2p^6 3s^2$. Nhường 2 electron ở lớp ngoài cùng tạo $Mg^{2+}$ còn 10 electron: $1s^2 2s^2 2p^6$."},{"type":"truefalse","level":"TH","points":1,"q":"Về obitan nguyên tử (AO), xét tính đúng, sai của các khẳng định sau:","statements":["a) Mỗi obitan nguyên tử chứa tối đa 2 electron.","b) Phân lớp s có 1 obitan nguyên tử.","c) Phân lớp d có 7 obitan nguyên tử.","d) Phân lớp f có 7 obitan nguyên tử."],"answer":["T","T","F","T"],"explain":"a) đúng. b) đúng. c) sai: phân lớp d có 5 AO. d) đúng: phân lớp f có 7 AO."},{"type":"truefalse","level":"VD","points":1,"q":"Về nguyên tử S (Z = 16), xét tính đúng, sai của các khẳng định sau:","statements":["a) Cấu hình electron của S là $1s^2 2s^2 2p^6 3s^2 3p^4$.","b) Lớp electron ngoài cùng của S có 6 electron.","c) Nguyên tử S có 3 lớp electron.","d) S là khí hiếm."],"answer":["T","T","T","F"],"explain":"a) đúng. b) đúng: $3s^2 3p^4$ có 6e. c) đúng. d) sai: S có 6e lớp ngoài cùng, là phi kim; khí hiếm phải có 8e lớp ngoài cùng."},{"type":"short","level":"VDC","points":0.5,"q":"Ion $Al^{3+}$ có bao nhiêu electron?","answer":"10","explain":"Al có Z = 13. Khi tạo ion $Al^{3+}$, nguyên tử Al nhường 3 electron nên còn 13 − 3 = 10 electron."},{"type":"short","level":"VDC","points":0.5,"q":"Ion $S^{2-}$ có bao nhiêu electron?","answer":"18","explain":"S có Z = 16. Khi tạo ion $S^{2-}$, nguyên tử S nhận thêm 2 electron nên có 16 + 2 = 18 electron."}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Lớp K (n = 1) có bao nhiêu phân lớp?","options":["A. 1","B. 2","C. 3","D. 4"],"answer":"A","explain":"Số phân lớp trong lớp thứ n bằng n. Lớp K có n = 1 nên chỉ có 1 phân lớp là 1s."},{"type":"mcq","level":"NB","points":0.25,"q":"Lớp M (n = 3) có bao nhiêu phân lớp?","options":["A. 1","B. 2","C. 3","D. 4"],"answer":"C","explain":"Lớp M có n = 3 nên có 3 phân lớp: 3s, 3p, 3d."},{"type":"mcq","level":"NB","points":0.25,"q":"Lớp N (n = 4) có bao nhiêu phân lớp?","options":["A. 2","B. 3","C. 4","D. 5"],"answer":"C","explain":"Lớp N có n = 4 nên có 4 phân lớp: 4s, 4p, 4d, 4f."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron của nguyên tử nitrogen (Z = 7) là","options":["A. $1s^2 2s^2 2p^5$","B. $1s^2 2s^2 2p^3$","C. $1s^2 2s^1 2p^4$","D. $1s^2 2s^2 2p^1$"],"answer":"B","explain":"Điền 7 electron: $1s^2 2s^2$ hết 4e, 3 electron còn lại vào $2p^3$."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron của nguyên tử aluminium (Z = 13) là","options":["A. $1s^2 2s^2 2p^6 3s^2 3p^1$","B. $1s^2 2s^2 2p^6 3s^2 3p^3$","C. $1s^2 2s^2 2p^6 3p^3$","D. $1s^2 2s^2 2p^6 3s^1 3p^2$"],"answer":"A","explain":"Điền 13 electron: $1s^2 2s^2 2p^6 3s^2$ hết 12e, electron thứ 13 vào $3p^1$."},{"type":"mcq","level":"VD","points":0.25,"q":"Cấu hình electron của ion $O^{2-}$ là","options":["A. $1s^2 2s^2 2p^4$","B. $1s^2 2s^2 2p^5$","C. $1s^2 2s^2 2p^6$","D. $1s^2 2s^2 2p^6 3s^2$"],"answer":"C","explain":"O (Z = 8): $1s^2 2s^2 2p^4$. Nhận thêm 2 electron vào lớp ngoài cùng để đạt 8 electron bền vững."},{"type":"truefalse","level":"TH","points":1,"q":"Về nguyên tử Mg (Z = 12), xét tính đúng, sai của các khẳng định sau:","statements":["a) Cấu hình electron của Mg là $1s^2 2s^2 2p^6 3s^2$.","b) Lớp electron ngoài cùng của Mg có 2 electron.","c) Nguyên tử Mg có 2 lớp electron.","d) Phân lớp 3p của nguyên tử Mg đã chứa electron."],"answer":["T","T","F","F"],"explain":"a) đúng. b) đúng: $3s^2$. c) sai: phân lớp có n lớn nhất là 3 nên Mg có 3 lớp. d) sai: 12 electron vừa đủ điền đầy $3s^2$, chưa tới 3p."},{"type":"truefalse","level":"VD","points":1,"q":"Về nguyên tử Zn (Z = 30), xét tính đúng, sai của các khẳng định sau:","statements":["a) Cấu hình electron của Zn là $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2 3d^{10}$.","b) Phân lớp 3d của Zn chứa 10 electron.","c) Lớp electron ngoài cùng của Zn có 2 electron.","d) Phân lớp 4p được điền electron trước phân lớp 3d."],"answer":["T","T","T","F"],"explain":"a) đúng: điền 30e theo thứ tự ... $4s$ $3d$ $4p$. b) đúng: 3d đã bão hòa 10e. c) đúng: $4s^2$. d) sai: 3d điền trước 4p."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử X có cấu hình electron lớp ngoài cùng là $3s^2 3p^5$. Điện tích hạt nhân Z của X bằng bao nhiêu?","answer":"17","explain":"Các lớp trong đã đầy: $1s^2 2s^2 2p^6$ (10e). Tổng Z = 10 + 2 + 5 = 17 (đó là Cl)."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử silicon (Z = 14) có bao nhiêu electron ở lớp thứ hai (lớp L)?","answer":"8","explain":"Cấu hình của Si là $1s^2 2s^2 2p^6 3s^2 3p^2$. Lớp L gồm $2s^2 2p^6$ có 2 + 6 = 8 electron."}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Các electron trong nguyên tử được sắp xếp vào các lớp theo chiều","options":["A. từ ngoài vào trong, theo chiều mức năng lượng giảm dần","B. từ trong ra ngoài, theo chiều mức năng lượng tăng dần","C. ngẫu nhiên, không theo quy luật nào","D. từ trong ra ngoài, theo chiều mức năng lượng giảm dần"],"answer":"B","explain":"Các electron được sắp xếp từ lớp trong (gần hạt nhân) ra lớp ngoài theo chiều mức năng lượng tăng dần."},{"type":"mcq","level":"NB","points":0.25,"q":"Phân lớp nào chứa tối đa 6 electron?","options":["A. s","B. p","C. d","D. f"],"answer":"B","explain":"Phân lớp s chứa tối đa 2e; p chứa tối đa 6e; d chứa tối đa 10e; f chứa tối đa 14e."},{"type":"mcq","level":"NB","points":0.25,"q":"Phân lớp nào chứa tối đa 10 electron?","options":["A. s","B. p","C. d","D. f"],"answer":"C","explain":"Phân lớp s chứa tối đa 2e; p chứa tối đa 6e; d chứa tối đa 10e; f chứa tối đa 14e."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron của nguyên tử phosphorus (Z = 15) là","options":["A. $1s^2 2s^2 2p^6 3s^2 3p^5$","B. $1s^2 2s^2 2p^6 3s^2 3p^1$","C. $1s^2 2s^2 2p^6 3s^2 3p^3$","D. $1s^2 2s^2 2p^6 3s^1 3p^4$"],"answer":"C","explain":"Điền 15 electron: $1s^2 2s^2 2p^6 3s^2$ hết 12e, 3 electron còn lại vào $3p^3$."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron của nguyên tử chlorine (Z = 17) là","options":["A. $1s^2 2s^2 2p^6 3s^2 3p^7$","B. $1s^2 2s^2 2p^6 3s^2 3p^5$","C. $1s^2 2s^2 2p^6 3s^2 3p^3$","D. $1s^2 2s^2 2p^6 3s^1 3p^6$"],"answer":"B","explain":"Điền 17 electron: $1s^2 2s^2 2p^6 3s^2$ hết 12e, 5 electron còn lại vào $3p^5$. Chú ý phân lớp p chỉ chứa tối đa 6e nên A sai."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử X có cấu hình electron $1s^2 2s^2 2p^6 3s^2 3p^3$. X là nguyên tố","options":["A. nitrogen (N)","B. phosphorus (P)","C. sulfur (S)","D. silicon (Si)"],"answer":"B","explain":"Tổng số electron = 2 + 2 + 6 + 2 + 3 = 15 nên Z = 15, đó là phosphorus (P)."},{"type":"truefalse","level":"TH","points":1,"q":"Về nguyên tử O (Z = 8), xét tính đúng, sai của các khẳng định sau:","statements":["a) Cấu hình electron của O là $1s^2 2s^2 2p^4$.","b) Lớp electron ngoài cùng của O có 6 electron.","c) Lớp L của nguyên tử O chứa 8 electron.","d) Nguyên tử O có 2 lớp electron."],"answer":["T","T","F","T"],"explain":"a) đúng. b) đúng: lớp L gồm $2s^2 2p^4$ có 6e. c) sai: lớp L chỉ có 6e. d) đúng: phân lớp có n lớn nhất là 2."},{"type":"truefalse","level":"VD","points":1,"q":"Về thứ tự điền electron vào các phân lớp, xét tính đúng, sai của các khẳng định sau:","statements":["a) Phân lớp 5s được điền electron trước phân lớp 4d.","b) Phân lớp 4p được điền electron sau phân lớp 3d.","c) Phân lớp 3d được điền electron trước phân lớp 4s.","d) Dãy $3p$ $4s$ $3d$ $4p$ sắp xếp đúng theo chiều mức năng lượng tăng dần."],"answer":["T","T","F","T"],"explain":"a) đúng: ... $4p$ $5s$ $4d$ $5p$ .... b) đúng. c) sai: 4s điền trước 3d. d) đúng."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử X có tổng số electron trên các phân lớp s là 7. Điện tích hạt nhân Z của X bằng bao nhiêu?","answer":"19","explain":"Các phân lớp s được điền lần lượt: $1s^2 2s^2 3s^2 4s^1$ (tổng 7e). Cấu hình đầy đủ là $1s^2 2s^2 2p^6 3s^2 3p^6 4s^1$ nên Z = 19 (K)."},{"type":"short","level":"VDC","points":0.5,"q":"Lớp O (n = 5) chứa tối đa bao nhiêu electron?","answer":"50","explain":"Số electron tối đa trên lớp thứ n là $2n^2$. Lớp O ứng với n = 5 nên chứa tối đa $2n^2$ = 50 electron."}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Phân lớp nào chứa tối đa 14 electron?","options":["A. s","B. p","C. d","D. f"],"answer":"D","explain":"Phân lớp s chứa tối đa 2e; p chứa tối đa 6e; d chứa tối đa 10e; f chứa tối đa 14e."},{"type":"mcq","level":"NB","points":0.25,"q":"Lớp electron có số thứ tự n = 6 được kí hiệu là","options":["A. N","B. O","C. P","D. Q"],"answer":"C","explain":"Thứ tự các lớp: K(1), L(2), M(3), N(4), O(5), P(6), Q(7). Vậy n = 6 là lớp P."},{"type":"mcq","level":"NB","points":0.25,"q":"Mỗi obitan nguyên tử (AO) chứa tối đa bao nhiêu electron?","options":["A. 1","B. 2","C. 6","D. 8"],"answer":"B","explain":"Mỗi obitan nguyên tử (AO) chứa tối đa 2 electron."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron của nguyên tử beryllium (Z = 4) là","options":["A. $1s^2 2s^1$","B. $1s^2 2s^2$","C. $1s^2 2p^2$","D. $1s^1 2s^2$"],"answer":"B","explain":"Điền 4 electron theo thứ tự $1s$ $2s$: $1s^2 2s^2$."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron của nguyên tử neon (Z = 10) là","options":["A. $1s^2 2s^2 2p^4$","B. $1s^2 2s^2 2p^6$","C. $1s^2 2s^2 3s^2$","D. $1s^2 2p^8$"],"answer":"B","explain":"Điền 10 electron: $1s^2 2s^2$ hết 4e, 6 electron còn lại điền đầy $2p^6$."},{"type":"mcq","level":"VD","points":0.25,"q":"Nguyên tử Y có cấu hình electron $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2$. Y là nguyên tố","options":["A. potassium (K)","B. calcium (Ca)","C. scandium (Sc)","D. argon (Ar)"],"answer":"B","explain":"Tổng số electron = 2 + 2 + 6 + 2 + 6 + 2 = 20 nên Z = 20, đó là calcium (Ca)."},{"type":"truefalse","level":"TH","points":1,"q":"Về các khí hiếm, xét tính đúng, sai của các khẳng định sau:","statements":["a) Nguyên tử Ne có 8 electron ở lớp ngoài cùng.","b) Nguyên tử He có 2 electron ở lớp ngoài cùng và có cấu trúc bền vững.","c) Cấu hình electron của Ar là $1s^2 2s^2 2p^6 3s^2 3p^6$.","d) Các khí hiếm dễ tham gia phản ứng hóa học."],"answer":["T","T","T","F"],"explain":"a) đúng: $1s^2 2s^2 2p^6$. b) đúng: He là ngoại lệ, 2e lớp ngoài cùng đã bền vững. c) đúng. d) sai: khí hiếm có cấu trúc bền vững nên khó tham gia phản ứng hóa học."},{"type":"truefalse","level":"VD","points":1,"q":"Về nguyên tử Fe (Z = 26), xét tính đúng, sai của các khẳng định sau:","statements":["a) Cấu hình electron của Fe là $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2 3d^6$.","b) Nguyên tử Fe có 4 lớp electron.","c) Lớp M của nguyên tử Fe chứa 18 electron.","d) Phân lớp 3d của Fe có 6 electron."],"answer":["T","T","F","T"],"explain":"a) đúng. b) đúng. c) sai: lớp M gồm $3s^2 3p^6 3d^6$ nên chỉ chứa 14 electron. d) đúng."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử X có 4 lớp electron và lớp ngoài cùng có 1 electron. Điện tích hạt nhân Z của X bằng bao nhiêu?","answer":"19","explain":"X có 4 lớp, lớp ngoài cùng (n = 4) có 1e nên electron cuối cùng ở $4s^1$. Cấu hình: $1s^2 2s^2 2p^6 3s^2 3p^6 4s^1$, tổng Z = 19 (K)."},{"type":"short","level":"VDC","points":0.5,"q":"Lớp N (n = 4) có tất cả bao nhiêu obitan nguyên tử?","answer":"16","explain":"Lớp N gồm 4s (1 AO) + 4p (3 AO) + 4d (5 AO) + 4f (7 AO) = 16 AO."}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","points":0.25,"q":"Phân lớp 3d có bao nhiêu obitan nguyên tử (AO)?","options":["A. 1","B. 3","C. 5","D. 7"],"answer":"C","explain":"Mọi phân lớp d đều có 5 AO, phân lớp 3d cũng vậy."},{"type":"mcq","level":"NB","points":0.25,"q":"Phân lớp 2p chứa tối đa bao nhiêu electron?","options":["A. 2","B. 4","C. 6","D. 8"],"answer":"C","explain":"Mọi phân lớp p đều chứa tối đa 6 electron, phân lớp 2p cũng vậy."},{"type":"mcq","level":"NB","points":0.25,"q":"Kí hiệu nào sau đây chỉ một phân lớp thuộc lớp M?","options":["A. 2s","B. 3d","C. 4s","D. 1s"],"answer":"B","explain":"Lớp M có n = 3 nên các phân lớp thuộc lớp M là 3s, 3p, 3d."},{"type":"mcq","level":"TH","points":0.25,"q":"Cấu hình electron của nguyên tử argon (Z = 18) là","options":["A. $1s^2 2s^2 2p^6 3s^2 3p^4$","B. $1s^2 2s^2 2p^6 3s^2 4s^2$","C. $1s^2 2s^2 2p^6 3s^2 3p^6$","D. $1s^2 2s^2 2p^6 3p^8$"],"answer":"C","explain":"Điền 18 electron: $1s^2 2s^2 2p^6 3s^2$ hết 12e, 6 electron còn lại điền đầy $3p^6$."},{"type":"mcq","level":"TH","points":0.25,"q":"Nguyên tử phosphorus (Z = 15) có bao nhiêu lớp electron?","options":["A. 2","B. 3","C. 4","D. 5"],"answer":"B","explain":"Cấu hình của P là $1s^2 2s^2 2p^6 3s^2 3p^3$, phân lớp có n lớn nhất là 3 nên nguyên tử có 3 lớp electron."},{"type":"mcq","level":"VD","points":0.25,"q":"Cấu hình electron nào sau đây được viết SAI?","options":["A. $1s^2 2s^2 2p^4$","B. $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2$","C. $1s^2 2s^2 2p^6 3s^2 3p^6 3d^1$","D. $1s^2 2s^2 2p^6 3s^1$"],"answer":"C","explain":"Cấu hình C có 19 electron (nguyên tử K) nhưng viết sai thứ tự mức năng lượng: electron thứ 19 phải điền vào 4s (mức năng lượng thấp hơn 3d). Cấu hình đúng là $1s^2 2s^2 2p^6 3s^2 3p^6 4s^1$."},{"type":"truefalse","level":"TH","points":1,"q":"Về lớp electron K, xét tính đúng, sai của các khẳng định sau:","statements":["a) Lớp K ứng với số thứ tự n = 1.","b) Lớp K chỉ có một phân lớp là 1s.","c) Lớp K chứa tối đa 2 electron.","d) Lớp K là lớp electron ngoài cùng của nguyên tử Li (Z = 3)."],"answer":["T","T","T","F"],"explain":"a) đúng. b) đúng: số phân lớp bằng n = 1. c) đúng: $2n^2$ = 2. d) sai: Li có cấu hình $1s^2 2s^1$ nên lớp ngoài cùng là lớp L."},{"type":"truefalse","level":"VD","points":1,"q":"Về các ion $Mg^{2+}$ và $K^+$, xét tính đúng, sai của các khẳng định sau:","statements":["a) Ion $Mg^{2+}$ và nguyên tử Ne đều có 10 electron.","b) Cấu hình electron của $Mg^{2+}$ là $1s^2 2s^2 2p^6$.","c) Ion $K^+$ có 18 electron.","d) Ion $K^+$ có cấu hình electron giống nguyên tử Ca."],"answer":["T","T","T","F"],"explain":"a) đúng: Mg (Z = 12) nhường 2e còn 10e. b) đúng. c) đúng: 19 − 1 = 18. d) sai: $K^+$ có 18e, cấu hình $1s^2 2s^2 2p^6 3s^2 3p^6$ giống Ar, còn Ca có 20e."},{"type":"short","level":"VDC","points":0.5,"q":"Ion $Fe^{2+}$ (Fe có Z = 26) có bao nhiêu electron?","answer":"24","explain":"Fe có 26 electron. Khi tạo ion $Fe^{2+}$, nguyên tử Fe nhường 2 electron nên còn 26 − 2 = 24 electron."},{"type":"short","level":"VDC","points":0.5,"q":"Nguyên tử manganese (Z = 25) có bao nhiêu electron ở lớp ngoài cùng?","answer":"2","explain":"Cấu hình của Mn là $1s^2 2s^2 2p^6 3s^2 3p^6 4s^2 3d^5$. Lớp ngoài cùng (n = 4) là $4s^2$ có 2 electron."}]}]}
