"-283", "explain": "$\\Delta_rH^{o}_{298} = \\Delta_fH^{o}_{298}(CO_2) - \\Delta_fH^{o}_{298}(CO) = (-393{,}5) - (-110{,}5) = -283$ kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cần đốt cháy bao nhiêu gam $CH_4$ ($M = 16$) để thu được 1780,6 kJ nhiệt? Biết $\\Delta_rH^{o}_{298} = -890{,}3$ kJ cho phản ứng $CH_4(g) + 2O_2(g) \\to CO_2(g) + 2H_2O(l)$.", "answer": "32", "explain": "$n = 1780{,}6/890{,}3 = 2$ mol; $m = 2 \\times 16 = 32$ g.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Dạng đơn chất bền nhất của carbon ở điều kiện chuẩn là", "options": ["A. kim cương.", "B. graphite.", "C. than hoạt tính.", "D. carbon vô định hình."], "answer": "B", "explain": "Graphite là đơn chất bền nhất của carbon ($\\Delta_fH^{o}_{298} = 0$).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phản ứng nổ của hỗn hợp $H_2$ và $O_2$ là phản ứng", "options": ["A. thu nhiệt.", "B. tỏa nhiệt.", "C. không có biến thiên năng lượng.", "D. thu nhiệt một phần."], "answer": "B", "explain": "Phản ứng nổ tỏa ra lượng nhiệt rất lớn ($\\Delta_rH = -571{,}6$ kJ cho 2 mol $H_2O$ tạo thành).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi $\\Delta_rH \\lt 0$ thì năng lượng của hệ phản ứng", "options": ["A. tăng lên.", "B. giảm xuống.", "C. không đổi.", "D. bằng 0."], "answer": "B", "explain": "$\\Delta_rH \\lt 0$: hệ mất năng lượng (truyền nhiệt ra môi trường).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dãy nào gồm toàn phản ứng tỏa nhiệt?", "options": ["A. Đốt cháy khí thiên nhiên, phản ứng trung hòa, đốt cháy cồn.", "B. Nhiệt phân $CaCO_3$, quang hợp, hòa tan $NH_4NO_3$.", "C. Đốt cháy than, nhiệt phân $KClO_3$, nung vôi.", "D. Quang hợp, đốt cháy hydrogen, trung hòa acid - base."], "answer": "A", "explain": "Đốt cháy nhiên liệu và trung hòa đều tỏa nhiệt. B chứa toàn phản ứng thu nhiệt; C chứa nhiệt phân $CaCO_3$ (thu nhiệt); D chứa quang hợp (thu nhiệt).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biết $\\Delta_fH^{o}_{298}(CO_2(g)) = -393{,}5$ kJ/mol. $\\Delta_rH^{o}_{298}$ của phản ứng $C(graphite) + O_2(g) \\to CO_2(g)$ là", "options": ["A. $-393{,}5$ kJ.", "B. $+393{,}5$ kJ.", "C. $-787{,}0$ kJ.", "D. $0$ kJ."], "answer": "A", "explain": "Đây chính là phản ứng tạo thành 1 mol $CO_2$ từ đơn chất bền nhất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho $E_b(H{-}H) = 436$, $E_b(Br{-}Br) = 193$, $E_b(H{-}Br) = 366$ (kJ/mol). $\\Delta_rH$ của phản ứng $H_2(g) + Br_2(g) \\to 2HBr(g)$ là", "options": ["A. $-103$ kJ.", "B. $+103$ kJ.", "C. $-732$ kJ.", "D. $+629$ kJ."], "answer": "A", "explain": "$\\Delta_rH = (436 + 193) - 2 \\times 366 = 629 - 732 = -103$ kJ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Biến thiên enthalpy cho biết phản ứng tỏa nhiệt hay thu nhiệt.", "b) $\\Delta_rH$ tỉ lệ với lượng chất tham gia phản ứng.", "c) Túi chườm lạnh hoạt động dựa trên phản ứng thu nhiệt.", "d) Đốt cháy nhiên liệu là phản ứng thu nhiệt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đốt cháy nhiên liệu tỏa nhiệt.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho $E_b(O{=}O) = 498$ kJ/mol. Xét các phát biểu:", "statements": ["a) Phá vỡ 1 mol liên kết $O{=}O$ cần 498 kJ.", "b) Hình thành 1 mol liên kết $O{=}O$ tỏa ra 498 kJ.", "c) Liên kết có $E_b$ càng lớn càng bền.", "d) Phá vỡ liên kết là quá trình tỏa nhiệt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phá vỡ liên kết thu nhiệt.", "points": 1}, {"type": "short", "level": "VD", "q": "Tính $\\Delta_rH^{o}_{298}$ (kJ) của phản ứng $CH_4(g) + 2O_2(g) \\to CO_2(g) + 2H_2O(l)$. Cho $\\Delta_fH^{o}_{298}(CH_4(g)) = -74{,}9$ kJ/mol; $\\Delta_fH^{o}_{298}(CO_2(g)) = -393{,}5$ kJ/mol; $\\Delta_fH^{o}_{298}(H_2O(l)) = -285{,}8$ kJ/mol.", "answer": "-890,2", "explain": "$\\Delta_rH^{o}_{298} = [(-393{,}5) + 2 \\times (-285{,}8)] - (-74{,}9) = (-965{,}1) + 74{,}9 = -890{,}2$ kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trộn 100 mL dung dịch $NaOH$ 2M với dung dịch $HCl$ dư. Biết $NaOH(aq) + HCl(aq) \\to NaCl(aq) + H_2O(l)$ có $\\Delta_rH = -57{,}6$ kJ. Tính nhiệt lượng tỏa ra (kJ, làm tròn đến 2 chữ số thập phân).", "answer": "11,52", "explain": "$n_{NaOH} = 0{,}1 \\times 2 = 0{,}2$ mol; $Q = 0{,}2 \\times 57{,}6 = 11{,}52$ kJ.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Khi phá vỡ liên kết hóa học trong phân tử ở thể khí thì", "options": ["A. hệ tỏa năng lượng.", "B. hệ cần hấp thụ năng lượng.", "C. năng lượng của hệ không đổi.", "D. nhiệt độ của hệ tăng."], "answer": "B", "explain": "Phá vỡ liên kết cần cung cấp năng lượng (quá trình thu nhiệt).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi các nguyên tử ở thể khí kết hợp tạo thành liên kết hóa học mới thì", "options": ["A. hệ hấp thụ năng lượng.", "B. hệ giải phóng năng lượng.", "C. năng lượng của hệ không đổi.", "D. cần cung cấp nhiệt liên tục."], "answer": "B", "explain": "Hình thành liên kết mới giải phóng năng lượng (quá trình tỏa nhiệt).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ứng dụng nào sau đây của phản ứng tỏa nhiệt trong đời sống là đúng?", "options": ["A. Dùng đá khô để ướp lạnh thực phẩm.", "B. Đốt gas để đun nấu.", "C. Dùng túi chườm lạnh khi bị sưng.", "D. Bảo quản thực phẩm trong tủ lạnh."], "answer": "B", "explain": "Đốt gas là phản ứng tỏa nhiệt cung cấp nhiệt để nấu ăn; các trường hợp còn lại dùng quá trình thu nhiệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biết $E_b(H{-}H) = 436$ kJ/mol và $E_b(H{-}I) = 299$ kJ/mol. Nhận xét đúng là", "options": ["A. liên kết $H{-}H$ bền hơn liên kết $H{-}I$.", "B. liên kết $H{-}I$ bền hơn liên kết $H{-}H$.", "C. hai liên kết bền như nhau.", "D. không so sánh được độ bền qua $E_b$."], "answer": "A", "explain": "$E_b$ càng lớn thì liên kết càng bền.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $CaCO_3(s) \\to CaO(s) + CO_2(g)$, $\\Delta_rH^{o}_{298} = +179$ kJ. Phát biểu đúng là", "options": ["A. Phản ứng tỏa nhiệt.", "B. Phản ứng thu nhiệt, cần cung cấp 179 kJ cho mỗi mol $CaCO_3$.", "C. Phản ứng tự xảy ra ở nhiệt độ thường.", "D. Năng lượng của hệ giảm 179 kJ."], "answer": "B", "explain": "$\\Delta_rH \\gt 0$ nên thu nhiệt; năng lượng của hệ tăng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tính $\\Delta_rH$ (kJ) của phản ứng $CH_4(g) + 2O_2(g) \\to CO_2(g) + 2H_2O$ (nước ở thể khí) theo năng lượng liên kết. Cho: $E_b(C{-}H) = 413$, $E_b(O{=}O) = 498$, $E_b(C{=}O) = 799$, $E_b(O{-}H) = 463$ (kJ/mol).", "options": ["A. $+802$ kJ.", "B. $-802$ kJ.", "C. $-890$ kJ.", "D. $+890$ kJ."], "answer": "B", "explain": "Phá vỡ: $4 \\times 413 + 2 \\times 498 = 2648$ kJ; hình thành: $2 \\times 799 + 4 \\times 463 = 3450$ kJ; $\\Delta_rH = 2648 - 3450 = -802$ kJ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Phản ứng tỏa nhiệt làm nhiệt độ môi trường tăng.", "b) Phản ứng thu nhiệt làm nhiệt độ môi trường giảm.", "c) Túi chườm nóng dùng phản ứng tỏa nhiệt.", "d) Mọi phản ứng tỏa nhiệt đều tự xảy ra mà không cần kích thích ban đầu."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nhiều phản ứng tỏa nhiệt cần mồi lửa/đun nóng ban đầu để vượt năng lượng hoạt hóa.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho $\\Delta_fH^{o}_{298}$ (kJ/mol): $CH_4(g)$: $-74{,}6$; $CO_2(g)$: $-393{,}5$; $H_2O(l)$: $-285{,}8$. Xét phản ứng đốt cháy methane. Các phát biểu:", "statements": ["a) $\\Delta_rH^{o}_{298} = (-393{,}5) + 2 \\times (-285{,}8) - (-74{,}6)$.", "b) $\\Delta_rH^{o}_{298} \\approx -890{,}3$ kJ.", "c) Phản ứng tỏa nhiệt.", "d) Đốt 2 mol $CH_4$ tỏa ra 890,3 kJ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đốt 2 mol tỏa $2 \\times 890{,}3 = 1780{,}6$ kJ.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong 0,5 mol phân tử $H_ ) \\to CO_2(g)$, $\\Delta_rH^{o}_{298} = -393{,}5$ kJ. Nhiệt lượng tỏa ra là", "options": ["A. 393,5 kJ.", "B. 787,0 kJ.", "C. 196,75 kJ.", "D. 32,79 kJ."], "answer": "B", "explain": "$n_C = 24/12 = 2$ mol; $Q = 2 \\times 393{,}5 = 787{,}0$ kJ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Biết $CH_4(g) + 2O_2(g) \\to CO_2(g) + 2H_2O(g)$ có $\\Delta_rH^{o}_{298} = -802{,}5$ kJ. Cho $E_b(O{=}O) = 498$, $E_b(C{=}O) = 799$, $E_b(O{-}H) = 463$ (kJ/mol). Năng lượng liên kết trung bình $E_b(C{-}H)$ (kJ/mol) là", "options": ["A. 206.", "B. 413.", "C. 826.", "D. 1652."], "answer": "B", "explain": "Gọi $x = E_b(C{-}H)$: $4x + 996 - 3450 = -802{,}5 \\Rightarrow 4x = 1651{,}5 \\Rightarrow x \\approx 413$ kJ/mol.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Trong phản ứng tỏa nhiệt, sản phẩm ở mức năng lượng thấp hơn chất đầu.", "b) Trong phản ứng thu nhiệt, sản phẩm ở mức năng lượng cao hơn chất đầu.", "c) $\\Delta_rH$ bằng hiệu năng lượng của sản phẩm và chất đầu.", "d) Sơ đồ năng lượng không cho biết dấu của $\\Delta_rH$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: hướng mũi tên năng lượng (lên/xuống) cho biết dấu của $\\Delta_rH$.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Nhiên liệu $X$, $Y$ có nhiệt cháy chuẩn lần lượt $-285{,}8$ kJ/mol ($M = 2$) và $-890{,}3$ kJ/mol ($M = 16$). Xét các phát biểu:", "statements": ["a) Đốt 1 mol $Y$ tỏa nhiệt nhiều hơn đốt 1 mol $X$.", "b) Đốt 1 gam $X$ tỏa $142{,}9$ kJ.", "c) Đốt 1 gam $Y$ tỏa $55{,}6$ kJ (làm tròn 1 chữ số thập phân).", "d) Trên cùng khối lượng, $X$ hiệu quả hơn $Y$ về mặt năng lượng."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng: $285{,}8/2 = 142{,}9$ kJ/g. c) Đúng: $890{,}3/16 = 55{,}6$ kJ/g. d) Đúng: $142{,}9 \\gt 55{,}6$.", "points": 1}, {"type": "short", "level": "VD", "q": "Tính $\\Delta_rH^{o}_{298}$ (kJ) của phản ứng $2H_2S(g) + 3O_2(g) \\to 2SO_2(g) + 2H_2O(l)$. Cho $\\Delta_fH^{o}_{298}$ (kJ/mol): $H_2S(g)$: $-20{,}7$; $SO_2(g)$: $-296{,}8$; $H_2O(l)$: $-285{,}8$.", "answer": "-1123,8", "explain": "$\\Delta_rH^{o}_{298} = [2 \\times (-296{,}8) + 2 \\times (-285{,}8)] - 2 \\times (-20{,}7) = -1123{,}8$ kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cần cung cấp bao nhiêu kJ nhiệt để nhiệt phân hoàn toàn 1 kg $CaCO_3$ ($M = 100$)? Biết $CaCO_3(s) \\to CaO(s) + CO_2(g)$ có $\\Delta_rH^{o}_{298} = +179$ kJ.", "answer": "1790", "explain": "$n = 1000/100 = 10$ mol; nhiệt cần $= 10 \\times 179 = 1790$ kJ.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Đại lượng $\\Delta_rH$ là", "options": ["A. nhiệt tạo thành chuẩn.", "B. biến thiên enthalpy của phản ứng.", "C. năng lượng liên kết.", "D. nhiệt dung riêng."], "answer": "B", "explain": "$\\Delta_rH$ là biến thiên enthalpy (nhiệt phản ứng).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "298 K tương ứng với nhiệt độ", "options": ["A. $0^\\circ C$.", "B. $25^\\circ C$.", "C. $100^\\circ C$.", "D. $273^\\circ C$."], "answer": "B", "explain": "$298 - 273 = 25^\\circ C$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phản ứng nung vôi trong công nghiệp là phản ứng", "options": ["A. tỏa nhiệt.", "B. thu nhiệt.", "C. không biến thiên năng lượng.", "D. xảy ra ở nhiệt độ thường."], "answer": "B", "explain": "Nhiệt phân $CaCO_3$ ($\\Delta_rH^{o}_{298} = +179$ kJ) là phản ứng thu nhiệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu đúng về nhiệt tạo thành chuẩn là", "options": ["A. biến thiên enthalpy khi tạo thành 1 mol chất từ các đơn chất bền nhất ở điều kiện chuẩn.", "B. nhiệt lượng tỏa ra khi đốt cháy 1 mol chất.", "C. luôn có giá trị dương.", "D. chỉ xác định được với chất khí."], "answer": "A", "explain": "Đúng định nghĩa $\\Delta_fH^{o}_{298}$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biết $\\Delta_fH^{o}_{298}(CO_2(g)) = -393{,}5$ kJ/mol; $\\Delta_fH^{o}_{298}(CO(g)) = -110{,}5$ kJ/mol. $\\Delta_rH^{o}_{298}$ của phản ứng $2CO(g) + O_2(g) \\to 2CO_2(g)$ là", "options": ["A. $-566{,}0$ kJ.", "B. $+566{,}0$ kJ.", "C. $-283{,}0$ kJ.", "D. $-504{,}0$ kJ."], "answer": "A", "explain": "$\\Delta_rH^{o}_{298} = 2 \\times (-393{,}5) - 2 \\times (-110{,}5) = -787 + 221 = -566{,}0$ kJ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho phản ứng: $Fe_2O_3(s) + 3CO(g) \\to 2Fe(s) + 3CO_2(g)$. Biết $\\Delta_fH^{o}_{298}$ (kJ/mol): $Fe_2O_3(s)$: $-824{,}2$; $CO(g)$: $-110{,}5$; $CO_2(g)$: $-393{,}5$. Giá trị $\\Delta_rH^{o}_{298}$ là", "options": ["A. $+24{,}8$ kJ.", "B. $-24{,}8$ kJ.", "C. $-507{,}7$ kJ.", "D. $-2028{,}9$ kJ."], "answer": "B", "explain": "$\\Delta_rH^{o}_{298} = 3 \\times (-393{,}5) - [(-824{,}2) + 3 \\times (-110{,}5)] = -1180{,}5 + 1155{,}7 = -24{,}8$ kJ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về năng lượng liên kết:", "statements": ["a) $E_b$ càng lớn thì liên kết càng bền.", "b) Phá vỡ liên kết thu nhiệt.", "c) Hình thành liên kết tỏa nhiệt.", "d) $E_b$ xác định cho phân tử khí tách thành nguyên tử khí."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn phát biểu đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Tính $\\Delta_rH^{o}_{298}$ của phản ứng $CH_4(g) + 2O_2(g) \\to CO_2(g) + 2H_2O(l)$ bằng hai cách: theo $\\Delta_fH^{o}_{298}$ được $-890{,}3$ kJ; theo $E_b$ (nước ở thể khí) được $-802$ kJ. Xét các phát biểu:", "statements": ["a) Hai kết quả khác nhau chủ yếu do trạng thái của nước khác nhau.", "b) Cả hai cách đều cho thấy phản ứng tỏa nhiệt.", "c) $E_b$ là giá trị trung bình nên kết quả chỉ gần đúng.", "d) Cách tính theo $E_b$ là sai."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cả hai cách đều đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho $E_b(H{-}H) = 436$ kJ/mol. Tính năng lượng (kJ) cần để phá vỡ liên kết trong 0,5 mol phân tử $H_2$ ở thể khí.", "answer": "218", "explain": "Năng g liên quan đến $\\Delta_rH$."], "answer": "C", "explain": "Phá vỡ thu nhiệt, hình thành tỏa nhiệt; hiệu hai quá trình quyết định $\\Delta_rH$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Biết $CH_4(g) + 2O_2(g) \\to CO_2(g) + 2H_2O(l)$, $\\Delta_rH^{o}_{298} = -890{,}3$ kJ; $\\Delta_fH^{o}_{298}(CO_2(g)) = -393{,}5$ kJ/mol; $\\Delta_fH^{o}_{298}(H_2O(l)) = -285{,}8$ kJ/mol. $\\Delta_fH^{o}_{298}$ của $CH_4(g)$ (kJ/mol) tính theo số liệu đã cho là", "options": ["A. $-890{,}3$.", "B. $-74{,}8$.", "C. $+74{,}8$.", "D. $-965{,}1$."], "answer": "B", "explain": "$-890{,}3 = (-393{,}5 - 571{,}6) - x \\Rightarrow x = -965{,}1 + 890{,}3 = -74{,}8$ kJ/mol.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về ứng dụng của $\\Delta_rH$:", "statements": ["a) So sánh hiệu quả năng lượng của nhiên liệu dựa vào nhiệt cháy.", "b) Tính năng lượng từ thức ăn qua nhiệt cháy các chất dinh dưỡng.", "c) Tính năng lượng cần cho lò nung phản ứng thu nhiệt.", "d) Đốt cháy hydrogen tạo ra $CO_2$ nên không sạch."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đốt $H_2$ chỉ tạo $H_2O$.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho $\\Delta_fH^{o}_{298}(NaCl(s)) = -411{,}2$ kJ/mol và phản ứng $Na(s) + \\frac{1}{2}Cl_2(g) \\to NaCl(s)$. Các phát biểu:", "statements": ["a) $\\Delta_rH^{o}_{298} = -411{,}2$ kJ.", "b) Phản ứng tỏa nhiệt.", "c) $\\Delta_fH^{o}_{298}$ của $Na(s)$ và $Cl_2(g)$ bằng 0.", "d) Tạo 2 mol $NaCl(s)$ tỏa ra 822,4 kJ."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng: tạo 1 mol $NaCl$ từ đơn chất; $\\Delta_rH \\lt 0$; đơn chất bền nhất bằng 0; $2 \\times 411{,}2 = 822{,}4$ kJ.", "points": 1}, {"type": "short", "level": "VD", "q": "Phản ứng $H_2(g) + Cl_2(g) \\to 2HCl(g)$ có $\\Delta_rH^{o}_{298} = -184{,}6$ kJ. Khi tạo thành 1 mol khí $HCl$ từ các đơn chất thì nhiệt lượng tỏa ra là bao nhiêu kJ (làm tròn đến 1 chữ số thập phân)?", "answer": "92,3", "explain": "T
