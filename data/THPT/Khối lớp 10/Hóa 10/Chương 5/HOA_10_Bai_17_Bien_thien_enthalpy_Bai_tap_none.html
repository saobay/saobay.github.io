": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) $\\Delta_fH^{o}_{298}$ của $H_2(g)$ bằng 0 vì $H_2$ là đơn chất bền nhất của hydrogen.", "b) Nhiệt độ chuẩn thường được lấy là $25^\\circ C$ (298 K).", "c) Khi đốt cháy nhiên liệu, năng lượng của hệ tăng.", "d) Phản ứng trung hòa acid - base là phản ứng tỏa nhiệt."], "answer": ["T", "T", "F", "T"], "explain": "a), b) Đúng theo quy ước. c) Sai: đốt cháy tỏa nhiệt ra môi trường nên năng lượng của hệ giảm. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho phản ứng $CH_4(g) + 2O_2(g) \\to CO_2(g) + 2H_2O(g)$ và bảng năng lượng liên kết: $E_b(C{-}H) = 413$, $E_b(O{=}O) = 498$, $E_b(C{=}O) = 799$, $E_b(O{-}H) = 463$ (kJ/mol). Xét các phát biểu:", "statements": ["a) Tổng năng lượng cần để phá vỡ liên kết của chất đầu là 2648 kJ.", "b) Tổng năng lượng tỏa ra khi hình thành liên kết của sản phẩm là 3450 kJ.", "c) $\\Delta_rH$ của phản ứng bằng $-802$ kJ.", "d) Phản ứng này là phản ứng thu nhiệt."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $4 \\times 413 + 2 \\times 498 = 2648$ kJ. b) Đúng: $2 \\times 799 + 4 \\times 463 = 3450$ kJ. c) Đúng: $2648 - 3450 = -802$ kJ. d) Sai: $\\Delta_rH \\lt 0$ nên là phản ứng tỏa nhiệt.", "points": 1}, {"type": "short", "level": "VD", "q": "Tính $\\Delta_rH$ (kJ) của phản ứng $CH_4(g) + 2O_2(g) \\to CO_2(g) + 2H_2O(g)$ theo năng lượng liên kết. Cho: $E_b(C{-}H) = 413$, $E_b(O{=}O) = 498$, $E_b(C{=}O) = 799$, $E_b(O{-}H) = 463$ (kJ/mol).", "answer": "-802", "explain": "Phá vỡ: $4 \\times 413 + 2 \\times 498 = 2648$ kJ; hình thành: $2 \\times 799 + 4 \\times 463 = 3450$ kJ; $\\Delta_rH = 2648 - 3450 = -802$ kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đốt cháy hoàn toàn 4,6 gam ethanol ($C_2H_5OH$, $M = 46$). Biết nhiệt cháy chuẩn của ethanol là $-1366{,}8$ kJ/mol. Tính nhiệt lượng tỏa ra (kJ, làm tròn đến 2 chữ số thập phân).", "answer": "136,68", "explain": "$n_{C_2H_5OH} = 4{,}6/46 = 0{,}1$ mol; $Q = 0{,}1 \\times 1366{,}8 = 136{,}68$ kJ.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Nhiệt tạo thành chuẩn $\\Delta_fH^{o}_{298}$ của $N_2(g)$ bằng", "options": ["A. $-45{,}9$ kJ/mol.", "B. $+45{,}9$ kJ/mol.", "C. $0$ kJ/mol.", "D. $-945$ kJ/mol."], "answer": "C", "explain": "$N_2(g)$ là đơn chất bền nhất của nitrogen nên $\\Delta_fH^{o}_{298} = 0$ theo quy ước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Giá trị tuyệt đối của $\\Delta_rH$ càng lớn thì", "options": ["A. nhiệt lượng tỏa ra hoặc thu vào của phản ứng càng nhiều.", "B. nhiệt lượng tỏa ra hoặc thu vào của phản ứng càng ít.", "C. phản ứng xảy ra càng chậm.", "D. phản ứng xảy ra càng nhanh."], "answer": "A", "explain": "Giá trị tuyệt đối của biến thiên enthalpy càng lớn thì nhiệt lượng tỏa ra hay thu vào của phản ứng càng nhiều.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phản ứng trung hòa $NaOH(aq) + HCl(aq) \\to NaCl(aq) + H_2O(l)$ là phản ứng", "options": ["A. thu nhiệt.", "B. tỏa nhiệt.", "C. không có biến thiên enthalpy.", "D. vừa tỏa nhiệt vừa thu nhiệt."], "answer": "B", "explain": "Phản ứng trung hòa tỏa nhiệt ra môi trường ($\\Delta_rH = -57{,}6$ kJ cho mỗi mol $H_2O$ tạo thành).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biết $\\Delta_fH^{o}_{298}(H_2O(l)) = -285{,}8$ kJ/mol. Biến thiên enthalpy chuẩn của phản ứng $2H_2(g) + O_2(g) \\to 2H_2O(l)$ là", "options": ["A. $-285{,}8$ kJ.", "B. $-571{,}6$ kJ.", "C. $+571{,}6$ kJ.", "D. $-142{,}9$ kJ."], "answer": "B", "explain": "$\\Delta_rH^{o}_{298} = 2 \\times (-285{,}8) - 0 = -571{,}6$ kJ ($H_2$, $O_2$ là đơn chất nên $\\Delta_fH^{o}_{298} = 0$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các phản ứng sau, phản ứng có $\\Delta_rH^{o}_{298} \\gt 0$ là", "options": ["A. $C(s) + O_2(g) \\to CO_2(g)$.", "B. $H_2(g) + Cl_2(g) \\to 2HCl(g)$.", "C. $N_2(g) + O_2(g) \\to 2NO(g)$.", "D. $2Mg(s) + O_2(g) \\to 2MgO(s)$."], "answer": "C", "explain": "Phản ứng $N_2 + O_2 \\to 2NO$ cần nhiệt độ rất cao (sấm sét) mới xảy ra, là phản ứng thu nhiệt ($\\Delta_rH^{o}_{298} = +180{,}6$ kJ); các phản ứng còn lại đều tỏa nhiệt mạnh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho: (1) $C(graphite) + O_2(g) \\to CO_2(g)$, $\\Delta_rH^{o}_{298} = -393{,}5$ kJ; (2) $CO(g) + \\frac{1}{2}O_2(g) \\to CO_2(g)$, $\\Delta_rH^{o}_{298} = -283{,}0$ kJ. Biến thiên enthalpy chuẩn của phản ứng $C(graphite) + \\frac{1}{2}O_2(g) \\to CO(g)$ là", "options": ["A. $-676{,}5$ kJ.", "B. $-110{,}5$ kJ.", "C. $+110{,}5$ kJ.", "D. $-283{,}0$ kJ."], "answer": "B", "explain": "Theo định luật Hess: $\\Delta_rH = \\Delta_rH_1 - \\Delta_rH_2 = -393{,}5 - (-283{,}0) = -110{,}5$ kJ (lấy phản ứng (1) trừ phản ứng (2)).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Phản ứng tỏa nhiệt làm nhiệt độ môi trường xung quanh tăng lên.", "b) Phản ứng thu nhiệt làm nhiệt độ môi trường xung quanh giảm xuống.", "c) Túi chườm nóng dùng trong y tế hoạt động dựa trên phản ứng tỏa nhiệt.", "d) Mọi phản ứng cần đun nóng mới xảy ra đều là phản ứng thu nhiệt."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng: tỏa nhiệt truyền nhiệt ra môi trường, thu nhiệt lấy nhiệt từ môi trường. c) Đúng. d) Sai: nhiều phản ứng tỏa nhiệt vẫn cần đun nóng để khởi động (ví dụ đốt cháy), việc đun nóng ban đầu chỉ để vượt qua năng lượng hoạt hóa.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho $E_b(O{=}O) = 498$ kJ/mol. Xét các phát biểu:", "statements": ["a) Để phá vỡ 1 mol liên kết $O{=}O$ ở thể khí cần cung cấp 498 kJ.", "b) Khi hình thành 1 mol liên kết $O{=}O$ từ các nguyên tử O ở thể khí sẽ tỏa ra 498 kJ.", "c) Liên kết có $E_b$ càng lớn thì càng bền.", "d) Trong phản ứng hóa học, phá vỡ liên kết tỏa nhiệt còn hình thành liên kết thu nhiệt."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng theo định nghĩa $E_b$. c) Đúng: cần nhiều năng lượng hơn để phá vỡ liên kết bền. d) Sai: ngược lại, phá vỡ liên kết thu nhiệt, hình thành liên kết tỏa nhiệt.", "points": 1}, {"type": "short", "level": "VD", "q": "Nhiệt phân hoàn toàn 50 gam $CaCO_3$ ($M = 100$). Biết $CaCO_3(s) \\to CaO(s) + CO_2(g)$ có $\\Delta_rH^{o}_{298} = +179$ kJ. Tính nhiệt lượng (kJ) cần cung cấp cho phản ứng.", "answer": "89,5", "explain": "$n_{CaCO_3} = 50/100 = 0{,}5$ mol; nhiệt cần cung cấp $= 0{,}5 \\times 179 = 89{,}5$ kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trung hòa hoàn toàn 0,25 mol $NaOH$ bằng dung dịch $HCl$ dư. Biết $NaOH(aq) + HCl(aq) \\to NaCl(aq) + H_2O(l)$ có $\\Delta_rH = -57{,}6$ kJ. Tính nhiệt lượng tỏa ra (kJ, làm tròn đến 1 chữ số thập phân).", "answer": "14,4", "explain": "Mỗi mol $NaOH$ tạo 1 mol $H_2O$ tỏa 57,6 kJ; $Q = 0{,}25 \\times 57{,}6 = 14{,}4$ kJ.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Biến thiên enthalpy chuẩn của phản ứng được kí hiệu là", "options": ["A. $\\Delta_rH$.", "B. $\\Delta_rH^{o}_{298}$.", "C. $\\Delta_fH$.", "D. $E_b$."], "answer": "B", "explain": "$\\Delta_rH^{o}_{298}$ là biến thiên enthalpy chuẩn (ở 298 K); $\\Delta_rH$ là biến thiên enthalpy nói chung; $\\Delta_fH$ là nhiệt tạo thành; $E_b$ là năng lượng liên kết.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ở điều kiện chuẩn, nhiệt độ thường được lấy là", "options": ["A. $0^\\circ C$ (273 K).", "B. $25^\\circ C$ (298 K).", "C. $100^\\circ C$ (373 K).", "D. $20^\\circ C$ (293 K)."], "answer": "B", "explain": "Nhiệt độ chuẩn thường được chọn là $25^\\circ C$ (298 K).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quá trình quang hợp ở cây xanh là quá trình", "options": ["A. tỏa nhiệt vì cây thải nhiệt ra môi trường.", "B. thu nhiệt vì hấp thụ năng lượng ánh sáng để tổng hợp chất hữu cơ.", "C. không có biến thiên năng lượng.", "D. tỏa nhiệt vì tạo ra $O_2$."], "answer": "B", "explain": "Quang hợp hấp thụ năng lượng ánh sáng mặt trời để tổng hợp glucose từ $CO_2$ và $H_2O$ nên là quá trình thu nhiệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đốt cháy hoàn toàn 1 mol $H_2(g)$ tỏa 285,8 kJ; đốt cháy hoàn toàn 1 mol $CH_4(g)$ tỏa 890,3 kJ. Nhận xét nào sau đây đúng?", "options": ["A. Đốt 1 mol $H_2$ tỏa nhiệt nhiều hơn đốt 1 mol $CH_4$.", "B. Đốt 1 mol $CH_4$ tỏa nhiệt nhiều hơn đốt 1 mol $H_2$.", "C. Hai quá trình tỏa nhiệt như nhau.", "D. Không so sánh được vì khác chất."], "answer": "B", "explain": "$890{,}3 \\gt 285{,}8$ nên đốt 1 mol $CH_4$ tỏa nhiều nhiệt hơn đốt 1 mol $H_2$ (giá trị tuyệt đối của $\\Delta_rH$ càng lớn, nhiệt tỏa ra càng nhiều).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "$E_b(O{=}O) = 498$ kJ/mol có nghĩa là", "options": ["A. phá vỡ 1 mol $O_2$ ở thể khí thành 2 mol nguyên tử O ở thể khí cần 498 kJ.", "B. hình thành 1 mol $O_2$ từ 2 mol nguyên tử O cần 498 kJ.", "C. đốt cháy 1 mol $O_2$ tỏa ra 498 kJ.", "D. 1 mol $O_2$ nặng 498 gam."], "answer": "A", "explain": "Đúng định nghĩa năng lượng liên kết: năng lượng cần để phá vỡ 1 mol liên kết $O{=}O$ trong phân tử khí thành các nguyên tử khí.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho $E_b(H{-}H) = 436$ kJ/mol, $E_b(Br{-}Br) = 193$ kJ/mol, $E_b(H{-}Br) = 366$ kJ/mol. Biến thiên enthalpy của phản ứng $H_2(g) + Br_2(g) \\to 2HBr(g)$ là", "options": ["A. $-103$ kJ.", "B. $+103$ kJ.", "C. $-206$ kJ.", "D. $+629$ kJ."], "answer": "A", "explain": "$\\Delta_rH = (436 + 193) - 2 \\times 366 = 629 - 732 = -103$ kJ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về điều kiện chuẩn:", "statements": ["a) Ở điều kiện chuẩn, áp suất đối với chất khí là 1 bar.", "b) Ở điều kiện chuẩn, nồng độ chất tan trong dung dịch là 1 mol/L.", "c) Nhiệt tạo thành chuẩn của $C$ (kim cương) bằng 0.", "d) Đơn chất bền nhất của carbon là graphite."], "answer": ["T", "T", "F", "T"], "explain": "a), b) Đúng theo định nghĩa điều kiện chuẩn. c) Sai: đơn chất bền nhất của carbon là graphite (kim cương là dạng kém bền hơn) nên $\\Delta_fH^{o}_{298}(graphite) = 0$, còn kim cương có giá trị dương nhỏ. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho phản ứng $2SO_2(g) + O_2(g) \\to 2SO_3(g)$. Biết $\\Delta_fH^{o}_{298}(SO_2(g)) = -296{,}8$ kJ/mol; $\\Delta_fH^{o}_{298}(SO_3(g)) = -395{,}7$ kJ/mol. Xét các phát biểu:", "statements": ["a) $\\Delta_rH^{o}_{298} = 2 \\times (-395{,}7) - 2 \\times (-296{,}8)$.", "b) $\\Delta_rH^{o}_{298} = -197{,}8$ kJ.", "c) Phản ứng này là phản ứng tỏa nhiệt.", "d) Nếu chỉ dùng 1 mol $SO_2$ thì nhiệt tỏa ra là 197,8 kJ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng công thức Hess ($O_2$ là đơn chất nên không viết). b) Đúng: $-791{,}4 + 593{,}6 = -197{,}8$ kJ. c) Đúng vì $\\Delta_rH \\lt 0$. d) Sai: phương trình ghi 2 mol $SO_2$ tỏa 197,8 kJ nên 1 mol $SO_2$ chỉ tỏa $98{,}9$ kJ.", "points": 1}, {"type": "short", "level": "VD", "q": "Tính $\\Delta_rH^{o}_{298}$ (kJ) của phản ứng $2SO_2(g) + O_2(g) \\to 2SO_3(g)$. Cho $\\Delta_fH^{o}_{298}(SO_2(g)) = -296{,}8$ kJ/mol; $\\Delta_fH^{o}_{298}(SO_3(g)) = -395{,}7$ kJ/mol.", "answer": "-197,8", "explain": "$\\Delta_rH^{o}_{298} = 2 \\times (-395{,}7) - [2 \\times (-296{,}8) + 0] = -791{,}4 + 593{,}6 = -197{,}8$ kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cần đốt cháy bao nhiêu gam $CH_4$ ($M = 16$) để thu được 4451,5 kJ nhiệt? Biết $CH_4(g) + 2O_2(g) \\to CO_2(g) + 2H_2O(l)$ có $\\Delta_rH^{o}_{298} = -890{,}3$ kJ.", "answer": "80", "explain": "$n_{CH_4} = 4451{,}5/890{,}3 = 5$ mol; $m = 5 \\times 16 = 80$ g.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Đơn chất bền nhất của carbon ở điều kiện chuẩn là", "options": ["A. kim cương.", "B. graphite.", "C. fullerene.", "D. than chì nhân tạo."], "answer": "B", "explain": "Graphite là dạng đơn chất bền nhất của carbon nên $\\Delta_fH^{o}_{298}(graphite) = 0$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phản ứng nổ $2H_2(g) + O_2(g) \\to 2H_2O(l)$ là phản ứng", "options": ["A. thu nhiệt.", "B. tỏa nhiệt.", "C. không tỏa cũng không thu nhiệt.", "D. thuận nghịch."], "answer": "B", "explain": "Phản ứng nổ của hydrogen tỏa ra một lượng nhiệt rất lớn nên là phản ứng tỏa nhiệt ($\\Delta_rH \\lt 0$).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi $\\Delta_rH \\lt 0$ thì", "options": ["A. hệ nhận năng lượng từ môi trường, nhiệt độ môi trường giảm.", "B. hệ mất năng lượng ra môi trường, nhiệt độ môi trường tăng.", "C. năng lượng của hệ không đổi.", "D. phản ứng không thể xảy ra."], "answer": "B", "explain": "$\\Delta_rH \\lt 0$ là phản ứng tỏa nhiệt: hệ giải phóng năng lượng ra môi trường làm nhiệt độ môi trường tăng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dãy nào sau đây gồm các phản ứng tỏa nhiệt?", "options": ["A. Đốt cháy than, nhiệt phân $CaCO_3$, quang hợp.", "B. Đốt cháy khí thiên nhiên, phản ứng trung hòa, đốt cháy cồn.", "C. Nhiệt phân $KClO_3$, nung vôi, quang hợp.", "D. Hòa tan $NH_4NO_3$ trong nước, nhiệt phân $CaCO_3$, đốt cháy than."], "answer": "B", "explain": "Đốt cháy nhiên liệu và phản ứng trung hòa đều tỏa nhiệt. Các phương án còn lại chứa phản ứng thu nhiệt (nhiệt phân $CaCO_3$, quang hợp, hòa tan $NH_4NO_3$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biết $\\Delta_fH^{o}_{298}(CO_2(g)) = -393{,}5$ kJ/mol. Biến thiên enthalpy chuẩn của phản ứng $C(graphite) + O_2(g) \\to CO_2(g)$ là", "options": ["A. $-393{,}5$ kJ.", "B. $+393{,}5$ kJ.", "C. $-787{,}0$ kJ.", "D. $0$ kJ."], "answer": "A", "explain": "Phản ứng này chính là phản ứng tạo thành 1 mol $CO_2$ từ đơn chất bền nhất nên $\\Delta_rH^{o}_{298} = \\Delta_fH^{o}_{298}(CO_2) = -393{,}5$ kJ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho: (1) $C(graphite) + O_2(g) \\to CO_2(g)$, $\\Delta_rH_1 = -393{,}5$ kJ; (2) $CO(g) + \\frac{1}{2}O_2(g) \\to CO_2(g)$, $\\Delta_rH_2 = -283{,}0$ kJ. Giá trị $\\Delta_rH$ của phản ứng $C(graphite) + \\frac{1}{2}O_2(g) \\to CO(g)$ là", "options": ["A. $-110{,}5$ kJ.", "B. $-676{,}5$ kJ.", "C. $+110{,}5$ kJ.", "D. $-283{,}0$ kJ."], "answer": "A", "explain": "Lấy (1) trừ (2): $\\Delta_rH = -393{,}5 - (-283{,}0) = -110{,}5$ kJ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu sau về enthalpy:", "statements": ["a) Biến thiên enthalpy $\\Delta_rH$ cho biết phản ứng tỏa nhiệt hay thu nhiệt.", "b) $\\Delta_rH \\lt 0$: phản ứng tỏa nhiệt; $\\Delta_rH \\gt 0$: phản ứng thu nhiệt.", "c) Đơn vị của $\\Delta_rH$ là kJ.", "d) $\\Delta_rH$ không phụ thuộc vào lượng chất tham gia phản ứng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $\\Delta_rH$ tỉ lệ với lượng chất (đốt 2 mol $CH_4$ tỏa gấp đôi 1 mol).", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho phản ứng $H_2(g) + I_2(g) \\to 2HI(g)$ với $E_b(H{-}H) = 436$, $E_b(I{-}I) = 151$, $E_b(H{-}I) = 299$ (kJ/mol). Xét các phát biểu:", "statements": ["a) Năng lượng cần để phá vỡ liên kết của 1 mol $H_2$ và 1 mol $I_2$ là 587 kJ.", "b) Năng lượng tỏa ra khi tạo thành 2 mol $HI$ là 598 kJ.", "c) $\\Delta_rH = -11$ kJ.", "d) Phản ứng tỏa nhiệt yếu."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $436 + 151 = 587$ kJ. b) Đúng: $2 \\times 299 = 598$ kJ. c) Đúng: $587 - 598 = -11$ kJ. d) Đúng: $|\\Delta_rH|$ nhỏ nên nhiệt tỏa ra ít.", "points": 1}, {"type": "short", "level": "VD", "q": "Tính $\\Delta_rH^{o}_{298}$ (kJ) của phản ứng $4NH_3(g) + 3O_2(g) \\to 2N_2(g) + 6H_2O(g)$. Cho $\\Delta_fH^{o}_{298}(NH_3(g)) = -45{,}9$ kJ/mol; $\\Delta_fH^{o}_{298}(H_2O(g)) = -241{,}8$ kJ/mol.", "answer": "-1267,2", "explain": "$\\Delta_rH^{o}_{298} = 6 \\times (-241{,}8) - 4 \\times (-45{,}9) = -1450{,}8 + 183{,}6 = -1267{,}2$ kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hòa tan 8,0 gam $NH_4NO_3$ ($M = 80$) trong nước, dung dịch thu vào 2,57 kJ nhiệt từ môi trường (phản ứng thu nhiệt). Tính biến thiên enthalpy hòa tan chuẩn của $NH_4NO_3$ (kJ/mol, làm tròn đến 1 chữ số thập phân).", "answer": "25,7", "explain": "$n = 8/80 = 0{,}1$ mol thu 2,57 kJ nên 1 mol thu $2{,}57/0{,}1 = 25{,}7$ kJ; $\\Delta_{sol}H = +25{,}7$ kJ/mol.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Khi phá vỡ liên kết hóa học trong phân tử ở thể khí", "options": ["A. luôn tỏa năng lượng ra môi trường.", "B. luôn cần cung cấp năng lượng từ môi trường.", "C. không có sự thay đổi năng lượng.", "D. vừa tỏa vừa thu năng lượng."], "answer": "B", "explain": "Phá vỡ liên kết cần cung cấp năng lượng (thu nhiệt); ngược lại, hình thành liên kết mới tỏa năng lượng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi các nguyên tử ở thể khí kết hợp với nhau để hình thành liên kết hóa học mới thì", "options": ["A. hệ hấp thụ năng lượng.", "B. hệ giải phóng năng lượng.", "C. năng lượng của hệ không đổi.", "D. cần đun nóng liên tục."], "answer": "B", "explain": "Hình thành liên kết mới giải phóng năng lượng ra môi trường (tỏa nhiệt).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ví dụ nào sau đây về ứng dụng phản ứng tỏa nhiệt trong đời sống là đúng?", "options": ["A. Dùng đá khô để bảo quản thực phẩm.", "B. Đốt gas để nấu ăn.", "C. Dùng túi chườm lạnh khi bị bong gân.", "D. Quang hợp của cây xanh."], "answer": "B", "explain": "Đốt gas (khí thiên nhiên) là phản ứng tỏa nhiệt, cung cấp nhiệt để nấu ăn. Đá khô thăng hoa và túi chườm lạnh dùng quá trình thu nhiệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh $E_b(H{-}H) = 436$ kJ/mol và $E_b(H{-}I) = 299$ kJ/mol, nhận xét nào đúng?", "options": ["A. Liên kết $H{-}H$ bền hơn liên kết $H{-}I$.", "B. Liên kết $H{-}I$ bền hơn liên kết $H{-}H$.", "C. Hai liên kết bền như nhau.", "D. Không so sánh được."], "answer": "A", "explain": "$E_b$ càng lớn thì liên kết càng bền (cần nhiều năng lượng hơn để phá vỡ).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $CaCO_3(s) \\to CaO(s) + CO_2(g)$ có $\\Delta_rH^{o}_{298} = +179$ kJ. Phát biểu nào sau đây đúng?", "options": ["A. Đây là phản ứng tỏa nhiệt.", "B. Đây là phản ứng thu nhiệt, cần cung cấp 179 kJ cho mỗi mol $CaCO_3$ bị nhiệt phân.", "C. Phản ứng tự xảy ra ở nhiệt độ thường.", "D. Năng lượng của hệ giảm 179 kJ."], "answer": "B", "explain": "$\\Delta_rH \\gt 0$ nên là phản ứng thu nhiệt: cần cung cấp 179 kJ để nhiệt phân 1 mol $CaCO_3$, năng lượng của hệ tăng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tính $\\Delta_rH$ (kJ) của phản ứng $CH_4(g) + 2O_2(g) \\to CO_2(g) + 2H_2O$ (nước ở thể khí) theo năng lượng liên kết. Cho: $E_b(C{-}H) = 413$, $E_b(O{=}O) = 498$, $E_b(C{=}O) = 799$, $E_b(O{-}H) = 463$ (kJ/mol).", "options": ["A. $-802$ kJ.", "B. $+802$ kJ.", "C. $-890$ kJ.", "D. $-3450$ kJ."], "answer": "A", "explain": "Phá vỡ: $4 \\times 413 + 2 \\times 498 = 2648$ kJ; hình thành: $2 \\times 799 + 4 \\times 463 = 3450$ kJ; $\\Delta_rH = 2648 - 3450 = -802$ kJ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về định luật Hess:", "statements": ["a) $\\Delta_rH^{o}_{298}$ của phản ứng chỉ phụ thuộc vào trạng thái đầu và trạng thái cuối, không phụ thuộc đường đi.", "b) Có thể cộng, trừ các phương trình nhiệt hóa học như các phương trình đại số.", "c) Khi đảo ngược phương trình hóa học, $\\Delta_rH$ đổi dấu.", "d) Khi nhân hệ số phương trình với 2 thì $\\Delta_rH$ không đổi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: đây là nội dung của định luật Hess. d) Sai: nhân hệ số với 2 thì $\\Delta_rH$ cũng nhân 2.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Nhiên liệu $X$, $Y$, $Z$ có nhiệt cháy chuẩn (kJ/mol) lần lượt là $-285{,}8$; $-890{,}3$; $-1366{,}8$. Xét các phát biểu:", "statements": ["a) Khi đốt 1 mol, $Z$ tỏa nhiều nhiệt nhất.", "b) Cả ba quá trình đốt cháy đều là phản ứng tỏa nhiệt.", "c) Nếu đốt cùng khối lượng thì chưa thể kết luận chất nào tỏa nhiệt nhiều nhất.", "d) Nhiệt cháy càng âm (giá trị tuyệt đối càng lớn) thì nhiên liệu càng kém hiệu quả."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $1366{,}8$ lớn nhất. b) Đúng: $\\Delta_rH \\lt 0$. c) Đúng: phải tính trên cùng khối lượng (chia cho khối lượng mol). d) Sai: giá trị tuyệt đối càng lớn thì tỏa nhiệt càng nhiều, càng hiệu quả về mặt năng lượng.", "points": 1}, {"type": "short", "level": "VD", "q": "Có bao nhiêu mol liên kết $O{-}H$ trong 2 mol phân tử $H_2O$?", "answer": "4", "explain": "Mỗi phân tử $H_2O$ có 2 liên kết $O{-}H$ nên 2 mol $H_2O$ có $2 \\times 2 = 4$ mol liên kết $O{-}H$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đốt cháy hoàn toàn 5,6 lít khí $CH_4$ (đktc). Biết $CH_4(g) + 2O_2(g) \\to CO_2(g) + 2H_2O(l)$ có $\\Delta_rH^{o}_{298} = -890{,}3$ kJ. Tính nhiệt lượng tỏa ra (kJ, làm tròn đến 2 chữ số thập phân).", "answer": "222,58", "explain": "$n_{CH_4} = 5{,}6/22{,}4 = 0{,}25$ mol; $Q = 0{,}25 \\times 890{,}3 = 222{,}575 \\approx 222{,}58$ kJ.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Biết $\\Delta_fH^{o}_{298}(CO_2(g)) = -393{,}5$ kJ/mol. Phát biểu nào sau đây đúng?", "options": ["A. Tạo thành 1 mol $CO_2(g)$ từ $C$ (graphite) và $O_2(g)$ tỏa ra 393,5 kJ.", "B. Tạo thành 1 mol $CO_2(g)$ từ $C$ (graphite) và $O_2(g)$ thu vào 393,5 kJ.", "C. Đốt cháy 1 mol $CO_2$ tỏa ra 393,5 kJ.", "D. Nhiệt phân 1 mol $CO_2$ cần 393,5 kJ."], "answer": "A", "explain": "$\\Delta_fH^{o}_{298}$ âm nghĩa là quá trình tạo thành 1 mol chất từ đơn chất bền nhất tỏa nhiệt (393,5 kJ).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phản ứng có $\\Delta_rH \\gt 0$ thì", "options": ["A. là phản ứng tỏa nhiệt.", "B. là phản ứng thu nhiệt.", "C. không xảy ra được.", "D. là phản ứng trung hòa."], "answer": "B", "explain": "$\\Delta_rH \\gt 0$: hệ hấp thụ năng lượng từ môi trường, là phản ứng thu nhiệt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đơn vị của năng lượng liên kết $E_b$ là", "options": ["A. kJ.", "B. kJ/mol.", "C. J.", "D. kJ/mol phản ứng."], "answer": "B", "explain": "$E_b$ là năng lượng tính cho 1 mol liên kết nên đơn vị là kJ/mol.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các chất sau, chất có $\\Delta_fH^{o}_{298} = 0$ là", "options": ["A. $H_2O(l)$.", "B. $CO_2(g)$.", "C. $N_2(g)$.", "D. $NH_3(g)$."], "answer": "C", "explain": "$N_2(g)$ là đơn chất bền nhất của nitrogen nên $\\Delta_fH^{o}_{298} = 0$; các chất còn lại là hợp chất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đốt cháy hoàn toàn 12 gam $C$ (graphite) ($M = 12$). Biết $C(graphite) + O_2(g) \\to CO_2(g)$ có $\\Delta_rH^{o}_{298} = -393{,}5$ kJ. Nhiệt lượng tỏa ra là", "options": ["A. 393,5 kJ.", "B. 196,75 kJ.", "C. 787,0 kJ.", "D. 32,8 kJ."], "answer": "A", "explain": "$n_C = 12/12 = 1$ mol nên nhiệt tỏa ra đúng bằng $393{,}5$ kJ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Biết $CH_4(g) + 2O_2(g) \\to CO_2(g) + 2H_2O(g)$ có $\\Delta_rH^{o}_{298} = -802{,}5$ kJ. Cho $E_b(O{=}O) = 498$, $E_b(C{=}O) = 799$, $E_b(O{-}H) = 463$ (kJ/mol). Năng lượng liên kết trung bình của liên kết $C{-}H$ là", "options": ["A. 413 kJ/mol.", "B. 1652 kJ/mol.", "C. 826 kJ/mol.", "D. 206 kJ/mol."], "answer": "A", "explain": "Gọi $x = E_b(C{-}H)$: $4x + 2 \\times 498 - (2 \\times 799 + 4 \\times 463) = -802{,}5 \\Rightarrow 4x = 1651{,}5 \\Rightarrow x \\approx 413$ kJ/mol.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Phản ứng tỏa nhiệt có mức năng lượng của sản phẩm thấp hơn chất đầu.", "b) Phản ứng thu nhiệt có mức năng lượng của sản phẩm cao hơn chất đầu.", "c) $\\Delta_rH$ bằng hiệu số năng lượng của sản phẩm và chất đầu.", "d) Phản ứng tỏa nhiệt không bao giờ cần đun nóng để bắt đầu."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo sơ đồ năng lượng. d) Sai: nhiều phản ứng tỏa nhiệt (như đốt cháy) vẫn cần mồi lửa/đun nóng ban đầu để vượt năng lượng hoạt hóa.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho sơ đồ năng lượng: chất đầu ở mức cao hơn sản phẩm, mũi tên $\\Delta_rH$ hướng xuống. Xét các phát biểu:", "statements": ["a) Đây là sơ đồ của phản ứng tỏa nhiệt.", "b) $\\Delta_rH \\lt 0$ trong trường hợp này.", "c) Nếu đảo ngược quá trình (từ sản phẩm thành chất đầu) thì $\\Delta_rH$ đổi dấu.", "d) Giá trị $\\Delta_rH$ trong sơ đồ không phụ thuộc lượng chất."], "answer": ["T", "T", "T", "F"], "explain": "a), b) Đúng: năng lượng giảm dần nên tỏa nhiệt, $\\Delta_rH \\lt 0$. c) Đúng theo định luật Hess. d) Sai: $\\Delta_rH$ ghi trên sơ đồ ứng với đúng lượng chất theo phương trình.", "points": 1}, {"type": "short", "level": "VD", "q": "Tính $\\Delta_rH^{o}_{298}$ (kJ) của phản ứng $2H_2S(g) + 3O_2(g) \\to 2SO_2(g) + 2H_2O(l)$. Cho $\\Delta_fH^{o}_{298}(H_2S(g)) = -20{,}7$ kJ/mol; $\\Delta_fH^{o}_{298}(SO_2(g)) = -296{,}8$ kJ/mol; $\\Delta_fH^{o}_{298}(H_2O(l)) = -285{,}8$ kJ/mol.", "answer": "-1123,8", "explain": "$\\Delta_rH^{o}_{298} = [2 \\times (-296{,}8) + 2 \\times (-285{,}8)] - 2 \\times (-20{,}7) = -1165{,}2 + 41{,}4 = -1123{,}8$ kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cần cung cấp bao nhiêu kJ nhiệt để nhiệt phân hoàn toàn 200 gam $CaCO_3$ ($M = 100$)? Biết $CaCO_3(s) \\to CaO(s) + CO_2(g)$ có $\\Delta_rH^{o}_{298} = +179$ kJ.", "answer": "358", "explain": "$n_{CaCO_3} = 200/100 = 2$ mol; nhiệt cần $= 2 \\times 179 = 358$ kJ.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Đại lượng $\\Delta_rH$ được gọi là", "options": ["A. nhiệt tạo thành chuẩn.", "B. biến thiên enthalpy của phản ứng.", "C. năng lượng liên kết.", "D. nhiệt cháy."], "answer": "B", "explain": "$\\Delta_rH$ là biến thiên enthalpy (nhiệt phản ứng) của phản ứng hóa học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhiệt độ chuẩn được lấy là 298 K, tương ứng với", "options": ["A. $0^\\circ C$.", "B. $25^\\circ C$.", "C. $100^\\circ C$.", "D. $273^\\circ C$."], "answer": "B", "explain": "$298 K = 25^\\circ C$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phản ứng nung vôi ($CaCO_3 \\to CaO + CO_2$) trong công nghiệp là phản ứng", "options": ["A. tỏa nhiệt.", "B. thu nhiệt.", "C. không có biến thiên năng lượng.", "D. tự xảy ra ở nhiệt độ thường."], "answer": "B", "explain": "Nhiệt phân $CaCO_3$ có $\\Delta_rH^{o}_{298} = +179$ kJ nên là phản ứng thu nhiệt, phải nung nóng liên tục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây về nhiệt tạo thành chuẩn là đúng?", "options": ["A. Là biến thiên enthalpy khi tạo thành 1 mol chất từ các đơn chất bền nhất ở điều kiện chuẩn.", "B. Là nhiệt lượng tỏa ra khi đốt cháy 1 mol chất.", "C. Luôn có giá trị dương.", "D. Chỉ áp dụng cho chất khí."], "answer": "A", "explain": "Đúng định nghĩa $\\Delta_fH^{o}_{298}$; giá trị có thể âm hoặc dương; áp dụng cho mọi trạng thái.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biết $\\Delta_fH^{o}_{298}(H_2O(l)) = -285{,}8$ kJ/mol. Biến thiên enthalpy chuẩn của phản ứng $H_2(g) + \\frac{1}{2}O_2(g) \\to H_2O(l)$ là", "options": ["A. $-285{,}8$ kJ.", "B. $-571{,}6$ kJ.", "C. $+285{,}8$ kJ.", "D. $-142{,}9$ kJ."], "answer": "A", "explain": "Phản ứng tạo thành đúng 1 mol $H_2O(l)$ từ đơn chất nên $\\Delta_rH^{o}_{298} = \\Delta_fH^{o}_{298}(H_2O(l)) = -285{,}8$ kJ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho phản ứng: $Fe_2O_3(s) + 3CO(g) \\to 2Fe(s) + 3CO_2(g)$. Biết $\\Delta_fH^{o}_{298}(Fe_2O_3(s)) = -824{,}2$ kJ/mol; $\\Delta_fH^{o}_{298}(CO(g)) = -110{,}5$ kJ/mol; $\\Delta_fH^{o}_{298}(CO_2(g)) = -393{,}5$ kJ/mol. Giá trị $\\Delta_rH^{o}_{298}$ là", "options": ["A. $-24{,}8$ kJ.", "B. $+24{,}8$ kJ.", "C. $-507{,}7$ kJ.", "D. $-1180{,}5$ kJ."], "answer": "A", "explain": "$\\Delta_rH^{o}_{298} = 3 \\times (-393{,}5) - [(-824{,}2) + 3 \\times (-110{,}5)] = -1180{,}5 + 1155{,}7 = -24{,}8$ kJ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về năng lượng liên kết:", "statements": ["a) $E_b$ càng lớn thì liên kết càng khó bị phá vỡ.", "b) Phá vỡ liên kết là quá trình thu nhiệt.", "c) Hình thành liên kết là quá trình tỏa nhiệt.", "d) $E_b$ được xác định cho phân tử ở thể khí bị tách thành các nguyên tử ở thể khí."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn phát biểu đều đúng theo định nghĩa và bản chất của năng lượng liên kết.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho hai cách tính $\\Delta_rH^{o}_{298}$ của cùng một phản ứng: theo nhiệt tạo thành chuẩn được $-890{,}3$ kJ; theo năng lượng liên kết (sản phẩm nước ở thể khí) được $-802$ kJ. Xét các phát biểu:", "statements": ["a) Hai kết quả khác nhau là do trạng thái của nước trong sản phẩm khác nhau ($l$ và $g$).", "b) Cả hai cách tính đều cho thấy phản ứng tỏa nhiệt.", "c) Năng lượng liên kết là giá trị trung bình nên kết quả chỉ gần đúng.", "d) Chỉ có cách tính theo nhiệt tạo thành chuẩn là đúng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: một cách tính cho $H_2O(l)$, một cách cho $H_2O(g)$. b) Đúng: cả hai đều âm. c) Đúng: $E_b$ là giá trị trung bình thực nghiệm. d) Sai: cả hai cách đều đúng, chỉ khác về độ chính xác và trạng thái chất.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho $E_b(H{-}H) = 436$ kJ/mol. Tính năng lượng (kJ) cần để phá vỡ hoàn toàn liên kết trong 2 mol phân tử $H_2$ ở thể khí.", "answer": "872", "explain": "Mỗi mol $H_2$ có 1 mol liên kết $H{-}H$; năng lượng cần $= 2 \\times 436 = 872$ kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đốt cháy hoàn toàn $m$ gam than (coi như carbon nguyên chất, $M = 12$) tỏa ra 1967,5 kJ nhiệt. Biết $C(graphite) + O_2(g) \\to CO_2(g)$ có $\\Delta_rH^{o}_{298} = -393{,}5$ kJ. Tính $m$ (gam).", "answer": "60", "explain": "$n_C = 1967{,}5/393{,}5 = 5$ mol; $m = 5 \\times 12 = 60$ g.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Phản ứng thu nhiệt làm cho nhiệt độ của môi trường xung quanh", "options": ["A. tăng lên.", "B. giảm xuống.", "C. không thay đổi.", "D. tăng rồi giảm."], "answer": "B", "explain": "Phản ứng thu nhiệt lấy nhiệt từ môi trường nên nhiệt độ môi trường giảm xuống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Túi chườm nóng sử dụng trong y tế hoạt động dựa trên", "options": ["A. phản ứng tỏa nhiệt.", "B. phản ứng thu nhiệt.", "C. sự thăng hoa của đá khô.", "D. sự bay hơi của nước."], "answer": "A", "explain": "Túi chườm nóng giải phóng nhiệt ra ngoài nhờ phản ứng tỏa nhiệt (ví dụ oxi hóa bột sắt).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phản ứng có $\\Delta_rH^{o}_{298} \\lt 0$ là phản ứng", "options": ["A. thu nhiệt.", "B. tỏa nhiệt.", "C. không xảy ra.", "D. thuận nghịch."], "answer": "B", "explain": "$\\Delta_rH \\lt 0$: hệ mất năng lượng ra môi trường, là phản ứng tỏa nhiệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhiệt cháy chuẩn (kJ/mol) của $H_2(g)$, $CH_4(g)$, $C_2H_5OH(l)$ lần lượt là $-285{,}8$; $-890{,}3$; $-1366{,}8$. Khi đốt 1 mol mỗi chất, thứ tự nhiệt lượng tỏa ra tăng dần là", "options": ["A. $H_2 \\lt CH_4 \\lt C_2H_5OH$.", "B. $C_2H_5OH \\lt CH_4 \\lt H_2$.", "C. $CH_4 \\lt H_2 \\lt C_2H_5OH$.", "D. $H_2 \\lt C_2H_5OH \\lt CH_4$."], "answer": "A", "explain": "So sánh giá trị tuyệt đối: $285{,}8 \\lt 890{,}3 \\lt 1366{,}8$ nên nhiệt tỏa ra tăng dần theo thứ tự $H_2$, $CH_4$, $C_2H_5OH$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây là đúng?", "options": ["A. Phá vỡ liên kết hóa học tỏa năng lượng.", "B. Hình thành liên kết hóa học cần cung cấp năng lượng.", "C. Phá vỡ liên kết hóa học cần cung cấp năng lượng, hình thành liên kết mới giải phóng năng lượng.", "D. Năng lượng liên kết không liên quan đến $\\Delta_rH$."], "answer": "C", "explain": "Phá vỡ liên kết thu nhiệt, hình thành liên kết tỏa nhiệt; hiệu hai quá trình này quyết định $\\Delta_rH$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Biết $CH_4(g) + 2O_2(g) \\to CO_2(g) + 2H_2O(l)$ có $\\Delta_rH^{o}_{298} = -890{,}3$ kJ; $\\Delta_fH^{o}_{298}(CO_2(g)) = -393{,}5$ kJ/mol; $\\Delta_fH^{o}_{298}(H_2O(l)) = -285{,}8$ kJ/mol. Nhiệt tạo thành chuẩn của $CH_4(g)$ (kJ/mol) tính theo số liệu đã cho là", "options": ["A. $-74{,}8$.", "B. $-890{,}3$.", "C. $+74{,}8$.", "D. $-965{,}1$."], "answer": "A", "explain": "$-890{,}3 = [(-393{,}5) + 2 \\times (-285{,}8)] - \\Delta_fH^{o}_{298}(CH_4) \\Rightarrow \\Delta_fH^{o}_{298}(CH_4) = -965{,}1 + 890{,}3 = -74{,}8$ kJ/mol.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về ứng dụng của biến thiên enthalpy:", "statements": ["a) Người ta so sánh hiệu quả năng lượng của các nhiên liệu dựa vào nhiệt cháy (giá trị tuyệt đối của $\\Delta_rH$).", "b) Năng lượng từ thức ăn của con người có thể tính qua nhiệt cháy của các chất dinh dưỡng.", "c) Trong công nghiệp, cần tính toán năng lượng cung cấp cho các lò nung phản ứng thu nhiệt.", "d) Hydrogen được xem là nhiên liệu sạch vì khi cháy chỉ tạo ra $CO_2$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đốt cháy hydrogen chỉ tạo ra $H_2O$, không tạo $CO_2$ — đó chính là ưu điểm sạch của nó.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho $\\Delta_fH^{o}_{298}(NaCl(s)) = -411{,}2$ kJ/mol; $\\Delta_fH^{o}_{298}(HCl(g)) = -92{,}3$ kJ/mol. Xét phản ứng $Na(s) + \\frac{1}{2}Cl_2(g) \\to NaCl(s)$. Các phát biểu:", "statements": ["a) $\\Delta_rH^{o}_{298}$ của phản ứng bằng $-411{,}2$ kJ.", "b) Phản ứng này là phản ứng tỏa nhiệt.", "c) $\\Delta_fH^{o}_{298}(Na(s)) = 0$ và $\\Delta_fH^{o}_{298}(Cl_2(g)) = 0$.", "d) Tạo thành 2 mol $NaCl(s)$ từ đơn chất sẽ tỏa ra 822,4 kJ."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: phản ứng tạo 1 mol $NaCl$ từ đơn chất bền nhất. b) Đúng vì $\\Delta_rH \\lt 0$. c) Đúng theo quy ước. d) Đúng: $2 \\times 411{,}2 = 822{,}4$ kJ.", "points": 1}, {"type": "short", "level": "VD", "q": "Phản ứng $H_2(g) + Cl_2(g) \\to 2HCl(g)$ có $\\Delta_rH^{o}_{298} = -184{,}6$ kJ. Khi tạo thành 2 mol khí $HCl$ từ các đơn chất thì nhiệt lượng tỏa ra là bao nhiêu kJ?", "answer": "184,6", "explain": "Phương trình đã ứng với tạo thành đúng 2 mol $HCl$ nên nhiệt tỏa ra $= |-184{,}6| = 184{,}6$ kJ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trộn 100 mL dung dịch $NaOH$ 1M với 100 mL dung dịch $HCl$ 1M. Biết $NaOH(aq) + HCl(aq) \\to NaCl(aq) + H_2O(l)$ có $\\Delta_rH = -57{,}6$ kJ. Tính nhiệt lượng tỏa ra (kJ, làm tròn đến 2 chữ số thập phân).", "answer": "5,76", "explain": "$n_{NaOH} = n_{HCl} = 0{,}1$ mol, phản ứng vừa đủ tạo 0,1 mol $H_2O$; $Q = 0{,}1 \\times 57{,}6 = 5{,}76$ kJ.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Enthalpy là đại lượng đặc trưng cho", "options": ["A. tốc độ của phản ứng hóa học.", "B. năng lượng nhiệt của hệ ở áp suất không đổi.", "C. khối lượng của hệ phản ứng.", "D. số mol chất tham gia phản ứng."], "answer": "B", "explain": "Enthalpy (H) là hàm trạng thái đặc trưng cho năng lượng nhiệt của hệ ở áp suất không đổi; biến thiên của nó ($\\Delta_rH$) cho biết nhiệt phản ứng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong phản ứng tỏa nhiệt, mức năng lượng của sản phẩm so với chất đầu thì", "options": ["A. cao hơn.", "B. thấp hơn.", "C. bằng nhau.", "D. không so sánh được."], "answer": "B", "explain": "Phản ứng tỏa nhiệt: hệ mất năng lượng nên sản phẩm ở mức năng lượng thấp hơn chất đầu ($\\Delta_rH \\lt 0$).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Năng lượng liên kết được kí hiệu là", "options": ["A. $\\Delta_rH$.", "B. $\\Delta_fH$.", "C. $E_b$.", "D. $Q$."], "answer": "C", "explain": "$E_b$ (bond energy) là kí hiệu của năng lượng liên kết.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ví dụ nào sau đây là phản ứng thu nhiệt?", "options": ["A. Đốt cháy cồn.", "B. Quang hợp ở cây xanh.", "C. Phản ứng trung hòa.", "D. Đốt cháy than."], "answer": "B", "explain": "Quang hợp hấp thụ năng lượng ánh sáng nên là quá trình thu nhiệt; các quá trình còn lại đều tỏa nhiệt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $NaOH(aq) + HCl(aq) \\to NaCl(aq) + H_2O(l)$ có $\\Delta_rH = -57{,}6$ kJ. Khi trung hòa 0,5 mol $NaOH$ bằng $HCl$ dư thì nhiệt lượng tỏa ra là", "options": ["A. 57,6 kJ.", "B. 28,8 kJ.", "C. 115,2 kJ.", "D. 14,4 kJ."], "answer": "B", "explain": "Mỗi mol $NaOH$ tạo 1 mol $H_2O$ tỏa 57,6 kJ; 0,5 mol tỏa $0{,}5 \\times 57{,}6 = 28{,}8$ kJ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Biết $\\Delta_fH^{o}_{298}(C_2H_5OH(l)) = -277{,}6$ kJ/mol; $\\Delta_fH^{o}_{298}(CO_2(g)) = -393{,}5$ kJ/mol; $\\Delta_fH^{o}_{298}(H_2O(l)) = -285{,}8$ kJ/mol. Biến thiên enthalpy chuẩn của phản ứng $C_2H_5OH(l) + 3O_2(g) \\to 2CO_2(g) + 3H_2O(l)$ là", "options": ["A. $-1366{,}8$ kJ.", "B. $-1644{,}4$ kJ.", "C. $+1366{,}8$ kJ.", "D. $-1089{,}2$ kJ."], "answer": "A", "explain": "$\\Delta_rH^{o}_{298} = [2 \\times (-393{,}5) + 3 \\times (-285{,}8)] - (-277{,}6) = -1644{,}4 + 277{,}6 = -1366{,}8$ kJ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Mọi phản ứng hóa học đều kèm theo sự thay đổi năng lượng của hệ.", "b) Dấu của $\\Delta_rH$ cho biết phản ứng tỏa nhiệt hay thu nhiệt.", "c) Phản ứng tỏa nhiệt có thể cần đun nóng để bắt đầu.", "d) $\\Delta_rH^{o}_{298}$ chỉ đúng khi các chất đều ở điều kiện chuẩn."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn phát biểu đều đúng: hầu hết phản ứng đều có biến thiên năng lượng; dấu $\\Delta_rH$ phân biệt tỏa/thu nhiệt; phản ứng tỏa nhiệt vẫn có thể cần năng lượng hoạt hóa ban đầu; chỉ số $^{o}_{298}$ gắn với điều kiện chuẩn.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho bảng $\\Delta_fH^{o}_{298}$ (kJ/mol): $CH_4(g)$: $-74{,}6$; $CO(g)$: $-110{,}5$; $CO_2(g)$: $-393{,}5$; $H_2O(l)$: $-285{,}8$. Xét các phát biểu:", "statements": ["a) $\\Delta_rH^{o}_{298}$ của $CH_4(g) + 2O_2(g) \\to CO_2(g) + 2H_2O(l)$ bằng $-890{,}3$ kJ.", "b) $\\Delta_rH^{o}_{298}$ của $2CO(g) + O_2(g) \\to 2CO_2(g)$ bằng $-566{,}0$ kJ.", "c) Cả hai phản ứng trên đều là phản ứng tỏa nhiệt.", "d) Đốt cháy 1 mol $CO$ tỏa nhiệt ít hơn đốt cháy 1 mol $CH_4$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $(-393{,}5 - 571{,}6) + 74{,}6 = -890{,}5 \\approx -890{,}3$ kJ (sai số làm tròn). b) Đúng: $2 \\times (-393{,}5) - 2 \\times (-110{,}5) = -566{,}0$ kJ. c) Đúng. d) Đúng: $283{,}0 \\lt 890{,}3$.", "points": 1}, {"type": "short", "level": "VD", "q": "Khi đốt cháy hoàn toàn 1 mol $CH_4$, có bao nhiêu mol liên kết $C{-}H$ bị phá vỡ?", "answer": "4", "explain": "Mỗi phân tử $CH_4$ có 4 liên kết $C{-}H$ nên 1 mol $CH_4$ có 4 mol liên kết $C{-}H$ bị phá vỡ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đốt cháy hoàn toàn 11,2 lít khí $C_3H_8$ (đktc). Biết $C_3H_8(g) + 5O_2(g) \\to 3CO_2(g) + 4H_2O(l)$ có $\\Delta_rH^{o}_{298} = -2220$ kJ. Tính nhiệt lượng tỏa ra (kJ).", "answer": "1110", "explain": "$n_{C_3H_8} = 11{,}2/22{,}4 = 0{,}5$ mol; $Q = 0{,}5 \\times 2220 = 1110$ kJ.", "points": 0.5}]}]}
