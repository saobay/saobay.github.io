{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Nội dung của định luật tuần hoàn là", "options": ["A. tính chất của các nguyên tố biến đổi liên tục theo chiều tăng của nguyên tử khối.", "B. tính chất của các nguyên tố và đơn chất, cũng như thành phần và tính chất của các hợp chất biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân.", "C. các nguyên tố được sắp xếp theo chiều tăng dần của nguyên tử khối.", "D. tính kim loại tăng dần theo chiều tăng của điện tích hạt nhân."], "answer": "B", "explain": "Định luật tuần hoàn: tính chất của các nguyên tố và đơn chất, cũng như thành phần và tính chất của các hợp chất tạo nên từ các nguyên tố đó, biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân nguyên tử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên nhân sâu xa của sự biến đổi tuần hoàn tính chất các nguyên tố là", "options": ["A. nguyên tử khối biến đổi tuần hoàn.", "B. cấu hình electron lớp ngoài cùng biến đổi tuần hoàn.", "C. số neutron biến đổi tuần hoàn.", "D. số khối biến đổi tuần hoàn."], "answer": "B", "explain": "Tính chất hóa học chủ yếu do electron lớp ngoài cùng quyết định. Cấu hình electron lớp ngoài cùng lặp lại một cách tuần hoàn nên tính chất cũng biến đổi tuần hoàn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biết nguyên tố X ở chu kì 3, nhóm IA. Dự đoán nào sau đây đúng về X?", "options": ["A. X là phi kim, tạo hợp chất khí với hydrogen.", "B. X là kim loại kiềm, oxide có công thức $X_2O$.", "C. X là khí hiếm.", "D. X là kim loại kiềm thổ, oxide có công thức $XO$."], "answer": "B", "explain": "Chu kì 3, nhóm IA là Na: kim loại kiềm, có 1 electron lớp ngoài cùng, tạo oxide $Na_2O$ (dạng $X_2O$) và hydroxide XOH (base mạnh).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh tính kim loại của $Na$ và $Mg$ (cùng chu kì 3). Kết luận đúng là", "options": ["A. Tính kim loại của $Na$ mạnh hơn của $Mg$.", "B. Tính kim loại của $Mg$ mạnh hơn của $Na$.", "C. Tính kim loại của hai VD", "q": "Cho biết: $X$ ở chu kì 3, nhóm VIIA; $Y$ ở chu kì 4, nhóm VIIA. So sánh tính oxi hóa của đơn chất $X_2$ và $Y_2$:", "options": ["A. Tính oxi hóa của $X_2$ mạnh hơn của $Y_2$.", "B. Tính oxi hóa của $Y_2$ mạnh hơn của $X_2$.", "C. Tính oxi hóa của hai đơn chất như nhau.", "D. Không so sánh được."], "answer": "A", "explain": "X là Cl, Y là Br, cùng nhóm VIIA. Trong nhóm A, đi từ trên xuống dưới tính phi kim (tính oxi hóa của đơn chất) giảm dần nên $Cl_2$ có tính oxi hóa mạnh hơn $Br_2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tố R thuộc nhóm IVA. Biết oxide cao nhất của R là oxide acid và R tạo được hợp chất khí với hydrogen. R có thể là nguyên tố nào sau đây?", "options": ["A. $C$ hoặc $Si$.", "B. $Sn$ hoặc $Pb$.", "C. Chỉ $C$.", "D. Chỉ $Si$."], "answer": "A", "explain": "Nhóm IVA gồm C, Si (phi kim, tạo oxide acid $CO_2, SiO_2$ và hợp chất khí $CH_4, SiH_4$) và Ge, Sn, Pb (tính kim loại tăng dần). R là phi kim tạo oxide acid và hợp chất khí với H nên R là C hoặc Si.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Các nguyên tố nhóm IA đều có 1 electron lớp ngoài cùng.", "b) Các nguyên tố nhóm IA đều là kim loại kiềm (trừ H).", "c) Tính chất hóa học của các kim loại kiềm tương tự nhau.", "d) Li là kim loại kiềm hoạt động mạnh nhất."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: số thứ tự nhóm A bằng số electron lớp ngoài cùng. b) Đúng: nhóm IA (trừ H) là kim loại kiềm. c) Đúng: cùng số electron lớp ngoài cùng nên tính chất tương tự. d) Sai: trong nhóm IA, tính kim loại tăng dần xuống dưới nên Cs (hoặc Fr) hoạt động mạnh nhất, Li yếu nhất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $F$ là phi kim hoạt động mạnh nhất.", "b) $Cl_2$ có tính oxi hóa mạnh hơn $Br_2$.", "c) $HI$ là acid mạnh hơn $HF$.", "d) Tính acid của các hydrogen halide tăng dần từ $HF$ đến $HI$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: F có độ âm điện lớn nhất. b) Đúng: trong nhóm VIIA, tính oxi hóa giảm dần xuống dưới. c) Đúng: liên kết H-I yếu hơn H-F nên dễ phân li $H^+$. d) Đúng: tính acid tăng dần từ HF đến HI.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X thuộc chu kì 3, có 7 electron lớp ngoài cùng. Viết công thức hợp chất khí của X với hydrogen.", "answer": "$HCl$", "explain": "X có 7 electron lớp ngoài cùng, chu kì 3 nên X là Cl (nhóm VIIA). Hợp chất khí với hydrogen là HCl.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các base sau theo chiều tăng dần của tính base: $KOH, NaOH, Mg(OH)_2$. (viết các công thức cách nhau bởi dấu cách)", "answer": "$Mg(OH)_2$ $NaOH$ $KOH$", "explain": "Trong chu kì 3: tính base giảm dần từ NaOH đến Mg(OH)2 nên $Mg(OH)_2$ yếu hơn NaOH. Trong nhóm IA: K ở dưới Na nên KOH có tính base mạnh hơn NaOH. Thứ tự tăng dần: $Mg(OH)_2$, NaOH, KOH.", "points": 0.5}]},
{"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Theo định luật tuần hoàn, tính chất của các nguyên tố biến đổi tuần hoàn theo chiều tăng của", "options": ["A. nguyên tử khối.", "B. điện tích hạt nhân nguyên tử.", "C. số neutron.", "D. số khối."], "answer": "B", "explain": "Định luật tuần hoàn (dạng hiện đại): tính chất biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân nguyên tử (số hiệu nguyên tử Z).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cấu hình electron lớp ngoài cùng của các nguyên tố nhóm VIIA là", "options": ["A. $ns^2np^3$.", "B. $ns^2np^4$.", "C. $ns^2np^5$.", "D. $ns^2np^6$."], "answer": "C", "explain": "Các nguyên tố nhóm VIIA có 7 electron lớp ngoài cùng với cấu hình $ns^2np^5$ (ví dụ F: $2s^22p^5$, Cl: $3s^23p^5$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ vị trí của nguyên tố $Ca$ (chu kì 4, nhóm IIA), dự đoán nào sau đây đúng?", "options": ["A. Ca là phi kim, tạo hợp chất khí với hydrogen.", "B. Ca là kim loại kiềm thổ, tạo oxide $CaO$ có tính base.", "C. Ca là khí hiếm.", "D. Ca là kim loại kiềm, tạo oxide $Ca_2O$."], "answer": "B", "explain": "Ca thuộc chu kì 4, nhóm IIA: có 2 electron lớp ngoài cùng nên là kim loại kiềm thổ; tạo oxide CaO (oxide base) và hydroxide $Ca(OH)_2$ (base).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh bán kính nguyên tử của $Al$ và $Si$ (cùng chu kì 3). Kết luận đúng là", "options": ["A. $r_{Al} \\gt r_{Si}$.", "B. $r_{Al} \\lt r_{Si}$.", "C. $r_{Al} = r_{Si}$.", "D. Không so sánh được."], "answer": "A", "explain": "Trong một chu kì, từ trái sang phải bán kính nguyên tử giảm dần. Al đứng trước Si nên $r_{Al}$ lớn hơn $r_{Si}$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho các nguyên tố: X (Z = 12), Y (Z = 20). So sánh tính kim loại của X và Y:", "options": ["A. Tính kim loại của X mạnh hơn của Y.", "B. Tính kim loại của Y mạnh hơn của X.", "C. Tính kim loại của X bằng của Y.", "D. Không so sánh được."], "answer": "B", "explain": "X là Mg (chu kì 3), Y là Ca (chu kì 4), cùng thuộc nhóm IIA. Trong nhóm A, đi từ trên xuống dưới tính kim loại tăng dần nên Ca có tính kim loại mạnh hơn Mg.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tố X thuộc chu kì 3. Biết tổng số hạt proton, neutron, electron trong nguyên tử X là 40 và số hạt mang điện nhiều hơn số hạt không mang điện là 12. X là nguyên tố nào sau đây?", "options": ["A. $Na$.", "B. $Mg$.", "C. $Al$.", "D. $Si$."], "answer": "C", "explain": "Gọi Z là số proton, N là số neutron: $2Z + N = 40$ và $2Z - N = 12$. Cộng hai phương trình: $4Z = 52$, suy ra $Z = 13$, $N = 14$. X là Al (chu kì 3, nhóm IIIA).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Các nguyên tố halogen đều có 7 electron lớp ngoài cùng.", "b) Các halogen đều là phi kim hoạt động mạnh.", "c) Tính oxi hóa của các halogen giảm dần từ $F_2$ đến $I_2$.", "d) $At$ là halogen hoạt động mạnh nhất."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: nhóm VIIA. b) Đúng. c) Đúng: trong nhóm VIIA, tính phi kim giảm dần xuống dưới. d) Sai: F là halogen hoạt động mạnh nhất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong chu kì 2, $Li$ có tính kim loại mạnh nhất.", "b) Trong chu kì 2, $F$ có tính phi kim mạnh nhất.", "c) Trong nhóm IIA, $Ba$ có tính kim loại mạnh nhất (trong các nguyên tố thường gặp).", "d) Trong nhóm VIA, $O$ có tính phi kim mạnh nhất."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: Li đứng đầu chu kì 2. b) Đúng: F đứng gần cuối chu kì 2. c) Đúng: trong nhóm IIA, tính kim loại tăng dần xuống dưới. d) Đúng: trong nhóm VIA, tính phi kim giảm dần xuống dưới.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X có cấu hình electron $1s^22s^22p^63s^23p^1$. X thuộc chu kì mấy, nhóm mấy? (trả lời dạng: chu kì 3, nhóm IIIA)", "answer": "chu kì 3, nhóm IIIA", "explain": "X có 3 lớp electron nên thuộc chu kì 3; lớp ngoài cùng có 3 electron, electron cuối vào phân lớp p nên thuộc nhóm IIIA (X là Al).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các nguyên tố $Na, Al, P, Cl$ theo chiều tăng dần của độ âm điện. (viết các kí hiệu cách nhau bởi dấu cách)", "answer": "$Na$ $Al$ $P$ $Cl$", "explain": "Na, Al, P, Cl cùng thuộc chu kì 3. Trong chu kì, từ trái sang phải độ âm điện tăng dần nên thứ tự tăng dần là Na, Al, P, Cl.", "points": 0.5}]},
{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Ý nghĩa nào sau đây KHÔNG phải là ý nghĩa của bảng tuần hoàn?", "options": ["A. Từ vị trí suy ra cấu tạo nguyên tử và tính chất của nguyên tố.", "B. Từ cấu tạo nguyên tử suy ra vị trí và tính chất của nguyên tố.", "C. Dự đoán tính chất của nguyên tố chưa được tìm ra.", "D. Xác định chính xác nguyên tử khối của mọi nguyên tố."], "answer": "D", "explain": "Bảng tuần hoàn cho phép suy luận giữa vị trí, cấu tạo và tính chất, dự đoán nguyên tố mới; nhưng nguyên tử khối chính xác phải đo bằng thực nghiệm, không suy ra từ bảng tuần hoàn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Các nguyên tố trong cùng một chu kì có tính chất biến đổi tuần hoàn là do", "options": ["A. số lớp electron giống nhau.", "B. điện tích hạt nhân tăng dần và số electron lớp ngoài cùng tăng dần từ 1 đến 8.", "C. nguyên tử khối tăng dần.", "D. số neutron tăng dần."], "answer": "B", "explain": "Trong một chu kì, điện tích hạt nhân tăng dần và số electron lớp ngoài cùng tăng dần từ 1 đến 8 rồi lặp lại ở chu kì tiếp theo, tạo nên tính tuần hoàn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biết X thuộc nhóm VA, chu kì 2. Dự đoán nào sau đây đúng về X?", "options": ["A. X là kim loại.", "B. X là phi kim, tạo hợp chất khí $XH_3$ và oxide $X_2O_5$.", "C. X là khí hiếm.", "D. X tạo oxide $XO_3$."], "answer": "B", "explain": "X là N (nhóm VA, chu kì 2): phi kim; tạo hợp chất khí $NH_3$ ($XH_3$) và oxide cao nhất $N_2O_5$ ($X_2O_5$, oxide acid).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh tính acid của các acid: $H_2SO_4, H_3PO_4, HClO_4$ (đều ứng với nguyên tố chu kì 3). Sắp xếp đúng theo chiều tăng dần là", "options": ["A. $H_3PO_4 \\lt H_2SO_4 \\lt HClO_4$.", "B. $HClO_4 \\lt H_2SO_4 \\lt H_3PO_4$.", "C. $H_2SO_4 \\lt H_3PO_4 \\lt HClO_4$.", "D. $H_3PO_4 \\lt HClO_4 \\lt H_2SO_4$."], "answer": "A", "explain": "Trong chu kì 3, tính acid tăng dần từ trái sang phải theo thứ tự: $H_3PO_4$ (P, nhóm VA), $H_2SO_4$ (S, nhóm VIA), $HClO_4$ (Cl, nhóm VIIA).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X ở ô thứ 19 trong bảng tuần hoàn. So sánh tính kim loại của X với $Na$ (ô thứ 11):", "options": ["A. Tính kim loại của X mạnh hơn của $Na$.", "B. Tính kim loại của X yếu hơn của $Na$.", "C. Tính kim loại của X bằng của $Na$.", "D. Không so sánh được."], "answer": "A", "explain": "X là K (Z = 19), Na có Z = 11, cùng thuộc nhóm IA. Trong nhóm A, đi từ trên xuống dưới tính kim loại tăng dần nên K có tính kim loại mạnh hơn Na.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho các nguyên tố A, B thuộc cùng chu kì 3. Biết A tạo oxide $A_2O$ và B tạo hợp chất khí $BH_3$. So sánh tính kim loại của A và tính phi kim của B với các nguyên tố lân cận, phát biểu nào sau đây đúng?", "options": ["A. A là kim loại mạnh nhất chu kì 3, B là phi kim mạnh nhất chu kì 3.", "B. A là Na (kim loại mạnh nhất chu kì 3), B là P (có tính phi kim nhưng yếu hơn S, Cl).", "C. A là Mg, B là N.", "D. A và B đều là kim loại."], "answer": "B", "explain": "Oxide $A_2O$ cho thấy A thuộc nhóm IA, chu kì 3 là Na — kim loại mạnh nhất chu kì 3. Hợp chất $BH_3$ cho thấy B thuộc nhóm VA, chu kì 3 là P — phi kim nhưng tính phi kim yếu hơn S (nhóm VIA) và Cl (nhóm VIIA).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bảng tuần hoàn phản ánh định luật tuần hoàn.", "b) Vị trí của nguyên tố trong bảng tuần hoàn phản ánh cấu tạo nguyên tử của nó.", "c) Hai nguyên tố ở hai ô liên tiếp trong cùng chu kì có tính chất hoàn toàn giống nhau.", "d) Có thể so sánh tính chất của hai nguyên tố dựa vào vị trí tương đối của chúng."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: bảng tuần hoàn là biểu hiện trực quan của định luật tuần hoàn. b) Đúng: chu kì cho biết số lớp electron, nhóm cho biết số electron lớp ngoài cùng. c) Sai: tính chất biến đổi dần dần, chỉ tương tự chứ không hoàn toàn giống nhau. d) Đúng: đó chính là ý nghĩa của bảng tuần hoàn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Na$ có tính khử mạnh hơn $Al$.", "b) $Cl_2$ có tính oxi hóa mạnh hơn $S$.", "c) $MgO$ có tính base mạnh hơn $Na_2O$.", "d) $H_2SO_4$ có tính acid mạnh hơn $H_3PO_4$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: trong chu kì 3, tính kim loại (tính khử) giảm dần từ Na đến Al. b) Đúng: Cl đứng sau S trong chu kì 3 nên tính phi kim (tính oxi hóa) mạnh hơn. c) Sai: $Na_2O$ có tính base mạnh hơn MgO. d) Đúng: trong chu kì 3, tính acid tăng dần từ P đến S.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X thuộc chu kì 4, nhóm VIIA. Viết cấu hình electron lớp ngoài cùng của X.", "answer": "$4s^24p^5$", "explain": "Chu kì 4, nhóm VIIA: lớp ngoài cùng là lớp thứ 4 với 7 electron, cấu hình $4s^24p^5$ (X là Br).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các nguyên tố $K, Ca, Ga$ theo chiều tăng dần của bán kính nguyên tử. (viết các kí hiệu cách nhau bởi dấu cách)", "answer": "$Ga$ $Ca$ $K$", "explain": "K, Ca, Ga cùng thuộc chu kì 4. Trong chu kì, từ trái sang phải bán kính giảm dần nên thứ tự tăng dần là Ga, Ca, K.", "points": 0.5}]},
{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Định luật tuần hoàn được phát biểu bởi nhà bác học nào?", "options": ["A. Dalton.", "B. Mendeleev.", "C. Rutherford.", "D. Avogadro."], "answer": "B", "explain": "Năm 1869, nhà bác học người Nga D. I. Mendeleev đã phát biểu định luật tuần hoàn và xây dựng bảng tuần hoàn các nguyên tố hóa học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bảng tuần hoàn hiện đại được sắp xếp dựa trên", "options": ["A. nguyên tử khối tăng dần.", "B. điện tích hạt nhân (số hiệu nguyên tử) tăng dần.", "C. số neutron tăng dần.", "D. khối lượng riêng tăng dần."], "answer": "B", "explain": "Bảng tuần hoàn hiện đại sắp xếp các nguyên tố theo chiều tăng dần của điện tích hạt nhân (số hiệu nguyên tử Z).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố X có cấu hình electron $[Ar]4s^1$. Từ vị trí của X, dự đoán nào sau đây đúng?", "options": ["A. X là kim loại kiềm, tính kim loại mạnh hơn $Na$.", "B. X là phi kim.", "C. X là khí hiếm.", "D. X là kim loại kiềm thổ."], "answer": "A", "explain": "X là K (chu kì 4, nhóm IA): kim loại kiềm; trong nhóm IA, K ở dưới Na nên tính kim loại mạnh hơn Na.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh độ âm điện của $N$ và $P$ (cùng nhóm VA). Kết luận đúng là", "options": ["A. Độ âm điện của $N$ lớn hơn của $P$.", "B. Độ âm điện của $P$ lớn hơn của $N$.", "C. Độ âm điện của hai nguyên tố bằng nhau.", "D. Không so sánh được."], "answer": "A", "explain": "Trong nhóm VA, đi từ trên xuống dưới độ âm điện giảm dần nên N (chu kì 2) có độ âm điện lớn hơn P (chu kì 3).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Biết nguyên tố X thuộc chu kì 3, tạo được oxide cao nhất $X_2O_7$. So sánh tính acid của hydroxide tương ứng của X với $H_2SO_4$:", "options": ["A. Hydroxide của X có tính acid yếu hơn $H_2SO_4$.", "B. Hydroxide của X có tính acid mạnh hơn $H_2SO_4$.", "C. Hai acid có tính acid như nhau.", "D. Không so sánh được."], "answer": "B", "explain": "X là Cl (nhóm VIIA, chu kì 3), hydroxide tương ứng là $HClO_4$. Trong chu kì 3, tính acid tăng dần từ S đến Cl nên $HClO_4$ có tính acid mạnh hơn $H_2SO_4$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai nguyên tố X, Y liên tiếp nhau trong cùng một nhóm A, có tổng số hiệu nguyên tử là 24. Biết X đứng trên Y. So sánh tính phi kim của X và Y (cả hai đều là phi kim):", "options": ["A. Tính phi kim của X mạnh hơn của Y.", "B. Tính phi kim của Y mạnh hơn của X.", "C. Tính phi kim của X bằng của Y.", "D. Không xác định được X, Y."], "answer": "A", "explain": "Cùng nhóm A, hai chu kì liên tiếp: hiệu Z là 8 (chu kì nhỏ). $Z_X + Z_Y = 24$ nên $Z_X = 8$ (O), $Z_Y = 16$ (S). Trong nhóm VIA, đi từ trên xuống dưới tính phi kim giảm dần nên O có tính phi kim mạnh hơn S.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mendeleev sắp xếp các nguyên tố theo nguyên tử khối tăng dần.", "b) Bảng tuần hoàn hiện đại sắp xếp theo số hiệu nguyên tử tăng dần.", "c) Thứ tự sắp xếp của hầu hết các nguyên tố trong hai cách sắp xếp là trùng nhau.", "d) Định luật tuần hoàn hiện đại phát biểu theo điện tích hạt nhân."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: bảng của Mendeleev (1869). b) Đúng: bảng hiện đại. c) Đúng: chỉ một vài cặp đảo vị trí (Ar-K, Co-Ni, Te-I) do sắp xếp theo nguyên tử khối. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $K$ tác dụng với nước mạnh hơn $Na$.", "b) $Ca$ tác dụng với nước mạnh hơn $Mg$.", "c) $F_2$ oxi hóa được $Cl^-$ thành $Cl_2$.", "d) $I_2$ oxi hóa được $Br^-$ thành $Br_2$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: trong nhóm IA, tính kim loại tăng dần xuống dưới. b) Đúng: trong nhóm IIA, tính kim loại tăng dần xuống dưới. c) Đúng: $F_2$ có tính oxi hóa mạnh hơn $Cl_2$. d) Sai: $I_2$ có tính oxi hóa yếu hơn $Br_2$ nên không oxi hóa được $Br^-$.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X ở chu kì 2, nhóm VIIA. Viết công thức phân tử của đơn chất X.", "answer": "$F_2$", "explain": "X là F (chu kì 2, nhóm VIIA). Đơn chất halogen tồn tại ở dạng phân tử hai nguyên tử nên công thức là $F_2$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các ion $Cl^-, Br^-, I^-$ theo chiều tăng dần của tính khử. (viết các ion cách nhau bởi dấu cách)", "answer": "$Cl^-$ $Br^-$ $I^-$", "explain": "Trong nhóm VIIA, từ trên xuống dưới tính phi kim giảm dần nên tính khử của các ion halogen tăng dần theo thứ tự: $Cl^-$, $Br^-$, $I^-$.", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trong bảng tuần hoàn, các nguyên tố có cùng số electron lớp ngoài cùng được xếp vào", "options": ["A. cùng một chu kì.", "B. cùng một nhóm.", "C. cùng một khối.", "D. cùng một ô."], "answer": "B", "explain": "Các nguyên tố có cùng số electron lớp ngoài cùng được xếp thành một cột dọc gọi là nhóm, nên tính chất hóa học của chúng tương tự nhau.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Số electron lớp ngoài cùng của nguyên tử các nguyên tố nhóm A biến đổi như thế nào trong một chu kì?", "options": ["A. Tăng dần từ 1 đến 8.", "B. Giảm dần từ 8 đến 1.", "C. Không đổi.", "D. Tăng rồi giảm."], "answer": "A", "explain": "Trong một chu kì (xét các nguyên tố nhóm A), số electron lớp ngoài cùng tăng dần từ 1 (nhóm IA) đến 8 (nhóm VIIIA).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ cấu hình electron $1s^22s^22p^63s^23p^64s^2$, xác định vị trí và dự đoán tính chất của nguyên tố:", "options": ["A. Chu kì 4, nhóm IIA, kim loại kiềm thổ.", "B. Chu kì 3, nhóm IIA, kim loại kiềm.", "C. Chu kì 4, nhóm IVA, phi kim.", "D. Chu kì 4, nhóm IIA, halogen."], "answer": "A", "explain": "Nguyên tố có 4 lớp electron (chu kì 4), 2 electron lớp ngoài cùng (nhóm IIA, khối s): đó là Ca, kim loại kiềm thổ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh tính base của các hydroxide: $NaOH, KOH, Mg(OH)_2$. Sắp xếp đúng theo chiều tăng dần là", "options": ["A. $Mg(OH)_2 \\lt NaOH \\lt KOH$.", "B. $KOH \\lt NaOH \\lt Mg(OH)_2$.", "C. $NaOH \\lt KOH \\lt Mg(OH)_2$.", "D. $Mg(OH)_2 \\lt KOH \\lt NaOH$."], "answer": "A", "explain": "Trong chu kì 3: NaOH có tính base mạnh hơn Mg(OH)2. Trong nhóm IA: KOH (K ở dưới Na) có tính base mạnh hơn NaOH. Vậy thứ tự tăng dần là Mg(OH)2, NaOH, KOH.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X thuộc nhóm IIIA, chu kì 3. Dự đoán công thức oxide, hydroxide và tính chất của chúng:", "options": ["A. $X_2O_3$ (oxide base yếu), $X(OH)_3$ (lưỡng tính).", "B. $XO$ (oxide base mạnh), $X(OH)_2$ (base mạnh).", "C. $X_2O_5$ (oxide acid), $HXO_3$ (acid mạnh).", "D. $XO_3$ (oxide acid), $H_2XO_4$ (acid mạnh)."], "answer": "A", "explain": "X là Al: oxide $Al_2O_3$ (dạng $X_2O_3$) là oxide lưỡng tính (có tính base yếu), hydroxide $Al(OH)_3$ (dạng $X(OH)_3$) là hydroxide lưỡng tính.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ba nguyên tố X, Y, Z thuộc cùng nhóm IA và thuộc 3 chu kì liên tiếp (X ở trên Y, Y ở trên Z). Biết X là $Li$ (Z = 3) và $Z_X + Z_Z = 2Z_Y$. Nguyên tố Z là", "options": ["A. $Na$.", "B. $K$.", "C. $Rb$.", "D. $Cs$."], "answer": "B", "explain": "Nhóm IA gồm Li (Z = 3, chu kì 2), Na (Z = 11, chu kì 3), K (Z = 19, chu kì 4), Rb, Cs. Với X là Li, Y là Na (Z = 11): $Z_Z = 2 \\times 11 - 3 = 19$. Vậy Z là K.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chu kì cho biết số lớp electron của nguyên tử.", "b) Nhóm A cho biết số electron lớp ngoài cùng.", "c) Từ vị trí có thể viết được cấu hình electron.", "d) Từ cấu hình electron không thể xác định được vị trí."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: biết số lớp và số electron lớp ngoài cùng có thể suy ra cấu hình (với nguyên tố nhóm A). d) Sai: từ cấu hình electron xác định được số lớp (chu kì) và số electron lớp ngoài cùng (nhóm).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Si$ là á kim, nằm ở ranh giới kim loại - phi kim.", "b) $Ge$ là á kim.", "c) $B$ là á kim.", "d) Tất cả các nguyên tố nhóm IVA đều là phi kim."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Si nằm ở đường chéo ranh giới. b) Đúng. c) Đúng: B (nhóm IIIA) cũng là á kim. d) Sai: nhóm IVA gồm C, Si (phi kim, á kim) và Ge, Sn, Pb (á kim, kim loại).", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X thuộc chu kì 3, nhóm VA. Viết công thức oxide cao nhất của X.", "answer": "$P_2O_5$", "explain": "X là P (chu kì 3, nhóm VA), hóa trị cao nhất với O là V nên oxide cao nhất là $P_2O_5$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các nguyên tố $F, O, N, C$ theo chiều tăng dần của bán kính nguyên tử. (viết các kí hiệu cách nhau bởi dấu cách)", "answer": "$F$ $O$ $N$ $C$", "explain": "F, O, N, C cùng thuộc chu kì 2. Trong chu kì, từ trái sang phải bán kính giảm dần nên thứ tự tăng dần của bán kính là F, O, N, C.", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng với định luật tuần hoàn?", "options": ["A. Tính chất các nguyên tố biến đổi liên tục không theo quy luật.", "B. Tính chất các nguyên tố lặp lại sau mỗi 8 nguyên tố một cách chính xác.", "C. Tính chất của các nguyên tố, đơn chất và hợp chất biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân.", "D. Mọi tính chất đều tăng dần theo chiều tăng của điện tích hạt nhân."], "answer": "C", "explain": "Định luật tuần hoàn: tính chất của các nguyên tố và đơn chất, cũng như thành phần và tính chất của các hợp chất biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong một chu kì, tính chất nào sau đây biến đổi tuần hoàn rõ rệt nhất?", "options": ["A. Số khối.", "B. Hóa trị cao nhất với oxygen.", "C. Số neutron.", "D. Nguyên tử khối."], "answer": "B", "explain": "Hóa trị cao nhất với oxygen tăng dần từ I đến VII trong một chu kì rồi lặp lại ở chu kì tiếp theo, thể hiện rõ tính tuần hoàn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố X thuộc chu kì 4, nhóm IA. So sánh X với $Na$ về khả năng tác dụng với nước:", "options": ["A. X tác dụng với nước mạnh hơn $Na$.", "B. X tác dụng với nước yếu hơn $Na$.", "C. X và $Na$ tác dụng với nước như nhau.", "D. X không tác dụng với nước."], "answer": "A", "explain": "X là K, cùng nhóm IA với Na. Trong nhóm A, đi từ trên xuống dưới tính kim loại tăng dần nên K tác dụng với nước mãnh liệt hơn Na.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dãy nào sau đây được sắp xếp theo chiều tăng dần của tính phi kim?", "options": ["A. $Si, P, S, Cl$.", "B. $Cl, S, P, Si$.", "C. $P, Si, S, Cl$.", "D. $Si, S, P, Cl$."], "answer": "A", "explain": "Si, P, S, Cl cùng thuộc chu kì 3. Trong chu kì, từ trái sang phải tính phi kim tăng dần nên thứ tự tăng dần là Si, P, S, Cl.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho các nguyên tố: X (chu kì 2, nhóm IVA), Y (chu kì 3, nhóm IVA). Dự đoán về tính chất của X và Y:", "options": ["A. X và Y đều là kim loại.", "B. X là phi kim, Y là á kim; tính phi kim của X mạnh hơn của Y.", "C. X là á kim, Y là kim loại.", "D. X và Y đều là khí hiếm."], "answer": "B", "explain": "X là C (phi kim), Y là Si (á kim), cùng nhóm IVA. Trong nhóm A, từ trên xuống dưới tính phi kim giảm dần nên C có tính phi kim mạnh hơn Si.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tố R có oxide cao nhất là $RO_2$ và không tạo hợp chất khí với hydrogen. R thuộc chu kì 3. R là nguyên tố nào và có tính chất gì?", "options": ["A. $Si$, á kim; $RO_2$ là oxide acid.", "B. $Mg$, kim loại; $RO_2$ là oxide base.", "C. $S$, phi kim; $RO_2$ là oxide acid.", "D. $Al$, kim loại; $RO_2$ là oxide lưỡng tính."], "answer": "A", "explain": "Oxide $RO_2$ cho thấy R thuộc nhóm IVA. Chu kì 3, nhóm IVA là Si (á kim). $SiO_2$ là oxide acid. (S thuộc nhóm VIA, oxide cao nhất là $SO_3$; Mg thuộc nhóm IIA, oxide là MgO.)", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Định luật tuần hoàn là cơ sở lí thuyết của bảng tuần hoàn.", "b) Bảng tuần hoàn là sự biểu hiện trực quan của định luật tuần hoàn.", "c) Mọi nguyên tố trong cùng một nhóm đều có tính chất giống hệt nhau.", "d) Có thể dự đoán tính chất của nguyên tố dựa vào vị trí của nó."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: tính chất chỉ tương tự nhau, vẫn có sự biến đổi dần dần trong nhóm. d) Đúng: đó là ý nghĩa của bảng tuần hoàn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Na_2O$ là oxide base mạnh.", "b) $Cl_2O_7$ là oxide acid mạnh.", "c) $Al_2O_3$ là oxide lưỡng tính.", "d) $MgO$ có tính acid mạnh hơn $Na_2O$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: MgO là oxide base (yếu hơn $Na_2O$), không phải oxide acid.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X thuộc nhóm IIA, chu kì 3. Viết công thức hydroxide của X.", "answer": "$Mg(OH)_2$", "explain": "X là Mg (nhóm IIA, chu kì 3). Oxide cao nhất là MgO, hydroxide tương ứng là $Mg(OH)_2$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các nguyên tố $B, Al, Ga$ theo chiều tăng dần của tính kim loại. (viết các kí hiệu cách nhau bởi dấu cách)", "answer": "$B$ $Al$ $Ga$", "explain": "B, Al, Ga cùng thuộc nhóm IIIA. Trong nhóm A, từ trên xuống dưới tính kim loại tăng dần nên thứ tự tăng dần là B, Al, Ga.", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Cặp nguyên tố nào sau đây có tính chất hóa học tương tự nhau nhất?", "options": ["A. $Na$ và $Mg$.", "B. $O$ và $S$.", "C. $N$ và $O$.", "D. $C$ và $N$."], "answer": "B", "explain": "O và S cùng thuộc nhóm VIA (đều có 6 electron lớp ngoài cùng) nên tính chất hóa học tương tự nhau.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Các nguyên tố $Li, Na, K$ có tính chất tương tự nhau vì", "options": ["A. chúng thuộc cùng một chu kì.", "B. chúng thuộc cùng một nhóm IA, đều có 1 electron lớp ngoài cùng.", "C. chúng có cùng nguyên tử khối.", "D. chúng đều là phi kim."], "answer": "B", "explain": "Li, Na, K cùng thuộc nhóm IA, đều có 1 electron lớp ngoài cùng nên tính chất hóa học tương tự nhau (đều là kim loại kiềm).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biết nguyên tố X ở chu kì 3, nhóm VIA. Công thức phân tử của đơn chất X và tính chất của nó là", "options": ["A. $X_2$, phi kim hoạt động mạnh.", "B. $X_8$, phi kim; $X$ là sulfur.", "C. $X$, kim loại.", "D. $X_4$, khí hiếm."], "answer": "B", "explain": "X là S (chu kì 3, nhóm VIA): phi kim; đơn chất sulfur tồn tại ở dạng vòng $S_8$ ở điều kiện thường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh tính khử của các kim loại kiềm: $Li, Na, K$. Sắp xếp đúng theo chiều tăng dần là", "options": ["A. $Li \\lt Na \\lt K$.", "B. $K \\lt Na \\lt Li$.", "C. $Na \\lt K \\lt Li$.", "D. $Li \\lt K \\lt Na$."], "answer": "A", "explain": "Tính khử của kim loại tương ứng với tính kim loại. Trong nhóm IA, tính kim loại tăng dần từ trên xuống dưới nên thứ tự tăng dần là Li, Na, K.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho sơ đồ biến đổi tuần hoàn số electron lớp ngoài cùng của các nguyên tố chu kì 3 (từ Na đến Ar): 1, 2, 3, 4, 5, 6, 7, 8. Điều này giải thích", "options": ["A. nguyên tử khối tăng dần.", "B. tính chất biến đổi tuần hoàn.", "C. số lớp electron không đổi.", "D. bán kính nguyên tử tăng dần."], "answer": "B", "explain": "Số electron lớp ngoài cùng lặp lại một cách tuần hoàn (1 đến 8) sau mỗi chu kì, mà tính chất hóa học chủ yếu do electron lớp ngoài cùng quyết định nên tính chất biến đổi tuần hoàn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "X, Y là hai phi kim thuộc cùng một chu kì, X đứng trước Y. Z là phi kim cùng nhóm với X nhưng ở chu kì dưới Y (chu kì của Z lớn hơn chu kì của Y một đơn vị). Sắp xếp đúng theo chiều tăng dần của tính phi kim là", "options": ["A. $Z \\lt X \\lt Y$.", "B. $Y \\lt X \\lt Z$.", "C. $X \\lt Z \\lt Y$.", "D. $Z \\lt Y \\lt X$."], "answer": "A", "explain": "Trong chu kì: X đứng trước Y nên tính phi kim của X yếu hơn của Y. Trong nhóm: Z ở dưới X nên tính phi kim của Z yếu hơn của X. Vậy thứ tự tăng dần là Z, X, Y. Ví dụ: X là P, Y là S (chu kì 3), Z là As (chu kì 4, cùng nhóm VA với P).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Electron lớp ngoài cùng quyết định chủ yếu tính chất hóa học của nguyên tố.", "b) Hai nguyên tố có cùng số electron lớp ngoài cùng thì tính chất hoàn toàn giống nhau.", "c) Cấu hình electron lớp ngoài cùng lặp lại theo chu kì.", "d) Đó là nguyên nhân của tính tuần hoàn."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: tính chất chỉ tương tự nhau, còn chịu ảnh hưởng của điện tích hạt nhân và số lớp electron. c) Đúng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Ne$ và $Ar$ đều là khí hiếm, rất khó tham gia phản ứng hóa học.", "b) $He$ có 2 electron lớp ngoài cùng nhưng vẫn xếp vào nhóm VIIIA.", "c) Khí hiếm có độ âm điện rất lớn.", "d) $Xe$ có thể tạo một số hợp chất với $F$ và $O$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: lớp ngoài cùng bền vững 8 electron. b) Đúng: He là ngoại lệ của quy tắc nhóm. c) Sai: khí hiếm có lớp electron bền vững, ít có xu hướng hút electron nên độ âm điện rất nhỏ (thường không xét). d) Đúng: Xe tạo được $XeF_2, XeF_4, XeO_3$ trong điều kiện đặc biệt.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X thuộc chu kì 3, nhóm VIIA. Viết công thức oxide cao nhất của X.", "answer": "$Cl_2O_7$", "explain": "X là Cl (chu kì 3, nhóm VIIA), hóa trị cao nhất với O là VII nên oxide cao nhất là $Cl_2O_7$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các nguyên tố $Mg, Al, Na, Si$ theo chiều giảm dần của tính kim loại. (viết các kí hiệu cách nhau bởi dấu cách)", "answer": "$Na$ $Mg$ $Al$ $Si$", "explain": "Na, Mg, Al, Si cùng thuộc chu kì 3. Trong chu kì, từ trái sang phải tính kim loại giảm dần nên thứ tự giảm dần là Na, Mg, Al, Si.", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Bảng tuần hoàn gồm bao nhiêu chu kì và bao nhiêu nhóm A?", "options": ["A. 7 chu kì và 8 nhóm A.", "B. 8 chu kì và 7 nhóm A.", "C. 7 chu kì và 8 nhóm B.", "D. 18 chu kì và 8 nhóm A."], "answer": "A", "explain": "Bảng tuần hoàn gồm 7 chu kì (hàng ngang) và 8 nhóm A (nhóm chính) cùng 8 nhóm B (nhóm phụ).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tố nào sau đây thuộc nhóm VIIIA?", "options": ["A. $Cl$.", "B. $Ar$.", "C. $S$.", "D. $P$."], "answer": "B", "explain": "Ar là khí hiếm, thuộc nhóm VIIIA (lớp ngoài cùng có 8 electron bền vững).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ vị trí của $Br$ (chu kì 4, nhóm VIIA), dự đoán nào sau đây đúng?", "options": ["A. $Br_2$ có tính oxi hóa mạnh hơn $Cl_2$.", "B. $Br_2$ có tính oxi hóa yếu hơn $Cl_2$ nhưng mạnh hơn $I_2$.", "C. $Br_2$ không có tính oxi hóa.", "D. $HBr$ là acid yếu hơn $HF$."], "answer": "B", "explain": "Trong nhóm VIIA, tính oxi hóa giảm dần từ trên xuống dưới theo thứ tự: $Cl_2$, $Br_2$, $I_2$. Tính acid của hydrogen halide tăng dần theo thứ tự: HF, HCl, HBr, HI.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh tính acid của $H_2CO_3$ và $H_2SiO_3$ (C và Si cùng nhóm IVA, C ở trên Si). Kết luận đúng là", "options": ["A. $H_2CO_3$ có tính acid mạnh hơn $H_2SiO_3$.", "B. $H_2SiO_3$ có tính acid mạnh hơn $H_2CO_3$.", "C. Hai acid có tính acid như nhau.", "D. Không so sánh được."], "answer": "A", "explain": "Trong nhóm IVA, từ trên xuống dưới tính phi kim giảm dần nên tính acid của hydroxide tương ứng cũng giảm dần: $H_2CO_3$ mạnh hơn $H_2SiO_3$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X có Z = 33. Dự đoán vị trí, cấu tạo và tính chất của X:", "options": ["A. Chu kì 4, nhóm VA; phi kim; tạo hợp chất $XH_3$ và oxide $X_2O_5$.", "B. Chu kì 3, nhóm VA; kim loại.", "C. Chu kì 4, nhóm VIIA; halogen.", "D. Chu kì 5, nhóm VA; khí hiếm."], "answer": "A", "explain": "Cấu hình X: $1s^22s^22p^63s^23p^63d^{10}4s^24p^3$ (arsenic, As). Có 4 lớp electron (chu kì 4), 5 electron lớp ngoài cùng (nhóm VA, khối p): phi kim; tạo hợp chất khí $AsH_3$ ($XH_3$) và oxide $As_2O_5$ ($X_2O_5$).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho các nguyên tố: X (Z = 14), Y (Z = 32). So sánh tính chất của X và Y:", "options": ["A. X và Y đều là kim loại.", "B. X và Y đều là á kim; tính phi kim của X mạnh hơn của Y.", "C. X là á kim, Y là kim loại.", "D. X và Y đều là khí hiếm."], "answer": "B", "explain": "X là Si (chu kì 3, nhóm IVA), Y là Ge (chu kì 4, nhóm IVA): cả hai đều là á kim. Trong nhóm IVA, từ trên xuống dưới tính phi kim giảm dần nên Si có tính phi kim mạnh hơn Ge.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Á kim nằm ở ranh giới giữa kim loại và phi kim trong bảng tuần hoàn.", "b) $Si$ và $Ge$ là các á kim điển hình.", "c) Á kim vừa có tính chất của kim loại vừa có tính chất của phi kim.", "d) Tất cả các á kim đều thuộc nhóm IVA."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: á kim nằm dọc đường chéo ranh giới. b) Đúng. c) Đúng. d) Sai: á kim gồm B (nhóm IIIA), Si, Ge (nhóm IVA), As, Sb (nhóm VA), Te (nhóm VIA).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Si$ dẫn điện kém hơn $Cu$ nhưng tốt hơn $S$.", "b) $Si$ được dùng làm vật liệu bán dẫn.", "c) $SiO_2$ là thành phần chính của cát và thủy tinh.", "d) $Si$ là kim loại."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Si là á kim, độ dẫn điện trung gian. b) Đúng: ứng dụng quan trọng của Si. c) Đúng. d) Sai: Si là á kim (phi kim), không phải kim loại.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X thuộc chu kì 2, nhóm IVA. Viết công thức hợp chất khí của X với hydrogen.", "answer": "$CH_4$", "explain": "X là C (chu kì 2, nhóm IVA), hóa trị với H là IV nên hợp chất khí là $CH_4$ (methane).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các nguyên tố $N, O, F$ theo chiều tăng dần của độ âm điện. (viết các kí hiệu cách nhau bởi dấu cách)", "answer": "$N$ $O$ $F$", "explain": "N, O, F cùng thuộc chu kì 2. Trong chu kì, từ trái sang phải độ âm điện tăng dần nên thứ tự tăng dần là N, O, F.", "points": 0.5}]},
{"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các đại lượng sau, đại lượng nào biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân?", "options": ["A. Số khối.", "B. Số electron lớp ngoài cùng.", "C. Số neutron.", "D. Nguyên tử khối trung bình."], "answer": "B", "explain": "Số electron lớp ngoài cùng tăng dần từ 1 đến 8 trong một chu kì rồi lặp lại ở chu kì tiếp theo, tức biến đổi tuần hoàn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây sai về bảng tuần hoàn?", "options": ["A. Các nguyên tố được sắp xếp theo chiều tăng dần của điện tích hạt nhân.", "B. Các nguyên tố trong cùng một nhóm có tính chất tương tự nhau.", "C. Bảng tuần hoàn gồm 7 chu kì và 18 cột.", "D. Mọi nguyên tố trong cùng một chu kì đều là kim loại."], "answer": "D", "explain": "Trong một chu kì có cả kim loại (đầu chu kì), á kim (giữa) và phi kim, khí hiếm (cuối chu kì). Phát biểu D sai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố X có Z = 20. Từ bảng tuần hoàn, cho biết tính chất của oxide và hydroxide của X:", "options": ["A. Oxide base, hydroxide là base mạnh.", "B. Oxide acid, hydroxide là acid mạnh.", "C. Oxide lưỡng tính.", "D. Oxide trung tính."], "answer": "A", "explain": "X là Ca (chu kì 4, nhóm IIA): kim loại kiềm thổ; tạo oxide CaO (oxide base) và hydroxide $Ca(OH)_2$ (base mạnh).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh tính oxi hóa của các đơn chất halogen: $F_2, Cl_2, Br_2, I_2$. Sắp xếp đúng theo chiều giảm dần là", "options": ["A. $F_2 \\gt Cl_2 \\gt Br_2 \\gt I_2$.", "B. $I_2 \\gt Br_2 \\gt Cl_2 \\gt F_2$.", "C. $Cl_2 \\gt F_2 \\gt Br_2 \\gt I_2$.", "D. $F_2 \\gt Br_2 \\gt Cl_2 \\gt I_2$."], "answer": "A", "explain": "Trong nhóm VIIA, từ trên xuống dưới tính phi kim (tính oxi hóa của đơn chất) giảm dần theo thứ tự: $F_2$, $Cl_2$, $Br_2$, $I_2$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết vị trí của các nguyên tố: X (chu kì 3, nhóm IA), Y (chu kì 3, nhóm IIA), Z (chu kì 3, nhóm IIIA). Sắp xếp theo chiều tăng dần của tính base của hydroxide tương ứng là", "options": ["A. $Z \\lt Y \\lt X$.", "B. $X \\lt Y \\lt Z$.", "C. $Y \\lt Z \\lt X$.", "D. $X \\lt Z \\lt Y$."], "answer": "A", "explain": "X là Na, Y là Mg, Z là Al. Trong chu kì 3, tính base giảm dần từ trái sang phải theo thứ tự: NaOH (mạnh), Mg(OH)2 (yếu), Al(OH)3 (lưỡng tính). Thứ tự tăng dần là Z, Y, X.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sắp xếp các nguyên tố $O, S, Se$ (cùng nhóm VIA) theo chiều giảm dần của tính phi kim là", "options": ["A. $O \\gt S \\gt Se$.", "B. $Se \\gt S \\gt O$.", "C. $S \\gt O \\gt Se$.", "D. $O \\gt Se \\gt S$."], "answer": "A", "explain": "O, S, Se cùng thuộc nhóm VIA. Trong nhóm A, từ trên xuống dưới tính phi kim giảm dần nên thứ tự giảm dần là O, S, Se.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Định luật tuần hoàn do Mendeleev phát biểu năm 1869.", "b) Bảng tuần hoàn hiện đại có 7 chu kì.", "c) Nhóm là cột dọc, chu kì là hàng ngang.", "d) Ô nguyên tố cho biết kí hiệu và số hiệu nguyên tử."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Đúng: ô nguyên tố còn cho biết tên nguyên tố và nguyên tử khối.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong một chu kì, nguyên tố nhóm IA có tính kim loại mạnh nhất.", "b) Trong một chu kì, nguyên tố nhóm VIIA có tính phi kim mạnh nhất.", "c) Trong nhóm IA, nguyên tố chu kì 2 có tính kim loại mạnh nhất.", "d) Trong nhóm VIIA, nguyên tố chu kì 2 có tính phi kim mạnh nhất."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đầu chu kì. b) Đúng: gần cuối chu kì (không tính khí hiếm). c) Sai: trong nhóm IA, tính kim loại tăng dần xuống dưới nên nguyên tố cuối nhóm mạnh nhất. d) Đúng: F (chu kì 2) có tính phi kim mạnh nhất.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X thuộc nhóm VIA, chu kì 4. Viết công thức hợp chất khí của X với hydrogen.", "answer": "$H_2Se$", "explain": "X là Se (nhóm VIA, chu kì 4), hóa trị với H là II nên hợp chất khí là $H_2Se$ (viết dạng $RH_2$).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các acid $H_2SO_3, H_2SO_4, H_2SeO_4$ theo chiều tăng dần của tính acid. (viết các công thức cách nhau bởi dấu cách)", "answer": "$H_2SeO_4$ $H_2SO_3$ $H_2SO_4$", "explain": "Trong cùng nguyên tố S: hóa trị càng cao thì tính acid càng mạnh nên tính acid của $H_2SO_3$ yếu hơn $H_2SO_4$. Trong nhóm VIA: S ở trên Se nên tính acid của $H_2SO_4$ mạnh hơn $H_2SeO_4$. Thứ tự tăng dần: $H_2SeO_4$, $H_2SO_3$, $H_2SO_4$.", "points": 0.5}]}]}
