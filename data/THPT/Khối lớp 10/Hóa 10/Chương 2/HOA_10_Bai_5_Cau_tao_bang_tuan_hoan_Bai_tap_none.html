{"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Các chu kì nhỏ trong bảng tuần hoàn là", "options": ["A. chu kì 1, 2, 3.", "B. chu kì 4, 5, 6.", "C. chu kì 1, 2.", "D. chu kì 6, 7."], "answer": "A", "explain": "Chu kì 1 (2 nguyên tố), chu kì 2 (8 nguyên tố), chu kì 3 (8 nguyên tố) là các chu kì nhỏ; các chu kì 4, 5, 6, 7 là chu kì lớn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhóm B trong bảng tuần hoàn gồm các nguyên tố", "options": ["A. khối s và khối p.", "B. khối d và khối f.", "C. chỉ các khí hiếm.", "D. chỉ các halogen."], "answer": "B", "explain": "Nhóm B (nhóm phụ) gồm các nguyên tố có electron cuối cùng điền vào phân lớp d hoặc f, tức là khối d và khối f (kim loại chuyển tiếp).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố X có Z = 8. Vị trí của X trong bảng tuần hoàn là", "options": ["A. chu kì 2, nhóm VIA.", "B. chu kì 3, nhóm VIA.", "C. chu kì 2, nhóm IVA.", "D. chu kì 2, nhóm VIIA."], "answer": "A", "explain": "Cấu hình electron của X: $1s^22s^22p^4$. Có 2 lớp electron nên thuộc chu kì 2; lớp ngoài cùng có 6 electron, electron cuối vào phân lớp p nên thuộc nhóm VIA (khối p).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây đúng khi nói về các nguyên tố trong cùng một chu kì?", "options": ["A. Có cùng số electron lớp ngoài cùng.", "B. Có tính chất hóa học hoàn toàn giống nhau.", "C. Được sắp xếp theo chiều tăng dần của điện tích hạt nhân từ trái sang phải.", "D. Đều là kim loại."], "answer": "C", "explain": "Trong một chu kì, các nguyên tố có cùng số lớp electron và được sắp xếp từ trái sang phải theo chiều tăng dần của điện tích hạt nhân Z.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho các nguyên tố có số hiệu nguyên tử: X (Z = 9), Y (Z = 17), T (Z = 35). Nhận xét nào sau đây đúng?", "options": ["A. X, Y, T thuộc cùng một chu kì.", "B. X, Y, T thuộc cùng một nhóm.", "C. X, Y, T đều là kim loại.", "D. X, Y, T thuộc ba nhóm khác nhau."], "answer": "B", "explain": "X (F), Y (Cl), T (Br) đều có 7 electron lớp ngoài cùng ($ns^2np^5$) nên cùng thuộc nhóm VIIA (nhóm halogen), tính chất hóa học tương tự nhau.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tố X thuộc nhóm VIA, chu kì 3 và nguyên tố Y thuộc nhóm IA, chu kì 4. Tổng số proton trong nguyên tử X và Y là", "options": ["A. 35.", "B. 36.", "C. 34.", "D. 33."], "answer": "A", "explain": "X là S (Z = 16): chu kì 3, nhóm VIA. Y là K (Z = 19): chu kì 4, nhóm IA. Tổng số proton: 16 + 19 = 35.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Số hiệu nguyên tử Z bằng số thứ tự của nguyên tố trong bảng tuần hoàn.", "b) Số hiệu nguyên tử Z bằng số proton và bằng số electron của nguyên tử.", "c) Chu kì 1 chỉ có 2 nguyên tố là H và He.", "d) Tất cả các nguyên tố nhóm VIIIA đều có 8 electron lớp ngoài cùng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Z chính là số thứ tự. b) Đúng: Z = số proton = số electron. c) Đúng: chu kì 1 chỉ gồm H và He. d) Sai: He chỉ có 2 electron lớp ngoài cùng nhưng vẫn thuộc nhóm VIIIA.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về khối các nguyên tố:", "statements": ["a) Nguyên tố Na (Z = 11) thuộc khối s.", "b) Nguyên tố Al (Z = 13) thuộc khối p.", "c) Nguyên tố Fe (Z = 26) thuộc khối d.", "d) Nguyên tố Ce (Z = 58) thuộc khối d."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: electron cuối của Na vào phân lớp 3s. b) Đúng: electron cuối của Al vào phân lớp 3p. c) Đúng: electron cuối của Fe vào phân lớp 3d. d) Sai: Ce thuộc họ lantan, electron cuối vào phân lớp 4f nên thuộc khối f.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X có cấu hình electron lớp ngoài cùng là $4s^24p^3$. Số thứ tự chu kì của X là bao nhiêu?", "answer": "4", "explain": "Lớp ngoài cùng là lớp thứ 4 nên nguyên tử X có 4 lớp electron, vậy X thuộc chu kì 4 (nhóm VA).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguyên tố R thuộc chu kì 3, có tổng số electron trên phân lớp p là 11. Số hiệu nguyên tử Z của R là bao nhiêu?", "answer": "17", "explain": "Chu kì 3 có các phân lớp p là 2p (6 electron) và 3p. Tổng số electron trên phân lớp p là 11 nên phân lớp 3p có 11 - 6 = 5 electron. Cấu hình: $1s^22s^22p^63s^23p^5$, vậy Z = 2 + 2 + 6 + 2 + 5 = 17 (chlorine).", "points": 0.5}]},
{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Trong bảng tuần hoàn, các nguyên tố được xếp thành hàng ngang gọi là", "options": ["A. nhóm.", "B. chu kì.", "C. họ.", "D. khối."], "answer": "B", "explain": "Dãy các nguyên tố có cùng số lớp electron được xếp thành một hàng ngang gọi là chu kì.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong bảng tuần hoàn, các nguyên tố được xếp thành cột dọc gọi là", "options": ["A. chu kì.", "B. nhóm.", "C. họ.", "D. phân lớp."], "answer": "B", "explain": "Các nguyên tố có cùng số electron lớp ngoài cùng được xếp thành một cột dọc gọi là nhóm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố X có Z = 14. X thuộc", "options": ["A. chu kì 3, nhóm IVA, khối p.", "B. chu kì 2, nhóm IVA, khối p.", "C. chu kì 3, nhóm VA, khối p.", "D. chu kì 3, nhóm IVA, khối s."], "answer": "A", "explain": "Cấu hình: $1s^22s^22p^63s^23p^2$. Có 3 lớp electron nên thuộc chu kì 3; lớp ngoài cùng có 4 electron, electron cuối vào phân lớp p nên thuộc nhóm IVA, khối p.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hai nguyên tố X (Z = 3) và Y (Z = 11) có điểm chung nào sau đây?", "options": ["A. Cùng thuộc một chu kì.", "B. Cùng thuộc nhóm IA nên tính chất hóa học tương tự nhau.", "C. Đều là phi kim.", "D. Đều thuộc khối p."], "answer": "B", "explain": "X (Li) có cấu hình $1s^22s^1$, Y (Na) có cấu hình $[Ne]3s^1$: đều có 1 electron lớp ngoài cùng nên cùng thuộc nhóm IA, tính chất hóa học tương tự nhau.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X ở ô số 20 trong bảng tuần hoàn. Cấu hình electron lớp ngoài cùng của X là", "options": ["A. $4s^1$.", "B. $4s^2$.", "C. $3d^24s^2$.", "D. $4p^2$."], "answer": "B", "explain": "Ô số 20 là Ca (Z = 20), cấu hình $[Ar]4s^2$ nên lớp ngoài cùng là $4s^2$. Ca thuộc chu kì 4, nhóm IIA.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "X và Y là hai nguyên tố kế tiếp nhau trong cùng một chu kì, có tổng số hiệu nguyên tử là 39. X đứng trước Y. Số electron lớp ngoài cùng của X và Y lần lượt là", "options": ["A. 1 và 2.", "B. 7 và 8.", "C. 6 và 7.", "D. 2 và 3."], "answer": "A", "explain": "Hai nguyên tố kế tiếp trong cùng chu kì: $Z_Y = Z_X + 1$, mà $Z_X + Z_Y = 39$ nên $Z_X = 19$ (K), $Z_Y = 20$ (Ca). K thuộc chu kì 4, nhóm IA có 1 electron lớp ngoài cùng; Ca thuộc chu kì 4, nhóm IIA có 2 electron lớp ngoài cùng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bảng tuần hoàn hiện nay có 18 cột dọc.", "b) Có 8 nhóm A được đánh số từ IA đến VIIIA.", "c) Nhóm B nằm xen giữa nhóm IIA và nhóm IIIA.", "d) Nhóm IA gồm các kim loại kiềm."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: bảng tuần hoàn có 18 cột. b) Đúng: 8 nhóm A từ IA đến VIIIA. c) Đúng: các nhóm B nằm giữa IIA và IIIA. d) Đúng: nhóm IA (trừ H) là các kim loại kiềm.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Nguyên tố Mg (Z = 12) có cấu hình electron $[Ne]3s^2$. Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mg thuộc chu kì 3.", "b) Mg thuộc nhóm IIA.", "c) Mg thuộc khối p.", "d) Mg là kim loại kiềm thổ, có 2 electron lớp ngoài cùng."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Mg có 3 lớp electron. b) Đúng: 2 electron lớp ngoài cùng, khối s nên thuộc nhóm IIA. c) Sai: electron cuối vào phân lớp s nên thuộc khối s. d) Đúng: kim loại nhóm IIA gọi là kim loại kiềm thổ.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X thuộc nhóm IIIA, chu kì 3. Kí hiệu hóa học của X là gì? (viết kí hiệu, ví dụ Na)", "answer": "Al", "explain": "Chu kì 3, nhóm IIIA: cấu hình $1s^22s^22p^63s^23p^1$, Z = 13, đó là aluminium (Al).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguyên tố X có cấu hình electron kết thúc ở phân lớp $3d^24s^2$. Số thứ tự nhóm của X (viết dạng số La Mã kèm chữ, ví dụ VIB) là bao nhiêu?", "answer": "IVB", "explain": "Electron cuối vào phân lớp d nên X thuộc nhóm B. Tổng số electron hóa trị là 2 + 2 = 4 nên X thuộc nhóm IVB (đó là titanium, Ti, Z = 22).", "points": 0.5}]},
{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Họ lantan và họ actini thuộc khối nào trong bảng tuần hoàn?", "options": ["A. Khối s.", "B. Khối p.", "C. Khối d.", "D. Khối f."], "answer": "D", "explain": "Họ lantan và họ actini có electron cuối cùng điền vào phân lớp f nên thuộc khối f, được xếp riêng ở phía dưới bảng tuần hoàn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Các nguyên tố khí hiếm thuộc nhóm nào?", "options": ["A. Nhóm IA.", "B. Nhóm VIIA.", "C. Nhóm VIIIA.", "D. Nhóm IIA."], "answer": "C", "explain": "Các khí hiếm (He, Ne, Ar, Kr, Xe, Rn) thuộc nhóm VIIIA, có lớp electron ngoài cùng bền vững.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố X có cấu hình electron $1s^22s^22p^63s^23p^64s^1$. Phát biểu nào sau đây sai?", "options": ["A. X thuộc chu kì 4.", "B. X thuộc nhóm IA.", "C. X là kim loại kiềm.", "D. X thuộc khối p."], "answer": "D", "explain": "X là K (Z = 19): có 4 lớp electron nên thuộc chu kì 4; 1 electron lớp ngoài cùng, electron cuối vào phân lớp s nên thuộc nhóm IA, khối s (kim loại kiềm). Phát biểu D sai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các nguyên tố sau, nguyên tố nào thuộc nhóm B?", "options": ["A. Na (Z = 11).", "B. Cl (Z = 17).", "C. Fe (Z = 26).", "D. Ar (Z = 18)."], "answer": "C", "explain": "Fe có cấu hình $[Ar]3d^64s^2$, electron cuối cùng điền vào phân lớp d nên thuộc khối d, nhóm B (nhóm VIIIB).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X có Z = 35. Vị trí của X là", "options": ["A. chu kì 4, nhóm VIIA.", "B. chu kì 3, nhóm VIIA.", "C. chu kì 4, nhóm VA.", "D. chu kì 5, nhóm VIIA."], "answer": "A", "explain": "Cấu hình: $1s^22s^22p^63s^23p^63d^{10}4s^24p^5$. Có 4 lớp electron nên thuộc chu kì 4; lớp ngoài cùng có 7 electron, electron cuối vào phân lớp p nên thuộc nhóm VIIA (bromine, halogen).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tố X thuộc chu kì 4, có tổng số hạt mang điện nhiều hơn tổng số hạt không mang điện là 18. Số hiệu nguyên tử của X là", "options": ["A. 19.", "B. 20.", "C. 21.", "D. 22."], "answer": "A", "explain": "Gọi Z là số proton, N là số neutron: số hạt mang điện là 2Z, hạt không mang điện là N nên 2Z - N = 18. X thuộc chu kì 4 nên Z nằm trong khoảng từ 19 đến 36. Với Z = 19 (kali): N = 2 nhân 19 - 18 = 20, phù hợp với đồng vị K-39. Vậy Z = 19.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nguyên tố H được xếp ở nhóm IA nhưng không phải kim loại kiềm.", "b) Các nguyên tố nhóm VIIA được gọi là halogen.", "c) Các nguyên tố nhóm IA (trừ H) được gọi là kim loại kiềm.", "d) Khí hiếm có tính trơ về mặt hóa học."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: H ở nhóm IA nhưng là phi kim. b) Đúng: nhóm VIIA là các halogen. c) Đúng: nhóm IA (trừ H) là kim loại kiềm. d) Đúng: khí hiếm có lớp ngoài cùng bền vững nên rất khó tham gia phản ứng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về vị trí các nguyên tố:", "statements": ["a) Nguyên tố có Z = 3 (Li) và Z = 19 (K) cùng thuộc nhóm IA.", "b) Nguyên tố có Z = 10 (Ne) và Z = 18 (Ar) cùng thuộc nhóm VIIIA.", "c) Nguyên tố có Z = 6 (C) và Z = 14 (Si) cùng thuộc nhóm IVA.", "d) Nguyên tố có Z = 11 (Na) thuộc chu kì 2."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Li và K đều có 1 electron lớp ngoài cùng nên cùng nhóm IA. b) Đúng: Ne và Ar đều là khí hiếm, nhóm VIIIA. c) Đúng: C và Si đều có 4 electron lớp ngoài cùng nên cùng nhóm IVA. d) Sai: Na có 3 lớp electron nên thuộc chu kì 3.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X thuộc chu kì 4, nhóm IIA. Số hiệu nguyên tử Z của X là bao nhiêu?", "answer": "20", "explain": "Chu kì 4, nhóm IIA: cấu hình $[Ar]4s^2$ nên Z = 18 + 2 = 20 (calcium).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong bảng tuần hoàn, chu kì 6 có bao nhiêu nguyên tố (không tính họ lantan xếp riêng phía dưới)?", "answer": "32", "explain": "Chu kì 6 là chu kì lớn nhất, gồm các nguyên tố từ Cs (Z = 55) đến Rn (Z = 86), tổng cộng 32 nguyên tố (trong đó 14 nguyên tố họ lantan thường được xếp riêng phía dưới).", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trong một chu kì, khi đi từ trái sang phải theo chiều tăng dần của điện tích hạt nhân, số lớp electron của các nguyên tử", "options": ["A. tăng dần.", "B. giảm dần.", "C. không đổi.", "D. tăng rồi giảm."], "answer": "C", "explain": "Các nguyên tố trong cùng một chu kì có cùng số lớp electron, chỉ khác nhau về điện tích hạt nhân và số electron lớp ngoài cùng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong cùng một nhóm A, khi đi từ trên xuống dưới, số lớp electron của các nguyên tử", "options": ["A. không đổi.", "B. tăng dần.", "C. giảm dần.", "D. lúc tăng lúc giảm."], "answer": "B", "explain": "Các nguyên tố trong cùng một nhóm A có cùng số electron lớp ngoài cùng; đi từ trên xuống dưới, số lớp electron tăng dần theo số thứ tự chu kì.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố X có Z = 17. Phát biểu nào sau đây đúng?", "options": ["A. X thuộc chu kì 3, nhóm VIIA, là phi kim.", "B. X thuộc chu kì 4, nhóm VIIA, là kim loại.", "C. X thuộc chu kì 3, nhóm VA, là phi kim.", "D. X thuộc chu kì 2, nhóm VIIA, là phi kim."], "answer": "A", "explain": "Cấu hình: $1s^22s^22p^63s^23p^5$. Có 3 lớp electron nên thuộc chu kì 3; 7 electron lớp ngoài cùng, khối p nên thuộc nhóm VIIA (chlorine, phi kim, halogen).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cặp nguyên tố nào sau đây có tính chất hóa học tương tự nhau nhất?", "options": ["A. Na (Z = 11) và Mg (Z = 12).", "B. Na (Z = 11) và K (Z = 19).", "C. Na (Z = 11) và Al (Z = 13).", "D. Mg (Z = 12) và Al (Z = 13)."], "answer": "B", "explain": "Na và K cùng thuộc nhóm IA (đều có 1 electron lớp ngoài cùng) nên tính chất hóa học tương tự nhau. Các cặp còn lại thuộc các nhóm khác nhau.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "X là nguyên tố thuộc nhóm VIIIA, chu kì 3. Cấu hình electron của X là", "options": ["A. $1s^22s^22p^63s^23p^6$.", "B. $1s^22s^22p^63s^23p^5$.", "C. $1s^22s^22p^6$.", "D. $1s^22s^22p^63s^23p^63d^{10}4s^24p^6$."], "answer": "A", "explain": "Nhóm VIIIA chu kì 3 là argon (Ar, Z = 18), cấu hình $1s^22s^22p^63s^23p^6$ với lớp ngoài cùng bền vững 8 electron.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tố X có cấu hình electron lớp ngoài cùng là $ns^2np^4$ và có tổng số electron là 34. X thuộc", "options": ["A. chu kì 3, nhóm VIA.", "B. chu kì 4, nhóm VIA.", "C. chu kì 4, nhóm IVA.", "D. chu kì 3, nhóm IVA."], "answer": "B", "explain": "Tổng số electron 34, lớp ngoài cùng $ns^2np^4$ có 6 electron. Cấu hình đầy đủ: $1s^22s^22p^63s^23p^63d^{10}4s^24p^4$ (selenium, Se). Có 4 lớp electron nên thuộc chu kì 4; 6 electron lớp ngoài cùng, khối p nên thuộc nhóm VIA.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bảng tuần hoàn gồm 7 chu kì và 18 nhóm (8 nhóm A và 8 nhóm B tính theo cột, trong đó nhóm VIIIB chiếm 3 cột).", "b) Nguyên tố H được xếp chung nhóm với các kim loại kiềm.", "c) Tất cả các nguyên tố nhóm A đều có electron cuối cùng điền vào phân lớp s hoặc p.", "d) Các nguyên tố chuyển tiếp thuộc nhóm B."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: 7 chu kì; 18 cột gồm 8 nhóm A và nhóm B trong đó VIIIB chiếm 3 cột. b) Đúng: H ở nhóm IA. c) Đúng: nhóm A là khối s và p. d) Đúng: kim loại chuyển tiếp là các nguyên tố nhóm B.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Cho nguyên tố phosphorus (P, Z = 15). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) P thuộc chu kì 3.", "b) P thuộc nhóm VA.", "c) P thuộc khối p và là phi kim.", "d) P có 3 electron lớp ngoài cùng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: P có 3 lớp electron. b) Đúng: cấu hình lớp ngoài cùng $3s^23p^3$ nên thuộc nhóm VA. c) Đúng: electron cuối vào phân lớp p, P là phi kim. d) Sai: P có 5 electron lớp ngoài cùng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X có Z = 38, thuộc nhóm IIA. Số thứ tự chu kì của X là bao nhiêu?", "answer": "5", "explain": "Cấu hình của X (strontium): $1s^22s^22p^63s^23p^63d^{10}4s^24p^65s^2$. Có 5 lớp electron nên thuộc chu kì 5, nhóm IIA.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tổng số electron trên các phân lớp d của nguyên tử Fe (Z = 26) là bao nhiêu?", "answer": "6", "explain": "Cấu hình Fe: $1s^22s^22p^63s^23p^63d^64s^2$. Phân lớp d duy nhất có electron là 3d với 6 electron.", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên tố nào sau đây là kim loại kiềm?", "options": ["A. Mg.", "B. Na.", "C. Al.", "D. Ca."], "answer": "B", "explain": "Các kim loại kiềm thuộc nhóm IA (trừ H): Li, Na, K, Rb, Cs, Fr. Na thuộc nhóm IA nên là kim loại kiềm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tố nào sau đây là halogen?", "options": ["A. O.", "B. N.", "C. Cl.", "D. Ne."], "answer": "C", "explain": "Các halogen thuộc nhóm VIIA: F, Cl, Br, I, At. Cl thuộc nhóm VIIA nên là halogen.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố X ở chu kì 2, nhóm VIA. X là", "options": ["A. oxygen.", "B. sulfur.", "C. nitrogen.", "D. carbon."], "answer": "A", "explain": "Chu kì 2, nhóm VIA: cấu hình $1s^22s^22p^4$, Z = 8, đó là oxygen (O).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây sai về bảng tuần hoàn?", "options": ["A. Các nguyên tố trong cùng một nhóm A có số electron lớp ngoài cùng bằng nhau.", "B. Số thứ tự chu kì bằng số lớp electron.", "C. Các nguyên tố nhóm B đều là phi kim.", "D. Bảng tuần hoàn có 4 khối s, p, d, f."], "answer": "C", "explain": "Các nguyên tố nhóm B đều là kim loại (kim loại chuyển tiếp), không phải phi kim. Các phát biểu còn lại đều đúng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai nguyên tố X và Y cùng thuộc nhóm IIA, X ở chu kì 3 và Y ở chu kì 4. Phát biểu nào sau đây đúng?", "options": ["A. X và Y đều có 2 lớp electron.", "B. Số hiệu nguyên tử của Y lớn hơn của X là 8.", "C. X là Mg, Y là Ca và số hiệu nguyên tử của Y lớn hơn X là 8.", "D. X và Y đều là phi kim."], "answer": "C", "explain": "X là Mg (Z = 12), Y là Ca (Z = 20). Hiệu số hiệu nguyên tử: 20 - 12 = 8. Cả hai đều là kim loại kiềm thổ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tố R có cấu hình electron: $1s^22s^22p^63s^23p^63d^34s^2$. Vị trí của R trong bảng tuần hoàn là", "options": ["A. chu kì 4, nhóm IIIB.", "B. chu kì 4, nhóm VB.", "C. chu kì 3, nhóm IIIB.", "D. chu kì 4, nhóm IIIA."], "answer": "B", "explain": "R có 4 lớp electron nên thuộc chu kì 4. Electron cuối vào phân lớp d nên thuộc nhóm B; tổng electron hóa trị là 3 + 2 = 5? Kiểm tra: cấu hình $3d^34s^2$ có tổng 5 electron hóa trị nên thuộc nhóm VB (vanadium, V, Z = 23).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kim loại kiềm thuộc nhóm IA.", "b) Kim loại kiềm thổ thuộc nhóm IIA.", "c) Halogen thuộc nhóm VIIA.", "d) Khí hiếm thuộc nhóm VIIIB."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: khí hiếm thuộc nhóm VIIIA, còn VIIIB là một nhóm B gồm các kim loại chuyển tiếp (Fe, Co, Ni...).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Cho nguyên tố potassium (K, Z = 19). Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) K thuộc chu kì 4.", "b) K thuộc nhóm IA.", "c) K là kim loại kiềm.", "d) K có 2 electron lớp ngoài cùng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: K có 4 lớp electron. b) Đúng: cấu hình $[Ar]4s^1$ nên thuộc nhóm IA. c) Đúng: kim loại nhóm IA là kim loại kiềm. d) Sai: K chỉ có 1 electron lớp ngoài cùng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X thuộc nhóm IA, chu kì 3. Kí hiệu hóa học của X là gì?", "answer": "Na", "explain": "Chu kì 3, nhóm IA: cấu hình $[Ne]3s^1$, Z = 11, đó là sodium (Na).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguyên tố X có 4 lớp electron và 7 electron ở lớp ngoài cùng. Số hiệu nguyên tử Z của X là bao nhiêu?", "answer": "35", "explain": "4 lớp electron, lớp ngoài cùng 7 electron ($4s^24p^5$): cấu hình $1s^22s^22p^63s^23p^63d^{10}4s^24p^5$, Z = 2+2+6+2+6+10+2+5 = 35 (bromine).", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Số electron lớp ngoài cùng của các nguyên tố nhóm VIIA là", "options": ["A. 5.", "B. 6.", "C. 7.", "D. 8."], "answer": "C", "explain": "Số thứ tự nhóm A bằng số electron lớp ngoài cùng nên các nguyên tố nhóm VIIA có 7 electron lớp ngoài cùng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Số electron lớp ngoài cùng của các nguyên tố nhóm IIA là", "options": ["A. 1.", "B. 2.", "C. 3.", "D. 4."], "answer": "B", "explain": "Số thứ tự nhóm A bằng số electron lớp ngoài cùng nên các nguyên tố nhóm IIA có 2 electron lớp ngoài cùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố X có cấu hình electron $[Ne]3s^23p^3$. Phát biểu nào sau đây sai?", "options": ["A. X thuộc chu kì 3.", "B. X thuộc nhóm VA.", "C. X là phosphorus, một phi kim.", "D. X có 3 electron lớp ngoài cùng."], "answer": "D", "explain": "X là P (Z = 15): 3 lớp electron nên thuộc chu kì 3; lớp ngoài cùng $3s^23p^3$ có 5 electron nên thuộc nhóm VA (khối p, phi kim). Phát biểu D sai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các nguyên tố sau, nguyên tố nào KHÔNG thuộc chu kì 3?", "options": ["A. Na (Z = 11).", "B. S (Z = 16).", "C. K (Z = 19).", "D. Cl (Z = 17)."], "answer": "C", "explain": "K (Z = 19) có cấu hình $[Ar]4s^1$, có 4 lớp electron nên thuộc chu kì 4. Na, S, Cl đều có 3 lớp electron nên thuộc chu kì 3.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết vị trí của các nguyên tố: X (chu kì 2, nhóm IVA), Y (chu kì 3, nhóm VIA). Kí hiệu của X và Y lần lượt là", "options": ["A. C và S.", "B. Si và O.", "C. C và O.", "D. N và S."], "answer": "A", "explain": "X: chu kì 2, nhóm IVA là carbon (C, Z = 6). Y: chu kì 3, nhóm VIA là sulfur (S, Z = 16).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tố X thuộc chu kì 3, có 1 electron độc thân ở trạng thái cơ bản. Số hiệu nguyên tử của X có thể là", "options": ["A. 13 hoặc 15.", "B. 15 hoặc 17.", "C. 13 hoặc 17.", "D. 14 hoặc 16."], "answer": "C", "explain": "Chu kì 3: cấu hình $3s^23p^1$ (Al, Z = 13) có 1 electron độc thân; $3s^23p^5$ (Cl, Z = 17) có 1 electron độc thân. Còn $3p^2$ (Si) và $3p^4$ (S) có 2 electron độc thân, $3p^3$ (P) có 3 electron độc thân.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nguyên tử có 1 electron lớp ngoài cùng thường là kim loại (trừ H, He).", "b) Nguyên tử có 7 electron lớp ngoài cùng thường là phi kim halogen.", "c) Nguyên tử có 8 electron lớp ngoài cùng (trừ He) là khí hiếm, rất khó tham gia phản ứng hóa học.", "d) Nguyên tử có 4 electron lớp ngoài cùng đều là kim loại."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: nhóm IA (trừ H) là kim loại kiềm. b) Đúng: nhóm VIIA là halogen, phi kim. c) Đúng: khí hiếm có lớp ngoài cùng bền vững. d) Sai: nhóm IVA gồm cả kim loại (Sn, Pb), phi kim (C) và á kim (Si, Ge).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về các nguyên tố chu kì 2:", "statements": ["a) Li (Z = 3) thuộc nhóm IA.", "b) Be (Z = 4) thuộc nhóm IIA.", "c) B (Z = 5) thuộc nhóm IIIA.", "d) F (Z = 9) thuộc nhóm VIA."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Li có 1 electron lớp ngoài cùng. b) Đúng: Be có 2 electron lớp ngoài cùng. c) Đúng: B có 3 electron lớp ngoài cùng. d) Sai: F có 7 electron lớp ngoài cùng nên thuộc nhóm VIIA.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X ở ô thứ 12 trong bảng tuần hoàn. Số electron lớp ngoài cùng của X là bao nhiêu?", "answer": "2", "explain": "Ô thứ 12 là Mg (Z = 12), cấu hình $[Ne]3s^2$, thuộc nhóm IIA nên có 2 electron lớp ngoài cùng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguyên tố X thuộc nhóm VA, có nguyên tử khối trung bình là 30,97. Kí hiệu hóa học của X là gì?", "answer": "P", "explain": "Nguyên tử khối 30,97 ứng với phosphorus (P). P có cấu hình $[Ne]3s^23p^3$, thuộc chu kì 3, nhóm VA.", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Trong bảng tuần hoàn, nguyên tố nào sau đây thuộc chu kì 1?", "options": ["A. Li.", "B. H.", "C. Na.", "D. K."], "answer": "B", "explain": "Chu kì 1 chỉ gồm 2 nguyên tố là H (Z = 1) và He (Z = 2), đều chỉ có 1 lớp electron.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tố helium (He, Z = 2) được xếp vào nhóm", "options": ["A. IA.", "B. IIA.", "C. VIIIA.", "D. VIIA."], "answer": "C", "explain": "He có 2 electron lớp ngoài cùng nhưng là khí hiếm nên được xếp vào nhóm VIIIA, không phải nhóm IIA.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố X có Z = 31. Vị trí của X là", "options": ["A. chu kì 4, nhóm IIIA.", "B. chu kì 3, nhóm IIIA.", "C. chu kì 4, nhóm VA.", "D. chu kì 4, nhóm IIIB."], "answer": "A", "explain": "Cấu hình: $1s^22s^22p^63s^23p^63d^{10}4s^24p^1$ (gallium, Ga). Có 4 lớp electron nên thuộc chu kì 4; lớp ngoài cùng có 3 electron, khối p nên thuộc nhóm IIIA.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dãy nào sau đây gồm các nguyên tố thuộc cùng một nhóm?", "options": ["A. Na, Mg, Al.", "B. F, Cl, Br.", "C. Li, Be, B.", "D. O, S, Cl."], "answer": "B", "explain": "F, Cl, Br đều thuộc nhóm VIIA (halogen), có 7 electron lớp ngoài cùng nên tính chất tương tự nhau.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X thuộc chu kì 4, nhóm IVA. Cấu hình electron của X là", "options": ["A. $[Ar]3d^{10}4s^24p^2$.", "B. $[Ar]3d^{10}4s^24p^4$.", "C. $[Ar]4s^24p^2$.", "D. $[Ar]3d^24s^2$."], "answer": "A", "explain": "Chu kì 4, nhóm IVA (khối p): cấu hình $[Ar]3d^{10}4s^24p^2$ (germanium, Ge, Z = 32), lớp ngoài cùng có 4 electron.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "X, Y là hai nguyên tố thuộc cùng nhóm A, ở hai chu kì liên tiếp. Tổng số hiệu nguyên tử của X và Y là 32. X và Y lần lượt là (biết X đứng trước Y)", "options": ["A. Na và K.", "B. Mg và Ca.", "C. F và Cl.", "D. Li và Na."], "answer": "B", "explain": "Cùng nhóm A, hai chu kì liên tiếp: với chu kì nhỏ, hiệu Z là 8; với chu kì lớn, hiệu Z là 18. $Z_X + Z_Y = 32$: thử Mg (12) và Ca (20): 12 + 20 = 32, hiệu 8 (từ chu kì 3 sang chu kì 4). Vậy X là Mg, Y là Ca.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chu kì 2 và chu kì 3 đều có 8 nguyên tố.", "b) Chu kì 4 và chu kì 5 đều có 18 nguyên tố.", "c) Chu kì 7 là chu kì chưa hoàn thiện.", "d) Chu kì 1 có 8 nguyên tố."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: chu kì 2 (Li đến Ne) và chu kì 3 (Na đến Ar) đều có 8 nguyên tố. b) Đúng: chu kì 4 và 5 đều có 18 nguyên tố. c) Đúng: chu kì 7 đang được bổ sung dần. d) Sai: chu kì 1 chỉ có 2 nguyên tố (H, He).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về nguyên tố argon (Ar, Z = 18):", "statements": ["a) Ar thuộc chu kì 3.", "b) Ar thuộc nhóm VIIIA.", "c) Ar là khí hiếm.", "d) Ar có 6 electron lớp ngoài cùng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Ar có 3 lớp electron. b) Đúng: lớp ngoài cùng $3s^23p^6$ có 8 electron nên thuộc nhóm VIIIA. c) Đúng: Ar là khí hiếm. d) Sai: Ar có 8 electron lớp ngoài cùng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X thuộc nhóm VIA, chu kì 2. Số proton trong nguyên tử X là bao nhiêu?", "answer": "8", "explain": "Nhóm VIA chu kì 2: cấu hình $1s^22s^22p^4$, Z = 8 (oxygen).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguyên tố X có tổng số hạt cơ bản là 40, số hạt mang điện nhiều hơn số hạt không mang điện là 12. X thuộc chu kì mấy, nhóm mấy? (trả lời dạng: chu kì a, nhóm b — ví dụ: chu kì 3, nhóm IA)", "answer": "chu kì 3, nhóm IIIA", "explain": "Gọi Z là số proton, N là số neutron: 2Z + N = 40 và 2Z - N = 12, giải ra Z = 13, N = 14. X là Al: cấu hình $[Ne]3s^23p^1$ nên thuộc chu kì 3, nhóm IIIA.", "points": 0.5}]},
{"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Bảng tuần hoàn các nguyên tố hóa học do nhà bác học nào đề xuất (dạng gần với hiện nay)?", "options": ["A. Dalton.", "B. Mendeleev.", "C. Rutherford.", "D. Bohr."], "answer": "B", "explain": "Năm 1869, nhà bác học người Nga D. I. Mendeleev đã công bố bảng tuần hoàn các nguyên tố hóa học, là cơ sở của bảng tuần hoàn hiện đại.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong ô nguyên tố, số hiệu nguyên tử Z cho biết", "options": ["A. số khối của nguyên tử.", "B. số proton và số electron của nguyên tử.", "C. số neutron của nguyên tử.", "D. nguyên tử khối trung bình."], "answer": "B", "explain": "Số hiệu nguyên tử Z bằng số đơn vị điện tích hạt nhân, bằng số proton và bằng số electron của nguyên tử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố X có cấu hình electron $1s^22s^22p^63s^23p^63d^54s^1$. Phát biểu nào sau đây đúng?", "options": ["A. X thuộc nhóm IA vì có 1 electron ở phân lớp 4s.", "B. X thuộc chu kì 4, nhóm VIB.", "C. X thuộc chu kì 3, nhóm VIB.", "D. X là phi kim."], "answer": "B", "explain": "X là Cr (Z = 24): có 4 lớp electron nên thuộc chu kì 4; electron cuối vào phân lớp d, tổng electron hóa trị 5 + 1 = 6 nên thuộc nhóm VIB (kim loại chuyển tiếp).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dãy các nguyên tố nào sau đây được sắp xếp theo chiều tăng dần của số lớp electron?", "options": ["A. Na, K, Li.", "B. Li, Na, K.", "C. K, Na, Li.", "D. Na, Li, K."], "answer": "B", "explain": "Li (chu kì 2) có 2 lớp, Na (chu kì 3) có 3 lớp, K (chu kì 4) có 4 lớp electron. Dãy tăng dần số lớp electron là Li, Na, K.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X thuộc nhóm IIA. Oxide cao nhất của X có công thức", "options": ["A. $X_2O$.", "B. $XO$.", "C. $X_2O_3$.", "D. $XO_2$."], "answer": "B", "explain": "Nguyên tố nhóm IIA có 2 electron lớp ngoài cùng nên hóa trị cao nhất là II, oxide cao nhất có công thức XO (ví dụ MgO, CaO).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai nguyên tố X, Y thuộc hai nhóm A liên tiếp trong cùng một chu kì, có tổng số proton là 31. Số electron lớp ngoài cùng của X và Y lần lượt là (biết X đứng trước Y)", "options": ["A. 1 và 2.", "B. 6 và 7.", "C. 2 và 3.", "D. 5 và 6."], "answer": "D", "explain": "Hai nhóm A liên tiếp trong cùng chu kì: $Z_Y = Z_X + 1$ và $Z_X + Z_Y = 31$ nên $Z_X = 15$ (P), $Z_Y = 16$ (S). P thuộc nhóm VA có 5 electron lớp ngoài cùng; S thuộc nhóm VIA có 6 electron lớp ngoài cùng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mendeleev sắp xếp các nguyên tố theo chiều tăng dần của nguyên tử khối.", "b) Bảng tuần hoàn hiện đại sắp xếp theo chiều tăng dần của điện tích hạt nhân.", "c) Định luật tuần hoàn: tính chất của các nguyên tố biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân.", "d) Các nguyên tố trong cùng một nhóm có tính chất hóa học tương tự nhau."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: bảng của Mendeleev sắp xếp theo nguyên tử khối tăng dần. b) Đúng: bảng hiện đại sắp xếp theo Z tăng dần. c) Đúng: nội dung định luật tuần hoàn. d) Đúng: cùng số electron lớp ngoài cùng nên tính chất tương tự.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nguyên tố S (Z = 16) và O (Z = 8) cùng thuộc nhóm VIA.", "b) Nguyên tố Na (Z = 11) và K (Z = 19) cùng thuộc nhóm IA.", "c) Nguyên tố Ca (Z = 20) và Mg (Z = 12) cùng thuộc chu kì 3.", "d) Nguyên tố N (Z = 7) và P (Z = 15) cùng thuộc nhóm VA."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: S và O đều có 6 electron lớp ngoài cùng. b) Đúng: Na và K đều có 1 electron lớp ngoài cùng. c) Sai: Mg thuộc chu kì 3, Ca thuộc chu kì 4. d) Đúng: N và P đều có 5 electron lớp ngoài cùng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X có Z = 19. X thuộc nhóm nào? (trả lời dạng: nhóm IA)", "answer": "nhóm IA", "explain": "K (Z = 19) có cấu hình $[Ar]4s^1$, 1 electron lớp ngoài cùng, khối s nên thuộc nhóm IA.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ion $X^{2+}$ có cấu hình electron lớp ngoài cùng là $3s^23p^6$. Số hiệu nguyên tử Z của nguyên tố X là bao nhiêu?", "answer": "20", "explain": "Ion $X^{2+}$ có cấu hình $[Ne]3s^23p^6$ (giống Ar, 18 electron). Nguyên tử X có 18 + 2 = 20 electron nên Z = 20 (calcium).", "points": 0.5}]}]}
