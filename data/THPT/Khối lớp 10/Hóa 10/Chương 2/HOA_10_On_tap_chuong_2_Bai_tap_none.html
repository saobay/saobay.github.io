<script type="application/json" class="saobay-exam10-data">{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên tố X có cấu hình electron $1s^22s^22p^63s^23p^5$. Vị trí của X trong bảng tuần hoàn là", "options": ["A. chu kì 3, nhóm VA.", "B. chu kì 3, nhóm VIIA.", "C. chu kì 2, nhóm VIIA.", "D. chu kì 3, nhóm VIA."], "answer": "B", "explain": "X có 3 lớp electron nên thuộc chu kì 3; lớp ngoài cùng có 7 electron, khối p nên thuộc nhóm VIIA (X là Cl).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong một chu kì, khi đi từ trái sang phải, tính kim loại", "options": ["A. tăng dần.", "B. giảm dần.", "C. không đổi.", "D. tăng rồi giảm."], "answer": "B", "explain": "Trong một chu kì, từ trái sang phải khả năng nhường electron giảm dần nên tính kim loại giảm dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Oxide cao nhất của nguyên tố R thuộc nhóm IVA có công thức là", "options": ["A. $RO$.", "B. $RO_2$.", "C. $RO_3$.", "D. $R_2O_5$."], "answer": "B", "explain": "Nguyên tố nhóm IVA có hóa trị cao nhất với oxygen là IV nên oxide cao nhất là $RO_2$ (ví dụ $CO_2, SiO_2$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh bán kính nguyên tử của $Na$ (Z = 11) và $K$ (Z = 19). Kết luận đúng là", "options": ["A. $r_{Na} \\gt r_K$.", "B. $r_{Na} \\lt r_K$.", "C. $r_{Na} = r_K$.", "D. Không so sánh được."], "answer": "B", "explain": "Na và K cùng thuộc nhóm IA, K ở chu kì dưới (nhiều lớp electron hơn) nên $r_K$ lớn hơn $r_{Na}$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho các nguyên tố thuộc chu kì 3: $Na, Mg, Al, Si$. Sắp xếp theo chiều tăng dần của độ âm điện là", "options": ["A. $Na \\lt Mg \\lt Al \\lt Si$.", "B. $Si \\lt Al \\lt Mg \\lt Na$.", "C. $Mg \\lt Na \\lt Al \\lt Si$.", "D. $Na \\lt Al \\lt Mg \\lt Si$."], "answer": "A", "explain": "Trong chu kì 3, từ trái sang phải độ âm điện tăng dần nên thứ tự tăng dần là Na, Mg, Al, Si.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tố X có tổng số hạt cơ bản là 28. Biết X thuộc nhóm VIA. Số hiệu nguyên tử và vị trí của X là", "options": ["A. Z = 8; chu kì 2, nhóm VIA.", "B. Z = 16; chu kì 3, nhóm VIA.", "C. Z = 8; chu kì 3, nhóm VIA.", "D. Z = 16; chu kì 2, nhóm VIA."], "answer": "A", "explain": "Gọi Z là số proton, N là số neutron: $2Z + N = 28$. X thuộc nhóm VIA nên Z có thể là 8 (O), 16 (S), 34 (Se). Thử Z = 8: N = 12 (đồng vị O-20, ít phổ biến nhưng thỏa mãn toán học); Z = 16: N = -4 (loại). Vậy Z = 8, X là O, thuộc chu kì 2, nhóm VIA.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bảng tuần hoàn có 7 chu kì.", "b) Số thứ tự chu kì bằng số lớp electron.", "c) Số thứ tự nhóm A bằng số electron lớp ngoài cùng.", "d) Các nguyên tố nhóm B đều là phi kim."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: các nguyên tố nhóm B đều là kim loại (kim loại chuyển tiếp).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong chu kì 3, $Na$ có bán kính nguyên tử lớn nhất.", "b) Trong nhóm IA, $Cs$ có tính kim loại mạnh nhất.", "c) $F$ có độ âm điện lớn nhất.", "d) $Al_2O_3$ là oxide base."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Na đứng đầu chu kì 3. b) Đúng: trong nhóm IA, tính kim loại tăng dần xuống dưới. c) Đúng: 3,98. d) Sai: $Al_2O_3$ là oxide lưỡng tính.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hydroxide tương ứng với oxide cao nhất của $P_2O_5$.", "answer": "$H_3PO_4$", "explain": "$P_2O_5 + 3H_2O \\rightarrow 2H_3PO_4$ nên hydroxide (acid) tương ứng là $H_3PO_4$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các nguyên tố $Li, Na, K, Rb$ theo chiều tăng dần của bán kính nguyên tử. (viết các kí hiệu cách nhau bởi dấu cách)", "answer": "$Li$ $Na$ $K$ $Rb$", "explain": "Li, Na, K, Rb cùng thuộc nhóm IA. Trong nhóm A, từ trên xuống dưới bán kính tăng dần nên thứ tự tăng dần là Li, Na, K, Rb.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Định luật tuần hoàn phát biểu rằng tính chất của các nguyên tố biến đổi tuần hoàn theo chiều tăng của", "options": ["A. nguyên tử khối.", "B. điện tích hạt nhân nguyên tử.", "C. số neutron.", "D. khối lượng riêng."], "answer": "B", "explain": "Định luật tuần hoàn (dạng hiện đại): tính chất biến đổi tuần hoàn theo chiều tăng của điện tích hạt nhân nguyên tử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hóa trị cao nhất với oxygen của nguyên tố thuộc nhóm IIA là", "options": ["A. I.", "B. II.", "C. III.", "D. IV."], "answer": "B", "explain": "Hóa trị cao nhất với oxygen bằng số thứ tự nhóm A nên nguyên tố nhóm IIA có hóa trị II (oxide RO).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố X thuộc chu kì 4, nhóm VIIA. Dự đoán nào sau đây đúng về X?", "options": ["A. X là kim loại kiềm.", "B. X là halogen, đơn chất $X_2$ có tính oxi hóa yếu hơn $Cl_2$.", "C. X là khí hiếm.", "D. X là kim loại kiềm thổ."], "answer": "B", "explain": "X là Br (chu kì 4, nhóm VIIA): halogen; trong nhóm VIIA, tính oxi hóa giảm dần xuống dưới nên $Br_2$ yếu hơn $Cl_2$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các hydroxide sau, hydroxide có tính acid mạnh nhất là", "options": ["A. $NaOH$.", "B. $Al(OH)_3$.", "C. $H_2SO_4$.", "D. $Mg(OH)_2$."], "answer": "C", "explain": "Trong chu kì 3, tính acid tăng dần từ trái sang phải nên $H_2SO_4$ (S, nhóm VIA) có tính acid mạnh nhất trong bốn chất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho các ion: $F^-, Cl^-, Br^-$. Sắp xếp theo chiều tăng dần của tính khử là", "options": ["A. $F^- \\lt Cl^- \\lt Br^-$.", "B. $Br^- \\lt Cl^- \\lt F^-$.", "C. $Cl^- \\lt F^- \\lt Br^-$.", "D. $F^- \\lt Br^- \\lt Cl^-$."], "answer": "A", "explain": "Trong nhóm VIIA, từ trên xuống dưới tính phi kim giảm dần nên tính khử của các ion tăng dần theo thứ tự: $F^-$, $Cl^-$, $Br^-$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai nguyên tố X, Y thuộc hai chu kì liên tiếp và cùng thuộc nhóm IIA. Biết hiệu số hiệu nguyên tử $Z_Y - Z_X = 8$ và tổng số hiệu nguyên tử $Z_X + Z_Y = 32$. X và Y lần lượt là", "options": ["A. $Mg$ và $Sr$.", "B. $Ca$ và $Ba$.", "C. $Be$ và $Mg$.", "D. $Mg$ và $Ca$."], "answer": "D", "explain": "Giải hệ: $Z_Y - Z_X = 8$, $Z_X + Z_Y = 32$ được $Z_X = 12$, $Z_Y = 20$. X là Mg (chu kì 3, nhóm IIA), Y là Ca (chu kì 4, nhóm IIA).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Oxide của kim loại thường là oxide base.", "b) Oxide của phi kim thường là oxide acid.", "c) $CO$ là oxide trung tính.", "d) $Al_2O_3$ là oxide acid."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $Al_2O_3$ là oxide lưỡng tính.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bán kính nguyên tử của $Mg$ lớn hơn của $Al$.", "b) Độ âm điện của $S$ lớn hơn của $P$.", "c) Tính kim loại của $K$ mạnh hơn của $Ca$.", "d) Tính phi kim của $Br$ mạnh hơn của $Cl$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: cùng chu kì 3, Mg đứng trước Al. b) Đúng: cùng chu kì 3, S đứng sau P. c) Đúng: cùng chu kì 4, K (nhóm IA) đứng trước Ca (nhóm IIA). d) Sai: cùng nhóm VIIA, Cl ở trên Br nên tính phi kim mạnh hơn.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hợp chất khí với hydrogen của nitrogen (N, nhóm VA).", "answer": "$NH_3$", "explain": "N thuộc nhóm VA nên hóa trị với H là III, hợp chất khí là $NH_3$ (ammonia).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguyên tố R thuộc chu kì 3, nhóm IIIA. Viết công thức oxide cao nhất của R.", "answer": "$Al_2O_3$", "explain": "R là Al (chu kì 3, nhóm IIIA), hóa trị cao nhất với O là III nên oxide cao nhất là $Al_2O_3$.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Trong bảng tuần hoàn, nguyên tố có 3 lớp electron và 2 electron lớp ngoài cùng thuộc", "options": ["A. chu kì 2, nhóm IIA.", "B. chu kì 3, nhóm IIA.", "C. chu kì 3, nhóm IIIA.", "D. chu kì 2, nhóm IIIA."], "answer": "B", "explain": "3 lớp electron nên thuộc chu kì 3; 2 electron lớp ngoài cùng nên thuộc nhóm IIA (X là Mg).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Độ âm điện của các nguyên tố trong một nhóm A biến đổi như thế nào từ trên xuống dưới?", "options": ["A. Tăng dần.", "B. Giảm dần.", "C. Không đổi.", "D. Tăng rồi giảm."], "answer": "B", "explain": "Trong nhóm A, từ trên xuống dưới bán kính tăng nên khả năng hút electron giảm, độ âm điện giảm dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các nguyên tố: $C$ (Z = 6), $Si$ (Z = 14). So sánh tính phi kim của chúng:", "options": ["A. Tính phi kim của $C$ mạnh hơn của $Si$.", "B. Tính phi kim của $Si$ mạnh hơn của $C$.", "C. Tính phi kim của hai nguyên tố như nhau.", "D. Cả hai đều là kim loại."], "answer": "A", "explain": "C và Si cùng thuộc nhóm IVA, C ở trên Si. Trong nhóm A, từ trên xuống dưới tính phi kim giảm dần nên C có tính phi kim mạnh hơn Si.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hydroxide nào sau đây vừa tác dụng được với dung dịch $HCl$ vừa tác dụng được với dung dịch $NaOH$?", "options": ["A. $NaOH$.", "B. $Mg(OH)_2$.", "C. $Al(OH)_3$.", "D. $KOH$."], "answer": "C", "explain": "$Al(OH)_3$ là hydroxide lưỡng tính nên vừa tác dụng với acid vừa tác dụng với base.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sắp xếp các nguyên tố $O, F, Ne$ theo chiều tăng dần của bán kính nguyên tử là", "options": ["A. $Ne \\lt F \\lt O$.", "B. $O \\lt F \\lt Ne$.", "C. $F \\lt O \\lt Ne$.", "D. $F \\lt Ne \\lt O$."], "answer": "C", "explain": "O, F, Ne cùng thuộc chu kì 2. Trong chu kì, bán kính giảm dần từ trái sang phải; khí hiếm Ne được đo theo bán kính van der Waals nên lớn hơn. Thứ tự tăng dần: F, O, Ne.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tố X thuộc chu kì 3, có số electron độc thân ở trạng thái cơ bản là 2. X có thể là nguyên tố nào sau đây?", "options": ["A. $Na$ hoặc $Mg$.", "B. $Si$ hoặc $S$.", "C. $P$ hoặc $Cl$.", "D. $Al$ hoặc $Ar$."], "answer": "B", "explain": "Chu kì 3: cấu hình $3s^23p^2$ (Si) có 2 electron độc thân trên 2 obitan p; $3s^23p^4$ (S) có 2 electron độc thân. $3p^1$ (Al) và $3p^5$ (Cl) có 1; $3p^3$ (P) có 3; $3p^6$ (Ar) có 0.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $He$ thuộc nhóm VIIIA.", "b) $He$ có 2 electron lớp ngoài cùng.", "c) $He$ là khí hiếm.", "d) $He$ thuộc nhóm IIA."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: cấu hình $1s^2$. c) Đúng. d) Sai: He là ngoại lệ, xếp vào nhóm VIIIA.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong chu kì 3, tính base của $Na_2O$ mạnh hơn của $MgO$.", "b) Trong chu kì 3, tính acid của $SO_3$ mạnh hơn của $P_2O_5$.", "c) $H_2SiO_3$ là acid mạnh.", "d) $HClO_4$ là acid rất mạnh."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: tính base giảm dần từ trái sang phải. b) Đúng: tính acid tăng dần từ trái sang phải. c) Sai: $H_2SiO_3$ là acid yếu. d) Đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X có Z = 15. Viết công thức hợp chất khí của X với hydrogen.", "answer": "$PH_3$", "explain": "X là P (nhóm VA), hóa trị với H là III nên hợp chất khí là $PH_3$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các base $NaOH, Mg(OH)_2, Al(OH)_3$ theo chiều giảm dần của tính base. (viết các công thức cách nhau bởi dấu cách)", "answer": "$NaOH$ $Mg(OH)_2$ $Al(OH)_3$", "explain": "Trong chu kì 3, tính base giảm dần từ trái sang phải: NaOH (base mạnh), Mg(OH)2 (base yếu), Al(OH)3 (lưỡng tính).", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Khối các nguyên tố trong bảng tuần hoàn được phân chia dựa trên", "options": ["A. số lớp electron.", "B. phân lớp của electron cuối cùng được điền vào.", "C. số hiệu nguyên tử.", "D. nguyên tử khối."], "answer": "B", "explain": "Dựa vào electron cuối cùng được điền vào phân lớp nào (s, p, d hay f), các nguyên tố được chia thành 4 khối s, p, d, f.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Các nguyên tố nhóm B thuộc khối", "options": ["A. s và p.", "B. d và f.", "C. chỉ s.", "D. chỉ p."], "answer": "B", "explain": "Nhóm B (nhóm phụ) gồm các nguyên tố có electron cuối cùng điền vào phân lớp d hoặc f, tức khối d và khối f.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố $Fe$ (Z = 26) thuộc", "options": ["A. chu kì 4, nhóm VIIIB.", "B. chu kì 3, nhóm VIIIB.", "C. chu kì 4, nhóm VIIIA.", "D. chu kì 4, nhóm VIB."], "answer": "A", "explain": "Cấu hình Fe: $[Ar]3d^64s^2$. Có 4 lớp electron nên thuộc chu kì 4; electron cuối vào phân lớp d, tổng electron hóa trị 6 + 2 = 8 nên thuộc nhóm VIIIB.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các tính chất sau, tính chất nào biến đổi cùng chiều với bán kính nguyên tử trong một chu kì?", "options": ["A. Độ âm điện.", "B. Tính kim loại.", "C. Tính phi kim.", "D. Hóa trị với oxygen."], "answer": "B", "explain": "Trong một chu kì, bán kính nguyên tử giảm dần và tính kim loại cũng giảm dần nên hai đại lượng biến đổi cùng chiều.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho biết độ âm điện: $H$ (2,20), $Cl$ (3,16), $Na$ (0,93). Liên kết $Na-Cl$ và $H-Cl$ lần lượt là", "options": ["A. liên kết ion và liên kết cộng hóa trị có cực.", "B. liên kết cộng hóa trị có cực và liên kết ion.", "C. đều là liên kết ion.", "D. đều là liên kết cộng hóa trị không cực."], "answer": "A", "explain": "$\\Delta\\chi_{Na-Cl} = 3{,}16 - 0{,}93 = 2{,}23 \\ge 1{,}7$ nên là liên kết ion. $\\Delta\\chi_{H-Cl} = 3{,}16 - 2{,}20 = 0{,}96$ (từ 0,4 đến dưới 1,7) nên là liên kết cộng hóa trị có cực.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "X là nguyên tố thuộc nhóm VIA. Oxide cao nhất của X là $XO_3$ và $X$ tạo hợp chất khí $XH_2$. Biết nguyên tử khối của X là 32. X là", "options": ["A. $O$.", "B. $S$.", "C. $Se$.", "D. $Te$."], "answer": "B", "explain": "Nhóm VIA gồm O, S, Se, Te. Nguyên tử khối 32 ứng với sulfur (S).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về số electron lớp ngoài cùng:", "statements": ["a) Nguyên tố nhóm IA có 1 electron ở lớp ngoài cùng.", "b) Nguyên tố nhóm VIIA có 7 electron ở lớp ngoài cùng.", "c) Khí hiếm (trừ He) có 8 electron ở lớp ngoài cùng.", "d) Nguyên tố nhóm IIIA có 5 electron ở lớp ngoài cùng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: số thứ tự nhóm A bằng số electron lớp ngoài cùng, nhóm IA có 1 electron. b) Đúng: nhóm VIIA có 7 electron lớp ngoài cùng. c) Đúng: khí hiếm có cấu hình electron lớp ngoài cùng bền vững $ns^2np^6$ (trừ He là $1s^2$). d) Sai: nhóm IIIA có 3 electron lớp ngoài cùng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $r_{K} \\gt r_{Na} \\gt r_{Li}$.", "b) $\\chi_{F} \\gt \\chi_{Cl} \\gt \\chi_{Br}$.", "c) Tính kim loại: $Ca \\gt Mg \\gt Be$.", "d) Tính phi kim: $I \\gt Br \\gt Cl$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: cùng nhóm IA, bán kính tăng dần xuống dưới. b) Đúng: cùng nhóm VIIA, độ âm điện giảm dần xuống dưới. c) Đúng: cùng nhóm IIA, tính kim loại tăng dần xuống dưới. d) Sai: cùng nhóm VIIA, tính phi kim giảm dần xuống dưới nên $Cl \\gt Br \\gt I$.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tố X thuộc chu kì 4, nhóm IA. Viết kí hiệu hóa học của X.", "answer": "K", "explain": "Chu kì 4, nhóm IA: cấu hình $[Ar]4s^1$, Z = 19, X là potassium (K).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ion $X^{3+}$ có cấu hình electron là $1s^22s^22p^6$. Số hiệu nguyên tử Z của X là bao nhiêu?", "answer": "13", "explain": "Ion $X^{3+}$ có 10 electron nên nguyên tử X có 10 + 3 = 13 electron, vậy Z = 13 (aluminium).", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Trong ô nguyên tố, thông tin nào sau đây cho biết số thứ tự của nguyên tố trong bảng tuần hoàn?", "options": ["A. Nguyên tử khối.", "B. Số hiệu nguyên tử.", "C. Tên nguyên tố.", "D. Kí hiệu hóa học."], "answer": "B", "explain": "Số hiệu nguyên tử Z chính là số thứ tự của nguyên tố trong bảng tuần hoàn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hợp chất khí với hydrogen của nguyên tố thuộc nhóm VIA có công thức là", "options": ["A. $RH_4$.", "B. $RH_3$.", "C. $RH_2$.", "D. $RH$."], "answer": "C", "explain": "Nguyên tố nhóm VIA có hóa trị II với hydrogen nên hợp chất khí có công thức $RH_2$ (ví dụ $H_2S$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các nguyên tố $N, P, As$ (cùng nhóm VA). Sắp xếp theo chiều tăng dần của tính kim loại là", "options": ["A. $N \\lt P \\lt As$.", "B. $As \\lt P \\lt N$.", "C. $P \\lt N \\lt As$.", "D. $N \\lt As \\lt P$."], "answer": "A", "explain": "Trong nhóm VA, từ trên xuống dưới tính kim loại tăng dần nên thứ tự tăng dần là N, P, As.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Oxide nào sau đây vừa tác dụng được với dung dịch acid vừa tác dụng được với dung dịch base?", "options": ["A. $Na_2O$.", "B. $SO_2$.", "C. $ZnO$.", "D. $CO_2$."], "answer": "C", "explain": "ZnO là oxide lưỡng tính nên vừa tác dụng với dung dịch acid vừa tác dụng với dung dịch base.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X có Z = 35. So sánh tính phi kim của X với $Cl$ (Z = 17):", "options": ["A. Tính phi kim của X mạnh hơn của $Cl$.", "B. Tính phi kim của X yếu hơn của $Cl$.", "C. Tính phi kim của X bằng của $Cl$.", "D. X là kim loại."], "answer": "B", "explain": "X là Br, cùng nhóm VIIA với Cl, Br ở chu kì dưới (chu kì 4). Trong nhóm A, từ trên xuống dưới tính phi kim giảm dần nên Br có tính phi kim yếu hơn Cl.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 0,1 mol $SO_3$ tác dụng hết với nước dư. Khối lượng $H_2SO_4$ thu được là", "options": ["A. 9,8 gam.", "B. 4,9 gam.", "C. 19,6 gam.", "D. 8,0 gam."], "answer": "A", "explain": "$SO_3 + H_2O \\rightarrow H_2SO_4$. Số mol $H_2SO_4 = 0{,}1$ mol, khối lượng $= 0{,}1 \\times 98 = 9{,}8$ gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong một chu kì, số lớp electron của các nguyên tử bằng nhau.", "b) Trong một nhóm A, số electron lớp ngoài cùng của các nguyên tử bằng nhau.", "c) Trong một chu kì, điện tích hạt nhân tăng dần từ trái sang phải.", "d) Trong một nhóm A, điện tích hạt nhân giảm dần từ trên xuống dưới."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: trong nhóm A, từ trên xuống dưới điện tích hạt nhân tăng dần.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Na$ dễ nhường electron hơn $Al$.", "b) $Cl$ dễ nhận electron hơn $P$.", "c) $Mg$ dễ nhường electron hơn $Na$.", "d) $O$ dễ nhận electron hơn $S$."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: trong chu kì 3, tính kim loại giảm dần từ Na đến Al. b) Đúng: trong chu kì 3, tính phi kim tăng dần từ P đến Cl. c) Sai: Na đứng trước Mg nên dễ nhường electron hơn. d) Đúng: trong nhóm VIA, tính phi kim giảm dần xuống dưới.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức oxide cao nhất của $K$ (nhóm IA).", "answer": "$K_2O$", "explain": "K thuộc nhóm IA nên hóa trị với O là I, oxide cao nhất là $K_2O$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các nguyên tố $Al, Si, P$ theo chiều tăng dần của bán kính nguyên tử. (viết các kí hiệu cách nhau bởi dấu cách)", "answer": "$P$ $Si$ $Al$", "explain": "Al, Si, P cùng thuộc chu kì 3. Trong chu kì, từ trái sang phải bán kính giảm dần nên thứ tự tăng dần là P, Si, Al.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên tố nào sau đây là á kim?", "options": ["A. $Na$.", "B. $Si$.", "C. $Cl$.", "D. $Ar$."], "answer": "B", "explain": "Si là á kim, nằm ở ranh giới giữa kim loại và phi kim trong bảng tuần hoàn (nhóm IVA).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vị trí của các á kim trong bảng tuần hoàn là", "options": ["A. đầu mỗi chu kì.", "B. cuối mỗi chu kì.", "C. dọc theo đường chéo ranh giới giữa kim loại và phi kim.", "D. chỉ ở nhóm VIIIA."], "answer": "C", "explain": "Các á kim (B, Si, Ge, As, Sb, Te) nằm dọc theo đường chéo ranh giới giữa khu vực kim loại và phi kim.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho nguyên tố X thuộc chu kì 2, nhóm IVA. X là nguyên tố nào và có tính chất gì?", "options": ["A. $C$, phi kim.", "B. $Si$, á kim.", "C. $N$, phi kim.", "D. $B$, á kim."], "answer": "A", "explain": "Chu kì 2, nhóm IVA là carbon (C): phi kim, tạo hợp chất $CH_4$ và oxide $CO_2$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh độ âm điện của $C$ và $Si$ (cùng nhóm IVA). Kết luận đúng là", "options": ["A. Độ âm điện của $C$ lớn hơn của $Si$.", "B. Độ âm điện của $Si$ lớn hơn của $C$.", "C. Độ âm điện của hai nguyên tố bằng nhau.", "D. Không so sánh được."], "answer": "A", "explain": "Trong nhóm IVA, từ trên xuống dưới độ âm điện giảm dần nên C (chu kì 2) có độ âm điện lớn hơn Si (chu kì 3).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Biết X thuộc nhóm VIIA, Y thuộc nhóm VIA, cả hai cùng thuộc chu kì 3. So sánh bán kính và độ âm điện của X, Y:", "options": ["A. $r_X \\gt r_Y$ và $\\chi_X \\gt \\chi_Y$.", "B. $r_X \\lt r_Y$ và $\\chi_X \\gt \\chi_Y$.", "C. $r_X \\lt r_Y$ và $\\chi_X \\lt \\chi_Y$.", "D. $r_X \\gt r_Y$ và $\\chi_X \\lt \\chi_Y$."], "answer": "B", "explain": "X là Cl, Y là S, cùng chu kì 3, X đứng sau Y. Trong chu kì, từ trái sang phải bán kính giảm dần ($r_{Cl} \\lt r_S$) và độ âm điện tăng dần ($\\chi_{Cl} \\gt \\chi_S$).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hòa tan hoàn toàn 4,8 gam $Mg$ vào dung dịch $HCl$ dư. Thể tích khí $H_2$ thu được ở đktc là", "options": ["A. 2,24 lít.", "B. 4,48 lít.", "C. 6,72 lít.", "D. 1,12 lít."], "answer": "B", "explain": "Số mol Mg $= 4{,}8/24 = 0{,}2$ mol. $Mg + 2HCl \\rightarrow MgCl_2 + H_2$. Số mol $H_2 = 0{,}2$ mol, thể tích $= 0{,}2 \\times 22{,}4 = 4{,}48$ lít.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Si$ được dùng làm vật liệu bán dẫn.", "b) $SiO_2$ là thành phần chính của cát.", "c) $Si$ là kim loại.", "d) $Si$ thuộc nhóm IVA."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: Si là á kim. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong một chu kì, hóa trị cao nhất với oxygen tăng dần từ I đến VII.", "b) Trong một chu kì, hóa trị với hydrogen của phi kim giảm dần từ IV đến I.", "c) Tổng hai hóa trị trên của phi kim nhóm A bằng 8.", "d) Hóa trị cao nhất với oxygen của $O$ là VI."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: O là ngoại lệ, không tạo oxide $O_2O_6$; hóa trị cao nhất thường gặp của O là II.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức phân tử của đơn chất chlorine ở điều kiện thường.", "answer": "$Cl_2$", "explain": "Đơn chất halogen tồn tại ở dạng phân tử hai nguyên tử nên công thức là $Cl_2$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các nguyên tố $Na, Mg, Al$ theo chiều tăng dần của độ âm điện. (viết các kí hiệu cách nhau bởi dấu cách)", "answer": "$Na$ $Mg$ $Al$", "explain": "Na, Mg, Al cùng thuộc chu kì 3. Trong chu kì, từ trái sang phải độ âm điện tăng dần nên thứ tự tăng dần là Na, Mg, Al.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Nguyên tố X có Z = 12. Vị trí của X trong bảng tuần hoàn là", "options": ["A. chu kì 3, nhóm IA.", "B. chu kì 3, nhóm IIA.", "C. chu kì 2, nhóm IIA.", "D. chu kì 3, nhóm IIIA."], "answer": "B", "explain": "Cấu hình X: $1s^22s^22p^63s^2$. Có 3 lớp electron nên thuộc chu kì 3; 2 electron lớp ngoài cùng nên thuộc nhóm IIA (X là Mg).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong một nhóm A, khi đi từ trên xuống dưới, tính kim loại", "options": ["A. tăng dần.", "B. giảm dần.", "C. không đổi.", "D. tăng rồi giảm."], "answer": "A", "explain": "Trong nhóm A, từ trên xuống dưới bán kính tăng, electron lớp ngoài cùng dễ tách hơn nên tính kim loại tăng dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các nguyên tố thuộc nhóm IIA: $Be, Mg, Ca$. Nguyên tố có tính kim loại mạnh nhất là", "options": ["A. $Be$.", "B. $Mg$.", "C. $Ca$.", "D. cả ba như nhau."], "answer": "C", "explain": "Trong nhóm IIA, từ trên xuống dưới tính kim loại tăng dần nên Ca (ở dưới cùng trong ba nguyên tố) có tính kim loại mạnh nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Oxide cao nhất của $P$ (nhóm VA) là $P_2O_5$. Hydroxide tương ứng có tính chất gì?", "options": ["A. Base mạnh.", "B. Acid trung bình.", "C. Lưỡng tính.", "D. Base yếu."], "answer": "B", "explain": "Hydroxide tương ứng với $P_2O_5$ là $H_3PO_4$, là acid trung bình (tính acid tăng dần trong chu kì 3 từ Si đến Cl).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai nguyên tố X (Z = 11) và Y (Z = 19). So sánh bán kính, độ âm điện và tính kim loại của X, Y:", "options": ["A. $r_X \\lt r_Y$, $\\chi_X \\gt \\chi_Y$, tính kim loại của X yếu hơn của Y.", "B. $r_X \\gt r_Y$, $\\chi_X \\lt \\chi_Y$, tính kim loại của X mạnh hơn của Y.", "C. $r_X \\lt r_Y$, $\\chi_X \\lt \\chi_Y$, tính kim loại của X mạnh hơn của Y.", "D. $r_X \\gt r_Y$, $\\chi_X \\gt \\chi_Y$, tính kim loại của X yếu hơn của Y."], "answer": "A", "explain": "X là Na, Y là K, cùng nhóm IA, Y ở dưới X. Trong nhóm A, từ trên xuống dưới: bán kính tăng ($r_{Na} \\lt r_K$), độ âm điện giảm ($\\chi_{Na} \\gt \\chi_K$), tính kim loại tăng (K mạnh hơn Na).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tố R tạo oxide cao nhất $RO_3$. Biết R thuộc chu kì 4 và là phi kim. R là nguyên tố nào?", "options": ["A. $Cr$.", "B. $Se$.", "C. $S$.", "D. $Ca$."], "answer": "B", "explain": "Oxide $RO_3$ cho thấy R thuộc nhóm VIA. Chu kì 4, nhóm VIA, là phi kim: đó là selenium (Se). (Cr thuộc nhóm VIB, là kim loại; S thuộc chu kì 3.)", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Na_2O$ là oxide base.", "b) $SO_3$ là oxide acid.", "c) $NO$ là oxide trung tính.", "d) $Fe_2O_3$ là oxide lưỡng tính."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: $Fe_2O_3$ là oxide base.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong chu kì 3, $Cl$ có độ âm điện lớn nhất (không tính $Ar$).", "b) Trong nhóm VIIA, $F$ có độ âm điện lớn nhất.", "c) $Cs$ có độ âm điện rất nhỏ.", "d) Độ âm điện của $O$ lớn hơn của $F$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: trong chu kì, độ âm điện tăng dần từ trái sang phải. b) Đúng: trong nhóm, độ âm điện giảm dần xuống dưới. c) Đúng: Cs ở cuối nhóm IA nên độ âm điện rất nhỏ (0,79). d) Sai: F có độ âm điện lớn nhất (3,98).", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hóa học của vôi sống.", "answer": "$CaO$", "explain": "Vôi sống là calcium oxide, công thức $CaO$ (oxide base của kim loại kiềm thổ Ca).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các nguyên tố $K, Br, Ca$ theo chiều tăng dần của số hiệu nguyên tử. (viết các kí hiệu cách nhau bởi dấu cách)", "answer": "$K$ $Ca$ $Br$", "explain": "Số hiệu nguyên tử: K (19), Ca (20), Br (35). Thứ tự tăng dần là K, Ca, Br.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các nguyên tố sau, nguyên tố nào thuộc chu kì 3, nhóm VIA?", "options": ["A. $O$.", "B. $S$.", "C. $Se$.", "D. $Te$."], "answer": "B", "explain": "Nhóm VIA gồm O (chu kì 2), S (chu kì 3), Se (chu kì 4), Te (chu kì 5). Nguyên tố thuộc chu kì 3 là S.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Công thức chung của oxide cao nhất của nguyên tố nhóm VIIA là", "options": ["A. $R_2O_5$.", "B. $RO_3$.", "C. $R_2O_7$.", "D. $RO_2$."], "answer": "C", "explain": "Nguyên tố nhóm VIIA có hóa trị cao nhất với oxygen là VII nên oxide cao nhất có công thức $R_2O_7$ (ví dụ $Cl_2O_7$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho dãy các chất: $NaOH, Mg(OH)_2, Al(OH)_3, H_2SiO_3$. Sắp xếp theo chiều giảm dần của tính base là", "options": ["A. $NaOH \\gt Mg(OH)_2 \\gt Al(OH)_3 \\gt H_2SiO_3$.", "B. $H_2SiO_3 \\gt Al(OH)_3 \\gt Mg(OH)_2 \\gt NaOH$.", "C. $Mg(OH)_2 \\gt NaOH \\gt Al(OH)_3 \\gt H_2SiO_3$.", "D. $NaOH \\gt Al(OH)_3 \\gt Mg(OH)_2 \\gt H_2SiO_3$."], "answer": "A", "explain": "Trong chu kì 3, tính base giảm dần từ trái sang phải theo thứ tự: NaOH (base mạnh), Mg(OH)2 (base yếu), Al(OH)3 (lưỡng tính), H2SiO3 (acid yếu).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây sai?", "options": ["A. $F_2$ có tính oxi hóa mạnh hơn $Cl_2$.", "B. $HI$ có tính acid mạnh hơn $HF$.", "C. $I^-$ có tính khử mạnh hơn $Cl^-$.", "D. $Br_2$ có tính oxi hóa mạnh hơn $Cl_2$."], "answer": "D", "explain": "Trong nhóm VIIA, tính oxi hóa giảm dần từ trên xuống dưới nên $Cl_2$ mạnh hơn $Br_2$. Phát biểu D sai.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X có cấu hình electron $[Ar]4s^1$. Vị trí của X trong bảng tuần hoàn là", "options": ["A. chu kì 4, nhóm IA.", "B. chu kì 3, nhóm IA.", "C. chu kì 4, nhóm IIA.", "D. chu kì 4, nhóm VIIIA."], "answer": "A", "explain": "Cấu hình $[Ar]4s^1$ có 4 lớp electron (chu kì 4), 1 electron lớp ngoài cùng, khối s (nhóm IA): đó là K.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 2,3 gam $Na$ tác dụng hết với nước. Thể tích khí $H_2$ thu được ở đktc là", "options": ["A. 1,12 lít.", "B. 2,24 lít.", "C. 3,36 lít.", "D. 4,48 lít."], "answer": "A", "explain": "Số mol Na $= 2{,}3/23 = 0{,}1$ mol. $2Na + 2H_2O \\rightarrow 2NaOH + H_2$. Số mol $H_2 = 0{,}05$ mol, thể tích $= 0{,}05 \\times 22{,}4 = 1{,}12$ lít.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $K$ tác dụng với nước mãnh liệt hơn $Na$.", "b) $Na$ được bảo quản trong dầu hỏa.", "c) $K$ có tính khử mạnh hơn $Na$.", "d) $Li$ là kim loại kiềm hoạt động mạnh nhất."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: trong nhóm IA, tính kim loại tăng dần xuống dưới. b) Đúng: Na dễ bị oxi hóa trong không khí nên ngâm trong dầu hỏa. c) Đúng. d) Sai: Li hoạt động yếu nhất trong nhóm IA.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Cl_2$ tác dụng với dung dịch $NaBr$ tạo $Br_2$.", "b) $Br_2$ tác dụng với dung dịch $NaCl$ tạo $Cl_2$.", "c) Halogen mạnh hơn đẩy được halogen yếu hơn ra khỏi muối.", "d) $F_2$ tác dụng mãnh liệt với nước."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: $Cl_2 + 2NaBr \\rightarrow 2NaCl + Br_2$. b) Sai: $Br_2$ yếu hơn $Cl_2$ nên không đẩy được. c) Đúng: quy luật. d) Đúng: $2F_2 + 2H_2O \\rightarrow 4HF + O_2$.", "points": 1}, {"type": "short", "level": "VD", "q": "Hoàn thành phương trình hóa học (dạng text): Na2O + H2O tạo thành chất nào?", "answer": "2NaOH", "explain": "Phương trình: $Na_2O + H_2O \\rightarrow 2NaOH$. Dạng text: Na2O + H2O tạo thành 2NaOH.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các nguyên tố $Ne, Na, Mg$ theo chiều tăng dần của bán kính nguyên tử. (viết các kí hiệu cách nhau bởi dấu cách)", "answer": "$Mg$ $Na$ $Ne$", "explain": "Na, Mg cùng chu kì 3: $r_{Mg} \\lt r_{Na}$. Ne là khí hiếm chu kì 2, bán kính van der Waals lớn hơn. Thứ tự tăng dần: Mg, Na, Ne.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Trong bảng tuần hoàn, các nguyên tố được sắp xếp thành 18 cột dọc. Cột dọc được gọi là", "options": ["A. chu kì.", "B. nhóm.", "C. họ.", "D. phân lớp."], "answer": "B", "explain": "Cột dọc trong bảng tuần hoàn được gọi là nhóm (gồm 8 nhóm A và 8 nhóm B).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Số electron lớp ngoài cùng của nguyên tử các nguyên tố nhóm VIIIA (trừ He) là", "options": ["A. 6.", "B. 7.", "C. 8.", "D. 2."], "answer": "C", "explain": "Các khí hiếm (trừ He) có 8 electron lớp ngoài cùng bền vững.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố X thuộc chu kì 3, tạo oxide $X_2O$. X là nguyên tố nào và hydroxide tương ứng là gì?", "options": ["A. $Na$; $NaOH$ (base mạnh).", "B. $Mg$; $Mg(OH)_2$ (base yếu).", "C. $Al$; $Al(OH)_3$ (lưỡng tính).", "D. $K$; $KOH$ (base mạnh)."], "answer": "A", "explain": "Oxide $X_2O$ cho thấy X thuộc nhóm IA. Chu kì 3, nhóm IA là Na; hydroxide tương ứng là NaOH (base mạnh).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh tính acid của $HNO_3$ và $H_3PO_4$ (N và P cùng nhóm VA, N ở trên P). Kết luận đúng là", "options": ["A. $HNO_3$ có tính acid mạnh hơn $H_3PO_4$.", "B. $H_3PO_4$ có tính acid mạnh hơn $HNO_3$.", "C. Hai acid có tính acid như nhau.", "D. Không so sánh được."], "answer": "A", "explain": "Trong nhóm VA, từ trên xuống dưới tính phi kim giảm dần nên tính acid của hydroxide tương ứng cũng giảm dần: $HNO_3$ mạnh hơn $H_3PO_4$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho các nguyên tố X, Y, Z có số hiệu nguyên tử lần lượt là 9, 17, 35. Phát biểu nào sau đây đúng?", "options": ["A. X, Y, Z thuộc cùng một chu kì.", "B. X, Y, Z thuộc cùng một nhóm VIIA và tính phi kim giảm dần từ X đến Z.", "C. X, Y, Z đều là kim loại.", "D. Tính oxi hóa: $Z_2 \\gt Y_2 \\gt X_2$."], "answer": "B", "explain": "X là F, Y là Cl, Z là Br, cùng thuộc nhóm VIIA. Trong nhóm A, từ trên xuống dưới tính phi kim giảm dần nên thứ tự là F, Cl, Br.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hòa tan hoàn toàn 6,5 gam $Zn$ vào dung dịch $HCl$ dư. Khối lượng muối $ZnCl_2$ thu được là", "options": ["A. 13,6 gam.", "B. 6,8 gam.", "C. 27,2 gam.", "D. 10,2 gam."], "answer": "A", "explain": "Số mol Zn $= 6{,}5/65 = 0{,}1$ mol. $Zn + 2HCl \\rightarrow ZnCl_2 + H_2$. Số mol $ZnCl_2 = 0{,}1$ mol, khối lượng $= 0{,}1 \\times 136 = 13{,}6$ gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Zn$ là kim loại chuyển tiếp thuộc nhóm IIB.", "b) $ZnO$ là oxide lưỡng tính.", "c) $Zn(OH)_2$ là hydroxide lưỡng tính.", "d) $Zn$ không tác dụng với dung dịch $NaOH$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Zn (Z = 30) thuộc nhóm IIB. b) Đúng. c) Đúng. d) Sai: $Zn + 2NaOH + 2H_2O \\rightarrow Na_2[Zn(OH)_4] + H_2$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong một chu kì, nguyên tố đầu chu kì là kim loại điển hình.", "b) Trong một chu kì, nguyên tố cuối chu kì (trừ khí hiếm) là phi kim điển hình.", "c) Kim loại điển hình có tính khử mạnh.", "d) Phi kim điển hình có tính oxi hóa mạnh."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: nhóm IA. b) Đúng: nhóm VIIA. c) Đúng: kim loại dễ nhường electron. d) Đúng: phi kim dễ nhận electron.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hóa học của phèn chua thường dùng để làm trong nước (dạng text).", "answer": "K2SO4.Al2(SO4)3.24H2O", "explain": "Phèn chua có công thức $K_2SO_4.Al_2(SO_4)_3.24H_2O$ (kali aluminium sulfate ngậm 24 phân tử nước).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các nguyên tố $Fe, Co, Ni$ theo chiều tăng dần của số hiệu nguyên tử. (viết các kí hiệu cách nhau bởi dấu cách)", "answer": "$Fe$ $Co$ $Ni$", "explain": "Số hiệu nguyên tử: Fe (26), Co (27), Ni (28). Thứ tự tăng dần là Fe, Co, Ni (cùng thuộc nhóm VIIIB, chu kì 4).", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Ý nghĩa của bảng tuần hoàn là", "options": ["A. chỉ dùng để tra cứu nguyên tử khối.", "B. biết vị trí suy ra cấu tạo và tính chất; biết cấu tạo suy ra vị trí và tính chất.", "C. sắp xếp các nguyên tố một cách ngẫu nhiên.", "D. chỉ dùng cho kim loại."], "answer": "B", "explain": "Ý nghĩa của bảng tuần hoàn: từ vị trí suy ra cấu tạo nguyên tử và tính chất; từ cấu tạo suy ra vị trí và tính chất; so sánh và dự đoán nguyên tố.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên nhân của sự biến đổi tuần hoàn tính chất các nguyên tố là", "options": ["A. nguyên tử khối biến đổi tuần hoàn.", "B. cấu hình electron lớp ngoài cùng biến đổi tuần hoàn.", "C. số neutron biến đổi tuần hoàn.", "D. nhiệt độ nóng chảy biến đổi tuần hoàn."], "answer": "B", "explain": "Cấu hình electron lớp ngoài cùng lặp lại một cách tuần hoàn sau mỗi chu kì nên tính chất (do electron lớp ngoài cùng quyết định) cũng biến đổi tuần hoàn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biết nguyên tố X có Z = 19. Không cần tra bảng, hãy cho biết X là kim loại hay phi kim và thuộc nhóm nào?", "options": ["A. Kim loại, nhóm IA.", "B. Phi kim, nhóm VIIA.", "C. Kim loại, nhóm IIA.", "D. Khí hiếm, nhóm VIIIA."], "answer": "A", "explain": "Cấu hình X: $[Ar]4s^1$. Có 1 electron lớp ngoài cùng, khối s nên thuộc nhóm IA: kim loại kiềm (K).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dãy nào sau đây gồm các nguyên tố có tính kim loại tăng dần?", "options": ["A. $Na, K, Rb$.", "B. $Rb, K, Na$.", "C. $K, Na, Rb$.", "D. $Na, Rb, K$."], "answer": "A", "explain": "Na, K, Rb cùng thuộc nhóm IA. Trong nhóm A, từ trên xuống dưới tính kim loại tăng dần nên thứ tự tăng dần là Na, K, Rb.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho sơ đồ: $X$ (chu kì 3, nhóm IIA) tác dụng với nước tạo dung dịch làm quỳ tím hóa xanh và khí $H_2$. X là", "options": ["A. $Na$.", "B. $Mg$.", "C. $Al$.", "D. $Ca$."], "answer": "B", "explain": "Chu kì 3, nhóm IIA là Mg. $Mg + 2H_2O \\rightarrow Mg(OH)_2 + H_2$ (phản ứng chậm ở điều kiện thường, nhanh khi đun nóng); dung dịch $Mg(OH)_2$ làm quỳ tím hóa xanh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tố R thuộc nhóm VIIA. Hợp chất của R với hydrogen có khối lượng mol là 36,5. R là nguyên tố nào?", "options": ["A. $F$.", "B. $Cl$.", "C. $Br$.", "D. $I$."], "answer": "B", "explain": "Hợp chất HR có khối lượng mol 36,5 nên $M_R = 36{,}5 - 1 = 35{,}5$. R là chlorine (Cl).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Mg$ cháy trong không khí tạo $MgO$.", "b) $MgO$ là chất rắn màu trắng.", "c) $Mg(OH)_2$ dùng làm thuốc chống acid dạ dày.", "d) $Mg$ là kim loại nhẹ."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $2Mg + O_2 \\rightarrow 2MgO$ (cháy sáng chói). b) Đúng. c) Đúng: $Mg(OH)_2$ trung hòa acid HCl trong dạ dày. d) Đúng: khối lượng riêng nhỏ.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong chu kì 3, $Na$ là kim loại mạnh nhất.", "b) Trong chu kì 3, $Cl$ là phi kim mạnh nhất (không tính $Ar$).", "c) Trong nhóm IA, $Fr$ có tính kim loại mạnh nhất (về lí thuyết).", "d) Trong nhóm VIIA, $At$ có tính phi kim mạnh nhất."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: đầu chu kì. b) Đúng: gần cuối chu kì. c) Đúng: cuối nhóm IA (Fr phóng xạ, ít gặp). d) Sai: F (đầu nhóm) có tính phi kim mạnh nhất.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hóa học của đá vôi (dạng text).", "answer": "CaCO3", "explain": "Đá vôi có thành phần chính là calcium carbonate, công thức $CaCO_3$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nung 10 gam $CaCO_3$, thu được $CaO$ và $CO_2$. Khối lượng $CaO$ thu được là bao nhiêu gam?", "answer": "5,6", "explain": "Số mol $CaCO_3 = 10/100 = 0{,}1$ mol. $CaCO_3 \\rightarrow CaO + CO_2$. Số mol CaO $= 0{,}1$ mol, khối lượng $= 0{,}1 \\times 56 = 5{,}6$ gam.", "points": 0.5}]}]}</script>
