 lưỡng tính.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hòa tan hoàn toàn 10,2 gam $Al_2O_3$ vào dung dịch $NaOH$ dư. Khối lượng muối $NaAlO_2$ thu được là", "options": ["A. 8,2 gam.", "B. 12,3 gam.", "C. 16,4 gam.", "D. 6,15 gam."], "answer": "C", "explain": "Số mol $Al_2O_3 = 10{,}2/102 = 0{,}1$ mol. Phương trình: $Al_2O_3 + 2NaOH \\rightarrow 2NaAlO_2 + H_2O$. Số mol $NaAlO_2 = 0{,}2$ mol. Khối lượng $= 0{,}2 \\times 82 = 16{,}4$ gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Na_2O$ là oxide base.", "b) $P_2O_5$ là oxide acid.", "c) $ZnO$ là oxide lưỡng tính.", "d) $NO$ là oxide acid."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: oxide của kim loại kiềm. b) Đúng: oxide của phi kim P. c) Đúng: ZnO vừa tác dụng với acid vừa tác dụng với base. d) Sai: NO là oxide trung tính.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong chu kì 3, $Na_2O$ có tính base mạnh nhất.", "b) Trong chu kì 3, $Cl_2O_7$ có tính acid mạnh nhất.", "c) $Mg(OH)_2$ là base mạnh.", "d) $H_2SiO_3$ là acid yếu."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: Na đứng đầu chu kì 3 nên oxide có tính base mạnh nhất. b) Đúng: Cl đứng cuối chu kì 3 (trừ Ar) nên oxide có tính acid mạnh nhất. c) Sai: $Mg(OH)_2$ là base yếu (ít tan). d) Đúng: acid silicic là acid yếu.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức oxide cao nhất của nitrogen (N, nhóm VA).", "answer": "$N_2O_5$", "explain": "N thuộc nhóm VA nên hóa trị cao nhất với oxygen là V, oxide cao nhất là $N_2O_5$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho 6,2 gam $Na_2O$ tác dụng hết với nước. Khối lượng $NaOH$ thu được là bao nhiêu gam?", "answer": "8", "explain": "Số mol $Na_2O = 6{,}2/62 = 0{,}1$ mol. Phương trình: $Na_2O + H_2O \\rightarrow 2NaOH$. Số mol NaOH = 0,2 mol. Khối lượng $= 0{,}2 \\times 40 = 8$ gam.", "points": 0.5}]},
{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Oxide cao nhất của nguyên tố thuộc nhóm VA có công thức chung là", "options": ["A. $R_2O_3$.", "B. $RO_2$.", "C. $R_2O_5$.", "D. $RO_3$."], "answer": "C", "explain": "Nguyên tố nhóm VA có hóa trị cao nhất với oxygen là V nên oxide cao nhất có công thức $R_2O_5$ (ví dụ $P_2O_5, N_2O_5$).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hợp chất khí với hydrogen của nguyên tố thuộc nhóm IVA có công thức chung là", "options": ["A. $RH_4$.", "B. $RH_3$.", "C. $RH_2$.", "D. $RH$."], "answer": "A", "explain": "Nguyên tố nhóm IVA có hóa trị IV với hydrogen nên hợp chất khí có công thức $RH_4$ (ví dụ $CH_4, SiH_4$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các hydroxide: $NaOH, Mg(OH)_2, Al(OH)_3, H_2SiO_3$. Dãy sắp xếp theo chiều tăng dần của tính acid là", "options": ["A. $NaOH \\lt Mg(OH)_2 \\lt Al(OH)_3 \\lt H_2SiO_3$.", "B. $H_2SiO_3 \\lt Al(OH)_3 \\lt Mg(OH)_2 \\lt NaOH$.", "C. $NaOH \\lt H_2SiO_3 \\lt Al(OH)_3 \\lt Mg(OH)_2$.", "D. $Mg(OH)_2 \\lt NaOH \\lt Al(OH)_3 \\lt H_2SiO_3$."], "answer": "A", "explain": "Trong chu kì 3, từ trái sang phải tính base giảm dần, tính acid tăng dần theo thứ tự: NaOH (base mạnh), Mg(OH)2 (base yếu), Al(OH)3 (lưỡng tính), H2SiO3 (acid yếu).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Oxide nào sau đây tác dụng được với nước ở điều kiện thường?", "options": ["A. $Al_2O_3$.", "B. $SiO_2$.", "C. $Na_2O$.", "D. $CO$."], "answer": "C", "explain": "$Na_2O + H_2O \\rightarrow 2NaOH$. $Al_2O_3$ và $SiO_2$ không tan trong nước; CO là oxide trung tính không tác dụng với nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 4,6 gam $Na$ tác dụng hết với oxygen dư, sau đó hòa tan toàn bộ oxide thu được vào nước. Khối lượng $NaOH$ thu được là", "options": ["A. 4 gam.", "B. 8 gam.", "C. 6 gam.", "D. 12 gam."], "answer": "B", "explain": "Số mol Na $= 4{,}6/23 = 0{,}2$ mol. $4Na + O_2 \\rightarrow 2Na_2O$ nên số mol $Na_2O = 0{,}1$ mol. $Na_2O + H_2O \\rightarrow 2NaOH$ nên số mol NaOH $= 0{,}2$ mol, khối lượng $= 0{,}2 \\times 40 = 8$ gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hòa tan 6,72 lít khí $SO_2$ (đktc) vào nước dư. Khối lượng $H_2SO_3$ thu được là", "options": ["A. 24,6 gam.", "B. 12,3 gam.", "C. 32,8 gam.", "D. 16,4 gam."], "answer": "A", "explain": "Số mol $SO_2 = 6{,}72/22{,}4 = 0{,}3$ mol. $SO_2 + H_2O \\rightarrow H_2SO_3$ nên số mol $H_2SO_3 = 0{,}3$ mol. Khối lượng $= 0{,}3 \\times 82 = 24{,}6$ gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hóa trị cao nhất của Cl với oxygen là VII.", "b) Hóa trị của Cl với hydrogen là I.", "c) Tổng hai hóa trị trên của Cl bằng 8.", "d) Oxide cao nhất của Cl là $ClO_2$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Cl thuộc nhóm VIIA. b) Đúng: hợp chất HCl. c) Đúng: 7 + 1 = 8. d) Sai: oxide cao nhất của Cl là $Cl_2O_7$.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $SiO_2$ là oxide acid.", "b) $SiO_2$ tan nhiều trong nước ở điều kiện thường.", "c) $H_2SiO_3$ là acid yếu.", "d) Thủy tinh chứa $SiO_2$ nên bị dung dịch HF ăn mòn."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: oxide của phi kim Si. b) Sai: $SiO_2$ hầu như không tan trong nước. c) Đúng: acid silicic là acid rất yếu. d) Đúng: $SiO_2 + 4HF \\rightarrow SiF_4 + 2H_2O$, ứng dụng để khắc chữ lên thủy tinh.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hợp chất khí với hydrogen của silicon (Si, nhóm IVA).", "answer": "$SiH_4$", "explain": "Si thuộc nhóm IVA nên hóa trị với hydrogen là IV, hợp chất khí có công thức $SiH_4$ (silan).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguyên tố R có hóa trị cao nhất với oxygen là IV và thuộc chu kì 3. Kí hiệu hóa học của R là gì?", "answer": "Si", "explain": "Hóa trị cao nhất với O là IV nên R thuộc nhóm IVA. Chu kì 3, nhóm IVA là silicon (Si).", "points": 0.5}]},
{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Trong một chu kì, từ trái sang phải, tính acid của các oxide cao nhất và hydroxide tương ứng", "options": ["A. giảm dần.", "B. tăng dần.", "C. không đổi.", "D. tăng rồi giảm."], "answer": "B", "explain": "Trong một chu kì, từ trái sang phải tính base giảm dần và tính acid tăng dần (cả với oxide và hydroxide tương ứng).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Oxide nào sau đây là oxide trung tính?", "options": ["A. $CO_2$.", "B. $SO_2$.", "C. $CO$.", "D. $P_2O_5$."], "answer": "C", "explain": "CO là oxide trung tính (không tạo muối), không tác dụng với acid, base và nước ở điều kiện thường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dãy nào sau đây gồm các oxide đều tác dụng được với dung dịch $HCl$?", "options": ["A. $Na_2O, Al_2O_3, MgO$.", "B. $CO_2, SO_2, P_2O_5$.", "C. $Na_2O, CO_2, SO_2$.", "D. $Al_2O_3, SiO_2, CO_2$."], "answer": "A", "explain": "Oxide base ($Na_2O, MgO$) và oxide lưỡng tính ($Al_2O_3$) đều tác dụng được với dung dịch acid HCl. Oxide acid ($CO_2, SO_2, P_2O_5, SiO_2$) không tác dụng với acid.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hydroxide nào sau đây là lưỡng tính?", "options": ["A. $NaOH$.", "B. $Al(OH)_3$.", "C. $Mg(OH)_2$.", "D. $KOH$."], "answer": "B", "explain": "$Al(OH)_3$ vừa tác dụng được với dung dịch acid vừa tác dụng được với dung dịch base nên là hydroxide lưỡng tính.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho các chất: $Al, Al_2O_3, Al(OH)_3, NaAlO_2$. Số chất vừa tác dụng được với dung dịch $HCl$ vừa tác dụng được với dung dịch $NaOH$ là", "options": ["A. 1.", "B. 2.", "C. 3.", "D. 4."], "answer": "C", "explain": "Al (kim loại lưỡng tính về mặt tác dụng), $Al_2O_3$ và $Al(OH)_3$ (lưỡng tính) đều tác dụng được với cả HCl và NaOH. $NaAlO_2$ chỉ tác dụng với HCl (không tác dụng với NaOH). Vậy có 3 chất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 0,15 mol $Al_2O_3$ tác dụng vừa đủ với dung dịch $HCl$. Số mol $HCl$ đã phản ứng là", "options": ["A. 0,3 mol.", "B. 0,6 mol.", "C. 0,9 mol.", "D. 0,15 mol."], "answer": "C", "explain": "Phương trình: $Al_2O_3 + 6HCl \\rightarrow 2AlCl_3 + 3H_2O$. Số mol HCl $= 6 \\times 0{,}15 = 0{,}9$ mol.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Al(OH)_3$ tan được trong dung dịch $NaOH$ dư.", "b) $Al(OH)_3$ tan được trong dung dịch $HCl$ dư.", "c) $Mg(OH)_2$ tan được trong dung dịch $NaOH$ dư.", "d) $NaOH$ là base mạnh, tan nhiều trong nước."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $Al(OH)_3 + NaOH \\rightarrow NaAlO_2 + 2H_2O$. b) Đúng: $Al(OH)_3 + 3HCl \\rightarrow AlCl_3 + 3H_2O$. c) Sai: $Mg(OH)_2$ là base yếu, không tác dụng với $NaOH$. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong chu kì 3, $MgO$ có tính base yếu hơn $Na_2O$.", "b) Trong chu kì 3, $SO_3$ có tính acid mạnh hơn $P_2O_5$.", "c) $H_3PO_4$ là acid trung bình.", "d) $HClO_4$ là acid yếu."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: tính base giảm dần từ $Na_2O$ đến MgO. b) Đúng: tính acid tăng dần từ $P_2O_5$ đến $SO_3$. c) Đúng. d) Sai: $HClO_4$ là acid rất mạnh.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức oxide cao nhất của phosphorus (P, nhóm VA).", "answer": "$P_2O_5$", "explain": "P thuộc nhóm VA nên hóa trị cao nhất với oxygen là V, oxide cao nhất là $P_2O_5$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho 3,9 gam $K$ tác dụng hết với nước. Thể tích khí $H_2$ thu được ở đktc là bao nhiêu lít?", "answer": "1,12", "explain": "Số mol K $= 3{,}9/39 = 0{,}1$ mol. $2K + 2H_2O \\rightarrow 2KOH + H_2$. Số mol $H_2 = 0{,}05$ mol. Thể tích $= 0{,}05 \\times 22{,}4 = 1{,}12$ lít.", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Công thức oxide cao nhất của các nguyên tố chu kì 3 (từ Na đến Cl) lần lượt là", "options": ["A. $Na_2O, MgO, Al_2O_3, SiO_2, P_2O_5, SO_3, Cl_2O_7$.", "B. $NaO, MgO, AlO, SiO_2, PO_2, SO_3, ClO_3$.", "C. $Na_2O, MgO, Al_2O_3, SiO_3, P_2O_3, SO_2, Cl_2O$.", "D. $Na_2O_2, MgO_2, Al_2O_3, SiO_2, P_2O_5, SO_3, Cl_2O_7$."], "answer": "A", "explain": "Hóa trị cao nhất với O tăng dần từ I đến VII theo nhóm: Na (I) → $Na_2O$; Mg (II) → MgO; Al (III) → $Al_2O_3$; Si (IV) → $SiO_2$; P (V) → $P_2O_5$; S (VI) → $SO_3$; Cl (VII) → $Cl_2O_7$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hydroxide tương ứng với $N_2O_5$ là", "options": ["A. $HNO_3$.", "B. $HNO_2$.", "C. $N(OH)_5$.", "D. $H_3NO_4$."], "answer": "A", "explain": "$N_2O_5 + H_2O \\rightarrow 2HNO_3$ nên hydroxide (acid) tương ứng là $HNO_3$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các cặp chất sau, cặp nào gồm một oxide base và một oxide acid?", "options": ["A. $Na_2O$ và $CaO$.", "B. $CO_2$ và $SO_2$.", "C. $MgO$ và $P_2O_5$.", "D. $Al_2O_3$ và $ZnO$."], "answer": "C", "explain": "MgO là oxide của kim loại nên là oxide base; $P_2O_5$ là oxide của phi kim nên là oxide acid.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chất nào sau đây KHÔNG tác dụng được với dung dịch $NaOH$?", "options": ["A. $Al_2O_3$.", "B. $SO_2$.", "C. $Na_2O$.", "D. $CO_2$."], "answer": "C", "explain": "$Na_2O$ là oxide base nên không tác dụng với dung dịch base $NaOH$. $Al_2O_3$ (lưỡng tính), $SO_2$ và $CO_2$ (oxide acid) đều tác dụng được với $NaOH$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sục khí $CO_2$ dư vào dung dịch $Ca(OH)_2$. Hiện tượng quan sát được là", "options": ["A. xuất hiện kết tủa trắng rồi kết tủa tan dần.", "B. chỉ xuất hiện kết tủa trắng.", "C. không có hiện tượng gì.", "D. dung dịch chuyển sang màu xanh."], "answer": "A", "explain": "Ban đầu: $CO_2 + Ca(OH)_2 \\rightarrow CaCO_3$ (kết tủa trắng) $+ H_2O$. $CO_2$ dư: $CaCO_3 + CO_2 + H_2O \\rightarrow Ca(HCO_3)_2$ (tan), kết tủa tan dần.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hấp thụ hoàn toàn 4,48 lít $CO_2$ (đktc) vào 200 ml dung dịch $NaOH$ 1M. Khối lượng muối thu được là", "options": ["A. 21,2 gam $Na_2CO_3$.", "B. 16,8 gam $NaHCO_3$.", "C. 10,6 gam $Na_2CO_3$ và 8,4 gam $NaHCO_3$.", "D. 8,4 gam $NaHCO_3$ và 5,3 gam $Na_2CO_3$."], "answer": "B", "explain": "Số mol $CO_2 = 4{,}48/22{,}4 = 0{,}2$ mol; số mol NaOH $= 0{,}2 \\times 1 = 0{,}2$ mol. Tỉ lệ $n_{NaOH}/n_{CO_2} = 1$ nên chỉ tạo muối acid $NaHCO_3$: $CO_2 + NaOH \\rightarrow NaHCO_3$. Khối lượng $= 0{,}2 \\times 84 = 16{,}8$ gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $CO_2$ làm đục nước vôi trong.", "b) $SO_2$ có mùi hắc, là oxide acid.", "c) $CaO$ được gọi là vôi sống.", "d) $P_2O_5$ dùng để hút ẩm vì tác dụng mạnh với nước."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: $CO_2 + Ca(OH)_2 \\rightarrow CaCO_3$ (kết tủa trắng) $+ H_2O$. b) Đúng. c) Đúng: CaO là vôi sống, $CaO + H_2O \\rightarrow Ca(OH)_2$ (vôi tôi). d) Đúng: $P_2O_5$ háo nước mạnh nên dùng làm chất hút ẩm.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tính acid của $H_2SO_4$ mạnh hơn $H_2SO_3$.", "b) Tính acid của $HClO_4$ mạnh hơn $HClO$.", "c) Trong cùng một nguyên tố, hóa trị càng cao thì tính acid của oxide và hydroxide tương ứng càng mạnh.", "d) $H_2CO_3$ là acid mạnh."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: S có hóa trị VI trong $H_2SO_4$, hóa trị IV trong $H_2SO_3$. b) Đúng: Cl có hóa trị VII trong $HClO_4$, hóa trị I trong HClO. c) Đúng: quy luật chung. d) Sai: $H_2CO_3$ là acid yếu.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hợp chất khí với hydrogen của phosphorus (P, nhóm VA).", "answer": "$PH_3$", "explain": "P thuộc nhóm VA nên hóa trị với hydrogen là III, hợp chất khí có công thức $PH_3$ (phosphine).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Oxide cao nhất của R có công thức $RO_2$, hợp chất khí với hydrogen của R có công thức $RH_4$. R thuộc chu kì 2. Kí hiệu hóa học của R là gì?", "answer": "C", "explain": "Oxide $RO_2$ cho thấy R có hóa trị IV với O; hợp chất $RH_4$ cho thấy R có hóa trị IV với H. R thuộc nhóm IVA, chu kì 2 là carbon (C).", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Dãy nào sau đây gồm các chất đều là oxide base?", "options": ["A. $Na_2O, CaO, MgO$.", "B. $CO_2, SO_2, P_2O_5$.", "C. $Na_2O, CO_2, Al_2O_3$.", "D. $SO_3, CaO, ZnO$."], "answer": "A", "explain": "$Na_2O, CaO, MgO$ đều là oxide của kim loại nên là oxide base.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dãy nào sau đây gồm các chất đều là oxide acid?", "options": ["A. $Na_2O, CaO, MgO$.", "B. $CO_2, SO_3, P_2O_5$.", "C. $Al_2O_3, ZnO, Na_2O$.", "D. $CO, NO, CaO$."], "answer": "B", "explain": "$CO_2, SO_3, P_2O_5$ đều là oxide của phi kim nên là oxide acid.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các oxide: $K_2O, SO_3, Al_2O_3, CO$. Số oxide tác dụng được với dung dịch $KOH$ là", "options": ["A. 1.", "B. 2.", "C. 3.", "D. 4."], "answer": "B", "explain": "$SO_3$ (oxide acid) và $Al_2O_3$ (oxide lưỡng tính) tác dụng được với dung dịch KOH. $K_2O$ (oxide base) và CO (oxide trung tính) không tác dụng. Vậy có 2 oxide.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hydroxide tương ứng với oxide cao nhất của $SiO_2$ là", "options": ["A. $H_2SiO_3$.", "B. $H_4SiO_4$.", "C. $Si(OH)_4$.", "D. $H_2SiO_4$."], "answer": "A", "explain": "$SiO_2 + H_2O \\rightarrow H_2SiO_3$ (acid silicic). Trong chương trình phổ thông, hydroxide tương ứng với $SiO_2$ là $H_2SiO_3$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho dãy các oxide: $Na_2O, MgO, Al_2O_3, SiO_2, P_2O_5, SO_3, Cl_2O_7$. Số oxide tan được trong nước ở điều kiện thường là", "options": ["A. 2.", "B. 3.", "C. 4.", "D. 5."], "answer": "C", "explain": "Các oxide tan được trong nước: $Na_2O$ (tạo NaOH), $P_2O_5$ (tạo $H_3PO_4$), $SO_3$ (tạo $H_2SO_4$), $Cl_2O_7$ (tạo $HClO_4$). MgO, $Al_2O_3, SiO_2$ không tan trong nước. Vậy có 4 oxide.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đốt cháy hoàn toàn 2,4 gam $Mg$ trong oxygen dư, sau đó hòa tan toàn bộ oxide thu được vào nước dư. Khối lượng base thu được là", "options": ["A. 4,0 gam.", "B. 5,8 gam.", "C. 8,0 gam.", "D. 2,9 gam."], "answer": "B", "explain": "Số mol Mg $= 2{,}4/24 = 0{,}1$ mol. $2Mg + O_2 \\rightarrow 2MgO$ nên số mol MgO $= 0{,}1$ mol. $MgO + H_2O \\rightarrow Mg(OH)_2$ nên số mol $Mg(OH)_2 = 0{,}1$ mol, khối lượng $= 0{,}1 \\times 58 = 5{,}8$ gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $K_2O$ là oxide base.", "b) $N_2O_5$ là oxide acid.", "c) $Fe_2O_3$ là oxide lưỡng tính.", "d) $CO$ là oxide trung tính."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: oxide của kim loại kiềm. b) Đúng: oxide của phi kim N. c) Sai: $Fe_2O_3$ là oxide base (không lưỡng tính). d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $BaO$ tác dụng với nước tạo $Ba(OH)_2$.", "b) $Ba(OH)_2$ là base mạnh.", "c) $SO_2$ vừa có tính oxi hóa vừa có tính khử.", "d) $Al$ không tác dụng với dung dịch $NaOH$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: $BaO + H_2O \\rightarrow Ba(OH)_2$. b) Đúng: hydroxide của kim loại kiềm thổ nặng là base mạnh. c) Đúng: S có hóa trị IV trung gian nên $SO_2$ vừa oxi hóa vừa khử. d) Sai: $2Al + 2NaOH + 2H_2O \\rightarrow 2NaAlO_2 + 3H_2$.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hydroxide tương ứng với oxide cao nhất của magnesium.", "answer": "$Mg(OH)_2$", "explain": "Oxide cao nhất của Mg là MgO. $MgO + H_2O \\rightarrow Mg(OH)_2$ nên hydroxide tương ứng là $Mg(OH)_2$ (base yếu).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguyên tố R thuộc nhóm VIIA, hợp chất khí với hydrogen của R có công thức HR. Oxide cao nhất của R có công thức là gì?", "answer": "$R_2O_7$", "explain": "R thuộc nhóm VIIA nên hóa trị cao nhất với oxygen là VII, oxide cao nhất là $R_2O_7$ (ví dụ $Cl_2O_7$).", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Trong một chu kì, hóa trị cao nhất với oxygen của các nguyên tố biến đổi như thế nào (từ trái sang phải)?", "options": ["A. Tăng dần từ I đến VII.", "B. Giảm dần từ VII đến I.", "C. Không đổi.", "D. Tăng rồi giảm."], "answer": "A", "explain": "Hóa trị cao nhất với oxygen bằng số thứ tự nhóm A nên trong một chu kì, từ trái sang phải hóa trị tăng dần từ I đến VII.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hợp chất nào sau đây là hợp chất khí với hydrogen của phi kim?", "options": ["A. $NaH$.", "B. $H_2S$.", "C. $NaOH$.", "D. $H_2SO_4$."], "answer": "B", "explain": "$H_2S$ là hợp chất khí của S (nhóm VIA) với hydrogen, có công thức $RH_2$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố R thuộc chu kì 3, nhóm VA. Công thức oxide cao nhất và hợp chất khí với hydrogen của R lần lượt là", "options": ["A. $R_2O_5$ và $RH_3$.", "B. $RO_3$ và $RH_2$.", "C. $R_2O_3$ và $RH_3$.", "D. $RO_2$ và $RH_4$."], "answer": "A", "explain": "R thuộc nhóm VA nên hóa trị cao nhất với O là V (oxide $R_2O_5$) và hóa trị với H là III (hợp chất $RH_3$); 5 + 3 = 8.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây đúng về xu hướng trong chu kì 3?", "options": ["A. Tính base của các oxide tăng dần từ $Na_2O$ đến $Cl_2O_7$.", "B. Tính acid của các hydroxide tăng dần từ $NaOH$ đến $HClO_4$.", "C. $Mg(OH)_2$ là acid mạnh.", "D. $H_2SiO_3$ là base mạnh."], "answer": "B", "explain": "Trong chu kì 3, từ trái sang phải tính acid tăng dần: NaOH (base mạnh) → ... → $HClO_4$ (acid rất mạnh).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho các dung dịch: $NaOH, HCl, NaCl$. Dùng quỳ tím để phân biệt, hiện tượng lần lượt là", "options": ["A. xanh, đỏ, không đổi màu.", "B. đỏ, xanh, không đổi màu.", "C. xanh, không đổi màu, đỏ.", "D. không đổi màu, đỏ, xanh."], "answer": "A", "explain": "Dung dịch base (NaOH) làm quỳ tím hóa xanh; dung dịch acid (HCl) làm quỳ tím hóa đỏ; dung dịch muối trung tính (NaCl) không làm đổi màu quỳ tím.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sục 2,24 lít $SO_3$ (đktc, coi như khí) vào nước dư. Nồng độ mol của dung dịch $H_2SO_4$ thu được khi pha loãng thành 500 ml là", "options": ["A. 0,1M.", "B. 0,2M.", "C. 0,4M.", "D. 0,05M."], "answer": "B", "explain": "Số mol $SO_3 = 2{,}24/22{,}4 = 0{,}1$ mol. $SO_3 + H_2O \\rightarrow H_2SO_4$ nên số mol $H_2SO_4 = 0{,}1$ mol. Nồng độ $= 0{,}1/0{,}5 = 0{,}2M$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Oxide cao nhất của N là $N_2O_5$.", "b) Hợp chất khí của N với hydrogen là $NH_3$.", "c) $HNO_3$ là acid mạnh.", "d) $N_2O_3$ là oxide cao nhất của N."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: N nhóm VA, hóa trị cao nhất với O là V. b) Đúng: N có hóa trị III với H. c) Đúng. d) Sai: trong $N_2O_3$, N có hóa trị III, không phải cao nhất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $FeO$ là oxide base.", "b) $CrO_3$ là oxide acid.", "c) $CuO$ là oxide lưỡng tính.", "d) $PbO$ là oxide lưỡng tính."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: oxide của kim loại Fe. b) Đúng: Cr có hóa trị VI, $CrO_3$ là oxide acid. c) Sai: CuO là oxide base. d) Đúng: PbO là oxide lưỡng tính.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức oxide cao nhất của carbon (C, nhóm IVA).", "answer": "$CO_2$", "explain": "C thuộc nhóm IVA nên hóa trị cao nhất với oxygen là IV, oxide cao nhất là $CO_2$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hòa tan hoàn toàn 4,05 gam $Al$ vào dung dịch $NaOH$ dư. Thể tích khí $H_2$ thu được ở đktc là bao nhiêu lít?", "answer": "5,04", "explain": "Số mol Al $= 4{,}05/27 = 0{,}15$ mol. $2Al + 2NaOH + 2H_2O \\rightarrow 2NaAlO_2 + 3H_2$. Số mol $H_2 = 0{,}15 \\times 3/2 = 0{,}225$ mol. Thể tích $= 0{,}225 \\times 22{,}4 = 5{,}04$ lít.", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Oxide cao nhất của nguyên tố R thuộc nhóm IIIA có công thức là", "options": ["A. $RO$.", "B. $R_2O_3$.", "C. $RO_2$.", "D. $R_2O$."], "answer": "B", "explain": "Nguyên tố nhóm IIIA có hóa trị cao nhất với oxygen là III nên oxide cao nhất có công thức $R_2O_3$ (ví dụ $Al_2O_3$).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hợp chất khí với hydrogen của nguyên tố thuộc nhóm VA có công thức là", "options": ["A. $RH_4$.", "B. $RH_3$.", "C. $RH_2$.", "D. $RH$."], "answer": "B", "explain": "Nguyên tố nhóm VA có hóa trị III với hydrogen nên hợp chất khí có công thức $RH_3$ (ví dụ $NH_3, PH_3$).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các chất: $H_2SO_4, NaOH, Al(OH)_3, NaCl$. Chất tác dụng được với cả dung dịch $HCl$ và dung dịch $NaOH$ là", "options": ["A. $H_2SO_4$.", "B. $NaOH$.", "C. $Al(OH)_3$.", "D. $NaCl$."], "answer": "C", "explain": "$Al(OH)_3$ là hydroxide lưỡng tính nên vừa tác dụng với acid vừa tác dụng với base.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sắp xếp các acid sau theo chiều tăng dần của tính acid: $H_2SiO_3, H_3PO_4, H_2SO_4$", "options": ["A. $H_2SiO_3 \\lt H_3PO_4 \\lt H_2SO_4$.", "B. $H_2SO_4 \\lt H_3PO_4 \\lt H_2SiO_3$.", "C. $H_3PO_4 \\lt H_2SiO_3 \\lt H_2SO_4$.", "D. $H_2SiO_3 \\lt H_2SO_4 \\lt H_3PO_4$."], "answer": "A", "explain": "Trong chu kì 3, tính acid tăng dần từ trái sang phải theo thứ tự: $H_2SiO_3$ (acid yếu), $H_3PO_4$ (acid trung bình), $H_2SO_4$ (acid mạnh).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X có oxide cao nhất là $XO_3$ và thuộc chu kì 3. Nguyên tố X là", "options": ["A. $Al$.", "B. $Si$.", "C. $S$.", "D. $P$."], "answer": "C", "explain": "Oxide $XO_3$ cho thấy X có hóa trị VI với O nên thuộc nhóm VIA. Chu kì 3, nhóm VIA là sulfur (S).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 5,6 gam $CaO$ tác dụng hết với nước. Khối lượng $Ca(OH)_2$ thu được là", "options": ["A. 7,4 gam.", "B. 5,6 gam.", "C. 3,7 gam.", "D. 14,8 gam."], "answer": "A", "explain": "Số mol CaO $= 5{,}6/56 = 0{,}1$ mol. $CaO + H_2O \\rightarrow Ca(OH)_2$ nên số mol $Ca(OH)_2 = 0{,}1$ mol, khối lượng $= 0{,}1 \\times 74 = 7{,}4$ gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Na_2O$ tác dụng với $CO_2$ tạo $Na_2CO_3$.", "b) $CaO$ tác dụng với $SO_2$ tạo $CaSO_3$.", "c) $CO_2$ tác dụng với $Na_2O$ tạo $Na_2CO_3$.", "d) $SiO_2$ tác dụng với $NaOH$ đặc nóng tạo $Na_2SiO_3$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: oxide base + oxide acid tạo muối. b) Đúng: tương tự. c) Đúng: $Na_2O + CO_2 \\rightarrow Na_2CO_3$. d) Đúng: $SiO_2 + 2NaOH \\rightarrow Na_2SiO_3 + H_2O$ (đun nóng).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $K_2O$ là oxide base mạnh.", "b) $NO_2$ là oxide acid.", "c) $MgO$ được dùng làm vật liệu chịu lửa.", "d) $Al_2O_3$ là thành phần chính của đất sét."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: oxide của kim loại kiềm. b) Đúng: $2NO_2 + 2NaOH \\rightarrow NaNO_3 + NaNO_2 + H_2O$. c) Đúng: MgO có nhiệt độ nóng chảy rất cao. d) Sai: thành phần chính của đất sét là aluminosilicat (cao lanh $Al_2O_3.2SiO_2.2H_2O$), không phải $Al_2O_3$ tinh khiết.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hợp chất khí với hydrogen của sulfur (S, nhóm VIA).", "answer": "$H_2S$", "explain": "S thuộc nhóm VIA nên hóa trị với hydrogen là II, hợp chất khí có công thức $H_2S$ (viết dạng $RH_2$ là $H_2S$).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Oxide cao nhất của nguyên tố R chứa 60% oxygen về khối lượng, R thuộc chu kì 3. Kí hiệu hóa học của R là gì?", "answer": "S", "explain": "Oxide cao nhất của R chu kì 3: thử $SO_3$: khối lượng mol 80, oxygen chiếm $48/80 = 60$%. Vậy R là sulfur (S).", "points": 0.5}]},
{"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng về xu hướng biến đổi trong một chu kì?", "options": ["A. Tính base của oxide tăng dần, tính acid giảm dần.", "B. Tính base của oxide giảm dần, tính acid tăng dần.", "C. Tính base và tính acid đều tăng dần.", "D. Tính base và tính acid đều giảm dần."], "answer": "B", "explain": "Trong một chu kì, từ trái sang phải tính base của oxide và hydroxide giảm dần, tính acid tăng dần.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chất nào sau đây là lưỡng tính?", "options": ["A. $NaOH$.", "B. $HCl$.", "C. $Zn(OH)_2$.", "D. $KOH$."], "answer": "C", "explain": "$Zn(OH)_2$ vừa tác dụng được với dung dịch acid vừa tác dụng được với dung dịch base nên là hydroxide lưỡng tính.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các oxide: $BaO, ZnO, P_2O_5, NO$. Số oxide tác dụng được với dung dịch $HCl$ là", "options": ["A. 1.", "B. 2.", "C. 3.", "D. 4."], "answer": "B", "explain": "BaO (oxide base) và ZnO (oxide lưỡng tính) tác dụng được với dung dịch HCl. $P_2O_5$ (oxide acid) và NO (oxide trung tính) không tác dụng. Vậy có 2 oxide.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hydroxide nào sau đây có tính base mạnh nhất?", "options": ["A. $KOH$.", "B. $Ca(OH)_2$.", "C. $Al(OH)_3$.", "D. $Fe(OH)_3$."], "answer": "A", "explain": "KOH là hydroxide của kim loại kiềm nên là base mạnh. $Ca(OH)_2$ là base mạnh nhưng yếu hơn KOH; $Al(OH)_3$ lưỡng tính; $Fe(OH)_3$ là base yếu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 0,2 mol $Na_2O$ tác dụng hết với nước. Số mol $NaOH$ thu được là", "options": ["A. 0,2 mol.", "B. 0,4 mol.", "C. 0,1 mol.", "D. 0,8 mol."], "answer": "B", "explain": "$Na_2O + H_2O \\rightarrow 2NaOH$. Số mol NaOH $= 2 \\times 0{,}2 = 0{,}4$ mol.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hòa tan hoàn toàn 13,5 gam $Al$ vào dung dịch $H_2SO_4$ loãng dư. Thể tích khí $H_2$ thu được ở đktc là", "options": ["A. 11,2 lít.", "B. 16,8 lít.", "C. 22,4 lít.", "D. 5,6 lít."], "answer": "B", "explain": "Số mol Al $= 13{,}5/27 = 0{,}5$ mol. $2Al + 3H_2SO_4 \\rightarrow Al_2(SO_4)_3 + 3H_2$. Số mol $H_2 = 0{,}5 \\times 3/2 = 0{,}75$ mol. Thể tích $= 0{,}75 \\times 22{,}4 = 16{,}8$ lít.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong một chu kì, hóa trị cao nhất với oxygen tăng dần từ I đến VII.", "b) Trong một chu kì, hóa trị với hydrogen của phi kim giảm dần từ IV đến I.", "c) Tổng hai hóa trị trên của phi kim nhóm A bằng 8.", "d) Kim loại không tạo hợp chất khí với hydrogen."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: bằng số thứ tự nhóm A. b) Đúng: từ $RH_4$ đến RH. c) Đúng. d) Đúng: chỉ phi kim tạo hợp chất khí với hydrogen (hydride kim loại như NaH là chất rắn).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Na_2O_2$ là oxide cao nhất của Na.", "b) $H_2O_2$ là hydroxide tương ứng với oxide cao nhất của O.", "c) $Fe_3O_4$ là oxide hỗn tạp của FeO và $Fe_2O_3$.", "d) $Mn_2O_7$ là oxide acid tương ứng với acid $HMnO_4$."], "answer": ["F", "F", "T", "T"], "explain": "a) Sai: oxide cao nhất của Na là $Na_2O$; $Na_2O_2$ là peroxide. b) Sai: $H_2O_2$ là peroxide, không phải hydroxide tương ứng theo quy luật. c) Đúng: $Fe_3O_4 = FeO.Fe_2O_3$. d) Đúng: $Mn_2O_7 + H_2O \\rightarrow 2HMnO_4$.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức oxide cao nhất của magnesium (Mg, nhóm IIA).", "answer": "$MgO$", "explain": "Mg thuộc nhóm IIA nên hóa trị cao nhất với oxygen là II, oxide cao nhất là MgO.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguyên tố X thuộc chu kì 3, tạo được hợp chất khí với hydrogen có công thức $XH_4$. Oxide cao nhất của X tác dụng được với dung dịch $NaOH$. Kí hiệu hóa học của X là gì?", "answer": "Si", "explain": "Hợp chất $XH_4$ cho thấy X thuộc nhóm IVA, chu kì 3 là Si. Oxide cao nhất $SiO_2$ là oxide acid nên tác dụng được với dung dịch NaOH.", "points": 0.5}]}]}
