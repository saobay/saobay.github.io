{"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Tính kim loại của nguyên tử là", "options": ["A. khả năng nhường electron của nguyên tử khi tạo thành liên kết hóa học.", "B. khả năng nhận electron của nguyên tử khi tạo thành liên kết hóa học.", "C. khả năng hút electron của nguyên tử khi tạo thành liên kết hóa học.", "D. năng lượng ion hóa của nguyên tử."], "answer": "A", "explain": "Tính kim loại đặc trưng cho khả năng nhường electron (tạo cation) của nguyên tử khi tham gia phản ứng hóa học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tính phi kim của nguyên tử là", "options": ["A. khả năng nhường electron của nguyên tử.", "B. khả năng nhận electron của nguyên tử.", "C. bán kính của nguyên tử.", "D. độ âm điện của nguyên tử."], "answer": "B", "explain": "Tính phi kim đặc trưng cho khả năng nhận electron (tạo anion) của nguyên tử khi tham gia phản ứng hóa học.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các nguyên tố $Li, Na, K$, nguyên tố có tính kim loại mạnh nhất là", "options": ["A. $Li$.", "B. $Na$.", "C. $K$.", "D. cả ba như nhau."], "answer": "C", "explain": "Li, Na, K cùng thuộc nhóm IA. Trong nhóm A, đi từ trên xuống dưới tính kim loại tăng dần nên K có tính kim loại mạnh nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong các nguyên tố $F, Cl, Br$, nguyên tố có độ âm điện lớn nhất là", "options": ["A. $F$.", "B. $Cl$.", "C. $Br$.", "D. cả ba như nhau."], "answer": "A", "explain": "F, Cl, Br cùng thuộc nhóm VIIA. Trong nhóm A, đi từ trên xuống dưới độ âm điện giảm dần nên F có độ âm điện lớn nhất (3,98).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho các nguyên tố: X thuộc chu kì 2 nhóm VIIA, Y thuộc chu kì 3 nhóm VIIA. So sánh nào sau đây đúng?", "options": ["A. Bán kính: X lớn hơn Y; độ âm điện: X lớn hơn Y.", "B. Bán kính: X nhỏ hơn Y; độ âm điện: X lớn hơn Y.", "C. Bán kính: X nhỏ hơn Y; độ âm điện: X nhỏ hơn Y.", "D. Bán kính: X lớn hơn Y; độ âm điện: X nhỏ hơn Y."], "answer": "B", "explain": "X là F, Y là Cl, cùng nhóm VIIA. Trong nhóm A, đi từ trên xuống dưới bán kính tăng dần nên F có bán kính nhỏ hơn Cl; độ âm điện giảm dần nên F có độ âm điện lớn hơn Cl.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sắp xếp các nguyên tố $Al, Si, P, S$ theo chiều tăng dần của độ âm điện là", "options": ["A. $Al \\lt Si \\lt P \\lt S$.", "B. $S \\lt P \\lt Si \\lt Al$.", "C. $Al \\lt P \\lt Si \\lt S$.", "D. $Si \\lt Al \\lt P \\lt S$."], "answer": "A", "explain": "Al, Si, P, S cùng thuộc chu kì 3. Trong chu kì, đi từ trái sang phải độ âm điện tăng dần nên $\\chi_{Al} \\lt \\chi_{Si} \\lt \\chi_P \\lt \\chi_S$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nguyên tử có bán kính càng lớn thì càng dễ nhường electron (trong cùng một nhóm A).", "b) Độ âm điện càng lớn thì tính phi kim càng mạnh.", "c) Trong một chu kì, tính kim loại và tính phi kim biến đổi ngược chiều nhau.", "d) Kim loại kiềm có tính kim loại mạnh hơn kim loại kiềm thổ trong cùng một chu kì."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: bán kính lớn, electron lớp ngoài cùng xa hạt nhân nên dễ tách. b) Đúng: độ âm điện lớn nghĩa là hút electron mạnh, tính phi kim mạnh. c) Đúng: trong chu kì, tính kim loại giảm còn tính phi kim tăng. d) Đúng: trong chu kì, nhóm IA đứng trước nhóm IIA nên tính kim loại mạnh hơn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về các nguyên tố nhóm IIA (từ trên xuống dưới: Be, Mg, Ca, Sr, Ba):", "statements": ["a) Bán kính nguyên tử tăng dần.", "b) Tính kim loại tăng dần.", "c) Khả năng nhường 2 electron lớp ngoài cùng tăng dần.", "d) Độ âm điện tăng dần."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: số lớp electron tăng. b) Đúng: trong nhóm A, tính kim loại tăng dần xuống dưới. c) Đúng: electron lớp ngoài cùng càng xa hạt nhân càng dễ tách. d) Sai: độ âm điện giảm dần.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong các nguyên tố $N, P, As$, nguyên tố có tính phi kim mạnh nhất là nguyên tố nào? (viết kí hiệu)", "answer": "N", "explain": "N, P, As cùng thuộc nhóm VA. Trong nhóm A, đi từ trên xuống dưới tính phi kim giảm dần nên N có tính phi kim mạnh nhất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho biết độ âm điện của một số nguyên tố: O (3,44), S (2,58), Cl (3,16), Na (0,93). Trong các nguyên tố trên, nguyên tố có tính phi kim mạnh nhất là nguyên tố nào? (viết kí hiệu)", "answer": "O", "explain": "Tính phi kim cùng chiều với độ âm điện: độ âm điện càng lớn thì tính phi kim càng mạnh. O có độ âm điện lớn nhất (3,44) nên có tính phi kim mạnh nhất.", "points": 0.5}]},
{"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Bán kính nguyên tử được tính bằng đơn vị", "options": ["A. mét (m).", "B. picomet (pm).", "C. angstrom duy nhất.", "D. nanomet duy nhất."], "answer": "B", "explain": "Bán kính nguyên tử thường được tính bằng picomet (pm), với $1\\,pm = 10^{-12}\\,m$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên tố có độ âm điện lớn nhất là", "options": ["A. $Cl$.", "B. $O$.", "C. $F$.", "D. $N$."], "answer": "C", "explain": "Fluorine (F) có độ âm điện lớn nhất trong bảng tuần hoàn, bằng 3,98 theo thang Pauling.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dãy nào sau đây gồm các nguyên tố được sắp xếp theo chiều tăng dần của tính kim loại?", "options": ["A. $Na, Mg, Al$.", "B. $Al, Mg, Na$.", "C. $Mg, Na, Al$.", "D. $Mg, Al, Na$."], "answer": "B", "explain": "Na, Mg, Al cùng thuộc chu kì 3. Trong chu kì, đi từ trái sang phải tính kim loại giảm dần nên thứ tự tăng dần là Al, Mg, Na.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh bán kính nguyên tử của $O$ (Z = 8) và $S$ (Z = 16):", "options": ["A. $r_O$ lớn hơn $r_S$.", "B. $r_O$ nhỏ hơn $r_S$.", "C. $r_O$ bằng $r_S$.", "D. Không so sánh được."], "answer": "B", "explain": "O và S cùng thuộc nhóm VIA. Trong nhóm A, đi từ trên xuống dưới bán kính nguyên tử tăng dần nên $r_O$ nhỏ hơn $r_S$.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho các nguyên tố thuộc chu kì 2: $Li, Be, B, C, N, O, F$. Nguyên tố có bán kính nguyên tử nhỏ nhất là", "options": ["A. $Li$.", "B. $C$.", "C. $F$.", "D. $O$."], "answer": "C", "explain": "Trong chu kì 2, đi từ trái sang phải bán kính nguyên tử giảm dần nên F (đứng gần cuối chu kì, không tính Ne) có bán kính nhỏ nhất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "X là nguyên tố có độ âm điện lớn thứ hai trong chu kì 2 (sau F). Y là nguyên tố có tính kim loại mạnh nhất trong chu kì 3. X và Y lần lượt là", "options": ["A. $O$ và $Na$.", "B. $N$ và $Na$.", "C. $O$ và $Mg$.", "D. $Cl$ và $Na$."], "answer": "A", "explain": "Trong chu kì 2, độ âm điện tăng dần từ trái sang phải nên sau F (lớn nhất) là O. Trong chu kì 3, tính kim loại giảm dần từ trái sang phải nên Na (đầu chu kì) có tính kim loại mạnh nhất.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong một chu kì, nguyên tố đầu chu kì thường là kim loại, cuối chu kì thường là phi kim.", "b) Trong một chu kì, tính kim loại giảm dần, tính phi kim tăng dần.", "c) Các nguyên tố nhóm IA đều có tính kim loại mạnh.", "d) Fluorine là phi kim hoạt động mạnh nhất."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: đầu chu kì (nhóm IA, IIA) là kim loại, gần cuối chu kì (nhóm VIA, VIIA) là phi kim. b) Đúng. c) Đúng: kim loại kiềm có tính kim loại mạnh. d) Đúng: F có độ âm điện lớn nhất nên tính phi kim (tính oxi hóa) mạnh nhất.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bán kính nguyên tử của K lớn hơn bán kính nguyên tử của Na.", "b) Độ âm điện của Cl lớn hơn độ âm điện của S.", "c) Tính kim loại của Mg mạnh hơn tính kim loại của Al.", "d) Tính phi kim của P mạnh hơn tính phi kim của N."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: K và Na cùng nhóm IA, K ở dưới nên bán kính lớn hơn. b) Đúng: Cl và S cùng chu kì 3, Cl đứng sau nên độ âm điện lớn hơn. c) Đúng: Mg đứng trước Al trong chu kì 3 nên tính kim loại mạnh hơn. d) Sai: N và P cùng nhóm VA, N ở trên nên tính phi kim mạnh hơn P.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong các nguyên tố $Be, Mg, Ca$, nguyên tố khó nhường electron lớp ngoài cùng nhất là nguyên tố nào? (viết kí hiệu)", "answer": "Be", "explain": "Be, Mg, Ca cùng thuộc nhóm IIA. Trong nhóm A, đi từ trên xuống dưới tính kim loại (khả năng nhường electron) tăng dần nên Be ở trên cùng khó nhường electron nhất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguyên tố X thuộc chu kì 3, có độ âm điện là 3,16. Kí hiệu hóa học của X là gì?", "answer": "Cl", "explain": "Trong chu kì 3, độ âm điện tăng dần từ trái sang phải; nguyên tố có độ âm điện 3,16 là chlorine (Cl), thuộc nhóm VIIA.", "points": 0.5}]},
{"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Khi nguyên tử nhận thêm electron để tạo thành anion, bán kính ion so với bán kính nguyên tử sẽ", "options": ["A. lớn hơn.", "B. nhỏ hơn.", "C. bằng nhau.", "D. không xác định."], "answer": "A", "explain": "Khi nhận thêm electron, số electron tăng trong khi số proton không đổi nên lực hút trung bình trên mỗi electron giảm, lớp electron giãn ra: bán kính anion lớn hơn bán kính nguyên tử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi nguyên tử nhường electron để tạo thành cation, bán kính ion so với bán kính nguyên tử sẽ", "options": ["A. lớn hơn.", "B. nhỏ hơn.", "C. bằng nhau.", "D. không xác định."], "answer": "B", "explain": "Khi nhường electron, số electron giảm (thường mất cả lớp ngoài cùng) trong khi số proton không đổi nên lực hút tăng, bán kính cation nhỏ hơn bán kính nguyên tử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh bán kính của nguyên tử $Na$ và ion $Na^+$:", "options": ["A. $r_{Na} \\gt r_{Na^+}$.", "B. $r_{Na} \\lt r_{Na^+}$.", "C. $r_{Na} = r_{Na^+}$.", "D. Không so sánh được."], "answer": "A", "explain": "Ion $Na^+$ được tạo thành khi nguyên tử Na nhường 1 electron lớp ngoài cùng nên bán kính cation $Na^+$ nhỏ hơn bán kính nguyên tử Na.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh bán kính của nguyên tử $Cl$ và ion $Cl^-$:", "options": ["A. $r_{Cl} \\gt r_{Cl^-}$.", "B. $r_{Cl} \\lt r_{Cl^-}$.", "C. $r_{Cl} = r_{Cl^-}$.", "D. Không so sánh được."], "answer": "B", "explain": "Ion $Cl^-$ được tạo thành khi nguyên tử Cl nhận thêm 1 electron nên lực hút trên mỗi electron giảm, bán kính anion $Cl^-$ lớn hơn bán kính nguyên tử Cl.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Dãy nào sau đây được sắp xếp theo chiều tăng dần của bán kính?", "options": ["A. $Na^+, Na, K$.", "B. $Na, Na^+, K$.", "C. $K, Na, Na^+$.", "D. $Na^+, K, Na$."], "answer": "A", "explain": "Bán kính cation nhỏ hơn nguyên tử: $r_{Na^+} \\lt r_{Na}$. K cùng nhóm IA với Na nhưng ở chu kì dưới nên $r_{Na} \\lt r_K$. Vậy thứ tự tăng dần là $Na^+, Na, K$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho các hạt: $O^{2-}, F^-, Na^+, Mg^{2+}$ đều có 10 electron. Dãy sắp xếp theo chiều giảm dần của bán kính hạt là", "options": ["A. $O^{2-} \\gt F^- \\gt Na^+ \\gt Mg^{2+}$.", "B. $Mg^{2+} \\gt Na^+ \\gt F^- \\gt O^{2-}$.", "C. $F^- \\gt O^{2-} \\gt Na^+ \\gt Mg^{2+}$.", "D. $Na^+ \\gt Mg^{2+} \\gt O^{2-} \\gt F^-$."], "answer": "A", "explain": "Các hạt có cùng số electron (10) nhưng điện tích hạt nhân tăng dần: $Z_O = 8 \\lt Z_F = 9 \\lt Z_{Na} = 11 \\lt Z_{Mg} = 12$. Điện tích hạt nhân càng lớn thì lực hút electron càng mạnh, bán kính càng nhỏ nên $r_{O^{2-}} \\gt r_{F^-} \\gt r_{Na^+} \\gt r_{Mg^{2+}}$.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bán kính cation luôn nhỏ hơn bán kính nguyên tử tương ứng.", "b) Bán kính anion luôn lớn hơn bán kính nguyên tử tương ứng.", "c) $r_{Fe^{2+}}$ nhỏ hơn $r_{Fe^{3+}}$.", "d) Các ion có cùng số electron thì ion nào có điện tích hạt nhân lớn hơn sẽ có bán kính nhỏ hơn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: $Fe^{3+}$ nhường nhiều electron hơn nên bán kính nhỏ hơn $Fe^{2+}$. d) Đúng: điện tích hạt nhân lớn hơn hút electron mạnh hơn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong chu kì 3, Na có tính khử mạnh nhất.", "b) Trong chu kì 3, Cl có tính oxi hóa mạnh nhất.", "c) Trong nhóm IA, Cs có tính khử mạnh hơn Na.", "d) Trong nhóm VIIA, F2 có tính oxi hóa yếu hơn Cl2."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Na đầu chu kì 3 nên tính kim loại (tính khử) mạnh nhất. b) Đúng: Cl cuối chu kì 3 (trừ Ar) nên tính phi kim (tính oxi hóa) mạnh nhất. c) Đúng: trong nhóm IA, tính kim loại tăng dần xuống dưới. d) Sai: F2 có tính oxi hóa mạnh hơn Cl2.", "points": 1}, {"type": "short", "level": "VD", "q": "So sánh bán kính của $S^{2-}$ và $S$: hạt nào có bán kính lớn hơn? (viết $S^{2-}$ hoặc $S$)", "answer": "$S^{2-}$", "explain": "Ion $S^{2-}$ được tạo thành khi nguyên tử S nhận thêm 2 electron nên bán kính anion lớn hơn bán kính nguyên tử.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong các ion $K^+, Ca^{2+}, Cl^-, S^{2-}$, ion có bán kính lớn nhất là ion nào? (viết dạng $X^{n+}$ hoặc $X^{n-}$)", "answer": "$S^{2-}$", "explain": "$K^+$ và $Ca^{2+}$ có 18 electron, $Cl^-$ và $S^{2-}$ có 18 electron. Trong các anion, S (Z = 16) có điện tích hạt nhân nhỏ hơn Cl (Z = 17) nên $r_{S^{2-}} \\gt r_{Cl^-}$. Anion lớn hơn cation nên $S^{2-}$ có bán kính lớn nhất.", "points": 0.5}]},
{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trong bảng tuần hoàn, tính kim loại của các nguyên tố biến đổi như thế nào trong một chu kì (từ trái sang phải)?", "options": ["A. Tăng dần.", "B. Giảm dần.", "C. Không đổi.", "D. Tăng rồi giảm."], "answer": "B", "explain": "Trong một chu kì, đi từ trái sang phải khả năng nhường electron giảm dần nên tính kim loại giảm dần.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong bảng tuần hoàn, tính phi kim của các nguyên tố biến đổi như thế nào trong một nhóm A (từ trên xuống dưới)?", "options": ["A. Tăng dần.", "B. Giảm dần.", "C. Không đổi.", "D. Tăng rồi giảm."], "answer": "B", "explain": "Trong một nhóm A, đi từ trên xuống dưới khả năng nhận electron giảm dần nên tính phi kim giảm dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố nào sau đây có tính kim loại mạnh nhất?", "options": ["A. $Li$.", "B. $Na$.", "C. $K$.", "D. $Mg$."], "answer": "C", "explain": "K thuộc nhóm IA, chu kì 4. Trong nhóm IA, tính kim loại tăng dần xuống dưới nên K mạnh hơn Na, Li. Mg thuộc nhóm IIA nên tính kim loại yếu hơn các kim loại kiềm cùng chu kì.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố nào sau đây có tính phi kim mạnh nhất?", "options": ["A. $O$.", "B. $S$.", "C. $F$.", "D. $Cl$."], "answer": "C", "explain": "F có độ âm điện lớn nhất (3,98) nên có tính phi kim mạnh nhất trong các nguyên tố.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho các nguyên tố X (Z = 11), Y (Z = 12), Z (Z = 19). Sắp xếp theo chiều tăng dần của bán kính nguyên tử là", "options": ["A. $X \\lt Y \\lt Z$.", "B. $Y \\lt X \\lt Z$.", "C. $Z \\lt X \\lt Y$.", "D. $Z \\lt Y \\lt X$."], "answer": "B", "explain": "X là Na, Y là Mg cùng chu kì 3: $r_{Mg} \\lt r_{Na}$ (trong chu kì, bán kính giảm dần). Z là K thuộc chu kì 4 nên $r_K$ lớn nhất. Vậy $r_{Mg} \\lt r_{Na} \\lt r_K$, tức Y, X, Z.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hai nguyên tố X và Y thuộc cùng một nhóm A. Biết $r_X \\lt r_Y$ và độ âm điện của X lớn hơn độ âm điện của Y. Phát biểu nào sau đây đúng?", "options": ["A. X đứng dưới Y trong bảng tuần hoàn.", "B. X đứng trên Y trong bảng tuần hoàn.", "C. X và Y thuộc cùng một chu kì.", "D. Tính kim loại của X mạnh hơn của Y."], "answer": "B", "explain": "Trong cùng nhóm A, đi từ trên xuống dưới bán kính tăng dần và độ âm điện giảm dần. Vì $r_X \\lt r_Y$ và $\\chi_X \\gt \\chi_Y$ nên X đứng trên Y. Tính kim loại của Y (ở dưới) mạnh hơn của X.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tính kim loại biến đổi cùng chiều với bán kính nguyên tử.", "b) Tính phi kim biến đổi cùng chiều với độ âm điện.", "c) Trong một chu kì, độ âm điện và tính phi kim biến đổi cùng chiều.", "d) Trong một nhóm A, bán kính nguyên tử và độ âm điện biến đổi cùng chiều."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: bán kính lớn thì dễ nhường electron. b) Đúng: độ âm điện lớn thì hút electron mạnh. c) Đúng: trong chu kì, cả hai đều tăng dần. d) Sai: trong nhóm A, bán kính tăng còn độ âm điện giảm (ngược chiều).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nguyên tố Cs có tính khử mạnh hơn nguyên tố Na.", "b) Đơn chất $I_2$ có tính oxi hóa mạnh hơn đơn chất $F_2$.", "c) Trong chu kì 3, Al có tính kim loại yếu hơn Na.", "d) Trong nhóm VIA, O có tính oxi hóa mạnh hơn S."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: trong nhóm IA, tính kim loại tăng dần xuống dưới. b) Sai: $F_2$ có tính oxi hóa mạnh hơn $I_2$. c) Đúng: trong chu kì 3, tính kim loại giảm dần từ Na đến Al. d) Đúng: trong nhóm VIA, tính phi kim giảm dần xuống dưới.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong các nguyên tố $Si, P, S, Cl$, nguyên tố có độ âm điện nhỏ nhất là nguyên tố nào? (viết kí hiệu)", "answer": "Si", "explain": "Si, P, S, Cl cùng thuộc chu kì 3. Trong chu kì, đi từ trái sang phải độ âm điện tăng dần nên Si (đứng đầu trong bốn nguyên tố) có độ âm điện nhỏ nhất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho biết: $r_{Na} = 186\\,pm$, $r_{Mg} = 160\\,pm$, $r_K = 227\\,pm$. Trong ba nguyên tố trên, nguyên tố có tính kim loại mạnh nhất là nguyên tố nào? (viết kí hiệu)", "answer": "K", "explain": "Tính kim loại biến đổi cùng chiều với bán kính nguyên tử: bán kính càng lớn thì càng dễ nhường electron. K có bán kính lớn nhất (227 pm) nên có tính kim loại mạnh nhất.", "points": 0.5}]},
{"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Đại lượng nào sau đây đặc trưng cho khả năng hút electron của nguyên tử khi tạo thành liên kết hóa học?", "options": ["A. Bán kính nguyên tử.", "B. Độ âm điện.", "C. Năng lượng ion hóa.", "D. Ái lực electron."], "answer": "B", "explain": "Độ âm điện đặc trưng cho khả năng hút electron của nguyên tử khi tạo thành liên kết hóa học.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong một chu kì, nguyên tố nào sau đây thường có bán kính nguyên tử lớn nhất?", "options": ["A. Nguyên tố đầu chu kì.", "B. Nguyên tố giữa chu kì.", "C. Nguyên tố cuối chu kì.", "D. Khí hiếm."], "answer": "A", "explain": "Trong một chu kì, bán kính nguyên tử giảm dần từ trái sang phải nên nguyên tố đầu chu kì (nhóm IA) có bán kính lớn nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các nguyên tố thuộc nhóm IVA: $C, Si, Ge, Sn, Pb$. Sắp xếp theo chiều tăng dần của tính kim loại là", "options": ["A. $C \\lt Si \\lt Ge \\lt Sn \\lt Pb$.", "B. $Pb \\lt Sn \\lt Ge \\lt Si \\lt C$.", "C. $C \\lt Ge \\lt Si \\lt Sn \\lt Pb$.", "D. $Si \\lt C \\lt Ge \\lt Sn \\lt Pb$."], "answer": "A", "explain": "Trong nhóm A, đi từ trên xuống dưới tính kim loại tăng dần nên thứ tự tăng dần là C, Si, Ge, Sn, Pb (C là phi kim, Pb là kim loại).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây đúng về xu hướng biến đổi độ âm điện?", "options": ["A. Trong chu kì tăng dần, trong nhóm A giảm dần.", "B. Trong chu kì giảm dần, trong nhóm A tăng dần.", "C. Trong chu kì và trong nhóm A đều tăng dần.", "D. Trong chu kì và trong nhóm A đều giảm dần."], "answer": "A", "explain": "Độ âm điện tăng dần trong một chu kì (từ trái sang phải) và giảm dần trong một nhóm A (từ trên xuống dưới).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X có cấu hình electron lớp ngoài cùng là $3s^23p^1$, nguyên tố Y có cấu hình electron lớp ngoài cùng là $3s^23p^5$. So sánh bán kính và độ âm điện của X, Y:", "options": ["A. $r_X \\gt r_Y$ và $\\chi_X \\lt \\chi_Y$.", "B. $r_X \\lt r_Y$ và $\\chi_X \\gt \\chi_Y$.", "C. $r_X \\gt r_Y$ và $\\chi_X \\gt \\chi_Y$.", "D. $r_X \\lt r_Y$ và $\\chi_X \\lt \\chi_Y$."], "answer": "A", "explain": "X là Al, Y là Cl, cùng thuộc chu kì 3, X đứng trước Y. Trong chu kì, đi từ trái sang phải bán kính giảm dần ($r_{Al} \\gt r_{Cl}$) và độ âm điện tăng dần ($\\chi_{Al} \\lt \\chi_{Cl}$).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho các nguyên tố: X (chu kì 3, nhóm IA), Y (chu kì 3, nhóm IIIA), Z (chu kì 4, nhóm IA). Sắp xếp theo chiều tăng dần của độ âm điện là", "options": ["A. $Z \\lt X \\lt Y$.", "B. $X \\lt Z \\lt Y$.", "C. $Y \\lt X \\lt Z$.", "D. $X \\lt Y \\lt Z$."], "answer": "A", "explain": "X là Na, Y là Al, Z là K. Trong chu kì 3: $\\chi_{Na} \\lt \\chi_{Al}$. Trong nhóm IA: $\\chi_K \\lt \\chi_{Na}$ (đi xuống dưới giảm). Vậy thứ tự tăng dần là K, Na, Al.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Fluorine là nguyên tố có độ âm điện lớn nhất.", "b) Caesium là kim loại kiềm có tính kim loại rất mạnh.", "c) Trong một chu kì, khí hiếm có bán kính nguyên tử nhỏ nhất.", "d) Trong một nhóm A, nguyên tố trên cùng có độ âm điện lớn nhất."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $\\chi_F = 3{,}98$. b) Đúng: Cs ở cuối nhóm IA nên tính kim loại rất mạnh. c) Sai: khí hiếm có bán kính được đo theo cách khác (bán kính van der Waals) nên thường lớn hơn halogen đứng trước; không so sánh trực tiếp theo xu hướng chung. d) Đúng: trong nhóm A, độ âm điện giảm dần xuống dưới.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $r_{Li} \\lt r_{Na} \\lt r_K$.", "b) $\\chi_F \\gt \\chi_{Cl} \\gt \\chi_{Br}$.", "c) Tính kim loại: $Al \\lt Mg \\lt Na$.", "d) Tính phi kim: $S \\lt P \\lt Si$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: cùng nhóm IA, bán kính tăng dần xuống dưới. b) Đúng: cùng nhóm VIIA, độ âm điện giảm dần xuống dưới. c) Đúng: cùng chu kì 3, tính kim loại giảm dần từ Na đến Al. d) Sai: cùng chu kì 3, tính phi kim tăng dần nên $Si \\lt P \\lt S$.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong các nguyên tố $B, C, N, O$, nguyên tố có bán kính nguyên tử lớn nhất là nguyên tố nào? (viết kí hiệu)", "answer": "B", "explain": "B, C, N, O cùng thuộc chu kì 2. Trong chu kì, đi từ trái sang phải bán kính giảm dần nên B (đứng đầu) có bán kính lớn nhất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguyên tố X thuộc chu kì 4, nhóm VIIA. So với Cl (chu kì 3, nhóm VIIA), X có bán kính lớn hơn hay nhỏ hơn? (trả lời: lớn hơn hoặc nhỏ hơn)", "answer": "lớn hơn", "explain": "X là Br, cùng nhóm VIIA với Cl. Trong nhóm A, đi từ trên xuống dưới bán kính nguyên tử tăng dần nên Br có bán kính lớn hơn Cl.", "points": 0.5}]},
{"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Trong một nhóm A, nguyên tố nào sau đây thường có tính kim loại mạnh nhất?", "options": ["A. Nguyên tố đầu nhóm (trên cùng).", "B. Nguyên tố cuối nhóm (dưới cùng).", "C. Nguyên tố giữa nhóm.", "D. Tất cả như nhau."], "answer": "B", "explain": "Trong một nhóm A, đi từ trên xuống dưới tính kim loại tăng dần nên nguyên tố cuối nhóm (dưới cùng) có tính kim loại mạnh nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong một chu kì, nguyên tố nào sau đây thường có tính phi kim mạnh nhất (không tính khí hiếm)?", "options": ["A. Nguyên tố đầu chu kì.", "B. Nguyên tố halogen (nhóm VIIA).", "C. Nguyên tố giữa chu kì.", "D. Nguyên tố nhóm IIA."], "answer": "B", "explain": "Trong một chu kì, tính phi kim tăng dần từ trái sang phải nên halogen (nhóm VIIA, gần cuối chu kì) có tính phi kim mạnh nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các nguyên tố: $N$ (Z = 7), $P$ (Z = 15), $As$ (Z = 33). Sắp xếp theo chiều giảm dần của độ âm điện là", "options": ["A. $N \\gt P \\gt As$.", "B. $As \\gt P \\gt N$.", "C. $P \\gt N \\gt As$.", "D. $N \\gt As \\gt P$."], "answer": "A", "explain": "N, P, As cùng thuộc nhóm VA. Trong nhóm A, đi từ trên xuống dưới độ âm điện giảm dần nên $\\chi_N \\gt \\chi_P \\gt \\chi_{As}$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây sai?", "options": ["A. Trong một chu kì, bán kính nguyên tử giảm dần từ trái sang phải.", "B. Trong một nhóm A, độ âm điện tăng dần từ trên xuống dưới.", "C. Tính kim loại tăng dần trong một nhóm A từ trên xuống dưới.", "D. Tính phi kim giảm dần trong một nhóm A từ trên xuống dưới."], "answer": "B", "explain": "Trong một nhóm A, đi từ trên xuống dưới độ âm điện giảm dần (do bán kính tăng, khả năng hút electron giảm). Phát biểu B sai.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "X, Y là hai nguyên tố thuộc cùng chu kì 3. Biết X có tính kim loại mạnh hơn Y. Phát biểu nào sau đây đúng?", "options": ["A. Bán kính của X nhỏ hơn bán kính của Y.", "B. Độ âm điện của X lớn hơn độ âm điện của Y.", "C. X đứng trước Y trong chu kì 3.", "D. Y dễ nhường electron hơn X."], "answer": "C", "explain": "Trong một chu kì, tính kim loại giảm dần từ trái sang phải nên X có tính kim loại mạnh hơn Y thì X đứng trước Y. Khi đó: $r_X \\gt r_Y$, $\\chi_X \\lt \\chi_Y$, X dễ nhường electron hơn Y.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 4 nguyên tố A, B, C, D thuộc cùng một chu kì, có số hiệu nguyên tử tăng dần từ A đến D. Biết độ âm điện của C lớn hơn của B nhưng nhỏ hơn của D. Sắp xếp đúng theo chiều tăng dần của bán kính nguyên tử là", "options": ["A. $A \\lt B \\lt C \\lt D$.", "B. $D \\lt C \\lt B \\lt A$.", "C. $B \\lt C \\lt D \\lt A$.", "D. $C \\lt B \\lt A \\lt D$."], "answer": "B", "explain": "Số hiệu nguyên tử tăng dần từ A đến D trong cùng chu kì nên thứ tự từ trái sang phải là A, B, C, D. Bán kính giảm dần từ trái sang phải nên thứ tự tăng dần của bán kính là D, C, B, A.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nguyên nhân chính của sự biến đổi tuần hoàn tính chất là sự biến đổi tuần hoàn của cấu hình electron lớp ngoài cùng.", "b) Điện tích hạt nhân tăng làm tăng lực hút electron.", "c) Số lớp electron tăng làm bán kính nguyên tử tăng.", "d) Độ âm điện không liên quan đến bán kính nguyên tử."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: cấu hình electron lớp ngoài cùng biến đổi tuần hoàn. b) Đúng. c) Đúng: lớp electron càng nhiều thì nguyên tử càng lớn. d) Sai: độ âm điện phụ thuộc vào điện tích hạt nhân và bán kính nguyên tử.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $Na$ dễ nhường electron hơn $Mg$.", "b) $Cl$ dễ nhận electron hơn $S$.", "c) $K$ dễ nhường electron hơn $Na$.", "d) $Br$ dễ nhận electron hơn $Cl$."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Na đứng trước Mg trong chu kì 3 nên tính kim loại mạnh hơn. b) Đúng: Cl đứng sau S trong chu kì 3 nên tính phi kim mạnh hơn. c) Đúng: trong nhóm IA, K ở dưới Na nên tính kim loại mạnh hơn. d) Sai: trong nhóm VIIA, Cl ở trên Br nên tính phi kim mạnh hơn.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong các nguyên tố $Li, Be, B$, nguyên tố có độ âm điện lớn nhất là nguyên tố nào? (viết kí hiệu)", "answer": "B", "explain": "Li, Be, B cùng thuộc chu kì 2. Trong chu kì, đi từ trái sang phải độ âm điện tăng dần nên B có độ âm điện lớn nhất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguyên tố R thuộc nhóm IIA, chu kì 4. So với Mg (nhóm IIA, chu kì 3), R dễ nhường electron hơn hay khó hơn? (trả lời: dễ hơn hoặc khó hơn)", "answer": "dễ hơn", "explain": "R là Ca, cùng nhóm IIA với Mg. Trong nhóm A, đi từ trên xuống dưới tính kim loại tăng dần nên Ca dễ nhường electron hơn Mg.", "points": 0.5}]},
{"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Xu hướng biến đổi bán kính nguyên tử trong một chu kì (từ trái sang phải) là do", "options": ["A. số lớp electron tăng dần.", "B. điện tích hạt nhân tăng dần.", "C. số neutron tăng dần.", "D. nguyên tử khối tăng dần."], "answer": "B", "explain": "Trong một chu kì, số lớp electron không đổi nhưng điện tích hạt nhân tăng dần làm lực hút electron tăng nên bán kính giảm dần.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xu hướng biến đổi bán kính nguyên tử trong một nhóm A (từ trên xuống dưới) là do", "options": ["A. điện tích hạt nhân giảm dần.", "B. số lớp electron tăng dần.", "C. số electron lớp ngoài cùng tăng dần.", "D. nguyên tử khối giảm dần."], "answer": "B", "explain": "Trong một nhóm A, đi từ trên xuống dưới số lớp electron tăng dần nên khoảng cách từ hạt nhân đến lớp ngoài cùng tăng, bán kính tăng dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các nguyên tố thuộc chu kì 3: $Na, Al, S, Cl$. Sắp xếp theo chiều tăng dần của tính phi kim là", "options": ["A. $Na \\lt Al \\lt S \\lt Cl$.", "B. $Cl \\lt S \\lt Al \\lt Na$.", "C. $Na \\lt S \\lt Al \\lt Cl$.", "D. $Al \\lt Na \\lt S \\lt Cl$."], "answer": "A", "explain": "Trong chu kì 3, đi từ trái sang phải tính phi kim tăng dần. Thứ tự các nguyên tố từ trái sang phải là Na, Al, S, Cl nên tính phi kim tăng dần theo thứ tự này.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên tố nào sau đây vừa có bán kính nguyên tử lớn hơn $Na$ vừa có độ âm điện nhỏ hơn $Na$?", "options": ["A. $Mg$.", "B. $K$.", "C. $Al$.", "D. $Li$."], "answer": "B", "explain": "K cùng nhóm IA với Na và ở chu kì dưới nên $r_K \\gt r_{Na}$ (bán kính tăng xuống dưới) và $\\chi_K \\lt \\chi_{Na}$ (độ âm điện giảm xuống dưới).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Biết độ âm điện của $H$ là 2,20 và của $Cl$ là 3,16. Hiệu độ âm điện của liên kết $H-Cl$ là 0,96. Liên kết $H-Cl$ là liên kết", "options": ["A. cộng hóa trị không cực.", "B. cộng hóa trị có cực.", "C. ion.", "D. hydrogen."], "answer": "B", "explain": "Hiệu độ âm điện $\\Delta\\chi = 3{,}16 - 2{,}20 = 0{,}96$. Với $0{,}4 \\le \\Delta\\chi \\lt 1{,}7$, liên kết là cộng hóa trị có cực.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho biết giá trị độ âm điện: $Na$ (0,93), $Mg$ (1,31), $Al$ (1,61), $Si$ (1,90). Liên kết trong phân tử nào sau đây có độ phân cực lớn nhất khi kết hợp với $Cl$ (3,16)?", "options": ["A. $Na-Cl$.", "B. $Mg-Cl$.", "C. $Al-Cl$.", "D. $Si-Cl$."], "answer": "A", "explain": "Độ phân cực của liên kết tỉ lệ với hiệu độ âm điện. $\\Delta\\chi_{Na-Cl} = 3{,}16 - 0{,}93 = 2{,}23$ là lớn nhất trong bốn liên kết nên liên kết Na-Cl phân cực mạnh nhất.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hiệu độ âm điện càng lớn thì liên kết càng phân cực.", "b) Hiệu độ âm điện bằng 0 thì liên kết là cộng hóa trị không cực.", "c) Hiệu độ âm điện lớn hơn hoặc bằng 1,7 thì liên kết là liên kết ion.", "d) Liên kết $Na-Cl$ là liên kết cộng hóa trị không cực."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: hai nguyên tử giống nhau hút electron như nhau. c) Đúng: quy ước $\\Delta\\chi \\ge 1{,}7$ là liên kết ion. d) Sai: $\\Delta\\chi = 2{,}23 \\ge 1{,}7$ nên Na-Cl là liên kết ion.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về so sánh các nguyên tố:", "statements": ["a) $r_{F} \\lt r_{Cl}$ và $\\chi_F \\gt \\chi_{Cl}$.", "b) $r_{Na} \\gt r_{Mg}$ và $\\chi_{Na} \\lt \\chi_{Mg}$.", "c) Tính kim loại: $K \\gt Ca$ và tính phi kim: $Br \\lt Cl$.", "d) $r_{O^{2-}} \\gt r_O$ và $r_{Na^+} \\lt r_{Na}$."], "answer": ["T", "T", "T", "T"], "explain": "a) Đúng: cùng nhóm VIIA, F ở trên nên bán kính nhỏ hơn và độ âm điện lớn hơn. b) Đúng: cùng chu kì 3, Na đứng trước Mg. c) Đúng: K (nhóm IA) có tính kim loại mạnh hơn Ca (nhóm IIA) cùng chu kì 4; Br dưới Cl nên tính phi kim yếu hơn. d) Đúng: anion lớn hơn nguyên tử, cation nhỏ hơn nguyên tử.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong các nguyên tố $Ca, K, Sc$, nguyên tố có bán kính nguyên tử lớn nhất là nguyên tố nào? (viết kí hiệu)", "answer": "K", "explain": "Ca, K, Sc cùng thuộc chu kì 4. Trong chu kì, đi từ trái sang phải bán kính giảm dần; K đứng đầu chu kì (nhóm IA) nên có bán kính lớn nhất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Sắp xếp các ion $N^{3-}, O^{2-}, F^-, Na^+$ theo chiều tăng dần của bán kính (viết các ion cách nhau bởi dấu cách).", "answer": "$Na^+$ $F^-$ $O^{2-}$ $N^{3-}$", "points": 0.5, "explain": "Các ion đều có 10 electron. Điện tích hạt nhân tăng dần: N (7), O (8), F (9), Na (11) nên bán kính giảm dần: $N^{3-} \\gt O^{2-} \\gt F^- \\gt Na^+$. Thứ tự tăng dần là $Na^+, F^-, O^{2-}, N^{3-}$."}]},
{"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Trong bảng tuần hoàn, các nguyên tố có tính chất biến đổi tuần hoàn là do", "options": ["A. nguyên tử khối biến đổi tuần hoàn.", "B. cấu hình electron lớp ngoài cùng biến đổi tuần hoàn.", "C. số neutron biến đổi tuần hoàn.", "D. số khối biến đổi tuần hoàn."], "answer": "B", "explain": "Tính chất của các nguyên tố phụ thuộc vào cấu hình electron, đặc biệt là lớp ngoài cùng. Cấu hình electron lớp ngoài cùng lặp lại một cách tuần hoàn nên tính chất cũng biến đổi tuần hoàn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng?", "options": ["A. Bán kính nguyên tử và độ âm điện biến đổi cùng chiều trong một chu kì.", "B. Bán kính nguyên tử và độ âm điện biến đổi ngược chiều trong một chu kì.", "C. Bán kính nguyên tử và tính kim loại biến đổi ngược chiều trong một nhóm A.", "D. Độ âm điện và tính phi kim biến đổi ngược chiều trong một chu kì."], "answer": "B", "explain": "Trong một chu kì, bán kính nguyên tử giảm dần còn độ âm điện tăng dần nên hai đại lượng biến đổi ngược chiều nhau.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các nguyên tố X, Y thuộc cùng nhóm IIA, X ở chu kì 3 và Y ở chu kì 5. Phát biểu nào sau đây sai?", "options": ["A. Bán kính của Y lớn hơn của X.", "B. Tính kim loại của Y mạnh hơn của X.", "C. Độ âm điện của Y lớn hơn của X.", "D. Y dễ nhường electron hơn X."], "answer": "C", "explain": "X là Mg, Y là Sr, cùng nhóm IIA. Trong nhóm A, đi từ trên xuống dưới: bán kính tăng, tính kim loại tăng, độ âm điện giảm. Vậy độ âm điện của Y nhỏ hơn của X — phát biểu C sai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dãy các nguyên tố nào sau đây được sắp xếp theo chiều tăng dần của độ âm điện?", "options": ["A. $Na, Mg, Al, Si$.", "B. $Si, Al, Mg, Na$.", "C. $Mg, Na, Si, Al$.", "D. $Na, Si, Mg, Al$."], "answer": "A", "explain": "Na, Mg, Al, Si cùng thuộc chu kì 3. Trong chu kì, đi từ trái sang phải độ âm điện tăng dần nên thứ tự tăng dần là Na, Mg, Al, Si.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nguyên tố X thuộc chu kì 2, nguyên tố Y thuộc chu kì 3, cả hai cùng thuộc nhóm VA. So sánh tính phi kim của X và Y:", "options": ["A. Tính phi kim của X mạnh hơn của Y.", "B. Tính phi kim của Y mạnh hơn của X.", "C. Tính phi kim của X bằng của Y.", "D. Không so sánh được."], "answer": "A", "explain": "X là N, Y là P, cùng nhóm VA. Trong nhóm A, đi từ trên xuống dưới tính phi kim giảm dần nên N có tính phi kim mạnh hơn P.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho các nguyên tố có số hiệu nguyên tử: X (12), Y (13), Z (19), T (20). Sắp xếp theo chiều tăng dần của bán kính nguyên tử là", "options": ["A. $Y \\lt X \\lt T \\lt Z$.", "B. $X \\lt Y \\lt Z \\lt T$.", "C. $Y \\lt X \\lt Z \\lt T$.", "D. $T \\lt Z \\lt X \\lt Y$."], "answer": "A", "explain": "X là Mg, Y là Al cùng chu kì 3: $r_{Al} \\lt r_{Mg}$. Z là K, T là Ca cùng chu kì 4: $r_{Ca} \\lt r_K$, và cả hai đều lớn hơn Mg, Al (nhiều lớp electron hơn). Vậy thứ tự tăng dần là Al, Mg, Ca, K.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trong một chu kì, từ trái sang phải: bán kính giảm, độ âm điện tăng.", "b) Trong một nhóm A, từ trên xuống dưới: bán kính tăng, độ âm điện giảm.", "c) Trong một chu kì, từ trái sang phải: tính kim loại tăng, tính phi kim giảm.", "d) Trong một nhóm A, từ trên xuống dưới: tính kim loại tăng, tính phi kim giảm."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: trong chu kì, tính kim loại giảm còn tính phi kim tăng. d) Đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $F$ là phi kim mạnh nhất vì có độ âm điện lớn nhất.", "b) $Cs$ là kim loại kiềm có tính kim loại mạnh nhất trong nhóm IA (thường gặp).", "c) $He$ có bán kính nguyên tử lớn nhất trong chu kì 1.", "d) Trong chu kì 3, $Ar$ có độ âm điện lớn nhất."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng. b) Đúng: trong nhóm IA, tính kim loại tăng dần xuống dưới. c) Sai: chu kì 1 chỉ có H và He, H có bán kính lớn hơn He. d) Sai: trong chu kì 3, Cl (không tính Ar) có độ âm điện lớn nhất; khí hiếm không xét độ âm điện theo xu hướng chung.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong các nguyên tố $P, S, Cl, Ar$, nguyên tố có bán kính nguyên tử nhỏ nhất là nguyên tố nào? (viết kí hiệu)", "answer": "Cl", "explain": "P, S, Cl, Ar cùng thuộc chu kì 3. Trong chu kì, bán kính giảm dần từ trái sang phải; không tính khí hiếm Ar (đo theo cách khác) thì Cl có bán kính nhỏ nhất.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nguyên tố X ở chu kì 3, nhóm VIIA; nguyên tố Y ở chu kì 4, nhóm VIIA. Nguyên tố nào có tính oxi hóa mạnh hơn? (viết kí hiệu)", "answer": "Cl", "explain": "X là Cl, Y là Br, cùng nhóm VIIA. Trong nhóm A, đi từ trên xuống dưới tính phi kim (tính oxi hóa của đơn chất) giảm dần nên Cl có tính oxi hóa mạnh hơn Br.", "points": 0.5}]}]}
