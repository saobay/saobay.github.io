"d) Không tác dụng với $NaOH$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"answer": "+1", "explain": "Gọi số oxi hóa của Cl là x. Ta có: $(+1) + x + (-2) = 0$, suy ra $x = +1$.", "level": "VD", "points": 0.5, "q": "Xác định số oxi hóa của clo trong $HClO$.", "type": "short"}, {"type": "short", "level": "VDC", "q": "Cho phản ứng: $Br_2 + 2NaI \\to 2NaBr + I_2$. Cho 0,3 mol $Br_2$ phản ứng hết. Tính số mol $NaI$ đã phản ứng (làm tròn đến 1 chữ số thập phân).", "answer": "0,6", "explain": "$n_{NaI} = 2 \\times 0{,}3 = 0{,}6$ mol.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Phản ứng đặc trưng của halogen là", "options": ["A. phản ứng oxi hóa khử, thể hiện tính oxi hóa.", "B. phản ứng trao đổi ion.", "C. phản ứng trung hòa.", "D. phản ứng phân hủy."], "answer": "A", "explain": "Halogen là chất oxi hóa mạnh, phản ứng đặc trưng là oxi hóa khử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hydrogen halide X có nhiệt độ sôi cao bất thường. X là", "options": ["A. $HF$.", "B. $HCl$.", "C. $HBr$.", "D. $HI$."], "answer": "A", "explain": "Do liên kết hydrogen.", "points": 0.25}, {"answer": "A", "explain": "$AgCl$ là kết tủa trắng; $AgBr$ vàng nhạt; $AgI$ vàng đậm; $AgF$ tan trong nước.", "level": "NB", "options": ["A. trắng.", "B. vàng nhạt.", "C. vàng đậm.", "D. đen."], "points": 0.25, "q": "Màu của kết tủa $AgCl$ là", "type": "mcq"}, {"type": "mcq", "level": "TH", "q": "Phản ứng $2F_2 + 2H_2O \\to 4HF + O_2$ chứng tỏ", "options": ["A. $F_2$ oxi hóa được cả $H_2O$.", "B. $F_2$ có tính khử.", "C. $H_2O$ không bị oxi hóa.", "D. $F_2$ tan trong nước."], "answer": "A", "explain": "$F_2$ mạnh nhất, oxi hóa được $O^{2-}$ trong nước thành $O_2$.", "points": 0.25}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong công nghiệp, hydrogen fluoride được điều chế từ", "options": ["A. CaF2 và H2SO4 đặc, đun nóng.", "B. F2 tác dụng với H2O.", "C. NaF tác dụng với HCl loãng.", "D. điện phân CaF2 nóng chảy."], "answer": "A", "explain": "CaF2 + H2SO4 đặc → CaSO4 + 2HF (đun nóng)."}, {"type": "mcq", "level": "VDC", "q": "Có 4 dung dịch: $NaF, NaCl, NaBr, NaI$. Thứ tự nhận biết bằng $AgNO_3$: không kết tủa, trắng, vàng nhạt, vàng đậm lần lượt ứng với", "options": ["A. $NaF, NaCl, NaBr, NaI$.", "B. $NaCl, NaBr, NaI, NaF$.", "C. $NaF, NaBr, NaCl, NaI$.", "D. $NaI, NaBr, NaCl, NaF$."], "answer": "A", "explain": "$AgF$ tan; $AgCl$ trắng; $AgBr$ vàng nhạt; $AgI$ vàng đậm.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về ứng dụng:", "statements": ["a) $Cl_2$ dùng để khử trùng nước sinh hoạt.", "b) Nước Javel dùng để tẩy rửa, khử trùng.", "c) $HF$ dùng để khắc chữ lên thủy tinh.", "d) $I_2$ trong y tế dùng để sát trùng vết thương."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về tính chất của hydrogen halide:", "statements": ["a) $HCl$ khí tan rất nhiều trong nước.", "b) Dung dịch $HCl$ làm đỏ quỳ tím.", "c) $HF$ là acid yếu.", "d) Nhiệt độ sôi: $HF \\gt HCl \\gt HBr \\gt HI$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $HF \\gt HI \\gt HBr \\gt HCl$.", "points": 1}, {"type": "short", "level": "VD", "q": "Xác định số oxi hóa của fluorine trong mọi hợp chất của nó.", "answer": "-1", "explain": "F có độ âm điện lớn nhất nên luôn $-1$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho phản ứng: $H_2 + Cl_2 \\to 2HCl$. Cho 0,25 mol $H_2$ phản ứng hết. Tính số mol $HCl$ tạo thành (làm tròn đến 2 chữ số thập phân).", "answer": "0,50", "explain": "$n_{HCl} = 2 \\times 0{,}25 = 0{,}50$ mol.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Nhiệt độ nóng chảy và nhiệt độ sôi tăng dần từ $F_2$ đến $I_2$ vì", "options": ["A. tương tác van der Waals tăng và khối lượng phân tử tăng.", "B. độ âm điện tăng dần.", "C. tính oxi hóa tăng dần.", "D. bán kính giảm dần."], "answer": "A", "explain": "Tương tác van der Waals và khối lượng phân tử tăng dần.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đơn chất halogen nào có tính oxi hóa mạnh nhất?", "options": ["A. $F_2$.", "B. $Cl_2$.", "C. $Br_2$.", "D. $I_2$."], "answer": "A", "explain": "Tính oxi hóa $F_2 \\gt Cl_2 \\gt Br_2 \\gt I_2$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong dãy $HF, HCl, HBr, HI$, chất có tính acid mạnh nhất là", "options": ["A. $HI$.", "B. $HF$.", "C. $HCl$.", "D. $HBr$."], "answer": "A", "explain": "Tính acid tăng dần từ $HF$ đến $HI$.", "points": 0.25}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong các acid HF, HCl, HBr, HI, acid mạnh nhất là", "options": ["A. HI.", "B. HF.", "C. HCl.", "D. HBr."], "answer": "A", "explain": "Năng lượng liên kết H–X giảm dần từ HF đến HI nên HI dễ phân li H+ nhất."}, {"type": "mcq", "level": "TH", "q": "Phản ứng $H_2 + F_2$ xảy ra", "options": ["A. trong bóng tối, ngay ở nhiệt độ thường.", "B. cần ánh sáng.", "C. cần đun nóng mạnh.", "D. cần xúc tác."], "answer": "A", "explain": "$F_2$ hoạt động mạnh nhất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho $Cl_2$ tác dụng với $NaOH$ ở nhiệt độ thường thu được nước Javel chứa $NaCl$ và $NaClO$. Số oxi hóa của Cl trong $NaClO$ là", "options": ["A. $+1$.", "B. $-1$.", "C. $+5$.", "D. $+7$."], "answer": "A", "explain": "Na có $+1$, O có $-2$ nên Cl có $+1$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về tính chất vật lí:", "statements": ["a) $F_2$ là khí màu vàng lục nhạt.", "b) $Cl_2$ là khí màu vàng lục.", "c) $Br_2$ là lỏng màu nâu đỏ.", "d) $I_2$ là rắn màu tím đen."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về điều chế:", "statements": ["a) $CaF_2 + H_2SO_4$ (đặc) $\\to 2HF + CaSO_4$.", "b) $NaCl$ (rắn) $+ H_2SO_4$ (đặc) $\\to HCl + NaHSO_4$.", "c) $H_2 + Cl_2 \\to 2HCl$ (công nghiệp).", "d) Điện phân dung dịch $NaCl$ có màng ngăn thu được $Cl_2$."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng.", "points": 1}, {"type": "short", "level": "VD", "q": "Xác định số oxi hóa của chlorine trong $Cl_2$.", "answer": "0", "explain": "Đơn chất có số oxi hóa bằng 0.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho phản ứng: $CaF_2 + H_2SO_4$ (đặc) $\\xrightarrow{t^o} CaSO_4 + 2HF$. Cho 0,2 mol $CaF_2$ phản ứng hết. Tính số mol $HF$ thu được (làm tròn đến 1 chữ số thập phân).", "answer": "0,4", "explain": "$n_{HF} = 2 \\times 0{,}2 = 0{,}4$ mol.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Trong hợp chất, số oxi hóa của fluorine luôn là", "options": ["A. $-1$.", "B. $+1$.", "C. $+7$.", "D. 0."], "answer": "A", "explain": "F có độ âm điện lớn nhất nên luôn $-1$.", "points": 0.25}, {"answer": "A", "explain": "$Br_2$ là chất lỏng màu nâu đỏ, dễ bay hơi; $I_2$ là chất rắn màu tím đen; $Cl_2$ là chất khí màu vàng lục; $F_2$ là chất khí màu lục nhạt.", "level": "NB", "options": ["A. chất lỏng màu nâu đỏ.", "B. chất rắn màu tím đen.", "C. chất khí màu vàng lục.", "D. chất khí màu lục nhạt."], "points": 0.25, "q": "Đơn chất $Br_2$ ở điều kiện thường là", "type": "mcq"}, {"type": "mcq", "level": "NB", "q": "Khí $HF$ được điều chế từ", "options": ["A. $CaF_2$ và $H_2SO_4$ đặc.", "B. $NaF$ và nước.", "C. $F_2$ và $H_2O$.", "D. $NaF$ và $NaOH$."], "answer": "A", "explain": "$CaF_2(s) + H_2SO_4$ (đặc) $\\xrightarrow{t^o} CaSO_4(s) + 2HF(g)$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phản ứng $Cl_2 + 2NaOH \\to NaCl + NaClO + H_2O$ xảy ra ở", "options": ["A. nhiệt độ thường.", "B. nhiệt độ cao.", "C. áp suất cao.", "D. có xúc tác."], "answer": "A", "explain": "Nhiệt độ thường tạo $NaClO$; đun nóng tạo $NaClO_3$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phản ứng $H_2 + Cl_2 \\to 2HCl$ xảy ra khi", "options": ["A. có ánh sáng hoặc đun nóng.", "B. trong bóng tối ở nhiệt độ thường.", "C. ở nhiệt độ rất thấp.", "D. không cần điều kiện."], "answer": "A", "explain": "$H_2 + Cl_2$ cần ánh sáng hoặc đun nóng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho các phát biểu: (1) $HF$ là acid yếu; (2) $HCl$ là acid mạnh; (3) Tính khử $F^- \\lt Cl^- \\lt Br^- \\lt I^-$; (4) $AgF$ tan trong nước. Số phát biểu đúng là", "options": ["A. 4.", "B. 3.", "C. 2.", "D. 1."], "answer": "A", "explain": "Cả 4 phát biểu đều đúng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu ôn tập:", "statements": ["a) Tính oxi hóa: $F_2 \\gt Cl_2 \\gt Br_2 \\gt I_2$.", "b) Tính khử: $F^- \\lt Cl^- \\lt Br^- \\lt I^-$.", "c) Tính acid: $HF \\lt HCl \\lt HBr \\lt HI$.", "d) Nhiệt độ sôi: $HF \\lt HCl \\lt HBr \\lt HI$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $HF$ cao bất thường.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về tính khử của ion halide:", "statements": ["a) $F^-$ có tính khử yếu nhất.", "b) $I^-$ có tính khử mạnh nhất.", "c) $H_2SO_4$ đặc oxi hóa được $Br^-$ thành $Br_2$.", "d) $H_2SO_4$ đặc oxi hóa được $Cl^-$ thành $Cl_2$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "points": 0.5, "q": "Xác định số oxi hóa của chlorine trong HClO.", "answer": "+1", "explain": "H có số oxi hóa +1, O có số oxi hóa -2, suy ra Cl có số oxi hóa +1."}, {"answer": "1", "explain": "Chỉ có $NaI$ tác dụng với $Br_2$: $2NaI + Br_2 \\to 2NaBr + I_2$, vì tính oxi hóa của $Br_2$ mạnh hơn $I_2$ nhưng yếu hơn $Cl_2$ và $F_2$.", "level": "VDC", "points": 0.5, "q": "Trong dãy $NaF, NaCl, NaBr, NaI$, có bao nhiêu muối tác dụng được với dung dịch $Br_2$?", "type": "short"}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Halogen là", "options": ["A. phi kim điển hình, có tính oxi hóa mạnh.", "B. kim loại điển hình.", "C. khí hiếm.", "D. phi kim có tính khử mạnh."], "answer": "A", "explain": "Halogen là phi kim điển hình với tính oxi hóa mạnh.", "points": 0.25}, {"answer": "A", "explain": "Halogen gồm F, Cl, Br, I thuộc nhóm VIIA trong bảng tuần hoàn.", "level": "NB", "options": ["A. VIIA.", "B. VIA.", "C. IA.", "D. VIIIA."], "points": 0.25, "q": "Các nguyên tố halogen thuộc nhóm", "type": "mcq"}, {"type": "mcq", "level": "NB", "q": "Nước Javel chứa", "options": ["A. $NaCl$ và $NaClO$.", "B. $NaCl$ và $NaClO_3$.", "C. $CaCl_2$ và $Ca(ClO)_2$.", "D. $HCl$ và $HClO$."], "answer": "A", "explain": "$Cl_2 + 2NaOH \\to NaCl + NaClO + H_2O$.", "points": 0.25}, {"answer": "A", "explain": "Dung dịch $AgNO_3$ tạo kết tủa trắng $AgCl$ với dung dịch $NaCl$ và không hiện tượng với dung dịch $NaNO_3$.", "level": "TH", "options": ["A. dung dịch $AgNO_3$.", "B. dung dịch $BaCl_2$.", "C. quỳ tím.", "D. dung dịch $NaOH$."], "points": 0.25, "q": "Để phân biệt dung dịch $NaCl$ và dung dịch $NaNO_3$, có thể dùng thuốc thử là", "type": "mcq"}, {"type": "mcq", "level": "TH", "q": "Trong công nghiệp, $Cl_2$ được điều chế bằng cách", "options": ["A. điện phân dung dịch $NaCl$ bão hòa có màng ngăn.", "B. đun nóng $HCl$ đặc với $MnO_2$.", "C. nhiệt phân $KClO_3$.", "D. cho $NaCl$ tác dụng với $H_2SO_4$ đặc."], "answer": "A", "explain": "$2NaCl + 2H_2O \\to 2NaOH + H_2 + Cl_2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho phản ứng: $X_2 + 2NaY \\to 2NaX + Y_2$ (X, Y là các halogen). Nếu Y là iodine thì X có thể là", "options": ["A. $Cl_2$.", "B. $Br_2$.", "C. $F_2$.", "D. cả A, B và C."], "answer": "D", "explain": "$F_2, Cl_2, Br_2$ đều mạnh hơn $I_2$ nên đều đẩy được.", "points": 0.25}, {"answer": ["T", "T", "F", "T"], "explain": "a) Đúng: $HF$ lỏng do liên kết hydrogen liên phân tử. b) Đúng. c) Sai: $HF$ là acid yếu, $HCl, HBr, HI$ là acid mạnh. d) Đúng.", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các phát biểu về hydrogen halide:", "statements": ["a) $HF$ là chất lỏng ở điều kiện thường, còn $HCl, HBr, HI$ là chất khí.", "b) Tính acid của các dung dịch tăng dần từ $HF$ đến $HI$.", "c) $HF$ là acid mạnh nhất trong dãy.", "d) Dung dịch $HCl$ đặc bốc khói trong không khí ẩm."], "type": "truefalse"}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về phản ứng của halogen:", "statements": ["a) $2Fe + 3Cl_2 \\xrightarrow{t^o} 2FeCl_3$.", "b) $H_2 + Cl_2 \\xrightarrow{ánh sáng} 2HCl$.", "c) $2F_2 + 2H_2O \\to 4HF + O_2$.", "d) $Br_2 + NaCl \\to NaBr + Cl_2$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hóa học của hydrogen chloride.", "answer": "HCl", "explain": "Hydrogen chloride có công thức $HCl$.", "points": 0.5}, {"answer": "11,7", "explain": "$Cl_2 + 2NaOH \\to NaCl + NaClO + H_2O$. Số mol $Cl_2 = 4{,}48/22{,}4 = 0{,}2$ mol, suy ra số mol $NaCl = 0{,}2$ mol. Khối lượng $NaCl = 0{,}2 \\times 58{,}5 = 11{,}7$ g.", "level": "VDC", "points": 0.5, "q": "Dẫn 4,48 lít khí $Cl_2$ (đktc) tác dụng vừa đủ với dung dịch $NaOH$ loãng, lạnh. Khối lượng muối $NaCl$ thu được là bao nhiêu gam?", "type": "short"}]}]}</script>
