$.", "D. $X^-$."], "answer": "B", "explain": "Đơn chất halogen tồn tại ở dạng phân tử hai nguyên tử, kí hiệu chung là $X_2$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tính oxi hóa của các halogen biến đổi như thế nào từ $F_2$ đến $I_2$?", "options": ["A. Tăng dần.", "B. Giảm dần.", "C. Không đổi.", "D. Tăng rồi giảm."], "answer": "B", "explain": "Độ âm điện giảm dần từ F đến I nên khả năng nhận electron giảm dần, tính oxi hóa giảm dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khí chlorine ở điều kiện thường có màu", "options": ["A. vàng lục.", "B. nâu đỏ.", "C. tím đen.", "D. không màu."], "answer": "A", "explain": "$Cl_2$ là chất khí màu vàng lục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phản ứng giữa $H_2$ với đơn chất halogen nào sau đây xảy ra ngay ở nhiệt độ thường và trong bóng tối?", "options": ["A. $F_2$.", "B. $Cl_2$.", "C. $Br_2$.", "D. $I_2$."], "answer": "A", "explain": "$H_2 + F_2 \\to 2HF$ xảy ra ngay trong bóng tối ở nhiệt độ thường (phản ứng nổ), thể hiện $F_2$ có tính oxi hóa mạnh nhất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho Fe tác dụng với $Cl_2$ (đun nóng) và với dung dịch $HCl$ loãng. Sản phẩm thu được lần lượt là", "options": ["A. $FeCl_3$ và $FeCl_2$.", "B. $FeCl_2$ và $FeCl_3$.", "C. $FeCl_3$ và $FeCl_3$.", "D. $FeCl_2$ và $FeCl_2$."], "answer": "A", "explain": "$Cl_2$ có tính oxi hóa mạnh, oxi hóa Fe lên $+3$ ($2Fe + 3Cl_2 \\to 2FeCl_3$); $HCl$ loãng chỉ oxi hóa Fe lên $+2$ ($Fe + 2HCl \\to FeCl_2 + H_2$).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về tính chất vật lí của halogen:", "statements": ["a) $F_2$ là chất khí màu vàng lục nhạt.", "b) $Br_2$ là chất lỏng màu nâu đỏ.", "c) $I_2$ là chất rắn màu tím đen.", "d) Nhiệt độ sôi giảm dần từ $F_2$ đến $I_2$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nhiệt độ sôi tăng dần từ $F_2$ đến $I_2$ do tương tác van der Waals tăng.", "points": 1}, {"typ ộ sôi tăng dần từ $F_2$ đến $I_2$ vì", "options": ["A. tương tác van der Waals giữa các phân tử tăng và khối lượng phân tử tăng.", "B. độ âm điện tăng dần.", "C. tính oxi hóa tăng dần.", "D. bán kính nguyên tử giảm dần."], "answer": "A", "explain": "Tương tác van der Waals tăng và khối lượng phân tử tăng làm nhiệt độ nóng chảy, sôi tăng dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nước Javel là hỗn hợp gồm", "options": ["A. $NaCl$ và $NaClO$ (còn $NaOH$ dư).", "B. $NaCl$ và $NaClO_3$.", "C. $CaCl_2$ và $Ca(ClO)_2$.", "D. $HCl$ và $HClO$."], "answer": "A", "explain": "Nước Javel thu được khi cho $Cl_2$ tác dụng với dung dịch $NaOH$ ở nhiệt độ thường, chứa $NaCl$, $NaClO$ và một phần $NaOH$ dư.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho các halogen tác dụng với nước. Halogen phản ứng mạnh nhất với nước ở điều kiện thường là", "options": ["A. $F_2$.", "B. $Cl_2$.", "C. $Br_2$.", "D. $I_2$."], "answer": "A", "explain": "$2F_2 + 2H_2O \\to 4HF + O_2$ xảy ra mạnh ngay ở điều kiện thường; $Cl_2, Br_2$ phản ứng thuận nghịch yếu; $I_2$ hầu như không phản ứng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về cấu tạo của halogen:", "statements": ["a) Các nguyên tử halogen có 7 electron ở lớp ngoài cùng.", "b) Halogen dễ nhận thêm 1 electron để đạt cấu hình khí hiếm.", "c) Số oxi hóa đặc trưng của halogen là $-1$.", "d) Fluorine có thể có số oxi hóa $+7$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: fluorine luôn có số oxi hóa $-1$ trong mọi hợp chất.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về điều chế chlorine:", "statements": ["a) Trong công nghiệp, $Cl_2$ được điều chế bằng cách điện phân dung dịch $NaCl$ bão hòa có màng ngăn.", "b) Sản phẩm điện phân còn có $NaOH$ và $H_2$.", "c) Trong phòng thí nghiệm, đun nóng $HCl$ đặc với $MnO_2$ thu được $Cl_2$.", "d) Trong phòng thí nghiệm, $Cl_2$ được điều chế bằng cách điện phân nước."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: điện phân nước chỉ thu được $H_2$ và $O_2$.", "points": 1}, {"type": "short", "level": "VD", "q": "Xác định số oxi hóa của chlorine trong hợp chất $KClO_3$.", "answer": "+5", "explain": "K có $+1$, O có $-2$ nên Cl có số oxi hóa $+5$ ($+1 + x + 3 \\times (-2) = 0 \\Rightarrow x = +5$).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điện phân dung dịch $NaCl$ bão hòa có màng ngăn thu được $NaOH$, $H_2$ và $Cl_2$. Có bao nhiêu chất khí thu được?", "answer": "2", "explain": "Hai chất khí là $H_2$ (ở cathode) và $Cl_2$ (ở anode).", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Liên kết hóa học trong phân tử $X_2$ (đơn chất halogen) là", "options": ["A. liên kết ion.", "B. liên kết cộng hóa trị không phân cực.", "C. liên kết cộng hóa trị phân cực.", "D. liên kết hydrogen."], "answer": "B", "explain": "Hai nguyên tử halogen giống nhau liên kết với nhau bằng liên kết cộng hóa trị không phân cực.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Halogen là các", "options": ["A. kim loại điển hình.", "B. phi kim điển hình, có tính oxi hóa mạnh.", "C. khí hiếm.", "D. kim loại kiềm."], "answer": "B", "explain": "Halogen là phi kim điển hình, có tính oxi hóa mạnh do dễ nhận electron.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong y tế, dung dịch iodine loãng trong ethanol được dùng làm", "options": ["A. thuốc sát trùng.", "B. thuốc giảm đau.", "C. thuốc bổ.", "D. nước cất."], "answer": "A", "explain": "Dung dịch iodine loãng trong ethanol (cồn iodine) được dùng làm thuốc sát trùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi $Cl_2$ tan vào nước, một phần tác dụng với nước theo phản ứng $Cl_2 + H_2O \\rightleftharpoons HCl + HClO$. Nước chlorine có khả năng diệt khuẩn vì", "options": ["A. $HCl$ có tính acid mạnh.", "B. $HClO$ có tính oxi hóa mạnh.", "C. $Cl_2$ có màu vàng lục.", "D. nước có tính sát trùng."], "answer": "B", "explain": "$HClO$ có tính oxi hóa mạnh nên nước chlorine có khả năng diệt khuẩn, tẩy màu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Clorua vôi có công thức là", "options": ["A. $CaOCl_2$.", "B. $CaCl_2$.", "C. $Ca(ClO)_2$.", "D. $NaClO$."], "answer": "A", "explain": "Clorua vôi thu được khi cho $Cl_2$ tác dụng với $Ca(OH)_2$, công thức $CaOCl_2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sục khí $Cl_2$ vào dung dịch $NaBr$ loãng. Hiện tượng quan sát được là", "options": ["A. dung dịch chuyển sang màu nâu đỏ.", "B. có kết tủa trắng.", "C. có khí không màu thoát ra.", "D. không có hiện tượng gì."], "answer": "A", "explain": "$Cl_2 + 2NaBr \\to 2NaCl + Br_2$; $Br_2$ sinh ra làm dung dịch chuyển sang màu nâu đỏ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về tính chất vật lí của halogen:", "statements": ["a) Halogen tan ít trong nước nhưng tan nhiều trong dung môi hữu cơ.", "b) $Br_2$ gây bỏng sâu khi tiếp xúc với da.", "c) $I_2$ dễ thăng hoa.", "d) Nhiệt độ nóng chảy giảm dần từ $F_2$ đến $I_2$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tăng dần.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về tính oxi hóa của halogen:", "statements": ["a) Tính oxi hóa giảm dần: $F_2 \\gt Cl_2 \\gt Br_2 \\gt I_2$.", "b) Halogen mạnh đẩy halogen yếu ra khỏi dung dịch muối.", "c) $Cl_2 + 2NaBr \\to 2NaCl + Br_2$.", "d) $I_2 + 2NaCl \\to 2NaI + Cl_2$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $I_2$ yếu hơn $Cl_2$ nên không đẩy được $Cl_2$ ra khỏi muối.", "points": 1}, {"type": "short", "level": "VD", "q": "Xác định số oxi hóa của bromine trong hợp chất $NaBrO_3$.", "answer": "+5", "explain": "Na có $+1$, O có $-2$ nên Br có số oxi hóa $+5$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho phản ứng: $2Fe + 3Cl_2 \\xrightarrow{t^o} 2FeCl_3$. Cho 0,1 mol Fe phản ứng hết với $Cl_2$ dư. Tính số mol $Cl_2$ đã phản ứng (làm tròn đến 2 chữ số thập phân).", "answer": "0,15", "explain": "Theo phương trình: $n_{Cl_2} = 3/2 \\times n_{Fe} = 1{,}5 \\times 0{,}1 = 0{,}15$ mol.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Hai nguyên tố At và Ts trong nhóm halogen là các nguyên tố", "options": ["A. phóng xạ.", "B. khí hiếm.", "C. kim loại.", "D. tồn tại nhiều trong tự nhiên."], "answer": "A", "explain": "At (astatine) và Ts (tennessine) là các nguyên tố phóng xạ, không tồn tại bền trong tự nhiên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Các nguyên tử halogen dễ nhận thêm 1 electron để", "options": ["A. đạt cấu hình electron bền của khí hiếm gần nhất.", "B. trở thành kim loại.", "C. tạo liên kết ion với nhau.", "D. giảm số lớp electron."], "answer": "A", "explain": "$ns^2np^5 + 1e \\to ns^2np^6$ — đạt cấu hình bền của khí hiếm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi tiếp xúc với da, đơn chất halogen nào sau đây gây bỏng sâu?", "options": ["A. $F_2$.", "B. $Cl_2$.", "C. $Br_2$.", "D. $I_2$."], "answer": "C", "explain": "Bromine ở thể lỏng gây bỏng sâu khi tiếp xúc với da.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phản ứng $H_2 + Cl_2 \\to 2HCl$ xảy ra khi", "options": ["A. trong bóng tối ở nhiệt độ thường.", "B. có ánh sáng hoặc đun nóng.", "C. đun nóng mạnh và có xúc tác, thuận nghịch.", "D. ở nhiệt độ rất thấp."], "answer": "B", "explain": "$H_2 + Cl_2$ cần ánh sáng (phản ứng nổ khi có ánh sáng) hoặc đun nóng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phòng thí nghiệm, chlorine được điều chế bằng cách", "options": ["A. điện phân dung dịch $NaCl$ có màng ngăn.", "B. đun nóng $HCl$ đặc với $MnO_2$.", "C. nhiệt phân $KClO_3$.", "D. cho $NaCl$ tác dụng với nước."], "answer": "B", "explain": "PTN: $4HCl$ (đặc) $+ MnO_2 \\xrightarrow{t^o} MnCl_2 + Cl_2 + 2H_2O$; điện phân dung dịch $NaCl$ là phương pháp công nghiệp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Chất nào sau đây không oxi hóa được ion $I^-$ thành $I_2$?", "options": ["A. $Cl_2$.", "B. $Br_2$.", "C. $I_2$.", "D. $F_2$."], "answer": "C", "explain": "Tính oxi hóa $F_2 \\gt Cl_2 \\gt Br_2 \\gt I_2$ nên $F_2, Cl_2, Br_2$ đều oxi hóa được $I^-$; $I_2$ không tự oxi hóa $I^-$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về ứng dụng của halogen:", "statements": ["a) $NaF$ được dùng trong kem đánh răng.", "b) $Cl_2$ được dùng để khử trùng nước sinh hoạt.", "c) Nước Javel được dùng làm chất tẩy rửa, khử trùng.", "d) $I_2$ được dùng để sản xuất phân bón."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $I_2$ dùng làm thuốc sát trùng, bổ sung cho tuyến giáp; không dùng sản xuất phân bón.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Cho $Cl_2$ tác dụng với dung dịch $NaOH$. Xét các phát biểu:", "statements": ["a) Ở nhiệt độ thường: $Cl_2 + 2NaOH \\to NaCl + NaClO + H_2O$.", "b) Sản phẩm chứa $NaClO$ có tính oxi hóa mạnh.", "c) Hỗn hợp thu được gọi là nước Javel.", "d) Khi đun nóng, sản phẩm cũng chỉ là $NaCl$ và $NaClO$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: khi đun nóng tạo $NaCl$ và $NaClO_3$: $3Cl_2 + 6NaOH \\xrightarrow{t^o} 5NaCl + NaClO_3 + 3H_2O$.", "points": 1}, {"type": "short", "level": "VD", "q": "Xác định số oxi hóa của chlorine trong hợp chất $HClO$.", "answer": "+1", "explain": "H có $+1$, O có $-2$ nên Cl có số oxi hóa $+1$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho phản ứng: $4HCl$ (đặc) $+ MnO_2 \\xrightarrow{t^o} MnCl_2 + Cl_2 + 2H_2O$. Từ 0,2 mol $MnO_2$, tính số mol $Cl_2$ thu được (làm tròn đến 1 chữ số thập phân).", "answer": "0,2", "explain": "Theo phương trình, $n_{Cl_2} = n_{MnO_2} = 0{,}2$ mol.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Trong tự nhiên, halogen tồn tại phần lớn ở dạng", "options": ["A. đơn chất.", "B. muối halide.", "C. khí hiếm.", "D. oxide."], "answer": "B", "explain": "Trong tự nhiên, halogen chỉ tồn tại ở dạng hợp chất, phần lớn ở dạng muối halide.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tính oxi hóa của halogen thể hiện ở khả năng", "options": ["A. nhận electron.", "B. nhường electron.", "C. cho proton.", "D. nhận proton."], "answer": "A", "explain": "Chất oxi hóa là chất nhận electron; halogen dễ nhận 1 electron nên có tính oxi hóa mạnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đơn chất $F_2$ ở điều kiện thường là chất khí màu", "options": ["A. vàng lục nhạt.", "B. nâu đỏ.", "C. tím đen.", "D. không màu."], "answer": "A", "explain": "$F_2$ là chất khí màu vàng lục nhạt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phản ứng $H_2 + I_2 \\rightleftharpoons 2HI$ là phản ứng", "options": ["A. một chiều.", "B. thuận nghịch, cần đun nóng và xúc tác.", "C. xảy ra trong bóng tối ở nhiệt độ thường.", "D. không xảy ra."], "answer": "B", "explain": "$I_2$ có tính oxi hóa yếu nhất nên phản ứng với $H_2$ cần đun nóng, xúc tác và là phản ứng thuận nghịch.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điện phân dung dịch $NaCl$ bão hòa có màng ngăn thu được", "options": ["A. $NaOH$, $H_2$, $Cl_2$.", "B. $Na$, $H_2$, $Cl_2$.", "C. $NaOH$, $O_2$, $Cl_2$.", "D. $NaCl$, $H_2$, $O_2$."], "answer": "A", "explain": "$2NaCl + 2H_2O \\to 2NaOH + H_2 + Cl_2$ (điện phân dung dịch có màng ngăn).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho phản ứng: $Cl_2 + 2NaI \\to 2NaCl + I_2$. Kết luận đúng là", "options": ["A. $Cl_2$ có tính oxi hóa mạnh hơn $I_2$.", "B. $I_2$ có tính oxi hóa mạnh hơn $Cl_2$.", "C. $NaI$ có tính oxi hóa mạnh hơn $NaCl$.", "D. $Cl_2$ có tính khử mạnh hơn $I_2$."], "answer": "A", "explain": "$Cl_2$ đẩy $I_2$ ra khỏi muối nên $Cl_2$ có tính oxi hóa mạnh hơn $I_2$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về cấu tạo nguyên tử halogen:", "statements": ["a) Halogen có 7 electron ở lớp ngoài cùng.", "b) Cấu hình lớp ngoài cùng là $ns^2np^5$.", "c) Halogen dễ nhận 1 electron thành ion $X^-$.", "d) Halogen dễ nhường 1 electron thành ion $X^+$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: halogen có xu hướng nhận electron, không nhường.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về tính chất hóa học của $Cl_2$:", "statements": ["a) $Cl_2$ tác dụng với $Na$ tạo $NaCl$.", "b) $Cl_2$ tác dụng với $H_2$ (có ánh sáng) tạo $HCl$.", "c) $Cl_2$ tác dụng với $H_2O$ tạo $HCl$ và $HClO$.", "d) $Cl_2$ không tác dụng với dung dịch $NaOH$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $Cl_2 + 2NaOH \\to NaCl + NaClO + H_2O$.", "points": 1}, {"type": "short", "level": "VD", "q": "Xác định số oxi hóa của iodine trong hợp chất $KIO_3$.", "answer": "+5", "explain": "K có $+1$, O có $-2$ nên I có số oxi hóa $+5$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho phản ứng: $Cl_2 + 2NaOH \\to NaCl + NaClO + H_2O$. Cho 0,3 mol $Cl_2$ phản ứng hết với $NaOH$ dư. Tính số mol $NaClO$ tạo thành (làm tròn đến 1 chữ số thập phân).", "answer": "0,3", "explain": "Theo phương trình, $n_{NaClO} = n_{Cl_2} = 0{,}3$ mol.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Nhóm VIIA trong bảng tuần hoàn còn được gọi là", "options": ["A. nhóm halogen.", "B. nhóm khí hiếm.", "C. nhóm kim loại kiềm.", "D. nhóm kim loại kiềm thổ."], "answer": "A", "explain": "Nhóm VIIA gồm các nguyên tố halogen: F, Cl, Br, I.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mỗi phân tử đơn chất halogen gồm bao nhiêu nguyên tử?", "options": ["A. 1.", "B. 2.", "C. 3.", "D. 4."], "answer": "B", "explain": "Đơn chất halogen tồn tại ở dạng phân tử hai nguyên tử $X_2$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Halogen tan như thế nào trong nước và dung môi hữu cơ?", "options": ["A. Tan nhiều trong nước, ít tan trong dung môi hữu cơ.", "B. Tan ít trong nước, tan nhiều trong dung môi hữu cơ.", "C. Tan nhiều trong cả hai.", "D. Không tan trong cả hai."], "answer": "B", "explain": "Halogen tan ít trong nước nhưng tan nhiều trong các dung môi hữu cơ như benzene.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phản ứng $2Na + Cl_2 \\xrightarrow{t^o} 2NaCl$ thuộc loại phản ứng", "options": ["A. oxi hóa - khử, $Cl_2$ là chất oxi hóa.", "B. trao đổi.", "C. phân hủy.", "D. trung hòa."], "answer": "A", "explain": "Số oxi hóa của Cl giảm từ 0 xuống $-1$ nên $Cl_2$ là chất oxi hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nước chlorine có khả năng diệt khuẩn, tẩy màu là nhờ", "options": ["A. $HCl$ có tính acid.", "B. $HClO$ có tính oxi hóa mạnh.", "C. $Cl_2$ có màu vàng lục.", "D. nước có tính sát trùng."], "answer": "B", "explain": "$HClO$ sinh ra khi $Cl_2$ tác dụng với nước có tính oxi hóa mạnh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sắp xếp các halogen theo chiều tăng dần nhiệt độ sôi:", "options": ["A. $F_2 \\lt Cl_2 \\lt Br_2 \\lt I_2$.", "B. $I_2 \\lt Br_2 \\lt Cl_2 \\lt F_2$.", "C. $Cl_2 \\lt F_2 \\lt Br_2 \\lt I_2$.", "D. $F_2 \\lt Br_2 \\lt Cl_2 \\lt I_2$."], "answer": "A", "explain": "Nhiệt độ sôi tăng dần từ $F_2$ đến $I_2$ do tương tác van der Waals và khối lượng phân tử tăng.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về tính chất vật lí của halogen:", "statements": ["a) $Cl_2$ là chất khí màu vàng lục.", "b) $Br_2$ là chất lỏng màu nâu đỏ.", "c) $F_2$ là chất khí màu vàng lục nhạt.", "d) $I_2$ là chất khí màu tím."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $I_2$ là chất rắn màu tím đen.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về phản ứng của halogen với nước:", "statements": ["a) $2F_2 + 2H_2O \\to 4HF + O_2$.", "b) $Cl_2 + H_2O \\rightleftharpoons HCl + HClO$.", "c) $Br_2 + H_2O \\rightleftharpoons HBr + HBrO$.", "d) $I_2$ phản ứng mãnh liệt với nước ở điều kiện thường."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $I_2$ hầu như không phản ứng với nước.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong ion $ClO^-$, số oxi hóa của chlorine là bao nhiêu? (Ghi dấu và số, ví dụ +1)", "answer": "+1", "explain": "O có số oxi hóa $-2$, ion có điện tích $-1$ nên Cl có số oxi hóa $+1$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho phản ứng: $3Cl_2 + 6NaOH \\xrightarrow{t^o} 5NaCl + NaClO_3 + 3H_2O$. Cho 0,6 mol $Cl_2$ phản ứng hết. Tính số mol $NaCl$ tạo thành (làm tròn đến 1 chữ số thập phân).", "answer": "1,0", "explain": "Theo phương trình: $n_{NaCl} = 5/3 \\times n_{Cl_2} = 5/3 \\times 0{,}6 = 1{,}0$ mol.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Trong hợp chất với nguyên tố có độ âm điện lớn, các nguyên tố Cl, Br, I có thể có số oxi hóa là", "options": ["A. $-1, +1, +3, +5, +7$.", "B. chỉ $-1$.", "C. $0, +2, +4, +6$.", "D. $-2, +4, +6$."], "answer": "A", "explain": "Cl, Br, I có thể có các số oxi hóa $-1, +1, +3, +5, +7$; riêng F luôn $-1$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "$F_2$ tác dụng với nước ở điều kiện thường", "options": ["A. rất mãnh liệt, giải phóng $O_2$.", "B. rất yếu, thuận nghịch.", "C. không phản ứng.", "D. chỉ tan vật lí."], "answer": "A", "explain": "$2F_2 + 2H_2O \\to 4HF + O_2$ xảy ra mãnh liệt ngay ở điều kiện thường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khí chlorine có màu", "options": ["A. vàng lục.", "B. nâu đỏ.", "C. tím.", "D. không màu."], "answer": "A", "explain": "$Cl_2$ là chất khí màu vàng lục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phản ứng của $Br_2$ với nước là", "options": ["A. $Br_2 + H_2O \\rightleftharpoons HBr + HBrO$.", "B. $Br_2 + H_2O \\to 2HBr + O_2$.", "C. $2Br_2 + 2H_2O \\to 4HBr + O_2$.", "D. không xảy ra."], "answer": "A", "explain": "Tương tự $Cl_2$, $Br_2$ phản ứng thuận nghịch yếu với nước tạo $HBr$ và $HBrO$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ứng dụng nào sau đây của chlorine là đúng?", "options": ["A. Khử trùng nước sinh hoạt.", "B. Sản xuất phân đạm.", "C. Làm chất dẻo chịu nhiệt teflon.", "D. Chế tạo pin."], "answer": "A", "explain": "$Cl_2$ được dùng để khử trùng nước sinh hoạt nhờ tạo $HClO$ có tính oxi hóa mạnh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho các cặp chất: (a) $Cl_2 + NaF$; (b) $Br_2 + NaCl$; (c) $Cl_2 + NaBr$; (d) $I_2 + NaCl$. Số cặp có phản ứng hóa học xảy ra là", "options": ["A. 1.", "B. 2.", "C. 3.", "D. 4."], "answer": "A", "explain": "Halogen mạnh chỉ đẩy được halogen yếu hơn: chỉ có (c) $Cl_2 + 2NaBr \\to 2NaCl + Br_2$ xảy ra.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về điều chế chlorine:", "statements": ["a) Công nghiệp: điện phân dung dịch $NaCl$ bão hòa có màng ngăn.", "b) Phòng thí nghiệm: đun nóng $HCl$ đặc với $MnO_2$.", "c) Phòng thí nghiệm: cho $NaCl$ tác dụng với $H_2O$.", "d) $KMnO_4$ cũng oxi hóa được $HCl$ đặc tạo $Cl_2$."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về tính oxi hóa của halogen:", "statements": ["a) $F_2$ có tính oxi hóa mạnh nhất.", "b) $I_2$ có tính oxi hóa yếu nhất.", "c) Nguyên nhân là do độ âm điện giảm dần từ F đến I.", "d) $Br_2$ oxi hóa được $Cl^-$ thành $Cl_2$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $Br_2$ yếu hơn $Cl_2$ nên không oxi hóa được $Cl^-$.", "points": 1}, {"type": "short", "level": "VD", "q": "Nguyên tử bromine (Z = 35) có bao nhiêu electron ở lớp ngoài cùng?", "answer": "7", "explain": "Br thuộc nhóm VIIA nên có 7 electron ở lớp ngoài cùng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho phản ứng: $H_2 + Cl_2 \\to 2HCl$. Cần bao nhiêu mol $H_2$ để tạo thành 0,4 mol $HCl$ (làm tròn đến 1 chữ số thập phân)?", "answer": "0,2", "explain": "Theo phương trình: $n_{H_2} = 1/2 \\times n_{HCl} = 0{,}2$ mol.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Trong tự nhiên, halogen", "options": ["A. chỉ tồn tại ở dạng hợp chất.", "B. chỉ tồn tại ở dạng đơn chất.", "C. tồn tại ở cả dạng đơn chất và hợp chất.", "D. không tồn tại."], "answer": "A", "explain": "Halogen hoạt động mạnh nên chỉ tồn tại ở dạng hợp chất trong tự nhiên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Các nguyên tử halogen dễ nhận thêm 1 electron để", "options": ["A. đạt cấu hình electron bền của khí hiếm gần nhất.", "B. tăng số lớp electron.", "C. trở thành cation.", "D. giảm độ âm điện."], "answer": "A", "explain": "$ns^2np^5 + 1e \\to ns^2np^6$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đơn chất halogen nào sau đây dễ thăng hoa?", "options": ["A. $F_2$.", "B. $Cl_2$.", "C. $Br_2$.", "D. $I_2$."], "answer": "D", "explain": "$I_2$ là chất rắn dễ thăng hoa (chuyển trực tiếp thành hơi màu tím).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tính oxi hóa giảm dần từ $F_2$ đến $I_2$ vì", "options": ["A. độ âm điện giảm dần nên khả năng nhận electron giảm dần.", "B. bán kính nguyên tử giảm dần.", "C. khối lượng phân tử giảm dần.", "D. nhiệt độ sôi tăng dần."], "answer": "A", "explain": "Độ âm điện giảm dần từ F đến I nên khả năng nhận electron (tính oxi hóa) giảm dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phản ứng $2Fe + 3Cl_2 \\xrightarrow{t^o} 2FeCl_3$ chứng tỏ $Cl_2$", "options": ["A. có tính oxi hóa mạnh, oxi hóa Fe lên số oxi hóa +3.", "B. có tính khử mạnh.", "C. không phản ứng với kim loại.", "D. chỉ oxi hóa Fe lên +2."], "answer": "A", "explain": "$Cl_2$ oxi hóa Fe từ 0 lên $+3$, thể hiện tính oxi hóa mạnh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Halogen X đẩy được $Br_2$ ra khỏi dung dịch $NaBr$ theo phản ứng: $X_2 + 2NaBr \\to 2NaX + Br_2$. X có thể là", "options": ["A. $Cl_2$.", "B. $Br_2$.", "C. $I_2$.", "D. $At_2$."], "answer": "A", "explain": "Halogen mạnh đẩy halogen yếu ra khỏi muối; $Cl_2$ mạnh hơn $Br_2$ nên đẩy được $Br_2$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về tính chất vật lí của halogen:", "statements": ["a) Nhiệt độ nóng chảy, nhiệt độ sôi tăng dần từ $F_2$ đến $I_2$.", "b) $Cl_2$ là khí màu vàng lục.", "c) $Br_2$ là lỏng màu nâu đỏ.", "d) $F_2$ là chất rắn màu tím đen."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $F_2$ là khí màu vàng lục nhạt.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về ứng dụng của halogen:", "statements": ["a) $Cl_2$ dùng để khử trùng nước sinh hoạt.", "b) Nước Javel dùng làm chất tẩy rửa.", "c) Clorua vôi dùng để tẩy trắng, khử trùng.", "d) $Br_2$ dùng để sản xuất $H_2SO_4$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $Br_2$ không dùng sản xuất $H_2SO_4$.", "points": 1}, {"type": "short", "level": "VD", "q": "Xác định số oxi hóa của chlorine trong hợp chất $NaCl$.", "answer": "-1", "explain": "Na có $+1$ nên Cl có số oxi hóa $-1$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho phản ứng: $2Na + Cl_2 \\xrightarrow{t^o} 2NaCl$. Cho 0,5 mol Na phản ứng hết với $Cl_2$. Tính số mol $Cl_2$ đã phản ứng (làm tròn đến 2 chữ số thập phân).", "answer": "0,25", "explain": "Theo phương trình: $n_{Cl_2} = 1/2 \\times n_{Na} = 0{,}25$ mol.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Quá trình $ns^2np^5 + 1e \\to ns^2np^6$ thể hiện halogen", "options": ["A. dễ nhận electron, có tính oxi hóa.", "B. dễ nhường electron, có tính khử.", "C. không có tính oxi hóa.", "D. là kim loại."], "answer": "A", "explain": "Nhận electron thể hiện tính oxi hóa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Halogen có tính oxi hóa", "options": ["A. mạnh.", "B. yếu.", "C. trung bình.", "D. không đáng kể."], "answer": "A", "explain": "Halogen là phi kim điển hình, có tính oxi hóa mạnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nước Javel được dùng làm", "options": ["A. chất tẩy rửa, khử trùng.", "B. phân bón.", "C. thuốc trừ sâu.", "D. chất dẻo."], "answer": "A", "explain": "Nước Javel (chứa $NaClO$) có tính oxi hóa mạnh nên dùng tẩy rửa, khử trùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $Cl_2$ tác dụng với dung dịch $Ca(OH)_2$ thu được", "options": ["A. $CaOCl_2 + H_2O$.", "B. $CaCl_2 + H_2O$.", "C. $Ca(ClO_3)_2 + H_2O$.", "D. $CaO + HCl$."], "answer": "A", "explain": "$Cl_2 + Ca(OH)_2 \\to CaOCl_2 + H_2O$ (clorua vôi).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dung dịch iodine trong ethanol được dùng làm thuốc sát trùng vì", "options": ["A. $I_2$ có tính oxi hóa, diệt được vi khuẩn.", "B. ethanol có mùi thơm.", "C. dung dịch có màu đẹp.", "D. $I_2$ tan nhiều trong nước."], "answer": "A", "explain": "$I_2$ có tính oxi hóa nên diệt được vi khuẩn; ethanol là dung môi hòa tan $I_2$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sắp xếp các ion $Cl^-$, $Br^-$, $I^-$ theo chiều tăng dần tính khử:", "options": ["A. $Cl^- \\lt Br^- \\lt I^-$.", "B. $I^- \\lt Br^- \\lt Cl^-$.", "C. $Br^- \\lt Cl^- \\lt I^-$.", "D. $Cl^- \\lt I^- \\lt Br^-$."], "answer": "A", "explain": "Tính oxi hóa $Cl_2 \\gt Br_2 \\gt I_2$ nên tính khử của ion ngược lại: $Cl^- \\lt Br^- \\lt I^-$ ($I^-$ dễ bị oxi hóa nhất).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu ôn tập:", "statements": ["a) Nhóm halogen là nhóm VIIA.", "b) Halogen có 7 electron lớp ngoài cùng.", "c) Số oxi hóa đặc trưng của halogen là $-1$.", "d) Đơn chất halogen tồn tại ở dạng nguyên tử."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tồn tại ở dạng phân tử $X_2$.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về phản ứng của $Cl_2$:", "statements": ["a) $Cl_2 + H_2 \\xrightarrow{ánh sáng} 2HCl$.", "b) $Cl_2 + 2NaOH \\to NaCl + NaClO + H_2O$.", "c) $Cl_2 + Ca(OH)_2 \\to CaOCl_2 + H_2O$.", "d) $Cl_2 + H_2O \\to 2HCl + O_2$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $Cl_2 + H_2O \\rightleftharpoons HCl + HClO$.", "points": 1}, {"type": "short", "level": "VD", "q": "Trong hợp chất $NaClO$, số oxi hóa của chlorine là bao nhiêu? (Ghi dấu và số, ví dụ +1)", "answer": "+1", "explain": "Na có $+1$, O có $-2$ nên Cl có số oxi hóa $+1$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho phản ứng: $Br_2 + 2NaI \\to 2NaBr + I_2$. Cho 0,2 mol $Br_2$ phản ứng hết. Tính số mol $NaI$ đã phản ứng (làm tròn đến 1 chữ số thập phân).", "answer": "0,4", "explain": "Theo phương trình: $n_{NaI} = 2 \\times n_{Br_2} = 0{,}4$ mol.", "points": 0.5}]}]}
