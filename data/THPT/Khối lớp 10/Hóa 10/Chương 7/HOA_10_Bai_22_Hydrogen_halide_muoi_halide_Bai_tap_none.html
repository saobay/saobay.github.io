ào $NaCl$ rắn (đun nóng), sản phẩm khí thu được là", "options": ["A. $HCl$ (không bị oxi hóa).", "B. $Cl_2$.", "C. $SO_2$.", "D. $H_2$."], "answer": "A", "explain": "$H_2SO_4$ đặc không oxi hóa được $Cl^-$ nên chỉ xảy ra phản ứng trao đổi tạo khí $HCl$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Có 3 dung dịch mất nhãn: $NaCl, NaBr, NaI$. Thuốc thử để phân biệt cả 3 dung dịch là", "options": ["A. dung dịch $AgNO_3$ (dựa vào màu kết tủa).", "B. quỳ tím.", "C. dung dịch $BaCl_2$.", "D. dung dịch $NaOH$."], "answer": "A", "explain": "$AgNO_3$ tạo kết tủa trắng với $Cl^-$, vàng nhạt với $Br^-$, vàng đậm với $I^-$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về tính chất của $HCl$:", "statements": ["a) Dung dịch $HCl$ làm đỏ quỳ tím.", "b) $HCl$ là acid mạnh.", "c) $HCl$ đặc có tính khử.", "d) $HCl$ loãng oxi hóa được $Cu$ thành $Cu^{2+}$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $Cu$ đứng sau $H$ nên không tác dụng với $HCl$.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về tính khử của ion halide:", "statements": ["a) $I^-$ có tính khử mạnh nhất.", "b) $F^-$ có tính khử yếu nhất.", "c) $Br^-$ bị $H_2SO_4$ đặc oxi hóa thành $Br_2$.", "d) $Cl^-$ bị $H_2SO_4$ đặc oxi hóa thành $Cl_2$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Xác định số oxi hóa của bromine trong đơn chất $Br_2$.", "answer": "0", "explain": "Số oxi hóa của nguyên tố trong đơn chất bằng 0.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong phản ứng: $8NaI + 5H_2SO_4$ (đặc) $\\to 4Na_2SO_4 + 4I_2 + H_2S + 4H_2O$, số oxi hóa của sulfur trong $H_2S$ là bao nhiêu? (Ghi dấu và số)", "answer": "-2", "explain": "H có $+1$ nên S trong $H_2S$ có số oxi hóa $-2$ ($H_2SO_4$ bị khử từ $+6$ xuống $-2$).", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Khí $HCl$ tan trong nước", "options": ["A. rất nhiều.", "B. rất ít.", "C. không tan.", "D. vừa phải."], "answer": "A", "explain": "1 lít nước hòa tan khoảng 500 lít $HCl$ (đktc).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ion halide có tính khử mạnh nhất là", "options": ["A. $F^-$.", "B. $Cl^-$.", "C. $Br^-$.", "D. $I^-$."], "answer": "D", "explain": "Tính khử tăng dần $F^- \\lt Cl^- \\lt Br^- \\lt I^-$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dung dịch $HF$ được đựng trong bình nhựa vì", "options": ["A. $HF$ ăn mòn thủy tinh.", "B. $HF$ là chất khí.", "C. $HF$ có tính oxi hóa mạnh.", "D. $HF$ dễ bay hơi."], "answer": "A", "explain": "$HF$ ăn mòn thủy tinh ($SiO_2 + 4HF \\to SiF_4 + 2H_2O$) nên phải đựng trong bình nhựa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao $HF$ được đựng trong bình nhựa mà không đựng trong bình thủy tinh?", "options": ["A. Vì $HF$ ăn mòn thủy tinh.", "B. Vì $HF$ là acid mạnh.", "C. Vì $HF$ dễ cháy.", "D. Vì $HF$ có tính khử mạnh."], "answer": "A", "explain": "$SiO_2 + 4HF \\to SiF_4 + 2H_2O$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "$NaCl$ là nguyên liệu quan trọng để sản xuất", "options": ["A. $Cl_2, H_2, NaOH$.", "B. $H_2SO_4$.", "C. $HNO_3$.", "D. phân đạm."], "answer": "A", "explain": "Điện phân dung dịch $NaCl$ thu được $Cl_2, H_2, NaOH$ — các hóa chất cơ bản của công nghiệp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hydrogen halide X có nhiệt độ sôi cao bất thường so với các hydrogen halide khác. X là", "options": ["A. $HF$.", "B. $HCl$.", "C. $HBr$.", "D. $HI$."], "answer": "A", "explain": "$HF$ tạo được liên kết hydrogen nên có nhiệt độ sôi cao bất thường.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về tính acid:", "statements": ["a) $HF$ là acid yếu.", "b) $HCl$ là acid mạnh.", "c) $HBr$ là acid mạnh.", "d) $HI$ là acid yếu."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $HI$ là acid rất mạnh.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về điều chế:", "statements": ["a) $CaF_2 + H_2SO_4$ (đặc) $\\to 2HF + CaSO_4$.", "b) $NaCl$ (rắn) $+ H_2SO_4$ (đặc) $\\to HCl + NaHSO_4$.", "c) $H_2 + Cl_2 \\to 2HCl$ (công nghiệp).", "d) Điều chế $HCl$ trong phòng thí nghiệm dùng dung dịch $NaCl$ loãng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phải dùng $NaCl$ rắn với $H_2SO_4$ đặc.", "points": 1}, {"type": "short", "level": "VD", "q": "Xác định số oxi hóa của chlorine trong $HCl$.", "answer": "-1", "explain": "H có $+1$ nên Cl có số oxi hóa $-1$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong dãy $HF, HCl, HBr, HI$, có bao nhiêu chất là chất khí ở điều kiện thường?", "answer": "3", "explain": "$HCl, HBr, HI$ là chất khí; $HF$ là chất lỏng.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Loại liên kết làm cho $HF$ có nhiệt độ sôi cao bất thường là", "options": ["A. liên kết hydrogen.", "B. liên kết ion.", "C. liên kết cộng hóa trị.", "D. liên kết kim loại."], "answer": "A", "explain": "Phân tử $HF$ phân cực mạnh, tạo liên kết hydrogen $H{-}F{\\cdots}H{-}F$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "$HF$ là", "options": ["A. acid yếu.", "B. acid mạnh.", "C. base yếu.", "D. muối."], "answer": "A", "explain": "$HF$ là acid yếu (phân li không hoàn toàn trong nước).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Muối của natri với chlorine là", "options": ["A. $NaCl$.", "B. $NaBr$.", "C. $NaI$.", "D. $NaF$."], "answer": "A", "explain": "Muối ăn là $NaCl$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Từ $HCl$ đến $HI$, nhiệt độ sôi tăng dần. Nguyên nhân chính là", "options": ["A. tương tác van der Waals tăng và khối lượng phân tử tăng.", "B. liên kết hydrogen tăng dần.", "C. tính acid tăng dần.", "D. độ tan trong nước tăng dần."], "answer": "A", "explain": "Từ $HCl$ đến $HI$ không có liên kết hydrogen; nhiệt độ sôi tăng do tương tác van der Waals và khối lượng phân tử tăng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho $HCl$ đặc tác dụng với $MnO_2$ (đun nóng). Vai trò của $HCl$ là", "options": ["A. chất khử (tạo $Cl_2$).", "B. chất oxi hóa.", "C. chất xúc tác.", "D. môi trường."], "answer": "A", "explain": "$Cl^-$ bị oxi hóa thành $Cl_2$ nên $HCl$ thể hiện tính khử.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sắp xếp các ion theo chiều tăng dần tính khử. Ion dễ bị oxi hóa nhất là", "options": ["A. $F^-$.", "B. $Cl^-$.", "C. $Br^-$.", "D. $I^-$."], "answer": "D", "explain": "Tính khử $F^- \\lt Cl^- \\lt Br^- \\lt I^-$; $I^-$ dễ bị oxi hóa nhất (thành $I_2$).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về nhận biết ion halide:", "statements": ["a) Thuốc thử là dung dịch $AgNO_3$.", "b) $AgCl$ là kết tủa trắng.", "c) $AgBr$ là kết tủa vàng nhạt.", "d) $AgI$ là kết tủa trắng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $AgI$ là kết tủa vàng đậm.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về tính chất của hydrogen halide:", "statements": ["a) $HCl$ khí tan rất nhiều trong nước.", "b) Dung dịch $HCl$ làm đỏ quỳ tím.", "c) $HF$ ăn mòn thủy tinh.", "d) $HI$ là acid yếu."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $HI$ là acid rất mạnh.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hóa học của silver chloride.", "answer": "AgCl", "explain": "$Ag^+$ kết hợp với $Cl^-$ tạo $AgCl$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong dãy $HF, HCl, HBr, HI$, có bao nhiêu chất ở thể khí ở điều kiện thường?", "answer": "3", "explain": "$HCl, HBr, HI$ là chất khí; $HF$ là chất lỏng.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Dung dịch $HCl$ làm giấy quỳ tím chuyển sang màu", "options": ["A. đỏ.", "B. xanh.", "C. vàng.", "D. không đổi màu."], "answer": "A", "explain": "Acid làm quỳ tím chuyển đỏ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi cho $H_2SO_4$ đặc vào $NaBr$ rắn (đun nóng), $Br^-$", "options": ["A. bị oxi hóa thành $Br_2$.", "B. bị khử thành $Br_2$.", "C. không phản ứng.", "D. tạo $HBr$ duy nhất."], "answer": "A", "explain": "Số oxi hóa của Br tăng từ $-1$ lên $0$ nên $Br^-$ bị oxi hóa thành $Br_2$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đơn chất $I_2$ ở điều kiện thường là", "options": ["A. chất rắn màu tím đen.", "B. chất lỏng màu nâu đỏ.", "C. chất khí màu vàng lục.", "D. chất khí không màu."], "answer": "A", "explain": "$I_2$ là chất rắn màu tím đen có ánh kim.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khí $HF$ được điều chế bằng cách", "options": ["A. cho $CaF_2$ tác dụng với $H_2SO_4$ đặc, đun nóng.", "B. cho $NaF$ tác dụng với nước.", "C. điện phân dung dịch $HF$.", "D. đốt cháy $F_2$ trong $H_2$."], "answer": "A", "explain": "$CaF_2(s) + H_2SO_4$ (đặc) $\\xrightarrow{t^o} CaSO_4(s) + 2HF(g)$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho dung dịch $AgNO_3$ vào dung dịch $NaCl$. Phương trình ion thu gọn là", "options": ["A. $Ag^+ + Cl^- \\to AgCl$ (kết tủa trắng).", "B. $Ag^+ + Cl^- \\to AgCl$ (kết tủa vàng).", "C. $Na^+ + NO_3^- \\to NaNO_3$.", "D. không có phản ứng."], "answer": "A", "explain": "Ion $Ag^+$ kết hợp $Cl^-$ tạo kết tủa trắng $AgCl$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Có hỗn hợp $NaCl$ và $NaBr$. Để thu được $Br_2$ từ hỗn hợp, có thể cho hỗn hợp tác dụng với", "options": ["A. $Cl_2$.", "B. $I_2$.", "C. $HCl$ loãng.", "D. $NaF$."], "answer": "A", "explain": "$Cl_2$ mạnh hơn $Br_2$ nên đẩy $Br_2$ ra khỏi $NaBr$: $Cl_2 + 2NaBr \\to 2NaCl + Br_2$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về tính chất vật lí:", "statements": ["a) $HF$ là chất lỏng ở điều kiện thường.", "b) $HCl$ là chất khí ở điều kiện thường.", "c) $HCl$ tan rất nhiều trong nước.", "d) $HF$ không tan trong nước."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $HF$ tan tốt trong nước.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về ứng dụng:", "statements": ["a) $HF$ dùng để khắc chữ lên thủy tinh.", "b) $HCl$ dùng trong công nghiệp tẩy rửa kim loại.", "c) $NaCl$ dùng làm muối ăn và nguyên liệu hóa chất.", "d) $AgBr$ dùng làm muối ăn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: muối ăn là $NaCl$.", "points": 1}, {"type": "short", "level": "VD", "q": "Xác định số oxi hóa của hydrogen trong $HCl$.", "answer": "+1", "explain": "H trong hợp chất với phi kim có số oxi hóa $+1$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong dãy ion $F^-, Cl^-, Br^-, I^-$, có bao nhiêu ion bị $H_2SO_4$ đặc oxi hóa?", "answer": "2", "explain": "$Br^-$ và $I^-$ bị $H_2SO_4$ đặc oxi hóa; $F^-$ và $Cl^-$ không bị oxi hóa.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các hydrogen halide, chất có tính acid mạnh nhất là", "options": ["A. $HF$.", "B. $HCl$.", "C. $HBr$.", "D. $HI$."], "answer": "D", "explain": "Tính acid tăng dần từ $HF$ đến $HI$; $HI$ là acid rất mạnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ion halide có tính khử yếu nhất là", "options": ["A. $F^-$.", "B. $Cl^-$.", "C. $Br^-$.", "D. $I^-$."], "answer": "A", "explain": "Tính khử tăng dần $F^- \\lt Cl^- \\lt Br^- \\lt I^-$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nước Javel chứa muối nào sau đây?", "options": ["A. $NaClO$.", "B. $NaClO_3$.", "C. $CaOCl_2$.", "D. $KClO_3$."], "answer": "A", "explain": "Nước Javel chứa $NaCl$ và $NaClO$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tính acid tăng dần từ $HF$ đến $HI$ vì", "options": ["A. năng lượng liên kết $H{-}X$ giảm dần.", "B. khối lượng phân tử tăng dần.", "C. độ âm điện tăng dần.", "D. nhiệt độ sôi tăng dần."], "answer": "A", "explain": "Năng lượng liên kết $H{-}X$ giảm dần nên H dễ phân li ra $H^+$ hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để khắc chữ, hoa văn lên thủy tinh, người ta dùng", "options": ["A. dung dịch $HF$.", "B. dung dịch $HCl$.", "C. dung dịch $NaCl$.", "D. nước cất."], "answer": "A", "explain": "$HF$ ăn mòn thủy tinh: $SiO_2 + 4HF \\to SiF_4 + 2H_2O$.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho $NaX$ rắn tác dụng với $H_2SO_4$ đặc (đun nóng) chỉ thu được khí $HX$, không thu được $X_2$. X có thể là", "options": ["A. Cl.", "B. Br.", "C. I.", "D. Br hoặc I."], "answer": "A", "explain": "$H_2SO_4$ đặc không oxi hóa được $Cl^-$ (và $F^-$) nên chỉ tạo $HCl$; với $Br^-, I^-$ sẽ tạo $Br_2, I_2$.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu về điều chế $HCl$:", "statements": ["a) Phòng thí nghiệm: $NaCl$ rắn $+ H_2SO_4$ đặc, đun nóng.", "b) Công nghiệp: $H_2 + Cl_2 \\to 2HCl$.", "c) Phòng thí nghiệm: điện phân dung dịch $NaCl$.", "d) Có thể dùng dung dịch $NaCl$ loãng thay $NaCl$ rắn."], "answer": ["T", "T", "F", "F"], "explain": "a), b) Đúng. c) Sai: đó là phương pháp công nghiệp điều chế $Cl_2$. d) Sai: phải dùng $NaCl$ rắn và $H_2SO_4$ đặc.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về tính khử:", "statements": ["a) $F^-$ có tính khử yếu nhất.", "b) $I^-$ có tính khử mạnh nhất.", "c) $H_2SO_4$ đặc oxi hóa được $I^-$ thành $I_2$.", "d) $H_2SO_4$ đặc oxi hóa được $F^-$ thành $F_2$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hóa học của hydrogen bromide.", "answer": "HBr", "explain": "Hydrogen bromide có công thức $HBr$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong phản ứng $SiO_2 + 4HF \\to SiF_4 + 2H_2O$, số oxi hóa của silicon trong $SiF_4$ là bao nhiêu? (Ghi dấu và số)", "answer": "+4", "explain": "F có $-1$ nên Si trong $SiF_4$ có số oxi hóa $+4$.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Khí $HCl$ ở điều kiện thường", "options": ["A. không màu.", "B. màu vàng lục.", "C. màu nâu đỏ.", "D. màu tím."], "answer": "A", "explain": "$HCl$ là chất khí không màu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "So với $Br^-$, tính khử của $Cl^-$", "options": ["A. yếu hơn.", "B. mạnh hơn.", "C. bằng nhau.", "D. không so sánh được."], "answer": "A", "explain": "Tính khử $Cl^- \\lt Br^-$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thuốc thử để nhận biết các ion halide là", "options": ["A. dung dịch $AgNO_3$.", "B. quỳ tím.", "C. dung dịch $BaCl_2$.", "D. dung dịch $NaOH$."], "answer": "A", "explain": "$AgNO_3$ tạo kết tủa có màu khác nhau với $Cl^-, Br^-, I^-$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "So sánh tính acid của $HF$ và $HCl$. Phát biểu đúng là", "options": ["A. $HCl$ là acid mạnh, $HF$ là acid yếu.", "B. $HF$ là acid mạnh, $HCl$ là acid yếu.", "C. cả hai đều là acid yếu.", "D. cả hai đều là acid mạnh."], "answer": "A", "explain": "$HF$ là acid yếu; $HCl$ là acid mạnh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi cho $H_2SO_4$ đặc vào $NaI$ rắn (đun nóng), sản phẩm chứa iodine là", "options": ["A. $I_2$.", "B. $HI$.", "C. $NaI$.", "D. $HIO_3$."], "answer": "A", "explain": "$I^-$ bị oxi hóa mạnh thành $I_2$ (chất rắn màu tím đen).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Dãy nào sau đây sắp xếp đúng theo chiều tăng dần tính acid?", "options": ["A. $HF \\lt HCl \\lt HBr \\lt HI$.", "B. $HCl \\lt HF \\lt HBr \\lt HI$.", "C. $HI \\lt HBr \\lt HCl \\lt HF$.", "D. $HF \\lt HBr \\lt HCl \\lt HI$."], "answer": "A", "explain": "Tính acid tăng dần từ $HF$ (yếu) đến $HI$ (rất mạnh).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) $HCl$ là acid mạnh.", "b) $HBr$ là acid mạnh.", "c) $HI$ là acid mạnh.", "d) $HF$ là acid mạnh."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $HF$ là acid yếu.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về nhận biết ion halide:", "statements": ["a) Dùng dung dịch $AgNO_3$.", "b) $Cl^-$: kết tủa trắng.", "c) $Br^-$: kết tủa vàng nhạt.", "d) $I^-$: kết tủa trắng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $AgI$ là kết tủa vàng đậm.", "points": 1}, {"type": "short", "level": "VD", "q": "Xác định số oxi hóa của natri trong $NaCl$.", "answer": "+1", "explain": "Na là kim loại nhóm IA nên có số oxi hóa $+1$.", "points": 0.5}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Trong dãy HF, HCl, HBr, HI, có bao nhiêu chất tan tốt trong nước tạo thành dung dịch acid mạnh?", "answer": "3", "explain": "HCl, HBr, HI tan tốt tạo acid mạnh; HF tạo acid yếu."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "$HBr$ là", "options": ["A. acid mạnh.", "B. acid yếu.", "C. base mạnh.", "D. muối."], "answer": "A", "explain": "$HBr$ là acid mạnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "$H_2SO_4$ đặc oxi hóa được ion halide nào sau đây?", "options": ["A. $Cl^-$.", "B. $Br^-$.", "C. $F^-$.", "D. Không oxi hóa được ion nào."], "answer": "B", "explain": "$H_2SO_4$ đặc oxi hóa được $Br^-$ (thành $Br_2$) và $I^-$ (thành $I_2$), không oxi hóa được $Cl^-$ và $F^-$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Muối ăn là", "options": ["A. $NaCl$.", "B. $KCl$.", "C. $NaBr$.", "D. $CaCl_2$."], "answer": "A", "explain": "Muối ăn là natri chloride.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phòng thí nghiệm, để điều chế $HCl$ cần dùng", "options": ["A. $NaCl$ rắn và $H_2SO_4$ đặc.", "B. dung dịch $NaCl$ loãng và $H_2SO_4$ loãng.", "C. $Cl_2$ và $H_2O$.", "D. $NaCl$ và $H_2O$."], "answer": "A", "explain": "Phải dùng $NaCl$ rắn với $H_2SO_4$ đặc (đun nóng) mới thu được khí $HCl$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân biệt $Cl^-, Br^-, I^-$ bằng dung dịch $AgNO_3$ dựa vào", "options": ["A. màu sắc của kết tủa.", "B. mùi của kết tủa.", "C. khối lượng kết tủa.", "D. độ tan của kết tủa trong nước."], "answer": "A", "explain": "$AgCl$ trắng, $AgBr$ vàng nhạt, $AgI$ vàng đậm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho phản ứng: $X_2 + 2NaY \\to 2NaX + Y_2$ (X, Y là các halogen). Nếu Y là bromine thì X không thể là", "options": ["A. $F_2$.", "B. $Cl_2$.", "C. $Br_2$.", "D. $I_2$."], "answer": "D", "explain": "Halogen mạnh đẩy halogen yếu: X phải mạnh hơn Br ($F_2$ hoặc $Cl_2$); $I_2$ yếu hơn $Br_2$ nên không đẩy được.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các phát biểu ôn tập:", "statements": ["a) Tính acid: $HF \\lt HCl \\lt HBr \\lt HI$.", "b) Tính khử: $F^- \\lt Cl^- \\lt Br^- \\lt I^-$.", "c) $AgCl$ trắng, $AgBr$ vàng nhạt, $AgI$ vàng đậm.", "d) $HF$ có nhiệt độ sôi thấp nhất dãy."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: $HF$ có nhiệt độ sôi cao bất thường (cao nhất).", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về $H_2SO_4$ đặc với muối halide:", "statements": ["a) Với $NaCl$: chỉ tạo $HCl$.", "b) Với $NaBr$: tạo $Br_2$ và $SO_2$.", "c) Với $NaI$: tạo $I_2$ và $H_2S$.", "d) Với $NaF$: tạo $F_2$."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: với $NaF$ chỉ tạo $HF$.", "points": 1}, {"type": "short", "level": "VD", "q": "Viết công thức hóa học của hydrogen iodide.", "answer": "HI", "explain": "Hydrogen iodide có công thức $HI$.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Trong dãy ion $F^-, Cl^-, Br^-, I^-$, có bao nhiêu ion tạo kết tủa màu vàng (nhạt hoặc đậm) với dung dịch $AgNO_3$?", "answer": "2", "explain": "$Br^-$ tạo $AgBr$ vàng nhạt, $I^-$ tạo $AgI$ vàng đậm.", "points": 0.5}]}]}</script>
