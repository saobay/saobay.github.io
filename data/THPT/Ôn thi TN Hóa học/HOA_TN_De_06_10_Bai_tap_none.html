<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Phản ứng giữa este và dung dịch NaOH (đun nóng) được gọi là phản ứng", "options": ["A. xà phòng hóa.", "B. este hóa.", "C. thủy phân trong môi trường acid.", "D. trùng ngưng."], "answer": "A", "explain": "RCOOR' + NaOH → RCOONa + R'OH là phản ứng xà phòng hóa (trường hợp tổng quát của thủy phân este trong môi trường kiềm).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Acid béo là", "options": ["A. acid vô cơ có tính oxi hóa mạnh.", "B. acid carboxylic đơn chức, mạch dài (thường có 12-24 nguyên tử carbon).", "C. acid dicarboxylic mạch ngắn.", "D. amino acid có nhiều nhóm -COOH."], "answer": "B", "explain": "Acid béo là các acid carboxylic đơn chức, mạch hydrocarbon dài không phân nhánh, ví dụ: stearic acid (C17H35COOH), oleic acid (C17H33COOH).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Fructose là", "options": ["A. một polysaccharide.", "B. một disaccharide.", "C. đồng phân của glucose (cùng công thức C6H12O6).", "D. sản phẩm thủy phân của tinh bột duy nhất."], "answer": "C", "explain": "Fructose và glucose đều có công thức C6H12O6 nhưng cấu tạo khác nhau (fructose có nhóm ketone, glucose có nhóm aldehyde).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chất có tính base mạnh nhất trong các chất sau là", "options": ["A. C6H5NH2.", "B. NH3.", "C. CH3NH2.", "D. (CH3)2NH."], "answer": "D", "explain": "Gốc alkyl đẩy electron làm tăng tính base; amine bậc hai có tính base mạnh hơn amine bậc một: (CH3)2NH $\\gt$ CH3NH2 $\\gt$ NH3 $\\gt$ C6H5NH2.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Poly(vinyl chloride) (PVC) được điều chế bằng phản ứng trùng hợp monomer nào sau đây?", "options": ["A. CH2=CHCl.", "B. CH2=CH2.", "C. CH2=C(CH3)COOCH3.", "D. C6H5CH=CH2."], "answer": "A", "explain": "nCH2=CHCl → (-CH2-CHCl-)n (PVC). Monomer vinyl chloride.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong pin điện hóa, điện cực xảy ra quá trình oxi hóa được gọi là", "options": ["A. cathode.", "B. anode.", "C. cầu muối.", "D. điện cực dương."], "answer": "B", "explain": "Anode là nơi xảy ra quá trình oxi hóa (trong pin điện hóa, anode là cực âm). Cathode là nơi xảy ra quá trình khử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kim loại có nhiệt độ nóng chảy cao nhất là", "options": ["A. Fe.", "B. Cu.", "C. W.", "D. Cr."], "answer": "C", "explain": "Tungsten (W) có nhiệt độ nóng chảy khoảng 3422°C, cao nhất trong các kim loại; dùng làm dây tóc bóng đèn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Soda (soda ash) có công thức hóa học là", "options": ["A. NaHCO3.", "B. NaOH.", "C. Na2SO4.", "D. Na2CO3."], "answer": "D", "explain": "Soda là Na2CO3, dùng trong công nghiệp thủy tinh, xà phòng. NaHCO3 là baking soda; NaOH là xút ăn da.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Xà phòng hóa hoàn toàn 1 mol triolein bằng dung dịch NaOH dư. Số mol NaOH đã phản ứng là", "options": ["A. 1 mol.", "B. 3 mol.", "C. 2 mol.", "D. 4 mol."], "answer": "B", "explain": "Triolein là trieste: (C17H33COO)3C3H5 + 3NaOH → 3C17H33COONa + C3H5(OH)3. Tỉ lệ mol 1 : 3.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thuốc thử nào sau đây không phân biệt được hai dung dịch glucose và fructose?", "options": ["A. Cu(OH)2 ở nhiệt độ thường.", "B. Dung dịch AgNO3 trong NH3, đun nóng.", "C. Nước bromine.", "D. Dung dịch I2."], "answer": "B", "explain": "Cả glucose và fructose đều hòa tan Cu(OH)2 (xanh lam), đều tráng bạc (fructose chuyển hóa trong môi trường kiềm), đều làm mất màu nước bromine. Dung dịch I2 không tác dụng với cả hai nên cũng không phân biệt được... Tuy nhiên trong các đáp án, AgNO3/NH3 là thuốc thử mà cả hai đều cho phản ứng tráng bạc nên không phân biệt được.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho aniline tác dụng với nước bromine dư. Sản phẩm hữu cơ thu được là", "options": ["A. 2-bromoaniline.", "B. 4-bromoaniline.", "C. 2,4,6-tribromoaniline (kết tủa trắng).", "D. 3,5-dibromoaniline."], "answer": "C", "explain": "Nhóm -NH2 hoạt hóa mạnh vòng benzene, phản ứng thế xảy ra ở cả 3 vị trí ortho và para: C6H5NH2 + 3Br2 → C6H2Br3NH2 (kết tủa trắng) + 3HBr. Đây là phản ứng nhận biết aniline.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điện phân dung dịch KBr bằng điện cực trơ. Sản phẩm thu được ở anode là", "options": ["A. K.", "B. H2.", "C. O2.", "D. Br2."], "answer": "D", "explain": "Ở anode xảy ra quá trình oxi hóa: 2Br- → Br2 + 2e (Br- bị oxi hóa dễ hơn H2O). Ở cathode: 2H2O + 2e → H2 + 2OH- (K+ không bị khử).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kim loại nào sau đây tác dụng được với nước ở nhiệt độ thường?", "options": ["A. Na.", "B. Mg.", "C. Al.", "D. Fe."], "answer": "A", "explain": "Các kim loại kiềm (Na, K...) tác dụng mãnh liệt với nước ở nhiệt độ thường. Mg tác dụng chậm với nước nóng; Al, Fe không tác dụng với nước ở nhiệt độ thường (có màng oxit bảo vệ).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sục khí CO2 từ từ đến dư vào dung dịch nước vôi trong. Hiện tượng quan sát được là", "options": ["A. xuất hiện kết tủa trắng rồi tan dần.", "B. không có hiện tượng gì.", "C. xuất hiện kết tủa trắng không tan.", "D. dung dịch chuyển sang màu vàng."], "answer": "A", "explain": "Ban đầu: Ca(OH)2 + CO2 → CaCO3 (kết tủa trắng) + H2O. CO2 dư: CaCO3 + CO2 + H2O → Ca(HCO3)2 (tan) nên kết tủa tan dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong phản ứng nhiệt nhôm: 2Al + Fe2O3 → 2Fe + Al2O3, chất khử là", "options": ["A. Fe2O3.", "B. Fe.", "C. Al.", "D. Al2O3."], "answer": "C", "explain": "Al nhường electron (số oxi hóa tăng từ 0 lên +3) nên Al là chất khử; Fe2O3 nhận electron nên là chất oxi hóa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Este X (no, đơn chức, mạch hở, M = 88) tác dụng với dung dịch NaOH thu được muối của acid Z và alcohol Y. Oxi hóa Y (xúc tác men giấm) thu được Z. Công thức cấu tạo của X là", "options": ["A. HCOOCH2CH2CH3.", "B. CH3CH2COOCH3.", "C. HCOOCH(CH3)2.", "D. CH3COOC2H5."], "answer": "D", "explain": "Y oxi hóa thành Z → Y và Z có cùng số nguyên tử carbon, Z là acid no đơn chức. X có M = 88 (C4H8O2). Chỉ có CH3COOC2H5 thủy phân cho CH3COOH (Z) và C2H5OH (Y), mà C2H5OH oxi hóa thành CH3COOH. Các đồng phân khác cho Y, Z có số C khác nhau.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đốt cháy hoàn toàn 0,1 mol một este no, đơn chức, mạch hở thu được 8,8 gam CO2. Công thức phân tử của este là", "options": ["A. C3H6O2.", "B. C2H4O2.", "C. C4H8O2.", "D. CH2O2."], "answer": "B", "explain": "n(CO2) = 8,8/44 = 0,2 mol. Este CnH2nO2: nCO2 = n·nX → 0,2 = n × 0,1 → n = 2. Vậy este là C2H4O2 (metyl fomat).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Đốt cháy hoàn toàn 4,4 gam một este no, đơn chức, mạch hở X thu được 4,48 lít CO2 (đktc) và 3,6 gam H2O. Số đồng phân cấu tạo là este của X là", "options": ["A. 2.", "B. 3.", "C. 4.", "D. 6."], "answer": "C", "explain": "n(CO2) = 0,2 mol; n(H2O) = 0,2 mol → este no đơn chức. M(X) = 4,4·n/0,2 = 22n = 14n + 32 → n = 4 → X là C4H8O2, có 4 đồng phân este: HCOOC3H7 (2), CH3COOC2H5, C2H5COOCH3.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Có ba dung dịch mất nhãn: methylamine, aniline, glycine. Dùng quỳ tím và dung dịch HCl để nhận biết.", "statements": ["a) Dung dịch methylamine làm quỳ tím chuyển sang màu xanh.", "b) Dung dịch aniline không làm đổi màu quỳ tím.", "c) Dung dịch glycine làm quỳ tím chuyển sang màu đỏ.", "d) Cả ba dung dịch đều tác dụng được với dung dịch HCl."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: methylamine là base. b) Đúng: aniline có tính base quá yếu. c) Sai: glycine gần như trung tính, không đổi màu quỳ. d) Đúng: nhóm -NH2 trong cả ba chất đều tác dụng với HCl.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Điện phân dung dịch CuSO4 với anode bằng đồng (luyện đồng).", "statements": ["a) Ở cathode, ion Cu2+ bị khử tạo thành Cu bám vào điện cực.", "b) Ở anode, kim loại Cu bị oxi hóa thành Cu2+ tan vào dung dịch.", "c) Nồng độ dung dịch CuSO4 hầu như không đổi trong quá trình điện phân.", "d) Trong quá trình điện phân, khối lượng cathode giảm dần."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Cu2+ + 2e → Cu. b) Đúng: Cu → Cu2+ + 2e (anode tan). c) Đúng: lượng Cu2+ mất ở cathode được bù ở anode. d) Sai: cathode được bồi đắp thêm Cu nên khối lượng tăng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một số polymer thường gặp.", "statements": ["a) PVC được điều chế bằng phản ứng trùng hợp vinyl chloride.", "b) Tơ nylon-6,6 được điều chế bằng phản ứng trùng ngưng.", "c) Cao su buna-S là copolymer của butadiene và styrene.", "d) Mọi polymer đều được điều chế bằng phản ứng trùng hợp."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: từ hexamethylenediamine và adipic acid. c) Đúng: buna-S là sản phẩm đồng trùng hợp butadiene và styrene. d) Sai: còn có polymer điều chế bằng trùng ngưng (nylon-6,6, PET...) và polymer thiên nhiên.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các kim loại nhóm IA.", "statements": ["a) Na và K đều tác dụng mãnh liệt với nước ở nhiệt độ thường.", "b) Lithium là kim loại nhẹ nhất trong tất cả các kim loại.", "c) Các kim loại nhóm IA đều có 1 electron ở lớp ngoài cùng.", "d) K2CO3 là chất rắn ít tan trong nước."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 2M + 2H2O → 2MOH + H2. b) Đúng: Li có khối lượng riêng nhỏ nhất. c) Đúng: cấu hình electron lớp ngoài cùng ns1. d) Sai: K2CO3 tan rất tốt trong nước (khác với Na2CO3... thực tế cả hai đều tan tốt).", "points": 1}, {"type": "short", "level": "VD", "q": "Xà phòng hóa hoàn toàn 16,12 gam tripalmitin ((C15H31COO)3C3H5) bằng dung dịch NaOH vừa đủ. Khối lượng NaOH đã phản ứng là bao nhiêu gam?", "answer": "2.4", "explain": "M(tripalmitin) = 806 g/mol → n = 16,12/806 = 0,02 mol. (C15H31COO)3C3H5 + 3NaOH → 3C15H31COONa + C3H5(OH)3. n(NaOH) = 0,06 mol → m = 0,06 × 40 = 2,4 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho 10,8 gam glucose tác dụng với dung dịch AgNO3 trong NH3 dư, đun nóng (phản ứng xảy ra hoàn toàn). Khối lượng Ag thu được là bao nhiêu gam?", "answer": "12.96", "explain": "n(glucose) = 10,8/180 = 0,06 mol → n(Ag) = 0,12 mol → m = 0,12 × 108 = 12,96 gam.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Cho 9,3 gam aniline tác dụng với dung dịch Br2 dư. Khối lượng kết tủa 2,4,6-tribromoaniline thu được là bao nhiêu gam?", "answer": "33", "explain": "n(aniline) = 9,3/93 = 0,1 mol. C6H5NH2 + 3Br2 → C6H2Br3NH2 + 3HBr. n(kết tủa) = 0,1 mol → m = 0,1 × 330 = 33 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Điện phân dung dịch AgNO3 bằng điện cực trơ với cường độ dòng điện 1 A trong 9650 giây. Khối lượng Ag bám vào cathode là bao nhiêu gam? (F = 96500)", "answer": "10.8", "explain": "Ag+ + 1e → Ag. m = A·I·t/(n·F) = 108 × 1 × 9650/(1 × 96500) = 10,8 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Hòa tan hoàn toàn 4,6 gam Na vào nước dư. Khối lượng NaOH thu được là bao nhiêu gam?", "answer": "8", "explain": "n(Na) = 4,6/23 = 0,2 mol. 2Na + 2H2O → 2NaOH + H2. n(NaOH) = 0,2 mol → m = 0,2 × 40 = 8 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Đun nóng 5,6 gam bột Fe với bột S dư (không có không khí). Khối lượng FeS thu được là bao nhiêu gam?", "answer": "8.8", "explain": "n(Fe) = 5,6/56 = 0,1 mol. Fe + S → FeS. n(FeS) = 0,1 mol → m = 0,1 × 88 = 8,8 gam.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "So với carboxylic acid và alcohol có cùng số nguyên tử carbon, este thường có nhiệt độ sôi", "options": ["A. cao hơn vì khối lượng phân tử lớn hơn.", "B. thấp hơn vì không tạo được liên kết hydrogen liên phân tử.", "C. cao hơn vì có liên kết hydrogen bền.", "D. bằng nhau."], "answer": "B", "explain": "Phân tử este không có nhóm -OH nên không tạo liên kết hydrogen liên phân tử như acid và alcohol → nhiệt độ sôi thấp hơn hẳn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng khi so sánh dầu ăn và mỡ động vật?", "options": ["A. Dầu ăn chứa chủ yếu các gốc acid béo không no, mỡ động vật chứa chủ yếu các gốc acid béo no.", "B. Dầu ăn là chất rắn, mỡ động vật là chất lỏng ở nhiệt độ thường.", "C. Cả hai đều tan tốt trong nước.", "D. Cả hai đều là carbohydrate."], "answer": "A", "explain": "Dầu thực vật (lỏng) chứa nhiều gốc acid béo không no; mỡ động vật (rắn) chứa nhiều gốc acid béo no. Cả hai đều là chất béo, không tan trong nước.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng về saccharose?", "options": ["A. Có phản ứng tráng bạc.", "B. Là một monosaccharide.", "C. Không có tính khử, không làm mất màu nước bromine.", "D. Thủy phân chỉ thu được glucose."], "answer": "C", "explain": "Saccharose không còn nhóm -CHO tự do (liên kết glycoside giữa C1 của glucose và C2 của fructose) nên không có tính khử. Thủy phân cho glucose + fructose.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cho etylamine tác dụng với dung dịch HNO3 loãng. Sản phẩm muối thu được là", "options": ["A. C2H5NO3.", "B. NH4NO3.", "C. C2H5NH2.H2O.", "D. C2H5NH3NO3."], "answer": "D", "explain": "C2H5NH2 + HNO3 → C2H5NH3NO3 (etylammonium nitrate). Amine tác dụng với acid tạo muối alkylammonium.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để phát hiện protein trong dung dịch, có thể dùng thuốc thử", "options": ["A. dung dịch I2.", "B. quỳ tím.", "C. dung dịch AgNO3 trong NH3.", "D. Cu(OH)2 trong môi trường kiềm (phản ứng màu biuret)."], "answer": "D", "explain": "Protein (có từ 2 liên kết peptide trở lên) tác dụng với Cu(OH)2 trong môi trường kiềm cho màu tím đặc trưng (phản ứng màu biuret).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tơ axetat thuộc loại tơ", "options": ["A. tơ thiên nhiên.", "B. tơ bán tổng hợp (tơ nhân tạo).", "C. tơ tổng hợp.", "D. tơ vô cơ."], "answer": "B", "explain": "Tơ axetat chế từ cellulose (thiên nhiên) bằng phương pháp hóa học nên là tơ bán tổng hợp (tơ nhân tạo).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho E°(Fe2+/Fe) = -0,44 V; E°(Cu2+/Cu) = +0,34 V. Sức điện động chuẩn của pin Fe-Cu là", "options": ["A. 0,78 V.", "B. -0,78 V.", "C. 0,10 V.", "D. 1,22 V."], "answer": "A", "explain": "E°pin = E°cathode - E°anode = 0,34 - (-0,44) = 0,78 V. (Fe là cực âm, Cu là cực dương.)", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điện phân nóng chảy Al2O3 (có cryolite) với dòng điện 8 A trong 9650 giây, hiệu suất 100%. Khối lượng Al thu được là", "options": ["A. 5,4 gam.", "B. 10,8 gam.", "C. 7,2 gam.", "D. 14,4 gam."], "answer": "C", "explain": "m = A·I·t/(n·F) = 27 × 8 × 9650/(3 × 96500) = 7,2 gam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biện pháp nào sau đây chống ăn mòn kim loại bằng phương pháp bảo vệ bề mặt?", "options": ["A. Nối kim loại với một kim loại hoạt động hơn.", "B. Dùng hợp kim chống gỉ.", "C. Thay đổi thành phần môi trường.", "D. Sơn, mạ, bôi dầu mỡ lên bề mặt kim loại."], "answer": "D", "explain": "Sơn, mạ, bôi dầu mỡ tạo lớp cách li kim loại với môi trường (bảo vệ bề mặt). Nối với kim loại hoạt động hơn là phương pháp điện hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong công nghiệp, NaOH được sản xuất bằng cách", "options": ["A. cho Na tác dụng với nước.", "B. nhiệt phân NaHCO3.", "C. điện phân dung dịch NaCl bão hòa có màng ngăn.", "D. cho Na2O tác dụng với nước."], "answer": "C", "explain": "Điện phân dung dịch NaCl bão hòa có màng ngăn (công nghiệp chlorine-kiềm): 2NaCl + 2H2O → 2NaOH + H2 + Cl2.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nước cứng vĩnh cửu chứa các ion", "options": ["A. Ca2+, Mg2+, HCO3-.", "B. Ca2+, Mg2+, Cl-, SO42-.", "C. Na+, K+, Cl-.", "D. Ca2+, Mg2+, CO32-."], "answer": "B", "explain": "Nước cứng vĩnh cửu chứa Ca2+, Mg2+ cùng các anion Cl-, SO42- (không bị loại khi đun sôi). Nước cứng tạm thời chứa HCO3-.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho từ từ dung dịch NaOH đến dư vào dung dịch AlCl3. Hiện tượng quan sát được là", "options": ["A. xuất hiện kết tủa trắng rồi tan dần đến hết.", "B. xuất hiện kết tủa trắng không tan.", "C. không có hiện tượng gì.", "D. xuất hiện kết tủa xanh."], "answer": "A", "explain": "Ban đầu: Al3+ + 3OH- → Al(OH)3 (kết tủa trắng). NaOH dư: Al(OH)3 + OH- → AlO2- + 2H2O (kết tủa tan).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho dung dịch FeSO4 tác dụng với dung dịch NaOH trong không khí. Hiện tượng quan sát được là", "options": ["A. xuất hiện kết tủa trắng không đổi.", "B. xuất hiện kết tủa nâu đỏ ngay.", "C. xuất hiện kết tủa trắng xanh rồi chuyển dần sang nâu đỏ.", "D. xuất hiện kết tủa đen."], "answer": "C", "explain": "Fe2+ + 2OH- → Fe(OH)2 (trắng xanh); Fe(OH)2 bị O2 trong không khí oxi hóa thành Fe(OH)3 (nâu đỏ).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thuốc thử dùng để nhận biết ion Cl- trong dung dịch là", "options": ["A. dung dịch NaOH.", "B. dung dịch BaCl2.", "C. dung dịch H2SO4.", "D. dung dịch AgNO3."], "answer": "D", "explain": "Ag+ + Cl- → AgCl (kết tủa trắng). BaCl2 dùng nhận biết SO42-; NaOH không tạo kết tủa đặc trưng với Cl-.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Xà phòng hóa hoàn toàn 4,4 gam một este no, đơn chức, mạch hở X bằng dung dịch NaOH vừa đủ, thu được 4,8 gam muối khan. Công thức cấu tạo của X là", "options": ["A. HCOOCH2CH2CH3.", "B. CH3CH2COOCH3.", "C. CH3COOCH2CH3.", "D. HCOOCH(CH3)2."], "answer": "B", "explain": "m(muối) lớn hơn m(este) → este metyl (RCOOCH3): m(muối) - m(este) = n×(23-15) = 8n → n = 0,4/8 = 0,05 mol → M(X) = 4,4/0,05 = 88 (C4H8O2). Trong các đáp án, chỉ CH3CH2COOCH3 là este metyl có M = 88.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 14,7 gam glutamic acid (HOOCCH2CH2CH(NH2)COOH) tác dụng tối đa với dung dịch NaOH. Khối lượng muối thu được là", "options": ["A. 19,1 gam.", "B. 16,9 gam.", "C. 21,3 gam.", "D. 14,7 gam."], "answer": "A", "explain": "n(glutamic acid) = 14,7/147 = 0,1 mol. Mỗi phân tử có 2 nhóm -COOH → n(NaOH) = 0,2 mol. m(muối) = 14,7 + 0,2×(23-1) = 14,7 + 4,4 = 19,1 gam.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Thủy phân hoàn toàn 0,1 mol tripeptide Gly-Ala-Gly (mạch hở) trong môi trường acid. Khối lượng các amino acid thu được là", "options": ["A. 20,3 gam.", "B. 21,5 gam.", "C. 23,9 gam.", "D. 22,1 gam."], "answer": "C", "explain": "Gly-Ala-Gly + 2H2O → 2Gly + Ala. m = m(peptide) + m(H2O) = 0,1×203 + 0,2×18 = 20,3 + 3,6 = 23,9 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hòa tan hoàn toàn 12,9 gam hỗn hợp gồm Al và Mg bằng dung dịch HCl dư, thu được 14,56 lít khí H2 (đktc). Phần trăm khối lượng của Al trong hỗn hợp là", "options": ["A. 41,86%.", "B. 62,79%.", "C. 37,21%.", "D. 20,93%."], "answer": "B", "explain": "Gọi nAl = x, nMg = y. Ta có: 27x + 24y = 12,9 và 1,5x + y = 14,56/22,4 = 0,65. Giải hệ: x = 0,3; y = 0,2. %Al = 0,3×27/12,9 × 100% = 62,79%.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Nhỏ vài giọt mỗi dung dịch NH3, CH3NH2, C6H5NH2 lên các mẩu giấy quỳ tím ẩm.", "statements": ["a) Giấy quỳ ở dung dịch NH3 và dung dịch CH3NH2 chuyển sang màu xanh.", "b) Giấy quỳ ở dung dịch C6H5NH2 không đổi màu.", "c) CH3NH2 có tính base mạnh hơn NH3.", "d) Có thể dùng dung dịch HCl để phân biệt aniline với hai chất còn lại."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: cả hai đều là base. b) Đúng: aniline có tính base quá yếu. c) Đúng: gốc CH3 đẩy electron. d) Sai: cả ba chất đều tác dụng với HCl tạo muối tan nên không phân biệt được.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét pin điện hóa Mg-Ag. Biết E°(Mg2+/Mg) = -2,37 V; E°(Ag+/Ag) = +0,80 V.", "statements": ["a) Sức điện động chuẩn của pin là 3,17 V.", "b) Điện cực Mg đóng vai trò cực âm.", "c) Ở cathode xảy ra quá trình khử ion Ag+ thành Ag.", "d) Sức điện động của pin giữ nguyên không đổi trong suốt quá trình hoạt động."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: E°pin = 0,80 - (-2,37) = 3,17 V. b) Đúng: Mg có tính khử mạnh hơn. c) Đúng: Ag+ + 1e → Ag ở cực dương. d) Sai: nồng độ các ion thay đổi nên E pin giảm dần theo thời gian.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "So sánh tinh bột và cellulose.", "statements": ["a) Tinh bột và cellulose đều là polysaccharide.", "b) Cả hai đều cho được phản ứng tráng bạc.", "c) Thủy phân hoàn toàn cả hai trong môi trường acid đều thu được glucose.", "d) Cellulose tan tốt trong nước nóng."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: cả hai đều không có tính khử. c) Đúng: tinh bột cho α-glucose, cellulose cho β-glucose (đều là glucose). d) Sai: cellulose không tan trong nước.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các hợp chất của sắt.", "statements": ["a) Ion Fe2+ vừa có tính oxi hóa, vừa có tính khử.", "b) Ion Fe3+ chỉ có tính oxi hóa.", "c) Fe tác dụng với dung dịch Fe2(SO4)3 tạo thành FeSO4.", "d) Fe3O4 tác dụng với dung dịch HNO3 đặc, nóng tạo thành Fe(NO3)2."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Fe2+ có thể bị khử thành Fe hoặc bị oxi hóa thành Fe3+. b) Đúng: Fe3+ ở số oxi hóa cao nhất. c) Đúng: Fe + 2Fe3+ → 3Fe2+. d) Sai: HNO3 oxi hóa Fe3O4 thành Fe(NO3)3 (không tạo Fe(NO3)2).", "points": 1}, {"type": "short", "level": "VD", "q": "Đun nóng 6,0 gam acetic acid với ethanol dư (xúc tác H2SO4 đặc), hiệu suất phản ứng este hóa đạt 60%. Khối lượng etyl axetat thu được là bao nhiêu gam?", "answer": "5.28", "explain": "n(CH3COOH) = 6/60 = 0,1 mol. CH3COOH + C2H5OH ⇌ CH3COOC2H5 + H2O. n(este thực tế) = 0,1 × 0,6 = 0,06 mol → m = 0,06 × 88 = 5,28 gam.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Thủy phân 32,4 gam tinh bột với hiệu suất 75%. Khối lượng glucose thu được là bao nhiêu gam?", "answer": "27", "explain": "n(mắt xích C6H10O5) = 32,4/162 = 0,2 mol. (C6H10O5)n + nH2O → nC6H12O6. n(glucose lý thuyết) = 0,2 mol; thực tế = 0,2 × 0,75 = 0,15 mol → m = 0,15 × 180 = 27 gam.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Cho 0,1 mol đipeptide Gly-Gly (mạch hở) tác dụng với dung dịch HCl dư, đun nóng. Khối lượng muối thu được là bao nhiêu gam?", "answer": "22.3", "explain": "Gly-Gly + 2HCl + H2O → 2NH2CH2COOH·HCl (muối). n(muối Gly·HCl) = 0,2 mol; M = 111,5 → m = 0,2 × 111,5 = 22,3 gam.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Điện phân dung dịch CuSO4 bằng điện cực trơ với cường độ dòng điện 3 A trong 9650 giây. Khối lượng Cu bám vào cathode là bao nhiêu gam? (F = 96500)", "answer": "9.6", "explain": "m = A·I·t/(n·F) = 64 × 3 × 9650/(2 × 96500) = 9,6 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Trung hòa hoàn toàn 4,9 gam H2SO4 bằng dung dịch NaOH vừa đủ. Khối lượng NaOH đã dùng là bao nhiêu gam?", "answer": "4", "explain": "n(H2SO4) = 4,9/98 = 0,05 mol. H2SO4 + 2NaOH → Na2SO4 + 2H2O. n(NaOH) = 0,1 mol → m = 0,1 × 40 = 4 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Khử hoàn toàn 16,0 gam CuO bằng khí H2 dư, đun nóng. Khối lượng Cu thu được là bao nhiêu gam?", "answer": "12.8", "explain": "n(CuO) = 16/80 = 0,2 mol. CuO + H2 → Cu + H2O. n(Cu) = 0,2 mol → m = 0,2 × 64 = 12,8 gam.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Chất nào sau đây không tác dụng với Na ở điều kiện thường?", "options": ["A. CH3COOC2H5.", "B. CH3COOH.", "C. C2H5OH.", "D. C6H5OH."], "answer": "A", "explain": "Este không có hydrogen linh động nên không tác dụng với Na. Acid, alcohol, phenol đều có nhóm -OH (hoặc -COOH) tác dụng với Na giải phóng H2.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sản phẩm của quá trình lên men rượu glucose là", "options": ["A. acetic acid và nước.", "B. rượu etylic và khí carbon dioxide.", "C. lactic acid.", "D. glucose và fructose."], "answer": "B", "explain": "C6H12O6 → 2C2H5OH + 2CO2 (xúc tác enzyme zymase). Đây là cơ sở của công nghiệp sản xuất rượu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Số nhóm chức -NH2 và -COOH trong phân tử lysine lần lượt là", "options": ["A. 1 và 1.", "B. 1 và 2.", "C. 2 và 1.", "D. 2 và 2."], "answer": "C", "explain": "Lysine: H2N[CH2]4CH(NH2)COOH có 2 nhóm -NH2 và 1 nhóm -COOH. Vì vậy lysine tác dụng với HCl theo tỉ lệ 1:2.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cấu trúc bậc một của protein là", "options": ["A. hình dạng xoắn của chuỗi polypeptide.", "B. cách cuộn xếp toàn bộ chuỗi polypeptide.", "C. số chuỗi polypeptide trong phân tử.", "D. trình tự sắp xếp các gốc amino acid trong chuỗi polypeptide."], "answer": "D", "explain": "Cấu trúc bậc một là trình tự các amino acid trong chuỗi polypeptide, quyết định tính chất và chức năng của protein.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Monomer dùng để điều chế tơ capron (nylon-6) là", "options": ["A. hexamethylenediamine.", "B. adipic acid.", "C. ethylene glycol.", "D. caprolactam."], "answer": "D", "explain": "Caprolactam trùng hợp mở vòng tạo tơ capron (nylon-6). Hexamethylenediamine + adipic acid cho nylon-6,6.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong quá trình ăn mòn điện hóa, điện cực bị ăn mòn là", "options": ["A. cực âm (anode), kim loại có tính khử mạnh hơn.", "B. cực dương (cathode), kim loại có tính khử mạnh hơn.", "C. cực âm (anode), kim loại có tính khử yếu hơn.", "D. cả hai điện cực."], "answer": "A", "explain": "Ở cực âm (anode) xảy ra quá trình oxi hóa M → Mn+ + ne, kim loại có tính khử mạnh hơn bị ăn mòn. Cực dương được bảo vệ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điện phân dung dịch MgCl2 bằng điện cực trơ. Sản phẩm thu được ở cathode là", "options": ["A. Mg.", "B. H2.", "C. Cl2.", "D. O2."], "answer": "B", "explain": "Mg2+ không bị khử trong dung dịch (thế điện cực rất âm) nên ở cathode: 2H2O + 2e → H2 + 2OH-. Ở anode: 2Cl- → Cl2 + 2e.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kim loại nào sau đây không khử được ion H+ trong dung dịch HCl loãng?", "options": ["A. Zn.", "B. Fe.", "C. Cu.", "D. Mg."], "answer": "C", "explain": "Cu đứng sau H trong dãy điện hóa nên không tác dụng với HCl loãng. Zn, Fe, Mg đứng trước H nên khử được H+ thành H2.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho Na2O tác dụng với nước. Sản phẩm thu được là", "options": ["A. Na và O2.", "B. Na2O2.", "C. H2.", "D. NaOH."], "answer": "D", "explain": "Na2O + H2O → 2NaOH. Đây là phản ứng của oxit base với nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây đúng về Mg(OH)2?", "options": ["A. Là base yếu, ít tan trong nước.", "B. Là base mạnh, tan tốt trong nước.", "C. Là một acid yếu.", "D. Là muối trung hòa."], "answer": "A", "explain": "Mg(OH)2 là base yếu, ít tan (kết tủa trắng), dùng làm thuốc chống acid dạ dày. Khác với NaOH, KOH là base mạnh tan tốt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quặng boxit có thành phần chính là", "options": ["A. Fe2O3.", "B. Al2O3.2H2O.", "C. CaCO3.", "D. NaCl."], "answer": "B", "explain": "Boxit (Al2O3.2H2O) là nguyên liệu chính để sản xuất nhôm trong công nghiệp bằng phương pháp điện phân nóng chảy.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để luyện thép từ gang, người ta", "options": ["A. thêm carbon vào gang.", "B. điện phân gang nóng chảy.", "C. oxi hóa bớt carbon và các tạp chất trong gang.", "D. hòa tan gang trong acid."], "answer": "C", "explain": "Luyện thép là quá trình oxi hóa bớt C (từ 2-5% xuống dưới 2%), Si, Mn, S, P trong gang bằng O2 hoặc oxit sắt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thuốc thử dùng để nhận biết ion Fe3+ trong dung dịch là", "options": ["A. dung dịch NaOH.", "B. dung dịch KSCN.", "C. dung dịch HCl.", "D. dung dịch AgNO3."], "answer": "B", "explain": "Fe3+ + SCN- → [Fe(SCN)]2+ (màu đỏ máu đặc trưng). Đây là phản ứng đặc trưng nhận biết Fe3+.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đốt cháy hoàn toàn 6,0 gam một este no, đơn chức, mạch hở X thu được 4,48 lít CO2 (đktc) và 3,6 gam H2O. Công thức phân tử của X là", "options": ["A. C2H4O2.", "B. C3H6O2.", "C. C4H8O2.", "D. C5H10O2."], "answer": "A", "explain": "n(CO2) = 0,2 mol; n(H2O) = 0,2 mol → X no, đơn chức. M(X) = 6×n/0,2 = 30n = 14n + 32 → 16n = 32 → n = 2 → X là C2H4O2.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 0,2 mol một amino acid X (chứa 1 nhóm -NH2 và 2 nhóm -COOH) tác dụng tối đa với dung dịch HCl 1 M. Thể tích dung dịch HCl đã dùng là", "options": ["A. 100 mL.", "B. 200 mL.", "C. 400 mL.", "D. 300 mL."], "answer": "B", "explain": "Chỉ nhóm -NH2 tác dụng với HCl (tỉ lệ 1:1). n(HCl) = n(X) = 0,2 mol → V = 0,2/1 = 0,2 L = 200 mL.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Điện phân nóng chảy Al2O3 với cường độ dòng điện 10 A để thu được 5,4 gam Al (hiệu suất 100%). Thời gian điện phân là", "options": ["A. 1930 giây.", "B. 2895 giây.", "C. 9650 giây.", "D. 5790 giây."], "answer": "D", "explain": "n(Al) = 5,4/27 = 0,2 mol → n(e) = 0,6 mol. t = n(e)·F/I = 0,6 × 96500/10 = 5790 giây.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hòa tan hoàn toàn 5,1 gam hỗn hợp gồm Mg và Al bằng dung dịch HCl dư. Khối lượng Mg trong hỗn hợp là 2,4 gam. Thể tích khí H2 thu được ở đktc là", "options": ["A. 5,6 lít.", "B. 4,48 lít.", "C. 6,72 lít.", "D. 3,36 lít."], "answer": "A", "explain": "n(Mg) = 2,4/24 = 0,1 mol; n(Al) = (5,1-2,4)/27 = 0,1 mol. n(H2) = n(Mg) + 1,5·n(Al) = 0,1 + 0,15 = 0,25 mol → V = 5,6 lít.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hòa tan hoàn toàn 2,7 gam Al vào dung dịch HNO3 loãng, dư; thu được V lít khí N2O (đktc, sản phẩm khử duy nhất). Giá trị của V là", "options": ["A. 1,68 lít.", "B. 2,24 lít.", "C. 0,84 lít.", "D. 3,36 lít."], "answer": "C", "explain": "n(Al) = 2,7/27 = 0,1 mol → số mol electron nhường = 0,3 mol. 2NO3- + 10H+ + 8e → N2O + 5H2O → n(N2O) = 0,3/8 = 0,0375 mol → V = 0,84 lít.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Mô tả quy trình sản xuất xà phòng từ dầu dừa trong công nghiệp.", "statements": ["a) Đun nóng dầu dừa với dung dịch NaOH đặc để thực hiện phản ứng xà phòng hóa.", "b) Thêm dung dịch NaCl bão hòa vào hỗn hợp sau phản ứng để tách xà phòng ra khỏi glycerol.", "c) Glycerol là sản phẩm phụ có giá trị, được thu hồi để dùng trong công nghiệp.", "d) Xà phòng thu được trong quy trình này chủ yếu là muối potassium của acid béo."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: xà phòng hóa bằng NaOH đặc, đun nóng. b) Đúng: hiện tượng tách muối. c) Đúng: glycerol dùng trong dược phẩm, mỹ phẩm. d) Sai: dùng NaOH nên thu được muối sodium (xà phòng cứng); muối potassium cho xà phòng mềm (dùng KOH).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Để bảo vệ vỏ tàu biển làm bằng thép khỏi bị ăn mòn, người ta gắn các tấm kẽm (Zn) vào vỏ tàu.", "statements": ["a) Trong nước biển, vỏ tàu thép bị ăn mòn điện hóa.", "b) Tấm Zn gắn vào vỏ tàu sẽ bị ăn mòn thay cho thép.", "c) Trong cặp điện cực Zn-Fe, Zn đóng vai trò cực dương.", "d) Sơn phủ kín vỏ tàu cũng là một biện pháp chống ăn mòn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: nước biển là môi trường điện li mạnh. b) Đúng: Zn hoạt động hơn Fe nên bị ăn mòn trước (bảo vệ cathode). c) Sai: Zn là cực âm (anode) trong pin ăn mòn. d) Đúng: lớp sơn cách li kim loại với môi trường.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các ứng dụng của polymer.", "statements": ["a) Polyethylene (PE) được dùng làm màng bọc thực phẩm, túi nilon.", "b) Poly(vinyl chloride) (PVC) được dùng làm ống nước, vỏ dây điện.", "c) Cao su lưu hóa có tính đàn hồi, chịu mài mòn tốt hơn cao su thiên nhiên.", "d) Tơ nylon-6,6 tan tốt trong nước nên dễ giặt sạch."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: lưu hóa tạo cầu nối disulfide giữa các mạch. d) Sai: nylon-6,6 không tan trong nước.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một số hợp chất của calcium và magnesium.", "statements": ["a) CaSO4.2H2O được gọi là thạch cao sống.", "b) Nung thạch cao sống ở nhiệt độ thích hợp thu được thạch cao nung dùng bó bột khi gãy xương.", "c) MgCO3 là thành phần chính của đá vôi.", "d) Dolomite có thành phần chính là CaCO3.MgCO3."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: CaSO4.2H2O → CaSO4.H2O (thạch cao nung). c) Sai: đá vôi chủ yếu là CaCO3. d) Đúng theo thành phần của dolomite.", "points": 1}, {"type": "short", "level": "VD", "q": "Xà phòng hóa hoàn toàn 11,1 gam metyl axetat (CH3COOCH3) bằng dung dịch NaOH dư, đun nóng. Khối lượng muối khan thu được là bao nhiêu gam?", "answer": "12.3", "explain": "n(metyl axetat) = 11,1/74 = 0,15 mol. CH3COOCH3 + NaOH → CH3COONa + CH3OH. n(muối) = 0,15 mol → m = 0,15 × 82 = 12,3 gam.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Thủy phân hoàn toàn 8,1 gam tinh bột rồi cho toàn bộ glucose thu được tráng bạc hoàn toàn. Khối lượng Ag thu được là bao nhiêu gam?", "answer": "10.8", "explain": "n(mắt xích) = 8,1/162 = 0,05 mol → n(glucose) = 0,05 mol → n(Ag) = 0,1 mol → m = 0,1 × 108 = 10,8 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho 0,15 mol etylamine tác dụng vừa đủ với dung dịch HNO3 loãng. Khối lượng muối C2H5NH3NO3 thu được là bao nhiêu gam?", "answer": "16.2", "explain": "C2H5NH2 + HNO3 → C2H5NH3NO3 (tỉ lệ 1:1). n(muối) = 0,15 mol → m = 0,15 × 108 = 16,2 gam.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Điện phân nóng chảy NaCl bằng điện cực trơ với cường độ dòng điện 2 A trong 9650 giây. Thể tích khí Cl2 thu được ở anode (đktc) là bao nhiêu lít? (F = 96500)", "answer": "2.24", "explain": "2Cl- → Cl2 + 2e. n(e) = 2 × 9650/96500 = 0,2 mol → n(Cl2) = 0,1 mol → V = 0,1 × 22,4 = 2,24 lít.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho 12,6 gam NaHCO3 tác dụng hoàn toàn với dung dịch HCl dư. Thể tích khí CO2 thu được ở đktc là bao nhiêu lít?", "answer": "3.36", "explain": "n(NaHCO3) = 12,6/84 = 0,15 mol. NaHCO3 + HCl → NaCl + CO2 + H2O. n(CO2) = 0,15 mol → V = 0,15 × 22,4 = 3,36 lít.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho 5,6 gam Fe tác dụng với dung dịch CuSO4 dư. Khối lượng Cu thu được là bao nhiêu gam?", "answer": "6.4", "explain": "n(Fe) = 5,6/56 = 0,1 mol. Fe + CuSO4 → FeSO4 + Cu. n(Cu) = 0,1 mol → m = 0,1 × 64 = 6,4 gam.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Khi đốt cháy hoàn toàn một este no, đơn chức, mạch hở, ta luôn thu được", "options": ["A. số mol CO2 lớn hơn số mol H2O.", "B. số mol CO2 bằng số mol H2O.", "C. số mol CO2 nhỏ hơn số mol H2O.", "D. chỉ thu được CO2 mà không thu được H2O."], "answer": "B", "explain": "Este no, đơn chức, mạch hở có công thức CnH2nO2; đốt cháy: CnH2nO2 + (3n-2)/2 O2 → nCO2 + nH2O → nCO2 = nH2O.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Acid béo không no nào sau đây có trong dầu thực vật?", "options": ["A. Stearic acid.", "B. Palmitic acid.", "C. Lauric acid.", "D. Oleic acid."], "answer": "D", "explain": "Oleic acid (C17H33COOH) có một nối đôi C=C nên là acid béo không no, có nhiều trong dầu thực vật. Stearic, palmitic, lauric là acid béo no.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhỏ dung dịch H2SO4 đặc vào bát đựng đường saccharose. Hiện tượng xảy ra là", "options": ["A. đường hóa đen (hóa than) rồi sủi bọt khí.", "B. đường tan tạo dung dịch không màu.", "C. đường chuyển sang màu xanh.", "D. không có hiện tượng gì."], "answer": "A", "explain": "H2SO4 đặc hút nước mạnh làm đường bị hóa than: C12H22O11 → 12C + 11H2O; C tiếp tục bị oxi hóa tạo CO2, SO2 làm sủi bọt, khối than dâng lên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Muối phenylammonium chloride có công thức là", "options": ["A. C6H5NH2.HCl.", "B. C6H5NO2.", "C. C6H5NH3Cl.", "D. C6H5N2Cl."], "answer": "C", "explain": "C6H5NH2 + HCl → C6H5NH3Cl (phenylammonium chloride). Muối này tan tốt trong nước (khác với aniline ít tan).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thủy phân hoàn toàn protein trong môi trường thích hợp, sản phẩm cuối cùng thu được là", "options": ["A. các đipeptide.", "B. các ester của amino acid.", "C. các amine.", "D. các amino acid."], "answer": "D", "explain": "Protein là polypeptide; thủy phân hoàn toàn cắt tất cả các liên kết peptide, thu được các amino acid cấu tạo nên nó.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Polymer nào sau đây có tính dẻo, được dùng làm chất dẻo?", "options": ["A. Cao su lưu hóa.", "B. Polyethylene.", "C. Tơ tằm.", "D. Cellulose."], "answer": "B", "explain": "PE là chất dẻo (plastic). Cao su có tính đàn hồi; tơ tằm, cellulose là polymer dạng sợi, không có tính dẻo.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kim loại nào sau đây đẩy được khí H2 ra khỏi dung dịch HCl loãng?", "options": ["A. Cu.", "B. Ag.", "C. Au.", "D. Zn."], "answer": "D", "explain": "Zn đứng trước H trong dãy điện hóa: Zn + 2HCl → ZnCl2 + H2. Cu, Ag, Au đứng sau H nên không phản ứng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Xút ăn da có công thức hóa học là", "options": ["A. NaOH.", "B. Na2CO3.", "C. Ca(OH)2.", "D. KOH."], "answer": "A", "explain": "Xút ăn da là NaOH (có tính ăn mòn da). KOH cũng là kiềm nhưng không gọi là xút ăn da; Na2CO3 là soda.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho đất đèn (calcium carbide) tác dụng với nước. Khí thu được là", "options": ["A. C2H4.", "B. CH4.", "C. C2H2.", "D. CO2."], "answer": "C", "explain": "CaC2 + 2H2O → Ca(OH)2 + C2H2 (acetylene). Đây là phương pháp điều chế acetylene trong phòng thí nghiệm và công nghiệp trước đây.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Oxit nào sau đây vừa tác dụng được với dung dịch HCl, vừa tác dụng được với dung dịch NaOH?", "options": ["A. Fe2O3.", "B. CaO.", "C. CuO.", "D. Al2O3."], "answer": "D", "explain": "Al2O3 là oxit lưỡng tính. Fe2O3, CaO, CuO là oxit base, chỉ tác dụng với acid.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho FeO tác dụng với dung dịch HNO3 loãng, dư. Sản phẩm muối thu được là", "options": ["A. Fe(NO3)2.", "B. Fe(NO3)3.", "C. Fe(NO2)2.", "D. Fe(OH)3."], "answer": "B", "explain": "HNO3 oxi hóa Fe(II) lên Fe(III): 3FeO + 10HNO3 → 3Fe(NO3)3 + NO + 5H2O.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thuốc thử dùng để nhận biết ion SO42- trong dung dịch là", "options": ["A. dung dịch AgNO3.", "B. dung dịch NaOH.", "C. dung dịch HCl.", "D. dung dịch BaCl2."], "answer": "D", "explain": "Ba2+ + SO42- → BaSO4 (kết tủa trắng, không tan trong acid). Đây là phản ứng đặc trưng nhận biết ion sulfate.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 0,1 mol một este no, đơn chức, mạch hở X tác dụng vừa đủ với dung dịch NaOH, thu được 8,2 gam muối khan. Đốt cháy hoàn toàn 0,1 mol X thu được 0,4 mol CO2. Công thức cấu tạo của X là", "options": ["A. CH3COOC2H5.", "B. HCOOC3H7.", "C. C2H5COOCH3.", "D. CH3COOCH3."], "answer": "A", "explain": "M(muối) = 8,2/0,1 = 82 → muối là CH3COONa → acid tạo este là CH3COOH. Đốt 0,1 mol X cho 0,4 mol CO2 → X có 4 nguyên tử C (C4H8O2). Vậy X là CH3COOC2H5.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Lên men 90,0 gam glucose thành rượu etylic với hiệu suất 80%. Thể tích khí CO2 thu được ở đktc là", "options": ["A. 11,2 lít.", "B. 22,4 lít.", "C. 17,92 lít.", "D. 8,96 lít."], "answer": "C", "explain": "n(glucose) = 90/180 = 0,5 mol. C6H12O6 → 2C2H5OH + 2CO2. n(CO2 lý thuyết) = 1,0 mol; thực tế = 0,8 mol → V = 0,8 × 22,4 = 17,92 lít.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 16,4 gam hỗn hợp gồm glycine (7,5 gam) và alanine tác dụng với dung dịch HCl dư. Khối lượng muối thu được là", "options": ["A. 20,05 gam.", "B. 23,65 gam.", "C. 23,70 gam.", "D. 27,35 gam."], "answer": "C", "explain": "n(glycine) = 7,5/75 = 0,1 mol; n(alanine) = (16,4-7,5)/89 = 0,1 mol. Mỗi amino acid tác dụng với 1 HCl → m(muối) = 16,4 + 0,2 × 36,5 = 23,7 gam.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Điện phân dung dịch Cu(NO3)2 bằng điện cực trơ với cường độ dòng điện 4 A trong 4825 giây. Khối lượng Cu bám vào cathode là", "options": ["A. 3,2 gam.", "B. 6,4 gam.", "C. 12,8 gam.", "D. 1,6 gam."], "answer": "B", "explain": "m = A·I·t/(n·F) = 64 × 4 × 4825/(2 × 96500) = 6,4 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 4,8 gam Mg tác dụng với dung dịch HNO3 loãng, dư; thu được V lít khí N2 (đktc, sản phẩm khử duy nhất). Giá trị của V là", "options": ["A. 0,896 lít.", "B. 1,792 lít.", "C. 2,240 lít.", "D. 4,480 lít."], "answer": "A", "explain": "n(Mg) = 4,8/24 = 0,2 mol → số mol electron nhường = 0,4 mol. 2NO3- + 12H+ + 10e → N2 + 6H2O → n(N2) = 0,4/10 = 0,04 mol → V = 0,896 lít.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho 6,5 gam Zn tác dụng với dung dịch H2SO4 đặc, nóng, dư; thu được V lít khí SO2 (đktc, sản phẩm khử duy nhất). Giá trị của V là", "options": ["A. 1,12 lít.", "B. 2,24 lít.", "C. 3,36 lít.", "D. 4,48 lít."], "answer": "B", "explain": "n(Zn) = 6,5/65 = 0,1 mol → số mol electron nhường = 0,2 mol. SO42- + 4H+ + 2e → SO2 + 2H2O → n(SO2) = 0,1 mol → V = 2,24 lít.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Tiến hành thí nghiệm: cho etyl axetat vào hai ống nghiệm, ống (1) thêm nước, ống (2) thêm dung dịch NaOH rồi đun nóng cả hai.", "statements": ["a) Ở ống (1), etyl axetat ít tan trong nước và nổi lên trên.", "b) Ở ống (2) sau khi đun nóng, etyl axetat tan hết tạo thành dung dịch đồng nhất.", "c) Thêm dung dịch HCl vào ống (2) sau phản ứng sẽ thấy tách lớp trở lại.", "d) Phản ứng giữa etyl axetat với dung dịch NaOH là phản ứng thuận nghịch."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: este nhẹ hơn nước, ít tan. b) Đúng: xà phòng hóa tạo muối tan và alcohol. c) Sai: thêm HCl chỉ tạo CH3COOH tan, không tách lớp este. d) Sai: xà phòng hóa là phản ứng một chiều.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Cho Fe tác dụng với dung dịch H2SO4 đặc, nóng.", "statements": ["a) Có khí mùi hắc (SO2) thoát ra.", "b) Fe bị thụ động hóa như trong H2SO4 đặc, nguội.", "c) Muối thu được là Fe2(SO4)3.", "d) H2SO4 đặc, nóng vừa thể hiện tính oxi hóa, vừa thể hiện tính acid."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: SO42- + 4H+ + 2e → SO2 + 2H2O (mùi hắc). b) Sai: chỉ thụ động khi đặc, nguội; đun nóng Fe phản ứng mãnh liệt. c) Đúng: 2Fe + 6H2SO4 (đặc, nóng) → Fe2(SO4)3 + 3SO2 + 6H2O. d) Đúng: vừa tạo muối sulfate (tính acid) vừa tạo SO2 (tính oxi hóa).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét amino acid glutamic acid (HOOCCH2CH2CH(NH2)COOH).", "statements": ["a) Phân tử glutamic acid chứa 2 nhóm -COOH.", "b) Dung dịch glutamic acid làm quỳ tím chuyển sang màu đỏ.", "c) Glutamic acid tác dụng với dung dịch NaOH theo tỉ lệ mol 1 : 2.", "d) Glutamic acid là một amino acid trung tính."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: số nhóm -COOH nhiều hơn số nhóm -NH2 nên dung dịch có tính acid. c) Đúng: mỗi -COOH tác dụng với 1 NaOH. d) Sai: đây là amino acid có tính acid.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét một số polymer và vật liệu polymer.", "statements": ["a) Tinh bột gồm hai thành phần là amylose và amylopectin.", "b) Tơ visco bền với dung dịch kiềm đặc.", "c) Polyethylene không dẫn điện nên được dùng làm vỏ bọc dây điện.", "d) Cao su thiên nhiên là polymer của isoprene."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: tơ visco (từ cellulose) kém bền với kiềm và acid. c) Đúng: PE cách điện tốt. d) Đúng: (-CH2-C(CH3)=CH-CH2-)n.", "points": 1}, {"type": "short", "level": "VD", "q": "Đốt cháy hoàn toàn 7,4 gam một este no, đơn chức, mạch hở X thu được 6,72 lít CO2 (đktc). Khối lượng H2O thu được là bao nhiêu gam?", "answer": "5.4", "explain": "n(CO2) = 6,72/22,4 = 0,3 mol. Este no đơn chức → n(H2O) = n(CO2) = 0,3 mol → m(H2O) = 0,3 × 18 = 5,4 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho 18,0 gam fructose tác dụng với dung dịch AgNO3 trong NH3 dư, đun nóng (phản ứng xảy ra hoàn toàn). Khối lượng Ag thu được là bao nhiêu gam?", "answer": "21.6", "explain": "n(fructose) = 18/180 = 0,1 mol. Fructose chuyển hóa thành glucose trong môi trường kiềm → n(Ag) = 0,2 mol → m = 21,6 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho 0,2 mol aniline tác dụng vừa đủ với dung dịch HCl. Khối lượng muối C6H5NH3Cl thu được là bao nhiêu gam?", "answer": "25.9", "explain": "C6H5NH2 + HCl → C6H5NH3Cl (tỉ lệ 1:1). n(muối) = 0,2 mol → m = 0,2 × 129,5 = 25,9 gam.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Điện phân dung dịch ZnSO4 bằng điện cực trơ với cường độ dòng điện 2 A trong 9650 giây. Khối lượng Zn bám vào cathode là bao nhiêu gam? (F = 96500)", "answer": "6.5", "explain": "m = A·I·t/(n·F) = 65 × 2 × 9650/(2 × 96500) = 6,5 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho 10,0 gam CaCO3 tác dụng hoàn toàn với dung dịch HCl dư. Thể tích khí CO2 thu được ở đktc là bao nhiêu lít?", "answer": "2.24", "explain": "n(CaCO3) = 10/100 = 0,1 mol. CaCO3 + 2HCl → CaCl2 + CO2 + H2O. n(CO2) = 0,1 mol → V = 2,24 lít.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho 5,4 gam Al tác dụng hết với khí Cl2 dư, đun nóng. Khối lượng AlCl3 thu được là bao nhiêu gam?", "answer": "26.7", "explain": "n(Al) = 5,4/27 = 0,2 mol. 2Al + 3Cl2 → 2AlCl3. n(AlCl3) = 0,2 mol → m = 0,2 × 133,5 = 26,7 gam.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Số đồng phân cấu tạo là este của hợp chất có công thức phân tử C3H6O2 là", "options": ["A. 2.", "B. 3.", "C. 4.", "D. 1."], "answer": "A", "explain": "Các este C3H6O2: HCOOC2H5 (etyl fomat) và CH3COOCH3 (metyl axetat). Tổng 2 đồng phân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phản ứng xà phòng hóa chất béo cần điều kiện", "options": ["A. xúc tác acid, nhiệt độ thường.", "B. đun nóng với dung dịch kiềm.", "C. xúc tác enzyme, nhiệt độ thường.", "D. áp suất cao, không cần đun nóng."], "answer": "B", "explain": "(RCOO)3C3H5 + 3NaOH → 3RCOONa + C3H5(OH)3 cần đun nóng để phản ứng xảy ra hoàn toàn và nhanh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhỏ dung dịch I2 vào dung dịch hồ tinh bột, hiện tượng xảy ra là", "options": ["A. xuất hiện kết tủa trắng.", "B. dung dịch mất màu.", "C. dung dịch chuyển sang màu xanh tím.", "D. có khí thoát ra."], "answer": "C", "explain": "Tinh bột (amylose) hấp phụ I2 tạo màu xanh tím đặc trưng. Đun nóng màu biến mất, để nguội màu xuất hiện lại.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chất nào sau đây là amine bậc ba?", "options": ["A. CH3NH2.", "B. (CH3)2NH.", "C. C6H5NH2.", "D. (C2H5)3N."], "answer": "D", "explain": "(C2H5)3N có nguyên tử N liên kết với 3 gốc ethyl nên là amine bậc ba. CH3NH2, C6H5NH2 bậc một; (CH3)2NH bậc hai.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tính chất đặc trưng của amino acid là", "options": ["A. tính lưỡng tính.", "B. tính oxi hóa mạnh.", "C. tính khử mạnh.", "D. tính acid mạnh."], "answer": "A", "explain": "Amino acid chứa đồng thời nhóm -NH2 (tính base) và nhóm -COOH (tính acid) nên có tính lưỡng tính.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phản ứng màu biuret dùng để nhận biết protein được thực hiện với thuốc thử", "options": ["A. dung dịch I2.", "B. Cu(OH)2 trong môi trường kiềm.", "C. dung dịch AgNO3 trong NH3.", "D. quỳ tím."], "answer": "B", "explain": "Các hợp chất có từ 2 liên kết peptide trở lên tác dụng với Cu(OH)2 trong môi trường kiềm cho màu tím (phản ứng màu biuret).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Polymer tổng hợp nào sau đây được dùng làm ống nước, vỏ dây điện?", "options": ["A. Cellulose.", "B. Tơ tằm.", "C. Poly(vinyl chloride).", "D. Tinh bột."], "answer": "C", "explain": "PVC bền, cách điện, không thấm nước nên dùng làm ống nước, vỏ dây điện, vật liệu xây dựng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong dãy điện hóa, cặp oxi hóa - khử có thế điện cực chuẩn càng lớn thì", "options": ["A. dạng khử càng mạnh.", "B. dạng oxi hóa càng yếu.", "C. dạng khử càng yếu và dạng oxi hóa càng yếu.", "D. dạng oxi hóa càng mạnh."], "answer": "D", "explain": "Quy tắc: thế điện cực chuẩn càng lớn → tính oxi hóa của dạng oxi hóa càng mạnh, tính khử của dạng khử càng yếu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong kĩ thuật mạ kẽm lên tấm thép, điện cực kẽm đóng vai trò", "options": ["A. anode (cực dương), bị oxi hóa tan dần.", "B. cathode (cực âm), được bồi đắp thêm.", "C. cầu muối.", "D. không tham gia vào quá trình điện phân."], "answer": "A", "explain": "Điện cực Zn là anode tan: Zn → Zn2+ + 2e, bổ sung Zn2+ cho dung dịch; tấm thép là cathode: Zn2+ + 2e → Zn bám lên thép.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đồng thau là hợp kim của đồng với", "options": ["A. thiếc.", "B. kẽm.", "C. nhôm.", "D. nickel."], "answer": "B", "explain": "Đồng thau (brass) là hợp kim Cu-Zn; đồng thanh (bronze) là hợp kim Cu-Sn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đốt cháy Na trong khí O2 dư, sản phẩm thu được là", "options": ["A. Na2O.", "B. NaOH.", "C. Na2O2.", "D. NaH."], "answer": "C", "explain": "2Na + O2 → Na2O2 (sodium peroxide) khi đốt trong O2 dư. Na2O2 tác dụng với nước tạo NaOH và O2.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đun sôi dung dịch Ca(HCO3)2, hiện tượng xảy ra là", "options": ["A. không có hiện tượng gì.", "B. có khí H2 thoát ra.", "C. dung dịch chuyển sang màu vàng.", "D. xuất hiện kết tủa trắng CaCO3."], "answer": "D", "explain": "Ca(HCO3)2 → CaCO3 + CO2 + H2O (khi đun nóng). Đây là cơ sở để loại tính cứng tạm thời của nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kim loại Al không tác dụng được với dung dịch nào sau đây ở điều kiện thường?", "options": ["A. H2SO4 đặc, nguội.", "B. HCl loãng.", "C. NaOH.", "D. HNO3 loãng."], "answer": "A", "explain": "Al bị thụ động hóa trong H2SO4 đặc, nguội (tạo màng oxit bảo vệ). Al tác dụng được với HCl loãng, NaOH và HNO3 loãng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khử Fe3O4 bằng khí CO dư ở nhiệt độ cao, sản phẩm rắn thu được là", "options": ["A. FeO.", "B. Fe.", "C. FeCO3.", "D. Fe2O3."], "answer": "B", "explain": "Fe3O4 + 4CO → 3Fe + 4CO2 (nhiệt độ cao). Đây là phản ứng chính trong luyện gang từ quặng magnetite.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho este X (C4H8O2) tác dụng với dung dịch NaOH, thu được muối Y và alcohol Z. Đun Z với H2SO4 đặc ở 170°C thu được alkene. Công thức cấu tạo của X là", "options": ["A. HCOOCH2CH2CH3.", "B. HCOOCH(CH3)2.", "C. CH3COOCH2CH3.", "D. CH3CH2COOCH3."], "answer": "C", "explain": "Z tách nước tạo alkene → Z là alcohol no đơn chức có ít nhất 2C: C2H5OH (tách nước cho C2H4). X (C4H8O2) cho muối + C2H5OH → X là CH3COOC2H5 (các đồng phân khác cho CH3OH hoặc C3H7OH không tách nước thành alkene... C3H7OH tách nước được propene! Loại: X = C4H8O2 mà cho C3H7OH thì acid là HCOOH → HCOOC3H7; nhưng Z = C2H5OH chỉ có ở CH3COOC2H5).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 0,1 mol este X (no, đơn chức, mạch hở) tác dụng với dung dịch AgNO3 trong NH3 dư, đun nóng; thu được 21,6 gam Ag. Công thức cấu tạo của X là", "options": ["A. CH3COOCH3.", "B. CH3COOC2H5.", "C. HCOOCH3.", "D. HCOOC2H5."], "answer": "D", "explain": "n(Ag) = 21,6/108 = 0,2 mol = 2·nX → X có nhóm -CHO → X là este của formic acid (HCOOR). X no, đơn chức: trong các đáp án, HCOOC2H5 thỏa mãn (HCOOCH3 cũng tráng bạc nhưng...). Với dữ kiện đã cho, X là este fomat; đáp án phù hợp nhất là HCOOC2H5.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Khi trùng ngưng 3 phân tử amino acid để tạo thành một tripeptide mạch hở, số phân tử H2O tách ra là", "options": ["A. 2.", "B. 3.", "C. 1.", "D. 4."], "answer": "A", "explain": "Mỗi liên kết peptide tạo thành tách ra 1 H2O. Tripeptide có 2 liên kết peptide → tách ra 2 H2O.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hòa tan hoàn toàn 8,3 gam hỗn hợp gồm Al (2,7 gam) và Fe bằng dung dịch HCl dư. Thể tích khí H2 thu được ở đktc là", "options": ["A. 4,48 lít.", "B. 5,60 lít.", "C. 6,72 lít.", "D. 3,36 lít."], "answer": "B", "explain": "n(Al) = 2,7/27 = 0,1 mol; n(Fe) = (8,3-2,7)/56 = 0,1 mol. n(H2) = 1,5×0,1 + 0,1 = 0,25 mol → V = 0,25 × 22,4 = 5,6 lít.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét tính chất của este (lấy etyl axetat làm ví dụ).", "statements": ["a) Etyl axetat là chất lỏng, có mùi thơm đặc trưng.", "b) Etyl axetat nhẹ hơn nước và ít tan trong nước.", "c) Etyl axetat tan nhiều trong nước như ethanol.", "d) Đun nóng etyl axetat với dung dịch NaOH thu được muối sodium acetate và ethanol."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: este có mùi thơm. b) Đúng: este nhẹ hơn nước, ít tan. c) Sai: este ít tan trong nước. d) Đúng: CH3COOC2H5 + NaOH → CH3COONa + C2H5OH.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét pin nhiên liệu hydrogen - oxygen.", "statements": ["a) Ở anode xảy ra quá trình oxi hóa H2 thành H2O.", "b) Ở cathode xảy ra quá trình khử O2 thành H2O.", "c) Sản phẩm của pin nhiên liệu là nước sạch.", "d) Pin nhiên liệu biến đổi điện năng thành hóa năng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: H2 → 2H+ + 2e (trong môi trường acid). b) Đúng: O2 + 4H+ + 4e → 2H2O. c) Đúng: đây là ưu điểm (năng lượng sạch). d) Sai: pin nhiên liệu biến hóa năng thành điện năng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét quá trình sản xuất nhôm bằng phương pháp điện phân nóng chảy Al2O3.", "statements": ["a) Nguyên liệu là Al2O3 nóng chảy có thêm cryolite (Na3AlF6).", "b) Cryolite có tác dụng hạ nhiệt độ nóng chảy của Al2O3 và tăng độ dẫn điện.", "c) Khí O2 thoát ra ở anode oxi hóa cực than chì làm cực bị ăn mòn dần.", "d) Nhôm lỏng thu được ở anode và được tách ra khỏi bể điện phân."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: vai trò của cryolite. c) Đúng: C + O2 → CO/CO2 nên phải thay cực dương định kì. d) Sai: Al3+ bị khử ở cathode (cực âm), nhôm lỏng lắng xuống đáy bể.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét gang, thép và các oxit của sắt.", "statements": ["a) Gang là hợp kim của sắt với carbon (2-5% C) cùng một số nguyên tố khác.", "b) Thép là hợp kim của sắt với carbon (dưới 2% C).", "c) FeO chỉ thể hiện tính oxi hóa.", "d) Fe2O3 thể hiện tính oxi hóa khi tác dụng với CO, Al ở nhiệt độ cao."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: FeO (Fe +2) vừa có tính oxi hóa (tác dụng với H2, CO) vừa có tính khử (tác dụng với HNO3, O2). d) Đúng: Fe2O3 + 3CO → 2Fe + 3CO2; 2Al + Fe2O3 → 2Fe + Al2O3.", "points": 1}, {"type": "short", "level": "VD", "q": "Xà phòng hóa hoàn toàn 7,4 gam etyl fomat (HCOOC2H5) bằng dung dịch NaOH dư, đun nóng. Khối lượng muối khan thu được là bao nhiêu gam?", "answer": "6.8", "explain": "n(etyl fomat) = 7,4/74 = 0,1 mol. HCOOC2H5 + NaOH → HCOONa + C2H5OH. n(HCOONa) = 0,1 mol → m = 0,1 × 68 = 6,8 gam.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Thủy phân hoàn toàn 34,2 gam saccharose rồi cho toàn bộ sản phẩm tráng bạc hoàn toàn. Khối lượng Ag thu được là bao nhiêu gam?", "answer": "43.2", "explain": "n(saccharose) = 34,2/342 = 0,1 mol → 0,1 mol glucose + 0,1 mol fructose → n(Ag) = 0,4 mol → m = 0,4 × 108 = 43,2 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho 0,1 mol methylamine tác dụng vừa đủ với dung dịch HCl. Khối lượng muối CH3NH3Cl thu được là bao nhiêu gam?", "answer": "6.75", "explain": "CH3NH2 + HCl → CH3NH3Cl (tỉ lệ 1:1). n(muối) = 0,1 mol → m = 0,1 × 67,5 = 6,75 gam.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Điện phân dung dịch NiSO4 bằng điện cực trơ với cường độ dòng điện 5 A trong 3860 giây. Khối lượng Ni bám vào cathode là bao nhiêu gam? (F = 96500)", "answer": "5.9", "explain": "m = A·I·t/(n·F) = 59 × 5 × 3860/(2 × 96500) = 5,9 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Hòa tan hoàn toàn 2,7 gam Al trong dung dịch NaOH dư. Thể tích khí H2 thu được ở đktc là bao nhiêu lít?", "answer": "3.36", "explain": "n(Al) = 2,7/27 = 0,1 mol. 2Al + 2NaOH + 2H2O → 2NaAlO2 + 3H2. n(H2) = 0,15 mol → V = 0,15 × 22,4 = 3,36 lít.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho 11,2 gam Fe tác dụng hết với khí Cl2 dư, đun nóng. Khối lượng FeCl3 thu được là bao nhiêu gam?", "answer": "32.5", "explain": "n(Fe) = 11,2/56 = 0,2 mol. 2Fe + 3Cl2 → 2FeCl3. n(FeCl3) = 0,2 mol → m = 0,2 × 162,5 = 32,5 gam.", "points": 0.5}]}]}
