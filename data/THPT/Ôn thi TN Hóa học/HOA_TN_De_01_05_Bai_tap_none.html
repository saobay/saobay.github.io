<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Chất nào sau đây là một este?", "options": ["A. CH3COOC2H5.", "B. C2H5OH.", "C. CH3COOH.", "D. C6H12O6."], "answer": "A", "explain": "CH3COOC2H5 (etyl axetat) có nhóm chức -COO- nên là este. C2H5OH là alcohol, CH3COOH là carboxylic acid, C6H12O6 là carbohydrate.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng về chất béo?", "options": ["A. Dầu thực vật chứa chủ yếu các gốc acid béo no.", "B. Chất béo tan tốt trong nước.", "C. Chất béo là trieste của glycerol với các acid béo.", "D. Thủy phân chất béo trong môi trường acid thu được xà phòng."], "answer": "C", "explain": "Chất béo là trieste của glycerol (C3H5(OH)3) với các acid béo. Dầu thực vật chứa chủ yếu gốc acid béo không no; chất béo không tan trong nước; xà phòng chỉ tạo thành khi thủy phân trong môi trường kiềm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tính chất hóa học nào sau đây là của glucose?", "options": ["A. Không tác dụng với Cu(OH)2 ở nhiệt độ thường.", "B. Là một disaccharide.", "C. Bị oxi hóa bởi dung dịch AgNO3 trong NH3 khi đun nóng.", "D. Không tham gia phản ứng lên men rượu."], "answer": "C", "explain": "Glucose có nhóm -CHO nên bị oxi hóa bởi AgNO3/NH3 (phản ứng tráng bạc) khi đun nóng. Glucose hòa tan Cu(OH)2 tạo dung dịch xanh lam, là monosaccharide và lên men rượu tạo C2H5OH.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chất nào sau đây là amine bậc một?", "options": ["A. C6H5NHCH3.", "B. (CH3)2NH.", "C. (CH3)3N.", "D. CH3NH2."], "answer": "D", "explain": "Amine bậc một là amine mà nguyên tử N chỉ liên kết trực tiếp với một gốc hydrocarbon: CH3NH2. C6H5NHCH3, (CH3)2NH là bậc hai; (CH3)3N là bậc ba.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Công thức cấu tạo của glycine (amino acid đơn giản nhất) là", "options": ["A. CH3CH(NH2)COOH.", "B. NH2CH2COOH.", "C. C6H5NH2.", "D. H2N[CH2]4CH(NH2)COOH."], "answer": "B", "explain": "Glycine là NH2CH2COOH. CH3CH(NH2)COOH là alanine, C6H5NH2 là aniline (không phải amino acid), H2N[CH2]4CH(NH2)COOH là lysine.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phản ứng trùng hợp tạo ra polyethylene (PE) từ monomer nào sau đây?", "options": ["A. CH2=CH2.", "B. NH2[CH2]5COOH.", "C. HOOC-C6H4-COOH và HOCH2CH2OH.", "D. NH2CH2COOH."], "answer": "A", "explain": "nCH2=CH2 → (-CH2-CH2-)n (PE) là phản ứng trùng hợp. Các trường hợp còn lại đều là phản ứng trùng ngưng (tạo nylon-6, PET, protein).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong pin điện hóa Zn-Cu (pin Daniell), phát biểu nào sau đây đúng?", "options": ["A. Điện cực Cu là cực âm.", "B. Điện cực Zn là cực dương.", "C. Điện cực Zn là cực âm, tại đó xảy ra quá trình oxi hóa.", "D. Dòng electron đi từ điện cực Cu sang điện cực Zn qua dây dẫn."], "answer": "C", "explain": "Zn có tính khử mạnh hơn Cu nên Zn là cực âm: Zn → Zn2+ + 2e (oxi hóa). Electron đi từ cực âm (Zn) sang cực dương (Cu) qua dây dẫn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tính chất vật lí chung nào sau đây đúng với hầu hết các kim loại?", "options": ["A. Thể rắn, giòn, không dẫn điện.", "B. Đều tồn tại ở thể rắn trong điều kiện thường.", "C. Đều có nhiệt độ nóng chảy cao.", "D. Dẫn điện, dẫn nhiệt tốt, dẻo và có ánh kim."], "answer": "D", "explain": "Kim loại có tính dẫn điện, dẫn nhiệt tốt, tính dẻo và ánh kim do liên kết kim loại và các electron tự do. Hg là chất lỏng ở điều kiện thường; nhiều kim loại có nhiệt độ nóng chảy thấp (Na, K).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số đồng phân cấu tạo là este của hợp chất có công thức phân tử C4H8O2 là", "options": ["A. 2.", "B. 4.", "C. 3.", "D. 5."], "answer": "B", "explain": "Các este C4H8O2: HCOOCH2CH2CH3, HCOOCH(CH3)2, CH3COOCH2CH3, CH3CH2COOCH3. Tổng cộng 4 đồng phân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dung dịch nào sau đây hòa tan được Cu(OH)2 ở nhiệt độ thường tạo thành dung dịch màu xanh lam?", "options": ["A. Ethanol.", "B. Glycerol.", "C. Ethanal.", "D. Acetic acid."], "answer": "B", "explain": "Glycerol có nhiều nhóm -OH kề nhau nên tạo phức với Cu(OH)2 cho dung dịch xanh lam đặc trưng. Ethanol (1 nhóm -OH), ethanal, acetic acid không có tính chất này.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dãy nào sau đây sắp xếp các chất theo chiều tính base tăng dần?", "options": ["A. C6H5NH2 $\\lt$ NH3 $\\lt$ CH3NH2.", "B. NH3 $\\lt$ C6H5NH2 $\\lt$ CH3NH2.", "C. CH3NH2 $\\lt$ NH3 $\\lt$ C6H5NH2.", "D. C6H5NH2 $\\lt$ CH3NH2 $\\lt$ NH3."], "answer": "A", "explain": "Gốc C6H5- hút electron làm giảm tính base của aniline so với NH3; gốc CH3- đẩy electron làm tăng tính base của methylamine so với NH3. Vậy: C6H5NH2 $\\lt$ NH3 $\\lt$ CH3NH2.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho thế điện cực chuẩn: E°(Zn2+/Zn) = -0,76 V; E°(Cu2+/Cu) = +0,34 V. Sức điện động chuẩn của pin Zn-Cu là", "options": ["A. 0,42 V.", "B. 1,86 V.", "C. -1,10 V.", "D. 1,10 V."], "answer": "D", "explain": "E°pin = E°cathode - E°anode = E°(Cu2+/Cu) - E°(Zn2+/Zn) = 0,34 - (-0,76) = 1,10 V.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điện phân dung dịch chứa đồng thời AgNO3 và Cu(NO3)2 bằng điện cực trơ. Phát biểu nào sau đây đúng?", "options": ["A. Ion Ag+ bị khử trước ở cathode vì E°(Ag+/Ag) $\\gt$ E°(Cu2+/Cu).", "B. Ion Cu2+ bị khử trước ở cathode.", "C. Ion NO3- bị oxi hóa ở cathode.", "D. Nước bị khử trước ion Ag+ ở cathode."], "answer": "A", "explain": "Ở cathode, cation có tính oxi hóa mạnh hơn (thế điện cực chuẩn lớn hơn) bị khử trước. E°(Ag+/Ag) = +0,80 V lớn hơn E°(Cu2+/Cu) = +0,34 V nên Ag+ bị khử trước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát biểu nào sau đây đúng về Al(OH)3?", "options": ["A. Không tác dụng với dung dịch NaOH.", "B. Là một base mạnh.", "C. Bị nhiệt phân ngay ở nhiệt độ thường.", "D. Là hydroxide lưỡng tính, tan được trong dung dịch NaOH dư."], "answer": "D", "explain": "Al(OH)3 là hydroxide lưỡng tính: tan trong acid (Al(OH)3 + 3HCl → AlCl3 + 3H2O) và tan trong base (Al(OH)3 + NaOH → NaAlO2 + 2H2O). Nó chỉ bị nhiệt phân khi đun nóng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho Fe tác dụng với dung dịch HNO3 loãng, dư. Sản phẩm thu được là", "options": ["A. Fe(NO3)2 và H2.", "B. Không xảy ra phản ứng.", "C. Fe(NO3)3, NO và H2O.", "D. Fe(NO3)2, NO và H2O."], "answer": "C", "explain": "HNO3 loãng oxi hóa Fe lên số oxi hóa cao nhất (+3): Fe + 4HNO3 (loãng, dư) → Fe(NO3)3 + NO + 2H2O. Không giải phóng H2 vì HNO3 là acid có tính oxi hóa mạnh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Xà phòng hóa hoàn toàn 8,8 gam etyl axetat bằng dung dịch NaOH dư, đun nóng. Khối lượng muối thu được là", "options": ["A. 4,1 gam.", "B. 8,2 gam.", "C. 6,8 gam.", "D. 16,4 gam."], "answer": "B", "explain": "n(este) = 8,8/88 = 0,1 mol. CH3COOC2H5 + NaOH → CH3COONa + C2H5OH. n(muối) = 0,1 mol → m = 0,1 × 82 = 8,2 gam.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Số liên kết peptide trong một phân tử tetrapeptide mạch hở là", "options": ["A. 4.", "B. 3.", "C. 2.", "D. 5."], "answer": "B", "explain": "Peptide tạo bởi n gốc amino acid (mạch hở) có (n - 1) liên kết peptide. Tetrapeptide (n = 4) có 3 liên kết peptide.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điện phân dung dịch CuSO4 bằng điện cực trơ với cường độ dòng điện 1,93 A trong 1000 giây. Khối lượng Cu bám vào cathode là", "options": ["A. 0,32 gam.", "B. 1,28 gam.", "C. 6,40 gam.", "D. 0,64 gam."], "answer": "D", "explain": "Áp dụng định luật Faraday: m = A·I·t/(n·F) = 64 × 1,93 × 1000/(2 × 96500) = 0,64 gam.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Tiến hành thí nghiệm: cho dầu ăn vào ống nghiệm đựng dung dịch NaOH, đun nóng hỗn hợp một thời gian rồi thêm dung dịch NaCl bão hòa vào, để yên.", "statements": ["a) Dầu ăn tan hoàn toàn trong dung dịch NaOH ngay ở nhiệt độ thường.", "b) Sau khi đun nóng, trong ống nghiệm thu được hỗn hợp đồng nhất chứa muối sodium của acid béo và glycerol.", "c) Khi thêm dung dịch NaCl bão hòa, xà phòng tách ra và nổi lên trên bề mặt.", "d) Phản ứng xà phòng hóa chất béo là phản ứng thuận nghịch."], "answer": ["F", "T", "T", "F"], "explain": "a) Sai: chất béo không tan trong nước, phản ứng xà phòng hóa cần đun nóng. b) Đúng: (RCOO)3C3H5 + 3NaOH → 3RCOONa + C3H5(OH)3. c) Đúng: thêm NaCl bão hòa làm giảm độ tan của xà phòng (hiện tượng tách muối), xà phòng nhẹ hơn nước nên nổi lên. d) Sai: xà phòng hóa là phản ứng một chiều, khác với thủy phân trong môi trường acid.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Cho pin điện hóa Zn-Cu hoạt động. Biết E°(Zn2+/Zn) = -0,76 V; E°(Cu2+/Cu) = +0,34 V.", "statements": ["a) Điện cực Zn đóng vai trò cực âm, tại đó xảy ra quá trình oxi hóa Zn thành Zn2+.", "b) Dòng electron trong dây dẫn di chuyển từ điện cực Cu sang điện cực Zn.", "c) Sức điện động chuẩn của pin là 1,10 V.", "d) Sau một thời gian hoạt động, khối lượng điện cực Zn giảm dần còn khối lượng điện cực Cu tăng dần."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: Zn có tính khử mạnh hơn nên bị oxi hóa ở cực âm. b) Sai: electron đi từ cực âm (Zn) sang cực dương (Cu). c) Đúng: E°pin = 0,34 - (-0,76) = 1,10 V. d) Đúng: Zn tan ra (m giảm), Cu2+ bị khử bám vào điện cực Cu (m tăng).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét amino acid glycine (NH2CH2COOH).", "statements": ["a) Trong dung dịch, glycine tồn tại chủ yếu ở dạng ion lưỡng cực H3N+CH2COO-.", "b) Glycine vừa tác dụng được với dung dịch HCl, vừa tác dụng được với dung dịch NaOH.", "c) Dung dịch glycine làm quỳ tím chuyển sang màu đỏ.", "d) Glycine có thể tham gia phản ứng trùng ngưng tạo thành polymer."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: amino acid tồn tại dạng ion lưỡng cực trong dung dịch. b) Đúng: nhóm -NH2 tác dụng với HCl, nhóm -COOH tác dụng với NaOH (tính lưỡng tính). c) Sai: dung dịch amino acid gần như trung tính, không đổi màu quỳ tím. d) Đúng: các amino acid trùng ngưng tạo polypeptide/protein.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét về nước cứng trong đời sống và sản xuất.", "statements": ["a) Nước cứng là nước chứa hàm lượng cao các ion Ca2+ và Mg2+.", "b) Đun sôi nước có thể loại bỏ được tính cứng tạm thời.", "c) Dùng dung dịch Na2CO3 có thể loại bỏ được cả tính cứng tạm thời và tính cứng vĩnh cửu.", "d) Nước cứng chỉ làm tốn xà phòng khi giặt, không gây hại cho nồi hơi trong công nghiệp."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng theo định nghĩa. b) Đúng: đun sôi làm Ca(HCO3)2, Mg(HCO3)2 chuyển thành kết tủa CaCO3, MgCO3. c) Đúng: CO32- kết tủa Ca2+, Mg2+ thành CaCO3, MgCO3. d) Sai: nước cứng tạo cặn trong nồi hơi gây tốn nhiên liệu, giảm tuổi thọ thiết bị và có nguy cơ gây nổ.", "points": 1}, {"type": "short", "level": "VD", "q": "Xà phòng hóa hoàn toàn 8,8 gam etyl axetat bằng dung dịch NaOH dư, đun nóng. Khối lượng muối khan thu được là bao nhiêu gam?", "answer": "8.2", "explain": "n(etyl axetat) = 8,8/88 = 0,1 mol. CH3COOC2H5 + NaOH → CH3COONa + C2H5OH. n(CH3COONa) = 0,1 mol → m = 0,1 × 82 = 8,2 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho 18,0 gam glucose tác dụng với dung dịch AgNO3 trong NH3 dư, đun nóng (phản ứng tráng bạc xảy ra hoàn toàn). Khối lượng Ag thu được là bao nhiêu gam?", "answer": "21.6", "explain": "n(glucose) = 18/180 = 0,1 mol. C6H12O6 → 2Ag nên n(Ag) = 0,2 mol → m(Ag) = 0,2 × 108 = 21,6 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Trung hòa hoàn toàn 4,5 gam etylamine (C2H5NH2) cần vừa đủ V mL dung dịch HCl 1 M. Giá trị của V là bao nhiêu?", "answer": "100", "explain": "n(C2H5NH2) = 4,5/45 = 0,1 mol. C2H5NH2 + HCl → C2H5NH3Cl. n(HCl) = 0,1 mol → V = 0,1/1 = 0,1 L = 100 mL.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Điện phân dung dịch CuSO4 bằng điện cực trơ với cường độ dòng điện 2 A trong 1930 giây. Khối lượng kim loại Cu bám vào cathode là bao nhiêu gam? (F = 96500)", "answer": "1.28", "explain": "m = A·I·t/(n·F) = 64 × 2 × 1930/(2 × 96500) = 1,28 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Hòa tan hoàn toàn m gam Al trong dung dịch NaOH dư, thu được 3,36 lít khí H2 (đktc). Giá trị của m là bao nhiêu?", "answer": "2.7", "explain": "n(H2) = 3,36/22,4 = 0,15 mol. 2Al + 2NaOH + 2H2O → 2NaAlO2 + 3H2. n(Al) = 0,15 × 2/3 = 0,1 mol → m = 0,1 × 27 = 2,7 gam.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Khử hoàn toàn 8,0 gam Fe2O3 bằng bột Al dư (phản ứng nhiệt nhôm, hiệu suất 100%). Khối lượng Fe thu được là bao nhiêu gam?", "answer": "5.6", "explain": "n(Fe2O3) = 8/160 = 0,05 mol. Fe2O3 + 2Al → 2Fe + Al2O3. n(Fe) = 0,1 mol → m = 0,1 × 56 = 5,6 gam.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Công thức tổng quát của este no, đơn chức, mạch hở là", "options": ["A. CnH2nO2 (n ≥ 2).", "B. CnH2n+2O2 (n ≥ 2).", "C. CnH2n-2O2 (n ≥ 2).", "D. CnH2nO (n ≥ 2)."], "answer": "A", "explain": "Este no, đơn chức, mạch hở có công thức chung CnH2nO2 với n ≥ 2 (ví dụ HCOOCH3: n = 2).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thủy phân saccharose trong môi trường acid, thu được", "options": ["A. glucose duy nhất.", "B. glucose và fructose.", "C. fructose duy nhất.", "D. glucose và maltose."], "answer": "B", "explain": "Saccharose là disaccharide; thủy phân: C12H22O11 + H2O → C6H12O6 (glucose) + C6H12O6 (fructose) (xúc tác H+, đun nóng).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dung dịch chất nào sau đây làm quỳ tím chuyển sang màu xanh?", "options": ["A. Aniline.", "B. Glycine.", "C. Methylamine.", "D. Acetic acid."], "answer": "C", "explain": "Methylamine (CH3NH2) là base, làm quỳ tím hóa xanh. Aniline có tính base rất yếu không đổi màu quỳ; glycine gần như trung tính; acetic acid làm quỳ hóa đỏ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Liên kết peptide là liên kết", "options": ["A. -O- giữa hai gốc amino acid.", "B. hydrogen giữa các phân tử protein.", "C. ion giữa nhóm -NH2 và nhóm -COOH.", "D. -CO-NH- giữa hai đơn vị amino acid."], "answer": "D", "explain": "Liên kết peptide là liên kết -CO-NH- tạo thành khi nhóm -COOH của amino acid này kết hợp với nhóm -NH2 của amino acid kia, tách ra một phân tử H2O.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Polymer thiên nhiên nào sau đây có trong bông, gỗ?", "options": ["A. Cellulose.", "B. Polyethylene.", "C. Nylon-6,6.", "D. Poly(vinyl chloride)."], "answer": "A", "explain": "Cellulose là polymer thiên nhiên cấu tạo nên bông, gỗ. PE, nylon-6,6, PVC đều là polymer tổng hợp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Điều kiện cần để xảy ra ăn mòn điện hóa là", "options": ["A. kim loại nguyên chất tiếp xúc với không khí khô.", "B. hai kim loại (hoặc kim loại và phi kim) khác nhau tiếp xúc trực tiếp và cùng tiếp xúc với dung dịch chất điện li.", "C. kim loại được nung nóng trong không khí.", "D. kim loại ngâm trong dung dịch acid đặc."], "answer": "B", "explain": "Ăn mòn điện hóa xảy ra khi có cặp điện cực (hai vật dẫn khác nhau) tiếp xúc nhau và cùng nhúng trong môi trường điện li, tạo thành pin điện gây ăn mòn cực âm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong phòng thí nghiệm, kim loại Na thường được bảo quản bằng cách", "options": ["A. ngâm trong nước.", "B. để trong không khí khô.", "C. ngâm trong dầu hỏa khan.", "D. ngâm trong dung dịch NaCl."], "answer": "C", "explain": "Na hoạt động hóa học mạnh, tác dụng với O2, H2O trong không khí nên được ngâm trong dầu hỏa khan để cách li với không khí và hơi ẩm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phèn chua được dùng để làm trong nước đục có công thức là", "options": ["A. Na2SO4.Al2(SO4)3.24H2O.", "B. K2SO4.Al2(SO4)3.24H2O.", "C. (NH4)2SO4.Al2(SO4)3.24H2O.", "D. KAl(SO4)2.12H2O."], "answer": "D", "explain": "Phèn chua là KAl(SO4)2.12H2O (cách viết khác: K2SO4.Al2(SO4)3.24H2O). Trong nước, Al3+ thủy phân tạo Al(OH)3 keo tụ các hạt bẩn lơ lửng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tên gọi của este có công thức CH3COOCH=CH2 là", "options": ["A. vinyl axetat.", "B. etyl axetat.", "C. vinyl fomat.", "D. metyl acrylat."], "answer": "A", "explain": "CH3COO- là gốc axetat, CH2=CH- là gốc vinyl → vinyl axetat. Este này trùng hợp tạo poly(vinyl axetat) (PVA).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để phân biệt dung dịch tinh bột với dung dịch glucose, có thể dùng", "options": ["A. dung dịch AgNO3 trong NH3.", "B. dung dịch I2.", "C. Cu(OH)2 ở nhiệt độ thường.", "D. dung dịch NaOH."], "answer": "B", "explain": "Tinh bột tạo màu xanh tím đặc trưng với dung dịch I2; glucose không có hiện tượng này. AgNO3/NH3 và Cu(OH)2/đun nóng dùng để nhận biết glucose, không phân biệt được tinh bột.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho 0,1 mol glutamic acid (HOOCCH2CH2CH(NH2)COOH) tác dụng tối đa với dung dịch NaOH. Tỉ lệ mol glutamic acid : NaOH là", "options": ["A. 1 : 1.", "B. 1 : 3.", "C. 1 : 2.", "D. 2 : 1."], "answer": "C", "explain": "Glutamic acid có 2 nhóm -COOH và 1 nhóm -NH2. Mỗi nhóm -COOH tác dụng với 1 NaOH → tỉ lệ mol 1 : 2.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điện phân nóng chảy NaCl bằng điện cực trơ, sản phẩm thu được ở cathode là", "options": ["A. Cl2.", "B. O2.", "C. H2.", "D. Na."], "answer": "D", "explain": "Điện phân nóng chảy: 2NaCl → 2Na (cathode) + Cl2 (anode). Đây là phương pháp điều chế kim loại kiềm trong công nghiệp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kim loại nào sau đây khử được ion Cu2+ trong dung dịch CuSO4 thành Cu?", "options": ["A. Fe.", "B. Ag.", "C. Pt.", "D. Au."], "answer": "A", "explain": "Fe đứng trước Cu trong dãy điện hóa (có tính khử mạnh hơn Cu) nên: Fe + CuSO4 → FeSO4 + Cu. Ag, Pt, Au đứng sau Cu nên không khử được Cu2+.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kết tủa Fe(OH)3 có màu", "options": ["A. trắng xanh.", "B. nâu đỏ.", "C. trắng.", "D. đen."], "answer": "B", "explain": "Fe(OH)3 là kết tủa màu nâu đỏ. Fe(OH)2 là kết tủa trắng xanh (hóa nâu trong không khí).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Có thể nhận biết ion Ca2+ trong dung dịch bằng cách", "options": ["A. cho tác dụng với dung dịch NaOH.", "B. cho tác dụng với dung dịch HCl.", "C. đốt hợp chất của calcium trên ngọn lửa đèn khí, ngọn lửa có màu đỏ cam.", "D. cho tác dụng với dung dịch AgNO3."], "answer": "C", "explain": "Phép thử màu ngọn lửa: hợp chất của Ca cháy cho ngọn lửa màu đỏ cam; của Na màu vàng; của K màu tím. Ca(OH)2 ít tan, không tạo kết tủa đặc trưng với NaOH ở nồng độ loãng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đốt cháy hoàn toàn 8,8 gam một este no, đơn chức, mạch hở X thu được 17,6 gam CO2. Công thức phân tử của X là", "options": ["A. C2H4O2.", "B. C3H6O2.", "C. C5H10O2.", "D. C4H8O2."], "answer": "D", "explain": "n(CO2) = 17,6/44 = 0,4 mol. Este no đơn chức CnH2nO2 → nCO2 = n·nX → nX = 0,4/n. M(X) = 8,8·n/0,4 = 22n = 14n + 32 → 8n = 32 → n = 4. Vậy X là C4H8O2.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Thủy phân hoàn toàn 34,2 gam saccharose trong môi trường acid (hiệu suất 100%), sau đó cho toàn bộ sản phẩm tác dụng với dung dịch AgNO3 trong NH3 dư, đun nóng. Khối lượng Ag thu được là", "options": ["A. 21,6 gam.", "B. 43,2 gam.", "C. 10,8 gam.", "D. 32,4 gam."], "answer": "B", "explain": "n(saccharose) = 34,2/342 = 0,1 mol → tạo 0,1 mol glucose + 0,1 mol fructose. Mỗi mol đều cho 2 mol Ag (fructose chuyển hóa trong môi trường kiềm). n(Ag) = 0,4 mol → m = 0,4 × 108 = 43,2 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hòa tan hoàn toàn 8,3 gam hỗn hợp gồm Al và Fe bằng dung dịch HCl dư, thu được 5,6 lít khí H2 (đktc). Khối lượng Al trong hỗn hợp là", "options": ["A. 5,6 gam.", "B. 5,4 gam.", "C. 2,8 gam.", "D. 2,7 gam."], "answer": "D", "explain": "Gọi nAl = x, nFe = y. Ta có: 27x + 56y = 8,3 và 1,5x + y = 5,6/22,4 = 0,25. Giải hệ: x = 0,1; y = 0,1. m(Al) = 0,1 × 27 = 2,7 gam.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Tiến hành thí nghiệm: cho khoảng 1 mL dung dịch AgNO3 1% vào ống nghiệm, thêm từ từ dung dịch NH3 đến khi kết tủa tan hết, sau đó thêm tiếp 1 mL dung dịch glucose rồi đun nóng nhẹ trên ngọn lửa đèn cồn.", "statements": ["a) Sau khi đun nóng, thành ống nghiệm xuất hiện một lớp kim loại sáng bóng như gương.", "b) Nếu thay dung dịch glucose bằng dung dịch saccharose thì hiện tượng xảy ra tương tự.", "c) Fructose cũng cho được phản ứng tráng bạc trong điều kiện tương tự.", "d) Phản ứng trên chứng tỏ trong phân tử glucose có nhóm chức aldehyde (-CHO)."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: đây là phản ứng tráng bạc, Ag bám thành ống nghiệm. b) Sai: saccharose không có nhóm -CHO tự do nên không tráng bạc. c) Đúng: fructose chuyển hóa thành glucose trong môi trường kiềm nóng nên cũng tráng bạc. d) Đúng: nhóm -CHO bị oxi hóa thành -COOH.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Điện phân dung dịch NaCl bão hòa có màng ngăn xốp bằng điện cực trơ.", "statements": ["a) Ở cathode (cực âm) thu được khí H2.", "b) Ở anode (cực dương) thu được khí Cl2.", "c) Dung dịch sau điện phân làm quỳ tím chuyển sang màu đỏ.", "d) Đây là phương pháp sản xuất NaOH trong công nghiệp."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: 2H2O + 2e → H2 + 2OH- (Na+ không bị khử trong dung dịch). b) Đúng: 2Cl- → Cl2 + 2e. c) Sai: dung dịch thu được chứa NaOH nên làm quỳ tím hóa xanh. d) Đúng: đây là công nghiệp chlorine-kiềm.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét tetrapeptide mạch hở Ala-Gly-Ala-Gly.", "statements": ["a) Phân tử tetrapeptide trên có 3 liên kết peptide.", "b) Thủy phân hoàn toàn 1 mol tetrapeptide trên thu được 2 mol alanine và 2 mol glycine.", "c) Tetrapeptide trên cho được phản ứng màu biuret với Cu(OH)2.", "d) Tetrapeptide trên là một loại protein."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 4 gốc amino acid → 3 liên kết peptide. b) Đúng: mạch Ala-Gly-Ala-Gly thủy phân cho 2 Ala + 2 Gly. c) Đúng: peptide có từ 2 liên kết peptide trở lên cho phản ứng màu biuret (màu tím). d) Sai: protein là polypeptide có phân tử khối rất lớn (hàng chục nghìn đvC trở lên).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các vật liệu và hiện tượng liên quan đến sắt, thép.", "statements": ["a) Gang là hợp kim của sắt với carbon (hàm lượng carbon khoảng 2-5%).", "b) Mạ kẽm lên bề mặt tấm thép là một biện pháp chống ăn mòn kim loại.", "c) Ăn mòn điện hóa chỉ xảy ra khi hai kim loại khác nhau tiếp xúc trực tiếp trong môi trường chất điện li.", "d) Nối tấm sắt với một thanh đồng rồi để ngoài không khí ẩm sẽ làm tấm sắt bền hơn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng theo định nghĩa gang. b) Đúng: lớp Zn bảo vệ (Zn bị ăn mòn trước, bảo vệ cathode). c) Đúng: điều kiện của ăn mòn điện hóa. d) Sai: Cu có tính khử yếu hơn Fe nên Fe thành cực âm bị ăn mòn nhanh hơn.", "points": 1}, {"type": "short", "level": "VD", "q": "Xà phòng hóa hoàn toàn 14,8 gam metyl axetat (CH3COOCH3) bằng dung dịch NaOH dư, đun nóng. Khối lượng muối khan thu được là bao nhiêu gam?", "answer": "16.4", "explain": "n(metyl axetat) = 14,8/74 = 0,2 mol. CH3COOCH3 + NaOH → CH3COONa + CH3OH. n(muối) = 0,2 mol → m = 0,2 × 82 = 16,4 gam.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Lên men 36,0 gam glucose thành rượu etylic với hiệu suất 80%. Khối lượng rượu etylic thu được là bao nhiêu gam?", "answer": "14.72", "explain": "n(glucose) = 36/180 = 0,2 mol. C6H12O6 → 2C2H5OH + 2CO2. n(C2H5OH lý thuyết) = 0,4 mol; thực tế = 0,4 × 0,8 = 0,32 mol → m = 0,32 × 46 = 14,72 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho 0,1 mol lysine (H2N[CH2]4CH(NH2)COOH) tác dụng tối đa với dung dịch HCl 1 M. Thể tích dung dịch HCl đã dùng là bao nhiêu mL?", "answer": "200", "explain": "Lysine có 2 nhóm -NH2, mỗi nhóm tác dụng với 1 HCl → n(HCl) = 0,2 mol. V = 0,2/1 = 0,2 L = 200 mL.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Điện phân nóng chảy Al2O3 (có mặt cryolite) với cường độ dòng điện 10 A trong 9650 giây, hiệu suất 100%. Khối lượng Al thu được là bao nhiêu gam? (F = 96500)", "answer": "9", "explain": "2Al2O3 → 4Al + 3O2; Al3+ + 3e → Al. m = A·I·t/(n·F) = 27 × 10 × 9650/(3 × 96500) = 9 gam.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Khử hoàn toàn 23,2 gam Fe3O4 bằng khí CO dư, đun nóng. Khối lượng Fe thu được là bao nhiêu gam?", "answer": "16.8", "explain": "n(Fe3O4) = 23,2/232 = 0,1 mol. Fe3O4 + 4CO → 3Fe + 4CO2. n(Fe) = 0,3 mol → m = 0,3 × 56 = 16,8 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Nhúng một thanh Zn (dư) vào dung dịch CuSO4. Sau phản ứng, khối lượng Cu bám vào thanh Zn là 6,4 gam. Khối lượng Zn đã tan ra là bao nhiêu gam?", "answer": "6.5", "explain": "Zn + CuSO4 → ZnSO4 + Cu. n(Cu) = 6,4/64 = 0,1 mol → n(Zn tan) = 0,1 mol → m(Zn) = 0,1 × 65 = 6,5 gam.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Tên gọi của este có công thức HCOOC2H5 là", "options": ["A. etyl fomat.", "B. metyl fomat.", "C. etyl axetat.", "D. metyl axetat."], "answer": "A", "explain": "HCOO- là gốc fomat, C2H5- là gốc etyl → etyl fomat. Este này có mùi thơm của rượu rum.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xà phòng là", "options": ["A. hỗn hợp muối sodium của acid béo và glycerol.", "B. muối sodium (hoặc potassium) của các acid béo.", "C. este của glycerol với acid béo.", "D. muối calcium của các acid béo."], "answer": "B", "explain": "Xà phòng là muối sodium hoặc potassium của các acid béo (ví dụ C17H35COONa). Este của glycerol với acid béo là chất béo; muối calcium của acid béo là cặn (không phải xà phòng).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Carbohydrate nào sau đây có nhiều trong mật ong?", "options": ["A. Saccharose.", "B. Tinh bột.", "C. Fructose.", "D. Cellulose."], "answer": "C", "explain": "Mật ong chứa chủ yếu fructose và glucose (khoảng 38% fructose). Fructose là đường ngọt nhất trong các loại đường tự nhiên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sản phẩm của phản ứng giữa methylamine (CH3NH2) với dung dịch HCl là", "options": ["A. CH3Cl và NH3.", "B. CH3NH2.H2O.", "C. N2 và CH3Cl.", "D. CH3NH3Cl."], "answer": "D", "explain": "Amine có tính base nên tác dụng với acid tạo muối alkylammonium: CH3NH2 + HCl → CH3NH3Cl (methylammonium chloride).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Loại tơ nào sau đây là tơ thiên nhiên?", "options": ["A. Tơ nylon-6,6.", "B. Tơ capron.", "C. Tơ visco.", "D. Tơ tằm."], "answer": "D", "explain": "Tơ tằm là tơ thiên nhiên (protein). Nylon-6,6 và tơ capron là tơ tổng hợp; tơ visco là tơ bán tổng hợp (tơ nhân tạo).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Pin điện hóa là thiết bị", "options": ["A. biến đổi hóa năng thành điện năng.", "B. biến đổi điện năng thành hóa năng.", "C. biến đổi nhiệt năng thành điện năng.", "D. biến đổi quang năng thành điện năng."], "answer": "A", "explain": "Pin điện hóa (pin Galvani) biến đổi hóa năng của phản ứng oxi hóa - khử thành điện năng. Thiết bị biến điện năng thành hóa năng là bình điện phân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong các kim loại Na, Mg, Al, Fe, kim loại có tính khử mạnh nhất là", "options": ["A. Fe.", "B. Na.", "C. Al.", "D. Mg."], "answer": "B", "explain": "Trong dãy điện hóa, Na đứng trước Mg, Al, Fe nên có tính khử mạnh nhất trong các kim loại đã cho.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vôi sống có công thức hóa học là", "options": ["A. Ca(OH)2.", "B. CaCO3.", "C. CaO.", "D. CaSO4."], "answer": "C", "explain": "Vôi sống là CaO; vôi tôi là Ca(OH)2; đá vôi là CaCO3. CaO tác dụng với nước tạo Ca(OH)2 (phản ứng tôi vôi).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thủy phân este CH3COOC2H5 trong môi trường acid (H2SO4 loãng, đun nóng), sản phẩm thu được là", "options": ["A. CH3COONa và C2H5OH.", "B. CH3COOH và C2H5ONa.", "C. CH3COO- và C2H5OH.", "D. CH3COOH và C2H5OH."], "answer": "D", "explain": "Thủy phân este trong môi trường acid là phản ứng thuận nghịch: CH3COOC2H5 + H2O ⇌ CH3COOH + C2H5OH (xúc tác H+). Chỉ trong môi trường kiềm mới tạo muối carboxylate.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhỏ vài giọt dung dịch I2 vào lát cắt củ khoai lang, xuất hiện màu xanh tím. Kết luận nào sau đây đúng?", "options": ["A. Khoai lang chứa glucose.", "B. Khoai lang chứa fructose.", "C. Khoai lang chứa saccharose.", "D. Khoai lang chứa tinh bột."], "answer": "D", "explain": "Tinh bột hấp phụ I2 cho màu xanh tím đặc trưng (do cấu trúc xoắn của amylose). Đây là phản ứng đặc trưng để nhận biết tinh bột.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho 0,1 mol alanine (CH3CH(NH2)COOH) tác dụng vừa đủ với dung dịch HCl. Số mol HCl đã phản ứng là", "options": ["A. 0,1 mol.", "B. 0,2 mol.", "C. 0,3 mol.", "D. 0,05 mol."], "answer": "A", "explain": "Alanine có 1 nhóm -NH2 tác dụng với 1 HCl: CH3CH(NH2)COOH + HCl → CH3CH(NH3Cl)COOH. n(HCl) = n(alanine) = 0,1 mol.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điện phân dung dịch CuCl2 bằng điện cực trơ. Sản phẩm thu được ở hai điện cực là", "options": ["A. ở cathode thu được Cl2, ở anode thu được Cu.", "B. ở cathode thu được Cu, ở anode thu được Cl2.", "C. ở cathode thu được H2, ở anode thu được O2.", "D. ở cathode thu được Cu, ở anode thu được O2."], "answer": "B", "explain": "CuCl2 → Cu2+ + 2Cl-. Ở cathode: Cu2+ + 2e → Cu; ở anode: 2Cl- → Cl2 + 2e. Cl- bị oxi hóa dễ hơn H2O nên không có O2.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chất nào sau đây không tác dụng với Al2O3?", "options": ["A. Dung dịch HCl.", "B. Dung dịch NaOH đặc.", "C. Nước ở nhiệt độ thường.", "D. Dung dịch H2SO4 loãng."], "answer": "C", "explain": "Al2O3 là oxit lưỡng tính: tan trong acid và base mạnh, nhưng không tác dụng với nước ở nhiệt độ thường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho dung dịch FeCl2 tác dụng với khí Cl2 dư. Sản phẩm thu được là", "options": ["A. FeCl3 và HCl.", "B. Fe và Cl2.", "C. FeCl2 không phản ứng.", "D. FeCl3."], "answer": "D", "explain": "Cl2 oxi hóa Fe2+ lên Fe3+: 2FeCl2 + Cl2 → 2FeCl3. Đây cũng là cách nhận biết sự chuyển Fe(II) thành Fe(III).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đốt một muối của sodium trên ngọn lửa đèn khí không màu, ngọn lửa có màu", "options": ["A. đỏ cam.", "B. tím.", "C. vàng.", "D. xanh."], "answer": "C", "explain": "Phép thử màu ngọn lửa: Na+ cho màu vàng đặc trưng; K+ màu tím; Ca2+ màu đỏ cam. Đây là cách nhận biết nhanh ion kim loại kiềm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 13,6 gam phenyl axetat (CH3COOC6H5) tác dụng vừa đủ với dung dịch NaOH, đun nóng. Khối lượng NaOH đã phản ứng là", "options": ["A. 8,0 gam.", "B. 4,0 gam.", "C. 12,0 gam.", "D. 16,0 gam."], "answer": "A", "explain": "n(phenyl axetat) = 13,6/136 = 0,1 mol. Este của phenol: CH3COOC6H5 + 2NaOH → CH3COONa + C6H5ONa + H2O. n(NaOH) = 0,2 mol → m = 0,2 × 40 = 8,0 gam.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đốt cháy hoàn toàn 7,5 gam glycine (NH2CH2COOH), thể tích khí CO2 thu được ở đktc là", "options": ["A. 2,24 lít.", "B. 4,48 lít.", "C. 3,36 lít.", "D. 5,60 lít."], "answer": "B", "explain": "n(glycine) = 7,5/75 = 0,1 mol. NH2CH2COOH + 1,5O2 → 2CO2 + ... n(CO2) = 0,2 mol → V = 0,2 × 22,4 = 4,48 lít.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Hòa tan hoàn toàn 6,2 gam hỗn hợp gồm Na và K vào nước dư, thu được 2,24 lít khí H2 (đktc). Khối lượng Na trong hỗn hợp là", "options": ["A. 4,6 gam.", "B. 3,9 gam.", "C. 2,3 gam.", "D. 1,15 gam."], "answer": "C", "explain": "Gọi nNa = x, nK = y. Ta có: 23x + 39y = 6,2 và 0,5x + 0,5y = 2,24/22,4 = 0,1 → x + y = 0,2. Giải hệ: x = 0,1; y = 0,1. m(Na) = 0,1 × 23 = 2,3 gam.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Có ba ống nghiệm đựng riêng biệt các dung dịch: glucose, saccharose, tinh bột. Tiến hành nhận biết bằng dung dịch I2 và dung dịch AgNO3 trong NH3.", "statements": ["a) Ống đựng dung dịch tinh bột xuất hiện màu xanh tím khi thêm dung dịch I2.", "b) Trong hai ống còn lại, ống đựng glucose xuất hiện lớp bạc sáng khi thêm AgNO3/NH3 rồi đun nóng.", "c) Dung dịch saccharose cũng cho phản ứng tráng bạc tương tự glucose.", "d) Có thể dùng Cu(OH)2 ở nhiệt độ thường thay cho dung dịch I2 để nhận biết dung dịch tinh bột."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: phản ứng đặc trưng của tinh bột với I2. b) Đúng: glucose có nhóm -CHO nên tráng bạc. c) Sai: saccharose không có nhóm -CHO tự do. d) Sai: Cu(OH)2 chỉ nhận biết các chất có nhiều nhóm -OH kề nhau (glucose, saccharose, glycerol), không nhận biết tinh bột.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Điện phân dung dịch CuSO4 bằng điện cực trơ (graphite).", "statements": ["a) Ở cathode xuất hiện một lớp kim loại màu đỏ bám vào điện cực.", "b) Ở anode có khí không màu thoát ra.", "c) Màu xanh của dung dịch nhạt dần trong quá trình điện phân.", "d) pH của dung dịch tăng dần trong quá trình điện phân."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Cu2+ + 2e → Cu (màu đỏ). b) Đúng: 2H2O → O2 + 4H+ + 4e (khí O2 không màu). c) Đúng: nồng độ Cu2+ giảm. d) Sai: tạo H2SO4 nên pH giảm dần.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét methylamine (CH3NH2).", "statements": ["a) Methylamine là chất khí, tan rất tốt trong nước.", "b) Dung dịch methylamine làm quỳ tím chuyển sang màu xanh.", "c) Methylamine tác dụng với dung dịch HCl tạo thành muối CH3NH3Cl.", "d) Methylamine có tính base yếu hơn aniline."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: các amine đơn giản (C1-C3) là chất khí, tan tốt trong nước nhờ liên kết hydrogen. b) Đúng: amine là base. c) Đúng: CH3NH2 + HCl → CH3NH3Cl. d) Sai: gốc CH3 đẩy electron nên methylamine có tính base mạnh hơn NH3 và mạnh hơn aniline nhiều.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét kim loại nhôm và các ứng dụng của nó.", "statements": ["a) Trong không khí, bề mặt nhôm được bảo vệ bởi một lớp màng oxit Al2O3 mỏng, bền.", "b) Nhôm không tác dụng với dung dịch NaOH.", "c) Al(OH)3 vừa tan được trong dung dịch HCl, vừa tan được trong dung dịch NaOH.", "d) Phản ứng nhiệt nhôm được ứng dụng để hàn đường ray xe lửa."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: màng Al2O3 bảo vệ Al khỏi bị ăn mòn tiếp. b) Sai: 2Al + 2NaOH + 2H2O → 2NaAlO2 + 3H2. c) Đúng: Al(OH)3 lưỡng tính. d) Đúng: 2Al + Fe2O3 → 2Fe + Al2O3 tỏa nhiều nhiệt, dùng hàn đường ray.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho 20,4 gam phenyl axetat (CH3COOC6H5) tác dụng vừa đủ với dung dịch NaOH, đun nóng. Khối lượng NaOH đã phản ứng là bao nhiêu gam?", "answer": "12", "explain": "n(phenyl axetat) = 20,4/136 = 0,15 mol. CH3COOC6H5 + 2NaOH → CH3COONa + C6H5ONa + H2O. n(NaOH) = 0,3 mol → m = 0,3 × 40 = 12 gam.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Lên men 27,0 gam glucose thành rượu etylic với hiệu suất 90%. Thể tích khí CO2 thu được ở đktc là bao nhiêu lít?", "answer": "6.048", "explain": "n(glucose) = 27/180 = 0,15 mol. C6H12O6 → 2C2H5OH + 2CO2. n(CO2 lý thuyết) = 0,3 mol; thực tế = 0,3 × 0,9 = 0,27 mol → V = 0,27 × 22,4 = 6,048 lít.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho 0,15 mol alanine tác dụng tối đa với dung dịch NaOH 1 M. Thể tích dung dịch NaOH đã dùng là bao nhiêu mL?", "answer": "150", "explain": "Alanine có 1 nhóm -COOH tác dụng với 1 NaOH → n(NaOH) = 0,15 mol. V = 0,15/1 = 0,15 L = 150 mL.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Điện phân nóng chảy NaCl bằng điện cực trơ với cường độ dòng điện 5 A trong 3860 giây, hiệu suất 100%. Khối lượng Na thu được ở cathode là bao nhiêu gam? (F = 96500)", "answer": "4.6", "explain": "Na+ + 1e → Na. m = A·I·t/(n·F) = 23 × 5 × 3860/(1 × 96500) = 4,6 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Đốt cháy hoàn toàn 5,4 gam Al trong khí O2 dư. Khối lượng Al2O3 thu được là bao nhiêu gam?", "answer": "10.2", "explain": "n(Al) = 5,4/27 = 0,2 mol. 4Al + 3O2 → 2Al2O3. n(Al2O3) = 0,1 mol → m = 0,1 × 102 = 10,2 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Hòa tan hoàn toàn 11,2 gam CaO vào nước dư. Khối lượng Ca(OH)2 thu được là bao nhiêu gam?", "answer": "14.8", "explain": "n(CaO) = 11,2/56 = 0,2 mol. CaO + H2O → Ca(OH)2. n(Ca(OH)2) = 0,2 mol → m = 0,2 × 74 = 14,8 gam.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Este có mùi thơm của chuối chín là", "options": ["A. isoamyl axetat.", "B. etyl axetat.", "C. metyl fomat.", "D. etyl propionat."], "answer": "A", "explain": "Isoamyl axetat (CH3COOCH2CH2CH(CH3)2) có mùi thơm đặc trưng của chuối chín, dùng làm hương liệu thực phẩm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng về cellulose?", "options": ["A. Cellulose tan tốt trong nước lạnh.", "B. Cellulose là polymer thiên nhiên cấu tạo từ các gốc β-glucose.", "C. Cellulose cho phản ứng tráng bạc.", "D. Cellulose là chất béo."], "answer": "B", "explain": "Cellulose là polysaccharide cấu tạo từ các gốc β-glucose liên kết β-1,4-glycoside; không tan trong nước, không có tính khử.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phát biểu nào sau đây đúng về aniline?", "options": ["A. Aniline là chất khí, tan tốt trong nước.", "B. Aniline làm quỳ tím chuyển sang màu xanh.", "C. Aniline là chất lỏng, ít tan trong nước, có tính base rất yếu.", "D. Aniline là một amino acid."], "answer": "C", "explain": "Aniline (C6H5NH2) là chất lỏng, ít tan trong nước; cặp electron của N liên hợp với vòng benzene nên tính base rất yếu, không đổi màu quỳ tím.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khi đun nóng dung dịch lòng trắng trứng, hiện tượng xảy ra là", "options": ["A. dung dịch chuyển sang màu tím.", "B. xuất hiện kết tủa trắng rồi tan lại khi để nguội.", "C. không có hiện tượng gì.", "D. protein bị đông tụ tạo thành kết tủa trắng không tan lại."], "answer": "D", "explain": "Đun nóng làm protein bị biến tính, đông tụ thành kết tủa trắng và không tan trở lại khi để nguội. Đây là tính chất đặc trưng của protein.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cao su buna được điều chế bằng phản ứng trùng hợp monomer nào sau đây?", "options": ["A. CH2=CHCl.", "B. CH2=C(CH3)-CH=CH2.", "C. CH2=CH-CH=CH2.", "D. CH2=CH2."], "answer": "C", "explain": "nCH2=CH-CH=CH2 → (-CH2-CH=CH-CH2-)n (cao su buna). Isoprene cho cao su isoprene; vinyl chloride cho PVC.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong pin điện hóa, điện cực xảy ra quá trình khử được gọi là", "options": ["A. cực âm (anode).", "B. cực dương (cathode).", "C. cầu muối.", "D. điện cực trơ."], "answer": "B", "explain": "Quy ước: anode là cực xảy ra oxi hóa (cực âm trong pin), cathode là cực xảy ra khử (cực dương trong pin).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Kim loại dẫn điện tốt nhất là", "options": ["A. Ag.", "B. Cu.", "C. Al.", "D. Au."], "answer": "A", "explain": "Thứ tự dẫn điện giảm dần là Ag, Cu, Au, Al, ... Bạc dẫn điện tốt nhất trong các kim loại nhưng đắt nên dây dẫn thường dùng đồng, nhôm.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chất được dùng làm bột nở trong công nghiệp thực phẩm là", "options": ["A. Na2CO3.", "B. NaCl.", "C. NaHCO3.", "D. NaOH."], "answer": "C", "explain": "NaHCO3 (baking soda) bị nhiệt phân tạo CO2 làm bánh nở xốp: 2NaHCO3 → Na2CO3 + CO2 + H2O.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Este nào sau đây có mùi thơm của quả dứa?", "options": ["A. Isoamyl axetat.", "B. Etyl fomat.", "C. Metyl salicylat.", "D. Etyl butirat."], "answer": "D", "explain": "Etyl butirat (CH3CH2CH2COOC2H5) có mùi dứa; isoamyl axetat mùi chuối; metyl salicylat mùi dầu gió.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thủy phân hoàn toàn cellulose trong môi trường acid, thu được", "options": ["A. fructose.", "B. saccharose.", "C. maltose.", "D. glucose."], "answer": "D", "explain": "(C6H10O5)n + nH2O → nC6H12O6 (glucose) (xúc tác H+, đun nóng). Cellulose là polymer của β-glucose.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để phân biệt hai dung dịch mất nhãn: aniline và methylamine, có thể dùng", "options": ["A. dung dịch HCl.", "B. quỳ tím.", "C. dung dịch NaOH.", "D. nước bromine."], "answer": "B", "explain": "Methylamine làm quỳ tím hóa xanh; aniline có tính base quá yếu nên không đổi màu quỳ tím. Cả hai đều tác dụng với HCl và nước bromine nên không phân biệt được.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một mẫu polyethylene (PE) có khối lượng mol trung bình là 28000 g/mol. Số mắt xích trong phân tử polymer này là", "options": ["A. 1000.", "B. 500.", "C. 2000.", "D. 2800."], "answer": "A", "explain": "Mắt xích của PE là -CH2-CH2- (M = 28). Số mắt xích n = 28000/28 = 1000.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điện phân dung dịch NaOH bằng điện cực trơ, thực chất là quá trình", "options": ["A. điện phân NaOH thành Na và O2.", "B. điện phân NaCl thành NaOH và Cl2.", "C. điện phân nước thành H2 và O2.", "D. điện phân Na+ thành Na."], "answer": "C", "explain": "Na+ không bị khử trong dung dịch (thế điện cực rất âm), OH- khó bị oxi hóa hơn... thực tế: ở cathode 2H2O + 2e → H2 + 2OH-, ở anode 2H2O → O2 + 4H+ + 4e. Bản chất là điện phân nước, nồng độ NaOH tăng dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhúng một đinh sắt vào dung dịch CuSO4. Hiện tượng quan sát được là", "options": ["A. không có hiện tượng gì.", "B. đinh sắt tan ra, dung dịch nhạt màu.", "C. có khí không màu thoát ra.", "D. đinh sắt xuất hiện lớp kim loại màu đỏ, dung dịch xanh nhạt dần."], "answer": "D", "explain": "Fe + CuSO4 → FeSO4 + Cu. Kim loại Cu màu đỏ bám vào đinh sắt; ion Cu2+ (màu xanh) giảm nên dung dịch nhạt màu dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biện pháp nào sau đây loại bỏ được tính cứng tạm thời của nước?", "options": ["A. Thêm dung dịch HCl.", "B. Lọc qua than hoạt tính.", "C. Đun sôi nước.", "D. Thêm dung dịch NaCl."], "answer": "C", "explain": "Tính cứng tạm thời do Ca(HCO3)2, Mg(HCO3)2 gây ra; đun sôi: Ca(HCO3)2 → CaCO3 + CO2 + H2O, loại bỏ được các ion này.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đốt cháy hoàn toàn 8,8 gam một este no, đơn chức, mạch hở X thu được 8,96 lít CO2 (đktc). Khối lượng mol của X là", "options": ["A. 60 g/mol.", "B. 102 g/mol.", "C. 74 g/mol.", "D. 88 g/mol."], "answer": "D", "explain": "n(CO2) = 8,96/22,4 = 0,4 mol. Este CnH2nO2: nX = 0,4/n → M = 8,8·n/0,4 = 22n = 14n + 32 → n = 4 → M = 88 g/mol.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 9,0 gam etylamine tác dụng với dung dịch HCl dư. Khối lượng muối thu được là", "options": ["A. 12,75 gam.", "B. 16,30 gam.", "C. 10,10 gam.", "D. 8,15 gam."], "answer": "B", "explain": "n(C2H5NH2) = 9/45 = 0,2 mol. C2H5NH2 + HCl → C2H5NH3Cl. n(muối) = 0,2 mol → m = 0,2 × 81,5 = 16,3 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điện phân hai bình nối tiếp nhau bằng cùng một dòng điện: bình (1) đựng dung dịch CuSO4, bình (2) đựng dung dịch AgNO3 (điện cực trơ). Sau một thời gian, ở bình (1) thu được 3,2 gam Cu. Khối lượng Ag thu được ở bình (2) là", "options": ["A. 10,8 gam.", "B. 5,4 gam.", "C. 21,6 gam.", "D. 2,7 gam."], "answer": "A", "explain": "Hai bình nối tiếp → số mol electron đi qua bằng nhau. n(e) = 2·n(Cu) = 2 × 3,2/64 = 0,1 mol. Ở bình (2): Ag+ + 1e → Ag → n(Ag) = 0,1 mol → m = 0,1 × 108 = 10,8 gam.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Tiến hành thí nghiệm với dung dịch lòng trắng trứng (protein).", "statements": ["a) Đun nóng dung dịch lòng trắng trứng thấy xuất hiện kết tủa trắng.", "b) Nhỏ dung dịch CuSO4 vào dung dịch lòng trắng trứng thấy xuất hiện kết tủa.", "c) Các hiện tượng trên được gọi là sự đông tụ protein.", "d) Protein bị đông tụ sẽ tan trở lại khi để nguội hoặc thêm nước."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: nhiệt làm biến tính protein. b) Đúng: ion kim loại nặng (Cu2+, Pb2+) làm đông tụ protein. c) Đúng: đó là sự đông tụ protein. d) Sai: sự đông tụ (biến tính) là không thuận nghịch, protein không tan lại.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét pin điện hóa Zn-Cu có cầu muối.", "statements": ["a) Cầu muối giúp duy trì tính trung hòa điện cho hai dung dịch ở hai ngăn pin.", "b) Nếu bỏ cầu muối, pin vẫn hoạt động bình thường trong thời gian dài.", "c) Ion Zn2+ di chuyển qua cầu muối sang ngăn đựng dung dịch CuSO4.", "d) Sức điện động của pin thay đổi khi thay đổi nồng độ các dung dịch."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng: vai trò của cầu muối. b) Sai: không có cầu muối, mạch điện bị ngắt, pin ngừng hoạt động. c) Sai: ion trong cầu muối (K+, NO3-...) di chuyển để cân bằng điện tích, không phải Zn2+ đi qua cầu muối. d) Đúng: theo phương trình Nernst, E pin phụ thuộc nồng độ.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các amine: dimethylamine (CH3)2NH, aniline C6H5NH2, trimethylamine (CH3)3N.", "statements": ["a) Dimethylamine là amine bậc hai.", "b) Aniline là amine thơm bậc một.", "c) Trimethylamine không tác dụng được với dung dịch HCl.", "d) Bậc của amine được xác định theo số nguyên tử hydrogen trong NH3 bị thay thế bởi gốc hydrocarbon."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: N liên kết với 2 gốc CH3. b) Đúng: N liên kết với 1 gốc C6H5. c) Sai: mọi amine đều có tính base, tác dụng với HCl tạo muối. d) Đúng theo định nghĩa bậc amine.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét kim loại sắt và các phản ứng của nó.", "statements": ["a) Sắt tác dụng với khí chlorine (đun nóng) tạo thành FeCl3.", "b) Sắt tác dụng với dung dịch HCl loãng tạo thành FeCl2 và giải phóng H2.", "c) FeO là một oxit base, tác dụng được với dung dịch HCl.", "d) Fe2O3 tan được trong dung dịch NaOH đặc."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 2Fe + 3Cl2 → 2FeCl3. b) Đúng: Fe + 2HCl → FeCl2 + H2. c) Đúng: FeO + 2HCl → FeCl2 + H2O. d) Sai: Fe2O3 là oxit base, không tan trong NaOH (chỉ Al2O3, ZnO lưỡng tính mới tan).", "points": 1}, {"type": "short", "level": "VD", "q": "Đốt cháy hoàn toàn 8,8 gam một este no, đơn chức, mạch hở X thu được 8,96 lít CO2 (đktc). Khối lượng mol của X là bao nhiêu g/mol?", "answer": "88", "explain": "n(CO2) = 8,96/22,4 = 0,4 mol. Đặt X là CnH2nO2: nX = 0,4/n → M = 8,8·n/0,4 = 22n. Mặt khác M = 14n + 32 → 22n = 14n + 32 → n = 4 → M = 88 g/mol.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Thủy phân 68,4 gam saccharose với hiệu suất 80%. Khối lượng glucose thu được là bao nhiêu gam?", "answer": "28.8", "explain": "n(saccharose) = 68,4/342 = 0,2 mol. C12H22O11 + H2O → C6H12O6 + C6H12O6. n(glucose lý thuyết) = 0,2 mol; thực tế = 0,2 × 0,8 = 0,16 mol → m = 0,16 × 180 = 28,8 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho 0,2 mol methylamine tác dụng vừa đủ với dung dịch H2SO4 loãng. Khối lượng muối (CH3NH3)2SO4 thu được là bao nhiêu gam?", "answer": "12.4", "explain": "2CH3NH2 + H2SO4 → (CH3NH3)2SO4. n(muối) = 0,2/2 = 0,1 mol → m = 0,1 × 124 = 12,4 gam.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điện phân hai bình nối tiếp: bình (1) đựng dung dịch CuSO4, bình (2) đựng dung dịch AgNO3 (điện cực trơ). Sau một thời gian, ở bình (1) thu được 6,4 gam Cu. Khối lượng Ag thu được ở bình (2) là bao nhiêu gam?", "answer": "21.6", "explain": "Số mol electron qua hai bình bằng nhau: n(e) = 2·n(Cu) = 2 × 6,4/64 = 0,2 mol. Ag+ + 1e → Ag → n(Ag) = 0,2 mol → m = 0,2 × 108 = 21,6 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Hòa tan hoàn toàn 2,3 gam Na vào nước dư. Thể tích khí H2 thu được ở đktc là bao nhiêu lít?", "answer": "1.12", "explain": "n(Na) = 2,3/23 = 0,1 mol. 2Na + 2H2O → 2NaOH + H2. n(H2) = 0,05 mol → V = 0,05 × 22,4 = 1,12 lít.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trộn 10,8 gam bột Al với 32,0 gam Fe2O3 rồi tiến hành phản ứng nhiệt nhôm (hiệu suất 100%, không có không khí). Khối lượng Fe thu được tối đa là bao nhiêu gam?", "answer": "22.4", "explain": "n(Al) = 10,8/27 = 0,4 mol; n(Fe2O3) = 32/160 = 0,2 mol. 2Al + Fe2O3 → 2Fe + Al2O3: tỉ lệ vừa đủ (0,4/2 = 0,2/1). n(Fe) = 0,4 mol → m = 0,4 × 56 = 22,4 gam.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Khi xà phòng hóa một este no, đơn chức, mạch hở bằng dung dịch NaOH, tỉ lệ mol giữa este và NaOH là", "options": ["A. 1 : 2.", "B. 2 : 1.", "C. 1 : 1.", "D. 1 : 3."], "answer": "C", "explain": "RCOOR' + NaOH → RCOONa + R'OH: tỉ lệ mol 1 : 1. (Riêng este của phenol tỉ lệ 1 : 2.)", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Glycerol thuộc loại hợp chất nào sau đây?", "options": ["A. Acid đa chức.", "B. Aldehyde.", "C. Alcohol đơn chức.", "D. Alcohol đa chức."], "answer": "D", "explain": "Glycerol (C3H5(OH)3) có 3 nhóm -OH nên là alcohol đa chức. Nó hòa tan Cu(OH)2 tạo dung dịch xanh lam.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Maltose là một disaccharide được cấu tạo từ", "options": ["A. hai gốc glucose.", "B. một gốc glucose và một gốc fructose.", "C. hai gốc fructose.", "D. nhiều gốc glucose."], "answer": "A", "explain": "Maltose (đường mạch nha) gồm hai gốc glucose liên kết α-1,4-glycoside; thủy phân cho 2 phân tử glucose.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong công nghiệp, aniline được điều chế chủ yếu bằng cách", "options": ["A. cho benzene tác dụng với NH3.", "B. khử nitrobenzene bằng Fe trong dung dịch HCl.", "C. cho phenol tác dụng với NH3.", "D. oxi hóa toluene bằng không khí."], "answer": "B", "explain": "C6H5NO2 + 6[H] → C6H5NH2 + 2H2O (khử bằng Fe/HCl hoặc H2 xúc tác). Đây là phương pháp điều chế aniline trong công nghiệp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tơ nylon-6,6 được điều chế từ hai monomer là", "options": ["A. caprolactam.", "B. vinyl chloride và ethylene.", "C. terephthalic acid và ethylene glycol.", "D. hexamethylenediamine và adipic acid."], "answer": "D", "explain": "nH2N[CH2]6NH2 + nHOOC[CH2]4COOH → nylon-6,6 + 2nH2O (trùng ngưng). Caprolactam cho tơ capron (nylon-6).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cho E°(Cu2+/Cu) = +0,34 V. Giá trị này cho biết", "options": ["A. Cu có tính khử mạnh hơn H2.", "B. Cu2+ không có tính oxi hóa.", "C. cặp oxi hóa - khử Cu2+/Cu có tính oxi hóa mạnh hơn cặp 2H+/H2.", "D. Cu tác dụng được với dung dịch HCl loãng."], "answer": "C", "explain": "Thế điện cực chuẩn càng lớn thì dạng oxi hóa càng mạnh. E°(Cu2+/Cu) lớn hơn E°(2H+/H2) = 0 nên Cu2+ oxi hóa mạnh hơn H+, và Cu không khử được H+ (không tác dụng với HCl loãng).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong kĩ thuật mạ điện, vật cần mạ được nối với", "options": ["A. cực dương của nguồn điện.", "B. cầu muối.", "C. không nối với nguồn điện.", "D. cực âm của nguồn điện."], "answer": "D", "explain": "Vật cần mạ đóng vai trò cathode (cực âm): ion kim loại trong dung dịch bị khử và bám lên bề mặt vật. Anode thường là kim loại dùng để mạ (anode tan).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Duralumin (hợp kim nhẹ dùng trong công nghiệp hàng không) có thành phần chính là", "options": ["A. nhôm, đồng, magnesium, manganese.", "B. sắt, carbon, chromium.", "C. đồng, kẽm.", "D. nhôm, thiếc."], "answer": "A", "explain": "Duralumin chứa khoảng 95% Al cùng Cu, Mg, Mn: nhẹ, cứng, bền, dùng chế tạo máy bay. Đồng + kẽm là đồng thau; Fe-C-Cr là thép không gỉ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho mẩu K vào cốc nước có nhỏ vài giọt phenolphthalein. Hiện tượng quan sát được là", "options": ["A. mẩu K chìm xuống đáy cốc, dung dịch không màu.", "B. mẩu K tan dần, có khí thoát ra, dung dịch chuyển sang màu hồng.", "C. mẩu K không tan.", "D. mẩu K bốc cháy trong không khí trước khi chạm nước."], "answer": "B", "explain": "2K + 2H2O → 2KOH + H2. KOH làm phenolphthalein hóa hồng; H2 thoát ra. K nhẹ hơn nước nên nổi và tan dần.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đốt cháy Mg trong khí CO2, sản phẩm thu được là", "options": ["A. MgO và CO.", "B. MgCO3.", "C. Mg(OH)2 và C.", "D. MgO và C."], "answer": "D", "explain": "2Mg + CO2 → 2MgO + C. Mg cháy được trong CO2 nên không dùng CO2 để dập đám cháy magnesium.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho Al vào dung dịch HNO3 đặc, nguội. Hiện tượng xảy ra là", "options": ["A. Al tan nhanh, giải phóng khí NO2.", "B. Al tan chậm, giải phóng H2.", "C. Al không tan do bị thụ động hóa.", "D. Al tan tạo thành Al(NO3)2."], "answer": "C", "explain": "Al, Fe, Cr bị thụ động hóa trong HNO3 đặc, nguội (và H2SO4 đặc, nguội) do tạo màng oxit bảo vệ. Vì vậy dùng thùng nhôm để đựng HNO3 đặc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Gang xám được dùng chủ yếu để", "options": ["A. luyện thép.", "B. làm dây điện.", "C. chế tạo nam châm.", "D. đúc các chi tiết máy, ống nước."], "answer": "D", "explain": "Gang xám (chứa graphite) kém cứng, dễ đúc, chịu nén tốt nên dùng đúc chi tiết máy. Gang trắng cứng, giòn, dùng luyện thép.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho 7,5 gam glycine tác dụng vừa đủ với dung dịch NaOH. Khối lượng muối thu được là", "options": ["A. 9,7 gam.", "B. 11,1 gam.", "C. 8,9 gam.", "D. 7,5 gam."], "answer": "A", "explain": "n(glycine) = 7,5/75 = 0,1 mol. NH2CH2COOH + NaOH → NH2CH2COONa + H2O. n(muối) = 0,1 mol → m = 0,1 × 97 = 9,7 gam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Số đồng phân cấu tạo là amine của hợp chất có công thức phân tử C3H9N là", "options": ["A. 3.", "B. 4.", "C. 2.", "D. 5."], "answer": "B", "explain": "Các amine C3H9N: CH3CH2CH2NH2, (CH3)2CHNH2, CH3CH2NHCH3, (CH3)3N. Tổng 4 đồng phân (2 bậc một, 1 bậc hai, 1 bậc ba).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đốt cháy hoàn toàn 8,6 gam metyl acrylat (CH2=CHCOOCH3), thể tích khí CO2 thu được ở đktc là", "options": ["A. 4,48 lít.", "B. 6,72 lít.", "C. 8,96 lít.", "D. 13,44 lít."], "answer": "C", "explain": "n(metyl acrylat) = 8,6/86 = 0,1 mol. C4H6O2 + 5O2 → 4CO2 + 3H2O. n(CO2) = 0,4 mol → V = 0,4 × 22,4 = 8,96 lít.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 10,2 gam một este no, đơn chức, mạch hở X tác dụng vừa đủ với dung dịch NaOH, thu được 9,6 gam muối khan. Khối lượng mol của X là", "options": ["A. 74 g/mol.", "B. 88 g/mol.", "C. 102 g/mol.", "D. 116 g/mol."], "answer": "C", "explain": "Este etyl (RCOOC2H5): m(muối) - m(este) = n×(23 - 29) = -6n → n = (10,2 - 9,6)/6 = 0,1 mol → M(X) = 10,2/0,1 = 102 g/mol (etyl propionat).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho 8,9 gam alanine tác dụng với dung dịch NaOH dư. Khối lượng muối thu được là", "options": ["A. 9,70 gam.", "B. 11,10 gam.", "C. 9,75 gam.", "D. 8,90 gam."], "answer": "B", "explain": "n(alanine) = 8,9/89 = 0,1 mol. CH3CH(NH2)COOH + NaOH → CH3CH(NH2)COONa + H2O. n(muối) = 0,1 mol → m = 0,1 × 111 = 11,1 gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điện phân 500 mL dung dịch CuSO4 0,4 M bằng điện cực trơ với cường độ dòng điện 5 A đến khi nồng độ CuSO4 trong dung dịch còn lại 0,1 M thì dừng điện phân. Thời gian điện phân là", "options": ["A. 5790 giây.", "B. 2895 giây.", "C. 11580 giây.", "D. 1930 giây."], "answer": "A", "explain": "n(Cu2+ bị điện phân) = 0,5 × (0,4 - 0,1) = 0,15 mol → n(e) = 0,3 mol. t = n(e)·F/I = 0,3 × 96500/5 = 5790 giây.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Tiến hành thí nghiệm điều chế etyl axetat: cho khoảng 2 mL ethanol, 2 mL acetic acid và vài giọt H2SO4 đặc vào ống nghiệm, đun nóng nhẹ rồi để nguội.", "statements": ["a) Trong thí nghiệm trên đã xảy ra phản ứng este hóa tạo thành etyl axetat.", "b) H2SO4 đặc trong thí nghiệm vừa đóng vai trò xúc tác, vừa hút nước để chuyển dịch cân bằng.", "c) Este tạo thành ít tan trong nước và nhẹ hơn nước nên nổi lên trên.", "d) Có thể thay H2SO4 đặc bằng dung dịch HCl đặc mà hiệu quả điều chế không đổi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: CH3COOH + C2H5OH ⇌ CH3COOC2H5 + H2O. b) Đúng: vai trò kép của H2SO4 đặc. c) Đúng: este nổi lên trên, có mùi thơm. d) Sai: HCl đặc dễ bay hơi, không hút nước mạnh nên hiệu quả kém.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Cho một mẩu nhôm vào ống nghiệm đựng dung dịch NaOH loãng.", "statements": ["a) Quan sát thấy có khí không màu thoát ra.", "b) Mẩu nhôm tan dần đến hết.", "c) Khí thoát ra là khí oxygen.", "d) Dung dịch thu được chứa muối NaAlO2."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: 2Al + 2NaOH + 2H2O → 2NaAlO2 + 3H2. b) Đúng: Al tan hết trong NaOH dư. c) Sai: khí thoát ra là H2. d) Đúng: sản phẩm là sodium aluminate.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Tiến hành mạ bạc lên một chiếc thìa bằng sắt.", "statements": ["a) Chiếc thìa được nối với cực âm của nguồn điện.", "b) Cực dương được làm bằng bạc (anode tan).", "c) Dung dịch điện phân phải chứa ion Ag+.", "d) Trong quá trình mạ, khối lượng cực dương tăng dần."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: vật cần mạ là cathode. b) Đúng: Ag ở anode bị oxi hóa bổ sung Ag+ cho dung dịch. c) Đúng: thường dùng dung dịch AgNO3. d) Sai: anode bằng bạc tan dần nên khối lượng giảm.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét về thép và gang.", "statements": ["a) Thép là hợp kim của sắt với carbon, hàm lượng carbon thường dưới 2%.", "b) Thép không gỉ có thêm các nguyên tố chromium, nickel nên khó bị ăn mòn.", "c) Gang cứng và giòn hơn thép.", "d) Mọi loại thép đều không bị ăn mòn trong không khí ẩm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng theo định nghĩa. b) Đúng: Cr, Ni tạo màng oxit bảo vệ. c) Đúng: gang chứa 2-5% C nên cứng, giòn. d) Sai: chỉ thép không gỉ (hoặc thép hợp kim đặc biệt) mới chống ăn mòn tốt; thép carbon thường vẫn bị gỉ.", "points": 1}, {"type": "short", "level": "VD", "q": "Cho 8,6 gam metyl acrylat (CH2=CHCOOCH3) tác dụng vừa đủ với dung dịch Br2. Khối lượng Br2 đã phản ứng là bao nhiêu gam?", "answer": "16", "explain": "n(metyl acrylat) = 8,6/86 = 0,1 mol. CH2=CHCOOCH3 + Br2 → CH2BrCHBrCOOCH3 (tỉ lệ 1:1). n(Br2) = 0,1 mol → m = 0,1 × 160 = 16 gam.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Lên men giấm 45,0 gam glucose với hiệu suất 80% (quá trình gồm 2 giai đoạn). Khối lượng acetic acid thu được là bao nhiêu gam?", "answer": "24", "explain": "n(glucose) = 45/180 = 0,25 mol. C6H12O6 → 2CH3COOH (tính chung cả 2 giai đoạn). n(acid lý thuyết) = 0,5 mol; thực tế = 0,5 × 0,8 = 0,4 mol → m = 0,4 × 60 = 24 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Cho 0,25 mol glycine tác dụng tối đa với dung dịch NaOH 2 M. Thể tích dung dịch NaOH đã dùng là bao nhiêu mL?", "answer": "125", "explain": "NH2CH2COOH + NaOH → NH2CH2COONa + H2O (tỉ lệ 1:1). n(NaOH) = 0,25 mol → V = 0,25/2 = 0,125 L = 125 mL.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Điện phân nóng chảy Al2O3 (có mặt cryolite) với cường độ dòng điện 10 A trong 19300 giây, hiệu suất 100%. Khối lượng Al thu được là bao nhiêu gam? (F = 96500)", "answer": "18", "explain": "Al3+ + 3e → Al. m = A·I·t/(n·F) = 27 × 10 × 19300/(3 × 96500) = 18 gam.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Hòa tan hoàn toàn 7,8 gam K vào nước dư. Thể tích khí H2 thu được ở đktc là bao nhiêu lít?", "answer": "2.24", "explain": "n(K) = 7,8/39 = 0,2 mol. 2K + 2H2O → 2KOH + H2. n(H2) = 0,1 mol → V = 0,1 × 22,4 = 2,24 lít.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Hòa tan hoàn toàn 6,0 gam Mg trong dung dịch HCl dư. Thể tích khí H2 thu được ở đktc là bao nhiêu lít?", "answer": "5.6", "explain": "n(Mg) = 6/24 = 0,25 mol. Mg + 2HCl → MgCl2 + H2. n(H2) = 0,25 mol → V = 0,25 × 22,4 = 5,6 lít.", "points": 0.5}]}]}
