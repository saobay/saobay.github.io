<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "VDC", "q": "Xét đoạn mã sắp xếp chèn sau (mảng a có n = 5 phần tử, chỉ số từ 0):\n\ndem = 0\nVới i chạy từ 1 đến 4:\n    x = a[i]\n    j = i - 1\n    Trong khi j lớn hơn hoặc bằng 0 và a[j] lớn hơn x:\n        a[j + 1] = a[j]\n        j = j - 1\n        dem = dem + 1\n    a[j + 1] = x\n\nVới a = [7, 3, 9, 1, 5], hỏi sau khi thực hiện xong, biến dem bằng bao nhiêu?", "options": ["A. 4", "B. 5", "C. 6", "D. 8"], "answer": "C", "explain": "Truy vết từng bước (dem đếm số lần dịch chuyển phần tử sang phải):\n- i = 1, x = 3: a[0] = 7 lớn hơn 3 nên dịch 1 lần (dem = 1), mảng thành [3, 7, 9, 1, 5].\n- i = 2, x = 9: a[1] = 7 không lớn hơn 9 nên không dịch (dem = 1).\n- i = 3, x = 1: dịch 9, 7, 3 (3 lần, dem = 4), mảng thành [1, 3, 7, 9, 5].\n- i = 4, x = 5: dịch 9, 7 (2 lần, dem = 6), a[1] = 3 không lớn hơn 5 nên dừng; mảng thành [1, 3, 5, 7, 9].\nTổng cộng dem = 6. Đáp án C.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Xét một bước phân hoạch Lomuto của QuickSort trên mảng a = [8, 3, 10, 1, 6, 4] với chốt pivot = a[5] = 4:\n\ni = -1\nVới j chạy từ 0 đến 4:\n    Nếu a[j] nhỏ hơn hoặc bằng pivot:\n        i = i + 1\n        đổi chỗ a[i] và a[j]\nđổi chỗ a[i + 1] và a[5]\n\nHỏi mảng a sau bước phân hoạch và tổng số lần thực hiện lệnh đổi chỗ (kể cả khi đổi một phần tử với chính nó)?", "options": ["A. [3, 1, 4, 8, 6, 10] và 3 lần", "B. [3, 1, 4, 8, 6, 10] và 2 lần", "C. [1, 3, 4, 8, 6, 10] và 3 lần", "D. [3, 1, 8, 4, 6, 10] và 3 lần"], "answer": "A", "explain": "Truy vết với pivot = 4:\n- j = 0: a[0] = 8 lớn hơn 4, bỏ qua.\n- j = 1: a[1] = 3 nhỏ hơn hoặc bằng 4: i = 0, đổi chỗ a[0] với a[1] (lần 1), mảng thành [3, 8, 10, 1, 6, 4].\n- j = 2: a[2] = 10 lớn hơn 4, bỏ qua.\n- j = 3: a[3] = 1 nhỏ hơn hoặc bằng 4: i = 1, đổi chỗ a[1] với a[3] (lần 2), mảng thành [3, 1, 10, 8, 6, 4].\n- j = 4: a[4] = 6 lớn hơn 4, bỏ qua.\n- Cuối: đổi chỗ a[2] với a[5] (lần 3), mảng thành [3, 1, 4, 8, 6, 10].\nVậy mảng là [3, 1, 4, 8, 6, 10] và có 3 lần đổi chỗ. Đáp án A.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Xét đoạn mã:\n\ndem = 0\ni = 1\nTrong khi i nhỏ hơn hoặc bằng n:\n    j = 1\n    Trong khi j nhỏ hơn hoặc bằng n:\n        dem = dem + 1\n        j = j * 2\n    i = i * 2\n\nĐộ phức tạp thời gian của đoạn mã theo n là gì?", "options": ["A. $O(n)$", "B. $O(n \\log n)$", "C. $O((\\log n)^2)$", "D. $O(n^2)$"], "answer": "C", "explain": "Vòng lặp ngoài: i nhận các giá trị $1, 2, 4, 8, \\dots$ (nhân đôi mỗi lần) nên số lần lặp là $\\lfloor \\log_2 n \\rfloor + 1 = O(\\log n)$. Với mỗi lần lặp ngoài, vòng lặp trong cũng cho j chạy $1, 2, 4, \\dots$ nên cũng lặp $O(\\log n)$ lần. Tổng số lần thực hiện dem = dem + 1 là $O(\\log n) \\times O(\\log n) = O((\\log n)^2)$. Đáp án C.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Xét thuật toán tìm kiếm nhị phân trên mảng đã sắp xếp a = [2, 5, 8, 12, 16, 23, 38, 56, 72, 91] để tìm x = 20:\n\ntrai = 0\nphai = 9\ndem = 0\nTrong khi trai nhỏ hơn hoặc bằng phai:\n    dem = dem + 1\n    giua = (trai + phai) // 2\n    Nếu a[giua] bằng x:\n        dừng và in dem\n    Ngược lại nếu a[giua] nhỏ hơn x:\n        trai = giua + 1\n    Ngược lại:\n        phai = giua - 1\n\nBiến dem bằng bao nhiêu khi thuật toán kết thúc (x = 20 không có trong mảng)?", "options": ["A. 2", "B. 3", "C. 4", "D. 5"], "answer": "B", "explain": "Truy vết (mỗi lần lặp dem tăng 1 trước khi tính giua):\n- Lần 1: trai = 0, phai = 9, giua = 4, a[4] = 16 nhỏ hơn 20 nên trai = 5.\n- Lần 2: trai = 5, phai = 9, giua = 7, a[7] = 56 lớn hơn 20 nên phai = 6.\n- Lần 3: trai = 5, phai = 6, giua = 5, a[5] = 23 lớn hơn 20 nên phai = 4.\n- Kiểm tra điều kiện lặp: trai = 5 lớn hơn phai = 4 nên dừng.\nVậy dem = 3. Đáp án B.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Khi trộn hai mảng đã sắp xếp tăng dần a = [1, 5, 9, 13] và b = [2, 6, 7, 10, 14] bằng thuật toán trộn của MergeSort, người ta đếm mỗi lần thực hiện phép so sánh một phần tử của a với một phần tử của b (khi một trong hai mảng đã hết thì chép nốt phần còn lại mà không so sánh nữa). Hỏi tổng số phép so sánh đã thực hiện?", "options": ["A. 7", "B. 8", "C. 9", "D. 10"], "answer": "B", "explain": "Truy vết quá trình trộn (mỗi lần so sánh a[i] với b[j]):\n1 và 2 so sánh, lấy 1; 5 và 2 so sánh, lấy 2; 5 và 6 so sánh, lấy 5; 9 và 6 so sánh, lấy 6; 9 và 7 so sánh, lấy 7; 9 và 10 so sánh, lấy 9; 13 và 10 so sánh, lấy 10; 13 và 14 so sánh, lấy 13. Mảng a đã hết nên chép nốt 14 mà không so sánh nữa.\nTổng cộng 8 phép so sánh. Đáp án B.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho mảng a gồm n số nguyên (n có thể tới $10^6$) và số nguyên K. Cần đếm số cặp chỉ số (i, j) với i nhỏ hơn j sao cho a[i] + a[j] = K. Phương án nào sau đây đúng và hiệu quả nhất?", "options": ["A. Duyệt mọi cặp (i, j) bằng hai vòng lặp lồng nhau, độ phức tạp $O(n^2)$: đơn giản và đủ nhanh với n = $10^6$.", "B. Sắp xếp mảng rồi với mỗi phần tử dùng tìm kiếm nhị phân để tìm giá trị K - a[i], độ phức tạp $O(n \\log n)$: đây là cách tối ưu.", "C. Duyệt mảng một lần, dùng bảng băm lưu số lần xuất hiện của các giá trị đã gặp; với mỗi a[j], cộng thêm số lần xuất hiện của giá trị K - a[j]; độ phức tạp trung bình $O(n)$.", "D. Sắp xếp mảng rồi dùng kỹ thuật hai con trỏ, tổng độ phức tạp $O(n)$."], "answer": "C", "explain": "Phân tích từng phương án:\n- A sai: $n^2 = 10^{12}$ phép tính là không khả thi.\n- B đúng nhưng chưa tối ưu (còn $O(n \\log n)$).\n- D sai: chỉ riêng bước sắp xếp đã tốn $O(n \\log n)$, không thể có tổng $O(n)$.\n- C đúng và tối ưu: mỗi phần tử chỉ cần một lần tra bảng băm $O(1)$ trung bình; vì chỉ đếm các chỉ số i nhỏ hơn j đã duyệt qua nên mỗi cặp được đếm đúng một lần. Đáp án C.", "points": 0.25}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về các thuật toán sắp xếp:", "statements": ["a) Thuật toán sắp xếp nổi bọt (bản không có cờ hiệu dừng sớm) trên mảng đã sắp xếp tăng dần vẫn thực hiện đúng $n(n-1)/2$ phép so sánh.", "b) Thuật toán QuickSort có độ phức tạp $O(n \\log n)$ trong mọi trường hợp.", "c) Thuật toán MergeSort cần thêm bộ nhớ phụ cỡ $O(n)$.", "d) Với mảng có kích thước rất nhỏ (ví dụ n không vượt quá 20), sắp xếp chèn trong thực tế thường chạy nhanh hơn QuickSort nhờ hằng số ẩn nhỏ và không tốn chi phí đệ quy."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng: bản nổi bọt không có cờ hiệu luôn thực hiện đủ $n(n-1)/2$ phép so sánh bất kể dữ liệu vào.\nb) Sai: QuickSort có trường hợp xấu $O(n^2)$ (ví dụ mảng đã sắp xếp mà luôn chọn chốt là phần tử đầu/cuối).\nc) Đúng: bước trộn cần mảng phụ để chứa kết quả, tốn thêm bộ nhớ $O(n)$.\nd) Đúng: đây chính là lý do các thuật toán sắp xếp lai (như TimSort, Introsort) chuyển sang sắp xếp chèn với đoạn mảng nhỏ.", "points": 1}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về tìm kiếm và độ phức tạp:", "statements": ["a) Tìm kiếm nhị phân chỉ áp dụng được khi dãy đã được sắp xếp.", "b) Với n đủ lớn, $O(2^n)$ tăng nhanh hơn $O(n!)$.", "c) Thuật toán $O(n \\log n)$ với n = $10^6$ thường chạy xong trong khoảng 1 giây trên máy tính hiện nay, còn thuật toán $O(n^2)$ thì không.", "d) Hằng số ẩn trong ký hiệu $O(1)$ luôn nhỏ hơn hằng số ẩn trong ký hiệu $O(n)$."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: tìm kiếm nhị phân dựa vào tính có thứ tự để loại bỏ một nửa đoạn tìm kiếm.\nb) Sai: $n!$ tăng nhanh hơn $2^n$ khi n đủ lớn (ví dụ $10! = 3628800$ lớn hơn $2^{10} = 1024$).\nc) Đúng: $10^6 \\log_2 10^6 \\approx 2 \\times 10^7$ phép tính là khả thi trong khoảng 1 giây, còn $10^{12}$ phép tính thì cần hàng giờ.\nd) Sai: ký hiệu O chỉ mô tả tốc độ tăng trưởng tiệm cận, hằng số ẩn của $O(1)$ có thể rất lớn (ví dụ một phép tính $O(1)$ tốn $10^9$ phép tính cơ bản).", "points": 1}, {"type": "short", "level": "VDC", "q": "Xét đoạn mã sắp xếp chọn (chỉ đổi chỗ khi tìm được vị trí nhỏ hơn vị trí đang xét):\n\ndem = 0\nVới i chạy từ 0 đến 3:\n    m = i\n    Với j chạy từ i + 1 đến 4:\n        Nếu a[j] nhỏ hơn a[m]:\n            m = j\n    Nếu m khác i:\n        đổi chỗ a[i] và a[m]\n        dem = dem + 1\n\nVới a = [6, 2, 8, 4, 1], hỏi biến dem bằng bao nhiêu khi kết thúc?", "answer": "3", "explain": "Truy vết:\n- i = 0: giá trị nhỏ nhất đoạn [0..4] là 1 tại m = 4, khác 0 nên đổi chỗ (dem = 1), mảng thành [1, 2, 8, 4, 6].\n- i = 1: giá trị nhỏ nhất đoạn [1..4] là 2 tại m = 1, trùng i nên không đổi chỗ (dem = 1).\n- i = 2: giá trị nhỏ nhất đoạn [2..4] là 4 tại m = 3, khác 2 nên đổi chỗ (dem = 2), mảng thành [1, 2, 4, 8, 6].\n- i = 3: giá trị nhỏ nhất đoạn [3..4] là 6 tại m = 4, khác 3 nên đổi chỗ (dem = 3), mảng thành [1, 2, 4, 6, 8].\nVậy dem = 3.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đoạn mã sau in ra giá trị nào?\n\ns = 0\nVới i chạy từ 1 đến 100:\n    Nếu i chia hết cho 3 hoặc i chia hết cho 5:\n        s = s + i\nIn s", "answer": "2418", "explain": "s là tổng các số từ 1 đến 100 chia hết cho 3 hoặc chia hết cho 5. Dùng nguyên lý bao hàm - loại trừ:\n- Tổng các bội của 3: $3 \\times (1 + 2 + \\dots + 33) = 3 \\times 561 = 1683$.\n- Tổng các bội của 5: $5 \\times (1 + 2 + \\dots + 20) = 5 \\times 210 = 1050$.\n- Tổng các bội của 15 (bị cộng hai lần): $15 \\times (1 + 2 + \\dots + 6) = 15 \\times 21 = 315$.\nVậy s = 1683 + 1050 - 315 = 2418.", "points": 0.5}]}]}
