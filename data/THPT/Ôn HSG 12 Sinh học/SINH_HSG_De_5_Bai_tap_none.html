<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 5","questions":[{"type":"mcq","level":"VDC","q":"Plasmid pBR322 dùng làm thể truyền có hai gene đánh dấu: ampR (kháng ampicillin) và tetR (kháng tetracycline); vị trí cắt duy nhất của enzyme EcoRI nằm BÊN TRONG gene tetR. Sau khi cắt plasmid và đoạn gene ngoại bằng EcoRI, nối lại bằng ligase rồi biến nạp vào vi khuẩn E. coli, muốn chọn ra vi khuẩn mang plasmid tái tổ hợp (đã nhận gene ngoại), cần làm như thế nào?","options":["A. Nuôi vi khuẩn trên môi trường có tetracycline; khuẩn mọc được chính là khuẩn mang plasmid tái tổ hợp.","B. Nuôi vi khuẩn trên môi trường có ampicillin, sau đó cấy chuyển sang môi trường có tetracycline; khuẩn mọc trên ampicillin nhưng KHÔNG mọc trên tetracycline chính là khuẩn mang plasmid tái tổ hợp.","C. Nuôi vi khuẩn trên môi trường không có kháng sinh; khuẩn mọc nhanh nhất là khuẩn mang plasmid tái tổ hợp.","D. Nuôi vi khuẩn đồng thời trên cả ampicillin và tetracycline; khuẩn mọc được mang plasmid tái tổ hợp."],"answer":"B","explain":"Vi khuẩn nhận được plasmid (dù tái tổ hợp hay plasmid nguyên) đều kháng ampicillin vì gene ampR còn nguyên vẹn → mọc trên môi trường có ampicillin chứng tỏ đã nhận plasmid. Đoạn gene ngoại chèn vào vị trí EcoRI nằm bên trong gene tetR → phá vỡ cấu trúc gene tetR (bất hoạt do chèn — insertional inactivation) → plasmid tái tổ hợp mất khả năng kháng tetracycline. Vậy khuẩn mọc trên ampicillin nhưng không mọc trên tetracycline chính là khuẩn mang plasmid tái tổ hợp.","points":0.25},{"type":"mcq","level":"VDC","q":"Một phản ứng PCR có hiệu suất khuếch đại thực tế là 90% mỗi chu kì (thay vì 100% như lí thuyết). Xuất phát từ 10 phân tử DNA khuôn, sau 3 chu kì sẽ thu được khoảng bao nhiêu phân tử DNA?","options":["A. 80","B. 60","C. 69","D. 30"],"answer":"C","explain":"Hiệu suất 90% nghĩa là mỗi chu kì số phân tử DNA tăng gấp 1,9 lần (chứ không phải 2 lần như lí thuyết). Sau 3 chu kì: 10 × 1,9³ = 10 × 6,859 ≈ 69 phân tử. (Lí thuyết 100% sẽ được 10 × 2³ = 80 phân tử; thực tế luôn thấp hơn do primer, enzyme Taq polymerase và dNTP không hoạt động tối ưu.)","points":0.25},{"type":"mcq","level":"VDC","q":"Bằng phương pháp chiếu xạ gây đột biến nhân tạo, người ta tạo được dòng lúa có năng suất cao hơn 20% so với giống gốc. Để khẳng định tính trạng năng suất cao này là do đột biến gene (di truyền được) chứ không phải thường biến do điều kiện chăm sóc, cần tiến hành:","options":["A. Trồng dòng lúa mới trong điều kiện tối ưu thêm một vụ rồi so sánh năng suất.","B. Chiếu xạ thêm một lần nữa để tạo năng suất cao hơn.","C. Lai dòng lúa mới với giống gốc để tạo ưu thế lai.","D. Cho dòng lúa mới tự thụ phấn (hoặc nhân giống) qua nhiều thế hệ trong điều kiện chuẩn, kiểm tra xem tính trạng có di truyền ổn định hay không."],"answer":"D","explain":"Thường biến do môi trường gây ra nên không di truyền; đột biến gene làm thay đổi kiểu gene nên di truyền được. Tiêu chí phân biệt duy nhất: gieo trồng qua nhiều thế hệ trong điều kiện đồng nhất, chuẩn hóa — nếu năng suất cao được duy trì ổn định qua các thế hệ → do kiểu gene (đột biến); nếu trở về mức như giống gốc → chỉ là thường biến. Đây là nguyên tắc cơ bản trong chọn giống: kiểu hình = kiểu gene + môi trường, muốn kết luận về gene phải cố định môi trường.","points":0.25},{"type":"mcq","level":"VDC","q":"Một trẻ được tiêm vaccine sởi (chứa virus sởi đã làm yếu). Vài năm sau, khi tiếp xúc với virus sởi thật ngoài môi trường, trẻ không mắc bệnh. Cơ chế bảo vệ này thuộc loại miễn dịch nào?","options":["A. Miễn dịch chủ động nhân tạo (cơ thể tự tạo kháng thể và tế bào nhớ sau khi tiếp xúc kháng nguyên của vaccine).","B. Miễn dịch thụ động nhân tạo (nhận kháng thể có sẵn từ bên ngoài).","C. Miễn dịch bẩm sinh (không đặc hiệu, có sẵn từ khi sinh ra).","D. Miễn dịch chủ động tự nhiên (do từng mắc bệnh thật rồi khỏi)."],"answer":"A","explain":"Vaccine đưa kháng nguyên (virus sởi đã làm yếu, không gây bệnh) vào cơ thể → hệ miễn dịch đáp ứng chủ động: tạo kháng thể đặc hiệu và quan trọng nhất là các tế bào lympho nhớ (B nhớ, T nhớ). Khi gặp virus sởi thật, đáp ứng miễn dịch thứ phát diễn ra nhanh và mạnh, tiêu diệt mầm bệnh trước khi gây bệnh. Gọi là 'nhân tạo' vì kháng nguyên do con người chủ động đưa vào (khác 'tự nhiên' là mắc bệnh thật), và 'chủ động' vì cơ thể tự sản xuất kháng thể (khác 'thụ động' là tiêm kháng thể có sẵn).","points":0.25},{"type":"mcq","level":"VDC","q":"Thí nghiệm đo cường độ quang hợp của một loài cây cho thấy: khi tăng nồng độ CO2 từ 0,03% lên 0,1%, cường độ quang hợp tăng mạnh; nhưng khi tăng tiếp từ 0,1% lên 0,5%, cường độ quang hợp hầu như không tăng thêm (điều kiện ánh sáng và nhiệt độ không đổi). Kết luận đúng rút ra từ thí nghiệm là:","options":["A. Nồng độ CO2 không ảnh hưởng đến cường độ quang hợp.","B. CO2 là nhân tố giới hạn đến nồng độ khoảng 0,1%; vượt ngưỡng này, nhân tố giới hạn chuyển sang ánh sáng, nhiệt độ hoặc các yếu tố khác.","C. Cường độ quang hợp luôn tỉ lệ thuận với nồng độ CO2 ở mọi nồng độ.","D. Cây đã bị ngộ độc CO2 ở nồng độ 0,5%."],"answer":"B","explain":"Đường cong đáp ứng có dạng bão hòa: ở nồng độ thấp, CO2 là nhân tố giới hạn (tăng CO2 → tăng quang hợp); đến điểm bão hòa (khoảng 0,1%), các nhân tố khác như cường độ ánh sáng, nhiệt độ hoặc hoạt tính của enzyme Rubisco trở thành giới hạn nên tăng thêm CO2 không còn tác dụng. Đây là cơ sở khoa học của việc bón CO2 trong nhà kính: chỉ hiệu quả đến ngưỡng bão hòa, tăng quá ngưỡng chỉ gây lãng phí.","points":0.25},{"type":"mcq","level":"VDC","q":"Bệnh phenylketone niệu (PKU) do gene lặn nằm trên NST thường quy định. Một cặp vợ chồng đều bình thường; người vợ có một em trai bị PKU, người chồng cũng có một em trai bị PKU. Xác suất để cặp vợ chồng này sinh con đầu lòng bị PKU là bao nhiêu?","options":["A. 1/4","B. 1/16","C. 1/9","D. 2/3"],"answer":"C","explain":"Em trai bị bệnh (aa) mà bố mẹ bình thường → bố mẹ mỗi bên đều có kiểu gene Aa × Aa. Người vợ bình thường → xác suất mang kiểu gene Aa là 2/3 (trong tỉ lệ 1AA : 2Aa của nhóm bình thường); tương tự người chồng cũng 2/3. Con bị bệnh (aa) chỉ sinh ra khi cả hai vợ chồng đều là Aa và cùng truyền allele a cho con: 2/3 × 2/3 × 1/4 = 1/9.","points":0.25},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau về công nghệ sinh học:","statements":["a) Enzyme ligase có chức năng nối các đoạn DNA lại với nhau trong kĩ thuật tạo DNA tái tổ hợp.","b) Thể truyền (vector) dùng trong công nghệ gene thường mang gene đánh dấu (ví dụ gene kháng kháng sinh) để nhận biết tế bào đã nhận DNA tái tổ hợp.","c) Cừu Dolly được tạo ra bằng kĩ thuật nhân bản vô tính: chuyển nhân tế bào soma của cừu cho nhân vào tế bào trứng đã loại bỏ nhân.","d) Mọi sinh vật biến đổi gene đều sinh sản hữu tính bình thường và truyền ổn định gene chuyển cho các thế hệ sau."],"answer":["T","T","T","F"],"explain":"a) Đúng: ligase xúc tác tạo liên kết phosphodiester, nối đoạn gene ngoại với plasmid đã cắt tạo DNA tái tổ hợp hoàn chỉnh. b) Đúng: gene đánh dấu (như ampR, tetR) giúp chọn lọc tế bào đã nhận vector bằng môi trường có kháng sinh tương ứng. c) Đúng: Dolly (1996) là động vật có vú đầu tiên nhân bản từ tế bào soma trưởng thành — nhân tế bào tuyến vú + trứng mất nhân → phôi → cừu con giống hệt cừu cho nhân. d) Sai: nhiều sinh vật chuyển gene bị bất thụ hoặc gene chuyển chèn ngẫu nhiên có thể bị bất hoạt, giảm biểu hiện qua các thế hệ; không phải mọi GMO đều di truyền ổn định.","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau (tổng hợp kiến thức tiến hóa):","statements":["a) Biến dị tổ hợp được coi là nguyên liệu thứ cấp cho quá trình chọn lọc tự nhiên.","b) Cách li địa lí trực tiếp tạo ra loài mới mà không cần sự xuất hiện của cách li sinh sản.","c) Tiến hóa nhỏ là quá trình làm biến đổi tần số allele và thành phần kiểu gene của quần thể.","d) Hóa thạch là bằng chứng trực tiếp về lịch sử phát sinh và phát triển của sinh giới."],"answer":["T","F","T","T"],"explain":"a) Đúng: nguyên liệu sơ cấp là đột biến (tạo allele mới); biến dị tổ hợp sắp xếp lại các allele có sẵn thành tổ hợp mới — nguyên liệu thứ cấp cho chọn lọc. b) Sai: cách li địa lí chỉ ngăn cản dòng gene, tạo điều kiện; loài mới chỉ được coi là hoàn tất khi xuất hiện cách li sinh sản. c) Đúng: đó là định nghĩa tiến hóa nhỏ (vi tiến hóa) diễn ra ở cấp độ quần thể. d) Đúng: hóa thạch là di tích trực tiếp của sinh vật từng sống, cho thấy quan hệ họ hàng và chiều hướng tiến hóa của các nhóm sinh vật.","points":1},{"type":"short","level":"VDC","q":"Một gene dài 3060 angstrom. Giả sử toàn bộ gene này là vùng mã hóa và một mạch của gene làm khuôn tổng hợp mRNA. Chuỗi polypeptide hoàn chỉnh do gene này mã hóa có tối đa bao nhiêu amino acid?","answer":"299","explain":"Số cặp nucleotide của gene = 3060/3,4 = 900 → mỗi mạch đơn có 900 nucleotide → mRNA có 900 nucleotide = 300 codon. Codon kết thúc không mã hóa amino acid nên chuỗi polypeptide hoàn chỉnh tối đa có 300 − 1 = 299 amino acid.","points":0.5},{"type":"short","level":"VDC","q":"Bệnh máu khó đông do gene lặn nằm trên NST X quy định (không có allele tương ứng trên Y). Một người phụ nữ bình thường (không mắc bệnh) có bố bị máu khó đông, kết hôn với một người đàn ông bình thường. Xác suất để họ sinh được một con trai bị máu khó đông là bao nhiêu?","answer":"1/4","explain":"Bố của người vợ bị bệnh (X^a Y) truyền NST X mang allele a cho con gái → người vợ có kiểu gene X^A X^a; chồng bình thường: X^A Y. Sinh con trai với xác suất 1/2; con trai bị bệnh khi nhận X^a từ mẹ với xác suất 1/2. Vậy xác suất sinh con trai bị bệnh = 1/2 × 1/2 = 1/4.","points":0.5}]}]}
