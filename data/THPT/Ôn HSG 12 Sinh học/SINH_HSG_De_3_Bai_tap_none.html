<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 3","questions":[{"type":"mcq","level":"VDC","q":"Một quần thể ngẫu phối có cấu trúc di truyền 0,36AA : 0,48Aa : 0,16aa. Do áp lực của chọn lọc tự nhiên, toàn bộ cá thể có kiểu gene aa bị đào thải trước tuổi sinh sản (chọn lọc chống allele lặn hoàn toàn). Sau một thế hệ chọn lọc, tần số allele A trong quần thể là bao nhiêu?","options":["A. 0,6","B. 0,75","C. 3/4","D. 5/7"],"answer":"D","explain":"Ban đầu tần số A là p = 0,36 + 0,48/2 = 0,6; tần số a là q = 0,4. Sau khi loại bỏ toàn bộ cá thể aa, nhóm tham gia sinh sản còn 0,36AA + 0,48Aa = 0,84. Tần số allele A trong thế hệ giao tử tiếp theo = (2×0,36 + 0,48)/(2×0,84) = 1,2/1,68 = 5/7 ≈ 0,714. (Tổng quát: sau chọn lọc chống allele lặn hoàn toàn, q' = q/(1+q) = 0,4/1,4 = 2/7 nên p' = 5/7.)","points":0.25},{"type":"mcq","level":"VDC","q":"Một quần thể thực vật tự thụ phấn có cấu trúc ban đầu 0,5AA : 0,5Aa (không có kiểu gene aa). Cho quần thể tự thụ phấn liên tiếp qua 2 thế hệ. Tỉ lệ kiểu gene aa ở thế hệ thứ 2 là bao nhiêu?","options":["A. 3/16","B. 0","C. 1/8","D. 1/4"],"answer":"A","explain":"Thế hệ 1 sau tự thụ: AA = 0,5 + 0,5×1/4 = 0,625; Aa = 0,5×1/2 = 0,25; aa = 0,5×1/4 = 0,125. Thế hệ 2: chỉ các cây Aa (0,25) tự thụ mới tạo thêm kiểu gene aa: aa = 0,125 + 0,25×1/4 = 0,1875 = 3/16. (Lưu ý: tự thụ phấn không làm thay đổi tần số allele — q(a) = 0,25 không đổi — nhưng làm tăng dần tỉ lệ thể đồng hợp, giảm tỉ lệ thể dị hợp.)","points":0.25},{"type":"mcq","level":"VDC","q":"Quần thể A có tần số allele B là 0,8. Mỗi thế hệ, 10% số cá thể của quần thể A được thay thế bằng các cá thể di cư đến từ quần thể B (tần số allele B của quần thể B là 0,3); các cá thể nhập cư tham gia ngẫu phối bình thường. Sau 2 thế hệ di nhập liên tiếp, tần số allele B của quần thể A xấp xỉ bao nhiêu?","options":["A. 0,75","B. 0,705","C. 0,66","D. 0,55"],"answer":"B","explain":"Áp dụng công thức di nhập gen: p' = (1 − m)×p + m×pm với m = 0,1 là tỉ lệ nhập cư, pm = 0,3 là tần số allele của quần thể cho. Thế hệ 1: p1 = 0,9×0,8 + 0,1×0,3 = 0,72 + 0,03 = 0,75. Thế hệ 2: p2 = 0,9×0,75 + 0,1×0,3 = 0,675 + 0,03 = 0,705. Di nhập gen làm tần số allele của quần thể nhận xích dần về phía tần số allele của quần thể cho.","points":0.25},{"type":"mcq","level":"VDC","q":"Ở bướm đêm tại một vùng công nghiệp ở Anh, trước cách mạng công nghiệp dạng cánh sáng chiếm khoảng 95%; sau 50 năm công nghiệp hóa, dạng cánh tối chiếm khoảng 95%. Khi môi trường được làm sạch trở lại, tỉ lệ đảo ngược: dạng cánh sáng lại chiếm ưu thế. Hiện tượng này là minh chứng trực tiếp và rõ ràng nhất cho nhân tố tiến hóa nào?","options":["A. Đột biến gene tạo ra allele cánh tối.","B. Phiêu bạt di truyền.","C. Chọn lọc tự nhiên có hướng (chọn lọc định hướng).","D. Di nhập gen từ các vùng khác."],"answer":"C","explain":"Tỉ lệ kiểu hình đảo chiều theo sự thay đổi của môi trường (khói bụi làm thân cây đen → cánh tối ngụy trang tốt, được chọn giữ lại; môi trường sạch → cánh sáng lợi thế) chứng tỏ môi trường đã 'chọn lọc' kiểu hình thích nghi theo một hướng xác định → chọn lọc tự nhiên định hướng. Loại trừ phiêu bạt vì biến đổi có hướng và lặp lại theo môi trường (phiêu bạt là ngẫu nhiên, vô hướng). Đột biến chỉ cung cấp nguyên liệu, không giải thích được sự đảo chiều nhanh và có quy luật theo môi trường.","points":0.25},{"type":"mcq","level":"VDC","q":"Hai quần thể chim cùng loài bị ngăn cách bởi một dãy núi mới hình thành và không còn tiếp xúc với nhau trong hàng triệu năm. Khi dãy núi biến mất, hai quần thể gặp lại nhau nhưng không giao phối với nhau do mùa sinh sản đã khác nhau. Quá trình này minh họa cho hiện tượng nào?","options":["A. Cách li địa lí trực tiếp tạo ra loài mới.","B. Hình thành loài cùng khu vực (sympatric).","C. Sự thoái hóa do giao phối cận huyết kéo dài.","D. Hình thành loài khác khu vực (allopatric), trong đó cách li sinh sản là dấu hiệu hoàn tất quá trình."],"answer":"D","explain":"Khởi đầu là cách li địa lí (dãy núi) ngăn cản dòng gene → hai quần thể tích lũy các khác biệt di truyền một cách độc lập (hình thành loài khác khu vực — allopatric). Khi gặp lại, chúng đã xuất hiện cách li sinh sản (khác mùa sinh sản, thuộc nhóm cách li tập tính/sinh thái) nên không giao phối → quá trình hình thành loài hoàn tất. Cách li địa lí chỉ là điều kiện thúc đẩy, không 'trực tiếp' tạo ra loài mới nếu chưa có cách li sinh sản (loại A).","points":0.25},{"type":"mcq","level":"VDC","q":"Tuyến nọc độc của rắn và tuyến nước bọt của động vật có vú có cấu tạo và nguồn gốc phôi thai tương tự nhau, nhưng thực hiện chức năng khác nhau (tiết nọc độc so với tiết nước bọt hỗ trợ tiêu hóa). Đây là bằng chứng tiến hóa thuộc loại nào?","options":["A. Cơ quan tương đồng (nguồn gốc chung, chức năng có thể khác nhau).","B. Cơ quan tương tự (nguồn gốc khác nhau, chức năng giống nhau).","C. Cơ quan thoái hóa.","D. Bằng chứng phôi sinh học."],"answer":"A","explain":"Hai tuyến có cùng nguồn gốc (từ tuyến tiêu hóa nguyên thủy) nhưng đã phân hóa để thực hiện chức năng khác nhau → cơ quan tương đồng, phản ánh quan hệ họ hàng và quá trình tiến hóa phân li từ tổ tiên chung. (Bẫy: nhiều người thấy 'chức năng khác nhau' thì loại tương đồng — nhưng tiêu chí phân loại cơ quan tương đồng là nguồn gốc chung, không phải chức năng.)","points":0.25},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau về các nhân tố tiến hóa:","statements":["a) Đột biến gene là nguồn nguyên liệu sơ cấp cho tiến hóa vì tạo ra các allele mới.","b) Phiêu bạt di truyền làm thay đổi tần số allele một cách có hướng và hiệu quả nhất ở quần thể có kích thước lớn.","c) Giao phối không ngẫu nhiên (tự phối, giao phối cận huyết) làm thay đổi tần số các allele trong quần thể.","d) Chọn lọc tự nhiên là nhân tố tiến hóa duy nhất làm thay đổi tần số allele theo một hướng xác định."],"answer":["T","F","F","T"],"explain":"a) Đúng: đột biến tạo ra allele mới — nguyên liệu sơ cấp; biến dị tổ hợp chỉ sắp xếp lại các allele có sẵn — nguyên liệu thứ cấp. b) Sai: phiêu bạt di truyền là sự biến đổi ngẫu nhiên, vô hướng; hiệu quả mạnh nhất ở quần thể nhỏ (hiệu ứng cổ chai, hiệu ứng người sáng lập). c) Sai: giao phối không ngẫu nhiên chỉ làm thay đổi thành phần kiểu gene (tăng đồng hợp, giảm dị hợp), không làm thay đổi tần số allele. d) Đúng: trong các nhân tố tiến hóa, chỉ chọn lọc tự nhiên tác động có hướng (giữ lại kiểu hình thích nghi); đột biến, di nhập, phiêu bạt đều vô hướng.","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau về di truyền quần thể:","statements":["a) Một quần thể ngẫu phối sẽ đạt trạng thái cân bằng di truyền chỉ sau một thế hệ ngẫu phối.","b) Tự thụ phấn và giao phối cận huyết làm tăng tần số allele lặn có hại trong quần thể.","c) Trong điều kiện không chịu tác động của các nhân tố tiến hóa, tần số allele của quần thể ngẫu phối được duy trì không đổi qua các thế hệ.","d) Ưu thế lai biểu hiện cao nhất ở F1 và giảm dần ở các thế hệ sau vì tỉ lệ thể dị hợp giảm dần."],"answer":["T","F","T","T"],"explain":"a) Đúng: nội dung định luật Hardy–Weinberg — sau một thế hệ ngẫu phối, cấu trúc di truyền đạt p² + 2pq + q² và ổn định. b) Sai: tự phối chỉ làm tăng tỉ lệ thể đồng hợp (kể cả đồng hợp lặn có hại, khiến tính trạng xấu biểu hiện ra), tần số các allele không đổi. c) Đúng: đó chính là nội dung của trạng thái cân bằng di truyền. d) Đúng: ưu thế lai gắn liền với trạng thái dị hợp; qua các thế hệ tự thụ, tỉ lệ dị hợp giảm 1/2 mỗi thế hệ nên ưu thế lai giảm dần.","points":1},{"type":"short","level":"VDC","q":"Một quần thể thực vật gồm 1000 cây với cấu trúc ban đầu: 400 cây AA, 400 cây Aa và 200 cây aa. Cho quần thể tự thụ phấn liên tiếp. Sau 2 thế hệ tự thụ, số cây có kiểu gene aa là bao nhiêu?","answer":"350","explain":"Tỉ lệ ban đầu: 0,4AA : 0,4Aa : 0,2aa. Thế hệ 1 sau tự thụ: AA = 0,4 + 0,4/4 = 0,5; Aa = 0,4/2 = 0,2; aa = 0,2 + 0,4/4 = 0,3. Thế hệ 2: aa = 0,3 + 0,2/4 = 0,35 → số cây aa = 0,35 × 1000 = 350 cây.","points":0.5},{"type":"short","level":"VDC","q":"Ở một quần thể người ngẫu phối và cân bằng di truyền, tỉ lệ cá thể mang kiểu hình lặn (aa) của một bệnh di truyền là 9%. Một cặp vợ chồng đều có kiểu hình bình thường (không biết rõ kiểu gene). Xác suất để họ sinh con đầu lòng mắc bệnh (aa) là bao nhiêu?","answer":"9/169","explain":"q² = 0,09 → q(a) = 0,3; p(A) = 0,7. Trong nhóm người có kiểu hình bình thường, tỉ lệ người mang kiểu gene Aa = 2pq/(p² + 2pq) = 0,42/0,91 = 6/13. Mỗi người trong cặp vợ chồng có xác suất 6/13 là Aa; con mắc bệnh (aa) chỉ sinh ra khi cả hai đều là Aa và cùng truyền allele a: (6/13)² × 1/4 = 36/676 = 9/169 (khoảng 5,3%).","points":0.5}]}]}
