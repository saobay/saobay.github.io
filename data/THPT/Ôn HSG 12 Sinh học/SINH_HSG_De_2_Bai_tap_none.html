<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 2","questions":[{"type":"mcq","level":"VDC","q":"Trên một NST thường, trình tự các gene ở trạng thái bình thường là A B C * D E F G H (dấu * kí hiệu tâm động). Một NST đột biến có trình tự các gene là A B C * D E D E F G H. Đây là dạng đột biến cấu trúc NST nào?","options":["A. Mất đoạn NST.","B. Đảo đoạn NST.","C. Lặp đoạn NST.","D. Chuyển đoạn NST."],"answer":"C","explain":"So sánh hai trình tự: đoạn chứa gene D, E xuất hiện hai lần liên tiếp (D E D E) trên NST đột biến, không mất gene nào và tâm động vẫn ở vị trí cũ → đoạn NST mang gene D, E đã được lặp lại → đột biến lặp đoạn. Loại trừ: mất đoạn (thiếu gene), đảo đoạn (trình tự bị đảo ngược 180 độ), chuyển đoạn (trao đổi đoạn giữa các NST khác nhau).","points":0.25},{"type":"mcq","level":"VDC","q":"Ở một loài hoa, màu sắc hoa do hai gene không allele tương tác bổ trợ theo kiểu 9:7: kiểu gene A-B- cho hoa đỏ, các kiểu gene còn lại cho hoa trắng. Cho cây hoa đỏ có kiểu gene AaBb tự thụ phấn. Chọn ngẫu nhiên 2 cây hoa trắng ở đời con đem trồng, xác suất để cả 2 cây đều có kiểu gene aabb là bao nhiêu?","options":["A. 1/16","B. 1/7","C. 2/7","D. 1/49"],"answer":"D","explain":"AaBb × AaBb cho đời con: 9/16 A-B- (hoa đỏ) : 7/16 hoa trắng (gồm 3/16 A-bb + 3/16 aaB- + 1/16 aabb). Vì chỉ xét trong nhóm cây hoa trắng, tỉ lệ cây aabb được chuẩn hóa: (1/16)/(7/16) = 1/7. Chọn 2 cây độc lập → xác suất cả 2 đều aabb = (1/7)² = 1/49. (Bẫy: 1/16 là tỉ lệ aabb trong toàn bộ đời con, chưa chuẩn hóa trên nhóm hoa trắng.)","points":0.25},{"type":"mcq","level":"VDC","q":"Ở ruồi giấm, gene A (thân xám) trội hoàn toàn so với allele a (thân đen); gene B (cánh dài) trội hoàn toàn so với allele b (cánh cụt). Hai gene cùng nằm trên một NST thường. Lai ruồi cái thân xám, cánh dài dị hợp hai cặp gene với ruồi đực thân đen, cánh cụt, thu được đời con có tỉ lệ: 41% thân xám, cánh dài : 41% thân đen, cánh cụt : 9% thân xám, cánh cụt : 9% thân đen, cánh dài. Kết luận nào sau đây đúng?","options":["A. Ruồi cái dị hợp đều, tần số hoán vị gen là 18%.","B. Ruồi cái dị hợp đều, tần số hoán vị gen là 9%.","C. Ruồi cái dị hợp chéo, tần số hoán vị gen là 18%.","D. Hai gene phân li độc lập, tuân theo quy luật Mendel."],"answer":"A","explain":"Ruồi đực aabb chỉ cho một loại giao tử ab, nên tỉ lệ kiểu hình đời con chính là tỉ lệ các loại giao tử của ruồi cái: AB 41%, ab 41%, Ab 9%, aB 9%. Hai loại giao tử chiếm tỉ lệ lớn (AB, ab) là giao tử liên kết → ruồi cái dị hợp đều AB/ab. Hai loại giao tử chiếm tỉ lệ nhỏ (Ab, aB) là giao tử hoán vị → tần số hoán vị f = 9% + 9% = 18%. (Bẫy: lấy tỉ lệ một loại giao tử hoán vị 9% làm tần số hoán vị.)","points":0.25},{"type":"mcq","level":"VDC","q":"Ở một loài động vật, tính trạng màu mắt do một gene có hai allele quy định, nằm trên NST giới tính X (không có allele tương ứng trên Y). Lai con cái mắt đỏ với con đực mắt trắng thu được F1 toàn mắt đỏ. Cho các cá thể F1 giao phối ngẫu nhiên, F2 thu được tỉ lệ 3 mắt đỏ : 1 mắt trắng, trong đó toàn bộ cá thể mắt trắng đều là con đực. Giải thích nào sau đây đúng? (Quy ước A: mắt đỏ, a: mắt trắng.)","options":["A. Allele mắt trắng trội; gene nằm trên NST thường.","B. Allele mắt đỏ trội hoàn toàn; con cái P có kiểu gene X^A X^A, con đực P có kiểu gene X^a Y.","C. Allele mắt đỏ trội hoàn toàn; con cái P có kiểu gene X^A X^a, con đực P có kiểu gene X^A Y.","D. Gene nằm trên NST Y; tính trạng di truyền thẳng từ bố sang con trai."],"answer":"B","explain":"F2 phân li 3 đỏ : 1 trắng nhưng kiểu hình trắng chỉ xuất hiện ở con đực → gene nằm trên NST X (di truyền chéo), loại A và D. F1 toàn mắt đỏ → đỏ trội hoàn toàn so với trắng. Con đực F1 mắt đỏ nhận X^A từ mẹ, mà mọi con đực F1 đều mắt đỏ → mẹ P chỉ cho giao tử X^A → mẹ P: X^A X^A; bố P mắt trắng: X^a Y. Kiểm chứng: F1 là X^A X^a (cái đỏ) × X^A Y (đực đỏ); F2: cái X^A X^A, X^A X^a (đỏ), đực X^A Y (đỏ), X^a Y (trắng) → đúng 3 đỏ : 1 trắng, trắng toàn đực.","points":0.25},{"type":"mcq","level":"VDC","q":"Một người đàn ông nhóm máu A kết hôn với một người phụ nữ nhóm máu B. Họ sinh được 4 người con có đủ cả 4 nhóm máu A, B, AB và O. Kiểu gene của bố và mẹ lần lượt là gì? (Quy ước: I^A và I^B đồng trội và trội hoàn toàn so với I^O.)","options":["A. I^A I^A và I^B I^B.","B. I^A I^B và I^O I^O.","C. I^A I^O và I^B I^O.","D. I^A I^O và I^B I^B."],"answer":"C","explain":"Người con nhóm máu O có kiểu gene I^O I^O, nhận một allele I^O từ bố và một từ mẹ → cả bố và mẹ đều mang allele I^O. Bố nhóm máu A và mang I^O → kiểu gene I^A I^O; mẹ nhóm máu B và mang I^O → kiểu gene I^B I^O. Kiểm chứng: I^A I^O × I^B I^O cho đời con I^A I^B (AB), I^A I^O (A), I^B I^O (B), I^O I^O (O) → đủ cả 4 nhóm máu, khớp dữ kiện.","points":0.25},{"type":"mcq","level":"VDC","q":"Một loài thực vật có bộ NST lưỡng bội 2n = 24. Một thể đột biến có 25 NST trong tế bào sinh dưỡng (thể ba). Khi giảm phân, thể ba này tạo ra hai loại giao tử n và n+1 với tỉ lệ ngang nhau. Cho thể ba tự thụ phấn, tỉ lệ hợp tử có 26 NST ở đời con là bao nhiêu? (Giả thiết mọi hợp tử đều sống sót.)","options":["A. 50%","B. 12,5%","C. 6,25%","D. 25%"],"answer":"D","explain":"Thể ba (2n + 1 = 25 NST) giảm phân cho giao tử n = 12 NST và giao tử n + 1 = 13 NST, mỗi loại 50%. Tự thụ phấn tương đương (1/2 n + 1/2 (n+1)) × (1/2 n + 1/2 (n+1)). Hợp tử có 26 NST = (n+1) + (n+1) với xác suất 1/2 × 1/2 = 1/4 = 25%. (Đồng thời đời con có 25% hợp tử 24 NST và 50% hợp tử 25 NST.)","points":0.25},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau về quá trình phân bào:","statements":["a) Trong nguyên phân, các NST kép tách nhau ở tâm động tại kì sau để đi về hai cực của tế bào.","b) Giảm phân II có diễn biến cơ bản giống nguyên phân, nhưng tế bào tham gia đã mang bộ NST đơn bội ở trạng thái kép.","c) Trao đổi chéo giữa hai chromatid không chị em của cặp NST tương đồng xảy ra tại kì trước I của giảm phân.","d) Từ một tế bào mẹ ban đầu, quá trình giảm phân luôn tạo ra 4 tế bào con có vật chất di truyền giống hệt nhau."],"answer":["T","T","T","F"],"explain":"a) Đúng: ở kì sau nguyên phân, thoi phân bào co rút kéo hai chromatid (tách nhau ở tâm động) về hai cực. b) Đúng: giảm phân II cũng tách chromatid ở tâm động như nguyên phân; điểm khác là tế bào bước vào giảm phân II có n NST kép và không có sự nhân đôi DNA trước đó. c) Đúng: tiếp hợp và trao đổi chéo là sự kiện đặc trưng của kì trước I, tạo nguồn biến dị tổ hợp. d) Sai: nhờ trao đổi chéo và sự phân li độc lập, tổ hợp tự do của các cặp NST tương đồng ở giảm phân I, bốn tế bào con có tổ hợp gene khác nhau.","points":1},{"type":"truefalse","level":"VDC","q":"Xét tính đúng, sai của các khẳng định sau về các quy luật di truyền:","statements":["a) Quy luật phân li độc lập của Mendel chỉ nghiệm đúng khi các cặp gene đang xét nằm trên các cặp NST tương đồng khác nhau.","b) Liên kết gene hoàn toàn ngăn cản sự xuất hiện của biến dị tổ hợp.","c) Gene nằm trong tế bào chất (ngoài nhân) di truyền theo dòng mẹ và không tuân theo các quy luật di truyền của Mendel.","d) Hiện tượng một gene chi phối sự biểu hiện của nhiều tính trạng được gọi là gene đa hiệu."],"answer":["T","F","T","T"],"explain":"a) Đúng: điều kiện nghiệm đúng của phân li độc lập là các cặp allele nằm trên các cặp NST tương đồng khác nhau (nếu cùng một NST và liên kết hoàn toàn thì không phân li độc lập). b) Sai: liên kết gene chỉ hạn chế (làm giảm) biến dị tổ hợp; nhờ hoán vị gen vẫn tạo ra các giao tử tái tổ hợp → vẫn có biến dị tổ hợp. c) Đúng: gene trong ti thể, lục lạp truyền chủ yếu qua tế bào chất của trứng → di truyền theo dòng mẹ, không phân li theo quy luật Mendel. d) Đúng: ví dụ gene quy định hồng cầu hình liềm vừa gây thiếu máu vừa tăng khả năng chống sốt rét.","points":1},{"type":"short","level":"VDC","q":"Ở một loài thực vật, ba cặp gene Aa, Bb, Dd nằm trên ba cặp NST tương đồng khác nhau; mỗi gene quy định một tính trạng, allele trội là trội hoàn toàn. Cho cây có kiểu gene AaBbDd tự thụ phấn. Tỉ lệ đời con vừa mang kiểu hình trội về cả ba tính trạng vừa có kiểu gene dị hợp về ít nhất một cặp gene là bao nhiêu?","answer":"13/32","explain":"Tỉ lệ đời con có kiểu hình trội cả ba tính trạng = (3/4)³ = 27/64. Trong số đó, cây thuần chủng cả ba cặp gene (AABBDD) chiếm (1/4)³ = 1/64. Tỉ lệ cần tìm = 27/64 − 1/64 = 26/64 = 13/32.","points":0.5},{"type":"short","level":"VDC","q":"Bệnh mù màu đỏ – lục ở người do gene lặn nằm trên NST X quy định (không có allele tương ứng trên Y). Một cặp vợ chồng đều nhìn màu bình thường sinh được một con trai bị mù màu. Nếu họ sinh tiếp một người con, xác suất người con này là con gái và bị mù màu là bao nhiêu?","answer":"0","explain":"Con trai bị bệnh có kiểu gene X^a Y, nhận X^a từ mẹ → mẹ có kiểu gene X^A X^a; bố bình thường có kiểu gene X^A Y. Con gái luôn nhận NST X mang allele trội X^A từ bố nên kiểu gene chỉ có thể là X^A X^A hoặc X^A X^a, đều nhìn màu bình thường. Vậy xác suất sinh con gái bị mù màu bằng 0. (Bẫy kinh điển: nhiều người tính 1/4 mà quên rằng bố truyền cho con gái NST X mang allele trội.)","points":0.5}]}]}
