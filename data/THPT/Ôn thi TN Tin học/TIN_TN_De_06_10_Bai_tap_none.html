{"sets":[{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Máy tính biểu diễn mọi thông tin dưới dạng dãy các số nào?","options":["A. Dãy số 1 đến 9","B. Chữ cái","C. Dãy số 0 và 1","D. Hình vẽ"],"answer":"C","explain":"Máy tính dùng hệ nhị phân, mọi thông tin đều được mã hóa thành dãy các bit 0 và 1.","points":0.25},{"type":"mcq","level":"NB","q":"Ổ cứng SSD có ưu điểm gì so với ổ cứng cơ học truyền thống?","options":["A. Dung lượng luôn lớn hơn","B. Tốc độ đọc ghi nhanh hơn và bền hơn","C. Giá thành luôn rẻ hơn","D. Không cần điện để hoạt động"],"answer":"B","explain":"SSD không có bộ phận chuyển động nên đọc ghi nhanh, bền và ít ồn hơn ổ cứng cơ học.","points":0.25},{"type":"mcq","level":"TH","q":"Phân biệt bộ nhớ trong và bộ nhớ ngoài của máy tính?","options":["A. Bộ nhớ trong gồm RAM, ROM gắn trên bo mạch; bộ nhớ ngoài là ổ cứng, USB lưu trữ lâu dài","B. Hai loại hoàn toàn giống nhau","C. Bộ nhớ trong lưu được nhiều hơn bộ nhớ ngoài","D. Bộ nhớ ngoài nhanh hơn bộ nhớ trong"],"answer":"A","explain":"Bộ nhớ trong (RAM, ROM) làm việc trực tiếp với CPU; bộ nhớ ngoài (ổ cứng, USB) lưu trữ lâu dài dung lượng lớn.","points":0.25},{"type":"mcq","level":"NB","q":"Phần mềm hệ thống khác phần mềm ứng dụng ở điểm nào?","options":["A. Phần mềm hệ thống chỉ để chơi game","B. Phần mềm ứng dụng quản lý phần cứng","C. Hai loại không liên quan gì nhau","D. Phần mềm hệ thống quản lý phần cứng và tạo môi trường cho phần mềm ứng dụng chạy"],"answer":"D","explain":"Phần mềm hệ thống như hệ điều hành quản lý tài nguyên máy tính; phần mềm ứng dụng phục vụ nhu cầu cụ thể của người dùng.","points":0.25},{"type":"mcq","level":"NB","q":"Tệp có phần mở rộng nào sau đây thường là tệp văn bản?","options":["A. .exe","B. .txt","C. .mp3","D. .jpg"],"answer":"B","explain":"Đuôi .txt chỉ tệp văn bản thuần; .exe là tệp chạy chương trình, .mp3 là âm thanh, .jpg là hình ảnh.","points":0.25},{"type":"mcq","level":"VD","q":"Đường truyền Internet nhà bạn M có tốc độ tải xuống 40 Mbps. Tải một tệp 100 MB mất khoảng bao lâu?","options":["A. Khoảng 20 giây","B. Khoảng 2 giây","C. Khoảng 2 giờ","D. Khoảng 20 phút"],"answer":"A","explain":"40 Mbps = 5 MB mỗi giây; tệp 100 MB cần khoảng 100 chia 5 = 20 giây trong điều kiện lý tưởng.","points":0.25},{"type":"mcq","level":"NB","q":"Mạng MAN có phạm vi như thế nào?","options":["A. Một thành phố hoặc khu vực đô thị","B. Toàn cầu","C. Một phòng học","D. Liên lục địa"],"answer":"A","explain":"MAN (mạng đô thị) bao phủ phạm vi một thành phố, lớn hơn LAN nhưng nhỏ hơn WAN.","points":0.25},{"type":"mcq","level":"TH","q":"Cáp quang được ưa chuộng trong truyền dẫn Internet vì sao?","options":["A. Dây rất dày nên bền","B. Truyền tín hiệu bằng ánh sáng nên tốc độ cao và ít nhiễu","C. Giá thành rẻ nhất","D. Không cần thiết bị đầu cuối"],"answer":"B","explain":"Cáp quang truyền dữ liệu bằng xung ánh sáng, cho băng thông lớn và ổn định hơn cáp đồng.","points":0.25},{"type":"mcq","level":"NB","q":"Chế độ ẩn danh của trình duyệt có tác dụng gì?","options":["A. Giúp ẩn danh tuyệt đối trên Internet","B. Không lưu lịch sử duyệt web và cookie trên thiết bị đang dùng","C. Tăng tốc độ mạng","D. Chặn mọi quảng cáo"],"answer":"B","explain":"Chế độ ẩn danh chỉ không lưu dấu vết trên thiết bị; nhà cung cấp dịch vụ vẫn có thể thấy hoạt động của bạn.","points":0.25},{"type":"mcq","level":"NB","q":"Livestream là hình thức nào trên mạng xã hội?","options":["A. Phát video trực tiếp tới người xem","B. Gửi thư điện tử","C. Tải tệp lên đám mây","D. Chơi game offline"],"answer":"A","explain":"Livestream cho phép phát video trực tiếp, người xem tương tác theo thời gian thực.","points":0.25},{"type":"mcq","level":"NB","q":"Khi cần gửi tệp đính kèm quá lớn qua email, cách nào sau đây tốt nhất?","options":["A. Cố gửi nhiều lần cho đến khi được","B. Chia nhỏ tệp thành hàng trăm phần","C. Tải tệp lên đám mây rồi gửi đường link cho người nhận","D. Bỏ không gửi nữa"],"answer":"C","explain":"Email giới hạn dung lượng đính kèm; tải lên đám mây và chia sẻ link là cách gọn gàng, hiệu quả.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn N cần tìm số liệu chính thức về dân số Việt Nam cho bài thuyết trình. Nguồn nào sau đây tin cậy nhất?","options":["A. Một bài đăng ẩn danh trên mạng xã hội","B. Tin nhắn lan truyền trong nhóm chat","C. Trang web của Tổng cục Thống kê","D. Blog cá nhân không rõ tác giả"],"answer":"C","explain":"Số liệu chính thức nên lấy từ cơ quan thống kê nhà nước; các nguồn ẩn danh, lan truyền thường thiếu kiểm chứng.","points":0.25},{"type":"mcq","level":"NB","q":"Sáng chế được bảo hộ bởi loại quyền nào?","options":["A. Quyền bầu cử","B. Quyền sở hữu trí tuệ","C. Quyền tự do đi lại","D. Quyền học tập"],"answer":"B","explain":"Sáng chế, kiểu dáng công nghiệp, nhãn hiệu được bảo hộ bởi quyền sở hữu trí tuệ.","points":0.25},{"type":"mcq","level":"TH","q":"Xác thực hai yếu tố giúp bảo vệ tài khoản như thế nào?","options":["A. Yêu cầu thêm một mã xác nhận ngoài mật khẩu nên kẻ xấu khó đăng nhập dù biết mật khẩu","B. Làm mật khẩu ngắn đi","C. Tự động chia sẻ tài khoản cho bạn bè","D. Không có tác dụng gì"],"answer":"A","explain":"Xác thực hai yếu tố thêm lớp bảo vệ thứ hai như mã OTP gửi về điện thoại, tăng an toàn đáng kể.","points":0.25},{"type":"mcq","level":"NB","q":"Khi muốn dùng ảnh của người khác cho bài thuyết trình, việc làm đúng là gì?","options":["A. Xóa tên tác giả rồi dùng","B. Cắt ảnh để không ai nhận ra","C. Xin phép tác giả và ghi rõ nguồn ảnh","D. Dùng mà không cần quan tâm"],"answer":"C","explain":"Tôn trọng bản quyền nghĩa là xin phép và ghi nguồn khi sử dụng tác phẩm của người khác.","points":0.25},{"type":"mcq","level":"NB","q":"Người chưa đủ 16 tuổi có phải chịu trách nhiệm khi vi phạm pháp luật trên mạng không?","options":["A. Không bao giờ bị xử lý","B. Chỉ bị nhắc nhở miệng","C. Được miễn trừ mọi trách nhiệm","D. Có, tùy mức độ vi phạm và độ tuổi sẽ bị xử lý theo quy định"],"answer":"D","explain":"Pháp luật quy định trách nhiệm theo độ tuổi và mức độ vi phạm; trẻ vị thành niên vi phạm nghiêm trọng vẫn bị xử lý.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn T nhận được tin nhắn tuyển dụng việc nhẹ lương cao, yêu cầu nộp phí trước. Đây có thể là gì và T nên làm gì?","options":["A. Cơ hội tốt; nộp phí ngay","B. Việc làm uy tín; rủ bạn cùng nộp phí","C. Không quan tâm","D. Có thể là lừa đảo; không nộp phí và báo cho người lớn"],"answer":"D","explain":"Việc nhẹ lương cao kèm yêu cầu nộp phí trước là dấu hiệu lừa đảo điển hình nhắm vào học sinh, sinh viên.","points":0.25},{"type":"mcq","level":"NB","q":"Vì sao không nên lan truyền tin chưa kiểm chứng về dịch bệnh?","options":["A. Vì tin nào cũng đúng","B. Vì không ai đọc","C. Vì tốn pin điện thoại","D. Vì gây hoang mang dư luận và có thể bị xử phạt"],"answer":"D","explain":"Lan truyền tin giả về dịch bệnh gây hoang mang và là hành vi vi phạm pháp luật, có thể bị xử phạt.","points":0.25},{"type":"mcq","level":"NB","q":"Nhóm nghề đa phương tiện (multimedia) làm công việc gì?","options":["A. Sửa chữa máy lạnh","B. Thiết kế đồ họa, dựng phim, làm hiệu ứng cho sản phẩm số","C. Lái máy xúc","D. Bán vé số"],"answer":"B","explain":"Chuyên gia đa phương tiện tạo ra hình ảnh, âm thanh, video cho web, game và quảng cáo.","points":0.25},{"type":"mcq","level":"NB","q":"Giáo viên tin học cần những năng lực nào?","options":["A. Chỉ cần biết bật máy tính","B. Không cần học thêm gì","C. Vững kiến thức chuyên môn và kĩ năng sư phạm, cập nhật công nghệ mới","D. Chỉ cần ngoại hình đẹp"],"answer":"C","explain":"Giáo viên tin học vừa vững chuyên môn vừa biết phương pháp dạy học và luôn cập nhật công nghệ.","points":0.25},{"type":"mcq","level":"NB","q":"Chatbot hỗ trợ khách hàng hoạt động dựa trên công nghệ nào?","options":["A. Động cơ hơi nước","B. Năng lượng mặt trời","C. Sóng radio","D. Trí tuệ nhân tạo xử lý ngôn ngữ"],"answer":"D","explain":"Chatbot dùng AI để hiểu câu hỏi và trả lời tự động, giúp doanh nghiệp phục vụ khách hàng 24 trên 7.","points":0.25},{"type":"mcq","level":"NB","q":"Công nghệ chuỗi khối (blockchain) nổi bật với đặc điểm nào?","options":["A. Chỉ dùng để chơi game","B. Tốc độ luôn nhanh nhất","C. Lưu trữ dữ liệu phân tán, khó bị sửa đổi","D. Không cần Internet"],"answer":"C","explain":"Blockchain lưu dữ liệu trên nhiều máy tính, minh bạch và khó bị giả mạo, ứng dụng trong tài chính, truy xuất nguồn gốc.","points":0.25},{"type":"mcq","level":"VD","q":"Một shop thời trang muốn tư vấn khách hàng tự động ngoài giờ hành chính. Giải pháp công nghệ nào phù hợp nhất?","options":["A. Thuê thêm 10 nhân viên trực đêm","B. Đóng cửa shop","C. Không tư vấn nữa","D. Tích hợp chatbot AI lên website và fanpage của shop"],"answer":"D","explain":"Chatbot AI trả lời tự động 24 trên 7, tiết kiệm chi phí và không bỏ lỡ khách hàng ngoài giờ.","points":0.25},{"type":"mcq","level":"NB","q":"Kĩ năng nào giúp học sinh thích ứng với nghề nghiệp công nghệ trong tương lai?","options":["A. Tự học, tư duy phản biện và sử dụng thành thạo công cụ số","B. Chỉ học thuộc lòng","C. Tránh xa công nghệ","D. Không cần kĩ năng gì"],"answer":"A","explain":"Công nghệ thay đổi nhanh nên năng lực tự học và tư duy phản biện quan trọng hơn kiến thức cố định.","points":0.25},{"type":"truefalse","level":"TH","q":"Gia đình bạn H lắp mạng Internet với modem của nhà cung cấp. Một số bạn phát biểu:","statements":["a) Modem là thiết bị kết nối mạng gia đình với nhà cung cấp dịch vụ Internet.","b) Router chỉ dùng để phát wifi, không chia sẻ được kết nối có dây.","c) Chỉ cần modem là mọi thiết bị tự động có mạng, không cần cấu hình gì.","d) Nên đổi mật khẩu wifi mặc định để bảo mật."],"answer":["T","F","F","T"],"explain":"a) Đúng: modem là cầu nối tới nhà cung cấp dịch vụ. b) Sai: router vừa phát wifi vừa chia sẻ kết nối cho nhiều thiết bị. c) Sai: cần cấu hình tên mạng, mật khẩu và kết nối thiết bị. d) Đúng: mật khẩu mặc định dễ bị đoán nên cần đổi.","points":1},{"type":"truefalse","level":"TH","q":"Bảng MONHOC(MaMH, TenMH, SoTiet) lưu thông tin các môn học:","statements":["a) MaMH có thể làm khóa chính vì mỗi môn có mã duy nhất.","b) Không thể có hai môn học trùng tên TenMH trong bảng.","c) Có thể thêm môn học mới bằng cách thêm một hàng vào bảng.","d) Trường SoTiet lưu số tiết của môn học, thuộc kiểu dữ liệu số."],"answer":["T","F","T","T"],"explain":"a) Đúng: mã môn duy nhất nên làm khóa chính. b) Sai: khóa chính là MaMH nên tên môn có thể trùng nhau ở các khối lớp khác nhau. c) Đúng: thêm hàng là thêm bản ghi mới. d) Đúng: số tiết là dữ liệu số để tính toán.","points":1},{"type":"truefalse","level":"VD","q":"Đoạn chương trình Python dùng vòng lặp while để tính tổng các số từ 1 đến 100: khởi tạo tong = 0, i = 1; lặp khi i không vượt quá 100 thì cộng i vào tong rồi tăng i thêm 1.","statements":["a) Vòng lặp while thực hiện 100 lần.","b) Sau vòng lặp, biến i có giá trị 101.","c) Tổng tính được là 5050.","d) Vòng lặp while không bao giờ kết thúc trong đoạn chương trình này."],"answer":["T","T","T","F"],"explain":"a) Đúng: i chạy từ 1 đến 100 là 100 lần lặp. b) Đúng: i tăng tới 101 thì dừng lặp. c) Đúng: tổng 1 đến 100 bằng 5050. d) Sai: i tăng dần nên vòng lặp kết thúc khi i vượt quá 100.","points":1},{"type":"truefalse","level":"TH","q":"Khi dùng CSS để định dạng nhiều phần tử giống nhau, một số bạn phát biểu:","statements":["a) Class trong CSS chỉ áp dụng được cho đúng một phần tử duy nhất.","b) Trong CSS, class được viết bắt đầu bằng dấu chấm.","c) Mỗi phần tử HTML chỉ được dùng đúng một class duy nhất.","d) Dùng class giúp trang web gọn gàng, dễ bảo trì hơn."],"answer":["F","T","F","T"],"explain":"a) Sai: class dùng chung cho nhiều phần tử. b) Đúng: cú pháp class bắt đầu bằng dấu chấm. c) Sai: một phần tử có thể dùng nhiều class cùng lúc. d) Đúng: tái sử dụng định dạng giúp dễ bảo trì.","points":1},{"type":"truefalse","level":"TH","q":"Nhóm bạn làm video giới thiệu sách hay nên đọc:","statements":["a) Nên kiểm tra bản quyền của nhạc nền trước khi dùng.","b) Không được dùng nhạc miễn phí bản quyền vì vẫn vi phạm.","c) Ghi nguồn sách và tác giả trong phần mô tả video.","d) Dùng nhạc nổi tiếng có bản quyền mà không xin phép cũng không sao."],"answer":["T","F","T","F"],"explain":"a) Đúng: nhạc nền cần được cấp phép sử dụng. b) Sai: nhạc miễn phí bản quyền hoặc tự sáng tác thì an toàn. c) Đúng: ghi nguồn tôn trọng tác giả. d) Sai: dùng nhạc có bản quyền khi chưa được phép là vi phạm.","points":1},{"type":"truefalse","level":"VD","q":"Bạn K soạn thảo đơn xin tham gia đội tình nguyện bằng tính năng trộn thư:","statements":["a) Trộn thư chỉ tạo được một đơn duy nhất cho một người.","b) Cần có danh sách tên trong bảng tính hoặc bảng dữ liệu làm nguồn.","c) Trộn thư chỉ dùng được cho đúng một người nhận.","d) Không cần kiểm tra, cứ in hàng loạt luôn cho nhanh."],"answer":["F","T","T","F"],"explain":"a) Sai: trộn thư tạo nhiều đơn chỉ khác tên người nhận. b) Đúng: cần nguồn dữ liệu chứa danh sách. c) Sai: trộn thư sinh ra nhiều bản cho nhiều người. d) Sai: cần kiểm tra trước tránh in sai hàng loạt.","points":1}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Đơn vị nào sau đây dùng để đo tốc độ đường truyền Internet?","options":["A. Mbps","B. Kg","C. Lít","D. Mét"],"answer":"A","explain":"Tốc độ đường truyền đo bằng bit trên giây, phổ biến là Mbps (megabit trên giây).","points":0.25},{"type":"mcq","level":"NB","q":"Nén tệp tin bằng định dạng zip có tác dụng gì?","options":["A. Làm tăng dung lượng tệp","B. Đổi tên tệp","C. Giảm dung lượng tệp để lưu trữ và gửi đi thuận tiện","D. Xóa tệp"],"answer":"C","explain":"Nén zip giảm dung lượng và gom nhiều tệp thành một gói duy nhất.","points":0.25},{"type":"mcq","level":"NB","q":"Sao lưu tự động có lợi ích gì?","options":["A. Làm máy tính nhanh hơn","B. Tăng dung lượng ổ cứng","C. Diệt virus","D. Dữ liệu được copy dự phòng định kỳ mà không cần nhớ làm thủ công"],"answer":"D","explain":"Sao lưu tự động đảm bảo luôn có bản dự phòng mới nhất, tránh mất dữ liệu do quên sao lưu.","points":0.25},{"type":"mcq","level":"NB","q":"Vòng đeo tay thông minh thường dùng để làm gì?","options":["A. Theo dõi sức khỏe như nhịp tim, giấc ngủ và bước chân","B. Nấu ăn","C. Giặt quần áo","D. Sửa xe"],"answer":"A","explain":"Vòng đeo tay thông minh tích hợp cảm biến theo dõi các chỉ số sức khỏe hằng ngày.","points":0.25},{"type":"mcq","level":"NB","q":"Tài khoản trực tuyến giúp đồng bộ dữ liệu giữa các thiết bị như thế nào?","options":["A. Phải chép tay từng tệp","B. Đăng nhập cùng tài khoản trên mọi thiết bị để dữ liệu tự đồng bộ","C. Không thể đồng bộ","D. Chỉ đồng bộ được một lần"],"answer":"B","explain":"Tài khoản trực tuyến liên kết các thiết bị, dữ liệu thay đổi ở thiết bị này tự cập nhật ở thiết bị khác.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn P tải một tệp 200 MB với tốc độ 10 MB mỗi giây. Thời gian tải khoảng bao lâu?","options":["A. Khoảng 2 giây","B. Khoảng 2 phút","C. Khoảng 20 phút","D. Khoảng 20 giây"],"answer":"D","explain":"200 chia 10 = 20 giây trong điều kiện tốc độ ổn định.","points":0.25},{"type":"mcq","level":"NB","q":"Trình duyệt web nào sau đây phổ biến hiện nay?","options":["A. Notepad","B. Paint","C. Chrome","D. Calculator"],"answer":"C","explain":"Chrome là trình duyệt web phổ biến; Notepad, Paint, Calculator là phần mềm tiện ích của hệ điều hành.","points":0.25},{"type":"mcq","level":"NB","q":"Tiện ích mở rộng của trình duyệt dùng để làm gì?","options":["A. Bổ sung tính năng như chặn quảng cáo, kiểm tra chính tả","B. Tăng tốc độ CPU","C. Sửa phần cứng","D. Cài hệ điều hành"],"answer":"A","explain":"Tiện ích mở rộng thêm tính năng cho trình duyệt, giúp duyệt web tiện lợi hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Nhóm học tập trên mạng xã hội có lợi ích gì?","options":["A. Thay thế hoàn toàn việc học trên lớp","B. Trao đổi bài vở, chia sẻ tài liệu nhanh chóng","C. Tự động làm bài tập","D. Không cần thầy cô"],"answer":"B","explain":"Nhóm học tập trực tuyến hỗ trợ trao đổi mọi lúc nhưng không thay thế việc học tập trung và vai trò thầy cô.","points":0.25},{"type":"mcq","level":"NB","q":"Học liệu số là gì?","options":["A. Sách giấy","B. Bảng đen","C. Tài liệu học tập dưới dạng số như sách điện tử, video bài giảng","D. Phấn viết"],"answer":"C","explain":"Học liệu số là tài liệu dạng số, dễ lưu trữ, chia sẻ và truy cập qua thiết bị.","points":0.25},{"type":"mcq","level":"NB","q":"Để bài thuyết trình trực tuyến hiệu quả, cần chuẩn bị gì về công nghệ?","options":["A. Không cần chuẩn bị gì","B. Kiểm tra micro, camera, đường truyền và chia sẻ màn hình trước giờ thuyết trình","C. Tắt hết thiết bị","D. Chỉ cần nói to"],"answer":"B","explain":"Chuẩn bị kĩ thuật trước giúp buổi thuyết trình trực tuyến diễn ra suôn sẻ, không gián đoạn.","points":0.25},{"type":"mcq","level":"VD","q":"Lớp 12C họp trực tuyến nhưng nhiều bạn bị vang tiếng. Nguyên nhân và cách khắc phục hợp lý nhất là gì?","options":["A. Do mạng quá nhanh","B. Do máy tính quá mới","C. Không thể khắc phục","D. Do nhiều micro cùng bật; tắt micro khi không phát biểu"],"answer":"D","explain":"Vang tiếng thường do nhiều micro cùng thu; tắt micro khi không nói là cách khắc phục đơn giản, hiệu quả.","points":0.25},{"type":"mcq","level":"NB","q":"Chia sẻ vị trí trực tiếp liên tục trên mạng xã hội tiềm ẩn nguy cơ gì?","options":["A. Không có nguy cơ gì","B. Giúp điện thoại bền hơn","C. Kẻ xấu biết được nơi ở và lịch trình của bạn","D. Tăng tốc độ mạng"],"answer":"C","explain":"Công khai vị trí giúp kẻ xấu theo dõi; chỉ nên chia sẻ vị trí cho người tin cậy khi cần thiết.","points":0.25},{"type":"mcq","level":"NB","q":"Dấu hiệu của tin nhắn lừa đảo việc làm là gì?","options":["A. Có địa chỉ công ty rõ ràng","B. Hứa hẹn lương cao bất thường và yêu cầu nộp phí hoặc cung cấp thông tin cá nhân","C. Phỏng vấn trực tiếp minh bạch","D. Ký hợp đồng lao động"],"answer":"B","explain":"Lừa đảo việc làm thường đánh vào tâm lý muốn lương cao, yêu cầu nộp phí trước hoặc đánh cắp thông tin.","points":0.25},{"type":"mcq","level":"NB","q":"Luật bảo vệ dữ liệu cá nhân yêu cầu gì đối với tổ chức thu thập thông tin?","options":["A. Được thu thập tùy ý không cần hỏi","B. Được bán thông tin cho bên thứ ba","C. Phải được sự đồng ý và thông báo rõ mục đích sử dụng","D. Không cần bảo mật"],"answer":"C","explain":"Tổ chức chỉ được thu thập dữ liệu khi có sự đồng ý, đúng mục đích đã thông báo và phải bảo mật.","points":0.25},{"type":"mcq","level":"NB","q":"Hành vi phát tán tin giả về dịch bệnh có thể bị xử lý như thế nào?","options":["A. Được khen thưởng","B. Bị xử phạt hành chính hoặc truy cứu trách nhiệm hình sự","C. Không bị gì","D. Được tăng lương"],"answer":"B","explain":"Phát tán tin giả gây hoang mang dư luận là vi phạm pháp luật, bị xử phạt tùy mức độ.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn Q thấy một bài đăng xúc phạm thầy cô trong nhóm lớp. Q nên làm gì?","options":["A. Không tham gia, báo cáo bài đăng và nhắc bạn gỡ bỏ","B. Bình luận thêm cho vui","C. Chia sẻ ra ngoài","D. Mặc kệ"],"answer":"A","explain":"Thấy nội dung xúc phạm cần không tiếp tay, báo cáo và nhắc nhở để giữ môi trường mạng lành mạnh.","points":0.25},{"type":"mcq","level":"NB","q":"Vì sao nên suy nghĩ kỹ trước khi đăng ảnh cá nhân lên mạng?","options":["A. Vì ảnh có thể bị lưu lại, cắt ghép và dùng vào mục đích xấu","B. Vì ảnh làm đầy bộ nhớ","C. Vì không ai xem","D. Vì tốn pin"],"answer":"A","explain":"Ảnh đăng lên mạng khó thu hồi hoàn toàn và có thể bị kẻ xấu lợi dụng; cần cân nhắc kĩ.","points":0.25},{"type":"mcq","level":"NB","q":"Chuyên gia kiểm thử xâm nhập (pentest) làm công việc gì?","options":["A. Giả lập tấn công để tìm lỗ hổng bảo mật cho tổ chức","B. Tấn công thật để phá hoại","C. Viết virus","D. Đánh cắp dữ liệu"],"answer":"A","explain":"Pentest được tổ chức thuê để tìm lỗ hổng trước khi kẻ xấu khai thác, giúp tăng cường bảo mật.","points":0.25},{"type":"mcq","level":"TH","q":"Người quản trị cơ sở dữ liệu cần kĩ năng nào?","options":["A. Sửa ống nước","B. Nấu ăn","C. Thiết kế, vận hành và bảo mật hệ thống lưu trữ dữ liệu","D. Cắt tóc"],"answer":"C","explain":"Quản trị cơ sở dữ liệu đảm bảo dữ liệu an toàn, truy xuất nhanh và sao lưu đầy đủ.","points":0.25},{"type":"mcq","level":"TH","q":"Xe tự lái sử dụng những công nghệ nào?","options":["A. Chỉ cần vô lăng","B. Chỉ cần gương chiếu hậu","C. Không cần công nghệ gì","D. Cảm biến, bản đồ số và trí tuệ nhân tạo để nhận diện và điều khiển"],"answer":"D","explain":"Xe tự lái kết hợp cảm biến, camera, AI để quan sát môi trường và tự điều khiển an toàn.","points":0.25},{"type":"mcq","level":"NB","q":"Lớp học thông minh là gì?","options":["A. Lớp học không có học sinh","B. Lớp học ứng dụng công nghệ như bảng tương tác, phần mềm học tập","C. Lớp học không có thầy cô","D. Lớp học ngoài trời"],"answer":"B","explain":"Lớp học thông minh dùng thiết bị và phần mềm hiện đại để tăng tương tác và hiệu quả học tập.","points":0.25},{"type":"mcq","level":"VD","q":"Trường muốn xây dựng hệ thống điểm danh bằng nhận diện khuôn mặt. Lợi ích và lưu ý quan trọng nhất là gì?","options":["A. Chỉ có lợi ích, không cần lưu ý gì","B. Không có lợi ích","C. Nên công khai dữ liệu khuôn mặt","D. Điểm danh nhanh, chính xác; cần bảo mật dữ liệu khuôn mặt của học sinh"],"answer":"D","explain":"Nhận diện khuôn mặt giúp điểm danh nhanh nhưng dữ liệu sinh trắc học rất nhạy cảm, phải được bảo mật nghiêm ngặt.","points":0.25},{"type":"mcq","level":"TH","q":"Startup công nghệ giáo dục thành công nhờ yếu tố nào?","options":["A. Chỉ cần quảng cáo nhiều","B. Chỉ cần may mắn","C. Không cần hiểu giáo dục","D. Giải quyết đúng khó khăn thực tế của người học bằng công nghệ"],"answer":"D","explain":"Sản phẩm giáo dục tốt phải xuất phát từ nhu cầu học tập thật và am hiểu người học.","points":0.25},{"type":"truefalse","level":"TH","q":"Phòng tin học của trường dùng chung một máy in mạng. Một số bạn phát biểu:","statements":["a) Các máy tính trong phòng có thể gửi lệnh in tới máy in mạng.","b) Dùng chung máy in tốn kém hơn mua máy in riêng.","c) Mỗi máy tính bắt buộc phải có một máy in riêng mới in được.","d) Người quản trị có thể xem hàng đợi in để xử lý khi kẹt giấy."],"answer":["T","F","F","T"],"explain":"a) Đúng: máy in mạng nhận lệnh từ nhiều máy tính. b) Sai: chia sẻ thiết bị giúp giảm chi phí. c) Sai: nhiều máy dùng chung một máy in qua mạng. d) Đúng: quản trị viên quản lý hàng đợi in.","points":1},{"type":"truefalse","level":"VD","q":"Bảng BANGDIEM(MaHS, MonHoc, Diem) lưu điểm các môn của học sinh. Muốn liệt kê điểm môn Tin của lớp 12A1:","statements":["a) Không thể lọc các bản ghi theo môn học.","b) Có thể sắp xếp kết quả theo Diem giảm dần để biết ai cao nhất.","c) Chỉ lọc được khi bảng có thêm trường Lop.","d) Có thể tính điểm trung bình môn Tin từ các bản ghi đã lọc."],"answer":["F","T","T","T"],"explain":"a) Sai: hoàn toàn có thể lọc theo điều kiện MonHoc. b) Đúng: sắp xếp giảm dần đưa điểm cao lên đầu. c) Sai: với bảng hiện tại vẫn lọc được theo môn; muốn lọc theo lớp mới cần trường Lop. d) Đúng: tính trung bình trên các bản ghi đã lọc.","points":1},{"type":"truefalse","level":"TH","q":"Khi tạo biểu mẫu đăng ký trên trang web, một số bạn phát biểu:","statements":["a) Ô nhập một dòng dùng để nhập họ tên.","b) Nút chọn tròn dùng khi được chọn nhiều phương án cùng lúc.","c) Hộp kiểm dùng khi được chọn nhiều phương án cùng lúc.","d) Biểu mẫu trên web không thể gửi dữ liệu đi đâu được."],"answer":["T","F","T","T"],"explain":"a) Đúng: ô nhập một dòng phù hợp nhập họ tên. b) Sai: nút chọn tròn chỉ cho chọn một phương án duy nhất. c) Đúng: hộp kiểm cho nhiều lựa chọn. d) Sai: biểu mẫu gửi dữ liệu về máy chủ để xử lý.","points":1},{"type":"truefalse","level":"VD","q":"Bạn M muốn in ảnh kỷ yếu khổ lớn để treo ở lớp:","statements":["a) Nên chọn ảnh có độ phân giải cao để in không bị vỡ hình.","b) Ảnh chụp bằng điện thoại đời mới thường đủ chất lượng in khổ lớn.","c) In ảnh khổ lớn từ ảnh độ phân giải thấp vẫn sắc nét.","d) Nên xem thử bản in mẫu trước khi in hàng loạt."],"answer":["T","T","F","T"],"explain":"a) Đúng: độ phân giải cao cho ảnh in sắc nét. b) Đúng: camera điện thoại hiện nay cho ảnh chất lượng tốt. c) Sai: ảnh phân giải thấp in lớn sẽ bị vỡ, mờ. d) Đúng: in thử giúp kiểm tra màu sắc, chất lượng.","points":1},{"type":"truefalse","level":"TH","q":"Nhóm bạn dùng bảng tính để lập kế hoạch chi tiêu cho chuyến đi thực tế:","statements":["a) Có thể liệt kê các khoản chi theo từng mục trong bảng.","b) Không thể dùng hàm để tính tổng chi phí.","c) Vẽ biểu đồ tròn để thấy tỉ trọng từng khoản chi.","d) Bảng tính không thể lưu lại để xem sau."],"answer":["T","F","T","F"],"explain":"a) Đúng: bảng tính phù hợp liệt kê, phân loại. b) Sai: hàm tính tổng cộng nhanh các khoản chi. c) Đúng: biểu đồ tròn thể hiện tỉ trọng trực quan. d) Sai: bảng tính lưu được thành tệp để dùng lâu dài.","points":1},{"type":"truefalse","level":"VD","q":"Trường tổ chức cuộc thi thiết kế logo bằng phần mềm đồ họa:","statements":["a) Nên tìm hiểu ý nghĩa tên trường trước khi thiết kế.","b) Có thể dùng các hình khối cơ bản để tạo logo.","c) Logo càng nhiều chi tiết rườm rà càng đẹp.","d) Nên lưu bản thiết kế ở nhiều định dạng để dùng cho web và in ấn."],"answer":["T","T","F","T"],"explain":"a) Đúng: logo cần thể hiện đặc trưng của trường. b) Đúng: hình khối cơ bản tạo nên logo đẹp. c) Sai: logo đẹp thường đơn giản, dễ nhớ. d) Đúng: mỗi mục đích dùng cần định dạng phù hợp.","points":1}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Thu thập, xử lý và lưu trữ thông tin là các hoạt động nào của con người?","options":["A. Hoạt động thể thao","B. Hoạt động nghệ thuật","C. Hoạt động thông tin","D. Hoạt động xây dựng"],"answer":"C","explain":"Hoạt động thông tin gồm thu thập, xử lý, lưu trữ và truyền thông tin.","points":0.25},{"type":"mcq","level":"TH","q":"Dữ liệu số có thể ở những dạng nào?","options":["A. Chỉ dạng số","B. Số, văn bản, hình ảnh, âm thanh, video","C. Chỉ dạng chữ","D. Chỉ dạng hình ảnh"],"answer":"B","explain":"Dữ liệu số đa dạng: số, chữ, ảnh, âm thanh, video đều được mã hóa thành dãy bit.","points":0.25},{"type":"mcq","level":"NB","q":"Micro là thiết bị gì của máy tính?","options":["A. Thiết bị ra, phát âm thanh","B. Thiết bị vào, thu âm thanh vào máy tính","C. Thiết bị lưu trữ","D. Thiết bị mạng"],"answer":"B","explain":"Micro thu âm thanh từ bên ngoài vào máy tính nên là thiết bị vào.","points":0.25},{"type":"mcq","level":"NB","q":"Máy chiếu là thiết bị gì?","options":["A. Thiết bị vào","B. Thiết bị lưu trữ","C. Thiết bị ra, hiển thị hình ảnh phóng to lên màn chiếu","D. Thiết bị mạng"],"answer":"C","explain":"Máy chiếu đưa hình ảnh từ máy tính ra màn chiếu lớn nên là thiết bị ra.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao giáo viên thường dùng máy chiếu khi dạy học?","options":["A. Để trang trí lớp học","B. Để thay thế bảng đen hoàn toàn","C. Để học sinh không cần ghi chép","D. Để cả lớp cùng xem nội dung to, rõ"],"answer":"D","explain":"Máy chiếu phóng to nội dung giúp cả lớp quan sát dễ dàng, tăng hiệu quả dạy học.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn A cần trình bày bài thuyết trình cho 50 người xem trong hội trường. Thiết bị nào phù hợp nhất?","options":["A. Điện thoại để trên bàn","B. Máy tính kết nối máy chiếu","C. Máy tính không kết nối gì","D. Giấy viết tay"],"answer":"B","explain":"Máy chiếu phóng to nội dung từ máy tính giúp đông người cùng theo dõi.","points":0.25},{"type":"mcq","level":"NB","q":"Internet ra đời nhằm mục đích ban đầu nào?","options":["A. Chơi game","B. Xem phim","C. Kết nối các máy tính để chia sẻ tài nguyên và thông tin","D. Mua sắm"],"answer":"C","explain":"Internet khởi nguồn từ mạng nghiên cứu kết nối máy tính để chia sẻ tài nguyên, sau lan rộng toàn cầu.","points":0.25},{"type":"mcq","level":"TH","q":"Dịch vụ lưu trữ đám mây nào sau đây phổ biến?","options":["A. Máy giặt","B. Google Drive","C. Tủ lạnh","D. Xe đạp"],"answer":"B","explain":"Google Drive là dịch vụ lưu trữ đám mây phổ biến, cho phép lưu và chia sẻ tệp trực tuyến.","points":0.25},{"type":"mcq","level":"TH","q":"Để đánh giá một website có đáng tin cậy không, em nên xem xét điều gì?","options":["A. Màu sắc của website","B. Số lượng quảng cáo","C. Tên miền càng dài càng tốt","D. Tác giả, nguồn gốc, ngày đăng và đối chiếu với nguồn khác"],"answer":"D","explain":"Website tin cậy có tác giả rõ ràng, thông tin cập nhật và nhất quán với các nguồn uy tín khác.","points":0.25},{"type":"mcq","level":"TH","q":"Thanh toán trực tuyến cần lưu ý gì để an toàn?","options":["A. Thanh toán ở mọi website","B. Cho người lạ mượn tài khoản","C. Chỉ thanh toán trên website uy tín, kiểm tra kỹ đơn hàng và không tiết lộ mã OTP","D. Ghi mật khẩu lên giấy dán ở máy tính"],"answer":"C","explain":"Thanh toán trực tuyến an toàn cần chọn nơi uy tín và bảo mật tuyệt đối mã OTP, mật khẩu.","points":0.25},{"type":"mcq","level":"NB","q":"Tìm kiếm bằng hình ảnh giúp ích gì?","options":["A. Chỉ để giải trí","B. Tìm thông tin liên quan từ một bức ảnh có sẵn","C. Không có ích gì","D. Làm hỏng ảnh"],"answer":"B","explain":"Tìm kiếm bằng hình ảnh giúp nhận diện đối tượng, tìm nguồn gốc ảnh và thông tin liên quan.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn B thấy một bức ảnh người nổi tiếng làm việc từ thiện được chia sẻ rầm rộ nhưng nghi là ảnh ghép. B nên làm gì?","options":["A. Chia sẻ ngay","B. Bình luận khen ngợi","C. Tải về làm ảnh đại diện","D. Dùng công cụ tìm kiếm bằng hình ảnh để kiểm chứng trước khi tin và chia sẻ"],"answer":"D","explain":"Tìm kiếm ngược bằng hình ảnh giúp xác minh nguồn gốc, tránh lan truyền ảnh giả mạo.","points":0.25},{"type":"mcq","level":"NB","q":"Giấy phép Creative Commons cho phép điều gì?","options":["A. Cấm mọi người dùng tác phẩm","B. Tác phẩm không có tác giả","C. Tác giả cho phép người khác dùng tác phẩm với một số điều kiện","D. Dùng tùy ý không cần ghi nguồn"],"answer":"C","explain":"Creative Commons là giấy phép mở, cho phép chia sẻ, dùng lại tác phẩm theo điều kiện tác giả đặt ra.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nên cập nhật hệ điều hành thường xuyên?","options":["A. Để máy tính chậm hơn","B. Để mất dữ liệu","C. Để tốn pin","D. Để vá lỗ hổng bảo mật và cải thiện hiệu năng"],"answer":"D","explain":"Bản cập nhật hệ điều hành vá lỗi bảo mật, giúp máy tính an toàn và chạy ổn định hơn.","points":0.25},{"type":"mcq","level":"TH","q":"Gian lận trong thi trực tuyến là hành vi như thế nào?","options":["A. Nhờ người khác làm bài hộ hoặc tra cứu tài liệu khi bị cấm","B. Tự làm bài nghiêm túc","C. Nộp bài đúng giờ","D. Tắt micro khi được yêu cầu"],"answer":"A","explain":"Gian lận thi trực tuyến vi phạm quy chế thi và đạo đức học tập, có thể bị hủy kết quả.","points":0.25},{"type":"mcq","level":"NB","q":"Bình luận khiếm nhã trên mạng có thể dẫn tới hậu quả gì?","options":["A. Được nhiều người yêu mến","B. Bị xử phạt và ảnh hưởng uy tín bản thân","C. Không có hậu quả gì","D. Được tăng lương"],"answer":"B","explain":"Phát ngôn xúc phạm trên mạng có thể bị xử phạt hành chính và để lại hậu quả lâu dài cho uy tín cá nhân.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn C bị bạn khác lập nhóm chat để nói xấu mình. C nên xử lý thế nào?","options":["A. Lập nhóm khác để nói xấu lại","B. Im lặng chịu đựng một mình","C. Bỏ học","D. Giữ bằng chứng, rời nhóm và báo cho thầy cô, cha mẹ"],"answer":"D","explain":"Bị bắt nạt trên mạng cần giữ bằng chứng, không đáp trả bằng bạo lực và nhờ người lớn can thiệp.","points":0.25},{"type":"mcq","level":"TH","q":"Trích dẫn nguồn khi làm bài tập có ý nghĩa gì?","options":["A. Tôn trọng tác giả và giúp người đọc kiểm chứng thông tin","B. Làm bài dài hơn","C. Không có ý nghĩa gì","D. Để khoe đã đọc nhiều"],"answer":"A","explain":"Trích dẫn nguồn thể hiện sự trung thực học thuật và giúp người đọc tìm hiểu sâu hơn.","points":0.25},{"type":"mcq","level":"NB","q":"Nhóm nghề phát triển game làm công việc gì?","options":["A. Thiết kế và lập trình các trò chơi điện tử","B. Sửa xe máy","C. Bán quần áo","D. Trồng cây"],"answer":"A","explain":"Phát triển game kết hợp lập trình, đồ họa và âm thanh để tạo ra trò chơi điện tử.","points":0.25},{"type":"mcq","level":"TH","q":"Nhân viên hỗ trợ kỹ thuật (helpdesk) làm công việc gì?","options":["A. Sửa chữa nhà cửa","B. Lái xe","C. Hướng dẫn và khắc phục sự cố cho người dùng","D. Nấu ăn"],"answer":"C","explain":"Helpdesk là bộ phận hỗ trợ người dùng giải quyết các vấn đề kỹ thuật trong quá trình sử dụng.","points":0.25},{"type":"mcq","level":"TH","q":"AI hỗ trợ dịch thuật như thế nào?","options":["A. Dịch nhanh giữa nhiều ngôn ngữ, hỗ trợ học ngoại ngữ","B. Thay thế hoàn toàn việc học ngoại ngữ","C. Dịch luôn sai","D. Không có ứng dụng"],"answer":"A","explain":"AI dịch thuật giúp tra cứu nhanh, hỗ trợ giao tiếp đa ngôn ngữ nhưng người học vẫn cần nắm vững ngoại ngữ.","points":0.25},{"type":"mcq","level":"NB","q":"Công nghệ thực tế ảo (VR) trong học tập có ưu điểm gì?","options":["A. Thay thế hoàn toàn trường học","B. Không cần thiết bị","C. Gây hại cho mắt nên cấm dùng","D. Cho trải nghiệm trực quan như tham quan không gian 3D"],"answer":"D","explain":"VR tạo môi trường mô phỏng sinh động giúp học sinh trải nghiệm trực quan các hiện tượng, địa danh.","points":0.25},{"type":"mcq","level":"VD","q":"Một trung tâm ngoại ngữ muốn học viên luyện nói với người bản xứ ảo. Công nghệ nào phù hợp nhất?","options":["A. Trợ lý ảo AI có khả năng hội thoại bằng giọng nói","B. Máy chiếu","C. Bảng đen","D. Loa phường"],"answer":"A","explain":"Trợ lý ảo AI hội thoại giúp luyện nói mọi lúc, phản hồi tức thì và kiên nhẫn với người học.","points":0.25},{"type":"mcq","level":"TH","q":"Để trở thành lập trình viên giỏi, yếu tố nào quan trọng nhất?","options":["A. Tư duy logic, kiên trì luyện tập và luôn cập nhật kiến thức mới","B. Chỉ cần học thuộc code mẫu","C. Không cần thực hành","D. Chỉ cần may mắn"],"answer":"A","explain":"Lập trình đòi hỏi tư duy logic và thực hành liên tục vì công nghệ luôn thay đổi.","points":0.25},{"type":"truefalse","level":"VD","q":"So sánh mạng LAN và mạng WAN, một số bạn phát biểu:","statements":["a) Mạng LAN có phạm vi rộng hơn mạng WAN.","b) Tốc độ truyền dữ liệu trong mạng LAN thường cao hơn mạng WAN.","c) Mạng WAN bao phủ phạm vi rộng như kết nối giữa các tỉnh, quốc gia.","d) Mạng LAN và mạng WAN không thể kết nối với nhau."],"answer":["F","T","T","T"],"explain":"a) Sai: LAN là mạng cục bộ phạm vi hẹp hơn WAN. b) Đúng: LAN ít thiết bị trung gian nên tốc độ cao. c) Đúng: WAN là mạng diện rộng. d) Sai: mạng LAN kết nối ra WAN qua router, ví dụ truy cập Internet.","points":1},{"type":"truefalse","level":"TH","q":"Bảng SACH(MaSach, TenSach, Gia) trong cửa hàng sách:","statements":["a) Có thể tìm các sách có giá dưới 50000 đồng bằng cách lọc.","b) Sắp xếp theo Gia tăng dần giúp thấy sách rẻ nhất đầu tiên.","c) Không thể tính tổng giá trị các sách trong bảng.","d) Nhiều cuốn sách khác nhau có thể dùng chung một mã MaSach."],"answer":["T","T","F","F"],"explain":"a) Đúng: dùng điều kiện lọc theo trường Gia. b) Đúng: tăng dần đưa giá thấp lên trước. c) Sai: có thể dùng hàm tính tổng trên trường Gia. d) Sai: mã sách là khóa chính nên mỗi cuốn một mã riêng.","points":1},{"type":"truefalse","level":"VD","q":"Đoạn chương trình Python quản lý danh sách điểm: diem = [6, 7, 8]; thêm 9 vào cuối danh sách; sắp xếp tăng dần; in ra phần tử đầu tiên.","statements":["a) Sau khi thêm, danh sách có 4 phần tử.","b) Sau khi sắp xếp tăng dần, danh sách là [9, 8, 7, 6].","c) Phần tử đầu tiên in ra là 9.","d) Có thể xóa một phần tử khỏi danh sách khi cần."],"answer":["T","F","F","T"],"explain":"a) Đúng: thêm 9 vào danh sách 3 phần tử thành 4. b) Sai: sắp xếp tăng dần cho [6, 7, 8, 9]. c) Sai: phần tử đầu tiên sau sắp xếp là 6. d) Đúng: danh sách cho phép xóa phần tử.","points":1},{"type":"truefalse","level":"TH","q":"Khi di chuột lên một nút bấm trên trang web và nút đổi màu, một số bạn phát biểu:","statements":["a) Hiệu ứng đổi màu khi di chuột không có tác dụng gì với người dùng.","b) Trong CSS có thể định nghĩa kiểu riêng cho trạng thái di chuột lên phần tử.","c) Mọi trang web bắt buộc phải có hiệu ứng đổi màu khi di chuột.","d) Hiệu ứng này giúp trang web sinh động, dễ dùng hơn."],"answer":["F","T","F","T"],"explain":"a) Sai: phản hồi trực quan giúp nhận biết nút bấm. b) Đúng: CSS hỗ trợ định nghĩa kiểu cho trạng thái di chuột. c) Sai: đây là hiệu ứng tùy chọn, không bắt buộc. d) Đúng: hiệu ứng tăng trải nghiệm người dùng.","points":1},{"type":"truefalse","level":"TH","q":"Nhóm bạn thiết kế website bán hàng lưu niệm của trường:","statements":["a) Nên để giá tiền rõ ràng bên cạnh từng sản phẩm.","b) Cần có trang liên hệ để khách hàng hỏi thêm thông tin.","c) Nên dùng ảnh thật của sản phẩm thay vì ảnh minh họa chung chung.","d) Website bán hàng không cần thông tin liên hệ cũng được."],"answer":["T","T","T","F"],"explain":"a) Đúng: giá rõ ràng giúp khách hàng quyết định. b) Đúng: trang liên hệ tạo tin cậy. c) Đúng: ảnh thật giúp khách hàng tin tưởng. d) Sai: website bán hàng cần thông tin liên hệ rõ ràng.","points":1},{"type":"truefalse","level":"VD","q":"Bạn T làm video hướng dẫn gấp hạc giấy để tặng thầy cô:","statements":["a) Nên quay cận cảnh từng bước gấp để người xem dễ làm theo.","b) Có thể thêm chữ giải thích trên video ở mỗi bước.","c) Nên nói thật nhanh để video ngắn gọn.","d) Kiểm tra lại video trước khi đăng lên nhóm lớp."],"answer":["T","T","F","T"],"explain":"a) Đúng: quay cận cảnh giúp thấy rõ thao tác. b) Đúng: chữ giải thích hỗ trợ người xem. c) Sai: nên nói rõ ràng, vừa phải để người xem theo kịp. d) Đúng: kiểm tra trước tránh lỗi khi công bố.","points":1}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Tốc độ tải xuống thường được hiển thị với đơn vị nào?","options":["A. GB","B. Mbps","C. Hz","D. Inch"],"answer":"B","explain":"Mbps đo tốc độ truyền dữ liệu; GB đo dung lượng lưu trữ, Hz đo tần số, inch đo kích thước.","points":0.25},{"type":"mcq","level":"TH","q":"Máy ảnh số lưu trữ ảnh dưới dạng nào?","options":["A. Phim nhựa","B. Giấy in","C. Băng từ","D. Tệp số gồm các điểm ảnh"],"answer":"D","explain":"Máy ảnh số chụp và lưu ảnh thành tệp số gồm hàng triệu điểm ảnh, dễ chép và chia sẻ.","points":0.25},{"type":"mcq","level":"NB","q":"Thẻ nhớ thường dùng cho thiết bị nào?","options":["A. Tủ lạnh","B. Quạt điện","C. Điện thoại, máy ảnh để mở rộng bộ nhớ","D. Bàn là"],"answer":"C","explain":"Thẻ nhớ là bộ nhớ ngoài nhỏ gọn, dùng mở rộng lưu trữ cho điện thoại, máy ảnh.","points":0.25},{"type":"mcq","level":"TH","q":"Đăng nhập tài khoản trên thiết bị mới có lợi ích gì?","options":["A. Làm mất dữ liệu","B. Đồng bộ danh bạ, ảnh và cài đặt từ các thiết bị cũ","C. Tốn tiền","D. Không có ích gì"],"answer":"B","explain":"Tài khoản trực tuyến giúp chuyển dữ liệu và cài đặt sang thiết bị mới nhanh chóng.","points":0.25},{"type":"mcq","level":"NB","q":"Loa thông minh có thể làm gì?","options":["A. Nhận lệnh bằng giọng nói để phát nhạc, tra cứu thông tin","B. Nấu cơm","C. Giặt đồ","D. Tự di chuyển"],"answer":"A","explain":"Loa thông minh tích hợp trợ lý ảo, điều khiển bằng giọng nói.","points":0.25},{"type":"mcq","level":"VD","q":"Điện thoại của bạn K báo đầy bộ nhớ dù ít cài ứng dụng. Nguyên nhân có thể là gì và cách xử lý?","options":["A. Do màn hình quá to","B. Ảnh và video chiếm nhiều chỗ; chuyển lên đám mây rồi xóa bản trên máy","C. Do pin yếu","D. Không thể xử lý"],"answer":"B","explain":"Ảnh, video thường chiếm phần lớn bộ nhớ; chuyển lên đám mây là cách giải phóng hiệu quả.","points":0.25},{"type":"mcq","level":"NB","q":"Vòng đeo tay theo dõi sức khỏe gửi dữ liệu về đâu để phân tích?","options":["A. Ứng dụng trên điện thoại qua kết nối không dây","B. Tờ giấy","C. Bảng đen","D. Đài phát thanh"],"answer":"A","explain":"Thiết bị IoT như vòng đeo tay gửi dữ liệu về ứng dụng điện thoại để phân tích, hiển thị.","points":0.25},{"type":"mcq","level":"TH","q":"Cộng tác trên tài liệu đám mây có ưu điểm gì?","options":["A. Phải gửi qua lại nhiều bản","B. Dễ bị mất bản mới nhất","C. Nhiều người cùng chỉnh sửa một tài liệu theo thời gian thực","D. Không ai cùng sửa được"],"answer":"C","explain":"Tài liệu đám mây cho phép cộng tác trực tuyến, mọi thay đổi được lưu và đồng bộ ngay.","points":0.25},{"type":"mcq","level":"TH","q":"Quản lý hộp thư email hiệu quả bằng cách nào?","options":["A. Để hàng nghìn thư chưa đọc","B. Phân loại thư vào các thư mục, xóa thư rác thường xuyên","C. Mở mọi thư rác","D. Không bao giờ xóa thư"],"answer":"B","explain":"Sắp xếp thư vào thư mục và dọn thư rác giúp hộp thư gọn gàng, không bỏ lỡ thư quan trọng.","points":0.25},{"type":"mcq","level":"NB","q":"Tiện ích dịch trang web của trình duyệt giúp ích gì?","options":["A. Làm hỏng trang web","B. Xóa trang web","C. Tăng giá điện","D. Dịch nhanh nội dung trang web sang tiếng Việt"],"answer":"D","explain":"Tiện ích dịch giúp đọc tài liệu tiếng nước ngoài nhanh, hỗ trợ học tập và nghiên cứu.","points":0.25},{"type":"mcq","level":"TH","q":"Khi hộp thư đầy, việc cần làm là gì?","options":["A. Xóa thư cũ không cần thiết và hủy đăng ký thư quảng cáo","B. Tạo thêm 10 hộp thư mới","C. Bỏ không dùng email nữa","D. Mua thêm dung lượng ngay"],"answer":"A","explain":"Dọn thư cũ và hủy đăng ký quảng cáo là cách đơn giản, miễn phí để giải phóng hộp thư.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn L nhận được email trúng thưởng yêu cầu cung cấp số tài khoản để nhận tiền. L nên làm gì?","options":["A. Cung cấp ngay để nhận thưởng","B. Chuyển tiếp cho bạn bè","C. Không cung cấp thông tin, xóa email và báo cho người lớn","D. Trả lời để hỏi thêm"],"answer":"C","explain":"Trúng thưởng qua email lạ kèm yêu cầu thông tin tài khoản là lừa đảo; tuyệt đối không cung cấp.","points":0.25},{"type":"mcq","level":"NB","q":"Ảnh ghép mạo danh người nổi tiếng lan truyền trên mạng gây hại gì?","options":["A. Không gây hại gì","B. Giúp người nổi tiếng nổi tiếng hơn","C. Xúc phạm danh dự người khác và gây hiểu lầm cho cộng đồng","D. Là việc làm tốt"],"answer":"C","explain":"Ảnh giả mạo xúc phạm danh dự và có thể vi phạm pháp luật; cần báo cáo khi phát hiện.","points":0.25},{"type":"mcq","level":"TH","q":"Mã độc tống tiền (ransomware) nguy hiểm như thế nào?","options":["A. Mã hóa dữ liệu của nạn nhân rồi đòi tiền chuộc để mở khóa","B. Chỉ làm máy tính chạy nhanh hơn","C. Không gây hại","D. Tự biến mất"],"answer":"A","explain":"Ransomware mã hóa toàn bộ dữ liệu; phòng tránh bằng sao lưu thường xuyên và không mở tệp lạ.","points":0.25},{"type":"mcq","level":"TH","q":"Quyền được quên trên không gian mạng nghĩa là gì?","options":["A. Được quên mọi bài học","B. Được xóa tài khoản của người khác","C. Không ai được nhớ gì","D. Cá nhân có thể yêu cầu gỡ bỏ thông tin cá nhân không còn phù hợp"],"answer":"D","explain":"Quyền được quên giúp cá nhân yêu cầu gỡ thông tin cá nhân lỗi thời, bảo vệ riêng tư.","points":0.25},{"type":"mcq","level":"NB","q":"Tôn trọng người khác trên mạng thể hiện qua việc nào?","options":["A. Chế ảnh bôi nhọ bạn bè","B. Không xúc phạm, không lan truyền thông tin sai về người khác","C. Bịa đặt tin đồn","D. Quấy rối tin nhắn"],"answer":"B","explain":"Ứng xử văn minh trên mạng là tôn trọng danh dự, nhân phẩm của mọi người.","points":0.25},{"type":"mcq","level":"VD","q":"Một bức ảnh lũ lụt được chia sẻ kèm chú thích ở quê bạn nhưng bạn nghi không phải ảnh thật. Cách kiểm chứng tốt nhất là gì?","options":["A. Tìm kiếm bằng hình ảnh và đối chiếu với báo chí chính thống","B. Tin ngay và chia sẻ tiếp","C. Bình luận khen ảnh đẹp","D. Lưu về máy"],"answer":"A","explain":"Tìm kiếm ngược ảnh và đối chiếu nguồn tin cậy giúp xác minh trước khi lan truyền.","points":0.25},{"type":"mcq","level":"TH","q":"Khi vô tình xem được nội dung không phù hợp, em nên làm gì?","options":["A. Xem tiếp cho biết","B. Chia sẻ cho bạn xem","C. Tải về máy","D. Tắt ngay, không chia sẻ và kể cho cha mẹ, thầy cô"],"answer":"D","explain":"Nội dung không phù hợp cần được tránh xa và báo cho người lớn để được hướng dẫn.","points":0.25},{"type":"mcq","level":"NB","q":"Chuyên gia phân tích dữ liệu lớn làm công việc gì?","options":["A. Sửa xe đạp","B. Bán hàng rong","C. Trồng hoa","D. Xử lý khối dữ liệu khổng lồ để tìm xu hướng, dự báo"],"answer":"D","explain":"Phân tích dữ liệu lớn giúp doanh nghiệp dự báo nhu cầu, tối ưu hoạt động.","points":0.25},{"type":"mcq","level":"TH","q":"Người quản trị hệ thống chịu trách nhiệm gì?","options":["A. Dọn vệ sinh văn phòng","B. Vận hành máy chủ, đảm bảo hệ thống chạy ổn định và an toàn","C. Pha trà","D. Trông giữ xe"],"answer":"B","explain":"Quản trị hệ thống duy trì hạ tầng công nghệ thông tin cho tổ chức hoạt động liên tục.","points":0.25},{"type":"mcq","level":"TH","q":"AI hỗ trợ nông nghiệp thông minh như thế nào?","options":["A. Thay nông dân cấy lúa","B. Không có ứng dụng","C. Phân tích ảnh từ thiết bị bay để phát hiện sâu bệnh sớm","D. Chỉ để chụp ảnh"],"answer":"C","explain":"AI kết hợp cảm biến và thiết bị bay giúp giám sát cây trồng, tưới tiêu chính xác.","points":0.25},{"type":"mcq","level":"NB","q":"Lớp học thông minh cần những thiết bị nào?","options":["A. Bảng tương tác, máy chiếu và phần mềm học tập","B. Chỉ cần phấn và bảng đen","C. Không cần thiết bị gì","D. Chỉ cần quạt trần"],"answer":"A","explain":"Lớp học thông minh trang bị thiết bị tương tác và phần mềm để dạy học sinh động.","points":0.25},{"type":"mcq","level":"VD","q":"Hợp tác xã nông nghiệp muốn bán nông sản trực tuyến. Bước đầu tiên nên làm gì về công nghệ?","options":["A. Đóng cửa hợp tác xã","B. Chỉ bán cho người quen","C. Không cần công nghệ","D. Tạo gian hàng trên sàn thương mại điện tử uy tín và chụp ảnh sản phẩm đẹp"],"answer":"D","explain":"Sàn thương mại điện tử giúp tiếp cận khách hàng rộng; ảnh đẹp và mô tả rõ tăng tin cậy.","points":0.25},{"type":"mcq","level":"TH","q":"Dữ liệu mở của chính phủ mang lại lợi ích gì?","options":["A. Không có lợi ích","B. Chỉ để trang trí","C. Người dân và doanh nghiệp dùng dữ liệu công để nghiên cứu, phát triển dịch vụ","D. Gây mất an ninh"],"answer":"C","explain":"Dữ liệu mở thúc đẩy minh bạch và sáng tạo dịch vụ công ích từ cộng đồng.","points":0.25},{"type":"truefalse","level":"TH","q":"Các thiết bị trong nhà bạn H đều kết nối Internet. Một số bạn phát biểu:","statements":["a) Mọi thiết bị trong nhà đều dùng chung một địa chỉ mạng duy nhất.","b) Tivi thông minh có thể xem phim trực tuyến qua mạng.","c) Camera an ninh gửi hình ảnh về điện thoại qua Internet.","d) Thiết bị thông minh cần được cập nhật phần mềm để vá lỗi và an toàn."],"answer":["F","T","T","T"],"explain":"a) Sai: mỗi thiết bị cần một địa chỉ riêng để phân biệt trên mạng. b) Đúng: tivi thông minh truy cập dịch vụ trực tuyến. c) Đúng: camera IoT truyền hình ảnh qua mạng. d) Đúng: cập nhật giúp vá lỗi bảo mật.","points":1},{"type":"truefalse","level":"VD","q":"Bảng DOANHSO(Ngay, MatHang, SoLuong, DonGia) lưu doanh số cửa hàng. Muốn biết tổng doanh thu từng mặt hàng:","statements":["a) Cần tính SoLuong nhân DonGia cho từng bản ghi.","b) Có thể nhóm theo MatHang rồi tính tổng để được doanh thu từng mặt hàng.","c) Sắp xếp theo Ngay sẽ cho ra doanh thu từng mặt hàng.","d) Không thể tính doanh thu từ bảng này."],"answer":["T","T","F","F"],"explain":"a) Đúng: doanh thu mỗi bản ghi bằng số lượng nhân đơn giá. b) Đúng: nhóm theo mặt hàng rồi tính tổng cho ra doanh thu từng mặt hàng. c) Sai: sắp xếp theo ngày chỉ cho thứ tự thời gian, không cho doanh thu từng mặt hàng. d) Sai: hoàn toàn tính được doanh thu từ SoLuong và DonGia.","points":1},{"type":"truefalse","level":"VD","q":"Đoạn chương trình Python xử lý chuỗi họ tên: hoten = 'Nguyen Van An'; tach = hoten.split(' '); in ra số từ và từ cuối cùng.","statements":["a) Hàm split tách chuỗi thành danh sách các từ.","b) Danh sách tach có 3 phần tử.","c) Từ cuối cùng trong danh sách là 'Van'.","d) Có thể nối các từ lại bằng dấu cách để được chuỗi ban đầu."],"answer":["T","T","F","T"],"explain":"a) Đúng: split tách chuỗi theo dấu cách thành danh sách. b) Đúng: 'Nguyen', 'Van', 'An' là 3 từ. c) Sai: từ cuối cùng là 'An'. d) Đúng: nối các từ bằng dấu cách khôi phục chuỗi ban đầu.","points":1},{"type":"truefalse","level":"TH","q":"Khi tạo bảng thời khóa biểu trên trang web, một số bạn phát biểu:","statements":["a) Có thể gộp nhiều ô thành một ô lớn cho tiết học kéo dài 2 tiết.","b) Thẻ th dùng để tạo ô tiêu đề, thường in đậm và căn giữa.","c) Bảng trên web không thể có đường viền.","d) Có thể đặt màu nền khác nhau cho các hàng để dễ theo dõi."],"answer":["F","T","F","T"],"explain":"a) Sai: gộp ô trong HTML thực hiện được bằng thuộc tính gộp hàng, gộp cột. b) Đúng: th là ô tiêu đề. c) Sai: bảng có thể kẻ viền bằng CSS. d) Đúng: màu nền xen kẽ giúp dễ đọc.","points":1},{"type":"truefalse","level":"TH","q":"Nhóm bạn thiết kế poster chào mừng ngày Nhà giáo Việt Nam:","statements":["a) Nên đặt tiêu đề thật nhỏ ở góc khuất để tạo bất ngờ.","b) Hình ảnh minh họa cần phù hợp với chủ đề tri ân thầy cô.","c) Thông tin thời gian, địa điểm cần rõ ràng, dễ đọc.","d) Nên dùng phông chữ thật cầu kỳ, khó đọc để tạo ấn tượng."],"answer":["F","T","T","F"],"explain":"a) Sai: tiêu đề cần nổi bật, dễ thấy. b) Đúng: hình ảnh phục vụ chủ đề. c) Đúng: thông tin sự kiện phải rõ ràng. d) Sai: phông chữ cần dễ đọc, tránh quá cầu kỳ.","points":1},{"type":"truefalse","level":"TH","q":"Bạn L làm bài thu hoạch có tham khảo nhiều nguồn trên mạng:","statements":["a) Nên ghi rõ nguồn tham khảo cuối bài.","b) Copy nguyên văn mà không ghi nguồn vẫn được coi là bài của mình.","c) Có thể tóm tắt ý chính bằng lời của mình rồi ghi nguồn.","d) Không cần ghi nguồn vì thầy cô không kiểm tra."],"answer":["T","F","T","F"],"explain":"a) Đúng: ghi nguồn thể hiện sự trung thực. b) Sai: copy không ghi nguồn là đạo văn. c) Đúng: tóm tắt bằng lời mình kèm ghi nguồn là cách làm đúng. d) Sai: luôn cần ghi nguồn tham khảo.","points":1}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Số hóa tài liệu giấy mang lại lợi ích gì?","options":["A. Làm tài liệu biến mất","B. Lưu trữ gọn, tìm kiếm nhanh và chia sẻ dễ dàng","C. Tốn nhiều chỗ hơn","D. Không đọc được nữa"],"answer":"B","explain":"Số hóa chuyển tài liệu giấy thành dạng số, giúp lưu trữ gọn nhẹ và tra cứu nhanh.","points":0.25},{"type":"mcq","level":"TH","q":"Loa thông minh khác loa thường ở điểm nào?","options":["A. To hơn","B. Có trợ lý ảo, điều khiển bằng giọng nói và kết nối Internet","C. Nặng hơn","D. Đắt hơn"],"answer":"B","explain":"Loa thông minh tích hợp AI và Internet; loa thường chỉ phát âm thanh.","points":0.25},{"type":"mcq","level":"NB","q":"Lưu trữ cục bộ khác lưu trữ đám mây ở điểm nào?","options":["A. Hai loại giống hệt nhau","B. Cục bộ nhanh hơn luôn luôn","C. Cục bộ lưu trên thiết bị của mình; đám mây lưu trên máy chủ qua Internet","D. Đám mây không cần Internet"],"answer":"C","explain":"Lưu trữ cục bộ nằm trên ổ cứng, USB của người dùng; đám mây nằm trên máy chủ, truy cập qua Internet.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao nên cập nhật phần mềm diệt virus thường xuyên?","options":["A. Để máy tính đẹp hơn","B. Để nhận diện được các loại mã độc mới xuất hiện","C. Để tốn dung lượng","D. Để máy chạy chậm"],"answer":"B","explain":"Mã độc mới xuất hiện hằng ngày; cập nhật giúp phần mềm diệt virus nhận diện và ngăn chặn chúng.","points":0.25},{"type":"mcq","level":"NB","q":"Tệp tin nén thường có đuôi nào?","options":["A. .zip","B. .txt","C. .jpg","D. .mp3"],"answer":"A","explain":".zip là định dạng nén phổ biến; .txt là văn bản, .jpg là ảnh, .mp3 là âm thanh.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn T có 50 ảnh, mỗi ảnh 4 MB. Sau khi nén còn 60% dung lượng, tổng dung lượng là bao nhiêu?","options":["A. 200 MB","B. 120 MB","C. 60 MB","D. 300 MB"],"answer":"B","explain":"Tổng gốc 50 x 4 = 200 MB; nén còn 60% nghĩa là 200 x 0,6 = 120 MB.","points":0.25},{"type":"mcq","level":"NB","q":"Chia sẻ tệp ngang hàng (P2P) là gì?","options":["A. Các máy tính chia sẻ trực tiếp tệp cho nhau không qua máy chủ trung tâm","B. Chỉ tải từ máy chủ","C. Không chia sẻ được","D. Phải dùng USB"],"answer":"A","explain":"P2P cho phép các máy tính trao đổi tệp trực tiếp với nhau qua mạng.","points":0.25},{"type":"mcq","level":"TH","q":"Tốc độ Internet bị chậm vào giờ cao điểm vì sao?","options":["A. Do máy tính quá mới","B. Do trời nắng","C. Không có lý do","D. Nhiều người cùng dùng chung đường truyền nên băng thông bị chia sẻ"],"answer":"D","explain":"Giờ cao điểm nhiều người truy cập cùng lúc làm nghẽn đường truyền, tốc độ giảm.","points":0.25},{"type":"mcq","level":"TH","q":"Tìm kiếm bằng giọng nói có ưu điểm gì?","options":["A. Nhanh và tiện khi không rảnh tay gõ phím","B. Luôn chính xác tuyệt đối","C. Không cần Internet","D. Thay thế hoàn toàn việc gõ"],"answer":"A","explain":"Tìm kiếm giọng nói tiện lợi khi đang bận tay, dù độ chính xác phụ thuộc phát âm và môi trường.","points":0.25},{"type":"mcq","level":"NB","q":"Nhóm học tập trực tuyến nên có quy tắc nào?","options":["A. Tự do nói xấu nhau","B. Tôn trọng nhau, chỉ chia sẻ nội dung học tập","C. Chia sẻ tin giả","D. Không cần quy tắc"],"answer":"B","explain":"Nhóm học tập cần quy tắc ứng xử văn minh để duy trì môi trường học tập tích cực.","points":0.25},{"type":"mcq","level":"TH","q":"Để buổi học trực tuyến không bị gián đoạn, cần chuẩn bị gì?","options":["A. Đường truyền ổn định, thiết bị đầy pin và không gian yên tĩnh","B. Không cần chuẩn bị","C. Chỉ cần mở máy","D. Học ở nơi ồn ào"],"answer":"A","explain":"Chuẩn bị đường truyền, pin và không gian giúp buổi học trực tuyến suôn sẻ.","points":0.25},{"type":"mcq","level":"VD","q":"Trong giờ học trực tuyến, micro của bạn M bị rè. Cách xử lý hợp lý nhất là gì?","options":["A. Cứ để rè cho vui","B. Thoát học luôn","C. Mở loa thật to","D. Tắt micro, dùng chat để trao đổi và kiểm tra lại thiết bị sau giờ học"],"answer":"D","explain":"Micro rè gây khó chịu cho cả lớp; tắt micro và dùng chat là cách xử lý lịch sự, hợp lý.","points":0.25},{"type":"mcq","level":"NB","q":"Cài đặt phần mềm lậu có nguy cơ gì?","options":["A. Không có nguy cơ gì","B. Được bảo hành chính hãng","C. Vi phạm bản quyền và dễ bị nhiễm mã độc","D. Luôn an toàn"],"answer":"C","explain":"Phần mềm lậu vi phạm bản quyền và thường bị cài kèm mã độc, gây mất an toàn.","points":0.25},{"type":"mcq","level":"TH","q":"Nguyên tắc sao lưu 3-2-1 là gì?","options":["A. Sao lưu 3 lần một ngày","B. Mua 3 ổ cứng","C. Giữ 3 bản dữ liệu, trên 2 loại thiết bị khác nhau, 1 bản ở nơi khác","D. Không cần sao lưu"],"answer":"C","explain":"Nguyên tắc 3-2-1 đảm bảo luôn có bản dự phòng an toàn khi xảy ra sự cố.","points":0.25},{"type":"mcq","level":"TH","q":"Trích dẫn đúng cách trong bài tập là như thế nào?","options":["A. Copy mà không ghi nguồn","B. Bịa nguồn","C. Ghi rõ tác giả, tên tài liệu khi dùng ý tưởng của người khác","D. Không cần ghi gì"],"answer":"C","explain":"Trích dẫn đầy đủ thể hiện sự trung thực và tôn trọng công sức tác giả.","points":0.25},{"type":"mcq","level":"NB","q":"Mức phạt khi lan truyền tin giả trên mạng xã hội là gì?","options":["A. Được thưởng","B. Không bị gì","C. Được khen","D. Bị phạt tiền theo quy định pháp luật"],"answer":"D","explain":"Lan truyền tin giả bị xử phạt hành chính với mức phạt tiền đáng kể.","points":0.25},{"type":"mcq","level":"VD","q":"Bạn H vô tình chia sẻ một tin giả rồi phát hiện ra. H nên làm gì?","options":["A. Mặc kệ","B. Chia sẻ tiếp","C. Gỡ bài, đính chính và xin lỗi những người đã đọc","D. Đổ lỗi cho người khác"],"answer":"C","explain":"Khi phát hiện đã chia sẻ tin giả, cần gỡ bỏ, đính chính kịp thời để hạn chế tác hại.","points":0.25},{"type":"mcq","level":"TH","q":"Vì sao học sinh cần tìm hiểu pháp luật về an ninh mạng?","options":["A. Để thi cử","B. Không cần thiết","C. Để khoe kiến thức","D. Để biết quyền, nghĩa vụ và tránh vi phạm khi dùng Internet"],"answer":"D","explain":"Hiểu luật giúp dùng mạng an toàn, đúng pháp luật và tự bảo vệ mình.","points":0.25},{"type":"mcq","level":"NB","q":"Nhóm nghề kiểm thử phần mềm làm công việc gì?","options":["A. Tìm lỗi trong phần mềm trước khi phát hành","B. Bán phần mềm","C. Quảng cáo","D. Kế toán"],"answer":"A","explain":"Kiểm thử giúp phát hiện và sửa lỗi, đảm bảo phần mềm hoạt động đúng.","points":0.25},{"type":"mcq","level":"TH","q":"Thiết kế trải nghiệm người dùng (UX) quan trọng vì sao?","options":["A. Giúp sản phẩm dễ dùng, người dùng hài lòng và gắn bó","B. Chỉ để đẹp","C. Không quan trọng","D. Tốn thời gian"],"answer":"A","explain":"UX tốt giúp người dùng thao tác thuận tiện, tăng sự hài lòng và hiệu quả sử dụng.","points":0.25},{"type":"mcq","level":"TH","q":"AI hỗ trợ chẩn đoán y tế như thế nào?","options":["A. Thay thế bác sĩ hoàn toàn","B. Tự phẫu thuật","C. Không có ứng dụng","D. Phân tích ảnh chụp để phát hiện sớm dấu hiệu bệnh, hỗ trợ bác sĩ"],"answer":"D","explain":"AI phân tích hình ảnh y tế nhanh và chính xác, giúp bác sĩ phát hiện bệnh sớm hơn.","points":0.25},{"type":"mcq","level":"NB","q":"Công nghệ xanh là gì?","options":["A. Công nghệ màu xanh","B. Công nghệ trồng cây","C. Công nghệ thân thiện môi trường, tiết kiệm năng lượng","D. Công nghệ sơn tường"],"answer":"C","explain":"Công nghệ xanh giảm phát thải, tiết kiệm tài nguyên và bảo vệ môi trường.","points":0.25},{"type":"mcq","level":"VD","q":"Trung tâm dữ liệu muốn giảm tiền điện. Giải pháp công nghệ xanh nào phù hợp?","options":["A. Tắt hết máy chủ","B. Dùng hệ thống làm mát tiết kiệm điện và năng lượng tái tạo","C. Mở cửa sổ","D. Không làm gì"],"answer":"B","explain":"Làm mát hiệu quả và năng lượng tái tạo giúp trung tâm dữ liệu giảm tiêu thụ điện đáng kể.","points":0.25},{"type":"mcq","level":"TH","q":"Để theo kịp công nghệ mới, người làm CNTT nên làm gì?","options":["A. Ngừng học sau khi ra trường","B. Chỉ đọc báo giấy","C. Tránh dùng công nghệ mới","D. Tự học liên tục qua khóa học trực tuyến và thực hành"],"answer":"D","explain":"Công nghệ đổi mới hằng ngày nên người làm CNTT phải tự học suốt đời.","points":0.25},{"type":"truefalse","level":"TH","q":"Trường lắp thêm các điểm phát wifi để phủ sóng toàn trường. Một số bạn phát biểu:","statements":["a) Nên đặt mật khẩu cho wifi để người lạ không truy cập trái phép.","b) Vùng phủ sóng rộng giúp thiết bị di chuyển trong trường vẫn giữ kết nối.","c) Càng nhiều điểm phát wifi thì tốc độ Internet tổng càng tăng vô hạn.","d) Nên giới hạn băng thông cho từng người dùng để tránh nghẽn mạng."],"answer":["T","T","F","T"],"explain":"a) Đúng: mật khẩu wifi ngăn truy cập trái phép. b) Đúng: phủ sóng rộng giúp di chuyển vẫn kết nối được. c) Sai: tốc độ tổng vẫn bị giới hạn bởi đường truyền Internet chính. d) Đúng: giới hạn băng thông giúp mạng ổn định cho mọi người.","points":1},{"type":"truefalse","level":"VD","q":"Bảng NHANVIEN(MaNV, HoTen, Phong) và bảng CHAMCONG(MaNV, Ngay, GioLam) quản lý chấm công:","statements":["a) Hai bảng liên kết với nhau qua trường MaNV.","b) Có thể tính tổng giờ làm của từng nhân viên từ bảng CHAMCONG.","c) Muốn biết nhân viên thuộc phòng nào, ta tra bảng CHAMCONG.","d) Xóa một nhân viên ở bảng NHANVIEN không ảnh hưởng gì tới bảng CHAMCONG."],"answer":["T","T","F","F"],"explain":"a) Đúng: MaNV là trường chung để liên kết hai bảng. b) Đúng: cộng dồn GioLam theo MaNV cho ra tổng giờ làm từng người. c) Sai: thông tin phòng ban nằm ở bảng NHANVIEN. d) Sai: xóa nhân viên sẽ làm dữ liệu chấm công của người đó bị mồ côi.","points":1},{"type":"truefalse","level":"VD","q":"Đoạn chương trình Python dùng từ điển để lưu điểm: diem = {'Toan': 8, 'Tin': 9}; in ra điểm Tin; thêm môn Van với điểm 7.","statements":["a) Từ điển lưu dữ liệu theo cặp khóa và giá trị.","b) Điểm Tin lấy ra bằng cách truy cập khóa 'Toan' cho kết quả 9.","c) Không thể thêm cặp khóa giá trị mới vào từ điển đã tạo.","d) Có thể sửa giá trị của một khóa đã có trong từ điển."],"answer":["T","F","F","T"],"explain":"a) Đúng: từ điển gồm các cặp khóa và giá trị. b) Sai: phải truy cập khóa 'Tin' mới được 9. c) Sai: hoàn toàn có thể thêm cặp mới vào từ điển. d) Đúng: từ điển cho phép sửa giá trị của khóa.","points":1},{"type":"truefalse","level":"TH","q":"Khi trình bày nội dung trang web theo hàng ngang co giãn, một số bạn phát biểu:","statements":["a) Không thể xếp các khối nội dung nằm ngang, chỉ xếp dọc được.","b) Các khối có thể tự co giãn theo kích thước màn hình.","c) Bố cục co giãn khiến trang web hiển thị kém trên điện thoại.","d) Bố cục linh hoạt giúp xếp các khối nằm ngang mà không cần dùng bảng."],"answer":["F","T","F","T"],"explain":"a) Sai: kĩ thuật bố cục linh hoạt của CSS xếp được các khối nằm ngang. b) Đúng: đó là đặc điểm của bố cục linh hoạt. c) Sai: bố cục co giãn giúp hiển thị tốt trên nhiều thiết bị. d) Đúng: không bắt buộc dùng bảng để xếp ngang.","points":1},{"type":"truefalse","level":"TH","q":"Nhóm bạn viết kịch bản cho video giới thiệu câu lạc bộ robotics:","statements":["a) Kịch bản không cần cấu trúc, nghĩ gì quay nấy.","b) Nên phân công người quay, người dẫn và người dựng video.","c) Kịch bản nên ngắn gọn, súc tích.","d) Không cần dự trù thời gian, quay tới đâu hay tới đó."],"answer":["F","T","T","F"],"explain":"a) Sai: kịch bản cần cấu trúc mở đầu, nội dung chính, kết thúc rõ ràng. b) Đúng: phân công nhiệm vụ giúp làm việc hiệu quả. c) Đúng: kịch bản dài dòng gây khó theo dõi. d) Sai: dự trù thời gian giúp quay đúng tiến độ.","points":1},{"type":"truefalse","level":"VD","q":"Bạn S dùng bảng tính xếp loại học lực: điểm trung bình từ 8 trở lên xếp loại Giỏi, từ 6.5 đến dưới 8 xếp loại Khá, còn lại xếp loại Trung bình.","statements":["a) Có thể dùng hàm điều kiện để tự động xếp loại từ điểm số.","b) Hàm điều kiện chỉ dùng được cho môn Toán.","c) Với điểm 7.0, kết quả xếp loại là Khá.","d) Với điểm 8.5, kết quả xếp loại là Trung bình."],"answer":["T","F","T","F"],"explain":"a) Đúng: hàm điều kiện tự động xếp loại theo điểm. b) Sai: hàm điều kiện dùng được cho mọi bài toán phân loại theo điều kiện. c) Đúng: 7.0 nằm trong khoảng 6.5 đến dưới 8. d) Sai: 8.5 từ 8 trở lên nên xếp loại Giỏi.","points":1}]}]}
