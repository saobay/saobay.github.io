{"sets": [{"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Không bào lớn chứa dịch tế bào ở tế bào thực vật có chức năng chủ yếu là", "options": ["A. quang hợp tổng hợp chất hữu cơ", "B. hô hấp tế bào tạo ATP", "C. tổng hợp protein", "D. dự trữ nước và duy trì áp suất trương của tế bào"], "answer": "D", "explain": "Không bào trung tâm ở tế bào thực vật chứa dịch tế bào, giúp dự trữ nước, ion và duy trì áp suất trương giữ cho tế bào cứng chắc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Enzyme xúc tác các phản ứng sinh hóa trong tế bào có bản chất chủ yếu là", "options": ["A. lipid", "B. carbohydrate", "C. nucleic acid", "D. protein"], "answer": "D", "explain": "Phần lớn enzyme có bản chất là protein (một số ít là ARN có hoạt tính xúc tác - ribozyme). Enzyme làm giảm năng lượng hoạt hóa của phản ứng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong quang hợp ở thực vật, khí O2 được thải ra có nguồn gốc từ", "options": ["A. CO2", "B. nước", "C. glucose", "D. ATP"], "answer": "B", "explain": "O2 thải ra trong quang hợp có nguồn gốc từ quá trình quang phân li nước ở pha sáng, không phải từ CO2.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong hệ mạch máu của người, huyết áp cao nhất ở", "options": ["A. tĩnh mạch", "B. động mạch", "C. mao mạch", "D. tâm nhĩ"], "answer": "B", "explain": "Huyết áp giảm dần theo chiều dòng máu: cao nhất ở động mạch, thấp nhất ở tĩnh mạch chủ. Huyết áp là áp lực máu tác động lên thành mạch.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thụ tinh kép là đặc điểm đặc trưng của nhóm thực vật nào?", "options": ["A. Thực vật có hoa (hạt kín)", "B. Thực vật hạt trần", "C. Rêu", "D. Dương xỉ"], "answer": "A", "explain": "Thụ tinh kép (một tinh tử kết hợp với trứng, một tinh tử kết hợp với nhân cực) chỉ có ở thực vật hạt kín (thực vật có hoa).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bộ ba mở đầu trên phân tử mRNA (quy định amino acid methionine) là", "options": ["A. UAA", "B. UAG", "C. UGA", "D. AUG"], "answer": "D", "explain": "AUG là bộ ba mở đầu, mã hóa amino acid methionine và là tín hiệu khởi đầu dịch mã. UAA, UAG, UGA là các bộ ba kết thúc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong cấu trúc của một gene điển hình, vùng nào chứa trình tự nucleotide điều hòa quá trình phiên mã?", "options": ["A. Vùng mã hóa", "B. Vùng kết thúc", "C. Vùng điều hòa", "D. Vùng intron"], "answer": "C", "explain": "Gene gồm 3 vùng: vùng điều hòa (khởi động phiên mã), vùng mã hóa (mang thông tin di truyền) và vùng kết thúc (kết thúc phiên mã).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một chuỗi polipeptit hoàn chỉnh có 198 amino acid. Số nucleotide trên gene mã hóa chuỗi polipeptit này là", "options": ["A. 1188", "B. 1200", "C. 600", "D. 594"], "answer": "B", "explain": "Số codon = 198 + 1 (kết thúc) + 1 (mở đầu) = 200. Số nucleotide trên gene = 200 x 3 x 2 = 1200.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai nhiễm sắc thể trong một cặp nhiễm sắc thể tương đồng", "options": ["A. giống nhau về hình thái, kích thước; một chiếc có nguồn gốc từ bố, một chiếc từ mẹ", "B. hoàn toàn khác nhau về mọi đặc điểm", "C. đều có nguồn gốc từ bố", "D. luôn dính chặt với nhau"], "answer": "A", "explain": "Cặp NST tương đồng gồm 2 chiếc giống nhau về hình thái, kích thước và trình tự gene, một chiếc nhận từ bố, một chiếc nhận từ mẹ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dạng đột biến lặp đoạn nhiễm sắc thể có thể dẫn đến hậu quả nào?", "options": ["A. Luôn gây chết cho thể đột biến", "B. Làm mất hoàn toàn các gene trên đoạn lặp", "C. Làm tăng số lượng gene trên NST, tạo điều kiện hình thành gene mới", "D. Không bao giờ xảy ra trong tự nhiên"], "answer": "C", "explain": "Lặp đoạn làm tăng số bản sao của gene, tạo nguyên liệu cho tiến hóa (một bản sao giữ chức năng cũ, bản sao khác có thể biến đổi chức năng mới).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ở hoa mõm sói, allele A (hoa đỏ) trội không hoàn toàn so với allele a (hoa trắng); kiểu gene Aa cho hoa màu hồng. Phép lai P: AA x aa cho F1 có kiểu hình", "options": ["A. 100% hoa hồng", "B. 100% hoa đỏ", "C. 100% hoa trắng", "D. 1 hoa đỏ : 1 hoa trắng"], "answer": "A", "explain": "Trội không hoàn toàn: kiểu gene dị hợp Aa biểu hiện kiểu hình trung gian (hoa hồng). P: AA x aa cho F1 toàn Aa nên 100% hoa hồng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ở người, bệnh mù màu đỏ - lục do gene lặn a nằm trên NST X quy định. Một cặp vợ chồng đều bình thường sinh được một con trai bị mù màu. Tỉ lệ con gái bị mù màu của cặp vợ chồng này là", "options": ["A. 25%", "B. 0%", "C. 50%", "D. 100%"], "answer": "B", "explain": "Mẹ có kiểu gene XAXa, bố XAY. Con gái nhận XA từ bố nên luôn có ít nhất một allele A (XAXA hoặc XAXa), đều bình thường. Tỉ lệ con gái bị mù màu là 0%.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thường biến là", "options": ["A. biến đổi trong cấu trúc của gene", "B. biến đổi trong cấu trúc của NST", "C. biến dị tổ hợp qua giao phối", "D. biến đổi kiểu hình do tác động của môi trường, không di truyền được"], "answer": "D", "explain": "Thường biến là biến dị kiểu hình phát sinh do ảnh hưởng trực tiếp của môi trường, không liên quan đến biến đổi kiểu gene nên không di truyền.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vốn gene của quần thể là", "options": ["A. tập hợp tất cả các allele của mọi gene trong quần thể tại một thời điểm", "B. tổng số cá thể trong quần thể", "C. tổng số gene trong một cá thể", "D. tần số các kiểu gene trong quần thể"], "answer": "A", "explain": "Vốn gene là toàn bộ các allele của tất cả các gene trong quần thể. Tiến hóa nhỏ là sự thay đổi vốn gene của quần thể.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trẻ đồng sinh cùng trứng có đặc điểm nào sau đây?", "options": ["A. Cùng kiểu gene và cùng giới tính", "B. Khác nhau về kiểu gene", "C. Khác nhau về giới tính", "D. Khác nhau hoàn toàn mọi đặc điểm"], "answer": "A", "explain": "Trẻ đồng sinh cùng trứng phát triển từ một hợp tử nên có kiểu gene giống hệt nhau và cùng giới tính.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cơ quan thoái hóa là", "options": ["A. cơ quan phát triển rất mạnh", "B. cơ quan mới xuất hiện trong quá trình tiến hóa", "C. cơ quan phát triển không đầy đủ, không còn giữ chức năng ban đầu", "D. cơ quan có nguồn gốc khác nhưng chức năng giống nhau"], "answer": "C", "explain": "Cơ quan thoái hóa (ví dụ ruột thừa, xương cụt ở người) là di tích của cơ quan từng phát triển ở tổ tiên, là bằng chứng về nguồn gốc chung.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Chọn lọc ổn định là hình thức chọn lọc tự nhiên", "options": ["A. ưu tiên các kiểu hình ở một cực của đường cong phân bố", "B. đào thải các kiểu hình lệch khỏi giá trị trung bình, giữ lại kiểu hình trung bình", "C. tạo ra loài mới trong thời gian ngắn", "D. không làm thay đổi quần thể"], "answer": "B", "explain": "Chọn lọc ổn định (chọn lọc định hướng giữ nguyên) chống lại các biến dị lệch khỏi chuẩn trung bình, bảo tồn kiểu hình thích nghi vốn có của quần thể.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hệ sinh thái bao gồm", "options": ["A. chỉ các sinh vật sống", "B. chỉ môi trường vô sinh", "C. quần xã sinh vật và sinh cảnh (môi trường vô sinh)", "D. chỉ một quần thể sinh vật"], "answer": "C", "explain": "Hệ sinh thái là hệ thống hoàn chỉnh gồm quần xã sinh vật tác động qua lại với sinh cảnh của nó (ánh sáng, nước, đất, không khí...).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về quá trình phiên mã tổng hợp ARN. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Phiên mã là quá trình tổng hợp ARN dựa trên mạch mã gốc của gene.", "b) Enzyme ARN polymerase trượt dọc mạch mã gốc theo chiều 3' đến 5'.", "c) Ở sinh vật nhân thực, phiên mã diễn ra chủ yếu trong nhân tế bào.", "d) Mỗi gene trong tế bào chỉ phiên mã đúng một lần duy nhất."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: mARN được tổng hợp theo nguyên tắc bổ sung với mạch mã gốc. b) Đúng: ARN polymerase đọc mạch khuôn 3' → 5' để tổng hợp ARN 5' → 3'. c) Đúng: gene trong nhân nên phiên mã diễn ra trong nhân. d) Sai: một gene có thể phiên mã nhiều lần tạo nhiều phân tử ARN tùy nhu cầu tế bào.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Ở đậu Hà Lan, allele A (hạt vàng) trội hoàn toàn so với allele a (hạt xanh); allele B (hạt trơn) trội hoàn toàn so với allele b (hạt nhăn). Cho P: AABB x aabb, F1 tự thụ phấn. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) F1 có kiểu gene AaBb.", "b) F2 có 9 loại kiểu gene.", "c) Tỉ lệ hạt vàng, trơn ở F2 là 9/16.", "d) Số loại kiểu hình ở F2 là 3."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: P thuần chủng tương phản cho F1 toàn AaBb. b) Đúng: (1AA:2Aa:1aa)(1BB:2Bb:1bb) cho 3 x 3 = 9 loại kiểu gene. c) Đúng: hạt vàng trơn (A-B-) = 9/16 theo tỉ lệ 9:3:3:1. d) Sai: F2 có 4 loại kiểu hình (vàng trơn, vàng nhăn, xanh trơn, xanh nhăn).", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét lưới thức ăn: cây ngô → sâu ăn lá → chim sâu; cây ngô → chuột → rắn → đại bàng; chuột còn ăn sâu ăn lá. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Chuột vừa là sinh vật tiêu thụ cấp 1, vừa là sinh vật tiêu thụ cấp 2.", "b) Đại bàng thuộc bậc dinh dưỡng cấp 4.", "c) Chim sâu và chuột có quan hệ cạnh tranh về nguồn thức ăn.", "d) Nếu diệt hết sâu ăn lá thì chuột chắc chắn bị tuyệt chủng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: chuột ăn ngô (tiêu thụ cấp 1) và ăn sâu (tiêu thụ cấp 2). b) Đúng: ngô (1) → chuột (2) → rắn (3) → đại bàng (4). c) Đúng: cả hai cùng ăn sâu ăn lá nên cạnh tranh. d) Sai: chuột còn ăn ngô nên không tuyệt chủng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về di truyền học người. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Bệnh do gene trội nằm trên NST thường biểu hiện ở cả nam và nữ với tỉ lệ ngang nhau.", "b) Phương pháp phả hệ được dùng để nghiên cứu sự di truyền tính trạng ở người.", "c) Có thể chủ động thực hiện các phép lai như ở đậu Hà Lan để nghiên cứu di truyền người.", "d) Trẻ đồng sinh khác trứng có kiểu gene khác nhau như anh chị em ruột bình thường."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: gene trên NST thường di truyền như nhau ở hai giới. b) Đúng: phả hệ là phương pháp cơ bản nghiên cứu di truyền người. c) Sai: không thể thực hiện phép lai có chủ đích trên người vì lí do xã hội và đạo đức. d) Đúng: đồng sinh khác trứng phát triển từ hai hợp tử khác nhau.", "points": 1}, {"type": "short", "level": "TH", "q": "Một phân tử mRNA có 900 nucleotide. Số amino acid trong chuỗi polipeptit hoàn chỉnh do phân tử mRNA này tổng hợp là bao nhiêu? (Không tính bộ ba kết thúc và amino acid mở đầu bị cắt bỏ.)", "answer": "298", "explain": "Số codon = 900/3 = 300. Chuỗi polipeptit hoàn chỉnh = 300 - 1 (bộ ba kết thúc) - 1 (amino acid mở đầu) = 298 amino acid.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Ở một loài thực vật, allele D quy định hoa đỏ trội hoàn toàn so với allele d quy định hoa trắng. Cho P: Dd x Dd. Theo lí thuyết, tỉ lệ cây hoa đỏ ở F1 là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,75", "explain": "P: Dd x Dd cho F1: 1DD : 2Dd : 1dd. Cây hoa đỏ (D-) chiếm 3/4 = 0,75.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Một quần thể ngẫu phối có tần số allele A = 0,7. Khi quần thể đạt trạng thái cân bằng di truyền, tỉ lệ kiểu gene AA là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,49", "explain": "Theo Hardy - Weinberg, tỉ lệ kiểu gene AA = p^2 = 0,7^2 = 0,49.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Một loài sinh vật có bộ NST 2n = 48. Tế bào con được tạo ra sau quá trình nguyên phân của tế bào sinh dưỡng có bao nhiêu NST?", "answer": "48", "explain": "Nguyên phân giữ nguyên bộ NST: tế bào con có bộ NST 2n = 48 giống tế bào mẹ.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trong một hệ sinh thái, sinh vật sản xuất tích lũy được 8000 kcal năng lượng, hiệu suất sinh thái giữa các bậc dinh dưỡng là 10%. Theo lí thuyết, lượng năng lượng sinh vật tiêu thụ bậc 1 nhận được là bao nhiêu kcal?", "answer": "800", "explain": "Sinh vật tiêu thụ bậc 1 (bậc dinh dưỡng cấp 2) nhận 10% năng lượng của sinh vật sản xuất: 8000 x 10% = 800 kcal.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ở ruồi giấm, hai gene B/b và V/v cùng nằm trên một NST. Cho ruồi cái có kiểu gene BV/bv (tần số hoán vị gene f = 20%) lai với ruồi đực bv/bv. F1 thu được 1000 ruồi con. Theo lí thuyết, số ruồi con có kiểu hình trội về cả hai tính trạng là bao nhiêu?", "answer": "400", "explain": "Ruồi cái BV/bv với f = 20% tạo giao tử liên kết BV với tỉ lệ (1 - 0,2)/2 = 0,4. Ruồi đực chỉ cho giao tử bv. Ruồi con trội cả hai tính trạng (BV/bv) = 0,4 x 1000 = 400 con.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Lưới nội chất hạt (có đính ribosome) có chức năng chủ yếu là", "options": ["A. tổng hợp lipid", "B. quang hợp", "C. hô hấp tế bào", "D. tổng hợp protein"], "answer": "D", "explain": "Lưới nội chất hạt có ribosome bám trên màng, là nơi tổng hợp protein (protein màng, protein tiết). Lưới nội chất trơn tổng hợp lipid.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phân tử ATP được ví là", "options": ["A. đơn phân cấu tạo ADN", "B. đồng tiền năng lượng của tế bào", "C. enzyme xúc tác", "D. hoocmôn sinh trưởng"], "answer": "B", "explain": "ATP là dạng năng lượng trực tiếp cung cấp cho mọi hoạt động sống của tế bào nên được ví là đồng tiền năng lượng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hô hấp sáng là quá trình", "options": ["A. xảy ra ở mọi loài thực vật", "B. xảy ra ở thực vật C3 trong điều kiện nóng, khô, gây lãng phí sản phẩm quang hợp", "C. tạo ra nhiều ATP cho cây", "D. xảy ra ở động vật"], "answer": "B", "explain": "Hô hấp sáng xảy ra khi enzyme Rubisco cố định O2 thay vì CO2 ở thực vật C3 trong điều kiện nóng khô, làm giảm năng suất quang hợp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vitamin D có vai trò chủ yếu là giúp cơ thể", "options": ["A. hấp thụ canxi, phát triển xương", "B. đông máu", "C. chống oxi hóa", "D. tạo hồng cầu"], "answer": "A", "explain": "Vitamin D tăng cường hấp thu canxi và phospho ở ruột, giúp xương chắc khỏe; thiếu vitamin D gây còi xương ở trẻ em.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ở trạng thái điện thế nghỉ của tế bào thần kinh,", "options": ["A. mặt trong của màng tích điện dương so với mặt ngoài", "B. hai mặt của màng trung hòa điện", "C. mặt trong của màng tích điện âm so với mặt ngoài", "D. màng bị đảo cực hoàn toàn"], "answer": "C", "explain": "Điện thế nghỉ: mặt trong màng tích điện âm, mặt ngoài tích điện dương (khoảng -70mV) do sự phân bố không đều ion Na+, K+ và bơm Na-K.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Các bộ ba kết thúc quá trình dịch mã trên phân tử mRNA là", "options": ["A. UAA, UAG, UGA", "B. AUG, UAA, UAG", "C. AAA, UUU, GGG", "D. AUG, GUG, UUG"], "answer": "A", "explain": "Ba bộ ba kết thúc UAA, UAG, UGA không mã hóa amino acid mà là tín hiệu dừng dịch mã, giải phóng chuỗi polipeptit.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đột biến vô nghĩa là dạng đột biến gene", "options": ["A. không làm thay đổi amino acid", "B. làm lệch khung đọc mã di truyền", "C. biến đổi một codon mã hóa amino acid thành codon kết thúc", "D. thay thế một amino acid bằng amino acid khác"], "answer": "C", "explain": "Đột biến vô nghĩa (nonsense) tạo ra codon kết thúc sớm làm chuỗi polipeptit bị ngắn lại, thường mất chức năng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Enzyme có vai trò tháo xoắn phân tử ADN trong quá trình nhân đôi là", "options": ["A. ADN polymerase", "B. ligase", "C. ARN polymerase", "D. helicase"], "answer": "D", "explain": "Helicase tháo xoắn và tách hai mạch đơn của ADN tại chạc tái bản, tạo điều kiện cho ADN polymerase tổng hợp mạch mới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ở kì sau của nguyên phân, một tế bào người (2n = 46) có bao nhiêu nhiễm sắc thể?", "options": ["A. 46", "B. 23", "C. 69", "D. 92"], "answer": "D", "explain": "Ở kì sau nguyên phân, mỗi NST kép tách thành 2 NST đơn đi về hai cực nên tế bào có 92 NST đơn (tạm thời 4n).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hội chứng Turner ở người có kiểu gene nào sau đây?", "options": ["A. XXY", "B. XO", "C. XXX", "D. XYY"], "answer": "B", "explain": "Hội chứng Turner: nữ chỉ có một NST X (XO, 45 NST), biểu hiện lùn, cổ ngắn, không có kinh nguyệt. XXY là Klinefelter.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mendel nghiên cứu các quy luật di truyền trên đối tượng nào?", "options": ["A. Ruồi giấm", "B. Đậu Hà Lan", "C. Cây ngô", "D. Chuột bạch"], "answer": "B", "explain": "Gregor Mendel (1856-1863) lai các giống đậu Hà Lan thuần chủng khác nhau về từng cặp tính trạng và phát hiện quy luật phân li, phân li độc lập.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tương tác cộng gộp là hiện tượng", "options": ["A. một gene át chế sự biểu hiện của gene khác", "B. các gene không allele cùng tác động lên một tính trạng số lượng, mỗi gene đóng góp một phần như nhau", "C. một gene chi phối nhiều tính trạng", "D. các gene liên kết trên một NST"], "answer": "B", "explain": "Tương tác cộng gộp: nhiều gene không allele cùng quy định tính trạng số lượng (chiều cao, năng suất), mỗi allele trội đóng góp một phần bằng nhau vào kiểu hình.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ở gà, gene A (lông vằn) trội so với gene a (lông không vằn), nằm trên NST X (gà trống XX, gà mái XY). Cho gà trống XAXa lai với gà mái XaY. Tỉ lệ gà mái lông vằn ở F1 là", "options": ["A. 0%", "B. 100%", "C. 50%", "D. 25%"], "answer": "C", "explain": "Gà mái F1 nhận NST X từ bố (trống XAXa cho XA hoặc Xa với tỉ lệ 1/2) và Y từ mẹ. Gà mái lông vằn (XAY) chiếm 1/2 = 50%.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chọn lọc tự nhiên đào thải allele lặn có hại ra khỏi quần thể thường diễn ra", "options": ["A. chậm chạp vì allele lặn bị che lấp trong kiểu gene dị hợp", "B. rất nhanh chóng", "C. ngay trong một thế hệ", "D. không bao giờ xảy ra"], "answer": "A", "explain": "Allele lặn có hại tồn tại trong kiểu gene dị hợp mà không biểu hiện nên chọn lọc khó loại bỏ hoàn toàn, quá trình diễn ra chậm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một cặp vợ chồng đều bình thường. Bố của người vợ bị bệnh mù màu (gene lặn a trên NST X). Tỉ lệ con trai bị mù màu của cặp vợ chồng này là", "options": ["A. 50%", "B. 25%", "C. 0%", "D. 100%"], "answer": "A", "explain": "Bố vợ bị bệnh (XaY) truyền allele Xa cho con gái nên người vợ có kiểu gene XAXa. Chồng bình thường XAY. Con trai nhận X từ mẹ: 1/2 XA (bình thường), 1/2 Xa (bị bệnh). Vậy tỉ lệ con trai bị mù màu là 50%.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tiến hóa nhỏ là quá trình", "options": ["A. làm thay đổi vốn gene của quần thể", "B. hình thành các chi, họ mới", "C. hình thành các ngành mới", "D. gây tuyệt chủng hàng loạt"], "answer": "A", "explain": "Tiến hóa nhỏ là quá trình biến đổi vốn gene của quần thể dưới tác động của các nhân tố tiến hóa, kết quả dẫn đến hình thành loài mới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biến dị tổ hợp được xem là nguồn nguyên liệu thứ cấp của tiến hóa vì", "options": ["A. là những đột biến gene hoàn toàn mới", "B. không di truyền được cho đời sau", "C. được tạo ra từ sự tổ hợp lại các allele qua giao phối, là nguyên liệu trực tiếp cho chọn lọc tự nhiên", "D. do môi trường trực tiếp tạo ra"], "answer": "C", "explain": "Biến dị tổ hợp phát sinh do phân li, tổ hợp allele qua giảm phân và thụ tinh, tạo ra vô số kiểu gene mới là nguyên liệu trực tiếp cho chọn lọc tự nhiên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tháp sinh thái số lượng trong đa số các hệ sinh thái trên cạn có dạng", "options": ["A. luôn bị đảo ngược", "B. hình chữ nhật đứng", "C. đáy hẹp, đỉnh rộng", "D. đáy rộng, đỉnh hẹp"], "answer": "D", "explain": "Số lượng cá thể giảm dần qua các bậc dinh dưỡng (sinh vật sản xuất đông nhất) nên tháp số lượng thường có đáy rộng, đỉnh hẹp.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Ở một loài thực vật có bộ NST 2n = 20. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Ở kì giữa của nguyên phân, tế bào có 20 NST kép.", "b) Ở kì sau của nguyên phân, tế bào có 40 NST đơn.", "c) Sau giảm phân bình thường, mỗi giao tử có 10 NST.", "d) Thể tứ bội (4n) của loài này có 60 NST trong tế bào sinh dưỡng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: kì giữa nguyên phân có 2n NST kép = 20. b) Đúng: kì sau mỗi NST kép tách thành 2 NST đơn nên có 40 NST đơn. c) Đúng: giao tử có bộ NST đơn bội n = 10. d) Sai: thể tứ bội 4n = 40 NST, không phải 60.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về tiến hóa nhỏ và tiến hóa lớn. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Tiến hóa nhỏ diễn ra trên quy mô quần thể.", "b) Kết quả của tiến hóa nhỏ là hình thành loài mới.", "c) Hình thành loài là ranh giới giữa tiến hóa nhỏ và tiến hóa lớn.", "d) Tiến hóa lớn có thể quan sát trực tiếp bằng thực nghiệm trong thời gian ngắn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: tiến hóa nhỏ là sự thay đổi vốn gene của quần thể. b) Đúng: quần thể phân hóa đến cách li sinh sản thì hình thành loài mới. c) Đúng: loài là đơn vị cơ bản, là mốc phân chia hai quá trình. d) Sai: tiến hóa lớn diễn ra trên quy mô địa chất rộng lớn, không quan sát trực tiếp được mà phải suy luận từ hóa thạch và bằng chứng gián tiếp.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về mã di truyền. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Mã di truyền được đọc theo từng bộ ba liên tục, không gối lên nhau.", "b) Mã di truyền có tính phổ biến, hầu hết các loài sinh vật dùng chung.", "c) Mỗi amino acid chỉ được mã hóa bởi một bộ ba duy nhất.", "d) Có 64 bộ ba, trong đó 61 bộ ba mã hóa amino acid, 3 bộ ba kết thúc."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: mã bộ ba, đọc liên tục từ mã mở đầu. b) Đúng: tính phổ biến là bằng chứng nguồn gốc chung. c) Sai: mã di truyền có tính thoái hóa, một amino acid có thể do nhiều codon mã hóa. d) Đúng: 4^3 = 64 bộ ba, trừ 3 bộ ba kết thúc còn 61 codon mã hóa 20 loại amino acid.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về dòng năng lượng trong hệ sinh thái. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Hiệu suất sinh thái giữa các bậc dinh dưỡng thường khoảng 10%.", "b) Năng lượng thất thoát qua các bậc dinh dưỡng chủ yếu do hô hấp của sinh vật.", "c) Bậc dinh dưỡng càng cao thì tổng năng lượng tích lũy được càng lớn.", "d) Tháp năng lượng luôn có dạng đáy rộng, đỉnh hẹp."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: chỉ khoảng 10% năng lượng được chuyển lên bậc dinh dưỡng cao hơn. b) Đúng: phần lớn năng lượng mất đi do hô hấp, bài tiết, rơi rụng. c) Sai: năng lượng giảm dần qua các bậc nên bậc càng cao tích lũy càng ít. d) Đúng: tháp năng lượng không bao giờ bị đảo ngược.", "points": 1}, {"type": "short", "level": "TH", "q": "Một gene có 2700 nucleotide, trong đó có 300 adenine (A). Tổng số liên kết hidro của gene này là bao nhiêu?", "answer": "3750", "explain": "G = C = (2700 - 2 x 300)/2 = 1050. Số liên kết hidro = 2A + 3G = 2 x 300 + 3 x 1050 = 600 + 3150 = 3750.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Ở đậu Hà Lan, allele A quy định hoa đỏ trội hoàn toàn so với allele a quy định hoa trắng. Cho P: Aa x aa. Theo lí thuyết, tỉ lệ cây hoa đỏ ở F1 là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,5", "explain": "P: Aa x aa cho F1: 1Aa (hoa đỏ) : 1aa (hoa trắng). Tỉ lệ hoa đỏ = 1/2 = 0,5.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Một quần thể cân bằng di truyền có tỉ lệ kiểu gene aa = 0,16. Tần số allele a của quần thể này là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,4", "explain": "Quần thể cân bằng: q^2 = 0,16 nên q(a) = 0,4.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Một loài thực vật có bộ NST 2n = 14. Ở kì giữa của giảm phân I, tế bào có bao nhiêu NST kép?", "answer": "14", "explain": "Ở kì giữa I, các NST kép tương đồng bắt cặp và xếp thành 2 hàng; số NST kép trong tế bào vẫn là 2n = 14.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Xét một chuỗi thức ăn gồm 5 bậc dinh dưỡng. Sinh vật sản xuất tích lũy được 200000 kcal năng lượng, hiệu suất sinh thái giữa các bậc là 10%. Theo lí thuyết, lượng năng lượng sinh vật ở bậc dinh dưỡng cấp 4 nhận được là bao nhiêu kcal?", "answer": "200", "explain": "Bậc 2 nhận 200000 x 10% = 20000; bậc 3 nhận 2000; bậc dinh dưỡng cấp 4 nhận 2000 x 10% = 200 kcal.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một quần thể thực vật có cấu trúc di truyền: 40% AA : 40% Aa : 20% aa. Cho quần thể tự thụ phấn 1 thế hệ. Tỉ lệ kiểu gene aa ở thế hệ sau là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,3", "explain": "Tự thụ phấn 1 thế hệ: Aa cho 1/4 aa. Tỉ lệ aa = 0,2 + 0,4/4 = 0,2 + 0,1 = 0,3.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "TH", "q": "Lysosome trong tế bào động vật có chức năng nào sau đây?", "options": ["A. Phân hủy các bào quan già, tế bào bị tổn thương", "B. Quang hợp tổng hợp chất hữu cơ", "C. Tổng hợp protein", "D. Hô hấp tế bào"], "answer": "A", "explain": "Lysosome chứa enzyme thủy phân, phân hủy các bào quan già, vi khuẩn và tế bào bị tổn thương — được ví là nhà máy tái chế của tế bào.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nước trong tế bào tồn tại ở hai dạng nào?", "options": ["A. Nước cứng và nước mềm", "B. Nước cất và nước máy", "C. Nước ngọt và nước mặn", "D. Nước tự do và nước liên kết"], "answer": "D", "explain": "Nước tự do là dung môi cho các phản ứng sinh hóa; nước liên kết tham gia cấu tạo tế bào, bảo vệ cấu trúc khi môi trường thay đổi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây xanh hấp thụ nitơ từ đất chủ yếu dưới dạng nào?", "options": ["A. N2", "B. Protein", "C. NH4+ và NO3-", "D. Ure nguyên chất"], "answer": "C", "explain": "Cây chỉ hấp thụ được nitơ ở dạng ion NH4+ (amoni) và NO3- (nitrat); N2 khí quyển phải qua vi khuẩn cố định đạm mới dùng được.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi mạch máu bị tổn thương, tiểu cầu có vai trò nào?", "options": ["A. Thực bào vi khuẩn xâm nhập", "B. Giải phóng các yếu tố làm đông máu, bịt kín vết thương", "C. Vận chuyển O2 đến các mô", "D. Sản xuất kháng thể"], "answer": "B", "explain": "Tiểu cầu vỡ giải phóng enzyme khởi động chuỗi phản ứng đông máu tạo cục máu đông bịt kín vết thương, chống mất máu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sau khi thụ tinh ở thực vật có hoa, bầu nhụy phát triển thành", "options": ["A. hạt", "B. quả", "C. phôi", "D. nội nhũ"], "answer": "B", "explain": "Bầu nhụy phát triển thành quả; noãn phát triển thành hạt; hợp tử phát triển thành phôi; nhân cực phát triển thành nội nhũ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm khác nhau cơ bản giữa phiên mã ở sinh vật nhân sơ và sinh vật nhân thực là", "options": ["A. sinh vật nhân sơ không có quá trình phiên mã", "B. sinh vật nhân thực không phiên mã trong nhân", "C. ở nhân thực, mRNA sơ khai phải cắt bỏ intron, nối các exon mới đi dịch mã", "D. hai quá trình hoàn toàn giống nhau"], "answer": "C", "explain": "Gene nhân thực phân mảnh (có intron) nên mRNA sơ khai phải được chế biến (cắt intron, nối exon) thành mRNA trưởng thành; gene nhân sơ không phân mảnh nên dịch mã ngay.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phân tử tRNA có chức năng nào sau đây?", "options": ["A. Mang thông tin di truyền từ ADN trong nhân", "B. Vận chuyển amino acid đến ribosome trong dịch mã", "C. Cấu tạo nên ribosome", "D. Xúc tác phản ứng tổng hợp protein"], "answer": "B", "explain": "tRNA (ARN vận chuyển) mang amino acid đặc hiệu đến ribosome; đầu đối mã của tRNA khớp bổ sung với codon trên mRNA.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một gene nhân đôi 3 lần liên tiếp, mỗi gene con tạo ra đều phiên mã 2 lần. Tổng số phân tử mRNA được tạo ra là", "options": ["A. 16", "B. 8", "C. 6", "D. 12"], "answer": "A", "explain": "Nhân đôi 3 lần tạo 2^3 = 8 gene con; mỗi gene phiên mã 2 lần nên tổng số mRNA = 8 x 2 = 16.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cặp nhiễm sắc thể giới tính ở nam giới bình thường là", "options": ["A. XY", "B. XX", "C. XO", "D. XXY"], "answer": "A", "explain": "Nam giới có cặp NST giới tính XY, nữ giới XX. NST Y quyết định giới tính nam ở người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hội chứng mèo kêu ở người là do dạng đột biến nào gây ra?", "options": ["A. Thừa một NST số 21", "B. Thiếu một NST X", "C. Thừa một NST số 18", "D. Mất đoạn NST số 5"], "answer": "D", "explain": "Hội chứng mèo kêu do mất đoạn cánh ngắn NST số 5, trẻ khóc có tiếng như mèo kêu, chậm phát triển trí tuệ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ở ruồi giấm cái có kiểu gene BV/bv với tần số hoán vị gene f = 20%. Tỉ lệ giao tử BV được tạo ra là", "options": ["A. 40%", "B. 10%", "C. 20%", "D. 80%"], "answer": "A", "explain": "BV là giao tử liên kết. Tỉ lệ mỗi loại giao tử liên kết = (1 - f)/2 = (1 - 0,2)/2 = 0,4 = 40%.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa của hiện tượng di truyền liên kết gene là", "options": ["A. tạo ra nhiều biến dị tổ hợp", "B. làm tăng tần số hoán vị gene", "C. đảm bảo sự di truyền bền vững của nhóm gene quý cùng nằm trên một NST", "D. tạo ra gene mới"], "answer": "C", "explain": "Các gene liên kết cùng phân li trong giảm phân nên nhóm tính trạng tốt luôn đi cùng nhau, được ứng dụng để tạo giống (liên kết gene quý).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tính trạng do gene nằm trên NST thường di truyền", "options": ["A. theo dòng mẹ", "B. như nhau ở cả hai giới", "C. di truyền chéo", "D. chỉ biểu hiện ở nam giới"], "answer": "B", "explain": "Gene trên NST thường phân li độc lập với giới tính nên tỉ lệ kiểu hình ở hai giới là như nhau.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một quần thể cân bằng di truyền có 16% cá thể mang kiểu hình lặn (kiểu gene aa). Tần số allele A của quần thể là", "options": ["A. 0,4", "B. 0,6", "C. 0,16", "D. 0,84"], "answer": "B", "explain": "q^2 = 0,16 nên q(a) = 0,4. Suy ra p(A) = 1 - 0,4 = 0,6.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bệnh pheninketo niệu ở người là do", "options": ["A. thiếu enzyme chuyển hóa phenylalanine làm ứ đọng chất độc gây tổn thương thần kinh", "B. thừa một NST số 21", "C. gene lặn nằm trên NST X", "D. thiếu hồng cầu"], "answer": "A", "explain": "Pheninketo niệu do đột biến gene trên NST thường làm thiếu enzyme chuyển phenylalanine thành tyrosine; phenylalanine ứ đọng gây thiểu năng trí tuệ. Phát hiện sớm bằng chế độ ăn có thể phòng ngừa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thích nghi của sinh vật là", "options": ["A. sự tuyệt chủng của loài", "B. sự di cư theo mùa", "C. hiện tượng ngủ đông", "D. khả năng biến đổi hình thái, sinh lí phù hợp với môi trường sống"], "answer": "D", "explain": "Thích nghi là khả năng của sinh vật biến đổi đặc điểm hình thái, giải phẫu, sinh lí cho phù hợp với môi trường — kết quả của chọn lọc tự nhiên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo thuyết tiến hóa tổng hợp hiện đại, đơn vị tiến hóa cơ sở là", "options": ["A. cá thể", "B. loài", "C. hệ sinh thái", "D. quần thể"], "answer": "D", "explain": "Quần thể là đơn vị tiến hóa cơ sở vì là đơn vị tồn tại thực của loài trong tự nhiên, nơi diễn ra sự thay đổi vốn gene.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong một hệ sinh thái, sinh vật sản xuất tích lũy được 10000 kcal năng lượng, sinh vật tiêu thụ bậc 1 tích lũy được 1000 kcal. Hiệu suất sinh thái giữa hai bậc này là", "options": ["A. 1%", "B. 50%", "C. 10%", "D. 90%"], "answer": "C", "explain": "Hiệu suất sinh thái = năng lượng bậc sau / năng lượng bậc trước = 1000/10000 = 10%.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Ở một loài côn trùng, allele A (thân xám) trội hoàn toàn so với allele a (thân đen); allele B (cánh dài) trội hoàn toàn so với allele b (cánh cụt). Cho P: con cái AB/ab x con đực ab/ab (tần số hoán vị gene ở con cái f = 20%). Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) F1 có 4 loại kiểu hình.", "b) Tỉ lệ cá thể thân xám, cánh dài ở F1 là 40%.", "c) Tỉ lệ cá thể thân đen, cánh cụt ở F1 là 10%.", "d) Tỉ lệ cá thể thân xám, cánh cụt ở F1 là 10%."], "answer": ["T", "T", "F", "T"], "explain": "Con cái AB/ab với f = 20% tạo giao tử: AB = ab = 0,4 (liên kết); Ab = aB = 0,1 (hoán vị). Con đực chỉ cho ab. a) Đúng: 4 kiểu hình tương ứng 4 loại giao tử cái. b) Đúng: thân xám cánh dài (AB/ab) = 0,4 = 40%. c) Sai: thân đen cánh cụt (ab/ab) = 0,4 = 40%. d) Đúng: thân xám cánh cụt (Ab/ab) = 0,1 = 10%.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về hệ sinh thái. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Hệ sinh thái bao gồm quần xã sinh vật và sinh cảnh.", "b) Trao đổi vật chất trong hệ sinh thái diễn ra theo vòng tuần hoàn khép kín.", "c) Dòng năng lượng trong hệ sinh thái là dòng một chiều và giảm dần qua các bậc dinh dưỡng.", "d) Hệ sinh thái nhân tạo (đồng ruộng) thường ổn định hơn hệ sinh thái tự nhiên."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: đó là cấu trúc của hệ sinh thái. b) Đúng: vật chất được tái sử dụng theo các chu trình sinh địa hóa. c) Đúng: năng lượng mất dần qua hô hấp nên càng lên cao càng ít. d) Sai: hệ sinh thái nhân tạo có thành phần loài đơn giản, khả năng tự điều chỉnh kém nên kém ổn định hơn.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về cấu trúc tế bào. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Tế bào nhân sơ có kích thước nhỏ hơn nhiều so với tế bào nhân thực.", "b) Thành tế bào của vi khuẩn được cấu tạo từ peptidoglycan.", "c) Tế bào động vật có thành tế bào bằng cellulose.", "d) Màng sinh chất có tính thấm chọn lọc đối với các chất."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: tế bào nhân sơ chỉ khoảng 1-5 micromet. b) Đúng: peptidoglycan là thành phần đặc trưng của thành tế bào vi khuẩn. c) Sai: tế bào động vật không có thành tế bào; thành cellulose chỉ có ở thực vật. d) Đúng: màng sinh chất chỉ cho một số chất nhất định đi qua.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về các nhân tố tiến hóa và quá trình hình thành loài. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Đột biến là nguyên liệu sơ cấp, biến dị tổ hợp là nguyên liệu thứ cấp của tiến hóa.", "b) Chọn lọc tự nhiên tác động trực tiếp lên kiểu gene của cá thể.", "c) Cách li địa lí là nguyên nhân trực tiếp gây ra cách li sinh sản.", "d) Quá trình hình thành loài mới thường cần khoảng thời gian dài."], "answer": ["T", "F", "F", "T"], "explain": "a) Đúng: đột biến tạo allele mới (sơ cấp), giao phối tổ hợp lại thành kiểu gene mới (thứ cấp). b) Sai: chọn lọc tác động trực tiếp lên kiểu hình, gián tiếp làm thay đổi kiểu gene. c) Sai: cách li địa lí chỉ ngăn giao phối, tạo điều kiện cho các nhân tố khác phân hóa vốn gene; cách li sinh sản mới là nguyên nhân trực tiếp. d) Đúng: hình thành loài là quá trình lịch sử lâu dài.", "points": 1}, {"type": "short", "level": "TH", "q": "Một phân tử ADN nhân đôi 3 lần liên tiếp. Số phân tử ADN con được tạo ra là bao nhiêu?", "answer": "8", "explain": "Sau k lần nhân đôi, từ 1 phân tử ADN mẹ tạo ra 2^k phân tử con. Với k = 3: 2^3 = 8.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Ở một loài thực vật, allele B quy định quả tròn trội hoàn toàn so với allele b quy định quả dài. Cho P: Bb x Bb. Theo lí thuyết, tỉ lệ cây quả dài (bb) ở F1 là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,25", "explain": "P: Bb x Bb cho F1: 1BB : 2Bb : 1bb. Tỉ lệ quả dài (bb) = 1/4 = 0,25.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Một quần thể cân bằng di truyền có tần số allele A = 0,8. Tỉ lệ kiểu gene Aa của quần thể là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,32", "explain": "Theo Hardy - Weinberg: Aa = 2pq = 2 x 0,8 x 0,2 = 0,32.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Một loài động vật có bộ NST 2n = 38. Một tế bào sinh dưỡng của loài này nguyên phân 2 lần. Mỗi tế bào con được tạo ra có bao nhiêu NST?", "answer": "38", "explain": "Nguyên phân giữ nguyên bộ NST nên mỗi tế bào con đều có 2n = 38 NST (số lần nguyên phân không làm đổi số NST mỗi tế bào).", "points": 0.5}, {"type": "short", "level": "VD", "q": "Hiệu suất sinh thái giữa các bậc dinh dưỡng là 10%. Trong một hệ sinh thái, sinh vật tiêu thụ bậc 3 nhận được 25 kcal năng lượng. Theo lí thuyết, sinh vật sản xuất đã tích lũy được bao nhiêu kcal năng lượng?", "answer": "25000", "explain": "Sinh vật tiêu thụ bậc 3 thuộc bậc dinh dưỡng cấp 4. Năng lượng sinh vật sản xuất = 25/(0,1^3) = 25/0,001 = 25000 kcal.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ở một loài thực vật, cho P: AaBbDd x AaBbDd (các gene phân li độc lập, trội hoàn toàn). F1 thu được 3200 cá thể. Theo lí thuyết, số cá thể có kiểu hình lặn về cả 3 tính trạng là bao nhiêu?", "answer": "50", "explain": "Tỉ lệ kiểu hình lặn cả 3 tính trạng (aabbdd) = (1/4)^3 = 1/64. Số cá thể = 3200 x 1/64 = 50.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Trung thể trong tế bào động vật có chức năng nào sau đây?", "options": ["A. Hình thành thoi phân bào trong quá trình phân chia tế bào", "B. Quang hợp", "C. Tổng hợp protein", "D. Dự trữ chất dinh dưỡng"], "answer": "A", "explain": "Trung thể (gồm 2 trung tử) tổ chức các vi ống hình thành thoi phân bào, giúp NST phân li trong nguyên phân và giảm phân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa quang hợp và hô hấp ở thực vật là", "options": ["A. hai quá trình có phương trình tổng quát ngược chiều nhau", "B. hai quá trình hoàn toàn độc lập", "C. cả hai đều tạo ra ATP ròng cho cây", "D. cả hai đều thải khí O2"], "answer": "A", "explain": "Quang hợp: CO2 + H2O → chất hữu cơ + O2; hô hấp: chất hữu cơ + O2 → CO2 + H2O + ATP. Hai quá trình ngược chiều nhau, gắn bó mật thiết.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bón phân hợp lí cho cây trồng cần dựa trên cơ sở nào?", "options": ["A. Bón càng nhiều phân càng tốt", "B. Chỉ bón phân đạm cho mọi loại cây", "C. Nhu cầu dinh dưỡng của cây theo từng giai đoạn sinh trưởng và tính chất đất", "D. Bón phân vào bất cứ thời điểm nào"], "answer": "C", "explain": "Bón phân hợp lí phải đúng loại, đúng lượng, đúng lúc, đúng cách dựa trên nhu cầu của cây và đặc điểm đất để đạt năng suất cao, tránh lãng phí và ô nhiễm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chim và thú duy trì được thân nhiệt ổn định nhờ", "options": ["A. nhiệt độ môi trường luôn ổn định", "B. cơ chế điều hòa thân nhiệt của động vật đẳng nhiệt", "C. lớp lông vũ dày", "D. tập tính di cư theo mùa"], "answer": "B", "explain": "Chim và thú là động vật đẳng nhiệt (hằng nhiệt), có trung tâm điều hòa thân nhiệt ở não giúp thân nhiệt ổn định bất chấp nhiệt độ môi trường.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phát triển qua biến thái hoàn toàn ở côn trùng gồm các giai đoạn nào?", "options": ["A. Trứng → con non → trưởng thành", "B. Phôi → con non → trưởng thành", "C. Trứng → sâu (ấu trùng) → nhộng → trưởng thành", "D. Trứng → nhộng → trưởng thành"], "answer": "C", "explain": "Biến thái hoàn toàn (bướm, ong, ruồi): ấu trùng khác hẳn trưởng thành, phải qua giai đoạn nhộng để biến đổi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mỗi cặp nucleotide trên phân tử ADN dài bao nhiêu?", "options": ["A. 3,4 angstrom", "B. 34 angstrom", "C. 0,34 angstrom", "D. 20 angstrom"], "answer": "A", "explain": "Mỗi cặp base trên thang xoắn ADN dài 3,4 angstrom; một vòng xoắn có 10 cặp nucleotide (dài 34 angstrom), đường kính 20 angstrom.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đột biến sai nghĩa là dạng đột biến gene", "options": ["A. thay thế một codon mã hóa amino acid này thành codon mã hóa amino acid khác", "B. không làm thay đổi trình tự amino acid", "C. biến codon mã hóa thành codon kết thúc", "D. làm lệch khung đọc của mã di truyền"], "answer": "A", "explain": "Đột biến sai nghĩa (missense) thay một amino acid bằng amino acid khác trong chuỗi polipeptit, có thể làm thay đổi chức năng protein (ví dụ bệnh hồng cầu liềm).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một gene có 1200 cặp nucleotide phiên mã 1 lần tạo ra 1 phân tử mRNA; phân tử mRNA này tham gia dịch mã 1 lần. Số amino acid môi trường cung cấp cho quá trình dịch mã là", "options": ["A. 1198", "B. 1199", "C. 1200", "D. 600"], "answer": "B", "explain": "Số codon trên mRNA = 1200. Trừ 1 codon kết thúc không mã hóa amino acid, môi trường cung cấp 1200 - 1 = 1199 amino acid (kể cả amino acid mở đầu).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ở kì đầu của nguyên phân, mỗi nhiễm sắc thể có dạng", "options": ["A. NST đơn gồm 1 chromatid", "B. 4 chromatid độc lập", "C. sợi mảnh chưa co xoắn", "D. NST kép gồm 2 chromatid chị em"], "answer": "D", "explain": "Sau kì trung gian, mỗi NST đã nhân đôi thành NST kép gồm 2 chromatid chị em dính nhau ở tâm động, bắt đầu co xoắn ở kì đầu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tinh trùng của người đàn ông bình thường có bộ nhiễm sắc thể là", "options": ["A. 44A + XX", "B. 44A + XY", "C. 22A + X hoặc 22A + Y", "D. 22A"], "answer": "C", "explain": "Tinh trùng là giao tử đơn bội: 22 NST thường + 1 NST giới tính (X hoặc Y). Trứng luôn là 22A + X.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phép lai thuận nghịch là phép lai", "options": ["A. giữa hai dòng thuần chủng", "B. thay đổi vị trí làm bố, mẹ của các dạng bố mẹ trong hai phép lai", "C. phân tích cơ thể dị hợp", "D. tự thụ phấn bắt buộc"], "answer": "B", "explain": "Lai thuận nghịch đổi vai trò bố mẹ để phát hiện di truyền liên kết giới tính hoặc di truyền ngoài nhân (kết quả hai phép lai khác nhau).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ở một loài hoa, kiểu gene A-B- cho hoa đỏ; A-bb và aaB- cho hoa hồng; aabb cho hoa trắng. Cho P: AaBb x AaBb, tỉ lệ hoa hồng ở F1 là", "options": ["A. 6/16", "B. 9/16", "C. 3/16", "D. 1/16"], "answer": "A", "explain": "Tương tác bổ sung 9 : 6 : 1. Hoa hồng gồm A-bb (3/16) và aaB- (3/16), tổng 6/16.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiện tượng di truyền chéo (bố truyền tính trạng cho con gái, mẹ truyền cho con trai) là đặc điểm của", "options": ["A. gene nằm trên NST thường", "B. gene nằm ngoài nhân", "C. gene nằm trên NST Y", "D. gene nằm trên NST X"], "answer": "D", "explain": "Gene trên NST X di truyền chéo: bố (XY) truyền X cho 100% con gái; mẹ truyền X cho cả con trai và con gái.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đột biến gene được xem là nguồn nguyên liệu sơ cấp của tiến hóa vì", "options": ["A. luôn mang lại lợi ích", "B. tạo ra các allele mới cho quần thể", "C. làm tăng số lượng cá thể", "D. do con người chủ động tạo ra"], "answer": "B", "explain": "Đột biến phát sinh các allele mới — nguồn biến dị di truyền đầu tiên, là nguyên liệu sơ cấp để chọn lọc tự nhiên tác động.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hội chứng Klinefelter ở nam giới có kiểu gene nào?", "options": ["A. XO", "B. XXX", "C. XYY", "D. XXY"], "answer": "D", "explain": "Klinefelter: nam giới thừa một NST X (XXY, 47 NST), biểu hiện cao, tay chân dài, vô sinh. XO là Turner.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Bằng chứng tế bào học và sinh học phân tử về nguồn gốc chung của sinh giới cho thấy", "options": ["A. mọi loài đều khác nhau hoàn toàn về ADN", "B. không thể so sánh ADN giữa các loài", "C. các loài có quan hệ họ hàng càng gần thì trình tự ADN và protein càng giống nhau", "D. chỉ đúng với động vật có xương sống"], "answer": "C", "explain": "Mức độ giống nhau về trình tự nucleotide và amino acid tỉ lệ thuận với mức độ họ hàng — bằng chứng phân tử mạnh mẽ về nguồn gốc chung.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hình thành loài cùng khu vực địa lí ở động vật thường diễn ra bằng con đường nào?", "options": ["A. Cách li địa lí", "B. Lai xa kèm đa bội hóa", "C. Tự đa bội", "D. Cách li sinh thái"], "answer": "D", "explain": "Cùng khu vực địa lí, các quần thể thích nghi với ổ sinh thái khác nhau dẫn đến cách li sinh thái, rồi cách li sinh sản và hình thành loài mới.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong hệ sinh thái, nấm và vi khuẩn hoại sinh thuộc nhóm sinh vật nào?", "options": ["A. Sinh vật sản xuất", "B. Sinh vật phân giải", "C. Sinh vật tiêu thụ bậc 1", "D. Sinh vật tiêu thụ bậc 2"], "answer": "B", "explain": "Sinh vật phân giải (vi khuẩn, nấm hoại sinh) phân hủy xác sinh vật thành chất vô cơ trả lại môi trường, khép kín vòng tuần hoàn vật chất.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Ở một loài thực vật có bộ NST 2n = 24, xét một tế bào đang ở kì giữa của nguyên phân. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Tế bào đang có 24 NST kép.", "b) Tế bào đang có 48 chromatid.", "c) Tế bào đang có 48 tâm động.", "d) Kết thúc phân bào, mỗi tế bào con được tạo ra có 12 NST."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: kì giữa nguyên phân có 2n NST kép = 24. b) Đúng: mỗi NST kép có 2 chromatid nên có 48 chromatid. c) Sai: mỗi NST kép chỉ có 1 tâm động nên có 24 tâm động. d) Sai: nguyên phân giữ nguyên bộ NST, tế bào con có 2n = 24 NST.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về cấu trúc di truyền của quần thể. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Quần thể tự phối qua nhiều thế hệ làm tăng tỉ lệ thể đồng hợp.", "b) Quần thể ngẫu phối duy trì sự đa dạng di truyền của quần thể.", "c) Khi không có nhân tố tiến hóa tác động, tần số allele không đổi qua ngẫu phối.", "d) Giao phối cận huyết làm tăng ưu thế lai của thế hệ con."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: tự phối làm tăng đồng hợp, giảm dị hợp. b) Đúng: ngẫu phối tạo biến dị tổ hợp, duy trì đa dạng di truyền. c) Đúng: đó là nội dung định luật Hardy - Weinberg. d) Sai: giao phối cận huyết gây thoái hóa giống, làm giảm sức sống; ưu thế lai thu được từ lai khác dòng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét các phát biểu về các nhân tố sinh thái và giới hạn sinh thái. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Các nhân tố vô sinh gồm ánh sáng, nhiệt độ, nước, đất, không khí.", "b) Các nhân tố hữu sinh gồm mối quan hệ giữa các sinh vật với nhau.", "c) Cá rô phi Việt Nam chết khi nhiệt độ xuống dưới 5,6 độ C hoặc vượt quá 42 độ C.", "d) Sinh vật biến nhiệt có thân nhiệt luôn ổn định không phụ thuộc môi trường."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: đó là các nhân tố vô sinh chủ yếu. b) Đúng: nhân tố hữu sinh là tác động của sinh vật lên nhau. c) Đúng: giới hạn chịu đựng nhiệt độ của cá rô phi là 5,6 - 42 độ C. d) Sai: sinh vật biến nhiệt có thân nhiệt thay đổi theo môi trường; chỉ động vật hằng nhiệt mới giữ thân nhiệt ổn định.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về thành tựu của công nghệ gene. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Cừu Dolly được tạo ra bằng công nghệ nhân bản vô tính.", "b) Insulin chữa bệnh tiểu đường được sản xuất từ vi khuẩn E. coli biến đổi gene.", "c) Giống lúa vàng giàu vitamin A được tạo ra bằng công nghệ chuyển gene.", "d) Công nghệ gene chỉ áp dụng được trên vi sinh vật, không áp dụng được trên thực vật."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: Dolly (1996) là động vật nhân bản vô tính đầu tiên từ tế bào soma. b) Đúng: gene insulin người được chuyển vào E. coli để sản xuất insulin. c) Đúng: lúa vàng được chuyển gene tổng hợp tiền vitamin A. d) Sai: công nghệ gene áp dụng rộng rãi trên thực vật (lúa, ngô, đậu tương chuyển gene) và động vật.", "points": 1}, {"type": "short", "level": "TH", "q": "Một gene có 1500 cặp nucleotide. Số vòng xoắn của gene này là bao nhiêu?", "answer": "150", "explain": "Mỗi vòng xoắn của ADN có 10 cặp nucleotide. Số vòng xoắn = 1500/10 = 150.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Ở một loài thực vật, allele C quy định lá nguyên trội hoàn toàn so với allele c quy định lá xẻ. Cho P: Cc x Cc. Theo lí thuyết, tỉ lệ cây lá nguyên ở F1 là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,75", "explain": "P: Cc x Cc cho F1: 1CC : 2Cc : 1cc. Cây lá nguyên (C-) chiếm 3/4 = 0,75.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Một quần thể cân bằng di truyền có tỉ lệ kiểu gene AA = 0,09. Tần số allele A của quần thể này là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,3", "explain": "Quần thể cân bằng: p^2 = 0,09 nên p(A) = 0,3.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Một tế bào sinh dưỡng của người (2n = 46) đang ở kì sau của nguyên phân có bao nhiêu NST?", "answer": "92", "explain": "Ở kì sau nguyên phân, mỗi NST kép tách thành 2 NST đơn nên tế bào có 92 NST đơn.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trong một hệ sinh thái, sinh vật sản xuất tích lũy được 60000 kcal năng lượng, hiệu suất sinh thái giữa các bậc dinh dưỡng là 10%. Theo lí thuyết, lượng năng lượng sinh vật ở bậc dinh dưỡng cấp 4 nhận được là bao nhiêu kcal?", "answer": "60", "explain": "Bậc 2 nhận 60000 x 10% = 6000; bậc 3 nhận 600; bậc dinh dưỡng cấp 4 nhận 600 x 10% = 60 kcal.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ở một loài thực vật, cho P: AaBb x AaBb (hai gene phân li độc lập, trội hoàn toàn). Lấy ngẫu nhiên 2 cá thể ở F1. Theo lí thuyết, xác suất để cả 2 cá thể đều có kiểu gene AaBb là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,0625", "explain": "Tỉ lệ kiểu gene AaBb ở F1 = 1/2 x 1/2 = 1/4. Hai lần lấy độc lập nên xác suất cả 2 đều là AaBb = (1/4)^2 = 1/16 = 0,0625.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Tế bào chất của tế bào nhân thực là nơi", "options": ["A. diễn ra nhiều phản ứng sinh hóa của tế bào", "B. chứa phân tử ADN", "C. diễn ra quang hợp", "D. chứa nhiễm sắc thể"], "answer": "A", "explain": "Tế bào chất (bào tương) chứa các bào quan và là môi trường diễn ra nhiều phản ứng trao đổi chất của tế bào.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Protein có 4 bậc cấu trúc không gian. Bậc cấu trúc nào quyết định tính đặc thù của mỗi loại protein?", "options": ["A. Bậc 2 (xoắn alpha, gấp nếp beta)", "B. Bậc 1 (trình tự sắp xếp các amino acid)", "C. Bậc 3 (không gian 3 chiều)", "D. Bậc 4 (nhiều chuỗi polipeptit)"], "answer": "B", "explain": "Trình tự amino acid (cấu trúc bậc 1) do gene quy định, quyết định các bậc cấu trúc cao hơn và tính đặc thù về chức năng của protein.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quá trình quang hợp và hô hấp của sinh giới góp phần", "options": ["A. làm tăng mãi lượng CO2", "B. điều hòa lượng O2 và CO2 trong khí quyển", "C. làm giảm dần lượng O2", "D. không ảnh hưởng đến khí quyển"], "answer": "B", "explain": "Quang hợp hấp thụ CO2 thải O2, hô hấp dùng O2 thải CO2 — hai quá trình giữ cân bằng O2/CO2 trong khí quyển.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hệ dẫn truyền xung điện trong tim gồm các thành phần nào?", "options": ["A. Chỉ tâm nhĩ và tâm thất", "B. Các van tim", "C. Động mạch vành", "D. Nút xoang nhĩ, nút nhĩ thất, bó His và mạng Purkinje"], "answer": "D", "explain": "Xung điện phát từ nút xoang nhĩ, truyền qua nút nhĩ thất, bó His và mạng Purkinje làm tim co bóp nhịp nhàng, tự động.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quá trình giảm phân có ý nghĩa quan trọng trong sinh sản hữu tính vì", "options": ["A. làm tăng gấp đôi số NST", "B. tạo ra tế bào tứ bội", "C. tạo ra giao tử đơn bội, giúp duy trì bộ NST lưỡng bội qua thụ tinh", "D. tạo ra biến dị đột biến"], "answer": "C", "explain": "Giảm phân tạo giao tử (n); thụ tinh khôi phục bộ NST lưỡng bội (2n) đặc trưng của loài, đồng thời tạo biến dị tổ hợp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Có bao nhiêu loại bộ ba mã di truyền (codon)?", "options": ["A. 61", "B. 20", "C. 64", "D. 4"], "answer": "C", "explain": "Mỗi bộ ba gồm 3 nucleotide, mỗi vị trí có 4 loại base nên có 4^3 = 64 loại codon mã hóa 20 loại amino acid.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong gene phân mảnh ở sinh vật nhân thực, đoạn không mã hóa amino acid được gọi là", "options": ["A. intron", "B. exon", "C. codon", "D. promoter"], "answer": "A", "explain": "Gene phân mảnh gồm exon (mã hóa) xen kẽ intron (không mã hóa). Khi chế biến mRNA, intron bị cắt bỏ, các exon nối lại.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hậu quả của đột biến gene phụ thuộc chủ yếu vào", "options": ["A. màu sắc của sinh vật", "B. loại đột biến và vị trí xảy ra trong gene", "C. kích thước của tế bào", "D. nhiệt độ môi trường"], "answer": "B", "explain": "Đột biến ở vùng mã hóa quan trọng (ví dụ tạo codon kết thúc sớm, dịch khung) thường gây hại nặng; đột biến đồng nghĩa hoặc ở vùng ít quan trọng có thể trung tính.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một tế bào có bộ NST 2n = 16 đang ở kì đầu của giảm phân I. Tế bào này có bao nhiêu chromatid?", "options": ["A. 16", "B. 8", "C. 64", "D. 32"], "answer": "D", "explain": "Ở kì đầu I, mỗi NST đã nhân đôi thành NST kép gồm 2 chromatid. Tế bào 2n = 16 NST kép nên có 16 x 2 = 32 chromatid.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dâu tằm tứ bội (4n) được tạo ra bằng cônsixin có ưu điểm nào?", "options": ["A. Hoàn toàn bất thụ", "B. Cơ quan sinh dưỡng to khỏe, năng suất lá cao", "C. Nhỏ hơn dạng lưỡng bội", "D. Không có ưu điểm gì"], "answer": "B", "explain": "Thể đa bội chẵn (4n) có tế bào to, cơ quan sinh dưỡng phát triển mạnh, được ứng dụng tạo giống cây trồng năng suất cao.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phép lai một cặp tính trạng của Mendel là phép lai", "options": ["A. giữa hai dòng khác nhau về hai cặp tính trạng", "B. giữa hai dòng thuần chủng tương phản về một cặp tính trạng", "C. phân tích cơ thể dị hợp", "D. tự thụ phấn bắt buộc"], "answer": "B", "explain": "Mendel lai hai dòng đậu Hà Lan thuần chủng khác nhau về một cặp tính trạng tương phản (ví dụ hoa đỏ x hoa trắng) và theo dõi sự di truyền qua các thế hệ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điều kiện để các cặp gene phân li độc lập với nhau là", "options": ["A. các cặp gene nằm trên các cặp NST tương đồng khác nhau", "B. các gene liên kết trên một NST", "C. các gene cùng nằm trên một NST", "D. các gene nằm ngoài nhân"], "answer": "A", "explain": "Các gene nằm trên các cặp NST tương đồng khác nhau sẽ phân li độc lập khi các NST phân li độc lập trong giảm phân.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trên một NST, gene A cách gene B 10 cM, gene B cách gene C 15 cM, gene A cách gene C 25 cM. Thứ tự các gene trên NST là", "options": ["A. A - B - C", "B. B - A - C", "C. A - C - B", "D. C - A - B"], "answer": "A", "explain": "Khoảng cách A-C (25 cM) bằng tổng A-B (10 cM) và B-C (15 cM) nên gene B nằm giữa A và C: thứ tự A - B - C.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ở một quần thể, allele lặn a gây chết ở thể đồng hợp aa. Chọn lọc tự nhiên tác động lên allele a sẽ", "options": ["A. loại bỏ hoàn toàn allele a ngay lập tức", "B. làm tăng tần số allele a", "C. làm giảm dần tần số allele a nhưng khó loại bỏ hoàn toàn", "D. không tác động gì đến allele a"], "answer": "C", "explain": "Cá thể aa bị đào thải nhưng allele a vẫn tồn tại trong kiểu gene dị hợp Aa (không biểu hiện) nên chọn lọc chỉ làm giảm dần chứ khó loại bỏ hoàn toàn allele lặn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ung thư là bệnh", "options": ["A. chỉ do một loại virus duy nhất gây ra", "B. di truyền đơn gene theo quy luật Mendel", "C. do đột biến ở các gene điều hòa phân bào (gene tiền ung thư, gene ức chế khối u)", "D. không liên quan đến đột biến"], "answer": "C", "explain": "Ung thư phát sinh khi các gene kiểm soát chu trình tế bào bị đột biến: gene tiền ung thư hoạt động quá mức hoặc gene ức chế khối u mất chức năng, tế bào phân chia không kiểm soát.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Các nhân tố đột biến, di - nhập gene, giao phối không ngẫu nhiên, phiêu bạt di truyền được gọi là nhân tố vô hướng vì chúng", "options": ["A. định hướng quá trình tiến hóa", "B. luôn mang lại lợi ích cho sinh vật", "C. do con người chủ động tạo ra", "D. làm thay đổi tần số allele một cách vô hướng (ngẫu nhiên)"], "answer": "D", "explain": "Các nhân tố này làm thay đổi vốn gene nhưng không theo hướng xác định (vô hướng); chỉ có chọn lọc tự nhiên là nhân tố định hướng tiến hóa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hai loài hoa thân thuộc sống cùng khu vực nhưng một loài nở hoa vào mùa xuân, loài kia nở hoa vào mùa thu nên không giao phấn được với nhau. Đây là dạng cách li nào?", "options": ["A. Cách li thời gian (mùa vụ)", "B. Cách li địa lí", "C. Cách li cơ học", "D. Cách li tập tính"], "answer": "A", "explain": "Khác nhau về thời điểm ra hoa (mùa vụ) khiến hai loài không giao phối được dù sống chung khu vực — là cách li thời gian, một dạng cách li trước hợp tử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đa dạng sinh học được thể hiện ở các cấp độ nào?", "options": ["A. Chỉ số lượng cá thể", "B. Chỉ số lượng loài", "C. Chỉ số lượng hệ sinh thái", "D. Đa dạng gene, đa dạng loài và đa dạng hệ sinh thái"], "answer": "D", "explain": "Đa dạng sinh học gồm 3 cấp độ: đa dạng di truyền (gene), đa dạng loài và đa dạng hệ sinh thái.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Một gene ở sinh vật nhân sơ dài 5100 angstrom. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Tổng số nucleotide của gene là 3000.", "b) Số bộ ba (codon) trên phân tử mRNA do gene phiên mã là 500.", "c) Số amino acid trong chuỗi polipeptit hoàn chỉnh do gene tổng hợp là 498.", "d) Nếu gene bị đột biến thêm 1 cặp nucleotide thì số amino acid của chuỗi polipeptit chắc chắn tăng lên."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: N = 2L/3,4 = 2 x 5100/3,4 = 3000. b) Đúng: số codon = 1500/3 = 500. c) Đúng: 500 - 1 (kết thúc) - 1 (mở đầu) = 498. d) Sai: thêm 1 cặp nucleotide gây dịch khung, trình tự amino acid thay đổi hoàn toàn, số lượng có thể tăng, giảm hoặc xuất hiện codon kết thúc sớm — không chắc chắn tăng.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét chuỗi thức ăn trong một ao nuôi: tảo → giáp xác → cá mè → cá quả. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Cá quả thuộc bậc dinh dưỡng cấp 4.", "b) Tảo là sinh vật sản xuất của chuỗi thức ăn.", "c) Nếu đánh bắt hết cá quả thì số lượng cá mè có thể tăng lên.", "d) Giáp xác vừa là sinh vật sản xuất, vừa là sinh vật tiêu thụ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: tảo (1) → giáp xác (2) → cá mè (3) → cá quả (4). b) Đúng: tảo quang hợp là sinh vật sản xuất. c) Đúng: mất kẻ săn mồi, cá mè ít bị ăn thịt hơn. d) Sai: giáp xác ăn tảo nên chỉ là sinh vật tiêu thụ bậc 1.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về quá trình tiến hóa đang diễn ra hiện nay. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Sinh giới ngày nay vẫn đang tiếp tục tiến hóa.", "b) Con người hiện nay không còn chịu tác động của chọn lọc tự nhiên.", "c) Hiện tượng vi khuẩn kháng thuốc là ví dụ về tiến hóa đang diễn ra.", "d) Tiến hóa chỉ xảy ra ở động vật bậc cao, không xảy ra ở vi sinh vật."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: tiến hóa là quá trình liên tục. b) Sai: con người vẫn chịu tác động của chọn lọc (ví dụ kháng bệnh, thích nghi độ cao). c) Đúng: vi khuẩn kháng kháng sinh do chọn lọc giữ lại các chủng mang gene kháng thuốc. d) Sai: vi sinh vật tiến hóa rất nhanh do vòng đời ngắn, đột biến nhiều.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về định luật Hardy - Weinberg và các nhân tố tiến hóa. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Định luật Hardy - Weinberg chỉ nghiệm đúng khi quần thể có kích thước đủ lớn.", "b) Quần thể bị cách li hoàn toàn thì không có sự di - nhập gene.", "c) Đột biến thuận và đột biến nghịch đều làm thay đổi tần số allele của quần thể.", "d) Giao phối ngẫu nhiên là một nhân tố tiến hóa."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: quần thể lớn là một trong 5 điều kiện của định luật. b) Đúng: cách li ngăn trao đổi cá thể/gene. c) Đúng: cả hai chiều đột biến đều tạo allele mới, làm đổi tần số allele. d) Sai: giao phối ngẫu nhiên không làm thay đổi tần số allele nên không phải nhân tố tiến hóa.", "points": 1}, {"type": "short", "level": "TH", "q": "Một phân tử mRNA có 1200 nucleotide. Số amino acid trong chuỗi polipeptit hoàn chỉnh do phân tử mRNA này tổng hợp là bao nhiêu? (Không tính bộ ba kết thúc và amino acid mở đầu bị cắt bỏ.)", "answer": "398", "explain": "Số codon = 1200/3 = 400. Chuỗi hoàn chỉnh = 400 - 1 (kết thúc) - 1 (mở đầu) = 398 amino acid.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Ở một loài thực vật, allele E quy định thân cao trội hoàn toàn so với allele e quy định thân thấp. Cho P: Ee x ee. Theo lí thuyết, tỉ lệ cây thân cao ở F1 là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,5", "explain": "P: Ee x ee cho F1: 1Ee (thân cao) : 1ee (thân thấp). Tỉ lệ thân cao = 1/2 = 0,5.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Một quần thể cân bằng di truyền có tỉ lệ kiểu gene AA = 0,49 và tỉ lệ kiểu gene Aa = 0,42. Tần số allele a của quần thể này là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,3", "explain": "p^2 = 0,49 nên p(A) = 0,7. Suy ra q(a) = 1 - 0,7 = 0,3 (kiểm tra: 2pq = 2 x 0,7 x 0,3 = 0,42 đúng).", "points": 0.5}, {"type": "short", "level": "TH", "q": "Một loài động vật có bộ NST 2n = 20. Ở kì giữa của giảm phân I, tế bào có bao nhiêu NST kép?", "answer": "20", "explain": "Ở kì giữa I, các cặp NST tương đồng bắt cặp nhưng số NST kép trong tế bào vẫn là 2n = 20.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trong một hệ sinh thái, sinh vật sản xuất tích lũy được 120000 kcal năng lượng, hiệu suất sinh thái giữa các bậc dinh dưỡng là 10%. Theo lí thuyết, lượng năng lượng sinh vật tiêu thụ bậc 2 nhận được là bao nhiêu kcal?", "answer": "1200", "explain": "Sinh vật tiêu thụ bậc 1 nhận 120000 x 10% = 12000 kcal; sinh vật tiêu thụ bậc 2 (bậc dinh dưỡng cấp 3) nhận 12000 x 10% = 1200 kcal.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ở một loài thực vật, cho P: AaBbCc x AaBbCc (các gene phân li độc lập, trội hoàn toàn). Theo lí thuyết, tỉ lệ cá thể có kiểu gene AaBbCc ở F1 là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,125", "explain": "Mỗi cặp gene Aa x Aa cho tỉ lệ dị hợp 1/2. Ba cặp phân li độc lập nên tỉ lệ AaBbCc = (1/2)^3 = 1/8 = 0,125.", "points": 0.5}]}]}
