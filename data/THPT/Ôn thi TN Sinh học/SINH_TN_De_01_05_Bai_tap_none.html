{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Trong các nguyên tố sau, nguyên tố nào là nguyên tố đa lượng cấu tạo nên tế bào?", "options": ["A. Sắt (Fe)", "B. Kẽm (Zn)", "C. Đồng (Cu)", "D. Cacbon (C)"], "answer": "D", "explain": "Các nguyên tố đa lượng trong tế bào gồm C, H, O, N, S, P. Sắt, kẽm, đồng là các nguyên tố vi lượng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bào quan nào sau đây là nơi tổng hợp protein trong tế bào?", "options": ["A. Lục lạp", "B. Ti thể", "C. Không bào", "D. Ribosome"], "answer": "D", "explain": "Ribosome là bào quan làm nhiệm vụ tổng hợp protein (dịch mã). Lục lạp quang hợp, ti thể hô hấp tế bào, không bào dự trữ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong quang hợp ở thực vật, pha sáng tạo ra các sản phẩm nào để cung cấp cho pha tối?", "options": ["A. CO2 và H2O", "B. O2 và glucose", "C. ATP và NADPH", "D. ADP và NADP+"], "answer": "C", "explain": "Pha sáng quang hợp tạo ra ATP và NADPH cung cấp năng lượng và lực khử cho pha tối (chu trình Calvin) tổng hợp chất hữu cơ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong hô hấp hiếu khí ở tế bào nhân thực, giai đoạn nào tạo ra nhiều ATP nhất?", "options": ["A. Đường phân", "B. Chu trình Krebs", "C. Lên men lactic", "D. Chuỗi chuyền electron hô hấp"], "answer": "D", "explain": "Chuỗi chuyền electron hô hấp (ở màng trong ti thể) tạo ra nhiều ATP nhất (khoảng 34 ATP), đường phân tạo 2 ATP, chu trình Krebs tạo 2 ATP.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hoocmôn thực vật nào sau đây gây hiện tượng rụng lá, rụng quả khi cây gặp điều kiện bất lợi?", "options": ["A. Axit abxixic", "B. Auxin", "C. Gibberellin", "D. Cytokinin"], "answer": "A", "explain": "Axit abxixic (ABA) là hoocmôn ức chế sinh trưởng, gây rụng lá, rụng quả và giúp cây chống chịu hạn, lạnh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đơn phân cấu tạo nên phân tử ADN là", "options": ["A. amino acid", "B. nucleotide", "C. glucose", "D. fatty acid"], "answer": "B", "explain": "ADN được cấu tạo từ các đơn phân là nucleotide (gồm base nitơ, đường deoxyribose và nhóm phosphate).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trên mạch mã gốc của gene có base A. Theo nguyên tắc bổ sung, base tương ứng trên phân tử mRNA được tổng hợp là", "options": ["A. U", "B. T", "C. G", "D. C"], "answer": "A", "explain": "Trong phiên mã, A trên mạch mã gốc liên kết bổ sung với U trên mRNA (thay vì T như trong nhân đôi ADN).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một đột biến làm mất một cặp nucleotide ở vùng mã hóa của gene sẽ gây hậu quả nào sau đây?", "options": ["A. Chỉ thay thế một amino acid", "B. Không làm thay đổi chuỗi polipeptit", "C. Làm thay đổi trình tự amino acid từ vị trí đột biến trở về sau", "D. Chỉ làm mất đúng một amino acid"], "answer": "C", "explain": "Mất một cặp nucleotide gây đột biến dịch khung (frameshift): khung đọc bị lệch nên toàn bộ trình tự amino acid từ vị trí đột biến trở về sau đều thay đổi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong nguyên phân, các nhiễm sắc thể kép tập trung thành một hàng ở mặt phẳng xích đạo của thoi phân bào ở kì nào?", "options": ["A. Kì đầu", "B. Kì giữa", "C. Kì sau", "D. Kì cuối"], "answer": "B", "explain": "Ở kì giữa nguyên phân, các NST kép co xoắn cực đại và xếp thành một hàng trên mặt phẳng xích đạo của thoi phân bào.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hội chứng Down ở người là dạng đột biến lệch bội nào sau đây?", "options": ["A. Thể một nhiễm (2n - 1)", "B. Thể ba nhiễm (2n + 1) ở cặp NST số 21", "C. Thể bốn nhiễm (2n + 2)", "D. Thể khuyết nhiễm (2n - 2)"], "answer": "B", "explain": "Hội chứng Down do thừa một NST số 21, tức thể ba nhiễm (2n + 1 = 47 NST).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ở đậu Hà Lan, allele A quy định hoa đỏ trội hoàn toàn so với allele a quy định hoa trắng. Phép lai P: Aa x Aa cho F1 có tỉ lệ kiểu hình là", "options": ["A. 1 hoa đỏ : 1 hoa trắng", "B. 1 hoa đỏ : 3 hoa trắng", "C. 3 hoa đỏ : 1 hoa trắng", "D. 100% hoa đỏ"], "answer": "C", "explain": "P: Aa x Aa cho F1 có tỉ lệ kiểu gene 1AA : 2Aa : 1aa nên tỉ lệ kiểu hình là 3 trội (hoa đỏ) : 1 lặn (hoa trắng).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ở ruồi giấm, hai gene B, b và V, v cùng nằm trên một NST. Cho ruồi cái có kiểu gene BV/bv (tần số hoán vị gene f = 20%) lai với ruồi đực bv/bv. Theo lí thuyết, tỉ lệ ruồi con có kiểu gene bv/bv là", "options": ["A. 10%", "B. 20%", "C. 40%", "D. 50%"], "answer": "C", "explain": "Ruồi cái BV/bv với f = 20% tạo giao tử bv = (1 - 0,2)/2 = 0,4. Ruồi đực bv/bv chỉ tạo giao tử bv. Vậy tỉ lệ con bv/bv = 0,4 x 1 = 0,4 = 40%.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bệnh mù màu đỏ - lục ở người do gene lặn a nằm trên NST X quy định (A: bình thường). Một người vợ có kiểu gene XAXa kết hôn với người chồng có kiểu gene XAY. Xác suất sinh con trai bị mù màu của cặp vợ chồng này là", "options": ["A. 50%", "B. 0%", "C. 25%", "D. 100%"], "answer": "A", "explain": "Con trai nhận NST X từ mẹ: mẹ XAXa cho giao tử Xa với xác suất 1/2. Con trai có kiểu gene XaY sẽ bị mù màu nên xác suất là 50%.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điều kiện nào sau đây KHÔNG phải là điều kiện nghiệm đúng của định luật Hardy - Weinberg?", "options": ["A. Có chọn lọc tự nhiên tác động", "B. Quần thể có kích thước lớn", "C. Không xảy ra đột biến", "D. Các cá thể giao phối ngẫu nhiên"], "answer": "A", "explain": "Định luật Hardy - Weinberg nghiệm đúng khi: quần thể lớn, giao phối ngẫu nhiên, không đột biến, không di nhập gene và KHÔNG có chọn lọc tự nhiên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ở người, bệnh bạch tạng do gene lặn a nằm trên NST thường quy định. Một cặp vợ chồng đều bình thường sinh được một người con gái bị bạch tạng. Xác suất để đứa con tiếp theo của họ bị bạch tạng là", "options": ["A. 1/2", "B. 1/4", "C. 3/4", "D. 1/8"], "answer": "B", "explain": "Bố mẹ bình thường sinh con bị bệnh (aa) nên cả hai đều có kiểu gene Aa. Phép lai Aa x Aa cho tỉ lệ con bị bệnh (aa) là 1/4.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bằng chứng nào sau đây là bằng chứng trực tiếp cho thấy các loài sinh vật hiện nay có chung nguồn gốc?", "options": ["A. Hóa thạch", "B. Cơ quan tương đồng", "C. Cơ quan thoái hóa", "D. Sự giống nhau trong phát triển phôi"], "answer": "A", "explain": "Hóa thạch là bằng chứng trực tiếp về lịch sử tiến hóa của sinh giới. Các bằng chứng còn lại là bằng chứng gián tiếp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Theo thuyết tiến hóa tổng hợp hiện đại, nhân tố nào sau đây đóng vai trò định hướng quá trình tiến hóa?", "options": ["A. Đột biến", "B. Di - nhập gene", "C. Giao phối không ngẫu nhiên", "D. Chọn lọc tự nhiên"], "answer": "D", "explain": "Chọn lọc tự nhiên là nhân tố định hướng quá trình tiến hóa vì nó giữ lại các kiểu gene thích nghi và đào thải các kiểu gene kém thích nghi một cách có hướng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong hệ sinh thái, sinh vật nào sau đây thuộc nhóm sinh vật sản xuất?", "options": ["A. Thỏ", "B. Cây xanh", "C. Nấm hoại sinh", "D. Vi khuẩn phân giải"], "answer": "B", "explain": "Sinh vật sản xuất là sinh vật tự dưỡng (thực vật, tảo) có khả năng quang hợp tổng hợp chất hữu cơ từ chất vô cơ.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét quá trình tổng hợp protein ở sinh vật nhân sơ. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Trên mạch mã gốc, base A liên kết bổ sung với base U trên phân tử mRNA.", "b) Mỗi bộ ba trên mRNA (trừ bộ ba kết thúc) mã hóa cho một amino acid.", "c) Quá trình dịch mã tổng hợp chuỗi polipeptit diễn ra trong nhân tế bào.", "d) Mọi đột biến thay thế một cặp nucleotide đều làm thay đổi trình tự amino acid."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: trong phiên mã, A trên mạch mã gốc bắt cặp bổ sung với U trên mRNA. b) Đúng: mã di truyền là mã bộ ba, các codon kết thúc (UAA, UAG, UGA) không mã hóa amino acid. c) Sai: ở sinh vật nhân sơ không có nhân hoàn chỉnh, dịch mã diễn ra ở ribosome trong tế bào chất. d) Sai: đột biến thay thế có thể là đột biến đồng nghĩa (không đổi amino acid) do tính thoái hóa của mã di truyền.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Ở một loài thực vật, allele A quy định thân cao trội hoàn toàn so với allele a quy định thân thấp; allele B quy định hoa đỏ trội hoàn toàn so với allele b quy định hoa trắng. Hai gene phân li độc lập. Cho P: AaBb x aabb. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) F1 có 4 loại kiểu gene với tỉ lệ bằng nhau.", "b) Tỉ lệ cây thân cao, hoa đỏ ở F1 là 25%.", "c) Tỉ lệ cây thân thấp, hoa trắng ở F1 là 12,5%.", "d) Phép lai trên là phép lai phân tích cơ thể dị hợp về hai cặp gene."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: AaBb cho 4 loại giao tử, aabb cho 1 loại nên F1 có 4 kiểu gene (AaBb, Aabb, aaBb, aabb) mỗi loại 1/4. b) Đúng: cây cao, đỏ (AaBb) chiếm 1/4 = 25%. c) Sai: cây thấp, trắng (aabb) chiếm 1/4 = 25%, không phải 12,5%. d) Đúng: lai cơ thể dị hợp hai cặp gene với cơ thể đồng hợp lặn là phép lai phân tích.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về các nhân tố tiến hóa theo thuyết tiến hóa tổng hợp hiện đại. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Đột biến là nguồn nguyên liệu sơ cấp của quá trình tiến hóa.", "b) Di - nhập gene có thể làm thay đổi tần số allele của quần thể.", "c) Giao phối không ngẫu nhiên làm thay đổi tần số allele của quần thể.", "d) Phiêu bạt di truyền tác động mạnh nhất ở các quần thể có kích thước nhỏ."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: đột biến tạo ra các allele mới, là nguyên liệu sơ cấp. b) Đúng: di - nhập gene đưa allele mới vào hoặc ra khỏi quần thể. c) Sai: giao phối không ngẫu nhiên chỉ làm thay đổi thành phần kiểu gene (tăng đồng hợp, giảm dị hợp), không làm thay đổi tần số allele. d) Đúng: ở quần thể nhỏ, yếu tố ngẫu nhiên dễ làm thay đổi tần số allele.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Xét một lưới thức ăn trên đồng cỏ gồm các chuỗi: cỏ → thỏ → cáo; cỏ → châu chấu → ếch → rắn → đại bàng; cỏ → châu chấu → chim sâu → đại bàng. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Đại bàng thuộc bậc dinh dưỡng cấp 3 trong chuỗi thức ăn dài nhất.", "b) Ếch vừa là sinh vật tiêu thụ cấp 1, vừa là sinh vật tiêu thụ cấp 2.", "c) Nếu loại bỏ hoàn toàn rắn khỏi lưới thức ăn thì số lượng ếch có thể tăng lên.", "d) Cỏ là sinh vật sản xuất và thuộc bậc dinh dưỡng cấp 1 trong mọi chuỗi thức ăn."], "answer": ["F", "F", "T", "T"], "explain": "a) Sai: chuỗi dài nhất là cỏ → châu chấu → ếch → rắn → đại bàng, đại bàng thuộc bậc dinh dưỡng cấp 5. b) Sai: ếch ăn châu chấu nên chỉ là sinh vật tiêu thụ cấp 2. c) Đúng: rắn là kẻ săn mồi của ếch, mất rắn thì áp lực săn mồi giảm, ếch có thể tăng số lượng. d) Đúng: cỏ là sinh vật sản xuất, luôn thuộc bậc dinh dưỡng cấp 1.", "points": 1}, {"type": "short", "level": "TH", "q": "Một gene có 3000 nucleotide. Chuỗi polipeptit hoàn chỉnh do gene này tổng hợp có bao nhiêu amino acid? (Biết mỗi codon mã hóa một amino acid; không tính bộ ba kết thúc và amino acid mở đầu bị cắt bỏ.)", "answer": "498", "explain": "Số codon trên mRNA = 3000/2/3 = 500. Trừ 1 bộ ba kết thúc còn 499 amino acid trong chuỗi chưa hoàn chỉnh; cắt bỏ 1 amino acid mở đầu còn 499 - 1 = 498 amino acid trong chuỗi hoàn chỉnh.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Ở người, bệnh mù màu đỏ - lục do gene lặn a nằm trên NST X quy định (A: bình thường). Một cặp vợ chồng có vợ mang kiểu gene XAXa, chồng mang kiểu gene XAY. Theo lí thuyết, tỉ lệ con trai bị mù màu của cặp vợ chồng này là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,5", "explain": "Con trai nhận NST X từ mẹ. Mẹ XAXa cho giao tử Xa với xác suất 1/2 nên con trai có kiểu gene XaY (bị mù màu) với tỉ lệ 1/2 = 0,5.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Một quần thể thực vật có cấu trúc di truyền ở thế hệ P là: 0,36 AA : 0,48 Aa : 0,16 aa. Tần số allele a của quần thể này là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,4", "explain": "Tần số allele a = tần số kiểu gene aa + 1/2 tần số kiểu gene Aa = 0,16 + 0,48/2 = 0,16 + 0,24 = 0,4.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Một tế bào sinh dưỡng của ruồi giấm có bộ NST 2n = 8. Tế bào này nguyên phân liên tiếp 3 lần. Tổng số tế bào con được tạo ra là bao nhiêu?", "answer": "8", "explain": "Sau k lần nguyên phân, từ 1 tế bào mẹ tạo ra 2^k tế bào con. Với k = 3, số tế bào con = 2^3 = 8.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trong một hệ sinh thái, sinh vật sản xuất tích lũy được 20000 kcal năng lượng. Hiệu suất sinh thái giữa các bậc dinh dưỡng là 10%. Theo lí thuyết, lượng năng lượng sinh vật tiêu thụ bậc 2 nhận được là bao nhiêu kcal?", "answer": "200", "explain": "Sinh vật tiêu thụ bậc 1 nhận 20000 x 10% = 2000 kcal; sinh vật tiêu thụ bậc 2 (bậc dinh dưỡng cấp 3) nhận 2000 x 10% = 200 kcal.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ở một loài thực vật, cho P: AaBbDd x AaBbDd (các gene phân li độc lập, trội hoàn toàn). Theo lí thuyết, ở F1, tỉ lệ cá thể có đúng 2 cặp gene dị hợp là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,375", "explain": "Với mỗi cặp gene, Aa x Aa cho tỉ lệ dị hợp là 1/2. Chọn 2 trong 3 cặp là dị hợp: C(3,2) x (1/2)^2 x (1/2) = 3 x 1/8 = 3/8 = 0,375.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Nhóm sinh vật nào sau đây có tế bào nhân sơ?", "options": ["A. Nấm men", "B. Thực vật", "C. Vi khuẩn", "D. Động vật"], "answer": "C", "explain": "Vi khuẩn có tế bào nhân sơ (vùng nhân không có màng bao bọc). Nấm, thực vật, động vật đều có tế bào nhân thực.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Màng sinh chất của tế bào được cấu tạo chủ yếu từ", "options": ["A. lớp kép phospholipid và protein", "B. cellulose", "C. kitin", "D. peptidoglycan"], "answer": "A", "explain": "Màng sinh chất có cấu trúc khảm động, chủ yếu gồm lớp kép phospholipid xen kẽ các phân tử protein.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ở thực vật, quá trình thoát hơi nước diễn ra chủ yếu qua bộ phận nào?", "options": ["A. Thân cây", "B. Khí khổng ở lá", "C. Rễ cây", "D. Hoa"], "answer": "B", "explain": "Thoát hơi nước ở lá diễn ra chủ yếu qua khí khổng (khoảng 90%), một phần nhỏ qua cutin trên bề mặt lá.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tim của thú và chim có đặc điểm nào sau đây?", "options": ["A. Tim 4 ngăn, máu đi nuôi cơ thể là máu đỏ tươi", "B. Tim 2 ngăn, máu pha", "C. Tim 3 ngăn, máu pha", "D. Tim 4 ngăn, máu đi nuôi cơ thể là máu pha"], "answer": "A", "explain": "Thú và chim có tim 4 ngăn (2 tâm nhĩ, 2 tâm thất) với vách ngăn hoàn chỉnh nên máu đi nuôi cơ thể là máu đỏ tươi, giàu O2.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiện tượng thân cây non hướng về phía có ánh sáng được gọi là", "options": ["A. tính hướng sáng (hướng động dương với ánh sáng)", "B. tính hướng đất", "C. tính hướng nước", "D. tính hướng hóa"], "answer": "A", "explain": "Thân cây hướng về phía ánh sáng là tính hướng sáng, một dạng hướng động (vận động định hướng theo tác nhân kích thích).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trong quá trình nhân đôi ADN, mạch polynucleotide mới được tổng hợp theo chiều nào?", "options": ["A. 3' đến 5'", "B. Cả hai chiều 5' đến 3' và 3' đến 5'", "C. Ngẫu nhiên tùy đoạn", "D. 5' đến 3'"], "answer": "D", "explain": "Enzyme ADN polymerase chỉ tổng hợp mạch mới theo chiều 5' đến 3' (gắn nucleotide vào đầu 3' - OH tự do).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Một gene bị đột biến thay thế một cặp nucleotide ở một bộ ba mã hóa nhưng chuỗi polipeptit tạo ra không thay đổi. Đây là đột biến", "options": ["A. vô nghĩa", "B. đồng nghĩa", "C. dịch khung", "D. sai nghĩa"], "answer": "B", "explain": "Đột biến đồng nghĩa (silent) làm thay đổi codon nhưng do tính thoái hóa của mã di truyền nên amino acid không đổi, chuỗi polipeptit giữ nguyên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong cơ chế điều hòa hoạt động của operon lac ở vi khuẩn E. coli, khi môi trường có lactose thì", "options": ["A. protein ức chế bị bất hoạt nên các gene cấu trúc được phiên mã", "B. protein ức chế liên kết chặt với vùng vận hành", "C. gene điều hòa ngừng phiên mã", "D. vùng khởi động bị khóa hoàn toàn"], "answer": "A", "explain": "Lactose (chất cảm ứng) liên kết làm bất hoạt protein ức chế, protein ức chế không bám được vào vùng vận hành nên enzyme RNA polymerase phiên mã các gene cấu trúc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kết quả của quá trình giảm phân từ một tế bào mẹ có bộ NST 2n là", "options": ["A. 2 tế bào con có bộ NST 2n", "B. 4 tế bào con có bộ NST n", "C. 2 tế bào con có bộ NST n", "D. 4 tế bào con có bộ NST 2n"], "answer": "B", "explain": "Giảm phân gồm 2 lần phân bào liên tiếp từ 1 tế bào mẹ (2n) tạo ra 4 tế bào con có bộ NST giảm đi một nửa (n).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cônsixin được dùng để gây đột biến đa bội vì nó có tác dụng", "options": ["A. gây mất đoạn nhiễm sắc thể", "B. kích thích nhiễm sắc thể nhân đôi nhiều lần", "C. phá hủy màng nhân của tế bào", "D. ngăn cản sự hình thành thoi phân bào"], "answer": "D", "explain": "Cônsixin phá hủy thoi phân bào (ngăn cản hình thành thoi vô sắc) làm NST đã nhân đôi nhưng không phân li, tạo tế bào đa bội.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Theo quy luật phân li của Mendel, mỗi tính trạng do", "options": ["A. hai cặp allele quy định, phân li độc lập", "B. một cặp allele quy định; các allele phân li đồng đều về các giao tử khi giảm phân", "C. một allele quy định, không phân li", "D. nhiều cặp gene quy định, liên kết hoàn toàn"], "answer": "B", "explain": "Nội dung quy luật phân li: mỗi tính trạng do một cặp allele quy định; khi giảm phân tạo giao tử, các allele của một cặp phân li đồng đều về các giao tử.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ở một loài hoa, khi có cả hai gene trội A và B thì hoa có màu đỏ, các kiểu gene còn lại đều cho hoa màu trắng (tương tác bổ sung). Cho P: AaBb x AaBb, tỉ lệ hoa đỏ ở F1 là", "options": ["A. 9/16", "B. 3/4", "C. 1/4", "D. 7/16"], "answer": "A", "explain": "Tương tác bổ sung 9 : 7. Hoa đỏ có kiểu gene A-B- chiếm 9/16; hoa trắng (3A-bb : 3aaB- : 1aabb) chiếm 7/16.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ở một loài thực vật, hai gene A, a và B, b cùng nằm trên một NST. Cho cây có kiểu gene AB/ab lai với cây ab/ab, F1 thu được 20% cây có kiểu hình lặn về cả hai tính trạng. Tần số hoán vị gene ở cây AB/ab là", "options": ["A. 20%", "B. 10%", "C. 40%", "D. 80%"], "answer": "C", "explain": "Cây con ab/ab (20%) nhận giao tử ab từ cây AB/ab với tỉ lệ 0,2. Vì 0,2 nhỏ hơn 0,25 nên ab là giao tử hoán vị, tần số hoán vị f = 2 x 0,2 = 0,4 = 40%.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Một quần thể có cấu trúc di truyền 0,64 AA : 0,32 Aa : 0,04 aa. Tần số allele a của quần thể là", "options": ["A. 0,8", "B. 0,4", "C. 0,2", "D. 0,6"], "answer": "C", "explain": "Tần số allele a = 0,04 + 0,32/2 = 0,04 + 0,16 = 0,2.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Yếu tố nào sau đây làm tăng nguy cơ sinh con mắc hội chứng Down?", "options": ["A. Người bố thường xuyên thức khuya", "B. Người mẹ sinh con khi đã lớn tuổi", "C. Chế độ ăn nhiều rau xanh của mẹ", "D. Mẹ tập thể dục đều đặn khi mang thai"], "answer": "B", "explain": "Tuổi mẹ càng cao thì nguy cơ rối loạn phân li NST trong giảm phân tạo trứng càng lớn, làm tăng tỉ lệ con mắc hội chứng Down (thể ba 21).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cơ quan tương đồng là bằng chứng cho thấy các loài sinh vật", "options": ["A. có lối sống giống nhau", "B. có chức năng hoàn toàn giống nhau", "C. sống trong cùng một môi trường", "D. có nguồn gốc chung"], "answer": "D", "explain": "Cơ quan tương đồng có cùng nguồn gốc (cấu tạo chung) nhưng có thể thực hiện chức năng khác nhau do thích nghi với môi trường khác nhau, phản ánh quan hệ họ hàng gần gũi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Hiện tượng bướm bạch dương sẫm màu chiếm ưu thế ở vùng công nghiệp nước Anh vào thế kỉ XIX là ví dụ điển hình của nhân tố tiến hóa nào?", "options": ["A. Phiêu bạt di truyền", "B. Di - nhập gene", "C. Chọn lọc tự nhiên", "D. Đột biến gene"], "answer": "C", "explain": "Khói bụi công nghiệp làm thân cây sẫm màu, bướm sẫm màu ngụy trang tốt hơn nên được chọn lọc giữ lại (chọn lọc công nghiệp) — ví dụ kinh điển của chọn lọc tự nhiên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khoảng giá trị của một nhân tố sinh thái mà sinh vật có thể tồn tại và phát triển được gọi là", "options": ["A. ổ sinh thái", "B. môi trường sống", "C. sinh cảnh", "D. giới hạn sinh thái"], "answer": "D", "explain": "Giới hạn sinh thái là khoảng giá trị xác định của một nhân tố sinh thái mà trong đó sinh vật tồn tại và phát triển được.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về quang hợp ở thực vật. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Pha sáng của quang hợp diễn ra ở màng thylakoid của lục lạp.", "b) Pha tối của quang hợp diễn ra ở chất nền (stroma) của lục lạp.", "c) Khí O2 thải ra trong quang hợp có nguồn gốc từ phân tử CO2.", "d) Trong điều kiện nóng, khô, thực vật C4 có năng suất quang hợp cao hơn thực vật C3."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: pha sáng xảy ra trên màng thylakoid nơi có hệ sắc tố và chuỗi chuyền electron. b) Đúng: pha tối (chu trình Calvin) xảy ra ở stroma. c) Sai: O2 thải ra có nguồn gốc từ quá trình quang phân li nước, không phải từ CO2. d) Đúng: thực vật C4 không có hô hấp sáng nên thích nghi tốt với điều kiện nóng, khô.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Ở một loài thực vật có bộ NST 2n = 24. Xét tính đúng, sai của các phát biểu sau về đột biến số lượng NST:", "statements": ["a) Thể ba nhiễm của loài này có 25 NST trong tế bào sinh dưỡng.", "b) Thể một nhiễm của loài này có 23 NST trong tế bào sinh dưỡng.", "c) Dạng đột biến tam bội (3n) có 36 NST và thường bất thụ.", "d) Đột biến lệch bội chỉ xảy ra ở NST thường, không xảy ra ở NST giới tính."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: thể ba (2n + 1) = 25 NST. b) Đúng: thể một (2n - 1) = 23 NST. c) Đúng: 3n = 36 NST; cây tam bội giảm phân rối loạn nên thường bất thụ (ví dụ dưa hấu không hạt). d) Sai: đột biến lệch bội xảy ra ở cả NST thường và NST giới tính (ví dụ hội chứng Turner XO, Klinefelter XXY).", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Một quần thể ngẫu phối có cấu trúc di truyền: 0,25 AA : 0,5 Aa : 0,25 aa. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Tần số allele A của quần thể là 0,5.", "b) Quần thể đang ở trạng thái cân bằng di truyền.", "c) Nếu các cá thể có kiểu gene aa không có khả năng sinh sản thì tần số allele a ở thế hệ sau sẽ tăng lên.", "d) Khi quần thể đã cân bằng di truyền, tỉ lệ kiểu gene dị hợp Aa không đổi qua các thế hệ ngẫu phối."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: p(A) = 0,25 + 0,5/2 = 0,5. b) Đúng: p^2 = 0,25; 2pq = 0,5; q^2 = 0,25 đúng theo công thức Hardy - Weinberg. c) Sai: cá thể aa không sinh sản tức chọn lọc chống lại allele a nên tần số allele a sẽ giảm, không tăng. d) Đúng: quần thể cân bằng di truyền thì cấu trúc di truyền không đổi qua các thế hệ.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về chu trình sinh địa hóa trong hệ sinh thái. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Cacbon đi vào quần xã sinh vật chủ yếu qua quá trình quang hợp của sinh vật sản xuất.", "b) Nitơ khí quyển được vi khuẩn cố định đạm chuyển thành dạng mà cây xanh hấp thụ được.", "c) Trong chu trình nước, nước chỉ tồn tại ở dạng lỏng.", "d) Chu trình photpho là chu trình trầm tích, không có pha khí quyển."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: quang hợp cố định CO2 thành chất hữu cơ, đưa cacbon vào quần xã. b) Đúng: vi khuẩn cố định đạm (Rhizobium, Azotobacter) chuyển N2 thành NH3/NO3-. c) Sai: nước tồn tại ở cả ba dạng rắn, lỏng, khí trong chu trình nước. d) Đúng: photpho lắng đọng trong đá, đất, không có dạng khí trong khí quyển.", "points": 1}, {"type": "short", "level": "TH", "q": "Một phân tử ADN có 600 adenine (A) và 900 guanine (G). Tổng số liên kết hidro của phân tử ADN này là bao nhiêu?", "answer": "3900", "explain": "Theo nguyên tắc bổ sung: A = T = 600; G = C = 900. Số liên kết hidro = 2A + 3G = 2 x 600 + 3 x 900 = 1200 + 2700 = 3900.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Ở đậu Hà Lan, allele A quy định hoa đỏ trội hoàn toàn so với allele a quy định hoa trắng. Cho P: Aa x Aa. Theo lí thuyết, tỉ lệ cây F1 mang allele a là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,75", "explain": "P: Aa x Aa cho F1: 1AA : 2Aa : 1aa. Cây mang allele a gồm Aa và aa chiếm 3/4 = 0,75.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Một quần thể có cấu trúc di truyền: 0,49 AA : 0,42 Aa : 0,09 aa. Tần số allele A của quần thể này là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,7", "explain": "Tần số allele A = 0,49 + 0,42/2 = 0,49 + 0,21 = 0,7.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Một loài động vật có bộ NST 2n = 24. Qua giảm phân bình thường, mỗi giao tử của loài này chứa bao nhiêu NST?", "answer": "12", "explain": "Giảm phân làm giảm một nửa số lượng NST: giao tử có bộ NST đơn bội n = 2n/2 = 12.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Trong một hệ sinh thái, sinh vật sản xuất tích lũy được 5000 kcal năng lượng. Hiệu suất sinh thái giữa các bậc dinh dưỡng là 10%. Theo lí thuyết, lượng năng lượng sinh vật tiêu thụ bậc 2 nhận được là bao nhiêu kcal?", "answer": "50", "explain": "Sinh vật tiêu thụ bậc 1 nhận 5000 x 10% = 500 kcal; sinh vật tiêu thụ bậc 2 (bậc dinh dưỡng cấp 3) nhận 500 x 10% = 50 kcal.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một gene có 2400 nucleotide bị đột biến mất 3 cặp nucleotide ở vùng mã hóa (không rơi vào bộ ba mở đầu và bộ ba kết thúc). So với chuỗi polipeptit hoàn chỉnh do gene ban đầu tổng hợp, chuỗi do gene đột biến tổng hợp bị giảm đi bao nhiêu amino acid?", "answer": "1", "explain": "Gene ban đầu: 2400/2/3 = 400 codon, chuỗi hoàn chỉnh có 400 - 1 (kết thúc) - 1 (mở đầu) = 398 amino acid. Mất 3 cặp nucleotide tương đương mất đúng 1 codon nên chuỗi đột biến giảm đúng 1 amino acid.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Bào quan nào sau đây là nơi diễn ra hô hấp tế bào, tạo ra phần lớn ATP cho tế bào?", "options": ["A. Ti thể", "B. Lục lạp", "C. Ribosome", "D. Nhân tế bào"], "answer": "A", "explain": "Ti thể là bào quan thực hiện hô hấp tế bào (chu trình Krebs và chuỗi chuyền electron), tạo ra phần lớn ATP cung cấp cho hoạt động sống.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đặt tế bào thực vật vào môi trường ưu trương (nồng độ chất tan bên ngoài cao hơn bên trong tế bào), hiện tượng nào sau đây sẽ xảy ra?", "options": ["A. Trương nước", "B. Co nguyên sinh", "C. Vỡ tế bào", "D. Tế bào không thay đổi"], "answer": "B", "explain": "Trong môi trường ưu trương, nước thẩm thấu từ tế bào ra ngoài làm tế bào chất co lại, màng sinh chất tách khỏi thành tế bào — hiện tượng co nguyên sinh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sản phẩm chính của pha tối trong quang hợp ở thực vật là", "options": ["A. ATP", "B. NADPH", "C. chất hữu cơ (glucose)", "D. O2"], "answer": "C", "explain": "Pha tối (chu trình Calvin) sử dụng ATP và NADPH của pha sáng để khử CO2 thành chất hữu cơ (AlPG, tổng hợp thành glucose).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ở người, hệ tuần hoàn có đặc điểm nào sau đây?", "options": ["A. Tuần hoàn kép, tim 4 ngăn", "B. Tuần hoàn đơn, tim 2 ngăn", "C. Tuần hoàn hở", "D. Tuần hoàn đơn, tim 3 ngăn"], "answer": "A", "explain": "Người (thú) có hệ tuần hoàn kép với tim 4 ngăn: vòng tuần hoàn nhỏ trao đổi khí ở phổi, vòng tuần hoàn lớn đưa máu đỏ tươi đi nuôi cơ thể.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ưu điểm nổi bật của sinh sản vô tính là", "options": ["A. tạo ra nhiều biến dị tổ hợp", "B. giúp cá thể thích nghi nhanh với môi trường thay đổi", "C. làm tăng sức sống của thế hệ con", "D. tạo ra thế hệ con cháu đồng nhất về di truyền, nhân nhanh giống tốt"], "answer": "D", "explain": "Sinh sản vô tính dựa trên nguyên phân nên con cháu giống hệt mẹ về di truyền, giúp nhân nhanh giống tốt trong thời gian ngắn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mã di truyền có tính thoái hóa nghĩa là", "options": ["A. nhiều bộ ba khác nhau có thể cùng mã hóa cho một amino acid", "B. một bộ ba chỉ mã hóa cho một amino acid", "C. mã di truyền được đọc liên tục, không gối lên nhau", "D. tất cả các loài đều dùng chung một bộ mã di truyền"], "answer": "A", "explain": "Tính thoái hóa: trừ một số trường hợp đặc biệt, mỗi amino acid thường được mã hóa bởi nhiều codon khác nhau (ví dụ 6 codon cùng mã hóa leucine).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Enzyme trực tiếp tham gia tổng hợp phân tử mRNA trong quá trình phiên mã là", "options": ["A. ADN polymerase", "B. RNA polymerase", "C. ADN ligase", "D. restrictase"], "answer": "B", "explain": "RNA polymerase bám vào vùng khởi động của gene và tổng hợp phân tử mRNA theo nguyên tắc bổ sung với mạch mã gốc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một gene có 1500 nucleotide. Số amino acid trong chuỗi polipeptit hoàn chỉnh do gene này tổng hợp là", "options": ["A. 500", "B. 499", "C. 250", "D. 248"], "answer": "D", "explain": "Số codon = 1500/2/3 = 250. Chuỗi polipeptit hoàn chỉnh = 250 - 1 (bộ ba kết thúc) - 1 (amino acid mở đầu bị cắt) = 248 amino acid.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tế bào sinh dưỡng của người bình thường có bộ nhiễm sắc thể là", "options": ["A. n = 23", "B. 2n = 44", "C. 2n = 46", "D. 2n = 48"], "answer": "C", "explain": "Tế bào sinh dưỡng của người có bộ NST lưỡng bội 2n = 46 (22 cặp NST thường và 1 cặp NST giới tính).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dạng đột biến cấu trúc nhiễm sắc thể làm mất đi một đoạn nhiễm sắc thể được gọi là", "options": ["A. lặp đoạn", "B. đảo đoạn", "C. mất đoạn", "D. chuyển đoạn"], "answer": "C", "explain": "Mất đoạn là dạng đột biến làm mất một đoạn NST, thường gây hại (mất gene) ví dụ hội chứng mèo kêu (mất đoạn NST số 5 ở người).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cơ thể có kiểu gene AaBbDd (các gene phân li độc lập) giảm phân tạo ra tối đa bao nhiêu loại giao tử?", "options": ["A. 8", "B. 4", "C. 6", "D. 16"], "answer": "A", "explain": "Số loại giao tử = 2^n với n là số cặp gene dị hợp. Ở đây n = 3 nên số loại giao tử = 2^3 = 8.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ở một loài thực vật, hai gene A, a và B, b liên kết hoàn toàn trên một NST. Cho cây có kiểu gene Ab/aB tự thụ phấn. Tỉ lệ cây con có kiểu hình lặn về cả hai tính trạng (ab/ab) ở đời con là", "options": ["A. 25%", "B. 0%", "C. 50%", "D. 6,25%"], "answer": "B", "explain": "Liên kết hoàn toàn, cây Ab/aB chỉ tạo 2 loại giao tử Ab và aB (không tạo được giao tử ab) nên đời con không thể có kiểu gene ab/ab.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Các gene nằm trong tế bào chất (ngoài nhân) như gene trong ti thể, lục lạp di truyền theo quy luật nào?", "options": ["A. Phân li độc lập của Mendel", "B. Di truyền theo dòng mẹ", "C. Di truyền liên kết với giới tính", "D. Hoán vị gene"], "answer": "B", "explain": "Gene ngoài nhân di truyền theo dòng mẹ vì hợp tử nhận tế bào chất chủ yếu từ trứng (giao tử cái).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tự thụ phấn bắt buộc qua nhiều thế hệ ở thực vật sẽ làm", "options": ["A. tăng tỉ lệ thể đồng hợp, giảm tỉ lệ thể dị hợp", "B. tăng tỉ lệ thể dị hợp", "C. thay đổi tần số các allele", "D. tạo ra ưu thế lai"], "answer": "A", "explain": "Tự thụ phấn (giao phối không ngẫu nhiên) làm tăng dần tỉ lệ đồng hợp, giảm dần tỉ lệ dị hợp qua các thế hệ nhưng không làm thay đổi tần số allele.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Xét phả hệ mô tả sự di truyền bệnh máu khó đông (do gene lặn a nằm trên NST X quy định) trong một gia đình: thế hệ I gồm bố bình thường và mẹ bình thường sinh được một con trai bị bệnh máu khó đông. Kiểu gene của người mẹ ở thế hệ I là", "options": ["A. XAXA", "B. XAXa", "C. XaXa", "D. XAY"], "answer": "B", "explain": "Con trai bị bệnh có kiểu gene XaY, nhận allele Xa từ mẹ. Mẹ bình thường nên phải có kiểu gene XAXa (dị hợp).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Quan niệm nào sau đây là của Lamarck về nguyên nhân tiến hóa?", "options": ["A. Chọn lọc tự nhiên giữ lại các biến dị có lợi", "B. Đấu tranh sinh tồn là động lực của tiến hóa", "C. Sinh vật chủ động biến đổi để thích nghi với ngoại cảnh và di truyền các đặc tính thu được cho đời sau", "D. Đột biến gene là nguyên liệu chủ yếu của tiến hóa"], "answer": "C", "explain": "Lamarck cho rằng ngoại cảnh thay đổi chậm chạp làm sinh vật biến đổi tập quán, cơ quan dùng nhiều thì phát triển và di truyền các đặc tính thu được — quan niệm này đã bị bác bỏ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cách li địa lí có vai trò nào sau đây trong quá trình hình thành loài?", "options": ["A. Trực tiếp tạo ra loài mới", "B. Làm xuất hiện ngay cách li sinh sản", "C. Làm tăng tần số đột biến trong quần thể", "D. Ngăn cản giao phối, tạo điều kiện cho các nhân tố tiến hóa phân hóa vốn gene giữa các quần thể"], "answer": "D", "explain": "Cách li địa lí ngăn cản sự giao phối giữa các quần thể, tạo điều kiện cho đột biến, chọn lọc tự nhiên... phân hóa vốn gene, là tiền đề dẫn tới cách li sinh sản và hình thành loài mới.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tập hợp các cá thể cùng loài, cùng sống trong một khoảng không gian xác định, có khả năng giao phối với nhau tạo ra thế hệ mới được gọi là", "options": ["A. quần xã sinh vật", "B. hệ sinh thái", "C. ổ sinh thái", "D. quần thể sinh vật"], "answer": "D", "explain": "Đó là khái niệm quần thể sinh vật — đơn vị tồn tại và đơn vị tiến hóa cơ sở của loài trong tự nhiên.", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về nguyên phân và giảm phân ở tế bào nhân thực. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Nguyên phân tạo ra 2 tế bào con có bộ NST giống hệt tế bào mẹ.", "b) Giảm phân I là phân bào giảm nhiễm, giảm phân II là phân bào nguyên nhiễm.", "c) Hiện tượng trao đổi chéo giữa các NST tương đồng xảy ra ở kì đầu của giảm phân I.", "d) Ở kì giữa của nguyên phân, các NST kép xếp thành 2 hàng trên mặt phẳng xích đạo."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: nguyên phân giữ nguyên bộ NST (2n → 2n). b) Đúng: sau giảm phân I số NST giảm một nửa, giảm phân II tương tự nguyên phân. c) Đúng: trao đổi chéo (bắt chéo) xảy ra ở kì đầu I giữa các chromatid không chị em của cặp NST tương đồng. d) Sai: ở kì giữa nguyên phân các NST kép xếp thành 1 hàng trên mặt phẳng xích đạo.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Ở bí ngô, tính trạng hình dạng quả do hai gene không allele tương tác: A-B- cho quả dẹt; A-bb và aaB- cho quả tròn; aabb cho quả dài. Cho P: AaBb x aabb. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) F1 có 3 loại kiểu hình.", "b) Tỉ lệ quả dẹt ở F1 là 25%.", "c) Tỉ lệ quả dài ở F1 là 25%.", "d) Tỉ lệ quả tròn ở F1 là 25%."], "answer": ["T", "T", "T", "F"], "explain": "P: AaBb x aabb cho F1: 1AaBb (dẹt) : 1Aabb (tròn) : 1aaBb (tròn) : 1aabb (dài). a) Đúng: 3 kiểu hình dẹt, tròn, dài. b) Đúng: quả dẹt = 1/4 = 25%. c) Đúng: quả dài = 1/4 = 25%. d) Sai: quả tròn = 2/4 = 50%.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về quần thể sinh vật. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Mật độ cá thể là số lượng cá thể trên một đơn vị diện tích hay thể tích của môi trường.", "b) Tỉ lệ giới tính ít có ảnh hưởng đến khả năng sinh sản của quần thể.", "c) Khi nguồn sống dồi dào, quần thể tăng trưởng theo tiềm năng sinh học với đường cong hình chữ J.", "d) Cạnh tranh cùng loài luôn gây hại cho sự tồn tại của quần thể."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng: đó là khái niệm mật độ cá thể. b) Sai: tỉ lệ giới tính ảnh hưởng trực tiếp đến mức sinh sản của quần thể. c) Đúng: điều kiện lí tưởng, quần thể tăng trưởng theo hàm số mũ (đường cong chữ J). d) Sai: cạnh tranh cùng loài giúp duy trì số lượng cá thể ở mức phù hợp, là động lực của chọn lọc tự nhiên.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về công nghệ gene. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Công nghệ gene là quy trình tạo ra tế bào hoặc sinh vật có gene bị biến đổi hoặc có thêm gene mới.", "b) Enzyme cắt giới hạn (restrictase) được dùng để cắt phân tử ADN tại những vị trí nucleotide xác định.", "c) Thể truyền (vector) thường dùng trong công nghệ gene là plasmid của vi khuẩn.", "d) Sinh vật biến đổi gene không có ứng dụng nào trong y học."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: đó là khái niệm công nghệ gene. b) Đúng: restrictase nhận biết và cắt ADN tại trình tự đặc hiệu. c) Đúng: plasmid có khả năng nhân đôi độc lập, thường dùng làm vector. d) Sai: công nghệ gene tạo ra insulin, vaccine, kháng thể đơn dòng... ứng dụng rộng rãi trong y học.", "points": 1}, {"type": "short", "level": "TH", "q": "Một phân tử mRNA có 600 nucleotide. Số bộ ba (codon) trên phân tử mRNA này là bao nhiêu?", "answer": "200", "explain": "Mỗi codon gồm 3 nucleotide nên số codon = 600/3 = 200.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Ở người, bệnh mù màu đỏ - lục do gene lặn a nằm trên NST X quy định (A: bình thường). Một cặp vợ chồng có vợ mang kiểu gene XAXA, chồng mang kiểu gene XaY. Theo lí thuyết, tỉ lệ con bị mù màu của cặp vợ chồng này là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0", "explain": "Con gái nhận allele Xa từ bố và XA từ mẹ nên có kiểu gene XAXa (bình thường); con trai nhận NST Y từ bố và XA từ mẹ nên có kiểu gene XAY (bình thường). Không có con nào bị bệnh, tỉ lệ là 0.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Một quần thể ngẫu phối có tần số allele A = 0,6 và tần số allele a = 0,4. Khi quần thể đạt trạng thái cân bằng di truyền, tỉ lệ kiểu gene Aa là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,48", "explain": "Theo Hardy - Weinberg, tỉ lệ kiểu gene Aa = 2pq = 2 x 0,6 x 0,4 = 0,48.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Người mắc hội chứng Down có 3 NST số 21 (thể ba nhiễm). Tế bào sinh dưỡng của người này có tổng cộng bao nhiêu NST?", "answer": "47", "explain": "Người bình thường có 46 NST; thể ba nhiễm (2n + 1) nên có 46 + 1 = 47 NST.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Xét chuỗi thức ăn: cỏ → thỏ → cáo → vi sinh vật phân giải. Sinh vật sản xuất (cỏ) tích lũy được 100000 kcal năng lượng, hiệu suất sinh thái giữa các bậc dinh dưỡng là 10%. Theo lí thuyết, lượng năng lượng cáo nhận được là bao nhiêu kcal?", "answer": "1000", "explain": "Thỏ (sinh vật tiêu thụ bậc 1) nhận 100000 x 10% = 10000 kcal; cáo (sinh vật tiêu thụ bậc 2, bậc dinh dưỡng cấp 3) nhận 10000 x 10% = 1000 kcal.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ở một loài thực vật, cho P: AaBb x AaBb (hai gene phân li độc lập, trội hoàn toàn). Theo lí thuyết, ở F1, tỉ lệ cá thể có kiểu gene AABB là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,0625", "explain": "Aa x Aa cho AA với tỉ lệ 1/4; Bb x Bb cho BB với tỉ lệ 1/4. Hai gene phân li độc lập nên tỉ lệ AABB = 1/4 x 1/4 = 1/16 = 0,0625.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Bào quan nào sau đây là nơi diễn ra quá trình quang hợp ở tế bào thực vật?", "options": ["A. Ti thể", "B. Lục lạp", "C. Bộ máy Golgi", "D. Lysosome"], "answer": "B", "explain": "Lục lạp chứa hệ sắc tố quang hợp (diệp lục) trên màng thylakoid, là bào quan thực hiện quang hợp ở tế bào thực vật.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ở tế bào nhân thực, phần lớn phân tử ADN được chứa trong", "options": ["A. nhân tế bào", "B. ribosome", "C. màng sinh chất", "D. thành tế bào"], "answer": "A", "explain": "Ở tế bào nhân thực, ADN chủ yếu nằm trong nhân tế bào (tạo thành NST), một phần nhỏ nằm trong ti thể và lục lạp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cơ quan nào sau đây đóng vai trò chủ yếu trong điều hòa cân bằng nước và muối khoáng ở người?", "options": ["A. Phổi", "B. Da", "C. Thận", "D. Tim"], "answer": "C", "explain": "Thận điều hòa cân bằng nước và các ion (Na+, K+...) qua quá trình lọc máu, tái hấp thu và bài tiết ở ống thận.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Côn trùng trao đổi khí với môi trường bên ngoài qua cơ quan nào?", "options": ["A. Hệ thống ống khí", "B. Phổi", "C. Mang", "D. Da"], "answer": "A", "explain": "Côn trùng hô hấp qua hệ thống ống khí phân nhánh chằng chịt đưa O2 trực tiếp đến từng tế bào.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sinh trưởng thứ cấp ở cây thân gỗ là do hoạt động của", "options": ["A. mô phân sinh đỉnh", "B. mô phân sinh lóng", "C. tầng phát sinh của lá", "D. mô phân sinh bên"], "answer": "D", "explain": "Mô phân sinh bên (tầng sinh vỏ, tầng sinh trụ) tạo ra sinh trưởng thứ cấp làm tăng đường kính thân cây gỗ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đột biến điểm bao gồm các dạng nào sau đây?", "options": ["A. Mất, thêm, thay thế một cặp nucleotide", "B. Mất đoạn, lặp đoạn NST", "C. Lệch bội, đa bội", "D. Chuyển đoạn NST"], "answer": "A", "explain": "Đột biến điểm là đột biến liên quan đến một cặp nucleotide, gồm ba dạng: mất, thêm và thay thế một cặp nucleotide.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong quá trình dịch mã tổng hợp chuỗi polipeptit, ribosome trượt trên phân tử mRNA theo chiều nào?", "options": ["A. 3' đến 5'", "B. 5' đến 3'", "C. Cả hai chiều", "D. Từ giữa ra hai đầu"], "answer": "B", "explain": "Ribosome trượt dọc phân tử mRNA theo chiều 5' đến 3', đọc từng codon để gắn amino acid tương ứng vào chuỗi polipeptit.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một gene có chiều dài 3060 angstrom. Tổng số nucleotide của gene này là", "options": ["A. 900", "B. 1800", "C. 3600", "D. 1200"], "answer": "B", "explain": "Chiều dài gene L = N/2 x 3,4 angstrom. Suy ra N = 2L/3,4 = 2 x 3060/3,4 = 1800 nucleotide.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong giảm phân II, các chromatid chị em của mỗi NST kép phân li về hai cực của tế bào ở kì nào?", "options": ["A. Kì đầu II", "B. Kì giữa II", "C. Kì cuối II", "D. Kì sau II"], "answer": "D", "explain": "Ở kì sau II, các chromatid chị em tách nhau ra và di chuyển về hai cực tế bào, tương tự kì sau của nguyên phân.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Dưa hấu không hạt là dạng đột biến tam bội (3n). Nguyên nhân chủ yếu khiến cây tam bội thường bất thụ là", "options": ["A. NST bị tiêu biến hoàn toàn", "B. cây không thể ra hoa", "C. hạt bị lép do thiếu nước", "D. giảm phân diễn ra rối loạn do các NST không bắt cặp tương đồng hoàn toàn được"], "answer": "D", "explain": "Ở cơ thể tam bội (3n), các NST không thể bắt cặp và phân li đồng đều khi giảm phân nên giao tử thường bất thường, cây bất thụ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hiện tượng trội hoàn toàn là", "options": ["A. allele lặn át sự biểu hiện của allele trội", "B. cơ thể dị hợp biểu hiện kiểu hình trung gian", "C. allele trội át hoàn toàn sự biểu hiện của allele lặn, cơ thể dị hợp biểu hiện kiểu hình trội", "D. cả hai allele cùng biểu hiện kiểu hình"], "answer": "C", "explain": "Trội hoàn toàn: allele trội lấn át hoàn toàn allele lặn nên kiểu gene dị hợp (Aa) biểu hiện kiểu hình trội giống hệt đồng hợp trội (AA).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phép lai phân tích là phép lai giữa", "options": ["A. hai cơ thể dị hợp với nhau", "B. hai cơ thể thuần chủng khác nhau", "C. cơ thể mang tính trạng trội với cơ thể đồng hợp lặn", "D. cơ thể đực với cơ thể cái cùng loài"], "answer": "C", "explain": "Phép lai phân tích dùng để kiểm tra kiểu gene của cơ thể mang tính trạng trội bằng cách lai với cơ thể đồng hợp lặn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trên bản đồ di truyền, khoảng cách giữa hai gene A và B là 17 cM. Tần số hoán vị gene giữa hai gene này là", "options": ["A. 8,5%", "B. 17%", "C. 34%", "D. 1,7%"], "answer": "B", "explain": "Khoảng cách trên bản đồ di truyền tính bằng cM tương ứng trực tiếp với tần số hoán vị gene: 1 cM tương ứng 1% hoán vị. Vậy f = 17%.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhân tố tiến hóa nào sau đây làm thay đổi tần số allele của quần thể theo một hướng xác định?", "options": ["A. Phiêu bạt di truyền", "B. Đột biến ngẫu nhiên", "C. Di - nhập gene ngẫu nhiên", "D. Chọn lọc tự nhiên"], "answer": "D", "explain": "Chọn lọc tự nhiên tác động có hướng: giữ lại kiểu gene thích nghi, đào thải kiểu gene kém thích nghi nên làm thay đổi tần số allele theo hướng xác định.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phương pháp nào sau đây cho phép theo dõi sự di truyền của một tính trạng qua nhiều thế hệ trong một gia đình người?", "options": ["A. Nghiên cứu trẻ đồng sinh", "B. Nghiên cứu phả hệ", "C. Nghiên cứu tế bào học", "D. Nghiên cứu di truyền quần thể"], "answer": "B", "explain": "Nghiên cứu phả hệ lập sơ đồ các thế hệ trong gia đình để xác định quy luật di truyền của tính trạng/bệnh ở người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bằng chứng phôi sinh học so sánh cho thấy", "options": ["A. các loài có quan hệ họ hàng càng gần thì phôi càng giống nhau ở giai đoạn phát triển đầu", "B. phôi của các loài hoàn toàn khác nhau", "C. chỉ động vật có xương sống mới có giai đoạn phôi", "D. phôi người và phôi cá giống nhau trong suốt quá trình phát triển"], "answer": "A", "explain": "Định luật phát sinh sinh vật học: các loài có họ hàng càng gần thì phôi càng giống nhau ở giai đoạn đầu, càng về sau càng phân hóa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một quần thể nhỏ bị cách li, qua nhiều thế hệ tần số các allele thay đổi một cách ngẫu nhiên, không theo hướng xác định. Đây là kết quả tác động của nhân tố nào?", "options": ["A. Chọn lọc tự nhiên", "B. Giao phối ngẫu nhiên", "C. Phiêu bạt di truyền", "D. Đột biến có hướng"], "answer": "C", "explain": "Phiêu bạt di truyền (biến động di truyền) là sự thay đổi ngẫu nhiên tần số allele do yếu tố ngẫu nhiên, tác động mạnh ở quần thể nhỏ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa tảo và nấm trong địa y là ví dụ của mối quan hệ nào?", "options": ["A. Cộng sinh", "B. Hội sinh", "C. Kí sinh", "D. Cạnh tranh"], "answer": "A", "explain": "Trong địa y, tảo quang hợp cung cấp chất hữu cơ, nấm hút nước và muối khoáng — hai bên cùng có lợi nên là quan hệ cộng sinh.", "points": 0.25}, {"type": "truefalse", "level": "VD", "q": "Một gene có 1200 cặp nucleotide. Một đột biến làm mất 1 cặp nucleotide xảy ra ở bộ ba thứ 100 (tính từ mã mở đầu). Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Đột biến trên thuộc dạng đột biến dịch khung.", "b) Chuỗi polipeptit đột biến bị thay đổi trình tự amino acid từ vị trí đột biến trở về sau.", "c) Số liên kết hidro của gene đột biến chắc chắn giảm đi 3.", "d) Đột biến này không làm thay đổi chiều dài của gene."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: mất 1 cặp nucleotide làm lệch khung đọc — đột biến dịch khung. b) Đúng: khung đọc bị lệch nên toàn bộ codon từ vị trí đột biến trở về sau đều thay đổi. c) Sai: mất 1 cặp A-T giảm 2 liên kết hidro, mất 1 cặp G-X giảm 3; đề không cho biết cặp nào bị mất nên không khẳng định được. d) Sai: mất 1 cặp nucleotide làm gene ngắn đi 3,4 angstrom.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Ở ruồi giấm, gene A (mắt đỏ) trội hoàn toàn so với gene a (mắt trắng), nằm trên NST X (không có allele tương ứng trên Y). Cho P: ruồi cái XAXa x ruồi đực XAY. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) F1 có 4 loại kiểu gene.", "b) Tỉ lệ ruồi mắt trắng ở F1 là 25%.", "c) Tất cả các ruồi cái ở F1 đều có mắt đỏ.", "d) Tỉ lệ ruồi đực mắt đỏ trong tổng số F1 là 50%."], "answer": ["T", "T", "T", "F"], "explain": "P cho F1: 1XAXA : 1XAXa : 1XAY : 1XaY. a) Đúng: 4 loại kiểu gene. b) Đúng: ruồi mắt trắng (XaY) chiếm 1/4 = 25%. c) Đúng: ruồi cái đều nhận XA từ bố nên mắt đỏ. d) Sai: ruồi đực mắt đỏ (XAY) chiếm 1/4 = 25% tổng số F1, không phải 50%.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về học thuyết tiến hóa của Darwin. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Mọi sinh vật đều có xu hướng sinh ra số lượng con nhiều hơn khả năng nuôi sống của môi trường.", "b) Các cá thể mang biến dị giúp thích nghi tốt hơn sẽ sống sót và để lại nhiều con cháu hơn.", "c) Darwin đã giải thích được nguyên nhân phát sinh các biến dị di truyền.", "d) Theo Darwin, chọn lọc nhân tạo là động lực chính của tiến hóa trong tự nhiên."], "answer": ["T", "T", "F", "F"], "explain": "a) Đúng: sinh vật có xu hướng sinh sản vượt quá sức chứa của môi trường dẫn đến đấu tranh sinh tồn. b) Đúng: đó là nội dung cốt lõi của chọn lọc tự nhiên. c) Sai: thời Darwin chưa biết về gene và đột biến nên chưa giải thích được nguyên nhân biến dị. d) Sai: động lực của tiến hóa trong tự nhiên là chọn lọc tự nhiên, không phải chọn lọc nhân tạo.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về quần xã sinh vật. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Quần xã sinh vật là tập hợp các quần thể sinh vật khác loài cùng sống trong một không gian xác định.", "b) Độ đa dạng của quần xã càng cao thì quần xã càng ổn định.", "c) Rừng mưa nhiệt đới có độ đa dạng loài cao hơn hẳn so với hoang mạc.", "d) Các loài trong quần xã tồn tại hoàn toàn độc lập, không ảnh hưởng lẫn nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: đó là khái niệm quần xã sinh vật. b) Đúng: quần xã đa dạng có lưới thức ăn phức tạp, khả năng tự điều chỉnh tốt nên ổn định hơn. c) Đúng: rừng mưa nhiệt đới là quần xã có độ đa dạng cao nhất trên cạn. d) Sai: các loài trong quần xã có quan hệ mật thiết với nhau (dinh dưỡng, hỗ trợ, đối kháng).", "points": 1}, {"type": "short", "level": "TH", "q": "Một gene có tổng số 2400 nucleotide, trong đó có 480 adenine (A). Số guanine (G) của gene này là bao nhiêu?", "answer": "720", "explain": "Theo nguyên tắc bổ sung: A = T = 480. Suy ra G = C = (2400 - 2 x 480)/2 = (2400 - 960)/2 = 720.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Ở một loài thực vật, allele A quy định thân cao trội hoàn toàn so với allele a quy định thân thấp; allele B quy định hoa đỏ trội hoàn toàn so với allele b quy định hoa trắng. Cho P: AaBb x aabb. Theo lí thuyết, tỉ lệ cây thân thấp, hoa trắng (aabb) ở F1 là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,25", "explain": "AaBb cho 4 loại giao tử với tỉ lệ bằng nhau, aabb chỉ cho giao tử ab. Tỉ lệ cây aabb = 1/4 x 1 = 1/4 = 0,25.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Một quần thể có 1000 cá thể gồm: 100 cá thể có kiểu gene AA, 200 cá thể có kiểu gene Aa và 700 cá thể có kiểu gene aa. Tần số allele a của quần thể này là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,8", "explain": "Tổng số allele = 2 x 1000 = 2000. Số allele a = 2 x 700 + 200 = 1600. Tần số allele a = 1600/2000 = 0,8.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Một tế bào sinh dưỡng của người (2n = 46) nguyên phân liên tiếp 4 lần. Tổng số tế bào con được tạo ra là bao nhiêu?", "answer": "16", "explain": "Sau k lần nguyên phân, từ 1 tế bào mẹ tạo ra 2^k tế bào con. Với k = 4, số tế bào con = 2^4 = 16.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Hiệu suất sinh thái giữa các bậc dinh dưỡng là 10%. Trong một hệ sinh thái, sinh vật tiêu thụ bậc 1 nhận được 4000 kcal năng lượng. Theo lí thuyết, sinh vật sản xuất đã tích lũy được bao nhiêu kcal năng lượng?", "answer": "40000", "explain": "Sinh vật tiêu thụ bậc 1 nhận 10% năng lượng của sinh vật sản xuất. Vậy năng lượng sinh vật sản xuất tích lũy = 4000/10% = 40000 kcal.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Ở người, bệnh bạch tạng do gene lặn a nằm trên NST thường quy định (A: bình thường). Một cặp vợ chồng đều có kiểu gene Aa. Theo lí thuyết, xác suất để họ sinh được 2 người con đều bình thường là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,5625", "explain": "Aa x Aa cho tỉ lệ con bình thường (A-) là 3/4. Các lần sinh độc lập nên xác suất sinh 2 con đều bình thường = (3/4)^2 = 9/16 = 0,5625.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "TH", "q": "Vận chuyển chủ động các chất qua màng sinh chất có đặc điểm nào sau đây?", "options": ["A. Không cần năng lượng, đi xuôi chiều gradient nồng độ", "B. Cần năng lượng ATP và protein vận chuyển, đi ngược chiều gradient nồng độ", "C. Chỉ vận chuyển được nước", "D. Không cần protein màng tham gia"], "answer": "B", "explain": "Vận chuyển chủ động cần tiêu tốn ATP và có protein vận chuyển đặc hiệu để đưa chất đi ngược chiều gradient nồng độ (từ nơi nồng độ thấp đến nơi nồng độ cao).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thành tế bào của thực vật được cấu tạo chủ yếu từ chất nào?", "options": ["A. Cellulose", "B. Kitin", "C. Peptidoglycan", "D. Phospholipid"], "answer": "A", "explain": "Thành tế bào thực vật chủ yếu gồm các sợi cellulose, giúp tế bào có hình dạng ổn định và bảo vệ tế bào.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Enzyme amylase trong nước bọt của người có tác dụng nào sau đây?", "options": ["A. Thủy phân protein thành amino acid", "B. Thủy phân lipid thành glycerol", "C. Tổng hợp glycogen dự trữ", "D. Thủy phân tinh bột thành đường maltose"], "answer": "D", "explain": "Amylase là enzyme tiêu hóa tinh bột (bắt đầu ở khoang miệng), cắt tinh bột thành các đoạn ngắn và đường maltose.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Miễn dịch đặc hiệu của cơ thể có đặc điểm nào sau đây?", "options": ["A. Bẩm sinh, không có tính đặc hiệu", "B. Chỉ có ở thực vật", "C. Không liên quan đến kháng thể", "D. Có tính đặc hiệu với kháng nguyên và có trí nhớ miễn dịch"], "answer": "D", "explain": "Miễn dịch đặc hiệu (miễn dịch thu được) có tính đặc hiệu cao với từng kháng nguyên và hình thành trí nhớ miễn dịch giúp đáp ứng nhanh ở lần tiếp xúc sau.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phản xạ ở động vật là", "options": ["A. vận động hướng động của thực vật", "B. sự co rút tự động của cơ tim", "C. phản ứng trả lời kích thích của cơ thể thông qua hệ thần kinh", "D. quá trình tiêu hóa thức ăn"], "answer": "C", "explain": "Phản xạ là phản ứng của cơ thể trả lời các kích thích từ môi trường thông qua hệ thần kinh (cung phản xạ).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Base nitơ nào sau đây chỉ có trong phân tử ADN mà không có trong phân tử ARN?", "options": ["A. Uracil", "B. Thymine", "C. Adenine", "D. Guanine"], "answer": "B", "explain": "ADN có 4 base A, T, G, C; ARN có A, U, G, C. Thymine chỉ có ở ADN, còn uracil chỉ có ở ARN.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong cơ chế điều hòa hoạt động của operon lac, chất cảm ứng (lactose) có vai trò nào?", "options": ["A. Liên kết trực tiếp với vùng vận hành", "B. Ức chế hoạt động của gene điều hòa", "C. Liên kết với protein ức chế làm nó bị bất hoạt", "D. Hoạt hóa vùng khởi động của operon"], "answer": "C", "explain": "Lactose đóng vai trò chất cảm ứng: liên kết với protein ức chế làm thay đổi cấu hình khiến nó không bám được vào vùng vận hành, operon được phiên mã.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đột biến làm mất 2 cặp nucleotide liên tiếp trong vùng mã hóa của gene thuộc dạng đột biến nào?", "options": ["A. Đột biến dịch khung", "B. Đột biến thay thế cặp nucleotide", "C. Đột biến đồng nghĩa", "D. Đột biến vô nghĩa"], "answer": "A", "explain": "Mất 2 cặp nucleotide (số cặp không chia hết cho 3) làm lệch khung đọc mã — thuộc đột biến dịch khung (frameshift).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhiễm sắc thể kép gồm", "options": ["A. 2 chromatid chị em dính nhau ở tâm động", "B. 2 nhiễm sắc thể khác nhau của cặp tương đồng", "C. 1 chromatid duy nhất", "D. 4 chromatid độc lập"], "answer": "A", "explain": "Sau khi nhân đôi, mỗi NST gồm 2 chromatid chị em (giống hệt nhau) dính nhau ở tâm động — gọi là NST kép.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đảo đoạn nhiễm sắc thể là dạng đột biến", "options": ["A. làm đứt một đoạn NST rồi đảo ngược 180 độ và nối lại", "B. làm mất một đoạn NST", "C. làm lặp lại một đoạn NST", "D. chuyển một đoạn giữa hai NST không tương đồng"], "answer": "A", "explain": "Đảo đoạn: một đoạn NST bị đứt, quay ngược 180 độ rồi nối lại, làm thay đổi trình tự gene trên NST nhưng không làm mất gene.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Phép lai P: AaBb x AaBb (hai gene phân li độc lập, trội hoàn toàn). Tỉ lệ phân li kiểu hình ở F1 là", "options": ["A. 1 : 1 : 1 : 1", "B. 9 : 3 : 3 : 1", "C. 3 : 1", "D. 1 : 2 : 1"], "answer": "B", "explain": "Mỗi cặp gene cho tỉ lệ kiểu hình 3 : 1. Hai gene phân li độc lập nên tỉ lệ kiểu hình chung = (3 : 1)(3 : 1) = 9 : 3 : 3 : 1.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hiện tượng một gene chi phối sự biểu hiện của nhiều tính trạng được gọi là", "options": ["A. tương tác gene", "B. liên kết gene", "C. hoán vị gene", "D. gene đa hiệu"], "answer": "D", "explain": "Gene đa hiệu: một gene ảnh hưởng đến nhiều tính trạng khác nhau (ví dụ gene gây bệnh hồng cầu liềm ảnh hưởng nhiều cơ quan).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Morgan phát hiện ra quy luật di truyền liên kết khi nghiên cứu trên đối tượng nào?", "options": ["A. Đậu Hà Lan", "B. Cây ngô", "C. Ruồi giấm", "D. Thỏ"], "answer": "C", "explain": "Thomas Hunt Morgan nghiên cứu di truyền trên ruồi giấm và phát hiện các gene cùng nằm trên một NST di truyền liên kết với nhau.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một quần thể thực vật tự thụ phấn có cấu trúc ban đầu: 0,3 AA : 0,4 Aa : 0,3 aa. Sau 1 thế hệ tự thụ phấn, tỉ lệ kiểu gene AA là", "options": ["A. 0,3", "B. 0,4", "C. 0,5", "D. 0,35"], "answer": "B", "explain": "Tự thụ phấn: Aa cho 1/4 AA. Sau 1 thế hệ: AA = 0,3 + 0,4/4 = 0,3 + 0,1 = 0,4.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Liệu pháp gene là phương pháp chữa bệnh bằng cách", "options": ["A. cắt bỏ cơ quan bị bệnh", "B. dùng thuốc kháng sinh liều cao", "C. ghép tủy xương", "D. thay thế gene bị bệnh bằng gene lành"], "answer": "D", "explain": "Liệu pháp gene đưa gene lành vào tế bào bệnh nhân để thay thế hoặc bổ sung cho gene bị lỗi, điều trị các bệnh di truyền.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tiến hóa lớn là quá trình", "options": ["A. hình thành các nhóm phân loại trên loài như chi, họ, bộ, lớp", "B. hình thành loài mới", "C. thay đổi tần số allele trong quần thể", "D. hình thành quần thể mới"], "answer": "A", "explain": "Tiến hóa lớn nghiên cứu sự hình thành các đơn vị phân loại trên loài (chi, họ, bộ, lớp, ngành) và sự phát triển của toàn bộ sinh giới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tiêu chuẩn quan trọng nhất để phân biệt hai loài thân thuộc là", "options": ["A. hình thái ngoài", "B. phân bố địa lí", "C. cách li sinh sản", "D. đặc điểm sinh lí"], "answer": "C", "explain": "Cách li sinh sản (không giao phối được hoặc con lai bất thụ) là tiêu chuẩn chính xác nhất để xác định hai quần thể thuộc hai loài khác nhau.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Diễn thế sinh thái là", "options": ["A. sự di cư hàng loạt của các loài", "B. quá trình biến đổi tuần tự của quần xã qua các giai đoạn tương ứng với sự biến đổi của môi trường", "C. sự tuyệt chủng đồng thời của nhiều loài", "D. sự phân bố ngẫu nhiên của các cá thể trong quần xã"], "answer": "B", "explain": "Diễn thế sinh thái là quá trình biến đổi tuần tự của quần xã sinh vật qua các giai đoạn, gắn liền với sự biến đổi của môi trường (ví dụ từ ao hồ thành rừng).", "points": 0.25}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về hô hấp tế bào. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Hô hấp tế bào gồm ba giai đoạn: đường phân, chu trình Krebs và chuỗi chuyền electron hô hấp.", "b) Đường phân diễn ra trong tế bào chất.", "c) Chu trình Krebs diễn ra ở chất nền của ti thể.", "d) Lên men tạo ra nhiều ATP hơn hô hấp hiếu khí."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: đó là 3 giai đoạn của hô hấp hiếu khí. b) Đúng: đường phân xảy ra ở tế bào chất, tạo 2 ATP. c) Đúng: chu trình Krebs xảy ra ở chất nền ti thể. d) Sai: lên men chỉ tạo 2 ATP, ít hơn nhiều so với hô hấp hiếu khí (khoảng 38 ATP).", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Một quần thể thực vật có cấu trúc di truyền: 0,16 AA : 0,48 Aa : 0,36 aa. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Tần số allele A của quần thể là 0,4.", "b) Quần thể đang ở trạng thái cân bằng di truyền.", "c) Nếu cho quần thể ngẫu phối, cấu trúc di truyền ở F1 vẫn giữ nguyên như trên.", "d) Tần số allele a của quần thể là 0,5."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: p(A) = 0,16 + 0,48/2 = 0,4. b) Đúng: 0,4^2 = 0,16; 2 x 0,4 x 0,6 = 0,48; 0,6^2 = 0,36 — đúng công thức Hardy - Weinberg. c) Đúng: quần thể cân bằng thì ngẫu phối không làm đổi cấu trúc di truyền. d) Sai: q(a) = 1 - 0,4 = 0,6.", "points": 1}, {"type": "truefalse", "level": "VD", "q": "Nghiên cứu một quần thể thỏ trong rừng: đầu năm có 500 cá thể, cuối năm có 800 cá thể (không có di cư, nhập cư). Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Trong năm đó, tỉ lệ sinh sản của quần thể vượt tỉ lệ tử vong.", "b) Mức tăng trưởng của quần thể trong năm đó là 300 cá thể.", "c) Nếu nguồn sống không đổi, quần thể sẽ tăng mãi theo đường cong chữ J.", "d) Khi mật độ quá cao, cạnh tranh cùng loài có thể làm giảm mức sinh sản của quần thể."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: số lượng tăng từ 500 lên 800 nên sinh vượt tử. b) Đúng: 800 - 500 = 300 cá thể. c) Sai: nguồn sống hữu hạn nên tăng trưởng bị giới hạn, theo đường cong chữ S với sức chứa của môi trường. d) Đúng: mật độ cao làm tăng cạnh tranh cùng loài về thức ăn, nơi ở, giảm sinh sản.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét các phát biểu về vai trò của các nhân tố tiến hóa. Xét tính đúng, sai của các phát biểu sau:", "statements": ["a) Đột biến làm thay đổi tần số allele của quần thể một cách chậm chạp.", "b) Chọn lọc tự nhiên đào thải các kiểu hình kém thích nghi khỏi quần thể.", "c) Di - nhập gene làm tăng sự phân hóa di truyền giữa các quần thể.", "d) Giao phối ngẫu nhiên tạo ra nguồn biến dị tổ hợp phong phú cho tiến hóa."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: tần số đột biến thấp nên làm thay đổi tần số allele chậm. b) Đúng: đó là cơ chế của chọn lọc tự nhiên. c) Sai: di - nhập gene trao đổi allele giữa các quần thể nên làm giảm sự phân hóa, tăng tính đồng nhất. d) Đúng: giao phối ngẫu nhiên tổ hợp các allele tạo biến dị tổ hợp.", "points": 1}, {"type": "short", "level": "TH", "q": "Một phân tử ADN có 30% adenine (A). Tỉ lệ % guanine (G) của phân tử ADN này là bao nhiêu?", "answer": "20", "explain": "Theo nguyên tắc bổ sung: A = T = 30%. Suy ra G = C = (100% - 2 x 30%)/2 = 20%.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Ở một loài thực vật, allele B quy định hoa đỏ trội hoàn toàn so với allele b quy định hoa trắng. Cho P: BB x bb, F1 tự thụ phấn. Theo lí thuyết, tỉ lệ cây hoa trắng (bb) ở F2 là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,25", "explain": "P: BB x bb cho F1 toàn Bb. F1 tự thụ phấn (Bb x Bb) cho F2 có tỉ lệ bb = 1/4 = 0,25.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Một quần thể ngẫu phối có tần số allele a = 0,3. Khi quần thể đạt trạng thái cân bằng di truyền, tỉ lệ kiểu gene aa là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,09", "explain": "Theo Hardy - Weinberg, tỉ lệ kiểu gene aa = q^2 = 0,3^2 = 0,09.", "points": 0.5}, {"type": "short", "level": "TH", "q": "Có 5 tế bào sinh tinh của một loài động vật (2n = 20) cùng giảm phân bình thường. Tổng số tinh trùng được tạo ra là bao nhiêu?", "answer": "20", "explain": "Mỗi tế bào sinh tinh giảm phân tạo 4 tinh trùng. 5 tế bào tạo 5 x 4 = 20 tinh trùng.", "points": 0.5}, {"type": "short", "level": "VD", "q": "Xét chuỗi thức ăn: cỏ → thỏ → cáo. Cỏ (sinh vật sản xuất) tích lũy được 10000 kcal năng lượng, hiệu suất sinh thái giữa các bậc dinh dưỡng là 10%. Theo lí thuyết, lượng năng lượng cáo nhận được là bao nhiêu kcal?", "answer": "100", "explain": "Thỏ nhận 10000 x 10% = 1000 kcal; cáo (bậc dinh dưỡng cấp 3) nhận 1000 x 10% = 100 kcal.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một quần thể thực vật tự thụ phấn có cấu trúc ban đầu: 0,2 AA : 0,6 Aa : 0,2 aa. Sau 2 thế hệ tự thụ phấn liên tiếp, tỉ lệ kiểu gene Aa là bao nhiêu? (Viết dưới dạng số thập phân.)", "answer": "0,15", "explain": "Qua mỗi thế hệ tự thụ phấn, tỉ lệ dị hợp giảm một nửa: Aa_n = Aa_0 x (1/2)^n = 0,6 x (1/2)^2 = 0,6 x 0,25 = 0,15.", "points": 0.5}]}]}
