{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'a' is pronounced differently from the others.","options":["A. data","B. cable","C. analyse","D. brave"],"answer":"C","explain":"Chữ 'a' trong data, cable, brave phát âm là /eɪ/, còn trong analyse là /æ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. robot","B. human","C. data","D. assist"],"answer":"D","explain":"assist nhấn âm 2 (əˈsɪst), còn robot, human, data nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"AI can ______ large amounts of data very quickly.","options":["A. analyse","B. ignore","C. delete","D. forget"],"answer":"A","explain":"AI có thể phân tích lượng lớn dữ liệu rất nhanh → analyse.","points":0.25},{"type":"mcq","level":"TH","q":"______ AI can learn from data, it is very useful.","options":["A. Because","B. Although","C. But","D. So"],"answer":"A","explain":"Mệnh đề chỉ nguyên nhân → because.","points":0.25},{"type":"mcq","level":"VD","q":"The flight was cancelled ______ bad weather.","options":["A. because","B. because of","C. although","D. since"],"answer":"B","explain":"Sau chỗ trống là cụm danh từ (bad weather) → because of; câu bị động.","points":0.25},{"type":"mcq","level":"TH","q":"A: What is AI? B: ______","options":["A. It's machines that can learn and think.","B. It's a kind of food.","C. I don't know.","D. Goodbye."],"answer":"A","explain":"Giải thích AI là máy móc có thể học và suy nghĩ.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nAI helps doctors in many ways. It can analyse X-ray images quickly. Because of AI, diseases are found earlier. AI also helps plan treatment. However, doctors still make the final decisions.","statements":["a) AI can analyse X-ray images.","b) AI finds diseases earlier.","c) AI makes all final decisions.","d) Doctors still decide in the end."],"answer":["T","T","F","T"],"explain":"c) Sai: bác sĩ vẫn là người quyết định cuối cùng.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Robots can ______ humans in dangerous jobs.","answer":"replace","explain":"Robot có thể thay thế con người trong công việc nguy hiểm → replace.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The new system is very ______ (intelligence).","answer":"intelligent","explain":"Cần tính từ → intelligent.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["robot","người máy"],["data","dữ liệu"],["predict","dự đoán"],["threat","mối đe dọa"],["chatbot","trợ lý ảo trò chuyện"]],"explain":"robot = người máy; data = dữ liệu; predict = dự đoán; threat = mối đe dọa; chatbot = trợ lý ảo trò chuyện.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["AI","can","learn","from","data"],"explain":"AI can learn from data. (AI có thể học từ dữ liệu.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Do you use virtual assistants? B: Yes, I ask mine to set alarms and play music. A: Is it accurate? B: Mostly, but sometimes it misunderstands me. A: That's funny! B: Technology is improving every day.","sub_questions":[{"q":"What does B use the assistant for?","options":["A. Setting alarms and playing music.","B. Cooking meals.","C. Driving cars.","D. Writing essays."],"answer":"A"},{"q":"What problem does B mention?","options":["A. It sometimes misunderstands.","B. It is too slow.","C. It is expensive.","D. It breaks often."],"answer":"A"}],"explain":"Hội thoại nói B dùng trợ lý ảo đặt báo thức, phát nhạc; đôi khi nó hiểu sai.","points":1}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'o' is pronounced differently from the others.","options":["A. robot","B. programme","C. monitor","D. remote"],"answer":"C","explain":"Chữ 'o' trong robot, programme, remote phát âm là /əʊ/, còn trong monitor là /ɒ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. intelligent","B. develop","C. replace","D. chatbot"],"answer":"D","explain":"chatbot nhấn âm 1 (ˈtʃætbɒt), còn intelligent, develop, replace nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"A ______ is a set of rules for a computer to follow.","options":["A. algorithm","B. robot","C. threat","D. benefit"],"answer":"A","explain":"Thuật toán là tập hợp quy tắc để máy tính làm theo → algorithm.","points":0.25},{"type":"mcq","level":"TH","q":"______ the heavy rain, the match was cancelled.","options":["A. Because","B. Because of","C. Although","D. Since"],"answer":"B","explain":"Sau chỗ trống là cụm danh từ (the heavy rain) → because of.","points":0.25},{"type":"mcq","level":"VD","q":"Thousands of jobs have been ______ by robots.","options":["A. replaced","B. replacing","C. replace","D. replacement"],"answer":"A","explain":"Câu bị động hiện tại hoàn thành: have been replaced.","points":0.25},{"type":"mcq","level":"TH","q":"A: Are you afraid of AI? B: ______","options":["A. A little. It may take our jobs.","B. No, I love food.","C. I don't care.","D. Goodbye."],"answer":"A","explain":"Bày tỏ lo ngại AI có thể lấy mất việc làm.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nChatbots are computer programmes that talk with people. They answer questions on websites day and night. Because they work fast, companies save money. However, chatbots cannot understand feelings. People still prefer talking to humans for difficult problems.","statements":["a) Chatbots talk with people.","b) They work day and night.","c) Companies save money with chatbots.","d) Chatbots understand feelings well."],"answer":["T","T","T","F"],"explain":"d) Sai: chatbot không hiểu được cảm xúc.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Machine ______ helps computers learn.","answer":"learning","explain":"Học máy giúp máy tính học hỏi → machine learning.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The robot was ______ (programme) to help doctors.","answer":"programmed","explain":"Câu bị động quá khứ đơn → programmed.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["automation","tự động hóa"],["algorithm","thuật toán"],["analyse","phân tích"],["capable","có khả năng"],["virtual","ảo"]],"explain":"automation = tự động hóa; algorithm = thuật toán; analyse = phân tích; capable = có khả năng; virtual = ảo.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["The","match","was","cancelled","because","of","rain"],"explain":"The match was cancelled because of rain. (Trận đấu bị hủy vì mưa.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Self-driving cars use AI to see the road. Cameras and sensors collect information. The car decides when to stop or turn. These cars could reduce accidents caused by tired drivers. However, many people still do not trust them.","sub_questions":[{"q":"How do self-driving cars see the road?","options":["A. With cameras and sensors.","B. With mirrors.","C. With maps only.","D. With human eyes."],"answer":"A"},{"q":"Why could they reduce accidents?","options":["A. They never get tired.","B. They drive fast.","C. They are cheap.","D. They fly."],"answer":"A"}],"explain":"Đoạn văn nói xe tự lái dùng camera, cảm biến và có thể giảm tai nạn vì không mệt mỏi.","points":1}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'i' is pronounced differently from the others.","options":["A. intelligent","B. virtual","C. digital","D. assist"],"answer":"B","explain":"Chữ 'i' trong intelligent, digital, assist phát âm là /ɪ/, còn trong virtual là /ɜː/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. algorithm","B. digital","C. virtual","D. advance"],"answer":"D","explain":"advance nhấn âm 2 (ədˈvɑːns), còn algorithm, digital, virtual nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"Virtual assistants can set alarms and ______ reminders.","options":["A. give","B. take","C. make","D. do"],"answer":"A","explain":"Trợ lý ảo có thể đặt báo thức và đưa ra nhắc nhở → give reminders.","points":0.25},{"type":"mcq","level":"TH","q":"He was fined ______ speeding.","options":["A. because","B. because of","C. for","D. although"],"answer":"C","explain":"'be fined for + V-ing/danh từ' (bị phạt vì) → for.","points":0.25},{"type":"mcq","level":"VD","q":"______ it rained heavily, the match was cancelled.","options":["A. Because of","B. Due to","C. Because","D. For"],"answer":"C","explain":"Sau chỗ trống là mệnh đề (it rained heavily) → because.","points":0.25},{"type":"mcq","level":"TH","q":"A: Can robots think like humans? B: ______","options":["A. Not really. They only follow programmes.","B. Yes, they eat food.","C. I don't know.","D. Goodbye."],"answer":"A","explain":"Robot không thực sự suy nghĩ như người, chỉ làm theo lập trình.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nAI is changing education. Students can ask chatbots questions any time. AI programmes check homework quickly. Because of AI, learning is more personal. However, students should not depend on AI too much.","statements":["a) Students can ask chatbots any time.","b) AI checks homework quickly.","c) AI makes learning more personal.","d) Students should depend on AI fully."],"answer":["T","T","T","F"],"explain":"d) Sai: học sinh không nên quá phụ thuộc vào AI.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: AI ______ in many fields like health and education.","answer":"helps","explain":"AI hỗ trợ trong nhiều lĩnh vực → helps.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The ______ (beneficial) of AI are clear.","answer":"benefits","explain":"Cần danh từ số nhiều → benefits.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["artificial intelligence","trí tuệ nhân tạo"],["machine learning","học máy"],["virtual assistant","trợ lý ảo"],["recognise","nhận diện"],["digital","kỹ thuật số"]],"explain":"artificial intelligence = trí tuệ nhân tạo; machine learning = học máy; virtual assistant = trợ lý ảo; recognise = nhận diện; digital = kỹ thuật số.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["She","was","praised","for","her","work"],"explain":"She was praised for her work. (Cô ấy được khen vì công việc của mình.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: My new phone recognises my face. B: Really? How does it work? A: It scans my face and compares it with saved data. B: Is it safe? A: Yes, my photos are protected. B: That's amazing!","sub_questions":[{"q":"What can A's phone do?","options":["A. Recognise his face.","B. Make calls only.","C. Take photos.","D. Play games."],"answer":"A"},{"q":"How does it work?","options":["A. It scans the face and compares with data.","B. It asks for passwords.","C. It uses fingerprints.","D. It calls the owner."],"answer":"A"}],"explain":"Hội thoại nói điện thoại nhận diện khuôn mặt bằng cách quét và so sánh dữ liệu.","points":1}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'e' is pronounced differently from the others.","options":["A. develop","B. intelligent","C. replace","D. clever"],"answer":"C","explain":"Chữ 'e' trong develop, intelligent, clever phát âm là /e/, còn trong replace là /eɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. automate","B. analyse","C. programme","D. create"],"answer":"D","explain":"create nhấn âm 2 (kriˈeɪt), còn automate, analyse, programme nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"Some people see AI as a ______ to human jobs.","options":["A. threat","B. benefit","C. help","D. gift"],"answer":"A","explain":"Một số người coi AI là mối đe dọa với việc làm → threat.","points":0.25},{"type":"mcq","level":"TH","q":"She was praised ______ her quick thinking.","options":["A. because","B. for","C. because of","D. as"],"answer":"B","explain":"'be praised for' (được khen vì) → for.","points":0.25},{"type":"mcq","level":"VD","q":"Due to ______ traffic, he was late for work.","options":["A. the heavy","B. heavily","C. heavy","D. heaviness"],"answer":"C","explain":"Due to + cụm danh từ: heavy traffic.","points":0.25},{"type":"mcq","level":"TH","q":"A: What can AI do in hospitals? B: ______","options":["A. It helps find diseases early.","B. It cooks meals.","C. I don't know.","D. Goodbye."],"answer":"A","explain":"AI giúp phát hiện bệnh sớm trong bệnh viện.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nRobots work in many factories. They do simple jobs again and again. Because robots do not get tired, production is faster. However, some workers lost their jobs to robots. Factories now train workers for new roles.","statements":["a) Robots work in factories.","b) Robots get tired quickly.","c) Production is faster with robots.","d) Factories train workers for new roles."],"answer":["T","F","T","T"],"explain":"b) Sai: robot không biết mệt.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The robot ______ designed to help old people.","answer":"was","explain":"Robot được thiết kế để giúp người già → was designed (bị động).","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: AI brings many ______ (benefit) to society.","answer":"benefits","explain":"Sau 'many' cần danh từ số nhiều → benefits.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["innovate","đổi mới"],["replace","thay thế"],["benefit","lợi ích"],["programme","lập trình"],["intelligent","thông minh"]],"explain":"innovate = đổi mới; replace = thay thế; benefit = lợi ích; programme = lập trình; intelligent = thông minh.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Because","of","AI","life","is","easier"],"explain":"Because of AI, life is easier. (Nhờ AI, cuộc sống dễ dàng hơn.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Robots can now help old people at home. They remind them to take medicine. They can also call for help in emergencies. Because of robots, many old people live more independently. Families feel less worried.","sub_questions":[{"q":"What do robots remind old people to do?","options":["A. Take medicine.","B. Do exercise.","C. Eat meals.","D. Go to bed."],"answer":"A"},{"q":"How do families feel?","options":["A. Less worried.","B. More worried.","C. Angry.","D. Sad."],"answer":"A"}],"explain":"Đoạn văn nói robot nhắc người già uống thuốc và các gia đình bớt lo lắng.","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'u' is pronounced differently from the others.","options":["A. useful","B. human","C. future","D. much"],"answer":"D","explain":"Chữ 'u' trong useful, human, future phát âm là /juː/, còn trong much là /ʌ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. capable","B. useful","C. careful","D. unique"],"answer":"D","explain":"unique nhấn âm 2 (juːˈniːk), còn capable, useful, careful nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"The company will ______ its system next year.","options":["A. innovate","B. stop","C. close","D. forget"],"answer":"A","explain":"Công ty sẽ đổi mới hệ thống vào năm tới → innovate.","points":0.25},{"type":"mcq","level":"TH","q":"______ robots work fast, factories use them widely.","options":["A. Since","B. Although","C. But","D. So"],"answer":"A","explain":"Mệnh đề chỉ nguyên nhân → since (= because).","points":0.25},{"type":"mcq","level":"VD","q":"The streets were flooded ______ the storm.","options":["A. because","B. because of","C. although","D. since"],"answer":"B","explain":"Sau chỗ trống là cụm danh từ (the storm) → because of.","points":0.25},{"type":"mcq","level":"TH","q":"A: Do you think AI will replace teachers? B: ______","options":["A. No, teachers give love and care.","B. Yes, definitely.","C. I don't know.","D. Goodbye."],"answer":"A","explain":"AI không thể thay giáo viên vì thầy cô trao yêu thương.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nSelf-driving cars are becoming real. They use cameras to see the road. Because they never get tired, they may cause fewer accidents. However, the technology is still expensive. Many people do not trust driverless cars yet.","statements":["a) Self-driving cars use cameras.","b) They never get tired.","c) The technology is cheap.","d) Many people trust them fully."],"answer":["T","T","F","F"],"explain":"c) Sai: công nghệ vẫn còn đắt. d) Sai: nhiều người chưa tin tưởng.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: We should keep ______ with new technology.","answer":"up","explain":"Cụm từ: keep up with (theo kịp).","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The machine can ______ (recognition) faces quickly.","answer":"recognise","explain":"Sau 'can' cần động từ nguyên thể → recognise.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["robot","người máy"],["predict","dự đoán"],["threat","mối đe dọa"],["virtual","ảo"],["capable","có khả năng"]],"explain":"robot = người máy; predict = dự đoán; threat = mối đe dọa; virtual = ảo; capable = có khả năng.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Robots","do","not","get","tired"],"explain":"Robots do not get tired. (Robot không biết mệt.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: I asked the chatbot for help. B: Did it answer well? A: Yes, it solved my maths problem! B: Wow, that's impressive. A: But it couldn't write a good poem. B: Ha! AI still can't replace poets.","sub_questions":[{"q":"What did the chatbot help with?","options":["A. A maths problem.","B. An English essay.","C. A history question.","D. A drawing."],"answer":"A"},{"q":"What couldn't it do well?","options":["A. Write a good poem.","B. Solve maths.","C. Answer questions.","D. Chat."],"answer":"A"}],"explain":"Hội thoại nói chatbot giải được toán nhưng không viết được thơ hay.","points":1}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ch' is pronounced differently from the others.","options":["A. chatbot","B. change","C. machine","D. choose"],"answer":"C","explain":"'ch' trong chatbot, change, choose phát âm là /tʃ/, còn trong machine là /ʃ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. machine","B. device","C. design","D. tablet"],"answer":"D","explain":"tablet nhấn âm 1 (ˈtæblət), còn machine, device, design nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"AI systems learn from ______ collected every day.","options":["A. data","B. food","C. water","D. air"],"answer":"A","explain":"Hệ thống AI học từ dữ liệu thu thập mỗi ngày → data.","points":0.25},{"type":"mcq","level":"TH","q":"As the chatbot was busy, we ______ a minute.","options":["A. wait","B. waited","C. are waiting","D. have waited"],"answer":"B","explain":"Câu kể quá khứ với 'as' chỉ nguyên nhân → waited.","points":0.25},{"type":"mcq","level":"VD","q":"He stayed home ______ he was sick.","options":["A. because of","B. because","C. despite","D. although"],"answer":"B","explain":"Sau chỗ trống là mệnh đề (he was sick) → because.","points":0.25},{"type":"mcq","level":"TH","q":"A: What does 'machine learning' mean? B: ______","options":["A. Computers learning from data.","B. Machines eating food.","C. I don't know.","D. Goodbye."],"answer":"A","explain":"Học máy là máy tính học từ dữ liệu.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nVirtual assistants live in phones and speakers. They can play music, set alarms and answer questions. Because they are convenient, millions of people use them. However, they sometimes misunderstand commands. Privacy is also a worry for some users.","statements":["a) Virtual assistants live in phones.","b) They can play music.","c) They never make mistakes.","d) Privacy worries some users."],"answer":["T","T","F","T"],"explain":"c) Sai: đôi khi chúng hiểu sai mệnh lệnh.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: AI plays an important ______ in modern life.","answer":"role","explain":"AI đóng vai trò quan trọng → play a role in.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The company invested in ______ (automate).","answer":"automation","explain":"Sau giới từ 'in' cần danh từ → automation.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["automation","tự động hóa"],["analyse","phân tích"],["data","dữ liệu"],["innovate","đổi mới"],["replace","thay thế"]],"explain":"automation = tự động hóa; analyse = phân tích; data = dữ liệu; innovate = đổi mới; replace = thay thế.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Since","it","was","late","we","went","home"],"explain":"Since it was late, we went home. (Vì đã muộn nên chúng tôi về nhà.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"AI art is popular now. People type words, and AI creates pictures. The pictures can be beautiful and strange. Some artists worry AI will replace them. Others use AI as a new tool for creativity.","sub_questions":[{"q":"How does AI create pictures?","options":["A. From typed words.","B. From photos.","C. From drawings.","D. From videos."],"answer":"A"},{"q":"How do some artists feel?","options":["A. Worried AI will replace them.","B. Happy and relaxed.","C. Angry at buyers.","D. Bored."],"answer":"A"}],"explain":"Đoạn văn nói AI tạo tranh từ chữ nhập vào; một số họa sĩ lo bị thay thế.","points":1}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'th' is pronounced differently from the others.","options":["A. think","B. through","C. other","D. threat"],"answer":"C","explain":"'th' trong think, through, threat phát âm là /θ/ (vô thanh), còn trong other là /ð/ (hữu thanh) nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. innovation","B. information","C. automatic","D. internet"],"answer":"D","explain":"internet nhấn âm 1 (ˈɪntənet), còn innovation, information, automatic nhấn âm 4/3.","points":0.25},{"type":"mcq","level":"TH","q":"The robot is ______ of doing many tasks.","options":["A. capable","B. afraid","C. tired","D. free"],"answer":"A","explain":"Cụm từ: capable of (có khả năng) → capable.","points":0.25},{"type":"mcq","level":"TH","q":"The match was cancelled ______ it rained heavily.","options":["A. because of","B. because","C. despite","D. although"],"answer":"B","explain":"Sau chỗ trống là mệnh đề → because.","points":0.25},{"type":"mcq","level":"VD","q":"______ his sickness, he stayed home.","options":["A. Because","B. Because of","C. Since","D. As"],"answer":"B","explain":"Sau chỗ trống là cụm danh từ (his sickness) → because of.","points":0.25},{"type":"mcq","level":"TH","q":"A: How does face recognition work? B: ______","options":["A. It scans your face and compares data.","B. It asks your name.","C. I don't know.","D. Goodbye."],"answer":"A","explain":"Nhận diện khuôn mặt quét mặt và so sánh dữ liệu.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nAI can create music and paintings. Some people enjoy AI art. However, real artists add feelings to their work. AI copies patterns from data. Many believe human creativity is special.","statements":["a) AI can create music.","b) Real artists add feelings.","c) AI copies patterns from data.","d) Nobody enjoys AI art."],"answer":["T","T","T","F"],"explain":"d) Sai: một số người thích nghệ thuật AI.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The new app was ______ to save time.","answer":"designed","explain":"Ứng dụng mới được thiết kế để tiết kiệm thời gian → was designed.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: Robots work with great ______ (precise).","answer":"precision","explain":"Cần danh từ → precision (sự chính xác).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["artificial intelligence","trí tuệ nhân tạo"],["recognise","nhận diện"],["digital","kỹ thuật số"],["benefit","lợi ích"],["programme","lập trình"]],"explain":"artificial intelligence = trí tuệ nhân tạo; recognise = nhận diện; digital = kỹ thuật số; benefit = lợi ích; programme = lập trình.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["He","was","late","due","to","traffic"],"explain":"He was late due to traffic. (Anh ấy muộn vì kẹt xe.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Will robots take our jobs? B: Some jobs, yes. But new jobs will appear too. A: Like what? B: People who design and repair robots. A: So we should learn new skills. B: Exactly! Adapt and keep learning.","sub_questions":[{"q":"What new jobs will appear?","options":["A. Designing and repairing robots.","B. Driving taxis.","C. Cooking food.","D. Cleaning houses."],"answer":"A"},{"q":"What should people do?","options":["A. Learn new skills.","B. Stop working.","C. Fear robots.","D. Move away."],"answer":"A"}],"explain":"Hội thoại nói công việc mới là thiết kế, sửa robot; mọi người nên học kỹ năng mới.","points":1}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 's' is pronounced differently from the others.","options":["A. assist","B. system","C. design","D. task"],"answer":"C","explain":"Chữ 's' trong assist, system, task phát âm là /s/, còn trong design là /z/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. threaten","B. happen","C. offer","D. invent"],"answer":"D","explain":"invent nhấn âm 2 (ɪnˈvent), còn threaten, happen, offer nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"AI brings both benefits and ______.","options":["A. risks","B. foods","C. games","D. songs"],"answer":"A","explain":"AI mang lại cả lợi ích và rủi ro → risks.","points":0.25},{"type":"mcq","level":"TH","q":"______ the storm, the flight was delayed.","options":["A. Because","B. Because of","C. Since","D. As"],"answer":"B","explain":"Sau chỗ trống là cụm danh từ (the storm) → because of.","points":0.25},{"type":"mcq","level":"VD","q":"She could not attend the meeting ______ her illness.","options":["A. because","B. because of","C. although","D. since"],"answer":"B","explain":"Sau chỗ trống là cụm danh từ (her illness) → because of.","points":0.25},{"type":"mcq","level":"TH","q":"A: Thank you for your help. B: ______","options":["A. You're welcome.","B. I'm fine.","C. Goodbye.","D. See you."],"answer":"A","explain":"Đáp lại lời cảm ơn → You're welcome.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nMachine learning is a type of AI. Computers learn from examples, not from rules. The more data they get, the smarter they become. Machine learning is used in translation and recommendations. It is changing many industries.","statements":["a) Machine learning is a type of AI.","b) Computers learn from examples.","c) More data makes them smarter.","d) It is used in translation."],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng theo đoạn văn.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The chatbot answered my question ______ seconds.","answer":"in","explain":"Chatbot trả lời trong vài giây → in seconds.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The system needs regular ______ (update).","answer":"updates","explain":"Cần danh từ số nhiều → updates.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["innovate","đổi mới"],["intelligent","thông minh"],["machine learning","học máy"],["virtual assistant","trợ lý ảo"],["chatbot","trợ lý ảo trò chuyện"]],"explain":"innovate = đổi mới; intelligent = thông minh; machine learning = học máy; virtual assistant = trợ lý ảo; chatbot = trợ lý ảo trò chuyện.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["AI","helps","doctors","find","diseases","early"],"explain":"AI helps doctors find diseases early. (AI giúp bác sĩ phát hiện bệnh sớm.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Drones use AI to fly without pilots. Farmers use drones to check crops. Rescue teams use drones to find lost people. Drones can reach dangerous places safely. This technology saves time and lives.","sub_questions":[{"q":"How do farmers use drones?","options":["A. To check crops.","B. To plant trees.","C. To feed animals.","D. To build houses."],"answer":"A"},{"q":"Why are drones useful in rescue?","options":["A. They reach dangerous places safely.","B. They are cheap.","C. They fly fast.","D. They carry people."],"answer":"A"}],"explain":"Đoạn văn nói nông dân dùng drone kiểm tra mùa màng; drone tới được nơi nguy hiểm an toàn.","points":1}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ea' is pronounced differently from the others.","options":["A. learn","B. early","C. great","D. earth"],"answer":"C","explain":"'ea' trong learn, early, earth phát âm là /ɜː/, còn trong great là /eɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. benefit","B. profit","C. rival","D. compete"],"answer":"D","explain":"compete nhấn âm 2 (kəmˈpiːt), còn benefit, profit, rival nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"We use a ______ to write and run computer programmes.","options":["A. computer","B. pen","C. book","D. phone"],"answer":"A","explain":"Dùng máy tính để viết và chạy chương trình → computer.","points":0.25},{"type":"mcq","level":"TH","q":"The robot ______ to help old people is very popular.","options":["A. design","B. designed","C. designing","D. designs"],"answer":"B","explain":"Mệnh đề quan hệ rút gọn bị động: designed (được thiết kế).","points":0.25},{"type":"mcq","level":"VD","q":"Owing to ______ invention of AI, life has changed a lot.","options":["A. a","B. an","C. the","D. Ø"],"answer":"C","explain":"Phát minh AI đã xác định → the invention.","points":0.25},{"type":"mcq","level":"TH","q":"A: Excuse me, can you help me? B: ______","options":["A. Sure, what do you need?","B. I'm busy.","C. Go away.","D. Goodbye."],"answer":"A","explain":"Sẵn sàng giúp đỡ → Sure, what do you need?","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nSome people fear AI. They think robots will control humans one day. Experts say this fear is exaggerated. AI follows human programmes. We should use AI wisely and set clear rules.","statements":["a) Some people fear AI.","b) Experts share this fear fully.","c) AI follows human programmes.","d) We should set clear rules for AI."],"answer":["T","F","T","T"],"explain":"b) Sai: chuyên gia cho rằng nỗi sợ này bị phóng đại.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: AI can translate languages ______ seconds.","answer":"in","explain":"AI dịch ngôn ngữ trong vài giây → in seconds.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The results were ______ (surprise) good.","answer":"surprisingly","explain":"Cần trạng từ bổ nghĩa cho tính từ 'good' → surprisingly.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["robot","người máy"],["data","dữ liệu"],["algorithm","thuật toán"],["virtual","ảo"],["intelligent","thông minh"]],"explain":"robot = người máy; data = dữ liệu; algorithm = thuật toán; virtual = ảo; intelligent = thông minh.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["We","should","use","AI","wisely"],"explain":"We should use AI wisely. (Chúng ta nên dùng AI một cách khôn ngoan.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: I love my robot vacuum. B: Does it work well? A: Yes, it cleans while I'm at work. B: That's convenient! A: It even returns to charge itself. B: I want one too!","sub_questions":[{"q":"What does A's robot do?","options":["A. Cleans while A is at work.","B. Cooks meals.","C. Washes clothes.","D. Waters plants."],"answer":"A"},{"q":"What can the robot do itself?","options":["A. Return to charge itself.","B. Repair itself.","C. Talk to people.","D. Open doors."],"answer":"A"}],"explain":"Hội thoại nói robot hút bụi dọn nhà khi A đi làm và tự về sạc.","points":1}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'oo' is pronounced differently from the others.","options":["A. soon","B. look","C. tool","D. cool"],"answer":"B","explain":"'oo' trong soon, tool, cool phát âm là /uː/, còn trong look là /ʊ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. predict","B. perform","C. provide","D. data"],"answer":"D","explain":"data nhấn âm 1 (ˈdeɪtə), còn predict, perform, provide nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"AI needs a lot of ______ to learn well.","options":["A. data","B. food","C. water","D. money"],"answer":"A","explain":"AI cần nhiều dữ liệu để học tốt → data.","points":0.25},{"type":"mcq","level":"TH","q":"______ she was tired, she kept working.","options":["A. Because","B. Although","C. Because of","D. Despite"],"answer":"B","explain":"Mệnh đề nhượng bộ → although + mệnh đề.","points":0.25},{"type":"mcq","level":"VD","q":"The project succeeded ______ careful planning.","options":["A. because","B. because of","C. although","D. since"],"answer":"B","explain":"Sau chỗ trống là cụm danh từ (careful planning) → because of.","points":0.25},{"type":"mcq","level":"TH","q":"A: See you later. B: ______","options":["A. Bye!","B. Good morning.","C. I'm fine.","D. Thank you."],"answer":"A","explain":"Chào tạm biệt → Bye!","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nThe future of AI is bright. AI will help solve big problems like disease and climate change. However, we must control AI carefully. Clear laws will keep AI safe. Humans and AI can work together well.","statements":["a) AI will help solve big problems.","b) We must control AI carefully.","c) Laws keep AI safe.","d) Humans and AI cannot work together."],"answer":["T","T","T","F"],"explain":"d) Sai: con người và AI có thể hợp tác tốt.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The future ______ AI is bright.","answer":"of","explain":"Tương lai của AI tươi sáng → the future of AI.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: She is ______ (confidence) about the new system.","answer":"confident","explain":"Sau 'is' cần tính từ → confident.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["automation","tự động hóa"],["predict","dự đoán"],["threat","mối đe dọa"],["digital","kỹ thuật số"],["replace","thay thế"]],"explain":"automation = tự động hóa; predict = dự đoán; threat = mối đe dọa; digital = kỹ thuật số; replace = thay thế.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Humans","and","AI","can","work","together"],"explain":"Humans and AI can work together. (Con người và AI có thể hợp tác.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Many schools teach coding now. Students learn to programme simple games. Coding teaches logical thinking. Because of these skills, students can create their own apps. Some teenagers have already built useful programmes.","sub_questions":[{"q":"What do students learn in coding classes?","options":["A. To programme simple games.","B. To repair computers.","C. To draw pictures.","D. To write essays."],"answer":"A"},{"q":"What does coding teach?","options":["A. Logical thinking.","B. Fast typing.","C. Good memory.","D. Drawing skills."],"answer":"A"}],"explain":"Đoạn văn nói học sinh học lập trình game đơn giản và coding dạy tư duy logic.","points":1}]}]}
