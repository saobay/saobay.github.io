{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ea' is pronounced differently from the others.","options":["A. media","B. dream","C. great","D. deal"],"answer":"C","explain":"'ea' trong media, dream, deal phát âm là /iː/, còn trong great là /eɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. media","B. social","C. press","D. report"],"answer":"D","explain":"report (động từ) nhấn âm 2 (rɪˈpɔːt), còn media, social, press nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"The ______ wrote an interesting article about AI.","options":["A. journalist","B. audience","C. viewer","D. reader"],"answer":"A","explain":"Nhà báo viết bài báo thú vị về AI → journalist.","points":0.25},{"type":"mcq","level":"TH","q":"He failed the exam, ______ surprised everyone.","options":["A. which","B. that","C. who","D. whose"],"answer":"A","explain":"'which' sau dấu phẩy thay cho cả mệnh đề phía trước.","points":0.25},{"type":"mcq","level":"VD","q":"This is the studio ______ the news is broadcast.","options":["A. which","B. that","C. where","D. who"],"answer":"C","explain":"Chỉ nơi chốn (studio) → where.","points":0.25},{"type":"mcq","level":"TH","q":"A: Did you watch the news last night? B: ______","options":["A. Yes, there was a flood in the north.","B. No, I hate news.","C. I don't know.","D. Goodbye."],"answer":"A","explain":"Trả lời đã xem và kể tin tức.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nFake news is false information shared as news. It spreads fast on social media. Many people believe it without checking. Fake news can cause panic and harm. We should check reliable sources before sharing.","statements":["a) Fake news is false information.","b) It spreads slowly.","c) It can cause panic.","d) We should check sources first."],"answer":["T","F","T","T"],"explain":"b) Sai: tin giả lan truyền nhanh trên mạng xã hội.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The news ______ is broadcast at 7 p.m.","answer":"programme","explain":"Chương trình tin tức phát sóng lúc 7 giờ tối → programme.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The information is ______ (rely).","answer":"reliable","explain":"Cần tính từ → reliable (đáng tin cậy).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["journalist","nhà báo"],["headline","tiêu đề báo"],["publish","xuất bản"],["viral","lan truyền nhanh"],["audience","khán giả"]],"explain":"journalist = nhà báo; headline = tiêu đề báo; publish = xuất bản; viral = lan truyền nhanh; audience = khán giả.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["He","failed","which","surprised","everyone"],"explain":"He failed, which surprised everyone. (Anh ấy trượt, điều này làm mọi người ngạc nhiên.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Did you hear about the new shopping mall? B: Yes, I saw it on the news. A: When does it open? B: Next month. They say it has 200 shops. A: Wow! Let's visit it together. B: Sure!","sub_questions":[{"q":"Where did B hear the news?","options":["A. On the news.","B. From a friend.","C. On social media.","D. In a newspaper."],"answer":"A"},{"q":"When does the mall open?","options":["A. Next week.","B. Next month.","C. Tomorrow.","D. Next year."],"answer":"B"}],"explain":"Hội thoại nói B xem tin tức và trung tâm thương mại khai trương tháng tới.","points":1}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'o' is pronounced differently from the others.","options":["A. social","B. local","C. source","D. mobile"],"answer":"C","explain":"Chữ 'o' trong social, local, mobile phát âm là /əʊ/, còn trong source là /ɔː/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. journalist","B. article","C. audience","D. advise"],"answer":"D","explain":"advise nhấn âm 2 (ədˈvaɪz), còn journalist, article, audience nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"We should check the ______ before believing the news.","options":["A. source","B. headline","C. advertisement","D. channel"],"answer":"A","explain":"Nên kiểm tra nguồn tin trước khi tin → source.","points":0.25},{"type":"mcq","level":"TH","q":"The journalist ______ wrote the article is famous.","options":["A. who","B. which","C. whose","D. where"],"answer":"A","explain":"Chỉ người, làm chủ ngữ → who.","points":0.25},{"type":"mcq","level":"VD","q":"She speaks three languages, ______ helps her job a lot.","options":["A. that","B. which","C. who","D. whose"],"answer":"B","explain":"'which' thay cho cả mệnh đề 'she speaks three languages'.","points":0.25},{"type":"mcq","level":"TH","q":"A: What channel is the match on? B: ______","options":["A. Channel 5 at 8 p.m.","B. I don't know.","C. Goodbye.","D. What match?"],"answer":"A","explain":"Trả lời kênh và giờ phát sóng trận đấu.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nSocial media connects billions of people. Users share photos, videos and ideas. News spreads in seconds. However, social media can be addictive. Spending too much time online harms health and study.","statements":["a) Social media connects billions.","b) News spreads in seconds.","c) Social media is never harmful.","d) Too much time online harms study."],"answer":["T","T","F","T"],"explain":"c) Sai: mạng xã hội có thể gây nghiện và có hại.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The article went ______ overnight.","answer":"viral","explain":"Bài báo lan truyền nhanh sau một đêm → go viral.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The news was ______ (bias).","answer":"biased","explain":"Cần tính từ → biased (thiên vị).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["broadcast","phát sóng"],["reporter","phóng viên"],["article","bài báo"],["press","báo chí"],["viewer","người xem"]],"explain":"broadcast = phát sóng; reporter = phóng viên; article = bài báo; press = báo chí; viewer = người xem.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["She","speaks","English","which","helps","her","job"],"explain":"She speaks English, which helps her job. (Cô ấy nói tiếng Anh, điều này giúp ích cho công việc.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"The 7 p.m. news starts with weather. Tomorrow will be sunny in the north. The south will have heavy rain. Temperatures reach 35 degrees in central Vietnam. People should drink enough water.","sub_questions":[{"q":"What will the weather be in the north?","options":["A. Sunny.","B. Rainy.","C. Cloudy.","D. Stormy."],"answer":"A"},{"q":"What should people do?","options":["A. Drink enough water.","B. Stay at home.","C. Wear warm clothes.","D. Carry umbrellas."],"answer":"A"}],"explain":"Đoạn văn nói miền Bắc nắng và mọi người nên uống đủ nước.","points":1}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'i' is pronounced differently from the others.","options":["A. viral","B. print","C. live","D. click"],"answer":"A","explain":"Chữ 'i' trong print, live, click phát âm là /ɪ/, còn trong viral là /aɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. reliable","B. viral","C. biased","D. fake"],"answer":"A","explain":"reliable nhấn âm 2 (rɪˈlaɪəbəl), còn viral, biased, fake nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"A good ______ reports truthfully and fairly.","options":["A. journalist","B. viewer","C. reader","D. singer"],"answer":"A","explain":"Nhà báo tốt đưa tin trung thực, công bằng → journalist.","points":0.25},{"type":"mcq","level":"TH","q":"The news ______ shocked us was fake.","options":["A. who","B. which","C. whose","D. where"],"answer":"B","explain":"Chỉ vật (the news), làm chủ ngữ → which.","points":0.25},{"type":"mcq","level":"VD","q":"The video went viral, ______ made the singer famous overnight.","options":["A. that","B. which","C. who","D. whose"],"answer":"B","explain":"'which' thay cho cả mệnh đề 'the video went viral'; không dùng 'that' sau dấu phẩy.","points":0.25},{"type":"mcq","level":"TH","q":"A: Can I borrow your newspaper? B: ______","options":["A. Sure, here you are.","B. No way.","C. I'm reading.","D. Goodbye."],"answer":"A","explain":"Đồng ý cho mượn báo → Sure, here you are.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nNewspapers are still popular with many readers. They give detailed news and analysis. Young people prefer reading news online. Online news is fast and free. However, print newspapers are trusted more.","statements":["a) Newspapers are still popular.","b) They give detailed news.","c) Young people prefer print newspapers.","d) Print news is trusted more."],"answer":["T","T","F","T"],"explain":"c) Sai: người trẻ thích đọc tin tức online hơn.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The ______ interviewed the president yesterday.","answer":"reporter","explain":"Phóng viên đã phỏng vấn tổng thống hôm qua → reporter.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The documentary was very ______ (inform).","answer":"informative","explain":"Cần tính từ → informative.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["mass media","truyền thông đại chúng"],["advertisement","quảng cáo"],["social media","mạng xã hội"],["source","nguồn tin"],["coverage","đưa tin"]],"explain":"mass media = truyền thông đại chúng; advertisement = quảng cáo; social media = mạng xã hội; source = nguồn tin; coverage = đưa tin.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["The","news","which","shocked","us","was","fake"],"explain":"The news which shocked us was fake. (Tin tức làm chúng tôi sốc là tin giả.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Have you seen the new documentary? B: Not yet. What's it about? A: Wildlife in Africa. B: Sounds interesting! A: It's on at 9 p.m. on Channel 3. B: I'll watch it tonight.","sub_questions":[{"q":"What is the documentary about?","options":["A. Wildlife in Africa.","B. City life.","C. History.","D. Cooking."],"answer":"A"},{"q":"When is it on?","options":["A. At 9 p.m. on Channel 3.","B. At 8 p.m. on Channel 5.","C. At 7 p.m. on Channel 1.","D. At 10 p.m. on Channel 2."],"answer":"A"}],"explain":"Hội thoại nói phim tài liệu về động vật hoang dã châu Phi, chiếu 9 giờ tối kênh 3.","points":1}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'e' is pronounced differently from the others.","options":["A. press","B. get","C. reporter","D. spread"],"answer":"C","explain":"Chữ 'e' trong press, get, spread phát âm là /e/, còn trong reporter là /ɔː/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. broadcast","B. programme","C. channel","D. transmit"],"answer":"D","explain":"transmit nhấn âm 2 (trænzˈmɪt), còn broadcast, programme, channel nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"The ______ of the match will be live at 8 p.m.","options":["A. broadcast","B. article","C. headline","D. press"],"answer":"A","explain":"Buổi phát sóng trận đấu trực tiếp lúc 8 giờ tối → broadcast.","points":0.25},{"type":"mcq","level":"TH","q":"The reporter ______ camera was stolen is angry.","options":["A. who","B. which","C. whose","D. whom"],"answer":"C","explain":"Chỉ sở hữu (camera của phóng viên) → whose.","points":0.25},{"type":"mcq","level":"VD","q":"This is the book ______ I told you about.","options":["A. who","B. where","C. that","D. whose"],"answer":"C","explain":"Chỉ vật, làm tân ngữ (có thể lược bỏ) → that/which; 'that' đúng.","points":0.25},{"type":"mcq","level":"TH","q":"A: What's on TV tonight? B: ______","options":["A. A football match at 9.","B. I don't watch TV.","C. Goodbye.","D. What a pity!"],"answer":"A","explain":"Trả lời có trận bóng đá lúc 9 giờ.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nTV news is popular with old people. They watch the 7 p.m. news every day. Young people get news from phones. Short videos are their favourite. Both groups want fast and true news.","statements":["a) Old people like TV news.","b) Young people use phones for news.","c) Young people love short videos.","d) Nobody wants true news."],"answer":["T","T","T","F"],"explain":"d) Sai: cả hai nhóm đều muốn tin nhanh và đúng.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: She read the ______ of the article first.","answer":"headline","explain":"Cô ấy đọc tiêu đề bài báo trước → headline.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The company launched a new ______ (advertise) campaign.","answer":"advertising","explain":"Cần danh từ/tính từ → advertising (quảng cáo).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["documentary","phim tài liệu"],["fake news","tin giả"],["instant","tức thì"],["reliable","đáng tin cậy"],["biased","thiên vị"]],"explain":"documentary = phim tài liệu; fake news = tin giả; instant = tức thì; reliable = đáng tin cậy; biased = thiên vị.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["This","is","the","book","that","I","bought"],"explain":"This is the book that I bought. (Đây là cuốn sách tôi đã mua.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Advertisements are everywhere. They appear on TV, websites and buses. Good ads are creative and funny. However, some ads give false information. Smart shoppers compare products before buying.","sub_questions":[{"q":"Where do ads appear?","options":["A. On TV, websites and buses.","B. Only on TV.","C. Only in newspapers.","D. Nowhere."],"answer":"A"},{"q":"What should smart shoppers do?","options":["A. Compare products before buying.","B. Buy immediately.","C. Trust all ads.","D. Ignore prices."],"answer":"A"}],"explain":"Đoạn văn nói quảng cáo ở khắp nơi và người mua thông minh so sánh sản phẩm trước khi mua.","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'a' is pronounced differently from the others.","options":["A. fake","B. mass","C. paper","D. cable"],"answer":"B","explain":"Chữ 'a' trong fake, paper, cable phát âm là /eɪ/, còn trong mass là /æ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. documentary","B. information","C. entertainment","D. radio"],"answer":"D","explain":"radio nhấn âm 1 (ˈreɪdiəʊ), còn documentary, information, entertainment nhấn âm 4.","points":0.25},{"type":"mcq","level":"TH","q":"The company spent a lot on ______ last year.","options":["A. advertisement","B. news","C. press","D. source"],"answer":"A","explain":"Công ty chi nhiều cho quảng cáo năm ngoái → advertisement.","points":0.25},{"type":"mcq","level":"TH","q":"The man ______ I met yesterday is a journalist.","options":["A. who","B. whom","C. whose","D. which"],"answer":"B","explain":"Chỉ người, làm tân ngữ → whom (cũng có thể dùng who).","points":0.25},{"type":"mcq","level":"VD","q":"The reason ______ he left is unclear.","options":["A. which","B. that","C. why","D. when"],"answer":"C","explain":"Sau 'the reason' dùng 'why' (hoặc for which).","points":0.25},{"type":"mcq","level":"TH","q":"A: Do you like documentaries? B: ______","options":["A. Yes, they're informative.","B. No, I hate films.","C. I don't know.","D. Goodbye."],"answer":"A","explain":"Trả lời thích phim tài liệu vì bổ ích.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nAdvertising helps companies sell products. Creative ads attract customers. However, some ads are misleading. They promise things that are not true. Laws control false advertising in many countries.","statements":["a) Ads help sell products.","b) Creative ads attract customers.","c) All ads tell the truth.","d) Laws control false ads."],"answer":["T","T","F","T"],"explain":"c) Sai: một số quảng cáo gây hiểu lầm.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The press conference will ______ at 10 a.m.","answer":"start","explain":"Họp báo sẽ bắt đầu lúc 10 giờ sáng → start.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The reporter gave a ______ (detail) report.","answer":"detailed","explain":"Cần tính từ → detailed.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["journalist","nhà báo"],["broadcast","phát sóng"],["source","nguồn tin"],["viral","lan truyền nhanh"],["viewer","người xem"]],"explain":"journalist = nhà báo; broadcast = phát sóng; source = nguồn tin; viral = lan truyền nhanh; viewer = người xem.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["The","reporter","whose","camera","broke","is","sad"],"explain":"The reporter whose camera broke is sad. (Phóng viên bị hỏng máy ảnh thì buồn.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Why don't you read newspapers? B: I read news on my phone. It's faster. A: But is it reliable? B: I only follow trusted websites. A: Good idea. B: Print news is too slow for me.","sub_questions":[{"q":"Where does B read news?","options":["A. On his phone.","B. In newspapers.","C. On TV.","D. On radio."],"answer":"A"},{"q":"What does B follow?","options":["A. Trusted websites.","B. Any website.","C. Funny videos.","D. Games."],"answer":"A"}],"explain":"Hội thoại nói B đọc tin trên điện thoại và chỉ theo dõi trang web đáng tin.","points":1}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ch' is pronounced differently from the others.","options":["A. channel","B. choice","C. character","D. much"],"answer":"C","explain":"'ch' trong channel, choice, much phát âm là /tʃ/, còn trong character là /k/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. publish","B. cover","C. edit","D. update"],"answer":"D","explain":"update (động từ) nhấn âm 2 (ʌpˈdeɪt), còn publish, cover, edit nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"The news ______ at 7 p.m. every day.","options":["A. is broadcast","B. broadcasts","C. broadcasted","D. is broadcasting"],"answer":"A","explain":"Tin tức được phát sóng → bị động hiện tại đơn: is broadcast.","points":0.25},{"type":"mcq","level":"TH","q":"I like the programme ______ won the award.","options":["A. who","B. which","C. whose","D. whom"],"answer":"B","explain":"Chỉ vật (programme), làm chủ ngữ → which.","points":0.25},{"type":"mcq","level":"VD","q":"She lost her keys, ______ annoyed her.","options":["A. that","B. which","C. who","D. whose"],"answer":"B","explain":"'which' thay cho cả mệnh đề 'she lost her keys'.","points":0.25},{"type":"mcq","level":"TH","q":"A: What time is the live show? B: ______","options":["A. At 8 p.m.","B. I don't know.","C. Goodbye.","D. What show?"],"answer":"A","explain":"Trả lời giờ phát sóng trực tiếp.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nDocumentaries teach us about the world. They show real people and events. Nature documentaries are very popular. Watching them is both fun and educational. Many students learn a lot from documentaries.","statements":["a) Documentaries teach about the world.","b) They show real events.","c) Nature documentaries are unpopular.","d) They are fun and educational."],"answer":["T","T","F","T"],"explain":"c) Sai: phim tài liệu thiên nhiên rất được yêu thích.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The story ______ viral on social media.","answer":"went","explain":"Câu chuyện lan truyền nhanh → went viral.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The live ______ (broadcasting) starts soon.","answer":"broadcast","explain":"'broadcast' vừa là động từ vừa là danh từ → live broadcast.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["reporter","phóng viên"],["headline","tiêu đề báo"],["press","báo chí"],["audience","khán giả"],["publish","xuất bản"]],"explain":"reporter = phóng viên; headline = tiêu đề báo; press = báo chí; audience = khán giả; publish = xuất bản.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["The","show","is","broadcast","live","tonight"],"explain":"The show is broadcast live tonight. (Chương trình được phát trực tiếp tối nay.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Podcasts are popular now. People listen while driving or exercising. There are podcasts about science, history and comedy. They are free and easy to find. Many young people prefer podcasts to radio.","sub_questions":[{"q":"When do people listen to podcasts?","options":["A. While driving or exercising.","B. While sleeping.","C. At work only.","D. In class."],"answer":"A"},{"q":"Why are podcasts popular?","options":["A. Free and easy to find.","B. Very expensive.","C. Hard to find.","D. Only for old people."],"answer":"A"}],"explain":"Đoạn văn nói mọi người nghe podcast khi lái xe, tập thể dục; chúng miễn phí, dễ tìm.","points":1}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'th' is pronounced differently from the others.","options":["A. truth","B. month","C. this","D. think"],"answer":"C","explain":"'th' trong truth, month, think phát âm là /θ/ (vô thanh), còn trong this là /ð/ (hữu thanh) nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. headline","B. viewer","C. reader","D. appear"],"answer":"D","explain":"appear nhấn âm 2 (əˈpɪə), còn headline, viewer, reader nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"Always check information from ______ sources.","options":["A. reliable","B. fake","C. biased","D. strange"],"answer":"A","explain":"Luôn kiểm tra thông tin từ nguồn đáng tin cậy → reliable.","points":0.25},{"type":"mcq","level":"TH","q":"The house ______ I was born is old.","options":["A. which","B. where","C. who","D. whose"],"answer":"B","explain":"Chỉ nơi chốn → where.","points":0.25},{"type":"mcq","level":"VD","q":"The film was boring, ______ we left early.","options":["A. that","B. which","C. who","D. whose"],"answer":"B","explain":"'which' thay cho cả mệnh đề 'the film was boring'.","points":0.25},{"type":"mcq","level":"TH","q":"A: Have you read today's paper? B: ______","options":["A. Not yet.","B. I hate papers.","C. Goodbye.","D. What paper?"],"answer":"A","explain":"Trả lời chưa đọc báo hôm nay.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nViral videos spread in hours. Funny clips are shared millions of times. Some viral stars become famous. However, fame from viral videos is often short. Real talent lasts longer.","statements":["a) Viral videos spread fast.","b) Funny clips are shared a lot.","c) Viral fame lasts forever.","d) Real talent lasts longer."],"answer":["T","T","F","T"],"explain":"c) Sai: sự nổi tiếng từ video viral thường ngắn ngủi.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The journalist is writing an ______ about the flood.","answer":"article","explain":"Nhà báo đang viết bài báo về trận lụt → article.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The website provides ______ (update) news every hour.","answer":"updated","explain":"Cần tính từ → updated (được cập nhật).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["mass media","truyền thông đại chúng"],["article","bài báo"],["social media","mạng xã hội"],["fake news","tin giả"],["instant","tức thì"]],"explain":"mass media = truyền thông đại chúng; article = bài báo; social media = mạng xã hội; fake news = tin giả; instant = tức thì.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["The","film","was","boring","which","surprised","me"],"explain":"The film was boring, which surprised me. (Phim chán, điều này làm tôi ngạc nhiên.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Let's watch the football match tonight. B: What time does it start? A: At 9 p.m. on Sports Channel. B: Is it live? A: Yes, live broadcast. B: Great! I'll bring snacks.","sub_questions":[{"q":"When does the match start?","options":["A. At 9 p.m.","B. At 8 p.m.","C. At 7 p.m.","D. At 10 p.m."],"answer":"A"},{"q":"What will B bring?","options":["A. Snacks.","B. Drinks.","C. A TV.","D. Nothing."],"answer":"A"}],"explain":"Hội thoại nói trận đấu 9 giờ tối trên kênh thể thao, phát trực tiếp; B mang đồ ăn vặt.","points":1}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ss' is pronounced differently from the others.","options":["A. mass","B. press","C. social","D. class"],"answer":"C","explain":"'ss' trong mass, press, class phát âm là /s/, còn trong social là /ʃ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. advert","B. poster","C. banner","D. promote"],"answer":"D","explain":"promote nhấn âm 2 (prəˈməʊt), còn advert, poster, banner nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"The ______ interviewed many people on the street.","options":["A. reporter","B. viewer","C. reader","D. listener"],"answer":"A","explain":"Phóng viên phỏng vấn nhiều người trên phố → reporter.","points":0.25},{"type":"mcq","level":"TH","q":"The day ______ we met was rainy.","options":["A. which","B. when","C. who","D. whose"],"answer":"B","explain":"Chỉ thời gian → when.","points":0.25},{"type":"mcq","level":"VD","q":"My phone broke down, ______ I couldn't call you.","options":["A. that","B. which","C. who","D. whose"],"answer":"B","explain":"'which' thay cho cả mệnh đề 'my phone broke down'.","points":0.25},{"type":"mcq","level":"TH","q":"A: Excuse me, where is the press room? B: ______","options":["A. On the second floor.","B. I don't know.","C. Goodbye.","D. What room?"],"answer":"A","explain":"Chỉ phòng báo chí ở tầng hai.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nPress freedom lets journalists report truthfully. In many countries, reporters can ask difficult questions. Free press helps fight corruption. However, journalists sometimes face danger. Protecting reporters is important.","statements":["a) Press freedom helps truthful reporting.","b) Reporters can ask difficult questions.","c) Free press fights corruption.","d) Journalists never face danger."],"answer":["T","T","T","F"],"explain":"d) Sai: nhà báo đôi khi đối mặt nguy hiểm.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The newspaper is ______ every morning.","answer":"published","explain":"Báo được xuất bản mỗi sáng → is published.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The audience gave the show ______ (positively) reviews.","answer":"positive","explain":"Cần tính từ → positive.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["documentary","phim tài liệu"],["advertisement","quảng cáo"],["coverage","đưa tin"],["reliable","đáng tin cậy"],["biased","thiên vị"]],"explain":"documentary = phim tài liệu; advertisement = quảng cáo; coverage = đưa tin; reliable = đáng tin cậy; biased = thiên vị.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["My","phone","broke","which","annoyed","me"],"explain":"My phone broke, which annoyed me. (Điện thoại tôi hỏng, điều này làm tôi bực.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Breaking news: a storm is coming. The storm will reach the coast tonight. People should stay indoors. Schools will close tomorrow. Fishermen must return to shore immediately.","sub_questions":[{"q":"When will the storm reach the coast?","options":["A. Tonight.","B. Tomorrow.","C. Next week.","D. Now."],"answer":"A"},{"q":"What must fishermen do?","options":["A. Return to shore.","B. Stay at sea.","C. Catch more fish.","D. Call home."],"answer":"A"}],"explain":"Tin nóng nói bão vào bờ tối nay và ngư dân phải về bờ ngay.","points":1}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ou' is pronounced differently from the others.","options":["A. source","B. proud","C. sound","D. cloud"],"answer":"A","explain":"'ou' trong proud, sound, cloud phát âm là /aʊ/, còn trong source là /ɔː/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. influence","B. spread","C. comment","D. discuss"],"answer":"D","explain":"discuss nhấn âm 2 (dɪˈskʌs), còn influence, spread, comment (danh từ) nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"The TV ______ includes news, films and sports.","options":["A. coverage","B. article","C. headline","D. press"],"answer":"A","explain":"Đưa tin truyền hình gồm tin tức, phim, thể thao → coverage.","points":0.25},{"type":"mcq","level":"TH","q":"The girl ______ bag was stolen reported to the police.","options":["A. who","B. whose","C. which","D. whom"],"answer":"B","explain":"Chỉ sở hữu (túi của cô gái) → whose.","points":0.25},{"type":"mcq","level":"VD","q":"He works hard, ______ his parents are proud.","options":["A. that","B. which","C. who","D. whose"],"answer":"B","explain":"'which' thay cho cả mệnh đề 'he works hard'.","points":0.25},{"type":"mcq","level":"TH","q":"A: What do you think of this ad? B: ______","options":["A. It's creative and funny.","B. I hate ads.","C. I don't know.","D. Goodbye."],"answer":"A","explain":"Nhận xét quảng cáo sáng tạo và hài hước.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nOnline news is fast and convenient. We can read it on phones anywhere. Many websites are free. However, some online news is unreliable. Readers should compare different sources.","statements":["a) Online news is fast.","b) We can read it anywhere.","c) All online news is reliable.","d) Compare different sources."],"answer":["T","T","F","T"],"explain":"c) Sai: một số tin online không đáng tin.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The film ______ at 8 p.m. yesterday.","answer":"started","explain":"Phim bắt đầu lúc 8 giờ tối qua → started.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: She is a ______ (profession) journalist.","answer":"professional","explain":"Cần tính từ → professional.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["journalist","nhà báo"],["article","bài báo"],["source","nguồn tin"],["documentary","phim tài liệu"],["press","báo chí"]],"explain":"journalist = nhà báo; article = bài báo; source = nguồn tin; documentary = phim tài liệu; press = báo chí.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["He","works","hard","which","helps","his","family"],"explain":"He works hard, which helps his family. (Anh ấy làm việc chăm chỉ, điều này giúp gia đình anh ấy.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Did you share that shocking post? B: No, I checked first. It was fake news. A: Good! Many people shared it. B: We should always check the source. A: You're right.","sub_questions":[{"q":"What did B do before sharing?","options":["A. Checked first.","B. Shared immediately.","C. Deleted it.","D. Ignored it."],"answer":"A"},{"q":"What was the post?","options":["A. Fake news.","B. True news.","C. An ad.","D. A joke."],"answer":"A"}],"explain":"Hội thoại nói B kiểm tra trước khi chia sẻ và bài đăng là tin giả.","points":1}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'oo' is pronounced differently from the others.","options":["A. book","B. look","C. good","D. soon"],"answer":"D","explain":"'oo' trong book, look, good phát âm là /ʊ/, còn trong soon là /uː/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. instant","B. modern","C. global","D. online"],"answer":"D","explain":"online nhấn âm 2 (ˌɒnˈlaɪn), còn instant, modern, global nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"Millions of ______ watch the World Cup final.","options":["A. viewers","B. journalists","C. reporters","D. readers"],"answer":"A","explain":"Hàng triệu người xem theo dõi chung kết World Cup → viewers.","points":0.25},{"type":"mcq","level":"TH","q":"The book ______ I am reading is interesting.","options":["A. who","B. which","C. whose","D. whom"],"answer":"B","explain":"Chỉ vật (the book) → which.","points":0.25},{"type":"mcq","level":"VD","q":"The team won the match, ______ delighted the fans.","options":["A. that","B. which","C. who","D. whose"],"answer":"B","explain":"'which' thay cho cả mệnh đề 'the team won the match'.","points":0.25},{"type":"mcq","level":"TH","q":"A: Let's watch the news together. B: ______","options":["A. Good idea.","B. No way.","C. I'm busy.","D. Goodbye."],"answer":"A","explain":"Đồng ý xem tin tức cùng nhau → Good idea.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nMedia literacy means understanding media messages. Students learn to question what they see. They check who made the message and why. This skill protects them from fake news. Schools should teach media literacy.","statements":["a) Media literacy means understanding messages.","b) Students question what they see.","c) It protects from fake news.","d) Schools should not teach it."],"answer":["T","T","T","F"],"explain":"d) Sai: trường học nên dạy kỹ năng hiểu biết
