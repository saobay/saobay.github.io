<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'a' is pronounced differently from the others.","options":["A. admire","B. ancient","C. famous","D. bravery"],"answer":"A","explain":"Chữ 'a' trong ancient, famous, bravery phát âm là /eɪ/, còn trong admire là /ə/ (ədˈmaɪə) nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. admire","B. famous","C. courage","D. legend"],"answer":"A","explain":"admire nhấn âm 2 (ədˈmaɪə), còn famous, courage, legend nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"Her ______ to overcome poverty inspired millions of people.","options":["A. achievement","B. determination","C. legend","D. honour"],"answer":"B","explain":"determination (sự quyết tâm) vượt qua nghèo khó — hợp nghĩa nhất.","points":0.25},{"type":"mcq","level":"TH","q":"I ______ a biography of Marie Curie when you called me last night.","options":["A. read","B. was reading","C. have read","D. am reading"],"answer":"B","explain":"Hành động đang diễn ra (đọc sách) bị hành động ngắn xen vào (bạn gọi) → quá khứ tiếp diễn.","points":0.25},{"type":"mcq","level":"VD","q":"While the audience ______, the speaker walked onto the stage.","options":["A. applauded","B. was applauding","C. applauds","D. had applauded"],"answer":"B","explain":"Khán giả đang vỗ tay (hành động dài, làm nền) khi diễn giả bước lên (hành động ngắn) → was applauding.","points":0.25},{"type":"mcq","level":"TH","q":"A: Who do you admire most? B: ______","options":["A. I really admire Nguyen Ngoc Ky for his perseverance.","B. I do not know anything.","C. What time is it?","D. Never mind."],"answer":"A","explain":"Hỏi ngưỡng mộ ai → trả lời tên người mình ngưỡng mộ và lý do.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nMarie Curie was born in Poland in 1867. She moved to France to study science. She discovered radium and polonium with her husband Pierre. She won the Nobel Prize twice, in Physics and Chemistry. She died in 1934.","statements":["a) Marie Curie was born in France.","b) She discovered radium and polonium.","c) She won the Nobel Prize twice.","d) She died in 1934."],"answer":["F","T","T","T"],"explain":"a) Sai: bà sinh ở Ba Lan. b) Đúng. c) Đúng: Vật lý và Hóa học. d) Đúng.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Thomas Edison is famous for his many ______.","answer":"inventions","explain":"Edison nổi tiếng với nhiều phát minh → inventions.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: Her ______ (dedicate) to teaching changed many lives.","answer":"dedication","explain":"Sau tính từ sở hữu 'her' cần danh từ → dedication.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["admire","ngưỡng mộ"],["courage","lòng dũng cảm"],["hardship","gian khổ"],["legend","huyền thoại"],["inspire","truyền cảm hứng"]],"explain":"admire = ngưỡng mộ; courage = lòng dũng cảm; hardship = gian khổ; legend = huyền thoại; inspire = truyền cảm hứng.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["She","was","admired","for","her","courage"],"explain":"Câu bị động quá khứ đơn: She was admired for her courage. (Cô ấy được ngưỡng mộ vì lòng dũng cảm.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Nguyen Ngoc Ky lost the use of his arms at the age of four. He learnt to write with his feet. He studied very hard and became one of the best students in his school. Later, he became a teacher. His students love him because he never gives up.","sub_questions":[{"q":"What happened to Nguyen Ngoc Ky when he was four?","options":["A. He lost his legs.","B. He lost the use of his arms.","C. He moved to a new school.","D. He stopped studying."],"answer":"B"},{"q":"Why do his students love him?","options":["A. Because he is rich.","B. Because he is famous.","C. Because he never gives up.","D. Because he is funny."],"answer":"C"}],"explain":"Đoạn văn nói Ky mất khả năng dùng tay lúc 4 tuổi và học sinh yêu quý ông vì ông không bao giờ bỏ cuộc.","points":1}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'o' is pronounced differently from the others.","options":["A. overcome","B. honour","C. role","D. noble"],"answer":"B","explain":"Chữ 'o' trong overcome, role, noble phát âm là /əʊ/, còn trong honour là /ɒ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. overcome","B. inspire","C. respect","D. achieve"],"answer":"A","explain":"overcome nhấn âm 3 (ˌəʊvəˈkʌm), còn inspire, respect, achieve nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"She showed great ______ when she donated all her prize money to charity.","options":["A. courage","B. generosity","C. hardship","D. biography"],"answer":"B","explain":"Hiến tặng tiền thưởng cho từ thiện thể hiện sự hào phóng → generosity.","points":0.25},{"type":"mcq","level":"TH","q":"They ______ the museum at 9 a.m. yesterday.","options":["A. were visiting","B. visited","C. visit","D. have visited"],"answer":"B","explain":"Hành động đã hoàn tất với mốc thời gian cụ thể trong quá khứ → quá khứ đơn.","points":0.25},{"type":"mcq","level":"VD","q":"While she ______ for the exam, her brother ______ video games.","options":["A. was studying / played","B. studied / was playing","C. was studying / was playing","D. studied / played"],"answer":"C","explain":"Hai hành động cùng đang diễn ra song song trong quá khứ → cả hai đều dùng quá khứ tiếp diễn.","points":0.25},{"type":"mcq","level":"TH","q":"A: Have you read the biography of Steve Jobs? B: ______","options":["A. Yes, it is really inspiring.","B. I do not like books.","C. What did you say?","D. See you later."],"answer":"A","explain":"Hỏi đã đọc tiểu sử chưa → trả lời đã đọc và nhận xét.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nHelen Keller was born in the USA in 1880. She became deaf and blind when she was nineteen months old. With the help of her teacher Anne Sullivan, she learnt to read, write and speak. She graduated from college and became a famous writer. Her story inspires disabled people around the world.","statements":["a) Helen Keller was born deaf and blind.","b) Anne Sullivan was her teacher.","c) She graduated from college.","d) Her story inspires disabled people."],"answer":["F","T","T","T"],"explain":"a) Sai: bà bị điếc và mù lúc 19 tháng tuổi, không phải từ khi sinh.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: She is a ______ model for young people.","answer":"role","explain":"Cụm từ cố định: role model (tấm gương).","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: He was ______ (honour) with a medal for his bravery.","answer":"honoured","explain":"Câu bị động quá khứ đơn: was honoured (được vinh danh).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["biography","tiểu sử"],["overcome","vượt qua"],["perseverance","sự kiên trì"],["generous","hào phóng"],["milestone","cột mốc"]],"explain":"biography = tiểu sử; overcome = vượt qua; perseverance = sự kiên trì; generous = hào phóng; milestone = cột mốc.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["They","overcame","many","hardships","to","succeed"],"explain":"They overcame many hardships to succeed. (Họ đã vượt qua nhiều gian khổ để thành công.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Have you heard about Malala Yousafzai? B: Yes, she is the young woman from Pakistan. A: Right. She fought for girls' right to go to school. B: She even won the Nobel Peace Prize in 2014. A: She is really brave. B: I agree. She inspires millions of girls.","sub_questions":[{"q":"What did Malala fight for?","options":["A. Women's right to vote.","B. Girls' right to go to school.","C. Children's right to play.","D. Workers' rights."],"answer":"B"},{"q":"When did she win the Nobel Peace Prize?","options":["A. In 2012.","B. In 2013.","C. In 2014.","D. In 2015."],"answer":"C"}],"explain":"Hội thoại nói Malala đấu tranh cho quyền đi học của bé gái và đoạt Nobel Hòa bình năm 2014.","points":1}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'i' is pronounced differently from the others.","options":["A. inspire","B. resilient","C. influence","D. dignity"],"answer":"A","explain":"Chữ 'i' trong resilient, influence, dignity phát âm là /ɪ/, còn trong inspire là /aɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. biography","B. achievement","C. courage","D. honour"],"answer":"A","explain":"biography nhấn âm 3 (baɪˈɒɡrəfi), còn achievement nhấn âm 2, courage và honour nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"Nelson Mandela is a ______ of peace and freedom.","options":["A. legend","B. hardship","C. biography","D. milestone"],"answer":"A","explain":"Mandela là một huyền thoại của hòa bình và tự do → legend.","points":0.25},{"type":"mcq","level":"TH","q":"While he ______ his speech, the audience listened silently.","options":["A. gave","B. was giving","C. gives","D. had given"],"answer":"B","explain":"Hành động dài đang diễn ra (phát biểu) làm nền → quá khứ tiếp diễn.","points":0.25},{"type":"mcq","level":"VD","q":"Choose the correct sentence.","options":["A. I was reading when he was coming.","B. I read when he came.","C. I was reading when he came.","D. I read when he was coming."],"answer":"C","explain":"Hành động dài (đọc sách) dùng quá khứ tiếp diễn, hành động ngắn xen vào (anh ấy đến) dùng quá khứ đơn.","points":0.25},{"type":"mcq","level":"TH","q":"A: What inspires you most about her? B: ______","options":["A. Her courage in difficult times.","B. She is very tall.","C. I do not care.","D. Goodbye."],"answer":"A","explain":"Hỏi điều gì truyền cảm hứng → trả lời phẩm chất đáng ngưỡng mộ.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nThomas Edison was born in 1847 in the USA. He only went to school for three months. He educated himself at home and became a great inventor. He invented the light bulb and held more than 1,000 patents. He worked very hard, sometimes 20 hours a day.","statements":["a) Edison went to school for a long time.","b) He invented the light bulb.","c) He held more than 1,000 patents.","d) He was a lazy worker."],"answer":["F","T","T","F"],"explain":"a) Sai: chỉ học ở trường 3 tháng. d) Sai: ông làm việc rất chăm chỉ.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: His life story is a great source of ______.","answer":"inspiration","explain":"Câu chuyện cuộc đời là nguồn cảm hứng lớn → inspiration.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The ______ (achieve) of the team surprised everyone.","answer":"achievement","explain":"Sau mạo từ 'the' cần danh từ → achievement (thành tựu).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["dedicated","tận tụy"],["determination","sự quyết tâm"],["contribution","sự đóng góp"],["influence","ảnh hưởng"],["resilient","kiên cường"]],"explain":"dedicated = tận tụy; determination = sự quyết tâm; contribution = sự đóng góp; influence = ảnh hưởng; resilient = kiên cường.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Her","perseverance","inspired","many","students"],"explain":"Her perseverance inspired many students. (Sự kiên trì của cô ấy đã truyền cảm hứng cho nhiều học sinh.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Beethoven was a famous German composer. He started losing his hearing in his late twenties. By the time he was 44, he was almost completely deaf. However, he continued to compose wonderful music. His Ninth Symphony is one of the greatest pieces of music ever written.","sub_questions":[{"q":"When did Beethoven start losing his hearing?","options":["A. In his teens.","B. In his late twenties.","C. At the age of 44.","D. When he was a child."],"answer":"B"},{"q":"What is said about his Ninth Symphony?","options":["A. It was his first work.","B. It was never finished.","C. It is one of the greatest pieces of music.","D. It was written for children."],"answer":"C"}],"explain":"Đoạn văn nói Beethoven bắt đầu mất thính giác cuối tuổi 20 và Bản giao hưởng số 9 là một trong những tác phẩm vĩ đại nhất.","points":1}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'e' is pronounced differently from the others.","options":["A. legend","B. dedicated","C. generous","D. perseverance"],"answer":"D","explain":"Chữ 'e' trong legend, dedicated, generous phát âm là /e/, còn chữ 'e' đầu trong perseverance là /ɜː/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. dedicated","B. generous","C. resilient","D. legend"],"answer":"C","explain":"resilient nhấn âm 2 (rɪˈzɪliənt), còn dedicated, generous, legend nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"He received a medal in ______ of his bravery.","options":["A. honour","B. hardship","C. legacy","D. influence"],"answer":"A","explain":"Cụm từ: in honour of (để tôn vinh).","points":0.25},{"type":"mcq","level":"TH","q":"At this time yesterday, we ______ a documentary about Walt Disney.","options":["A. watched","B. were watching","C. watch","D. have watched"],"answer":"B","explain":"Hành động đang diễn ra tại một thời điểm cụ thể trong quá khứ → quá khứ tiếp diễn.","points":0.25},{"type":"mcq","level":"VD","q":"______ courage she showed impressed everyone.","options":["A. A","B. An","C. The","D. Ø (no article)"],"answer":"C","explain":"Lòng dũng cảm mà cô ấy thể hiện đã được xác định cụ thể → dùng 'the'.","points":0.25},{"type":"mcq","level":"TH","q":"A: I think J.K. Rowling's story is amazing. B: ______","options":["A. I agree. She never gave up.","B. I hate reading books.","C. What a pity!","D. No problem."],"answer":"A","explain":"Đồng tình với nhận xét → I agree + bổ sung lý do.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nWalt Disney was born in 1901 in Chicago. As a young man, he was fired from a newspaper for lacking creativity. He did not give up. He created Mickey Mouse and founded the Disney company. Today, Disney is one of the most famous entertainment companies in the world.","statements":["a) Walt Disney was born in Chicago.","b) He was fired for lacking creativity.","c) He created Mickey Mouse.","d) He gave up after being fired."],"answer":["T","T","T","F"],"explain":"d) Sai: ông đã không bỏ cuộc sau khi bị sa thải.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Walt Disney ______ many failures before succeeding.","answer":"overcame","explain":"Disney đã vượt qua nhiều thất bại → overcame (quá khứ của overcome).","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: She spoke ______ (courage) about her difficult childhood.","answer":"courageously","explain":"Bổ nghĩa cho động từ 'spoke' cần trạng từ → courageously.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["selfless","vị tha"],["legacy","di sản"],["honour","vinh dự"],["milestone","cột mốc"],["role model","tấm gương"]],"explain":"selfless = vị tha; legacy = di sản; honour = vinh dự; milestone = cột mốc; role model = tấm gương.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["He","is","honoured","for","his","contribution"],"explain":"He is honoured for his contribution. (Anh ấy được vinh danh vì sự đóng góp của mình.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Stephen Hawking was a brilliant British scientist. At the age of 21, he developed a serious disease and could not walk or speak clearly. He communicated using a computer. Despite his disability, he made great discoveries about the universe. He wrote the famous book A Brief History of Time.","sub_questions":[{"q":"What happened to Hawking at 21?","options":["A. He won a prize.","B. He developed a serious disease.","C. He moved to America.","D. He stopped studying."],"answer":"B"},{"q":"How did he communicate?","options":["A. By writing letters.","B. Through his family.","C. Using a computer.","D. With sign language."],"answer":"C"}],"explain":"Đoạn văn nói Hawking mắc bệnh nặng lúc 21 tuổi và giao tiếp bằng máy tính.","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'u' is pronounced differently from the others.","options":["A. courage","B. contribution","C. publish","D. suffer"],"answer":"B","explain":"Chữ 'u' trong courage, publish, suffer phát âm là /ʌ/, còn trong contribution là /uː/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. perseverance","B. determination","C. contribution","D. influence"],"answer":"D","explain":"perseverance, determination, contribution nhấn âm 4, còn influence nhấn âm 1 (ˈɪnfluəns).","points":0.25},{"type":"mcq","level":"TH","q":"Her ______ will live on for generations.","options":["A. legacy","B. hardship","C. courage","D. biography"],"answer":"A","explain":"Di sản của bà sẽ còn mãi với các thế hệ → legacy.","points":0.25},{"type":"mcq","level":"TH","q":"When I arrived, they ______ about his achievements.","options":["A. talked","B. were talking","C. talk","D. have talked"],"answer":"B","explain":"Hành động đang diễn ra (nói chuyện) khi hành động ngắn xen vào (tôi đến) → quá khứ tiếp diễn.","points":0.25},{"type":"mcq","level":"VD","q":"He plays ______ important role in the community.","options":["A. a","B. an","C. the","D. Ø (no article)"],"answer":"B","explain":"'important' bắt đầu bằng nguyên âm /ɪ/ → dùng 'an'.","points":0.25},{"type":"mcq","level":"TH","q":"A: Would you like to join our volunteer club? B: ______","options":["A. Sure, I'd love to.","B. I do not want to.","C. Maybe I will not.","D. What did you say?"],"answer":"A","explain":"Nhận lời mời một cách lịch sự → Sure, I'd love to.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nNelson Mandela was born in South Africa in 1918. He fought against racial discrimination for many years. He spent 27 years in prison. In 1994, he became the first black president of South Africa. He won the Nobel Peace Prize in 1993.","statements":["a) Mandela fought against racial discrimination.","b) He spent 27 years in prison.","c) He became president in 1993.","d) He won the Nobel Peace Prize."],"answer":["T","T","F","T"],"explain":"c) Sai: ông trở thành tổng thống năm 1994, còn Nobel Hòa bình là năm 1993.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The teacher's ______ changed the lives of many poor children.","answer":"dedication","explain":"Sự tận tụy của cô giáo đã thay đổi cuộc đời nhiều trẻ em nghèo → dedication.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: His story is really ______ (inspire).","answer":"inspiring","explain":"Sau 'is' + trạng từ 'really' cần tính từ → inspiring (truyền cảm hứng).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["overcome","vượt qua"],["inspire","truyền cảm hứng"],["courage","lòng dũng cảm"],["hardship","gian khổ"],["legend","huyền thoại"]],"explain":"overcome = vượt qua; inspire = truyền cảm hứng; courage = lòng dũng cảm; hardship = gian khổ; legend = huyền thoại.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Determination","helped","her","overcome","hardship"],"explain":"Determination helped her overcome hardship. (Sự quyết tâm đã giúp cô ấy vượt qua gian khổ.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Nick Vujicic was born without arms and legs. As a child, he felt hopeless. However, he learnt to swim, surf and play football. Now he travels around the world giving talks. He tells people never to give up on their dreams.","sub_questions":[{"q":"What is special about Nick Vujicic?","options":["A. He was born without arms and legs.","B. He cannot speak.","C. He is blind.","D. He is deaf."],"answer":"A"},{"q":"What does he do now?","options":["A. He works as a doctor.","B. He travels giving talks.","C. He stays at home.","D. He teaches swimming."],"answer":"B"}],"explain":"Đoạn văn nói Nick sinh ra không có tay chân và hiện đi khắp thế giới diễn thuyết.","points":1}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ea' is pronounced differently from the others.","options":["A. achievement","B. dream","C. great","D. leader"],"answer":"C","explain":"'ea' trong achievement, dream, leader phát âm là /iː/, còn trong great là /eɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. hardship","B. milestone","C. selfless","D. devote"],"answer":"D","explain":"devote nhấn âm 2 (dɪˈvəʊt), còn hardship, milestone, selfless nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"The ______ scientist devoted her life to research.","options":["A. dedicated","B. generous","C. selfless","D. resilient"],"answer":"A","explain":"Nhà khoa học tận tụy cống hiến đời mình cho nghiên cứu → dedicated.","points":0.25},{"type":"mcq","level":"TH","q":"While I ______ home, it started to rain.","options":["A. walked","B. was walking","C. walk","D. had walked"],"answer":"B","explain":"Hành động đang diễn ra (đi bộ về) bị xen vào (trời mưa) → quá khứ tiếp diễn.","points":0.25},{"type":"mcq","level":"VD","q":"Choose the correct sentence.","options":["A. When I was arriving, they left.","B. When I arrived, they were leaving.","C. When I arrived, they leave.","D. When I was arriving, they were leaving."],"answer":"B","explain":"Hành động ngắn (tôi đến) dùng quá khứ đơn, hành động dài đang diễn ra (họ đang rời đi) dùng quá khứ tiếp diễn.","points":0.25},{"type":"mcq","level":"TH","q":"A: Let's pay tribute to our teachers on Vietnamese Teachers' Day. B: ______","options":["A. Good idea!","B. No way.","C. I disagree.","D. Never."],"answer":"A","explain":"Hưởng ứng đề xuất → Good idea!","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nJ.K. Rowling is the author of the Harry Potter books. Before she became famous, she was a poor single mother. Twelve publishers rejected her first book. She kept trying until one publisher accepted it. Today, her books have sold hundreds of millions of copies.","statements":["a) Rowling was rich before she became famous.","b) Twelve publishers rejected her first book.","c) She gave up after the rejections.","d) Her books have sold very well."],"answer":["F","T","F","T"],"explain":"a) Sai: bà từng là bà mẹ đơn thân nghèo. c) Sai: bà kiên trì đến khi được chấp nhận.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: She never gave ______ despite many rejections.","answer":"up","explain":"Cụm từ: give up (từ bỏ).","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: We admire him for his ______ (generous).","answer":"generosity","explain":"Sau tính từ sở hữu 'his' cần danh từ → generosity (sự hào phóng).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["biography","tiểu sử"],["perseverance","sự kiên trì"],["dedicated","tận tụy"],["influence","ảnh hưởng"],["milestone","cột mốc"]],"explain":"biography = tiểu sử; perseverance = sự kiên trì; dedicated = tận tụy; influence = ảnh hưởng; milestone = cột mốc.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["We","should","follow","in","her","footsteps"],"explain":"We should follow in her footsteps. (Chúng ta nên noi gương cô ấy.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Marie Curie is one of the most admired scientists in history. She was the first woman to win a Nobel Prize. In fact, she won it twice. She discovered two new elements, radium and polonium. She worked in very difficult conditions but never gave up her research.","sub_questions":[{"q":"How many Nobel Prizes did Marie Curie win?","options":["A. One.","B. Two.","C. Three.","D. None."],"answer":"B"},{"q":"Which elements did she discover?","options":["A. Oxygen and hydrogen.","B. Radium and polonium.","C. Gold and silver.","D. Iron and copper."],"answer":"B"}],"explain":"Đoạn văn nói Curie đoạt 2 giải Nobel và phát hiện radium, polonium.","points":1}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ch' is pronounced differently from the others.","options":["A. achievement","B. character","C. choice","D. challenge"],"answer":"B","explain":"'ch' trong achievement, choice, challenge phát âm là /tʃ/, còn trong character là /k/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. inspire","B. admire","C. honour","D. respect"],"answer":"C","explain":"honour nhấn âm 1 (ˈɒnə), còn inspire, admire, respect nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"His ______ acts saved many lives during the flood.","options":["A. selfless","B. generous","C. dedicated","D. resilient"],"answer":"A","explain":"Hành động vị tha đã cứu nhiều mạng người → selfless.","points":0.25},{"type":"mcq","level":"TH","q":"She ______ for the charity while her friends were selling tickets.","options":["A. sang","B. was singing","C. sings","D. had sung"],"answer":"B","explain":"Hai hành động song song trong quá khứ; hành động dài → quá khứ tiếp diễn.","points":0.25},{"type":"mcq","level":"VD","q":"______ life of Marie Curie inspires many young scientists.","options":["A. A","B. An","C. The","D. Ø (no article)"],"answer":"C","explain":"Cuộc đời của Marie Curie đã xác định → dùng 'the'.","points":0.25},{"type":"mcq","level":"TH","q":"A: Do you know much about Beethoven? B: ______","options":["A. A little. He composed music even after losing his hearing.","B. No, I do not like music at all.","C. Sorry, I am busy now.","D. What did you ask?"],"answer":"A","explain":"Trả lời câu hỏi về Beethoven bằng thông tin đúng.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nMalala Yousafzai is a young activist from Pakistan. She spoke up for girls' right to education. In 2012, she survived an attack by extremists. She continued her campaign and won the Nobel Peace Prize in 2014. She is the youngest Nobel laureate in history.","statements":["a) Malala is from Pakistan.","b) She fought for girls' education.","c) She won the Nobel Peace Prize in 2012.","d) She is the youngest Nobel laureate."],"answer":["T","T","F","T"],"explain":"c) Sai: bà đoạt giải năm 2014, còn vụ tấn công là năm 2012.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Hard work and ______ lead to success.","answer":"perseverance","explain":"Chăm chỉ và kiên trì dẫn đến thành công → perseverance.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The audience was deeply ______ (inspire) by his speech.","answer":"inspired","explain":"Câu bị động: was inspired (được truyền cảm hứng).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["determination","sự quyết tâm"],["contribution","sự đóng góp"],["resilient","kiên cường"],["selfless","vị tha"],["honour","vinh dự"]],"explain":"determination = sự quyết tâm; contribution = sự đóng góp; resilient = kiên cường; selfless = vị tha; honour = vinh dự.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["His","courage","inspired","the","whole","nation"],"explain":"His courage inspired the whole nation. (Lòng dũng cảm của ông đã truyền cảm hứng cho cả dân tộc.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Helen Keller lost her sight and hearing before she was two years old. Her teacher, Anne Sullivan, taught her to communicate by spelling words into her hand. Keller learnt to read Braille and even graduated from college. She became a writer and travelled the world helping disabled people.","sub_questions":[{"q":"How did Anne Sullivan teach Keller to communicate?","options":["A. By drawing pictures.","B. By spelling words into her hand.","C. By using a computer.","D. By singing songs."],"answer":"B"},{"q":"What did Keller do later in life?","options":["A. She became a writer helping disabled people.","B. She became a doctor.","C. She stopped studying.","D. She moved to France."],"answer":"A"}],"explain":"Đoạn văn nói Sullivan dạy Keller bằng cách đánh vần vào lòng bàn tay và sau này Keller thành nhà văn giúp người khuyết tật.","points":1}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ed' is pronounced differently from the others.","options":["A. admired","B. inspired","C. respected","D. devoted"],"answer":"B","explain":"'ed' trong admired, respected, devoted phát âm là /ɪd/, còn trong inspired là /d/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. legacy","B. legend","C. talent","D. success"],"answer":"D","explain":"success nhấn âm 2 (səkˈses), còn legacy, legend, talent nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"They built a school in ______ of the great teacher.","options":["A. honour","B. legacy","C. hardship","D. courage"],"answer":"A","explain":"Cụm từ: in honour of (để tôn vinh).","points":0.25},{"type":"mcq","level":"TH","q":"He ______ football when he broke his leg.","options":["A. played","B. was playing","C. plays","D. had played"],"answer":"B","explain":"Hành động đang diễn ra (đá bóng) bị xen vào (gãy chân) → quá khứ tiếp diễn.","points":0.25},{"type":"mcq","level":"VD","q":"Choose the correct sentence.","options":["A. She was cooking while he was setting the table.","B. She cooked while he was setting the table.","C. She was cooking while he set the table.","D. She cooks while he sets the table."],"answer":"A","explain":"Hai hành động cùng đang diễn ra song song trong quá khứ → cả hai dùng quá khứ tiếp diễn.","points":0.25},{"type":"mcq","level":"TH","q":"A: I'm writing an essay about my role model. B: ______","options":["A. Good luck! Who is your role model?","B. I do not care about it.","C. Stop writing now.","D. Whatever you like."],"answer":"A","explain":"Động viên và hỏi tiếp về tấm gương của bạn → Good luck! Who is your role model?","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nBeethoven was born in Germany in 1770. He began losing his hearing in his late twenties. When he was 44, he could hardly hear anything. Despite this, he composed some of the greatest music in history, including the Ninth Symphony. He died in 1827.","statements":["a) Beethoven was born in Germany.","b) He lost his hearing completely as a child.","c) He composed the Ninth Symphony.","d) He stopped composing after losing his hearing."],"answer":["T","F","T","F"],"explain":"b) Sai: ông bắt đầu mất thính giác cuối tuổi 20. d) Sai: ông vẫn tiếp tục sáng tác.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: She is admired ______ her kindness.","answer":"for","explain":"Cụm từ: be admired for (được ngưỡng mộ vì).","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: His ______ (persevere) finally paid off.","answer":"perseverance","explain":"Sau tính từ sở hữu 'his' cần danh từ → perseverance (sự kiên trì).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["achievement","thành tựu"],["influence","ảnh hưởng"],["legacy","di sản"],["selfless","vị tha"],["honour","vinh dự"]],"explain":"achievement = thành tựu; influence = ảnh hưởng; legacy = di sản; selfless = vị tha; honour = vinh dự.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["They","paid","tribute","to","the","hero"],"explain":"They paid tribute to the hero. (Họ đã tỏ lòng tôn kính với người anh hùng.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Thomas Edison tried thousands of materials for the light bulb. People said he failed many times, but he said he found thousands of ways that did not work. In 1879, he finally succeeded. His hard work gave the world electric light. He held more than 1,000 patents in his lifetime.","sub_questions":[{"q":"What did Edison say about his failures?","options":["A. He never failed.","B. He found thousands of ways that did not work.","C. He gave up quickly.","D. He copied others."],"answer":"B"},{"q":"When did he succeed with the light bulb?","options":["A. In 1878.","B. In 1879.","C. In 1880.","D. In 1881."],"answer":"B"}],"explain":"Đoạn văn nói Edison coi thất bại là tìm ra hàng nghìn cách không hiệu quả và thành công năm 1879.","points":1}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'gh' is pronounced differently from the others.","options":["A. thought","B. through","C. laugh","D. high"],"answer":"C","explain":"'gh' trong thought, through, high là âm câm, còn trong laugh phát âm là /f/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. overcome","B. determine","C. inspire","D. devote"],"answer":"A","explain":"overcome nhấn âm 3 (ˌəʊvəˈkʌm), còn determine, inspire, devote nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"The charity's ______ to poor villages is admirable.","options":["A. contribution","B. hardship","C. legend","D. biography"],"answer":"A","explain":"Sự đóng góp của tổ chức từ thiện cho làng nghèo thật đáng khâm phục → contribution.","points":0.25},{"type":"mcq","level":"TH","q":"The lights ______ out while we were watching the film.","options":["A. went","B. were going","C. go","D. had gone"],"answer":"A","explain":"Hành động ngắn xen vào (đèn tắt) → quá khứ đơn.","points":0.25},{"type":"mcq","level":"VD","q":"______ poor need our help.","options":["A. A","B. An","C. The","D. Ø (no article)"],"answer":"C","explain":"'the + tính từ' chỉ một nhóm người nói chung: the poor (người nghèo).","points":0.25},{"type":"mcq","level":"TH","q":"A: Thank you for telling me about her inspiring story. B: ______","options":["A. You're welcome.","B. I'm fine, thanks.","C. Goodbye.","D. See you soon."],"answer":"A","explain":"Đáp lại lời cảm ơn → You're welcome.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nStephen Hawking was born in England in 1942. At 21, he developed a serious illness that paralysed him. He could only move his fingers and later just his cheek muscle. Using a computer, he wrote books about the universe. A Brief History of Time made him famous worldwide.","statements":["a) Hawking was born in England.","b) His illness appeared when he was 21.","c) He could move his whole body.","d) He wrote A Brief History of Time."],"answer":["T","T","F","T"],"explain":"c) Sai: ông chỉ cử động được ngón tay, sau này chỉ còn cơ má.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: She became a ______ model for girls everywhere.","answer":"role","explain":"Cụm từ: role model (tấm gương).","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: He faced every difficulty with great ______ (courageous).","answer":"courage","explain":"Sau tính từ 'great' cần danh từ → courage (lòng dũng cảm).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["courage","lòng dũng cảm"],["inspire","truyền cảm hứng"],["perseverance","sự kiên trì"],["dedicated","tận tụy"],["generous","hào phóng"]],"explain":"courage = lòng dũng cảm; inspire = truyền cảm hứng; perseverance = sự kiên trì; dedicated = tận tụy; generous = hào phóng.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["She","never","gave","up","on","her","dream"],"explain":"She never gave up on her dream. (Cô ấy không bao giờ từ bỏ ước mơ của mình.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Walt Disney's first cartoon company failed. He moved to Hollywood with very little money. He created Mickey Mouse in 1928, and the character became a huge success. Later he built Disneyland, the famous theme park. His dream was to make people happy.","sub_questions":[{"q":"What happened to Disney's first company?","options":["A. It was very successful.","B. It failed.","C. It was sold.","D. It moved to Europe."],"answer":"B"},{"q":"When did he create Mickey Mouse?","options":["A. In 1928.","B. In 1938.","C. In 1948.","D. In 1958."],"answer":"A"}],"explain":"Đoạn văn nói công ty đầu tiên của Disney thất bại và ông tạo ra chuột Mickey năm 1928.","points":1}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'oo' is pronounced differently from the others.","options":["A. book","B. look","C. school","D. good"],"answer":"C","explain":"'oo' trong book, look, good phát âm là /ʊ/, còn trong school là /uː/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. famous","B. courage","C. noble","D. sincere"],"answer":"D","explain":"sincere nhấn âm 2 (sɪnˈsɪə), còn famous, courage, noble nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"The students ______ their teacher for her dedication.","options":["A. admire","B. overcome","C. forget","D. ignore"],"answer":"A","explain":"Học sinh ngưỡng mộ cô giáo vì sự tận tụy → admire.","points":0.25},{"type":"mcq","level":"TH","q":"While they ______ the project, the teacher came in.","options":["A. discussed","B. were discussing","C. discuss","D. have discussed"],"answer":"B","explain":"Hành động đang diễn ra (thảo luận) bị xen vào (cô giáo bước vào) → quá khứ tiếp diễn.","points":0.25},{"type":"mcq","level":"VD","q":"Choose the correct sentence.","options":["A. While I was sleeping, she was calling.","B. While I slept, she called.","C. While I was sleeping, she called.","D. While I sleep, she calls."],"answer":"C","explain":"Hành động dài (ngủ) dùng quá khứ tiếp diễn, hành động ngắn xen vào (cô ấy gọi) dùng quá khứ đơn.","points":0.25},{"type":"mcq","level":"TH","q":"A: Excuse me, could you tell me about Nguyen Ngoc Ky? B: ______","options":["A. Sure. He is a teacher who writes with his feet.","B. I do not know him at all.","C. No, I cannot help you.","D. Goodbye."],"answer":"A","explain":"Trả lời lịch sự và đưa thông tin đúng về thầy Ký.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nNick Vujicic was born in Australia in 1982 without arms and legs. As a teenager, he felt depressed and hopeless. Then he decided to live a full life. He learnt to swim, surf and play golf. Now he gives talks around the world about never giving up.","statements":["a) Nick was born without arms and legs.","b) He always felt happy as a teenager.","c) He learnt to swim and surf.","d) He encourages people not to give up."],"answer":["T","F","T","T"],"explain":"b) Sai: thời niên thiếu ông từng chán nản, tuyệt vọng.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: ______ you ever read her biography?","answer":"Have","explain":"Câu hỏi thì hiện tại hoàn thành với 'ever' → Have you ever...?","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The young artist showed great ______ (determine).","answer":"determination","explain":"Sau tính từ 'great' cần danh từ → determination (sự quyết tâm).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["legacy","di sản"],["milestone","cột mốc"],["role model","tấm gương"],["selfless","vị tha"],["influence","ảnh hưởng"]],"explain":"legacy = di sản; milestone = cột mốc; role model = tấm gương; selfless = vị tha; influence = ảnh hưởng.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Millions","of","people","admire","his","legacy"],"explain":"Millions of people admire his legacy. (Hàng triệu người ngưỡng mộ di sản của ông.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"J.K. Rowling wrote the Harry Potter books. Before success, she was a poor single mother living on welfare. Twelve publishers said no to her first book. She did not give up. Finally, a small publisher accepted it. Today she is one of the most successful writers in the world.","sub_questions":[{"q":"How many publishers rejected her first book?","options":["A. Ten.","B. Eleven.","C. Twelve.","D. Thirteen."],"answer":"C"},{"q":"What did she do after the rejections?","options":["A. She gave up writing.","B. She did not give up.","C. She changed her job.","D. She moved to America."],"answer":"B"}],"explain":"Đoạn văn nói 12 nhà xuất bản từ chối và bà đã không bỏ cuộc.","points":1}]}]}
