<script type="application/json" class="saobay-exam10-data">
{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'u' is pronounced differently from the others.","options":["A. multicultural","B. custom","C. culture","D. tune"],"answer":"D","explain":"Chữ 'u' trong multicultural, custom, culture phát âm là /ʌ/, còn trong tune là /uː/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. multicultural","B. diversity","C. tradition","D. festival"],"answer":"A","explain":"multicultural nhấn âm 4 (ˌmʌltɪˈkʌltʃərəl), còn diversity, tradition nhấn âm 2, festival nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"Vietnam is proud of its cultural ______.","options":["A. diversity","B. custom","C. ritual","D. ancestor"],"answer":"A","explain":"Việt Nam tự hào về sự đa dạng văn hóa → diversity.","points":0.25},{"type":"mcq","level":"TH","q":"Tet is ______ most important festival in Vietnam.","options":["A. a","B. an","C. the","D. Ø (no article)"],"answer":"C","explain":"Lễ hội quan trọng nhất (duy nhất, xác định) → the.","points":0.25},{"type":"mcq","level":"VD","q":"______ Mount Fuji is the highest mountain in Japan.","options":["A. A","B. An","C. The","D. Ø (no article)"],"answer":"D","explain":"Trước tên núi đơn (Mount Fuji) không dùng mạo từ.","points":0.25},{"type":"mcq","level":"TH","q":"A: What do you know about Thanksgiving? B: ______","options":["A. It is an American festival for giving thanks.","B. I do not like festivals.","C. What time is it?","D. See you later."],"answer":"A","explain":"Trả lời bằng thông tin đúng về lễ Tạ ơn của Mỹ.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nThanksgiving is an American festival celebrated in November. Families gather for a big dinner with turkey. People give thanks for the good things in their lives. It is one of the most important holidays in the USA.","statements":["a) Thanksgiving is celebrated in November.","b) Families eat turkey at dinner.","c) It is a Vietnamese festival.","d) People give thanks for good things."],"answer":["T","T","F","T"],"explain":"c) Sai: đây là lễ hội của Mỹ.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Each ethnic group has its own ______ and traditions.","answer":"customs","explain":"Mỗi dân tộc có phong tục và truyền thống riêng → customs.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: Vietnam is famous for its cultural ______ (diverse).","answer":"diversity","explain":"Sau tính từ sở hữu 'its' cần danh từ → diversity.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["custom","phong tục"],["heritage","di sản"],["celebrate","ăn mừng"],["ancestor","tổ tiên"],["unique","độc đáo"]],"explain":"custom = phong tục; heritage = di sản; celebrate = ăn mừng; ancestor = tổ tiên; unique = độc đáo.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Vietnam","has","54","ethnic","groups"],"explain":"Vietnam has 54 ethnic groups. (Việt Nam có 54 dân tộc.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: What are you doing this weekend? B: I'm going to the Mid-Autumn Festival in Hoi An. A: That sounds fun! What happens there? B: There are lantern parades and lion dances. Children carry colourful lanterns. A: I'd love to join you. B: Great! Let's meet at 7 p.m.","sub_questions":[{"q":"Where is B going this weekend?","options":["A. To Ha Long Bay.","B. To Hoi An.","C. To Hue.","D. To Da Nang."],"answer":"B"},{"q":"What time will they meet?","options":["A. At 6 p.m.","B. At 7 p.m.","C. At 8 p.m.","D. At 9 p.m."],"answer":"B"}],"explain":"Hội thoại nói B đi lễ Trung thu ở Hội An và họ hẹn gặp lúc 7 giờ tối.","points":1}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'a' is pronounced differently from the others.","options":["A. national","B. Japan","C. cultural","D. canal"],"answer":"C","explain":"Chữ 'a' trong national, Japan, canal phát âm là /æ/, còn trong cultural là /ʌ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. custom","B. ethnic","C. unique","D. vibrant"],"answer":"C","explain":"unique nhấn âm 2 (juːˈniːk), còn custom, ethnic, vibrant nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"The ao dai is a ______ costume of Vietnam.","options":["A. traditional","B. modern","C. strange","D. simple"],"answer":"A","explain":"Áo dài là trang phục truyền thống → traditional.","points":0.25},{"type":"mcq","level":"TH","q":"She is wearing ______ beautiful kimono.","options":["A. a","B. an","C. the","D. Ø (no article)"],"answer":"A","explain":"Một trong nhiều bộ kimono, nhắc lần đầu → a.","points":0.25},{"type":"mcq","level":"VD","q":"______ French are famous for their cuisine.","options":["A. A","B. An","C. The","D. Ø (no article)"],"answer":"C","explain":"'the + tính từ' chỉ một dân tộc: the French (người Pháp).","points":0.25},{"type":"mcq","level":"TH","q":"A: Have you ever tried kimchi? B: ______","options":["A. Yes, it is a Korean dish.","B. No, I hate food.","C. What is your name?","D. Goodbye."],"answer":"A","explain":"Trả lời đã thử và cho biết kimchi là món Hàn Quốc.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nDiwali is the festival of lights in India. People light oil lamps and set off fireworks. Families clean their houses and wear new clothes. The festival celebrates the victory of light over darkness. It usually falls in October or November.","statements":["a) Diwali is called the festival of lights.","b) People light oil lamps.","c) It celebrates the victory of darkness.","d) It falls in October or November."],"answer":["T","T","F","T"],"explain":"c) Sai: lễ hội mừng chiến thắng của ánh sáng trước bóng tối.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: People of different cultures can ______ peacefully.","answer":"coexist","explain":"Người thuộc các nền văn hóa khác nhau có thể cùng tồn tại hòa bình → coexist.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The festival was a ______ (vibrate) celebration.","answer":"vibrant","explain":"Cần tính từ bổ nghĩa cho danh từ 'celebration' → vibrant (sôi động).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["diversity","sự đa dạng"],["festival","lễ hội"],["identity","bản sắc"],["tolerance","sự khoan dung"],["ritual","nghi lễ"]],"explain":"diversity = sự đa dạng; festival = lễ hội; identity = bản sắc; tolerance = sự khoan dung; ritual = nghi lễ.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Different","cultures","can","coexist","peacefully"],"explain":"Different cultures can coexist peacefully. (Các nền văn hóa khác nhau có thể cùng tồn tại hòa bình.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Diwali is coming soon. In India, families are preparing for the festival of lights. They clean their houses and buy new clothes. On the festival night, they light oil lamps everywhere. Children love setting off fireworks. It is a time for family reunions.","sub_questions":[{"q":"What are families doing before Diwali?","options":["A. They are travelling abroad.","B. They are cleaning houses and buying new clothes.","C. They are closing their shops.","D. They are moving house."],"answer":"B"},{"q":"What do they do on the festival night?","options":["A. They light oil lamps.","B. They go to school.","C. They stay silent.","D. They plant trees."],"answer":"A"}],"explain":"Đoạn văn nói các gia đình dọn nhà, mua quần áo mới và thắp đèn dầu trong đêm lễ.","points":1}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'e' is pronounced differently from the others.","options":["A. ethnic","B. heritage","C. diverse","D. respect"],"answer":"C","explain":"Chữ 'e' trong ethnic, heritage, respect phát âm là /e/, còn trong diverse là /ɜː/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. celebrate","B. ancestor","C. costume","D. maintain"],"answer":"D","explain":"maintain nhấn âm 2 (meɪnˈteɪn), còn celebrate, ancestor, costume nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"We should show ______ to people from different cultures.","options":["A. tolerance","B. custom","C. ritual","D. costume"],"answer":"A","explain":"Chúng ta nên thể hiện sự khoan dung với người thuộc nền văn hóa khác → tolerance.","points":0.25},{"type":"mcq","level":"TH","q":"He plays ______ important role in preserving local heritage.","options":["A. a","B. an","C. the","D. Ø (no article)"],"answer":"B","explain":"'important' bắt đầu bằng nguyên âm /ɪ/ → an.","points":0.25},{"type":"mcq","level":"VD","q":"She went to ______ school by bus every day.","options":["A. a","B. an","C. the","D. Ø (no article)"],"answer":"D","explain":"'go to school' (đi học, đúng mục đích) không dùng mạo từ.","points":0.25},{"type":"mcq","level":"TH","q":"A: What is Holi festival famous for? B: ______","options":["A. People throw coloured powder at each other.","B. People eat turkey.","C. People watch films.","D. People sleep all day."],"answer":"A","explain":"Lễ Holi nổi tiếng với việc ném bột màu vào nhau.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nThe Mid-Autumn Festival is celebrated in Vietnam and China. It falls on the 15th day of the 8th lunar month. Children carry lanterns and watch lion dances. Families eat mooncakes together. It is a time for family reunion.","statements":["a) The Mid-Autumn Festival is celebrated in Vietnam and China.","b) It falls in the 8th lunar month.","c) Children carry lanterns.","d) Families eat turkey together."],"answer":["T","T","T","F"],"explain":"d) Sai: các gia đình ăn bánh trung thu, không phải gà tây.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The Kinh ______ up the majority of Vietnam's population.","answer":"make","explain":"Cụm từ: make up (chiếm).","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: Globalisation brings both opportunities and ______ (challenge).","answer":"challenges","explain":"Cần danh từ số nhiều sau 'and' → challenges.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["multicultural","đa văn hóa"],["tradition","truyền thống"],["ethnic","thuộc dân tộc"],["costume","trang phục"],["coexist","cùng tồn tại"]],"explain":"multicultural = đa văn hóa; tradition = truyền thống; ethnic = thuộc dân tộc; costume = trang phục; coexist = cùng tồn tại.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["We","should","respect","other","cultures"],"explain":"We should respect other cultures. (Chúng ta nên tôn trọng các nền văn hóa khác.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: I'm going to a Thai restaurant tonight. B: Nice! Have you tried tom yum? A: Not yet. Is it spicy? B: Yes, very spicy, but delicious. Thai cuisine uses a lot of herbs. A: I love spicy food. B: Then you'll love it!","sub_questions":[{"q":"Where is A going tonight?","options":["A. To a Thai restaurant.","B. To a Chinese restaurant.","C. To a Vietnamese restaurant.","D. To an Italian restaurant."],"answer":"A"},{"q":"What is said about Thai cuisine?","options":["A. It is very sweet.","B. It uses a lot of herbs.","C. It has no spices.","D. It is very cheap."],"answer":"B"}],"explain":"Hội thoại nói A đi nhà hàng Thái và ẩm thực Thái dùng nhiều thảo mộc.","points":1}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'i' is pronounced differently from the others.","options":["A. ritual","B. vivid","C. diversity","D. distinct"],"answer":"C","explain":"Chữ 'i' trong ritual, vivid, distinct phát âm là /ɪ/, còn trong diversity là /aɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. heritage","B. ritual","C. cuisine","D. global"],"answer":"C","explain":"cuisine nhấn âm 2 (kwɪˈziːn), còn heritage, ritual, global nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"The wedding ______ includes many traditional steps.","options":["A. ritual","B. custom","C. festival","D. costume"],"answer":"A","explain":"Nghi lễ cưới bao gồm nhiều bước truyền thống → ritual.","points":0.25},{"type":"mcq","level":"TH","q":"______ customs of the Thai differ from those of the Kinh.","options":["A. A","B. An","C. The","D. Ø (no article)"],"answer":"C","explain":"Phong tục của người Thái (đã xác định) → the.","points":0.25},{"type":"mcq","level":"VD","q":"We had dinner at ______ famous restaurant downtown.","options":["A. a","B. an","C. the","D. Ø (no article)"],"answer":"A","explain":"Một trong nhiều nhà hàng nổi tiếng, nhắc lần đầu → a.","points":0.25},{"type":"mcq","level":"TH","q":"A: Why do people wear ao dai on Tet? B: ______","options":["A. To show respect for tradition.","B. Because it is cold.","C. I do not know.","D. What a question!"],"answer":"A","explain":"Mặc áo dài ngày Tết để thể hiện sự tôn trọng truyền thống.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nCarnival in Brazil is one of the biggest festivals in the world. It takes place before Lent, usually in February. People wear colourful costumes and dance samba in the streets. Millions of tourists visit Brazil for the carnival every year.","statements":["a) Carnival is a small local festival.","b) It takes place in February.","c) People dance samba in the streets.","d) Millions of tourists visit Brazil for it."],"answer":["F","T","T","T"],"explain":"a) Sai: đây là một trong những lễ hội lớn nhất thế giới.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Parents ______ down traditions to their children.","answer":"pass","explain":"Cụm từ: pass down (truyền lại).","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The ao dai is a ______ (uniqueness) Vietnamese costume.","answer":"unique","explain":"Cần tính từ bổ nghĩa cho danh từ 'costume' → unique.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["cuisine","ẩm thực"],["minority","thiểu số"],["vibrant","sôi động"],["assimilation","sự đồng hóa"],["globalisation","toàn cầu hóa"]],"explain":"cuisine = ẩm thực; minority = thiểu số; vibrant = sôi động; assimilation = sự đồng hóa; globalisation = toàn cầu hóa.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["They","celebrate","Tet","in","February"],"explain":"They celebrate Tet in February. (Họ đón Tết vào tháng Hai.) — lưu ý: Tết thường rơi vào tháng 1 hoặc 2.","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"The Hmong people live mainly in the northern mountains of Vietnam. They are famous for their colourful costumes. The Hmong New Year is celebrated in December. People wear their best clothes, play traditional games and dance. It is an important time for young people to meet each other.","sub_questions":[{"q":"Where do the Hmong live mainly?","options":["A. In the southern plains.","B. In the northern mountains.","C. In big cities.","D. Near the sea."],"answer":"B"},{"q":"When is the Hmong New Year celebrated?","options":["A. In January.","B. In December.","C. In March.","D. In June."],"answer":"B"}],"explain":"Đoạn văn nói người Hmông sống ở vùng núi phía Bắc và đón Tết vào tháng 12.","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'o' is pronounced differently from the others.","options":["A. costume","B. global","C. coexist","D. local"],"answer":"A","explain":"Chữ 'o' trong global, coexist, local phát âm là /əʊ/, còn trong costume là /ɒ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. identity","B. minority","C. majority","D. unity"],"answer":"D","explain":"unity nhấn âm 1 (ˈjuːnɪti), còn identity, minority, majority nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"Our grandparents' stories help us remember our ______.","options":["A. ancestors","B. customs","C. festivals","D. costumes"],"answer":"A","explain":"Câu chuyện của ông bà giúp nhớ về tổ tiên → ancestors.","points":0.25},{"type":"mcq","level":"TH","q":"______ multicultural society brings many benefits.","options":["A. A","B. An","C. The","D. Ø (no article)"],"answer":"A","explain":"Một xã hội đa văn hóa (một trong nhiều, nhắc lần đầu) → a.","points":0.25},{"type":"mcq","level":"VD","q":"He is ______ honest man who always respects others.","options":["A. a","B. an","C. the","D. Ø (no article)"],"answer":"B","explain":"'honest' phát âm bắt đầu bằng nguyên âm /ɒ/ → an.","points":0.25},{"type":"mcq","level":"TH","q":"A: Can you tell me about the Day of the Dead? B: ______","options":["A. It is a Mexican festival honouring ancestors.","B. It is a sad day for everyone.","C. I have no idea.","D. Never heard of it."],"answer":"A","explain":"Lễ hội người chết là lễ hội Mexico tưởng nhớ tổ tiên.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nHoli is the festival of colours in India. It is celebrated in spring, usually in March. People throw coloured powder and water at each other. The festival marks the victory of good over evil. Everyone, young and old, joins the fun.","statements":["a) Holi is the festival of colours.","b) It is celebrated in winter.","c) People throw coloured powder.","d) It marks the victory of good over evil."],"answer":["T","F","T","T"],"explain":"b) Sai: lễ hội diễn ra vào mùa xuân, tháng 3.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Vietnam takes ______ in its cultural heritage.","answer":"pride","explain":"Cụm từ: take pride in (tự hào về).","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The ______ (celebrate) lasted three days.","answer":"celebration","explain":"Cần danh từ làm chủ ngữ → celebration (lễ kỷ niệm).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["tradition","truyền thống"],["ethnic","thuộc dân tộc"],["festival","lễ hội"],["heritage","di sản"],["tolerance","sự khoan dung"]],"explain":"tradition = truyền thống; ethnic = thuộc dân tộc; festival = lễ hội; heritage = di sản; tolerance = sự khoan dung.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Cultural","diversity","is","our","strength"],"explain":"Cultural diversity is our strength. (Sự đa dạng văn hóa là sức mạnh của chúng ta.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Where are you from? B: I'm from Mexico. A: What's a famous festival in your country? B: The Day of the Dead. We honour our ancestors with flowers and food. A: Is it a sad festival? B: No, it is a happy celebration of life.","sub_questions":[{"q":"Where is B from?","options":["A. Brazil.","B. Mexico.","C. Spain.","D. India."],"answer":"B"},{"q":"What do people do on the Day of the Dead?","options":["A. They honour ancestors with flowers and food.","B. They stay at home alone.","C. They throw coloured powder.","D. They light fireworks."],"answer":"A"}],"explain":"Hội thoại nói B đến từ Mexico và lễ hội tưởng nhớ tổ tiên bằng hoa và thức ăn.","points":1}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ea' is pronounced differently from the others.","options":["A. great","B. peace","C. feast","D. meat"],"answer":"A","explain":"'ea' trong peace, feast, meat phát âm là /iː/, còn trong great là /eɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. coexist","B. divide","C. include","D. enjoy"],"answer":"A","explain":"coexist nhấn âm 3 (ˌkəʊɪɡˈzɪst), còn divide, include, enjoy nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"The village festival was a ______ event with music and dancing.","options":["A. vibrant","B. unique","C. quiet","D. boring"],"answer":"A","explain":"Lễ hội làng sôi động với âm nhạc và nhảy múa → vibrant.","points":0.25},{"type":"mcq","level":"TH","q":"______ life in the countryside is peaceful.","options":["A. A","B. An","C. The","D. Ø (no article)"],"answer":"D","explain":"'life' không đếm được, nói chung → không dùng mạo từ.","points":0.25},{"type":"mcq","level":"VD","q":"This is ______ unique custom of our village.","options":["A. a","B. an","C. the","D. Ø (no article)"],"answer":"A","explain":"'unique' phát âm bắt đầu bằng phụ âm /j/ → a (mặc dù viết bằng 'u').","points":0.25},{"type":"mcq","level":"TH","q":"A: What should I wear to the wedding? B: ______","options":["A. A traditional costume would be nice.","B. Wear anything you like.","C. I do not know.","D. Do not go."],"answer":"A","explain":"Gợi ý mặc trang phục truyền thống khi dự đám cưới.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nThe United States is a melting pot of cultures. People from all over the world live there. They bring their languages, food and festivals. Chinatown in San Francisco and Little Italy in New York are famous cultural areas. This diversity makes American culture rich and vibrant.","statements":["a) The USA is a melting pot of cultures.","b) Immigrants bring their languages and food.","c) Chinatown is in New York.","d) Diversity makes American culture rich."],"answer":["T","T","F","T"],"explain":"c) Sai: Chinatown được nhắc tới ở San Francisco.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The new policy promotes cultural ______.","answer":"diversity","explain":"Chính sách mới thúc đẩy sự đa dạng văn hóa → diversity.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: She gave a ______ (thought) speech about peace.","answer":"thoughtful","explain":"Cần tính từ bổ nghĩa cho danh từ 'speech' → thoughtful (sâu sắc).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["custom","phong tục"],["identity","bản sắc"],["ancestor","tổ tiên"],["unique","độc đáo"],["celebrate","ăn mừng"]],"explain":"custom = phong tục; identity = bản sắc; ancestor = tổ tiên; unique = độc đáo; celebrate = ăn mừng.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["People","should","preserve","their","traditions"],"explain":"People should preserve their traditions. (Mọi người nên gìn giữ truyền thống của mình.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Thanksgiving dinner is the most important meal of the year for many American families. The main dish is roast turkey. People also eat pumpkin pie. Before eating, family members say what they are thankful for. It is a warm and happy time.","sub_questions":[{"q":"What is the main dish of Thanksgiving dinner?","options":["A. Roast chicken.","B. Roast turkey.","C. Pumpkin soup.","D. Beef steak."],"answer":"B"},{"q":"What do family members do before eating?","options":["A. They sing songs.","B. They say what they are thankful for.","C. They watch TV.","D. They play games."],"answer":"B"}],"explain":"Đoạn văn nói món chính là gà tây quay và mọi người bày tỏ lòng biết ơn trước khi ăn.","points":1}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'th' is pronounced differently from the others.","options":["A. ethnic","B. this","C. that","D. those"],"answer":"A","explain":"'th' trong ethnic phát âm là /θ/ (vô thanh), còn trong this, that, those là /ð/ (hữu thanh) nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. tolerance","B. custom","C. respect","D. wonder"],"answer":"C","explain":"respect (động từ) nhấn âm 2 (rɪˈspekt), còn tolerance, custom, wonder nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"Young people should learn about their cultural ______.","options":["A. identity","B. custom","C. festival","D. food"],"answer":"A","explain":"Người trẻ nên tìm hiểu về bản sắc văn hóa → identity.","points":0.25},{"type":"mcq","level":"TH","q":"We visited ______ ancient temple in Hue.","options":["A. a","B. an","C. the","D. Ø (no article)"],"answer":"B","explain":"'ancient' bắt đầu bằng nguyên âm /eɪ/ → an.","points":0.25},{"type":"mcq","level":"VD","q":"______ poor need our help and support.","options":["A. A","B. An","C. The","D. Ø (no article)"],"answer":"C","explain":"'the + tính từ' chỉ nhóm người: the poor (người nghèo).","points":0.25},{"type":"mcq","level":"TH","q":"A: I'd like to learn about Japanese culture. B: ______","options":["A. You should visit Japan during cherry blossom season.","B. I do not like Japan.","C. Goodbye.","D. What a pity!"],"answer":"A","explain":"Gợi ý đến Nhật vào mùa hoa anh đào để tìm hiểu văn hóa.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nThe ao dai is the traditional costume of Vietnam. It is a long dress worn over trousers. In the past, both men and women wore ao dai. Today, it is mostly worn by women on special occasions like Tet and weddings. Many students wear white ao dai to school.","statements":["a) The ao dai is worn over trousers.","b) Only women wore ao dai in the past.","c) Today women wear it on special occasions.","d) Students wear white ao dai to school."],"answer":["T","F","T","T"],"explain":"b) Sai: ngày xưa cả nam và nữ đều mặc áo dài.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Different cultures ______ together in this city.","answer":"blend","explain":"Các nền văn hóa giao thoa trong thành phố → blend (cụm: blend of cultures).","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The dancers wore ______ (colour) costumes.","answer":"colourful","explain":"Cần tính từ bổ nghĩa cho danh từ 'costumes' → colourful.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["diversity","sự đa dạng"],["ritual","nghi lễ"],["coexist","cùng tồn tại"],["multicultural","đa văn hóa"],["vibrant","sôi động"]],"explain":"diversity = sự đa dạng; ritual = nghi lễ; coexist = cùng tồn tại; multicultural = đa văn hóa; vibrant = sôi động.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Tet","is","the","biggest","festival","in","Vietnam"],"explain":"Tet is the biggest festival in Vietnam. (Tết là lễ hội lớn nhất ở Việt Nam.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: What did you do last weekend? B: I joined a cooking class. A: What did you cook? B: We made spring rolls and pho. A: Vietnamese cuisine is delicious! B: Yes, and the teacher taught us about food culture too.","sub_questions":[{"q":"What did B do last weekend?","options":["A. Joined a cooking class.","B. Went swimming.","C. Visited a museum.","D. Watched a film."],"answer":"A"},{"q":"What did they cook?","options":["A. Pizza and pasta.","B. Spring rolls and pho.","C. Sushi and sashimi.","D. Bread and cheese."],"answer":"B"}],"explain":"Hội thoại nói B tham gia lớp học nấu ăn và họ làm nem rán, phở.","points":1}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'c' is pronounced differently from the others.","options":["A. customs","B. cuisine","C. culture","D. costume"],"answer":"B","explain":"Chữ 'c' trong customs, culture, costume phát âm là /k/, còn trong cuisine là /s/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. assimilation","B. celebration","C. decoration","D. ceremony"],"answer":"D","explain":"ceremony nhấn âm 1 (ˈserəməni), còn assimilation, celebration, decoration nhấn âm 4.","points":0.25},{"type":"mcq","level":"TH","q":"The Mid-Autumn Festival is a time for family ______.","options":["A. reunion","B. custom","C. ritual","D. costume"],"answer":"A","explain":"Tết Trung thu là dịp đoàn viên gia đình → reunion.","points":0.25},{"type":"mcq","level":"TH","q":"______ Mekong River flows through Vietnam.","options":["A. A","B. An","C. The","D. Ø (no article)"],"answer":"C","explain":"Trước tên sông dùng 'the'.","points":0.25},{"type":"mcq","level":"VD","q":"She is ______ most respected teacher in our school.","options":["A. a","B. an","C. the","D. Ø (no article)"],"answer":"C","explain":"So sánh nhất (most respected) → the.","points":0.25},{"type":"mcq","level":"TH","q":"A: What does 'melting pot' mean? B: ______","options":["A. A place where different cultures blend together.","B. A pot for cooking.","C. I do not know.","D. A kind of food."],"answer":"A","explain":"Giải thích 'melting pot' là nơi các nền văn hóa giao thoa.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nGlobalisation is changing cultures around the world. Young people listen to the same music and wear similar clothes. Some people worry that local traditions may disappear. Others believe cultures can blend and create something new. Schools now teach students to respect cultural diversity.","statements":["a) Globalisation is changing cultures.","b) All young people hate foreign music.","c) Some worry local traditions may disappear.","d) Schools teach respect for diversity."],"answer":["T","F","T","T"],"explain":"b) Sai: đoạn văn nói người trẻ nghe cùng loại nhạc, không nói họ ghét nhạc nước ngoài.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: She wore a ______ ao dai on her wedding day.","answer":"traditional","explain":"Cô ấy mặc áo dài truyền thống trong ngày cưới → traditional.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The ______ (perform) wore colourful costumes.","answer":"performers","explain":"Cần danh từ số nhiều chỉ người → performers.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["heritage","di sản"],["ethnic","thuộc dân tộc"],["tolerance","sự khoan dung"],["assimilation","sự đồng hóa"],["globalisation","toàn cầu hóa"]],"explain":"heritage = di sản; ethnic = thuộc dân tộc; tolerance = sự khoan dung; assimilation = sự đồng hóa; globalisation = toàn cầu hóa.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["We","must","respect","cultural","diversity"],"explain":"We must respect cultural diversity. (Chúng ta phải tôn trọng sự đa dạng văn hóa.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Carnival in Rio de Janeiro is amazing. The streets are full of music and dancing. People wear colourful costumes with feathers. Samba schools compete in a big parade. Millions of people watch it every year, either in person or on TV.","sub_questions":[{"q":"Where does this carnival take place?","options":["A. In Sao Paulo.","B. In Rio de Janeiro.","C. In Brasilia.","D. In Salvador."],"answer":"B"},{"q":"What do samba schools do?","options":["A. They teach languages.","B. They compete in a big parade.","C. They sell food.","D. They play football."],"answer":"B"}],"explain":"Đoạn văn nói lễ hội ở Rio de Janeiro và các trường samba thi diễu hành.","points":1}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'oo' is pronounced differently from the others.","options":["A. food","B. cook","C. noodle","D. choose"],"answer":"B","explain":"'oo' trong food, noodle, choose phát âm là /uː/, còn trong cook là /ʊ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. global","B. local","C. national","D. abroad"],"answer":"D","explain":"abroad nhấn âm 2 (əˈbrɔːd), còn global, local, national nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"The Thai people have many interesting ______.","options":["A. customs","B. costumes","C. foods","D. schools"],"answer":"A","explain":"Người Thái có nhiều phong tục thú vị → customs.","points":0.25},{"type":"mcq","level":"TH","q":"He plays ______ football every afternoon.","options":["A. a","B. an","C. the","D. Ø (no article)"],"answer":"D","explain":"Trước tên môn thể thao không dùng mạo từ.","points":0.25},{"type":"mcq","level":"VD","q":"______ life of ethnic minorities is closely linked to nature.","options":["A. A","B. An","C. The","D. Ø (no article)"],"answer":"C","explain":"Cuộc sống của đồng bào dân tộc (đã xác định) → the.","points":0.25},{"type":"mcq","level":"TH","q":"A: Excuse me, where is the festival held? B: ______","options":["A. In the central square.","B. I do not know.","C. Goodbye.","D. What festival?"],"answer":"A","explain":"Trả lời địa điểm tổ chức lễ hội.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nThe Day of the Dead is a Mexican festival. It is held on November 1st and 2nd. Families build altars with flowers, food and photos. They believe the spirits of ancestors return home. It is a happy celebration, not a sad one.","statements":["a) The Day of the Dead is Mexican.","b) It is held in November.","c) Families build altars for ancestors.","d) It is a sad festival."],"answer":["T","T","T","F"],"explain":"d) Sai: đây là lễ kỷ niệm vui, không buồn.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The festival attracts ______ of tourists every year.","answer":"millions","explain":"Lễ hội thu hút hàng triệu du khách → millions of.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: We should preserve our cultural ______ (identical).","answer":"identity","explain":"Cần danh từ → identity (bản sắc).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["custom","phong tục"],["festival","lễ hội"],["ancestor","tổ tiên"],["unique","độc đáo"],["identity","bản sắc"]],"explain":"custom = phong tục; festival = lễ hội; ancestor = tổ tiên; unique = độc đáo; identity = bản sắc.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["The","festival","attracts","many","tourists"],"explain":"The festival attracts many tourists. (Lễ hội thu hút nhiều du khách.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: I'm making banh chung for Tet. B: What's banh chung? A: It's a traditional Vietnamese cake made of sticky rice, pork and beans. B: It sounds delicious. A: Families make it together before Tet. It takes a whole day! B: I'd love to try it.","sub_questions":[{"q":"What is banh chung made of?","options":["A. Sticky rice, pork and beans.","B. Wheat, eggs and milk.","C. Corn and cheese.","D. Fish and vegetables."],"answer":"A"},{"q":"When do families make it?","options":["A. After Tet.","B. Before Tet.","C. At Mid-Autumn.","D. On birthdays."],"answer":"B"}],"explain":"Hội thoại nói bánh chưng làm từ gạo nếp, thịt, đậu và các gia đình gói bánh trước Tết.","points":1}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'y' is pronounced differently from the others.","options":["A. diversity","B. identity","C. unity","D. fly"],"answer":"D","explain":"Chữ 'y' trong diversity, identity, unity phát âm là /ɪ/, còn trong fly là /aɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. custom","B. practice","C. habit","D. behave"],"answer":"D","explain":"behave nhấn âm 2 (bɪˈheɪv), còn custom, practice, habit nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"______ is the process of becoming part of another culture.","options":["A. Assimilation","B. Diversity","C. Tolerance","D. Custom"],"answer":"A","explain":"Đồng hóa là quá trình hòa nhập vào nền văn hóa khác → assimilation.","points":0.25},{"type":"mcq","level":"TH","q":"We have ______ lunch at noon every day.","options":["A. a","B. an","C. the","D. Ø (no article)"],"answer":"D","explain":"Trước tên bữa ăn nói chung không dùng mạo từ.","points":0.25},{"type":"mcq","level":"VD","q":"______ first prize went to the Thai team.","options":["A. A","B. An","C. The","D. Ø (no article)"],"answer":"C","explain":"Giải nhất (xác định, duy nhất) → the.","points":0.25},{"type":"mcq","level":"TH","q":"A: Thank you for showing me around the village. B: ______","options":["A. You're welcome.","B. I'm tired.","C. Goodbye.","D. How are you?"],"answer":"A","explain":"Đáp lại lời cảm ơn một cách lịch sự → You're welcome.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nThe Hmong New Year is celebrated in December. It is the most important festival of the Hmong people. Young men and women wear their most beautiful costumes. They play traditional games like spinning tops. It is also a good chance for young people to meet and make friends.","statements":["a) The Hmong New Year is in December.","b) It is unimportant to the Hmong.","c) People wear beautiful costumes.","d) Young people can meet new friends."],"answer":["T","F","T","T"],"explain":"b) Sai: đây là lễ hội quan trọng nhất của người Hmông.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: ______ you ever been to a foreign country?","answer":"Have","explain":"Câu hỏi hiện tại hoàn thành → Have you ever...?","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The government promotes ______ (tolerant) among citizens.","answer":"tolerance","explain":"Cần danh từ → tolerance (sự khoan dung).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["multicultural","đa văn hóa"],["tradition","truyền thống"],["cuisine","ẩm thực"],["minority","thiểu số"],["coexist","cùng tồn tại"]],"explain":"multicultural = đa văn hóa; tradition = truyền thống; cuisine = ẩm thực; minority = thiểu số; coexist = cùng tồn tại.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Learning","about","other","cultures","is","interesting"],"explain":"Learning about other cultures is interesting. (Tìm hiểu về các nền văn hóa khác thật thú vị.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Lantern Festival marks the end of the Lunar New Year celebrations in China. People hang colourful lanterns everywhere. Children solve riddles written on lanterns. Families eat sweet rice balls called tangyuan. It is a joyful festival full of lights.","sub_questions":[{"q":"What marks the end of Lunar New Year in China?","options":["A. Lantern Festival.","B. Dragon Boat Festival.","C. Mid-Autumn Festival.","D. Qingming Festival."],"answer":"A"},{"q":"What do families eat?","options":["A. Mooncakes.","B. Sweet rice balls.","C. Noodles.","D. Dumplings."],"answer":"B"}],"explain":"Đoạn văn nói lễ hội đèn lồng kết thúc Tết Nguyên đán và các gia đình ăn bánh trôi (tangyuan).","points":1}]}]}
