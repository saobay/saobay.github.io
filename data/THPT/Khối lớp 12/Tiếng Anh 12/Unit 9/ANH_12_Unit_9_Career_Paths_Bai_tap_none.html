cho lời khuyên.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Don't ______ up your dream.","answer":"give","explain":"Đừng từ bỏ ước mơ → give up.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: She ______ (success) in passing the exam.","answer":"succeeded","explain":"Cụm từ: succeed in + V-ing → succeeded.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["mentor","người cố vấn"],["pursue","theo đuổi"],["goal","mục tiêu"],["give up","từ bỏ"],["apply for","ứng tuyển"]],"explain":"mentor = người cố vấn; pursue = theo đuổi; goal = mục tiêu; give up = từ bỏ; apply for = ứng tuyển.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["She","is","looking","for","a","job"],"explain":"She is looking for a job. (Cô ấy đang tìm việc.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: What do you want to do after school? B: I want to be a chef. A: Why? B: I love cooking. My mum taught me. A: Will you go to cooking school? B: Yes, I need professional training.","sub_questions":[{"q":"What does B want to be?","options":["A. A chef.","B. A teacher.","C. A doctor.","D. A driver."],"answer":"A"},{"q":"What does B need?","options":["A. Professional training.","B. A new job.","C. More money.","D. A mentor."],"answer":"A"}],"explain":"Hội thoại nói B muốn làm đầu bếp và cần đào tạo chuyên nghiệp.","points":1}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'o' is pronounced differently from the others.","options":["A. goal","B. diploma","C. job","D. growth"],"answer":"C","explain":"Chữ 'o' trong goal, diploma, growth phát âm là /əʊ/, còn trong job là /ɒ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. ambition","B. diploma","C. degree","D. paper"],"answer":"D","explain":"paper nhấn âm 1 (ˈpeɪpə), còn ambition, diploma, degree nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"He ______ teaching after he retired.","options":["A. took up","B. gave up","C. set up","D. looked for"],"answer":"A","explain":"Ông bắt đầu dạy học sau khi nghỉ hưu → take up.","points":0.25},{"type":"mcq","level":"TH","q":"She apologised ______ being late.","options":["A. for","B. on","C. in","D. at"],"answer":"A","explain":"Cụm từ: apologise for + V-ing (xin lỗi về).","points":0.25},{"type":"mcq","level":"VD","q":"They accused him ______ stealing the money.","options":["A. for","B. of","C. on","D. in"],"answer":"B","explain":"Cụm từ: accuse of (buộc tội về).","points":0.25},{"type":"mcq","level":"TH","q":"A: How can I become a doctor? B: ______","options":["A. Study hard and go to medical school.","B. I don't know.","C. Goodbye.","D. What a pity!"],"answer":"A","explain":"Học chăm và vào trường y để thành bác sĩ.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nA gap year is a year off after school. Many students travel or work during this time. They gain experience and confidence. Some volunteer in poor areas. A gap year helps students decide their future.","statements":["a) A gap year is after school.","b) Students travel or work.","c) They gain experience.","d) A gap year is useless."],"answer":["T","T","T","F"],"explain":"d) Sai: năm nghỉ giúp học sinh định hướng tương lai.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: They ______ up a new company last year.","answer":"set","explain":"Họ đã thành lập công ty mới năm ngoái → set up.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: He is looking forward to ______ (start) his new job.","answer":"starting","explain":"'look forward to' + V-ing → starting.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["ambition","tham vọng"],["training","đào tạo"],["degree","bằng đại học"],["take up","bắt đầu (sở thích/công việc)"],["set up","thành lập"]],"explain":"ambition = tham vọng; training = đào tạo; degree = bằng đại học; take up = bắt đầu (sở thích/công việc); set up = thành lập.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["He","took","up","teaching","last","year"],"explain":"He took up teaching last year. (Ông ấy bắt đầu dạy học năm ngoái.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Apprenticeships are popular in Germany. Young people learn a trade while working. They earn money and gain skills. Many apprentices get full-time jobs later. It is a practical path to a career.","sub_questions":[{"q":"What do apprentices do?","options":["A. Learn a trade while working.","B. Study only theory.","C. Travel abroad.","D. Play sports."],"answer":"A"},{"q":"What happens to many apprentices?","options":["A. They get full-time jobs.","B. They quit.","C. They move away.","D. They fail."],"answer":"A"}],"explain":"Đoạn văn nói học việc vừa học nghề vừa làm và nhiều người được nhận chính thức.","points":1}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'i' is pronounced differently from the others.","options":["A. skill","B. decide","C. qualification","D. interview"],"answer":"B","explain":"Chữ 'i' trong skill, qualification, interview phát âm là /ɪ/, còn trong decide là /aɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. apprentice","B. apply","C. employ","D. office"],"answer":"D","explain":"office nhấn âm 1 (ˈɒfɪs), còn apprentice, apply, employ nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"She ______ a great idea for the project.","options":["A. came up with","B. gave up","C. looked for","D. took up"],"answer":"A","explain":"Cô ấy nảy ra ý tưởng tuyệt vời → come up with.","points":0.25},{"type":"mcq","level":"TH","q":"He believes ______ his own ability.","options":["A. in","B. on","C. for","D. at"],"answer":"A","explain":"Cụm từ: believe in (tin vào).","points":0.25},{"type":"mcq","level":"VD","q":"The manager insisted ______ checking the report again.","options":["A. in","B. on","C. for","D. at"],"answer":"B","explain":"Cụm từ: insist on + V-ing (khăng khăng).","points":0.25},{"type":"mcq","level":"TH","q":"A: Can you give me some career advice? B: ______","options":["A. Follow your passion and work hard.","B. I don't care.","C. Goodbye.","D. What a pity!"],"answer":"A","explain":"Lời khuyên: theo đuổi đam mê và chăm chỉ.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nMentors guide young people. A mentor shares experience and advice. Many successful people had mentors. Mentors help avoid mistakes. Finding a good mentor is valuable.","statements":["a) Mentors guide young people.","b) They share experience.","c) Mentors are useless.","d) Good mentors are valuable."],"answer":["T","T","F","T"],"explain":"c) Sai: người cố vấn giúp tránh sai lầm, rất quý giá.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: She wants to ______ her dream of becoming a pilot.","answer":"pursue","explain":"Cô ấy muốn theo đuổi ước mơ làm phi công → pursue.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The plan was carried ______ carefully.","answer":"out","explain":"Cụm từ: carry out (thực hiện).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["career path","con đường sự nghiệp"],["apprentice","người học việc"],["qualification","bằng cấp"],["carry out","thực hiện"],["come up with","nảy ra (ý tưởng)"]],"explain":"career path = con đường sự nghiệp; apprentice = người học việc; qualification = bằng cấp; carry out = thực hiện; come up with = nảy ra (ý tưởng).","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["She","came","up","with","a","plan"],"explain":"She came up with a plan. (Cô ấy nảy ra một kế hoạch.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: I'm worried about choosing a career. B: Talk to your teachers. A: I like drawing. B: Maybe become a designer! A: But is it a stable job? B: If you work hard, you'll succeed.","sub_questions":[{"q":"What does A like?","options":["A. Drawing.","B. Singing.","C. Sports.","D. Cooking."],"answer":"A"},{"q":"What career does B suggest?","options":["A. Designer.","B. Teacher.","C. Doctor.","D. Engineer."],"answer":"A"}],"explain":"Hội thoại nói A thích vẽ và B gợi ý làm nhà thiết kế.","points":1}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'e' is pronounced differently from the others.","options":["A. mentor","B. degree","C. profession","D. expert"],"answer":"B","explain":"Chữ 'e' trong mentor, profession, expert phát âm là /e/, còn trong degree là /iː/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. qualification","B. information","C. education","D. training"],"answer":"D","explain":"training nhấn âm 1 (ˈtreɪnɪŋ), còn qualification, information, education nhấn âm 4-5.","points":0.25},{"type":"mcq","level":"TH","q":"Please ______ the plan carefully before Friday.","options":["A. carry out","B. give up","C. look for","D. take up"],"answer":"A","explain":"Hãy thực hiện kế hoạch cẩn thận trước thứ Sáu → carry out.","points":0.25},{"type":"mcq","level":"TH","q":"This success resulted ______ years of hard work.","options":["A. in","B. from","C. for","D. at"],"answer":"B","explain":"Cụm từ: result from (là kết quả của); result in (dẫn đến).","points":0.25},{"type":"mcq","level":"VD","q":"She congratulated him ______ winning the prize.","options":["A. on","B. for","C. in","D. at"],"answer":"A","explain":"Cụm từ: congratulate on (chúc mừng về).","points":0.25},{"type":"mcq","level":"TH","q":"A: Do you like your job? B: ______","options":["A. Yes, it's meaningful.","B. No, I hate it.","C. I'm fine.","D. Goodbye."],"answer":"A","explain":"Trả lời thích công việc vì ý nghĩa.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nChanging careers is common now. People learn new skills for new jobs. Online courses make learning easy. Age is not a big problem. Many succeed in a second career.","statements":["a) Changing careers is common.","b) People learn new skills.","c) Online courses help learning.","d) Nobody succeeds in new careers."],"answer":["T","T","T","F"],"explain":"d) Sai: nhiều người thành công với nghề thứ hai.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: He is doing an ______ at a garage.","answer":"apprenticeship","explain":"Anh ấy đang học việc ở gara → apprenticeship.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: She decided to take ______ a new hobby.","answer":"up","explain":"Cụm từ: take up (bắt đầu).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["diploma","bằng tốt nghiệp"],["gap year","năm nghỉ sau tốt nghiệp"],["look for","tìm kiếm"],["look forward to","mong đợi"],["depend on","phụ thuộc vào"]],"explain":"diploma = bằng tốt nghiệp; gap year = năm nghỉ sau tốt nghiệp; look for = tìm kiếm; look forward to = mong đợi; depend on = phụ thuộc vào.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["I","look","forward","to","meeting","you"],"explain":"I look forward to meeting you. (Tôi mong được gặp bạn.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Many women now lead big companies. They work as CEOs and managers. In the past, few women had such roles. Today, companies value talent, not gender. Equal chances help everyone succeed.","sub_questions":[{"q":"What roles do women have now?","options":["A. CEOs and managers.","B. Only assistants.","C. Only teachers.","D. No roles."],"answer":"A"},{"q":"What do companies value today?","options":["A. Talent, not gender.","B. Gender only.","C. Age only.","D. Money."],"answer":"A"}],"explain":"Đoạn văn nói phụ nữ làm CEO, quản lý; công ty coi trọng tài năng, không phân biệt giới.","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'u' is pronounced differently from the others.","options":["A. future","B. pursue","C. success","D. useful"],"answer":"C","explain":"Chữ 'u' trong future, pursue, useful phát âm là /juː/, còn trong success là /ə/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. welcome","B. follow","C. become","D. offer"],"answer":"C","explain":"become nhấn âm 2 (bɪˈkʌm), còn welcome, follow, offer nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"I ______ meeting you next week.","options":["A. look forward to","B. give up","C. look for","D. take up"],"answer":"A","explain":"Tôi mong được gặp bạn tuần tới → look forward to.","points":0.25},{"type":"mcq","level":"TH","q":"The book belongs ______ my sister.","options":["A. to","B. for","C. of","D. with"],"answer":"A","explain":"Cụm từ: belong to (thuộc về).","points":0.25},{"type":"mcq","level":"VD","q":"He reminded me ______ the meeting.","options":["A. of","B. for","C. on","D. about"],"answer":"A","explain":"Cụm từ: remind of (gợi nhớ về).","points":0.25},{"type":"mcq","level":"TH","q":"A: Thank you for your advice. B: ______","options":["A. You're welcome.","B. I'm fine.","C. Goodbye.","D. See you."],"answer":"A","explain":"Đáp lại lời cảm ơn → You're welcome.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nDream jobs are jobs people love. Some want to be pilots, others artists. Loving your job makes work fun. However, dream jobs need hard work too. Passion and effort lead to success.","statements":["a) Dream jobs are loved jobs.","b) Loving work makes it fun.","c) Dream jobs need no effort.","d) Passion leads to success."],"answer":["T","T","F","T"],"explain":"c) Sai: công việc mơ ước cũng cần nỗ lực.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: He has a clear career ______.","answer":"goal","explain":"Anh ấy có mục tiêu nghề nghiệp rõ ràng → goal.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The company will provide ______ with training.","answer":"them","explain":"Cụm từ: provide somebody with (cung cấp cho ai) → them.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["mentor","người cố vấn"],["goal","mục tiêu"],["take up","bắt đầu (sở thích/công việc)"],["depend on","phụ thuộc vào"],["apply for","ứng tuyển"]],"explain":"mentor = người cố vấn; goal = mục tiêu; take up = bắt đầu (sở thích/công việc); depend on = phụ thuộc vào; apply for = ứng tuyển.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Don't","give","up","your","dream"],"explain":"Don't give up your dream. (Đừng từ bỏ ước mơ của bạn.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: What does your brother do? B: He's a software engineer. A: Does he like it? B: Yes, he creates apps. A: That's cool! B: He works from home twice a week.","sub_questions":[{"q":"What is B's brother?","options":["A. A software engineer.","B. A teacher.","C. A doctor.","D. A driver."],"answer":"A"},{"q":"How often does he work from home?","options":["A. Twice a week.","B. Every day.","C. Never.","D. Once a month."],"answer":"A"}],"explain":"Hội thoại nói anh trai B là kỹ sư phần mềm, làm việc tại nhà 2 lần/tuần.","points":1}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ch' is pronounced differently from the others.","options":["A. choose","B. choice","C. character","D. chance"],"answer":"C","explain":"'ch' trong choose, choice, chance phát âm là /tʃ/, còn trong character là /k/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. decide","B. delay","C. discuss","D. doctor"],"answer":"D","explain":"doctor nhấn âm 1 (ˈdɒktə), còn decide, delay, discuss nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"The students ______ out a survey about careers.","options":["A. carried","B. gave","C. looked","D. took"],"answer":"A","explain":"Học sinh thực hiện khảo sát → carried out.","points":0.25},{"type":"mcq","level":"TH","q":"She dreams ______ becoming a singer.","options":["A. of","B. for","C. on","D. at"],"answer":"A","explain":"Cụm từ: dream of/about + V-ing (mơ về).","points":0.25},{"type":"mcq","level":"VD","q":"The storm ______ in flooding across the region.","options":["A. resulted","B. resulted in","C. resulted from","D. resulted on"],"answer":"B","explain":"'result in + danh từ' (dẫn đến): The storm resulted in flooding.","points":0.25},{"type":"mcq","level":"TH","q":"A: Excuse me, can you help me? B: ______","options":["A. Sure, what do you need?","B. I'm busy.","C. Go away.","D. Goodbye."],"answer":"A","explain":"Sẵn sàng giúp đỡ → Sure, what do you need?","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nCareer planning starts at school. Students learn about different jobs. Teachers organise career days. Professionals share their stories. Good planning leads to good choices.","statements":["a) Career planning starts at school.","b) Students learn about jobs.","c) Career days help students.","d) Planning leads to bad choices."],"answer":["T","T","T","F"],"explain":"d) Sai: lập kế hoạch tốt dẫn đến lựa chọn tốt.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: She got a ______ in economics last year.","answer":"degree","explain":"Cô ấy lấy bằng kinh tế năm ngoái → degree.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: He is interested ______ becoming an engineer.","answer":"in","explain":"Cụm từ: interested in (thích, quan tâm).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["ambition","tham vọng"],["training","đào tạo"],["set up","thành lập"],["gap year","năm nghỉ sau tốt nghiệp"],["look for","tìm kiếm"]],"explain":"ambition = tham vọng; training = đào tạo; set up = thành lập; gap year = năm nghỉ sau tốt nghiệp; look for = tìm kiếm.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["They","set","up","a","company","together"],"explain":"They set up a company together. (Họ cùng thành lập một công ty.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Freelancers choose their own projects. They work from home or cafes. Their schedule is flexible. However, income is unstable. Successful freelancers manage time well.","sub_questions":[{"q":"Where do freelancers work?","options":["A. From home or cafes.","B. In offices.","C. In factories.","D. Abroad."],"answer":"A"},{"q":"What is important for freelancers?","options":["A. Managing time well.","B. Working long hours.","C. Having a boss.","D. Wearing uniforms."],"answer":"A"}],"explain":"Đoạn văn nói freelancer làm ở nhà/quán cà phê; quản lý thời gian tốt là quan trọng.","points":1}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'th' is pronounced differently from the others.","options":["A. path","B. month","C. this","D. think"],"answer":"C","explain":"'th' trong path, month, think phát âm là /θ/ (vô thanh), còn trong this là /ð/ (hữu thanh) nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. achieve","B. attain","C. admire","D. action"],"answer":"D","explain":"action nhấn âm 1 (ˈækʃn), còn achieve, attain, admire nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"We need to ______ new markets for our products.","options":["A. look for","B. give up","C. look after","D. take up"],"answer":"A","explain":"Cần tìm kiếm thị trường mới → look for.","points":0.25},{"type":"mcq","level":"TH","q":"He is waiting ______ the bus.","options":["A. for","B. on","C. in","D. at"],"answer":"A","explain":"Cụm từ: wait for (chờ đợi).","points":0.25},{"type":"mcq","level":"VD","q":"She takes ______ her mother. They both love music.","options":["A. after","B. for","C. up","D. on"],"answer":"A","explain":"Cụm từ: take after (giống).","points":0.25},{"type":"mcq","level":"TH","q":"A: What are your plans for the future? B: ______","options":["A. I plan to study abroad.","B. I like films.","C. I'm fine.","D. Goodbye."],"answer":"A","explain":"Trả lời kế hoạch du học.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nVolunteering helps careers too. Volunteers learn teamwork and communication. Employers value volunteer experience. It shows kindness and effort. Many students volunteer in summer.","statements":["a) Volunteering helps careers.","b) Volunteers learn teamwork.","c) Employers ignore volunteering.","d) Many students volunteer."],"answer":["T","T","F","T"],"explain":"c) Sai: nhà tuyển dụng coi trọng kinh nghiệm tình nguyện.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Follow your ______ and work hard.","answer":"passion","explain":"Hãy theo đuổi đam mê và chăm chỉ → passion.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The teacher congratulated the students ______ their success.","answer":"on","explain":"Cụm từ: congratulate on (chúc mừng về).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["career path","con đường sự nghiệp"],["qualification","bằng cấp"],["look forward to","mong đợi"],["come up with","nảy ra (ý tưởng)"],["carry out","thực hiện"]],"explain":"career path = con đường sự nghiệp; qualification = bằng cấp; look forward to = mong đợi; come up with = nảy ra (ý tưởng); carry out = thực hiện.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Follow","your","dream","and","work","hard"],"explain":"Follow your dream and work hard. (Hãy theo đuổi ước mơ và chăm chỉ.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Do you have a mentor? B: Yes, my uncle. He's a businessman. A: What does he teach you? B: He teaches me to be patient. A: That's valuable. B: I meet him every month.","sub_questions":[{"q":"Who is B's mentor?","options":["A. His uncle.","B. His teacher.","C. His father.","D. His friend."],"answer":"A"},{"q":"What does he teach B?","options":["A. To be patient.","B. To be rich.","C. To be fast.","D. To be strong."],"answer":"A"}],"explain":"Hội thoại nói người cố vấn của B là chú, dạy B tính kiên nhẫn.","points":1}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 's' is pronounced differently from the others.","options":["A. skill","B. success","C. decision","D. pass"],"answer":"C","explain":"Chữ 's' trong skill, success, pass phát âm là /s/, còn trong decision là /ʒ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. persist","B. insist","C. resist","D. list"],"answer":"D","explain":"list nhấn âm 1 (từ 1 âm tiết), còn persist, insist, resist nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"The manager will ______ the results tomorrow.","options":["A. look into","B. give up","C. take up","D. set up"],"answer":"A","explain":"Quản lý sẽ xem xét kết quả vào ngày mai → look into.","points":0.25},{"type":"mcq","level":"TH","q":"Listen ______ the teacher carefully.","options":["A. to","B. for","C. on","D. at"],"answer":"A","explain":"Cụm từ: listen to (lắng nghe).","points":0.25},{"type":"mcq","level":"VD","q":"He got ______ the flu after a week.","options":["A. over","B. up","C. on","D. off"],"answer":"A","explain":"Cụm từ: get over (khỏi bệnh, vượt qua).","points":0.25},{"type":"mcq","level":"TH","q":"A: Can I take a day off? B: ______","options":["A. Sure, no problem.","B. No way.","C. I'm busy.","D. Goodbye."],"answer":"A","explain":"Đồng ý cho nghỉ → Sure, no problem.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nLifelong careers are rare now. People change jobs many times. New technology creates new jobs. Workers must keep learning. Adaptability is a key skill.","statements":["a) Lifelong careers are rare.","b) People change jobs often.","c) Technology creates jobs.","d) Learning stops after school."],"answer":["T","T","T","F"],"explain":"d) Sai: người lao động phải học liên tục.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: She is good ______ maths.","answer":"at","explain":"Cô ấy giỏi toán → good at.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: They ran ______ money during the trip.","answer":"out of","explain":"Cụm từ: run out of (hết, cạn kiệt).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["diploma","bằng tốt nghiệp"],["degree","bằng đại học"],["give up","từ bỏ"],["pursue","theo đuổi"],["apprentice","người học việc"]],"explain":"diploma = bằng tốt nghiệp; degree = bằng đại học; give up = từ bỏ; pursue = theo đuổi; apprentice = người học việc.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Success","depends","on","hard","work"],"explain":"Success depends on hard work. (Thành công phụ thuộc vào chăm chỉ.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: I want to take a gap year. B: What will you do? A: I'll travel and volunteer. B: That sounds great! A: I'll also learn English. B: Good plan!","sub_questions":[{"q":"What will A do in the gap year?","options":["A. Travel and volunteer.","B. Work full-time.","C. Stay home.","D. Study maths."],"answer":"A"},{"q":"What else will A do?","options":["A. Learn English.","B. Learn French.","C. Play sports.","D. Cook."],"answer":"A"}],"explain":"Hội thoại nói A nghỉ một năm để du lịch, tình nguyện và học tiếng Anh.","points":1}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ea' is pronounced differently from the others.","options":["A. dream","B. great","C. team","D. deal"],"answer":"B","explain":"'ea' trong dream, team, deal phát âm là /iː/, còn trong great là /eɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. depend","B. demand","C. defend","D. deepen"],"answer":"D","explain":"deepen nhấn âm 1 (ˈdiːpən), còn depend, demand, defend nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"Don't ______ when you face difficulties.","options":["A. give up","B. take up","C. set up","D. look up"],"answer":"A","explain":"Đừng bỏ cuộc khi gặp khó khăn → give up.","points":0.25},{"type":"mcq","level":"TH","q":"She is interested ______ art.","options":["A. in","B. on","C. for","D. at"],"answer":"A","explain":"Cụm từ: interested in (thích).","points":0.25},{"type":"mcq","level":"VD","q":"The project was put ______ due to lack of money.","options":["A. off","B. on","C. up","D. out"],"answer":"A","explain":"Cụm từ: put off (hoãn lại).","points":0.25},{"type":"mcq","level":"TH","q":"A: What should I bring to the interview? B: ______","options":["A. Your CV and a smile.","B. Nothing.","C. I don't know.","D. Goodbye."],"answer":"A","explain":"Mang CV và nụ cười khi phỏng vấn.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nSoft skills are as important as hard skills. Communication and teamwork matter a lot. Employers look for positive attitudes. Technical skills can be trained. Good character helps careers grow.","statements":["a) Soft skills are important.","b) Communication matters.","c) Employers ignore attitudes.","d) Character helps careers."],"answer":["T","T","F","T"],"explain":"c) Sai: nhà tuyển dụng tìm thái độ tích cực.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: He climbed the career ______ quickly.","answer":"ladder","explain":"Anh ấy thăng tiến nhanh → climb the career ladder.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: She looks ______ her grandmother.","answer":"after","explain":"Cụm từ: look after (chăm sóc).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["mentor","người cố vấn"],["ambition","tham vọng"],["apply for","ứng tuyển"],["set up","thành lập"],["look for","tìm kiếm"]],"explain":"mentor = người cố vấn; ambition = tham vọng; apply for = ứng tuyển; set up = thành lập; look for = tìm kiếm.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["She","looks","after","her","grandmother"],"explain":"She looks after her grandmother. (Cô ấy chăm sóc bà.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Why did you choose nursing? B: I want to help sick people. A: Is the training hard? B: Yes, but it's worth it. A: Do you work nights? B: Sometimes, but I love my job.","sub_questions":[{"q":"Why did B choose nursing?","options":["A. To help sick people.","B. For high salary.","C. For fame.","D. By chance."],"answer":"A"},{"q":"Does B love the job?","options":["A. Yes.","B. No.","C. Sometimes.","D. Not sure."],"answer":"A"}],"explain":"Hội thoại nói B chọn nghề y tá để giúp người bệnh và yêu công việc.","points":1}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'oo' is pronounced differently from the others.","options":["A. school","B. choose","C. good","D. soon"],"answer":"C","explain":"'oo' trong school, choose, soon phát âm là /uː/, còn trong good là /ʊ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. focus","B. target","C. limit","D. fulfil"],"answer":"D","explain":"fulfil nhấn âm 2 (fʊlˈfɪl), còn focus, target, limit nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"A good mentor can ______ your career.","options":["A. guide","B. stop","C. break","D. forget"],"answer":"A","explain":"Người cố vấn tốt có thể dẫn dắt sự nghiệp → guide.","points":0.25},{"type":"mcq","level":"TH","q":"He turned ______ the job offer.","options":["A. down","B. up","C. on","D. off"],"answer":"A","explain":"Cụm từ: turn down (từ chối).","points":0.25},{"type":"mcq","level":"VD","q":"She ______ with a brilliant idea yesterday.","options":["A. came up","B. comes up","C. coming up","D. come up"],"answer":"A","explain":"Quá khứ đơn của 'come up with' → came up.","points":0.25},{"type":"mcq","level":"TH","q":"A: Good luck with your new job! B: ______","options":["A. Thank you!","B. Goodbye.","C. I'm fine.","D. See you."],"answer":"A","explain":"Cảm ơn lời chúc → Thank you!","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nWork experience helps young people. Part-time jobs teach responsibility. Internships show real workplaces. Experience makes CVs stronger. Employers prefer experienced candidates.","statements":["a) Work experience helps youth.","b) Part-time jobs teach responsibility.","c) Experience strengthens CVs.","d) Employers dislike experience."],"answer":["T","T","T","F"],"explain":"d) Sai: nhà tuyển dụng thích ứng viên có kinh nghiệm.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: What are your future ______?","answer":"plans","explain":"Kế hoạch tương lai của bạn là gì? → plans.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The meeting was ______ off until Monday.","answer":"put","explain":"Câu bị động: was put off (bị hoãn).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["training","đào tạo"],["goal","mục tiêu"],["take up","bắt đầu (sở thích/công việc)"],["give up","từ bỏ"],["depend on","phụ thuộc vào"]],"explain":"training = đào tạo; goal = mục tiêu; take up = bắt đầu (sở thích/công việc); give up = từ bỏ; depend on = phụ thuộc vào.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["The","meeting","was","put","off"],"explain":"The meeting was put off. (Cuộc họp bị hoãn.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Choosing subjects affects careers. Science leads to medicine or engineering. Art leads to design. Students should follow their strengths. Teachers can advise about subject choices.","sub_questions":[{"q":"What does science lead to?","options":["A. Medicine or engineering.","B. Art.","C. Sports.","D. Music."],"answer":"A"},{"q":"Who can advise students?","options":["A. Teachers.","B. Friends.","C. Strangers.","D. Nobody."],"answer":"A"}],"explain":"Đoạn văn nói khoa học dẫn tới y/dược, kỹ thuật; thầy cô tư vấn chọn môn.","points":1}]}]}
