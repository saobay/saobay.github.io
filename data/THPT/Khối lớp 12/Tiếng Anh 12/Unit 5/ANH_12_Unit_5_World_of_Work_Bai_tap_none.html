{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'a' is pronounced differently from the others.","options":["A. salary","B. candidate","C. career","D. balance"],"answer":"C","explain":"Chữ 'a' trong salary, candidate, balance phát âm là /æ/, còn trong career là /ɪə/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. career","B. employ","C. resign","D. job"],"answer":"D","explain":"job nhấn âm 1 (danh từ 1 âm tiết), còn career, employ, resign nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"She sent her ______ to three companies yesterday.","options":["A. application","B. salary","C. bonus","D. interview"],"answer":"A","explain":"Cô ấy gửi đơn xin việc tới ba công ty → application.","points":0.25},{"type":"mcq","level":"TH","q":"My brother didn't apply for the job, ______ he was offered an apprenticeship.","options":["A. and","B. but","C. because","D. when"],"answer":"B","explain":"Hai mệnh đề độc lập tương phản → câu ghép với 'but'.","points":0.25},{"type":"mcq","level":"VD","q":"______ he was tired, he finished the report before the deadline.","options":["A. Because","B. Although","C. And","D. So"],"answer":"B","explain":"Mệnh đề nhượng bộ → câu phức với 'although'.","points":0.25},{"type":"mcq","level":"TH","q":"A: What do you do? B: ______","options":["A. I'm a teacher.","B. I like teaching.","C. I'm fine.","D. Good morning."],"answer":"A","explain":"Hỏi nghề nghiệp → trả lời nghề nghiệp của mình.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nA job interview is your chance to impress the employer. You should arrive early and dress neatly. Prepare answers about your strengths and experience. Ask questions about the job at the end. A smile and good manners help a lot.","statements":["a) You should arrive late for interviews.","b) Dress neatly for an interview.","c) Prepare answers about strengths.","d) Ask questions at the end."],"answer":["F","T","T","T"],"explain":"a) Sai: bạn nên đến sớm.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: She got a ______ after two years of hard work.","answer":"promotion","explain":"Cô ấy được thăng chức sau hai năm làm việc chăm chỉ → promotion.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The ______ (employ) offered him a good salary.","answer":"employer","explain":"Cần danh từ chỉ người → employer (nhà tuyển dụng).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["career","sự nghiệp"],["salary","lương"],["interview","phỏng vấn"],["resign","từ chức"],["vacancy","vị trí trống"]],"explain":"career = sự nghiệp; salary = lương; interview = phỏng vấn; resign = từ chức; vacancy = vị trí trống.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["She","applied","for","the","job","yesterday"],"explain":"She applied for the job yesterday. (Cô ấy đã ứng tuyển công việc hôm qua.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: I have a job interview tomorrow. B: Good luck! What job is it? A: A marketing assistant. B: Have you prepared? A: Yes, I've read about the company. B: Remember to arrive early and dress smartly. A: Thanks for the advice!","sub_questions":[{"q":"What job is A applying for?","options":["A. Marketing assistant.","B. Sales manager.","C. Accountant.","D. Designer."],"answer":"A"},{"q":"What advice does B give?","options":["A. Arrive early and dress smartly.","B. Bring a friend.","C. Ask for high salary.","D. Be late."],"answer":"A"}],"explain":"Hội thoại nói A phỏng vấn trợ lý marketing và B khuyên đến sớm, ăn mặc lịch sự.","points":1}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'o' is pronounced differently from the others.","options":["A. job","B. offer","C. promotion","D. profit"],"answer":"C","explain":"Chữ 'o' trong job, offer, profit phát âm là /ɒ/, còn trong promotion là /əʊ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. interview","B. salary","C. offer","D. apply"],"answer":"D","explain":"apply nhấn âm 2 (əˈplaɪ), còn interview, salary, offer nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"The company is ______ new staff for the summer.","options":["A. recruiting","B. resigning","C. retiring","D. firing"],"answer":"A","explain":"Công ty đang tuyển nhân viên mới cho mùa hè → recruiting.","points":0.25},{"type":"mcq","level":"TH","q":"She is a doctor. She works in a hospital. (Choose the complex sentence combining them.)","options":["A. She is a doctor, and she works in a hospital.","B. She is a doctor who works in a hospital.","C. She is a doctor but she works in a hospital.","D. She is a doctor so she works in a hospital."],"answer":"B","explain":"Dùng mệnh đề quan hệ 'who' → câu phức.","points":0.25},{"type":"mcq","level":"VD","q":"Being a nurse is tiring; ______, the salary is low.","options":["A. moreover","B. because","C. although","D. when"],"answer":"A","explain":"Trạng từ liên kết bổ sung ý → moreover (hơn nữa); đây là câu ghép.","points":0.25},{"type":"mcq","level":"TH","q":"A: When is the deadline? B: ______","options":["A. Next Friday.","B. I do not know.","C. Goodbye.","D. What deadline?"],"answer":"A","explain":"Trả lời hạn chót là thứ Sáu tới.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nWriting a good CV is important. It should be short and clear. List your education and work experience. Do not lie about your skills. Check spelling carefully before sending it.","statements":["a) A CV should be short and clear.","b) List education and experience.","c) You can lie about skills.","d) Check spelling before sending."],"answer":["T","T","F","T"],"explain":"c) Sai: không được nói dối về kỹ năng.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: He works ______ to support his family.","answer":"overtime","explain":"Anh ấy làm thêm giờ để nuôi gia đình → overtime.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: She is a very ______ (ambition) student.","answer":"ambitious","explain":"Cần tính từ → ambitious.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["employer","người sử dụng lao động"],["employee","người lao động"],["bonus","tiền thưởng"],["candidate","ứng viên"],["overtime","làm thêm giờ"]],"explain":"employer = người sử dụng lao động; employee = người lao động; bonus = tiền thưởng; candidate = ứng viên; overtime = làm thêm giờ.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["He","works","overtime","every","week"],"explain":"He works overtime every week. (Anh ấy làm thêm giờ mỗi tuần.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Many students do part-time jobs. They work in cafes, shops or as tutors. Part-time jobs give them experience and extra money. However, they should not let work affect their studies. Balancing work and study is important.","sub_questions":[{"q":"Where do students work part-time?","options":["A. In cafes, shops or as tutors.","B. In factories only.","C. In hospitals.","D. At home."],"answer":"A"},{"q":"What should students remember?","options":["A. Not to let work affect studies.","B. To quit school.","C. To work full-time.","D. To earn a lot."],"answer":"A"}],"explain":"Đoạn văn nói sinh viên làm thêm ở quán cà phê, cửa hàng, gia sư và không để việc làm ảnh hưởng học tập.","points":1}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'i' is pronounced differently from the others.","options":["A. resign","B. interview","C. shift","D. skill"],"answer":"A","explain":"Chữ 'i' trong interview, shift, skill phát âm là /ɪ/, còn trong resign là /aɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. employer","B. employ","C. enjoy","D. offer"],"answer":"D","explain":"offer nhấn âm 1 (ˈɒfə), còn employer, employ, enjoy nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"A ______ is money paid every month for work.","options":["A. salary","B. bonus","C. wage","D. pension"],"answer":"A","explain":"Lương là tiền trả hàng tháng cho công việc → salary.","points":0.25},{"type":"mcq","level":"TH","q":"______ I was younger, I wanted to become a driver.","options":["A. When","B. And","C. But","D. So"],"answer":"A","explain":"Mệnh đề thời gian → câu phức với 'when'.","points":0.25},{"type":"mcq","level":"VD","q":"Not only did he arrive late, ______ he forgot his CV.","options":["A. and","B. but also","C. because","D. although"],"answer":"B","explain":"Cặp liên từ not only... but also; đảo ngữ ở vế đầu.","points":0.25},{"type":"mcq","level":"TH","q":"A: Could you tell me about the vacancy? B: ______","options":["A. It's a part-time sales job.","B. I do not know.","C. Goodbye.","D. No problem."],"answer":"A","explain":"Mô tả vị trí trống là công việc bán hàng bán thời gian.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nWork-life balance means giving time to both work and family. Many people work long hours and feel stressed. Companies now offer flexible hours. Employees can sometimes work from home. Happy workers are more productive.","statements":["a) Work-life balance covers work and family.","b) Long hours cause stress.","c) Companies never offer flexible hours.","d) Happy workers are more productive."],"answer":["T","T","F","T"],"explain":"c) Sai: nhiều công ty cho phép giờ làm linh hoạt.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The ______ asked me many questions.","answer":"interviewer","explain":"Người phỏng vấn hỏi tôi nhiều câu hỏi → interviewer.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: He was ______ (promotion) to manager last month.","answer":"promoted","explain":"Câu bị động quá khứ đơn → promoted.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["profession","nghề nghiệp"],["application","đơn xin việc"],["wage","tiền công"],["retire","nghỉ hưu"],["shift","ca làm việc"]],"explain":"profession = nghề nghiệp; application = đơn xin việc; wage = tiền công; retire = nghỉ hưu; shift = ca làm việc.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Although","he","was","tired","he","finished","early"],"explain":"Although he was tired, he finished early. (Mặc dù mệt, anh ấy vẫn xong sớm.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: What does your father do? B: He's an engineer. A: Does he like his job? B: Yes, but he often works overtime. A: That's tiring. B: He says the salary is good, so it's worth it.","sub_questions":[{"q":"What is B's father?","options":["A. An engineer.","B. A teacher.","C. A doctor.","D. A driver."],"answer":"A"},{"q":"Why does he accept overtime?","options":["A. The salary is good.","B. He loves working.","C. He has no choice.","D. His boss asks."],"answer":"A"}],"explain":"Hội thoại nói bố của B là kỹ sư và chấp nhận làm thêm vì lương tốt.","points":1}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'e' is pronounced differently from the others.","options":["A. pension","B. benefit","C. career","D. letter"],"answer":"C","explain":"Chữ 'e' trong pension, benefit, letter phát âm là /e/, còn trong career là /ɪə/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. candidate","B. vacancy","C. labour","D. recruit"],"answer":"D","explain":"recruit nhấn âm 2 (rɪˈkruːt), còn candidate, vacancy, labour nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"After 30 years of work, he decided to ______.","options":["A. retire","B. resign","C. apply","D. recruit"],"answer":"A","explain":"Sau 30 năm làm việc, ông quyết định nghỉ hưu → retire.","points":0.25},{"type":"mcq","level":"TH","q":"The salary is low; ______, the hours are long.","options":["A. because","B. moreover","C. although","D. when"],"answer":"B","explain":"Trạng từ liên kết bổ sung → moreover; câu ghép.","points":0.25},{"type":"mcq","level":"VD","q":"Choose the simple sentence.","options":["A. She is a doctor, and he is a teacher.","B. Because she studied hard, she passed.","C. The tall man is my uncle.","D. Although it rained, we went out."],"answer":"C","explain":"Chỉ có một mệnh đề độc lập → câu đơn.","points":0.25},{"type":"mcq","level":"TH","q":"A: I'm looking for a part-time job. B: ______","options":["A. Try the new cafe downtown.","B. I do not work.","C. Goodbye.","D. What a pity!"],"answer":"A","explain":"Gợi ý thử quán cà phê mới ở trung tâm.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nInternships help students gain experience. Interns work in real companies for a short time. They learn skills and meet professionals. Some interns get full-time jobs later. Internships are popular with university students.","statements":["a) Internships give students experience.","b) Interns work in real companies.","c) Interns never get jobs.","d) Internships are popular with students."],"answer":["T","T","F","T"],"explain":"c) Sai: một số thực tập sinh được nhận làm chính thức sau này.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: He ______ from his job last month.","answer":"resigned","explain":"Anh ấy đã từ chức tháng trước → resigned.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The job requires two years of ______ (experienced).","answer":"experience","explain":"Cần danh từ → experience.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["recruit","tuyển dụng"],["deadline","hạn chót"],["experience","kinh nghiệm"],["ambitious","đầy tham vọng"],["promotion","sự thăng chức"]],"explain":"recruit = tuyển dụng; deadline = hạn chót; experience = kinh nghiệm; ambitious = đầy tham vọng; promotion = sự thăng chức.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Because","he","was","late","he","missed","the","bus"],"explain":"Because he was late, he missed the bus. (Vì anh ấy muộn nên đã lỡ xe buýt.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Freelancers work for themselves, not for a company. They can choose their projects and working hours. Many freelancers work from home using computers. However, their income is not stable. They must find their own clients.","sub_questions":[{"q":"What is an advantage of freelancing?","options":["A. Choosing projects and hours.","B. High stable salary.","C. Free holidays.","D. Company car."],"answer":"A"},{"q":"What is a disadvantage?","options":["A. Boring work.","B. Unstable income.","C. Long travel.","D. Strict boss."],"answer":"B"}],"explain":"Đoạn văn nói freelancer được chọn dự án, giờ giấc nhưng thu nhập không ổn định.","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'oo' is pronounced differently from the others.","options":["A. choose","B. good","C. room","D. school"],"answer":"B","explain":"'oo' trong choose, room, school phát âm là /uː/, còn trong good là /ʊ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. resign","B. retire","C. reward","D. table"],"answer":"D","explain":"table nhấn âm 1 (ˈteɪbəl), còn resign, retire, reward nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"A ______ is extra money paid for good work.","options":["A. bonus","B. salary","C. wage","D. tax"],"answer":"A","explain":"Tiền thưởng là khoản tiền thêm cho công việc tốt → bonus.","points":0.25},{"type":"mcq","level":"TH","q":"He was tired, ______ he finished the report.","options":["A. because","B. yet","C. when","D. although"],"answer":"B","explain":"Hai mệnh đề độc lập tương phản → câu ghép với 'yet'.","points":0.25},{"type":"mcq","level":"VD","q":"Hardly had he finished the interview ______ they called his name.","options":["A. than","B. when","C. then","D. so"],"answer":"B","explain":"Cấu trúc đảo ngữ: Hardly... when...","points":0.25},{"type":"mcq","level":"TH","q":"A: What are your strengths? B: ______","options":["A. I'm hardworking and creative.","B. I like football.","C. I'm fine.","D. Goodbye."],"answer":"A","explain":"Trả lời điểm mạnh khi phỏng vấn: chăm chỉ và sáng tạo.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nMany women now have successful careers. They work as doctors, engineers and leaders. In the past, few women went to work. Today, companies value both men and women. Equal opportunities help society develop.","statements":["a) Many women have successful careers now.","b) Women work in many professions.","c) In the past, many women worked.","d) Equal opportunities help society."],"answer":["T","T","F","T"],"explain":"c) Sai: ngày xưa ít phụ nữ đi làm.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The company offers a high ______ to attract talent.","answer":"salary","explain":"Công ty trả lương cao để thu hút nhân tài → salary.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: She works as a ______ (profession) photographer.","answer":"professional","explain":"Cần tính từ → professional (chuyên nghiệp).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["interview","phỏng vấn"],["bonus","tiền thưởng"],["retire","nghỉ hưu"],["shift","ca làm việc"],["application","đơn xin việc"]],"explain":"interview = phỏng vấn; bonus = tiền thưởng; retire = nghỉ hưu; shift = ca làm việc; application = đơn xin việc.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["I","wanted","to","become","a","doctor"],"explain":"I wanted to become a doctor. (Tôi đã muốn trở thành bác sĩ.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Why do you want this job? B: I love working with children. A: Do you have experience? B: Yes, I taught at a summer camp for two years. A: That's great. When can you start? B: Next Monday.","sub_questions":[{"q":"Why does B want the job?","options":["A. She loves working with children.","B. The salary is high.","C. It is near her home.","D. Her friend works there."],"answer":"A"},{"q":"When can B start?","options":["A. Tomorrow.","B. Next Monday.","C. Next month.","D. Immediately."],"answer":"B"}],"explain":"Hội thoại phỏng vấn: B yêu thích làm việc với trẻ em và có thể bắt đầu thứ Hai tới.","points":1}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ch' is pronounced differently from the others.","options":["A. challenge","B. architect","C. choice","D. chance"],"answer":"B","explain":"'ch' trong challenge, choice, chance phát âm là /tʃ/, còn trong architect là /k/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. profession","B. passion","C. doctor","D. farmer"],"answer":"A","explain":"profession nhấn âm 2 (prəˈfeʃn), còn passion, doctor, farmer nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"Night ______ workers often earn extra pay.","options":["A. shift","B. salary","C. bonus","D. job"],"answer":"A","explain":"Công nhân ca đêm thường được trả thêm → shift.","points":0.25},{"type":"mcq","level":"TH","q":"The candidate ______ arrived early impressed the employer.","options":["A. who","B. and","C. but","D. so"],"answer":"A","explain":"Mệnh đề quan hệ → câu phức với 'who'.","points":0.25},{"type":"mcq","level":"VD","q":"Choose the compound sentence.","options":["A. She sings well.","B. When she sings, everyone listens.","C. She sings well, and she dances beautifully.","D. Because she sings well, she is famous."],"answer":"C","explain":"Hai mệnh đề độc lập nối bằng 'and' → câu ghép.","points":0.25},{"type":"mcq","level":"TH","q":"A: Do you enjoy your job? B: ______","options":["A. Yes, it's meaningful.","B. No, I hate it.","C. I work hard.","D. Goodbye."],"answer":"A","explain":"Trả lời thích công việc vì nó ý nghĩa.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nAutomation is changing the world of work. Robots do simple and dangerous jobs. Some workers worry about losing jobs. However, new jobs appear in technology. Workers need to learn new skills.","statements":["a) Automation is changing work.","b) Robots do dangerous jobs.","c) No new jobs appear.","d) Workers need new skills."],"answer":["T","T","F","T"],"explain":"c) Sai: công việc mới xuất hiện trong lĩnh vực công nghệ.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Please submit your application before the ______.","answer":"deadline","explain":"Hãy nộp đơn trước hạn chót → deadline.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The manager praised his ______ (dedicate).","answer":"dedication","explain":"Sau tính từ sở hữu 'his' cần danh từ → dedication.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["career","sự nghiệp"],["employer","người sử dụng lao động"],["wage","tiền công"],["deadline","hạn chót"],["ambitious","đầy tham vọng"]],"explain":"career = sự nghiệp; employer = người sử dụng lao động; wage = tiền công; deadline = hạn chót; ambitious = đầy tham vọng.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["The","salary","is","low","but","rewarding"],"explain":"The salary is low but rewarding. (Lương thấp nhưng xứng đáng.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Choosing subjects at school affects your future career. If you like science, you can become a doctor or engineer. If you love art, design might suit you. Talk to teachers and parents. They can give useful advice about careers.","sub_questions":[{"q":"What affects your future career?","options":["A. Choosing school subjects.","B. Choosing friends.","C. Choosing clothes.","D. Choosing food."],"answer":"A"},{"q":"Who can give useful career advice?","options":["A. Teachers and parents.","B. Strangers.","C. Classmates only.","D. Nobody."],"answer":"A"}],"explain":"Đoạn văn nói chọn môn học ảnh hưởng nghề nghiệp tương lai và thầy cô, cha mẹ cho lời khuyên hữu ích.","points":1}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'th' is pronounced differently from the others.","options":["A. growth","B. month","C. smooth","D. think"],"answer":"C","explain":"'th' trong growth, month, think phát âm là /θ/ (vô thanh), còn trong smooth là /ð/ (hữu thanh) nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. overtime","B. deadline","C. daytime","D. alone"],"answer":"D","explain":"alone nhấn âm 2 (əˈləʊn), còn overtime, deadline, daytime nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"She decided to ______ her own business.","options":["A. start","B. resign","C. retire","D. finish"],"answer":"A","explain":"Cô ấy quyết định khởi nghiệp kinh doanh riêng → start.","points":0.25},{"type":"mcq","level":"TH","q":"I wanted to become a driver ______ I was younger.","options":["A. and","B. when","C. but","D. so"],"answer":"B","explain":"Mệnh đề thời gian → câu phức với 'when'.","points":0.25},{"type":"mcq","level":"VD","q":"______ the rain, the workers continued building.","options":["A. Because","B. Despite","C. Although","D. When"],"answer":"B","explain":"Despite + cụm danh từ (the rain) → câu đơn có cụm trạng ngữ.","points":0.25},{"type":"mcq","level":"TH","q":"A: Can I take a day off tomorrow? B: ______","options":["A. Sure, no problem.","B. No way.","C. I am busy.","D. Goodbye."],"answer":"A","explain":"Đồng ý cho nghỉ một ngày → Sure, no problem.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nStarting a business is challenging. Entrepreneurs need ideas, money and courage. Many startups fail in the first year. However, successful businesses create jobs. Hard work and good planning are keys to success.","statements":["a) Starting a business is easy.","b) Entrepreneurs need ideas and money.","c) Many startups fail early.","d) Planning is key to success."],"answer":["F","T","T","T"],"explain":"a) Sai: khởi nghiệp đầy thách thức.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: He is looking ______ a new job.","answer":"for","explain":"Cụm từ: look for (tìm kiếm).","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The interview was ______ (stress) but successful.","answer":"stressful","explain":"Cần tính từ → stressful.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["salary","lương"],["employee","người lao động"],["recruit","tuyển dụng"],["experience","kinh nghiệm"],["vacancy","vị trí trống"]],"explain":"salary = lương; employee = người lao động; recruit = tuyển dụng; experience = kinh nghiệm; vacancy = vị trí trống.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Hard","work","leads","to","success"],"explain":"Hard work leads to success. (Chăm chỉ dẫn đến thành công.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: What time do you start work? B: At 8 a.m. I work the morning shift. A: When do you finish? B: At 4 p.m. A: Do you like shift work? B: Yes, I have free afternoons for my family.","sub_questions":[{"q":"What shift does B work?","options":["A. The morning shift.","B. The night shift.","C. The afternoon shift.","D. No shift."],"answer":"A"},{"q":"Why does B like shift work?","options":["A. Free afternoons for family.","B. High salary.","C. Easy work.","D. Good food."],"answer":"A"}],"explain":"Hội thoại nói B làm ca sáng từ 8 giờ đến 4 giờ chiều và thích vì có buổi chiều cho gia đình.","points":1}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 's' is pronounced differently from the others.","options":["A. salary","B. skill","C. busy","D. shift"],"answer":"C","explain":"Chữ 's' trong salary, skill, shift phát âm là /s/, còn trong busy là /z/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. experience","B. ambitious","C. asleep","D. honest"],"answer":"D","explain":"honest nhấn âm 1 (ˈɒnɪst), còn experience, ambitious, asleep nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"The ______ offers training courses for new staff.","options":["A. employer","B. employee","C. candidate","D. worker"],"answer":"A","explain":"Nhà tuyển dụng mở khóa đào tạo cho nhân viên mới → employer.","points":0.25},{"type":"mcq","level":"TH","q":"Because he is often late, he is never ______.","options":["A. promote","B. promoted","C. promoting","D. promotion"],"answer":"B","explain":"Câu bị động: is never promoted (không bao giờ được thăng chức).","points":0.25},{"type":"mcq","level":"VD","q":"Choose the complex sentence.","options":["A. I like tea and coffee.","B. She studied hard, so she passed.","C. Although he was sick, he went to work.","D. He came, he saw, he conquered."],"answer":"C","explain":"Mệnh đề nhượng bộ 'although' + mệnh đề chính → câu phức.","points":0.25},{"type":"mcq","level":"TH","q":"A: How much is the salary? B: ______","options":["A. Two million dong a month.","B. Very high.","C. I do not know.","D. Goodbye."],"answer":"A","explain":"Trả lời mức lương cụ thể.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nDoctors and nurses work long hours. They take care of sick people every day. Their job is stressful but meaningful. Many people respect health workers. During difficult times, they are heroes.","statements":["a) Health workers work long hours.","b) Their job is meaningless.","c) People respect health workers.","d) They are heroes in difficult times."],"answer":["T","F","T","T"],"explain":"b) Sai: công việc của họ căng thẳng nhưng ý nghĩa.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: She has five years of teaching ______.","answer":"experience","explain":"Cô ấy có 5 năm kinh nghiệm giảng dạy → experience.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The new policy will ______ (benefit) workers.","answer":"benefit","explain":"Sau 'will' cần động từ nguyên thể → benefit.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["resign","từ chức"],["candidate","ứng viên"],["promotion","sự thăng chức"],["profession","nghề nghiệp"],["overtime","làm thêm giờ"]],"explain":"resign = từ chức; candidate = ứng viên; promotion = sự thăng chức; profession = nghề nghiệp; overtime = làm thêm giờ.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["They","work","hard","and","earn","well"],"explain":"They work hard and earn well. (Họ làm việc chăm chỉ và kiếm tiền tốt.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Job fairs help students meet employers. Companies set up booths at universities. Students can ask about vacancies and submit CVs. Some students get interviews on the spot. Job fairs happen twice a year in big cities.","sub_questions":[{"q":"What can students do at job fairs?","options":["A. Ask about vacancies and submit CVs.","B. Take exams.","C. Buy books.","D. Watch films."],"answer":"A"},{"q":"How often do job fairs happen?","options":["A. Twice a year.","B. Once a month.","C. Every week.","D. Once a year."],"answer":"A"}],"explain":"Đoạn văn nói sinh viên hỏi về vị trí trống, nộp CV và hội chợ việc làm diễn ra 2 lần/năm.","points":1}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ea' is pronounced differently from the others.","options":["A. team","B. dream","C. great","D. deal"],"answer":"C","explain":"'ea' trong team, dream, deal phát âm là /iː/, còn trong great là /eɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. teamwork","B. workplace","C. software","D. well-known"],"answer":"D","explain":"well-known nhấn âm 2 (ˌwelˈnəʊn), còn teamwork, workplace, software nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"Teachers need ______ to manage big classes.","options":["A. skills","B. salaries","C. bonuses","D. holidays"],"answer":"A","explain":"Giáo viên cần kỹ năng để quản lý lớp đông → skills.","points":0.25},{"type":"mcq","level":"TH","q":"The meeting was boring, ______ I stayed until the end.","options":["A. because","B. so","C. but","D. when"],"answer":"C","explain":"Hai mệnh đề độc lập tương phản → câu ghép với 'but'.","points":0.25},{"type":"mcq","level":"VD","q":"______ you work hard, you will succeed.","options":["A. Although","B. If","C. Because","D. When"],"answer":"B","explain":"Câu điều kiện loại 1 → câu phức với 'if'.","points":0.25},{"type":"mcq","level":"TH","q":"A: I got the job! B: ______","options":["A. Congratulations!","B. Good luck.","C. I'm sorry.","D. Goodbye."],"answer":"A","explain":"Chúc mừng khi ai đó được nhận việc → Congratulations!","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nChoosing a career takes time. Students should explore different jobs. Talking to professionals helps a lot. Trying part-time work gives real experience. Parents and teachers can also give advice.","statements":["a) Choosing a career takes time.","b) Students should explore jobs.","c) Part-time work gives experience.","d) Nobody can give advice."],"answer":["T","T","T","F"],"explain":"d) Sai: cha mẹ và thầy cô có thể cho lời khuyên.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: She wants to ______ a doctor in the future.","answer":"become","explain":"Cô ấy muốn trở thành bác sĩ → become.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The company will ______ (recruitment) 50 workers.","answer":"recruit","explain":"Sau 'will' cần động từ nguyên thể → recruit.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["interview","phỏng vấn"],["employer","người sử dụng lao động"],["shift","ca làm việc"],["wage","tiền công"],["promotion","sự thăng chức"]],"explain":"interview = phỏng vấn; employer = người sử dụng lao động; shift = ca làm việc; wage = tiền công; promotion = sự thăng chức.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["If","you","work","hard","you","will","succeed"],"explain":"If you work hard, you will succeed. (Nếu bạn chăm chỉ, bạn sẽ thành công.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: I'm nervous about my interview. B: Don't worry. Just be yourself. A: What should I wear? B: Something neat and simple. A: Should I bring my CV? B: Yes, and arrive 15 minutes early.","sub_questions":[{"q":"What advice does B give about clothes?","options":["A. Something neat and simple.","B. Expensive clothes.","C. Casual clothes.","D. A uniform."],"answer":"A"},{"q":"How early should A arrive?","options":["A. 5 minutes.","B. 15 minutes.","C. 30 minutes.","D. One hour."],"answer":"B"}],"explain":"Hội thoại nói B khuyên mặc gọn gàng, đơn giản và đến sớm 15 phút.","points":1}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ou' is pronounced differently from the others.","options":["A. young","B. proud","C. hour","D. sound"],"answer":"A","explain":"'ou' trong proud, hour, sound phát âm là /aʊ/, còn trong young là /ʌ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. flexible","B. fluent","C. frequent","D. mature"],"answer":"D","explain":"mature nhấn âm 2 (məˈtʃʊə), còn flexible, fluent, frequent nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"A good ______ always meets deadlines.","options":["A. employee","B. employer","C. candidate","D. manager"],"answer":"A","explain":"Nhân viên tốt luôn kịp hạn chót → employee.","points":0.25},{"type":"mcq","level":"TH","q":"She saved money ______ she could buy a new laptop.","options":["A. because","B. so that","C. although","D. and"],"answer":"B","explain":"Mệnh đề mục đích → câu phức với 'so that'.","points":0.25},{"type":"mcq","level":"VD","q":"No sooner had she resigned ______ she found a better job.","options":["A. than","B. when","C. then","D. so"],"answer":"A","explain":"Cấu trúc đảo ngữ: No sooner... than...","points":0.25},{"type":"mcq","level":"TH","q":"A: See you tomorrow at the office. B: ______","options":["A. See you.","B. Good night.","C. Goodbye forever.","D. I'm busy."],"answer":"A","explain":"Chào tạm biệt hẹn gặp lại → See you.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nRetirement is the end of working life. Many people retire at 60. Retired people have more free time. They can travel, garden or look after grandchildren. Good health makes retirement enjoyable.","statements":["a) Retirement ends working life.","b) Many retire at 60.","c) Retired people have less free time.","d) Good health helps retirement."],"answer":["T","T","F","T"],"explain":"c) Sai: người về hưu có nhiều thời gian rảnh hơn.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: He applied ______ three jobs last week.","answer":"for","explain":"Cụm từ: apply for (ứng tuyển).","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: Working from home requires strong ______ (disciplined).","answer":"discipline","explain":"Cần danh từ → discipline (kỷ luật).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["career","sự nghiệp"],["bonus","tiền thưởng"],["retire","nghỉ hưu"],["recruit","tuyển dụng"],["deadline","hạn chót"]],"explain":"career = sự nghiệp; bonus = tiền thưởng; retire = nghỉ hưu; recruit = tuyển dụng; deadline = hạn chót.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["She","studies","hard","so","she","will","pass"],"explain":"She studies hard, so she will pass. (Cô ấy học chăm nên sẽ đỗ.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Working from home is popular now. People save time on travel. They can wear comfortable clothes. However, they may feel lonely. Good internet and self-discipline are important for home workers.","sub_questions":[{"q":"What is an advantage of working from home?","options":["A. Saving travel time.","B. Higher salary.","C. More holidays.","D. Free food."],"answer":"A"},{"q":"What is important for home workers?","options":["A. Good internet and self-discipline.","B. Big houses.","C. New cars.","D. Many friends."],"answer":"A"}],"explain":"Đoạn văn nói làm việc tại nhà tiết kiệm thời gian đi lại; cần internet tốt và kỷ luật.","points":1}]}]}
