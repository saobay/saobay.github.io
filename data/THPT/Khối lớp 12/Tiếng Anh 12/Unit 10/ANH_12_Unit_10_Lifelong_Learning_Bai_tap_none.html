{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ea' is pronounced differently from the others.","options":["A. learn","B. early","C. great","D. earth"],"answer":"C","explain":"'ea' trong learn, early, earth phát âm là /ɜː/, còn trong great là /eɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. knowledge","B. skill","C. study","D. improve"],"answer":"D","explain":"improve nhấn âm 2 (ɪmˈpruːv), còn knowledge, skill, study nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"Lifelong learning helps us ______ with changes.","options":["A. adapt","B. stop","C. forget","D. fail"],"answer":"A","explain":"Học tập suốt đời giúp thích nghi với thay đổi → adapt.","points":0.25},{"type":"mcq","level":"TH","q":"The ______ you learn, the more you earn.","options":["A. much","B. more","C. most","D. many"],"answer":"B","explain":"So sánh kép: The more..., the more...","points":0.25},{"type":"mcq","level":"VD","q":"The harder you study, the ______ your grades will be.","options":["A. good","B. better","C. best","D. well"],"answer":"B","explain":"So sánh kép: the harder..., the better... (better là so sánh hơn của good).","points":0.25},{"type":"mcq","level":"TH","q":"A: Why do you take evening classes? B: ______","options":["A. To improve my English.","B. I like evenings.","C. I don't know.","D. Goodbye."],"answer":"A","explain":"Học lớp tối để cải thiện tiếng Anh.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nOnline courses are popular now. Students can learn at home any time. There are courses in languages, cooking and technology. Online learning is often cheaper. However, students need self-discipline.","statements":["a) Online courses are popular.","b) Students learn at home.","c) Online learning is expensive.","d) Students need self-dis ":0.25},{"type":"mcq","level":"TH","q":"He wants to ______ his English before the trip.","options":["A. brush up","B. give up","C. look up","D. take up"],"answer":"A","explain":"Anh ấy muốn ôn lại tiếng Anh trước chuyến đi → brush up.","points":0.25},{"type":"mcq","level":"TH","q":"The older he gets, the ______ experienced he becomes.","options":["A. much","B. more","C. most","D. many"],"answer":"B","explain":"So sánh kép: the older..., the more experienced...","points":0.25},{"type":"mcq","level":"VD","q":"The ______ the lesson, the better you understand.","options":["A. much","B. more","C. most","D. many"],"answer":"B","explain":"So sánh kép: the more..., the better... (rút gọn).","points":0.25},{"type":"mcq","level":"TH","q":"A: What is your motivation? B: ______","options":["A. I want a better future.","B. I have no motivation.","C. I don't know.","D. Goodbye."],"answer":"A","explain":"Động lực là muốn có tương lai tốt đẹp hơn.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nEvening classes help working people. They study after work. Subjects include languages and computers. Classes are usually small. Teachers give personal attention.","statements":["a) Evening classes help workers.","b) People study after work.","c) Classes are very large.","d) Teachers give personal attention."],"answer":["T","T","F","T"],"explain":"c) Sai: lớp học thường nhỏ.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: She ______ up Spanish quickly.","answer":"picked","explain":"Cô ấy học lỏm tiếng Tây Ban Nha nhanh → picked up.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The course helped him ______ (widening) his knowledge.","answer":"widen","explain":"Sau 'helped him' cần động từ nguyên thể → widen.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["develop","phát __.","options":["A. the good","B. the better","C. good","D. better"],"answer":"B","explain":"So sánh kép rút gọn: The sooner, the better.","points":0.25},{"type":"mcq","level":"VD","q":"The more expensive the course, ______ the quality.","options":["A. the good","B. the better","C. better","D. best"],"answer":"B","explain":"So sánh kép: the more expensive..., the better...","points":0.25},{"type":"mcq","level":"TH","q":"A: Do you enjoy learning? B: ______","options":["A. Yes, it's fun.","B. No, I hate it.","C. I'm fine.","D. Goodbye."],"answer":"A","explain":"Trả lời thích học vì vui.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nLearning a new language is useful. It helps travel and work. Young children learn languages fast. Adults can learn too with practice. Speaking every day is the key.","statements":["a) New languages are useful.","b) They help travel.","c) Only children can learn.","d) Daily speaking is key."],"answer":["T","T","F","T"],"explain":"c) Sai: người lớn cũng học được nếu luyện tập.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Practice makes ______.","answer":"perfect","explain":"Có công mài sắt, có ngày nên kim → Practice makes perfect.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: She has a thirst for ______ (know).","answer":"knowledge","explain":"Cụm từ: a thirst for knowledge (khao khát tri thức).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["pick up","học lỏm"],["curiosity","sự tò mò"],["eager","háo hức"],["widen","mở rộng"],["experience","kinh nghiệm"]],"explain":"pick up = học lỏm; curiosity = sự tò mò; eager = háo hức; widen = mở rộng; experience = kinh nghiệm.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["The","sooner","we","start","the","better"],"explain":"The sooner we start, the better. (Càng bắt đầu sớm, càng tốt.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Libraries are great for learners. They have thousands of books. Many libraries offer free courses. People can study quietly there. Libraries open new worlds for readers.","sub_questions":[{"q":"What do libraries have?","options":["A. Thousands of books.","B. Few books.","C. Only newspapers.","D. No books."],"answer":"A"},{"q":"What else do libraries offer?","options":["A. Free courses.","B. Paid tours.","C. Food.","D. Jobs."],"answer":"A"}],"explain":"Đoạn văn nói thư viện có hàng nghìn sách và mở khóa học miễn phí.","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'u' is pronounced differently from the others.","options":["A. study","B. much","C. curious","D. fun"],"answer":"C","explain":"Chữ 'u' trong study, much, fun phát âm là /ʌ/, còn trong curious là /ʊə/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. motivation","B. information","C. education","D. knowledge"],"answer":"D","explain":"knowledge nhấn âm 1 (ˈnɒlɪdʒ), còn motivation, information, education nhấn âm 4.","points":0.25},{"type":"mcq","level":"TH","q":"We must ______ with new technology.","options":["A. keep up","B. give up","C. look up","D. take up"],"answer":"A","explain":"Phải theo kịp công nghệ mới → keep up with.","points":0.25},{"type":"mcq","level":"TH","q":"The ______ she practises, the better she sings.","options":["A. much","B. more","C. most","D. many"],"answer":"B","explain":"So sánh kép: the more..., the better...","points":0.25},{"type":"mcq","level":"VD","q":"His English is getting ______ and ______.","options":["A. good / good","B. better / better","C. best / best","D. well / well"],"answer":"B","explain":"Cấu trúc 'ngày càng': better and better.","points":0.25},{"type":"mcq","level":"TH","q":"A: Thank you for teaching me. B: ______","options":["A. You're welcome.","B. I'm fine.","C. Goodbye.","D. See you."],"answer":"A","explain":"Đáp lại lời cảm ơn → You're welcome.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nMOOCs are free online courses. Millions of people take them. Famous universities offer MOOCs. Students learn at their own pace. Certificates are sometimes available.","statements":["a) MOOCs are online courses.","b) Millions take them.","c) Universities offer MOOCs.","d) Students must follow fixed time."],"answer":["T","T","T","F"],"explain":"d) Sai: học viên học theo tốc độ riêng.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: He is ______ to learn new things.","answer":"eager","explain":"Anh ấy háo hức học điều mới → eager.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The workshop was very ______ (inform).","answer":"informative","explain":"Cần tính từ → informative.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["knowledge","kiến thức"],["self-study","tự học"],["adapt","thích nghi"],["motivation","động lực"],["expert","chuyên gia"]],"explain":"knowledge = kiến thức; self-study = tự học; adapt = thích nghi; motivation = động lực; expert = chuyên gia.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["We","must","keep","up","with","changes"],"explain":"We must keep up with changes. (Chúng ta phải theo kịp thay đổi.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Have you finished the course? B: Yes, last week. A: Did you get a certificate? B: Yes! A: Congratulations! B: Thanks. I'm starting a new course soon.","sub_questions":[{"q":"When did B finish the course?","options":["A. Last week.","B. Yesterday.","C. Last month.","D. Today."],"answer":"A"},{"q":"What will B do next?","options":["A. Start a new course.","B. Stop learning.","C. Take a holiday.","D. Find a job."],"answer":"A"}],"explain":"Hội thoại nói B xong khóa học tuần trước, có chứng chỉ và sắp học khóa mới.","points":1}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ch' is pronounced differently from the others.","options":["A. choose","B. change","C. character","D. chance"],"answer":"C","explain":"'ch' trong choose, change, chance phát âm là /tʃ/, còn trong character là /k/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. seminar","B. workshop","C. lecture","D. degree"],"answer":"D","explain":"degree nhấn âm 2 (dɪˈɡriː), còn seminar, workshop, lecture nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"The company offers ______ for its workers.","options":["A. training courses","B. holidays","C. parties","D. gifts"],"answer":"A","explain":"Công ty mở khóa đào tạo cho công nhân → training courses.","points":0.25},{"type":"mcq","level":"TH","q":"______ you practise, the more fluent you become.","options":["A. The much","B. The more","C. More","D. Much"],"answer":"B","explain":"So sánh kép đầy đủ: The more..., the more...","points":0.25},{"type":"mcq","level":"VD","q":"If you practise daily, you ______ improve quickly.","options":["A. will","B. would","C. will have","D. would have"],"answer":"A","explain":"Câu điều kiện loại 1: If + hiện tại đơn, will + V.","points":0.25},{"type":"mcq","level":"TH","q":"A: Excuse me, where is the library? B: ______","options":["A. Over there, next to the park.","B. I don't know.","C. Goodbye.","D. What library?"],"answer":"A","explain":"Chỉ thư viện ở đằng kia, cạnh công viên.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nWorkshops teach practical skills. People learn by doing. Experts show each step. Participants practise together. Everyone leaves with new skills.","statements":["a) Workshops teach practical skills.","b) People learn by doing.","c) Experts guide learners.","d) Nobody learns anything."],"answer":["T","T","T","F"],"explain":"d) Sai: mọi người ra về với kỹ năng mới.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: She learnt English by ______ herself.","answer":"teaching","explain":"Cô ấy tự học tiếng Anh → by teaching herself.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: Learning a language requires ______ (patient).","answer":"patience","explain":"Cần danh từ → patience (sự kiên nhẫn).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["lifelong learning","học tập suốt đời"],["improve","cải thiện"],["opportunity","cơ hội"],["curious","tò mò"],["skill","kỹ năng"]],"explain":"lifelong learning = học tập suốt đời; improve = cải thiện; opportunity = cơ hội; curious = tò mò; skill = kỹ năng.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["If","you","practise","you","will","improve"],"explain":"If you practise, you will improve. (Nếu bạn luyện tập, bạn sẽ tiến bộ.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Learning from experience is powerful. Mistakes teach valuable lessons. Successful people learn from failures. They try again with new ideas. Experience is the best teacher.","sub_questions":[{"q":"What do mistakes teach?","options":["A. Valuable lessons.","B. Nothing.","C. Fear.","D. Anger."],"answer":"A"},{"q":"What do successful people do?","options":["A. Learn from failures.","B. Give up.","C. Blame others.","D. Stop trying."],"answer":"A"}],"explain":"Đoạn văn nói sai lầm dạy bài học quý; người thành công học từ thất bại.","points":1}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'th' is pronounced differently from the others.","options":["A. growth","B. month","C. smooth","D. think"],"answer":"C","explain":"'th' trong growth, month, think phát âm là /θ/ (vô thanh), còn trong smooth là /ð/ (hữu thanh) nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. expert","B. method","C. level","D. excel"],"answer":"D","explain":"excel nhấn âm 2 (ɪkˈsel), còn expert, method, level nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"Curiosity ______ us to explore new things.","options":["A. leads","B. stops","C. forbids","D. leaves"],"answer":"A","explain":"Sự tò mò dẫn dắt ta khám phá → leads.","points":0.25},{"type":"mcq","level":"TH","q":"The less time we have, the ______ we must work.","options":["A. hard","B. harder","C. hardest","D. hardly"],"answer":"B","explain":"So sánh kép: the less..., the harder...","points":0.25},{"type":"mcq","level":"VD","q":"If I had time, I ______ learn piano.","options":["A. will","B. would","C. would have","D. can"],"answer":"B","explain":"Câu điều kiện loại 2: If + quá khứ đơn, would + V.","points":0.25},{"type":"mcq","level":"TH","q":"A: What are you reading? B: ______","options":["A. A book about history.","B. Nothing.","C. I don't read.","D. Goodbye."],"answer":"A","explain":"Trả lời đang đọc sách lịch sử.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nCuriosity drives learning. Curious people ask many questions. They explore and discover. Children are naturally curious. Good teachers encourage curiosity.","statements":["a) Curiosity drives learning.","b) Curious people ask questions.","c) Children lack curiosity.","d) Teachers encourage curiosity."],"answer":["T","T","F","T"],"explain":"c) Sai: trẻ em tò mò một cách tự nhiên.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: She has a ______ for learning languages.","answer":"passion","explain":"Cô ấy có đam mê học ngôn ngữ → passion.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The more you read, the ______ (wide) your knowledge.","answer":"wider","explain":"So sánh kép: the more..., the wider...","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["develop","phát triển"],["keep up with","theo kịp"],["master","làm chủ"],["pick up","học lỏm"],["eager","háo hức"]],"explain":"develop = phát triển; keep up with = theo kịp; master = làm chủ; pick up = học lỏm; eager = háo hức.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["The","less","time","the","harder","we","work"],"explain":"The less time, the harder we work. (Càng ít thời gian, càng phải làm chăm.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Why are you learning Chinese? B: For my new job. A: Is it difficult? B: Yes, but I practise daily. A: How do you practise? B: I use an app and watch films.","sub_questions":[{"q":"Why is A learning Chinese?","options":["A. For a new job.","B. For travel.","C. For fun.","D. For school."],"answer":"A"},{"q":"How does A practise?","options":["A. With an app and films.","B. With a teacher.","C. In class.","D. With books."],"answer":"A"}],"explain":"Hội thoại nói A học tiếng Trung cho công việc mới; luyện bằng app và phim.","points":1}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 's' is pronounced differently from the others.","options":["A. skill","B. master","C. reason","D. course"],"answer":"C","explain":"Chữ 's' trong skill, master, course phát âm là /s/, còn trong reason là /z/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. practise","B. study","C. learn","D. forget"],"answer":"D","explain":"forget nhấn âm 2 (fəˈɡet), còn practise, study, learn nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"He is an ______ in computer science.","options":["A. expert","B. beginner","C. student","D. child"],"answer":"A","explain":"Anh ấy là chuyên gia khoa học máy tính → expert.","points":0.25},{"type":"mcq","level":"TH","q":"The more you practise speaking, the ______ confident you feel.","options":["A. much","B. more","C. most","D. many"],"answer":"B","explain":"So sánh kép: the more..., the more...","points":0.25},{"type":"mcq","level":"VD","q":"If she had studied harder, she ______ passed.","options":["A. will have","B. would have","C. will","D. would"],"answer":"B","explain":"Câu điều kiện loại 3: If + quá khứ hoàn thành, would have + V3.","points":0.25},{"type":"mcq","level":"TH","q":"A: Can you speak English? B: ______","options":["A. Yes, a little.","B. No, never.","C. I'm fine.","D. Goodbye."],"answer":"A","explain":"Trả lời biết một chút tiếng Anh.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nOld people can learn well. Their experience helps them. Learning keeps brains healthy. Many seniors take art classes. Age does not stop learning.","statements":["a) Old people can learn.","b) Experience helps learning.","c) Learning keeps brains healthy.","d) Age stops all learning."],"answer":["T","T","T","F"],"explain":"d) Sai: tuổi tác không ngăn được việc học.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Put what you learn ______ practice.","answer":"into","explain":"Hãy áp dụng điều học vào thực tế → put into practice.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: She speaks English ______ (fluent).","answer":"fluently","explain":"Cần trạng từ → fluently.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["online course","khóa học trực tuyến"],["brush up","ôn lại"],["curiosity","sự tò mò"],["widen","mở rộng"],["experience","kinh nghiệm"]],"explain":"online course = khóa học trực tuyến; brush up = ôn lại; curiosity = sự tò mò; widen = mở rộng; experience = kinh nghiệm.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["If","I","had","time","I","would","learn"],"explain":"If I had time, I would learn. (Nếu có thời gian, tôi sẽ học.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Evening English classes start next week. They run on Mondays and Wednesdays. Each lesson lasts 90 minutes. The teacher is experienced. Registration closes this Friday.","sub_questions":[{"q":"When do classes run?","options":["A. Mondays and Wednesdays.","B. Tuesdays and Thursdays.","C. Weekends.","D. Daily."],"answer":"A"},{"q":"When does registration close?","options":["A. This Friday.","B. Next Monday.","C. Tomorrow.","D. Next month."],"answer":"A"}],"explain":"Đoạn văn nói lớp học tối thứ Hai, thứ Tư; đăng ký hết hạn thứ Sáu này.","points":1}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ou' is pronounced differently from the others.","options":["A. young","B. proud","C. double","D. trouble"],"answer":"B","explain":"'ou' trong young, double, trouble phát âm là /ʌ/, còn trong proud là /aʊ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. widen","B. deepen","C. broaden","D. behind"],"answer":"D","explain":"behind nhấn âm 2 (bɪˈhaɪnd), còn widen, deepen, broaden nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"Reading ______ your knowledge every day.","options":["A. widens","B. closes","C. stops","D. breaks"],"answer":"A","explain":"Đọc sách mở rộng kiến thức mỗi ngày → widens.","points":0.25},{"type":"mcq","level":"TH","q":"The more careful you are, the ______ mistakes you make.","options":["A. few","B. fewer","C. fewest","D. little"],"answer":"B","explain":"So sánh kép: the more careful..., the fewer mistakes...","points":0.25},{"type":"mcq","level":"VD","q":"The weather is getting ______ and ______.","options":["A. cold / cold","B. colder / colder","C. coldest / coldest","D. more cold / more cold"],"answer":"B","explain":"Cấu trúc 'ngày càng': colder and colder.","points":0.25},{"type":"mcq","level":"TH","q":"A: Let's study together. B: ______","options":["A. Good idea!","B. No way.","C. I'm busy.","D. Goodbye."],"answer":"A","explain":"Hưởng ứng đề xuất học cùng nhau → Good idea!","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nLearning never stops. New technology appears every year. Workers learn new skills to keep jobs. Companies train their staff. Everyone benefits from learning.","statements":["a) Learning never stops.","b) Technology changes yearly.","c) Workers learn new skills.","d) Learning harms workers."],"answer":["T","T","T","F"],"explain":"d) Sai: mọi người đều hưởng lợi từ việc học.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: She is ______ in learning.","answer":"interested","explain":"Cô ấy thích học → interested in.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The lesson was ______ (surprise) easy.","answer":"surprisingly","explain":"Cần trạng từ → surprisingly.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["knowledge","kiến thức"],["online course","khóa học trực tuyến"],["adapt","thích nghi"],["curiosity","sự tò mò"],["master","làm chủ"]],"explain":"knowledge = kiến thức; online course = khóa học trực tuyến; adapt = thích nghi; curiosity = sự tò mò; master = làm chủ.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["The","more","careful","the","fewer","mistakes"],"explain":"The more careful, the fewer mistakes. (Càng cẩn thận, càng ít lỗi.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: I failed my driving test. B: Don't worry, try again. A: I practised a lot! B: Maybe take more lessons. A: Good idea. The more I practise, the better I'll drive.","sub_questions":[{"q":"What happened to A?","options":["A. Failed the driving test.","B. Passed the test.","C. Missed the test.","D. Cancelled it."],"answer":"A"},{"q":"What does B suggest?","options":["A. Taking more lessons.","B. Giving up.","C. Driving alone.","D. Waiting a year."],"answer":"A"}],"explain":"Hội thoại nói A trượt thi lái xe; B khuyên học thêm.","points":1}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'oo' is pronounced differently from the others.","options":["A. book","B. look","C. school","D. good"],"answer":"C","explain":"'oo' trong book, look, good phát âm là /ʊ/, còn trong school là /uː/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. review","B. revise","C. repeat","D. reading"],"answer":"D","explain":"reading nhấn âm 1 (ˈriːdɪŋ), còn review, revise, repeat nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"A ______ for knowledge helps us learn forever.","options":["A. thirst","B. hunger","C. need","D. drink"],"answer":"A","explain":"Khao khát tri thức giúp học mãi → a thirst for knowledge.","points":0.25},{"type":"mcq","level":"TH","q":"The ______ people learn, the happier they are.","options":["A. much","B. more","C. most","D. many"],"answer":"B","explain":"So sánh kép: the more..., the happier...","points":0.25},{"type":"mcq","level":"VD","q":"She is the ______ experienced teacher here.","options":["A. much","B. more","C. most","D. many"],"answer":"C","explain":"So sánh nhất → the most experienced.","points":0.25},{"type":"mcq","level":"TH","q":"A: See you next class. B: ______","options":["A. See you!","B. Good night.","C. I'm fine.","D. Thank you."],"answer":"A","explain":"Chào hẹn gặp lại → See you!","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nKnowledge opens doors. Educated people find better jobs. Learning builds confidence. It also brings joy. Everyone should keep learning.","statements":["a) Knowledge opens doors.","b) Educated people find jobs.","c) Learning builds confidence.","d) Learning brings no joy."],"answer":["T","T","T","F"],"explain":"d) Sai: học tập mang lại niềm vui.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The ______ I study, the more I know.","answer":"more","explain":"Càng học, càng biết nhiều → The more...","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: He is a ______ (motivation) speaker.","answer":"motivational","explain":"Cần tính từ → motivational.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["improve","cải thiện"],["self-study","tự học"],["expert","chuyên gia"],["skill","kỹ năng"],["develop","phát triển"]],"explain":"improve = cải thiện; self-study = tự học; expert = chuyên gia; skill = kỹ năng; develop = phát triển.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["The","more","I","study","the","more","I","know"],"explain":"The more I study, the more I know. (Tôi càng học, càng biết nhiều.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Grandma is 70 but still learning. She takes computer classes twice a week. She can now video-call her grandchildren. Learning makes her happy and confident. She is an inspiration to us all.","sub_questions":[{"q":"How old is grandma?","options":["A. 70.","B. 60.","C. 80.","D. 50."],"answer":"A"},{"q":"What can she do now?","options":["A. Video-call grandchildren.","B. Drive a car.","C. Cook well.","D. Swim."],"answer":"A"}],"explain":"Đoạn văn nói bà 70 tuổi học máy tính và giờ gọi video được cho cháu.","points":1}]}]}
