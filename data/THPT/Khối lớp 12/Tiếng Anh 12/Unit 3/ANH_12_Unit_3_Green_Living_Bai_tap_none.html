 bin, plastic in yellow bin.","B. Everything in one bin.","C. They burn rubbish.","D. They throw it away."],"answer":"A"},{"q":"Who helps with recycling in B's family?","options":["A. Only B.","B. B's parents.","C. Everyone, even the little brother.","D. Nobody."],"answer":"C"}],"explain":"Hội thoại nói gia đình B phân loại rác và mọi người, kể cả em trai, đều tham gia.","points":1}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'u' is pronounced differently from the others.","options":["A. reduce","B. reuse","C. public","D. pollute"],"answer":"C","explain":"Chữ 'u' trong reduce, reuse phát âm là /juː/, trong pollute là /uː/, còn trong public là /ʌ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. energy","B. solar","C. carbon","D. preserve"],"answer":"D","explain":"preserve nhấn âm 2 (prɪˈzɜːv), còn energy, solar, carbon nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"We can make ______ from fruit and vegetable waste.","options":["A. compost","B. plastic","C. glass","D. metal"],"answer":"A","explain":"Có thể làm phân ủ từ rác rau củ quả → compost.","points":0.25},{"type":"mcq","level":"TH","q":"They ______ for the Green Ideas competition for a month.","options":["A. prepare","B. have been preparing","C. are preparing","D. prepared"],"answer":"B","explain":"Nhấn mạnh hành động kéo dài liên tục với 'for a month' → hiện tại hoàn thành tiếp diễn.","points":0.25},{"type":"mcq","level":"VD","q":"The river ______ much cleaner since the factory closed.","options":["A. becomes","B. has become","C. is becoming","D. became"],"answer":"B","explain":"Có 'since' + mốc quá khứ → hiện tại hoàn thành.","points":0.25},{"type":"mcq","level":"TH","q":"A: Shall we go by bus today? B: ______","options":["A. Good idea. It reduces pollution.","B. No, I hate buses.","C. Maybe not.","D. What bus?"],"answer":"A","explain":"Đồng ý đi xe buýt turday of March at 8:30 p.m. The event reminds us to save electricity and protect the planet. Even small actions can make a difference.","sub_questions":[{"q":"When does Earth Hour happen?","options":["A. On the last Saturday of March.","B. On the first Sunday of April.","C. Every Friday.","D. On New Year's Day."],"answer":"A"},{"q":"What do people do during Earth Hour?","options":["A. They turn off their lights for one hour.","B. They plant trees.","C. They clean beaches.","D. They drive less."],"answer":"A"}],"explain":"Đoạn văn nói Giờ Trái đất diễn ra thứ Bảy cuối tháng 3 và mọi người tắt đèn một giờ.","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 's' is pronounced differently from the others.","options":["A. sustainable","B. conservation","C. cause","D. solar"],"answer":"C","explain":"Chữ 's' trong sustainable, conservation, solar phát âm là /s/, còn trong cause là /z/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. rubbish","B. litter","C. plastic","D. decay"],"answer":"D","explain":"decay nhấn âm 2 (dɪˈkeɪ), còn rubbish, litter, plastic nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"Factories must reduce their ______ of harmful gases.","options":["A. emissions","B. products","C. workers","D. buildings"],"answer":"A","explain":"Nhà máy phải giảm khí thải khí độc → emissions.","points":0.25},{"type":"mcq","level":"TH","q":"I ______ never ______ such a beautiful eco-park.","options":["A. have / seen","B. did / see","C. am / seeing","D. do / see"],"answer":"A","explain":"Kinh nghiệm với 'never' → hiện tại hoàn thành: have never seen.","points":0.25},{"type":"mcq","level":"VD","q":"Scientists ______ a new way to recycle plastic recently.","options":["A. discover","B. have discovered","C. are discovering","D. discovered"],"answer":"B","explain":"Có 'recently' → hiện tại hoàn thành; hành động vừa hoàn oại rồi trả lời các câu hỏi.","audio_text":"A: Let's go shopping. B: Wait, I'll bring my own bag. A: Why? The shop gives free bags. B: Plastic bags harm the environment. I've used this cloth bag for a year. A: That's a good habit. B: Small actions help a lot!","sub_questions":[{"q":"What will B bring shopping?","options":["A. Her own cloth bag.","B. Nothing.","C. A plastic bag.","D. A basket."],"answer":"A"},{"q":"How long has B used the cloth bag?","options":["A. For a month.","B. For a year.","C. For a week.","D. For a day."],"answer":"B"}],"explain":"Hội thoại nói B mang túi vải riêng và đã dùng nó được một năm.","points":1}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'a' is pronounced differently from the others.","options":["A. waste","B. plant","C. glass","D. grass"],"answer":"A","explain":"Chữ 'a' trong plant, glass, grass phát âm là /ɑː/, còn trong waste là /eɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. healthy","B. planet","C. ocean","D. survive"],"answer":"D","explain":"survive nhấn âm 2 (səˈvaɪv), còn healthy, planet, ocean nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"Organic food is grown without ______.","options":["A. chemicals","B. water","C. sunlight","D. soil"],"answer":"A","explain":"Thực phẩm hữu cơ trồng không dùng hóa chất → chemicals.","points":0.25},{"type":"mcq","level":"TH","q":"Our school ______ a green club recently.","options":["A. starts","B. has started","C. is starting","D. started"],"answer":"B","explain":"Có 'recently' → hiện tại hoàn thành.","points":0.25},{"type":"mcq","level":"VD","q":"By 2030, the city ______ 10,000 new trees.","options":["A. will plant","B. will have planted","C. plants","D. has planted"],"answer":"B","explain":"Hành động sẽ hoàn thành trước một mốc trong tương lai (by 2030) → tương lai hoàn thành.","points":0.25},{"type":"mcq","level":"TH","q":"A: Do you want to join our clean-up day? B: ______","options":["A. Yes, I'd love to.","B. No, I am busy.","C. Maybe later.","D. I do not care."],"answer":"A","explain":"Nhận lời tham gia ngày dọn dẹp → Yes, I'd love to.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nMany people now use electric cars. Electric cars do not release harmful gases. They are quieter than petrol cars. However, they are still expensive for most families. Charging stations are becoming more common in cities.","statements":["a) Electric cars release harmful gases.","b) They are quieter than petrol cars.","c) They are cheap for everyone.","d) Charging stations are more common now."],"answer":["F","T","F","T"],"explain":"a) Sai: xe điện không thải khí độc. c) Sai: xe điện vẫn đắt với đa số gia đình.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Walking to school helps reduce air ______.","answer":"pollution","explain":"Đi bộ đến trường giúp giảm ô nhiễm không khí → pollution.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The students organised a ______ (success) campaign.","answer":"successful","explain":"Cần tính từ bổ nghĩa cho danh từ 'campaign' → successful.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["sustainable","bền vững"],["emission","khí thải"],["solar","thuộc mặt trời"],["litter","rác"],["reuse","tái sử dụng"]],"explain":"sustainable = bền vững; emission = khí thải; solar = thuộc mặt trời; litter = rác; reuse = tái sử dụng.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Have","you","ever","joined","a","clean-up"],"explain":"Have you ever joined a clean-up? (Bạn đã bao giờ tham gia dọn dẹp chưa?)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Composting is easy. You put fruit and vegetable waste in a bin. Small organisms break it down. After a few months, you get rich soil for plants. Many families now compost at home. It reduces waste and helps gardens grow.","sub_questions":[{"q":"What do you put in a compost bin?","options":["A. Fruit and vegetable waste.","B. Plastic and metal.","C. Glass bottles.","D. Old clothes."],"answer":"A"},{"q":"What do you get after a few months?","options":["A. Clean water.","B. Rich soil for plants.","C. New seeds.","D. Fresh air."],"answer":"B"}],"explain":"Đoạn văn nói ủ phân từ rác rau củ quả và sau vài tháng được đất tốt cho cây.","points":1}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ch' is pronounced differently from the others.","options":["A. change","B. chemical","C. choose","D. much"],"answer":"B","explain":"'ch' trong change, choose, much phát âm là /tʃ/, còn trong chemical là /k/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. chemical","B. climate","C. cycle","D. recycle"],"answer":"D","explain":"recycle nhấn âm 3 (ˌriːˈsaɪkəl), còn chemical, climate, cycle nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"The ______ effect causes the Earth to warm up.","options":["A. greenhouse","B. cooling","C. freezing","D. raining"],"answer":"A","explain":"Hiệu ứng nhà kính làm Trái đất nóng lên → greenhouse.","points":0.25},{"type":"mcq","level":"TH","q":"It ______ since morning. Take an umbrella!","options":["A. rains","B. has been raining","C. is raining","D. rained"],"answer":"B","explain":"Nhấn mạnh mưa kéo dài liên tục từ sáng → hiện tại hoàn thành tiếp diễn.","points":0.25},{"type":"mcq","level":"VD","q":"She ______ in this city since she was born.","options":["A. lives","B. has lived","C. is living","D. lived"],"answer":"B","explain":"Có 'since she was born' → hiện tại hoàn thành.","points":0.25},{"type":"mcq","level":"TH","q":"A: What can schools do to go green? B: ______","options":["A. They can plant trees and save electricity.","B. They should use more paper.","C. I do not know.","D. Nothing much."],"answer":"A","explain":"Trường học có thể trồng cây và tiết kiệm điện để sống xanh.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nWater is precious. Many people waste water every day. Taking shorter showers saves a lot of water. Fixing leaking taps is also important. In some countries, people collect rainwater for gardening.","statements":["a) Water is precious.","b) Shorter showers save water.","c) Leaking taps waste water.","d) Nobody collects rainwater."],"answer":["T","T","T","F"],"explain":"d) Sai: ở một số nước người ta hứng nước mưa để tưới vườn.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Please ______ off the tap while brushing your teeth.","answer":"turn","explain":"Hãy khóa vòi nước khi đánh răng → turn off.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The new law aims to reduce carbon ______ (emit).","answer":"emissions","explain":"Cần danh từ số nhiều → emissions (khí thải).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["renewable","tái tạo được"],["greenhouse","nhà kính"],["organic","hữu cơ"],["compost","phân ủ"],["climate","khí hậu"]],"explain":"renewable = tái tạo được; greenhouse = nhà kính; organic = hữu cơ; compost = phân ủ; climate = khí hậu.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["They","have","been","saving","water","for","years"],"explain":"They have been saving water for years. (Họ đã tiết kiệm nước nhiều năm nay.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Why do you cycle to school? B: It keeps me healthy and reduces pollution. A: Isn't it tiring? B: A little, but I've done it for two years. A: Maybe I'll try it too. B: Great! We can cycle together.","sub_questions":[{"q":"Why does B cycle to school?","options":["A. It keeps him healthy and reduces pollution.","B. He has no bus.","C. His bike is new.","D. He likes racing."],"answer":"A"},{"q":"How long has B cycled to school?","options":["A. For two months.","B. For two years.","C. For two weeks.","D. For two days."],"answer":"B"}],"explain":"Hội thoại nói B đạp xe để khỏe mạnh, giảm ô nhiễm và đã làm vậy hai năm.","points":1}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'th' is pronounced differently from the others.","options":["A. earth","B. breathe","C. weather","D. smooth"],"answer":"A","explain":"'th' trong earth phát âm là /θ/ (vô thanh), còn trong breathe, weather, smooth là /ð/ (hữu thanh) nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. container","B. instead","C. become","D. paper"],"answer":"D","explain":"paper nhấn âm 1 (ˈpeɪpə), còn container, instead, become nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"We should use ______ bags instead of plastic ones.","options":["A. reusable","B. expensive","C. heavy","D. small"],"answer":"A","explain":"Nên dùng túi tái sử dụng thay vì túi nhựa → reusable.","points":0.25},{"type":"mcq","level":"TH","q":"The government ______ many campaigns to protect forests.","options":["A. launches","B. has launched","C. is launching","D. launched"],"answer":"B","explain":"Hành động đã xảy ra nhiều lần đến hiện tại (không nêu thời gian cụ thể) → hiện tại hoàn thành.","points":0.25},{"type":"mcq","level":"VD","q":"I ______ my homework yet. Can I finish it tonight?","options":["A. do not finish","B. have not finished","C. am not finishing","D. did not finish"],"answer":"B","explain":"Có 'yet' trong câu phủ định → hiện tại hoàn thành.","points":0.25},{"type":"mcq","level":"TH","q":"A: Excuse me, where can I throw this bottle? B: ______","options":["A. In the recycling bin over there.","B. Anywhere you like.","C. I do not know.","D. Keep it."],"answer":"A","explain":"Chỉ nơi bỏ chai vào thùng tái chế.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nUrban gardening is becoming popular. People grow vegetables on balconies and rooftops. It provides fresh food and cleans the air. Gardening is also relaxing. Many families now grow their own herbs at home.","statements":["a) Urban gardening is becoming popular.","b) People grow vegetables on balconies.","c) It provides fresh food.","d) Gardening is stressful."],"answer":["T","T","T","F"],"explain":"d) Sai: làm vườn giúp thư giãn.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: We picked ______ litter in the park yesterday.","answer":"up","explain":"Cụm từ: pick up (nhặt).","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The campaign raised ______ (aware) of saving water.","answer":"awareness","explain":"Cần danh từ → awareness (nhận thức).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["deforestation","nạn phá rừng"],["conservation","sự bảo tồn"],["eco-friendly","thân thiện môi trường"],["container","vật chứa"],["energy","năng lượng"]],"explain":"deforestation = nạn phá rừng; conservation = sự bảo tồn; eco-friendly = thân thiện môi trường; container = vật chứa; energy = năng lượng.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["The","city","has","become","greener","recently"],"explain":"The city has become greener recently. (Thành phố đã trở nên xanh hơn gần đây.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Many schools have green clubs. Students plant trees in the schoolyard. They also make posters about saving water. Every month, they clean the classrooms using eco-friendly products. These activities teach students to love nature.","sub_questions":[{"q":"What do students do in green clubs?","options":["A. Plant trees and make posters.","B. Play football.","C. Watch films.","D. Sell snacks."],"answer":"A"},{"q":"How often do they clean classrooms?","options":["A. Every week.","B. Every month.","C. Every day.","D. Every year."],"answer":"B"}],"explain":"Đoạn văn nói học sinh trồng cây, làm áp phích và dọn lớp mỗi tháng.","points":1}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'e' is pronounced differently from the others.","options":["A. green","B. reuse","C. renewable","D. keep"],"answer":"C","explain":"Chữ 'e' trong green, reuse, keep phát âm là /iː/, còn trong renewable là /ɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. efficient","B. enough","C. enjoy","D. effort"],"answer":"D","explain":"effort nhấn âm 1 (ˈefət), còn efficient, enough, enjoy nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"Planting trees helps reduce our ______.","options":["A. carbon footprint","B. homework","C. money","D. time"],"answer":"A","explain":"Trồng cây giúp giảm dấu chân carbon → carbon footprint.","points":0.25},{"type":"mcq","level":"TH","q":"______ your room yet? Mum wants to check.","options":["A. Do you clean","B. Have you cleaned","C. Are you cleaning","D. Did you clean"],"answer":"B","explain":"Có 'yet' → hiện tại hoàn thành.","points":0.25},{"type":"mcq","level":"VD","q":"We ______ in this eco-village for five years.","options":["A. live","B. have been living","C. are living","D. lived"],"answer":"B","explain":"Nhấn mạnh sống liên tục 5 năm đến nay → hiện tại hoàn thành tiếp diễn.","points":0.25},{"type":"mcq","level":"TH","q":"A: Can I help you clean the beach? B: ______","options":["A. Sure, thanks a lot!","B. No, go away.","C. I am fine.","D. Maybe not."],"answer":"A","explain":"Nhận lời giúp đỡ một cách vui vẻ → Sure, thanks a lot!","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nComposting turns food waste into rich soil. You need a bin, some soil and food scraps. Small organisms break down the waste. After two or three months, the compost is ready. It helps plants grow without chemicals.","statements":["a) Composting turns food waste into soil.","b) You need a bin and food scraps.","c) Compost is ready after two or three months.","d) Compost needs many chemicals."],"answer":["T","T","T","F"],"explain":"d) Sai: phân ủ giúp cây phát triển mà không cần hóa chất.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The 3Rs are reduce, reuse and ______.","answer":"recycle","explain":"Ba chữ R: giảm thiểu, tái sử dụng và tái chế → recycle.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: She bought ______ (reusable) shopping bags.","answer":"reusable","explain":"Cần tính từ bổ nghĩa cho danh từ 'bags' → reusable.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["pollution","sự ô nhiễm"],["solar","thuộc mặt trời"],["litter","rác"],["climate","khí hậu"],["reduce","giảm thiểu"]],"explain":"pollution = sự ô nhiễm; solar = thuộc mặt trời; litter = rác; climate = khí hậu; reduce = giảm thiểu.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Everyone","can","live","a","greener","life"],"explain":"Everyone can live a greener life. (Ai cũng có thể sống xanh hơn.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Have you heard about the new park? B: Yes, they planted 500 trees there. A: Wow! When did it open? B: Last month. I've visited it twice. A: Is it beautiful? B: Very! There are flowers everywhere and no litter.","sub_questions":[{"q":"How many trees did they plant?","options":["A. 50.","B. 500.","C. 5000.","D. 15."],"answer":"B"},{"q":"How many times has B visited the park?","options":["A. Once.","B. Twice.","C. Three times.","D. Never."],"answer":"B"}],"explain":"Hội thoại nói công viên trồng 500 cây và B đã đến đó hai lần.","points":1}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'oo' is pronounced differently from the others.","options":["A. food","B. foot","C. cool","D. school"],"answer":"B","explain":"'oo' trong food, cool, school phát âm là /uː/, còn trong foot là /ʊ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. volunteer","B. disappear","C. recommend","D. campaign"],"answer":"D","explain":"campaign nhấn âm 2 (kæmˈpeɪn), còn volunteer, disappear, recommend nhấn âm 3.","points":0.25},{"type":"mcq","level":"TH","q":"Using ______ transport helps reduce traffic jams.","options":["A. public","B. private","C. expensive","D. slow"],"answer":"A","explain":"Dùng phương tiện công cộng giúp giảm kẹt xe → public.","points":0.25},{"type":"mcq","level":"TH","q":"Look! The volunteers ______ rubbish on the beach.","options":["A. collect","B. have collected","C. are collecting","D. collected"],"answer":"C","explain":"Có 'Look!' → hành động đang diễn ra → hiện tại tiếp diễn.","points":0.25},{"type":"mcq","level":"VD","q":"This is the most interesting book I ______ about the environment.","options":["A. read","B. have ever read","C. am reading","D. will read"],"answer":"B","explain":"Cấu trúc so sánh nhất + hiện tại hoàn thành: the most... I have ever read.","points":0.25},{"type":"mcq","level":"TH","q":"A: Thank you for joining our green campaign. B: ______","options":["A. My pleasure.","B. Goodbye.","C. I'm busy.","D. See you."],"answer":"A","explain":"Đáp lại lời cảm ơn → My pleasure.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nGreen schools use less energy and water. They have gardens where students learn about nature. Solar panels provide clean electricity. Students bring reusable bottles instead of plastic ones. These schools teach children to protect the planet.","statements":["a) Green schools use less energy.","b) They have gardens for learning.","c) Students use plastic bottles.","d) These schools teach protection of the planet."],"answer":["T","T","F","T"],"explain":"c) Sai: học sinh mang bình tái sử dụng thay vì chai nhựa.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: ______ the tap while brushing your teeth.","answer":"Turn","explain":"Hãy khóa vòi nước khi đánh răng → Turn off (điền Turn).","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The air in the countryside is ______ (pollute) free.","answer":"pollution","explain":"Cần danh từ trong cụm 'pollution free' (không ô nhiễm) → pollution.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["environment","môi trường"],["recycle","tái chế"],["emission","khí thải"],["sustainable","bền vững"],["organic","hữu cơ"]],"explain":"environment = môi trường; recycle = tái chế; emission = khí thải; sustainable = bền vững; organic = hữu cơ.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Small","actions","can","make","a","big","difference"],"explain":"Small actions can make a big difference. (Những hành động nhỏ có thể tạo ra sự khác biệt lớn.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"The city has a new bike-sharing programme. People can rent bikes at stations around the city. It costs very little money. The programme reduces traffic and pollution. Thousands of people have used it since it started last year.","sub_questions":[{"q":"What is the new programme?","options":["A. A bike-sharing programme.","B. A bus programme.","C. A car rental service.","D. A walking club."],"answer":"A"},{"q":"What are the benefits of the programme?","options":["A. It reduces traffic and pollution.","B. It makes money for the city.","C. It builds new roads.","D. It sells bikes."],"answer":"A"}],"explain":"Đoạn văn nói chương trình chia sẻ xe đạp giúp giảm kẹt xe và ô nhiễm.","points":1}]}]}
