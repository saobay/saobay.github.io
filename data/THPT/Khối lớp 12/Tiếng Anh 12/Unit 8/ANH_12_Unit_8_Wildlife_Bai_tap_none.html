{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'i' is pronounced differently from the others.","options":["A. wildlife","B. extinct","C. survive","D. alive"],"answer":"B","explain":"Chữ 'i' trong wildlife, survive, alive phát âm là /aɪ/, còn trong extinct là /ɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. wildlife","B. nature","C. forest","D. protect"],"answer":"D","explain":"protect nhấn âm 2 (prəˈtekt), còn wildlife, nature, forest nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"Tigers are ______ because of illegal hunting.","options":["A. endangered","B. common","C. safe","D. alive"],"answer":"A","explain":"Hổ có nguy cơ tuyệt chủng vì săn bắn trái phép → endangered.","points":0.25},{"type":"mcq","level":"TH","q":"______ we stop poaching, many species will become extinct.","options":["A. Unless","B. If","C. Although","D. Because"],"answer":"A","explain":"Unless = if... not (trừ khi ngừng săn trộm).","points":0.25},{"type":"mcq","level":"VD","q":"There are more endangered species today ______ there were 50 years ago.","options":["A. as","B. than","C. that","D. then"],"answer":"B","explain":"So sánh hơn với 'more' → than.","points":0.25},{"type":"mcq","level":"TH","q":"A: What can we do to protect wildlife? B: ______","options":["A. We can raise awareness and stop buying wild products.","B. We should hunt more.","C. I don't know.","D. Goodbye."],"answer":"A","explain":"Nâng cao nhận thức và ngừng mua sản phẩm từ động vật hoang dã.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nPandas live in the mountains of China. They eat bamboo almost all day. There are only about 1,800 pandas left in the wild. China protects pandas in reserves. Thanks to conservation, their number is growing slowly.","statements":["a) Pandas live in China.","b) They eat bamboo.","c) There are millions of wild pandas.","d) Conservation is helping pandas."],"answer":["T","T","F","T"],"explain":"c) Sai: chỉ còn khoảng 1.800 cá thể trong tự nhiên.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: We must stop illegal ______.","answer":"hunting","explain":"Chúng ta phải ngừng săn bắn trái phép → hunting.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The forest is home to many ______ (endanger) species.","answer":"endangered","explain":"Cần tính từ → endangered species (loài có nguy cơ tuyệt chủng).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["wildlife","động vật hoang dã"],["extinct","tuyệt chủng"],["habitat","môi trường sống"],["poaching","săn bắn trộm"],["protect","bảo vệ"]],"explain":"wildlife = động vật hoang dã; extinct = tuyệt chủng; habitat = môi trường sống; poaching = săn bắn trộm; protect = bảo vệ.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["We","must","protect","wild","animals"],"explain":"We must protect wild animals. (Chúng ta phải bảo vệ động vật hoang dã.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Have you visited Cuc Phuong National Park? B: Yes, last summer. A: What did you see? B: Many monkeys and colourful birds. A: Are there tigers? B: No, but the park protects many rare animals.","sub_questions":[{"q":"When did B visit the park?","options":["A. Last summer.","B. Last winter.","C. Last spring.","D. Last month."],"answer":"A"},{"q":"What does the park protect?","options":["A. Many rare animals.","B. Tigers only.","C. Tourists.","D. Plants only."],"answer":"A"}],"explain":"Hội thoại nói B đi Cúc Phương hè ngoái và vườn quốc gia bảo vệ nhiều loài quý hiếm.","points":1}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'a' is pronounced differently from the others.","options":["A. habitat","B. panda","C. whale","D. capture"],"answer":"C","explain":"Chữ 'a' trong habitat, panda, capture phát âm là /æ/, còn trong whale là /eɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. endangered","B. extinct","C. survive","D. panda"],"answer":"D","explain":"panda nhấn âm 1 (ˈpændə), còn endangered, extinct, survive nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"National parks are safe ______ for wild animals.","options":["A. habitats","B. dangers","C. cages","D. zoos"],"answer":"A","explain":"Vườn quốc gia là môi trường sống an toàn → habitats.","points":0.25},{"type":"mcq","level":"TH","q":"If you don't release the turtle, it ______ soon.","options":["A. dies","B. will die","C. died","D. would die"],"answer":"B","explain":"Câu điều kiện loại 1: If + hiện tại đơn, will + V.","points":0.25},{"type":"mcq","level":"VD","q":"Raising awareness is ______ important ______ imposing strict laws.","options":["A. as / as","B. more / than","C. so / that","D. too / to"],"answer":"A","explain":"So sánh bằng: as + adj + as.","points":0.25},{"type":"mcq","level":"TH","q":"A: Why are rhinos endangered? B: ______","options":["A. Because poachers kill them for their horns.","B. Because they are strong.","C. I don't know.","D. Goodbye."],"answer":"A","explain":"Tê giác nguy cấp vì kẻ săn trộm giết lấy sừng.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nSea turtles lay eggs on beaches. Baby turtles must reach the sea quickly. Many are eaten by birds and crabs. Plastic waste also kills turtles. People protect turtle nests in many countries.","statements":["a) Sea turtles lay eggs on beaches.","b) Baby turtles are always safe.","c) Plastic waste kills turtles.","d) People protect turtle nests."],"answer":["T","F","T","T"],"explain":"b) Sai: rùa con bị chim và cua ăn thịt.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The dodo ______ out in the 17th century.","answer":"died","explain":"Chim dodo tuyệt chủng vào thế kỷ 17 → died out.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: ______ (poach) is a serious crime.","answer":"Poaching","explain":"Cần danh từ làm chủ ngữ → Poaching.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["conservation","sự bảo tồn"],["species","loài"],["reserve","khu bảo tồn"],["survive","sống sót"],["illegal","bất hợp pháp"]],"explain":"conservation = sự bảo tồn; species = loài; reserve = khu bảo tồn; survive = sống sót; illegal = bất hợp pháp.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Unless","we","act","now","they","will","die"],"explain":"Unless we act now, they will die. (Trừ khi hành động ngay, chúng sẽ chết.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Elephants are very intelligent animals. They live in families and care for their babies. Sadly, poachers kill elephants for their tusks. Many countries have banned the ivory trade. Protecting elephants needs everyone's help.","sub_questions":[{"q":"Why do poachers kill elephants?","options":["A. For their tusks.","B. For their meat.","C. For fun.","D. For their skin."],"answer":"A"},{"q":"What have many countries done?","options":["A. Banned the ivory trade.","B. Built more zoos.","C. Killed poachers.","D. Nothing."],"answer":"A"}],"explain":"Đoạn văn nói kẻ săn trộm giết voi lấy ngà và nhiều nước đã cấm buôn bán ngà voi.","points":1}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'o' is pronounced differently from the others.","options":["A. poaching","B. tropical","C. protect","D. control"],"answer":"B","explain":"Chữ 'o' trong poaching, protect, control phát âm là /əʊ/, còn trong tropical là /ɒ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. habitat","B. species","C. jungle","D. behind"],"answer":"D","explain":"behind nhấn âm 2 (bɪˈhaɪnd), còn habitat, species, jungle nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"The ______ of the tiger is the forest.","options":["A. habitat","B. danger","C. cage","D. food"],"answer":"A","explain":"Môi trường sống của hổ là rừng → habitat.","points":0.25},{"type":"mcq","level":"TH","q":"What would you buy ______ you won the lottery?","options":["A. if","B. unless","C. although","D. because"],"answer":"A","explain":"Câu điều kiện loại 2: What would... if you won...?","points":0.25},{"type":"mcq","level":"VD","q":"A monkey is more intelligent ______ you may think.","options":["A. as","B. than","C. that","D. then"],"answer":"B","explain":"So sánh hơn với 'more intelligent' → than + mệnh đề.","points":0.25},{"type":"mcq","level":"TH","q":"A: Is hunting allowed in the reserve? B: ______","options":["A. No, it's strictly forbidden.","B. Yes, anytime.","C. I don't know.","D. Goodbye."],"answer":"A","explain":"Săn bắn bị cấm nghiêm ngặt trong khu bảo tồn.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nRhinos have thick skin and big horns. Poachers kill them for their horns. There are only a few thousand rhinos left. Rangers guard them day and night. Saving rhinos is a difficult task.","statements":["a) Rhinos have big horns.","b) Poachers want their horns.","c) There are millions of rhinos.","d) Rangers protect rhinos."],"answer":["T","T","F","T"],"explain":"c) Sai: chỉ còn vài nghìn cá thể.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: We should take ______ to save wildlife.","answer":"action","explain":"Chúng ta nên hành động để cứu động vật hoang dã → take action.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The government passed a law to protect ______ (endanger) animals.","answer":"endangered","explain":"Cần tính từ → endangered animals.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["biodiversity","đa dạng sinh học"],["sanctuary","khu bảo vệ"],["awareness","nhận thức"],["release","thả"],["tropical","nhiệt đới"]],"explain":"biodiversity = đa dạng sinh học; sanctuary = khu bảo vệ; awareness = nhận thức; release = thả; tropical = nhiệt đới.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["If","we","act","now","we","can","save","them"],"explain":"If we act now, we can save them. (Nếu hành động ngay, chúng ta có thể cứu chúng.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Why do you love dolphins? B: They're smart and friendly. A: Are they in danger? B: Yes, fishing nets and pollution threaten them. A: That's sad. B: We must keep oceans clean.","sub_questions":[{"q":"Why does B love dolphins?","options":["A. They're smart and friendly.","B. They're big.","C. They're colourful.","D. They're fast."],"answer":"A"},{"q":"What threatens dolphins?","options":["A. Fishing nets and pollution.","B. Sharks.","C. Cold water.","D. Noise."],"answer":"A"}],"explain":"Hội thoại nói cá heo thông minh, thân thiện; lưới đánh cá và ô nhiễm đe dọa chúng.","points":1}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'e' is pronounced differently from the others.","options":["A. reserve","B. desert","C. protect","D. level"],"answer":"A","explain":"Chữ 'e' trong desert, protect, level phát âm là /e/, còn trong reserve là /ɜː/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. poaching","B. hunting","C. illegal","D. cruel"],"answer":"C","explain":"illegal nhấn âm 2 (ɪˈliːɡəl), còn poaching, hunting, cruel nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"______ is the variety of life on Earth.","options":["A. Biodiversity","B. Pollution","C. Poaching","D. Hunting"],"answer":"A","explain":"Đa dạng sinh học là sự đa dạng của sự sống → biodiversity.","points":0.25},{"type":"mcq","level":"TH","q":"Provided that we act now, we ______ protect the forest.","options":["A. can","B. can't","C. mustn't","D. shouldn't"],"answer":"A","explain":"Provided that = với điều kiện → can (câu điều kiện loại 1).","points":0.25},{"type":"mcq","level":"VD","q":"Gibbons are as famous for singing ______ for swinging through trees.","options":["A. than","B. as","C. that","D. then"],"answer":"B","explain":"So sánh bằng: as... as.","points":0.25},{"type":"mcq","level":"TH","q":"A: Have you ever seen a tiger? B: ______","options":["A. Yes, in the zoo last year.","B. No, never.","C. I don't like tigers.","D. Goodbye."],"answer":"A","explain":"Trả lời đã thấy hổ ở sở thú năm ngoái.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nOrangutans live in the rainforests of Borneo and Sumatra. They spend most time in trees. Their homes are destroyed for palm oil farms. Baby orangutans often lose their mothers. Rescue centres care for them.","statements":["a) Orangutans live in rainforests.","b) They live mainly in trees.","c) Palm oil farms destroy homes.","d) Rescue centres help babies."],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng theo đoạn văn.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The ranger released the bird back ______ the wild.","answer":"into","explain":"Kiểm lâm thả chim về tự nhiên → back into the wild.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: Hunting these animals is ______ (legal).","answer":"illegal","explain":"Cần tính từ trái nghĩa → illegal (bất hợp pháp).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["threaten","đe dọa"],["hunting","săn bắn"],["campaign","chiến dịch"],["preserve","gìn giữ"],["endangered","có nguy cơ tuyệt chủng"]],"explain":"threaten = đe dọa; hunting = săn bắn; campaign = chiến dịch; preserve = gìn giữ; endangered = có nguy cơ tuyệt chủng.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Provided","that","we","act","we","can","win"],"explain":"Provided that we act, we can win. (Với điều kiện hành động, chúng ta có thể thắng.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Whales are the largest animals on Earth. They sing beautiful songs to communicate. Sadly, oceans are full of plastic. Whales sometimes eat plastic by mistake. Clean oceans mean safe whales.","sub_questions":[{"q":"How do whales communicate?","options":["A. By singing songs.","B. By dancing.","C. By jumping.","D. By colours."],"answer":"A"},{"q":"What danger do whales face?","options":["A. Plastic in oceans.","B. Sharks.","C. Cold water.","D. Loud ships."],"answer":"A"}],"explain":"Đoạn văn nói cá voi giao tiếp bằng tiếng hát và rác nhựa đe dọa chúng.","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'u' is pronounced differently from the others.","options":["A. hunt","B. jungle","C. human","D. cut"],"answer":"C","explain":"Chữ 'u' trong hunt, jungle, cut phát âm là /ʌ/, còn trong human là /juː/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. conservation","B. protection","C. attention","D. pollution"],"answer":"A","explain":"conservation nhấn âm 4 (ˌkɒnsəˈveɪʃn), còn protection, attention, pollution nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"We need to raise people's ______ of wildlife protection.","options":["A. awareness","B. money","C. food","D. fear"],"answer":"A","explain":"Cần nâng cao nhận thức về bảo vệ động vật hoang dã → awareness.","points":0.25},{"type":"mcq","level":"TH","q":"The match will continue ______ it rains.","options":["A. unless","B. if","C. although","D. because"],"answer":"A","explain":"Unless = trừ khi (trận đấu tiếp tục trừ khi trời mưa).","points":0.25},{"type":"mcq","level":"VD","q":"If we had acted sooner, the species ______ survived.","options":["A. will have","B. would have","C. has","D. is"],"answer":"B","explain":"Câu điều kiện loại 3: If + quá khứ hoàn thành, would have + V3.","points":0.25},{"type":"mcq","level":"TH","q":"A: What is your favourite wild animal? B: ______","options":["A. The elephant. It's gentle and smart.","B. I hate animals.","C. I don't know.","D. Goodbye."],"answer":"A","explain":"Trả lời voi vì hiền lành, thông minh.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nCoral reefs are called rainforests of the sea. Thousands of species live there. Rising sea temperatures damage corals. Pollution also harms reefs. Protecting oceans saves coral reefs.","statements":["a) Coral reefs are like sea rainforests.","b) Many species live in reefs.","c) Warm seas damage corals.","d) Oceans need protection."],"answer":["T","T","T","T"],"explain":"Tất cả đều đúng theo đoạn văn.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Do not buy products made ______ wild animals.","answer":"from","explain":"Đừng mua sản phẩm làm từ động vật hoang dã → made from.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The ______ (conserve) of forests is vital.","answer":"conservation","explain":"Cần danh từ → conservation.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["wildlife","động vật hoang dã"],["species","loài"],["poaching","săn bắn trộm"],["illegal","bất hợp pháp"],["protect","bảo vệ"]],"explain":"wildlife = động vật hoang dã; species = loài; poaching = săn bắn trộm; illegal = bất hợp pháp; protect = bảo vệ.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["If","it","rains","we","will","stay","home"],"explain":"If it rains, we will stay home. (Nếu trời mưa, chúng tôi sẽ ở nhà.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Let's join the beach clean-up! B: Good idea. When is it? A: This Sunday at 8 a.m. B: What should I bring? A: Gloves and a hat. B: I'll invite my classmates too.","sub_questions":[{"q":"When is the beach clean-up?","options":["A. This Sunday at 8 a.m.","B. Next Sunday.","C. Tomorrow.","D. Today."],"answer":"A"},{"q":"What should B bring?","options":["A. Gloves and a hat.","B. Food and drinks.","C. A camera.","D. Nothing."],"answer":"A"}],"explain":"Hội thoại nói dọn bãi biển chủ nhật 8 giờ sáng; mang găng tay và mũ.","points":1}]},{"name":"Đề 6","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ch' is pronounced differently from the others.","options":["A. poaching","B. change","C. chain","D. scheme"],"answer":"D","explain":"'ch' trong poaching, change, chain phát âm là /tʃ/, còn trong scheme là /k/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. biodiversity","B. environment","C. awareness","D. campaign"],"answer":"A","explain":"biodiversity nhấn âm 5 (ˌbaɪəʊdaɪˈvɜːsɪti), còn environment, awareness, campaign nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"The government launched a ______ to save the forests.","options":["A. campaign","B. party","C. game","D. film"],"answer":"A","explain":"Chính phủ phát động chiến dịch cứu rừng → campaign.","points":0.25},{"type":"mcq","level":"TH","q":"You can enter the park ______ you buy a ticket.","options":["A. unless","B. as long as","C. although","D. because"],"answer":"B","explain":"As long as = miễn là (bạn có thể vào miễn là mua vé).","points":0.25},{"type":"mcq","level":"VD","q":"The more we protect nature, the ______ our future will be.","options":["A. good","B. better","C. best","D. well"],"answer":"B","explain":"So sánh kép: The more..., the better...","points":0.25},{"type":"mcq","level":"TH","q":"A: Thank you for the gift. B: ______","options":["A. You're welcome.","B. I'm fine.","C. Goodbye.","D. See you."],"answer":"A","explain":"Đáp lại lời cảm ơn → You're welcome.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nCuc Phuong is Vietnam's first national park. It protects many rare animals. The park has a rescue centre for primates. Turtles are also protected there. Thousands of visitors come every year.","statements":["a) Cuc Phuong is Vietnam's first national park.","b) It protects rare animals.","c) There is a primate rescue centre.","d) Nobody visits the park."],"answer":["T","T","T","F"],"explain":"d) Sai: hàng nghìn du khách đến mỗi năm.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Animals in the ______ need our help.","answer":"wild","explain":"Động vật trong tự nhiên cần giúp đỡ → in the wild.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The baby turtle ______ (release) into the sea.","answer":"was released","explain":"Câu bị động quá khứ đơn → was released.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["conservation","sự bảo tồn"],["habitat","môi trường sống"],["reserve","khu bảo tồn"],["extinct","tuyệt chủng"],["survive","sống sót"]],"explain":"conservation = sự bảo tồn; habitat = môi trường sống; reserve = khu bảo tồn; extinct = tuyệt chủng; survive = sống sót.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["The","more","we","protect","the","better"],"explain":"The more we protect, the better. (Càng bảo vệ nhiều, càng tốt.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Tigers are strong and beautiful. They need large forests to live. Sadly, forests are disappearing. Poachers also kill tigers. Without help, wild tigers may die out soon.","sub_questions":[{"q":"What do tigers need?","options":["A. Large forests.","B. Small cages.","C. Zoos.","D. Cities."],"answer":"A"},{"q":"What may happen without help?","options":["A. Wild tigers may die out.","B. Tigers will grow.","C. Forests will grow.","D. Nothing."],"answer":"A"}],"explain":"Đoạn văn nói hổ cần rừng rộng và có thể tuyệt chủng nếu không được giúp.","points":1}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'th' is pronounced differently from the others.","options":["A. threat","B. through","C. other","D. think"],"answer":"C","explain":"'th' trong threat, through, think phát âm là /θ/ (vô thanh), còn trong other là /ð/ (hữu thanh) nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. release","B. return","C. rescue","D. remove"],"answer":"C","explain":"rescue nhấn âm 1 (ˈreskjuː), còn release, return, remove nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"Hunting is ______ in national parks.","options":["A. illegal","B. legal","C. allowed","D. free"],"answer":"A","explain":"Săn bắn là bất hợp pháp trong vườn quốc gia → illegal.","points":0.25},{"type":"mcq","level":"TH","q":"She will help you ______ you ask her.","options":["A. unless","B. if","C. although","D. because"],"answer":"B","explain":"Câu điều kiện loại 1 → if.","points":0.25},{"type":"mcq","level":"VD","q":"He ran ______ fast ______ he won the race.","options":["A. as / as","B. so / that","C. more / than","D. too / to"],"answer":"B","explain":"Cấu trúc so... that (quá... đến nỗi).","points":0.25},{"type":"mcq","level":"TH","q":"A: Excuse me, where is the zoo? B: ______","options":["A. Go straight ahead.","B. I don't know.","C. Goodbye.","D. What zoo?"],"answer":"A","explain":"Chỉ đường đi thẳng.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nBirds are important for nature. They eat insects and spread seeds. Many birds migrate long distances. Pollution and hunting threaten birds. Protecting wetlands helps many bird species.","statements":["a) Birds eat insects.","b) Many birds migrate.","c) Birds face no threats.","d) Wetlands help birds."],"answer":["T","T","F","T"],"explain":"c) Sai: ô nhiễm và săn bắn đe dọa chim.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The law ______ hunting of rare animals.","answer":"bans","explain":"Luật cấm săn bắn động vật quý hiếm → bans.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The ______ (protect) area is closed to visitors.","answer":"protected","explain":"Cần tính từ (quá khứ phân từ) → protected area (khu vực được bảo vệ).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["biodiversity","đa dạng sinh học"],["awareness","nhận thức"],["tropical","nhiệt đới"],["threaten","đe dọa"],["hunting","săn bắn"]],"explain":"biodiversity = đa dạng sinh học; awareness = nhận thức; tropical = nhiệt đới; threaten = đe dọa; hunting = săn bắn.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["You","can","enter","as","long","as","you","pay"],"explain":"You can enter as long as you pay. (Bạn có thể vào miễn là bạn trả tiền.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: What did you learn at the zoo? B: I learnt about pandas. A: Are they endangered? B: Yes, but China protects them well. A: How many are left? B: About 1,800 in the wild.","sub_questions":[{"q":"What did B learn about?","options":["A. Pandas.","B. Tigers.","C. Elephants.","D. Monkeys."],"answer":"A"},{"q":"How many pandas are left in the wild?","options":["A. About 1,800.","B. About 800.","C. About 18,000.","D. About 180."],"answer":"A"}],"explain":"Hội thoại nói B tìm hiểu về gấu trúc; còn khoảng 1.800 cá thể trong tự nhiên.","points":1}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 's' is pronounced differently from the others.","options":["A. species","B. forest","C. reserve","D. release"],"answer":"C","explain":"Chữ 's' trong species, forest, release phát âm là /s/, còn trong reserve là /z/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. tropical","B. fragile","C. gentle","D. unique"],"answer":"D","explain":"unique nhấn âm 2 (juːˈniːk), còn tropical, fragile, gentle nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"The injured bird was taken to a ______.","options":["A. sanctuary","B. market","C. school","D. shop"],"answer":"A","explain":"Chim bị thương được đưa đến khu bảo vệ → sanctuary.","points":0.25},{"type":"mcq","level":"TH","q":"______ it rains, the picnic will be cancelled.","options":["A. If","B. Unless","C. Although","D. Because"],"answer":"A","explain":"Câu điều kiện loại 1 → if.","points":0.25},{"type":"mcq","level":"VD","q":"This test is ______ difficult ______ the last one.","options":["A. as / as","B. more / than","C. so / that","D. too / to"],"answer":"A","explain":"So sánh bằng (ngang nhau) → as... as.","points":0.25},{"type":"mcq","level":"TH","q":"A: Can I help protect wildlife? B: ______","options":["A. Yes, join our volunteer team!","B. No, go away.","C. I don't know.","D. Goodbye."],"answer":"A","explain":"Mời tham gia đội tình nguyện bảo vệ động vật hoang dã.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nDeforestation destroys animal homes. Trees are cut for wood and farms. Many animals cannot find food. Soil washes away without trees. Planting new forests helps wildlife return.","statements":["a) Deforestation destroys homes.","b) Trees are cut for wood.","c) Animals always find food.","d) New forests help wildlife."],"answer":["T","T","F","T"],"explain":"c) Sai: nhiều động vật không tìm được thức ăn.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Breaking the law will ______ punished.","answer":"be","explain":"Phạm luật sẽ bị phạt → will be punished (bị động).","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: Poachers face ______ (punish) by law.","answer":"punishment","explain":"Sau 'face' cần danh từ → punishment.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["sanctuary","khu bảo vệ"],["release","thả"],["campaign","chiến dịch"],["endangered","có nguy cơ tuyệt chủng"],["preserve","gìn giữ"]],"explain":"sanctuary = khu bảo vệ; release = thả; campaign = chiến dịch; endangered = có nguy cơ tuyệt chủng; preserve = gìn giữ.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["This","test","is","as","hard","as","that"],"explain":"This test is as hard as that. (Bài kiểm tra này khó như bài kia.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Rhinos are strong animals with thick skin. Their horns are made of keratin, like our nails. Sadly, poachers kill rhinos for horns. Rangers now guard rhinos day and night. We must stop buying rhino products.","sub_questions":[{"q":"What are rhino horns made of?","options":["A. Keratin.","B. Bone.","C. Wood.","D. Stone."],"answer":"A"},{"q":"What do rangers do?","options":["A. Guard rhinos day and night.","B. Hunt rhinos.","C. Sell horns.","D. Sleep."],"answer":"A"}],"explain":"Đoạn văn nói sừng tê giác làm từ keratin và kiểm lâm canh gác ngày đêm.","points":1}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ea' is pronounced differently from the others.","options":["A. great","B. deal","C. meat","D. team"],"answer":"A","explain":"'ea' trong deal, meat, team phát âm là /iː/, còn trong great là /eɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. survive","B. succeed","C. support","D. suffer"],"answer":"D","explain":"suffer nhấn âm 1 (ˈsʌfə), còn survive, succeed, support nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"Tropical forests are home to thousands of ______.","options":["A. species","B. buildings","C. cars","D. shops"],"answer":"A","explain":"Rừng nhiệt đới là nhà của hàng nghìn loài → species.","points":0.25},{"type":"mcq","level":"TH","q":"We can't release the animals ______ they are fully recovered.","options":["A. if","B. unless","C. although","D. because"],"answer":"B","explain":"Unless = trừ khi (không thể thả trừ khi chúng hồi phục hoàn toàn).","points":0.25},{"type":"mcq","level":"VD","q":"He is taller ______ his brother.","options":["A. as","B. than","C. that","D. then"],"answer":"B","explain":"So sánh hơn → than.","points":0.25},{"type":"mcq","level":"TH","q":"A: Let's visit the zoo this weekend. B: ______","options":["A. Great idea!","B. No way.","C. I'm busy.","D. Goodbye."],"answer":"A","explain":"Hưởng ứng đề xuất đi sở thú → Great idea!","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nZoos keep animals for people to see. Good zoos give animals large spaces. They also help breed rare species. However, some people think animals should live free. Wildlife sanctuaries are better than small cages.","statements":["a) Zoos keep animals for visitors.","b) Good zoos give large spaces.","c) Zoos help breed rare species.","d) Everyone loves small cages."],"answer":["T","T","T","F"],"explain":"d) Sai: khu bảo vệ tốt hơn chuồng nhỏ.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The more trees we plant, the ______ the air.","answer":"cleaner","explain":"Càng trồng nhiều cây, không khí càng sạch → the cleaner (so sánh kép).","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The young ranger showed great ______ (brave).","answer":"bravery","explain":"Cần danh từ → bravery (lòng dũng cảm).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["wildlife","động vật hoang dã"],["conservation","sự bảo tồn"],["habitat","môi trường sống"],["threaten","đe dọa"],["release","thả"]],"explain":"wildlife = động vật hoang dã; conservation = sự bảo tồn; habitat = môi trường sống; threaten = đe dọa; release = thả.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["He","is","taller","than","his","brother"],"explain":"He is taller than his brother. (Anh ấy cao hơn em trai.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: I saw a documentary about penguins. B: Are they in danger? A: Yes, melting ice threatens them. B: That's terrible. A: Climate change affects many animals. B: We must act now.","sub_questions":[{"q":"What threatens penguins?","options":["A. Melting ice.","B. Hunters.","C. Sharks.","D. Cold water."],"answer":"A"},{"q":"What affects many animals?","options":["A. Climate change.","B. Zoos.","C. Tourists.","D. Films."],"answer":"A"}],"explain":"Hội thoại nói băng tan đe dọa chim cánh cụt; biến đổi khí hậu ảnh hưởng nhiều loài.","points":1}]},{"name":"Đề 10","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'oo' is pronounced differently from the others.","options":["A. food","B. zoo","C. foot","D. moon"],"answer":"C","explain":"'oo' trong food, zoo, moon phát âm là /uː/, còn trong foot là /ʊ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. ban","B. fine","C. law","D. obey"],"answer":"D","explain":"obey nhấn âm 2 (əˈbeɪ), còn ban, fine, law là từ 1 âm tiết (coi như nhấn âm 1).","points":0.25},{"type":"mcq","level":"TH","q":"______ forests are rich in biodiversity.","options":["A. Tropical","B. Cold","C. Dry","D. Small"],"answer":"A","explain":"Rừng nhiệt đới giàu đa dạng sinh học → tropical.","points":0.25},{"type":"mcq","level":"TH","q":"______ you hurry, you will miss the bus.","options":["A. If","B. Unless","C. Although","D. Because"],"answer":"B","explain":"Unless = if... not (trừ khi bạn nhanh lên).","points":0.25},{"type":"mcq","level":"VD","q":"The Amazon is larger ______ any other rainforest.","options":["A. as","B. than","C. that","D. then"],"answer":"B","explain":"So sánh hơn với 'larger' → than.","points":0.25},{"type":"mcq","level":"TH","q":"A: See you tomorrow. B: ______","options":["A. Bye!","B. Good night.","C. I'm fine.","D. Thank you."],"answer":"A","explain":"Chào tạm biệt → Bye!","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nEveryone can help wildlife. Do not buy products from wild animals. Reduce, reuse and recycle. Tell friends about conservation. Small actions make a big difference.","statements":["a) Everyone can help wildlife.","b) Buy wild animal products.","c) Tell friends about conservation.","d) Small actions help."],"answer":["T","F","T","T"],"explain":"b) Sai: đừng mua sản phẩm từ động vật hoang dã.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: If we ______ now, we can save them.","answer":"act","explain":"Nếu hành động ngay, chúng ta có thể cứu chúng → act.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The organisation works for the ______ (protect) of nature.","answer":"protection","explain":"Cần danh từ → protection.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["species","loài"],["poaching","săn bắn trộm"],["biodiversity","đa dạng sinh học"],["illegal","bất hợp pháp"],["campaign","chiến dịch"]],"explain":"species = loài; poaching = săn bắn trộm; biodiversity = đa dạng sinh học; illegal = bất hợp pháp; campaign = chiến dịch.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Everyone","can","help","protect","wildlife"],"explain":"Everyone can help protect wildlife. (Ai cũng có thể giúp bảo vệ động vật hoang dã.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Sea turtles swim thousands of kilometres. Females return to the beach where they were born. They lay eggs in the sand at night. Baby turtles run to the sea quickly. Many do not survive, but some grow into adults.","sub_questions":[{"q":"Where do female turtles lay eggs?","options":["A. On the beach where they were born.","B. In the deep sea.","C. On islands.","D. In rivers."],"answer":"A"},{"q":"When do they lay eggs?","options":["A. At night.","B. In the morning.","C. At noon.","D. In winter."],"answer":"A"}],"explain":"Đoạn văn nói rùa cái đẻ trứng trên bãi biển nơi chúng sinh ra, vào ban đêm.","points":1}]}]}
