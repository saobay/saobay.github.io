{"sets":[{"name":"Đề 1","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'u' is pronounced differently from the others.","options":["A. suburb","B. public","C. urban","D. much"],"answer":"C","explain":"Chữ 'u' trong suburb, public, much phát âm là /ʌ/, còn trong urban là /ɜː/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. urban","B. rural","C. suburb","D. expand"],"answer":"D","explain":"expand nhấn âm 2 (ɪkˈspænd), còn urban, rural, suburb nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"Many young people ______ from rural areas to big cities.","options":["A. migrate","B. stay","C. return","D. escape"],"answer":"A","explain":"Nhiều người trẻ di cư từ nông thôn ra thành phố lớn → migrate.","points":0.25},{"type":"mcq","level":"TH","q":"The teacher told us ______ litter in the park.","options":["A. not to drop","B. not drop","C. do not drop","D. not dropping"],"answer":"A","explain":"Câu tường thuật mệnh lệnh phủ định: told + O + not + to V.","points":0.25},{"type":"mcq","level":"VD","q":"'Where do you live?' he asked. → He asked me ______.","options":["A. where I live","B. where I lived","C. where did I live","D. where do I live"],"answer":"B","explain":"Tường thuật câu hỏi: lùi thì (live → lived), không đảo ngữ.","points":0.25},{"type":"mcq","level":"TH","q":"A: Do you like living in the city? B: ______","options":["A. Yes, there are many job opportunities.","B. No, I hate cities.","C. I do not know.","D. Goodbye."],"answer":"A","explain":"Trả lời thích sống ở thành phố vì nhiều cơ hội việc làm.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nUrbanisation is increasing in Vietnam. Millions of people have moved to Ho Chi Minh City and Hanoi. Cities offer jobs, schools and hospitals. However, they also face traffic jams and pollution. The government is building metro lines to reduce congestion.","statements":["a) Urbanisation is increasing in Vietnam.","b) Cities offer jobs and services.","c) Cities have no problems.","d) Metro lines help reduce congestion."],"answer":["T","T","F","T"],"explain":"c) Sai: các thành phố cũng đối mặt với kẹt xe và ô nhiễm.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Traffic ______ is a big problem in big cities.","answer":"congestion","explain":"Tắc nghẽn giao thông là vấn đề lớn → congestion.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The city needs better ______ (infrastructural).","answer":"infrastructure","explain":"Cần danh từ → infrastructure (cơ sở hạ tầng).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["migrate","di cư"],["slum","khu ổ chuột"],["resident","cư dân"],["expand","mở rộng"],["suburb","ngoại ô"]],"explain":"migrate = di cư; slum = khu ổ chuột; resident = cư dân; expand = mở rộng; suburb = ngoại ô.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Many","people","move","to","big","cities"],"explain":"Many people move to big cities. (Nhiều người chuyển đến các thành phố lớn.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Why did your family move to the city? B: My parents found better jobs here. A: Do you like it here? B: Yes, there are good schools and cinemas. But the air is polluted and rent is expensive. A: Everything has two sides! B: That's true.","sub_questions":[{"q":"Why did B's family move to the city?","options":["A. For better jobs.","B. For better weather.","C. To visit relatives.","D. To study abroad."],"answer":"A"},{"q":"What problems does B mention?","options":["A. No schools.","B. Polluted air and expensive rent.","C. No cinemas.","D. Bad food."],"answer":"B"}],"explain":"Hội thoại nói gia đình B chuyển lên thành phố vì việc làm tốt hơn; vấn đề là ô nhiễm và tiền thuê đắt.","points":1}]},{"name":"Đề 2","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'i' is pronounced differently from the others.","options":["A. city","B. district","C. crime","D. live"],"answer":"C","explain":"Chữ 'i' trong city, district, live phát âm là /ɪ/, còn trong crime là /aɪ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. migrate","B. improve","C. attract","D. city"],"answer":"D","explain":"city nhấn âm 1 (ˈsɪti), còn migrate, improve, attract nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"______ is the increase in the number of people living in cities.","options":["A. Urbanisation","B. Migration","C. Pollution","D. Tradition"],"answer":"A","explain":"Đô thị hóa là sự gia tăng dân số thành thị → urbanisation.","points":0.25},{"type":"mcq","level":"TH","q":"She asked me ______ the window.","options":["A. to close","B. close","C. closing","D. closed"],"answer":"A","explain":"Câu tường thuật yêu cầu: asked + O + to V.","points":0.25},{"type":"mcq","level":"VD","q":"'You should see a doctor,' he said. → He ______ me to see a doctor.","options":["A. told","B. asked","C. advised","D. invited"],"answer":"C","explain":"'You should...' là lời khuyên → advised + O + to V.","points":0.25},{"type":"mcq","level":"TH","q":"A: What is a slum? B: ______","options":["A. It is a poor crowded area of a city.","B. It is a tall building.","C. I do not know.","D. What a pity!"],"answer":"A","explain":"Giải thích khu ổ chuột là khu vực nghèo, đông đúc.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nTokyo is one of the largest cities in the world. More than 37 million people live in its metro area. The city has excellent public transport. Trains are often crowded during rush hour. Despite its size, Tokyo is clean and safe.","statements":["a) Tokyo is one of the largest cities.","b) Over 37 million people live there.","c) Tokyo has poor public transport.","d) Tokyo is clean and safe."],"answer":["T","T","F","T"],"explain":"c) Sai: Tokyo có giao thông công cộng tuyệt vời.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The government is building more ______ for poor families.","answer":"housing","explain":"Chính phủ đang xây thêm nhà ở cho gia đình nghèo → housing.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: ______ (urban) is happening fast in Asia.","answer":"Urbanisation","explain":"Cần danh từ làm chủ ngữ → Urbanisation.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["urbanisation","sự đô thị hóa"],["rural","thuộc nông thôn"],["skyscraper","tòa nhà chọc trời"],["congestion","sự tắc nghẽn"],["leisure","thời gian rảnh"]],"explain":"urbanisation = sự đô thị hóa; rural = thuộc nông thôn; skyscraper = tòa nhà chọc trời; congestion = sự tắc nghẽn; leisure = thời gian rảnh.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["The","city","is","expanding","quickly"],"explain":"The city is expanding quickly. (Thành phố đang mở rộng nhanh chóng.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Ho Chi Minh City is growing fast. New apartment buildings appear every year. The first metro line opened recently. It helps thousands of people travel every day. The city plans to build more lines in the future to reduce traffic jams.","sub_questions":[{"q":"What helps people travel every day?","options":["A. The new metro line.","B. New buses.","C. New bridges.","D. New taxis."],"answer":"A"},{"q":"What does the city plan to do?","options":["A. Build more metro lines.","B. Close old roads.","C. Ban cars.","D. Move people away."],"answer":"A"}],"explain":"Đoạn văn nói tuyến metro đầu tiên giúp người dân đi lại và thành phố dự định xây thêm.","points":1}]},{"name":"Đề 3","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'o' is pronounced differently from the others.","options":["A. overcrowding","B. motor","C. modern","D. local"],"answer":"C","explain":"Chữ 'o' trong overcrowding, motor, local phát âm là /əʊ/, còn trong modern là /ɒ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. infrastructure","B. overcrowding","C. unemployment","D. resident"],"answer":"D","explain":"resident nhấn âm 1 (ˈrezɪdənt), còn infrastructure, overcrowding nhấn âm 3, unemployment nhấn âm 4.","points":0.25},{"type":"mcq","level":"TH","q":"The city needs better ______ such as roads and bridges.","options":["A. infrastructure","B. slums","C. crimes","D. villages"],"answer":"A","explain":"Thành phố cần cơ sở hạ tầng tốt hơn như đường sá, cầu cống → infrastructure.","points":0.25},{"type":"mcq","level":"TH","q":"'Don't be late,' the teacher said. → The teacher told us ______ late.","options":["A. not to be","B. not be","C. do not be","D. not being"],"answer":"A","explain":"Tường thuật mệnh lệnh phủ định: told + O + not + to V.","points":0.25},{"type":"mcq","level":"VD","q":"'I am tired,' he said. → He said he ______ tired.","options":["A. is","B. was","C. will be","D. has been"],"answer":"B","explain":"Tường thuật câu kể: lùi thì hiện tại đơn → quá khứ đơn.","points":0.25},{"type":"mcq","level":"TH","q":"A: How do you go to school? B: ______","options":["A. By bus. It is cheap and convenient.","B. I walk sometimes.","C. I do not go to school.","D. Goodbye."],"answer":"A","explain":"Trả lời đi xe buýt vì rẻ và tiện.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nTraffic jams are common in big cities. Too many cars and motorbikes cause congestion. During rush hour, people can spend hours on the road. Building more roads is not always the answer. Good public transport is a better solution.","statements":["a) Traffic jams are common in big cities.","b) Rush hour wastes people's time.","c) Building more roads always solves the problem.","d) Public transport is a better solution."],"answer":["T","T","F","T"],"explain":"c) Sai: xây thêm đường không phải lúc nào cũng là giải pháp.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: Many people move to cities to find ______ jobs.","answer":"better","explain":"Nhiều người lên thành phố tìm việc làm tốt hơn → better.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The streets were ______ (crowd) with people.","answer":"crowded","explain":"Cần tính từ → crowded (đông đúc).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["overcrowding","sự quá tải dân số"],["infrastructure","cơ sở hạ tầng"],["migration","sự di cư"],["housing","nhà ở"],["facility","cơ sở vật chất"]],"explain":"overcrowding = sự quá tải dân số; infrastructure = cơ sở hạ tầng; migration = sự di cư; housing = nhà ở; facility = cơ sở vật chất.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["She","asked","me","to","help","her"],"explain":"She asked me to help her. (Cô ấy nhờ tôi giúp cô ấy.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: I want to move to the countryside. B: Why? The city is convenient. A: The air is fresh and life is peaceful there. B: But there are fewer jobs. A: I can work online. B: That's a good point!","sub_questions":[{"q":"Why does A want to move to the countryside?","options":["A. The air is fresh and life is peaceful.","B. There are more jobs.","C. It is near the city.","D. Houses are expensive."],"answer":"A"},{"q":"What is B's worry?","options":["A. Bad weather.","B. Fewer jobs.","C. No schools.","D. High prices."],"answer":"B"}],"explain":"Hội thoại nói A muốn về quê vì không khí trong lành; B lo ít việc làm.","points":1}]},{"name":"Đề 4","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'e' is pronounced differently from the others.","options":["A. develop","B. expand","C. resident","D. level"],"answer":"B","explain":"Chữ 'e' trong develop, resident, level phát âm là /e/, còn trong expand là /æ/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. modernise","B. develop","C. expand","D. provide"],"answer":"A","explain":"modernise nhấn âm 1 (ˈmɒdənaɪz), còn develop, expand, provide nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"A ______ is a very tall building in a city.","options":["A. skyscraper","B. slum","C. village","D. farm"],"answer":"A","explain":"Tòa nhà chọc trời là tòa nhà rất cao → skyscraper.","points":0.25},{"type":"mcq","level":"TH","q":"He advised us ______ public transport instead of driving.","options":["A. to use","B. use","C. using","D. used"],"answer":"A","explain":"Tường thuật lời khuyên: advised + O + to V.","points":0.25},{"type":"mcq","level":"VD","q":"'Can you open the door?' she said. → She asked me ______ the door.","options":["A. to open","B. open","C. opening","D. opened"],"answer":"A","explain":"Câu hỏi yêu cầu ('Can you...?') → tường thuật: asked + O + to V.","points":0.25},{"type":"mcq","level":"TH","q":"A: Excuse me, is there a hospital near here? B: ______","options":["A. Yes, go straight and turn left.","B. I do not know.","C. Goodbye.","D. What hospital?"],"answer":"A","explain":"Chỉ đường đến bệnh viện.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nSlums are poor areas in big cities. Houses there are small and crowded. People often lack clean water and sanitation. Children may not go to school. Governments are trying to improve living conditions in slums.","statements":["a) Slums are poor crowded areas.","b) People there have good sanitation.","c) Some children do not go to school.","d) Governments ignore slums."],"answer":["T","F","T","F"],"explain":"b) Sai: người dân thiếu nước sạch và vệ sinh. d) Sai: chính phủ đang cố cải thiện.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The ______ hour is the busiest time of the day.","answer":"rush","explain":"Giờ cao điểm là thời gian bận rộn nhất → rush hour.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The new metro will reduce traffic ______ (congest).","answer":"congestion","explain":"Cần danh từ → congestion.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["metropolis","đô thị lớn"],["sanitation","vệ sinh môi trường"],["downtown","trung tâm thành phố"],["urban","thuộc đô thị"],["modernise","hiện đại hóa"]],"explain":"metropolis = đô thị lớn; sanitation = vệ sinh môi trường; downtown = trung tâm thành phố; urban = thuộc đô thị; modernise = hiện đại hóa.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["He","advised","me","to","take","the","bus"],"explain":"He advised me to take the bus. (Anh ấy khuyên tôi nên đi xe buýt.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Singapore is a small but modern city. It has excellent public transport. The streets are clean and there are many green spaces. The government plans the city carefully. Singapore is a good example of smart urban planning.","sub_questions":[{"q":"What is said about Singapore's transport?","options":["A. It is excellent.","B. It is terrible.","C. It is expensive.","D. It is old."],"answer":"A"},{"q":"Why is Singapore a good example?","options":["A. Because of smart urban planning.","B. Because it is big.","C. Because it is old.","D. Because it has no cars."],"answer":"A"}],"explain":"Đoạn văn nói Singapore có giao thông tuyệt vời và là ví dụ tốt về quy hoạch đô thị thông minh.","points":1}]},{"name":"Đề 5","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'c' is pronounced differently from the others.","options":["A. city","B. centre","C. congestion","D. cycle"],"answer":"C","explain":"Chữ 'c' trong city, centre, cycle phát âm là /s/, còn trong congestion là /k/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. crowded","B. modern","C. urban","D. downtown"],"answer":"D","explain":"downtown nhấn âm 2 (ˌdaʊnˈtaʊn), còn crowded, modern, urban nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"People living in ______ often have a low income.","options":["A. slums","B. suburbs","C. skyscrapers","D. parks"],"answer":"A","explain":"Người sống trong khu ổ chuột thường thu nhập thấp → slums.","points":0.25},{"type":"mcq","level":"TH","q":"'Would you like some tea?' she said. → She ______ me some tea.","options":["A. told","B. asked","C. offered","D. advised"],"answer":"C","explain":"'Would you like...?' là lời mời mọc → offered.","points":0.25},{"type":"mcq","level":"VD","q":"She said she ______ to the city the following year.","options":["A. will move","B. would move","C. moves","D. moved"],"answer":"B","explain":"Tường thuật: will → would; 'next year' → the following year.","points":0.25},{"type":"mcq","level":"TH","q":"A: What causes air pollution in cities? B: ______","options":["A. Cars and factories release harmful gases.","B. Trees clean the air.","C. I do not know.","D. What a question!"],"answer":"A","explain":"Ô tô và nhà máy thải khí độc gây ô nhiễm không khí.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nHanoi is the capital of Vietnam. It is one of the oldest cities in Asia. The Old Quarter has narrow streets and old houses. The city is famous for its lakes and temples. Today, Hanoi is modernising quickly with new buildings and metro lines.","statements":["a) Hanoi is the capital of Vietnam.","b) It is a new city.","c) The Old Quarter has narrow streets.","d) Hanoi is modernising quickly."],"answer":["T","F","T","T"],"explain":"b) Sai: Hà Nội là một trong những thành phố cổ nhất châu Á.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: The cost of ______ is high in big cities.","answer":"living","explain":"Chi phí sinh hoạt cao ở thành phố lớn → cost of living.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The city is becoming more ______ (modern) every year.","answer":"modern","explain":"'modern' đã là tính từ; cần dạng so sánh hơn → more modern. Đáp án: modern.","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["slum","khu ổ chuột"],["urban","thuộc đô thị"],["facility","cơ sở vật chất"],["congestion","sự tắc nghẽn"],["leisure","thời gian rảnh"]],"explain":"slum = khu ổ chuột; urban = thuộc đô thị; facility = cơ sở vật chất; congestion = sự tắc nghẽn; leisure = thời gian rảnh.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["They","told","us","not","to","litter"],"explain":"They told us not to litter. (Họ bảo chúng tôi đừng xả rác.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Our city is too crowded. B: I agree. Rents are rising every year. A: Young people can't afford houses. B: The government should build more affordable housing. A: And improve public transport too. B: That would help a lot.","sub_questions":[{"q":"What problem do al Vietnam.","B. In northern Vietnam.","C. In southern Vietnam.","D. In Laos."],"answer":"A"},{"q":"What does the Dragon Bridge do on weekend nights?","options":["A. It breathes fire.","B. It changes colour.","C. It plays music.","D. It closes."],"answer":"A"}],"explain":"Đoạn văn nói Đà Nẵng ở miền Trung và cầu Rồng phun lửa vào tối cuối tuần.","points":1}]},{"name":"Đề 7","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'th' is pronounced differently from the others.","options":["A. growth","B. north","C. southern","D. month"],"answer":"C","explain":"'th' trong growth, north, month phát âm là /θ/ (vô thanh), còn trong southern là /ð/ (hữu thanh) nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. skyscraper","B. motorway","C. suburb","D. alone"],"answer":"D","explain":"alone nhấn âm 2 (əˈləʊn), còn skyscraper, motorway, suburb nhấn âm 1.","points":0.25},{"type":"mcq","level":"TH","q":"The ______ of the city includes schools, hospitals and parks.","options":["A. facilities","B. slums","C. crimes","D. villages"],"answer":"A","explain":"Cơ sở vật chất của thành phố gồm trường học, bệnh viện, công viên → facilities.","points":0.25},{"type":"mcq","level":"TH","q":"'Please help me,' he said. → He asked me ______ him.","options":["A. to help","B. help","C. helping","D. helped"],"answer":"A","explain":"Tường thuật yêu cầu: asked + O + to V.","points":0.25},{"type":"mcq","level":"VD","q":"'I will visit my grandmother tomorrow,' she said. → She said she ______ her grandmother the next day.","options":["A. will visit","B. would visit","C. visits","D. visited"],"answer":"B","explain":"Tường thuật: will → would; tomorrow → the next day.","points":0.25},{"type":"mcq","level":"TH","q":"A: Is living in the city expensive? B: ______","options":["A. Yes, the cost of living is high.","B. No, it is cheap.","C. I do not live in a city.","D. What a pity!"],"answer":"A ll of shops. A: Is it crowded? B: Very! But the street food is amazing. A: I'd love to go there.","sub_questions":[{"q":"What are the streets in the Old Quarter like?","options":["A. Narrow and full of shops.","B. Wide and empty.","C. Modern and quiet.","D. Short and dark."],"answer":"A"},{"q":"What does B like there?","options":["A. The museums.","B. The street food.","C. The parks.","D. The temples."],"answer":"B"}],"explain":"Hội thoại nói phố cổ có đường hẹp, nhiều cửa hàng và đồ ăn đường phố tuyệt vời.","points":1}]},{"name":"Đề 8","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'a' is pronounced differently from the others.","options":["A. flat","B. traffic","C. vast","D. jam"],"answer":"C","explain":"Chữ 'a' trong flat, traffic, jam phát âm là /æ/, còn trong vast là /ɑː/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. facility","B. utility","C. community","D. resident"],"answer":"D","explain":"resident nhấn âm 1 (ˈrezɪdənt), còn facility, utility, community nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"Many ______ live in the suburbs and work downtown.","options":["A. residents","B. slums","C. buildings","D. villages"],"answer":"A","explain":"Nhiều cư dân sống ở ngoại ô và làm việc ở trung tâm → residents.","points":0.25},{"type":"mcq","level":"TH","q":"'Stay in your seats,' the pilot said. → The pilot told the passengers ______ in their seats.","options":["A. to stay","B. stay","C. staying","D. stayed"],"answer":"A","explain":"Tường thuật mệnh lệnh: told + O + to V.","points":0.25},{"type":"mcq","level":"VD","q":"'Are you tired?' he asked. → He asked me ______ tired.","options":["A. if I am","B. if I was","C. am I","D. was I"],"answer":"B","explain":"Tường thuật câu hỏi Yes/No: dùng if, lùi thì, không đảo ngữ.","points":0.25},{"type":"mcq","level":"TH","q":"A: What do you do in your leisure time? B: ______","options":["A. l the streets. It can take 30 minutes to travel 3 kilometres. Many people now use buses to avoid traffic. The new metro line will help reduce congestion.","sub_questions":[{"q":"When is rush hour in Hanoi?","options":["A. From 7 to 9 a.m.","B. From 5 to 7 p.m.","C. At noon.","D. At midnight."],"answer":"A"},{"q":"How long can it take to travel 3 kilometres?","options":["A. 10 minutes.","B. 30 minutes.","C. One hour.","D. 5 minutes."],"answer":"B"}],"explain":"Đoạn văn nói giờ cao điểm Hà Nội từ 7–9 giờ sáng và đi 3km có thể mất 30 phút.","points":1}]},{"name":"Đề 9","questions":[{"type":"mcq","level":"NB","q":"Choose the word whose letter 'ea' is pronounced differently from the others.","options":["A. cheap","B. clean","C. area","D. dream"],"answer":"C","explain":"'ea' trong cheap, clean, dream phát âm là /iː/, còn trong area là /eə/ nên khác.","points":0.25},{"type":"mcq","level":"NB","q":"Choose the word whose main stress is placed differently from the others.","options":["A. expand","B. extend","C. expect","D. expert"],"answer":"D","explain":"expert (danh từ) nhấn âm 1 (ˈekspɜːt), còn expand, extend, expect nhấn âm 2.","points":0.25},{"type":"mcq","level":"TH","q":"The city centre is full of shops and ______.","options":["A. offices","B. farms","C. fields","D. forests"],"answer":"A","explain":"Trung tâm thành phố đầy cửa hàng và văn phòng → offices.","points":0.25},{"type":"mcq","level":"TH","q":"'You should drink more water,' the doctor said. → The doctor advised me ______ more water.","options":["A. to drink","B. drink","C. drinking","D. drank"],"answer":"A","explain":"Tường thuật lời khuyên: advised + O + to V.","points":0.25},{"type":"mcq","level":"VD","q":"She asked me what time ______.","options":["A. the train leaves","B. does the train leave","C. the train left","D. did the train leave"],"answer":"A","explain":"Lịch trình (giờ tàu chạy) là sự thật hiển nhiên → không lùi thì: what time the train leaves.","points":0.25},{"type":"mcq","level":"TH","q":"A: Thank you for your help. B: ______","options":["A. You're welcome.","B. I'm fine.","C. Goodbye.","D. See you."],"answer":"A","explain":"Đáp lại lời cảm ơn → You're welcome.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nGreen spaces are important in cities. Parks give people fresh air and places to relax. Trees reduce heat and noise. Children need playgrounds to play safely. Cities with more parks are healthier and happier.","statements":["a) Green spaces are important in cities.","b) Parks give fresh air.","c) Trees increase heat.","d) Cities with parks are healthier."],"answer":["T","T","F","T"],"explain":"c) Sai: cây xanh giảm nhiệt và tiếng ồn.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: She lives in the ______ of the city.","answer":"suburbs","explain":"Cô ấy sống ở ngoại ô thành phố → suburbs.","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The area is heavily ______ (populate).","answer":"populated","explain":"Sau trạng từ 'heavily' cần quá khứ phân từ → populated (đông dân).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["infrastructure","cơ sở hạ tầng"],["slum","khu ổ chuột"],["congestion","sự tắc nghẽn"],["modernise","hiện đại hóa"],["rural","thuộc nông thôn"]],"explain":"infrastructure = cơ sở hạ tầng; slum = khu ổ chuột; congestion = sự tắc nghẽn; modernise = hiện đại hóa; rural = thuộc nông thôn.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["The","doctor","advised","me","to","rest"],"explain":"The doctor advised me to rest. (Bác sĩ khuyên tôi nên nghỉ ngơi.)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"A: Is this your first time in Da Nang? B: Yes! The beaches are beautiful. A: You should try the seafood. B: I o, I hate museums.","C. Maybe not.","D. What museum?"],"answer":"A","explain":"Nhận lời mời → Yes, I'd love to.","points":0.25},{"type":"truefalse","level":"TH","q":"Read the passage and decide whether the statements are true (T) or false (F):\n\nHousing is a big challenge in growing cities. Many people cannot afford to buy houses. Rents keep rising every year. Some families share small flats. Building affordable housing is an important task for governments.","statements":["a) Housing is a challenge in growing cities.","b) Everyone can afford houses.","c) Rents are rising.","d) Affordable housing is important."],"answer":["T","F","T","T"],"explain":"b) Sai: nhiều người không đủ tiền mua nhà.","points":1},{"type":"short","level":"TH","q":"Fill in the blank with ONE word: ______ you like to live in a big city?","answer":"Would","explain":"Lời mời: Would you like...?","points":0.5},{"type":"short","level":"VD","q":"Give the correct form of the word in brackets: The city attracts many ______ (migrate).","answer":"migrants","explain":"Cần danh từ chỉ người → migrants (người di cư).","points":0.5},{"type":"matching","level":"NB","q":"Nối từ với nghĩa tiếng Việt đúng của nó.","pairs":[["urbanisation","sự đô thị hóa"],["facility","cơ sở vật chất"],["expand","mở rộng"],["sanitation","vệ sinh môi trường"],["suburb","ngoại ô"]],"explain":"urbanisation = sự đô thị hóa; facility = cơ sở vật chất; expand = mở rộng; sanitation = vệ sinh môi trường; suburb = ngoại ô.","points":1},{"type":"ordering","level":"TH","q":"Sắp xếp các từ sau thành câu đúng.","words":["Would","you","like","to","visit","Hanoi"],"explain":"Would you like to visit Hanoi? (Bạn có muốn thăm Hà Nội không?)","points":1},{"type":"listening","level":"VD","q":"Nghe đoạn văn / hội thoại rồi trả lời các câu hỏi.","audio_text":"Many young people leave villages for cities. They hope to find good jobs. In the city, they earn more money. However, life is expensive and stressful. Some return home after a few years. Others stay and build a new life.","sub_questions":[{"q":"Why do young people leave villages?","options":["A. To find good jobs.","B. To study abroad.","C. To travel.","D. To visit family."],"answer":"A"},{"q":"What do some of them do after a few years?","options":["A. They return home.","B. They move abroad.","C. They stop working.","D. They buy farms."],"answer":"A"}],"explain":"Đoạn văn nói người trẻ rời quê tìm việc tốt và một số trở về sau vài năm.","points":1}]}]}
