oints": 0.25, "q": "Trong mạch điện xoay chiều chỉ có điện trở thuần R, dòng điện hiệu dụng được tính bằng:", "type": "mcq"}, {"answer": "B", "explain": "Sao: $I_p = \\frac{127}{25,4} = 5\\,A$; $I_d = 5\\,A$; $U_d = \\sqrt{3} \\times 127 \\approx 220\\,V$.", "level": "VD", "options": ["A. $I_d = 8,66\\,A$", "B. $I_d = 5\\,A;\\, U_d \\approx 220\\,V$", "C. $I_d = 2,5\\,A$", "D. $U_d = 127\\,V$ là điện áp dây"], "points": 0.25, "q": "Tải ba pha đối xứng nối hình sao, $U_p = 127\\,V$, $R = 25,4\\,\\Omega$/pha. Tính $I_d$ và $U_d$ (lấy $\\sqrt{3} \\approx 1,73$):", "type": "mcq"}, {"answer": "B", "explain": "Sao: $U_d = \\sqrt{3} \\times 220 \\approx 381\\,V$; $I_d = I_p = \\frac{220}{73,3} = 3\\,A$; $P = \\sqrt{3}U_dI_d = 1,73 \\times 381 \\times 3 \\approx 1977\\,W$.", "level": "VDC", "options": ["A. $P \\approx 660\\,W$", "B. $P \\approx 1980\\,W$", "C. $P \\approx 1140\\,W$", "D. $P \\approx 3420\\,W$"], "points": 0.25, "q": "Động cơ ba pha đối xứng nối hình sao, $U_p = 220\\,V$, tổng trở mỗi pha $Z = 73,3\\,\\Omega$ (coi thuần trở). Tính công suất tiêu thụ:", "type": "mcq"}, {"answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: $P = \\sqrt{3}U_dI_d\\cos\\varphi$. d) Sai: hệ số công suất càng gần 1 càng tốt.", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Công suất mạch ba pha đối xứng: $P = 3U_pI_p\\cos\\varphi$.", "b) Công suất cũng được tính bằng $P = \\sqrt{3}U_dI_d\\cos\\varphi$.", "c) Động cơ ba pha có hệ số công suất $\\cos\\varphi$ nhỏ hơn 1.", "d) Hệ số công suất càng nhỏ càng tốt."], "type": "truefalse"}, {"answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: nối sao 3 dây không có dây trung tính, nối sao 4 dây mới có. c) Đúng. d) Đúng.", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mạch ba pha đối xứng có thể dùng 3 dây hoặc 4 dây.", "b) Mạch ba pha ba dây luôn có dây trung tính.", "c) Tải ba pha không đối xứng nên dùng mạch bốn dây.", "d) Dòng điện trong dây trung tính triệt tiêu khi tải đối xứng."], "type": "truefalse"}, {"answer": "0", "explain": "Tải đối xứng: $\\vec{I_A} + \\vec{I_B} + \\vec{I_C} = 0$ nên dòng điện dây trung tính bằng 0.", "level": "VD", "points": 0.5, "q": "Trong mạch ba pha bốn dây đối xứng, dòng điện trong dây trung tính bằng bao nhiêu ampe (A)? (Chỉ ghi số)", "type": "short"}, {"answer": "120", "explain": "Ba pha lệch nhau $360°/3 = 120°$.", "level": "VDC", "points": 0.5, "q": "Ba suất điện động của máy phát ba pha lệch pha nhau một góc bằng bao nhiêu độ? (Chỉ ghi số)", "type": "short"}]}, {"name": "Đề 9", "questions": [{"answer": "B", "explain": "Dòng điện pha: dòng điện chạy trong mỗi pha của nguồn hoặc tải.", "level": "NB", "options": ["A. Dòng điện trong dây trung tính", "B. Dòng điện chạy trong mỗi pha", "C. Dòng điện trong đất", "D. Dòng điện một chiều"], "points": 0.25, "q": "Dòng điện pha Ip là:", "type": "mcq"}, {"answer": "B", "explain": "Dòng điện dây: dòng điện chạy trong dây pha (dây nối từ nguồn đến tải).", "level": "NB", "options": ["A. Dòng điện trong pha tải", "B. Dòng điện chạy trong dây pha", "C. Dòng điện trong dây trung tính", "D. Dòng điện cảm ứng"], "points": 0.25, "q": "Dòng điện dây Id là:", "type": "mcq"}, {"answer": "B", "explain": "Tam giác: $U_p = U_d$; sao: $U_d = \\sqrt{3}\\,U_p$.", "level": "TH", "options": ["A. $U_d = \\sqrt{3}\\,U_p$ với mọi cách nối", "B. Nối sao: $U_d = \\sqrt{3}\\,U_p$; nối tam giác: $U_d = U_p$", "C. $U_d = U_p$ với mọi cách nối", "D. Nối sao: $U_d = U_p$; nối tam giác: $U_d = \\sqrt{3}\\,U_p$"], "points": 0.25, "q": "Quan hệ giữa Ud và Up trong mạch ba pha đối xứng:", "type": "mcq"}, {"answer": "B", "explain": "Tam giác: $I_d = \\sqrt{3}\\,I_p$; sao: $I_d = I_p$.", "level": "TH", "options": ["A. $I_d = I_p$ với mọi cách nối", "B. Nối sao: $I_d = I_p$; nối tam giác: $I_d = \\sqrt{3}\\,I_p$", "C. $I_d = \\sqrt{3}\\,I_p$ với mọi cách nối", "D. Nối sao: $I_d = \\sqrt{3}\\,I_p$; nối tam giác: $I_d = I_p$"], "points": 0.25, "q": "Quan hệ giữa Id và Ip trong mạch ba pha đối xứng:", "type": "mcq"}, {"answer": "B", "explain": "Sao: $I_d = I_p = \\frac{380/\\sqrt{3}}{95} = \\frac{219,4}{95} \\approx 2,31\\,A$. Lấy $U_p = 220\\,V$ (chuẩn): $I_p = \\frac{220}{95} \\approx 2,32\\,A$.", "level": "VD", "options": ["A. $I_d = 4\\,A$", "B. $I_d \\approx 2,3\\,A$", "C. $I_d = 1,15\\,A$", "D. $I_d = 6,9\\,A$"], "points": 0.25, "q": "Tải ba pha đối xứng nối hình sao vào nguồn $U_d = 380\\,V$, $R = 95\\,\\Omega$/pha (lấy $U_p = 220\\,V$). Tính $I_d$:", "type": "mcq"}, {"answer": "B", "explain": "Tam giác: $U_p = 380\\,V$; $I_p = \\frac{380}{47,5} = 8\\,A$; $I_d = \\sqrt{3} \\times 8 \\approx 13,86\\,A$.", "level": "VDC", "options": ["A. $I_d = 8\\,A$", "B. $I_d \\approx 13,9\\,A$", "C. $I_d = 24\\,A$", "D. $I_d = 4,6\\,A$"], "points": 0.25, "q": "Tải ba pha đối xứng nối hình tam giác, $U_d = 380\\,V$, $R = 47,5\\,\\Omega$/pha. Tính $I_d$ (lấy $\\sqrt{3} \\approx 1,73$):", "type": "mcq"}, {"answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng: tải 1 pha dùng $U_p$. c) Sai: động cơ 380 V/Δ phải nối tam giác. d) Đúng.", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nguồn ba pha bốn dây 380/220 V cấp được hai cấp điện áp.", "b) Tải một pha 220 V nối vào một dây pha và dây trung tính.", "c) Động cơ ghi 380 V/Δ nên nối hình sao vào nguồn 380 V.", "d) Aptomat ba pha bảo vệ mạch điện ba pha."], "type": "truefalse"}, {"answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: $\\Delta P = 3I_p^2R$. d) Sai: nâng điện áp làm giảm dòng điện nên giảm hao phí.", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mạch ba pha truyền tải công suất lớn hiệu quả hơn mạch một pha.", "b) Ba pha giúp động cơ quay đều, ít rung.", "c) Hao phí trên đường dây ba pha tính trên cả ba pha.", "d) Truyền tải điện ba pha ở điện áp càng thấp càng ít hao phí."], "type": "truefalse"}, {"answer": "4", "explai  V: nối sao có dây trung tính, mỗi đèn chịu $U_p = 220\\,V$. Đèn 380 V: nối tam giác, mỗi đèn chịu $U_d = 380\\,V$.", "level": "VD", "options": ["A. Tất cả nối hình sao", "B. Đèn 220 V nối sao có dây trung tính, đèn 380 V nối tam giác", "C. Tất cả nối tam giác", "D. Nối tùy ý"], "points": 0.25, "q": "Nguồn ba pha 380/220 V, có 3 đèn 220 V và 3 đèn 380 V. Cách nối đúng là:", "type": "mcq"}, {"answer": "B", "explain": "Sao: $U_p = \\frac{380}{\\sqrt{3}} \\approx 220\\,V$; $I_p = \\frac{220}{27,5} = 8\\,A$; $P = 3 \\times 220 \\times 8 = 5280\\,W$.", "level": "VDC", "options": ["A. $P = 1760\\,W$", "B. $P = 5280\\,W$", "C. $P = 3048\\,W$", "D. $P = 9144\\,W$"], "points": 0.25, "q": "Bếp điện ba pha đối xứng nối hình sao vào nguồn $U_d = 380\\,V$, điện trở mỗi pha $27,5\\,\\Omega$. Tính công suất bếp (lấy $U_p = 220\\,V$):", "type": "mcq"}, {"answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: học sinh cần nắm kiến thức mạch ba pha để dùng điện an toàn, hiệu quả.", "level": "NB", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hiểu biết về mạch ba pha giúp sử dụng điện an toàn.", "b) Thợ điện phải nắm vững cách nối sao, tam giác.", "c) Kĩ sư điện dùng kiến thức mạch ba pha để thiết kế hệ thống điện.", "d) Học sinh phổ thông không cần học về mạch điện ba pha."], "type": "truefalse"}, {"answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 220 V là điện áp pha. b) Đúng: 380 V là điện áp dây. c) Đúng. d) Sai: $\\frac{380}{220} = \\sqrt{3}$.", "level": "TH", "points": 1, "q": "Xét tính đúng, sai của các khẳng định sau về mạng điện 380/220 V:", "statements": ["a) 220 V là điện áp giữa dây pha và dây trung tính.", "b) 380 V là điện áp giữa hai dây pha.", "c) Tỉ số 380/220 xấp xỉ bằng căn ba.", "d) 220 V là điện áp dây của mạng điện này."], "type": "truefalse"}, {"answer": "50", "explain": "Lưới điện Việt Nam: tần số 50 Hz.", "level": "VD", "points": 0.5, "q": "Tần số dòng điện của lưới điện Việt Nam là bao nhiêu héc (Hz)? (Chỉ ghi số)", "type": "short"}, {"answer": "220", "explain": "Điện áp pha (dây pha – trung tính) của mạng 380/220 V là 220 V.", "level": "VDC", "points": 0.5, "q": "Trong mạng điện 380/220 V, điện áp giữa một dây pha và dây trung tính là bao nhiêu vôn (V)? (Chỉ ghi số)", "type": "short"}]}]}
