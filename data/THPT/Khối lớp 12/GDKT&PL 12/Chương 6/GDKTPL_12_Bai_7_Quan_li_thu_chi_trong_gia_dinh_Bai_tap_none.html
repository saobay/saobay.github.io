rủi ro.", "D. luôn lỗ."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Nguyên tắc khi đầu tư tài chính là", "explain": "Chỉ đầu tư tiền nhàn rỗi, tìm hiểu kĩ, đa dạng hoá và cảnh giác với các chiêu lừa đảo.", "points": 0.25, "options": ["A. dồn hết tiền vào một kênh.", "B. chỉ đầu tư số tiền nhàn rỗi, tìm hiểu kĩ, đa dạng hoá, cảnh giác lừa đảo.", "C. vay nợ để đầu tư.", "D. nghe theo lời rủ rê."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Dấu hiệu của lừa đảo đầu tư tài chính là", "explain": "Lãi cao bất thường, lôi kéo, mập mờ pháp lí là dấu hiệu lừa đảo đầu tư.", "points": 0.25, "options": ["A. lãi suất cam kết cao bất thường, rủ rê lôi kéo, không rõ pháp lí.", "B. tư vấn rõ ràng.", "C. có giấy phép.", "D. minh bạch."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Tham gia đa cấp biến tướng, tiền ảo lừa đảo sẽ", "explain": "Đa cấp biến tướng, tiền ảo lừa đảo khiến nhiều gia đình mất tiền, nợ nần.", "points": 0.25, "options": ["A. làm giàu nhanh.", "B. khiến gia đình mất tiền, nợ nần.", "C. an toàn.", "D. được pháp luật bảo vệ."], "answer": "B"}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về tiết kiệm, đầu tư:", "explain": "a), b), c) Đúng. d) Sai: cần đa dạng hoá, chỉ dùng tiền nhàn rỗi.", "points": 1, "statements": ["a) Tiết kiệm tạo nguồn lực cho mục tiêu lớn của gia đình.", "b) Gửi tiết kiệm ngân hàng là kênh an toàn, phổ biến.", "c) Đầu tư lợi nhuận cao hơn nhưng rủi ro cũng cao hơn.", "d) Nên dồn hết tiền vào một kênh đầu tư lãi cao."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về phòng tránh lừa đảo:", "explain": "a), b), c) Đúng. d) Sai.", "points": 1, "statements": ["a) Lãi suất cam kết cao bất thường là dấu hiệu lừa đảo.", "b) Cần tìm hiểu kĩ pháp lí trước khi đầu tư.", "c) Không nên vay nợ để đầu tư.", "d) Cứ nghe theo lời rủ rê là an toàn."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "NB", "q": "Kênh tiết kiệm an toàn, phổ biến nhất của gia đình là gửi tiết kiệm ở đâu? (điền: ngân ...)", "explain": "Gửi tiết kiệm ngân hàng.", "points": 0.5, "answer": "hàng"}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Chỉ đầu tư bằng số tiền ... rỗi.", "explain": "Chỉ đầu tư bằng tiền nhàn rỗi.", "points": 0.5, "answer": "nhàn"}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "TH", "q": "Chi tiêu theo cảm xúc (mua sắm bốc đồng) dẫn tới", "explain": "Mua sắm bốc đồng theo cảm xúc gây lãng phí, phá vỡ kế hoạch chi tiêu.", "points": 0.25, "options": ["A. tiết kiệm được nhiều.", "B. lãng phí, chi vượt kế hoạch.", "C. cuộc sống tốt hơn.", "D. không ảnh hưởng gì."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Để hạn chế mua sắm bốc đồng, nên", "explain": "Lập danh sách trước, cân nhắc kĩ giúp hạn chế mua sắm bốc đồng.", "points": 0.25, "options": ["A. mang nhiều tiền khi đi siêu thị.", "B. lập danh sách mua sắm trước, cân nhắc 24 giờ với món đồ không cần thiết.", "C. mua ngay khi thích.", "D. dùng thẻ tín dụng thoải mái."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Sử dụng thẻ tín dụng cần lưu ý", "explain": "Thẻ tín dụng tiện lợi nhưng lãi suất cao khi trả chậm; cần chi trong khả năng và trả đúng hạn.", "points": 0.25, "options": ["A. chi tiêu thoải mái.", "B. chi trong khả năng trả nợ, thanh toán đúng hạn để tránh lãi suất cao.", "C. rút tiền mặt thường xuyên.", "D. cho người khác mượn."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Nợ xấu trong gia đình là", "explain": "Nợ xấu: vay tiêu dùng lãi cao, vượt khả năng trả, dễ dẫn tới khủng hoảng tài chính.", "points": 0.25, "options": ["A. khoản nợ vay tiêu dùng lãi cao, khó trả.", "B. khoản vay mua nhà có kế hoạch.", "C. nợ bạn bè ít tiền.", "D. không có khái niệm này."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Khi đã lỡ vay nợ lãi cao, gia đình nên", "explain": "Ưu tiên trả nợ lãi cao, cắt giảm chi, tăng thu nhập để thoát nợ.", "points": 0.25, "options": ["A. vay thêm để trả.", "B. ưu tiên trả nợ lãi cao trước, cắt giảm chi tiêu, tăng thu nhập.", "C. bỏ trốn.", "D. mặc kệ."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Giáo dục con cái về quản lí tài chính nên bắt đầu từ", "explain": "Dạy con quản lí tiền tiêu vặt, tiết kiệm từ nhỏ hình thành thói quen tốt.", "points": 0.25, "options": ["A. khi đi làm.", "B. sớm: cho tiền tiêu vặt có kế hoạch, dạy tiết kiệm từ nhỏ.", "C. khi về hưu.", "D. không cần dạy."], "answer": "B"}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về chi tiêu hợp lí:", "explain": "a), b), c) Đúng. d) Sai.", "points": 1, "statements": ["a) Mua sắm bốc đồng gây lãng phí.", "b) Nên lập danh sách mua sắm trước khi đi chợ, siêu thị.", "c) Thẻ tín dụng cần được sử dụng có kiểm soát.", "d) Chi tiêu theo cảm xúc giúp tiết kiệm."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về nợ nần:", "explain": "a), b), d) Đúng. c) Sai: vay nặng lãi làm nợ chồng nợ.", "points": 1, "statements": ["a) Nợ xấu là khoản vay lãi cao, khó trả.", "b) Nên ưu tiên trả nợ lãi cao trước.", "c) Vay nặng lãi để trả nợ là giải pháp tốt.", "d) Cần dạy con quản lí tài chính từ sớm."], "answer": ["T", "T", "F", "T"]}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Mua sắm ... đồng gây lãng phí, phá vỡ kế hoạch chi tiêu.", "explain": "Mua sắm bốc đồng.", "points": 0.5, "answer": "bốc"}, {"type": "short", "level": "NB", "q": "Nên lập ... mua sắm trước khi đi chợ để hạn chế chi tiêu bốc đồng (điền 1 từ).", "explain": "Danh sách mua sắm.", "points": 0.5, "answer": "danh sách"}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "TH", "q": "Bảo hiểm nhân thọ trong kế hoạch tài chính gia đình có vai trò", "explain": "Bảo hiểm nhân thọ bảo vệ tài chính gia đình khi người trụ cột gặp rủi ro.", "points": 0.25, "options": ["A. không cần thiết.", "B. bảo vệ tài chính gia đình trước rủi ro (trụ cột gặp sự cố).", "C. làm giàu.", "D. thay thế tiết kiệm."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Tham gia BHYT cho cả gia đình giúp", "explain": "BHYT giúp cả gia đình giảm gánh nặng chi phí y tế khi ốm đau.", "points": 0.25, "options": ["A. tốn tiền.", "B. giảm gánh nặng chi phí khám chữa bệnh.", "C. không cần đi khám.", "D. tăng bệnh tật."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Lập kế hoạch cho việc học của con cần", "explain": "Chi phí học tập lớn dần theo cấp học; cần dự tính và tiết kiệm từ sớm.", "points": 0.25, "options": ["A. không cần chuẩn bị.", "B. dự tính chi phí học tập các cấp, tiết kiệm dần từ sớm.", "C. đến đâu lo đến đó.", "D. vay nợ khi cần."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Chuẩn bị tài chính cho tuổi già nên bắt đầu", "explain": "Chuẩn bị cho tuổi già càng sớm càng tốt qua BHXH, tiết kiệm, đầu tư dài hạn.", "points": 0.25, "options": ["A. khi về hưu.", "B. càng sớm càng tốt: tham gia BHXH, tiết kiệm dài hạn.", "C. khi ốm đau.", "D. không cần."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Kế hoạch tài chính gia đình cần được", "explain": "Thu nhập, nhu cầu thay đổi nên kế hoạch cần được rà soát, điều chỉnh định kì.", "points": 0.25, "options": ["A. lập một lần rồi để đó.", "B. rà soát, điều chỉnh định kì theo thay đổi thu nhập, nhu cầu.", "C. giữ bí mật.", "D. không cần điều chỉnh."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Sự đồng thuận của các thành viên trong quản lí thu chi giúp", "explain": "Bàn bạc, đồng thuận giúp các thành viên cùng thực hiện, gia đình hoà thuận.", "points": 0.25, "options": ["A. gây mâu thuẫn.", "B. mọi người cùng thực hiện kế hoạch, gia đình hoà thuận.", "C. tốn thời gian.", "D. không cần thiết."], "answer": "B"}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về kế hoạch dài hạn:", "explain": "Cả 4 khẳng định đều đúng.", "points": 1, "statements": ["a) Bảo hiểm nhân thọ bảo vệ tài chính gia đình trước rủi ro.", "b) BHYT giảm gánh nặng chi phí y tế.", "c) Cần chuẩn bị tài chính cho việc học của con từ sớm.", "d) Chuẩn bị cho tuổi già nên bắt đầu càng sớm càng tốt."], "answer": ["T", "T", "T", "T"]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về thực hiện kế hoạch:", "explain": "a), b) Đúng. c), d) Sai.", "points": 1, "statements": ["a) Kế hoạch cần được rà soát, điều chỉnh định kì.", "b) Các thành viên cần đồng thuận khi thực hiện.", "c) Lập kế hoạch một lần là đủ mãi mãi.", "d) Không cần bàn bạc với các thành viên."], "answer": ["T", "T", "F", "F"]}, {"type": "short", "level": "NB", "q": "Bảo hiểm nào bảo vệ tài chính gia đình khi người trụ cột gặp rủi ro? (điền: bảo hiểm ... thọ)", "explain": "Bảo hiểm nhân thọ.", "points": 0.5, "answer": "nhân"}, {"type": "short", "level": "TH", "q": "Điền từ còn thiếu: Kế hoạch tài chính cần được rà soát, ... định kì.", "explain": "Điều chỉnh định kì.", "points": 0.5, "answer": "điều chỉnh"}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "TH", "q": "Học sinh lớp 12 quản lí tiền tiêu vặt nên", "explain": "Lập kế hoạch, trích tiết kiệm, ghi chép là cách quản lí tiền tiêu vặt đúng.", "points": 0.25, "options": ["A. tiêu hết mỗi ngày.", "B. lập kế hoạch chi tiêu, trích tiết kiệm, ghi chép.", "C. vay bạn bè.", "D. xin thêm khi hết."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Tiền mừng tuổi, tiền thưởng của học sinh nên", "explain": "Tiết kiệm một phần tiền mừng tuổi, tiền thưởng cho mục tiêu học tập là thói quen tốt.", "points": 0.25, "options": ["A. tiêu hết ngay.", "B. tiết kiệm một phần cho mục tiêu học tập.", "C. cho bạn vay hết.", "D. chơi game."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Học sinh cần phân biệt", "explain": "Phân biệt nhu cầu và mong muốn giúp chi tiêu hợp lí, tránh lãng phí.", "points": 0.25, "options": ["A. không cần phân biệt.", "B. nhu cầu (cần) và mong muốn (muốn) để chi tiêu hợp lí.", "C. tiền của mình và của bạn.", "D. giàu và nghèo."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Khi bạn bè rủ rê mua sắm đồ hiệu vượt khả năng, học sinh nên", "explain": "Chi tiêu phù hợp điều kiện gia đình, không chạy theo bạn bè là đúng đắn.", "points": 0.25, "options": ["A. làm theo.", "B. từ chối khéo, chi tiêu phù hợp điều kiện gia đình.", "C. vay tiền để mua.", "D. xin bố mẹ bằng được."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Học sinh làm thêm để kiếm tiền cần", "explain": "Làm thêm phải bảo đảm học tập, sức khoẻ, công việc phù hợp lứa tuổi.", "points": 0.25, "options": ["A. bỏ học.", "B. cân đối thời gian, ưu tiên học tập, công việc phù hợp, an toàn.", "C. làm việc nặng nhọc.", "D. làm đêm."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Bài học quản lí thu chi giúp học sinh", "explain": "Quản lí tiền tiêu vặt tốt hình thành thói quen tài chính lành mạnh cho tương lai.", "points": 0.25, "options": ["A. chỉ để thi.", "B. hình thành thói quen tài chính tốt cho tương lai.", "C. trở nên keo kiệt.", "D. không cần học."], "answer": "B"}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về quản lí tiền tiêu vặt:", "explain": "a), b), c) Đúng. d) Sai.", "points": 1, "statements": ["a) Nên lập kế hoạch chi tiêu tiền tiêu vặt.", "b) Nên trích một phần để tiết kiệm.", "c) Nên ghi chép các khoản chi.", "d) Nên tiêu hết tiền mỗi ngày."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về chi tiêu của học sinh:", "explain": "a), b), c) Đúng. d) Sai.", "points": 1, "statements": ["a) Cần phân biệt nhu cầu và mong muốn.", "b) Không nên chạy theo bạn bè mua sắm vượt khả năng.", "c) Làm thêm phải ưu tiên học tập.", "d) Vay tiền để mua đồ hiệu là bình thường."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "TH", "q": "Học sinh cần phân biệt nhu cầu và ... muốn để chi tiêu hợp lí (điền 1 từ).", "explain": "Mong muốn.", "points": 0.5, "answer": "mong"}, {"type": "short", "level": "TH", "q": "Điền từ còn thiếu: Quản lí tiền tiêu vặt tốt hình thành thói quen tài chính ... mạnh.", "explain": "Lành mạnh.", "points": 0.5, "answer": "lành"}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "VD", "q": "Tình huống: Gia đình chị T thu nhập 12 triệu/tháng, áp dụng 50/30/20. Khoản tiết kiệm là", "explain": "Tiết kiệm 20% × 12 triệu = 2,4 triệu đồng.", "points": 0.25, "options": ["A. 6 triệu.", "B. 3,6 triệu.", "C. 2,4 triệu.", "D. 12 triệu."], "answer": "C"}, {"type": "mcq", "level": "VD", "q": "Tình huống: Gia đình ông B có quỹ dự phòng 30 triệu, chi thiết yếu 10 triệu/tháng. Quỹ này đủ dùng trong", "explain": "30 triệu / 10 triệu/tháng = 3 tháng – đạt mức tối thiểu khuyến nghị.", "points": 0.25, "options": ["A. 1 tháng.", "B. 3 tháng.", "C. 6 tháng.", "D. 12 tháng."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Tình huống: Chị H mỗi tháng trích 2 triệu gửi tiết kiệm ngay khi nhận lương. Đây là thực hiện nguyên tắc", "explain": "Trích tiết kiệm ngay khi nhận lương là nguyên tắc \"tiết kiệm trước, chi tiêu sau\".", "points": 0.25, "options": ["A. chi tiêu trước.", "B. tiết kiệm trước, chi tiêu sau.", "C. vay nợ.", "D. đầu tư."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Tình huống: Anh K ghi chép mọi khoản chi vào sổ, cuối tháng phát hiện chi cà phê, ăn vặt hết 3 triệu. Việc ghi chép giúp anh K", "explain": "Ghi chép giúp phát hiện lãng phí, điều chỉnh chi tiêu hợp lí.", "points": 0.25, "options": ["A. tốn thời gian.", "B. phát hiện khoản chi lãng phí để điều chỉnh.", "C. tăng chi tiêu.", "D. không có tác dụng."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Tình huống: Gia đình bà S bị mất mùa, phải dùng quỹ dự phòng để trang trải 4 tháng. Điều này cho thấy", "explain": "Quỹ dự phòng phát huy giá trị khi gia đình gặp rủi ro, khó khăn.", "points": 0.25, "options": ["A. quỹ dự phòng là không cần thiết.", "B. giá trị của quỹ dự phòng khi gặp rủi ro.", "C. nên tiêu hết tiền.", "D. nên vay nợ."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Bài học từ các tình huống trên là", "explain": "Quản lí thu chi tốt giúp gia đình chủ động, vững vàng trước biến động.", "points": 0.25, "options": ["A. không cần quản lí thu chi.", "B. quản lí thu chi tốt giúp gia đình vững vàng trước mọi biến động.", "C. cứ chi tiêu thoải mái.", "D. tiền bạc không quan trọng."], "answer": "B"}, {"type": "truefalse", "level": "NB", "q": "Tình huống: Gia đình chị T thu nhập 12 triệu, áp dụng 50/30/20. Xét tính đúng, sai:", "explain": "6 + 3,6 + 2,4 = 12 triệu, vừa đúng. a), b), c) Đúng. d) Sai.", "points": 1, "statements": ["a) Chi thiết yếu là 6 triệu đồng.", "b) Chi tiêu cá nhân là 3,6 triệu đồng.", "c) Tiết kiệm là 2,4 triệu đồng.", "d) Tổng phân bổ vượt thu nhập."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về ghi chép thu chi:", "explain": "a), b), c) Đúng. d) Sai.", "points": 1, "statements": ["a) Ghi chép giúp kiểm soát chi tiêu.", "b) Ghi chép giúp phát hiện lãng phí.", "c) Nên ghi chép thường xuyên, trung thực.", "d) Ghi chép là việc tốn thời gian vô ích."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "TH", "q": "Gia đình thu nhập 12 triệu/tháng, chi thiết yếu 6 triệu. Theo quy tắc 50/30/20, chi tiêu cá nhân là bao nhiêu triệu? (điền số)", "explain": "Chi tiêu cá nhân 30% × 12 triệu = 3,6 triệu đồng.", "points": 0.5, "answer": "3,6"}, {"type": "short", "level": "TH", "q": "Điền từ còn thiếu: ... cho mình trước là trích tiết kiệm ngay khi nhận lương.", "explain": "\"Trả cho mình trước\".", "points": 0.5, "answer": "Trả"}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "VD", "q": "Khi giá cả tăng cao (lạm phát), gia đình nên", "explain": "Lạm phát làm giảm sức mua; cần điều chỉnh kế hoạch, ưu tiên thiết yếu, tăng thu nhập.", "points": 0.25, "options": ["A. giữ nguyên mức chi.", "B. điều chỉnh kế hoạch: ưu tiên thiết yếu, tìm cách tăng thu nhập.", "C. vay nợ để chi tiêu.", "D. ngừng tiết kiệm."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Tiết kiệm năng lượng (điện, nước) trong gia đình vừa", "explain": "Tiết kiệm điện, nước vừa giảm chi phí sinh hoạt vừa bảo vệ môi trường.", "points": 0.25, "options": ["A. không có ý nghĩa.", "B. giảm chi phí vừa bảo vệ môi trường.", "C. gây bất tiện.", "D. tốn kém."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Tái sử dụng, hạn chế rác thải trong gia đình giúp", "explain": "Tái sử dụng, giảm rác thải vừa tiết kiệm vừa bảo vệ môi trường.", "points": 0.25, "options": ["A. mất vệ sinh.", "B. tiết kiệm chi phí, bảo vệ môi trường.", "C. tốn kém.", "D. không nên làm."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Mua sắm theo mùa vụ, săn khuyến mãi hợp lí giúp gia đình", "explain": "Mua sắm thông minh theo mùa vụ, khuyến mãi giúp tiết kiệm đáng kể.", "points": 0.25, "options": ["A. tốn tiền hơn.", "B. tiết kiệm chi phí mua sắm.", "C. mua đồ kém chất lượng.", "D. không nên làm."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Tự trồng rau sạch tại nhà giúp gia đình", "explain": "Tự trồng rau vừa tiết kiệm vừa có thực phẩm an toàn.", "points": 0.25, "options": ["A. tốn công vô ích.", "B. tiết kiệm chi phí ăn uống, có thực phẩm an toàn.", "C. không nên làm.", "D. mất thời gian."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Lối sống tối giản trong chi tiêu có nghĩa là", "explain": "Tối giản là chi tiêu hợp lí, tránh lãng phí, tập trung giá trị thực chứ không phải khổ hạnh.", "points": 0.25, "options": ["A. sống khổ hạnh.", "B. chi tiêu hợp lí, tránh lãng phí, tập trung vào giá trị thực.", "C. không mua sắm gì.", "D. keo kiệt."], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về tiết kiệm trong sinh hoạt:", "explain": "a), b), c) Đúng. d) Sai: tối giản là chi tiêu hợp lí, tránh lãng phí.", "points": 1, "statements": ["a) Tiết kiệm điện, nước vừa giảm chi phí vừa bảo vệ môi trường.", "b) Tái sử dụng giúp tiết kiệm và giảm rác thải.", "c) Mua sắm thông minh giúp tiết kiệm chi phí.", "d) Lối sống tối giản là sống khổ hạnh."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau khi giá cả tăng cao:", "explain": "a), b), c) Đúng. d) Sai.", "points": 1, "statements": ["a) Cần điều chỉnh kế hoạch chi tiêu.", "b) Ưu tiên các khoản chi thiết yếu.", "c) Tìm cách tăng thu nhập.", "d) Vay nợ để giữ nguyên mức chi tiêu."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "TH", "q": "Điền từ còn thiếu: Tiết kiệm điện, nước vừa giảm chi phí vừa bảo vệ ... trường.", "explain": "Môi trường.", "points": 0.5, "answer": "môi"}, {"type": "short", "level": "VD", "q": "Lối sống chi tiêu hợp lí, tránh lãng phí được gọi là lối sống tối ... (1 từ).", "explain": "Tối giản.", "points": 0.5, "answer": "giản"}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "VDC", "q": "Kế hoạch tài chính gia đình thành công cần", "explain": "Cả gia đình cùng tham gia, đồng thuận thì kế hoạch mới được thực hiện tốt.", "points": 0.25, "options": ["A. một người quyết định.", "B. sự tham gia, đồng thuận của các thành viên.", "C. giữ bí mật.", "D. không cần ai biết."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Trẻ em trong gia đình có thể tham gia quản lí thu chi bằng cách", "explain": "Trẻ em góp phần bằng tiết kiệm, không đòi hỏi vô lí, phụ giúp gia đình.", "points": 0.25, "options": ["A. không liên quan.", "B. tiết kiệm tiền tiêu vặt, không đòi hỏi vô lí, phụ giúp việc nhà.", "C. đòi mua đồ đắt tiền.", "D. tiêu xài hoang phí."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Khi vợ chồng bất đồng về chi tiêu, nên", "explain": "Bàn bạc, thống nhất trên cơ sở lợi ích chung là cách giải quyết đúng.", "points": 0.25, "options": ["A. cãi nhau.", "B. bàn bạc, thống nhất trên cơ sở ưu tiên chung của gia đình.", "C. ai kiếm tiền người đó quyết.", "D. ly thân."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Minh bạch tài chính trong gia đình giúp", "explain": "Minh bạch tạo tin tưởng, giúp các thành viên cùng hướng tới mục tiêu chung.", "points": 0.25, "options": ["A. gây mâu thuẫn.", "B. tạo tin tưởng, tránh nghi ngờ, cùng thực hiện mục tiêu.", "C. tốn thời gian.", "D. không cần thiết."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Gia đình văn hoá trong quản lí thu chi thể hiện ở", "explain": "Chi tiêu hợp lí, tiết kiệm, tương trợ nhau là biểu hiện gia đình văn hoá.", "points": 0.25, "options": ["A. chi tiêu hoang phí.", "B. chi tiêu hợp lí, tiết kiệm, tương trợ, hoà thuận.", "C. nợ nần.", "D. cãi vã tiền bạc."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Bài học về quản lí thu chi góp phần xây dựng", "explain": "Quản lí thu chi tốt góp phần xây dựng gia đình no ấm, bình đẳng, tiến bộ, hạnh phúc.", "points": 0.25, "options": ["A. không có ý nghĩa.", "B. gia đình no ấm, bình đẳng, tiến bộ, hạnh phúc.", "C. gia đình giàu có bằng mọi giá.", "D. sự keo kiệt."], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về vai trò các thành viên:", "explain": "a), b), c) Đúng. d) Sai: là việc chung của cả gia đình.", "points": 1, "statements": ["a) Cần sự đồng thuận của các thành viên khi lập kế hoạch.", "b) Trẻ em có thể góp phần bằng tiết kiệm, phụ giúp việc nhà.", "c) Minh bạch tài chính tạo tin tưởng trong gia đình.", "d) Quản lí thu chi là việc riêng của người kiếm tiền."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về chi tiêu hợp lí trong gia đình:", "explain": "a), b), d) Đúng. c) Sai: tiết kiệm khác keo kiệt.", "points": 1, "statements": ["a) Khi bất đồng chi tiêu nên bàn bạc, thống nhất.", "b) Chi tiêu hợp lí góp phần gia đình hạnh phúc.", "c) Tiết kiệm là keo kiệt.", "d) Tương trợ nhau lúc khó khăn là truyền thống tốt đẹp."], "answer": ["T", "T", "F", "T"]}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Gia đình no ấm, bình đẳng, tiến bộ, ... phúc.", "explain": "Hạnh phúc.", "points": 0.5, "answer": "hạnh"}, {"type": "short", "level": "VD", "q": "Khi bất đồng về chi tiêu, vợ chồng nên bàn bạc, ... nhất (điền 1 từ).", "explain": "Thống nhất.", "points": 0.5, "answer": "thống"}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "VDC", "q": "Tổng kết, nguyên tắc quan trọng nhất trong quản lí thu, chi gia đình là", "explain": "Chi trong khả năng thu nhập và tiết kiệm trước là hai nguyên tắc cốt lõi.", "points": 0.25, "options": ["A. kiếm thật nhiều tiền.", "B. chi tiêu trong khả năng thu nhập, tiết kiệm trước chi tiêu sau.", "C. vay nợ dễ dàng.", "D. tiêu hết thu nhập."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Một sinh viên xa nhà quản lí tiền sinh hoạt nên", "explain": "Lập kế hoạch, phân bổ, ghi chép, tiết kiệm là cách quản lí đúng cho sinh viên xa nhà.", "points": 0.25, "options": ["A. tiêu theo cảm hứng.", "B. lập kế hoạch tháng, phân bổ các khoản, ghi chép, trích tiết kiệm.", "C. vay bạn bè.", "D. nhịn ăn để tiết kiệm."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Khi nhận lương tháng đầu tiên đi làm, việc nên làm là", "explain": "Trích tiết kiệm, chi theo kế hoạch và hiếu thảo với bố mẹ là cách đúng.", "points": 0.25, "options": ["A. tiêu hết ăn mừng.", "B. trích tiết kiệm, chi tiêu theo kế hoạch, biếu bố mẹ.", "C. mua sắm thả ga.", "D. cho vay hết."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Bài học quản lí thu chi có ý nghĩa suốt đời vì", "explain": "Quản lí tài chính là kĩ năng cần thiết suốt đời, ở mọi giai đoạn.", "points": 0.25, "options": ["A. chỉ để thi.", "B. tài chính cá nhân, gia đình luôn cần được quản lí ở mọi giai đoạn cuộc sống.", "C. ai cũng giàu.", "D. không cần thiết."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Thông điệp của bài học về quản lí thu chi gia đình là", "explain": "Quản lí tốt giúp gia đình ổn định, có tích luỹ và vững vàng trước rủi ro.", "points": 0.25, "options": ["A. tiền là tất cả.", "B. quản lí thu chi tốt giúp gia đình ổn định, tích luỹ và vững vàng trước rủi ro.", "C. cứ tiêu xài thoải mái.", "D. giàu mới cần quản lí."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Học sinh lớp 12 sau bài học này cần", "explain": "Áp dụng vào quản lí tiền tiêu vặt, hình thành thói quen tài chính tốt từ sớm.", "points": 0.25, "options": ["A. quên ngay.", "B. áp dụng quản lí tiền tiêu vặt, hình thành thói quen tài chính tốt.", "C. đòi tăng tiền tiêu vặt.", "D. không quan tâm."], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng kết về quản lí thu chi trong gia đình):", "explain": "a), b), c) Đúng. d) Sai: mọi gia đình đều cần.", "points": 1, "statements": ["a) Nguyên tắc cốt lõi: chi trong khả năng thu nhập, tiết kiệm trước.", "b) Quỹ dự phòng 3–6 tháng chi tiêu giúp vững vàng trước rủi ro.", "c) Quy tắc 50/30/20 là gợi ý phân bổ thu nhập hợp lí.", "d) Quản lí thu chi chỉ cần thiết với gia đình giàu."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau (tổng kết 2 về quản lí thu chi trong gia đình):", "explain": "a), b), c) Đúng. d) Sai.", "points": 1, "statements": ["a) Ghi chép, theo dõi giúp kiểm soát chi tiêu.", "b) Cần cảnh giác với lừa đảo đầu tư, tín dụng đen.", "c) Cả gia đình cần đồng thuận khi thực hiện kế hoạch.", "d) Học sinh không cần học quản lí tài chính."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "VD", "q": "Hoàn thành câu: Chi trong khả năng ... nhập là nguyên tắc cốt lõi.", "explain": "Thu nhập.", "points": 0.5, "answer": "thu"}, {"type": "short", "level": "VDC", "q": "Nguyên tắc vàng: ... kiệm trước, chi tiêu sau (điền 1 từ).", "explain": "Tiết kiệm trước, chi tiêu sau.", "points": 0.5, "answer": "Tiết"}]}]}
