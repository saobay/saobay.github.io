 cả mọi người.", "B. nhóm khách hàng mà sản phẩm/dịch vụ hướng tới phục vụ.", "C. đối thủ cạnh tranh.", "D. nhà cung cấp."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Bạn Lan mở shop quần áo online hướng tới học sinh, sinh viên. Đây là việc", "explain": "Xác định phục vụ học sinh, sinh viên là xác định khách hàng mục tiêu.", "points": 0.25, "options": ["A. xác định khách hàng mục tiêu.", "B. huy động vốn.", "C. tuyển nhân viên.", "D. nộp thuế."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Lợi thế khi bán hàng online là", "explain": "Bán online tiết kiệm chi phí mặt bằng, tiếp cận khách hàng rộng qua mạng xã hội.", "points": 0.25, "options": ["A. chi phí mặt bằng thấp, tiếp cận nhiều khách hàng.", "B. không cần quảng cáo.", "C. không cần vốn.", "D. không có cạnh tranh."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Rủi ro khi kinh doanh online là", "explain": "Kinh doanh online đối mặt cạnh tranh gay gắt, tồn kho, thị hiếu thay đổi nhanh, rủi ro lừa đảo.", "points": 0.25, "options": ["A. không có rủi ro.", "B. cạnh tranh gay gắt, hàng tồn kho, biến động thị hiếu, lừa đảo.", "C. luôn thành công.", "D. không cần vốn."], "answer": "B"}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về ý tưởng kinh doanh:", "explain": "a), b), c) Đúng. d) Sai: ý tưởng phải gắn với nhu cầu khách hàng.", "points": 1, "statements": ["a) Ý tưởng cần đáp ứng nhu cầu thị trường.", "b) Cần đánh giá tính khả thi về vốn và năng lực.", "c) Nên khảo sát thị trường trước khi kinh doanh.", "d) Ý tưởng càng độc lạ càng tốt, không cần khách hàng."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "VDC", "q": "Tình huống: Lan dự tính bán 300 sản phẩm/tháng, lãi 50.000đ/sản phẩm. Xét tính đúng, sai:", "explain": "Doanh thu $300×150.000 = 45$ triệu; lợi nhuận $300×50.000 = 15$ triệu. a), b), c) Đúng. d) Sai: cần dự phòng rủi ro.", "points": 1, "statements": ["a) Doanh thu dự kiến là 45 triệu đồng/tháng.", "b) Lợi nhuận dự kiến là 15 triệu đồng/tháng.", "c) Lan đã lập kế hoạch tài chính sơ bộ.", "d) Lan không cần dự phòng rủi ro."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "NB", "q": "Bạn Lan dự tính lãi 50.000đ/sản phẩm, bán 300 sản phẩm/tháng. Lợi nhuận dự kiến một tháng là bao nhiêu triệu đồng? (điền số)", "explain": "Lợi nhuận = $300 \\times 50.000 = 15.000.000$ đồng = 15 triệu đồng.", "points": 0.5, "answer": "15"}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Khách hàng ... là nhóm khách hàng mà hoạt động kinh doanh hướng tới.", "explain": "Khách hàng mục tiêu.", "points": 0.5, "answer": "mục tiêu"}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "TH", "q": "Vốn đầu tư ban đầu của một dự án kinh doanh bao gồm", "explain": "Vốn đầu tư ban đầu gồm mặt bằng, trang thiết bị, nguyên liệu, vốn lưu động và các chi phí khác.", "points": 0.25, "options": ["A. chỉ tiền thuê mặt bằng.", "B. chi phí mặt bằng, trang thiết bị, nguyên liệu, vốn lưu động...", "C. chỉ tiền lương.", "D. không cần vốn."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Nguồn vốn kinh doanh có thể huy động từ", "explain": "Các nguồn vốn: tự có, vay ngân hàng, gọi vốn nhà đầu tư, chính sách hỗ trợ...", "points": 0.25, "options": ["A. vốn tự có, vay ngân hàng, gọi vốn đầu tư, hỗ trợ của Nhà nước...", "B. chỉ vay nặng lãi.", "C. chỉ trông chờ tài trợ.", "D. không có nguồn nào."], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Khi vay vốn ngân hàng để kinh doanh, cần", "explain": "Vay vốn cần tính toán khả năng trả nợ, có kế hoạch khả thi và phương án trả nợ rõ ràng.", "points": 0.25, "options": ["A. vay càng nhiều càng tốt.", "B. tính toán khả năng trả nợ, có kế hoạch kinh doanh khả thi.", "C. không cần trả.", "D. vay không cần thế chấp luôn được."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Vay tín dụng đen để kinh doanh là", "explain": "Tín dụng đen lãi suất cao, đe doạ an toàn tài chính và tính mạng; cần tránh xa.", "points": 0.25, "options": ["A. giải pháp tốt.", "B. rất rủi ro: lãi suất cao, dễ mất khả năng trả nợ, vi phạm pháp luật.", "C. được Nhà nước khuyến khích.", "D. không sao."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Dòng tiền trong kinh doanh là", "explain": "Dòng tiền là tiền vào (thu) và tiền ra (chi); quản lí dòng tiền tốt bảo đảm khả năng chi trả.", "points": 0.25, "options": ["A. tiền lãi.", "B. sự vận động của tiền vào và tiền ra trong hoạt động kinh doanh.", "C. tiền vốn.", "D. tiền thuế."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Doanh nghiệp có lãi nhưng thiếu tiền mặt để trả lương là do", "explain": "Lãi trên sổ sách nhưng thiếu tiền mặt là dấu hiệu quản lí dòng tiền kém.", "points": 0.25, "options": ["A. quản lí dòng tiền kém.", "B. không có lãi.", "C. thuế quá cao.", "D. nhân viên đòi hỏi."], "answer": "A"}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về vốn kinh doanh:", "explain": "a), b), c) Đúng. d) Sai: tín dụng đen rất rủi ro, vi phạm pháp luật.", "points": 1, "statements": ["a) Cần dự tính đầy đủ vốn đầu tư ban đầu.", "b) Có thể huy động vốn từ nhiều nguồn hợp pháp.", "c) Vay vốn cần tính toán khả năng trả nợ.", "d) Nên vay tín dụng đen vì thủ tục nhanh."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về dòng tiền:", "explain": "a), b), c) Đúng. d) Sai: dòng tiền quyết định khả năng tồn tại của doanh nghiệp.", "points": 1, "statements": ["a) Dòng tiền là tiền vào và tiền ra trong kinh doanh.", "b) Có lãi nhưng thiếu tiền mặt là do quản lí dòng tiền kém.", "c) Cần dự phòng tiền mặt cho các khoản chi đột xuất.", "d) Dòng tiền không quan trọng bằng lợi nhuận."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "NB", "q": "Khoản vay với lãi suất cao bất hợp pháp, đe doạ người vay được gọi là tín dụng ... (điền 1 từ).", "explain": "Tín dụng đen.", "points": 0.5, "answer": "đen"}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Vay vốn kinh doanh cần tính toán khả năng ... nợ.", "explain": "Cần tính toán khả năng trả nợ trước khi vay vốn.", "points": 0.5, "answer": "trả"}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "TH", "q": "Kế hoạch nhân sự trong kinh doanh bao gồm", "explain": "Kế hoạch nhân sự: số lượng, trình độ, phân công, đãi ngộ phù hợp quy mô kinh doanh.", "points": 0.25, "options": ["A. số lượng, trình độ lao động, phân công công việc, chính sách đãi ngộ.", "B. chỉ tuyển người nhà.", "C. không cần kế hoạch.", "D. tuyển càng đông càng tốt."], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Đối với hộ kinh doanh nhỏ, yếu tố nhân sự quan trọng nhất là", "explain": "Hộ kinh doanh nhỏ cần người có kĩ năng, thái độ tốt và gắn bó hơn là số lượng đông.", "points": 0.25, "options": ["A. số lượng đông.", "B. người lao động có kĩ năng, thái độ tốt, gắn bó.", "C. bằng cấp cao.", "D. quan hệ rộng."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Chính sách đãi ngộ tốt giúp", "explain": "Đãi ngộ tốt giữ chân nhân tài, tạo động lực, nâng cao năng suất lao động.", "points": 0.25, "options": ["A. tốn chi phí vô ích.", "B. giữ chân người lao động giỏi, nâng cao năng suất.", "C. giảm chất lượng.", "D. tăng nghỉ việc."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Rủi ro thị trường trong kinh doanh là", "explain": "Rủi ro thị trường: nhu cầu thay đổi, đối thủ cạnh tranh, biến động giá cả...", "points": 0.25, "options": ["A. nhu cầu thay đổi, đối thủ mới, giá cả biến động...", "B. không có rủi ro.", "C. chỉ do thiên tai.", "D. do nhân viên."], "answer": "A"}, {"type": "mcq", "level": "VDC", "q": "Rủi ro tài chính trong kinh doanh là", "explain": "Rủi ro tài chính: thiếu vốn lưu động, nợ khó đòi, lãi suất, tỉ giá biến động...", "points": 0.25, "options": ["A. thiếu vốn, khó thu hồi công nợ, lãi suất tăng...", "B. không có rủi ro.", "C. chỉ do khách hàng.", "D. do thời tiết."], "answer": "A"}, {"type": "mcq", "level": "VDC", "q": "Biện pháp dự phòng rủi ro trong kinh doanh là", "explain": "Dự phòng rủi ro: quỹ dự phòng, đa dạng hoá, bảo hiểm, kế hoạch ứng phó...", "points": 0.25, "options": ["A. không cần dự phòng.", "B. có quỹ dự phòng, đa dạng hoá sản phẩm, mua bảo hiểm...", "C. liều lĩnh đầu tư hết vốn.", "D. trông chờ may rủi."], "answer": "B"}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về nhân sự và rủi ro:", "explain": "a), b), c) Đúng. d) Sai: kinh doanh luôn tiềm ẩn rủi ro.", "points": 1, "statements": ["a) Cần lập kế hoạch nhân sự phù hợp quy mô kinh doanh.", "b) Đãi ngộ tốt giúp giữ chân người lao động.", "c) Rủi ro thị trường gồm nhu cầu thay đổi, cạnh tranh, biến động giá.", "d) Kinh doanh không có bất kì rủi ro nào."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về dự phòng rủi ro:", "explain": "a), b), c) Đúng. d) Sai: cần thận trọng, dự phòng.", "points": 1, "statements": ["a) Nên có quỹ dự phòng cho tình huống xấu.", "b) Đa dạng hoá sản phẩm giúp giảm rủi ro.", "c) Mua bảo hiểm là một cách chuyển giao rủi ro.", "d) Cứ liều lĩnh đầu tư hết vốn là tốt nhất."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Quỹ ... phòng giúp doanh nghiệp ứng phó tình huống xấu.", "explain": "Quỹ dự phòng.", "points": 0.5, "answer": "dự"}, {"type": "short", "level": "TH", "q": "Biện pháp chuyển giao rủi ro cho doanh nghiệp bảo hiểm là mua ... (1 từ).", "explain": "Mua bảo hiểm để chuyển giao rủi ro.", "points": 0.5, "answer": "bảo hiểm"}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "TH", "q": "Đăng kí kinh doanh (hộ kinh doanh, doanh nghiệp) là", "explain": "Đăng kí kinh doanh là nghĩa vụ pháp lí, là điều kiện để hoạt động hợp pháp và được pháp luật bảo vệ.", "points": 0.25, "options": ["A. không bắt buộc.", "B. nghĩa vụ pháp lí để hoạt động kinh doanh hợp pháp.", "C. chỉ để nộp thuế.", "D. thủ tục rườm rà vô ích."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Kinh doanh không đăng kí sẽ", "explain": "Kinh doanh không đăng kí bị xử phạt hành chính; quy mô lớn có thể bị truy cứu TNHS.", "points": 0.25, "options": ["A. không sao.", "B. bị xử phạt vi phạm hành chính, thậm chí truy cứu trách nhiệm hình sự.", "C. được khen.", "D. được miễn thuế."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Hộ kinh doanh cá thể phù hợp với", "explain": "Hộ kinh doanh cá thể phù hợp quy mô nhỏ, thủ tục đơn giản.", "points": 0.25, "options": ["A. tập đoàn lớn.", "B. quy mô nhỏ, ít lao động, vốn ít.", "C. công ty đa quốc gia.", "D. ngân hàng."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Khi kinh doanh ăn uống, cần tuân thủ", "explain": "Kinh doanh ăn uống phải tuân thủ an toàn thực phẩm, vệ sinh môi trường theo quy định.", "points": 0.25, "options": ["A. không cần gì.", "B. quy định về an toàn thực phẩm, vệ sinh môi trường.", "C. chỉ cần ngon.", "D. chỉ cần rẻ."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Quảng cáo sai sự thật về sản phẩm sẽ", "explain": "Quảng cáo sai sự thật bị xử phạt vi phạm hành chính và làm mất uy tín, khách hàng.", "points": 0.25, "options": ["A. giúp bán hàng tốt.", "B. bị xử phạt, mất uy tín, mất khách hàng.", "C. được khuyến khích.", "D. không ai xử lí."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Bảo vệ quyền lợi người tiêu dùng trong kinh doanh thể hiện ở", "explain": "Tôn trọng người tiêu dùng: hàng đúng chất lượng, niêm yết giá, bảo hành rõ ràng.", "points": 0.25, "options": ["A. bán hàng giả.", "B. hàng hoá đúng chất lượng, giá niêm yết, bảo hành rõ ràng.", "C. cân thiếu.", "D. ép giá."], "answer": "B"}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về pháp lí kinh doanh:", "explain": "a), b), c) Đúng. d) Sai: quảng cáo sai sự thật bị xử phạt.", "points": 1, "statements": ["a) Phải đăng kí kinh doanh để hoạt động hợp pháp.", "b) Kinh doanh không đăng kí bị xử phạt.", "c) Kinh doanh ăn uống phải bảo đảm an toàn thực phẩm.", "d) Quảng cáo sai sự thật không bị xử lí."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về đạo đức kinh doanh:", "explain": "a), b), c) Đúng. d) Sai: vi phạm pháp luật và đạo đức kinh doanh.", "points": 1, "statements": ["a) Cần trung thực về chất lượng sản phẩm.", "b) Cần niêm yết giá rõ ràng.", "c) Cần tôn trọng quyền lợi người tiêu dùng.", "d) Bán hàng giả, hàng kém chất lượng là bình thường."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "TH", "q": "Hoạt động kinh doanh mà không đăng kí theo quy định sẽ bị xử phạt vi phạm ... (điền 1 từ).", "explain": "Xử phạt vi phạm hành chính.", "points": 0.5, "answer": "hành chính"}, {"type": "short", "level": "TH", "q": "Hộ kinh doanh ... thể phù hợp với quy mô nhỏ, ít lao động (điền 1 từ).", "explain": "Hộ kinh doanh cá thể.", "points": 0.5, "answer": "cá"}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "VD", "q": "Khởi nghiệp là", "explain": "Khởi nghiệp là bắt đầu hoạt động kinh doanh, thường với ý tưởng, mô hình mới, sáng tạo.", "points": 0.25, "options": ["A. bắt đầu hoạt động kinh doanh với ý tưởng, sản phẩm mới.", "B. đi xin việc.", "C. nghỉ hưu.", "D. đi du học."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Khởi nghiệp sáng tạo khác kinh doanh truyền thống ở", "explain": "Khởi nghiệp sáng tạo nhấn mạnh đổi mới, công nghệ, mô hình mới với khả năng tăng trưởng nhanh.", "points": 0.25, "options": ["A. quy mô nhỏ hơn.", "B. tính đổi mới, ứng dụng công nghệ, khả năng tăng trưởng nhanh.", "C. không cần vốn.", "D. không có rủi ro."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Tố chất cần có của người khởi nghiệp là", "explain": "Người khởi nghiệp cần dám nghĩ dám làm, kiên trì, ham học hỏi và chấp nhận rủi ro có tính toán.", "points": 0.25, "options": ["A. lười biếng.", "B. dám nghĩ dám làm, kiên trì, ham học hỏi, chấp nhận rủi ro có tính toán.", "C. sợ thất bại.", "D. trông chờ may mắn."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Thất bại trong khởi nghiệp nên được nhìn nhận là", "explain": "Thất bại là bài học quý; nhiều doanh nhân thành công đã trải qua nhiều lần thất bại.", "points": 0.25, "options": ["A. dấu chấm hết.", "B. bài học kinh nghiệm để đứng lên làm lại tốt hơn.", "C. điều xấu hổ.", "D. lí do bỏ cuộc."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Hệ sinh thái khởi nghiệp bao gồm", "explain": "Hệ sinh thái khởi nghiệp gồm nhà đầu tư, vườn ươm, chính sách, thị trường, nhân lực...", "points": 0.25, "options": ["A. chỉ doanh nhân.", "B. nhà đầu tư, vườn ươm, chính sách hỗ trợ, thị trường, nguồn nhân lực...", "C. chỉ ngân hàng.", "D. chỉ Nhà nước."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Chính sách hỗ trợ khởi nghiệp của Nhà nước gồm", "explain": "Nhà nước có nhiều chính sách hỗ trợ khởi nghiệp: vốn, đào tạo, mặt bằng, cải cách thủ tục.", "points": 0.25, "options": ["A. không hỗ trợ gì.", "B. hỗ trợ vốn, mặt bằng, đào tạo, đơn giản hoá thủ tục...", "C. cấm khởi nghiệp.", "D. đánh thuế cao."], "answer": "B"}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về khởi nghiệp:", "explain": "a), b), c) Đúng. d) Sai: khởi nghiệp luôn tiềm ẩn rủi ro thất bại.", "points": 1, "statements": ["a) Khởi nghiệp là bắt đầu hoạt động kinh doanh với ý tưởng mới.", "b) Người khởi nghiệp cần dám nghĩ dám làm, kiên trì.", "c) Thất bại là bài học để làm lại tốt hơn.", "d) Khởi nghiệp không bao giờ thất bại."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về hệ sinh thái khởi nghiệp:", "explain": "a), b), c) Đúng. d) Sai: cần vốn, nhân lực, thị trường, chính sách...", "points": 1, "statements": ["a) Cần có nhà đầu tư, vườn ươm khởi nghiệp.", "b) Nhà nước có chính sách hỗ trợ khởi nghiệp.", "c) Thị trường và nguồn nhân lực là yếu tố quan trọng.", "d) Khởi nghiệp chỉ cần ý tưởng, không cần gì khác."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "TH", "q": "Điền từ còn thiếu: Người khởi nghiệp cần dám nghĩ dám ...", "explain": "Dám nghĩ dám làm.", "points": 0.5, "answer": "làm"}, {"type": "short", "level": "TH", "q": "Nơi ươm tạo, hỗ trợ các dự án khởi nghiệp được gọi là vườn ... (1 từ).", "explain": "Vườn ươm khởi nghiệp.", "points": 0.5, "answer": "ươm"}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "VD", "q": "Tình huống: Anh H mở quán phở, khảo sát kĩ nhu cầu khu vực, tính toán điểm hoà vốn rồi mới khai trương. Cách làm của anh H", "explain": "Khảo sát thị trường, tính điểm hoà vốn trước khi mở quán là lập kế hoạch bài bản.", "points": 0.25, "options": ["A. rườm rà.", "B. bài bản: lập kế hoạch trước khi kinh doanh.", "C. liều lĩnh.", "D. không cần thiết."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Tình huống: Chị K mở shop thời trang theo phong trào, không tính toán, 6 tháng sau phải đóng cửa vì lỗ. Nguyên nhân chính là", "explain": "Kinh doanh theo phong trào, không lập kế hoạch là nguyên nhân phổ biến dẫn tới thất bại.", "points": 0.25, "options": ["A. thiếu may mắn.", "B. không lập kế hoạch kinh doanh, đầu tư theo phong trào.", "C. thị trường quá tốt.", "D. vốn quá nhiều."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Tình huống: HTX rau sạch lập kế hoạch liên kết với siêu thị, bao tiêu sản phẩm. Đây là kế hoạch về", "explain": "Liên kết bao tiêu sản phẩm là kế hoạch về phân phối, tiêu thụ.", "points": 0.25, "options": ["A. tài chính.", "B. phân phối, tiêu thụ sản phẩm.", "C. nhân sự.", "D. rủi ro."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Tình huống: Doanh nghiệp D dự phòng 10% vốn cho rủi ro biến động giá nguyên liệu. Đây là", "explain": "Dự phòng vốn cho biến động giá là biện pháp quản trị rủi ro tài chính.", "points": 0.25, "options": ["A. lãng phí.", "B. quản trị rủi ro: dự phòng tài chính.", "C. đầu tư.", "D. trốn thuế."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Trong các kế hoạch sau, kế hoạch nào quan trọng nhất khi khởi nghiệp với vốn ít?", "explain": "Vốn ít thì kế hoạch tài chính chặt chẽ là sống còn: kiểm soát chi phí, dòng tiền.", "points": 0.25, "options": ["A. Kế hoạch tài chính chặt chẽ: tính toán kĩ chi phí, điểm hoà vốn, dòng tiền.", "B. Kế hoạch quảng cáo hoành tráng.", "C. Kế hoạch tuyển nhiều nhân viên.", "D. Kế hoạch mở rộng nhanh."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Sai lầm phổ biến của người mới khởi nghiệp là", "explain": "Lạc quan thái quá về doanh thu, xem nhẹ chi phí và rủi ro là sai lầm phổ biến.", "points": 0.25, "options": ["A. lập kế hoạch kĩ.", "B. đánh giá thấp chi phí, đánh giá cao doanh thu, không dự phòng rủi ro.", "C. tìm hiểu thị trường.", "D. tiết kiệm chi phí."], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Anh H tính điểm hoà vốn trước khi mở quán. Xét tính đúng, sai:", "explain": "a), b), c) Đúng. d) Sai.", "points": 1, "statements": ["a) Anh H đã lập kế hoạch tài chính.", "b) Biết điểm hoà vốn giúp xác định mục tiêu doanh số tối thiểu.", "c) Khảo sát nhu cầu giúp giảm rủi ro.", "d) Mở quán không cần tính toán gì."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Chị K đóng cửa shop vì kinh doanh theo phong trào. Xét tính đúng, sai:", "explain": "a), b), c) Đúng. d) Sai: nguyên nhân chính là thiếu chuẩn bị.", "points": 1, "statements": ["a) Nguyên nhân là không lập kế hoạch kinh doanh.", "b) Kinh doanh theo phong trào rất rủi ro.", "c) Cần phân tích thị trường trước khi đầu tư.", "d) Thất bại là do thiếu may mắn hoàn toàn."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "TH", "q": "Điền từ còn thiếu: Kinh doanh theo ... rất dễ thất bại.", "explain": "Kinh doanh theo phong trào, thiếu kế hoạch rất rủi ro.", "points": 0.5, "answer": "phong trào"}, {"type": "short", "level": "VD", "q": "Khi khởi nghiệp với vốn ít, kế hoạch nào là sống còn? (điền: tài chính/nhân sự/marketing)", "explain": "Kế hoạch tài chính chặt chẽ là sống còn khi vốn ít.", "points": 0.5, "answer": "tài chính"}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "VDC", "q": "Mục tiêu kinh doanh cần đảm bảo tính", "explain": "Mục tiêu tốt phải cụ thể, đo lường được, khả thi và có thời hạn (nguyên tắc SMART).", "points": 0.25, "options": ["A. chung chung.", "B. cụ thể, đo lường được, khả thi, có thời hạn.", "C. viển vông.", "D. bí mật."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Ví dụ về mục tiêu tốt là", "explain": "Mục tiêu tốt: cụ thể (500 triệu), đo lường được, có thời hạn (6 tháng).", "points": 0.25, "options": ["A. \"cố gắng bán nhiều\".", "B. \"đạt doanh thu 500 triệu đồng trong 6 tháng đầu năm\".", "C. \"trở thành tỉ phú\".", "D. \"làm giàu nhanh\"."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Chiến lược kinh doanh là", "explain": "Chiến lược là định hướng dài hạn, cách thức đạt mục tiêu và tạo lợi thế cạnh tranh.", "points": 0.25, "options": ["A. kế hoạch dài hạn để đạt mục tiêu, tạo lợi thế cạnh tranh.", "B. mẹo vặt.", "C. mánh khoé.", "D. không cần thiết."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Lợi thế cạnh tranh của doanh nghiệp nhỏ có thể là", "explain": "Doanh nghiệp nhỏ cạnh tranh bằng sự tận tâm, sản phẩm đặc trưng, linh hoạt.", "points": 0.25, "options": ["A. giá rẻ nhất.", "B. phục vụ tận tâm, sản phẩm đặc trưng, linh hoạt.", "C. quy mô lớn.", "D. vốn nhiều."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Để giữ chân khách hàng, cần", "explain": "Giữ chân khách hàng bằng chất lượng ổn định, dịch vụ tốt và chăm sóc sau bán.", "points": 0.25, "options": ["A. bán một lần.", "B. chất lượng ổn định, dịch vụ tốt, chăm sóc sau bán.", "C. tăng giá liên tục.", "D. quảng cáo sai sự thật."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Đánh giá hiệu quả kinh doanh định kì giúp", "explain": "Đánh giá định kì giúp so sánh thực tế với mục tiêu, kịp thời điều chỉnh.", "points": 0.25, "options": ["A. tốn thời gian.", "B. kịp thời phát hiện vấn đề, điều chỉnh kế hoạch.", "C. giảm lợi nhuận.", "D. mất khách hàng."], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về mục tiêu và chiến lược:", "explain": "a), b), c) Đúng. d) Sai: mục tiêu cần cụ thể.", "points": 1, "statements": ["a) Mục tiêu cần cụ thể, đo lường được, có thời hạn.", "b) Chiến lược là định hướng dài hạn để đạt mục tiêu.", "c) Doanh nghiệp nhỏ có thể cạnh tranh bằng sự tận tâm, linh hoạt.", "d) Mục tiêu càng chung chung càng tốt."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về khách hàng:", "explain": "a), b), c) Đúng. d) Sai: giữ chân khách cũ quan trọng không kém thu hút khách mới.", "points": 1, "statements": ["a) Chất lượng ổn định giúp giữ chân khách hàng.", "b) Dịch vụ, chăm sóc sau bán quan trọng.", "c) Cần đánh giá hiệu quả kinh doanh định kì.", "d) Chỉ cần thu hút khách mới, không cần giữ khách cũ."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "VD", "q": "Nguyên tắc đặt mục tiêu: cụ thể, đo lường được, khả thi, có thời hạn có tên viết tắt là gì?", "explain": "Nguyên tắc SMART: Specific, Measurable, Achievable, Relevant, Time-bound.", "points": 0.5, "answer": "SMART"}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Chiến lược kinh doanh tạo ... cạnh tranh cho doanh nghiệp.", "explain": "Lợi thế cạnh tranh.", "points": 0.5, "answer": "lợi thế"}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "VDC", "q": "Tổng kết, bước nào là quan trọng nhất trong lập kế hoạch kinh doanh?", "explain": "Các bước lập kế hoạch liên quan chặt chẽ, tạo thành quy trình thống nhất, không thể xem nhẹ bước nào.", "points": 0.25, "options": ["A. Mỗi bước đều quan trọng, tạo thành quy trình thống nhất.", "B. Chỉ cần bước huy động vốn.", "C. Chỉ cần bước marketing.", "D. Bỏ qua bước đánh giá rủi ro."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Một học sinh lớp 12 muốn tập kinh doanh nhỏ (bán đồ handmade online). Lời khuyên đúng là", "explain": "Dù kinh doanh nhỏ cũng nên lập kế hoạch: khách hàng, chi phí, giá, kênh bán.", "points": 0.25, "options": ["A. làm ngay không cần tính toán.", "B. lập kế hoạch nhỏ: xác định khách hàng, tính chi phí, giá bán, kênh bán.", "C. vay nặng lãi để làm lớn.", "D. bỏ học để kinh doanh."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Khi tính giá bán sản phẩm handmade, cần tính đủ", "explain": "Giá bán phải bù đắp nguyên liệu, công sức, chi phí và có lợi nhuận hợp lí.", "points": 0.25, "options": ["A. chỉ tiền nguyên liệu.", "B. nguyên liệu, công sức, chi phí khác và lợi nhuận hợp lí.", "C. giá tuỳ hứng.", "D. giá rẻ nhất."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Kênh bán hàng phù hợp cho học sinh kinh doanh online là", "explain": "Mạng xã hội, sàn TMĐT là kênh phù hợp, chi phí thấp cho học sinh.", "points": 0.25, "options": ["A. thuê cửa hàng lớn.", "B. mạng xã hội, sàn thương mại điện tử.", "C. mở siêu thị.", "D. bán dạo."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Bài học về lập kế hoạch kinh doanh giúp học sinh", "explain": "Tư duy lập kế hoạch áp dụng được cho học tập, cuộc sống, không chỉ kinh doanh.", "points": 0.25, "options": ["A. chỉ để thi.", "B. có tư duy kinh tế, biết lập kế hoạch cho học tập và cuộc sống.", "C. trở thành doanh nhân ngay.", "D. không có ích gì."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Thông điệp của bài học về lập kế hoạch kinh doanh là", "explain": "Thành công đến từ sự chuẩn bị kĩ lưỡng bằng kế hoạch cụ thể, khả thi.", "points": 0.25, "options": ["A. ai cũng phải kinh doanh.", "B. muốn thành công cần chuẩn bị kĩ lưỡng bằng kế hoạch cụ thể, khả thi.", "C. kinh doanh là dễ dàng.", "D. không cần học vẫn giàu."], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng kết về lập kế hoạch kinh doanh):", "explain": "a), b), c) Đúng. d) Sai.", "points": 1, "statements": ["a) Lập kế hoạch kinh doanh gồm 6 bước cơ bản.", "b) Điểm hoà vốn giúp xác định doanh số tối thiểu cần đạt.", "c) SWOT giúp phân tích điểm mạnh, yếu, cơ hội, thách thức.", "d) Kinh doanh thành công không cần kế hoạch."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau (tổng kết 2 về lập kế hoạch kinh doanh):", "explain": "a), b), c) Đúng. d) Sai: tư duy lập kế hoạch áp dụng cho học tập, cuộc sống.", "points": 1, "statements": ["a) Cần đăng kí kinh doanh để hoạt động hợp pháp.", "b) Cần trung thực, tôn trọng người tiêu dùng.", "c) Cần dự phòng rủi ro trong kinh doanh.", "d) Học sinh không thể áp dụng bài học vào cuộc sống."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "VD", "q": "Hoàn thành câu: Không lập kế hoạch là lập kế hoạch cho ... (1 từ).", "explain": "\"Không lập kế hoạch là lập kế hoạch cho thất bại.\"", "points": 0.5, "answer": "thất bại"}, {"type": "short", "level": "VDC", "q": "Mục tiêu kinh doanh cần cụ thể, đo lường được, khả thi và có ... (1 từ).", "explain": "Mục tiêu SMART: có thời hạn.", "points": 0.5, "answer": "thời hạn"}]}]}
