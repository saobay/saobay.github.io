n bồi thường bảo hiểm có được vượt quá thiệt hại thực tế không? (trả lời: có/không)", "explain": "Nguyên tắc bồi thường: số tiền bồi thường không vượt quá thiệt hại thực tế, chống trục lợi bảo hiểm.", "points": 0.5, "answer": "không"}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Bản chất của bảo hiểm là chia sẻ ... (1 từ).", "explain": "Bản chất của bảo hiểm là chia sẻ rủi ro, tương trợ lẫn nhau.", "points": 0.5, "answer": "rủi ro"}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Luật Kinh doanh bảo hiểm hiện hành được ban hành năm", "explain": "Luật Kinh doanh bảo hiểm 2022 (có hiệu lực từ 01/01/2023) điều chỉnh hoạt động kinh doanh bảo hiểm hiện nay.", "points": 0.25, "options": ["A. 2000.", "B. 2010.", "C. 2022.", "D. 2024."], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Hợp đồng bảo hiểm là", "explain": "Hợp đồng bảo hiểm là sự thoả thuận giữa bên mua bảo hiểm và doanh nghiệp bảo hiểm.", "points": 0.25, "options": ["A. sự thoả thuận giữa bên mua bảo hiểm và doanh nghiệp bảo hiểm về quyền, nghĩa vụ các bên.", "B. giấy nộp thuế.", "C. giấy phạt vi phạm.", "D. đơn xin việc."], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Bên mua bảo hiểm có nghĩa vụ", "explain": "Bên mua bảo hiểm phải đóng phí đầy đủ, đúng hạn và cung cấp thông tin trung thực.", "points": 0.25, "options": ["A. đóng phí bảo hiểm đầy đủ, đúng hạn; thông báo trung thực các thông tin.", "B. không cần đóng phí.", "C. được khai gian.", "D. không cần thực hiện gì."], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Doanh nghiệp bảo hiểm có nghĩa vụ", "explain": "Doanh nghiệp bảo hiểm phải bồi thường, trả tiền bảo hiểm khi xảy ra sự kiện bảo hiểm theo thoả thuận.", "points": 0.25, "options": ["A. bồi thường, trả tiền bảo hiểm khi xảy ra sự kiện bảo hiểm theo hợp đồng.", "B. không bao giờ bồi thường.", "C. tăng phí tuỳ ý không cần báo trước.", "D. từ chối mọi yêu cầu."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Bảo hiểm học sinh, sinh viên chủ yếu thuộc loại hình", "explain": "Học sinh tham gia bảo hiểm y tế (thuộc bảo hiểm sức khoẻ) để được chăm sóc sức khoẻ, khám chữa bệnh.", "points": 0.25, "options": ["A. bảo hiểm sức khoẻ (bảo hiểm y tế học sinh).", "B. bảo hiểm nhân thọ.", "C. bảo hiểm hàng hoá.", "D. bảo hiểm cháy nổ."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Mức hỗ trợ đóng BHYT cho học sinh, sinh viên hiện nay là Nhà nước hỗ trợ", "explain": "Học sinh, sinh viên thuộc nhóm được Nhà nước hỗ trợ tối thiểu 30% mức đóng BHYT.", "points": 0.25, "options": ["A. 0%.", "B. tối thiểu 30% mức đóng.", "C. 100%.", "D. 50%."], "answer": "B"}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về quyền, nghĩa vụ các bên:", "explain": "a), b), c) Đúng. d) Sai: chỉ được từ chối khi có căn cứ pháp luật, hợp đồng (ví dụ vi phạm trung thực tuyệt đối).", "points": 1, "statements": ["a) Bên mua bảo hiểm phải đóng phí đầy đủ, đúng hạn.", "b) Bên mua bảo hiểm phải thông báo trung thực các thông tin liên quan.", "c) Doanh nghiệp bảo hiểm phải bồi thường khi xảy ra sự kiện bảo hiểm theo hợp đồng.", "d) Doanh nghiệp bảo hiểm được từ chối bồi thường trong mọi trường hợp."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về bảo hiểm y tế học sinh:", "explain": "a), b), c) Đúng. d) Sai: BHYT là bắt buộc, rất cần thiết với học sinh.", "points": 1, "statements": ["a) Học sinh là đối tượng tham gia BHYT.", "b) Nhà nước hỗ trợ tối thiểu 30% mức đóng BHYT cho học sinh, sinh viên.", "c) Tham gia BHYT giúp học sinh được khám chữa bệnh với chi phí hợp lí.", "d) Học sinh không cần tham gia BHYT."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "NB", "q": "Luật Kinh doanh bảo hiểm hiện hành được ban hành năm nào? (điền số năm)", "explain": "Luật Kinh doanh bảo hiểm 2022.", "points": 0.5, "answer": "2022"}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Người tham gia bảo hiểm phải đóng ... bảo hiểm.", "explain": "Người tham gia bảo hiểm phải đóng phí bảo hiểm cho doanh nghiệp bảo hiểm.", "points": 0.5, "answer": "phí"}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "TH", "q": "Trục lợi bảo hiểm là hành vi", "explain": "Trục lợi bảo hiểm là hành vi gian dối nhằm được bồi thường, bị pháp luật nghiêm cấm và xử lí.", "points": 0.25, "options": ["A. gian dối để được bồi thường, trục lợi từ bảo hiểm.", "B. đóng phí đầy đủ.", "C. mua bảo hiểm tự nguyện.", "D. bồi thường đúng thiệt hại."], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Hành vi cố ý gây tai nạn để được bồi thường bảo hiểm sẽ", "explain": "Cố ý gây ra sự kiện bảo hiểm để trục lợi là vi phạm pháp luật, bị từ chối bồi thường và có thể bị truy cứu TNHS.", "points": 0.25, "options": ["A. được bồi thường gấp đôi.", "B. bị từ chối bồi thường và có thể bị truy cứu trách nhiệm hình sự.", "C. được khen thưởng.", "D. không bị xử lí gì."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Để phòng ngừa rủi ro, người tham gia bảo hiểm nên", "explain": "Bảo hiểm không thay thế ý thức phòng ngừa; người tham gia cần chủ động phòng ngừa rủi ro.", "points": 0.25, "options": ["A. chủ động phòng ngừa rủi ro, tuân thủ quy định an toàn.", "B. cố ý gây rủi ro.", "C. không cần quan tâm.", "D. gian dối khi mua bảo hiểm."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Bảo hiểm tiền gửi bảo vệ", "explain": "Bảo hiểm tiền gửi bảo vệ quyền lợi người gửi tiền khi tổ chức tín dụng mất khả năng chi trả.", "points": 0.25, "options": ["A. người gửi tiền tại tổ chức tín dụng khi tổ chức này mất khả năng chi trả.", "B. người vay tiền.", "C. cổ đông ngân hàng.", "D. Nhà nước."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Hạn mức trả tiền bảo hiểm tiền gửi hiện nay là", "explain": "Hạn mức trả tiền bảo hiểm tiền gửi hiện nay là 125 triệu đồng cho một người tại một tổ chức tín dụng.", "points": 0.25, "options": ["A. 50 triệu đồng.", "B. 75 triệu đồng.", "C. 125 triệu đồng.", "D. không giới hạn."], "answer": "C"}, {"type": "mcq", "level": "VDC", "q": "Ý nghĩa của bảo hiểm tiền gửi là", "explain": "Bảo hiểm tiền gửi bảo vệ người gửi tiền, tạo niềm tin, góp phần ổn định hệ thống tổ chức tín dụng.", "points": 0.25, "options": ["A. bảo vệ người gửi tiền, góp phần ổn định hệ thống ngân hàng.", "B. bảo vệ ngân hàng khỏi phá sản.", "C. tăng lãi suất.", "D. không có ý nghĩa gì."], "answer": "A"}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về trục lợi bảo hiểm:", "explain": "a), b), c) Đúng. d) Sai: trục lợi bảo hiểm bị nghiêm cấm.", "points": 1, "statements": ["a) Trục lợi bảo hiểm là hành vi gian dối để được bồi thường.", "b) Cố ý gây tai nạn để hưởng bảo hiểm là vi phạm pháp luật.", "c) Trục lợi bảo hiểm có thể bị truy cứu trách nhiệm hình sự.", "d) Trục lợi bảo hiểm là hành vi đáng khuyến khích."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về bảo hiểm tiền gửi:", "explain": "a), b), c) Đúng. d) Sai: người gửi tiền nên hiểu để bảo vệ quyền lợi của mình.", "points": 1, "statements": ["a) Bảo hiểm tiền gửi bảo vệ người gửi tiền tại tổ chức tín dụng.", "b) Hạn mức chi trả hiện nay là 125 triệu đồng.", "c) Bảo hiểm tiền gửi góp phần ổn định hệ thống ngân hàng.", "d) Người gửi tiền không cần quan tâm đến bảo hiểm tiền gửi."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "NB", "q": "Hạn mức trả tiền bảo hiểm tiền gửi hiện nay là bao nhiêu triệu đồng? (điền số)", "explain": "Hạn mức trả tiền bảo hiểm tiền gửi hiện nay là 125 triệu đồng.", "points": 0.5, "answer": "125"}, {"type": "short", "level": "NB", "q": "Hành vi gian dối để được bồi thường bảo hiểm được gọi là trục lợi ... (điền 1 từ).", "explain": "Trục lợi bảo hiểm là hành vi bị pháp luật nghiêm cấm.", "points": 0.5, "answer": "bảo hiểm"}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "TH", "q": "Bảo hiểm du lịch thuộc loại hình", "explain": "Bảo hiểm du lịch là bảo hiểm tự nguyện, bảo vệ du khách trước tai nạn, ốm đau, mất hành lí...", "points": 0.25, "options": ["A. bảo hiểm tự nguyện, thường là bảo hiểm sức khoẻ/tai nạn con người.", "B. bảo hiểm bắt buộc.", "C. bảo hiểm nhân thọ.", "D. không phải bảo hiểm."], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Khi đi du lịch nước ngoài, việc mua bảo hiểm du lịch giúp", "explain": "Bảo hiểm du lịch hỗ trợ chi phí y tế, cứu hộ, mất hành lí... khi gặp sự cố ở nước ngoài.", "points": 0.25, "options": ["A. được hỗ trợ chi phí y tế, cứu hộ khi gặp sự cố.", "B. được miễn visa.", "C. được tăng lương.", "D. không có tác dụng gì."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Bảo hiểm cháy, nổ bắt buộc áp dụng với", "explain": "Bảo hiểm cháy, nổ bắt buộc áp dụng với cơ sở có nguy hiểm về cháy, nổ theo danh mục quy định.", "points": 0.25, "options": ["A. mọi hộ gia đình.", "B. các cơ sở có nguy hiểm về cháy, nổ theo quy định.", "C. không ai.", "D. chỉ nhà máy điện hạt nhân."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Mục đích của bảo hiểm cháy, nổ bắt buộc là", "explain": "Bảo hiểm cháy nổ bắt buộc nhằm có nguồn tài chính khắc phục hậu quả, bảo vệ lợi ích cộng đồng.", "points": 0.25, "options": ["A. tăng thu ngân sách.", "B. bảo đảm nguồn tài chính khắc phục hậu quả cháy, nổ, bảo vệ lợi ích cộng đồng.", "C. phạt doanh nghiệp.", "D. không có mục đích gì."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Người tham gia bảo hiểm nhân thọ cần lưu ý", "explain": "Cần đọc kĩ hợp đồng: phạm vi bảo hiểm, điều khoản loại trừ, phí, thời hạn để bảo vệ quyền lợi.", "points": 0.25, "options": ["A. đọc kĩ hợp đồng: quyền lợi, điều khoản loại trừ, phí, thời hạn.", "B. không cần đọc hợp đồng.", "C. kí ngay không cần tìm hiểu.", "D. chỉ quan tâm đến quà tặng."], "answer": "A"}, {"type": "mcq", "level": "VDC", "q": "Điều khoản loại trừ trong hợp đồng bảo hiểm là", "explain": "Điều khoản loại trừ liệt kê các trường hợp không được bồi thường (tự tử trong 2 năm đầu, vi phạm pháp luật...).", "points": 0.25, "options": ["A. các trường hợp doanh nghiệp bảo hiểm không bồi thường.", "B. các trường hợp được bồi thường gấp đôi.", "C. quà tặng kèm.", "D. không có ý nghĩa gì."], "answer": "A"}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về bảo hiểm cháy, nổ:", "explain": "a), b) Đúng. c) Sai: chỉ cơ sở thuộc danh mục nguy hiểm cháy nổ. d) Đúng: vi phạm bị xử phạt vi phạm hành chính.", "points": 1, "statements": ["a) Bảo hiểm cháy, nổ bắt buộc áp dụng với cơ sở có nguy hiểm về cháy, nổ.", "b) Mục đích là bảo đảm nguồn tài chính khắc phục hậu quả.", "c) Mọi hộ gia đình đều phải mua bảo hiểm cháy, nổ bắt buộc.", "d) Không mua bảo hiểm cháy, nổ bắt buộc có thể bị xử phạt."], "answer": ["T", "T", "F", "T"]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau khi tham gia bảo hiểm nhân thọ:", "explain": "a), b), c) Đúng: bảo vệ quyền lợi người tham gia. d) Sai: thiếu hiểu biết dễ mất quyền lợi.", "points": 1, "statements": ["a) Cần đọc kĩ hợp đồng trước khi kí.", "b) Cần tìm hiểu điều khoản loại trừ.", "c) Cần khai báo trung thực tình trạng sức khoẻ.", "d) Cứ kí đại, có gì công ty lo hết."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "NB", "q": "Cơ sở có nguy hiểm về cháy, nổ phải tham gia bảo hiểm cháy, nổ bắt buộc hay tự nguyện?", "explain": "Bảo hiểm cháy, nổ bắt buộc áp dụng với cơ sở có nguy hiểm về cháy, nổ theo quy định.", "points": 0.5, "answer": "bắt buộc"}, {"type": "short", "level": "TH", "q": "Điền từ còn thiếu: Trước khi kí hợp đồng bảo hiểm cần đọc ... để hiểu quyền lợi và điều khoản loại trừ.", "explain": "Cần đọc kĩ hợp đồng bảo hiểm trước khi kí kết.", "points": 0.5, "answer": "kĩ"}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "TH", "q": "Bảo hiểm xã hội khác bảo hiểm thương mại ở chỗ bảo hiểm xã hội", "explain": "Bảo hiểm xã hội do Nhà nước tổ chức, nhằm bảo đảm an sinh xã hội, không vì mục đích lợi nhuận.", "points": 0.25, "options": ["A. nhằm mục đích lợi nhuận.", "B. nhằm bảo đảm an sinh xã hội, không vì mục đích lợi nhuận.", "C. do doanh nghiệp tư nhân tổ chức.", "D. người dân không phải tham gia."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Bảo hiểm y tế khác bảo hiểm sức khoẻ thương mại ở chỗ BHYT", "explain": "BHYT do Nhà nước tổ chức, mang tính an sinh xã hội, Nhà nước hỗ trợ mức đóng cho nhiều nhóm đối tượng.", "points": 0.25, "options": ["A. do Nhà nước tổ chức, mang tính an sinh, có hỗ trợ mức đóng.", "B. vì lợi nhuận.", "C. không ai tham gia.", "D. chi phí cao hơn."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Tình huống: Gia đình ông T thuộc hộ nghèo được cấp thẻ BHYT miễn phí. Đây thể hiện", "explain": "Cấp thẻ BHYT miễn phí cho hộ nghèo thể hiện chính sách an sinh, chăm lo người yếu thế của Nhà nước.", "points": 0.25, "options": ["A. tính thương mại của bảo hiểm.", "B. chính sách an sinh xã hội của Nhà nước: hỗ trợ người yếu thế.", "C. sự phân biệt đối xử.", "D. không có ý nghĩa gì."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Khi tham gia BHYT, người bệnh được hưởng", "explain": "Người tham gia BHYT được quỹ BHYT chi trả một phần hoặc toàn bộ chi phí KCB theo mức hưởng (80%, 95%, 100%).", "points": 0.25, "options": ["A. 100% chi phí trong mọi trường hợp.", "B. một phần hoặc toàn bộ chi phí khám chữa bệnh theo mức hưởng quy định.", "C. không được hưởng gì.", "D. chỉ được hưởng tiền mặt."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Để được hưởng BHYT khi khám chữa bệnh, người dân cần", "explain": "Cần xuất trình thẻ BHYT hoặc CCCD gắn chip/VNeID để được hưởng quyền lợi BHYT.", "points": 0.25, "options": ["A. xuất trình thẻ BHYT (hoặc VNeID/CCCD gắn chip) tại cơ sở KCB.", "B. không cần giấy tờ gì.", "C. chỉ cần nói miệng.", "D. phải là cán bộ."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Hành vi cho người khác mượn thẻ BHYT để khám chữa bệnh là", "explain": "Cho mượn thẻ BHYT là vi phạm pháp luật, bị xử phạt vi phạm hành chính và có thể bị thu hồi thẻ.", "points": 0.25, "options": ["A. bình thường.", "B. vi phạm pháp luật, có thể bị xử phạt và thu hồi thẻ.", "C. được khuyến khích.", "D. không ai xử lí."], "answer": "B"}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về BHYT:", "explain": "Cả 4 khẳng định đều đúng.", "points": 1, "statements": ["a) BHYT do Nhà nước tổ chức, mang tính an sinh xã hội.", "b) Hộ nghèo được cấp thẻ BHYT miễn phí.", "c) Người tham gia BHYT được quỹ BHYT chi trả chi phí KCB theo mức hưởng.", "d) Cho người khác mượn thẻ BHYT là vi phạm pháp luật."], "answer": ["T", "T", "T", "T"]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về phân biệt các loại bảo hiểm:", "explain": "a), b), c) Đúng. d) Sai: bảo hiểm thương mại do doanh nghiệp bảo hiểm kinh doanh.", "points": 1, "statements": ["a) Bảo hiểm xã hội nhằm bảo đảm an sinh, không vì lợi nhuận.", "b) Bảo hiểm thương mại do doanh nghiệp kinh doanh vì lợi nhuận.", "c) BHYT có sự hỗ trợ mức đóng của Nhà nước cho nhiều nhóm đối tượng.", "d) Mọi loại bảo hiểm đều do Nhà nước tổ chức."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "TH", "q": "Hộ nghèo được cấp thẻ BHYT với mức hỗ trợ bao nhiêu phần trăm? (điền số)", "explain": "Hộ nghèo được Nhà nước hỗ trợ 100% mức đóng BHYT (cấp thẻ miễn phí).", "points": 0.5, "answer": "100"}, {"type": "short", "level": "TH", "q": "Điền từ còn thiếu: Cho người khác ... thẻ BHYT là vi phạm pháp luật.", "explain": "Cho người khác mượn thẻ BHYT để khám chữa bệnh là vi phạm pháp luật.", "points": 0.5, "answer": "mượn"}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "VD", "q": "Tái bảo hiểm là", "explain": "Tái bảo hiểm: doanh nghiệp bảo hiểm san sẻ rủi ro cho doanh nghiệp bảo hiểm khác, bảo đảm khả năng chi trả.", "points": 0.25, "options": ["A. doanh nghiệp bảo hiểm chuyển giao một phần rủi ro cho doanh nghiệp bảo hiểm khác.", "B. mua bảo hiểm 2 lần.", "C. huỷ hợp đồng bảo hiểm.", "D. tăng phí bảo hiểm."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Ý nghĩa của tái bảo hiểm là", "explain": "Tái bảo hiểm giúp phân tán rủi ro, bảo đảm doanh nghiệp bảo hiểm đủ khả năng chi trả khi tổn thất lớn.", "points": 0.25, "options": ["A. tăng lợi nhuận.", "B. phân tán rủi ro, bảo đảm khả năng bồi thường khi xảy ra tổn thất lớn.", "C. giảm phí cho khách hàng.", "D. không có ý nghĩa gì."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Khi xảy ra thiên tai lớn, vai trò của bảo hiểm thể hiện ở", "explain": "Bảo hiểm phát huy vai trò san sẻ rủi ro, giúp khắc phục hậu quả thiên tai, ổn định đời sống.", "points": 0.25, "options": ["A. không làm gì.", "B. chi trả bồi thường giúp người dân, doanh nghiệp sớm khắc phục hậu quả, ổn định cuộc sống.", "C. tăng phí.", "D. từ chối mọi yêu cầu."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Bảo hiểm nông nghiệp giúp nông dân", "explain": "Bảo hiểm nông nghiệp bảo vệ nông dân trước rủi ro thiên tai, dịch bệnh, giúp yên tâm sản xuất.", "points": 0.25, "options": ["A. yên tâm sản xuất vì được bảo vệ trước rủi ro thiên tai, dịch bệnh.", "B. không cần sản xuất.", "C. tăng rủi ro.", "D. mất mùa nhiều hơn."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Nhà nước hỗ trợ phí bảo hiểm nông nghiệp cho thấy", "explain": "Hỗ trợ phí bảo hiểm nông nghiệp thể hiện chính sách an sinh, chăm lo nông dân của Nhà nước.", "points": 0.25, "options": ["A. sự quan tâm của Nhà nước đối với nông dân, góp phần an sinh xã hội.", "B. lãng phí ngân sách.", "C. không cần thiết.", "D. chỉ có lợi cho công ty bảo hiểm."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Tình huống: Vùng trồng lúa X tham gia bảo hiểm nông nghiệp, khi lũ lụt mất trắng, nông dân được bồi thường để tái sản xuất. Điều này thể hiện vai trò", "explain": "Bồi thường bảo hiểm nông nghiệp giúp nông dân có vốn tái sản xuất sau thiên tai.", "points": 0.25, "options": ["A. kinh doanh của công ty bảo hiểm.", "B. san sẻ rủi ro, giúp nông dân vượt qua khó khăn, ổn định sản xuất.", "C. gây thiệt hại cho nông dân.", "D. không có ý nghĩa gì."], "answer": "B"}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về tái bảo hiểm và bảo hiểm nông nghiệp:", "explain": "a), b), c) Đúng. d) Sai: bảo hiểm không thay thế ý thức chủ động phòng ngừa rủi ro.", "points": 1, "statements": ["a) Tái bảo hiểm giúp doanh nghiệp bảo hiểm phân tán rủi ro.", "b) Bảo hiểm nông nghiệp bảo vệ nông dân trước thiên tai, dịch bệnh.", "c) Nhà nước có chính sách hỗ trợ phí bảo hiểm nông nghiệp.", "d) Bảo hiểm nông nghiệp làm nông dân ỷ lại, không cần phòng ngừa rủi ro."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Sau bão lớn, công ty bảo hiểm chi trả hàng trăm tỉ đồng bồi thường cho người dân, doanh nghiệp. Xét tính đúng, sai:", "explain": "a), b), c) Đúng. d) Sai: bảo hiểm bổ trợ chứ không thay thế trách nhiệm cứu trợ của Nhà nước.", "points": 1, "statements": ["a) Đây là vai trò san sẻ rủi ro của bảo hiểm.", "b) Bảo hiểm giúp giảm gánh nặng cho ngân sách nhà nước.", "c) Người dân nên chủ động tham gia bảo hiểm để phòng ngừa rủi ro.", "d) Khi có bảo hiểm, Nhà nước không cần cứu trợ thiên tai nữa."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "TH", "q": "Doanh nghiệp bảo hiểm chuyển giao một phần rủi ro cho doanh nghiệp khác gọi là tái ... (điền 1 từ).", "explain": "Tái bảo hiểm là việc san sẻ rủi ro giữa các doanh nghiệp bảo hiểm.", "points": 0.5, "answer": "bảo hiểm"}, {"type": "short", "level": "TH", "q": "Điền từ còn thiếu: Bảo hiểm nông nghiệp giúp nông dân yên tâm ... trước rủi ro thiên tai.", "explain": "Bảo hiểm nông nghiệp giúp nông dân yên tâm sản xuất.", "points": 0.5, "answer": "sản xuất"}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "VD", "q": "Môi giới bảo hiểm là", "explain": "Môi giới/đại lí bảo hiểm là người tư vấn, giới thiệu sản phẩm bảo hiểm phù hợp với nhu cầu khách hàng.", "points": 0.25, "options": ["A. người tư vấn, giới thiệu sản phẩm bảo hiểm cho khách hàng.", "B. người bán bảo hiểm dạo.", "C. cán bộ thuế.", "D. luật sư."], "answer": "A"}, {"type": "mcq", "level": "VDC", "q": "Khi mua bảo hiểm qua đại lí, người tham gia cần", "explain": "Cần kiểm tra tính pháp lí của đại lí, tìm hiểu kĩ sản phẩm, giữ biên lai, không kí khống.", "points": 0.25, "options": ["A. kiểm tra đại lí có được cấp phép, tìm hiểu kĩ sản phẩm.", "B. tin tuyệt đối không cần tìm hiểu.", "C. đưa tiền không cần biên lai.", "D. kí khống hợp đồng."], "answer": "A"}, {"type": "mcq", "level": "VDC", "q": "Dấu hiệu của hành vi lừa đảo bán bảo hiểm là", "explain": "Hứa lãi cao bất thường, không hợp đồng, thu tiền không biên lai là dấu hiệu lừa đảo.", "points": 0.25, "options": ["A. tư vấn rõ ràng, có hợp đồng.", "B. hứa hẹn lãi suất cao bất thường, không có hợp đồng, thu tiền không biên lai.", "C. giải thích điều khoản loại trừ.", "D. có giấy phép hoạt động."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Để bảo vệ quyền lợi khi tham gia bảo hiểm, người dân nên", "explain": "Mua của doanh nghiệp được cấp phép, đọc kĩ hợp đồng, giữ biên lai là cách bảo vệ quyền lợi.", "points": 0.25, "options": ["A. mua của doanh nghiệp được cấp phép, đọc kĩ hợp đồng, giữ biên lai đóng phí.", "B. mua qua người lạ không rõ lai lịch.", "C. không cần giữ giấy tờ.", "D. tin lời hứa miệng."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Cơ quan quản lí nhà nước về kinh doanh bảo hiểm là", "explain": "Bộ Tài chính là cơ quan quản lí nhà nước về hoạt động kinh doanh bảo hiểm.", "points": 0.25, "options": ["A. Bộ Tài chính.", "B. Bộ Công an.", "C. Bộ Y tế.", "D. Ngân hàng Nhà nước."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Khi có tranh chấp bảo hiểm, người tham gia có thể", "explain": "Có thể khiếu nại, phản ánh đến cơ quan quản lí (Bộ Tài chính) hoặc khởi kiện ra toà án.", "points": 0.25, "options": ["A. khiếu nại đến doanh nghiệp bảo hiểm, cơ quan quản lí hoặc khởi kiện ra toà án.", "B. dùng vũ lực.", "C. bỏ qua.", "D. không có cách nào."], "answer": "A"}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về phòng tránh lừa đảo bảo hiểm:", "explain": "a), b), c) Đúng: các biện pháp phòng tránh lừa đảo. d) Sai: đó là dấu hiệu lừa đảo.", "points": 1, "statements": ["a) Nên mua bảo hiểm của doanh nghiệp được cấp phép hoạt động.", "b) Cần đọc kĩ hợp đồng trước khi kí.", "c) Phải giữ biên lai, chứng từ đóng phí.", "d) Nên tin lời hứa lãi suất cao bất thường qua điện thoại."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về giải quyết tranh chấp:", "explain": "a), b), c) Đúng: các kênh giải quyết tranh chấp. d) Sai.", "points": 1, "statements": ["a) Có thể khiếu nại trực tiếp đến doanh nghiệp bảo hiểm.", "b) Có thể phản ánh đến Bộ Tài chính.", "c) Có thể khởi kiện ra toà án.", "d) Không có cách nào bảo vệ quyền lợi khi bị xâm phạm."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "TH", "q": "Cơ quan nào quản lí nhà nước về kinh doanh bảo hiểm? (điền tên Bộ)", "explain": "Bộ Tài chính quản lí nhà nước về hoạt động kinh doanh bảo hiểm.", "points": 0.5, "answer": "Bộ Tài chính"}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Khi mua bảo hiểm cần giữ ... đóng phí để bảo vệ quyền lợi.", "explain": "Giữ biên lai, chứng từ đóng phí là bằng chứng bảo vệ quyền lợi người tham gia.", "points": 0.5, "answer": "biên lai"}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "VDC", "q": "Đánh giá chung về vai trò của bảo hiểm trong đời sống hiện đại là", "explain": "Bảo hiểm là công cụ quản trị rủi ro, bảo vệ tài chính quan trọng của cá nhân, doanh nghiệp và toàn xã hội.", "points": 0.25, "options": ["A. không cần thiết.", "B. là công cụ quản trị rủi ro, bảo vệ tài chính không thể thiếu của cá nhân, doanh nghiệp và xã hội.", "C. chỉ dành cho người giàu.", "D. gây tốn kém vô ích."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Một gia đình trẻ nên ưu tiên tham gia loại bảo hiểm nào?", "explain": "Gia đình trẻ nên ưu tiên BHYT, bảo hiểm nhân thọ cho người trụ cột và bảo hiểm tài sản lớn, phù hợp khả năng tài chính.", "points": 0.25, "options": ["A. BHYT, bảo hiểm nhân thọ (bảo vệ trụ cột gia đình), bảo hiểm tài sản có giá trị.", "B. không cần bảo hiểm nào.", "C. chỉ mua bảo hiểm du lịch.", "D. mua càng nhiều càng tốt không cần tính toán."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Nguyên tắc tài chính khi tham gia bảo hiểm là", "explain": "Phí bảo hiểm nên phù hợp với khả năng tài chính, ưu tiên bảo vệ các nhu cầu thiết yếu trước.", "points": 0.25, "options": ["A. dành toàn bộ thu nhập mua bảo hiểm.", "B. cân đối phí bảo hiểm phù hợp với thu nhập, ưu tiên nhu cầu thiết yếu.", "C. vay nợ để mua bảo hiểm.", "D. mua theo phong trào."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Bảo hiểm giúp doanh nghiệp", "explain": "Bảo hiểm tài sản, trách nhiệm giúp doanh nghiệp yên tâm sản xuất kinh doanh trước rủi ro.", "points": 0.25, "options": ["A. yên tâm sản xuất kinh doanh vì tài sản, trách nhiệm được bảo vệ trước rủi ro.", "B. không cần quản trị rủi ro.", "C. tăng rủi ro.", "D. trốn thuế."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Trong quản trị rủi ro doanh nghiệp, bảo hiểm là biện pháp", "explain": "Bảo hiểm là biện pháp chuyển giao rủi ro, cần kết hợp với phòng ngừa, giảm thiểu rủi ro.", "points": 0.25, "options": ["A. duy nhất.", "B. chuyển giao rủi ro cho doanh nghiệp bảo hiểm, kết hợp với phòng ngừa, giảm thiểu.", "C. không cần thiết.", "D. thay thế mọi biện pháp khác."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Thông điệp của bài học về bảo hiểm đối với học sinh là", "explain": "Học sinh cần hiểu về bảo hiểm để bảo vệ mình, gia đình và hình thành ý thức quản trị rủi ro.", "points": 0.25, "options": ["A. không cần quan tâm đến bảo hiểm.", "B. hiểu về bảo hiểm để bảo vệ bản thân, gia đình và có ý thức phòng ngừa rủi ro.", "C. bảo hiểm là lừa đảo.", "D. chỉ người lớn mới cần bảo hiểm."], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp toàn bài về bảo hiểm):", "explain": "a), b), c) Đúng. d) Sai: trục lợi bảo hiểm bị nghiêm cấm.", "points": 1, "statements": ["a) Bảo hiểm là công cụ chia sẻ rủi ro, bảo vệ tài chính.", "b) Các loại hình bảo hiểm gồm nhân thọ, sức khoẻ, phi nhân thọ.", "c) Nguyên tắc cơ bản gồm trung thực tuyệt đối, bồi thường, thế quyền.", "d) Trục lợi bảo hiểm là hành vi hợp pháp."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp toàn bài 2 về bảo hiểm):", "explain": "a), b), c) Đúng. d) Sai: vẫn cần chủ động phòng ngừa rủi ro.", "points": 1, "statements": ["a) BHYT, BHXH là các loại bảo hiểm mang tính an sinh xã hội.", "b) Bảo hiểm trách nhiệm dân sự xe cơ giới là bảo hiểm bắt buộc.", "c) Khi tham gia bảo hiểm cần đọc kĩ hợp đồng và giữ biên lai.", "d) Bảo hiểm thay thế hoàn toàn ý thức phòng ngừa rủi ro."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "VD", "q": "Hoàn thành câu: Bảo hiểm là sự cam kết ... khi xảy ra sự kiện bảo hiểm.", "explain": "Bảo hiểm là sự cam kết bồi thường, trả tiền bảo hiểm khi xảy ra sự kiện bảo hiểm.", "points": 0.5, "answer": "bồi thường"}, {"type": "short", "level": "VD", "q": "Theo Điều 8 Luật Kinh doanh bảo hiểm 2022, có bao nhiêu loại hình bảo hiểm chính? (điền số)", "explain": "3 loại hình: bảo hiểm nhân thọ, bảo hiểm sức khoẻ, bảo hiểm phi nhân thọ.", "points": 0.5, "answer": "3"}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "VDC", "q": "Tình huống: Ông S tham gia BHYT đầy đủ, khi phải phẫu thuật, quỹ BHYT chi trả phần lớn chi phí. Điều này thể hiện", "explain": "BHYT san sẻ gánh nặng chi phí khám chữa bệnh, thể hiện vai trò an sinh xã hội.", "points": 0.25, "options": ["A. tính thương mại của BHYT.", "B. vai trò an sinh xã hội của bảo hiểm: san sẻ gánh nặng chi phí y tế.", "C. sự lãng phí.", "D. không có ý nghĩa gì."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Tình huống: Công ty X mua bảo hiểm cháy nổ, khi xảy ra cháy được bồi thường để sớm khôi phục sản xuất. Điều này thể hiện", "explain": "Bảo hiểm cháy nổ giúp doanh nghiệp có nguồn tài chính khắc phục hậu quả, sớm ổn định sản xuất.", "points": 0.25, "options": ["A. bảo hiểm giúp doanh nghiệp vượt qua rủi ro, ổn định sản xuất.", "B. bảo hiểm gây cháy.", "C. công ty X trục lợi.", "D. không liên quan đến bảo hiểm."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Tình huống: Bạn A nhặt được ví tiền, dùng tiền mua bảo hiểm cho mình. Hành vi của bạn A", "explain": "Nhặt được của rơi phải trả lại hoặc giao nộp; dùng tiền của người khác mua bảo hiểm là sai.", "points": 0.25, "options": ["A. đúng vì mua bảo hiểm là tốt.", "B. sai vì sử dụng tài sản nhặt được của người khác.", "C. được khuyến khích.", "D. không ai quan tâm."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Trong các tình huống sau, tình huống nào thể hiện ý thức tham gia bảo hiểm đúng đắn?", "explain": "Tham gia BHYT đầy đủ và bảo hiểm nhân thọ phù hợp thu nhập là ý thức đúng đắn.", "points": 0.25, "options": ["A. Gia đình chị M tham gia BHYT cho cả nhà, mua bảo hiểm nhân thọ phù hợp thu nhập.", "B. Anh N không tham gia bảo hiểm nào vì cho rằng rủi ro không đến với mình.", "C. Chị P khai gian để được bồi thường.", "D. Ông Q mua bảo hiểm của người không có giấy phép."], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Để xây dựng văn hoá bảo hiểm trong xã hội, cần", "explain": "Tuyên truyền, giáo dục về bảo hiểm, nhất là trong nhà trường, giúp hình thành văn hoá phòng ngừa rủi ro.", "points": 0.25, "options": ["A. tăng cường tuyên truyền, giáo dục về bảo hiểm từ nhà trường.", "B. cấm tuyên truyền về bảo hiểm.", "C. để mặc người dân tự tìm hiểu.", "D. chỉ bán bảo hiểm cho người giàu."], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Bài học về bảo hiểm giúp học sinh lớp 12", "explain": "Hiểu về bảo hiểm giúp học sinh bảo vệ bản thân, gia đình, có ý thức phòng ngừa rủi ro và phòng tránh lừa đảo.", "points": 0.25, "options": ["A. không cần quan tâm.", "B. hiểu vai trò của bảo hiểm, biết bảo vệ mình và gia đình, phòng tránh lừa đảo.", "C. chỉ để thi.", "D. trở thành nhân viên bảo hiểm."], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Sau đợt lũ, nhiều hộ dân được bảo hiểm nông nghiệp bồi thường để tái sản xuất. Xét tính đúng, sai:", "explain": "a), b), c) Đúng. d) Sai: vẫn cần chủ động phòng chống thiên tai.", "points": 1, "statements": ["a) Bảo hiểm đã phát huy vai trò san sẻ rủi ro.", "b) Người dân nên chủ động tham gia bảo hiểm để phòng ngừa rủi ro thiên tai.", "c) Nhà nước có chính sách hỗ trợ phí bảo hiểm nông nghiệp.", "d) Có bảo hiểm thì không cần các biện pháp phòng chống thiên tai."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau (tổng kết về bảo hiểm):", "explain": "a), b), c) Đúng. d) Sai: học sinh cần hiểu để bảo vệ mình và gia đình.", "points": 1, "statements": ["a) Tham gia bảo hiểm là cách quản trị rủi ro thông minh.", "b) Cần tìm hiểu kĩ trước khi tham gia bất kì loại bảo hiểm nào.", "c) Bảo hiểm góp phần an sinh xã hội và phát triển kinh tế.", "d) Học sinh không cần hiểu biết về bảo hiểm."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "VD", "q": "Hoàn thành câu: Người tham gia bảo hiểm phải tuân thủ nguyên tắc ... tuyệt đối.", "explain": "Nguyên tắc trung thực tuyệt đối trong bảo hiểm.", "points": 0.5, "answer": "trung thực"}, {"type": "short", "level": "VDC", "q": "Bảo hiểm y tế thuộc loại hình bảo hiểm nào theo Điều 8 Luật Kinh doanh bảo hiểm 2022? (điền: nhân thọ/sức khoẻ/phi nhân thọ)", "explain": "Bảo hiểm y tế thuộc loại hình bảo hiểm sức khoẻ.", "points": 0.5, "answer": "sức khoẻ"}]}]}
