e", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về BHTN:", "explain": "a), b), c) Đúng. d) Sai: thời gian hưởng phụ thuộc vào thời gian đã đóng BHTN.", "points": 1, "statements": ["a) Mức hưởng bằng 60% bình quân lương đóng BHTN 6 tháng liền kề.", "b) Người hưởng được hỗ trợ học nghề, tư vấn việc làm.", "c) Cần đóng BHTN đủ thời gian và nộp hồ sơ đúng hạn.", "d) Thất nghiệp là được hưởng trợ cấp vô thời hạn."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "NB", "q": "Mức hưởng trợ cấp thất nghiệp bằng bao nhiêu phần trăm bình quân tiền lương? (điền số)", "explain": "Mức hưởng bằng 60% bình quân tiền lương tháng đóng BHTN của 6 tháng liền kề.", "points": 0.5, "answer": "60"}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Ưu đãi người có công thể hiện đạo lí uống nước ... nguồn.", "explain": "Đạo lí \"uống nước nhớ nguồn\" của dân tộc Việt Nam.", "points": 0.5, "answer": "nhớ"}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "TH", "q": "Vai trò quan trọng nhất của an sinh xã hội đối với xã hội là", "explain": "An sinh xã hội ổn định đời sống người dân, giữ ổn định xã hội, tạo nền tảng cho phát triển bền vững.", "points": 0.25, "options": ["A. tăng thu ngân sách.", "B. ổn định xã hội, không ai bị bỏ lại phía sau, tạo nền tảng phát triển bền vững.", "C. giảm đầu tư.", "D. tăng cạnh tranh."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa an sinh xã hội và phát triển kinh tế là", "explain": "An sinh và phát triển kinh tế tác động qua lại: ổn định xã hội thúc đẩy phát triển; kinh tế phát triển tạo nguồn lực cho an sinh.", "points": 0.25, "options": ["A. đối lập nhau.", "B. an sinh xã hội tốt tạo ổn định để phát triển kinh tế; kinh tế phát triển tạo nguồn lực cho an sinh.", "C. không liên quan.", "D. an sinh cản trở phát triển."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Trong đại dịch Covid-19, chính sách hỗ trợ người lao động gặp khó khăn thể hiện", "explain": "Các gói hỗ trợ trong đại dịch thể hiện vai trò kịp thời của an sinh xã hội trước rủi ro.", "points": 0.25, "options": ["A. sự lãng phí.", "B. vai trò của an sinh xã hội: kịp thời bảo vệ người dân trước rủi ro lớn.", "C. không cần thiết.", "D. chỉ có lợi cho doanh nghiệp."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Quỹ \"Vì người nghèo\" và các hoạt động từ thiện thể hiện", "explain": "Quỹ vì người nghèo, hoạt động từ thiện thể hiện tinh thần tương thân tương ái, trách nhiệm cộng đồng.", "points": 0.25, "options": ["A. trách nhiệm của toàn xã hội trong bảo đảm an sinh: tương thân tương ái.", "B. sự can thiệp của Nhà nước.", "C. hoạt động kinh doanh.", "D. không có ý nghĩa gì."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Để hệ thống an sinh xã hội bền vững, cần", "explain": "An sinh bền vững cần kinh tế phát triển tạo nguồn lực, mở rộng bao phủ và quản lí chặt chẽ, chống gian lận.", "points": 0.25, "options": ["A. chỉ trông chờ ngân sách.", "B. phát triển kinh tế tạo nguồn lực, mở rộng diện bao phủ, chống gian lận, trục lợi.", "C. cắt giảm mọi chính sách.", "D. chỉ lo cho người giàu."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Thách thức lớn của an sinh xã hội Việt Nam hiện nay là", "explain": "Già hoá dân số, độ bao phủ BHXH còn thấp và gian lận chính sách là các thách thức lớn.", "points": 0.25, "options": ["A. thừa nguồn lực.", "B. già hoá dân số nhanh, tỉ lệ tham gia BHXH còn thấp, gian lận chính sách.", "C. không có thách thức.", "D. dân số quá trẻ."], "answer": "B"}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về vai trò và thách thức:", "explain": "a), b), c) Đúng. d) Sai: an sinh tốt thúc đẩy phát triển bền vững.", "points": 1, "statements": ["a) An sinh xã hội góp phần ổn định xã hội và phát triển bền vững.", "b) Kinh tế phát triển tạo nguồn lực cho an sinh xã hội.", "c) Già hoá dân số là thách thức của an sinh xã hội.", "d) An sinh xã hội cản trở phát triển kinh tế."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về trách nhiệm công dân:", "explain": "a), b), c) Đúng. d) Sai: là trách nhiệm chung của Nhà nước và toàn xã hội.", "points": 1, "statements": ["a) Công dân cần tham gia đầy đủ các loại bảo hiểm bắt buộc.", "b) Công dân cần chấp hành pháp luật, không gian lận chính sách.", "c) Mỗi người nên tương thân tương ái, giúp đỡ người khó khăn.", "d) An sinh xã hội là việc riêng của Nhà nước."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "NB", "q": "Điền cụm từ còn thiếu: Không ai bị bỏ lại ... là mục tiêu của an sinh xã hội.", "explain": "An sinh xã hội hướng tới mục tiêu không ai bị bỏ lại phía sau.", "points": 0.5, "answer": "phía sau"}, {"type": "short", "level": "NB", "q": "Thách thức dân số lớn của Việt Nam đối với an sinh xã hội là già hoá ... (điền 1 từ).", "explain": "Già hoá dân số nhanh là thách thức lớn đối với hệ thống an sinh xã hội.", "points": 0.5, "answer": "dân số"}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "TH", "q": "Chế độ thai sản của BHXH giúp lao động nữ", "explain": "Chế độ thai sản cho phép lao động nữ nghỉ sinh hưởng trợ cấp, bảo vệ sức khoẻ mẹ và bé.", "points": 0.25, "options": ["A. không cần nghỉ sinh.", "B. được nghỉ việc hưởng chế độ khi sinh con, bảo đảm sức khoẻ mẹ và bé.", "C. bị sa thải.", "D. giảm lương."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Thời gian nghỉ thai sản theo quy định hiện nay là", "explain": "Lao động nữ được nghỉ thai sản 6 tháng (trường hợp sinh đôi trở lên được nghỉ thêm).", "points": 0.25, "options": ["A. 4 tháng.", "B. 6 tháng.", "C. 12 tháng.", "D. 1 tháng."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Chế độ tai nạn lao động, bệnh nghề nghiệp nhằm", "explain": "Chế độ TNLĐ-BNN bảo vệ NLĐ khi gặp tai nạn, mắc bệnh nghề nghiệp trong quá trình lao động.", "points": 0.25, "options": ["A. phạt doanh nghiệp.", "B. bảo vệ người lao động khi gặp tai nạn, bệnh nghề nghiệp trong quá trình làm việc.", "C. tăng giờ làm.", "D. giảm lương."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Người sử dụng lao động có trách nhiệm", "explain": "NSDLĐ phải bảo đảm an toàn lao động và đóng đầy đủ BHXH, BHYT, BHTN cho NLĐ.", "points": 0.25, "options": ["A. bảo đảm an toàn lao động, đóng BHXH đầy đủ cho người lao động.", "B. không cần quan tâm an toàn.", "C. trốn đóng BHXH.", "D. sa thải lao động bị tai nạn."], "answer": "A"}, {"type": "mcq", "level": "VDC", "q": "Chế độ tử tuất của BHXH gồm", "explain": "Chế độ tử tuất gồm trợ cấp mai táng phí và trợ cấp tuất hằng tháng/một lần cho thân nhân.", "points": 0.25, "options": ["A. trợ cấp mai táng và trợ cấp tuất cho thân nhân.", "B. không có gì.", "C. chỉ trợ cấp mai táng.", "D. thưởng cho thân nhân."], "answer": "A"}, {"type": "mcq", "level": "VDC", "q": "Chế độ hưu trí giúp người cao tuổi", "explain": "Lương hưu hằng tháng giúp người cao tuổi ổn định cuộc sống khi hết tuổi lao động.", "points": 0.25, "options": ["A. không có thu nhập.", "B. có lương hưu hằng tháng, ổn định cuộc sống khi hết tuổi lao động.", "C. phải đi làm thêm.", "D. phụ thuộc hoàn toàn vào con cháu."], "answer": "B"}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về các chế độ BHXH:", "explain": "Cả 4 khẳng định đều đúng về các chế độ BHXH.", "points": 1, "statements": ["a) Lao động nữ được nghỉ thai sản 6 tháng.", "b) Chế độ TNLĐ-BNN bảo vệ NLĐ khi gặp tai nạn trong lao động.", "c) Chế độ tử tuất gồm trợ cấp mai táng và trợ cấp tuất.", "d) Lương hưu giúp người cao tuổi ổn định cuộc sống."], "answer": ["T", "T", "T", "T"]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về trách nhiệm các bên trong an sinh xã hội:", "explain": "a), b), c) Đúng. d) Sai: NSDLĐ có trách nhiệm bảo đảm an toàn và thực hiện chế độ cho NLĐ.", "points": 1, "statements": ["a) NSDLĐ phải bảo đảm an toàn lao động.", "b) NSDLĐ phải đóng đầy đủ BHXH cho NLĐ.", "c) NLĐ cần chấp hành quy định an toàn lao động.", "d) Tai nạn lao động là việc riêng của NLĐ, doanh nghiệp không liên quan."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "NB", "q": "Lao động nữ được nghỉ thai sản bao nhiêu tháng? (điền số)", "explain": "Lao động nữ được nghỉ thai sản 6 tháng.", "points": 0.5, "answer": "6"}, {"type": "short", "level": "TH", "q": "Người sử dụng lao động đóng các loại bảo hiểm cho người lao động với tổng mức bao nhiêu phần trăm? (điền số)", "explain": "NSDLĐ đóng tổng cộng 21,5% tiền lương tháng.", "points": 0.5, "answer": "21,5"}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "TH", "q": "Bảo hiểm y tế toàn dân có ý nghĩa", "explain": "BHYT toàn dân hướng tới mọi người dân được chăm sóc sức khoẻ, giảm gánh nặng chi phí y tế.", "points": 0.25, "options": ["A. mọi người dân đều được chăm sóc sức khoẻ với chi phí hợp lí.", "B. chỉ người giàu được khám bệnh.", "C. tăng chi phí y tế.", "D. không có ý nghĩa gì."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Tỉ lệ bao phủ BHYT của Việt Nam hiện nay đạt khoảng", "explain": "Tỉ lệ bao phủ BHYT của Việt Nam đã đạt trên 90% dân số, tiến tới BHYT toàn dân.", "points": 0.25, "options": ["A. 50%.", "B. 70%.", "C. trên 90%.", "D. 30%."], "answer": "C"}, {"type": "mcq", "level": "VD", "q": "Khám chữa bệnh BHYT đúng tuyến giúp người bệnh", "explain": "KCB đúng tuyến được hưởng mức chi trả BHYT cao nhất theo đối tượng.", "points": 0.25, "options": ["A. được hưởng mức chi trả cao nhất theo quy định.", "B. bị từ chối.", "C. phải trả 100% chi phí.", "D. không được khám."], "answer": "A"}, {"type": "mcq", "level": "VDC", "q": "Thông tuyến BHYT tỉnh giúp người bệnh", "explain": "Thông tuyến tỉnh cho phép KCB tại cơ sở tuyến tỉnh trên cả nước vẫn hưởng BHYT.", "points": 0.25, "options": ["A. không được khám trái tuyến.", "B. được KCB tại bệnh viện tuyến tỉnh trong cả nước mà vẫn hưởng quyền lợi BHYT.", "C. mất quyền lợi.", "D. phải về đúng tỉnh."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Hành vi làm giả hồ sơ để hưởng BHYT sẽ", "explain": "Gian lận BHYT bị xử phạt, buộc hoàn trả số tiền đã hưởng sai, có thể bị truy cứu TNHS.", "points": 0.25, "options": ["A. được bỏ qua.", "B. bị xử phạt vi phạm hành chính, buộc hoàn trả, có thể bị truy cứu trách nhiệm hình sự.", "C. được khen.", "D. không bị phát hiện."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Để BHYT phát huy hiệu quả, người dân cần", "explain": "Tham gia đầy đủ, KCB đúng tuyến, trung thực giúp BHYT phát huy hiệu quả, bền vững.", "points": 0.25, "options": ["A. tham gia đầy đủ, KCB đúng tuyến, không gian lận.", "B. cho mượn thẻ BHYT.", "C. làm giả hồ sơ.", "D. không tham gia."], "answer": "A"}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về BHYT toàn dân:", "explain": "Cả 4 khẳng định đều đúng.", "points": 1, "statements": ["a) BHYT hướng tới bao phủ toàn dân.", "b) Tỉ lệ bao phủ BHYT của Việt Nam đã trên 90%.", "c) KCB đúng tuyến được hưởng mức chi trả cao nhất.", "d) Gian lận BHYT bị xử lí theo pháp luật."], "answer": ["T", "T", "T", "T"]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về sử dụng BHYT:", "explain": "a), b), c) Đúng. d) Sai: dùng thẻ của người khác là vi phạm.", "points": 1, "statements": ["a) Nên KCB đúng tuyến để hưởng quyền lợi cao nhất.", "b) Không cho người khác mượn thẻ BHYT.", "c) Không làm giả hồ sơ hưởng BHYT.", "d) Có thể dùng thẻ BHYT của người khác nếu được đồng ý."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "TH", "q": "Tỉ lệ bao phủ BHYT của Việt Nam hiện đạt khoảng bao nhiêu phần trăm? (điền: trên 90)", "explain": "Tỉ lệ bao phủ BHYT của Việt Nam đã đạt trên 90% dân số.", "points": 0.5, "answer": "trên 90"}, {"type": "short", "level": "TH", "q": "Điền từ còn thiếu: Khám chữa bệnh ... tuyến được hưởng mức chi trả BHYT cao nhất.", "explain": "KCB đúng tuyến được hưởng mức chi trả cao nhất theo quy định.", "points": 0.5, "answer": "đúng"}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "VD", "q": "Chính sách giảm nghèo bền vững của Việt Nam gắn với an sinh xã hội qua", "explain": "Giảm nghèo bền vững gắn với an sinh: hỗ trợ sinh kế, đào tạo nghề, BHYT, giáo dục, nhà ở.", "points": 0.25, "options": ["A. chỉ phát tiền.", "B. hỗ trợ sinh kế, đào tạo nghề, BHYT, giáo dục, nhà ở cho hộ nghèo.", "C. bỏ mặc hộ nghèo.", "D. tăng thuế hộ nghèo."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Chương trình mục tiêu quốc gia giảm nghèo bền vững nhằm", "explain": "Chương trình mục tiêu quốc gia giảm nghèo bền vững nhằm giảm nghèo đa chiều, bao trùm.", "points": 0.25, "options": ["A. tăng hộ nghèo.", "B. giảm tỉ lệ hộ nghèo, không để ai bị bỏ lại phía sau.", "C. chỉ hỗ trợ thành phố.", "D. không có mục tiêu gì."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Chuẩn nghèo đa chiều khác chuẩn nghèo thu nhập ở chỗ", "explain": "Chuẩn nghèo đa chiều đo cả thiếu hụt dịch vụ xã hội cơ bản, không chỉ thu nhập.", "points": 0.25, "options": ["A. chỉ tính thu nhập.", "B. đo lường cả thiếu hụt về y tế, giáo dục, nhà ở, nước sạch, thông tin...", "C. không đo gì.", "D. chỉ áp dụng ở thành phố."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Hỗ trợ nhà ở cho hộ nghèo thể hiện", "explain": "Hỗ trợ nhà ở cho hộ nghèo là chính sách an sinh quan trọng, bảo đảm an cư.", "points": 0.25, "options": ["A. sự lãng phí.", "B. chính sách an sinh: bảo đảm chỗ ở, ổn định cuộc sống.", "C. phân biệt đối xử.", "D. không cần thiết."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Đào tạo nghề cho lao động nông thôn góp phần", "explain": "Đào tạo nghề giúp lao động nông thôn chuyển đổi việc làm, tăng thu nhập, giảm nghèo bền vững.", "points": 0.25, "options": ["A. tăng thất nghiệp.", "B. chuyển đổi việc làm, tăng thu nhập, giảm nghèo bền vững.", "C. giảm năng suất.", "D. không có tác dụng."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Tín dụng chính sách (Ngân hàng Chính sách xã hội) giúp hộ nghèo", "explain": "Tín dụng chính sách cho hộ nghèo vay vốn ưu đãi để sản xuất kinh doanh, thoát nghèo.", "points": 0.25, "options": ["A. vay nặng lãi.", "B. vay vốn ưu đãi để sản xuất, kinh doanh, vươn lên thoát nghèo.", "C. không cần trả.", "D. tiêu xài."], "answer": "B"}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về giảm nghèo bền vững:", "explain": "a), b), c) Đúng. d) Sai: cần đồng bộ sinh kế, việc làm, an sinh.", "points": 1, "statements": ["a) Giảm nghèo bền vững gắn với hỗ trợ sinh kế, đào tạo nghề.", "b) Chuẩn nghèo đa chiều đo cả thiếu hụt dịch vụ xã hội cơ bản.", "c) Tín dụng chính sách giúp hộ nghèo vay vốn ưu đãi sản xuất.", "d) Giảm nghèo chỉ cần phát tiền là đủ."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về chính sách an sinh:", "explain": "a), b), c) Đúng. d) Sai: Nhà nước có hệ thống chính sách hỗ trợ người nghèo.", "points": 1, "statements": ["a) Hộ nghèo được hỗ trợ BHYT, giáo dục, nhà ở.", "b) Đào tạo nghề giúp giảm nghèo bền vững.", "c) Không ai bị bỏ lại phía sau là mục tiêu của an sinh xã hội.", "d) Người nghèo phải tự lo, Nhà nước không hỗ trợ."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "TH", "q": "Ngân hàng nào cho hộ nghèo vay vốn ưu đãi? (điền: Ngân hàng ... xã hội)", "explain": "Ngân hàng Chính sách xã hội cho hộ nghèo vay vốn ưu đãi.", "points": 0.5, "answer": "Chính sách"}, {"type": "short", "level": "TH", "q": "Điền từ còn thiếu: Chuẩn nghèo ... đo lường cả thiếu hụt dịch vụ xã hội cơ bản.", "explain": "Chuẩn nghèo đa chiều.", "points": 0.5, "answer": "đa chiều"}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "VD", "q": "Người có công với cách mạng được hưởng", "explain": "Người có công được hưởng trợ cấp ưu đãi, chăm sóc sức khoẻ, ưu đãi giáo dục...", "points": 0.25, "options": ["A. không có chế độ gì.", "B. trợ cấp ưu đãi hằng tháng, chăm sóc sức khoẻ, ưu đãi giáo dục cho con...", "C. chỉ được khen miệng.", "D. bị phân biệt."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Phong trào \"Đền ơn đáp nghĩa\" thể hiện", "explain": "Phong trào đền ơn đáp nghĩa thể hiện trách nhiệm và tình cảm tri ân người có công.", "points": 0.25, "options": ["A. trách nhiệm, tình cảm của toàn xã hội đối với người có công.", "B. hoạt động kinh doanh.", "C. sự ép buộc.", "D. không có ý nghĩa."], "answer": "A"}, {"type": "mcq", "level": "VDC", "q": "Chăm sóc Mẹ Việt Nam anh hùng là", "explain": "Phụng dưỡng Mẹ Việt Nam anh hùng là trách nhiệm của Nhà nước và toàn xã hội.", "points": 0.25, "options": ["A. việc riêng của gia đình.", "B. trách nhiệm của Nhà nước và toàn xã hội.", "C. không cần thiết.", "D. chỉ để quảng cáo."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Ưu đãi giáo dục cho con người có công gồm", "explain": "Con người có công được miễn, giảm học phí và ưu tiên trong tuyển sinh theo quy định.", "points": 0.25, "options": ["A. miễn, giảm học phí, ưu tiên tuyển sinh theo quy định.", "B. không được đi học.", "C. phải đóng gấp đôi.", "D. không có ưu đãi."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Học sinh có thể tham gia phong trào đền ơn đáp nghĩa bằng cách", "explain": "Thăm hỏi gia đình chính sách, chăm sóc nghĩa trang liệt sĩ là việc làm thiết thực của học sinh.", "points": 0.25, "options": ["A. thăm hỏi, tặng quà gia đình chính sách, chăm sóc nghĩa trang liệt sĩ.", "B. không quan tâm.", "C. phá hoại di tích.", "D. quên lịch sử."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Ý nghĩa của chính sách ưu đãi người có công là", "explain": "Ưu đãi người có công là sự tri ân, đồng thời giáo dục truyền thống uống nước nhớ nguồn.", "points": 0.25, "options": ["A. tốn kém ngân sách.", "B. tri ân, bù đắp một phần hy sinh, giáo dục truyền thống cho thế hệ trẻ.", "C. phân biệt đối xử.", "D. không có ý nghĩa."], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về ưu đãi người có công:", "explain": "Cả 4 khẳng định đều đúng.", "points": 1, "statements": ["a) Người có công được hưởng trợ cấp ưu đãi hằng tháng.", "b) Con người có công được ưu đãi về giáo dục.", "c) Đền ơn đáp nghĩa là trách nhiệm của toàn xã hội.", "d) Học sinh có thể tham gia chăm sóc nghĩa trang liệt sĩ."], "answer": ["T", "T", "T", "T"]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về chính sách người có công:", "explain": "a), b), c) Đúng. d) Sai.", "points": 1, "statements": ["a) Phụng dưỡng Mẹ Việt Nam anh hùng là trách nhiệm chung.", "b) Chính sách người có công góp phần ổn định xã hội.", "c) Thế hệ trẻ cần ghi nhớ, tri ân sự hy sinh của cha anh.", "d) Người có công không cần sự quan tâm của xã hội."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "TH", "q": "Phong trào tri ân người có công với cách mạng có tên là Đền ơn ... (điền 1 từ).", "explain": "Phong trào \"Đền ơn đáp nghĩa\".", "points": 0.5, "answer": "đáp nghĩa"}, {"type": "short", "level": "VD", "q": "Con của người có công với cách mạng được ưu đãi gì trong giáo dục? (điền: miễn, ... học phí)", "explain": "Miễn, giảm học phí và ưu tiên tuyển sinh.", "points": 0.5, "answer": "giảm"}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "VDC", "q": "Tổng kết vai trò của an sinh xã hội, nhận định đúng nhất là", "explain": "An sinh xã hội ổn định đời sống, giữ ổn định xã hội, tạo nền tảng cho phát triển bền vững.", "points": 0.25, "options": ["A. an sinh xã hội là gánh nặng.", "B. an sinh xã hội là nền tảng ổn định xã hội và động lực phát triển bền vững.", "C. an sinh không cần thiết.", "D. an sinh chỉ tốn tiền."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Mối quan hệ giữa bảo hiểm (bài 3) và an sinh xã hội (bài 4) là", "explain": "BHXH, BHYT, BHTN là các trụ cột quan trọng của hệ thống an sinh xã hội.", "points": 0.25, "options": ["A. không liên quan.", "B. bảo hiểm (BHXH, BHYT, BHTN) là trụ cột quan trọng của hệ thống an sinh xã hội.", "C. đối lập nhau.", "D. bảo hiểm thay thế an sinh."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Để mở rộng độ bao phủ BHXH, cần", "explain": "Mở rộng bao phủ cần BHXH tự nguyện linh hoạt, tuyên truyền và chính sách hỗ trợ phù hợp.", "points": 0.25, "options": ["A. ép buộc mọi người.", "B. phát triển BHXH tự nguyện linh hoạt, tuyên truyền, hỗ trợ người tham gia.", "C. tăng phí thật cao.", "D. bỏ BHXH tự nguyện."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Chuyển đổi số trong an sinh xã hội (VssID, dịch vụ công trực tuyến) giúp", "explain": "Chuyển đổi số giúp tham gia, hưởng chế độ thuận tiện, minh bạch, giảm gian lận.", "points": 0.25, "options": ["A. gây khó khăn.", "B. người dân dễ dàng tham gia, tra cứu, hưởng chế độ minh bạch, thuận tiện.", "C. tăng gian lận.", "D. không có tác dụng."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Ứng dụng VssID của BHXH Việt Nam giúp người dân", "explain": "VssID giúp tra cứu quá trình đóng – hưởng BHXH, BHYT, BHTN trực tuyến.", "points": 0.25, "options": ["A. chơi game.", "B. tra cứu quá trình đóng, hưởng BHXH, BHYT trực tuyến.", "C. vay tiền.", "D. mua sắm."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Tương lai của an sinh xã hội Việt Nam hướng tới", "explain": "Hướng tới an sinh toàn dân, bền vững, thích ứng với già hoá dân số và kinh tế số.", "points": 0.25, "options": ["A. thu hẹp dần.", "B. bao phủ toàn dân, bền vững, thích ứng với già hoá dân số và kinh tế số.", "C. bỏ hẳn.", "D. chỉ lo cho cán bộ."], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp về an sinh xã hội):", "explain": "a), b), c) Đúng. d) Sai: cần đổi mới, thích ứng với tình hình mới.", "points": 1, "statements": ["a) BHXH, BHYT, BHTN là trụ cột của an sinh xã hội.", "b) Chuyển đổi số giúp an sinh xã hội minh bạch, thuận tiện.", "c) Mở rộng bao phủ BHXH cần chính sách linh hoạt, phù hợp.", "d) An sinh xã hội không cần đổi mới."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp 2 về an sinh xã hội):", "explain": "a), b), c) Đúng. d) Sai: học sinh tham gia BHYT và hoạt động nhân đạo.", "points": 1, "statements": ["a) An sinh xã hội ổn định đời sống người dân trước rủi ro.", "b) Mỗi công dân đều có trách nhiệm với an sinh xã hội.", "c) Gian lận chính sách an sinh bị xử lí nghiêm.", "d) Học sinh không liên quan đến an sinh xã hội."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "VD", "q": "Ứng dụng tra cứu BHXH, BHYT trực tuyến của Việt Nam có tên là gì?", "explain": "Ứng dụng VssID – Bảo hiểm xã hội số.", "points": 0.5, "answer": "VssID"}, {"type": "short", "level": "VD", "q": "Hoàn thành câu: An sinh xã hội hướng tới mục tiêu bao phủ ... dân.", "explain": "An sinh xã hội hướng tới bao phủ toàn dân.", "points": 0.5, "answer": "toàn"}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "VDC", "q": "Tình huống: Anh T bị tai nạn lao động, được hưởng chế độ TNLĐ và trợ cấp một lần. Điều này thể hiện", "explain": "Chế độ TNLĐ của BHXH bảo vệ NLĐ khi gặp tai nạn trong quá trình lao động.", "points": 0.25, "options": ["A. sự may mắn.", "B. vai trò bảo vệ người lao động của BHXH.", "C. trách nhiệm của anh T.", "D. không liên quan đến BHXH."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Tình huống: Chị H nghỉ sinh 6 tháng được hưởng trợ cấp thai sản. Điều này thể hiện", "explain": "Chế độ thai sản bảo vệ sức khoẻ, quyền lợi của lao động nữ khi sinh con.", "points": 0.25, "options": ["A. chế độ thai sản bảo vệ lao động nữ.", "B. sự ưu ái bất hợp lí.", "C. gây thiệt hại doanh nghiệp.", "D. không cần thiết."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Tình huống: Ông V đủ tuổi nghỉ hưu, đủ năm đóng BHXH nên được hưởng lương hưu hằng tháng. Điều này thể hiện", "explain": "Chế độ hưu trí bảo đảm thu nhập ổn định cho người cao tuổi khi hết tuổi lao động.", "points": 0.25, "options": ["A. chế độ hưu trí bảo đảm cuộc sống người cao tuổi.", "B. sự lãng phí.", "C. ông V không cần lương hưu.", "D. con cháu phải nuôi."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Tình huống: Bạn N mồ côi cả cha lẫn mẹ được hưởng trợ cấp xã hội hằng tháng. Điều này thể hiện", "explain": "Trợ giúp xã hội bảo đảm cuộc sống cho trẻ em mồ côi, người yếu thế.", "points": 0.25, "options": ["A. trụ cột trợ giúp xã hội: Nhà nước chăm lo trẻ em mồ côi.", "B. sự thương hại.", "C. không cần thiết.", "D. bạn N phải tự lo."], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Trong các việc làm sau, việc nào góp phần vào an sinh xã hội?", "explain": "Tham gia BHYT, hiến máu, ủng hộ quỹ vì người nghèo là những đóng góp thiết thực.", "points": 0.25, "options": ["A. Tham gia BHYT đầy đủ, hiến máu nhân đạo, ủng hộ quỹ vì người nghèo.", "B. Trốn đóng BHXH.", "C. Gian lận hưởng trợ cấp.", "D. Cho mượn thẻ BHYT."], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Thông điệp của bài học đối với học sinh lớp 12 là", "explain": "Học sinh cần hiểu an sinh xã hội, tham gia BHYT, sống nhân ái, đóng góp cho cộng đồng.", "points": 0.25, "options": ["A. an sinh là việc của người lớn.", "B. hiểu về an sinh xã hội, tham gia BHYT, sống tương thân tương ái, góp phần xây dựng xã hội tốt đẹp.", "C. không cần quan tâm.", "D. chỉ lo cho bản thân."], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Sau bão, các hộ dân bị thiệt hại được hỗ trợ khẩn cấp và vay vốn ưu đãi để tái sản xuất. Xét tính đúng, sai:", "explain": "a), b), c) Đúng. d) Sai: Nhà nước có chính sách cứu trợ, hỗ trợ kịp thời.", "points": 1, "statements": ["a) Đây là chính sách trợ giúp xã hội đột xuất.", "b) Hỗ trợ kịp thời giúp người dân sớm ổn định cuộc sống.", "c) Tín dụng ưu đãi giúp người dân tái sản xuất.", "d) Người dân vùng thiên tai phải tự lo, không được hỗ trợ."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau (tổng kết toàn bài về an sinh xã hội):", "explain": "a), b), c) Đúng. d) Sai: bị xử lí nghiêm theo pháp luật.", "points": 1, "statements": ["a) An sinh xã hội gồm 5 trụ cột: BHXH, BHYT, BHTN, trợ giúp xã hội, ưu đãi người có công.", "b) Điều 34 Hiến pháp 2013 quy định quyền được bảo đảm an sinh xã hội.", "c) Mỗi công dân cần tham gia đầy đủ, chấp hành pháp luật về an sinh.", "d) Trục lợi chính sách an sinh là hành vi hợp pháp."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "VD", "q": "Hoàn thành câu: Công dân có quyền được bảo đảm an sinh ... (1 từ).", "explain": "Điều 34 Hiến pháp 2013: Công dân có quyền được bảo đảm an sinh xã hội.", "points": 0.5, "answer": "xã hội"}, {"type": "short", "level": "VDC", "q": "BHXH, BHYT, BHTN là các ... quan trọng của hệ thống an sinh xã hội (điền 1 từ).", "explain": "BHXH, BHYT, BHTN là các trụ cột quan trọng của an sinh xã hội.", "points": 0.5, "answer": "trụ cột"}]}]}
