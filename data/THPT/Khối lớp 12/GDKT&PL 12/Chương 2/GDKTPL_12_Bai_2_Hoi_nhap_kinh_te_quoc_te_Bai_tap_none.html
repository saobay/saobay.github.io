{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Hội nhập kinh tế quốc tế là", "explain": "Hội nhập kinh tế quốc tế là quá trình gắn kết nền kinh tế quốc gia với nền kinh tế thế giới qua thương mại, đầu tư, hợp tác.", "points": 0.25, "options": ["A. quá trình gắn kết nền kinh tế của một quốc gia với nền kinh tế thế giới.", "B. việc một quốc gia đóng cửa nền kinh tế.", "C. việc chỉ xuất khẩu mà không nhập khẩu.", "D. việc sáp nhập lãnh thổ các quốc gia."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Nguyên nhân sâu xa dẫn tới hội nhập kinh tế quốc tế là", "explain": "Phân công lao động quốc tế và toàn cầu hoá khiến không quốc gia nào có đủ mọi nguồn lực để phát triển độc lập.", "points": 0.25, "options": ["A. các nước muốn gây chiến tranh.", "B. phân công lao động quốc tế và toàn cầu hoá ngày càng sâu rộng.", "C. các nước đều thừa vốn.", "D. không quốc gia nào muốn phát triển."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Hiệp định EVFTA được kí kết giữa Việt Nam và", "explain": "EVFTA là Hiệp định thương mại tự do giữa Việt Nam và Liên minh châu Âu, có hiệu lực từ 2020.", "points": 0.25, "options": ["A. Hoa Kỳ.", "B. Liên minh châu Âu (EU).", "C. Nhật Bản.", "D. Trung Quốc."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Việt Nam gia nhập WTO vào năm nào?", "explain": "Việt Nam chính thức gia nhập Tổ chức Thương mại thế giới (WTO), trở thành thành viên thứ 150, vào năm 2007.", "points": 0.25, "options": ["A. 1995.", "B. 2001.", "C. 2007.", "D. 2015."], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Biểu hiện nào sau đây là tác động tích cực của hội nhập kinh tế quốc tế?", "explain": "Mở rộng thị trường, thu hút FDI, tiếp cận KHCN là các cơ hội của hội nhập; các phương án còn lại là thách thức.", "points": 0.25, "options": ["A. Mở rộng thị trường, thu hút FDI, tiếp cận khoa học công nghệ.", "B. Cạnh tranh gay gắt với hàng hoá nước ngoài.", "C. Nguy cơ phụ thuộc vào thị trường nước ngoài.", "D. Nguy cơ tụt hậu về kinh tế."], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Thách thức lớn nhất đối với doanh nghiệp Việt Nam khi hội nhập sâu rộng là", "explain": "Mở cửa thị trường đồng nghĩa với cạnh tranh gay gắt từ hàng hoá, doanh nghiệp nước ngoài ngay trên sân nhà.", "points": 0.25, "options": ["A. thị trường quá nhỏ.", "B. phải cạnh tranh gay gắt với hàng hoá và doanh nghiệp nước ngoài.", "C. không được xuất khẩu.", "D. bị cấm đầu tư ra nước ngoài."], "answer": "B"}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về khái niệm và cấp độ hội nhập:", "explain": "Cả 4 khẳng định đều đúng: EVFTA (Việt Nam – EU) là song phương; ASEAN là khu vực; WTO là toàn cầu.", "points": 1, "statements": ["a) Hội nhập kinh tế quốc tế là quá trình gắn kết nền kinh tế quốc gia với nền kinh tế thế giới.", "b) EVFTA là ví dụ về hội nhập song phương.", "c) Gia nhập ASEAN là ví dụ về hội nhập ở cấp độ khu vực.", "d) Gia nhập WTO là ví dụ về hội nhập ở cấp độ toàn cầu."], "answer": ["T", "T", "T", "T"]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tác động của hội nhập:", "explain": "a), b), d) Đúng. c) Sai: hội nhập mang lại cơ hội và thách thức đan xen.", "points": 1, "statements": ["a) Hội nhập giúp mở rộng thị trường tiêu thụ hàng hoá.", "b) Hội nhập giúp thu hút vốn đầu tư trực tiếp nước ngoài (FDI).", "c) Hội nhập chỉ mang lại cơ hội, không có thách thức nào.", "d) Cạnh tranh gay gắt là một thách thức của hội nhập."], "answer": ["T", "T", "F", "T"]}, {"type": "short", "level": "VDC", "q": "Việt Nam gia nhập ASEAN vào năm nào? (điền số năm)", "explain": "Việt Nam chính thức gia nhập Hiệp hội các quốc gia Đông Nam Á (ASEAN) vào năm 1995.", "points": 0.5, "answer": "1995"}, {"type": "short", "level": "VDC", "q": "Điền cụm từ còn thiếu: Hội nhập kinh tế quốc tế mang lại ... và thách thức đan xen.", "explain": "Hội nhập kinh tế quốc tế mang lại cơ hội và thách thức đan xen nhau.", "points": 0.5, "answer": "cơ hội"}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Việt Nam là thành viên thứ bao nhiêu của WTO?", "explain": "Việt Nam là thành viên thứ 150 của Tổ chức Thương mại thế giới (WTO) khi gia nhập năm 2007.", "points": 0.25, "options": ["A. 100.", "B. 128.", "C. 150.", "D. 164."], "answer": "C"}, {"type": "mcq", "level": "NB", "q": "Hiệp định CPTPP có hiệu lực đối với Việt Nam từ năm", "explain": "Hiệp định Đối tác Toàn diện và Tiến bộ xuyên Thái Bình Dương (CPTPP) có hiệu lực từ đầu năm 2019.", "points": 0.25, "options": ["A. 2015.", "B. 2019.", "C. 2021.", "D. 2023."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "RCEP là hiệp định thương mại tự do", "explain": "RCEP có hiệu lực từ 2022, là FTA lớn nhất thế giới với 15 thành viên, trong đó có Việt Nam.", "points": 0.25, "options": ["A. giữa Việt Nam và Hoa Kỳ.", "B. lớn nhất thế giới với sự tham gia của 15 nền kinh tế châu Á – Thái Bình Dương.", "C. chỉ gồm các nước ASEAN.", "D. về quân sự."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Kim ngạch xuất nhập khẩu của Việt Nam năm 2023 đạt khoảng", "explain": "Năm 2023, tổng kim ngạch xuất nhập khẩu của Việt Nam đạt khoảng 683 tỉ USD.", "points": 0.25, "options": ["A. 100 tỉ USD.", "B. 300 tỉ USD.", "C. 683 tỉ USD.", "D. 1.000 tỉ USD."], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Chủ trương hội nhập của Việt Nam hiện nay là", "explain": "Chủ trương của Đảng và Nhà nước: chủ động, tích cực hội nhập quốc tế toàn diện, sâu rộng; đa phương hoá, đa dạng hoá.", "points": 0.25, "options": ["A. đóng cửa, tự cung tự cấp.", "B. chủ động, tích cực hội nhập quốc tế toàn diện, sâu rộng.", "C. chỉ hội nhập với một nước.", "D. hội nhập nhưng không giữ độc lập."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Việc Việt Nam kí kết 17 FTA thể hiện", "explain": "17 FTA với quan hệ thương mại hơn 200 quốc gia, vùng lãnh thổ thể hiện hội nhập sâu rộng.", "points": 0.25, "options": ["A. chính sách đóng cửa.", "B. mức độ hội nhập sâ ó cấm thương mại quốc tế.", "D. nó làm công nghệ lạc hậu đi."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Biểu hiện của hội nhập kinh tế quốc tế KHÔNG bao gồm", "explain": "Cấm giao dịch với nước ngoài là đóng cửa, trái ngược với hội nhập.", "points": 0.25, "options": ["A. gia tăng thương mại quốc tế.", "B. gia tăng đầu tư trực tiếp nước ngoài.", "C. tham gia các tổ chức kinh tế quốc tế.", "D. cấm mọi giao dịch với nước ngoài."], "answer": "D"}, {"type": "mcq", "level": "TH", "q": "FDI là", "explain": "FDI (Foreign Direct Investment) là vốn đầu tư trực tiếp nước ngoài.", "points": 0.25, "options": ["A. vốn đầu tư trực tiếp nước ngoài.", "B. vốn viện trợ không hoàn lại.", "C. vốn vay ưu đãi.", "D. kiều hối."], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Lợi ích của FDI đối với nước tiếp nhận là", "explain": "FDI bổ sung nguồn vốn, tạo việc làm, chuyển giao công nghệ và kinh nghiệm quản lí.", "points": 0.25, "options": ["A. bổ sung vốn, tạo việc làm, chuyển giao công nghệ.", "B. làm tăng thất nghiệp.", "C. gây ô nhiễm là chính.", "D. không có lợi ích gì."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Khi tham gia FTA, hàng hoá xuất khẩu của Việt Nam thường được hưởng", "explain": "FTA cắt giảm thuế quan, nhiều dòng thuế về 0%, tạo lợi thế cạnh tranh cho hàng xuất khẩu.", "points": 0.25, "options": ["A. thuế suất ưu đãi thấp hơn, thậm chí 0%.", "B. thuế suất cao hơn.", "C. bị cấm xuất khẩu.", "D. không thay đổi gì."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Một doanh nghiệp dệt may Việt Nam muốn xuất khẩu sang EU cần đáp ứng", "explain": "Thị trường EU đòi hỏi tiêu chuẩn cao về chất lượng, quy tắc xuất xứ, môi trường và lao động.", "points": 0.25, "options": ["A. không cần đáp ứng tiêu chuẩn gì.", "B. các tiêu chuẩn về chất lượng, xuất xứ hàng hoá (quy tắc xuất xứ), môi trường, lao động.", "C. chỉ cần giá rẻ.", "D. chỉ cần quan hệ cá nhân."], "answer": "B"}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về FDI:", "explain": "Cả 4 khẳng định đều đúng về vai trò của FDI trong hội nhập.", "points": 1, "statements": ["a) FDI là vốn đầu tư trực tiếp nước ngoài.", "b) FDI tạo việc làm cho lao động nước tiếp nhận.", "c) FDI góp phần chuyển giao công nghệ.", "d) Thu hút FDI là một cơ hội của hội nhập kinh tế quốc tế."], "answer": ["T", "T", "T", "T"]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về nguyên nhân hội nhập:", "explain": "Cả 4 đều là nguyên nhân dẫn tới hội nhập kinh tế quốc tế theo SGK.", "points": 1, "statements": ["a) Phân công lao động quốc tế ngày càng sâu rộng thúc đẩy hội nhập.", "b) Cách mạng khoa học – công nghệ thúc đẩy giao lưu kinh tế quốc tế.", "c) Nhu cầu mở rộng thị trường, thu hút vốn và công nghệ thúc đẩy hội nhập.", "d) Xu thế hoà bình, hợp tác và phát triển thúc đẩy hội nhập."], "answer": ["T", "T", "T", "T"]}, {"type": "short", "level": "NB", "q": "Vốn đầu tư trực tiếp nước ngoài có tên viết tắt tiếng Anh là gì?", "explain": "FDI (Foreign Direct Investment) là vốn đầu tư trực tiếp nước ngoài.", "points": 0.5, "answer": "FDI"}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Đa phương hoá, ... hoá quan hệ là chủ trương hội nhập của Việt Nam.", "explain": "Chủ trương: đa phương hoá, đa dạng hoá quan hệ quốc tế.", "points": 0.5, "answer": "đa dạng"}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "TH", "q": "Thách thức về an ninh kinh tế khi hội nhập sâu rộng là", "explain": "Hội nhập sâu có thể dẫn tới phụ thuộc vào thị trường, vốn, công nghệ nước ngoài, đe doạ an ninh kinh tế.", "points": 0.25, "options": ["A. nguy cơ phụ thuộc vào thị trường, vốn, công nghệ nước ngoài.", "B. thị trường trong nước quá lớn.", "C. không có thách thức nào.", "D. doanh nghiệp trong nước quá mạnh."], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Để hạn chế thách thức của hội nhập, doanh nghiệp Việt Nam cần", "explain": "Nâng cao năng lực cạnh tranh là cách chủ động ứng phó với cạnh tranh gay gắt khi hội nhập.", "points": 0.25, "options": ["A. giữ nguyên công nghệ lạc hậu.", "B. nâng cao năng lực cạnh tranh: chất lượng, thương hiệu, công nghệ, quản trị.", "C. chỉ bán hàng trong nước.", "D. trông chờ bảo hộ mãi mãi."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Vai trò của Nhà nước trong hội nhập kinh tế quốc tế là", "explain": "Nhà nước hoàn thiện thể chế, đàm phán mở cửa thị trường, hỗ trợ doanh nghiệp và bảo đảm an ninh kinh tế.", "points": 0.25, "options": ["A. không cần làm gì.", "B. hoàn thiện thể chế, đàm phán FTA, hỗ trợ doanh nghiệp, bảo đảm an ninh kinh tế.", "C. cấm doanh nghiệp xuất khẩu.", "D. đóng cửa thị trường."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Tình huống: Công ty M nhập dây chuyền công nghệ hiện đại từ Nhật Bản, năng suất tăng gấp đôi, sản phẩm xuất khẩu sang nhiều nước. Đây là", "explain": "Tiếp cận công nghệ tiên tiến và mở rộng thị trường xuất khẩu là các cơ hội của hội nhập.", "points": 0.25, "options": ["A. thách thức của hội nhập.", "B. cơ hội của hội nhập: tiếp cận công nghệ, mở rộng thị trường.", "C. biểu hiện của đóng cửa.", "D. không liên quan đến hội nhập."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Tình huống: Làng nghề T làm hàng thủ công mỹ nghệ xuất khẩu, thu nhập người dân tăng gấp 3 lần. Điều này cho thấy hội nhập", "explain": "Xuất khẩu hàng thủ công tạo việc làm, tăng thu nhập cho người dân, góp phần giảm nghèo.", "points": 0.25, "options": ["A. chỉ có lợi cho doanh nghiệp lớn.", "B. tạo việc làm, tăng thu nhập, góp phần giảm nghèo.", "C. gây hại cho làng nghề.", "D. không liên quan đến người dân."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Phát biểu nào sau đây đúng về mối quan hệ giữa hội nhập và độc lập tự chủ?", "explain": "Quan điểm của Việt Nam: chủ động, tích cực hội nhập đồng thời giữ vững độc lập, tự chủ.", "points": 0.25, "options": ["A. Hội nhập đồng nghĩa với đánh mất độc lập.", "B. Chủ động hội nhập đồng thời giữ vững độc lập, tự chủ và bảo đảm an ninh quốc gia.", "C. Muốn độc lập thì phải đóng cửa.", "D. Hội nhập không cần giữ độc lập."], "answer": "B"}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về thách thức của hội nhập:", "explain": "a), b), c) Đúng: các thách thức của hội nhập. d) Sai: hội nhập cũng tác động đến văn hoá, xã hội.", "points": 1, "statements": ["a) Doanh nghiệp trong nước phải cạnh tranh gay gắt với hàng hoá nước ngoài.", "b) Có nguy cơ phụ thuộc vào thị trường, vốn, công nghệ nước ngoài.", "c) Có nguy cơ tụt hậu nếu không đổi mới.", "d) Hội nhập không đặt ra thách thức nào về văn hoá, xã hội."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về vai trò của Nhà nước và doanh nghiệp:", "explain": "a), b), c) Đúng. d) Sai: hội nhập là sự nghiệp của toàn dân, mỗi người đều có vai trò.", "points": 1, "statements": ["a) Nhà nước cần hoàn thiện thể chế kinh tế để hội nhập hiệu quả.", "b) Doanh nghiệp cần nâng cao năng lực cạnh tranh.", "c) Người lao động cần nâng cao trình độ, kĩ năng nghề nghiệp.", "d) Hội nhập là việc riêng của Nhà nước, người dân không liên quan."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "NB", "q": "Tổ chức Thương mại thế giới có tên viết tắt tiếng Anh là gì?", "explain": "WTO (World Trade Organization) là Tổ chức Thương mại thế giới.", "points": 0.5, "answer": "WTO"}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Việt Nam là bạn, là ... tin cậy của các nước trên thế giới.", "explain": "Chủ trương đối ngoại: Việt Nam là bạn, là đối tác tin cậy và thành viên tích cực, có trách nhiệm.", "points": 0.5, "answer": "đối tác"}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "TH", "q": "Hiệp định thương mại Việt Nam – Hoa Kỳ được kí năm", "explain": "Hiệp định thương mại song phương Việt Nam – Hoa Kỳ được kí năm 2001, mở đường cho xuất khẩu sang Hoa Kỳ.", "points": 0.25, "options": ["A. 1995.", "B. 2001.", "C. 2007.", "D. 2015."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Thị trường xuất khẩu lớn nhất của Việt Nam hiện nay là", "explain": "Hoa Kỳ là thị trường xuất khẩu lớn nhất của Việt Nam trong nhiều năm qua.", "points": 0.25, "options": ["A. Hoa Kỳ.", "B. Lào.", "C. Campuchia.", "D. Mông Cổ."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Mặt hàng xuất khẩu chủ lực của Việt Nam KHÔNG bao gồm", "explain": "Điện thoại, dệt may, giày dép, nông lâm thuỷ sản là các mặt hàng xuất khẩu chủ lực; Việt Nam không xuất khẩu tàu vũ trụ.", "points": 0.25, "options": ["A. điện thoại và linh kiện.", "B. dệt may, giày dép.", "C. nông, lâm, thuỷ sản.", "D. tàu vũ trụ."], "answer": "D"}, {"type": "mcq", "level": "VD", "q": "Xuất khẩu nông sản giúp Việt Nam", "explain": "Xuất khẩu nông sản mang về ngoại tệ, tạo việc làm và thu nhập cho hàng triệu nông dân.", "points": 0.25, "options": ["A. tăng thu ngoại tệ, tạo việc làm cho nông dân.", "B. giảm sản xuất nông nghiệp.", "C. tăng nhập khẩu lương thực.", "D. không có ý nghĩa gì."], "answer": "A"}, {"type": "mcq", "level": "VDC", "q": "Khi hàng hoá nước ngoài tràn vào với giá rẻ, người tiêu dùng Việt Nam được lợi vì", "explain": "Cạnh tranh mang lại cho người tiêu dùng nhiều lựa chọn với giá cả hợp lí hơn.", "points": 0.25, "options": ["A. có nhiều lựa chọn với giá cả cạnh tranh.", "B. hàng nội địa luôn tốt hơn.", "C. không cần quan tâm chất lượng.", "D. giá rẻ luôn đi với chất lượng cao."], "answer": "A"}, {"type": "mcq", "level": "VDC", "q": "Tuy nhiên, hàng giá rẻ tràn vào cũng đặt ra yêu cầu", "explain": "Trước cạnh tranh, doanh nghiệp nội địa phải nâng cao chất lượng, hạ giá thành, xây dựng thương hiệu.", "points": 0.25, "options": ["A. doanh nghiệp nội địa nâng cao chất lượng, giảm giá thành để cạnh tranh.", "B. cấm người dân mua hàng ngoại.", "C. tăng giá hàng nội địa.", "D. ngừng sản xuất trong nước."], "answer": "A"}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về thương mại của Việt Nam:", "explain": "Cả 4 khẳng định đều đúng về thương mại và hội nhập của Việt Nam.", "points": 1, "statements": ["a) Hoa Kỳ là thị trường xuất khẩu lớn nhất của Việt Nam.", "b) Điện thoại, dệt may, giày dép, nông lâm thuỷ sản là mặt hàng xuất khẩu chủ lực.", "c) Xuất khẩu tạo việc làm và thu ngoại tệ cho đất nước.", "d) Cạnh tranh từ hàng nhập khẩu buộc doanh nghiệp nội địa phải nâng cao năng lực."], "answer": ["T", "T", "T", "T"]}, {"type": "truefalse", "level": "NB", "q": "Tình huống: Siêu thị trong nước nhập nhiều trái cây ngoại giá rẻ, nông dân trồng trái cây trong nước khó tiêu thụ. Xét tính đúng, sai:", "explain": "a), b), c) Đúng. d) Sai: cấm nhập khẩu trái cam kết hội nhập; giải pháp là nâng cao năng lực cạnh tranh.", "points": 1, "statements": ["a) Đây là thách thức cạnh tranh từ hội nhập.", "b) Người tiêu dùng có thêm lựa chọn.", "c) Nông dân cần nâng cao chất lượng, xây dựng thương hiệu, liên kết tiêu thụ.", "d) Giải pháp duy nhất là cấm nhập khẩu trái cây."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "NB", "q": "Hiệp định thương mại tự do song phương Việt Nam – Hoa Kỳ được kí năm nào? (điền số năm)", "explain": "Hiệp định thương mại Việt Nam – Hoa Kỳ kí năm 2001.", "points": 0.5, "answer": "2001"}, {"type": "short", "level": "TH", "q": "Điền từ còn thiếu: Thu hút ... là một cơ hội lớn của hội nhập kinh tế quốc tế.", "explain": "Thu hút vốn đầu tư trực tiếp nước ngoài (FDI) là một cơ hội lớn của hội nhập.", "points": 0.5, "answer": "FDI"}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "TH", "q": "Hội nhập kinh tế quốc tế ở cấp độ khu vực của Việt Nam thể hiện qua", "explain": "ASEAN, AFTA, RCEP là các khuôn khổ hợp tác kinh tế ở cấp độ khu vực mà Việt Nam tham gia.", "points": 0.25, "options": ["A. việc gia nhập ASEAN và tham gia AFTA, RCEP.", "B. việc gia nhập WTO.", "C. kí EVFTA với EU.", "D. quan hệ với Hoa Kỳ."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "APEC là diễn đàn hợp tác kinh tế", "explain": "APEC là Diễn đàn hợp tác kinh tế châu Á – Thái Bình Dương; Việt Nam gia nhập năm 1998.", "points": 0.25, "options": ["A. châu Âu.", "B. châu Á – Thái Bình Dương.", "C. châu Phi.", "D. Nam Mỹ."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Việt Nam gia nhập APEC năm", "explain": "Việt Nam gia nhập Diễn đàn hợp tác kinh tế châu Á – Thái Bình Dương (APEC) năm 1998.", "points": 0.25, "options": ["A. 1995.", "B. 1998.", "C. 2007.", "D. 2015."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Tham gia các tổ chức kinh tế quốc tế giúp Việt Nam", "explain": "Tham gia WTO, APEC... giúp Việt Nam có tiếng nói, bảo vệ lợi ích trong luật chơi thương mại toàn cầu.", "points": 0.25, "options": ["A. có tiếng nói trong việc xây dựng luật chơi thương mại toàn cầu.", "B. bị áp đặt mọi điều kiện.", "C. mất chủ quyền.", "D. không được lợi gì."], "answer": "A"}, {"type": "mcq", "level": "VDC", "q": "Một trong những yêu cầu khi gia nhập WTO là Việt Nam phải", "explain": "Gia nhập WTO đòi hỏi cắt giảm thuế quan, minh bạch hoá chính sách, tuân thủ các nguyên tắc thương mại đa phương.", "points": 0.25, "options": ["A. đóng cửa thị trường.", "B. cắt giảm thuế quan, minh bạch hoá chính sách thương mại.", "C. cấm đầu tư nước ngoài.", "D. tăng trợ cấp xuất khẩu tuỳ ý."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Cải cách thể chế kinh tế trong quá trình hội nhập đã giúp Việt Nam", "explain": "Hội nhập thúc đẩy cải cách thể chế, tạo môi trường kinh doanh minh bạch, thuận lợi.", "points": 0.25, "options": ["A. lạc hậu hơn.", "B. tạo môi trường kinh doanh minh bạch, thuận lợi, nâng cao năng lực cạnh tranh quốc gia.", "C. giảm xuất khẩu.", "D. tăng tham nhũng."], "answer": "B"}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về các tổ chức kinh tế quốc tế:", "explain": "Cả 4 khẳng định đều đúng.", "points": 1, "statements": ["a) ASEAN là tổ chức hợp tác khu vực Đông Nam Á.", "b) APEC là diễn đàn hợp tác kinh tế châu Á – Thái Bình Dương.", "c) WTO là tổ chức thương mại toàn cầu.", "d) Việt Nam là thành viên của cả ASEAN, APEC và WTO."], "answer": ["T", "T", "T", "T"]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về yêu cầu của hội nhập:", "explain": "a), b), c) Đúng. d) Sai: hội nhập thúc đẩy mạnh mẽ cải cách thể chế trong nước.", "points": 1, "statements": ["a) Cắt giảm thuế quan theo cam kết là yêu cầu khi tham gia FTA, WTO.", "b) Minh bạch hoá chính sách thương mại là yêu cầu của hội nhập.", "c) Nâng cao năng lực cạnh tranh là yêu cầu đối với doanh nghiệp.", "d) Hội nhập không đòi hỏi bất kì cải cách nào trong nước."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "TH", "q": "Diễn đàn hợp tác kinh tế châu Á – Thái Bình Dương có tên viết tắt là gì?", "explain": "APEC (Asia-Pacific Economic Cooperation); Việt Nam gia nhập năm 1998.", "points": 0.5, "answer": "APEC"}, {"type": "short", "level": "TH", "q": "Việt Nam gia nhập APEC năm nào? (điền số năm)", "explain": "Việt Nam gia nhập APEC năm 1998.", "points": 0.5, "answer": "1998"}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "VD", "q": "Xu thế của thời đại hiện nay được xác định là", "explain": "Hoà bình, hợp tác và phát triển là xu thế chung của thời đại, tạo điều kiện cho hội nhập.", "points": 0.25, "options": ["A. chiến tranh và đối đầu.", "B. hoà bình, hợp tác và phát triển.", "C. đóng cửa, biệt lập.", "D. chạy đua vũ trang."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Vì sao hội nhập kinh tế quốc tế là xu thế tất yếu?", "explain": "Phân công lao động quốc tế sâu rộng và toàn cầu hoá khiến hội nhập trở thành xu thế tất yếu, khách quan.", "points": 0.25, "options": ["A. Vì mọi nước đều muốn gây ảnh hưởng.", "B. Vì phân công lao động quốc tế, toàn cầu hoá và nhu cầu phát triển là khách quan.", "C. Vì các nước đều thừa tiền.", "D. Vì không nước nào có chủ quyền."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Một quốc gia từ chối hội nhập kinh tế quốc tế sẽ", "explain": "Từ chối hội nhập đồng nghĩa với tự cô lập, bỏ lỡ cơ hội và có nguy cơ tụt hậu.", "points": 0.25, "options": ["A. phát triển nhanh hơn.", "B. có nguy cơ tụt hậu, bị cô lập khỏi dòng chảy phát triển chung.", "C. không bị ảnh hưởng gì.", "D. tự động giàu có."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Bài học từ các nước NICs (Hàn Quốc, Singapore...) cho thấy", "explain": "Các nước NICs thành công nhờ mở cửa hội nhập gắn với cải cách thể chế, đầu tư cho giáo dục và công nghệ.", "points": 0.25, "options": ["A. đóng cửa vẫn phát triển tốt.", "B. hội nhập đúng đắn gắn với cải cách trong nước tạo ra thần kì tăng trưởng.", "C. không cần giáo dục.", "D. chỉ cần tài nguyên."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Đối với học sinh, hội nhập kinh tế quốc tế đặt ra yêu cầu", "explain": "Hội nhập mở ra thị trường lao động cạnh tranh, đòi hỏi người lao động có trình độ, ngoại ngữ và kĩ năng tốt.", "points": 0.25, "options": ["A. không cần học ngoại ngữ.", "B. học tốt, nâng cao trình độ, ngoại ngữ, kĩ năng để đáp ứng thị trường lao động hội nhập.", "C. chỉ học trong nước là đủ.", "D. không cần quan tâm."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Thị trường lao động khi hội nhập sâu rộng có đặc điểm", "explain": "Hội nhập tạo ra thị trường lao động cạnh tranh với yêu cầu cao về chất lượng nguồn nhân lực.", "points": 0.25, "options": ["A. chỉ tuyển lao động phổ thông.", "B. cạnh tranh gay gắt, đòi hỏi cao về trình độ, kĩ năng, ngoại ngữ.", "C. không cần kĩ năng.", "D. lương luôn thấp."], "answer": "B"}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về xu thế hội nhập:", "explain": "a), b), c) Đúng. d) Sai: trong bối cảnh toàn cầu hoá, không hội nhập khó phát triển bền vững.", "points": 1, "statements": ["a) Hoà bình, hợp tác và phát triển là xu thế chung của thời đại.", "b) Hội nhập kinh tế quốc tế là xu thế tất yếu, khách quan.", "c) Từ chối hội nhập có thể khiến quốc gia tụt hậu.", "d) Mọi quốc gia đều có thể phát triển tốt mà không cần hội nhập."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về yêu cầu đối với người lao động:", "explain": "a), b), c) Đúng. d) Sai: cần học tập suốt đời để thích ứng.", "points": 1, "statements": ["a) Hội nhập đòi hỏi người lao động nâng cao trình độ chuyên môn.", "b) Ngoại ngữ là lợi thế trong thị trường lao động hội nhập.", "c) Kĩ năng mềm, tác phong công nghiệp ngày càng quan trọng.", "d) Lao động không cần học hỏi gì thêm khi đã có việc làm."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "TH", "q": "Điền cụm từ còn thiếu: ... , hợp tác và phát triển là xu thế chung của thời đại.", "explain": "Hoà bình, hợp tác và phát triển là xu thế chung của thời đại.", "points": 0.5, "answer": "Hoà bình"}, {"type": "short", "level": "TH", "q": "Hiệp định RCEP có hiệu lực từ năm nào? (điền số năm)", "explain": "Hiệp định Đối tác kinh tế toàn diện khu vực (RCEP) có hiệu lực từ đầu năm 2022.", "points": 0.5, "answer": "2022"}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "VD", "q": "Tình huống: Doanh nghiệp X tận dụng ưu đãi thuế từ EVFTA để xuất khẩu giày dép sang EU, doanh thu tăng 40%. Đây là minh chứng cho", "explain": "Ưu đãi thuế quan từ FTA giúp hàng hoá cạnh tranh hơn, mở rộng thị trường xuất khẩu.", "points": 0.25, "options": ["A. thách thức của hội nhập.", "B. cơ hội của hội nhập: ưu đãi thuế quan mở rộng thị trường.", "C. sự thất bại của hội nhập.", "D. không liên quan đến EVFTA."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Tình huống: Doanh nghiệp Y bị hàng nhập khẩu giá rẻ cạnh tranh, phải đầu tư đổi mới công nghệ, sau 2 năm chất lượng sản phẩm vượt trội. Đây là", "explain": "Cạnh tranh từ hội nhập tạo sức ép tích cực, buộc doanh nghiệp đổi mới để tồn tại và phát triển.", "points": 0.25, "options": ["A. tác động tiêu cực duy nhất của hội nhập.", "B. thách thức trở thành động lực nâng cao năng lực cạnh tranh.", "C. sự sụp đổ của doanh nghiệp.", "D. không liên quan đến hội nhập."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Để xuất khẩu nông sản sang thị trường khó tính (EU, Nhật, Hoa Kỳ), nông dân Việt Nam cần", "explain": "Thị trường khó tính đòi hỏi tiêu chuẩn chất lượng, an toàn thực phẩm, truy xuất nguồn gốc.", "points": 0.25, "options": ["A. sản xuất theo tiêu chuẩn VietGAP, GlobalGAP, bảo đảm an toàn thực phẩm, truy xuất nguồn gốc.", "B. dùng nhiều thuốc trừ sâu.", "C. không cần tiêu chuẩn gì.", "D. chỉ cần giá rẻ."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Chương trình \"mỗi xã một sản phẩm\" (OCOP) gắn với hội nhập giúp", "explain": "OCOP nâng cao chất lượng, thương hiệu sản phẩm địa phương, tạo điều kiện vươn ra thị trường quốc tế.", "points": 0.25, "options": ["A. sản phẩm địa phương vươn ra thị trường quốc tế.", "B. đóng cửa thị trường nông thôn.", "C. giảm chất lượng sản phẩm.", "D. tăng nhập khẩu."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Thương mại điện tử xuyên biên giới trong hội nhập tạo cơ hội cho", "explain": "Thương mại điện tử xuyên biên giới giúp cả doanh nghiệp nhỏ tiếp cận thị trường quốc tế.", "points": 0.25, "options": ["A. chỉ doanh nghiệp lớn.", "B. cả doanh nghiệp nhỏ, hộ kinh doanh bán hàng ra thị trường quốc tế.", "C. không ai.", "D. chỉ người nước ngoài."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Gian lận xuất xứ hàng hoá để hưởng ưu đãi thuế FTA là hành vi", "explain": "Gian lận xuất xứ là vi phạm pháp luật, làm mất uy tín hàng Việt Nam và bị xử lí nghiêm.", "points": 0.25, "options": ["A. thông minh, nên làm.", "B. vi phạm pháp luật, gây hại uy tín quốc gia và bị xử lí.", "C. được khuyến khích.", "D. không ai quan tâm."], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Tình huống: HTX rau sạch S đạt chứng nhận VietGAP, kí hợp đồng xuất khẩu sang Nhật Bản. Xét tính đúng, sai:", "explain": "a), b), c) Đúng. d) Sai: phải duy trì chất lượng ổn định theo hợp đồng.", "points": 1, "statements": ["a) Đây là cơ hội từ hội nhập: mở rộng thị trường xuất khẩu.", "b) Chứng nhận VietGAP giúp đáp ứng tiêu chuẩn thị trường khó tính.", "c) Xuất khẩu giúp tăng thu nhập cho xã viên HTX.", "d) HTX không cần quan tâm đến chất lượng sau khi đã kí hợp đồng."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về ứng xử trong hội nhập:", "explain": "a), b), c) Đúng. d) Sai: hội nhập không đồng nghĩa với sính ngoại.", "points": 1, "statements": ["a) Doanh nghiệp cần trung thực về xuất xứ hàng hoá.", "b) Gian lận thương mại làm mất uy tín quốc gia.", "c) Người tiêu dùng nên ưu tiên hàng Việt Nam chất lượng cao.", "d) Hội nhập có nghĩa là chỉ dùng hàng ngoại."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "TH", "q": "Chương trình \"mỗi xã một sản phẩm\" có tên viết tắt là gì?", "explain": "OCOP (One Commune One Product): mỗi xã một sản phẩm.", "points": 0.5, "answer": "OCOP"}, {"type": "short", "level": "VD", "q": "Điền từ còn thiếu: Cạnh tranh ... buộc doanh nghiệp phải không ngừng đổi mới.", "explain": "Cạnh tranh lành mạnh là động lực thúc đẩy doanh nghiệp đổi mới, nâng cao năng lực.", "points": 0.5, "answer": "lành mạnh"}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "VDC", "q": "Đánh giá tổng thể về hội nhập kinh tế quốc tế của Việt Nam sau gần 40 năm Đổi mới là", "explain": "Sau Đổi mới, Việt Nam từ nước nghèo kém phát triển thành nước thu nhập trung bình, hội nhập sâu rộng với 17 FTA.", "points": 0.25, "options": ["A. thất bại hoàn toàn.", "B. thành công: từ nước nghèo thành nước thu nhập trung bình, hội nhập sâu rộng.", "C. không có gì thay đổi.", "D. bị cô lập hoàn toàn."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Tỉ trọng xuất khẩu trong GDP của Việt Nam thuộc nhóm", "explain": "Độ mở thương mại của Việt Nam thuộc nhóm cao nhất thế giới, cho thấy hội nhập sâu rộng.", "points": 0.25, "options": ["A. thấp nhất thế giới.", "B. cao hàng đầu thế giới, cho thấy độ mở lớn của nền kinh tế.", "C. bằng 0.", "D. không đáng kể."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Độ mở lớn của nền kinh tế vừa là lợi thế vừa đặt ra yêu cầu", "explain": "Độ mở lớn đòi hỏi đa dạng hoá thị trường, nâng cao sức chống chịu trước biến động bên ngoài.", "points": 0.25, "options": ["A. đóng cửa trở lại.", "B. nâng cao sức chống chịu, đa dạng hoá thị trường, bảo đảm an ninh kinh tế.", "C. phụ thuộc vào một thị trường.", "D. ngừng xuất khẩu."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Trong bối cảnh căng thẳng thương mại toàn cầu, Việt Nam cần", "explain": "Đa dạng hoá thị trường và chuỗi cung ứng, tận dụng FTA là cách ứng phó với biến động thương mại toàn cầu.", "points": 0.25, "options": ["A. chỉ phụ thuộc vào một thị trường lớn.", "B. đa dạng hoá thị trường, chuỗi cung ứng, tận dụng các FTA.", "C. ngừng hội nhập.", "D. tăng thuế nhập khẩu tuỳ ý."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Vai trò của ngoại giao kinh tế trong hội nhập là", "explain": "Ngoại giao kinh tế mở đường cho thương mại, đầu tư, bảo vệ lợi ích của đất nước và doanh nghiệp.", "points": 0.25, "options": ["A. không quan trọng.", "B. mở đường cho thương mại, đầu tư, bảo vệ lợi ích quốc gia.", "C. chỉ để du lịch.", "D. gây căng thẳng."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Người dân Việt Nam đi du lịch, học tập, làm việc ở nước ngoài ngày càng nhiều cho thấy", "explain": "Giao lưu con người trên nhiều lĩnh vực thể hiện hội nhập toàn diện, sâu rộng.", "points": 0.25, "options": ["A. hội nhập chỉ về kinh tế.", "B. hội nhập toàn diện trên nhiều lĩnh vực: kinh tế, văn hoá, giáo dục, lao động.", "C. chảy máu chất xám hoàn toàn.", "D. không ai muốn ở lại Việt Nam."], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp về hội nhập kinh tế quốc tế):", "explain": "a), b), c) Đúng. d) Sai: chủ động hội nhập đồng thời giữ vững độc lập, tự chủ.", "points": 1, "statements": ["a) Hội nhập kinh tế quốc tế mang lại cơ hội và thách thức đan xen.", "b) Việt Nam chủ trương hội nhập toàn diện, sâu rộng, đa phương hoá, đa dạng hoá.", "c) Doanh nghiệp cần nâng cao năng lực cạnh tranh để tận dụng cơ hội hội nhập.", "d) Hội nhập đồng nghĩa với đánh mất độc lập, tự chủ."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp 2 về hội nhập kinh tế quốc tế):", "explain": "a), b), c) Đúng. d) Sai: đóng cửa sẽ tụt hậu.", "points": 1, "statements": ["a) EVFTA, CPTPP, RCEP là các FTA thế hệ mới mà Việt Nam tham gia.", "b) FDI góp phần tạo việc làm, chuyển giao công nghệ cho Việt Nam.", "c) Cạnh tranh từ hội nhập tạo sức ép tích cực cho doanh nghiệp đổi mới.", "d) Việt Nam nên đóng cửa để tránh cạnh tranh."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "VD", "q": "Đến nay Việt Nam đã kí kết bao nhiêu hiệp định thương mại tự do (FTA)? (điền số)", "explain": "Đến nay Việt Nam đã kí kết 17 hiệp định thương mại tự do (FTA).", "points": 0.5, "answer": "17"}, {"type": "short", "level": "VD", "q": "Hoàn thành câu: Chủ động, tích cực hội nhập quốc tế ... , sâu rộng là chủ trương của Việt Nam.", "explain": "Chủ trương: chủ động, tích cực hội nhập quốc tế toàn diện, sâu rộng.", "points": 0.5, "answer": "toàn diện"}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "VDC", "q": "Trong các giải pháp tận dụng cơ hội hội nhập, giải pháp mang tính nền tảng, lâu dài nhất là", "explain": "Nguồn nhân lực chất lượng cao và KHCN là nền tảng lâu dài để tận dụng cơ hội hội nhập.", "points": 0.25, "options": ["A. trợ cấp cho mọi doanh nghiệp.", "B. đầu tư cho giáo dục, khoa học công nghệ, nâng cao chất lượng nguồn nhân lực.", "C. in tiền.", "D. tăng thuế."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Một sinh viên muốn làm việc cho công ty đa quốc gia cần chuẩn bị", "explain": "Môi trường đa quốc gia đòi hỏi ngoại ngữ, chuyên môn, kĩ năng và tác phong chuyên nghiệp.", "points": 0.25, "options": ["A. không cần gì.", "B. ngoại ngữ, chuyên môn vững, kĩ năng mềm, tác phong chuyên nghiệp.", "C. chỉ cần bằng cấp.", "D. chỉ cần quan hệ."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Hiệp định thương mại tự do thế hệ mới (CPTPP, EVFTA) có tiêu chuẩn cao về", "explain": "FTA thế hệ mới đặt ra tiêu chuẩn cao về lao động, môi trường, sở hữu trí tuệ, minh bạch thể chế.", "points": 0.25, "options": ["A. chỉ thuế quan.", "B. lao động, môi trường, sở hữu trí tuệ, minh bạch.", "C. quân sự.", "D. không có tiêu chuẩn gì."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Để đáp ứng tiêu chuẩn lao động trong EVFTA, Việt Nam đã", "explain": "Việt Nam đã hoàn thiện pháp luật lao động, cho phép tổ chức đại diện của người lao động tại doanh nghiệp.", "points": 0.25, "options": ["A. không làm gì.", "B. cho phép thành lập tổ chức đại diện người lao động, hoàn thiện Bộ luật Lao động 2019.", "C. cấm công đoàn.", "D. giảm lương công nhân."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Hội nhập kinh tế quốc tế góp phần vào hoà bình vì", "explain": "Ràng buộc lợi ích kinh tế lẫn nhau tạo động lực duy trì hoà bình, ổn định để hợp tác phát triển.", "points": 0.25, "options": ["A. các nước phụ thuộc lẫn nhau về kinh tế nên có lợi ích chung trong duy trì hoà bình.", "B. hội nhập gây chiến tranh.", "C. hội nhập không liên quan đến hoà bình.", "D. chỉ có quân sự mới giữ hoà bình."], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Thông điệp quan trọng nhất của bài học đối với thế hệ trẻ là", "explain": "Thế hệ trẻ cần chủ động học tập, rèn luyện để hội nhập và đóng góp cho đất nước.", "points": 0.25, "options": ["A. hội nhập là việc của người lớn.", "B. chủ động học tập, rèn luyện để trở thành công dân toàn cầu, góp phần đưa đất nước hội nhập thành công.", "C. không cần quan tâm đến thế giới.", "D. chỉ cần giỏi một môn."], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp toàn bài về hội nhập kinh tế quốc tế):", "explain": "a), b), c) Đúng. d) Sai.", "points": 1, "statements": ["a) Hội nhập là quá trình gắn kết nền kinh tế quốc gia với kinh tế thế giới.", "b) FTA thế hệ mới đặt ra tiêu chuẩn cao về lao động, môi trường.", "c) Nguồn nhân lực chất lượng cao là nền tảng tận dụng cơ hội hội nhập.", "d) Việt Nam nên từ bỏ hội nhập để tránh thách thức."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp toàn bài 2 về hội nhập kinh tế quốc tế):", "explain": "a), b), c) Đúng. d) Sai: gian lận xuất xứ là vi phạm pháp luật.", "points": 1, "statements": ["a) Cấp độ hội nhập gồm song phương, khu vực và toàn cầu.", "b) WTO là tổ chức thương mại toàn cầu, Việt Nam gia nhập năm 2007.", "c) Đa dạng hoá thị trường giúp giảm rủi ro khi hội nhập sâu.", "d) Gian lận xuất xứ hàng hoá là hành vi đáng khuyến khích."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "VD", "q": "Bộ luật Lao động hiện hành của Việt Nam được ban hành năm nào? (điền số năm)", "explain": "Bộ luật Lao động 2019 (có hiệu lực từ 01/01/2021) đã hoàn thiện nhiều quy định đáp ứng cam kết hội nhập.", "points": 0.5, "answer": "2019"}, {"type": "short", "level": "VDC", "q": "Hoàn thành câu: Việt Nam là bạn, là đối tác ... của các nước trên thế giới.", "explain": "Việt Nam là bạn, là đối tác tin cậy và thành viên tích cực, có trách nhiệm của cộng đồng quốc tế.", "points": 0.5, "answer": "tin cậy"}]}]}
