{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Tăng trưởng kinh tế là", "explain": "Tăng trưởng kinh tế là sự gia tăng quy mô sản lượng (GDP, GNP) trong một thời kì nhất định, phản ánh thay đổi về lượng.", "points": 0.25, "options": ["A. sự gia tăng quy mô sản lượng của nền kinh tế trong một thời kì nhất định.", "B. sự biến đổi toàn diện về văn hoá, xã hội và môi trường.", "C. sự giảm tỉ lệ hộ nghèo và bất bình đẳng thu nhập.", "D. sự chuyển dịch cơ cấu kinh tế theo hướng hiện đại."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Chỉ tiêu nào sau đây KHÔNG dùng để đo lường tăng trưởng kinh tế?", "explain": "HDI là chỉ tiêu đo lường phát triển kinh tế (về chất), không phải tăng trưởng kinh tế.", "points": 0.25, "options": ["A. GDP.", "B. GNP.", "C. Tốc độ tăng trưởng kinh tế.", "D. Chỉ số phát triển con người (HDI)."], "answer": "D"}, {"type": "mcq", "level": "NB", "q": "Phát triển kinh tế phản ánh sự thay đổi về", "explain": "Phát triển kinh tế là quá trình biến đổi sâu sắc, toàn diện về chất: kinh tế gắn với tiến bộ xã hội và bảo vệ môi trường.", "points": 0.25, "options": ["A. lượng của nền kinh tế.", "B. chất của nền kinh tế một cách toàn diện.", "C. quy mô dân số.", "D. tốc độ đô thị hoá."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Công thức tính tốc độ tăng trưởng kinh tế là", "explain": "Tốc độ tăng trưởng bằng phần trăm thay đổi của GDP giữa kì hiện tại và kì trước: $g = (GDP_{t} - GDP_{t-1})/GDP_{t-1} \\times 100\\%$.", "points": 0.25, "options": ["A. $g = GDP_{t} \\times GDP_{t-1} \\times 100\\%$.", "B. $g = \\frac{GDP_{t} - GDP_{t-1}}{GDP_{t-1}} \\times 100\\%$.", "C. $g = \\frac{GDP_{t} + GDP_{t-1}}{2} \\times 100\\%$.", "D. $g = \\frac{GDP_{t-1} - GDP_{t}}{GDP_{t}} \\times 100\\%$."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "HDI là chỉ số tổng hợp 3 tiêu chí nào?", "explain": "HDI tổng hợp tuổi thọ bình quân, trình độ giáo dục và thu nhập bình quân đầu người; càng gần 1 càng phát triển.", "points": 0.25, "options": ["A. GDP, GNP và tốc độ tăng trưởng.", "B. Tuổi thọ bình quân, trình độ giáo dục, thu nhập bình quân đầu người.", "C. Tỉ lệ hộ nghèo, tỉ lệ thất nghiệp, lạm phát.", "D. Xuất khẩu, nhập khẩu, đầu tư nước ngoài."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Một quốc gia có GDP tăng 8%/năm nhưng tỉ lệ hộ nghèo không giảm, ô nhiễm môi trường nghiêm trọng. Nhận định đúng là", "explain": "Tăng trưởng không tự động dẫn tới phát triển: tăng trưởng cao mà đời sống không cải thiện, môi trường suy thoái thì chưa phải phát triển.", "points": 0.25, "options": ["A. quốc gia đó đã phát triển bền vững.", "B. quốc gia đó có tăng trưởng nhưng chưa phát triển.", "C. quốc gia đó không có tăng trưởng kinh tế.", "D. GDP không liên quan đến phát triển kinh tế."], "answer": "B"}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về tăng trưởng kinh tế:", "explain": "a) Đúng: định nghĩa GDP. b) Sai: GNP/GNI tính cả giá trị do công dân tạo ra ở nước ngoài. c) Đúng. d) Sai: tăng trưởng phản ánh thay đổi về lượng.", "points": 1, "statements": ["a) GDP là tổng giá trị thị trường của hàng hoá và dịch vụ cuối cùng được sản xuất trong phạm vi lãnh thổ một quốc gia.", "b) GNP chỉ tính giá trị do công dân trong nước tạo ra, không tính giá trị do công dân ở nước ngoài tạo ra.", "c) Tốc độ tăng trưởng kinh tế được tính bằng phần trăm thay đổi của GDP thực tế.", "d) Tăng trưởng kinh tế phản ánh sự thay đổi về chất của nền kinh tế."], "answer": ["T", "F", "T", "F"]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về mối quan hệ giữa tăng trưởng và phát triển kinh tế:", "explain": "a), b), d) Đúng theo SGK. c) Sai: tăng trưởng cao chưa chắc đã phát triển nếu thiếu tiến bộ xã hội và bảo vệ môi trường.", "points": 1, "statements": ["a) Tăng trưởng kinh tế là tiền đề, điều kiện vật chất cho phát triển kinh tế.", "b) Phát triển kinh tế là mục tiêu của tăng trưởng kinh tế.", "c) Mọi quốc gia có tốc độ tăng trưởng GDP cao đều đã phát triển bền vững.", "d) Phát triển kinh tế với nguồn nhân lực chất lượng cao thúc đẩy tăng trưởng bền vững."], "answer": ["T", "T", "F", "T"]}, {"type": "short", "level": "VDC", "q": "GDP của một quốc gia năm 2022 là 400 tỉ USD, năm 2023 là 424 tỉ USD. Tốc độ tăng trưởng kinh tế năm 2023 là bao nhiêu phần trăm?", "explain": "Áp dụng công thức: $g = (424 - 400)/400 \\times 100\\% = 6\\%$.", "points": 0.5, "answer": "6"}, {"type": "short", "level": "VDC", "q": "Quốc gia X tăng trưởng GDP 9%/năm nhưng HDI chỉ 0,55, khoảng cách giàu nghèo lớn, môi trường ô nhiễm. Theo bài học, quốc gia X đang trong tình trạng: tăng trưởng mà chưa ... (điền 1 từ).", "explain": "Tăng trưởng cao nhưng HDI thấp, bất bình đẳng và ô nhiễm cho thấy quốc gia X tăng trưởng mà chưa phát triển.", "points": 0.5, "answer": "phát triển"}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "GDP bình quân đầu người được tính bằng cách", "explain": "GDP bình quân đầu người = GDP / dân số, phản ánh mức sống trung bình, là chỉ tiêu của phát triển kinh tế.", "points": 0.25, "options": ["A. lấy GDP chia cho dân số.", "B. lấy GNP trừ đi GDP.", "C. lấy GDP nhân với tốc độ tăng trưởng.", "D. lấy tổng thu nhập chia cho số hộ gia đình."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Điểm khác biệt cơ bản giữa tăng trưởng kinh tế và phát triển kinh tế là", "explain": "Tăng trưởng là thay đổi về lượng (quy mô sản lượng); phát triển là thay đổi về chất (toàn diện, bền vững).", "points": 0.25, "options": ["A. tăng trưởng phản ánh thay đổi về lượng, phát triển phản ánh thay đổi về chất.", "B. tăng trưởng chỉ diễn ra ở nước phát triển, phát triển chỉ diễn ra ở nước đang phát triển.", "C. tăng trưởng đo bằng HDI, phát triển đo bằng GDP.", "D. hai khái niệm này hoàn toàn đồng nhất với nhau."], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Chỉ số HDI càng gần 1 thì", "explain": "HDI đo mức độ phát triển con người qua tuổi thọ, giáo dục và thu nhập; càng gần 1 càng phát triển.", "points": 0.25, "options": ["A. tốc độ tăng trưởng GDP càng cao.", "B. trình độ phát triển con người càng cao.", "C. dân số càng đông.", "D. lạm phát càng thấp."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Vì sao nói tăng trưởng kinh tế là tiền đề vật chất cho phát triển kinh tế?", "explain": "Không có tăng trưởng thì không có nguồn lực vật chất để đầu tư cho các mục tiêu phát triển.", "points": 0.25, "options": ["A. Vì tăng trưởng tạo ra nguồn lực để đầu tư cho giáo dục, y tế, an sinh xã hội, bảo vệ môi trường.", "B. Vì tăng trưởng tự động xoá bỏ mọi bất bình đẳng xã hội.", "C. Vì chỉ cần tăng trưởng thì môi trường tự được cải thiện.", "D. Vì tăng trưởng làm giảm nhu cầu chi tiêu của Nhà nước."], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Chuyển dịch cơ cấu kinh tế theo hướng hiện đại được biểu hiện ở", "explain": "Cơ cấu kinh tế hiện đại: tỉ trọng nông nghiệp giảm dần, công nghiệp và dịch vụ chiếm tỉ trọng ngày càng lớn.", "points": 0.25, "options": ["A. tỉ trọng nông nghiệp tăng, công nghiệp và dịch vụ giảm.", "B. tỉ trọng nông nghiệp giảm, công nghiệp và dịch vụ tăng.", "C. chỉ phát triển nông nghiệp.", "D. giữ nguyên cơ cấu các ngành như cũ."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Tốc độ tăng trưởng GDP bình quân của Việt Nam giai đoạn 2016-2019 đạt khoảng", "explain": "Giai đoạn 2016-2019, Việt Nam tăng trưởng GDP bình quân khoảng 6,8%/năm, thuộc nhóm cao nhất khu vực.", "points": 0.25, "options": ["A. 3,5%/năm.", "B. 6,8%/năm.", "C. 10%/năm.", "D. 12%/năm."], "answer": "B"}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau về phát triển kinh tế:", "explain": "a) Đúng: định nghĩa phát triển kinh tế. b) Sai: GDP bình quân đầu người là chỉ tiêu phát triển. c) Đúng. d) Sai: tỉ trọng nông nghiệp giảm dần.", "points": 1, "statements": ["a) Phát triển kinh tế bao gồm tăng trưởng kinh tế gắn với tiến bộ, công bằng xã hội và bảo vệ môi trường.", "b) GDP bình quân đầu người là chỉ tiêu đo lường tăng trưởng kinh tế.", "c) HDI của Việt Nam năm 2022 đạt 0,726, thuộc nhóm phát triển con người cao.", "d) Cơ cấu kinh tế hiện đại có tỉ trọng nông nghiệp ngày càng tăng."], "answer": ["T", "F", "T", "F"]}, {"type": "truefalse", "level": "VDC", "q": "Tình huống: Tỉnh P thu hút nhiều khu công nghiệp, GDP tăng nhanh nhưng sông bị ô nhiễm, người dân mất đất sản xuất mà thu nhập không tăng. Xét tính đúng, sai:", "explain": "a) Đúng: GDP tăng nhanh là tăng trưởng. b) Sai: ô nhiễm, đời sống không cải thiện nên chưa phát triển. c) Đúng: bài học phát triển bền vững. d) Sai: tăng trưởng không tự động dẫn tới phát triển.", "points": 1, "statements": ["a) Tỉnh P đang có tăng trưởng kinh tế.", "b) Tỉnh P đang phát triển kinh tế bền vững.", "c) Để phát triển, tỉnh P cần gắn tăng trưởng với bảo vệ môi trường và nâng cao đời sống người dân.", "d) Tăng trưởng kinh tế của tỉnh P đã tự động mang lại phát triển."], "answer": ["T", "F", "T", "F"]}, {"type": "short", "level": "VDC", "q": "GDP năm 2021 của nước Y là 500 tỉ USD, năm 2022 là 530 tỉ USD. Tốc độ tăng trưởng kinh tế năm 2022 của nước Y là bao nhiêu phần trăm?", "explain": "$g = (530 - 500)/500 \\times 100\\% = 6\\%$.", "points": 0.5, "answer": "6"}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Phát triển kinh tế là quá trình biến đổi sâu sắc, ... về kinh tế, văn hoá, xã hội và môi trường.", "explain": "Khái niệm SGK: phát triển kinh tế là quá trình biến đổi sâu sắc, toàn diện về kinh tế, văn hoá, xã hội và môi trường.", "points": 0.5, "answer": "toàn diện"}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Tổng sản phẩm quốc nội (GDP) là", "explain": "Định nghĩa GDP: tổng giá trị thị trường của hàng hoá, dịch vụ cuối cùng sản xuất trong phạm vi lãnh thổ quốc gia trong một thời kì.", "points": 0.25, "options": ["A. tổng giá trị thị trường của hàng hoá và dịch vụ cuối cùng được sản xuất trong phạm vi lãnh thổ một quốc gia trong một thời kì nhất định.", "B. tổng thu nhập của công dân một nước đang làm việc ở nước ngoài.", "C. tổng giá trị xuất khẩu trừ đi nhập khẩu.", "D. tổng tiền lương của người lao động trong một năm."], "answer": "A"}, {"type": "mcq", "level": "TH", "q": "Phát triển kinh tế khác tăng trưởng kinh tế ở chỗ phát triển kinh tế", "explain": "Phát triển kinh tế là tăng trưởng gắn với tiến bộ, công bằng xã hội và bền vững môi trường.", "points": 0.25, "options": ["A. chỉ quan tâm đến tốc độ tăng GDP.", "B. gắn tăng trưởng với tiến bộ xã hội, công bằng và bảo vệ môi trường.", "C. không cần đến tăng trưởng kinh tế.", "D. chỉ diễn ra trong lĩnh vực nông nghiệp."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Tỉ lệ hộ nghèo của Việt Nam giảm mạnh từ 1993 đến nay cho thấy vai trò nào của tăng trưởng và phát triển kinh tế?", "explain": "Giảm nghèo là minh chứng cho vai trò tạo việc làm, tăng thu nhập của tăng trưởng và phát triển kinh tế.", "points": 0.25, "options": ["A. Tăng nguồn thu ngân sách nhà nước.", "B. Tạo việc làm, tăng thu nhập, góp phần xoá đói giảm nghèo.", "C. Nâng cao vị thế quốc tế.", "D. Bảo vệ môi trường tự nhiên."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Theo quan điểm của bài học, quốc gia nào phát triển tốt hơn?", "explain": "Phát triển đánh giá bằng chất lượng cuộc sống (HDI, môi trường, giảm nghèo) chứ không chỉ tốc độ tăng GDP.", "points": 0.25, "options": ["A. Nước A: GDP tăng 9%/năm, HDI 0,55, ô nhiễm nặng.", "B. Nước B: GDP tăng 5%/năm, HDI 0,85, môi trường trong lành.", "C. Nước C: GDP tăng 10%/năm, tỉ lệ hộ nghèo tăng thêm.", "D. Nước D: GDP không tăng, HDI giảm dần."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "GDP bình quân đầu người của Việt Nam năm 2023 đạt khoảng", "explain": "GDP bình quân đầu người của Việt Nam năm 2023 đạt khoảng 4.300 USD.", "points": 0.25, "options": ["A. 1.500 USD.", "B. 2.800 USD.", "C. 4.300 USD.", "D. 10.000 USD."], "answer": "C"}, {"type": "mcq", "level": "VD", "q": "Ý nào sau đây thể hiện vai trò của tăng trưởng và phát triển kinh tế đối với quốc phòng, an ninh?", "explain": "Tăng trưởng tạo nguồn lực vật chất cho Nhà nước đầu tư phát triển, trong đó có củng cố quốc phòng, an ninh.", "points": 0.25, "options": ["A. Tăng trưởng tạo nguồn lực vật chất để củng cố quốc phòng, an ninh.", "B. Tăng trưởng làm giảm chi tiêu quốc phòng.", "C. Phát triển kinh tế không liên quan đến quốc phòng.", "D. Chỉ nước giàu mới cần quốc phòng."], "answer": "A"}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về bản chất tăng trưởng và phát triển:", "explain": "a) Đúng. b) Sai: tăng trưởng âm nghĩa là suy giảm, không phải tăng trưởng. c) Đúng: phát triển bao gồm tăng trưởng gắn với tiến bộ xã hội. d) Đúng.", "points": 1, "statements": ["a) Tăng trưởng kinh tế chỉ phản ánh sự thay đổi về lượng của nền kinh tế.", "b) Một nền kinh tế có tốc độ tăng trưởng GDP âm vẫn có thể được coi là đang tăng trưởng.", "c) Phát triển kinh tế bao hàm cả tăng trưởng kinh tế.", "d) Bảo vệ môi trường là một nội dung của phát triển kinh tế bền vững."], "answer": ["T", "F", "T", "T"]}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về HDI:", "explain": "a), b) Đúng. c) Sai: HDI đo phát triển con người. d) Sai: HDI còn phụ thuộc tuổi thọ và giáo dục.", "points": 1, "statements": ["a) HDI tổng hợp tuổi thọ bình quân, trình độ giáo dục và thu nhập bình quân đầu người.", "b) HDI càng gần 1 thì trình độ phát triển con người càng cao.", "c) HDI là chỉ tiêu đo lường tốc độ tăng trưởng GDP.", "d) Hai quốc gia có GDP bằng nhau thì chắc chắn có HDI bằng nhau."], "answer": ["T", "T", "F", "F"]}, {"type": "short", "level": "NB", "q": "Một quốc gia có GDP năm 2020 là 200 tỉ USD và tốc độ tăng trưởng năm 2021 là 5%. GDP năm 2021 của quốc gia đó là bao nhiêu tỉ USD?", "explain": "GDP 2021 = 200 + 200 x 5% = 200 x 1,05 = 210 tỉ USD.", "points": 0.5, "answer": "210"}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: Tăng trưởng kinh tế phản ánh sự thay đổi về ... của nền kinh tế.", "explain": "Tăng trưởng kinh tế phản ánh sự thay đổi về lượng (quy mô sản lượng); phát triển kinh tế phản ánh sự thay đổi về chất.", "points": 0.5, "answer": "lượng"}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "TH", "q": "Tốc độ tăng trưởng GDP thực tế của Việt Nam năm 2023 là", "explain": "Tốc độ tăng trưởng GDP thực tế của Việt Nam năm 2023 là 5,05%; năm 2022 là 8,02%.", "points": 0.25, "options": ["A. 8,02%.", "B. 5,05%.", "C. 2,91%.", "D. 6,8%."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Khái niệm nào sau đây chỉ sự thay đổi về chất của nền kinh tế?", "explain": "Phát triển kinh tế phản ánh sự thay đổi về chất: toàn diện về kinh tế, văn hoá, xã hội, môi trường.", "points": 0.25, "options": ["A. Tăng trưởng kinh tế.", "B. Phát triển kinh tế.", "C. Lạm phát.", "D. Suy thoái kinh tế."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Chỉ tiêu nào sau đây thuộc nhóm chỉ tiêu đo lường phát triển kinh tế?", "explain": "Tỉ lệ hộ nghèo và HDI là các chỉ tiêu về chất lượng cuộc sống, thuộc nhóm chỉ tiêu phát triển kinh tế.", "points": 0.25, "options": ["A. Tốc độ tăng trưởng GDP.", "B. Tỉ lệ hộ nghèo và chỉ số HDI.", "C. Tổng kim ngạch xuất khẩu.", "D. Tỉ giá hối đoái."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Doanh nghiệp X mở rộng sản xuất, tạo thêm 500 việc làm cho lao động địa phương, đồng thời đầu tư hệ thống xử lí nước thải đạt chuẩn. Việc làm của doanh nghiệp X góp phần", "explain": "Mở rộng sản xuất tạo việc làm góp phần tăng trưởng; xử lí nước thải đạt chuẩn góp phần phát triển bền vững.", "points": 0.25, "options": ["A. chỉ tăng trưởng kinh tế.", "B. vừa tăng trưởng vừa phát triển kinh tế bền vững.", "C. chỉ bảo vệ môi trường.", "D. làm giảm tăng trưởng kinh tế."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Vì sao một quốc gia không nên chạy theo tốc độ tăng trưởng GDP bằng mọi giá?", "explain": "Chạy theo tăng trưởng bằng mọi giá có thể gây ô nhiễm, bất bình đẳng, cạn kiệt tài nguyên — tăng trưởng mà không phát triển.", "points": 0.25, "options": ["A. Vì tăng trưởng cao luôn gây lạm phát.", "B. Vì tăng trưởng bằng mọi giá có thể đánh đổi môi trường, công bằng xã hội và không mang lại phát triển thực chất.", "C. Vì GDP không đo được gì.", "D. Vì tăng trưởng cao làm dân số giảm."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Nhận định nào sau đây đúng về mối quan hệ giữa tăng trưởng và phát triển kinh tế?", "explain": "Tăng trưởng là tiền đề vật chất, phát triển là mục tiêu; phát triển tốt (nhân lực, ổn định xã hội) lại thúc đẩy tăng trưởng bền vững.", "points": 0.25, "options": ["A. Tăng trưởng kinh tế tự động bảo đảm phát triển bền vững.", "B. Phát triển kinh tế là mục tiêu, tăng trưởng kinh tế là tiền đề vật chất; hai quá trình tác động qua lại.", "C. Phát triển kinh tế không cần tăng trưởng kinh tế.", "D. Tăng trưởng và phát triển là hai quá trình hoàn toàn độc lập."], "answer": "B"}, {"type": "truefalse", "level": "VDC", "q": "Xét tính đúng, sai của các khẳng định sau về GDP và GNP:", "explain": "a), b) Đúng theo định nghĩa. c) Sai: chênh lệch do thu nhập từ nước ngoài và thu nhập chuyển ra nước ngoài. d) Đúng: FDI lớn nên GDP lớn hơn GNP.", "points": 1, "statements": ["a) GNP tính giá trị do công dân tạo ra cả trong và ngoài nước.", "b) GDP chỉ tính giá trị sản xuất trong phạm vi lãnh thổ quốc gia.", "c) GDP và GNP của một quốc gia luôn bằng nhau.", "d) Đối với Việt Nam, GDP thường lớn hơn GNP do có vốn đầu tư nước ngoài."], "answer": ["T", "T", "F", "T"]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về vai trò của tăng trưởng và phát triển kinh tế:", "explain": "a), b), c) Đúng: các vai trò cơ bản. d) Sai: phát triển tạo điều kiện hội nhập sâu rộng hơn, không làm giảm nhu cầu hội nhập.", "points": 1, "statements": ["a) Tạo việc làm, tăng thu nhập cho người lao động.", "b) Tăng nguồn thu ngân sách nhà nước.", "c) Nâng cao vị thế và uy tín của đất nước trên trường quốc tế.", "d) Làm giảm nhu cầu hội nhập kinh tế quốc tế."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "NB", "q": "GDP năm 2019 của nước Z là 300 tỉ USD, năm 2020 là 291 tỉ USD. Tốc độ tăng trưởng kinh tế năm 2020 của nước Z là bao nhiêu phần trăm?", "explain": "$g = (291 - 300)/300 \\times 100\\% = -3\\%$: nền kinh tế suy giảm 3%.", "points": 0.5, "answer": "-3"}, {"type": "short", "level": "NB", "q": "Điền từ còn thiếu: ... kinh tế là tiền đề, điều kiện vật chất cho phát triển kinh tế.", "explain": "Tăng trưởng kinh tế là tiền đề, điều kiện vật chất cho phát triển kinh tế; phát triển kinh tế là mục tiêu của tăng trưởng.", "points": 0.5, "answer": "Tăng trưởng"}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "TH", "q": "Nội dung nào sau đây thuộc về phát triển kinh tế mà tăng trưởng kinh tế đơn thuần chưa bao hàm?", "explain": "Giảm nghèo và bảo vệ môi trường là các nội dung về chất, thuộc phát triển kinh tế chứ không chỉ tăng trưởng.", "points": 0.25, "options": ["A. Quy mô GDP tăng lên.", "B. Tốc độ tăng trưởng GDP cao.", "C. Giảm tỉ lệ hộ nghèo và bảo vệ môi trường.", "D. Kim ngạch xuất khẩu tăng."], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "HDI của Việt Nam năm 2022 đạt 0,726 cho thấy Việt Nam thuộc nhóm", "explain": "HDI 0,726 đưa Việt Nam vào nhóm phát triển con người cao.", "points": 0.25, "options": ["A. phát triển con người rất cao.", "B. phát triển con người cao.", "C. phát triển con người trung bình.", "D. phát triển con người thấp."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Tăng trưởng kinh tế được coi là bền vững khi", "explain": "Tăng trưởng bền vững là tăng trưởng gắn với tiến bộ xã hội và bảo vệ môi trường, bảo đảm cho cả thế hệ tương lai.", "points": 0.25, "options": ["A. tốc độ tăng GDP thật cao trong một năm.", "B. tăng trưởng gắn với tiến bộ xã hội, bảo vệ môi trường và sử dụng hiệu quả tài nguyên.", "C. chỉ tập trung khai thác tài nguyên thiên nhiên.", "D. tăng trưởng không cần quan tâm đến đời sống người dân."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Gia đình anh H mở xưởng sản xuất, tạo việc làm cho 20 lao động địa phương, nộp thuế đầy đủ và không xả thải ra môi trường. Việc làm của gia đình anh H", "explain": "Tạo việc làm, nộp thuế góp phần tăng trưởng; không xả thải góp phần phát triển bền vững.", "points": 0.25, "options": ["A. chỉ có ý nghĩa với gia đình anh H.", "B. góp phần vào tăng trưởng và phát triển kinh tế của địa phương.", "C. làm giảm tăng trưởng kinh tế.", "D. vi phạm pháp luật về môi trường."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Chỉ tiêu nào phản ánh trực tiếp mức sống trung bình của người dân?", "explain": "GDP bình quân đầu người = GDP/dân số, phản ánh trực tiếp mức sống trung bình.", "points": 0.25, "options": ["A. Tổng GDP.", "B. GDP bình quân đầu người.", "C. Tốc độ tăng trưởng.", "D. Tổng vốn đầu tư."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Trong 3 tiêu chí của HDI, tiêu chí nào phản ánh thành tựu giáo dục?", "explain": "Trình độ giáo dục trong HDI được đo bằng số năm đi học bình quân của người trưởng thành và số năm đi học kì vọng của trẻ em.", "points": 0.25, "options": ["A. Tuổi thọ bình quân.", "B. Số năm đi học bình quân và số năm đi học kì vọng.", "C. Thu nhập bình quân đầu người.", "D. Tỉ lệ hộ nghèo."], "answer": "B"}, {"type": "truefalse", "level": "NB", "q": "Cho số liệu: GDP nước M năm 2021 là 800 tỉ USD, năm 2022 là 840 tỉ USD; tỉ lệ hộ nghèo giảm từ 12% xuống 9%. Xét tính đúng, sai:", "explain": "a) Đúng: $(840-800)/800 = 5\\%$. b) Đúng: GDP tăng và nghèo giảm. c) Sai: giảm nghèo là chỉ tiêu phát triển. d) Đúng: phát triển đòi hỏi bền vững môi trường.", "points": 1, "statements": ["a) Tốc độ tăng trưởng kinh tế năm 2022 của nước M là 5%.", "b) Nước M vừa có tăng trưởng vừa có bước tiến về phát triển.", "c) Giảm tỉ lệ hộ nghèo là chỉ tiêu của tăng trưởng kinh tế.", "d) Nếu ô nhiễm môi trường gia tăng thì thành tựu phát triển của nước M chưa bền vững."], "answer": ["T", "T", "F", "T"]}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về cơ cấu kinh tế và vai trò con người:", "explain": "a) Đúng. b) Sai: tăng trưởng là tiền đề vật chất không thể thiếu. c) Đúng. d) Đúng.", "points": 1, "statements": ["a) Phát triển kinh tế bao gồm cả sự chuyển dịch cơ cấu kinh tế theo hướng hiện đại.", "b) Một quốc gia có thể phát triển mà hoàn toàn không cần tăng trưởng kinh tế.", "c) Tăng trưởng kinh tế tạo nguồn lực cho đầu tư vào giáo dục và y tế.", "d) Mục tiêu cuối cùng của tăng trưởng là phát triển bền vững, nâng cao chất lượng cuộc sống."], "answer": ["T", "F", "T", "T"]}, {"type": "short", "level": "NB", "q": "Nước Q có GDP năm 2022 là 1.000 tỉ USD, tốc độ tăng trưởng năm 2023 là 4%. GDP năm 2023 của nước Q là bao nhiêu tỉ USD?", "explain": "GDP 2023 = 1.000 x (1 + 4%) = 1.040 tỉ USD.", "points": 0.5, "answer": "1040"}, {"type": "short", "level": "TH", "q": "Điền cụm từ còn thiếu: Tăng trưởng kinh tế là ... vật chất cho phát triển kinh tế.", "explain": "Tăng trưởng kinh tế là tiền đề, điều kiện vật chất cho phát triển kinh tế.", "points": 0.5, "answer": "tiền đề"}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "TH", "q": "Điểm giống nhau giữa tăng trưởng kinh tế và phát triển kinh tế là", "explain": "Cả hai đều phản ánh sự vận động, phát triển đi lên của nền kinh tế; khác nhau ở chỗ tăng trưởng nhấn mạnh về lượng, phát triển nhấn mạnh về chất.", "points": 0.25, "options": ["A. đều phản ánh sự vận động đi lên của nền kinh tế.", "B. đều chỉ đo bằng GDP.", "C. đều không liên quan đến đời sống người dân.", "D. đều chỉ diễn ra trong ngắn hạn."], "answer": "A"}, {"type": "mcq", "level": "VD", "q": "Khi nói về Việt Nam, thành tựu nào sau đây minh chứng cho phát triển kinh tế chứ không chỉ tăng trưởng?", "explain": "Giảm nghèo và HDI cao là các chỉ tiêu về chất lượng cuộc sống, thuộc phát triển kinh tế.", "points": 0.25, "options": ["A. GDP tăng 8,02% năm 2022.", "B. Tỉ lệ hộ nghèo giảm xuống dưới 3% và HDI đạt 0,726.", "C. Kim ngạch xuất khẩu tăng.", "D. Số doanh nghiệp thành lập mới tăng."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Một địa phương khai thác khoáng sản ồ ạt, GDP tăng vọt nhưng rừng bị tàn phá, nguồn nước ô nhiễm. Đây là ví dụ về", "explain": "GDP tăng vọt nhưng tài nguyên cạn kiệt, môi trường hủy hoại là tăng trưởng thiếu bền vững, chưa phải phát triển.", "points": 0.25, "options": ["A. phát triển bền vững.", "B. tăng trưởng nóng thiếu bền vững, chưa gắn với phát triển.", "C. suy thoái kinh tế.", "D. chuyển dịch cơ cấu kinh tế."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Để tăng trưởng kinh tế thực sự dẫn tới phát triển, Nhà nước cần", "explain": "Nhà nước cần định hướng tăng trưởng gắn với tiến bộ, công bằng xã hội và bền vững môi trường thì tăng trưởng mới dẫn tới phát triển.", "points": 0.25, "options": ["A. chỉ tập trung tăng GDP bằng mọi giá.", "B. gắn tăng trưởng với chính sách giảm nghèo, an sinh xã hội và bảo vệ môi trường.", "C. hạn chế đầu tư cho giáo dục, y tế.", "D. bỏ qua vấn đề phân hoá giàu nghèo."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Thu nhập bình quân đầu người trong HDI phản ánh", "explain": "Thu nhập bình quân đầu người (GNI bình quân đầu người) phản ánh mức sống vật chất trong HDI.", "points": 0.25, "options": ["A. mức sống vật chất trung bình của người dân.", "B. tốc độ tăng trưởng GDP.", "C. trình độ giáo dục.", "D. tuổi thọ bình quân."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Ý nào sau đây KHÔNG phải là vai trò của tăng trưởng và phát triển kinh tế?", "explain": "Tăng trưởng, phát triển kinh tế không tự động xoá bỏ tệ nạn xã hội; cần thêm các chính sách xã hội, pháp luật.", "points": 0.25, "options": ["A. Tạo việc làm, tăng thu nhập.", "B. Tăng nguồn thu ngân sách.", "C. Tự động xoá bỏ mọi tệ nạn xã hội.", "D. Nâng cao đời sống vật chất, tinh thần của nhân dân."], "answer": "C"}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về điều kiện phát triển bền vững:", "explain": "a) Đúng: cần thêm tiến bộ xã hội, bền vững. b) Sai: phát triển rộng hơn tăng trưởng. c), d) Đúng.", "points": 1, "statements": ["a) Tăng trưởng kinh tế là điều kiện cần nhưng chưa đủ cho phát triển kinh tế.", "b) Phát triển kinh tế đồng nghĩa với tăng trưởng kinh tế.", "c) Bảo vệ môi trường là yêu cầu của phát triển bền vững.", "d) Chất lượng cuộc sống của người dân là thước đo quan trọng của phát triển kinh tế."], "answer": ["T", "F", "T", "T"]}, {"type": "truefalse", "level": "NB", "q": "Tình huống: Hai xã A và B có GDP bình quân đầu người bằng nhau. Xã A có trường học, trạm y tế khang trang, môi trường sạch; xã B thiếu trường lớp, rác thải bừa bãi. Xét tính đúng, sai:", "explain": "a) Đúng: GDP/người bằng nhau. b) Đúng: xã A có giáo dục, y tế, môi trường tốt hơn. c) Sai: GDP/người chưa phản ánh đầy đủ. d) Đúng.", "points": 1, "statements": ["a) Hai xã có mức tăng trưởng kinh tế như nhau.", "b) Xã A phát triển tốt hơn xã B.", "c) GDP bình quân đầu người phản ánh đầy đủ chất lượng cuộc sống.", "d) Để đánh giá phát triển cần thêm các chỉ tiêu xã hội và môi trường."], "answer": ["T", "T", "F", "T"]}, {"type": "short", "level": "TH", "q": "Điền từ còn thiếu: Phát triển kinh tế là mục ... của tăng trưởng kinh tế.", "explain": "Phát triển kinh tế là mục tiêu của tăng trưởng kinh tế; tăng trưởng là tiền đề vật chất.", "points": 0.5, "answer": "tiêu"}, {"type": "short", "level": "TH", "q": "Nước R có GDP năm 2020 là 150 tỉ USD, năm 2021 là 162 tỉ USD, năm 2022 là 170,1 tỉ USD. Tốc độ tăng trưởng năm 2022 của nước R là bao nhiêu phần trăm?", "explain": "$g = (170,1 - 162)/162 \\times 100\\% = 5\\%$.", "points": 0.5, "answer": "5"}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "VD", "q": "GDP thực tế khác GDP danh nghĩa ở chỗ GDP thực tế", "explain": "GDP thực tế tính theo giá cố định của năm gốc, loại trừ ảnh hưởng của lạm phát nên phản ánh đúng quy mô sản lượng.", "points": 0.25, "options": ["A. tính theo giá hiện hành.", "B. đã loại trừ ảnh hưởng của biến động giá (lạm phát).", "C. luôn lớn hơn GDP danh nghĩa.", "D. không tính dịch vụ."], "answer": "B"}, {"type": "mcq", "level": "VD", "q": "Khi lạm phát cao, tốc độ tăng trưởng GDP danh nghĩa so với GDP thực tế thường", "explain": "Lạm phát làm giá cả tăng nên GDP danh nghĩa (tính theo giá hiện hành) tăng cao hơn mức tăng sản lượng thực tế.", "points": 0.25, "options": ["A. thấp hơn.", "B. cao hơn.", "C. bằng nhau.", "D. không liên quan."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Một quốc gia muốn đánh giá đúng sự thay đổi quy mô sản lượng của nền kinh tế nên dùng", "explain": "GDP thực tế loại trừ biến động giá nên phản ánh đúng sự thay đổi quy mô sản lượng.", "points": 0.25, "options": ["A. GDP danh nghĩa.", "B. GDP thực tế.", "C. tổng kim ngạch xuất khẩu.", "D. dự trữ ngoại hối."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Tình huống: Năm 2024, GDP danh nghĩa của nước S tăng 12% nhưng lạm phát là 7%. Có thể nhận định", "explain": "Tăng trưởng thực tế xấp xỉ tăng trưởng danh nghĩa trừ lạm phát: 12% - 7% = 5%.", "points": 0.25, "options": ["A. sản lượng thực tế tăng khoảng 5%.", "B. sản lượng thực tế tăng 12%.", "C. nền kinh tế suy thoái.", "D. không thể nhận định gì."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Chỉ số nào sau đây giúp so sánh mức sống giữa các quốc gia một cách đầy đủ nhất?", "explain": "HDI tổng hợp tuổi thọ, giáo dục và thu nhập nên phản ánh mức sống, chất lượng cuộc sống đầy đủ hơn GDP đơn thuần.", "points": 0.25, "options": ["A. Tổng GDP.", "B. HDI.", "C. Tốc độ tăng trưởng.", "D. Dân số."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Việt Nam đặt mục tiêu trở thành nước phát triển có thu nhập cao vào năm 2045. Mục tiêu này thể hiện", "explain": "Mục tiêu đến 2045 là phát triển toàn diện: kinh tế gắn với tiến bộ xã hội, bảo vệ môi trường, nâng cao chất lượng cuộc sống.", "points": 0.25, "options": ["A. chỉ theo đuổi tăng trưởng GDP.", "B. khát vọng phát triển toàn diện, bền vững của đất nước.", "C. không cần quan tâm đến môi trường.", "D. chỉ phát triển kinh tế mà bỏ qua xã hội."], "answer": "B"}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về GDP thực tế và GDP danh nghĩa:", "explain": "a), b), c) Đúng. d) Sai: GDP danh nghĩa tăng có thể do lạm phát, chưa chắc đời sống cải thiện.", "points": 1, "statements": ["a) GDP thực tế phản ánh đúng hơn sự thay đổi quy mô sản lượng so với GDP danh nghĩa.", "b) Khi không có lạm phát, GDP danh nghĩa bằng GDP thực tế.", "c) Tốc độ tăng trưởng kinh tế trong SGK thường tính theo GDP thực tế.", "d) GDP danh nghĩa tăng cao luôn đồng nghĩa với đời sống người dân được cải thiện."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về phát triển bền vững trong kinh tế:", "explain": "a) Đúng: định nghĩa phát triển bền vững. b) Sai: cạn kiệt tài nguyên là thiếu bền vững. c) Đúng. d) Sai: vẫn cần tăng trưởng làm nền tảng.", "points": 1, "statements": ["a) Phát triển bền vững là phát triển đáp ứng nhu cầu hiện tại mà không làm tổn hại khả năng đáp ứng nhu cầu của thế hệ tương lai.", "b) Khai thác cạn kiệt tài nguyên để tăng GDP là phát triển bền vững.", "c) Tăng trưởng xanh, kinh tế tuần hoàn là hướng đi của phát triển bền vững.", "d) Phát triển bền vững chỉ quan tâm đến môi trường, không cần tăng trưởng kinh tế."], "answer": ["T", "F", "T", "F"]}, {"type": "short", "level": "TH", "q": "GDP danh nghĩa của nước T tăng 10%, lạm phát 4%. Tốc độ tăng trưởng GDP thực tế xấp xỉ bao nhiêu phần trăm?", "explain": "Tăng trưởng thực tế xấp xỉ tăng trưởng danh nghĩa trừ lạm phát: 10% - 4% = 6%.", "points": 0.5, "answer": "6"}, {"type": "short", "level": "TH", "q": "Điền cụm từ còn thiếu: Phát triển ... là sự phát triển đáp ứng nhu cầu của hiện tại mà không làm tổn hại khả năng đáp ứng nhu cầu của các thế hệ tương lai.", "explain": "Định nghĩa phát triển bền vững: đáp ứng nhu cầu hiện tại mà không tổn hại khả năng của thế hệ tương lai.", "points": 0.5, "answer": "bền vững"}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "VD", "q": "Trong các nhân tố thúc đẩy tăng trưởng kinh tế, nhân tố nào được coi là quan trọng nhất trong dài hạn?", "explain": "Trong dài hạn, vốn, nguồn nhân lực chất lượng cao và khoa học công nghệ là động lực then chốt của tăng trưởng bền vững.", "points": 0.25, "options": ["A. Tài nguyên thiên nhiên.", "B. Vốn và nguồn nhân lực chất lượng cao, khoa học công nghệ.", "C. Dân số đông.", "D. Viện trợ nước ngoài."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Việt Nam có tốc độ tăng trưởng cao trong giai đoạn 2016-2019 nhờ chủ yếu vào", "explain": "Động lực tăng trưởng của Việt Nam là hội nhập, FDI, xuất khẩu và cải cách thể chế kinh tế.", "points": 0.25, "options": ["A. khai thác tài nguyên.", "B. hội nhập kinh tế quốc tế, thu hút đầu tư, cải cách thể chế.", "C. viện trợ không hoàn lại.", "D. tăng dân số."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Để chuyển từ tăng trưởng theo chiều rộng sang tăng trưởng theo chiều sâu, Việt Nam cần", "explain": "Tăng trưởng theo chiều sâu dựa vào năng suất, chất lượng, hiệu quả, khoa học công nghệ thay vì tăng thêm đầu vào.", "points": 0.25, "options": ["A. tăng khai thác tài nguyên.", "B. nâng cao năng suất, chất lượng, hiệu quả dựa trên khoa học công nghệ và đổi mới sáng tạo.", "C. tăng số lượng lao động phổ thông.", "D. mở rộng diện tích canh tác."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Tình huống: Công ty K đầu tư dây chuyền công nghệ mới, năng suất lao động tăng 30% mà không tăng số công nhân. Đây là biểu hiện của", "explain": "Tăng năng suất nhờ công nghệ mà không tăng đầu vào lao động là tăng trưởng theo chiều sâu.", "points": 0.25, "options": ["A. tăng trưởng theo chiều rộng.", "B. tăng trưởng theo chiều sâu.", "C. suy thoái kinh tế.", "D. lạm phát."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Năng suất lao động của Việt Nam còn thấp so với khu vực cho thấy", "explain": "Năng suất thấp nghĩa là còn nhiều dư địa cải thiện hiệu quả, chuyển sang tăng trưởng theo chiều sâu.", "points": 0.25, "options": ["A. Việt Nam không cần tăng trưởng.", "B. dư địa để thúc đẩy tăng trưởng theo chiều sâu còn lớn.", "C. Việt Nam đã phát triển hoàn toàn.", "D. công nghệ không quan trọng."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Mục tiêu tổng quát của phát triển kinh tế Việt Nam hiện nay là", "explain": "Mục tiêu là phát triển nhanh và bền vững, nâng cao đời sống vật chất, tinh thần của nhân dân.", "points": 0.25, "options": ["A. tăng GDP bằng mọi giá.", "B. phát triển nhanh và bền vững, nâng cao chất lượng cuộc sống nhân dân.", "C. chỉ phát triển công nghiệp nặng.", "D. giảm hội nhập quốc tế."], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về tăng trưởng theo chiều rộng và chiều sâu:", "explain": "a), b), c) Đúng. d) Sai: cần chuyển sang tăng trưởng theo chiều sâu để bền vững.", "points": 1, "statements": ["a) Tăng trưởng theo chiều rộng dựa chủ yếu vào tăng thêm vốn, lao động, tài nguyên.", "b) Tăng trưởng theo chiều sâu dựa vào nâng cao năng suất, chất lượng, hiệu quả.", "c) Khoa học công nghệ là động lực quan trọng của tăng trưởng theo chiều sâu.", "d) Việt Nam nên duy trì mãi mô hình tăng trưởng theo chiều rộng."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về vai trò của con người trong phát triển kinh tế:", "explain": "a), b), c) Đúng: con người vừa là mục tiêu vừa là động lực. d) Sai.", "points": 1, "statements": ["a) Nguồn nhân lực chất lượng cao là động lực của tăng trưởng bền vững.", "b) Đầu tư cho giáo dục, đào tạo là đầu tư cho phát triển.", "c) Con người vừa là mục tiêu vừa là động lực của phát triển kinh tế.", "d) Phát triển kinh tế không cần quan tâm đến phát triển con người."], "answer": ["T", "T", "T", "F"]}, {"type": "short", "level": "TH", "q": "Điền cụm từ còn thiếu: Tăng trưởng dựa vào nâng cao năng suất, chất lượng, hiệu quả được gọi là tăng trưởng theo chiều ...", "explain": "Tăng trưởng theo chiều sâu dựa vào năng suất, chất lượng, hiệu quả, khoa học công nghệ.", "points": 0.5, "answer": "sâu"}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: Tăng trưởng dựa chủ yếu vào tăng thêm vốn, lao động, tài nguyên được gọi là tăng trưởng theo chiều ...", "explain": "Tăng trưởng theo chiều rộng dựa vào mở rộng các yếu tố đầu vào: vốn, lao động, tài nguyên.", "points": 0.5, "answer": "rộng"}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "VDC", "q": "Một nền kinh tế có tốc độ tăng trưởng GDP cao trong nhiều năm nhưng chỉ số HDI thấp, bất bình đẳng lớn. Chính sách ưu tiên đúng đắn là", "explain": "Cần chuyển từ chạy theo tốc độ sang phát triển bao trùm, bền vững: giảm nghèo, an sinh, môi trường.", "points": 0.25, "options": ["A. tiếp tục chỉ tập trung tăng GDP.", "B. chuyển hướng sang phát triển bao trùm: giảm nghèo, an sinh xã hội, bảo vệ môi trường.", "C. ngừng mọi hoạt động sản xuất.", "D. tăng thuế để giảm tăng trưởng."], "answer": "B"}, {"type": "mcq", "level": "VDC", "q": "Tình huống: Huyện M phát triển du lịch sinh thái, thu nhập người dân tăng, rừng được bảo vệ, văn hoá bản địa được giữ gìn. Mô hình này thể hiện", "explain": "Du lịch sinh thái vừa tăng thu nhập vừa bảo vệ rừng, giữ gìn văn hoá là mô hình phát triển bền vững.", "points": 0.25, "options": ["A. tăng trưởng bằng mọi giá.", "B. phát triển bền vững gắn tăng trưởng với bảo vệ môi trường và văn hoá.", "C. suy thoái kinh tế.", "D. không liên quan đến phát triển kinh tế."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Để đánh giá toàn diện trình độ phát triển của một quốc gia, cần kết hợp", "explain": "Đánh giá phát triển cần bộ chỉ tiêu tổng hợp: kinh tế, xã hội, môi trường.", "points": 0.25, "options": ["A. chỉ GDP.", "B. GDP với HDI, tỉ lệ hộ nghèo, chỉ tiêu môi trường và bất bình đẳng.", "C. chỉ dân số.", "D. chỉ kim ngạch xuất khẩu."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Trong bối cảnh biến đổi khí hậu, yêu cầu đặt ra cho tăng trưởng kinh tế Việt Nam là", "explain": "Việt Nam cam kết phát thải ròng bằng 0 vào 2050, đòi hỏi tăng trưởng xanh, giảm phát thải.", "points": 0.25, "options": ["A. tăng trưởng xanh, giảm phát thải, thích ứng với biến đổi khí hậu.", "B. tăng khai thác than đá.", "C. bỏ qua vấn đề môi trường.", "D. chỉ phát triển công nghiệp nặng."], "answer": "A"}, {"type": "mcq", "level": "NB", "q": "Việt Nam cam kết đạt phát thải ròng bằng 0 (Net Zero) vào năm nào?", "explain": "Tại COP26 (2021), Việt Nam cam kết đạt phát thải ròng bằng 0 vào năm 2050.", "points": 0.25, "options": ["A. 2030.", "B. 2040.", "C. 2050.", "D. 2060."], "answer": "C"}, {"type": "mcq", "level": "TH", "q": "Kinh tế tuần hoàn có đặc điểm là", "explain": "Kinh tế tuần hoàn: tái sử dụng, tái chế, giảm chất thải — khác với kinh tế tuyến tính khai thác rồi bỏ đi.", "points": 0.25, "options": ["A. khai thác, sản xuất, tiêu dùng rồi bỏ đi.", "B. thiết kế để tái sử dụng, tái chế, giảm chất thải, kéo dài vòng đời sản phẩm.", "C. chỉ sản xuất hàng dùng một lần.", "D. không cần tiết kiệm tài nguyên."], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về tăng trưởng xanh và Net Zero:", "explain": "a), b), c) Đúng. d) Sai: biến đổi khí hậu đe dọa trực tiếp tăng trưởng và đời sống.", "points": 1, "statements": ["a) Tăng trưởng xanh là tăng trưởng gắn với bảo vệ môi trường, sử dụng hiệu quả tài nguyên.", "b) Kinh tế tuần hoàn giúp giảm chất thải và tiết kiệm tài nguyên.", "c) Để đạt Net Zero 2050, Việt Nam cần chuyển dịch năng lượng sang năng lượng tái tạo.", "d) Biến đổi khí hậu không ảnh hưởng đến tăng trưởng và phát triển kinh tế."], "answer": ["T", "T", "T", "F"]}, {"type": "truefalse", "level": "TH", "q": "Tình huống: Nhà máy G xả thải chưa qua xử lí ra sông, lợi nhuận tăng nhưng người dân quanh vùng mắc bệnh, chi phí y tế tăng cao. Xét tính đúng, sai:", "explain": "a) Đúng. b) Sai: gây hại sức khoẻ, môi trường. c) Đúng: ngoại ứng tiêu cực. d) Đúng.", "points": 1, "statements": ["a) Nhà máy G đang có tăng trưởng (lợi nhuận tăng).", "b) Hoạt động của nhà máy G là phát triển bền vững.", "c) Chi phí y tế và môi trường là những tổn thất mà tăng trưởng đơn thuần chưa tính đến.", "d) Nhà máy G cần đầu tư xử lí chất thải để hài hoà lợi ích kinh tế và xã hội."], "answer": ["T", "F", "T", "T"]}, {"type": "short", "level": "VD", "q": "Việt Nam cam kết đạt phát thải ròng bằng 0 vào năm nào? (điền số năm)", "explain": "Cam kết tại COP26: Việt Nam đạt phát thải ròng bằng 0 (Net Zero) vào năm 2050.", "points": 0.5, "answer": "2050"}, {"type": "short", "level": "VD", "q": "Điền cụm từ còn thiếu: Mô hình kinh tế thiết kế để tái sử dụng, tái chế, giảm chất thải được gọi là kinh tế ...", "explain": "Kinh tế tuần hoàn: kéo dài vòng đời sản phẩm, tái sử dụng, tái chế, giảm chất thải.", "points": 0.5, "answer": "tuần hoàn"}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "VDC", "q": "Câu nói \"Tăng trưởng là phương tiện, phát triển con người là mục đích\" thể hiện quan điểm", "explain": "Tăng trưởng là phương tiện (tiền đề vật chất), mục đích cuối cùng là nâng cao chất lượng cuộc sống con người.", "points": 0.25, "options": ["A. coi nhẹ tăng trưởng kinh tế.", "B. tăng trưởng phục vụ mục tiêu nâng cao chất lượng cuộc sống con người.", "C. phát triển không cần tăng trưởng.", "D. chỉ cần phát triển văn hoá."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Một học sinh lớp 12 muốn góp phần vào phát triển kinh tế đất nước trong tương lai. Việc làm thiết thực nhất hiện nay là", "explain": "Nguồn nhân lực chất lượng cao là động lực phát triển; học tập tốt là đóng góp thiết thực nhất của học sinh.", "points": 0.25, "options": ["A. chỉ lo kiếm tiền.", "B. học tập tốt, rèn luyện kĩ năng, nâng cao trình độ để trở thành nguồn nhân lực chất lượng cao.", "C. không cần học.", "D. chờ Nhà nước lo."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Trong các giải pháp sau, giải pháp nào vừa thúc đẩy tăng trưởng vừa bảo đảm phát triển bền vững?", "explain": "Đầu tư cho KHCN, giáo dục, năng lượng sạch vừa tạo tăng trưởng theo chiều sâu vừa bảo đảm bền vững.", "points": 0.25, "options": ["A. Khai thác cạn kiệt tài nguyên để tăng GDP nhanh.", "B. Đầu tư cho khoa học công nghệ, giáo dục, năng lượng tái tạo và bảo vệ môi trường.", "C. Giảm đầu tư cho y tế, giáo dục.", "D. Tăng ô nhiễm để giảm chi phí sản xuất."], "answer": "B"}, {"type": "mcq", "level": "NB", "q": "Đánh giá nào sau đây đúng về thành tựu kinh tế Việt Nam sau Đổi mới (1986)?", "explain": "Sau Đổi mới, Việt Nam từ nước nghèo thành nước thu nhập trung bình, tăng trưởng cao, hội nhập sâu rộng.", "points": 0.25, "options": ["A. Không có thành tựu gì.", "B. Từ nước nghèo kém phát triển thành nước có thu nhập trung bình, hội nhập sâu rộng.", "C. Đã là nước phát triển.", "D. Kinh tế suy giảm liên tục."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Thách thức lớn nhất của Việt Nam trong phát triển kinh tế hiện nay là", "explain": "Việt Nam đối mặt bẫy thu nhập trung bình, năng suất lao động thấp, biến đổi khí hậu, già hoá dân số.", "points": 0.25, "options": ["A. thiếu tài nguyên.", "B. bẫy thu nhập trung bình, năng suất thấp, biến đổi khí hậu và già hoá dân số.", "C. dân số quá ít.", "D. không hội nhập quốc tế."], "answer": "B"}, {"type": "mcq", "level": "TH", "q": "Để vượt bẫy thu nhập trung bình, Việt Nam cần ưu tiên", "explain": "Vượt bẫy thu nhập trung bình đòi hỏi chuyển sang tăng trưởng theo chiều sâu: đổi mới sáng tạo, nhân lực chất lượng cao.", "points": 0.25, "options": ["A. tiếp tục dựa vào lao động giá rẻ.", "B. đổi mới sáng tạo, nâng cao năng suất, phát triển nguồn nhân lực chất lượng cao.", "C. đóng cửa hội nhập.", "D. tăng khai thác tài nguyên."], "answer": "B"}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp toàn bài về tăng trưởng, phát triển kinh tế):", "explain": "a) Đúng. b) Sai: HDI đo phát triển con người. c), d) Đúng.", "points": 1, "statements": ["a) Tăng trưởng kinh tế phản ánh thay đổi về lượng, phát triển kinh tế phản ánh thay đổi về chất.", "b) HDI là chỉ tiêu đo lường tốc độ tăng trưởng GDP.", "c) Tăng trưởng là tiền đề vật chất, phát triển là mục tiêu; tăng trưởng không tự động dẫn tới phát triển.", "d) Phát triển bền vững đòi hỏi hài hoà tăng trưởng kinh tế, tiến bộ xã hội và bảo vệ môi trường."], "answer": ["T", "F", "T", "T"]}, {"type": "truefalse", "level": "VD", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp toàn bài 2 về tăng trưởng, phát triển kinh tế):", "explain": "a), b) Đúng. c) Sai: có thể đánh đổi môi trường, công bằng xã hội. d) Đúng.", "points": 1, "statements": ["a) GDP bình quân đầu người phản ánh mức sống trung bình của người dân.", "b) Cơ cấu kinh tế hiện đại có tỉ trọng nông nghiệp giảm, công nghiệp và dịch vụ tăng.", "c) Chạy theo tăng trưởng GDP bằng mọi giá luôn mang lại phát triển bền vững.", "d) Nguồn nhân lực chất lượng cao vừa là mục tiêu vừa là động lực của phát triển."], "answer": ["T", "T", "F", "T"]}, {"type": "short", "level": "VD", "q": "Hoàn thành câu: Tăng trưởng kinh tế là sự gia tăng ... sản lượng của nền kinh tế trong một thời kì nhất định.", "explain": "Định nghĩa SGK: tăng trưởng kinh tế là sự gia tăng quy mô sản lượng của nền kinh tế trong một thời kì nhất định.", "points": 0.5, "answer": "quy mô"}, {"type": "short", "level": "VDC", "q": "GDP năm 2023 của nước V là 430 tỉ USD, dân số 100 triệu người. GDP bình quân đầu người của nước V là bao nhiêu USD?", "explain": "GDP bình quân đầu người = 430 tỉ / 100 triệu = 4.300 USD.", "points": 0.5, "answer": "4300"}]}]}
