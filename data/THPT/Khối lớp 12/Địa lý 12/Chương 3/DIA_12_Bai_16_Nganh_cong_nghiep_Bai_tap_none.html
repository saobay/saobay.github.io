vel": "VD", "q": "Chế biến 1 tấn tôm nguyên liệu cho giá trị 5000 USD; xuất tôm thô 3000 USD/tấn. Chênh lệch là bao nhiêu USD (chỉ ghi số)?", "options": ["A. 2000", "B. 5000", "C. 3000", "D. 8000"], "answer": "A", "explain": "5000 − 3000 = 2000 USD — giá trị gia tăng của chế biến sâu.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để nâng cao giá trị nông sản xuất khẩu, cần:", "options": ["A. Chế biến sâu, thương hiệu, tiêu chuẩn quốc tế", "B. Xuất thô", "C. Không cần chế biến", "D. Bán rẻ"], "answer": "A", "explain": "Chế biến sâu + thương hiệu + chứng nhận (HACCP, GlobalGAP) — giá cao, thị trường ổn định.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chế biến thực phẩm gắn với nguyên liệu nông, thủy sản.", "b) Đồng bằng sông Cửu Long mạnh về chế biến thủy sản.", "c) Chế biến sâu nâng giá trị.", "d) Nên xuất khẩu nông sản thô."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: xuất thô giá thấp, bấp bênh.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cần xây dựng thương hiệu nông sản.", "b) Tiêu chuẩn quốc tế giúp xuất khẩu.", "c) Nhà máy chế biến nên gần vùng nguyên liệu.", "d) Chế biến không làm tăng giá trị."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một nhà máy chế biến 100 tấn cá/ngày, hoạt động 300 ngày/năm. Sản lượng mỗi năm là bao nhiêu nghìn tấn (chỉ ghi số)?", "answer": "30", "explain": "100 × 300 = 30000 tấn = 30 nghìn tấn.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Xuất khẩu cà phê chế biến giá 5000 USD/tấn, gấp 2,5 lần cà phê nhân thô. Giá cà phê nhân là bao nhiêu USD/tấn (chỉ ghi số)?", "answer": "2000", "explain": "5000 ÷ 2,5 = 2000 USD/tấn — chế biến sâu tăng giá trị 2,5 lần.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Công nghiệp dệt – may, da giày là ngành:", "options": ["A. Thâm dụng lao động", "B. Thâm dụng vốn", "C. Công nghệ cao", "D. Khai khoáng"], "answer": "A", "explain": "Sử dụng nhiều lao động phổ thông — tạo hàng triệu việc làm, nhất là lao động nữ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dệt may, da giày tập trung ở:", "options": ["A. Đông Nam Bộ và đồng bằng sông Hồng", "B. Tây Nguyên", "C. Miền núi", "D. Hải đảo"], "answer": "A", "explain": "Gần lao động, cảng xuất khẩu (Cát Lái, Hải Phòng), hạ tầng — hai vùng công nghiệp lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Xuất khẩu dệt may khoảng 44 tỉ USD (2024, minh họa). Điều này cho thấy:", "options": ["A. Dệt may là mặt hàng xuất khẩu chủ lực", "B. Dệt may không quan trọng", "C. Nên giảm dệt may", "D. Chỉ tiêu thụ nội địa"], "answer": "A", "explain": "Top xuất khẩu: dệt may, da giày — nguồn ngoại tệ, việc làm lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để hưởng ưu đãi thuế EVFTA, dệt may cần:", "options": ["A. Vải sản xuất tại Việt Nam/EU (quy tắc xuất xứ)", "B. Nhập vải bất kỳ", "C. Không cần quy tắc", "D. Chỉ cần may"], "answer": "A", "explain": "Từ vải trở đi: vải phải có xuất xứ Việt Nam/EU — thúc đẩy ngành dệt trong nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một xí nghiệp may có 2000 công nhân, mỗi người may 5 sản phẩm/ngày. Sản lượng mỗi ngày là bao nhiêu nghìn sản phẩm (chỉ ghi số)?", "options": ["A. 10", "B. 100", "C. 1", "D. 1000"], "answer": "A", "explain": "2000 × 5 = 10000 = 10 nghìn sản phẩm/ngày.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để dệt may vươn lên nấc thang giá trị cao hơn, cần:", "options": ["A. Thiết kế, thương hiệu, dệt vải, sản phẩm kỹ thuật", "B. Mãi gia công", "C. Chỉ may thuê", "D. Không đổi mới"], "answer": "A", "explain": "Từ CMT (gia công) lên ODM, OBM: thiết kế, thương hiệu — giá trị, lợi nhuận cao hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dệt may thâm dụng lao động.", "b) Tập trung ở Đông Nam Bộ, đồng bằng sông Hồng.", "c) Là mặt hàng xuất khẩu chủ lực.", "d) Dệt may không tạo việc làm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tạo hàng triệu việc làm.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quy tắc xuất xứ thúc đẩy dệt vải nội địa.", "b) Cần phát triển thiết kế, thương hiệu.", "c) Gia công mãi thì giá trị thấp.", "d) Chỉ cần may thuê là đủ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần vươn lên ODM, OBM.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Xuất khẩu dệt may 44 tỉ USD, da giày 27 tỉ USD (minh họa). Tổng hai ngành là bao nhiêu tỉ USD (chỉ ghi số)?", "answer": "71", "explain": "44 + 27 = 71 tỉ USD.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một đơn hàng 1 triệu sản phẩm, giá gia công 2 USD/sản phẩm; nếu có thương hiệu giá 10 USD. Chênh lệch là bao nhiêu triệu USD (chỉ ghi số)?", "answer": "8", "explain": "(10 − 2) × 1 = 8 triệu USD — giá trị của thương hiệu.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Công nghiệp điện tử ở Việt Nam chủ yếu do:", "options": ["A. Doanh nghiệp FDI", "B. Doanh nghiệp nhà nước", "C. Hợp tác xã", "D. Hộ gia đình"], "answer": "A", "explain": "Samsung, Intel, Foxconn, LG... — FDI chiếm ưu thế tuyệt đối.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cụm công nghiệp điện tử lớn nhất ở:", "options": ["A. Bắc Ninh, Bắc Giang, Thái Nguyên", "B. Tây Nguyên", "C. Miền núi", "D. Hải đảo"], "answer": "A", "explain": "Samsung (Bắc Ninh, Thái Nguyên), Foxconn (Bắc Giang) — cụm điện tử phía Bắc.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Xuất khẩu điện thoại, máy tính và linh kiện khoảng 72 tỉ USD (2024, minh họa). Điều này cho thấy:", "options": ["A. Điện tử là ngành xuất khẩu lớn nhất", "B. Điện tử không quan trọng", "C. Chỉ tiêu thụ nội địa", "D. Nên giảm điện tử"], "answer": "A", "explain": "Điện tử vượt dệt may — mặt hàng xuất khẩu số 1, động lực tăng trưởng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hạn chế lớn nhất của công nghiệp điện tử Việt Nam là:", "options": ["A. Nội địa hóa thấp, chủ yếu lắp ráp", "B. Thừa lao động kĩ thuật", "C. Thừa linh kiện nội địa", "D. Không có hạn chế"], "answer": "A", "explain": "Linh kiện nhập khẩu, lắp ráp trong nước — giá trị ở lại thấp; cần công nghiệp hỗ trợ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nhà máy Samsung xuất khẩu 20 tỉ USD/năm, linh kiện nhập khẩu 15 tỉ USD. Giá trị gia tăng trong nước là bao nhiêu tỉ USD (chỉ ghi số)?", "options": ["A. 5", "B. 35", "C. 20", "D. 15"], "answer": "A", "explain": "20 − 15 = 5 tỉ USD — giá trị ở lại còn thấp, cần nâng nội địa hóa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để tham gia sâu vào chuỗi giá trị điện tử toàn cầu, Việt Nam cần:", "options": ["A. Công nghiệp hỗ trợ, nhân lực kĩ thuật cao, R và D", "B. Chỉ lắp ráp", "C. Không cần đầu tư", "D. Giảm lương"], "answer": "A", "explain": "Vươn lên: sản xuất linh kiện, thiết kế, nghiên cứu — cần hệ sinh thái đồng bộ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Điện tử chủ yếu do FDI.", "b) Cụm điện tử lớn ở Bắc Ninh, Bắc Giang.", "c) Điện tử là mặt hàng xuất khẩu lớn nhất.", "d) Doanh nghiệp nội chiếm ưu thế."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: FDI chiếm ưu thế.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nội địa hóa điện tử còn thấp.", "b) Cần phát triển công nghiệp hỗ trợ.", "c) Lắp ráp tạo giá trị gia tăng thấp.", "d) Không cần nâng cấp."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần vươn lên nấc cao hơn.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Xuất khẩu điện tử 72 tỉ USD, chiếm tỉ trọng bao nhiêu % trong tổng xuất khẩu 405,53 tỉ USD (1 chữ số thập phân)?", "answer": "17,8", "explain": "72 ÷ 405,53 × 100% ≈ 17,75 ≈ 17,8%.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tỉ lệ nội địa hóa tăng từ 20% lên 35%. Mức tăng là bao nhiêu điểm phần trăm (chỉ ghi số)?", "answer": "15", "explain": "35 − 20 = 15 điểm phần trăm.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Ngành cơ khí có vai trò:", "options": ["A. Chế tạo máy móc, thiết bị cho các ngành kinh tế", "B. Chỉ sửa chữa", "C. Không quan trọng", "D. Chỉ sản xuất nhỏ"], "answer": "A", "explain": "Cơ khí là ngành then chốt: máy nông nghiệp, thiết bị công nghiệp — giảm nhập khẩu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "VinFast là doanh nghiệp tiêu biểu của ngành:", "options": ["A. Cơ khí – ô tô", "B. Dệt may", "C. Thực phẩm", "D. Khai khoáng"], "answer": "A", "explain": "VinFast: ô tô điện thương hiệu Việt — bước tiến của cơ khí, công nghiệp hỗ trợ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Công nghiệp hóa chất – phân bón phát triển dựa trên:", "options": ["A. A-pa-tít (Lào Cai), dầu khí, muối", "B. Không có nguyên liệu", "C. Nhập khẩu hoàn toàn", "D. Ngẫu nhiên"], "answer": "A", "explain": "Phân lân (a-pa-tít Lào Cai), đạm (khí), hóa dầu (Dung Quất, Nghi Sơn) — gắn tài nguyên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Công nghiệp vật liệu xây dựng (xi măng, thép) phát triển nhờ:", "options": ["A. Nhu cầu xây dựng, hạ tầng lớn; nguyên liệu đá vôi, quặng sắt", "B. Không có nhu cầu", "C. Nhập khẩu rẻ hơn", "D. Ngẫu nhiên"], "answer": "A", "explain": "Đô thị hóa, hạ tầng: xi măng (đá vôi dồi dào), thép (Formosa, Hòa Phát) — đáp ứng xây dựng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nhà máy xi măng công suất 2 triệu tấn/năm, hoạt động 90% công suất. Sản lượng là bao nhiêu triệu tấn (1 chữ số thập phân)?", "options": ["A. 1,8", "B. 2,0", "C. 0,9", "D. 18,0"], "answer": "A", "explain": "2 × 90% = 1,8 triệu tấn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để cơ khí Việt Nam cạnh tranh được, cần:", "options": ["A. Đầu tư công nghệ, nhân lực, thị trường nội địa, hỗ trợ", "B. Chỉ nhập khẩu máy", "C. Không đầu tư", "D. Bỏ ngành cơ khí"], "answer": "A", "explain": "Cơ khí yếu do thiếu công nghệ, thị trường nhỏ; cần chính sách: đặt hàng, hỗ trợ, liên kết — từng bước làm chủ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cơ khí chế tạo máy móc, thiết bị.", "b) VinFast là ô tô thương hiệu Việt.", "c) Phân bón gắn với a-pa-tít, dầu khí.", "d) Cơ khí không quan trọng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cơ khí là ngành then chốt.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xi măng phát triển nhờ đá vôi dồi dào.", "b) Cần giảm nhập khẩu thiết bị.", "c) Cơ khí cần chính sách hỗ trợ.", "d) Nên nhập khẩu mọi máy móc."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phụ thuộc nhập khẩu rủi ro, tốn ngoại tệ.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một nhà máy thép sản xuất 5 triệu tấn/năm, nhu cầu trong nước 20 triệu tấn. Tỉ lệ đáp ứng là bao nhiêu % (chỉ ghi số)?", "answer": "25", "explain": "5 ÷ 20 × 100% = 25% — còn phải nhập khẩu nhiều.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đầu tư 1000 tỉ đồng cho cơ khí, tạo ra giá trị sản xuất gấp 3 lần. Giá trị tạo ra là bao nhiêu nghìn tỉ đồng (chỉ ghi số)?", "answer": "3", "explain": "1000 × 3 = 3000 tỉ = 3 nghìn tỉ đồng (minh họa hiệu quả đầu tư).", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Công nghiệp chế biến thực phẩm phân bố:", "options": ["A. Gắn với vùng nguyên liệu", "B. Chỉ ở thành phố lớn", "C. Ngẫu nhiên", "D. Chỉ ở miền núi"], "answer": "A", "explain": "Gần nguyên liệu tươi sống: thủy sản (đồng bằng sông Cửu Long), cà phê (Tây Nguyên), đường (vùng mía).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Công nghiệp điện tử, dệt may phân bố:", "options": ["A. Gần lao động, cảng, thị trường (Đông Nam Bộ, đồng bằng sông Hồng)", "B. Ở miền núi", "C. Ở hải đảo", "D. Ngẫu nhiên"], "answer": "A", "explain": "Cần lao động, xuất khẩu: gần cảng, hạ tầng, đô thị — hai vùng công nghiệp lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Công nghiệp khai khoáng phân bố:", "options": ["A. Gắn với mỏ (Quảng Ninh, Lào Cai, Tây Nguyên)", "B. Ở đồng bằng", "C. Ở thành phố", "D. Ngẫu nhiên"], "answer": "A", "explain": "Gắn tài nguyên: than (Quảng Ninh), a-pa-tít (Lào Cai), bô-xit (Tây Nguyên).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhiệt điện phân bố gần:", "options": ["A. Nguồn nhiên liệu (than Quảng Ninh, khí Đông Nam Bộ)", "B. Xa nguồn nhiên liệu", "C. Chỉ ở miền núi", "D. Ngẫu nhiên"], "answer": "A", "explain": "Nhiệt điện than (Quảng Ninh, Hải Phòng), nhiệt điện khí (Cà Mau, Nhơn Trạch) — gần nhiên liệu, giảm chi phí vận chuyển.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao nhà máy thủy điện ở miền núi nhưng điện tiêu thụ ở đồng bằng, đô thị?", "options": ["A. Nguồn thủy năng ở miền núi; truyền tải qua lưới điện quốc gia", "B. Ngẫu nhiên", "C. Miền núi tiêu thụ nhiều", "D. Không có lí do"], "answer": "A", "explain": "Thủy năng ở sông miền núi; lưới điện 500 kV Bắc – Nam truyền tải — phân bố sản xuất và tiêu thụ tách rời.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguyên tắc phân bố công nghiệp hợp lí là:", "options": ["A. Gần nguyên liệu/nhiên liệu, lao động, thị trường, hạ tầng; bảo vệ môi trường", "B. Đặt tùy tiện", "C. Chỉ gần thành phố", "D. Không cần nguyên tắc"], "answer": "A", "explain": "Tối thiểu chi phí, tối đa hiệu quả, giảm ô nhiễm — quy hoạch phân bố khoa học.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chế biến thực phẩm gắn vùng nguyên liệu.", "b) Điện tử gần lao động, cảng.", "c) Khai khoáng gắn với mỏ.", "d) Mọi ngành phân bố ngẫu nhiên."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhiệt điện gần nguồn nhiên liệu.", "b) Lưới điện truyền tải Bắc – Nam.", "c) Phân bố công nghiệp cần quy hoạch.", "d) Nên đặt nhà máy tùy tiện."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một tỉnh có 3 khu công nghiệp: A (50 doanh nghiệp), B (30), C (20). Tỉ trọng khu A là bao nhiêu % (chỉ ghi số)?", "answer": "50", "explain": "50 ÷ 100 × 100% = 50%.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Chi phí vận chuyển nguyên liệu chiếm 20% giá thành. Đặt nhà máy gần nguyên liệu giảm 50% chi phí này. Giá thành giảm bao nhiêu % (chỉ ghi số)?", "answer": "10", "explain": "20% × 50% = 10% — lợi ích của phân bố gần nguyên liệu.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Trên Atlat, các nhà máy thủy điện được thể hiện bằng:", "options": ["A. Kí hiệu tượng hình (nhà máy điện) trên sông", "B. Đường đẳng trị", "C. Biểu đồ tròn", "D. Không thể hiện"], "answer": "A", "explain": "Kí hiệu nhà máy điện đặt trên các sông có thủy điện (Đà, Sê San, Đồng Nai...).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dựa vào Atlat, các mỏ than tập trung ở:", "options": ["A. Quảng Ninh", "B. Nghệ An", "C. Lâm Đồng", "D. An Giang"], "answer": "A", "explain": "Kí hiệu than dày đặc ở Quảng Ninh — vùng than lớn nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dựa vào Atlat, các khu công nghiệp tập trung ở:", "options": ["A. Đông Nam Bộ và đồng bằng sông Hồng", "B. Tây Nguyên", "C. Miền núi phía Bắc", "D. Rải đều"], "answer": "A", "explain": "Kí hiệu khu công nghiệp dày đặc quanh TP. Hồ Chí Minh, Hà Nội, Hải Phòng, Bắc Ninh...", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dựa vào Atlat, nhà máy lọc dầu Dung Quất nằm ở tỉnh:", "options": ["A. Quảng Ngãi", "B. Thanh Hóa", "C. Bà Rịa – Vũng Tàu", "D. Cà Mau"], "answer": "A", "explain": "Dung Quất (Quảng Ngãi); Nghi Sơn (Thanh Hóa) — hai nhà máy lọc dầu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Dựa vào Atlat, giải thích vì sao thủy điện tập trung ở Tây Bắc, Tây Nguyên, duyên hải miền Trung:", "options": ["A. Sông dốc, lưu lượng lớn — tiềm năng thủy điện", "B. Đồng bằng", "C. Gần biển", "D. Ngẫu nhiên"], "answer": "A", "explain": "Địa hình núi, sông dốc nhiều thác ghềnh — thủy năng lớn: sông Đà, Sê San, Srêpôk, Vu Gia...", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một học sinh dùng Atlat đếm kí hiệu nhà máy xi măng: miền Bắc 6, miền Nam 4. Nhận định đúng là:", "options": ["A. Miền Bắc nhiều hơn do đá vôi dồi dào, nhu cầu xây dựng lớn", "B. Miền Nam nhiều hơn", "C. Hai miền bằng nhau", "D. Atlat không thể hiện"], "answer": "A", "explain": "Đá vôi (Ninh Bình, Thanh Hóa, Hải Phòng...) + nhu cầu — miền Bắc nhiều nhà máy xi măng hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Atlat thể hiện nhà máy điện bằng kí hiệu.", "b) Than tập trung ở Quảng Ninh.", "c) Khu công nghiệp tập trung ở Đông Nam Bộ, đồng bằng sông Hồng.", "d) Atlat không thể hiện công nghiệp."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thủy điện ở sông dốc miền núi.", "b) Dung Quất ở Quảng Ngãi.", "c) Kí hiệu Atlat giúp xác định phân bố.", "d) Mọi vùng có công nghiệp như nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Trên Atlat, đếm được 4 nhà máy thủy điện trên sông Đà và 3 trên sông Sê San. Tỉ số là bao nhiêu (dạng a/b)?", "answer": "4/3", "explain": "4 ÷ 3 = 4/3.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vùng có 5 kí hiệu nhà máy điện các loại. Đó có thể là vùng nào có tiềm năng đa dạng?", "answer": "Duyên hải Nam Trung Bộ", "explain": "Duyên hải Nam Trung Bộ: thủy điện, nhiệt điện, điện gió, mặt trời — đa dạng nguồn (chấp nhận đáp án hợp lí).", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Mặt hàng xuất khẩu lớn nhất của Việt Nam (2024, minh họa) là:", "options": ["A. Điện thoại, máy tính và linh kiện", "B. Gạo", "C. Cà phê", "D. Than"], "answer": "A", "explain": "Điện tử ~72 tỉ USD — vượt dệt may, là mặt hàng xuất khẩu số 1.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xuất khẩu công nghiệp chiếm tỉ trọng:", "options": ["A. Trên 85% tổng kim ngạch xuất khẩu", "B. Dưới 50%", "C. Rất nhỏ", "D. Không đáng kể"], "answer": "A", "explain": "Hàng công nghiệp chế biến chiếm áp đảo — cơ cấu xuất khẩu tiến bộ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "FDI chiếm 71,7% kim ngạch xuất khẩu (2024). Điều này cho thấy:", "options": ["A. Xuất khẩu phụ thuộc lớn vào FDI", "B. Doanh nghiệp nội mạnh", "C. Không cần FDI", "D. Xuất khẩu nội địa cao"], "answer": "A", "explain": "Phụ thuộc FDI: điện tử, dệt may FDI — cần nâng tỉ trọng doanh nghiệp nội.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để tăng giá trị xuất khẩu công nghiệp, cần:", "options": ["A. Chế biến sâu, thương hiệu, công nghệ cao", "B. Xuất thô", "C. Giảm chất lượng", "D. Chỉ gia công"], "answer": "A", "explain": "Từ gia công sang giá trị cao: thương hiệu, công nghệ, thiết kế — nâng giá trị xuất khẩu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Xuất khẩu 405,53 tỉ USD, công nghiệp chế biến chiếm 88%. Giá trị là bao nhiêu tỉ USD (làm tròn đến hàng đơn vị)?", "options": ["A. 357", "B. 300", "C. 400", "D. 200"], "answer": "A", "explain": "405,53 × 88% ≈ 356,87 ≈ 357 tỉ USD.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Giảm phụ thuộc FDI trong xuất khẩu cần:", "options": ["A. Doanh nghiệp nội lớn mạnh, tham gia chuỗi toàn cầu", "B. Đuổi FDI", "C. Không cần làm gì", "D. Đóng cửa"], "answer": "A", "explain": "Không đuổi FDI mà nâng nội lực: doanh nghiệp Việt làm chủ công nghệ, thương hiệu, thị trường.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Điện tử là mặt hàng xuất khẩu lớn nhất.", "b) Công nghiệp chế biến chiếm trên 85% xuất khẩu.", "c) FDI chiếm 71,7% xuất khẩu.", "d) Nông sản thô là chủ lực."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: công nghiệp chế biến mới là chủ lực.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xuất khẩu phụ thuộc FDI.", "b) Cần nâng tỉ trọng doanh nghiệp nội.", "c) Chế biến sâu tăng giá trị xuất khẩu.", "d) Nên mãi gia công giá rẻ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Xuất khẩu điện tử 72 tỉ USD, dệt may 44 tỉ USD. Điện tử gấp bao nhiêu lần dệt may (1 chữ số thập phân)?", "answer": "1,6", "explain": "72 ÷ 44 ≈ 1,636 ≈ 1,6 lần.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Mục tiêu nâng tỉ trọng doanh nghiệp nội trong xuất khẩu từ 28,3% lên 40%. Cần tăng bao nhiêu điểm phần trăm (1 chữ số thập phân)?", "answer": "11,7", "explain": "40 − 28,3 = 11,7 điểm phần trăm.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Nội dung nào sau đây KHÔNG thuộc bài Một số ngành công nghiệp?", "options": ["A. Chuyển dịch cơ cấu cây trồng", "B. Công nghiệp năng lượng", "C. Công nghiệp điện tử", "D. Công nghiệp dệt may"], "answer": "A", "explain": "Chuyển dịch cây trồng thuộc bài Nông nghiệp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngành công nghiệp nào là nền tảng cho phát triển kinh tế?", "options": ["A. Năng lượng", "B. Dệt may", "C. Da giày", "D. Đồ chơi"], "answer": "A", "explain": "Năng lượng: đầu vào của mọi sản xuất — ngành trọng điểm số 1.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các phát biểu: (1) Điện tăng 10,05%; (2) Điện tử do FDI chiếm ưu thế; (3) Dệt may thâm dụng lao động; (4) Chế biến thực phẩm gắn nguyên liệu. Số phát biểu đúng là:", "options": ["A. 1", "B. 2", "C. 3", "D. 4"], "answer": "D", "explain": "Cả 4 đều đúng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung của các ngành công nghiệp trọng điểm là:", "options": ["A. Có lợi thế, hiệu quả cao, tác động lan tỏa", "B. Quy mô nhỏ", "C. Không hiệu quả", "D. Chỉ khai thác"], "answer": "A", "explain": "Trọng điểm: thế mạnh lâu dài, giá trị cao, lan tỏa — động lực công nghiệp hóa.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một địa phương có than, có sông dốc, có vùng mía. Nên phát triển các ngành nào?", "options": ["A. Nhiệt điện, thủy điện, chế biến đường", "B. Chỉ du lịch", "C. Chỉ trồng rừng", "D. Không phát triển gì"], "answer": "A", "explain": "Theo lợi thế: than → nhiệt điện; sông dốc → thủy điện; mía → đường — phân công hợp lí.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tổng kết: Để công nghiệp Việt Nam phát triển bền vững, cần:", "options": ["A. Cơ cấu tiến bộ, công nghệ cao, nội địa hóa, xanh, nhân lực chất lượng", "B. Chỉ tăng số lượng", "C. Phụ thuộc FDI mãi", "D. Bỏ qua môi trường"], "answer": "A", "explain": "Đồng bộ 5 trụ: cơ cấu – công nghệ – nội lực – môi trường – con người — công nghiệp hóa bền vững.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định ôn tập sau:", "statements": ["a) Năng lượng là ngành nền tảng.", "b) Điện tử tăng trưởng nhanh nhất.", "c) Dệt may tạo nhiều việc làm.", "d) Chế biến thực phẩm gắn nguyên liệu."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định
