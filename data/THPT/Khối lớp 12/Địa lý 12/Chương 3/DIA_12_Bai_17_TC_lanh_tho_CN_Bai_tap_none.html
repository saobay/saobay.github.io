có trọng điểm, bảo vệ môi trường", "B. Dàn đều khắp nơi", "C. Chỉ tập trung một chỗ", "D. Không cần quy hoạch"], "answer": "A", "explain": "Vừa tập trung (hiệu quả) vừa lan tỏa (công bằng) — quy hoạch vùng, liên kết.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Khu công nghiệp tập trung ở Đông Nam Bộ, đồng bằng sông Hồng.", "b) Điểm công nghiệp phân bố lẻ tẻ.", "c) Miền núi ít khu công nghiệp.", "d) Công nghiệp phân bố đều khắp."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cần ưu đãi để thu hút công nghiệp về vùng khó khăn.", "b) Hạ tầng quyết định thu hút đầu tư.", "c) Phân bố cần quy hoạch.", "d) Nên dàn đều công nghiệp."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: theo lợi thế, có trọng điểm.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Cả nước có 400 khu công nghiệp (minh họa), 70% ở hai vùng động lực. Số khu ở hai vùng là bao nhiêu (chỉ ghi số)?", "answer": "280", "explain": "400 × 70% = 280 khu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một tỉnh miền núi thu hút 10 dự án công nghiệp nhờ ưu đãi, gấp 5 lần trước đây. Trước đây có bao nhiêu dự án (chỉ ghi số)?", "answer": "2", "explain": "10 ÷ 5 = 2 dự án — chính sách ưu đãi hiệu quả.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trên Atlat, trung tâm công nghiệp được thể hiện bằng:", "options": ["A. Vòng tròn tỉ lệ với quy mô, có cơ cấu ngành bên trong", "B. Đường thẳng", "C. Màu nền", "D. Không thể hiện"], "answer": "A", "explain": "Vòng tròn: kích thước = quy mô (giá trị sản xuất); bên trong chia cơ cấu ngành.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dựa vào Atlat, trung tâm công nghiệp có vòng tròn lớn nhất là:", "options": ["A. TP. Hồ Chí Minh", "B. Cần Thơ", "C. Huế", ments": ["a) Kích thước vòng tròn tỉ lệ với quy mô.", "b) Cơ cấu ngành thể hiện bên trong vòng tròn.", "c) Quảng Ninh nổi bật về khai khoáng.", "d) Mọi trung tâm quy mô bằng nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Trên Atlat, đếm được 6 khu công nghiệp quanh TP. Hồ Chí Minh và 2 quanh Cần Thơ. Tỉ số là bao nhiêu (dạng a/b)?", "answer": "3/1", "explain": "6 ÷ 2 = 3/1.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vòng tròn TP. Hồ Chí Minh có đường kính gấp 3 lần Cần Thơ. Diện tích (tỉ lệ quy mô) gấp bao nhiêu lần (chỉ ghi số)?", "answer": "9", "explain": "Diện tích tỉ lệ với bình phương đường kính: 3² = 9 lần.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Vấn đề môi trường của khu công nghiệp là:", "options": ["A. Nước thải, khí thải, chất thải rắn", "B. Không có vấn đề", "C. Chỉ thiếu lao động", "D. Chỉ thiếu vốn"], "answer": "A", "explain": "Tập trung nhiều nhà máy: nước thải, khí thải, rác công nghiệp — phải quản lí chặt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biện pháp bắt buộc với khu công nghiệp là:", "options": ["A. Trạm xử lí nước thải tập trung", "B. Xả thải tự do", "C. Không cần xử lí", "D. Đốt rác ngoài trời"], "answer": "A", "explain": "Pháp luật: khu công nghiệp phải có hệ thống xử lí nước thải tập trung đạt chuẩn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khu công nghiệp sinh thái là khu:", "options": ["A. Các doanh nghiệp trao đổi chất thải, năng lượng — giảm phát thải", "B. Trồng nhiều cây", "C. Không sản xuất", "D. Chỉ là tên gọi"], "answer": "A", "explain": "Sinh thái: cộng sinh công nghiệp — chất thải của nhà máy này là nguyên liệu của nhà máy khác.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quan trắc môi trường tự động giúp:", "options": ["A. Giám sát xả thải liên tục, phát hiện vi phạm kịp thời", "B. Tăng ô nhiễm", "C. Không có tác dụng", "D. Tốn kém vô ích"], "answer": "A", "explain": "Trạm quan trắc online truyền dữ liệu về cơ quan quản lí — minh bạch, kịp thời.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một khu công nghiệp xử lí đạt 90% nước thải. Lượng nước thải 10000 m³/ngày. Lượng chưa đạt chuẩn là bao nhiêu m³ (chỉ ghi số)?", "options": ["A. 1000", "B. 9000", "C. 100", "D. 900"], "answer": "A", "explain": "10000 × 10% = 1000 m³ — phải xử lí triệt để.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để khu công nghiệp xanh, cần:", "options": ["A. Tiêu chí môi trường khi thu hút, công nghệ sạch, xử lí tập trung, giám sát", "B. Thu hút bằng mọi giá", "C. Bỏ qua môi trường", "D. Không cần tiêu chí"], "answer": "A", "explain": "Xanh từ đầu vào: chọn ngành sạch, công nghệ sạch, xử lí đồng bộ — phát triển bền vững.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Khu công nghiệp gây ô nhiễm nước, khí.", "b) Phải có xử lí nước thải tập trung.", "c) Quan trắc giúp giám sát xả thải.", "d) Không cần bảo vệ môi trường."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Khu công nghiệp sinh thái trao đổi chất thải.", "b) Cần tiêu chí môi trường khi thu hút.", "c) Công nghệ sạch giảm ô nhiễm.", "d) Nên xả thải tự do."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vi phạm pháp luật.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một khu công nghiệp tái sử dụng 30% nước thải. Lượng nước thải 2000 m³/ngày. Lượng tái sử dụng là bao nhiêu m³ (chỉ ghi số)?", "answer": "600", "explain": "2000 × 30% = 600 m³ — tiết kiệm nước, giảm xả thải.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Chi phí xử lí môi trường 20 tỉ đồng/năm, giúp tránh phạt 50 tỉ đồng. Lợi ích ròng là bao nhiêu tỉ đồng (chỉ ghi số)?", "answer": "30", "explain": "50 − 20 = 30 tỉ đồng — bảo vệ môi trường cũng là lợi ích kinh tế.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Liên kết trong tổ chức lãnh thổ công nghiệp là:", "options": ["A. Các xí nghiệp, khu, trung tâm liên hệ sản xuất, kĩ thuật", "B. Mỗi nơi tự làm", "C. Cạnh tranh triệt tiêu", "D. Không liên kết"], "answer": "A", "explain": "Liên hệ: cung ứng, tiêu thụ, kĩ thuật, lao động — cụm liên kết, chuỗi giá trị.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ví dụ về liên kết công nghiệp là:", "options": ["A. Khu công nghiệp cung cấp linh kiện cho nhà máy lắp ráp ô tô", "B. Mỗi nhà máy tự túc", "C. Không ví dụ nào", "D. Nhập khẩu tất cả"], "answer": "A", "explain": "Công nghiệp hỗ trợ – lắp ráp: chuỗi cung ứng nội địa — liên kết sản xuất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cụm liên kết ngành (cluster) giúp:", "options": ["A. Giảm chi phí, chia sẻ hạ tầng, đổi mới", "B. Tăng chi phí", "C. Không có lợi", "D. Cô lập"], "answer": "A", "explain": "Cluster: gần nhau, bổ sung, cạnh tranh lành mạnh — sức cạnh tranh cao (Thung lũng Silicon...).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Liên kết vùng công nghiệp Đông Nam Bộ – đồng bằng sông Cửu Long:", "options": ["A. Chế biến nông, thủy sản đồng bằng sông Cửu Long – công nghiệp, cảng Đông Nam Bộ", "B. Không liên quan", "C. Cạnh tranh", "D. Tách biệt"], "answer": "A", "explain": "Bổ sung: nguyên liệu đồng bằng sông Cửu Long – chế biến, xuất khẩu qua cảng Đông Nam Bộ — liên vùng hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một chuỗi cung ứng có 3 công đoạn với chi phí 40%, 35%, 25%. Công đoạn lớn nhất chiếm bao nhiêu % (chỉ ghi số)?", "options": ["A. 40", "B. 35", "C. 25", "D. 100"], "answer": "A", "explain": "40% — tối ưu công đoạn lớn nhất giảm chi phí nhiều nhất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để xây dựng chuỗi giá trị công nghiệp mạnh, cần:", "options": ["A. Doanh nghiệp đầu tàu, công nghiệp hỗ trợ, logistics, chính sách", "B. Mỗi doanh nghiệp tự làm", "C. Không cần liên kết", "D. Chỉ nhập khẩu"], "answer": "A", "explain": "Hệ sinh thái: đầu tàu (Samsung, VinFast) + vệ tinh + logistics + chính sách — chuỗi hoàn chỉnh.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cần liên kết giữa các xí nghiệp.", "b) Cluster giảm chi phí, tăng đổi mới.", "c) Liên vùng bổ sung lợi thế.", "d) Mỗi nơi nên tự túc."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: liên kết hiệu quả hơn tự túc.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chuỗi cung ứng nội địa quan trọng.", "b) Cần doanh nghiệp đầu tàu.", "c) Logistics hỗ trợ liên kết.", "d) Không cần công nghiệp hỗ trợ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: hỗ trợ là mắt xích then chốt.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một chuỗi có 4 doanh nghiệp, mỗi doanh nghiệp tạo giá trị 25%. Tổng chuỗi là bao nhiêu % (chỉ ghi số)?", "answer": "100", "explain": "4 × 25% = 100% — chuỗi giá trị hoàn chỉnh.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Liên kết giúp giảm 15% chi phí logistics. Chi phí ban đầu 200 tỉ đồng. Tiết kiệm là bao nhiêu tỉ đồng (chỉ ghi số)?", "answer": "30", "explain": "200 × 15% = 30 tỉ đồng.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Nội dung nào sau đây KHÔNG thuộc bài Tổ chức lãnh thổ công nghiệp?", "options": ["A. Chuyển dịch cơ cấu cây trồng", "B. Điểm công nghiệp", "C. Khu công nghiệp", "D. Vùng công nghiệp"], "answer": "A", "explain": "Chuyển dịch cây trồng thuộc bài Nông nghiệp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Có mấy hình thức tổ chức lãnh thổ công nghiệp?", "options": ["A. 4 (điểm, khu, trung tâm, vùng)", "B. 2", "C. 3", "D. 5"], "answer": "A", "explain": "Bốn hình thức từ thấp đến cao: điểm → khu → trung tâm → vùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các phát biểu: (1) Điểm công nghiệp 1–2 xí nghiệp; (2) Khu công nghiệp hạ tầng đồng bộ; (3) Trung tâm gắn đô thị; (4) Vùng chuyên môn hóa. Số phát biểu đúng là:", "options": ["A. 1", "B. 2", "C. 3", "D. 4"], "answer": "D", "explain": "Cả 4 đều đúng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa các hình thức là:", "options": ["A. Từ thấp đến cao, lồng ghép, bổ sung nhau", "B. Tách biệt", "C. Đối lập", "D. Không liên quan"], "answer": "A", "explain": "Điểm trong khu, khu trong trung tâm, trung tâm trong vùng — hệ thống thứ bậc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một tỉnh có 2 trung tâm công nghiệp, mỗi trung tâm 3 khu công nghiệp. Tổng số khu là bao nhiêu (chỉ ghi số)?", "options": ["A. 6", "B. 5", "C. 2", "D. 3"], "answer": "A", "explain": "2 × 3 = 6 khu công nghiệp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tổng kết: Tổ chức lãnh thổ công nghiệp hợp lí giúp:", "options": ["A. Thu hút đầu tư, hiệu quả, bền vững, phát triển vùng", "B. Tăng diện tích", "C. Giảm sản xuất", "D. Không có tác dụng"], "answer": "A", "explain": "Mục tiêu: sử dụng hiệu quả lãnh thổ, công nghiệp hóa, hiện đại hóa, bền vững.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định ôn tập sau:", "statements": ["a) Có 4 hình thức tổ chức.", "b) Điểm công nghiệp nhỏ nhất.", "c) Vùng công nghiệp lớn nhất.", "d) Khu công nghiệp gắn điểm dân cư nhỏ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: điểm công nghiệp mới gắn điểm dân cư.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Các hình thức lồng ghép nhau.", "b) Cần phát triển theo chiều sâu.", "c) Bảo vệ môi trường là bắt buộc.", "d) Tổ chức lãnh thổ không quan trọng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Kể tên hai hình thức tổ chức lãnh thổ công nghiệp (viết cách nhau bằng dấu phẩy).", "answer": "Điểm công nghiệp, khu công nghiệp", "explain": "Bốn hình thức: điểm, khu, trung tâm, vùng (chấp nhận hai tên đúng).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vùng công nghiệp có 3 trung tâm, mỗi trung tâm 2 khu, mỗi khu 50 doanh nghiệp. Tổng số doanh nghiệp là bao nhiêu (chỉ ghi số)?", "answer": "300", "explain": "3 × 2 × 50 = 300 doanh nghiệp — hệ thống thứ bậc.", "points": 0.5}]}]}
