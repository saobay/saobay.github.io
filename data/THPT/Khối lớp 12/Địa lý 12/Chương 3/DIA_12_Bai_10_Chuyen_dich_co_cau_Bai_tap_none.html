{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Chuyển dịch cơ cấu kinh tế là:", "options": ["A. Sự thay đổi tỉ trọng của các ngành, thành phần kinh tế và vùng lãnh thổ", "B. Sự tăng trưởng GDP", "C. Sự giảm dân số", "D. Sự thay đổi thời tiết"], "answer": "A", "explain": "Chuyển dịch cơ cấu diễn ra theo 3 hướng: ngành, thành phần kinh tế và lãnh thổ — phản ánh trình độ phát triển của nền kinh tế.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Năm 2024, tốc độ tăng GDP của Việt Nam đạt bao nhiêu?", "options": ["A. 7,09%", "B. 5,05%", "C. 8,02%", "D. 6,50%"], "answer": "A", "explain": "GDP năm 2024 tăng 7,09% so với năm trước — mức cao trong khu vực và thế giới (Tổng cục Thống kê).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ý nghĩa quan trọng nhất của chuyển dịch cơ cấu kinh tế là:", "options": ["A. Khai thác hiệu quả lợi thế, thúc đẩy tăng trưởng nhanh và bền vững", "B. Chỉ để thống kê", "C. Giảm tăng trưởng", "D. Không có ý nghĩa"], "answer": "A", "explain": "Cơ cấu hợp lí khai thác lợi thế so sánh, nâng cao hiệu quả, sức cạnh tranh — nền tảng của tăng trưởng bền vững.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chuyển dịch cơ cấu kinh tế phù hợp với:", "options": ["A. Quy luật phát triển từ nông nghiệp lên công nghiệp, dịch vụ", "B. Quy luật ngẫu nhiên", "C. Quay lại nông nghiệp thuần túy", "D. Không theo quy luật nào"], "answer": "A", "explain": "Quy luật chung: tỉ trọng nông nghiệp giảm dần, công nghiệp rồi dịch vụ tăng lên theo trình độ phát triển.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "GDP năm 2024 tăng 7,09%, trong đó công nghiệp chế biến, chế tạo tăng 9,83% và đóng góp 2,49 điểm phần trăm. Tính tỉ lệ đóng góp của ngành này vào tăng trưởng GDP (làm tròn 1 chữ số thập phân).", "options": ["A. 35,1%", "B. 25,0%", "C. 50,0%", "D. 9,8%"], "answer": "A", "explain": "2,49 ÷ 7,09 × 100% ≈ 35,12 ≈ 35,1% — công nghiệp chế biến, chế tạo là động lực tăng trưởng chính.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một nền kinh tế có cơ cấu: nông nghiệp 50%, công nghiệp 20%, dịch vụ 30%. Để phát triển, hướng chuyển dịch đúng là:", "options": ["A. Giảm nông nghiệp, tăng công nghiệp và dịch vụ", "B. Tăng nông nghiệp lên 70%", "C. Giữ nguyên", "D. Giảm cả ba khu vực"], "answer": "A", "explain": "Cơ cấu nông nghiệp quá cao thể hiện trình độ thấp; cần công nghiệp hóa: giảm tỉ trọng nông nghiệp, tăng công nghiệp, dịch vụ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chuyển dịch cơ cấu diễn ra theo 3 hướng: ngành, thành phần, lãnh thổ.", "b) GDP năm 2024 tăng 7,09%.", "c) Chuyển dịch giúp tăng trưởng bền vững.", "d) Không cần chuyển dịch cơ cấu kinh tế."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cơ cấu hợp lí khai thác được lợi thế của đất nước.", "b) Chuyển dịch theo quy luật từ nông nghiệp lên công nghiệp, dịch vụ.", "c) Công nghiệp chế biến, chế tạo là động lực tăng trưởng.", "d) Cơ cấu kinh tế càng lạc hậu càng tốt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "GDP năm 2023 khoảng 433 tỉ USD, năm 2024 tăng 7,09%. Tính GDP năm 2024 (đơn vị tỉ USD, làm tròn đến hàng đơn vị).", "answer": "464", "explain": "433 × 1,0709 ≈ 463,7 ≈ 464 tỉ USD (số liệu minh họa).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tốc độ tăng GDP các năm: 2022: 8,02%; 2023: 5,05%; 2024: 7,09%. Tính tốc độ tăng bình quân 3 năm (đơn vị %/năm, 2 chữ số thập phân).", "answer": "6,72", "explain": "(8,02 + 5,05 + 7,09) ÷ 3 = 20,16 ÷ 3 = 6,72%/năm — tăng trưởng bình quân cao, ổn định.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Xu hướng chuyển dịch cơ cấu theo ngành ở Việt Nam là:", "options": ["A. Giảm nông, lâm, thủy sản; tăng công nghiệp – xây dựng và dịch vụ", "B. Tăng nông nghiệp, giảm công nghiệp", "C. Giảm dịch vụ", "D. Không thay đổi"], "answer": "A", "explain": "Xu hướng chung của công nghiệp hóa, hiện đại hóa: giảm tỉ trọng khu vực I, tăng khu vực II và III.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Năm 2024, khu vực nào chiếm tỉ trọng cao nhất trong GDP?", "options": ["A. Dịch vụ (42,36%)", "B. Nông, lâm, thủy sản (11,86%)", "C. Công nghiệp và xây dựng (37,64%)", "D. Thuế sản phẩm (8,14%)"], "answer": "A", "explain": "Dịch vụ 42,36% cao nhất, tiếp theo công nghiệp – xây dựng 37,64%, nông lâm thủy sản 11,86% (Tổng cục Thống kê, 2024).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong nội bộ ngành nông nghiệp, chuyển dịch thể hiện ở:", "options": ["A. Đa dạng hóa cây trồng, vật nuôi; tăng tỉ trọng chăn nuôi, thủy sản", "B. Chỉ trồng lúa", "C. Giảm chăn nuôi", "D. Bỏ thủy sản"], "answer": "A", "explain": "Nông nghiệp chuyển từ độc canh lúa sang đa dạng: cây công nghiệp, ăn quả, chăn nuôi, thủy sản giá trị cao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trong công nghiệp, chuyển dịch thể hiện ở:", "options": ["A. Tăng tỉ trọng công nghiệp chế biến, chế tạo; giảm khai khoáng", "B. Chỉ khai thác khoáng sản", "C. Giảm chế biến", "D. Không chuyển dịch"], "answer": "A", "explain": "Năm 2024: chế biến, chế tạo tăng 9,83%; khai khoáng giảm 7,24% — chuyển sang công nghiệp có giá trị gia tăng cao.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho bảng số liệu cơ cấu GDP (%): NLTS 11,86; CN-XD 37,64; DV 42,36; thuế 8,14. Tính tổng tỉ trọng khu vực II và III (không tính thuế).", "options": ["A. 80,0%", "B. 50,5%", "C. 60,0%", "D. 90,0%"], "answer": "A", "explain": "37,64 + 42,36 = 80,0% — công nghiệp và dịch vụ chiếm 4/5 GDP, thể hiện trình độ công nghiệp hóa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tốc độ tăng năm 2024: NLTS 3,3%; CN-XD 8,2%; DV 7,4%. Khu vực nào đóng góp nhiều nhất vào tăng trưởng?", "options": ["A. Công nghiệp – xây dựng (tăng nhanh nhất, tỉ trọng lớn)", "B. Nông, lâm, thủy sản", "C. Thuế sản phẩm", "D. Cả ba bằng nhau"], "answer": "A", "explain": "CN-XD tăng nhanh nhất (8,2%) với tỉ trọng lớn (37,64%) — đóng góp lớn nhất vào mức tăng 7,09% của GDP.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tỉ trọng nông, lâm, thủy sản đang giảm.", "b) Dịch vụ chiếm tỉ trọng cao nhất (42,36% năm 2024).", "c) Công nghiệp chế biến, chế tạo tăng trưởng nhanh.", "d) Cơ cấu ngành không thay đổi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Cho bảng số liệu cơ cấu GDP 2024 (%): 11,86; 37,64; 42,36; 8,14. Xét tính đúng, sai:", "statements": ["a) Tổng 4 thành phần bằng 100%.", "b) Khu vực II và III chiếm 80%.", "c) Nông, lâm, thủy sản thấp nhất.", "d) Thuế sản phẩm chiếm cao nhất."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 11,86+37,64+42,36+8,14=100. b) Đúng. c) Đúng. d) Sai: dịch vụ cao nhất.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Vẽ biểu đồ tròn cơ cấu GDP 2024, khu vực dịch vụ chiếm 42,36%. Tính số độ của cung tròn (1 chữ số thập phân).", "answer": "152,5", "explain": "42,36% × 360° = 152,496 ≈ 152,5°.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tỉ trọng NLTS giảm từ 15,0% (2015) xuống 11,86% (2024). Tính mức giảm bình quân mỗi năm (điểm phần trăm, 2 chữ số thập phân).", "answer": "0,35", "explain": "(15,0 − 11,86) ÷ 9 ≈ 0,3489 ≈ 0,35 điểm phần trăm/năm.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Nền kinh tế Việt Nam gồm các thành phần nào sau đây?", "options": ["A. Nhà nước, ngoài nhà nước, có vốn đầu tư nước ngoài", "B. Chỉ kinh tế nhà nước", "C. Chỉ kinh tế tư nhân", "D. Chỉ kinh tế FDI"], "answer": "A", "explain": "Nền kinh tế nhiều thành phần: nhà nước giữ vai trò chủ đạo; ngoài nhà nước và FDI ngày càng quan trọng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Xu hướng chuyển dịch cơ cấu theo thành phần kinh tế là:", "options": ["A. Giảm tỉ trọng nhà nước; tăng ngoài nhà nước và FDI", "B. Tăng tỉ trọng nhà nước", "C. Giảm FDI", "D. Không thay đổi"], "answer": "A", "explain": "Đổi mới: phát triển kinh tế nhiều thành phần, khu vực ngoài nhà nước và FDI tăng nhanh, năng động.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khu vực FDI đóng góp quan trọng nào sau đây?", "options": ["A. Chiếm 71,7% kim ngạch xuất khẩu, tạo việc làm, chuyển giao công nghệ (2024)", "B. Không đóng góp gì", "C. Chỉ đầu tư bất động sản", "D. Gây thất nghiệp"], "answer": "A", "explain": "FDI là động lực xuất khẩu (71,7%), tạo hàng triệu việc làm, đưa công nghệ, quản lí hiện đại vào Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kinh tế nhà nước giữ vai trò chủ đạo thể hiện ở:", "options": ["A. Nắm các ngành, lĩnh vực then chốt (điện, dầu khí, viễn thông, tài chính...)", "B. Nắm mọi ngành nghề", "C. Không còn vai trò", "D. Chỉ làm thương mại nhỏ"], "answer": "A", "explain": "Nhà nước nắm lĩnh vực then chốt, định hướng phát triển, bảo đảm an ninh kinh tế, ổn định vĩ mô.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Kim ngạch xuất khẩu 2024 đạt 405,53 tỉ USD, khu vực FDI chiếm 71,7%. Tính kim ngạch xuất khẩu của khu vực FDI (đơn vị tỉ USD, 1 chữ số thập phân).", "options": ["A. 290,8", "B. 114,6", "C. 200,0", "D. 350,0"], "answer": "A", "explain": "405,53 × 71,7% ≈ 290,77 ≈ 290,8 tỉ USD — FDI là trụ cột xuất khẩu.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để phát huy vai trò của kinh tế tư nhân (ngoài nhà nước), cần:", "options": ["A. Cải thiện môi trường kinh doanh, hỗ trợ vốn, công nghệ, thị trường", "B. Hạn chế phát triển", "C. Tăng thuế cao", "D. Không cần chính sách"], "answer": "A", "explain": "Kinh tế tư nhân là động lực quan trọng: cần thể chế thuận lợi, tiếp cận vốn, đất đai, công nghệ công bằng — phát triển mạnh mẽ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nền kinh tế có 3 thành phần chính.", "b) Tỉ trọng FDI và ngoài nhà nước đang tăng.", "c) FDI chiếm 71,7% kim ngạch xuất khẩu (2024).", "d) Chỉ có kinh tế nhà nước."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kinh tế nhà nước giữ vai trò chủ đạo.", "b) Kinh tế tư nhân là động lực quan trọng.", "c) FDI chuyển giao công nghệ, tạo việc làm.", "d) Nên xóa bỏ kinh tế ngoài nhà nước."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phát triển kinh tế nhiều thành phần là chủ trương nhất quán.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Xuất khẩu 405,53 tỉ USD, FDI chiếm 71,7%. Tính xuất khẩu của khu vực trong nước (đơn vị tỉ USD, 1 chữ số thập phân).", "answer": "114,8", "explain": "405,53 × (100% − 71,7%) = 405,53 × 28,3% ≈ 114,76 ≈ 114,8 tỉ USD — khu vực trong nước cần vươn lên.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vốn FDI thực hiện năm 2024 khoảng 25,4 tỉ USD, tăng 9,4% so với 2023. Tính vốn FDI thực hiện năm 2023 (đơn vị tỉ USD, 1 chữ số thập phân).", "answer": "23,2", "explain": "25,4 ÷ 1,094 ≈ 23,217 ≈ 23,2 tỉ USD — vốn thực hiện tăng cho thấy niềm tin nhà đầu tư.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Chuyển dịch cơ cấu theo lãnh thổ thể hiện ở:", "options": ["A. Hình thành vùng kinh tế trọng điểm, khu công nghiệp, hành lang kinh tế", "B. Mọi vùng giống nhau", "C. Không có sự phân hóa", "D. Chỉ phát triển đô thị"], "answer": "A", "explain": "Phân công lãnh thổ: vùng trọng điểm, khu công nghiệp, khu kinh tế ven biển, hành lang kinh tế — khai thác lợi thế từng vùng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cả nước có mấy vùng kinh tế trọng điểm?", "options": ["A. 4 vùng", "B. 2 vùng", "C. 6 vùng", "D. 8 vùng"], "answer": "A", "explain": "4 vùng kinh tế trọng điểm: Bắc Bộ, Trung Bộ, phía Nam và đồng bằng sông Cửu Long — động lực tăng trưởng của cả nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vùng kinh tế trọng điểm phía Nam gồm TP. Hồ Chí Minh và các tỉnh xung quanh. Vai trò của vùng là:", "options": ["A. Đầu tàu kinh tế, đóng góp lớn nhất vào GDP cả nước", "B. Chỉ phát triển nông nghiệp", "C. Không có vai trò", "D. Vùng nghèo nhất"], "answer": "A", "explain": "Vùng trọng điểm phía Nam là trung tâm công nghiệp, dịch vụ lớn nhất, đóng góp cao nhất vào GDP và xuất khẩu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khu công nghiệp, khu chế xuất tập trung chủ yếu ở:", "options": ["A. Đồng bằng, ven biển, gần đô thị lớn", "B. Vùng núi cao", "C. Hải đảo xa", "D. Vùng sâu"], "answer": "A", "explain": "Khu công nghiệp cần hạ tầng, lao động, cảng biển, thị trường — tập trung ở Đông Nam Bộ, đồng bằng sông Hồng, duyên hải.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một tỉnh miền núi muốn thu hút đầu tư công nghiệp. Lợi thế có thể khai thác là:", "options": ["A. Tài nguyên, lao động dồi dào, chính sách ưu đãi; cần hạ tầng và đào tạo", "B. Không có lợi thế nào", "C. Chỉ chờ hỗ trợ", "D. Không thể thu hút"], "answer": "A", "explain": "Miền núi: tài nguyên, đất đai, lao động rẻ + ưu đãi đầu tư; cần cải thiện hạ tầng, đào tạo nghề — thu hút công nghiệp chế biến.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để thu hẹp chênh lệch phát triển giữa các vùng, cần:", "options": ["A. Đầu tư có trọng điểm vào vùng khó khăn, liên kết vùng, phân công hợp lí", "B. Đầu tư dàn đều", "C. Chỉ đầu tư vùng giàu", "D. Bỏ mặc vùng nghèo"], "answer": "A", "explain": "Ưu tiên vùng khó khăn (hạ tầng, giáo dục, y tế), liên kết vùng để lan tỏa, mỗi vùng phát huy lợi thế — phát triển cân đối.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cả nước có 4 vùng kinh tế trọng điểm.", "b) Khu công nghiệp tập trung ở đồng bằng, ven biển.", "c) Vùng trọng điểm phía Nam là đầu tàu kinh tế.", "d) Mọi vùng phát triển như nhau, không cần phân công."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần phân công lãnh thổ hợp lí theo lợi thế từng vùng.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hành lang kinh tế kết nối các vùng, cửa khẩu.", "b) Khu kinh tế ven biển phát huy lợi thế biển.", "c) Liên kết vùng giúp phát triển cân đối.", "d) Vùng khó khăn không thể phát triển."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: với đầu tư đúng hướng, vùng khó khăn phát huy được lợi thế riêng.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Cả nước có 4 vùng kinh tế trọng điểm. Kể tên vùng kinh tế trọng điểm lớn nhất ở phía Nam (viết đầy đủ).", "answer": "Vùng kinh tế trọng điểm phía Nam", "explain": "4 vùng: Bắc Bộ, Trung Bộ, phía Nam, đồng bằng sông Cửu Long; vùng phía Nam là đầu tàu kinh tế cả nước.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một khu công nghiệp tạo 20000 việc làm cho 3 tỉnh lân cận theo tỉ lệ 5:3:2. Tỉnh nhận nhiều nhất được bao nhiêu nghìn việc làm (chỉ ghi số)?", "answer": "10", "explain": "20000 × 5/10 = 10000 = 10 nghìn việc làm — khu công nghiệp lan tỏa việc làm ra vùng xung quanh.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Tăng trưởng kinh tế được đo bằng chỉ tiêu nào?", "options": ["A. Tốc độ tăng GDP", "B. Dân số", "C. Diện tích", "D. Lượng mưa"], "answer": "A", "explain": "Tăng trưởng: tốc độ tăng GDP (tổng sản phẩm trong nước) — thước đo quy mô, tốc độ phát triển kinh tế.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phát triển bền vững là sự phát triển:", "options": ["A. Đáp ứng hiện tại mà không tổn hại khả năng của thế hệ tương lai", "B. Chỉ tăng GDP bằng mọi giá", "C. Hy sinh môi trường", "D. Không cần tăng trưởng"], "answer": "A", "explain": "Bền vững: hài hòa tăng trưởng kinh tế, bảo vệ môi trường, công bằng xã hội — cho hiện tại và tương lai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tăng trưởng nhanh nhưng ô nhiễm nặng, bất bình đẳng gia tăng là:", "options": ["A. Tăng trưởng thiếu bền vững", "B. Phát triển bền vững", "C. Lý tưởng", "D. Không có vấn đề"], "answer": "A", "explain": "Đánh đổi môi trường, xã hội lấy tăng trưởng là thiếu bền vững — phải trả giá đắt về sau (sức khỏe, khắc phục ô nhiễm).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để tăng trưởng bền vững, Việt Nam cần:", "options": ["A. Tăng trưởng xanh, kinh tế tuần hoàn, bảo vệ môi trường", "B. Khai thác cạn kiệt tài nguyên", "C. Chỉ tăng GDP", "D. Đóng cửa hội nhập"], "answer": "A", "explain": "Tăng trưởng xanh: hiệu quả tài nguyên, năng lượng sạch, tuần hoàn — vừa tăng trưởng vừa bảo vệ môi trường.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "GDP bình quân đầu người Việt Nam năm 2024 khoảng 4700 USD. Để đạt 10000 USD với tốc độ tăng 6%/năm, cần khoảng bao nhiêu năm (làm tròn đến hàng đơn vị)?", "options": ["A. 13", "B. 6", "C. 20", "D. 10"], "answer": "A", "explain": "4700 × (1,06)^n = 10000 → (1,06)^n ≈ 2,13 → n ≈ ln(2,13)/ln(1,06) ≈ 0,755/0,0583 ≈ 13 năm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Bẫy thu nhập trung bình là nguy cơ khi:", "options": ["A. Tăng trưởng chậm lại do năng suất thấp, không nâng cấp được cơ cấu kinh tế", "B. GDP quá cao", "C. Dân số quá ít", "D. Không có nguy cơ"], "answer": "A", "explain": "Nhiều nước mắc kẹt ở thu nhập trung bình vì không đổi mới công nghệ, nâng cao năng suất — Việt Nam cần vượt qua bằng đổi mới sáng tạo.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tăng trưởng đo bằng tốc độ tăng GDP.", "b) Phát triển bền vững hài hòa kinh tế – môi trường – xã hội.", "c) Tăng trưởng xanh là hướng đi đúng.", "d) Nên đánh đổi môi trường lấy tăng trưởng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tăng trưởng nhanh nhưng ô nhiễm là thiếu bền vững.", "b) Kinh tế tuần hoàn giúp bền vững.", "c) Cần nâng cao chất lượng tăng trưởng.", "d) Chỉ cần tốc độ, không cần chất lượng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chất lượng tăng trưởng (năng suất, hiệu quả) quan trọng hơn tốc độ đơn thuần.", "points": 1.0}, {"type": "short", "level": "VD", "q": "GDP bình quân đầu người tăng từ 4300 USD (2023) lên 4700 USD (2024). Tính tốc độ tăng (đơn vị %, 1 chữ số thập phân).", "answer": "9,3", "explain": "(4700 − 4300) ÷ 4300 × 100% ≈ 9,30 ≈ 9,3%.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một nền kinh tế tăng trưởng 7%/năm. Theo quy tắc 70, GDP tăng gấp đôi sau khoảng bao nhiêu năm (chỉ ghi số)?", "answer": "10", "explain": "70 ÷ 7 = 10 năm — quy tắc 70 ước tính thời gian tăng gấp đôi.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Hội nhập kinh tế quốc tế mang lại lợi ích nào?", "options": ["A. Mở rộng thị trường, thu hút vốn, công nghệ, học hỏi quản lí", "B. Mất chủ quyền", "C. Chỉ có hại", "D. Đóng cửa thị trường"], "answer": "A", "explain": "Hội nhập: xuất khẩu mở rộng, FDI vào, công nghệ, kĩ năng quản lí — động lực tăng trưởng, chuyển dịch cơ cấu.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Việt Nam đã tham gia các hiệp định thương mại tự do thế hệ mới như:", "options": ["A. CPTPP và EVFTA", "B. Chỉ WTO", "C. Không tham gia FTA nào", "D. Chỉ ASEAN"], "answer": "A", "explain": "CPTPP, EVFTA (và RCEP...) mở cửa thị trường lớn (EU, Nhật, Ca-na-đa...) với thuế suất ưu đãi — thúc đẩy xuất khẩu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thách thức của hội nhập đối với doanh nghiệp Việt Nam là:", "options": ["A. Cạnh tranh gay gắt, tiêu chuẩn cao về chất lượng, môi trường, lao động", "B. Không có thách thức", "C. Thị trường thu hẹp", "D. Được bảo hộ tuyệt đối"], "answer": "A", "explain": "Mở cửa: hàng ngoại cạnh tranh; xuất khẩu phải đáp ứng tiêu chuẩn khắt khe (xanh, sạch, lao động) — doanh nghiệp phải nâng cấp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để tận dụng FTA, doanh nghiệp cần:", "options": ["A. Nâng cao chất lượng, đáp ứng quy tắc xuất xứ, xây dựng thương hiệu", "B. Chỉ trông chờ ưu đãi", "C. Giữ nguyên cách làm cũ", "D. Không cần thay đổi"], "answer": "A", "explain": "Ưu đãi thuế chỉ có khi đáp ứng quy tắc xuất xứ, tiêu chuẩn kĩ thuật — doanh nghiệp phải đổi mới, nâng tầm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Xuất khẩu sang EU tăng 15% sau EVFTA, từ 40 tỉ USD lên bao nhiêu tỉ USD?", "options": ["A. 46,0", "B. 55,0", "C. 40,0", "D. 60,0"], "answer": "A", "explain": "40 × 1,15 = 46,0 tỉ USD — EVFTA mở rộng thị trường EU cho hàng Việt.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong hội nhập, Việt Nam cần tránh:", "options": ["A. Phụ thuộc quá mức vào một thị trường, gia công giá trị thấp", "B. Đa dạng hóa thị trường", "C. Nâng cao giá trị gia tăng", "D. Chủ động hội nhập"], "answer": "A", "explain": "Đa dạng hóa thị trường, nâng vị trí trong chuỗi giá trị (từ gia công lên thiết kế, thương hiệu) — hội nhập chủ động, bền vững.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hội nhập mở rộng thị trường, thu hút vốn, công nghệ.", "b) Việt Nam tham gia CPTPP, EVFTA.", "c) Hội nhập tạo sức ép cạnh tranh.", "d) Hội nhập chỉ có lợi, không có thách thức."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vừa cơ hội vừa thách thức.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Doanh nghiệp cần đáp ứng tiêu chuẩn xuất khẩu.", "b) Cần đa dạng hóa thị trường xuất khẩu.", "c) Nên nâng cao giá trị gia tăng, tránh gia công thuần túy.", "d) Chỉ cần ưu đãi thuế là đủ thành công."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần năng lực cạnh tranh thực chất.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Kim ngạch xuất nhập khẩu 2024 đạt 786,29 tỉ USD, tăng 15,4% so với 2023. Tính kim ngạch năm 2023 (đơn vị tỉ USD, 1 chữ số thập phân).", "answer": "681,3", "explain": "786,29 ÷ 1,154 ≈ 681,35 ≈ 681,3 tỉ USD.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Xuất siêu 2024 là 24,77 tỉ USD, năm thứ 9 liên tiếp xuất siêu. Tính tổng xuất siêu 9 năm nếu bình quân 20 tỉ USD/năm (đơn vị tỉ USD, chỉ ghi số).", "answer": "180", "explain": "20 × 9 = 180 tỉ USD — xuất siêu liên tục tăng dự trữ ngoại hối, ổn định vĩ mô.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Để thể hiện cơ cấu GDP theo ngành năm 2024, biểu đồ thích hợp nhất là:", "options": ["A. Biểu đồ tròn", "B. Biểu đồ đường", "C. Biểu đồ cột đơn", "D. Biểu đồ miền"], "answer": "A", "explain": "Cơ cấu (tỉ trọng) tại một thời điểm → biểu đồ tròn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để thể hiện sự chuyển dịch cơ cấu GDP giai đoạn 2015 – 2024, biểu đồ thích hợp nhất là:", "options": ["A. Biểu đồ miền", "B. Biểu đồ tròn đơn", "C. Biểu đồ đường đơn", "D. Biểu đồ cột đơn"], "answer": "A", "explain": "Chuyển dịch cơ cấu qua thời gian → biểu đồ miền (thể hiện cả quy mô và cơ cấu).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho bảng số liệu cơ cấu GDP (%): 2015: NLTS 15,0; CN-XD 33,0; DV 40,0; thuế 12,0. 2024: 11,86; 37,64; 42,36; 8,14. Nhận xét đúng là:", "options": ["A. Tỉ trọng NLTS giảm, CN-XD và DV tăng — chuyển dịch tích cực", "B. Không có chuyển dịch", "C. NLTS tăng", "D. Dịch vụ giảm"], "answer": "A", "explain": "NLTS: 15,0 → 11,86 (giảm); CN-XD: 33,0 → 37,64 (tăng); DV: 40,0 → 42,36 (tăng) — đúng hướng công nghiệp hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khi vẽ biểu đồ miền thể hiện chuyển dịch cơ cấu, cần lưu ý:", "options": ["A. Tổng các thành phần mỗi năm bằng 100%, sắp xếp thứ tự hợp lí", "B. Tổng mỗi năm khác nhau tùy ý", "C. Không cần chú giải", "D. Vẽ tùy hứng"], "answer": "A", "explain": "Biểu đồ miền: mỗi năm tổng 100%, các miền xếp chồng theo thứ tự (thường NLTS dưới cùng) — thể hiện rõ chuyển dịch.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho bảng số liệu: Tỉ trọng NLTS 2015: 15,0%; 2024: 11,86%. Vẽ biểu đồ tròn năm 2024, cung tròn của NLTS là bao nhiêu độ (1 chữ số thập phân)?", "options": ["A. 42,7", "B. 54,0", "C. 30,0", "D. 90,0"], "answer": "A", "explain": "11,86% × 360° = 42,696 ≈ 42,7°.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một học sinh nhận xét: Tỉ trọng NLTS giảm nên nông nghiệp kém quan trọng. Nhận xét này:", "options": ["A. Sai: tỉ trọng giảm nhưng giá trị tuyệt đối vẫn tăng, nông nghiệp vẫn là nền tảng", "B. Đúng hoàn toàn", "C. Không thể đánh giá", "D. Đúng một phần"], "answer": "A", "explain": "Tỉ trọng tương đối giảm do các ngành khác tăng nhanh hơn; giá trị tuyệt đối nông nghiệp vẫn tăng, bảo đảm an ninh lương thực — vai trò nền tảng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Biểu đồ tròn thích hợp thể hiện cơ cấu một năm.", "b) Biểu đồ miền thích hợp thể hiện chuyển dịch cơ cấu qua thời gian.", "c) Tổng các thành phần trong biểu đồ miền mỗi năm bằng 100%.", "d) Biểu đồ đường thích hợp thể hiện cơ cấu."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đường thể hiện xu hướng, không thể hiện cơ cấu.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Cho bảng số liệu cơ cấu GDP 2015 – 2024. Xét tính đúng, sai:", "statements": ["a) Tỉ trọng NLTS giảm dần.", "b) Tỉ trọng CN-XD và DV tăng dần.", "c) Chuyển dịch đúng hướng công nghiệp hóa.", "d) Tỉ trọng NLTS tăng dần."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Tỉ trọng CN-XD tăng từ 33,0% (2015) lên 37,64% (2024). Tính mức tăng (đơn vị điểm phần trăm, 2 chữ số thập phân).", "answer": "4,64", "explain": "37,64 − 33,0 = 4,64 điểm phần trăm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vẽ 2 biểu đồ tròn cơ cấu GDP năm 2015 và 2024 có bán kính bằng nhau. Nhận xét nào đúng?", "answer": "Cơ cấu chuyển dịch nhưng quy mô GDP chưa thể hiện", "explain": "Bán kính bằng nhau chỉ thể hiện cơ cấu, không thể hiện quy mô tăng — muốn thể hiện quy mô phải vẽ bán kính khác nhau theo tổng giá trị.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Cơ cấu GDP của Việt Nam năm 2024 (NLTS 11,86%; CN-XD 37,64%; DV 42,36%) cho thấy Việt Nam là nước:", "options": ["A. Đang công nghiệp hóa (tỉ trọng NLTS thấp, CN-DV cao)", "B. Thuần nông nghiệp", "C. Đã hậu công nghiệp", "D. Không phát triển"], "answer": "A", "explain": "NLTS chỉ còn 11,86%, CN-DV chiếm 80% — cơ cấu của nước đang công nghiệp hóa (nước phát triển: DV thường trên 70%).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "So với các nước phát triển (dịch vụ trên 70% GDP), Việt Nam cần:", "options": ["A. Tiếp tục chuyển dịch: giảm NLTS, tăng dịch vụ hiện đại", "B. Quay lại nông nghiệp", "C. Giữ nguyên cơ cấu", "D. Giảm dịch vụ"], "answer": "A", "explain": "Hướng tới cơ cấu hiện đại: dịch vụ chất lượng cao (tài chính, logistics, du lịch, công nghệ) tăng tỉ trọng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tốc độ tăng GDP 7,09% của Việt Nam năm 2024 so với thế giới (khoảng 3%) cho thấy:", "options": ["A. Việt Nam tăng trưởng nhanh hơn nhiều bình quân thế giới", "B. Việt Nam tăng trưởng chậm", "C. Bằng thế giới", "D. Không so sánh được"], "answer": "A", "explain": "7,09% gấp hơn 2 lần bình quân thế giới — Việt Nam là điểm sáng tăng trưởng, thu hút đầu tư.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thu hút FDI của Việt Nam tăng nhờ:", "options": ["A. Tăng trưởng cao, ổn định chính trị, hội nhập sâu, nhân công cạnh tranh", "B. Ngẫu nhiên", "C. Không có lợi thế", "D. Chỉ nhờ tài nguyên"], "answer": "A", "explain": "Tổng hợp lợi thế: tăng trưởng cao, ổn định, FTA rộng, chi phí cạnh tranh — Việt Nam là điểm đến FDI hàng đầu khu vực.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "GDP bình quân đầu người Việt Nam 2024 khoảng 4700 USD, Thái Lan khoảng 7300 USD (minh họa). Tỉ số GDP/người Việt Nam so với Thái Lan là bao nhiêu % (1 chữ số thập phân)?", "options": ["A. 64,4", "B. 155,3", "C. 50,0", "D. 100,0"], "answer": "A", "explain": "4700 ÷ 7300 × 100% ≈ 64,38 ≈ 64,4% — còn khoảng cách, cần tăng trưởng nhanh, bền vững để thu hẹp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để tránh bẫy thu nhập trung bình, Việt Nam cần ưu tiên:", "options": ["A. Đổi mới sáng tạo, nâng cao năng suất, chuyển sang giá trị gia tăng cao", "B. Dựa vào lao động giá rẻ mãi", "C. Chỉ khai thác tài nguyên", "D. Hạn chế hội nhập"], "answer": "A", "explain": "Vượt bẫy: từ lợi thế lao động rẻ sang lợi thế năng suất, công nghệ, đổi mới sáng tạo — nâng cấp chuỗi giá trị.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cơ cấu GDP cho thấy Việt Nam đang công nghiệp hóa.", "b) Tốc độ tăng 7,09% cao hơn bình quân thế giới.", "c) Cần tiếp tục chuyển dịch sang dịch vụ hiện đại.", "d) Việt Nam đã là nước phát triển."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: Việt Nam là nước đang phát triển, thu nhập trung bình.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) FDI vào Việt Nam nhờ nhiều lợi thế tổng hợp.", "b) Cần nâng cao năng suất để thu hẹp khoảng cách.", "c) Đổi mới sáng tạo giúp vượt bẫy thu nhập trung bình.", "d) Nên dựa mãi vào lao động giá rẻ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: lợi thế giá rẻ mất dần — phải chuyển sang năng suất, công nghệ.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Tốc độ tăng GDP Việt Nam 7,09%, bình quân thế giới 3,2%. Tính chênh lệch (đơn vị điểm phần trăm, 2 chữ số thập phân).", "answer": "3,89", "explain": "7,09 − 3,2 = 3,89 điểm phần trăm — vượt trội.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Vốn FDI đăng kí năm 2024 khoảng 38,2 tỉ USD. Bình quân mỗi tháng khoảng bao nhiêu tỉ USD (1 chữ số thập phân)?", "answer": "3,2", "explain": "38,2 ÷ 12 ≈ 3,183 ≈ 3,2 tỉ USD/tháng — dòng vốn đầu tư mạnh mẽ.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Để thúc đẩy chuyển dịch cơ cấu kinh tế, Nhà nước cần:", "options": ["A. Hoàn thiện thể chế, đầu tư hạ tầng, hỗ trợ đổi mới sáng tạo", "B. Can thiệp trực tiếp mọi hoạt động", "C. Không cần chính sách", "D. Bao cấp toàn bộ"], "answer": "A", "explain": "Nhà nước kiến tạo: thể chế thuận lợi, hạ tầng, hỗ trợ R và D, đào tạo — thị trường dẫn dắt chuyển dịch.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chính sách thu hút đầu tư vào vùng khó khăn gồm:", "options": ["A. Ưu đãi thuế, đất đai, hạ tầng cho vùng miền núi, hải đảo", "B. Đánh thuế cao vùng khó khăn", "C. Không ưu đãi", "D. Cấm đầu tư"], "answer": "A", "explain": "Ưu đãi đầu tư vùng khó khăn: miễn giảm thuế, hỗ trợ hạ tầng — thu hẹp chênh lệch vùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hỗ trợ doanh nghiệp nhỏ và vừa vì:", "options": ["A. Tạo nhiều việc làm, năng động, là xương sống của nền kinh tế", "B. Không quan trọng", "C. Chỉ doanh nghiệp lớn mới cần", "D. Nên xóa bỏ"], "answer": "A", "explain": "DNNVV chiếm đa số, tạo việc làm lớn — hỗ trợ vốn, công nghệ, thị trường giúp chúng lớn mạnh, chuyển dịch cơ cấu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát triển kinh tế số góp phần chuyển dịch cơ cấu vì:", "options": ["A. Tạo ngành mới, nâng cao năng suất mọi ngành", "B. Chỉ là trào lưu", "C. Không ảnh hưởng", "D. Làm giảm năng suất"], "answer": "A", "explain": "Kinh tế số: thương mại điện tử, fintech, số hóa sản xuất — ngành mới tỉ trọng tăng nhanh, lan tỏa năng suất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một tỉnh ưu đãi thuế 4 năm cho dự án công nghiệp công nghệ cao. Đây là chính sách:", "options": ["A. Thu hút đầu tư, chuyển dịch sang công nghiệp giá trị cao", "B. Giảm thu ngân sách vô ích", "C. Không hiệu quả", "D. Ưu đãi sai đối tượng"], "answer": "A", "explain": "Ưu đãi có chọn lọc thu hút công nghệ cao — chuyển dịch cơ cấu theo hướng hiện đại, tăng thu lâu dài.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong bối cảnh mới, động lực chuyển dịch cơ cấu quan trọng nhất là:", "options": ["A. Đổi mới sáng tạo, chuyển đổi số, kinh tế xanh", "B. Mở rộng đất đai", "C. Tăng lao động phổ thông", "D. Khai thác tài nguyên thô"], "answer": "A", "explain": "Động lực mới: khoa học công nghệ, số hóa, xanh hóa — nâng cao năng suất, chất lượng tăng trưởng, vượt bẫy thu nhập trung bình.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhà nước kiến tạo thúc đẩy chuyển dịch cơ cấu.", "b) Cần ưu đãi đầu tư vùng khó khăn.", "c) DNNVV quan trọng, cần hỗ trợ.", "d) Không cần chính sách gì."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kinh tế số tạo ngành mới, nâng năng suất.", "b) Đổi mới sáng tạo là động lực chuyển dịch.", "c) Ưu đãi có chọn lọc thu hút công nghệ cao.", "d) Nên dựa vào khai thác tài nguyên thô."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tài nguyên có hạn — phải chuyển sang tri thức, công nghệ.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Tỉ trọng kinh tế số trong GDP khoảng 15% (minh họa), mục tiêu 2030 là 30%. Tính mức tăng cần đạt (đơn vị điểm phần trăm, chỉ ghi số).", "answer": "15", "explain": "30 − 15 = 15 điểm phần trăm — tham vọng chuyển đổi số mạnh mẽ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một dự án công nghệ cao được ưu đãi thuế 10% thay vì 20% trong 4 năm, lợi nhuận 100 tỉ đồng/năm. Số thuế được miễn mỗi năm là bao nhiêu tỉ đồng (chỉ ghi số)?", "answer": "10", "explain": "100 × (20% − 10%) = 10 tỉ đồng/năm — ưu đãi khuyến khích đầu tư công nghệ cao.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Nội dung nào sau đây KHÔNG thuộc bài Chuyển dịch cơ cấu kinh tế?", "options": ["A. Quá trình feralit", "B. Chuyển dịch theo ngành", "C. Chuyển dịch theo thành phần", "D. Chuyển dịch theo lãnh thổ"], "answer": "A", "explain": "Quá trình feralit thuộc bài Thiên nhiên nhiệt đới ẩm gió mùa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ba hướng chuyển dịch cơ cấu kinh tế là:", "options": ["A. Ngành, thành phần kinh tế, lãnh thổ", "B. Chỉ theo ngành", "C. Chỉ theo lãnh thổ", "D. Ngành và dân số"], "answer": "A", "explain": "Ba hướng: theo ngành, theo thành phần kinh tế, theo lãnh thổ — toàn diện, đồng bộ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các phát biểu: (1) NLTS giảm còn 11,86%; (2) DV cao nhất 42,36%; (3) FDI chiếm 71,7% xuất khẩu; (4) Có 4 vùng kinh tế trọng điểm. Số phát biểu đúng (2024) là:", "options": ["A. 1", "B. 2", "C. 3", "D. 4"], "answer": "D", "explain": "Cả 4 đều đúng theo số liệu năm 2024.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa chuyển dịch cơ cấu và tăng trưởng là:", "options": ["A. Cơ cấu hợp lí thúc đẩy tăng trưởng nhanh, bền vững", "B. Không liên quan", "C. Chuyển dịch làm giảm tăng trưởng", "D. Chỉ cần tăng trưởng, không cần cơ cấu"], "answer": "A", "explain": "Cơ cấu tiến bộ (CN-DV cao, năng suất lớn) → tăng trưởng nhanh, chất lượng cao — quan hệ biện chứng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một tỉnh có cơ cấu: NLTS 40%, CN-XD 25%, DV 35%. Đánh giá và hướng chuyển dịch:", "options": ["A. Cơ cấu còn lạc hậu; cần giảm NLTS, tăng CN-DV", "B. Cơ cấu hiện đại", "C. Giữ nguyên", "D. Tăng NLTS"], "answer": "A", "explain": "NLTS 40% là cao (cả nước 11,86%) — cần công nghiệp hóa, đa dạng hóa để chuyển dịch.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tổng kết: Để chuyển dịch cơ cấu thành công, Việt Nam cần đồng bộ:", "options": ["A. Thể chế, hạ tầng, nhân lực, công nghệ, hội nhập", "B. Chỉ cần vốn", "C. Chỉ cần lao động", "D. Tự phát là đủ"], "answer": "A", "explain": "Chuyển dịch là quá trình tổng thể: thể chế kiến tạo, hạ tầng đồng bộ, nhân lực chất lượng, công nghệ, hội nhập sâu — đồng bộ mới thành công.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định ôn tập sau:", "statements": ["a) Chuyển dịch theo 3 hướng: ngành, thành phần, lãnh thổ.", "b) GDP 2024 tăng 7,09%.", "c) Cơ cấu đang chuyển dịch đúng hướng.", "d) Không cần chuyển dịch nữa."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần tiếp tục chuyển dịch sâu hơn (hiện đại hóa).", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) NLTS giảm nhưng vẫn là nền tảng.", "b) FDI quan trọng nhưng cần nâng nội lực.", "c) Chuyển dịch phải gắn với bền vững.", "d) Chỉ cần tốc độ tăng trưởng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần cả tốc độ và chất lượng, bền vững.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Kể tên ba hướng chuyển dịch cơ cấu kinh tế (viết cách nhau bằng dấu phẩy).", "answer": "Theo ngành, theo thành phần kinh tế, theo lãnh thổ", "explain": "Ba hướng: ngành; thành phần kinh tế; lãnh thổ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho bảng số liệu: Tỉ trọng DV trong GDP: 2020: 41,0%; 2024: 42,36%. Tính mức tăng bình quân mỗi năm (điểm phần trăm, 2 chữ số thập phân).", "answer": "0,34", "explain": "(42,36 − 41,0) ÷ 4 = 1,36 ÷ 4 = 0,34 điểm phần trăm/năm.", "points": 0.5}]}]}
