truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhập khẩu chủ yếu là tư liệu sản xuất.", "b) Xuất siêu 24,77 tỉ USD năm 2024.", "c) Xuất siêu tăng dự trữ ngoại hối.", "d) Việt Nam nhập siêu."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: xuất siêu năm thứ 9 liên tiếp.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhập máy móc giúp hiện đại hóa.", "b) Cần xuất hàng giá trị cao.", "c) Xuất siêu ổn định vĩ mô.", "d) Nên hạn chế nhập khẩu công nghệ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần nhập công nghệ tiên tiến.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Tỉ lệ xuất siêu trên xuất khẩu là bao nhiêu % (24,77/405,53; 1 chữ số thập phân)?", "answer": "6,1", "explain": "24,77 ÷ 405,53 × 100% ≈ 6,11 ≈ 6,1%.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Dự trữ ngoại hối tăng thêm 24,77 tỉ USD. Nếu trước đó 100 tỉ USD, tổng là bao nhiêu tỉ USD (1 chữ số thập phân)?", "answer": "124,8", "explain": "100 + 24,77 = 124,77 ≈ 124,8 tỉ USD (minh họa).", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "EVFTA là hiệp định thương mại tự do giữa Việt Nam và:", "options": ["A. Liên minh châu Âu (EU)", "B. Hoa Kỳ", "C. Trung Quốc", "D. Nhật Bản"], "answer": "A", "explain": "EVFTA (2020): Việt Nam – EU — thuế 0% cho nhiều mặt hàng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "CPTPP gồm các nước vành đai:", "options": ["A. Thái Bình Dương (11 nước)", "B. Chỉ châu Âu", "C. Chỉ châu Phi", "D. Toàn thế giới"], "answer": "A", "explain": "CPTPP: 11 nước Thái Bình Dương — thị trường rộng, tiêu chuẩn cao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "EVFTA giúp xuất khẩu Việt Nam vì:", "options": ["A. Thuế giảm về 0%, thị trường EU 450 triệu dân", "B. Tăng thuế", "C. Thu hẹp thị trường", "D. Không tác động"], "answer": "A", "explain": "Ưu đãi thuế + thị trường lớn, sức mua cao — dệt may, da giày, nông sản hưởng lợi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thách thức từ các FTA thế hệ mới là:", "options": ["A. Tiêu chuẩn cao (xanh, lao động, xuất xứ)", "B. Không có thách thức", "C. Thị trường dễ tính", "D. Không cần đổi mới"], "answer": "A", "explain": "Hàng rào xanh, lao động, quy tắc xuất xứ — doanh nghiệp phải nâng tầm.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Thuế giày xuất sang EU từ 10% về 0%. Đôi giày 50 USD. Tiết kiệm là bao nhiêu USD (chỉ ghi số)?", "options": ["A. 5", "B. 50", "C. 0", "D. 10"], "answer": "A", "explain": "50 × 10% = 5 USD/đôi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để tận dụng tối đa FTA, doanh nghiệp cần:", "options": ["A. Đáp ứng xuất xứ, tiêu chuẩn xanh, xây dựng thương hiệu", "B. Chỉ cần giá rẻ", "C. Không cần thay đổi", "D. Tránh FTA"], "answer": "A", "explain": "Tận dụng: C/O, xanh hóa, thương hiệu — biến ưu đãi thành lợi thế thực.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) EVFTA là với EU.", "b) CPTPP có 11 nước.", "c) FTA giảm thuế, mở thị trường.", "d) FTA không có tác động."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cần đáp ứng quy tắc xuất xứ.", "b) Tiêu chuẩn xanh là thách thức.", "c) Thương hiệu nâng giá trị.", "d) Chỉ giá rẻ là đủ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Xuất khẩu sang EU 50 tỉ USD (minh họa), thuế bình quân giảm 5%. Tiết kiệm là bao nhiêu tỉ USD (1 chữ số thập phân)?", "answer": "2,5", "explain": "50 × 5% = 2,5 tỉ USD.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Việt Nam tham gia 16 FTA (minh họa). Mỗi FTA mở thêm 2 thị trường mới. Tổng thị trường mới là bao nhiêu (chỉ ghi số)?", "answer": "32", "explain": "16 × 2 = 32 thị trường (minh họa).", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Tài nguyên du lịch tự nhiên gồm:", "options": ["A. Biển, núi, hang động, khí hậu, sinh vật", "B. Nhà máy", "C. Khu công nghiệp", "D. Mỏ than"], "answer": "A", "explain": "Tự nhiên: vịnh Hạ Long, Phong Nha, biển, núi — nền tảng du lịch.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tài nguyên du lịch nhân văn gồm:", "options": ["A. Di sản, lễ hội, làng nghề, ẩm thực", "B. Rừng", "C. Biển", "D. Sông"], "answer": "A", "explain": "Nhân văn: Huế, Hội An, Mỹ Sơn, lễ hội, ẩm thực — bản sắc văn hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vịnh Hạ Long (Quảng Ninh) là di sản:", "options": ["A. Thiên nhiên thế giới", "B. Văn hóa thế giới", "C. Không phải di sản", "D. Di sản tư liệu"], "answer": "A", "explain": "Hạ Long: di sản thiên nhiên (1994, 2000) — kỳ quan, thu hút khách quốc tế hàng đầu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phố cổ Hội An (Quảng Nam) là di sản:", "options": ["A. Văn hóa thế giới", "B. Thiên nhiên thế giới", "C. Không phải di sản", "D. Công viên địa chất"], "answer": "A", "explain": "Hội An: di sản văn hóa (1999) — thương cảng sầm uất, kiến trúc độc đáo.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Việt Nam có 8 di sản thế giới được UNESCO công nhận (minh họa). Tỉ lệ di sản văn hóa (5) là bao nhiêu % (chỉ ghi số)?", "options": ["A. 62,5", "B. 50", "C. 37,5", "D. 100"], "answer": "A", "explain": "5 ÷ 8 × 100% = 62,5%.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để phát huy tài nguyên du lịch, cần:", "options": ["A. Bảo tồn, quy hoạch, sản phẩm đặc sắc, quảng bá", "B. Khai thác cạn kiệt", "C. Xây dựng bừa bãi", "D. Không cần bảo vệ"], "answer": "A", "explain": "Bền vững: bảo tồn di sản, sản phẩm đặc trưng, thương hiệu — phát triển lâu dài.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tài nguyên du lịch gồm tự nhiên và nhân văn.", "b) Hạ Long là di sản thiên nhiên.", "c) Hội An là di sản văn hóa.", "d) Việt Nam không có tài nguyên du lịch."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: rất phong phú.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cần bảo tồn di sản.", "b) Sản phẩm đặc sắc thu hút khách.", "c) Quảng bá quan trọng.", "d) Nên xây dựng bừa bãi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một di sản đón 2 triệu lượt khách/năm, vé 200 nghìn đồng. Doanh thu vé là bao nhiêu tỉ đồng (chỉ ghi số)?", "answer": "400", "explain": "200000 × 2000000 = 400 tỉ đồng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "8 di sản, mỗi di sản cần 50 tỉ đồng bảo tồn/năm. Tổng kinh phí là bao nhiêu tỉ đồng (chỉ ghi số)?", "answer": "400", "explain": "8 × 50 = 400 tỉ đồng — đầu tư bảo tồn.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Thị trường xuất khẩu lớn nhất của Việt Nam hiện nay là:", "options": ["A. Hoa Kỳ", "B. Nhật Bản", "C. Trung Quốc", "D. Liên minh châu Âu (EU)"], "answer": "A", "explain": "Hoa Kỳ là thị trường xuất khẩu lớn nhất của Việt Nam (chiếm khoảng 30% kim ngạch xuất khẩu); Trung Quốc là thị trường nhập khẩu lớn nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Loại hình du lịch đặc trưng của Việt Nam là:", "options": ["A. Biển, văn hóa, sinh thái", "B. Chỉ du lịch núi tuyết", "C. Chỉ sa mạc", "D. Không có đặc trưng"], "answer": "A", "explain": "Biển (Nha Trang, Phú Quốc), văn hóa (Huế, Hội An), sinh thái (rừng, hang động).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Du lịch MICE là du lịch:", "options": ["A. Kết hợp hội nghị, hội thảo, sự kiện", "B. Chỉ nghỉ dưỡng", "C. Chỉ phượt", "D. Không tồn tại"], "answer": "A", "explain": "MICE: Meetings, Incentives, Conferences, Exhibitions — khách chi tiêu cao.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chính sách thị thực thông thoáng giúp du lịch vì:", "options": ["A. Khách quốc tế đến dễ dàng hơn", "B. Hạn chế khách", "C. Không tác động", "D. Tăng thủ tục"], "answer": "A", "explain": "Visa điện tử, miễn visa: rào cản giảm — khách tăng vọt 2024.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Khách quốc tế chi tiêu trung bình 1000 USD (minh họa). Tổng thu từ 17,6 triệu lượt là bao nhiêu tỉ USD (1 chữ số thập phân)?", "options": ["A. 17,6", "B. 10,0", "C. 25,0", "D. 8,8"], "answer": "A", "explain": "17,6 × 1000 USD = 17,6 tỉ USD.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để du lịch thành ngành kinh tế mũi nhọn, cần:", "options": ["A. Chất lượng, bền vững, thương hiệu, liên kết vùng", "B. Chỉ tăng số lượng", "C. Phá giá", "D. Không đầu tư"], "answer": "A", "explain": "Mũi nhọn: chi tiêu/khách cao, lưu trú dài, bền vững — chất lượng hơn số lượng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Khách quốc tế 17,6 triệu lượt (2024).", "b) Du lịch biển, văn hóa là đặc trưng.", "c) Visa thông thoáng thúc đẩy du lịch.", "d) Du lịch suy giảm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phục hồi mạnh.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) MICE là du lịch hội nghị.", "b) Cần du lịch chất lượng cao.", "c) Liên kết vùng tạo tour đa dạng.", "d) Chỉ cần tăng số lượng khách."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Khách nội địa 110 triệu lượt (minh họa), gấp bao nhiêu lần khách quốc tế 17,6 triệu (1 chữ số thập phân)?", "answer": "6,3", "explain": "110 ÷ 17,6 ≈ 6,25 ≈ 6,3 lần — nội địa là trụ cột.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Mục tiêu 25 triệu lượt khách quốc tế, hiện 17,6 triệu. Cần tăng bao nhiêu % (1 chữ số thập phân)?", "answer": "42,0", "explain": "(25 − 17,6) ÷ 17,6 × 100% ≈ 42,05 ≈ 42,0%.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trên Atlat, các cửa khẩu quốc tế được thể hiện bằng:", "options": ["A. Kí hiệu riêng trên biên giới", "B. Đường đẳng trị", "C. Biểu đồ tròn", "D. Không thể hiện"], "answer": "A", "explain": "Cửa khẩu: Lào Cai, Lạng Sơn, Móng Cái, Tây Ninh... — giao thương biên giới.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dựa vào Atlat, trung tâm thương mại lớn nhất là:", "options": ["A. TP. Hồ Chí Minh", "B. Huế", "C. Vinh", "D. Buôn Ma Thuột"], "answer": "A", "explain": "TP. Hồ Chí Minh: đầu mối thương mại, xuất nhập khẩu lớn nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dựa vào Atlat, các điểm du lịch dày đặc ở:", "options": ["A. Duyên hải miền Trung, đồng bằng sông Hồng, Đông Nam Bộ", "B. Tây Bắc thưa thớt", "C. Chỉ một nơi", "D. Không có"], "answer": "A", "explain": "Du lịch theo tài nguyên: biển miền Trung, văn hóa đồng bằng sông Hồng, đô thị Đông Nam Bộ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dựa vào Atlat, tuyến du lịch di sản miền Trung gồm:", "options": ["A. Huế – Đà Nẵng – Hội An – Mỹ Sơn", "B. Chỉ Hà Nội", "C. Chỉ TP. Hồ Chí Minh", "D. Không có tuyến"], "answer": "A", "explain": "Con đường di sản: cố đô Huế, phố cổ Hội An, thánh địa Mỹ Sơn — tour đặc sắc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Dựa vào Atlat, giải thích vì sao thương mại biên giới phát triển ở Lạng Sơn, Lào Cai:", "options": ["A. Cửa khẩu với Trung Quốc, nhu cầu trao đổi lớn", "B. Ngẫu nhiên", "C. Tài nguyên khoáng sản", "D. Du lịch biển"], "answer": "A", "explain": "Cửa khẩu quốc tế với Trung Quốc — thương mại biên giới sôi động.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một học sinh dùng Atlat lập tour: Hà Nội – Hạ Long – Huế – Hội An – Nha Trang. Đây là tour:", "options": ["A. Xuyên Việt kết hợp văn hóa – biển", "B. Chỉ miền Bắc", "C. Chỉ du lịch sinh thái", "D. Không hợp lí"], "answer": "A", "explain": "Kết hợp di sản (Huế, Hội An) + biển (Hạ Long, Nha Trang) — tour xuyên Việt đặc sắc.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Atlat thể hiện cửa khẩu bằng kí hiệu.", "b) TP. Hồ Chí Minh là trung tâm thương mại lớn nhất.", "c) Du lịch theo tài nguyên.", "d) Atlat không có trang thương mại, du lịch."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thương mại biên giới ở cửa khẩu.", "b) Tuyến di sản miền Trung đặc sắc.", "c) Có thể lập tour từ Atlat.", "d) Mọi nơi du lịch như nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Trên Atlat, đếm được 4 di sản ở miền Trung và 1 ở Tây Nguyên. Tỉ số là bao nhiêu (dạng a/b)?", "answer": "4/1", "explain": "4 ÷ 1 = 4/1.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tour 7 ngày qua 5 điểm, mỗi điểm 1,4 ngày. Tổng thời gian tham quan là bao nhiêu ngày (chỉ ghi số)?", "answer": "7", "explain": "5 × 1,4 = 7 ngày.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Du lịch bền vững là du lịch:", "options": ["A. Bảo vệ môi trường, văn hóa; cộng đồng hưởng lợi", "B. Khai thác cạn kiệt", "C. Xây dựng bừa bãi", "D. Không cần bảo vệ"], "answer": "A", "explain": "Bền vững: kinh tế + môi trường + văn hóa + cộng đồng — phát triển lâu dài.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Du lịch cộng đồng là:", "options": ["A. Người dân địa phương làm du lịch, hưởng lợi", "B. Chỉ công ty lớn", "C. Không có dân địa phương", "D. Không tồn tại"], "answer": "A", "explain": "Homestay, làng du lịch: dân làm chủ — thu nhập, giữ văn hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quá tải du lịch gây:", "options": ["A. Ô nhiễm, hư hại di sản, mất bản sắc", "B. Không ảnh hưởng", "C. Chỉ có lợi", "D. Nên quá tải"], "answer": "A", "explain": "Quá tải: rác, xói mòn, thương mại hóa — cần giới hạn sức chứa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Du lịch xanh là:", "options": ["A. Thân thiện môi trường, tiết kiệm tài nguyên", "B. Sơn màu xanh", "C. Chỉ trồng cây", "D. Không tồn tại"], "answer": "A", "explain": "Xanh: năng lượng sạch, giảm rác thải nhựa, bảo tồn — xu thế toàn cầu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một điểm du lịch sức chứa 10000 lượt/ngày, đón 12000 lượt. Tỉ lệ quá tải là bao nhiêu % (chỉ ghi số)?", "options": ["A. 20", "B. 120", "C. 100", "D. 10"], "answer": "A", "explain": "(12000 − 10000) ÷ 10000 × 100% = 20% — cần hạn chế.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để cân bằng phát triển và bảo tồn di sản, cần:", "options": ["A. Quy hoạch sức chứa, phí tham quan cho bảo tồn, giáo dục du khách", "B. Đón càng nhiều càng tốt", "C. Không cần bảo tồn", "D. Đóng cửa di sản"], "answer": "A", "explain": "Quản lí: giới hạn khách, phí bảo tồn, ý thức — di sản sống mãi.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Du lịch bền vững bảo vệ môi trường, văn hóa.", "b) Du lịch cộng đồng dân hưởng lợi.", "c) Quá tải gây hư hại.", "d) Nên khai thác cạn kiệt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cần giới hạn sức chứa.", "b) Phí tham quan góp phần bảo tồn.", "c) Du lịch xanh là xu thế.", "d) Càng đông khách càng tốt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quá tải hủy hoại.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Phí bảo tồn 10% giá vé 200 nghìn đồng. Số tiền ch n", "D. Cấm TMĐT"], "answer": "A", "explain": "Khung pháp lí + thực thi + hạ tầng — TMĐT bền vững, công bằng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) TMĐT mua bán qua internet.", "b) Tiện lợi, nhiều lựa chọn.", "c) Có thách thức hàng giả, lừa đảo.", "d) TMĐT không tồn tại."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cần chống hàng giả online.", "b) Bảo vệ dữ liệu cá nhân.", "c) Livestream thúc đẩy bán hàng.", "d) Không cần quản lí TMĐT."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Đơn hàng trung bình 200 nghìn đồng, 1000 đơn/ngày. Doanh thu là bao nhiêu triệu đồng (chỉ ghi số)?", "answer": "200", "explain": "200000 × 1000 = 200 triệu đồng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tỉ lệ hoàn hàng 5%. Trong 2000 đơn, số đơn hoàn là bao nhiêu (chỉ ghi số)?", "answer": "100", "explain": "2000 × 5% = 100 đơn.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Nội dung nào sau đây KHÔNG thuộc bài Thương mại và du lịch?", "options": ["A. Khai thác than", "B. Nội thương", "C. Ngoại thương", "D. Du lịch"], "answer": "A", "explain": "Khai thác than thuộc công nghiệp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai lĩnh vực chính của bài là:", "options": ["A. Thương mại và du lịch", "B. Nông nghiệp và công nghiệp", "C. Chỉ thương mại", "D. Chỉ du lịch"], "answer": "A", "explain": "Bài 21: Thương mại (nội, ngoại) và Du lịch (tài nguyên, phát triển).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các phát biểu: (1) Xuất khẩu 405,53 tỉ USD; (2) Xuất siêu 24,77 tỉ USD; (3) Khách quốc tế 17,6 triệu lượt; (4) FDI chiếm 71,7% xuất khẩu. Số phát biểu đúng là:", "options": ["A. 1", "B. 2", chấp nhận hai tên đúng).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Xuất khẩu tăng 12%/năm trong 2 năm. Chỉ số năm thứ 2 so với gốc (100) là bao nhiêu (1 chữ số thập phân)?", "answer": "125,4", "explain": "100 × 1,12² = 125,44 ≈ 125,4.", "points": 0.5}]}]}</script>
