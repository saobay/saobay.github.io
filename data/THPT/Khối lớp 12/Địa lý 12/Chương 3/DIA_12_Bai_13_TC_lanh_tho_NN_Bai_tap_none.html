n, Đông Nam Bộ, đồng bằng sông Cửu Long (chấp nhận hai tên đúng).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vùng nông nghiệp có 3 hướng chuyên môn hóa chính. Mỗi hướng cần một trung tâm nghiên cứu. Cần bao nhiêu trung tâm (chỉ ghi số)?", "answer": "3", "explain": "3 hướng → 3 trung tâm — đầu tư khoa học theo chuyên môn hóa vùng.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Đông Nam Bộ chuyên môn hóa về:", "options": ["A. Cây công nghiệp (cao su, điều), chăn nuôi", "B. Lúa là chính", "C. Chè", "D. Cây vụ đông"], "answer": "A", "explain": "Đông Nam Bộ: đất xám phù hợp cao su, điều; chăn nuôi tập trung cung cấp cho TP. Hồ Chí Minh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Duyên hải Nam Trung Bộ chuyên môn hóa về:", "options": ["A. Nho, thanh long, chăn nuôi bò, đánh bắt thủy sản", "B. Cà phê", "C. Lúa là chính", "D. Chè"], "answer": "A", "explain": "Khí hậu khô nóng: nho (Ninh Thuận), thanh long (Bình Thuận), bò, thủy sản — chuyên môn hóa theo điều kiện.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bắc Trung Bộ chuyên môn hóa về:", "options": ["A. Lúa, lạc, vừng, chăn nuôi trâu bò, thủy sản", "B. Cà phê", "C. Cao su", "D. Cây vụ đông"], "answer": "A", "explain": "Bắc Trung Bộ: đồng bằng nhỏ hẹp trồng lúa, lạc; đồi núi chăn nuôi; ven biển thủy sản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đồng bằng sông Hồng chuyên môn hóa về:", "options": ["A. Lúa, rau màu vụ đông, chăn nuôi lợn, gia cầm", "B. Cà phê", "C. Cao su", "D. Hồ tiêu"], "answer": "A", "explain": "Đồng bằng sông Hồng: lúa thâm canh, vụ đông rau màu ôn đới, chăn nuôi tập trung — chuyên môn hóa đa dạng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao mỗi vùng nông nghiệp có hướng chuyên môn hóa khác nhau?", "options": ["A. Do điều kiện tự nhiên, KT-XH khác nhau tạo lợi thế so sánh khác nhau", "B. Ngẫu nhiên", "C. Do chỉ đạo giống nhau", "D. Không có nguyên nhân"], "answer": "A", "explain": "Lợi thế so sánh: đất, khí hậu, lao động, thị trường khác nhau → chuyên môn hóa khác nhau — quy luật phân công.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Liên kết giữa các vùng nông nghiệp (vùng nguyên liệu – vùng chế biến – thị trường) giúp:", "options": ["A. Tối ưu chuỗi giá trị, giảm chi phí, nâng hiệu quả", "B. Tăng chi phí", "C. Không cần thiết", "D. Gây cạnh tranh"], "answer": "A", "explain": "Liên kết vùng: nguyên liệu miền núi – chế biến đồng bằng – tiêu thụ đô thị — chuỗi giá trị hoàn chỉnh, hiệu quả cao.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đông Nam Bộ chuyên cây công nghiệp, chăn nuôi.", "b) Duyên hải Nam Trung Bộ chuyên nho, thanh long, thủy sản.", "c) Đồng bằng sông Hồng chuyên lúa, vụ đông, chăn nuôi.", "d) Mọi vùng chuyên môn hóa giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chuyên môn hóa theo lợi thế so sánh.", "b) Liên kết vùng tối ưu chuỗi giá trị.", "c) Mỗi vùng cần phát huy lợi thế riêng.", "d) Vùng nào cũng nên làm mọi thứ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: dàn trải kém hiệu quả — nên chuyên môn hóa và liên kết.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một vùng có 4 cây trồng chuyên canh với tỉ trọng 40%, 30%, 20%, 10%. Cây chủ lực chiếm bao nhiêu % (chỉ ghi số)?", "answer": "40", "explain": "40% — cây có tỉ trọng cao nhất là chủ lực của vùng chuyên canh.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Chuỗi giá trị: nông dân (40%), chế biến (35%), phân phối (25%) trong giá bán 100000 đồng/kg. Nông dân nhận bao nhiêu nghìn đồng (chỉ ghi số)?", "answer": "40", "explain": "100 × 40% = 40 nghìn đồng — nâng tỉ trọng cho nông dân bằng hợp tác xã, thương hiệu là mục tiêu.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Trang trại ở Tây Nguyên chủ yếu là loại hình nào?", "options": ["A. Trồng cây công nghiệp (cà phê, hồ tiêu)", "B. Nuôi tôm", "C. Trồng lúa nước", "D. Nuôi cá tra"], "answer": "A", "explain": "Tây Nguyên: trang trại cà phê, hồ tiêu quy mô lớn — đặc trưng vùng chuyên canh cây công nghiệp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trang trại ở đồng bằng sông Cửu Long chủ yếu là loại hình nào?", "options": ["A. Nuôi trồng thủy sản, trồng cây ăn quả", "B. Trồng cà phê", "C. Trồng chè", "D. Chăn nuôi bò sữa"], "answer": "A", "explain": "Đồng bằng sông Cửu Long: trang trại tôm, cá tra, cây ăn quả — theo lợi thế sông nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mô hình VAC (vườn – ao – chuồng) phổ biến ở:", "options": ["A. Đồng bằng, trung du", "B. Vùng núi cao", "C. Hải đảo", "D. Đô thị"], "answer": "A", "explain": "VAC: vườn cây – ao cá – chuồng trại — kinh tế tổng hợp hộ gia đình, hiệu quả, bền vững ở đồng bằng, trung du.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trang trại chăn nuôi tập trung ở Đông Nam Bộ vì:", "options": ["A. Gần thị trường TP. Hồ Chí Minh, giao thông thuận lợi", "B. Khí hậu lạnh", "C. Đất ba-dan", "D. Ngẫu nhiên"], "answer": "A", "explain": "Chăn nuôi cần gần thị trường tiêu thụ lớn (TP. Hồ Chí Minh), giao thông tốt — Đông Nam Bộ đáp ứng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một trang trại tổng hợp VAC có vườn 2 ha, ao 1 ha, chuồng trại 0,5 ha. Tỉ lệ diện tích ao trong trang trại là bao nhiêu % (1 chữ số thập phân)?", "options": ["A. 28,6", "B. 50,0", "C. 14,3", "D. 57,1"], "answer": "A", "explain": "Tổng 3,5 ha; ao 1 ÷ 3,5 × 100% ≈ 28,57 ≈ 28,6%.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phát triển trang trại ở miền núi cần lưu ý đặc biệt:", "options": ["A. Bảo vệ rừng, chống xói mòn, phù hợp tập quán dân tộc", "B. Phá rừng làm trang trại", "C. Không cần bảo vệ môi trường", "D. Bỏ qua văn hóa bản địa"], "answer": "A", "explain": "Miền núi: trang trại phải gắn bảo vệ rừng, chống xói mòn, tôn trọng tập quán — phát triển bền vững vùng khó khăn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tây Nguyên có trang trại cây công nghiệp.", "b) Đồng bằng sông Cửu Long có trang trại thủy sản.", "c) VAC là mô hình tổng hợp hiệu quả.", "d) Mọi vùng có loại hình trang trại giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: loại hình trang trại theo lợi thế từng vùng.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Trang trại chăn nuôi cần gần thị trường.", "b) VAC tận dụng phụ phẩm lẫn nhau.", "c) Miền núi cần chú trọng bảo vệ môi trường.", "d) Trang trại không cần thị trường."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: trang trại sản xuất hàng hóa, thị trường quyết định.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Trang trại 3,5 ha VAC: vườn 2 ha, ao 1 ha, chuồng 0,5 ha. Diện tích vườn chiếm bao nhiêu % (1 chữ số thập phân)?", "answer": "57,1", "explain": "2 ÷ 3,5 × 100% ≈ 57,14 ≈ 57,1%.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một trang trại nuôi 1000 con vịt, mỗi con đẻ 200 trứng/năm, giá 3000 đồng/quả. Doanh thu mỗi năm là bao nhiêu triệu đồng (chỉ ghi số)?", "answer": "600", "explain": "1000 × 200 × 3000 = 600 triệu đồng — hiệu quả của chăn nuôi trang trại.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Quy hoạch nông nghiệp nhằm mục đích:", "options": ["A. Bố trí sản xuất hợp lí, phát huy lợi thế, bảo vệ tài nguyên", "B. Hạn chế sản xuất", "C. Tăng diện tích bằng mọi giá", "D. Không có mục đích"], "answer": "A", "explain": "Quy hoạch: đúng cây, đúng đất, đúng vùng — hiệu quả, bền vững, tránh tự phát.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vùng quy hoạch lúa an ninh lương thực chủ yếu ở:", "options": ["A. Đồng bằng sông Cửu Long và đồng bằng sông Hồng", "B. Tây Nguyên", "C. Đông Nam Bộ", "D. Miền núi phía Bắc"], "answer": "A", "explain": "Hai đồng bằng là vựa lúa: quy hoạch bảo vệ đất lúa, bảo đảm an ninh lương thực quốc gia.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Bảo vệ đất lúa trong đô thị hóa, công nghiệp hóa vì:", "options": ["A. An ninh lương thực quốc gia", "B. Đất lúa không có giá trị", "C. Nên chuyển hết sang công nghiệp", "D. Lúa kém hiệu quả"], "answer": "A", "explain": "Đất lúa là tài nguyên chiến lược: mất đất lúa khó khôi phục — bảo vệ nghiêm ngặt diện tích lúa trọng điểm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quy hoạch vùng chăn nuôi tập trung cần:", "options": ["A. Xa khu dân cư, có xử lí chất thải, gần thị trường", "B. Trong khu dân cư", "C. Không cần xử lí thải", "D. Xa thị trường"], "answer": "A", "explain": "Chăn nuôi tập trung: cách ly dân cư, xử lí môi trường, gần thị trường — an toàn dịch bệnh, hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một tỉnh quy hoạch 50000 ha đất lúa, mỗi năm chuyển 2% sang cây trồng khác. Sau 1 năm còn bao nhiêu ha lúa (chỉ ghi số)?", "options": ["A. 49000", "B. 50000", "C. 48000", "D. 51000"], "answer": "A", "explain": "50000 × 98% = 49000 ha — chuyển đổi linh hoạt nhưng phải trong quy hoạch, bảo đảm an ninh lương thực.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Quy hoạch nông nghiệp thích ứng biến đổi khí hậu cần:", "options": ["A. Chuyển đổi cơ cấu cây trồng, vật nuôi phù hợp điều kiện mới", "B. Giữ nguyên mọi thứ", "C. Không cần thích ứng", "D. Bỏ nông nghiệp"], "answer": "A", "explain": "Khí hậu thay đổi: quy hoạch linh hoạt — cây chịu mặn, chịu hạn, lịch thời vụ mới — nông nghiệp thích ứng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quy hoạch giúp bố trí sản xuất hợp lí.", "b) Cần bảo vệ đất lúa an ninh lương thực.", "c) Chăn nuôi tập trung cần xa dân cư.", "d) Không cần quy hoạch nông nghiệp."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quy hoạch phải thích ứng biến đổi khí hậu.", "b) Chuyển đổi cây trồng cần trong quy hoạch.", "c) Bảo vệ đất lúa là chiến lược.", "d) Nên chuyển hết đất lúa sang công nghiệp."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phải giữ diện tích lúa trọng điểm.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Chỉ tiêu bảo vệ 3,5 triệu ha đất lúa. Đã chuyển đổi 0,5 triệu ha. Còn lại bao nhiêu triệu ha (1 chữ số thập phân)?", "answer": "3,0", "explain": "3,5 − 0,5 = 3,0 triệu ha — kiên quyết giữ đất lúa.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một huyện có 10000 ha đất nông nghiệp, quy hoạch 60% trồng lúa. Diện tích lúa là bao nhiêu ha (chỉ ghi số)?", "answer": "6000", "explain": "10000 × 60% = 6000 ha.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Trên Atlat, các vùng chuyên canh cây công nghiệp được thể hiện bằng:", "options": ["A. Kí hiệu diện tích (nền màu) và kí hiệu cây trồng", "B. Biểu đồ tròn", "C. Đường đẳng trị", "D. Không thể hiện"], "answer": "A", "explain": "Atlat dùng nền màu + kí hiệu tượng hình cây trồng để thể hiện vùng chuyên canh.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dựa vào Atlat, vùng trồng lúa lớn nhất (màu đậm nhất) là:", "options": ["A. Đồng bằng sông Cửu Long", "B. Tây Nguyên", "C. Đông Nam Bộ", "D. Miền núi phía Bắc"], "answer": "A", "explain": "Đồng bằng sông Cửu Long: diện tích lúa lớn nhất, màu thể hiện đậm nhất trên Atlat.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dựa vào Atlat, cây cà phê phân bố chủ yếu ở:", "options": ["A. Tây Nguyên", "B. Đồng bằng sông Hồng", "C. Duyên hải miền Trung", "D. Đồng bằng sông Cửu Long"], "answer": "A", "explain": "Kí hiệu cà phê tập trung ở Tây Nguyên (Đắk Lắk, Lâm Đồng...) — vùng chuyên canh lớn nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dựa vào Atlat, chăn nuôi trâu, bò tập trung ở:", "options": ["A. Trung du, miền núi và Tây Nguyên", "B. Đồng bằng sông Cửu Long", "C. Đông Nam Bộ", "D. Duyên hải miền Trung"], "answer": "A", "explain": "Trâu, bò cần đồng cỏ, tập quán chăn thả — trung du, miền núi, Tây Nguyên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Dựa vào Atlat và kiến thức, giải thích vì sao Tây Nguyên không trồng lúa là chính:", "options": ["A. Địa hình cao nguyên, thiếu nước tưới cho lúa nước; phù hợp cây công nghiệp", "B. Đất quá tốt cho lúa", "C. Thừa nước", "D. Ngẫu nhiên"], "answer": "A", "explain": "Cao nguyên đất đỏ ba-dan thoát nước, mùa khô sâu — không phù hợp lúa nước; lí tưởng cho cây công nghiệp dài ngày.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một học sinh dùng Atlat so sánh mật độ trang trại giữa đồng bằng sông Cửu Long và Tây Bắc. Nhận định đúng là:", "options": ["A. Đồng bằng sông Cửu Long nhiều trang trại hơn do kinh tế hàng hóa phát triển", "B. Tây Bắc nhiều hơn", "C. Hai vùng bằng nhau", "D. Atlat không thể hiện"], "answer": "A", "explain": "Trang trại gắn với nông nghiệp hàng hóa: đồng bằng sông Cửu Long phát triển mạnh; Tây Bắc còn tự cung nhiều — Atlat phản ánh qua kí hiệu kinh tế.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Atlat thể hiện vùng chuyên canh bằng kí hiệu.", "b) Đồng bằng sông Cửu Long trồng lúa nhiều nhất.", "c) Cà phê tập trung ở Tây Nguyên.", "d) Atlat không có trang nông nghiệp."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: Atlat có trang Nông nghiệp chi tiết.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tây Nguyên không phù hợp lúa nước.", "b) Trâu bò tập trung ở trung du, miền núi.", "c) Kí hiệu Atlat giúp nhận biết phân bố cây trồng.", "d) Mọi vùng trồng cây giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Trên Atlat, đếm được 5 kí hiệu nhà máy đường ở đồng bằng sông Cửu Long và 2 ở miền Trung. Tỉ số là bao nhiêu (chỉ ghi số, dạng a/b)?", "answer": "5/2", "explain": "5 ÷ 2 = 5/2 — công nghiệp chế biến gắn với vùng nguyên liệu mía.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vùng có 3 kí hiệu cây công nghiệp chính trên Atlat. Đó có thể là vùng nào?", "answer": "Tây Nguyên", "explain": "Tây Nguyên: cà phê, cao su, hồ tiêu (điều) — vùng đa cây công nghiệp nhất.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Liên kết vùng trong nông nghiệp là:", "options": ["A. Các vùng hợp tác: nguyên liệu – chế biến – tiêu thụ", "B. Mỗi vùng tự làm", "C. Cạnh tranh triệt tiêu", "D. Không liên kết"], "answer": "A", "explain": "Liên kết: vùng nguyên liệu (miền núi) – chế biến (đồng bằng) – thị trường (đô thị) — chuỗi giá trị liên vùng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ví dụ về liên kết vùng trong nông nghiệp là:", "options": ["A. Chè Thái Nguyên chế biến tại chỗ, tiêu thụ cả nước", "B. Mỗi xã tự túc", "C. Không ví dụ nào", "D. Nhập khẩu hoàn toàn"], "answer": "A", "explain": "Chè Thái Nguyên: trồng – chế biến – thương hiệu – phân phối cả nước — liên kết sản xuất, chế biến, thị trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vùng nguyên liệu mía cho nhà máy đường cần:", "options": ["A. Ổn định diện tích, giống tốt, thu hoạch đúng thời vụ", "B. Trồng tự phát", "C. Không cần nguyên liệu", "D. Nhập khẩu mía"], "answer": "A", "explain": "Công nghiệp chế biến cần vùng nguyên liệu ổn định: quy hoạch, giống, kĩ thuật, thu mua — liên kết nông – công nghiệp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cánh đồng lớn trong sản xuất lúa giúp:", "options": ["A. Cơ giới hóa, giảm chi phí, nâng chất lượng, liên kết tiêu thụ", "B. Manh mún hơn", "C. Tăng chi phí", "D. Không có tác dụng"], "answer": "A", "explain": "Cánh đồng lớn: dồn điền đổi thửa, cơ giới hóa, một giống – một thời vụ — năng suất, chất lượng, bao tiêu thuận lợi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một nhà máy sữa cần 100 tấn sữa tươi/ngày, mỗi hộ cung cấp 200 kg/ngày. Cần liên kết bao nhiêu hộ (chỉ ghi số)?", "options": ["A. 500", "B. 100", "C. 200", "D. 1000"], "answer": "A", "explain": "100000 ÷ 200 = 500 hộ — liên kết nông dân – doanh nghiệp bảo đảm nguyên liệu.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để liên kết vùng bền vững, cần:", "options": ["A. Hợp đồng chặt chẽ, chia sẻ lợi ích công bằng, hỗ trợ kĩ thuật", "B. Ép giá nông dân", "C. Phá vỡ hợp đồng", "D. Không cần tin tưởng"], "answer": "A", "explain": "Liên kết bền vững: hợp đồng minh bạch, giá công bằng, doanh nghiệp hỗ trợ kĩ thuật, vốn — hai bên cùng thắng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Liên kết vùng tối ưu chuỗi giá trị.", "b) Vùng nguyên liệu cần ổn định.", "c) Cánh đồng lớn giúp cơ giới hóa.", "d) Mỗi vùng nên tự cung tự cấp."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chuyên môn hóa và liên kết hiệu quả hơn tự cung.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hợp đồng bao tiêu ổn định đầu ra.", "b) Cần chia sẻ lợi ích công bằng.", "c) Doanh nghiệp nên hỗ trợ kĩ thuật cho nông dân.", "d) Ép giá nông dân là bền vững."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: ép giá phá vỡ liên kết.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một cánh đồng lớn 500 ha, năng suất 65 tạ/ha. Sản lượng là bao nhiêu tấn (chỉ ghi số)?", "answer": "3250", "explain": "500 × 6,5 = 3250 tấn — quy mô lớn, đồng đều, dễ bao tiêu.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Hợp đồng bao tiêu 1000 tấn lúa, giá cao hơn thị trường 10%. Giá thị trường 8000 đồng/kg. Giá trị tăng thêm là bao nhiêu tỉ đồng (1 chữ số thập phân)?", "answer": "0,8", "explain": "1000 × 1000 × 8000 × 10% = 800 triệu đồng = 0,8 tỉ đồng — lợi ích của liên kết.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Chương trình nông thôn mới nhằm:", "options": ["A. Nâng cao đời sống nông thôn toàn diện", "B. Biến nông thôn thành phố", "C. Bỏ nông nghiệp", "D. Di dời dân"], "answer": "A", "explain": "Nông thôn mới: hạ tầng, kinh tế, văn hóa, môi trường, an ninh — nông thôn văn minh, hiện đại.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tiêu chí nông thôn mới gồm:", "options": ["A. Quy hoạch, hạ tầng, kinh tế, văn hóa, môi trường...", "B. Chỉ có đường", "C. Chỉ có điện", "D. Một tiêu chí"], "answer": "A", "explain": "Bộ tiêu chí quốc gia (19 tiêu chí): quy hoạch, giao thông, thủy lợi, điện, trường, trạm, thu nhập, môi trường...", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nông thôn mới nâng cao, kiểu mẫu là:", "options": ["A. Mức cao hơn: thu nhập cao, cảnh quan đẹp, văn minh", "B. Thấp hơn nông thôn mới", "C. Chỉ là tên gọi", "D. Không cần phấn đấu"], "answer": "A", "explain": "Nâng cao, kiểu mẫu: thu nhập vượt chuẩn, môi trường sáng – xanh – sạch – đẹp, văn hóa tiên tiến — đích phát triển nông thôn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để xây dựng nông thôn mới, vai trò của người dân là:", "options": ["A. Chủ thể: đóng góp, quyết định, hưởng lợi", "B. Chỉ đứng ngoài", "C. Không tham gia", "D. Chờ hỗ trợ"], "answer": "A", "explain": "Dân biết, dân bàn, dân làm, dân kiểm tra, dân hưởng lợi — người dân là chủ thể của nông thôn mới.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một xã huy động dân đóng góp 2 tỉ đồng, ngân sách hỗ trợ 8 tỉ đồng làm đường. Tỉ lệ đóng góp của dân là bao nhiêu %?", "options": ["A. 20", "B. 80", "C. 50", "D. 10"], "answer": "A", "explain": "2 ÷ (2 + 8) × 100% = 20% — nhà nước và nhân dân cùng làm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nông thôn mới gắn với tái cơ cấu nông nghiệp vì:", "options": ["A. Hạ tầng, tổ chức sản xuất mới thúc đẩy nông nghiệp hàng hóa", "B. Không liên quan", "C. Chỉ làm đường", "D. Bỏ nông nghiệp"], "answer": "A", "explain": "Nông thôn mới: dồn điền, thủy lợi, giao thông, hợp tác xã — nền tảng cho nông nghiệp hàng hóa, công nghệ cao.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nông thôn mới nâng cao đời sống nông dân.", "b) Có bộ tiêu chí quốc gia.", "c) Người dân là chủ thể.", "d) Nông thôn mới là đô thị hóa nông thôn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nông thôn mới giữ bản sắc nông thôn, không phải biến thành đô thị.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nông thôn mới kiểu mẫu là mức cao nhất.", "b) Cần nhà nước và nhân dân cùng làm.", "c) Nông thôn mới thúc đẩy tái cơ cấu nông nghiệp.", "d) Chỉ cần ngân sách nhà nước."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần huy động sức dân, doanh nghiệp.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một xã đạt 15/19 tiêu chí nông thôn mới. Tỉ lệ đạt là bao nhiêu % (1 chữ số thập phân)?", "answer": "78,9", "explain": "15 ÷ 19 × 100% ≈ 78,95 ≈ 78,9% — cần phấn đấu 4 tiêu chí còn lại.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thu nhập bình quân nông thôn mới nâng cao đạt 60 triệu đồng/người/năm, gấp 1,5 lần trước khi xây dựng. Thu nhập trước đây là bao nhiêu triệu đồng (chỉ ghi số)?", "answer": "40", "explain": "60 ÷ 1,5 = 40 triệu đồng — nông thôn mới nâng cao thu nhập rõ rệt.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Nội dung nào sau đây KHÔNG thuộc bài Tổ chức lãnh thổ nông nghiệp?", "options": ["A. Khai thác than", "B. Trang trại", "C. Vùng chuyên canh", "D. Vùng nông nghiệp"], "answer": "A", "explain": "Khai thác than thuộc bài Một số ngành công nghiệp.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ba hình thức tổ chức lãnh thổ nông nghiệp là:", "options": ["A. Trang trại, vùng chuyên canh, vùng nông nghiệp", "B. Chỉ trang trại", "C. Chỉ vùng chuyên canh", "D. Hợp tác xã, nông trường, trang trại"], "answer": "A", "explain": "Ba hình thức: trang trại (đơn vị sản xuất), vùng chuyên canh (vùng sản xuất tập trung), vùng nông nghiệp (phân vùng).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các phát biểu: (1) Trang trại sản xuất hàng hóa; (2) Tây Nguyên chuyên canh cà phê; (3) Cả nước có 7 vùng nông nghiệp; (4) Cần liên kết vùng. Số phát biểu đúng là:", "options": ["A. 1", "B. 2", "C. 3", "D. 4"], "answer": "D", "explain": "Cả 4 đều đúng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa trang trại, vùng chuyên canh và vùng nông nghiệp là:", "options": ["A. Trang trại là tế bào trong vùng chuyên canh, vùng chuyên canh nằm trong vùng nông nghiệp", "B. Tách biệt nhau", "C. Đối lập nhau", "D. Không liên quan"], "answer": "A", "explain": "Cấu trúc lồng nhau: trang trại → vùng chuyên canh → vùng nông nghiệp — tổ chức từ vi mô đến vĩ mô.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một tỉnh vừa có trang trại, vừa có vùng chuyên canh, thuộc một vùng nông nghiệp. Điều này thể hiện:", "options": ["A. Tổ chức lãnh thổ nông nghiệp đa cấp, đồng bộ", "B. Chồng chéo", "C. Lãng phí", "D. Ngẫu nhiên"], "answer": "A", "explain": "Tổ chức đa cấp: mỗi cấp có vai trò riêng, bổ sung nhau — hệ thống hoàn chỉnh.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tổng kết: Tổ chức lãnh thổ nông nghiệp hợp lí giúp:", "options": ["A. Khai thác tối đa lợi thế từng vùng, nâng cao hiệu quả, phát triển bền vững", "B. Tăng diện tích", "C. Giảm sản lượng", "D. Không có tác dụng"], "answer": "A", "explain": "Mục tiêu cuối cùng: đúng cây, đúng đất, đúng vùng — hiệu quả cao, bền vững, nông dân giàu lên.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định ôn tập sau:", "statements": ["a) Có 3 hình thức tổ chức lãnh thổ nông nghiệp.", "b) Trang trại là tế bào sản xuất hàng hóa.", "c) Vùng chuyên canh khai thác lợi thế vùng.", "d) Vùng nông nghiệp có 7 vùng."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ba hình thức lồng ghép nhau.", "b) Cần liên kết chuỗi trong vùng chuyên canh.", "c) Quy hoạch là cơ sở tổ chức lãnh thổ.", "d) Tổ chức lãnh thổ không quan trọng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Kể tên hai hình thức tổ chức lãnh thổ nông nghiệp (viết cách nhau bằng dấu phẩy).", "answer": "Trang trại, vùng chuyên canh", "explain": "Ba hình thức: trang trại, vùng chuyên canh, vùng nông nghiệp (chấp nhận hai tên đúng).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vùng nông nghiệp có 5 vùng chuyên canh, mỗi vùng có 200 trang trại. Tổng số trang trại là bao nhiêu (chỉ ghi số)?", "answer": "1000", "explain": "5 × 200 = 1000 trang trại — mạng lưới sản xuất hàng hóa dày đặc.", "points": 0.5}]}]}
