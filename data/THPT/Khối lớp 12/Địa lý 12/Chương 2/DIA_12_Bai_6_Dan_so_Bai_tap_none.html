"explain": "Dân số năm 2023 = 101,3 − 1,0345 = 100,2655 triệu. Tỉ lệ tăng = 1,0345 ÷ 100,2655 × 100% ≈ 1,0317% ≈ 1,03%.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tuổi thọ trung bình năm 2024 đạt 74,7 tuổi (nam 72,3; nữ 77,3). Chênh lệch tuổi thọ giữa nữ và nam là bao nhiêu và cho thấy điều gì?", "options": ["A. 5,0 tuổi; nữ sống thọ hơn nam là quy luật phổ biến", "B. 2,4 tuổi; nam sống thọ hơn", "C. 0 tuổi; bằng nhau", "D. 10 tuổi; chênh lệch bất thường"], "answer": "A", "explain": "77,3 − 72,3 = 5,0 tuổi. Nữ sống thọ hơn nam là quy luật sinh học phổ biến trên thế giới; tuổi thọ tăng thể hiện thành tựu y tế, chăm sóc sức khỏe.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dân số trung bình năm 2024 ước tính 101,3 triệu người.", "b) Việt Nam đông dân thứ ba ở Đông Nam Á.", "c) Tỉ lệ tăng dân số đang chậm lại.", "d) Dân số Việt Nam đang giảm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: dân số vẫn tăng (tăng 1,0345 triệu người năm 2024), chỉ là tốc độ tăng chậm lại.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tổng tỉ suất sinh 1,91 con/phụ nữ dưới mức sinh thay thế.", "b) Tuổi thọ trung bình năm 2024 đạt 74,7 tuổi.", "c) Mức sinh thấp kéo dài dẫn đến già hóa dân số.", "d) Tỉ lệ tăng dân số giai đoạn 2019 – 2024 cao hơn giai đoạn 2014 – 2019."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: 0,99%/năm thấp hơn 1,22%/năm — tốc độ tăng chậm lại.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Dân số Việt Nam thời điểm 1/4/2024 là 101112656 người. Làm tròn đến hàng triệu, dân số là bao nhiêu triệu người (chỉ ghi số)?", "answer": "101", "explain": "101112656 ≈ 101 triệu người (làm tròn). Đây là kết quả Điều tra dân số giữa kỳ 2024.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Giai đoạn 2019 – 2024, dân số tăng thêm 4,9 triệu người ẻ em 0 – 14 tuổi. 60,2% và tăng nhanh cho thấy quá trình già hóa đang diễn ra mạnh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho bảng số liệu cơ cấu tuổi (%): năm 2019: 0 – 14: 24,3; 15 – 64: 68,0; 65+: 7,7. Năm 2024: 23,3; 67,4; 9,3. Xu hướng nào đúng?", "options": ["A. Tỉ trọng trẻ em và lao động giảm, người già tăng — dân số đang già hóa", "B. Dân số đang trẻ hóa", "C. Cơ cấu không thay đổi", "D. Người già giảm"], "answer": "A", "explain": "Nhóm 0 – 14 giảm 1,0 điểm %, 15 – 64 giảm 0,6 điểm %, 65+ tăng 1,6 điểm % — xu hướng già hóa rõ rệt.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Thời kỳ cơ cấu dân số vàng mang lại lợi thế gì và thách thức gì?", "options": ["A. Lợi thế: nguồn lao động dồi dào; thách thức: phải tạo đủ việc làm và chuẩn bị cho già hóa", "B. Chỉ có lợi thế, không có thách thức", "C. Chỉ có thách thức", "D. Không ảnh hưởng đến kinh tế"], "answer": "A", "explain": "Dân số vàng là cơ hội: lực lượng lao động lớn, ít người phụ thuộc. Nhưng nếu không tạo đủ việc làm chất lượng và chuẩn bị an sinh cho tuổi già, cơ hội sẽ thành gánh nặng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tỉ số giới tính năm 2024 là 99,2 nam/100 nữ.", "b) Tỉ số giới tính khi sinh là 111,4 bé trai/100 bé gái.", "c) Nhóm 15 – 64 tuổi chiếm 67,4% — cơ cấu dân số vàng.", "d) Việt Nam không có hiện tượng già hóa dân số."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nhóm 65+ tăng lên 9,3%, chỉ số già hóa 60,2% — đang già hóa nhanh.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mất cân bằng giới tính khi sinh gây hệ lụy xã hội lâu dài.", "b) Cơ cấu dân số vàng thuận lợi cho phát triển kinh tế.", "c) Già hóa dân số tăng gánh nặng an sinh xã hội.", "d) Cơ cấu tuổi của dân số không thay đổi theo thời gian."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cơ cấu tuổi biến động theo mức sinh, mức tử và tuổi thọ.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Dân số 101,3 triệu người, nhóm 15 – 64 tuổi chiếm 67,4%. Tính số người trong độ tuổi lao động (đơn vị triệu người, 1 chữ số thập phân).", "answer": "68,3", "explain": "101,3 × 67,4% ≈ 68,28 ≈ 68,3 triệu người — nguồn lực lao động to lớn của đất nước.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tỉ số giới tính khi sinh là 111,4 bé trai/100 bé gái. Với 1000 bé gái được sinh ra, số bé trai tương ứng khoảng bao nhiêu (làm tròn đến hàng đơn vị)?", "answer": "1114", "explain": "111,4 × 10 = 1114 bé trai. Thừa khoảng 114 bé trai/1000 bé gái — mất cân bằng nghiêm trọng cần can thiệp chính sách.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Tỉ lệ dân thành thị của Việt Nam năm 2024 là bao nhiêu?", "options": ["A. 38,5%", "B. 50,2%", "C. 25,0%", "D. 61,5%"], "answer": "A", "explain": "Dân thành thị 39,0 triệu người, chiếm 38,5%; nông thôn 62,3 triệu người, chiếm 61,5% (năm 2024).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tốc độ tăng dân số thành thị giai đoạn 2019 – 2024 là 3,06%/năm, cao gấp 1,5 lần giai đoạn trước. Nguyên nhân chính là:", "options": ["A. Đô thị hóa nhanh và di cư từ nông thôn ra thành thị", "B. Tỉ suất sinh ở thành thị cao hơn nông thôn", "C. Người thành thị sống thọ hơn nhiều", "D. Thành thị không có người chuyển đi"], "answer": "A", "explain": "Công nghiệp hóa, đô thị hóa thu hút lao động nông thôn di cư ra thành phố; mở rộng địa giới đô thị cũng làm tăng dân thành thị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tỉ lệ dân thành thị của Việt Nam (38,5%) so với thế giới (khoảng 57%) cho thấy:", "options": ["A. Việt Nam vẫn là nước có tỉ lệ dân thành thị thấp, còn nhiều dư địa đô thị hóa", "B. Việt Nam đã đô thị hóa xong", "C. Tỉ lệ này quá cao", "D. Không thể so sánh"], "answer": "A", "explain": "38,5% thấp hơn nhiều mức bình quân thế giới — đô thị hóa sẽ còn tiếp diễn mạnh, cần quy hoạch đồng bộ hạ tầng, nhà ở, việc làm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Di cư từ nông thôn ra thành thị mang lại tác động nào sau đây?", "options": ["A. Vừa bổ sung lao động cho đô thị, vừa gây sức ép về nhà ở, việc làm, hạ tầng", "B. Chỉ có tác động tích cực", "C. Chỉ có tác động tiêu cực", "D. Không ảnh hưởng gì"], "answer": "A", "explain": "Di cư cung cấp lao động cho công nghiệp, dịch vụ đô thị nhưng cũng gây quá tải nhà ở, giao thông, y tế, giáo dục nếu quản lí không tốt.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Dân số thành thị năm 2024 là 39,0 triệu người, chiếm 38,5%. Tính dân số nông thôn (đơn vị triệu người, 1 chữ số thập phân).", "options": ["A. 62,3", "B. 39,0", "C. 101,3", "D. 55,5"], "answer": "A", "explain": "Tổng dân số = 39,0 ÷ 38,5% ≈ 101,3 triệu. Dân nông thôn = 101,3 − 39,0 = 62,3 triệu người.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một thành phố có 1 triệu dân, mỗi năm tăng thêm 3% do nhập cư. Sau 2 năm, dân số khoảng bao nhiêu (làm tròn đến nghìn người)?", "options": ["A. 1061000", "B. 1030000", "C. 1000000", "D. 1090000"], "answer": "A", "explain": "Năm 1: 1000000 × 1,03 = 1030000. Năm 2: 1030000 × 1,03 = 1060900 ≈ 1061000 người. Tăng trưởng cơ học làm đô thị phình to nhanh.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tỉ lệ dân thành thị năm 2024 là 38,5%.", "b) Dân thành thị tăng nhanh do đô thị hóa và di cư.", "c) Tỉ lệ dân thành thị của Việt Nam còn thấp so với thế giới.", "d) Dân nông thôn chiếm đa số (61,5%)."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn đều đúng theo số liệu Điều tra dân số giữa kỳ 2024.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Di cư nông thôn – thành thị bổ sung lao động cho đô thị.", "b) Di cư ồ ạt gây sức ép lên hạ tầng đô thị.", "c) Mở rộng địa giới làm tăng dân số thành thị.", "d) Đô thị hóa không liên quan đến phân bố dân cư."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đô thị hóa làm thay đổi mạnh phân bố dân cư (tập trung vào đô thị).", "points": 1.0}, {"type": "short", "level": "VD", "q": "Dân số thành thị 39,0 triệu người, tổng dân số 101,3 triệu người. Tính tỉ lệ dân thành thị (đơn vị %, 1 chữ số thập phân).", "answer": "38,5", "explain": "39,0 ÷ 101,3 × 100% ≈ 38,5%.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tốc độ tăng dân thành thị là 3,06%/năm. Với 39,0 triệu người năm 2024, sau 1 năm dân thành thị khoảng bao nhiêu triệu người (1 chữ số thập phân)?", "answer": "40,2", "explain": "39,0 × 1,0306 ≈ 40,19 ≈ 40,2 triệu người — mỗi năm đô thị tăng thêm hơn 1 triệu dân.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Mật độ dân số trung bình của Việt Nam năm 2024 là bao nhiêu?", "options": ["A. 305 người/km2", "B. 205 người/km2", "C. 405 người/km2", "D. 105 người/km2"], "answer": "A", "explain": "Mật độ 305 người/km2, tăng 15 người/km2 so với năm 2019 — đứng thứ ba ở Đông Nam Á.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vùng có mật độ dân số cao nhất cả nước năm 2024 là:", "options": ["A. Đồng bằng sông Hồng (1126 người/km2)", "B. Tây Nguyên (114 người/km2)", "C. Trung du và miền núi phía Bắc (140 người/km2)", "D. Bắc Trung Bộ"], "answer": "A", "explain": "Đồng bằng sông Hồng: 1126 người/km2 — cao nhất; tiếp theo là Đông Nam Bộ 814 người/km2.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vùng có mật độ dân số thấp nhất cả nước là:", "options": ["A. Tây Nguyên (114 người/km2)", "B. Đồng bằng sông Hồng", "C. Đông Nam Bộ", "D. Đồng bằng sông Cửu Long"], "answer": "A", "explain": "Tây Nguyên 114 người/km2 thấp nhất, tiếp theo là Trung du và miền núi phía Bắc 140 người/km2 — do địa hình núi cao, kinh tế khó khăn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên nhân chính làm cho đồng bằng sông Hồng có mật độ dân số cao nhất là:", "options": ["A. Đồng bằng màu mỡ, lịch sử khai phá lâu đời, kinh tế phát triển", "B. Khí hậu lạnh", "C. Địa hình núi cao", "D. Ít sông ngòi"], "answer": "A", "explain": "Đồng bằng châu thổ màu mỡ, nghề lúa nước cần nhiều lao động, lịch sử định cư lâu đời, nay là trung tâm kinh tế — dân cư tập trung đông đúc.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Mật độ dân số đồng bằng sông Hồng (1126 người/km2) gấp khoảng bao nhiêu lần Tây Nguyên (114 người/km2)?", "options": ["A. Khoảng 9,9 lần", "B. Khoảng 2 lần", "C. Khoảng 5 lần", "D. Khoảng 15 lần"], "answer": "A", "explain": "1126 ÷ 114 ≈ 9,88 ≈ 9,9 lần — chênh lệch rất lớn, thể hiện phân bố dân cư không đều.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để giảm chênh lệch phân bố dân cư giữa các vùng, giải pháp căn bản, lâu dài nhất là:", "options": ["A. Phát triển kinh tế – xã hội ở vùng thưa dân, tạo việc làm tại chỗ", "B. Buộc dân di cư ồ ạt", "C. Hạn chế phát triển đô thị", "D. Không làm gì"], "answer": "A", "explain": "Phân bố dân cư theo quy luật kinh tế: phát triển kinh tế vùng thưa dân (miền núi, Tây Nguyên) tạo việc làm, thu nhập — dân cư sẽ phân bố hợp lí hơn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mật độ dân số năm 2024 là 305 người/km2.", "b) Đồng bằng sông Hồng có mật độ cao nhất (1126 người/km2).", "c) Tây Nguyên có mật độ thấp nhất (114 người/km2).", "d) Dân cư phân bố đồng đều giữa các vùng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phân bố rất không đều (chênh lệch gần 10 lần).", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dân cư tập trung ở đồng bằng, ven biển, đô thị.", "b) Miền núi, vùng sâu dân cư thưa thớt.", "c) Điều kiện tự nhiên ảnh hưởng đến phân bố dân cư.", "d) Trình độ phát triển kinh tế không ảnh hưởng đến phân bố dân cư."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nơi kinh tế phát triển, nhiều việc làm thu hút dân cư tập trung đông.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Diện tích Việt Nam 331212 km2, dân số 101112656 người (1/4/2024). Tính mật độ dân số (người/km2, làm tròn đến hàng đơn vị).", "answer": "305", "explain": "101112656 ÷ 331212 ≈ 305,2 ≈ 305 người/km2 — khớp với số liệu công bố.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Mật độ Đông Nam Bộ là 814 người/km2, Trung du và miền núi phía Bắc là 140 người/km2. Tính chênh lệch (người/km2, chỉ ghi số).", "answer": "674", "explain": "814 − 140 = 674 người/km2. Vùng kinh tế phát triển năng động thu hút dân cư đông đúc.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Sức ép lớn nhất của dân số đông đối với phát triển kinh tế – xã hội là:", "options": ["A. Việc làm, tài nguyên, môi trường, y tế, giáo dục", "B. Thiếu lao động", "C. Dân số quá ít", "D. Không có sức ép"], "answer": "A", "explain": "Dân số đông, tăng nhanh gây sức ép toàn diện: việc làm, tài nguyên cạn kiệt, ô nhiễm, quá tải trường học, bệnh viện.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vấn đề dân số nổi cộm hiện nay ở Việt Nam là:", "options": ["A. Già hóa dân số và mất cân bằng giới tính khi sinh", "B. Dân số giảm mạnh", "C. Không ai kết hôn", "D. Tỉ suất tử quá cao"], "answer": "A", "explain": "Mức sinh thấp (1,91 con) đẩy nhanh già hóa; tỉ số giới tính khi sinh 111,4 mất cân bằng — hai vấn đề dân số lớn nhất hiện nay.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Già hóa dân số gây khó khăn nào sau đây?", "options": ["A. Tăng gánh nặng an sinh xã hội, y tế; thiếu hụt lao động tương lai", "B. Tăng nguồn lao động trẻ", "C. Giảm chi phí y tế", "D. Không ảnh hưởng gì"], "answer": "A", "explain": "Người già tăng → chi phí hưu trí, y tế tăng; lực lượng lao động co lại — thách thức an sinh và tăng trưởng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mất cân bằng giới tính khi sinh (thừa bé trai) gây hệ quả xã hội nào?", "options": ["A. Thừa nam thiếu nữ khi đến tuổi kết hôn, bất ổn xã hội", "B. Không ảnh hưởng", "C. Tăng tỉ suất sinh", "D. Giảm tuổi thọ"], "answer": "A", "explain": "Thừa bé trai hôm nay → 20 – 25 năm sau thừa nam trong độ tuổi kết hôn, gây mất cân bằng hôn nhân, buôn bán người, bất ổn xã hội.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một địa phương có mức sinh rất thấp (1,5 con/phụ nữ) trong nhiều năm. Chính sách dân số phù hợp là:", "options": ["A. Khuyến khích sinh đủ 2 con, hỗ trợ nuôi dạy con, thích ứng già hóa", "B. Tiếp tục hạn chế sinh", "C. Không có chính sách", "D. Cấm sinh con thứ hai"], "answer": "A", "explain": "Mức sinh quá thấp cần chuyển sang khuyến khích sinh hợp lí, hỗ trợ gia đình, đồng thời chuẩn bị an sinh cho xã hội già hóa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Chính sách dân số của Việt Nam hiện nay theo hướng:", "options": ["A. Duy trì mức sinh thay thế hợp lí, nâng cao chất lượng dân số, thích ứng già hóa", "B. Chỉ giảm sinh bằng mọi giá", "C. Không can thiệp", "D. Tăng sinh tối đa"], "answer": "A", "explain": "Từ kế hoạch hóa gia đình sang chính sách dân số toàn diện: mức sinh hợp lí theo vùng, chất lượng dân số (tầm vóc, trí tuệ), thích ứng già hóa.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dân số đông gây sức ép về việc làm, tài nguyên, môi trường.", "b) Già hóa dân số tăng gánh nặng an sinh xã hội.", "c) Mất cân bằng giới tính khi sinh gây hệ lụy lâu dài.", "d) Việt Nam không có vấn đề dân số nào."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: còn nhiều vấn đề (sức ép dân số đông, già hóa, mất cân bằng giới tính khi sinh).", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mức sinh thấp kéo dài đẩy nhanh già hóa.", "b) Cần nâng cao chất lượng dân số (giáo dục, y tế, dinh dưỡng).", "c) Phân bố dân cư, lao động cần hợp lí giữa các vùng.", "d) Chính sách dân số áp dụng giống nhau cho mọi vùng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chính sách cần phù hợp đặc điểm từng vùng (vùng mức sinh cao cần giảm, vùng mức sinh thấp cần khuyến khích).", "points": 1.0}, {"type": "short", "level": "VD", "q": "Chỉ số già hóa năm 2024 là 60,2%, tăng 11,4 điểm phần trăm so với năm 2019. Tính chỉ số già hóa năm 2019 (đơn vị %, 1 chữ số thập phân).", "answer": "48,8", "explain": "60,2 − 11,4 = 48,8%. Chỉ 5 năm đã tăng hơn 11 điểm phần trăm — tốc độ già hóa rất nhanh.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một huyện có 50000 người từ 65 tuổi trở lên và 100000 trẻ em 0 – 14 tuổi. Tính chỉ số già hóa của huyện (đơn vị %, chỉ ghi số).", "answer": "50", "explain": "50000 ÷ 100000 × 100% = 50%. Chỉ số càng cao, dân số càng già.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Nâng cao chất lượng dân số chủ yếu thông qua:", "options": ["A. Giáo dục, y tế, dinh dưỡng, môi trường sống", "B. Chỉ tăng số lượng", "C. Không cần đầu tư", "D. Di cư ra nước ngoài"], "answer": "A", "explain": "Chất lượng dân số thể hiện ở trí tuệ, thể chất, tinh thần — nâng cao bằng giáo dục, chăm sóc sức khỏe, dinh dưỡng, cải thiện môi trường sống.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tuổi thọ trung bình tăng (74,7 tuổi năm 2024) thể hiện:", "options": ["A. Thành tựu y tế và chăm sóc sức khỏe nhân dân", "B. Mức sống giảm", "C. Dịch bệnh tăng", "D. Không có ý nghĩa"], "answer": "A", "explain": "Tuổi thọ tăng nhờ y học phát triển, chăm sóc sức khỏe cải thiện, mức sống nâng cao — chỉ số quan trọng của chất lượng dân số.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Trình độ học vấn của dân số nâng cao mang lại lợi ích nào?", "options": ["A. Nâng cao năng suất lao động, thu nhập và khả năng thích ứng", "B. Giảm việc làm", "C. Tăng thất nghiệp", "D. Không có lợi ích"], "answer": "A", "explain": "Lao động có học vấn, kĩ năng cao → năng suất cao, thu nhập tốt, dễ thích ứng với công nghệ — động lực phát triển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tình trạng suy dinh dưỡng, thấp còi ở trẻ em vùng khó khăn cần giải pháp nào?", "options": ["A. Chương trình dinh dưỡng học đường, chăm sóc bà mẹ, trẻ em", "B. Không cần can thiệp", "C. Giảm khẩu phần ăn", "D. Để tự nhiên"], "answer": "A", "explain": "Dinh dưỡng 1000 ngày đầu đời quyết định tầm vóc, trí tuệ: cần sữa học đường, bữa ăn bán trú, chăm sóc bà mẹ mang thai — đầu tư cho chất lượng dân số tương lai.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một xã miền núi có tỉ lệ trẻ suy dinh dưỡng 25%, cao gấp đôi bình quân cả nước. Ưu tiên đầu tư nào hiệu quả nhất?", "options": ["A. Dinh dưỡng, y tế học đường và nước sạch", "B. Xây sân vận động", "C. Mở quán karaoke", "D. Không đầu tư"], "answer": "A", "explain": "Trẻ em suy dinh dưỡng ảnh hưởng cả đời: ưu tiên bữa ăn học đường, y tế, nước sạch — đầu tư hiệu quả nhất cho nguồn nhân lực tương lai.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nguồn nhân lực chất lượng cao là yếu tố then chốt để Việt Nam:", "options": ["A. Tham gia sâu vào chuỗi giá trị toàn cầu, phát triển kinh tế tri thức", "B. Chỉ làm nông nghiệp", "C. Không cần hội nhập", "D. Dựa vào tài nguyên thô"], "answer": "A", "explain": "Trong cách mạng công nghiệp 4.0, nhân lực chất lượng cao quyết định khả năng thu hút FDI công nghệ cao, chuyển đổi số — vượt bẫy thu nhập trung bình.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chất lượng dân số thể hiện ở trí tuệ, thể chất, tinh thần.", "b) Giáo dục, y tế nâng cao chất lượng dân số.", "c) Tuổi thọ tăng thể hiện thành tựu chăm sóc sức khỏe.", "d) Chỉ số lượng dân số mới quan trọng, chất lượng không cần."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chất lượng dân số quyết định năng lực phát triển bền vững.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lao động có kĩ năng cho năng suất cao hơn.", "b) Dinh dưỡng trẻ em ảnh hưởng đến chất lượng nguồn nhân lực tương lai.", "c) Nhân lực chất lượng cao giúp hội nhập kinh tế quốc tế.", "d) Đầu tư cho con người là lãng phí."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đầu tư cho con người là đầu tư hiệu quả nhất, bền vững nhất.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Tỉ lệ lao động qua đào tạo của Việt Nam khoảng 27%. Trong 51,9 triệu lao động có việc làm, số lao động qua đào tạo khoảng bao nhiêu triệu người (1 chữ số thập phân)?", "answer": "14,0", "explain": "51,9 × 27% ≈ 14,01 ≈ 14,0 triệu người. Tỉ lệ còn thấp — cần đẩy mạnh đào tạo nghề gắn với nhu cầu thị trường.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Chiều cao trung bình của thanh niên Việt Nam tăng khoảng 1 cm/thập kỷ nhờ cải thiện dinh dưỡng. Sau 3 thập kỷ, chiều cao tăng khoảng bao nhiêu cm (chỉ ghi số)?", "answer": "3", "explain": "1 × 3 = 3 cm. Cải thiện tầm vóc là kết quả dài hạn của đầu tư dinh dưỡng, y tế — nâng cao chất lượng dân số.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Việt Nam có bao nhiêu dân tộc?", "options": ["A. 54 dân tộc", "B. 50 dân tộc", "C. 60 dân tộc", "D. 45 dân tộc"], "answer": "A", "explain": "Cả nước có 54 dân tộc anh em cùng sinh sống, trong đó dân tộc Kinh (Việt) chiếm đa số.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dân tộc Kinh chiếm khoảng bao nhiêu phần trăm dân số cả nước?", "options": ["A. Khoảng 85%", "B. Khoảng 50%", "C. Khoảng 60%", "D. Khoảng 95%"], "answer": "A", "explain": "Dân tộc Kinh chiếm khoảng 85,3% dân số; 53 dân tộc thiểu số chiếm khoảng 14,7% nhưng sinh sống trên 3/4 diện tích cả nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Các dân tộc thiểu số ở Việt Nam phân bố chủ yếu ở:", "options": ["A. Trung du, miền núi, Tây Nguyên", "B. Đồng bằng sông Hồng", "C. Đông Nam Bộ", "D. Các thành phố lớn"], "answer": "A", "explain": "Đồng bào các dân tộc thiểu số cư trú chủ yếu ở miền núi phía Bắc, Tây Nguyên, duyên hải miền Trung — vùng biên giới, có vị trí chiến lược.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chính sách dân tộc của Đảng và Nhà nước ta nhằm mục đích:", "options": ["A. Bình đẳng, đoàn kết, tương trợ, cùng phát triển giữa các dân tộc", "B. Ưu tiên một dân tộc", "C. Hạn chế phát triển vùng dân tộc", "D. Đồng hóa các dân tộc"], "answer": "A", "explain": "Chính sách: bình đẳng, đoàn kết, tôn trọng, giúp nhau cùng phát triển; ưu tiên đầu tư vùng đồng bào dân tộc thiểu số, miền núi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Mỗi dân tộc có bản sắc văn hóa riêng (lễ hội, trang phục, ẩm thực). Điều này là nguồn lực để phát triển:", "options": ["A. Du lịch văn hóa, tăng cường đoàn kết dân tộc", "B. Chỉ để bảo tồn trong bảo tàng", "C. Xung đột dân tộc", "D. Không có giá trị"], "answer": "A", "explain": "Đa dạng văn hóa 54 dân tộc là tài nguyên du lịch độc đáo (lễ hội, chợ phiên, nghề thủ công) đồng thời tăng cường đoàn kết, bản sắc quốc gia.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để phát triển bền vững vùng đồng bào dân tộc thiểu số, giải pháp tổng hợp cần:", "options": ["A. Đầu tư hạ tầng, giáo dục, y tế gắn với bảo tồn văn hóa và phát huy nội lực", "B. Chỉ hỗ trợ tiền", "C. Di dời toàn bộ ra đồng bằng", "D. Để tự phát triển"], "answer": "A", "explain": "Phát triển vùng dân tộc cần đồng bộ: hạ tầng, giáo dục, y tế, sinh kế phù hợp, bảo tồn văn hóa, phát huy nội lực cộng đồng — không chỉ hỗ trợ đơn thuần.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Việt Nam có 54 dân tộc anh em.", "b) Dân tộc Kinh chiếm đa số (khoảng 85%).", "c) Đồng bào dân tộc thiểu số sống chủ yếu ở miền núi.", "d) Chỉ có một dân tộc ở Việt Nam."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: có 54 dân tộc cùng chung sống.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Chính sách dân tộc là bình đẳng, đoàn kết, cùng phát triển.", "b) Đa dạng văn hóa các dân tộc là nguồn lực du lịch.", "c) Cần ưu tiên đầu tư vùng đồng bào dân tộc thiểu số.", "d) Nên đồng hóa mọi dân tộc thành một."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tôn trọng, bảo tồn bản sắc văn hóa mỗi dân tộc trong khối đại đoàn kết.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Cả nước có 54 dân tộc, trong đó 1 dân tộc Kinh (đa số). Số dân tộc thiểu số là bao nhiêu (chỉ ghi số)?", "answer": "53", "explain": "54 − 1 = 53 dân tộc thiểu số, chiếm khoảng 14,7% dân số nhưng cư trú trên phần lớn diện tích miền núi, biên giới.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Dân số 101,3 triệu người, đồng bào dân tộc thiểu số chiếm khoảng 14,7%. Tính số người dân tộc thiểu số (đơn vị triệu người, 1 chữ số thập phân).", "answer": "14,9", "explain": "101,3 × 14,7% ≈ 14,89 ≈ 14,9 triệu người — bộ phận quan trọng của khối đại đoàn kết dân tộc.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Tháp dân số của Việt Nam hiện nay có dạng nào sau đây?", "options": ["A. Dạng ổn định, thu hẹp đáy (mức sinh giảm)", "B. Dạng đáy rộng (bùng nổ dân số)", "C. Dạng hoàn toàn già", "D. Không có dạng xác định"], "answer": "A", "explain": "Đáy tháp thu hẹp do mức sinh giảm (1,91 con), thân tháp phình ở nhóm lao động — tháp dân số ổn định, đang chuyển sang già hóa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trên Atlat, mật độ dân số thường được thể hiện bằng phương pháp nào?", "options": ["A. Chấm điểm (mỗi chấm ứng với số dân nhất định)", "B. Biểu đồ tròn", "C. Đường đẳng trị duy nhất", "D. Kí hiệu hình ảnh"], "answer": "A", "explain": "Phương pháp chấm điểm: mỗi chấm tương ứng một số lượng dân cư — thể hiện trực quan mật độ và phân bố dân cư.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho bảng số liệu dân số (triệu người): 2019: 96,2; 2021: 98,5; 2024: 101,3. Biểu đồ thích hợp nhất thể hiện quy mô dân số qua các năm là:", "options": ["A. Biểu đồ cột", "B. Biểu đồ tròn", "C. Biểu đồ miền", "D. Biểu đồ kết hợp"], "answer": "A", "explain": "Thể hiện quy mô một đối tượng qua thời gian → biểu đồ cột (hoặc đường) là thích hợp nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để thể hiện cơ cấu dân số theo nhóm tuổi năm 2024 (23,3 – 67,4 – 9,3%), biểu đồ thích hợp nhất là:", "options": ["A. Biểu đồ tròn", "B. Biểu đồ đường", "C. Biểu đồ cột đơn", "D. Biểu đồ miền"], "answer": "A", "explain": "Thể hiện cơ cấu (tỉ trọng) của tổng thể tại một thời điểm → biểu đồ tròn.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho bảng số liệu: Dân số 2019: 96,2 triệu; 2024: 101,1 triệu (1/4/2024). Tính tốc độ tăng bình quân giai đoạn 2019 – 2024 (đơn vị %/năm, 2 chữ số thập phân).", "options": ["A. 0,99", "B. 1,22", "C. 1,03", "D. 2,10"], "answer": "A", "explain": "Tăng 4,9 triệu sau 5 năm; tốc độ bình quân ≈ 0,99%/năm — khớp số liệu Tổng cục Thống kê.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Dựa vào tháp dân số thu hẹp đáy, một nhà hoạch định kết luận về 20 năm tới. Kết luận đúng nhất là:", "options": ["A. Lực lượng lao động sẽ co lại, dân số già hóa nhanh — cần chuẩn bị an sinh và nâng cao năng suất", "B. Dân số sẽ bùng nổ", "C. Không có thay đổi gì", "D. Tỉ suất sinh sẽ tự tăng cao"], "answer": "A", "explain": "Đáy thu hẹp hôm nay → 20 năm sau nhóm lao động co lại, nhóm già tăng nhanh — cần chính sách dân số, an sinh, tự động hóa, nâng cao năng suất.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tháp dân số Việt Nam đang thu hẹp đáy.", "b) Biểu đồ cột thích hợp thể hiện dân số qua các năm.", "c) Biểu đồ tròn thích hợp thể hiện cơ cấu dân số.", "d) Atlat không thể hiện được dân số."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: Atlat có trang Dân số thể hiện quy mô, mật độ, phân bố dân cư.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Cho bảng số liệu dân số (triệu người): 2019: 96,2; 2024: 101,3. Xét tính đúng, sai:", "statements": ["a) Dân số tăng 5,1 triệu người sau 5 năm.", "b) Tốc độ tăng bình quân khoảng 0,99%/năm.", "c) Dân số có xu hướng tăng chậm lại.", "d) Dân số đang giảm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng: 101,3 − 96,2 = 5,1 (làm tròn; số liệu gốc 1/4/2024 là 4,9 triệu). b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Vẽ biểu đồ tròn thể hiện cơ cấu tuổi: nhóm 15 – 64 tuổi chiếm 67,4%. Tính số độ của cung tròn tương ứng (đơn vị độ, 1 chữ số thập phân).", "answer": "242,6", "explain": "67,4% × 360° = 242,64 ≈ 242,6°. Nhóm lao động chiếm hơn 2/3 vòng tròn — cơ cấu dân số vàng.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Dân số năm 2024 là 101,3 triệu, tỉ lệ tăng 1,03%/năm. Dự báo dân số năm 2025 (đơn vị triệu người, 1 chữ số thập phân).", "answer": "102,3", "explain": "101,3 × 1,0103 ≈ 102,34 ≈ 102,3 triệu người.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Giải pháp quan trọng nhất để giải quyết sức ép dân số đông là:", "options": ["A. Phát triển kinh tế, tạo việc làm, nâng cao chất lượng dân số", "B. Hạn chế sinh bằng mọi giá", "C. Di cư ra nước ngoài", "D. Không làm gì"], "answer": "A", "explain": "Căn bản là phát triển kinh tế tạo việc làm, nâng cao chất lượng nguồn nhân lực — biến sức ép dân số thành động lực.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Để thích ứng với già hóa dân số, cần:", "options": ["A. Hoàn thiện hệ thống an sinh xã hội, y tế người cao tuổi", "B. Bỏ mặc người già", "C. Tăng tuổi nghỉ hưu vô hạn", "D. Không cần chuẩn bị"], "answer": "A", "explain": "Già hóa đòi hỏi: bảo hiểm xã hội bao phủ rộng, y tế lão khoa, chính sách việc làm cho người cao tuổi — an sinh bền vững.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân bố lại dân cư, lao động hợp lí giữa các vùng nhằm:", "options": ["A. Giảm chênh lệch phát triển, khai thác hiệu quả tiềm năng các vùng", "B. Tập trung hết về thành phố", "C. Bỏ hoang miền núi", "D. Không có mục đích"], "answer": "A", "explain": "Điều tiết dân cư, lao động: giảm quá tải đô thị, đưa lao động, tri thức về vùng khó khăn — phát triển cân đối các vùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chính sách dân số theo vùng có nghĩa là:", "options": ["A. Vùng mức sinh cao vận động giảm sinh, vùng mức sinh thấp khuyến khích sinh hợp lí", "B. Áp dụng một mức cho cả nước", "C. Không có chính sách", "D. Cấm sinh ở mọi vùng"], "answer": "A", "explain": "Mức sinh chênh lệch giữa các vùng (miền núi cao, đô thị thấp): chính sách linh hoạt theo vùng mới hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một tỉnh miền núi có mức sinh 2,8 con/phụ nữ, tỉ lệ hộ nghèo cao. Ưu tiên chính sách nào?", "options": ["A. Vận động kế hoạch hóa gia đình gắn với giảm nghèo, nâng cao dân trí", "B. Khuyến khích sinh thêm", "C. Không can thiệp", "D. Chỉ phát tiền"], "answer": "A", "explain": "Mức sinh cao + nghèo đói: vận động sinh ít con, kết hợp giảm nghèo, giáo dục — nâng cao chất lượng dân số vùng khó khăn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Chiến lược dân số Việt Nam đến 2030 hướng tới:", "options": ["A. Dân số phát triển toàn diện cả số lượng và chất lượng, thích ứng già hóa", "B. Chỉ tăng số lượng", "C. Chỉ giảm số lượng", "D. Duy trì hiện trạng"], "answer": "A", "explain": "Chiến lược: mức sinh hợp lí, nâng cao chất lượng (tầm vóc, trí tuệ), phân bố hợp lí, thích ứng già hóa — phát triển bền vững.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phát triển kinh tế, tạo việc làm là giải pháp căn bản cho sức ép dân số.", "b) Cần hoàn thiện an sinh xã hội để thích ứng già hóa.", "c) Chính sách dân số cần phù hợp từng vùng.", "d) Không cần chính sách dân số."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vùng mức sinh cao cần vận động giảm sinh.", "b) Vùng mức sinh thấp cần khuyến khích sinh hợp lí.", "c) Phân bố lao động hợp lí giúp phát triển cân đối các vùng.", "d) Mọi vùng áp dụng chính sách giống hệt nhau mới công bằng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: công bằng là phù hợp với đặc điểm từng vùng, không phải giống hệt nhau.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một tỉnh có 2 triệu dân, tỉ lệ tăng tự nhiên 1,2%/năm. Mỗi năm dân số tăng thêm bao nhiêu nghìn người (chỉ ghi số)?", "answer": "24", "explain": "2000 nghìn × 1,2% = 24 nghìn người/năm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Để đạt mức sinh thay thế 2,1 con/phụ nữ từ mức 1,91, mỗi phụ nữ cần sinh thêm trung bình bao nhiêu con (1 chữ số thập phân)?", "answer": "0,2", "explain": "2,1 − 1,91 = 0,19 ≈ 0,2 con. Khoảng cách không lớn nhưng cần chính sách hỗ trợ thiết thực để các gia đình yên tâm sinh con.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Nội dung nào sau đây KHÔNG thuộc bài Dân số Việt Nam?", "options": ["A. Quá trình feralit", "B. Cơ cấu dân số theo tuổi", "C. Phân bố dân cư", "D. Mật độ dân số"], "answer": "A", "explain": "Quá trình feralit thuộc bài Thiên nhiên nhiệt đới ẩm gió mùa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Số liệu nào sau đây đúng về dân số Việt Nam năm 2024?", "options": ["A. 101,3 triệu người; mật độ 305 người/km2; thành thị 38,5%", "B. 90 triệu người; mật độ 200 người/km2", "C. 110 triệu người; thành thị 60%", "D. 85 triệu người; mật độ 150 người/km2"], "answer": "A", "explain": "101,3 triệu người; 305 người/km2; thành thị 38,5% — số liệu Điều tra dân số giữa kỳ 2024.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các phát biểu: (1) Dân số 101,3 triệu người; (2) Cơ cấu dân số vàng; (3) Đang già hóa; (4) Phân bố không đều. Số phát biểu đúng là:", "options": ["A. 1", "B. 2", "C. 3", "D. 4"], "answer": "D", "explain": "Cả 4 đều đúng — bức tranh tổng quát về dân số Việt Nam hiện nay.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa dân số và phát triển kinh tế được hiểu đúng là:", "options": ["A. Dân số vừa là nguồn lực vừa là thị trường, nhưng đông quá gây sức ép", "B. Dân số càng đông càng tốt", "C. Dân số không liên quan đến kinh tế", "D. Nên giảm dân số bằng mọi giá"], "answer": "A", "explain": "Dân số là nguồn lao động và thị trường tiêu thụ; nhưng tăng nhanh quá gây sức ép — cần quy mô, cơ cấu, chất lượng hợp lí.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một quốc gia có tháp dân số thu hẹp đáy như Việt Nam. Chính sách ưu tiên trong 10 năm tới là:", "options": ["A. Khuyến khích mức sinh hợp lí, chuẩn bị an sinh tuổi già, nâng cao năng suất lao động", "B. Tiếp tục giảm sinh mạnh", "C. Không có chính sách", "D. Tăng sinh tối đa"], "answer": "A", "explain": "Đáy thu hẹp → già hóa nhanh: cần mức sinh hợp lí (2,1 con), an sinh, y tế người già, tự động hóa bù đắp thiếu hụt lao động.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tổng kết bài học, thách thức dân số lớn nhất của Việt Nam trong 20 năm tới là:", "options": ["A. Già hóa nhanh trong khi thu nhập còn ở mức trung bình (già trước khi giàu)", "B. Dân số bùng nổ", "C. Thiếu hoàn toàn lao động ngay lập tức", "D. Không có thách thức"], "answer": "A", "explain": "Nguy cơ già trước khi giàu: mức sinh thấp, già hóa nhanh trong khi thu nhập bình quân còn trung bình — cần tăng năng suất, an sinh bền vững.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định ôn tập sau:", "statements": ["a) Dân số năm 2024 khoảng 101,3 triệu người.", "b) Cơ cấu dân số vàng: 15 – 64 tuổi chiếm 67,4%.", "c) Mật độ 305 người/km2, phân bố không đều.", "d) Dân số không ảnh hưởng đến phát triển."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: dân số ảnh hưởng sâu sắc đến phát triển KT – XH.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tỉ số giới tính khi sinh mất cân bằng (111,4).", "b) Tỉ lệ dân thành thị đang tăng nhanh.", "c) Chất lượng dân số ngày càng được nâng cao.", "d) Không cần quan tâm đến vấn đề dân tộc."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: 54 dân tộc anh em, chính sách dân tộc là vấn đề quan trọng.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Kể tên hai vấn đề dân số nổi cộm hiện nay của Việt Nam (viết cách nhau bằng dấu phẩy).", "answer": "Già hóa dân số, mất cân bằng giới tính khi sinh", "explain": "Hai vấn đề lớn: già hóa nhanh và mất cân bằng giới tính khi sinh (111,4 bé trai/100 bé gái).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho bảng số liệu (triệu người): 2019: 96,2; 2024: 101,3. Nếu giữ tốc độ tăng bình quân 0,99%/năm, dân số năm 2030 khoảng bao nhiêu triệu người (1 chữ số thập phân)?", "answer": "107,5", "explain": "101,3 × (1,0099)^6 ≈ 101,3 × 1,0609 ≈ 107,47 ≈ 107,5 triệu người.", "points": 0.5}]}]}
