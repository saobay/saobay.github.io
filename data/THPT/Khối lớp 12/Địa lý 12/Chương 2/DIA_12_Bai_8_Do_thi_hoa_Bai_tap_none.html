{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Tỉ lệ dân thành thị của Việt Nam năm 2024 là bao nhiêu?", "options": ["A. 38,5%", "B. 55,0%", "C. 25,0%", "D. 60,0%"], "answer": "A", "explain": "Năm 2024, dân thành thị 39,0 triệu người, chiếm 38,5% tổng dân số (Tổng cục Thống kê).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Hai đô thị đặc biệt của Việt Nam là:", "options": ["A. Hà Nội và Thành phố Hồ Chí Minh", "B. Hải Phòng và Đà Nẵng", "C. Cần Thơ và Huế", "D. Đà Nẵng và Cần Thơ"], "answer": "A", "explain": "Hà Nội (thủ đô) và TP. Hồ Chí Minh (trung tâm kinh tế lớn nhất) là hai đô thị đặc biệt, đầu tàu phát triển.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tỉ lệ dân thành thị tăng từ 19,5% (1990) lên 38,5% (2024). Nguyên nhân chính là:", "options": ["A. Công nghiệp hóa, đô thị hóa và di cư nông thôn – thành thị", "B. Tỉ suất sinh ở thành thị cao", "C. Nông thôn giảm dân số tự nhiên", "D. Thành thị không có người chuyển đi"], "answer": "A", "explain": "Công nghiệp hóa tạo việc làm đô thị, thu hút di cư; mở rộng địa giới đô thị — động lực của đô thị hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đô thị ở Việt Nam phân bố không đều, tập trung ở:", "options": ["A. Đồng bằng sông Hồng, Đông Nam Bộ và duyên hải miền Trung", "B. Tây Nguyên và miền núi phía Bắc", "C. Vùng sâu, vùng xa", "D. Hải đảo"], "answer": "A", "explain": "Đô thị gắn với kinh tế: tập trung ở đồng bằng, ven biển, nơi công nghiệp, dịch vụ phát triển; thưa thớt ở miền núi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tỉ lệ đô thị hóa của Việt Nam (38,5%) thấp hơn nhiều so với bình quân thế giới (khoảng 57%). Điều này cho thấy:", "options": ["A. Đô thị hóa còn nhiều dư địa, cần quy hoạch đi trước một bước", "B. Không cần đô thị hóa nữa", "C. Việt Nam đã quá tải đô thị", "D. Nên hạn chế đô thị hóa"], "answer": "A", "explain": "Dư địa lớn nhưng phải quy hoạch đồng bộ hạ tầng, tránh lặp lại quá tải, ô nhiễm của đô thị hiện nay.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một tỉnh miền núi muốn đẩy nhanh đô thị hóa bền vững. Hướng đi đúng là:", "options": ["A. Phát triển đô thị gắn với thế mạnh địa phương (du lịch, chế biến nông sản), hạ tầng đồng bộ", "B. Xây thật nhiều chung cư không cần quy hoạch", "C. Chỉ mở rộng địa giới hành chính", "D. Để tự phát"], "answer": "A", "explain": "Đô thị hóa bền vững: dựa trên kinh tế thực (du lịch, chế biến), quy hoạch hạ tầng, bảo vệ cảnh quan — không chạy theo số lượng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tỉ lệ dân thành thị năm 2024 là 38,5%.", "b) Hà Nội và TP. Hồ Chí Minh là đô thị đặc biệt.", "c) Đô thị phân bố không đều giữa các vùng.", "d) Việt Nam đã có tỉ lệ đô thị hóa rất cao."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: 38,5% còn thấp so với thế giới.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Công nghiệp hóa thúc đẩy đô thị hóa.", "b) Di cư góp phần tăng dân thành thị.", "c) Mở rộng địa giới làm tăng số dân thành thị.", "d) Đô thị hóa chỉ do tăng dân số tự nhiên ở thành thị."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: động lực chính là di cư cơ học và mở rộng đô thị.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Tỉ lệ dân thành thị tăng từ 19,5% (1990) lên 38,5% (2024). Tính mức tăng (đơn vị điểm phần trăm, 1 chữ số thập phân).", "answer": "19,0", "explain": "38,5 − 19,5 = 19,0 điểm phần trăm sau 34 năm — tốc độ đô thị hóa nhanh.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Dân thành thị 39,0 triệu người (2024), tốc độ tăng 3,06%/năm. Dự báo dân thành thị năm 2030 khoảng bao nhiêu triệu người (1 chữ số thập phân)?", "answer": "46,7", "explain": "39,0 × (1,0306)^6 ≈ 39,0 × 1,198 ≈ 46,7 triệu người — đô thị tiếp tục phình to nhanh.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Ảnh hưởng tích cực quan trọng nhất của đô thị hóa đối với kinh tế là:", "options": ["A. Thúc đẩy chuyển dịch cơ cấu kinh tế theo hướng công nghiệp – dịch vụ", "B. Tăng sản lượng lúa", "C. Giảm việc làm", "D. Tăng ô nhiễm"], "answer": "A", "explain": "Đô thị là nơi tập trung công nghiệp, dịch vụ — đô thị hóa thúc đẩy chuyển dịch cơ cấu, tăng trưởng kinh tế.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đô thị hóa tạo ra lợi ích nào cho người lao động?", "options": ["A. Nhiều việc làm, thu nhập cao hơn, tiếp cận dịch vụ tốt hơn", "B. Ít việc làm hơn", "C. Thu nhập thấp hơn", "D. Không có lợi ích"], "answer": "A", "explain": "Đô thị tập trung việc làm đa dạng, thu nhập cao hơn nông thôn, dịch vụ y tế, giáo dục tốt hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đô thị có vai trò lan tỏa phát triển ra vùng xung quanh vì:", "options": ["A. Là trung tâm công nghiệp, dịch vụ, khoa học, tiêu thụ sản phẩm của vùng", "B. Đô thị tách biệt với nông thôn", "C. Đô thị không ảnh hưởng vùng xung quanh", "D. Vùng xung quanh không cần đô thị"], "answer": "A", "explain": "Đô thị là thị trường tiêu thụ, cung cấp vật tư, kĩ thuật, việc làm cho vùng phụ cận — động lực lan tỏa (vùng đô thị, hành lang kinh tế).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lối sống văn minh đô thị thể hiện ở:", "options": ["A. Ý thức pháp luật, nếp sống văn minh, tiếp cận tri thức hiện đại", "B. Sống tự phát", "C. Không tuân thủ quy định", "D. Lối sống lạc hậu"], "answer": "A", "explain": "Môi trường đô thị với giáo dục, văn hóa, pháp luật nghiêm minh hình thành lối sống văn minh, hiện đại.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một vùng nông thôn gần khu công nghiệp có thu nhập tăng nhanh. Đây là biểu hiện của:", "options": ["A. Tác động lan tỏa của đô thị hóa, công nghiệp hóa", "B. Ngẫu nhiên", "C. Nông thôn tự phát triển không liên quan đô thị", "D. Giá nông sản tăng duy nhất"], "answer": "A", "explain": "Khu công nghiệp, đô thị tạo việc làm, thị trường, dịch vụ cho vùng ven — lan tỏa phát triển, tăng thu nhập nông thôn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để phát huy mặt tích cực của đô thị hóa, cần:", "options": ["A. Quy hoạch đồng bộ, phát triển kinh tế đô thị gắn với an sinh xã hội", "B. Để đô thị tự phát", "C. Hạn chế đầu tư đô thị", "D. Chỉ phát triển nhà cao tầng"], "answer": "A", "explain": "Đô thị hóa thành công khi: kinh tế phát triển tạo việc làm, hạ tầng đồng bộ, an sinh cho người nhập cư — phát triển bao trùm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đô thị hóa thúc đẩy chuyển dịch cơ cấu kinh tế.", "b) Đô thị tạo nhiều việc làm, thu nhập cao hơn.", "c) Đô thị lan tỏa phát triển ra vùng xung quanh.", "d) Đô thị hóa chỉ gây tác động tiêu cực."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: có cả tác động tích cực quan trọng.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đô thị là trung tâm công nghiệp, dịch vụ.", "b) Người dân đô thị tiếp cận dịch vụ tốt hơn.", "c) Đô thị hóa nâng cao trình độ dân trí.", "d) Nông thôn không chịu ảnh hưởng của đô thị hóa."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đô thị tác động mạnh đến nông thôn (việc làm, thị trường, lối sống).", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một khu công nghiệp tạo 10000 việc làm, mỗi việc làm nuôi sống bình quân 3 người. Số người được hưởng lợi khoảng bao nhiêu nghìn (chỉ ghi số)?", "answer": "30", "explain": "10000 × 3 = 30000 người = 30 nghìn người — tác động lan tỏa việc làm của đô thị, công nghiệp.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thu nhập bình quân đô thị cao gấp 1,8 lần nông thôn. Thu nhập nông thôn 5 triệu đồng/tháng. Thu nhập đô thị khoảng bao nhiêu triệu đồng (1 chữ số thập phân)?", "answer": "9,0", "explain": "5 × 1,8 = 9,0 triệu đồng/tháng — chênh lệch thu nhập là động lực di cư nông thôn – thành thị.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Vấn đề nổi cộm nhất của các đô thị lớn ở Việt Nam hiện nay là:", "options": ["A. Ùn tắc giao thông và ô nhiễm môi trường", "B. Thiếu việc làm hoàn toàn", "C. Không có trường học", "D. Dân số giảm"], "answer": "A", "explain": "Hà Nội, TP. Hồ Chí Minh quá tải: kẹt xe giờ cao điểm, ô nhiễm không khí, ngập úng — vấn đề cấp bách nhất.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nguyên nhân chính gây ùn tắc giao thông ở đô thị lớn là:", "options": ["A. Phương tiện cá nhân tăng nhanh, hạ tầng giao thông chưa theo kịp", "B. Đường quá rộng", "C. Ít người đi lại", "D. Giao thông công cộng quá tốt"], "answer": "A", "explain": "Xe máy, ô tô tăng nhanh trong khi đường sá, giao thông công cộng chưa đáp ứng — mất cân đối cung cầu giao thông.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ô nhiễm không khí ở đô thị lớn chủ yếu do:", "options": ["A. Khí thải giao thông, công nghiệp và xây dựng", "B. Cây xanh quá nhiều", "C. Mưa nhiều", "D. Gió biển"], "answer": "A", "explain": "Xe cộ, nhà máy, công trình xây dựng thải bụi, khí độc — Hà Nội, TP. Hồ Chí Minh nhiều thời điểm ô nhiễm vượt chuẩn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lao động nhập cư ở đô thị thường gặp khó khăn nào?", "options": ["A. Nhà ở, việc làm bấp bênh, tiếp cận dịch vụ hạn chế", "B. Thu nhập quá cao", "C. Được ưu đãi mọi mặt", "D. Không có khó khăn"], "answer": "A", "explain": "Lao động nhập cư: nhà trọ chật chội, việc làm phi chính thức bấp bênh, khó tiếp cận trường học, y tế — cần chính sách an sinh.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một thành phố có 2 triệu phương tiện cá nhân nhưng chỉ đáp ứng 10% nhu cầu đi lại bằng giao thông công cộng. Giải pháp căn bản là:", "options": ["A. Phát triển đường sắt đô thị, xe buýt nhanh, hạn chế xe cá nhân", "B. Mở thêm đường cho xe cá nhân vô hạn", "C. Cấm người dân đi lại", "D. Không làm gì"], "answer": "A", "explain": "Đô thị hiện đại: giao thông công cộng khối lượng lớn (metro, BRT) + hạn chế xe cá nhân — giảm ùn tắc, ô nhiễm bền vững.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Ngập úng đô thị sau mưa lớn ngày càng nghiêm trọng vì:", "options": ["A. Bê tông hóa làm mất diện tích thấm nước, hệ thống thoát nước lạc hậu, biến đổi khí hậu", "B. Mưa ít đi", "C. Sông ngòi nhiều hơn", "D. Dân số giảm"], "answer": "A", "explain": "Đô thị hóa ồ ạt: mặt đất bê tông hóa, lấn ao hồ, thoát nước kém + mưa cực đoan gia tăng — ngập úng là hệ quả tổng hợp.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ùn tắc giao thông là vấn đề nổi cộm của đô thị lớn.", "b) Ô nhiễm không khí đô thị chủ yếu do giao thông, công nghiệp.", "c) Lao động nhập cư gặp khó khăn về nhà ở, việc làm.", "d) Đô thị không có vấn đề môi trường nào."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phương tiện cá nhân tăng nhanh gây ùn tắc.", "b) Bê tông hóa góp phần gây ngập úng đô thị.", "c) Giao thông công cộng giúp giảm ùn tắc, ô nhiễm.", "d) Ô nhiễm đô thị không ảnh hưởng sức khỏe."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: ô nhiễm gây bệnh hô hấp, ung thư...", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một thành phố có 500000 xe máy, mỗi xe thải 100 g CO/ngày. Tổng lượng CO thải ra mỗi ngày là bao nhiêu tấn (chỉ ghi số)?", "answer": "50", "explain": "500000 × 100 g = 50000000 g = 50 tấn/ngày — nguồn ô nhiễm không khí khổng lồ từ giao thông.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Diện tích mặt nước, cây xanh của một đô thị giảm từ 15% xuống 8% sau 10 năm. Tính mức giảm (đơn vị điểm phần trăm, chỉ ghi số).", "answer": "7", "explain": "15 − 8 = 7 điểm phần trăm — mất không gian xanh làm tăng ngập úng, hiệu ứng đảo nhiệt đô thị.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Giải pháp quan trọng nhất để giảm quá tải cho đô thị trung tâm là:", "options": ["A. Phát triển đô thị vệ tinh, giãn dân ra vùng ven", "B. Xây thêm nhà cao tầng ở trung tâm", "C. Cấm người nhập cư", "D. Không làm gì"], "answer": "A", "explain": "Đô thị vệ tinh: chuyển chức năng, dân cư ra vùng ven có hạ tầng đồng bộ — giảm tải trung tâm, phát triển cân đối vùng đô thị.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhà ở xã hội nhằm mục đích:", "options": ["A. Giúp người thu nhập thấp, công nhân có nhà ở", "B. Chỉ bán cho người giàu", "C. Đầu cơ bất động sản", "D. Không có mục đích"], "answer": "A", "explain": "Nhà ở xã hội giá rẻ, hỗ trợ vay vốn — giải quyết nhu cầu nhà ở bức thiết của công nhân, người thu nhập thấp đô thị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ưu tiên phát triển giao thông công cộng vì:", "options": ["A. Chở được nhiều người, giảm ùn tắc, ô nhiễm, tiết kiệm năng lượng", "B. Tốn kém vô ích", "C. Không ai đi", "D. Chỉ để trang trí"], "answer": "A", "explain": "Một đoàn tàu metro chở hàng nghìn người, thay thế hàng nghìn xe cá nhân — giải pháp căn cơ cho giao thông đô thị.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đô thị xanh được hiểu là:", "options": ["A. Nhiều cây xanh, mặt nước, năng lượng sạch, quản lí thông minh", "B. Sơn màu xanh", "C. Chỉ trồng cây", "D. Không có xe cộ"], "answer": "A", "explain": "Đô thị xanh – thông minh: không gian xanh, năng lượng tái tạo, xử lí chất thải, quản lí số — nâng chất lượng sống, thích ứng biến đổi khí hậu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một đô thị vệ tinh quy hoạch cho 500000 dân với đầy đủ trường học, bệnh viện, việc làm. Mục tiêu chính là:", "options": ["A. Giảm tải cho đô thị trung tâm, tạo cực tăng trưởng mới", "B. Tăng dân số trung tâm", "C. Chỉ để ở, không làm việc", "D. Tách biệt hoàn toàn"], "answer": "A", "explain": "Đô thị vệ tinh thành công khi có việc làm, dịch vụ đầy đủ — người dân không phải vào trung tâm hằng ngày, giảm ùn tắc.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để quản lí đô thị thông minh, cần:", "options": ["A. Dữ liệu số, camera, giao thông thông minh, chính quyền điện tử", "B. Chỉ cần nhiều cảnh sát", "C. Không cần công nghệ", "D. Quản lí thủ công"], "answer": "A", "explain": "Đô thị thông minh: số hóa quản lí (giao thông, môi trường, an ninh), dịch vụ công trực tuyến — nâng hiệu quả, minh bạch.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đô thị vệ tinh giúp giảm tải đô thị trung tâm.", "b) Nhà ở xã hội giúp người thu nhập thấp có nhà ở.", "c) Giao thông công cộng giảm ùn tắc, ô nhiễm.", "d) Không cần quy hoạch đô thị."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quy hoạch đồng bộ là điều kiện tiên quyết.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đô thị xanh có nhiều cây xanh, mặt nước.", "b) Đô thị thông minh ứng dụng công nghệ số.", "c) Phát triển đô thị phải gắn với bảo vệ môi trường.", "d) Nên để đô thị phát triển tự phát."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tự phát gây quá tải, ô nhiễm, lãng phí.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một dự án nhà ở xã hội có 2000 căn, mỗi căn 60 m2. Tổng diện tích sàn xây dựng là bao nhiêu nghìn m2 (chỉ ghi số)?", "answer": "120", "explain": "2000 × 60 = 120000 m2 = 120 nghìn m2 — quy mô lớn đáp ứng nhu cầu nhà ở công nhân.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tỉ lệ sử dụng giao thông công cộng ở một thành phố tăng từ 10% lên 25%. Tính mức tăng (đơn vị điểm phần trăm, chỉ ghi số).", "answer": "15", "explain": "25 − 10 = 15 điểm phần trăm — chuyển dịch tích cực, giảm áp lực xe cá nhân.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Mạng lưới đô thị Việt Nam có đặc điểm nào sau đây?", "options": ["A. Phân bố không đều, tập trung ở đồng bằng, ven biển", "B. Phân bố đều khắp cả nước", "C. Chỉ có ở miền núi", "D. Không có đô thị loại I"], "answer": "A", "explain": "Đô thị gắn với kinh tế: dày đặc ở đồng bằng sông Hồng, Đông Nam Bộ, duyên hải; thưa ở miền núi, Tây Nguyên.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Các đô thị lớn có vai trò nào đối với vùng?", "options": ["A. Trung tâm kinh tế, lan tỏa phát triển ra vùng xung quanh", "B. Tách biệt với vùng", "C. Chỉ phục vụ nội đô", "D. Kìm hãm vùng xung quanh"], "answer": "A", "explain": "Đô thị lớn là đầu tàu: tập trung công nghiệp, dịch vụ, khoa học — lan tỏa vốn, kĩ thuật, thị trường ra vùng phụ cận.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vùng đô thị TP. Hồ Chí Minh gồm TP. Hồ Chí Minh và các tỉnh xung quanh. Ý nghĩa của liên kết vùng đô thị là:", "options": ["A. Phối hợp quy hoạch, chia sẻ hạ tầng, phát triển đồng bộ", "B. Cạnh tranh triệt tiêu lẫn nhau", "C. Tách biệt hành chính tuyệt đối", "D. Không có ý nghĩa"], "answer": "A", "explain": "Vùng đô thị: liên kết giao thông, phân công chức năng, bảo vệ môi trường chung — phát triển bền vững cả vùng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đô thị loại I ở Việt Nam (như Hải Phòng, Đà Nẵng, Cần Thơ) có vai trò:", "options": ["A. Trung tâm kinh tế – xã hội của vùng", "B. Chỉ là thị xã nhỏ", "C. Không có vai trò", "D. Chỉ phục vụ nông thôn"], "answer": "A", "explain": "Đô thị loại I là trung tâm vùng: công nghiệp, cảng biển, dịch vụ, giáo dục — động lực phát triển vùng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một tỉnh có 1 đô thị loại II và 5 đô thị loại IV, V. Để nâng cấp mạng lưới đô thị, nên:", "options": ["A. Đầu tư nâng cấp đô thị hiện có gắn với phát triển kinh tế, không chạy theo số lượng", "B. Nâng tất cả lên loại I", "C. Xây thêm thật nhiều đô thị mới", "D. Bỏ qua chất lượng"], "answer": "A", "explain": "Chất lượng quan trọng hơn số lượng: hạ tầng, kinh tế, môi trường đạt chuẩn mới nâng loại — tránh đô thị danh nghĩa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phát triển chùm đô thị (nhiều đô thị liên kết) thay vì một siêu đô thị duy nhất giúp:", "options": ["A. Phân tán áp lực, phát triển cân đối, giảm quá tải", "B. Tăng quá tải", "C. Lãng phí nguồn lực", "D. Không có lợi ích"], "answer": "A", "explain": "Chùm đô thị đa cực: mỗi đô thị có chức năng riêng, liên kết chặt — tránh phình to một cực gây quá tải như hiện nay.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mạng lưới đô thị phân bố không đều.", "b) Đô thị lớn là trung tâm, lan tỏa phát triển.", "c) Vùng đô thị cần liên kết quy hoạch.", "d) Mọi đô thị đều có vai trò như nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đô thị phân cấp (đặc biệt, loại I, II...) với vai trò khác nhau.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đô thị loại I là trung tâm của vùng.", "b) Chất lượng đô thị quan trọng hơn số lượng.", "c) Chùm đô thị giúp phát triển cân đối.", "d) Nên tập trung tất cả vào một siêu đô thị."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: siêu đô thị duy nhất dễ quá tải — cần đa cực.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Cả nước có hơn 850 đô thị, trong đó 2 đô thị đặc biệt. Tỉ lệ đô thị đặc biệt khoảng bao nhiêu % (2 chữ số thập phân)?", "answer": "0,24", "explain": "2 ÷ 850 × 100% ≈ 0,235 ≈ 0,24% — hai đầu tàu Hà Nội và TP. Hồ Chí Minh có vai trò đặc biệt.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một vùng đô thị có 5 tỉnh, dân số 20 triệu người. Bình quân mỗi tỉnh bao nhiêu triệu người (chỉ ghi số)?", "answer": "4", "explain": "20 ÷ 5 = 4 triệu người/tỉnh — quy mô vùng đô thị lớn, cần liên kết chặt chẽ.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Mối quan hệ giữa đô thị và nông thôn là:", "options": ["A. Gắn bó, tác động qua lại, cùng phát triển", "B. Đối lập, tách biệt", "C. Đô thị không cần nông thôn", "D. Nông thôn không cần đô thị"], "answer": "A", "explain": "Đô thị cung cấp thị trường, kĩ thuật, việc làm; nông thôn cung cấp lương thực, nguyên liệu, lao động — quan hệ hữu cơ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chương trình nông thôn mới nhằm mục đích:", "options": ["A. Nâng cao đời sống nông thôn, thu hẹp khoảng cách đô thị – nông thôn", "B. Biến nông thôn thành đô thị", "C. Bỏ nông nghiệp", "D. Di dời dân nông thôn"], "answer": "A", "explain": "Nông thôn mới: hạ tầng, kinh tế, văn hóa, môi trường — nông thôn văn minh, hiện đại nhưng giữ bản sắc, không phải đô thị hóa ồ ạt.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ly nông bất ly hương trong đô thị hóa có nghĩa là:", "options": ["A. Làm việc ở khu công nghiệp, đô thị nhưng vẫn sống ở quê", "B. Bỏ quê hoàn toàn", "C. Không làm việc", "D. Chỉ sống ở thành phố"], "answer": "A", "explain": "Công nghiệp hóa nông thôn, đô thị vệ tinh giúp lao động có việc làm phi nông nghiệp mà không phải di cư xa — giảm áp lực đô thị lớn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để thu hẹp khoảng cách đô thị – nông thôn, cần:", "options": ["A. Đầu tư hạ tầng, dịch vụ, việc làm cho nông thôn", "B. Bỏ mặc nông thôn", "C. Chỉ đầu tư đô thị", "D. Cấm phát triển nông thôn"], "answer": "A", "explain": "Cân đối đầu tư: điện, đường, trường, trạm, internet, việc làm phi nông nghiệp — nông thôn phát triển, giảm di cư ồ ạt.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một xã đạt chuẩn nông thôn mới nâng cao có thu nhập bình quân 60 triệu đồng/người/năm, gần bằng mức đô thị lân cận. Điều này cho thấy:", "options": ["A. Khoảng cách đô thị – nông thôn có thể thu hẹp bằng phát triển nội lực", "B. Nông thôn không thể phát triển", "C. Phải di cư mới giàu", "D. Ngẫu nhiên"], "answer": "A", "explain": "Nông thôn mới nâng cao, kiểu mẫu: kinh tế đa dạng, thu nhập cao — minh chứng nông thôn phát triển không thua kém đô thị.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong quá trình đô thị hóa, cần bảo vệ đất nông nghiệp vì:", "options": ["A. Bảo đảm an ninh lương thực, không gian xanh, cân bằng sinh thái", "B. Đất nông nghiệp không có giá trị", "C. Nên chuyển hết sang đất ở", "D. Nông nghiệp lạc hậu"], "answer": "A", "explain": "Đô thị hóa ồ ạt nuốt đất nông nghiệp đe dọa an ninh lương thực; vành đai xanh nông nghiệp còn điều hòa khí hậu, cảnh quan đô thị.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đô thị và nông thôn gắn bó, tác động qua lại.", "b) Nông thôn mới nâng cao đời sống nông dân.", "c) Cần thu hẹp khoảng cách đô thị – nông thôn.", "d) Nên bỏ mặc nông thôn, chỉ phát triển đô thị."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phát triển cân đối, không bỏ rơi nông thôn.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Ly nông bất ly hương giảm áp lực di cư.", "b) Cần bảo vệ đất nông nghiệp trong đô thị hóa.", "c) Nông thôn có thể phát triển không thua đô thị.", "d) Đô thị hóa phải đánh đổi nông thôn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: phát triển hài hòa, cùng có lợi.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một huyện có 70% lao động nông nghiệp. Sau 10 năm công nghiệp hóa, tỉ lệ này còn 40%. Tính mức giảm (đơn vị điểm phần trăm, chỉ ghi số).", "answer": "30", "explain": "70 − 40 = 30 điểm phần trăm — chuyển dịch cơ cấu lao động mạnh mẽ nhờ đô thị hóa, công nghiệp hóa.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thu nhập nông thôn mới nâng cao đạt 60 triệu đồng/người/năm, tăng 20% so với trước. Thu nhập trước đây là bao nhiêu triệu đồng (chỉ ghi số)?", "answer": "50", "explain": "60 ÷ 1,2 = 50 triệu đồng — tăng trưởng thu nhập nông thôn nhờ đa dạng hóa kinh tế.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Hạ tầng đô thị gồm:", "options": ["A. Giao thông, cấp thoát nước, điện, thông tin, nhà ở, trường học, bệnh viện", "B. Chỉ có đường sá", "C. Chỉ có nhà cao tầng", "D. Không có gì"], "answer": "A", "explain": "Hạ tầng kĩ thuật (giao thông, điện, nước...) và hạ tầng xã hội (trường, bệnh viện, công viên) — nền tảng của đô thị.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vấn đề cấp nước sạch ở đô thị hiện nay là:", "options": ["A. Nhu cầu tăng nhanh, một số nơi thiếu nước mùa khô, ô nhiễm nguồn nước", "B. Thừa nước hoàn toàn", "C. Không ai dùng nước", "D. Nước quá sạch"], "answer": "A", "explain": "Đô thị tăng dân nhanh, nguồn nước mặt ô nhiễm, nước ngầm sụt lún — cấp nước sạch là thách thức.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hệ thống thoát nước đô thị lạc hậu gây:", "options": ["A. Ngập úng sau mưa, ô nhiễm môi trường", "B. Khô hạn", "C. Nước sạch hơn", "D. Không ảnh hưởng"], "answer": "A", "explain": "Cống rãnh nhỏ, xuống cấp + bê tông hóa + mưa cực đoan → ngập úng, nước thải tràn lan gây ô nhiễm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phát triển nhà ở đô thị cần chú trọng:", "options": ["A. Đáp ứng nhu cầu đa dạng, nhất là nhà ở xã hội cho người thu nhập thấp", "B. Chỉ xây biệt thự", "C. Không cần nhà ở xã hội", "D. Để thị trường tự do hoàn toàn"], "answer": "A", "explain": "Thị trường nhà ở phân hóa: nhà cao cấp thừa, nhà giá rẻ thiếu — cần nhà ở xã hội, chính sách hỗ trợ để mọi người có nhà ở.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một đô thị 1 triệu dân cần khoảng 150 lít nước/người/ngày. Nhu cầu nước mỗi ngày là bao nhiêu nghìn m3 (chỉ ghi số)?", "options": ["A. 150", "B. 15", "C. 1500", "D. 1,5"], "answer": "A", "explain": "1000000 × 150 lít = 150 triệu lít = 150000 m3 = 150 nghìn m3/ngày — nhu cầu khổng lồ, cần nguồn cấp bền vững.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để phát triển hạ tầng đô thị bền vững, nguyên tắc nào đúng?", "options": ["A. Đi trước một bước, đồng bộ, gắn với bảo vệ môi trường", "B. Làm sau khi quá tải", "C. Chỉ làm đường", "D. Không cần quy hoạch"], "answer": "A", "explain": "Hạ tầng đi trước, đồng bộ (giao thông, nước, xử lí chất thải), xanh — tránh quá tải, ngập úng, ô nhiễm như hiện nay.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Hạ tầng gồm kĩ thuật và xã hội.", "b) Thoát nước kém gây ngập úng đô thị.", "c) Cần nhà ở xã hội cho người thu nhập thấp.", "d) Hạ tầng đô thị đã hoàn hảo."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: hạ tầng nhiều đô thị chưa đồng bộ, quá tải.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Cấp nước sạch là thách thức của đô thị.", "b) Hạ tầng cần đi trước một bước.", "c) Xử lí nước thải bảo vệ môi trường đô thị.", "d) Chỉ cần đầu tư nhà cao tầng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần đồng bộ mọi hạ tầng.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một đô thị thu gom được 80% trong 5000 tấn rác/ngày. Lượng rác chưa thu gom là bao nhiêu tấn (chỉ ghi số)?", "answer": "1000", "explain": "5000 × 20% = 1000 tấn/ngày — rác tồn đọng gây ô nhiễm, cần nâng tỉ lệ thu gom, xử lí.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Mật độ xây dựng cho phép 40% trên lô đất 10000 m2. Diện tích được phép xây dựng là bao nhiêu m2 (chỉ ghi số)?", "answer": "4000", "explain": "10000 × 40% = 4000 m2 — 60% còn lại dành cho cây xanh, sân vườn, giao thông nội bộ.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Cho bảng số liệu tỉ lệ dân thành thị (%): 1990: 19,5; 2000: 24,1; 2010: 30,5; 2024: 38,5. Năm có tỉ lệ cao nhất là:", "options": ["A. 2024", "B. 1990", "C. 2000", "D. 2010"], "answer": "A", "explain": "2024: 38,5% cao nhất — đô thị hóa tăng liên tục.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dựa vào bảng số liệu trên, xu hướng đô thị hóa giai đoạn 1990 – 2024 là:", "options": ["A. Tăng liên tục", "B. Giảm liên tục", "C. Không đổi", "D. Tăng rồi giảm"], "answer": "A", "explain": "19,5 → 24,1 → 30,5 → 38,5: tăng liên tục, giai đoạn sau tăng nhanh hơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Biểu đồ thích hợp nhất thể hiện tỉ lệ dân thành thị qua các năm là:", "options": ["A. Biểu đồ đường", "B. Biểu đồ tròn", "C. Biểu đồ miền", "D. Biểu đồ cột chồng"], "answer": "A", "explain": "Thay đổi một chỉ tiêu qua thời gian → biểu đồ đường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho bảng số liệu: Dân số Hà Nội khoảng 8,5 triệu, TP. Hồ Chí Minh khoảng 9,5 triệu (minh họa). Tổng dân số hai đô thị đặc biệt khoảng bao nhiêu triệu người?", "options": ["A. 18,0", "B. 8,5", "C. 9,5", "D. 1,0"], "answer": "A", "explain": "8,5 + 9,5 = 18,0 triệu người — chiếm khoảng 17,8% dân số cả nước, tập trung cao.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tỉ lệ dân thành thị tăng từ 30,5% (2010) lên 38,5% (2024). Tính tốc độ tăng bình quân (điểm phần trăm/năm, 2 chữ số thập phân).", "options": ["A. 0,57", "B. 0,80", "C. 0,40", "D. 1,00"], "answer": "A", "explain": "(38,5 − 30,5) ÷ 14 ≈ 0,571 ≈ 0,57 điểm phần trăm/năm.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Dân số hai đô thị đặc biệt 18 triệu người, cả nước 101,3 triệu. Tỉ lệ dân số hai đô thị so với cả nước là bao nhiêu % (1 chữ số thập phân)?", "options": ["A. 17,8", "B. 10,0", "C. 25,0", "D. 5,0"], "answer": "A", "explain": "18 ÷ 101,3 × 100% ≈ 17,77 ≈ 17,8% — gần 1/5 dân số tập trung ở hai đô thị đặc biệt, áp lực hạ tầng rất lớn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Cho bảng số liệu tỉ lệ dân thành thị (%): 1990: 19,5; 2024: 38,5. Xét tính đúng, sai:", "statements": ["a) Tỉ lệ năm 2024 cao hơn năm 1990.", "b) Mức tăng là 19,0 điểm phần trăm.", "c) Xu hướng tăng liên tục.", "d) Tỉ lệ năm 1990 cao hơn năm 2024."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: 38,5 − 19,5 = 19,0. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Biểu đồ đường thích hợp thể hiện tỉ lệ đô thị hóa qua các năm.", "b) Hai đô thị đặc biệt tập trung gần 1/5 dân số cả nước.", "c) Số liệu giúp quy hoạch đô thị.", "d) Không cần số liệu về đô thị hóa."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Tỉ lệ dân thành thị năm 2000 là 24,1%, năm 2024 là 38,5%. Tính mức tăng (đơn vị điểm phần trăm, 1 chữ số thập phân).", "answer": "14,4", "explain": "38,5 − 24,1 = 14,4 điểm phần trăm trong 24 năm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nếu giữ tốc độ tăng 0,57 điểm phần trăm/năm, sau 10 năm tỉ lệ dân thành thị khoảng bao nhiêu % (1 chữ số thập phân)?", "answer": "44,2", "explain": "38,5 + 0,57 × 10 = 44,2% — tiệm cận mức bình quân thế giới, cần chuẩn bị hạ tầng.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Đô thị thông minh là đô thị:", "options": ["A. Ứng dụng công nghệ số trong quản lí, dịch vụ để nâng cao chất lượng sống", "B. Chỉ có nhiều điện thoại", "C. Không cần công nghệ", "D. Chỉ xây nhà cao tầng"], "answer": "A", "explain": "Đô thị thông minh: IoT, dữ liệu lớn, AI trong giao thông, môi trường, an ninh, dịch vụ công — quản lí hiệu quả, minh bạch.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chính quyền điện tử trong đô thị giúp:", "options": ["A. Người dân làm thủ tục trực tuyến, nhanh chóng, minh bạch", "B. Tăng thủ tục", "C. Gây phiền hà", "D. Không có tác dụng"], "answer": "A", "explain": "Dịch vụ công trực tuyến: giảm thời gian, chi phí, tiêu cực — nền tảng của đô thị thông minh.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Giao thông thông minh gồm:", "options": ["A. Đèn tín hiệu điều khiển tự động, camera, thông tin kẹt xe trực tuyến", "B. Chỉ thêm cảnh sát", "C. Không cần công nghệ", "D. Cấm xe hoàn toàn"], "answer": "A", "explain": "Hệ thống giao thông thông minh điều tiết linh hoạt, cảnh báo kẹt xe — giảm ùn tắc hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để giảm hiệu ứng đảo nhiệt đô thị (nội đô nóng hơn ngoại ô), cần:", "options": ["A. Tăng cây xanh, mặt nước, vật liệu mát, giảm bê tông hóa", "B. Xây thêm nhà cao tầng", "C. Chặt cây xanh", "D. Tăng xe cộ"], "answer": "A", "explain": "Cây xanh, mặt nước làm mát; vật liệu phản xạ nhiệt; giảm bê tông — hạ nhiệt độ đô thị 2 – 3°C.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một thành phố lắp 1000 camera AI giám sát giao thông, giảm 20% vi phạm. Số vụ vi phạm trước đây 5000 vụ/tháng, nay còn bao nhiêu?", "options": ["A. 4000", "B. 1000", "C. 5000", "D. 6000"], "answer": "A", "explain": "5000 × (100% − 20%) = 4000 vụ/tháng — công nghệ nâng cao ý thức, an toàn giao thông.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Xây dựng đô thị thông minh ở Việt Nam cần lưu ý:", "options": ["A. Phù hợp điều kiện, lấy người dân làm trung tâm, bảo mật dữ liệu", "B. Sao chép nguyên mẫu nước ngoài", "C. Chỉ cần công nghệ đắt tiền", "D. Bỏ qua ý kiến người dân"], "answer": "A", "explain": "Thông minh phải phù hợp thực tế, phục vụ người dân, bảo vệ dữ liệu cá nhân — không phải trình diễn công nghệ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đô thị thông minh ứng dụng công nghệ số.", "b) Chính quyền điện tử giúp thủ tục nhanh, minh bạch.", "c) Cây xanh giúp giảm đảo nhiệt đô thị.", "d) Đô thị thông minh không cần công nghệ."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Giao thông thông minh giảm ùn tắc.", "b) Dữ liệu số giúp quản lí đô thị hiệu quả.", "c) Cần bảo mật dữ liệu cá nhân.", "d) Công nghệ thay thế hoàn toàn con người quản lí."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: công nghệ hỗ trợ, con người vẫn quyết định.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một app giao thông giúp 100000 người tránh kẹt xe mỗi ngày, tiết kiệm 30 phút/người. Tổng thời gian tiết kiệm mỗi ngày là bao nhiêu nghìn giờ (chỉ ghi số)?", "answer": "50", "explain": "100000 × 0,5 giờ = 50000 giờ = 50 nghìn giờ/ngày — giá trị kinh tế, xã hội to lớn của đô thị thông minh.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Diện tích cây xanh bình quân đầu người ở đô thị Việt Nam khoảng 2 m2, thấp hơn chuẩn 10 m2. Một đô thị 1 triệu dân cần thêm bao nhiêu ha cây xanh để đạt chuẩn (chỉ ghi số)?", "answer": "800", "explain": "(10 − 2) × 1000000 = 8000000 m2 = 800 ha — khoảng trống lớn cần lấp đầy để đô thị xanh, mát.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Nội dung nào sau đây KHÔNG thuộc bài Đô thị hóa?", "options": ["A. Quá trình feralit", "B. Tỉ lệ dân thành thị", "C. Ảnh hưởng của đô thị hóa", "D. Đô thị xanh, thông minh"], "answer": "A", "explain": "Quá trình feralit thuộc bài Thiên nhiên nhiệt đới ẩm gió mùa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Đặc điểm đúng về đô thị hóa ở Việt Nam là:", "options": ["A. Diễn ra nhanh, tỉ lệ 38,5% (2024), phân bố không đều", "B. Đã hoàn thành", "C. Tỉ lệ rất cao so với thế giới", "D. Phân bố đều khắp"], "answer": "A", "explain": "Đô thị hóa nhanh nhưng trình độ còn thấp, phân bố không đều — vừa cơ hội vừa thách thức.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các phát biểu: (1) Số đô thị tăng nhanh; (2) Tích cực: việc làm, chuyển dịch cơ cấu; (3) Tiêu cực: quá tải, ô nhiễm; (4) Cần phát triển bền vững. Số phát biểu đúng là:", "options": ["A. 1", "B. 2", "C. 3", "D. 4"], "answer": "D", "explain": "Cả 4 đều đúng — bức tranh toàn diện về đô thị hóa Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa đô thị hóa và công nghiệp hóa là:", "options": ["A. Tác động qua lại: công nghiệp hóa thúc đẩy đô thị hóa và ngược lại", "B. Không liên quan", "C. Đối lập nhau", "D. Chỉ một chiều"], "answer": "A", "explain": "Công nghiệp tạo việc làm đô thị; đô thị cung cấp lao động, thị trường, hạ tầng cho công nghiệp — quan hệ biện chứng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một địa phương muốn đô thị hóa nhanh nhưng bền vững. Nguyên tắc nào quan trọng nhất?", "options": ["A. Quy hoạch đi trước, kinh tế – xã hội – môi trường đồng bộ", "B. Xây dựng ồ ạt", "C. Chỉ tăng dân số đô thị", "D. Bỏ qua môi trường"], "answer": "A", "explain": "Bền vững = quy hoạch đồng bộ, kinh tế tạo việc làm thực, an sinh xã hội, bảo vệ môi trường — không đánh đổi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tổng kết: Đô thị hóa ở Việt Nam là:", "options": ["A. Xu thế tất yếu, vừa là động lực vừa đặt ra thách thức, cần quản lí để phát triển bền vững", "B. Chỉ có hại", "C. Chỉ có lợi", "D. Nên dừng lại"], "answer": "A", "explain": "Đô thị hóa tất yếu đi cùng công nghiệp hóa: phát huy động lực (kinh tế, văn minh), kiểm soát thách thức (quá tải, ô nhiễm) — phát triển bền vững.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định ôn tập sau:", "statements": ["a) Tỉ lệ dân thành thị năm 2024 là 38,5%.", "b) Đô thị hóa thúc đẩy chuyển dịch cơ cấu kinh tế.", "c) Đô thị lớn đang quá tải hạ tầng, ô nhiễm.", "d) Không cần phát triển đô thị bền vững."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đô thị vệ tinh giúp giảm tải đô thị trung tâm.", "b) Nhà ở xã hội cần cho người thu nhập thấp.", "c) Giao thông công cộng là giải pháp căn cơ.", "d) Đô thị và nông thôn nên phát triển tách biệt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần liên kết, cùng phát triển.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Kể tên hai giải pháp phát triển đô thị bền vững (viết cách nhau bằng dấu phẩy).", "answer": "Quy hoạch đồng bộ, phát triển giao thông công cộng", "explain": "Các giải pháp: quy hoạch đồng bộ, đô thị vệ tinh, nhà ở xã hội, giao thông công cộng, đô thị xanh – thông minh... (chấp nhận hai giải pháp đúng).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho bảng số liệu (minh họa): Số đô thị: 1990: 500; 2024: 850. Tính mức tăng bình quân mỗi năm (đô thị/năm, 1 chữ số thập phân).", "answer": "10,3", "explain": "(850 − 500) ÷ 34 ≈ 10,29 ≈ 10,3 đô thị/năm — tốc độ đô thị hóa nhanh về số lượng, cần nâng chất lượng.", "points": 0.5}]}]}
