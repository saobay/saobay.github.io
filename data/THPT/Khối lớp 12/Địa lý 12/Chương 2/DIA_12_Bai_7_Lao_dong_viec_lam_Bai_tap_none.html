<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "q": "Năm 2024, số lao động có việc làm của Việt Nam đạt khoảng bao nhiêu?", "options": ["A. 51,9 triệu người", "B. 41,9 triệu người", "C. 61,9 triệu người", "D. 31,9 triệu người"], "answer": "A", "explain": "Năm 2024, lao động có việc làm đạt 51,9 triệu người, tăng 585 nghìn người so với năm 2023 (Tổng cục Thống kê).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thế mạnh lớn nhất của nguồn lao động Việt Nam là:", "options": ["A. Dồi dào, trẻ, chăm chỉ, giá nhân công cạnh tranh", "B. Trình độ rất cao đồng đều", "C. Năng suất cao nhất khu vực", "D. Không cần đào tạo"], "answer": "A", "explain": "Dân số vàng tạo nguồn lao động dồi dào, trẻ; người lao động cần cù, khéo léo; chi phí nhân công cạnh tranh — thu hút FDI.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hạn chế lớn nhất của nguồn lao động Việt Nam hiện nay là:", "options": ["A. Phần lớn chưa qua đào tạo, năng suất lao động còn thấp", "B. Số lượng quá ít", "C. Tuổi quá cao", "D. Không chịu làm việc"], "answer": "A", "explain": "Tỉ lệ lao động qua đào tạo mới khoảng 27 – 28%; năng suất lao động thấp hơn nhiều nước trong khu vực — điểm nghẽn cần khắc phục.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Năng suất lao động của Việt Nam còn thấp chủ yếu do:", "options": ["A. Trình độ kĩ năng hạn chế, công nghệ lạc hậu ở nhiều ngành", "B. Lao động lười biếng", "C. Dân số ít", "D. Không có vốn"], "answer": "A", "explain": "Kĩ năng nghề nghiệp thấp, nhiều ngành dùng công nghệ lạc hậu, tỉ trọng nông nghiệp còn cao — năng suất chưa cao.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Lao động có việc làm năm 2024 là 51,9 triệu người, tăng 585 nghìn người so với năm 2023. Tính số lao động có việc làm năm 2023 (đơn vị triệu người, 2 chữ số thập phân).", "options": ["A. 51,32", "B. 52,49", "C. 50,00", "D. 51,90"], "answer": "A", "explain": "51,9 − 0,585 = 51,315 ≈ 51,32 triệu người.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để nâng cao chất lượng nguồn lao động, giải pháp căn bản, lâu dài nhất là:", "options": ["A. Đổi mới giáo dục – đào tạo gắn với nhu cầu thị trường và cách mạng công nghiệp 4.0", "B. Chỉ tăng lương", "C. Giảm giờ làm", "D. Hạn chế tuyển dụng"], "answer": "A", "explain": "Giáo dục – đào tạo, nhất là đào tạo nghề, kĩ năng số gắn với nhu cầu doanh nghiệp là chìa khóa nâng cao chất lượng nguồn nhân lực lâu dài.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Năm 2024 có 51,9 triệu lao động có việc làm.", "b) Nguồn lao động dồi dào là thế mạnh.", "c) Tỉ lệ lao động qua đào tạo còn thấp.", "d) Năng suất lao động đã cao nhất khu vực."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: năng suất lao động còn thấp so với nhiều nước trong khu vực.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lao động trẻ, chăm chỉ thu hút đầu tư nước ngoài.", "b) Thiếu kĩ năng là hạn chế lớn của lao động Việt Nam.", "c) Đào tạo nghề giúp nâng cao chất lượng lao động.", "d) Không cần đào tạo vì lao động đã đủ giỏi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Dân số trong độ tuổi lao động khoảng 68,3 triệu người, lao động có việc làm 51,9 triệu người. Tính tỉ lệ có việc làm (đơn vị %, 1 chữ số thập phân).", "answer": "76,0", "explain": "51,9 ÷ 68,3 × 100% ≈ 75,99 ≈ 76,0%. Phần còn lại gồm thất nghiệp, đang đi học, nội trợ, không có nhu cầu làm việc.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tỉ lệ lao động qua đào tạo là 27%. Trong 51,9 triệu lao động, số chưa qua đào tạo khoảng bao nhiêu triệu người (1 chữ số thập phân)?", "answer": "37,9", "explain": "51,9 × (100% − 27%) = 51,9 × 73% ≈ 37,89 ≈ 37,9 triệu người — đa số lao động chưa qua đào tạo, thách thức lớn.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Xu hướng chuyển dịch cơ cấu lao động theo ngành ở Việt Nam là:", "options": ["A. Giảm tỉ trọng nông, lâm, thủy sản; tăng công nghiệp – xây dựng và dịch vụ", "B. Tăng tỉ trọng nông nghiệp", "C. Giảm tỉ trọng dịch vụ", "D. Không thay đổi"], "answer": "A", "explain": "Phù hợp với công nghiệp hóa, hiện đại hóa: lao động chuyển từ nông nghiệp sang công nghiệp, dịch vụ có năng suất, thu nhập cao hơn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Khu vực nào thu hút lao động tăng nhanh nhất hiện nay?", "options": ["A. Công nghiệp – xây dựng và dịch vụ", "B. Nông nghiệp", "C. Lâm nghiệp", "D. Đánh bắt xa bờ"], "answer": "A", "explain": "Công nghiệp chế biến, xây dựng, thương mại, dịch vụ... thu hút lao động từ nông thôn, từ nông nghiệp chuyển sang.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên nhân chính của chuyển dịch cơ cấu lao động theo ngành là:", "options": ["A. Công nghiệp hóa, hiện đại hóa và đô thị hóa", "B. Thiên tai", "C. Dân số giảm", "D. Chiến tranh"], "answer": "A", "explain": "Công nghiệp hóa tạo việc làm công nghiệp, dịch vụ; đô thị hóa thu hút lao động — động lực chuyển dịch cơ cấu lao động.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho bảng số liệu tỉ trọng lao động (%, minh họa 2024): NLTS 27,0; CN-XD 34,0; DV 39,0. Nhận xét đúng là:", "options": ["A. Lao động dịch vụ chiếm tỉ trọng cao nhất", "B. Lao động nông nghiệp chiếm cao nhất", "C. Ba khu vực bằng nhau", "D. Công nghiệp chiếm thấp nhất"], "answer": "A", "explain": "Dịch vụ 39,0% cao nhất, tiếp theo công nghiệp – xây dựng 34,0%, nông lâm thủy sản 27,0% — cơ cấu tiến bộ.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tỉ trọng lao động nông nghiệp giảm nhưng số lượng tuyệt đối vẫn lớn. Điều này cho thấy:", "options": ["A. Chuyển dịch cơ cấu còn chậm, nông thôn còn dư thừa lao động", "B. Nông nghiệp không còn vai trò", "C. Đã hoàn thành công nghiệp hóa", "D. Lao động nông nghiệp bằng không"], "answer": "A", "explain": "Tỉ trọng giảm nhưng số tuyệt đối vẫn hàng chục triệu người — nông thôn còn dư thừa lao động, cần đẩy nhanh chuyển dịch.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để chuyển dịch cơ cấu lao động nhanh và bền vững, cần:", "options": ["A. Phát triển công nghiệp, dịch vụ tạo việc làm chất lượng gắn với đào tạo lại lao động nông nghiệp", "B. Buộc nông dân bỏ ruộng", "C. Cấm lao động nông nghiệp", "D. Chỉ phát triển nông nghiệp"], "answer": "A", "explain": "Tạo việc làm mới ở công nghiệp, dịch vụ đồng thời đào tạo lại, hỗ trợ lao động nông nghiệp chuyển đổi — chuyển dịch tự nguyện, bền vững.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tỉ trọng lao động nông nghiệp đang giảm.", "b) Tỉ trọng lao động công nghiệp, dịch vụ đang tăng.", "c) Chuyển dịch phù hợp với công nghiệp hóa.", "d) Cơ cấu lao động không thay đổi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Cho bảng số liệu (%, minh họa): NLTS 27,0; CN-XD 34,0; DV 39,0. Xét tính đúng, sai:", "statements": ["a) Dịch vụ chiếm tỉ trọng cao nhất.", "b) Nông, lâm, thủy sản chiếm thấp nhất.", "c) Tổng ba khu vực bằng 100%.", "d) Công nghiệp – xây dựng chiếm trên 50%."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: 27 + 34 + 39 = 100. d) Sai: 34% dưới 50%.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Lao động nông, lâm, thủy sản chiếm 27% trong 51,9 triệu lao động. Tính số lao động khu vực này (đơn vị triệu người, 1 chữ số thập phân).", "answer": "14,0", "explain": "51,9 × 27% ≈ 14,01 ≈ 14,0 triệu người — vẫn là con số lớn, cần tiếp tục chuyển dịch.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tỉ trọng lao động dịch vụ 39%, công nghiệp – xây dựng 34%. Tính chênh lệch (đơn vị điểm phần trăm, chỉ ghi số).", "answer": "5", "explain": "39 − 34 = 5 điểm phần trăm. Dịch vụ là khu vực thu hút lao động lớn nhất.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Năm 2024, lao động có việc làm ở thành thị và nông thôn lần lượt là:", "options": ["A. 19,9 triệu và 32,0 triệu người", "B. 32,0 triệu và 19,9 triệu người", "C. 25,0 triệu và 26,9 triệu người", "D. 10,0 triệu và 41,9 triệu người"], "answer": "A", "explain": "Thành thị 19,9 triệu, nông thôn 32,0 triệu người (Tổng cục Thống kê, 2024).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "So với năm 2023, lao động thành thị năm 2024 tăng 831 nghìn người còn nông thôn giảm 246 nghìn người. Điều này phản ánh:", "options": ["A. Xu hướng di cư và chuyển dịch lao động từ nông thôn ra thành thị", "B. Nông thôn không còn lao động", "C. Thành thị giảm việc làm", "D. Không có sự dịch chuyển"], "answer": "A", "explain": "Lao động rời nông nghiệp, nông thôn ra đô thị, khu công nghiệp tìm việc — xu hướng tất yếu của đô thị hóa, công nghiệp hóa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Lao động nông thôn chiếm đa số (32/51,9 triệu) nhưng năng suất thấp. Nguyên nhân chính là:", "options": ["A. Sản xuất nông nghiệp manh mún, thiếu việc làm phi nông nghiệp", "B. Nông dân lười", "C. Đất quá tốt", "D. Không có thị trường"], "answer": "A", "explain": "Ruộng đất manh mún, độc canh lúa, thiếu ngành nghề phi nông nghiệp → dư thừa lao động, thu nhập thấp, thiếu việc làm lúc nông nhàn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để giải quyết việc làm cho lao động nông thôn, hướng đi hiệu quả nhất là:", "options": ["A. Đa dạng hóa ngành nghề nông thôn: tiểu thủ công nghiệp, dịch vụ, du lịch", "B. Buộc tất cả ra thành phố", "C. Chỉ trồng lúa", "D. Không làm gì"], "answer": "A", "explain": "Phát triển ngành nghề phi nông nghiệp tại chỗ (làng nghề, chế biến nông sản, du lịch nông thôn) — tạo việc làm, tăng thu nhập, hạn chế di cư ồ ạt.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tỉ lệ lao động thành thị trong tổng số lao động có việc làm năm 2024 là bao nhiêu (làm tròn 1 chữ số thập phân)?", "options": ["A. 38,3%", "B. 61,7%", "C. 50,0%", "D. 27,0%"], "answer": "A", "explain": "19,9 ÷ 51,9 × 100% ≈ 38,34 ≈ 38,3% — tương ứng với tỉ lệ dân thành thị (38,5%).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một huyện nông thôn có 50000 lao động, 60% làm nông nghiệp thuần túy. Sau khi phát triển cụm công nghiệp và du lịch, tỉ lệ này giảm còn 40%. Số lao động chuyển sang phi nông nghiệp là bao nhiêu?", "options": ["A. 10000", "B. 30000", "C. 20000", "D. 5000"], "answer": "A", "explain": "(60% − 40%) × 50000 = 10000 lao động — chuyển dịch cơ cấu lao động nông thôn nhờ đa dạng hóa việc làm.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lao động thành thị 19,9 triệu, nông thôn 32,0 triệu người (2024).", "b) Lao động đang chuyển từ nông thôn ra thành thị.", "c) Nông thôn còn dư thừa lao động.", "d) Thành thị không cần thêm lao động."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đô thị, khu công nghiệp liên tục thu hút lao động.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đa dạng hóa ngành nghề tạo việc làm tại chỗ cho nông thôn.", "b) Làng nghề góp phần giải quyết việc làm nông thôn.", "c) Du lịch nông thôn tạo thêm việc làm, thu nhập.", "d) Lao động nông thôn chỉ nên làm nông nghiệp."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần đa dạng hóa để tăng thu nhập, giảm rủi ro.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Lao động nông thôn 32,0 triệu người, trong đó 70% làm nông nghiệp. Tính số lao động nông nghiệp ở nông thôn (đơn vị triệu người, 1 chữ số thập phân).", "answer": "22,4", "explain": "32,0 × 70% = 22,4 triệu người — lực lượng lớn cần được đào tạo lại, chuyển đổi dần.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Mỗi năm có khoảng 1 triệu lao động nông thôn chuyển sang khu vực phi nông nghiệp. Sau 5 năm, số lao động chuyển đổi khoảng bao nhiêu triệu người (chỉ ghi số)?", "answer": "5", "explain": "1 × 5 = 5 triệu người — quy mô chuyển dịch rất lớn, đòi hỏi đào tạo nghề đồng bộ.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Tỉ lệ thất nghiệp trong độ tuổi lao động năm 2024 của Việt Nam khoảng bao nhiêu?", "options": ["A. 2,2%", "B. 10,5%", "C. 5,8%", "D. 0,5%"], "answer": "A", "explain": "Khoảng 2,2% — mức thấp, cho thấy thị trường lao động cơ bản ổn định, việc làm được duy trì.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Tình trạng thiếu việc làm phổ biến nhất ở khu vực nào?", "options": ["A. Nông thôn", "B. Thành phố lớn", "C. Khu công nghiệp", "D. Khu chế xuất"], "answer": "A", "explain": "Nông thôn: nông nhàn thiếu việc, làm việc không đủ giờ, thu nhập thấp — thiếu việc làm cao hơn thất nghiệp công khai.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Phân biệt thất nghiệp và thiếu việc làm:", "options": ["A. Thất nghiệp: không có việc làm; thiếu việc làm: có việc nhưng không đủ giờ, thu nhập thấp", "B. Hai khái niệm giống nhau", "C. Thiếu việc làm chỉ ở thành thị", "D. Thất nghiệp không đáng lo"], "answer": "A", "explain": "Thất nghiệp: đang tìm việc nhưng chưa có việc. Thiếu việc làm: đang làm nhưng thời gian ít, muốn làm thêm — phổ biến ở nông thôn, khu vực phi chính thức.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Việc làm phi chính thức (không hợp đồng, không bảo hiểm) chiếm tỉ trọng lớn gây hệ quả nào?", "options": ["A. Thu nhập bấp bênh, thiếu an sinh xã hội", "B. Thu nhập rất cao ổn định", "C. Được bảo hiểm đầy đủ", "D. Không có hệ quả"], "answer": "A", "explain": "Lao động phi chính thức (buôn bán nhỏ, xe ôm, giúp việc...) thiếu hợp đồng, bảo hiểm — dễ tổn thương khi ốm đau, dịch bệnh, tuổi già.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong độ tuổi lao động có 55 triệu người, tỉ lệ thất nghiệp 2,2%. Số người thất nghiệp khoảng bao nhiêu nghìn người?", "options": ["A. 1210", "B. 550", "C. 2200", "D. 110"], "answer": "A", "explain": "55 × 2,2% = 1,21 triệu = 1210 nghìn người — chủ yếu là thanh niên, lao động mới ra trường ở đô thị.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để giảm thiếu việc làm ở nông thôn một cách bền vững, cần:", "options": ["A. Phát triển ngành nghề phi nông nghiệp, đào tạo nghề, liên kết tiêu thụ nông sản", "B. Phát tiền trợ cấp dài hạn", "C. Cấm di cư", "D. Chỉ trồng lúa nước"], "answer": "A", "explain": "Tạo việc làm tại chỗ (chế biến, làng nghề, dịch vụ), nâng kĩ năng, bao tiêu sản phẩm — giải quyết căn nguyên thiếu việc làm nông thôn.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tỉ lệ thất nghiệp năm 2024 khoảng 2,2%.", "b) Thiếu việc làm phổ biến ở nông thôn.", "c) Việc làm phi chính thức thiếu an sinh xã hội.", "d) Việt Nam không có vấn đề việc làm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: còn thách thức về chất lượng việc làm, thiếu việc làm nông thôn.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thất nghiệp là không có việc làm và đang tìm việc.", "b) Thiếu việc làm là làm không đủ giờ, thu nhập thấp.", "c) Lao động phi chính thức dễ tổn thương.", "d) Thất nghiệp và thiếu việc làm là một."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: hai khái niệm khác nhau.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Lực lượng lao động 53 triệu người, tỉ lệ thất nghiệp 2,2%. Tính số người có việc làm (đơn vị triệu người, 2 chữ số thập phân).", "answer": "51,83", "explain": "53 × (100% − 2,2%) = 53 × 97,8% = 51,834 ≈ 51,83 triệu người.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một xã có 2000 lao động, 15% thiếu việc làm lúc nông nhàn. Số lao động thiếu việc làm là bao nhiêu (chỉ ghi số)?", "answer": "300", "explain": "2000 × 15% = 300 người — cần việc làm thời vụ, ngành nghề phụ để tận dụng.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Xuất khẩu lao động mang lại lợi ích nào sau đây?", "options": ["A. Giải quyết việc làm, tăng thu nhập, học hỏi kĩ năng, ngoại tệ", "B. Mất hết lao động giỏi", "C. Không có lợi ích", "D. Tăng thất nghiệp"], "answer": "A", "explain": "Xuất khẩu lao động: giải quyết việc làm, thu nhập cao hơn, học kĩ năng, kiều hối về nước — nhưng cần tổ chức tốt, bảo vệ quyền lợi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Thị trường xuất khẩu lao động truyền thống của Việt Nam là:", "options": ["A. Nhật Bản, Hàn Quốc, Đài Loan", "B. Châu Phi", "C. Nam Cực", "D. Bắc Cực"], "answer": "A", "explain": "Nhật Bản, Hàn Quốc, Đài Loan (Trung Quốc) là ba thị trường lớn nhất tiếp nhận lao động Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Rủi ro lớn nhất của lao động Việt Nam đi làm việc ở nước ngoài là:", "options": ["A. Bị lừa đảo, bóc lột, điều kiện làm việc không đảm bảo", "B. Lương quá cao", "C. Được đào tạo quá nhiều", "D. Không có rủi ro"], "answer": "A", "explain": "Lao động qua môi giới chui dễ bị lừa phí, bóc lột, tai nạn — cần đi theo kênh chính thức, tìm hiểu kĩ hợp đồng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để xuất khẩu lao động bền vững, cần:", "options": ["A. Đào tạo ngoại ngữ, kĩ năng nghề, giáo dục pháp luật trước khi đi", "B. Đi tự phát không cần đào tạo", "C. Chỉ cần sức khỏe", "D. Không cần hợp đồng"], "answer": "A", "explain": "Chuẩn bị kĩ: ngoại ngữ, tay nghề, hiểu luật pháp, văn hóa nước đến — nâng cao vị thế, thu nhập và an toàn cho người lao động.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Mỗi năm Việt Nam đưa khoảng 150000 lao động đi làm việc ở nước ngoài. Trong 4 năm, số lao động đi khoảng bao nhiêu nghìn người?", "options": ["A. 600", "B. 150", "C. 300", "D. 1000"], "answer": "A", "explain": "150 × 4 = 600 nghìn người — quy mô lớn, cần quản lí chặt chẽ, bảo vệ quyền lợi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Kiều hối của người lao động Việt Nam ở nước ngoài gửi về có ý nghĩa nào?", "options": ["A. Cải thiện đời sống gia đình, tăng ngoại tệ, đầu tư phát triển", "B. Không có ý nghĩa", "C. Gây lạm phát", "D. Làm nghèo đất nước"], "answer": "A", "explain": "Kiều hối hàng tỉ USD/năm: cải thiện đời sống, xây nhà, đầu tư sản xuất — nguồn lực quan trọng cho phát triển.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Xuất khẩu lao động giải quyết việc làm, tăng thu nhập.", "b) Nhật Bản, Hàn Quốc, Đài Loan là thị trường chính.", "c) Cần đào tạo trước khi đi làm việc ở nước ngoài.", "d) Xuất khẩu lao động không có rủi ro nào."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: có rủi ro lừa đảo, bóc lột — cần đi theo kênh chính thức.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kiều hối cải thiện đời sống và tăng ngoại tệ.", "b) Lao động đi nước ngoài học được kĩ năng mới.", "c) Cần bảo vệ quyền lợi người lao động ở nước ngoài.", "d) Nên đi theo đường dây môi giới chui để nhanh."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: môi giới chui tiềm ẩn lừa đảo — phải đi theo tổ chức được cấp phép.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một lao động đi Nhật Bản gửi về 20 triệu đồng/tháng. Mỗi năm gửi về bao nhiêu triệu đồng (chỉ ghi số)?", "answer": "240", "explain": "20 × 12 = 240 triệu đồng/năm — cao gấp nhiều lần thu nhập trong nước, động lực của xuất khẩu lao động.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Chi phí đi xuất khẩu lao động là 150 triệu đồng, thu nhập ròng 25 triệu đồng/tháng. Sau bao nhiêu tháng thì hoàn vốn (chỉ ghi số)?", "answer": "6", "explain": "150 ÷ 25 = 6 tháng. Người lao động cần tính toán kĩ chi phí – thu nhập, tránh vay nặng lãi.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Mục tiêu của đào tạo nghề là:", "options": ["A. Cung cấp cho thị trường lao động có kĩ năng, đáp ứng nhu cầu doanh nghiệp", "B. Chỉ để lấy bằng", "C. Không cần thiết", "D. Thay thế đại học"], "answer": "A", "explain": "Đào tạo nghề: trang bị kĩ năng thực hành, gắn với nhu cầu tuyển dụng — giải quyết việc làm trực tiếp, hiệu quả.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Mô hình đào tạo nghề hiệu quả hiện nay là:", "options": ["A. Gắn nhà trường với doanh nghiệp (học đi đôi với hành)", "B. Chỉ học lí thuyết", "C. Không thực hành", "D. Đào tạo xong để đó"], "answer": "A", "explain": "Doanh nghiệp tham gia xây dựng chương trình, tiếp nhận thực tập, tuyển dụng — học viên ra trường có việc làm ngay.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao nhiều cử nhân thất nghiệp trong khi doanh nghiệp thiếu lao động kĩ thuật?", "options": ["A. Mất cân đối cơ cấu đào tạo: thừa thầy thiếu thợ", "B. Doanh nghiệp không cần người", "C. Cử nhân quá giỏi", "D. Không có nguyên nhân"], "answer": "A", "explain": "Thừa cử nhân ngành dư thừa, thiếu công nhân kĩ thuật, kĩ sư thực hành — đào tạo chưa gắn với nhu cầu thị trường.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kĩ năng nào quan trọng nhất cho lao động trong cách mạng công nghiệp 4.0?", "options": ["A. Kĩ năng số, ngoại ngữ, tư duy sáng tạo, thích ứng", "B. Chỉ cần sức khỏe", "C. Không cần kĩ năng", "D. Chỉ cần kinh nghiệm cũ"], "answer": "A", "explain": "Tự động hóa thay thế lao động giản đơn; lao động cần kĩ năng số, ngoại ngữ, sáng tạo, học tập suốt đời để thích ứng.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một trung tâm dạy nghề đào tạo 500 học viên/năm, 80% có việc làm sau 6 tháng. Số học viên có việc làm là bao nhiêu?", "options": ["A. 400", "B. 100", "C. 250", "D. 500"], "answer": "A", "explain": "500 × 80% = 400 người — tỉ lệ có việc làm cao thể hiện đào tạo gắn với nhu cầu thực tế.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để thu hẹp khoảng cách kĩ năng, Việt Nam cần:", "options": ["A. Dự báo nhu cầu nhân lực, đổi mới chương trình, tăng thực hành, hợp tác doanh nghiệp", "B. Giảm đầu tư giáo dục", "C. Đóng cửa trường nghề", "D. Chỉ đào tạo đại học"], "answer": "A", "explain": "Đồng bộ: dự báo nhu cầu, chương trình linh hoạt, thực hành nhiều, doanh nghiệp đồng hành — nâng chất lượng nguồn nhân lực.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đào tạo nghề cung cấp lao động có kĩ năng cho thị trường.", "b) Mô hình trường – doanh nghiệp hiệu quả.", "c) Đang thừa thầy thiếu thợ.", "d) Không cần đào tạo nghề."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kĩ năng số quan trọng trong công nghiệp 4.0.", "b) Học tập suốt đời giúp thích ứng với thay đổi.", "c) Đào tạo phải gắn với nhu cầu doanh nghiệp.", "d) Bằng cấp cao đảm bảo không bao giờ thất nghiệp."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quan trọng là kĩ năng thực tế phù hợp nhu cầu, không phải bằng cấp.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Một khóa đào tạo nghề 6 tháng, học phí 12 triệu đồng. Mỗi tháng học phí bao nhiêu triệu đồng (chỉ ghi số)?", "answer": "2", "explain": "12 ÷ 6 = 2 triệu đồng/tháng — đầu tư nhỏ so với cơ hội việc làm, thu nhập sau đào tạo.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Lao động qua đào tạo có thu nhập cao hơn 40% so với chưa qua đào tạo. Lao động phổ thông thu nhập 7 triệu đồng/tháng. Lao động qua đào tạo thu nhập khoảng bao nhiêu triệu đồng (1 chữ số thập phân)?", "answer": "9,8", "explain": "7 × 1,4 = 9,8 triệu đồng/tháng — động lực để người lao động học nghề, nâng cao kĩ năng.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Thị trường lao động là nơi:", "options": ["A. Người lao động và người sử dụng lao động gặp nhau, thỏa thuận việc làm", "B. Chỉ bán sức lao động", "C. Chỉ tuyển dụng", "D. Không tồn tại ở Việt Nam"], "answer": "A", "explain": "Thị trường lao động: cung – cầu lao động gặp nhau qua tuyển dụng, sàn giao dịch việc làm, thỏa thuận lương, điều kiện làm việc.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Trung tâm dịch vụ việc làm có vai trò nào?", "options": ["A. Kết nối cung – cầu, tư vấn, giới thiệu việc làm", "B. Chỉ thu phí", "C. Không có vai trò", "D. Tuyển dụng hộ miễn phí mọi thứ"], "answer": "A", "explain": "Trung tâm dịch vụ việc làm: thông tin thị trường, tư vấn nghề, giới thiệu việc làm, bảo hiểm thất nghiệp — cầu nối quan trọng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thông tin thị trường lao động giúp người lao động:", "options": ["A. Chọn nghề, nơi làm việc phù hợp, tránh bị lừa đảo", "B. Không có tác dụng", "C. Chỉ để tham khảo", "D. Gây hoang mang"], "answer": "A", "explain": "Biết nhu cầu tuyển dụng, mức lương, điều kiện làm việc → chọn đúng nghề, đúng nơi, tránh cò mồi, lừa đảo việc làm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tiền lương tối thiểu vùng được điều chỉnh tăng nhằm:", "options": ["A. Bảo đảm mức sống tối thiểu cho người lao động", "B. Giảm thu nhập", "C. Tăng lợi nhuận doanh nghiệp", "D. Không có mục đích"], "answer": "A", "explain": "Lương tối thiểu là sàn bảo vệ người lao động, điều chỉnh theo giá cả, tăng trưởng — hài hòa lợi ích hai bên.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một sàn giao dịch việc làm có 200 doanh nghiệp đăng tuyển 5000 vị trí, 8000 lao động đến tìm việc. Tỉ lệ vị trí tuyển trên lao động tìm việc là bao nhiêu (làm tròn 2 chữ số thập phân)?", "options": ["A. 0,63", "B. 1,60", "C. 0,50", "D. 2,00"], "answer": "A", "explain": "5000 ÷ 8000 = 0,625 ≈ 0,63 — cung vượt cầu, cạnh tranh việc làm gay gắt, cần nâng cao kĩ năng.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để thị trường lao động vận hành tốt, cần:", "options": ["A. Thông tin minh bạch, pháp luật lao động hoàn thiện, bảo hiểm xã hội bao phủ", "B. Để tự phát hoàn toàn", "C. Không cần pháp luật", "D. Cấm trung tâm giới thiệu việc làm"], "answer": "A", "explain": "Thị trường hiệu quả cần: thông tin đầy đủ, luật lao động bảo vệ hai bên, an sinh xã hội — giảm rủi ro, tăng linh hoạt.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Thị trường lao động là nơi cung – cầu lao động gặp nhau.", "b) Trung tâm dịch vụ việc làm kết nối người lao động và doanh nghiệp.", "c) Thông tin thị trường giúp chọn việc phù hợp.", "d) Không cần thị trường lao động."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lương tối thiểu bảo vệ người lao động.", "b) Hợp đồng lao động bảo vệ quyền lợi hai bên.", "c) Bảo hiểm xã hội là an sinh quan trọng.", "d) Người lao động không cần hợp đồng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: hợp đồng là căn cứ pháp lí bảo vệ quyền lợi.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Lương tối thiểu vùng I là 4,96 triệu đồng/tháng. Một công nhân làm thêm giờ hưởng 150%. Mỗi giờ làm thêm (lương giờ = lương tháng ÷ 26 ÷ 8) được khoảng bao nhiêu nghìn đồng (làm tròn đến hàng đơn vị)?", "answer": "36", "explain": "4960000 ÷ 26 ÷ 8 ≈ 23846 đồng/giờ; × 150% ≈ 35769 ≈ 36 nghìn đồng/giờ làm thêm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một doanh nghiệp cần tuyển 100 công nhân, mỗi trung tâm giới thiệu được 25 người. Cần liên hệ bao nhiêu trung tâm (chỉ ghi số)?", "answer": "4", "explain": "100 ÷ 25 = 4 trung tâm — đa dạng kênh tuyển dụng giúp doanh nghiệp đủ nhân lực.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Thu nhập bình quân của người lao động năm 2024 khoảng bao nhiêu?", "options": ["A. 7,7 triệu đồng/tháng", "B. 3,5 triệu đồng/tháng", "C. 15 triệu đồng/tháng", "D. 1,5 triệu đồng/tháng"], "answer": "A", "explain": "Thu nhập bình quân tháng của lao động làm công hưởng lương khoảng 7,7 – 8,5 triệu đồng (số liệu minh họa theo Tổng cục Thống kê).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Năng suất lao động được tính bằng:", "options": ["A. Giá trị sản xuất bình quân một lao động trong một thời gian", "B. Số giờ làm việc", "C. Số lao động", "D. Tiền lương"], "answer": "A", "explain": "Năng suất = GDP (hoặc giá trị sản xuất) ÷ số lao động — thước đo hiệu quả sử dụng lao động.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Thu nhập của lao động nông nghiệp thấp hơn công nghiệp, dịch vụ chủ yếu do:", "options": ["A. Năng suất lao động nông nghiệp thấp hơn", "B. Nông dân làm ít giờ hơn", "C. Giá nông sản luôn cao", "D. Không có nguyên nhân"], "answer": "A", "explain": "Năng suất quyết định thu nhập: nông nghiệp manh mún, công nghệ thấp → năng suất, thu nhập thấp hơn công nghiệp, dịch vụ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để tăng thu nhập cho người lao động một cách bền vững, cần:", "options": ["A. Nâng cao năng suất lao động", "B. Chỉ tăng lương danh nghĩa", "C. Giảm giờ làm vô tội vạ", "D. In thêm tiền"], "answer": "A", "explain": "Thu nhập bền vững từ năng suất: kĩ năng, công nghệ, tổ chức sản xuất tốt — tăng lương phải đi đôi với tăng năng suất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một công nhân tạo ra giá trị 200 triệu đồng/năm, thu nhập 96 triệu đồng/năm. Tỉ lệ thu nhập trên giá trị tạo ra là bao nhiêu %?", "options": ["A. 48", "B. 200", "C. 104", "D. 24"], "answer": "A", "explain": "96 ÷ 200 × 100% = 48% — phần còn lại là chi phí, lợi nhuận tái đầu tư của doanh nghiệp.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Năng suất lao động Việt Nam bằng khoảng 1/4 Xing-ga-po (minh họa). Để thu hẹp khoảng cách, ưu tiên hàng đầu là:", "options": ["A. Đổi mới công nghệ, nâng cao kĩ năng, chuyển dịch sang ngành giá trị cao", "B. Tăng giờ làm", "C. Giảm lương", "D. Tăng số lượng lao động"], "answer": "A", "explain": "Năng suất từ công nghệ và kĩ năng, không phải từ giờ làm dài: tự động hóa, đào tạo, chuyển sang công nghiệp công nghệ cao, dịch vụ hiện đại.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Năng suất lao động là giá trị sản xuất bình quân một lao động.", "b) Thu nhập bền vững phải dựa trên năng suất.", "c) Lao động nông nghiệp có thu nhập thấp hơn do năng suất thấp.", "d) Tăng lương không cần tăng năng suất vẫn bền vững."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: tăng lương vượt năng suất gây lạm phát, giảm cạnh tranh.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Công nghệ cao giúp tăng năng suất.", "b) Kĩ năng tốt giúp tăng thu nhập.", "c) Năng suất của Việt Nam còn thấp so với khu vực.", "d) Làm thêm giờ là cách duy nhất tăng thu nhập."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nâng cao kĩ năng, năng suất mới là cách bền vững.", "points": 1.0}, {"type": "short", "level": "VD", "q": "GDP 2024 khoảng 476 tỉ USD, số lao động 51,9 triệu người. Năng suất lao động bình quân khoảng bao nhiêu USD/người (làm tròn đến hàng đơn vị)?", "answer": "9171", "explain": "476 × 10^9 ÷ (51,9 × 10^6) ≈ 9171 USD/người — còn thấp so với khu vực, cần cải thiện.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Thu nhập 7,7 triệu đồng/tháng, chi tiêu 6,5 triệu đồng/tháng. Tỉ lệ tiết kiệm là bao nhiêu % (1 chữ số thập phân)?", "answer": "15,6", "explain": "(7,7 − 6,5) ÷ 7,7 × 100% ≈ 15,58 ≈ 15,6%. Tiết kiệm tạo nguồn vốn cho đầu tư, an sinh tương lai.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Chính sách hỗ trợ tạo việc làm của Nhà nước gồm:", "options": ["A. Cho vay vốn, đào tạo nghề, thông tin thị trường lao động", "B. Chỉ phát tiền", "C. Không có chính sách", "D. Cấm doanh nghiệp tuyển dụng"], "answer": "A", "explain": "Quỹ quốc gia về việc làm cho vay vốn, hỗ trợ đào tạo nghề, phát triển thị trường lao động — bộ chính sách đồng bộ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Bảo hiểm thất nghiệp có ý nghĩa nào?", "options": ["A. Trợ cấp, tư vấn, giới thiệu việc làm cho người mất việc", "B. Khuyến khích thất nghiệp", "C. Không có ý nghĩa", "D. Chỉ để thu phí"], "answer": "A", "explain": "Bảo hiểm thất nghiệp: trợ cấp mất việc, hỗ trợ học nghề, tư vấn giới thiệu việc làm — lưới an sinh cho người lao động.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chương trình cho vay vốn tạo việc làm giúp:", "options": ["A. Người lao động, hộ nghèo có vốn sản xuất, tự tạo việc làm", "B. Làm giàu nhanh", "C. Không cần trả", "D. Chỉ cho doanh nghiệp lớn"], "answer": "A", "explain": "Vốn ưu đãi giúp hộ nghèo, lao động nông thôn mở rộng sản xuất, kinh doanh — tự tạo việc làm bền vững.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khởi nghiệp trong thanh niên được khuyến khích vì:", "options": ["A. Tạo việc làm cho bản thân và người khác, phát huy sáng tạo", "B. Dễ thành công tuyệt đối", "C. Không cần vốn", "D. Không có rủi ro"], "answer": "A", "explain": "Khởi nghiệp: tự tạo việc làm, tạo thêm việc làm, đổi mới sáng tạo — động lực kinh tế, dù có rủi ro cần quản trị.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một hộ nghèo vay 50 triệu đồng vốn ưu đãi mở xưởng may, tạo việc làm cho 5 lao động. Bình quân mỗi việc làm cần bao nhiêu triệu đồng vốn (chỉ ghi số)?", "options": ["A. 10", "B. 50", "C. 5", "D. 250"], "answer": "A", "explain": "50 ÷ 5 = 10 triệu đồng/việc làm — hiệu quả vốn cao của mô hình tạo việc làm quy mô nhỏ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để chính sách việc làm đến đúng đối tượng, cần:", "options": ["A. Thông tin minh bạch, thủ tục đơn giản, giám sát chặt chẽ", "B. Phát tiền tràn lan", "C. Không cần giám sát", "D. Chỉ hỗ trợ thành phố"], "answer": "A", "explain": "Chính sách tốt cần thực thi tốt: công khai, đơn giản thủ tục, chống trục lợi — đến đúng người cần hỗ trợ.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nhà nước có chính sách cho vay vốn tạo việc làm.", "b) Bảo hiểm thất nghiệp hỗ trợ người mất việc.", "c) Khởi nghiệp tạo thêm việc làm.", "d) Không có chính sách việc làm nào."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vốn ưu đãi giúp hộ nghèo tự tạo việc làm.", "b) Đào tạo nghề miễn phí cho lao động nông thôn là cần thiết.", "c) Thông tin việc làm giúp tránh lừa đảo.", "d) Chính sách không cần giám sát."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cần giám sát để chống trục lợi, lãng phí.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Quỹ việc làm cho vay 1000 tỉ đồng, mỗi việc làm cần 50 triệu đồng vốn. Số việc làm tạo ra khoảng bao nhiêu nghìn (chỉ ghi số)?", "answer": "20", "explain": "1000 tỉ ÷ 50 triệu = 20000 việc làm = 20 nghìn việc làm.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tỉ lệ tham gia bảo hiểm xã hội của lực lượng lao động khoảng 40%. Trong 53 triệu người, số chưa tham gia khoảng bao nhiêu triệu người (chỉ ghi số)?", "answer": "32", "explain": "53 × 60% = 31,8 ≈ 32 triệu người — phần lớn lao động phi chính thức chưa có an sinh, cần mở rộng bao phủ.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Nội dung nào sau đây KHÔNG thuộc bài Lao động và việc làm?", "options": ["A. Quá trình feralit", "B. Cơ cấu lao động theo ngành", "C. Vấn đề thất nghiệp", "D. Xuất khẩu lao động"], "answer": "A", "explain": "Quá trình feralit thuộc bài Thiên nhiên nhiệt đới ẩm gió mùa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Số liệu nào đúng về lao động Việt Nam năm 2024?", "options": ["A. 51,9 triệu người có việc làm; thất nghiệp khoảng 2,2%", "B. 30 triệu người có việc làm; thất nghiệp 10%", "C. 70 triệu người có việc làm", "D. Không có số liệu"], "answer": "A", "explain": "51,9 triệu lao động có việc làm; tỉ lệ thất nghiệp khoảng 2,2% (Tổng cục Thống kê, 2024).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các phát biểu: (1) Nguồn lao động dồi dào; (2) Chất lượng đang nâng cao; (3) Cơ cấu chuyển dịch tích cực; (4) Còn thách thức về việc làm. Số phát biểu đúng là:", "options": ["A. 1", "B. 2", "C. 3", "D. 4"], "answer": "D", "explain": "Cả 4 đều đúng — bức tranh tổng quát về lao động, việc làm Việt Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa đào tạo và việc làm được hiểu đúng là:", "options": ["A. Đào tạo gắn với nhu cầu thị trường giúp có việc làm tốt", "B. Đào tạo không liên quan đến việc làm", "C. Càng học cao càng thất nghiệp", "D. Không cần đào tạo"], "answer": "A", "explain": "Đào tạo đúng nhu cầu → kĩ năng phù hợp → có việc làm, thu nhập tốt; đào tạo lệch → thất nghiệp, lãng phí.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Một thanh niên nông thôn muốn có việc làm thu nhập tốt. Lộ trình hợp lí nhất là:", "options": ["A. Học nghề theo nhu cầu thị trường, tích lũy kĩ năng, có thể đi xuất khẩu lao động chính thức", "B. Ra thành phố làm tự do không cần kĩ năng", "C. Ở nhà chờ việc", "D. Đi theo cò mồi"], "answer": "A", "explain": "Học nghề → có kĩ năng → việc làm tốt trong nước hoặc xuất khẩu chính thức — lộ trình bền vững, an toàn.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Tổng kết: Để biến lợi thế dân số vàng thành động lực phát triển, Việt Nam cần:", "options": ["A. Tạo đủ việc làm chất lượng, nâng cao kĩ năng, tăng năng suất lao động", "B. Chỉ tăng số lượng lao động", "C. Hạn chế đào tạo", "D. Không cần chính sách"], "answer": "A", "explain": "Dân số vàng chỉ là cơ hội: phải biến thành hiện thực bằng việc làm chất lượng, nhân lực kĩ năng cao, năng suất vượt trội — nếu không sẽ thành gánh nặng khi già hóa.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định ôn tập sau:", "statements": ["a) Nguồn lao động dồi dào, trẻ.", "b) Cơ cấu lao động chuyển dịch tích cực.", "c) Thất nghiệp thấp nhưng chất lượng việc làm cần cải thiện.", "d) Không cần giải quyết vấn đề việc làm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Đào tạo nghề giúp có việc làm tốt.", "b) Xuất khẩu lao động cần đi theo kênh chính thức.", "c) Đa dạng hóa việc làm nông thôn là cần thiết.", "d) Năng suất lao động không ảnh hưởng đến thu nhập."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: năng suất quyết định thu nhập bền vững.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Kể tên hai hướng giải quyết việc làm ở nông thôn (viết cách nhau bằng dấu phẩy).", "answer": "Đa dạng hóa ngành nghề, đào tạo nghề", "explain": "Các hướng: đa dạng hóa ngành nghề phi nông nghiệp, đào tạo nghề, xuất khẩu lao động, cho vay vốn... (chấp nhận hai hướng đúng).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho bảng số liệu (triệu người, minh họa): Lao động nông nghiệp: 2015: 24,0; 2024: 14,0. Tính mức giảm bình quân mỗi năm (đơn vị triệu người, 2 chữ số thập phân).", "answer": "1,11", "explain": "(24,0 − 14,0) ÷ 9 ≈ 1,111 ≈ 1,11 triệu người/năm — tốc độ chuyển dịch cơ cấu lao động mạnh mẽ.", "points": 0.5}]}]}
