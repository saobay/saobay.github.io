B", "explain": "Lãnh thổ nước ta kéo dài khoảng 15 vĩ độ theo chiều Bắc – Nam (khoảng 1650 km) và hẹp theo chiều Đông – Tây, nơi hẹp nhất ở Quảng Bình chỉ khoảng 50 km.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Tổng chiều dài đường biên giới trên đất liền của nước ta với ba nước láng giềng khoảng bao nhiêu?", "options": ["A. Khoảng 3600 km", "B. Khoảng 4600 km", "C. Khoảng 3260 km", "D. Khoảng 5500 km"], "answer": "B", "explain": "1400 km (Trung Quốc) + 2100 km (Lào) + 1100 km (Cam-pu-chia) = 4600 km. Lưu ý 3260 km là chiều dài đường bờ biển, không phải biên giới đất liền.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Nơi hẹp nhất của lãnh thổ Việt Nam theo chiều đông – tây thuộc tỉnh nào và rộng khoảng bao nhiêu?", "options": ["A. Quảng Bình, khoảng 50 km", "B. Quảng Trị, khoảng 60 km", "C. Hà Tĩnh, khoảng 55 km", "D. Nghệ An, khoảng 70 km"], "answer": "A", "explain": "Nơi hẹp nhất của lãnh thổ nước ta thuộc tỉnh Quảng Bình, chiều ngang chỉ khoảng 50 km. Đây là hệ quả của lãnh thổ kéo dài theo chiều Bắc – Nam và hẹp theo chiều Đông – Tây.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về vùng đất của Việt Nam:", "statements": ["a) Vùng đất bao gồm toàn bộ phần đất liền và các đảo, quần đảo.", "b) Diện tích các đơn vị hành chính hơn 331 nghìn km2 (năm 2021).", "c) Nước ta có hàng nghìn đảo lớn nhỏ trên Biển Đông.", "d) Quần đảo Hoàng Sa thuộc tỉnh Khánh Hòa."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: quần đảo Hoàng Sa thuộc thành phố Đà Nẵng; quần đảo Trường Sa thuộc tỉnh Khánh Hòa.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về đường biên giới trên đất liền:", "statements": ["a) Phía bắc nước ta giáp Trung Quốc với đường biên giới dài khoảng 1400 km.", "b) Phía tây nước ta giáp Lào với đường biên giới dài khoảng 2100 km.", "c) Phía tây nam nước ta giáp Cam-pu-chia với đường biên giới dài khoảng 1100 km.", "d) Đường biên giới với Cam-pu-chia là dài nhất trong ba tuyến biên giới."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo số liệu SGK. d) Sai: đường biên giới với Lào (khoảng 2100 km) mới là dài nhất.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Đường biên giới trên đất liền của Việt Nam với ba nước láng giềng dài khoảng 4600 km, trong đó với Lào khoảng 2100 km. Tính tỉ lệ phần trăm đường biên giới với Lào trong tổng chiều dài biên giới đất liền (làm tròn đến 1 chữ số thập phân).", "answer": "45,7", "explain": "Tỉ lệ = 2100 ÷ 4600 × 100% ≈ 45,652%, làm tròn 45,7%. Đường biên giới với Lào chiếm gần một nửa tổng chiều dài biên giới đất liền của nước ta.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho bảng số liệu: Chiều dài đường biên giới đất liền của Việt Nam với Trung Quốc khoảng 1400 km, với Lào khoảng 2100 km, với Cam-pu-chia khoảng 1100 km. Đường biên giới với nước nào dài gấp 1,5 lần đường biên giới với Trung Quốc?", "answer": "Lào", "explain": "2100 ÷ 1400 = 1,5. Vậy đường biên giới với Lào dài gấp 1,5 lần đường biên giới với Trung Quốc.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Diện tích vùng biển của Việt Nam khoảng bao nhiêu?", "options": ["A. Khoảng 1 triệu km2", "B. Khoảng 500 nghìn km2", "C. Khoảng 2 triệu km2", "D. Khoảng 3,5 triệu km2"], "answer": "A", "explain": "Vùng biển Việt Nam có diện tích khoảng 1 triệu km2, gấp khoảng 3 lần diện tích phần đất liền.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Chiều dài đường bờ biển của nước ta là bao nhiêu?", "options": ["A. 2260 km", "B. 3260 km", "C. 4260 km", "D. 1650 km"], "answer": "B", "explain": "Đường bờ biển nước ta dài 3260 km, kéo dài từ Quảng Ninh đến Kiên Giang.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vùng biển của Việt Nam KHÔNG bao gồm bộ phận nào sau đây?", "options": ["A. Nội thủy", "B. Lãnh hải", "C. Vùng đặc quyền kinh tế", "D. Vùng biển quốc tế"], "answer": "D", "explain": "Vùng biển Việt Nam gồm 5 bộ phận: nội thủy, lãnh hải, vùng tiếp giáp lãnh hải, vùng đặc quyền kinh tế và thềm lục địa. Vùng biển quốc tế không thuộc chủ quyền quốc gia.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Chiều rộng của lãnh hải Việt Nam được quy định là bao nhiêu hải lí (tính từ đường cơ sở)?", "options": ["A. 12 hải lí", "B. 24 hải lí", "C. 200 hải lí", "D. 350 hải lí"], "answer": "A", "explain": "Theo Công ước Luật Biển 1982, lãnh hải rộng 12 hải lí tính từ đường cơ sở; vùng tiếp giáp lãnh hải rộng 24 hải lí; vùng đặc quyền kinh tế rộng 200 hải lí.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vùng đặc quyền kinh tế của Việt Nam rộng 200 hải lí. Nhận định nào sau đây đúng về vùng biển này?", "options": ["A. Việt Nam có chủ quyền hoàn toàn như trên đất liền", "B. Việt Nam có quyền chủ quyền về thăm dò, khai thác tài nguyên", "C. Tàu thuyền nước ngoài không được đi qua", "D. Việt Nam không có quyền gì ngoài đánh bắt cá"], "answer": "B", "explain": "Trong vùng đặc quyền kinh tế (200 hải lí), quốc gia ven biển có quyền chủ quyền đối với việc thăm dò, khai thác, bảo tồn và quản lí tài nguyên thiên nhiên, nhưng tàu thuyền các nước vẫn được tự do hàng hải.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Có 28 tỉnh, thành phố của Việt Nam giáp biển. Nhận định nào sau đây đúng nhất về ý nghĩa của số lượng tỉnh giáp biển này?", "options": ["A. Tất cả các tỉnh giáp biển đều phát triển mạnh kinh tế biển", "B. Tạo điều kiện để phát triển kinh tế biển tổng hợp trên phạm vi cả nước", "C. Các tỉnh giáp biển không có vai trò về quốc phòng", "D. Số tỉnh giáp biển càng nhiều thì diện tích vùng biển càng lớn"], "answer": "B", "explain": "Với 28 tỉnh, thành phố giáp biển trải dài từ Bắc vào Nam, nước ta có điều kiện phát triển kinh tế biển tổng hợp (thủy sản, du lịch, cảng biển, khai thác khoáng sản) trên phạm vi cả nước, gắn với bảo đảm quốc phòng, an ninh.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về vùng biển Việt Nam:", "statements": ["a) Diện tích vùng biển khoảng 1 triệu km2.", "b) Đường bờ biển dài 3260 km từ Quảng Ninh đến Kiên Giang.", "c) Cả nước có 28 tỉnh, thành phố giáp biển.", "d) Vùng biển Việt Nam nhỏ hơn diện tích phần đất liền."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vùng biển khoảng 1 triệu km2, gấp khoảng 3 lần diện tích đất liền (hơn 331 nghìn km2).", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về các bộ phận của vùng biển:", "statements": ["a) Lãnh hải rộng 12 hải lí tính từ đường cơ sở.", "b) Vùng đặc quyền kinh tế rộng 200 hải lí.", "c) Nội thủy là vùng biển nằm phía trong đường cơ sở.", "d) Thềm lục địa là vùng đáy biển nằm ngoài vùng đặc quyền kinh tế và không thuộc quyền tài phán của Việt Nam."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo Công ước Luật Biển 1982. d) Sai: thềm lục địa là một trong 5 bộ phận thuộc chủ quyền, quyền chủ quyền và quyền tài phán của Việt Nam.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Diện tích vùng biển Việt Nam khoảng 1 triệu km2, diện tích đất liền hơn 331 nghìn km2. Vùng biển gấp khoảng bao nhiêu lần diện tích đất liền (làm tròn đến 1 chữ số thập phân)?", "answer": "3,0", "explain": "1 000 000 ÷ 331 000 ≈ 3,02, làm tròn 3,0 lần. Vùng biển rộng gấp khoảng 3 lần phần đất liền, cho thấy tiềm năng to lớn của kinh tế biển.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một hải lí quốc tế bằng 1852 m. Chiều rộng lãnh hải Việt Nam là 12 hải lí. Tính chiều rộng lãnh hải theo kilômét (làm tròn đến 1 chữ số thập phân).", "answer": "22,2", "explain": "12 × 1852 = 22 224 m = 22,224 km, làm tròn 22,2 km. Đây là vành đai biển thuộc chủ quyền hoàn toàn của Việt Nam tính từ đường cơ sở.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Lãnh thổ Việt Nam là một khối thống nhất và toàn vẹn, bao gồm các bộ phận nào sau đây?", "options": ["A. Vùng đất, vùng biển và vùng trời", "B. Đất liền và hải đảo", "C. Vùng đất và vùng biển", "D. Lãnh thổ quốc gia và vùng trời quốc tế"], "answer": "A", "explain": "Lãnh thổ Việt Nam bao gồm ba bộ phận thống nhất: vùng đất, vùng biển và vùng trời.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vùng trời của Việt Nam được hiểu là gì?", "options": ["A. Toàn bộ khí quyển của Trái Đất", "B. Khoảng không gian bao trùm lên lãnh thổ Việt Nam", "C. Vùng không gian vũ trụ phía trên Việt Nam", "D. Đường bay quốc tế đi qua Việt Nam"], "answer": "B", "explain": "Vùng trời là khoảng không gian bao trùm lên lãnh thổ Việt Nam; trên đất liền xác định bằng các đường biên giới, trên biển là ranh giới bên ngoài của lãnh hải và không gian các đảo.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Quần đảo Hoàng Sa thuộc đơn vị hành chính nào sau đây?", "options": ["A. Thành phố Đà Nẵng", "B. Tỉnh Khánh Hòa", "C. Tỉnh Quảng Nam", "D. Thành phố Hải Phòng"], "answer": "A", "explain": "Quần đảo Hoàng Sa thuộc thành phố Đà Nẵng; quần đảo Trường Sa thuộc tỉnh Khánh Hòa.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kinh tuyến 105°Đ đi qua lãnh thổ Việt Nam có ý nghĩa gì?", "options": ["A. Là ranh giới giữa hai miền khí hậu", "B. Phần lớn lãnh thổ nằm trong múi giờ số 7 (GMT+7)", "C. Là đường phân định vịnh Bắc Bộ", "D. Là kinh tuyến gốc của bản đồ Việt Nam"], "answer": "B", "explain": "Kinh tuyến 105°Đ chạy qua nước ta nên phần lớn lãnh thổ Việt Nam nằm trong múi giờ số 7 (giờ GMT+7).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao nói lãnh thổ Việt Nam là một khối thống nhất và toàn vẹn?", "options": ["A. Vì diện tích đất liền lớn nhất Đông Nam Á", "B. Vì vùng đất, vùng biển, vùng trời gắn bó chặt chẽ, không thể tách rời", "C. Vì có nhiều đảo nhất khu vực", "D. Vì đường biên giới đều là biên giới tự nhiên"], "answer": "B", "explain": "Lãnh thổ là khối thống nhất vì ba bộ phận vùng đất – vùng biển – vùng trời gắn bó hữu cơ, cùng thuộc chủ quyền thiêng liêng của Tổ quốc, không thể chia cắt.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một tàu nước ngoài đi qua vùng đặc quyền kinh tế của Việt Nam để đến cảng Xing-ga-po. Theo luật biển quốc tế, nhận định nào đúng?", "options": ["A. Việt Nam có quyền cấm tàu đi qua", "B. Tàu được tự do hàng hải nhưng phải tôn trọng quyền của Việt Nam đối với tài nguyên", "C. Tàu phải xin phép Việt Nam trước 30 ngày", "D. Việt Nam thu phí qua lại đối với mọi tàu thuyền"], "answer": "B", "explain": "Trong vùng đặc quyền kinh tế, các quốc gia khác được hưởng quyền tự do hàng hải, hàng không; đồng thời phải tôn trọng quyền chủ quyền của quốc gia ven biển đối với tài nguyên. Việt Nam không được cấm hay thu phí qua lại trái luật quốc tế.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về phạm vi lãnh thổ:", "statements": ["a) Lãnh thổ Việt Nam gồm vùng đất, vùng biển và vùng trời.", "b) Vùng đất chỉ bao gồm phần đất liền, không tính các đảo.", "c) Vùng trời là khoảng không gian bao trùm lên lãnh thổ Việt Nam.", "d) Lãnh thổ Việt Nam là một khối thống nhất và toàn vẹn."], "answer": ["T", "F", "T", "T"], "explain": "a), c), d) Đúng. b) Sai: vùng đất gồm toàn bộ phần đất liền trong đường biên giới và các đảo, quần đảo trên Biển Đông.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quần đảo Trường Sa thuộc tỉnh Khánh Hòa.", "b) Kinh tuyến 105°Đ đi qua lãnh thổ nên nước ta thuộc múi giờ GMT+7.", "c) Vùng trời trên biển được xác định đến ranh giới bên ngoài của vùng đặc quyền kinh tế.", "d) Nước ta nằm hoàn toàn trong vành đai nhiệt đới bán cầu Bắc."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: vùng trời trên biển được xác định đến ranh giới bên ngoài của lãnh hải (không phải vùng đặc quyền kinh tế) và không gian các đảo.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Nước ta có 28 tỉnh, thành phố giáp biển trên tổng số 34 tỉnh, thành phố (sau sắp xếp đơn vị hành chính). Tính tỉ lệ phần trăm số tỉnh, thành phố giáp biển (làm tròn đến 1 chữ số thập phân).", "answer": "82,4", "explain": "28 ÷ 34 × 100% ≈ 82,35%, làm tròn 82,4%. Phần lớn các tỉnh, thành phố của nước ta giáp biển, thuận lợi phát triển kinh tế biển.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Từ điểm cực Bắc (23°23′B) đến đường xích đạo (0°) chênh lệch bao nhiêu độ vĩ? (Chỉ ghi số, đơn vị độ)", "answer": "23,38", "explain": "23°23′ = 23 + 23/60 ≈ 23,38°. Khoảng cách vĩ độ từ cực Bắc nước ta đến xích đạo là 23,38°, thể hiện nước ta nằm hoàn toàn trong vành đai nhiệt đới.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Vị trí địa lí quy định tính chất nào sau đây của thiên nhiên Việt Nam?", "options": ["A. Tính chất nhiệt đới ẩm gió mùa", "B. Tính chất ôn đới hải dương", "C. Tính chất hoang mạc khô hạn", "D. Tính chất cực đới lạnh giá"], "answer": "A", "explain": "Nằm hoàn toàn trong vành đai nhiệt đới bán cầu Bắc, trong khu vực gió mùa châu Á nên thiên nhiên nước ta mang tính chất nhiệt đới ẩm gió mùa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Loại thiên tai nào sau đây nước ta thường xuyên chịu ảnh hưởng do vị trí địa lí?", "options": ["A. Động đất mạnh", "B. Bão và lũ lụt", "C. Núi lửa phun trào", "D. Sóng thần lớn"], "answer": "B", "explain": "Nằm trong khu vực hoạt động của bão nhiệt đới và gió mùa châu Á, nước ta thường xuyên chịu bão, lũ lụt, hạn hán.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao thiên nhiên nước ta phân hóa đa dạng theo chiều Bắc – Nam?", "options": ["A. Vì lãnh thổ kéo dài khoảng 15 vĩ độ theo chiều Bắc – Nam", "B. Vì diện tích lãnh thổ lớn nhất Đông Nam Á", "C. Vì nằm hoàn toàn trên lục địa", "D. Vì không giáp biển"], "answer": "A", "explain": "Lãnh thổ kéo dài khoảng 15 vĩ độ (từ 8°34′B đến 23°23′B) làm cho khí hậu, sinh vật phân hóa rõ rệt từ Bắc vào Nam.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vị trí giáp Biển Đông làm cho thiên nhiên nước ta có đặc điểm nào sau đây?", "options": ["A. Khí hậu khô hạn quanh năm", "B. Chịu ảnh hưởng sâu sắc của biển, độ ẩm lớn", "C. Không có bão", "D. Nhiệt độ thấp như vùng ôn đới"], "answer": "B", "explain": "Biển Đông là nguồn dự trữ nhiệt và ẩm dồi dào, làm cho thiên nhiên nước ta chịu ảnh hưởng sâu sắc của biển: độ ẩm cao, lượng mưa lớn, có bão.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Nước ta nằm ở nơi giao nhau của hai vành đai sinh khoáng lớn là Thái Bình Dương và Địa Trung Hải. Hệ quả nào sau đây đúng?", "options": ["A. Tài nguyên khoáng sản đa dạng, phong phú", "B. Không có khoáng sản kim loại", "C. Chỉ có dầu khí mà không có than", "D. Khoáng sản phân bố đồng đều khắp cả nước"], "answer": "A", "explain": "Vị trí ở nơi giao nhau của hai vành đai sinh khoáng lớn làm cho tài nguyên khoáng sản nước ta đa dạng về chủng loại (dầu khí, than, sắt, bô-xit, a-pa-tít...).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "So với các nước trong khu vực, vị trí địa lí làm cho Việt Nam có sự khác biệt nào về tự nhiên?", "options": ["A. Là nước duy nhất có khí hậu nhiệt đới gió mùa", "B. Thiên nhiên chịu ảnh hưởng sâu sắc của biển kết hợp với sự phân hóa theo chiều dài lãnh thổ", "C. Không chịu ảnh hưởng của bão", "D. Địa hình hoàn toàn là đồng bằng"], "answer": "B", "explain": "Lãnh thổ kéo dài, hẹp ngang và giáp Biển Đông tạo nên nét đặc trưng: thiên nhiên nhiệt đới ẩm gió mùa chịu ảnh hưởng sâu sắc của biển, đồng thời phân hóa đa dạng theo Bắc – Nam, Đông – Tây và độ cao.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về ảnh hưởng của vị trí địa lí đến tự nhiên:", "statements": ["a) Vị trí địa lí quy định tính chất nhiệt đới ẩm gió mùa của thiên nhiên.", "b) Lãnh thổ kéo dài làm thiên nhiên phân hóa theo chiều Bắc – Nam.", "c) Vị trí giáp biển làm tăng độ ẩm và lượng mưa.", "d) Vị trí địa lí khiến nước ta không chịu thiên tai nào."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nước ta nằm trong khu vực chịu nhiều thiên tai như bão, lũ lụt, hạn hán.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Nước ta nằm trên đường di cư của nhiều loài sinh vật nên tài nguyên sinh vật đa dạng.", "b) Vị trí ở nơi giao nhau của hai vành đai sinh khoáng làm khoáng sản phong phú.", "c) Địa hình nước ta phân hóa theo độ cao một phần do lãnh thổ có nhiều đồi núi.", "d) Khí hậu nước ta mang tính chất ôn đới do ở xa xích đạo."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: nước ta nằm hoàn toàn trong vành đai nhiệt đới (8°34′B – 23°23′B) nên khí hậu mang tính chất nhiệt đới, không phải ôn đới.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Bão thường đổ bộ vào nước ta từ Biển Đông. Cho biết mùa bão ở miền Bắc nước ta tập trung từ tháng 6 đến tháng 10. Mùa bão kéo dài bao nhiêu tháng?", "answer": "5", "explain": "Từ tháng 6 đến tháng 10 là 5 tháng (6, 7, 8, 9, 10). Đây là thời kì hoạt động mạnh của bão nhiệt đới trên Biển Đông ảnh hưởng đến nước ta.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Nhiệt độ trung bình năm ở Hà Nội (21°B) khoảng 23,5°C, ở Thành phố Hồ Chí Minh (11°B) khoảng 27,5°C. Chênh lệch nhiệt độ trung bình năm giữa hai nơi là bao nhiêu °C?", "answer": "4,0", "explain": "27,5 − 23,5 = 4,0°C. Chênh lệch này phản ánh sự phân hóa khí hậu theo chiều Bắc – Nam do lãnh thổ kéo dài khoảng 15 vĩ độ.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Vị trí địa lí tạo điều kiện thuận lợi nào sau đây cho phát triển kinh tế – xã hội?", "options": ["A. Giao lưu, hội nhập với các nước trong khu vực và thế giới", "B. Tự cung tự cấp, không cần giao thương", "C. Chỉ phát triển nông nghiệp", "D. Hạn chế đầu tư nước ngoài"], "answer": "A", "explain": "Vị trí gần trung tâm Đông Nam Á, trên ngã tư đường hàng hải, hàng không quốc tế tạo điều kiện giao lưu, hội nhập kinh tế với khu vực và thế giới.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ngành kinh tế nào sau đây phát triển mạnh nhờ nước ta có vùng biển rộng và đường bờ biển dài?", "options": ["A. Kinh tế biển tổng hợp", "B. Khai thác rừng đầu nguồn", "C. Trồng cây công nghiệp trên cao nguyên", "D. Chăn nuôi gia súc ở trung du"], "answer": "A", "explain": "Vùng biển khoảng 1 triệu km2 và bờ biển dài 3260 km là điều kiện phát triển kinh tế biển tổng hợp: thủy sản, du lịch biển – đảo, vận tải biển, khai thác khoáng sản.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vị trí trên ngã tư đường hàng hải quốc tế thuận lợi cho nước ta phát triển ngành nào?", "options": ["A. Dịch vụ cảng biển và logistics", "B. Khai thác than ở Quảng Ninh", "C. Trồng lúa ở đồng bằng", "D. Khai thác gỗ rừng"], "answer": "A", "explain": "Nằm trên tuyến hàng hải quốc tế nhộn nhịp, nước ta thuận lợi phát triển hệ thống cảng biển, dịch vụ logistics, đóng vai trò trung chuyển hàng hóa khu vực.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hoạt động kinh tế nào sau đây KHÔNG liên quan trực tiếp đến lợi thế vị trí giáp biển của nước ta?", "options": ["A. Nuôi trồng thủy sản", "B. Du lịch biển – đảo", "C. Khai thác dầu khí trên thềm lục địa", "D. Trồng cà phê ở Tây Nguyên"], "answer": "D", "explain": "Trồng cà phê ở Tây Nguyên là lợi thế của đất ba-dan và khí hậu cao nguyên, không liên quan trực tiếp đến vị trí giáp biển.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vì sao vị trí địa lí vừa tạo thuận lợi vừa đặt ra thách thức cho phát triển kinh tế?", "options": ["A. Thuận lợi giao thương nhưng phải đối mặt với thiên tai và cạnh tranh gay gắt", "B. Chỉ có thuận lợi, không có thách thức", "C. Chỉ có thách thức, không có thuận lợi", "D. Vị trí địa lí không ảnh hưởng đến kinh tế"], "answer": "A", "explain": "Vị trí tạo thuận lợi giao lưu, hội nhập, phát triển kinh tế biển; nhưng cũng khiến nước ta chịu nhiều thiên tai (bão, lũ) và cạnh tranh kinh tế khu vực gay gắt.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trong bối cảnh hội nhập, Việt Nam đã phát huy lợi thế vị trí địa lí bằng giải pháp nào sau đây?", "options": ["A. Đóng cửa biên giới, hạn chế giao thương", "B. Tham gia các hiệp định thương mại tự do, phát triển cảng biển và logistics", "C. Chỉ tập trung phát triển nông nghiệp tự cung", "D. Hạn chế đầu tư vào vùng ven biển"], "answer": "B", "explain": "Nước ta đã ký kết nhiều FTA thế hệ mới, đầu tư phát triển hệ thống cảng biển (Cái Mép – Thị Vải, Lạch Huyện...), phát huy vị trí ngã tư hàng hải để hội nhập sâu vào chuỗi giá trị toàn cầu.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về ảnh hưởng đến kinh tế – xã hội:", "statements": ["a) Vị trí địa lí tạo điều kiện giao lưu, hội nhập quốc tế.", "b) Vùng biển rộng thuận lợi phát triển kinh tế biển tổng hợp.", "c) Vị trí ngã tư hàng hải thuận lợi phát triển cảng biển.", "d) Vị trí địa lí khiến nước ta không thể phát triển du lịch."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: bờ biển dài, nhiều bãi tắm đẹp, đảo và di sản ven biển là điều kiện thuận lợi phát triển du lịch biển – đảo.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kinh tế biển tổng hợp gồm thủy sản, du lịch biển, vận tải biển, khai thác khoáng sản.", "b) Vị trí giáp biển giúp phát triển nuôi trồng thủy sản nước mặn, nước lợ.", "c) Thiên tai (bão, lũ) là thách thức do vị trí địa lí mang lại.", "d) Vị trí địa lí chỉ ảnh hưởng đến tự nhiên, không ảnh hưởng đến kinh tế."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vị trí địa lí ảnh hưởng sâu sắc đến cả tự nhiên, kinh tế – xã hội và quốc phòng, an ninh.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Bờ biển Việt Nam dài 3260 km với 28 tỉnh, thành phố giáp biển. Trung bình mỗi tỉnh, thành phố giáp biển có bao nhiêu km bờ biển (làm tròn đến hàng đơn vị)?", "answer": "116", "explain": "3260 ÷ 28 ≈ 116,4, làm tròn 116 km. Con số cho thấy tiềm năng phát triển kinh tế biển trải đều trên nhiều địa phương.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho bảng số liệu: Kim ngạch xuất khẩu hàng hóa của Việt Nam năm 2020 đạt 282,7 tỉ USD; năm 2024 đạt 405,5 tỉ USD. Tính tốc độ tăng trưởng kim ngạch xuất khẩu giai đoạn 2020 – 2024 (làm tròn đến 1 chữ số thập phân).", "answer": "43,4", "explain": "(405,5 − 282,7) ÷ 282,7 × 100% ≈ 43,44%, làm tròn 43,4%. Vị trí địa lí thuận lợi cùng với hội nhập sâu đã giúp xuất khẩu tăng trưởng mạnh. (Nguồn số liệu: Tổng cục Thống kê)", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Về quốc phòng, an ninh, vị trí địa lí của nước ta được đánh giá như thế nào?", "options": ["A. Có vị trí đặc biệt quan trọng ở khu vực Đông Nam Á và Biển Đông", "B. Không có ý nghĩa gì về quốc phòng", "C. Chỉ quan trọng về kinh tế", "D. Là vị trí biệt lập, khó tiếp cận"], "answer": "A", "explain": "Nước ta có vị trí đặc biệt quan trọng ở khu vực Đông Nam Á và Biển Đông — hướng chiến lược trong bảo vệ chủ quyền, an ninh quốc gia.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Biển Đông có ý nghĩa chiến lược nào đối với quốc phòng, an ninh của Việt Nam?", "options": ["A. Là hướng phòng thủ chiến lược từ phía biển", "B. Không liên quan đến quốc phòng", "C. Chỉ có ý nghĩa kinh tế", "D. Là vùng biển quốc tế, Việt Nam không có quyền lợi"], "answer": "A", "explain": "Biển Đông là hướng chiến lược quan trọng trong bảo vệ Tổ quốc từ phía biển; bảo vệ chủ quyền biển, đảo là nhiệm vụ thiêng liêng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao phát triển kinh tế phải gắn với bảo đảm quốc phòng, an ninh ở vùng biển, đảo?", "options": ["A. Vì biển, đảo vừa giàu tài nguyên vừa có vị trí chiến lược", "B. Vì vùng biển không có tài nguyên", "C. Vì các đảo không có người sinh sống", "D. Vì biển, đảo tách biệt với đất liền"], "answer": "A", "explain": "Vùng biển, đảo nước ta vừa giàu tài nguyên thiên nhiên vừa có vị trí chiến lược về quốc phòng, an ninh nên phát triển kinh tế phải gắn chặt với bảo vệ chủ quyền.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hoạt động nào sau đây vừa phát triển kinh tế vừa góp phần bảo vệ chủ quyền biển, đảo?", "options": ["A. Đánh bắt hải sản xa bờ kết hợp bảo vệ ngư trường", "B. Khai thác cát trái phép ven biển", "C. Đánh bắt bằng chất nổ", "D. Bỏ hoang các đảo xa bờ"], "answer": "A", "explain": "Đánh bắt xa bờ vừa phát triển kinh tế thủy sản vừa khẳng định sự hiện diện, góp phần bảo vệ chủ quyền ngư trường truyền thống.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Trong giải quyết các vấn đề trên Biển Đông, quan điểm nhất quán của Việt Nam là gì?", "options": ["A. Giải quyết bằng biện pháp hòa bình, trên cơ sở luật pháp quốc tế", "B. Dùng sức mạnh quân sự để giải quyết", "C. Từ bỏ các yêu sách chủ quyền", "D. Đơn phương hành động, không hợp tác"], "answer": "A", "explain": "Việt Nam kiên trì giải quyết tranh chấp bằng biện pháp hòa bình, trên cơ sở tôn trọng luật pháp quốc tế, nhất là Công ước Luật Biển 1982 của Liên hợp quốc.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Kết hợp phát triển kinh tế biển với bảo đảm quốc phòng, an ninh được thể hiện qua chủ trương nào sau đây?", "options": ["A. Xây dựng Việt Nam thành quốc gia mạnh về biển, giàu từ biển", "B. Hạn chế mọi hoạt động trên biển", "C. Chỉ phát triển kinh tế mà không quan tâm quốc phòng", "D. Giao toàn bộ vùng biển cho nước ngoài khai thác"], "answer": "A", "explain": "Chiến lược biển Việt Nam xác định xây dựng nước ta thành quốc gia mạnh về biển, giàu từ biển, phát triển bền vững gắn với bảo đảm quốc phòng, an ninh và bảo vệ môi trường.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về quốc phòng, an ninh:", "statements": ["a) Việt Nam có vị trí đặc biệt quan trọng ở khu vực Đông Nam Á và Biển Đông.", "b) Biển Đông là hướng chiến lược trong bảo vệ Tổ quốc.", "c) Phát triển kinh tế biển phải gắn với bảo đảm quốc phòng, an ninh.", "d) Vị trí địa lí không ảnh hưởng đến quốc phòng, an ninh."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: vị trí địa lí có ảnh hưởng sâu sắc đến quốc phòng, an ninh của đất nước.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Bảo vệ chủ quyền biển, đảo là nhiệm vụ thiêng liêng.", "b) Việt Nam giải quyết tranh chấp Biển Đông bằng biện pháp hòa bình, theo luật pháp quốc tế.", "c) Phát triển kinh tế biển và bảo vệ môi trường biển phải đi đôi với nhau.", "d) Các đảo xa bờ không có vai trò về quốc phòng."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: các đảo, quần đảo (nhất là Hoàng Sa, Trường Sa) có vị trí chiến lược đặc biệt về quốc phòng, an ninh.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Việt Nam có đường biên giới trên đất liền dài khoảng 4600 km và đường bờ biển dài 3260 km. Tổng chiều dài tuyến biên giới quốc gia (đất liền và biển) khoảng bao nhiêu km?", "answer": "7860", "explain": "4600 + 3260 = 7860 km. Tuyến biên giới dài đòi hỏi công tác quản lí, bảo vệ chủ quyền lãnh thổ toàn vẹn.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho bảng số liệu: Số tỉnh, thành phố giáp biển của Việt Nam là 28. Trong đó, số tỉnh, thành phố thuộc duyên hải miền Trung (từ Thanh Hóa đến Bình Thuận) giáp biển là 14. Tính tỉ lệ phần trăm số tỉnh giáp biển thuộc duyên hải miền Trung (làm tròn đến 1 chữ số thập phân).", "answer": "50,0", "explain": "14 ÷ 28 × 100% = 50,0%. Một nửa số tỉnh giáp biển tập trung ở duyên hải miền Trung — khu vực có vị trí chiến lược về kinh tế biển và quốc phòng.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Trên Atlat Địa lí Việt Nam, kí hiệu nào thường dùng để thể hiện các điểm cực của lãnh thổ?", "options": ["A. Kí hiệu điểm (chấm tròn) kèm tên địa danh", "B. Kí hiệu đường đẳng trị", "C. Kí hiệu diện tích (nền màu)", "D. Kí hiệu chuyển động (mũi tên)"], "answer": "A", "explain": "Các điểm cực là đối tượng điểm nên trên Atlat được thể hiện bằng kí hiệu điểm (chấm tròn) kèm tên địa danh và tọa độ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cho bảng số liệu: Diện tích đất liền Việt Nam hơn 331 nghìn km2; diện tích vùng biển khoảng 1000 nghìn km2. Nhận xét nào đúng?", "options": ["A. Vùng biển rộng hơn vùng đất", "B. Vùng đất rộng hơn vùng biển", "C. Hai vùng có diện tích bằng nhau", "D. Không so sánh được"], "answer": "A", "explain": "1000 nghìn km2 (vùng biển) lớn hơn 331 nghìn km2 (vùng đất), tức vùng biển rộng gấp khoảng 3 lần vùng đất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm cực Bắc (Lũng Cú) thuộc tỉnh Hà Giang. Đặc điểm nào sau đây đúng về tỉnh Hà Giang?", "options": ["A. Giáp Biển Đông", "B. Có đường biên giới với Trung Quốc", "C. Thuộc vùng Đồng bằng sông Hồng", "D. Có điểm cực Nam của đất liền"], "answer": "B", "explain": "Hà Giang là tỉnh biên giới phía bắc, có đường biên giới với Trung Quốc và có điểm cực Bắc (Lũng Cú, Đồng Văn); tỉnh này không giáp biển và thuộc vùng Trung du và miền núi Bắc Bộ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho bảng số liệu về chiều dài đường biên giới đất liền (km): Trung Quốc 1400, Lào 2100, Cam-pu-chia 1100. Biểu đồ thích hợp nhất để thể hiện cơ cấu chiều dài biên giới với ba nước là:", "options": ["A. Biểu đồ tròn", "B. Biểu đồ đường", "C. Biểu đồ miền", "D. Biểu đồ kết hợp"], "answer": "A", "explain": "Thể hiện cơ cấu (tỉ trọng) của một tổng thể tại một thời điểm → biểu đồ tròn là thích hợp nhất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho bảng số liệu: Bờ biển Việt Nam dài 3260 km; bờ biển Trung Quốc dài khoảng 14500 km. Tỉ số chiều dài bờ biển Việt Nam so với Trung Quốc khoảng bao nhiêu phần trăm (làm tròn đến 1 chữ số thập phân)?", "options": ["A. 22,5%", "B. 44,8%", "C. 12,5%", "D. 32,6%"], "answer": "A", "explain": "3260 ÷ 14500 × 100% ≈ 22,48%, làm tròn 22,5%. Dù ngắn hơn nhiều so với Trung Quốc, bờ biển Việt Nam vẫn thuộc loại dài trong khu vực.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Một nhà nghiên cứu nhận định: Lãnh thổ Việt Nam tuy hẹp ngang nhưng có chiều dài lớn theo Bắc – Nam. Hệ quả địa lí quan trọng nhất của đặc điểm này là:", "options": ["A. Thiên nhiên phân hóa đa dạng theo chiều Bắc – Nam", "B. Diện tích đất liền lớn nhất Đông Nam Á", "C. Khí hậu đồng nhất trên cả nước", "D. Không chịu ảnh hưởng của gió mùa"], "answer": "A", "explain": "Kéo dài khoảng 15 vĩ độ làm cho lượng bức xạ, chế độ nhiệt – ẩm khác nhau rõ rệt giữa miền Bắc và miền Nam, tạo nên sự phân hóa đa dạng của thiên nhiên theo chiều Bắc – Nam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau (dựa vào bảng số liệu SGK):", "statements": ["a) Điểm cực Bắc: 23°23′B – Lũng Cú, Đồng Văn, Hà Giang.", "b) Điểm cực Nam: 8°34′B – Đất Mũi, Ngọc Hiển, Cà Mau.", "c) Điểm cực Tây: 102°09′Đ – Sín Thầu, Mường Nhé, Điện Biên.", "d) Điểm cực Đông: 109°28′Đ – Vạn Thạnh, Vạn Ninh, Khánh Hòa."], "answer": ["T", "T", "T", "T"], "explain": "Cả bốn khẳng định đều đúng theo số liệu SGK Địa lí 12 (Kết nối tri thức).", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Cho bảng số liệu: Chiều dài biên giới đất liền với Trung Quốc 1400 km, Lào 2100 km, Cam-pu-chia 1100 km. Xét tính đúng, sai:", "statements": ["a) Tổng chiều dài biên giới đất liền khoảng 4600 km.", "b) Biên giới với Lào dài nhất, chiếm khoảng 45,7% tổng chiều dài.", "c) Biên giới với Trung Quốc dài gấp đôi biên giới với Cam-pu-chia.", "d) Biên giới với Cam-pu-chia ngắn nhất trong ba tuyến."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng: 1400 + 2100 + 1100 = 4600 km. b) Đúng: 2100 ÷ 4600 ≈ 45,7%. c) Sai: 1400 ÷ 1100 ≈ 1,27 lần, không phải gấp đôi. d) Đúng: 1100 km là ngắn nhất.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Cho bảng số liệu: Diện tích vùng biển Việt Nam khoảng 1000 nghìn km2, diện tích đất liền hơn 331 nghìn km2. Tính tổng diện tích lãnh thổ (đất liền và biển) của Việt Nam theo đơn vị nghìn km2.", "answer": "1331", "explain": "1000 + 331 = 1331 nghìn km2 (tương đương 1,331 triệu km2). Đây là quy mô không gian lãnh thổ to lớn để phát triển kinh tế biển gắn với đất liền.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đường cơ sở dùng để tính chiều rộng lãnh hải của Việt Nam là đường nối các điểm nhô ra nhất của bờ biển. Lãnh hải rộng 12 hải lí, 1 hải lí = 1,852 km. Một điểm cách đường cơ sở 20 km về phía biển có thuộc lãnh hải Việt Nam không? (Trả lời: Có hoặc Không)", "answer": "Có", "explain": "12 hải lí = 12 × 1,852 = 22,224 km. Điểm cách đường cơ sở 20 km (nhỏ hơn 22,224 km) nên vẫn nằm trong lãnh hải Việt Nam.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Việt Nam nằm trong múi giờ số mấy?", "options": ["A. Múi giờ số 6", "B. Múi giờ số 7", "C. Múi giờ số 8", "D. Múi giờ số 9"], "answer": "B", "explain": "Kinh tuyến 105°Đ đi qua lãnh thổ nên phần lớn nước ta nằm trong múi giờ số 7 (GMT+7).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nước nào sau đây chung Biển Đông với Việt Nam?", "options": ["A. Thái Lan", "B. Ấn Độ", "C. Nhật Bản", "D. Ô-xtrây-li-a"], "answer": "A", "explain": "Các nước chung Biển Đông với Việt Nam gồm: Trung Quốc, Phi-líp-pin, In-đô-nê-xi-a, Bru-nây, Ma-lai-xi-a, Xing-ga-po, Thái Lan, Cam-pu-chia.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao Việt Nam được đánh giá là cầu nối giữa Đông Nam Á đất liền và Đông Nam Á hải đảo?", "options": ["A. Vì lãnh thổ vừa gắn với lục địa châu Á vừa mở ra Biển Đông – Thái Bình Dương", "B. Vì diện tích lớn nhất khu vực", "C. Vì dân số đông nhất khu vực", "D. Vì nằm hoàn toàn trên các đảo"], "answer": "A", "explain": "Lãnh thổ Việt Nam vừa gắn với bán đảo Đông Dương (lục địa) vừa có bờ biển dài mở ra Biển Đông thông ra Thái Bình Dương, tạo vai trò cầu nối  "d) Việt Nam là quốc gia duy nhất ở Đông Nam Á giáp biển."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: hầu hết các nước Đông Nam Á đều giáp biển (trừ Lào là quốc gia không giáp biển).", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau về ý nghĩa vị trí địa lí:", "statements": ["a) Vị trí tạo thuận lợi cho hội nhập kinh tế quốc tế.", "b) Vị trí khiến nước ta chịu nhiều thiên tai.", "c) Vị trí có ý nghĩa chiến lược về quốc phòng, an ninh.", "d) Vị trí địa lí chỉ mang lại thuận lợi, không có khó khăn."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: bên cạnh thuận lợi, vị trí địa lí cũng đặt ra thách thức (thiên tai, cạnh tranh, vấn đề an ninh biển).", "points": 1.0}, {"type": "short", "level": "VD", "q": "Hà Nội (múi giờ GMT+7) và Niu Oóc (múi giờ GMT-5, giờ mùa đông) chênh lệch nhau bao nhiêu giờ?", "answer": "12", "explain": "7 − (−5) = 12 giờ. Khi Hà Nội là 12 giờ trưa thì Niu Oóc là 0 giờ đêm cùng ngày (giờ mùa đông).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho bảng số liệu: Chiều dài bờ biển một số nước Đông Nam Á (km): Việt Nam 3260, Thái Lan 3219, Phi-líp-pin 36289, In-đô-nê-xi-a 54716. Nước nào có bờ biển dài nhất?", "answer": "In-đô-nê-xi-a", "explain": "In-đô-nê-xi-a là quốc gia quần đảo nên bờ biển dài nhất: 54 716 km, tiếp theo là Phi-líp-pin 36 289 km. Việt Nam đứng thứ ba trong bốn nước so sánh.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Nội dung nào sau đây KHÔNG thuộc bài học về vị trí địa lí và phạm vi lãnh thổ?", "options": ["A. Các điểm cực của lãnh thổ", "B. Các bộ phận của vùng biển", "C. Cơ cấu dân số theo tuổi", "D. Ảnh hưởng đến quốc phòng, an ninh"], "answer": "C", "explain": "Cơ cấu dân số theo tuổi thuộc bài Dân số Việt Nam, không thuộc bài Vị trí địa lí và phạm vi lãnh thổ.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Dãy số liệu nào sau đây sắp xếp đúng tọa độ các
