r": "4", "explain": "27,5 − 23,5 = 4°C. Chênh lệch 4°C trên khoảng cách 10 vĩ độ phản ánh quy luật phân hóa nhiệt theo vĩ độ.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cán cân bức xạ trung bình năm của nước ta khoảng 75 – 100 kcal/cm2/năm. Lấy giá trị trung bình 87,5 kcal/cm2/năm, tính tổng nhiệt lượng một diện tích 2 cm2 nhận được trong một năm (đơn vị kcal, chỉ ghi số).", "answer": "175", "explain": "87,5 × 2 = 175 kcal. Cán cân bức xạ dương lớn là cơ sở năng lượng cho tính chất nhiệt đới và hoạt động sản xuất nông nghiệp quanh năm.", "points": 0.5}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "q": "Gió mùa mùa đông ở miền Bắc nước ta có hướng chủ đạo nào sau đây?", "options": ["A. Đông Bắc", "B. Tây Nam", "C. Đông Nam", "D. Tây Bắc"], "answer": "A", "explain": "Từ tháng 11 đến tháng 4, miền Bắc chịu ảnh hưởng của gió mùa Đông Bắc lạnh, khô (đầu mùa) đến lạnh ẩm (cuối mùa).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Gió mùa mùa hạ ở nước ta có hướng chủ đạo nào sau đây?", "options": ["A. Đông Bắc", "B. Tây Nam", "C. Tây Bắc", "D. Đông"], "answer": "B", "explain": "Từ tháng 5 đến tháng 10, gió mùa Tây Nam nóng, ẩm từ Ấn Độ Dương thổi vào gây mưa lớn cho cả nước.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vào đầu mùa hạ, ở miền Trung nước ta thường xuất hiện loại gió nào gây khô nóng?", "options": ["A. Gió phơn Tây Nam", "B. Gió mùa Đông Bắc", "C. Tín phong bán cầu Nam", "D. Gió đất – gió biển"], "answer": "A", "explain": "Đầu mùa hạ, gió Tây Nam vượt Trường Sơn gây hiệu ứng phơn khô nóng ở miền Trung (gió Lào), nhiệt độ cao, độ ẩm thấp.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Ở miền Nam nước ta, vào mùa đông loại gió nào hoạt động chủ yếu?", "options": ["A. Gió mùa Đông Bắc", "B. Tín phong bán cầu Bắc", "C. Gió mùa Tây Nam", "D. Gió phơn"], "answer": "B", "explain": "Gió mùa Đông Bắc bị dãy Bạch Mã chắn lại nên miền Nam mùa đông chủ yếu chịu ảnh hưởng của Tín phong bán cầu Bắc khô nóng, t  "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chế độ gió phân hóa theo mùa và theo miền (Bắc – Nam) do vị trí và địa hình.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Gió mùa mùa đông hoạt động từ tháng 11 đến tháng 4 năm sau. Tính số tháng gió mùa mùa đông hoạt động trong một năm.", "answer": "6", "explain": "Từ tháng 11, 12, 1, 2, 3 đến tháng 4 là 6 tháng. Đây là thời kì miền Bắc có mùa đông lạnh, miền Nam là mùa khô.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Mùa bão ở nước ta kéo dài từ tháng 6 đến tháng 11. Một cơn bão di chuyển với tốc độ trung bình 20 km/giờ. Trong 15 giờ, bão đi được quãng đường bao nhiêu km?", "answer": "300", "explain": "20 × 15 = 300 km. Tốc độ di chuyển của bão ảnh hưởng đến thời gian và phạm vi gây mưa lớn, gió mạnh trên đất liền.", "points": 0.5}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "q": "Lượng mưa trung bình năm ở nước ta phổ biến trong khoảng nào sau đây?", "options": ["A. 1500 – 2000 mm", "B. 500 – 1000 mm", "C. Dưới 500 mm", "D. Trên 4000 mm"], "answer": "A", "explain": "Lượng mưa TB năm phổ biến 1500 – 2000 mm; một số nơi đón gió mưa rất lớn (trên 3000 mm), nơi khuất gió mưa ít hơn.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Độ ẩm không khí trung bình năm ở nước ta như thế nào?", "options": ["A. Trên 80%", "B. Dưới 50%", "C. Khoảng 60%", "D. Bằng 100% quanh năm"], "answer": "A", "explain": "Do giáp biển và mưa nhiều, độ ẩm không khí TB năm trên 80%, thể hiện tính chất ẩm của khí hậu.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên nhân chính làm cho lượng mưa ở nước ta lớn là:", "options": ["A. Hoạt động của gió mùa mang ẩm từ biển vào kết hợp với địa hình đón gió", "B. Nằm xa biển", "C. Địa hình hoàn toàn là đồng bằng", "D. Không có gió mùa hoạt động"], "answer": "A", "explain": "Gió mùa Tây Nam và dải hội tụ nhiệt đới mang hơi ẩm từ biển vào; sườn đón gió (Trường Sơn, Hoàng Liên Sơn) mưa rất lớn do địa hình nâng cao không khí ẩm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nơi nào sau đây ở nước ta có lượng mưa lớn nhất (được mệnh danh là nơi mưa nhiều nhất)?", "options": ["A. Bạch Mã – Huế", "B. Ninh Thuận", "C. Phan Rang", "D. Đồng bằng sông Cửu Long"], "answer": "A", "explain": "Sườn đông Trường Sơn (Bạch Mã – Huế) đón gió mùa Đông Bắc và bão nên mưa rất lớn, có năm trên 4000 mm; ngược lại Ninh Thuận – Bình Thuận khuất gió nên khô hạn nhất.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho bảng số liệu lượng mưa TB năm (mm): Hà Nội 1676, Huế 2868, TP. Hồ Chí Minh 1931. Nhận xét nào đúng?", "options": ["A. Huế có lượng mưa lớn nhất do đón gió mùa Đông Bắc và bão", "B. Hà Nội có lượng mưa lớn nhất", "C. TP. Hồ Chí Minh có lượng mưa nhỏ nhất", "D. Ba nơi có lượng mưa bằng nhau"], "answer": "A", "explain": "Huế (2868 mm) lớn nhất vì nằm ở sườn đông Trường Sơn đón gió mùa Đông Bắc, dải hội tụ và bão; TP. Hồ Chí Minh (1931 mm) lớn hơn Hà Nội (1676 mm).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Mưa ở nước ta phân hóa theo mùa rõ rệt: mùa mưa trùng với gió mùa mùa hạ. Hệ quả quan trọng nhất của đặc điểm này đối với sông ngòi là:", "options": ["A. Chế độ nước sông theo mùa: mùa lũ và mùa cạn phân hóa rõ", "B. Sông ngòi cạn nước quanh năm", "C. Sông ngòi không có phù sa", "D. Nước sông phân bố đều quanh năm"], "answer": "A", "explain": "Mưa tập trung vào mùa hạ (gió mùa Tây Nam) nên sông ngòi có mùa lũ trùng mùa mưa và mùa cạn trùng mùa khô — chế độ nước theo mùa là đặc trưng của sông ngòi nhiệt đới gió mùa.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Lượng mưa trung bình năm phổ biến 1500 – 2000 mm.", "b) Độ ẩm không khí trung bình năm trên 80%.", "c) Mưa phân bố đều quanh năm trên cả nước.", "d) Sườn đón gió thường mưa nhiều hơn sườn khuất gió."], "answer": ["T", "T", "F", "T"], "explain": "a), b), d) Đúng. c) Sai: mưa phân hóa theo mùa (mùa mưa – mùa khô) và theo khu vực (đón gió – khuất gió).", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Huế mưa nhiều do đón gió mùa Đông Bắc và chịu ảnh hưởng của bão.", "b) Ninh Thuận khô hạn do nằm ở sườn khuất gió của Trường Sơn.", "c) Mùa mưa ở Nam Bộ trùng với thời gian gió mùa Tây Nam hoạt động.", "d) Lượng mưa càng lớn thì độ ẩm không khí càng thấp."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: lượng mưa lớn thường đi kèm độ ẩm không khí cao.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Cho bảng số liệu: Lượng mưa TB năm ở Huế là 2868 mm, ở Hà Nội là 1676 mm. Lượng mưa ở Huế gấp khoảng bao nhiêu lần ở Hà Nội (làm tròn đến 1 chữ số thập phân)?", "answer": "1,7", "explain": "2868 ÷ 1676 ≈ 1,71, làm tròn 1,7 lần. Sự chênh lệch phản ánh vai trò của địa hình đón gió và vị trí trong phân hóa mưa.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một khu vực có lượng mưa 2000 mm/năm, lượng bốc hơi 1000 mm/năm. Tính lượng nước dư (mưa trừ bốc hơi) của khu vực đó (đơn vị mm, chỉ ghi số).", "answer": "1000", "explain": "2000 − 1000 = 1000 mm. Lượng nước dư lớn là cơ sở để hình thành mạng lưới sông ngòi dày đặc, nhiều nước ở nước ta.", "points": 0.5}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "q": "Tác động của khí hậu nhiệt đới ẩm gió mùa đến địa hình miền đồi núi là:", "options": ["A. Xâm thực mạnh", "B. Bồi tụ là chủ yếu", "C. Không bị xói mòn", "D. Địa hình bằng phẳng"], "answer": "A", "explain": "Mưa lớn tập trung theo mùa trên địa hình dốc làm quá trình xâm thực (xói mòn, rửa trôi, sạt lở) diễn ra mạnh ở miền đồi núi.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Ở đồng bằng, khí hậu nhiệt đới ẩm gió mùa làm cho quá trình nào diễn ra mạnh?", "options": ["A. Bồi tụ phù sa", "B. Xâm thực núi đá", "C. Phong hóa lí học", "D. Đóng băng"], "answer": "A", "explain": "Sông ngòi vận chuyển lượng phù sa lớn từ miền núi về bồi đắp nên quá trình bồi tụ diễn ra nhanh ở đồng bằng, mở rộng các châu thổ.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đặc điểm nào sau đây đúng với sông ngòi Việt Nam?", "options": ["A. Mạng lưới dày đặc, nhiều nước, giàu phù sa, chế độ nước theo mùa", "B. Ít sông, nghèo nước quanh năm", "C. Chế độ nước điều hòa quanh năm", "D. Không có phù sa"], "answer": "A", "explain": "Cả nước có 2360 sông dài trên 10 km; tổng lượng nước khoảng 839 tỉ m3/năm; giàu phù sa; mùa lũ trùng mùa mưa, mùa cạn trùng mùa khô.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Vì sao sông ngòi nước ta giàu phù sa?", "options": ["A. Do quá trình xâm thực mạnh ở miền đồi núi cung cấp vật liệu", "B. Do sông chảy trên đá gốc cứng", "C. Do không có mưa", "D. Do rừng che phủ 100%"], "answer": "A", "explain": "Mưa lớn gây xói mòn, rửa trôi mạnh ở miền đồi núi, cung cấp lượng vật liệu lớn cho sông ngòi vận chuyển và bồi đắp ở hạ lưu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Chế độ nước sông Hồng có mùa lũ từ tháng 6 đến tháng 10, trùng với mùa mưa. Điều này chứng tỏ:", "options": ["A. Chế độ mưa quyết định chế độ nước sông", "B. Sông Hồng không phụ thuộc vào mưa", "C. Mùa lũ do băng tan", "D. Nước sông do nước ngầm cung cấp chủ yếu"], "answer": "A", "explain": "Ở vùng nhiệt đới gió mùa, nguồn cung cấp nước sông chủ yếu là nước mưa nên chế độ nước sông phụ thuộc chặt chẽ vào chế độ mưa (mùa lũ trùng mùa mưa).", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Quá trình feralit diễn ra mạnh ở miền đồi núi nước ta là hệ quả tổng hợp của:", "options": ["A. Nhiệt ẩm cao kết hợp với quá trình rửa trôi", "B. Khí hậu lạnh khô", "C. Địa hình bằng phẳng", "D. Thiếu nước"], "answer": "A", "explain": "Nền nhiệt ẩm cao thúc đẩy phong hóa hóa học; mưa lớn gây rửa trôi các chất ba-dơ dễ tan, tích tụ ô-xít sắt, nhôm → hình thành đất feralit đỏ vàng đặc trưng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Khí hậu làm xâm thực mạnh ở miền đồi núi.", "b) Khí hậu làm bồi tụ nhanh ở đồng bằng.", "c) Sông ngòi nước ta dày đặc và nhiều nước.", "d) Chế độ nước sông điều hòa đều quanh năm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: chế độ nước sông phân hóa theo mùa (mùa lũ – mùa cạn) do mưa theo mùa.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Tổng lượng nước sông ngòi khoảng 839 tỉ m3/năm.", "b) Cả nước có 2360 sông dài trên 10 km.", "c) Mùa lũ của sông trùng với mùa mưa.", "d) Sông ngòi nước ta nghèo phù sa."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng theo số liệu SGK. d) Sai: sông ngòi nước ta giàu phù sa do xâm thực mạnh ở thượng lưu.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Cả nước có 2360 sông dài trên 10 km. Trong đó, khoảng 90% là sông nhỏ và ngắn. Tính số sông nhỏ và ngắn (chỉ ghi số).", "answer": "2124", "explain": "2360 × 90% = 2124 sông. Phần lớn sông ngòi nước ta là sông nhỏ, ngắn, dốc — đặc điểm của địa hình đồi núi và lãnh thổ hẹp ngang.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Tổng lượng nước của sông ngòi Việt Nam khoảng 839 tỉ m3/năm, trong đó khoảng 60% lượng nước do các sông bắt nguồn từ bên ngoài lãnh thổ chảy vào. Tính lượng nước do các sông trong nước cung cấp (đơn vị tỉ m3, chỉ ghi số).", "answer": "336", "explain": "839 × (100% − 60%) = 839 × 40% = 335,6 ≈ 336 tỉ m3. Phần lớn nước sông (Mê Công, sông Hồng...) bắt nguồn từ ngoài lãnh thổ nên hợp tác quốc tế về tài nguyên nước rất quan trọng.", "points": 0.5}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "q": "Quá trình hình thành đất đặc trưng của vùng nhiệt đới ẩm gió mùa ở nước ta là:", "options": ["A. Quá trình feralit", "B. Quá trình pốt-dôn", "C. Quá trình tích tụ mùn", "D. Quá trình phong hóa lí học"], "answer": "A", "explain": "Feralit là quá trình đặc trưng: mưa nhiều rửa trôi chất ba-dơ, tích tụ ô-xít sắt và ô-xít nhôm, đất có màu đỏ vàng.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nhóm đất chiếm diện tích lớn nhất ở nước ta (hơn 60% diện tích tự nhiên) là:", "options": ["A. Đất feralit", "B. Đất phù sa", "C. Đất mùn núi cao", "D. Đất xám"], "answer": "A", "explain": "Đồi núi chiếm 3/4 diện tích nên đất feralit (hình thành trên miền đồi núi) chiếm hơn 60% diện tích tự nhiên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Đất feralit có màu đỏ vàng chủ yếu do:", "options": ["A. Tích tụ ô-xít sắt và ô-xít nhôm", "B. Tích tụ nhiều mùn", "C. Có nhiều cát", "D. Bị ngập nước thường xuyên"], "answer": "A", "explain": "Quá trình feralit rửa trôi các chất dễ tan, tích tụ tương đối ô-xít sắt (Fe2O3) và ô-xít nhôm (Al2O3) làm đất có màu đỏ, đỏ vàng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hệ sinh thái đặc trưng của vùng nhiệt đới ẩm gió mùa ở nước ta là:", "options": ["A. Rừng nhiệt đới ẩm gió mùa", "B. Rừng lá kim ôn đới", "C. Hoang mạc và bán hoang mạc", "D. Đài nguyên"], "answer": "A", "explain": "Khí hậu nóng ẩm tạo điều kiện cho rừng nhiệt đới ẩm gió mùa phát triển với thành phần loài đa dạng, nhiều tầng tán.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Đất feralit ở miền đồi núi nước ta thường có tầng đất mỏng và dễ bị xói mòn. Biện pháp canh tác hợp lí trên đất này là:", "options": ["A. Trồng cây theo đường đồng mức, làm ruộng bậc thang, trồng rừng", "B. Cày xới theo sườn dốc", "C. Đốt rừng làm nương rẫy", "D. Bỏ hoang đất"], "answer": "A", "explain": "Trên đất dốc feralit cần canh tác theo đường đồng mức, ruộng bậc thang, nông – lâm kết hợp để hạn chế xói mòn, rửa trôi.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Rừng nhiệt đới ẩm gió mùa ở nước ta có thành phần loài đa dạng nhưng tài nguyên rừng đang suy giảm. Nguyên nhân chủ yếu là:", "options": ["A. Khai thác quá mức, cháy rừng và chuyển đổi mục đích sử dụng đất", "B. Khí hậu quá lạnh", "C. Lượng mưa quá ít", "D. Đất quá màu mỡ"], "answer": "A", "explain": "Nhu cầu gỗ, củi, mở rộng đất sản xuất dẫn đến khai thác quá mức, cháy rừng, chuyển rừng thành đất nông nghiệp — nguyên nhân chính làm suy giảm rừng.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Quá trình feralit là quá trình hình thành đất đặc trưng ở nước ta.", "b) Đất feralit chiếm hơn 60% diện tích tự nhiên.", "c) Đất phù sa phân bố chủ yếu ở đồng bằng.", "d) Đất feralit rất giàu mùn và tơi xốp như đất phù sa."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: đất feralit thường chua, nghèo mùn, dễ bị xói mòn; đất phù sa mới màu mỡ, tơi xốp.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Rừng nhiệt đới ẩm gió mùa có thành phần loài đa dạng.", "b) Sinh vật nước ta phong phú do khí hậu nóng ẩm.", "c) Tài nguyên sinh vật đang bị suy giảm.", "d) Khí hậu nhiệt đới ẩm không ảnh hưởng đến sinh vật."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: khí hậu là nhân tố quyết định sự phát triển và phân bố sinh vật.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Đất feralit chiếm hơn 60% diện tích tự nhiên của cả nước (331212 km2). Tính diện tích đất feralit (đơn vị km2, chỉ ghi số, làm tròn đến hàng đơn vị).", "answer": "198727", "explain": "331212 × 60% = 198727,2 ≈ 198727 km2. Diện tích lớn nhưng đất feralit cần được sử dụng hợp lí để chống xói mòn.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Độ che phủ rừng của Việt Nam năm 2023 đạt khoảng 42%. Diện tích đất có rừng khoảng 13,9 triệu ha. Tính tổng diện tích tự nhiên của cả nước theo số liệu này (đơn vị triệu ha, làm tròn đến 1 chữ số thập phân).", "answer": "33,1", "explain": "13,9 ÷ 42% ≈ 33,095 ≈ 33,1 triệu ha = 331 nghìn km2, phù hợp với diện tích tự nhiên của cả nước.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Thuận lợi lớn nhất của khí hậu nhiệt đới ẩm gió mùa đối với nông nghiệp là:", "options": ["A. Phát triển nền nông nghiệp nhiệt đới đa dạng, thâm canh tăng vụ quanh năm", "B. Chỉ trồng được cây ôn đới", "C. Không cần thủy lợi", "D. Không có sâu bệnh"], "answer": "A", "explain": "Nền nhiệt ẩm cao, mưa nhiều cho phép trồng nhiều vụ trong năm, đa dạng cây trồng nhiệt đới (lúa, cây công nghiệp, cây ăn quả...).", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cây trồng nào sau đây là thế mạnh của nền nông nghiệp nhiệt đới ở nước ta?", "options": ["A. Lúa nước", "B. Lúa mì", "C. Củ cải đường", "D. Nho ôn đới"], "answer": "A", "explain": "Lúa nước là cây lương thực đặc trưng của vùng nhiệt đới gió mùa châu Á; nước ta là một trong những nước xuất khẩu gạo hàng đầu thế giới.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nhờ khí hậu nhiệt đới ẩm gió mùa, nước ta có thể phát triển loại hình du lịch nào sau đây quanh năm?", "options": ["A. Du lịch biển và du lịch sinh thái", "B. Du lịch trượt tuyết", "C. Du lịch ngắm cực quang", "D. Du lịch sa mạc"], "answer": "A", "explain": "Bờ biển dài, nắng ấm quanh năm (nhất là miền Nam) và hệ sinh thái đa dạng tạo điều kiện phát triển du lịch biển, du lịch sinh thái quanh năm.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Khí hậu nóng ẩm tạo điều kiện cho ngành nào sau đây phát triển?", "options": ["A. Nuôi trồng thủy sản nước ngọt, nước lợ", "B. Khai thác dầu khí", "C. Luyện kim", "D. Đóng tàu vũ trụ"], "answer": "A", "explain": "Mạng lưới sông ngòi dày đặc, nhiều nước, bờ biển dài và khí hậu ấm tạo điều kiện nuôi trồng thủy sản nước ngọt (đồng bằng) và nước mặn, lợ (ven biển).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Vụ đông ở đồng bằng sông Hồng trồng được các cây rau màu ưa lạnh (su hào, bắp cải...). Điều này thể hiện:", "options": ["A. Tận dụng mùa đông lạnh của khí hậu nhiệt đới gió mùa để đa dạng hóa cây trồng", "B. Khí hậu ôn đới hoàn toàn", "C. Không chịu ảnh hưởng của gió mùa", "D. Chỉ trồng được lúa"], "answer": "A", "explain": "Mùa đông lạnh (do gió mùa Đông Bắc) là nét độc đáo của khí hậu miền Bắc, cho phép trồng cây cận nhiệt và ôn đới vào vụ đông, tăng hệ số sử dụng đất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Để phát huy thuận lợi của khí hậu nhiệt đới ẩm gió mùa trong nông nghiệp, giải pháp quan trọng nhất là:", "options": ["A. Thủy lợi hóa, đa dạng hóa cây trồng và phòng chống thiên tai", "B. Chỉ trồng một loại cây", "C. Bỏ qua công tác thủy lợi", "D. Mở rộng diện tích bằng cách phá rừng"], "answer": "A", "explain": "Mưa theo mùa gây úng – hạn nên cần thủy lợi; đa dạng cây trồng tận dụng lợi thế nhiệt ẩm; phòng chống thiên tai giảm rủi ro — đó là hướng phát huy bền vững.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về thuận lợi:", "statements": ["a) Khí hậu thuận lợi phát triển nông nghiệp nhiệt đới.", "b) Có thể thâm canh, tăng vụ quanh năm.", "c) Phát triển được du lịch biển quanh năm.", "d) Khí hậu không ảnh hưởng gì đến sản xuất."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: khí hậu là nhân tố hàng đầu ảnh hưởng đến sản xuất nông nghiệp và nhiều ngành kinh tế.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Vụ đông ở miền Bắc tận dụng được khí hậu lạnh để trồng rau màu ôn đới.", "b) Thủy sản phát triển nhờ mạng lưới sông ngòi và bờ biển dài.", "c) Lâm nghiệp phát triển nhờ tài nguyên rừng phong phú.", "d) Khí hậu nhiệt đới ẩm chỉ gây khó khăn, không có thuận lợi."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: khí hậu vừa tạo thuận lợi lớn vừa gây khó khăn; cần phát huy thuận lợi, hạn chế khó khăn.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Nhờ khí hậu nhiệt đới, nhiều nơi ở nước ta trồng được 3 vụ lúa/năm, hệ số sử dụng đất đạt 3,0 lần. Một hộ có 2 ha đất trồng lúa 3 vụ/năm. Tính diện tích gieo trồng lúa cả năm của hộ đó (đơn vị ha, chỉ ghi số).", "answer": "6", "explain": "2 × 3 = 6 ha gieo trồng/năm. Hệ số sử dụng đất cao là ưu thế của nền nông nghiệp nhiệt đới thâm canh.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Năm 2024, Việt Nam xuất khẩu khoảng 9 triệu tấn gạo. Giá gạo xuất khẩu bình quân khoảng 620 USD/tấn. Tính kim ngạch xuất khẩu gạo (đơn vị tỉ USD, làm tròn đến 1 chữ số thập phân).", "answer": "5,6", "explain": "9 × 620 = 5580 triệu USD = 5,58 ≈ 5,6 tỉ USD. Gạo là mặt hàng nông sản xuất khẩu chủ lực, thể hiện thế mạnh của nông nghiệp nhiệt đới.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Loại thiên tai nào sau đây gây thiệt hại lớn nhất cho nước ta hằng năm?", "options": ["A. Bão và lũ lụt", "B. Động đất", "C. Núi lửa", "D. Sóng thần"], "answer": "A", "explain": "Nằm trong khu vực bão nhiệt đới và gió mùa, hằng năm nước ta chịu nhiều cơn bão gây lũ lụt, thiệt hại lớn về người và tài sản.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Vào mùa khô, khó khăn lớn nhất của khí hậu nhiệt đới ẩm gió mùa đối với sản xuất nông nghiệp là:", "options": ["A. Thiếu nước, hạn hán", "B. Thừa nước", "C. Quá lạnh", "D. Không có nắng"], "answer": "A", "explain": "Mưa phân hóa theo mùa sâu sắc: mùa khô kéo dài gây thiếu nước, hạn hán, nhất là ở Nam Bộ, Tây Nguyên và duyên hải miền Trung.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Rét đậm, rét hại ở miền Bắc nước ta thường xảy ra khi:", "options": ["A. Gió mùa Đông Bắc tràn về mạnh", "B. Gió mùa Tây Nam hoạt động", "C. Có bão", "D. Tín phong suy yếu"], "answer": "A", "explain": "Các đợt không khí lạnh cực mạnh tràn xuống gây rét đậm, rét hại, ảnh hưởng đến cây trồng, vật nuôi và sức khỏe con người.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Hạn hán và xâm nhập mặn ở đồng bằng sông Cửu Long có xu hướng gia tăng chủ yếu do:", "options": ["A. Mùa khô kéo dài kết hợp với biến đổi khí hậu và sử dụng nước thượng nguồn", "B. Mưa quá nhiều", "C. Địa hình quá cao", "D. Dân số giảm"], "answer": "A", "explain": "Mùa khô kéo dài (tháng 11 – tháng 4), lượng mưa ít, cộng với biến đổi khí hậu và khai thác nước thượng nguồn làm xâm nhập mặn lấn sâu.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sâu bệnh phát triển mạnh trong điều kiện khí hậu nóng ẩm. Biện pháp phòng trừ tổng hợp hiệu quả nhất là:", "options": ["A. Kết hợp biện pháp sinh học, canh tác và hóa học hợp lí", "B. Chỉ phun thuốc hóa học liều cao", "C. Bỏ mặc không phòng trừ", "D. Đốt toàn bộ đồng ruộng"], "answer": "A", "explain": "Phòng trừ tổng hợp (IPM): dùng giống kháng bệnh, thiên địch, canh tác hợp lí, hạn chế thuốc hóa học — vừa hiệu quả vừa bảo vệ môi trường.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Biến đổi khí hậu làm gia tăng tính thất thường của khí hậu nhiệt đới ẩm gió mùa. Biểu hiện nào sau đây đúng nhất?", "options": ["A. Bão mạnh hơn, mưa lũ cực đoan, hạn hán và xâm nhập mặn gia tăng", "B. Khí hậu trở nên ôn hòa hoàn toàn", "C. Không còn bão", "D. Nhiệt độ giảm mạnh"], "answer": "A", "explain": "Biến đổi khí hậu làm bão mạnh hơn, xuất hiện mưa lũ cực đoan, nắng nóng kỷ lục, hạn hán và xâm nhập mặn gia tăng — thách thức lớn cho phát triển bền vững.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về khó khăn:", "statements": ["a) Bão, lũ lụt gây thiệt hại lớn hằng năm.", "b) Hạn hán xảy ra vào mùa khô.", "c) Rét đậm, rét hại ảnh hưởng đến miền Bắc.", "d) Khí hậu nhiệt đới ẩm không gây khó khăn gì."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: khí hậu gây nhiều khó khăn (thiên tai, sâu bệnh, thời tiết thất thường).", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Mưa lớn tập trung gây xói mòn, sạt lở đất ở miền núi.", "b) Thời tiết thất thường gây khó khăn cho dự báo sản xuất.", "c) Độ ẩm cao tạo điều kiện cho sâu bệnh phát triển.", "d) Thiên tai chỉ xảy ra ở miền Bắc."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: thiên tai xảy ra trên khắp cả nước với các loại hình khác nhau (bão, lũ, hạn, xâm nhập mặn...).", "points": 1.0}, {"type": "short", "level": "VD", "q": "Trung bình mỗi năm có khoảng 10 cơn bão ảnh hưởng đến Việt Nam. Trong 5 năm, trung bình có khoảng bao nhiêu cơn bão ảnh hưởng (chỉ ghi số)?", "answer": "50", "explain": "10 × 5 = 50 cơn. Tần suất bão cao đòi hỏi công tác dự báo, phòng chống phải thường xuyên, chủ động.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Một trận lũ làm ngập 12000 ha lúa, năng suất bình quân 60 tạ/ha. Tính sản lượng lúa bị thiệt hại (đơn vị tấn, chỉ ghi số).", "answer": "72000", "explain": "12000 × 60 = 720000 tạ = 72000 tấn. Thiệt hại do thiên tai rất lớn, cần chủ động phòng tránh và bảo hiểm nông nghiệp.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Cho bảng số liệu: Nhiệt độ TB năm (°C): Hà Nội 23,5; Huế 25,2; TP. Hồ Chí Minh 27,5. Địa điểm có nhiệt độ TB năm cao nhất là:", "options": ["A. TP. Hồ Chí Minh", "B. Hà Nội", "C. Huế", "D. Cả ba bằng nhau"], "answer": "A", "explain": "TP. Hồ Chí Minh ở vĩ độ thấp nhất (11°B) nên nhiệt độ TB năm cao nhất: 27,5°C.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cho bảng số liệu: Lượng mưa TB năm (mm): Hà Nội 1676, Huế 2868, TP. Hồ Chí Minh 1931. Địa điểm mưa nhiều nhất là:", "options": ["A. Huế", "B. Hà Nội", "C. TP. Hồ Chí Minh", "D. Cả ba bằng nhau"], "answer": "A", "explain": "Huế mưa nhiều nhất (2868 mm) do đón gió mùa Đông Bắc, dải hội tụ nhiệt đới và bão ở sườn đông Trường Sơn.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Dựa vào bảng số liệu nhiệt độ và lượng mưa ba địa điểm trên, nhận xét nào đúng về sự phân hóa khí hậu Bắc – Nam?", "options": ["A. Nhiệt độ tăng dần từ Bắc vào Nam; lượng mưa phân hóa theo khu vực đón gió", "B. Nhiệt độ giảm dần từ Bắc vào Nam", "C. Lượng mưa tăng dần đều từ Bắc vào Nam", "D. Không có sự phân hóa"], "answer": "A", "explain": "Nhiệt độ tăng dần từ Bắc (23,5°C) vào Nam (27,5°C); lượng mưa không tăng đều mà phụ thuộc vào địa hình đón gió (Huế cao nhất).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Để thể hiện nhiệt độ và lượng mưa trung bình các tháng trong năm của một địa điểm, biểu đồ thích hợp nhất là:", "options": ["A. Biểu đồ kết hợp cột (mưa) và đường (nhiệt độ)", "B. Biểu đồ tròn", "C. Biểu đồ miền", "D. Biểu đồ cột chồng"], "answer": "A", "explain": "Biểu đồ khí hậu (biểu đồ kết hợp): cột thể hiện lượng mưa, đường thể hiện nhiệt độ — dạng biểu đồ chuẩn trong Atlat.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho bảng số liệu: Biên độ nhiệt năm ở Hà Nội khoảng 12°C, ở TP. Hồ Chí Minh khoảng 3°C. Nguyên nhân chính của sự khác biệt này là:", "options": ["A. Hà Nội chịu ảnh hưởng của gió mùa Đông Bắc, TP. Hồ Chí Minh gần xích đạo, ít chịu ảnh hưởng", "B. Hà Nội ở gần biển hơn", "C. TP. Hồ Chí Minh ở độ cao lớn", "D. Hà Nội có nhiều bão hơn"], "answer": "A", "explain": "Gió mùa Đông Bắc làm mùa đông miền Bắc lạnh sâu → biên độ nhiệt năm lớn; miền Nam quanh năm nóng, biên độ nhỏ.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Trên Atlat Địa lí Việt Nam, trang Khí hậu thể hiện các trạm khí tượng bằng biểu đồ cột – đường. Một trạm có đường nhiệt độ cao đều quanh năm (26 – 28°C), cột mưa tập trung tháng 5 – 10. Trạm này có thể thuộc khu vực nào?", "options": ["A. Nam Bộ", "B. Đồng bằng sông Hồng", "C. Tây Bắc", "D. Đông Bắc"], "answer": "A", "explain": "Nhiệt độ cao đều quanh năm và mưa tập trung mùa hạ (tháng 5 – 10) là đặc trưng khí hậu cận xích đạo của Nam Bộ (mùa mưa – mùa khô phân hóa rõ).", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Cho bảng số liệu nhiệt độ TB năm (°C): Hà Nội 23,5; Huế 25,2; TP. Hồ Chí Minh 27,5. Xét tính đúng, sai:", "statements": ["a) Nhiệt độ tăng dần từ Bắc vào Nam.", "b) TP. Hồ Chí Minh có nhiệt độ cao nhất.", "c) Hà Nội có nhiệt độ thấp nhất trong ba địa điểm.", "d) Ba địa điểm có nhiệt độ bằng nhau."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: 23,5 nhỏ hơn 25,2 nhỏ hơn 27,5. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Cho bảng số liệu lượng mưa TB năm (mm): Hà Nội 1676, Huế 2868, TP. Hồ Chí Minh 1931. Xét tính đúng, sai:", "statements": ["a) Huế có lượng mưa lớn nhất.", "b) Lượng mưa ở Huế gấp khoảng 1,7 lần ở Hà Nội.", "c) TP. Hồ Chí Minh mưa nhiều hơn Hà Nội.", "d) Lượng mưa tăng dần đều từ Bắc vào Nam."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng: 2868 ÷ 1676 ≈ 1,71. c) Đúng: 1931 lớn hơn 1676. d) Sai: Huế (miền Trung) cao nhất, không tăng đều.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Cho bảng số liệu: Nhiệt độ TB tháng 1 ở Hà Nội là 16,4°C, tháng 7 là 29,2°C. Tính biên độ nhiệt năm ở Hà Nội (đơn vị °C, chỉ ghi số, 1 chữ số thập phân).", "answer": "12,8", "explain": "29,2 − 16,4 = 12,8°C. Biên độ nhiệt năm lớn thể hiện tính chất gió mùa rõ rệt ở miền Bắc.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho bảng số liệu: Lượng mưa các tháng mùa mưa (tháng 5 – 10) ở TP. Hồ Chí Minh chiếm 90% tổng lượng mưa năm 1931 mm. Tính lượng mưa mùa khô (đơn vị mm, làm tròn đến hàng đơn vị).", "answer": "193", "explain": "1931 × (100% − 90%) = 193,1 ≈ 193 mm. Mùa khô mưa rất ít, gây khó khăn về nước cho sản xuất và sinh hoạt ở Nam Bộ.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Sự phân hóa khí hậu theo chiều Bắc – Nam ở nước ta chủ yếu do:", "options": ["A. Chênh lệch vĩ độ và ảnh hưởng của gió mùa Đông Bắc", "B. Chênh lệch kinh độ", "C. Ảnh hưởng của biển như nhau", "D. Địa hình bằng phẳng"], "answer": "A", "explain": "Lãnh thổ kéo dài 15 vĩ độ kết hợp với gió mùa Đông Bắc chỉ ảnh hưởng đến miền Bắc tạo nên sự phân hóa Bắc – Nam rõ rệt.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Sự phân hóa theo độ cao thể hiện rõ nhất ở:", "options": ["A. Vùng núi cao", "B. Đồng bằng", "C. Ven biển", "D. Hải đảo"], "answer": "A", "explain": "Càng lên cao nhiệt độ càng giảm (khoảng 0,6°C/100 m), tạo nên các đai khí hậu theo độ cao ở vùng núi.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Nguyên nhân tạo nên sự phân hóa Đông – Tây của khí hậu nước ta là:", "options": ["A. Ảnh hưởng của địa hình (sườn đón gió – sườn khuất gió)", "B. Chênh lệch vĩ độ", "C. Ảnh hưởng của biển như nhau ở mọi nơi", "D. Không có nguyên nhân"], "answer": "A", "explain": "Dãy Trường Sơn tạo sườn đông đón gió (mưa nhiều) và sườn tây khuất gió (khô hạn, hiệu ứng phơn) → phân hóa Đông – Tây.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Miền Bắc nước ta có mùa đông lạnh, miền Nam nóng quanh năm. Ranh giới khí hậu giữa hai miền là:", "options": ["A. Dãy Bạch Mã (vĩ tuyến 16°B)", "B. Đèo Hải Vân thuộc dãy Bạch Mã", "C. Dãy Hoàng Liên Sơn", "D. Dãy Trường Sơn Nam"], "answer": "A", "explain": "Dãy Bạch Mã (vĩ tuyến 16°B) chắn gió mùa Đông Bắc, là ranh giới khí hậu giữa miền Bắc (có mùa đông lạnh) và miền Nam (nóng quanh năm). Đèo Hải Vân nằm trên dãy Bạch Mã.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Ở độ cao 1500 m so với chân núi (nhiệt độ 25°C), nhiệt độ khoảng bao nhiêu (giảm 0,6°C/100 m)?", "options": ["A. Khoảng 16°C", "B. Khoảng 20°C", "C. Khoảng 25°C", "D. Khoảng 10°C"], "answer": "A", "explain": "Giảm: 1500 ÷ 100 × 0,6 = 9°C. 25 − 9 = 16°C. Đây là cơ sở của sự phân hóa khí hậu theo độ cao.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Sa Pa (1500 m) trồng được rau ôn đới (su hào, bắp cải) và có sương muối mùa đông. Điều này chứng tỏ:", "options": ["A. Khí hậu phân hóa theo độ cao tạo điều kiện trồng cây ôn đới ở vùng núi", "B. Sa Pa có khí hậu hoang mạc", "C. Vùng núi không có sự phân hóa khí hậu", "D. Cây ôn đới trồng được ở mọi nơi"], "answer": "A", "explain": "Độ cao làm giảm nhiệt độ, tạo tiểu vùng khí hậu mát lạnh như ôn đới, cho phép trồng cây ôn đới và phát triển du lịch nghỉ dưỡng ở vùng núi.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau về sự phân hóa:", "statements": ["a) Khí hậu phân hóa theo chiều Bắc – Nam.", "b) Khí hậu phân hóa theo chiều Đông – Tây.", "c) Khí hậu phân hóa theo độ cao.", "d) Khí hậu đồng nhất trên cả nước."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng: ba hướng phân hóa chính. d) Sai.", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Dãy Bạch Mã là ranh giới khí hậu Bắc – Nam.", "b) Sườn đông Trường Sơn mưa nhiều hơn sườn tây.", "c) Càng lên cao nhiệt độ càng giảm.", "d) Miền Nam có mùa đông lạnh như miền Bắc."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: miền Nam nóng quanh năm, không có mùa đông lạnh.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Chân núi có nhiệt độ 28°C. Lên cao 2000 m, nhiệt độ giảm 0,6°C/100 m. Tính nhiệt độ ở độ cao 2000 m (đơn vị °C, chỉ ghi số).", "answer": "16", "explain": "Giảm: 2000 ÷ 100 × 0,6 = 12°C. 28 − 12 = 16°C.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Đỉnh Phan-xi-păng cao 3143 m. Nhiệt độ ở Sa Pa (1500 m) là 15°C. Ước tính nhiệt độ trên đỉnh Phan-xi-păng (giảm 0,6°C/100 m, chỉ ghi số, làm tròn đến 1 chữ số thập phân).", "answer": "5,1", "explain": "Chênh cao: 3143 − 1500 = 1643 m. Giảm: 1643 ÷ 100 × 0,6 ≈ 9,86°C. 15 − 9,86 ≈ 5,1°C. Đỉnh núi cao có khí hậu lạnh như ôn đới.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Thiên nhiên Việt Nam mang tính chất nào sau đây?", "options": ["A. Nhiệt đới ẩm gió mùa", "B. Ôn đới hải dương", "C. Cận cực", "D. Hoang mạc"], "answer": "A", "explain": "Do vị trí trong vành đai nhiệt đới và khu vực gió mùa châu Á, thiên nhiên nước ta mang tính chất nhiệt đới ẩm gió mùa.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Nội dung nào sau đây KHÔNG thuộc bài Thiên nhiên nhiệt đới ẩm gió mùa?", "options": ["A. Quá trình feralit", "B. Gió mùa Đông Bắc", "C. Cơ cấu GDP theo ngành", "D. Chế độ nước sông theo mùa"], "answer": "C", "explain": "Cơ cấu GDP theo ngành thuộc bài Chuyển dịch cơ cấu kinh tế, không thuộc bài này.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa khí hậu và sông ngòi nước ta được thể hiện đúng nhất ở nhận định nào?", "options": ["A. Mưa theo mùa quyết định chế độ nước sông theo mùa", "B. Sông ngòi không phụ thuộc vào khí hậu", "C. Khí hậu làm sông cạn kiệt hoàn toàn", "D. Sông ngòi quyết định khí hậu"], "answer": "A", "explain": "Nguồn nước sông chủ yếu từ mưa nên chế độ mưa (theo mùa) quyết định chế độ nước sông (mùa lũ – mùa cạn).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mối quan hệ giữa khí hậu và đất ở miền đồi núi được thể hiện ở:", "options": ["A. Quá trình feralit hình thành đất đỏ vàng", "B. Đất không chịu ảnh hưởng của khí hậu", "C. Khí hậu làm đất trở nên màu mỡ tuyệt đối", "D. Đất đồi núi giống hệt đất đồng bằng"], "answer": "A", "explain": "Nhiệt ẩm cao và rửa trôi mạnh tạo quá trình feralit đặc trưng, hình thành đất đỏ vàng trên miền đồi núi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho các phát biểu: (1) Nhiệt độ TB năm trên 20°C; (2) Mưa 1500 – 2000 mm/năm; (3) Có hai mùa gió chính; (4) Độ ẩm trên 80%. Số phát biểu đúng về khí hậu nước ta là:", "options": ["A. 1", "B. 2", "C. 3", "D. 4"], "answer": "D", "explain": "Cả 4 phát biểu đều đúng, thể hiện đầy đủ ba tính chất: nhiệt đới – ẩm – gió mùa.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Phát biểu nào sau đây đúng nhất về ảnh hưởng tổng hợp của thiên nhiên nhiệt đới ẩm gió mùa?", "options": ["A. Vừa tạo thuận lợi to lớn cho phát triển kinh tế, vừa gây nhiều khó khăn, đòi hỏi khai thác hợp lí", "B. Chỉ gây khó khăn, không có thuận lợi", "C. Chỉ có thuận lợi, không có khó khăn", "D. Không ảnh hưởng đến con người"], "answer": "A", "explain": "Thiên nhiên nhiệt đới ẩm gió mùa là cơ sở cho nông nghiệp nhiệt đới phát triển nhưng cũng gây thiên tai, sâu bệnh... Cần phát huy thuận lợi, hạn chế khó khăn để phát triển bền vững.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định ôn tập sau:", "statements": ["a) Khí hậu nước ta mang tính chất nhiệt đới ẩm gió mùa.", "b) Sông ngòi dày đặc, chế độ nước theo mùa.", "c) Đất feralit là quá trình hình thành đất đặc trưng.", "d) Sinh vật kém đa dạng do khí hậu khắc nghiệt."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: sinh vật rất đa dạng nhờ khí hậu nóng ẩm (rừng nhiệt đới ẩm gió mùa).", "points": 1.0}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Gió mùa Đông Bắc gây mùa đông lạnh ở miền Bắc.", "b) Gió mùa Tây Nam gây mưa lớn vào mùa hạ.", "c) Địa hình chịu xâm thực mạnh ở miền núi, bồi tụ nhanh ở đồng bằng.", "d) Thiên nhiên nước ta không phân hóa theo không gian."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: thiên nhiên phân hóa theo Bắc – Nam, Đông – Tây và độ cao.", "points": 1.0}, {"type": "short", "level": "VD", "q": "Kể tên hai mùa gió chính ở nước ta (viết cách nhau bằng dấu phẩy).", "answer": "Gió mùa mùa đông, gió mùa mùa hạ", "explain": "Hai mùa gió: gió mùa mùa đông (hướng đông bắc, từ tháng 11 đến tháng 4) và gió mùa mùa hạ (hướng tây nam, từ tháng 5 đến tháng 10).", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cho bảng số liệu: Tổng diện tích rừng của Việt Nam khoảng 13,9 triệu ha, trong đó rừng tự nhiên chiếm khoảng 70%. Tính diện tích rừng tự nhiên (đơn vị triệu ha, làm tròn đến 1 chữ số thập phân).", "answer": "9,7", "explain": "13,9 × 70% = 9,73 ≈ 9,7 triệu ha. Rừng tự nhiên gắn với hệ sinh thái rừng nhiệt đới ẩm gió mùa đa dạng.", "points": 0.5}]}]}
