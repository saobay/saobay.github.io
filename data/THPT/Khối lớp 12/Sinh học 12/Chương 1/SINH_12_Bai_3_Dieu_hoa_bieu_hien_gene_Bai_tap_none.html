{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Thành phần nào của operon lac tổng hợp protein ức chế?", "options": ["A. Gene điều hòa R", "B. Vùng khởi động P", "C. Vùng vận hành O", "D. Gene cấu trúc Z"], "answer": "A", "explain": "Gene điều hòa R tổng hợp protein ức chế; khi không có lactose, protein này bám vào vùng O."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Khi môi trường không có lactose, operon lac ở trạng thái:", "options": ["A. Không phiên mã", "B. Phiên mã mạnh", "C. Phiên mã một phần", "D. Phiên mã liên tục"], "answer": "A", "explain": "Không có lactose, protein ức chế bám vào O → RNA polymerase không trượt qua được → không phiên mã."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Khi có lactose, điều gì xảy ra với protein ức chế của operon lac?", "options": ["A. Protein ức chế bị bất hoạt, rời khỏi vùng O", "B. Protein ức chế bám chặt hơn vào vùng O", "C. RNA polymerase bị phân giải", "D. Gene điều hòa R ngừng hoạt động"], "answer": "A", "explain": "Lactose bám vào protein ức chế làm nó biến đổi cấu hình không gian → không bám được vào vùng O → operon được phiên mã."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cơ chế nào tham gia điều hòa biểu hiện gene ở mức trước phiên mã ở sinh vật nhân thực?", "options": ["A. Methyl hóa DNA", "B. Cắt intron, nối exon", "C. Tổng hợp đoạn mồi", "D. Nhân đôi DNA"], "answer": "A", "explain": "Methyl hóa DNA (và biến đổi histone) làm thay đổi cấu trúc NST, ảnh hưởng khả năng tiếp cận gene của RNA polymerase."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Nếu gene điều hòa R bị đột biến mất chức năng, operon lac sẽ:", "options": ["A. Operon lac phiên mã liên tục ngay cả khi không có lactose", "B. Operon lac không bao giờ phiên mã", "C. Gene điều hòa R phiên mã mạnh hơn", "D. Protein ức chế bám chặt hơn vào vùng O"], "answer": "A", "explain": "Không có protein ức chế bám vào O, RNA polymerase luôn trượt qua được → operon phiên mã liên tục."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một đột biến làm vùng O thay đổi cấu trúc khiến protein ức chế không bám được. Hậu quả:", "options": ["A. Protein ức chế không bám được vào O, operon phiên mã liên tục", "B. Protein ức chế bám chặt vĩnh viễn vào O", "C. RNA polymerase không nhận biết được vùng P", "D. Gene R không tổng hợp được protein ức chế"], "answer": "A", "explain": "Protein ức chế không bám được vào O đột biến → không ngăn được RNA polymerase → các gene cấu trúc phiên mã liên tục."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét cấu trúc operon lac ở vi khuẩn E. coli:", "statements": ["a) Gene điều hòa R tổng hợp protein ức chế.", "b) Vùng P là nơi protein ức chế bám vào.", "c) Nhóm gene cấu trúc gồm Z, Y, A mã hóa enzyme phân giải lactose.", "d) Vùng O là nơi RNA polymerase bám vào khởi đầu phiên mã."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: protein ức chế bám vào vùng O; RNA polymerase bám vào vùng P. c) Đúng. d) Sai: RNA polymerase bám vào vùng P."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét cơ chế hoạt động của operon lac:", "statements": ["a) Khi không có lactose, protein ức chế bám vào vùng O ngăn cản phiên mã.", "b) Lactose bám vào protein ức chế làm nó rời khỏi vùng O.", "c) Khi có lactose, các gene Z, Y, A đồng loạt phiên mã.", "d) Operon lac là mô hình điều hòa ức chế."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: operon lac là mô hình điều hòa cảm ứng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Operon lac có các thành phần R, P, O, Z, Y, A. Số gene cấu trúc trong operon lac là", "answer": "3", "explain": "Nhóm gene cấu trúc gồm 3 gene Z, Y, A (R là gene điều hòa, P và O là vùng điều hòa)."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Ở sinh vật nhân thực, quá trình cắt intron và nối exon diễn ra với phân tử (điền tên)", "answer": "tiền mRNA", "explain": "Tiền mRNA (pre-mRNA) được chế biến: cắt bỏ intron, nối các exon tạo mRNA trưởng thành."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Điều hòa biểu hiện gene đảm bảo các gene hoạt động:", "options": ["A. Ngẫu nhiên", "B. Đúng lúc, đúng nơi, đúng lượng", "C. Liên tục tối đa", "D. Mọi lúc, mọi nơi"], "answer": "B", "explain": "Điều hòa giúp gene chỉ biểu hiện đúng lúc, đúng nơi (đúng loại tế bào), đúng lượng sản phẩm."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Operon lac được phát hiện ở vi khuẩn:", "options": ["A. Lactobacillus", "B. E. coli", "C. Bacillus thuringiensis", "D. E. coli"], "answer": "B", "explain": "Operon lac là hệ thống điều hòa chuyển hóa lactose ở vi khuẩn E. coli."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Acetyl hóa histone có tác dụng:", "options": ["A. Làm NST đóng xoắn, giảm phiên mã", "B. Làm NST tháo xoắn, tăng phiên mã", "C. Không ảnh hưởng", "D. Làm NST tháo xoắn, tăng phiên mã"], "answer": "B", "explain": "Acetyl hóa histone làm NST tháo xoắn → gene dễ tiếp cận → tăng phiên mã."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Khi không có lactose, thành phần nào ngăn cản RNA polymerase?", "options": ["A. Lactose", "B. Protein ức chế", "C. Enzyme beta-galactosidase", "D. Protein ức chế"], "answer": "B", "explain": "Protein ức chế bám vào vùng O, ngăn cản RNA polymerase trượt qua."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Đột biến mất vùng O của operon lac dẫn đến:", "options": ["A. Không phiên mã", "B. Phiên mã liên tục", "C. Chỉ phiên mã khi không có lactose", "D. Phiên mã liên tục"], "answer": "B", "explain": "Mất vùng O → protein ức chế không có chỗ bám → RNA polymerase luôn trượt qua → phiên mã liên tục."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Đột biến làm gene tiền ung thư biểu hiện quá mức dẫn đến:", "options": ["A. Tế bào chết", "B. Gene tiền ung thư hoạt động quá mức", "C. Không thay đổi", "D. Gene tiền ung thư hoạt động quá mức"], "answer": "B", "explain": "Gene tiền ung thư (proto-oncogene) khi đột biến/biểu hiện quá mức trở thành gene ung thư."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về điều hòa biểu hiện gene:", "statements": ["a) Gene có thể được bật hoặc tắt tùy nhu cầu tế bào.", "b) Điều hòa gene đảm bảo phát triển bình thường của cơ thể.", "c) Mọi gene trong tế bào đều hoạt động với cường độ như nhau.", "d) Tín hiệu môi trường có thể ảnh hưởng biểu hiện gene."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: các gene biểu hiện khác nhau tùy loại tế bào. d) Đúng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét điều hòa gene ở sinh vật nhân thực:", "statements": ["a) Acetyl hóa histone làm tăng phiên mã.", "b) NST đóng xoắn chặt làm giảm phiên mã.", "c) Yếu tố phiên mã có thể là chất hoạt hóa hoặc chất ức chế.", "d) Điều hòa ở nhân thực đơn giản hơn ở nhân sơ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: nhân thực điều hòa phức tạp hơn nhiều."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Operon lac được phát hiện ở vi khuẩn (điền tên)", "answer": "E. coli", "explain": "Operon lac là hệ thống điều hòa ở vi khuẩn E. coli."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phân giải protein có chọn lọc thuộc điều hòa ở mức (điền: trước phiên mã/sau dịch mã)", "answer": "sau dịch mã", "explain": "Sau dịch mã, protein có thể bị biến đổi hoặc phân giải có chọn lọc."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Nhóm gene cấu trúc của operon lac gồm các gene:", "options": ["A. O, Y, R", "B. R, P, O", "C. Z, Y, A", "D. Z, R, P"], "answer": "C", "explain": "Nhóm gene cấu trúc Z, Y, A mã hóa các enzyme phân giải lactose."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Trong operon lac, lactose đóng vai trò là:", "options": ["A. Chất ức chế cạnh tranh", "B. Chất ức chế", "C. Chất cảm ứng", "D. Enzyme"], "answer": "C", "explain": "Lactose là chất cảm ứng: bám vào protein ức chế làm nó biến đổi cấu hình, rời khỏi vùng O."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Gene Z trong operon lac mã hóa enzyme:", "options": ["A. Ligase", "B. Beta-galactosidase", "C. Beta-galactosidase", "D. DNA polymerase"], "answer": "C", "explain": "Gene Z mã hóa enzyme beta-galactosidase phân giải lactose thành glucose và galactose."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Ở sinh vật nhân thực, protein bám vào vùng điều hòa để tăng/giảm tốc độ phiên mã là:", "options": ["A. Anticodon", "B. Đoạn Okazaki", "C. Yếu tố phiên mã", "D. Đoạn mồi RNA"], "answer": "C", "explain": "Các yếu tố phiên mã bám vào vùng điều hòa của gene, điều chỉnh hoạt động của RNA polymerase."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Nếu vùng O bị đột biến làm protein ức chế không bám được vào, operon lac sẽ:", "options": ["A. Lactose bị phân giải nhanh", "B. Operon lac không phiên mã được", "C. Operon lac phiên mã liên tục", "D. Gene R ngừng hoạt động"], "answer": "C", "explain": "Protein ức chế không bám được vào O → không ngăn được RNA polymerase → phiên mã liên tục."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Rối loạn điều hòa các gene kiểm soát chu kì tế bào dẫn đến:", "options": ["A. Không ảnh hưởng gì", "B. Tế bào ung thư phân chia không kiểm soát", "C. Tế bào ung thư phân chia không kiểm soát", "D. Tế bào chết theo chương trình tăng"], "answer": "C", "explain": "Đột biến/rối loạn điều hòa gene tiền ung thư, gene ức chế khối u làm tế bào phân chia mất kiểm soát → ung thư."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét cấu trúc operon lac ở vi khuẩn E. coli:", "statements": ["a) Protein ức chế do gene R mã hóa.", "b) Vùng vận hành O là nơi protein ức chế bám vào.", "c) Gene Z mã hóa enzyme beta-galactosidase.", "d) Vùng P là nơi lactose bám vào."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: lactose bám vào protein ức chế."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét cơ chế hoạt động của operon lac:", "statements": ["a) Không có lactose: protein ức chế bám O → không phiên mã.", "b) Có lactose: protein ức chế rời O → phiên mã.", "c) Cơ chế này giúp tiết kiệm năng lượng cho tế bào.", "d) Operon lac phiên mã liên tục không phụ thuộc môi trường."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: operon đáp ứng theo sự có mặt của lactose."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Năm Jacob và Monod công bố mô hình operon lac là năm", "answer": "1961", "explain": "Năm 1961, Jacob và Monod phát hiện cơ chế điều hòa tổng hợp protein ở vi khuẩn E. coli (mô hình operon lac)."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phân tử RNA nhỏ tham gia phân giải mRNA hoặc ngăn dịch mã là (điền tên)", "answer": "microRNA", "explain": "microRNA điều hòa biểu hiện gene ở mức sau phiên mã."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Nhờ điều hòa biểu hiện gene, tế bào có thể:", "options": ["A. Thích ứng với sự thay đổi của môi trường", "B. Tự tổng hợp mọi chất mọi lúc", "C. Ngừng trao đổi chất", "D. Thích ứng với sự thay đổi của môi trường"], "answer": "D", "explain": "Điều hòa giúp tế bào đáp ứng linh hoạt với sự thay đổi của môi trường."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Ở sinh vật nhân sơ, điều hòa biểu hiện gene chủ yếu diễn ra ở mức:", "options": ["A. Điều hòa ở mức phiên mã", "B. Điều hòa sau dịch mã", "C. Không điều hòa", "D. Điều hòa ở mức phiên mã"], "answer": "D", "explain": "Sinh vật nhân sơ điều hòa chủ yếu ở mức phiên mã (mô hình operon)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "microRNA điều hòa gene bằng cách:", "options": ["A. Phân giải mRNA hoặc ngăn dịch mã", "B. Tổng hợp thêm mRNA", "C. Sửa chữa DNA", "D. Phân giải mRNA hoặc ngăn dịch mã"], "answer": "D", "explain": "microRNA bám vào mRNA làm phân giải mRNA hoặc ngăn cản dịch mã."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Operon lac có bao nhiêu gene cấu trúc?", "options": ["A. 1", "B. 3", "C. 6", "D. 3"], "answer": "D", "explain": "Nhóm gene cấu trúc của operon lac gồm 3 gene: Z, Y, A."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Nếu gene R bị xóa khỏi operon lac thì:", "options": ["A. Operon trở nên không đáp ứng với lactose", "B. Operon hoạt động tốt hơn", "C. Không thay đổi", "D. Operon trở nên không đáp ứng với lactose"], "answer": "D", "explain": "Mất gene R → không có protein ức chế → operon phiên mã liên tục, mất khả năng đáp ứng với lactose."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Điều hòa biểu hiện gene có vai trò quan trọng trong:", "options": ["A. Biệt hóa tế bào", "B. Tăng số NST", "C. Giảm đột biến", "D. Biệt hóa tế bào"], "answer": "D", "explain": "Các gene được bật/tắt theo chương trình tạo nên các loại tế bào khác nhau → biệt hóa."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về điều hòa biểu hiện gene:", "statements": ["a) Operon lac là ví dụ về điều hòa ở nhân sơ.", "b) Methyl hóa DNA là ví dụ về điều hòa ở nhân thực.", "c) Điều hòa gene chỉ có ở sinh vật nhân thực.", "d) Protein ức chế là một yếu tố điều hòa."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cả nhân sơ và nhân thực đều điều hòa gene. d) Đúng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét điều hòa gene ở sinh vật nhân thực:", "statements": ["a) Protein sau dịch mã có thể bị biến đổi để hoàn thiện chức năng.", "b) Protein hỏng có thể bị phân giải qua ubiquitin – proteasome.", "c) Điều hòa sau dịch mã giúp kiểm soát lượng protein hoạt động.", "d) Protein sau khi tổng hợp tồn tại vĩnh viễn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: protein có vòng đời và bị phân giải."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Sản phẩm của nhóm gene cấu trúc Z, Y, A là (điền tên)", "answer": "enzyme phân giải lactose", "explain": "Các gene Z, Y, A mã hóa các enzyme phân giải lactose."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Số vùng điều hòa (P, O) không phải gene trong operon lac là", "answer": "3", "explain": "Operon lac có 2 thành phần điều hòa không phải gene: vùng P và vùng O."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Sản phẩm của gene điều hòa R là:", "options": ["A. Protein ức chế", "B. Protein ức chế", "C. mRNA của gene Z", "D. Enzyme phân giải lactose"], "answer": "A", "explain": "Gene R tổng hợp protein ức chế – protein điều hòa hoạt động của operon."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Operon lac chỉ tổng hợp enzyme khi môi trường có lactose. Đây là kiểu điều hòa:", "options": ["A. Điều hòa cảm ứng", "B. Điều hòa âm tính liên tục", "C. Không điều hòa", "D. Điều hòa ức chế"], "answer": "A", "explain": "Operon lac là mô hình điều hòa cảm ứng: có cơ chất (lactose) thì gene mới được biểu hiện."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Sự kiện khởi đầu cho quá trình cảm ứng của operon lac là:", "options": ["A. Lactose bám vào protein ức chế", "B. Protein ức chế bám vào vùng P", "C. RNA polymerase rời khỏi gene", "D. Lactose bám vào protein ức chế"], "answer": "A", "explain": "Lactose (chất cảm ứng) bám vào protein ức chế làm nó bất hoạt, rời khỏi vùng O."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Điều hòa biểu hiện gene ở mức sau dịch mã thể hiện ở:", "options": ["A. Phân giải protein có chọn lọc", "B. Cắt intron", "C. Tổng hợp mRNA", "D. Phân giải protein có chọn lọc"], "answer": "A", "explain": "Sau dịch mã, protein có thể bị biến đổi hoặc phân giải có chọn lọc (qua ubiquitin – proteasome)."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Hậu quả của việc operon lac phiên mã liên tục là:", "options": ["A. Enzyme được tổng hợp ngay cả khi không cần, gây lãng phí", "B. Enzyme được tổng hợp ngay cả khi không cần, gây lãng phí", "C. Lactose không được sử dụng", "D. Tế bào chết ngay"], "answer": "A", "explain": "Phiên mã liên tục khi không có lactose làm tế bào tốn năng lượng tổng hợp enzyme không cần thiết."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Chất nào sau đây nếu bám chặt vào protein ức chế làm nó không rời khỏi O sẽ:", "options": ["A. Ức chế phiên mã ngay cả khi có lactose", "B. Kích hoạt phiên mã mạnh", "C. Phá hủy operon", "D. Ức chế phiên mã ngay cả khi có lactose"], "answer": "A", "explain": "Protein ức chế bám chặt vĩnh viễn vào O → RNA polymerase không trượt qua → operon bị ức chế hoàn toàn."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét cấu trúc operon lac ở vi khuẩn E. coli:", "statements": ["a) Số gene cấu trúc của operon lac là 3.", "b) Protein ức chế bám vào O khi không có lactose.", "c) Lactose là chất cảm ứng của operon lac.", "d) Khi có lactose, gene R ngừng tổng hợp protein ức chế."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: gene R vẫn tổng hợp protein ức chế, chỉ là nó bị lactose bất hoạt."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét cơ chế hoạt động của operon lac:", "statements": ["a) Vùng O trống là điều kiện để phiên mã.", "b) RNA polymerase cần bám vào vùng P để khởi đầu.", "c) Các gene cấu trúc có chung một mRNA.", "d) Mỗi gene Z, Y, A tạo một mRNA riêng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng (mRNA đa cistron). d) Sai: chung một mRNA."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Chất cảm ứng của operon lac là (điền tên chất)", "answer": "lactose", "explain": "Lactose vừa là cơ chất vừa là chất cảm ứng làm bất hoạt protein ức chế."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Sản phẩm của gene điều hòa R trong operon lac là (điền tên)", "answer": "protein ức chế", "explain": "Gene R tổng hợp protein ức chế bám vào vùng O khi không có lactose."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Ý nghĩa của điều hòa biểu hiện gene đối với tế bào là:", "options": ["A. Ngăn chặn đột biến gene", "B. Tiết kiệm năng lượng, chỉ tổng hợp protein khi cần thiết", "C. Tăng tốc độ phân chia tế bào", "D. Làm tăng số lượng gene"], "answer": "B", "explain": "Điều hòa biểu hiện gene giúp tế bào chỉ tổng hợp protein khi cần thiết, tiết kiệm năng lượng và thích ứng với môi trường."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Rối loạn điều hòa biểu hiện gene có thể dẫn đến bệnh:", "options": ["A. Bạch tạng", "B. Ung thư", "C. Down", "D. Mù màu"], "answer": "B", "explain": "Rối loạn điều hòa làm gene phân chia tế bào hoạt động quá mức → tế bào phân chia không kiểm soát → ung thư."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Ở sinh vật nhân thực, protein bám vào vùng điều hòa để điều chỉnh phiên mã là:", "options": ["A. Anticodon", "B. Yếu tố phiên mã", "C. Đoạn Okazaki", "D. Đoạn mồi RNA"], "answer": "B", "explain": "Các yếu tố phiên mã bám vào vùng điều hòa của gene, điều chỉnh hoạt động của RNA polymerase."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Trường hợp nào làm operon lac KHÔNG thể phiên mã dù có lactose?", "options": ["A. Thiếu lactose", "B. Vùng P bị đột biến", "C. Gene R bị đột biến", "D. Vùng O bị đột biến"], "answer": "B", "explain": "Vùng P là nơi RNA polymerase bám vào; P hỏng → không khởi đầu được phiên mã."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Protein ức chế đột biến không gắn được lactose nhưng vẫn bám O. Khi có lactose, operon:", "options": ["A. Chỉ phiên mã gene R", "B. Không phiên mã được nữa", "C. Vẫn phiên mã bình thường khi có lactose", "D. Phiên mã liên tục không cần lactose"], "answer": "B", "explain": "Protein ức chế vẫn bám vào O (không bị lactose bất hoạt) → tiếp tục ngăn RNA polymerase → không phiên mã."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Mối liên quan giữa điều hòa gene và ung thư là:", "options": ["A. Điều hòa gene không liên quan đến ung thư", "B. Tế bào phân chia không kiểm soát do gene điều hòa chu kì tế bào bị rối loạn", "C. Tế bào ung thư không có đột biến gene", "D. Ung thư do vi khuẩn gây ra"], "answer": "B", "explain": "Rối loạn điều hòa các gene kiểm soát chu kì tế bào làm tế bào phân chia mất kiểm soát → ung thư."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về điều hòa biểu hiện gene:", "statements": ["a) Điều hòa biểu hiện gene là điều chỉnh lượng sản phẩm của gene.", "b) Ở sinh vật nhân sơ, điều hòa chủ yếu diễn ra ở mức phiên mã.", "c) Sinh vật nhân thực chỉ điều hòa biểu hiện gene ở mức sau dịch mã.", "d) Điều hòa biểu hiện gene giúp tế bào thích ứng với môi trường."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng (mô hình operon). c) Sai: nhân thực điều hòa ở nhiều mức. d) Đúng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét điều hòa gene ở sinh vật nhân thực:", "statements": ["a) Methyl hóa DNA thường làm giảm mức phiên mã của gene.", "b) Các yếu tố phiên mã bám vào vùng điều hòa để điều chỉnh phiên mã.", "c) microRNA có thể phân giải mRNA hoặc ngăn cản dịch mã.", "d) Sau khi protein được tổng hợp thì không còn cơ chế điều hòa nào nữa."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: còn điều hòa sau dịch mã."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Protein ức chế của operon lac bám vào thành phần nào khi không có lactose (điền tên)", "answer": "vùng O", "explain": "Khi không có lactose, protein ức chế bám vào vùng vận hành O."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Biến đổi histone làm NST tháo xoắn, tăng phiên mã là (điền tên)", "answer": "acetyl hóa histone", "explain": "Acetyl hóa histone làm NST tháo xoắn → gene dễ phiên mã."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Protein ức chế bám vào thành phần nào của operon lac?", "options": ["A. Vùng khởi động P", "B. Gene điều hòa R", "C. Vùng vận hành O", "D. Gene cấu trúc A"], "answer": "C", "explain": "Protein ức chế bám vào vùng vận hành O, ngăn cản RNA polymerase trượt qua."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Khi môi trường có lactose, operon lac sẽ:", "options": ["A. Bị ức chế hoàn toàn", "B. Chỉ phiên mã gene R", "C. Phiên mã tạo enzyme phân giải lactose", "D. Bị phân giải"], "answer": "C", "explain": "Lactose làm bất hoạt protein ức chế → RNA polymerase phiên mã các gene Z, Y, A tạo enzyme phân giải lactose."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Sản phẩm của các gene cấu trúc Z, Y, A trong operon lac là:", "options": ["A. Protein ức chế", "B. RNA polymerase", "C. Enzyme phân giải lactose", "D. Đoạn mồi RNA"], "answer": "C", "explain": "Các gene Z, Y, A mã hóa các enzyme tham gia phân giải lactose."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Phân tử RNA nào tham gia điều hòa biểu hiện gene ở mức sau phiên mã?", "options": ["A. tRNA", "B. rRNA", "C. microRNA", "D. Đoạn mồi RNA"], "answer": "C", "explain": "microRNA có thể bám vào mRNA làm phân giải mRNA hoặc ngăn cản dịch mã."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Nếu vùng P (promoter) bị đột biến mất chức năng, operon lac sẽ:", "options": ["A. Operon lac phiên mã liên tục", "B. Protein ức chế không được tổng hợp", "C. Operon lac không thể phiên mã dù có lactose", "D. Lactose không vào được tế bào"], "answer": "C", "explain": "Vùng P là nơi RNA polymerase bám vào; P hỏng → không khởi đầu được phiên mã."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Đột biến làm gene R tạo protein ức chế siêu hoạt động (bám O chặt hơn, vẫn bị lactose bất hoạt). Khi có lactose:", "options": ["A. Operon chỉ phiên mã khi có lactose như bình thường", "B. Operon không bao giờ phiên mã", "C. Operon chỉ phiên mã khi có lactose như bình thường", "D. Operon phiên mã liên tục"], "answer": "C", "explain": "Protein ức chế vẫn bị lactose bất hoạt bình thường nên cơ chế cảm ứng không đổi."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét cấu trúc operon lac ở vi khuẩn E. coli:", "statements": ["a) Operon lac gồm R, P, O và nhóm gene Z, Y, A.", "b) Vùng O nằm giữa P và nhóm gene cấu trúc.", "c) Gene R nằm ngoài operon nhưng điều hòa operon.", "d) Mỗi gene Z, Y, A có promoter riêng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cả nhóm gene chung một promoter P."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét cơ chế hoạt động của operon lac:", "statements": ["a) Chất cảm ứng của operon lac là lactose.", "b) Protein ức chế bị bất hoạt khi gắn với lactose.", "c) RNA polymerase chỉ trượt qua được khi vùng O trống.", "d) Khi hết lactose, operon tự động phiên mã trở lại."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: hết lactose, protein ức chế bám lại vào O → ngừng phiên mã."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Khi môi trường có lactose, protein ức chế của operon lac sẽ (điền: bám vào / rời khỏi) vùng O", "answer": "rời khỏi", "explain": "Lactose (chất cảm ứng) làm protein ức chế biến đổi cấu hình, rời khỏi vùng O → operon được phiên mã."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cơ chế làm NST đóng xoắn, giảm phiên mã ở nhân thực là (điền tên)", "answer": "methyl hóa DNA", "explain": "Methyl hóa DNA làm NST đóng xoắn chặt → RNA polymerase khó tiếp cận → giảm phiên mã."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Điều hòa biểu hiện của gene là:", "options": ["A. Thay đổi cấu trúc của gene", "B. Loại bỏ gene khỏi tế bào", "C. Điều chỉnh lượng sản phẩm của gene", "D. Điều chỉnh lượng sản phẩm của gene"], "answer": "D", "explain": "Điều hòa biểu hiện gene là điều chỉnh lượng RNA/protein được tạo ra từ gene."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Mô hình operon lac được công bố năm:", "options": ["A. 1961", "B. 1958", "C. 1953", "D. 1961"], "answer": "D", "explain": "Năm 1961, Jacob và Monod công bố mô hình operon lac."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Methyl hóa DNA thường có tác dụng:", "options": ["A. Kích hoạt phiên mã", "B. Không ảnh hưởng", "C. Ức chế phiên mã", "D. Ức chế phiên mã"], "answer": "D", "explain": "Methyl hóa DNA thường làm NST đóng xoắn → ức chế phiên mã."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Khi có lactose, protein ức chế sẽ:", "options": ["A. Bám chặt vào vùng O", "B. Bị phân giải hoàn toàn", "C. Rời khỏi vùng O", "D. Rời khỏi vùng O"], "answer": "D", "explain": "Lactose làm protein ức chế biến đổi cấu hình, rời khỏi vùng O."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Operon lac bị kẹt ở trạng thái phiên mã liên tục gây hậu quả:", "options": ["A. Tế bào chết ngay lập tức", "B. Không ảnh hưởng", "C. Tốn năng lượng tổng hợp enzyme không cần thiết", "D. Tốn năng lượng tổng hợp enzyme không cần thiết"], "answer": "D", "explain": "Tổng hợp enzyme phân giải lactose khi không có lactose gây lãng phí năng lượng."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Khi gene ức chế khối u (ví dụ p53) bị đột biến mất chức năng thì:", "options": ["A. Tế bào khỏe mạnh hơn", "B. Chu kì tế bào bình thường", "C. Gene ức chế khối u bị bất hoạt", "D. Gene ức chế khối u bị bất hoạt"], "answer": "D", "explain": "Mất chức năng gene ức chế khối u → tế bào mất kiểm soát phân chia → hình thành khối u."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về điều hòa biểu hiện gene:", "statements": ["a) Điều hòa gene giúp tiết kiệm năng lượng.", "b) Rối loạn điều hòa gene có thể gây ung thư.", "c) Điều hòa gene làm thay đổi cấu trúc của gene.", "d) Biệt hóa tế bào liên quan đến điều hòa biểu hiện gene."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: điều hòa chỉ thay đổi lượng sản phẩm, không đổi cấu trúc gene. d) Đúng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét điều hòa gene ở sinh vật nhân thực:", "statements": ["a) Cắt nối mRNA là một mức điều hòa sau phiên mã.", "b) Một gene có thể tạo nhiều loại protein nhờ cắt nối khác nhau.", "c) microRNA tham gia điều hòa sau phiên mã.", "d) Mọi tiền mRNA đều được chế biến giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng (cắt nối chọn lọc). c) Đúng. d) Sai: có cắt nối chọn lọc tạo mRNA khác nhau."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Operon lac là mô hình điều hòa (điền: cảm ứng/ức chế)", "answer": "cảm ứng", "explain": "Operon lac là điều hòa cảm ứng: có lactose mới phiên mã."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Enzyme do gene Z của operon lac mã hóa là (điền tên)", "answer": "beta-galactosidase", "explain": "Gene Z mã hóa enzyme beta-galactosidase phân giải lactose."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "RNA polymerase bám vào thành phần nào để khởi đầu phiên mã operon lac?", "options": ["A. Promoter (P)", "B. Gene cấu trúc Z", "C. Vùng vận hành O", "D. Gene điều hòa R"], "answer": "A", "explain": "Vùng khởi động P (promoter) là nơi RNA polymerase nhận biết và bám vào."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Mô hình operon lac được phát hiện bởi:", "options": ["A. Jacob và Monod", "B. Meselson và Stahl", "C. Watson và Crick", "D. Jacob và Monod"], "answer": "A", "explain": "Năm 1961, Jacob và Monod phát hiện cơ chế điều hòa operon lac ở vi khuẩn E. coli."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Khi protein ức chế rời khỏi vùng O thì:", "options": ["A. Các gene Z, Y, A đồng loạt phiên mã", "B. Gene R ngừng phiên mã", "C. Các gene Z, Y, A đồng loạt phiên mã", "D. Operon bị ức chế hoàn toàn"], "answer": "A", "explain": "Vùng O trống → RNA polymerase trượt qua → các gene cấu trúc đồng loạt phiên mã."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Nhận định đúng về biến đổi histone là:", "options": ["A. Acetyl hóa histone làm NST tháo xoắn, gene dễ phiên mã", "B. Histone không ảnh hưởng phiên mã", "C. Acetyl hóa histone làm NST đóng xoắn chặt", "D. Methyl hóa luôn kích hoạt gene"], "answer": "A", "explain": "Acetyl hóa histone làm NST tháo xoắn → RNA polymerase dễ tiếp cận gene → tăng phiên mã."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Nếu protein ức chế bị đột biến không còn gắn được với lactose (nhưng vẫn bám O), khi có lactose operon sẽ:", "options": ["A. Protein ức chế luôn bám vào O, operon không phiên mã", "B. Chỉ phiên mã gene R", "C. Phiên mã bình thường", "D. Phiên mã liên tục"], "answer": "A", "explain": "Protein ức chế không bị lactose bất hoạt → vẫn bám O → ngăn RNA polymerase → không phiên mã."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Điều hòa biểu hiện gene trong phát triển cá thể đảm bảo:", "options": ["A. Gene chỉ biểu hiện ở đúng loại tế bào cần thiết", "B. Gene hoạt động ngẫu nhiên", "C. Gene chỉ biểu hiện ở đúng loại tế bào cần thiết", "D. Mọi gene hoạt động ở mọi tế bào"], "answer": "A", "explain": "Điều hòa giúp các gene chỉ biểu hiện đúng lúc, đúng nơi (đúng loại tế bào) trong quá trình phát triển."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét cấu trúc operon lac ở vi khuẩn E. coli:", "statements": ["a) Operon là cụm gene có chung cơ chế điều hòa.", "b) Nhóm gene cấu trúc được phiên mã đồng thời.", "c) Gene điều hòa R cũng thuộc operon lac.", "d) Vùng khởi động P giúp RNA polymerase nhận biết."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: gene R nằm ngoài operon. d) Đúng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét cơ chế hoạt động của operon lac:", "statements": ["a) Lactose vừa là cơ chất vừa là chất cảm ứng.", "b) Enzyme do gene Z mã hóa phân giải lactose.", "c) Khi lactose cạn kiệt, operon bị ức chế trở lại.", "d) Protein ức chế được tổng hợp chỉ khi có lactose."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: gene R tổng hợp protein ức chế liên tục."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Nhóm gene cấu trúc của operon lac gồm các gene (kể tên)", "answer": "Z, Y, A", "explain": "Nhóm gene cấu trúc gồm 3 gene Z, Y, A mã hóa enzyme phân giải lactose."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Protein bám vào vùng điều hòa để tăng/giảm tốc độ phiên mã là (điền tên)", "answer": "yếu tố phiên mã", "explain": "Các yếu tố phiên mã điều chỉnh hoạt động của RNA polymerase."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Điều hòa biểu hiện gene có vai trò trong:", "options": ["A. Phát triển bình thường của cơ thể", "B. Phát triển bình thường của cơ thể", "C. Tăng số lượng NST", "D. Ngăn cản tiến hóa"], "answer": "B", "explain": "Điều hòa đảm bảo các gene hoạt động đúng chương trình → cơ thể phát triển bình thường."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Ở sinh vật nhân thực, điều hòa biểu hiện gene diễn ra ở:", "options": ["A. Một mức duy nhất", "B. Nhiều mức độ", "C. Nhiều mức độ", "D. Không điều hòa"], "answer": "B", "explain": "Nhân thực điều hòa ở nhiều mức: trước, trong, sau phiên mã và sau dịch mã."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Methyl hóa DNA và biến đổi histone thuộc điều hòa ở mức:", "options": ["A. Trước phiên mã", "B. Trước phiên mã", "C. Sau dịch mã", "D. Trong dịch mã"], "answer": "B", "explain": "Methyl hóa DNA, biến đổi histone làm thay đổi cấu trúc NST → điều hòa trước phiên mã."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Khi vùng O trống (không có protein ức chế), điều gì xảy ra?", "options": ["A. RNA polymerase trượt qua các gene Z, Y, A", "B. RNA polymerase trượt qua các gene Z, Y, A", "C. Gene R ngừng hoạt động", "D. Lactose bị đẩy ra ngoài"], "answer": "B", "explain": "Vùng O trống → RNA polymerase trượt qua → phiên mã các gene cấu trúc."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Để operon lac phiên mã, điều kiện cần là:", "options": ["A. Cần có lactose để bất hoạt protein ức chế", "B. Cần có lactose để bất hoạt protein ức chế", "C. Cần loại bỏ gene R", "D. Cần đột biến vùng P"], "answer": "B", "explain": "Lactose bất hoạt protein ức chế → vùng O trống → RNA polymerase phiên mã."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hoạt động của operon lac chịu ảnh hưởng trực tiếp của:", "options": ["A. Tín hiệu từ môi trường", "B. Tín hiệu từ môi trường", "C. Số lượng NST", "D. Kích thước tế bào"], "answer": "B", "explain": "Sự có mặt của lactose (tín hiệu môi trường) quyết định operon lac hoạt động hay bị ức chế."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về điều hòa biểu hiện gene:", "statements": ["a) Lượng mRNA tạo ra phản ánh mức biểu hiện của gene.", "b) Điều hòa âm tính: protein ức chế ngăn phiên mã.", "c) Điều hòa dương tính: protein hoạt hóa tăng phiên mã.", "d) Operon lac không có yếu tố điều hòa nào."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: có protein ức chế (điều hòa âm tính)."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét điều hòa gene ở sinh vật nhân thực:", "statements": ["a) Điều hòa gene ở nhân thực diễn ra ở nhiều mức.", "b) Biệt hóa tế bào nhờ các gene biểu hiện khác nhau.", "c) Rối loạn điều hòa có thể gây bệnh.", "d) Nhân thực không có cơ chế điều hòa trước phiên mã."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: có (methyl hóa, biến đổi histone)."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Khi không có lactose, các gene cấu trúc của operon lac sẽ (điền: phiên mã/không phiên mã)", "answer": "không phiên mã", "explain": "Protein ức chế bám vào O → RNA polymerase không trượt qua → không phiên mã."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Hai nhà khoa học phát hiện operon lac là (điền tên)", "answer": "Jacob và Monod", "explain": "Năm 1961, Jacob và Monod công bố mô hình operon lac."}]}]}
