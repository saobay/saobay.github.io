 kháng protein Bt nếu trồng đại trà không có biện pháp quản lí (vùng trú ẩn)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Vi khuẩn không nhận được plasmid khi nuôi trên môi trường có ampicillin sẽ:", "options": ["A. Tế bào chết trên môi trường có ampicillin", "B. Sống bình thường", "C. Tự tạo plasmid", "D. Tế bào chết trên môi trường có ampicillin"], "answer": "D", "explain": "Không có gene kháng ampicillin → vi khuẩn bị ampicillin tiêu diệt."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Enzyme cắt giới hạn cắt DNA tại:", "options": ["A. Trình tự nhận biết của enzyme", "B. Vị trí ngẫu nhiên", "C. Đầu 5′ của DNA", "D. Trình tự nhận biết của enzyme"], "answer": "D", "explain": "Mỗi enzyme cắt giới hạn nhận biết và cắt tại một trình tự nucleotide đặc hiệu (thường đối xứng)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cừu chuyển gene có thể được dùng để:", "options": ["A. Sản xuất thuốc trong sữa", "B. Chạy nhanh hơn", "C. Ăn ít hơn", "D. Sản xuất thuốc trong sữa"], "answer": "D", "explain": "Cừu chuyển gene sản xuất protein thuốc quý trong sữa (nhà máy sinh học)."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét ứng dụng của công nghệ di truyền:", "statements": ["a) Cừu chuyển gene sản xuất protein thuốc trong sữa.", "b) Cá hồi chuyển gene lớn nhanh.", "c) Liệu pháp gene hứa hẹn chữa bệnh di truyền.", "d) Công nghệ di truyền không liên quan đến y học."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ứng dụng y học rất lớn."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét vấn đề an toàn sinh học của công nghệ di truyền:", "statements": ["a) An toàn sinh học là hệ thống quy định về sinh vật chuyển gene.", "b) Thực phẩm biến đổi gene phải được dán nhãn ở nhiều nước.", "c) Không cần quản lí việc nhập khẩu giống chuyển gene.", "d) Đạo đức sinh học cấm tạo người chuyển gene."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cần quản lí chặt. d) Đúng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Năm công bố mô hình operon lac là năm", "answer": "1961", "explain": "Năm 1961, Jacob và Monod công bố operon lac."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cấm tạo người chuyển gene là vấn đề (điền: đạo đức/kĩ thuật)", "answer": "đạo đức", "explain": "Tạo người chuyển gene bị cấm vì lí do đạo đức."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Phân tử DNA mang gene cần chuyển trong công nghệ di truyền được gọi là:", "options": ["A. Thể truyền (vector)", "B. Thể truyền (vector)", "C. Đoạn mồi", "D. DNA khuôn"], "answer": "A", "explain": "Vector (thường là plasmid) mang gene cần chuyển vào tế bào nhận."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Vi khuẩn thường dùng làm tế bào chủ nhận DNA tái tổ hợp là:", "options": ["A. E. coli", "B. Agrobacterium tumefaciens", "C. Bacillus thuringiensis", "D. E. coli"], "answer": "A", "explain": "E. coli sinh sản nhanh, dễ nuôi cấy, dễ chuyển nạp plasmid → tế bào chủ lí tưởng."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Ưu điểm của plasmid làm vector là:", "options": ["A. Plasmid có khả năng tự nhân đôi độc lập", "B. Plasmid rất lớn", "C. Plasmid không vào được tế bào", "D. Plasmid có khả năng tự nhân đôi độc lập"], "answer": "A", "explain": "Plasmid tự nhân đôi độc lập với NST → nhân nhanh số bản sao của gene được chuyển."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cây trồng chuyển gene nào sau đây chịu được thuốc trừ cỏ?", "options": ["A. Đậu tương chịu thuốc trừ cỏ", "B. Lúa thường", "C. Ngô thường", "D. Đậu tương chịu thuốc trừ cỏ"], "answer": "A", "explain": "Đậu tương chuyển gene kháng thuốc trừ cỏ giúp diệt cỏ dại mà không hại cây trồng."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Công nghệ di truyền góp phần vào y học qua:", "options": ["A. Chẩn đoán nhanh bệnh di truyền", "B. Thay thế bác sĩ", "C. Không cần bệnh viện", "D. Chẩn đoán nhanh bệnh di truyền"], "answer": "A", "explain": "Kĩ thuật DNA tái tổ hợp giúp chẩn đoán nhanh, chính xác nhiều bệnh di truyền."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Để tìm hiểu chức năng một gene, nhà khoa học có thể:", "options": ["A. Nghiên cứu chức năng gene bằng cách bất hoạt gene", "B. Xóa toàn bộ hệ gene", "C. Không thể nghiên cứu", "D. Nghiên cứu chức năng gene bằng cách bất hoạt gene"], "answer": "A", "explain": "Tạo sinh vật chuyển gene bất hoạt gene mục tiêu (knockout) để quan sát hậu quả → suy ra chức năng gene."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét kĩ thuật tạo DNA tái tổ hợp:", "statements": ["a) Các bước: tách – cắt – nối – chuyển – chọn lọc.", "b) Enzyme cắt giới hạn có nguồn gốc từ vi khuẩn.", "c) Mỗi enzyme cắt tại trình tự đặc hiệu riêng.", "d) Ligase cắt DNA thành các đoạn nhỏ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ligase nối, không cắt."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các bước tạo và chọn lọc tế bào mang DNA tái tổ hợp:", "statements": ["a) DNA tái tổ hợp tồn tại độc lập với NST tế bào chủ.", "b) Plasmid nhân đôi cùng với sự phân chia tế bào.", "c) Gene trên plasmid được phiên mã, dịch mã bình thường.", "d) Tế bào chủ phải là tế bào thực vật."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: thường là vi khuẩn."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Kháng sinh thường dùng trong gene đánh dấu chọn lọc là (điền tên)", "answer": "ampicillin", "explain": "Gene kháng ampicillin là gene đánh dấu phổ biến trên vector."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phương pháp bắn hạt kim loại phủ DNA vào tế bào thực vật là (điền tên)", "answer": "súng bắn gene", "explain": "Súng bắn gene đưa trực tiếp DNA vào tế bào thực vật."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Sinh vật chuyển gene là:", "options": ["A. Sinh vật đa bội", "B. Sinh vật mang gene của loài khác được chuyển vào", "C. Sinh vật bị đột biến tự nhiên", "D. Sinh vật lai giữa hai loài"], "answer": "B", "explain": "Sinh vật chuyển gene là sinh vật mang gene của loài khác được chuyển vào bằng kĩ thuật di truyền."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Giống cây chuyển gene giàu vitamin A (tiền vitamin A) là:", "options": ["A. Đậu xanh", "B. Lúa vàng giàu vitamin A", "C. Lúa tẻ thường", "D. Ngô đường"], "answer": "B", "explain": "Lúa vàng được chuyển gene tổng hợp beta-carotene (tiền vitamin A) giúp chống thiếu vitamin A."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Rủi ro sinh thái của cây trồng chuyển gene là:", "options": ["A. Sinh vật chuyển gene không sinh sản", "B. Gene chuyển có thể phát tán ra môi trường qua lai với loài hoang dại", "C. Cây chuyển gene luôn chết", "D. Gene chuyển không bao giờ biểu hiện"], "answer": "B", "explain": "Gene chuyển (ví dụ gene kháng thuốc trừ cỏ) có thể phát tán qua phấn hoa, lai với loài hoang dại tạo cỏ dại kháng thuốc."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Plasmid vector mang gene kháng ampicillin được chuyển vào vi khuẩn. Tế bào nhận thành công plasmid sẽ:", "options": ["A. Gene cần chuyển không biểu hiện", "B. Tế bào nhận plasmid sẽ có khả năng kháng kháng sinh đó", "C. Tế bào nhận plasmid sẽ chết", "D. Plasmid không nhân đôi trong tế bào chủ"], "answer": "B", "explain": "Gene đánh dấu kháng ampicillin giúp nhận biết tế bào đã nhận plasmid: chúng sống được trên môi trường có ampicillin."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Vì sao phải dùng cùng một loại enzyme cắt giới hạn để cắt cả DNA cho và plasmid vector?", "options": ["A. Để cắt được nhiều loại DNA", "B. Để tạo đầu cắt tương thích giữa DNA cho và vector", "C. Để tiết kiệm enzyme", "D. Để tăng nhiệt độ phản ứng"], "answer": "B", "explain": "Cùng một enzyme tạo ra các đầu cắt tương thích (đầu dính bổ sung nhau) thì ligase mới nối được DNA cho với vector."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Phương pháp tạo động vật chuyển gene phổ biến là:", "options": ["A. Nhân bản vô tính", "B. Chuyển gene trực tiếp vào tế bào trứng đã thụ tinh rồi cấy vào tử cung", "C. Lai hai giống vật nuôi", "D. Gây đột biến bằng hóa chất"], "answer": "B", "explain": "Tiêm DNA (mang gene cần chuyển) vào nhân của tế bào trứng đã thụ tinh, rồi cấy phôi vào tử cung con cái."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét ứng dụng của công nghệ di truyền:", "statements": ["a) Insulin điều trị tiểu đường được sản xuất bằng công nghệ di truyền.", "b) Cây bông chuyển gene Bt có khả năng kháng sâu bệnh.", "c) Công nghệ di truyền chỉ ứng dụng trong y học.", "d) Vi sinh vật chuyển gene có thể dùng để xử lí ô nhiễm môi trường."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: còn nông nghiệp, môi trường, nghiên cứu. d) Đúng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét vấn đề an toàn sinh học của công nghệ di truyền:", "statements": ["a) Gene chuyển có thể phát tán ra môi trường qua lai với loài hoang dại.", "b) Sinh vật chuyển gene cần được đánh dấu và quản lí chặt chẽ.", "c) Được phép tạo người chuyển gene vì mục đích nghiên cứu.", "d) Cần đánh giá an toàn thực phẩm biến đổi gene trước khi sử dụng."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cấm tạo người chuyển gene vì lí do đạo đức. d) Đúng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Chế phẩm insulin tái tổ hợp đầu tiên được sản xuất ở vật chủ là (điền tên)", "answer": "vi khuẩn E. coli", "explain": "Insulin người tái tổ hợp đầu tiên được sản xuất ở vi khuẩn E. coli."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Hệ thống quy định về sinh vật chuyển gene là (điền tên)", "answer": "an toàn sinh học", "explain": "An toàn sinh học quản lí nghiên cứu, sử dụng sinh vật chuyển gene."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Thể truyền (vector) thường dùng trong kĩ thuật tạo DNA tái tổ hợp là:", "options": ["A. NST thường", "B. Plasmid", "C. Plasmid", "D. Ti thể"], "answer": "C", "explain": "Plasmid của vi khuẩn là vector phổ biến: nhỏ, dễ tách, có khả năng tự nhân đôi."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Gene đánh dấu thường dùng để chọn lọc tế bào nhận DNA tái tổ hợp là:", "options": ["A. Gene mã hóa insulin", "B. Gene kháng kháng sinh", "C. Gene kháng kháng sinh", "D. Gene điều hòa R"], "answer": "C", "explain": "Tế bào nhận được plasmid mang gene kháng kháng sinh sẽ sống được trên môi trường có kháng sinh."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Chế phẩm y học đầu tiên được sản xuất bằng công nghệ di truyền là:", "options": ["A. Hemoglobin", "B. Keratin", "C. Insulin", "D. Collagen"], "answer": "C", "explain": "Insulin người tái tổ hợp (sản xuất ở vi khuẩn E. coli) là dược phẩm công nghệ di truyền đầu tiên."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Chế phẩm nào sau đây được sản xuất bằng công nghệ di truyền?", "options": ["A. Thuốc kháng sinh penicillin", "B. Vitamin C", "C. Vaccine viêm gan B", "D. Thuốc giảm đau aspirin"], "answer": "C", "explain": "Vaccine viêm gan B tái tổ hợp được sản xuất bằng công nghệ di truyền."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Ứng dụng công nghệ di truyền giúp nông nghiệp ứng phó biến đổi khí hậu là:", "options": ["A. Cây chuyển gene chịu hạn, chịu mặn", "B. Tăng diện tích đất", "C. Cây chuyển gene chịu hạn, chịu mặn", "D. Giảm lượng mưa"], "answer": "C", "explain": "Cây chuyển gene chịu hạn, chịu mặn, chịu ngập giúp canh tác ở vùng khó khăn."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hướng ứng dụng công nghệ di truyền để chữa bệnh di truyền là:", "options": ["A. Liệu pháp gene chữa bệnh di truyền", "B. Cắt bỏ gene bệnh bằng phẫu thuật", "C. Liệu pháp gene chữa bệnh di truyền", "D. Uống thuốc kháng sinh"], "answer": "C", "explain": "Liệu pháp gene đưa gene lành vào tế bào bệnh nhân để chữa bệnh di truyền."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét kĩ thuật tạo DNA tái tổ hợp:", "statements": ["a) DNA tái tổ hợp gồm đoạn DNA cho nối với vector.", "b) Ligase nối đoạn DNA cho với plasmid.", "c) Tế bào chủ thường là vi khuẩn E. coli.", "d) Không cần chọn lọc sau khi chuyển DNA."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cần chọn lọc tế bào đã nhận DNA."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các bước tạo và chọn lọc tế bào mang DNA tái tổ hợp:", "statements": ["a) Chuyển DNA vào tế bào có thể bằng xung điện.", "b) Tế bào nhận plasmid kháng ampicillin sống được trên môi trường có ampicillin.", "c) Tế bào không nhận plasmid vẫn sống tốt trên môi trường có ampicillin.", "d) Sau chọn lọc, nuôi cấy để nhân số lượng tế bào."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: bị ampicillin tiêu diệt. d) Đúng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Vector thường dùng trong tạo DNA tái tổ hợp là (điền tên)", "answer": "plasmid", "explain": "Plasmid của vi khuẩn là vector phổ biến."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cây bông kháng sâu được chuyển gene có tên viết tắt là", "answer": "Bt", "explain": "Gene Bt từ vi khuẩn Bacillus thuringiensis tạo protein diệt sâu."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Kĩ thuật tạo DNA tái tổ hợp thuộc:", "options": ["A. Kĩ thuật lai", "B. Kĩ thuật nuôi cấy mô", "C. Kĩ thuật di truyền", "D. Kĩ thuật di truyền"], "answer": "D", "explain": "Tạo DNA tái tổ hợp là kĩ thuật nền tảng của công nghệ di truyền."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Gene Bt trong cây trồng chuyển gene kháng sâu có nguồn gốc từ vi khuẩn:", "options": ["A. E. coli", "B. Agrobacterium tumefaciens", "C. Bacillus thuringiensis", "D. Bacillus thuringiensis"], "answer": "D", "explain": "Gene Bt từ vi khuẩn Bacillus thuringiensis tạo protein diệt sâu đục thân."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Nguy cơ của việc lạm dụng cây trồng chuyển gene là:", "options": ["A. Tăng đa dạng sinh học", "B. Không ảnh hưởng", "C. Mất đa dạng sinh học", "D. Mất đa dạng sinh học"], "answer": "D", "explain": "Lạm dụng một vài giống chuyển gene có thể làm mất dần các giống địa phương → giảm đa dạng sinh học."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Gene kháng kháng sinh trên vector được gọi là:", "options": ["A. Gene cấu trúc", "B. Gene điều hòa", "C. Gene đánh dấu", "D. Gene đánh dấu"], "answer": "D", "explain": "Gene đánh dấu (marker) giúp nhận biết và chọn lọc tế bào đã nhận DNA tái tổ hợp."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Nếu cắt DNA cho và vector bằng hai enzyme khác nhau thì:", "options": ["A. Vẫn nối bình thường", "B. Tạo DNA dài hơn", "C. Ligase không nối được hai đầu không tương thích", "D. Ligase không nối được hai đầu không tương thích"], "answer": "D", "explain": "Hai enzyme khác nhau tạo đầu cắt khác nhau → không tương thích → ligase không nối được."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Động vật chuyển gene nào sau đây lớn nhanh hơn bình thường?", "options": ["A. Gà thường", "B. Vịt thường", "C. Cá hồi chuyển gene tăng trưởng nhanh", "D. Cá hồi chuyển gene tăng trưởng nhanh"], "answer": "D", "explain": "Cá hồi chuyển gene hormone tăng trưởng lớn nhanh gấp nhiều lần cá thường."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét ứng dụng của công nghệ di truyền:", "statements": ["a) Hormone tăng trưởng được sản xuất ở vi sinh vật chuyển gene.", "b) Kháng thể đơn dòng điều trị ung thư.", "c) Động vật chuyển gene cho năng suất cao.", "d) Công nghệ di truyền chỉ tạo ra vi sinh vật."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cả thực vật, động vật."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét vấn đề an toàn sinh học của công nghệ di truyền:", "statements": ["a) Lạm dụng giống chuyển gene có thể giảm đa dạng sinh học.", "b) Gene kháng thuốc trừ cỏ có thể lan sang cỏ dại.", "c) Mọi sinh vật chuyển gene đều an toàn tuyệt đối.", "d) Cần nghiên cứu đánh giá rủi ro trước khi thả ra môi trường."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cần đánh giá từng trường hợp. d) Đúng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Giống lúa chuyển gene giàu tiền vitamin A là (điền tên)", "answer": "lúa vàng", "explain": "Lúa vàng được chuyển gene tổng hợp beta-carotene."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Rủi ro sức khỏe cần đánh giá ở thực phẩm chuyển gene là (điền tên)", "answer": "dị ứng", "explain": "Cần đánh giá khả năng gây dị ứng, độc tính của protein mới."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Phân tử DNA tạo ra bằng cách nối đoạn DNA của tế bào cho với DNA của thể truyền được gọi là:", "options": ["A. DNA tái tổ hợp", "B. Đoạn Okazaki", "C. DNA khuôn", "D. DNA tái tổ hợp"], "answer": "A", "explain": "DNA tái tổ hợp = đoạn DNA cho + vector, là sản phẩm trung gian của công nghệ di truyền."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Phương pháp đưa trực tiếp DNA vào tế bào thực vật là:", "options": ["A. Súng bắn gene", "B. Gây đột biến", "C. Súng bắn gene", "D. Lai hữu tính"], "answer": "A", "explain": "Súng bắn gene bắn các hạt kim loại phủ DNA vào tế bào thực vật."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Sau khi chuyển DNA tái tổ hợp vào vi khuẩn, cần làm gì tiếp theo?", "options": ["A. Tế bào nhận DNA tái tổ hợp", "B. Chuyển tiếp sang tế bào khác", "C. Tế bào nhận DNA tái tổ hợp", "D. Tiêu diệt tất cả vi khuẩn"], "answer": "A", "explain": "Cần chọn lọc các tế bào đã nhận được DNA tái tổ hợp (nhờ gene đánh dấu)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Chế phẩm y học nào sau đây sản xuất bằng công nghệ di truyền?", "options": ["A. Hormone tăng trưởng", "B. Adrenaline tổng hợp hóa học", "C. Hormone tăng trưởng", "D. Cortisol tự nhiên"], "answer": "A", "explain": "Hormone tăng trưởng người tái tổ hợp được sản xuất ở vi sinh vật chuyển gene."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Ứng dụng của động vật chuyển gene trong y học là:", "options": ["A. Sản xuất protein quý trong sữa động vật chuyển gene", "B. Cưỡi ngựa nhanh hơn", "C. Sản xuất protein quý trong sữa động vật chuyển gene", "D. Lấy thịt nhiều hơn"], "answer": "A", "explain": "Cừu, dê chuyển gene sản xuất protein thuốc quý (kháng thể, yếu tố đông máu) trong sữa."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ứng dụng công nghiệp của vi sinh vật chuyển gene là:", "options": ["A. Sản xuất enzyme công nghiệp", "B. Khai thác dầu mỏ", "C. Sản xuất enzyme công nghiệp", "D. Sản xuất thép"], "answer": "A", "explain": "Vi sinh vật chuyển gene sản xuất enzyme (protease, amylase...) cho công nghiệp thực phẩm, dệt may."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét kĩ thuật tạo DNA tái tổ hợp:", "statements": ["a) Plasmid có khả năng tự nhân đôi độc lập.", "b) Gene đánh dấu giúp chọn lọc tế bào nhận.", "c) DNA tái tổ hợp được nhân lên cùng tế bào chủ.", "d) Vector không thể mang gene của loài khác."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: vector mang gene được chuyển."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các bước tạo và chọn lọc tế bào mang DNA tái tổ hợp:", "statements": ["a) Hiệu suất chuyển nạp plasmid vào tế bào không đạt 100%.", "b) Cần gene đánh dấu để phân biệt tế bào nhận/không nhận.", "c) Mọi plasmid đều tự chui vào tế bào.", "d) Tế bào nhận thành công truyền plasmid cho thế hệ sau."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cần phương pháp chuyển nạp. d) Đúng (plasmid tự nhân đôi)."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Vi khuẩn thường làm tế bào chủ là (điền tên)", "answer": "E. coli", "explain": "E. coli sinh sản nhanh, dễ chuyển nạp plasmid."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Chế phẩm y học đầu tiên từ công nghệ di truyền là (điền tên)", "answer": "insulin", "explain": "Insulin người tái tổ hợp sản xuất ở E. coli."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Tế bào nhận DNA tái tổ hợp được gọi là:", "options": ["A. Tế bào chủ (tế bào nhận)", "B. Tế bào chủ (tế bào nhận)", "C. Tế bào cho", "D. Tế bào chết"], "answer": "B", "explain": "Tế bào chủ (tế bào nhận) tiếp nhận DNA tái tổ hợp và biểu hiện gene được chuyển."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Trước khi lưu hành, thực phẩm biến đổi gene cần:", "options": ["A. Đánh giá an toàn thực phẩm biến đổi gene", "B. Đánh giá an toàn thực phẩm biến đổi gene", "C. Không cần kiểm tra", "D. Cấm tuyệt đối mọi trường hợp"], "answer": "B", "explain": "Thực phẩm biến đổi gene phải được đánh giá an toàn (độc tính, dị ứng...) trước khi sử dụng."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Rủi ro sức khỏe cần đánh giá ở thực phẩm biến đổi gene là:", "options": ["A. Dị ứng thực phẩm", "B. Dị ứng thực phẩm", "C. Tăng chiều cao", "D. Giảm cân"], "answer": "B", "explain": "Protein mới trong thực phẩm chuyển gene cần được đánh giá khả năng gây dị ứng, độc tính."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Người ta phân biệt được tế bào đã nhận DNA tái tổ hợp nhờ:", "options": ["A. Dựa vào gene đánh dấu trên vector", "B. Dựa vào gene đánh dấu trên vector", "C. Quan sát bằng mắt thường", "D. Đo kích thước tế bào"], "answer": "B", "explain": "Gene đánh dấu (kháng kháng sinh, phát huỳnh quang...) giúp nhận biết tế bào nhận thành công."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Ưu điểm của enzyme cắt giới hạn tạo đầu dính so với đầu bằng là:", "options": ["A. Tạo nhiều đoạn DNA có đầu tương thích", "B. Tạo nhiều đoạn DNA có đầu tương thích", "C. Dễ nối các đoạn DNA với nhau", "D. Cắt nhanh hơn"], "answer": "B", "explain": "Đầu dính bắt cặp bổ sung với nhau giúp định hướng và tăng hiệu quả nối bằng ligase."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Sau khi tiêm DNA vào trứng đã thụ tinh, bước tiếp theo là:", "options": ["A. Phôi mang gene chuyển được cấy vào tử cung con cái", "B. Phôi mang gene chuyển được cấy vào tử cung con cái", "C. Nuôi trứng trong tủ lạnh", "D. Tiêm thêm DNA"], "answer": "B", "explain": "Phôi mang gene chuyển được cấy vào tử cung con cái để phát triển thành cá thể chuyển gene."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét ứng dụng của công nghệ di truyền:", "statements": ["a) Enzyme công nghiệp được sản xuất bằng vi sinh vật chuyển gene.", "b) Vi sinh vật chuyển gene phân giải dầu tràn.", "c) Mô hình động vật chuyển gene phục vụ thử thuốc.", "d) Mọi sản phẩm chuyển gene đều nguy hiểm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: được đánh giá an toàn trước khi dùng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét vấn đề an toàn sinh học của công nghệ di truyền:", "statements": ["a) Công nghệ di truyền mang lại lợi ích to lớn.", "b) Công nghệ di truyền tiềm ẩn rủi ro cần quản lí.", "c) Nên cấm hoàn toàn mọi nghiên cứu di truyền.", "d) Phát triển công nghệ đi đôi với an toàn và đạo đức."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: cần phát triển có quản lí. d) Đúng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Số bước chính tạo DNA tái tổ hợp là", "answer": "5", "explain": "5 bước: tách – cắt – nối – chuyển – chọn lọc."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Gene chuyển lan sang loài hoang dại gọi là (điền tên hiện tượng)", "answer": "phát tán gene", "explain": "Phát tán gene qua phấn hoa, lai với loài hoang dại là rủi ro sinh thái."}]}]}
