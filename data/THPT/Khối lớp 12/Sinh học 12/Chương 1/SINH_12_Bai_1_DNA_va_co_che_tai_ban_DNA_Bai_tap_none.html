{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đơn phân cấu tạo nên phân tử DNA là:", "options": ["A. Nucleotide", "B. Amino acid", "C. Monosaccharide", "D. Axit béo"], "answer": "A", "explain": "DNA được cấu tạo từ các đơn phân là nucleotide."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Theo nguyên tắc bổ sung, base adenine (A) liên kết với base nào?", "options": ["A. Thymine (T)", "B. Guanine (G)", "C. Cytosine (C)", "D. Uracil (U)"], "answer": "A", "explain": "Theo NTBS: A liên kết với T bằng 2 liên kết hydrogen."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một mạch của DNA có trình tự 5′-ATGCCGTA-3′. Mạch bổ sung viết theo chiều 5′ → 3′ có trình tự là:", "options": ["A. TACGGCAT", "B. TACGGCAT", "C. ATGCCGTA", "D. AACGGCAT"], "answer": "A", "explain": "Theo NTBS (A–T, G–C), mạch bổ sung của 5′-ATGCCGTA-3′ là 3′-TACGGCAT-5′, viết theo chiều 5′ → 3′ được 5′-TACGGCAT-3′."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một phân tử DNA có 600 nucleotide, trong đó adenine chiếm 20%. Số liên kết hydrogen của phân tử DNA này là:", "options": ["A. 780", "B. 1020", "C. 540", "D. 1200"], "answer": "A", "explain": "A = 20% × 600 = 120; G = 600//2 − 120 = 180. Số liên kết hydrogen H = 2A + 3G = 2×120 + 3×180 = 780."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một phân tử DNA có 600 nucleotide tiến hành tái bản 2 lần liên tiếp. Số nucleotide môi trường nội bào cung cấp là:", "options": ["A. 1800", "B. 2400", "C. 900", "D. 1200"], "answer": "A", "explain": "Số nucleotide môi trường cung cấp = N×(2^k − 1) = 600×(2^2 − 1) = 600×3 = 1800."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Nuôi vi khuẩn E. coli trong môi trường chỉ chứa N15 qua nhiều thế hệ, sau đó chuyển sang môi trường chỉ chứa N14 và cho tái bản 1 lần. Số phân tử DNA chứa cả N15 và N14 (DNA lai) là:", "options": ["A. 2", "B. 1", "C. 4", "D. 2"], "answer": "A", "explain": "Theo nguyên tắc bán bảo toàn, 2 mạch cũ chứa N15 luôn tồn tại, mỗi mạch kết hợp với mạch mới N14 tạo 1 DNA lai. Dù tái bản bao nhiêu lần cũng chỉ có 2 phân tử DNA lai."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu sau về cấu trúc phân tử DNA:", "statements": ["a) Đơn phân cấu tạo nên DNA là nucleotide.", "b) Cặp base A – T liên kết với nhau bằng 3 liên kết hydrogen.", "c) Hai mạch polynucleotide của DNA song song và ngược chiều nhau.", "d) Đường kính của vòng xoắn DNA là 34Å."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: A – T liên kết bằng 2 liên kết hydrogen. c) Đúng. d) Sai: đường kính vòng xoắn là 20Å (34Å là chiều cao mỗi vòng xoắn)."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét vai trò của các enzyme trong tái bản DNA:", "statements": ["a) Helicase có chức năng tháo xoắn, tách hai mạch của DNA.", "b) DNA polymerase tổng hợp mạch mới theo chiều 3′ → 5′.", "c) Các đoạn Okazaki được nối lại với nhau nhờ enzyme ligase.", "d) Đoạn mồi RNA được tổng hợp bởi DNA polymerase."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: DNA polymerase tổng hợp mạch mới theo chiều 5′ → 3′. c) Đúng. d) Sai: đoạn mồi do primase tổng hợp."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Một phân tử DNA có 1200 nucleotide, trong đó A chiếm 30%. Số liên kết hydrogen của phân tử DNA là", "answer": "1440", "explain": "A = 360, G = 1200//2 − 360 = 240. H = 2A + 3G = 2×360 + 3×240 = 1440."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một phân tử DNA gồm 600 nucleotide tái bản 3 lần liên tiếp. Số nucleotide môi trường nội bào cung cấp là", "answer": "4200", "explain": "Số nu môi trường cung cấp = N×(2^k − 1) = 600×(2^3 − 1) = 4200."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Enzyme có chức năng nối các đoạn Okazaki thành mạch liên tục là:", "options": ["A. Primase", "B. Ligase", "C. Topoisomerase", "D. Helicase"], "answer": "B", "explain": "Ligase nối các đoạn Okazaki trên mạch gián đoạn thành mạch polynucleotide liên tục."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Mỗi phân tử DNA con được tạo ra từ tái bản gồm:", "options": ["A. Hai mạch đều là mạch cũ của mẹ", "B. Một mạch cũ của mẹ và một mạch mới được tổng hợp", "C. Một mạch cũ và một đoạn mồi RNA", "D. Hai mạch đều hoàn toàn mới"], "answer": "B", "explain": "Theo nguyên tắc bán bảo toàn, mỗi DNA con gồm một mạch cũ của mẹ và một mạch mới được tổng hợp."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong phân tử DNA mạch kép, adenine (A) chiếm 15%. Tỉ lệ % của guanine (G) là:", "options": ["A. 85%", "B. 35%", "C. 30%", "D. 15%"], "answer": "B", "explain": "Theo quy tắc Chargaff: A = T, G = C nên A + G = 50%. Vậy G = 50% − 15% = 35%."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một phân tử DNA có 1200 nucleotide. Số vòng xoắn của phân tử DNA này là:", "options": ["A. 30", "B. 60", "C. 600", "D. 120"], "answer": "B", "explain": "Mỗi vòng xoắn gồm 10 cặp nucleotide = 20 nucleotide. Số vòng xoắn = 1200//20 = 60."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Tại một chạc tái bản, mạch gián đoạn được tổng hợp thành 4 đoạn Okazaki. Số đoạn mồi RNA cần để tổng hợp cả hai mạch mới tại chạc này là:", "options": ["A. 2", "B. 5", "C. 8", "D. 4"], "answer": "B", "explain": "Mạch gián đoạn cần 4 đoạn mồi (mỗi đoạn Okazaki cần 1 mồi), mạch liên tục cần 1 đoạn mồi. Tổng = 4 + 1 = 5."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một phân tử DNA có 4200 liên kết hydrogen, trong đó adenine chiếm 25%. Tổng số nucleotide của phân tử DNA này là:", "options": ["A. 3060", "B. 3360", "C. 3960", "D. 3660"], "answer": "B", "explain": "Gọi N là tổng số nu. A = 25%N, G = 25%N. H = 2A + 3G = N×(2×0.25 + 3×0.25) = 4200 → N = 3360."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về cơ chế tái bản DNA:", "statements": ["a) Từ 1 DNA mẹ, qua 1 lần tái bản tạo ra 2 DNA con.", "b) Hai DNA con giống nhau và giống hệt DNA mẹ.", "c) Tái bản DNA là cơ sở của sự tự nhân đôi NST.", "d) Tái bản DNA chỉ xảy ra ở sinh vật nhân sơ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tái bản xảy ra ở mọi sinh vật."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét quá trình tổng hợp hai mạch DNA mới tại chạc tái bản:", "statements": ["a) Mạch liên tục chỉ cần 1 đoạn mồi RNA duy nhất.", "b) Đoạn Okazaki là các đoạn DNA ngắn trên mạch gián đoạn.", "c) Chạc tái bản có dạng chữ Y.", "d) Cả hai mạch mới đều được tổng hợp liên tục."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: một mạch liên tục, một mạch gián đoạn."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Mạch DNA có trình tự 5′-AACGTTAG-3′. Trình tự mạch bổ sung viết theo chiều 5′ → 3′ là", "answer": "CTAACGTT", "explain": "Mạch bổ sung theo NTBS là 3′-TTGCAATC-5′, viết theo chiều 5′ → 3′ được 5′-CTAACGTT-3′."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một phân tử DNA có 2700 liên kết hydrogen và 450 nucleotide loại A. Số nucleotide loại G của phân tử DNA là", "answer": "600", "explain": "H = 2A + 3G → 3G = 2700 − 2×450 = 1800 → G = 600."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Có bao nhiêu loại nucleotide cấu tạo nên phân tử DNA?", "options": ["A. 20", "B. 2", "C. 4", "D. 3"], "answer": "C", "explain": "DNA có 4 loại nucleotide, khác nhau ở base nitơ: A, T, G, C."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Cặp base A – T liên kết với nhau bằng bao nhiêu liên kết hydrogen?", "options": ["A. 4", "B. 1", "C. 2", "D. 3"], "answer": "C", "explain": "A liên kết với T bằng 2 liên kết hydrogen."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một mạch của DNA có trình tự 5′-TTACGGCA-3′. Mạch bổ sung viết theo chiều 5′ → 3′ có trình tự là:", "options": ["A. AGCCGTAA", "B. AATGCCGT", "C. TGCCGTAA", "D. TTACGGCA"], "answer": "C", "explain": "Theo NTBS (A–T, G–C), mạch bổ sung của 5′-TTACGGCA-3′ là 3′-AATGCCGT-5′, viết th ) Enzyme ligase nối các đoạn Okazaki trên mạch liên tục.", "d) DNA polymerase gắn nucleotide theo nguyên tắc bổ sung."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: ligase nối các đoạn Okazaki trên mạch gián đoạn. d) Đúng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Một phân tử DNA có 1800 nucleotide, trong đó A chiếm 25%. Số liên kết hydrogen của phân tử DNA là", "answer": "2250", "explain": "A = 450, G = 1800//2 − 450 = 450. H = 2A + 3G = 2×450 + 3×450 = 2250."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một phân tử DNA gồm 1200 nucleotide tái bản 4 lần liên tiếp. Số nucleotide môi trường nội bào cung cấp là", "answer": "18000", "explain": "Số nu môi trường cung cấp = N×(2^k − 1) = 1200×(2^4 − 1) = 18000."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Enzyme trực tiếp tổng hợp mạch DNA mới theo chiều 5′ → 3′ là:", "options": ["A. Primase", "B. Ligase", "C. Topoisomerase", "D. DNA polymerase"], "answer": "D", "explain": "DNA polymerase gắn các nucleotide tự do theo NTBS để tổng hợp mạch mới theo chiều 5′ → 3′, đồng thời sửa sai."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Quá trình tái bản DNA tuân theo các nguyên tắc:", "options": ["A. Bổ sung và bảo toàn", "B. Khuôn mẫu và phân tán", "C. Bán bảo toàn duy nhất", "D. Bổ sung và bán bảo toàn"], "answer": "D", "explain": "Tái bản DNA tuân thủ nguyên tắc bổ sung (A–T, G–C) và nguyên tắc bán bảo toàn."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong phân tử DNA mạch kép, adenine (A) chiếm 25%. Tỉ lệ % của guanine (G) là:", "options": ["A. 25%", "B. 75%", "C. 50%", "D. 25%"], "answer": "D", "explain": "Theo quy tắc Chargaff: A = T, G = C nên A + G = 50%. Vậy G = 50% − 25% = 25%."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một phân tử DNA có 2400 nucleotide. Số vòng xoắn của phân tử DNA này là:", "options": ["A. 240", "B. 60", "C. 1200", "D. 120"], "answer": "D", "explain": "Mỗi vòng xoắn gồm 10 cặp nucleotide = 20 nucleotide. Số vòng xoắn = 2400//20 = 120."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Tại một chạc tái bản, mạch gián đoạn được tổng hợp thành 6 đoạn Okazaki. Số đoạn mồi RNA cần để tổng hợp cả hai mạch mới tại chạc này là:", "options": ["A. 6", "B. 2", "C. 12", "D. 7"], "answer": "D", "explain": "Mạch gián đoạn cần 6 đoạn mồi (mỗi đoạn Okazaki cần 1 mồi), mạch liên tục cần 1 đoạn mồi. Tổng = 6 + 1 = 7."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một phân tử DNA có 4550 liên kết hydrogen, trong đó adenine chiếm 20%. Tổng số nucleotide của phân tử DNA này là:", "options": ["A. 3800", "B. 3200", "C. 4100", "D. 3500"], "answer": "D", "explain": "Gọi N là tổng số nu. A = 20%N, G = 30%N. H = 2A + 3G = N×(2×0.2 + 3×0.3) = 4550 → N = 3500."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về cơ chế tái bản DNA:", "statements": ["a) Thí nghiệm Meselson – Stahl dùng đồng vị N15 và N14.", "b) Sau 1 thế hệ trong môi trường N14, thu được 2 DNA lai.", "c) Kết quả thí nghiệm ủng hộ nguyên tắc bán bảo toàn.", "d) Thí nghiệm chứng minh DNA tái bản theo nguyên tắc phân tán."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ủng hộ nguyên tắc bán bảo toàn."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét quá trình tổng hợp hai mạch DNA mới tại chạc tái bản:", "statements": ["a) Tại mỗi chạc tái bản có 1 mạch liên tục và 1 mạch gián đoạn.", "b) Ligase nối các đoạn Okazaki thành mạch hoàn chỉnh.", "c) Đoạn mồi RNA nằm ở đầu 5′ của mỗi đoạn DNA mới.", "d) Mạch gián đoạn được tổng hợp nhanh hơn mạch liên tục."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: mạch gián đoạn tổng hợp phức tạp, chậm hơn."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Mạch DNA có trình tự 5′-TACGATGC-3′. Trình tự mạch bổ sung viết theo chiều 5′ → 3′ là", "answer": "GCATCGTA", "explain": "Mạch bổ sung theo NTBS là 3′-ATGCTACG-5′, viết theo chiều 5′ → 3′ được 5′-GCATCGTA-3′."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một phân tử DNA có 2850 liên kết hydrogen và 750 nucleotide loại A. Số nucleotide loại G của phân tử DNA là", "answer": "450", "explain": "H = 2A + 3G → 3G = 2850 − 2×750 = 1350 → G = 450."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Loại đường có trong nucleotide của DNA là:", "options": ["A. Deoxyribose", "B. Glucose", "C. Fructose", "D. Ribose"], "answer": "A", "explain": "Đường trong nucleotide của DNA là deoxyribose (C5H10O4), thiếu một nguyên tử oxygen so với ribose."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Cặp base bổ sung nào có 3 liên kết hydrogen?", "options": ["A. G – C", "B. A – U", "C. T – A", "D. A – T"], "answer": "A", "explain": "Cặp G – C có 3 liên kết hydrogen; cặp A – T (hoặc A – U) có 2 liên kết hydrogen."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một mạch của DNA có trình tự 5′-AAGCTTGC-3′. Mạch bổ sung viết theo chiều 5′ → 3′ có trình tự là:", "options": ["A. GCAAGCTT", "B. AAGCTTGC", "C. CCAAGCTT", "D. TTCGAACG"], "answer": "A", "explain": "Theo NTBS (A–T, G–C), mạch bổ sung của 5′-AAGCTTGC-3′ là 3′-TTCGAACG-5′, viết theo chiều 5′ → 3′ được 5′-GCAAGCTT-3′."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một phân tử DNA có 1800 nucleotide, trong đó adenine chiếm 10%. Số liên kết hydrogen của phân tử DNA này là:", "options": ["A. 2520", "B. 2280", "C. 3600", "D. 2760"], "answer": "A", "explain": "A = 10% × 1800 = 180; G = 1800//2 − 180 = 720. Số liên kết hydrogen H = 2A + 3G = 2×180 + 3×720 = 2520."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một phân tử DNA có 1800 nucleotide tiến hành tái bản 2 lần liên tiếp. Số nucleotide môi trường nội bào cung cấp là:", "options": ["A. 5400", "B. 2700", "C. 3600", "D. 7200"], "answer": "A", "explain": "Số nucleotide môi trường cung cấp = N×(2^k − 1) = 1800×(2^2 − 1) = 1800×3 = 5400."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Nuôi vi khuẩn E. coli trong môi trường chỉ chứa N15 qua nhiều thế hệ, sau đó chuyển sang môi trường chỉ chứa N14 và cho tái bản 3 lần. Số phân tử DNA chứa cả N15 và N14 (DNA lai) là:", "options": ["A. 2", "B. 4", "C. 8", "D. 1"], "answer": "A", "explain": "Theo nguyên tắc bán bảo toàn, 2 mạch cũ chứa N15 luôn tồn tại, mỗi mạch kết hợp với mạch mới N14 tạo 1 DNA lai. Dù tái bản bao nhiêu lần cũng chỉ có 2 phân tử DNA lai."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu sau về cấu trúc phân tử DNA:", "statements": ["a) DNA có chức năng lưu giữ, bảo quản và truyền đạt thông tin di truyền.", "b) Liên kết giữa hai mạch DNA là liên kết hydrogen theo NTBS.", "c) Đầu 5′ của mạch polynucleotide gắn nhóm phosphate.", "d) Trong DNA mạch kép, số lượng A luôn bằng số lượng G."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: A = T và G = C (không phải A = G)."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét vai trò của các enzyme trong tái bản DNA:", "statements": ["a) DNA polymerase chỉ tổng hợp mạch mới theo chiều 5′ → 3′.", "b) Đoạn mồi RNA sau đó được thay bằng đoạn DNA.", "c) Helicase hoạt động tại chạc tái bản hình chữ Y.", "d) Tái bản DNA không cần enzyme tham gia."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tái bản cần nhiều enzyme (helicase, polymerase, ligase...)."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Một phân tử DNA có 2400 nucleotide, trong đó A chiếm 35%. Số liên kết hydrogen của phân tử DNA là", "answer": "2760", "explain": "A = 840, G = 2400//2 − 840 = 360. H = 2A + 3G = 2×840 + 3×360 = 2760."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một phân tử DNA gồm 1800 nucleotide tái bản 2 lần liên tiếp. Số nucleotide môi trường nội bào cung cấp là", "answer": "5400", "explain": "Số nu môi trường cung cấp = N×(2^k − 1) = 1800×(2^2 − 1) = 5400."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Enzyme có chức năng tháo xoắn, tách hai mạch của phân tử DNA là:", "options": ["A. Primase", "B. Helicase", "C. DNA polymerase", "D. Ligase"], "answer": "B", "explain": "Helicase cắt các liên kết hydrogen để tháo xoắn, tách hai mạch đơn của DNA tại chạc tái bản."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Kết quả của một lần tái bản DNA là:", "options": ["A. 1 phân tử DNA con giống hệt DNA mẹ", "B. 2 phân tử DNA con giống nhau và giống DNA mẹ", "C. 2 phân tử DNA con khác nhau và khác DNA mẹ", "D. 4 phân tử DNA con giống hệt nhau"], "answer": "B", "explain": "Một phân tử DNA mẹ qua tái bản tạo ra 2 phân tử DNA con giống nhau và giống hệt phân tử DNA mẹ."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong phân tử DNA mạch kép, adenine (A) chiếm 35%. Tỉ lệ % của guanine (G) là:", "options": ["A. 70%", "B. 15%", "C. 35%", "D. 65%"], "answer": "B", "explain": "Theo quy tắc Chargaff: A = T, G = C nên A + G = 50%. Vậy G = 50% − 35% = 15%."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một phân tử DNA có 900 nucleotide. Số vòng xoắn của phân tử DNA này là:", "options": ["A. 450", "B. 45", "C. 90", "D. 22"], "answer": "B", "explain": "Mỗi vòng xoắn gồm 10 cặp nucleotide = 20 nucleotide. Số vòng xoắn = 900//20 = 45."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Tại một chạc tái bản, mạch gián đoạn được tổng hợp thành 8 đoạn Okazaki. Số đoạn mồi RNA cần để tổng hợp cả hai mạch mới tại chạc này là:", "options": ["A. 16", "B. 9", "C. 8", "D. 2"], "answer": "B", "explain": "Mạch gián đoạn cần 8 đoạn mồi (mỗi đoạn Okazaki cần 1 mồi), mạch liên tục cần 1 đoạn mồi. Tổng = 8 + 1 = 9."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một phân tử DNA có 3600 liên kết hydrogen, trong đó adenine chiếm 30%. Tổng số nucleotide của phân tử DNA này là:", "options": ["A. 3600", "B. 3000", "C. 3300", "D. 2700"], "answer": "B", "explain": "Gọi N là tổng số nu. A = 30%N, G = 20%N. H = 2A + 3G = N×(2×0.3 + 3×0.2) = 3600 → N = 3000."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về cơ chế tái bản DNA:", "statements": ["a) Tái bản DNA tuân theo nguyên tắc bổ sung và nguyên tắc bán bảo toàn.", "b) Mỗi phân tử DNA con gồm hai mạch polynucleotide hoàn toàn mới.", "c) Mạch DNA mới luôn được tổng hợp theo chiều 5′ → 3′.", "d) Thí nghiệm Meselson – Stahl chứng minh DNA tái bản theo nguyên tắc bảo toàn."], "answer": ["T", "F", "T", "F"], "explain": "a) Đúng. b) Sai: mỗi DNA con gồm 1 mạch cũ + 1 mạch mới. c) Đúng. d) Sai: chứng minh nguyên tắc bán bảo toàn."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét quá trình tổng hợp hai mạch DNA mới tại chạc tái bản:", "statements": ["a) Trên mạch khuôn 3′ → 5′, mạch mới được tổng hợp liên tục.", "b) Các đoạn Okazaki được tổng hợp trên mạch khuôn có chiều 5′ → 3′.", "c) Mạch gián đoạn cần nhiều đoạn mồi RNA hơn mạch liên tục.", "d) Sau tái bản, hai phân tử DNA con khác nhau và khác với DNA mẹ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng: mỗi đoạn Okazaki cần 1 đoạn mồi. d) Sai: 2 DNA con giống nhau và giống hệt mẹ."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Mạch DNA có trình tự 5′-GCTAACGT-3′. Trình tự mạch bổ sung viết theo chiều 5′ → 3′ là", "answer": "ACGTTAGC", "explain": "Mạch bổ sung theo NTBS là 3′-CGATTGCA-5′, viết theo chiều 5′ → 3′ được 5′-ACGTTAGC-3′."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một phân tử DNA có 3450 liên kết hydrogen và 1050 nucleotide loại A. Số nucleotide loại G của phân tử DNA là", "answer": "450", "explain": "H = 2A + 3G → 3G = 3450 − 2×1050 = 1350 → G = 450."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Một nucleotide cấu tạo nên DNA gồm:", "options": ["A. Đường ribose, nhóm phosphate và base nitơ", "B. Đường deoxyribose, nhóm phosphate và amino acid", "C. Đường deoxyribose, nhóm phosphate và base nitơ", "D. Glycerol, axit béo và base nitơ"], "answer": "C", "explain": "Mỗi nucleotide gồm đường deoxyribose (C5H10O4), một nhóm phosphate và một base nitơ (A, T, G, C)."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Theo nguyên tắc bổ sung, base guanine (G) liên kết với base nào?", "options": ["A. Adenine (A)", "B. Thymine (T)", "C. Cytosine (C)", "D. Uracil (U)"], "answer": "C", "explain": "Theo NTBS: G liên kết với C bằng 3 liên kết hydrogen."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một mạch của DNA có trình tự 5′-GATCGATC-3′. Mạch bổ sung viết theo chiều 5′ → 3′ có trình tự là:", "options": ["A. CTAGCTAG", "B. GATCGATC", "C. GATCGATC", "D. CATCGATC"], "answer": "C", "explain": "Theo NTBS (A–T, G–C), mạch bổ sung của 5′-GATCGATC-3′ là 3′-CTAGCTAG-5′, viết theo chiều 5′ → 3′ được 5′-GATCGATC-3′."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một phân tử DNA có 2400 nucleotide, trong đó adenine chiếm 18%. Số liên kết hydrogen của phân tử DNA này là:", "options": ["A. 3408", "B. 2928", "C. 3168", "D. 4800"], "answer": "C", "explain": "A = 18% × 2400 = 432; G = 2400//2 − 432 = 768. Số liên kết hydrogen H = 2A + 3G = 2×432 + 3×768 = 3168."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một phân tử DNA có 2400 nucleotide tiến hành tái bản 5 lần liên tiếp. Số nucleotide môi trường nội bào cung cấp là:", "options": ["A. 76800", "B. 37200", "C. 74400", "D. 12000"], "answer": "C", "explain": "Số nucleotide môi trường cung cấp = N×(2^k − 1) = 2400×(2^5 − 1) = 2400×31 = 74400."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Nuôi vi khuẩn E. coli trong môi trường chỉ chứa N15 qua nhiều thế hệ, sau đó chuyển sang môi trường chỉ chứa N14 và cho tái bản 4 lần. Số phân tử DNA chứa cả N15 và N14 (DNA lai) là:", "options": ["A. 1", "B. 4", "C. 2", "D. 16"], "answer": "C", "explain": "Theo nguyên tắc bán bảo toàn, 2 mạch cũ chứa N15 luôn tồn tại, mỗi mạch kết hợp với mạch mới N14 tạo 1 DNA lai. Dù tái bản bao nhiêu lần cũng chỉ có 2 phân tử DNA lai."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu sau về cấu trúc phân tử DNA:", "statements": ["a) Mỗi nucleotide gồm đường deoxyribose, nhóm phosphate và base nitơ.", "b) Cặp base G – C liên kết với nhau bằng 2 liên kết hydrogen.", "c) Mỗi vòng xoắn của DNA gồm 10 cặp nucleotide.", "d) Hai mạch của DNA xoắn đều quanh một trục tưởng tượng."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: G – C liên kết bằng 3 liên kết hydrogen. c) Đúng. d) Đúng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét vai trò của các enzyme trong tái bản DNA:", "statements": ["a) Primase tổng hợp đoạn mồi RNA làm điểm khởi đầu tái bản.", "b) Topoisomerase tháo xoắn siêu xoắn phía trước chạc tái bản.", "c) DNA polymerase có khả năng sửa sai trong tái bản.", "d) Ligase có chức năng tháo xoắn phân tử DNA."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tháo xoắn là chức năng của helicase."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Một phân tử DNA có 3000 nucleotide, trong đó A chiếm 28%. Số liên kết hydrogen của phân tử DNA là", "answer": "3660", "explain": "A = 840, G = 3000//2 − 840 = 660. H = 2A + 3G = 2×840 + 3×660 = 3660."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một phân tử DNA gồm 2400 nucleotide tái bản 4 lần liên tiếp. Số nucleotide môi trường nội bào cung cấp là", "answer": "36000", "explain": "Số nu môi trường cung cấp = N×(2^k − 1) = 2400×(2^4 − 1) = 36000."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Enzyme tổng hợp đoạn mồi RNA trong tái bản DNA là:", "options": ["A. Ligase", "B. Helicase", "C. DNA polymerase", "D. Primase"], "answer": "D", "explain": "Primase tổng hợp đoạn mồi RNA làm điểm khởi đầu để DNA polymerase tổng hợp mạch mới."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Thí nghiệm Meselson – Stahl chứng minh DNA tái bản theo nguyên tắc:", "options": ["A. Phân tán", "B. Ngẫu nhiên", "C. Bảo toàn", "D. Bán bảo toàn"], "answer": "D", "explain": "Thí nghiệm với đồng vị N15/N14 của Meselson và Stahl (1958) chứng minh DNA tái bản theo nguyên tắc bán bảo toàn."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong phân tử DNA mạch kép, adenine (A) chiếm 18%. Tỉ lệ % của guanine (G) là:", "options": ["A. 82%", "B. 36%", "C. 18%", "D. 32%"], "answer": "D", "explain": "Theo quy tắc Chargaff: A = T, G = C nên A + G = 50%. Vậy G = 50% − 18% = 32%."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một phân tử DNA có 2100 nucleotide. Số vòng xoắn của phân tử DNA này là:", "options": ["A. 52", "B. 1050", "C. 210", "D. 105"], "answer": "D", "explain": "Mỗi vòng xoắn gồm 10 cặp nucleotide = 20 nucleotide. Số vòng xoắn = 2100//20 = 105."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Tại một chạc tái bản, mạch gián đoạn được tổng hợp thành 5 đoạn Okazaki. Số đoạn mồi RNA cần để tổng hợp cả hai mạch mới tại chạc này là:", "options": ["A. 2", "B. 10", "C. 5", "D. 6"], "answer": "D", "explain": "Mạch gián đoạn cần 5 đoạn mồi (mỗi đoạn Okazaki cần 1 mồi), mạch liên tục cần 1 đoạn mồi. Tổng = 5 + 1 = 6."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một phân tử DNA có 4500 liên kết hydrogen, trong đó adenine chiếm 30%. Tổng số nucleotide của phân tử DNA này là:", "options": ["A. 3450", "B. 4350", "C. 4050", "D. 3750"], "answer": "D", "explain": "Gọi N là tổng số nu. A = 30%N, G = 20%N. H = 2A + 3G = N×(2×0.3 + 3×0.2) = 4500 → N = 3750."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về cơ chế tái bản DNA:", "statements": ["a) Nguyên tắc bán bảo toàn: mỗi DNA con giữ 1 mạch cũ của mẹ.", "b) Nguyên tắc bổ sung: A–T, G–C trong tổng hợp mạch mới.", "c) Sau tái bản, thông tin di truyền được truyền đạt nguyên vẹn.", "d) Mỗi DNA con gồm 2 mạch đều của mẹ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: mỗi DNA con chỉ giữ 1 mạch của mẹ."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét quá trình tổng hợp hai mạch DNA mới tại chạc tái bản:", "statements": ["a) DNA polymerase trượt trên mạch khuôn theo chiều 3′ → 5′.", "b) Mạch mới tổng hợp ngược chiều với mạch khuôn.", "c) Số đoạn mồi trên mạch gián đoạn bằng số đoạn Okazaki.", "d) Mạch khuôn 5′ → 3′ cho mạch mới tổng hợp liên tục."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng (mạch mới 5′→3′, mạch khuôn 3′→5′). c) Đúng. d) Sai: mạch khuôn 5′→3′ cho mạch gián đoạn."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Mạch DNA có trình tự 5′-GTACGTAC-3′. Trình tự mạch bổ sung viết theo chiều 5′ → 3′ là", "answer": "GTACGTAC", "explain": "Mạch bổ sung theo NTBS là 3′-CATGCATG-5′, viết theo chiều 5′ → 3′ được 5′-GTACGTAC-3′."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một phân tử DNA có 2940 liên kết hydrogen và 660 nucleotide loại A. Số nucleotide loại G của phân tử DNA là", "answer": "540", "explain": "H = 2A + 3G → 3G = 2940 − 2×660 = 1620 → G = 540."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Base nitơ nào chỉ có trong DNA mà không có trong RNA?", "options": ["A. Thymine", "B. Uracil", "C. Adenine", "D. Guanine"], "answer": "A", "explain": "DNA chứa base T (thymine); RNA chứa U (uracil) thay cho T."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Cặp base G – C liên kết với nhau bằng bao nhiêu liên kết hydrogen?", "options": ["A. 3", "B. 4", "C. 1", "D. 2"], "answer": "A", "explain": "G liên kết với C bằng 3 liên kết hydrogen."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một mạch của DNA có trình tự 5′-AATTCCGG-3′. Mạch bổ sung viết theo chiều 5′ → 3′ có trình tự là:", "options": ["A. CCGGAATT", "B. GCGGAATT", "C. TTAAGGCC", "D. AATTCCGG"], "answer": "A", "explain": "Theo NTBS (A–T, G–C), mạch bổ sung của 5′-AATTCCGG-3′ là 3′-TTAAGGCC-5′, viết theo chiều 5′ → 3′ được 5′-CCGGAATT-3′."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một phân tử DNA có 3000 nucleotide, trong đó adenine chiếm 12%. Số liên kết hydrogen của phân tử DNA này là:", "options": ["A. 4140", "B. 6000", "C. 4380", "D. 3900"], "answer": "A", "explain": "A = 12% × 3000 = 360; G = 3000//2 − 360 = 1140. Số liên kết hydrogen H = 2A + 3G = 2×360 + 3×1140 = 4140."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một phân tử DNA có 3000 nucleotide tiến hành tái bản 4 lần liên tiếp. Số nucleotide môi trường nội bào cung cấp là:", "options": ["A. 45000", "B. 12000", "C. 48000", "D. 22500"], "answer": "A", "explain": "Số nucleotide môi trường cung cấp = N×(2^k − 1) = 3000×(2^4 − 1) = 3000×15 = 45000."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Nuôi vi khuẩn E. coli trong môi trường chỉ chứa N15 qua nhiều thế hệ, sau đó chuyển sang môi trường chỉ chứa N14 và cho tái bản 3 lần. Số phân tử DNA chứa cả N15 và N14 (DNA lai) là:", "options": ["A. 2", "B. 8", "C. 1", "D. 4"], "answer": "A", "explain": "Theo nguyên tắc bán bảo toàn, 2 mạch cũ chứa N15 luôn tồn tại, mỗi mạch kết hợp với mạch mới N14 tạo 1 DNA lai. Dù tái bản bao nhiêu lần cũng chỉ có 2 phân tử DNA lai."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu sau về cấu trúc phân tử DNA:", "statements": ["a) Base nitơ của DNA gồm A, T, G, C.", "b) Đường trong nucleotide của DNA là ribose.", "c) A liên kết với T, G liên kết với C theo nguyên tắc bổ sung.", "d) Chiều cao mỗi vòng xoắn DNA là 34Å."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: đường là deoxyribose. c) Đúng. d) Đúng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét vai trò của các enzyme trong tái bản DNA:", "statements": ["a) Quá trình tái bản cần nhiều loại enzyme phối hợp.", "b) Primase và DNA polymerase đều tổng hợp mạch DNA mới.", "c) Protein SSB giữ cho hai mạch đơn không bắt cặp trở lại.", "d) Ligase tạo liên kết phosphodiester để nối các đoạn Okazaki."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: primase tổng hợp đoạn mồi RNA, chỉ DNA polymerase tổng hợp mạch DNA. c) Đúng. d) Đúng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Một phân tử DNA có 1500 nucleotide, trong đó A chiếm 18%. Số liên kết hydrogen của phân tử DNA là", "answer": "1980", "explain": "A = 270, G = 1500//2 − 270 = 480. H = 2A + 3G = 2×270 + 3×480 = 1980."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một phân tử DNA gồm 1200 nucleotide tái bản 3 lần liên tiếp. Số nucleotide môi trường nội bào cung cấp là", "answer": "8400", "explain": "Số nu môi trường cung cấp = N×(2^k − 1) = 1200×(2^3 − 1) = 8400."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Enzyme tháo xoắn siêu xoắn phía trước chạc tái bản là:", "options": ["A. Helicase", "B. Topoisomerase", "C. Ligase", "D. Primase"], "answer": "B", "explain": "Topoisomerase cắt tạm thời mạch DNA để tháo nút xoắn siêu xoắn phía trước chạc tái bản."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Từ 1 phân tử DNA mẹ, sau 2 lần tái bản liên tiếp tạo ra bao nhiêu phân tử DNA con?", "options": ["A. 2", "B. 4", "C. 3", "D. 8"], "answer": "B", "explain": "Mỗi lần tái bản số DNA tăng gấp đôi: sau 2 lần có 1×2^2 = 4 phân tử DNA con."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong phân tử DNA mạch kép, adenine (A) chiếm 28%. Tỉ lệ % của guanine (G) là:", "options": ["A. 28%", "B. 22%", "C. 72%", "D. 56%"], "answer": "B", "explain": "Theo quy tắc Chargaff: A = T, G = C nên A + G = 50%. Vậy G = 50% − 28% = 22%."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một phân tử DNA có 3600 nucleotide. Số vòng xoắn của phân tử DNA này là:", "options": ["A. 360", "B. 180", "C. 90", "D. 1800"], "answer": "B", "explain": "Mỗi vòng xoắn gồm 10 cặp nucleotide = 20 nucleotide. Số vòng xoắn = 3600//20 = 180."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Tại một chạc tái bản, mạch gián đoạn được tổng hợp thành 7 đoạn Okazaki. Số đoạn mồi RNA cần để tổng hợp cả hai mạch mới tại chạc này là:", "options": ["A. 7", "B. 8", "C. 2", "D. 14"], "answer": "B", "explain": "Mạch gián đoạn cần 7 đoạn mồi (mỗi đoạn Okazaki cần 1 mồi), mạch liên tục cần 1 đoạn mồi. Tổng = 7 + 1 = 8."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một phân tử DNA có 3900 liên kết hydrogen, trong đó adenine chiếm 20%. Tổng số nucleotide của phân tử DNA này là:", "options": ["A. 3300", "B. 3000", "C. 2700", "D. 3600"], "answer": "B", "explain": "Gọi N là tổng số nu. A = 20%N, G = 30%N. H = 2A + 3G = N×(2×0.2 + 3×0.3) = 3900 → N = 3000."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về cơ chế tái bản DNA:", "statements": ["a) Tái bản DNA diễn ra ở kì trung gian của chu kì tế bào.", "b) Tái bản đảm bảo thông tin di truyền truyền đạt qua các thế hệ.", "c) Sai sót trong tái bản có thể gây đột biến gene.", "d) Tái bản DNA tạo ra phân tử RNA."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tái bản tạo ra DNA (tổng hợp RNA là phiên mã)."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét quá trình tổng hợp hai mạch DNA mới tại chạc tái bản:", "statements": ["a) Hai chạc tái bản từ một điểm khởi đầu mở rộng ngược nhau.", "b) Tái bản diễn ra đồng thời ở nhiều điểm trên NST sinh vật nhân thực.", "c) Mỗi đơn vị tái bản tạo 2 chạc tái bản.", "d) Sinh vật nhân sơ chỉ có 1 điểm khởi đầu tái bản duy nhất là sai."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: sinh vật nhân sơ (vi khuẩn) chỉ có 1 điểm khởi đầu tái bản."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Mạch DNA có trình tự 5′-TGCAACGT-3′. Trình tự mạch bổ sung viết theo chiều 5′ → 3′ là", "answer": "ACGTTGCA", "explain": "Mạch bổ sung theo NTBS là 3′-ACGTTGCA-5′, viết theo chiều 5′ → 3′ được 5′-ACGTTGCA-3′."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một phân tử DNA có 2760 liên kết hydrogen và 840 nucleotide loại A. Số nucleotide loại G của phân tử DNA là", "answer": "360", "explain": "H = 2A + 3G → 3G = 2760 − 2×840 = 1080 → G = 360."}]}]}
