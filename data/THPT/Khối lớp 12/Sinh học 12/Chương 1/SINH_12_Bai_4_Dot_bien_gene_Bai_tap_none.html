<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Dạng đột biến gene nào sau đây KHÔNG làm dịch khung đọc mã?", "options": ["A. Thay thế một cặp nucleotide bằng một cặp nucleotide khác", "B. Thêm một cặp nucleotide", "C. Mất một cặp nucleotide", "D. Mất hai cặp nucleotide"], "answer": "A", "explain": "Thay thế 1 cặp nu chỉ ảnh hưởng 1 bộ ba (đồng nghĩa/sai nghĩa/vô nghĩa), không làm dịch khung."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Đột biến nào sau đây gây dịch khung đọc mã?", "options": ["A. Thêm hoặc mất một số cặp nucleotide mà số cặp không chia hết cho 3", "B. Thay thế một cặp nucleotide", "C. Thêm 3 cặp nucleotide", "D. Mất 6 cặp nucleotide"], "answer": "A", "explain": "Thêm/mất số cặp nu không chia hết cho 3 làm khung đọc dịch chuyển từ điểm đột biến trở đi."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một gene có đoạn mã hóa: ATG-GGA-TTT. Sau đột biến, đoạn này là: ATG-GAA-TTT. Đây là dạng đột biến gene nào?", "options": ["A. Đột biến thay thế một cặp nucleotide", "B. Đột biến thêm một cặp nucleotide", "C. Đột biến mất một cặp nucleotide", "D. Đột biến đảo đoạn NST"], "answer": "A", "explain": "So sánh hai trình tự thấy thay thế một cặp nucleotide → đột biến thay thế một cặp nucleotide."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Đột biến thêm/mất cặp nucleotide nào sau đây KHÔNG gây dịch khung đọc mã?", "options": ["A. Thêm hoặc mất 3 cặp nucleotide (bội số của 3)", "B. Thêm 1 cặp nucleotide", "C. Mất 2 cặp nucleotide", "D. Mất 4 cặp nucleotide"], "answer": "A", "explain": "Thêm/mất số cặp nu là bội số của 3 (trọn bộ ba) chỉ thêm/mất amino acid, không làm dịch khung."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một gene bị mất 1 cặp nucleotide ở bộ ba thứ 10 (tính từ đầu 5′). Số codon bị đọc sai kể từ vị trí đột biến (giả sử gene có tổng cộng 10 codon mã hóa) là:", "options": ["A. 9", "B. 10", "C. 8", "D. 20"], "answer": "A", "explain": "Mất 1 cặp nu gây dịch khung: toàn bộ các codon từ vị trí 10 trở đi đều đọc sai → có 10 − 1 = 9 codon bị ảnh hưởng."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Bệnh hồng cầu hình liềm ở người do dạng đột biến gene nào gây ra?", "options": ["A. Thay thế cặp G–C bằng cặp A–T ở codon thứ 6 của gene beta-globin", "B. Mất 1 cặp nucleotide ở gene beta-globin", "C. Thêm 3 cặp nucleotide vào gene", "D. Đảo vị trí 2 gene"], "answer": "A", "explain": "Bệnh hồng cầu hình liềm do đột biến thay thế 1 cặp nu (GAG → GTG) ở codon thứ 6 của gene beta-globin, làm glutamate thành valine."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về đột biến gene:", "statements": ["a) Đột biến gene là biến đổi trong cấu trúc của gene.", "b) Đột biến thay thế 1 cặp nu không bao giờ làm thay đổi amino acid.", "c) Đột biến thêm 1 cặp nu gây dịch khung đọc mã.", "d) Đột biến gene phát sinh vô hướng."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: thay thế có thể gây sai nghĩa, vô nghĩa. c) Đúng. d) Đúng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét hậu quả của các dạng đột biến gene:", "statements": ["a) Đột biến đồng nghĩa không làm thay đổi trình tự amino acid.", "b) Đột biến vô nghĩa làm xuất hiện bộ ba kết thúc sớm.", "c) Thêm 3 cặp nu gây dịch khung đọc mã.", "d) Đột biến dịch khung thường gây hậu quả nặng nề."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: thêm 3 cặp (trọn bộ ba) không gây dịch khung. d) Đúng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Một gene bị mất 1 cặp nucleotide. Đột biến này (điền: có/không) gây dịch khung đọc mã", "answer": "có", "explain": "Mất 1 cặp nu không chia hết cho 3 nên gây dịch khung."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Bệnh hồng cầu hình liềm do đột biến (điền: thay thế/thêm/mất) một cặp nucleotide", "answer": "thay thế", "explain": "Đột biến thay thế cặp G–C bằng A–T ở codon thứ 6 gene beta-globin (GAG thành GTG)."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đa số đột biến gene lặn có đặc điểm:", "options": ["A. Biểu hiện ngay ở thế hệ đầu", "B. Tồn tại ở trạng thái dị hợp mà không biểu hiện", "C. Bị đào thải ngay", "D. Tồn tại ở trạng thái dị hợp mà không biểu hiện"], "answer": "B", "explain": "Đột biến lặn ở trạng thái dị hợp không biểu hiện, tồn tại âm thầm trong quần thể."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Bệnh di truyền nào sau đây do đột biến gene (không phải đột biến NST) gây ra?", "options": ["A. Down", "B. Phenylketon niệu", "C. Turner", "D. Phenylketon niệu"], "answer": "B", "explain": "Phenylketon niệu do đột biến gene lặn trên NST thường; Down/Turner do đột biến số lượng NST."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Tác nhân hóa học nào sau đây có thể gây đột biến gene?", "options": ["A. Tia X", "B. 5-bromouracil (5-BU)", "C. Virus", "D. Tia tử ngoại"], "answer": "B", "explain": "5-bromouracil (5-BU), EMS, acridine là tác nhân hóa học gây đột biến gene (gây bắt cặp nhầm)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dạng đột biến gene ít ảnh hưởng nhất đến chuỗi polypeptide là:", "options": ["A. Đột biến dịch khung", "B. Đột biến đồng nghĩa", "C. Đột biến vô nghĩa", "D. Đột biến đồng nghĩa"], "answer": "B", "explain": "Đột biến đồng nghĩa không làm thay đổi amino acid nên ít ảnh hưởng nhất."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một gene bị mất 6 cặp nucleotide liên tiếp trong vùng mã hóa. Số amino acid bị mất đi (không tính dịch khung) là:", "options": ["A. 5", "B. 2", "C. 3", "D. 6"], "answer": "B", "explain": "Mất 6 cặp nu = mất 6//3 = 2 bộ ba → mất 2 aa, không gây dịch khung vì 6 chia hết cho 3."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Loại đột biến gene nào di truyền được cho thế hệ sau qua sinh sản hữu tính?", "options": ["A. Đột biến xoma", "B. Đột biến tiền giao tử", "C. Đột biến ở tế bào da", "D. Đột biến tiền giao tử"], "answer": "B", "explain": "Chỉ đột biến phát sinh ở tế bào sinh dục (tiền giao tử) mới đi vào giao tử và di truyền cho đời sau."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét nguyên nhân và tính chất của đột biến gene:", "statements": ["a) 5-BU là tác nhân hóa học gây đột biến.", "b) Virus là tác nhân sinh học gây đột biến.", "c) Tia X là tác nhân vật lí gây đột biến.", "d) Đột biến gene luôn định hướng theo nhu cầu sinh vật."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: đột biến vô hướng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét vai trò của đột biến gene:", "statements": ["a) Đột biến tạo allele mới làm phong phú vốn gene.", "b) Đột biến có lợi được chọn lọc tự nhiên giữ lại.", "c) Đột biến gene không có vai trò gì với tiến hóa.", "d) Nhiều giống cây trồng được tạo bằng gây đột biến."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: là nguyên liệu sơ cấp. d) Đúng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Tia tử ngoại thuộc nhóm tác nhân gây đột biến (điền: vật lí/hóa học/sinh học)", "answer": "vật lí", "explain": "Tia tử ngoại, tia X, tia gamma là tác nhân vật lí."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Năm Meselson và Stahl chứng minh tái bản bán bảo toàn là năm", "answer": "1958", "explain": "Năm 1958, Meselson và Stahl dùng N15/N14 chứng minh tái bản bán bảo toàn."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đột biến làm xuất hiện bộ ba kết thúc sớm trên mRNA được gọi là:", "options": ["A. Đột biến dịch khung", "B. Đột biến đồng nghĩa", "C. Đột biến vô nghĩa", "D. Đột biến sai nghĩa"], "answer": "C", "explain": "Xuất hiện bộ ba kết thúc (UAA/UAG/UGA) sớm → dịch mã dừng sớm → đột biến vô nghĩa."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Đột biến gene phát sinh có tính chất:", "options": ["A. Luôn có lợi", "B. Định hướng theo nhu cầu", "C. Vô hướng (ngẫu nhiên)", "D. Vô hướng (ngẫu nhiên)"], "answer": "C", "explain": "Đột biến phát sinh vô hướng, ngẫu nhiên, không định trước theo nhu cầu của sinh vật."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một gene có đoạn mã hóa: ATG-GGA-TTT. Sau đột biến, đoạn này là: ATG-GG-TTT. Đây là dạng đột biến gene nào?", "options": ["A. Đột biến đảo đoạn NST", "B. Đột biến thay thế một cặp nucleotide", "C. Đột biến mất một cặp nucleotide", "D. Đột biến thêm một cặp nucleotide"], "answer": "C", "explain": "So sánh hai trình tự thấy mất một cặp nucleotide → đột biến mất một cặp nucleotide."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Tác nhân sinh học có thể gây đột biến gene là:", "options": ["A. 5-bromouracil", "B. Virus", "C. Virus", "D. Tia tử ngoại"], "answer": "C", "explain": "Một số virus khi xâm nhập có thể chèn DNA vào hệ gene vật chủ gây đột biến."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một gene bị mất 1 cặp nucleotide ở bộ ba thứ 20 (tính từ đầu 5′). Số codon bị đọc sai kể từ vị trí đột biến (giả sử gene có tổng cộng 20 codon mã hóa) là:", "options": ["A. 40", "B. 20", "C. 19", "D. 18"], "answer": "C", "explain": "Mất 1 cặp nu gây dịch khung: toàn bộ các codon từ vị trí 20 trở đi đều đọc sai → có 20 − 1 = 19 codon bị ảnh hưởng."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hậu quả của đột biến vô nghĩa (xuất hiện bộ ba kết thúc sớm) là:", "options": ["A. Không thay đổi chuỗi", "B. Chuỗi polypeptide bị rút ngắn", "C. Chuỗi polypeptide bị rút ngắn", "D. Chuỗi polypeptide dài thêm"], "answer": "C", "explain": "Dịch mã dừng sớm tại bộ ba kết thúc mới → chuỗi polypeptide bị rút ngắn, thường mất chức năng."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về đột biến gene:", "statements": ["a) Đột biến gene làm thay đổi trình tự nucleotide của gene.", "b) Đột biến đồng nghĩa không đổi trình tự amino acid.", "c) Đột biến sai nghĩa đổi 1 aa thành aa khác.", "d) Đột biến vô nghĩa làm chuỗi polypeptide dài thêm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: vô nghĩa làm chuỗi bị rút ngắn."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét hậu quả của các dạng đột biến gene:", "statements": ["a) Thay thế 1 cặp nu chỉ ảnh hưởng 1 bộ ba.", "b) Mất 1 cặp nu ảnh hưởng toàn bộ codon phía sau.", "c) Thêm 1 cặp nu không ảnh hưởng gì.", "d) Đột biến ở intron thường ít ảnh hưởng hơn ở exon."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đ đúng. c) Sai: thêm 1 cặp gây dịch khung. d) Đúng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Một gene bị mất 4 cặp nucleotide. Đột biến này (điền: có/không) gây dịch khung đọc mã", "answer": "có", "explain": "Mất 4 cặp nu không chia hết cho 3 nên gây dịch khung."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Đột biến thay thế làm đổi một amino acid thành amino acid khác gọi là đột biến (điền tên)", "answer": "sai nghĩa", "explain": "Đột biến sai nghĩa đổi 1 aa thành aa khác."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Mục đích của gây đột biến nhân tạo trong chọn giống là:", "options": ["A. Tạo giống mới có đặc tính mong muốn", "B. Tiêu diệt hoàn toàn giống cũ", "C. Tăng số lượng NST", "D. Tạo giống mới có đặc tính mong muốn"], "answer": "D", "explain": "Gây đột biến tạo nguồn biến dị, từ đó chọn lọc được giống mới có đặc tính mong muốn."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Đột biến trung tính là đột biến:", "options": ["A. Đột biến trung tính không ảnh hưởng đến sức sống", "B. Luôn gây chết", "C. Luôn có lợi", "D. Đột biến trung tính không ảnh hưởng đến sức sống"], "answer": "D", "explain": "Đột biến trung tính (ví dụ đột biến đồng nghĩa) không ảnh hưởng đến sức sống sinh vật."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Tác nhân vật lí dùng để gây đột biến nhân tạo là:", "options": ["A. Tia gamma", "B. Ánh sáng trắng", "C. Âm thanh", "D. Tia gamma"], "answer": "D", "explain": "Tia gamma, tia X, tia tử ngoại là tác nhân vật lí gây đột biến, dùng trong chọn giống."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Về đột biến sai nghĩa, nhận định đúng là:", "options": ["A. Đột biến sai nghĩa có thể nhẹ hoặc nặng tùy vị trí", "B. Luôn gây chết", "C. Không bao giờ ảnh hưởng", "D. Đột biến sai nghĩa có thể nhẹ hoặc nặng tùy vị trí"], "answer": "D", "explain": "Thay 1 aa có thể không ảnh hưởng (aa tương tự) hoặc làm mất chức năng protein tùy vị trí quan trọng."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một gene bị mất 12 cặp nucleotide liên tiếp trong vùng mã hóa. Số amino acid bị mất đi (không tính dịch khung) là:", "options": ["A. 12", "B. 11", "C. 5", "D. 4"], "answer": "D", "explain": "Mất 12 cặp nu = mất 12//3 = 4 bộ ba → mất 4 aa, không gây dịch khung vì 12 chia hết cho 3."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Đột biến xoma là đột biến xảy ra ở:", "options": ["A. Tế bào sinh dưỡng", "B. Tế bào sinh dục", "C. Giao tử", "D. Tế bào sinh dưỡng"], "answer": "D", "explain": "Đột biến xoma xảy ra ở tế bào sinh dưỡng (xoma), không đi vào giao tử."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét nguyên nhân và tính chất của đột biến gene:", "statements": ["a) Tác nhân vật lí: tia tử ngoại, tia X, tia gamma.", "b) Tác nhân hóa học: 5-BU, EMS.", "c) Tác nhân sinh học: một số virus.", "d) Nhiệt độ thường không bao giờ gây đột biến."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 phát biểu đều đúng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét vai trò của đột biến gene:", "statements": ["a) Đột biến xoma không di truyền qua sinh sản hữu tính.", "b) Đột biến tiền giao tử di truyền cho đời sau.", "c) Đột biến xoma có thể gây ung thư.", "d) Đột biến gene luôn biểu hiện thành kiểu hình."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: đột biến lặn ở dị hợp không biểu hiện."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Hóa chất gây đột biến thường dùng trong chọn giống là (điền tên viết tắt)", "answer": "EMS", "explain": "EMS (ethyl methanesulfonate) là tác nhân hóa học gây đột biến."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Số liên kết hydrogen giữa A và T là", "answer": "2", "explain": "A liên kết với T bằng 2 liên kết hydrogen."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đột biến điểm là dạng đột biến gene liên quan đến:", "options": ["A. Thay thế, thêm hoặc mất một (một số) cặp nucleotide", "B. Mất cả một gene", "C. Đảo vị trí hai gene", "D. Thay thế, thêm hoặc mất một (một số) cặp nucleotide"], "answer": "A", "explain": "Đột biến điểm chỉ liên quan đến một hoặc một số cặp nucleotide (thay thế, thêm, mất)."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Nhận định đúng về tính chất biểu hiện của đột biến gene là:", "options": ["A. Đa số là đột biến lặn", "B. Mọi đột biến đều biểu hiện ngay", "C. Đột biến gene luôn là trội", "D. Đa số là đột biến lặn"], "answer": "A", "explain": "Đa số đột biến gene là lặn nên tồn tại ở trạng thái dị hợp mà không biểu hiện ra kiểu hình."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một gene có đoạn mã hóa: ATG-GGA-TTT. Sau đột biến, đoạn này là: AAG-GGA-TTT. Đây là dạng đột biến gene nào?", "options": ["A. Đột biến thay thế một cặp nucleotide", "B. Đột biến mất một cặp nucleotide", "C. Đột biến đảo đoạn NST", "D. Đột biến thêm một cặp nucleotide"], "answer": "A", "explain": "So sánh hai trình tự thấy thay thế một cặp nucleotide → đột biến thay thế một cặp nucleotide."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Tần số đột biến gene tự phát thường vào khoảng:", "options": ["A. 10^-6 đến 10^-9", "B. 10^-1 đến 10^-2", "C. 1 đến 10", "D. 10^-6 đến 10^-9"], "answer": "A", "explain": "Đột biến tự phát có tần số rất thấp, khoảng 10^-6 đến 10^-9 mỗi gene mỗi thế hệ."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một gene bị mất 1 cặp nucleotide ở bộ ba thứ 18 (tính từ đầu 5′). Số codon bị đọc sai kể từ vị trí đột biến (giả sử gene có tổng cộng 18 codon mã hóa) là:", "options": ["A. 17", "B. 16", "C. 36", "D. 18"], "answer": "A", "explain": "Mất 1 cặp nu gây dịch khung: toàn bộ các codon từ vị trí 18 trở đi đều đọc sai → có 18 − 1 = 17 codon bị ảnh hưởng."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Nhận định đúng về sự di truyền của đột biến gene là:", "options": ["A. Đột biến ở tế bào sinh dục mới di truyền cho đời sau qua sinh sản hữu tính", "B. Mọi đột biến gene đều di truyền cho đời sau", "C. Đột biến xoma di truyền cho con", "D. Đột biến ở tế bào sinh dục mới di truyền cho đời sau qua sinh sản hữu tính"], "answer": "A", "explain": "Chỉ đột biến phát sinh ở tế bào sinh dục (tiền giao tử) mới được di truyền qua sinh sản hữu tính."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về đột biến gene:", "statements": ["a) Đột biến gene có thể phát sinh tự phát.", "b) Đột biến gene có thể do tác nhân vật lí, hóa học, sinh học.", "c) Tần số đột biến tự phát rất thấp.", "d) Con người không thể chủ động gây đột biến gene."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: gây đột biến nhân tạo trong chọn giống."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét hậu quả của các dạng đột biến gene:", "statements": ["a) Đột biến làm xuất hiện bộ ba kết thúc sớm gây rút ngắn chuỗi.", "b) Chuỗi rút ngắn thường mất chức năng.", "c) Đột biến vô nghĩa luôn gây chết.", "d) Vị trí bộ ba kết thúc sớm càng gần đầu 5′ thì chuỗi càng ngắn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: không phải luôn gây chết. d) Đúng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Một gene bị mất 7 cặp nucleotide. Đột biến này (điền: có/không) gây dịch khung đọc mã", "answer": "có", "explain": "Mất 7 cặp nu không chia hết cho 3 nên gây dịch khung."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Đột biến thêm/mất số cặp nu không chia hết cho 3 gây (điền tên)", "answer": "dịch khung", "explain": "Thêm/mất số cặp không chia hết cho 3 gây dịch khung đọc mã."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Trong chọn giống, người ta chủ động sử dụng phương pháp nào để tạo nguồn biến dị?", "options": ["A. Lai xa", "B. Gây đột biến nhân tạo", "C. Giao phối cận huyết", "D. Nhân bản vô tính"], "answer": "B", "explain": "Gây đột biến nhân tạo (bằng tia phóng xạ, hóa chất...) tạo nguồn biến dị cho chọn giống."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Giá trị của một đột biến gene đối với sinh vật:", "options": ["A. Luôn trung tính", "B. Có thể có lợi, có hại hoặc trung tính", "C. Luôn có hại", "D. Luôn có lợi"], "answer": "B", "explain": "Một đột biến có thể có lợi, có hại hoặc trung tính tùy thuộc tổ hợp gene và điều kiện môi trường."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Hậu quả điển hình của đột biến dịch khung (mất 1 cặp nu) là:", "options": ["A. Chỉ ảnh hưởng vùng điều hòa", "B. Làm thay đổi toàn bộ trình tự amino acid từ điểm đột biến", "C. Chỉ làm thay đổi 1 amino acid", "D. Không làm thay đổi chuỗi polypeptide"], "answer": "B", "explain": "Dịch khung làm thay đổi cách đọc mọi codon từ điểm đột biến trở đi → thay đổi toàn bộ aa phía sau."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong các dạng đột biến gene sau, dạng nào thường gây hậu quả NHẸ nhất?", "options": ["A. Đột biến mất 4 cặp nucleotide", "B. Đột biến thay thế không làm xuất hiện bộ ba kết thúc", "C. Đột biến mất 1 cặp nucleotide", "D. Đột biến thêm 2 cặp nucleotide"], "answer": "B", "explain": "Đột biến thay thế (đặc biệt đồng nghĩa) chỉ ảnh hưởng 1 bộ ba nên thường nhẹ nhất; thêm/mất gây dịch khung nặng hơn."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một gene bị mất 6 cặp nucleotide liên tiếp trong vùng mã hóa. Số amino acid bị mất đi (không tính dịch khung) là:", "options": ["A. 3", "B. 2", "C. 6", "D. 5"], "answer": "B", "explain": "Mất 6 cặp nu = mất 6//3 = 2 bộ ba → mất 2 aa, không gây dịch khung vì 6 chia hết cho 3."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Nhận định đúng về đột biến gene xoma (ở tế bào sinh dưỡng) là:", "options": ["A. Đột biến gene không bao giờ được sửa chữa", "B. Đột biến ở tế bào sinh dưỡng không di truyền qua sinh sản hữu tính", "C. Mọi đột biến gene đều di truyền cho đời sau", "D. Đột biến xoma luôn gây ung thư"], "answer": "B", "explain": "Đột biến xoma chỉ tồn tại trong cơ thể mang nó, không di truyền qua sinh sản hữu tính."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét nguyên nhân và tính chất của đột biến gene:", "statements": ["a) Đột biến tự phát do sai sót ngẫu nhiên trong tái bản DNA.", "b) Tia tử ngoại là tác nhân vật lí gây đột biến gene.", "c) Mọi đột biến gene đều có hại cho sinh vật.", "d) Đa số đột biến gene là đột biến lặn."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: có thể có lợi/hại/trung tính. d) Đúng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét vai trò của đột biến gene:", "statements": ["a) Đột biến gene là nguồn nguyên liệu sơ cấp của tiến hóa.", "b) Gây đột biến nhân tạo được ứng dụng trong chọn giống.", "c) Đột biến gene là một nguyên nhân gây ung thư.", "d) Đột biến gene luôn được di truyền cho thế hệ sau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: chỉ đột biến tiền giao tử mới di truyền."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Tác nhân 5-bromouracil (5-BU) thuộc nhóm tác nhân gây đột biến (điền: vật lí/hóa học/sinh học)", "answer": "hóa học", "explain": "5-BU là chất đồng đẳng của thymine, gây bắt cặp nhầm → tác nhân hóa học."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Năm Watson và Crick công bố mô hình DNA là năm", "answer": "1953", "explain": "Năm 1953, Watson và Crick công bố mô hình xoắn kép của DNA (giải Nobel 1962)."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đột biến thay thế 1 cặp nu làm bộ ba mã hóa amino acid này thành bộ ba mã hóa amino acid khác được gọi là:", "options": ["A. Đột biến đồng nghĩa", "B. Đột biến vô nghĩa", "C. Đột biến sai nghĩa", "D. Đột biến dịch khung"], "answer": "C", "explain": "Thay thế làm đổi 1 aa thành aa khác gọi là đột biến sai nghĩa."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Tác nhân vật lí nào sau đây có thể gây đột biến gene?", "options": ["A. 5-bromouracil", "B. EMS", "C. Tia tử ngoại, tia X", "D. Virus"], "answer": "C", "explain": "Tia tử ngoại, tia X, tia gamma là tác nhân vật lí gây đột biến; 5-BU, EMS là tác nhân hóa học."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một gene có đoạn mã hóa: ATG-GGA-TTT. Sau đột biến, đoạn này là: ATG-GGA-ATTT. Đây là dạng đột biến gene nào?", "options": ["A. Đột biến thay thế một cặp nucleotide", "B. Đột biến mất một cặp nucleotide", "C. Đột biến thêm một cặp nucleotide", "D. Đột biến đảo đoạn NST"], "answer": "C", "explain": "So sánh hai trình tự thấy thêm một cặp nucleotide → đột biến thêm một cặp nucleotide."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Nguyên nhân gây đột biến gene tự phát là:", "options": ["A. Cố ý của sinh vật", "B. Do chọn lọc tự nhiên", "C. Sai sót ngẫu nhiên trong tái bản DNA", "D. Do giao phối"], "answer": "C", "explain": "Đột biến tự phát do sai sót ngẫu nhiên trong quá trình tái bản DNA (bắt cặp nhầm, trượt mạch...)."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một gene bị mất 1 cặp nucleotide ở bộ ba thứ 25 (tính từ đầu 5′). Số codon bị đọc sai kể từ vị trí đột biến (giả sử gene có tổng cộng 25 codon mã hóa) là:", "options": ["A. 25", "B. 23", "C. 24", "D. 50"], "answer": "C", "explain": "Mất 1 cặp nu gây dịch khung: toàn bộ các codon từ vị trí 25 trở đi đều đọc sai → có 25 − 1 = 24 codon bị ảnh hưởng."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Bệnh phenylketon niệu di truyền theo quy luật:", "options": ["A. Đột biến gene lặn trên NST thường", "B. Đột biến gene trội trên NST X", "C. Đột biến gene lặn trên NST thường", "D. Đột biến NST"], "answer": "C", "explain": "Phenylketon niệu do đột biến gene lặn trên NST thường gây thiếu enzyme chuyển hóa phenylalanine."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về đột biến gene:", "statements": ["a) Đột biến điểm chỉ liên quan đến một hoặc một số cặp nu.", "b) Đột biến thay thế không bao giờ gây hại.", "c) Thêm 3 cặp nu không gây dịch khung.", "d) Mất 2 cặp nu gây dịch khung."], "answer": ["T", "F", "T", "T"], "explain": "a) Đúng. b) Sai: thay thế có thể gây sai nghĩa/vô nghĩa. c) Đúng (trọn bộ ba). d) Đúng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét hậu quả của các dạng đột biến gene:", "statements": ["a) Đột biến sai nghĩa có thể làm mất chức năng protein.", "b) Đột biến vô nghĩa làm rút ngắn chuỗi polypeptide.", "c) Đột biến đồng nghĩa luôn vô hại tuyệt đối.", "d) Dịch khung thay đổi mọi aa từ điểm đột biến trở đi."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: đồng nghĩa thường nhẹ nhưng có thể ảnh hưởng (hiếm). d) Đúng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Một gene bị mất 10 cặp nucleotide. Đột biến này (điền: có/không) gây dịch khung đọc mã", "answer": "có", "explain": "Mất 10 cặp nu không chia hết cho 3 nên gây dịch khung."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Đột biến làm xuất hiện bộ ba kết thúc sớm được gọi là đột biến (điền tên)", "answer": "vô nghĩa", "explain": "Đột biến vô nghĩa tạo bộ ba kết thúc sớm → dịch mã dừng sớm."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đột biến gene lặn có hại sẽ biểu hiện khi:", "options": ["A. Ở trạng thái dị hợp", "B. Trong mọi trường hợp", "C. Có thể biểu hiện khi ở trạng thái đồng hợp lặn", "D. Có thể biểu hiện khi ở trạng thái đồng hợp lặn"], "answer": "D", "explain": "Allele lặn chỉ biểu hiện thành kiểu hình khi ở trạng thái đồng hợp lặn."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Một đột biến gene là có lợi hay có hại phụ thuộc vào:", "options": ["A. Chỉ phụ thuộc nhiệt độ", "B. Không phụ thuộc gì", "C. Phụ thuộc vào tổ hợp gene và môi trường", "D. Phụ thuộc vào tổ hợp gene và môi trường"], "answer": "D", "explain": "Giá trị của đột biến là tương đối, phụ thuộc tổ hợp gene mang nó và điều kiện môi trường."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Hóa chất nào sau đây được dùng để gây đột biến gene trong chọn giống?", "options": ["A. Nước cất", "B. Đường glucose", "C. EMS (ethyl methanesulfonate)", "D. EMS (ethyl methanesulfonate)"], "answer": "D", "explain": "EMS là tác nhân hóa học gây đột biến, được dùng trong gây đột biến nhân tạo."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Nhận định đúng về đột biến gene là:", "options": ["A. Mọi đột biến đều gây chết", "B. Đột biến luôn làm mất chức năng gene", "C. Đột biến ở vùng không mã hóa có thể không ảnh hưởng", "D. Đột biến ở vùng không mã hóa có thể không ảnh hưởng"], "answer": "D", "explain": "Đột biến ở intron hoặc vùng không quan trọng có thể không ảnh hưởng đến sản phẩm gene."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một gene bị mất 12 cặp nucleotide liên tiếp trong vùng mã hóa. Số amino acid bị mất đi (không tính dịch khung) là:", "options": ["A. 11", "B. 5", "C. 12", "D. 4"], "answer": "D", "explain": "Mất 12 cặp nu = mất 12//3 = 4 bộ ba → mất 4 aa, không gây dịch khung vì 12 chia hết cho 3."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Đột biến xoma có thể gây hậu quả:", "options": ["A. Luôn vô hại", "B. Di truyền cho con", "C. Có thể gây ung thư nếu làm rối loạn gene kiểm soát phân chia", "D. Có thể gây ung thư nếu làm rối loạn gene kiểm soát phân chia"], "answer": "D", "explain": "Đột biến xoma ở gene kiểm soát chu kì tế bào có thể gây ung thư cho chính cơ thể mang nó."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét nguyên nhân và tính chất của đột biến gene:", "statements": ["a) Đột biến phát sinh ngẫu nhiên, vô hướng.", "b) Giá trị của đột biến phụ thuộc môi trường.", "c) Đột biến lặn biểu hiện ngay ở trạng thái dị hợp.", "d) Đột biến có thể được sửa chữa bởi enzyme."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: lặn chỉ biểu hiện ở đồng hợp. d) Đúng (hệ thống sửa sai)."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét vai trò của đột biến gene:", "statements": ["a) Bệnh phenylketon niệu do đột biến gene.", "b) Bệnh hồng cầu hình liềm do đột biến gene.", "c) Mọi bệnh di truyền đều do đột biến NST.", "d) Tư vấn di truyền giúp hạn chế bệnh di truyền."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: có bệnh do đột biến gene. d) Đúng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Virus thuộc nhóm tác nhân gây đột biến (điền: vật lí/hóa học/sinh học)", "answer": "sinh học", "explain": "Một số virus là tác nhân sinh học gây đột biến."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Năm Jacob và Monod công bố operon lac là năm", "answer": "1961", "explain": "Năm 1961, Jacob và Monod công bố mô hình operon lac."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đột biến thay thế 1 cặp nu nhưng không làm thay đổi amino acid được gọi là:", "options": ["A. Đột biến đồng nghĩa", "B. Đột biến dịch khung", "C. Đột biến sai nghĩa", "D. Đột biến vô nghĩa"], "answer": "A", "explain": "Nhờ tính thoái hóa của mã di truyền, thay thế 1 cặp nu có thể không đổi aa → đột biến đồng nghĩa."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Vai trò của đột biến gene đối với tiến hóa là:", "options": ["A. Nguồn nguyên liệu sơ cấp của tiến hóa", "B. Làm giảm vốn gene", "C. Nguồn nguyên liệu thứ cấp", "D. Không có vai trò"], "answer": "A", "explain": "Đột biến gene tạo allele mới, làm phong phú vốn gene → nguồn nguyên liệu sơ cấp của tiến hóa."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một gene có đoạn mã hóa: ATG-GGA-TTT. Sau đột biến, đoạn này là: ATG-GGA-TT. Đây là dạng đột biến gene nào?", "options": ["A. Đột biến mất một cặp nucleotide", "B. Đột biến đảo đoạn NST", "C. Đột biến thay thế một cặp nucleotide", "D. Đột biến thêm một cặp nucleotide"], "answer": "A", "explain": "So sánh hai trình tự thấy mất một cặp nucleotide → đột biến mất một cặp nucleotide."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Đột biến nhân tạo khác đột biến tự phát ở điểm:", "options": ["A. Đột biến cảm ứng do con người chủ động gây ra", "B. Đột biến tự phát có tần số cao", "C. Đột biến cảm ứng do con người chủ động gây ra", "D. Đột biến nhân tạo luôn có lợi"], "answer": "A", "explain": "Đột biến nhân tạo (cảm ứng) do con người dùng tác nhân vật lí/hóa học chủ động gây ra."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một gene bị mất 1 cặp nucleotide ở bộ ba thứ 16 (tính từ đầu 5′). Số codon bị đọc sai kể từ vị trí đột biến (giả sử gene có tổng cộng 16 codon mã hóa) là:", "options": ["A. 15", "B. 32", "C. 16", "D. 14"], "answer": "A", "explain": "Mất 1 cặp nu gây dịch khung: toàn bộ các codon từ vị trí 16 trở đi đều đọc sai → có 16 − 1 = 15 codon bị ảnh hưởng."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một trong các nguyên nhân gây ung thư ở cấp độ phân tử là:", "options": ["A. Đột biến gene tiền ung thư hoặc gene ức chế khối u", "B. Mất hoàn toàn hệ gene", "C. Đột biến gene tiền ung thư hoặc gene ức chế khối u", "D. Đột biến làm tăng số lượng NST"], "answer": "A", "explain": "Đột biến hoạt hóa gene tiền ung thư hoặc bất hoạt gene ức chế khối u làm tế bào phân chia mất kiểm soát."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về đột biến gene:", "statements": ["a) Đột biến dịch khung do thêm/mất số cặp nu không chia hết cho 3.", "b) Đột biến dịch khung thường gây hậu quả nặng.", "c) Thay thế 1 cặp nu luôn gây dịch khung.", "d) Mất 6 cặp nu không gây dịch khung."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: thay thế không gây dịch khung. d) Đúng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét hậu quả của các dạng đột biến gene:", "statements": ["a) Bệnh hồng cầu hình liềm do đột biến thay thế 1 cặp nu.", "b) Đột biến thay thế GAG thành GTG đổi Glu thành Val.", "c) Mọi đột biến thay thế đều gây bệnh.", "d) Đột biến đồng nghĩa không đổi aa."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: có thể đồng nghĩa. d) Đúng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Một gene bị mất 13 cặp nucleotide. Đột biến này (điền: có/không) gây dịch khung đọc mã", "answer": "có", "explain": "Mất 13 cặp nu không chia hết cho 3 nên gây dịch khung."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Đột biến thay thế nhưng không đổi amino acid gọi là đột biến (điền tên)", "answer": "đồng nghĩa", "explain": "Nhờ tính thoái hóa, thay thế có thể không đổi aa → đột biến đồng nghĩa."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Thành tựu của gây đột biến nhân tạo trong chọn giống là:", "options": ["A. Lúa, ngô, đậu tương đột biến", "B. Lúa, ngô, đậu tương đột biến", "C. Lợn, gà, vịt đột biến", "D. Cá voi đột biến"], "answer": "B", "explain": "Nhiều giống lúa, ngô, đậu tương đột biến có năng suất, phẩm chất tốt đã được tạo ra."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Biện pháp hạn chế hậu quả của bệnh di truyền do đột biến gene là:", "options": ["A. Sàng lọc trước sinh và tư vấn di truyền", "B. Sàng lọc trước sinh và tư vấn di truyền", "C. Cấm kết hôn", "D. Không sinh con"], "answer": "B", "explain": "Tư vấn di truyền và sàng lọc trước sinh giúp phát hiện sớm, hạn chế sinh con mang bệnh di truyền."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cơ chế gây đột biến của 5-bromouracil là:", "options": ["A. Gây bắt cặp nhầm trong tái bản DNA", "B. Gây bắt cặp nhầm trong tái bản DNA", "C. Phá vỡ thành tế bào", "D. Ức chế phiên mã"], "answer": "B", "explain": "5-BU là chất đồng đẳng của thymine, gây bắt cặp nhầm A với G → đột biến thay thế."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dạng đột biến gene thường gây hậu quả nặng nề nhất là:", "options": ["A. Đột biến dịch khung", "B. Đột biến dịch khung", "C. Đột biến đồng nghĩa", "D. Đột biến thay thế đồng nghĩa"], "answer": "B", "explain": "Dịch khung thay đổi toàn bộ aa từ điểm đột biến → thường làm mất hoàn toàn chức năng protein."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một gene bị mất 21 cặp nucleotide liên tiếp trong vùng mã hóa. Số amino acid bị mất đi (không tính dịch khung) là:", "options": ["A. 21", "B. 7", "C. 20", "D. 8"], "answer": "B", "explain": "Mất 21 cặp nu = mất 21//3 = 7 bộ ba → mất 7 aa, không gây dịch khung vì 21 chia hết cho 3."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Đặc điểm của đột biến gene xoma là:", "options": ["A. Không di truyền qua sinh sản hữu tính nhưng có thể gây bệnh cho cơ thể mang nó", "B. Không di truyền qua sinh sản hữu tính nhưng có thể gây bệnh cho cơ thể mang nó", "C. Luôn di truyền cho con", "D. Không bao giờ gây hại"], "answer": "B", "explain": "Đột biến xoma không qua giao tử nên không di truyền, nhưng có thể gây ung thư/bệnh cho cơ thể mang nó."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét nguyên nhân và tính chất của đột biến gene:", "statements": ["a) Đột biến tự phát có tần số thấp.", "b) Con người có thể gây đột biến nhân tạo.", "c) Gây đột biến nhân tạo ứng dụng trong chọn giống.", "d) Mọi tác nhân môi trường đều gây đột biến gene."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: chỉ tác nhân gây tổn thương DNA."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét vai trò của đột biến gene:", "statements": ["a) Đột biến gene cung cấp nguyên liệu cho chọn giống.", "b) Đột biến gene cung cấp nguyên liệu cho tiến hóa.", "c) Đột biến gene là nguồn biến dị di truyền được.", "d) Đột biến gene không bao giờ có lợi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: có thể có lợi."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Tác nhân vật lí thường dùng để gây đột biến nhân tạo là (điền tên)", "answer": "tia X", "explain": "Tia X (cùng tia gamma, tử ngoại) dùng gây đột biến nhân tạo."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Số liên kết hydrogen giữa G và C là", "answer": "3", "explain": "G liên kết với C bằng 3 liên kết hydrogen."}]}]}
