<script type="application/json" class="saobay-exam10-data">
{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Mẫu vật thường dùng để tách chiết DNA trong thực hành vì chứa nhiều DNA là:", "options": ["A. Dâu tây (bát bội 8n)", "B. Lá lúa", "C. Củ cải", "D. Rễ cà rốt"], "answer": "A", "explain": "Dâu tây là cây bát bội (8n), mỗi tế bào chứa rất nhiều DNA nên dễ quan sát."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Dấu hiệu quan sát được khi DNA kết tủa là:", "options": ["A. Sợi trắng đục nổi ở mặt phân cách cồn – dịch lọc", "B. Dung dịch chuyển màu xanh", "C. Kết tủa đen dưới đáy", "D. Dung dịch trong suốt"], "answer": "A", "explain": "DNA kết tủa tạo khối sợi trắng đục tại mặt phân cách giữa lớp cồn và dịch lọc."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao phải dùng cồn 96° để lạnh mà không dùng cồn ở nhiệt độ thường?", "options": ["A. Cồn lạnh làm DNA kết tủa tốt hơn và hạn chế enzyme phân giải DNA", "B. Cồn nóng làm DNA tan tốt hơn", "C. Cồn ở nhiệt độ thường cho sợi DNA dài hơn", "D. Nhiệt độ cồn không ảnh hưởng"], "answer": "A", "explain": "Cồn lạnh làm giảm độ tan của DNA → DNA kết tủa tốt hơn; đồng thời hạn chế hoạt động của enzyme phân giải DNA."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "DNA thu được trong thực hành tách chiết là:", "options": ["A. DNA thô, còn lẫn protein và RNA", "B. DNA tinh sạch tuyệt đối", "C. Chỉ có protein", "D. Chỉ có RNA"], "answer": "A", "explain": "Đây là DNA thô, còn lẫn protein và RNA; muốn tinh sạch cần dùng protease loại protein, RNase loại RNA."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Giải thích vì sao dâu tây được chọn làm mẫu vật tách chiết DNA:", "options": ["A. Tế bào dâu tây có 8 bộ NST nên lượng DNA nhiều, dễ quan sát", "B. Dâu tây rẻ tiền", "C. Dâu tây có màu đỏ đẹp", "D. Dâu tây không có protein"], "answer": "A", "explain": "Dâu tây là cây bát bội (8n) nên mỗi tế bào chứa lượng DNA gấp nhiều lần tế bào lưỡng bội, dễ quan sát bằng mắt thường."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Kết luận đúng rút ra từ thực hành tách chiết DNA là:", "options": ["A. Sợi DNA thu được càng nhiều và rõ khi mẫu được nghiền càng nhuyễn và cồn càng lạnh", "B. Lượng DNA không phụ thuộc cách làm", "C. Nghiền thô cho nhiều DNA hơn", "D. Cồn ấm cho kết tủa đẹp hơn"], "answer": "A", "explain": "Nghiền càng nhuyễn → phá vỡ càng nhiều tế bào → giải phóng nhiều DNA; cồn càng lạnh → DNA kết tủa càng tốt."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét thực hành tách chiết DNA:", "statements": ["a) Mẫu vật thường dùng là dâu tây vì là cây bát bội, chứa nhiều DNA.", "b) Nước rửa chén trong dung dịch tách chiết có tác dụng phá vỡ màng tế bào.", "c) Muối ăn giúp tách protein khỏi DNA.", "d) DNA tan tốt trong cồn lạnh nên không kết tủa."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: DNA không tan trong cồn lạnh nên bị kết tủa."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các bước tiến hành tách chiết DNA:", "statements": ["a) Nghiền mẫu với dung dịch tách chiết để phá vỡ tế bào.", "b) Lọc hỗn hợp để loại bỏ mảnh tế bào, thu dịch lọc chứa DNA.", "c) Rót cồn 96° lạnh dọc thành cốc tạo lớp cồn nổi phía trên dịch lọc.", "d) DNA kết tủa sẽ chìm xuống đáy cốc."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: DNA nổi tại mặt phân cách."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Trong thực hành tách chiết DNA, hóa chất làm DNA kết tủa là cồn 96° (điền: lạnh/nóng)", "answer": "lạnh", "explain": "DNA không tan trong cồn lạnh nên bị kết tủa thành sợi trắng đục."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Dâu tây là cây đa bội với bộ NST là (điền: 8n/2n/4n)", "answer": "8n", "explain": "Dâu tây là cây bát bội (8n) nên mỗi tế bào chứa rất nhiều DNA."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Trình tự các bước chính của thực hành tách chiết DNA là:", "options": ["A. Ly tâm – điện di – nhuộm", "B. Nghiền – lọc – kết tủa bằng cồn lạnh", "C. Cắt – nối – chuyển gene", "D. Đun sôi – làm lạnh – sấy khô"], "answer": "B", "explain": "Nghiền mẫu với dung dịch tách chiết → lọc lấy dịch → kết tủa DNA bằng cồn lạnh → quan sát, thu DNA."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Trong bài này, DNA được tách chiết:", "options": ["A. Từ virus", "B. Từ tế bào thực vật", "C. Từ đất", "D. Từ tế bào thực vật"], "answer": "B", "explain": "DNA được tách từ tế bào thực vật (dâu tây, chuối...)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Nguyên nhân làm thu được ít DNA là:", "options": ["A. Dùng quá nhiều mẫu", "B. Nghiền chưa nhuyễn", "C. Cồn quá lạnh", "D. Nghiền chưa nhuyễn"], "answer": "B", "explain": "Nghiền chưa nhuyễn → ít tế bào bị phá vỡ → ít DNA được giải phóng."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Nếu dùng hành tây thay dâu tây để tách chiết DNA, cần lưu ý:", "options": ["A. Hành tây chỉ dùng quan sát NST", "B. Hành tây cũng dùng được nhưng cần nghiền kĩ hơn do thành tế bào cứng", "C. Hành tây làm hỏng cồn", "D. Hành tây không có DNA"], "answer": "B", "explain": "Hành tây có thành tế bào cứng hơn nên cần nghiền kĩ hơn để phá vỡ tế bào triệt để, giải phóng đủ DNA."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cách chuẩn bị cồn tốt nhất cho thực hành là:", "options": ["A. Đun nóng cồn", "B. Để cồn trong tủ lạnh trước khi dùng", "C. Pha loãng cồn", "D. Để cồn trong tủ lạnh trước khi dùng"], "answer": "B", "explain": "Cồn để lạnh sâu cho hiệu quả kết tủa DNA tốt nhất."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ý nghĩa của tách chiết DNA trong công nghệ di truyền là:", "options": ["A. Không liên quan", "B. Tách chiết DNA là bước đầu của nhiều kĩ thuật di truyền", "C. Chỉ để quan sát", "D. Tách chiết DNA là bước đầu của nhiều kĩ thuật di truyền"], "answer": "B", "explain": "Tách chiết DNA là bước đầu tiên để thực hiện PCR, điện di, tạo DNA tái tổ hợp..."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét kết quả và ý nghĩa thực hành:", "statements": ["a) Thực hành giúp quan sát DNA bằng mắt thường.", "b) Thực hành minh họa nguyên lí tách chiết DNA.", "c) Tách chiết DNA là bước đầu của công nghệ di truyền.", "d) Thực hành này không có ý nghĩa học tập."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: có ý nghĩa lớn."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các lưu ý khi làm thực hành:", "statements": ["a) Chọn quả chín mềm để dễ nghiền.", "b) Dùng đủ lượng dung dịch tách chiết.", "c) Rót cồn nhẹ dọc thành cốc.", "d) Nên đun nóng dịch lọc trước khi rót cồn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: không đun nóng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Mục đích của bước lọc là (điền cụm từ)", "answer": "loại bỏ mảnh tế bào", "explain": "Lọc để loại bỏ mảnh tế bào, thu dịch lọc chứa DNA."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "DNA kết tủa có dạng (điền mô tả)", "answer": "sợi trắng đục", "explain": "DNA kết tủa tạo khối sợi trắng đục."}]}, {"name": "Đề 3", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Hóa chất có tác dụng phá vỡ màng tế bào trong dung dịch tách chiết là:", "options": ["A. Đường", "B. Muối ăn", "C. Nước rửa chén", "D. Cồn 96°"], "answer": "C", "explain": "Chất tẩy rửa trong nước rửa chén phá vỡ màng tế bào (lipid, protein) để giải phóng DNA."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Mục đích của bước nghiền mẫu với dung dịch tách chiết là:", "options": ["A. Tạo màu đẹp", "B. Tiêu diệt vi khuẩn", "C. Phá vỡ thành tế bào và màng tế bào", "D. Làm chín mẫu vật"], "answer": "C", "explain": "Nghiền + chất tẩy rửa phá vỡ thành và màng tế bào để giải phóng DNA ra ngoài."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Giải thích hiện tượng DNA kết tủa khi gặp cồn lạnh:", "options": ["A. Cồn làm DNA nhân đôi", "B. Cồn làm biến tính hoàn toàn DNA", "C. DNA không tan trong cồn lạnh nên bị kết tủa", "D. Cồn tạo liên kết hydrogen với DNA"], "answer": "C", "explain": "DNA tan trong nước nhưng không tan trong cồn lạnh; khi thêm cồn lạnh, độ tan giảm đột ngột → DNA kết tủa thành sợi."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Enzyme dùng để loại protein khỏi DNA thô là:", "options": ["A. Lipase", "B. Protease", "C. Protease", "D. Amylase"], "answer": "C", "explain": "Protease phân giải protein giúp tách protein khỏi DNA."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "So với tế bào lưỡng bội (2n), tế bào dâu tây (8n) có lượng DNA:", "options": ["A. Ít hơn", "B. Lượng DNA gấp 4 lần tế bào lưỡng bội", "C. Lượng DNA gấp 4 lần tế bào lưỡng bội", "D. Bằng nhau"], "answer": "C", "explain": "8n gấp 4 lần 2n nên lượng DNA mỗi tế bào cũng gấp khoảng 4 lần."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ngoài kết tủa DNA, cồn lạnh còn có tác dụng:", "options": ["A. Không tác dụng gì", "B. Cồn lạnh đồng thời ức chế enzyme nuclease phân giải DNA", "C. Cồn lạnh đồng thời ức chế enzyme nuclease phân giải DNA", "D. Kích hoạt enzyme phân giải"], "answer": "C", "explain": "Nhiệt độ lạnh làm giảm hoạt động của enzyme nuclease, bảo vệ DNA khỏi bị phân giải."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét thực hành tách chiết DNA:", "statements": ["a) Dung dịch tách chiết gồm nước, muối và nước rửa chén.", "b) Nghiền mẫu giúp phá vỡ thành tế bào.", "c) Lọc giúp loại bỏ mảnh tế bào.", "d) DNA kết tủa chìm xuống đáy cốc."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: DNA nổi tại mặt phân cách."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các bước tiến hành tách chiết DNA:", "statements": ["a) Nên khuấy nhẹ khi pha dung dịch tách chiết.", "b) Sau khi rót cồn cần để yên 2–3 phút.", "c) Thu DNA bằng đũa thủy tinh.", "d) Nên dùng cồn ở nhiệt độ thường."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: phải dùng cồn lạnh."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Chất giúp tách protein khỏi DNA là (điền tên)", "answer": "muối ăn", "explain": "Muối ăn giúp tách protein histone khỏi DNA và làm DNA dễ kết tủa."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Sản phẩm thu được trong thực hành là (điền: DNA thô/DNA tinh sạch)", "answer": "DNA thô", "explain": "Sợi trắng đục là DNA thô, còn lẫn protein và RNA."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Dụng cụ dùng để lọc hỗn hợp sau khi nghiền là:", "options": ["A. Giấy nhám", "B. Bông gòn y tế", "C. Khăn giấy", "D. Vải lọc hoặc giấy lọc"], "answer": "D", "explain": "Dùng phễu với vải lọc hoặc giấy lọc để loại mảnh tế bào, thu dịch lọc chứa DNA."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Ý nghĩa học tập của bài thực hành là:", "options": ["A. Hiểu nguyên lí tách chiết DNA", "B. Thuộc lòng công thức", "C. Không có ý nghĩa", "D. Hiểu nguyên lí tách chiết DNA"], "answer": "D", "explain": "Thực hành giúp hiểu nguyên lí phá tế bào, kết tủa DNA – nền tảng của công nghệ di truyền."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Nguyên nhân làm màng tế bào chưa bị phá hết là:", "options": ["A. Cho quá ít dung dịch tách chiết", "B. Nghiền quá lâu", "C. Dùng cồn lạnh", "D. Cho quá ít dung dịch tách chiết"], "answer": "D", "explain": "Thiếu chất tẩy rửa → màng tế bào chưa bị phá triệt để → ít DNA giải phóng."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Mẫu lá cây có thể dùng để tách chiết DNA không?", "options": ["A. Lá cây non", "B. Không bao giờ", "C. Chỉ lá khô", "D. Lá cây non"], "answer": "D", "explain": "Lá cây non mềm, tế bào đang phân chia mạnh → chứa nhiều DNA, tách chiết được."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Để quan sát DNA rõ, dịch lọc cần:", "options": ["A. Lọc kĩ để dịch lọc trong", "B. Để lẫn nhiều bã", "C. Không cần lọc", "D. Lọc kĩ để dịch lọc trong"], "answer": "D", "explain": "Dịch lọc trong, ít bã giúp quan sát khối sợi DNA kết tủa rõ ràng hơn."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Nhận định đúng là:", "options": ["A. Mỗi tế bào chứa DNA nên mọi mẫu sinh vật đều tách được DNA", "B. Chỉ thực vật mới có DNA", "C. Động vật không có DNA", "D. Mỗi tế bào chứa DNA nên mọi mẫu sinh vật đều tách được DNA"], "answer": "D", "explain": "Mọi tế bào sinh vật đều chứa DNA → đều có thể tách chiết DNA."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét kết quả và ý nghĩa thực hành:", "statements": ["a) Mọi tế bào sinh vật đều chứa DNA.", "b) Cùng nguyên lí tách chiết áp dụng cho nhiều mẫu.", "c) Tách chiết DNA ứng dụng trong pháp y, y học.", "d) Chỉ phòng thí nghiệm hiện đại mới tách được DNA."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: làm được ở trường học."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các lưu ý khi làm thực hành:", "statements": ["a) Có thể làm theo nhóm để so sánh kết quả.", "b) Nên thử với nhiều loại mẫu khác nhau.", "c) Ghi lại hiện tượng quan sát được.", "d) Bỏ qua bước lọc cũng không sao."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bước lọc quan trọng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Khi pha dung dịch tách chiết cần khuấy nhẹ để (điền cụm từ)", "answer": "tránh tạo bọt", "explain": "Khuấy nhẹ tránh tạo bọt làm khó quan sát và lẫn tạp chất."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "DNA thu được trong thực hành là DNA (điền: thô/tinh sạch)", "answer": "thô", "explain": "Đây là DNA thô, còn lẫn tạp chất."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Ngoài dâu tây, mẫu vật nào sau đây cũng có thể dùng để tách chiết DNA?", "options": ["A. Chuối chín", "B. Chuối chín", "C. Nhựa cây", "D. Đá cuội"], "answer": "A", "explain": "Chuối chín mềm, dễ nghiền, tế bào chứa nhiều DNA; nguyên lí tách chiết tương tự."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Mục đích của việc rót nhẹ cồn dọc thành cốc là:", "options": ["A. Tạo lớp cồn nổi phía trên dịch lọc", "B. Trộn đều cồn với dịch lọc", "C. Làm nóng dịch lọc", "D. Tạo lớp cồn nổi phía trên dịch lọc"], "answer": "A", "explain": "Rót nhẹ tạo lớp cồn nổi phía trên; DNA kết tủa tại mặt phân cách hai lớp."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Khi pha dung dịch tách chiết cần:", "options": ["A. Khuấy nhẹ, tránh tạo bọt", "B. Khuấy mạnh tạo nhiều bọt", "C. Đun sôi dung dịch", "D. Khuấy nhẹ, tránh tạo bọt"], "answer": "A", "explain": "Khuấy mạnh tạo nhiều bọt (do chất tẩy rửa) làm khó quan sát DNA kết tủa và dễ lẫn tạp chất."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Kĩ thuật thu DNA tinh sạch từ dung dịch là:", "options": ["A. Kết tủa phân đoạn", "B. Đun sôi", "C. Sấy khô", "D. Kết tủa phân đoạn"], "answer": "A", "explain": "Kết tủa phân đoạn bằng cồn ở các nồng độ khác nhau giúp tách DNA tinh sạch."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Ngoài đa bội, dâu tây còn có ưu điểm:", "options": ["A. Quả mềm, dễ nghiền", "B. Quả cứng", "C. Không có nước", "D. Quả mềm, dễ nghiền"], "answer": "A", "explain": "Dâu tây chín mềm, dễ nghiền nhuyễn để phá vỡ tế bào."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Nhận định đúng về sản phẩm của thực hành là:", "options": ["A. DNA kết tủa là DNA thô cần được làm sạch thêm", "B. Đã là DNA tinh sạch tuyệt đối", "C. Không phải DNA", "D. DNA kết tủa là DNA thô cần được làm sạch thêm"], "answer": "A", "explain": "Sợi trắng đục là DNA thô lẫn protein, RNA; muốn tinh sạch cần xử lí thêm."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét thực hành tách chiết DNA:", "statements": ["a) Sợi trắng đục thu được chính là DNA.", "b) Có thể dùng đũa thủy tinh để cuốn sợi DNA.", "c) DNA thu được là DNA thô.", "d) Không thể tách DNA từ chuối chín."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: chuối chín cũng tách được."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các bước tiến hành tách chiết DNA:", "statements": ["a) Dịch lọc chứa DNA và các chất hòa tan.", "b) Mặt phân cách là nơi DNA kết tủa.", "c) Sợi DNA có thể cuốn bằng đũa thủy tinh.", "d) Sau thực hành thu được DNA tinh sạch tuyệt đối."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: chỉ là DNA thô."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Dụng cụ dùng để cuốn sợi DNA kết tủa là (điền tên)", "answer": "đũa thủy tinh", "explain": "Dùng đũa thủy tinh khuấy nhẹ tại mặt phân cách để cuốn sợi DNA."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Sau khi rót cồn cần để yên khoảng (điền thời gian) cho DNA kết tủa", "answer": "2–3 phút", "explain": "Để yên 2–3 phút cho DNA kết tủa hoàn toàn tại mặt phân cách."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Bài thực hành này giúp học sinh rèn kĩ năng:", "options": ["A. Điện di protein", "B. Tách chiết DNA", "C. Quan sát NST", "D. Nuôi cấy mô"], "answer": "B", "explain": "Thực hành rèn kĩ năng tách chiết DNA từ tế bào và quan sát DNA bằng mắt thường."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Mục tiêu của bài thực hành tách chiết DNA là:", "options": ["A. Giải trình tự DNA", "B. Quan sát được DNA bằng mắt thường", "C. Quan sát được DNA bằng mắt thường", "D. Đo chính xác khối lượng DNA"], "answer": "B", "explain": "Thực hành giúp học sinh tách chiết và quan sát được DNA bằng mắt thường."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Vì sao khi pha dung dịch tách chiết cần khuấy nhẹ, tránh tạo bọt?", "options": ["A. Khuấy mạnh không ảnh hưởng", "B. Khuấy mạnh tạo bọt làm khó quan sát và lẫn tạp chất", "C. Khuấy mạnh làm DNA tan hết", "D. Khuấy mạnh làm cồn bay hơi"], "answer": "B", "explain": "Khuấy mạnh tạo nhiều bọt (do chất tẩy rửa) làm khó quan sát DNA kết tủa và dễ lẫn tạp chất."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Ngoài dâu tây, có thể dùng chuối chín để tách chiết DNA vì:", "options": ["A. Chuối làm DNA bị phân giải", "B. Chuối chín cũng có thể dùng vì mềm, dễ nghiền và nhiều DNA", "C. Chỉ dâu tây mới có DNA", "D. Chuối không có tế bào"], "answer": "B", "explain": "Chuối chín mềm, dễ nghiền, tế bào chứa nhiều DNA; nguyên lí tách chiết áp dụng được cho nhiều loại mẫu thực vật."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Muốn thu được nhiều DNA hơn trong thực hành, nên:", "options": ["A. Bỏ qua bước lọc", "B. Tăng lượng mẫu và nghiền kĩ hơn", "C. Tăng lượng mẫu và nghiền kĩ hơn", "D. Giảm lượng mẫu"], "answer": "B", "explain": "Nhiều mẫu + nghiền kĩ → phá vỡ nhiều tế bào → giải phóng nhiều DNA."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Vì sao cùng một phương pháp tách chiết áp dụng được cho nhiều loài?", "options": ["A. Ngẫu nhiên", "B. DNA của mọi loài đều có cấu trúc tương tự nên tách chiết theo cùng nguyên lí", "C. DNA của mọi loài đều có cấu trúc tương tự nên tách chiết theo cùng nguyên lí", "D. Mọi loài đều là dâu tây"], "answer": "B", "explain": "DNA của mọi sinh vật đều là chuỗi polynucleotide → cùng tính chất tan/kết tủa → cùng nguyên lí tách chiết."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét kết quả và ý nghĩa thực hành:", "statements": ["a) Sợi trắng đục thu được bằng đũa thủy tinh chính là DNA đã kết tủa.", "b) DNA thu được là DNA thô, còn lẫn protein và RNA.", "c) Dùng cồn lạnh giúp DNA kết tủa tốt hơn và hạn chế enzyme phân giải DNA.", "d) Không thể tách chiết DNA từ các loại quả khác ngoài dâu tây."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: có thể dùng chuối, hành tây... với nguyên lí tương tự."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các lưu ý khi làm thực hành:", "statements": ["a) Khi pha dung dịch tách chiết nên khuấy nhẹ, tránh tạo bọt.", "b) Sau khi rót cồn cần để yên 2–3 phút cho DNA kết tủa.", "c) Nên dùng cồn ở nhiệt độ thường để DNA kết tủa nhanh.", "d) Nghiền mẫu càng nhuyễn thì thu được càng nhiều DNA."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: phải dùng cồn lạnh. d) Đúng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Mục đích của bước nghiền mẫu là (điền cụm từ)", "answer": "phá vỡ tế bào", "explain": "Nghiền mẫu để phá vỡ thành tế bào và màng tế bào, giải phóng DNA."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Dâu tây là cây (điền: lưỡng bội/bát bội)", "answer": "bát bội", "explain": "Dâu tây là cây bát bội (8n)."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Hóa chất làm DNA kết tủa trong thực hành tách chiết là:", "options": ["A. Nước cất", "B. Dầu ăn", "C. Cồn 96° lạnh", "D. Nước muối loãng"], "answer": "C", "explain": "DNA không tan trong cồn lạnh nên bị kết tủa thành sợi trắng đục nổi lên."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Cách thu DNA đã kết tủa là:", "options": ["A. Đổ bỏ toàn bộ", "B. Đun sôi dung dịch", "C. Cuốn sợi DNA bằng đũa thủy tinh", "D. Lọc qua giấy"], "answer": "C", "explain": "Dùng đũa thủy tinh khuấy nhẹ theo vòng tròn tại mặt phân cách để cuốn sợi DNA lên."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Kĩ thuật rót cồn đúng trong thực hành tách chiết DNA là:", "options": ["A. Đổ mạnh cồn vào giữa cốc", "B. Đun nóng cồn trước khi rót", "C. Rót nhẹ cồn dọc thành cốc để tạo lớp cồn nổi phía trên", "D. Trộn đều cồn với dịch lọc"], "answer": "C", "explain": "Nghiêng cốc, rót nhẹ cồn lạnh dọc thành cốc để tạo lớp cồn nổi phía trên dịch lọc; DNA kết tủa tại mặt phân cách."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Để thu được DNA tinh sạch hơn từ DNA thô, cần:", "options": ["A. Đun sôi dung dịch", "B. Thêm nhiều muối hơn", "C. Dùng enzyme protease để loại protein", "D. Lọc nhiều lần"], "answer": "C", "explain": "Dùng protease phân giải protein và RNase phân giải RNA, sau đó kết tủa phân đoạn để thu DNA tinh sạch."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Dâu tây là cây đa bội với bộ NST là:", "options": ["A. 2n (lưỡng bội)", "B. 4n (tứ bội)", "C. 8n (bát bội)", "D. 3n (tam bội)"], "answer": "C", "explain": "Dâu tây là cây bát bội (8n)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Mối quan hệ giữa lượng DNA và độ rõ của kết tủa là:", "options": ["A. Nồng độ DNA trong dịch lọc càng cao thì kết tủa càng rõ", "B. Không liên quan", "C. Nồng độ DNA trong dịch lọc càng cao thì kết tủa càng rõ", "D. Tỉ lệ nghịch"], "answer": "C", "explain": "Dịch lọc càng giàu DNA thì khối sợi kết tủa càng lớn, càng dễ quan sát."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét thực hành tách chiết DNA:", "statements": ["a) Dâu tây là cây bát bội (8n).", "b) Chất tẩy rửa phá vỡ màng tế bào giải phóng DNA.", "c) Muối giúp DNA dễ kết tủa hơn.", "d) Cồn nóng làm DNA kết tủa tốt nhất."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: phải dùng cồn lạnh."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các bước tiến hành tách chiết DNA:", "statements": ["a) Bước 1: pha dung dịch tách chiết (nước + muối + nước rửa chén).", "b) Bước 2: nghiền mẫu với dung dịch tách chiết.", "c) Bước 3: lọc lấy dịch lọc.", "d) Bước 4: đun sôi dịch lọc."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bước 4 là rót cồn lạnh để kết tủa."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Chất có tác dụng phá vỡ màng tế bào trong dung dịch tách chiết là (điền tên)", "answer": "nước rửa chén", "explain": "Chất tẩy rửa trong nước rửa chén phá vỡ màng tế bào (lipid, protein)."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "DNA kết tủa xuất hiện tại vị trí (điền vị trí)", "answer": "mặt phân cách cồn – dịch lọc", "explain": "DNA kết tủa nổi thành sợi trắng đục tại mặt phân cách giữa lớp cồn và dịch lọc."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Dụng cụ dùng để nghiền mẫu vật trong thực hành là:", "options": ["A. Máy ly tâm", "B. Tủ ấm", "C. Kính hiển vi", "D. Cối và chày sứ"], "answer": "D", "explain": "Dùng cối và chày sứ nghiền nhuyễn mẫu với dung dịch tách chiết."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Ưu điểm của phương pháp tách chiết DNA thủ công là:", "options": ["A. Cho DNA tinh sạch tuyệt đối", "B. Rất nhanh", "C. An toàn, dễ thực hiện ở trường học", "D. An toàn, dễ thực hiện ở trường học"], "answer": "D", "explain": "Phương pháp dùng nguyên liệu an toàn, dễ kiếm, thực hiện được ở phòng thí nghiệm trường học."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Nguyên nhân làm DNA kết tủa kém là:", "options": ["A. Dùng quá nhiều muối", "B. Lọc quá kĩ", "C. Cồn chưa đủ lạnh", "D. Cồn chưa đủ lạnh"], "answer": "D", "explain": "Cồn chưa đủ lạnh → DNA vẫn còn tan một phần → kết tủa kém, khó quan sát."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Loại quả nào sau đây cũng có thể dùng để tách chiết DNA?", "options": ["A. Đá sỏi", "B. Túi nilon", "C. Cà chua chín", "D. Cà chua chín"], "answer": "D", "explain": "Cà chua chín mềm, nhiều nước, tế bào chứa DNA → tách chiết được theo nguyên lí tương tự."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Chọn mẫu vật thế nào để dễ tách chiết?", "options": ["A. Dùng quả xanh cứng", "B. Dùng quả dập nát", "C. Dùng dâu tây chín mềm", "D. Dùng dâu tây chín mềm"], "answer": "D", "explain": "Quả chín mềm dễ nghiền nhuyễn, tế bào dễ bị phá vỡ."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ứng dụng thực tế của tách chiết DNA là:", "options": ["A. Chỉ dùng trong trường học", "B. Không có ứng dụng", "C. Có thể tách chiết DNA từ máu, tóc, nước bọt trong pháp y", "D. Có thể tách chiết DNA từ máu, tóc, nước bọt trong pháp y"], "answer": "D", "explain": "Tách chiết DNA từ mẫu sinh học được ứng dụng trong pháp y, y học, nghiên cứu."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét kết quả và ý nghĩa thực hành:", "statements": ["a) DNA thô có thể làm sạch bằng protease và RNase.", "b) Protease loại bỏ protein khỏi DNA thô.", "c) RNase loại bỏ RNA khỏi DNA thô.", "d) DNA thô đã đủ tinh sạch để giải trình tự."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cần làm sạch thêm."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các lưu ý khi làm thực hành:", "statements": ["a) Vệ sinh dụng cụ trước khi làm.", "b) Làm việc cẩn thận tránh đổ hóa chất.", "c) Quan sát và ghi chép kết quả.", "d) Không cần tuân thủ các bước."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: phải tuân thủ quy trình."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Mục đích của việc rót cồn lạnh là (điền cụm từ)", "answer": "kết tủa DNA", "explain": "Cồn lạnh làm DNA kết tủa thành sợi trắng đục."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Đũa dùng để cuốn DNA làm bằng chất liệu (điền tên)", "answer": "thủy tinh", "explain": "Dùng đũa thủy tinh để cuốn sợi DNA."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Thành phần giúp tách protein khỏi DNA trong dung dịch tách chiết là:", "options": ["A. Muối ăn", "B. Bột ngọt", "C. Đường", "D. Giấm"], "answer": "A", "explain": "Muối ăn giúp tách protein histone khỏi DNA và làm DNA dễ kết tủa hơn."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Mục đích của bước lọc hỗn hợp là:", "options": ["A. Loại bỏ mảnh tế bào", "B. Tạo bọt", "C. Loại bỏ DNA", "D. Thêm protein"], "answer": "A", "explain": "Lọc bỏ mảnh tế bào, thu dịch lọc chứa DNA."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Sau khi rót cồn lạnh vào dịch lọc, cần:", "options": ["A. Để yên 2–3 phút cho DNA kết tủa hoàn toàn", "B. Thêm nước vào", "C. Lắc mạnh ngay lập tức", "D. Đun nóng cốc"], "answer": "A", "explain": "Để yên 2–3 phút cho DNA kết tủa hoàn toàn tại mặt phân cách rồi mới thu bằng đũa thủy tinh."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Enzyme dùng để loại RNA khỏi DNA thô là:", "options": ["A. RNase", "B. Ligase", "C. RNase", "D. Protease"], "answer": "A", "explain": "RNase phân giải RNA giúp thu DNA tinh sạch hơn."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Ưu điểm của việc dùng mẫu có nhiều DNA là:", "options": ["A. Dễ quan sát bằng mắt thường", "B. Không cần cồn", "C. Dễ quan sát bằng mắt thường", "D. DNA tinh sạch hơn"], "answer": "A", "explain": "Lượng DNA lớn tạo khối sợi rõ, dễ quan sát bằng mắt thường."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Vai trò của muối trong kết tủa DNA là:", "options": ["A. Muối càng đủ thì DNA càng dễ kết tủa", "B. Muối không cần thiết", "C. Muối càng đủ thì DNA càng dễ kết tủa", "D. Muối làm DNA tan"], "answer": "A", "explain": "Ion muối trung hòa điện tích âm của DNA, giúp các phân tử DNA dễ kết tụ và kết tủa trong cồn."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét thực hành tách chiết DNA:", "statements": ["a) Cồn 96° phải được để lạnh trước khi dùng.", "b) Rót cồn nhẹ dọc thành cốc tạo hai lớp riêng biệt.", "c) DNA kết tủa tại mặt phân cách cồn – dịch lọc.", "d) Nên khuấy mạnh để DNA kết tủa nhanh."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: khuấy nhẹ, tránh tạo bọt."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các bước tiến hành tách chiết DNA:", "statements": ["a) Nghiền càng nhuyễn thì thu được càng nhiều DNA.", "b) Lọc kĩ giúp quan sát DNA rõ hơn.", "c) Cồn càng lạnh thì DNA kết tủa càng tốt.", "d) Rót cồn mạnh vào giữa cốc cho nhanh."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: rót nhẹ dọc thành cốc."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Mẫu vật bát bội thường dùng trong thực hành là (điền tên)", "answer": "dâu tây", "explain": "Dâu tây là cây bát bội (8n), chứa nhiều DNA."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Enzyme dùng để loại protein khỏi DNA thô là (điền tên)", "answer": "protease", "explain": "Protease phân giải protein giúp thu DNA sạch hơn."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Dụng cụ dùng để cuốn sợi DNA kết tủa là:", "options": ["A. Đũa thủy tinh", "B. Đũa thủy tinh", "C. Kẹp gắp", "D. Thìa inox"], "answer": "B", "explain": "Dùng đũa thủy tinh khuấy nhẹ tại mặt phân cách để cuốn sợi DNA lên."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Bài thực hành góp phần:", "options": ["A. Rèn kĩ năng thực hành sinh học", "B. Rèn kĩ năng thực hành sinh học", "C. Thay thế lí thuyết", "D. Giảm giờ học"], "answer": "B", "explain": "Thực hành rèn kĩ năng thao tác, quan sát và giải thích hiện tượng sinh học."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Lỗi kĩ thuật khi rót cồn là:", "options": ["A. Rót cồn quá mạnh làm trộn lẫn hai lớp", "B. Rót cồn quá mạnh làm trộn lẫn hai lớp", "C. Rót cồn dọc thành cốc", "D. Dùng cồn lạnh"], "answer": "B", "explain": "Rót mạnh làm cồn trộn lẫn với dịch lọc → không tạo được mặt phân cách rõ → khó thu DNA."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Điểm chung khi tách chiết DNA từ các mẫu thực vật khác nhau là:", "options": ["A. Nguyên lí chung: phá tế bào – kết tủa DNA bằng cồn lạnh", "B. Nguyên lí chung: phá tế bào – kết tủa DNA bằng cồn lạnh", "C. Mỗi mẫu một nguyên lí riêng", "D. Không có điểm chung"], "answer": "B", "explain": "Mọi mẫu thực vật đều áp dụng nguyên lí: phá vỡ tế bào giải phóng DNA rồi kết tủa bằng cồn lạnh."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Thời điểm thu DNA tốt nhất là:", "options": ["A. Thu DNA ngay khi kết tủa vừa xuất hiện", "B. Thu DNA ngay khi kết tủa vừa xuất hiện", "C. Để qua đêm mới thu", "D. Thu trước khi rót cồn"], "answer": "B", "explain": "Thu ngay khi sợi DNA vừa kết tủa rõ để tránh DNA bị phân giải hoặc lẫn tạp chất."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Mối quan hệ giữa mức độ nghiền mẫu và lượng DNA là:", "options": ["A. Lượng DNA thu được tỉ lệ với số tế bào bị phá vỡ", "B. Lượng DNA thu được tỉ lệ với số tế bào bị phá vỡ", "C. Không liên quan", "D. Tỉ lệ nghịch"], "answer": "B", "explain": "Nghiền càng kĩ → càng nhiều tế bào bị phá vỡ → càng nhiều DNA được giải phóng."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét kết quả và ý nghĩa thực hành:", "statements": ["a) Lượng DNA thu được phụ thuộc số tế bào bị phá vỡ.", "b) Nghiền kĩ giúp giải phóng nhiều DNA.", "c) Mẫu đa bội cho nhiều DNA hơn.", "d) Cách làm không ảnh hưởng lượng DNA thu được."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: cách làm ảnh hưởng lớn."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các lưu ý khi làm thực hành:", "statements": ["a) Đũa thủy tinh sạch giúp cuốn DNA dễ.", "b) Thu DNA khi sợi vừa kết tủa rõ.", "c) Để lâu DNA có thể bị phân giải.", "d) DNA kết tủa để mãi không thay đổi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: để lâu dễ bị phân giải, lẫn tạp."}, {"type": "short", "level": "VD", "points": 0.5, "q": "DNA không tan trong (điền tên hóa chất) nên bị kết tủa", "answer": "cồn lạnh", "explain": "DNA không tan trong cồn lạnh nên bị kết tủa."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cồn dùng trong thực hành phải được để (điền: lạnh/nóng)", "answer": "lạnh", "explain": "Cồn phải để lạnh để DNA kết tủa tốt và hạn chế enzyme phân giải."}]}]}
