e", "B. Ty thể", "C. Ty thể", "D. Lục lạp"], "answer": "C", "explain": "Ty thể chứa gene ngoài nhân mã hóa protein hô hấp."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Di truyền gene ngoài nhân được phát hiện năm:", "options": ["A. 1953", "B. 1909", "C. 1909", "D. 1865"], "answer": "C", "explain": "Correns công bố năm 1909."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dấu hiệu nhận biết di truyền ngoài nhân là:", "options": ["A. Không lai được", "B. Lai thuận – nghịch khác nhau", "C. Lai thuận – nghịch khác nhau", "D. Lai thuận – nghịch giống nhau"], "answer": "C", "explain": "Gene ngoài nhân: lai thuận – nghịch cho kết quả khác nhau."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Hiện tượng con giống mẹ gọi là:", "options": ["A. Di truyền chéo", "B. Di truyền tế bào chất", "C. Di truyền tế bào chất", "D. Di truyền liên kết"], "answer": "C", "explain": "Di truyền tế bào chất = di truyền ngoài nhân = theo dòng mẹ."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cây hoa phấn ♀ lá trắng × ♂ lá xanh. Kiểu hình F1:", "options": ["A. Trung gian", "B. Giống mẹ", "C. Giống mẹ", "D. Giống bố"], "answer": "C", "explain": "Di truyền ngoài nhân → con giống mẹ (lá trắng)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Màu lá đốm ở cây hoa phấn do gene trong:", "options": ["A. Nhân từ mẹ", "B. Lục lạp từ mẹ", "C. Lục lạp từ mẹ", "D. Nhân từ bố"], "answer": "C", "explain": "Gene quy định màu lá nằm trong lục lạp, nhận từ mẹ."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về gene ngoài nhân:", "statements": ["a) Hợp tử nhận tế bào chất chủ yếu từ trứng.", "b) Tinh trùng hầu như không góp tế bào chất.", "c) Con luôn giống mẹ về tính trạng ngoài nhân.", "d) Bố truyền gene ty thể cho con."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét thí nghiệm của Correns trên cây hoa phấn:", "statements": ["a) Cây lá đốm có cả lục lạp bình thường và đột biến.", "b) Khi phân bào, lục lạp phân phối ngẫu nhiên.", "c) Cây toàn lá trắng không sống độc lập được.", "d) Mọi tế bào lá đốm đều giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: phân phối ngẫu nhiên."}, {"type": "short", "level": "VD", "points": 0.5, "q": "DNA trong ty thể có dạng (điền: vòng/thẳng)", "answer": "vòng", "explain": "DNA dạng vòng."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Tính trạng do gene ngoài nhân di truyền theo (điền: bố/mẹ)", "answer": "mẹ", "explain": "Theo dòng mẹ."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Ty thể và lục lạp nằm ở:", "options": ["A. Tế bào chất", "B. Trong nhân", "C. Trên màng", "D. Tế bào chất"], "answer": "D", "explain": "Ty thể/lục lạp là bào quan trong tế bào chất."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Bệnh ty thể thường gây:", "options": ["A. Rối loạn hô hấp tế bào", "B. Rối loạn quang hợp", "C. Không triệu chứng", "D. Rối loạn hô hấp tế bào"], "answer": "D", "explain": "Ty thể tạo năng lượng → bệnh ty thể gây rối loạn năng lượng."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Nghiên cứu di truyền ngoài nhân cần:", "options": ["A. Theo dõi nhiều thế hệ", "B. Một thế hệ", "C. Không cần lai", "D. Theo dõi nhiều thế hệ"], "answer": "D", "explain": "Theo dõi dòng mẹ qua nhiều thế hệ."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cây lá đốm chứa:", "options": ["A. Lục lạp bình thường và đột biến", "B. Chỉ lục lạp đột biến", "C. Không có lục lạp", "D. Lá đốm có cả lục lạp bình thường và đột biến"], "answer": "D", "explain": "Lá đốm: tế bào có cả hai loại lục lạp (phân phối ngẫu nhiên)."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Bất dục đực tế bào chất ứng dụng ở:", "options": ["A. Lúa lai, ngô lai", "B. Cây ăn quả", "C. Rau màu", "D. Lúa lai, ngô lai"], "answer": "D", "explain": "Dùng trong sản xuất hạt giống lúa lai, ngô lai."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Có thể chuyển gene ty thể từ bố sang con không?", "options": ["A. Không thể", "B. Dễ dàng", "C. Luôn được", "D. Không thể"], "answer": "D", "explain": "Tinh trùng hầu như không góp tế bào chất → không truyền gene ty thể."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét đặc điểm di truyền ngoài nhân:", "statements": ["a) Mẹ bị bệnh ty thể → con có nguy cơ mắc.", "b) Bố bị bệnh ty thể → con bình thường.", "c) Cần tư vấn di truyền khi có bệnh ty thể.", "d) Bệnh ty thể di truyền từ bố."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: từ mẹ."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét ứng dụng và ý nghĩa của di truyền ngoài nhân:", "statements": ["a) Hiệu ứng mẹ khác di truyền ngoài nhân.", "b) Hiệu ứng mẹ do tế bào chất ảnh hưởng 1 thế hệ.", "c) Di truyền ngoài nhân kéo dài theo dòng mẹ.", "d) Hai hiện tượng này giống hệt nhau."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: khác nhau."}, {"type": "short", "level": "VD", "points": 0.5, "q": "DNA vòng của ty thể là bằng chứng thuyết (điền tên)", "answer": "nội cộng sinh", "explain": "Thuyết nội cộng sinh."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Muốn cải thiện tính trạng ngoài nhân nên chọn (điền)", "answer": "dòng mẹ", "explain": "Chọn dòng mẹ."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "DNA trong ty thể và lục lạp có dạng:", "options": ["A. DNA vòng", "B. DNA thẳng", "C. Không có DNA", "D. DNA vòng"], "answer": "A", "explain": "DNA ty thể/lục lạp dạng vòng, giống DNA vi khuẩn."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Tính trạng Correns nghiên cứu ở cây hoa phấn là:", "options": ["A. Lá đốm", "B. Màu hoa", "C. Chiều cao", "D. Lá đốm"], "answer": "A", "explain": "Correns nghiên cứu sự di truyền màu sắc lá (lá đốm)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Khi phân bào, gene ngoài nhân:", "options": ["A. Phân li không đồng đều", "B. Phân li đồng đều", "C. Không phân li", "D. Phân li không đồng đều"], "answer": "A", "explain": "Ty thể/lục lạp phân phối ngẫu nhiên → phân li không đồng đều."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Thuật ngữ tiếng Anh của di truyền theo dòng mẹ là:", "options": ["A. Maternal inheritance", "B. Independent assortment", "C. Crossing over", "D. Maternal inheritance"], "answer": "A", "explain": "Maternal inheritance = di truyền theo dòng mẹ."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Dùng cây lá xanh làm mẹ, cây lá đốm làm bố. Đời con có lá:", "options": ["A. Lá xanh", "B. Lá đốm", "C. Lá đốm và xanh", "D. Lá xanh"], "answer": "A", "explain": "Mẹ lá xanh → con lá xanh."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Gene ngoài nhân khi giảm phân:", "options": ["A. Không theo quy luật phân li", "B. Phân li như gene nhân", "C. Không nhân đôi", "D. Không theo quy luật phân li"], "answer": "A", "explain": "Gene ngoài nhân không trên NST → không theo quy luật phân li."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về gene ngoài nhân:", "statements": ["a) Bệnh ty thể ở người di truyền từ mẹ.", "b) Bố bị bệnh ty thể thì con bình thường.", "c) Bất dục đực tế bào chất do gene ty thể.", "d) Gene ngoài nhân di truyền theo dòng bố."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: dòng mẹ."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét thí nghiệm của Correns trên cây hoa phấn:", "statements": ["a) Dòng bất dục đực dùng làm dòng mẹ sản xuất hạt lai.", "b) Dòng mẹ bất dục giúp khỏi khử đực thủ công.", "c) Bất dục đực tế bào chất do gene ty thể.", "d) Dòng bất dục đực dùng làm dòng bố."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: làm dòng mẹ."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Correns thí nghiệm trên cây (điền tên)", "answer": "hoa phấn", "explain": "Cây hoa phấn."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Lai thuận và lai nghịch về gene ngoài nhân cho kết quả (điền: giống/khác) nhau", "answer": "khác nhau", "explain": "Khác nhau."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "DNA ty thể/lục lạp có khả năng:", "options": ["A. Không nhân đôi", "B. Tự nhân đôi độc lập", "C. Tự nhân đôi độc lập", "D. Chỉ nhân đôi cùng nhân"], "answer": "B", "explain": "DNA ngoài nhân tự nhân đôi độc lập với DNA nhân."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Bệnh do gene ty thể ở người di truyền:", "options": ["A. Từ cả hai", "B. Từ mẹ", "C. Từ mẹ", "D. Từ bố"], "answer": "B", "explain": "Gene ty thể di truyền theo dòng mẹ."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Để xác định gene ngoài nhân hay trong nhân, cần:", "options": ["A. Nhuộm tiêu bản", "B. Xét kết quả lai thuận – nghịch", "C. Xét kết quả lai thuận – nghịch", "D. Đếm NST"], "answer": "B", "explain": "Lai thuận – nghịch khác nhau → gene ngoài nhân."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Màu sắc lá đốm ở cây hoa phấn do gene trong:", "options": ["A. Nhân", "B. Lục lạp", "C. Lục lạp", "D. Ty thể"], "answer": "B", "explain": "Màu lá liên quan quang hợp → gene trong lục lạp."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Dòng bất dục đực tế bào chất dùng để:", "options": ["A. Tăng đột biến", "B. Làm dòng mẹ sản xuất hạt lai", "C. Làm dòng mẹ sản xuất hạt lai", "D. Làm phân bón"], "answer": "B", "explain": "Cây mẹ bất dục đực → khỏi khử đực thủ công khi sản xuất hạt lai."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một tính trạng do gene nhân quy định nhưng chịu ảnh hưởng tế bào chất mẹ. Kết quả:", "options": ["A. Bố không truyền gene", "B. Con nhận alen từ cả bố và mẹ nhưng kiểu hình giống mẹ", "C. Con nhận alen từ cả bố và mẹ nhưng kiểu hình giống mẹ", "D. Con chỉ nhận gene mẹ"], "answer": "B", "explain": "Hiệu ứng mẹ (maternal effect): kiểu hình con do tế bào chất mẹ quyết định dù gene từ cả hai."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét đặc điểm di truyền ngoài nhân:", "statements": ["a) Di truyền theo dòng mẹ.", "b) Không tuân quy luật phân li.", "c) Phân li không đồng đều khi phân bào.", "d) Con giống bố về tính trạng ngoài nhân."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: giống mẹ."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét ứng dụng và ý nghĩa của di truyền ngoài nhân:", "statements": ["a) Tạo dòng bất dục đực phục vụ sản xuất hạt lai.", "b) Dòng mẹ bất dục khỏi phải khử đực thủ công.", "c) Ứng dụng ở lúa lai, ngô lai.", "d) Bất dục đực tế bào chất không có ứng dụng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Dòng mẹ không tạo hạt phấn hữu thụ gọi là dòng (điền tên)", "answer": "bất dục đực", "explain": "Bất dục đực tế bào chất."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Khi phân bào, ty thể được phân phối (điền: ngẫu nhiên/đồng đều)", "answer": "ngẫu nhiên", "explain": "Phân phối ngẫu nhiên."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Gene không nằm trong nhân mà nằm ở:", "options": ["A. Tế bào chất", "B. Nhân con", "C. Tế bào chất", "D. Màng nhân"], "answer": "C", "explain": "Gene ngoài nhân nằm ở tế bào chất (ty thể, lục lạp)."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Đối tượng thí nghiệm của Correns là:", "options": ["A. Cây hoa phấn", "B. Đậu Hà Lan", "C. Cây hoa phấn", "D. Ruồi giấm"], "answer": "C", "explain": "Correns dùng cây hoa phấn (Mirabilis jalapa) có lá đốm."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Kết quả di truyền gene ngoài nhân:", "options": ["A. Con giống mẹ", "B. Con giống bố", "C. Con giống mẹ", "D. Con trung gian"], "answer": "C", "explain": "Hợp tử nhận tế bào chất từ trứng → con giống mẹ."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Kiểu hình con giống mẹ trong mọi phép lai. Gene nằm ở:", "options": ["A. Gene trong tế bào chất", "B. Gene trên NST X", "C. Gene trong tế bào chất", "D. Gene trên NST Y"], "answer": "C", "explain": "Con giống mẹ → gene trong tế bào chất (ty thể/lục lạp)."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Lai ♀ lá xanh × ♂ lá đốm ở cây hoa phấn. F1 có kiểu hình:", "options": ["A. 100% lá xanh", "B. 100% lá đốm", "C. 100% lá xanh", "D. 100% lá vàng"], "answer": "C", "explain": "Con giống mẹ (lá xanh)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Vai trò của bố trong di truyền ngoài nhân:", "options": ["A. Tinh trùng hầu như không góp tế bào chất", "B. Quyết định kiểu hình con", "C. Tinh trùng hầu như không góp tế bào chất", "D. Truyền ty thể cho con"], "answer": "C", "explain": "Bố chỉ góp nhân, không góp đáng kể tế bào chất."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về gene ngoài nhân:", "statements": ["a) Ty thể chứa gene mã hóa protein hô hấp.", "b) Lục lạp chứa gene mã hóa protein quang hợp.", "c) DNA ngoài nhân tự nhân đôi độc lập.", "d) Gene ngoài nhân nằm trên NST."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: nằm ở tế bào chất."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét thí nghiệm của Correns trên cây hoa phấn:", "statements": ["a) Gene quy định màu lá nằm trong lục lạp.", "b) Lục lạp được nhận từ tế bào chất của trứng.", "c) Lá trắng do lục lạp mất khả năng quang hợp.", "d) Gene quy định màu lá nằm trên NST thường."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Gene ngoài nhân nằm trong hai bào quan là (điền tên)", "answer": "ty thể và lục lạp", "explain": "Ty thể và lục lạp."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Lai ♀ lá xanh × ♂ lá đốm ở cây hoa phấn, F1 có lá (điền)", "answer": "lá xanh", "explain": "Con giống mẹ → lá xanh."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Gene ngoài nhân mã hóa:", "options": ["A. Mã hóa mọi protein", "B. Không mã hóa", "C. Mã hóa protein hô hấp/quang hợp", "D. Mã hóa protein hô hấp/quang hợp"], "answer": "D", "explain": "Gene ty thể: protein hô hấp; gene lục lạp: protein quang hợp."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Người bố mang bệnh ty thể (mẹ bình thường). Con sẽ:", "options": ["A. Con đều bị bệnh", "B. Con trai bị", "C. Bố bị bệnh ty thể → con bình thường", "D. Bố bị bệnh ty thể → con bình thường"], "answer": "D", "explain": "Bố không truyền ty thể cho con."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Phép lai gene ngoài nhân:", "options": ["A. Cho tỉ lệ 3:1", "B. Cho tỉ lệ 9:3:3:1", "C. Không xuất hiện tỉ lệ Mendel", "D. Không xuất hiện tỉ lệ Mendel"], "answer": "D", "explain": "Gene ngoài nhân không cho tỉ lệ Mendel."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cây hoa phấn toàn lá trắng khi trồng riêng sẽ:", "options": ["A. Sống bình thường", "B. Cho nhiều hạt", "C. Cây lá trắng không sống được", "D. Cây lá trắng không sống được"], "answer": "D", "explain": "Không quang hợp được → không sống độc lập."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Ưu điểm của dòng mẹ bất dục đực:", "options": ["A. Tốn công", "B. Giảm năng suất", "C. Khỏi khử đực thủ công", "D. Khỏi khử đực thủ công"], "answer": "D", "explain": "Tiết kiệm công khử đực, đảm bảo độ thuần của hạt lai."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Trong chọn giống, tính trạng do gene ngoài nhân được chọn qua:", "options": ["A. Dòng bố", "B. Ngẫu nhiên", "C. Dòng mẹ", "D. Dòng mẹ"], "answer": "D", "explain": "Vì di truyền theo dòng mẹ nên chọn dòng mẹ mang tính trạng mong muốn."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét đặc điểm di truyền ngoài nhân:", "statements": ["a) Lục lạp chỉ có ở tế bào thực vật.", "b) Ty thể có ở cả động vật và thực vật.", "c) Cả hai đều nằm ở tế bào chất.", "d) Lục lạp có ở tế bào động vật."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét ứng dụng và ý nghĩa của di truyền ngoài nhân:", "statements": ["a) DNA ty thể dùng nghiên cứu nguồn gốc loài.", "b) DNA ty thể di truyền ổn định theo dòng mẹ.", "c) Ít bị tái tổ hợp như gene nhân.", "d) DNA ty thể không có ý nghĩa nghiên cứu."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Bệnh ty thể di truyền từ (điền: bố/mẹ)", "answer": "mẹ", "explain": "Từ mẹ."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Di truyền ngoài nhân khác di truyền (điền tên nhà khoa học)", "answer": "Mendel", "explain": "Khác di truyền Mendel."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Bào quan chứa gene ngoài nhân tham gia quang hợp là:", "options": ["A. Lục lạp", "B. Không bào", "C. Lục lạp", "D. Ty thể"], "answer": "A", "explain": "Lục lạp chứa gene ngoài nhân mã hóa protein quang hợp."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Tên khoa học của cây hoa phấn là:", "options": ["A. Mirabilis jalapa", "B. Drosophila melanogaster", "C. Mirabilis jalapa", "D. Pisum sativum"], "answer": "A", "explain": "Cây hoa phấn: Mirabilis jalapa."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Di truyền gene ngoài nhân:", "options": ["A. Không tuân Mendel", "B. Là thường biến", "C. Không tuân Mendel", "D. Tuân Mendel"], "answer": "A", "explain": "Gene ngoài nhân không nằm trên NST → không tuân Mendel."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Lai ♀ lá đốm × ♂ lá xanh → 100% lá đốm; lai ngược → 100% lá xanh. Đây là:", "options": ["A. Không phải gene nhân", "B. Gene lặn", "C. Không phải gene nhân", "D. Gene trội"], "answer": "A", "explain": "Kết quả phụ thuộc vào mẹ → gene ngoài nhân."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Dùng  ty thể nên:", "options": ["A. Tư vấn di truyền", "B. Tư vấn di truyền", "C. Không cần quan tâm", "D. Chữa bằng kháng sinh"], "answer": "B", "explain": "Cần tư vấn di truyền vì bệnh di truyền theo dòng mẹ."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Thí nghiệm lai thuận nghịch nhằm:", "options": ["A. So sánh vai trò bố mẹ", "B. So sánh vai trò bố mẹ", "C. Tăng năng suất", "D. Tạo đột biến"], "answer": "B", "explain": "Lai thuận nghịch so sánh vai trò di truyền của bố và mẹ."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Nguồn lục lạp của hợp tử chủ yếu từ:", "options": ["A. Tế bào chất của trứng", "B. Tế bào chất của trứng", "C. Tinh trùng", "D. Cả hai bằng nhau"], "answer": "B", "explain": "Hợp tử nhận tế bào chất (và lục lạp) từ trứng."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Bất dục đực tế bào chất do:", "options": ["A. Gene ty thể", "B. Gene ty thể", "C. Gene nhân", "D. Virus"], "answer": "B", "explain": "Do gene trong ty thể (tế bào chất) gây ra."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Kĩ thuật tạo cá thể có tế bào chất từ mẹ cho:", "options": ["A. Nhân bản vô tính", "B. Nhân bản vô tính", "C. Lai xa", "D. Gây đột biến"], "answer": "B", "explain": "Nhân bản vô tính: tế bào chất (và gene ngoài nhân) từ tế bào cho (mẹ)."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét đặc điểm di truyền ngoài nhân:", "statements": ["a) Gene ngoài nhân mã hóa một số protein.", "b) Phần lớn protein ty thể do gene nhân mã hóa.", "c) Ty thể và lục lạp phối hợp với nhân.", "d) Gene ngoài nhân mã hóa mọi protein tế bào."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: chỉ một số."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét ứng dụng và ý nghĩa của di truyền ngoài nhân:", "statements": ["a) Nhân bản vô tính cho cá thể có tế bào chất từ mẹ.", "b) Gene ngoài nhân được truyền qua nhân bản.", "c) Đây là ứng dụng của di truyền tế bào chất.", "d) Nhân bản không liên quan tế bào chất."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Gene quy định màu lá đốm nằm trong (điền tên bào quan)", "answer": "lục lạp", "explain": "Lục lạp."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Gene ngoài nhân còn gọi là gene trong (điền)", "answer": "tế bào chất", "explain": "Gene trong tế bào chất."}]}]}
