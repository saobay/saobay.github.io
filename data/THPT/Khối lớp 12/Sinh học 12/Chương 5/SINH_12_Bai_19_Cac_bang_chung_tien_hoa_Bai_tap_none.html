 đồng quy:", "options": ["A. Áp lực chọn lọc", "B. Ngẫu nhiên", "C. Đột biến", "D. Áp lực chọn lọc"], "answer": "A", "explain": "Môi trường giống nhau tạo áp lực chọn lọc giống nhau."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về cơ quan tương đồng, tương tự:", "statements": ["a) Ruột thừa là cơ quan thoái hóa.", "b) Cơ quan thoái hóa là dấu vết tổ tiên.", "c) Xương cụt là dấu vết của đuôi.", "d) Cơ quan thoái hóa đang phát triển."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: đang tiêu giảm."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các phát biểu về bằng chứng phôi và địa lí:", "statements": ["a) Phân bố sinh vật liên quan lịch sử địa chất.", "b) Cách li địa lí thúc đẩy phân li.", "c) Đảo là nơi lí tưởng nghiên cứu tiến hóa.", "d) Địa lí không liên quan tiến hóa."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Cơ quan tương tự phản ánh tiến hóa (điền tên)", "answer": "đồng quy", "explain": "Tiến hóa đồng quy."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Bằng chứng chính xác nhất là bằng chứng (điền tên)", "answer": "phân tử", "explain": "Sinh học phân tử."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Phôi các loài có xương sống:", "options": ["A. Giống nhau hoàn toàn", "B. Giống nhau ở giai đoạn sớm", "C. Giống nhau ở giai đoạn sớm", "D. Khác nhau hoàn toàn"], "answer": "B", "explain": "Phôi sớm rất giống nhau (khe mang, đuôi)."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Bằng chứng địa lí sinh vật học:", "options": ["A. Mã di truyền", "B. Chim sẻ Darwin ở Galapagos", "C. Chim sẻ Darwin ở Galapagos", "D. Chi trước các loài"], "answer": "B", "explain": "Chim sẻ khác nhau trên từng đảo Galapagos."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Bằng chứng trực tiếp, chính xác nhất:", "options": ["A. Phôi sinh", "B. Sinh học phân tử", "C. Sinh học phân tử", "D. Giải phẫu"], "answer": "B", "explain": "So sánh DNA/protein cho kết quả định lượng chính xác."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Quan hệ giữa trình tự DNA và họ hàng:", "options": ["A. Không liên quan", "B. Càng giống nhau càng gần", "C. Càng giống nhau càng gần", "D. Càng khác càng gần"], "answer": "B", "explain": "Trình tự giống nhau → chung tổ tiên gần."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cặp loài có họ hàng gần nhất:", "options": ["A. Người và cá", "B. Người và tinh tinh", "C. Người và tinh tinh", "D. Người và chuột"], "answer": "B", "explain": "DNA người giống tinh tinh nhất."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Kết luận tiến hóa cần:", "options": ["A. Không cần", "B. Tổng hợp nhiều bằng chứng", "C. Tổng hợp nhiều bằng chứng", "D. Một bằng chứng"], "answer": "B", "explain": "Nhiều bằng chứng độc lập củng cố lẫn nhau."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về bằng chứng tế bào và phân tử:", "statements": ["a) Mọi sinh vật đều cấu tạo từ tế bào.", "b) Tế bào nhân thực có cấu trúc cơ bản giống nhau.", "c) Chứng tỏ sinh giới có chung nguồn gốc.", "d) Mỗi loài có tế bào hoàn toàn khác."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét ý nghĩa của các bằng chứng tiến hóa:", "statements": ["a) Chứng minh các loài có chung nguồn gốc.", "b) Chứng minh sinh giới đã tiến hóa.", "c) Các bằng chứng bổ sung cho nhau.", "d) Các bằng chứng mâu thuẫn nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: phù hợp nhau."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Dấu vết đuôi ở người là (điền tên)", "answer": "xương cụt", "explain": "Xương cụt."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Các bằng chứng chứng tỏ loài có (điền)", "answer": "chung nguồn gốc", "explain": "Chung nguồn gốc."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Cơ quan tương đồng là:", "options": ["A. Cùng nguồn gốc, chức năng khác nhau", "B. Khác nguồn gốc, cùng chức năng", "C. Cùng nguồn gốc, chức năng khác nhau", "D. Không chức năng"], "answer": "C", "explain": "Tương đồng: cùng nguồn gốc, cấu tạo tương tự, chức năng khác nhau."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Ví dụ cơ quan tương tự:", "options": ["A. Cánh dơi – cánh côn trùng", "B. Chi trước các loài thú", "C. Cánh dơi – cánh côn trùng", "D. Răng khôn"], "answer": "C", "explain": "Khác nguồn gốc, cùng dùng để bay."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cơ quan tương đồng phản ánh:", "options": ["A. Tiến hóa phân li", "B. Tiến hóa đồng quy", "C. Tiến hóa phân li", "D. Không tiến hóa"], "answer": "C", "explain": "Từ tổ tiên chung phân li thích nghi → tương đồng."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Xương cụt ở người chứng tỏ:", "options": ["A. Tổ tiên có đuôi", "B. Người có đuôi", "C. Tổ tiên có đuôi", "D. Ngẫu nhiên"], "answer": "C", "explain": "Tổ tiên xa xưa có đuôi, nay tiêu giảm."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cánh chim và cánh bướm đều để bay nhưng cấu tạo khác nhau. Đây là:", "options": ["A. Tương tự", "B. Tương đồng", "C. Tương tự", "D. Thoái hóa"], "answer": "C", "explain": "Khác nguồn gốc, cùng chức năng → tương tự."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Các loài khác nhau sống trong môi trường giống nhau có đặc điểm giống nhau:", "options": ["A. Đồng quy", "B. Phân li", "C. Đồng quy", "D. Ngẫu nhiên"], "answer": "C", "explain": "Tiến hóa đồng quy: nhiều nguồn → một hướng."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về cơ quan tương đồng, tương tự:", "statements": ["a) Chi trước người, dơi, cá voi là tương đồng.", "b) Cánh dơi và cánh côn trùng là tương tự.", "c) Tương đồng chứng tỏ chung nguồn gốc.", "d) Tương tự chứng tỏ chung nguồn gốc."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: do môi trường giống nhau."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các phát biểu về bằng chứng phôi và địa lí:", "statements": ["a) Bằng chứng phôi chứng tỏ chung nguồn gốc.", "b) Phát triển phôi lặp lại tiến hóa tổ tiên.", "c) Phôi người sớm giống phôi cá.", "d) Phôi không có ý nghĩa tiến hóa."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Cánh dơi và cánh côn trùng là cơ quan (điền tên)", "answer": "tương tự", "explain": "Cơ quan tương tự."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Quần đảo Darwin nghiên cứu chim sẻ là (điền tên)", "answer": "Galapagos", "explain": "Quần đảo Galapagos."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Bằng chứng phôi sinh học chứng tỏ:", "options": ["A. Khác nguồn gốc", "B. Không liên quan", "C. Chung nguồn gốc", "D. Chung nguồn gốc"], "answer": "D", "explain": "Phôi giống nhau → chung tổ tiên."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Bằng chứng phân tử cơ bản:", "options": ["A. Khe mang", "B. Ruột thừa", "C. Mã di truyền chung", "D. Mã di truyền chung"], "answer": "D", "explain": "Mọi loài dùng chung mã di truyền."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Protein thường dùng so sánh tiến hóa:", "options": ["A. Insulin", "B. Collagen", "C. Hemoglobin", "D. Hemoglobin"], "answer": "D", "explain": "Hemoglobin được nghiên cứu ở nhiều loài."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Dùng tốc độ đột biến để xác định:", "options": ["A. Tuổi hóa thạch", "B. Nhiệt độ", "C. Đồng hồ phân tử", "D. Đồng hồ phân tử"], "answer": "D", "explain": "Đồng hồ phân tử ước tính thời gian phân li."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Hai loài có nhiều cơ quan tương đồng thì:", "options": ["A. Xa nhau", "B. Không liên quan", "C. Tổ tiên chung gần", "D. Tổ tiên chung gần"], "answer": "D", "explain": "Tương đồng nhiều → tổ tiên chung gần."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Thuyết tiến hóa là lí thuyết:", "options": ["A. Phỏng đoán", "B. Tôn giáo", "C. Khoa học", "D. Khoa học"], "answer": "D", "explain": "Được nhiều bằng chứng kiểm chứng."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về bằng chứng tế bào và phân tử:", "statements": ["a) Trình tự càng giống → họ hàng càng gần.", "b) Hemoglobin người giống tinh tinh hơn chuột.", "c) Bằng chứng phân tử chính xác nhất.", "d) Không so sánh được trình tự."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét ý nghĩa của các bằng chứng tiến hóa:", "statements": ["a) Hiểu tiến hóa giúp bảo tồn đa dạng.", "b) Ứng dụng trong y học (kháng thuốc).", "c) Ứng dụng trong nông nghiệp.", "d) Không có ứng dụng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Protein so sánh tiến hóa là (điền tên)", "answer": "hemoglobin", "explain": "Hemoglobin."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Bằng chứng phân tử là bằng chứng (điền: trực tiếp/gián tiếp)", "answer": "trực tiếp", "explain": "Trực tiếp nhất."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Cơ quan thoái hóa là:", "options": ["A. Tiêu giảm, mất chức năng", "B. Mới xuất hiện", "C. Tiêu giảm, mất chức năng", "D. Phát triển mạnh"], "answer": "A", "explain": "Thoái hóa: tiêu giảm, là dấu vết của tổ tiên."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Dấu vết đuôi của tổ tiên ở người:", "options": ["A. Xương cụt", "B. Xương đùi", "C. Xương cụt", "D. Xương sườn"], "answer": "A", "explain": "Xương cụt là dấu vết của đuôi."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Các loài có cơ quan tương đồng thì:", "options": ["A. Chung nguồn gốc", "B. Cùng môi trường", "C. Chung nguồn gốc", "D. Không liên quan"], "answer": "A", "explain": "Tương đồng chứng tỏ chung tổ tiên."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cơ quan thoái hóa vì:", "options": ["A. Không còn cần thiết", "B. Bệnh", "C. Không còn cần thiết", "D. Đột biến"], "answer": "A", "explain": "Không dùng đến → tiêu giảm qua tiến hóa."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Vây cá voi và tay người là cơ quan:", "options": ["A. Tương đồng", "B. Thoái hóa", "C. Tương đồng", "D. Tương tự"], "answer": "A", "explain": "Cùng là chi trước của thú → tương đồng."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ví dụ tiến hóa phân li:", "options": ["A. Thú có túi Australia", "B. Chim – côn trùng", "C. Thú có túi Australia", "D. Cá mập – cá voi"], "answer": "A", "explain": "Từ tổ tiên chung phân hóa đa dạng ở Australia."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về cơ quan tương đồng, tương tự:", "statements": ["a) Cá mập và cá voi là ví dụ đồng quy.", "b) Thú có túi Australia là ví dụ phân li.", "c) Đồng quy do môi trường giống nhau.", "d) Phân li do môi trường giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: do môi trường khác nhau."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các phát biểu về bằng chứng phôi và địa lí:", "statements": ["a) Thú có túi đa dạng ở Australia.", "b) Do Australia cách li lâu dài.", "c) Chúng thay thế thú có nhau các châu lục khác.", "d) Australia không có thú có túi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Cơ quan tương đồng phản ánh tiến hóa (điền tên)", "answer": "phân li", "explain": "Tiến hóa phân li."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Mọi loài đều dùng chung (điền tên)", "answer": "mã di truyền", "explain": "Mã di truyền."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đặc điểm chung của phôi sớm:", "options": ["A. Khe mang, đuôi", "B. Khe mang, đuôi", "C. Lông, vú", "D. Vảy"], "answer": "B", "explain": "Phôi sớm đều có khe mang và đuôi."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Mọi sinh vật đều cấu tạo từ:", "options": ["A. Tế bào", "B. Tế bào", "C. Nguyên tử", "D. Phân tử"], "answer": "B", "explain": "Tế bào là đơn vị cấu tạo → chung nguồn gốc."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Ưu điểm của bằng chứng phân tử:", "options": ["A. Định lượng", "B. Định lượng", "C. Định tính", "D. Rẻ tiền"], "answer": "B", "explain": "Cho số liệu định lượng về mức độ giống nhau."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Kết quả so sánh phân tử dùng xây dựng:", "options": ["A. Cây phát sinh", "B. Cây phát sinh", "C. Bản đồ", "D. Lịch"], "answer": "B", "explain": "Cây phát sinh chủng loại từ dữ liệu phân tử."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Mọi bằng chứng đều hướng tới:", "options": ["A. Chung nguồn gốc", "B. Chung nguồn gốc", "C. Nhiều nguồn gốc", "D. Tự sinh"], "answer": "B", "explain": "Các loài có chung nguồn gốc."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hiểu tiến hóa giúp:", "options": ["A. Ứng dụng", "B. Ứng dụng", "C. Không gì", "D. Quay lui"], "answer": "B", "explain": "Ứng dụng trong y học, nông nghiệp, bảo tồn."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về bằng chứng tế bào và phân tử:", "statements": ["a) Đột biến tích lũy theo thời gian phân li.", "b) Đồng hồ phân tử ước tính thời gian.", "c) Kết hợp với hóa thạch để hiệu chỉnh.", "d) Trình tự DNA không thay đổi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: có thay đổi."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét ý nghĩa của các bằng chứng tiến hóa:", "statements": ["a) Cần tổng hợp nhiều bằng chứng.", "b) Một bằng chứng chưa đủ kết luận.", "c) Tư duy khoa học đòi hỏi kiểm chứng.", "d) Tin vào một bằng chứng là đủ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Đơn vị cấu tạo mọi sinh vật là (điền tên)", "answer": "tế bào", "explain": "Tế bào."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Chim sẻ Galapagos là bằng chứng (điền tên)", "answer": "địa lí", "explain": "Địa lí sinh vật học."}]}]}
