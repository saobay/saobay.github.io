ain": "Cùng một loài."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Chim cánh cụt tụm lại để:", "options": ["A. Đánh nhau", "B. Chơi", "C. Sưởi ấm", "D. Sưởi ấm"], "answer": "D", "explain": "Giữ ấm."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Con đực cạnh tranh:", "options": ["A. Thức ăn", "B. Nước", "C. Bạn tình", "D. Bạn tình"], "answer": "D", "explain": "Tranh bạn tình."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Biến động bất thường cảnh báo:", "options": ["A. Vui chơi", "B. Ngủ", "C. Phòng dịch", "D. Phòng dịch"], "answer": "D", "explain": "Dịch bệnh, ô nhiễm."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cạnh tranh có ý nghĩa chọn lọc.", "options": ["A. Sai", "B. Một phần", "C. Đúng", "D. Đúng"], "answer": "D", "explain": "Đúng."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét quan hệ trong quần thể:", "statements": ["a) Tự tỉa thưa ở thực vật.", "b) Do cạnh tranh ánh sáng.", "c) Cây yếu chết bớt.", "d) Cây không cạnh tranh."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét ý nghĩa thực tiễn:", "statements": ["a) Tháp tuổi dự báo phát triển.", "b) Quy hoạch đàn vật nuôi.", "c) Kế hoạch khai thác.", "d) Không dự báo được."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Cháy rừng gây biến động (điền tên)", "answer": "đột xuất", "explain": "Đột xuất."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Biến động do mức (điền) thay đổi", "answer": "sinh, tử", "explain": "Mức sinh sản, tử vong."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Tỉ lệ giới tính là:", "options": ["A. Đực : cái", "B. To : nhỏ", "C. Đực : cái", "D. Già : trẻ"], "answer": "A", "explain": "Tỉ lệ đực trên cái."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Mật độ cao làm tăng:", "options": ["A. Cạnh tranh", "B. Sinh sản", "C. Cạnh tranh", "D. Hợp tác"], "answer": "A", "explain": "Cạnh tranh gay gắt."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Tỉ lệ giới tính có thể:", "options": ["A. Thay đổi", "B. Mất", "C. Thay đổi", "D. Cố định"], "answer": "A", "explain": "Theo điều kiện."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Biểu đồ cấu trúc tuổi:", "options": ["A. Tháp tuổi", "B. Bản đồ", "C. Tháp tuổi", "D. Tháp nước"], "answer": "A", "explain": "Tháp tuổi (hình tháp)."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Đàn trâu rừng phân bố:", "options": ["A. Theo nhóm", "B. Ngẫu nhiên", "C. Theo nhóm", "D. Đều"], "answer": "A", "explain": "Sống thành bầy."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Cạnh tranh dẫn đến:", "options": ["A. Đào thải", "B. Giữ", "C. Đào thải", "D. Tăng"], "answer": "A", "explain": "Cá thể yếu bị đào thải."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các đặc trưng của quần thể:", "statements": ["a) Phân bố theo nhóm phổ biến nhất.", "b) Phân bố đều do cạnh tranh gay gắt.", "c) Phân bố ngẫu nhiên khi môi trường đồng nhất.", "d) Chỉ có một kiểu phân bố."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: có 3 kiểu."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét biến động số lượng cá thể:", "statements": ["a) Theo dõi biến động để bảo tồn.", "b) Khai thác hợp lí theo biến động.", "c) Phòng trừ dịch hại.", "d) Không cần theo dõi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Tỉ lệ giới tính thường xấp xỉ (điền tỉ lệ)", "answer": "1 : 1", "explain": "1 : 1."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Chim hải âu làm tổ phân bố (điền tên)", "answer": "đều", "explain": "Phân bố đều."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Ví dụ nguyên nhân đột xuất:", "options": ["A. Thiên tai", "B.
