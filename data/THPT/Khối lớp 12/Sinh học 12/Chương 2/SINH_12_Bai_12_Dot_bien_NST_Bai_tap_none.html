": ["A. 69", "B. 47", "C. 71", "D. 92"], "answer": "A", "explain": "3n = 3 × 46//2 = 69 NST."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Lai xa kèm đa bội hóa tạo thành:", "options": ["A. Dị đa bội", "B. Tự đa bội", "C. Thể ba", "D. Dị đa bội"], "answer": "A", "explain": "Dị đa bội: lai khác loài rồi đa bội hóa (ví dụ lúa mì)."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét đột biến cấu trúc NST:", "statements": ["a) Chuyển đoạn có thể chuyển gene tốt vào cây trồng.", "b) Đột biến cấu trúc ảnh hưởng nhiều gene.", "c) Phạm vi ảnh hưởng lớn hơn đột biến gene.", "d) Đột biến cấu trúc chỉ ảnh hưởng 1 gene."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ảnh hưởng nhiều gene."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét đột biến dị bội:", "statements": ["a) Nguy cơ Down tăng theo tuổi mẹ.", "b) Dị bội thường gây hại.", "c) Dị bội có thể gây chết phôi.", "d) Mọi thể dị bội đều sống bình thường."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Loài 2n = 44. Thể ba nhiễm có số NST là", "answer": "45", "explain": "2n + 1 = 45."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Loài 2n = 44. Thể tứ bội có số NST là", "answer": "88", "explain": "4n = 2 × 44 = 88."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Biến đổi về cấu trúc hoặc số lượng NST gọi là:", "options": ["A. Thường biến", "B. Đột biến NST", "C. Đột biến NST", "D. Đột biến gene"], "answer": "B", "explain": "Đột biến NST: biến đổi cấu trúc hoặc số lượng NST."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Người mắc hội chứng Down có bao nhiêu NST?", "options": ["A. 45", "B. 47", "C. 47", "D. 46"], "answer": "B", "explain": "Down: 47 NST (thừa 1 NST số 21)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Ứng dụng của đột biến mất đoạn nhỏ là:", "options": ["A. Tạo đa bội", "B. Loại bỏ gene xấu", "C. Loại bỏ gene xấu", "D. Tăng số gene"], "answer": "B", "explain": "Mất đoạn nhỏ có thể loại bỏ gene xấu khỏi NST."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cặp NST không phân li trong giảm phân I tạo ra các loại giao tử:", "options": ["A. Không tạo giao tử", "B. Giao tử thừa 1 NST và giao tử thiếu 1 NST", "C. Giao tử thừa 1 NST và giao tử thiếu 1 NST", "D. Giao tử bình thường"], "answer": "B", "explain": "Không phân li → 1 giao tử thừa 1 NST (n+1), 1 giao tử thiếu 1 NST (n−1)."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Loài 2n = 44. Một cá thể có 88 NST thuộc dạng đột biến nào?", "options": ["A. 2n − 1", "B. 4n", "C. 3n", "D. 2n + 1"], "answer": "B", "explain": "88 = 2 × 2n = 4n → thể tứ bội (đa bội)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một người có 47 NST, trong đó có 3 NST số 21. Đây là:", "options": ["A. Thể tứ bội", "B. 2n = 46 → thể ba số 21 có 47 NST", "C. 2n = 46 → thể ba số 21 có 47 NST", "D. Thể một nhiễm"], "answer": "B", "explain": "47 NST với 3 NST số 21 → hội chứng Down."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét đột biến đa bội:", "statements": ["a) Đa bội: bộ NST tăng nguyên lần bộ n.", "b) 3n, 4n là thể đa bội.", "c) Tự đa bội: cùng một loài.", "d) Dị bội cũng là đa bội."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: dị bội khác đa bội."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét phân biệt các dạng đột biến NST:", "statements": ["a) Dị bội: thay đổi ở một vài cặp NST.", "b) Đa bội: tăng nguyên lần bộ NST.", "c) 2n+1 là dị bội, 3n là đa bội.", "d) 3n cũng là dị bội."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: 3n là đa bội."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Người mắc hội chứng Down có số NST là (điền số)", "answer": "47", "explain": "Down: 47 NST (3 NST số 21)."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Hóa chất dùng để tạo thể đa bội là (điền tên)", "answer": "colchicine", "explain": "Colchicine ngăn hình thành thoi phân bào."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Dạng đột biến làm một đoạn NST lặp lại là:", "options": ["A. Lặp đoạn", "B. Mất đoạn", "C. Lặp đoạn", "D. Chuyển đoạn"], "answer": "C", "explain": "Lặp đoạn: một đoạn NST được lặp lại → tăng số bản sao gene."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Thể một nhiễm có bộ NST là:", "options": ["A. 2n − 1", "B. 2n + 1", "C. 2n − 1", "D. 4n"], "answer": "C", "explain": "Thể một nhiễm: thiếu 1 NST ở một cặp (2n−1)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Loài có 2n = 38. Thể ba nhiễm của loài này có bao nhiêu NST?", "options": ["A. 37", "B. 76", "C. 39", "D. 40"], "answer": "C", "explain": "Thể ba nhiễm = 2n + 1 = 38 + 1 = 39 NST."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Hóa chất dùng để tạo thể đa bội là:", "options": ["A. Colchicine", "B. EMS", "C. Colchicine", "D. 5-BU"], "answer": "C", "explain": "Colchicine ngăn hình thành thoi phân bào → tạo thể đa bội."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Loài có 2n = 38. Thể tam bội (3n) của loài này có bao nhiêu NST?", "options": ["A. 76", "B. 39", "C. 57", "D. 59"], "answer": "C", "explain": "3n = 3 × 38//2 = 57 NST."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ví dụ về ứng dụng thể đa bội lẻ là:", "options": ["A. Dưa hấu tam bội không hạt", "B. Lúa thường", "C. Dưa hấu tam bội không hạt", "D. Ngô thường"], "answer": "C", "explain": "Dưa hấu 3n bất thụ → quả không hạt."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét đột biến cấu trúc NST:", "statements": ["a) Mất đoạn thường gây hại do mất gene.", "b) Lặp đoạn làm tăng số bản sao gene.", "c) Đảo đoạn ít gây hại vì không mất gene.", "d) Chuyển đoạn luôn gây chết."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: chuyển đoạn nhỏ có thể không gây hại."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét đột biến dị bội:", "statements": ["a) Down: 3 NST số 21 (47 NST).", "b) Turner: XO (45 NST).", "c) Klinefelter: XXY (47 NST).", "d) Down: thiếu 1 NST số 21."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: thừa 1 NST số 21."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Loài 2n = 20. Thể ba nhiễm có số NST là", "answer": "21", "explain": "2n + 1 = 21."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Loài 2n = 20. Thể tứ bội có số NST là", "answer": "40", "explain": "4n = 2 × 20 = 40."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Mất đoạn, đảo đoạn thuộc loại:", "options": ["A. Đột biến số lượng", "B. Đột biến điểm", "C. Đột biến cấu trúc NST", "D. Đột biến cấu trúc NST"], "answer": "D", "explain": "Mất/đảo/lặp/chuyển đoạn → đột biến cấu trúc NST."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Người mắc hội chứng Klinefelter có bao nhiêu NST?", "options": ["A. 46", "B. 45", "C. 47", "D. 47"], "answer": "D", "explain": "Klinefelter: 47 NST (XXY)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Vai trò của đảo đoạn là:", "options": ["A. Gây chết", "B. Không có vai trò", "C. Tạo nguồn nguyên liệu cho tiến hóa", "D. Tạo nguồn nguyên liệu cho tiến hóa"], "answer": "D", "explain": "Đảo đoạn thay đổi vị trí gene, tạo nguồn nguyên liệu tiến hóa."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Sự kết hợp giao tử n+1 với giao tử n tạo:", "options": ["A. Thể đa bội", "B. Bình thường", "C. Thể ba và thể một", "D. Thể ba và thể một"], "answer": "D", "explain": "(n+1) + n → 2n+1 (thể ba); (n−1) + n → 2n−1 (thể một)."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Loài 2n = 20. Một cá thể có 40 NST thuộc dạng đột biến nào?", "options": ["A. 2n + 1", "B. 2n − 1", "C. 3n", "D. 4n"], "answer": "D", "explain": "40 = 2 × 2n = 4n → thể tứ bội (đa bội)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một nam giới có 47 NST, bộ NST giới tính XXY. Đây là:", "options": ["A. Hội chứng Turner", "B. Bình thường", "C. 47 NST với XXY", "D. 47 NST với XXY"], "answer": "D", "explain": "47,XXY → hội chứng Klinefelter."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét đột biến đa bội:", "statements": ["a) Đa bội lẻ (3n) bất thụ.", "b) Dưa hấu 3n không hạt.", "c) Colchicine tạo thể đa bội.", "d) Đa bội chẵn cũng bất thụ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: đa bội chẵn hữu thụ."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét phân biệt các dạng đột biến NST:", "statements": ["a) Đột biến NST ảnh hưởng nhiều gene.", "b) Thường gây hại hơn đột biến gene.", "c) Có thể gây chết.", "d) Luôn vô hại."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Bộ NST giới tính của người Klinefelter là (điền)", "answer": "XXY", "explain": "Klinefelter: XXY (47 NST)."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Đoạn NST đứt rồi đảo ngược 180° gọi là (điền tên)", "answer": "đảo đoạn", "explain": "Đảo đoạn."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Trao đổi đoạn giữa các NST không tương đồng là:", "options": ["A. Chuyển đoạn", "B. Mất đoạn", "C. Chuyển đoạn", "D. Đảo đoạn"], "answer": "A", "explain": "Chuyển đoạn: trao đổi đoạn giữa các NST không tương đồng."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Hội chứng Turner có bộ NST là:", "options": ["A. XO (45 NST)", "B. XXX", "C. XO (45 NST)", "D. XXY"], "answer": "A", "explain": "Turner: chỉ có 1 NST X (45 NST)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Loài có 2n = 46. Thể ba nhiễm của loài này có bao nhiêu NST?", "options": ["A. 47", "B. 48", "C. 45", "D. 92"], "answer": "A", "explain": "Thể ba nhiễm = 2n + 1 = 46 + 1 = 47 NST."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Đột biến cấu trúc NST có thể do:", "options": ["A. Tác nhân vật lí, hóa học", "B. Tập thể dục", "C. Tác nhân vật lí, hóa học", "D. Ăn uống"], "answer": "A", "explain": "Tia phóng xạ, hóa chất gây đứt gãy NST → đột biến cấu trúc."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Loài có 2n = 46. Thể tam bội (3n) của loài này có bao nhiêu NST?", "options": ["A. 69", "B. 71", "C. 92", "D. 47"], "answer": "A", "explain": "3n = 3 × 46//2 = 69 NST."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Đa bội hóa bộ NST của cùng một loài gọi là:", "options": ["A. Tự đa bội", "B. Dị bội", "C. Tự đa bội", "D. Dị đa bội"], "answer": "A", "explain": "Tự đa bội: tăng số bộ NST của cùng một loài."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét đột biến cấu trúc NST:", "statements": ["a) Mất đoạn nhỏ có thể loại bỏ gene xấu.", "b) Lặp đoạn cung cấp nguyên liệu tiến hóa.", "c) Đảo đoạn tạo nguồn biến dị.", "d) Mọi đột biến cấu trúc đều vô hại."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: thường gây hại."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét đột biến dị bội:", "statements": ["a) Người bình thường có 46 NST.", "b) Người Down có 47 NST.", "c) Người Turner có 45 NST.", "d) Người Klinefelter có 45 NST."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: 47 NST (XXY)."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Loài 2n = 24. Thể ba nhiễm có số NST là", "answer": "25", "explain": "2n + 1 = 25."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Loài 2n = 24. Thể tứ bội có số NST là", "answer": "48", "explain": "4n = 2 × 24 = 48."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đột biến NST thường:", "options": ["A. Thường gây hại", "B. Thường gây hại", "C. Luôn có lợi", "D. Không ảnh hưởng"], "answer": "B", "explain": "Đột biến NST ảnh hưởng nhiều gene → thường gây hại, thậm chí gây chết."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Biểu hiện của hội chứng Klinefelter là:", "options": ["A. Nam tay chân dài, không có tinh trùng", "B. Nam tay chân dài, không có tinh trùng", "C. Nữ bình thường", "D. Trẻ thông minh"], "answer": "B", "explain": "Klinefelter (XXY): nam, cao, tay chân dài, tinh hoàn nhỏ, không có tinh trùng."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Đảo đoạn thường ít gây hại vì:", "options": ["A. Ít gây hại vì không mất gene", "B. Ít gây hại vì không mất gene", "C. Làm tăng gene", "D. Không thay đổi gì"], "answer": "B", "explain": "Đảo đoạn chỉ đổi vị trí, không mất gene → ít gây hại."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Nguy cơ sinh con mắc hội chứng Down tăng khi:", "options": ["A. Mẹ lớn tuổi", "B. Mẹ lớn tuổi", "C. Bố trẻ tuổi", "D. Không liên quan"], "answer": "B", "explain": "Tế bào trứng lão hóa dễ rối loạn phân li NST 21 → nguy cơ Down tăng theo tuổi mẹ."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Loài 2n = 44. Một cá thể có 88 NST thuộc dạng đột biến nào?", "options": ["A. 3n", "B. 4n", "C. 2n + 1", "D. 2n − 1"], "answer": "B", "explain": "88 = 2 × 2n = 4n → thể tứ bội (đa bội)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Mối liên quan giữa đột biến NST và ung thư:", "options": ["A. Ung thư có thể do đột biến NST", "B. Ung thư có thể do đột biến NST", "C. Không liên quan", "D. Ung thư chỉ do virus"], "answer": "B", "explain": "Mất đoạn, chuyển đoạn NST có thể hoạt hóa gene ung thư → ung thư."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét đột biến đa bội:", "statements": ["a) Nho tứ bội quả to hơn.", "b) Dâu tây là cây bát bội tự nhiên.", "c) Đa bội phổ biến ở thực vật.", "d) Động vật không bao giờ đa bội."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: hiếm chứ không phải không bao giờ."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét phân biệt các dạng đột biến NST:", "statements": ["a) Quan sát NST ở kì giữa để phát hiện đột biến.", "b) Đếm số NST phát hiện dị bội, đa bội.", "c) Nhuộm NST để quan sát cấu trúc.", "d) Không thể quan sát đột biến NST."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: quan sát được."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Dưa hấu không hạt là thể đa bội (điền)", "answer": "3n", "explain": "Dưa hấu tam bội (3n) bất thụ → không hạt."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một đoạn NST được lặp lại gọi là (điền tên)", "answer": "lặp đoạn", "explain": "Lặp đoạn."}]}]}
