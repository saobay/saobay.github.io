của NST:", "statements": ["a) NST là vật chất di truyền cấp tế bào.", "b) DNA là vật chất di truyền cấp phân tử.", "c) Đột biến NST gây biến đổi di truyền.", "d) NST không bao giờ thay đổi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: có đột biến NST."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Loài có bộ NST 2n = 20. Số nhóm gene liên kết của loài là", "answer": "10", "explain": "Số nhóm gene liên kết = n = 2n//2 = 20//2 = 10."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Loài có 2n = 8. Ở kì giữa nguyên phân, số chromatid trong tế bào là", "answer": "16", "explain": "Số chromatid = 2 × 2n = 2 × 8 = 16."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Chức năng của NST là:", "options": ["A. Tiêu hóa tế bào", "B. Lưu giữ, bảo quản và truyền đạt thông tin di truyền", "C. Tổng hợp protein", "D. Lưu giữ, bảo quản và truyền đạt thông tin di truyền"], "answer": "B", "explain": "NST lưu giữ (gene sắp xếp tuyến tính), bảo quản (xoắn nhiều cấp) và truyền đạt thông tin di truyền."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Hai NST giống nhau về hình thái, một có nguồn gốc từ bố, một từ mẹ tạo thành:", "options": ["A. Nhóm gene liên kết", "B. Cặp NST tương đồng", "C. Cặp NST tương đồng", "D. Cặp NST không tương đồng"], "answer": "B", "explain": "Cặp NST tương đồng: 2 NST giống nhau, một từ bố một từ mẹ."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "NST co xoắn cực đại, quan sát rõ nhất ở kì nào của nguyên phân?", "options": ["A. Kì cuối", "B. Kì giữa", "C. Kì giữa", "D. Kì đầu"], "answer": "B", "explain": "Ở kì giữa, NST co xoắn cực đại và xếp thành hàng ở mặt phẳng xích đạo → quan sát rõ nhất."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Nhận định đúng về số lượng NST là:", "options": ["A. Số NST tỉ lệ với kích thước", "B. Số lượng NST không phản ánh mức độ tiến hóa", "C. Số lượng NST không phản ánh mức độ tiến hóa", "D. Loài càng tiến hóa càng nhiều NST"], "answer": "B", "explain": "Số lượng NST đặc trưng cho loài nhưng không phản ánh mức độ tiến hóa (người 46, gà 78...)."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Loài có 2n = 8. Ở kì giữa nguyên phân, tế bào có bao nhiêu phân tử DNA?", "options": ["A. 4", "B. 16", "C. 8", "D. 32"], "answer": "B", "explain": "Mỗi chromatid chứa 1 DNA; kì giữa có 2×2n chromatid → số DNA = 2 × 8 = 16."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Loài có 2n = 14. Ở kì đầu của nguyên phân, tế bào có bao nhiêu chromatid?", "options": ["A. 56", "B. 28", "C. 14", "D. 7"], "answer": "B", "explain": "Từ kì đầu, mỗi NST đã nhân đôi thành NST kép (2 chromatid) → số chromatid = 2 × 2n = 28."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét hình thái NST ở các kì phân bào:", "statements": ["a) Ở kì giữa, NST co xoắn cực đại.", "b) NST kép gồm 2 chromatid.", "c) Ở kì sau, các chromatid tách nhau thành NST đơn.", "d) Ở kì giữa, NST chưa nhân đôi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: NST đã nhân đôi ở kì trung gian."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét sự thay đổi của NST trong nguyên phân (2n = 46):", "statements": ["a) Kì giữa: 46 NST kép, 92 chromatid.", "b) Kì sau: 92 NST đơn.", "c) Kì cuối: mỗi tế bào con có 46 NST đơn.", "d) Kì giữa: 46 phân tử DNA."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: 92 DNA (mỗi chromatid 1 DNA)."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Đoạn DNA dài 1460 cặp nu tạo khoảng bao nhiêu nucleosome (mỗi nucleosome ~146 cặp nu)", "answer": "10", "explain": "Số nucleosome ≈ 1460 // 146 = 10."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Loài có 2n = 14. Ở kì sau nguyên phân, số NST đơn trong tế bào là", "answer": "28", "explain": "Kì sau: chromatid tách thành NST đơn → 4n = 2 × 14 = 28 NST đơn."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đường kính của sợi cơ bản là:", "options": ["A. 11 nm", "B. 30 nm", "C. 11 nm", "D. 300 nm"], "answer": "C", "explain": "Sợi cơ bản (chuỗi nucleosome) có đường kính 11 nm."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Thành phần bảo vệ NST, chống dính đầu là:", "options": ["A. Đầu mút (telomere)", "B. Tâm động", "C. Đầu mút (telomere)", "D. Chromatid"], "answer": "C", "explain": "Đầu mút NST (telomere) bảo vệ NST, chống dính đầu và chống mất đoạn khi tái bản."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một đoạn DNA có 1460 cặp nucleotide quấn quanh các khối histone tạo nucleosome (mỗi nucleosome ~146 cặp nu). Số nucleosome được tạo ra khoảng:", "options": ["A. 12", "B. 8", "C. 10", "D. 20"], "answer": "C", "explain": "Số nucleosome ≈ 1460 // 146 = 10."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Bộ NST lưỡng bội của ruồi giấm là:", "options": ["A. 8", "B. 46", "C. 8", "D. 14"], "answer": "C", "explain": "Ruồi giấm có 2n = 8 NST."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một loài có bộ NST 2n = 46. Ở kì giữa của nguyên phân, tế bào có bao nhiêu chromatid?", "options": ["A. 46", "B. 184", "C. 92", "D. 23"], "answer": "C", "explain": "Ở kì giữa, mỗi NST kép gồm 2 chromatid. Số chromatid = 2 × 2n = 2 × 46 = 92."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Loài có 2n = 46. Ở kì sau của nguyên phân, tế bào có bao nhiêu NST đơn?", "options": ["A. 46", "B. 184", "C. 92", "D. 46"], "answer": "C", "explain": "Ở kì sau, các chromatid tách nhau thành NST đơn: số NST đơn = 4n = 2 × 2n = 92."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét cấu trúc của NST:", "statements": ["a) DNA quấn quanh histone tạo nucleosome.", "b) Sợi nhiễm sắc có đường kính 30 nm.", "c) Mỗi chromatid chứa một phân tử DNA.", "d) Tâm động là nơi thoi phân bào bám vào."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 phát biểu đều đúng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét số lượng và chức năng của NST:", "stateme "], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: người có 23 nhóm gene liên kết."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Loài có bộ NST 2n = 38. Số nhóm gene liên kết của loài là", "answer": "19", "explain": "Số nhóm gene liên kết = n = 2n//2 = 38//2 = 19."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Loài có 2n = 38. Ở kì giữa nguyên phân, số chromatid trong tế bào là", "answer": "76", "explain": "Số chromatid = 2 × 2n = 2 × 38 = 76."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Ý nghĩa của sự phân li NST trong phân bào là:", "options": ["A. Truyền đạt nguyên vẹn bộ NST cho thế hệ sau", "B. Truyền đạt nguyên vẹn bộ NST cho thế hệ sau", "C. Tạo NST mới", "D. Phá hủy NST cũ"], "answer": "B", "explain": "Phân li đồng đều đảm bảo mỗi tế bào con nhận đầy đủ bộ NST."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Bộ NST của người gồm:", "options": ["A. 22 cặp NST thường và 1 cặp NST giới tính", "B. 22 cặp NST thường và 1 cặp NST giới tính", "C. 23 cặp NST thường", "D. 46 NST giới tính"], "answer": "B", "explain": "Người có 22 cặp NST thường + 1 cặp NST giới tính (XX ở nữ, XY ở nam)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Ở kì giữa, các NST xếp thành hàng ở:", "options": ["A. Mặt phẳng xích đạo", "B. Mặt phẳng xích đạo", "C. Hai cực tế bào", "D. Màng nhân"], "answer": "B", "explain": "Kì giữa: NST kép xếp thành hàng ở mặt phẳng xích đạo của thoi phân bào."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Tế bào sinh dưỡng của sinh vật lưỡng bội có:", "options": ["A. Tế bào sinh dưỡng có bộ NST lưỡng bội", "B. Tế bào sinh dưỡng có bộ NST lưỡng bội", "C. Bộ NST đơn bội", "D. Bộ NST tam bội"], "answer": "B", "explain": "Tế bào sinh dưỡng có bộ NST lưỡng bội (2n)."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Loài có 2n = 14. Ở kì giữa nguyên phân, tế bào có bao nhiêu phân tử DNA?", "options": ["A. 14", "B. 28", "C. 56", "D. 7"],
