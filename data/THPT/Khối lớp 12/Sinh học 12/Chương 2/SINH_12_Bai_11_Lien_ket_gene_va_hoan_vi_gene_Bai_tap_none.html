{"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hai gene A và B có tần số hoán vị là 10%. Khoảng cách giữa hai gene này trên bản đồ di truyền là:", "options": ["A. 90 cM", "B. 20 cM", "C. 10 cM", "D. 5 cM"], "answer": "C", "explain": "Khoảng cách giữa 2 gene = tần số hoán vị: 1% = 1 cM → khoảng cách = 10 cM."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét thí nghiệm của Morgan trên ruồi giấm:", "statements": ["a) Gene quy định màu thân và dạng cánh cùng nằm trên một NST.", "b) Ruồi đực F1 chỉ tạo 2 loại giao tử.", "c) Ruồi cái F1 tạo 4 loại giao tử.", "d) Mọi cá thể ruồi đều xảy ra hoán vị gene."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ruồi đực không hoán vị."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét hiện tượng hoán vị gene:", "statements": ["a) Khoảng cách 2 gene càng lớn thì f càng cao.", "b) f = 1% tương ứng khoảng cách 1 cM.", "c) Bản đồ gene xây dựng dựa trên f.", "d) f phản ánh khoảng cách vật lí chính xác tuyệt đối."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: chỉ là khoảng cách tương đối."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Lai phân tích thu được 1000 cá thể, trong đó 100 cá thể tái tổ hợp. Tần số hoán vị gene là (điền %)", "answer": "10%", "explain": "f = (100/1000) × 100% = 10%."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cơ thể AB/ab có tần số hoán vị 30%. Tỉ lệ giao tử AB là (điền %)", "answer": "35%", "explain": "Giao tử liên kết AB = (100 − 30)/2 = 35%."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Hai loại kiểu hình chiếm tỉ lệ lớn ở Fb khi lai phân tích ruồi cái F1 (P: xám dài × đen cụt) là:", "options": ["A. Xám, dài và đen, cụt", "B. Xám, cụt và đen, dài", "C. Chỉ xám, dài", "D. Xám, dài và đen, cụt"], "answer": "D", "explain": "Giao tử liên kết (AB, ab) chiếm tỉ lệ lớn → KH giống P chiếm đa số."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Học trò của Morgan lập bản đồ gene đầu tiên là:", "options": ["A. Sturtevant", "B. Mendel", "C. Watson", "D. Sturtevant"], "answer": "D", "explain": "Sturtevant (học trò Morgan) lập bản đồ gene ruồi giấm đầu tiên."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Tỉ lệ kiểu hình ở Fb của lai phân tích phản ánh:", "options": ["A. Tỉ lệ giao tử của cơ thể dị hợp", "B. Tỉ lệ giao tử của cơ thể đồng hợp", "C. Ngẫu nhiên", "D. Tỉ lệ giao tử của cơ thể dị hợp"], "answer": "D", "explain": "Cơ thể đồng hợp lặn chỉ cho 1 loại giao tử → tỉ lệ KH ở Fb = tỉ lệ giao tử của cơ thể dị hợp."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Mỗi loại giao tử liên kết chiếm tỉ lệ:", "options": ["A. (1-f)/2", "B. f/2", "C. f", "D. (1-f)/2"], "answer": "D", "explain": "Mỗi loại giao tử liên kết = (1-f)/2."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho AB/ab × ab/ab, tần số hoán vị gene là 40%. Tỉ lệ kiểu hình ab/ab ở Fb là:", "options": ["A. 20%", "B. 40%", "C. 60%", "D. 30%"], "answer": "D", "explain": "Cơ thể AB/ab cho giao tử ab = (100−40)/2 = 30%; cơ thể ab/ab cho 100% giao tử ab. Tỉ lệ ab/ab ở Fb = 30% × 100% = 30%."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Kiểu gene AB/ab được gọi là:", "options": ["A. Dị hợp đều", "B. Dị hợp chéo", "C. Đồng hợp", "D. Dị hợp đều"], "answer": "D", "explain": "AB/ab: các allele trội cùng nằm trên một NST → dị hợp đều (cis)."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét cách nhận biết liên kết và hoán vị gene:", "statements": ["a) Khi f = 50% không phân biệt được hoán vị và phân li độc lập.", "b) Khi f = 0% là liên kết hoàn toàn.", "c) f càng nhỏ thì liên kết càng chặt.", "d) f = 0% nghĩa là không có gene."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét ý nghĩa của liên kết và hoán vị gene:", "statements": ["a) Gene càng xa nhau thì càng dễ hoán vị.", "b) Gene gần nhau liên kết chặt chẽ.", "c) f phản ánh khoảng cách tương đối giữa các gene.", "d) Mọi gene trên NST đều liên kết hoàn toàn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: có hoán vị."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Hai gene cách nhau 40 cM thì tần số hoán vị giữa chúng là (điền %)", "answer": "40%", "explain": "1 cM = 1% tần số hoán vị → khoảng cách 40 cM tương ứng f = 40%."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Ruồi giấm có số nhóm gene liên kết là (điền số)", "answer": "4", "explain": "2n = 8 → n = 4 nhóm gene liên kết."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Morgan công bố di truyền liên kết gene năm:", "options": ["A. 1910", "B. 1865", "C. 1953", "D. 1910"], "answer": "A", "explain": "Năm 1910, Morgan phát hiện di truyền liên kết trên ruồi giấm."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Ý nghĩa của hoán vị gene là:", "options": ["A. Tạo biến dị tổ hợp", "B. Ổn định kiểu gene", "C. Ngăn đột biến", "D. Tạo biến dị tổ hợp"], "answer": "A", "explain": "Hoán vị gene tạo biến dị tổ hợp – nguyên liệu cho tiến hóa và chọn giống."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Lai phân tích cơ thể dị hợp 2 cặp gene (AB/ab), thu được 1200 cá thể, trong đó có 240 cá thể mang kiểu hình tái tổ hợp. Tần số hoán vị gene là:", "options": ["A. 20%", "B. 15%", "C. 80%", "D. 30%"], "answer": "A", "explain": "Tần số hoán vị f = (số cá thể tái tổ hợp / tổng số) × 100% = (240/1200) × 100% = 20%."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một cơ thể có kiểu gene AB/ab, tần số hoán vị gene là 20%. Tỉ lệ giao tử AB là:", "options": ["A. 40%", "B. 20%", "C. 80%", "D. 10%"], "answer": "A", "explain": "Giao tử liên kết AB = ab = (100% − f)/2 = (100 − 20)/2 = 40%."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một cơ thể có kiểu gene Ab/aB (dị hợp chéo), tần số hoán vị gene là 20%. Tỉ lệ giao tử hoán vị AB là:", "options": ["A. 10%", "B. 20%", "C. 80%", "D. 40%"], "answer": "A", "explain": "Ở dị hợp chéo Ab/aB, giao tử hoán vị là AB và ab, mỗi loại = f/2 = 20/2 = 10%."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hai gene A và B có tần số hoán vị là 20%. Khoảng cách giữa hai gene này trên bản đồ di truyền là:", "options": ["A. 20 cM", "B. 10 cM", "C. 80 cM", "D. 40 cM"], "answer": "A", "explain": "Khoảng cách giữa 2 gene = tần số hoán vị: 1% = 1 cM → khoảng cách = 20 cM."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét thí nghiệm của Morgan trên ruồi giấm:", "statements": ["a) Số nhóm gene liên kết bằng số NST đơn bội.", "b) Ruồi giấm có 4 nhóm gene liên kết.", "c) Người có 23 nhóm gene liên kết.", "d) Số nhóm gene liên kết bằng 2n."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng (2n=8). c) Đúng. d) Sai: bằng n."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét hiện tượng hoán vị gene:", "statements": ["a) Cơ thể AB/ab (f=20%) tạo giao tử AB = 40%.", "b) Cơ thể AB/ab (f=20%) tạo giao tử Ab = 10%.", "c) Cơ thể Ab/aB (f=20%) tạo giao tử AB = 10%.", "d) Cơ thể AB/ab (f=20%) tạo 4 loại giao tử bằng nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: 40%, 40%, 10%, 10%."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Lai phân tích thu được 1200 cá thể, trong đó 240 cá thể tái tổ hợp. Tần số hoán vị gene là (điền %)", "answer": "20%", "explain": "f = (240/1200) × 100% = 20%."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cơ thể AB/ab có tần số hoán vị 10%. Tỉ lệ giao tử AB là (điền %)", "answer": "45%", "explain": "Giao tử liên kết AB = (100 − 10)/2 = 45%."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Lai phân tích ruồi đực F1 (AB/ab) × ab/ab (liên kết hoàn toàn) cho tỉ lệ kiểu hình:", "options": ["A. 3 : 1", "B. 1 : 1", "C. 1 : 1", "D. 1 : 1 : 1 : 1"], "answer": "B", "explain": "Liên kết hoàn toàn: ruồi đực chỉ tạo 2 loại giao tử AB, ab → Fb 1:1."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Ứng dụng của tần số hoán vị gene là lập:", "options": ["A. Sơ đồ lai", "B. Bản đồ gene", "C. Bản đồ gene", "D. Phả hệ"], "answer": "B", "explain": "Dựa vào tần số hoán vị để xác định khoảng cách và trình tự gene trên NST (bản đồ gene)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Lai phân tích cho Fb phân li 1:1. Kết luận:", "options": ["A. Phân li độc lập", "B. Liên kết gene hoàn toàn", "C. Liên kết gene hoàn toàn", "D. Hoán vị gene"], "answer": "B", "explain": "Fb 1:1 → cơ thể dị hợp chỉ tạo 2 loại giao tử → liên kết hoàn toàn."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cơ thể AB/ab có hoán vị gene. Tỉ lệ các loại giao tử là:", "options": ["A. Ab = aB nhiều hơn AB = ab", "B. AB = ab nhiều hơn Ab = aB", "C. AB = ab nhiều hơn Ab = aB", "D. AB = ab = Ab = aB"], "answer": "B", "explain": "Giao tử liên kết (AB, ab) nhiều hơn giao tử hoán vị (Ab, aB)."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho AB/ab × ab/ab, tần số hoán vị gene là 10%. Tỉ lệ kiểu hình ab/ab ở Fb là:", "options": ["A. 90%", "B. 45%", "C. 5%", "D. 10%"], "answer": "B", "explain": "Cơ thể AB/ab cho giao tử ab = (100−10)/2 = 45%; cơ thể ab/ab cho 100% giao tử ab. Tỉ lệ ab/ab ở Fb = 45% × 100% = 45%."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Lai phân tích cho Fb: 40% AB, 40% ab, 10% Ab, 10% aB. Kiểu gene của cơ thể dị hợp là:", "options": ["A. AB/AB", "B. AB/ab", "C. AB/ab", "D. Ab/aB"], "answer": "B", "explain": "Giao tử nhiều là AB, ab → liên kết AB/ab (dị hợp đều), f = 20%."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét cách nhận biết liên kết và hoán vị gene:", "statements": ["a) Lai phân tích cho Fb 1:1 → liên kết hoàn toàn.", "b) Lai phân tích cho Fb 4 KH (2 tỉ lệ) → có hoán vị.", "c) Lai phân tích cho Fb 1:1:1:1 → phân li độc lập.", "d) Không thể phân biệt liên kết và phân li độc lập."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: phân biệt được."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét ý nghĩa của liên kết và hoán vị gene:", "statements": ["a) Liên kết gene đảm bảo di truyền ổn định nhóm tính trạng.", "b) Hoán vị gene tạo biến dị tổ hợp.", "c) Cả hai đều là nguyên liệu cho chọn giống.", "d) Liên kết gene tạo biến dị tổ hợp."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: hoán vị mới tạo."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Hai gene cách nhau 20 cM thì tần số hoán vị giữa chúng là (điền %)", "answer": "20%", "explain": "1 cM = 1% tần số hoán vị → khoảng cách 20 cM tương ứng f = 20%."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Tần số hoán vị gene tối đa là (điền %)", "answer": "50%", "explain": "f ≤ 50%."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Liên kết gene là hiện tượng:", "options": ["A. Các gene cùng nằm trên một NST di truyền cùng nhau", "B. Các gene phân li độc lập", "C. Các gene cùng nằm trên một NST di truyền cùng nhau", "D. Gene đổi chỗ cho nhau"], "answer": "C", "explain": "Các gene cùng nằm trên một NST tạo nhóm gene liên kết, di truyền cùng nhau."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Trao đổi chéo xảy ra ở kì nào?", "options": ["A. Kì đầu của giảm phân I", "B. Kì giữa nguyên phân", "C. Kì đầu của giảm phân I", "D. Kì sau giảm phân II"], "answer": "C", "explain": "Trao đổi chéo xảy ra ở kì đầu của giảm phân I (tiếp hợp)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Lai phân tích cơ thể dị hợp 2 cặp gene (AB/ab), thu được 800 cá thể, trong đó có 80 cá thể mang kiểu hình tái tổ hợp. Tần số hoán vị gene là:", "options": ["A. 20%", "B. 5%", "C. 10%", "D. 90%"], "answer": "C", "explain": "Tần số hoán vị f = (số cá thể tái tổ hợp / tổng số) × 100% = (80/800) × 100% = 10%."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một cơ thể có kiểu gene AB/ab, tần số hoán vị gene là 30%. Tỉ lệ giao tử AB là:", "options": ["A. 15%", "B. 30%", "C. 35%", "D. 70%"], "answer": "C", "explain": "Giao tử liên kết AB = ab = (100% − f)/2 = (100 − 30)/2 = 35%."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một cơ thể có kiểu gene Ab/aB (dị hợp chéo), tần số hoán vị gene là 30%. Tỉ lệ giao tử hoán vị AB là:", "options": ["A. 35%", "B. 30%", "C. 15%", "D. 70%"], "answer": "C", "explain": "Ở dị hợp chéo Ab/aB, giao tử hoán vị là AB và ab, mỗi loại = f/2 = 30/2 = 15%."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hai gene A và B có tần số hoán vị là 25%. Khoảng cách giữa hai gene này trên bản đồ di truyền là:", "options": ["A. 50 cM", "B. 12 cM", "C. 25 cM", "D. 75 cM"], "answer": "C", "explain": "Khoảng cách giữa 2 gene = tần số hoán vị: 1% = 1 cM → khoảng cách = 25 cM."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét thí nghiệm của Morgan trên ruồi giấm:", "statements": ["a) Lai phân tích ruồi cái F1 cho 4 loại kiểu hình.", "b) Trong đó 2 loại giống P chiếm tỉ lệ lớn.", "c) 2 loại tái tổ hợp chiếm tỉ lệ nhỏ.", "d) Ruồi cái không xảy ra hoán vị gene."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ruồi cái có hoán vị."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét hiện tượng hoán vị gene:", "statements": ["a) Giao tử liên kết chiếm tỉ lệ lớn hơn giao tử hoán vị.", "b) Mỗi loại giao tử hoán vị = f/2.", "c) Mỗi loại giao tử liên kết = (1-f)/2.", "d) Tổng giao tử hoán vị luôn bằng 50%."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: bằng f ≤ 50%."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Lai phân tích thu được 800 cá thể, trong đó 80 cá thể tái tổ hợp. Tần số hoán vị gene là (điền %)", "answer": "10%", "explain": "f = (80/800) × 100% = 10%."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cơ thể AB/ab có tần số hoán vị 40%. Tỉ lệ giao tử AB là (điền %)", "answer": "30%", "explain": "Giao tử liên kết AB = (100 − 40)/2 = 30%."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đặc điểm di truyền ở ruồi giấm đực là:", "options": ["A. Ruồi đực hoán vị mạnh", "B. Cả hai giới hoán vị như nhau", "C. Ruồi đực không xảy ra hoán vị gene", "D. Ruồi đực không xảy ra hoán vị gene"], "answer": "D", "explain": "Ở ruồi giấm, hoán vị gene chỉ xảy ra ở giới cái."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Bản đồ gene giúp:", "options": ["A. Đếm số NST", "B. Tạo đột biến", "C. Xác định trình tự các gene trên NST", "D. Xác định trình tự các gene trên NST"], "answer": "D", "explain": "Bản đồ gene cho biết vị trí tương đối và khoảng cách giữa các gene."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Lai phân tích 2 cặp gene cho Fb 1:1:1:1. Kết luận:", "options": ["A. Liên kết gene", "B. Hoán vị gene", "C. Phân li độc lập", "D. Phân li độc lập"], "answer": "D", "explain": "Fb 1:1:1:1 → 4 loại giao tử bằng nhau → phân li độc lập (hoặc hoán vị với f=50%)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Mỗi loại giao tử hoán vị chiếm tỉ lệ:", "options": ["A. f", "B. (1-f)/2", "C. f/2", "D. f/2"], "answer": "D", "explain": "Mỗi loại giao tử hoán vị = f/2; mỗi loại liên kết = (1-f)/2."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho AB/ab × ab/ab, tần số hoán vị gene là 40%. Tỉ lệ kiểu hình ab/ab ở Fb là:", "options": ["A. 40%", "B. 60%", "C. 20%", "D. 30%"], "answer": "D", "explain": "Cơ thể AB/ab cho giao tử ab = (100−40)/2 = 30%; cơ thể ab/ab cho 100% giao tử ab. Tỉ lệ ab/ab ở Fb = 30% × 100% = 30%."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Fb: 40% AB, 40% ab, 10% Ab, 10% aB. Tần số hoán vị là:", "options": ["A. 10%", "B. 40%", "C. 20%", "D. 20%"], "answer": "D", "explain": "f = tổng giao tử hoán vị = 10% + 10% = 20%."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét cách nhận biết liên kết và hoán vị gene:", "statements": ["a) Dị hợp đều AB/ab: giao tử nhiều là AB, ab.", "b) Dị hợp chéo Ab/aB: giao tử nhiều là Ab, aB.", "c) Giao tử nhiều là giao tử liên kết.", "d) Giao tử ít là giao tử liên kết."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: giao tử ít là hoán vị."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét ý nghĩa của liên kết và hoán vị gene:", "statements": ["a) Bản đồ gene giúp xác định vị trí gene.", "b) Bản đồ gene hỗ trợ chọn giống.", "c) Bản đồ gene dựa trên tần số hoán vị.", "d) Bản đồ gene không có ý nghĩa thực tiễn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Hai gene cách nhau 30 cM thì tần số hoán vị giữa chúng là (điền %)", "answer": "30%", "explain": "1 cM = 1% tần số hoán vị → khoảng cách 30 cM tương ứng f = 30%."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Nhà khoa học phát hiện di truyền liên kết gene là (điền tên)", "answer": "Morgan", "explain": "Morgan (1910) trên ruồi giấm."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Ý nghĩa của liên kết gene là:", "options": ["A. Hạn chế biến dị tổ hợp", "B. Tăng đột biến", "C. Hạn chế biến dị tổ hợp", "D. Tạo nhiều biến dị tổ hợp"], "answer": "A", "explain": "Liên kết gene hạn chế biến dị tổ hợp, đảm bảo di truyền ổn định nhóm tính trạng tốt."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Giao tử mang tổ hợp gene mới do trao đổi chéo gọi là:", "options": ["A. Giao tử hoán vị (tái tổ hợp)", "B. Giao tử đột biến", "C. Giao tử hoán vị (tái tổ hợp)", "D. Giao tử liên kết"], "answer": "A", "explain": "Giao tử hoán vị mang tổ hợp allele mới (Ab, aB từ AB/ab)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Lai phân tích cơ thể dị hợp 2 cặp gene (AB/ab), thu được 600 cá thể, trong đó có 60 cá thể mang kiểu hình tái tổ hợp. Tần số hoán vị gene là:", "options": ["A. 10%", "B. 90%", "C. 20%", "D. 5%"], "answer": "A", "explain": "Tần số hoán vị f = (số cá thể tái tổ hợp / tổng số) × 100% = (60/600) × 100% = 10%."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một cơ thể có kiểu gene AB/ab, tần số hoán vị gene là 20%. Tỉ lệ giao tử AB là:", "options": ["A. 40%", "B. 80%", "C. 10%", "D. 20%"], "answer": "A", "explain": "Giao tử liên kết AB = ab = (100% − f)/2 = (100 − 20)/2 = 40%."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Một cơ thể có kiểu gene Ab/aB (dị hợp chéo), tần số hoán vị gene là 20%. Tỉ lệ giao tử hoán vị AB là:", "options": ["A. 10%", "B. 80%", "C. 40%", "D. 20%"], "answer": "A", "explain": "Ở dị hợp chéo Ab/aB, giao tử hoán vị là AB và ab, mỗi loại = f/2 = 20/2 = 10%."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hai gene A và B có tần số hoán vị là 35%. Khoảng cách giữa hai gene này trên bản đồ di truyền là:", "options": ["A. 35 cM", "B. 65 cM", "C. 70 cM", "D. 17 cM"], "answer": "A", "explain": "Khoảng cách giữa 2 gene = tần số hoán vị: 1% = 1 cM → khoảng cách = 35 cM."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét thí nghiệm của Morgan trên ruồi giấm:", "statements": ["a) Liên kết gene hạn chế biến dị tổ hợp.", "b) Hoán vị gene tạo biến dị tổ hợp.", "c) Hai hiện tượng này đều liên quan đến vị trí gene trên NST.", "d) Liên kết gene và hoán vị gene không thể cùng xảy ra."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: hoán vị xảy ra trên nền liên kết."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét hiện tượng hoán vị gene:", "statements": ["a) Hoán vị gene là nguồn nguyên liệu cho tiến hóa.", "b) Hoán vị gene được ứng dụng trong chọn giống.", "c) Liên kết gene giữ ổn định nhóm tính trạng tốt.", "d) Hoán vị gene làm mất hoàn toàn liên kết gene."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: chỉ đổi chỗ một số allele."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Lai phân tích thu được 600 cá thể, trong đó 60 cá thể tái tổ hợp. Tần số hoán vị gene là (điền %)", "answer": "10%", "explain": "f = (60/600) × 100% = 10%."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Cơ thể AB/ab có tần số hoán vị 50%. Tỉ lệ giao tử AB là (điền %)", "answer": "25%", "explain": "Giao tử liên kết AB = (100 − 50)/2 = 25%."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Hai loại kiểu hình tái tổ hợp (chiếm tỉ lệ nhỏ) ở Fb là:", "options": ["A. Xám, cụt và đen, dài", "B. Xám, cụt và đen, dài", "C. Xám, dài và đen, cụt", "D. Chỉ đen, cụt"], "answer": "B", "explain": "Giao tử hoán vị (Ab, aB) chiếm tỉ lệ nhỏ → KH tái tổ hợp ít."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Mối quan hệ giữa khoảng cách gene và tần số hoán vị:", "options": ["A. Khoảng cách càng lớn thì tần số hoán vị càng cao", "B. Khoảng cách càng lớn thì tần số hoán vị càng cao", "C. Không liên quan", "D. Tỉ lệ nghịch"], "answer": "B", "explain": "Hai gene càng xa nhau thì càng dễ trao đổi chéo → f càng cao (tối đa 50%)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Khi liên kết hoàn toàn, cơ thể AB/ab tạo mấy loại giao tử?", "options": ["A. 2 loại", "B. 2 loại", "C. 4 loại", "D. 1 loại"], "answer": "B", "explain": "Liên kết hoàn toàn: chỉ tạo giao tử liên kết AB và ab."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Tổng tỉ lệ 2 loại giao tử hoán vị:", "options": ["A. Nhỏ hơn 50%", "B. Nhỏ hơn 50%", "C. Bằng 50%", "D. Lớn hơn 50%"], "answer": "B", "explain": "Tổng giao tử hoán vị = f ≤ 50%."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho AB/ab × ab/ab, tần số hoán vị gene là 10%. Tỉ lệ kiểu hình ab/ab ở Fb là:", "options": ["A. 5%", "B. 45%", "C. 10%", "D. 90%"], "answer": "B", "explain": "Cơ thể AB/ab cho giao tử ab = (100−10)/2 = 45%; cơ thể ab/ab cho 100% giao tử ab. Tỉ lệ ab/ab ở Fb = 45% × 100% = 45%."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Kiểu gene Ab/aB được gọi là:", "options": ["A. Dị hợp chéo", "B. Dị hợp chéo", "C. Dị hợp đều", "D. Đồng hợp"], "answer": "B", "explain": "Ab/aB: allele trội nằm trên 2 NST khác nhau → dị hợp chéo (trans)."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét cách nhận biết liên kết và hoán vị gene:", "statements": ["a) Hoán vị gene chỉ xảy ra ở giới cái ruồi giấm.", "b) Ở nhiều loài, hoán vị xảy ra ở cả hai giới.", "c) Tần số hoán vị đặc trưng cho từng cặp gene.", "d) Mọi cặp gene đều có f = 50%."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét ý nghĩa của liên kết và hoán vị gene:", "statements": ["a) Di truyền liên kết là mở rộng của Mendel.", "b) Vẫn tuân theo quy luật phân li của NST.", "c) Morgan bổ sung cho học thuyết Mendel.", "d) Morgan bác bỏ quy luật Mendel."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Hai gene cách nhau 50 cM thì tần số hoán vị giữa chúng là (điền %)", "answer": "50%", "explain": "1 cM = 1% tần số hoán vị → khoảng cách 50 cM tương ứng f = 50%."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Ứng dụng của tần số hoán vị để xác định vị trí gene gọi là (điền tên)", "answer": "bản đồ gene", "explain": "Lập bản đồ gene."}]}]}
