{"sets": [{"name": "Đề 1", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Hoa mõm sói: đỏ (RR) × trắng (rr) → F1 hồng (Rr). F2 phân li theo tỉ lệ:", "options": ["A. 1 đỏ : 2 hồng : 1 trắng", "B. 1 đỏ : 2 hồng : 1 trắng", "C. 3 đỏ : 1 trắng", "D. 1 đỏ : 1 trắng"], "answer": "A", "explain": "Trội không hoàn toàn: F2 có tỉ lệ KG = tỉ lệ KH = 1:2:1."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Kiểu gene của người nhóm máu AB là:", "options": ["A. I^A I^B", "B. I^A I^B", "C. I^A I^A", "D. ii"], "answer": "A", "explain": "I^A và I^B đồng trội → I^A I^B cho nhóm máu AB."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Bố nhóm máu A (I^A i) × mẹ nhóm máu B (I^B i). Nhóm máu nào sau đây có thể xuất hiện ở con?", "options": ["A. AB", "B. A", "C. B", "D. O"], "answer": "A", "explain": "Con có thể nhận I^A hoặc i từ bố, I^B hoặc i từ mẹ → có thể có nhóm AB (I^A I^B)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Bố nhóm máu A (I^A i) × mẹ nhóm máu B (I^B i). Tỉ lệ con có nhóm máu AB là:", "options": ["A. 1/4", "B. 1/4", "C. 1/2", "D. 3/4"], "answer": "A", "explain": "I^A i × I^B i → I^A I^B (AB) = 1/2 × 1/2 = 1/4."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Tỉ lệ kiểu hình ở F2 của tương tác gene bổ sung là:", "options": ["A. 9 : 7", "B. 9 : 7", "C. 9 : 3 : 3 : 1", "D. 12 : 3 : 1"], "answer": "A", "explain": "Tương tác bổ sung: 9 A-B- (KH đặc biệt) : 7 còn lại."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Gene đa hiệu là:", "options": ["A. Một gene chi phối nhiều tính trạng", "B. Một gene chi phối nhiều tính trạng", "C. Nhiều gene chi phối một tính trạng", "D. Một gene chi phối một tính trạng"], "answer": "A", "explain": "Gene đa hiệu: một gene ảnh hưởng đến nhiều tính trạng (do sản phẩm gene tham gia nhiều quá trình)."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét hiện tượng trội không hoàn toàn:", "statements": ["a) Allele trội không lấn át hoàn toàn allele lặn.", "b) Kiểu hình dị hợp trung gian giữa bố mẹ.", "c) F2 phân li theo tỉ lệ 1 : 2 : 1.", "d) Tỉ lệ KH ở F2 là 3 : 1."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: 1:2:1."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét di truyền nhóm máu ABO:", "statements": ["a) Gene I có 3 allele: I^A, I^B, i.", "b) I^A và I^B đồng trội với nhau.", "c) I^A và I^B trội hoàn toàn so với i.", "d) Mỗi người mang 3 allele của gene I."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: mỗi người chỉ mang 2 allele."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Tỉ lệ kiểu hình F2 của trội không hoàn toàn (Rr × Rr) là (điền tỉ lệ)", "answer": "1 : 2 : 1", "explain": "F2: 1 RR : 2 Rr : 1 rr → 1 đỏ : 2 hồng : 1 trắng."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "AaBb × AaBb (tương tác cộng gộp). Số mức độ biểu hiện của tính trạng là", "answer": "5", "explain": "Số allele trội từ 0 đến 4 → 5 mức độ."}]}, {"name": "Đề 2", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "AaBb × AaBb (tương tác bổ sung). Tỉ lệ hoa trắng ở F2 là:", "options": ["A. 9/16", "B. 7/16", "C. 1/16", "D. 7/16"], "answer": "B", "explain": "Hoa trắng (còn lại) = 7/16."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Tính trạng nào sau đây do nhiều gene cộng gộp chi phối?", "options": ["A. Nhóm máu", "B. Chiều cao cây", "C. Mù màu", "D. Chiều cao cây"], "answer": "B", "explain": "Chiều cao là tính trạng số lượng do nhiều gene cộng gộp."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Phép lai Rr × rr (trội không hoàn toàn) cho tỉ lệ hoa hồng là:", "options": ["A. 1/4", "B. 1/2", "C. 3/4", "D. 1/2"], "answer": "B", "explain": "Rr × rr → 1/2 Rr (hồng) : 1/2 rr (trắng)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Người nhóm máu B có con nhóm máu O. Kiểu gene của người đó là:", "options": ["A. I^B I^B", "B. I^B i", "C. I^A I^B", "D. I^B i"], "answer": "B", "explain": "Có con ii → người nhóm B phải có allele i → llele cùng biểu hiện ở cơ thể dị hợp gọi là:", "options": ["A. Trội hoàn toàn", "B. Đồng trội", "C. Đồng trội", "D. Trội không hoàn toàn"], "answer": "C", "explain": "Đồng trội: I^A I^B biểu hiện cả hai → nhóm máu AB."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Bố nhóm máu AB (I^A I^B) × mẹ nhóm máu O (ii). Con có thể có nhóm máu nào?", "options": ["A. AB", "B. A", "C. A hoặc B", "D. B"], "answer": "C", "explain": "Con: 1/2 I^A i (nhóm A) : 1/2 I^B i (nhóm B)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Bố nhóm máu O × mẹ nhóm máu AB. Tỉ lệ con có nhóm máu O là:", "options": ["A. 1/2", "B. 0", "C. 0", "D. 1/4"], "answer": "C", "explain": "ii × I^A I^B → con là I^A i hoặc I^B i, không thể có ii (O)."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Tỉ lệ kiểu hình ở F2 của tương tác át chế (lặn át) là:", "options": ["A. 12 : 3 : 1", "B. 13 : 3", "C. 13 : 3", "D. 9 : 7"], "answer": "C", "explain": "Át chế kiểu 13:3 (gene lặn át chế)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Hiện tượng nhiều gene cùng chi phối một tính trạng gọi là:", "options": ["A. Gene đa allele", "B. Tương tác gene", "C. Tương tác gene", "D. Gene đa hiệu"], "answer": "C", "explain": "Tương tác gene: nhiều gene không allele cùng tác động lên một tính trạng."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét hiện tượng trội không hoàn toàn:", "statements": ["a) Rr × Rr → 1 RR : 2 Rr : 1 rr.", "b) RR × rr → 100% Rr.", "c) Rr × rr → 1 Rr : 1 rr.", "d) rr × rr → 100% Rr."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: 100% rr."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét di truyền nhóm máu ABO:", "statements": ["a) I^A i × I^B i có thể sinh con nhóm máu AB.", "b) ii × ii chỉ sinh con nhóm máu O.", "c) I^A I^B × ii không sinh con nhóm O.", "d) Bố mẹ nhóm O có thể sinh con nhóm AB."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: không thể."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Tỉ lệ F2 của tương tác bổ sung là (điền tỉ lệ)", "answer": "9 : 7", "explain": "Bổ sung: 9 (A-B-) : 7 (còn lại)."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Aabb × aabb (tương tác cộng gộp). Số mức độ biểu hiện của tính trạng là", "answer": "2", "explain": "Số allele trội: 0, 1 → 2 mức độ."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Bản chất của tương tác bổ sung là:", "options": ["A. Hai gene cùng tham gia tạo một tính trạng", "B. Một gene át gene khác", "C. Gene này thay gene kia", "D. Hai gene cùng tham gia tạo một tính trạng"], "answer": "D", "explain": "Bổ sung: hai gene cùng cần thiết để tạo KH đặc biệt."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Phép lai AaBb × AaBb (cộng gộp) cho bao nhiêu mức độ biểu hiện của tính trạng?", "options": ["A. 5", "B. 3", "C. 9", "D. 5"], "answer": "D", "explain": "Số allele trội từ 0 đến 4 → 5 mức độ (1:4:6:4:1)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Phép lai Rr × Rr (trội không hoàn toàn). Tỉ lệ hoa trắng (rr) là:", "options": ["A. 1/4", "B. 1/2", "C. 3/4", "D. 1/4"], "answer": "D", "explain": "rr = 1/4."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cặp vợ chồng đều nhóm máu O có thể sinh con nhóm máu AB không?", "options": ["A. Không thể", "B. Có thể", "C. Chưa biết", "D. Không thể"], "answer": "D", "explain": "ii × ii → 100% ii (O), không thể có AB."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "AaBb × AaBb (cộng gộp). Tỉ lệ cá thể có 1 allele trội là:", "options": ["A. 4/16", "B. 6/16", "C. 1/16", "D. 4/16"], "answer": "D", "explain": "1 allele trội: Aabb (2/16) + aaBb (2/16) = 4/16."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "AaBb × AaBb (át chế lặn 13:3). Tỉ lệ KH bị át chế là:", "options": ["A. 13/16", "B. 3/16", "C. 9/16", "D. 13/16"], "answer": "D", "explain": "Át chế lặn: 13 (bị át chế) : 3."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tương tác giữa các gene không allele:", "statements": ["a) Trong cộng gộp, số allele trội quyết định mức độ KH.", "b) AaBb × AaBb (cộng gộp) có 5 mức KH.", "c) Mức cao nhất là AABB.", "d) Mức thấp nhất là AaBb."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: thấp nhất là aabb."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các phép lai liên quan đến mở rộng Mendel:", "statements": ["a) 9:7 = 9 (A-B-) : 7 (còn lại).", "b) 12:3:1 có gene át chế.", "c) 1:4:6:4:1 theo số allele trội.", "d) 9:3:3:1 là tương tác gene."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: là phân li độc lập."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Mỗi cá thể lưỡng bội mang tối đa mấy allele của gene I", "answer": "2", "explain": "Mỗi cá thể lưỡng bội mang tối đa 2 allele."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Kiểu hình dị hợp trong trội không hoàn toàn là (điền: trung gian/giống bố)", "answer": "trung gian", "explain": "KH trung gian giữa bố và mẹ."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Kiểu gene của hoa mõm sói màu hồng là:", "options": ["A. Rr", "B. RR", "C. rr", "D. Rr"], "answer": "A", "explain": "Hoa hồng là dị hợp Rr (trung gian giữa RR đỏ và rr trắng)."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Kiểu gene của người nhóm máu A là:", "options": ["A. I^A i hoặc I^A I^A", "B. I^B i", "C. ii", "D. I^A i hoặc I^A I^A"], "answer": "A", "explain": "Nhóm máu A: I^A I^A hoặc I^A i."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Bố nhóm máu A (I^A i) × mẹ nhóm máu O (ii). Con có thể có nhóm máu nào?", "options": ["A. A hoặc O", "B. B", "C. AB", "D. A"], "answer": "A", "explain": "Con: 1/2 I^A i (A) : 1/2 ii (O)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Bố nhóm máu AB × mẹ nhóm máu O. Tỉ lệ con có nhóm máu A hoặc B là:", "options": ["A. 1", "B. 1/2", "C. 1/4", "D. 1"], "answer": "A", "explain": "100% con là I^A i (A) hoặc I^B i (B)."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Kiểu tương tác cho tỉ lệ F2 là 9:7 là:", "options": ["A. Bổ sung", "B. Át chế", "C. Cộng gộp", "D. Bổ sung"], "answer": "A", "explain": "9:7 là tỉ lệ đặc trưng của tương tác bổ sung."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Trong tương tác cộng gộp, mức độ biểu hiện của tính trạng phụ thuộc vào:", "options": ["A. Số lượng allele trội", "B. Môi trường duy nhất", "C. Giới tính", "D. Số lượng allele trội"], "answer": "A", "explain": "Cộng gộp: mỗi allele trội góp một phần như nhau vào tính trạng."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét hiện tượng trội không hoàn toàn:", "statements": ["a) Tính trạng trung gian do liều lượng sản phẩm gene.", "b) Một allele trội chỉ tạo một nửa lượng sắc tố.", "c) Hai allele trội tạo đủ sắc tố.", "d) Allele lặn tạo sắc tố đỏ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: allele lặn không tạo sắc tố."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét di truyền nhóm máu ABO:", "statements": ["a) Người nhóm máu AB không thể cho giao tử i.", "b) Người nhóm máu O chỉ cho giao tử i.", "c) Người I^A i cho 2 loại giao tử.", "d) Người I^A I^A cho 2 loại giao tử."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: chỉ cho 1 loại (I^A)."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Tỉ lệ F2 của tương tác át chế (trội át) là (điền tỉ lệ)", "answer": "12 : 3 : 1", "explain": "Át chế: 12 : 3 : 1."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Aabb × aaBb (tương tác cộng gộp). Số mức độ biểu hiện của tính trạng là", "answer": "3", "explain": "Số allele trội: 0, 1, 2 → 3 mức độ."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "AaBb × AaBb (tương tác bổ sung, A-B- cho hoa đỏ). Tỉ lệ hoa đỏ ở F2 là:", "options": ["A. 3/16", "B. 9/16", "C. 9/16", "D. 7/16"], "answer": "B", "explain": "Hoa đỏ (A-B-) = 9/16."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Ví dụ về tương tác cộng gộp là:", "options": ["A. Mù màu", "B. Màu da người", "C. Màu da người", "D. Nhóm máu ABO"], "answer": "B", "explain": "Màu da do nhiều gene cộng gộp, mỗi allele trội làm da đen thêm một mức."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Phép lai nào cho tỉ lệ 1:2:1 cả về KG và KH?", "options": ["A. RR × Rr → 3:1", "B. Rr × Rr → 1 đỏ : 2 hồng : 1 trắng", "C. Rr × Rr → 1 đỏ : 2 hồng : 1 trắng", "D. RR × rr → 1:1"], "answer": "B", "explain": "Trội không hoàn toàn: Rr × Rr → 1 RR : 2 Rr : 1 rr = 1 đỏ : 2 hồng : 1 trắng."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Người nhóm máu A có con nhóm máu O. Kiểu gene của người đó là:", "options": ["A. I^A I^B", "B. I^A i", "C. I^A i", "D. I^A I^A"], "answer": "B", "explain": "Có con nhóm O (ii) → người nhóm A phải cho giao tử i → KG I^A i."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "AaBb × AaBb (cộng gộp). Tỉ lệ cá thể có 2 allele trội là:", "options": ["A. 4/16", "B. 6/16", "C. 6/16", "D. 1/16"], "answer": "B", "explain": "2 allele trội: AaBb (4/16) + AAbb (1/16) + aaBB (1/16) = 6/16."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "AaBb × AaBb (át chế: A- át chế, cho KH riêng). Tỉ lệ KH bị át chế là:", "options": ["A. 9/16", "B. 12/16", "C. 12/16", "D. 3/16"], "answer": "B", "explain": "A- (12/16) át chế → KH riêng; còn lại 3:1."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tương tác giữa các gene không allele:", "statements": ["a) Tương tác bổ sung cho tỉ lệ F2 là 9 : 7.", "b) Tương tác át chế cho tỉ lệ 12 : 3 : 1.", "c) Tương tác cộng gộp cho tỉ lệ 1 : 4 : 6 : 4 : 1.", "d) Các tỉ lệ trên đều là biến dạng của 9:3:3:1."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 phát biểu đều đúng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các phép lai liên quan đến mở rộng Mendel:", "statements": ["a) Rr × Rr (trội không hoàn toàn) → 1:2:1.", "b) I^A i × ii → 1 nhóm A : 1 nhóm O.", "c) AaBb × AaBb (bổ sung) → 9:7.", "d) AaBb × AaBb (cộng gộp) → 9:3:3:1."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: 1:4:6:4:1."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Gene I quy định nhóm máu ABO có số allele là", "answer": "3", "explain": "Gene I có 3 allele: I^A, I^B, i."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Bố nhóm máu O × mẹ nhóm máu AB. Tỉ lệ con nhóm máu O là (điền số, dạng thập phân)", "answer": "0", "explain": "ii × I^A I^B → không thể có ii."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Kiểu hình của cơ thể dị hợp trong trội không hoàn toàn là:", "options": ["A. Trung gian giữa bố và mẹ", "B. Giống bố", "C. Trung gian giữa bố và mẹ", "D. Giống mẹ"], "answer": "C", "explain": "Allele trội không lấn át hoàn toàn allele lặn → KH trung gian."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Kiểu gene của người nhóm máu O là:", "options": ["A. ii", "B. I^A i", "C. ii", "D. I^B i"], "answer": "C", "explain": "Nhóm máu O có KG ii (đồng hợp lặn)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Bố nhóm máu A (I^A I^A) × mẹ nhóm máu O (ii). Con có nhóm máu nào?", "options": ["A. B", "B. AB", "C. A", "D. O"], "answer": "C", "explain": "100% con có KG I^A i → nhóm máu A."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Bố nhóm máu AB (I^A I^B) × mẹ nhóm máu O (ii). Tỉ lệ con nhóm máu A là:", "options": ["A. 1/2", "B. 1/4", "C. 1/2", "D. 3/4"], "answer": "C", "explain": "Con: 1/2 I^A i (A) : 1/2 I^B i (B) → nhóm A = 1/2."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Tỉ lệ kiểu hình ở F2 của tương tác át chế (trội át) là:", "options": ["A. 12 : 3 : 1", "B. 9 : 7", "C. 12 : 3 : 1", "D. 9 : 3 : 3 : 1"], "answer": "C", "explain": "Át chế: 12 (A- át chế) : 3 : 1."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ví dụ về gene đa hiệu là gene gây bệnh:", "options": ["A. Hồng cầu hình liềm", "B. Mù màu", "C. Hồng cầu hình liềm", "D. Bạch tạng"], "answer": "C", "explain": "Gene hồng cầu liềm vừa làm biến dạng hồng cầu, vừa gây thiếu máu, tắc mạch..."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét hiện tượng trội không hoàn toàn:", "statements": ["a) Ví dụ: hoa mõm sói đỏ × trắng → hồng.", "b) Hoa hồng có KG dị hợp Rr.", "c) Tỉ lệ KG bằng tỉ lệ KH ở F2.", "d) Trội không hoàn toàn còn gọi là đồng trội."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: khác đồng trội."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét di truyền nhóm máu ABO:", "statements": ["a) Nhóm máu O có KG ii.", "b) Nhóm máu AB có KG I^A I^B.", "c) Nhóm máu A có thể là I^A I^A hoặc I^A i.", "d) Nhóm máu B chỉ có KG I^B I^B."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: còn I^B i."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Kiểu gene của người nhóm máu AB là (điền KG)", "answer": "I^A I^B", "explain": "I^A và I^B đồng trội → I^A I^B."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "AaBb × aabb (tương tác cộng gộp). Số mức độ biểu hiện của tính trạng là", "answer": "3", "explain": "Số allele trội: 0, 1, 2 → 3 mức độ."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Ví dụ về tương tác bổ sung là:", "options": ["A. Nhóm máu ABO", "B. Màu hoa mõm sói", "C. Màu hoa đậu thơm", "D. Màu hoa đậu thơm"], "answer": "D", "explain": "Màu hoa đậu thơm: A-B- đỏ, còn lại trắng (bổ sung 9:7)."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Tính trạng do nhiều gene cộng gộp chi phối thường là:", "options": ["A. Tính trạng chất lượng", "B. Tính trạng giới tính", "C. Tính trạng số lượng", "D. Tính trạng số lượng"], "answer": "D", "explain": "Tính trạng số lượng (cân nặng, chiều cao, năng suất) do nhiều gene cộng gộp."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Phép lai RR × rr (trội không hoàn toàn) cho F1:", "options": ["A. 100% đỏ", "B. 1 đỏ : 1 trắng", "C. 100% hồng", "D. 100% hồng"], "answer": "D", "explain": "RR × rr → 100% Rr (hồng)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Cặp vợ chồng nhóm máu A (I^A i) × B (I^B i) có thể sinh con nhóm máu AB vì:", "options": ["A. ii", "B. I^A I^A", "C. I^A I^B", "D. I^A I^B"], "answer": "D", "explain": "Con nhận I^A từ bố và I^B từ mẹ → I^A I^B (AB)."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "AaBb × AaBb (cộng gộp). Tỉ lệ cá thể có 0 allele trội (aabb) là:", "options": ["A. 4/16", "B. 6/16", "C. 1/16", "D. 1/16"], "answer": "D", "explain": "aabb = 1/16 (mức thấp nhất)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Bản chất của tương tác át chế là:", "options": ["A. Hai gene cùng biểu hiện", "B. Gene này thay thế gene kia", "C. Gene át chế ngăn sự biểu hiện của gene khác", "D. Gene át chế ngăn sự biểu hiện của gene khác"], "answer": "D", "explain": "Át chế: một gene ngăn cản sự biểu hiện của gene không allele khác."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tương tác giữa các gene không allele:", "statements": ["a) Màu hoa đậu thơm là ví dụ bổ sung.", "b) Màu da người là ví dụ cộng gộp.", "c) Tính trạng số lượng do nhiều gene chi phối.", "d) Tương tác gene chỉ có ở thực vật."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: có ở cả động vật."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các phép lai liên quan đến mở rộng Mendel:", "statements": ["a) Trội không hoàn toàn: F1 trung gian.", "b) Đồng trội: F1 biểu hiện cả hai.", "c) Hai hiện tượng này giống nhau.", "d) Nhóm máu AB là ví dụ đồng trội."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: khác nhau. d) Đúng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Hệ nhóm máu ABO ở người có mấy kiểu gene", "answer": "6", "explain": "I^A I^A, I^A i, I^B I^B, I^B i, I^A I^B, ii → 6 kiểu gene."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Một gene chi phối nhiều tính trạng gọi là gene (điền tên)", "answer": "đa hiệu", "explain": "Gene đa hiệu."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Đặc điểm của trội không hoàn toàn ở F2 là:", "options": ["A. Tỉ lệ kiểu gene bằng tỉ lệ kiểu hình", "B. Chỉ có 1 loại KH", "C. Tỉ lệ kiểu gene bằng tỉ lệ kiểu hình", "D. Tỉ lệ KH là 3:1"], "answer": "A", "explain": "F2: 1 RR : 2 Rr : 1 rr → 1 đỏ : 2 hồng : 1 trắng."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Gene quy định nhóm máu ABO có bao nhiêu allele?", "options": ["A. 3", "B. 4", "C. 3", "D. 2"], "answer": "A", "explain": "Gene I có 3 allele: I^A, I^B, i (gene đa allele)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Bố mẹ đều có nhóm máu O. Con có nhóm máu nào?", "options": ["A. O", "B. AB", "C. A", "D. B"], "answer": "A", "explain": "ii × ii → 100% ii → nhóm máu O."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Bố nhóm máu A (I^A i) × mẹ nhóm máu B (I^B i). Tỉ lệ con có nhóm máu O là:", "options": ["A. 1/4", "B. 0", "C. 1/4", "D. 1/2"], "answer": "A", "explain": "ii = 1/2 × 1/2 = 1/4."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Tỉ lệ kiểu hình ở F2 của tương tác cộng gộp là:", "options": ["A. 1 : 4 : 6 : 4 : 1", "B. 9 : 3 : 3 : 1", "C. 1 : 4 : 6 : 4 : 1", "D. 9 : 7"], "answer": "A", "explain": "Cộng gộp: phân li theo số lượng allele trội (0→4): 1:4:6:4:1."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Một gene có nhiều hơn 2 allele trong quần thể gọi là:", "options": ["A. Gene đa allele", "B. Tương tác gene", "C. Gene đa allele", "D. Gene đa hiệu"], "answer": "A", "explain": "Gene đa allele: có hơn 2 allele (nhưng mỗi cá thể lưỡng bội chỉ mang 2)."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét hiện tượng trội không hoàn toàn:", "statements": ["a) Trội không hoàn toàn là mở rộng của Mendel.", "b) Bản chất vẫn là phân li allele trong giảm phân.", "c) Khác Mendel ở mối quan hệ KG – KH.", "d) Không tuân theo quy luật phân li."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: vẫn tuân theo."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét di truyền nhóm máu ABO:", "statements": ["a) Nhóm máu di truyền theo quy luật Mendel mở rộng.", "b) Đây là ví dụ về gene đa allele và đồng trội.", "c) Có 4 nhóm máu: A, B, AB, O.", "d) Có 4 kiểu gene quy định nhóm máu."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: có 6 kiểu gene."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Tỉ lệ F2 của tương tác cộng gộp (AaBb × AaBb) là (điền tỉ lệ)", "answer": "1 : 4 : 6 : 4 : 1", "explain": "Theo số allele trội 0→4: 1:4:6:4:1."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "AaBb × Aabb (tương tác cộng gộp). Số mức độ biểu hiện của tính trạng là", "answer": "4", "explain": "Số allele trội: 0, 1, 2, 3 → 4 mức độ."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "F2 của tương tác bổ sung (A-B- đỏ) phân li:", "options": ["A. 9 hoa đỏ : 7 hoa trắng", "B. 9 hoa đỏ : 7 hoa trắng", "C. 9 đỏ : 3 hồng : 3 trắng : 1 vàng", "D. 3 đỏ : 1 trắng"], "answer": "B", "explain": "9 A-B- (đỏ) : 7 (A-bb, aaB-, aabb) trắng."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "AaBb × AaBb (cộng gộp). Tỉ lệ cá thể có 4 allele trội là:", "options": ["A. 1/16", "B. 1/16", "C. 4/16", "D. 6/16"], "answer": "B", "explain": "4 allele trội (AABB) = 1/16."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Phép lai Rr × Rr (trội không hoàn toàn). Tỉ lệ hoa hồng (Rr) là:", "options": ["A. 2/4", "B. 2/4", "C. 1/4", "D. 3/4"], "answer": "B", "explain": "Rr = 2/4 = 1/2."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Phép lai nào có thể cho đủ 4 nhóm máu ở đời con?", "options": ["A. I^A i × I^B i", "B. I^A i × I^B i", "C. I^A I^A × I^B I^B", "D. ii × ii"], "answer": "B", "explain": "I^A i × I^B i → A, B, AB, O (đủ 4 nhóm máu)."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Tỉ lệ phân li theo số allele trội (0→4) trong phép lai AaBb × AaBb là:", "options": ["A. 1:4:6:4:1", "B. 1:4:6:4:1", "C. 9:3:3:1", "D. 1:2:1"], "answer": "B", "explain": "Tương tác cộng gộp: 1 (0 trội) : 4 (1 trội) : 6 (2 trội) : 4 (3 trội) : 1 (4 trội)."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Ví dụ về tương tác át chế là:", "options": ["A. Màu lông chuột", "B. Màu lông chuột", "C. Nhóm máu ABO", "D. Hoa mõm sói"], "answer": "B", "explain": "Màu lông chuột: gene át chế C/c tương tác với gene màu sắc."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét tương tác giữa các gene không allele:", "statements": ["a) Gene đa hiệu: 1 gene → nhiều tính trạng.", "b) Tương tác gene: nhiều gene → 1 tính trạng.", "c) Hai hiện tượng này ngược nhau.", "d) Gene đa hiệu vi phạm di truyền Mendel."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: không vi phạm."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các phép lai liên quan đến mở rộng Mendel:", "statements": ["a) Mở rộng Mendel vẫn tuân theo phân li allele.", "b) Cơ sở tế bào học vẫn là giảm phân.", "c) Khác Mendel ở quan hệ KG – KH.", "d) Mở rộng Mendel bác bỏ quy luật Mendel."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: chỉ mở rộng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Gene I gồm các allele I^A, I^B và i. Vậy gene I có mấy allele", "answer": "3", "explain": "I^A, I^B, i → 3 allele."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Tương tác cho tỉ lệ 9:7 gọi là tương tác (điền tên)", "answer": "bổ sung", "explain": "Tương tác bổ sung."}]}]}
