). Số loại kiểu gene ở đời con là:", "options": ["A. 8", "B. 4", "C. 9", "D. 16"], "answer": "C", "explain": "Số loại KG = 3^n = 3^2 = 9."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét thí nghiệm lai một cặp tính trạng của Mendel:", "statements": ["a) Mendel dùng phương pháp lai và phân tích thống kê.", "b) Đối tượng nghiên cứu là đậu Hà Lan.", "c) Đậu Hà Lan tự thụ phấn nghiêm ngặt.", "d) Mendel nghiên cứu trên ruồi giấm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ruồi giấm là đối tượng của Morgan."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét thí nghiệm lai hai cặp tính trạng của Mendel:", "statements": ["a) Biến dị tổ hợp là nguồn nguyên liệu cho chọn giống.", "b) Phân li độc lập tạo nhiều biến dị tổ hợp.", "c) Mỗi cặp gene phân li độc lập với cặp khác.", "d) Các gene trên cùng một NST luôn phân li độc lập."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: gene cùng NST liên kết với nhau."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Một cơ thể dị hợp về 2 cặp gene (phân li độc lập). Số loại giao tử tối đa là", "answer": "4", "explain": "Số loại giao tử = 2^n = 2^2 = 4."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Tỉ lệ kiểu hình của phép lai phân tích Aa × aa (trội hoàn toàn) là (điền tỉ lệ)", "answer": "1 : 1", "explain": "1 Aa : 1 aa → 1 trội : 1 lặn."}]}, {"name": "Đề 4", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Mỗi tính trạng do một cặp allele, các allele phân li trong giảm phân là quy luật:", "options": ["A. Phân li", "B. Phân li độc lập", "C. Hoán vị gene", "D. Phân li"], "answer": "D", "explain": "Quy luật phân li (lai 1 cặp tính trạng)."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Allele trội biểu hiện hoàn toàn ở cả đồng hợp và dị hợp gọi là:", "options": ["A. Trội hoàn toàn", "B. Trội không hoàn toàn", "C. Đồng trội", "D. Trội hoàn toàn"], "answer": "D", "explain": "Trội hoàn toàn: Aa có KH giống AA."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Allele A quy định quả trơn trội hoàn toàn so với a quy định quả nhăn. Lai phân tích cây quả trơn có kiểu gene Aa. Tỉ lệ kiểu hình ở đời con là:", "options": ["A. 3 quả trơn : 1 quả nhăn", "B. 100% quả trơn", "C. 100% quả nhăn", "D. 1 quả trơn : 1 quả nhăn"], "answer": "D", "explain": "Lai phân tích: Aa × aa → 1 Aa : 1 aa → 1 quả trơn : 1 quả nhăn."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong lai phân tích, cá thể dùng để lai có kiểu gene:", "options": ["A. Đồng hợp lặn (aa)", "B. Dị hợp", "C. Đồng hợp trội", "D. Đồng hợp lặn (aa)"], "answer": "D", "explain": "Lai phân tích: lai với cá thể đồng hợp lặn."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Phép lai Aabb × aaBb (trội hoàn toàn, phân li độc lập) cho tỉ lệ kiểu hình đời con là:", "options": ["A. 3 : 1", "B. 9 : 7", "C. 1 : 2 : 1", "D. 1 : 1 : 1 : 1"], "answer": "D", "explain": "Cặp A: Aa × aa → 1 A- : 1 aa; cặp B: bb × Bb → 1 B- : 1 bb. Kết hợp: 1/4 A-B- : 1/4 A-bb : 1/4 aaB- : 1/4 aabb = 1:1:1:1."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Phép lai AaBb × AaBb. Tỉ lệ kiểu gene AaBb ở đời con là:", "options": ["A. 1/16", "B. 1/4", "C. 3/8", "D. 1/8"], "answer": "D", "explain": "Aa × Aa → Aa = 1/2; Bb × Bb → Bb = 1/2. AaBb = 1/2 × 1/2 = 1/4."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét phép lai phân tích:", "statements": ["a) Trong chọn giống cần xác định KG của cá thể trội.", "b) Lai phân tích ứng dụng trong chọn giống.", "c) Kết quả lai phân tích luôn là 1:1.", "d) AA × aa cho đời con đồng tính."], "answer": ["T", "T", "F", "T"], "explain": "a) Đúng. b) Đúng. c) Sai: có thể đồng tính (nếu là AA). d) Đúng."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét cơ sở tế bào học của các quy luật Mendel:", "statements": ["a) Thụ tinh là sự kết hợp ngẫu nhiên giao tử đực và cái.", "b) Tổ hợp giao tử tạo các kiểu gene ở đời con.", "c) Tỉ lệ KH là kết quả của tổ hợp giao tử.", "d) Giao tử không ảnh hưởng đến đời con."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Tỉ lệ kiểu hình ở F2 của tương tác bổ sung (AaBb × AaBb) là (điền tỉ lệ)", "answer": "9 : 7", "explain": "Tương tác bổ sung: 9 (A-B-) : 7 (còn lại)."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phép lai dị hợp về 3 cặp gene (phân li độc lập). Số loại kiểu gene ở đời con là", "answer": "27", "explain": "Số loại KG = 3^n = 3^3 = 27."}]}, {"name": "Đề 5", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Nhà khoa học được mệnh danh là 'ông tổ di truyền học' là:", "options": ["A. Gregor Mendel", "B. Morgan", "C. Watson", "D. Gregor Mendel"], "answer": "A", "explain": "Gregor Mendel (1822–1884) phát hiện các quy luật di truyền."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Các trạng thái khác nhau của cùng một gene được gọi là:", "options": ["A. Allele", "B. NST", "C. Tính trạng", "D. Allele"], "answer": "A", "explain": "Allele là các trạng thái khác nhau của cùng một gene (A, a)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Ở đậu Hà Lan, allele A quy định lá to trội hoàn toàn so với allele a quy định lá nhỏ. Cho P thuần chủng lá to × lá nhỏ, F1 tự thụ phấn. Tỉ lệ kiểu hình ở F2 là:", "options": ["A. 3 trội : 1 lặn", "B. 1 trội : 2 trung gian : 1 lặn", "C. 100% trội", "D. 1 trội : 1 lặn"], "answer": "A", "explain": "P: AA × aa → F1: 100% Aa (lá to). F1 × F1 → F2: 1 AA : 2 Aa : 1 aa → 3 lá to : 1 lá nhỏ."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một cơ thể có kiểu gene dị hợp về 2 cặp gene (các gene phân li độc lập). Số loại giao tử tối đa cơ thể này tạo ra là:", "options": ["A. 4", "B. 9", "C. 5", "D. 4"], "answer": "A", "explain": "Số loại giao tử = 2^n = 2^2 = 4."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho AaBb × AaBb (mỗi gene quy định một tính trạng, trội lặn hoàn toàn). Tỉ lệ kiểu hình lặn về cả hai tính trạng ở đời con là:", "options": ["A. 1/16", "B. 9/16", "C. 1/4", "D. 3/16"], "answer": "A", "explain": "Tỉ lệ aabb = 1/4 × 1/4 = 1/16."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Phép lai dị hợp về 4 cặp gene (phân li độc lập, trội hoàn toàn). Số loại kiểu gene ở đời con là:", "options": ["A. 81", "B. 256", "C. 80", "D. 16"], "answer": "A", "explain": "Số loại KG = 3^n = 3^4 = 81."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét thí nghiệm lai một cặp tính trạng của Mendel:", "statements": ["a) P thuần chủng tạo giao tử thuần khiết.", "b) Sự thụ tinh là sự tổ hợp ngẫu nhiên các giao tử.", "c) Tỉ lệ 3:1 nghiệm đúng khi số cá thể đủ lớn.", "d) F1 của lai 1 cặp tính trạng luôn phân tính."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: F1 đồng tính trội."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét thí nghiệm lai hai cặp tính trạng của Mendel:", "statements": ["a) Điều kiện nghiệm đúng: P thuần chủng.", "b) Cần số lượng cá thể lai đủ lớn.", "c) Trội – lặn phải hoàn toàn.", "d) Mỗi gene quy định nhiều tính trạng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: mỗi gene quy định một tính trạng."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Một cơ thể dị hợp về 3 cặp gene (phân li độc lập). Số loại giao tử tối đa là", "answer": "8", "explain": "Số loại giao tử = 2^n = 2^3 = 8."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Tỉ lệ kiểu hình ở F2 của phép lai một cặp tính trạng (trội không hoàn toàn) là (điền tỉ lệ)", "answer": "1 : 2 : 1", "explain": "F2: 1 trội : 2 trung gian : 1 lặn."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Tỉ lệ kiểu hình ở F2 của phép lai hai cặp tính trạng (trội hoàn toàn, phân li độc lập) là:", "options": ["A. 1 : 1 : 1 : 1", "B. 9 : 3 : 3 : 1", "C. 9 : 3 : 3 : 1", "D. 3 : 1"], "answer": "B", "explain": "F2 của lai 2 cặp: 9:3:3:1."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Biểu hiện ra bên ngoài của kiểu gene được gọi là:", "options": ["A. Allele", "B. Kiểu hình", "C. Kiểu hình", "D. Kiểu gene"], "answer": "B", "explain": "Kiểu hình là biểu hiện ra bên ngoài của kiểu gene."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Allele A quy định hoa đỏ trội hoàn toàn so với a quy định hoa trắng. Lai phân tích cây hoa đỏ có kiểu gene Aa. Tỉ lệ kiểu hình ở đời con là:", "options": ["A. 100% hoa trắng", "B. 1 hoa đỏ : 1 hoa trắng", "C. 3 hoa đỏ : 1 hoa trắng", "D. 100% hoa đỏ"], "answer": "B", "explain": "Lai phân tích: Aa × aa → 1 Aa : 1 aa → 1 hoa đỏ : 1 hoa trắng."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Để xác định kiểu gene của cá thể mang kiểu hình trội, người ta dùng phép lai:", "options": ["A. Lai thuận nghịch", "B. Lai phân tích (lai với đồng hợp lặn)", "C. Lai phân tích (lai với đồng hợp lặn)", "D. Tự thụ phấn"], "answer": "B", "explain": "Lai cá thể cần kiểm tra với đồng hợp lặn (aa): nếu đời con đồng tính → AA; phân tính 1:1 → Aa."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Phép lai Aabb × aaBb (trội hoàn toàn, phân li độc lập) cho tỉ lệ kiểu hình đời con là:", "options": ["A. 1 : 2 : 1", "B. 1 : 1 : 1 : 1", "C. 3 : 1", "D. 9 : 7"], "answer": "B", "explain": "Cặp A: Aa × aa → 1 A- : 1 aa; cặp B: bb × Bb → 1 B- : 1 bb. Kết hợp: 1/4 A-B- : 1/4 A-bb : 1/4 aaB- : 1/4 aabb = 1:1:1:1."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Phép lai AaBb × AaBb. Tỉ lệ kiểu gene AaBb ở đời con là:", "options": ["A. 3/8", "B. 1/8", "C. 1/16", "D. 1/4"], "answer": "B", "explain": "Aa × Aa → Aa = 1/2; Bb × Bb → Bb = 1/2. AaBb = 1/2 × 1/2 = 1/4."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét phép lai phân tích:", "statements": ["a) Lai phân tích là lai với cá thể đồng hợp lặn.", "b) Dùng để xác định kiểu gene của cá thể mang KH trội.", "c) Nếu đời con đồng tính trội → KG là AA.", "d) Nếu đời con phân tính 1:1 → KG là AA."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: phân tính 1:1 → KG là Aa."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét cơ sở tế bào học của các quy luật Mendel:", "statements": ["a) Gene nằm trên NST.", "b) Các allele phân li nhờ sự phân li của NST trong giảm phân.", "c) Sự tổ hợp NST trong thụ tinh tạo biến dị tổ hợp.", "d) Mendel đã biết về NST khi làm thí nghiệm."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: thời Mendel chưa biết về NST."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Tỉ lệ kiểu hình ở F2 của phép lai hai cặp tính trạng (trội hoàn toàn, phân li độc lập) là (điền tỉ lệ)", "answer": "9 : 3 : 3 : 1", "explain": "F2: 9 A-B- : 3 A-bb : 3 aaB- : 1 aabb."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phép lai dị hợp về 4 cặp gene (phân li độc lập). Số loại kiểu gene ở đời con là", "answer": "81", "explain": "Số loại KG = 3^n = 3^4 = 81."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Mendel đã nghiên cứu bao nhiêu cặp tính trạng tương phản ở đậu Hà Lan?", "options": ["A. 7", "B. 2", "C. 7", "D. 14"], "answer": "C", "explain": "Mendel nghiên cứu 7 cặp tính trạng tương phản ở đậu Hà Lan."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Kiểu gene của cơ thể dị hợp về một cặp gene là:", "options": ["A. Aa", "B. AA", "C. Aa", "D. aa"], "answer": "C", "explain": "Dị hợp: hai allele khác nhau (Aa)."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Ở đậu Hà Lan, allele A quy định hạt vàng trội hoàn toàn so với allele a quy định hạt xanh. Cho P thuần chủng hạt vàng × hạt xanh, F1 tự thụ phấn. Tỉ lệ kiểu hình ở F2 là:", "options": ["A. 1 trội : 1 lặn", "B. 1 trội : 2 trung gian : 1 lặn", "C. 3 trội : 1 lặn", "D. 100% trội"], "answer": "C", "explain": "P: AA × aa → F1: 100% Aa (hạt vàng). F1 × F1 → F2: 1 AA : 2 Aa : 1 aa → 3 hạt vàng : 1 hạt xanh."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một cơ thể có kiểu gene dị hợp về 1 cặp gene (các gene phân li độc lập). Số loại giao tử tối đa cơ thể này tạo ra là:", "options": ["A. 2", "B. 3", "C. 2", "D. 3"], "answer": "C", "explain": "Số loại giao tử = 2^n = 2^1 = 2."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho AaBb × AaBb (mỗi gene quy định một tính trạng, trội lặn hoàn toàn). Tỉ lệ kiểu hình lặn về cả hai tính trạng ở đời con là:", "options": ["A. 3/16", "B. 9/16", "C. 1/16", "D. 1/4"], "answer": "C", "explain": "Tỉ lệ aabb = 1/4 × 1/4 = 1/16."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Phép lai dị hợp về 3 cặp gene (phân li độc lập, trội hoàn toàn). Số loại kiểu gene ở đời con là:", "options": ["A. 8", "B. 64", "C. 27", "D. 26"], "answer": "C", "explain": "Số loại KG = 3^n = 3^3 = 27."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét thí nghiệm lai một cặp tính trạng của Mendel:", "statements": ["a) Quy luật phân li: các allele phân li trong giảm phân.", "b) Mỗi giao tử chỉ chứa một allele của một cặp.", "c) F1 có kiểu gene dị hợp Aa.", "d) F2 có 2 loại kiểu hình với tỉ lệ 1 : 1."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: F2 có tỉ lệ 3:1."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét thí nghiệm lai hai cặp tính trạng của Mendel:", "statements": ["a) Quy luật phân li độc lập: các cặp allele phân li độc lập.", "b) Cơ thể AaBb tạo 4 loại giao tử với tỉ lệ bằng nhau.", "c) Số loại kiểu gene ở F2 là 9.", "d) Số loại kiểu hình ở F2 là 9."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng (3^2). d) Sai: 4 loại KH (2^2)."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Một cơ thể dị hợp về 4 cặp gene (phân li độc lập). Số loại giao tử tối đa là", "answer": "16", "explain": "Số loại giao tử = 2^n = 2^4 = 16."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Tỉ lệ kiểu gene ở F2 của phép lai một cặp tính trạng là (điền tỉ lệ)", "answer": "1 : 2 : 1", "explain": "F2: 1 AA : 2 Aa : 1 aa."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Các kiểu hình khác P xuất hiện ở F2 của lai hai cặp tính trạng gọi là:", "options": ["A. Thường biến", "B. Đột biến", "C. Biến dị tổ hợp", "D. Biến dị tổ hợp"], "answer": "D", "explain": "Biến dị tổ hợp: tổ hợp lại các tính trạng của P."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Đặc điểm hình thái, sinh lí của cơ thể được gọi là:", "options": ["A. Kiểu gene", "B. NST", "C. Tính trạng", "D. Tính trạng"], "answer": "D", "explain": "Tính trạng: màu hoa, chiều cao thân..."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Allele A quy định thân cao trội hoàn toàn so với a quy định thân thấp. Lai phân tích cây thân cao có kiểu gene Aa. Tỉ lệ kiểu hình ở đời con là:", "options": ["A. 100% thân cao", "B. 100% thân thấp", "C. 3 thân cao : 1 thân thấp", "D. 1 thân cao : 1 thân thấp"], "answer": "D", "explain": "Lai phân tích: Aa × aa → 1 Aa : 1 aa → 1 thân cao : 1 thân thấp."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một cây hoa đỏ (trội) có kiểu gene có thể là:", "options": ["A. aa", "B. AA hoặc aa", "C. AA hoặc Aa", "D. AA hoặc Aa"], "answer": "D", "explain": "KH trội có KG đồng hợp trội (AA) hoặc dị hợp (Aa)."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Phép lai Aabb × aaBb (trội hoàn toàn, phân li độc lập) cho tỉ lệ kiểu hình đời con là:", "options": ["A. 9 : 7", "B. 1 : 2 : 1", "C. 3 : 1", "D. 1 : 1 : 1 : 1"], "answer": "D", "explain": "Cặp A: Aa × aa → 1 A- : 1 aa; cặp B: bb × Bb → 1 B- : 1 bb. Kết hợp: 1/4 A-B- : 1/4 A-bb : 1/4 aaB- : 1/4 aabb = 1:1:1:1."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Phép lai AaBb × AaBb. Tỉ lệ kiểu gene AaBb ở đời con là:", "options": ["A. 1/4", "B. 3/8", "C. 1/16", "D. 1/8"], "answer": "D", "explain": "Aa × Aa → Aa = 1/2; Bb × Bb → Bb = 1/2. AaBb = 1/2 × 1/2 = 1/4."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét phép lai phân tích:", "statements": ["a) Cá thể mang KH lặn có KG đồng hợp lặn.", "b) Cá thể mang KH trội có KG AA hoặc Aa.", "c) Lai phân tích giúp phân biệt AA và Aa.", "d) Cá thể KH trội luôn có KG AA."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: có thể là Aa."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét cơ sở tế bào học của các quy luật Mendel:", "statements": ["a) Số loại giao tử của AaBb là 4.", "b) Số loại giao tử của AaBbDd là 8.", "c) Công thức số giao tử là 2^n (n cặp dị hợp).", "d) Cơ thể đồng hợp tạo nhiều loại giao tử."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: đồng hợp chỉ tạo 1 loại giao tử."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Mỗi cặp tính trạng trong F2 của phép lai hai cặp tính trạng (trội hoàn toàn) phân li theo tỉ lệ (điền tỉ lệ)", "answer": "3 : 1", "explain": "Mỗi cặp tính trạng: 3 trội : 1 lặn."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phép lai dị hợp về 5 cặp gene (phân li độc lập). Số loại kiểu gene ở đời con là", "answer": "243", "explain": "Số loại KG = 3^n = 3^5 = 243."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Ưu điểm của đậu Hà Lan trong nghiên cứu di truyền là:", "options": ["A. Tự thụ phấn nghiêm ngặt", "B. Không sinh sản", "C. Tự thụ phấn nghiêm ngặt", "D. Giao phấn tự do"], "answer": "A", "explain": "Đậu Hà Lan tự thụ phấn nghiêm ngặt → dễ tạo dòng thuần chủng."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "P: AA × aa → F1 có kiểu hình:", "options": ["A. 100% mang kiểu hình trội", "B. 1 trội : 1 lặn", "C. 100% mang kiểu hình trội", "D. 100% mang kiểu hình lặn"], "answer": "A", "explain": "F1 có KG 100% Aa → 100% KH trội."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Ở đậu Hà Lan, allele A quy định quả trơn trội hoàn toàn so với allele a quy định quả nhăn. Cho P thuần chủng quả trơn × quả nhăn, F1 tự thụ phấn. Tỉ lệ kiểu hình ở F2 là:", "options": ["A. 3 trội : 1 lặn", "B. 100% trội", "C. 1 trội : 1 lặn", "D. 1 trội : 2 trung gian : 1 lặn"], "answer": "A", "explain": "P: AA × aa → F1: 100% Aa (quả trơn). F1 × F1 → F2: 1 AA : 2 Aa : 1 aa → 3 quả trơn : 1 quả nhăn."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Một cơ thể có kiểu gene dị hợp về 2 cặp gene (các gene phân li độc lập). Số loại giao tử tối đa cơ thể này tạo ra là:", "options": ["A. 4", "B. 5", "C. 4", "D. 9"], "answer": "A", "explain": "Số loại giao tử = 2^n = 2^2 = 4."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Cho AaBb × AaBb (mỗi gene quy định một tính trạng, trội lặn hoàn toàn). Tỉ lệ kiểu hình lặn về cả hai tính trạng ở đời con là:", "options": ["A. 1/16", "B. 1/4", "C. 3/16", "D. 9/16"], "answer": "A", "explain": "Tỉ lệ aabb = 1/4 × 1/4 = 1/16."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Phép lai dị hợp về 3 cặp gene (phân li độc lập, trội hoàn toàn). Số loại kiểu gene ở đời con là:", "options": ["A. 27", "B. 26", "C. 8", "D. 64"], "answer": "A", "explain": "Số loại KG = 3^n = 3^3 = 27."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét thí nghiệm lai một cặp tính trạng của Mendel:", "statements": ["a) Allele trội biểu hiện ở cả đồng hợp và dị hợp.", "b) Allele lặn chỉ biểu hiện ở đồng hợp lặn.", "c) Kiểu hình là biểu hiện của kiểu gene.", "d) Kiểu gene Aa cho kiểu hình lặn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: Aa cho KH trội."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét thí nghiệm lai hai cặp tính trạng của Mendel:", "statements": ["a) Tỉ lệ 9:3:3:1 là biến dạng của (3:1)×(3:1).", "b) Mỗi cặp tính trạng đều phân li 3:1 ở F2.", "c) Tích các tỉ lệ riêng bằng tỉ lệ chung.", "d) Hai cặp tính trạng di truyền phụ thuộc nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: di truyền độc lập."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Một cơ thể dị hợp về 5 cặp gene (phân li độc lập). Số loại giao tử tối đa là", "answer": "32", "explain": "Số loại giao tử = 2^n = 2^5 = 32."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Tỉ lệ kiểu hình trội ở đời con của phép lai AA × aa là (điền %)", "answer": "100%", "explain": "100% Aa → 100% trội."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Phép lai AaBb × aabb cho tỉ lệ kiểu hình đời con là:", "options": ["A. 1 : 1 : 1 : 1", "B. 1 : 1 : 1 : 1", "C. 9 : 3 : 3 : 1", "D. 3 : 1"], "answer": "B", "explain": "AaBb × aabb (lai phân tích 2 cặp) → 1:1:1:1."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Hai trạng thái đối lập của cùng một tính trạng gọi là:", "options": ["A. Cặp tính trạng tương phản", "B. Cặp tính trạng tương phản", "C. Tính trạng", "D. Kiểu hình"], "answer": "B", "explain": "Ví dụ: hoa đỏ – hoa trắng là cặp tính trạng tương phản."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Allele A quy định lá to trội hoàn toàn so với a quy định lá nhỏ. Lai phân tích cây lá to có kiểu gene Aa. Tỉ lệ kiểu hình ở đời con là:", "options": ["A. 3 lá to : 1 lá nhỏ", "B. 1 lá to : 1 lá nhỏ", "C. 100% lá to", "D. 100% lá nhỏ"], "answer": "B", "explain": "Lai phân tích: Aa × aa → 1 Aa : 1 aa → 1 lá to : 1 lá nhỏ."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Lai phân tích cây hoa đỏ, đời con 100% hoa đỏ. Kết luận:", "options": ["A. Đời con đồng tính trội → KG là AA", "B. Đời con đồng tính trội → KG là AA", "C. KG là Aa", "D. KG là aa"], "answer": "B", "explain": "Nếu KG là Aa thì đời con phân tính 1:1; đồng tính trội chứng tỏ KG là AA."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Phép lai Aabb × aaBb (trội hoàn toàn, phân li độc lập) cho tỉ lệ kiểu hình đời con là:", "options": ["A. 3 : 1", "B. 1 : 1 : 1 : 1", "C. 9 : 7", "D. 1 : 2 : 1"], "answer": "B", "explain": "Cặp A: Aa × aa → 1 A- : 1 aa; cặp B: bb × Bb → 1 B- : 1 bb. Kết hợp: 1/4 A-B- : 1/4 A-bb : 1/4 aaB- : 1/4 aabb = 1:1:1:1."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Phép lai AaBb × AaBb. Tỉ lệ kiểu gene AaBb ở đời con là:", "options": ["A. 1/16", "B. 1/8", "C. 1/4", "D. 3/8"], "answer": "B", "explain": "Aa × Aa → Aa = 1/2; Bb × Bb → Bb = 1/2. AaBb = 1/2 × 1/2 = 1/4."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét phép lai phân tích:", "statements": ["a) Lai phân tích 2 cặp: AaBb × aabb → 1:1:1:1.", "b) Tỉ lệ này bằng tỉ lệ giao tử của cơ thể dị hợp.", "c) Lai phân tích phát hiện được hoán vị gene.", "d) Lai phân tích chỉ dùng cho 1 cặp gene."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: dùng cho nhiều cặp."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét cơ sở tế bào học của các quy luật Mendel:", "statements": ["a) Quy luật phân li ứng với phân li của 1 cặp NST.", "b) Quy luật phân li độc lập ứng với các cặp NST khác nhau.", "c) NST là cơ sở vật chất của di truyền.", "d) Gene nằm ngoài NST."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: gene nằm trên NST."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Tỉ lệ kiểu hình ở F2 của tương tác cộng gộp (AaBb × AaBb) là (điền tỉ lệ)", "answer": "1 : 4 : 6 : 4 : 1", "explain": "Theo số allele trội từ 0 đến 4: 1 : 4 : 6 : 4 : 1."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Phép lai dị hợp về 6 cặp gene (phân li độc lập). Số loại kiểu gene ở đời con là", "answer": "729", "explain": "Số loại KG = 3^n = 3^6 = 729."}]}]}
