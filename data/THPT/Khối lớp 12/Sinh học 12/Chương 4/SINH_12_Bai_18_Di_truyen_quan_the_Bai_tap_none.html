p = 0,7 → 2pq = 0,42."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về quần thể và vốn gene:", "statements": ["a) Mỗi quần thể có vốn gene đặc trưng.", "b) Vốn gene phản ánh đa dạng di truyền.", "c) Vốn gene nghèo → dễ tuyệt chủng.", "d) Mọi quần thể có vốn gene giống nhau."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các phát biểu về quần thể tự phối:", "statements": ["a) Giao phối cận huyết tương đương tự phối.", "b) Cận huyết tăng bệnh di truyền lặn.", "c) Nên tránh kết hôn cận huyết.", "d) Cận huyết không ảnh hưởng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Tổng tần số các allele của một gene bằng (điền số)", "answer": "1", "explain": "p + q = 1."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Quần thể cân bằng có p(A) = 0,6. Tần số kiểu gene AA là (điền số thập phân)", "answer": "0,36", "explain": "p² = 0,36."}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Quần thể giao phối tự do gọi là quần thể:", "options": ["A. Cách li", "B. Ngẫu phối", "C. Ngẫu phối", "D. Tự phối"], "answer": "B", "explain": "Ngẫu phối = giao phối tự do, ngẫu nhiên."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Tự phối ở động vật là:", "options": ["A. Ngẫu phối", "B. Giao phối cận huyết", "C. Giao phối cận huyết", "D. Giao phối xa"], "answer": "B", "explain": "Tự phối ≈ giao phối cận huyết."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Quần thể có 0,36 AA : 0,48 Aa : 0,16 aa. Nhận xét:", "options": ["A. Đang tự phối", "B. Cân bằng", "C. Cân bằng", "D. Không cân bằng"], "answer": "B", "explain": "p = 0,6; p² = 0,36; 2pq = 0,48; q² = 0,16 → cân bằng."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Điều kiện nghiệm đúng:", "options": ["A. Đột biến ít", "B. Không đột biến", "C. Không đột biến", "D. Đột biến nhiều"], "answer": "B", "explain": "Không có đột biến làm đổi tần số allele."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Quần thể cân bằng di truyền có tần số allele A là 0,8. Tần số kiểu gene AA là:", "options": ["A. 0,8", "B. 0,64", "C. 0,32", "D. 0,04"], "answer": "B", "explain": "AA = p² = 0,8² = 0,64."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Quần thể tự phối 5 thế hệ, tần số allele A:", "options": ["A. Giảm một nửa", "B. Không đổi", "C. Không đổi", "D. Tăng gấp đôi"], "answer": "B", "explain": "Tự phối không làm đổi tần số allele."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét định luật Hardy – Weinberg:", "statements": ["a) Nội dung: p² AA + 2pq Aa + q² aa = 1.", "b) Áp dụng cho quần thể ngẫu phối.", "c) Khi cân bằng, cấu trúc ổn định qua thế hệ.", "d) Áp dụng cho quần thể tự phối."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: ngẫu phối."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét ý nghĩa và ứng dụng:", "statements": ["a) Giải thích quần thể ổn định trong tự nhiên.", "b) Tính tần số người mang gene bệnh.", "c) Từ q² suy ra q rồi 2pq.", "d) Không có ứng dụng thực tiễn."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Quần thể giao phối tự do gọi là quần thể (điền tên)", "answer": "ngẫu phối", "explain": "Ngẫu phối."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Công thức Hardy – Weinberg là (điền công thức)", "answer": "p² + 2pq + q² = 1", "explain": "p² AA + 2pq Aa + q² aa = 1."}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Vốn gene là:", "options": ["A. Toàn bộ allele của mọi gene trong quần thể", "B. Mọi gene của một cá thể", "C. Toàn bộ allele của mọi gene trong quần thể", "D. Mọi NST"], "answer": "C", "explain": "Vốn gene = toàn bộ allele của quần thể tại một thời điểm."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Công thức Hardy – Weinberg:", "options": ["A. p² + 2pq + q² = 1", "B. p + q = 1", "C. p² + 2pq + q² = 1", "D. p² + q² = 1"], "answer": "C", "explain": "Khi cân bằng: p² AA + 2pq Aa + q² aa = 1."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Quần thể có 1000 cá thể: 640 AA, 320 Aa, 40 aa. Tần số allele A là:", "options": ["A. 0,9", "B. 0,7", "C. 0,8", "D. 0,6"], "answer": "C", "explain": "p(A) = 640/1000 + (320/1000)/2 = 0,8."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Tần số allele qua các thế hệ tự phối:", "options": ["A. Không đổi", "B. Tăng", "C. Không đổi", "D. Giảm"], "answer": "C", "explain": "Tự phối chỉ đổi cấu trúc KG, tần số allele không đổi."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "P: 100% Aa tự phối liên tục 5 thế hệ. Tỉ lệ kiểu gene Aa ở F5 là:", "options": ["A. 1/64", "B. 1/128", "C. 1/32", "D. 1/2"], "answer": "C", "explain": "Tỉ lệ Aa giảm một nửa mỗi thế hệ: (1/2)^5 = 1/32."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Bệnh lặn do gene a gây ra có tần số cá thể bị bệnh là 0,16. Tần số người mang gene (Aa) trong quần thể là:", "options": ["A. 0,4", "B. 0,6", "C. 0,48", "D. 0,16"], "answer": "C", "explain": "q² = 0,16 → q = 0,4; p = 0,6 → 2pq = 0,48."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về quần thể và vốn gene:", "statements": ["a) Tần số allele là tỉ lệ allele trên tổng allele của gene.", "b) Tần số kiểu gene là tỉ lệ KG trên tổng cá thể.", "c) p + q = 1 với gene 2 allele.", "d) Tần số allele tính bằng số cá thể."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: tính bằng allele."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các phát biểu về quần thể tự phối:", "statements": ["a) Tần số allele không đổi qua tự phối.", "b) Cấu trúc kiểu gene thay đổi qua tự phối.", "c) Tự phối nhiều thế hệ → dòng thuần.", "d) Tự phối làm mất allele."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: allele không mất."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Quần thể: 490 AA, 420 Aa, 90 aa (N=1000). Tần số allele A là (điền số thập phân)", "answer": "0,7", "explain": "p = 0,49 + 0,42/2 = 0,7."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Bệnh lặn có q² = 0,04. Tần số người mang gene Aa xấp xỉ (điền số thập phân)", "answer": "0,32", "explain": "q = 0,2 → 2pq = 2 × 0,8 × 0,2 = 0,32."}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Định luật về quần thể ngẫu phối do ai đề xuất (1908)?", "options": ["A. Mendel", "B. Darwin", "C. Hardy và Weinberg", "D. Hardy và Weinberg"], "answer": "D", "explain": "Hardy (Anh) và Weinberg (Đức) năm 1908."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Ngược với thoái hóa do tự phối là:", "options": ["A. Đột biến", "B. Thường biến", "C. Ưu thế lai", "D. Ưu thế lai"], "answer": "D", "explain": "Lai khác dòng → ưu thế lai; tự phối → thoái hóa."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Quần thể có 0,49 AA : 0,42 Aa : 0,09 aa. Nhận xét:", "options": ["A. Không cân bằng", "B. Tự phối", "C. Cân bằng", "D. Cân bằng"], "answer": "D", "explain": "p = 0,7; p² = 0,49; 2pq = 0,42; q² = 0,09 → cân bằng."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Về sinh sản, quần thể cân bằng cần:", "options": ["A. Tự phối", "B. Sinh sản vô tính", "C. Ngẫu phối", "D. Ngẫu phối"], "answer": "D", "explain": "Các cá thể giao phối tự do, ngẫu nhiên."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Quần thể cân bằng di truyền có tần số allele A là 0,9. Tần số kiểu gene AA là:", "options": ["A. 0,01", "B. 0,9", "C. 0,18", "D. 0,81"], "answer": "D", "explain": "AA = p² = 0,9² = 0,81."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Tần số aa là 0,01. Tần số allele a là:", "options": ["A. q = 0,01", "B. q = 0,2", "C. q = 0,1", "D. q = 0,1"], "answer": "D", "explain": "q² = 0,01 → q = 0,1."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét định luật Hardy – Weinberg:", "statements": ["a) Không có di – nhập gene.", "b) Không có yếu tố ngẫu nhiên.", "c) Trong tự nhiên khó thỏa mãn hoàn toàn.", "d) Mọi quần thể tự nhiên đều cân bằng."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét ý nghĩa và ứng dụng:", "statements": ["a) Tư vấn di truyền dựa trên tần số allele.", "b) Sàng lọc người mang gene bệnh.", "c) Dự đoán nguy cơ cho thế hệ sau.", "d) Không dùng trong y học."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Tự phối làm tăng tỉ lệ (điền: đồng hợp/dị hợp)", "answer": "đồng hợp", "explain": "Tăng đồng hợp."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Tự phối liên tục gây (điền tên hiện tượng)", "answer": "thoái hóa", "explain": "Thoái hóa giống."}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Tần số allele là:", "options": ["A. Tỉ lệ allele trên tổng allele của gene", "B. Tỉ lệ kiểu gene", "C. Tỉ lệ allele trên tổng allele của gene", "D. Số allele"], "answer": "A", "explain": "Tần số allele = số allele đó / tổng số allele của gene."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Tần số kiểu gene Aa khi cân bằng là:", "options": ["A. 2pq", "B. q²", "C. 2pq", "D. p²"], "answer": "A", "explain": "Aa = 2pq."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Quần thể có 1000 cá thể: 810 AA, 180 Aa, 10 aa. Tần số allele A là:", "options": ["A. 0,9", "B. 0,7", "C. 1,0", "D. 0,8"], "answer": "A", "explain": "p(A) = 810/1000 + (180/1000)/2 = 0,9."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Tự phối liên tục gây:", "options": ["A. Thoái hóa giống", "B. Tăng năng suất", "C. Thoái hóa giống", "D. Ưu thế lai"], "answer": "A", "explain": "Tăng đồng hợp lặn → biểu hiện tính xấu → thoái hóa."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "P: 100% Aa tự phối liên tục 6 thế hệ. Tỉ lệ kiểu gene Aa ở F6 là:", "options": ["A. 1/64", "B. 1/2", "C. 1/128", "D. 1/256"], "answer": "A", "explain": "Tỉ lệ Aa giảm một nửa mỗi thế hệ: (1/2)^6 = 1/64."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Bệnh lặn do gene a gây ra có tần số cá thể bị bệnh là 0,36. Tần số người mang gene (Aa) trong quần thể là:", "options": ["A. 0,48", "B. 0,36", "C. 0,6", "D. 0,4"], "answer": "A", "explain": "q² = 0,36 → q = 0,6; p = 0,4 → 2pq = 0,48."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét các phát biểu về quần thể và vốn gene:", "statements": ["a) Vốn gene thay đổi qua các thế hệ.", "b) Do các nhân tố tiến hóa tác động.", "c) Nghiên cứu vốn gene là nhiệm vụ di truyền quần thể.", "d) Vốn gene không bao giờ thay đổi."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: có thay đổi."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét các phát biểu về quần thể tự phối:", "statements": ["a) P: 100% Aa → F1: 1/4 AA : 1/2 Aa : 1/4 aa.", "b) F2: 3/8 AA : 1/4 Aa : 3/8 aa.", "c) Tỉ lệ Aa ở Fn là (1/2)^n.", "d) Tỉ lệ Aa tăng qua các thế hệ."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: giảm."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Toàn bộ allele của quần thể gọi là (điền tên)", "answer": "vốn gene", "explain": "Vốn gene."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "P: 100% Aa tự phối 5 thế hệ. Tỉ lệ Aa ở F5 là (điền phân số)", "answer": "1/32", "explain": "(1/2)^5 = 1/32."}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "points": 0.25, "q": "Điều kiện nghiệm đúng của định luật:", "options": ["A. Không có chọn lọc", "B. Không có chọn lọc", "C. Có chọn lọc mạnh", "D. Có đột biến"], "answer": "B", "explain": "Không đột biến, không chọn lọc, không di nhập gene..."}, {"type": "mcq", "level": "NB", "points": 0.25, "q": "Tính tần số người mang gene bệnh ứng dụng trong:", "options": ["A. Y học", "B. Y học", "C. Xây dựng", "D. Giao thông"], "answer": "B", "explain": "Di truyền y học: tư vấn, sàng lọc."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Quần thể có 1,0 Aa (100% dị hợp). Nhận xét:", "options": ["A. Không cân bằng", "B. Không cân bằng", "C. Cân bằng", "D. Ổn định"], "answer": "B", "explain": "2pq tối đa = 0,5 mà nhỏ hơn 1 → không thể cân bằng."}, {"type": "mcq", "level": "TH", "points": 0.25, "q": "Trong tự nhiên, các điều kiện trên:", "options": ["A. Khó thỏa mãn hoàn toàn", "B. Khó thỏa mãn hoàn toàn", "C. Luôn thỏa mãn", "D. Không cần"], "answer": "B", "explain": "Nên quần thể tự nhiên luôn biến đổi."}, {"type": "mcq", "level": "VD", "points": 0.25, "q": "Quần thể cân bằng di truyền có tần số allele A là 0,4. Tần số kiểu gene AA là:", "options": ["A. 0,48", "B. 0,16", "C. 0,36", "D. 0,4"], "answer": "B", "explain": "AA = p² = 0,4² = 0,16."}, {"type": "mcq", "level": "VDC", "points": 0.25, "q": "Để duy trì đa dạng di truyền nên:", "options": ["A. Cần ngẫu phối", "B. Cần ngẫu phối", "C. Tự phối", "D. Cách li"], "answer": "B", "explain": "Ngẫu phối duy trì dị hợp, đa dạng."}, {"type": "truefalse", "level": "NB", "points": 1, "q": "Xét định luật Hardy – Weinberg:", "statements": ["a) Định luật do Hardy và Weinberg đề xuất.", "b) Năm 1908.", "c) Là cơ sở của di truyền quần thể.", "d) Do Mendel đề xuất."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai."}, {"type": "truefalse", "level": "TH", "points": 1, "q": "Xét ý nghĩa và ứng dụng:", "statements": ["a) Là nền tảng của thuyết tiến hóa hiện đại.", "b) Mô tả trạng thái không tiến hóa.", "c) Làm chuẩn để phát hiện tiến hóa.", "d) Mâu thuẫn với tiến hóa."], "answer": ["T", "T", "T", "F"], "explain": "a) Đúng. b) Đúng. c) Đúng. d) Sai: là chuẩn so sánh."}, {"type": "short", "level": "VD", "points": 0.5, "q": "Tần số allele qua tự phối (điền: đổi/không đổi)", "answer": "không đổi", "explain": "Không đổi."}, {"type": "short", "level": "VDC", "points": 0.5, "q": "Quần thể cân bằng cần kích thước (điền: lớn/nhỏ)", "answer": "lớn", "explain": "Kích thước lớn."}]}]}
