e khi điện phân $\\mathrm{AgNO_3}$."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $E^\\circ_{pin\\ Cr-Ag} = 1,54$ V.", "b) Kim loại X ($5,9$ gam, $I = 1$ A, $19300$ s, $n = 2$) là Ni.", "c) $E^\\circ_{pin} = E^\\circ_{cathode} - E^\\circ_{anode}$.", "d) Điện phân là quá trình tự xảy ra."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: điện phân là quá trình CƯỠNG BỨC.", "points": 1}, {"type": "short", "level": "VD", "q": "Tính $E^\\circ_{pin}$ của pin $\\mathrm{Pb - Ag}$ ($-0,13$ V; $+0,80$ V). (đơn vị V)", "answer": "0,93", "explain": "$0,80 - (-0,13) = 0,93$ V.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điện phân dung dịch $\\mathrm{SnCl_2}$ ($I = 1$ A) trong $9650$ s. Khối lượng Sn thu được là bao nhiêu gam? ($A_{Sn} = 119$)", "answer": "5,95", "explain": "$m = 119 \\times 9650/(2 \\times 96500) = 5,95$ gam.", "points": 0.5}]}, {"name": "Đề 6", "questions": [{"type": "mcq", "level": "NB", "q": "Acquy khi phóng điện đóng vai trò:", "options": ["A. nguồn điện", "B. bình điện phân", "C. dây dẫn", "D. cầu muối"], "answer": "A", "explain": "Phóng điện: acquy là nguồn điện; nạp: là bình điện phân.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Acquy khi nạp điện đóng vai trò:", "options": ["A. bình điện phân", "B. nguồn điện", "C. dây dẫn", "D. cầu muối"], "answer": "A", "explain": "Nạp (sạc): acquy là bình điện phân.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Mạ vàng lên vật kim loại, vật cần mạ là:", "options": ["A. cathode", "B. anode", "C. dung dịch", "D. nguồn điện"], "answer": "A", "explain": "Vật cần mạ là cathode để ion kim loại bị khử bám lên.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Tinh luyện Cu, anode làm bằng:", "options": ["A. Cu thô", "B. Cu tinh khiết", "C. graphite", "D. Pt"], "answer": "A", "explain": "Anode tan làm bằng Cu thô (chứa tạp chất).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Điện phân $\\mathrm{AgNO_3}$ ($I = 1$ A, $t = 19300$ s). Khối lượng Ag thu được là:", "options": ["A. $21,6$ gam", "B. $10,8$ gam", "C. $43,2$ gam", "D. $5,4$ gam"], "answer": "A", "explain": "$m = 108 \\times 19300/96500 = 21,6$ gam.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Cho $E^\\circ_{X^{2+}/X} = -1,18$ V (Mn); $E^\\circ_{Y^{2+}/Y} = -0,44$ V (Fe). Pin X-Y có $E^\\circ_{pin}$ là:", "options": ["A. $0,74$ V", "B. $1,62$ V", "C. $-0,74$ V", "D. $0,44$ V"], "answer": "A", "explain": "$-0,44 - (-1,18) = 0,74$ V.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Acquy phóng điện là nguồn điện.", "b) Acquy nạp điện là bình điện phân.", "c) Vật cần mạ là cathode.", "d) Anode khi tinh luyện Cu là Cu thô."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Điện phân $\\mathrm{AgNO_3}$ ($I = 1$ A, $19300$ s) cho $21,6$ gam Ag.", "b) $E^\\circ_{pin\\ Mn-Fe} = 0,74$ V.", "c) Mạ điện là ứng dụng của điện phân.", "d) Pin là ứng dụng của điện phân."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: pin KHÔNG phải ứng dụng của điện phân.", "points": 1}, {"type": "short", "level": "VD", "q": "Tính $E^\\circ_{pin}$ của pin $\\mathrm{Ni - Ag}$ ($-0,25$ V; $+0,80$ V). (đơn vị V)", "answer": "1,05", "explain": "$0,80 - (-0,25) = 1,05$ V.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điện phân nóng chảy $m$ gam $\\mathrm{Al_2O_3}$ thu được $2,7$ gam Al. Giá trị của $m$ là bao nhiêu? ($M = 102$)", "answer": "5,1", "explain": "$n_{Al} = 0,1$ mol → $n_{oxit} = 0,05$ mol → $m = 5,1$ gam.", "points": 0.5}]}, {"name": "Đề 7", "questions": [{"type": "mcq", "level": "NB", "q": "Kim loại đẩy được $\\mathrm{H_2}$ khỏi dung dịch HCl là kim loại có:", "options": ["A. $E^\\circ \\lt 0$", "B. $E^\\circ \\gt 0$", "C. $E^\\circ = 0$", "D. $E^\\circ$ lớn nhất"], "answer": "A", "explain": "Kim loại có $E^\\circ \\lt 0$ (đứng trước H) đẩy được $\\mathrm{H_2}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Cầu muối có vai trò:", "options": ["A. nối hai dung dịch, cân bằng điện tích", "B. dẫn electron", "C. ngăn dòng điện", "D. tạo khí"], "answer": "A", "explain": "Cầu muối duy trì trung hòa điện giữa hai nửa pin.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kim loại nào tan trong HCl?", "options": ["A. Mg", "B. Cu", "C. Ag", "D. Au"], "answer": "A", "explain": "Mg ($E^\\circ = -2,37$ V $\\lt 0$) tan cho $\\mathrm{H_2}$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Kim loại nào KHÔNG tan trong HCl?", "options": ["A. Ag", "B. Fe", "C. Zn", "D. Al"], "answer": "A", "explain": "Ag ($E^\\circ = +0,80$ V $\\gt 0$) không tan.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sức điện động chuẩn của pin $\\mathrm{Zn - H_2}$ là:", "options": ["A. $0,76$ V", "B. $-0,76$ V", "C. $1,52$ V", "D. $0,38$ V"], "answer": "A", "explain": "$0,00 - (-0,76) = 0,76$ V.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điện phân dung dịch $\\mathrm{CuSO_4}$ đến khi thu được $1,12$ lít $\\mathrm{O_2}$ (đktc) ở anode. Khối lượng Cu ở cathode là:", "options": ["A. $6,4$ gam", "B. $3,2$ gam", "C. $12,8$ gam", "D. $1,6$ gam"], "answer": "A", "explain": "$n_{\\mathrm{O_2}} = 0,05$ mol → $n_e = 0,2$ mol → $n_{Cu} = 0,1$ mol → $m = 6,4$ gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Kim loại $E^\\circ \\lt 0$ đẩy được $\\mathrm{H_2}$.", "b) Cầu muối cân bằng điện tích.", "c) Mg tan trong HCl.", "d) Ag tan trong HCl."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: Ag KHÔNG tan trong HCl.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $E^\\circ_{pin\\ Zn-H_2} = 0,76$ V.", "b) Anode thoát $1,12$ lít $\\mathrm{O_2}$ thì cathode có $6,4$ gam Cu.", "c) $E^\\circ$ càng âm, tính khử càng mạnh.", "d) Điện phân là quá trình tự xảy ra."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: điện phân là quá trình CƯỠNG BỨC.", "points": 1}, {"type": "short", "level": "VD", "q": "Tính $E^\\\\circ_{pin}$ của pin $\\\\mathrm{Zn - Cu}$ ($E^\\\\circ_{Zn^{2+}/Zn} = -0,76$ V; $E^\\\\circ_{Cu^{2+}/Cu} = +0,34$ V). (đơn vị V)", "answer": "1,10", "explain": "$E^\\\\circ_{pin} = E^\\\\circ_{catot} - E^\\\\circ_{anot} = 0,34 - (-0,76) = 1,10$ V.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điện phân dung dịch $\\mathrm{ZnCl_2}$ ($I = 2$ A) trong $4825$ s. Khối lượng Zn thu được là bao nhiêu gam? ($A_{Zn} = 65$)", "answer": "3,25", "explain": "$m = 65 \\times 2 \\times 4825/(2 \\times 96500) = 3,25$ gam.", "points": 0.5}]}, {"name": "Đề 8", "questions": [{"type": "mcq", "level": "NB", "q": "Phản ứng trong pin là phản ứng:", "options": ["A. tự xảy ra", "B. cưỡng bức", "C. cần điện năng", "D. thu nhiệt mạnh"], "answer": "A", "explain": "Pin hoạt động nhờ phản ứng oxi hóa – khử tự xảy ra.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Phản ứng trong bình điện phân là phản ứng:", "options": ["A. cưỡng bức (cần điện năng)", "B. tự xảy ra", "C. không cần năng lượng", "D. trung hòa"], "answer": "A", "explain": "Điện phân cần cung cấp điện năng.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung của anode trong pin và trong điện phân là:", "options": ["A. đều xảy ra oxi hóa", "B. đều xảy ra khử", "C. đều là cực (+)", "D. đều là cực (−)"], "answer": "A", "explain": "Anode luôn xảy ra oxi hóa (khác dấu điện cực).", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điểm chung của cathode trong pin và trong điện phân là:", "options": ["A. đều xảy ra khử", "B. đều xảy ra oxi hóa", "C. đều là cực (+)", "D. đều là cực (−)"], "answer": "A", "explain": "Cathode luôn xảy ra khử (khác dấu điện cực).", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Cho $E^\\circ_{Ni^{2+}/Ni} = -0,25$ V; $E^\\circ_{Ag^+/Ag} = +0,80$ V. $E^\\circ_{pin\\ Ni-Ag}$ là:", "options": ["A. $1,05$ V", "B. $0,55$ V", "C. $-1,05$ V", "D. $1,85$ V"], "answer": "A", "explain": "$0,80 - (-0,25) = 1,05$ V.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điện phân nóng chảy $m$ gam $\\mathrm{KCl}$ ($M = 74,5$) thu được $2,24$ lít $\\mathrm{Cl_2}$ (đktc). Giá trị của $m$ là:", "options": ["A. $14,9$ gam", "B. $7,45$ gam", "C. $29,8$ gam", "D. $3,725$ gam"], "answer": "A", "explain": "$n_{\\mathrm{Cl_2}} = 0,1$ mol → $n_{KCl} = 0,2$ mol → $m = 14,9$ gam.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Phản ứng trong pin tự xảy ra.", "b) Phản ứng điện phân cần điện năng.", "c) Anode luôn xảy ra oxi hóa.", "d) Cathode luôn xảy ra khử."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $E^\\circ_{pin\\ Ni-Ag} = 1,05$ V.", "b) $14,9$ gam KCl điện phân nóng chảy cho $2,24$ lít $\\mathrm{Cl_2}$ (đktc).", "c) Trong pin, anode là cực âm.", "d) Trong điện phân, anode là cực âm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: trong ĐIỆN PHÂN, anode là cực DƯƠNG.", "points": 1}, {"type": "short", "level": "VD", "q": "Tính $E^\\circ_{pin}$ của pin $\\mathrm{Co - Cu}$ ($-0,28$ V; $+0,34$ V). (đơn vị V)", "answer": "0,62", "explain": "$0,34 - (-0,28) = 0,62$ V.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điện phân dung dịch $\\mathrm{Pb(NO_3)_2}$ ($I = 2$ A) trong $9650$ s. Khối lượng Pb thu được là bao nhiêu gam? ($A_{Pb} = 207$)", "answer": "20,7", "explain": "$m = 207 \\times 2 \\times 9650/(2 \\times 96500) = 20,7$ gam.", "points": 0.5}]}, {"name": "Đề 9", "questions": [{"type": "mcq", "level": "NB", "q": "Tổng hợp chương 5: công thức tính $E^\\circ_{pin}$ là:", "options": ["A. $E^\\circ_{cathode} - E^\\circ_{anode}$", "B. $E^\\circ_{anode} - E^\\circ_{cathode}$", "C. $E^\\circ_{cathode} + E^\\circ_{anode}$", "D. $E^\\circ_{anode} + E^\\circ_{cathode}$"], "answer": "A", "explain": "$E^\\circ_{pin} = E^\\circ_{cathode} - E^\\circ_{anode}$.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Công thức Faraday là:", "options": ["A. $m = AIt/nF$", "B. $m = nF/AIt$", "C. $E = mc^2$", "D. $pV = nRT$"], "answer": "A", "explain": "$m = AIt/nF$.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Sắp xếp tính khử tăng dần: Fe ($-0,44$ V), Zn ($-0,76$ V), Al ($-1,66$ V):", "options": ["A. Fe, Zn, Al", "B. Al, Zn, Fe", "C. Zn, Fe, Al", "D. Fe, Al, Zn"], "answer": "A", "explain": "$E^\\circ$ càng âm → tính khử càng mạnh: Al $\\gt$ Zn $\\gt$ Fe.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điện phân dung dịch $\\mathrm{CuSO_4}$ với anode bằng Cu (anode tan), nồng độ dung dịch:", "options": ["A. không đổi", "B. tăng dần", "C. giảm dần", "D. bằng 0"], "answer": "A", "explain": "Anode tan bù đúng lượng $\\mathrm{Cu^{2+}}$ bị khử → nồng độ không đổi.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sức điện động chuẩn của pin $\\mathrm{Fe - H_2}$ là:", "options": ["A. $0,44$ V", "B. $-0,44$ V", "C. $0,88$ V", "D. $0,22$ V"], "answer": "A", "explain": "$0,00 - (-0,44) = 0,44$ V.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điện phân dung dịch $\\mathrm{HCl}$ ($I = 1$ A) trong $19300$ s. Thể tích $\\mathrm{H_2}$ (đktc) ở cathode là:", "options": ["A. $2,24$ lít", "B. $4,48$ lít", "C. $1,12$ lít", "D. $11,2$ lít"], "answer": "A", "explain": "$n_e = 0,2$ mol → $n_{\\mathrm{H_2}} = 0,1$ mol → $V = 2,24$ lít.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp chương 5):", "statements": ["a) $E^\\circ_{pin} = E^\\circ_{cathode} - E^\\circ_{anode}$.", "b) $m = AIt/nF$.", "c) Tính khử: Al $\\gt$ Zn $\\gt$ Fe.", "d) Anode tan giữ nồng độ dung dịch không đổi."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) $E^\\circ_{pin\\ Fe-H_2} = 0,44$ V.", "b) Điện phân HCl ($I = 1$ A, $19300$ s) cho $2,24$ lít $\\mathrm{H_2}$ (đktc).", "c) $E^\\circ$ càng dương, tính oxi hóa càng mạnh.", "d) Cathode trong pin là cực âm."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: cathode trong PIN là cực DƯƠNG.", "points": 1}, {"type": "short", "level": "VD", "q": "Tính $E^\\circ_{pin}$ của pin $\\mathrm{Zn - Sn}$ ($-0,76$ V; $-0,14$ V). (đơn vị V)", "answer": "0,62", "explain": "$-0,14 - (-0,76) = 0,62$ V.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Cần thời gian bao lâu để mạ $5,4$ gam Ag ($I = 1$ A)? ($A_{Ag} = 108$)", "answer": "4825", "explain": "$t = 5,4 \\times 96500/108 = 4825$ s.", "points": 0.5}]}, {"name": "Đề 10", "questions": [{"type": "mcq", "level": "NB", "q": "Ôn tập chương 5: pin hoạt động dựa trên:", "options": ["A. phản ứng oxi hóa – khử tự xảy ra", "B. dòng điện một chiều", "C. phản ứng trung hòa", "D. sự hòa tan"], "answer": "A", "explain": "Pin hoạt động nhờ phản ứng oxi hóa – khử tự xảy ra.", "points": 0.25}, {"type": "mcq", "level": "NB", "q": "Điện phân hoạt động dựa trên:", "options": ["A. dòng điện một chiều cưỡng bức phản ứng", "B. phản ứng tự xảy ra", "C. phản ứng trung hòa", "D. sự kết tinh"], "answer": "A", "explain": "Điện phân dùng dòng điện một chiều thực hiện phản ứng không tự xảy ra.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Cho các kim loại: K ($-2,93$ V), Na ($-2,71$ V), Al ($-1,66$ V). Kim loại có tính khử mạnh nhất là:", "options": ["A. K", "B. Na", "C. Al", "D. cả ba bằng nhau"], "answer": "A", "explain": "K có $E^\\circ$ âm nhất → tính khử mạnh nhất.", "points": 0.25}, {"type": "mcq", "level": "TH", "q": "Điện phân dung dịch $\\mathrm{Na_2SO_4}$, sản phẩm là:", "options": ["A. $\\mathrm{H_2}$ và $\\mathrm{O_2}$", "B. Na và $\\mathrm{O_2}$", "C. Na và S", "D. $\\mathrm{H_2}$ và S"], "answer": "A", "explain": "Điện phân nước.", "points": 0.25}, {"type": "mcq", "level": "VD", "q": "Sức điện động chuẩn lớn nhất trong các pin: Zn-Cu ($1,10$ V), Mg-Ag ($3,17$ V), Fe-Cu ($0,78$ V) là:", "options": ["A. Mg-Ag", "B. Zn-Cu", "C. Fe-Cu", "D. cả ba bằng nhau"], "answer": "A", "explain": "$3,17$ V lớn nhất.", "points": 0.25}, {"type": "mcq", "level": "VDC", "q": "Điện phân dung dịch $\\mathrm{CuSO_4}$ ($I = 2$ A). Để thu được $19,2$ gam Cu cần thời gian:", "options": ["A. $28950$ s", "B. $19300$ s", "C. $9650$ s", "D. $57900$ s"], "answer": "A", "explain": "$n_e = 0,6$ mol → $t = 0,6 \\times 96500/2 = 28950$ s.", "points": 0.25}, {"type": "truefalse", "level": "NB", "q": "Xét tính đúng, sai của các khẳng định sau (tổng hợp chương 5):", "statements": ["a) Pin dựa trên phản ứng tự xảy ra.", "b) Điện phân cần dòng điện một chiều.", "c) K có tính khử mạnh nhất trong K, Na, Al.", "d) Điện phân $\\mathrm{Na_2SO_4}$ cho $\\mathrm{H_2}$ và $\\mathrm{O_2}$."], "answer": ["T", "T", "T", "T"], "explain": "Cả 4 khẳng định đều đúng.", "points": 1}, {"type": "truefalse", "level": "TH", "q": "Xét tính đúng, sai của các khẳng định sau:", "statements": ["a) Pin Mg-Ag có $E^\\circ_{pin}$ lớn nhất ($3,17$ V).", "b) Thu $19,2$ gam Cu ($I = 2$ A) cần $28950$ s.", "c) Anode luôn xảy ra oxi hóa.", "d) Trong pin, electron chạy từ cathode sang anode."], "answer": ["T", "T", "T", "F"], "explain": "a), b), c) Đúng. d) Sai: electron chạy từ ANODE sang cathode.", "points": 1}, {"type": "short", "level": "VD", "q": "Tính $E^\\circ_{pin}$ của pin $\\mathrm{Al - Cu}$ ($-1,66$ V; $+0,34$ V). (đơn vị V)", "answer": "2", "explain": "$0,34 - (-1,66) = 2,00$ V.", "points": 0.5}, {"type": "short", "level": "VDC", "q": "Điện phân nóng chảy $5,85$ gam NaCl. Thể tích $\\mathrm{Cl_2}$ (đktc) thu được là bao nhiêu lít?", "answer": "1,12", "explain": "$n_{NaCl} = 0,1$ mol
